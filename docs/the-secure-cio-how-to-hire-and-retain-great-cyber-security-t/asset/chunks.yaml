- fmt: '

    People have diverse needs. Everyone works slightly differently, and depending
    on the seniority of the new employee, you may have to alter your approach in their
    first few weeks with your organisation. But despite the diversity of needs, when
    it comes to security, the following is universal in organisations where a security
    leader is a new addition, and can also inform the process when they are to lead
    an established security function. Every one of the ideas below is an opportunity
    to spread the security word, support your new leader, and open them up to assess
    different areas of the organisation. One of the main traits found among security
    professionals is their curious nature and sense of security when meeting new people
    and hearing about how different departments and products work together. Some of
    the below might seem obvious, while others might spark an idea.


    ### 1. Set the tone

    The way this leader enters the business could set the tone for their relationship
    with you and the organisation. Giving them an hour of your time on their first
    day to reiterate your support, introduce them, set up some meetings, and get the
    ball rolling is essential. This might seem obvious, but not all leaders operate
    in this way. Others see the first few weeks as a time for inhaling security and
    business literature, getting through induction (see number 5) and settling in.
    These are all important, but don’t detract from that first day, when certainty
    and confidence can’t be overdone. Whenever the tone was set on day one, I would
    re-read those day-one notes time and again – the first few pages of my notebook
    in a new role have proven so valuable. Having said that, it depends on whom you
    hire and what they need. Consider their needs, or ask them if they want to settle
    or to dive in. I’ve had bosses on both sides of this argument. While my preference
    is not to be left to own devices, find out how your leader wants their few days
    to play out.


    ### 2. Introduce them

    Again, this might seem basic, but as the boss of a security leader, this is your
    first opportunity to show your support for this person and what they are for.
    By all means ask them to write a blurb about themselves, but introduction has
    dual purpose in also reminding your workforce about security. Most people like
    to read about the new person, but if you can use their arrival to increase knowledge
    or remind staff of its importance – in a light-hearted, culturally appropriate
    manner – take advantage of this situation. In addition to written communications,
    take the new person to meetings and send them to head office/locations to meet
    people. Introducing them lets the organisation know the security leader is there,
    and that they have a key role to play.


    ### 3. Cup-of-tea

    Given that assistants are an endangered species, this might mean to set up a few
    coffee meetings with stakeholders. Do not include any description; it needs only
    a few key people to kickstart important relationships. It might be worth selecting
    some yourself, but also find out who the executive team wants to proactively meet
    the new leader. You may be surprised at who comes forward keen to share their
    insights and needs. The new leader can, of course, do this for themselves, but
    if you begin the process it is yet another opportunity for you to promote the
    security program.


    ### 4. Buddy/mentor

    There are many variables that may make this either troublesome or redundant, but
    it’s worth mentioning. Depending on the size and age of the organisation, having
    someone who can answer questions for the new leader is helpful – someone who may
    have been around for a while or has seen change in the organisation can brief
    the leader when they need information. Too much information from one source can
    be skewed. Also, if it’s a start-up, it might be a small team/environment where
    anyone can service questions. There are too many variables to discuss here, but
    it’s worth having someone on hand to answer day-to-day inquiries when you are
    not available. This need might be covered when you brief them on the agenda (see
    chapter 17), which could be sufficient information for the leader to start with.


    ### 5. Onboarding

    Onboarding, or induction, is often forgotten when a new employee is quite senior.
    The onboarding process tells me a lot about an organisation and what it sees as
    paramount for new staff to know. Things such as ‘Is security/privacy covered,
    and to what extent?’ are gold for a new security leader, especially if one of
    the `big rocks` in the agenda is employee awareness. Don’t discount the value
    of their attendance at induction/onboarding days; they see where security might
    fit.


    ### 6. Continued support

    See every opportunity to promote the security leader and their program. Support
    doesn’t come only in the form of `1:1s`, decisions, and budget. Support also needs
    to be visible to the rest of the organisation throughout projects, incidents,
    and when addressing boards and risk committees.


    #### Key takeaway

    If security is new to your organisation, it’s impossible to set and forget and
    still expect good outcomes and retention from this leader. Security roles are
    a hard slog, and they need support from you and all stakeholders to keep the program
    afloat. Take every opportunity you can to involve yourself from day one in visible
    support for the leader and what they are doing to contribute to the organisation
    and protect your customers.


    ### 17 Update

    ‘Make visible what might perhaps never have been seen without you.’ — Robert Bresson,
    French film director


    Chapters 17 and 18 go hand in hand. Updating the new security leader on the agenda
    and setting your expectations are integral to their success. In previous chapters
    we talked about the importance of the agenda and how working through the notes
    taken and establishing the three main areas of focus (`big rocks`) are important
    for the leader.


    Chances are that they will have their own ideas based on where they came from
    and where they want their experience to take them. And this is fine. The agenda
    is a great starting point for them to understand what the leaders think, and upon
    which to build their strategy. But since the agenda was written, leaders might
    have changed and directions altered, so the new leader will need to be briefed
    not only on the agenda but on any changes, big and small, since the agenda was
    agreed.


    In one organisation I worked with, between the agenda being finalised and the
    new leader starting, there was a significant change not only in the `c-suite`
    but in the next level of management too. A new position of `chief operating officer`
    was created, new executive leaders were hired for departments such as customer
    service, engineering, employee experience, and the legal team all experienced
    changes. With this comes direction changes and strategic reviews as the new leaders
    settle in. This shouldn’t change the `big rocks` as such, but it’s worth understanding
    those who have exited and the influence they might have had on the agenda. For
    example, a `big rock` might have been locking down security with third parties
    through contracts. If you don’t have access to lawyers to review contracts, one
    of your `big rocks` might become less achievable in the short term. Similarly,
    if one of your `big rocks` is application security, and the head of engineering
    or development and operations changes, they will want to understand their workforce
    and systems before agreeing to security-related changes. Changes in the `c-suite`
    will affect not only the agenda but perhaps your role as `CIO`, something to be
    aware of if your new security leader arrives amidst significant organisational
    change.

