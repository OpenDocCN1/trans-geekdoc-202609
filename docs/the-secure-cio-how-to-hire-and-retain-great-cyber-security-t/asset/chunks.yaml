    that cannot be eliminated but can be effectively managed. This is definitely a
    cyber page-turner!” – Rachael Falk, Cyber Security Adviser, Pace & Scale Pty Ltd


    “From the very moment we connected with Claire, we knew she was the perfect fit
    to guide us in our cyber security journey. Aside from being an experienced, well
    respected and extremely passionate Information Security professional, Claire understands
    what makes individuals and organisations tick. Claire’s ability to combine technical
    expertise allows her to gain insights and deliver value sooner.” – John Finnan,
    Head of Payment at MYOB


    “There can be no doubt that this connected world presents some of the most challenging
    risks and brilliant opportunities. Securing an organisation so that its cyber
    security settings are appropriate is an issue that confronts all organisations-
    both big and small. The second biggest challenge in cyber security is how to find
    the right cyber security professional. She has helped me through many crises.”
    – Jacqui Loustau, Founder, Australian Women in Security


    ### Contents


    Introduction

    The five-step framework for effective hiring

    The Dilemma


    #### Section 1 – Clarity: Establishing your Agenda

    1. The state of the industry

    2. What is your why?

    3. Security maturity

    4. What others are saying, Part 1

    5. Aligning to business strategy


    #### Section 2 – Compass: What’s your destination?

    6. Where to?

    7. What skills and outcomes are non-negotiable?

    8. Let’s get real – the job description


    #### Section 3 – Connection: How to hire?

    9. To recruiter or not to recruiter?

    10. Candidate review

    11. Surround yourself with supporters

    12. Are you allowing for stretch?

    13. What others are saying, Part 2


    #### Section 4 – Commitment: Are you ready?

    14. The tour of duty

    15. The expectation gap


    #### Section 5 – Coaching: Don’t leave them high and dry

    16. Welcome

    17. Update

    18. What is coaching? (It’s not about screaming from the sidelines)

    19. What does the candidate need?

    20. Addressing the stretch

    21. Where to here? A word on measurement

    22. It’s never a ‘wrap’


    Valuable references/links

    Acknowledgements


    ### Introduction


    ‘In the cyber security industry, we have zero unemployment and the demand is massive.’
    Craig Davies, CEO, Australian Security Growth Network


    As a nation, we are not on top of the threat of cyber-attack. And we are not the
    only ones globally to face an uncertain future when it comes to protecting our
    businesses in the digital age. Recent newsworthy events have proven we are ill-equipped
    and underprepared for the onslaught of cyber events and incidents that impact
    our organisations daily.


    In the past year, business lost more than $20 million due simply to virus emails,
    a 230% increase on the $8.6 million lost in the 2016–17 financial year. Australian
    businesses are looking to prevent future cyberattacks similar to the recent WannaCry
    and Petya ransomware viruses, which locked computer systems and demanded a ransom
    before files would be unlocked. No organisation is immune – even companies trusted
    with guarding our nation’s biggest secrets, such as the Australian Signals Directorate,
    were caught up in the 47,000 local cybercrime incidents identified by the Australian
    Cyber Security Centre in the past year, which comprised everything from data breaches
    to state-sponsored hacking.


    If you’re reading this, there’s a good chance your board, audit and risk committees,
    or chief executive, has read of the above activity and is starting to ask questions.
    There’s a good chance you’ve been tasked with doing something about the cyber
    threat that your organisation has identified as a result of the heightened global
    awareness. And usually part of doing something involves employing a dedicated
    security leader to protect your organisation and appease your board with confidence
    and certainty when it comes to cyber security.

