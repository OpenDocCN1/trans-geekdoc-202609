    If this is where you are at, you’re in luck. There are some incredible security
    leaders in the world who are passionate, driven, and focused individuals who maintain
    high integrity no matter whose apple cart they upset. But, they won’t take on
    just any job or help just any organisation, and because of the current threat
    landscape, they are choosy about how their expertise is utilised. Their skills
    are highly sought after, competition is fierce, and salaries (especially in Australia)
    are on the rise in order to attract the best.


    So, how to do you find and retain these security warriors? This book addresses
    this question. It’s about digging deep, planning ahead, and maybe taking a chance
    on someone who doesn’t have it all but may have a lot of what your organisation
    needs. If no one had taken a chance on me, I wouldn’t be writing this book now.


    When I started out in the late 1990s, cyber security was not on my professional
    radar. Two years after leaving university, with my career drive and purpose at
    full speed, I met the head of corporate security at `Telstra` and asked her out
    for coffee. Six months later I was working for her, and I spent the next few years
    giving court evidence for the police and government agencies on behalf of `Telstra`
    across the country, from regional courthouses to the federal court.


    I worked hard, took loads of advice, studied further, and raised my profile as
    I became more and more passionate about working in this space. After more than
    15 years in the industry, I now work for myself. I’ve built teams, led award-winning
    strategies, and helped protect organisations in Asia and Australia from cyber-attack.
    My years as a leader in cyber and information security have brought me to today,
    sharing my experience and passion for helping businesses institute exceptional
    security practices and establish in-house security leadership.


    # Who is this book for?


    The `Secure CIO` is written for chief information officers (`CIOs`) who have cyber
    or information security staff reporting to them, or would like to.


    Despite more c-level roles becoming available in security, most security leaders
    and various other security roles still report to the `CIO`. The cyber security
    job market is increasingly difficult for hiring managers and candidates to navigate.
    Many roles sit vacant for months, which causes more stress for `CIOs`, on top
    of their mounting workload, and increases the risk to the organisation. Finding
    and retaining the right security staff gives `CIOs` a level of certainty that
    cannot otherwise be assured. To have an in-house expert and leader assessing and
    addressing cyber risk before (and after) it materialises can change the direction
    of a business for the better.


    # Why did I write this book?


    The `Secure CIO` meets the demand for advice and reassurance about the effective
    hiring of leaders to address cyber security risk.


    Research by the Australian Information Security Association shows that the perceived
    cyber security skills shortage in Australia is fuelled by management’s lack of
    understanding of the risks.


    This book is structured first to provide insights to you, the `CIO`, about common
    mistakes made when hiring cyber security leaders. This is followed by a five-step
    framework, from setting your agenda to finding that strategic employee who meets
    the needs of the organisation. It responds to the key problems of how to attract
    quality candidates, concern about the expertise needed to assess a candidate’s
    security skills, and how to reduce board and stakeholder pressure to address cyber
    risk.


    # The problem


    In my research, it was often noted by `CIOs` that the directive to recruit a security
    leader was based on a desire to combat the global security threats. Boards, audit
    and risk committees, chief executives, and sometimes previous `CIOs` often requested
    this new leadership position without understanding what skills were required,
    the company’s security position, and how to find good security staff who would
    stay.


    What prevents `CIOs` from hiring and retaining the cyber security talent their
    organisation needs? Common problems include:


    *   Failing to identify what is needed before handing the hiring to a human resources
    manager or recruiter

    *   Basing the job description on what the organisation wants, not what it needs

    *   Seeking a candidate who can perform more than the role of one person

    *   Job descriptions that are written by people who aren’t familiar with what
    securing the organisation would entail and which are not linked to the business
    strategy

    *   Pressure from the board and other stakeholders for `CIOs` to address cyber
    risk so they can appease shareholders and customers


    Once the job is advertised, further issues arise:


    *   The ad does not attract quality, qualified candidates

    *   The candidate may have the right cultural fit but the interviewer is unsure
    of his or her technical skills

    *   Expectations of the candidates are unclear

    *   Candidates are strong in some areas but have no skill in others


    # The five-step framework for effective hiring


    How do we overcome this long list of issues? The following framework will help
    you set appropriate expectations for the role and then assess candidates’ skills:


    1.  **Clarity – establish your agenda**: What is the state of security in your
    organisation from your perspective and that of your stakeholders, and how does
    that affect the person you hire?

    2.  **Compass – what direction do you want the role to take?**: Based on your
    agenda, what are your expectations of this person and what skills does your organisation
    need?

    3.  **Connection – how to hire**: From the initial search through to the interview
    stage and offering a candidate the role.

    4.  **Commitment – committing to a candidate**: Once the candidate has accepted
    your offer, what support do they need?

    5.  **Coaching – settling your new staff member into the organisation**: When
    your recruit starts, brief them on the agenda, reiterate expectations and set
    goals. Provide coaching and mentoring support for a smoother transition to the
    role.

