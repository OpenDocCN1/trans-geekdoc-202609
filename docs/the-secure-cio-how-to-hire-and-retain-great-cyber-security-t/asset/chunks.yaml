    ### Coaching: Don’t leave them dry


    This section explains what I mean by "wearing the T-shirt". It is about the embodying
    of the values in people’s actions being what was key. No matter the T-shirt’s
    detail, the embodying of the values in people’s actions was what was key.


    I loved this, because it was simple for anyone at any level of the hierarchy to
    gain the basic company T-shirt (and then the special shirts, by being involved
    beyond their immediate job). The expression `wearing the T-shirt` could be said
    and everyone knew the expected.


    So, when your new security leader arrives, be sure you’re ready to `wear the security
    T-shirt`.


    ### 16


    Welcome


    ‘There are no strangers here, only friends you haven’t yet met.’


    William Butler Yeats, Irish poet


    In chapter 12 I raised the fact that just by reporting for duty, the new security
    manager begins to change the face of security for your organisation. This is true,
    and it is literally the beginning.

