    \ shows that action has and will be taken immediately to begin addressing the\
    \ security risk. While waiting for a new security leader to arrive, conducting\
    \ interviews and gathering information have already started the conversation within\
    \ the organisation. Stakeholders will know change is coming and that they are\
    \ contributing to that change. Facts uncovered may lead to work that can be carried\
    \ out immediately by a technical staff member or contractor. Life can go on while\
    \ recruitment takes place, and any progress towards a more secure organisation\
    \ can be reported to the board/committee until the new leader arrives. And when\
    \ they do arrive, regular, engaging strategic updates to the board and executive\
    \ are key. This way, when incidents happen unexpectedly, the board is already\
    \ aware of the head of information security and the progress made towards improving\
    \ security.\n\nKey takeaway\n\nThe agenda provides a set of relevant facts regarding\
    \ the security status of the organisation. While it is not a strategy, audit,\
    \ or risk assessment, it pulls together details for the new leader to review.\
    \ Understanding what the big rocks are, and what led to their identification,\
    \ helps give the new leader some context and provides them with a strategic starting\
    \ point.\n\n### \n\n4\n\nWhat others are saying, Part 1\n\n‘It is wiser to find\
    \ out than to suppose.’\n\nMark Twain, writer and entrepreneur\n\nOne of the main\
    \ activities that will boil your agenda down to the big rocks is establishing\
    \ how your leadership team (and other key stakeholders) see security within your\
    \ organisation. This isn’t simply chatting with them over coffee about their general\
    \ thoughts. This is asking each of them pertinent questions to establish themes\
    \ and inconsistencies of thought. These discussions/interviews take place with\
    \ the executive leaders and with staff. Such staff may include, but not be limited\
    \ to, consultants, contractors, and permanent employees who are the custodians\
    \ of systems, data, and information relevant to security threats and risks.\n\n\
    The questions you ask will differ from organisation to organisation and depend\
    \ on your ‘security maturity’. The questions help to identify where the major\
    \ gaps are and where you will gain the most support. For example, if the CEO doesn’t\
    \ see cyber as a risk but all the other leaders do, the troops you need to rally\
    \ will be very different from the HR department or the developers.\n\nAs CIO,\
    \ you have a lot of leverage, and you likely have quite specialised relationships\
    \ with the leadership team. This can work for and against you when asking these\
    \ questions. You may need to set some parameters before the conversation starts\
    \ to ensure there is open, honest feedback. Or you could simply ask someone else\
    \ who is more impartial to ask the questions on your behalf.\n\nEither way, you\
    \ want raw, specific data that helps to establish what your focus should be and\
    \ what sort of security leader will be needed now and in the near future. I say\
    \ ‘near’ because the security leader you need today is very different from the\
    \ one you’ll need in two years’ time, because cyber changes quickly. And in two\
    \ years’ time, a lot of what will keep your leader busy will look different to\
    \ when they arrived, especially if they begin their life with your organisation\
    \ as the sole security operator. (More on that later.)\n\nHere are some questions\
    \ you might want to consider. They are in no particular order and only you can\
    \ decide if they are relevant or whether you need to ask something different to\
    \ identify the ‘big rocks’.\n\n*   What do you believe a head of information security\
    \ or a chief information security officer would be responsible for?"
