    I recently asked a friend, whom I’ll call David, about his experience with a CIO
    supporting him to address the stretch. David’s time in the security industry was
    in utilities in the mid-2000s, and during a period of extensive IT transformation,
    an interim CIO was brought in to recruit the permanent CIO and implement the new
    IT organisational structure. One of those roles was the head of information security.


    At the time, David was a business analyst, working four layers down from the CIO
    in the IT department. He was in his mid-twenties and had a Master’s degree in
    Information Systems. He was passionate about being involved in this IT transformation.


    David met regularly with the interim CIO to advise him on work completed by the
    transformation team. In one meeting, the CIO asked David for his views on information
    security, disaster recovery, and business continuity planning. A few days later
    he was appointed head of information security, with responsibility for disaster
    recovery and business continuity planning. He was to start immediately and report
    directly to the CIO. Overnight, David had been elevated three levels and was accountable
    for domains, of which he had no experience. Risky, right?


    Over the ensuing months, the acting CIO mentored David into the role. He was given
    freedom and encouraged to make big decisions. The support was simple, but powerful,
    and David embraced the opportunity he had been given. David’s view was constantly
    being challenged until the CIO was comfortable with the decisions being made.
    He was also allowed to make some mistakes, as long as he demonstrated he had learnt
    from them.


    Taking a chance on a leader is an amazing gesture, but it also involves a lot
    of hard work in terms of coaching and mentoring. In David’s case, the CIO gave
    him the autonomy he needed to make mistakes and grow, and provided enough guidance
    and support to minimise those mistakes over time.


    Unfortunately, in some cases, people are appointed with the best of intentions
    but circumstances change. For example, recently, a CIO I spoke with had internally
    appointed a security leader, moving an infrastructure leader to the security role
    with plans to support him in his transition. He had been with the organisation
    a long time, had the respect of management, and in the eyes of the CIO, could
    handle the new responsibility. He was not her first choice, as he lacked a strong
    security background, but she was willing to mentor him and support his needs in
    addressing the stretch.


    Due to unforeseen circumstances, the CIO left the organisation a few months later,
    so she was no longer there to mentor the leader in his new role. How the organisation
    managed this would be crucial to the security function, and to how security was
    perceived within IT and the broader business. The CIO’s exit could not have been
    predicted. Therefore, it’s vital that the CIO ensure that the head of information
    security has the support of other executives and can seek the support of the incoming
    CIO to ensure the ongoing protection of the organisation.


    ## Key takeaway


    Addressing the stretch in your new security leader’s skill set can be a rewarding
    and rich experience for both of you. Even if your new leader doesn’t require extensive
    support or improvement, your committed backing will go a long way to retaining
    their talent. If they come into the role with a large amount of room for growth,
    be sure they are a willing participant in their upskilling. This is key to the
    evolution of a well-rounded leader and the success of the security function.


    ### 21


    ## Where to from here?


    ### A word on measurement


    ‘If you can’t measure it, you can’t improve it.’ — Peter F. Drucker


    If you can’t measure it, you can’t improve it. It has been said that you get what
    you measure. This is certainly true.


    How the organisation managed this would be crucial to the security function, and
    to how security was perceived within IT and the broader business. The CIO’s exit
    could not have been predicted. Therefore, it’s vital that the CIO ensure that
    the head of information security has the support of other executives and can seek
    the support of the incoming CIO to ensure the ongoing protection of the organisation.


    What are the expectations for the new leader? According to LinkedIn’s 2016 global
    trends report, the quality of hired is a priority for 40% of companies and 45%
    of smaller ones.


    There are a number of other things to consider when measuring success. Asking
    yourself the following questions, in no particular order, can help to establish
    some of the measures above:

