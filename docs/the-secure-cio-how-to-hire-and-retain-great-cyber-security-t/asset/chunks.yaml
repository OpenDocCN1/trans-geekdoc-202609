    \ a CIO supporting him to address the stretch. David’s time in the security industry\
    \ was in utilities in the mid-2000s, and during a period of extensive IT transformation,\
    \ an interim CIO was brought in to recruit the permanent CIO and implement the\
    \ new IT organisational structure. One of those roles was the head of information\
    \ security.\n\nAt the time, David was a business analyst, working four layers\
    \ down from the CIO in the IT department. He was in his mid-twenties and had a\
    \ Master’s degree in Information Systems. He was passionate about being involved\
    \ in this IT transformation.\n\nDavid met regularly with the interim CIO to advise\
    \ him on work completed by the transformation team. In one meeting, the CIO asked\
    \ David for his views on information security, disaster recovery, and business\
    \ continuity planning. A few days later he was appointed head of information security,\
    \ with responsibility for disaster recovery and business continuity planning.\
    \ He was to start immediately and report directly to the CIO. Overnight, David\
    \ had been elevated three levels and was accountable for domains, of which he\
    \ had no experience. Risky, right?\n\nOver the ensuing months, the acting CIO\
    \ mentored David into the role. He was given freedom and encouraged to make big\
    \ decisions. The support was simple, but powerful, and David embraced the opportunity\
    \ he had been given. David’s view was constantly being challenged until the CIO\
    \ was comfortable with the decisions being made. He was also allowed to make some\
    \ mistakes, as long as he demonstrated he had learnt from them.\n\nTaking a chance\
    \ on a leader is an amazing gesture, but it also involves a lot of hard work in\
    \ terms of coaching and mentoring. In David’s case, the CIO gave him the autonomy\
    \ he needed to make mistakes and grow, and provided enough guidance and support\
    \ to minimise those mistakes over time.\n\nUnfortunately, in some cases, people\
    \ are appointed with the best of intentions but circumstances change. For example,\
    \ recently, a CIO I spoke with had internally appointed a security leader, moving\
    \ an infrastructure leader to the security role with plans to support him in his\
    \ transition. He had been with the organisation a long time, had the respect of\
    \ management, and in the eyes of the CIO, could handle the new responsibility.\
    \ He was not her first choice, as he lacked a strong security background, but\
    \ she was willing to mentor him and support his needs in addressing the stretch.\n\
    \nDue to unforeseen circumstances, the CIO left the organisation a few months\
    \ later, so she was no longer there to mentor the leader in his new role. How\
    \ the organisation managed this would be crucial to the security function, and\
    \ to how security was perceived within IT and the broader business. The CIO’s\
    \ exit could not have been predicted. Therefore, it’s vital that the CIO ensure\
    \ that the head of information security has the support of other executives and\
    \ can seek the support of the incoming CIO to ensure the ongoing protection of\
    \ the organisation.\n\nKey takeaway\n\nAddressing the stretch in your new security\
    \ leader’s skill set can be a rewarding and rich experience for both of you. Even\
    \ if your new leader doesn’t require extensive support or improvement, your committed\
    \ backing will go a long way to retaining their talent. If they come into the\
    \ role with a large amount of room for growth, be sure they are a willing participant\
    \ in their upskilling. This is key to the evolution of a well-rounded leader and\
    \ the success of the security function.\n\n### \n\n21\n\nWhere to from here? \
    \ \n\nA word on measurement\n\n‘If you can’t measure it, you can’t improve it.’\n\
    \nPeter F. Drucker, author\n\nIt’s been said that you get what you measure. This\
    \ is certainly true of security, and even more so, one hopes, true of your new\
    \ employee. Thinking about how all the hard work you have put into hiring, establishing\
    \ the agenda, and setting your expectations can be proved a success is one of\
    \ the most important parts of establishing your new security leader.\n\nAccording\
    \ to LinkedIn’s 2016 global trends report, the quality of the person hired is\
    \ a priority for 40% of large companies and 45% of smaller ones.[25](#naxka53o.html#f3k28cv1jc2)\
    \ But how many of these businesses actually measure the quality of their new employee?\
    \ Traditionally, security roles were considered difficult to evaluate based on\
    \ the measurements you might assume appropriate, measurements such as zero breaches,\
    \ or zero data lost, or zero security incidents. But incidents, breaches, and\
    \ data loss cannot be completely controlled. Don’t confuse measuring your leader\
    \ with measuring the program. Measuring whether your hire has met your expectations\
    \ can be based on your agenda, what you want the leader to achieve against broader\
    \ business key performance indicators, and how they might be progressing in addressing\
    \ the stretch.\n\nBasic measurement can be achieved with the following guidelines:\n\
    \n*   Be specific. If you want them to deliver the agenda objectives within six\
    \ months, ensure they can break this down into achievable chunks, with clear numbers\
    \ and/or expectations agreed.\n\n*   Create realistic deadlines based on what\
    \ can be achieved considering other staff activities, those who might need to\
    \ help, and funding. For example, if your aim is to implement automated secure\
    \ code testing, this can be a large investment and involve tendering or negotiating\
    \ with vendors, training all developers, writing secure code guidelines, and socialising\
    \ the changes that might affect delivery frameworks. This is a huge task that\
    \ may not be achievable within a short deadline if the leader is working alone.\
    \ (See the next point about being realistic.)\n\n*   Be realistic. Set goals that\
    \ can be achieved with stretch targets on top, if that will help the leader grow\
    \ (and the stretch remains realistic).\n\n*   Be clear. Write the measurements/goals\
    \ so that an outsider reading it would be clear about exactly what is expected\
    \ and why.\n\n*   Evaluate the what, why, and how of the leader. If they achieve\
    \ everything you set for them in the first six months, but they do it with aggression\
    \ or struggle, then it’s not necessarily successful against your non-negotiables,\
    \ culture fit, or objectives for this leader.\n\n*   Listen to the leader’s suggestions\
    \ on how they can be measured, and incorporate these ideas.\n\nThere are a number\
    \ of other things to consider when measuring success. Asking yourself the following\
    \ questions, in no particular order, can help to establish some of the measures\
    \ above:\n\n1.  Who is judging the success?\n\n2.  Returning to your plans from\
    \ chapter 2, what were you planning to achieve by hiring this leader in the short\
    \ to medium term?\n\n3.  Should the employee be part of setting the assessment\
    \ criteria as well?\n\n4.  What is your minimum expectation of delivery?\n\n5.\
    \  When will you know it’s been a success?\n\n6.  What are others saying about\
    \ the new hire and the progress they see?\n\n7.  What role will you play in the\
    \ success of the new employee?\n\n8.  What will you do if the new hire doesn’t\
    \ meet your expectations?\n\n9.  What other resources might be available to you\
    \ to address any concerns?"
