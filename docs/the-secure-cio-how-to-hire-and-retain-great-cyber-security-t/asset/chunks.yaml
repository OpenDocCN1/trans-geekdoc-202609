    *   Your new leader can’t be all things to all people. It’s become apparent from
    security job ads that most security people are required to be a jack of all trades.
    Compliance people need also to be security people. Or the fraud guy must double
    as the information security leader. Or the head of information security must also
    analyse the security event logs. Businesses often mistakenly seek one person to
    solve all of their security problems. It seems like common sense to point out
    that one person can’t fill the roles of many, but with many of the jobs advertised
    today, it seems that is the expectation.


    *   They don’t need security vendor introductions for at least the first six months.
    Salespeople are great at what they do, but chances are the security leader won’t
    know enough about the network and the business operations to add value to a discussion.
    Furthermore, most security leaders would prefer to contact vendors when they need
    them, based on the strategy they deliver.


    *   They don’t need to take ownership of activities or outcomes that should be
    managed by the business. I mentioned this above, about audit, but there are also
    tasks that businesses sometimes wrongly look to cyber security to own; for example,
    third-party vendor engagement. The security team is responsible for providing
    a list of requirements that third parties must meet to logically or physically
    connect with your network. Security doesn’t need to own the risk or the final
    decision on whether to engage with the vendor. Legal, IT, compliance, and finance
    can all play a part in signing off or advising on the risks involved with a particular
    vendor. If the business takes all the advice and wants to accept the risk, that
    may be fine by the security team. Consider the real owner of risk-reduction processes
    before assigning cyber/information security staff to own them.


    This list, as with all others in this book, is by no means exhaustive.


    ## Key takeaway


    A new security leader will need more than day-to-day support from you. They need
    to feel confident that their purpose is clear, that they have been budgeted and
    planned for, and that their input will be valued.


    ***


