- fmt: '

    ### 3. Leadership

    It may seem strange to call out leadership as a skill that a leader needs, but
    beyond people leadership, information security leaders need to be able to demonstrate
    taking charge, problem solving and inspiring teams and boards to make change and
    embrace new ways of working. Not all leaders are created equal and someone who
    has led before isn’t automatically the right leader for your organisation.


    ### 4. Connections/networks

    Networking is a skill that not only helps in connecting to the security community,
    it shows willingness to engage peers and stakeholders in new conversations. Networking
    promotes the leader and your business, connects the organisation with other brilliant
    talent and highlights potential partnerships.


    ### 5. Technical know-how

    Gone are the days of professionals suggesting that they are ‘not technical’ (I
    was once guilty of this). In this digital economy, every business leader including
    those in security must have the know-how to speak to technical staff in the organisation
    to understand and achieve the organizational strategy. This doesn’t mean finding
    a leader who can code with your best developers. But it does mean they understand
    how technology impacts the broader business objectives.


    ### 6. Resilience

    Embodying the above traits every day can be exhausting for many – but there are
    certainly candidates out there that take this in their stride. Leading a security
    team or function requires the ability to react quickly and wisely to security
    events and rapid business growth. This, like integrity, will need to be established
    early in the hiring process.


    ### 7. Gravitas

    Security has been known to be a dry, compliance-driven topic (hard to believe,
    I know). Candidates with gravitas deliver information with just the right amount
    of seriousness and commitment to command respect. Gravitas is not only important
    when addressing senior leaders and the board, but is key in delivering advice
    during projects, negotiating with third parties and in incident response.


    A great information security leader will be vital in times of disaster, during
    business growth and in day-to-day operations. Hiring based on the above qualities
    will stand you in good stead for the breadth of outcomes they may be charged to
    deliver. Are you looking for these attributes in your next information security
    leader?


    ***


    13 Heather Ricciuto, ‘Representation of Woman in Cybersecurity Remains Stagnant,
    Despite Recent Efforts to Balance the Scales’, Security Intelligence, IBM, 15
    March 2017,


    [https://securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnant-despite-recent-efforts-to-balance-the-scales/](https://securityintelligence.com/representation-of-women-in-cybersecurity-remains-stagnantdespite-recent-efforts-to-balance-the-scales/).


    13 Heather Ricciuto, ‘Representation of Woman in Cybersecurity Remains Stagnant,
    Despite Recent Efforts to Balance the Scales’, Security Intelligence, IBM, 15
    March 2017,


    *   A female. (Females are becoming more sought after for several reasons: Women
    tend to take a different approach to their roles/teams/jobs; are needed in the
    security industry; are seen to fulfil diversity needs; and, as their numbers grow,
    can begin to change a patriarchal culture, if that’s the impact you seek.) A mere
    11% of cyber security professionals are women,13 allegedly because their higher
    education tends to be in non-technical areas, lack of awareness of the jobs available,
    discrimination, and slow social advancement. Women, of course, should be hired
    because they are the right person for the role, not merely because of their gender.
    But due to these reasons detailed by global research, fewer women are attracted
    to the industry.


    ### 8. Let’s get real – the true job description


    > ‘If NASA was focusing on looking for skilled moon walkers, we never would have
    found people to go to the moon.’

    > Anonymous


    Have you ever read through a job description and wondered what is it they really
    want? Job descriptions (`JDs`) are notoriously broad. In some ways, this is needed
    to cover the spectrum of what might come across a person’s desk on any given day,
    right? But a `JD` that’s too broad can do a number of things:


    1. Turn away candidates who can’t fulfil every item on the list

    2. Deter candidates who don’t want to execute every/any item on the list

    3. Discourage candidates who feel that any job description that broad must not
    be well thought through

    4. Invite candidates who can do one of the items on the list and plan to wing
    the other 49

    5. Dissuade qualified candidates, because it’s not clear what the key responsibilities
    are


    It may seem that bringing in more candidates is a positive thing. But, in reality,
    it creates time-sucking résumé review and doesn’t benefit anyone. `JDs` are not
    the place to build in stretch targets. And yet, security `JDs` are some of the
    stretchiest I have seen.


    The following list of skills/experience is taken from an actual security job description
    for a single role:


    *   Must have prior experience building a security operations centre

    *   Responsible for strategic direction of information security within the organisation
    across two countries

    *   Responsible for ensuring compliance with internal and external information
    security requirements and standards, e.g., information security policy, `ISO27001`
    principles, and relevant accreditation requirements, e.g., `IRAP`

    *   Policy and framework development

    *   Program administration and delivery

    *   Compliance

    *   Incident response activities

    *   Client surveillance audits

    *   Due diligence questionnaires /`RFPs`

    *   Strong operational security background

    *   Strong program management – ideally within a vendor or consulting environment

    *   Experience in environments which require strong internal stakeholder management


    There is no mention of a team in the `JD` so the candidates reading this would
    assume this is autonomous, and that most of this work would be carried out by
    them. A `JD` seeking staff who have run a security operations centre, had strategic
    experience, worked within a vendor or big four, written policies and responded
    to `RFPs` (requests for proposal), and ensured compliance to international standards
    – will this really all be required within the next two years? Or is the priority
    the security operations centre, with a view to grooming this leader to become
    a strategic player?


    Side note: Coaching and mentorship to groom for leadership are greatly needed
    in the security industry. Recent surveys globally show that professionals are
    crying out for opportunities which offer professional growth.


    When thinking about `JDs`, consider the shorter term and be realistic. Get some
    advice on writing a great `JD` if you’re unsure, so you know you will appeal to
    the type of security leader you need.


    #### A word about women


    As mentioned at the start of this chapter, in 2017, about 11% of people in cyber
    security roles are women,[14](#sbh9shsl.html#f3k28cv1jb7) depending on which study
    you read. There is strong concern within the industry – and backed by the research
    below – that this stems from women believing they cannot achieve all the items
    in a job ad, so they don’t apply.


    ‘According to reports, including the commonly cited internal Hewlett-Packard study,
    the women working at HP only applied for promotions when they met 100% of the
    qualifications listed in the job posting, as opposed to men, who would apply if
    they met 60%. It’s been deduced that the lack of women in upper management was
    due to a lack of confidence among women. However, a [more] recent study was conducted
    based on the findings at HP, and outlined in an article for Harvard Business Review:
    digging deeper into the confidence gap phenomenon. Over a thousand professional
    men and women were surveyed and asked, “If you decided not to apply for a job
    because you didn’t meet all the qualifications, why didn’t you apply?”

