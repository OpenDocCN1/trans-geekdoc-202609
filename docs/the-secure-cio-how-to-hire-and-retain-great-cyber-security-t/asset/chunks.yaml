    人们的需求各不相同。每个人的工作方式略有不同，取决于新员工的资历，你可能需要在他们加入组织的前几周内调整你的方法。但尽管需求具有多样性，在涉及安全时，当安全负责人是新加入者时，以下内容在组织中是通用的；当他们领导一个成熟的安全职能时，也可以为流程提供参考。以下列出的每一个想法都是传播安全理念、支持你的新领导并让他们开始评估组织不同领域的机会。安全专业人员的一个主要特质是他们好奇的天性，以及在结识新朋友和听取不同部门及产品如何协作时感到的安全感。以下某些内容可能看起来显而易见，而另一些则可能会激发灵感。


    ### 1. 设定基调

    这位领导进入业务的方式可以设定他们与你以及组织关系的基调。在他们入职的第一天，花一小时时间重申你的支持、向他们介绍、安排一些会议并启动工作是至关重要的。这看起来似乎是显而易见的，但并非所有领导都这样做。另一些人将前几周视为汲取安全和业务文献、完成入职培训（参见第
    5 点）并适应环境的时间。这些都很重要，但不要削弱第一天的重要性——在那一天，确定性和信心再多越好。每当第一天设定好基调后，我都会反复重读那些第一天的笔记——在新职位中，我笔记本上的前几页被证明非常有价值。尽管如此，这取决于你雇佣了谁以及他们需要什么。考虑他们的需求，或者问问他们是想先稳一稳还是直接投入工作。我遇到过这种争论中两种立场的领导。虽然我个人倾向于不被放之自偏，但要弄清楚你的领导希望这几天该如何度过。


    ### 2. 介绍他们

    同样，这可能看起来很基础，但作为安全负责者的老板，这是你展示对这个人及其职能支持的首次机会。要可以，请尽一切方法要求他们写一段关于自己的简介，但介绍工作具有双重目的，同时也提醒了你的员工要关注安全。大多数人喜欢读读关于新人的信息，但如果你能利用他们的到来来增加知识或提醒员工安全的重要性——以一种轻松、符合文化的方式——请利用这种机会。除了书面沟通外，带新同事参加会议，并让他们去总部/办事处会见其他人。介绍他们让组织知道安全负责人已经到位，并且他们扮演着关键角色。


    ### 3. 咖啡交流

    鉴于助理已经是稀有物种，这可能意味着与利益相关者安排几次咖啡会议。不要包含任何描述；只需要几个关键人物就能启动重要的关系。自己挑选一些人可能是值得的，但也要找出执行团队想主动会见新领导的人。你可能会对那些急于分享他们的见解和需求的人感到惊讶。当然，新领导可以自己这样做，但由你开启这个过程，将是你推广安全计划的另一个机会。


    ### 4. 伙伴/导师

    有许多变量可能使这变得棘手或多余，但值得提及。根据组织的规模和资历，找一个能为新领导解答疑问的人是有帮助的——一个可能在公司待了一久或见过组织变化的人，可以在领导需要信息时向其进行简报。来自单一来源的过多信息可能会产生偏差。此外，如果是初创公司，可能是一个小型团队/环境，任何人都可以回答问题。这里讨论的变量太多，但在你不在时，身边有一个人回答日常咨询是值得的。这种需求可以在你向他们简报议程（参见第
    17 章）时涵盖，这些信息对于领导来说可能已经足够。


    ### 5. 入职培训

    当新员工资历很深时，入职（induction）往往会被忽视。入职流程告诉了我许多关于组织的信息，以及它认为新员工必须了解的重点。诸如“安全/隐私是否被涵盖？到什么程度？”等问题对于新安全负责人来说是金子，尤其是当议程中的`big
    rocks`之一是员工意识时。不要低估他们参加入职培训日的价值；他们能看到安全可能的定位。


    ### 6. 持续支持

    利用每一个推广安全负责人及其计划的机会。支持不仅以`1:1`面谈、决策和预算的形式出现。支持还需要在整个项目、事件处理以及面对董事会和风险委员会期间对组织的其他部分保持可见。


    #### 核心收获

    如果安全对你的组织来说是全新的，那么在设定后就置之不管是不指望这位领导带来良好的结果和留任。安全工作是一项艰苦的工作，他们需要你以及所有利益相关者的支持才能维持计划运行。尽一切可能，从第一天起就参与进来，为领导提供可见的支持，并支持他们为组织贡献以及保护你的客户所做的一切。


    ### 17 更新

    “让那些没有你可能永远无法被看到的东西可见。”罗伯特·布列松，法国电影导演


    第 17 章和第 18 章是密不可分的。向新安全负责人更新议程并设定你的预期对他们的成功至关重要。在之前的章节中，我们讨论了议程的重要性，以及通过回顾笔记和建立三个主要关注领域（`big
    rocks`）对领导有多么重要。


    很有可能他们会根据自己的背景以及他们希望经验将他们带向何方而有自己的想法。这没关系。议程是他们理解领导想法的绝佳起点，并可以据此构建策略。但自议程撰写以来，领导可能已经换，方向也可能发生了改变，因此新领导不仅需要了解议程简报，还需要了解自议程确定以来任何大小的变化。


    在我工作过的一家组织中，在议程确定到新领导入职期间，不仅高层发生了重大变化，下一级管理层也是如此。新增了首席运营官（COO）职位，客户服务、工程、员工体验和法律部门都聘请了新的执行领导。随着新领导的适应，随之而来的是方向的改变和战略审查。这本身不会改变
    `big rocks`，但了解那些离开的人以及他们可能对议程产生过的影响是值得的。例如，一个 `big rock` 可能是通过合同锁定第三方的安全。如果你没有律师可以审阅合同，你们的
    `big rocks` 之一可能在短期内变得更难实现。同样，如果你们的 `big rocks` 之一是应用安全，而工程或开发与运营负责人发生了变动，他们将在同意安全变更之前想要了解自己的员工和系统。


