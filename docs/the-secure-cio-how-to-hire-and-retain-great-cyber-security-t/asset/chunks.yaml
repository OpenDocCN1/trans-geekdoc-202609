  raw: "There are many great recruiters out there who have security roles to fill\
    \ because they are on a panel with an employer and are contracted to fill any\
    \ position that employer requires. This can be frustrating to recruiters who specialise\
    \ in security because they can’t provide their expertise to these organisations\
    \ as they are not part of the panel process. Furthermore, if a panel recruiter\
    \ cannot fill the role, the CIO often independently heads out to market, which\
    \ is usually just as problematic if they haven’t first had the hard conversations\
    \ and put in the groundwork recommended in this book.\n\nThere is significant\
    \ value in your legwork, preparing for what the future security of the organisation\
    \ will look like and therefore what type of leader you need. If you can do this\
    \ preparation and conduct the recruitment in house with your HR team to support\
    \ you, this is a good option. However, if you are considering using third-party\
    \ recruiters, there are some key things to keep in mind.\n\n*   Look for a recruiter\
    \ who is aware the state of the security market. They can give a realistic view\
    \ about your potential for hiring sooner rather than later.\n\n*   Target a recruiter\
    \ who attends security events and understands the security challenges facing organisations.\n\
    \n*   Find a recruiter you enjoy speaking to. You need open dialogue and trust\
    \ to find a stellar candidate. This comes only with being open to honest conversations\
    \ and not cringing when the phone rings. Recruiters are sales people, so their\
    \ ways will be different to yours, but building a strong relationship is of great\
    \ value.\n\nGeneral cons to using a recruiter:\n\n*   They are not you (of course).\
    \ You know in your mind exactly what you want, because you have done the hard\
    \ thinking, planning, and legwork, so handing that over to someone else will always\
    \ come with risks.\n\n*   You (or someone you trust) still needs to spend time\
    \ interviewing and meeting candidates. This is costing your or your employee’s\
    \ productivity, which would have been used anyway, without the third-party recruiter.\
    \ Every hour you spend reading CVs and interviewing adds to the cost of recruitment,\
    \ because if you place one of their people, you pay the recruiter for that privilege.\n\
    \n*   There are very few true security recruiters who are passionate about the\
    \ subject and the professionals involved, which may lead to shortlists of people\
    \ who are not your ideal candidate.\n\n*   They can’t measure culture. They are\
    \ not working in the environment every day to know exactly the type of candidate\
    \ that will ‘fly’ within your organisation. This means potentially meeting more\
    \ candidates than you had planned. (As a side note, this could also be a pro,\
    \ as the more you meet, the better feel you will get for the security skills that\
    \ fit best.)\n\nIf you have to use one, I recommend finding security-specific\
    \ recruiters who can deal directly with you or with your human resource consultants.\
    \ This isn’t always possible, so, if you are planning – or forced by company policy\
    \ – to use a panel recruitment company, go back and read section 2 again to be\
    \ clear on your job description and objectives. This will help you to be doubly\
    \ clear on what you want to achieve in the next one to two years, what experience\
    \ or skills are negotiable, and ensure you have a clear job description. These\
    \ steps will lead to a clearer job ad and more useful conversations with other\
    \ potential candidates whom you might meet at networking events or through your\
    \ contacts. (More on that in chapter 11.)\n\nResources:\n\nHere are a few dedicated\
    \ cyber security recruiters in Australia:\n\n*   CyberSecPeople [https://www.cybersecpeople.com](https://www.cybersecpeople.com)\n\
    \n*   Decipher Bureau [https://www.decipherbureau.com](https://www.decipherbureau.com)\n\
    \n*   Q1 Recruitment [https://q1group.com.au](https://q1group.com.au)\n\nKey takeaway\n\
    \nIf you must use a recruiter, try to find a skilled cyber security recruiter.\
    \ Do your homework and plan for the process with a clear direction and job description.\
    \ See section 2 for more information.\n\n### \n\n10\n\nCandidate review\n\n‘I\
    \ would rather interview 50 people and  \n\nnot hire anyone than hire the wrong\
    \ person.’\n\nJeff Bezos, CEO of Amazon\n\nThis book is not here to tell you how\
    \ to do your job. If you have been successfully recruiting IT leaders and professionals\
    \ for years, you might think this chapter won’t have value for you, but I encourage\
    \ you to read it anyway.\n\nEarly in my career, my employer sent me on a course\
    \ called Network Engineering for Non-network Engineers. As you might imagine from\
    \ its catchy title, the course explained a complex communications network to those\
    \ like me who were responsible for talking about it to the public. Recalling this\
    \ course years later reminds me that even somewhat alien subject matter can be\
    \ valuable to those from another area of business or industry. This is also true\
    \ when it comes to some of the amazing ‘security people’ I have met through my\
    \ career. I am using quote marks because, in many cases, calling them security\
    \ people isn’t a complete truth. \n\nMany admired security leaders are appointed,\
    \ asked, or ‘voluntold’ into security roles based on anything but their technical\
    \ security skills, and via some pretty unusual paths. Despite lacking hands-on\
    \ security experience, these souls were chosen for qualities that can’t be trained,\
    \ such as their integrity, their inherent leadership skills, and their clear understanding\
    \ of right from wrong. Many security people are also chosen because they are great\
    \ communicators, team builders, or can rally the troops when hard times hit. History\
    \ has shown that filling security roles with unlikely candidates has brought into\
    \ the industry cross-functional role models with an understanding of business-related\
    \ risk – experience that some lifelong security professionals never acquire.\n\
    \nMy point is that when considering security leaders, chances are the CVs you\
    \ see will come from varied backgrounds. I know well-respected security leaders\
    \ who cut their teeth in HR, audit, the police force, armed services, risk, technology,\
    \ PR, or academia. Their more recent experience is what you are most focused on,\
    \ given the pace of security these days, but consider their background as a bonus\
    \ in terms of your agenda. Some leaders bring unique skills and experience, and\
    \ should not be discounted because they did not take a traditional computer science\
    \ path.\n\nThis can also be important in reviewing candidates, because you may\
    \ not see all the CVs that come in. Depending on how you recruit, another person\
    \ tasked with CV review may be screening out ‘unsuitable’ applicants. This may\
    \ be a recruiter, a human resources manager, one of your direct reports, another\
    \ security staff member, or a third-party consultant who vets the CVs for you.\n\
    \nThe vetting process is also something to consider. If you have created a great\
    \ job description, have briefed the reviewer on your priorities, and trust their\
    \ judgement, you’re halfway there. This process will certainly save you time if\
    \ you find the shortlist hits the mark. If the CVs you see look like the best\
    \ of a bad bunch, it might be worth doing some spot-checking or taking a deeper\
    \ look at the rejection list. This quality assurance could make or break your\
    \ recruitment process. However, your preparation and trust in the process should\
    \ yield a good shortlist.\n\nAlternatively, you may receive no shortlist at all.\
    \ This is not necessarily a bad thing if none of the candidates come close to\
    \ meeting your non-negotiables. However, I would be surprised if you found no\
    \ one worth interviewing, because people on paper are often very different face\
    \ to face. Trusting only a CV could mean missing out on a good candidate who hasn’t\
    \ sold their skills the way you expect.\n\nA note on CVs"
