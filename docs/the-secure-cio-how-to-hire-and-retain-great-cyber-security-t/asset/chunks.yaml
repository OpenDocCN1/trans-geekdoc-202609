    \ Employees Stay’, Harvard Business Review, July 1973 issue,  \n\n### \n\n14\n\
    \nThe tour of duty\n\n‘Plan your work for today and every day,  \n\nthen work\
    \ your plan.’\n\nMargaret Thatcher, former UK Prime Minister\n\nWe all know of\
    \ people who take on a new role with a plan a mind. They know from day one what\
    \ their 30-, 60-, and 90-day goals are. Or ‘the first 100 days’. There are also\
    \ planners who consider a limited tenure. I’m generalising, as everyone is slightly\
    \ different. But, in essence, people either know what they want and how long they\
    \ plan to allow to achieve it or they go into roles with blind faith that the\
    \ journey will take them where it takes them.\n\nFor those with a plan of big\
    \ goals and limited tenure, this is often their own boundary to set, but it can\
    \ work well for the candidate and the organisation. I have a couple of examples.\n\
    \nExample 1:\n\nA friend assumed a role as a consultant leading a team as an interim\
    \ executive. The business loved her, and before long, they were asking her to\
    \ stay. She politely declined, every other day for a month, until she went to\
    \ the chief executive and suggested she would stay, but on the following terms:\
    \ She would remain a consultant, but only for two years, and in that time she\
    \ planned to execute X, Y, and Z. With this proposal, the organisation was able\
    \ to move ahead with consistent leadership, it could plan for the leadership change\
    \ two years on, and it knew what it would get by agreeing to the deal. It’s was\
    \ a win for both sides.\n\nExample 2:\n\nSome people look for a particular skill\
    \ set to complement their experience. Early in my career I had a peer who hadn’t\
    \ worked for any smaller companies. He stepped out of a senior role in a global\
    \ organisation and spent two years to the day leading a much smaller team in a\
    \ more agile environment – ‘agile’ in the traditional sense. By his resignation\
    \ date, he had made himself redundant and moved to a more senior role in a mid-tier\
    \ organisation – his plan all along. The organisation was aware that he was seeking\
    \ some specific experience for his CV. They knew he would not stay forever, and\
    \ because of that, they worked him hard, made sure he trained others, and imparted\
    \ his 20 years of business knowledge through mentoring and program leadership.\
    \ The business respected his honesty, and instead of watching the days slip by,\
    \ awaiting his inevitable resignation, they embraced the time they had with him."
