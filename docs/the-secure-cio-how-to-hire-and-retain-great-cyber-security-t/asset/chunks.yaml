    \ devices. This is daunting, especially when the organisation is large, or security\
    \ is new and expectations are lacking.\n\nThis section talks about the value of\
    \ your involvement as CIO with the new security leader from day one, some tips\
    \ on their first few weeks and on how they might settle in. Further, it’s about\
    \ taking them through the agenda to give them a point of reference and help them\
    \ with a starting point. They will always want to leave their mark on the strategy,\
    \ and the agenda is merely a guiding light on where the fires are burning, so\
    \ to speak. While helping the new employee settle in is the time to set expectations\
    \ and remember some of the stretch you might have allowed for when committing\
    \ to this leader.\n\nFinally, when I titled this section ‘Don’t leave them high\
    \ and dry’, this extends past their cooling-off period. Bringing in a security\
    \ leader takes ongoing effort. The best security roles I have had were when the\
    \ CIO was active, taking part in the awareness campaigns, getting involved in\
    \ the program of work, attending steering committee meetings, and asking tough\
    \ questions. I’m not suggesting you smother them; neither do you need the burden\
    \ of a leader who needs extensive hand holding. You want an expert, and you need\
    \ to visibly support them.\n\nThis example might help to explain what I mean:\
    \ I once helped an organisation to establish its agenda and find a head of cyber\
    \ security. The organisation had a tradition that people would be given a black\
    \ T-shirt with either a logo/emblem on it for certain projects or just with the\
    \ company details on the front. Originally, it was planned that staff would wear\
    \ the T-shirts to work to embrace the new branding, a small, visible, and tangible\
    \ representation by those who wore the T-shirt that they could be counted on to\
    \ represent the values of the organisation and didn’t care who knew it. This marketing\
    \ activity then turned into a saying that described employees who embraced and\
    \ embodied the values of their business. Those who were committed, loyal, and\
    \ focused on helping the company reach its objectives were often referred to colloquially\
    \ as ‘wearing the T-shirt’.\n\nOver time, there have been rare T-shirts that were\
    \ somewhat of a trophy, and old T-shirts that were respected. But no matter the\
    \ T-shirt’s detail, the embodying of the values in people’s actions was what was\
    \ key. I loved this, because it was simple for anyone at any level of the hierarchy\
    \ to gain the basic company T-shirt (and then the special shirts, by being involved\
    \ beyond their immediate job). The expression ‘wear/s the T-shirt’ could be said\
    \ and everyone knew the expected behaviours. Of course, I ensured there was a\
    \ special cyber security T-shirt.\n\nSo, when your new security leader arrives,\
    \ be sure you’re ready to ‘wear the security T-shirt’.\n\n### \n\n16\n\nWelcome\n\
    \n‘There are no strangers here, only friends you haven’t yet met.’\n\nWilliam\
    \ Butler Yeats, Irish poet\n\nIn chapter 12 I raised the fact that just by reporting\
    \ for duty, the new security manager begins to change the face of security for\
    \ your organisation. This is true, and it is literally the beginning."
