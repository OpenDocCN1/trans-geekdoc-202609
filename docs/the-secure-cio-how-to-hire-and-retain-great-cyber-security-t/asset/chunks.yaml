  trans: '

    第一是工作满意度。其次是“公司环境”以及员工在其中感受到的舒适程度。


    文章指出：“员工的惯性的加强或削弱，取决于其职业伦理与公司所代表价值观之间的兼容程度。员工的职业伦理源于自身的价值观以及在工作中遇到的实际情况。而公司的价值观则源于社会准则、董事会的正式决策，以及管理层的政策和程序。这两个视角之间差距的扩大会削弱惯性；而差距的缩小则会加强惯性。”


    第三个因素是员工对其他机构职业机会的感知，以及他们自我施加的限制和个人标准（如地理位置）。最后，还有非工作因素，如财务责任、家庭纽带、友谊和社区关系。研究中的许多员工报告称工作满意度较低，但他们仍然留了下来。


    几年前，我担任了一份工作，它为我提供了许多我所需的“个人标准”。在亚洲生活了三个半后刚下飞机，我找了一份能带给我急需的澳洲经验的工作。对我来说，这是一个全新的行业，这是一个“主管级”职位，最重要的是，它给了我灵活性。我有两个小孩子和一个生病的家人，我从亚洲回来是为了陪伴他们，而这份工作正符合标准。


    我没有意识到，我加入的是一个与我的价值观不一致的组织。虽然哈佛大学可能在 45 年前就做过这项研究，但当我入职仅六周就发现我无法为这个组织工作时，这四个因素全部发挥了作用。


    回想起来，不知道自己是否能更早地察觉到。我太专注于履行家庭责任了，以至于没有把组织匹配度放在首位。我向一位我信赖的领导反映了我的顾虑，他不是我的老板，很好地劝说我不要冲动。他对这个组织充满热情，并希望我能留在这个职位上，这既令人悦耳又有说服力。我非常感谢他，因为他促使我思考如何为组织增加价值，履行我对职位的承诺，并在尽管价值观冲突的情况下，以某种程度的个人诚信离开。我怀着感激的心情接受了他的话并继续努力。但几周后，他给我的那剂强心剂的作用消失了，我再次意识到，我的心不在焉了。


    谈到留才，一旦员工的惯性发生转变，组织能做的其实是有限的。重要的是确保在他们签署劳动合同之前解决了他们的需求，讨论了价值观的匹配情况，以及他们完成工作所需的支持。确保他们能够通过“烧烤测试”：如果他们正在参加烧烤派对，有人问起他们在哪里工作，他们会自豪地说出来吗？确保潜在员工从工作的角度意识到自己正身处什么样的境地。（幸好你把第二章的那个议程带在了。）最后，确保他们工作的环境能够支持这位领导。我不是在要求特殊待遇，而只是要求尽职调查。安全就业市场竞争激烈，你希望为你新的信息安全主管或网络安全主管创造正确的条件，让他们投入并繁荣发展。


    在说完这些之后，你还必须考虑你需要什么来支持他们，以确保你们在保护组织方面拥有长远的未来？你需要同事对这一议程的认可、安全计划的预算，以及你其他直接下属和同事对这位新人的支持。最后，为了从你的安全领导那里获得你所需的确定性，你需要具备韧性，信任这个过程，并准备好投入。


    框架的第四部分关于投入到新员工——对自己的选择感到满意，同时也理解他们保护组织并留下的承诺程度，并且是出于正确的理由，而不是因为惯性。


    ***


    [17] Vincent S. Flowers & Charles L. Hughes, ‘Why Employees Stay’, Harvard Business
    Review, July 1973 issue, [`hbr.org/1973/07/why-employees-stay`](https://hbr.org/1973/07/why-employees-stay)。


    1973 年，《哈佛商业评论》发表了一关于员工留存的文章：“为什么员工会留下来”。17 几乎在 45 年后，它依然切中要害。其前提是，员工留在组织中是因为惯性。在有更好的机会出现之前，他们会一直留在自己的岗位上。但这种停止惯性的推力受到四个因素的影响。


    17 Vincent S. Flowers & Charles L. Hughes, ‘Why Employees Stay’, Harvard Business
    Review, July 1973 issue,


    ### 第 14 节：职责巡视


    “为今天和每一天计划你的工作，然后执行你的计划。”


    玛格丽特·撒切勒，英国前首相


    我们都知道有些人是带着计划承担新职位的。他们从第一天起就知道自己的 30 天、60 天和 90 天目标。或者说“前 100 天”。也有考虑有限期限的计划者。我是在做概括，因为每个人都略有不同。但本质上，人们要么知道自己想要什么以及计划花多久来实现，要么就盲目进入职位，相信旅程会将他们带向何方。


    对于那些有大目标且期限有限的人来说，这通常是他们设定的边界，但对候选人和组织来说效果很好。我有两个例子。


    #### 案例 1


    一位朋友担任了顾问，作为临时执行官领导一个团队。公司非常喜欢她，很快他们就请求她留下来。她礼貌地拒绝了一个月，隔一天一次，直到她去找首席执行官建议她留下，但有以下条件：她将继续担任顾问，但仅限两年，期间她计划执行
    `X`、`Y` 和 `Z`。有了这个提议，组织能够以一致的领导向前发展，可以为两年后的领导变更做计划，并且知道达成协议后将获得什么。这对双方来说都是双赢。


    #### 案例 2


    有些人寻找特定的技能组合来补充他们的经验。在我职业生涯早期，我有一位同事没有在任何小公司工作过。他离开了一家全球性组织的高管职位，整花了两年在一个更敏捷的环境中领导一个较小团队——传统意义上的“敏捷”。在他离职之日，他已经完成了目标并进入了一家中型企业担任更高的职位——这一直是他的计划。组织意识到他正在为自己的简历寻求特定的经验。他们知道他不会长留，正因为如此，他们让他高强度工作，确保他培训他人，并通过导师指导和项目领导传授了他
    20 年的业务知识。公司尊重他的诚实，他们眼睁睁看着日子流逝等待他不可避免的辞职，而是珍惜与他共处的时光。

