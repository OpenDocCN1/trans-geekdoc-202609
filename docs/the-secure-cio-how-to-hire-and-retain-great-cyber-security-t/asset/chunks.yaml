    最近，我向一位名叫大卫（David）的朋友请教了关于他的 CIO 如何帮助他应对能力挑战（the stretch）的经历。大卫在安全行业的经历是在 20 世纪中期的公用事业领域，当时正处于大规模的
    IT 转型时期，公司请来了一位代理 CIO 来招聘正式 CIO 并实施新的 IT 组织架构。其中一个职位就是信息安全主管。


    当时，大卫是一名业务分析师，在 IT 部门中比 CIO 低四个层级。他当时二十多岁，拥有信息系统硕士学位。他热衷于参与这次 IT 转型。


    大卫定期与代理 CIO 会面，就转型团队完成的工作向其提供建议。在一次会议上，CIO 询问了大卫对信息安全、灾难恢复和业务连续性计划的看法。几天后，他被任命为信息安全主管，负责灾难恢复和业务连续性计划。他必须立即上任，并直接向
    CIO 汇报。一夜之间，大卫被提升了三个级别，并对自己完全没有经验的领域负责。风险很大，对吧？


    在随后的几个月里，代理 CIO 导师式地引导大卫进入这一角色。他被赋予了自由，并鼓励做出重大决策。这种支持简单却有力，大卫拥抱了给予他的机会。大卫的观点不断受到挑战，直到
    CIO 对所做出的决策感到满意。他也被允许犯一些错误，只要他能证明自己从错误中汲取了教训。


    给一个领导者机会是一个了不起的举动，但也涉及在辅导和导师方面的大量工作。在大卫的案例中，CIO 给了他犯错和成长所需的自主权，并提供了足够的指导和支持，以随着时间的推移尽可能地减少这些错误。


    遗憾的是，在某些情况下，人们被任命时初衷良好，但情况发生了变化。例如，最近我接触过的一位 CIO 在内部任命了一位安全领导者，将一位基础设施领导者调到了安全岗位，并计划帮助他完成过渡。他已经在组织中工作很久，深受管理层的尊重，在
    CIO 看来，他能够胜任新职责。他并不是她的首选，因为缺乏深厚的安全背景，但她愿意指导他并支持他在应对挑战方面的需求。


    由于不可预见的情况，CIO 在几个月后离开了组织，因此她不再能指导该领导者在新角色中的工作。组织如何管理这一点对安全职能至关重要，也会影响 IT 及更广泛业务部门对安全的认知。CIO
    的退出是无法预测的。因此，CIO 必须确保信息安全主管获得其他高管的支持，并能寻求新任 CIO 的支持，以确保组织的持续保护。


    ## 核心要点


    应对你新安全领导者技能中的挑战，对你们双方来说都是一段充满回报且充实的经历。即使你的新领导者不需要大量的支持或改进，你的坚定支持也将对留住人才大有帮助。如果他们入任该职位时有很大的成长空间，请确保他们愿意参与自己的技能提升。这是进化为全方位领导者以及安全职能成功的关键。


    ### 21


    ## 接下来该怎么办？


    ### 关于衡量的说明


    “无法衡量，就无法改进。” —— 彼得·德鲁鲁克


    无法衡量，就无法改进。人们说，你衡量什么，就能得到什么。这确实是事实。


    组织如何管理这一点对安全职能至关重要，也会影响 IT 及更广泛业务部门对安全的认知。CIO 的退出是无法预测的。因此，CIO 必须确保信息安全主管获得其他高管的支持，并能寻求新任
    CIO 的支持，以确保组织的持续保护。


    对新领导者的期望是什么？根据 LinkedIn 的 2016 年全球趋势报告，招聘质量是 40% 公司和 45% 小规模公司的首要考虑事项。


    在衡量成功时，还有许多其他需要考虑因素。问自己以下问题（无特定顺序），可以帮助建立上述的一些衡量标准：


    '
- fmt: '

    Part of the success of a new employee is down to you. I have had both successes
    and times when I wish things had gone differently. In both cases, it came down
    to the level of my preparation before hiring. In the case where it could have
    been better, I had brought in a new leader to report to me, and, a few weeks in,
    he approached me and explained his concerns about the role and the organisation,
    as he didn’t have a clear view of his purpose. The role was newly created, and
    I, too, didn’t have a clear view of where his role should go in the first few
    months, let alone what he could expect to achieve. I had expectations, but these
    were just the bare bones, with no meat on them. We were a great fit, culturally,
    and got along well in terms of my management and his delivery style. However,
    it was only when I sat down and set clear `KPIs` (key performance indicators)
    with him did he gain a sense of achievement and I began to see great results.
    I learnt a lot from this experience, and would not want to see other leaders in
    a similar position, especially when some new employees do not necessarily feel
    confident to step forward and admit they don’t see a clear path ahead. Part of
    his challenge was a value misalignment with the organisation, which also clouded
    his day-to-day judgement. (We covered this in section 5, but I’m highlighting
    it again because its importance shouldn’t be underestimated.)


    Keeping a close eye on your interactions with your new leader will help you to
    measure the quality of your hiring decision. Where necessary, leverage coaching
    opportunities with a third-party coach for an independent perspective, understand
    what the appointee needs, and be realistic about the ecosystem they are becoming
    part of. This can help them not only to settle into the role but to understand
    the risks better, and meet broader expectations.


    ### Key takeaway


    Taking your new leader on this journey of measurement can set the precedent for
    their hiring of other security staff who come into the organisation under their
    umbrella. And while this book suggests a framework when hiring security professionals
    and leaders, it can also serve as a reminder that no matter whom you hire, doing
    the hard thinking and planning first can make for a much more confident hiring
    decision for you, and a higher likelihood that you’ll retain the staff member.


    \_\_\_\_\_\_\_\_\_\_


    [25](#naxka53o.html#f3k28cv1jc3) Nikolette Zika, ‘How to measure the quality of
    hire’, Workable (n.d.), [https://resources.workable.com/blog/quality-of-hire](https://resources.workable.com/blog/quality-of-hire)


    25 Nikolette Zika, ‘How to measure the quality of hire’, Workable (n.d.), [https://resources.workable.com/blog/quality-of-hire](https://resources.workable.com/blog/quality-of-hire)


    According to LinkedIn’s 2016 global trends report, the quality of the person hired
    is a priority for 40% of large companies and 45% of smaller ones.25. But how many
    of these businesses actually measure the quality of their new employee? Traditionally,
    security roles were considered difficult to evaluate based on the measurements
    you might assume appropriate, measurements such as zero breaches, or zero data
    lost, or zero security incidents. But incidents, breaches, and data loss cannot
    be completely controlled.


    ### The challenge of evaluation


    Traditionally, security roles were considered difficult to evaluate based on the
    measurements you might assume appropriate, measurements such as zero breaches,
    zero data lost, or zero security incidents. But incidents, breaches, and data
    loss cannot be completely controlled.


    ### The importance of support


    As a CIO, your role as a mentor is important. This suggests to me that the CIO
    needs as much support and guidance, especially in the early days, as the security
    leader does.


    One CIO I interviewed suggested the security know-how of a CIO was more important
    when assessing a potential than the security maturity of the organisation. He
    believed the ability of the CIO to support the security leader, and their reliance
    on that, was key.

