    How many businesses take the time before recruitment begins to understand their
    security position, the skills the business needs, and what value can be added
    through a security role? From the jobseeker’s perspective of available roles,
    how many candidates truly know what they are getting themselves into if they are
    successful?


    Securing your business can be overwhelming, especially when starting from scratch.
    Once your organisation has identified a need to make security part of the way
    you do business, how do you get started? Should you go big and seek a deep-dive
    risk assessment? Should you consider a three-year strategic implementation? Should
    you hire a head of information security?


    What is the best approach to help you identify what information security looks
    like at your company? Instead of a ‘go big’ approach, like those mentioned above,
    organisations could begin by asking key people in the business what security means
    to them, what they expect from a security program, how security would align with
    their business strategy, and given all the competing priorities, where a security
    program would fit in their organisation. I can feel you rolling your eyes as you
    imagine these security-related conversations with the CEO, the marketing guy and
    the under-the-pump head of IT ops. But having someone draw opinions, information,
    and aspirations from every corner of the organisation to answer the difficult
    questions can establish the true value placed on security by those in the driver’s
    seat.


    We have learnt that telling leaders, engineers, and anyone who will listen what
    security looks like is often met with groans, reluctant compliance, or panic.
    If we gave the business the opportunity to say what it thinks about security –
    and what it knows about security, which is often only what it sees in the media
    – this information starts to form a foundation on which incoming security leaders
    can build their roadmap, to know who else will champion security, and to establish
    what information security success means for your organisation.


    Starting by establishing your organisation’s security agenda will help your future
    team to align to your business’s priorities. Yes, there will be some difficult
    conversations and uncomfortable silences, but won’t they be worth it, if it means
    agreeing to a way forward together?


    ## 1. The state of the industry


    ‘The conversation around cyber security is changing – risks are better understood
    and opportunities better realised.’

    Cyber security roundtable meeting online news report, 24 April 2017, Dept. of
    the Prime Minister and Cabinet, Australia


    In Australia, there is a growing, unified front towards combating cyber security
    risk as part of protecting our borders – virtual and otherwise.


    In business, the growing number of conversations about cyber is helping to prepare
    organisations for potential cyber threats. In a government survey, 81% of organisations
    recognise that all staff have responsibility for ensuring cyber security and,
    overall 73% regularly discuss cyber security at the most senior management levels.[6]
    A move towards more senior security leaders who can approach the board with confidence
    and give its members certainty has become a must for cyber-resilient organisations.


    Businesses, however, are finding security leaders hard to come by, and the changing
    face of the industry is more demanding than ever. The following numbers demonstrate
    some of the challenges:


    * At any time, there are 350,000 open roles for cyber security professionals in
    the U.S.[7]

    * 78% of AISA members believe that lack of clarity contributes to difficulties
    in recruiting.[8]

    * Difficulties in recruiting because of limited growth; 52% reported their team
    had remained the same or grown by less than 10%.[9]

    * Australia will likely need about 11,000 additional workers over the next decade
    – for technical as well as non-technical positions – just to meet the ‘business-as-usual’
    demand.[10]


    These statistics alone can make attempts to hire daunting. But more research is
    being produced which informs governments, universities and enterprises to:


    * Attract, train and retain more women (more on this chapter 6). At only 11% of
    the cyber security workforce (and yet 48% of the general workforce),[11]

    * Collaborate; get involved.

    * Address ongoing development as well as access to mentors.


    ## Key takeaway


    We have never been more aware of the gap between organisational expectations and
    available cyber security. There are many opportunities to address this by identifying
    and mentoring the next generation, speaking up about the importance of security.


    [6] Ibid.

    [7] Maria Korolov, ‘Look beyond job boards to fill roles’, CSO Online, IDG Communications,
    13 July 2017, `https://www.csoonline.com/article/320668/it-careers/firms-look-beyond-job-boards-to-find-cybersecurity-talent/`

    [8] ‘The Australian Cyber Skills Shortage Study 2016’, AISA Research Report, Australian
    Information Security Association, `https://www.agix.com.au/wp-content/uploads/2016/12/AISA-skills-age.pdf`

    [9] Ibid.

    [10] ‘Challenges to Australia’s Cyber Security Industry’, Australian Cyber Security
    Growth Network, 2017, `https://www.acsgn.com/cyber-security-sector-competitiveness-plan/challenges-australias-security-industry/`

    [11] Patrick Howell O’Neill, ‘Women paid less than men at every level of cybersecurity
    industry, report says’, Cyberscoop, 15 March 2017, `https://www.cyberscoop.com/women-in-cybersecurity-wage-gap-report/`

