    \ you want to achieve in the next 12–18 months.\n\n### \n\n13\n\nWhat others are\
    \ saying, Part 2\n\n‘When you talk, you are only repeating what you know.  \n\n\
    But if you listen, you may learn something new.’\n\n14th Dalai Lama, spiritual\
    \ leader, Tibetan Buddhism\n\nBy now you will hopefully have met some really talented\
    \ cyber security leaders. You will have been to some security-related events/meet-ups.\
    \ You will be surer than ever of your agenda, which of course needs executive\
    \ endorsement. And you will be preparing to choose a security leader to take through\
    \ to reference check, contract offer, and ultimate commitment. How does that feel?\
    \ Great, right?\n\nOr does it feel daunting? Are those around you inquiring about\
    \ how the hiring is going. And when you tell them you have chosen a candidate,\
    \ are they questioning your judgement on the skills and experience you view as\
    \ valuable? Are you concerned that you may not have judged the person’s character\
    \ in terms of business and environmental fit? All of this is normal, and can upset\
    \ your process, if you let it.\n\nSo, what are others saying?\n\nOrganisational\
    \ leaders/stakeholders\n\nSome of the reactions of those around you may include:\n\
    \n*   surprise, when you discuss the candidate’s skills and experience\n\n*  \
    \ concern that the candidate is more junior or senior than expected\n\n*   a wish\
    \ to have some late input into whom you choose if this person will rely heavily\
    \ on the appointee to deliver certain outcomes or meet audit requirements\n\n\
    The key thing to remember is that, in security, the fact that your organisation\
    \ will have a dedicated staff member – and perhaps a team – puts you ahead of\
    \ many other organisations in achieving certainty and protecting your customers.\
    \ Furthermore, people will always have an opinion on hiring. Bringing in a security\
    \ leader is a huge step for any organisation, no matter the size, and can only\
    \ improve security maturity. This new leader will raise the profile of security\
    \ commitment just by arriving. (More on this in chapter 16.) This is true for\
    \ new roles and backfills.\n\nThe good thing for you is that if you have followed\
    \ the process in this book – talked to stakeholders, formulated your agenda, and\
    \ clearly defined the role – you are justified in your selection, which has also\
    \ been vetted by your co-interviewer(s). I realise there are points along the\
    \ way where things could have gone amiss. But, essentially, if the person you\
    \ have chosen meets your non-negotiables and is ready to take on the agenda, in\
    \ terms of their skill and their passion and your ability and desire to support\
    \ them, you can rest easier.\n\nThe security industry\n\nWhat others are saying\
    \ should include the industry. How well connected is this person and do any of\
    \ your security connections know of them? Are they participating in industry activities,\
    \ speaking at events, and supporting their peers?\n\nOne of my consulting clients\
    \ pressed the importance of screening candidates who are active members of industry\
    \ groups. I couldn’t agree more with this requirement when it comes to sourcing\
    \ staff, especially in security. Working in security, you cannot be an island\
    \ (or under a rock, for that matter). With the landscape changing daily, and all\
    \ of us feeling our way to some degree, it is imperative that we share with our\
    \ peers, seek sounding boards, and learn from others’ experiences. Let’s face\
    \ it, today’s survivor of a cyber-attack is likely to be tomorrow’s authority\
    \ on the topic. The value an audience can take from your experience of securing\
    \ an organisation is that they might notice something sooner, see the hallmarks\
    \ of an attack more easily, or simply be able to educate their workforce on new\
    \ methods of cyber-attack to be aware of. \n\nIs your candidate a sought-after\
    \ speaker to talk at industry forums and relive incidents or key learnings from\
    \ their career to date? Whether a long-time member or first-time attendee, if\
    \ you find candidates who meet your technical requirements and show a desire to\
    \ inspire and be inspired by their peers, these ones are often keepers.\n\nReferees\n\
    \nWhat others are saying also includes referees. We all know that referees will\
    \ rarely say bad things about candidates, which is why they are chosen as referees.\
    \ But questions can be framed in a way to elicit sufficient information about\
    \ a candidate’s abilities and their output without asking for negative comments.\
    \ Reference checks are sometimes done by HR partners and recruiters, but it is\
    \ important that you be happy with the depth of the reference check, that it goes\
    \ beyond the basics. If you have concerns after the checks are done, ask for more\
    \ referees to delve deeper, or conduct further checking yourself.\n\nEarlier in\
    \ the book we mentioned testing the candidate’s ability to meet non-negotiables\
    \ through referee questioning. Ask the referee to share examples of times the\
    \ candidate exhibited some of your non-negotiable experiences or traits.\n\nSome\
    \ additional questions you might want to ask:\n\n*   This role is senior and will\
    \ involve interacting with the board. How do you think this candidate will manage\
    \ board expectations?\n\n*   How did the candidate manage the stress and impact\
    \ of security incidents?\n\n*   How does the candidate relate to others?\n\n*\
    \   How did the candidate handle autonomy?\n\n*   In terms of budget, did you\
    \ feel the candidate had a grasp of the best investments for your organisation?\n\
    \nKey takeaway\n\nIn life, as a general rule, we should avoid listening to what\
    \ others think or say and trust our own gut and judgement. This doesn’t mean we\
    \ stop asking questions, seeking opinions, and validating information before we\
    \ act. Asking some key, open questions, and understanding the value others have\
    \ gained and continue to gain from your preferred candidate, yields important\
    \ information for you to consider when selecting your next security leader.\n\n\
    ### \n\nSection 4\n\nCommitment: Are you ready?\n\n‘Unless commitment is made,\
    \ there are  \n\nonly promises and hopes, but no plans.’\n\nPeter F. Drucker,\
    \ author\n\nIn 1973, the Harvard Business Review ran a story about staff retention:\
    \ ‘Why employees stay’.[17](#8ttr782a.html#f3k28cv1jc8) Almost 45 years later,\
    \ it still rings true. The premise is that employees stay in organisations because\
    \ of inertia. Until something better comes along, they will stay in their role.\
    \ But the push to stop the inertia is affected by four factors."
