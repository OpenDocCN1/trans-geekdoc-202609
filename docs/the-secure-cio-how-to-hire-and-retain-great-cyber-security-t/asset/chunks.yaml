    *   collaborate, influence, and inspire.


    So, how to establish this certainty?


    ## The Dilemma


    ‘Most people spend more time and energy going around problems than in trying to
    solve them.’


    Henry Ford, founder, Ford Motor Company


    This section provides some insights about common problems for CIOs when hiring
    cyber security leaders. Looking at job ads for roles that have remained unfilled
    for long periods, and at the hundreds of applications sent to recruiters who are
    not suitable for the role, I have found three recurring problems:


    ### 1 Security is considered an IT problem


    The responsibility to hire an expert and manage security is still considered an
    IT issue and usually the responsibility of the `CIO`. Their ability to assess
    candidates varies considerably, and unless they are clear about what they’re after,
    it may take a long time to fill the role.


    `CIO`s have a complex and diverse set of responsibilities. They need to consider
    the strategies of every division of the company. They must take risks to drive
    innovation, but at the same time, focus on risk mitigation to deliver on security
    needs. This can create conflict in the `CIO`s mind about looking after the needs
    of the business and the customer. To do this they need a strong team of advisers
    to lead and educate them about new ways to achieve business goals.


    An extra challenge for the `CIO`, if security is a new responsibility, is that
    initially a budget to manage security may need to be ‘found’ among other IT funds.
    A simple phishing test subscription can set you back $50,000 a year, and not many
    IT budgets have that lying around, let alone larger sums for security monitoring,
    or the staff to act on incident alerts or risk assessment results. The average
    security budget for a mid-tier organisation is in the hundreds of thousands of
    dollars, so taking this kind of money from another initiative or priority will
    be felt on the bottom line.


    The `SANS Institute` is the largest IT security training, certification, and security
    documents source in the world. Their Security Spending Trends Report for 2016
    found that since 2014, security usually accounts for 4–6% of a company’s total
    IT budget. But the number of companies with budgets in the 10–12% range is growing.[2]


    As the need for security spending increases, however, overall IT budgets appear
    to be dropping, with mid-tier organisations being in the range of US$1 million–10
    million.[3]


    And speaking of expenditure, who pays to clean up a security breach? The `Australian
    Cyber Security Centre` says, ‘The costs of compromise are almost certainly more
    expensive than preventative measures’,[4] and therefore having a dedicate security
    budget (not one scrapped together) for things such as early incident detection
    is becoming key to protecting your organisation.


    ### 2 Your organisation is unable to attract quality candidates


    This is often due to an excessively broad job description, requiring that one
    person play the role of many, and perform more than one security function.


    The skills required for a head of information security, or indeed a chief information
    security officer, are unlikely to match those of someone who needs to review code
    or assess the technical.


    ### 3 Board pressure


    It is important for the board to voice its concerns about cyber security so you
    are aware of its position; however, panic and knee-jerk reactions are not helpful.
    The `Australian Cyber Security Centre` found that regular board and senior management
    level discussions about security are a key factor.


    Addressing these recurring problems brought me to the central question: How can
    you find and retain great cyber security?

