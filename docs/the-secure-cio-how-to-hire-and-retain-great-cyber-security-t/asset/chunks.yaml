    \ are a given to be tested. I have interviewed candidates who are perfect on paper,\
    \ but when I met them, they were jaded and had lost their drive to change the\
    \ world one phishing link at a time, so to speak. Think back to your non-negotiables\
    \ and ensure that your questions are focused on both the hard skills and personal\
    \ traits you are keen to confirm are present.\n\nThis process of candidate review\
    \ can also be influenced by a detail I discuss in the next chapter. Your approach\
    \ (and theirs) might be slightly different if you have met the candidate before,\
    \ or they are known to someone in your organisation.\n\nIf you do find yourself\
    \ without good prospective candidates at this stage, I recommend you revisit your\
    \ job description, reassess your non-negotiables, and reconsider your method for\
    \ attracting candidates, i.e., if online ads aren’t working, try more networking,\
    \ or vice versa, or reconsider the job title.\n\nKey takeaway\n\nCandidate review\
    \ is challenging, and you can easily grow disheartened. Push on with your screening\
    \ and face-to-face interviews. Revisit your method of attracting candidates and\
    \ your interview questions if you find you cannot glean the information you need\
    \ to assess the candidate properly.\n\n### \n\n11\n\nSurround yourself  \n\nwith\
    \ supporters\n\n‘You need to have a collaborative hiring process.’\n\nSteve Jobs,\
    \ co-founder, Apple Inc.\n\nThere are times in the hiring process when you will\
    \ need to surround yourself with certain people, professionals and peers. This\
    \ will ensure that you make the best attempt at finding the right person. Furthermore,\
    \ trying to do the hiring alone is futile. You might find support of value at\
    \ the following stages: when seeking referrals from employees, when seeking candidates,\
    \ and when selecting those to co-interview with you.\n\nInternal employee referrals\n\
    \nOne of the best ways to find and retain great talent, security or otherwise,\
    \ is via referral. Providing a brief job description to staff/employees to see\
    \ if they know anyone who might have the suitable skills and cultural fit is a\
    \ great place to start. Your employees are a walking advertisement. Most people\
    \ wouldn’t recommend their friends/acquaintances to work in an organisation they\
    \ aren’t happy to promote, so, in theory, you will only hear from those who are\
    \ living the values. Furthermore, referrals can be paid/rewarded/recognised to\
    \ incentivise staff. While budget can be a concern, even when referrals are paid\
    \ for, the fee far undercuts anything you would pay a recruiter for the same outcome.\
    \ A well-designed employee referral program with clear rules and guidelines can\
    \ deliver candidates straight to your door.\n\nNote: While I never want to suggest\
    \ things can go sour, it is important to ensure the rules are clear and that you\
    \ have thought this through. If in doubt, seek legal advice to ensure you cover\
    \ all potential outcomes should the referred employee not work out.\n\nThe process\
    \ of seeking a referral can also be a great opportunity to promote security within\
    \ your organisation. Current employees can understand more about what this role\
    \ will involve and therefore become more aware of the changes a security leader\
    \ will bring.\n\nThe key benefits of a referred candidate are:\n\n1.  Quality:\
    \ Studies in the U.S. by employee success software firm Achievers has shown that\
    \ referred employees are higher-quality recruits. This is because employees pre-screen\
    \ potential candidates for skills and cultural fit before referring them for a\
    \ role.\n\n2.  Cost: Referral programs keep recruitment costs down. They will\
    \ cost a few thousand dollars now and then, compared with tens of thousands for\
    \ recruiters. This small army of worker bees out in the community helping your\
    \ search efforts cannot be underestimated.\n\n3.  Brand: Referrals are great for\
    \ your brand as it gets people talking about you, especially on social media such\
    \ as LinkedIn or Twitter. The message is positive, and even if it doesn’t provide\
    \ a fruitful referral, it will promote your company and its security efforts.\
    \ Furthermore, employees generally take a less aggressive approach than recruiters,\
    \ so their promotion of a job may be better received by their connections.\n\n\
    4.  Morale: Your people are your ambassadors, and having them understand the goals\
    \ and direction of the organisation in order to brief a potential candidate only\
    \ strengthens their passion for the organisation.\n\nNetworking\n\nWhen seeking\
    \ candidates, networking is close to employee referrals as a winning formula.\
    \ It is estimated that 85-plus per cent of people who land open jobs did so through\
    \ networking.[16](#kyamf5xw.html#f3k28cv1jc0) Networking with peer CIOs, attending\
    \ security-related events and speaking at events where security staff – or future\
    \ security leaders – gather increases your chances of sourcing great talent. Surrounding\
    \ yourself with other CIOs who have been through a similar process can be helpful.\
    \ Hearing their war stories, their successes, and how they have managed security\
    \ can provide insight into what others experience, and you can also learn from\
    \ their good or bad fortune. They may also have candidates who weren’t suitable\
    \ for their roles but could be for yours. Furthermore, networking directly with\
    \ those who might be interested in working with/for you is a great approach. There\
    \ are conferences, meet-ups, informal breakfasts, awards dinners, large events,\
    \ and drinks you can join to meet more security professionals and, just as importantly,\
    \ hear about the challenges they face. Two birds, one stone."
