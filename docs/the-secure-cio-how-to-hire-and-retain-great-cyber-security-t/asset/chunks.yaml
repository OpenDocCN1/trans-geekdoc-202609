    \ others won’t have any idea. Either way, considering who is best to share the\
    \ first, second, and third interview stages is important. Choosing someone who\
    \ will have a close collaboration with the new leader can be helpful for personality\
    \ or cultural fit. However, you won’t be able to please everyone, so be careful\
    \ and honest about what you need from that other opinion. The people you select\
    \ have to buy in to your agenda, your immediate focus, and your non-negotiables\
    \ if you are to find the most suitable candidate.\n\n### A few things to consider\
    \ about your co-interviewer(s):\n\n* How much will this new employee affect each\
    \ co-intervwer’s daily life?\n* Do they know your goals for the new employee,\
    \ and do they respect them?\n* What is your working relationship with them?\n\
    * What will the new security leader’s working relationship be with the co-interviewers?\n\
    * Will you keep the co-interviewer consistent across all interviews or mix up\
    \ who comes along with you?\n* If security is new to your organisation, how well\
    \ equipped are your co-interviewers to comprehend the candidate’s experience?\n\
    * Consider gender balance with your co-interers\n\n## Key takeaway\n\nConsider\
