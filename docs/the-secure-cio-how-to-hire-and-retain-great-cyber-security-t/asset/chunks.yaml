    该顾问目前的角色是支持大型安全项目、提供日常通用型建议，并根据其所属咨询公司内其他客户所看到的安全趋势，确保业务处于最新状态。这位首席信息官（CIO）并不是第一个在任领导者入职后仍长期留用安全顾问的人。他们深知自己不能单独战斗，然而，为团队争取预算是一项挑战。为顾问获取资金则相对容易一些。他们的知识是新颖的，尽管存在可能不是永久性的这一风险，但他们通过第二双专家手来交付新领导者所需的能力是很有价值的。


    ## 他们需要预算和工具


    我不会在预算和工具上长墨太久，主要因为我关注的是安全领域的人才，但我会说这么一点：2016 年，`SANS` 对安全预算进行了研究，其中大部分处于 IT 支出范围内。敏感信息保护和监管合规是安全开支背后的两个最主要的业务驱动力。引入一位安全领导者并不是费用支出的开始、中间和终点。要成就伟事业，你们的新领导者可能需要自动化工具、第三方评估、检测和监控工具、测试、合规相关系统以及云安全应用的资金（例如分布式拒绝攻击（`DDOS`）和托管）。员工培训、认证以及通过会议和课程保持同步更新也需要资金。如果你计划将安全成为业务优先事项，你必须在预算中反映这一点——不能只是“拆东墙补西墙”，而是要真正地分配安全支出。获取所需的预算不仅需要衡量过去投资的成功（过去的安全投入可能很小，或者被双用途（安全与
    IT 结合）的硬件和服务掩盖了），根据 `SANS` 受访者的说法，还围绕着确保合规、实现业务目标，以及提供事件数量和风险概况改进的证明，这是获取安全预算时使用的四个核心理由。


    ## 他们需要曝光


    在新安全领导者入职的前 30 天内，向董事会或审计委员会汇报不太可能是你们的首要日程。然而，值得计划让他们尽早发生。我接触过的一位 CIO 建议，尽管有了新的安全领导者，他仍然认为自己的角色是董事会在安全方面的教育者。这种方法在日常工作中运作良好，但当发生泄露或事件时，董事会需要知道是谁正在管理这些风险/问题/事件/影响。在事件发生期间第一次与他们见面并不是理想的。


    随着全球网络安全事件的增加，我想知道有多少董事会最近第一次与他们的安全领导者见面，或者在长时间没有更新后才再次见面。董事会由人组成——他们也是人——他们的担忧源于不确定性和信息缺失。安全领导者可以增加他们对安全状况认知，提供定期、有效且与业务相关的更新、清晰的风险视图以及你们减少和缓解此类威胁的计划。你希望提供网络风险正在得到解决的确定性，让董事会对安全领导者建立信任。


    如果董事会已经熟悉你们的网络安全策略，包括发生事件时的处理方法，这将确保任何关于网络事件的紧急董事会议将更关注手头任务。许多组织将网络风险纳入其企业风险清单——通常排名第一——但并非所有组织都将如何处理此类风险的策略“社交化”到董事会层面。定期、具有参与性的战略更新是关键，这样当事件发生时，董事会已经认识安全领导者以及在提高安全成熟度方面的进展。


    在 2016 年澳大利亚网络安全中心调查中发现，韧性更强的受访者“更有可能在过去三个月内在董事会层面讨论过网络安全（87%），而被归类为韧性较差的仅为 59%”。


    调查还显示，在韧性较差的组织中，21% 的近期董事会级网络安全讨论是由事件引发的，而韧性较高的组织这一比例仅为 6%。此外，韧性较低的组织通常比其他组织更有可能事后才讨论网络安全。


    报告还指出，“无论韧性如何，都需要做更多工作将网络安全融入高级管理层的核心战略业务中”。


    总体而言，在 27% 的受访者中，网络安全在最高层很少被讨论，甚至从未被过。如果还没有引入，现在就是将安全引入董事会的时候了。高级管理层参与网络安全讨论是成功降低网络安全风险的关键因素。“最终，高层决策者对网络安全更好的理解有助于组织更有效地应对事件。”


    ## 久而久之，你们的新领导者可能需要一个团队


    所有业务在关注安全方面都要从哪里开始，新的安全领导者是一个极佳的起点。有一个专人致力于降低风险对组织的安全承诺将大有裨益。但正如我之前提到的，安全领导者不能单独做到这一点，虽然顾问有时会有帮助，但保护你们组织的需求只有通过能够深耕业务并满足其需求的专家才能实现，特别是当业务处于增长期时。


    当我到达 `Sportsbet` 时，只有我和一个已经在那里了几个月的第三方顾问。当一年后我离开时，那里已经有了一名应用安全专家、一名架构师、一名分析师和一名信息安全主管来取代我。`Sportsbet`
    是一个拥有 700 人的组织，感谢于对安全的坚定承诺，他们利用安全团队能提供的每一小时。这过去和现在都是致力于支持其安全团队、履行监管义务（这需要资源）并将审计发现减少到最低的组织。如果没有一个专家团队在技术（新旧旧）上与业务紧密合作、深入新倡议、增加他人知识并提高安全基准，这一切是无法完成的。


    ## 候选人不需要什么


    其中一些是重复的，但为了完整起见，让我们看看安全领导者不需要、不想要或不具备管理能力的事项。


    *   你们的新安全领导者不是整个业务在未来任何时候每一个审计发现/行动的新所有者，也不是那些自战争以来就未露面的零星发现的所有者。是的，审计发现通常会导致基于新的或改进的安全控制措施的管理承诺，但许多审计发现与信息/网络安全无关。请确保不要让新领导者被归类为负责
    IT 审计发现的责任人，这种情况通常是因为安全被认为是审计的紧密伙伴。


