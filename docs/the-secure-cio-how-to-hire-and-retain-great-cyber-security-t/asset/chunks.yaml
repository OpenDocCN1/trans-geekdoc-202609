    I tell this story because while there are many excellent professionals in this
    field, right-fit security talent is hard to find. And while it’s not always appropriate
    to hire someone who is still maturing, there should be room for stretch, and if
    you feel the candidate lives the values and can meet most of your wants/needs
    on day one, consider taking a chance on them. It might just be the opportunity
    they need and it will be thanks to you. This isn’t an easy option and requires
    work on your part as their manager. But it’s something to ponder when considering
    the protection of your organisation and the opportunity to help someone expand
    into a well-rounded leader for their next role. Let’s face it, while they are
    making you look good, your job as their boss is to prepare them for the challenges
    of the future.


    As a side note: If you’re not willing or don’t have the capacity to support the
    new leader in closing the gaps in their skills or experience, it’s fine to not
    go down this path. It may cause the role to sit empty for longer, but if you are
    unable to support a leader growing into the role, it’s not fair on any of the
    parties involved to move forward together.


    ## Key takeaway


    I stand by my advice to have some non-negotiables, skills you must have on day
    one. But if someone has gaps in their experience, consider how you might be the
    right person to help them overcome these if it wouldn’t be detrimental to your
    goals. Taking a chance on a candidate who is 80% there could be the best thing
    for all involved. By all means, assess the situation, trust your gut, and, as
    always, base your decision on the outcomes you want to achieve in the next 12–18
    months.


    ### 13


    ## What others are saying, Part 2


    ‘When you talk, you are only repeating what you know. But if you listen, you may
    learn something new.’


    14th Dalai Lama, spiritual leader, Tibetan Buddhism


    By now you will hopefully have met some really talented cyber security leaders.
    You will have been to some security-related events/meet-ups. You will be surer
    than ever of your agenda, which of course needs executive endorsement. And you
    will be preparing to choose a security leader to take through to reference check,
    contract offer, and ultimate commitment. How does that feel? Great, right?


    Or does it feel daunting? Are those around you inquiring about how the hiring
    is going. And when you tell them you have chosen a candidate, are they questioning
    your judgement on the skills and experience you view as valuable? Are you concerned
    that you may not have judged the person’s character in terms of business and environmental
    fit? All of this is normal, and can upset your process, if you let it.


    ### So, what are others saying?


    #### Organisational leaders/stakeholders


    Some of the reactions of those around you may include:


    *   surprise, when you discuss the candidate’s skills and experience

    *   concern that the candidate is more junior or senior than expected

    *   a wish to have some late input into whom you choose if this person will rely
    heavily on the appointee to deliver certain outcomes or meet audit requirements


    The key thing to remember is that, in security, the fact that your organisation
    will have a dedicated staff member – and perhaps a team – puts you ahead of many
    other organisations in achieving certainty and protecting your customers. Furthermore,
    people will always have an opinion on hiring. Bringing in a security leader is
    a huge step for any organisation, no matter the size, and can only improve security
    maturity. This new leader will raise the profile of security commitment just by
    arriving. (More on this in chapter 16.)


    The good thing for you is that if you have followed the process in this book –
    talked to stakeholders, formulated your agenda, and clearly defined the role –
    you are justified in your selection, which has also been vetted by your co-interviewer(s).
    I realise there are points along the way where things could have gone amiss. But,
    essentially, if the person you have chosen meets your non-negotiables and is ready
    to take on the agenda, in terms of their skill and their passion and your ability
    and desire to support them, you can rest easier.


    ### The security industry


    What others are saying should include the industry. How well connected is this
    person and do any of your security connections know of them? Are they participating
    in industry activities, speaking at events, and supporting their peers?


    One of my consulting clients pressed the importance of screening candidates who
    are active members of industry groups. I couldn’t agree more with this requirement
    when it comes to sourcing staff, especially in security. Working in security,
    you cannot be an island (or under a rock, for that matter). With the landscape
    changing daily, and all of us feeling our way to some degree, it is imperative
    that we share with our peers, seek sounding boards, and learn from others’ experiences.
    Let’s face it, today’s survivor of a cyber-attack is likely to be tomorrow’s authority
    on the topic. The value an audience can take from your experience of securing
    an organisation is that they might notice something sooner, see the hallmarks
    of an attack more easily, or simply be able to educate their workforce on new
    methods of cyber-attack to be aware of.


    Is your candidate a sought-after speaker to talk at industry forums and relive
    incidents or key learnings from their career to date? Whether a long-time member
    or first-time attendee, if you find candidates who meet your technical requirements
    and show a desire to inspire and be inspired by their peers, these ones are often
    keepers.


    ### Referees


    What others are saying also includes referees. We all know that referees will
    rarely say bad things about candidates, which is why they are chosen as referees.
    But questions can be framed in a way to elicit sufficient information about candidate’s
    abilities without asking for negative comments. Reference checks are sometimes
    done by HR partners and recruiters, but it is important that you be happy with
    the depth of the reference check, that it goes beyond the basics. If you have
    concerns after the checks are done, ask for more referees to delve deeper, or
    conduct further checking yourself.


    Earlier in the book we mentioned testing the candidate’s ability to meet non-negotiables
    through referee questioning. Ask the referee to share examples of times the candidate
    exhibited some of your non-negotiable experiences or traits.


    Some additional questions you might want to ask:


    *   This role is senior and will involve interacting with the board. How do you
    think this candidate will manage board expectations?

    *   How did the candidate manage the stress and impact of security incidents?

    *   How does the candidate relate to others?

    *   How did the candidate handle autonomy?

    *   In terms of budget, did you feel the candidate had a grasp of the best investments
    for your organisation?


    Key takeaway


    In life, as a general rule, we should avoid listening to what others think or
    say and trust our own gut and judgement. This doesn’t mean we stop asking questions,
    seeking opinions, and validating information before we act. Asking some key, open
    questions, and understanding the value others have gained and continue to gain
    from your preferred candidate, yields important information for you to consider
    when selecting your next security leader.


    ### Section 4


    Commitment: Are you ready?


    ‘Unless commitment is made, there are only promises and hopes, but no plans.’


    Peter F. Drucker, author


    In 1973, the Harvard Business Review ran a story about staff retention: ‘Why employees
    stay’.[17](#8ttr782a.html#f3k28cv1jc8). Almost 45 years later, it still rings
    true. The premise is that employees stay in organisations because of inertia.
    Until something better comes along, they will stay in their role. But the push
    to stop the inertia is affected by four factors.

