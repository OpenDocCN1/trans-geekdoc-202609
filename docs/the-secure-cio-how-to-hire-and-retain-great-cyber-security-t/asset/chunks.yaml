    \ have had, and the right job description, it should be clear who you need to\
    \ employ and what their outputs should be for the coming six, 12, or 18 months.\
    \ Beyond that, they will need to create a broader strategy, but they will know\
    \ that after their interview conversations with you.\n\nGiven the agenda setting,\
    \ you should be able to limit any expectation gap in at least two of its variations:\
    \ first, where the candidate believes they can achieve change and then falls flat\
    \ because you haven’t articulated what’s possible in your specific environment;\
    \ and, second, when an in-house candidate believes they can fulfil most of what\
    \ the role or job description requires on paper but their history, background,\
    \ and attitude preclude them. The following examples should clarify my point.\n\
    \nThe excited new hire\n\nAbout five years ago, I met a leader who arrived in\
    \ the IT department new to the organisation, to the country, and to the industry\
    \ – not new to IT but to the business’s industry. He joined the organisation with\
    \ dreams of pushing everything to the cloud, which he had done successfully in\
    \ his previous role, innovating processes, and clearing out what he would identify\
    \ as ‘dead wood’ among the staff. He reported for duty with gusto, raising his\
    \ ideas at every opportunity, setting aside a budget for his grand plans, and\
    \ genuinely planning disruption, which he believed was both possible and positive.\n\
    \nThe shine soon came off his plans when the leadership team and his direct reports\
    \ couldn’t support his strategy. His grand plans didn’t align with the regulations\
    \ the business was required to adhere to, didn’t fit with the old-school, risk-averse\
    \ mentality of the organisation, and identifying ‘dead wood’ was not the way the\
    \ business was run. None of these restrictions are necessarily right, but this\
    \ was the way of the organisation, and a communication breakdown had occurred\
    \ between the hiring manager and the new leader. There’s a good chance that had\
    \ he known his plans would fall on deaf ears, he would not have accepted the role.\n\
    \nIt is so important to be clear what the new employee is walking into, what the\
    \ boundaries might be, and if they (and you) feel they can deliver against everyone’s\
    \ expectations. Alternatively, if money and scope are no object, be clear about\
    \ this lack of boundaries too. This can be a challenge for some people who like\
    \ structure and are not blue-sky thinkers. Aim to set your new employee up for\
    \ success by being clear on what is achievable.\n\nThe IT security manager who\
    \ aspires to be head of information security\n\nThe second example is one I have\
    \ seen on a number of occasions in mid-sized organisations that have been around\
    \ for 10-plus years. In two almost identical cases, the organisations had an IT\
    \ security policy manager (or similar title) whose role was to manage updates\
    \ to security-related policies, enforce polices, exceptions, or exemptions to\
    \ policies, and educate the staff on the existence and application of policies.\
    \ This role was important and played a part in the business’s audit compliance.\
    \ The two managers each had at least 15 years’ experience with their businesses,\
    \ most of which had been in security or compliance. They were well connected,\
    \ knew the business well, and were known for their role in compliance-type activities.\
    \ Great, right? Yes. But these attributes and experiences were not necessarily\
    \ leading them to a leadership/c-level role.\n\nWhen their organisations were\
    \ waking up to the new cyber threat and the risks being realised by organisations\
    \ globally, audits ensued. These raised hundreds of concerns, one of which was\
    \ a lack of leadership and visibility in the IT security area. It was not only\
    \ a lack of leadership but of senior staff addressing cyber risk, and a concern\
    \ that security was not recognised in executive conversations about projects,\
    \ products, or initiatives. There was also the possibility that the organisations\
    \ had suffered a cyber breach and didn’t know it. Given that, in 2016, the average\
    \ detection time to identify a cyber breach was 146 days globally, and 469 days\
    \ for Europe, the Middle East, and Africa (EMEA),[19](#8p4sy8nv.html#f3k28cv1jci)\
    \ you can understand why some heads have come up out of the sand in recent years,\
    \ in relation to cyber."
