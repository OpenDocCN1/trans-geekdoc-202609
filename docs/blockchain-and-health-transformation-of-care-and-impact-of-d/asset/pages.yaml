- pgno: 85
  md: '# THREE APPLICATIONS IN HEALTHCARE


    The Blockchain can respond to the challenges currently confronting healthcare.
    These challenges include medical data (security, interoperability, accessibility),
    medical research, clinical trials, the medical supply chain and the quality of
    the medicines. Many healthcare organizations do not use efficient and ineffective
    methods to deal with medical data. Failure to properly manage data affects patient
    care. In addition, the problem arises that many health services each use their
    own methodology for medical data and access to such data.


    The Blockchain can shape data efficiency in healthcare. It can ensure flexibility,
    interconnection, accountability and protection in accessing those data that are
    necessary for the provision of good care. In this chapter, we mainly talk about
    how Blockchain can be applied in healthcare in practice.


    # Transparency of Information


    Medical data on patients are spread across many organisations, insurance companies,
    doctors and the like. As a result, the medical file appears to be a complex of
    information that is incoherent, and it is a question whether all very important
    information is available. Currently, there is (not yet) a universal data storage
    system and the associated standards, both medical and ethical. This is therefore
    the crossroads between the medical sector and Blockchain to develop healthcare
    applications.


    The use of Blockchain technology in healthcare makes a difference in data management.
    The technology will make sharing medical data more effective, efficient, secure
    and transparent for all healthcare stakeholders. A network for healthcare institutions
    can exist without having a patient''s personal data. The details are all part
    of the Blockchain.


    Patients are identified in this network by means of their hash identification
    which is a unique identification. A hash is an encrypted and calculated numeric
    code (see Chapter 1). The hash identification makes the ID unique and protects
    the privacy of the user. As a result, the Blockchain can also form a platform
    for exchanging patient data. In this way, you can prevent information from being
    blocked, as it is possible to keep the exchange of information between the various
    stakeholders active. When the data changes within one of the blocks, a chain reaction
    is set up that can freeze the entire Blockchain. Because this is theoretically
    impossible, the data contained in the Blockchain cannot be tampered with.


    But what if non-stakeholders want to hack information and/or influence it incorrectly?
    This is solved by Blockchain technology: it is a transparent tool in which everyone
    who is part of this network will look at the Blockchain to see how each transaction
    takes place and whether or not relevant information is passed on. In addition,'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'data cannot be fraudulent; if a non-interested party wishes to block the data,
    this will drastically change the hash due to the snowball effect. Each block in
    the Blockchain stores the data hash stored in the previous block (see Chapter
    4.4). Blockchain thus ensures enormous transparency of patient information so
    that patients can be better helped.


    # # Accessibility of Patient Information


    Although it is considered an unethical activity, blocking information in healthcare
    has been a problem. In the medical sector, for example, blocking patients'' data
    can be recognised by a doctor as the result of unreasonable restrictions on the
    exchange of patient data or electronic health information. There are three reasons
    for blocking information, the US Office of the National Coordinator for Health
    Information Technology states:


    +   - interference

    +   - knowledge

    +   - there is no justification for inaccessibility of data


    It goes without saying that blocking information is a huge disadvantage for efficient
    and effective practice in healthcare. The explanation for this seems very clear:
    hospitals do not want to miss patients and want to make it as difficult as possible
    for them to go to another hospital or claims behaviour produces undesirable effects.
    This actually should already have been the practice in the current digital age.


    Research shows that blocking information is very widespread and that the various
    steps taken to curb this remain extremely inefficient. In fact, 50% of respondents
    have been involved in blocking information from health IT companies, says Adler-Milstein,
    associate professor and director of the Centre for Clinical Informatics and Improvement
    Research at Harvard University (Adler-Milstein and Pfeifer 2017). A quarter of
    these respondents say that this practice is due to hospitals and health systems.
    According to the researchers, the following methods can prevent blocking information:


    +   1. Greater clarity so that any action taken by members can be justified.

    +   2. Good financial rewards so that the participants want to exchange data.

    +   3. A partnership between healthcare IT companies, hospitals and the Healthcare
    Information Exchange can prevent information from being blocked.


    Blockchain technology can help set up medical records in Blockchain. This reduces
    unnecessary administrative costs and also allows better use of health data. In
    addition, its'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'application may reduce the need to contact different intermediaries to supervise
    the exchange of essential health information.


    # **Complete Information**


    A single patient''s medical records can now be split across different facilities,
    doctors and insurance companies. This means that the entire medical history of
    a patient is always distorted or incomplete. Virtual medical records stored on
    a Blockchain can help healthcare stakeholders bring all parts of the health data
    complexity together. Therefore, the patient records, medicines received, completed
    procedures, facilities used and other details will also be up-to-date and usable
    for everyone involved.


    Acccessible and complete information will greatly simplify the key role of healthcare
    professionals. After all, this role consists of providing patients with reliable,
    timely and good treatment. By using Blockchain technology in the field of healthcare,
    service providers will always have a clear picture of the patient''s medical record.
    It is crucial to note and acknowledge that all past health data are unchangeable
    in a Blockchain and healthcare environment and that any improvements to that data
    are obvious.


    # **Guarantee of Information Storage**


    Medical information in a Blockchain can be processed from various sources such
    as:


    +   * patient records

    +   * wearables such as smartwatches

    +   * mobile devices

    +   * laboratories


    Effective and efficient control over medical data is one of the most important
    advantages of Blockchain and healthcare. Many health-related problems can be avoided:
    interoperability, completion of data, misuse and even loss of data during a disaster.
    It is also worth noting that Blockchain technology can provide solutions to complex
    issues following a crisis like a pandemic.


    To help organizations improve preparation for a future pandemic and to support,
    accelerate and safeguard an economic recovery after the COVID-19, the World Economic
    Forum has released the Blockchain Deployment Toolkit available on Weforum.org.


    Critical to the provision of adequate medical services is the ability to ensure
    that the health data are correct. It must be avoided that junk becomes automated
    junk. Exposure to appropriate medical records means that healthcare professionals
    can make an accurate diagnosis. In addition, any adjustments are almost impossible
    until the data reaches a Blockchain.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Care Is (Still) Lagging Behind Blockchain


    Pharmaceutical companies of medical equipment are enthusiastic about the Blockchain,
    but this technology is still being introduced slowly, GlobalData observed in 2020.
    However, they expect Blockchain’s role in healthcare to grow rapidly. According
    to GlobalData, the main reason that this rapid growth is not yet achieved is the
    high start-up costs to get started. After all, many healthcare organizations have
    outdated legacy systems that are not adapted. There are also concerns about scalability,
    government regulation and privacy. Blockchain will certainly play a major role
    in future care, especially in the flow and exchange of information between stakeholders
    such as pharmaceutical companies, doctors, insurers and patients.


    Data can be exchanged quickly, easily and securely with Blockchain, with a high
    degree of interoperability and the assurance that everyone has the latest data.
    Privacy legislation and the US Health Insurance Portability and Accountability
    Act play a role in this development, while one can also wonder whether it is not
    too leading. Laws and regulations always follow social developments and not the
    other way around.


    Another application is to better safeguard data integrity by using Blockchain.
    Within clinical trials, it is of great importance that data and research results
    are not manipulated. Blockchain could at least theoretically offer a solution
    for this (Nictiz 2017).


    Experiments in healthcare with Blockchain are already taking place in various
    countries. Estonia has set an example internationally in the field of digital
    services for years. Estonia uses Blockchain in the national database with patient
    files and medication regulations. At the beginning of 2016, the company Guardtime
    announced that together with the government they would secure the data of a million
    patients with the help of Blockchain. This concerns ensuring data integrity and
    making all operations performed on the data transparent. So it is not about putting
    medical data on Blockchain.


    Blockchain pilots are also used in healthcare in the US. The US Food and Drug
    Administration is working with IBM, KPMG, Merck and Walmart to improve the pharmaceutical
    supply chain with the Blockchain. This supply chain contains many intermediaries
    that become unnecessary with the arrival of a Blockchain. In 2019, companies completed
    the Interoperability Pilot as part of the FDA’s DSCSA Pilot Project Program (DSCSA
    2020). In addition to the big advantages of a Blockchain, it also poses challenges
    such as data integrity, data storage options and development costs. The challenge
    of data integrity is no different in today’s traditional systems.


    The main components of GlobalData’s Blockchain in Health Care Thematic Research
    (2020) research include:


    +   - Key Industry Players: the major players in the blockchain industry and where
    they are in the value chain.'
