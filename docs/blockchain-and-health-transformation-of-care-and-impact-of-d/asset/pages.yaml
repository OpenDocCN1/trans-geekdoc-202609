- pgno: 246
  md: 'It has already been established that the Dutch health care system is on its
    way to an environment that has (more) dynamics and customers who ‘will pay and
    determine (more) themselves’ (Boer and Croon 2011).


    By introducing a platform strategy, personal directorship and control is increased.
    This concerns the principle of ‘open’ innovations (Chesbrough). In addition, it
    is not only about developing innovations, but more about how the invented innovations
    are organized (Elsen 2017). Key words here are: self-organization, close social
    networks and cooperation with customers. It is about virtualizing organizations:
    professionals develop in the conversation with clients.


    Zohar (2017) indicates that new organizational concepts are based on: trust in
    people and in the system; building relationships and teams; remaining flexible
    and in dialogue with changing circumstances; being open and ready for all kinds
    of possible future scenarios (Harari 2016). It also means more emphasis on meaning,
    vision and values, in particular the value of service. Especially the conversation
    (and being able to listen) between client and professional is essential.


    Professionals play a role in understanding client needs, being able to collaborate
    with other professionals on the basis of self-organization, room for experimentation
    and being able to give account. Partly due to the tight labour market for elderly
    care, interest in remote care is increasing. An example of ehealth is the ‘Alfred’
    programme of the European Commission. Apps and sensors are being developed that
    make speech commands easier and transmit signals to professionals and caregivers.


    Care processes are organized differently under the influence of digitalization.
    Sensor technology (‘guiding environment’) works as a memory aid for a resident
    with early dementia. An example is care organization Siza, which has developed
    tailored homes for people with disabilities. The home has smart apps and applications.


    An effective organization model is aimed at an adequate implementation of a care
    process in which various products and expertise are set up in conjunction. The
    criteria used for this are: matching clients’ wishes (demand-driven), efficient
    and effective access to healthcare, adequate information provision, creating connections
    between professionals, defining the funding basis and determining the management
    model of healthcare.


    There is a growing number of platforms in elderly care. The platform ‘Humanising
    van de ouderenzorg’ (‘Humanization of elderly care’) focuses on clarifying (through
    lectures) what good elderly care is and how you create space for sensemaking questions.
    Through the Ouderenzorg platform, researchers from the University for Humanities
    share their knowledge and expertise about elderly care with professionals and
    volunteers. The platform is coordinated by the professor of Care Ethical Aspects
    of Informal Care and the special professor of Empowerment of Vulnerable Elderly
    Persons.


    The platform ‘Nieuwe zorg’ (‘New Healthcare’) organizes, among other things, the
    healthcare debate in which politicians, healthcare providers, patient organizations
    and'
