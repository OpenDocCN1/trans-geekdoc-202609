    # Security of Medicine Production and Distribution


    Blockchain can be used for traceability of medicines and not only for traceability
    of the recipe but even counterfeit medicines. Counterfeiting medicines or imitation
    medicines is a major problem in the pharmaceutical industry and a social problem.
    As early as 2017, the Health Research Funding Organisation found that:


    +   - 10 to 30% of medicines sold in developing countries are falsified;

    +   - the market for counterfeit medicines is worth two hundred billion dollars
    per year;

    +   - the sale of counterfeit products on the internet represents a value of USD
    75 billion from the global market;

    +   - the majority of counterfeit medicines are produced in India and China;

    +   - in 2014, approximately sixty different Pfizer medicines and products were
    counterfeit worldwide. (World Health Organization 2017)


    Incidentally, the WHO estimates that sixteen percent of counterfeit medicines
    contain the wrong ingredients, while seventeen percent contain the wrong levels
    of necessary ingredients. From a financial point of view, counterfeiting causes
    an annual loss for the European pharmaceutical industry of 10.2 billion euros.


    Using Blockchain not only reduces the possibility of placing incorrect prescription
    products on the black market, but also reduces the chance of counterfeit products
    entering'
