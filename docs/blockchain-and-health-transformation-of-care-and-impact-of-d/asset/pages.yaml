- pgno: 72
  md: 'A highly decentralised blockchain is better secured but at the expense of scalability.
    If it is scalable and centralized, it is then less secure (Lim and Janse 2020:
    188). This is shown in Figure 8.


    # Scalability


    Scalability is an important challenge for the application of Blockchain. Scalability
    refers to the number of transactions that the Blockchain network can process.
    Scalability can be increased by adjusting the way blocks are produced and transactions
    are verified (Lim and Janse 2020).


    The block time is the average time in which a block is produced. For Bitcoin,
    the block time is 10 minutes. If your transaction is not included in the current
    block, then you will have to wait 10 minutes to be included in the next block.
    A faster block time can be achieved by reducing the difficulty for miners to find
    valid hashes and be able to produce blocks. This is described in detail in Basisboek
    Blockchain by Chhay Lin Lim and Arthur Janse.


    In addition to block time, block size plays an important role in scalability.
    The discussion about increasing the block size has led to disagreement within
    the Bitcoin community. In 2017, a group of developers wanted to increase the block
    size of Bitcoin from 1MB to 2MB so that more transactions can be processed per
    block. With the same block time, doubling the block size would mean that twice
    as many transactions can be processed every 10 minutes.


    The distribution and decentralisation level of the Blockchain plays a major role
    in scalability. This is because there is a strong correlation between the centralization
    and the processing speed of the Blockchain. As mentioned earlier, BitShares can
    process significantly more transactions per second than Bitcoin by using delegated
    Proof-of-Stake. The idea behind this is that a Blockchain is considerably more
    scalable with a select group of nineteen witnesses, where it is pre-determined
    who can produce the next block and validate those transactions.


    # Security


    The security of the Blockchain takes place in all kinds of ways, through the nodes,
    smart contracts, and the hashes to link blocks. Any form of security entails limitations
    in scalability and decentralisation.


    # Decentralization


    The most unique thing about the Blockchain is that no trusted third party is needed
    to store, monitor and control the data, as we are familiar with at banks or a
    notary. Blockchain is therefore a type of distributed ledger technology. A distributed
    ledger is a database that exists in multiple locations or between multiple users.
    Organizations often use a centralized database that is at a fixed location, and
    this centralized database'
  merge: -1
