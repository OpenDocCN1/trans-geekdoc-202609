- pgno: 160
  md: 'interaction between client and professional. However, (implicit) rules are
    applied: for example, the care provider who puts the focus on his or her own expertise.


    Cybernetic management means self-organization: organizing a complex system in
    such a way that it will be able to adapt (Malik 2016: 27). The key problem of
    cybernetics is therefore the question as to how systems of any kind can cope with
    the complexity of their environment which results form permanent changes and the
    speed of these changes (Malik 2016: 108).


    Personalized care and positive healthcare reinforce each other. Preventive and
    lifestyle support are reinforcing in reducing the vulnerability of the elderly.
    Healthcare technology and remote monitoring are aimed at increasing quality and
    improving the effectiveness of care deployment (Vilans 2014). Technology works
    when its supports the professional practice (Vilans 2016b). For the professional,
    it is about creating a working environment that guarantees quality of care (and
    offers opportunities for improvement), for optimal digital support (reduction
    of administrative burden and possibility of feedback on one’s own professional
    actions) and for a method of organization where self-organization is paramount.


    Demand-driven management is defined as the organization of healthcare based on
    an equal position between client and healthcare professional, whereby the client
    has access to the relevant health information (based on Van der Kraan). Quality
    of life is about physical well-being, emotional well-being, social well-being,
    giving meaning, material security, autonomy and relationship between care provider
    and client (ZonMw 2015). Network is a form of cooperation aimed at better solutions
    for clients. A platform integrates competencies and functions so that services
    can be delivered based on technologies, infrastructure, agreements, competencies
    and protocols (following Kreijveld, Deuten and Van Est 2014).


    Personalized care and positive healthcare reinforce each other. Preventive and
    lifestyle support are reinforcing in reducing the vulnerability of the elderly.
    Healthcare technology and remote monitoring are aimed at increasing quality and
    improving the effectiveness of care deployment (Vilans 2014). Technology works
    when its supports the professional practice (Vilans 2016b). For the professional,
    it is about creating a working environment that guarantees quality of care (and
    offers opportunities for improvement), for optimal digital support (reduction
    of administrative burden and possibility of feedback on one’s own professional
    actions) and for a method of organization where self-organization is paramount.


    The concept of self-organization forms the core of the interaction between client
    and professional. The methodology of grounded theory was chosen because it was
    not clear in advance how the interaction between client and professional would
    shift. To give substance to that shift as a result of digitalization and technology,
    a qualitative approach is chosen. The regulation and connection of changes within
    complex systems happens through information and communication (Malik 2017: 195).'
