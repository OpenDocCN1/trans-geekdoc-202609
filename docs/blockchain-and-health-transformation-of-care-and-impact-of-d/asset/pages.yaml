- pgno: 233
  md: '+   - Pragmatic IT solutions

    +   - Following the higher goal.


    The IT infrastructure facilitates that healthcare professionals are focused on
    phasing out the care. A number of indicators have been developed for this (Nandram
    2015, 101):


    +   - Duration of the average care process

    +   - Client satisfaction

    +   - Employee satisfaction

    +   - Team productivity and benchmark with the other teams

    +   - Client hours versus contract hours

    +   - Extent of monthly client hours and specification for certain client groups

    +   - Average size of client hours.


    Characteristic of this form of management is that there is room for employees
    to interact with each other in their own way. There are opportunities to meet
    each other, talk to each other, work with each other, define performance with
    each other. This means that professionals have the necessary resources (information,
    technology, powers) available. You concentrate on quality, services, costs and
    innovation. It is about: promoting autonomy, putting emphasis on doing and experiencing,
    making the organization design more playful, dividing systems into smaller parts
    and broadening perspectives (thinking from the client’s point of view).


    Within Buurtzorg, work is done with virtual platforms that facilitate planning,
    a forum for sharing experiences and contributing to innovative solutions (Nandram
    2015).


    The framework that Buurtzorg uses is aimed at clients, but is strongly substantiated
    from its own professional (human-centred) vision.


    # # Network Perspective: Network Structures


    Networks form a central component in the organization of healthcare in the Netherlands.
    Dutch society is developing in the direction of a network society (Rotmans 2012;
    Rotmans 2014; Rotmans 2017).The transition of Dutch society is the centre of ‘The
    eye of the hurricane’ (Rotmans 2012). Society is driven less top-down: networks
    and decentralized communities increasingly determine what happens. According to
    him, there is increasing interest in cooperatives, social importance and solidarity.
    The 21st century is described as a network world. Everything is connected to everything:
    interaction is central. Because events are connected, the likelihood that they
    will happen is also connected.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'It was stated earlier that professionals are expected to be able to operate
    in network structures (network care). More and more care is also taking place
    in network structures. This means that the role of management, professional (multidisciplinarity)
    and client (coordination issue) needs to be redefined. There is no generally defined
    definition of healthcare networks (Verver, Merten and Wagner 2016). Based on this
    research, a network is defined as a form of cooperation that leads to better solutions
    for clients. The description mainly looks at how networks organize themselves.
    In the context of this research, no statements are made about the results achieved
    within the networks. It is specifically about how the interaction within a platform
    is designed.


    The mapping of relationship networks leads to the discovery or clarification of
    boundaries in system terms. Borders are important connectors. A network has boundaries:
    these vary in fluidity. It concerns boundaries at the organizational level and
    within professional domains. Networks are structure and process. One part of the
    process is the relationships and the community that create a network structure.
    A degree of consistency of interaction is required. In the start-up phase, a network
    is a project (team). When networks shift to activities, they develop a shared
    identity. This is followed by the phase of self-organization: there are shared
    skills and a sense of legitimacy. The last phase is when activities repeat themselves:
    it becomes a network of practice (Pomerooy 2018). How a network is designed depends
    mainly on how information flows through the organizations concerned (Aalbers 2015:
    8). The success of a network is determined by the organization of horizontal and
    vertical relationships and how the organization and professional boundaries are
    handled (Aalbers 2015: 143).


    Chain care fits within care if there is good collaboration between care providers
    within the same funding basis. Network care is aimed at setting up an integrated
    care demand where the different foundations (Social Support Act, Health Insurance
    Act, Long-term Care Act) are worked around and over (Fabricotti 2007). Due to
    its integrated nature, network care has a high degree of complexity with a high
    degree of management demand (Malby and Anderson-Wallace 2016).


    As indicated in this book, clients increasingly have a role to play in monitoring
    their health, but there are also people who have difficulty with this. Clients
    increasingly receive customized care at home in their own environment. In that
    context, they manage as much as possible themselves. All these developments require
    care that goes beyond the boundaries of individual care providers, disciplines
    and sectors: network care (IGJ 2018). Effective network care requires a number
    of preconditions (Kremer 2018):


    +   * Attention to values that motivate people from within

    +   * Balance between trust and clear agreements

    +   * Creativity from all participants'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'A network is a collaboration between individuals, organizations or small associations
    that bind themselves temporarily and equally, around a task, a theme or a challenge
    (Willems, Linck and Kaats 2018). The development of healthcare in care networks
    yields new questions, such as: What can be expected of healthcare and care providers
    in the cooperation in healthcare networks? Where do the responsibilities lie?
    When is coordination necessary? What is the role of the client and the role of
    the informal caregiver? Who is responsible for the coordination? Collaboration
    requires the fulfilment of 5 conditions: shared ambition, clear interests, a good
    relationship, an appropriate organization and a well-running process. Investing
    in collaboration skills leads to more successful partnerships (Boonstra 2007).


    Care networks are becoming increasingly common around clients. Elderly people
    who live at home often have to deal with different care and assistance providers.
    Together with informal care, they form the ‘network’ around the elderly. It is
    important for the patient that this care network works well together, certainly
    when a patient can no longer take good care of themselves. Care networks therefore
    fall into two main groups: organized networks of care providers (chain care and
    network care) and personal care networks around clients (care networks). Organized
    networks usually involve agreements with regard to target groups or within regions.
    A personal care network concerns all professional care professionals around a
    client.


    However, little is known about underlying collaboration processes under integrated
    care (Valentijn 2015). This research shows that relational collaboration mechanisms
    (interests and relationships) are more important than management collaboration
    mechanisms (process management) in the development of integrated primary healthcare
    projects. To achieve integrated primary healthcare, a multi-perspective approach
    is needed: people-oriented, population-oriented and value-driven. Mirella Minkman
    (2020) describes five factors to arrive at the appropriate scale:


    +   • Scale and volume (large volumes can lead to a local scale; what (specialist)
    knowledge is required)

    +   • Opportunities for digitization (what can be far and what must be close)

    +   • Region governance: what and who can bear responsibility

    +   • Balance between inclusiveness and efficiency

    +   • Experience and history of and within a region


    Networks of people are ecosystems. When there is ‘vital space’, people coordinate
    their efforts. Each individual gives up freedoms in exchange for what results
    from the collaboration. The interaction in the network moves between the poles
    of the I and the we. The path to vitality and co-creation is only open if they
    want to investigate the effect of their actions. In the course of its development,
    a vital network acquires emergent properties (Wielinga and Robijn 2018).'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Chains and networks must be designed depending on the characteristics of the
    client and their problems. This also involves new, integrated organizational forms
    around target groups based on their clinical picture, with disease management.
    With multimorbidity and vulnerability, the care and support process is characterized
    by variety. Customization is therefore required here (Nies 2012).


    The research of the Healthcare and Youth Inspectorate (IGJ 2018) into care networks
    shows the most important risks:


    +   • insufficient collaboration

    +   • non-coordinated care

    +   • insufficient transfer of care.


    The design of the interaction between client and professional is therefore a central
    element in the design of network structures. Pressure on the formation of a network
    may be the relationship between cooperating parties as well as within parties
    (Batterink 2004). A network determines and justifies its own area of responsibility.
    The starting point is the complexity and reality of the specific needs and questions
    of the target group within this area of responsibility. Healthcare professionals
    can be active in multiple networks. A network provides insight into the blind
    spots with regard to the care and support of people with a complex, long-term
    care demand (Van den Heuvel 2014).


    Kreijveld (2012) works out how individuals are connected via the internet and
    work together in networks. Through the internet, society will be more co-creative
    and take on more tasks itself (Rifkin 2014). The internet and social media have
    made it easier to collaborate and develop new ideas (Robertson 2015). On the other
    hand, the use of the internet also entails risks, for example in the area of privacy
    (Bridle 2018).


    Network structures in healthcare are defined as partnerships between autonomous
    care providers (including sole proprietors) with a common goal, joint risks, costs
    and revenues and joint decision-making. Bloem (Gepersonaliseerde zorg; speech
    2012) described it as care circuits: all those providers who look for people and
    use them to do something about their health. It often turns out to be a search.
    Incidentally, there are many guides (health insurers; commercial parties (Lekker
    Leven; Leefstijlgids); municipalities (Wmo desk); care organizations (member associations)
    and private initiatives (care cooperatives)) involved in the search. New forms
    of network structures are initiatives from citizens who organize the care themselves:
    half-line care (Nies 2012).


    Zegveld (2018): when studying a network, it is important to have a clear picture
    of the limits. Network analysis is a means to describe reality (at an abstract
    level). The network approach is based on the idea that patterns in the relationships
    between actors in the network have important consequences for these actors (Zegveld
    2018, 45). Social networks determine the possibilities and impossibilities to
    which individuals and groups are entitled.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Network participants each have their own goals, resources, priorities, vision,
    target group and culture (Van den Else 2017). Within most, (technological) product
    innovations are developed and process innovation is to a lesser extent (2017,
    10). By placing responsibility with professionals, organizational forms can arise
    around work processes (chains) that transcend the boundaries of one’s own organization
    (Homan 2005). Because information is available, professionals can independently
    come to: distribution of (shared) resources, accountability of own resources,
    mapping effectiveness and efficiency and elaboration of operational plans.


    At the network level, physical and data connections also come together. Collaboration
    via (data) platforms is becoming increasingly common. A healthcare network consists
    of healthcare providers from various organizations. The exchange of information
    is therefore of great importance (ParkinsonNet 2019).


    In this perspective, a future-oriented healthcare company will be characterized
    as a network organization where people work who feel addressed by a common vision
    that is in line with their own values (Roobeek 2005). This is possible within
    existing organizations, but also by starting a healthcare company yourself.


    Evaluation of networks can be done on the basis of four levels of outcome indicators:


    +   - Individual: impact on individuals within the participating organizations
    and on individual clients. Indicators are: quality of life of clients or customer
    satisfaction

    +   - Organizational: impact on participating organizations (referrals, financial
    health, name recognition)

    +   - Network: evaluation of the network itself: how active are participants

    +   - Community: contribution of the network to the population it serves (local
    employment, healthcare costs, accessibility of care) (2017, 2013)


    Within care organizations, the process of care and service provision is focused
    on a client-friendly meeting of client demand, which determines the organizational
    design.


    Responsibilities and authorities with regard to the primary care process are positioned
    as low as possible in the organization (self-organization; self-management).


    In practice, there appears to be no formal ‘care networks’ around vulnerable elderly
    people living independently. The directorship of care and assistance is primarily
    the responsibility of the elderly themselves. Although attention is paid to the
    importance of cooperation between care providers, the lack of preconditions seems
    to stand in the way of development: financing that makes (intensive) cooperation
    possible and agreements on data exchange and privacy.


    Verver (Verver, Merten en Wagner 2016: 9) presents a number of recommendations
    regarding healthcare practice:'
