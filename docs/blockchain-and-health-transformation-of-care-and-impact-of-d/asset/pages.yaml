  md: '# Satoshi Nakamoto (2009)


    The root problem with conventional currency is all that is required to make it
    work. The central bank must be trusted, not to debase the currency, but the history
    of fiat currencies is full of breaches of that trust.


    Banks must be trusted to hold on our money and transfer it electronically, but
