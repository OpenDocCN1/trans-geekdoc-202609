  md: '# Use of Databases


    The Scopus database was used to conduct this systematic literature review. To
    clarify which articles are important for answering the research questions, an
    evaluation took place based on the following criteria:


    +   1. Scope: A data range of 2010-2020 was chosen. Furthermore, only original
    studies were included in the selected data.

    +   2. Data sources: Only cited journals are selected for the data research.

    +   3. Language: Only sources in English are included in the Systematic Literature
    Review.

    +   4. Relevance: The titles of the studies were scanned for relevance to the
    defined research field “Implementations of Blockchain in Healthcare”.

    +   5. Inclusion: Studies should meet the inclusion criteria as mentioned in point
    2, 3 and 4. Studies that do not meet these criteria were not included in this
    further study.

    +   6. Specificity: Studies that meet the topic “Implementations of Blockchain
    in Healthcare” will be read.

    +   7. Data: Studies that are read in their entirety are analysed to help answer
    the research questions. To search for relevant publications, a query, as defined
    below, was used to answer the first three sub-questions. The query and related
    strings are based on the research field and the defined research questions. The
    following search terms were defined and used:


    ```

    (blockchain OR "block chain") AND

    (healthcare OR health OR medic* OR

    Medical OR medicine OR *health*) AND

    (implementations OR usage OR realization OR execution)

    ```


    The search in the scientific database Scopus took place in November 2020.


    The query containing the related strings was kept as broad as possible to include
    as many results as possible in the in-depth study. The search of the query resulted
    in 383 publications. The initial selection was based on the search terms in title,
    keyword and abstract. To answer the research question ‘what factors are considered
    in the adoption of blockchain solutions’, we looked for a relevant framework.
    This framework should provide insights from different contexts into what considerations
    are important when adopting blockchain as a solution. This insight was gained
    from the TOE framework. The TOE framework is described in the book by Tornatzky
    and Fleisher, entitled “The processes of technological Innovation” (Tornatzky
    & Fleischer, 1990).'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'In this book, Tornatzky and Fleisher describe the innovation process from development,
    adoption to final implementation. The TOE framework states that three principal
    contexts - technological, organisational, and environmental - influence the process
    by which an organisation adopts and accepts a new technology (Lippert & Govindarajulu,
    2006). The aim is to use the TOE framework in identifying and categorising the
    factors within the technological, organisational, and environmental contexts that
    are considered when adopting blockchain as a technology. Figure 1 visualises the
    TOE framework.


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_20_0.png)


    Figure 1. TOE-framework (Tornatzky & Fleischer, 1990).


    To search for relevant publications, a new query was used, as defined below. The
    query and related strings are based on the research field and the defined research
    question. The search took place in March 2021. The following search terms were
    defined and used:


    ```

    ("factors" OR "restrictions" AND "Blockchain" AND "adoption");

    ("blockchain" AND "TOE" OR "toe-framework")

    ```


    # RESULTS


    The selection from Scopus Database, based on the query mentioned on page 8, started
    with 383 publications for answering the first three sub questions. The further'
