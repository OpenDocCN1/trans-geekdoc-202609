    # Smartly Combining Blockchain with AI and the IoT


    The convergence of blockchain, AI and the IoT can enable organizations to maximize
    the benefits of each of these technologies while at the same time minimizing the
    risks and limitations associated with them. Given that the IoT networks include
    a large number of connected devices, there are numerous vulnerabilities, making
    the network susceptible to hacker attacks, fraud and theft. To prevent security
    issues, AI powered by machine learning can proactively defend itself against malware
    and hacker attacks. The security of the network and the data can be further improved
    by means of a Blockchain that can minimize illegal access to and alteration of
    the data on the network. AI can also improve the functional capacity of the IoT
    network by making it more autonomous and smarter.


    A combination of Blockchain, AI and the IoT technologies that influence the potential
    of how companies, industries and even economies function will redefine these three
    more than they do now. Some applications and concepts have already shown an overlap
    between these technologies with promising results (Odyssey 2020). An example of
    this is the combination of AI and Blockchain to manage the unmanned air traffic,
    making mass autonomous flying safer. This application alone will redefine the
    aviation and logistics business.


    The expected impact of the convergence of Blockchain, AI and the IoT is not (yet)
    foreseeable, and existing applications are not (yet) perfect. Many organizations,
    especially the early adopters, have very high expectations for the value of cognitive
    technologies and therefore want to invest in them. Findings from applications
    are now (still) at an early stage and are not yet as advanced as necessary to
    achieve real transformation, nor are the business models that will be key in this.
    The same can be said of the IoT in combination with Blockchain. With increased
    interest, investment and innovation, the convergence of the Blockchain, AI and
    the IoT will become reality.


    # Blockchain and Health Information Exchange (HIE)


    Blockchain enables a distributed and decentralised environment with each central
    authority. Healthcare is an industry in which Blockchain is expected to have significant
    consequences. In recent years, health information exchange (HIE) has shown that
    it benefits the health care system. Research (Vishnoi 2020) has shown that Blockchain
    can help to improve several aspects of the HIE system.


    When Blockchain meets HIE, there are only two issues. Firstly, the existing systems
    are not patient-oriented in terms of data governance. Patients do not own their
    data and'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'have no direct control thereafter. Secondly, there is no particular protocol
    between the different systems for sharing sensitive data. In order to refute the
    two issues, the Blockchain Lab of Arizona State University conducted a study and
    presented a MedFabric4Me. This is a system for HIE based on Blockchain. In this
    rather technical case about MedFAbric4Me, we delve deeper into this system.


    # Healthcare Information Exchange (HIE)


    Healthcare Information Exchange (HIE) is the electronic transfer according to
    national standards of healthcare related data between medical facilities, public
    authorities and health information organisations - companies that supervise and
    regulate the exchange of these data.


    The purpose of HIE is to promote proper and safe access and retrieve health information
    from a patient in order to improve the cost, quality, safety and speed of patient
    care. Although HIE usually refers to the act of exchanging information between
    two or more organisations or healthcare providers, it may also refer to an organisation
    responsible for facilitating the exchange.


    # CASE 3: HEALTH INFORMATION EXCHANGE AT MEDFABRIC4ME


    MedFabric4Me is a patient-focused system where patients own and share their healthcare
    data based on necessity. Arizona State University with its Blockchain Lab is a
    knowledge partner of the Blockchain professorship and also conducts specific research
    into Blockchain and healthcare. This case MedFabric4Me is an example of how Blockchain
    can be used effectively in healthcare.


    First, an analysis was performed of the requirements for a patient-oriented system
    that ensures fraud-proof sharing of the data among the participant. This system
    contains a mechanical system that ensures that data cannot be manipulated. A distributed
    Proxy encryption system has been used to securely encrypt data during storage
    and data sharing. In addition, the combination of on-chain storage and on-chain
    access management has been applied for authenticity and privacy.


    # On-Chain and Off-Chain


    MedFabric4Me is a two-part solution platform consisting of on-chain and off-chain
    components. The on-chain solution is implemented on the secure network of Hyperledger'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Fabric while the off-chain solution uses an Interplanetary File System to store
    data securely. An Ethereum-based Nucypher – a Proxy re-encryption network – provides
    cryptographic access control to actors for encrypted data sharing.


    To demonstrate usability and scalability, a prototype solution from MedFabric4Me
    has been implemented and evaluated as the performance benchmark of the system
    against an already implemented HIE. The results show that decentralised technology
    such as Blockchain can help to reduce some of the problems HIE faces today, such
