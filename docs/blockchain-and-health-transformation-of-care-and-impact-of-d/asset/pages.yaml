    # # ANSWER TO THE RESEARCH QUESTIONS


    In this section, the questions posed in Section 6.1 will be answered based on
    the data obtained and analyses made in the Systematic Literature Review.


    The first research question concerns the development of implementations of blockchain
    solutions in recent years within the healthcare sector. Based on this systematic
    review, it can be stated that many implementations of blockchain in healthcare
    are still in the planning and development phase and have yet to be implemented
    and evaluated. However, the Systematic Literature Review does show that the number
    of publications dealing with the implementation of blockchain solutions has risen
    sharply. This means that the blockchain research field in healthcare remains interesting
    and is continuing to develop. This observation can be justified by the increase
    in the number of cited publications. As of 2019, a clear increase in the number
    of citations in relation to the number of publications can be observed. This means
    that the domain of blockchain in healthcare is gaining greater impact.


    The second research question is about what the main trends of implementations
    of blockchain solutions within healthcare are. Important trends that emerge from
    this Systematic Literature Review relate to the sharing of data between organisations.
    This mainly concerns increasing interoperability. Another examined trend within
    the area of blockchain solution implementations concerns the sharing of healthcare
    data which is often linked to self-sovereign identification (SSI). Deloitte also
    outlines this trend in its report “five blockchain trends for 2020” (Deloitte,
    2020).


    Another important trend within healthcare is that many initiatives are being taken
    to disruptively adapt existing business models using a blockchain solution. Between
    the years 2019 and 2020, a clear growth can be observed in the number of publications
    that deal with initiatives to disruptively adapt existing business models using
    a blockchain solution. Of the selected publications, an increase of 50% can be
    observed on said initiative. This mainly concerns the disruptive adaptation of
    business models that deal with granting permission within the process of sharing
    medical data. In addition, there are'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'initiatives about the implementation of blockchain solutions that improve the
    existing business model of transporting the blood supply from patient to blood
    test result. There is also a trend in publications leading to improved transactions
    between organisations. If the year 2020 is compared with the year 2019, an increase
    of 80% can be observed in the number of initiatives in which implementations of
    blockchain solutions lead to the improvement of transactions between organisations.
    However, the discussion is that the data collected relates to the years 2019 and
    2020 and there is insufficient progressive insight as to whether these mentioned
    trends will continue.


    The third research question concerns the division that is visible within the phases
    of adoption about Blockchain in healthcare. To answer the question properly, a
    connection was sought with the phases of adoption as defined by Rogers and Pierce
    & Delbecq (Pierce & Delbecq, 1977) (Rogers, 1995). The adoption process consists
    of three phases: Initiation, Adoption (decision-making) and Implementation.


    The initiation phase relates to the need to identify a solution, for which awareness
    is created. This leads to identifying suitable innovations and proposing some
    innovations for adoption (decision making) (Duncan, 1976) (Rogers, 1995). The
    adoption (decision making) phase reflects the evaluation of innovations from technical,
    financial, and strategic perspectives, where the decision is made whether to accept
    an innovation (Meyer & Goes, 1988). The last phase concerns the phase of implementing
    the innovation. It involves actions related to adapting the innovation, preparing
    the organisation for use, trial use, acceptance of the innovation by users and
    scaling up the innovation (Rogers, 1995) (Meyer & Goes, 1988) (Duncan, 1976).
    By linking to Table 3, phases of implementation of blockchain in healthcare, a
    picture can be obtained of the adoption phase of blockchain in healthcare. The
    majority of the 38 selected publications are still in a plan or development phase.
    As described in chapter 7, the plan phase is about forming a plan and the impact
    of the solution offered on the organisation within the healthcare sector. The
    development phase is about developing the solution and shaping organisational
    change. This plan and development phase corresponds to the definition of the initiative
    phase from the adoption process, as defined by Rogers and Pierce and Delbecq (Rogers,
    1995).


    The fourth research question concerns the factors that are considered when adopting
    blockchain as a solution. To this end, a connection was sought with the theory
    of Tornatzky and Fleischer, in which insight was gained into the considerations
    relating to the adoption of technology from various contexts (Tornatzky & Fleischer,
    1990). For this purpose, the TOE framework was taken as the starting point. Selection
    from the Scopus Database resulted in 8 publications, which were coded according
    to the different considerations, reasoned from three different contexts. The main
    factors considered are the availability of blockchain as a technology, organisational
    readiness, and competitive pressure. An interesting area of research within the
    adoption considerations is organisational readiness. Where, in terms of organisational
    readiness and organisational'
