    # ## Informal Care


    In the coming years, an appeal will increasingly be made to individual responsibility
    and also to the municipal responsibility for care and welfare. Informal care is
    the care that, from a personal relationship and often unpaid, is offered to people
    with a (chronic) illness or disability. These are partners who look after each
    other, children who look after their parents, parents who look after their children
    and friends or neighbours who help each other.


    Collaboration with family and informal care around healthcare and support are
    becoming increasingly important in elderly care. When setting up network structures
    between professional care and informal care, there are four roles that an informal
    caregiver can play: as a colleague, expert, client and neighbour. Which role is
    most prominent may differ, for example, due to the phase of the disease or the
    living situation of a patient. The emphasis on collaboration is different for
    each role. A lot of attention is paid to digital systems to support the collaboration.
    Platform technology reinforces the role of the informal caregiver.


    The interdependence between informal care, deployment of volunteers and professional
    care has a dynamic nature. There are shifts from different perspectives: from
    the control options of a certain target group, from the policy vision, from the
    place where care can be provided (nursing home care in the home situation), the
    way in which care is organized and the possibilities for digital technology. The
    number of informal carers in the Netherlands is approximately 4 million people
    (one third provide both intensive and long-term care) (InvoerMantelzorg). The
    pressure on informal caregivers is expected to increase. Sharing information is
    important for the position of informal caregivers (SCP 2019).


    # ## Quality Framework


    The focus on strengthening social networks is more important for living at home
    longer than for adapting homes. Citizens are increasingly thinking about how they
    live and want to arrange care in their own neighbourhood or village and take action.
    There are initiatives that focus on mutual assistance and socializing; others
    purchase care or arrange the Wet maatschappelijke ondersteuning (‘Social Support
    Act’; Wmo) applications themselves. In short, an infrastructure is needed that
    can support the diversity of initiatives (a logical consequence of personalized
    care).


    In the outline agreement for district nursing 2019 - 2022, the foregoing is detailed
    as follows:'
