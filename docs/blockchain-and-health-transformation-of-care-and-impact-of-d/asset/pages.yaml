- pgno: 243
  md: 'The deployment of volunteers is mainly based on standards and values that fit
    in to mean something to the other (Rossen 2012). Preconditions for volunteer organizations
    concern the provision of appreciation, satisfaction and scope for self-determination.


    The elderly are entitled to driven professionals who respect their own position
    and role. A vision must convince clients rather than persuade them (Geursen 1996;
    Geursen 2000). The way of working should be organized around the problem of clients.
    The core values form the foundation for the decision-making process and determine
    how management, professionals and clients interact (Older people 2004).


    Identity relates, among other things, to concepts such as (recognizable and experienced)
    vision, core values and motives. One of the cases studied is the ‘Netwerk patiënt
    onderzoeksvragen’ (‘Network patient research questions’). The relationship between
    professionals and patients can be described as asymmetrical due to the difference
    in social status and the added value to the knowledge of both groups. Elberse
    (2012) therefore advocates the application of inclusion strategies. He distinguishes
    three categories:


    +   * Circumstances: precautions related to preparation and organization (creating
    basic conditions)

    +   * Behaviour

    +   * Verbal interaction.


    People are often unaware that they exclude others through verbal and non-verbal
    communication. A network offers opportunities to ensure that people feel that
    they are part of a group. Strategies to improve partnerships between patients
    and researchers should focus on training in the necessary competencies (awareness
    of patient participation, a positive attitude, skills and knowledge) and building
    a strong network structure.


    # Client Perspective: Platform Structures


    This chapter describes a number of platforms that have been designed from a client
    perspective:


    +   * ‘Humanising van de ouderenzorg’ platform

    +   * ‘Nieuwe zorg’ platform

    +   * ‘De Academische Werkplaats Ouderenzorg’ platform

    +   * Stichting Digitale Zorg

    +   * Samenwerkende Academische Netwerken Ouderenzorg'
  merge: -1
  img_proc: true
- pgno: 244
  md: '+   * OZO Verbindingorg

    +   * Zorgplatform ouderen

    +   * Nationaal Programma Ouderenzorg

    +   * Bet er Oud

    +   * IkWoonLeefZorg.nl


    There is a wide variety of platforms. In the context of this research, platforms
    were sought that provide insight into how clients are involved in the design of
    the services. The description mainly looks at how networks organize themselves.
    In the context of this research, no statements are made about the results achieved
    within the networks. It is specifically about how the interaction within a platform
    is designed.


    The technology that makes remote monitoring and care possible will be increasingly
    used. This further strengthens self-direction (self-management) for clients. The
    IT infrastructure (electronic client file) supports both caregivers and professionals
    (Kool, Verhoef and Kremer 2014). This makes the care around the client and his
    or her network much more person-oriented. When determining what a client needs,
    the client and his or her social network become the starting point (Noddings 2002).Research
    into client platforms shows that clients can learn a great deal from each other.
    The care is in line with what the client needs and what the client’s own network
    cannot handle (Poortvliet, Vennekens en Heine 2011).


    How will platform technology strengthen the position of clients (and professionals)?
    Parker (2016): a platform is a business based on value-creating interactions between
    producers and consumers. A platform is the common basis of technologies, technological,
    economic and social rules and agreements (such as standards) on which multiple
    players can jointly develop additional technologies, products or services (Kreijveld,
    Deuten and Van Est 2014).


    Organizations always revolve around regulating or utilizing supply and demand
    friction in one way or another (Strikwerda 2014). For example, a hospital organizes
    the demand-supply friction between people who are sick and people who can heal.
    Platform friction eliminates those frictions. We are thus going from organizations
    to organizing (Aslander (2010; 2015): occasional partnerships). IT and platforms
    are increasingly becoming the critical success factor for organizations. That
    also applies to professionals: by using platforms, you maintain your knowledge.
    Organizations can create access to the latest technology through their own innovation,
    partnerships or technology investments.


    Platforms build totally new business models at a very low cost that destroy old
    markets. An important element is the impact of freely accessible information.
    Organizations are increasingly being designed as platforms (organizing). Platform
    technology reinforces the position of clients (and professionals). Parker: a platform
