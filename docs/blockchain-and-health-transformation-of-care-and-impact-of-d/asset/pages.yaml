    Figure 20. Blockchain convergence & competences.


    # CASE 4: THE VGZ INNOVATION TEAM DEVELOPS AN APP FOR MATERNITY CARE


    Health insurer VGZ is strongly focused on mapping innovation and technology for
    care. A lot of attention is paid to the practical implications of technological
    innovation (basic principle 2). There is an innovation team that is focused on
    the innovative application of relevant technology for the health insurer and healthcare.
    The I-Team Digital Innovation deals with:


    +   - trend monitoring (e.g., digital humans and quantum computers)

    +   - design of pilots (e.g., the Maternity Care practical trial and working with
    chatbots)

    +   - advising on a digital care strategy for VGZ'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Development


    Blockchain is one of the topics proposed by the Board of Directors to move on
    to a deeper level. The first advice of the innovation team was to follow the development,
    but not yet to do any concrete experiments with it. At the request of the Supervisory
    Board, the Blockchain phenomenon was examined further. As a result, knowledge
    has been built up so that VGZ can take a good look at developments and any application
    for healthcare and the health insurer. Subsequently, the opportunity arose to
    run a practical trial in maternity care. Together with the Healthcare Institute,
    the I team developed a demo to test the added value of the growing Blockchain
    chain (basic principle 1). The Zorginstituut had developed a working app – called
    Geertje - which was converted together with VGZ for maternity care.


    The maternity caregivers involved were very enthusiastic about the functionality
    of the app. This also applied to the three maternity care organisations involved.
    The app led to a clear reduction in the administrative burden. Nevertheless, it
    was decided not to continue. The reasons were:


    +   - Blockchain works best when many parties are involved (the practical trial
    had a limited number of participating parties). Blockchain is about building consensus
    (basic principle 3). Consensus becomes stronger if more parties are involved.
    The number of parties in the various care chains is limited and the strength of
    the consensus is therefore also limited.

    +   - Blockchain in healthcare is mainly about data around people. This puts the
    privacy issue at the centre. Although the personal data were encrypted, the process
    around logging in and retrieving encryption keys today requires a trusted third
    party. One of the most important advantages of Blockchain is that no dominant
    trusted third party is needed. But precisely because it is created for security
    purposes, this advantage is gone.

    +   - Existing technology was able to deliver the same functionality via an app.
    This means that administrative burden reduction can also be achieved at lower
    costs at this stage.


    Safeguarding privacy with data storage (basic principle 4) is an essential part
    of Blockchain’s application in healthcare. There are developments around self-sovereign
    identity – validation by combining data from different parties – that will guarantee
    privacy in the long term. On the other hand, the best way to store data reliably
    is to disseminate it as little as possible. Data storage can take place on a private
    Blockchain. Important developments include:'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   - Increase agility of organizations and professionals

    +   - A sense of urgency to continue digitisation (including due to COVID-19)

    +   - Artificial intelligence focused on early diagnosis and self-diagnosis (e.g.,
    SkinVision)

    +   - Standardisation of healthcare operations (e.g., Bergman Clinics)

    +   - Lifestyle interventions (e.g., GezondmetSalut)


    # DESIGN PRINCIPLES FOR INTRODUCING BLOCKCHAIN IN HEALTHCARE


    The basic function of each Blockchain is to bring digital information together
    in a collection (a block) that cannot be changed. This is of great importance
    when designing an electronic client file (ECD) or electronic health record (EHR).
    For healthcare, Blockchain offers the opportunity to improve collaboration, safeguard
    trust and achieve interoperability.


    In this chapter, we discuss developments in technology, the design principles
    for introducing Blockchain and the design of interoperability.


    # Different Way of Thinking


    Blockchain leads to a different way of thinking by being able to capture transactions,
    creations and events. It is a *foundational technology*: it has the ability to
    create new foundations for our economic and social system (Harvard Business Review
    2019: 7). There are five principles that determine this technology.


    +   1. Distributed database: Each party on a Blockchain has access to the entire
    database and history.

    +   2. Peer-to-peer transmission: horizontal communication.

    +   3. Transparency and pseudonymity: Recording identity with the possibility
    of anonymity.

    +   4. Irreversibility of files: Once a transaction has been recorded in the database,
    it can no longer be changed.

    +   5. Computer logic: algorithms can be applied.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'As a group, Blockchains are called distributed ledger technologies (Williams
    2019: 60) or a distributed ledger. Blockchain is in fact a simple technology that
    works like a permanent, non-hackable ledger for virtually any type of information
    that someone wants to capture (Williams 2019). Anyone participating in a Blockchain
    is considered a ‘node’ in a network. When changes are made to a Blockchain, this
    is done in all nodes. Decentralised systems are non-hierarchical groups of interconnected
    nodes. Distributed systems are radically decentralized systems (Williams 2019:
    47).


    The IBM Institute for Business Value Blockchain Survey identifies nine areas of
    healthcare where disruption by Blockchain technology will take place (Nichol 2018):
    medical device data integration; asset management, client files, clinical trials,
    safety monitoring with regard to side effects, medication compliance, regulatory
    compliance, invoicing and claims and contract management.


    In the area of COVID-19, Blockchain can capture an unchangeable trace of whether
    patients have developed antibodies. Access to information is significantly simplified
    through the use of technology. Clients can take better decisions if they have
    the right information. We therefore increase our *healthcare literacy*: the extent
    to which we have the ability to collect, record and understand healthcare information
    in order to arrive at better health decisions.


    # Technological Developments in Healthcare


    Blockchain can play multiple roles in technological improvements (Williams 2019:
    125):


    +   1. Provide medical reports (ECD and EHR).

    +   2. Agreement to share data in these files.

    +   3. Payments to clients who promote health and thereby reduce healthcare costs.


    Blockchain can bring an important innovation to the activities of health insurers.
    Blockchain technology applied to healthcare has the potential to reduce fraud
    and develop new business models (Nichol 2018). Medication policy is essential
    for effective healthcare (Czeschik and Stambolija 2018). When information about
    diagnoses and procedures is stored on Blockchain, there is virtually no room to
    manipulate this information to increase revenue. Medical devices are connected
    via Wi-Fi, Bluetooth and other interfaces. However, this leads to vulnerabilities
    caused by hackers.


    How does Blockchain work within healthcare in practice:'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   - The client receives a code (hash) and an address that provides codes
    to unlock client data. If the client data are not stored in the Blockchain, the
    Blockchain provides authentication or the necessary hashes to access data.

    +   - Care providers (care professionals) receive a separate universal signature
    (code or hash). When this hash is combined with the hash of a client, this ensures
    the authentication in order to be able to unlock data in a file.

    +   - In his profile, the client defines the access rules required to access his
    file.

    +   - When the client defines a 2-of-2 code via eHerkenning, two computers (hashes)
    are required to gain unauthorized access to data.


    The advantages of this (Nichol 2018) are avoiding intermediaries, strengthening
    the management role of clients, integrity of data and reaching consensus.


    Blockchain''s application in healthcare can be distinguished in five separate
    fields (Czeschik and Stambioja 2018):


    +   - ECD management

    +   - medication management and planning

    +   - invoicing and payment cycle

    +   - logistics and chain management

    +   - connected medical devices


    What other application possibilities are there? This concerns the following areas:


    +   - Chain management: monitoring and tracking of medicines; temperature determination
    for transport.

    +   - Clinical trials: building consensus between different websites, systems
    and protocols and client data profiles.

    +   - Online database of a provider: maintain worklists quickly and adequately.

    +   - Client reports: bringing information from different data files together;
    translation into user-friendly development (diagnosis; medicines; consultations).


    These applications greatly reduce costs:


    +   - Costs for ‘searching’ for cases to almost zero (everything can be found
    quickly).

    +   - Smart contracts replace current contracting and payment.

    +   - Coordination costs of sources outside the organization are largely eliminated.

    +   - Costs for trust largely expire.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Defibrillator with smart contracts


    A practical example from healthcare. A patient with arrhythmias has an atrial
    defibrillator inserted. The device was supplied by company X with serial number
    Y. During the production process, a Blockchain was created to be able to track
    the device. A hash to identify this unique device is stored in the Blockchain
    with other relevant information. The hash of the device information is stored
    in an unchangeable digital ledger. The implanted defibrillator is linked to the
    patient and the device''s Blockchain is updated with information from the hospital
    and the GP regarding the care of this patient. The device is supported by a number
    of smart contracts that automatically inform the patient and healthcare providers
    if the device needs to be adjusted or if irregularities are detected (Nichol 2018).


    Blockchain can help solve barriers caused by strict healthcare regulations. This
    specifically concerns exchanging data (IBM 2018). Blockchain makes it possible
    to share client data in a uniform manner. Three major challenges concern:


    +   1. Individual autonomy: self-ownership of identity

    +   2. Scalability: chain transactions

    +   3. Introperability (open interaction between systems)


    Individual autonomy concerns the principle that every client is the source and
    thus the owner of their own identity. Blockchain technology gives clients control
    over their own identity, access to the data and the authority to determine who
    can see that data.


    # Seven Design Principles


    Blockchain has the potential to decentralise traditional supply chains and combine
    them with AI and the IoT, creating new value networks (Tapscott and Tapscott 2018).
    Data can be used better if they can be used freely and safely within and between
    the various healthcare domains. The establishment of a shared network between
    providers, professionals and clients strengthens clinical outcomes of a healthcare
    process. Fraud can also be prevented.


    Blockchain has seven design principles:


    +   1. Network integrity

    +   2. Distributed power

    +   3. Value as incentive

    +   4. Security'
  merge: -1
  img_proc: true
- pgno: 115
  md: '+   5. Privacy

    +   6. Rights are preserved

    +   7. Inclusion


    When Blockchain is applied in healthcare, it is a shared platform that decentralizes
    data using a high degree of security. Blockchain makes it possible to work with
    a care passport that contains relevant data. The use of medication can also be
    monitored via track and trace, which shows the quality of care over a certain
    period of time. By working with portable devices such as smartwatches, clients
    can provide real-time information for monitoring and realizing outcomes. Through
    the secure sharing of data, the quality of care plans is improved, thereby simplifying
    administrative processes and avoiding unnecessary care deployment.


    Here, too, the use of smart contracts creates an audit trail with regard to the
    various aspects of care deployment. In Chapter 4.1, we mentioned Prescrypt. Prescrypt
    makes it possible for chronically ill people to get prescriptions that are secured
    on a Blockchain. This gives the client control over his medication and the accessibility
    of his information. Clients decide which healthcare professionals they want to
    share their data with and which pharmacy they want to send their medication overview
    to. This is illustrated in Figure 21.


    Philips Healthcare uses Blockchain technology for welfare apps and client ID programs.
    Blockchain would make a central intermediary unnecessary under specific conditions,
    or under other preconditions could be limited to the management of partial databases
    (Czeschik and Stambolija 2018). Another product based on Blockchain is MyClinic.com.
    MyClinic makes it easy to make appointments, view medical records and schedule
    follow-up examinations. The objectives are accessibility and control for the client
    and simple contact between healthcare professional and client (Medicalchain).


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_115_0.png)


    [icon name="fa-eye" class="fa-2x pull-left"The blockchain is a technology that
    enables two unknown parties to transfer a unique piece of digital property, without
    the need for a central authority - all in a safe, trustworthy and guaranteed way.


    Figure 21. Blockchain in healthcare, Radboud UMC REshape Centre.'
  merge: -1
  img_proc: true
