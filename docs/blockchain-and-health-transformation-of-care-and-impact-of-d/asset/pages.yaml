  md: 'Freedom is also connected with autonomy. According to De Blok (2010), professionals
    within healthcare organizations have few opportunities to be relieved of the limitations
    that the organization imposes on them. ‘At Buurtzorg these obstacles are missing,
    and there is great reliance on the personal capacity to act “from within.”’


    The starting point of Buurtzorg is a human vision and not a healthcare vision
    (Van Dalen 2010). This human vision applies broadly in healthcare: holistic, social
    context, trust, autonomy and self-esteem. The distinguishing feature is the translation
    into practice-related practice and the rules that are applied. Buurtzorg has a
    number of leading organizational principles:


    +   - The starting point for organizing is the content of the care.

    +   - Care is based on self-organization.

    +   - Supporting/coaching instead of managing.

    +   - Organizing as a continuous process.


    Clients have confidence in the care professionals of Buurtzorg (De Veer 2008).
    Sufficient time is set aside for the care and the treatment and professionalism
    are very good. The quality of care is experienced as above average. Buurtzorg
    has the following objectives: the client has one permanent well-trained care provider
    for coordinating all care with as few different hands as possible at the bedside;
    healthcare professionals have professional freedom to provide generalist care;
    GPs work together with the care providers at Buurtzorg. The core concept is that
    there is trust in and familiarity with Buurtzorg employees. The healthcare professionals
    easily adapt to the situation of clients. The information transfer is good. Shared
    Decision Making (SDM) translates at Buurtzorg into:


    +   - Personal attention to the client

    +   - Involving caregivers and loved ones

    +   - Relationship between client and care provider: the course of care is determined
    together with client and informal care (Van Meijeren 2014).


    A small number of clients state that they are asked about their wishes with regard
