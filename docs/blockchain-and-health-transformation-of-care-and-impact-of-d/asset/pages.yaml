- pgno: 158
  md: 'The point of departure is that there is a tension between policy standardization,
    namely that healthcare is very complicated and the practice, namely that part
    of the healthcare in the home setting, is usually not complex. There has been
    a shift here. The starting point is that the vulnerable elderly citizen can continue
    to live in his or her own living environment for as long as possible (Bovenkamp
    2010). With age, the vulnerability (of a part) of the population increases, and
    the complexity of the demand for care increases.


    The question is to what extent you can achieve common meaning in the relationship
    between client and professional. Important instruments for this are the dialogue
    and the structure of the interaction (De Bruijn 2014). It is precisely at the
    interface between baseline, first, second and third line is that it is desirable
    to arrive at an effective implementation of care domains. In other words, how
    do you bring the directing role of clients (Van Montfort: prosumer) together with
    the expertise of professionals.


    # Quality, Effectiveness and Efficiency


    Demand-driven management has five central elements (Van der Kraan 2006: 261):


    +   • Sovereignty of the care recipient;

    +   • Control of the care recipient over the care offer;

    +   • Skills of the care recipient to exercise control;

    +   • Responsiveness of the supply side with regard to the demand perspective;

    +   • Mutuality between field parties in the pursuit of demand-managed care.


    The new generation of the elderly will increasingly take the lead in innovation.
    Both the client and the environment will change in interaction. Another factor
    is that generations use different values (Becker 1992; Bontekoing 2014; Boshma
    2010). Innovation comes in the form of: products (medication or medical technology),
    services (treatment methods), models (financing and collaboration) and social
    changes (culture). Elderly care is characterized by the fact that views, applications
    of (information) technology and positions of professional expertise change and
    innovate simultaneously (Breedveld 2013).


    On the side of both the client and the professionals and in the interaction, shifts
    will take place in the future (future environment). For the client, three criteria
    apply for assessing the care:


    +   • Quality of healthcare: Does the professional offer good care?

    +   • Effectiveness of healthcare provision: Does the professional offer the right
    care?

    +   • Efficiency of healthcare provision: Do I get value for money? (Porter and
    Teisberg 2006)'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Quality, effectiveness and efficiency take place in interaction. The client
    has a central role in that: it is about how the client experiences the various
    interventions and what possibilities they have for professionals. Clients are
    active givers of meaning: they construct their reality themselves and assign meaning
    to their environment (Hauwert 2018: 50). Guba and Lincoln (1989) assume that it
    is not only about individual interpretation and giving meaning, but also about
    the interpretation and meaning sought in dialogue.


    Grounded theory was developed in a school of nursing (Glaser and Strauss 1965).
    The aim of grounded theory is to generate a theory (Glaser and Strauss 1967).
    By understanding underlying processes professionals can intervene to help resolve
    client’s concerns (Glaser 1978). Grounded theory was influenced by symbolic interactionism:
    a client and a professional act towards things on the basis of the meanings that
    these things have for them (Charmaz 2008). There are many versions of grounded
    theory (Calam 2006).


    # Conceptual Model


    What is needed is ‘inclusive model making’, which can provide insight into interaction
    (Van Twist 2018: 125). People mould models, but models also make people. This
    is because models have the pretension of mastering professional practices (2018:
    133). Inclusive modelling is about building models in interaction with those involved
    and stakeholders. Vermaak (2017): modelling is construction work. Models have
    a function to create a provisional order that enables insight, deepened in interaction.


    Reality is not unambiguous and is open to different interpretations (Charmaz 2010).
    This applies to interactions between clients and healthcare professionals, but
    also between different clients and between different healthcare professionals.
    Self-organization: a system may be said to be self-organizing if it can alter
    its internal structure to increase its level of adaption (Beer 1979; 1981; 1985).
    Variety: is the number of possible states or conditions of a system and is an
    indication of the complexity of a system. Interaction: focuses on mutual influence
    between client and professional to strengthen the client’s directing role. Client:
    a client is someone who is able to formulate a question based on self-management
    to which an (professional) answer is possible. Professional: a professional is
    characterized by being able to take responsibility, through self-regulation and
    based on professionalism, for his or her own actions aimed at solutions for clients.
    Information: information is a difference that makes a difference in the interaction
    between client and healthcare professional.


    There are no certainties in advance in the interaction between client and professional.
    The same expression can be used in different contexts: its meaning is determined
    by its use in different contexts. If the environment changes, the self-organizing
    system must change as well in order to remain adaptive. There are no certainties
    in advance in the'
