    # Blockchain for a Secure Supply Chain


    Chain management is a field in which the blockchain is developing very strongly.
    Efficient supply chains form the core of many successful companies and deal with
    the transit of goods from the supplier to the consumer. Where there are several
    stakeholders in a particular sector, coordination is usually rather difficult.
    However, blockchain technology can enable new levels of transparency in many industries.
    An interoperable supply chain ecosystem that revolves around an unchangeable database
    is exactly what many industries can use to become more future-proof and effective.


    Companies that register a product on a blockchain must be reliable to guarantee
    the validity and traceability of the products. Because of this reliability, it
    is therefore not unusual that private blockades operated by a central authority
    ensure that no counterfeit medicines are registered.


    The companies determine which actors in the chain are active as miners and these
    can be suppliers, distributors or retailers. Depending on their role, each individual
    will have different rights: a laboratory technician can register medicines, while
    a wholesaler can only confirm transactions.


    # Tracking Down Medicines


    When a medicine is registered for the blockchain, a hash is created that contains
    all relevant product data. The information is stored on the blockchain when the
    medicinal product goes from the manufacturer to the distributor, which makes traceability
    clear. A pilot shows that the use of blockchain technology can drastically reduce
    the time required to track down a prescription drug: from up to 16 weeks to 2
    seconds. We already mentioned the US Food and Drug Administration’s DSCSA Pilot
    Project Program. In addition to the visibility of the supply chain, this pilot
    uses the blockchain to improve patient protection and patient safety. The application
    helps users to locate, investigate and handle a particular criminal or illegal
    drug easily and efficiently.


    When a drug needs to be withdrawn from the market, blockchain makes it easy to
    remove it from the market and thus prevent complications. Blockade technologies
    therefore help with two important issues when it comes to the traceability of
    drugs.


    +   • They support companies to track down their medication in the supply chain,
    creating a closed network that is impenetrable to counterfeit medication.

    +   • They help stakeholders to take action with knowledge from experience in
    the event of a problem by recognizing the exact position of their medication.'
