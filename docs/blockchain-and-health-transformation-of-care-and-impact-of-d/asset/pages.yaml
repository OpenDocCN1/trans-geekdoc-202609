  md: 'Bloem argues for personalized care: care contributes to the person’s own perception
    of health benefits. This is possible if the care is transparent: What is the effectiveness,
    quality and cost of care? The PlatformVmZ is of the opinion that the steering
    role is very important in this: How do I keep a grip on what is happening around
    me? That is why a personal client portal (CuraeVitel Balie) has been developed
    that makes it possible for care recipients to follow (and determine) what should
    happen around them. The PlatformVmZ is designed to take the individual diversity
    (variety) of clients as a starting point. The PlatformVmZ therefore has a private
    client portal so that clients themselves can act as the ‘head office’. Clients
    are supported with access to care (Wme, Zvw and Wlz). Clients have insight into
    profiles of healthcare professionals who match their healthcare needs. The choice
    for certain healthcare professionals lies with the client. Clients have insight
    into the balance between the indicated care and the care provided. They (or the
    authorized network) have insight into the care plan and the communication between
    care professionals.


