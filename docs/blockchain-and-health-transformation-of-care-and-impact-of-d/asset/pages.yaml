    they will be able to do tomorrow, based on their mindset and their ability to
    learn and to grow (Kane, Phillips, Copulsky and Andus 2019: 115).


    Van Brussel (2012) distinguishes four ways to develop entrepreneurship, whereby
    the degree of entrepreneurship increases:


    +   * Floater: you leave the development of your career mainly to the environment
    and fate and your hitchhike, as it were, for possible opportunities. You are hereby
    clearly depend on your environment.


    +   * Opportunity Taker: you move flexibly with your environment and use opportunities
    that come along to realize personal goals. You are a scanner and'
