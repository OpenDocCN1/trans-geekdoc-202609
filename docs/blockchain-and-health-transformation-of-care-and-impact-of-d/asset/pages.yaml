- pgno: 265
  md: 'burden and possibility of feedback on one’s own professional actions) and for
    a method of organization where self-organization is paramount.


    A meaningful dialogue is only possible if there is respect for the views of the
    client and the healthcare professional. It is precisely about equality. A reality
    is constructed every time in the interaction between the client and the healthcare
    professional. The narrative approach has added value here.Baart shows that, at
    the moment, there is a big difference between the position of the client and the
    care professional. This pattern is broken by the effects of digitalization and
    more insight into processes of sensemaking. It is about balancing understanding
    of the professional conceptual apparatus and understanding of the other person.
    The process of providing healthcare is always about shared understanding (agreement,
    consensus) between two or more people about suitable procedures, interpretations
    and actions with regard to a care demand. This leads to the following preconditions
    for meaningful interaction:


    +   - Awareness of professional dominance in the interaction (expert knowledge;
    authority as a professional; anchored in regulations)

    +   - Understanding the position of the other: awareness of the individuality
    of experiences

    +   - Developing new (inclusive) mental models: interaction always needs a shared
    balance

    +   - Developing common meaning: recognition of one’s own history and the attendant
    opinions


    How to achieve a more equal interaction between client and professional, is:


    +   - Insight into sensemaking

    +   - Sensitivity to sensemaking

    +   - Insight into the context in which the interaction takes place Elaboration
    of sub-questions:


    Knowledge and work practices arise in social interaction, whereby solutions to
    problems are found through action. Weick therefore calls organizing ‘negotiating
    verbs’. By observing a discourse (language game), an observed reality is interpreted.
    That reality comes about through language and through action. The interaction
    is ultimately realized by assigning meaning to it. This leads to the following
    preconditions for meaningful interaction:


    +   - Realization of implicit assumptions in professional language'
