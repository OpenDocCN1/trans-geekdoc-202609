- pgno: 50
  md: '# # INTRODUCTION TO BLOCKCHAIN


    Within healthcare, complexity is caused, among other things, by regulations, funding,
    organisation, coordination between domains and interaction between clients and
    professionals. Blockchain enables a fundamental recalibration of the position
    of clients: complete control of your own data. In this chapter, we expose the
    complexity of care and tell you how Blockchain is a solution for this.


    # ## How Blockchain Works


    The name *Blockchain* comes from the way data is stored within the chain. Network
    users can allow transactions to take place, share information and exchange documents.
    Each transaction or set of transactions - called a *block* - refers to the previous
    transaction or set of transactions.


    This is because data are stored in blocks. These blocks are connected to each
    other, creating a chain: the Blockchain. When a transaction has been created,
    signed, sent and checked within the network, the *blocks* are linked to each other.
    After the transactions are written and the user has signed them, the blocks are
    linked to each other.


    Each block contains coded data and can be included in the chain if these data
    refer to the previous data. A block is thus linked by means of a reference to
    a previous block and thus the blocks form a chain. Figure 2 shows an illustration
    of this.


    A Blockchain, a chain of blocks, is a system that can be used to record data.
    Examples of this are banking matters, title deeds and product data. What is unique
    about Blockchain is that it legitimately exists without there being a single central
    point and without a trusted intermediary.


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_50_0.png)


    Source: Veuger 2020b.


    Figure 2. Chain of blocks.


    Blockchain can be used in any domain where information is transferred:


    +   * Currency: electronic financial systems without intermediaries'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - Payment infrastructure: transferring payments

    +   - Digital assets: exchanging information

    +   - Digital identity: Digitally sign IDs to combat fraud

    +   - Verifiable data: verify the authenticity of information

    +   - Smart contracts: software programs that perform actions without trusted
    third parties (Nichol 2017)


    Blockchain has four basic principles that distinguish Blockchain from other automation
    technologies.


    +   1. Growing chain: a chain of data blocks that builds up over time and cannot
    be unilaterally changed.

    +   2. Distributed network: the chain is distributed to all participating parties
    and is a shared truth.

    +   3. Consensus: Parties involved must agree on the data stored in the last block.

    +   4. Data storage in the form of cryptography for the data in a Blockchain.


    These four basic principles form the character of Blockchain. For all applications
    and every use, you will see these basic principles applied.


    # Blockchain as an index


    In order to benefit from Blockchain in healthcare, it is mainly about controlling
    access to medical data. One perspective is to see a healthcare blockchain as an
    *index*, a list of all healthcare records and medical data of a client. The index
    is equal to a catalogue in a library. The catalogue contains metadata about a
    book and the place where the book can be found.


    This also applies to healthcare: transactions within the blocks contain a unique
    opportunity to identify the user, a secure link to the healthcare file and a time
    marker of when the transaction was created. The healthcare Blockchain thus contains
    a complete indexed history of all healthcare data (individual history of a patient).
    The patient determines who gains access to the information, which gives the user
    full influence on what data is collected and how his data can be shared (Linn
    and Koo 2016). For example, a GP can view all the data of his own patients, but
    the patient ultimately determines which data he wants to show to third parties.


    # **Ledger**


    The Blockchain is therefore a distributed database (the library from the framework
    text) where data in each instance of this database are stored, comparable to a
    *ledger*. Everyone connected to the network on which the Blockchain runs has the
    same copy of'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'the ledger. Before data are permanently stored, there must be consensus within
    a majority

    of the parties who received these data on the accuracy, origin and completeness
    of these

    data.


    Where we are familiar with the exchange of information via the internet, Blockchain

    is about transferring value, as we know it from banks or the notary, but digitally.
    Key

    concepts for Blockchain are:


    +   - Ledger: a list of information about all blocks.

    +   - Stored: All the desired information is stored in each block.

    +   - Distributed and decentralised: in the Blockchain, there are many parties
    - so it is

    +   not centralised - and all these parties are connected with each other. All
    these

    +   parties also have the same ledger. Everyone gets a copy of the full ledger
    and

    +   receives an update when something is added.


    **Peer-to-peer ledger**


    Blockchain can be seen as a decentralized, distributed ledger or log. This is
    also

    called a _peer-to-peer ledger_, in which all participants keep the ledger together.
    After all,

    there is no central authority for determining the identity of users, storing files
    or opening

    sources. The digital ledger (the Blockchain) is distributed over different _nodes_
    (network

    of computers), which check the changes for accuracy. Each node in the Blockchain
    has a

    copy of the ledger. There is no centralised official copy and there are no users
    more

    trusted than others. Everyone is equal. Transactions are sent to the Blockchain
    network

    using applications such as Mijn Zorg Log. This application is central to the case
    after this

    chapter.


    The most widely known is the application of Blockchain for Bitcoin. In principle,
    a

    Blockchain is a database in which different data can be stored. In the case of
    the Bitcoin

    Blockchain, the entire transaction history of all Bitcoins is kept and the Blockchain

    therefore knows exactly how many Bitcoins everyone has.


    What makes the Bitcoin Blockchain unique is that this Blockchain (or database)
    is

    maintained by a network of servers that basically all have an exact copy of the

    Blockchain.


    # Decentralised


    A server can be a computer but is in principle a device on which data can be stored.

    This could therefore also be a mobile phone or a smart TV. The servers check the

    Blockchain data for accuracy and synchronize the content of their Blockchain with
    the

    databases of all other servers on the network. As a result, the servers connected
    to the'
