    # Properties of MedFabric4Me


    The experiment has demonstrated the potential in an interoperable network of a
    private and public blockchain. If we compare this application with the HIE, intervals
    of scalability and performance, we see the following:


    # Privacy


    As previously indicated, data from healthcare and the electronic patient file
    are protected by laws and regulations. Therefore, each system must comply with
    the Health Insurance Portability and Accountability Act (HIPAA) privacy guidelines.
    HIPAA is the 1996 US healthcare legislation. MedFabric4Me meets all minimum requirements.


    A patient can delete their account at any time on MedFabric4Me. So when you leave
    the network, MedFabric4Me immediately deletes all information for the participant.
    Although the exchange of information must be recorded as a transaction history,
    MedFabric4Me as a general ledger is unchangeable.


    A patient manages data sharing in MedFabric4Me and can therefore unsubscribe from
    file sharing at any time. A patient therefore determines their own policy for
    sharing data. In addition, a patient may request the supplier to change incorrect
    health information. Although the patient cannot change his electronic patient
    record himself, any discrepancy can be changed by a next doctor.


    # Partial Sharing of Data


    De-identification is required when the patient''s data are shared for study purposes.
    To comply with the same, MedFabric4Me may partially share data, hide personal
