    # # PREFACE


    It is evident that the current Dutch health system is changing. Developments in
    data science and the associated technical and organisational infrastructure play
    a significant role in this, as do the ''contextual factors'' including European
    and national policies. An unexpected contextual factor has become COVID 19, which
    has demonstrably influenced the healthcare system nationally and internationally.
    In addition to all the known problems caused by COVID 19, the pandemic has also
    contributed to the ''digital literacy'' of the healthcare sector, especially in
    the Netherlands.


    Now that existing eHealth solutions appear to be entering daily healthcare practice,
    there is a need for more effective and efficient management of the healthcare
    system and thus for more applied knowledge in areas such as Blockchain. Blockchain,
    which is the subject of this book, is one of the emerging technologies in the
    Dutch healthcare landscape. Several studies show that Blockchain can make a relevant
    contribution to improving our healthcare system in several ways. Examples of this
    are discussed extensively in this publication. This involves increasing the efficiency
    and effectiveness of the healthcare system by, among other things, increasing
    the safety, consistency and transparency of the multitude of information exchanges
    circulating in the healthcare system.


    This book discusses examples where Blockchain technology has already left its
    mark in the Dutch healthcare landscape, such as applications and apps for structured
    notifications of what the healthcare provider has done to the healthcare recipient,
    which allows the administrative and financial process to be completed more quickly
    for the various parties. This has not only to do with networks around the client
    but also with cooperation between healthcare professionals, both inside and outside
    the walls of the institution.


    In addition to this undeniable added value for the healthcare system, in my view
    the most important contribution of Blockchain is the potential to promote the
    autonomy and control of healthcare users by bringing their ownership and control
    over their own medical records closer. Whereas less than 10% of the data in healthcare
    worldwide was stored electronically in 2008, the electronic health record has
    become an established concept in 2020. According to the WHO (2016), the adoption
    and deployment of national electronic health care systems (EHR) has increased
    by no less than 50 percent worldwide'
