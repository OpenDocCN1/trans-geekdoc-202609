- pgno: 83
  md: '# Network Organization


    The Microbiome Centre is not a traditional clinic for intestinal complaints. This
    knowledge gap around the microorganism of intestines gave the founders the idea
    to set up a network between patients, general practitioners, pharmacists, laboratories
    and scientists: a Blockchain network in which medical and personal data are recorded
    securely and irrefutably. Microbiome treatments are always performed by physicians
    who have their own treatment location. In 2017, this network organisation started
    on Blockchain. A large number of parties are connected to this Blockchain: doctors,
    a laboratory, pharmacist, three universities and the AMC to improve intestinal
    health by making personalised microbiome treatment possible.


    The Blockchain always makes it clear which party has access to which data and
    gives the patient an explicit role in granting consent. Dunkirk states: ''Medical
    doctors can request faecal analyses based on this if a patient has complaints;
    the laboratory then carries out the requested analysis. Based on the analysis,
    the doctor writes out a prescription, and the patient can determine whether he
    agrees with the proposed treatment. Finally, the pharmacist looks at the prescription
    and sends the requested medicine to the patient. With a smooth integration of
    payment.''


    # Medicines Act


    The Microbiome Centre’s network environment eliminates the need for signed agreements.
    These have been replaced by smart contracts, which automatically trigger actions
    when the conditions are met. ‘The agreement between doctor and pharmacist is very
    important according to the Medicines Act, so we have anchored it in a Blockchain.
    Just like the data traffic between the doctor and the laboratory. That must be
    absolutely safe, and nothing must go wrong. The client is in charge’, Dunkirk
    explains (Rabobank).


    Correspondences and research data are all stored watertight on the Blockchain.
    Dunkirk: ‘The doctors who use our system can view results in our network. The
    pharmacist sees which probiotics to mix. Checks by parties are stored in the system,
    as well as confirmation that the patient has received his medication.’


    # Five Principles to Get Started


    As an experience expert Dunkirk provides a number of basic principles for organisations
    (Rabobank).'
