- pgno: 214
  md: 'transactions where calculation rules replace the original supervisor to ensure
    the correctness of the data (Broncker and Veuger 2018: 126).


    Anyone who wants to can have their own health data in one place in his or her
    personal health environment (PGO). This concerns medical data from files at (BIG-registered)
    healthcare providers, but also health data collected from gyms or smartphones
    for example. All that data can be aggregated in a PGO. The Ministry of Health,
    Welfare and Sport: ‘The working methods of health care professionals will also
    change with the emergence of Personal Health Environments (PGO): the directorship
    of patients and citizens over their own health data will therefore increase’ (VWS
    2018, 17). How you deal with the choice of certain outcome measures and indicators
    derived from them is never just a methodological exercise. Indicators are about
    more than measuring; they lead to certain effects and can therefore be used for
    managing (Delnoij 2019).


    The central question when choosing indicators is who asks for certain information
    and what the underlying question is. Is it about an effective care process or
    the choice of a specific care professional? (Delnoij 2019, 25). That is why the
    process of sensemaking with data must take place between the client and the healthcare
    professional (shared decision making).


    Setting up a PGO is therefore only effective if it is done jointly. Patients choose
    a personal health environment (PGO) based on privacy, functionalities, ease of
    use, accessibility and costs. This is according to research by the Patiëntenfederatie
    (‘Patient federation’). Participants in the Patiëntenfederatie study considered
    a medication overview and a summary of the medical file as the most important
    functions of a PGO. Online management of appointments, requesting repeat prescriptions
    and requesting an e-consult also score high. The general practitioner is considered
    to be the most important source of medical information. The hospital is in second
    place, and the pharmacy, in third place.


    A personal health environment is therefore broader than a client portal. A client
    portal is linked to a specific care provider system, for example the HIS of the
    general practitioner. A PGO is not just for healthcare (provision). A PGO is focused
    on autonomy (direction and self-reliance and co-sufficiency), better quality and
    safety of life and lower costs for the person. That is why a PGO integrates facilities
    that are broader than care: living, well-being/ relaxation, education/work/daily
    activities, neighbourhoods, municipalities, health insurers.


    The idea is that a PGO allows a patient to view data from multiple healthcare
    provider systems at the same time. The exact data that a patient can view differs
    per PGO. The NHG and the Patiëntenfederatie of the Netherlands have jointly drawn
    up a guideline for access to the file. This sets out which set of basic data must
    be available for online viewing by the patient. The personal work notes of the
    general practitioner are always excluded from inspection by the patient.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'With a PGO, patients are given the opportunity to gain more insight into their
    health data, which can support them in managing their health. From 2020, patients
    have the right to (free) electronic access to their own file. In addition, patients
    must be able to indicate which data may or may not be viewed by which (categories
    of) healthcare providers with whom there is a treatment relationship. A PGO can
    be a method for the patient to get that electronic view.


    Two parties are needed to exchange health data:


    +   - The patient with an app or website in which he wants to collect and use
    health data (personal health environment).

    +   - A healthcare information system from the healthcare provider in which the
    patient’s data is stored.


    A PGO reinforces the network aspect in healthcare: data from the outside in, meaningful
    functionality and a network structure. The client becomes a digital player in
    healthcare. This strengthens the interaction between client and professional.
    A PGO can also forward information. A PGO is a lifelong digital tool in which
    the owner collects, manages and shares his or her health data from various healthcare
    providers. The patient/client therefore has control over his own (healthcare)
    data. With PGOs, the technical intervention in the IT infrastructure is aimed
    at extracting information from the source system of the healthcare provider and
    passing it on to the PGO of the client/patient and vice versa.


    At the time of information transfer, the patient is responsible for the data,
    the path this information travels and with whom it is shared. The management of
    the medical data lies with the owner of the PGO. The healthcare provider is responsible
    for the quality of the information provided. MedMij is responsible for a personal
    health environment in which the healthcare information systems of healthcare providers
    can communicate with each other not only in a secure but also in a clear way.


    Quli wants to operate as a citizen platform. The platform is set up within the
    framework of the MedMij standards. It is about a safe exchange between clients
    and care professionals (VIPP scheme). A number of information standards have since
    been developed: basic healthcare data (hospital care); medication; GP data (upload
    measurement values); Ggz (municipal mental health).


    # Patients Know Best (PKB)


    In the UK, Patients Know Best (PKB) (www.patientsknowbest.com) is available for
    12 million (in the near future 20 million) clients. CarePoint Nederland has concluded
    an agreement with PKB for implementation in the Netherlands and Germany. PKB has
    four main domains: General, Social, Sexual and Mental Health.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'In order to adequately set up information provision, it is essential for CarePoint
    to start with the question of what goal must be achieved. The point is to get
    a good picture of that. In practice, this question is skipped, making implementation
    insufficiently manageable. The aim of PKB is to optimize the interaction between
    the healthcare professional and the client through a new structuring and sharing
    of information. It is about improving the quality of communication and interaction.


    COVID-19 has acted as a catalyst in achieving this goal. In the English context,
    the number of users increased by 77% between March 2020 and September 2020. An
    important reason was that patients and clients did not want to come to the care
    provider. Just as in the Netherlands, for example, there was a large drop in demand
    in hospitals and in the home situation. The need for an alternative was enormous.


    There was also a major change in the thinking of healthcare professionals. Figures
    from the English hospitals show that medical specialists found prior to COVID-19
    that 80% of patient contacts had to take place face to face and 20% could take
    place via digital devices. This is reversed after six months: 80% of patient contacts
    take place via digital devices and 20% face to face. A calculation by CarePoint
    at a large Dutch hospital showed that such an implementation led to a saving of
    €1 million (less space, less parking space and less CO2 etc.).


    An essential precondition for digitization of care is that new technology should
    lead to a fundamental reorganization of work processes. If it is used to adapt
    existing work processes, this only leads to higher costs in practice. This means
    that technological and social innovation must take place together. This is a requirement
    of CarePoint to introduce PKB. When digitizing healthcare, organizations and healthcare
    professionals are therefore faced with a strategic choice to shape their current
    work processes completely differently.


    The introduction of PKB has led to better capacity utilization in England for
    COVID-19. Because a large number of clients in elderly care are now connected
    to PKB; it is easy for general practitioners to do early diagnosis via questionnaires.
    It is possible to serve 100,000 clients per day. The introduction of PKB makes
    ‘symptom tracking’ possible: by establishing a number of criteria for COVID-19,
    a filter is laid over a large number of people, which focuses the available capacity
    on that part of the total that may have COVID-19. As a result, testing facilities
    can operate much more effectively. In addition, this way of working leads to simple
    contact between a client and a healthcare professional, which in turn reduces
    anxiety and fear among clients.


    The introduction of PKB is a fundamental change: information is already shared
    before an interaction between client and healthcare professional takes place.
    This strengthens communication and the interaction based on it in terms of quality.
    That leads in turn to a more effective treatment process. Collaboration and coordination
    between healthcare professionals is greatly improved. For example, in chronic
    care where clients'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'usually deal with multiple healthcare professionals, the English context shows
    that significant cost savings and quality gains are achieved.


    There is also much to be gained for informal care. In the process of sharing information,
    informal care becomes an integral part of the treatment process. This positioning
    results in a better recognition of one''s own position.


    The introduction of a PGO does not in itself solve the problem of illiteracy.
    However, PKB is designed in such a way that visualization and speech technology
    are built in.


    The organization of PKB also ensures that fragmentation of information is prevented.
    CarePoint expects many apps to be too limited to be future-proof. A better solution
    is full integration into the PGO. The PKB information architecture is fully geared
    towards this.


    The application of the possibilities of artificial intelligence also makes it
    possible to use PKB as an early warning system. By bringing vital values together,
    it is possible to detect deterioration of a patient much earlier.


    It is essential that linking to other systems is easy to achieve. An important
    development in this regard is the link between the health care domain and the
    social domain. More and more healthcare professionals are choosing an independent
    role. The connection between PKB and the VmZ platform contributes to this. The
    role of the district nurse is strengthened by having access to the care information
    about a particular client.


    The impact of COVID-19 is that there is a different way of thinking among healthcare
    professionals. In the current context, the continuation of existing forms of interaction
    is not future-proof. In addition to the fact that the position of a client is
    strengthened (control over one''s own data), it is necessary to closely involve
    the healthcare professionals in the design of the information provision. Technological
    innovation always goes hand in hand with social innovation in the area of work
    processes, professional cooperation and the design of interactions with clients.


    # Strengthening Position Professionals


    # Entrepreneurship


    Different definitions of reality can be used simultaneously within care processes.
    The reality of organizing as we perceive it, we cast through organizational theories
    and organizational models in an explainable form. It is therefore proposed to
    introduce the model of a start-up when stimulating entrepreneurial behaviour within
    organizations or upon starting as an entrepreneur (Van Gaal 2012). The (French)
    word entrepreneur (dictionary 1723) means someone who organizes a company by taking
    a financial risk. The term entrepreneurialism can be translated as both entrepreneurship
    and being entrepreneurial.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Entrepreneurship is mainly about its metaphorical use: it is mainly about activating
    action (Engel 2015). For professionals, self-organization is about connections
    with other professionals and with clients. Entrepreneurship is about being able
    to cope with increasing variety and the (possible) uncertainty that goes with
    it (Eijssen 2016). Minderhoud (2017) describes entrepreneurship as the ability
    and willingness to develop, organize and manage a business venture to make a profit.
    Entrepreneurship is simultaneously an organizational form, a competence and a
    property (Blom 2002). Entrepreneurship among clients and healthcare professionals
    is about giving substance to the interaction based on a self-reliant position
    of the client.


    A specific form of entrepreneurship is a start-up: a starting company that tries
    to make a new idea successful in circumstances of high uncertainty (Kawasaki 2015).
    Start-up thinking helps to break through the resistance to change because the
    existing mindset is broken (Ries 2011). A start-up can handle the need for faster
    change and agility. A professional should be constantly experimenting and adapting
    to accommodate to the effects of digitalization and technology. Start-ups are
    often seen as digital role models (Kane, Phillips, Copulsky and Andrus 2019: 25).


    A start-up is a temporary organization that is looking for a scalable and repeatable
    business model (Blank 2013). Its characteristics are: speed, scalability, disruption,
    continuous willingness to improve and using digitalization (Hoogveld 2017). Start-ups
    are by definition focused on learning (Razeghi 2014). Hoffman (2013) states that
    the entrepreneurial strategy that successful start-ups use is comparable to the
    career strategy that successful professionals use.


    Research by Anne Annink (2017) shows that entrepreneurs who start because they
    see opportunities (and are not necessarily self-employed) are more satisfied with
    their work- life balance. Independent entrepreneurs have the following characteristics
    (Annink, 2017): customer focus, innovation, motivation (business) phase. Her research
    shows that there is a positive relationship between the motivation to be an independent
    entrepreneur based on opportunities and the work-life balance. There is a negative
    relationship between excessive stress and customer focus and satisfaction with
    the work-life balance. She concludes her research with the conclusion that independent
    entrepreneurs, compared to employees, are relatively satisfied with their work-life
    balance and well-being, even though they also experience tension between autonomy
    and financial uncertainty.


    Entrepreneurship appears to be hereditary. However, predicting entrepreneurship
    based on genetic data is not possible. Entrepreneurship is most likely the result
    of hundreds if not thousands of genes, each with a very small effect. You can
    say that some genes apparently lead to entrepreneurship, but you cannot say which
    genes they are (Loos 2013). The most important aspect of entrepreneurship is:
    how can you as a company develop products and services that customers really want?
    (Apello 2011).'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# **Entrepreneurial Professionals**


    Kwakman (2011; 2012; 2015) has worked out various aspects of entrepreneurial professionals.
    Being good in your profession is no longer enough. You are constantly challenged
    to reinvent yourself. You must be able to handle higher demands from customers,
    more competition, new business models and digitalization. A professional who makes
    a difference in this market and is successful for his customers, organization
    and himself has the following characteristics: he or she has a personal mission,
    has a unique offer, dares to approach new customers, deepens the relationship
    with existing customers, is part of a community, is proactive in his or her business
    and keeps his or her body and mind vital. In addition, it is about being proud
    of one’s own profession (Jansen, Van den Brink and Kok 2009).


    Van Delden (1992) indicates which four quality factors apply to professionals:
    using professional knowledge, developing methods, improving services and personal
    quality. For professionals, it is increasingly the case that team skills and great
    flexibility towards situations and clients are essential. In fact, there must
    also be the core motivation to fulfil this function, i.e., the tireless response
    to changing situations (De Jonge 2015; Maister 1997). It is about connecting and
    complementary action in a group that is put together on a case- by-case basis
    (group of sole proprietors). Professionals increasingly work together in teams
    and function within networks: this applies to doctors, nurses, notaries, accountants,
    psychotherapists, architects etc. It is therefore about being able to communicate
    with others: talking with clients, consulting with colleagues, coordinating with
    other professional groups, being able to propagate new ideas (Van de Water 2017).


    In short, the young professional has a keen eye for the changing world of his
    or her clients and is authentic and inspired in his or her ambition to be significant.
    He or she has a vision, but is also practical, and therefore knows how to inspire
    the environment.


