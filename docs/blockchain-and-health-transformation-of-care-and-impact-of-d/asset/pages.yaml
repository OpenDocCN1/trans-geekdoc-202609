- pgno: 195
  md: 'in innovation processes. Resources that may be released remain at the disposal
    of the region or the target group. In this perspective, innovation focuses specifically
    on the use of resources.


    The choice was made to base this model on the development of a theoretical framework
    that can be applied nationally (Bisognano 2012). When looking at healthcare interventions,
    the question is which criteria can be applied to make an assessment of effectiveness
    and effectiveness (Trusko 2007). What is striking is that there is increasing
    interest in the system perspective of Triple Aim.


    # Pricing


    The current funding is strongly focused on rates: it is mainly about the relationship
    between price and costs. The costs determine what space there is for care deployment
    within a region or target group. The cost price is determined by fixed and variable
    costs. The variable costs for deploying platform technology become lower (marginal)
    with greater use of the platform. The cost price is jointly determined within
    the region or target group: it is about value for money.


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_195_0.png)


    Figure 4. Internal cost price (Van Montfort).


    Current thinking often leads to ‘cost-driven pricing’. From the costs, it is necessary
    to come to a certain price. To avoid this in healthcare, it is desirable to switch
    to ‘price-driven costing’ (Malik 2017, 124). After determining the rate (price),
    a margin is deducted from this for the continuity of the activities. The remaining
    amount determines the entire structure of the care process. The available budget
    is determined at the macro level; at the micro level, space is created for the
    use of resources based on individual choices. The combination of price-driven
    costing and management based on an internal cost price makes integrated care possible.
    Van Montfort (2019b) indicates that allocation based on budgeting is the most
    effective form of funding.


    By decoupling allocation and use, the space is created for forms of client-bound
    funding, while at the macro level a form of system control remains possible.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# PROFESSIONALIZE ENTREPRENEURSHIP


    # Focus


    The previous chapter described the preconditions for a care practice in which
    the identity of the client is the starting point for the design of the interaction.
    In this chapter, the perspective of the professional is worked out. This chapter
    is based on literature (focused on entrepreneurial action), dissertations, policy
    documents and work practice.


    A professional is characterized by being able to take responsibility for his or
    her own actions aimed at solutions for clients. Professional acting has entrepreneurial
    aspects but has a different focus than entrepreneurship. The start-up methodology
    is used as a metaphor for professionals dealing with the uncertainty that results
    from increasing variety. Because of this variety and the possibilities of care
    technology, the professional will increasingly be confronted with questions and
    issues that require reflection. It is about the way in which professional behaviour
    can handle variety.


    Entrepreneurship and professionalism have a different focus. Care for the elderly
    requires the agility that characterizes entrepreneurship. It is about being able
    to cope with increasing variety by individualizing care and integrating the impact
    of care technology and digitalization into the professional domain. From the literature
    on entrepreneurship, the start-up method (Woldendorp and Woldendorp 2019) offers
    a perspective for realizing the above. This method shows how variety, changes
    and uncertainty can be handled.


    One of the characteristics of professionalism is working with standards that have
    been established. Due to the increasing variety, however, it is also desirable
    to have a self-regulating capacity to be able to independently realize the interaction
    with a client. This is reinforced by the fact that not only is the variety among
    clients is increasing but more and more new forms of care provision are also emerging.


    # Reflection


    It is important that in the interaction, there is always reflection on the actions
    of the professional. The client is not only a consumer but someone asking for
    the solution to an issue that affects their own identity. The development towards
    a Personal Health Environment means for the position of the professional. By enhancing
    the client''s autonomy, their own professional position also comes into the picture.
    Personalization of care and the model for joint decision making make the context
    of each client increasingly important. Entrepreneurial action and innovation are
    central to the interpretation of the professional role in the interaction with
    the client. Central is regulatory space'
  merge: -1
  img_proc: true
- pgno: 197
  md: '(autonomy), flexibility (adaptive capacity) and innovation. Just being good
    in one’s own field is no longer sufficient.


    Central to this chapter are the concepts of professional, personal entrepreneurship
    and start-up approach. The above-described increase in variety in the care process
    requires, according to the elaborated system principles, two approaches: damping
    the variety through standardization of care and strengthening the variety by increasing
    professionals’ room to manoeuvre. We see a struggle to deal with this in care
    organizations: on the one hand, forms of self-management and self-organization
    are chosen; on the other hand, those forms are being phased out. The choice is
    to have the interaction between the person requesting care and the care provider
    take place by strengthening the position of the client and strengthening the position
    of care professionals. Organizations are then hardly needed. Working with platform
    technology facilitates clients and healthcare professionals in that.


    What is needed is for professionals to increase their learning capacity. This
    requires an innovative working environment and a learning model that is focused
    on results. The increasing complexity of care requires that the logic of the professional
    and the logic of the client become aligned. The starting point for this is acting
    on the basis of trust and accountability. Personal functioning is central. In
    the interaction with the client, insight is always needed into the specific context
    in which that client is located. A better digital and technological working environment
    can support the professional in the organization of care. The added value of artificial
    intelligence (AI) is still seen as limited for this form of care. Digitalization
    and healthcare technology work effectively if it is a normal part of healthcare
    practice.


    # Shared Decision Making


    For the information that is collected and shared by the professional, the values
    of the client must be embedded from the start. This includes values such as autonomy
    and direction.


    Work processes are therefore also adjusted from that perspective in consultation
    with the client. Tools for this approach are the Shared Decision Making (SDM)
    model and the PGO (Personal Health Environment). Here too, platform technology
    is supportive. Information can be offered in an accessible, tailored and understandable
    way in the platform. The SDM model must be based on the client’s context. In this
    perspective, the client is in fact the guide for the professional to make information
    accessible to that context. This requires new skills from the professional, whereby
    sensemaking is an essential part. The introduction of the PGO also changes the
    way the professional works. After all, the client’s directorship over their own
    data is strengthened. Determining the indicators to be used is not an objective
    process. Here too, sensemaking comes into play.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Regulatory space can be filled in from entrepreneurial action. Here action,
    responsibility and accountability are central. The competencies and skills that
    are expected from a healthcare professional fit well with personal entrepreneurship.
    A model that allows reflection on this personal entrepreneurship is the start-up
    method. This is about being able to deal with uncertainty and being able to show
    resilience and courage.


    # Context of Position Professional


    # Regulatory Space


    Evelien Tonkens (2004) states that professionals must meet clear professional
    requirements. However, management often translates these requirements into performance
    criteria that do not do justice to the discretionary context of professional reality.
    Although a professional in principle performs standard acts, she or he can never
    regard and treat them as standard. The issue is simple: if professionals follow
    the management logic, they short-change the client. Management and the client
    pull hard on the professional but in opposite directions. This leads to a terrible
    split (Tonkens 2004).


    Existing healthcare organizations will increase the regulatory space for professionals.
    Operations and information management will be more structured to support professionals.
    Due to the increasing severity of care, there is even more attention for the distribution
    of expertise: role of (district) nurse and role of personal healthcare assistant.


    # New Business Models


    Due to digital systems, fewer patients will be seen by doctors and general practitioners,
    shifting instead to nurses who receive digital support with diagnostic and treatment
    tools. The impact of technology on healthcare professionals leads to client portals
    (direct access to data) and innovation (new professional dividing lines; new working
    methods; new organizational forms). Expected developments include: assistance
    with mobility, tracing people with dementia and increasing communication options.
    (Topol 2015).


    Healthcare institutions find themselves in a changing world. Cornelis (1990) states
    that hierarchy (rule-guided management) is not suitable for finding solutions
    in a world that is changing. The rule does not change, so it is invalid, and the
    new solution, which fits into the new situation, requires adjustment. However,
    adjustments can only come from people who know the situation.


    Within the Nursing, Nursing Homes and Home Care (‘Verpleeg-, Verzorgingshuizen
    en Thuiszorg’; VVT) sector, there are conflicting movements: on the one hand,
    the trajectory of self-managing teams is continued, and, on the other hand, the
    trajectory of working with self-managing teams is stopped (Laurens; Cordaan).'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Organizations or groups of can quickly increase in size to introduce new applications
    (Ismail and Van Geest 2015). This results in the creation of new business models
    in healthcare (Kemperman, Geelhoed and Op’t Hoog 2014; De Man, De Man and Stoppelenburg
    2015). The realization of new forms of governance also immediately plays a role
    (Strikwerda and Ten Wolde 2017). Changes in the healthcare market are going faster
    and deeper, under the influence of advancing digitalization, more complex customer
    behaviour, new entrants in the competition field and changing business models
    (Sidhu 2016). Anyone who wants to have a right to exist in the future must therefore
    think fundamentally differently (Hoogveld 2017).


    # Learning Model


    Organizations and professionals function as systems. The task of this system is
    to achieve organizational goals (Aukes and Woldendorp 1994). This is achieved
    because people deliver performance that produces results for customers. A learning
    model has been developed for this that looks like this (Reijerse and Woldendorp
    2000):


    Organizations and professionals produce results for customers (or clients). In
    order to be able to do that, performance must be delivered that produces a customer-oriented
    result. Performance presupposes competencies (Mulder 2002). In changing circumstances
    (increasing complexity), competencies require learning (Arets, Heijnen and Jenning
    2015). Learning can in turn best be done by gaining experiences that result from
    the process and the outcome of achieving results (Ruijters 2006; Ruijters and
    Veldkamp 2012).


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_199_0.png)


    Figure 5. Learning model (Reijerse and Woldendorp 2000).'
  merge: -1
  img_proc: true
- pgno: 200
  md: '''Doing better'' is only possible if nurses, nursing specialists and carers
    work in a professional and innovative working environment. That environment is
    increasingly supported by healthcare technology and digitalization. A working
    environment must be aimed at ensuring that newly developed knowledge and innovations
    can be applied in healthcare practice (Vermeulen 2019).


    Management of performance and results depends on four preconditions:


    +   - There must be an objective that can be evaluated.

    +   - Effect of interventions must be known.

    +   - Sufficient information (intelligence) regarding the (current and future)
    environment must be available.

    +   - The capacity to process the information must be sufficient.


    Working and learning reinforce each other through the available technology (Marr
    2010). It is precisely professionals who must be able to enter into a dialogue
    with management, colleagues and clients about their own contribution (Ertel and
    Solomon 2014). Professional forms of self-regulation are assumed in which the
    willingness to take responsibility for one''s own actions is central (Hoekstra
    2005).


    # **Game Rules**


    Healthcare professionals have to deal with different game rules (RVS 2019a, 19):


    +   - As a service provider in a (semi) public sector, they are expected to be
    cost effective and lawful.

    +   - As a professional service provider, they have to deal with professional
    standards and guidelines.

    +   - As a private party in a regulated market, they must adhere to the rules
    of the market.

    +   - As a social organization, they know different stakeholders (local residents,
    chain partners, etc.).


    Care is increasingly characterized by complexity. More and more people have to
    deal with multiple needs that are highly dependent on the specific context in
    a given time.


    The complexity requires a reconsideration of the current care offer. An integrated
    and multidisciplinary approach is needed. The core of this is that the preferences
    and needs of clients will play an increasingly important role (Ruwaard 2012).
    In addition, safe care can be seen as a value between other values: the context
    in which care is provided and the position of the care professional in this context
    create further complexity. This requires room to make assessments and learn from
    mistakes that are also made in practice. The'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'interaction between client and healthcare professional is always about assessments
    at the individual level (CEG 2019).


    Where regulatory space is created, it is not self-evident that healthcare professionals
    will also use it. They are not trained to think broadly, but to become a specialist
    and to avoid risks; it is precisely working within frameworks that provides guidance
    and certainty (Bussemaker 2019). In order to make healthcare future-proof, it
    is about clarifying which goals must be achieved and, in particular, which normative
    principles lie below those? (Bussemaker 2019).


    The Dutch healthcare system operates on three sets of logic (RVS 2019): the logic
    of healthcare, the logic of rules, and the logic of distribution. In practice,
    these logics clash. A more effective organisation of that practice requires focusing
    on the value of human dignity. This can be achieved by letting healthcare professionals
    enter into a meaningful relationship with the client or citizen. Two preconditions
    for this process are an improved cooperation between healthcare professionals
    and a different approach to limitations. What is important is understanding the
    client. It is important for healthcare professionals to jointly develop new ways
    to treat the client (Bussemaker 2020).


    # Trust


    The concept of trust thus comes to the fore: ‘trust is an issue if an actor to
    achieve something depends on another actor, whereby he cannot fully control or
    predict the actions of that other’ (Stoopendaal and Bouwman 2018, 7). The relational
    aspect of the interaction between the client and the healthcare professional will
    be central. Trust has different dimensions (Meurs 2014): performance (providing
    evidence for a result); competence (required qualifications and expertise); and
    intention (believing in each other’s good intentions). Meurs: ‘resilient relationships
    only come about if we focus on performance, competences and intentions’ (2014,
    10).


    Resilience is the ability to adapt to changing circumstances while maintaining
    core values. Resilient relationships arise when investing in mutual relationships,
    putting content at the centre, modesty, experimenting and learning and appropriate
    accountability (Meurs 2014). For healthcare professionals, this means that they
    are forced to opt for a personal approach. In addition to this choice, care is
    increasingly being given in formal and informal partnerships such as networks
    and platforms. Technological developments have a major and unpredictable influence
    on how healthcare is organized and delivered (RVS 2019a, 36).


    # Accountability


    Accountability, aimed at improving care, should therefore be the core of professional
    action (RVS 2019a). The interaction between healthcare professional and supervisor,
    buyer and government must be reciprocal. Complexity requires embedding accountability
    in an iterative process: taking action together, reflecting and adjusting plans.
    This creates'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'preconditions for care professionals for a learning care practice: joint decision
    making by the client and care provision meaning for both professionals and clients.


    It also helps healthcare professionals to respond to the specific context of healthcare
    demand. Being accountable requires self-reflection from the healthcare professional,
    a dialogue with the client, a dialogue with other professionals and organizations
    and a dialogue with external stakeholders (RVS 2019a). Elements in this are furthermore
    horizontal supervision of professional conduct and mutual intervision (Kraaijeveld
    2018).


    Elberse (2012): health research is driven by the ideas and interests of researchers
    and professionals. This is partly due to the supply-driven nature of the healthcare
    system. A system innovation is required to change this system to a needs-oriented
    system (De Haan 2017). However, patient participation only takes place on a limited
    scale.


    By placing responsibility with professionals, organizational forms can arise around
    work processes (chains) that transcend the boundaries of one’s own organization
    (Homan 2005).


    # Interaction with Client: Autonomy of Professional


    # Work Practice


    Professionals also have to deal with a different position of clients. This leads
    to, among other things, an increase in more assertive behaviour, a strengthening
    of the client''s autonomy and a need for as much customized care as possible.
    The perspective of professionals forms the basis for the structure of the organization.
    Management provides a working environment in which common standards and values
    are used. The point of departure is a strong common interest.


    That is why, in addition to a business-oriented (instrumental) approach to change
    processes, an approach aimed at the development of professionals is also desirable
    (Ardon 2011). In terms of management and implementation, the foregoing requires
    the minimum- intervention principle. The core is that as many decision-making
    powers as possible are placed as low as possible in the organization.


    By defining the client in terms of his or her own personal context, a different
    form of life is created and, with that, openness to a different interaction. The
    language, spoken and written, shows how reality is interpreted, how reality is
    handled, what is assumed to exist in the world and how action can be taken in
    reality. Understanding is seeing connections and therefore coherence. In the interaction
    between the client and the professional, understanding each other''s language
    expressions is essential. The conceptual apparatus of start-ups in particular
    makes a new interpretation of the interaction between professional and client
    possible.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'The care context of the client and the interests of different stakeholders
    (informal care, general practitioner etc.) can best be seen at the level of basic
    units (professionals, teams, departments). It is precisely at this level that
    a better balance can be realized between the deployment of resources (people),
    the planning to be used and the costs (Almekinders 2006). The learning capacity
    of care professionals is put to the test by the variety of care arrangements,
    the emergence of new types of professionals and the emergence of all kinds of
    intermediaries (Putter 2017).


    # Innovation


    Professionals do not automatically become familiar with technology. Working with
    technology and digitalization must therefore be part of work practice (also in
    the education) (Zorgpact 2018). The application of innovative technologies requires
    a mutual adaptation of technology and society (ECP 2019). Innovations in healthcare
    only work if they become embedded in society. This means that they are part of
    the care and technology system, of laws and regulations, codes of conduct and
    protocols, values and routines of users (Rathenau Institute 2019).


    Digitalization is primarily a technological phenomenon. Within care for the elderly,
    it is mainly about increasing productivity. What is also needed, however, is a
    value-driven approach (Wallin 2018).


    Technological solutions help healthcare professionals and clients work in a different
    way (Vilans 2019). Creating the right framework conditions appears to be essential
    for a successful implementation of healthcare technology. The number of applications
    for eHealth is around 325,000 (Idenburg and Emonts 2019).


    Hinsen (2017) expects that five technologies will have an enormous impact:


    +   - Artificial intelligence: ability to perform independent analysis;

    +   - Internet of Things: devices are connected with each other and with data
    in a smart way;

    +   - Networked intelligence (blockchains): reliable networks that allow secure
    decisions to be taken in a network;

    +   - Augmented and virtual reality: changes in the structure of reality;

    +   - Quantum computing: an enormous (and fundamental) increase in computing power.


    # Convergence


    Vilans (2018) describes 12 trends which will have impact on the elderly care:
    online connections, consumermarket, big data, artificial intelligence, risk solutions,
    robotics, cyborgs, drones, reality technology, blockchain, 3-D printing and biotechnology.
    Artificial intelligence (AI) is about smart technology: technology that is aimed
    at direct care to the patient/client and that can (partly) replace the care provided
    by a human care'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'provider (RVS 2019). For example an experienced physician is no longer required
    to predict the onset of diabetes in a patient (Siebel 2019: 39).


    The combination of AI and blockchain changes the way data are created, how they
    are distributed and how execution upon data is realized (Laurence 2019: 98). The
    use of Blockchain technology in healthcare makes a difference in data management.
    The technology will make sharing medical data more effective, efficient, secure
    and transparent for all healthcare stakeholders. A network for healthcare institutions
    can thus exist without having a patient’s personal data. Patients are identified
    in this network via Blockchain technology. As a result, the Blockchain can also
    form a platform for exchanging patient data.


    Healthcare records stored on a Blockchain can help healthcare stakeholders bring
    all parts of the health data together in a clear way. Another area of healthcare
    where Blockchain and healthcare can be used is traceability of medicines (Veuger
    2020; Veuger en Woldendorp 2021)).


    AI relates to six systems (Serrurier Schepper and Hiddink 2019):


    +   - Image: recognizing image

    +   - Text: understanding and producing text

    +   - Speech: understanding and producing spoken language

    +   - Prediction: predicting and making suggestions

    +   - Virtual assistant: chatbots and virtual assistants

    +   - Robotics: mechanical aids


    # *Artificial Intelligence*


    Big data (ability to store, process and analyse data) lays the foundation for
    the broad adoption and application of AI: medical image diagnostics, automated
    drug discovery, disease prediction, genome-specific medical protocols, preventive
    medicine. (Siebel 2019: 92).Almost all current applications still fall under ‘narrow
    AI’ (Nictiz 2019). This means that they are intelligent computer systems that
    perform one specific task, particularly in the field of medical imaging.


    Contemporary AI is in the adolescent phase (Sahota and Ashley 2019: 104). What
    is lacking is a “broad” intelligence aimed at problems that are new and variations
    that were not present before. Real life is open-ended: no single data point reflects
    the ever-changing world. In an open, finite world, there are never enough data
    points.


    AI therefore currently has three gaps between ambition and reality:


    +   - Believability gap: we think computers look like humans in terms of intelligence.

    +   - Progress illusion gap: we think AI solutions to simple problems also work
    for complex problems.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   • Robustness gap: we believe that when AI sometimes works, it is thought
    to always work (Marcus and Davis 2019).


    Narrow AI is the situation where an AI system exhibits a certain level of intelligence
    in a certain field, but it remains a computer system that performs highly specialized
    tasks for people within that narrow field. For example, it is about predicting
    lung cancer, predicting the outcomes of a patient in intensive care, recognizing
    dermatological abnormalities. The added value of AI lies in areas such as more
    personalized treatments and preventive health care. AI in healthcare offers new
    possibilities to make advice personal.


    These recommendations are based on personal data from apps, consultation and medical
    data. AI is that part of computer science that focuses on systems that perform
    functions that we normally associate with the human brain, such as learning, dealing
    with ambiguity, solving problems, recognizing emotions and being creative (Nictiz
    2019).


    Examples of AI techniques that lead to improvement in healthcare (TD Connect 2018):


    +   • Big data: treatment based on your own file and a large number of comparable
    cases

    +   • Sensors: continuous breathing test at home signals early stage of cancer

    +   • Robots in the body: nanobots in the bloodstream that remove clots

    +   • Virtual Assistant: AI assists physician with diagnosis and treatment

    +   • Recognizing an epidemic: recognizing an epidemic based on satellite images

    +   • Help with dementia: remembering when to take medication


    The expectation of FME (2018) is that the deployment of AI, home automation and
    ehealth can reduce the staff shortage in healthcare. The e-intensive care unit
    (e-ICU) of Philips is mentioned as an example: with a form of telemonitoring,
    multiple beds can be monitored from a central post. Cost savings are not in fewer
    staff but in fewer interventions through better monitoring. AI is used for wearable
    technologies, sensors offering real-time readings on for example heartbeat and
    blood pressure. AI can also be used in developing learning plans tailored to individual
    professionals (Sahota and Ashley 2019).


    Ford: ‘my own view is that artificial intelligence gradually proves capable of
    automating nearly any routine, predictable task, regardless of whether it is blue
    or white collar in nature’ (2018, 5). This will create new jobs, but many jobs
    will also disappear (Ford 2015). A study by PwC (2019) shows that applying artificial
    intelligence on a large scale can lead to more efficient and accessible healthcare.
    Examples of savings are:'
  merge: -1
  img_proc: true
- pgno: 206
  md: '+   - Obesity: more effective self-monitoring to prevent obesity

    +   - Dementia: higher diagnosis percentage in primary care

    +   - Breast cancer: early detection, reduction of direct involvement of doctors
    in any repetitive tasks


    The development of big data and artificial intelligence in healthcare is still
    in the initial phase. Most technological advances ‘arrive and change our world
    in a steady incremental rate’. (Browne, 2019: 302). Davenport (2019:81):‘Many
    cognitive technologies are close to being good enough to change business models,
    but aren’t quite there yet’. Realizing the calculated benefits does not seem to
    be achievable easily in practice. Humans are especially good in things like judgment,
    empathy, intuition and comprehension of complex interactions. (Baldwin 2019: 236).
    These are central for giving care. Technological developments contribute to three
    movements: empowered clients: more control over their own health and care; bionic
    human: restoration of the human body; autonomic systems: computers take over parts
    of care phases (Idenburg and Emonts 2019).


    # Healthcare Landscape


    Whatever influence these technological solutions have, they must fit into the
    right care. Proper care is defined as (KPMG 2018): sensible (appropriate), in
    line with guidelines; accessible to anyone who needs it within the standards for
    maximum acceptable guidelines; to be determined of the same or better quality
    on the basis of outcomes of care and support on both a clinical level and on patient
    experience; for the lowest possible integral costs (over the entire chain).


    Based on this, a successful healthcare landscape is characterized by (KPMG 2019):
    organization of the right care in the right place; technical infrastructure for
    data exchange and interconnectivity; regulations concerning data exchange; governance
    in the region; new delivery models where the focus is not on the infrastructure,
    but on the client and the client’s needs.


    # Information: Preconditions for Achieving Autonomy


    # Responsibility


    From the (more) dominate position of clients, there is a shift from organizations
    to organizing. This includes strengthening the personal directorship of clients
    and strengthening self-organization among professionals, setting up network structures,
    application of new technological options and achieving a new distribution of knowledge
    and skills.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Network care as a natural evolution of chain care offers more opportunities
    to cope with the increasing complexity. While chain care focuses on optimizing
    care within the existing first-, second- and third-line bulkheads, network care
    offers the opportunity to organize care based on the integral care demand of a
    patient/client, working around and over the bulkheads. Collaboration between cure
    and care is necessary. This integrated approach improves the quality and perception
    of care at lower costs (Valentijn 2015).


    Within the care for the elderly, the district nurse plays a pivotal role, in the
    sense that they fulfil a central function in the neighbourhood through contacts
    and collaboration with general practitioners, other and informal caregivers. From
    this perspective, the client serves as the centre of care, and district nurses
    as the leading professional, both in the care of their clients and within the
    neighbourhood (De Groot, Maurits and Francke 2018). This also makes their role
    in the interaction decisive.


    The role of general practitioners and medical specialists is much more focused
    on responsibility for the care process. The district nurse is an essential link
    in shaping the interaction. They are connected to general practitioners and possibly
    to medical specialists. The network of healthcare professionals adapts as the
    health and demand of the client changes. Depending on the type of care and the
    needs of the patient, the role of the medical specialist can vary from an active
    leading role to a more supportive role or sharing specific knowledge. Depending
    on the situation of the vulnerable elderly person, a circle of care professionals
    and informal caregivers will develop around the client (FMS 2017).


    When designing a digital health management, it is important that values such as
    autonomy are included in a design. Research by Denktank IZO (2019) shows that
    citizens have difficulty understanding the input of professionals in the area
    of information provision. It must work for different groups of people (variety).
    The design must offer (privacy) protection (Niezen and Verhoef 2018). Since May
    2018, the General Data Protection Regulation (GDPR) has been in effect, stipulating
    that explicit permission must be requested for storing and processing all data
    of persons.


    # *Ehealth*


    Healthcare will move towards the outcomes of data streams. It is noted that the
    Dutch healthcare sector is moderately positive about the current IT innovation
    level. The level of ambition is high (Neomax 2017). Ehealth can support care processes
    to improve quality, continuity and a person-oriented approach (Swedish society
    for nurses 2012).It is important that healthcare professionals play a role in
