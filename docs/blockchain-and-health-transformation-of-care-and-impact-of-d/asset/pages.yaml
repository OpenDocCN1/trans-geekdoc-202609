    # Corda


    With Corda and Hyperledger, a check has already been done for the transaction
    data and the authorizations therein. With Corda, consensus is achieved in a similar
    way to that with Hyperledger Fabric, because for both the consensus is determined
    by transaction validity and transaction individuality through an automatic check
    that all signatures are correct.


    The Corda Blockchain has been created through intensive cooperation between banks
    and has therefore been developed especially for this sector. This collaboration
    in a hybrid system is known as R3CEV, and its main purpose is the management,
    synchronization and distribution of financial applications. The consortium is
    convinced that not all Blockchain data are suitable for publicly accessible Blockchain
    infrastructure with regard to financial transactions. Privacy and scalability
    are the most important principles for the consortium for the development of an
    infrastructure like Corda.


    A critical comment and therefore also an opportunity is whether Corda is still
    a Blockchain, or whether future use lies precisely in sector-specific distributed
    networks such as insurance policies; see Figure 14 With this, it can act in isolation
    as well as forming a worldwide Blockchain that is compatible with other distributed
    networks. For example, the coincidence of different networks can occur with each
    other, from which an interaction arises.


    Reaching consensus is an important factor in ensuring that a distributed network
    can function optimally, and that can be done in a permissionless way – where everyone
    can use it – or a permissioned – limited access – way. Ethereum is permissionless;
    Hyperledger and Corda are a permissioned Blockchain. Corda and Hyperledger Fabric
    do not have a necessary built-in cryptocurrency. Fabric does offer this option.
    Hyperledger Fabric does not have these problems, due to the use of an algorithm
