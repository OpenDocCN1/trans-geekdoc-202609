  md: 'is often a translation, the authenticity of the demand is somewhat lost. It
    is thus about being able to hear the other person. Baart (2011): the structure
    of involvement is that of question and an answer to it and not another question.


    # Logic


    From this perspective, there is a tension between the logic of professional organizations
    and the logic of citizens. The previously described standards of professionals
    who work within the municipalities, but also within the collaboration parties,
    do not or insufficiently match the standards of citizens (Van Gunsteren 2008).


    This is further complicated because healthcare operates on three sets of logic:
    healthcare logic (appropriate care in a certain (changing) context); logic of
    rules (application of rules and frameworks); and distribution logic (distribution
    of resources). This often complicates access to healthcare for clients (RVS 2019d).


    Due to the increase in multidisciplinary cooperation, the client has to deal with
    more and more care providers. This also requires that the client keep an overview
    in the care process; this also applies for the caregiver. IT plays an increasingly
    important role in directing the care process (comparable to developments in the
    travel industry (booking.com) and retail (Albert Heijn/bol.com). Management and
    healthcare professionals differ in their vision of the duties of informal caregivers.
    In general, there is little contact with (non-resident) informal caregivers (Van
    Wieringen 2014).


    Professional care organizations are dealing with strengthening cooperation with
    informal caregivers to improve the quality of care and with increasing the share
    of informal caregivers (and volunteers). Informal caregivers see opportunities
    for improvement in the area of a better interplay between informal and formal
    care. This also requires healthcare professionals to take on a different role.
    Not only for clients, but also for informal caregivers, support must contribute
    to one’s own choices (Walstra 2011).


    # Interventions


    Formal caregivers more often perform nursing and caregiving tasks; informal caregivers
    more often help with relocating out of the home or arranging help. The formal
    and informal caregivers often help together with the household tasks. According
    to the majority of older people, it is the professionals who now manage a healthcare
    network (Zwart-Olde 2013).


    The question is how to handle this effectively. Interventions should be based
    on a good balance between the perspectives of citizens and those of professionals.
    Five interventions are important (Huygen 2013): sufficient action space for the
    professional but also for the citizen; for the professional, being able to connect
    to the citizen, and the citizen, to society; a sense of belonging: a sense of
    belonging or having room to belong; boundaries and trust.'
