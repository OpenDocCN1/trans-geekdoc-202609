  md: 'of that specific patient and his or her family. That requires not only good
    listening and looking but also the preparedness to actually adapt the care.


    Baart describes professional care as an aid bureaucracy: the cultures of professional
    aid and care provision are usually the same. That is why we encourage entrepreneurship
    from the PlatformVmZ. As an entrepreneur, you focus on the wishes of the client.
    You look at your profession differently: the client must be served and not so
    much the regulations. A risk is also that highly vulnerable clients are left out
    of the picture. Baart: ‘the market does not demand some things at all, yet they
    must be done, given and made available, or there are questions asked for which
    there are no ‘fixing’ answers and that require something very different than a
    market-oriented response’.


    The professional also has an eye for the network and plays an active role in it.
    There is an unrushed pace and loyalty to the client. Baart: ‘the relationship
    is symmetrical when it comes to controlling the goals of life to be pursued, but
    professional when it comes to the roles’ (2011: 783). Care provision is a form
    of service provision, where the idea of production (form of life) is often disastrous
    according to Baart:


    +   - The client is no longer a consumer, but a co-producer.

    +   - The ‘product’ is not fixed in advance but must be discovered.

    +   - The end product is not always perceptible: the service takes place in the
    communicative process.

    +   - It is about finding the human dimension; a predetermined plan is counterproductive.

    +   - There is learning during the service provision; space is needed (Baart 2011:
    824).


    # Complexity of Care


    Current care provision is characterized by four obstacles (Baart 2011):


    +   - Impeded accessibility: clients find it difficult to find care.

    +   - Decoupling care tasks: care tasks and values diverge.

    +   - Increased significance of bureaucracy: involvement, work qualities, core
    activities and stories are constricted.

    +   - Misplaced business structure of care provision: dilution of the distinction
    between providing and producing a care service.


    The practice of healthcare is extremely complex and requires complex thinking.
    Professional work is becoming more complex and more ambivalent (Kanne 2016: 21).
    Good care can never be determined according to a standard model because everyone
    is different and no two contexts are the same. This means that there can also
    be conflicts in what is good conduct in a certain situation (Kanne 2016: 323).'
