  img_proc: true
- pgno: 31
  md: 'capacity, do barriers arise that prevent the adoption of new technologies such
    as blockchain?


    # CONCLUSION AND DISCUSSION


    In this chapter, I present the results of a Systematic Literature Review of the
    development, trends, and impact of blockchain solution implementations in healthcare
    and the considerations for adoption. The findings show that the interest and impact
    in the field of implementations of blockchain solutions in healthcare is growing.
    The conclusions of the selected 38 publications, which were analysed using axial
    coding, show that many studies are still in the planning and development phase.
    The studies studied mostly present a framework for implementing blockchain solutions
    in healthcare. This finding is in line with phases 1and 2 and partly phase 3 from
    the ‘Handreiking e-health implementatie’ (e-health implementation guide) published
    by the digital platform Zorg voor innoveren (Wolters & Hagen, 2019). None of the
    publications contains a study on the evaluation of an implemented blockchain solution.
    The findings from the Systematic Literature Review show that blockchain is seen
    as a solution to promote data sharing within healthcare. This finding aligns with
    the main initiative to initiate a blockchain solution, which is to improve transactions
    between healthcare organisations. From the study of the selected publications,
    it appears that the adoption of blockchain is largely rooted in the technological
    aspects such as security, scalability, and flexibility. From an organisational
    perspective, there is a need for research into the acceptability of blockchain
    as a technology. This need is in line with the results obtained from the TOE framework
    of Tornatzky and Fleischer (Tornatzky & Fleischer, 1990). Holotiuk and Moormann
    describe organisational adoption of blockchain is an important factor because
    organisations must be able to assess the use of a technology, such as blockchain,
    based on need (Holotiuk & Moormann, 2018). Organisational adoption is an ongoing,
    multifaceted process of technological innovation and organisational change management
    (Markus & Tanis, 2000). This Systematic Literature Review is limited because relevant
    data was collected only from the Scopus Database. A broader scope of relevant
    literature would have provided more in-depth information, thereby increasing the
    reliability and validity of this systematic literature review. This systematic
    literature review did provide sufficient insights into where there are gaps in
    the scientific literature. The insights obtained from this systematic literature
    review help to connect the research stream on blockchain with established research
    areas such as organisational and change management.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# FURTHER RESEARCH AND LIMITATIONS


    The conclusion of the fourth sub-question forms the starting point for conducting
    further research. This question focuses on the factors that are considered when
    adopting new technologies. In the introduction to this publication, it was described
    that there is a gap in the literature regarding the barriers to the adoption of
    blockchain by users (patients), but also service providers such as doctors and
    hospital administrators (Jaoude & Saade, 2019). Tandon et al and Holotiuk and
    Moormann confirm this gap (Tandon, Amandeep, Najmul Islam, & Mantymaki, 2020)
    (Holotiuk & Moormann, 2018). Further research is needed to gain insights into
    how healthcare organisations respond to changes caused using new technology, such
    as blockchain. Specifically, research is conducted on organizational readiness
    for change and organizational capacity. Organizational readiness for change focuses
    on the willingness and ability to change within an organization (Weiner, 2009).
    Organizational capacity refers to the competence, motivation, and support present
    within organizations to enable change because of new technologies (Bailey, 1993).
    On this basis, a research agenda was drawn up in which four studies take centre
    stage. In Figure 8, the different studies are visualised and brought into coherence
    with each other. Due to the rapid developments occurring within a disruptive technology
    such as blockchain, an additional Systematic Literature Review is necessary. This
    research will, given the strong development of the research area, take place with
    different terms. Relevant scientific literature published in the year 2021 will
    be included in this Systematic Literature Review.


    In this way, a series of Systematic Literature Surveys will be created, forming
    a longitudinal picture. As recommended by Briner, Denyer, and Rousseau, to have
    sufficient evidence on objects (including a technology such as blockchain) that
    are constantly evolving, the collected literature from the first Systematic Literature
    Review would help to establish a preliminary theoretical framework. Literature
    data from the 2nd Systematic Literature Review serves to justify, supplement and/or
    extend the constructed theoretical framework (Briner, Denyer, & Rousseau, 2009).
    This means that a more sophisticated approach to a Systematic Literature Review
    is necessary. According to Greenhalgh & Peacock, no matter how many databases
    are searched, a Systematic Review of complex evidence cannot rely solely on predefined,
    protocolised search strategies. Strategies that may seem less efficient, (asking
    colleagues, following references that look interesting, and just being alert to
    chance discoveries) may have a better payoff and are likely to identify important
    sources that would otherwise be missed. Citation tracking is an important search
    method for identifying systematic reviews (Greenhalgh & Peacock, 2009)'
  merge: -1
  img_proc: true
