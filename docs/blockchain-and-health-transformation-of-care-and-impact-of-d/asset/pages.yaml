- pgno: 239
  md: 'Time and again it appears to be difficult to find the right balance in a network
    between the self-management of participating institutions or care professionals
    and the management needed to turn a chain into a logistically coherent process
    (Hardjono 2010). The frequently stated management role of health insurer or municipality
    also appears to have insufficient consequences for the success or failure of a
    chain. This often concerns the tension between substantive considerations and
    control options. By making use of an information model based on platform technology,
    that dilemma can be partially solved.


    In such a complex system, it depends on the context in a certain area or for the
    benefit of a certain patient category to what extent chain formation is more or
    less successful. A lot of (administrative) consultation appears to be necessary
    in order to connect patients (clients), care providers, resources and knowledge.


    By combining data from the integrated information system into reports, supervision
    of the results from operations is facilitated and guaranteed. This facilitates
    supervision and makes it possible to assess the business results on the basis
    of current data in current events and to make timely adjustments where necessary.


    The question is always: how does adequate information management promote the work
    of professionals. The point is that the results that the introduction of an information
    system delivers to healthcare organizations lead to involvement, insight, coherence,
    connection, simplicity, cost savings, ease of use, completeness, reliability and
    timeliness. This means that with digital developments the professional (and therefore
    also the client’s question) is central.


    The perspective of clients and professionals increasingly forms the basis for
    the structuring of the organization. Professionals are trained to perform complex
    tasks. However, complexity requires a certain degree of autonomy in a decision-making
    sense. This autonomy enables the professional to respond quickly to new (complex)
    developments.


    Autonomy translates organizationally into self-organization. Visser et al. (2012):
    quality improvement and cost reduction can be achieved by involving clients more
    in professional decisions. The client will increasingly determine where, when
    and how care is given.


    Professionals will increasingly focus on each other and less and less on their
    own organization. With many care organizations (not all) you see that professionals
    focus on their own team and their ‘own’ clients. Self-organization promotes strong
    mutual solidarity. Within organizational forms (networks or care organizations),
    there is freedom to innovate by, for example, re-writing rules. This is where
    entrepreneurship of healthcare professionals comes into the spotlight (Koudstaal
    2016). Because information is easily and horizontally distributed, it is easy
    for (new) preferences, ideas and experiences to be disseminated (Ahlers 2016).


    Jeurissen (2016) states that there are large variations in the practice of care,
    both care focused on healing and the nursing and care of people. In itself, self-regulation
    and self-'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'ordering are mechanisms for managing complex subjects. It is necessary to disclose
    existing knowledge in combination with real-life implementation. Real life means
    that existing interests and existing instruments must be taken into account (2016,
    39).


    Poor communication between primary care and the hospitals leads to fragmentation
    of care. The core of the care is: higher expectations of clients, new technologies
    and treatments, rise in the chronic sick and multi-morbidity, new providers. The
    supply thus determines the type of questions (KPMG 2014, primary care paradox).
    This brings the ability to deal with variety increasingly to the centre of attention.


    The relationship with the client is central. It is thus not primarily about a
    service; it is about the relationship between people (Van der Lans 2008). Important
    characteristics of that relationship are (should be): accessibility, recognition
    of professional expertise, mutual trust, reciprocity, proximity, goal and solution
    orientation. To be successful, the following points for attention for participants
    must be worked out in a recognizable way (Minkman): client-oriented, chain management
    and logistics, result management, optimal care, result-oriented learning, interprofessional
    cooperation, role and task distribution, chain commitment and transparent entrepreneurship.


    Tonkеs has formulated three ‘framing rules’ around the organization of informal
    care (Tonkеs, Van den Broeke and Hoytink 2008) that determine how informal care
    is viewed. Moral framing rules relate to what you see as your duty. Historical
    framing rules relate to our own history. (‘We used to take better care of each
    other.’) Pragmatic framing rules relate to what is available in the eyes of those
    involved. (‘Everyone has a mobility scooter. Why do I have to wait so long?’)
    Framing rules are largely determined by the organization of care in a country
    (2008, 14).


    In a system of market forces, different framing rules apply than when the government
    is primarily responsible. Framing rules determine what we think we can demand
    and how we experience our situation. They thereby determine our ‘feeling rules’
    about which we experience angry, disappointed etc. The combination of framing
    rules and feeling rules determines the life form in which care is provided.


    Professionals often have a coordinating role in professional networks. In that
    situation, informal caregivers have less control over the way in which care is
    provided. Informal caregivers have more influence in mixed networks (Tonkеs, Van
    den Broeke and Hoytink 2008). Tonkеs (2008) distinguishes 5 types of networks:


    +   • Mixed network: balanced combination of professionals, volunteers and informal
    caregivers. The division of tasks between informal carers and clients is often
    not clear in advance.

    +   • Family networks. Care is mainly given by (mostly female) active family members.
    Are supplementary.

    +   • Professional network. Informal caregivers are additional here.

    +   • Isolated pivotal care network. Limited number of people active.'
