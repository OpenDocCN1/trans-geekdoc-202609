    Source: Veuger, ''Belastingdienst, Blockchain, Finance, Taks & Advice'', August
    27, 2019; ''ABN AMRO & Blockchain ontwikkelingen'', September 19, 2019 and ''Themadag
    Politie & Blockchain'', October 10, 2019.


