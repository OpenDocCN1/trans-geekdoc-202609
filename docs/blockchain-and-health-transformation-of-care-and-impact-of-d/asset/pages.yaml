    be recorded in a network, of blockchain for example. Within the IoT, blockchain
    technology is perfectly designed to communicate small objects with each other,
    the second element. IoT is going to have a huge impact on our economy and society.
    High-tech products and forms of service are expected to develop rapidly in the
    coming years, with blockchain technology playing a very important role.


    # Example of Heat Stress Levels


    A proven convergence of blockchain, AI and the IoT is, for example, Fujitsu''s
    algorithm to measure the heat stress levels of employees (Petitjean 2019; Fujitsu
    2019). The algorithm constantly monitors the physiological data of employees (temperature,
    humidity, activity levels, pulse etc.) using portable In-vitro Diagnostic Devices
    (IDA) and sensors to track the correlation between various factors related to
    employee health. The analysis can help the organization to improve working conditions
    and prevent employee health problems.


    Applying blockchain in this system can help to keep more personalized data by
    safeguarding privacy or can help pay out health insurance amounts through Smart'
