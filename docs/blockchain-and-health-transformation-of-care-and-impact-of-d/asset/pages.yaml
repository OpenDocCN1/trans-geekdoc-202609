    # Case 1: ALL THE PARTIES RESPONSIBLE FOR MIJN ZORG LOG


    An important example of Blockchain''s application in the Netherlands is Mijn Zorg
    Log in maternity care. This application has been tested as a practical trial and
    has demonstrated secure information exchange of personal data via a blockchain
    application with different players: the client, healthcare provider, insurer and
    supervisor.


    Zorginstituut Nederland has investigated whether Blockchain is applicable in healthcare.
    This has led to the first working Blockchain in healthcare: Mijn Zorg Log. The
    Dutch blockchain specialist Ledger Leopard built Mijn Zorg Log on an Ethereum
    blockchain platform. Mijn Zorg Log uses this blockchain technology and is therefore
    one of the innovations in the exchange of digital information in healthcare.


    Mijn Zorg Log is a tool that provides insight into how Blockchain technology can
    contribute to the exchange of information in healthcare. It works on the basis
    of a closed blockchain with permissions, what is called a permissioned blockchain.
    In 2017, Mijn Zorg Log was awarded a legal certificate that indicates that the
    application complies with laws and regulations relating to care and privacy in
    the Netherlands (Zorginstituut 2018).


    # Development


    During the development of Mijn Zorg Log, it was taken as a starting point that
    parties who exchange personal data with each other in the blockchain all have
    the role of ''controller'', to use the language from the General Data Protection
    Regulation. Parties that only run a node and cannot add transactions themselves
    or cannot see certain transactions are ''processors''. They process personal data
    exclusively for the benefit of controllers. A'
