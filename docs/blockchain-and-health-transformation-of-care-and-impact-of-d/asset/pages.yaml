  md: 'from the technological context, availability and complexity of technology are
    important considerations that influence the adoption of blockchain. Organisational
    readiness is an important consideration for adopting blockchain. Organisational
    readiness refers to the change readiness and efficiency of the members of the
    organisation to implement an organisational change. (Weiner, 2009) Important contextual
    factors from the organisational perspective are organisational culture, organisational
