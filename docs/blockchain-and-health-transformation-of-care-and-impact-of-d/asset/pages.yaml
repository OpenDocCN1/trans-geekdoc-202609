    # Interaction with Professional: Autonomy of Client


    # *Participation Ladder*


    There is great belief in individual control of one’s own life. However, the care
    arrangements sometimes fail to meet that requirement (Putter 2017). Moreover,
    support options and the ability to deal with them are unevenly distributed. Putters:
    the contrast is growing between those with an accumulation of resources and those
    with an accumulation of defects. This includes the capacity for both thinking
    and doing (2017: 32). For a long time, it was mainly about the difference between
    the haves and the have-nots and the compensation through care, labour and income
    to be able to participate in society. Today, it is much more about the cans and
    can-nots, so about whether a client is really helped with the care provision or
    care allowance and whether a client can find his or her way in the complexity
    of rules (Putters 2017: 31).


    The following definition is used for directing care: someone (or multiple people)
    has directorship when they decide how the care is organized (Verver, Merten and
    Wagner 2016: 7). The interpretation of participation is shown on the basis of
    the participation ladder. The participation ladder (Binkhorst 2009) distinguishes
    five forms of participation:


    +   1. Information: the client also knows. The (care) process is started, and
    the client is kept informed. The professionals have a positive attitude towards
    patient participation, but there is no real involvement.

    +   2. Consultation: the client thinks and talks along with the professional.
    The professional determines what happens, but actively seeks the opinion of the
    client. The client is a serious discussion partner, but the professional is not
    directly committed to the results from the discussions.

    +   3. Advice: the client advises and the care provider decides. Clients’ opinions
    are actively sought, and they are explicitly asked for an opinion. The proposals
    and ideas of clients count and the professional in principle commits to the results,
    but may deviate from this in the final decision-making (with substantiation).

    +   4. Partnership: the client participates in the decision. An equal cooperation
    is created in which clients have their own role, and there is joint decision-making
    with care providers. For example, clients and professionals jointly determine'
