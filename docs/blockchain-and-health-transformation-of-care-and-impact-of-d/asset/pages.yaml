- pgno: 266
  md: 'Language and behaviour of a client stem from their own life story. Without
    insight into that life story, effective interaction is not possible. Personal
    directorship requires coherence between one’s own network (informal care), person-oriented
    care and care technology. It is about creating coherence around individual questions
    where the client’s life is central. This cohesion is designed as an open system.
    This creates the possibility for the client’s management role. Clients can only
    be themselves. A professional offer is then about recognizing that integrality.


    With personal directorship, it is about a psychology of possibilities. Clients
    must have the opportunity to participate in the decision-making process. A model
    to implement this is value-driven care: this way the entire care process is organized
    around the needs and possibilities of the client.


    Based on this book the following preconditions for an interaction based on client
    autonomy emerge:


    +   - Create an activating environment for interaction in which the client’s own
    capabilities are central;

    +   - Ensure a coherent care process in which the social network, personal care
    and care technology come together in a coherent way;

    +   - Ensure that care technology and digitalization are part of the primary process;

    +   - Make sure in the interaction that both the perspective of clients and the
    perspective of professionals can be reflected;

    +   - Make more use of the narrative approach and the presentation theory to maintain
    a view of the individual identity of the client (dealing with variety);

    +   - Ensure an information management system that supports clients’ own management
    (user-friendly);

    +   - Work out a funding model based on the individuality of the client.


    To guarantee autonomy, it is essential that (continuation of) one’s own life is
    central to the interaction between client and healthcare professional. Within
    care for the elderly there are six models in which the values of clients are increasingly
    central:


    +   - Integrated care

    +   - Personal care

    +   - Value-driven care

    +   - Positive healthcare

    +   - Narrative approach

    +   - Presence approach'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'A mix of such approaches per context is effective for strengthening the autonomy
    of clients. This can also be achieved by giving clients a position in policy-making
    and implementation. The core of the presence-based theory is that the healthcare
    professional starts from the other person and not only from your own good intentions.
    The practice of healthcare is extremely complex and requires complex thinking.
    Professional acting is about handling variety. That can lead to a higher degree
    of uncertainty in your own actions. An entrepreneurial attitude makes it possible
    to handle that uncertainty. The increased variety due to preferences of clients
    requires new organizational concepts.


    For professionals to handle variety, regulatory space is essential. This means
    that the care must be organized on the basis of principles of self-organization.
    In the educational programme, therefore, attention must be paid to professional
    competences based on this.


    To guarantee autonomy, it is essential that a professional has sufficient self-regulating
    capacity to focus on the client’s own life in the interaction between client and
    care professional. This is required because the strengthening of the position
    of clients will increase the variety within their own care practice. The effects
    of healthcare technology and digitalization also require an agile approach.


    The role of the healthcare professional is fulfilled out of personal entrepreneurship.
    The choice to work as an entrepreneur is independent of this. It is about the
    interpretation of the professional actions. What is essential here is what contribution
    is made to the client’s request for care. The start-up methodology is introduced
    as a language game. This makes it possible to handle variety and to be helpful.
    Personal entrepreneurship is not so much about operating as an entrepreneur as
    about being entrepreneurial. In addition to being able to conduct a dialogue,
    this also translates into the capacity to use digital work forms. In addition,
    it is necessary to be able to innovate.


    A logical model for a healthcare professional to deal with variety is personal
    entrepreneurship. Personal entrepreneurship focuses on regulatory space (autonomy),
    agility, flexibility and innovation. A workable model for this is the start-up
    approach.


    The redesign of the interaction is about striking a good balance between the client
    perspective and the professional perspective. The core objective is to arrive
    at an equal positioning in an asymmetrical relation. The realization of an effective
    dialogue thus comes to the centre of the interaction. This leads to the following
    preconditions for meaningful interaction:


    +   • Awareness of professional dominance in the interaction (expert knowledge;
    authority as a professional; anchored in regulations)

    +   • Understanding the position of the other: awareness of the individuality
    of experiences

    +   • Developing new (inclusive) mental models: interaction always needs a shared
    balance'
  merge: -1
  img_proc: true
