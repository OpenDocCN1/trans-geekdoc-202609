    # Self-Managing Perspective: Buurtzorg


    The transition program (2009) already established 10 years ago that a great improvement
    can be made in the district nursing by redefining the desired care and services
    and starting from the self-management of professionals in result-responsible units
    (Lindberg, Nash and Lindberg 2008). The Buurtzorg model is in line with this.
    The added value of self-managing teams is mainly seen in the light of the success
    of Buurtzorg.


    At Buurtzorg, the management of care lies with the teams. The team consists of
    a mix of level 3 personal healthcare assistants, level 4, and 1 to 2 at level
    5). The district nurse is not by definition in charge. Part of self-management
    is that everything is done in consensus, with all levels having the same level
    of control. The care is organized in small teams (around 12 professionals), close
    to the client with authority and space to act for care providers. The success
    of Buurtzorg translates into a large number of studies (De Blok 2010; De Blok
    et al. 2015; Van Dalen 2010; Van Dalen 2012; Green 2016; Nandram 2015; Pool 2011).
    These studies have been used in this elaboration.


    Buurtzorg, for example, is not based on a care vision but on a human vision. They
    have set up their system in such a way that self-reliance and independence from
    care are central. Together with their clients, they look for a solution that matches
    their experience and wishes. This requires flexibility in the way of working,
    exchange of knowledge and an eye for the local context (Van Dalen 2010).


    Buurtzorg uses the principle that the content of the care can only be put at the
    centre when the person providing the care also has directorship and control over
    the way in which the work is organized. Self-management at Buurtzorg therefore
    requires self-organizing: by trial and error; diversity and overlap; learn to
    handle load and boundaries; joint solving of individual problems at work; every
    team has its own learning process; further detailing the vision is an ongoing
    process; every team has its own ideal mix of commitment, plans and flexibility
    (Van Dalen 2010).'
