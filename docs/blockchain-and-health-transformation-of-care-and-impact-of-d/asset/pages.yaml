- pgno: 109
  md: 'partnerships between stakeholders, such as in chains. Blockchain strengthens
    knowledge and experience and develops employee competencies (VNG 2019). In the
    next chapter, we delve deeper into the application possibilities.


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_109_0.png)


