- pgno: 209
  md: '# Agility


    This new way of working focused on showing how you can work better as a professional
    with the new digital tools; how to strengthen collaboration; how to solve and
    adjust the digital (work) environment on the basis of daily work problems. The
    same applies for the client, who can more easily access information and forms
    of service.


    Agility is decisive for competitiveness and has four main building blocks: look
    outside, good examples are followed (connecting leadership) self-organizing units
    and modelling and generation: flexible processes and IT. Developing agility requires,
    among other things: insight into customer behaviour, process-oriented management,
    dynamic competence, networks and sensemaking (Veuger 2017, 5). This implies a
    change strategy focused on working with clients and professionals to achieve awareness
    of the added value of this new working method (Ten Have, Ten Have and Janssen
    2009). Without that awareness, and thereby resolving one’s own bottlenecks, effective
    implementation remains hardly possible. Bisognano: ‘Getting the triple aim of
    better health, better care, and lower per capita costs will require new designs
    and models of care. This can only be achieved by real co-production of care, with
    patients and families as drivers’ (KPMG 2016).


    Points for attention (KPMG 2016, 4) are:


    +   - Vision to introduce new methods; technology is supportive not leading;

    +   - System design is needed to provide solutions to the problems that clients
    and professionals have.


    Medical technology is defined as all technology aimed at improving the quality
    of care for patients/clients. By digitizing healthcare close to the client, healthcare
    becomes more personalized, leading to higher-quality healthcare for individuals.
    Technology is therefore seen as an important impulse to grow outpatient care.
    The medical technology market in the Netherlands in the home situation is estimated
    at € 2.3 billion (KPMG 2017). A number of conclusions:


    +   - Therapy and treatment are shifting to prevention (stimulated by ehealth
    solutions and smart apps).

    +   - Care is becoming increasingly personalized, and medical technology is more
    focused on a specific patient.

    +   - A shift from inpatient care (hospital/nursing home) to care in the home
    situation is stimulated by developments in medical technology (Internet of Things).


    Value and outcome must be at the top of the agenda (KPMG 2014). It is about personalized
    care.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# **Digital Health Management**


    In this way, an element in stimulating digital health management is an expected
    contribution to the scarcity of health care professionals: it is not only about
    values such as autonomy but also about the cost-effective organization of health
    care (Niezen and Verhoef 2018). The establishment of a data value chain means
    that based on data and its analysis, interventions in the lives of citizens can
    be achieved.


    Healthcare has specific values with regard to governance issues, for example that
    there must be support for the content of care and for the way in which that care
    is provided (Berenschot 2019). The use of blockchain technology means, among other
    things, autonomously regulating the integrity and quality of the provision of
    information and validating automated chain processes. At present, there are no
    large-scale applications in health care in the Netherlands (Berenschot 2019).
    The National Science Agenda does, however, offer a framework for further interpretation
    of technological developments and their impact on, for example, healthcare (Ministry
    of Economic Affairs and Climate 2018).


    Deciding together is about the process of shared decision making. The RVS (2017)
    does not advocate an evidence-based approach, but a context-based practice. It
    is essential to keep track of the specific context of a client and to connect
    and deploy the available knowledge accordingly. Healthcare professionals must
    insert shared decision making practice in the context of a client. It is not so
    much about the dissemination of information but about listening to the client
    (RVS 2017).


    The client has the relevant and objective information about the care process,
    and the care professional is aware of the preferences of the client. It is precisely
    outcome information (value-driven care) that could further support healthcare
    professionals and clients in making the right assessment (Equalis 2019). Deciding
    together works best if it fits in with existing healthcare practice. Healthcare
    professionals use this methodology if they can integrate it into their own working
    method and professional identity.


    When a healthcare professional gives information to a client, it is important
    to provide support with interpretation, sketching the right context and bringing
    together wishes and goals of clients with the available information (Equalis 2019).
    The caregiver becomes a guide who provides the client with relevant information
    and explores the values and preferences of a client. The point is that clients
    are involved in their own care and the choices they have and that they are given
    room for reflection on what is important in their own lives (Equalis 2019).


    # **Consumer Driven Care**


    A form in which this takes place is Consumer Driven Care (CDC). CDC is both a
    philosophy and an orientation towards the provision of care services to clients
    in which they choose and determine which they purchase (KPMG 2014). This is a
    model developed in Australia. ‘CDC is a way of delivering services that allows
    consumers to'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'have greater control over their own lives by allowing them to make choices
    about the types of care and services they access and the delivery of those services,
    including who will deliver services and when.


    Under a CDC approach consumers are encouraged to identify goals, which could include
    independence, wellness and re-ablement. The consumer decides the level of involvement
    they wish to have in managing their care. Through the introduction of an individualised
    budget, CDC provides greater transparency to the consumer about what funding is
    available under the package and how those funds are spent’ (2014, 7).


    To achieve shared decision-making, other skills of healthcare professionals are
    needed, such as coaching and open conversation techniques. It is about translating
    professional jargon and thinking into the environment and context of clients (Huijsman
    2013, 41). This is not self- evident because, just as in health care in general,
    little attention is paid to the world of the elderly in elderly care (Luijkx 2014,
    3). In designing the care process, it is not self-evident that the goals and needs
    of clients and care professionals run parallel (Zwakhalen 2018).


    Sensemaking of data should take place in the conversation between caregiver and
    patient about what is currently good care for this patient; in a process of shared
    decision- making, in which decisions are made about care and treatment. The effects
    of such a process are still unclear: whether there is a more efficient use of
    care is unclear (Delnoij 2019).


    Determining and involving the preferences of the patient in decision-making leads
    to a fundamental change in the interaction between client and care professional,
    but it is also problematic because it has not been properly realized for many
    care professionals. Healthcare professionals have a strong tendency to direct,
    while in many cases, the autonomy of the client can be much more central (Ubbink
    2018).


    Personalized care is about respecting the individuality of the care recipient,
    whereby the care professional recognizes the client as an individual and guarantees
    autonomy and independence for the person as well as possible. The quality of care,
    the relationship with the client and the environment contribute to the client’s
    independence. It is therefore about an individualized care philosophy (KPMG 2014).


    # ## Provision of Information


    The client’s story is essential to achieve compassion. Compassion translates into
    seven dimensions (Van der Cingel 2012): attention, active listening, dialogue,
    involvement, helping, presence and correct understanding of the other. Care and
    compassion take the subjective story of the client as a starting point. The practical
    wishes presented by the elderly do not necessarily translate into survival, a
    lower percentage of readmissions or a reduced decline in independence and are
    often not reflected in validated questionnaires that measure the quality of life.
    They are matters that are difficult to make tangible and objectify and that have
    to do with the feeling of safety,'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'with fear of the consequences of deterioration and of loss of control and self-respect
    (2015, 12).


    Because information is available, professionals can independently come to: distribution
    of (shared) resources, accountability of own resources, mapping effectiveness
    and efficiency and elaboration of operational plans. The RVZ (2014b) advised on
    structuring the provision of information about the patient. First, give the patient
    (also the insured or citizen) insight into his or her health information. This
    must be extended to a personal health record ‘PGD’. This PGD (PGO) contains (digital)
    copies of electronic medical records of healthcare providers and data that the
    patient adds to this. The patient decides whether he wants a PGD and who manages
    it.


    # **Information Standards**


    Recently, developments in the Netherlands in the field of digital information
    exchange in healthcare have accelerated. Nictiz is a Dutch knowledge organization
    that is committed to digital information exchange in healthcare. Together with
    the healthcare field, this organization develops and manages information standards
    that are necessary for the proper exchange of information. Examples include information
    standards for nursing transfer, for the exchange of data in acute care, in maternity
    care, the exchange of data from laboratories, medication safety and care for people
    with chronic diseases. Examples include information standards for nursing transmission,
    for the exchange of data in acute care, in obstetric care, the exchange of data
    from laboratories, medication safety and care for people with chronic diseases.


    An information standard is a collection of agreements designed to ensure that
    care information can be recorded, retrieved, shared, exchanged and transmitted
    with the right quality. Examples of care information include blood pressure, discharge
    date, diagnosis and weight but also civil status, gender and name. Because the
    healthcare field is too complex to describe in a single information standard,
    Nictiz develops information standards together with the healthcare field for specific
    and well-defined situations in which healthcare professionals exchange information,
    with each other and with their patients (use cases). The information standards
    are infrastructure-neutral.


    An information standard forms the basis for the functional and technical requirements
    imposed on the applications such as the electronic patient file (EPD) and the
    infrastructure. The dataset is a crucial part of an information standard. This
    contains the specification of all data (clinical concepts) that are recorded or
    exchanged within the context of a specific care process and the use-case(s) defined
    thereby (https://www.nictiz.nl/rapporten/informatie standaarden-basis-voor-gegevensuitwisseling-
    in-de-zorg/). Simply put, the dataset describes which data is involved.


    Datasets are built up as much as possible on the basis of healthcare information
    building blocks (zibs). Zibs are small information blocks that you can use to
    easily and unambiguously describe what the dataset of an information standard
    consists of. Zibs'
