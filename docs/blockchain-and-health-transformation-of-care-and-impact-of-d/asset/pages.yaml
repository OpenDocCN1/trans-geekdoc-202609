- pgno: 238
  md: '+   - Awareness that care and care providers are part of a (care) network around
    elderly people living independently, ensuring that they are familiar with the
    existing guidelines and standards in the field of cooperation in care and support
    and the social map of relevant region

    +   - Agreeing on how control is monitored within the (care) network and agreements
    on actions to be taken when loss of control occurs

    +   - Identifying vulnerable clients, their degree of control, make an inventory
    of the (care) network (both formal and informal) and seek coordination and exchange
    information.


    Bloem (KPMG 2014) has worked out this as follows within ParkinsonNet:


    +   - Ensure that active patients can manage their care themselves and are involved
    in important decisions.

    +   - Determine what value-driven care should look from the patient’s perspective.

    +   - Change the way healthcare professionals work: they become patients’ partners.

    +   - Provide a network of experts.

    +   - Connect all this with IT tools.


    The question of how care organizations and professionals have shaped the management
    role in the care network shows that there is hardly any care coordinator, that
    in about one-third of the cases, agreements are made about the point of contact
    regarding care, that the identification lies mainly with the elderly themselves
    and that in most cases the care providers leave the directing role to the client.
    Research from 2017 (Gijzel 2017: 12) shows that the term self-reliance is hardly
    used by clients or healthcare professionals. They mainly use the term personal
    directorship, and healthcare professionals sometimes also use quality of life.
    Most healthcare professionals, clients and informal caregivers are not or are
    only to a limited extent familiar with the term and function ‘independent client
    support’. According to healthcare professionals, care plan discussion, involvement
    of the social network and the use of volunteers contribute to the quality of life
    of the client. However, clients themselves indicate that they are still not sufficiently
    involved in their own plan (Gijzel 2017: 126).


    Collaboration with family and informal care around healthcare and support are
    becoming increasingly important in elderly care. When setting up network structures
    between professional care and informal care, there are four roles that an informal
    caregiver can play: as a colleague, expert, client and neighbor. Which role is
    most prominent may differ, for example, due to the phase of the disease or the
    living situation of a patient. The emphasis on collaboration is different for
    each role. A lot of attention is paid to digital systems to support the collaboration.
    Platform technology reinforces the role of the informal caregiver (RIVM 2014).'
