- pgno: 11
  md: '# # ABSTRACT


    This Systematic Literature Review provides insight into the development, trends,
    and impact of implementations of blockchain solutions in healthcare. To introduce
    the subject of blockchain, an image of the essences of blockchain as a technique
    to realise digital transformation was obtained from scientific literature. The
    purpose of this review is to focus on the current use of blockchain in healthcare
    and the direction of development. Background information on the characteristics
    of blockchain as a technology has been provided to give information about the
    context. To carry out this Systematic Literature Review, a methodology has been
    described, in which four research questions have been formulated, which deal with
    the developments, trends and adoption process of blockchain solutions in healthcare.
    The Scopus Database was used. Both the number of publications and citations show
    a strong increase from 2018. Publications are particularly prevalent in the research
    areas “Computer Sciences” and “Engineering”. This indicates that the focus in
    terms of blockchain is mainly on technology. China is currently the country with
    the highest citations per scientifically referenced publication with the topic
    “blockchain in healthcare”. Both the research field and the stage of implementation
    give an indication of the developments in the field of blockchain solutions. This
    Systematic Literature Review indicates that an important field of research concerns
    the sharing of data and healthcare information within and between healthcare institutions.
    Many blockchain solutions are in the planning and development phase. To gain a
    clear picture of the trends within the implementations of blockchain solutions
    in healthcare, an analysis was carried out by type of initiative. Blockchain solutions
    that have as their initiative the improvement of transactions between organisations
    and initiatives that are disruptive to existing business models, show an increase.
    An in-depth elaboration of the TOE framework has given insight that the availability
    of blockchain as a technology, the organisational readiness and the pressure from
    competitors are important considerations of adoption.


    **Keywords:** blockchain, healthcare, systematic literature review, implementations,
    adoption


    # # INTRODUCTION


    Blockchain is a technology to realise digital transformation in healthcare. (Veuger
    & Woldendorp, Blockchain in healthcare, 2021) This Systematic Literature Review
    examines what is known within the research literature about terms “implementations
    of blockchain solutions in healthcare and the considerations of adoption”. The
    aim is to provide insight into the development, trends, and impact of blockchain
    implementations in healthcare and the considerations for adoption. A systematic
    literature review is to be conducted to gain insight into the global adoption
    phase of blockchain in healthcare. The goal is to gain insight in the extent to
    which blockchain in healthcare has already led to implementable solutions.


    In its article on the health (care) future of the Netherlands, Deloitte outlines
    that, due to falling costs of technology and new developments, future care will
    be organised more'
  merge: -1
  img_proc: true
- pgno: 12
  md: outside the hospital and therefore closer to the patient. Examples are remote
    monitoring, diagnostics, and consultations. This will make personal interventions
    possible, and the patient will not have to visit the hospital immediately. (Luijs,
    Bergen, & Engelen, 2020). Moving care from the hospital closer to the patient
    means a transformation in which technological development and digitalisation are
    the triggers. According to Beijen, digital transformation is characterised by
    a transition from product focus (the provision of care) to a focus where the customer
    (the patient) is at the centre. Organisations that place the focus on the patient
    are characterised by a continuous openness to change, are insight-driven and have
    access to platforms that enable cooperation between various stakeholders from
    a technological perspective, without this leading to a loss of quality (Beijen,
    2020). Blockchain is a technology that can be used to facilitate such a transformation.
    What is blockchain? In essence, blockchain is a data structure - a kind of database
    - to which only digitally signed data can be added collectively by the peer-to-peer
    network (without a central party). However, it is necessary that this data meets
    certain conditions (rules), which is also verified collectively. (Goossens & Verslype,
    2019). A blockchain does not grant administrator rights to change or delete data.
    A change can only take place by carrying out a new transaction, whereby the consensus
    protocol applies. (Nakamoto, 2008). When making a change within a block, the hash
    value of the block also changes, which results in the chain being interrupted.
    This means that changes within a block are not possible, which reduces the vulnerability
    to fraud. Blockchain has the technological advantage of increasing transparency
    and strengthening trust. Transparency and trust are particularly important aspects
    to realise value creation in the longer term. (Berns, et al., 2019). In the healthcare
    sector, it is important that data transactions between different entities can
    take place in a secure manner, due to the high degree of privacy sensitivity.
    This is because the data in question is confidential. It is a trend that more
    stakeholders play a role in healthcare, including large technological companies
    such as Google and Apple (Luijs, Bergen, & Engelen, 2020). This will free up more
    capital to invest in new technologies that make transformation possible. Also
    J. Veuger and H. Woldendorp, in the book ‘blockchain in healthcare’, outline the
    role and importance of digital transformation to enable a shift from healthcare
    to health. (Veuger & Woldendorp, Blockchain in healthcare, 2021) It is strange
    that adoption of blockchain in healthcare is insufficient, given its potential
    to strengthen trust and increase transparency, with privacy sensitivity being
    a key issue. Many studies have been done on the adoption of blockchain in healthcare
    and the considerations for not yet using blockchain as a technology for digital
    transformation. Many studies deal with the technological aspects of blockchain.
    Important technological considerations mentioned in the literature for not immediately
    applying blockchain are about the lack of standards for information exchange (Boulos,
    Wilson, & Clauson, 2018). In addition, aspects such as scalability and working
    from different platforms are mentioned as considerations for not applying blockchain.
    Scalability is about the speed of processing data. Platforms are about technical
    suitability
  merge: -1
  img_proc: true
- pgno: 13
  md: '(Griggs, et al., 2018) (Liang, Zhao, Shetty, Liu, & Li, 2017). These literature
    reviews show that little is known from an organisational perspective, what are
    now important considerations for adopting blockchain, as a technology to achieve
    digital transformation. Clohessy & Acton confirm this in their study on the influence
    of organisational factors on blockchain adoption. (Clohessy & Acton, 2020) Pawczuk,
    Massey and Holowsky indicate that contextual factors such as people and culture
    can be critical success factors for an innovative technology (Pawczuk, Massey,
    & Holdowsky, 2019). These critical success factors are part of Weiner’s conceptual
    model (Weiner, 2009). This model provides insight into which dimensions are important
    when measuring organisational readiness for change. In a study by Jouade & Saade
    on the use of blockchain in various domains, a gap is identified in healthcare
    regarding the barriers to blockchain adoption by users (patients), but also service
    providers such as doctors and hospital administrators. (Jaoude & Saade, 2019)
    Tandon et al, confirm this gap in their publication, blockchain in healthcare;
    A systematic literature review, synthesising framework and future research agenda
    (Tandon, Amandeep, Najmul Islam, & Mantymaki, 2020). This gap indicates that little
    is yet known from an organisational perspective about the adoption of blockchain
    in healthcare. Research and ideas from “The Duality of Technology” by Orlikowski
    (1992), assume that changes need to be made to organisations as technologies change.
    The degree of change depends on the complexity of the technology being adopted.
    (Orlikowski, 1992) Holotiuk and Moorman confirm that blockchain is a complex technology,
    which presents organisations with several challenges. Cooperation between organisations
    and early involvement are important aspects in the development of ideas, adoption,
    and application of technologies. (Holotiuk et al., 2018) In Bailey’s AMO framework,
    collaboration and engagement are important components for determining organisational
    capability (Bailey, 1993).


    The objective is to gain insight from literature research into which indicators
    from an organisational perspective influence the adoption of blockchain as a technology
    for digital transformation within the healthcare sector. To realise this objective,
    more insight is needed into the use of blockchain in healthcare. A Systematic
    Literature Review can provide valuable information on the current knowledge in
    a research area. It places the subject of blockchain in a broader context and
    shows why the study is timely and important (O’Reilly, 2012). Furthermore, a Systematic
    Literature Review makes it possible to identify existing gaps in knowledge to
    carry out further future research. (Gopalakrishnan & Ganeshkumar, 2013) In order
    to gain a better understanding of the use of blockchain in healthcare and the
    adoption of this technology, the following four research questions were posed:


    +   1. What has been the development of implementations of blockchain solutions
    in recent years within the healthcare industry?'
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   2. What are the main trends of implementations of blockchain solutions
    within healthcare?

    +   3. What distribution is visible within the phases of adoption regarding blockchain
    solutions in healthcare?

    +   4. What factors are considered in the adoption of blockchain solutions?


    This publication is structured as follows: Chapter 2 covers motivation and contribution
    of the literature review. Chapter 3 provides background information on Blockchain
    technology. Chapter 4 deals specifically with blockchain as a technology within
    healthcare. Chapter 5 discusses the applied methodology for conducting a literature
    review. Chapter 6 presents the results of the literature review. Chapter 7 answers
    the research questions. Chapter 8 formulates the conclusion, and the discussion.
    Chapter 9 presents the agenda for the continuation of the research.


    # MOTIVATION AND CONTRIBUTION


    In contrast to the mentioned articles, this work presents a Systematic Review
    and Analysis of the state-of-the-art concerning blockchain research, in the field
    of healthcare and then specifically focused on the realisation of implementable
    solutions. The aim of this paper is to indicate the use of blockchain in healthcare
    and to show the initiatives and possible directions of blockchain research, concerning
    implemented solutions.


    # BACKGROUND INFORMATION


    This chapter provides insight into the most important characteristics of blockchain
    as a technology. Blockchain is basically a distributed ledger with the ability
    to exchange data between individuals, who are part of the network (Swan, 2015).
    Blockchain technology was introduced at the same time as the introduction of Bitcoin.
    Blockchain as a technology has ensured that duplication of transactions with cryptocurrency
    is no longer possible. Bitcoin uses the consensus mechanism where the majority
    (51%) decides whether a transaction can be validated or not. Mining nodes are
    those that can create a new block to store the data and perform the transaction.
    It is not always necessary to introduce a cryptocurrency where blockchain is used
    as a technology, working on a decentralised application (Raval, 2016). The remainder
    of this chapter describes the fundamentals, characters, and key elements of blockchain,
    to provide the reader with an understanding of how the technology works.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Types of Networks


    There are various types of networks on which a blockchain operates. For example,
    there is a public, private, ‘permissioned’ and ‘permissionless’ network (Dai &
    Vasarhelyi, 2017) The choice of the type of network depends on the purpose for
    which the technology of blockchain is deployed. A ‘public permissioned’ blockchain
    is best suited for ensuring client privacy (Nordrum, 2017) and therefore applicable
    within healthcare, where privacy is an important issue.


    # Consensus Protocols


    Blockchain makes it possible to carry out transactions between two different entities
    without the need for a third party to validate the transaction. The consensus
    mechanism takes care of obtaining validation. There are different protocols for
    obtaining consensus. What is the added value of a protocol within a Blockchain?
    The added value of a protocol is that it provides the validation of transactions.
    In doing so, Blockchain network peers must agree on the exact state of the shared
    ledger and order in which new blocks are added to the ledger (Aste, Tasca, & Di
    Matteo, 2017).


    7 different consensus protocols can be distinguished namely (Janse & Lin Lim,
    2020):


    +   1. Proof of Work (PoW)

    +   2. Proof of Stake (PoS)

    +   3. Delegated Proof of Stake (DPoS)

    +   4. Proof of Importance (PoI)

    +   5. Proof of Activity (PoA)

    +   6. Proof of Burn (PoB)

    +   7. Proof of Deposit (PoD)


    The most used protocols are Proof of Work and Proof of Stake (Janse & Lin Lim,
    2020). In Proof of Work-consensus protocol, as set up for Bitcoin for example,
    a data block may only be added to the blockchain if a valid hash of the block
    is found. With Proof-of-Stake, being allowed to produce a block depends on (a)
    a random selection process and (b) a stake, for example based on the number of
    coins held by an entity. There are several possible variants of the Proof of Stake
    protocol (Zheng, Xie, Dai, Chen, & Wang, 2017). The most well-known form is the
    Delegates Proof of Stake. This protocol is best compared to a continuous representative
    democracy where everyone who has a coin can vote for witnesses and delegates.
    The role of witnesses is to validate transactions and to be allowed to produce
    new blocks. For providing this service,'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'witnesses receive a reward per block produced. Delegates have no role in verifying
    transactions and validating and producing blocks. The role of delegates is to
    oversee and monitor the governance structure of the blockchain protocol (Janse
    & Lin Lim, 2020). The entity with the highest importance score can validate transactions
    by producing new blocks (He, Guan, Lv, & Yi, 2018). The Proof of Activity protocol
    assumes those nodes that are most active within the network. The more active nodes
    are within the network, the more secure the network is. Initially, the Proof of
    Work protocol is executed to produce the block, where in terms of validation,
    a choice is made from those nodes that are most active (He, Guan, Lv, & Yi, 2018).
    In a Proof of Burn, an entity is given the right to add and validate a block at
    the time when cryptocurrency has been sent by this entity to a nonspendable address
    and destroyed. (Gourisetti, Mylrea, & Patangia, 2020) The last consensus protocol
    is the Proof of Deposit. In this protocol, each node that participates in validation
    must pay a deposit to earn the right to create new blocks. The deposit can be
    forfeited and the right to make blocks can be restricted if certain conditions
    are not met. (Hölbl M., Kompara, Kamišalić, & Zlatolas, 2018).


    # Smart Contracts


    Blockchain makes it possible to automatically execute transactions using Smart
    Contracts. But what are Smart Contracts? Cieplak and Leefatt describe in their
    publication “Smart Contracts as; “A smart way to automate performance”. In general,
    Smart Contracts are computer protocols that implement the terms of a negotiated
    contract in a self-executing way (Cieplak & Leefatt, 2017). Smart Contracts can
    take place in two ways. First, there can be deterministic contracts; here the
    program code does not rely on information outside the blockchain to initiate the
    execution of the contract. All the necessary information is stored in the blockchain
    itself. Secondly, there may be non-deterministic contracts. In this type of Smart
    Contract, information from outside is needed to execute the Smart Contract. By
    outside, another data source is meant, for example, the Internet or another database.
    (Hewavitharana, Nanayakkara, & Perera, 2019)


    # Rules for Validating a Blockchain


    Validation rules are the set of rules within the network that are used to validate
    transactions and update the ledger (Janse & Lin Lim, 2020). The sender starts
    a transaction by creating a message, which contains; the ‘public’ address of the
    recipient on the network, the value of the transaction and an encrypted digital
    signature. The sender then sends the transaction into the network. The blockchain
    records the time when the'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'transaction was created, the so-called timestamping. The nodes (computers/users)
    decipher the encrypted signature and thereby validate the message. They compare
    the time of creation of the transaction with earlier times to avoid double spending.
    The message then enters a queue of transactions to be processed. The transactions
    to be processed are collected by one of the nodes and placed in a block. The node
    sends the block within a specific time interval to the network for validation.
    The computers in the network can validate a block. They do this through an iterative
    process that requires consensus from the network. The validation process depends
    on the type of consensus protocol used. The type of consensus protocol used depends
    on the network in use. The common denominator is that it must be possible to determine
    that a transaction is valid and that corrupt transactions are rejected. Once the
    transactions in a block have been validated, the block is fixed in the blockchain
    and the new updated status of the ledger is sent to all nodes again (Muzammalab,
    Qu, & Nasrulin, 2019)


    # BLOCKCHAIN IN HEALTHCARE AND THE NEED


    When looking at the healthcare sector, a study by Pessin, Shanler, Cole, & Stevens
    shows that there is a growing interest from the healthcare sector in blockchain
    technology worldwide. (Pessin, Shanler, Cole, & Stevens, 2019). The research by
    Pessin, Shanler, Cole, and Stevens shows that 55% of the institutions surveyed
    (n = 204) are interested in using blockchain as a technology. The following areas
    are mentioned as interesting for using blockchain as a supporting technology.


    +   - Medical records management.

    +   - Medical claims management.

    +   - Healthcare professionals credentialing.

    +   - Healthcare and life sciences supply chain management.


    A distinction is made between four types of initiatives for the deployment of
    blockchain, these are:


    +   - New disruptive initiatives, which are based on the application of blockchain
    within an existing business model.

    +   - Initiatives to improve transactions of assets and interactions between organisations,
    leading to increased transparency and traceability.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - Initiatives that lead to the creation of new virtual and physical markets.

    +   - Initiatives that can contribute to the safe storage of data within a community.

    +   (Pessin, Shanler, Cole, & Stevens, 2019).


    Several Systematic Literature Reviews have been published with the topic of blockchain
    in healthcare. Using the Google Scholar database, the notation: “Systematic Review
    “AND “Blockchain in Healthcare” with a range between the years 2019-2020 yields
    a total of 322 cited publications. If the range is increased from 2016-2020, it
    turns out that 363 publications comply with the above notation. The conclusion
    is that there have been more publications in recent years, which provide a systematic
    review of blockchain in healthcare (Mayer, Costa, & Rosa Rhigi, 2020). Looking
    at the most cited articles, it is striking that they mostly deal with the adoption
    process, the advantages and disadvantages and possible applications of blockchain.
    Little is known about initiatives and applications within the healthcare sector
    that have led to concrete solutions using blockchain and the considerations for
    adoption.


    # METHODOLOGY


    For this Systematic Literature Review, the research field is limited to the domain
    of care and cure. Below, the methodology used is defined, which helps to gain
    insight into the extent to which the use of blockchain within healthcare has already
    led to implementable solutions and which considerations are important in the adoption
    of blockchain as a technology.


    # Research Questions


    This study intends to answer the following research questions:


    +   1. What is the development of implementations of blockchain solutions in recent
    years within the healthcare sector?

    +   2. What are the main trends of implementations of blockchain solutions within
    healthcare?

    +   3. What distribution is visible within the phases of adoption regarding blockchain
    solutions in healthcare?

