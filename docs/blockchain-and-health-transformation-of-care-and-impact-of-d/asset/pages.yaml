- pgno: 118
  md: '![](img/7aac89a23a631ee44add9e5eff18dfe7_118_0.png)


    # Figure 23. The three contracts of MedRec.


    Clients (and their informal caregivers) are therefore connected to different care
    providers. MedRec offers a combination of a social need and a technological solution.
    The first implementation of MedRec was developed by using Ethereum Blockchain.
    The system of smart contracts ensures connection between clients and care providers.
    MedRec does not store the data, but encodes metadata that make it possible for
    clients to securely access care data in different domains. The metadata contain
    information about ownership, releasing data and integrity of the data requested.
    MedRec 2.0 is being tested. Smart contracts are considered agreements to execute
    a certain code (source of medical information) under certain conditions. MedRec
    has three types of smart contracts, see also Figure 23.


    +   - The registration contract binds participating parties (clients, care providers,
