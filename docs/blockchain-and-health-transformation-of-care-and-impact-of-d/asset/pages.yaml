- pgno: 63
  md: '# Irrefutable


    Because stamps are placed in the blockchain, which meet certain agreements and
    are checked by all members of the network, these data are in fact irrefutable.
    Irrefutable here means that you cannot simply delete data. This ensures that it
    can be trusted that one party cannot make changes or delete data without the others
    being aware of this.


    # Control over Your Own Data


    By means of the wallet (see box), the user has control over who is allowed to
    do what and when with his data. Within the framework of a blockchain, it is irrefutably
    recorded who has done what and when with the data.


    # Intelligent Layer


    It is still difficult to connect different data silos. Think, for example, of
    hospitals that all have their own data islands, which has been set up over time.
    In this context, blockchain forms an intelligent layer that connects these sources,
    so that patients can follow the reliable ''stamps'' path.


    # Administrative Optimization


    When you look at data within an administrative process, the administrative process
    follows the operational and financial processes and is therefore set up reactively.


    # Wallet


    With a wallet, a user sends and receives blockchain transactions. The wallet signs
    transactions with a digital signature (public key). The secret piece of the digital
    signature (private key) keeps a user secret. The private key is used as mathematical
    proof that the transactions originate from the owner of a particular wallet. The
    private key also prevents the transaction from being changed by someone once it
    has been issued by the user. All transactions are exchanged between users and
    are confirmed within minutes by a process called mining.


    The user''s wallet is the personal environment or the user-friendly application
    with which the user can access the blockchain. Personal data about the user (such
    as the private key of the user) can be stored in the wallet. The personal data
    stored in the wallet are considered off-chain personal data (Zorginstituut 2019).


    # Security


    The importance of blockchain ensuring the reliability and accuracy of data. This
    is an essential development for healthcare. So you can see that security is crucial
    in the design and application of this technique. For example, all transactions
    require a digital signature'
  merge: -1
  img_proc: true
