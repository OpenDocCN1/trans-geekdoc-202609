- pgno: 8
  md: '# PREFACE


    The secure storage of medical records is vital to any healthcare system. Relying
    solely on centralised servers increases the likelihood of sensitive information
    going public. Transparency and increased security of blockchain technology make
    it an ideal platform for storing medical records.


    Patients can safely store their privacy-sensitive information by securing their
    data on a blockchain using cryptography. This enables them to share their medical
    information with any healthcare institution with their approval. The healthcare
    system is currently very fragmented, but if all users were to use a secure global
    database, the flow of information between them would be much faster.


    A great advantage of a global database is that clients do not have to tell their
    story every time. A medical specialist, for example, can see exactly what a patient
    has been through and what treatments and examinations have taken place. The information
    is also available in real time to the healthcare professional the client has indicated
    to have access to his file.


    A new revolution is taking place that is clearly different from the third industrial
    revolution (Internet, communication and globalisation). This fourth industrial
    revolution involves a fusion of technologies such as biotechnology, nanotechnology,
    artificial intelligence, robotics, the Internet of Things, cloud computing and
    blockchain. Our healthcare society is also changing fundamentally, also under
    the influence of COVID-19.


    These fundamental changes require an integrated and comprehensive response, involving
    stakeholders in public and private society. The challenge is how to use innovations
    from the fourth industrial revolution to take healthcare to a new level and solve
    at least the most pressing problems in healthcare and society. Blockchain will
    play a major role in this. It is a core technology that has the potential to combine
    digital data with physical systems.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'The starting point of our healthcare is that patients can choose the care that
    suits them. But how can a patient do this in a field where the complexity is only
    increasing? In addition, the ageing population will lead to an increase in the
    demand for care. Rising healthcare costs and an increase in chronic diseases also
    require a new approach. And treatment is increasingly taking place in a home environment
    rather than in a hospital or care institution. So there is a great need for innovation
    in healthcare.


    Healthcare is a high-tech and information-intensive environment. Partly because
    of this and because of the importance of good communication for the client, you
    would expect the exchange of information in healthcare to be well organized. However,
    healthcare is organized in such a complex way that both professionals and clients
    lack insight. For instance, healthcare professionals describe conditions and treatments
    in different ways, which makes it difficult to interpret information from different
    healthcare records unambiguously. In addition, healthcare providers use a variety
    of information systems, making it difficult to link information. Obviously, security
    of information is an important issue, which also contributes to the complexity
    of data exchange.


    Digitalization makes it possible to implement fundamental changes in business
    operations. The trick for administrators is to securely and intelligently connect
    all the applications and information systems that healthcare parties use. In this
    book, we elaborate on how blockchain will contribute to these challenges. Blockchain
    is a decentralized network for storing data. It is designed to achieve integrity,
    transparency, efficiency and accuracy of data.


    With this book in three chapters, we present the impact of blockchain and digitization
    in healthcare with (1) a systematic literature review om implementing blockchain
    solutions in health care and organizational consequences, (2) blockchain in health
    care and (3) transformation of elderly care and impact of digitalization.'
  merge: -1
  img_proc: true
