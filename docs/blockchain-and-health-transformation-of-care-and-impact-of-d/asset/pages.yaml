- pgno: 53
  md: 'Blockchain network, in the best case scenario, always share the same copy of
    the Blockchain (Lim and Janse 2020).


    In principle, a Blockchain is: a database comparable to a ledger, that is copied
    and distributed across different computers and reliable.


    Each action of each participant is recorded in a database, which is not only in
    one place (decentralised). Partly because the database is stored decentrally on
    thousands of servers around the world, the information remains securely stored
    and the system is fraud-proof. Every user has an up-to-date copy of the database
    with all transactions at all times. Data is never lost as a result. Figure 3 shows
    the difference between a central and decentralised database.


    A Blockchain can be explained at different levels. At the simplest level, a simple
    analogy is often made with a database or ledger that keeps track of all transactions.
    An exact copy of this ledger is distributed across different computers that are
    connected to the network. To hack the ledger, you need to hack a majority of these
    different computers at the same time and change the same data at the same time
    to the same results. The probability of such a large-scale hack taking place is
    very small and depends of course on the number of connected computers. This is
    what makes the Blockchain so reliable.


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_53_0.png)


    Source: Veuger 2020b.


    Figure 3. Network models according to Baran (1964).


    # **Characteristics**


    Because the Blockchain is a database distributed across different servers, this
    technology is also seen as a form of distributed ledger technology. When a distributed
    network is used, this leads to the following interesting consequences:'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   1. There is no single point of failure.

    +   2. New data must be confirmed by other nodes (see box).

    +   3. A form of consensus is required.

    +   4. A Blockchain is difficult to hack.

    +   5. Censoring or changing the data on the Blockchain is difficult.

    +   6. It is a peer-to-peer network that does not require trust in a central party.


    These consequences can be regarded as emergent characteristics of the Blockchain.


    From the perspective that Blockchain is considered a database that records information,
    Blockchain has the following characteristics:


    +   - data are arranged in data blocks

    +   - incremental

    +   - reliable because the data are cryptographically verifiable

    +   - digital


    Companies, governments and individuals can use a Blockchain among themselves or
    with each other together form a Blockchain network. A Blockchain has four characteristics:


    +   1. Data - with the exception of private data - are public and accessible to
    everyone.

    +   2. Information is stored on a decentralised basis.

    +   3. All data are stored in combination with corresponding times.

    +   4. The code is open source, which means that everyone can view it.


    # Nodes


    Transactions on the blockchain take place peer-to-peer without an intermediary,
    also called trusted third party, which has interesting consequences for users.
    A peer-to-peer network is a network of computers, also called nodes, which are
    equivalent to each other and can provide services to each other. A node is a device
    that is connected to and participates in the blockchain network. This can be a
    computer, telephone, television or even a printer as long as it is connected to
    the network via the internet. They can have a variety of tasks, such as distributing
    data across the network, validating and confirming transactions and helping to
    secure the network.


    The ''full nodes'' download each block of the blockchain and also verify transactions.
    Their main task is to ensure consensus on the blockchain and to ensure that it
    remains secure. Full nodes also send blocks and transactions to the network for
    others to download. They also make decisions about the future of the network.
    They do this by voting on improvement proposals for the network such as the Bitcoin
    Improvement Proposals (BIPs) (Lim and Janse 2020).'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'In summary, blockchain technology has the potential to:


    +   • facilitate registration and validation

    +   • eliminate copies

    +   • save on costs

    +   • authenticate transactions

    +   • record data permanently

    +   • make transactions possible without an intermediary

    +   • realize self-executing contracts

    +   • shorten transaction times

    +   • make more automation possible


    With this in mind, we will look at care and what complex problems are involved
    here.


    # Increasing Complexity in Healthcare


    Although the basic principle is that the (vulnerable) elderly citizen can continue
    to live in his own living environment for as long as possible, care in the Netherlands
    is designed in such a way that it is sometimes difficult to find the right (and
    financially viable) care. We mention four reasons that healthcare in the Netherlands
    is so complex.


    # Methods of Financing


    Healthcare is divided into three funding regimes: the Social Support Act (Wmo),
    the Healthcare Insurance Act (Zvw) and the Long-Term Care Act (Wlz). The Zvw requires
    an indication from a district nurse, the Wmo usually runs via a kitchen table
    conversation, and the Wlz requires an indication from the Central Indication Body
    for Care (CIZ). For requesting a personal budget, access is often even more difficult.


    # Fragmented First Line


    What further increases the complexity is that primary care is traditionally organized
    and financed in a fragmented fashion. All this applies while care needs to be
    increasingly integrated and personalised. As far as ICT is concerned, much more
    is possible than is currently customary in healthcare, and here too, there is
    enormous fragmentation that reinforces complexity. ICT has been set up per subsector.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Everyone Has Their Own Policy


    The complexity of care is great, as well as the coordination with the social domain
    in terms of funding and organisation. The coordination mechanisms make the complexity
    structural. Within the Zvw, a limited number of health insurers conclude health
    contracts with a large number of integrated, small-scale organisations and professionals
    in elderly care and the social domain. Often, these organisations are also regionally
    or locally oriented. In addition, there are 355 municipalities that have their
    own policy in the area of the social domain. Clients and patients have the option
    of choosing, but they often do not have the information required to make a considered
    choice. These different ordering systems lead to suboptimization in the relationship
    between client and healthcare professional. Clients thus have a navigation problem.


    # New Transactions


    Interaction takes place between healthcare professionals and clients. This interaction
    takes place in the form of a transaction: there is a (care) agreement, there is
    a consideration (payment via Wmo, Zvw or Wlz), and a delivery (care deployment)
    takes place. The arrival of digital platforms such as Platformvmz.nl and Curaevitelbalie.nl
    creates new interactions and transactions between professionals and clients.


    Blockchain enables a new model for the exchange of care information. This reduces
    the current fragmentation in the various care systems and enables a better view
    of the results of care interventions.


    # Blockchain as a Solution for Verified Data


    The Blockchain can respond to the challenges currently confronting healthcare.
    These challenges include medical data (security, interoperability, accessibility),
    medical research, clinical trials, the medical supply chain and the quality of
    the medicines. Blockchain in healthcare is mainly about data from and about people.


    Standardising information strengthens communication between professionals and
    between clients and professionals. The client determines which information is
    available to which healthcare professional. A different design for making data
    accessible and information provision based on that can reduce complexity. Digitisation
    of care leads to clients and patients managing their own information in a Personal
    Health Environment (PHE).


    In this book, we want to show that it is necessary to make shifts in the way we
    think and how we manage. This concerns the formation of decentralised structures
    where the interaction between client and healthcare professional is central. That
    means exploring network control and self-control (Topol 2015) with Blockchain.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# **Benefits and Opportunities**


    What are the benefits and opportunities of Blockchain in healthcare? Healthcare
    professionals can be active in multiple networks such as the patient file, interest
    organisation and the like. A network determines and justifies its own area of
    responsibility. The starting point for improvement of data management is the complexity
    and reality of the specific needs and questions of the target group within this
    area of responsibility.


    Complexity requires innovative solutions. This in turn follows from data, information
    and knowledge that lead to common understanding and joint action (Wallin 2018).
    Digitalisation increasingly enables virtual integration of business processes
    between organisations.


    The advantages of working with Blockchain are an effective organisation of care
    information that is easily interchangeable, data security and user control of
    the care data. Blockchain enables a fundamental recalibration of the position
    of clients: complete control of your own data. In this way, Blockchain shifts
    the control that institutions exercise to control exercised by the individual
    himself (Huizinga 2018). Standardising information strengthens communication between
    professionals and between clients and professionals. The client determines which
    information is available to which healthcare professional. Digitisation therefore
    leads to clients and patients managing their own information in a Personal Health
    Environment (PHE) or Electronic Health Record (EHR).


    Blockchain also offers new opportunities to shape collaboration between healthcare
    organisations and healthcare professionals. Real-time available information can
    thus be made safely accessible. Because no intermediaries are required, cost savings
    can be realized. Blockchain provides a decentralised healthcare structure and
    thus strengthens the position of professionals and clients. Blockchain technology
    also allows citizens and professionals to exchange and share data directly, resulting
    in benefits such as greater transparency in the care process of patients and professionals.


    # *App*


    The use of Blockchain technology is often supported by a user-friendly application,
    such as a website, database or app. Such an application layer facilitates use.
    A user can thus see in an app where he can enter data, which then becomes visible
    to others who have reading rights. The Mijn Zorg Log app from Zorginstituut Nederland
    works like this. This app is illustrated in Figure 4.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/7aac89a23a631ee44add9e5eff18dfe7_58_0.png)


    Source: Blockchain: Mijn Zorg Log - iStandaarden.nl.


    Figure 4. Mijn Zorg Log.


    Other sources of information can also be connected to the application and made
    visible to the users. The Blockchain itself can be linked to information from
    external sources. In principle, Blockchain enables the following developments:


    +   • an effective health information management system that is interoperable

    +   • data security

    +   • control by users over care data (Lim 2020).


    However, Blockchain applications are not yet being developed on a large scale
    in the Dutch healthcare sector. Important reasons for this limited development
    are that several parties in the chain must simultaneously agree on the added value
    that can be achieved, on how risks can be mitigated and on how a specific Blockchain
    is created. This requires knowledge, mutual trust and a shared sense of urgency.
    Like other digital transformations, the introduction of Blockchain applications
    is also hampered by outdated IT systems used by healthcare parties and suppliers.
    The expectation is that this will change in the long term (Veuger 2020a and b),
    and we would like to contribute to this with this book.


    # Three Forms of Access


    A common way to make it clear who is allowed to join is to see if everyone is
    allowed to join in principle. Or are there conditions that you must meet imposed
    by the network? Either permissionless or permissioned entry. A healthcare blockchain
    infrastructure can take three forms: a public, private or hybrid system. The aim
    is to'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'clarify which roles are needed to manage the network, as well as what role
    the entrants (‘participants’) can receive. We briefly explain the three forms
