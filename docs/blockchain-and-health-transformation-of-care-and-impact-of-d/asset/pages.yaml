- pgno: 65
  md: '# ## Conditions for the Application


    With blockchain, trust lies in the system itself and not so much between parties
    (Lim and Janse 2020: 488). Data standards can play an important role in this.
    With blockchain technology, a more sustainable, safer and reliable digital infrastructure
    (Veuger 2018b and 2019d) can be built. That makes this technology potentially
    revolutionary.


    Because blockchain technology is also very complex and still developing, it can
    only be realized if open cooperation takes place. On the one hand, because bundling
    knowledge is necessary due to the complexity. On the other hand, because the decentralized
    nature of blockchain requires new, decentralized forms of governance (Veuger 2020b:
    8).


    # ## Criteria


    Blockchain is useful if the following criteria are met (Lim and Janse 2020: 490):


    +   - Digital innovation is part of the strategy.

    +   - Different parties share data.

    +   - These data relate to monetary value.

    +   - The data are confidential.

    +   - Several parties process data.

    +   - Data must be verified.

    +   - A clear return on investment can be calculated.

    +   - Verification is complex and costly.

    +   - The solution of choosing blockchain is the simplest to solve the problem.

    +   - The solution affects the organisational form.

    +   - The solution affects the existing work processes.

    +   - The solution affects the existing ecosystem.

    +   - The technical solution is close to existing systems.

    +   - The solution is data-intensive but scalable.


    # ## Future


    Blockchain is a disruptive technology that gives industries and sectors a wake-up
    call through a totally new and secure method of data file management: the 21st
    century operating system. Blockchain cannot solve all social, economic, cultural
    and technological problems. It does have the potential to greatly improve trust
    issues in our society and in particular the economy. Uncertainties can be removed
    by blockchain in the (financial) world through new forms of chain cooperation(s)
    (Veuger 2020b: 18).


    It is important to note that blockchain technology is complex and still at a development
    stage for healthcare. Blockchain applications are not yet being developed on'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'a large scale in the Dutch healthcare sector. Despite the potential benefits,
    large-scale applications, for example, have not yet been developed in care chains.


    The research firm Gartner predicts that blockchain will converge with other complementary
    technologies such as the Internet of Things and artificial intelligence in 2025.
    As a result of these developments, there is increasing interest in decentralised
    solutions (Lim and Janse 2020: 520). Blockchain offers a lot of potential advantages,
    ''potential'' because application possibilities have not yet been used in a combined
    way on a large scale and have not been proven until then. One reason for this
