    +   - Google has made it possible with its artificial intelligence department
    ''DeepMind'' for hospitals in England to put health records on the Blockchain.

    +   - Guardtime has already successfully implemented the same solution for the
    governments of Estonia and the United Arab Emirates.

    +   - Coralhealth uses Blockchain to make personalised medicines possible.

    +   - EncryptGen has launched a platform that allows people to sell their DNA
    in exchange for cryptocurrency.

    +   - Lancor has developed a tool to bring the reliability of cancer screenings
    from sixty percent (by people) to ninety percent, through a combination of artificial
    intelligence and Blockchain.


    Blockchain ensures a secure transfer of data between different parties, who can
    use them for personalised medicines, for example.'
  merge: -1
