- pgno: 44
  md: '# *Chapter 2*


    # BLOCKCHAIN IN HEALTH CARE


    **Jan Veuger**, PhD and **Harry Woldendorp**


    1 Saxon University of Applied Sciences,

    School of Finance and Accounting, School of Creative Technology, School of

    Governance, Law and Urban Development,

    Hospitality Business School,

    School of Commerce and Entrepreneurship,

    School of People and Society, The Netherlands


    2 PlatformVmz and Curaevitel Balie, Expert Partner

    Research Group Blockchain Saxion UAS, The Netherlands


    # ABSTRACT


    In this chapter, we have demonstrated how Blockchain can contribute to addressing

    the major healthcare issues. These include recording medical data (security,

    interoperability, accessibility), recording the results of medical research, setting
    up care

    chains and ensuring the quality of the medicines. In current healthcare practice,
    avoidable

    errors are still made as a result of the lack of information. In addition, time
    is wasted on

