    # ## Public System


    Anyone can join a public system; there is permissionless entry. Everyone has the
    right to use and view the ledger. Everyone is free to assume any role they want
    within the system, even that of validating transactions. This system, where everyone
    is treated equally, is mainly used if a group of ‘like-minded people’ want to
    work together, such as Bitcoin or the internet. The like-minded can join the decentralised
    network themselves. The user group determines the content or operation of the
    blockchain in line with group motives such as openness, neutrality and freedom
    in line with decentralised cooperation.


    If it is decided that everyone is allowed to join, the option can be offered to
    give everyone anonymity, of course within the blockchain rules. Trust about the
    shared ‘truth’ is very high, because it is enforced by the blockchain rules, not
    by knowing who the entrants are. The users determine the function of the blockchain.


    This public model is not always desirable for organisations in a more regulated
    environment such as healthcare. After all, care is a highly regulated system.


    # ## Private System


    If it is decided that only a limited group may join, a _private system_ is created.
    The blockchain rules do not impose enough trust, which means that the activities
    of the entrants must be controlled. This is done by drawing up rules that an entrant
    must comply with, by a kind of separation of responsibilities, by checking transactions
    and possibly reversing them: permissioned entry.


    A private system is often an organisation where a central body has control options
    with regard to, for example, the establishment of an intranet facility. For example,
    a director or management team starts a blockchain system and invites participants
    to participate within a certain role. A comparison in a private system is an intranet
    in which the nodes, data and the program code are checked.


    A private system empowers the organization, where a public system empowers the
    individual (Lim and Janse 2020). The three most relevant roles within a management
    control system are initiating, verifying and viewing a transaction. Other questions
    you want to ask yourself here are:


    +   - Who owns the data?

    +   - Who ensures that data are not tampered with?

    +   - Who is allowed to change or delete data?

    +   - Who creates and maintains the software? (Consensys 2018)'
