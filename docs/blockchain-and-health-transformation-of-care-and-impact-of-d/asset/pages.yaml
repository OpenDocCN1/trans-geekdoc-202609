    # TWO CHARACTERISTICS OF BLOCKCHAIN


    A blockchain, a chain of blocks, is a system that can be used to record data.
    Each block contains coded data and can be included in the chain if these data
    refer to the previous data and thus form a chain. The most unique thing about
    the blockchain is that no trusted third party is needed to store, monitor or control
    the data. The function of, for example, a notary will therefore be abolished.


    In this chapter, we delve deeper into the characteristics of blockchain and how
    they form a trilemma. We discuss solutions for this blockchain trilemma and show
    how different infrastructures use the features. We will also focus on the transfer
    of information, smart contracts and cybersecurity. Blockchain has four basic principles
    that distinguish blockchain from other automation technologies. We will repeat
    them briefly and explain them further.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   • Basic principle 1 Growing chain. A blockchain offers a new method of
    data storage by a chain of data blocks that builds up over time and cannot be
    unilaterally changed.

    +   • Basic principle 2 Distributed network. The chain is distributed to all participating
    parties and is a shared truth. The growing chain (basic principle 1) can always
    be stored and used by one party. Blockchains are extra reliable because the entire
    chain can be shared and distributed to other parties.

    +   • Basic principle 3 Consensus. Parties involved must agree on the data stored
    in the last block (consensus). When working in a distributed network (basic principle
    2), the biggest challenge is reaching agreement on the content of the last data
    block. No consensus is possible if the parties do not agree on the data in the
    last block.

    +   • Basic principle 4 Data storage. The programming code with cryptography can
    be stored and executed in Blockchains. The data in a Blockchain can contain logic,
    procedures and a programming code. These data are securely synchronised between
    all parties and can be executed decentrally (VNG 2019).


    The distribution and decentralisation level of the blockchain plays a major role
    in scalability. When introducing blockchain, the blockchain trilemma plays a role:
    scalability, security and decentralisation. A highly decentralised blockchain
    is better secured, but at the expense of scalability. If it is scalable and centralized,
    it is then less secure.


    # The Blockchain Trilemma


    Blockchain was first developed in 2008 for Bitcoin. Interest in blockchain technology
    has increased since the idea of blockchain was introduced in a 2008 white paper
    by Satoshi Nakamoto. He argues for an electronic payment system in which unknown
    parties can realize transactions directly and without the intervention of a third
    party such as a bank. The payment method of this system is the Bitcoin. Nakamoto
    improved his system on a number of points, such as the prevention of double spending
    and the introduction of a timestamp. He thereby created a system in which trust
    - the keyword for blockchain - is embedded in the blockchain technology. Nakamoto
    thus ensured that a trusted third party (TTP), o which he objected in principle,
    was no longer necessary. This created the certainty that the recipient could be
    sure that the previous owner had not executed a previous transaction and that
    the first (money) transaction is the only valid one. The main reasons for the
    interest in blockchain are security, anonymity and data integrity without an external
    organization controlling the transactions.'
  merge: -1
  img_proc: true
