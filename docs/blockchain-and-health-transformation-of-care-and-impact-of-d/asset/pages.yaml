    plan has been drawn up to strengthen working on well-being, using the Groningen
    Well-being Indicator (GWI). Well-being is measured with the Groningen Well- being
    Indicator consisting of 8 areas: enjoying eating and drinking; good sleep and
    rest; pleasant relationships and contacts; being active; caring for yourself;
