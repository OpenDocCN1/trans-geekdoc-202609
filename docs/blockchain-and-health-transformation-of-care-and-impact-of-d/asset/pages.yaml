- pgno: 225
  md: '# Narrative Perspective: De Hoven WVT Institution


    De Hoven is a VVT institution in North Groningen, and its mission is that elderly
    people in North Groningen should be able to continue living in their own way,
    even if they become very vulnerable, need home care, rehabilitation or live protected
    at De Hoven. Well-being is central because they can continue to follow their own
    habits. De Hoven has approximately 920 employees and around 500 volunteers. The
    policy is based on the principle that professional conduct is always interpreted
    from the perspective of whether it is important for residents. This perspective
    has been developed in collaboration with professor Slaets (Leyden Academy on Vitality
    and Aging). Central to this is what older people themselves find important. In
    addition, it is about meaningful life: being able to live one’s own life despite
    increasing vulnerability. Finally, it is about connection between generations.


    Since 2017, De Hoven has been working with the Leyden Academy on the development
    of a life enjoyment plan. Working with a life enjoyment plan makes a narrative
    perspective possible. Within De Hoven, a mix of perspectives is used: every client
    situation must be re-examined. In addition, systems can be a hindrance to self-thinking
    capacity. The Health and Youth Inspectorate (IGJ) still works too much from a
    closed system. (You can break through that by involving relatives).


    The awareness of the situation is important. By understanding your own paradigms,
    you are more open to other approaches. That is why there is a personal leadership
    program aimed at looking through the eyes of the other. The narrative perspective
    is methodical. This methodology shifts the focus from doing to ‘being there’.
    The story is fragmented: these fragments are (statistically) converted into values
    that are expressed in feelings. In any case, it leads to increasing variety. Accounting
    for one’s own behaviour has two dimensions: via guidelines and testing by IGJ
    (externally). By conviction (internally). It is about value-driven organizing
    and acting.


    The narrative perspective is therefore part of the care. In addition, there are
    still guidelines (for example washing hands). The core is a better-living client
    and not a better-living professional. With personal directorship, it is about
    conducting a dialogue in which trust and equality are central. Bravery is needed
    to change the system. This applies to all levels: including the Supervisory Board
    (which must be composed on shared values) (Interview with manager at De Hoven).
    Within De Hoven, the personalized approach is used:


    +   - Clients are involved in all decisions concerning healthcare.

    +   - There is the possibility of valuing risks: some decisions made by clients
    can entail a certain risk.

    +   - Professionals are autonomous in taking decisions.'
