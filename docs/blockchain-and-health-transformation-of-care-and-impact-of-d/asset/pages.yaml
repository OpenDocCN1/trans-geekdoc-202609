  md: 'of ehealth than is currently present in practice: that practice is characterized
    by a multitude of tools and applications. However, ehealth is a way of thinking,
    an attitude to improve care with the help of information and communication technology
    (Van Gemert-Pijnen 2015). It is about integrating technology into the work process.
    The technology must be better anchored in health interventions. This involves
    having a good view of the actual functioning of technology and having knowledge
    of influencing behaviour (acceptance and adoption of ehealth).


    The Council for Public Health and Care defines ehealth as: ‘the use of new information
    and communication technologies, and in particular internet technologies, to support
    or improve health and healthcare’ (RVZ 2015). Ehealth concerns websites and applications
    to support clients. Because they can expect some or all of the contact with healthcare
    professionals, it is expected that cost savings will be possible (Rademakers 2016).


    # Conditions to be met are:


    +   - Attention to the competence development of professionals and citizens

    +   - Revision of guidelines

    +   - Data standardization

    +   - Acceleration of transparency of outcomes

    +   - Investments in technology that can take over care and support

    +   - Higher first-line organization degree

    +   - More control and attention to upscaling

    +   - Pooling of Zvw, Wmo and Wlz

    +   - Right incentives

    +   - Multi-year agenda


    Meeting these preconditions leads to clients who are empowered to take on a greater
    role and cooperation between professionals based on trust and a cross-domain vision
    of health.


    The use of various aspects of ehealth such as online viewing, video calling, apps,
    telemonitoring and other IT applications requires that these applications are
    well anchored in the (integrated) care processes (Nictiz and Nivel 2019; RIVM
    2018; Vilans 2018). It is striking that the supply is greater than the use. Although
    professionals are predominantly positive, the applications are still insufficiently
    embedded in healthcare practice. What is needed are preconditions that make ehealth
    applications work optimally. Healthcare processes are being redesigned based on
    the added value of ehealth applications.'
