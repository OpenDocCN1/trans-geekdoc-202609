    interact with and care for patients in a way that adheres to core nursing values,
    which is also the case when eHealth is used’ (Swedish Society of Nurses 2012,
    11).


    Ehealth refers to healthcare that is delivered via technology with or without
    the intervention of healthcare professionals. Citizens’ self-reliance requires
    a different vision'
