    coordinate with each other.

    +   • Teams are integrally responsible: result, operation and HR.

    +   • No covenants at administrative level; local collaboration relationship has
    primacy.

    +   • Each team has a procurement budget, the use of which it can determine for
    itself.


    The accountability for the content of the work goes through team compass. The
    most important indicator is client satisfaction. The registration of care provided
    supports practice. A regional coach looks at what the team could do, but ultimately
    the decisions are made by the neighbourhood team. Management control is in fact
    carried out by personnel control: the recruitment of higher educated people (Groen
    2016). Healthcare is aimed at empowering the client to become more independent
    as quickly as possible.


    The method is divided on the basis of a number of building blocks (Transitieprogramma
    2009). The start is the needs indication (indication based on what needs are living
    and the way in which they can provide supportive, supplementary or replacement
    care and welfare services). The informal client network plays an active role in
    this: ‘first neighbourhoods then care’. There is a comprehensive formal network.
    High-quality and responsible care is provided.


    Key concepts in the provision of care are: equality, dialogue, reciprocity, adaptability
    and autonomy. This translates into adaptive help from experience-oriented care.
    Unburdening is achieved by working on care independence, self-reliance and client-friendliness
    within the system. To what extent is there consultation between the client and
    the professional?


    The management approach is based on the recursivity model described earlier: ‘higher
    organizational levels only intervene in the event of non-performance or if the
    integrity of the organization as a whole is at stake. This principle gives every
    lower level the freedom and responsibility to act in the spirit of the vision
    and goals of the organization’ (Van Dalen 2012, 260).


    The holistic approach makes it more complicated for healthcare professionals because
    they are dealing with more information; for the client, however, it is a simplification
    (Nandram 2015).


    Entrepreneurship plays a role in developing ideas and taking initiative. Buurtzorg
    is distinguished by a coherent vision based on (Nandram 2015, 135):


    +   • Focus on clients

    +   • Professionalism

    +   • Intrapreneurship'
