    +   - It is about the functioning of people, physically, psychologically and socially.
    It is about promoting proper functioning (prevention) and, in the event of illness,
    limiting the consequences thereof and, if possible, reversing such consequences
    (through support, guidance and treatment). This requires timely identification,
    health skills of clients, broad triage and adequate referral at the right time,
    more time for clients, consultative cooperation and good follow-up and specialized
    care in which the care needs of people and the possibilities to regain directorship
    over their own functioning are central (ownership).

    +   - Financing follows the client.

    +   - Collaboration within the medical domain and between the medical and social
    domain; reducing unwanted practice variation; utilizing technology; electronic
    exchange of client data/PBL; exchange of data; development of outcome indicators.

    +   - The district nurse, together with the general practitioner and the Wmo expert,
    forms the connection between the various domains together.


    Quality models have been developed for both care at home and care in an inpatient
    setting. For home care, this has been worked out on the basis of personalized
    care in a partnership between client, family and care professionals. For the intramural
    sector, it is mainly about guaranteeing the quality of life. The position of the
    client is strengthened in both models.


    Elderly care increasingly organizes itself as person-oriented care:


    The quality framework for nursing home care has ten principles: client as a person,
    emphasis on learning, supervision and accountability aimed at quality improvement,
    strengthening trust in professionals (Kessels 2012), learning together, reducing
    bureaucracy, safety for clients, extra attention to staff composition, quality
    principle (WLZ), more and better quality.


    In this quality framework, we see a shift to the client’s perspective. The intention
    of the new quality framework is to be part of daily care practice: interaction
    between clients, professionals and their organization. The perspective of the
    client and primary care is leading.'
