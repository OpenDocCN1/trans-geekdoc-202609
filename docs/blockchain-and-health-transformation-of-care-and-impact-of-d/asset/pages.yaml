  md: 'processor agreement has been concluded with the processors by all controllers.
    In the practical trial, the maternity care providers and the insurer were controllers.


    The insurer, Zorginstituut Nederland and Ledger Leopard played the role of processor.
    In the practical trial, a processor agreement was concluded between the three
    maternity care providers, health insurer VGZ and Zorginstituut Nederland. A sub-processor
    agreement was concluded with blockchain builder Ledger Leopard. Nodes were set
    up at VGZ, Zorginstituut Nederland and Ledger Leopard.


    In the practical trial, there was a ledger - the blockchain - located in a limited
    number of places (nodes). The choice was made for a limited number of participants
    in the practical trial, namely 33, which enabled good control. Because a permissioned
    blockchain was the starting point, it was possible to reach unambiguous agreements
    and to comply with the laws and regulations regarding privacy.


    # How It Works


    A maternity care provider provides home care, documents what she has done and
    sends this information to the office. The office takes over this in a system and
    forwards it to the paying agency. What is sent is therefore not also checked by
    the client (the mother), the source. The paying agent takes over the information
    in its own system and makes payment after 30 days or more. This takes a long time,
    is inefficient and expensive because the financial process follows the labour-intensive
    administrative process.


    By means of blockchain technology, the maternity care provider sends a structured
    notification of what she has done for the client with an app. The client can reject
    this notification, then there is a discussion at the source as to why a particular
    service has not been provided or has been experienced as such. If the client accepts
    the notification, both the administrative and the financial process will be completed
    within a few seconds for the different parties; this has already been checked
    by the client at the start, so no further questions or discussions should arise
    when the client actually has to pay. Here, the process is much shorter, more reliable,
    more efficient and cheaper, because the administrative and financial processes
    run in parallel. Figure 6 shows the functioning of Mijn Zorg Log. The choice for
    a permissioned blockchain for the practical trial was made because work had to
    be (and could be) done in a protected environment with a number of known parties
    involved in the care of the insured person (client/mother). In addition, the transaction
    speed of a public Blockchain was not (yet) suitable for the requested functionality
    in the practical trial.'
