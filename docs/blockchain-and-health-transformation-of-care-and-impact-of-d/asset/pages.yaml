    # PERSPECTIVES IN HEALTHCARE


    # Future-Proof Care


    A large number of national umbrella organizations issued a manifesto in March
    2021 on the organization of future-proof care for the elderly (Tien uitgangspunten
    voor toekomstige ouderenzorg; ‘Ten principles for future care for the elderly’).
    The bottlenecks include:


    +   - With unchanged policies: the number of elderly care jobs must grow from
    350,000 in 2016 to 700,000 in 2040

    +   - Increasing pressure on informal care

    +   - Growth in nursing homes: from 135,000 in 2019 to 261,000 in 2040


    In the short term:


    +   - Strengthening primary care

    +   - Complexity of regulation makes appropriate care difficult to arrange

    +   - Growing waiting lists

    +   - Lack of qualified personnel

    +   - Insufficient valuing of healthcare professionals


    The manifesto is a call to politicians to address 10 principles:


    +   - Focus on the needs of the elderly and space for informal care and local
    initiatives: establishment of networks covering all areas of life

    +   - Greater simplicity, coherence and cooperation

    +   - Eye for prevention in the elderly person’s own living environment: strengthening
    personal control

    +   - Direction of the government towards realizing reliable and structured exchange
    of client data

    +   - Sufficient diversity of forms of housing'
  merge: -1
  img_proc: true
- pgno: 224
  md: '+   - Sufficient employability of professionals

    +   - Opportunities in healthcare

    +   - Debate over quality

    +   - Extensive scaling up of innovations and digital care

    +   - Radical stripe through bureaucracy


    The essence is that elaboration of the principles leads to a transformation of
    elderly care. This involves shaping technological innovation, professional behaviour
    and connection with clients in a coherent manner. Within the VmZ platform, for
    example, we have set this up with our own Electronic Client File and a Client
    Portal for each client. In this way, professional action and personal control
    are connected. Our CuraeVitel Balie living concept (https://www. youtube.com/watch?v=_vtSJ6JEYC8)
    brings together technology, care, comfort and living.


    Smart Home technology ensures that the elderly can continue living at home longer.
    With this technology, it is also ensured that residents feel less lonely. They
    can continue living, for example, in their familiar surroundings. PlatformVmZ
    works with Loxone (www.loxone.com) within the CuraeVitel Balie client portal.


    By using smart home technology, the independence and autonomy of a resident are
    supported as long as possible. As a result, the quality of life for those living
    independently is promoted. Research has shown that the elderly experience the
    loss of their independene and privacy as extremely serious. In contrast to camera
    surveillance or active monitoring devices, the smart home technology monitors
    passively by checking habitual patterns via sensors.


    Falls usually occur during the activities of daily living. The goal of the Ambient
    Assisted Living, developed by Loxone, is to improve the quality of life for the
    elderly and to ensure that they can continue living independently at home for
    as long as possible with the help of technical solutions, even if they have a
    physical and/or mental handicap. The needs and wishes of the elderly and their
    caregivers are the starting point on which certain solutions such as fall detection
    are integrated.


    Thanks to the intelligent automation, passive monitoring can be realized, potential
    risks can be identified and managed, visual and/or acoustic messages can be given
    and lifestyle monitoring can be integrated. Above all, this all happens automatically,
    so that the elderly resident does not have to do anything.


    In this chapter is elaborated how the interaction between client and professional
    is shaped in five perspective. The interaction between client and healthcare professional
    takes place in a certain context. Depending on that context, one or a combination
    of the perspectives has added value.'
