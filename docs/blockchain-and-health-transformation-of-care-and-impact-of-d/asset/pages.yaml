- pgno: 100
  md: 'A care process can be described in part in terms of *transactions*: a moment
    of communication during which care information is exchanged. A combination of
    regulatory space, focus on the wishes of clients and quality of care and a digital
    working environment ensures that teams or care organisations are *in control*.
    By placing responsibility with professionals, organizational forms can arise around
    work processes and chains that transcend the boundaries of one’s own organization.
    Because information is available, professionals can independently realize:


    +   * distribution of common resources

    +   * accountability for own resources

    +   * mapping effectiveness and efficiency

    +   * development of operational plans


    # Information standards


    The digital transmission and sending of patient data is now more or less solved
    technologically. Nictiz is a Dutch knowledge organization that is committed to
    digital information exchange in healthcare. This organisation has developed *information
    standards* that, together with care providers, now apply to virtually all sectors
    of care. Examples include nursing transfer, acute care, obstetric care, the exchange
    of data from laboratories, medication safety and care for people with chronic
    diseases.


    The information standard describes why and how medical data are used in practice.
    Examples of this type of data include blood pressure, discharge date, diagnosis
    and weight but also civil status, gender and name. The information standard also
    describes the technical infrastructures and networks through which the data can
    be transmitted and the international standards and communication systems that
    can be used for this purpose. Because the healthcare field is complex to describe
    in a single information standard, information standards are always developed for
    specific and well-defined situations in which healthcare professionals exchange
    information, with each other and with their patients. The dataset is a crucial
    part of an information standard. The dataset describes which data are involved
    and also provides a description of technical details that are understandable to
    software programmers.


    A dataset consists of *healthcare information building blocks (zibs)* such as
    body weight, medication and alcohol consumption. These are indispensable building
    blocks for a secure, reliable and unambiguous exchange of medical data in all
    healthcare sectors. Figure 4.1 shows the relationship between the information
    standard, dataset and zib. In the Dutch context, it has been agreed that the collection
    of zibs is a national standard, which we call the *Basic Care Data Set* (Basisgevensset
    Zorg; BgZ). Nictiz plays a central and facilitating role in the development of
    information standards and care information building blocks (zibs) in the Netherlands.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/7aac89a23a631ee44add9e5eff18dfe7_101_0.png)


    Source: Nicitz.


    Figure 18. The dataset is a crucial part of an information standard.


    For example, the *real-time* availability of data via mobile applications enables
    24-hour monitoring of high-risk patients.


    Care teams can remotely monitor and leverage treatment options for early intervention.
    The care professional and the client have access to the same information and can
    reach joint decisions (Linn and Koo 2016).


    # Five-Layer Model


    Depending on what a blockchain implementation is used for, an information and
    data model will be required. In order to arrive at an effective network structure,
    it is important to record and share information unambiguously. This interoperability
    arises when healthcare parties can make agreements on the information architecture
    at five levels. Nicitz has developed the five-layer model for this, in which each
    level has its own parties, concepts and standards:


    +   1. Organizational policy concerns the organizational side of the collaboration.
    An example of a standard is referring a patient.

    +   2. The care process concerns the way in which healthcare processes work together,
    such as a guideline for the transfer of medication data in a network structure.

    +   3. Information is about recording data used for transmission moments in the
    network. An example is a terminology standard.

    +   4. Applications concern the information systems required to share process
    information. An example is a standardized domain data model.

    +   5. The IT infrastructure concerns the technical infrastructure within which
    the information systems of the network partners operate. This concerns the technical
    set-up that enables the exchange of information.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'For a good exchange of information, agreements must be made at all levels of
    the five-layer model. This is shown in Figure 19.


    Network structures are a specific form of inter-organizational cooperation to
    connect actions of organizations. The aim is a coherent approach to actions that
    the client needs or wishes (Van der Aa 2001: 16). To arrive at chain agreements,
    it is necessary to have (Van der Aa 2001: 123):


    +   - insight into and view of interdependencies

    +   - trust between the chain partners

    +   - a chain described in a process design

    +   - clarity about everyone''s contribution to the chain

    +   - registration of key figures

    +   - a quality system with regard to the chain

    +   - forms of chain management

    +   - chain automation


    A major problem is that organizations make insufficient agreements at the highest
    level, the organizational policy. Care organisations tend to focus quickly on
    the lower layers of the model: the IT infrastructure. There is a key element for
    care: trust must exist between organisations before data exchange can begin. The
    more remote the party with whom data is to be exchanged, the lower the trust.


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_102_0.png)


    Figure 19. Nicitiz''s five-layer model.


    For this purpose, the required standardisation is specified. The agreements are
    made by various parties:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   - Policy coordination is usually an administrative process.

    +   - Cooperation in the network takes place between the healthcare professionals
    and any supervisors.

    +   - Structure and content require coordination between care and ICT professionals.

    +   - Linking systems requires coordination between healthcare professionals and,
    for example, application administrators.

    +   - The infrastructure requires coordination between ICT professionals.


    Together, this is a complex agreement system. For good information exchange in
    healthcare, therefore, a number of facilities are always required. Together, they
    form the infrastructure on which information can be shared. This involves, for
    example, recording what is happening, ensuring secure communication such as encryption,
    authentication (verifying that someone is who they say they are) and being able
    to determine that the patient is giving permission for data exchange.


    # When and When Not to Use Blockchain


    Decisions that require a decision-maker to fill in *discretionary space* (a large
    degree of regulatory freedom) with regard to the outcome and the process carried
    out with blockchain are not suitable for automated decision-making. Blockchain
    is therefore not suitable for less structured issues in which the process and
    the results can be the subject of interventions that have not been devised beforehand.


    Blockchain can lend itself to (part of) the preparation of such decisions. Prescribing
    medications, for example, must remain the decision of the doctor and not be automatically
    decided by a blockchain. At the same time, the fact that the doctor prescribed
    the medicines and the pharmacist provided them (which is also not suitable for
    an automatic decision) can be used for an automated decision on the financing
    of care (Berenschot 2019).


    Any type of information can be stored in a blockchain. The network that implements
    the blockchain determines the type of information that takes place in the transaction.
    It is essential that the information is correct and the system is well designed.
    By using blockchain, information (anonymised) can be shared irrefutably and in
    *real time* with different parties. Blockchain can thus support healthcare processes,
    make them faster and make them less sensitive to human errors. The technology
    can help to make healthcare safer, better, more accessible and cheaper. However,
    if blockchain is not well structured, the technology leads to risks, but that
    applies to every technology. As indicated earlier, blockchain does not have a
    central party: parties must make agreements at all levels of the five-layer model
    for a good exchange of information.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Basic Principle 2 - Distributed Network


    The need of the patient is the starting point where different players in the network
    can add value to the patient at different times. Network medicine is care in which
    the patient is central and manages his health with the help of his relatives and
    healthcare professionals. The control is therefore increasingly placed with the
    client (Jeninga and Woldendorp 2019).


    A properly functioning underlying digital infrastructure is a condition for effective
    and efficient collaboration in networks while maintaining the quality of care.
    In the future, digital and physical networks will be created at local, regional
    and (inter-)national levels. This is not only about networks around the patient
    but also about networks between healthcare professionals both inside and outside
    the walls of the hospital. As a result, bulkheads will disappear and specialisms
    will flow together (Porter and Teisberg 2006). What is needed for network care
    is:


    +   - management of care (measurement, management and funding of care)

    +   - fully integrated chain care

    +   - notion of a system approach

    +   - financing

    +   - transparency with regard to costs and innovations


    Blockchain contributes to this by effectively and efficiently setting up a healthcare
    information management system. This provides a basis to arrive at value-driven
    care.


    # The Outcomes of Care


    Value-driven care is characterised by a focus on outcome indicators. The outcomes
    of care are broadly understood and seen in perspective with the costs of a treatment
    course. The outcomes of care are quality, costs and the appropriateness of care.


    Appropriateness is understood to mean the extent to which care for a patient is
    actually indicated. Indicators are required to be able to measure results. The
    care process thus becomes a chain of care delivery, in which all activities are
    included that offer value to the patient, from prevention and diagnostics to treatment
    and aftercare. The results of quality and efficiency measurements are the basis
    for improving care. These outcomes are data, and a blockchain platform can be
    helpful in making good use of those data.


    # Facilitating IT Platform


    In the thinking of Michael Porter (Porter and Teisberg 2006), an IT platform that
    facilitates the movement is of great importance. Despite much effort, there is
    still limited information exchange and limited availability of reliable outcome
    measures. In addition,'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'exchanging or being able to exchange outcome information in order to learn
    from it is still very limited. Interoperability is of great importance: use the
    same definitions and set IT and data standards.


    The design of an IT platform makes it possible to integrate (technological and
    digital) innovations intelligently into the delivery of care. An IT platform is
    needed to facilitate collaboration within integrated practice units and to enable
    comparison and reporting of results and costs. An IT platform has the following
    elements: it is designed around (the condition of) the patient, uses standardised
    terminology and data fields so that everyone speaks the same language and includes
    all different types of data so that all healthcare providers have the complete
    overview. It is therefore an IT platform:


    +   - that makes it possible to communicate digitally with other professionals

    +   - that makes it possible to exchange registered data, such as health records
    and care plans

    +   - that makes it possible for the patient to have access throughout the entire
    care process

    +   - that monitors performance to facilitate (integrated) care provision

    +   - that offers digital tools for patients to be active in self-management


    The healthcare organisations involved, whether or not collaborating in networks,
    need a data platform that supports primary and supporting processes in conjunction.
    Blockchain offers possibilities for exchanging data.


    # Basic Principle 3 - Consensus


    One of the unique features of Blockchain is the absence of a central controlling
    party. This leads to basic principle 3, consensus. A form of consensus is needed
    to implement updates and agree on what the proper state of the Blockchain is.
    In Chapter 2.3, we already saw that different infrastructures have their own form
    of consensus: Hyperledger Fabric, Ethereum and Corda. The more parties involved,
    the stronger the consensus.


    But Blockchain is not, of course, a neutral, impartial, non-political technology.
    Precisely because the use of Blockchain can mean that existing processes, data
    exchange and relationships can change, attention to control is important (Zorginstituut
    2018). If no consensus is reached within a group, separate Blockchains may arise
    with their own rules and currencies, as was the case, for example, in 2017 with
    Bitcoin, resulting in the creation of Bitcoin Cash (Edriouch 2018).


    Blockchain offers opportunities for healthcare, but there is a need for knowledge
    and insight into how to use Blockchain safely and responsibly. The challenge for
    the development of Blockchain lies in differences between knowledge levels and'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'interdependencies between (chain) parties. Since Blockchain is about cooperation
    in a chain, the parties involved must agree on conditions before a Blockchain
    platform or application can be developed (Berenschot 2019). By means of a smart
    contract, it can be determined which users on the platform have access to which
    personal data.


    The study by Berenschot (2019) shows that it is necessary to regulate governance
    at three levels:


    +   1. Regular governance for optimizing and controlling working Blockchain applications
    in practice.

    +   2. Development governance for the processes in which Blockchain applications
    are (further) developed.

    +   3. System governance for the general management and supervision of Blockchain
    development and application in healthcare at system level.


    The legal frameworks for governance on Blockchain depend on what the Blockchain
    application is used for. Blockchain requirements in healthcare can be divided
    into three groups:


    +   • generally applicable requirements

    +   • requirements for the use of personal data in the Blockchain

    +   • requirements for automated decision-making


    Blockchain is an automation technology that allows information to be shared and
    processes to be executed automatically without the intervention of a trusted third
    party.


    # Basic Principle 4 - Data Storage


    Central to data storage is the ability to determine the identity of data subjects
    and safeguard privacy.


    # Digital Identity


    With solutions based on self-sovereign identity, a citizen himself has a digital
    vault with information about his own identity. These data can then be used in
    situations where it is essential to confirm your own identity (care; buying a
    home). An infrastructure for the digital identity and a new agreement system will
    be built. This lays the foundation for the provision of services from government
    and business, in which people are central, instead of individual solutions devised
    by a single organisation. This still requires the necessary laws and regulations
    in the current context (Lizanova and Veuger 2019) and should be reviewed completely.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'In practice, for example, everyone should first have a complete digital identity.
    Events or achievements can always be added to this, such as a diploma and driving
    licence (Rathenau Institute 2018).


    Nevertheless, Blockchain already offers possibilities. For example, Blockchain
    can be used for:


    +   * the exchange of data (e.g., between healthcare provider and health insurer)

    +   * giving the patient access to his data

    +   * sending and paying expense claims

    +   * recording evidence of, for example, medical operations that have taken place


    Although these applications are of great added value to healthcare, there are
    also barriers to their implementation:


    +   * complexity of Blockchain

    +   * doubts about guaranteeing privacy (GDPR) when personal data are included
    in the Blockchain

    +   * increasing energy costs due to additional transactions in the chain

    +   * lack of uniform infrastructure and consensus on algorithms (smart contracts)

    +   * long processing time (seconds) of transactions


    In addition, failure to delete data reveals the limits of storage periods and
    storage capacity (Kennisgroep Keteninformatisering 2019). There are many Blockchain
    ideas and partly working initiatives in healthcare, but according to Nictiz (2017)
    they are not yet ready for large-scale use. The main objective is to experiment
    and become familiar with the capabilities and limitations of the technology. This
    means investing time and money in acquiring knowledge and experience.


    # Privacy


    A key issue within healthcare is safeguarding the privacy of clients. It is extremely
    important that medical data is not disclosed. Only with the permission of the
    patient may the care information be disclosed to another person.


    Current legislation does not allow medical data to simply be shared. One healthcare
    provider may therefore not provide data from the file to one of the other two
    healthcare providers. This professional secrecy of the healthcare provider expires
    if the patient has consented to this.


    As a result, every healthcare professional who would process personal data in
    a Blockchain must check whether they are authorized to do so. To avoid errors,
    it is therefore wise to work within a permissioned Blockchain in a private system
    (see Chapter'
  merge: -1
  img_proc: true
- pgno: 108
  md: '1). Read and write rights can be granted to specific users. This can be done
    in various ways:


    +   - In the smart contract, it can be regulated which users have access to which
    personal data.

    +   - In a smart contract, it can be arranged that the sender of a transaction
    per transaction can determine which users within the Blockchain can read the transaction.

    +   - The personal data for unauthorised users are hashed so that the impact of
    the processing is limited.

    +   - The unauthorised users can act as processors and thus view personal data
    (Zorginstituut 2019).


    In order to prevent data subjects from incorrectly viewing information, it is
    desirable to store personal data off-chain (outside the chain) and to include
    a link to the relevant information on-chain. In other words: the Blockchain is
    used as an access control ledger.


    A good example from practice is the Microbiome Centre, which facilitates a chain
    via Blockchain for analysing human excrement for the development of personalised
    medication (see also the case after Chapter 2). The Blockchain connects the physician,
    the laboratory, the pharmacy and the patient within a certain process, domestically
    and abroad (Zorginstituut 2019).


    # The Impact


    Blockchain can deliver value in the short term. Most Blockchain applications can
    have an effect on data recording and execution in the short term. For example
    by:


    +   - improving effectiveness

    +   - improving efficiency

    +   - innovating products and services

    +   - involving stakeholders

    +   - develop the organisation (VNG 2019)


    Blockchain can facilitate a reliable insight into a single shared data source
    for a chain or cluster. This means that the right people can have the right information
    at the right time. This facilitates, among other things, the faster and better
    handling of applications from citizens and thus the effectiveness. Reducing administrative
    effort and costs ensures that employees can be more involved in the primary process.
    Blockchain technology offers various opportunities to innovate applications. It
    offers additional transparency in a chain and can make ownership more flexible.
    Blockchain can engage clients and improve'
  merge: -1
