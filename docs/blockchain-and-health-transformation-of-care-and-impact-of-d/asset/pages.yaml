- pgno: 241
  md: '+   - Disappointed pivotal care network. Disappointment about the deployment
    of professionals.


    Working in networks makes it possible to scale up healthcare. This concerns: broad
    services, emphasis on area-specific care, investment in IT and increasing career
    opportunities. With networking, the aim is to make the patient a participant in
    the care. There is a considerable difference in the degree of control when someone
    is asked to respond to something that a healthcare professional has already written
    or when an open conversation is conducted first. As a rule, the care plan is not
    immediately accessible to most clients, which means they may have an information
    deficit. Attention to the client’s personal directorship and the provision of
    customized work by the healthcare professional has developed further in recent
    years and continues (130).


    Quality in healthcare is not only about issues of individual citizens, but also
    about systems. In addition, it is about the position of clients (Van Leeuwen 2007).
    More and more consumers are going to do product innovation. This involves improving,
    innovating and customizing existing products and developing new products and services.
    Marketing is no longer aimed at customers, but is produced by them (Downes 2014).
    Different connections between consumers and producers are emerging: consumers
    are increasingly doing more on their own. It is therefore desirable that organizations
    look fundamentally at their own work organization (Ten Have 2011).


    In the Vision Document Medical Specialist 2025, the ambition, expectations and
    goals for medical specialist care in 2025 are elaborated. I will discuss the possible
    consequences for elderly care. The provision of information within healthcare
    in 2025 is as follows: there is digital registration at the source (point of departure:
    more information and less registration). A distinction is made between three forms
    of information:


    +   - ‘hard’ quality criteria, such as morbidity and mortality, or measurements
    from national registrations

    +   - ‘soft’ quality criteria, such as patient responses, service measurements
    and individual or team assessments

    +   - efficiency information: costs per intervention or treatment process, request
    or prescribing behaviour


    (Elderly) care is directed towards the development of care networks of care professionals,
    both physically and digitally. A care network takes the needs of the client as
    a starting point; different players in the network can add value at different
    times (Van der Krogt 1995). In this way, a network of various professional expertise
    and informal contacts is created around a client, contributing to the care process
    and the quality of life.


    Digital developments play an important role in this. The medical specialist plays
    an active role in the development, assessment and implementation of technological'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'innovations that actually add value for the patient. That is why the patient
    is explicitly involved in the development, adoption and implementation of innovations.
    For the nurse and care professionals (Peters 2014), this means:


    +   - More severe clients, more multi-morbidity, more complex care situations
    (inpatient and outpatient)

    +   - Focus on your own health and behaviour, on participation, on what the client
    (with the help of social network) can still do

    +   - More focus on prevention (prevention of deterioration)

    +   - From caring for to ensuring that: self-reliance, self-management and self-management

    +   - Collaboration with informal caregivers

    +   - More ambulatory work (cross-sector teams)

    +   - More flexibility required, more autonomy

    +   - Working with care technology

    +   - Digital communication and digital recording of data

    +   - Broad deployment: different target groups, living/day care

    +   - Working in care paths, specialized, less generic

    +   - Increase in nursing duties, including taking over duties from doctors


    The role of the nurse is therefore more focused on directing the network. High-quality
    and efficient care requires location and time-independent exchange and availability
    of information: for both care professionals and the patient and his or her caregivers.
    Within healthcare provision, a professional or an organization is seldom seen
    in isolation. Although the client regards the relationship with a professional
    (caretaker, nurse, doctor etc.) as central, the professional depends on the input
    of others. Of course, the way in which clients experience the service is important.
    For professionals, it is about core values and working environment being interconnected.


    Between 2008 and 2011, there was a platform called Palliative Zorg (Poortvliet
    2011). The purpose of the platform was to realize the action points in the palliative
    care action plan, to monitor progress and to evaluate the action plan. The platform
    did not opt for a focus on the primary process (healthcare provider, professional,
    volunteer and patient) but for a policy focus.


    Poortvliet: ‘As a result, projects were somewhat more abstract and not directly
    applicable in practice. That is why the benefits are not immediately noticeable
    in practice but mainly concern an indirect effect’ (2011: 22). The bottleneck
    was identified as the fact that half of the platform members lacked a coherent
    and shared vision of palliative care (2011: 26). The platform had added value
    in the network function and for the agenda setting.'
