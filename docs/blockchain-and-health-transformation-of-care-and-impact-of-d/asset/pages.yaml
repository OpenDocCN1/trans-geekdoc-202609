  md: 'must be organized and managed in this way. The goal of integrated care is to
    achieve better (experienced) quality through customized care (Schrijvers 2017).
    Integrated solutions require a lot from internal and external cooperation.


    Personalized and integrated care seems to be a way to improve quality and to keep
    costs under control. Bloem (2012) has elaborated on personalized care: the care
    contributes to health gains in the person’s own perception. This is possible if
    the care is transparent: What is the effectiveness, quality and cost of care?
    What should happen around them? It is about facilitating the person’s own decisions:
    What do I want, and how do I achieve that? Integrated healthcare involves bringing
    prevention, care and well-being together to facilitate (the maintenance of) the
    client’s function (Baan 2015). This involves an effective set-up of self-management
    support, multidisciplinary collaboration, evidence-based care provision and clinical
    information systems.


    However, integrated care is difficult to realize for a client who has to deal
    with independent domains and separate financing. That is why it is necessary that
    collaboration be shaped from the different domains. As the case becomes clearer,
    customized arrangements will develop into generic arrangements within the three
    domains involved.


    # Participation


    In addition to having capabilities and possibilities, participation is also about
    the self-image of citizens and clients (Van de Wijdeven 2012). In today’s society,
    active citizenship is less organizationally embedded than in previous decades.
    The breakdown of factions has played an important role in this. Social involvement
    is often based on solving concrete problems in one’s own physical or social environment.
    Van de Wijdeven emphasizes that insight is needed into the ‘dynamics of doing’
    (2012: 315).


    According to Jager-Vreugdenhil (2012), it is desirable to map out the participation
    contexts in which people are active and what their motives are. This means that
    self-organization and government interventions are disconnected. The network society
    is responsible for a shift from government to society. The collaboration of people
    on specific issues will be central. It is then about supporting citizens with
    those solutions. The same applies to healthcare; see the aforementioned development
    of healthcare cooperatives.


    Van Montfort (2019): “Citizen initiatives” come in all shapes and forms. We thus
    have the care cooperatives, member associations of home care organizations, senior
    associations, pensioners’ associations. These are all initiatives that deal with
    issues such as “care, quality of life and living etc.” for their members or in
    their neighbourhood or municipality. They have all kinds of legal forms as well
    as different “fields of activity.” It is estimated that there are many hundreds
