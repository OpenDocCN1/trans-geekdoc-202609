  md: '# Research into Blockchain


    The characteristics of blockchain create interesting research areas, especially
    from the perspective of technical challenges and limitations. The study by Yli-Huumo
    Ko, Choi, Park and Smolander (2016) is a systematic study to collect all relevant
    research into Blockchain technology. The aim of the research was to understand
    the current research themes, challenges and future directions with regard to blockchain
    technology from 41 primary papers from scientific databases.


    The results show that the focus in more than eighty percent of the papers is on
    the Bitcoin system and less than twenty percent on other blockchain applications
    such as smart contracts and licences. The majority of the research focuses on
    revealing and improving limitations of blockchain from a privacy and security
    perspective. In many of the proposed solutions, a concrete evaluation of their
    effectiveness is lacking. Many other scalability-related challenges such as transit
    and response times have not yet been studied.


    # Trilemma


    Blockchain can have a huge impact on the value chain in our society. After all,
    it can play a role in efficiency, transparency, ownership, value (transfer), automation
    and services.


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_71_0.png)


    Figure 8. The Blockchain trilemma.


    When introducing Blockchain, the Blockchain trilemma always plays a role:


    +   * scalability

    +   * security

    +   * decentralization'
