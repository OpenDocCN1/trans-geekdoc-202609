    You often hear that ‘data’ is the ‘new money’ or the ‘new oil’ in the fourth industrial
    revolution we are now experiencing. This is changing the meaning of communication
    and also of economy and services. For years, we have been sharing information
    with each other via the internet, social media, etc. Often we use ‘free applications’;
