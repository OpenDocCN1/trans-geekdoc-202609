- pgno: 166
  md: '+   • Healthcare professionals are facilitated by the training of competencies
    (Buurman 2018, 9).


    Self-management determines the quality of life and is increasingly emphasized
    by the chronically ill and (vulnerable) elderly. Self-management is about ‘the
    capacity and skills of a person to experience a certain degree of balance and
    well-being even in old age despite age-related losses, with the aim of maintaining
    or achieving the best possible quality of life’ (Vilans 2007). The core of the
    interaction is that the client and the care professional find a way of working
    that best suits the client and his situation. In care (chronic and long-term care),
    the focus is on self-reliance, participation and being part of society. Value-driven
    care takes shape in care in the treatment plan in which it is determined together
    with the patient what his ambitions are for living, working and leisure time.
    Care, often expressed as increased self-reliance, is measured qualitatively afterwards
    by means of observations and questionnaires that are completed together with the
    patient.


    The results of cooperation within healthcare for clients are mostly aimed at quality
    of life in cohinion with objectives such as ‘self-reliance’ and ‘control’. The
    results of cooperation within healthcare for professionals are creating short
    lines between healthcare professionals and improved coordination of the execution
    of care provision for vulnerable elderly (Van Linschoten en te Velde 2016).Healthcare
    for vulnerable elderly is particularly personalized care. However, in most cases
    it is unclear how the alignment to the preferences, control and participation
    of the elderly/informal care provider is given shape (Van Linschoten en te Velde
    2016: 51).


    Society is changing: current communication options offer more openness and demand
    speed; it is expected that there will always be an immediate response; clients
    and their families are more assertive. This puts value-driven care at the centre.
    Support for people with disabilities must be value-driven as well as effective
    and efficient. Efficiency is the realization of a process with a minimum of wasted
    resources. Effectiveness concerns the use of the right resources to achieve the
    result that meets the client’s requirements (Hoebeke 1994).


    # **Integrated Care**


    The research of Saskia van Dijk (2017) focuses on how stimulating self-reliance
    within the nursing context influences value-driven care. Nurses indicate that
    self-reliance mainly leads to an improvement in the quality of life. In addition,
    if it is well integrated into the nursing process, it can lead to a reduction
    in costs, for example through fewer consultation moments. Within elderly care,
    value can be expressed as health outcomes and experiences divided by costs (or:
    Value = Health results (outcomes)/€).


    Mirella Minkman (2012; 2017) states that integration must be central: people must
    be viewed by the professional from an integrated perspective, and the care surrounding
    them'
