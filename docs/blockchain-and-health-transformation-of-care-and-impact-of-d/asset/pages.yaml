    # Change Strategy


    In order to arrive at an effective implementation, the Review Team (Gateway Review
    Report 2020) recommends a clear (adapted) change strategy, in which the relevant
    parties (multidisciplinary communities) are involved and have the same basic information.
    Standardisation is the guiding principle for both healthcare professionals and
    clients. The Ministry of Health, Welfare and Sport is the director in the realisation
    of electronic messaging. It is essential that linking to other systems is easy
    to achieve.


    The guiding principle in the design of a practical trial is to answer the following
    six questions:


    +   * Which process should the Blockchain support?

    +   * How big is the application of the Blockchain?

    +   * Who uses the Blockchain, what are the roles (rights and duties) of these
    different parties, and who is an administrator?

    +   * To what extent is this clear in advance?

    +   * To what extent do you set up permissions in advance?

    +   * Which practical applications are suitable for the various roles and authorisations?


    In Chapter 5, we discussed the experiences in maternity care. However, they are
    too limited to reach clear recommendations. These six questions form a framework
    for drawing up the change strategy.


    Digitalisation through blockchain technology contributes to a transparent, effective
    and efficient administrative process. In the practical trial, a separate identity
    service was used due to the lack of a national digital identity for public services.
    Such a service is indispensable for implementing blockchain in healthcare.


    Healthcare is a digital island empire. Blockchain can play an important role in
    a new relationship between the patient and his data, for example through greater
    transparency and control over data exchange. By using blockchain, information
    (anonymised) can be shared irrefutably and in real time with different parties.
    Blockchain can thus support healthcare processes, make them faster and make them
    less sensitive to human errors. The technology can help to make healthcare safer,
    better, more accessible and cheaper.


    The Zorginstituut has meanwhile drawn up an action plan to guide the deployment
