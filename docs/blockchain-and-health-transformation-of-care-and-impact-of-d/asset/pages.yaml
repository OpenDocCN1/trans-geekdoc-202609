  md: 'The CureaVitel Balie is also set up as a helpdesk to which all citizens in
    the Netherlands can address questions about the use of care or living or comfort
    services at home. The citizen is guided by the Personal Digital Assistant with
    these questions. In this way, access to health care (Zvw, Wmo, Wlz) becomes much
    easier for citizens.


    The IGJ (Inspection of Healthcare and Youth) has issued a new assessment framework
    for inpatient care. The wishes and desires of the client are the starting point
    for providing care. Characteristics of the relationship between professional and
    client are:


    +   - Professional knows the client (history; what is important etc.)

    +   - Relationship is balanced and respectful

    +   - Listening ear for client and his or her loved ones

    +   - Client is in control.


    At the end of 2016, this framework was established for networks of professionals
    who provide care to vulnerable clients who live at home. The most important starting
    points are:


    +   - Client perspective: contribution of care to his or her adaptability and
    personal directorship;

    +   - Networks: working in conjunction between professional care providers, informal
    caregivers and volunteers;

    +   - Vulnerable clients: testing specifically against citizens with the greatest
    risks;

    +   - Standards: from the client’s perspective;

    +   - Role of IGJ: quality of care.


    This assessment framework has the following themes:


    +   - Client-centred: need for care established in consultation with client; client
    has insight into care process; strengthening self-reliance and directorship;

    +   - Integrated care: the client experiences that professionals have mutual contact
    and that the care is coordinated;

    +   - Informal care: caregivers can count on professionals taking their capabilities
    into account;

    +   - Safety: risks in the area of the home/living situation, medication safety,
    domestic violence reporting code, medical aids and medical technology are signalled
    in time by the care provider.


    Through the platform, care providers (and clients) become involved with the aforementioned
    themes. For example, it is possible to identify early and monitor where'
