- pgno: 182
  md: '# **Vision of Care**


    The nurse specialist also works in first-and-a-half-line care. The treatment responsibility
    is increased. The balance between care provision and efficiency is not only about
    organizational models, but also about the way of thinking. The quality framework
    offers a mix of old thinking and new thinking. The question is whether we can
    no longer take steps towards a future-oriented approach with care technology and
    digitalization (Kanter 2001). It is again about the relationship between client
    wishes and professional behaviour.


    As it has become clear by now: the client’s question and thus the client’s influence
    on the performance of (service) tasks are central: Which services are offered
    (housing, care, treatment and welfare)? How are they delivered (time, treatment,
    quality level)? How do capacity and costs play a role (waiting time, flexibility)?
    And in which context are the services delivered (lifestyle-oriented living, kitchen
    <-> restaurant)?


    A central element for success is that care technology is part of the vision of
    care (Technologie in de verpleeghuiszorg 2019). We are currently seeing the coming
    together of various technological improvements: application possibilities for
    mobile phones, tablets and PCs. A large number of digital services are available
    on the internet. Sensoring makes it easier to track people, among other things.
    Social networks increasingly use digital solutions (Topol 2012).


    # **Information: Preconditions for Achieving Autonomy**


    # **Vulnerability**


    Vulnerable elderly people do not always receive the right care. There is a lack
    of coordination and cooperation between professionals. There is insufficient insight
    into each other’s competence. A great deal of consultation is needed on the financing
    of health care: within the demand for district nursing but also between the health
    care domain and the social domain. There is no regulation with regard to integrated
    cross-domain care for clients at home (Zorginstituut 2018). A new method of organizing
    care requires innovative funding modalities.


    Vulnerability: vulnerability among the elderly is a process of accumulating physical,
    psychological and/or social deficits in functioning that increases the chance
    of negative health outcomes (functional limitations, admission, death) (Social
    and Cultural Planning Office 2011). From the latter, the relation between client
    and professional, the funding model within which the interaction between client
    and professional takes place is essential. A start has already been made in Gezondheid
    2.0 (RVZ 2010). To arrive at the open model outlined above, a form of funding
    is required that does justice to basic care and makes a translation possible to
    the (individual) individuality of clients. That is filled in by this final chapter.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'What does the new quality framework mean for the IT structure of complex elderly
    care? The key question is relatively simple: How well is it going? Value addition
    is about: how staff are deployed, what they are asked to do, how they are organized,
    and how they actually spend their time. Within personalized care, as much money
    as possible goes to direct care activities. The question is always: how does this
    decision contribute to an increase in value for a client (in a bed or at home).


    # Assessment Framework


    An assessment framework has been issued for elderly care. This assessment framework
    has the following themes:


    +   • Client-centred: need for care established in consultation with client; client
    has insight into care process; strengthening self-reliance and directorship;

    +   • Integrated care: the client experiences that professionals have mutual contact
    and that the care is coordinated;

    +   • Informal care: caregivers can count on professionals taking their capabilities
    into account;

    +   • Safety: risks in the area of the home/living situation, medication safety,
    domestic violence reporting code, medical aids and medical technology are signalled
    in time by the care provider.


    The wishes and desires of the client are the starting point for providing care.
    Characteristics of the relationship between professional and client are: professional
    knows the client (history, what is important etc.), relationship is balanced and
    respectful, listening ear for the client and his or her loved ones, and the client
    fulfils the directing role.


    At the end of 2016, this framework was established for networks of professionals
    who provide care to vulnerable clients who live at home. The most important starting
    points are:


    +   • Client perspective: contribution of care to his or her adaptability and
    personal directorship

    +   • Networks: working in conjunction between professional care providers, informal
    caregivers and volunteers

    +   • Vulnerable clients: testing specifically against citizens with the greatest
    risks

    +   • Standards: from the client’s perspective

    +   • Role of IGZ: quality of care'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'In network medicine, patient care is central; together with informal caregivers
    and care professionals, he or she directs his or her own health (Metz 2016). The
    healthcare professionals and the caregivers guide the patient through clinical
    recovery and social recovery. In addition, a properly functioning digital structure
    is a condition for effective and efficient collaboration in networks. The patient
    can give informal caregivers access to their own healthcare file.


    The client manages his or her own medical and health data in an electronic client
    file. The focus is therefore on self-management for physical well-being, psychological
    well-being, participation in society, self-determination and self-direction and
    daily functioning. Wachter (2017): ‘One can envision a day when patient-centred
    communities and clinician-centred ones blend together, with patients gaining information
    and support from peers while periodically being counselled by credential experts’
    (2017: 200).


    # Stamtafel


    Digitization creates new forms of information. The division of roles between client
    and professional shifts because the client has more control (information). This
    has a twofold effect: the variety for the client decreases (since the client gets
    more control), while for the professional it increases (since the professional
    deals with individual questions). The impact of COVID-19 is accelerating developments
    already underway. The question is how this can be done effectively. A first elaboration
    can be seen in the field of video calling: between professionals, between professionals
    and clients (and their family) and between clients and their family. New forms
    of contact arise (e.g., De Stamtafel: www.stamtafel.nl). The Stamtafel (regular
    table) is an online social (care) platform to connect people with family, friends,
    member associations, villages, community centres, nursing homes and volunteer
    organizations. They support in personal and everyday contact. The Stamtafel is
    easily accessible to use and at the same time offers a safe and high-privacy environment.


    The digital, social Stamtafel has been set up for this vulnerable group. Via the
    App, people can share information and assistance requests with family, friends
    and caregivers. It helps initiate social contacts and increases involvement with
    the neighbourhood. The advantage is that they maintain control over what is shared.
    It is also sometimes easier to ask for help digitally. In this way, the digital
    Stamtafel aims to combat loneliness, support independence, increase the scope
    of interaction and ensure the feeling of self-direction with regard to care, contact
    and safety.


    # Interdependence


    Due to the increasing connectivity and accessibility of information, there is
    an ever-growing group of informed and empowered patients (and caregivers) (Njoku
    2015). For example, the Patiëntenfederatie Nederland has developed an instrument
    for elderly to indicate what they value themselves at Mijnkwaliteitvanleven.nl.
    Joint decision-making'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'takes place at various stages of the care process. Together with the care professional,
    the patient directs a personal health record with the care professional.


    Although there are an increasing number of digital solutions, these are only effective
    if they fit the needs and skills of a caregiver. Home automation concepts make
    it possible to remotely monitor daily activities of a client and to easily intervene
    in them. It is important here that the available functionality is at the service
    of the informal caregiver and that proper guidance on the technological possibilities
    and a good backup system are ensured (Adler 2014).


    This results in increasing interdependence: it is therefore important to invest
    in your own (digital and social) networks (Zorg voor 2020). Increasingly, the
    client will decide for himself or herself how and when he or she makes contact
    with care providers. In addition, the distinction between patient and consumer
    is narrowing: there is also an increasing ability for healthy people to collect
    information about their own health. It is always a question of the extent to which
    support is actually provided in a customized way to the needs and wishes of an
    individual informal caregiver. On the one hand, support must take place throughout
    the entire network of informal and formal care support, and, on the other, it
    is about enabling an individually focused approach.


    # Informed Clients


    This concerns access to information but also the way in which the information
    is delivered. The information ensures that there is clarity regarding the informal
    caregiver’s own role, the role of the professional, the organization of care,
    the evaluation and improvement of care and the way in which adjustments can be
    made. The collaboration between informal caregivers and care professionals is
    about having insight into everyone’s position, expectations, emotions and capabilities.
    The involvement, input and (co-) management from the network are central to this.
    Healthcare uses an available digital infrastructure. On the one hand, self-reliance
    also means that professionals are engaged in a timely manner. On the other hand,
    the route to a more self-reliant society also means that professionals can help
    with taking that step. Current professional support is used differently (Peeters
    and Cloïn 2012).


    Due to the increasing connectivity and accessibility of information, there is
    an ever-growing group of informed and empowered patients (and caregivers) (Njoku
    2015). Joint decision-making takes place at various stages of the care process.
    Together with the care professional, the patient directs a personal health record
    with the care professional. In network medicine, patient care is central; together
    with informal caregivers and care professionals, he or she directs his or her
    own health. Consistent and clear communication are key. It seems simple, but it
    is complicated. How do you handle the (permanent) changes in legislation and regulations
    and the changes in the environment? How do you handle (changing) views of professionals?'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# # Adapting the Environment


    Elderly care is characterized by the fact that views, applications of (information)
    technology and positions of professional expertise change and innovate simultaneously.
    The new generation of the elderly will increasingly take the lead in this innovation.
    In the home setting, there are more and more developments in the field of home
    automation and sensor technology. The effects of robotization in healthcare will
    still be limited (Ford 2015). Organizing is supported by the new core values in
    health care: contributing to the quality of life and enabling self-direction.


    Technology can be used to adapt the environment to the needs of citizens. Living
    independently for longer is based on the human dimension and creating a balance
    through embedding in the social, technological and spatial context (Mohammadi
    2017). As a result, care provision in the home situation becomes part of an ecosystem.
    Research by KPMG (2017a) shows that robots are particularly capable of supporting
    the elderly in household tasks, helping them to undertake their own activities,
    contributing to social interaction and playing an important role in collecting,
    analysing and distributing medical data.


    In the area of internal mobility, KPMG (2017a) expects that the following functions
    can be performed by robots: assistance with going to the toilet, helping with
    administering medicines and performing light household tasks. A description of
    robots shows that a contribution can be made to the cost-effectiveness of care:
    a machine that can perform multiple tasks, increasingly smarter and cheaper (De
    Vlugt 2016).


    Although healthcare technology is often based on standards, it is desirable to
    take into account clients’ skills and needs, degree of willingness and independence
    and physical environment, as well as the presence of social networks in relation
    to the individual health situation. In addition, effort is also a matter of good
    timing and sustainable support.


    Research by Peek (2017) shows that the role of grandchildren with, for example,
    ‘take a picture for me’ is helpful. A majority of the (future) elderly (71%) say
    they would like to use ICT if this means that they can continue to live at home
    longer (Van den Broek et al. 2016, 123).


    # # Impact Technology


    Due to technological developments, consumers, clients and citizens have less and
    less need for organizations (Lanting 2011). It is about organizing: setting up
    smart networks, chains and communities (Lanting 2014). There is a difference between
    different healthcare domains: in the hospital world, the influence of technology
    (robotization) is increasing rapidly; in elderly care, this is (even) more limited
    (Geisler 2003).


    The impact of these technologies on elderly care in the coming years is still
    unclear. It is clear, however, that technology has more and more influence on
    the organization and structure of healthcare processes (Kurzweil 2005). Examples
    are the increasing use of'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'smartphones and iPads; inventory management via sensors (including incontinence
    monitoring), increasing risks (data breach); shifting to Home, Garden and Kitchen
    technology (Van Montfort 2016), whereby clients purchase tools themselves; and
    self-measurements (health check), raising issues around privacy protection.


    Mobile healthcare applications, in particular, will experience significant growth
    (Roland Berger 2016). Due to the increasing influence of clients, the healthcare
    ecosystem will change fundamentally. An increasingly interactive approach between
    client and healthcare professional will change the healthcare system. For healthcare
    professionals, it is essential to have insight into the goals that can be achieved
    with digitalization and healthcare technology and to identify the means to achieve
    those goals (Roland Berger 2016).


    New ‘technologies’, such as smartphones and smartwatches with health monitoring,
    ensure that clients take on tasks themselves. Due to new scientific developments,
    healthcare is becoming more individual, specific and context-bound (personalized
    medicine). The significance of protocols, guidelines and trial research is therefore
    going to decrease considerably. Variation in practice will have a more positive
    meaning in the coming years (Van Montfort 2019b). In addition, within value-driven
    healthcare, specific interventions involve a reduction in practice variation to
    increase quality (Jeninga and Woldendorp 2019).


    The clients of professionals are increasingly present on online social networks.
    Professionals use issues in their work to achieve a sense of group. This does
    not require a hierarchical system, but a platform in which I encounter colleagues
    who are interesting to me (Molenaar 2017).


    # Create Cohesion


    Patients are opting with increasing awareness for certain healthcare providers.
    The recent FWG trend report (2017) shows the most important trends for the coming
    years:


    +   - More concrete interpretation of innovative power: providing coherent care
    with added value for the client;


    +   - Space for the individual: personalized care; integral approach;


    +   - Cohesion is key: the whole person with their own context; the client’s own
    world is the starting point;


    +   - Not everyone can keep up: there are also clients with limited self-sufficiency.


    The key is therefore to create coherence around individual questions where one’s
    own lifestyle is central. Directorship does not apply for everyone: there are
    clients who cannot fulfil that role. The shift to personalized care will become
    increasingly stronger. The starting point is and remains that the vulnerable elderly
    citizen can continue to live in his or her own living environment for as long
    as possible. With age, the vulnerability (of'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'a part) of the population increases, and the complexity of the demand for care
    increases. It is precisely at the interface between baseline, first, second and
    third line is that it is desirable to arrive at an effective implementation of
    care domains.


    The RVS (2017) advocates a personal life plan. Preconditions are:


    +   • Client determines who gets access;

    +   • The Client determines which information may be exchanged;

    +   • Plan is available digitally.


    Depending on the care situation, the client can appoint a proxy to take on this
    role. Healthcare professionals are authorized: the client determines which information
    is accessible to them. A collaborative attitude may be required of healthcare
    professionals.


    # Strengthening Client Position


    # Wicked Problem


    To shape the interaction, a different position of the client is required in order
    to achieve equality. From the client’s perspective, it is about the combination
    of quality of life and quality of care and the way in which that is designed.
    The reform of long-term care has the following goals at system level (Kromhout,
    Kornalijnslijper and De Klerk 2018). Better quality of support and care, greater
    involvement in society (more care for each other) and financial sustainability
    of long-term care and support. Although there is much talk about the directing
    role of clients, the healthcare provider appears to be decisive for the deployment
    of the care.


    Dierendock (2015, 7): if researchers want to produce results that contribute to
    the quality of life of the elderly, it is essential to involve those elderly in
    such a way that their own understanding of and experience with aging and the services
    available to them are optimally shared with researchers and professionals; they
    often have a completely different picture of the care needs of the elderly.


    Affordability of healthcare is an example of an unstructured (wicked) problem:
    there is a fundamental lack of consensus about values, norms, objectives, statements
    and facts (Vermaak 2009). As a result, this type of problem is not solved, but
    instead made manageable (Jeurissen, Maarse en Tanke 2018: 420). What follows below
    is the specification of a proposal in which the perspective of the client is central.


    # Funding Model


    The Nederlandse Zorg Autoriteit (‘Dutch Healthcare Authority’; NZa) (NZa, 2019)
    notes that the current funding model for district nursing based on different hourly
    rates for different forms of care no longer meets the requirements of care practice:
    ‘the funding'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'stimulates the use of hours of care, without a need for client to be central’
    (2019, 5). The volume of ZWV expenditures for nursing and care is (expected) €
    3,690,000,000.


    The current funding model has services with maximum rates per hour:

    Personal care:


    +   - On-call care

    +   - Nursing

    +   - On-call nursing

    +   - Specialized nursing

    +   - Advice, instruction and information


    In addition, there are services with a free rate and a contract requirement:


    +   - Chain care for dementia

    +   - Customized compensation

    +   - Regional availability function for unplannable care

    +   - Mutual services.


    Within the policy rule experiment on funding nursing and care, it is possible
    to agree on an integrated hourly rate. This is often applied by health insurers:
    95% of the contracted care providers work with an integrated rate. Budget ceilings
    are used for this. In addition, it is possible to make agreements within the policy
    rule based on a fixed amount per client per month. This project funding system
    is being tested in pilot form at a number of places (approximately € 158 million
    in total). Only within the context of non-contracted care is the ‘regular’ performance
    described above still used.


    Hourly rates mean that healthcare providers’ management of healthcare professionals
    is mainly based on the production of a sufficient number of hours. Conversely,
    a care provider that manages on improving the self-reliance of a client is ‘punished’
    by a drop in turnover and low productivity. The same mechanism also works with
    the use of labour-saving technology (2019, 13). The final perspective for a new
    funding model must be based on the care that a client needs. Cost effectiveness
    involves combining expected effects with expected costs (Kievit 2017). Room for
    variation in care at the individual level is not unlimited (Kievit 2017).


    # **Cost Control**


    In healthcare, it is also about policy options for cost control (Stadhouders 2019):


    +   - Regulate and limit the price of care.

    +   - Limit healthcare volume.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   - Limit the total of prices and volumes through budgeting.

    +   - Influence market processes that ultimately determine prices, volumes and
    healthcare expenditures.


    A widely used model is to focus financing on the outcomes of care. These are defined
    by five related dimensions (Eijkenaar 2015):


    +   - Good quality of care: content of care/technical quality and patient satisfaction;

    +   - Cost-conscious behaviour: prevention of over-treatment and unnecessary expensive
    care;

    +   - Good coordination and efficient substitution: To what extent is there good
    multidisciplinary collaboration and well-coordinated care?

    +   - Cost-effective innovation: To what extent are innovations that lead to lower
    costs with the same health stimulated?

    +   - Effective prevention: keeping the demarcated population healthy as much
    as possible.


    Adequate outcome funding concerns: an as simple as possible, demand-driven funding
    system that is explicitly aimed at stimulating care providers to achieve good
    outcomes of care in terms of quality, costs, coordination and prevention and that
    also stimulates cost-effective innovation and contains no incentives for undesirable
    behaviour (Eijkenaar 2015: ii). There are two components to this (basic and performance
    funding):


    +   - Integrated, multidisciplinary per insured person (population funding);

    +   - Explicit financial incentives for good quality through performance reward
    (pay-for-performance).


    The system design is based on a combination of standardization and customization:
    care is based on continuous ‘healing’ relationships; customization takes place
    based on the needs and values of clients (Hagel 2012); the client is the source
    of control; knowledge is shared; decision making is evidence based; safety is
    a feature of the system; transparency is necessary; needs are dealt with proactively;
    wastage is constantly being reduced; collaboration between doctors is a priority.


    # **Population Financing**


    When adjusting the funding system, the starting point is that clients are the
    solution - not the problem. An active client is a force for positive change: their
    feedback can provide valuable ideas for improving care (KPMG 2016a).'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Technology can contribute to improving productivity (and quality) as follows
    (KPMG 2016b):


    +   - Reduction of practice variation through decision support systems and standardized
    work processes;

    +   - Provide clients with instruments that facilitate self-management (client
    portal, care networks) (PatientsLikeMe);

    +   - Reduction of costs through more proactive care (sensor technology);

    +   - Preventing fragmentation through better coordination of care (Patients Know
    Best: management);

    +   - Easier access to specialist expertise and advice (telehealth);

    +   - Improvement of resource management through the use of digital planning processes;

    +   - Permanent learning curves.


    Population financing is a model for achieving this because this type of funding
    includes a strong incentive to control costs. A problem is that there is no clear
    definition (Pomp 2013). That is why it is difficult to draw up specific preconditions
    (Versleijen 2012). Two common effects: with capitation, the care provider receives
    a fixed amount per insured person per month or per year. ‘All’ often means hospital
    care or first-line care. With shared savings, one or more healthcare providers
    agree with one or more healthcare insurers that they may keep part of the savings
    against a benchmark. With shared savings, healthcare providers run no financial
    risk for budget overruns; with capitation, they do. With partial population funding,
    there is a strong incentive to reduce costs within the own organization; with
    integrated funding, there is an incentive to refer to the cheapest provider. An
    indirect but potentially important effect of integrated population funding is
    that it encourages competition between healthcare providers. This is due to the
    increased price sensitivity of referrers who gain an interest in finding the cheapest
    provider. This search behaviour leads to competition and possible innovation (Pomp
    2012). Preconditions for implementation are (Versleijen 2012):


    +   - Clear definition of population funding;

    +   - Letting go of the structure of null, first, second and third line: integrated
    care;

    +   - Attitude and behaviour of healthcare professionals (partly responsible for
    cost development);

    +   - Clear vision and permanent role for the government.


    Population funding is a management tool:'
  merge: -1
  img_proc: true
- pgno: 192
  md: '+   - Fixed (or negotiable) amount for demarcated population (target group
    or area);

    +   - Amount is based on severity and/or characteristics for that population;

    +   - Amount is used to achieve a predefined package of results for that population;

    +   - (main) provider has freedom in spending the budget and acting within it;

    +   - (main) provider is accountable for the agreed results to be achieved.


    Challenges:


    +   - Demarcation of population and definition of responsibility of contracting
    party;

    +   - Budget determination for the population;

    +   - Managing on results (definition, measurement, contracting);

    +   - Innovation.


    # Context of Individual Client


    This framework offers possibilities for taking the context of an individual client
    as a starting point. At present, the most commonly used basic funding methods
    are: funding per healthcare activity (fee-for-service), funding per healthcare
    bundle per client (bundled payment), funding per healthcare bundle per insured
    person (capitation payment) and a fixed amount per period (salary or budget) (NDSD,
    2016). Integrated funding implies that the funding does not take place per activity,
    but per condition, client or insured person.


    The NZa (2019) concludes that a mixed funding system could possibly be the ultimate
    destination:


    +   - Integrate population funding corrected for risk characteristics with risk
    sharing for one or more predefined populations.

    +   - Multidisciplinary funding per client for a number of delineated care episodes
    (e.g., certain elective procedures and complex emergency care).

    +   - Stimulating performance reward for good quality.


    Care consumers must play the following role in the development of the system:
    involvement in their own care trajectory (drawing up and following care plans)
    and measuring quality outcomes. In addition, it is about participation in personal
    care and the development of care standards. It is also important to make a distinction
    between allocation and use. Allocation is the process by which resources are allocated
    for a specific purpose (in the described system model system 3): macro level.
    Van Montfort (2019b): at the national level, it is about determining how much
    money is spent on solidarity and generally accessible care. Today, the allocation
    is laid down in outline agreements.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Use is about deploying the resources obtained to achieve certain goals (system
    1): micro level. The use therefore takes place at the individual micro level of
    the client/patient and the healthcare professional. A care plan is drawn up in
    that relationship.


    Resources follow the line of: you get a lot of what you pay for (Van Montfort
    1995). If you get extra money for waiting lists, waiting lists are created. It
    is about using the resources around the real needs of clients. By giving much
    more space at the micro level for choices, space is created for renewal and innovation
    and for quality development and efficiency (Van Montfort 2019b).


    # New Funding Model


    For the long term, the NZa assumes full funding for healthcare networks around
    the client. This is partly based on value-driven care: ‘care that contributes
    to improving the quality of care, improving the health of a population and reducing
    the costs of care per capita’ (2019, 10). Care providers and health insurers must
    be given space to shape the organization of care around the client and in the
    neighbourhood.


    A description of population management is a proactive, integrated approach from
    care to well-being through participation, involvement and targeted interventions
    around a population over the entire continuum from healthy through palliative
    phase. The appropriate population funding is a ‘disease-transcending, multidisciplinary
    funding of defined forms of care for defined populations’. This integrated coherent
    care offer must of course be in line with the needs of the population (Meeuwesen
    2018).


    The NZa indicates that research (Eijkenaar 2015) shows that interdisciplinary
    funding per healthcare bundle, combined with rewarding good outcomes, is the best
    way to achieve good healthcare. A healthcare bundle applies to a defined group
    of comparable clients within the care chain or the network. The healthcare bundle
    is then described independently of existing partitions and is also funded independently
    of budgetary frameworks. This promotes:


    +   - Health

    +   - Good incentives for an optimal care volume

    +   - Prevention

    +   - Optimal coordination between healthcare professionals


    The NZa has taken a number of steps in preparation. The following is planned from
    the ‘wetenschappelijke programma wijkverpleging’ (‘scientific programme on district
    nursing’; WPW) (2019/2020):


    +   - Identifying predictive individual characteristics and client groups

    +   - Gaining insight into characteristics and risk factors of care recipients'
  merge: -1
  img_proc: true
- pgno: 194
  md: '+   • Research into relevant and influenceable outcomes of district nursing
    care; this information forms an important part of properly functioning funding
    based on an amount per care period per client

    +   • Developing and applying a measuring instrument through pilots with healthcare
    providers


    # Activities of the NZA itself concern:


    +   • Evaluating the operation of the policy rule experiment on funding nursing
    and care: consequences for a new funding model

    +   • Collecting information to achieve a level playing field

    +   • Researching the organization and funding of system functins (unplanned district
    nursing in the evening, night and weekend)


    A new funding model for home care may be funding based on case-mix classification
    (Bulck 2017). For this, clients are divided into subgroups according to care needs
    based on various characteristics. The division into subgroups can then be based
    on clinical characteristics, such as a condition that someone has, but also on
    personal characteristics and environmental factors. By financing home care in
    this way, we can strive to provide customized care.


    Within the framework of this book, a combination of population funding and a self-regulating
    system of individual funding is sought. In the first case, it is about allocating
    resources; in the second case, it is about the use of these resources (Van Montfort
    1986; Van Montfort 1995). To arrive at a sustainable and affordable system, an
    integrated approach to care, housing, income and well-being for the elderly is
    needed to arrive at creative network combinations around individual clients (Huijsman
    2013, 63). Involving clients in considerations regarding the healthcare provision
    leads to less care consumption (Klink 2012: 17). The possibility of self-regulation
    is made possible by decoupling the macro budget and the actual deployment of resources
    (micro budget). On the basis of the macro budget, it is possible to determine
    what is available for a specific region or target group.


    Interactions form the core of platform technology. Applying this technology in
    care for the elderly breaks through the current obstacles in which the professional
    domain is dominant. Platform technology also strengthens the ability for clients
    to collect information and seek contacts with other clients. From that perspective,
    an appropriate financing basis is also considered. This is based on a system of
    person-bound funding in which in the start-up phase is realized at the level of
    groups of clients (target groups).


    Indicators are developed within that target group or region that are appropriate.
    These indicators are presented to professionals and clients. They commit themselves
    to arriving at care within the available resources. Both client and healthcare
    professional participate'
