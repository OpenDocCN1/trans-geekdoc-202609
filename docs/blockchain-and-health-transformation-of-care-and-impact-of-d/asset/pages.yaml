- pgno: 181
  md: 'For the professional, boundaries refers to where interventions are possible.
    Topol has developed a ‘doctorless patient model’ in which diagnostics and monitoring
    are primarily the responsibility of the patient (Topol 2015). For the citizen,
    it is a question of support where autonomy ends. Trust relates to the interpretation
    of each other’s roles, in respect for each other and respect for mutual expertise
    and input.


    Technology is used on the one hand as a supplement to professional assistance;
    on the other hand, technology can be used to improve self-care. However, working
    with digital solutions requires that the working methods of care professionals
    and the approach to informal care can be challenged. In the care process, the
    patient often has an information deficit relative to the care provider. In the
    case of chronic diseases in particular, it appears that the patient has an information
    advantage over care providers in the aftercare phase.


    # Positive Health


    The concept of quality of life is central within elderly care. An important model
    is the development of positive health by Machteld Huber (2014): ‘health as the
    capacity to adapt and to fill your own directing role, in the light of the social,
    physical and emotional challenges of life’. In many cases, a client-oriented approach
    has a positive effect on the quality of care. In the case of personal care, the
    client is looked at as a whole, not just the disability, and responsibilities
    are more divided between the care provider and the client (Rademakers 2016).


    It is important to see the preservation of functionality and self-reliance of
    individuals in conjunction with the social network in the living environment.
    Informal caregivers and relatives play an important role in maintaining vitality,
    recovery or preventing deterioration. Their role is not taken over by care providers
    and only becomes smaller when care is provided further away from home. For a request
    for care, the general practitioner holds the director role throughout the entire
    chain.


    Research shows that transparency with regard to outcome (both client-related and
    professional-related) can lead to quality improvement. Quality improvement focused
    on client-related topics seems to benefit from a centralized approach; professional
    quality improvement benefits more from local initiatives (Winters 2014). A certain
    degree of framing for clients therefore seems necessary. Quality has a number
    of dimensions: safety, effectiveness, efficiency, client orientation and timeliness.


    What does this mean for caregivers and nurses? For personal healthcare assistants,
    this means: they often work in an outpatient setting; care technology has a fixed
    place in the work (remote care; home automation). The coaching role towards volunteers
    and informal caregivers is strengthened. The (basic) nurse also works mainly in
    the outpatient setting. Here too, the broadening of the application possibilities
    of care technology applies (Kort 2008).'
