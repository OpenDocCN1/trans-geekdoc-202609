- pgno: 161
  md: '# DIRECTING ROLE OF THE CLIENT


    # Context of Position Client


    # Importance of Perception


    The description of the elderly determines our perception of someone: an elderly
    person creative, wise, has a lot of life experience, is a mentor or an elderly
    person is demented, confused, dependent etc. A painter with rheumatism in his
    or her hands can be appreciated for his or her understanding of art, the way the
    world is perceived, the sense of colour etc. For elderly people who (unknowingly)
    look at themselves from negative stereotypes, it appears that they adopt a more
    dependent attitude, professionals take over things unnecessarily, and institutions
    organize their care system on the basis of (too) great a care dependency.


    We like to take some work off the hands of the elderly (‘No, just stay put, I’ll
    do it for a while’), out of good intentions or simply because it is faster to
    do something yourself than to wait for an elderly person to do it themselves.
    Researchers such as Ellen Langer (2010) show that this attitude also has a huge
    impact on the behaviour and well-being of the elderly themselves. Their self-reliance
    diminishes, and people rely more on care. And that costs money and reduces quality
    of life.


    Our ideas about what elderly people can and cannot do limits people in their options,
    says Langer (2010). Small things can make a huge difference. In inpatient settings,
    for example, it appears that if elderly people can make a number of decisions
    independently and have to take care of plants themselves, their physical and psychological
    health will improve. It is not the physical condition that hinders, but the way
    we think about our limitation that causes us to become dependent. She starts from
    the psychology of possibilities (Langer 2010). Perception plays an important role
    in what we (think we can) do. For diseases, we often use categorization, the impact
    of which we easily underestimate. The descriptions of someone who has cancer or
    depression makes those involved feel that their illness is the same as their person.
    With a cold or headache, we describe ourselves as we feel at a certain moment
    and not who we are.


    We can describe the current situation with someone’s limitations well, and these
    descriptions are often the basis for care (life) plans and indications. This perspective
    can easily be a hindrance. Langer (2010) advocates starting from what someone’s
    capabilities could be. The assumption is that we do not know in advance what we
    can do. Encourage people to try different things without immediately judging whether
    they can or cannot do something. If it does not work, then you know it was not
    successful that time in that way. Perhaps the same goal can be achieved in a different
    way. Langer’s plea is that we learn to experience. An activating environment is
    also important. This combination of environment and responsibility leads to a
    new perspective on their own capabilities, and with that, on their physical and
    mental health. It is therefore essential that the elderly'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'themselves play a role in policy development and the organization of care processes.
    Langer (2010): Everything is the same until it is not. Kets de Vries (2008): An
    actual journey of discovery does not consist of seeing new landscapes but of looking
    at things differently.


    # **Empowerment**


    Empowerment is described by Machiel as ‘a process in which vulnerable people no
    longer feel alienated or powerless, but are once again able to make conscious
    choices about their own lives. The point of departure is that vulnerability and
    dependence can go hand in hand with control and directorship’ (Machielse 2016,
    39). The new generation of elderly people want much more control over their lives
    and their relationship with the professional. The elderly are citizens who (can)
    make their own contribution to society: the best example is the care of grandchildren.
    Instead of assuming someone’s limitations, it makes more sense to start with what
    someone can do. Solely the fact that someone is getting older and is perhaps less
    mobile does not affect the desire to structure your own life and to make independent
    choices. This also applies to people who are dependent on care. It therefore requires
    a switch in thinking, both from policy makers and from professionals in care and
    welfare, as well as from the elderly themselves.


    Empowerment requires a form of reflection aimed at learning to analyse one’s own
    actions from the relational relationships with other people within a specific
    context (Linders 2019). Empowerment is aimed at increasing the capacity of people
    to shape their own lives, their own context and the desired changes therein. Linders
    indicates that empowerment is not a method, but an approach on which the professional
    can base his or her actions (Linders 2019).


    The client is characterized by: person, own context, specific; diversity, heterogeneity,
    variety; elderly, chronicity, multi-issue; income position (relatively) improved;
    better educated; more empowered, clearer preferences (Van Montfort 2016). However,
    there is also a large group of vulnerable elderly people who are completely dependent
    on care. The positioning of elderly people who operate independently is facilitated
    by technology, with a shift from old to new (Van Montfort 2016). The client is
    not only a consumer but also co-creates: prosumers. Rotmans: a proactive consumer
    who also produces (Rotmans 2017: 35).


    | Old | New |

    | :--- | :--- |

    | High-quality | High-quality |

    | Complicated | Simple |

    | Client-unfriendly | Client-friendly |

    | Alienating | Connecting |

    | Expensive | Inexpensive |

    | Large-scale | Small-scale |

    | Curative | Preventive |

    | Consumer | Producer |'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'In this context, the client’s own directorship (Van Montfort 2016) means:


    +   - healthcare choices: client

    +   - organization of care: client

    +   - healthcare purchase: client.


    # Personal Directorship


    What does the outlined perspective mean? For clients, experiences are becoming
    increasingly important in their valuation of care providers: interpersonal aspects,
    no waiting times, clear information etc. Experiences are especially appreciated
    if there is an authentic (identity-related) service provision. Clients’ assessments
    are largely determined by their own experiences.


    Hauwert: ‘The increased reliance on personal directorship, the weakening of social
    relationships, the shrinking of the welfare state, and an inadequate vision of
    healthcare and service organizations due to increasing market forces mean that
    social integration of vulnerable citizens requires innovation and varied forms
    of support’ (Hauwert 2018: 14). There is a dominant discourse of autonomy and
    personal directorship and on the other hand the problematic practice of healthcare
    (Hauwert 2018).


    Patients are opting with increasing awareness for certain healthcare providers.
    The recent FWG trend report (2017) shows the most important trends for the coming
    years: more concrete realization of innovative power, offering coherent care with
    added value for the client; space for the individual, personalized care; integrated
    approach. Cohesion is the key: the whole person with their own context; the client’s
    own world is the starting point. Not everyone can keep up: there are also clients
    with limited self-sufficiency. The key is therefore to create coherence around
    individual questions where one’s own lifestyle is central. Resilient older adults
    draw support from social contacts, invest in younger generations, taking actions
    to manage or improve socioeconomic conditions, valuing own’s skills, persevering
    and resigning oneself to adversity (Kok 2019). Directorship does not apply for
    everyone: there are clients who cannot fulfil that role (Hauwert 2018).


    When implementing self-management and self-directorship, it must be taken into
    account that there are also vulnerable groups in society that are unable to direct
    their own care. People with low health skills (29 percent) need support in this
    (RIVM 2014). In the RIVM study, a distinction is made between care for one’s own
    health (for healthy citizens aimed at staying healthy, and for patients to retain
    directorship over their own care (self- management) and care for others (role
    of informal caregivers and volunteers).


    This is indicated with the term ‘vulnerable elderly’: that involves both physical
    characteristics and physical and cognitive (dys)function (Machelse 2016). Almost
    all people over the age of 75 have contact with one or more healthcare professionals.
