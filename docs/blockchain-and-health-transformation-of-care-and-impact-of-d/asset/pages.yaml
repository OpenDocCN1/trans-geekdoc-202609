- pgno: 164
  md: 'a quarter of them receives support from the WMO (Social Support Act) and a
    quarter receives district nursing (Dutch Healthcare Insurance Act) (SCP 2019b).


    # Balance


    Platform technology makes other forms of life possible (Dijck 2016). Although
    there is always an unbalanced relationship between a care recipient and a care
    professional, it is important to make that relationship as balanced as possible.
    As self-organization of the client increases due to platform technology, the role
    of the healthcare professional is focused on setting up and structuring the interaction.
    Platform technology makes it possible to position the client as a ‘healthcare
    institution’. A new form of life is hereby created. The client determines the
    choice of care provider and planning and monitors the budget. The role of the
    client and healthcare professional will change fundamentally. To facilitate this,
    it is essential to link the cash flow to the demand side (client) and no longer
    to the supply side (Van Montfort 2011).


    The relationship between the client and the professional is always central. In
    the interaction with the care professional, the client becomes more like a care
    institution that sets the framework for the activities of the care professional.
    The entrepreneurship of the professional is aimed at handling variety.


    In order to be able to continue living at home longer, the cohesion between the
    social network, personalized care and care technology is essential (SCP 2016).
    Government policy is expected to increase the reliance on informal care, while
    at the same time the possibilities for informal care support and respite care
    will decrease. The economic value of informal care (in the sense of savings for
    the government) is estimated at 4 to 8 billion a year (De Coole 2009).


    # Person-Focused Care


    Due to the increase in multiform care needs, the required network must be set
    up individually. Due to the multitude of requirements and preconditions set by
    the various health care systems, it is becoming increasingly difficult to keep
    a grip on one’s own life. Support is needed that is focused on one’s own individual
    situation and that, despite the multitude of rules, makes it possible to manage
    the care process. It is about realizing a person-oriented approach (Council for
    Health and Society 2017).


    For clients, it is important to use a broad perspective. Then it concerns aspects
    of what the clinical picture is, whether there are psychological problems, what
    the social system looks like, and how the living environment is structured. It
    is clear that client situations have complexity that is not reduced to one simple
    issue. The model of person-focused care consists of the following three core elements:
    the care relationship, the context in which care is provided and the results.
    Daily care is provided in the interaction between client and healthcare professional.
    The point is that care professionals pay attention to each individual elderly
    person (Emmelot 2019).'
