  md: 'The narrative identity plays a pivotal role between the ethical identity and
    the actions of a person: listening to and telling stories is therefore of great
    importance for the development of a professional identity (Kanne 2016: 328). A
    question is whether quality is a characteristic of care or precisely the meaning
    that the care provider and/or care recipient attach to that care at a certain
    moment (Baart 2018: 28).


    During the provision of care, someone’s identity comes into the picture: relational
    action is about the identity of the care provider and the care recipient. Good
    care is then care that achieves what the other agrees with. The assessment of
    whether care is good depends on the situation, the relationship between care provider
    and care recipient and the moment (Baart 2016: 15).


    The core of presentation theory is providing relational care. Baart’s development
    takes place on the basis of:


    +   - Providing relational care: it is about understanding the relationship and
    the care recipient understanding the capabilities of the care provider.

    +   - Cultivate quality awareness: by means of a well-maintained and critical
    awareness of quality among care providers (narrative quality test).

    +   - Work practically and wisely.


    Baart indicates having worked out a system of thinking around this (2016: 271).
    The relational interpretation of care has five types of relational interpretations:


    +   - Care that is designed from the relationship: care relationship

    +   - Care that is designed as a relationship: care relationship

    +   - Care given in relationships: biographical relationship

    +   - Care provided by relationships: institutional relationship

    +   - Care provided with an eye to relationships: finality relationship.


    According to Baart (2016: 213), relationship-oriented working is undervalued due
    to the commercialization and methodification of care. Working in a relationship-oriented
    manner leads to results that can only be achieved in this way: coordination and
    prevention of mismatches, obtaining recognition etc. It also ensures that professional
    perpetuation is reduced and prevents people from becoming more dependent and making
    the need for help endless: the care trap (2013: 104).


    # **Quality of Policy**


    If there must be an understanding of a certain situation then it is desirable
