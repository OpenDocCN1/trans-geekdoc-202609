  img_proc: true
- pgno: 165
  md: 'The context in which care is provided is designed in such a way that personal
    care is the starting point. The results of personal care are the core element;
    what matters is the effect on clients. The care for self-reliant elderly has three
    types of bottlenecks (SCP 2019b):


    +   - Personal strength and possibilities of elderly and their networks are overrated

    +   - Receiving care and support is complex: there are different types of care,
    provided by different domains, each with their own access criteria

    +   - Healthcare provision is insufficient: personnel shortage and lack of specific
    expertise


    The client experiences his or her own competence when the healthcare professionals
    see them as individuals and act accordingly. Then the values do not have to be
    the same. The complexity of elderly care can be felt by both clients and healthcare
    professionals. To ensure that innovations work for the elderly in a positive way,
    it is important to take the living environment of the elderly (their preferences,
    wishes, experiences and their meaning) as a starting point for changes (Luijkx
    2014, 19). Activities that involve both socialising and cognitive activities help
    to give meaning to people''s lives (SCP 2018).


    Proper care to self-reliant elderly regards offering personalized, proactive and
    multidisciplinary care and support. Vulnerability is a dynamic concept that varies
    in complexity of healthcare and support needs and in diversity of domains in which
    there is vulnerability. If personal control is the starting point, there should
    be no obstructions for elderly to indicate what they need. This requires an open,
    listening attitude of the parties involved (Wind en Te Velde 2019).


    In order to better answer the care demand of the client and to facilitate self-care,
    the current boundaries between null, first, second and third line are becoming
    blurred: there are more and more care networks. Multidisciplinary collaboration
    means that every healthcare professional makes his or her own specific contribution.
    Good collaboration between care professionals and informal caregivers becomes
    crucial. This will place different demands on the competencies of healthcare professionals.


    # Self-Management


    Complex problems do not require a simplifying approach but a broad diagnosis (Buurman
    2018, 8). It is essential to involve clients with a complex demand for care in
    improving care and using technology (Buurman 2018; Zwakhallen 2018). This means:


    +   - Client experiences must be actively used to achieve improvements in healthcare.

    +   - Justice must be done to the complexity of the demand for care.

    +   - Healthcare professionals and healthcare organizations are jointly responsible
    for the outcomes of healthcare.'
