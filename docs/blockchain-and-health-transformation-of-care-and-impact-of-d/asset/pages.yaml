    # Storing Data


    The blockchain is therefore technology that is used to store data. And the blockchain
    does not exist as a storage medium. Not singularly, anyway. Several blockchains
    will be created that can have very different characteristics and that are tailored
    to the application built on them. The best-known blockchain application is Bitcoin,
    a digital currency that cannot be copied due to the characteristics of the technology.
    blockchain also stands for supply chain optimization and control tools to work
    together more efficiently.


    A blockchain platform can be operational on four types of infrastructure.


    +   1. A blockchain platform can be installed as a blockchain node on a local
    computer. This is common for private development or testing environments.

    +   2. One or more blockchain nodes are installed on servers within the ICT infrastructure
    of a healthcare institution (on-site), to which different computers or devices
    can connect.

    +   3. Nodes can ‘host’ on one or more remote servers, such as cloud servers.

    +   4. A blockchain platform may use the global infrastructure of a public blockchain
    platform (VNG 2019).


    With blockchain, a safe digital infrastructure can be built within the healthcare
    system. In this book, we show what this infrastructure can look like.


    # Generic Benefits


    Edriouch et al. (2018: 26-27) assert that the characteristics of blockchain are:
    no central storage, not changeable, impossibility of error correction, energy
    consumption (proof of work), circulation speed, scalability, privacy and semi-democratic
    nature. Blockchain at its core is therefore an intelligent way to combine cryptographic
    techniques in a public, distributed database. The Basisboek Blockchain (a blockchain
    primer) by Chhay Lin Lim and Arthur Janse from 2019 gives the most complete picture
    possible of blockchain philosophy, technology and many other related issues around
    blockchain.


    As far as the storage of data is concerned, blockchain has the following generic
    advantages:'
