    Rotmans (2012; 2014; 2017) indicates that the current transitions (period of revolution)
    are shaped by experimenting from below. The digital working environment makes
    it increasingly difficult to find the right balance between work and private life.
    To get out of this, at least more room to manoeuvre is needed for professionals.
    There is therefore also an increase in (social) entrepreneurship, professionals
    who choose to become self-employed, citizens who want to direct themselves in
    their neighbourhood. This is partly due to own choices, and partly due to necessity.
    A growing group of people can and want to do many things themselves, and also
    no longer wants to be dependent on the government or existing institutions.


    Thomas Davenport and Julia Kirby (2016) state that people can help shape their
    future in a digital world. They see three developments: people who improve their
    ability to deal with a digital work environment, people who organize that digital
    work environment (super specialists) and people who further develop the digital
    work environment and ensure innovations.


    # Start-Up Approach


    # Flexibility


    The start-up approach offers an approach that focuses on flexibility, dealing
    with uncertainty and resilience (Brack 2017; Blank 2013; Hoogveld 2017; Ries 2011,
    2017). The scale for new developments in healthcare is not fixed in advance (Postma
    2015).


    Start-ups have a number of characteristics:


    +   • Scalability: Can you grow quickly?


    +   • Searching: constantly testing and validating whether your product or service
    is scalable;


    +   • Focus on technology;


    +   • Entrepreneurial mentality.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'A start-up is a starting company that tries to make a new idea successful in
    circumstances of high uncertainty. Start-up thinking helps to break through the
    resistance to change because the existing mindset is broken (Ries 2011). A start-up
    is a temporary organization that is looking for a scalable and repeatable business
    model (Blank 2013). Its characteristics are: speed, scalability, disruption, continuous
    willingness to improve and using digitalization (Hoogveld 2017).


    Start-ups are known for their entrepreneurship, adaptability and vitality (Woldendorp
    and Woldendorp 2019). Starting businesses are often characterized by individual
    entrepreneurship. They are thus able to operate quickly, flexibly and decisively,
    so that they can work efficiently and in a customer-oriented way and easily notice
    new opportunities. The essence is that employees of a start-up behave like an
    individual company (Brack 2017).


    Characteristics of start-ups are: they solve a problem, they show that what is
    conceived also works, they invest in networks, they are agile, and they ensure
    that they are visible. Ries talks about a start-up state of mind (2011). Ries
    defines the term ‘start-up’ broadly: everyone who tries to set up something new
    with an uncertain outcome is working on a start-up. Characteristic is that you
    do something from the start and learn by doing what works and what does not. Ries
    2017: identify the leading assumptions that must be true for the start-up to succeed.
    Have an experiment in which the assumptions can be tested quickly and cheaply.
    Use each experiment as an opportunity to learn what works and what does not (Kolb
    1984). Use your learning ability to start a new experiment and start again. Periodically
    determine whether you will work with a pivotal approach (change of strategy without
    change of vision).


    # Learning


    Start-ups are by definition focused on learning (Razehgi 2014). The start-up approach
    forms a form of life with its own language game. This form of life initiates activities
    of entrepreneurs who, from the start of their work, are focused on testing their
    own ideas. A form of life applies as a complex of coherent rules.


    Love (2016) has developed a J curve for start-ups:


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_221_0.png)


    Figure 7. J curve (Love 2016).'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'The model works as follows. In the first phase, the creative phase, it is all
    about the idea. In the release phase, it is about being able to deal with disappointments.
    In the model phase, we determine what costs we want to (or can) incur to get the
    idea onto the market.


    Morphing is about adaptation, also at a fundamental level. The market determines
    what a success is; adapting is therefore following that market and not the original
    idea. It concerns questions such as: What opinion do customers have? What attracts
    customers? Scaling up also involves three components: Can we find the right people?
    Do we have enough money? And do we keep work processes in order? By harvesting
    we can ‘cash in’.


    Every business model has three components: provide the product or service; care
    for a customer; ensure the revenues are higher than the costs. In start-up jargon,
    it is about the release of an MVP (Minimum Viable Product): what is sufficient
    to find out if it works. Make sure you really know what your customers think and
    organize feedback. By quickly making a minimum testable variant (MVP: Minimum
    Viable Product) of the product or service, it is possible to quickly test whether
    the concept appeals to the target group and where it needs to be adjusted. Tips
    are: do not assume who your (future) clients or customers are too quickly; consider
    in advance what important measuring points are for success; there is an overlap
    between the needs of providers and buyers.


    # Success


    Schevernels (2015) elaborates seven essential aspects for successful start-ups:
    ambition, new developments, quality, culture, talent, focus and funding. It is
    essential to arrive at a coherent approach:


    ![](img/7aac89a23a631ee44add9e5eff18dfe7_222_0.png)


    Figure 8. Aspects of successful start-up (Schevermels 2015).'
  merge: -1
  img_proc: true
