- pgno: 98
  md: '+   • MedFabric4Me provides data governance to patients, which leads to transparency,
    decreasing delay and improving the services.


    Although MedFabric4Me showed potential in some areas, there are some areas where
    there was a lack of a centralized solution. We will review them briefly.


    # Ease of Setup


    It is very easy to set up and scale a centralized system – much simpler than a
    decentralized system like MedFabric4Me. The centralized HIE is largely based on
    what is called _enterprise cloud computing_, which manages and scales multiple
    services to analyse system applications. For MedFabric4Me, it is complicated to
    develop a company-level system application with multiple independent components.


    # System Upgrade and Updates


    It is easier to update a centralized system as all servers and application code
    bases are controlled from a single central location. Blockchain setups are difficult
    to upgrade as nodes are distributed and each node is updated at the same time
    to keep the network functional.


    # Easier Data Backup


    In a centralized system, it is easier for the current HIE to back up health data.
    This can be complex for MedFabric4Me when patients own their data and are free
    to choose their own data storage service providers. It is possible that the patient
    may permanently lose data due to a lack of data backups.


    # THE BASIC PRINCIPLES OF BLOCKCHAIN IN HEALTHCARE


    Blockchain offers opportunities for healthcare, but there is also a need for knowledge
    and insight into how to use blockchain safely and responsibly in healthcare (Zorginstituut
    2019). Blockchain is currently being implemented more theoretically than practically.
    The legal, organisational, social and technical preconditions under which blockchain
    can be of value to healthcare require clarification.


    The four basic principles are central to this chapter; we already mentioned them
    in Chapter 1 and at the start of Chapter 2. In order to achieve a more effective
    realization of the care, we expand on the four basic principles for the use of
    Blockchain.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   - Basic principle 1 Growing chain. In order to be able to work together,
    it is necessary that information can be shared. This is implemented through information
    standards and Nictiz''s five-layer model.

    +   - Basic principle 2 Distributed network. Blockchain acts as a digital infrastructure
    (a care information system). An example is the functioning of the IT platform
    within value-driven care to arrive at a record of outcomes of care.

    +   - Basic principle 3 Consensus. Since there is no central party that steers,
    the parties involved must reach agreement.

    +   - Basic principle 4 Data storage. The recording of the digital identity and
    the safeguarding of privacy results from working with Blockchain.


    # Basic Principle 1 - Growing Chain


    Healthcare is a digital island empire. Data exchange between professionals does
    take place, but there are still major points for development. Blockchain can play
    an important role in a new relationship between the patient and his data, the
    fourth basic principle, for example through greater transparency and control over
    data exchange. This is already being used by various parties:


    +   - Blockchain for repeat prescriptions: Prescrypt. This is considered one of
