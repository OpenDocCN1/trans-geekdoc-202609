    infrastructure for care professionals (self-employed professionals), care institutions
    and clients so that they are facilitated as optimally as possible and was co-founded
    by me. Since January 1, 2017, PlatformVmZ has focused on district nursing and
    in particular on non-contracted independent care professionals (self-employed
    professionals) and (smaller) care institutions. The infrastructure is set up in
    accordance with the nationally applicable conditions and standards. At the moment,
    there are approximately 1300 sole proprietors affiliated with PlatformVmZ as well
    as 100 (smaller) care institutions.


    In addition, a client portal has been set up (CuraeVitel Balie) that, in addition
    to care services, also offers living and comfort services for the elderly who
    want to continue living independently at home for as long as possible. The elderly
    also receive support in navigating through the care system.


    Platform technology creates new ecosystems that connect clients, partners and
    providers (Evans 2016). This leads to a more integrated approach and ensures that
    quality is improved and costs are reduced. A platform is the common basis of technologies,
    technological, economic and social rules and agreements (such as standards) on
    which'
