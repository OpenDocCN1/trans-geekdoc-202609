  md: 'that the position of clients can be strengthened by embedding the voice of
    insured persons and patients in the healthcare procurement process (RVZ 2014a).
    The Ministry of Public Health, Welfare and Sport is currently working on an amendment
    to the Health Insurance Act (pending): ‘Opinions and wishes of the insured must
    become more central to the policy of the health insurance company. It is important
    that the insured have input in the healthcare procurement policy’ (bill 34971).
    Patient associations and associations for the elderly advise more direct forms
    of influence and feedback (reactive 20 May 2019).


    Participation of the elderly in policy development can be achieved in many ways.
    By conducting research, but also by letting elderly collaborate and participate
    in policy initiatives as equal (discussion) partners. Then they also see the dilemmas
    that policy makers face, and they can brainstorm - well informed - about creative
    solutions. Good collaboration in the care network seems to have a positive connection
    with the quality of care. Having joint control over the care and the feeling of
    having a grip on life is positively related to the perceived quality of life.
    For a better quality of care, it is important that both informal and formal care
    providers invest in good cooperation with each other (Cooperider 2003; Masselink
    2008).


    Research from the VU (Zwart-Olde 2013) shows that 35% of the elderly can direct
    their care with the help of others. These are relatively often elderly people
    who find it important to play a directing role. 45% of the elderly indicate that
    a formal care provider directs the care network. This can greatly benefit the
    quality of the policy and the chosen solutions. Policymakers are usually people
    in the prime of their lives, for whom different things are important than for
    the elderly. This was also apparent from a study into the housing needs of elderly
    people with dementia: Would they rather live in a house in a residential area
    or in a care institution?


    People between 70 and 75 were interviewed, as well as people between 40 and 50.
    It turned out that the elderly, based on their experiences with dementia, had
    very different ideas about what good living facilities are than the people between
    40 and 50. The latter group preferred residential facilities in the neighbourhood.
    Cosy, with other neighbours. The elderly preferred a small scale but then in or
    at a care institution. In a house in the neighbourhood, a demented resident cannot
    go out the front door, because then he or she is on the street, and that is dangerous.
    Moreover, it is much more difficult to join in activities. In short: it unnecessarily
    limits someone who is demented in their options. This is a perspective that was
    not included in the policy.


    The core of Langer''s (2010) ideas is that we see variety. If we have a certain
    perspective about the dependence of the elderly, it usually determines what we
    see and how we will behave. However, if we realize that everyone is different
    and that we are different from ourselves at different times and with different
    people, our perspective is considerably broadened.


    The design of regular aid emerges from the implementation of policy principles.
    The tricky thing about that is converting a client’s demand into an action plan.
