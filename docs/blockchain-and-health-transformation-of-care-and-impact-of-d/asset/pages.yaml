- pgno: 247
  md: 'healthcare insurers enter into discussions with each other about elderly care.
    Stichting Digitale zorg (digital care platform) is an initiative for and by people
    who are active in the field of care, IT and innovation. The aim is to contribute
    to the successful development and implementation of ZorgICT initiatives and innovation.
    To realize this, knowledge and news from inside and outside the Netherlands (EU)
    are collected, knowledge is shared and activities are developed.


    The platform ‘De Academische Werkplaats Ouderenzorg’ (‘The Academic Workplace
    for Elderly Care’; AWO) is a virtual workplace in Limburg. The work is being done
    at various locations within the various organizations. Maastricht University plays
    an intermediary role and creates the connection between research, practice and
    policy. A senior researcher from Maastricht University is associated with each
    healthcare institution involved.


    The six ‘Samenwerkende Academische Netwerken Ouderenzorg’ (‘Cooperating Academic
    Networks for Elderly Care’; SANO) now have structural funding. The additional
    structural financing, which is implemented by ZonMw, provides new knowledge about,
    for example, the effects of innovations in the organization of care for the elderly,
    smart connections to the labour market and further improvement of the quality
    of nursing home care. This new knowledge becomes available nationwide for all
    nursing homes in the Netherlands.


    OZO Verbindzorg is a digital platform for healthcare providers in the western
    part of the Achterhoek, driven by patients themselves. The various care providers,
    such as the general practitioner, home help and caregiver, will soon be able to
    contact each other via the platform. The client decides which of the aid providers
    can access the platform. When the client himself is unable to manage the platform,
    this task can be placed in the hands of a family member or caregiver after consultation.
    However, the client always remains leading. OZOverbindzorg stands for collaboration
    and sharing of care. All parties (informal caregivers, family and care providers)
    involved in the care and welfare of a client are brought together. A network is
    formed around the client, where the client decides who will participate.


    ‘Zorgplatform ouderen’ offers knowledge and expertise with regard to care for
    vulnerable elderly people. It is about offering instruments, guides for practice
    nurses and practice assistants. The platform is an initiative of V&VN Praktijkverpleegkundigen.


    The Nationaal Programme Ouderenzorg ran from 2008 to 2016 (125 care projects).
    It concerned innovative projects to organize care and support differently. The
    1st phase of the national programme Ouderenzorg ran from 2008 to 2013 and had
    a budget of 80 million euros. From this, 75 transition experiments, research projects
    and implementation projects, and 8 regional networks were funded. This programme
    was about improving care for the elderly with complex requests for help; the elderly
    were explicitly involved themselves (Bussemaker 2019).'
