    # Value-Driven Care


    The responsibility for care is provided in consultation with clients and professionals.
    In this case, value-driven means that support must provide an answer to the question
    of the citizen and is not only inspired by the professional opinion of the help
    provider. Porter (2006) states that in order to make healthcare more effective,
    you must connect competition with value for the patient. Value is determined by
    taking as a starting point the specific medical condition of a patient over the
    entire chain of care (Modig and Åhlström 2017): from monitoring and prevention
    to treatment up to and including aftercare (recovery or chronicity). The measurement
    and development of the results are central to this.


    Value-driven care is therefore about measuring the value described as delivered
    care outcomes divided by costs incurred. Patient value concerns the outcomes that
    are relevant to the patient divided by the costs required to achieve these outcomes.


    Porter describes a medical condition as: ‘a set of patient health circumstances
