  md: 'technologies, technological, economic and social rules and agreements (such
    as standards) on which multiple players can jointly develop additional technologies,
    products or services.


    An important element is the information that is available for a client (and healthcare
    professionals). A personal health environment or personal health record is a website
    or app that gives a patient access to his own health data. This concerns data
    stored by, for example, the general practitioner or medical specialist in the
    hospital. The patient can use this data in the personal health environment and
    also record his or her own data.


    A platform is the common basis of technologies, technological, economic and social
    rules and agreements (such as standards) on which multiple players can jointly
    develop additional technologies, products or services. For the organization of
    healthcare processes, this involves organizing flexible capacity, starting from
    the wishes and schedules of clients, providing value-driven health care (for clients)
    and identifying and resolving obstacles (Rummler and Brache 2013).


    This leads to a completely different approach to the interaction between client
    and professional. Professionals play the central role in (starting to) work with
    the client as director. In addition to the appropriate competences and skills,
    they need more professional space for this and a corresponding organizational
    structure (network structure) (De Laat 2012).


    A platform focuses, among other things, on organizational forms such as cooperatives
    that contribute to the elderly maintaining directorship over their lives and local
    collaborations. Social technology supports the ability to continue living independently.
    In addition, models for transmural care, early detection and prevention are being
    developed. In healthcare, you see an increase in apps to support the healthcare
    process.


    Andries Baart (2013: 25) indicates that the deployment of vulnerable people must
    first and foremost come from themselves and then from caregivers and close neighbours.
    Only then will professional help and care providers get involved. On this basis,
    the role of citizens (citizens’ initiatives) becomes increasingly important. For
    the organization of healthcare processes, this involves organizing flexible capacity,
    starting from the wishes and schedules of clients, providing value-driven health
    care (for clients), identifying and resolving obstacles and monitoring quality.


    More and more citizens are organizing their own care or setting up platforms for
    their neighbourhood: mijnbuurtje.nl, buuv.nl, burenetwerkwerk.nl, voordebuurt.nl.
    There will be insight into one’s own health via the Medical Internet of Everything
    model. This is, for example, advice to preventively improve one’s own lifestyle.
    If treatment is required, the platform helps to make choices. Healthcare providers
    can then offer services themselves.'
