    \ what the actual data looks like. Also, a hash is meant to be unique. If a bit\
    \ or character changes in a piece of code or a document, the hash will change\
    \ completely. Any change in the blockchain can thus be seen immediately.\n\n>\
    \ **Cryptography**\n> \n> Cryptography deals with techniques for hiding or encrypting\
    \ information to be transmitted. A cryptoanalyst is the person who has access\
    \ to the channel between transmitter and receiver and can therefore 'listen in'\
