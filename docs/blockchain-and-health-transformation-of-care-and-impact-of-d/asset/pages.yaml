- pgno: 117
  md: '+   1. Receiving a token: a healthcare transaction is received by the Blockchain
    as a collection of actions recorded in the form of tokens.

    +   2. Determining a base block: the last confirmed block is checked, including
    an identifier for the block used to create a new block.

    +   3. Ensuring a peer review: the token is validated (the collection of care
    transactions, diagnosis and treatment protocols) and sent to peers to review.

    +   4. The validation of the block: the digital signature of the validators is
    added to the block; the block is hashed.

    +   5. Token expansion: the initial token is expanded with the validation token
    to confirm the handling actions.

    +   6. Creating a block: based on the validation token, digital signatures, peer
    reviews and a collection of care tokens, the block is created by miners.

    +   7. Sending the block: the combined blocks (collection of care actions) are
    sent to peers.


