    everyone.

    +   - Information is stored decentralised, distributed between different computers.

    +   - All data are stored in combination with the corresponding time of those
    data.

    +   - The code is open source, which means that everyone can view it.


    Smart contracts exist to fulfil agreements between the parties within the Blockchain.
    These are not contracts in the legal sense, but software that automatically executes
    those rules between parties within a Blockchain (Zorginstituut 2018). In Chapter
    2, we go deeper into this.


    # Hybrid System


    A hybrid system has characteristics of both the public and private system. An
    example of a hybrid system is using existing systems with sources on which a Blockchain
    is built. This can be done, for example, with the delivery of medication in which
    not all sources of the manufacturer are visible, but the qualification of the
    product medication that is delivered is visible. Figure 5 is an illustration of
