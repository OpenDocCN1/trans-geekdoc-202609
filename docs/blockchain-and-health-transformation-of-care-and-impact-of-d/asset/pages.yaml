    # Personal Directorship


    The system around a client wants professionals who are knowledgeable, but also
    professionals who can apply this general knowledge in everyday life. This includes
    support with self-reliance and support with self-management. An important part
    of self-reliance and self-management is personal directorship, or self- directorship.
    Personal directorship is about making your own decisions about your life and care
    and support. The central question is: What do I want? Personal directorship means:
    the ability to arrange your own life and necessary support and the practical ability
    to be self-sufficient in physical, social and psychological terms. Personal directorship
    involves the following four aspects:


    +   • Starting from the positive: What can I do as a client? Where does my strength
    lie?

    +   • Strengthening the client through insight into his or her own drives and
    situation: In which areas is it going well? In which areas is it not going so
    well? What do I want to do or would like to be able to do again?

    +   • Leave control over support and assistance up to the client as much as possible:
    What do I want with my life? What do I want to work on? What help do I need? And
    what do I want that help to look like?

