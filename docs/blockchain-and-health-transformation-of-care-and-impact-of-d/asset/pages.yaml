    work processes.


    Changes will only occur through a fundamental shift in the influence position
    of clients. In addition, changes to the financing and the structure of the health
    care system (position of insured persons) are necessary to achieve this. The impact
    of technology on the labour market problem is much greater than is currently thought.
    This means that care provisioncan be carried out with fewer care professionals.
    Practice shows that the innovative capacity of healthcare professionals is actually
    present in every system.


    Partly due to the development of citizens’ initiatives and care cooperatives,
    there is a movement towards a stronger position for clients. Good care starts
    with a home environment that makes self-reliance possible. That is why the connection
    between living and care is essential. In addition, a shift in the influence position
    is feasible for a proportion of the elderly; however, 30% are unable to fulfil
    such a role. In addition, there is also a great deal of demand shyness. It is
    precisely through citizens’ initiatives that a certain degree of equivalence is
    created. A role for healthcare professionals is to make personal directorship
    possible.


    Demand management: It is important to be clear what equality means. It is not
    about equality (healthcare professional has unique expertise) but about the structuring
    of the interaction. Much is determined by the conceptual system that clients and
    professionals use. That is why it is important to make explicit what is meant
    by personal directorship. One aspect of that definition is clarification about
    the difference between willing and able.


    This is a core task for policymakers (administrators): ensuring that clients and
    professionals do not suffer from the (alleged) bureaucracy.


    Technology impact: testing grounds, however, show that large effects can already
    be achieved with the help of technology in the home situation. However, the turning
    point to a broad commitment has not yet been reached. Knowledge of the technological
    possibilities is essential to achieve them. Technology also requires the skills
    to cope with it. Broad application leads to other forms of individual care provision.


    Personal directorship: starts with citizens themselves. A citizen must be capable
    of actually fulfilling that director’s role. Then a new dynamic is created between
    client and healthcare professional. Choices become easier if information about
    healthcare is easily accessible. In the current system design, it is difficult
    that an immediate policy framework often arises in the event of an incident.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Personal directorship can also mean that a conscious decision is made not to
    want to have directorship. Professionals have long been trained within the perspective
    that ‘they know better’. This proves difficult to let go of in practice. Through
    more ownership with clients, the system design will develop more dynamically.
    Precisely by giving direction, the interaction between client and professional
    changes. The network around a client also offers the opportunity to introduce
    new perspectives.


    Quality can be defined as care provision that matches the demand a client has.
    Here, too, language is essential: quality of life leads to different considerations
    than quality of care. Much attention is already being paid to reflection within
    the study programme. However, it appears to be very difficult to find enough space
    and time to devote to reflection in work practice. The work practice is characterized
    by a ‘do-it-yourself’ culture. From the study programme, it is therefore desirable
    to pay more attention to how reflection forms an integral part of work practice.
    From within the organization, it is important to give space to reflective practice
    in the work processes. Attention to the financing system is important. Health
    insurers are already developing forms of joint financing (partly with the client).
    With regard to forms of personal funding or forms of population funding, mutual
    trust is the core theme. The point is that a new funding system is based on the
    individuality of the client in relation to the healthcare provider.


    Working with a Personal Health Environment (PGO) has a high degree of future-proofing,
    provided that the client can handle his or her own information in a user-friendly
    manner.


    # SUMMARY


    The interaction between client and professional is about insight into self-organization:


    For clients, strengthening the director’s role means less variety: the client
    gets (more or less) what he or she asks for. For the professional, the variety
    increases from this perspective. The system theory provides a framework for the
    interpretation of variety.


    The word system is loaded in healthcare: the system world is set against the (intended)
    living world. A system is defined from the system theory:


    +   - A system is a collection of relationships between elements.

    +   - A system is determined by an observer.

    +   - A system is what it does.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/7aac89a23a631ee44add9e5eff18dfe7_259_0.png)


    Figure 13. Model of self-organization (prepared by Thomas Woldendorp).


    The interaction between client and healthcare professional is a system. Implementing
    ‘Back to the intention’ (Hart 2012) is a system. The core is to strengthen the
    autonomy and management role of the client and to support and thereby strengthen
    the entrepreneurship (entrepreneurial behaviour) of professionals. We started
    with the explanation that the roles will shift. This shift leads to two forms
    of variety:


    +   - For the client, variety decreases when the individuality of the client is
    central.

    +   - For the professional, the variety increases because the individuality of
    each client is central to the interaction


    This means that new forms of interaction between client and professional are needed.
    The underlying principle is that there is clarity (back and forth) about the assumptions
    underlying the interaction. In addition, the role of the care recipient is different
    from that of the care provider. There is asymmetry in the roles: the person requiring
    care is dependent. However, there is equality in the relationship: both care recipient
    and care provider bring their own person (identity). This has been worked out
    in detail in presence-based theory (Baart 2011).


    The interaction takes place in a context that is rapidly transforming. New forms
    of care provision are emerging through technology and digitalization. This may
    involve predictive care, but also clients who organize themselves via, for example,
    a platform in order to gain more influence on the care process. This is about
    the connection between technological innovation and social innovation. Technological
    innovation has various components: Home, Garden and Kitchen Technology, but also
    the application possibilities of artificial intelligence. Social innovation is
    reflected in, for example, healthcare cooperatives.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Social innovation is expressed in various ways to achieve more autonomy. An
    important part is that clients have access to their own health information. In
    terms of policy, it is about interpreting demand-driven management: the organization
    of care on the basis of an equal position between client and care professional,
    whereby the client has the relevant health information available. Interacting
    with each other in a certain way creates a form of life however, it can also be
    interpreted differently. for both, it is about finding meaning in which the unequal
    roles lead to equal people. Important elements are:


    +   - Understanding of each other’s position

    +   - Reflection on the own position

    +   - Provision of information that matches the client’s wishes and approach of
    the care professional

    +   - Information provision that meets the needs of informal caregivers

    +   - Funding model that facilitates equivalence

    +   - Space for professionals to handle variety (innovation of regulatory space)


    Preconditions as a result of digitalization are:


    +   - Digitalization leads to predictive and precision medicine. Interaction must
    be designed on the basis of newly available information. Possibilities of self-management
    for clients are increasing; healthcare professional is expected to respond to
    client preferences. The client shifts from being a consumer to a prosumer.

    +   - The way in which information provision is arranged determines interaction:
    involve clients in the establishment of a Personal Health Environment (PGO).

    +   - Regulatory space for professionals is increased; new organizational concepts
    are needed that are founded on the system concepts of variety, balance and recursion.


    The added value of this approach is strengthening the position of clients). To
    achieve this, the added value of five perspectives was examined:


    +   - Narrative perspective: attention and respect for the life story

    +   - Self-managing perspective: attention and respect for the professional role

    +   - Network perspective: trying to give substance to an integrated approach

    +   - Client perspective: trying to give substance to the positioning of clients
    in the care process

    +   - Care technology perspective: giving substance to a digital living and working
    practice'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'In these perspectives, the way in which the interaction between the client
    and the healthcare professional is designed is differentiated. The starting point
    is the extent to which the client can manage. Here, too, it applies that no single
    one of these perspectives is decisive, but that a mix of approaches is always
    sought depending on the context. That context is the position and preference of
    the client. Translated to the five perspectives:


    +   - Narrative perspective: Stories are central to the interaction. One challenge
    is the translation into working practice.

    +   - Self-managing perspective: The autonomy of professionals is central. A challenge
    is to sufficiently involve the client perspective in the interaction as well.
    At Buurtzorg, there can be a closed ideology that hinders reflection.

    +   - Network perspective: Interaction is shaped by creating cohesion. The challenge
    for many networks is organizational hassle that actually impedes interaction.

    +   - Client perspective: Client preference and needs are central. The challenge
    is to link these preferences to management of the care process.

    +   - Care technology perspective: Preference, information and management are
    linked. The challenge is to let clients navigate in the care system.


    From the system approach, it has been indicated that the interaction must be completed
    from an open system perspective. It is not the case that one of these perspectives
    is decisive. Depending on the context, a mix of perspectives provides added value.
    Perspectives cannot be taken for granted. It is about creating coherence around
    individual questions where one’s own lifestyle remains central. In addition, this
    approach also states that not everyone can come along: there are also clients
    with limited self-reliance.


    The relationship between language and reality requires insight (reflection) into
    one’s own standards. This insight makes new ways of acting (enactment) possible.
    Shared meaning is essential for effective interaction between client and healthcare
    professional. Sensemaking involves underlying (often unclear) assumptions under
    the interaction. A meaningful dialogue is about insight and respect for the meaning
    of the client and that of the healthcare professional.


    Although there is a need for a clear conceptual framework, words and concepts
    are context-dependent. A translation issue arises here. The interaction is effective
    if the position of the other can be understood. The story of a client is often
    translated by the healthcare professional into their own professional domain.
    This translation removes the variety from that story and thus impedes sensemaking.
    Interaction by definition takes place in a certain context. Healthcare often starts
    with a biased view of the patient. There is often categorization where someone
    with an illness or disability is seen as that disability. That is precisely why
    this chapter focuses on empowerment: disease and management come together in balance.
    A multiple perspective is created.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'If the position of the client is strengthened, the variety (of the offering)
    decreases for the client: there is a connection to his own needs and not that
    these needs have to fit into a certain offer. The opposite applies to healthcare
    professionals: recognition and acknowledgement of the uniqueness of a client leads
    to an increase in variety in care provision. It becomes necessary to be able to
    provide a new interpretation of the interaction from a system perspective.


    To do justice to the uniqueness of every client situation, attention is needed
    to the context and a broad perspective. This can be achieved by giving clients
    a role in the design of the care process, whereby digitalization and technology
    are a precondition. By working from an integral approach (preventive, care and
    wellness) and principles of self-management, the positive aspects of the client
    are strengthened, and new opportunities for participation are created. For clients,
    technological possibilities will increase. However, this requires clients to keep
    abreast of technological developments, digital skills and their own interpretation
    of data (Morgens 2019). Digital skills are also needed for care professionals
    (www.digivaardigindezorg.nl). Vulnerable groups such as the elderly are often
    less able to find and use ehealth applications. This can lead to greater inequality
    in healthcare (Bolman 2019).


    Participation requires a context in which self-organization is central. Within
    society, there is increasing pressure on individual responsibility and self-reliance
    of citizens. This applies to both clients and informal caregivers. Personal care
    offers a quality model that is focused on the client perspective. Directorship
    requires a form of activating action. However, client situations are also characterized
    by vulnerability. There are complex healthcare issues that require a broad perspective
    from the healthcare professional. In that context, a clear role of the client
    is essential. Care can be made suitable through better insight into the life story
    of a client.


    The model of person-focused care consists of the following three core elements:
    the care relationship, the context in which care is provided and the results.
    Daily care is provided in the interaction between client and healthcare professional.
    The point is that care professionals pay attention to each individual elderly
    person (Emmelot 2019).


    The context in which care is provided is designed in such a way that personal
    care is the starting point. The results of personal care are the core element;
    what matters is the effect on clients. The client experiences his or her own competence
    when the healthcare professionals see them as individuals and act accordingly.
    Then the values do not have to be the same. The complexity of elderly care can
    be felt by both clients and healthcare professionals. To ensure that innovations
    work for the elderly in a positive way, it is important to take the living environment
    of the elderly (their preferences, wishes, experiences and their meaning) as a
    starting point for changes (Luijxk 2014, 19).


    Complex problems do not require a simplifying approach but a broad diagnosis (Buurman
    2018, 8). It is essential to involve clients with a complex demand for care in
    improving care and using technology (Buurman 2018; Zwakhalen 2018). This means:'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   • Client experiences must be actively used to achieve improvements in healthcare.

    +   • Justice must be done to the complexity of the demand for care.

    +   • Healthcare professionals and healthcare organizations are jointly responsible
    for the outcomes of healthcare.

    +   • Healthcare professionals are facilitated by the training of competencies
    (Buurman 2018, 9).


    Self-management determines the quality of life and is increasingly emphasized
    by the chronically ill and (vulnerable) elderly. Self-management is about ‘the
    capacity and skills of a person to experience a certain degree of balance and
    well-being even in old age despite age-related losses, with the aim of maintaining
    or achieving the best possible quality of life’ (Vilans 2007). The core of the
    interaction is that the client and the care professional find a way of working
    that best suits the client and his situation.


    What is needed is for professionals to increase their learning capacity. This
    requires an innovative working environment and a learning model that is focused
    on results. The increasing complexity of care requires that the logic of the professional
    and the logic of the client become aligned. The starting point for this is acting
    on the basis of trust and accountability. Personal functioning is central.


    Regulatory space can be filled in from entrepreneurial action. Here action, responsibility
    and accountability are central. The competencies and skills that are expected
    from a healthcare professional fit well with personal entrepreneurship. A model
    that allows reflection on this personal entrepreneurship is the start-up method.
    This is about being able to deal with uncertainty and being able to show resilience
    and courage.


    Central are the concepts of professional, personal entrepreneurship and start-up
    approach. The above-described increase in variety in the care process requires,
    according to the elaborated system principles, two approaches: damping the variety
    through standardization of care and strengthening the variety by increasing professionals’
    room to manoeuvre.


    We see a struggle to deal with this in care organizations: on the one hand, forms
    of self- management and self-organization are chosen; on the other hand, those
    forms are being phased out.


    What is needed is for professionals to increase their learning capacity. This
    requires an innovative working environment and a learning model that is focused
    on results. The increasing complexity of care requires that the logic of the professional
    and the logic of the client become aligned. The starting point for this is acting
    on the basis of trust and accountability. Personal functioning is central.


    In the interaction with the client, insight is always needed into the specific
    context in which that client is located. A better digital and technological working
    environment can support the professional in the organization of care. Digitalization
    and healthcare technology only work effectively if it is a normal part of healthcare
    practice. Directing'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'one’s own life is difficult if that life is vulnerable. Personal directorship
    means: the ability to arrange your own life and necessary support and the practical
    ability to be self-sufficient in physical, social and psychological terms. If
    a healthcare professional has a certain perspective on the dependence of the elderly,
    that usually determines what is seen and how we will behave. Healthcare interventions
    stem from professional practice. These interventions must be in balance with the
    perspective of a client.


    The key is that by strengthening the position of the client, the variety for the
    client decreases, and for the healthcare professional, it increases. Because the
    needs of the client are central, the variety for a healthcare professional increases.
    After all, every client has his or her own context. For organizations, this must
    lead to regulatory space for professionals. For clients, the variety decreases.
    The client receives what is needed in the right way.


    Due to the described increasing complexity, open systems are needed. This requires
    a different role interpretation of healthcare professionals. Central to the interaction
    with the preferences of clients is reflection on their own actions. The system
    approach makes it possible to interpret these various aspects of the interaction
    cohesively and to act on the basis of that interpretation. The healthcare professional
    can work effectively in a healthcare practice of increasing complexity (caused
    by variety) if the self-regulatory capacity (learning, agility, adaptation) is
    strengthened. The healthcare professional determines the extent to which the variety
    is dampened or strengthened:


    +   - Make sure in the interaction that both the perspective of clients and the
    perspective of professionals can be reflected;

    +   - Make more use of the narrative approach and the presentation theory to maintain
    a view of the individual identity of the client (dealing with variety);

    +   - Ensure an information management system that supports clients’ own management
    (user-friendly);

    +   - Work out a funding model based on the individuality of the client.


    There are no certainties in advance in the interaction between client and professional.
    Handling variety is the core of the interaction between client and healthcare
    professional. Because the client can have more self-management (decrease in variety),
    the healthcare professional has to handle more variety due to the individual diversity.
    A system is viable if it can handle variety. This always requires a search for
    balance and reinforcement of the adaptive capacity: the healthcare professional
    is able to deal with the various individual contexts. Quality, effectiveness and
    efficiency take place in interaction. The client has a central role in that: it
    is about how the client experiences the various interventions and what possibilities
    they have for management. For the professional, it is about creating a working
    environment that guarantees quality of care (and offers opportunities for improvement),
    for optimal digital support (reduction of administrative'
