    # Figure 6. Personal health environment.


    Starting 1 July 2020, citizens must be able to view their own data digitally (online
    inspection: Personal Health Environment). Both clinical and patient-reported information
    are available within a personal health environment. For feedback, information
    at the level of the client is compared with information from comparable clients
    (patients like me) (Zorginstituut 2018a). Experience with the use of outcome information
    is still limited (Jeninga and Woldendorp 2019).


    It is not clear whether the date of July 1, 2020 will be met. Digital support
    is essential in the director''s role of clients:


    +   - Insight into lifestyle consequences

    +   - Personalization of health and care

    +   - Possibility of prevention


    Blockchain will have a major influence on how we share information and execute
    transactions. Blockchain technology is the ability to create and exchange unique
    digital records without requiring a centralized, trusted party (Schwab 2018: 87).
    Blockchain requires a network: this not only means a change in one''s own business
    model, but also in that of the partners. Blockchain is a shared and unchanging
    management of facts and'
