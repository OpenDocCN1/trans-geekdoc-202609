- pgno: 226
  md: '+   Care is regenerative: a focus on restoring or maintaining functions in
    vulnerable circumstances.


    The starting point for employees is to enter into a daily dialogue with clients
    and their families about how to shape the support in such a way that life retains
    the meaning that the elderly person and his or her family want to give it. The
    individual quality of life is therefore the guideline of the professionals’ actions.The
    target group of De Hoven can only give a very limited interpretation to a directing
    function. The aim is to connect closely with the living environment of residents
    based on this. There is an attempt to gain insight into the values that a client
    uses by entering into conversations as openly as possible.


    The VVT institution De Hoven is one of the institutions that participated in the
    low-control care experiment. Two central insights emerged from the evaluation
    of institutions with low control (Eindevaluatie 2016):


    +   Value-driven work promotes the quality of care: starting with good care for
    the client changes the way the organization works (at all levels) and how this
    work is experienced by professionals.


    +   By focusing on the care relationship between client and professional, it became
    clear which rules are an obstacle to making good care central.


    The client and the professional are the centre of the care process. The starting
    point of the experiments was to reshape care based on this relationship. Clients
    gain more control, and professionals facilitate clients retaining as much control
    as possible over their own lives (2016, 9). This way of working requires reflection
    on one’s own professional actions. However, that is not easy for a number of levels
    within healthcare. In addition to cognitively focused reflection methods, it is
    also important to develop other forms of reflection.


    The narrative perspective is central in this context (Slaets 2017). In practice,
    narrative stands for telling, using the conversation as a bridge to the other.
    A conversation is an exchange of narrative, personal and relational. It requires
    being present, a presence. This framework requires two-way traffic and an open
    and investigative attitude. An important aspect of this is the realization that
    granting people directorship does not mean that everyone can do something with
    it. Many residents cannot arrange their own lives. It is precisely this fact that
    makes it important that effort is made to direct one’s own life.


    In that sense, the conversation and the narrative are essential for the quality
    of life and therefore also for the quality of care. This framework is not about
    needs but about desires, about positive well-being. The desire is not told and
    heard when completing questionnaires but becomes known and tangible in the relationship
    (Slaets 2017). A point'
