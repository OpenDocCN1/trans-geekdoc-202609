    # 11.3.1 Data


    Every learning technique is based upon data. A data set is employed to impart
    training to the machine system. Data sets are gathered by people for training.
    The data set may be of very large size. Machine control systems gather data using
    sensors from the system operation. It employs the data to recognise the parameters
    or train the machine system.


    # 11.3.2 Models


    Models are usually employed in the machine learning systems. The models provide
    the mathematical framework for the machine learning systems. A model is made by
    a person. It depends upon the human observations and their experiences. For instance,
    a model of bus of length 1 and width 1 looking from the top is a rectangular shape
    with the size of a standard parking slot. Models are often considered as man-made
    to give a framework to machine learning. But sometimes machine learning developed
    its models without any machine-structure.


    # 11.3.3 Training


    The machine learning system relates input data to an output. It is required training
    to perform this work. Similar to the machine needs training to do the tasks, the
    machine also needs learning systems for their training. Training is provided by
    feeding the machine system with a known input and the corresponding known output
    to change the models or data in the relationship for learning. Sometimes, it is
    similar to the curve fitting technique or the regression technique. By having
    sufficient training data, the machine system gains the ability to generate correct
    outputs corresponding to new inputs. For instance, feeding thousands of rat images
    to the face recognition system, the images are generated to be of rats. Now, by
    giving rat images, the machine system will be able to identify these as rats.
    If enough training data sets or the training data in terms of quantity or variety
    is not provided, it may face a problem in identifying the rats.'
