  md: '# Machine Learning for Risk Analysis


    first of all accepting them (Paltrineri, 2019). Risk management is done on the
    basis of priority, which means the risk with highest probability of occurrence
    or the risk that can cause maximum amount of damage needs to be dealt with first
    and the risks that are expected to cause lower loss are prioritized in the descending
    order. Hence, a classification of the risks needs to be done on the basis of loss
    and probability.


    Generally, the amount of loss is given more priority than the frequency of its
    occurrence. It is the most important step because if the risks are not managed
    properly, then there is no point in identifying and assessing them. The unmanaged
    reduces the rate of profit, durability, quality, and reliability of the project.
    It can also affect the brand value of a company and decrease the trust of users.
    The problem or limitation faced by this phase is the limited amount of technique
    and resources available to manage the hazards and the increase in cost due to
    risk management. The steps required in risk management are:


    +   (i) Identification of the risk and its resource and domain

    (ii) Considering the impact of this on the system

    (iii) Probability of occurrence

    (iv) Impact on effective cost

    (v) Consequences on the project

    (vi) Classification on the basis of priority

    (vii) Assessing the constraints that can be faced

    (viii) Describing the needs of users and agenda for doing this activity

    (ix) Engaging in discussions and communication to decide the managing technique

    (x) Finally, developing an analytical approach in order to manage the risk

    (xi) Organizing the resources and cost required for the managing process


    Thus, risk management is done on the basis of results obtained from risk assessment
    and the appropriate techniques are chosen by managers.


