    # 17.4 Research Gap and Objective of the Research


    From the literature review, it is found that less work has been done by taking
    the myocardial infarction dataset, which contains the 111 number of input parameters
    and with 12 outcome attributes (complications). It is very hard to establish the
    relationship between many attributes and then make the prediction for the outcomes.
    The methods, techniques, approaches and algorithms discussed in the literature
    review do not deal with the missing values in the dataset and give low accuracy
    and performance when dealing with the missing values. Also, the algorithms generally
    take longer to train the model, which is not good.


    The main objective of this research is to make a model that solves the above three
    problems. The model should be able to work on a large number of input attributes
    as well as the perform low on the dataset that contains missing values. The model
    should take less time to train on the dataset and with the least number of epochs,
    the model should give high performance.


    # 17.5 Data Collection


    MI complications dataset are taken from UCI Machine Learning [7]. The dataset
    has 1,700 instances with 124 unique attributes, but it has a few missing values
    also (about 7.6 percent). Figure 17.2 shows the first 20 instances of the dataset
    with the first header as the name of the attributes each starting with a unique
    ID.


    Out of 124 attributes, the first column is specified for the patient''s ID, columns
    2–112 attributes are used as input data for prediction, and columns 113–124 attributes
    are to be predicted that are the possible outcomes (complications). The prediction
    is done for the time at the end of 72 h (72 h after admission to the hospital)
    and columns (2–112) are used as the input for prediction.


