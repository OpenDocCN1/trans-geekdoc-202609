- pgno: 32
  md: '# 2.1 Introduction


    Land cover refers to the surface cover of the ground, whether it is vegetation,
    water, or bare soil. In short, land cover indicates the physical type of the land
    (water, snow, grassland, soil). Land use refers to human activities that are directly
    related to the land (agricultural land, canal, built-up land, and other human-made
    characteristics). Together, they form a pattern called as land and land cover
    (LULC) pattern. This pattern is an outcome of socioeconomic and natural factors
    and their utilization by humans in time and space [1]. Land use and cover mapping
    is carried out to the land utilization pattern and future planning and management
    of the land resource to avoid economic loss due to natural factors or improve
    the ecological balance in the system. It is also used for planning and development
    of land parcel. The assessment of risks and the development of risk maps for future
    land use and infrastructure development. The change in land use cover (LULC) pattern
    is detected. This pattern is affected by floods that occur in a particular region.
    Floods can cause devastation to human lives, property, and possessions as well
    as disruptions in communications. Flood to occur when rainfall is high, absorption
    is low, and when overflows are not controllable. Some other factors for floods
    are unconditional rainfall, increase in the number of low-lying areas, rising
    sea level, poor sewage system, and low absorption capacity of soil. Using predictive
    analytics and remote sensing methods, floods can be predicted in advance, which
    will not only help in detecting imminent patterns but will also help us in preparing
    beforehand to tackle such situations and come up with proper contingency plans.
    We plan to model and predict future impacts as well as the rate of occurrence
    of floods using image processing and predictive analysis.


    Earlier, when no sensed data and computer assistance were available, land use/land
    cover were detected with the aid of tracing patterns and topographical sheets.
    But this method was tedious, inefficient, and inaccurate. Studying large areas
    required considerable amount of effort and time. Conventional methods used for
    land mapping are labor-intensive, time-consuming, and done less frequently [2].
    With the advent of satellite remote sensing techniques, which allow for collection
    of data over a variety of scales and resolutions, preparing accurate land use
    cover maps was feasible. Also, monitoring changes at regular intervals of time
    became relatively simpler. In case of an inaccessible region, the only method
    of acquiring required data is by applying this technique. Remote sensing and geographical
    information system (GIS) technology has enabled ecologists and natural resources
    managers to acquire timely data and observe periodical changes. Predicting floods
    in any location has remained a longstanding challenge, which plays a major role
    in emergency management.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Predictive Analysis for Flood Risk Mapping


    Remote sensing makes it easier to locate floods that have spread over a large
    region, thereby making it easier to plan rescue missions quickly. Also, remote
    sensing is a relatively cheap and efficient method compared to traditional methods.
    Predictive analytics offers a unique opportunity to identify trends and patterns
    that are used to identify future outcomes. Implementation of predictive mapping
    techniques became easier with the advent of predictive modeling techniques and
    their simple incorporation with other technologies. Thus, by combining remote
    sensing and predictive analytics, a model can be created that will help in the
    detection of floods in advance.


    High-definition satellite images can be integrated with socioeconomic data in
    order to build environmental, economic, and social threat prediction models. Using
    these models, one can build demand-driven applications to help public and private
    organizations understand, prepare, and respond to economic, social, and humanitarian
    losses in a timely manner. Such models can be used to make near-real-time remote
    sensing applications by adding additional layers of response tools, like alerts
    and orders. Ideally, these technologies would be scaled up from local to global
    for emergency management and risk management. Some of the benefits it can offer
    disaster reduction, event prediction for timely response and recovery, allowing
    stakeholders to better target investments and protect assets. With the help of
    this study, governments can formulate policies that are in the interest of the
    people and will also help us in attaining ecological stability.


    Among the cataclysmic events, floods are the most dangerous in causing severe
    harm to human life, foundation, farming, and the financial frameworks [1]. Flood
    risk analysis is undertaken to research land use and is also used in the planning
    and management of future land resources, which is done either to prevent economic
    loss due to natural causes or to enhance the system''s ecological balance. Using
    predictive analytics which will not only help in detecting imminent patterns but
    will also help us in preparing beforehand to tackle such situations and with proper
    contingency plans. Implementation of predictive mapping techniques became simpler
    with the advent of predictive modeling techniques and its simple incorporation
    with other technologies [1]. Robust and precise prediction significantly leads
    to water resource management strategies, policy recommendations and research,
    as well as further forecasting and evacuation. Governments are actually under
    pressure to set up dependable and precise maps of flood regions and further prepare
    for effective management of floods [1]. Governments will be able to devise suitable
    policies with the help of this study that are in people''s interest and will eventually
    help to achieve ecological stability.'
