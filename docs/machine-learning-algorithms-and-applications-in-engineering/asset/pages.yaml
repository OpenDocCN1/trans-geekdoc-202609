    # 9.7 Conclusion


    Recommender system (RS) is an application that helps users to select products
    from the internet. To reduce the damage of a shilling attack and maintain good
    quality of recommendation, the security of RSs is a significant issue. However,
    fake user profiles created by SA methods can be accurately detected by recent
    SA detection techniques. The ratting pattern of these SA techniques is different
    from real users. One of the most efficient ways for handling the problem of information
    overload, CFRs are very much'
