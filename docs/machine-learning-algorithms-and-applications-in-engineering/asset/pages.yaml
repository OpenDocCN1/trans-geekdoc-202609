- pgno: 19
  md: '# Machine Learning for Smart Health Care


    in the blood to estimate the source tissue of a tumor, measuring the stage of
    induction in the cell pathway by biopsies or other samples (Way and Greene 2018),
    applying magnetic resonance imaging to estimate genetic characteristics of brain
    tumors (P. Chang et al. 2018), and integrating imaging with omics to predict outcomes
    in cancer patients (Chaudhary et al. 2018; Mobadersny et al. 2018). ML could identify
    patients who are deprived of sleep by exploring blood mRNA, indicating the adverse
    effect of sleep (Laing et al. 2019). With the help of coordinated data from different
    sources and biomarkers, the ML models are promising to work more precisely than
    current techniques that are usually confused to a low set of biomarkers reflecting
    only limited insights of the complicated diseases.


    Cooperative human–machine diagnostic techniques, as shown in Figure 1.1, are promising
    for taking the advantages of both humans and machines where the health care provider
    could arrive at a diagnosis by combining all the accessed data including those
    generated by ML platforms (Ahuja 2019). Hence, ML could revolutionize diagnosis,
    labeling troublesome cases in need for further human intervention, and offering
    more valuable data to reach (Arida et al. 2019). Therefore, integrating knowledge
    from both health care experts and innovative algorithms would advance diagnoses.
    However, there is a need to evaluate the biologic utility of these functionalities.
    It is vital to control the transparency of ML applications via optimal goals,
    qualities, measurable functionalities, and constraints of certain algorithms and
    their verifying processes (Cal et al. 2019). Thus, assisting health care providers
    in applying ML programs to reach correct conclusions enhances decisionmaking.
    ML-based programs could grow confidence in the health care system, enabling more
    knowledge about the biologic pathways in illnesses (Ching et al. 2018).


    ML, coupled with more advances in techniques for clinical investigations, requires
    considering the balance between detection rates for diseases, patient outcomes,
    and distinct elements influencing health and quality of life. Applying ML techniques
    could elevate the rate of detecting diseases, and differentiating from minor diseases
    would be necessary to determine subgroups of diseases, choose highly effective
    therapies, and eliminate overtreatment. For ML to promote health care, thoughtfully
    formulating clinical objectives and the related testing and validation measures
    are required.


    # 1.2.2 Precision Health


    In precision health, a promising ML application, health care is customized as
    per the patient’s disease profile. In precision oncology, an initial model for
    ML in precision cancer, is managed according to the molecular features of the
    tumor. Lately, molecular biomarkers for a subject like the levels of gene expressions
    or physical transformations usually inform the choice'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Machine Learning Algorithms and Applications in Engineering


    of therapies, yet vary in epigenomic, genomic, and anatomic disease characteristics
    leads to largely different individual responses (Brown et al. 2019). The hundreds
    of likely medications and therapeutic regimens may not be suitable for all conditions
    (Knit et al. 2018).


    Multiscale predictive frameworks are promising ML techniques in dealing with subjective
    variability. For instance, single-purpose frameworks could predict the functioning
    outcomes of biologic alterations, like the effect of gene mutations on splicing
    and genetic expression (Xiong et al. 2015) and transcription element-binding (K.
    M. Chen et al. 2019). ML techniques could also forecast therapeutic response in
    cell lines (Y. Chang et al. 2018), translate forecasting to patient tumors (Chiu
    et al. 2019), and predict response to treatment clinical data on outcomes (Huang
    et al. 2018). Upcoming innovations in modeling for precision medicine are promising
    for the work on several dimensions for severe needs. Multiscale modeling would
    use biologic data to analyze an organism growing through unique aspects of time
    and space. Now there are digital frameworks of human-virus interplay (Lasso et
    al. 2019), cell-to-cell interactions between tumor cells and immune cells, or
    the entire cells (Metzcar et al. 2019). Hence, digital frameworks of organs or
    even the whole organism, known as digital twins (Björnsson et al. 2019), hold
    the potential for future they could forecast the potency of various medication
    mixtures, which have never been tried in combination and model the effect of illnesses
    on various organs.


    However, some multifactorial frameworks would aid in precise predictions to be
    directly applied in therapy, and they might reach a mid-level where ML techniques
    create a graded roster of recommended treatments guiding skillful and qualified
    health care providers in decision-making. For example, patient-centered laboratory
    frameworks could test predictions from digital models and suggest the best-functioning
    ones for therapy. Such a hybrid technique is promising where ML frameworks could
    significantly limit the likely therapeutic combinations to be regarded and determine
    those to be disregarded. An experimental verifying stage could lend more proof
    to the potential effectiveness of the predicted treatments.


    Applying ML in digitally searching and mining knowledge in patients’ datasets
    and publications would advance precision health (Rajkumar et al. 2019). Patient
    datasets, often found in the EHRs, are a wealthy resource for data on diagnosis,
    therapies, and responses for vast sets of patients. Previous attempts to apply
    the algorithms of natural language processing for mining published literature
    (Dong et al. 2018), EHRs (Shickel et al. 2018), and medical notes (Kreimer et
    al. 2017) yielded interesting information about relations between biologic mechanisms
    and biomarker-based treatment or using structured EHRs data to forecast the onset
    of disease (Artzi et al. 2020). ML could leverage such knowledge for applications
    in precision health via superior techniques, which could handle EHRs and published
    works of'
