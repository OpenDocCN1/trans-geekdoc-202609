  md: '# 18.3 Implementation


    # 18.3.1 Self-Supervised Learning


    Self-supervised learning method is used labeled data to train computers to do
    tasks without the need to provide labeled data manually (Figure 18.1). It is a
    subset of un-supervised learning where results are derived by information labeling,
    categorizing, and finally analyzing it. The conclusions are drawn by the machine
    itself on the base of connections and correlations. The system learns and attains
    the capability to know the different parts of any object by encoding it, so that
    recognition can be done from any angle. Only then can the object be classified
    correctly and provide context for analysis to come up with the desired output.


    # 18.3.2 Contrastive Learning


    Contrastive learning is a method used for finding similar and dissimilar things
    by training a ML model to learn classification between similar and dissimilar
    images (Figure 18.2). Contrastive learning contrasts positive pairs against negative
    pairs and learns representations. This method of learning


