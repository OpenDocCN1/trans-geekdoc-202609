    # 12.3 Contributions


    The privacy-preserving data publishing models should protect the microdata with
    high privacy and less information loss. Though various algorithms have been proposed
    to balance privacy and utility, the challenge remains unsolved. The significant
    contributions of the work are as follows:


    +   (1) A detailed study has been accomplished on various privacy-preserving data
    publishing models of the 1:M dataset.

    (2) The anonymization is performed on the original microdata to partition it into
    two tables.

    (3) The quasi-identifier and the sensitive attributes in the microdata are carefully
    chosen and the distribution of the quasi-identifier is computed.

    (4) The generalization process of quasi-identifier and allocation of batch id
    is done using the CBPP algorithm.


    # 12.4 Correlation Attacks and Those Scenarios


    The proposed algorithm can resist three correlation attacks: (i) background correlation
    attack, (ii) quasi-identifier correlation attack and (iii) non-membership correlation
    attack. Each correlation attack is discussed with a scenario.


    +   (1) Attacks using background knowledge correlation: The intruder can infer
    the sensitive attributes of an individual if he possesses significant background
    knowledge about the individual. Case scenario 1 explains the background knowledge
    correlation attacks.'
