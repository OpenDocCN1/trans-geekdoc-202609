    # 9.3 Shilling Attack Detection


    To reduce the effect of shilling attacks (SAs) in CFRs, there are two common techniques
    (Si and Li 2020). One technique is SA detection and other technique before running
    CF algorithms excludes the attack profiles from the rating information. Several
    schemas are proposed to find such SAs. Another approach is to develop attack-resistant
    CF algorithm. The SA identification algorithms will be classified as follows:
    supervised classification techniques, unsupervised clustering techniques, semi-supervised
    techniques, and other techniques.


