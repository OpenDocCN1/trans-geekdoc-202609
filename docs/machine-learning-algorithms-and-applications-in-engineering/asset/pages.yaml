- pgno: 149
  md: '# Accurate Automatic Function Recognition of Proteins


    underlying amino acid chain itself (Kulmanov et al., 2018), three-dimensional
    structure (Yang et al., 2015), binding properties, structural flexibility (Peled
    et al., 2016), protein-protein interaction networks (Kulmanov et al., 2018) or
    other molecular and functional factors (Rivarola). Although not directly, these
    methods may be partially dependent on protein databases with a known function.
    Such methodologies rely on supervised machine learning models and can find significant
    correlations between characteristics and functions.


    From a computational perspective, the prediction of protein function can be considered
    as a multi-label classification problem (Toumakas and Katakis, 2007). In the traditional
    classification learning models, each instance is associated with only one class.
    However, multi-label classification models each instance can be associated with
    more than one class at the same time, which makes multi-label problems more complex
    and different from their single-class equivalents, whether binary or multiple.


    Formally, a multi-label problem is defined as (Spolaor et al., 2013) let $D$ be
    a data set composed of $N$ examples $(x,Y),n=1...N$. Each instance $E_i$ is associated
    with a feature vector $x=(x^1,x^2,...,x^M)$ described by $M$ features $x=1...M$,
    and a subset of labels $Y\subseteq L$, where $L=(y_1,y_2,...,y_M)$. In this scenario,
    the multi-label classification task consists of generating a classifier $H$, which,
    given an unseen instance $E=(x,?)$, is capable of accurately predicting its subset
    of labels $Y$, i.e., $H(E)\to Y$.


    The multi-label problems are more complex and different than their single-class
    equivalents, whether binary or multiple. The enormous scale of the problem highly
    complicates any data-driven approach that aims to address it. Table 8.1 shows
    the features of the data sets employed for one of the highest performance methods
    (Kulmanov et al., 2018) currently available.


    At the same time, it should be considered the scenario that arises when dealing
    with the integration of information from different and heterogeneous sources,
    in which it is necessary to deal with various biological data (sequence, structure,
    interactions, etc.). Moreover, a good volume of data is not yet available for
    most species. That makes the learning process of models with the sequences of
    one species complicated to apply when it comes to making inferences about others.
