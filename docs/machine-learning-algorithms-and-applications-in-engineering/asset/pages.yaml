  md: '# 4.1 Introduction


    Machine learning is expected to play a vital role in the upcoming industry revolution.
    The evolution of ML and AI has great implications for the development of electric
    vehicles in various means. Battery performance can make or break the electric
    vehicle experience, from driving range to charging time to the lifetime of the
    car. Now, artificial intelligence has made dreams like recharging an EV in the
    time it takes to stop at a gas station much likely reality and could help improve
    other aspects of battery technology.


    For decades, advances in electric vehicle batteries have been limited by a major
    bottleneck: evaluation times. At every stage of the battery development process,
    new technologies must be tested for months or years to determine how long they
    will last. But now, a team led by Stanford professors Stefano Ermon and William
    Chue developed a machine learning-based method that slashes these testing times
    by 98 percent. Although the group tested them on battery charge speed, they said
    it can be applied to numerous other parts of the battery development pipeline
    and even to nonenergy technologies.


    > In battery testing, you have to try a massive number of things, because the
    performance you vary drastically, said Ermon, an assistant professor of computer
    science. With AI, we’re able to quickly identify the promising approaches and
    cut out a lot of unnecessary experiments.


    # 4.1.1 Artificial Intelligence Technology to Enhance EV Production and Support
    the Deployment of Electric Vehicles


    Electric vehicles reduce tailpipe emissions from the transportation sector and
    produce important public health benefits. One of the most important assets for
    EV adoption is charging station infrastructure.


    While we initially thought that the availability of real-time transactions from
    charging stations would be a primary innovation for this research, we quickly
    realized that we also had an enormous quantity of unstructured text to learn about
    how EV users engage with each other. Surprisingly until this point, the best evidence
    on EV consumer behavior typically relied on surveys or simulated data, and these
    were limited to a single market or region. We understood that data from multiple
    platforms offered a unique ability to aggregate large-scale evidence in ways not
    previously possible.


    What was most exciting for our research team was the fact that the data was streaming
    and offered the potential to update in real-time. This is in stark contrast to
    data collection from large government surveys, which take several years to complete,
    and data discovery is slow and expensive. So, we set off to see if we could analyze
    both government-run and privately EV charging stations to provide national, evidence-based
    analysis.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Machine Learning Techniques Enabled Electric Vehicle


    Given the quantity of data however, a major challenge for the team was the fact
    that it would take human experts about 32 weeks to sift through EV user reviews
    in order to extract useful insights from free text.


    So, almost on the side, we started experimenting with deep natural language processing
    techniques to unlock some insights. It turned out that the review data was an
    untapped source of research innovation for. We quickly realized that the application
    of AI/ML to this data could accelerate policy analysis and reduce science and
    technology (S&T) research evaluation costs.


    Consistently, by deploying deep learning techniques to analyze those EV user reviews,
    we were able to show how machine learning tools could be used to quickly analyze
    policy for evaluation in real time and provide new insight into important electric
    vehicle charging infrastructure policies, as the need to focus on the quality
    of the user experience and evidence supporting public involvement in EV charging
    network buildout.


    By displacing gasoline and diesel fuels, electric cars and fleets reduce emissions
    from the transportation sector, offering important public health benefits. However,
    public confidence in the reliability of charging infrastructure remains a fundamental
    barrier to adoption. Using large-scale social data and machine learning from 12,270
    electric vehicle (EV) charging stations, we provide national evidence on how well
    the existing charging infrastructure is serving the needs of the rapidly expanding
    population of EV drivers in 651 core-based statistical areas in the United States.
    We deploy supervised machine learning algorithms to automatically classify unstructured
    text generated by EV users. Extracting behavioral insights at a population scale
    has been challenging given that streaming data can be costly to classify. Using
    computational approaches, we reduce processing times for research evaluation from
    weeks of human processing to just minutes of computation. Contrary to theoretical
    predictions, we find that stations at public charging locations do not outperform
    public charging locations provided by the government. Overall, nearly half of
    the charging stations in the early growth years of public charging infrastructure,
    a problem that needs to be fixed as the market for electrified and sustainable
    transportation expands.


    The study, published by Nature on February 19, 2020, was part of a large collaboration
    among scientists from Stanford, Massachusetts Institute of Technology (MIT), and
    the Toyota Research Institute that brings foundational academic research and real-world
    industry applications. The goal: finding the best method for charging an EV battery
    in 10 minutes that maximizes the battery’s overall lifetime. The researchers wrote
    a program that, based on only a few charging cycles, predicted how batteries would
    respond to different charging approaches. The software also decided in real time
    what charging approaches to focus on or ignore. By reducing both the'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Machine Learning Algorithms and Applications in Engineering


    length and number of trials, the researchers cut the testing process from almost
    two years to 16 days.


    # 4.1.2 Artificial Intelligence Used to Supercharge Development for Electric Vehicles


    Battery performance can make or break the electric vehicle experience, from driving
    range to charging the lifetime of the car. Now, artificial intelligence has made
    recharging an EV in the time it takes to stop at a gas station a more likely reality
    and could improve other aspects of battery technology.


    For decades, advances in electric vehicle batteries have been limited by a bottleneck:
    evaluation times. At every stage of the battery development process, new technologies
    will be tested for months or years to determine how long they will last. Now,
    a team led by Stefano Ermon and William Chang developed a learning-based method
    that slashes these testing times by 98 percent. Although the group tested their
    method on battery charge speed, they said it can be applied to numerous other
    parts of the battery development pipeline and even to nonenergy technologies.


    "In testing, you have to try a massive number of things, because the performance
    you get very drastically," said Ermon, an assistant professor of computer science.
    "With AI, we are able to quickly identify the promising approaches and cut out
    a lot of unnecessary experiments."


    # 4.1.3 A Smarter Approach to Battery Testing


    Designing ultrafast-charging batteries is a major challenge, mainly because it
    is difficult to make them last. The intensity of the faster charger puts strain
    on the battery, which often causes it to fail. To prevent this damage to the battery
    pack, a component that accounts for a large chunk of an electric car''s total
    cost, battery engineers must test an exhaustive series of charging methods to
    find the one that works best.


    The new research sought to optimize this process. At the outset, the team saw
    that fast-charging optimization accounted for many trial-and-error tests—something
    that is inefficient for humans, but the perfect problem for a machine.


    "Machine learning is trial-and-error, but in a smarter way," said Aditya Grover,
    a graduate student in computer science who co-led the study. "Computers are far
    better than us at figuring out when to explore—new'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Machine Learning Techniques Enabled Electric Vehicle


    and different approaches—and when to exploit, zero in, on the most prom-ising
    ones.


    The team used this power to their advantage in two key ways. First, they used
    it to reduce the time per cycling experiment. In a previous study, the researchers
    found that instead of charging and recharging every battery until it failed—the
    usual way of testing a battery’s lifetime—they could predict how long a battery
    would last only its first 100 charging cycles. This is because the machine learning
    system, after being trained on a few batteries cycled to failure, could find patterns
    in the early data that presaged how a battery would last.


    Second, machine learning reduced the number of methods they had to test. Instead
    of testing every possible charging method equally, or relying on intuition, the
    computer learned from its experiences to quickly find the best protocols to test.


    By testing fewer methods for fewer cycles, the study’s authors quickly found an
    optimal ultra-fast charging protocol for their battery. In addition to dramatically
    speeding the testing process, the computer’s solution was also better—and more
    unusual—than what a scientist would have devised, said Ermon.


    > "It gave us this surprisingly simple charging protocol—something we didn’t expect,"
    said Ermon. Instead of charging at highest current at the beginning of the charge,
    the algorithm’s solution uses the highest current in the middle of the charge.
    That’s the difference between a human and a machine. The machine is not biased
    by human intuition, which is powerful but sometimes misleading."


    # 4.1.4 Wider Applications


    The researchers said their approach could accelerate nearly every piece of the
    battery development pipeline: from designing the chemistry of a battery to determining
    its size and shape, to finding better systems for manufac-uring and storage. This
    would have broad implications not only for electric vehicles but for other types
