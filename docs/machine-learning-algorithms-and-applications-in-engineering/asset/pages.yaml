  md: 'vulnerable to numerous shilling attacks due to insertion of variety of malicious
    user profiles in the system, which effects the user recommendations. In this chapter,
    at first the profile injection attack technique, collaborative filtering in recommender
    systems and shilling attack detection scheme have been discussed. Second, the
    shilling attack detection techniques have been classified based on the two parameters,
    namely, rating parameter and time interval on which they work. The shilling attack
    detection techniques have also been classified based on their output algorithms
    like attack profiles detection, attack items detection and attack profiles, and
    attack items detection. Each of the shilling attack detection techniques have
    been discussed in brief. The techniques are analyzed and their advantages and
    disadvantages compared.


    # 9.7.1 Future Direction


    The future directions are working on the shortcomings of these shilling attack
    detection techniques. Just like in case of dynamic time interval segmentation
    technique, the detection performance against target shifting attack requires to
    be enhanced. A shortcoming of data tracking technique is that it is not applicable
    on distributed system to handle giant data. The problem with HHT-SVM is, when
    new kinds of attacks are conducted, it becomes difficult to detect attack profiles.
    SVM also requires being re-trained offline. Overcoming these problems are the
    future directions.


