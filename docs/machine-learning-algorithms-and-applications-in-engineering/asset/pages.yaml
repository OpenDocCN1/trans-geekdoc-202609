    The algorithm has been divided into two parts and each part is elaborated. In
    algorithm 1, the original data set is passed as an input argument in line 1. Line
    2, the multi-records of an individual are merged using the group function such
    that each individual has only one entry. In line 3, anonymization has been performed
    to partition the original table T into two tables: (a) quasi-identifiers (Qi)
    and (b) sensitive attribute table (Sa). In line 4, the quasi-identifier is identified
    as sex, age, and zip code. The new list for age and zip code are created in lines
    5 and 6. In line 7, a new list has been created for batch ID. If the value for
    age ranges from 15 to 60, the optimal number of distributions is 3, that is, 15-24,
    25-44, and 45-60. From lines 8 to 10, the quasi-identifier has been generalized.
    For example, if the person''s age is 23, the value 15-24 will be assigned to batch.
    Similarly, in lines 11-13, the quasi-identifier zip code, distributions are formed
    and values are appended into the zip code list in lines 14 and 15. In the sample
    data set of the work, the zip code ranges from 13000 to 15000. So, in Table 12.3,
    the distribution of zip code ranges to 15000 for all the individuals. According
    to the algorithm, the total number of batch id combinations possible is 2^3*3+3=24,
    whereas the original data set of the work has the total number of batch id combinations
    possible as 2^3+1=9.


    In algorithm 2, sensitive attributes are arranged according to the batch id and
    the quasi-identifier that have been used. In line 1, the anonymized sensitive
    attribute has been passed as an argument. From lines 2 to 4, three lists of each
    sensitive attribute have been created. Specifically, three lists are created because
    the number of distributions that have been made in the quasi-identifiers is 3
    and quasi-identifier return to batch id. In line 5, iterate the values according
