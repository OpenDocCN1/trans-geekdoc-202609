    random decision forests create a large number of decision trees at the training
    time. In case of classification tasks, the class selected by most of the trees
    is the output of the random forest. Whereas in case of regression, the average
    prediction of individual tree is the output. The purpose of using the concept
    of random forest in the NDF is to reduce overfitting to the training dataset.
    The deep neural decision forest (deep NDF) technique becomes the bridge between
    classification trees and the representation learning approach by training them
    in an end-to-end manner. Here, the concept of differentiable and the stochastic
    decision tree model comes into play. It propagates the representation learning
    organized in the initial layers of a (deep) CNN.


    The deep NDF is the large number of interconnected decision trees, each of which
    makes a prediction for the given sample input and the average of all these predictions
    is made to get the random forest. Figure 17.1 shows the architecture of a single
    neural decision tree. In other words, it can be said that random forest uses a
    divide and conquer policy and has a simple model with very high performance.


    In the model, there are a number of neural decision trees that are trained at
    the same time. The average output of the trees is calculated as the final output
    of the NDF.


    NDF consists of many neural decision trees in which each tree has to learn two
    types of weights, "pi" and "decision_fn". "pi" represents the probability distribution
    of the classes that are present in the tree leaves, whereas "decision_fn" represents
    the probability of going to each leaf node. There are four steps in the working
    of the neural decision tree. In the first step, the model takes the input features
    in the form of a single vector containing all the features of an instance in the
    batch. This vector is generated with the help of CNN. In the second step, the
    model randomly selects a subset of'
