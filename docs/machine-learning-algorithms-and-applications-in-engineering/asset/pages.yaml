    # 11.2 Conclusions


    In this chapter, the quality of a product in terms of minimum shrinkage ratio
    produced by selective laser sintering is predicted from important SLS parameters
    such as surrounding working temperature, laser scanning speed, layer thickness,
    scanning mode, hatch distance, laser power and interval time. The relationship
    among SLS parameters with contraction ratio is modelled using the deep neural
    network because the SLS variables are considered to be multitudinous as well nonlinear.
    In this chapter, the machine learning system employed supervised deep learning
    including process parameters as input characteristics and the quality of a product
    in terms of minimum shrinkage ratio as output characteristic. Weight decay and
    the dropout technique were employed to overcome the overfitting problem found
    in deep neural network technique. The predicted characteristic was compared to
    the actual characteristic. The shrinkage ratio found by the deep neural network
    can be employed to determine information for shrinkage compensation in the SLS
    process.'
