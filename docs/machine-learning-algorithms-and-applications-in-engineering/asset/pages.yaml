    # 12.8 Measurement of Information Loss


    # 12.8.1 Query Accuracy


    Since the information loss needs to be measured from both the tables, (i) quasi-identifier
    and (ii) sensitive attribute, usual methods of utility measurement cannot be performed.
    Hence, we use query accuracy for the calculation utility of the algorithm. The
    query accuracy measures the information loss with the result of aggregate queries.


    > Query Error = \frac{\sum(QI) - \sum(Org)}{\text{count(Org)}} (12.1)


    The query error measures the COUNT queries executed on the micro-table data set
    and original data for measuring information loss. In this case, the total number
    of batch ID combinations is 9. Out of these, only one particular combination is
    the that links the quasi-identifier table and the sensitive batch table. Hence,
    batch id is the first line of protection. The probability that the attacker finds
    the perfect combination 1/9 = 0.11, which is very low. The combinations of batch
    id can be increased by more distributions in age and sex, further decreasing the
    probability of identifying the batch id. In Figure 12.3, it is clearly shown that
    information loss is inversely proportional to the number of values. However, in
    k-anonymity, information loss increases as the dimensionality increases [18],
    as shown in Figure 12.3. The CBPP algorithm provides better utility when compared
    with the traditional method, k-anonymity.


    Consider that, in some cases, the attacker can get through the batch ID. Then
    the intruder further has to make proper combinations of all the shuffled'
