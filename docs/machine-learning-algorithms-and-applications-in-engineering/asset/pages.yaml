  md: '# The Editors


    Prasenjit Chatterjee is currently the Dean (Research and Consultancy) at MCKV
    Institute of Engineering, West Bengal, India. He has published over 120 research
    papers in various international journals and peer-reviewed conferences. He has
    authored and edited more than 22 books on intelligent decision-making, supply
    chain management, optimization techniques, risk and sustainability modeling. He
    has received numerous awards including Best Track Paper Award, Outstanding Reviewer
    Award, Best Paper Award, Outstanding Researcher Award, and university gold medal.
    Chatterjee is the Editor-in-Chief of the Journal of Decision Analytics and Intelligent
    Computing. He has also been the guest editor of several special issues in different
    SCI/ Scopus / ESCI (Clarivate Analytics) indexed journals in Engineering He is
    also the Lead Series Editor of "Smart and Intelligent Science" (Chapman and Hall
