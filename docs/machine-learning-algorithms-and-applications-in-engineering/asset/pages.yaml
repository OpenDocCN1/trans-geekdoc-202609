  img_proc: true
- pgno: 134
  md: '# Machine Learning Algorithms and Applications in Engineering


    (iii) Machine learning algorithms: Machine learning algorithms, which are used
    in this study, are explained below.


    A. K-Nearest neighbors (KNN): It calculates the distance between the test data
    point and all the training data points using Euclidean distance formula to check
    the K nearest neighbors'' classes and of the k nearest classes will be returned.


    Euclidean distance: $\sqrt{(X_1-Y_1)^2 + (X_2-Y_2)^2 + \dots + (X_n-Y_n)^2}$


    B. Linear regression: It models a relationship between independent variables and
    the dependent variable (predictor variable) using a gradient descent approach.
    After modeling, it can be used to predict the value for a given data. Let''s suppose
    $X_1, X_2 ... X_n$ are the independent variables and Y is the probability of a
    dependent variable. Linear regression calculates the weights for each independent
    variable and returns an equation.


    $\hat{Y} = \alpha + \beta_1 + X_1 + \beta_2 + X_2 + \dots + \beta_n + X_n$


    The weights will be calculated using cost function and gradient descent approach.

    Cost function:


    $cost(\hat{Y}, Y) = \frac{1}{2}(\hat{Y}, Y)^2$


    $J(\beta) = \sum_{i=1}^{n} cost(\hat{Y}_i, Y)$


    $J(\beta)$ function will be plotted in a $(n+1)$ dimensional plane to find the
    local minimum, that is, to find the values of the weights at which this cost function
    is minimum. These values will be used for predictions.


    C. Logistic regression: It uses the sigmoid function to reduce the range of values
    predicted in linear regression to [0,1]. The output of the sigmoid function is
    the probability of a data classifying the class mapped to value 1.


    Sigmoid function: $\sigma(\hat{Y}) = \frac{1}{1+e^{-\hat{Y}}}$


    Probability that the output is 1: $p(Y=1 | X) = \sigma(\hat{Y})$


    Probability that the output is 0: $p(Y=0 | X) = 1 - \sigma(\hat{Y})$'
