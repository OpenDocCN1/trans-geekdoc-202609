  md: '# Machine Learning Algorithms and Applications in Engineering


    F. Random forest classification: It creates n different data sets from the training
    data set and creates a decision tree for each data set. N can be changed manually.
    Each decision tree will classify the class for the given test data and the mode
    of the n decision trees will be given as output.


    # 7.2.1 Evaluation of Machine Learning Models


    The metrics we can use to evaluate a machine learning model are accuracy, confusion
    matrix, logarithmic loss, mean absolute error, mean squared error, precision,
    and recall. Accuracy is defined as the percentage of correct predictions for the
    test data. It can be easily by dividing the number of correct classifications
    by the number of total numbers of testing data. Precision is defined as the fraction
    of relevant elements (true positives) among all the examples that were predicted
    to belong to a certain class. The recall is defined as the fraction of examples
    that were predicted to belong to a class with respect to all of the examples that
    truly belong in the class. The confusion matrix returns us a matrix, which can
    be used to describe the performance of a model. The confusion matrix gives the
    best results in the case of two-class classification problems. The logarithmic
    loss will be more useful in the case of multiclass classification problems. Accuracy
    works only if there are an equal number of samples for each class. F1 score gives
    a balance between precision and recall. F1 score can also be used to evaluate
    ml models.


    # 7.2.2 Data Description


    The data that is used in the current study for classifying breast cancer contains
    data of 570 patients of Wisconsin hospital with 32 attributes. The attributes
    information is given below.


    ID number, and Diagnosis (M = malignant, B = benign) are the general attributes.


    Ten real-valued attributes are considered and given as follows: (a) radius (mean
    of distances from center to points on the perimeter), (b) texture (standard deviation
    of gray-scale values), (c) perimeter, (d) area, (e) smoothness (local variation
    in radius lengths), (f) compactness (perimeter^2 / area - 1.0), (g) concavity
    (severity of concave portions of the contour), (h) concave points (number of concave
    portions of the contour), (i) symmetry, and (j) fractal dimension (“coastline
