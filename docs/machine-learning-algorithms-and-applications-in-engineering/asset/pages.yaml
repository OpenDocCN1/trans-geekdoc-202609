    # 11.5.3 K-fold-Cross-validation for Training the Deep Neural Networks


    In order to train the deep neural network model, the data set is to be divided
    into two parts: training data set and test data set. The data set for training
    has a known output data. The deep neural network model gains learning from this
    to other data. The data set for test is employed to check the prediction accuracy
    of the deep neural work model. But it is very difficult to divide the data set
    to represent the required problem characteristics. Further, on division of the
    existing set of data into validation and training sets, the data set decreases
    considerably the number of sample of data for use learning of the model. This
    is dependent upon a specific random selection of both sets. So, $k$-fold cross-validation
    is employed to solve problem specified here. For $k$-fold cross-validation, the
    given original data set is divided at random in $k$-equal size data set subsamples.
    Among $k$ subsets of the data sample, one single subsample of data is marked as
    data set for the validation to validate deep neural network model. Other $(k-1)$
    data subsets are employed for training. Considering every $k$ subsets of data
    set employed one time only on the testing data set for validation. Then, $k$ number
    of results obtained from the folds are taken to compute the average to create
    a single estimation[53]. The merit of $k$-fold technique is to employ all data
    sets to train and validate the deep neural network. Every data set is employed
    to validate one time only. In this chapter, the 10-fold cross-validation approach
    was employed for training


