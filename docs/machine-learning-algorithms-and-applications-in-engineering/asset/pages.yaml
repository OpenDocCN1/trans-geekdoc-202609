  md: "# 308 Machine Learning Algorithms and Applications in Engineering\n\n```\n\
    # Code for NL-Xent Loss function, explained in more detail in the article\ntau\
    \ = 0.05\ndef loss_function(a, b):\n    a_norm = torch.norm(a, dim=1).reshape(-1,\
    \ 1)\n    a_cap = torch.div(a, a_norm)\n    b_norm = torch.norm(b, dim=1).reshape(-1,\
    \ 1)\n    b_cap = torch.div(b, b_norm)\n    a_cap_b = torch.cat((a_cap, b_cap),\
    \ dim=0)\n    a_cap_b_transpose = torch.cat((a_cap_b, a_cap_b.transpose), dim=1)\n\
    \    sim = torch.mm(a_cap_b, a_cap_b_transpose)\n    sim_by_tau = torch.div(sim,\
    \ tau)\n    exp_by_tau = torch.exp(sim_by_tau)\n    sum_of_rows = torch.sum(exp_by_tau,\
    \ dim=1)\n    exp_sim_by_diag = exp_by_tau * torch.diag(sum_of_rows)\n    numerators\
    \ = exp_by_tau - exp_sim_by_diag\n    denominators = torch.sum(exp_by_tau, dim=1).unsqueeze(1)\
    \ - sum_of_rows\n    num_by_den = torch.div(numerators, denominators)\n    nelog_num_by_den\
    \ = torch.log(num_by_den)\n    return nelog_num_by_den\n```\n\nFIGURE 18.14\n\
    - Xent Loss function code.\n\n```\n# Boolean variable to control whether to train\
    \ the linear classifier or not\nLINEAR = True\n\nclass LinearNet(nn.Module):\n\
