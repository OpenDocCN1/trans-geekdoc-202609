    # 12.2 Related Works


    Earlier, the researchers were concentrating on privacy-preserving data publishing
    on a 1:1 dataset. An individual might have multiple records with different sensitive
    attributes called a 1:M dataset in the real world. Consider an individual who
    has cancer. A cancer disease comes with many effects such as weight loss, vomiting
    and hair loss. The same individual visits different doctors in the hospital to
    be treated. Each time he visits the hospital, a record is registered in the hospital
    database. Such a scenario leads to a 1:M dataset. When 1:1 privacy models are
    implemented on 1:M datasets, it leads to various privacy breaches. Several techniques
    have been proposed for a 1:1 dataset, such as slicing [5], Mondrian [6], suppression
    [7], clustering and multi-sensitive bucketization [8].


    Another method called (k, km)-anonymous [9] was proposed, which divided the attributes
    into relational and transactional attributes. The limitation of (k, km)-anonymous
    is if the information loss for the relational attribute is minimized, and vice-versa.
    An efficient approach (p,k)-anglicization, was proposed for the anonymization
    of multiple sensitive attributes. The (p,k)-anglicization provides the optimal
    balance between privacy and utility [10]. A novel method called slicing was proposed
    for privacy-preserving data publishing. Overlapping slicing was implemented with
    multiple sensitive attributes. Overlapping slicing has proven to provide better
    utility [11].


    The anatomization prevents generalization of quasi-identifiers, thus the information
    loss is significantly less and results in higher privacy. However, the anatomization
    method is efficient due to the publishing of multiple'
