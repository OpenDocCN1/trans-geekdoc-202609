  md: '# CBPP for Privacy-Preserving Data Publishing 203


    When traditional models and algorithms have been applied on the 1:M dataset, it
    may cause privacy breaches. Therefore, an efficient CBPP algorithm has been proposed
    to resist background knowledge attacks, nonmembership correlation attacks and
    quasi-identifier correlation attacks. CBPP algorithm partitions the original data
    set into two tables: the quasi-identifier table and the sensitive attribute table.
    Both are linked by a batch id, which is further explained.


    Consider the original sample dataset T^s in Table 12.1. it converts the original
    data set into two tables. the original dataset T^s consists of membership sensitive
    attributes for a particular individual and shares the same quasi-identifiers such
    as age, zip code, and gender. Patient ID is used for reference, and it will be
    removed during the publishing of data. The records having same patient id are
    merged. For example, the first three records of Table 12.1 with patient id 1 are
    merged (i.e., tp^1U1 tp^2U2 tp^3U3). After merging the records of an individual,
    an aggregated T^s is formed. Anatomization of the anonymized dataset T^s and partitions
    the data set into two tables: (1) quasi-identifier T^qi and (2) sensitive attribute
    T^s. The quasi-identifier attributes are (q^v^1, q^v^2, q^v^3). The quasi-identifier
    table T^qi comprises age, sex, and zip code.


    St^s be the set of sensitive attributes of T^s and the set of sensitive attributes
    are (s^v^1, s^v^2, s^v^3). The sensitive attributes are disease, treatment, symptom,
    doctor, and diagnostic method. The quasi-identifier attribute values are generalized
