    $s_1=\{y_1,y_2,y_3,y_4,y_5,y_6\}, s_2=\{y_6,y_7,y_8,y_9\}, s_3=\{y_{10},y_{11},y_{12},y_{13},y_{14},y_{15},y_{16},y_{17}\}$,
    and $s_4=\{y_{18},y_{19},y_{20}\}$, resulting from cut points $\hat{t}_1=6,\hat{t}_2=9$
    and $\hat{t}_3=17$.'
