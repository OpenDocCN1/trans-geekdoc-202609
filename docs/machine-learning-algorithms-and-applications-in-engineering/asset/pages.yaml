    # 1. Introduction


    Within the last 20 years, recommender systems have come out as one of the efficient
    techniques to deal with the knowledge, which is overloaded by suggestive information
    and it acquires potential interest to the online users. They are helpful to the
    businesses manufacturing merchandise as it increases the selling, cost-classes,
    and customers'' loyalty. As a result, customers tend to come back to the sites
    that serve their desires. The recommendation strategies are particularly categorized
    into three main prospects: (i) content-based recommendation, (ii) collaborative
    filtering, and (iii) hybrid recommendation approaches. Recommender system, particularly
    the collaborative filtering (CF)-based system, is introduced with suggestion to
    filter out irrelevant resources (Si and Li 2020, Sarwar et al. 2001). In the recommender
    systems, collaborative filtering recomm system (CFRS) is considered one of the
    most well-liked and productive techniques. CFRS works on the principle that identical
    users have identical tastes. However, collaborative filtering results in the source
    of strength and vulnerability for recommender systems due to its open and interactive
    nature. Generally, a user-based CA algorithm makes recommendation by searching
    out similar user patterns, which are illustrated by the preferences of numerous
    totally non-identical people (Si and Li 2020). If profiles contain biased information,
    they may be thought as real users and eventually lead to biased recommendations.
    Therefore, relevant data gets buried under a good deal of irrelevant information.
    Collective'
