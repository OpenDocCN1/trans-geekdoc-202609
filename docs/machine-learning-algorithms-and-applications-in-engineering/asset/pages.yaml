  md: '# Machine Learning Algorithms and Applications in Engineering


    # 5.2.4  Limitations and Challenges in Gesture Gradation or Categorization


    A gesture-detecting algorithm’s final gradation is to categorise the accumulated
    gestures into multiple categories, namely, supervised and unsupervised. Challenges
    occurring during this phase occur mainly during handling large data points like
    higher complexity data points, categorising ambiguous data sets into pre-defined
    classifications, identification of appropriate data sets that satisfy most of
    the data points, outlying data points and other limitations like handling ambiguous
    gestures [25]. Multiple challenges occur while implementing variegated classifiers
    and filters when classifying gestures. When implementing classifiers like dynamic
    time wrapping (DTW) classifier, paucity of high number of data sets and vocabulary
    size of the same create a limitation. For distance-distant algorithms like k-nearest
    neighbour, thereby increasing the computation complexity exponentially, depleting
    the overall performance of the algorithm. Like DTW algorithms, deep learning-based
    classification approaches also deplete the performance due to paucity of data
    sets and also require huge training or validation set to provide optimal performance.
    Primordial or classical methods of classification like finite-state machines have
    very rigid transform states and boundaries, which is a palpable limitation of.
    Cluster-based classifiers like k-means classification approach is predominantly
    dependent on the initial cluster and its attributes, also it is influenced negatively
    by the presence of classifiers. So choosing an appropriate value for ‘k’ is a
    cumbersome task. The similar issue of selecting optimal value is faced by sister
    classifiers known as support vector machine (SVM), where selecting appropriate
    kernel value becomes a daunting task. Moreover, SVM has other limitations like
    its high computation complexity, which increases the expenses, and being a binary
    classifier by nature, pairwise classification is required for handling multiple
    class classification as illustrated in Figure 5.1.


    ![](img/ad546abeb2fb65484cb3036468c406cd_92_0.png)


    FIGURE 5.1

    Limitations and Challenges in Gesture Gradation or Categorization are elaborated
    pictially.'
