- pgno: 135
  md: '# ML in Breast Cancer Classification


    If $\sigma(\hat{Y})$ is greater than or equals to 0.5, logistic regression returns
    1 as output, else returns 0 as output.


    +   Decision tree: A decision tree is a flowchart-like structure in which each
    internal node represents a "test" on an attribute (e.g., whether a coin flips
    up heads or tails), each branch represents the outcome of the test, and each leaf
    node represents a class label (decision taken after computing all attributes).
    The selection of an attribute is based on the entropy of the data and difference
    in the entropy after selecting an attribute.


    Entropy: The randomness of the data set. Here $p$ is the possibility of selecting
    a class while randomly picked from a data set:


    ```

    $Entropy = -p(\log(p)) - (1-p)(\log(1-p))$

    ```


    Information gain: The information gain is based on the decrease in entropy after
    a data set is split on an attribute. Constructing a decision tree is all about
    finding attribute that returns the highest information gain.


    ```

    $Information gain = E_1 - E_2$

    ```


    $E_1$ is entropy of data before splitting.


    $E_2$ is entropy of data after splitting.


    +   Support Vector Machines: A SVM is a discriminative classifier formally defined
    by a separating hyperplane. In other words, given labeled training data (supervised
    learning), the algorithm outputs an optimal hyperplane, which categorizes new
    examples. In two-dimensional space, this hyperplane is a line dividing a plane
    in two parts where in each class lay on either side.


    SVM uses different kernel functions to map the data into high dimensional plane,
    where Kernel functions used in SVM are the following:


    +   1. Polynomial function

    2. Sigmoid function

    3. Radial basis function


    ```

    $y(x) = \sum_{i=1}^{N} w_i \phi(||x - x_i||)$

    ```'
