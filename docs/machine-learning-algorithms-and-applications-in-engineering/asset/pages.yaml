  md: '# Machine Learning Algorithms and Applications in Engineering


    # 13.1 Introduction


    Nowadays, ISP networks are more complex than before, the number of applications
    that run on clients/servers are increasing leading to a network resource management
    problem. The IT professionals tasked with maintaining the network are facing serious
    challenges in determining which applications consume the resources or degrade
    network performance. Analyzing the performance metrics collected from clients/servers
    using traditional methods is not enough to make a correct decision whether an
    application consumes more network resources. The improvement of the network performance
    is not an easy task, and a network bandwidth upgrade might not be an optimal solution
    to solve the problem of high network utilization.


    In this study, taking advantage of machine learning, business intelligence and
    data analytics to compare and show the benefits of using techniques in analyzing
    the network performance metrics, performance metrics from a real ISP network are
    collected. A cleaned data with performance metrics will be analyzed to find the
    pattern and correlation to give a better understanding of the applications and
    network performance. The data set will be used to apply machine learning algorithms
    to predict future network performance under certain conditions. The implementation
    of these techniques in future will cut the cost of running a network and reduce
    investigation time when a problem occurs and make professional''s life much easier.


    Due to the COVID-19 situation, almost 100% workforce across organizations and
    various businesses were working from home/remotely. In heavy utilization of internet
    bandwidth at the ISP side. As a result, it''s critical for ISPs to understand
    and classify the many types of network traffic that pass through their network.
    Internet service providers can use this classification to successfully control
    the performance of their Internet lines and deliver a high-quality service to
    their consumers, leading to high customer satisfaction.


    Network traffic classification is also significant for network security and for
    determining intrusion detection, QoS, and other features. Forecasting internet
    demand would would greatly assist ISPs in planning their network resources. ISPs
    are interested in centralized measures and detecting problems with specific customers
    before they complain about the difficulties, and if possible, before the consumers
    discover the problems at all.


