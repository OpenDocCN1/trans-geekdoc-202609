- pgno: 147
  md: '# Accurate Automatic Functional Recognition of Proteins


    Netflix, the description of the functions of proteins tends to be structured in
    ontologies, with the purpose of facilitating and standardizing the use and exchange
    of concepts and knowledge, especially when faced with the problem of massively
    processing that information. An ontology is a formal definition of types, properties
    and relationships between entities that exist in a particular domain. In the case
    of proteins, the activity is described by using hierarchical structures such as
    acyclic graphs or trees. In all these representations, the nodes or terms describe
    particular activities, and the links represent relationships between the terms.
    There are different ontology projects and popular and widespread is the one developed
    by the Gene Ontology (GO) Consortium (Gene Ontology Consortium, 2019).


    The function of proteins may vary in time and space. For instance, alternative
    splicing (Zheng, 2016) is a well-studied and well-known mechanism in which, after
    transcription, different exons of the same genome sequence bind in different ways
    to produce distinct forms of proteins. Similarly, after translation, proteins
    may be split into functional groups or the chemical modification of various subgroups
    (residues) of amino acids can occur, changing their properties and, as a consequence,
    modifying the overall function of the protein. In total, more than four hundred
    post-translational and post-translational modification events are known, resulting
    in a wide range of possible forms of a protein, all from the same sequence of
    amino acids. Another widely known case is that of ''moonlighting'' or multifunctional
    proteins (Jeffery, 2018), proteins that can perform two different functions. Furthermore,
    as mentioned above, on occasions, proteins interact in groups to carry out separate
    biological processes. All this has practical implications for the identification
    and determination of protein functions, which means that this problem remains
    a significant challenge in the scientific community.


    # 8.2 Identifying the Protein Functions


    Functional annotation of proteins is the set of tasks involved in the process
    of identifying and assigning labels to the function of known proteins (or groups
    of them) in organisms. Traditionally, functional annotation was performed through
    vivo and in vitro experiments, being recorded in databases of biological sequences
    through a curation process based on the existing literature. However, these laboratory
    experiments and manual curation tasks, within a biological context of such complexity
    as described, were excessively hindered in terms of difficulty, inherent costs
    and time. Advances in technology have led to significant developments in the functional
    annotation of proteins, but at the same time to considerable growth in the size
    of biological databases.'
