  md: '# 15.1 Introduction


    Energy is essential for the economic development of any country. In the case of
    developing countries, the energy sector assumes critical importance given the
    ever-increasing energy needs requiring huge investments to maintain them. Electricity
    has forced our day-to-day and in industries, electricity provides power to large
    machines, which provide essential utilities and industrial and consumer products.
    Electricity provides the basis for the economic development of any country because
    a consistent and reliable power source creates a variety of businesses and job
    opportunities. It provides access to resources and information.


    Electricity is a secondary form of energy, because it''s generated from the conversion
    of energy produced from different sources such as renewable, for example, solar
    energy, hydro energy, onshore offshore energy, and nonrenewable such as coal,
    lignite, natural gases, and fossil fuels. It cannot be stored in large quantities
    due to its properties. Sometimes, there is a disbalance in the generation and
    supply of electrical energy. This fluctuation in the electricity prices. Extreme
    volatility has forced generators to hedge not only volume but also price risk.
    Price forecasts from a few hours to a few months ahead been of particular interest
    to power portfolio managers. A power generation company capable of predicting
    wholesale prices with a reasonable level of accuracy can adjust its strategy and
    its production or consumption schedule to reduce the risk or maximize profits
    in day-ahead trading. It helps management take the right decisions and manage
    resources accordingly and work on the shortage. Lack of sufficient power generation
    capacity, poor transmission and distribution infrastructure, high costs of supply
    to remote areas, or lack of affordability for electricity are among the biggest
    hurdles for extending grid-based electricity. Forecasting of power price plays
    an essential role in the electricity industry, as it provides the basis for making
    decisions in power system planning and operation.


    Electricity price forecasting is a time-series forecasting problem. Therefore,
    in this research, electricity prices are forecast by machine learning (ML) algorithms
    with an open-source data set. The classical forecasting models and the combination
    of recurring neural networks (RNN) and convolutional neural networks (CNN) are
    used for price prediction. Classical models such as moving average, autoregressive
    moving average (ARIMA), and long short-term memory (LSTM) are used for price prediction.
    Electricity prices are governed by different variables known as price determinants.
    Therefore, after the application of classical forecasting models and RNN, multivariate
    forecasting models are applied on the same dataset. Consequently, the results
    obtained from the models applied are compared'
