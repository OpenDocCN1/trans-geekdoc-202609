  md: '# Machine Learning Algorithms and Applications in Engineering


    data from wearables could be used for managing diabetes (Chang et al. 2016), detecting
    atrial fibrillation (Bumgarner et al. 2018) or early diagnosis of Parkinson’s
    disease (Lonini et al. 2016), tracking cholesterol levels in the blood (Fu and
    Guo 2018), complying with therapeutic regimens (Car et al. 2017), and to promote
    an alert on a cardiac arrest (Sahoo, Thakkar, and Lee 2017). Speech-based home
    apps could identify agonal breathing, an audible early sign of a heart attack
    (Chan et al. 2019). Soon, applications would be promising in detecting more biomarkers
    from audio and wearable sensors'' data, maybe by integrating data among various
    platforms where DL and classical supervised learning might design models from
    such data.


    Applying ML to the gathered data via smartphones is also promising for diagnostics.
    DL techniques could analyze smartphone-captured photos to detect various forms
    of dermal tumors (Esteva et al. 2017) and to identify retinopathy (Michechetti
    et al. 2016). Lately, researchers have found that smartphone-generated sensory
    data such as voice, response time, and accelerometer data could be processed using
    ML to monitor symptoms and progress of Parkinson’s disease (Ginis et al. 2016).
    These tested showed that ML-based wearables, home devices, and smartphones could
    collect valuable information biometric metrics, images, diet consumption, and
    ecological data (Vermeulen et al. 2020). Linking such data with diagnoses, ML
    could recognize patterns within the data and point to a certain diagnosis.


    Managing health implies continuous monitoring of the subject’s functions and behavior
    via wearables and home devices coupled with results from regular blood examinations.
    Using baseline activities and functions, individualized frameworks could be generated
    by tailoring population-wide frameworks to gathered personal data, enabling accumulating
    individual baselines and deviations, which might reflect changes in health. Applying
    individualized frameworks, ML techniques could monitor abnormalities in a person
    and alert them if a consultation with health care providers should be denied.
    Besides, tracking subjects who are online self-reported health problems like losing
    weight, bronchitis, coughing, chest pain, among others, along with machine-trained
    patterns, could be used to detect pancreas and lung tumors (White and Horvitz
    2017; Paparazzo, White, and Horvitz 2016), notifying a health professional or
    a patient suggesting seeking medical care if a further severe condition might
    convey the apparently searched symptoms. However, severe privacy-related problems
    are expected.


    Using ML, health care providers would be able to interpret the highly molecular
    testing and imaging to recognize significant biomarkers and reach a final diagnosis.
    Digital search results and multidimensional modeling for dissimilar patients would
    enable diagnosing diseases requiring therapies and provide informed therapeutic
    options. Following diagnosis and therapy, managing health starts again with continuous
    monitoring of personal health.'
