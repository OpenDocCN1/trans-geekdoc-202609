- pgno: 165
  md: '# Shilling Attack Detection Techniques in Recommender System


    allocates a binary decision tree (BDT) where attack profiles are gathered in a
    leaf node. BDT is constructed by recursively clustering the training data to locate
    the fake attack profiles using k-means clustering algorithm. The user-item matrix
    is divided into two distinct clusters at each level. Intra-cluster correlation
    coefficient is calculated for each internal node. The process is repeated until
    there remains at most a predefined number of users in any leaf node. Then BDT
    is traversed to detect anomalies with intra-cluster correlation coefficient and
    label the node holding all or most of the attack profiles.


    # 9.6.3 Attack Items Detection


    No technique has been introduced yet, which is designed for attack items detection.


    # 9.6.4 Attack Profiles and Attack Items Detection


    This type of technique is designed to detect attack profiles and attack items.
    Examples of this type of techniques are double M detector (DMD) and heterogeneous
    information network (HIN) method.


    # 9.6.4.1 Double M Detector (DMD) and Heterogeneous Information Network (HIN)
    Method


    The double M detector (DMD) technique detects shilling attack by meta-path and
    matrix factorization. The DMD technique (Zhang et al. 2019) concatenates the client-item
    bipartite network and client-client network. It designs many meta-paths, which
    control the stochastic procedure to produce node sequence and uses the skip-gram
    method to get user embedding. To get the latent factors, matrix factorization
    is utilized to decompose the client-item rating matrix. For representing users''
    embeddings of latent relations, significant meta-paths have been designed using
    heterogeneous information network (HIN) with respect to network characteristics,
    such as coreness, degree, and hindex. At the end, exploitation embedding and factors
    are utilized to train the identifier to detect the attack profiles and attack
    items.


    # 9.6.5 Using the Rating and Time Interval Parameter


    In this type of technique, the shilling attack is detected using rating and time
    interval parameter.


    # 9.6.6 Attack Profiles Detection


    This type of technique is used to detect attack profiles. Examples of this type
    of techniques are based on the statistical model, UD-HMM, and attack detection
    in time series.'
