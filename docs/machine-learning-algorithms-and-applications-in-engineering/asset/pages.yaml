- pgno: 316
  md: '# 302 Machine Learning Algorithms and Applications in Engineering


    two sets of corresponding views. This comprises the data augmentation module.


    +   SimCLR computes the image representation vectors from the augmented images
    using a neural network base encoder function and for this purpose convolutional
    neural network (CNN) variant based on the ResNet-18 architecture is chosen.


    +   It maps a nonlinear projection of the image representation using a neural
    network projection head of a fully connected network (i.e., MLP), which amplifies
    the invariant features and maximizes the ability of identification of different
    transformations of the same image.


    +   Then, a stochastic gradient descent is used to update both CNN and MLP in
    order to minimize the loss function of the contrastive objective for contrastive
    prediction task.


    The components of the framework have been implemented and highlighted in the following
    subsections.


    # 18.3.3.1 Dataset


    We have used a manually created ImageNet dataset containing 1250 images for training
    (250 images for each of the 5 categories) and 250 images for test (50 images for
    each of the five categories). The five categories used for SimCLR framework analysis
    are car, dog, bear, donut, and jean.


    # 18.3.3.2 Data Augmentation


    Data augmentation has previously been used for supervised or unsupervised representation
    learning [4,6,13] for contrastive prediction tasks by making changes in the architecture.
    In SimCLR application, generally, for a batch of N images, applying the below
    mentioned composition of data augmentation operations, 2N augmented images are
    obtained as shown in Figure 18.4. Then, for a particular pair of images (i, j)
    from the 2N images, 2(N−1) images are considered as negative pair (i, j) examples
    as displayed in Figure 18.5.


