- pgno: 166
  md: '# 9.6.6.1 Detection Based on the Statistical Model


    The statistical detection algorithm (Wang et al. 2018) first segments the features
    of every item with respect to its time-ordered rating sequence. Statistical distributions
    are designed to get the suspicious rating''s relating time interval. This technique
    is often drawn as hypothesis test detection and dynamic time interval segmentation
    strategy (Xia et al. 2015). Based on the central supposition that successful attacks
    would alter the target item''s statistical properties, this identifier wants to
    get the irregularity changes of items rating sequence. The hypotheses test is
    employed after segmentation of the rating series just to check irregular user
    groups among the groups.


    # 9.6.6.2 Unsupervised Technique Using the Hidden Markov Model and the Hierarchical
    Clustering


    The shilling identification technique relies on the hidden Markov model (HMM)
    and hierarchical clustering (Zhang et al. 2018). This technique measures the difference
    of user rating behaviors by constructing every user''s rating sequence. It then
    uses HMM to get each user''s preference sequence for calculating each user''s
    matching degree. It calculates each item''s entropy to find the users'' suspicious
    degree for detecting the attack profiles. The limitation of this technique is
    that the detection performance is not excellent while detecting the collusive
    spammer on the sampled data set.


    # 9.6.6.3 Attack Detection in Time Series


    The attack detection in a time series technique (Zhang et al. 2006) uses a window
    of size k* for building a time series of an item''s rating. It clusters successive
    rating of items into disjoint windows. It then determines the sample entropy and
    sample average of the window. It derives a theoretical optimal size window for
    best observation of an attack event if amount of attack profiles is known. This
    work begins with the subsequent observation. It assumes that the attack profiles
    are infused into the framework in a comparatively less amount of time. Most of
    the shilling attacks share a common trend in spite of decent variety of the attack
    amount they induce in the target items rating distributions (possibly for different
    items). Moreover, in a large-scale recommender framework, the ratings of a given
    item may have seasonality and/or pattern over time. A lot of complicated models
    are required to include such trends.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Shilling Attack Detection Techniques in Recommender System


    #  9.6.7 Attack Items Detection


    This type of technique is used to detect attack profiles. Examples of this type
    of techniques are dynamic time segmentation technique, unsupervised retrieval
    of attack Profiles (UnRAP), and data tracking.


    #  9.6.7.1 Dynamic Time Interval Segmentation Technique


    The dynamic time interval segmentation technique (Xia et al. 2015) is employed
    for locating out items attacked by malicious profiles directly. The entire framework
    of this technique contains two parts, that is, interval segmentation and abnormal
    interval detection. The time interval segmentation technique segments the life
    cycle of every item into time intervals dynamically at a checkpoint. The abnormal
    interval detection methods detects an anomalous item through hypothesis testing.
    This detection technique improves the detection performance against target shifting
    attack.


    #  9.6.7.2 Unsupervised Retrieval of Attack Profiles


    This unsupervised retrieval of attack profiles (UnRAP) detection technique (Si
    and Li 2020) is an unsupervised method. This technique detects shilling attack
    by analyzing rating deviation on target time. This technique can solely detect
    the attack user profiles of individual time.


    #  9.6.7.3 Data Tracking


    This data tracking detection technique (Qi et al. 2018) is used in huge information
    atmosphere. This technique supports new information feature. The technique uses
    extended Kalman filter, which quickly tracks and accurately predicts the rating
    status of the item supported two new detection attributes, short-term average
    change activity (SACA) and short-term variance change activity (SVCA). The detector
    then detects the abnormal item by comparing predicted ratings and actual ones.


    #  9.6.8 Attack Profiles and Attack Items Detection


    No technique has been introduced yet, which is based on detection of attack profiles
    and attack items as output.


    #  9.6.9 Advantages and Disadvantages


    In this section, the advantages and disadvantages of the shilling attack detection
    techniques have been presented in Table 9.2.'
