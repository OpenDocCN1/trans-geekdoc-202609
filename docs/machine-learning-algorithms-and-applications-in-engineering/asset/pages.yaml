    # 6.4 Conclusion


    This chapter provides an overview of a dream communication system. However, it''s
    not easy to implement such a type of system, but this is a step toward significant
    technology. It may be available among the people in near future. It is considered
    that information can be processed inside the brain in the same manner as the computer
    works, while dreaming and awake. Here information processing theory is most significant
    among all other theories of dreaming. Further, it can be seen that during the
    REM sleep stage, mostly dreams occur in the mind. On the other hand, it can also
    be seen that most of the memory consolidation happens during the REM sleep stage,
    which means memory is transferred from the hippocampus to associated neocortical
    regions for permanent storage, which is also known as long-term memory. Dreaming
    is the result of memory consolidation, which is a way of learning things by strengthening
    cortical connections of chemical composition or neurotransmitters. It is possible
    to read and perform functional activities while dreaming in the REM sleep stage
    by using various hardware modalities frequently used in the domain of brain-computer
    interface technology. Finally, we have to map these signals or imageries using
