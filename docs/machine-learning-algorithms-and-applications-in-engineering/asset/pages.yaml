  md: '# Machine Learning Algorithms and Applications in Engineering


    data set, rather than actual relationship among the parameters in the data set.
    In order to refrain from overfitting, the dropout technique and weight decay technique
    are employed. Weight decay technique is an important technique to avoid weight
    to grow very high in value without real requirements. This technique does with
    the addition of a term to the loss function to penalise the high weights [54,25]
    as in the equation:


    ```

    $E_d(w) = E_{od}(w) + \frac{1}{2}\lambda.w_{od}^2$

    ```


    $\lambda$ is known as a regularisation parameter to control the extent of penalisation
    of weights. W is known as the weight vector representing the entire free variables/parameters
    related to deep neural network. In the current chapter, the regularisation parameter
    $\lambda=0.05$ was employed. Drop out is another important technique to avoid
    the overfitting phenomenon. In the drop out mechanism, units are randomly removed
    from deep neural network''s training phase[56–58]. In the present chapter, the
    probability of keeping a unit in deep neural network is taken as 0.7.


    # 11.5.5 Results and Discussion


    The deep neural network training aims at optimisation of the hyper parameters
    of deep network model with minimisation of the loss function. For this purpose,
    the weights are allocated randomly at the beginning. From the given inputs and
    outputs data for the training, the deep neural network estimates makes comparison
    of its predicted outputs with the actual outputs. The computer errors are sent
    back through the deep neural learning system for adjusting the weights. The process
    of adjusting the weights is done until the condition of minimal loss is achieved.
    On completion of the training, the validation test dataset, a part of data set
    for the experiment, is employed to validate the deep neural network. At least,
    an error is computed to obtain gain efficiency of deep neural network. For forecasting
    performance level evaluation of the deep neural network, an average absolute error
    (AAE) from Equation (12.10) is used.


    ```

    $AAE = \left|\frac{\sum_{i=1}^{N}(Y_{predicted} - Y_{real})}{N}\right|$

    ```


    Figure 11.2 exhibits the 8-fold-cross-validation strategy for deep neural network
    having 440 epochs for every fold with 0.001 average of learning rate. Convergence
    for validation as well graphs shows that there is no overfitting by the deep neural
    network. Further, the value of AAE is 1.53 for the training phase. The value of
    AAE is 1.54 for the validation phase.'
