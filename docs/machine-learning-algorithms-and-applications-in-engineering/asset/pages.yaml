    # 6.2.1 BCI Tools


    Researchers are using a tool or modality for extracting signals/images from the
    brain. Here, some popular modalities are briefly described.


    # 6.2.1.1 Electroencephalography (EEG)


    Electrical activity measurement is the most popular study among brain researchers.
    Electroencephalography (EEG) is one of the major technologies for electrical signal
    acquisition from the human brain by placing electrodes noninvasively on the scalp
    during the experiment [37]. EEG has various applications in the domain of brain-computer
    interface such as medical diagnosis, game playing, skill improvement, and psycho-physiological
    analysis. This information can be extracted from various neocortical regions of
    the brain. As stated in the first section, dreaming is directly associated with
    memory consolidation happening inside the neocortical regions of the brain [38].
    EEG modality is used for tracking electrical activities occurring during memory
    consolidation during REM sleep. Electrodes must be placed (10–20 system) in cortical
    regions. Some major cortical regions are the visual cortex, auditory cortex, motor
    cortex, and also thalamus region [39]. That we have to measure electrical activities
    from the frontal lobe, occipital lobe, and temporal lobe for getting different
    features of dream contents.


    # 6.2.1.2 Electrocardiography (ECG)


    Electrocardiography is also used to measure electrical activities inside the human
    body, but in general, it is used for recording and analyzing electrical activities
    of the heart and other associated organs. However, it cannot be used directly
    for brain diagnosis, but sometimes researchers try to study braininstructed activities
    occurring in other associated organs of the body [40].'
