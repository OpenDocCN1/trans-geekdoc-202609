    # 6.1 Dream: Introduction


    Philosophers around the world believe that dream is one of the most curious things
    in human beings [1]. The dream is the succession of images and sounds occurring
    inside the mind during sleep [2]. Researchers have found that visual and auditory
    stimuli are active during certain stages of sleep within the brain regions [3].
    Some researchers found in their research that the hippocampus, amygdala, visual
    cortex, auditory cortex, and motor cortex are the major regions that are active
    during the dreaming of a sleeping object [4]. However, most of the oneologists
    committed in various articles that dream originates from the centrally located
    stem area but associated with other important cortical areas.


    There are various futuristic research ideas in my mind related to dreams, and
    belief that if it will be possible to implement some of them, it might be beneficial
    for our community. Suppose a dreamer spend six to eight hours every night, he
    is also spending nearly an equal time in the workplace during daytime for his
    survival [5]. So, the question is, is it possible to make use of time spent sleeping
    in any way. The dream might be a solution for making sleeping time useful; it
    means if it is possible to control dream activities and contents, it will help
    humans to grow financially by increasing our effective works.


    # 6.1.1 Theories of Dream


    Since the early sixteenth century, scientists are striving to know the fundamental
    causes of why dream occur, but still, no one is sure about it [6]. There are various
    philosophical theories proposed by various scientists and philosophers from time
    to time, and some popular theories of the dream (Figure 6.1) are briefly described
    here.'
