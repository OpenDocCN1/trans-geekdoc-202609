- pgno: 1
  md: '# Machine Learning Algorithms and Applications in Engineering


    Machine Learning (ML) is a subfield of artificial intelligence that uses soft
    computing and algorithms to enable computers to learn on their own and identify
    patterns in observed data, build models that explain the world, and predict things
    without explicit pre-programmed rules and models. This book discusses various
    applications of ML in engineering fields and the use of ML algorithms in solving
    challenging engineering problems ranging from biomedical, transport, supply chain
    and logistics, to manufacturing and industrial. Through numerous case studies,
    it will assist researchers and practitioners in selecting the correct options
    and strategies for managing organizational tasks.


    Features:


    +   Includes the latest research contributions on ML perspectives and applications.

    Follows an algorithmic approach for data analysis in ML and includes real-time
    engineering case studies.

    Addresses the emerging issues in computing such as deep learning, Internet of
    Things, and data analytics.

    Focuses on ML techniques that are unsupervised and semi-supervised for unseen
    and seen sets on commercial value-added research applications.

    Discusses how the advancements in data science and computing domain open possibilities
    for cross-disciplinary connections.


    This book will benefit professionals, academic researchers, and graduate students
    in computer science and engineering, biomedical, mechanical, electrical, transport,
    manufacturing, and industrial engineering.'
