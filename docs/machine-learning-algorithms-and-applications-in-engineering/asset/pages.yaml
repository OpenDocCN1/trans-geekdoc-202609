- pgno: 7
  md: '# Preface


    Some of the decisions taken in engineering, from bioinformatics to risk analysis,
    are supported by information obtained from data. In recent decades, both academic
    and private institutions have sought to agglomerate information in data centers,
    aiming to extract representative knowledge out of it. In particular, the improvement
    in information-storage resources has reached a point where almost every institution
    may store and preserve a considerable amount of data related to its daily services.
    As expected, raw data stored in those data centers is useless and requires analysis
    through advanced algorithms. During the twenty-first century, these algorithms
    have had a remarkable development, outperforming classical statistical methods.
    Machine learning (ML) and big data technologies have become the solution to massive
    information processing needs that exceed the capabilities of conventional computing.
    They are characterized by three features: volume (a large amount of data is produced),
    velocity (the speed at which these data are obtained and accessed), and variety
    (data diversity as they come from different sources; e.g., structured, unstructured,
    multimedia, textual). In this book, we will present several novel applications
    of ML approaches to engineering problems extremely relevant in practice, ranging
    from health care to risk analysis.'
