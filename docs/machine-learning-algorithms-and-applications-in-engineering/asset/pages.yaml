    formed over the build platform by the roller in the AM machine. A powder removal
    platform is moved down the powder platform to remove the excessive metal powder
    from the machine. These two processes—the powder layering and powder melting—take
    place alternately till all products are produced. In end, each layer is joined
    with the adjacent layers by the laser energy-fused material. Then, parts on the
    build platform are extracted out of the AM machine. The machine is now cleaned
    for the next AM part production. Next, on the build platform often undergo thorough
    heat treatment to remove the thermal stress. Finally, the parts are cut from the
    platform for performing the post-processing actions like removing the support
    structure and surface polishing.


    Selective laser sintering (SLS) has the merits to recycle the leftover unprocessed
    metal powder, time efficiency, energy efficiency and geometrical freedom for product
    design. SLS is a promising AM process for various applications such as aerospace
    and automotive manufacturing.


