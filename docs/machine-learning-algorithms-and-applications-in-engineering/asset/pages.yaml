- pgno: 120
  md: '# 6.3.1.2 Recurrent Neural Network (RNN)


    This is the most popular model for natural language processing. It uses the concept
    of recurrence using the backpropagation technique for adjusting weights. In this
    type of network, the output from the previous step is fed as input to the current
    step [69]. In traditional neural networks, all the inputs and outputs are independent
    of each other, but in cases when it is required to predict the next word of a
    sentence, the previous words are required and there is a need to remember the
    previous words [70]. Thus, RNN came into existence, which solved this issue with
    the help of a hidden layer. The main and most important feature of RNN is the
    hidden state, which remembers some information about a sequence [71].


    RNN has a memory that remembers all about what has been calculated. It uses the
    same parameters for each input as it performs the same task on the inputs or hidden
    layers to produce the output. This reduces the complexity of parameters, unlike
    other neural networks [72].


    # 6.3.1.3 Convolutional Neural Networks (CNN)


    This is the topmost neural network model nowadays among researchers and industrialists.
    It is developed for image and video processing. It can take in an input image,
    assign learnable weights, and biases to various aspects/objects in the image and
    be differentiate from one of the other [73]. The preprocessing required on CNN
    is much lower as compared to classification algorithms. In primitive methods filters
    are hand-engineered, with enough training, CNN can learn these filters/characteristics
    [74].


    The architecture of a CNN is analogous to that of the connectivity pattern of
    neurons in the human brain and was inspired by the organization of the visual
    cortex. Individual neurons respond to stimuli only in a restricted region of the
    visual field known as the receptive field. A collection of such fields overlaps
    to the entire visual area [75].


    # 6.3.1.4 Gradient-Adversarial Network (GAN)


    This is the hybrid model developed by combining two models as a convolutional
    model and a convolutional model. In GANs, there is a generator and a discriminator.
    The generator generates fake samples of data and tries to fool the discriminator
    [76]. The discriminator, on the other hand, tries to distinguish between the real
    and fake samples. The generator and the discriminator are both neural networks
    and they both run competition with each other in the training phase [77]. The
    steps are repeated several times and in this, the generator and discriminator
    get better and better in their respective jobs after each repetition.


    Comparative Study of DBN, RNN, CNN, and GAN Deep Learning Models are shown in
    Table 6.3.'
