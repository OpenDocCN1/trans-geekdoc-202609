    # 6.1.1.1 Wish-fulfillment Theory


    Wish-fulfillment theory was proposed by an Austrian oneiroologist, Sigmund Freud.
    He believe that dream are related to the wishes and desires of the dreamer. Generally,
    a dreamer sees contents into a dream, which are incomplete or unfilled desires
    in his real life [7]. The most common example of such a type dream is sexual arousal
    during sleep when an adult dreamer might be involved in sexual or romantic activities
    in his dream. Some other examples are feeling sadness and happiness, participating
    in any traditional ceremony, visiting new places or any ancient place and finding
    valuable things or properties [8].


    # 6.1.1.2 Information-Processing Theory


    This theory deals with the process of computation like a computer system to get
    input from the external environment and process the data and finally generate
    output. This theory compares transmission path and processes in the human brain
    like computer hardware circuits and physical devices are organized in a computer
    architecture [9].


    It is known that data and information inside the computer system travels through
    and from one device to another. In the same manner, neurotransmitters travel through
    the axons and dendrites of neuron cells in the nervous system or biological neural
    network [10]. Further, the central part of neuron cells, which is also known as
    soma, is responsible for collecting and modifying information in the form of chemical
    composition or neurotransmitters. The same concept is also applicable in the case
    of dream content generation inside the brain [11].


    # 6.1.1.3 Activation Synthesis Theory


    This theory is developed based on identifying active brain regions during dreaming.
    Neuroscientists have seen in experiments that some specific regions are active
    and produce various types of wave signals, which support various features in dream
    contents [12]. In-depth, it can be seen that'
