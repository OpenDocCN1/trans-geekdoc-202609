- pgno: 177
  md: '# ML Applications in Real-Time Series Problems


    transition from one segment to the next, each cut point belongs to two segments,
    in such way that they belong to the previous and to the next segment. Figure 10.1
    graphically represents a segmentation procedure.


    As abovementioned, segmentation is used to achieve different objectives. In the
    literature, there are two main groups of objectives. On the one hand, this technique
    is carried out to discover group similarities or useful patterns over time. Methods
    in this context are to optimize the division of time series and then group the
    segments into different clusters. Several methods have been proposed during the
    last two decades. Abyoni et al. (2003) stated that all points in a time series
    belonging to the same cluster are contiguous in time. After that, many authors
    proposed methods to group segments instead of points. Tseng et al. (2009) developed
    an algorithm in which similarities in wavelet space are considered to guide the
    segmentation, resulting in a clustering of segments of different length. Besides,
    a significant clustering of subsequent time series was addressed using two efficient
    methods (Rakthanman et al., 2012). As can be seen, all segmentation procedures
    require clustering algorithms, given that they aim to make groups of segments
    in order to discover useful similarities. In this sense, several algorithms for
    time series clustering have been proposed recently (Guijo-Rubio et al., 2020a),
    aiming to obtain time series with similar characteristics or based on segment
    types.


    On the other hand, time series segmentation is also applied for approximating
    time series; in other words, to reduce the number of time series points. In this
    case, the procedure is performed by selecting points whose approximation is the
    most accurate regarding the real-time series, that is, the approximation aims
    to minimize the information loss or the approximation error. One of the main purposes
    is to mitigate the difficulty of processing and memory requirements. A well-known
    approach in this context is the use of piecewise linear regressions or interpolations
    are used for modelling each segment (Keogh et al., 2004). Moreover, Fu (2011)
    presented an approach for approximating time series by defining it as an optimization
    problem that could be solved by evolutionary algorithms. Lately, other authors
    have developed a novel approach based on connected lines under a predefined maximum
    error bound (Zhao et al., 2016).


    Finally, the prediction of a time series is easily and formally defined as given:
    a time series Y = {y_i}(i=1...N), the prediction consists in the determination
    of value y_{i+t} representing a future of time. This procedure learns from the
    known past values in order to generate a model able to estimate future ones accurately.
    Traditional statistical models are still widely used for this task, for example,
    the COVID-19 pandemic in Saudi Arabia has been forecasted by AutoRegressive Integrated
    Moving Average (ARIMA) model (AlZahrani et al., 2020), nowadays there has an increasing
    interest in developing novel ML algorithms, such as artificial neural networks
    (ANNs), or even more advanced approaches, such as'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Machine Learning Algorithms and Applications in Engineering


    evolutionary ANNs (EANNs) or long short-term memory (LSTM), which have been applied
    to predict accidents (Chandra and Chand, 2016) and to weather prediction (Karevan
    and Suyken, 2020), respectively.

    The following section presents a set of real-world applications tackled by the
    authors of this chapter.


    # 10.2 Real-World Applications of TSDM Using ML algorithms


    # 10.2.1 Massive Mining Data Reconstruction in Wave Time Series


    Oceanography buoys are instruments used to measure different wave properties.
    Their accuracy and availability are crucial for several essential operations,
    like coastal structures safe ship navigation or wave height converters (López
    et al., 2013). Although there are many agencies offering support or maintaining
    the buoys, as is the case of the National Data Buoy Center (NDBC) in the United
    States, many unexpected events make buoys to break down (e.g. prolonged storms,
    harmful accidents, long maintenance periods and on). In this way, it causes data
    gaps until the buoy is completely repaired. Even though methods can be applied
    even with the presence of missing data in the time series, the number of which
    need complete data is much higher (Thomson and Emery, 2014). For this reason,
    the reconstruction of missing values in time series has attracted a great interest
    in this field.


    In the last two decades, there has been an exponential increase in the number
    of works applying ML techniques to data recovery. One of the first works in the
    area was done by Bhattacharya et al. (2003), which ANNs are used to retrieve missing
    values of wave height data in the North Sea. Then, feedforward multilayer perceptrons
    (MLPs) and recurrent neural networks (RNN), trained by conjugate gradient, were
    presented as articles for reconstructing the wave height in Turkey (Balas et al.,
    2004). Beside, a back-propagation algorithm for training ANNs was also used in
    the Atlantic with the same purpose of recovering data from buoys (Gunayin and
    Panchang, 2008). More works used ANNs and new variants during these years, such
    as ANNs combined with K-nearest neighbour algorithm (Zamani et al., 2008) or ANNs
    trained by the rough set theory (Setiawan et al., 2008), among others.


    Furthermore, ANNs have also been combined with other methods such as that of Londhe
    (2008) where ANNs are combined with genetic programming to estimate missing wave
    height using neighbours'' stations. In Mahjoobi et al. (2008), a neuro-fuzzy inference
    system was'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# ML Applications in Real-World Time Series Problems


    successfully applied over Lake Ontario. And finally, physical methods have also
    been combined with ML approaches for wave height estimation (Casa-Prat et al.,
    2014).


    As most ML models lack interpretability inherent to these techniques, we proposed
    a new method in Duran-Rosal et al. (2015). In this paper, a product unit neural
    network trained by an evolutionary algorithm (EPUNN) was proposed through a two-stage
    procedure. This methodology was applied to six buoys located at the Gulf of Alaska,
    United States.


    The first stage consisted in performing an initial reconstruction using transfer
    functions and neighbour correlation method. On the one hand, transfer functions
    are based on the analysis of the correlation and the estima-tion of a gap time
    series by means of a complete one (note that the correl-ation between them needs
    to be higher than a predefined threshold). On the other hand, the neighbour correlation
    method estimates these missing values by adding information from the highly correlated
    buoys.


    Both methods have recovered the missing values, we keep the best for each time
    series is used as input for the EPUNN of the second stage. In this sense, the
    two most correlated inputs (concerning the original time series) are used to get
    the definitive reconstructed time series.


    The results achieved for the six buoys located at the Gulf of Alaska indicated
    that EPUNNs are suitable for this kind of problems, given their accuracy and their
    interpretability. Besides, they can be represented as linear models by applying
    natural logarithm to the inputs for easing the understanding and interpretation.
    As a remark, better reconstructions are achieved for coastal buoys, by that the
    availability of values was higher.


    # 10.2.2 Detection and Prediction of Tipping Points


    Paleoclimatology is a popular field of paleogeography science; it consists of
    the study of Earth''s climate characteristics, and concretly, it aims to pro-vide
    the best possible description of the climate for a period of the history. Moreover,
    paleoclimatology acknowledges significant climate variations and the reasons behind
    them. Some points of no return, thresholds and phase changes are widespread in
    nature and often nonlinear. These could have a high impact on the Earth''s climate
    being difficult to anticipate (Wassmann et Lentio, 2012).


    Focusing on this problem, several researchers on dynamic systems, such as climate
    systems, claim that they present critical transitions. These transitions are commonly
    called tipping points (TPs), also known as ‘small things that can make a big difference’.
    When a small change in a climate system causes a strong non-linear response in
    its internal dynamics, leading to a change in its future state, it is called climate
    TP. In this sense, the main climate changes on Earth are determined by the transition
    points in the temperature time series,'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Machine Learning Algorithms and Applications in Engineering


    or one of their proxies such as the concentration of oxygen isotopes in the glaciers,
    which makes them go from one stable state to another.


    Early detection of TPs by analysing their causes and what happens has been considered
    of significant impact since they can affect millions of lives. Lenton (2011) proposed
    the differentiation of many types of TPs and presented some indicators that may
    help to detect them, like increased-correlation of values. Besides, Dakos et al.
    (2012) introduced more particular techniques related to data processing and indicators.
    They studied several methods using simulated ecological data and arrived at primal
    conclusions: there is no single best indicator to detect a transition and that
    all methods require specific data processing. The previous works have two main
    disadvantages: the need of intensive processing of the data and the application
    of a specific treatment for each type of TP. In this regard, we proposed two works.


    In the first work


    This methodology was tested not using synthetic data sets but also on two real-world
    paleoclimate oxygen isotope datasets: GIS2 (Greenland Ice Sheet Two) and NGRIP
    (North Greenland Ice Core Project) $\delta^{O}$ time series with a resolution
    of 20 years and an average of 5 points to reduce short fluctuation. The experiments
    resulted in an effective detection and discovery of similarities and differences
    in the dynamic characterization of TPs, called Dansgaard-Oeschger (DO) events
    in these time series. The algorithm determined that the increase in autocorrelation,
    variance and mean squared error can be considered as warning signals for almost
    all TPs. Moreover, the proposed approach provides a new visualization tool for
    climate series analysis.


    In the second work, we introduced some improvements and developed a prediction
    model derived from the obtained segments (Pérez-Ortiz et al., 2019). When the
    segmentation stage finished, its evaluation was automatically done by performing
    a comparison with an ideal segmentation carried out by experts in the field and
    by measuring the algorithm stability. The algorithm was also supplied with 10
    metrics for the clustering validation, in order to increase the robustness in
    the search for the best segmentation, resulting in a better performance in terms
    of TP detection. For the prediction phase, the segments obtained by the GA were
    transformed into a binary problem, with the goal of determining whether the next
    state represented a DO event.'
