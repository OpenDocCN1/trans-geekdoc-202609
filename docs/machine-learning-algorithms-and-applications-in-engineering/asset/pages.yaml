  md: '# 8.4 Challenges


    In the light of the aforementioned, after an exhaustive review of the specific
    literature on the problem of protein function prediction, a number of challenges
    have been identified that could be of great interest to scientists involved in
    research projects on this topic. First, to propose new assessment metrics for
    the problem of automatic functional annotation. Within this point, models have
    traditionally been evaluated with metrics derived from precision and recall. These
    metrics are often biased towards the majority classes and do not consider the
    class hierarchy present in the problem. It would be interesting to propose new
    evaluation metrics for supervised classifiers implemented to solve automatic protein
    function prediction problems. Within this area, models have traditionally been
    evaluated with metrics derived from precision and recall. Such metrics (e.g.,
    F-score) tend to have a bias towards majority classes (as does the correct classification
    rate (CCR)). It also assumes that the distributions associated with the class
    distributions and the predicted distributions are equal. In short, the F-score
    is not a suitable metric to measure the goodness of fit of a classifier in a bioinformatics
    scenario with multiple classes and imbalance problems between them. Moreover,
    this problem presents hierarchical classes so that classification errors should
    not all have the same weight.


    Second, it is considered necessary to develop scalable machine learning models
    for the problem under study. Functional protein annotation is a classification
    problem composed of more than 100k instances, more than 5k classes and of a multi-label
    nature. State-of-the-art machine learning algorithms have serious computational
    difficulties in addressing problems of this typology due to models scale up with
    the sample size of the problem. In order to overcome these serious computational
    difficulties to deal with problems with so many instances and classes, it would
    be appealing to test lightweight alternatives (if compared to classical algorithms)
    and propose models whose computational complexity is adjusted to the needs of
    the problem. Moreover, these models will have to be designed taking into account
    that, on the one hand, this is a multi-label problem, and, on the other hand,
    they must rely on different and diverse sources of information, which makes an
    ensemble perspective ideal.


    Finally, in line with the above challenge, it should again be noted that the data
    sets found in the protein function prediction problem contains more than'
