    in different regions at different states of mind, various types of signals are
    generated [13].


    # 6.1.1.4 Physiological Function Theory


    This theory of dreaming deals with periodic stimulation of the nervous system.
    Brain stimulates periodically during the dreaming and strengthens the information
    stored inside the brain as memory, whatever the dreamer has seen during the waking
    period [14]. Generally, it happens at every stage of the rapid eye movement (REM)
    every night. What means the brain works intuitively for strengthening the memory
    and data pattern inside the brain [15].


    # 6.1.2 Origin of Dream


    Scientists undertook imagining of the many regions of the brain that are active
    while dreaming, starting from the brain to the cortex through the thalamus [16].
    Most of the observations show that brain regions are active similar to waking
    stages. Suppose you are seeing any visual imagery during dreaming, it relates
    to the visual cortex in the occipital lobe of the brain. In the same way, the
    other cortex is also related to concerned activities [17]. The cortical regions
    hippocampus and amygdala are responsible for feeling emotions and sensation activities
    [18].


    # 6.1.2.1 Dream versus Sleep


    Sleep is the unconscious state of mind. Sleeping and awakening is a cyclic process
    in our daily life. Most of the physiologists believe that our whole body, including
    the brain, needs relaxation, which is possible to some chemical reactions. That''s
    why every animal takes rest by way of sleeping [19]. Generally, a human sleeps
    six to eight hours every night. Further, neuroscientists find that at stages of
    dreaming, human brain becomes more active instead of going into a relaxation mode
    [20]. Various activities are happening during sleeping, but the dream is the most
    effective activity in our sleeping brain.


    Before going into about dreaming, a little more about the basics of sleep needs
    to be discussed. Pieces of literature recognize that sleep can be classified into
    two broad categories, known as REM sleep and NREM sleep [21]. The REM sleep stage
    is wholly responsible for dreams occurring in the brain. A dreamer’s brain is
    more active in the REM sleep stage due to dreaming activities (Figure 6.2). Table
    6.1 shows time distribution for various sleep stages.'
