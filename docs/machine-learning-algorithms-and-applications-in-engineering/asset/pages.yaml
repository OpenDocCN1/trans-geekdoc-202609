    +   (3) Attacks using non-membership correlation: The intruder can perform a non-membership
    correlation attack if he can infer the non-existence of an individual from the
    data set. The case scenarios 1, 2, and 3 explain the non-membership correlation
    attacks.


    Scenario 1: If the intruder possesses the basic information of an individual,
    the intruder knows that Emy is a female, age=40, from zip code 13084, he can easily
    infer that Emy falls in either one of the equivalence classes 4 and 5 from Table
    12.2. If the intruder also has strong background knowledge that Emy often suffers
    from breathlessness, the probability of inferring Emy''s record from equivalence
    classes 4 and 5 is high.


    Scenario 2: If the intruder possesses background knowledge about the individual
    and the quasi-identifier information, he can easily link the sensitive attributes
    of an individual by using the quasi-identifier information. The intruder knows
    that Beon is a male, age >25, zip code 14206, the intruder can easily infer that
    Beon falls in the equivalence classes 2 and 3 from Table 12.2. With the strong
    background knowledge, he can quickly identify the sensitive attributes of Beon


    Scenario 3: If the intruder has strong background knowledge and possesses the
    information of quasi-identifier over the individual, that Avan is a male, age<30,
    zip code 14248, also Avan is highly infected with a deadly disease, then he can
    easily infer that the records of Avan fall in equivalence classes 1 and 2 from
    Table 12.2. So, the existence of the individual Avan is identified, which leads
    to privacy breaches. The traditional methods and algorithms cannot thwart the
    privacy breaches in the 1:M dataset.


