    # 9.1.1 Collaborative Filtering in Recommender Systems


    Collaborative filtering is one-in-all advice technique, which helps users to choose
    an applicable product. It is accustomed for handling information overload downside
    by manufacturing extremely correct predictions. The key assumption of collaborative
    filtering technique is that users having similar experiences on past things tend
    to agree on new items (Bilge et al. 2014a). Collaborative filtering utilize terribly
    sparse p × user-item matrix, which has p users preferences preferring q merchandise.
    The systems provide recommendations to users by evaluating similar users'' preference.
    Collaborative filtering strategies are undefeated in providing correct referrals
    regarding merchandise. They are additionally able to overcome data overload by
    matching users with right things for them. However, they are prone to profile
    injection or shilling attacks. There may exist some users or corporations who
    are malicious aiming to control the recommender systems outcomes for their benefits.


    The collaborative filtering strategies are typically categorized into two main
    aspects: (i) user-based collaborative filtering and (ii) item-based collaborative
    filtering.


    # 9.1.1.1 User-Based Collaborative Filtering (UBCF)


    The user-based collaborative filtering (UBCF) basically works on the strategy
    of recommending items to active users by finding similar users. Figure 9.1'
