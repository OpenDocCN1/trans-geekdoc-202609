    # 15.3 Methodology


    This section presents the various univariate and multivariate forecasting models
    that were applied in this work.


    # 15.3.1 Univariate Forecasting Models


    # 15.3.1.1 Autoregressive Model


    An autoregressive (AR) model predicts the future behavior based on past behavior.
    AR models are also called conditional models, Markov models, or transition models.
    They are used for forecasting when there is some correlation between values in
    a time series and the values that precede and succeed.


    An AR model is represented by Equation 15.1, where the value of outcome variable
    (P) at some point t in time is like “regular” linear regression, directly to the
    predictor variable (Q). The simple linear regression and AR models differ in this
    respect that P is dependent on Q and also previous values of P.


    ```

    $P_t = \delta + \varphi_1 P_{t-1} + \varphi_2 P_{t-2} + \dots + \varphi_p P_{t-p}
    + A_t \quad (15.1)$

    ```'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Electrical Price Prediction using Machine Learning Algorithms 259


    where


    +   * $P_{t-1}, P_{t-2} \dots P_t$ are the past series values (lags),

    * $A_t$ is white noise (i.e., randomness), and

    * $\delta$ is defined by the following equation:


    ```

    $\delta = (1 - \sum \varphi_i)\mu (1 \le i \le p)$ (15.2)

    ```


    # 15.3.1.2 Moving Average (MA)


    MA is one of the most foundational models for time-series forecasting, denoted
    as MA(a) where $a$ is the order of the model. This is one of the basic statistical
    models that is a building block of more complex models. The MA model states that
    the current value is linearly dependent on the current and past error terms. Again,
    the error terms are assumed to be mutually independent and normally distributed,
    just like white noise. Equation 15.3 represents the predicted value using MA technique:


    ```

    $P_t = \mu + \varphi_1 \alpha_{t-1} + \varphi_2 \alpha_{t-2} + \dots + \varphi_a
    \alpha_{t-a}$ (15.3)

    ```


    $P_t$ = present value

    $\mu$ = mean of the series

    $\varphi$ = The magnitude of past errors on the present value

    $\alpha$ = the present error term, and past error terms.

    $\a$ = order of the series


    # 15.3.1.3 ARMA


    An ARMA model is used to describe weakly stationary stochastic time series in
    terms of two polynomials. The first of these polynomials is for autorecursion


    ```

    $P_t = \beta_1^* P_{t-1} + \alpha_1^* \varepsilon_{t-1} + \beta_2^* P_{t-2} +
    \alpha_2^* \varepsilon_{t-2} + \beta_3^* P_{t-3}\n + \alpha_3^* \varepsilon_{t-3}
    + \dots + \beta^* P_{t-k} + \alpha^* \varepsilon_{t-k}$ (15.4)

    ```


    where

    $\beta$ = the coefficients of the AR model

    $\alpha$ = the coefficients of the MA model.


    # 15.3.1.4 ARIMA


    ARIMA is a class of models that explain a given time series data based on its
    own previous values, that is, its own lags and the lagged forecast errors,'
