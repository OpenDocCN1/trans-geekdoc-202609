  img_proc: true
- pgno: 182
  md: '# Machine Learning Algorithms and Applications in Engineering


    Although there are many sensors collecting meteorological data at airports, such
    as wind speed and direction, temperature, humidity and pressure, others, in order
    to support the airport operations, the runway visual (RVR) is the most important.
    RVR is a weather variable defined as the range over which the pilot of an aircraft
    on the centreline can see the markings on the runway surface or the lights that
    outline the runway and identify its centreline.


    Taking into account the previous works and the RVR variable, we proposed two works
    in the sense that fog prediction is treated as class intervals, resulting in a
    binary and an ordinal problem, respectively. Both works were located at the airport
    of Valladolid since its location is a key point in the formation of fog during
    the cold months.


    The first work is focused on the prediction of the RVR variable collected from
    sensors with a 6-hour horizon prediction (Durán-Roral et al., 2018). Fog events
    are considered when RVR is less than 190 m. Thus, the problem becomes a binary
    classification in which the output is 1 if there is a fog event, and 0 otherwise.
    Given the unbalanced nature of the data, that is, the number of fog events was
    much lower than clear events, a multi-objective evolutionary algorithm (MOEA)
    was developed to train the structure of ANNs, using PU, sigmoid units (SUs) and
    radial basis functions (RBFs) as basis functions. The algorithm trained to optimize
    the overall accuracy and sensitivity to address the problem of unbalancing.


    The best model by MOEA was an ANN with a PU base function. This combination achieved
    a global accuracy of 82.24 per cent and the percentage of events correctly classified
    was 84.83 per cent. The resulting ANN had only two neurons in the hidden layer,
    showing the high interpretability of the model (see Figure 10.2), which was able
    to be explained in terms of physical properties of fog formation.


    In the second work (Guijo-Rubio et al., 2018), three ordered classes were considered,
    increasing the difficulty of the problem. The consideration of these three classes
    was to giving more precise information as a decision support system: FOG (RVR
    in the range [0, 1000] m), MIST (RVR in the range [1000, 1900] m) and CLEAR (RVR
    higher or equal to 190 m). Besides, the prediction was carried out using a 24-hour
    schedule.


    The work was based on the philosophy of autoregressive (AR) models, the model
    needed some previous values for the prediction of a given one. To determine this
    number of previous values, three different sorts of window were proposed: fixed
    window (FW), dynamic window (DW) based on label change (DWLC) and DW based on
    variance change (DWVC). Since the problem was addressed under the ordinal paradigm,
    the algorithms proposed to solve it: proportional odds model (POM), support vector
    machines (SVM), support vector order regression considering explicit constraints
    (SVOREX), support vector order regression considering implicit constraints (SVORIM)
    and kernel discriminant learning for ordinal regres-sion'
