  md: '# Machine Learning Algorithms and Applications in Engineering


    # 3.4.2 Machine Learning Use Cases in the Financial Sector


    This section analyzes and gives a deailed description of various use cases of
    machine learning in the field of risk management in the financial sector such
    as fraud detection, credit risk, supervision of conduct, and market abuse in trading
    (Tanwar, 2020).


    +   (i) Fraud detection: Machine learning is now often used in the field of fraud
    detection, mainly to detect credit card fraud in the banking system. It has resulted
    in higher significant success rate till now. Banks have set up various monitoring
    and surveillance systems to ensure security. These systems keep a track on the
    payment fraud activities that take place more often. The fraud model works on
    the historical payment algorithm that blocks the fraudulent trade as soon as it
    detects.


    The training, testing, and authorization of machine learning algorithms become
    possible because large data sets provided by the credit card payments. Moreover,
    various classification algorithms are trained with the help of historical data
    with identified fraud and nonfraud tags. This training is done with the help of
    large historical nonfraud data. The above historical payment data sets generate
    a clear view of features of the credit card by distinguishing them on the basis
    of transactions, owner, and history of the payment.


    +   (ii) Credit risk: The term “credit risk” signifies the prospects of loss because
    of unsuccessful payments made by the lender. Therefore, the credit risk management
    system (CRMS) is implemented in order to meet the losses by analyzing the fairness
    of the bank and its capital along with the loan loss section at any instant of
    time. This system has enhanced the transparency demanded by the financial. Transparency
    is carried by paying more emphasis on the regular examination of the knowledge
    of banks for its customers and credit risks.


    Suitable credit risk management improves the entire performance of the system
    and provides a competitive benefit. Various prediction are made in order to make
    predictions regarding the kind of lender. These machine learning algorithms provide
    positive results and greater success rates in the problems including credit risks
    as well.


    +   (iii) Supervision of conduct and market abuse in trading: Another case of
    machine learning in the risk management system is the surveillance of the performance
    loopholes generated mainly by the traders working in the financial institutions.
    The various trading illegalities often lead to economic as well as failure. In
    order to overcome such crimes and shortcomings, numerous self-operating systems
    have been developed in order to provide a check on the trading behaviors of dealers
    with increased accuracy and distinct ways to identify them.'
