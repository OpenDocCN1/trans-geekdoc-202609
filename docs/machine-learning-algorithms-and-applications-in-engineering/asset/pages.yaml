  md: '# A Comparative Analysis of Techniques in Gesture Detection


    as the major challenge especially in hand gestures, other limitations include
    inconsistent speed of gestures [18], inability to distinguish between start and
    end of gestures and variation on skin texture or complexion. Other image segmentation
    challenges include inconsistencies on background like variation in illumination,
    busy or moving background, and continuous differences in color patterns of the
    background [19].


    # 5.2.3 Feature Extraction Challenges in Gesture Detection and Identification


    There are multiple features that are extracted via variegated approaches that
    face varied challenges and graph-based features when extracted limitations due
    to complex background or inconsistent illumination [19]. Mixing of gestures or
    mixing of features also creates several limitations in the same. While the degree
    of rotation is well accustomed with various gesture detection algorithms, abrupt
    gesture or out-of-defined boundary create issues. This gradation of limitation
    also introduces the challenges and issues that occur during the identification
    of continuous gestures as the detector deliberates them as one continuous gesture
    instead of unique gestures. A solution to this continuous gestures was proposed
    by introducing automatic system-based pauses these may or may not coincide with
    the actual pauses taken by the person. Moreover, many times due to personal habits,
    some people perform gestures by taking few or no pauses in between while others
    perform gestures with an optimal number of pauses [20]. These discrepancies cause
    inconsistencies in the identification of gestures when gestures are performed
    by humans, but if performed by artificial devices, such issues of inconsistencies
    tend to be avoided [21]. Apart from the above, another type of gestures, namely
    ‘conversational gestures’, also have similar issues on grounds of gesture identification
    and segmentation as they have multiple variations based the personal way of using
    conversational gestures, variation in speed, frequency and different dialects
    and regional influences create variations in type of conversational gestures used.
    Real-time conversational gestures also differ widely based on the environment
    like public gestures and private gestures, which can create further discrepancies
    in both identification and segmentation. Additionally, influence on gestures is
    a factor that creates inconsistencies in the same [22,23]. There are categories
    of gestures that create patterns of conscious and unconscious gestures that humans
    perform during mundane conversations. While this can be considered as a subcategory
    to conversational gestures, they can be deliberated more effectively when considered
    individually [24]. Thus realtime gesture identification, analysis and segmentation
    is a cumbersome and complex task, which can be improved by continuous training
    over a long period of time.'
