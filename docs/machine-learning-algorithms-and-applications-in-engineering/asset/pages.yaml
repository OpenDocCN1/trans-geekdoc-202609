- pgno: 34
  md: '# 2.1.1 Machine Learning (ML)


    A data-driven model is a type of model that uses ML techniques to build a relationship
    between input and output data, without having to worry too much about the underlying
    process. ML is a part of artificial intelligence (AI) process for inducing regularities
    and patterns, making implementation simpler, with low computation costs, quick
    training, validation, testing and evaluation, high performance compared to physical
    models, and comparatively less complex compared to physical models. One of the
    characteristics of ML algorithms that must be considered is that these models
    are as good as their training where the system, based on past data, learns the
    target tasks [1].


    If the data is sparse or does not cover a variety of tasks, their learning will
    be limited, and therefore they will be unable to perform well when put into work.


    # 2.1.2 ML Algorithms Used for Flood Risk Mapping


    # 2.1.2.1 Artificial Neural Networks


    Artificial neural networks is a model of computation based on biological neural
    network structure and functions. They are considered as a nonlinear modeling tool
    for statistical data where the complex associations between inputs and outputs
    are designed or patterns are associated with [1]. As one of the most popular learning
    algorithms, ANNs are known to be flexible and efficient in modeling complex processes
    with large fault tolerance and accurate approximations, among the ML methods.
    ANN utilizes historical data and is more reliably for flood prediction. ANN offers
    the most appropriate modeling technique and acceptable generalization capacity
    and speed compared to other models. Every ANN layer essentially carries out nonlinear
    transformations from one vector space to another. The relatively subpar accuracy,
    the urge for iterative parameter adjustment, and the sluggish response to gradient-based
    learning process are drawbacks to using ANN.


    # 2.1.2.2 Multilayer Perception


    For a more sophisticated modeling approach, the knack percolation learning algorithm
    calculates the propagation error in hidden network nodes individually. Nonlinear
    activation functions resolve the major drawbacks of linear activation by allowing
    backpropagation because they have an input-related derivative function [1]. And
    they allow various layers of neurons to stack to create a deep neural network.
    Because of many variables, MLP is considered to be tougher to optimize.'
