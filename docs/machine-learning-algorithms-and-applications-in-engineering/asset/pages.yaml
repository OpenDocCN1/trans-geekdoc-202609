  md: 'Psychologists and dream researchers believe that during dreaming, some organs
    of the body are also active and may perform some activities other than brain regions.
    Likely some researchers are actively engaged in dream research using ECG modalities
    instead of EEG [41]. Nightmares occur in this type of a dreamer who shows body
