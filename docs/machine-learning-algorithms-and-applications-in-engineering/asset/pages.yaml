    # 9.6.2.7 Semi-supervised Learning Using the Shilling Attack Detection (SEMI-SAD)


    The semi-supervised learning based attack detection technique (SEMI-SAD) (Wu et
    al. 2021) is assisted by shilling attack detection algorithm. It takes advantage
    of each kind of information. At first, it trains a small set of labeled clients
    with naive Bayes (NB) classifier and then consolidates the unlabeled clients with
    expectation maximization (EM) for upgrading the NB classifier. The SEM-SAD can
    readily distinguish numerous sorts of shilling attacks compared to others, particularly
    obfuscated and hybrid shilling attacks. This technique optimizes naive Bayes in
    form of the initial detector and an augmented EM to enhance the detector. This
    algorithm gains knowledge from each labeled and unlabeled client profiles. By
    combining naive Bayes classifier and unlabeled data, EM is utilized to increase
    the weight of the labeled information.


    # 9.6.2.8 Support Vector Machine and Target Item Analysis (SVM-TIA)


    This shilling attack detection technique (Zhou et al. 2016) employs support vector
    machine and targets item analysis in the recommender systems. It works on Border-SMOTE
    strategy, which is utilized to reduce the class unbalance drawback in taxonomy.
    Therefore, the fine-tuning part, which is used to target items within the potential
    attack profile set, is analyzed. This system analysing the ratings of the items
    to observe the attack profiles. However, the disadvantage of the technique is
    that some genuine profiles are misjudged as an attack profile.


    # 9.6.2.9 Rating Deviation from Mean Agreement


    The rating deviation from mean agreement (RDMA) technique (Si and Li 2020; R.
    Burke et al. 2006) observes attackers testing average deviation of the profile
    for each item. It is weighted by the inverse of the amount of rating of the item
    to detect the attack profiles.


    # 9.6.2.10 Novel Shilling Attack Detection


    The novel shilling attack detection (Bilge et al. 2014b) method is used for specific
    attacks. It uses bisecting k-means clustering approach, which'
