  md: '# Predictive Analysis for Flood Risk Mapping


    # 2.2.5 Markov Model


    We have seen that whenever a succession of chance analyses frames a free preliminary
    process, the potential results for each examination are equivalent and happen
    with a similar likelihood [11, 12]. Further information on the results of the
    past investigations doesn''t impact our expectations for the results of the following
    test. The circulation for the results of a solitary trial is adequate to develop
    a tree and a tree measure for a grouping of n trials, and we can respond to any
    likelihood question about these trials by utilizing this tree measure. Current
    likelihood hypothesis reads procedures for which the information of past results
    impacts expectations for future analyses. At a fundamental level, whenever we
    watch a grouping of chance analysis, the entirety of the past results forecasts
    for the following test [6, 12].


    Markov chain calculates how much land is estimated to change from the latest to
    expected date [7]. In this method, the transfer probabilities are the output,
    which is a matrix that records the likelihood that each land cover will move to
    each other class[9, 12]. Through the Markov chain simulation, the analysis of
    two different dates of the LULC creates the transition matrices, a transition
    area matrix, and a set of conditional probability images. The transition probability
    matrix for the period of 2008–2015 was determined to predict the 2019 LULC map
    and any future date for prediction [13]. The probability of one pixel moving to
    another LULC or staying in the original LULC can be calculated by producing a
    transition matrix of probabilities. The transition matrix is generally important
    for predicting a future classification map [14]. If the hypothesis tested has
    no significant differences in the observed LULC and the predicted LULC, the model
    is considered successful for future predictions [15, 16].


