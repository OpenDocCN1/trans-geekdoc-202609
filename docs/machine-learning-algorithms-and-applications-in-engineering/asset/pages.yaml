    # 12.5.1 Generalization and Allocation of Batch Id


    The generalization process replaces the original value into a particular range
    of values (e.g.) if an individual''s age is 25, then it can be replaced in the
    interval of 20–30. The allocation of batch id prevents the privacy breaches across
    the tables to published only with batch id. The batch id, $b^i$, is allotted by
    using combinations of quasi-identifiers.


    Assume that we generalize the age as 25–30, and so on. The batch is allotted to
    each group as 1, 2 up to $n$ if $n$ distributions in a particular attribute. In
    the sample data set, three quasi-identifiers are found. To find the total number
    of possible combinations, let''s say that values of sex age and zip code are distributed
    in three groups. Therefore, the total number of batch id combinations is $2*3*1=9$.
    Out of these 9 possible combinations, any combination can be decided by the user.
    When the number of combinations is high, can, it becomes challenging to find the
    individual in the possible combination. Hence, batch id helps in preserving the
    privacy of the data. The complete architecture of the CBPP algorithm is shown
    in Figure 12.2.'
