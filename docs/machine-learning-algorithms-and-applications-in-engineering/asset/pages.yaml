    # 3.1.2 Risk Analysis


    Risk is referred to as the occurrence of undesired events while running a project,
    which creates a negative impact on the achievement of the goals of that project.
    Risk is the possibility of an unwanted or harmful event. Risk analysis is done
    by adopting different methods in order to check the probability of the happening
    of the risk and it is performed in order to remove or minimize the probability
    of the occurrence of the harmful events. Risk analysis is desirable as the occurrence
    of risk is directly proportional to the amount of losses faced in a project. Every
    technology or project has equal chance of being successful as well as becoming
    a failure and hence the analysis is done to reduce this chance, which is called
    the risk of failure (Kaplan 1981; Hastie, 2009; Hauge, 2015; Haugen, 2015; Khazad,
    2015).


    Risk analysis includes identifying the type of hazard that can be associated with
    the project, which may be a chemical hazard, mechanical hazard, or even technical
    hazard. It is a process that is analytical in nature and the aim is to know all
    the desired information related to undesirable events. It involves an analysis
    of the hazards that have occurred in the past and also the probability of occurring
    in future (Khazad, 2013a; 2013b). It not only analyzes hazards but also their
    consequences on the system so that appropriate measures can be taken. The main
    objective is to increase the chances of success and at the same time minimize
    the cost or investment on the project. As important risk analysis is, it is even
    more difficult to be performed. The traditional method of using employees requires
    a lot of time to complete the process (King, 2001; Kongsvik, 2015; Landducci,
    2016a, 2016b). But now with the growth of industries, the amount of data generated
    is very'
