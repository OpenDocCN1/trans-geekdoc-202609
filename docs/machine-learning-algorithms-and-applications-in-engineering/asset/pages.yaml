- pgno: 23
  md: '# Machine Learning for Smart Health Care


    Yet, an ML framework should monitor personal therapeutic responses, observe any
    side effects, and monitor general health or unusual deviations from normal. ML
    would assist in implementing the first individualized framework dealing on diagnosis
    and treatment, generating an estimated direction for therapy regarded as the new.


    ML could manage personal health over a lifespan via integrating and modeling data
    digitally and smartly. Managing health includes creating individualized frameworks
    for monitoring and precisely discovering anomalies, supporting health providers
    in digital diagnosis and treatment using patients'' data, and upgrading personal
    frameworks with recent diagnoses and therapies. Thus, it is data-intensive process
    that needs digital pattern for recognizing complex datasets. Managing health would
    be an ongoing learning process since frameworks would be upgraded with fresh data.
    Therefore, either creating novel forecasting frameworks or upgrading available
    ones along with further effort are required for identifying the potentials and
    barriers of such techniques with various applications.


    # 1.3 Opportunities and Limitations


    ML could contribute to transformative approaches in diagnosis and therapy; however,
    it is required to grow well-structured and high-quality datasets for enhancing
    the predictive power of ML techniques and limiting the amount of the required
    data for training and the complexity of the output representations. Speeding up
    in ML techniques for image recognition happened during the introduction of ImageNet,
    a group of tagged and ontologically attached images, and likewise efforts in biomedicine
    are required (Deng et al. 2009).


    High-quality datasets for ML in diagnosis and therapy needs tackling, financial,
    and legal obstacles, which usually lead to scattered and unstandardized data.
    Federated learning could technically solve issue via integrating scattered data
    across systems since moving of data is not required and personal privacy could
    be safeguarded. Home devices and wearables could be used to gather precise data,
    and ML could process such data to extract medical and analytic information from
    unstructured origins such as published literature and EHRs. Developing regulations
    for securely managing and analyzing health information (PHI), and legal and social
    standards, which determine adherence with them should be created. Both biomedical
    subjects and entities should be rewarded to participate in standardizing and sharing
    data. Likewise, drug and insurance companies supporting biomedical research should
    invest in the infrastructure along with collecting and analyzing data toward better
    quality datasets.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Machine Learning Algorithms and Applications in Engineering


    Rewarding techniques for sharing data, which boost variable datasets for learning,
    are also required, such as local and global standards for sharing data, which
    acquire data from both large hospitals and small clinics. ML applications, which
    enhance patients responses in large hospitals, might not suit small clinics because
    of variability in patients and general care. Yet, the ideal target of gathering
    health-related data for ML requires acquiring data from proper representative’
    populations for building precise ML frameworks that can be generalized to the
    diverse public. Hence, focused attempts considering factors patient condition
    before, therapeutic regimes, age, sex, race, ethnicity and ecological risks are
    needed (Goecks et al. 2020).


    A thorough analysis of ML techniques in medicine is required, particularly the
    functionality of an ML system is best tested through the learning of longitudinal
    predictions. An iterative ML technique might involve training with retrospective
    data, deploying algorithms, and evaluation of the acquired predictions. Deployment-gathered
    data, could retain and enhance the algorithm, followed by a cycle of testing for
    deployment. Assessing learning systems, like those used in monitoring health,
    which adapt to changes in behaviors or health conditions, would possibly need
    strengthening such cycle and applying deployment-gathered data in identifying
    both barriers and flaws. Besides, measuring confidence intervals is vital, as
    some ML applications would be further tolerating uncertain predictions than others,
    hence confidence intervals could inform making decisions.


    Iteratively training and deploying applications of ML holds regulatory limitations
    since the majority of diagnostic and therapeutic applications use fixed data.
    Upgrading models with novel data or adapting them for new diagnoses and therapies
    would require continuous assessment for the reliability and precision of the predictions.
    Thus, there is a need for real or simulated datasets, which are prospective and
    multidimensional and also costly for robustly assessing the applications of ML
    in medicine.


    # 1.4 Conclusions


    ML incorporates advanced algorithms working on disparate big data to reveal valuable
    trends that would be challenging to be figured out by even skilled experts. ML
    could promote health care by releasing the potential of health data. This chapter
    discussed how ML could promote healthcare via better medical diagnostics and precision
    or monitoring health, highlighting opportunities and successful early applications,
    and ending with challenges that hinder achieving the full potential of ML in health.
    With the growing powerful ML supercomputers and the infrastructure for gathering
