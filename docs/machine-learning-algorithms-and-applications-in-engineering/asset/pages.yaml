    # 9.6.2.1 Hilbert-Haung Transform and Support Vector Machine (HHT-SVM)


    The Hilbert-Haung transform and support vector machine (HHT-SVM) technique (Fuzi
    and Zhou 2014) has been employed to identify the profile injection attacks using
    the combination of support vector machine and Hilbert-Haung transform. The HHT
    is accustomed to transforming the rating series of the individual user profile
    for characterizing the profile injection attack. The SVM is used to detect profile
    injection attack. The disadvantage of this method is as soon as new types of attacks
    occur, the SVM classifier requires being re-trained. It is necessary for HHT-SVM
    to know about new kind of attacks incrementally, in real CFRs'' context, attacks
    changing dynamically.


    # 9.6.2.2 Re-scale AdaBoost


    This detection method improves the overall performance with respect to two aspects.
    Initially, it finds out on well-structured features from client properties. Then
    it makes hard identification circumstances to act simpler. Later, with reference
    to the general thought of re-scale Boosting (RBoosting) and AdaBoost, it tends
    to use a variation of AdaBoost, known the re-scale AdaBoost (RAdaBoost) (Yang
    et al. 2016). The RAdaBoost detection technique supports the extracted features.
    This implies that if the parameters are selected suitably, the RBoosting technique
    is basically an optimal boosting-type classification. The RAdaBoost may be employed
    in conjunction with several alternative sorts of the machine learning (ML) algorithms
    for upgrading the capability of SA recognition. This technique also increases
    stress on concerned attacks. On a troublesome classification task, it will clearly
    improve the predictive capability.


    # 9.6.2.3 Variable-Length Partitions with Neighbor Selection


    Variable-length partitions with neighbor selection (VLPNS) algorithm (Wei and
    Shen 2016) is designed to reduce the matter of unassured prediction accuracy of
    CFRS techniques against the SAs. It relies upon threshold setting. VLPNS has the
    particular property of using soft decision procedure that'
