    literature’s unstructured data and metadata. However, the existing data is incomplete
    or inaccurate, making the generation of meaningful relations difficult.


    # 1.2.3 Monitoring Health


    Treating complex diseases would be shifted from curative toward managing approaches.
    Such a wide approach for managing health would preserve health across several
    diseases and the natural aging process. Managing health would need continuous
    monitoring of all health aspects for likely diseases and personalizing therapies
    according to patients’ responses and the key role of ML. Figure 1.2 shows integrating
    data and ML for inclusive, and precision health monitoring where data collected
    at both houses or clinics are promising for better performance since they integrate
    more inclusive frameworks manage personal data and are adaptable in any setting.


    Beyond the clinical environment, wearables and intelligent home electronics could
    be used to manage health by gathering vast quantities of highquality health-related
    data to be used by ML techniques for recommending timely interventions, changing
    lifestyle, or referring to a health care provider for consultations. Today, wearables
    have in-built biosensors to monitor movement, pulsation, rates of respiration,
    and levels of oxygen, body temperature, and blood pressure, among other indicators.
    Test models showed


