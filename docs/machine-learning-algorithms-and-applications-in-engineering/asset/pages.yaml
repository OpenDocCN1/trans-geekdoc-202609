    # 9.2 Profile Injection Attack Method


    CFRS are broadly utilized in e-commerce markets, during which an opponent might
    misguide the recommender framework. Shilling profiles (SPs) are injected by the
    attacker to the target items to expand or reduce the recommending frequency (Lam
    et al. 2004). The shilling profile is also employed as a training sample to work
    out the recommendations for genuine clients. Therefore, the target items are nominated
    with additional frequency or less frequency (Gunes et al. 2014). Table 9.1 displays
    a general profile profile in a shilling attack.


    To eliminate detection, SPs could be visible as legitimate ones. A shilling profile
    (SP) mainly consists of four elements: (i) the items which are selected (iA) and
    its rating distribution $\delta(iA)$, (ii) filler items (iD) and its rating distribution
    $\sigma(ID)$, (iii) the items which are unrated ($\iota$) with null ratings, and
    (iv) an item which is targeted (iP) and its rating distribution $\gamma(iIP)$
    (Bhaumik et al. 2006, 2007, 2011). iA is specified for certain attack method.
    ID chosen'
