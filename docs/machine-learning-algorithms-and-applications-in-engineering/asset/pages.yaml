    # ## 7.1 Introduction


    The current study preprocesses the cancer patient data, and machine learning models
    will be trained with this data to classify breast cancer. The study mainly consists
    of five parts: (i) data collection and understanding, (ii) preprocessing, (iii)
    training the ML models, (iv) evaluation, and (v) deployment. We have extracted
    the required data from the images of cancer cells of 570 patients. We took 300
    attributes from the images to classify the cancer. The features are computed from
    a digitized image of a fine needle aspirate (FNA) of a breast mass. They describe
    the characteristics of the cell nucleus present in the image. For applying machine
    learning techniques on the data set, we need to preprocess and dispute the data
    to get a better data set. For analyzing the data set, we need specific Python
    libraries and packages like Pandas for data manipulation, NumPy for mathematical
    operations on the'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'data set, Matplotlib for data visualization, Seaborn for making heatmaps, Sklearn
    package for normalization of the data set. In data preprocessing, we remove unnecessary
    columns from the data frame, change categorical values to numerical values, and
    standardize the data.


    Machine learning is often used to train machines on how to handle the data more
    efficiently. Here, we have applied supervised learning algorithms to train the
    model. These include KNN, decision tree, logistic regression, and support vector
    machine (SVM). The main advantage of using machine learning is that, once an algorithm
    learns what to do with data, it can do it automatically. Then we evaluate these
    models using the Metrics library of Sklearn package. We select the model with
    high accuracy and deploy it to classify the cancer of the new patient using his
    cancer cells.


    # 7.1.1 Review of the Literature


    In the literature, it is found that artificial intelligence and Internet of Things
    (IoT)-based techniques are used to improve the accuracy of the diagnosis of the
    breast cancer and its prediction. We have provided some of the state-of-the-art
    machine learning and deep learning approaches, which are used to solve the problem
    of breast cancer.


    Arpit and Arun [1] optimized a neural network architecture by applying new crossover
    and mutants and proposed a genetically optimized neural network (GONN) to classify
    breast cancer.


    Ibrahim and Samsuddin [2] proposed a multilayer perception-based neural model
    for classifying breast cancer accurately and precisely.


    Liu et al. [3] proposed simulated annealing based genetic algorithm and cost-sensitive
    SVM to improve the classification model for breast cancer diagnosis.


    Zammal [4] presented a computer-assisted genetic algorithm integrated semi-supervised
    SVM to propose an intelligent breast cancer classification model.


    Helwan [5] developed an automated system for the classification of breast cancer
    based on feed-forward neural network using the back propagation and radial basis
    function algorithm.


    Based on the above-mentioned literature, it can be inferred that more sophisticated
    machine learning models are to be used for the classification of breast cancer.


    # 7.2 Methodology


    Here, we describe a few concepts and algorithms, which we have used for constructing
    the machine learning models for breast cancer classification.'
