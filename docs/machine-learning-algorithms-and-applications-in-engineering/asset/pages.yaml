    for users'' data. To assess the hazards, one must figure out the origin, consequences,
    and the results. To identify the origin, all the sources must be assessed to understand
    where things could go wrong. Then, it has to figured out how much are risks exposed
    to the outside environment. This stage is known as risk estimation in which individual
    systems are assessed to know the contributions of each source and functionality
    towards the risk (Oien, 2011; Noh, 2014; Nyvlt, 2015).


    Understanding the individual systems helps in forming connections and links of
    the systems with the risk being produced during development. If the risk is assessed
    during the development process, it can be easily cured and removed (Nyvolt, 2012).
    It also helps to predict which features can produce failures in time and can be
    continuously monitored and managed. Hence the qualitative analysis of risk assessment
    includes a detailed study of logical flow data and the system functionalities.


    Generally, the risks are represented in the form of diagrams, flow charts, and
    decision trees for better understanding. For risk assessment, some factors as
    the equipment used, the software developed, the functionalities produced, and
    target audience must be kept in mind. This step is very important in order to
    build the gap between the risk that is being predicted and that is being perceived
    (Paltrineri, 2017). This is because the risk predicted is generally statistical
    in nature and is based on the theory of probability and number of assumptions.
    So, in order to bridge this gap, a quantitative and numerical approach must be
    adopted rather than estimating on the basis of their frequency. This stage of
    analyzing the prediction with the risk is called risk evaluation and is part of
    risk assessment. Different tests are performed and various test drives are run
    to assess and predict the risk so that the final product is safe and successful.
    Also, variant data sets are created to keep track of failures in the past and
    to ensure that such hazards are not produced in future.


