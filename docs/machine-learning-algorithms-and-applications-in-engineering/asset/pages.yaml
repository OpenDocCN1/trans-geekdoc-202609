    review shows that the time-series modeling approach has been extensively used
    for long- and medium-term forecasting. AI-based techniques for short-term forecasts
    remain prevalent in the literature [4]. Johannesen et al compared various regression
    tools based on the lowest MAPE value and concluded that random forest regressor
    provides better short-term prediction (30 min) and K-nearest neighbor (KNN) offers
    relatively better long-term load prediction (24 h) [5]. Ahmad and Chen determined
    that whereas is responsible for the change in energy consumption pattern in the
    domestic, commercial, and industrial sectors and that LSBoost performance is more
    than the LMSR and NARM for seasonally, and yearly ahead intervals [6]. Fattah
    et al. developed an ARIMA model for demand forecasting of a product using the–Jenkins
    time-series approach [7]. For understanding the nature of time series and the
    objective of analysis, Athiyar et al. explained and applied the concepts of LSTM,
    ARIMA, and CNN [8]. Kaushik et evaluated evaluated ability to predict patients’
    weekly average expenditures on certain pain medications. Two statistical models,
    persistence (baseline) and ARIMA, multilayer perceptron model, LSTM and an ensemble
    model used to predict the expenditures on two different patients [9]. Ahmad et
    al used artificial neural networks (ANN) with a nonlinear autoregressive multivariable
    inputs model, mult-variate linear regression model, and adaptive boosting model
    to predict energy demand in a smart grid environment [10]. Allee et al. used a
    data-driven approach for demand prediction survey and smart meter data from 1,378
    Tanzanian mini-grid customers. Applied support vector machines'
