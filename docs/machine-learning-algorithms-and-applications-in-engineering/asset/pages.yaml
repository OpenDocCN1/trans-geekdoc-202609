    # 13.5.3 Model Evaluation


    The evaluation of this proposed model can be done using the diagnostic plot is
    shown in Figure 13.24.


    Standardized Residuals: The residual errors appear to have a uniform variance
    and fluctuate around a mean of zero. The density plot indicates a normal distribution
    with a mean of zero.


    Normality: The dots on the Q-Q plot should be completely aligned with the red
    line. Any large variances would indicate a skewed distribution.


    The ACF plot, also known as the correlogram, illustrates that the residual errors
    are not autocorrelated. Any autocorrelation would imply that the residual errors
    have a pattern that isn’t explained by the model. As a result, you’ll need to
    add more Xs (predictors) to the model. In general, it appears to be a decent match.


    # 13.6 Conclusion: Business Benefits of the Models


    # 13.6.1 Network Traffic Classification


    Network traffic categorization is a method that divides computer network traffic
    into different classifications based on various criteria (such as port'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Classification of Network Traffic on ISP Link during COVID-19


    number or protocol). Using classified network traffic, you may do tasks like monitoring,
    discovery, control, and optimization. The overall purpose of network traffic classification
    is to improve network performance.


    The packets can be labelled once they have been classified as belonging to a specific
    application. These markings or flags will assist the network router in determining
    the proper service policies for certain network flows.


    This study''s classification approach can be used in conjunction with network
    or packet monitoring software. This allows us to create a real-time dashboard
    that shows application-specific network use in real time. This will aid in the
    rapid and efficient regulation of traffic flow across any internet link.


    # 13.6.2 Time Series Prediction


    Due to the introduction of new technology, industries, and applications, internet
    traffic has increased dramatically during the last decade. The Internet of Things
    (IoT), Cloud computing, and data-center applications are all growing in popularity.
    Networks cope with ever-increasing traffic demands while maintaining a high level
    of service to users. As a result, effectively networking equipment usage becomes
    critical. If network traffic can be properly forecast, this task can be completed
    effectively. Many networking sectors, such as energy conservation, network resource
    management, and wireless sensor networks, can benefit from accurate traffic forecast.


    One advantage of traffic prediction is it saves energy. Traffic prediction can
    be utilized in core network routers/switches to save a large amount of power.
    The number and sophistication of processors employed in these network devices
    are expanding in response to rising traffic demands and computing requirements,
    resulting in increased power consumption. High power consumption and accompanying
    expenses result in increased network operational costs. If traffic can be turned
    down to save power during low traffic times. Construction of greener traffic-aware
    networks can accurately estimate of future traffic loads.


    Second, in order to make an optimum use of network resources, traffic forecast
    is essential. Accurate network traffic prediction at access points provides efficient
    resource allocation to ensure acceptable service quality.


    Finally, when new applications such as e-commerce and online banking emerge, identifying
    and preventing network abuse is becoming increasingly challenging due to increased
    traffic and network complexity. Anomaly detection is one method of preventing
    network abuse. An assault can be detected by a considerable divergence from typical
    traffic behavior. The accuracy of traffic forecast is directly proportional to
    the performance of anomaly detection.'
