- pgno: 312
  md: '# 18.1 Introduction


    The problem of learning visual representations effectively without human supervision
    can be done by contrastive learning. This work has been based on learning visual
    representations by using the SimCLR framework [1].


    Visual representations are image vectors on which supervised or unsupervised classifiers
    can be trained for accurate image recognition and classification. These representations
    can be learned by training deep learning models like ResNets on labeled datasets
    like ImageNet. But labeling and annotating data is a time-consuming and elaborate
    process and can be avoided by using alternate learning techniques like self-supervised
    learning where the training data is automatically labeled by finding and utilizing
    correlations between various input features.


    Contrastive learning of visual representations can be done by efficiently finding
    similar and dissimilar images. For understanding contrastive representation learning,
    we interpreted the key elements of the SimCLR framework which showed that:


    +   * A combination of various different data augmentation operations is important
    for the contrastive prediction tasks to yield effective representations and stronger
    data augmentation benefits unsupervised contrastive learning more than supervised
    learning.

    * Nonlinear transformation, which has the ability to learn between the illustration
    and the contrastive loss, is introduced and considerably improves the learned
    representations'' quality.

    * Normalized embeddings and an adjusted temperature positively affects representation
    learning with contrastive cross-entropy loss.

    * Larger batch sizes and longer training benefits contrastive learning more compared
    to its supervised counterpart.


    The rest of the chapter will describe the background of previous work in the field
    of using self-supervised and contrastive learning to achieve state-of-the-art
    results; how SimCLR framework has been used and implemented in this work; visualization
    of the results obtained from the implementation and future scope and applications
    of our work.


    # 18.2 Background


    In this chapter, we explored and highlighted how a simple framework for contrastive
    learning of visual representations referred to as SimCLR [1]'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Image Classification Using Contrastive Learning


    helps us to learn the visual representations. We have used ResNet-18 and trained
    our models for 20 epochs to get a particular convergence and how SimCLR benefits
    more from unsupervised contrastive learning than supervised learning.


    The idea of classifying representations of an image on the basis of similarity
    with each other under small transformations dating long back. Dating back to those
    approaches [2], which used to learn representations by contrasting positive pairs
    against negative pairs, SimCLR extended them by highlighting and implementing
    recent advances in data augmentation, neural network architecture, and contrastive
    loss. The individual components of SimCLR have previously been researched upon,
    but here the improved and integrated version, a result of a combination of different
    design choices, which provides better performance has been used and described
    in the Results and Discussion section of the chapter.


    SimCLR has been used as the method of contrastive learning as many ways by which
    SimCLR is better for visual representation than previously proposed contrastive
    representation methods are:


    +   - DIM/AMDIM [3][4] modified a ResNet and placed restrictions on the receiving
    fields of the convolutional neural network (e.g., 3 x 3 Convs were replaced with
    1 x 1 Convs). In SimCLR framework, the decoupled task, which has to be predicted,
    and neural network base encoder architecture uses the final vector of two augmented
    image vectors for prediction, thus needing powerful ResN.

    - CPC v1 and v2 [5][6] used a deterministic strategy to define the context prediction
    task and a context aggregation network (for instance, a Pixel-CNN). SimCLR framework
    does not need such a context aggregation network as it decouples the prediction
    task and the neural network encoder. In both pointers discussing different methods,
    it is important to note that SimCLR uses simplified data augmentation and that
    its NT-Xent Loss function uses normalization and adjustment of temperature to
    get better similarity scores.

    - InstDisc, MoCo, and PIRL [7][8][9] generalized the Exemplar approach originally
    proposed by [10] and leveraged an explicit memory bank. SimCLR, on the other hand,
    does not use a memory bank but in-batch example sampling is utilized.

    - CMC [11] used a separate network for each view, where SimCLR shares only a single
    network among all the random augmented views.

    - Similarity between augmented and un-augmented copies of the original image are
    enhanced to the maximum possible value, but SimCLR applies data augmentation fairly
    to both symmetric branches of its framework [12].'
  merge: -1
  img_proc: true
