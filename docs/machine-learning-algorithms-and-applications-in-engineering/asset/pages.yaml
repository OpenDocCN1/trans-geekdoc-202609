- pgno: 148
  md: '# Machine Learning Algorithms and Applications in Engineering


    Next-generation sequencing (NGS) (Slatko et al., 2018) has boosted a spectacular
    increase in protein sequence databases as the number of genome and metagenome
    sequencing projects for many species has grown. It reached a point where the experimental
    definition of protein function could not handle the vast amount of data sequences
    available. In other words, the production of new collections of sequences increases
    exponentially, the effort of the teams carrying out in vitro or in vivo experiment,
    and the curators, has not been able in the same way, so that there is a rising
    number of protein sequences without their supervised or curated annotation being
    possible. It is, therefore, necessary to develop computational tools that take
    charge of this work with the greatest accuracy. From that moment on, the panorama
    invited the development of new functional annotation techniques.


    # 8.3 Automatic Annotation of Proteins


    The simplest and most widely used method to perform the task of automatically
    determining protein functions is based on homology searches. This is achieved
    through programs that search for similarities between sequences. For example,
    Blast2GO (Götz et al., 2008) is one of the most widely used tools of this type,
    making use of the BLAST algorithm (Camacho et al., 2009) to try to assign to not
    annotated proteins the function(s) of their homologues, which have been previously
    inferred and the function is known. However, this analysis depends directly on
    the databases involved and the annotation of the sequences in them. It is therefore
    relevant to consider the propagation of the error, that the automatic propagation
    of the error must be expected, or if the database is used too small, the resulting
    annotations may be unsatisfactory.


    UniProt Consortium, 2018 is the consortium that maintains a centralised database
    that gathers all the functional information on proteins, with precise, consistent
    and rich annotation. This repository, UniProt Knowledgebase (UniProtKB), is a
    protein sequence bank consisting of two sections: UniProtKB/Swiss-Prot, which
    currently contains 562,253 manually annotated and reviewed entries, and UniProtKB/TrEMBL,
    which contains 180,694,447 entries annotated by unsupervised, computer techniques
    and which therefore require full manual annotation.


    However, in the situation of an unknown protein that not have significant similarity
    to any known protein, computational approaches can be used to predict protein
    sequence or structure information to infer properties that are common to proteins
    of the same function. These methods assume that proteins of the same function
    adapt similarly to the same conditions. They use information such as the'
