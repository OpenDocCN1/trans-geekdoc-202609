    # 11.2 Selective Laser Sintering Additive Manufacturing


    Powder bed fusion (PBF) is an AM process. It employs a laser energy source in
    the selective laser sintering additive manufacturing process to melt and fuse
    selective regions of a powder bed. A typical SLS additive manufacturing process
    is shown in Figure 11.1. Many preparatory operations are done to make an AM part
    that the digital CAD model processing, STL file generation, STL file import in
    AM machine and data processing, material powder preparation, the protective atmosphere
    and AM machine warm. In SLS process, the parts are built on a metallic platform
    to prevent the thermal strain-induced deformation and for right orientation to
    reduce the support structures. Now, a thin powder layer is kept on the platform.
    Next, a cross-section of sliced CAD model is scanned employing a high-power laser
    beam in order to melt partially and fuse the powder layer. Here, a laser beam
    spot travels along a scanning path. The scanning pattern is produced using the
    CAD model of the product. Then, the platform travels down a distance of the layer
    thickness.


    Now, a powder supply layer is moved up in powder supply port to transfer the powder
    over the build platform. A new powder layer is'
