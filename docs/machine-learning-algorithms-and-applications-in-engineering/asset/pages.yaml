    #  11.3.4 Learning Type


    This section describes types of learning as below.


    *Supervised Learning*: Supervised learning is a learning in which a particular
    data set for training is applied to train the machine learning system. Here, the
    learning is known as supervised, since the training data sets are man-made. It
    does not show that people validate the results. The process to classify the outputs
    of the machine system corresponding to given inputs is known as labelling. In
    other words, one directly indicates whether the results are correct or are the
    desired outputs corresponding to every input. It requires utmost care to ensure
    the training data sets are sufficient to generate the correct results. These must
    include the full variety of the inputs and desired outputs. After the training,
    a test of data is applied for the validation of results. The results is used as
    the training set and the process is again repeated. For example, a person is trained
    exclusively in mechanical engineering. If he were told to work on a civil engineering
    problem, the results wouldn''t be as good as desired since the person did not
    have the proper training for civil engineering.


    *Semisuvised Learning*: In the semisvised approach, portion of data set has the
    form of labelled training data sets and other data without label. In reality,
    the input data set is labelled, since labelling requires a skilled person. This
    small labelled data set is employed to interpret the unlabelled data set.


    *Unsupervised Learning*: Unsupervised learning is a learning type that does not
    employ the training data sets. It is normally employed to identify the patterns
    in data without having any existing right answer. For instance, on employing the
    unsupervised learning for training a face identification machine system, the machine
    system may group the data in groups, some groups out of those may be faces. Grouping
    techniques are often instances of the unsupervised learning. The unsupervised
    learning enables the machine to learn from the data the things without knowing
    in advance. It is an important technique to find the hidden structures in data
    set.


