    # 10.1 Introduction


    This first section introduces the topic presented and the related state-of-the-art
    developments. Time data mining (TSDM) mainly consists of the following tasks:
    anomaly detection (Blazquez-García et al., 2020), classification (Ismail-Fawaz
    et al., 2019), analysis and preprocessing (Hamilton, 1994), segmentation (Keogh
    et al., 2004), clustering (Liao, 2005) and prediction (Weigend, 2018). More concretely,
    this chapter is focused on the applications of time series preprocessing, segmentation
    and prediction to real-world problems.


    Time series analysis and preprocessing are considered previous steps for other
    TSDM tasks. One of the most important tasks is the imputation of missing values
    in time series, which is essential for the application of'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Machine Learning Algorithms and Applications in Engineering


    succeeding methods successfully. It is very common that real-time series, especially
    those collected by sensors, buoys or real physics systems, can have gaps of information
    that may stop working due to different reasons. In this context, many applications
    have been proposed in recent years. Typically, the imputation of missing values
    has been done by interpolating the observational feature space, without considering
    any hidden dynamics. Zhou and Huang (2018) proposed a model that could capture
    the latent complex with a novel iterative imputing network and demonstrated its
    performance by its application to a meteorological benchmark set outperforming
    the state-of-the-art methods. More recently and following the idea of capturing
    the dynamics from time series, Belda et al. (2020) have developed a software called
    DATimeS, which uses machine learning fitting algorithms such as Gaussian process
    regression (GPR). It has resulted in powerful software for the reconstruction
    of image vegetation time series, which tend to be discontinuous over cloud cover.


    Time series segmentation consists of the division of a time series into several
    consecutive subsequences, trying to achieve different objectives. More formally,
    they are defined as follows: given a time series $Y=\{y_i\}$, for the time indexes
    $i=1..N$, the procedure attempts to separate the values of $Y$ into a set of $l$
    segments. In this, the time indexes are split $s_1=\{y_1,...,y_{i_1}\}, s_2=\{y_{i_1},..,y_{i_2}\},..,s_l=\{y_{i_{l-1}},..,y_N\}$,
    where the ascending ordered cut points are expressed as $\hat{t}_1<\hat{t}_2<\dots<\hat{t}_{l-1}$.
    Considering the


    ![](img/ad546abeb2fb65484cb3036468c406cd_176_0.png)


    FIGURE 10.1

