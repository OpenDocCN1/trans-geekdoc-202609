  img_proc: true
- pgno: 35
  md: '# Predictive Analysis for Flood Risk Mapping


    # 2.1.2.3 Adaptive Neuro Fuzzy Inference System (ANFIS)


    Fuzzy logic as a simplified mathematical model works to incorporate the knowledge
    of the expert into a fluid inference system. Fuzzy interference system further
    limits human learning through a less complex approximation feature, which offers
    great potential for nonlinear designing of extreme hydrological occurrences such
    as floods. Neurofuzz has a back-propagation neural network (BPNN) variant and
    the least square test of error, quick and easy to implement, effective learning,
    and good generalization skills [1].


    # 2.1.2.4 Wavelet Neuro Networks (WNN)


    Wavelets transform (WT) can be used to analyze local time-series variation to
    extract information from different data sources. To boost data quality, it supports
    accurate decomposition of an original time sequence. This incorporates wavelet
    theory and the neural network (NN) in one theory. WNN, which incorporates WT and
    FFNN, and the wavelet-based regression model, which integrates WT and multiple
    linear regression (LR), were used to forecast floods in time series [1].


    # 2.1.2.5 Support Vector Machine (SVM)


    SVM is a supervised learning function that functions on the theory of statistical
    learning and the rule of structural risk minimization. With huge popularity among
    hydrologists for flood prediction, SVM and SVR were used as the alternative ML
    methods to ANNs [1]. It is ideal for linear and nonlinear classification as well
    as efficient input mapping into feature spaces. However, a high cost of computation
    and disappointing performance make it a lesser preferred option.


