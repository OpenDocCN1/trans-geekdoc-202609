  md: '# Machine Learning Algorithms and Applications in Engineering


    # 2.2.2 Remote Sensing


    Earlier, when no remote sensed data was available, changes in LULC patterns were
    detected by tracing papers and topographic sheets. But that approach has been
    slow, unsuccessful, and unreliable. Wide areas of study involved a considerable
    amount of time, effort, and cost [5, 6]. Conventional solutions are labor-intensive,
    time-consuming, and less often offered. Therefore, the preparation of detailed
    land and cover maps and tracking adjustments at regular intervals of time is comparatively
    simpler with the advent of satellite remote sensing techniques [7]. In the event
    of inaccessible areas, the only method of data acquisition is by applying this
    technique. Quantum geographical information system (QGIS) is the software used
    for remote sensing purposes.


    # 2.2.3 LULC Map Creation


    LISS—III images were used in the study marked in the years 2011 to 2015. The processing
    of the image and classification was carried out using QGIS version 3.3 Zanzibar
    [8, 9]. Normalized difference water index (NDWI) is used to monitor changes related
    to water content in bodies, using green and NIR wavelength.


    > NDWI = (NIR - SWIR)/(NIR + SWIR)


