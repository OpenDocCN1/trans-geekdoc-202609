    # 6.2.1.3 Magnetic Resonance Imaging (MRI)


    Researchers committed that this is a modern technology for brain imaging compared
    to EEG/EEG. In this technology, the concept of magnetism is applied instead of
    electrical activities [43]. Magnetic resonance imaging (MRI) is a radiology-based
    scanning technique that uses the concept of magnetism, radio waves, and computation
    to produce images of body structures. This is a tube-like structure surrounded
    by a large circular magnet component which is inserted into the magnet cylinder.
    The associated magnet creates a strong magnetic field that aligns the protons
    of hydrogen atoms, which are then exposed to a beam of radio waves [45]. This
    spins the various regions of the brain, and they produce a faint signal that is
    detected by the receiver of the scanner. A software tool processes the receiver
    information, which produces an image. The generated image and resolution are quite
    detailed, and it can detect tiny metabolic changes of structures within the cortical
    regions [46].


    Dream researchers use MRI for detecting active regions within the brain during
    dreaming. Using the MRI technique, very small active regions can also be easily
    and precisely. Metabolic conditions within the neuron cells show the activities
    happening during REM sleep [47].


    # 6.2.1.4 Magnetoencephalography (MEG)


    The basic concept of MEG is also magnetism, but unlike MRI, in this technology
    any magnet is not used. It is based on the magnetic property of blood. Magnetoencephalography,
    or MEG scan, is an imaging technique that identifies brain activity and measures
    small magnetic fields produced in the brain [48]. The scan is used to generate
    a magnetic image to pinpoint the source of seizures. In this imaging technique,
    magnetic fields are detected by extremely sensitive devices [49]. This device
    is known as superconducting quantum interference device (SQUID), frequently used
    to detect the magnetic field. The MEG scanner is used to detect and amplify magnetic
    signals produced by the neurons of various active regions of the brain, and unlike
    MRI, it doesn''t emit radiation or magnetic fields [50].


    Comparative study of EEG, ECG, MRI and MEG signals acquisition modalities, is
