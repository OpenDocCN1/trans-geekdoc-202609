    # 16.3 Proposed Methodology


    The following problems are faced:


    +   - Which material to select for different types of fractures.

    - Biocompatibility and mechanical properties of materials.

    - What composition materials are needed.

    - Take a long time to check degradation behavior.


    Machine learning is a revolutionary application that can be applied in different
    ways in different industries. In this chapter, machine learning is applied for
    the prediction of the bone healing process after the occurrence of fractures in
    different parts of the body. For this, biodegradable material selection and its
    degradation rate are very important factors that need to be predicted and optimized
    for fast healing.


    Some of the properties need to be studied while selecting the materials for manufacturing
    of implant devices.


    **Modulus of elasticity:** Elasticity must be comparable to natural bone, that
    is, ~20GPa for uniform stress distribution at implant for reduced relative movement
    at implant-bone interface.


    **Tensile strength:** Implants should have high tensile strength, which lowers
    the stress at fracture interface.


    **Yield strength:** Implants should have high yield strength to prevent brittle
    fracture under cyclic load.


    **Elongation rate:** It is the measure for deformation in implants that determines
    ductility.


    Degradation rate: Degradation rate should be related with the healing rate. Implant
    materials should be dependent on the length of time that it is necessary to keep
    them in the body.


    **Cytotoxicity:** Implants should not be toxic to cells or tissues.


    In this chapter, an algorithm is proposed for the prediction of material properties
    and its healing process according to the application area. Deciding the implant
    material and its composition is a very confusing task, such as which material
    is perfect to take as base material and its composition. The researcher'
