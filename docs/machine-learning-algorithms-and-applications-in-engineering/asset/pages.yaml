  md: '# 5.2 Challenges and Areas of Improvements


    While there are multiple steps of gesture analysis as described by multiple authors,
    some gradation steps create more challenges than other methods. After discerning
    through multiple research articles and literature published till date, given below
    are selected methods that create more challenges in the process of gesture analysis
    and recognition.


    # 5.2.1 Image Acquisition Challenges


    Capturing or acquiring images is done via multiple sources by the aid of camera
    or other image-capturing devices. This is the primary step of any gesture analysis
    or recognition framework and algorithm. When images are captured from a person
    or researcher, physical aspects like angle of picture and background-colour contrast
    are taken care of, but when this task is performed by an automated machine, image
    capturing might not be done effectively [15]. Issues like image capturing frame
    and background colour contrast create further issues in steps like gesture detection
    and unique gesture identification. While hand gesture detection frameworks become
    robust and effective, computer vision is still an abstract concept to people and
    image-capturing cameras are placed properly by the individual using the Sa. So,
    the placement of cameras creates issues in later phases of gesture analysis, detection
    and identification [16]. Other issues in image capturing include loss of depth,
    varying speed of the performer, inability to identify the difference between two
    gestures and spatial or temporal inconsistencies [17]. While the aforementioned
    constraints are specific to a scenario, there are many mundane issues that occur
    during the same including complicated or busy background, loss of focus due to
    busy background, real-time monitoring constraints and others. The image capturing
    object, that is camera, and its specifications, also plays a vital role in image
    acquisition and its attributes such as colour, quality, resolution and number
    of frames per unit time or frame rate. 3D image capturing amplifies these constraints
    as more accurate and high-resolution camera is required here.


    # 5.2.2 Gesture Tracking, Segmentation and Identification Challenge


    Gestures have a certain degree of rotation, that is, the degree or directional
    radius where they move freely; the higher is their degree of rotation, higher
    is the complexity in gesture analysis and identification. While this appears'
  merge: -1
