    AMAE (the average of classification error made for each class). This methodology
    could lead to an improvement in the safety and profitability of aviation operations
    at airports by low-visibility events.


    # 10.2.4 Prediction of Other Convective Situations


    As mentioned in Section 10.2.3., there is a great number of phenomena interrupting
    the proper operation of airports. Not only do they cause queues to the passengers
    but they also increase the workload of the operators and workers (Cao and Cai,
    2016). Thus, anticipating this sort of phenomena has a significant impact nowadays.
    In this way, several proposals have been presented in the literature, trying to
    improve our knowledge about convective situations and also aiming to improve the
    current systems (Wang et al., 2014). At the present time, most of the approaches
    are based on stability indices derived from the temperature and humidity, such
    as the lifted index or the convective available potential energy index. Even though
    these'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'indices have been proved to be useful in the prediction of conditions related
    to convective situations, their performance can be increased by combining them
    with ML techniques, which have also been proved to be excellent when dealing with
    atmospheric issues (McGovern et al., 2017).


    A convective cloud formation problem was considered by the author of the chapter.
    Data collected from the airport of Madrid-Barajas (Spain) for five years (2011
    to 2015) was used to present two novel approaches to the literature. The inputs
    considered in the problem were a combination of atmospheric variables measured
    over the vertical with some proper stability indices. The main goal of the study
    was the prediction of convective situations at 2 hour horizon. In this regard,
    two proposals were made to this problem: the first one (Guizo-Rubio et al., 2020b)
    consist of tackling the problem from normal classification point of view. Each
    event was given one of the following categories: clear (no convective clouds sighted),
    TCU (cumulus congestus sighted), CB (cumulonimbus clouds sighted) and TS (thunderstorm
    sighted). As can be imagined, this problem is highly unbalanced when there were
    more patterns than TCU, CB or TS. Therefore, in this work, we analysed the performance
    of ANN trained by a MOEA, aiming to achieve the best global performance without
    prejuding the smallest class (in this case, the TS). The results achieved that
    hybrid ANN (mixing basis functions in the hidden layer) are an excellent approach
    for this kind of unbalanced problems.


    On the other hand, the second proposal in this field was tackled from the ordinal
    point of view (Guizo-Rubio et al.). Besides considering that the classes followed
    an order relationship among them, in this work, an oversampling method is previously
    applied as a preprocessing step, aiming to balance the data set as much as possible.
    After that, ordinal methods were applied to resulting the best results, improving
    also the results achieved by terminal aerodrome forecasts (TAFs), which are products
    available on the aerodrome that give concise statements of the expected meteorological
    conditions, for all the categories.


    # 10.3 Summary and Other Related Works


    This chapter presents a set of TDM applications using ML. The tasks the chapter
    focuses on reconstruction, segmentation and prediction, all of them applied to
    time series data. The main applications presented, from the reconstruction of
    mixing values in wave height to the prediction of low-visibility situations in
    airports, provide the data in the form of time series. The combination of time
    series data with the application of automatic ML techniques to solve these real-world
    problems have been proved to have an excellent performance.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# ML Applications in Real-World Time Series Problems


    The authors of this chapter have addressed some other applications in realworld
    problems since time series can be found in a wide variety of fields, as was mentioned
    above. A GA was proposed in combination with a likelihood-based segmentation procedure
    to automatically recognize financial patterns in European stock market indices
    (Durán-Rosal et al., 2017a). The detection and prediction of extreme waves using
    the retrieved time series obtained by oceanic buoys were also solved by applying
    a two-stage algorithm (Durán-Rosal et al., 2017b). First, a segmentation algorithm,
    resulting from an evolutionary approach hybridized with a likelihood-based segmentation
    distribution, was used to detect the extreme events. Second, an evolutionary ANN
    was proposed to predict them. Finally, in Guijo-Rubio et al. (2020d), evolutionary
    ANNs were successfully applied for the prediction of global solar radiation at
    the radiometric station of Toledo (Spain) using satellite-based measurements.

    Apart from this, there is a vast amount of works using time series in other applications.
    Therefore, the potential of this type of temporal data is significant due to the
    wide variety of solutions to solve these problems by ML techniques. The future
    lies in the massive collection of data in real time, its processing and the instantaneous
    generation of automatic ML techniques to extract and knowledge from them.


