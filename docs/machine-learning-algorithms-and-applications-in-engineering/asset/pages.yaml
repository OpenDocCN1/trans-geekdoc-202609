    ```


    where $I$ represents the set of items. $R_{ik}$ and $R_{jk}$ are the ratings users
    $i$ and $j$ gave to item $k$. $\hat{R}_i$ and $\hat{R}_j$ are the average ratings
    of user $i$ and $j$, respectively.


    Finally, using the kNN formula, the predictions for user $i$ and item $b$ can
    be computed


    ```

    $P_{it} = \bar{R}_i + \sum_{j=1}^k \frac{W_{ij}(R_{jk} - \bar{R}_j)}{\sum_{j=1}^k
    W_{ij}} \quad (9.2)$

    ```


