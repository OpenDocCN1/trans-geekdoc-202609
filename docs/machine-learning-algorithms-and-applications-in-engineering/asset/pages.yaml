    if they are to be used inside the human body [3–5].


    Orthopedic materials are implanted near the bone fracture to provide support and
    to heal the bone tissues. The end of fractured bones is connected to implant devices,
    which are fixed with metal pins or screws. The healing of fractured bones, these
    screws and pins are removed. If these screws are made of non-degradable materials,
    after healing, they need to be removed by a second operation.'
