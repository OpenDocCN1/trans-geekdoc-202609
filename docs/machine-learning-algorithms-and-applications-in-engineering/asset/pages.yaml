- pgno: 9
  md: '# Organization of the Book


    This book is organized into 18 chapters. A brief description of each chapter is
    presented below.


    Chapter 1 reports successful ML models in smart health care through clinical applications
    such as medical diagnostics and precision or monitoring health, their potential,
    and limitations. With the increasing power of supercomputers, ML developments
    would have the proper environment for managing health such detecting diseases
    precisely and early, improving diagnosis, and better therapies.


    Chapter 2 proposes predictive ML models for assuring exact models in recognizing
    and mapping flood hazard territories. The calculations obtained through ML techniques
    lead to hazard exhaustion, arrangement suggestion, alleviating loss of helpful
    lives, and creating flood-related property harm.


    The main purpose of Chapter 3 is to identify the flaws in current air quality
    and recommend measures or policies to improve it so it is safe to consume. Because
    each country employs a different scale for evaluation, the data provided by the
    Central Pollution Control Board of India are utilised to analyse the level of
    air in the zone under investigation.


    Chapter 4 implements an expert system model for solving the problem associated
    with the precise prediction of the dynamic trajectory of an autonomous vehicle.
    This was accomplished by deriving a new equation for determining the lateral tire
    forces and adjusting some of vehicle parameters under road test conditions. A
    universal approach to performing the reverse engineering of electric power steering
    (EPS) for external control is also presented in this chapter.


    Chapter 5 proposes a speech recognition model that compiles contemporary expertise
    on the detection of gestures and all mannerisms while proposing methods for inclusivity
    of a wider audience, with a prominent emphasis on communication disabilities.
    Furthermore, the work done in this chapter may culminate in the development of
    real-world applications such as determining the attentivity of students in real
    time.


    Chapter 6 covers the fundamental phenomenon of brain-computer interface as an
    emerging technology that may help become possible to communicate dreams into real
    dream through modern technologies. This chapter contains only the essential concepts
    and theories in integration for developing a deep learning-based model for mapping
    dream contents. The first part of the chapter narrates dream theories and related
    cortical regions, whereas the second one concentrates briefly on pillar technology
    brain-computer interface.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Organization of the Book


    Chapter 7 proposes the use of ML algorithms to classify breast cancer more efficiently
    through the exploitation of existing data on cancer. This chapter examines the
    cancer patient data obtained from images, how the data is preprocessed, how different
    ML models are trained, and chooses the best-trained model for the classification
    of breast cancer. The current study helps not only in identifying the best ML
    model to classify cancer but also to formulate a process of diagnosing breast
    cancer based on the preprocessed data obtained from the raw images of breast cancer.


    Chapter 8 focuses on the prediction of protein functions, addressing the problem
    from a computer science (machine learning-based) perspective. Indeed, it can be
    seen as an overview on the topic of prediction of protein function aimed specially
    at computer scientists and researchers who work on machine learning. It will attempt
    to formally define the multilabel problem of protein function prediction, to explain
    its magnitude and importance, and why it remains as an open and challenging problem
    nowadays.


    Chapter 9, the profile injection attack methods, collaborative filtering in recommender
    systems, and shilling attack detection schemes are discussed from an ML perspective.
    The shilling attack detection technique works with two parameters, namely rating
    parameter and rating and time interval. Based on the working parameters, the shilling
    attack detection techniques have been classified. They also have been classified
    based on their output. A brief discussion on every scheme has also been presented.


    Chapter 10 highlights some of the primary time series data mining tasks, among
    which time series preprocessing, segmentation, or prediction are widespread in
    the literature. ML techniques along with other time series approaches are detailed
    throughout a set of real-world applications, such as the wave height time series
    reconstruction, the detection, and prediction of tipping points in paleoclimology
    time series, the forecasting of low-visibility events produced by the existence
    of fog or convective situations, among others.


    Chapter 11 uses ML algorithm for predicting quality of a product in terms of minimum
    shrinkage ratio produced by selective laser sintering (SLS) using some key parameters
    including surrounding temperature, laser scanning speed, layer thickness, scanning
    mode, hatch distance, laser power, and interval time.


    Chapter 12 proposes class batch partitioning (CBPP) algorithm to provide an optimal
    balance between utility and privacy for data publishing of 1-M micro data with
    multiple sensitive attributes.


    Chapter 13 focuses on assessing the performance data obtained from real networks
    during the COVID-19 pandemic using scripts and existing applications for monitoring
    apps and networks in real time.


    Chapter 14 highlights the integration of AI/ML for 5G network considering different
    constraints.'
  merge: -1
  img_proc: true
