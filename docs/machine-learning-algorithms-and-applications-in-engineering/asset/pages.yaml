    # ## 1.1 Introduction


    Machine learning (ML) incorporates advanced algorithms working on disparate big
    data to reveal valuable trends that would be challenging to figured out by even
    skilled experts. Nowadays, ML applications spawned several disciplines such as
    gaming (Silver et al. 2018), suggesting podcasts (Batmaz et al. 2019), and self-driving
    cars (Bojarski et al. 2016) while in medicine, the examples are the human genome
    project (Venter et al. 2001) and the cancer omics (genomics and proteomics) (Zhang
    et al. 2019; Ellis et al. 2013). Gathering and exploring health-related big data
    has the potential to shift medicine into a data-centered and outcomes-focused
    field with advances in detecting, diagnosing, and managing diseases. Molecular
    and phenotypic datasets developed, covered genetic examination for individualized
    cancer therapy, high-resolution three-dimensional anatomical body parts’ images,
    histological examination of biopsies, and smartwatches with biosensors for monitoring
    heart rates and alerting about abnormalities


    DOI: 10.1201/9781003104858-1'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Machine Learning Algorithms and Applications in Engineering


    (Shilo et al. 2020). Such big data supply the raw material for a future of early,
    precise diagnosis, customized therapies, and continuous monitoring of health.


    ML could promote health by releasing the potential of big data. Previous applications
    of ML in diagnosis and care were promising in detecting breast cancer from X-rays
    (McKinney et al. 2020), finding new antibiotics (Stokes et al. 2020), expecting
    gestational diabetes from digital medical records (Artzi et al. 2020), and determining
    patients who share a molecular signature of therapeutic responses (Zitnik et al.
    2019). ML digital pattern recognition could tackle complicated health data in
    cases where manual exploration is infeasible and ineffective. Several diseases
    included complicated modifications, which are experienced robustly and differently
    among patients and need diligent exploration and cautious evaluation of disparate
    big data to ascertain unique patterns as to diagnose and manage, hence, helping
    care providers and researchers to find and describe valuable insights from such
    big data (Rajkumar et al. 2019). The functionality of a new algorithm could be
    strictly evaluated with previously associations between quantitative biomarkers
    or qualitative data (which vary based on demographics and ecological exposures)
    and patient health outcomes.


    More models have been developed for gathering and assembling big data that relates
    attributes to a health condition, which could be applied in training and testing
    ML techniques. Cancer models could accumulate molecular profiles from testing
    frameworks or patients'' samples with diagnosis, treatment, and prognosis; for
    instance, the Cancer Dependency Map has gathered data on genomic stability, multimodal
    molecular profiles, and therapeutic responses from thousands of cancer cell lines.
    By applying innovative algorithms, these models could bring about a shift in knowledge
    although advances and anticipating health outcomes (Tsernniak et al. 2017).


    ML is derived from artificial intelligence (AI), which involves techniques to
    facilitate machines learning and reasoning similar to humans. ML stresses on building
    algorithms to learn from data. Major classes involve supervised learning where
    datasets are linked to a certain outcome; categorical use classification techniques
    such as “health” or “diseased” while continuous ones are applied in regression
    models as responding to treatment levels; semi-supervised or unsupervised techniques
    to classify data into specific sets, which could be manually tagged and linked
    to an output; ensemble, in which finds a final recommendation enabling many precise
    estimations via facilitating frameworks that integrate from many digital frameworks
    to enhance scaling-up to novel data; deep learning (DL) that applies artificial
    neural networks, inspired by similar networks in the human brain, to identify
    trends and relations in the data where it is valuable operating on unstructured
    data like text, speech, or images; and Bayesian learning where previous information
    is encrypted into'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Machine Learning for Smart Health Care


    the procedure of learning, particularly while working on poor data (Goecks

    et al. 2020).


    Several health datasets are big, having many dimensions. Reducing the dimensions
    of datasets could enhance the functionality of ML techniques by choosing a subgroup
    of proper data variables or merging variables into a lower number, obtaining data
    variance, visualizing data, or predicting models. In ML, techniques for federated
    learning could gradually learn data that are spread over many locations and cannot
    be merged into one dataset (Yang et al. 2019). Federated learning is crucial in
    medical applications working with protected or sensitive health data. Lately,
    accessing structured health data and technical advances in data analytics tools
    contributed to the growth of these techniques (Camacho et al. 2018). The ML techniques
    are selected according to the accessed data along with the applications they are
    intended for.


    With the growing powerful supercomputers and the infrastructure for gathering
    and analyzing data, ML techniques would play key roles in managing health such
    as detecting diseases precisely and, improving diagnosis, and better therapies.
    The quality of the learned data could be greatly through adopting standardized
    and large-scale electronic health records (EHRs) developed particularly for ML.
    Home data collection via smartphones, home-assisting devices such as Google Home
    or Amazon Echo, and other digital devices would contribute to more advanced ML
    in health. Figure 1.1 depicts how sophisticated algorithms are applied on the
    health big data for smart outcomes-based individualized health care. Whereas in
    a case, ML could early detect disease, monitor compliance, and response to therapy,
    in a hospital, ML could enable health care providers to diagnose and personalize
    care for a freely moving patient between the different settings.


    This chapter discusses how ML could promote health care via better medical diagnostics,
    precision health, and monitoring health, highlighting opportunities and successful
    early applications, and concluding with challenges that hinder achieving the full
    potential of ML in health.


    # 1.2 Major Applications of ML in Health Care


    # 1.2.1 Medical Diagnostics


    Today, medical examinations yield more data than ever thanks advances in medical
    care. High-fidelity imaging scans generate huge two-, three-, or four-dimensional
    images for tissues and organs, and molecular examinations could analyze hundreds
    to thousands of genes or proteins. ML could digitally analyze the diagnostic characteristics
    of such data to predict disease or'
