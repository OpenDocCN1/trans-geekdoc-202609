    # 16.1 Introduction


    A bone fracture often termed as a broken bone, is a medical condition in which
    the shape or contour of bone changes due to impact to external forces or injuries
    under many biological as well as mechanical circumstances such as injuries during
    physical activities, vehicle accidents, accidental falls or due to weakening of
    bones because of aging as an underlying disease [1]. Under fracture conditions,
    broken or cracked bone is stabilized and supported to handle the weight of the
    body during the process of fracture healing. Some fractures are healed from outside
    of the body using plasters, but using them gives rise to critical issues. To reduce
    the risk of infection from external support, surgical procedures are performed
    to implant supports to stabilize fractured bones with some implants


