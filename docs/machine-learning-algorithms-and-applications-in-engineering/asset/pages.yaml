    To make the connections more direct with a linear relation to feedback of the
    previous iterations, the framework used a LSTM as a filtering technique to further
    reduce temporal dependency and access the tacit layers. Evaluation was performed
    using the public Stanford EVAL data set, which was compared against random forests
    [53], random trees (RTW) [54] and iterative error feedback (IEF) [55] on the percentage
    of correct key points (PCKh). The performance was slightly better than the competition
    and the highest increase in mean scores was to be in the case of the lower abdomen,
    while the head gave the least increase according to the metrics. RF was not a
    suitable choice for contrasting the method as it scored 40 percent lower than
    the proposed framework and the other two frameworks, which puts it out of the
    league of the other frameworks. Another feature of the framework, ''Glimps'' added
    more data with each iteration along the pipeline and provided a noticeable increase
    in sharpness of the heatmaps presented.


    A simple system for feature extraction with gesture detection via a neural network
    was presented by Jadooski [56]. The distinguishing factor of this paper is that
    instead of stating all the systems and the modalities considered, they provide
    insightful information about the importance of the difference as well as the effect
    on when the parameters are changed. Simple RGB-based image manipulating tools
    used to extract the features of the hand and the palm. The effects of lighting
    and the background intensity also been mentioned briefly. A simple neural network
    with a custom-modified discrete cosine transform (DCT) is used for the feature
    processing and subsequent result generation. The effect of the multiple layers
    and the layers that contribute the most to the accuracy of the results have been
    provided along graphs of the accuracy over iterations for different tweaks to
    the variables to the DCT. The results conclude that increasing certain mentioned
    layers cause linear reduction in the prediction of the hand gesture, till 10,000
    iterations of training, after which the framework stagnates.


    Priya et al. [57] has proposed the framework of a project to implement an ASL-based
    text input in laptop systems. This is a bit different from the other studies already
    discussed, because instead of focussing of the accuracies of parameters and the
    pooling of layers, the paper mainly focuses on the requirements of the system
    to be able to work in real-world applications. Many techniques that are used for
    the extraction of hand positions implemented deep inside the neural networks such
    as the convex hull, erosion, black top and skeletonize have been studied and the
    importance evaluated. Finally, the paper suggests methods to implement the gesture
    as a virtual mouse input via the camera and gives a brief of the theoretical aspects
    of the project.


    The paper drafted by Smrita [58] outlines the use of a radio frequency-based microcontroller-enabled
    home automation system that can understand'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# A Comparative Analysis of Techniques in Gesture Detection 87


    gesture commands. The system uses a PIC microcontroller in tandem with an accelerometer
    that is attached to the wrist as a wearable device to gather the inputs. The microcontroller
    can converse with various relays using radio frequency, hence there is no need
    to be in the same room as the appliance that is to be controlled. Currently the
    system is rudimentary, with the system able to turn appliances on or off. With
    proper software support, the system could be capable of carrying out more complex
    instruction like setting reminders and alarms. The study aims that the system
    benefits paralytic patients with limited motor functionality, but it can also
    be applicable to any case where only gesture is the primary means of communication.


    # 5.5 Conclusion


    Throughout this chapter, discussions have been made with the primary focus on
    using gesture detection frameworks that have been proposed, developed and implemented
    in real-world scenarios. Gesture detection has many uses, starting from the reasons
    mentioned in the first sections of the chapter to newer intuitive implementation
    that have not been discovered till date. This is not surprising considering the
    fact that in this day that digital technology is widespread into every nook and
    cranny of the society, the access to camera and the ability to use it is extremely
    trivial. As, anyone can leverage the firstly of the research done in the fields
    of gesture analysis, with a main focus still remaining in the domain of ‘American
    sign language’, which is one of the most widely used techniques to communicate
    using palm and hand gestures.


    In this chapter, the different challenges with the acquisition and processing
    of data sets are discussed with examples detailing the reason for it. Thereafter,
    the different requirements along the process of developing usable and efficient
    frameworks from the system have also been peruse, followed by the application
    of gesture analysis for the benefit of the system. As previously, it is obvious
    that the most important and obvious use of this technique is in developing tools
    for communicating with those who are challenged in some form; however, this technique
    can also be modified for novel ways, such as the detection and treatment of autism.
    Another field that got a brief mention was the use in detection of sleep and fatigue
    levels in students attending online classes as well as 3D models of complex actions
    from simple images. There is no doubt that with time, these techniques would get
    refined by the work of the community, leading to other fruitful discoveries.


    Finally, an extended literature review of the current techniques that have something
    unique to offer have been compiled in the review section. Instead'
