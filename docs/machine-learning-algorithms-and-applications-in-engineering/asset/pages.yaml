    where $p$ is the output of neuron of the current layer, $q$ is the output of the
    previous layer, $w$ is the set of weights, $b$ is bias, $f$ is nonlinear activation,
    $i$ is current neuron, $l$ is current layer, and $k$ is the earlier layer.


    # 15.3.2.2 CNN


    CNN is traditionally designed for image detection systems but can also be used
    as time-series forecasting model. The neurons in CNN can hold high dimensional
    data and so this model performs better than the other neural networks. CNN models
    have three properties: (i) convolutional layer, (ii) pooling layer, and (iii)
    flatten layer. A flatten layer is used between the convolutional layers and the
    dense layer to reduce the feature maps to a single one-dimensional vector.


    # 15.3.2.3 CNN-LSTM


    This architecture is also known as long-term recurrent convolutional network (LRCN)
    model. The CNN-LSTM architecture uses CNN layers for feature extraction on input
    data combined with LSTMs to support sequence prediction. A CNN-LSTM can be defined
    by adding CNN layers at the front followed by LSTM layers with a dense layer at
    the output. These models were developed for visual time-series prediction problems.


    # 15.3.2.4 CNN-LSTM-DNN


    In order to perform complex tasks, the neural networks need to be trained deeper.
    When deeper networks start to converge, the problem of degradation occurs. In
    degradation, with the increase in network depth, accuracy gets saturated and then
    decreases rapidly. Unexpected, such degradation is not caused by overfitting,
    and adding more layers to a suitably deep model leads to higher training error.
    Skip connections, which are also known as shortcut connections, are introduced
    to overcome this problem. This type of connection skips skips some of the layers
    in the neural network and feeds the output of one layer as the input to the next
    layers. In this CNN-LSTM model, output is skipped to common DNN.


