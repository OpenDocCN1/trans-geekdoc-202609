    and fulfil the purpose of information reinforcement. It includes of multiple body
    parts including fingers and hands, which are the popular ones, but it also incorporates
    facial gestures, head, body and arms, which may be less known in mundane communications.
    For those with hearing, listening or visual disabilities, sign language is the
    only means of communication and expression. But those with these depend completely
    on sign language to interact with outer world find it cumbersome to do so as many
    people are unaware of the complete imbations of sign language. Moreover, while
    use and knowledge of sign language is common among communities with visual disabilities,
