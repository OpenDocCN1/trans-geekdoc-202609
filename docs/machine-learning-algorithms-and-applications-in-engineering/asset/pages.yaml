    # 6.2.2 Procedure


    The brain-computer interface is a mediator method and procedure for establishing
    communication with the dreamers. A BCI communication system has to be built by
    following various activities and tools such as software- and hardware. In this
    section, a detailed description of developing a BCI system with complete steps
    is presented.


    # 6.2.2.1 Signal Acquisition


    In the formal working procedure of a brain–computer interface system, signal acquisition
    is the first phase where a hardware modality is used to extract signals from the
    brain. Generally, hardware modality is associated with the brain directly or indirectly
    [51]. The way of connection depends on the type of modality; it may be wired or
    wireless and it may also be invasive, semi-invasive, and noninvasive type of connection.
    Now consider the example of an EEG machine. So it may be a wired or a wireless
    system [52]. In early times, researchers used EEG systems, but nowadays, most
    of the dream-based experiment, an electrode cap having motile electrodes are placed
    on the scalp. These electrodes read the electrical stimulus from the brain regions,
    which depends on the number of channels designed in the machine [53].


    # 6.2.2.2 Pattern Recognition


    Recorded raw data might have some noise and redundancy, in this phase, we have
    to identify patterns or features from the brain signals that have been recorded.
    Pattern recognition is the task of analyzing the signals to distinguish significant
    features from raw materials and representing them in a standard form suitable
    for translation into commands during feature translation [54]. When the input
    signals to an algorithm are too large and it is suspected to be redundant, then
    it can be transformed into a reduced'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'set of features. Sometimes, unnecessary portions of the raw data set must be
    removed, and the process of removing this type of data portion is known as dimensionality
    reduction. The extracted features are expected to contain valuable and relevant
    information so that the desired task can be performed by using this reduced pattern
    instead of the complete source data [55].


    # 6.2.2.3 Pattern Classification


    It is the process of categorizing data based on its features to perform the variability
    reduction of feature values. This stage classifies the extracted signals having
    different features into account [56]. The responsibility of the feature classifier
    algorithm is to use the feature vector provided by the feature extractor to assign
    the object to a category of the feature [57]. However, complete classification
    is often impossible, so a more common task is to determine the probability for
    each of the possible categories of features. The problem of the classification
    depends on the variation in the feature values for certain objects in the same
    category relative to the variation between feature values for certain objects
    in different categories [58]. The variation of feature values for certain objects
    in the same category may be due to the complexity of features and may be due to
    noise in signals.


    # 6.2.2.4 Command Generation


    Finally, based on data evaluation, decisions could be taken by computer for performing
    any specific task by generating appropriate command. This stage translates the
    signals into meaningful commands for any connected device. The classified feature
    signals are translated by the feature translation algorithm, which converts the
    feature signals into appropriate commands for the specific operations performed
    by the connected device [60]. In this context source feature, signals are known
    as the independent variable and targeted device control commands are known as
    the dependent variable. In the translation process, the independent variable is
    converted into the dependent variable. Feature translation algorithms may be linear
    or nonlinear by using statistical analysis and neural networks, respectively [61].


