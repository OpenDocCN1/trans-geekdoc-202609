- pgno: 181
  md: '# ML Applications in Real-World Time Series Problems


    The results achieved confirmed that the improvements made outperformed those of
    the previous algorithm detecting all but two TPs in both data sets. The experiments
    also demonstrated that the proposed diagnostic-predictive ML-based model, specifically
    a decision tree, was feasible and generated very promising results. This behaviour
    was produced given that the system''s prediction-monitoring period lasted several
    decades, and that the time series already contained in its abrupt climate changes
    of the same type. The above-mentioned aspects open an interesting field for research.


    # 10.2.3 Prediction of Fog Formation


    It is widely known that aviation is one of the means of transport most affected
    by adverse weather conditions. There are a lot of phenomena reducing the visibility,
    such as sandstorms or torrential rains. However without doubt, the most important
    and common is fog formation. Fog is a meteorological phenomenon consisting in
    the suspension of almost microscopic particles of water droplets in the air, causing
    the reduction of horizontal visibility on the Earth''s surface. It has been addressed
    from different points of view (Román-Gáscón, 2015).


    Foggy weather result in air traffic disruptions, flight delays or even accidents,
    among others. More specifically, it has a major impact on the safety and efficiency
    of airport operations (such as taxing, take-off and landing operations (Berot
    et al., 2007). Intending to ensure enough reliable information, with the aim of
    anticipating these phenomena. Some studies have proposed developments of trustworthy
    systems to detect and predict fog formation.


    Perhaps one of the most widespread methods of predicting fog formation is the
    use of numerical weather (NWP) models (Román-Gáscón et al., 2016). Nevertheless,
    NWP models are computationally expensive. In recent years, ML methods have been
    successfully applied to fog prediction problems. Fabbian et al. (2007) proposed
    an ANN to predict fog events on an 18-hour schedule at Canberra International
    Airport in Australia. Similarly, Marban et al. (2007) used ANNs to combine three
    sources of information to forecast ceiling and visibility at 39 airports in the
    northwestern United States. In the same year, Bremnes and Michaelides (2007) applied
    another ANN approach to fog formation prediction with a time horizon of up to
    6 h in Norway. Then, a Bayesian model was successfully introduced in a fog prediction
    with a time horizon of 12 h in the Pacific Northwest of the United States (Chmieleck
    and Rafferty, 2021). Most recently, Colabone et al. (2015) proposed an MLP using
    meteorological data to help in the planning of flight activities of the Academia
    da For Area (AFA). In Cornejo-Bueno et al. (2017), different ML regression techniques
    have been applied to fog prediction in Spain. These works tackled the problem
    of fog formation as regression approaches.'
