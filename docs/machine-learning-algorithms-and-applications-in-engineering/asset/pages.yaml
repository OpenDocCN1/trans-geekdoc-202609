  md: 'Machine Learning Algorithms and Applications in Engineering


    # 12.1 Introduction


    Preservation of the individuals'' privacy is an essential concern during and after
    the data is transmitted to third person. In the era of digital world, data owner
    organizations are discomforted by data privacy. Due to an increase in the generation
    of data, the task of masking data without disclosing the sensitive information
    of an individual has become a challenging task. Organizations such as health sectors,
    pharmaceutical agencies and government sectors often share their data with researchers
    and third parties for various analysis. Therefore, the data publisher needs to
    take the responsibility of preserving privacy during data publishing. The data
    publisher [1] must be a trustworthy person. Data publisher needs to have a complete
    knowledge about the privacy law and act before disclosing the data to the data
    recipients. Data publisher should take the responsibility for the privacy of the
    data and also the utility of the data. Data publisher ensures that the data is
    properly anonymized, so that the sensitive information of the original data is
    unknown to the data recipient. However, the utility of the original data should
    be preserved, so that the publisher needs to ensure that the proper model and
    techniques have been applied on the original data before disclosing the data to
    the recipient so that there is no clue for sensitive information. Two types of
    data are of major concern before publishing the data: (i) individual privacy and
    (ii) collective privacy. Revealing explicit identifiers such as name and id can
    directly breach a particular privacy. To protect personal privacy, the identifiers
    should be removed and the sensitive attributes related to the particular individual
    need to be made private and anonymized. The safeguarding of an individual privacy
    may not be adequate. Learning about an individual''s sensitive information may
    also lead to infring of the information about a group of individuals. Therefore,
    sensitive knowledge inferred from the data set is treated as collective privacy
    preservation [2]. The data set consists of two kinds of attributes termed as (i)
    sensitive attribute and (ii) non-sensitive attributes [3]. A distinctive care
    needs to be given for sensitive attributes as they contain sensitive information
    about an individual. The sensitive attributes should not be disclosed to the third
    party. Non-sensitive attributes in the dataset should be projected for the purpose
    of analysis. The non-sensitive attributes are collectively termed as quasi-identifier.
    Data publisher discloses the non-sensitive attributes to the third party. However,
    the non-sensitive attributes can collectively provide the personal information
    about an individual if it is related with other external sources. Data anonymization
    should be carried in a proper way by adopting various privacy methods and models.
    The privacy-preserving methods and methods implemented on the data set should
    balance between the privacy and utility. The basic notion of'
