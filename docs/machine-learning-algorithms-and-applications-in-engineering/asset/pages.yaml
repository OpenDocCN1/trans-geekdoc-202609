    frequently used in the domain of brain-computer interface [32].


    In clinical clinics, the brain-computer interface is a very popular term among
    biomedical engineers and researchers. In general, the brain-computer interface
    is a communication pathway between the human brain and the computer system [33].
    Fundamentally, this domain has two broad subdomains where a researcher must focus
    on modalities and procedures.


    +   - Modalities mean those hardware components which are used to extract signals
    from the brain invasively or noninvasively.

    - The procedure means the data analytics process using software components or
