  md: '# ML in Breast Cancer Classification


    +   (i) Data preprocessing: The raw data is highly vulnerable to missing data,
    outliers, noise, and inconsistent data because of the vastness of data, multiple-resources,
    and their gathering methods [6]. The poor quality of data profoundly affects the
    results of machine learning models. Therefore, preprocessing techniques must be
    applied to the data to get better results of ML models [7]. After preprocessing,
    the data must be transformed into the required form for training the ML models
    [8]. Data preprocessing methods are data cleaning, filling missing values, removing
    outliers from data, and standardization of data [9]. Missing values of a column
    can be filled with the mean of the column data. Outliers can be removed using
    the binning process. because all the features will be constricted in the range
    of [-1,1] [10]. We should split the data to train the ML model, and test set will
    be used to evaluate the trained ML model [11]. Cross-validation techniques between
    conventional approaches to ensure good generalization and to avoid overtraining.
    The basic idea is to divide the data set into two subsets—one used for training
    while the other subgroup is left out, and the performance of the final model is
    evaluated on it. The primary purpose of cross-validation is to achieve a stable
    and confident estimate of the model performance [12]. Cross-validation techniques
    can also be used when evaluating and mutually comparing models, various training
    algorithms, or when seeking optimal parameters [13].


    +   (ii) Training of ML models: The purpose of machine learning is to learn from
    the data. Many studies have been done on how to make machines learn by themselves.
    Many mathematicians and programmers use several approaches to find a solution
    to this problem. Some of them are KNN, logistic regression, decision tree, SVM,
    and random forest. Logistic regression is a classification function that uses
    a class for building and estimator [14]. SVM is the most recent supervised machine
    learning technique that revolves around the notion of a margin on either side
    of a hyperplane that separates two data classes. Maximizing the margin and creating
    the most significant distance between the separating hyperplane and the instances
    on either side of it has been proven to reduce an upper bound on the expected
    generalization error [14]. Decision trees are those types of trees that attribute
    by sorting them by their values. The decision tree is used for classification
    purposes consists of nodes and branches. Each node represents attributes in a
    group that is to be classified, and each branch represents a value that the node
    can take. In k-NN classification, the output is a class membership. An object
    is classified by a plurality vote of its neighbors, with the object being assigned
    to the class most common among its k nearest neighbors [14].'
