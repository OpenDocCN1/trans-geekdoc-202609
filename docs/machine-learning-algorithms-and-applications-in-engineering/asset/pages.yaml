  md: '# 17.1 Introduction


    Myocardial infarction (MI) has become a serious silent killer in current times.
    It is very hard to predict the likely outcome for the patient suffering from MI.
    There are many factors involved such as diabetes, excessive alcohol consumption,
    high blood pressure, lack of exercise, high blood cholesterol, smoking, and lack
    of proper diet. Most of the patients suffering from MI have coronary artery disease
    (CAD). MI is usually caused by the coronary artery blockage, which results from
    a breakage of an atherosclerotic plaque. So, an early stage-diagnosis with the
    help of tests such as electrocardiograms (ECGs), blood tests, and coronary angiography
    may help locate the presence of any disease. In general, chest pain is one of
    the symptoms that may occur due to MI and may travel to the shoulder, the arm,
    and may even to the back. Feeling fainted, shortening of breath, cold sweat, or
    tiredness are a few other symptoms that can be observed in the patient’s body.
    MI may lead to cardiac arrest, failure of the heart, or even an abnormal heartbeat.


    Predicting MI outcomes is quite challenging because many factors affect them.
    There is high mortality in the first year of patients suffering from acute myocardial
    infarction (AMI). A large number of people die from AMI before reaching the hospitals.
    This is because of huge uncertainty in the prediction of MI complications and
    outcomes. It can occur without complications or with complications. At the same
    time, it is observed that the number of patients having acute or subacute MI have
    complications that result in worsening of the disease and even result in loss
    of life of the patient. It is hard even for experienced specialists to predict
    the complications. With the help of a few techniques such as deep learning and
    using the previous data of patients, it is quite feasible to some extent.


    # 17.2 Neural Decision Forests


    Neural decision forests (NDFs) are based upon two approaches. The first one is
    convolution neural networks (CNNs) and the second is random forests. To analyze
    visual imagery, the most commonly used artificial neural network is CNN. CNN works
    on the principle of feature maps, which are nothing but the translation equivariant
    responses produced by the filters that slide along input features. It corresponds
    to a shared-weight architecture of convolution kernels. CNNs are used in the field
    of computer vision, video processing, image processing, and natural language processing.
    The second approach consists of random forest, which is the method for classification-regression
    and many more, which is an ensemble learning technique. The random forest is the
    combination of interconnected trees, each of which is going to'
