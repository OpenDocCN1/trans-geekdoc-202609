    # 8.1 Biological Framework


    Bioinformatics is a discipline that binds biology and computer science and deals
    with tasks such as the acquisition, storage, analysis and diffusion of biological
    data. The data that this field deals include very often DNA and amino acid sequences.
    Bioinformatics uses advanced computational approaches to answer a wide variety
    of problems in molecular biology. Traditionally, the alignment of sequences, gene
    finding, the establishment of evolutionary relationships or the prediction of
    three-dimensional forms of sequences were the main problems addressed by this
    field (Mount, 2004). Recently, the new trends that have appeared include the functional
    prediction of proteins.

    Proteins are complex chemical macromolecules that play a fundamental role in within
    organisms (O’Connor et al, 2010). They can be seen, according to long chains of
    amino acids connected


    DOI: 10.1201/9781003104858-8'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Machine Learning Algorithms and Applications in Engineering


    to other. Amino acids are small organic molecules that are linked by a peptide
    bond. These linear chains fold in space forming a three-dimensional structure.
    The way of folding is dependent on the amino acids that compose it'' and determines
    the properties of the protein.


    The importance of proteins lies in the many functions they perform in organisms.
    For example, at the structural level, they make up the majority of cell material;
    at the regulatory level, enzymes are proteins; at the immune level, antibodies
    are glycoproteins. They constitute more than 50 percent of the dry weight of cells
    (Liu, 2020), and it can be generally stated that they are involved in regulating
    all the processes that take place in living beings, and in the vast majority of
    cases, their molecular function is determined by the relationship they establish
    with other proteins (Braun and Gingras, 2012) and with other molecules in the
    environment.


    Due to how determinant it is to know the function of the different proteins in
    an organism, many scientific projects are currently focused on trying to elucidate
    their behaviour, regulation and possible activity at a biochemical, biological,
    and bioinformatics angle. Hundreds of thousands of articles are published every
    year describing the activity of proteins in different situations because it is
    crucial in analysing cellular mechanisms, identifying the changes that lead to
    possible problems at a systemic level and discovering new tools for the prevention,
    diagnosis and treatment of diseases. In other words, knowing the function of proteins
    is synonymous with understanding life at a molecular level, which has a series
    of relevant implications for the pharmaceutical and biomedical industry.


    In late 2019, the World Health Organization (WHO) was notified of several cases
    of pneumonia of unknown etiology, including severe cases. Shortly after, the new
    coronavirus SARS-CoV-2 (Zhu et al., 2020) was identified as the causative agent.
    International health authorities recognized a rapid spread of the virus, causing
    the outbreak of SARS-CoV-2 infections a global pandemic and declaring it a Public
    Health Emergency of International Importance. Given the seriousness, numerous
    costly projects began to be developed around the pathogen. To date, after genome
    sequencing and analysis, several genes of the coronavirus that causes COVID-19
    have been discovered, which encode the synthesis of 39 proteins (Gordon et al.,
    2020) for the time being. In some cases, it has been possible to identify the
    functions they play. However, in others, they are still a mystery.


    When discussing the function of proteins, it should be borne in mind that this
    is a concept that can have different meanings depending on the different contexts
    andor biological levels. The biochemical/molecular level, the cellular level and
    the phenotypic level can be considered. Therefore, the function of a protein can
    be categorized into three main groups:


    +   * Molecular function

    * Biological process

    * Cellular component'
