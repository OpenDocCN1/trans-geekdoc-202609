    models are used as follows:


    +   Linear monotonic models: Linear coefficients act as a huge support for the
    exhibition of the output. Linear regression models come under this category.


    +   Nonlinear monotonic models: Restraining data so that we can see either a falling
    or a rising global relationship where the variables are simplified for producing
    the result. Gradient boosting model is an example of the same.


    +   Nonlinear monotonic model: Methodologies such as local interpretable-agnostic
    explanations or Shapley values help ensure local interpretability. The examples
    include models like unstrained deep learning models.


    +   Bias: This feature takes care of the trueness of the system. The validation
    takes care of the proper implementation of rules for fairness in the mechanism.
    Four approaches are generally used depending on the requirements:


    +   Demographic blindness: Settlements are composed utilizing a restricted assortment
    of characteristics that are related to the preserved classes.


    +   Demographic parity: For each protected class, results are proportionally the
    same.'
