  mdcn: "\n## 基于动态时间规整特征提取的极限学习机无设备定位\n\nJianqiang Xue, Zhenyue Gao, Jianxing Zhang,\
    \ Wendong Xiao*  \n自动化与电气工程学院  \n北京科技大学  \n北京，中国  \ne-mail: wdxiao@ustb.edu.cn\n\
    \n**摘要—** 近年来，基于 WiFi CSI 的无设备定位受到了广泛关注。之前的大多数工作使用了接收信号强度指示 Received Signal Strength\
    \ Indication (RSSI)，而信道状态信息 Channel State Information (CSI) 的获取显著提高了基于 WiFi 的定位精度。本文提出了一种基于\
    \ CSI 的无设备室内定位方法。首先，我们使用 CSI Tools 采集 CSI 并使用特定的滤波器滤除噪声。然后，我们使用动态时间规整 Dynamic\
    \ Time Warping (DTW) 提取两个数据段之间的差异作为指纹。最后，使用极限学习机 Extreme Learning Machine (ELM)\
    \ 进行建模并计算目标的位置。我们在实验室搭建了系统来验证该方法的性能，这证实了本文提出的方法的有效性。\n\n**关键词—** 无设备定位；信道状态信息；极限学习机；动态时间规整\n\
    \n## I. 引言\n\n近年来，无线网络技术发展迅速，人们开始要求有效且准确的服务应用。目标定位就是其中之一。目前，室外定位技术已经成熟，并衍生出多种服务应用，为人们的生活提供了极大的便利。室外定位技术主要依赖于全球定位系统\
    \ Global Positioning System (GPS) 等卫星定位技术，可以实时估计目标的位置信息。然而，由于多径效应、阴影和衰落 [1] 等环境因素，该定位技术在室内环境中难以工作。因此，在室内环境中获得良好的目标定位效果仍然是一个亟待解决的问题。\n\
    \n尽管室内定位受到了广泛关注，但技术的 immaturity 仍然是目前面临的一个大问题。与 GPS 和基站定位等室外定位系统不同，室内定位系统仍然没有统一的标准组织来制定统一的技术标准和规范。目前主流的室内定位技术解决方案是在各企业定义的协议和方案下开发的，导致了多种室内定位技术，如红外\
    \ [2]、超声波 [3]、摄像头 [4]、超宽带 [5] 和无线局域网。基于摄像头的系统可以实现高精度，但它需要良好的光照环境并会引起隐私问题；基于超声波的系统受噪声影响且覆盖范围有限；基于红外的系统需要专业的基础设施；基于可见光的系统只能在可见环境中工作。由于移动终端中\
    \ WiFi 设备的普及以及室内环境的发展，基于 WiFi 的室内定位技术受到了更多关注。\n\n基于 WiFi 的室内定位技术分析无线局域网中移动终端接收到的无线电信号的特征，并根据相应的定位模型估计目标的位置。目前，大多数室内\
    \ WiFi 定位系统使用接收信号强度指示 Received Signal Strength Indication (RSSI) 或信道状态信息 Channel\
    \ State Information (CSI) 作为接收信号。CSI 是近年来研究的热点。Dynamic-Music [6] 提出了一种结合多信号分类算法\
    \ Multiple Signal Classification Algorithm (MUSIC) 算法的定位方法，该方法使用 CSI 相位检测人体反射信号，并进一步计算到达角\
    \ Angle of Arrival (AoA) 和到达时间 Time of Arrival (ToA) 以估计位置信息。IndoTrack [7] 从 CSI\
    \ 信号估计多普勒速度，并进一步估计目标的位置和速度信息。Widar [8] 使用 CSI 并从几何角度定位目标，同时估计目标的速度估计。Haibin Bian\
    \ [9] 研究了 WiFi CSI 室内定位方法，结合 CSI 信息和位置指纹方法，并基于 CSI 数据的空间和频率特性使用 CSI 数据信息作为位置指纹信息，提出了基于\
    \ CSI 加权空频特征的聚类算法。该算法对指纹数据进行聚类，完成匹配定位，通过二次校正去除数据库中部分分离的聚类点和不合适的最近邻，最终实现基于 WiFi\
    \ 的室内定位。Fuseloc [10] 使用从信道状态信息中提取的多个特征进行基于室内定位的首次信息融合。\n\n在本文中，我们提出使用动态时间规整 Dynamic\
    \ Time Warping (DTW) 提取信号特征，并采用极限学习机 Extreme Learning Machine (ELM) 对指纹与目标点之间的关系进行建模。具体而言，该方法的工作流程包括数据采集、预处理、特征提取和关系建模。本研究的主要贡献如下：\n\
    \n1. 使用 DTW 方法提取信号特征；\n2. 使用 ELM 对无设备定位进行建模；\n3. 构建系统并比较该方法与其他方法的效果。\n\n本文其余部分结构如下。第二部分对相关内容进行了简要介绍，第三部分描述了系统设计。第四部分详细介绍了实验验证。第五部分给出了结论。\n\
    \n## II. 预备知识\n\n### A. 信道状态信息\n\n在过去的基于 WiFi 的室内定位研究中，大多数基于 RSSI。RSSI 是多个无线信号的叠加能量，随着距离的增加会衰减，非常不稳定。随着\
    \ OFDM 技术在 WiFi 中的应用，可以提取 WiFi 的信道状态信息。CSI 描述了无线信号在传播过程中的衰减，并记录了频域中每个子载波的幅度和相位信息\
    \ [11]。它具有稳定、细粒度、信息丰富等优点。\n\n在无线局域网中，接收数据向量可以表示为\n\n\\(Y = HX + W\\), (1)\n\n\
    其中 X 是发送数据向量，H 是 CSI 矩阵，W 是噪声向量。H 可以计算为\n\n\\(H = Y/X\\), (2)\n\nH 是频域中信道频率响应的\
    \ CFR 采样信息，CSI 工具使得获得具有 30 个样本的 CFR 采样版本成为可能 [12]。使用兼容 IEEE 802.11a/g/n 的无线网卡，从接收到的每个数据包中提取一组\
    \ CSI，每个 CSI 表示正交频分复用子载波的幅度和相位 [13]。CSI 可以表示为\n\n\\(H(f_k) = \\|H(f_k)\\| e^{j\\\
    angle H(f_k)}\\), (3)\n\n其中 \\(H(f_k)\\) 是频率为 \\(f_k\\) 的第 k 个子载波的 CSI，\\(\\|H(f_k)\\\
    |\\) 和 \\(\\angle H(f_k)\\) 分别表示第 k 个子载波的幅度和相位。\n\n### B. 极限学习机\n\nELM 是一种单隐层前馈网络，具有三层结构：输入层、隐藏层和输出层\
    \ [14]，如图 1 所示。ELM 最重要的特征是隐藏层参数随机初始化，只需通过最小二乘估计计算输出权重 [15]。因此学习速度比大多数其他机器学习方法快数百或数千倍，且\
    \ ELM 的泛化能力也非常优秀。\n\n![](img/bc94f492e7e471f80902b1c5ae1db01e_1_0.png)\n\n用 \\\
    (L_{hn}\\) 表示前馈网络中隐藏单元的数量，ELM 的输出函数可以表示为\n\n\\(f(x) = \\sum_{i=1}^{L_{hn}} \\\
