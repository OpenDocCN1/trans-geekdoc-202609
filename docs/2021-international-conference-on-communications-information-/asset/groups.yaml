  - "[PAGE 0]\n\n# Device-Free Localization Using Extreme Learning Machine with DTW\
    \ based Feature Extraction\n\nJianqiang Xue, Zhenyue Gao, Jianxing Zhang, Wendong\
    \ Xiao*  \nSchool of Automation and Electrical Engineering  \nUniversity of Science\
    \ and Technology Beijing  \nBeijing, China  \ne-mail: wdxiao@ustb.edu.cn\n\n**Abstract—In\
    \ recent years, WiFi CSI based device-free localization has attracted widespread\
    \ attention. Most of the previous work used Received Signal Strength Indication\
    \ (RSSI), and the acquisition of Channel State Information (CSI) significantly\
    \ improved the localization accuracy based on WiFi. In this paper, we propose\
    \ a device-free indoor localization method based on CSI. First, we use CSI Tools\
    \ to collect CSI and use some specific filters to filter out the noise. Then,\
    \ we use Dynamic Time Warping (DTW) to extract the differences between the two\
    \ data segments as fingerprints. Finally, Extreme Learning Machine (ELM) is used\
    \ for modelling and calculating the location of the target. We set up a system\
    \ in the laboratory to verify the method’s performance, which confirmed the effectiveness\
    \ of the method proposed in this paper.**\n\n**Keywords-device-free localization;\
    \ channel state information; extreme learning machine; dynamic time warping**\n\
    \n# I.  INTRODUCTION\n\nIn recent years, wireless network technology has developed\
    \ rapidly, and people have begun to demand effective and accurate service applications.\
    \ Target localization is one of them. Presently, outdoor localization technology\
    \ has matured, and a variety of service applications have been derived, providing\
    \ great convenience to people's lives. Outdoor localization technology mainly\
    \ relies on satellite localization technology such as the Global Positioning System\
    \ (GPS), which can estimate the target's location information in real-time. However,\
    \ due to environmental factors such as multipath effects, shadows and fading [1],\
    \ this localization technology is challenging to work in indoor situations. Therefore,\
    \ obtaining a good target localization effect in an indoor environment is still\
    \ a problem to be solved urgently.\n\nAlthough indoor localization has attracted\
    \ much attention, the immaturity of technology is still a big problem currently\
    \ facing. Unlike outdoor localization systems such as GPS and base station localization,\
    \ indoor localization systems still do not have a unified standard organization\
    \ to formulate unified technical standards and specifications. The current mainstream\
    \ indoor localization technical solutions are developed under the agreements and\
    \ solutions defined by each enterprise, resulting in a variety of indoor localization\
    \ technologies, like the infrared [2], ultrasonic [3], camera [4], ultra-wideband\
    \ [5] and wireless local area network. Camera-based system can achieve high accuracy,\
    \ but it requires a good lighting environment and will cause privacy issues; ultrasonic-based\
    \ system is affected by noise and has limited coverage; infrared-based system\
    \ requires\n\nprofessional infrastructure; visible-light-based system can only\
    \ work in visible environment. Due to the popularity of WiFi devices in mobile\
    \ terminals and the development of indoor environments, WiFi-based indoor localization\
    \ technologies have received more attention.\n\nWiFi based indoor localization\
    \ technology analyses the characteristics of the radio signal received by the\
    \ mobile terminal in the wireless local area network, and estimates the position\
    \ of the target according to the corresponding localization model. At present,\
    \ most indoor WiFi localization systems use Received Signal Strength Indication\
    \ (RSSI) or Channel State Information (CSI) as the received signal. CSI is a research\
    \ hotspot in recent years. Dynamic-Music [6] proposed a localization method combined\
    \ with the Multiple Signal Classification Algorithm (MUSIC) algorithm, which uses\
    \ the CSI phase to detect the human body reflection signal and further calculates\
    \ the Angle of Arrival (AoA) and Time of Arrival (ToA) to estimate location information.\
    \ IndoTrack [7] estimates the Doppler velocity from the CSI signal, and further\
    \ estimates the position and velocity information of the target. Widar [8] uses\
    \ CSI and locates the target from a geometric angle, and at the same time estimates\
    \ the target's velocity estimate. Haibin Bian [9] researched on WiFi CSI indoor\
    \ localization methods, combined CSI information and location fingerprint methods,\
    \ and used CSI data information as location fingerprint information based on the\
    \ spatial and frequency characteristics of CSI data, and proposed clustering based\
    \ on CSI weighted space-frequency characteristics. The algorithm clusters fingerprint\
    \ data, completes matching localization, removes part of the separated cluster\
    \ points and inappropriate nearest neighbors in the database through secondary\
    \ correction and finally realizes WiFi based indoor localization. Fuseloc [10]\
    \ uses multiple features extracted from the channel state information to perform\
    \ the first information fusion based on indoor localization.\n\nIn this paper,\
    \ we propose to use Dynamic Time Warping (DTW) to extract signal features and\
    \ employ Extreme Learning Machine (ELM) to model the relation between fingerprints\
    \ and target points. Specifically, the workflow of this method includes data collection,\
    \ preprocessing, feature extraction and relationship modelling. The main contributions\
    \ of this research are:\n\n+   1. Use the DTW method to extract signal features;\n\
    +   2. Use ELM to model device-free localization;"
