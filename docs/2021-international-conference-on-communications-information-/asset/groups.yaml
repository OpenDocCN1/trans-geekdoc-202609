    | SVM | 1.3345m |


    used a scheme of 1 AP and 2 MPs for better coverage of the area of interest. We
    selected reference locations uniformly within the monitored area. The area was
    divided into 64 cells, each with a size of 0.6 m*0.6 m. The reference points were
    set in each cell’s center, and the test points were randomly scattered throughout
    the area. One hundred packets were collected at each location.


    # B. Localization Performance


    We used the average distance error as the performance metric. The results of comparing
    our system with the other two machine learning methods are shown in Table I. It
    can be seen that our method outperforms SVM and BPNN, proving the effectiveness
    of the ELM algorithm and the localization accuracy can be greatly improved by
    using DTW to extract features.


    # V. CONCLUSION


    In this paper, we propose a device-free indoor localization method based on WiFi
    CSI, using two common commercial WiFi devices and a single receiver device to
    collect CSI data, pre-processing the collected CSI data to extract features using
    DTW, and then using ELM model for localization. The method was evaluated in a
    laboratory environment and experimental results showed that the method was superior
    to SVM and BPNN. The average distance error was 1.12m in a typical indoor environment.


