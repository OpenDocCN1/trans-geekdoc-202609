    The rest of this article is structured as follows. Section II gives a brief introduction
    to the relevant content, and Section III describes the system design. Section
    IV introduces the experimental verification in detail. Section V gives the conclusion.


    # II. PRELIMINARIES


    # A. Channel State Information


    In the past WiFi based indoor localization research, most are based on the RSSI.
    The RSSI is the superimposed energy of multiple wireless signals, which will attenuate
    as the distance increases, which is very unstable. With the application of OFDM
    technology in WiFi, the channel state information of WiFi can be extracted. The
    CSI describes the attenuation of wireless signals in the propagation process,
    and records the amplitude and phase information of each subcarrier in the frequency
    domain [11]. It has the advantages of stability, fine-grained, and rich information.


    In a wireless local area network, the received data vector can be expressed as


    Y=HX+W , (1)


    where X is the transmitted data vector, H is the CSI matrix, and W is the noise
    vector. H can be calculated as


    H=Y/X . (2)


    H is the CFR sampling information of the channel frequency response in the frequency
    domain, and CSI tools make it possible to obtain a version of the CFR sampling
    with 30 samples [12]. Using an IEEE802.11a/g/n compatible wireless card, a set
    of CSI is extracted from each packet received, with each CSI representing the
    amplitude and phase of an orthogonal frequency division multiplexed subcarrier
    [13]. CSI can be expressed as


    ∠H(f_k)=||H(f_k)|| e^{i sin(∠H(f_k))} , (3)


    where H(f_k) is the CSI of the kth subcarrier with frequency f_k , ||H(f_k)||
    and ∠H(f_k) represent the amplitude and phase of the kth subcarrier, respectively.


    # B. Extreme Learning Machine


    ELM is a single hidden layer feedforward network with a three-layer structure:
    input layer, hidden layer and output layer [14], as shown in Fig. 1. The most
    important feature of ELM is that the parameters of the hidden layer are randomly
    initialised, and only the output weights need to be calculated by least squares
    estimation [15]. Therefore the learning speed is hundreds or thousands of times
    faster than most other machine learning methods and the generalisation ability
    of ELM is also excellent.


    ![](img/bc94f492e7e471f80902b1c5ae1db01e_1_0.png)


    Denoting the number of hidden cells in the feedforward network as L_hn , the output
    function of the ELM can be expressed as


    f(x)=∑_{L_hn}^{i=1} β_i g_i(x) | = g(x)β = T , (4)


    where x denotes the input to the ELM, i.e. the features of the sample, T is the
    label of the data, g denotes the activation function and β denotes the output
    weights. We denote the input weights as w and the bias as b and g(x) can be expressed
    as


    g(x)=[ g(x;w_1,b_1),...,g(x;w_{L_hn},b_{L_hn}) ] . (5)


    Further, Equation (4) can be expressed as


    Gβ = T , (6)


    of which,


    G = [ g(x_1) ; ... ; g(x_{N_s}) ] = [ g_1(x_1) ... g_{L_hn}(x_1) ; ... ; g_1(x_{N_s})
    ... g_{L_hn}(x_{N_s}) ] , (7)


    where N_s indicates the number of samples. In addition,


    T = [ t_1, ..., t_{N_s} ]^T . (8)


    Finally, the estimate of the output weights can be obtained by the following formula


    β̃ = G^† T , (9)'
