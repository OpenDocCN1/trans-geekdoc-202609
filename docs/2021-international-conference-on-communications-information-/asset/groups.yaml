    # III. SYSTEM DESIGN


    # A. Overall Architecture


    The framework of the CSI-based localization system is shown in Fig. 2. CSI Tools
    first collect the CSI samples, then the CSI is pre-processed. After that the features
    are extracted using DTW and fed into ELM to train the model. The test set is processed
