    ## III. 系统设计


    ### A. 总体架构

    CSI 基于定位系统的框架如图 2 所示。CSI Tools 首先采集 CSI 样本，然后对 CSI 进行预处理。之后使用 DTW 提取特征并输入 ELM
    进行模型训练。测试集以相同方式处理以获得特征，然后得到测试结果。


    ![](img/bc94f492e7e471f80902b1c5ae1db01e_2_0.png)


    Fig.2 定位系统的框架。


    ### B. 数据预处理

    采集的原始 CSI 数据包含典型的误差，例如有用的信道状态信息和测量误差，以及由设备干扰或不确定性形成的某些异常值，这些异常值会干扰使用 CSI 进行定位。我们在每个子载波上应用滑动窗口的
    Hampel 滤波器，以去除通常与相邻 CSI 测量值显著不同的异常值。此外，我们应用移动平均滤波器以去除高频噪声。


    ### C. 特征提取

    DTW 是一种动态规划算法，用于计算两个时间序列的相似度，尤其是长度不同的序列。它主要应用于时序数据，例如孤立词语音识别、手势识别、数据挖掘和信息检索。在指纹定位中，指纹几乎总是基于单个数据，很少基于一段数据生成用于定位的指纹。DTW
    计算不同参考点处的目标与不在环境中的目标之间的差异以获得指纹，有效地提取了数据的整体特征。


    ## IV. 评估


    ### A. 实验设置

    我们在由两个 WiFi 设备（即 mini-pc）和一个商用无线接入点（即运行在 5.24 GHz 信道上的 TP-Link WDR5300 带天线）组成的
    802.11n WiFi 网络中部署了系统。mini-pc 配备了用于测量 CSI 的 Intel WiFi Link 5300 卡和三个外部天线。为了评估我们的系统，我们在活动室中进行了实验。我们


    表 I. 定位性能


    | Method | Mean error |

    | ELM | 1.1243m |

    | BPNN | 1.3789m |

    | SVM | 1.3345m |


    我们采用 1 个 AP 和 2 个 MP 的方案以更好地覆盖感兴趣区域。我们在监控区域内均匀选择参考位置。区域被划分为 64 个单元，每个单元大小为 0.6
    m*0.6 m。参考点设置在每个单元的中心，测试点随机散布在整个区域内。每个位置收集一百个数据包。


    ### B. 定位性能

    我们使用平均距离误差作为性能指标。将我们的系统与其他两种机器学习方法进行比较的结果如表 I 所示。可以看出，我们的方法优于 SVM 和 BPNN，证明了 ELM
    算法的有效性，并且使用 DTW 提取特征可以大大提高定位精度。


    ## V. 结论

    在本文中，我们提出了一种基于 WiFi CSI 的无设备室内定位方法，使用两个常见的商用 WiFi 设备和一个接收设备收集 CSI 数据，对收集的 CSI
    数据进行预处理，使用 DTW 提取特征，然后使用 ELM 模型进行定位。该方法在实验室环境中进行了评估，实验结果表明该方法优于 SVM 和 BPNN。在典型的室内环境中，平均距离误差为
    1.12m。


