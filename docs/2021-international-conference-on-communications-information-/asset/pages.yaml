    # III. SYSTEM DESIGN


    # A. Overall Architecture


    The framework of the CSI-based localization system is shown in Fig. 2. CSI Tools
    first collect the CSI samples, then the CSI is pre-processed. After that the features
    are extracted using DTW and fed into ELM to train the model. The test set is processed
    in the same way to obtain the features, and then the test results are obtained.


    ![](img/bc94f492e7e471f80902b1c5ae1db01e_2_0.png)


    Fig.2 The framework of the localization system.


    # B. Data Preprocessing


    The raw CSI data collected contains typical errors such as useful channel state
    information and measurement errors and certain outliers formed by interference
    from equipment or uncertainties that interfere with localization using CSI. We
    apply a hampel filter with a sliding window on each subcarrier to remove outliers
    that are usually significantly different from neighboring CSI measurements. In
    addition, we apply a moving average filter to remove high-frequency noise.


    # C. Feature Extraction


    DTW is a dynamic planning algorithm that calculates the similarity of two time
    series, especially those of different lengths. It is mainly applied to temporal
    data, such as isolated word speech recognition, gesture recognition, data mining
    and information retrieval. In fingerprint localization, fingerprints are almost
    always based on individual data and rarely generate a fingerprint for localization
    based on a segment of data. DTW calculates the difference between the target at
    different


    reference points and the target which is not in the environment to obtain fingerprints,
    which effectively extracts the overall characteristics of the data.


    # IV. EVALUATIONS


    # A. Experimental Setup


    We deployed the system in an 802.11n WiFi network that consisted of two WiFi devices
    (i.e. mini-pc) and a commercial wireless access point (i.e. TP-Link WDR5300 with
    antennas running on the 5.24 GHz channel). mini-pc was equipped with an Intel
    WiFi Link for measuring CSI 5300 card and three external antennas.To evaluate
    our system, we conducted experiments in the activity room. We


    # TABLE I. LOCALIZATION PERFORMANCE


    | Method | Mean error |

    | ELM | 1.1243m |

    | BPNN | 1.3789m |

    | SVM | 1.3345m |


    used a scheme of 1 AP and 2 MPs for better coverage of the area of interest. We
    selected reference locations uniformly within the monitored area. The area was
    divided into 64 cells, each with a size of 0.6 m*0.6 m. The reference points were
    set in each cell’s center, and the test points were randomly scattered throughout
    the area. One hundred packets were collected at each location.


    # B. Localization Performance


    We used the average distance error as the performance metric. The results of comparing
    our system with the other two machine learning methods are shown in Table I. It
    can be seen that our method outperforms SVM and BPNN, proving the effectiveness
    of the ELM algorithm and the localization accuracy can be greatly improved by
    using DTW to extract features.


    # V. CONCLUSION


    In this paper, we propose a device-free indoor localization method based on WiFi
    CSI, using two common commercial WiFi devices and a single receiver device to
    collect CSI data, pre-processing the collected CSI data to extract features using
    DTW, and then using ELM model for localization. The method was evaluated in a
    laboratory environment and experimental results showed that the method was superior
    to SVM and BPNN. The average distance error was 1.12m in a typical indoor environment.


