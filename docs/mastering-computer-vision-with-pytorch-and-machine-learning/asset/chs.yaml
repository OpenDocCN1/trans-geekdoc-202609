  \n### 3.2 深度卷积 GAN 的应用\n\n图 3.3(B) 中显示的虚假 MNIST 图像不够清晰，因为仅包含两个全连接层的模型 G 和模型 D 不够“聪明”。我们将使用强大的深度卷积\
  \ GAN (DCGAN) 来重复该项目。在 DCGAN 中，模型 D 使用卷积神经层将每张图像转换为一个标量，模型 G 使用转置卷积神经层从一个标量恢复每张图像。我们需要了解转置卷积的数学运算。\n\
  \n#### 3.2.1 ConvTranspose2D 的数学运算\n\n利用卷积运算，DCGAN 的判别器模型将数据加载器中一个批次的图像压缩为一个标量张量。从公式\
  \ (2.3) 可知，二维卷积的输出大小为：`m = (n - f + 2p)/s + 1`。DCGAN 的生成器模型使用转置卷积运算将标量转换回图像。该运算也有许多选项，例如：输入通道、输出通道、核大小、步幅、填充、偏置等。转置卷积运算的输出大小可从公式\
  \ (2.3) 推导得出，其中 `m` 为输入张量大小，`n` 为转置卷积运算的输出张量大小。\n\n`n = (m-1)s + f - 2p`\n\n(3.3)\n\
  \n运行以下 Extra Cell ONE 中的代码，你将发现 `ConvTranspose2d` 类是如何工作的。使用 0 到 8 这九个整数构建一个 `1\
  \ × 1 × 3 × 3` 的张量 `X`，其中 `m = 3`。张量 `X` 是 `ConvTranspose2d` 类实例的输入。输入的批次大小为 1，批次中唯一图像的分辨率为\
  \ `3 × 3`，图像通道数为 1。然后将整数张量转换为 float32 张量，因为转置卷积实例接受这种类型的张量，而不接受整数张量。通常，名为 “CT” 的实例的权重和偏置由\
  \ PyTorch 随机初始化。然后通过使用 `nn.Parameter()` 将算子的权重赋值为一个 `1 × 1 × 3 × 3` 的全 1 张量，并将实例的偏置赋值为一个标量零张量。\n\
  \n![](img/bk978-0-7503-6244-3ch3uf8_pr.gif)\n\n```\nX_00 = [[0, 1, 2],\n       \
  \ [3, 4, 5],\n        [6, 7, 8]],\nK_00 = [[1, 1, 1],\n        [1, 1, 1],\n    \
  \    [1, 1, 1]],\nY_00(s = 1) = [[0, 1, 3, 3, 2],\n               [3, 8, 15, 12,\
  \ 7],\n               [9, 21, 36, 27, 15],\n               [9, 20, 33, 24, 13],\n\
  \               [6, 13, 21, 15, 8]]\n```\n\n```\nY_00(s = 3) = [[0, 0, 0, 1, 1,\
  \ 1, 2, 2, 2],\n               [0, 0, 0, 1, 1, 1, 2, 2, 2],\n               [0,\
  \ 0, 0, 1, 1, 1, 2, 2, 2],\n               [3, 3, 3, 4, 4, 4, 5, 5, 5],\n      \
  \         [3, 3, 3, 4, 4, 4, 5, 5, 5],\n               [3, 3, 3, 4, 4, 4, 5, 5,\
  \ 5],\n               [6, 6, 6, 7, 7, 7, 8, 8, 8],\n               [6, 6, 6, 7,\
  \ 7, 7, 8, 8, 8],\n               [6, 6, 6, 7, 7, 7, 8, 8, 8]],\nY_00(s = 2) = [[0,\
  \ 0, 1, 1, 3, 2, 2],\n               [0, 0, 1, 1, 3, 2, 2],\n               [3,\
  \ 3, 8, 5, 12, 7, 7],\n               [3, 3, 7, 4, 9, 5, 5],\n               [9,\
  \ 9, 20, 11, 24, 13, 13],\n               [6, 6, 13, 7, 15, 8, 8],\n           \
  \    [6, 6, 13, 7, 15, 8, 8]]\n```\n\n\n\n\n取 `m` = 3、`f` = 3、`s` = 3 和 `p` = 0\
  \ 代入公式（3.3），得到 `n` = 9。确实，Extra Cell ONE 中上述代码的输出 `Y(s = 3)` 的形状为 1 × 1 × 9 × 9。张量\
  \ `X` 的每个元素在输出 `Y` 中被转换为一个 3 × 3 的子单元，且每个子单元等于 `X` 的元素乘以核张量 `K`。在上述代码中设 `p` = 1\
  \ 或 2 时，输出是通过从 `Y(s = 3)` 张量中剥离一层或两层外层获得的。在下文的讨论中，填充参数 `p` 设置为等于 ZERO。对于步长设置（`s`\
  \ = 2 和 `s` = 1），这些操作稍微有点难以理解。我们知道，PyTorch 中张量的维度索引从 ZERO 开始。为了得到输出张量 `Y(s = 2)`，我们首先通过将\
  \ `Y(s = 3)` 中第 2 行和第 3 行、第 5 行和第 6 行在相同列索引处的两个元素相加来合并它们，然后通过将相同行索引处的每对元素相加来合并第\
  \ 2 列和第 3 列、第 5 列和第 6 列。由于这些操作丢失了两行两列，`Y(s = 2)` 张量的形状为 1 × 1 × 7 × 7。`Y(s = 3)`\
  \ 张量中的红色和蓝色用于显示第 2 行和第 3 行、第 5 行和第 6 行上的元素。要从 `Y(s = 3)` 得到 `Y(s = 1)`，我们首先合并第 1\
  \ 行和第 3 行、第 2 行和第 4 行，得到一个形状为 1 × 1 × 7 × 9 的中间张量。然后在中间张量中，我们合并第 2 行和第 4 行、第 3 行和第\
  \ 5 行。最后，我们对列执行相同的合并操作。这些操作手动处理起来不容易；幸运的是，PyTorch 负责处理它们。\n\nExtra Cell TWO 中的代码用于第二个示例中\
  \ 2D 转置卷积算子的应用。输入图像的形状为 `X.shape = [1,2,3,3]`，核张量的形状为 `K.shape = [2,3,2,2]`，转置卷积的输出张量形状为\
  \ `Y.shape = [X.shape[0], K.shape[1], n, n]`，其中 `n` 由公式（3.3）设定。将 `m` = 3、`f` = 2、`s`\
  \ = 2、`p` = 0 代入 CT 实例，得到 `n` = 6。CT 实例的 `in_channels` 和 `out_channels` 分别等于 `X.shape[1]`\
  \ 和 `K.shape[1]`。在示例中，使用 18 个整数构建输入图像张量 `X`，然后将其转换为 1 × 2 × 3 × 3 的 float32 张量。核张量\
  \ `K` 有两行三列。其六个子单元的形状均为 2 × 2。输出张量的形状为 `Y(X,K).shape = [1,3,6,6]`。`Y(X,K)` 中间的一个子张量是通过对\
  \ (`X[0]`, `K[01]`) 和 (`X[1]`, `K[11]`) 两个 `ConvTranspose2d` 操作的求和结果获得的。例如，`Y` 中间子张量中的元素\
  \ 17 由 17 = 4 × 1 + 13 × 1 得到。\n\n```\nX = \\begin{bmatrix} \\begin{bmatrix} 0 &\
  \ 1 & 2 \\\\ 3 & 4 & 5 \\\\ 6 & 7 & 8 \\\\ \\end{bmatrix}_{X_{0}} \\\\ \\begin{bmatrix}\
  \ 9 & 10 & 11 \\\\ 12 & 13 & 14 \\\\ 15 & 16 & 17 \\\\ \\end{bmatrix}_{X_{1}} \\\
  \\ \\end{bmatrix}^{T},K = \\begin{bmatrix} \\begin{bmatrix} 0 & 0 \\\\ 0 & 0 \\\\\
  \ \\end{bmatrix}_{K_{00}} & \\begin{bmatrix} \\underset{¯}{1} & \\underset{¯}{1}\
  \ \\\\ \\underset{¯}{1} & \\underset{¯}{1} \\\\ \\end{bmatrix}_{K_{01}} & \\begin{bmatrix}\
