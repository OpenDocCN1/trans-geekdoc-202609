  \n**图 9.3.** 对应图 9.2(E) Sigmoid 移位的 U-Net 训练指标。\n\n### 9.2 使用注意力 U-Net 扩散模型生成二次曲线\n\
  \n从噪声开始，去噪扩散概率模型（DDPM）可以生成图像、音频甚至视频，其质量足以以假乱真。DDPM 系统是一种生成模型，由 Jonathan Ho、Ajay\
  \ Jain 和 Pieter Abbeel 在其 2020 年发表的论文中提出（Ho *et al* 2020）。DDPM 经过训练以寻找给定噪声条件下的清晰图像条件分布函数，并利用该条件分布函数执行去噪任务。DDPM\
  \ 的原理易于理解。假设你有一张位于装有清水水箱底部的《蒙娜丽莎》图像，你向水箱中的水滴加黑墨水。墨滴极小，两滴之间的时间间隔足够长，以便让每一滴墨水在水箱中充分扩散。滴滴墨水下去，你的图像被墨水颜料加噪，最终在第\
  \ 1000 滴时，你的图像消失。这是一个前向过程。然后我们使用一种先进工具将墨水从水箱中滴滴取出。当所有 1000 滴墨水都从水箱的水中移除后，我们又能清晰地看到《蒙娜丽莎》。这是一个反向过程或去噪过程。DDPM\
  \ 反向过程中用于图像生成的先进工具是 U-Net 模型。在使用数据集中的图像训练模型后，该模型可以从纯噪声生成假图像。这些假图像并非数据集中的原始图像，但风格与原始图像相同。例如，如果你用巴勃罗·毕加索的画作训练你的\
  \ U-Net 模型，你将获得具有毕加索绘画风格的假图像。去噪扩散概率模型在图像去噪任务中显示出了良好的效果。它们为噪声去除提供了一个概率框架，允许有效处理各种类型的噪声，并生成视觉上令人愉悦的去噪图像。\n\
  \n#### 9.2.1 DDPM 中的前向过程\n\n原始图像 `x[0]`（一条二次曲线或一张数字《蒙娜丽莎》图像）是一个具有未知 PDF `q` 的样本：`x[0]∼q(x)`。在前向过程或扩散过程中，来自标准正态分布的噪声被加到\
  \ `x[0]` 上以获得具有条件 PDF 的潜在图像 `x[1]`：`q(x[1]∣x[0])`。该前向过程基于方差调度 `0<β[1]<β[2]<⋯<β[T]≪\
  \ 1` 逐步进行。方差调度可以是线性、二次、余弦等，就像学习率调度一样。如果时间步 `T` 足够大（∼1000），我们的最终图像 `x[T]` 将是各向同性高斯噪声：`q(x[T]∣x[T−1])\
  \ = N(x[T];0,I)`。所有潜在图像 `x[1], …, x[T]` 具有与原始图像 `x[0]` 相同的维度。在时间步 `t`，潜在图像通过 `x_t\
  \ = √(1 - β_t)x_{t - 1} + √(β_t)ε` 获得，其中 `ε` 是来自与 `x[0]` 维度相同的多元标准正态分布 `N(0,I)`\
  \ 的样本。时间步 `t` 处潜在图像的 PDF 是由前一时间步 `t`−1 处的潜在图像给出的正态分布\n\n```\nq(x_t∣x_{t - 1}) =\
  \ q(x_t∣x_{t - 1},x_0) = \U0001D579(x_t;√(1 - β_t)x_{t - 1},β_tI)\n```\n\n(9.1)\n\
  \n我们知道两个独立正态分布的组合仍然是正态分布。如果两个独立正态分布是 `x ∼ \U0001D579(x;0,σ₁²)` 和 `y ∼ \U0001D579\
  (y;0,σ₂²)`，则有 `z = x + y ∼ \U0001D579(z;0,(σ₁²+σ₂²))`。根据这一事实以及 `α[t] = 1 − β[t]`、`ᾱ_t\
  \ = ∏_{i=1}^t α_i`，时间步 `t` 处的潜在图像 `x_t = √(ᾱ_t)x_0 + √(1 - ᾱ_t)ε` 可以直接通过一个 PDF 从\
  \ `x[0]` 获得：\n\n```\nq(x_t∣x_0) = \U0001D579(x_t;√(ᾱ_t)x_0,(1 - ᾱ_t)I)\n```\n\n\
  (9.2)\n\n扩散过程是一个马尔可夫链，具有方程 (9.2) 所示的近似后验概率分布函数。在前向过程结束时，我们得到 `x[T] ∼ q(x[T]∣x[0])\
  \ = \U0001D579(x[T];0,I)`，即纯噪声。\n\n```\nq(x_{1:T}∣x_0) = ∏_{t=1}^T q(x_t∣x_{t -\
  \ 1}) = q(x_T∣x_{T - 1})…q(x_2∣x_1)q(x_1∣x_0)\n```\n\n(9.3)\n\n\n\n\n图 9.4(A) 中的二次曲线被用作原始图像，以在项目\
  \ 9.2 中演示 DDMP 从噪声生成图像的能力。四千批二次曲线被用于在 DDMP 系统中训练一个 `U-Net` 模型。图 9.4(A) 中的一批二次曲线是由单元格\
  \ 01-03 中的代码生成的；这些代码在前几章中已被多次使用。每批有 64 条曲线，每条曲线上有 64 个点。正向过程的函数在单元格 04 中定义。该函数的超参数设置在该函数前面。对于这个简单的项目，总正向步数设置为\
  \ `T = 200`。模型训练的时间嵌入维度在单元格 04 的第 2 行设置为 100。采用线性调度，beta 值在 200 步内从 0.001 增加到 0.2（单元格\
  \ 04 第 03 行）。那里还列出了许多其他超参数，例如 `α`、`ᾱ`、`√ᾱ` 和 `√(1 - ᾱ)`。仅使用一条原始曲线在时间步 `t = 1, 25,\
  \ 50 和 199` 添加噪声，以便我们在图 9.4(B) 中查看正向过程。在过程结束时，`ᾱ₁₉₉ = 4.2 × 10^(−10)`。根据公式 (9.2)，原始图像对最后一个潜在图像\
  \ `x[199]` 的贡献可以忽略不计。最后一个潜在图像中仅存在标准高斯噪声 `ε`。根据经验法则，我们知道 99.7% 的高斯噪声值位于三个标准差以内。这就是为什么在图\
  \ 9.4(B) 中 `x[199]` 的值沿 `y` 轴分布在 -3 和 3 之间。在单元格 04 中定义的 `q_sample` 函数中，一个 Pytorch\
  \ 函数 `gather()` 对我们来说是新的。在一个额外的 VS code 单元格中运行以下代码，你将了解该函数如何根据另一个 1D 张量 `t` 从 1D\
  \ 张量 `z` 中选取元素：`z = torch.tensor([1, 2, 3, 4, 9]); t = torch.tensor([2, 0]); z.gather(dim\
  \ = −1, index = t)`。这些额外代码的输出是 `[3, 1]`，即 `[z[t[0]], z[t[1]]]`。\n\n![](img/bk978-0-7503-6244-3ch9uf7_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch9uf7b_pr.gif)\n\n![图 9.4. DDPM 的正向和反向过程。(A) 一批二次曲线（单元格\
  \ 03 的输出）。(B) 正向过程中时间步 1、25、50 和 199 处的加噪图像或曲线（单元格 04 的输出）。(C) 从 `t = 199` 开始到 `t\
  \ = 0` 结束的去噪图像（单元格 09 的输出）。](img/bk978-0-7503-6244-3ch9f4_online.jpg)\n\n**图 9.4.**\
  \ DDPM 的正向和反向过程。(A) 一批二次曲线（单元格 03 的输出）。(B) 正向过程中时间步 1、25、50 和 199 处的加噪图像或曲线（单元格\
  \ 04 的输出）。(C) 从 `t = 199` 开始到 `t = 0` 结束的去噪图像（单元格 09 的输出）。\n\n#### 9.2.2 DDPM 中的反向过程\n\
  \n在物理世界中，混合两种材料比混合后再分离它们更容易。在 DDPM 的数字世界中也是如此。正向过程比反向过程容易得多。反向过程是另一个马尔可夫链，起始于纯噪声\
  \ `x[T] ∼ pθ = N(x[T]; 0, I)`，并逐步向后进行以获得去噪的潜在图像：`x[T−1]…, x[t], x[t−1], …, x[0]`，其中\
  \ `θ` 代表 `U-Net` 的参数。图 9.4(C) 展示了从 `t = 199` 处纯噪声开始的反向过程结果。在时间步 `t−1`，潜在图像 `x[t−1]`\
  \ 具有概率密度函数 (PDF) `pθ = N(x[t−1]; μθ, β[t]I)`，其中 `μθ` 来自训练好的 `U-Net` 模型。\n\n反向 PDF\
  \ `pθ` 对应于正向 PDF 的逆过程，且等于 `q(x[t−1]∣x[t], x[0])`，这被称为“正向过程后验分布”。详细推导见 DDPM 论文 (Ho\
  \ *et al* 2020)。为求完整，以下公式 (9.3) 和 (9.4) 来自附录 I\n\n$$q(x_{t - 1}\\mid x_{t},x_{0})\
  \ = \\mathbb{N}(x_{t - 1};\\widetilde{\\mu}(x_{t},x_{0}),{\\widetilde{\\beta}}_{t}I)\
  \ = q(x_{t}\\mid x_{t - 1},x_{0})\\frac{q(x_{t - 1}\\mid x_{0})}{q(x_{t}\\mid x_{0})}$$\n\
  \n(9.4)\n\n$$\\widetilde{\\mu}\\left( {x_{t},x_{0}} \\right) = x_{t} - \\frac{1\
  \ - \\alpha_{t}}{\\sqrt{1 - {\\overline{\\alpha}}_{t}}}\\varepsilon$$\n\n(9.5)\n\
  \n$${\\widetilde{\\beta}}_{t} = \\frac{1 - {\\overline{\\alpha}}_{t - 1}}{1 - {\\\
  overline{\\alpha}}_{t}}\\beta_{t}$$\n\n(9.6)\n\n上述公式将用于模型训练的变分下界损失。反向过程的联合概率分布为：\n\
  \n$$p_{\\theta}\\left( x_{0:T} \\right) = p_{\\theta}\\left( x_{T} \\right)\\prod\\\
  limits_{t = 1}^{T}{p_{\\theta}\\left( {x_{t - 1}\\mid x_{t}} \\right)} = p_{\\theta}\\\
  left( {x_{0}\\mid x_{1}} \\right)p_{\\theta}\\left( {x_{1}\\mid x_{2}} \\right)\\\
  ldots p_{\\theta}\\left( {x_{T - 1}\\mid x_{T}} \\right)p_{\\theta}\\left( x_{T}\
  \ \\right)$$\n\n(9.7)\n\n由联合概率分布和 `∫q(x[0])dx[0] = 1`，我们得到系统用于模型训练的负对数似然（损失函数）：`L\
  \ = −log (pθ) = −log ∫pθdx[1:T]`\n\n$$L = - \\left( {\\int q\\left( x_{0} \\right)dx_{0}}\
  \ \\right){\\ \\log\\ }\\int{q\\left( {x_{1:T}\\mid x_{0}} \\right)}\\frac{p_{\\\
  theta}\\left( x_{0:T} \\right)}{q\\left( {x_{1:T}\\mid x_{0}} \\right)}dx_{1:T}$$\n\
  \n(9.8)\n\n利用 Jensen 不等式，我们可以简化上述公式以得到系统的变分下界损失（附录 I）\n\n$$L < - \\int q\\left(\
  \ x_{0} \\right)dx_{0}\\int q\\left( {x_{1:T}\\mid x_{0}} \\right){\\ \\log\\ }\\\
  frac{p_{\\theta}\\left( x_{0:T} \\right)}{q\\left( {x_{1:T}\\mid x_{0}} \\right)}dx_{1:T}\
  \ = L_{VLB}$$\n\n\n\n\n\n## 变分下界公式\n\n$$L\\_{VLB} = D\\_{KL}(q(x\\_{T}\\mid x\\\
  _{0})\\mid\\mid p\\_{\\theta}(x\\_{T})) + \\sum\\limits\\_{t = 2}^{T}D\\_{KL}(q(x\\\
  _{t - 1}\\mid x\\_{t},x\\_{0})\\mid\\mid p\\_{\\theta}(x\\_{t - 1}\\mid x\\_{t}))\
  \ - \\mathbb{E}\\_{q}\\left\\lbrack {\\log\\ p\\_{\\theta}(x\\_{0}\\mid x\\_{1})}\
  \ \\right\\rbrack$$\n\n$$L\\_{VLB} = L\\_{T} + \\sum\\limits\\_{t = 2}^{T}L\\_{t\
  \ - 1} + L\\_{0}$$\n\n该过程的变分下界是每个时间步损失之和：$L = L\\_0 + L\\_1 + \\dots + L\\_T$。$L\\\
  _{VLB}$ 中的每个 $D\\_{KL}$ 项（$L\\_0$ 除外）都是关于两个高斯分布之间的差异，因此可以直接计算。$L\\_{T}$ 在模型训练期间可以忽略，因为它是一个常数；$L\\\
  _0$ 也被忽略，因为 DDPM 论文的作者发现不包含该项时效果更好。\n\n基于 $q(x\\_{t-1}\\mid x\\_t,x\\_0) = \\mathcal{N}(x\\\
  _{t-1};\\tilde{\\mu}(x\\_t,x\\_0),\\tilde{\\beta}\\_t I)$ 和 $p\\_{\\theta}(x\\_{t-1}\\\
  mid x\\_t) = \\mathcal{N}(x\\_{t-1};\\mu\\_{\\theta}(x\\_t,t),\\sigma\\_t² I)$，我们得到以下公式，其中\
  \ $C$ 是与模型训练无关的常数，$t = 2,3,\\dots,T$：\n\n$$L\\_{t - 1} = D\\_{KL}(q(x\\_{t - 1}\\\
  mid x\\_{t},x\\_{0})\\mid\\mid p\\_{\\theta}(x\\_{t - 1}\\mid x\\_{t})) = \\mathbb{E}\\\
  _{q}\\left( {\\frac{1}{2\\sigma\\_{t}^{2}}{\\mid\\mid}{\\tilde{\\mu}}\\_{t}(x\\\
  _{t},x\\_{0}) - \\mu\\_{\\theta}(x\\_{t},t){\\mid\\mid}^{2}} \\right) + C$$\n\n\
  DDPM 论文的作者将预测的 $\\mu\\_{\\theta}(x\\_t,t)$ 设置为与公式 (9.5) 中所示的 $\\tilde{\\mu}\\_t(x\\\
  _t,x\\_0)$ 具有相同格式，并忽略公式中的所有繁杂项，得到一个重加权版本的 $L\\_{VLB}$，该版本强调重建质量，其中 $\\varepsilon\\\
  _{\\theta}$ 是一个旨在从 $x\\_t$ 预测 $\\varepsilon$ 的函数逼近器：\n\n$$L\\_{t-1} = E\\_{x\\_0,\\\
  varepsilon}(\\parallel\\varepsilon - \\varepsilon\\_{\\theta}(x\\_t,t)\\parallel²)\
  \ \\tag{9.9}$$\n\n我们训练 U-Net 模型在时间步 $t$ 预测噪声 $\\varepsilon\\_{\\theta}$，然后根据公式 (9.9)\
  \ 在均方误差 (MSE) 损失函数中计算预测噪声 $\\varepsilon\\_{\\theta}$ 与噪声 $\\varepsilon$ 之间的差异，其中\
  \ $x\\_t = \\sqrt{\\bar{\\alpha}\\_t}x\\_0 + \\sqrt{1 - \\bar{\\alpha}\\_t}\\varepsilon$。\n\
  \n`Cell 06` 中定义的一个函数用于根据上述 DDPM 理论训练 U-Net，并做了一点修改。为了节省模型训练时间，我们不在每个批次中对每张图像使用所有时间步。`Cell\
  \ 07` 第 10 行的代码生成一批从 0 到 $T-1$（包含）的随机整数作为时间步。通过第 12 行的代码，我们通过添加第 11 行代码生成的一批噪声 $\\\
  varepsilon$，获得那些时间步下的一批潜在图像 $x\\_t$。然后 U-Net 为我们预测噪声 $\\varepsilon\\_{\\theta}$，以便根据公式\
  \ (9.9) 计算 MSE 损失。\n\n`Cell 05` 中定义的第一个函数用于时间戳。U-Net 的主干网络与第 9.1 节中的相同，但有许多修改。我们必须通过基本块（`Cell\
  \ 06` 的 `Basic` 类）中的时间嵌入用时间戳标记潜在图像。我们在第 3.3 节中为条件 GAN 使用了标签信息嵌入。时间嵌入可以通过多种方式完成。`Cell\
  \ 05` 中定义的 `sinusoidal_embedding` 函数代码受 Brian Pulfer 的 [GitHub](https://medium.com/mlearning-ai/enerating-images-with-ddpms-a-pytorch-implementation-cef5a2ba8cb1)\
  \ 仓库代码启发。多头自注意力类（`MHSA`，Petit 等人 [2020]）用于桥接部分。该类实例内部有四个自注意力头。该实例的输入 Q、K 和 V 相同：一个经过层归一化和重塑的桥接张量。关于多头自注意力的详细信息将在第\
  \ 10 章提供。单头交叉注意力类（`Attention`）用于修改 U-Net 的跳跃连接。我在观看 DigitalSreeni 的 [YouTube 视频](https://www.youtube.com/watch?v=KOF38xAvo8I)\
  \ 并阅读 Attention U-Net 论文（Oktay 等人 [2018]）后编写了单头交叉注意力代码。带有注意力机制的 U-Net 给图像的相关部分更大的权重。在\
  \ `Cell 06` 的 `Basic` 类中，使用快捷连接构建残差网络，并使用了层归一化。花费了很长时间才得到图 9.4(C) 所示的平滑二次曲线。`Cell\
  \ 09` 中定义的函数基于公式 (9.5)–(9.6) 从纯噪声生成图像。\n\n![图 9.4(A)](img/bk978-0-7503-6244-3ch9uf8_pr.gif)\n\
