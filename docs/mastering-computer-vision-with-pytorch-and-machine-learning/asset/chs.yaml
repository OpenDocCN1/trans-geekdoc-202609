  \ Machine Learning\n\n# Caide Xiao\n\n* * *\n\n# 第 10 章\n\n## 视觉 Transformer 的应用\n\
  \n使用基于 Transformer 而非卷积网络的模型，计算机足以理解人类语言。用于计算机视觉任务的 Transformer 称为视觉 Transformer。第一节介绍了基本视觉\
  \ Transformer 的架构。随后四节使用预训练的视觉 Transformer 对自定义数据集进行图像分类和目标检测，无需模型训练（零样本）。\n\n\n\
  \n\n# OpenAI 的 ChatGPT（生成式预训练 Transformer）的诞生是计算机科学领域的一次突破\n\n人们可以与计算机聊天，讨论任何主题。ChatGPT\
  \ 似乎无所不知，能够回答人们提出的许多问题。在 ChatGPT 网站的界面上，我使用了文本提示词“please write Python codes about\
  \ logistic regression for me”（请为我编写关于逻辑回归的 Python 代码）。随后在几秒钟内，我就能从 ChatGPT 复制代码并粘贴到\
  \ VS Code 的一个单元格中运行。计算机已通过图灵测试，这是 AI 领域的一种探究方法，用于判断计算机是否具备像人类一样思考的能力。\n\nChatGPT\
  \ 是一种语言模型，它使用 Transformer（Vaswani *et al* 2017）进行自然语言处理（NLP）任务，如语言翻译、文本分类和文本生成。Transformer\
  \ 中包含一个编码器和一个解码器。用自然语言编写的文本提示词中的单词被数字化为高维向量空间中的 Token。Token 是一个小的信息单元。这些嵌入了文本提示词中单词序列信息的\
  \ Token 被用作 Transformer 编码器的输入。Transformer 中使用自注意力机制来捕捉论文中不同 Token 之间的依赖关系。Transformer\
  \ 的使用给 NLP 任务带来了革命性的改进。\n\n视觉 Transformer（ViT）是经过修改的 NLP Transformer，用于计算机视觉任务，如图像分类和目标检测。视觉\
  \ Transformer 由 Dosovitskiy *et al* 在其 2020 年的论文（Dosovitskiy *et al* 2020）中提出，题为“An\
  \ Image Is Worth 16 × 16 Words: Transformers for Image Recognition at Scale”（“一幅图像胜过\
  \ 16 × 16 个词：大规模图像识别 Transformer”）。与传统卷积神经网络使用一系列卷积和池化层从图像中提取局部特征不同，基于 NLP Transformer\
  \ 的 ViT 可以捕捉图像不同部分之间的空间关系。\n\n### 10.1 基础 ViT 模型的架构\n\n在基于 ViT 论文（Dosovitskiy *et\
  \ al* 2020）的基础 ViT 模型中，仅有一个经过修改的编码器，没有解码器。输入 ViT 模型的任何彩色图像都应调整大小为 `3 × 224 × 224`，然后按指定的补丁大小分割成一个补丁网格。如果补丁大小为\
  \ 8，则图像被分割成 784 (=224/8 × 28) 个补丁。每个彩色补丁随后被展平为一个一维数组，作为一个包含 192 (=3 × 8 × 8) 个元素的\
  \ Token。ViT 的核心思想是将图像视为一系列 Token，然后使用 Transformer 的编码器处理这些 Token。这使得 ViT 能够捕捉整幅图像的全局信息，而不仅仅是\
  \ CNN 网络从特定区域获取的局部信息。视觉 Transformer 已取得最先进的性能。它们也已被用于各种应用，包括图像描述生成、图像生成和视频分类。以下项目\
  \ 10.1.1 中的代码用于解释基础 ViT 模型的架构。\n\n照常，单元格 01 中的代码导入项目所需的库，并在一个名为 `config` 的字典中设置超参数。在单元格\
  \ 02 中定义的类里，使用了一个名为 `einops` 的工具或库，根据文本指令 `b c (h h1) (w w1) -> b (h w) c h1 w1`\
  \ 重塑和排列输入图像，其中 b、c、h1 和 w1 分别代表批次大小、图像通道数（=3）、行和列方向上的补丁大小（= 8 像素）。基于已知的输入图像尺寸（224），该类的一个实例计算出另外两个参数\
  \ h 和 w（28 = 224/8）。Einops 是计算机视觉中用于张量操作的强大库。名称 `einops` 代表“Einstein operations”（爱因斯坦运算），灵感源自物理学中爱因斯坦在其相对论中用于表达张量运算的爱因斯坦求和约定。文本指令中一对括号内的两个参数用于表示一个参数的值，该值等于这两个参数的乘积。例如，`(h\
  \ h1)` 对应图像高度 224 这一参数，其值等于 28 × 8。虽然我们可以使用 PyTorch 工具（如 `reshape` 和 `permute`）完成相同的工作，但\
  \ `einops` 配合文本提示词更易于理解。然后，图像的每个彩色补丁被展平为一个包含 192 个元素的张量（D = 3 × 8 × 8）。通过上述操作，一个二维图像\
  \ *x* ∈ ℜ^(*C* × *H* × *W*) 被分割成一系列展平的二维补丁 *x*[*p*] ∈ *R*^(*N* × (*P*² ⋅ *C*))，其中\
  \ *H*×*W* 是输入图像的分辨率，*C* 是图像通道数，*P* 是补丁大小，而 *N* (= *HW*/*P*²) 是补丁数量。每个展平的补丁就像 NLP\
  \ 中的词 Token 一样是一个 Token。Token 的使用使 ViT 能够学习图像不同区域之间的关系，并基于图像的整体上下文进行预测（图 10.1）。\n\
  \n![](img/bk978-0-7503-6244-3ch10uf1_pr.gif)\n\n![图 10.1. (A) 一张分辨率为 3 × 244 × 244\
  \ 的图像通过单元格 02 中的 einops 操作直接分割成了一个 28 × 28 的补丁网格。(B) 同一张图像通过卷积操作分割并重塑为 [1, 786,\
  \ 3, 8, 8]。](images/bk978-0-7503-6244-3ch10f1_online.jpg)\n\n**图 10.1.** (A) 一张分辨率为\
  \ 3 × 244 × 244 的图像通过单元格 02 中的 einops 操作直接分割成了一个 28 × 28 的补丁网格。(B) 同一张图像通过卷积操作分割并重塑为\
  \ [1, 786, 3, 8, 8]。\n\n通过以下单元格 03 中的代码，一个名为“cls”的可学习 Token *z*[00] = *x*[class]\
  \ 随后被添加到用于图像分类的 Token 序列的开头。cls Token 的维度与展平补丁的维度相同。由于图像补丁的序列与论文中的单词一样重要，我们需要向 Token\
  \ 添加位置嵌入以保留位置信息。这些操作的结果是一个张量 z[0]，作为 ViT 编码器的输入，如公式 (10.1) 所示，其中 *Ε*[*p**o**s*] ∈\
  \ ℜ^((*N* + 1) × *D*)，*E* ∈ *Ε*[*p**o**s*] 是一个可训练的位置嵌入张量，而 *Ε*[*p**o**s*] ∈ ℜ^((*P*² ⋅ *C*) × *D*)\
  \ 是下方单元格 02 中卷积操作得出的一个可学习的线性投影张量。上述带有 einops 操作的单元格 02 仅用于图像补丁的可视化。\n\n```\n*z*[0] = \\\
  [*x*[class],*x*[*p*[1]]*E*,*x*[*p*[2]]*E*,…,*x*[*p*[*N*]]*E*\\]^(*T*) + *Ε*[*p**o**s*]\n\
  ```\n\n(10.1)\n\n\n\n\n# ViT 模型架构与实现\n\n## 前向传播与 Token 嵌入\n\n在 Cell 03 中定义的类的前向函数里，输入是一个形状为\
  \ `[b, 3, 224, 224]` 的图像批次，其中参数 `b` 为批次大小。通过 Cell 02 中定义的类的一个实例（包含一个卷积和一个 permute\
  \ 操作），输入图像被分割成一个形状为 `[b, 784, 192]` 的张量。Cell 03 第 06 行的代码创建了一个可学习的 `cls` token。第\
  \ 14 行的代码将其扩展以适应批次中的每一张图像。在将 `cls` token 前置到批次中每张图像的 token 序列前后，我们为每张图像的每个 token\
  \ 加上一个位置嵌入张量。PyTorch 会通过广播机制处理这两个张量之间的维度差异。为了减少过拟合问题，我们需要对 Cell 03 的输出进行 dropout\
  \ 操作。在 Cell 03 之后的一个额外单元格中运行代码 `f2=Embeded_Imgs(config);emb_img=f2(my_img); emb_img.shape`，我们将得知对于仅包含一张图像的批次，Cell\
  \ 03 的输出形状为 `[1, 785, 192]`。\n\n![](img/bk978-0-7503-6244-3ch10uf2_pr.gif)\n\n##\
  \ Transformer 编码器架构\n\n基本 ViT 模型的架构如图 10.2 左侧所示。来自 Cell 03 或公式 (10.1) 的那些 token\
  \ 由 12 个串联的 transformer 编码器层处理。它们细化输入图像的表征。编码器层的结构如图中间所示。在编码器层内部，有一个多头注意力块，它包含六个并联的自注意力头来处理每个批次的\
  \ token。单个自注意力头的结构如图右侧所示。每个自注意力头的输入和输出形状相同，均为 `[b, 785, 192]`。根据公式 (10.2)，我们可以在\
  \ Cell 04 中编写自注意力头的代码。在公式和图中，两个张量之间的点表示点积。三个张量 `Q`、`K` 和 `V` 分别是三个全连接层的输出。任意全连接层的输入相同：一批图像的\
  \ token 批次，且 `D` 等于 192（颜色补丁的像素数：3 × 8 × 8）。所有六个自注意力块的输出随后由 Cell 05 第 18 行的代码拼接成一个形状为\
  \ `[b, 785, 192 × 6]` 的更大张量。然后由第 21 行的代码使用一个全连接层将该大张量投影回形状为 `[b, 785, 192]` 的张量。经过一个作用于投影结果的\
  \ dropout 操作后，最终结果作为一个包含两个元素的元组输出。第一个元素是一个批次 token 的注意力张量，元组的第二个元素用于注意力概率。我们可以运行代码\
  \ `f4=MultiHeadAttention(config); Y=f4(emb_img)[0]; Y.shape` 来检查类代码是否正常工作。\n\n$$\n\
  \\text{Attention}(Q,K,V) = \\text{softmax}\\left( \\frac{Q \\cdot K^{T}}{\\sqrt{D}}\
  \ \\right) \\cdot V\n$$\n\n(10.2)\n\n![](img/bk978-0-7503-6244-3ch10uf3_pr.gif)\n\
  \n![Figure 10.2. The architecture of a basic ViT model, an encoder layer or block\
  \ inside the ViT model and a single self-attention head (right). The arrows indicate\
  \ information flowing directions.](img/bk978-0-7503-6244-3ch10f2_online.jpg)\n\n\
  **图 10.2.** 基本 ViT 模型的架构、ViT 模型内部的编码器层或块以及单个自注意力头（右）。箭头指示信息流动方向。\n\n## 编码器层细节\n\n\
  Transformer 编码器的输入是一批图像的 token。因为每张图像的每个 token 都嵌入了位置信息，所以我们在编码器中不应使用批归一化，而应使用层归一化。此外，编码器块中使用了两个残差连接（Cell\
  \ 06 第 19、21 行）。在编码器层的 MLP（多层感知机）块中，有两个全连接层，中间夹着一个激活类 `nn.GELU()`（Cell 06 第 12 行）。MLP\
  \ 块中也使用了 Dropout。\n\nCell 07 中每个 12 个 (=L) 编码器层的数学运算可用公式 (10.3) 和 (10.4) 表示。以第一层为例，输入\
  \ token `z[0]` 经过第一个层归一化的输出为 `LN(z[0])`，随后由多头自注意力块处理得到 `MSA(LN(z[0]))`。利用公式 (10.3)，我们获得第一个编码器层中第一个残差块的临时输出\
  \ `Φ[0]`。将 `Φ[0]` 作为第一个编码器层中第二个残差块的输入并使用公式 (10.4)，我们得到 `z[1]`，即第一个编码器层的输出。最后一个编码器层的输出也是一个包含两个元素的元组，分别关于\
  \ token 和注意力分数。\n\n$$\n\\Phi[\\ell - 1] = \\text{MSA}(\\text{LN}(z[\\ell - 1]))\
  \ + z[\\ell - 1] \\quad \\ell = 1, 2, ..., L\n$$\n\n(10.3)\n\n$$\nz[\\ell] = \\\
  text{MLP}(\\text{LN}(\\Phi[\\ell - 1])) + \\Phi[\\ell - 1] \\quad \\ell = 1, 2,\
  \ ..., L\n$$\n\n(10.4)\n\n$$\ny = \\text{MLP}(z[L][:,0])\n$$\n\n(10.5)\n\n我们仅使用\
  \ `z[L][b, 0, 192]` 进行图像分类。公式 (10.5) 中 `z[L][:,0]` 的形状为 `[b, 192]`。在最后一个 transformer\
  \ 层之上添加一个分类头，以便进行图像分类预测。我们可以通过在 Cell 07 之后的一个额外单元格中运行代码 `f6=Vit(config); f6(my_img)`\
  \ 来确保上述所有类中的代码均正常工作。使用第 2 章项目 2.1 中 Cell 10 的代码，你会发现 Cell 07 中定义的 ViT 模型共有 14,443,018\
  \ 个参数。\n\n![](img/bk978-0-7503-6244-3ch10uf4a_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch10uf4b_pr.gif)\n\
  \n### 10.2 用于 CIFAR10 图像分类的 Hugging Face ViT\n\n我想将上述 ViT 模型用于 CIFAR10 图像分类。由于模型参数量超过\
  \ 1000 万，ViT 模型训练的计算任务对于我的笔记本电脑来说过于繁重，无法处理调整大小为 224 × 224 的 5 万张图像。我必须使用预训练的 Hugging\
  \ Face ViT 模型来展示视觉 transformer 的强大能力。因为预训练模型约有 8600 万个参数，我必须冻结它们，仅训练最后一层中用于图像分类的少量参数以节省时间。从\
  \ YouTube、GitHub、Kaggle 和 Google Colab，我们可以找到演示如何微调用于 CIFAR10 的 Hugging Face ViT\
  \ 模型的代码。我的代码受这些人的代码启发。以下项目 10.2 的图像分类准确率在训练集、验证集和测试集上分别为 94.9%、94.5% 和 94.7%。代码运行时间约为\
  \ 33 分钟（10 个 epoch）。\n\n\n\n\n使用预训练的 Hugging Face ViT 模型 `google/vit-base-patch16–224-in21k`，我们可以轻松编写项目\
  \ 10.2 的代码，其代码结构与第 2 章项目 2.3 几乎相同。Hugging Face 提供了一个名为 `datasets` 的库，用于从互联网下载数据集（Cell\
  \ 01 第 05 行），使用非常方便。从互联网下载的数据集保存在硬盘上，即使重启笔记本电脑，也无需再次下载即可使用。在 Kaggle 和 Google Colab\
  \ 中，重启使用这两个免费 GPU 系统中的任意一个时，都必须重新下载代码。Hugging Face 的许多库适用于 Python 3.6 以上版本。本项目代码在\
  \ VS Code 的 Python v3.9 中测试运行良好。如果在 Cell 01 之后打印 `train_ds[0]`，你将看到一个包含两个键 `img`\
  \ 和 `label` 的字典，而不是第 1–9 章中的元组。\n\nCell 01 第 09 行的 Hugging Face 类 `ViTImageProcessor`\
  \ 可用于将图像修改为预训练 ViT 模型所需的特定格式。打印处理器或使用 Cell 02 最后一行的代码，你将看到许多图像增强操作，如 normalize、rescale、resize\
  \ 等。Cell 03 中定义的函数将处理后的图像数据集打包进数据加载器，Cell 04 中的代码显示训练数据加载器中的一个批次图像。从 Cell 04 第一行的\
  \ for 循环中，你会发现数据加载器中的每个样本都是一个字典，分别包含 `label` 键和 `pixel_values` 键。\n\n![](img/bk978-0-7503-6244-3ch10uf5_pr.gif)\n\
  ![](img/bk978-0-7503-6244-3ch10uf6_pr.gif)\n![](img/bk978-0-7503-6244-3ch10uf7_pr.gif)\n\
  \n### 10.3 基于 OpenAI CLIP 的零样本图像分类\n\n要理解什么是“零样本”，我们需要回顾第 2 章的图像分类。为了在图像分类项目中获得良好结果，我们必须使用尽可能多的样本来训练\
  \ ResNet 模型。如果训练模型所需的样本数量为 *N*，则模型需要 N-shot 学习。零样本图像分类是指神经网络系统在无需模型训练的情况下将图像分类到各类别的能力。OpenAI\
  \ 的 CLIP（Radford *et al* 2021）如何实现零样本学习？CLIP 是“contrastive language image pretraining”（对比语言-图像预训练）的缩写，是由\
  \ OpenAI 开发的一种基于 Transformer 的框架。CLIP 系统包含两个模型：第一个是文本 Transformer，将文本编码到 512 维空间；第二个是视觉\
  \ Transformer (ViT)，将图像编码到同一空间。OpenAI 在包含 4 亿个文本-图像对的数据集上训练了 CLIP。每一对图像及其标题在该空间中是两个接近的点。我们可以从图像找到其标题文本，反之亦然。零样本图像分类无需训练模型，因为\
  \ OpenAI 已为我们训练好了 CLIP 系统。这种零样本能力是 CLIP 的显著优势，因为它消除了在特定类别上微调或重新训练的需求。然而，CLIP 也有其局限性。预测准确性取决于训练数据的质量和多样性。此外，CLIP\
  \ 可能难以用几个词描述单张图像，因为“一图胜千言”。\n\n以下两个项目的代码灵感来源于 CLIP 的 GitHub 存储库代码。照常，项目 10.3.1 Cell\
  \ 01 中的代码导入必要的库。由于无需模型训练，因此没有超参数需要设置。项目使用 CIFAR10 的测试数据集。Cell 01 第 06 行代码打印出数据集的类别标签。我们将用它们来识别测试数据集中\
  \ 10,000 张图像中的物体，该数据集结构与第 2 章相同。在 Cell 01 之后的一个额外单元格中运行 `clip.available_models()`，你将看到九个\
  \ CLIP 模型。使用 `ViT-B/32` 和 `ViT-L/14` 模型，我分别获得了 88.79% 和 95.32% 的准确率，程序运行时间分别为 2\
  \ 分钟和 3.5 分钟。Cell 01 最后一行 `model` 后面的 `preprocess` 代码用于图像增强。在另一个额外单元格中，你可以 `print(preprocess)`\
  \ 来查看许多增强操作：`resize(244)`、`centerCrop((224,224))`、`to RGB`、`ToTensor` 和 `normalize`。利用\
  \ Cell 02 中定义的拟合函数，测试数据集中的图像在 for 循环中逐一检查。循环前，数据集的 10 个标签通过 `clip.tokenize` 编码为一个\
  \ 10 × 512 的张量。每个标签前预置了文本字符串 `a photo of a`。根据 CLIP 论文（Radford *et al* 2021），在每个标签添加这些额外单词后，CLIP\
  \ 模型性能更好。Cell 02 第 11 行代码将批次中的单张图像编码为 1 × 512 张量。第 13 行通过编码后的图像张量和标签张量的点积，得到 CIFAR10\
  \ 图像中物体的类别身份。最终结果见表 10.1，零样本分类的平均准确率为 95.3%。在第 2 章中，同一测试数据集的准确率为 92%。\n\n![](img/bk978-0-7503-6244-3ch10uf8a_pr.gif)\n\
