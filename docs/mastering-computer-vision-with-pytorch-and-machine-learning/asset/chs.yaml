  \n# 第 9 章\n\n## 用于图像分割的 U-Net 和用于图像生成的扩散模型\n\nU-Net 是一种具有特殊架构的 ResNet，易于训练且所需训练样本少。在第\
  \ 9.1 节中，U-Net 被用于视网膜血管分割。附录 H 中列出了将 U-Net 作为图像生成器用于同一任务的 WGAN-GP 代码。在第 9.3 节中，基于\
  \ U-Net 的 Hugging Face 预训练扩散模型被用于为牛津花卉数据集生成照片级真实感图像。数学原理在第 9.2 节中通过生成二次曲线的代码进行了解释。使用\
  \ Hugging Face 的 Stable Diffusion 模型，我们甚至可以指示计算机根据我们的文本提示生成美丽的图像。\n\nYOLOv8 在目标检测和分割方面非常强大，但这些目标必须是可计数的。许客体如我们体内的血管系统和地球上的河流系统具有分形结构。为了分割来自显微镜或卫星的、关于具有分形结构的不可计数物体的图像，我们可以使用\
  \ U-Net，这是一种由 Olaf Ronneberger、Philipp Fischer 和 Thomas Brox 在他们 2015 年发表的论文（Ronneberger\
  \ *et al* 2015）中提出的残差卷积网络。该论文标题为“U-Net：用于生物医学图像分割的卷积网络”。U-Net 架构已被证明在各种图像分割任务中有效，特别是在可用训练数据有限的情况下。使用少于\
  \ 100 张图像训练 U-Net，我们就能快速获得优秀的分割结果。它能够实现准确且详细的分割结果，捕捉图像中的局部和全局信息。U-Net 也被用于扩散模型进行图像生成。来自扩散模型的生成图像具有照片级真实感质量。\n\
  \n### 9.1 DRIVE 数据集的 U-Net 视网膜血管分割\n\nDRIVE 数据集用于演示 U-Net 的超强能力。该数据集名称是“用于血管提取的数字视网膜图像”（Digital\
  \ Retinal Images for Vessel Extraction，DRIVE）的缩写。该数据集由 Joes Staal *et al*在其论文（Staal\
  \ *et al* 2004）中引入，论文标题为“基于脊线的视网膜彩色图像血管分割”。我们可以从 Kaggle 下载该数据集的 zip 文件。压缩文件大小小于\
  \ 30 MB。解压文件到名为`d:\\Retina`的文件夹后，我们可以找到一个“training”子文件夹和一个“test”子文件夹。这两个子文件夹各自包含一个“images”子文件夹，里面有\
  \ 20 张 TIF 格式的彩色眼底图像（图 9.1(A)）。所有彩色图像的分辨率相同：565 × 584 像素，每通道 8 位（三通道）。根据 Staal 的说法，这些图像来自荷兰的一个糖尿病视网膜病变筛查项目，40\
  \ 张图像中有 7 张涉及异常病理病例。在训练子文件夹中，有一个名为`1st_manual`的文件夹，包含 20 张黑白 GIF 图像（图 9.1(B)）。它们是由一位眼科专家手动分割的结果，并被用作模型训练的真值。从图\
  \ 9.1 所示图像中，我们可以了解我们要对这些图像做什么：在下面的项目 9.1 中，利用 U-Net 从这些彩色眼底图像自动生成血管的黑白图像（图 9.1(C)）。U-Net\
  \ 架构有几个关键特征：\n\n*   **收缩路径**（图 9.1(C)左侧）由一系列卷积层和池化层组成，逐步降低空间分辨率同时增加特征通道数。该路径捕捉上下文并从输入图像中提取高层特征。\n\
  *   **扩张路径**（图 9.1(C)右侧）由一系列转置卷积层和卷积层组成，增加空间分辨率同时减少特征通道数。它将收缩路径的低层特征与高层特征相结合，以生成详细的分割图。\n\
  *   **跳跃连接**（图 9.1(C)中的水平箭头）连接收缩路径和扩张路径中对应的层，使网络能够同时利用局部和全局信息进行准确分割。跳跃连接即残差连接。\n\
  *   **最终层**：U-Net 的最后一层是一个 1 × 1 卷积层。\n\n\n\n\n一如既往，我们在项目 9.1 的 Cell 01 中导入库并设置所有超参数。Cell\
  \ 02 中定义的一个类用于将图像打包成训练数据集和验证数据集。由于训练数据集仅有 20 张图像用于模型训练，我们必须进行大量图像增强：调整大小、旋转、水平翻转、垂直翻转和归一化。图\
  \ 9.1(A) 所示的彩色图像经过了垂直翻转，因为每张原始彩色图像上的一个小彩色凸起位于模拟时钟 1:30 的位置。每张彩色图像的掩码图像应具有相同的增强效果。Cell\
  \ 02 第 11 行开始的代码对彩色图像及其掩码同时进行增强。随后，Cell 03 中的代码将这两个数据集切片为两个数据加载器。Cell 04 中的代码显示训练数据加载器中的一个批次图像。由于\
  \ DRIVE 数据集中的图像分辨率较高（512 × 512），我的电脑只能处理批次大小为 2 的数据加载器。\n\n![Figure 9.1. A color\
  \ fundus image (A) and its mask (B) (cropped outputs of Cell 04). (C) The architecture\
  \ of a U-Net.](img/bk978-0-7503-6244-3ch9f1_online.jpg)\n\n**图 9.1.** 一张彩色眼底图像 (A)\
  \ 及其掩码 (B)（Cell 04 的裁剪输出）。(C) U-Net 的架构。\n\n项目中使用的 U-Net 架构如图 9.1(C) 所示。它与 Olaf\
  \ Ronneberger 的 U-Net（Ronneberger *et al* 2015）略有不同，后者未使用批量归一化（Ioffe and Szegedy\
  \ 2015），因为该算子当时尚未发明。U-Net 的输入是形状为 `N × 3 × 512²` 的一批彩色图像，输出是形状为 `N × 1 × 512²` 的一批黑白图像，其中\
  \ `N` 为批次大小。在模型训练期间，输出图像将通过带 logits 的 BCE 损失函数被强制与这些彩色图像的掩码相匹配。在 PyTorch 中，该损失函数“将\
  \ Sigmoid 层和 BCE Loss 结合在一个单一的类中。与使用普通的 sigmoid 后接 BCE Loss 相比，此版本在数值上更稳定，因为通过将操作合并到一层中，我们利用了\
  \ log-sum-exp 技巧来保证数值稳定性。”ExtraCell ONE 中的代码用于演示如何根据公式 $L = - \\frac{1}{N}\\sum\\\
  limits_{i = 1}^{N}\\left\\lbrack {y_{i}\\ \\ln(\\sigma{(\\widehat{y}_{i})}) + (1\
  \ - y_{i})\\ln(1 - \\sigma{(\\widehat{y}_{i})})} \\right\\rbrack$inline-graphic\
  \ style=\"height:3.25em;\" xlink:href=\"bk978-0-7503-6244-3ch9ieqn1.gif\"/ 自动和手动计算损失函数的值。\n\
  \n![](img/bk978-0-7503-6244-3ch9uf1_pr.gif)\n\n图 9.1(C) 中不同颜色和大小的矩形代表不同形状的图像数据，不同颜色的箭头代表作用于图像数据的算子。每个矩形的宽度与每批处理后图像数据的通道数成正比，每个矩形的高度与每批处理后图像数据的分辨率成正比。数据集中的图像被调整为相同的宽度和高度，我们将这些图像的尺寸定义为其宽度或高度（Cell\
  \ 01 第 13 行）。U-Net 左侧有四个编码器（E1 到 E4），右侧有四个解码器（D1 到 D4）。每个编码器有一个输入和两个输出。例如，编码器 E4\
  \ 的输出 `skip4` 将用作解码器 D1 的输入，E4 的另一个输出是 `p4`：对 `skip4` 的一个副本应用 `2 × 2 MaxPool2d`\
  \ 算子的结果。E4 的第二个输出随后被用作连接解码器 D1 的桥接层的输入。\n\n每个解码器有两个输入和一个输出。例如，解码器 D1 的第一个输入是形状为\
  \ `N×512 × 64²` 的 `skip4`，其第二个输入是 `b`：形状为 `N×1024 × 32²` 的桥接层输出。解码器 D1 首先通过转置卷积算子作用于第二个输入，使转置卷积的输出形状与第一个输入的形状匹配，以便沿通道方向进行拼接。拼接结果是一个形状为\
  \ `N×1024 × 64²` 的张量。该张量随后由一个基础块处理以得到 `up1`：D1 的输出，形状为 `N×512 × 64²`。从 Cell 06 中定义的\
  \ `Basic` 类可以看出，每个基础块包含两个卷积层。基础块会改变其输入的通道数，而不改变其输入的分辨率。在四个编码器和桥接层中，基础块增加图像通道数；在四个解码器中，基础块减少图像通道数。四个编码器中的四个\
  \ `MaxPool2d` 算子将图像尺寸减半。利用四个解码器中的四个转置卷积，我们使 U-Net 输出的分辨率与输入图像的分辨率相匹配。U-Net 输出图像的通道数可以是我们为项目设置的任意整数。例如，如果我们的项目用于分割数据集图像中的\
  \ 10 个物体，我们 U-Net 的输出图像通道数将为 10，并且我们必须使用交叉熵损失函数进行模型训练。\n\n![](img/bk978-0-7503-6244-3ch9uf2_pr.gif)\n\
