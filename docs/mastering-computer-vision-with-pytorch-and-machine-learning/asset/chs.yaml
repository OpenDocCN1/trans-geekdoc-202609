  \ DCGAN 模型的每个超参数以获得良好结果。该论文中的代码是为分辨率为 64 × 64 的彩色图像编写的。如果将 MNIST 数据库中的图像从 1 × 28\
  \ × 28 调整为 1 × 64 × 64，模型的训练时间将显著变长。通过保持原始 MNIST 图像分辨率，生成器模型和判别器模型都只需要四个神经层，而不是五个神经层。由于\
  \ MNIST 和 Fashion MNIST 具有相同的结构，通过更改 Cell 01 第 04 行和 Cell 02 第 01 行的数据集名称，以下项目的代码可用于这两个数据集中的任意一个。图\
