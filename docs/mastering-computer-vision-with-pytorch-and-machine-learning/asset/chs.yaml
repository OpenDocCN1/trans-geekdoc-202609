  \ bounding boxes (red) at the end of model training with 100 × 21 epochs. Final\
  \ mAP for the train, validation and test dataloaders is 0.76, 0.62 and 0.66, respectively.\
  \ Model training time is 37 min for every 100 epochs. The Chess Pieces Dataset is\
  \ from Roboflow (2001) with a license CC BY 4.0.](img/bk978-0-7503-6244-3ch7f3_online.jpg)\n\
  \n**Figure 7.3.** A test image with its true bounding boxes (yellow) and predicted\
  \ bounding boxes (red) at the end of model training with 100 × 21 epochs. Final\
  \ mAP for the train, validation and test dataloaders is 0.76, 0.62 and 0.66, respectively.\
  \ Model training time is 37 min for every 100 epochs. The Chess Pieces Dataset is\
  \ from Roboflow (2001) with a license CC BY 4.0.\n\n\n\n\n\n#### 7.3.2 交并比 (IOU)\
  \ 与损失函数\n\n每张图像的边界框由 `7 × 7` 网格单元编码。对于包含 13 个类别的 Chess 数据集，每个网格单元有 `(13 + 5 × 2)`\
  \ 个立方体。模型预测中每个网格单元的最后五个立方体（第 18 到 22 个）用于另一个预测对象的边界框。模型预测的每个网格单元可预测两个边界框。然而，我们仅使用与同一网格单元中真实边界框具有较高\
  \ IOU 值的那个边界框来计算损失函数值。我们需要回顾一下第 2 章中关于图像分类的 IOU。\n\n假设我们有两张纸，大小相同：`10 × 10 cm²`。如果上面的纸覆盖了另一张纸\
  \ 1/4 的面积，则两张纸的相交面积为 `25 cm²`。此时我们可以计算两张纸的 IOU：`IOU = 25/(100 + 100 − 25) = 1/7`。当它们完全重叠时，IOU\
  \ 值为 1。计算机的处理方式不同。使用 Cell 04 第 17 行的代码，我们获得一批变换后的图像及其编码在网格单元中的边界框，用于训练数据加载器中的一批样本。这批边界框即为我们的目标。将这批变换后的图像输入\
  \ Cell 05 第 15 行的 `ResNet18` 模型，我们可以获得形状为 `N × 1127` 的模型输出 `y_hat`，其中 `N` 为批次大小：`8`。随后\
  \ `y_hat` 和目标被送入第 7.3.3 节 Cell 06（第 07 行）定义的损失类中。根据 Cell 06 第 10、12 和 14 行的代码，我们得到一批真实边界框、两批预测边界框。定义在\
  \ `Utility_fn(1/5)` 中的以下 IOU 函数将利用每个边界框的中心坐标 (`x_c`, `y_c`)、宽度 (`w`) 和高度 (`h`) 按照以下公式计算\
  \ IOU 值：\n\n$$\n\\begin{matrix} \n{x_{1\\min} = x_{1c} - \\frac{1}{2}w_{1}} \\\\\
  \ \n{y_{1\\min} = y_{1c} - \\frac{1}{2}h_{1}} \\\\ \n{x_{1\\max} = x_{1c} + \\frac{1}{2}w_{1}}\
  \ \\\\ \n{y_{1\\max} = y_{1c} + \\frac{1}{2}h_{1}} \n\\end{matrix}\n\\begin{matrix}\
  \ \n{x_{2\\min} = x_{2c} - \\frac{1}{2}w_{2}} \\\\ \n{y_{2\\min} = y_{2c} - \\frac{1}{2}h_{2}}\
  \ \\\\ \n{x_{2\\max} = x_{2c} + \\frac{1}{2}w_{2}} \\\\ \n{y_{2\\max} = y_{2c} +\
  \ \\frac{1}{2}h_{2}} \n\\end{matrix}\n$$\n\ngraphic style=\"width:15.9375em;\" xlink:href=\"\
  bk978-0-7503-6244-3ch7ueqn6.gif\" position=\"float\"/\n\n$$\n\\begin{matrix} \n\
  {x_{3\\min} = {\\max}\\left( {x_{1\\min},x_{2\\min}} \\right)} \\\\ \n{y_{3\\min}\
  \ = {\\max}\\left( {y_{1\\min},y_{2\\min}} \\right)} \\\\ \n{x_{3\\max} = {\\min}\\\
  left( {x_{1\\max},x_{2\\max}} \\right)} \\\\ \n{y_{3\\max} = {\\min}\\left( {y_{1\\\
  max},y_{2\\max}} \\right)} \n\\end{matrix},\n\\begin{matrix} \n{w_{3} = x_{3\\max}\
  \ - x_{3\\min}} \\\\ \n{h_{3} = y_{3\\max} - y_{3\\min}} \\\\ \n{A_{12} = w_{1}h_{1}\
  \ + w_{2}h_{2}} \\\\ \n{{IOU} = \\frac{w_{3}h_{3}}{A_{12} - w_{3}h_{3}}} \n\\end{matrix}\n\
  $$\n\ngraphic style=\"width:19.875em;\" xlink:href=\"bk978-0-7503-6244-3ch7ueqn7.gif\"\
  \ position=\"float\"/\n\nIOU 函数的输入为真实边界框和预测边界框的参数。它们具有相同的结构：`[…, x_c, y_c, w, h]`。三个点表示数据加载器中一批数据内某图像的索引、图像\
  \ `7 × 7` 网格单元的行索引和列索引。两个矩形的相交区域仍为矩形。相交区域左上角和右下角的坐标可从上述公式获得，其中变量下标 1、2、3 分别代表预测边界框、真实边界框及其相交区域。要使用这些公式，我们应使每个边界框的四个参数处于同一尺度。然而，每个边界框的中心坐标归一化因子为\
  \ `64`，宽度和高度归一化因子为 `448`。Cell 06 第 10、12 和 14 行的常量 `self.S` 用于将它们设置为同一标量。要计算同一图像不同网格单元中两个边界框的\
  \ IOU，我们还需分别将各网格单元的行索引和列索引考虑进 `y_c` 和 `x_c` 中。请注意数据结构：IOU 函数中的 `boxes_preds[…, 0:1]`。采用这种张量结构，我们保留了原始张量的形状，从而可以对\
  \ 4D 张量进行计算而无需 for 循环，以节省计算时间。若数据结构像 `boxes_preds[…, 0]` 这样，我们将丢失原始张量的最后一个维度，并在大量\
  \ for 循环中浪费时间。数据集中所有图像所有类别的平均 IOU 值即为 mAP 指标。Aladdin Persson 拥有关于 [IOU](https://www.youtube.com/watch?v=XXYG5ZWtjj0…list=RDCMUCkzW5JSFwvKRjXABI-UTAkQ…index=3)、[mAP](https://www.youtube.com/watch?v=FppOzcDvaDI…list=RDCMUCkzW5JSFwvKRjXABI-UTAkQ…index=2)、非极大值抑制\
  \ ([NMS](https://www.youtube.com/watch?v=YDkjWEN8jNA…list=RDCMUCkzW5JSFwvKRjXABI-UTAkQ…index=4))\
  \ 等内容的非常有用的 YouTube 视频。以下部分代码受其 MIT 许可的 [GitHub](https://github.com/aladdinpersson/Machine-Learning-Collection/tree/a2ee9271b5280be6994660c7982d0f44c67c3b63/ML/Pytorch/object_detection/YOLO)\
  \ 代码启发。\n\n![](img/bk978-0-7503-6244-3ch7uf10a_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch7uf10b_pr.gif)\n\
  \n在模型训练期间，以下损失函数的五个部分（Redmon *et al* 2016）由均方误差算法优化。显而易见，第一部分针对边界框中心坐标的误差，第二部分针对边界框尺寸（宽度和高度）平方根的误差。使用尺寸的平方根是为了平衡较大和较小边界框之间的误差。因为在\
  \ YOLO 编码中边界框的尺寸值小于 `1.0`，平方根运算会非线性地放大尺寸误差，且较小尺寸的误差被放大得更多。从 `(0.1)^(1/2)` 和 `(0.01)^(1/2)`\
  \ 的值中，你就能明白为什么不在损失函数的第二部分直接使用边界框的尺寸。一个较大的超参数 `λ[coord] = 5` 用于增强边界框的坐标误差和尺寸误差。\n\
  \n$$\n\\begin{matrix} \n{L = \\lambda_{coord}\\sum\\limits_{i = 0}^{48}{\\sum\\\
  limits_{j = 0}^{1}{1_{ij}^{obj}\\left\\lbrack {\\left( {x_{i} - {\\widehat{x}}_{i}}\
  \ \\right)^{2} + \\left( {y_{i} - {\\widehat{y}}_{i}} \\right)^{2}} \\right\\rbrack}}\
  \ + \\lambda_{coord}\\sum\\limits_{i = 0}^{48}{\\sum\\limits_{j = 0}^{1}{1_{ij}^{obj}\\\
  left\\lbrack {\\left( {\\sqrt{w_{i}} - \\sqrt{{\\widehat{w}}_{i}}} \\right)^{2}\
  \ + \\left( {\\sqrt{h_{i}} - \\sqrt{{\\widehat{h}}_{i}}} \\right)^{2}} \\right\\\
  rbrack}}} \\\\ \n{+ \\ \\sum\\limits_{i = 0}^{48}{\\sum\\limits_{j = 0}^{1}{1_{ij}^{obj}\\\
  left( {{\\widehat{C}}_{i} - C_{i}} \\right)^{2}}} + \\lambda_{noobj}\\sum\\limits_{i\
  \ = 0}^{48}{\\sum\\limits_{j = 0}^{1}{\\left( {1 - 1_{ij}^{obj}} \\right)\\left(\
  \ {{\\widehat{C}}_{i} - C_{i}} \\right)^{2}}} + \\sum\\limits_{i = 0}^{48}{1_{ij}^{obj}\\\
  sum\\limits_{c \\in {classes}}\\left( {p_{i}\\left( c \\right) - {\\widehat{p}}_{i}\\\
  left( c \\right)} \\right)^{2}}} \n\\end{matrix}\n$$\n\ngraphic style=\"width:33.8125em;\"\
  \ xlink:href=\"bk978-0-7503-6244-3ch7ueqn8.gif\" position=\"float\"/\n\n\n\n\n在每张图像上，有\
  \ 7 × 7 个网格单元（`i` = 0, 1, …, 48），模型为每个网格单元预测两个边界框（`j` = 0, 1）。两个大写西格玛符号是求和符号的简写，表示所有\
  \ 49 × 2 个边界框误差之和。然而，图像上只有少数网格单元包含目标。损失函数中的变量 `1[i*j]^(obj)` 仅当网格单元（`i`）包含目标且负责的边界框（`j`）与其真实边界框的\
  \ IOU 值较高时，才等于 1.0。否则，损失函数中的该变量等于 0.0。我们需要使用 Cell 06 中的代码来解释上述概念。在该单元格中定义的损失函数类的实例需要两个输入。第一个是模型处理一批图像后得到的一批预测值：`preds\
  \ ŷ`。第二个是一批编码后的边界框：`target y`。在第 07 行和第 08 行，它们都被重塑为 `N × 49 × 23`，其中 `N` 是批次大小。它们每一个都是一个高度为\
  \ `N`、宽度为 49、深度为 23 的 3D 对象。使用 Cell 06 第 15 行和第 16 行的代码，我们可以得到一张图像在一个网格单元上两个预测边界框相对于真实框的\
  \ IOU 值，然后在第 19 行搜索找到该图像上 49 个网格单元每个单元的最佳（负责）边界框标识（`j`）。第 19 行名为 `bestbox` 的张量用于完成第\
  \ 21-23 行 `1[i*j]^(obj)` 部分工作。\n\n将仅包含白色主教图像的一批图像通过 Cell 05 第 15 行的代码送入 ResNet18\
  \ 模型，我们将得到模型的预测值 `ŷ`，其形状为 `[1, 1127]`。该预测值随后被重塑为 `[1, 49, 23]`。我们知道批次中白色主教目标的调整后形状相同：`[1,\
  \ 49, 23]`。在目标的 49 个网格单元中，只有一个非空：`y[i]` = `[00000, 00100, 000, 1x[c]y[c]wh, 00000]`。Cell\
  \ 06 第 09 行到第 22 行的代码计算 IOU 值，以便为 49 个网格单元中的每一个设置一个负责的预测边界框。第 20 行名为 `exists_box`\
  \ 的张量完成 `1[i*j]^(obj)` 的另一部分工作。它是一个 `N × 49 × 1` 的张量。该张量是图像上包含目标的网格单元的映射。当该张量用于乘以另一个张量时，结果关乎包含目标的网格单元。使用\
  \ Cell 04 第 17 行生成的一批图像的目标，并在额外的单元格中运行代码：`exists_box = targets[..., 13:14][0]; exists_box.squeeze()`，你将看到一个\
  \ 7 × 7 的张量，其中只有少数元素非零。`exists_box` 张量被用作掩码，在第 23 行挑选出负责的边界框作为 `box_preds`。第 28\
  \ 行 `box_loss` 的值是损失函数前两部分之和（不含 `λ[coord]`）。在第 28 行，函数 `torch.flatten(X, end_dim\
  \ = −2)` 将张量 `X` 的形状从 `8 × 49 × 4` 改变为 `392 × 4`。第 33 行、第 39 行和第 43 行分别用于目标损失、无目标损失和类别损失。关于损失函数的详细信息，请参阅\
  \ YOLOv1 论文（Redmon *et al* 2016）。你可以使用引号标记内的以下代码来学习如何批量计算 3D 张量：`'x = torch.zeros(2,3,1);\
  \ x[0,1,0]=1; print(x); y = torch.arange(24).reshape(2,3,4); print(y); x*y'`。\n\n\
  ![](img/bk978-0-7503-6244-3ch7uf11a_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch7uf11b_pr.gif)\n\
  \n### 7.4 模型训练的工具函数\n\n使用 Cell 07 到 10 中的代码，我们可以利用国际象棋数据集训练 ResNet18 模型。由于这些模型训练代码已被多次使用，无需再次解释。我花费了很长时间利用\
  \ Utility 03 中列出的那些增强手段来解决过拟合问题。图像旋转和归一化增强对解决该问题非常有帮助。如果在 Utility 03 中仅对 Pascal\
  \ VOC 图像使用调整大小变换，很容易使训练数据集的 mAP 超过 99.8%，但验证数据集的 mAP 却永远无法超过 1%。mAP 指标是评估深度学习模型在目标检测任务上训练效果好坏的最重要指标。以下\
  \ `Utility_fn(2/5)` 到 `Utility_fn(5/5)` 应复制粘贴到 VS Code 中 Cell 06 的前面。\n\n![](img/bk978-0-7503-6244-3ch7uf12a_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch7uf12b_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch7uf12c_pr.gif)\n\
  \n模型训练后，Cell 11 中的代码将训练好的模型保存到文件，该文件将用于接下来的 100 个 epoch 的模型训练，Cell 12 中的代码用于计算 mAP。`Utility_fn(5/5)`\
  \ 中定义的一个函数使用数据集中的所有真实边界框和预测边界框来计算 mAP。这些边界框来自 `Utility_fn(4/5)` 中定义的函数：`get_bboxes`。这两个函数的每个输出都是一个列表，列表中的每个元素都是一个包含七个元素的列表：数据集中图像的索引、类别索引、目标属于该类别的概率、相对于变换后图像尺寸（448\
  \ × 448）的边界框中心坐标和尺寸。例如，验证数据集有 80 个样本，因此边界框的图像索引将是 0 到 79 之间的整数。使用 `Utility_fn(5/5)`\
  \ 中 mAP 函数第 08 行和第 11 行的代码，我们可以获得数据集中所有图像上属于某一类别的预测边界框和真实边界框。利用 `Utility_fn(5/5)`\
  \ 第 12 行到第 15 行的代码，每张图像上真实边界框的数量由一个元素为零的张量编码。如果验证数据集的第一张和最后一张图像分别有三个和两个真实边界框，第 15\
  \ 行名为 `amount_bboxes` 的字典将为 `{0: torch.tensor(0,0,0), …, 79: torch.tensor(0,0)}`。\n\
  \n使用 `Utility_fn(5/5)` 第 16 行的代码，我们根据预测概率对数据集中所有预测边界框进行降序排序：概率最大的边界框排在最前面。然后根据 mAP\
  \ 函数的 IOU 阈值，决定一个预测边界框是真阳性（TP）还是假阳性（FP）。mAP 函数的 IOU 阈值参数可以是 0.50 到 0.95。IOU 阈值越高，边界框的\
  \ TP 数量越少。第 22 行到第 39 行的 for 循环代码为我们做出该判断。选出图像索引为 `detection[0]` 的一个预测边界框后，同一图像上同一类别的所有真实边界框被用来寻找具有最高\
  \ IOU 的最佳真实边界框。如果 IOU 大于 IOU 阈值且该真实边界框从未被使用过，则该预测边界框为真阳性。该被使用的真实边界框随后在第 35 行被标记为已使用。否则，该预测边界框为假阳性。这些判断的结果分别由一维张量\
  \ `TP` 和一维张量 `FP` 记录。随后在第 40 行和第 41 行对这两个一维张量执行累积求和操作。例如，对一维张量 `[1,0,1,0,1]` 在维度零上执行累积求和操作，结果为\
  \ `[1,1,2,2,3]`。两次累积求和操作的结果是两个一维张量：`TP_cumsum` 和 `FP_cumsum`。通过它们，我们可以在第 42 行到第\
  \ 45 行利用以下公式计算目标检测的另外两个指标：召回率和精确率：\n\n```\nrecall = TP_cumsum / Total_truebboxes\n\
  precision = TP_cumsum / (TP_cumsum + FP_cumsum)\n```\n\n\n\n\n### 7.5 YOLOv3 在实时目标检测中的应用\n\
  \n在一个以*召回率*为 *x* 轴、*精确率*为 *y* 轴的二维平面上，我们在 `[0,1]` 处添加一个点，并绘制一条关于*召回率*与*精确率*关系的曲线。每个类别曲线与\
  \ *x* 轴之间的面积被记录在一个列表中，所有类别面积的平均值即为某 IOU 阈值下的平均精度均值。\n\n图 7.3 的标题告诉我们，黄色矩形是真实边界框，虚线红色矩形是预测边界框。从训练模型对每批图像（批大小\
  \ N）的预测 `y_hat = model(images)` 中，我们获得了两批预测边界框，但其中大多数是空的。`Utility_fn(3/5)` 中定义的一个函数为一批图像挑选出\
  \ `N × 49` 个负责的边界框。每个边界框是一个包含六个元素的列表。它们分别是负责目标的类别索引、其概率、目标预测边界框的中心坐标和尺寸。然后，`Utility_fn(2/5)`\
  \ 中定义的非极大值抑制（NMS）函数会从中选择出其中的一些边界框。\n\n图 7.3 的标题还表明，红色框来自模型、`responsible_boxes` 函数和\
  \ NMS 函数。`Utility_fn(4/5)` 单元格第 08 行和第 13 行的代码使用 `Utility_fn(2/5)` 中的 NMS 函数来获取用于\
  \ mAP 计算的真实边界框和预测边界框。NMS 函数的一个输入是一幅图像上的那些负责边界框。该函数的其他输入是一个 IOU 阈值（`=0.5`）和一个概率阈值（`=0.4`）。通过\
  \ NMS 函数第 02 行的代码，仅选择那些概率高于概率阈值的负责边界框，然后第 03 行的代码根据它们的概率对这些选定的框进行逆序排序。在对这些排序后的框进行的\
  \ while 循环中，第一个被弹出作为选定框。其他排序后的框用于重构一个较短的排序框列表：如果这些框中的任何一个属于不同类别；或者如果与选定框属于同一类别，它们与选定框的\
  \ IOU 值应较低。通过这种方式，丢弃了每个类别的许多相似边界框，仅保留那些最佳框。\n\n![](img/bk978-0-7503-6244-3ch7uf15_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch7uf16a_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch7uf16b_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch7uf13b_pr.gif)\n\n完成小型国际象棋数据集的目标检测项目对我们来说是一段漫长的旅程。通过这个简单的项目，我们对网格单元、交并比、非极大值抑制、平均精度均值等\
  \ YOLOv1 模型的概念有了了解。现在，我们无需从头编写大量代码即可使用更强大的 YOLOv3 模型，因为 YOLOv3 模型已被打包在 OpenCV（版本\
  \ `⩾ 3.4.2`）中，这是一个用于实时计算机视觉的编程函数库。在第一篇 YOLO 论文发表两年后，Joseph Redmon 和 Ali Farhadi\
  \ 发表了他们的 YOLOv3 论文（Redmon and Farhadi 2018）。与 YOLOv1 模型的 24 个卷积层相比，YOLOv3 模型拥有 106\
  \ 个卷积层。由于其在分别位于第 79、91 和 103 层的三个输出分支，新模型在目标检测方面更准确。每个分支包含三层。项目 7.5 的单元格 01 中的代码用于导入库和设置项目超参数。通过读取一个文本文件获得\
  \ MS COCO 数据集的类别名称，因为 YOLOv3 模型是由该数据集训练的，该数据集包含 80 个类别中超过 200,000 张图像。模型的配置文件和预训练权重文件可以从\
  \ [`github.com/pjreddie/darknet`](https://github.com/pjreddie/darknet) 免费找到并下载。这些文件为人们训练\
  \ YOLOv3 模型节省了大量时间。YOLOv3 配置文件可以在 MS 记事本中打开和编辑。它涉及 YOLOv3 模型的结构及其参数。单元格 02 的最后一行涉及\
  \ YOLOv3 模型三个输出分支的三个末端：`['yolo_82', 'yolo_94', 'yolo_106']`。YOLOv3 的每个网格单元有三个锚框（预测边界框），每个锚框有\
  \ 85 个立方体。第 0 到 3 个立方体中的参数用于网格单元中目标的中心坐标、宽度和高度。第 04 个立方体中的参数用于网格单元中目标的概率，剩余的 80\
  \ 个立方体用于对目标的 COCO 类别进行独热编码。YOLOv3 模型在一幅图像上可检测的最大目标数量为 `3 × (13 × 13 + 26 × 26 +\
  \ 52 × 52)`。YOLOv1 模型的最大目标数量为 49。尽管 YOLOv3 模型增加了如此多的计算，它仍然足够快。预训练的 YOLOv3 模型可以使用\
  \ GPU 进行模型训练（单元格 02 第 04-05 行）。如果需要，也可以设置为使用 CPU。\n\n单元格 04 中定义的一个函数用于向图像添加边界框、类别名称和概率。图\
  \ 7.4 展示了预训练 YOLOv3 模型对单张图像的目标检测结果。单元格 04 第 02 行的代码将图像修改为 YOLOv3 模型的特殊格式（blob）。这些修改包括归一化、调整大小等。然后，格式化后的图像由模型通过第\
  \ 03 行的代码进行处理，并从第 04 行的代码获得模型的输出。从输出中，我们获得了许多边界框的信息。使用单元格 03 中定义的函数，只有那些与真实框匹配良好的边界框才会被单元格\
  \ 03 第 16 行的 NMS 模块选出。这些良好的边界框随后通过单元格 03 中的代码添加到原始图像上。我们可以使用单元格 05 中的代码逐张显示所有 VOC\
  \ 图像及其边界框、类别名称和可能性。如果您未按键盘上的任何键，每张图像将显示 1000 毫秒；一旦按下 Esc 键以外的任意键，下一张图像将出现。图像窗口的标题指示：如果您按下\
  \ Esc 键，程序将终止。\n\n![](img/bk978-0-7503-6244-3ch7uf18a_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch7uf18b_pr.gif)\n\
  \n![图 7.4. 预训练 YOLOv3 模型对单张图像的目标检测结果。](img/bk978-0-7503-6244-3ch7f4_online.jpg)\n\
  \n**图 7.4.** 预训练 YOLOv3 模型对单张图像的目标检测结果。\n\n仔细观察，您会发现在幻灯片播放中有些目标未被检测到。预训练的 YOLOv3\
  \ 模型并不完美，但已足够好。使用单元格 06 中的以下代码替换单元格 05，可利用笔记本电脑摄像头或视频文件中的图像进行实时目标检测。您还可以录制经过 YOLOv3\
  \ 模型处理的视频。然而，视频录制存在一个问题。单元格 06 第 10 行上的数字 30.0 是视频帧率（FPS）的参数。从每个视频帧左上角的一个绿色数字可以发现，视频录制的实际\
  \ FPS 约为 1 或 2。因为 YOLOv3 模型处理图像较慢，输出视频文件中只记录了很少的帧。当视频文件以正常速度由播放器播放时，录制视频的播放速度看起来非常快。一种解决方案是将\
  \ FPS 参数从 30 降低到 4，这样您就可以正常观看录制的视频。最佳解决方案是使用最新的 YOLO 模型。单元格 07 中的代码是单元格 06 的简化版本，使用它不会录制视频文件。\n\
