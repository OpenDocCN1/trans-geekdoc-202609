  \ 中的代码用于显示非线性回归结果。使用阶数 *m* = 3 的一元多项式函数来数值模拟阶数为 4 的一元多项式函数，我们知道回归结果（红色曲线）不会足够好。在现实情况中，我们通常不知道如图\
  \ 1.1 绿色曲线所示的真实值。我们必须尝试多次以获得所需结果。使用阶数 *m* = 9 的一元多项式，我们得到了一条穿过每个蓝点的虚线锯齿线。从黑色虚线可以看到过拟合问题。尽管损失函数值或\
  \ beta 值接近于零，但 9 阶非线性回归结果比 3 阶的结果更差。过拟合是机器学习中的一个主要问题。我们将尝试避免它。Cell 02 中的电子邮件符号 `@`\
  \ 表示代数中两个矩阵之间的点积。\n\n### 1.1.6 期望最大化算法在寻找 PDF 中的应用\n\n在许多机器学习项目中，我们需要在高维空间中找到数据集的\
  \ PDF。**期望最大化算法**（Dempster *et al* 1977）是为这些项目执行最大似然估计的一种有用方法。在一个教师给学生一个包含 1D 数据集的\
  \ csv 文本文件作为作业以寻找 PDF 的场景中，学生首先应该做的是使用项目 1.1.2 中的代码绘制数据的直方图。从图 1.2(A) 所示的直方图来看，学生可以猜测教师用三个高斯分布生成了数据文件，并且它们对数据集\
  \ PDF 的贡献相同（权重 = 1/3）。从直方图中，学生还可以猜测这三个正态分布的均值和方差分别为：\\[−5.5, 0.0, 4.0\\]，\\[1.0,\
  \ 1.0, 1.0\\]。如果学生仅凭猜测就完成了作业，教师不会给学生及格分数。\n\n![Figure 1.2. (A) Histogram of 1D dataset\
  \ from a csv file with 300 numbers (output of Cell 02). (B) A PDF of the 1D dataset\
  \ found by expectation-maximization algorithm (output of Cell 04).](img/bk978-0-7503-6244-3ch1f2_online.jpg)\n\
  \n**图 1.2.** (A) 包含 300 个数字的 csv 文件中 1D 数据集的直方图（Cell 02 的输出）。(B) 由期望最大化算法找到的 1D\
  \ 数据集的 PDF（Cell 04 的输出）。\n\n项目中的数据集 *X* = {*x*[1], *x*[2], …, *x*[*n*]} 可能是从一个 3D\
  \ 潜在空间 *Z* = {*z*[1], *z*[2], *z*[3]} 生成的。数据集中每个点 (*x*[*j*]) 的似然由公式 (1.27) 根据那些关于三个高斯分布的猜测参数获得，并列在表\
  \ 1.5 中，其中 *P*(*Z*) 表示边际概率，*p*(*z*[*i*]) = 1/3。*P*(*Z*) 的每个元素是一个高斯分布对数据集 *X* 的 PDF\
  \ 的贡献权重。这三个高斯分布的参数及其权重将在项目的每个模型训练步骤或 epoch 中更新。\n\n\n\n\n$$p\\left( {x_{j} \\mid\
  \ z_{i}} \\right) = \\frac{1}{\\sqrt{2\\pi\\sigma_{i}^{2}}}e^{- \\frac{1}{2}{\\\
  left(\\frac{x_{j} - \\mu_{i}}{\\sigma_{i}}\\right)}^{2}},\\left( {i = 1,2,3,j =\
  \ 1,2,\\ldots,n} \\right)$$\n\n(1.27)graphic style=\"width:38.8125em;\" xlink:href=\"\
  bk978-0-7503-6244-3ch1eqn46.gif\" position=\"float\"/\n\n**表 1.5.** 似然 $P(X\\mid\
  \ Z)$ 和边缘概率 $P(Z)$。\n\n| $P(X\\mid Z)$ | | $x[1]$ | | $x[2]$ | | $\\ldots$ | | $x[n]$\
  \ | | $P(Z)$ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ |\n| $z[1]$ | | $p(x[1]\\mid z[1])$ | | $p(x[2]\\mid z[1])$ | | $\\ldots$ | |\
  \ $p(x[n]\\mid z[1])$ | | $p(z[1]) = 1/3$ |\n| $z[2]$ | | $p(x[1]\\mid z[2])$ |\
  \ | $p(x[2]\\mid z[2])$ | | $\\ldots$ | | $p(x[n]\\mid z[2])$ | | $p(z[2]) = 1/3$\
  \ |\n| $z[3]$ | | $p(x[1]\\mid z[3])$ | | $p(x[2]\\mid z[3])$ | | $\\ldots$ | |\
  \ $p(x[n]\\mid z[3])$ | | $p(z[3]) = 1/3$ |\n\n每个点 $x[j]$ 都可视为具有边缘概率 $p(x[j])$ 的随机数，该概率通过公式\
  \ (1.28) 获得。数据集的联合概率密度函数为 $P(X) = p(x[1])p(x[2])\\ldots p(x[n])$。数据集模型训练的损失函数为：\n\
  \n$$L = - \\ln \\left( {P\\left( X \\right)} \\right) = \\ln \\prod_{i = 1}^{n}{p\\\
  left( x_{j} \\right)} = - \\sum\\limits_{j = 1}^{n}{\\ln \\left( {\\sum\\limits_{i\
  \ = 1}^{m = 3}{p\\left( {x_{j} \\mid z_{i}} \\right)p\\left( z_{i} \\right)}} \\\
  right)}$$\n\n(1.28)graphic style=\"width:38.8125em;\" xlink:href=\"bk978-0-7503-6244-3ch1eqn47.gif\"\
  \ position=\"float\"/\n\n然后我们可以根据公式 (1.29) 计算后验概率 $P(Z\\mid X)$。计算结果如表 1.6 所示，其中\
  \ $p(z[i]\\mid x[j])$ 是给定 $x[j]$ 时在 $z[i]$ 处的后验概率。\n\n$$p\\left( {z_{i} \\mid x_{j}}\
  \ \\right) = \\frac{p\\left( {x_{j} \\mid z_{i}} \\right)p\\left( z_{i} \\right)}{p\\\
  left( x_{j} \\right)} = \\frac{p\\left( {x_{j} \\mid z_{i}} \\right)p\\left( z_{i}\
  \ \\right)}{\\sum\\limits_{k = 1}^{3}{p\\left( {x_{j} \\mid z_{k}} \\right)}p\\\
  left( z_{k} \\right)}$$\n\n(1.29)graphic style=\"width:38.8125em;\" xlink:href=\"\
  bk978-0-7503-6244-3ch1eqn48.gif\" position=\"float\"/\n\n**表 1.6.** 后验概率 $P(Z\\\
  mid X)$ 和边缘概率 $P(X)$。\n\n| $P(Z\\mid X)$ | | $x[1]$ | | $x[2]$ | | $\\ldots$ | |\
  \ $x[n]$ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| $z[1]$ |\
  \ | $p(z[1]\\mid x[1])$ | | $p(z[1]\\mid x[2])$ | | $\\ldots$ | | $p(z[1]\\mid x[n])$\
  \ |\n| $z[2]$ | | $p(z[2]\\mid x[1])$ | | $p(z[2]\\mid x[2])$ | | $\\ldots$ | |\
  \ $p(z[2]\\mid x[n])$ |\n| $z[3]$ | | $p(z[3]\\mid x[1])$ | | $p(z[3]\\mid x[2])$\
  \ | | $\\ldots$ | | $p(z[3]\\mid x[n])$ |\n| $P(X)$ | | $p(x[1])$ | | $p(x[2])$\
  \ | | $\\ldots$ | | $p(x[n])$ |\n\n通过将损失函数的梯度设为零，我们可以获得三个高斯分布的优化参数及其权重 $P(Z)$。很容易得到\
  \ $\\mu[i]$ 和 $\\sigma[i]$。求取 $p(z[i])$ 有一个技巧。根据表 1.5 中的条件 $p(z[1])+p(z[2])+p(z[3])\
  \ = 1$，我们知道三个边缘概率中只有两个是独立的。利用附录 B 中的推导，我们从公式 (1.30)–(1.32) 得到公式。利用它们，我们将在模型训练的第二个周期中更新表\
  \ 1.5–1.6 中那三个高斯分布的参数。此更新过程在 Cell 04 第 02 行的 for 循环迭代中重复多次（`n_epochs = 5000`）。图\
  \ 1.2(B) 中的蓝曲线是 1D 数据集的预测 PDF。拿到学生的作业后，老师告诉学生，生成 csv 文件数据使用的是三个权重相等的高斯分布。生成 csv\
  \ 文件的代码列在 Cell 06 中。这些高斯分布的原始参数为 $\\mu = [-6, 0, 5]$ 和 $\\sigma = [1.5, 1.2, 2]$。为了对比，学生在图\
  \ 1.2(B) 中绘制了真实的 PDF 曲线（绿曲线）。通过这个关于寻找数据集 PDF 的简单项目，我们现在知道了如何计算后验概率以进行数据预测。在第 5 章中，我们将使用后验概率来生成图像。如果代码不易理解，你可以跳过，因为这不是编写机器学习代码的方式。\n\
  \n$$p\\left( z_{i} \\right) = \\frac{1}{n}\\sum\\limits_{j = 1}^{n}{p\\left( {z_{i}\
  \ \\mid x_{j}} \\right)}$$\n\n(1.30)graphic style=\"width:38.8125em;\" xlink:href=\"\
  bk978-0-7503-6244-3ch1eqn49.gif\" position=\"float\"/\n\n$$\\mu_{i} = \\frac{\\\
  sum\\limits_{j = 1}^{n}{x_{j}p\\left( {z_{i} \\mid x_{j}} \\right)}}{\\sum\\limits_{j\
  \ = 1}^{n}{p\\left( {z_{i} \\mid x_{j}} \\right)}}$$\n\n(1.31)graphic style=\"width:38.8125em;\"\
  \ xlink:href=\"bk978-0-7503-6244-3ch1eqn50.gif\" position=\"float\"/\n\n$$\\sigma_{i}^{2}\
  \ = \\frac{\\sum\\limits_{j = 1}^{n}{\\left( {x_{j} - \\mu_{i}} \\right)^{2}p\\\
  left( {z_{i} \\mid x_{j}} \\right)}}{\\sum\\limits_{j = 1}^{n}{p\\left( {z_{i} \\\
  mid x_{j}} \\right)}}$$\n\n(1.32)graphic style=\"width:38.8125em;\" xlink:href=\"\
  bk978-0-7503-6244-3ch1eqn51.gif\" position=\"float\"/\n\n![](img/bk978-0-7503-6244-3ch1uf2_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch1uf3_pr.gif)\n\n### 1.2 使用梯度下降算法进行线性回归\n\n我们将通过使用梯度下降算法完成一个线性回归项目，这是编写机器学习代码的方式。在项目\
  \ 1.2.1 中，我们需要找到两个温标之间的线性关系：华氏度 (F) 和摄氏度 (C)。一个数组用于存储以摄氏度测量的温度：$C = [-20, -15, -10,\
  \ -5, 0, 5, 10, 15, 20]$，另一个数组通过函数 $F = 32 + 9C/5$ 生成华氏度温度：$F = [-4, 5, 14, 23,\
  \ 32, 41, 50, 59, 68]$。这是一项非常简单的作业。只需将 C 数组和 F 数组中的那些数字输入到 Microsoft Excel 表格的两列中，通过几次鼠标点击，屏幕上就会显示一条直线和一个线性回归函数\
  \ $F = 30.0+1.8C$。但我们必须使用 VS Code 中的 Jupyter Notebook 文件作为集成开发环境 (IDE) 来完成额外的工作。\n\
  \n\n\n\n\n# 计算机视觉项目中的工具与模型训练\n\n许多计算机视觉项目都非常复杂。它们并非“易如反掌”，而是“硬骨头难啃”。我们必须使用强大的工具来解决这些项目中的问题。\n\
  \n## Jupyter Notebook 与 VS Code\n\n**Jupyter Notebook** 是一个开源的基于 Web 的交互式计算环境，支持多种编程语言，包括\
  \ Python、R、Julia 等。Jupyter Notebook 文件以 `*.ipynb*` 为后缀保存，可在任何网页浏览器中打开，用户可在单元格中运行代码以获取结果。\n\
  \n**VS Code** 是一款免费的开源代码编辑器。它支持多种编程语言，包括 Python、C++、JavaScript 等。它提供语法高亮、调试、代码补全和\
  \ GitHub 集成等功能。\n\n在 Jupyter Notebook 中，我们可以创建一个数学模型或拥有数百万甚至数十亿参数的模型，从海量数据中提取隐藏信息，用于计算机视觉项目。数据可以是图像、视频、语音、文本、时间序列图表（如股价）。数据文件的大小可以从几百兆字节\
  \ (MB) 到数十吉字节 (GB)。我们不可能也不必将这些数据逐个输入计算机。我们只需知道如何将数据文件下载到计算机中。Python 和 PyTorch 拥有许多库或工具，可帮助将数据输入\
  \ VS Code。\n\n## 神经网络层与参数\n\n通常，机器学习模型包含许多神经网络层。这些数字神经元不同于我们大脑中的生物神经元。在计算机视觉模型中，神经元层是一组人工神经元，用于处理输入数据并产生输出数据。这些层可被视为一系列过滤器，依次提取和细化输入数据中包含的信息。数字神经元是数学算子。每个神经元层都有一些可学习参数。模型中的所有这些参数在模型训练期间会自动更新，它们被称为模型**参数**。\n\
  \n例如，完成关于数组 C 和数组 F 关系的项目后，我们将在一个线性函数中获得斜率 1.8 和截距或偏置 32.0。它们是线性模型的两个参数。\n\n要通过模型训练获得模型的参数，我们需要一个准则，通过将模型的输出与原始数据进行比较来评估模型的优劣。在机器学习中，准则也称为**损失函数**。在模型训练的每一步或每个周期中，我们使用**梯度下降算法**来降低损失函数的值。我们需要设置学习率和训练步数（周期数）来训练模型。这些由我们自己设置的参数不同于模型参数，我们称它们为模型的**超参数**。\n\
  \n训练过程可能需要几秒钟、几小时、几天甚至几周。训练时间取决于数据规模、代码和计算机硬件。计算机中需要有一个或多个图形处理单元 (GPU) 以缩短模型训练时间。GPU\
  \ 经过并行处理优化，可以同时执行许多计算任务。\n\n## 梯度下降与自动微分\n\n令函数 `y = f(x)` 的导数 `y' = 0`，很容易找到该函数的最小值或最大值。我们可以将函数（如\
  \ `y = x² + 2x + 3`）的梯度设为零（`y' = 2x + 2 = 0`），从而在 `x = -1` 处找到函数的最小值。\n\n通常，模型中有数百、数千甚至数十亿个参数分布在许多神经网络层中。其中大多数参数以数组或矩阵形式存在，而非标量。我们很难为这些数组显式写出损失函数梯度的公式。您知道从附录\
  \ B 中的损失函数（公式 (1.28)）推导出公式 (1.30)–(1.32) 有多难。\n\n## 线性回归项目实战\n\n现在，我们在 VS Code 中创建一个\
  \ `Jupyter Notebook` 文件并将其命名为 `LinearRegression.ipynb`。在 Notebook 中，我们可以添加许多单元格。在每个单元格中，我们编写代码以完成特定任务。所有单元格中的代码就像流水线上的特定机器。它们协同工作，可以处理海量数据。\n\
  \n所有项目中第一个单元格的代码用于导入 Python 和 PyTorch 库作为工具。模型训练的超参数也列在第一个单元格中。每个项目第 02 个单元格的代码用于读取和打包数据。在项目\
  \ 1.2.1 的 Cell 02 中，一个“逗号分隔值”文本文件 `d:/C2F.csv` 被加载到计算机内存中。\n\n![](img/bk978-0-7503-6244-3ch1uf4_pr.gif)\n\
  \n借助 Cell 01 第 01–02 行的代码（以井号 `#` 开头的行号为第 0 行），为线性回归项目导入了两个 Python 库。为了节省输入篇幅，我们将使用其缩写名称：`np`\
  \ 和 `plt`。\n\nCell 02 中的 NumPy 函数 `np.loadtxt()` 从硬盘加载一个 csv 文件，并将数据作为一个名为 `CF`\
  \ 的 9 × 2 数组存储在计算机内存中。如果您用 MS Excel 打开该 csv 文件，将看到两列，每列都有名称。模型训练不需要列名，因此我们在 Cell\
  \ 02 第 01 行的函数中设置选项 `skiprows = 1`。如果您在文本编辑器中打开该文件，将看到所有数据均由逗号分隔，因此我们设置该函数的另一个选项\
  \ `delimiter = ','` 以读取数据。\n\nCell 02 的第二行和第三行代码用于将 9 × 2 的 NumPy 数组分离为一维数组 `C`\
  \ 和一维数组 `F`。最后，通过第四行和第五行的代码在屏幕上打印数组 `C` 和数组 `F`。检查屏幕上两个数组的数字，您需要确保数据加载没有错误。\n\n\
  在 Cell 2 的第六行，使用 NumPy 函数 `np.len(C)` 获取 `C` 数组的长度。根据该数字，通过另一个 NumPy 函数 `np.ones(len(C))`\
  \ 创建一个一维 `ONES` 数组。`ONES` 数组的每个元素均等于 1.0。数组 `C` 和 `ONES` 数组垂直堆叠成一个 2 × 9 数组，然后转置为一个\
  \ 9 × 2 数组 `X`，如公式 (1.33) 所示。Python 函数 `reshape(-1,1)` 将数组 `F` 的形状从一维更改为 9 × 1。借助\
  \ reshape 函数中的 `-1`，计算机会自动计算行数或列数。\n\n$$\nX = \\begin{bmatrix} x_{0,0} & 1 \\\\\
  \ x_{1,0} & 1 \\\\ \\ldots & \\ldots \\\\ x_{8,0} & 1 \\\\ \\end{bmatrix} = \\begin{bmatrix}\
  \ {- 20} & 1 \\\\ {- 15} & 1 \\\\ \\ldots & \\ldots \\\\ 20 & 1 \\\\ \\end{bmatrix},\\\
  quad\nY = \\begin{bmatrix} y_{0} \\\\ y_{1} \\\\ \\ldots \\\\ y_{8} \\\\ \\end{bmatrix}\
  \ = \\begin{bmatrix} {- 4} \\\\ 5 \\\\ \\ldots \\\\ 68 \\\\ \\end{bmatrix},\\quad\n\
  \\widehat{y} = \\begin{bmatrix} x_{0,0} & 1 \\\\ x_{1,0} & 1 \\\\ \\ldots & \\ldots\
  \ \\\\ x_{8,0} & 1 \\\\ \\end{bmatrix} \\cdot \\begin{bmatrix} w_{0} \\\\ w_{1}\
  \ \\\\ \\end{bmatrix}\\mspace{9mu}\n$$\n\n(1.33)\n\n\n\n\n为了获得两个一维数组之间的线性关系（*F*\
  \ = *kC* + *b*），我们需要两个参数：斜率 *k* 和截距 *b*。为了数学上的方便，我们将它们打包进一个权重数组 *W* = [*w*[0], *w*[1]]^(*T*)\
  \ = [*k*, *b*]^(*T*)。数组上的上标 *T* 表示对数组进行转置操作，因此权重数组有两行一列。项目的模型定义在 Cell 03 的第二行：`y_hat\
  \ = X@W`，其中 *X* 是一个 9 × 2 数组（公式 (1.33））。数组 *X* 的第一列是列向量形式的数组 *C*，其第二列的每个元素都等于 1.0。*X*\
  \ 和 *W* 的 `@` 运算结果给出了一个形状为 9 × 1 的数组 `y_hat`，`y_hat` 的每个元素都是模型的一个预测值。Cell 04 第 03\
  \ 行的代码将数组 *W* 的每个参数初始化为零。通过这些设置，我们在 epoch = 0 时获得了初始预测数组 `y_hat`，其所有九个元素均为零。我们需要模型的预测\
  \ `y_hat` 尽可能接近目标 *Y*，在模型训练期间通过使用 MSE 准则或损失函数来实现。\n\n$$L\\left( {X,w} \\right) =\
  \ \\frac{1}{\\left( {n + 1} \\right)}\\sum\\limits_{i = 0}^{n}\\left( {\\widehat{y}_{i}\
  \ - y_{i}} \\right)^{2}$$\n\n(1.34)\n\n$$\\nabla L = \\begin{bmatrix} \\frac{\\\
  partial L}{\\partial w_{0}} \\\\ \\frac{\\partial L}{\\partial w_{1}} \\\\ \\end{bmatrix}\
  \ = \\frac{2}{n + 1}\\begin{bmatrix} x_{0,0} & x_{1,0} & \\ldots & x_{n,0} \\\\\
  \ 1 & 1 & \\ldots & 1 \\\\ \\end{bmatrix} \\cdot \\begin{bmatrix} {\\widehat{y}_{0}\
  \ - y_{0}} \\\\ {\\widehat{y}_{1} - y_{1}} \\\\ \\ldots \\\\ {\\widehat{y}_{n -\
  \ 1} - y_{n - 1}} \\\\ \\end{bmatrix}$$\n\n(1.35)\n\n损失函数的公式和损失函数对权重的梯度公式分别显示在公式\
  \ (1.34) 和 (1.35) 中，其中 *n* = 9（附录 C）。MSE 损失函数设定了一个具有最低点（即最小值零）的 3D 数字山谷。然后，权重矩阵沿着损失函数梯度的相反方向更新：`w[i\
  \ + 1] = w[i] - lr * ∇L`，其中 ‘`lr`’ 是一个用于学习率的小数字。通过这种方式，模型可以在每个 epoch 中以 ‘`lr`’ 的步长进行训练以逼近最低点。这是一种用于训练模型的优化算法，称为“梯度下降算法”。\n\
  \n在 Cell 03 中，根据公式 (1.33)–(1.35) 定义了三个函数。它们分别是模型、MSE 准则和梯度函数。准则函数中的平方数组运算不是线性代数中的常规数学运算。在\
  \ NumPy 和 PyTorch 中有许多此类非代数运算，用于逐元素操作而无需 for 循环，以加速计算。Cell 01 中的学习率超参数应在模型训练前设置。如果学习率太小，模型训练可能需要更长时间才能达到最小值。或者如果学习率太大，模型的损失值可能会在损失函数的最小值附近振荡，训练过程将永远无法完成。使用优化的学习率，训练损失会在模型训练开始时显著下降，然后缓慢下降。稍后我们将通过使用\
  \ PyTorch 提供的学习率调度器来使用可变学习率。\n\n![](img/bk978-0-7503-6244-3ch1uf5_pr.gif)\n\n线性回归项目的\
  \ `fit` 函数在 Cell 04 中定义。该函数需要四个输入。前两个是具有特定数组形状的输入数据，如公式 (1.33) 所示。剩下的两个是训练轮数和学习率。它们是模型的超参数。一个小型的\
  \ Python 模块 `tqdm` 用于在模型训练期间显示进度条。对于大型计算机视觉项目，模型运行时间可能长达数小时甚至数周。此工具将告诉我们需要等待多久。在带有进度条的\
  \ `fit` 函数的 for 循环中，计算模型的预测 `y_hat` 和损失函数值。在进度条上，我们可以看到 epoch、损失、斜率 `w[0,0]` 和截距\
  \ `w[1,0]`。然后使用梯度下降算法更新权重数组。模型训练后，`fit` 函数返回权重数组。此 `fit` 函数在 Cell 04 的最后一行使用，其输出是权重数组。这是一个具有\
  \ 20,000 个训练 epoch 的简单机器学习项目。我的电脑在 24 秒内完成项目计算。稍后你将看到，大型项目 20 个 epoch 可能需要 60 分钟以上。即使对于\
  \ 20,000 个 epoch 的模型训练，线性回归的斜率仍比 1.80 约少 10^(−8)。如果学习率大于 7 × 10^(−3)，线性回归将无法找到正确的斜率和截距。复制并粘贴\
  \ Cell 01 到 04 到你的 VS Code 笔记本并运行它们后，你将完成线性回归项目，并找到模型的两个参数。\n\n使用 Cell 05 中的代码替换\
  \ Cell 04 中的代码，我们可以看到由 Cell 06 中的代码创建的 3D 数字空间中的损失函数轨迹。从图 1.3 所示的 3D 数字山谷中的损失函数轨迹，我们可以看到程序如何自动找到山谷的最小点。由于这是一个只有两个参数的简单项目模型，因此可以在\
