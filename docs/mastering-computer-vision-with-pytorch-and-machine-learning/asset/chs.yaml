  \n---\n\n## 第 1 章：计算机视觉的数学工具\n\n本章涵盖计算机视觉项目的数学工具以及 `Python`/`PyTorch` 平台。\n\n**第\
  \ 1.1 节** 介绍了关于信息熵、统计概率分布函数、Kullback-Leibler 散度、Jensen 不等式以及非线性回归中的过拟合问题的数学概念。\n\
  \n其余四节涵盖了用于机器学习模型训练的梯度下降算法、用于数据集、数据加载器、激活函数、GPU 使用以及模型训练/保存的 `Python`/`PyTorch`\
  \ 库（工具）。本章反复使用一个简单的数据文件来引入这些概念和库。\n\n\n\n\n# 人类拥有想象、创造和建造前所未有的新事物的能力\n\n创新和发明的能力是人类智慧的关键特征之一，并推动了科学、技术、工程和艺术等各个领域的重大进步。我们在城市中建造摩天大楼供人居住，制造手机放在口袋里用于通讯，发射火箭将卫星送至太阳系边缘以探索宇宙。所有这些工程成就都基于物理学和数学定律，例如牛顿万有引力定律、麦克斯韦电磁定律、爱因斯坦相对论、量子力学等。这些定律是我们文明的基石。它们是我们理解和改造世界的钥匙。然而，仅了解这些物理和数学定律是不够的，专家或专业人士还必须依据他们的经验开展工作。这些经验源于毕生的实践。曾经，当一位专家离世，该专家的所有经验也随之流失。如今，专业人士可以利用机器学习算法训练计算机，从而使人类经验得以传承并永久存储在计算机中。计算机视觉研究的目标是赋予计算机类人的感知能力。机器学习是人工智能（AI）的一个分支，涉及算法和统计模型的开发。机器学习使计算机能够从数据中“学习”，而无需显式编程。在机器学习中，基于算法的模型在数据集上进行训练，以发现数据集中的模式来预测新数据。机器学习有几种类型，包括监督学习、无监督学习、半监督学习和强化学习，每种类型都有其独特的算法和方法。\n\
  \n### 1.1 概率、熵和 Kullback–Leibler 散度\n\n图像由像素组成，像素是屏幕上的微小点。当大量像素按特定配置（模式）排列时，它们就形成了一幅图像。图像的分辨率由其包含的像素数量决定。更高的图像分辨率能为我们提供更清晰、更细致的视觉效果。从图像像素在空间中分布的模式或概率出发，我们可以生成新图像。要开始计算机视觉的学习，必须掌握统计学概念，尤其是概率。利用贝叶斯概率定理和香农信息熵理论，我们可以推导出用于模型训练的损失函数。这些模型将变得非常智能，不仅能告诉我们图像中是否有狗或猫，还能根据我们的文本提示生成逼真的图像/视频。\n\
  \n#### 1.1.1 概率和香农熵\n\n对于一枚均匀硬币，抛掷时其“正面”和“反面”出现的概率相同（50%）。在硬币系统中，我们有一个在 {'正面', '反面'}\
  \ 空间内的离散随机变量 `X`，其概率质量函数（PMD）为 `P(X) = {1/2, 1/2}`。若硬币不均匀，其正面概率为 `p = 0.45`，我们抛掷\
  \ 10 次（`n = 10`），出现 4 次正面（`x = 4`）的概率是多少？这个不均匀硬币系统有一个在 {0, 1, …, 10} 空间内的离散随机变量\
  \ `X`，服从二项分布函数。将这些参数代入公式 (1.1)，即可得到答案：23.8%。\n\n```\nP(X = x) = n! / (x!(n - x)!)\
  \ * p^x * (1 - p)^(n - x)\n```\n\n(1.1)\n\n我们身体的身高变量（`X`）是一个服从高斯分布函数的连续随机数，这是机器学习中最重要的概率密度函数（PDF）。尽管许多图像数据集的概率密度函数过于复杂，无法显式写出，但我们仍可尝试用高斯分布函数来近似它们。\n\
  \n```\nP(X = x) = N(x; μ, σ²) = 1 / √(2πσ²) * e^(-1/2 * ((x - μ)/σ)²)\n```\n\n(1.2)\n\
  \n在公式 (1.2) 中，`μ` 是 `X` 的**均值**或期望值，`σ` 是 `X` 的标准差，`σ²` 是 `X` 的**方差**。对于任何具有已知 PDF\
  \ 的随机变量 `X`，其期望值 `E[p][X]` 和方差 `E[p][(X-μ)²]` 为：\n\n```\nμ = Σ(i=1 to n) x_i * p(x_i)\
  \  或  ∫(-∞ to ∞) x * p(x) dx\n```\n\n(1.3)\n\n```\nσ² = Σ(i=1 to n) (x_i - μ)² *\
  \ p(x_i)  或  ∫(-∞ to ∞) (x - μ)² * p(x) dx\n```\n\n(1.4)\n\n信息的香农**熵**是包含在随机变量中的“信息量”，或编码一个系统信息所需的最小比特数。\n\
  \n```\nH(p) = - Σ(i=1 to n) p_i * log₂(p_i)  或  - ∫(-∞ to ∞) p(x) * log₂(p(x)) dx\n\
  ```\n\n(1.5)\n\n均匀硬币系统的熵为 `H(p) = - 2 * 1/2 * log₂(1/2) = 1` 比特，均匀骰子系统的熵为 `H(p)\
  \ = - 6 * 1/6 * log₂(1/6) = 2.585` 比特。为了机器学习中的数学便利性，我们通常使用自然对数，熵的单位为“奈特”。硬币的熵和骰子的熵分别为\
  \ 0.69 奈特和 1.79 奈特。\n\n#### 1.1.2 Kullback–Leibler 散度和交叉熵\n\n在同一随机变量 `X` 存在两个分布函数\
  \ `p` 和 `q` 的情况下，它们的对数似然比是一个函数 `f(x) = ln[p(x) / q(x)]`。对数似然比的期望值称为** Kullback–Leibler\
  \ 散度**（`D_KL`）：\n\n```\nD_KL(p||q) = E_p[ln(p(X) / q(X))] = Σ(i=1 to n) p(x_i) *\
  \ ln(p(x_i) / q(x_i))\n```\n\n(1.6)\n\n`D_KL` 用于度量具有相同随机变量 `X` 的系统中两个 PDF 之间的差异。如果\
  \ `p` 和 `q` 相同，则 `D_KL = 0`。交叉熵是量化两个 PDF 之间差异的另一个指标，常用作机器学习中的损失函数。\n\n```\nH(p,q)\
  \ = - Σ(i=1 to n) p(x_i) * ln(q(x_i)) = D_KL(p||q) + H(p)\n```\n\n\n\n\n#### 1.1.3\
  \ 条件概率与联合熵\n\n有时系统中存在两个或多个随机变量。每个变量都有其自身的概率密度函数（PDF）。这些变量结合在一起形成一个联合 PDF。例如，在一个赌博机中有一枚均匀硬币和一个均匀骰子，它们是相互独立的。骰子点数变量为\
  \ `X`，具有均匀概率质量函数 `P(X) = {1/6, 1/6, 1/6, 1/6, 1/6, 1/6}`；硬币面朝向变量为 `Y`，具有另一个均匀概率质量函数\
  \ `P(Y) = {1/2, 1/2}`。硬币和骰子的联合 PDF 也是一个具有十二种状态的均匀概率分布 `P(X,Y)`，任意状态的概率均等于 1/12，如表\
  \ 1.1 所示。\n\n**表 1.1.** 包含一枚均匀硬币和一个均匀骰子的系统的联合概率 `P(X,Y)`。\n\n| `P(X,Y)` | | 骰子点数\
  \ (`X`) | | |\n| --- | --- | --- | --- | --- |\n| 硬币面(`Y`) | | 一(`x[1]`) | 二(`x[2]`)\
  \ | 三(`x[3]`) | 四(`x[4]`) | 五(`x[5]`) | 六(`x[6]`) | `P(Y)` |\n| 正面(`y[1]`) | | 1/12\
  \ | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 | 1/2 |\n| --- | --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 反面(`y[2]`) | | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 | 1/2\
  \ |\n| `P(X)` | | 1/6 | 1/6 | 1/6 | 1/6 | 1/6 | 1/6 | 1 |\n\n标题为“正面(`y[1]`)”的第一行中六个联合概率\
  \ `p(x[i], y[1])` 之和等于 `p(y[1]) = 1/2`，标题为“反面(`y[2]`)”的第二行中另外六个联合概率 `p(x[i], y[2])`\
  \ 之和为 `p(y[2]) = 1/2`，其中 `i = 1,2,…,6`。硬币的 PMF `P(Y)` 由一维数组中的两个数字构成：`P(Y) = {p(y[1]),\
  \ p(y[1])}`。标题为“一(`x[1]`)”的那一列之和为 `p(x[1]) = 1/6`。其余五列中每一列的和也均等于 `p(x[i]) = 1/6`，其中\
  \ `i = 2, 3, …, 6`。骰子的 PMF `P(X)` 由一维数组中的六个数字构成：`P(X) = {p(x[1]), p(x[2]), …, p(x[6])}`。所有\
  \ 12 个联合概率 `p(x[i], y[j])` 之和、骰子的六个概率 `p(x[i])` 之和以及硬币的两个概率 `p(y[j])` 之和均等于 1（`i\
  \ = 1,2,…,6, j = 1,2`）。`P(X)` 和 `P(Y)` 为边缘概率。\n\n\n\n\n\n# 条件概率与贝叶斯定理\n\n条件概率是指在事件\
  \ *X* 已经发生或已知的情况下，事件 *Y* 的概率。记作 *P*(*Y*∣*X*)，表示给定 *X* 条件下 *Y* 的概率。\n\n例如，掷骰子得到点数\
  \ 5，随后抛硬币。硬币的条件概率仍为二分之一：\n*p*(*y*[1]∣*x*[*i*] = 5) = ½，*p*(*y*[2]∣*x*[*i*] = 5)\
  \ = ½（见表 1.2）。\n\n条件概率表 *P*(*Y*∣*X*) 可通过联合概率表 *P*(*X*,*Y*) 底部的 *P*(*X*) 元素，对表 1.1\
  \ 的六列分别归一化得到。*P*(*Y*∣*X*) 表 1.2 中的 12 个元素均为 ½。\n\n同理，条件概率表 *P*(*X*∣*Y*) 可通过联合概率表\
  \ *P*(*X*,*Y*) 右侧的 *P*(*Y*) 元素，对两行分别归一化得到。*P*(*X*∣*Y*) 表 1.3 中的 12 个元素均为 1/6（见表\
  \ 1.3）。\n\n根据 **贝叶斯定理**，*p*(*x,y*)、*p*(*x*∣*y*)、*p*(*y*∣*x*)、*p*(*x*) 和 *p*(*y*)\
  \ 之间的逐元素关系由公式 (1.11) 确定：\n\n```\np(y | x) = p(x, y) / p(x) = p(x | y) / p(x) * p(y)\n\
  ```\n\n(1.11)\n\n## 表 1.2 条件概率 *P*(*Y*∣*X*)\n\n| *P*(*Y*∣*X*) | 骰子点数 (*X*) |\n|\
  \ :--- | :---: |\n|  | One (*x*[1]) | Two (*x*[2]) | Three (*x*[3]) | Four (*x*[4])\
  \ | Five (*x*[5]) | Six (*x*[6]) |\n| Head (*y*[1]) | 1/2 | 1/2 | 1/2 | 1/2 | 1/2\
  \ | 1/2 |\n| Tail (*y*[2]) | 1/2 | 1/2 | 1/2 | 1/2 | 1/2 | 1/2 |\n\n## 表 1.3 条件概率\
  \ *P*(*X*∣*Y*)\n\n| *P*(*X*∣*Y*) | 骰子点数 (*X*) |\n| :--- | :---: |\n|  | One (*x*[1])\
  \ | Two (*x*[2]) | Three (*x*[3]) | Four (*x*[4]) | Five (*x*[5]) | Six (*x*[6])\
  \ |\n| Head (*y*[1]) | 1/6 | 1/6 | 1/6 | 1/6 | 1/6 | 1/6 |\n| Tail (*y*[2]) | 1/6\
  \ | 1/6 | 1/6 | 1/6 | 1/6 | 1/6 |\n\n在上述公式中，*p*(*x*) 和 *p*(*y*) 为边缘概率或先验概率，*p*(*x*∣*y*)\
  \ 是给定 *y* 条件下 *x* 的似然度，*p*(*y*∣*x*) 是给定 *x* 条件下 *y* 的后验概率。\n\n以下例说明这些概率名称。某小岛上，55%\
  \ (= *p*(*x*[1])) 为女性，45% (= *p*(*x*[2])) 为男性。女性中 10% (= *p*(*y*[1]∣*x*[1])) 吸烟，男性中\
  \ 30% (= *p*(*y*[1]∣*x*[2])) 吸烟。吸烟者和不吸烟者变量分别为 *y*[1] 和 *y*[2]。已知某人正在吸烟（通过声音和气味），求该吸烟者为女性的概率？\n\
  \n为解答此问题，需根据上述数据构建后验概率 *P*(*X*∣*Y*) 子表（见表 1.4 右侧三列）。我们从似然度子表 *P*(**Y*∣*X*) 开始（表左侧三列）。‘吸烟者(*y*[1])’\
  \ 行单元格数值和边缘 *P*(*X*) 行数值已知。‘不吸烟者(*y*[2])’ 行数值可逻辑推得：女性中 90% 不吸烟，男性中 70% 不吸烟。\n\n\
  ## 表 1.4 岛上男女吸烟概率\n\n| *P*(*Y*∣*X*) | Women (*x*[1]) | Men (*x*[2]) | *P*(*X,Y*)\
  \ | *x*[1] | *x*[2] | *P*(*Y*) | *P*(*X*∣*Y*) | *x*[1] | *x*[2] |\n| :--- | :---:\
  \ | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| Smokers (*y*[1])\
  \ | *p*(*y*[1]∣*x*[1]) = 0.10 | *p*(*y*[1]∣*x*[2]) = 0.30 | *y*[1] | 0.055 | 0.135\
  \ | 0.19 | *y*[1] | 0.289 | 0.711 |\n| Non-smokers (*y*[2]) | *p*(*y*[2]∣*x*[1])\
  \ = 0.90 | *p*(*y*[2]∣*x*[2]) = 0.70 | *y*[2] | 0.495 | 0.315 | 0.81 | *y*[2] |\
  \ 0.611 | 0.389 |\n| *P*(*X*) | 0.55 | 0.45 | *P*(*X*) | 0.55 | 0.45 | 1.00 |  |\
  \  |  |\n\n由似然度 *P*(*Y*∣*X*) 子表，可构建联合概率子表 *P*(*X*,*Y*)（表中间三列）。*P*(*X,Y*) 表中四个单元格的值依公式\
  \ (1.11) 计算：*p*(*x,y*) = *p*(*y*∣*x*) *p*(*x*)。\n\n现知岛上所有人中：5.5% 为吸烟女性；13.5% 为吸烟男性；49.5%\
  \ 为不吸烟女性；31.5% 为不吸烟男性。吸烟者和不吸烟者的边缘概率 *p*(*y*[1]) 和 *p*(*y*[2]) 分别为 19% 和 81%。\n\n\
  利用联合概率子表，可计算后验概率 *P*(*X*∣*Y*) 右侧四个单元格的值。计算同样基于公式 (1.11)：*p*(*x*∣*y*) = *p*(*x*,*y*)/*p*(*y*)。例如，吸烟者为女性的概率\
  \ *p*(*x*[1]∣*y*[1]) = *p*(*x*[1], *y*[1]) /*p*(*y*[1]) = 28.9%。\n\n即使只有男、女、吸烟、不吸烟四个变量，上述后验概率计算解释仍显复杂。鉴于有限的生命和资源，我们只能探索可及的世界部分。借助可获取数据和贝叶斯定理，我们能推导整个系统的信息。\n\
  \n在上例中，联合概率表 *P*(*X,Y*) 反映全岛人口的相对概率。先验概率表 *P*(*Y*∣*X*) 来自调查，反映各子人群（男、女）的相对概率。后验概率表\
  \ *P*(*X*∣*Y*) 由先验概率表和联合概率表推导，反映各子群体（吸烟者、不吸烟者）的相对概率。\n\n实际上，无需构建表 1.4 中的三个子表。直接应用贝叶斯定理：\n\
  *p*(*x*[1]∣*y*[1]) = *p*(*y*[1]∣*x*[1])*p*(*x*[1])/*p*(*y*[1]) = *p*(*y*[1]∣*x*[1])*p*(*x*[1])\
  \ / [*p*(*y*[1]∣*x*[1])*p*(*x*[1]) + *p*(*y*[1]∣*x*[2])*p*(*x*[2])] = 28.9%。\n\n\
  可见，先验概率或似然度为已知数据，后验概率是从这些已知数据推断得出。\n\n根据表 1.4 中的概率，可利用以下公式计算联合熵 *H*(*X,Y*)、先验条件熵\
  \ *H*(*X*∣*Y*)、后验条件熵 *H*(*Y*∣*X*) 和互信息 *I*(*X,Y*)：\n\n```\nH(X, Y) = - Σ_{i=1}^{2}\
  \ Σ_{j=1}^{2} p(x_i, y_j) ln(p(x_i, y_j)) = 1\n```\n\n(1.12)\n\n```\nH(X | Y) =\
  \ - Σ_{i=1}^{2} Σ_{j=1}^{2} p(x_i, y_j) ln(p(x_i | y_j)) = 0\n```\n\n(1.13)\n\n\n\
  \n\n\n#### 1.1.3 信息论公式\n\n$$H\\left( {Y \\mid X} \\right) = - \\sum\\limits_{i =\
  \ 1}^{2}{\\sum\\limits_{j = 1}^{2}{p\\left( {x_{i},y_{j}} \\right)}}\\ \\ln\\ \\\
  left( { p\\left( {y_{i} \\mid x_{j}} \\right)} \\right) = 0.454$$\n\n(1.14)\n\n\
  $$I\\left( {X,Y} \\right) = I\\left( {Y,X} \\right) = \\sum\\limits_{i = 1}^{2}{\\\
  sum\\limits_{j = 1}^{2}{p\\left( {x_{i},y_{j}} \\right)}}\\ \\ln\\ \\left( \\frac{\
  \ p\\left( {y_{i},x_{j}} \\right)}{p\\left( y_{i} \\right)p\\left( x_{j} \\right)}\
  \ \\right) = 0.032$$\n\n(1.15)\n\n$$H\\left( X \\right) = - \\sum\\limits_{j = 1}^{2}{p\\\
  left( x_{j} \\right)\\ \\ln\\ \\left( { p\\left( x_{j} \\right)} \\right) = 0.688}$$\n\
  \n(1.16)\n\n$$H\\left( Y \\right) = - \\sum\\limits_{j = 1}^{2}{p\\left( y_{j} \\\
  right)\\ \\ln\\ \\left( { p\\left( y_{j} \\right)} \\right) = 0.486}$$\n\n(1.17)\n\
  \n$$I(X,Y) = H(X) - H(X\\mid Y) = H(Y) - H(Y\\mid X) = 0.032$$\n\n(1.18)\n\n$$H(X,Y)\
  \ = H(X) + H(Y\\mid X) = H(Y) + H(X\\mid Y) = 1.142$$\n\n(1.19)\n\n如果随机变量 $X$ 和\
  \ $Y$ 不独立，互信息 $I(X,Y)$ 为正数。使用表 1.1–1.3，你会发现使用均匀硬币和均匀骰子的赌博机的互信息 $I(X,Y)$ 等于零。在第 6\
  \ 章中，互信息 $I(X,Y)$ 将使我们能够控制生成什么图像。\n\n#### 1.1.4 詹森不等式\n\n如果函数 $g(x)$ 在范围 $x \\in\
  \ X$ 内是**凸函数**，且 $E[g(X)]$ 和 $g[E(X)]$ 有限，则该范围内函数值的平均值大于或等于 $X$ 的平均值处的函数值：$E[g(X)]\
  \ \\geqslant g[E(X)]$。$x$ 的 PDF 可以是正态分布或其他类型的分布。\n\n**示例 01**：存在凸函数 $g(x) = x²$，其中\
  \ $x \\in [-1,1]$ 且 PDF $p(x) = 1/2$\n\n$$\\mu = E_{p}\\left\\lbrack X \\right\\\
  rbrack = \\overline{X} = \\int_{- 1}^{1}{x p\\left( x \\right) dx = 0}, g\\left(\
  \ {E_{p}\\left\\lbrack X \\right\\rbrack} \\right) = \\left( \\mu \\right)^{2} =\
  \ 0$$\n\n$$E_{p}\\left\\lbrack {g\\left( X \\right)} \\right\\rbrack = \\overline{X^{2}}\
  \ = \\int_{- 1}^{1}x^{2}p\\left( x \\right) dx = \\frac{1}{3}, E_{p}\\left\\lbrack\
  \ {g\\left( X \\right)} \\right\\rbrack \\geqslant g\\left( {E_{p}\\left\\lbrack\
  \ X \\right\\rbrack} \\right)$$\n\n**示例 02**：存在另一个凸函数 $g(x) = -\\ln(x)$，其中 $x \\\
  in [0.5, 4.5]$ 且 PDF $p(x) = 1/4$\n\n$$\\mu = E_{p}\\left\\lbrack X \\right\\rbrack\
  \ = \\int_{0.5}^{4.5}{x p\\left( x \\right) dx} = \\frac{5}{2}, g(E_{p}\\left\\\
  lbrack X \\right\\rbrack) = - \\ln\\left( \\mu \\right) = - \\ln\\left( \\frac{5}{2}\
  \ \\right) = - 0.92$$\n\n$$E_{p}\\left[g(X)\\right] = -\\int_{0.5}^{4.5} \\ln(x)\
  \ p(x) dx = -0.78, E_{p}\\left[g(X)\\right] \\geq g(E_{p}\\left[X\\right])$$\n\n\
  #### 1.1.5 最大似然估计与过拟合\n\n在机器学习中，我们需要了解数据集的概率密度函数以进行图像生成。从数据集的 PDF，我们可以生成新数据（图像）。在大多数情况下，我们只有数据（图像），如何找到隐藏在数据集中的\
  \ PDF？最大似然估计（MLE）是一种方法，如果我们有一组数据 $\\{x[i]\\}$，其中 $i = 1, 2, \\dots, n$，它允许我们在数据集中找到一个\
  \ PDF。例如，数据集是关于学生身高的，且数据集中的数据遵循高斯分布 $N(x;\\mu,\\sigma)$。使用 MLE，我们将找到 PDF 的参数：$\\\
  mu$ 和 $\\sigma$。似然是已发生事件的概率，该事件具有未知的 PDF。学生的身高 $x[i]$ 是来自似然函数 $N(x;\\mu,\\sigma)$\
  \ 的一个样本，其中每个学生的身高是独立的。似然函数是数据集的联合概率：\n\n$${likelihood}\\left( {\\mu,\\sigma^{2}\
  \ \\mid x_{1},x_{2},\\ldots x_{n}} \\right) = \\prod\\limits_{i = 1}^{n}N(x_{i};\\\
  mu,\\sigma^{2})$$\n\n(1.20)\n\n上述似然函数应通过优化其两个参数 $\\mu$ 和 $\\sigma²$ 来最大化。为了在 Python\
  \ 和 PyTorch 编码环境中获得数学上的便利，我们需要最小化负对数似然，并将其用作**损失函数** $L = - \\ln\\left( {\\prod\\\
  limits_{i = 1}^{n}{N(x_{i};\\mu,\\sigma^{2})}} \\right)$，如公式 (1.21) 所示。然后从 $\\partial\
  \ L/\\partial \\mu = 0$ 和 $\\partial L/\\partial \\sigma = 0$，很容易得到 PDF 的均值 $\\\
  mu = \\overline{X}$，和方差 $\\sigma² = \\overline{X^{2}} - {\\overline{X}}^{2}$。\n\n\
  $$L = \\frac{n}{2}\\ \\ln\\left( {2\\pi} \\right) + \\frac{n}{2}\\ \\ln\\left( \\\
  sigma^{2} \\right) + \\frac{1}{2\\sigma^{2}}\\sum\\limits_{i = 1}^{n}\\left( {x_{i}\
  \ - \\mu} \\right)^{2}$$\n\n(1.21)\n\n均方误差（MSE）损失函数可以从最大似然估计推导得出。对于一组数据对 $\\{x[i],\
  \ y[i]\\}$，我们假设给定 $x[i]$ 的每个目标 $y[i]$ 是来自独立高斯分布 $pi = \\mathcal{N}(y[i];\\mu[i],\
  \ \\sigma²)$ 的随机数。所有这些高斯分布具有相同的方差 $(\\sigma² = 1/\\beta)$，其中 $\\beta$ 称为“精度”，每个高斯分布的均值是目标\
  \ $y[i]$ 的预测值 $(\\mu[i])$，其中 $i = 1, 2, \\dots, n$。我们假设 $\\mu$ 是权重的线性函数：$\\mu_{i}\
  \ = f\\left( {x_{i},W} \\right) = w_{0} + \\sum\\limits_{j = 1}^{m}{w_{j}x_{i}^{j}}$\
  \ 或 $\\mu = X \\cdot W$。\n\n$$\\begin{bmatrix} \\mu_{1} \\\\ \\mu_{2} \\\\ \\ldots\
  \ \\\\ \\mu_{n} \\\\ \\end{bmatrix} = \\begin{bmatrix} 1 & x_{1} & \\ldots & x_{1}^{m}\
  \ \\\\ 1 & x_{2} & \\ldots & x_{2}^{m} \\\\ \\ldots & \\ldots & \\ldots & \\ldots\
  \ \\\\ 1 & x_{n} & \\ldots & x_{n}^{m} \\\\ \\end{bmatrix} \\cdot \\begin{bmatrix}\
  \ w_{0} \\\\ w_{1} \\\\ \\ldots \\\\ w_{m} \\\\ \\end{bmatrix}$$\n\n(1.22)\n\n\n\
  \n\n从这些随机变量的联合似然 ${likelihood}\\left( {Y \\mid X} \\right) = \\prod\\limits_{i =\
  \ 1}^{n}p_{i}\\left( {y_{i} \\mid x_{i}} \\right)$，我们得到损失函数 $L = - \\ln\\left( \\\
  prod_{i = 1}^{n}{\\frac{1}{\\sqrt{2\\pi\\sigma^{2}}}}e^{- \\frac{1}{2}{(\\frac{y_{i}\
  \ - \\mu_{i}}{\\sigma})}^{2}} \\right)$\n\n$$L = \\frac{\\beta}{2}\\sum\\limits_{i\
  \ = 1}^{n}\\left( {\\mu_{i} - y_{i}} \\right)^{2} - \\frac{n}{2}\\ln\\left( \\beta\
  \ \\right) + \\frac{n}{2}\\ln\\left( {2\\pi} \\right)$$\n\n(1.23)\n\n为了获得 *W* 和\
  \ *β*，我们需要最大化似然函数。这等同于最小化损失函数。由 ∇[*W*]*L =* 0 和 ∇[*β*]*L =* 0，我们得到：\n\n*W* = (*X*^(*T*)⋅*X*)^( − 1) ⋅ *X*^(*T*) ⋅ *Y*\n\
  \n(1.24)\n\n$$\\beta = \\frac{1}{N}\\sum\\limits_{i = 1}^{N}\\left( {\\mu_{i} -\
  \ y_{i}} \\right)^{2}$$\n\n(1.25)\n\n如果 *β* = 1，公式 (1.23) 变为 MSE 损失函数。损失函数中的常数不影响损失函数的梯度。事实上，在岭回归（Hilt\
  \ *et al* 1977）中，我们向 MSE 损失函数添加一个常数，通过调整参数 λ 来对抗过拟合问题：$L = \\frac{1}{2}\\sum\\limits_{i\
  \ = 1}^{N}\\left( {{\\widehat{y}}_{i} - y_{i}} \\right)^{2} + \\frac{\\lambda}{2}{\\\
  mid\\mid}\\mathit{W}{\\mid\\mid}^{2}$，其中  ∣ ∣*W* ∣ ∣² = *w*[0]² + *w*[1]² + … + *w*[*M*]²\n\
  \n*W* = (*X*^(*T*)⋅*X*+*λ**I*)^( − 1)*X*^(*T*) ⋅ *Y*\n\n(1.26)\n\n项目 1.1.1 中的代码是将\
  \ MLE 用于关于 *y = x*⁴*+x*²−1 的非线性回归的一个应用，它在 VS Code 的 Jupyter Notebook 的 Cell 01 中被定义为一个名为\
  \ *f* 的 lambda 函数。如果你在理解项目代码时有困难，可以跳过它们，只需记住图 1.1 中展示的过拟合问题。我们将不再使用这些代码。该项目的工具是来自\
  \ NumPy 和 Matplotlib 的库。**NumPy** 是一个用于科学计算和数据分析的开源 Python 库。从该库中，我们可以导入许多用于线性代数和非线性代数计算的高级数学函数。由于其核心是经过良好优化的\
  \ C 代码，NumPy 以编译代码的速度轻松处理任务。**Matplotlib** 是一个数据可视化 Python 库。有许多 Matplotlib 函数可用于创建不同种类的图表。\n\
