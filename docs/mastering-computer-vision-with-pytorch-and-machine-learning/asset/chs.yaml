  \ 16 × 6 平方英寸。然后为数字山谷创建了一个网格。我们知道截距应为 32，斜率应为 1.8。数组 `b_col` 由 `np.linspace(−2,\
  \ 38, 801)` 设定，数组 `k_row` 由 `np.linspace(0,4,401)` 设定。通过函数 `np.meshgrid()`，上述两个一维数组被转换为两个名为\
  \ `b` 和 `k` 的二维数组。它们的尺寸相同：401 × 801。如果你在 VS Code 笔记本中添加一个额外的单元格并将它们打印出来，你会发现数组 `k`\
  \ 的每一列都相同，而数组 `b` 的每一行都相同。第 06 单元格中的两个 for 循环将每个网格点处的两个数组元素组合成一个 2 × 1 数组，用于权重数组\
  \ `w`。Python 函数 `enumerate()` 应用于任意一维数组，可提供该数组的索引值以及该索引处的数组元素值。利用权重数组 `w` 以及数组 `X`\
  \ 和 `Y`，可以计算每个网格点处的损失函数值。然后通过 `ax.plot_surface()` 绘制数字山谷曲面，并通过另一个函数 `ax.plot3D()`\
  \ 绘制损失值轨迹。\n\n这个简单项目有一个直接解，即令公式 (1.35) 中的 ∇*L* = 0，求得 *w* = (*X*^T·*X*)^(−1)·*X*^T·*Y*。虽然用这个显式公式在毫秒级时间内完成这个简单项目很容易，但我们应该学习如何使用梯度下降算法来做这类工作，因为对于许多复杂的计算机视觉项目，我们没有直接解。那些复杂项目有数百万甚至数十亿个参数需要训练，我们无法为任意损失函数对模型参数的梯度写出数学公式。PyTorch\
  \ 可以帮助我们计算这些梯度。PyTorch 是一个基于其 Torch 库的开源机器学习框架。它提供了具有强大 GPU 支持的张量计算，以及建立在基于磁带的自动求导系统之上的深度神经网络。PyTorch\
  \ 由 Facebook AI Research 实验室开发，广泛用于计算机视觉和自然语言处理任务。TensorFlow 是另一个由 Google 开发的开源机器学习框架。目前\
  \ PyTorch 比 TensorFlow 更流行。\n\n### 1.3 自动梯度计算与学习率调度器\n\n在每个计算机视觉项目中，模型训练期间我们都必须至少计算一个损失函数对参数的梯度。在一个包含数十亿参数、分布在许多神经层的模型中，几乎不可能手动推导梯度公式。PyTorch\
  \ 可用于自动计算这些梯度，而无需提供梯度公式。我们知道，标量函数 *f*(*x,y,z*) 对向量 *V* = [*x,y,z*] 的梯度仍是一个向量，其分量为偏导数：∇*f*\
  \ = [∂*f*/∂*x*, ∂*f*/∂*y*, ∂*f*/∂*z*]。例如，函数 *f*(*x,y,z*) = *x*² + *y*² + *z*² 在点\
  \ *V* = [1,2,3] 处的梯度为：∇*f* = [2*x*, 2*y*, 2*z*] = [2, 4, 6]。以下 VS Code 用于通过 PyTorch\
  \ 自动计算梯度。`torch` 包在 Cell 01 的第一行导入。它支持多维张量的数据结构，并为这些张量提供数学运算。Torch 张量类似于 NumPy 的数组，二者可以相互转换。使用\
  \ torch 张量的主要优势在于 torch 张量可以被移动到 NVIDIA GPU 上进行并行计算，从而节省时间。\n\n![](img/bk978-0-7503-6244-3ch1uf7_pr.gif)\n\
  \n要计算标量函数的梯度，作为 torch 张量的向量必须将其属性 `requires_grad` 设为 True（第 02 行）。有了这个设置，向量的所有数学运算都会被\
  \ PyTorch 记录下来。在 Cell 01 的 for 循环中，*f* 函数必须放在循环内部，然后必须调用 `f.backward()` 函数来计算所有运算中的梯度。函数的梯度随后累积在\
  \ `V.grad` 中。关于 Cell 01 的输出，第一次迭代中的梯度计算是正确的，另外两次是错误的。只有当你删除第 08 行前面的井号符号 # 时，所有计算才会正确。每次使用\
  \ PyTorch 自动计算梯度时，你都需要通过 `grad.zero_()` 将梯度重置为零，或使用稍后提到的其他方法。\n\n![](img/bk978-0-7503-6244-3ch1uf8_pr.gif)\n\
  \n对于包含多个变量的标量函数，我们可能需要忽略某个变量对函数梯度的贡献。上述 Cell 02 中的代码可用于进一步了解 PyTorch 中用于自动梯度计算的\
  \ `backward()` 函数和 `detach()` 函数。这里有另一个函数 *R* = *y* + *z*，其中 *y* = *x*[1]² + *x*[2]²\
  \ + *x*[3]²，*z* = *x*[1]³ + *x*[2]³ + *x*[3]³，在 *x* = [*x*[1], *x*[2], *x*[3]] =\
  \ [1,2,3] 处。我们可以用公式 [2*x*[1] + 3*x*[1]², 2*x*[2] + 3*x*[2]², 2*x*[3] + 3*x*[3]²]\
  \ 计算梯度 ∇[*x*]*R* = ∂*R*/∂*y* ∂*y*/∂*x* + ∂*R*/∂*z* ∂*z*/∂*x*。使用 PyTorch，我们不需要知道梯度公式。只需调用函数\
  \ `R.backward()`，∇[*x*]*R* 的所有中间梯度都会被 PyTorch 的反向传播算法记录和跟踪。然后通过调用 `x.grad`，通过累积所有中间梯度获得\
  \ ∇[*x*]*R*。\n\n通过设定 ∂*R*/∂*y* = 0，我们可以忽略 *y* 对 ∇[*x*]*R* 的贡献。在第 3 章的生成对抗网络（GANs）项目中，我们将遇到这类任务。在这种情况下，我们有\
  \ ∇[*x*]*R* = [3 × 1², 3 × 2², 3 × 3²]。在上述 Cell 02 中，`y.detach()` 用于实现 ∂*R*/∂*y*\
  \ = 0。你可以将 `y.detach()` 改为 `z.detach()` 以查看梯度输出的差异。基于 PyTorch 中自动梯度计算的知识，我们可以用另一种方式编写项目\
  \ 1.3.1 的代码，用于关于温度转换的简单线性回归。\n\n![](img/bk978-0-7503-6244-3ch1uf9_pr.gif)\n\n\n\n\
  \n在 Cell 01 中导入了更多的库或工具。`Torch` 是一个用于多维张量及其数学运算的 PyTorch 包。`Torch` 还为神经网络构建和模型训练提供了许多实用工具。我们将使用\
  \ `torch.nn` 来构建线性回归模型，并使用一个名为 `lr_scheduler` 的模块来实现可变学习率。Pandas DataFrame 将用于记录模型训练历史。`Pandas`\
  \ 是一个 Python 包。Pandas DataFrame 是一个带有行和列的二维数据结构。你注意到了吗？在用于数据输入的 Cell 02 中，变量 `X`\
  \ 和 `Y` 是 torch FloatTensor（浮点张量）？张量是一种数据容器，可用于存储一维、二维、三维甚至四维以上的数组或矩阵。一批批量大小为 64、图像分辨率为\
  \ 256 × 256 的彩色照片，可以存储在一个形状为 64 × 3 × 256 × 256 的四维 PyTorch 张量中。在 Cell 02 中，来自 csv\
  \ 文件的数据被存储在一个 NumPy 二维数组中。其两列随后分别被转换为形状为 9 × 1 的 float32 张量。此处 `view(-1, 1)` 和 `reshape(-1,\
  \ 1)` 完成相同的工作。我们不需要将一个 ONES 张量与 `X` 连接起来。PyTorch 会处理这些额外的工作。如果你在 Cell 01 下方添加一个额外的单元格，并在该单元格中运行\
  \ `CF.dtype` 或 `X.dtype`，你会发现数组 `CF` 的数据类型是 'floating64'，而张量 `X` 的数据类型是 `torch.float32`。张量数据类型有很多种。有时我们需要将一种类型转换为另一种类型。在计算机视觉项目中，大多数时候我们将处理\
  \ `torch.float32`。偶尔，我们会使用 `torch.float16` 以节省内存和模型训练时间。\n\n![](img/bk978-0-7503-6244-3ch1uf10_pr.gif)\n\
  \nTorch 类 `nn.Linear(1,1)` 用于在模型中创建一个具有一个变量输入和一个变量输出的全连接神经网络层。从数学上讲，该模型旨在完成线性回归模型的工作：`X`@`w`^(`T`)。默认情况下，权重张量\
  \ `w` 是一个形状为 1 × 2 的张量。该张量的第一个和第二个元素分别代表斜率和截距（或偏置）。这个 Torch 模型所做的工作比数学运算 `X`@`w`^(`T`)\
  \ 更多。它初始化权重数组 `w`，并存储模型的权重参数。请仔细阅读 Cell 03 的输出。它打印出了优化器的参数。在 Cell 04 中，我们将使用 `optimizer.param_groups[0]['lr']`\
  \ 这一项在模型训练期间获取学习率。默认情况下，类 `nn.MSELoss()` 根据公式 (1.34) 执行任务。通过使用 `nn.MSELoss(reduction\
  \ = 'sum')` 可以避免除以 `n`，从而减少模型训练时间。运行关于损失函数的 Extra-Cell-01 中的代码后，你会知道在该示例中平均损失等于\
  \ 4.0（`loss` = [3 × (2 − 0)²]/3）。\n\n![](img/bk978-0-7503-6244-3ch1uf11_pr.gif)\n\
  \n有多种优化器，它们用于计算损失函数的梯度，并在模型训练期间通过 `optimizer.step()` 自动更新模型权重数组。Adam（自适应矩估计）优化器是最流行的。深入研究优化器的数学算法既不容易，也没有必要。\n\
  \n![](img/bk978-0-7503-6244-3ch1uf12_pr.gif)\n\n学习率是模型训练中最重要的超参数。PyTorch 提供了许多学习率调度器，用于在模型训练期间改变学习率。最通用的调度器是\
  \ `LambdaLR`。你可以定义任何以训练轮数（`i`）为变量的函数。初始学习率（`lr`[0]）通常在 Cell 01 中为优化器设定，第 `i` 个 epoch\
  \ 的学习率等于 `lr`[0] 乘以 Lambda 函数的值。在 Extra-Cell-02 中，第一个函数用于恒定学习率：`lr`[`i`] = 0.5 ×\
  \ `lr`[0]。使用第二个 lambda 函数，学习率在 20,000 个 epoch 的模型训练过程中线性下降。如果选择第三个或第四个函数，学习率将呈指数下降。第五个\
  \ lambda 函数与 PyTorch 中的 `CosineAnnealingLR` 调度器相同。第六个 lambda 函数有三个区段：`i` < 10,000，`i`\
  \ 在 10,000 和 17,000 之间，以及 `i` > 17,000。最后一个 lambda 函数类似于 PyTorch 中的 `StepLR` 调度器。它从一个名为\
  \ `lr_list` 的列表中，按索引 `i`//5000 选取一个数字。\n\n![](img/bk978-0-7503-6244-3ch1uf13_pr.gif)\n\
  \nCell 04 中名为 `df` 的 pandas DataFrame 用于记录模型训练期间每个 epoch 的学习率和损失函数值。可以通过调用 Cell\
  \ 04 最后一行的 `fit` 函数来获得该 DataFrame。模型 `nn.Linear(1,1)` 会管理其所有参数。在每个训练 epoch 中，损失函数对其所有参数的梯度都会通过第\
  \ 10 行的 `optimizer.zero_grad()` 重置为零。正如 `optimizer.step()` 每个 epoch 更新模型参数一样，`scheduler.step()`\
  \ 更新优化器的学习率。\n\n从图 1.4(A) 中，我们仅凭肉眼无法分辨模型预测值 `y_hat` 与原始数据 `Y` 的差异。运行 Cell 06 中的代码，你会看到如图\
  \ 1.4(B) 所示，两者的差异小于 10^(−8)。图 1.4(C) 所示的学习率曲线是我们在 Cell 03 中通过 `my_lambda` 函数设定的。Pandas\
  \ 拥有强大的数据可视化工具。你可以用 Cell 05 第 11 行代码替换第 10 行来绘制学习率曲线。PyTorch 为我们提供了更智能的调度器来改变学习率。其中之一是\
  \ `ReduceLROnPlateau()`。当损失函数的值或另一个指标在 'patience'（耐心值）数量的 epoch 内停止改善时，它会自动降低学习率。Cell\
  \ 03 中有两个学习率调度器。通过将 Cell 03 第 07 行前的井号符号 `#` 移至第 08 行前，并删除第 09 行前的 `#` 符号，你可以在 Cell\
  \ 07 中尝试用于三维损失函数曲面的更智能的调度器。\n\n![](img/bk978-0-7503-6244-3ch1uf14_pr.gif)\n\n![图\
