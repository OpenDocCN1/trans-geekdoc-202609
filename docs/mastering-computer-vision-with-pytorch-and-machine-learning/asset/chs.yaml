  \ G_lr = 18 × D_lr 时模型 D 的 Lambda 学习率调度器。黑色虚线基于理论值绘制。](img/bk978-0-7503-6244-3ch3f8_online.jpg)\n\
  \n**图 3.8.** 动漫人脸数据集使用 Lambda 学习率调度器的训练损失曲线。 (A) 损失曲线。 (B) D(X) 和 D(G(Z)) 的平均值。\
  \ (C) G_lr = 18 × D_lr 时模型 D 的 Lambda 学习率调度器。黑色虚线基于理论值绘制。\n\n\n\n在上一节 MNIST 图像生成项目中，使用了三段式\
  \ Lambda 函数来微调模型损失值。将比率`k`（= G_lr/D_lr）从 4、8、10、20、50、200、400、500 和 1000 进行更改，我们可以获得清晰锐利的伪造\
  \ MNIST 图像。两个学习率的最佳比率是多少？动漫人脸数据集的图像是寻找最佳比率`k`的绝佳样本，因为它们包含更多详细信息。从伪造图像上的眼睛大小、颜色、鼻子和嘴巴的位置，我们的眼睛可以看到非常微小的差异。在初始学习率设置为`10^(-4)`时，20\
  \ 是比率`k`的一个关键数值，尽管两个模型的损失函数曲线不是直线。在这些理论值附近损失值有小幅波动时，GAN 模型可以生成包含详细信息的伪造图像。随着比率`k`升高，这些损失曲线可以被调整为直线，但\
  \ DCGAN 模型学习缓慢，伪造图像更嘈杂，甚至出现鬼脸。随着比率`k`降低，DCGAN 的模型 D 比其模型 G 更聪明，因此模型 G 的损失值将逐个 epoch\
  \ 增加。如果模型 G 的损失值高于 6，GAN 系统将出现如图 3.9 所示的“模型崩溃”问题。较低比率`k`产生的伪造图像也更嘈杂。\n\n![Figure\
  \ 3.9. Fake Anime-faces dataset images generated by the DCGAN with model collapse\
  \ issues in four model training explorations. In each of the first three explorations,\
  \ all 48 fake images were the same, and only images in the first row were shown.](img/bk978-0-7503-6244-3ch3f9_online.jpg)\n\
  \n**图 3.9.** DCGAN 生成的带有模型崩溃问题的伪造动漫人脸数据集图像，共四次模型训练探索。在前三次探索中，所有 48 张伪造图像均相同，因此仅展示了第一行的图像。\n\
  \n### 3.3 条件深度卷积 GAN\n\n虽然 DCGAN 可以生成高质量的伪造图像，但无法生成具有我们设定的特定类别或风格的伪造图像。在 Mehdi Mirza\
  \ 和 Simon Osindero 于 2014 年发表题为“Conditional generative adversarial nets”的论文（Mirza\
  \ and Osindero 2014）后，我们有了一个强大的工具：条件深度卷积 GAN（cDCGAN），它可以根据我们的要求生成伪造图像。我们甚至可以使用文本或声音提示来指示\
  \ cDCGAN 生成与训练数据集中真实图像相似的任何类型的伪造图像。在上一节 MNIST 图像生成项目中，我们丢弃了标签信息。现在我们将每张图像的每个标签编码为图像的一个额外通道。然后，一批带有标签信息的图像被打包成一个\
  \ 4D 张量，作为 cDCGAN 中模型 D 的输入。在上一节中，我们使用`1 × 100`噪声张量作为模型 G 的输入来生成伪造图像。现在我们将为模型 G\
  \ 使用`1 × 110`张量来生成伪造图像。额外的 10 个元素来自 MNIST 数据集范围`[0,9]`内的伪造标签。训练这两个模型的代码与 DCGAN 中的代码几乎相同。模型参数将在模型训练期间更新，使我们的模型足够聪明，能够生成我们要求的特定数字的逼真伪造图像。使用\
  \ PyTorch 的嵌入类来编码标签及其图像的信息。\n\n以下 Extra Cell ONE 第 02 行是 MNIST 数据加载器中一批图像的 5 个标签的\
  \ 1D 张量。第 04 行嵌入类的实例会在模型训练前将该 1D 张量嵌入为一个填充随机数的`5 × 3`张量。实例的第一个参数是 MNIST 的类别数（10）。1D\
  \ 张量的最大值应为 9。实例的第二个参数是嵌入输出的列数。嵌入输出的行数等于 1D 标签张量的长度。由于示例中 1D 张量的第一个和最后一个元素相同，因此嵌入输出的第一行和最后一行相同。嵌入实例的参数将在模型训练期间更新。\n\
  \n![image](img/bk978-0-7503-6244-3ch3uf18_pr.gif)\n\n#### 3.3.1 cDCGAN 在 MNIST 和\
  \ Fashion MNIST 数据集上的应用\n\nFashion-MNIST（Xiao *et al* 2017）是由德国公司 Zalando 创建的数据集。它与\
  \ MNIST 数据集具有相同的结构：训练数据集和测试数据集分别包含 60,000 和 10,000 张带标签的黑白图像。这些图像的分辨率为`28 × 28`。图像被分为十类（0\
  \ 到 9），分别代表 T 恤/上衣、裤子、套衫、连衣裙、外套、凉鞋、衬衫、运动鞋、包和短靴。在项目 3.3.1 的 Cell 04 之后的额外单元格中运行代码`train_Dataset.classes`，您将看到这些类别名称。由于\
  \ MNIST 和 Fashion MNIST 的数据集结构相同，通过在 Cell 01 和 Cell 02 中更改数据集名称，项目中的代码可分别用于这两个数据集。cDCGAN\
  \ 生成的伪造 MNIST 图像和伪造 Fashion MNIST 图像如图 3.10 所示。它们的质量与真实图像相比足够好。\n\n![](img/bk978-0-7503-6244-3ch3uf19a_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch3uf19b_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch3uf20_pr.gif)\n\
  \n![Figure 3.10. Fake MNIST images (left) and Fake Fashion MNIST images (right)\
  \ generated by cDCGAN. They are the outputs of Cell 11. Model training time is 11\
  \ min.](img/bk978-0-7503-6244-3ch3f10_online.jpg)\n\n**图 3.10.** cDCGAN 生成的伪造 MNIST\
  \ 图像（左）和伪造 Fashion MNIST 图像（右）。它们是 Cell 11 的输出。模型训练时间为 11 分钟。\n\nCell 06 第 22 行的代码是嵌入类的实例`nn.Embedding(10,\
  \ 784)`。结合模型 D 中 forward 函数的第一行，数据加载器中一批次的每张图像被重塑为一个具有 784 个元素的 1D 张量。使用嵌入实例，forward\
  \ 函数的第二行将批次中的每个标签编码为一个具有 784 个元素的 1D 张量。现在我们有两个张量，它们具有相同的形状：`batch_size × 784`。这两个张量沿行方向（`dim\
  \ = 1`）拼接。结果是一个形状为`batch_size × 1568`的较长张量。然后，它被重塑为形状为`batch_size × 2 × 28 × 28`的\
  \ 4D 张量，并像往常一样通过模型 D 的卷积网络进行处理。模型 D 的输出是一个具有 batch size 个元素的 1D 张量。由于模型 D 中的 sigmoid\
  \ 激活函数，每个元素都是介于 0 和 1 之间的正数。根据 GAN 论文，第 01 层和第 04 层不使用批量归一化。在此设置下，这两个卷积的偏置选项默认设置为“True”。\n\
  \n![](img/bk978-0-7503-6244-3ch3uf21_pr.gif)\n\n模型 G 的 forward 函数需要两个输入。一个是一批潜在向量的张量（像往常一样），另一个是一个\
  \ 1D 伪造标签张量，它随后被嵌入为形状为`batch_size × 10`的张量。这两个张量随后沿行方向（`dim = 1`）拼接。结果是一个形状为`batch_size\
  \ × 110`的张量。然后它被重塑为形状为`batch_size × 110 × 1 × 1`的 4D 张量，并像往常一样通过模型 G 中的转置卷积网络进行处理。模型\
  \ G 的输出是一批图像。模型 G 的第 04 层也没有批量归一化操作。\n\n![](img/bk978-0-7503-6244-3ch3uf22_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch3uf23_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch3uf24_pr.gif)\n\
  \n\n\n\n第 08 到第 13 个单元格的代码与上一节中的代码几乎相同。唯一的区别是向系统添加了标签信息。在第 01 个单元格的最后两行，通过 `[*i*\
  \ for *i* in range(10) for *j* in range(10)]` 创建了一个名为 `fixed_labels` 的一维长张量。该一维长张量中包含\
  \ 100 个数字。这个一维张量和第 01 个单元格中名为 `fixed_latent` 的另一个 100 × 100 张量，在第 11 个单元格中被用于模型训练期间生成假\
