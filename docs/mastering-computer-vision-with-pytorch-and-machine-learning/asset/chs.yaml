  \n**图 5.1.** (A) VAE 信息流程图（真实曲线为单元格 03 的输出）。(B 和 C) 由 beta-VAE 生成的虚假二次曲线，`β` = 0.5（单元格\
  \ 07 的输出）。模型训练时间为 9 分钟。\n\nVAE 系统的架构如图 5.1(A) 所示。一个批次中带有噪声的每条真实曲线均由编码器模型 `Q` 处理，以获得多元高斯分布的两个向量：均值向量（`μ`）和标准差向量（`σ`）。然后，通过\
  \ `z = μ + σε` 为每条真实曲线生成一个潜在向量 `z`，其中 `ε` 是从标准多元正态分布 `N(0,I)` 生成的随机数。在以下项目代码中，你将看到一个技巧，展示了如何计算标准差向量（`σ`），其中每个元素必须为正数。解码器的模型\
  \ `P` 使用一批潜在向量 `Z` 来生成一批虚假图像（`X̂`）。图 5.1(A) 中显示的那些虚假曲线在模型训练开始时非常嘈杂。然后在 epoch 20,000\
  \ 时，噪声被过滤掉，图 5.1(C) 中显示的虚假曲线变得平滑。\n\n![](img/bk978-0-7503-6244-3ch5uf1_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch5uf2_pr.gif)\n\n单元格 04 中定义的编码器类使用一批真实曲线作为输入，并由一个全连接层进行处理。编码器输出一个潜在向量\
  \ `z`、一个均值（`μ`）张量和一个对数方差（`ln(σ²)`）张量。潜在向量 `z` 通过 `z = μ + σε` 从正态分布 `N(μ,σ²)` 中采样，其中\
  \ `ε` 是由标准正态分布 `∼N(0,I)` 生成的随机数。这是计算标准差（std）的技巧，标准差必须为正数。从对数方差，我们可以通过 `σ = √(e^(ln(σ²)))`\
  \ 得到标准差。单元格 05 中定义的解码器 `P` 像往常一样有两个全连接层。它使用一批潜在向量作为输入。解码器的输出是一批虚假曲线。根据公式 (5.4)，损失函数在单元格\
  \ 06 中定义。如果损失函数中的两部分是用 `mean` 而不是 `sum` 计算的，我们必须将 `β` 值调整为 0.01 左右。Adam 优化器用于模型训练。单元格\
  \ 07 中定义的训练函数使用 pandas 数据帧来记录模型训练期间的损失值。在每个 epoch 中，生成五批真实曲线用于模型训练。每批训练数据由编码器模型\
  \ `Q` 处理。模型 `Q` 的输出 `z` 是模型 `P` 的输入，用于生成虚假曲线。然后计算损失值，并由 Adam 优化器更新两个模型的参数。损失函数曲线如图\
  \ 5.2(A) 所示。\n\n![](img/bk978-0-7503-6244-3ch5uf3_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch5uf4_pr.gif)\n\
