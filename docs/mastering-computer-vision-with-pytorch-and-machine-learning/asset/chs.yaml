  \ space (outputs of Cell 09). (C) Fake curves generated from latent vectors (z =\
  \ [−2, 0], z = [2, 0], z = [−2, 15]) by mode P (outputs of Cell 10).](images/bk978-0-7503-6244-3ch5f2_online.jpg)\n\
