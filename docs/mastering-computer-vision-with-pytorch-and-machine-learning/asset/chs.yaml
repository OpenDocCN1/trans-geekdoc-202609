  \n---\n\n# **IOP** Publishing\n\n# Mastering Computer Vision with PyTorch and Machine\
  \ Learning\n\n# Caide Xiao\n\n---\n\n# 第 5 章\n\n## 利用 VAE 进行图像生成\n\n本章介绍用于无监督学习以生成假二次曲线和假\
  \ MNIST 图像的变分自编码器 (VAE)。VAE 中的模型易于训练，但 VAE 生成的图像质量不如 GAN 生成的好。VAE-GAN 是这两种技术的混合体，并已在\
  \ MNIST、Fashion MNIST 和 Anime 数据集上实现。\n\n在第 3 章中，我们使用生成对抗网络生成假图像。由于模式崩溃和其他问题，DCGAN\
  \ 和 cDCGAN 的模型训练仍然是一个挑战。需要花费大量时间来调整初始学习率、学习率调度器和其他超参数，以实现成功的模型训练。在第 4 章中，使用了 WGAN-GP\
  \ 来稳定模型训练。我们也可以使用无监督学习算法来生成图像。基于该算法的生成模型（Kingma 和 Welling 2013）是变分自编码器 (VAE)，它们易于训练。它们可用于通过学习数据集底层结构的紧凑表示，生成与给定数据集中的图像相似的新数据样本（图像）。VAE\
  \ 系统中也有两个模型。编码器模型或网络将输入数据映射到低维表示（将每张图像压缩为一个低维潜在向量）。潜在向量可以有 1D、2D、3D 甚至超过一百个维度。例如，一张\
  \ MNIST 图像可以被压缩为 2D 潜在空间中仅包含两个元素的向量。然后，系统中的解码器网络使用潜在向量生成一张与原始 MNIST 图像相似的图像。图像压缩比为\
  \ 392 (= 784/2)。然而，VAE 并非为图像压缩而设计，因为 VAE 算法不如 JPEG 算法好。VAE 比 GAN 发明得更早。理论更难理解，且\
  \ VAE 生成的假图像质量通常不如 GAN 生成的清晰。那么，为什么我们要浪费时间学习 VAE 呢？\n\n我们感兴趣的不是假图像，而是由 VAE 系统生成的那些低维潜在向量。潜在向量中的每个元素都是\
  \ VAE 系统学到的一个图像特征。通过调整潜在向量中这些元素的值，我们可以编辑图像以生成新图像。例如，我们可以将图像中的人脸表情从愤怒变为微笑，将图像中的月相从满月变为新月。借助基于\
  \ VAE 算法的新技术，如向量量化变分自编码器 (VQ-VAE)，我们可以在无监督学习中达到最先进的结果。我们可以将 VAE 与 GAN 结合，利用这两种技术的优势进行模型训练。VAE\
  \ 已被用于许多领域，包括图像生成、异常检测和强化学习。\n\n### 5.1 VAE 和 beta-VAE\n\n在 VAE 系统用于图像生成的应用中，数据集中的每张图像都是高维观测空间中的一个点。例如，每张\
  \ MNIST 图像都是 784 维空间中的一个点。通常，我们的计算机内存不足以容纳数据集中的所有图像。我们必须将图像数据集切片为一个包含许多批次的数据加载器。它们的批次大小是一个常数\
  \ `n`。一个批次中的图像是观测数据：`x[1]`、`x[2]`、…、`x[n]`。每张图像由一个包含元素的潜在向量生成：`z[1]`、`z[2]`、…、`z[m]`，其中\
  \ `m` ≪ `n`。表 5.1 显示了观测数据点和未知潜在向量的未知联合概率。`p(x[j])` 的边际概率也是未知的（`j` = 1, 2, …, `n`）。我们假设先验分布\
  \ `p(z[i])` 服从标准正态分布 `N(0,I)`，其中 `I` 是单位矩阵。根据公式 (1.28)，我们有 `p(x_j) = ∑_{i=1}^m p(x_j,z_i)\
  \ = ∑_z p(x_j,z)`。从数据集的负似然，我们得到一个损失函数：\n\n```\nL = - ln ( P( X ) ) = - ln ∏_{j=1}^n\
  \ p( x_j ) = - ∑_{j=1}^n ln ( ∑_z p( x_j,z ) )\n```\n\n(5.1)\n\n**表 5.1.** VAE 系统的未知联合概率。\n\
  \n| `P(X,Z)` | | `x[1]` | | `x[2]` | | … | | `x[n]` | | `P(Z)` |\n| --- | --- |\
  \ --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| `z[1]` | | `p(x[1],z[1])`\
  \ | | `p(x[2],z[1])` | | … | | `p(x[n],z[1])` | | `p(z[1])` |\n| `z[2]` | | `p(x[1],z[2])`\
  \ | | `p(x[2],z[2])` | | … | | `p(x[n],z[2])` | | `p(z[2])` |\n| … | | … | | … |\
  \ | … | | … | | … |\n| `z[m]` | | `p(x[1],z[m])` | | `p(x[2],z[m])` | | … | | `p(x[n],z[m])`\
  \ | | `p(z[m])` |\n| `P(X)` | | `p(x[1])` | | `p(x[2])` | | … | | `p(x[n])` | |\
  \ 1.00 |\n\n由于联合概率未知，我们无法直接使用上述公式对损失函数做任何处理。幸运的是，我们可以构建一个编码器网络，它使用数据加载器中每一批图像作为编码器的输入，以获得批次中每张图像的均值向量和方差向量。然后，均值向量和方差向量被用来为每张图像构建一个多元正态分布\
  \ `q(z|x)`。图像的潜在向量的每个元素随后通过从 `q(z|x)` 采样获得。利用 VAE 编码器的先验概率和第 1.1.4 节中关于 `g(x) =\
  \ -ln(x)` 的 Jensen 不等式，我们可以间接找到 VAE 系统损失函数的最小值。在下面的负对数函数内部是关于 `z` 的 (`p`/`q`) 的平均值，它应该小于或等于\
  \ `-ln(p/q)` 的平均值。\n\n\n\n\n\n### 5.2 beta-VAE 在假二次曲线中的应用\n\n$$L = - \\sum\\limits_{j\
  \ = 1}^{n}{\\ \\ln\\ \\sum_{z}{q\\left( {z\\mid x_{j}} \\right)}\\frac{p\\left(\
  \ {x_{j},z} \\right)}{q\\left( {z\\mid x_{j}} \\right)}} \\leqslant - \\sum\\limits_{j\
  \ = 1}^{n}{\\sum_{z}{q(z\\mid x_{j})\\ln\\ \\frac{p\\left( {x_{j},z} \\right)}{q\\\
  left( {z\\mid x_{j}} \\right)}}}$$\n\n$$L \\leqslant \\sum\\limits_{j = 1}^{n}\\\
  left\\lbrack {\\sum\\limits_{z}{q(z\\mid x_{j})\\ln\\ \\frac{q(z\\mid x_{j})}{p{(z)}}}\
  \ - \\sum\\limits_{z}{q(z\\mid x_{j})\\ln\\ \\left( { p(x_{j}\\mid z)} \\right)}}\
  \ \\right\\rbrack$$\n\n$$L \\leqslant \\sum\\limits_{j = 1}^{n}\\left( {D_{KL}(q(z\\\
  mid x_{j}){\\mid\\mid}p{(z)}) - Ε_{z \\sim q(z\\mid x_{j})}\\ln\\ \\left( { p(x_{j}\\\
  mid z)} \\right)} \\right)$$\n\n(5.2)\n\n我们还可以为 VAE 系统构建一个解码器网络（`P`）。解码器使用来自编码器模型\
  \ `Q` 的潜在向量来生成一张假图像（`x̂`）。我们将解码器训练为分布 `p(x∣z)`，作为一个具有单位方差的正态分布：$p\\left( {x_{j}\\\
  mid z} \\right) = \\frac{1}{\\sqrt{\\left( {2\\pi} \\right)^{m}{\\mid I \\mid}}}e^{-\
  \ \\frac{1}{2}{({x_{j} - \\mu_{\\theta}{(z)}})}^{T}I{({x_{j} - \\mu_{\\theta}{(z)}})}}$，其中\
  \ `θ` 是解码器的一组参数，而 `x̂[j] = μθ` 是解码器的输出。有了上述信息，VAE 系统的损失函数可以写成以下方程（忽略常数）：\n\n$$L\
  \ \\leqslant \\sum\\limits_{j = 1}^{n}{\\sum\\limits_{i = 1}^{m}\\left( {\\mu_{i,j}^{2}\
  \ + \\sigma_{i,j}^{2} - \\ln\\ \\left( \\sigma_{i,j}^{2} \\right) - 1} \\right)}\
  \ + \\frac{1}{2}\\sum\\limits_{j = 1}^{n}{\\parallel {x_{j} - {\\widehat{x}}_{j}}\
  \ \\parallel}^{2}$$\n\n(5.3)\n\n如果我们能最小化方程 (5.3) 的右侧，那么合乎逻辑的是我们也能最小化方程的左侧，因为左侧小于或等于右侧。方程\
  \ (5.3) 右侧的第一部分称为“正则化损失”，第二部分称为“重构损失”。在上述表格和方程中，我们将潜在变量 `z` 视为离散变量。实际上，在 VAE 系统中，潜在变量\
  \ `z` 可以是连续变量。利用 ∫[z]q(z∣x[j])dz = 1 和 `D[KL] ⩾ 0`，我们也可以通过以下数学推导得到关于 VAE 损失函数的相同结果：\n\
  \n$$L = - {\\ln\\ }\\left( {P\\left( X \\right)} \\right) = - {\\ln\\ }\\prod\\\
  limits_{j = 1}^{n}{p\\left( x_{j} \\right)} = - \\sum\\limits_{j = 1}^{n}\\left\\\
  lbrack \\ln\\ \\left( { p\\left( x_{j} \\right)} \\right)\\int_{z}\\left. q(z\\\
  mid x_{j})\\mathit{dz} \\right\\rbrack \\right.$$\n\n$$L = - \\sum\\limits_{j =\
  \ 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\ln\\ \\left( { p\\left( x_{j} \\right)} \\right)\\\
  mathit{dz}}} = - \\sum\\limits_{j = 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\ln\\ \\left(\
  \ \\frac{ p\\left( {z,x_{j}} \\right)}{p\\left( {z\\mid x_{j}} \\right)} \\right)\\\
  mathit{dz}}}$$\n\n$$L = - \\sum\\limits_{j = 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\\
  ln\\ \\left( {\\frac{ p\\left( {z,x_{j}} \\right)}{q\\left( {z\\mid x_{j}} \\right)}}\\\
  frac{q\\left( {z\\mid x_{j}} \\right)}{p\\left( {z\\mid x_{j}} \\right)}} \\right)\\\
  mathit{dz}}}$$\n\n$$L = - \\sum\\limits_{j = 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\\
  ln\\ \\left( \\frac{ p\\left( {z,x_{j}} \\right)}{q\\left( {z\\mid x_{j}} \\right)}\
  \ \\right)\\mathit{dz}}} - \\sum\\limits_{j = 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\\
  ln\\ \\left( \\frac{q\\left( {z\\mid x_{j}} \\right)}{p\\left( {z\\mid x_{j}} \\\
  right)} \\right)\\mathit{dz}}}$$\n\n$$L = - \\sum\\limits_{j = 1}^{n}{\\int_{z}{q(z\\\
  mid x_{j})\\ln\\ \\left( \\frac{ p\\left( {z,x_{j}} \\right)}{q\\left( {z\\mid x_{j}}\
  \ \\right)} \\right)\\mathit{dz}}} - \\sum\\limits_{j = 1}^{n}{D_{KL}\\left( {q(z\\\
  mid x_{j}){\\mid\\mid}p(z\\mid x_{j})} \\right)}$$\n\n$$L \\leqslant - \\sum\\limits_{j\
  \ = 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\ln\\ \\left( \\frac{ p\\left( {x_{j}\\mid\
  \ z} \\right)p\\left( z \\right)}{q\\left( {z\\mid x_{j}} \\right)} \\right)\\mathit{dz}}}$$\n\
  \n$$L \\leqslant \\sum\\limits_{j = 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\ln\\ \\left(\
  \ \\frac{q\\left( {z\\mid x_{j}} \\right)}{p\\left( z \\right)} \\right)\\mathit{dz}}}\
  \ - \\sum\\limits_{j = 1}^{n}{\\int_{z}{q(z\\mid x_{j})\\ln\\ \\left( { p\\left(\
  \ {x_{j}\\mid z} \\right)} \\right)\\mathit{dz}}}$$\n\n$$L \\leqslant \\sum\\limits_{j\
  \ = 1}^{n}\\left( {D_{KL}(q(z\\mid x_{j}){\\mid\\mid}p{(z)}) - Ε_{z \\sim q({z\\\
  mid x_{j}})}}\\ \\ln\\ \\left( { p\\left( {x_{j}\\mid z} \\right)} \\right)} \\\
  right)$$\n\n这是关于损失函数 (5.3) 两部分的一个问题。这两部分的数值不在同一量级上。Higgins 及其同事在 2017 年的论文中提出了解决方案（Higgins\
  \ *et al* [2017]），引入超参数 `β` 来平衡损失函数两部分的贡献。他们将具有修正后损失函数（方程 (5.4)）的 VAE 命名为“beta-VAE”。如果\
  \ `β` = 1.0，我们得到一个常规的 VAE 系统；如果 `β` > 1.0，正则化损失（`D[KL]`）会迅速降至零，我们会在后续项目的假图像生成中遇到“模式崩塌”问题；如果\
  \ `β` = 0.0，我们的 VAE 系统就变成了一个自编码器系统。使用更大的 `β`，我们会得到非常模糊的假图像，但我们将拥有更强的能力在不同阶段调整新的假图像。\n\
  \n$$L = \\beta\\sum\\limits_{j = 1}^{n}{\\sum\\limits_{i = 1}^{m}\\left( {\\mu_{i,j}^{2}\
  \ + \\sigma_{i,j}^{2} - \\ln\\ \\left( \\sigma_{i,j}^{2} \\right) - 1} \\right)}\
  \ + \\frac{1}{2}\\sum\\limits_{j = 1}^{n}{{\\mid\\mid}x_{j} - {\\widehat{x}}_{j}\\\
  mid\\mid^{2}}$$\n\n(5.4)\n\n\n\n\n\n#### 5.2.1 项目：生成虚假二次曲线\n\n在以下用于生成虚假二次曲线的项目 5.2.1\
  \ 中，beta-VAE 系统的编码器模型（`Q`）和解码器模型（`P`）均仅使用了两个全连接层。在单元格 01 中，超参数 `z_dim` 被设置为等于 2，以便于数据可视化。这意味着每条包含\
  \ 21 个点的曲线都是从一个二维潜在向量生成的。系统的解码器将使用从二维高斯分布中采样的两个数字来恢复每条包含 21 个点的曲线。超参数 beta 被设置为等于\
  \ 0.5，以便我们可以平衡损失函数中两部分的贡献。噪声被添加到二次曲线中（单元格 02 的第 04 行）。在图 5.1(A) 中，由于噪声的存在，64 条真实曲线并不平滑。我们没有该项目的数据集。模型训练的数据是在数据加载器需要一个批次数据时生成的，每个\
  \ epoch 的批次数设置为 5。\n\n![Figure 5.1. (A) VAE information flow chart (real curves\
  \ are outputs of Cell 03). (B and C) fake quadratic curves generated by a beta-VAE\
