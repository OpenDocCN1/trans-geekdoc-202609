  \ position=\"float\"/>\n\n### 2.3 使用 ResNet9 进行 CIFAR-10 分类\n\n运行 Extra Cell THREE\
  \ 中的代码后，你将看到上述结果。由于填充设置为 1，卷积输出的三个通道的尺寸与张量 `X` 的尺寸相同。子张量 `C[1]` 是 `X` 与 `K[1]` 卷积的结果。`C[1]`\
  \ 中元素的最大值为 3.0。从 `C[1]` 中最大值的位置，你可以找到张量 `X` 中垂直线“∣”模式的位置。然后，通过步长选项设为 2 的 PyTorch\
  \ 函数 `max_pool2d()` 来聚集局部模式信息。在上一节 Cell 05-2 的 ResNet6 模型中使用了一个名为 `nn.MaxPool2d(2)`\
  \ 的 PyTorch 类。`max_pool2d` 函数输出的子张量 `M[1]` 来自 `C[1]`。在机器学习中，我们不需要手动寻找或搜索模式。通过使用梯度下降算法优化损失函数，我们可以训练模型自动在图像中寻找局部模式，这些模式记录在每个\
  \ CNN 层的卷积核滤波器中。Cell 05-2 中定义的 ResNet6 模型有五个 CNN 层和一个全连接层（或密集层）。模型中名为 `basic` 的函数里的\
  \ PyTorch 类 `nn.BatchNorm2d()` 对其 4D 张量输入进行归一化。ResNet6 的 `basic` 函数有一个 CNN 层。模型中名为\
  \ `Rs_Block()` 的类有两个 CNN 层。\n\n在任何使用 CNN 模型的计算机视觉项目中，信息都按顺序单向流经 CNN 层。这类模型被称为“平凡”模型。常识认为，模型层数越多，模型就越聪明。CNN\
  \ 模型最大层数的极限是多少：10 层、100 层，甚至超过 1000 层？2015 年，Kaiming He 及其三位同事发表了一篇论文（He *et al*\
  \ 2016），题为“用于图像识别的深度残差学习”。他们发现，一个拥有 20 层的“平凡”模型比另一个拥有 56 层的“平凡”模型更准确。他们发现这个奇怪的问题是由一个称为“梯度消失”的数学问题引起的，并通过使用残差神经网络（`ResNet`）解决了该问题。有了他们的解决方案，`ResNet`\
  \ 模型可以拥有超过一千个 CNN 层。\n\n关于图像分类的计算机视觉项目的输入是一批图像：一个 4D 张量 `X`。如果一个平凡模型有三层，每一层就像一个数学函数。使用“前向传播”算法，模型的输出为：*ŷ*\
  \ = *f*3))<inline-graphic style=\"height:1.75em;\" xlink:href=\"bk978-0-7503-6244-3ch2ieqn49.gif\"\
  />。损失函数的值也从另一个函数 *L* = *g*(*X*,*f*[1],*f*[2],*f*[3])<inline-graphic style=\"height:1.5625em;\"\
  \ xlink:href=\"bk978-0-7503-6244-3ch2ieqn50.gif\"/> 获得。使用梯度下降算法优化模型时，我们通过“反向传播”算法计算损失函数对输入张量\
  \ `X` 的梯度：$\\nabla_{X}L = \\frac{\\partial L}{\\partial f_{3}}\\frac{\\partial f_{3}}{\\\
  partial f_{2}}\\frac{\\partial f_{2}}{\\partial f_{1}}\\frac{\\partial f_{1}}{\\\
  partial X}$<inline-graphic style=\"height:2.125em;\" xlink:href=\"bk978-0-7503-6244-3ch2ieqn51.gif\"\
  />。在机器学习中，我们经常处理 float32 张量。在 ∇[*X*]*L*<inline-graphic style=\"height:1.0625em;\"\
  \ xlink:href=\"bk978-0-7503-6244-3ch2ieqn52.gif\"/> 中所有偏梯度的值都小于 1，且平凡模型的层数为 100\
  \ 甚至 1000 的情况下，*L* 对 *X* 的梯度将非常接近于零。这就是“梯度消失”问题。在这种情况下，模型参数无法更新，模型训练结果也不会改善。\n\n\
  为了避免“梯度消失”问题，Kaiming He 及其同事让信息通过分支流经模型层。在第 2.1 节的 ResNet6 模型中，第三层和第四层来自一个包含两个分支来处理输入信息的类\
  \ `Rs_Block`。一个分支绕过第 03 层和第 04 层，另一个分支由这两层处理。由于两个分支的张量形状相同，它们可以直接相加以得到 `Rs_Block`\
  \ 的输出。从上一节的卷积操作示例中，我们看到卷积输出的元素值因卷积中的乘法和求和运算而变大。第二个分支的输出减半，然后将减半后的输出加到第一个分支的输出上，作为\
  \ `Rs_Block` 类的输出。\n\n在更复杂的 ResNet 模型中，我们必须使用带有大小为 1 的卷积核滤波器的 `nn.Conv2d()` 和其他\
  \ PyTorch 类来修改两个分支中的数据通道和分辨率。在深入研究 ResNet 网络之前，让我们利用上述知识对 CIFAR-10 数据集（Krizhevsky\
  \ and Hinton 2009）中的图像进行分类。该数据库由多伦多的一个研究机构创建：加拿大高等研究院。CIFAR-10 数据库包含 10 个不同类别的 60,000\
  \ 张彩色图像。这些图像的分辨率为 32 × 32。Cell 01 中的代码用于导入 CIFAR-10 图像分类项目所需的 Python 和 PyTorch 库。超参数也在该单元格中设置。通过\
  \ Cell 02 中的代码，我们为两个数据集输入 CIFAR-10 数据库。通过使用四种图像变换操作，训练集和验证集的图像分类准确率之间的差异很小。否则，训练集的分类准确率会迅速增加到接近\
  \ 100%，但验证集的准确率要低得多。这些增强操作可以显著减少过拟合问题。\n\n\n\n\n\n## 数据集划分与 DataLoader 创建\n\n在 Cell\
