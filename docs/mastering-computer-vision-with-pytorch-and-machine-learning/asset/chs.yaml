  \ 5.2(B) 中，用 ⊗ 和 ⊕ 标记的两个潜在向量的坐标分别为 [−2,0] 和 [2,0]。从它们出发，解码器 `P` 生成了两条平滑的虚假曲线，如图\
  \ 5.2(C) 所示。潜在向量的值 `z[0]` 可用于调整虚假曲线的垂直位置。`z[1]` 的值赋予我们调整虚假曲线平滑度的能力。图 5.2(C) 中的锯齿状虚假曲线是由潜在向量\
  \ `z` = [−2, 15] 生成的。每次运行项目代码时，虚假曲线的控制器都会不同。有时，`z[1]` 的值可以控制虚假曲线在 `y` 轴上的位置。\n\n\
  ### 5.3 beta-VAE 在 MNIST 数据集上的应用\n\n\n\n\n\n用于 MNIST 项目生成假图像的 beta-VAE 架构与上一节用于生成假二次曲线的架构几乎相同。主要区别在于编码器\
  \ `Q` 和解码器 `P` 使用了深度卷积网络。我们知道，具有两个全连接层的神经网络不足以处理 MNIST 图像。项目 5.3.1 代码生成的真实和假 MNIST\
  \ 图像（图 5.3(B)）应当是一样的。我们可以看到假 MNIST 图像模糊不清，且部分数字错误。这些问题是由 Cell 02 中为数据可视化设置 `z_dim`\
  \ = 2 导致的。当一张 MNIST 图像被编码器从 784 个像素压缩为仅含两个元素的潜在向量时，部分信息丢失，导致解码器无法正确恢复原始图像信息。图 5.4\
  \ 展示了其他训练结果：包含潜在向量点的二维潜在空间、损失曲线，以及由 `p(x|z)` 生成、且 `z[0]`∈[−10,10] 和 `z[1]`∈[−10,10]\
  \ 的假图像。通过将 `β` 值从 0 调整到 10，你可以看到潜在空间中的点会从一个巨大的不规则区域被压缩成一个半径约为 3 的圆形区域。我们的模型确实可以通过较大的\
  \ `β` 值训练，强制 `q(z|x)` 接近 `N(0, I)`，但由 `p(x|z)` 生成的假数字图像会过于模糊而无法辨认。我们需要模型训练中 Kullback-Leibler\
  \ 散度的作用，但不能过度。将 Cell 01 中的 `z_dim` 从 2 改为 20，我们将获得清晰锐利的假 MNIST 图像，但图 5.4(A) 中的潜在空间将无法显示。使用\
  \ VAE，我们能够在没有标签信息的情况下从图像数据集生成所需的假图像。\n\n![](img/bk978-0-7503-6244-3ch5uf5_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch5uf6_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch5uf7_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch5uf8_pr.gif)\n\n![图 5.3. (A) 真实 MNIST 图像。 (B) 由 β-VAE\
  \ 生成的假 MNIST 图像，`z_dim` = 2 且 `β` = 0.01。这些图像模糊不清，且部分数字错误。若 `z_dim` = 20，假图像与真实图像一样好，且没有数字错误。模型训练时间为\
  \ 9 分钟。MNIST 图像数据集来源于 Deng (2012)，许可证为 CC BY 3.0。](img/bk978-0-7503-6244-3ch5f3_online.jpg)\n\
  \n**图 5.3.** (A) 真实 MNIST 图像。 (B) 由 `β`-VAE 生成的假 MNIST 图像，`z_dim` = 2 且 `β` = 0.01。这些图像模糊不清，且部分数字错误。若\
  \ `z_dim` = 20，假图像与真实图像一样好，且没有数字错误。模型训练时间为 9 分钟。MNIST 图像数据集来源于 Deng (2012)，许可证为\
