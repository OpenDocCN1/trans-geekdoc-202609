  \ 5.4.** `β` = 0.01 时 beta-VAE 的模型训练结果。 (A) 二维潜在空间：Cell 12 的输出。 (B) 损失曲线：Cell 09\
  \ 的输出（总损失、正则化损失 `D_kl` 和重构损失 MSE）。 (C) 由 `p(x|z)` 生成的假图像：cell 13 的输出，其中 −10⩽`z[0]`⩽10\
  \ 且 −10⩽`z[1]`⩽10。\n\n### 5.4 对 MNIST、Fashion MNIST 与 Anime-Face 数据集使用 VAE-GAN\n\
  \n与 GAN 相比，VAE 系统更易于训练。它们可以在没有标签的情况下自动发现数据集中图像的特征。低维潜在空间中的这些图像特征可以被调整以生成新图像。然而，VAE\
  \ 系统生成的假图像质量通常不如 GAN 生成的质量好。该问题源于基于逐元素误差的 VAE 重构损失函数，即公式 (5.3) 的第二部分。例如，如果一张 MNIST\
  \ 图像的像素向左水平平移一个像素，VAE 的重构损失值将会很大，但肉眼看来原始图像和平移后的图像没有区别。2016 年，Larsen 及其同事发表了一篇论文（Larsen\
  \ *et al* 2016），题为“利用学习到的相似度度量超越像素级自动编码”。通过 VAE 和 GAN 的混合，他们“用逐特征误差替代逐元素误差，以更好地捕捉数据分布，同时提供对平移等变换的不变性”。VAE-GAN\
  \ 系统是一种生成模型，它结合了两种流行的生成系统：VAE 系统和 GAN 系统。该系统的 VAE 组件用于学习数据集的紧凑、连续表示，而 GAN 组件用于生成新的合成数据实例。利用这两个系统的优势，VAE-GAN\
  \ 能够在生成高质量假图像的同时，学习数据集的紧凑、连续表示。这使得 VAE-GAN 在图像合成、无监督表征学习以及深度强化学习的数据生成等许多领域非常有用。\n\
  \n在图 5.5 所示的 VAE-GAN 系统中，有三个模型：编码器模型 `Q`、解码器模型 `P` 和判别器模型 `D`。前两个模型属于 VAE 系统。解码器同时也作为\
  \ GAN 系统的生成器，该 GAN 系统拥有判别器模型 `D`。数据加载器 `X` 中一个批次内的每张真实图像 (`x`) 都由编码器 `Q` 处理，在维度为\
  \ `z_dim` 的潜在空间中创建一个多元正态分布 `q(z|x)`。然后通过从这些多元正态分布中采样，生成一批潜在向量 (`Z`) 作为解码器 `P` 的输入，解码器\
  \ `P` 将这批潜在向量 `Z` 恢复为真实图像空间中的一批假图像 (`X̃`)，判别器模型 `D` 像往常一样将每张假图像压缩为范围 [0,1] 内的一个标量。这批真实图像也可以直接由模型\
  \ `D` 处理，如图 5.5 中最长的箭头所示。一批从多元标准正态分布 `N(0,I)` 中采样的噪声 (`Z_p`) 由 `P` 和 `D` 处理。模型 `D`\
  \ 的三个标量批次被用来配合 BCE 损失函数计算损失值 (`L_GAN`)\n\n```\nL_GAN = ln (D(X)) + ln (1−D(X̃))\
  \ + ln (1−D(X_p))\n```\n\n(5.5)\n\n\n\n\n\n# VAE-GAN 模型详解\n\n## 模型 D 的额外功能\n\nVAE-GAN\
  \ 的模型 D 比普通 GAN 的模型 D 多做一项工作。从模型 D 倒数第二层神经层，VAE-GAN 的模型 D 输出两批向量。每批向量中每个向量的维度可达数千。来自真实图像的一批向量（`V[X]`）和来自假图像的一批向量（`V[X̃]`）被用来替换\
  \ VAE 系统重构损失函数中的真实图像和假图像。根据 VAE-GAN 论文，这个修改后的重构损失函数名为 `L_like^(Dis[l])`，它是解码器损失函数的一部分，也是编码器损失函数的一部分。公式\
  \ (5.7) 中的 `L_prior` 是 `q(Z|X)` 与多元标准正态分布 `N(0,I)` 之间的 Kullback-Leibler 散度。\n\n\
  ```\nL_P = L_like^(Dis[l]) - L_GAN = MSELoss(V[X], V[X̃]) - L_GAN\n```\n(5.6)\n\n\
  ```\nL_Q = L_like^(Dis[l]) + L_prior = MSELoss(V[X], V[X̃]) + D_KL(q(Z|X) || p(Z))\n\
  ```\n(5.7)\n\n## 模型训练与损失函数平衡\n\n模型 D、P 和 Q 使用各自的损失函数进行训练。这三个模型的损失函数值不在同一量级，特别是当这些值通过每批求和计算时。许多人通过每批平均损失求和来计算三个损失函数的值，并使用\
  \ `L_P = γ L_like^(Dis[l]) - L_GAN` 和/或 `L_Q = 5 L_like^(Dis[l]) + L_prior` 来平衡这些损失值，其中\
  \ `γ = 15` 或 `25`。\n\n在后续的 VAE-GAN 项目中，损失函数值通过每批求和计算。由于 `L_GAN` 和 `L_prior` 的值与\
  \ `L_like^(Dis[l])` 相比非常小，`L_like^(Dis[l])` 前的超参数 `γ` 被设置为 `1.0`。潜在维度通过 `z_dim =\
  \ 2` 设置为 2，以便我们能在图 5.7(A) 中展示潜在空间。在模型训练期间，Cell 11 每五个 epoch 会输出一批真实图像和一批假图像，如图 5.6\
  \ 所示。\n\n## 图示说明\n\n### 图 5.5\n![Figure 5.5. A VAE-GAN's architecture and its information\
  \ flow chart with three models: an encoder Q, a decoder P and a discriminator D.\
  \ Each quadric curve represents a real sample (x) in a batch (X) of a dataloader.](img/bk978-0-7503-6244-3ch5f5_online.jpg)\n\
