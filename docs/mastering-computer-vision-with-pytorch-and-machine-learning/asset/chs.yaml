  \n---\n\n# 第 3 章\n\n## 使用 GAN 进行图像生成\n\n本章介绍如何使用生成对抗网络（GAN）和条件 GAN 生成与六个数据集（MNIST、Fashion\
  \ MNIST、Anime Face、CelebA 和 Rock Paper Scissors）中的图像相似的假图像。使用一个简单的二次曲线数据集，以便于理解\
  \ GAN 的数学原理。\n\n图像生成比图像分类更难。这对人类和计算机都是如此。自从 Ian Goodfellow 及其同事于 2014 年发表题为“生成对抗网络”的论文以来，许多基于\
  \ GAN 的算法被开发出来。如今，计算机可以被训练创建逼真的人脸照片。只需搜索“this person does not exist”，你就会找到一个网站，在那里可以看到令人惊叹的假人脸照片。GAN\
  \ 拥有两个神经网络或模型：一个生成器和一个判别器。生成器从纯噪声中创建假数据样本。判别器以假样本和真样本作为输入，并对它们进行评估以找出假样本。在模型训练期间，这两个网络相互竞争。生成器试图生成数据（图像）来欺骗判别器，而判别器设法正确识别出生成的数据。训练过程持续进行，直到生成器创建的数据如此逼真，以至于判别器无法将其与真实数据区分开来。在模型训练结束时，GAN\
  \ 可以找到数据集中图像像素的概率密度函数（PDF）。利用 PDF 的参数，计算机可以生成与真实图像相似的假图像。\n\n### 3.1 GAN 理论\n\n\
  一个 GAN 模型被用作生成器（G），它被训练从 1D 噪声向量生成假图像。噪声向量中的元素数量可以是 1、2，甚至超过 100。这些向量来自标准正态分布函数（第\
  \ 1.1.1 节）。模型 G 有许多待训练的参数（*θ*[*g*]inline-graphic style=\"height:1.25em;\" xlink:href=\"\
  bk978-0-7503-6244-3ch3ieqn1.gif\"/）。另一个模型被用作判别器（*D*），它被训练从数据集中区分假图像和真图像。它也有许多待训练的参数（*θ*[*d*]inline-graphic\
  \ style=\"height:1.125em;\" xlink:href=\"bk978-0-7503-6244-3ch3ieqn2.gif\"/）。模型\
  \ G 就像一名由他的老师列奥纳多·达·芬奇（即模型 D）教导绘画的美术学生。在观看了老师的许多杰作后，学生画出了他的第一幅画。老师告诉学生哪里画错了，以及如何提高技艺。学生接着画了第二幅画。老师再次检查画作并给出更多建议；这个过程重复多次。最终，学生能够画出另一幅《蒙娜丽莎》，没有人能说它是赝品。这是一个理想的结果。然而，如果学生不够聪明，无法理解大师的想法和建议，或者老师不是列奥纳多·达·芬奇，而只是一个普通人，会发生什么？在这两种情况下，训练都会失败。\n\
  \n\n\n\n# GAN 模型训练挑战\n\nGAN 模型训练仍然是一个挑战。GAN 模型训练的一个主要问题是“模式崩塌”。例如，你花费了 120 分钟训练模型以生成十个数字的\
  \ MNIST 图像，但输出结果只包含一个数字。这两个模型中有许多参数，你的代码中也有许多超参数。如何在短时间内调整它们以获得想要的结果？在面对这些模型训练挑战之前，我们需要为\
  \ GAN 构建训练机器。机器由四部分组成。第一部分用于数据输入，第二部分用于构建两个模型，第三部分用于模型训练，第四部分用于数据可视化。只有第二部分对我们来说是新的。\n\
  \n## 模型 D 和模型 G 的训练循环\n\n模型 D 和模型 G 在一个 for 循环中针对数据加载器中每一批真实图像（批量大小为 `m`）进行训练：\n\
  \n1.  从数据加载器中取出一批图像样本：`{x[1], x[2]…, x[m]}`。\n\n2.  使用模型 D 将 `x[i]` 转换为标量 `ŷ[i]\
  \ = D(x[i]) ∈ [0,1]`，(`i` = 1, 2…, `m`)。\n\n3.  将任意真实图像的目标设为 1：`y[i] = 1`，(`i` =\
  \ 1, 2, …, `m`)。\n\n4.  通过 `(-1/m) * Σ ln(D(x_i))` (i=1 到 m) 计算目标与预测之间的 BCE 损失。\n\
  \n5.  从标准正态分布生成一批噪声向量：`{z[1], z[2]…, z[m]}`。\n\n6.  从噪声向量创建一批假图像：`x̃[i] = G(z[i])`，(`i`\
  \ = 1, 2…, `m`)。\n\n7.  将任意假图像转换为标量 `D(x̃[i]) ∈ [0,1]` 作为假预测。\n\n8.  将每个假图像的目标设为\
  \ 0。\n\n9.  通过 `(-1/m) * Σ ln(1 - D(x̃_i))` (i=1 到 m) 计算 BCE 损失，**不更新模型 G**。\n\n\
  10. 计算模型 D 的损失：\n\n    ```\n    L_D(θ_d) = (-1/m) * Σ ln(D(x_i)) - (1/m) * Σ (1\
  \ - ln(D(x̃_i)))  (i=1 到 m)\n    ```\n\n    (3.1)\n\n    ```\n    L_D(θ_d) = -E[ln(D(X))]\
  \ - E[ln(1 - D(G(Z)))]\n    ```\n\n    ```\n    → -∫ p_r(x) ln[D(x)] dx - ∫ p_z(z)\
  \ ln[1 - D(G(z))] dz\n    ```\n\n    ```\n    → -∫ p_r(x) ln[D(x)] dx - ∫ p_g(x)\
  \ ln[1 - D(x)] dx\n    ```\n\n    ```\n    = -∫ (p_r(x) ln[D(x)] + p_g(x) ln[1 -\
  \ D(x)]) dx\n    ```\n\n    这是在给定生成器 `G` 的条件下判别器 `D` 的训练准则。在 `G` 给定的条件下，可以通过在固定\
  \ `x` 处令 `d/dD(x) (p_r(x) ln[D(x)] + p_g(x) ln[1 - D(x)]) = 0` 来找到一个优化的判别器 `D*`\
  \ 以最小化损失函数。找到的优化判别器 `D*` 为：`D_G*(x) = p_r(x) / (p_r(x) + p_g(x))`，此时我们有：\n\n   \
  \ ```\n    L_D(θ_d) = 2 ln(2) - 2 D_JS(p_r || p_g)\n    ```\n\n    根据公式 (1.8)：`0\
  \ ≤ D_JS(p_r | p_g ≤ ln(2))`，我们得到 `0 ≤ L_D(θ_d) ≤ 2 ln(2)`。当 `p_r = p_g` 时，模型 D\
  \ 的损失达到最大值：`2 ln(2)`。\n\n11. 更新 D 的参数 `θ_d` 而不改变 `θ_g`：`θ_d ← θ_d - η ∇[θ_d] L_D(θ_d)`。\n\
  \n12. 然后从正态分布中取新的一批噪声：`{z[1], z[2]…, z[m]}`。\n\n13. 从噪声创建新的一批假图像：`x̃[i] = G(z[i])`。\n\
  \n14. 将每个 `x̃[i]` 转换为标量 `D(x̃[i]) ∈ [0,1]` 作为真实预测。\n\n15. 将每个假图像的目标设为 1。\n\n16.\
  \ 计算 BCE 损失：\n\n    ```\n    L_G(θ_g) = (-1/m) * Σ ln(D(x̃_i))  (i=1 到 m)\n    ```\n\
  \n    (3.2)\n\n17. 更新 G 的参数：`θ_g ← θ_g - η ∇[θ_g] L_G(θ_g)`。\n\n#### 3.1.1 实现用于二次曲线生成的\
