- "## PyTorch 与机器学习计算机视觉高级指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n*本书献给我的妻子\
  \ Rongju Sun 和我的母亲 Fengying Yin。*\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n---\n\n###\
  \ 前言\n\n### 本书内容简介\n\n《Mastering Computer Vision with Pytorch and Machine Learning》（使用\
  \ PyTorch 和机器学习掌握计算机视觉）一书为从零开始使用 Python 和 PyTorch 掌握用于图像处理的高级计算机视觉技术提供了详尽且广泛的指南。计算机视觉是人工智能和计算机科学的一个领域，专注于使计算机能够解读和理解来自周围世界的视觉信息。计算机视觉和机器学习是紧密相关的领域。机器学习用于计算机视觉，以使计算机能够自动在大量图像和视频数据集中发现模式和关系。本书专注于实际应用，涵盖了诸如\
  \ Kullback-Leibler 散度、最大似然估计、卷积神经网络（`CNN`）、生成对抗网络（`GAN`）、Wasserstein 生成对抗网络（`WGAN`）、带梯度惩罚的\
  \ WGAN（`WGAN-GP`）、信息最大化生成对抗网络（`infoGAN`）、变分自编码器（`VAE`）等核心概念，以及它们在图像分类/图像生成中的应用。读者还将学习如何利用最新的计算机视觉技术，如用于目标检测的`Yolov8`、用于图像生成的稳定扩散模型、用于零样本目标检测的视觉变换器、用于神经网络压缩的知识蒸馏、用于自监督学习的`DINO`、分割一切模型（`SAM`），以及用于\
  \ 3D 场景合成的`NeRF`和 3D 高斯泼溅。本书是专业人士、研究人员和希望扩展其使用 PyTorch 的高级计算机视觉技术知识的学生的宝贵资源。通过清晰的解释、实际示例和真实用例，读者将学习如何将计算机视觉技术应用于图像分析任务，并培养构建和训练用于高级图像分析的自有模型所需的技能。无论您是初学者还是经验丰富的数据科学家，本书都将为您提供成功所需的知识和工具。\n\
  \n### 读者前置要求\n\n计算机视觉项目使用神经网络模型或视觉变换器作为数学函数来处理图像。这些函数的输出可能是用于图像分类的整数、用于图像生成的与训练数据集中图像相似的新图像，或用于目标检测的带有类别标识和概率的边界框。模型中的神经网络是按特定序列组织的数学算子。大规模计算机视觉模型可能拥有数十亿个参数，需要从训练数据集中学习。模型训练时间取决于输入数据的大小、Python\
  \ 代码以及处理数据的计算机硬件。本书面向具备矩阵计算线性代数知识和统计学基本概念的读者。有了这样的数学背景，读者即使不了解 Python——一种简单且功能强大、具有卓越机器学习功能的编程语言——也能编写代码。`Kaggle`和`Google\
  \ Colab`为拥有 Google 账户的任何人提供免费 GPU。在这两个免费的互联网平台上，强大的计算机硬件和软件随时可用。本书列出的大多数代码可以在任一平台上运行。读者无需购买昂贵的计算机。\n\
  \n鉴于`Kaggle`和`Google Colab`存在某些限制，最好拥有安装了以下开源软件的自己的计算机。首先是`Microsoft Visual Studio\
  \ Code`（`VS Code`）。它是微软提供的免费代码编辑器，适用于 Windows、Linux 和 macOS。它拥有许多用于编辑、调试和用多种编程语言开发代码的功能和扩展。由于其易用性、可定制性和社区驱动的开发模式，它是各种技能水平人群的热门选择。在`VS\
  \ Code`终端中，我们可以安装许多扩展，例如`Python`、`Jupyter notebook`、`PyTorch`、`Torchvision`、`NumPy`、`Pandas`、`Matplotlib`、`OpenCV`、`tqdm`等。计算机科学的发展日新月异。我们需要在`VS\
  \ Code`中拥有多个虚拟工作区，以适配不同版本的 Python 和其他库。本书中的大多数代码可以在 Python v3.6 下运行，而最后六章中的许多代码必须在\
  \ Python v3.9 至 v3.11 下运行，以支持最新的计算机视觉技术，如`Ultralytics Yolov7`至`Yolov9`、Hugging Face\
  \ 零样本目标检测、Facebook `DINO`和`SAM`。\n\n### 本书结构\n\n\n\n\n\n### 使用 PyTorch 和机器学习掌握计算机视觉\n\
  \n## 书籍概览\n\n本书共包含十二章。\n\n**第 1 章** 介绍了计算机视觉和机器学习的数学概念与工具：概率、最大似然、香农熵、梯度、激活函数、损失函数、数据集、数据加载器、学习率等。本章以九组摄氏度和华氏度温度转换的数值对为例，跨不同项目逐步引入这些数学概念。\n\
  \n**第 2 章** 介绍了用于三个数据集图像分类的深度卷积神经网络：`MNIST`、`CIFAR10` 和 `Vegetable Images`。这些是监督学习项目，模型基于带标签的训练数据学习进行预测。\n\
  \n**第 3–6 章** 涵盖了使用不同算法进行图像生成：`GANs`、`VAEs`、`WGANs` 和 `infoGANs`。利用条件 `GANs`、`infoGANs`、`VAEs`\
  \ 或 `VAE-GANs`，我们可以生成具有特定风格的目标图像。`VAEs` 和 `infoGANs` 用于无监督学习项目。无监督学习的主要优势在于，它无需任何先验知识或带标签数据，即可发掘数据中隐藏的模式和结构。\n\
  \n**代码结构**：本书所列所有项目的代码均遵循相同的四部分风格：\n1. 数据输入\n2. 数据显示\n3. 数据处理\n4. 输出数据可视化\n\n**第\
  \ 2–9 章** 使用一个用于二次曲线生成的简单数据集，帮助读理理解新模型中的复杂算法。在许多项目中，读者只需关注第三部分（模型构建与数据处理）。\n\n**第\
  \ 7–12 章** 介绍了最新的计算机视觉技术（截至 2024 年 2 月），用于图像分类、图像生成、目标检测、目标分割和 3D 场景合成。Ultralytics\
  \ 的 `YOLOv8` 是目标检测和分割的最新技术之一；它易于安装和使用，可用于图像分析任务。OpenAI、Hugging Face、Meta AI 和智能系统实验室提供了用于图像分析的新工具。借助它们的库，我们只需编写几行代码，即可生成逼真图像、检测/分割/分类物体、检索图像，并估计图像相对深度，而无需模型训练（零样本）。最后一章介绍了使用\
  \ `NeRF` 或 `3D Gaussian Splatting` 进行 3D 场景合成。许多详细的数学推导和额外的项目代码可在附录中找到。\n\n## 关键词\n\
  \n计算机视觉、机器学习、Kullback-Leibler 散度、最大似然、PyTorch、CNN、GAN、WGAN、WGAN-GP、infoGAN、VAE、图像分类、目标检测、图像分割、图像生成、图像检索、YOLO、U-Net、Stable\
  \ Diffusion、零样本、ViT、知识蒸馏、DINO、SAM、fastSAM、MiDaS、NeRF、3D 场景和 3D 高斯泼溅。\n\n---\n\n\
