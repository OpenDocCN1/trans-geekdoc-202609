  \n### 11.3 DINOv2 用于图像检索、分类与特征可视化\n\n2023 年 4 月，Meta AI 发布了四个预训练的 DINOv2 模型：一个从头训练的\
  \ ViT-g 模型，以及三个从 ViT-g 蒸馏出的模型（ViT-s、ViT-b、ViT-l）。一个大规模、精心策划、多样化的数据集 (LVD-142M) 被用于根据一篇论文（Oquab\
  \ *et al* 2023）中描述的方法训练这些模型：“DINOv2: Learning Robust Visual Features without Supervision”（DINOv2：无监督学习鲁棒视觉特征）。与依赖标注数据或人工标题来解读图像含义的其他预训练模型不同，DINOv2\
  \ 可以从任何图像数据集中学习，而无需配套的元数据。通过避免关键背景信息的遗漏，DINOv2 能够全面掌握图像细节，直至像素级别。DINOv2 的突出之处在于消除了微调的需求。其输出的高性能特征可直接搭配简单的线性层等分类器，用于各种计算机视觉任务。每个\
  \ DINOv2 模型接收一张图像作为输入，并返回一个类 token 和补丁 token。DINOv2 模型可用于图像分类、图像分割、图像检索、目标检测和目标深度估计。\n\
  \n利用一个名为 `dinov2_vits14` 的预训练小型 DINOv2 模型，项目 11.3.1 中的代码可以在第 9 章使用的花卉数据集中检索花卉图像。从项目的输出中，你会发现寥寥数语的标题不足以描述一张照片，因为“一图胜千言”。Cell\
  \ 04 的代码从批次大小为六的训练数据加载器中输出一批花卉图像（图 11.4(A)）。通过在 Cell 06 中选择一个 0 到 5 之间的整数 (`n`)，我们可以选取一张特定类别的花卉图像作为查询图像，随后项目的其余代码将从验证数据集中挑选出六张花卉图像。检索到的花卉与查询花卉应为同一类别。在图\
  \ 11.4(A) 中，`n` = 1 和 5 处有两张蒲公英图像。使用这两个位置中任意一张图像作为查询图像，我们得到了图 11.4(B) 和 (C)。预训练的\
  \ DINOv2 模型能够区分不同生命阶段的蒲公英图像：黄色花朵和白色种子。一个英文单词“dandelion”（蒲公英）不足以区分它们。\n\n![](img/bk978-0-7503-6244-3ch11uf6_pr.gif)\n\
  \n![图 11.4. 小型预训练 DINOv2 模型进行图像实例检索。(A) 花卉数据集训练数据加载器中的一批图像。(B) 使用查询图像 (n=1) 检索到的图像。(C)\
  \ 使用查询图像 (n=5) 检索到的图像。所有检索到的图像均在验证数据集中。第一行图像经许可 CC0 1.0 从花卉数据集复制。](img/bk978-0-7503-6244-3ch11f4_online.jpg)\n\
  \n**图 11.4.** 小型预训练 DINOv2 模型进行图像实例检索。(A) 花卉数据集训练数据加载器中的一批图像。(B) 使用查询图像 (`n`=1)\
  \ 检索到的图像。(C) 使用查询图像 (`n`=5) 检索到的图像。所有检索到的图像均在验证数据集中。第一行图像经许可 CC0 1.0 从 [花卉数据集](https://www.kaggle.com/datasets/imsparsh/flowers-dataset)\
  \ 复制。\n\n\n\n\n首次运行单元格 01 中的代码时，小型预训练 DINOv2 模型将自动从 Facebook 下载。文件大小约为 21 MB。大型\
  \ DINOv2 模型的大小约为 300 MB。单元格 06 中的代码处理验证数据集中的每张图像，以获取一个包含 384 个元素的一维张量，用于表示图像的详细物体信息。该单元格输出张量的形状为\
  \ 701 × 384，因为验证数据集中有 701 张图像。我们使用单元格 06 选择一张查询图像，然后使用模型提取图像特征。使用 Facebook 库 `faiss`（Johnson\
  \ *et al* 2019）进行图像相似性搜索。根据 `faiss` GitHub 仓库的介绍，它假设图像特征向量可以通过 L2（欧几里得）距离或点积进行比较。与查询向量相似的向量是指那些与查询向量具有最低\
  \ L2 距离或最高点积的向量。单元格 07 的输出是一个包含批次大小个元素的列表。每个元素是一个整数，代表验证数据集中检索到的图像的位置索引（<701）。然后由单元格\
  \ 08 中的代码显示检索到的图像。本节中三个小型 DINOv2 项目的代码受到 Purnasai Gudikandula 的 GitHub 仓库代码的启发。在我的\
  \ Python 和 PyTorch 更新后，我遇到了来自 FAISS 库的一个问题。项目 11.3.1 的改进版本列在附录 J 中，其中直接计算欧几里得距离，而不使用第三方库。\n\
  \n由于 DINOv2 模型非常强大，能够在没有人工指令的情况下学习图像特征，我们可以使用这些模型进行图像分类，代码列在项目 11.3.2 中。为了节省空间，我复用了项目\
  \ 9.3.2 中的单元格 02–04 用于花卉图像数据集，以及项目 2.3 中的单元格 06–09 用于不带学习率调度器的模型训练。分类模型的类在单元格 05\
  \ 中定义。模型的主干网络是预训练的大型 DINOv2 模型。两个全连接层被附加到 DINOv2 模型后用于图像分类。在不到 8 分钟的五轮模型训练中，训练数据集和验证数据集的图像分类准确率分别达到\
  \ 99.5% 和 95.5%。\n\n![](img/bk978-0-7503-6244-3ch11uf7_pr.gif)\n\nDINOv2 模型可以提取用于图像检索和图像分类的图像特征。我们可以在项目\
  \ 11.3.3 中使用数学工具 PCA（主成分分析）来可视化高维特征。项目中使用了预训练的大型 DINOv2 模型 `dinov2_vitl14`，该项目对一张包含四只鹿的彩色图像的输出结果如图\
  \ 11.5 所示。图像的原始尺寸为 800 × 533 × 3。单元格 02 中定义的一个变换函数处理原始图像，得到一个分辨率为 1 × 3 × 518 ×\
  \ 518 的张量。使用大小为 14 的补丁，模型将图像分割成 1369 个（=518/14 × 37）补丁，嵌入维度为 1024。模型的输出为一个类别标记和\
  \ 1369 个补丁标记。在单元格 02 中使用 `model.forward_features(img_transformed)` 而非 `model(img_transformed)`，我们获得一个包含四个键的字典，但项目中仅使用其中一个键的值作为图像的张量\
  \ `batch_total_features`，该张量的形状为 1 × 1369 × 1024。使用 PCA，单元格 03 中的代码将形状为 1369 × 1024\
  \ 的 `total_features` 张量降维，得到形状为 1369 × 3 的 `pca_features` NumPy 数组。仅 `pca_features`\
  \ 数组的第零通道被归一化并由单元格 04 显示。为了节省空间，我将第一张 PCA 图像叠加在图 11.5 所示原始照片的左上角。\n\n![](img/bk978-0-7503-6244-3ch11uf8_pr.gif)\n\
  \n![图 11.5. 使用 PCA 对预训练 DINOv2 模型的输出进行图像特征可视化。](img/bk978-0-7503-6244-3ch11f5_online.jpg)\n\
  \n**图 11.5.** 使用 PCA 对预训练 DINOv2 模型的输出进行图像特征可视化。\n\n第一张 PCA 图像的像素值如灰度图的灰度条所示，在 0.0\
  \ 到 1.0 之间。背景比前景（鹿）更亮。单元格 05 中的代码使用 0.35 的阈值将灰度图转换为如图 11.5 右上角所示的黑白图像。我们将该黑白图像命名为“背景”。背景图像中每个白色像素的值等于\
  \ 1，每个深色像素的值等于 0。我们使用单元格 06 反转背景图像，并将新图像命名为“前景”。前景图像显示在图 11.5 的左下角。\n\n单元格 06 中重塑前景图像之前的\
  \ NumPy 数组 `pca_features_fg` 是一个包含 1369 个元素的一维数组。打印该数组的求和值，你会发现它等于 580。这意味着一维数组中有\
  \ 580 个“true”值。`total_features` 张量的形状为 1369 × 1024。单元格 07 第一行的代码使用 `pca_features_fg`\
  \ 来掩码 `total_features`。结果得到一个形状为 580 × 1024 的数组 `f_features0`。从张量 `total_features`\
  \ 中选取某一行的标准是：利用该行的索引，我们应该在一维数组 `pca_features_fg` 中找到“true”。然后我们使用第二个 PCA 变换器获得一个形状为\
  \ 580 × 3 的数组 `f_features`。该数组随后由单元格 07 第 03 行开始的三行代码进行线性归一化。\n\n单元格 07 第 06 行的数组\
  \ `attention_rgb` 是第一个 PCA 变换器输出的数组 `pca_features` 的副本，并由背景图像的一维数组进行掩码。然后将归一化后的第二个\
  \ PCA 输出赋值给数组 `attention_rgb`，并作为彩色图像显示在图 11.5 的右下角。你可以看到鹿头显示为绿色，脖子为橙色，脚为蓝色，身体为粉色。DINOv2\
  \ 模型不仅能检测物体，还能区分每个物体的组成部分。\n\n### 11.4 分割一切模型：SAM 和 FastSAM\n\n\n\n有使用 Photoshop\
  \ 去除图像背景经验的人，对于一个新工具的出现会感到非常高兴：即“分割一切模型”（Segment Anything Model，SAM），该模型由 Meta AI\
  \ 于 2023 年 4 月 15 日发布。不具备任何计算机代码知识的用户可以将照片上传到 Meta 的 SAM 网站，并使用鼠标在照片上点击或绘制方框。用户通过这些鼠标提示选择照片上的物体，只需几毫秒即可将其从照片中分割出来，并将这些物体的像素与照片背景分离。随后，人们可以利用这些物体的像素来编辑图像和分析照片。图\
  \ 11.6(A) 显示了一张母鹿站在我花园积雪覆盖的地面上的照片。该照片通过项目 11.4.1 的 Cell 01 中的代码，加载模型和来自检查点文件 `sam_vit_h_4b8939.pth`\
  \ 的预训练参数，被分割成了 74 个物体。由于该文件大小超过 2.5 GB，我笔记本电脑的 6 GB GPU 显存不足以运行需要 8 GB 显存的代码。幸运的是，我可以在\
  \ CPU 上运行代码，但代码运行时间约为 130 秒。借助 Google Colab 的免费 GPU，代码运行时间约为 4 秒。虽然我可以用较小的检查点文件\
  \ `sam_vit_b_01ec64.pth`（0.37 GB）在笔记本电脑的 GPU 上运行代码，但代码输出结果很糟糕。SAM GitHub 网站上最大的检查点文件是\
  \ `sam_vit_l_0b3195.pth`。我结合我的代码尝试了它，与中等大小的文件相比，没有看到显著的质量提升。我的代码受 Piotr Skalski\
  \ 的 Colab 代码启发，其中使用了 Roboflow supervision 模块（版本 ⩾ 5.0）来显示 SAM 掩膜（图 11.6(B)）。\n\n\
  ![](img/bk978-0-7503-6244-3ch11uf9_pr.gif)\n\n![Figure 11.6. (A) Original image.\
  \ (B) Panoramic segmentation by SAM. (C) Objection detection by OWL-ViT.](img/bk978-0-7503-6244-3ch11f6_online.jpg)\n\
  \n**Figure 11.6.** (A) 原始图像。(B) SAM 全景分割。(C) OWL-ViT 目标检测。\n\nCell 01 最后一行 SAM 掩膜生成器的输出是一个列表，列表中的每个元素都是一个物体的字典。Cell\
  \ 02 前两行的代码打印出从图像中分割出的物体数量，每个物体的字典键包括：`segmentation`、`area`、`bbox`、`predicted_iou`、`point_coords`、`stability_score`、`crop_box`。`segmentation`\
  \ 键对应一个 SAM 分割掩膜，掩膜的形状即原始图像的分辨率：480 × 480。`point_coords` 和 `crop_box` 这两个键是用户设置的鼠标提示。由于我们在\
  \ Cell 01 中将 SAM 设置为使用自动掩膜生成器，这两个键的值由模型自动设置。`stability_score` 键用于将物体从背景中分离出来。我们可以通过\
  \ Cell 02 最后一行的代码，以网格大小 (9, 8) 显示 72 个掩膜。你会看到许多掩膜对应同一个物体，图像上许多无意义的阴影斑点也被分割为物体。Cell\
  \ 02 中的代码按面积对掩膜进行逆序排序，并仅将前六个掩膜作为黑白图像显示。Cell 03 中的代码显示原始图像和仅包含三个主要掩膜的处理后图像。鹿和雪从背景中分离出来。Cell\
  \ 04 中的代码使用主要掩膜 `masks[0]` 将鹿从背景中提取出来。\n\nSAM 不具备目标检测功能。通过将 Cell 04 的输出图像输入到项目 8.4.2\
  \ 中，我们可以使用 YOLOv8 检测图像中的物体：结果为置信度 79% 的“牛”。这是错误的，因为 YOLOv8 使用 COCO 数据集的类别来识别物体，但\
  \ COCO 数据集中没有“鹿”这一类别。随后，我使用项目 10.4 中的代码，通过 Owl-ViT 零样本目标检测来分析该图像。在项目 10.4 的 Cell\
  \ 01 类别列表中添加 `deer` 项后，Owl-ViT 程序能够在图像中找到鹿，如图 11.6(C) 所示。SAM 模型本身没有什么特别之处（Kirillov\
  \ *et al* 2023），仅包含一个作为图像编码器的 ViT、一个用于点、框和文本的提示编码器，以及一个掩膜解码器。Meta AI 使用 1100 万张图像和\
  \ 10 亿个掩膜训练了 SAM 模型。人们说，Meta AI 的 SAM 对世界的影响将如同 Open AI 的 ChatGPT 一样深远。\n\nMeta\
  \ AI 提出的 SAM 正成为许多计算机视觉任务的基础，例如图像分割、图像描述和图像编辑。然而，SAM 需要大量的计算资源，因为 SAM 的架构基于第 10.1\
  \ 节提到的视觉变换器。Xu Zhao 及其合作者于 2023 年 6 月提出了基于 YOLOv8 的 FastSAM（Zhao *et al* 2023）。使用\
  \ FastSAM，他们在运行速度提高 50 倍的情况下，实现了与 SAM 方法相当的性能。他们在 [GitHub 网站](https://github.com/CASIA-IVA-Lab/FastSAM)\
  \ 发布了代码。根据他们的说明，我在名为 `Exercises` 的当前工作文件夹中，下载并解压了他们的代码到一个名为 `FastSAM` 的文件夹内，环境为带有\
  \ Python v3.9 的 VS Code 虚拟环境。在一个 VS Code 单元格中，运行带引号的代码 `'import os; os.getcwd();\
  \ %cd fastsam'`，我可以运行项目 11.4.2 中的代码，这些代码使用了 FastSAM 文件夹中的一些 Python 文件。通过这些设置，我们可以使用\
  \ Cell 01 第 03 行的代码导入一些库：`from fastsam import FastSAM, FastSAMPrompt`。\n\n![](img/bk978-0-7503-6244-3ch11uf10_pr.gif)\n\
  \n原始的 FastSAMPrompt 库仅接受图像文件名路径字符串作为图像源。要将 FastSAM 用于相机帧，我们必须修改 `FastSAM/fastsam/prompt.py`\
  \ 第 23 到 27 行的代码，以便 NumPy 数组可以作为图像源供 FastSAMPrompt 库使用。我从 Nicolai Nielsen 的 [YouTube\
  \ 视频](https://www.youtube.com/watch?v=SslzS0AsiAw) 中找到了这个解决方案。Roboflow 也有一个关于 FastSAM\
  \ 的有用 YouTube 视频。在 Cell 02 中，第 06-08 行被禁用的代码分别用于框提示、点提示和文本提示。它们可以工作，但结果可能不是我们预期的。例如，使用文本提示\
  \ `lady` 时，图 11.7 的图像中只分割出了一位女士。重复使用 Cell 05 和 07 中的代码并将 `yolov3` 替换为 `fastsam`，我们可以使用\
  \ Cell 02 中定义的函数处理文件夹中的图像、相机帧或视频文件。视频速度约为 3 FPS。虽然 FastSAM 的图像分割质量不如 SAM，但我们必须为了速度牺牲一点质量。\n\
  \n![](img/bk978-0-7503-6244-3ch11uf11_pr.gif)\n\n![Figure 11.7. Implement of a pre-trained\
  \ FastSAM model to a single image with a prompt for everything. (left) The original\
  \ image with bounding boxes from the model. (right) Objects of the image were segmented\
  \ by the model, and each object with a blue edge was marked with different colors.](img/bk978-0-7503-6244-3ch11f7_online.jpg)\n\
