  \ WGAN-GP。如果在 Cell 08 中移除第 04、05 和 12 行前的井号符号 `#`，并在同一 Cell 的第 10 和 11 行前添加 `#`\
  \ 符号，则代码将修改为 WGAN 版本。\n\n图 4.1 展示了项目的输出。可以看到，使用 RMSprop 优化器的 WGAN-GP 生成的假曲线质量更好。\n\
