  \n# Caide Xiao\n\n***\n\n# 第 11 章\n\n## 知识蒸馏及其在 DINO 和 SAM 中的应用\n\n2023 年，Facebook\
  \ 发布了许多基于视觉 Transformer 的计算机视觉模型。尽管它们非常强大，但体积过大，不适合在资源/功率受限的设备上实时使用。知识蒸馏被用于将预训练的巨型模型的智能迁移到小型模型中。第\
  \ 11.1 节演示了第 2 章中使用的从`ResNet9`到`ResNet6`的知识蒸馏。第 11.2 至 4 节的示例展示了 Facebook 的`DINO`、`DINOv2`和`SAM`模型在自监督学习中寻找图像或视频帧中目标特征的智能。由于`SAM`需要\
  \ 8 GB GPU 显存，我不得不在 CPU 上运行它，速度非常慢。来自中国的`fastSAM`模型使我们能够以比`SAM`快 50 倍的速度分割任何物体。\n\
  \n### 11.1 用于神经网络压缩的知识蒸馏\n\n根据摩尔定律，集成电路（IC）芯片中的晶体管数量大约每两年翻一番。这使得更快的处理器、更大的内存容量以及各种计算设备性能的提升成为可能。计算机视觉项目和机器学习项目中神经网络的参数数量也显著增加，以构建更强大、功能更丰富的模型。在线性回归模型（项目\
  \ 1.3.1）中，只有两个参数；在关于用于图像分类的基础视觉 Transformer 模型的项目 10.1.1 中，有 14,443,018 个参数。ChatGPT\
  \ 模型（基于 GPT 3.5）拥有 1750 亿个参数。然而，随着模型参数量从百万级增加到十亿级，模型训练和部署的计算成本将更加高昂。随着智能手机、智能手表等各类智能移动设备的兴起，我们需要一个小型神经网络模型（学生模型）来具备巨型模型（教师模型）的功能。知识蒸馏（Hinton\
  \ *et al* 2015）是指一种机器学习技术，教师模型在学生模型的训练过程中通过使用“软目标”将其知识迁移给学生模型。知识蒸馏的目标是将大型模型包含的知识压缩到可部署在资源受限设备上的较小模型中。知识蒸馏已成功应用于计算机视觉、自然语言处理和语音识别等许多领域。它是一种流行的模型压缩和迁移学习技术，允许将大型模型的知识迁移到可用于实际应用的较小模型中。\n\
  \n软目标是教师模型的输出。来自项目 2.3 的预训练`ResNet9`模型（用于 CIFAR10 图像分类）被保存为教师模型，用于以下项目 11.1。其对训练集、验证集和测试集中图像的分类预测准确率分别为\
  \ 99.5%、92.6%和 92.3%。从项目 2.3 的单元格 10 可以看到，训练好的`ResNet9`对测试数据加载器中仅一张图像的一个批次的输出`y_hat`为`[[−103.4488,\
  \ −113.6267, −95.8173, −90.3314, −70.0091, −96.2804, −94.8856, −100.3270, −113.8334,\
  \ −108.6170]]`。`y_hat`中的 10 个元素中的每一个都是一个 logit ![image](img/bk978-0-7503-6244-3ch11ieqn1.gif)，它在温度`T`下为预训练教师模型产生一个软目标概率`p[i]`，其中`i`\
  \ =0,1…,9\n\n$$p\\_{i} = \\\\frac{e^{v\\_{i}/T}}{\\\\sum\\\\limits\\_{j = 1}^{C}e^{v\\\
  _{j}/T}}$$  \n\n(11.1)graphic style=\"width:38.8125em;\" xlink:href=\"bk978-0-7503-6244-3ch11eqn2.gif\"\
  \ position=\"float\"/\n\n\n\n第 2.2 节中的修改版 `ResNet6` 模型将在项目 11.1 中作为学生模型使用。在项目 2.3\
  \ 中用修改版 `ResNet6` 替换 `ResNet9`，你会发现训练集、验证集和测试集的预测准确率分别为 95.9%、88.4% 和 88.4%。修改版\
  \ `ResNet6` 应用于单张图像批次所产生的输出 `z` 也会在温度 `T` 下产生概率 `q`。通常，温度值被设置为等于 1。我们将使用更高的 `T`\
  \ 值来产生更平滑的类别概率分布：\n\n$$\nq_{i} = \\frac{e^{z_{i}/T}}{\\sum\\limits_{j = 1}^{C}e^{z_{j}/T}}\n\
  $$\n\n(11.2)\n\n然后，学生模型使用一个包含硬损失和软损失的损失函数进行训练。硬损失是关于学生模型在 `T`=1 时的预测概率与训练数据加载器标签之间的交叉熵。软损失是关于\
  \ `p` 和 `q` 在高温下的交叉熵：$L_{soft} = - \\sum\\limits_{j = 1}^{C}p_{j}{\\log}{(q_{j})}$。利用一些近似（Hinton\
  \ *et al* 2015），学生模型每个 logit `z[i]` 关于软交叉熵梯度 $\\partial L[soft]/\\partial z[i]$\
  \ 可以简化为：\n\n$$\n\\frac{\\partial L_{soft}}{\\partial z_{i}} = \\frac{1}{T}(q_{i}\
  \ - p_{i}) \\approx \\frac{1}{NT^{2}}\\left( {z_{i} - v_{i}} \\right)\n$$\n\n(11.3)\n\
  \n在高温下，蒸馏等价于最小化 $0.5(z_{i} - v_{i})²$。由于软目标产生的梯度幅度与 $1/T²$ 成正比，因此在同时使用硬目标和软目标训练学生模型时，将它们乘以\
  \ $T²$ 非常重要。根据公式 (1.7)，我们有 $L[soft] = DKL + H(p)$。因为香农熵 $H(p)$ 对 `z` 是常数，我们将使用 $L[soft]\
  \ = T² DKL$ 来训练学生模型。有一个用于 $DKL$ 计算的 PyTorch 类 `nn.KLDivLoss`。我们如何选择 `T` 的值？得到公式\
  \ (11.3) 的一种近似是在条件 $|z[i]| \\ll T$ 下 $e^{(z[i]/T)} \\approx 1 + z[i]/T$。我们可以发现 `ResNet9`\
  \ 或 `ResNet6` 中 `y_hat` 的绝对元素值约为 100，所以我们设置 `T`=10 000。有了上述信息，我们就可以为项目 11.1 编写代码。运行代码将知识从预训练的\
  \ `ResNet9` 迁移到 `ResNet6` 后，我们得到训练集、验证集和测试集的预测准确率分别为 94.3%、90.1% 和 90.2%。知识蒸馏使 `ResNet6`\
  \ 模型在验证集和测试集上的预测准确率提高了约 2%。然而，使用 `T` = 100 训练学生模型，我发现结果与图 11.1 中 `T` = 10 000 显示的结果几乎相同。\n\
  \n![](img/bk978-0-7503-6244-3ch11uf1a_pr.gif)\n![](img/bk978-0-7503-6244-3ch11uf1b_pr.gif)\n\
  ![](img/bk978-0-7503-6244-3ch11uf2a_pr.gif)\n![](img/bk978-0-7503-6244-3ch11uf2b_pr.gif)\n\
  ![](img/bk978-0-7503-6244-3ch11uf3_pr.gif)\n\n![图 11.1. 从 ResNet9 到 ResNet6 的知识蒸馏模型训练结果。](img/bk978-0-7503-6244-3ch11f1_online.jpg)\n\
  \n**图 11.1.** 从 ResNet9 到 ResNet6 的知识蒸馏模型训练结果。\n\n### 11.2 DINO：自监督视觉 Transformer\
  \ 中的涌现特性\n\n尽管第 10.2 节中使用 `ViT` 模型在 CIFAR10 上的图像分类结果与第 2.3 节中 `CNN` 模型的结果相比已经足够好，但并无优势，因为\
  \ `ViT` 模型训练的计算开销很大。要使用 `ViT` 模型进行数据处理，我们必须将每张 CIFAR10 图像从 32 × 32 调整为 224 × 224。个人笔记本电脑几乎无法处理\
  \ `ViT` 模型训练的计算任务。我们不得不为项目 10.2 使用预训练的 Hugging Face `ViT` 模型。\n\n项目 10.1.1 的 Cell\
  \ 05 中的多头自注意力类返回一个包含两个元素的元组。一个是“注意力输出”，另一个是“注意力概率”。对于图像分类，我们只使用第一个。利用第二个，Mathilde\
  \ Caron（Caron *et al* 2021）及其在 Facebook 的合作者发现了视觉 Transformer 的一个独特特性：自监督学习。要在第\
  \ 8 章中训练用于目标检测和图像分割的 `YOLOv8` 模型，我们必须使用带标签的数据集。传统的监督学习方法需要大量带标签的数据，获取这些数据既昂贵又耗时。相比之下，自监督学习旨在通过在无标签数据上解决预文本任务来学习表征。由于其能够利用大量免费可用的无标签数据，这种方法近年来受到关注。\n\
  \nDINO 代表“自蒸馏无标签”，是一种专注于视觉 Transformer 自监督学习的方法。DINO 模型能够在没有监督且未给定任何分割目标对象的情况下，发现并分割图像或视频帧上的物体。这意味着这类模型具备更高层次的图像理解能力。DINO\
  \ 技术基于教师模型和学生模型之间的知识蒸馏。两个模型都使用相同的 `ViT` 模型，但参数不同，且各自以不同的方式训练。输入 DINO 系统的任何图像都会被裁剪成两个全局块和八个局部块。全局和局部裁剪的尺度分别高于\
  \ 40% 和低于 40%。全局块调整为 224 × 224，局部块调整为 96 × 96。所有块都由学生模型处理，但只有两个全局块输入教师模型。图 11.2(A)\
  \ 显示了一张原始图像，其中有一只兔子在抓下巴。图中还展示了两个全局块和八个局部块。这些块是通过项目 11.2.1 中的代码获得的。Cell 02 中定义的一个类来自\
  \ Facebook 的 DINO GitHub 仓库。在该类的归一化变换中，为了简化，未使用 Facebook 的特殊数值。\n\n![](img/bk978-0-7503-6244-3ch11uf4_pr.gif)\n\
  \n![图 11.2. 一张原始图像 (A) 被裁剪并调整大小为两个全局块 (B) 和八个局部块 (C)，用于 DINO 模型训练。](img/bk978-0-7503-6244-3ch11f2_online.jpg)\n\
  \n\n\n\n## 图 11.2\n\n一张原始图像 (A) 被裁剪并调整大小，变为两个全局补丁 (B) 和八个局部补丁 (C)，用于 DINO 模型训练。\n\
  \n没有必要在此复制粘贴 Facebook 的 DINO 代码，而且我的笔记本电脑也无法训练任何 DINO 模型。GitHub 和 YouTube 上有许多资源可以解释\
  \ DINO。我必须使用一个预训练的 Facebook DINO ViT 模型来演示 DINO 的强大功能。项目 11.2.2 的 Cell 01 中列出了五个预训练的\
  \ Facebook DINO 模型。项目中使用的模型名称为 `facebook/dino-vits8`，其中 `s` 表示小型模型，8 为补丁大小。如果图像分辨率为\
  \ 480 × 480，则该图像会被分割并嵌入为 (480/8)²+1 个 token，供类似第 10.1 节中的 ViT 模型使用，这与那些全局和局部补丁是不同的。为了理解项目\
  \ 11.2.2 中代码的工作原理，我们需要通过 `print(model.config)` 打印出 DINO 中的 ViT 参数。DINO ViT 中有 12\
  \ 个编码器层，每层包含六个自注意力模块。DINO ViT 的最后一层输出 3601 个 token 和一个 `attentions` 张量，该张量对于项目 11.2.2\
  \ Cell 02 中批次大小为 1 的图像而言，形状为 1 × 6 × 3601 × 3601。`attentions` 张量的形状由项目 10.1.1 Cell\
  \ 05 的第二个输出决定，其运算为 $\\text{softmax}\\left( {Q \\cdot K^{T}/\\sqrt{D}} \\right)$。我们在后续的\
  \ Cell 02 中使用由 `attentions[0, :, 0, 1:]` 选取的与 `[cls]` token 相关的注意力分数。形状为 6 × 3600\
  \ 的选取注意力分数张量随后在 Cell 03 中被重塑为 6 × 60 × 60 并插值为 6 × 480 × 480。接着，我们可以绘制图 11.3 中展示的六张黑白图像。每张黑白图像的分辨率为\
  \ 480 × 480。从六张图像中的亮点可以看出，不同的自注意力头关注图像中的不同物体。\n\n![](img/bk978-0-7503-6244-3ch11uf20_pr.gif)\n\
