  \ 和一个测试 dataloader。它们的样本数量分别为 560、80 和 52。Cell 04 中的代码用于显示 dataloader 中的部分图像。Cell\
  \ 03 中定义的名为 `grid2bboxes` 的函数提取图像编码网格单元的信息，作为边界框的参数。\n\n![](img/bk978-0-7503-6244-3ch7uf7_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch7uf8_pr.gif)\n\n### 7.3 ResNet18 模型、IOU 与损失函数\n\n\
  #### 7.3.1 使用 ResNet18 替代 YOLOv1 模型\n\nYOLOv1 模型并无“超能力”，它只是一个由 24 个卷积层后接两个全连接层组成的线性\
  \ CNN 模型。2022 年 7 月，我们有了 YOLOv7 模型（Wang *et al* 2022）。2023 年 1 月，Ultralytics 发布了更强大的\
  \ YOLOv8 模型。简单的 YOLOv1 仍有助于我们理解 YOLO 算法。原始 YOLOv1 模型未使用批量归一化，因为批量归一化（Ioffe and Szegedy\
  \ 2015）比 YOLOv1 晚发明了一年。在 Aladdin Persson 的 GitHub 中，原始 YOLOv1 模型通过在每次卷积操作后添加批量归一化进行了修改。然而，修改后的\
  \ YOLOv1 在我的笔记本电脑上对于 Pascal VOC 数据集仍不够强大，因此使用预训练的 ResNet18（第 2.4 节）作为 Chess 数据集的模型。在\
  \ Cell 05 的第一行，从 `torchvision` 的 `models` 中导入了预训练的 ResNet18 模型。随后将 ResNet18 最后一个全连接层的输出变量数量从\
  \ 1000 改为 1127（= 7 × 7 × 23），用于每个 7 × 7 网格单元中 23 个立方体的预测值。我在模型训练的前 100 个 epoch 中仅使用了预训练的\
  \ ResNet18 模型。前 100 个 epoch 训练结束时，我将训练好的模型保存到名为 `Chess-Yolo-01.pth` 的文件中，并将第 9 行的\
  \ `'''inline-graphic style=\"height:0.5em;\" xlink:href=\"bk978-0-7503-6244-3ch7ieqn5.gif\"\
  /'` 符号移至第 1 行前面。这样我就可以在接下来的 100 个 epoch 中使用该训练好的模型。训练模型文件名应通过增加前一个文件名的最后一位数字来更改。使用\
  \ Python v3.6，运行 Cell 09 中的代码进行模型训练每 100 个 epoch 约需 54 分钟。使用 Python v3.9，相同代码的模型训练时间为\
  \ 37 分钟。在两天约 20 小时内，模型训练给出了足够好的结果（图 7.3）。在 Chess 项目中，Adam 优化器似乎优于 SGD 优化器。模型训练期间，学习率由\
  \ `ReduceLROnPlateau` 调度器调整。平均精度均值（mAP）是目标检测模型训练的重要指标。如果 mAP 高于 0.5，模型训练足够好；mAP\
  \ 约 0.7 为良好；mAP 高于 0.9 为优秀。对于优秀的模型训练，图 7.3 中的真实边界框和预测边界框应当相同。\n\n![](img/bk978-0-7503-6244-3ch7uf9_pr.gif)\n\
