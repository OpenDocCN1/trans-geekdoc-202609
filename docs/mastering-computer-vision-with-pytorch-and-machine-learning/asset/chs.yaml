  \ 的平面上被切片。这是观察 3D 张量的正常视角。通过代码 `x.permute(1,2,0)`，我们应该从顶部沿着 `Dim_1` 观察张量。张量应由水平平面切片，顶部平面显示在图中。当我们的鼻子朝向\
