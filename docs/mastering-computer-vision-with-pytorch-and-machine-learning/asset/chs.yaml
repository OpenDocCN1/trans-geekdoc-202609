  \n**图 8.4.** 预训练 YOLOv8 模型对图像进行目标检测/计数。视频处理速度约为 80 FPS。\n\n#### 8.4.3 视频文件的汽车跟踪与计数\n\
  \n\n\n\n\n# 目标跟踪与计数\n\n目标跟踪与计数是指在视频或图像序列中定位和监控目标，然后计算属于感兴趣类别的目标数量的过程。目标跟踪与计数在许多领域都有应用，如监控、交通监测、人员计数、零售分析、体育分析和野生动物监测等。\n\
  \n此类计算机视觉任务主要包含三个步骤：\n\n1.  使用 `YOLO` 或其他目标检测算法进行**目标检测**。\n2.  **目标跟踪**，旨在将当前帧中检测到的目标与前一帧中已跟踪的目标进行关联。\n\
  3.  **目标计数**。\n\n将以下项目 8.4.3 的代码应用于视频文件，我们将分别跟踪并计数相反方向行驶的汽车。视频中汽车旁行驶的卡车将被忽略。该项目代码受\
  \ FREEDOM TECH 的 [YouTube](https://www.youtube.com/watch?v=DXqdjWndooI) 视频及其 [GitHub](https://github.com/freedomwebtech/yolov8counting-trackingvehicles/blob/main/tracker.py)\
  \ 仓库启发。\n\n![](img/bk978-0-7503-6244-3ch8uf9_pr.gif)\n\n在由预训练的 `YOLOv8` 模型处理之前，每个视频帧都会被调整大小为\
  \ 1024 × 512。图 8.5 所示的处理后视频帧描绘了在高速公路上行驶的车辆。左侧车辆正朝向摄像头移动（方向 **down**：帧的从上到下）。右侧车辆正远离摄像头移动（方向\
  \ **up**：帧的从下到上）。\n\n**单元格 01** 中的代码导入库和一个小型预训练 `YOLOv8` 模型。单元格中还设置了七个超参数。其中第 03\
  \ 行和第 04 行的两个参数设置了如图所示绿线和红线的 *y* 轴位置。对应绿线在 `y=340` 的位置，由 `340-dy ≤ y ≤ 340+dy` 定义的帧上的绿色区域作为向上行驶汽车的检测区，其中\
  \ `dy` 由第 05 行代码设置为 6 个像素。同理，`y=370` 处的红线设置了一个相同大小的红色区域，用于检测向下行驶的汽车。其余四个超参数稍后解释。\n\
  \n![](img/bk978-0-7503-6244-3ch8uf10_pr.gif)\n\n![图 8.5. 视频帧上分别对向下和向上行驶的汽车进行交通跟踪与计数。视频文件（约\
  \ 9 MB）源自我手机拍摄的加拿大卡尔加里东北部 1 号高速公路与 36 街交叉口处。](img/bk978-0-7503-6244-3ch8f5_online.jpg)\n\
  \n**图 8.5.** 视频帧上分别对向下和向上行驶的汽车进行交通跟踪与计数。视频文件（约 9 MB）源自我手机拍摄的加拿大卡尔加里东北部 1 号高速公路与\
  \ 36 街交叉口处。\n\n我们从最后一个单元格：**单元格 04** 开始解释项目代码，它与项目 7.5 的单元格 07 几乎相同。该单元格中的代码逐帧读取视频文件。一帧经单元格\
  \ 03 中定义的函数处理后，如上图所示，相关信息会被添加到处理后的帧中。左下角的数字表示从第 0 帧到当前帧向下行驶的汽车数量；右下角的数字表示向上行驶的汽车数量。\n\
  \n当汽车处于检测区域内时，其边界框中心会用一个白点标记，其 ID 号显示在点旁边。ID 号的颜色与检测区水平线的颜色一致。左上角显示图像处理速度（方差较大）。当道路上没有车辆时，FPS\
  \ 计算中可能会发生“除以零”错误；使用一个很小的数（`10^(-5)`）来防止这种情况。当前帧的序号和视频总帧数显示在右上角。\n\n在第 140/572 帧（如图所示），已计数\
  \ 4 辆向上行驶的汽车和 2 辆向下行驶的汽车。图像处理速度为 57 FPS。此时，一辆 ID 为 229 的黑色汽车正向下行驶，并处于红色区域内。\n\n\
  ![](img/bk978-0-7503-6244-3ch8uf11_pr.gif)\n\n**单元格 03** 中定义的名为 `yolov8tc` 的函数表明，使用预训练的\
  \ `YOLOv8` 模型进行目标跟踪和计数。该函数修改了项目 8.4.2 单元格 01 中定义的 `yolov8` 函数。\n\n- 第 02 行将原始视频帧调整大小为\
  \ 1024 × 512。\n- 调整大小后的帧由 `YOLOv8` 模型处理，以获得边界框坐标（`boxes`）和 COCO 类别身份编号（`labels`）。\n\
  - 第 07–11 行筛选汽车，并将每辆汽车边界框的四个坐标（`x`、`y`、`X`、`Y`）打包成列表追加到 `car_list` 中。\n- 第 12 行通过\
  \ `Tracker` 类实例的 `track` 函数（在单元格 02 中定义）处理 `car_list`。输出列表 `cxcyid` 与输入长度相同。`cxcyid`\
  \ 中的每个子列表包含三个元素：中心坐标（`cx`、`cy`）和一个分配的 ID 号。\n- 中心坐标计算公式为：`cx = int((x + X) / 2)`\
  \ 和 `cy = int((y + Y) / 2)`。\n- `Tracker` 跨帧关联检测结果；新目标将获得一个新的、更高的 ID 号。\n\n在当前帧上，每辆汽车都有一个\
  \ ID 和中心坐标。第 13–30 行检查汽车的 *y* 轴位置：\n\n- 如果汽车在**绿色区域**内（第 15 行），则用白点标记并打印其 ID。该汽车被登记在字典\
  \ `vh_down` 中（用于向下行驶的汽车）。\n- 如果 `vh_down` 中某汽车的 ID 触及**红色区域**，且该 ID 对列表 `n_down`\
  \ 而言是新的（第 21 行），则将该 ID 追加到 `n_down`。`n_down` 的长度代表向下行驶汽车的计数。\n- 第 23–30 行应用相同逻辑计算向上行驶汽车的数量（使用\
  \ `vh_up` 和 `n_up`）。\n\n两个计数结果分别打印在帧的左下角和右下角，并绘制绿/红区域线。函数 `yolov8tc` 返回标注后的帧。\n\n\
  ![](img/bk978-0-7503-6244-3ch8uf12a_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch8uf12b_pr.gif)\n\
  \n\n\n\n当我们在 Cell 02 最后一行使用代码定义 `Tracker` 类的实例时，该实例通过一个名为 `center_points` 的空字典和一个名为\
  \ `id_count` 的标量进行初始化。Cell 03 第 12 行的代码仅调用实例的 `tracker.update()` 函数来处理当前视频帧。上一帧汽车的中心坐标保存在\
  \ `center_points` 中，上一帧的最大 ID 号加 1 后保存在 `id_count` 中。\n\n假设预训练的 YOLOv8 模型在第一帧检测到三辆汽车，并使用\
  \ `tracker.update()` 函数处理汽车列表。在 Cell 02 第 07 行开始的 `for` 循环中，首先获取第一辆汽车的中心点，并将该汽车的\
  \ `same object detected` 属性设置为 `False`。由于此时 `center_points` 字典为空，第 12 行至第 18 行的代码被跳过。第一辆汽车将通过第\
  \ 20 行的代码被分配 ID 号 1，此时 `id_count` 变为 2。现在 `center_points` 字典有一个元素 `{1: (cx1, cy1)}`，`center_ids`\
  \ 为 `[[cx1, cy1, 1]]`。\n\n我们仍在从第 07 行开始的循环中计算第二辆汽车的中心。第 12 行至第 18 行开始的子循环检查第二辆汽车与第一辆汽车之间的欧几里得距离。如果距离小于\
  \ 35 像素，则认为这两辆汽车是同一物体。如果不是同一物体，第二辆汽车将被分配 ID 号 2，`center_points` 将有两个元素 `{1: (cx1,\
  \ cy1), 2: (cx2, cy2)}`。处理完第三辆汽车后，如果它们的距离都大于 35，我们得到 `center_points {1: (cx1, cy1),\
  \ 2: (cx2, cy2), 3: (cx3, cy3)}`，且 `id_count` 为 4。偶尔两辆汽车之间的距离小于 35，因此它们拥有相同的 ID\
  \ 号。第 23 行至第 28 行的代码用于仅保留具有相同 ID 号的众多汽车中最新的那一辆。\n\n当 `yolov8tc` 函数处理第二帧时，`tracker.update()`\
  \ 函数将再次被调用。从第一帧获得的 `center_points` 字典和 `id_count` 标量保存在 `Tracker` 类的 `__init__()`\
  \ 函数中，它们用于第二帧的处理。如果第二帧只有相同的三辆汽车，且每辆汽车移动的距离都小于 35 像素，`Tracker` 的 `update` 函数将使用第一帧上的旧\
  \ ID 号识别这三辆汽车。`id_count` 不会改变（=4），但三辆汽车的 `center_points` 字典将被更新。在一辆汽车在两帧之间的时间间隔内移动距离大于\
  \ 35 像素的情况下，该汽车将被分配一个新 ID 作为新物体。但这是不正确的。数字 35 是一个关键距离，是该项目的一个超参数。它取决于相机分辨率和许多其他硬件设置。\n\
  \n新版本项目 8.4.3 的代码列在附录 G 中。新版本中的代码可以检测多个 COCO 类别中的运行物体。YOLOv8 检测到的每个物体的 COCO 类别标签（一个整数）在\
  \ Cell 03 第 07 行的代码中被记录在汽车列表中。有了这个额外信息，我们可以同时统计汽车和卡车。\n\n#### 8.4.4 微调 YOLOv8 以进行自定义数据集的目标检测和标注\n\
  \nYOLOv8 和 YOLOv7 模型使用相同格式的标注文件，甚至 MNIST4yolo 数据集的 yaml 文件也可同时用于两者。使用项目 8.4.4 中的代码，我们将把预训练的\
  \ `yolov8n.pt` 模型应用于 MNIST4yolo 自定义数据集。在 100 个 epoch 的模型训练中，第 03-04 行的代码通过在每行前添加井号\
  \ `#` 被禁用。模型训练在 20 分钟内完成，最佳训练模型保存在第 04 行所示的路径中。该训练模型可用于接下来的 100 个 epoch，方法是移除第 03-04\
  \ 行前的井号，并在第 02 行前添加井号。但不需要更多的模型训练了。我惊讶地发现仅用 20 分钟就获得了非常好的结果（图 8.6）。而图 8.1 中 YOLOv7\
  \ 的那些结果，在相同数据集上花费了 12 小时的模型训练。\n\n![](img/bk978-0-7503-6244-3ch8uf13_pr.gif)\n\n\
  ![图 8.6. 为 MNIST4yolo 数据集微调 YOLOv8 模型。Recall-Precision 曲线的空白中心是一个混淆矩阵。右下角的黑白图像是在模型训练期间获得的。](img/bk978-0-7503-6244-3ch8f6_online.jpg)\n\
  \n**图 8.6.** 为 MNIST4yolo 数据集微调 YOLOv8 模型。Recall-Precision 曲线的空白中心是一个混淆矩阵。右下角的黑白图像是在模型训练期间获得的。\n\
  \n训练好的 YOLOv8 模型非常有用。如果我们有 10,000 张图像，手动标注 1,000 张，并用这 1,000 张图像训练 YOLOv8 模型。然后在后续的\
  \ Cell 2-3 中使用训练好的 YOLOv8 模型，我们可以自动标注剩余的 9,000 张图像。图 8.7 中显示的测试图像及其标注表是 Cell 03\
  \ 的输出。标注表由训练好的 YOLOv8 模型预测。虽然预测值与真实值略有不同，但根据图 8.7 左侧图像上的边界框，我们可以看到预测效果非常好。\n\n![](img/bk978-0-7503-6244-3ch8uf14a_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch8uf14b_pr.gif)\n\n![图 8.7. 使用训练好的 YOLOv8 模型标注 MNIST4yolo\
  \ 测试数据集。(左) 带有预测边界框的测试图像。(右) 预测边界框表 (x 和 y 是边界框左上角的坐标；w 和 h 是边界框的宽度和高度；真实值 w=h=0.625)。](img/bk978-0-7503-6244-3ch8f7_online.jpg)\n\
  \n**图 8.7.** 使用训练好的 YOLOv8 模型标注 MNIST4yolo 测试数据集。(左) 带有预测边界框的测试图像。(右) 预测边界框表（`x`\
  \ 和 `y` 是边界框左上角的坐标；`w` 和 `h` 是边界框的宽度和高度；真实值 `w`=`h`=0.625）。\n\n我们仍然需要标注自己数据集的一些图像。我发现\
  \ [labelImg](https://github.com/HumanSignal/labelImg#Hotkeys) 是一个非常有用的图像标注工具。该工具由\
  \ Tzutalin 在数十位贡献者的帮助下创建。它是 MIT 许可证下的免费软件。在运行 DOS 命令 `pip install labelImg` 的 VS\
  \ Code 终端中，你可以在几秒钟内将该软件安装到计算机上。然后在终端运行另一个 DOS 命令 `labelImg`，即可在窗口界面中使用该软件。2023 年\
  \ 6 月，我们有了一个新的库工具 Autodistill，用于自动为 YOLOv8 标注图像。它是一个 Python 包，允许我们将大型基础模型的知识迁移到较小的模型中，以构建实时运行的\
  \ AI 应用程序。要使用 Autodistill，我在 Google Colab 中尝试了一个用于牛奶瓶检测的 Roboflow 项目。即使特斯拉 T4 的\
  \ 16 GB GPU 内存也不足以运行该项目的代码。\n\n\n\n2023 年 5 月，Deci AI 发布了用于目标检测的 YOLO-NAS 模型。缩写\
  \ NAS 代表“神经架构搜索”，这是 Deci 发明的一项技术，用于自动化神经网络架构的设计过程。在`Deci/super-gradient`的 GitHub\
  \ 仓库中，声称“新的 YOLO-NAS 以无与伦比的精度-速度性能提供了最先进（SOTA）的表现，优于`YOLOv5`、`YOLOv6`、`YOLOv7`和`YOLOv8`等其他模型。”`SuperGradients`是一个基于\
  \ PyTorch 的训练库。基于`SuperGradients`，Deci 在开源许可下提供了三个预训练模型：`yolo_nas_s`、`yolo_nas_m`和`yolo_nas_l`，并提供了可用于非商业用途的预训练权重。我们可以使用`pip\
  \ install super-gradients`在配备 Python v7-9 和 PyTorch 1.9-1.10 的 VS Code 虚拟环境中安装`SuperGradients`。使用小、中、大三种尺寸模型的目标检测速度分别为\
  \ 15、10 和 10 PFS。从上一节可知，模型`yolov8n.pt`和模型`yolov8l.pt`的速度分别为 80 和 30 FPS。令人惊讶的是，在我的电脑上\
  \ YOLO-NAS 比 YOLOv8 慢。Nicolai Nielsen 的一个 YouTube 视频也显示 YOLOv8 比 YOLO-NAS 快。受 Aarohi\
  \ Singla 和 Roboflow 代码的启发，我编写了代码对大型 YOLO-NAS 模型进行微调，用于我的 MNIST4yolov7 数据集。训练 100\
  \ 个 epoch 耗时超过四小时。YOLOv8 模型训练 100 个 epoch 仅需 0.3 小时，且 YOLOv8 模型训练代码只有几行。我不展示微调大型\
