  \ 15 中，你可以看到模型参数、优化器参数、损失函数和学习率调度器全都保存在一个文件中。你可以通过运行单元格 16 中的代码重新加载这些参数。\n\n![](img/bk978-0-7503-6244-3ch1uf23_pr.gif)\n\
  \n### 1.5 用于非线性回归的激活函数\n\n\n\n\n# 我们的世界因许多现象具有非线性而变得美丽\n\n在计算机视觉项目中，我们必须使用多个神经层来处理非线性数学问题。然而，模型中一系列的多个线性层工作起来就像单个线性层一样。例如，假设我们的模型有两个全连接线性层：`Y[1]\
  \ = w[1]*X + b[1]` 和 `Y[2] = w[2]*Y[1] + b[2]`，我们将得到 `Y[2] = w[2]*w[1]*X + (w[2]*b[1]\
  \ + b[2])`，这仍然是一个线性层。为了避免这一数学问题，我们必须在两个线性层之间添加一个激活函数。激活函数有很多种，它们都是非线性的。以下是四种常用的激活函数类别：\n\
  \n1.  **Sigmoid 类** `nn.Sigmoid()`: `f(x) = 1 / (1 + e^{-x})`\n2.  **双曲类** `nn.Tanh()`:\
  \ `f(x) = (e^{x} - e^{-x}) / (e^{x} + e^{-x})`\n3.  **线性整流单元类** `nn.ReLU()`: `f(x)\
  \ = x (x >= 0), 0 (x < 0)`\n4.  **Leaky ReLU 类** `nn.LeakyReLU(0.1)`: `f(x) = x\
  \ (x >= 0), 0.1x (x < 0)`\n\n我们将在项目 1.5.1 中针对 `y(x) = e^{-5x}` 的非线性回归使用 Sigmoid\
  \ 类作为激活函数。所有激活函数中的变量 `x` 可以是标量或数组。如果 Sigmoid 函数的输入是数组或矩阵，Sigmoid 函数将逐元素作用于该数组。Sigmoid\
  \ 函数输出的每个元素值都在范围 `[0, 1]` 内。在该项目中，根据函数 `y(x) = e^{-5x}` 创建了一个 csv 数据文件，其中 `x` 在\
  \ 0.0 和 1.0 之间。`x` 数组的长度为 51。我们希望使用一个具有两个全连接层的模型来模拟这个指数函数。\n\n![](img/bk978-0-7503-6244-3ch1uf24_pr.gif)\n\
  \n一个名为 `d:/nonlinearF.csv` 的 csv 文件在 Cell 03 中被输入并转换为数据集。批量大小设置为 17，因此数据集在数据加载器中被切分为三个批次。数据集中的数据通过\
  \ Cell 04 中的代码以图形形式显示。Cell 05 中定义了一个包含两层的模型。第一层和最后一层是全连接层。它们之间是一个没有参数的 Sigmoid 激活类。项目中使用了学习率调度器\
  \ `OneCycleLR`，其选项 `anneal_strategy` 设置为 `linear`，而非之前的 `cos`。\n\n![](img/bk978-0-7503-6244-3ch1uf25_pr.gif)\n\
  \n模型训练结果如图 1.7 所示。从图 1.7(A) 可以看出，非线性回归效果非常好。在模型输出 `y_hat` 和目标 `y` 之间，绝对最大差异约为 7.5\
  \ × 10^(−4)。通过在 Cell 08 中使用代码 `p = list(model.parameters()); print(p)`，我们得到了四个张量。前两个是第一个全连接层的权重\
  \ `p[0]` 和偏置 `p[1]`。后两个是最后一个全连接层的权重 `p[2]` 和偏置 `p[3]`。它们都存储在 GPU 中，且其 `requires_grad`\
  \ 选项为 true。以下公式是我们从模型训练中获得的。运行 Cell 08 中的代码，你就会知道模型参数是如何在以下公式中使用的。神经网络在模拟任何数学函数方面非常强大。在更大的项目中，模型拥有许多神经层和许多参数。我们无法给出以下公式的右侧部分，也没有必要。\n\
  \n```\ne^(−5X) = model(X) = [σ(X @ p[0]^T + p[1])] @ p[2]^T + p[3]\n```\n\n![](img/bk978-0-7503-6244-3ch1uf26_pr.gif)\n\
  \n![图 1.7. y(x) = exp(−5x) 的非线性回归结果。(A) 真实值 Y 与预测曲线 y_hat。(B) 损失曲线。(C) anneal_strategy\
  \ = 'linear' 时 OneCycleLR 的学习率。](img/bk978-0-7503-6244-3ch1f7_online.jpg)\n\n**图\
  \ 1.7.** y(x) = exp(−5x) 的非线性回归结果。(A) 真实值 Y 与预测曲线 y_hat。(B) 损失曲线。(C) anneal_strategy\
  \ = 'linear' 时 OneCycleLR 的学习率。\n\n### 参考文献\n\n- Dempster A P, Laird N M and Rubin\
  \ D B 1977 Maximum likelihood from incomplete data via the EM algorithm *J. Royal\
  \ Stat. Soc. Ser. B (Methodol.)* **39** 1–38\n- Hilt D E, Seegrist D W, United States\
  \ Forest S and Northeastern Forest Experiment S 1977 *Ridge, a Computer Program\
  \ for Calculating Ridge Regression Estimates* (Upper Darby, PA: Dept. of Agriculture,\
  \ Forest Service, Northeastern Forest Experiment Station)\n\n---\n\n### 使用 PyTorch\
  \ 和机器学习掌握计算机视觉\n\n## Caide Xiao\n\n---\n\n# 第 2 章\n\n## 卷积神经网络图像分类\n\n本章介绍构建和使用卷积神经网络（模型）对两个简单标注数据集\
  \ MNIST 和 CIFAR-10 中的图像进行分类。引入迁移学习以使用预训练模型对蔬菜图像数据集进行图像分类。在 MNIST 图像分类项目中获得的混淆矩阵用于展示如何计算模型训练的一些指标：召回率、精确率、F1\
  \ 分数和交并比 (IOU)。\n\n人类婴儿很容易知道他们看到了什么（图像分类），即使他们可能会被父母的“双胞胎”搞混。图像分类是计算机视觉的一个分支，始于\
  \ 20 世纪 60 年代。经过 60 多年，计算机在图像分类方面的智能已超越人类。如今，城市红绿灯旁的智能摄像头可以读取行驶汽车的车牌；手机可以识别用户的人脸。图像分类被广泛应用于自动驾驶汽车和生物医学诊断系统等领域。我们应将计算机视觉的成功归功于许多先驱的人工智能理论、更强大的计算机硬件，以及许多包含海量数据的免费数据集。本章使用三个数据集来训练图像分类算法或模型。它们是\
  \ MNIST、CIFAR-10 和蔬菜图像。这些图像数据集带有标签，我们利用它们训练模型进行监督学习。这就像给三岁孩子看图画书上的动物图片，你告诉孩子：“那是狗，那是猫，或者那是鸟。”孩子的大脑通过这些带标签的图片得到训练。随后，带孩子到户外展示真实动物，并反复问多次：“那只动物叫什么名字？”在不同环境下进行。孩子回答正确的百分比是一个基准，表明孩子训练得有多好。同样，在用图像数据集训练图像分类模型后，你的模型可以预测照片中是否有猫、狗、鸟或数字“5”。一个训练良好的模型可能拥有百万级参数。这些参数和模型结构可以被保存并写入专用集成电路\
  \ (IC) 芯片以用于特定应用。\n\n### 2.1 MNIST 数据库中手写数字的分类\n\n\n\n\n\n# MNIST 数据集与图像分类项目工具准备\n\
  \n## MNIST 数据集简介\n\nMNIST (Modified National Institute of Standards and Technology)\
  \ 是计算机视觉领域最著名的数据库 (LeCun *et al* 1998)，常用作测试机器学习算法的基准。需注意 MNIST 是一个非常简单的数据集，即使只有两个全连接神经层的模型也能达到\
  \ 98% 的准确率。在 MNIST 上表现良好的模型不代表在其他数据集上也能表现良好。MNIST 常作为开发和测试机器学习模型的起点。\n\nMNIST 数据集包含训练集和测试集，分别拥有\
  \ 60,000 和 10,000 张黑白图像。所有图像分辨率均为 28 × 28。训练集用于训练模型，测试集用于检查训练好的模型是否存在“过拟合”问题。过拟合会导致模型在训练集上预测准确率高，但在测试集上准确率低。这可能是因为计算机过于强大地记住了训练集中详细的结构（噪声），而这些结构在不同图像中可能各不相同。为避免过拟合，我们甚至将\
  \ MNIST 训练集切分为包含 50,000 张图像的较小训练集和包含 10,000 张图像的验证集用于模型训练。\n\n## 项目工具准备：Python 与\
  \ PyTorch\n\n正如古埃及人建造金字塔前须备好测量、切割和搬运巨石的工具，我们在项目 2.1 的 MNIST 图像分类代码中也需要准备工具。这些工具是\
  \ `Python` 和 `PyTorch` 库。借助它们，我们可以从互联网加载数据集到计算机，将数据集切片为 `DataLoader`，并在屏幕上显示。以下项目的\
  \ `Cell 01` 代码提供了这些工具。\n\n在这些工具中，`Torchvision` 对我们来说是新的。`Torchvision` 是 `PyTorch`\
  \ 的一部分库。该库包含许多用于下载的流行数据集、许多可用的预训练模型，以及许多用于减少过拟合问题的图像变换操作。`Torchvision` 在 `VS Code`\
  \ 中随 `PyTorch` 安装后一同安装。许多超参数（如 `batch size` 和 `learning rate`）也在 `Cell 01` 中设置。\n\
  \n我们的模型如何被训练以识别 MNIST 图像中的数字？模型并不像人眼那样“阅读”二维图像。在本项目中，模型包含两个全连接层。每张图像的 28 × 28 像素被展平为一个包含\
  \ 784 个元素的一维张量。该简单模型仅从这些数据中提取统计信息（概率）。凭借这些统计信息，模型的预测准确率将超过 98%。\n\n## 数据集下载与预处理\n\
  \n通过 `Cell 02` 的代码，如果硬盘上的数据路径为空且第 01 行和第 04 行将 MNIST 选项设置为 `download = True`，则可以从互联网下载\
  \ MNIST 数据库。从 MNIST 数据集源下载的压缩图像文件总大小约为 116 MB。如果数据库已下载到计算机上，应将下载选项设置为 `False`，随后图像数据将从\
  \ `Cell 01` 最后一行设置的文件路径读取。`Cell 01` 最后一行数据路径字符串中的点 (`.`) 代表 `VS Code` 的当前工作目录。可通过在额外单元格运行\
  \ `import os; os.getcwd()` 来查找。也可使用绝对数据路径。\n\n当 `train` 选项为 `True` 时，压缩文件内的训练集图像会被加载；若\
  \ `train = False`，则加载测试集图像。MNIST 图像中的每个像素均为 8 位整数 (0–255)。通过 `Cell 02` 第 02 行和第\
  \ 05 行的 `transform` 函数，每张图像的像素值被转换为范围在 `[0.0, 1.0]` 的 `float32` 张量。\n\n![](img/bk978-0-7503-6244-3ch2uf1_pr.gif)\n\
  \n## 数据集切片与 DataLoader 构建\n\n使用 `Cell 03` 的代码，我们利用 `PyTorch` 的 `DataLoader` 类将两个数据集分别切片为两个\
  \ `DataLoader`。较小的 `batch size` 意味着更长的模型训练时间，但能获得更好的训练结果。遇到 GPU 内存不足 (out of memory)\
  \ 问题时，减小 `batch size` 参数是一种解决方案。\n\n为减少模型训练的“过拟合”问题，我们在 `Cell 03` 第一行将 `shuffle`\
  \ 选项设为 `True`，使训练 `DataLoader` 由从数据集中随机选取的样本构建。测试 `DataLoader` 用于验证训练模型是否过拟合，无需随机打包。从\
  \ `Cell 04` 的输出可见，训练 `DataLoader` 的一个批次包含 32 张图像，每张图像有 1 个通道，分辨率为 28 × 28。单通道图像为黑白图像，三通道图像为彩色图像。此外，数据集中每张图像均有一个标签，即照片显示的数字。\n\
  \n可使用 `Cell 04` 后额外单元格中的代码显示测试数据集的最后一张图像：`img, _ = test_dataset[−1]; plt.imshow(img.permute(1,2,0))`。\n\
  \n## 图像批次可视化\n\n`Cell 04` 中定义了名为 `show_images` 的函数。该函数输入为来自 `DataLoader` 的一个批次图像。在\
  \ `Cell 03` 的 `for` 循环中，仅挑选第一批图像用于显示。利用 `torchvision.utils` 模块的 `make_grid`，将批次中的所有小图像合并为一张大图像。大图像每行包含的小图像数量由\
  \ `Cell 04` 第 03 行的 `nrow` 选项设定。每个小图像周围的间距由参数 `padding` 设定，默认 `padding` 等于 2 像素。\n\
