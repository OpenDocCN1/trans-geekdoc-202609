  \n---\n\n# **IOP** Publishing\n\n# Mastering Computer Vision with PyTorch and Machine\
  \ Learning\n\n# Caide Xiao\n\n---\n\n# 第 6 章\n\n## 利用 infoGAN 进行图像生成\n\n信息最大化生成对抗网络也是一种无监督计算机视觉技术，利用它我们可以在不使用标签的情况下生成特定风格的图像，这些图像与训练数据集中的图像相似。首先使用二次曲线数据集来解释\
  \ infoGAN 原理，然后将该技术用于 MNIST、动漫人脸和剪刀石头布数据集。\n\n虽然使用原始 GAN 随机生成逼真的假图像很重要，但使用条件 GAN\
  \ 生成期望的假图像更为重要。由于条件 GAN 可以将数据集中图像的标签信息编码进去，它们具有使用我们预设的标签生成特定图像的能力。不幸的是，许多数据集没有标签，因为数据集标注成本非常高。对于无监督学习我们能做什么？使用变分自编码器是为无标签数据集生成期望假图像的一种解决方案。然而，VAE\
  \ 系统生成的假图像通常模糊不清，不够锐利。2016 年，Xi Chen 及其合作者发表了一篇论文（Chen *et al* 2016），题为“InfoGAN:\
  \ Interpretable representation learning by information maximizing generative adversarial\
  \ nets”（InfoGAN：通过信息最大化生成对抗网络进行可解释的表征学习）。利用 infoGAN 系统，我们的代码在模型训练期间足够智能，能自动发现数据集中图像的不同特征，并使我们能够改变与这些特征相关的某些参数，从而生成具有期望类别和效果的假图像。\n\
  \n### 6.1 使用 infoGAN 生成二次曲线\n\n\n\n\n# infoGAN 架构\n\n在图 6.1(A) 所示的 infoGAN 架构中，共有四个模型：模型\
  \ `G`、模型 `D0`、模型 `D1` 和模型 `Q`。第一个是生成器模型 `G`，其结构与普通 GAN 中的生成器模型相同。最后一个是“辅助模型” `Q`。`D0`\
  \ 和 `D1` 是第 3.1.1 节中 GAN 判别器模型 `D` 的两个部分。模型 `D` 中有两个全连接层。其最后一个神经层被移除以构建模型 `D1`，而另一个神经层用于模型\
  \ `D0`。模型 `D0` 的输出由模型 `D1` 和模型 `Q` 共享。模型 `Q` 的三个输出分别命名为“logits”、“mu”和“var”。\n\n\
  第 3.11 节 GAN 中模型 `G` 的输入是由多元标准正态分布生成的一批噪声向量，每个噪声向量用包含 `z_dim` 个元素的小写字母 `z` 表示。在\
  \ infoGAN 系统中，我们用大写字母 `Z` 表示模型 `G` 输入的噪声向量。向量 `Z` 是不可压缩噪声向量、标签向量和风格向量的拼接结果。不可压缩噪声向量即\
  \ GAN 系统中的噪声向量（`z`），我们无法调整它们以获得伪造图像的任何期望效果。对于二次曲线项目，标签向量的元素是均匀分布的离散数（整数）。对于二次曲线项目，风格向量中的元素是\
  \ [-1,1] 范围内均匀分布的连续数。在 infoGAN 论文中，后两个向量的拼接被称为潜在代码 `c`，其元素命名为 `c[1]`、`c[2]`，……`c[L]`。对于简单项目，不可压缩噪声向量的元素数、标签的元素数和风格的元素数分别被任意选定为\
  \ `z_dim` = 13、`n_class` = 2 和 `n_styles` = 1。如图 6.1(A) 所示，噪声向量 `Z` 的维度为 `Z_dim`\
  \ = (13 + 2 + 1)。每一批 `Z` 向量由项目 6.1 的 Cell 09 中定义的函数生成。\n\n![Figure 6.1. (A) The\
  \ four models and information flow of an infoGAN. (B) Fake curves at epoch = 2000.\
  \ (C) Fake curves at epoch = 20 000. (D) Loss curves for model D and G. (E) Loss\
  \ curves for model Q's outputs. (F) A fake curve generated with Z[:,13] = 0, Z[:,14]\
  \ = 1 and Z[:,15] = −0.1. Model training time is 21 min.](images/bk978-0-7503-6244-3ch6f1_online.jpg)\n\
  \n**图 6.1.** (A) infoGAN 的四个模型及信息流。(B) epoch = 2000 时的伪造曲线。(C) epoch = 20 000 时的伪造曲线。(D)\
  \ 模型 D 和 G 的损失曲线。(E) 模型 Q 输出的损失曲线。(F) 由 `Z`[:,13] = 0、`Z`[:,14] = 1 和 `Z`[:,15]\
  \ = −0.1 生成的一条伪造曲线。模型训练时间为 21 分钟。\n\n我们进行上述额外工作是为了获得期望的伪造曲线或图像。再举一个不使用标签信息的 MNIST\
  \ 数据集的例子，我们想利用 infoGAN 生成期望的伪造数字图像。在这种情况下，标签向量的数量设为 `n_class` = 10（对应其 10 个类别），`n_styles`\
  \ = 2（对应两种图像风格）。由于每张 MNIST 图像有 28 × 28 个像素，我们为不可压缩噪声向量 `z` 的元素数选择 `z_dim` = 62。对于简单的二次曲线项目，每条曲线有\
  \ 21 个数字，因此我们可以设定 `z_dim` = 13。我们实际上并不了解那些二次曲线的标签和风格信息，而是想看看 infoGAN 能从设定了 `n_class`\
  \ = 2 和 `n_styles` = 1 的二次曲线数据中学到什么。根据 infoGAN 论文，潜在代码名称“c”用于表示二次曲线项目中所有潜在变量 `c[1]`、`c[2]`\
  \ 和 `c[3]` 的拼接。我们可以对潜在代码使用分解概率分布\n\n$$P(c_{1},c_{2},\\ldots,c_{L}) = \\prod\\limits_{i\
  \ = 1}^{L = 3}{p(c_{i})}$$\n\n(6.1)\n\n每一批噪声向量（`Z`）被模型 `G` 用来生成一批伪造图像，如图 6.1(C)\
  \ 所示。模型 `D0` 以一批伪造曲线或一批真实曲线作为输入。`D0` 的输出是一个 `m` × `n_hidden` 张量，其中 `m` = 批次大小，`n_hidden`\
  \ = 128。该输出由模型 `D1` 和模型 `Q` 共享。模型 `D1` 经过训练，通过使用以下 BCE 损失函数 `L[D1]`（与普通 GAN 相同），确保伪造图像与真实图像相比具有良好的质量\n\
  \n$$L_{D1} = \\frac{- 1}{m}\\sum\\limits_{i = 1}^{m}{\\ \\ln\\ \\left\\lbrack {D1\\\
  left( {D0\\left( x_{i} \\right)} \\right)} \\right\\rbrack} - \\frac{1}{m}\\sum\\\
  limits_{i = 1}^{m}{\\ \\ln\\ \\left\\lbrack {1 - D1\\left( {D0\\left( {\\widetilde{x}}_{i}\
  \ \\right)} \\right)} \\right\\rbrack}$$\n\n(6.2)\n\n模型 `D0` 的输出张量也被模型 `Q` 使用，后者有三个输出：一个\
  \ `m` × 2 的 logits 张量、一个 `m` × 1 的均值张量 `μ`，和一个 `m` × 1 的方差张量 `σ`²。如下式 (6.3) 所示，损失函数\
  \ `L[G]` 包含三个部分。第一部分是一个 BCE 损失函数，用于训练模型 `G` 生成足以欺骗模型 `D1` 的、与真实图像一样好的伪造图像；第二部分是关于潜在代码中的标签与模型\
  \ `Q` 输出的 logits 之间的交叉熵损失函数；第三部分是一个高斯负对数似然损失函数，它在 `Z` 向量中的一批 `c[3]` 与模型 `Q` 的两个输出（`μ`\
  \ 和 `σ`²）之间建立了数学联系。正如 infoGAN 论文所述，方程 (6.3) 中的超参数 `λ` 应为一个较小的数值，因为来自风格变量的损失函数值可能非常大。伪造图像与潜在代码之间的数学联系是第\
  \ 2.1.3 节提到的互信息 `I(c, G(z, c))`。我们可以像使用旋钮一样利用该联系来调节模型 `G`，以生成具有期望效果的伪造图像\n\n$$L_{G}\
  \ = \\frac{- 1}{m}\\sum\\limits_{i = 1}^{m}{\\ \\ln\\ \\left\\lbrack {D1\\left(\
  \ {D0\\left( {\\widetilde{x}}_{i} \\right)} \\right)} \\right\\rbrack} + {Cross}E_{Loss}\\\
  left( {\\text{logits},{labels}} \\right) + \\frac{\\lambda}{2m}\\sum\\limits_{i\
  \ = 1}^{m}\\left( {\\ln\\ \\sigma_{i}^{2} + \\frac{\\left( {\\left( c_{3} \\right)_{i}\
  \ - \\mu_{i}} \\right)^{2}}{\\sigma_{i}^{2}}} \\right)$$\n\n(6.3)\n\n在第 1 章第 1.1.3\
  \ 节提到的赌博机中，一枚均匀硬币和一个均匀骰子是独立的，因此它们的互信息等于零。我们无法从桌上掷出的骰子点数预测硬币的正反面。为了利用潜在代码调节伪造图像以产生期望效果，我们应根据方程\
  \ (1.18) 最大化潜在代码 `c` 与伪造图像之间的互信息：`I(c, G(z, c)) = H(c) − H(c | G(z, c))`。我们从方程 (6.1)\
  \ 知道 `c` 的 PDF，因此可以计算其熵 `H(c)`。但我们不知道伪造图像 `G(z, c)` 的 PDF，也无法直接计算 `I(c, G(z, c))`。通过引入辅助模型\
  \ `Q`，infoGAN 论文的作者规避了该问题，并找到了互信息的下界：`LI`\n\n\n\n\n\n## 6.1 二次曲线项目中 infoGAN 的实现\n\
  \n$I(c, G(z, c)) \\ge L_I(G, Q) = E_{x \\sim G(z, c)}[E_{c' \\sim P(c, \\sim, x)}[\\\
  ln[Q(c', \\sim, x)]]] + H(c)$\n\n(6.4)\n\n通过最大化互信息的下界来最大化互信息是合乎逻辑的。利用梯度下降算法，我们需要找到下界负值的最小值。这就是为什么在模型\
  \ G 的损失函数（6.3）中使用高斯负对数似然损失函数的原因。在以下用于二次曲线项目的 infoGAN 项目 6.1 的代码中，大多数超参数和所有库都列在 `Cell\
  \ 01` 中。照例，`Cell 02` 生成数据，`Cell 03` 利用这些数据绘制真实的二次曲线。图 6.1(B) 和 (C) 展示了由 infoGAN\
  \ 代码生成的假曲线。模型 D1 的损失函数值非常接近其理论数值。但模型 G 的损失曲线非常嘈杂。这些噪声来自图 6.1(E) 中所示的高斯负对数似然损失 `loss_con`。超参数\
  \ `lambda_info` 用于限制 `loss_con` 对模型 G 损失的贡献。\n\n![](img/bk978-0-7503-6244-3ch6uf1_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch6uf2_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch6uf3_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch6uf4_pr.gif)\n\n在 `Cell 09` 中，噪声张量生成器函数 `noise4G_input`\
  \ 对我们来说是新的。它生成三个随机张量并将它们连接成一个 $m \\times 16$ 的张量 `Z`，这是该函数的第一个输出。该张量将用于生成一批假曲线。该函数的另外两个输出（`labels`\
  \ 和 `con_c`）将在模型训练期间更新，并可用于调整这些假图像以达到我们期望的效果。`Cell 10` 中的 `train_D1` 函数与普通 GAN 中的一样。在\
  \ `Cell 11` 中关于名为 `train_G` 的函数，损失函数有三个部分。第一部分是用于欺骗模型 D1 的 BCE 损失；第二部分是用于建立模型 Q\
  \ 的 logits 输出与潜在标签之间联系的交叉熵损失；第三部分是高斯负对数似然损失。它用于确保服从正态分布 $N(c[3]; \\mu, \\sigma²)$\
  \ 的潜在代码中的风格变量，其中 `mu` 和 `var` = $\\sigma²$ 是模型 Q 的两个输出。我们使用 Pytorch 的一个名为 `nn.GaussianNLLLoss`\
  \ 的类来计算损失值。\n\n`Cell 12` 到 `14` 的代码用于训练模型并显示模型训练结果。模型训练后，生成了一条单独的假曲线，如图 6.1(F) 所示。其数据由\
  \ `Z = torch.randn(1, Z_dim)` 生成，然后通过 `Z[:,13] = 0`、`Z[:,14] = 1` 和 `Z[:,15] = -0.1`\
  \ 进行设置。使用标签代码 `c[1] = 0` 和 `c[2] = 1`，infoGAN 系统生成一条最低点低于 $y = 0.5$ 的假曲线；而使用标签 `c[1]\
  \ = 1` 和 `c[2] = 0`，infoGAN 系统生成一条最低点高于 $y = 0.5$ 的假曲线。风格变量 `c[3]` 可用于沿 $y$ 轴连续调整假曲线的最低点。如果\
  \ $|c[3]|$ 太大（$\\gg 1$），假曲线将不平滑。基于 infoGAN 理论的额外工作赋予了我们在没有数据集标签信息的情况下调整假图像的能力。\n\
  \n### 6.2 MNIST 数据集中 infoGAN 的实现\n\n凭借第 3.2.2 节中关于 DCGAN MNIST 项目的知识以及上一节关于生成假二次曲线的\
