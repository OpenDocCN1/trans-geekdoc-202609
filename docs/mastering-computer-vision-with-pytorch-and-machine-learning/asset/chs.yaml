  \n在项目 4.1.1 的七个 Cell 中，只有 Cell 06 是新的。函数 `gradient_penalty` 需要三个输入：判别器模型 D、一批真实曲线（64\
  \ × 21 张量）和一批假曲线（64 × 21 张量）。上述 Extra Cell TWO 用于帮助我们理解如何从一条真实曲线和一条假曲线构造插值曲线。Extra\
  \ Cell TWO 前三行代码为一批 64 条真实曲线生成一个 64 × 21 张量，并为一批 64 条假曲线生成一个相同大小的张量。第四行代码生成一个 64\
  \ × 1 的随机张量 `eps`，第六行代码将其扩展为 64 × 21 张量。扩展后的 `eps` 张量中每一行的每个元素都是同一个随机数。屏幕上打印的 `eps[63]`\
  \ 是扩展张量最后一行的一个示例。通过 Extra Cell TWO 最后四行代码，你将了解如何计算插值张量。根据第 9 行的公式 `interpolation\
  \ = eps * curves_real + (1−eps) * curves_fake`，每条插值曲线通过逐元素计算获得。第 13 行的输出是关于最后一条插值曲线最后一个元素的手动计算结果，它与第\
  \ 12 行输出的最后一个元素相同。一批插值将作为模型 D 的输入，输出一批标量（Cell 06 第 07 行）。这批标量名为 `interp_logits`，其对插值的梯度通过\
  \ Cell 06 第 08 行的代码获得，用于梯度惩罚。\n\n![](img/bk978-0-7503-6244-3ch4uf5_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch4uf6_pr.gif)\n\
  \n根据 WGAN 论文（Arjovsky *et al* 2017），应使用 RMSprop 优化器。你可以在 Cell 07 中尝试 Adam 优化器，但\
  \ WGAN 生成的假曲线质量差别不大。在 Extra Cell TWO 末尾，如果你添加并运行以下代码 `D(torch.FloatTensor(y).cuda()).T`，你将得到一个如下所示的\
  \ 1 × 64 张量，其中 `y` 是由 Cell 02 生成的用于真实曲线的 64 × 21 numpy 数组。每条真实曲线被模型 D 压缩为 1D 临界空间中的一个实数：\n\
  \n```\ntensor([[-0.0117, 0.0057, -0.0153, -0.0998, -0.1126, -0.0682, -0.0417, -0.0155,\n\
  -0.0779, -0.1115, 0.0053, 0.0025, 0.0029, -0.1112, -0.0124, -0.1099,\n-0.0176, -0.0806,\
  \ -0.0436, -0.0785, -0.0720, -0.0747, -0.0176, -0.0962,\n-0.0622, -0.0094, -0.0295,\
  \ -0.0681, -0.0810, -0.0414, -0.0492, -0.0683,\n-0.0849, -0.0824, -0.0509, -0.0292,\
  \ -0.1097, -0.0534, -0.0341, -0.1099,\n-0.1024, -0.0659, -0.0413, -0.0531, 0.0039,\
  \ -0.0964, -0.0046, -0.0288,\n-0.0428, -0.0430, -0.0190, -0.0657, -0.1021, -0.0610,\
  \ -0.0137, -0.0826,\n-0.0550, -0.0018, -0.0918, -0.0722, -0.0053, -0.0519, -0.0776,\
  \ -0.0334]],\ndevice = 'cuda:0', grad_fn = <PermuteBackward0>)\n```\n\n这些 1D 临界空间中的数字隐藏着一个概率分布函数。我们仅关注该\
  \ PDF 的均值，假设该 PDF 服从方差恒定的正态分布。将上述代码中的 `T` 改为 `mean()` 计算上述 64 个数字的平均值，你将得到这些数字的平均值\
  \ `D(X)` = -0.1803。这是一个标量张量。WGAN 使用该平均数作为这些真实曲线在 1D 临界空间中的统计位置。使用代码 `D(G(torch.randn(batch_size,\
  \ z_dim, requires_grad=True).cuda())).mean()`，你将得到另一个包含 64 个元素的 1D 张量的平均值：`D(G(Z))`\
  \ = 0.0046。这是一批假曲线的统计位置。WGAN 的模型 D 想要最大化 `D(X)` 和 `D(G(Z))` 之间的距离，以便模型 D 能够区分真实曲线和假曲线。该距离称为“Wasserstein\
  \ 距离”或“Earth moving distance”（土方距离）。在计算机视觉项目中，我们总是使用梯度下降算法在模型训练期间寻找损失函数的最小值。我们必须使用公式\
  \ (4.1) 所示的损失函数来最小化模型 D 的负 Wasserstein 距离。WGAN 的模型 G 想要通过最大化 `D(G(Z))` 来欺骗模型 D。基于相同的数学推理，我们选择模型\
  \ G 的损失函数如公式 (4.2) 所示。\n\nWasserstein 距离的数学概念不易理解。假设你想将埃及吉萨的一个金字塔移至希腊雅典并建造完全相同的金字塔，有许多移动石块的方法。一种方法是经由中国、跨越太平洋到达美洲，再跨越大西洋和地中海到达雅典。一条较短的路径是向北跨越地中海到达雅典。最短路径是“Earth\
  \ moving distance”（土方距离），我们在该路径上以最短时间和最低成本完成项目。Jensen-Shannon 散度用于 GAN 模型 D 的损失函数（3.1.1\
  \ 节）。如果真实样本的 PDF 与假样本的 PDF 不重叠，损失函数的值将为常数（零），损失函数的梯度也将为零。模型 D 将因梯度消失而无法训练。引入 Wasserstein\
  \ 距离是为了解决这个问题。\n\n\n\n\n为了稳定模型训练，WGAN 论文指导模型 D 的训练次数（`n_critic` = 5）应多于模型 G。在 Cell\
  \ 08 的第一个 for 循环中，每一批真实曲线和生成曲线都要训练 `n_critic` 次。这些额外的计算会显著增加训练时间。但如果我们确信模型训练能在数小时或数天内产出良好结果，我们就愿意等待。Cell\
  \ 08 中的另一个 for 循环通过裁剪（`c` = 0.01）来限制模型 D 的权重，这是专门针对 WGAN 的。论文指示我们这样做是为了满足模型 D 的\
  \ 1-Lipschitz 连续性。图 4.1 展示了上述代码在三种条件下的输出。WGAN-GP 论文（Gulrajani *et al* 2017）指导我们使用\
  \ Adam 优化器。但从图 4.1(B) 可以看出，对于该项目，RMSprop 优化器优于 Adam。损失函数曲线和 WGAN-GP 的梯度惩罚曲线如图 4.2\
