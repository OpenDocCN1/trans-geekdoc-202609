  ![图 9.4(D)](img/bk978-0-7503-6244-3ch9uf11_pr.gif)\n\n### 9.3 使用 Hugging Face 的预训练\
  \ U-Net 生成图像\n\n上一节中的注意力 U-Net 对 MNIST 足够强大，但对 CIFAR10 不够智能。为了为 CelebA 和 STL10 等其他数据集生成高质量假图像，我们需要更强大的\
  \ U-Net。幸运的是，Hugging Face 为不同数据集提供了预训练的 U-Net 模型。我们只需编写几行代码即可生成精美图像。以下项目 9.3.1 中的代码用于演示\
  \ Hugging Face 扩散模型的强大功能。运行代码前，请在工作区的 VS Code 终端中使用 DOS 命令 `pip install Hugging\
