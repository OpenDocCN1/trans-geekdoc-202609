  \n### 9.4 通过 Stable Diffusion 根据文本提示生成逼真图像\n\n由预训练的 Hugging Face U-Net 模型生成的花卉图像非常美丽。然而，我们无法控制生成哪种花卉。我们可以使用条件\
  \ DDMP 模型根据我们的设置生成图像。即使我们拥有上千行代码且运行良好的条件 DDMP 模型，它也只能生成受训练数据集限制的类别图像。要获得逼真图像，模型训练时间可能会非常长。我们如何在不进行模型训练的情况下，仅使用文本提示生成任意高质量图像？\n\
  \n我们现在（自 2022 年起）拥有一种生成模型，可以根据文本提示生成任意图像。它是 Hugging Face 的 Stable Diffusion，一种名为潜在扩散模型的深度学习文生图模型（LDM\
  \ (Rombach *et al* 2022)）。用于训练 Stable Diffusion 的数据集是 Laion-5B，这是一个开源数据集，提供超过 58.5\
  \ 亿对经过 CLIP 筛选的图文对。自然语言处理（NLP）是计算机科学的一个分支。第 9.2 节中使用的多头自注意力是一种从编码文本中获取信息的 NLP 方法。Stable\
  \ Diffusion 是计算机视觉与 NLP 的融合。Hugging Face 有一个 Stable Diffusion 2.1 演示网站，其中包含一个指向\
  \ DreamStudio Beta 的链接。第二个网站生成的图像对我们的文本提示具有更高的忠实度。如果你生成人脸图像，你会看到这两个网站之间巨大的差异。我们可以下载\
  \ Stable Diffusion 的库并在 VS Code 中练习生成图像。这些库和预训练参数的文件体积巨大（>10 GB）。为了节省计算机硬盘空间，你可以在配有免费\
  \ GPU 的 Google Colab 或 Kaggle 中运行以下代码（图 9.7）。2024 年 1 月，微软的 Copilot 和谷歌的 Bard 让人们能够通过文本提示生成逼真图像。\n\
