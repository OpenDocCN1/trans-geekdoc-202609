  \n在 1.2 和 1.3 节中，我们将线性回归模型定义为 `X`@`w`，或 `nn.Linear(1,1)`。在本项目的单元格 05 中，我们编写额外代码来定义这个简单模型。通常，计算机视觉项目在其神经网络模型中使用许多神经层。单元格\
  \ 05 中的 `nn.Sequential()` 可以包含多种数学运算，以处理并从数据中提取信息。这是本书大型项目中定义所有计算机视觉模型的方式。类中的 `forward`\
  \ 函数接受输入数据并返回输出数据。在单元格 05 的最后一行，一个模型被定义为 `LinearRegression` 类的实例，并通过 `cuda()` 将模型移至图形处理单元（GPU）的内存中。CUDA\
