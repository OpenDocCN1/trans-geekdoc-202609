  \n**图 2.2.** (左) 由 Extra Cell TWO 代码创建的 3D 张量的正常视图：眼睛沿 `Dim_0` 观察，鼻子朝向 `Dim_1`，连接双眼的连线与\
  \ `Dim_2` 平行。(右) 置换后张量的三个子张量位于三个垂直于 Dim 1 的平面上。\n\n在 Cell 05 中定义的模型里，有两个全连接层。其中一个是\
  \ `nn.Linear(784, 100)`，另一个是 `nn.Linear(100, 10)`。它们之间是一个激活类 `nn.ReLU()`。它不是 `nn.Sigmoid()`。如果你愿意，仍然可以使用\
  \ sigmoid 类作为激活函数。ReLU 激活函数将所有负数设为零，并保持任何正数不变。它效果良好且计算耗时较少。该模型并不真正分析 2D 图像。在模型的前向函数中，每张\
  \ 2D 图像的 `28 × 28` 像素被转换为一个包含 784 个元素的 1D 张量。对于训练数据加载器中每批 32 张图像，模型的输入是一个形状为 `32\
  \ × 784` 的张量。第一层的输出是一个形状为 `32 × 100` 的张量，最后一层的输出是一个形状为 `32 × 10` 的张量。\n\n在第 1 章中，我们对连续变量使用了\
  \ MSE 损失函数。对于 MNIST 图像分类项目，目标是关于图像类别标识的离散整数 0、1、……、9。交叉熵损失函数用于图像分类。以下 Extra Cell\
  \ THREE 的代码用于展示交叉熵损失函数是如何工作的。在 Extra Cell 中，一个名为 'targets' 的 1D 张量 `[2,1,0]` 被假设为来自数据加载器的一个批次的图像标签\
  \ 1D 张量（第 03 行），一个名为 'y_hat' 的 `3 × 4` 张量被假设为模型的输出（第 06 行）。在这个例子中，数据加载器的批次大小为三，数据集中的图像类别总数为四。有了它们，准则或损失函数\
  \ `nn.CrossEntropyLoss()` 直接在 Extra Cell 的最后一行给出损失函数值。我们应该知道交叉熵损失函数会对任何图像分类模型的输出做一些额外的工作。\n\
  \n![](img/bk978-0-7503-6244-3ch2uf4_pr.gif)\n\n$$s\\\\left( \\\\begin{bmatrix} {\\\
