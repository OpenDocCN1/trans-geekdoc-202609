  ### 8.4 YOLOv8、YOLOv9 和 YOLO-World 模型的应用\n\n#### 8.4.1 图像目标检测、分割、分类和姿态估计\n\n\n\n\
  \n# YOLOv8 发布与应用\n\n2023 年 1 月 10 日，Ultralytics 创始人 Glenn Jocher（几年前也发布了 YOLOv5）发布了\
  \ YOLOv8。基于之前 YOLO 版本的成功，YOLOv8 的设计旨在更快、更准确且更易于使用。如果你曾设法在电脑上安装过 YOLOv3，你就会体会到 YOLOv8\
  \ 团队为我们所做的工作。我曾花了一周时间在电脑上编译 YOLOv3 的 darknet，因为我必须想办法协调 VC++、OpenCV、Nvidia CUDA\
  \ 和其他第三方软件以共享它们的库。对于 YOLOv8，只需在 VS Code 终端中使用一条 DOS 命令 `pip install ultralytics`，即可在几分钟内在\
  \ VS Code 的虚拟环境中安装 YOLOv8，具体时间取决于你的网速从 YOLOv8 网站下载文件。有许多模型支持预训练参数文件供下载。这些文件不大，且便于人们使用。在\
  \ YOLOv8 的主页上，有关于如何安装 Ultralytics 和使用预训练模型的详细说明。YOLOv8 的 DOS 命令行界面 (CLI) 让我们能够在各种任务上训练、验证或推理模型。以下是一个使用笔记本电脑摄像头为自己拍摄视频的\
  \ DOS 代码示例。在 DOS 代码前加上感叹号 `!`，甚至可以在 VS Code 单元格中运行它。如果你将以下 DOS 命令中的保存选项设为 True，你的视频将被保存到一个文件中。我从\
  \ YouTube 下载了一个交通视频并将其保存到名为 `d:/traffic.mp4` 的文件中。将 DOS 命令的 source 选项从 0 改为视频文件名，我就可以观看带有边界框、标签和概率的视频帧。视频处理速度约为\
  \ 100 FPS。使用 YOLOv3 和 YOLOv7 模型时，速度分别为 2 和 20 FPS。将 source 改为名为 `d:/dog.jpg` 的图像文件，你可以看到来自预训练\
  \ yolov8 模型的目标检测结果。然而，图像在我电脑屏幕上很快就消失了。将模型改为 `yolov8n-seg.pt`、`yolov8n-cls.pt`、`yolov8n-pose.pt`\
  \ 和其他预训练模型，我们可以使用单行代码进行实例分割、图像分类和姿态估计。模型名称中 yolov8 后面的字母可以是 `n`、`s`、`m`、`l` 和 `x`，分别表示预训练\
  \ YOLOv8 模型的大小，从 nano、small、medium、large 到 extreme large。\n\n```\nyolo task=detect\
  \ mode=predict model=yolov8n.pt source=0 conf=0.25 iou=0.5 conf=0.15 show=True save=False\n\
  ```\n\n在 VS Code 的 Python 环境中使用 YOLOv8 模型更加灵活。仅使用 7 行代码，以下项目 8.4.1 也可通过更改单元格 01\
  \ 第 04 行的预训练模型名称，用于目标检测、图像语义分割、图像分类和姿态估计。这些模型是用 MS COCO 数据集训练的。从单元格 02 第 05 行删除\
  \ `[2030:2040]`，你将逐个显示所有 17,125 张 VOC 图像。观看幻灯片需要很长时间。你可以随时按键盘上的 Esc 键终止程序，但请务必先点击图像窗口让电脑聚焦于该窗口。默认情况下，由第\
  \ 08 行 `waitKey()` 的一个选项设置，每张图像将显示 1000 毫秒。要加快幻灯片播放，你可以按除 Esc 键以外的任意键（如空格键）。一些被\
  \ yolov8n.pt 忽略的物体可以被 yolov8l.pt 检测到。将单元格 01 第 04 行的代码改为 `yolov8 = YOLO('yolov8n.pt').track`，你会看到图像上每个被检测到的物体都有一个\
  \ ID 编号。然而，目标跟踪功能不适用于分类模型。2024 年 2 月，Chien-Yao Wang 及其合作者（Wang *et al* 2024）发布了\
  \ YOLOv9，它是基于 YOLOv7 构建的。将 Ultralytics 升级到最新版本 (v8.1.24) 后，我可以通过在项目 8.4.1 中运行代码，将单元格\
  \ 01 第 04 行的 `yolov8n.pt` 替换为 `yolov9c.pt` 来测试预训练的 YOLOv9 模型。YOLOv9 模型的视频处理速度为 25\
  \ FPS。我还测试了一个预训练的 YOLO-World 模型 `yolov8s-world.pt`，发现其视频处理速度约为 50 FPS。YOLO-World（Cheng\
  \ *et al* 2024）模型使我们能够根据描述性文本检测图像中的任何物体。第 05-6 行的代码用于 YOLO-World 模型。第 06 行的一个字符串列表用于描述性文本，指示模型查找字符串列表中列出的物体。\n\
  \n![](img/bk978-0-7503-6244-3ch8uf7_pr.gif)\n\n#### 8.4.2 图像或视频帧上的目标计数\n\n在项目 8.4.2\
  \ 中，YOLOv8 模型用于计算单个图像或视频帧上检测到的物体数量。NumPy 数组中的图像被用作名为 `yolov8` 的函数中 YOLOv8 模型的源（第\
  \ 06 行）。你可以用第 07 行的代码替换第 06 行的代码，为每个检测到的物体分配一个对象 ID 编号，并会发现许多物体未被检测到。我们可以方便地从 YOLOv8\
