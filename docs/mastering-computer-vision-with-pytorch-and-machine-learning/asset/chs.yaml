  \n**图 8.3.** 单元格 03 的输出：预训练 YOLOv7 姿态模型应用于图像。该模型的视频处理速度约为 15 FPS。\n\nAarohi Singla\
  \ 有一个非常有用的 [GitHub](https://github.com/AarohiSingla/Detectron2-Tutorial/blob/main/Detectron_fasterrcnn_pretrained_coco.ipynb)\
