  \ 1 FPS。Detectron2 为实例分割提供了最佳掩码。[CVZONE](https://github.com/cvzone/cvzone) 是一个计算机视觉包，使运行图像处理和\
  \ AI 功能变得容易。cvzone 的核心使用 OpenCV 和 mediapipe 库。使用以下代码和项目 7.5 的单元格 07，我们可以使用 CVZONE\
