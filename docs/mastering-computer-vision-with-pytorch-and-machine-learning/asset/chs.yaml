  \ *et al* (2017) CC BY 3.0。(C) 一个具有三个分段的 lambda 学习率调度器，用于 `D_lr` 和 `G_lr = 50*D_lr`。黑色虚线基于理论值绘制。\n\
  \n\n\n\n第 07 个单元格中定义的生成器模型类包含四个转置卷积层。根据 DCGAN 论文，其最后一层没有批量归一化操作。模型 G 的输入是一个大小为 `batch_size\
  \ × z_dim` 的二维张量。根据论文，潜在维度 `z_dim` 被设置为等于 100。噪声张量在模型训练期间生成，并将用标准正态分布生成的随机数填充。在\
  \ `forward` 函数中，二维噪声张量首先通过两个 `unsqueeze(dim = −1)` 函数转换为四维张量，然后由四个转置卷积层处理。由于模型的激活函数是\
  \ `Tanh()`，模型 G 输出图像的像素值范围在 [−1,1] 之间。在第 07 个单元格之后的另一个额外单元格中，运行 `D(G(fixed_latent))`，你将验证这两个模型是否正常工作。\n\
  \n![](img/bk978-0-7503-6244-3ch3uf12_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch3uf13_pr.gif)\n\
  \n在 DCGAN 论文中，两个模型的固定学习率均被设置为等于 2 × 10^(−4)。虽然此设置可行，但我尝试调整损失曲线以匹配图 3.6(C) 所示的 Lambda\
  \ 学习率调度器的理论曲线。由于模型 D 比模型 G 更“聪明”，模型 G 的学习率被设置为 50 × D_lr。以下是 Lambda 函数方程。如果初始学习率和\
  \ `k` 分别设置为 4 × 10^(−5) 和 500，MNIST 模型训练的损失曲线也可被调整为遵循理论曲线。\n\n```\nlr = lr_0 × {\
  \ 0.099i + 0.01(i < 10); e^(-0.184 × (i - 10))(10 ≤ i < 40); 0.004(i ≥ 40) }\n```\n\
  \ngraphic style=\"width:16.1875em;\" xlink:href=\"bk978-0-7503-6244-3ch3ueqn33.gif\"\
  \ position=\"float\"/\n\n对于 0, 10) 范围内的轮次，D_lr 从 4 × 10^(−7) 线性增加到 4 × 10^(−5)；对于\
  \ [10, 40) 范围内的轮次，D_lr 指数级下降至 1.6 × 10^(−7)，然后在最后十个轮次中保持该速率。对于 Fashion MNIST 数据集，Loss_D\
  \ 和 Loss_G 曲线几乎是直线。随着更大的 G_lr，生成优质 MNIST 图像变得更容易、更快。第 13 个单元格中的代码可用于生成并显示单张伪造的 MNIST\
  \ 图像。每次运行时，你都会看到不同的图像。偶尔，我们无法在噪声图像中辨认出数字。\n\n#### 3.2.3 使用 DCGAN 生成伪造动漫人脸和伪造 CelebA\
  \ 图像\n\n动漫人脸数据集（Chao [2019）由 Brian Chao 创建，采用数据库内容许可证 (DbCL)。下载压缩文件并在电脑上解压（7.7 GB）后，你将看到\
  \ 63,632 张高质量的卡通角色人脸图像。这些彩色图像无标签，分辨率从 27 × 27 到 120 × 120 不等。我们使用 Torchvision 中名为\
  \ `ImageFolder` 的工具将这些图像打包成数据集。数据集中的所有图像随后被调整为 64 × 64 的分辨率，每个像素的值被移至 [−1, 1] 范围内。模型\
  \ D 和模型 G 均有五层。动漫人脸数据集的 DCGAN 代码只需更改第 01 个单元格最后一行的图像文件路径，即可用于 CelebFaces Attributes\
  \ 数据集。该数据集包含 202,599 张高分辨率（178 × 218）彩色照片。DCGAN 模型生成的伪造图像如图 3.7 所示。这两个数据集的模型训练时间分别约为\
  \ 44 分钟和 150 分钟。\n\n![](img/bk978-0-7503-6244-3ch3uf14_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch3uf15_pr.gif)\n\
  \n![图 3.7. (A) 使用图 3.8(C) 所示学习率调度器，在模型训练第 20 个轮次由 DCGAN 生成的伪造动漫人脸数据集图像。用于模型训练的真实图像经\
  \ Churchill 和 Chao (2019) 授权复制，许可证为 DbCL v1.0。 (B) 在模型训练第 16 个轮次由 DCGAN 生成的伪造 CelebA\
  \ 图像。CeCelebA 数据集经 Liu et al (2015) 许可使用，由 Ziwei Liu 提供。](img/bk978-0-7503-6244-3ch3f7_online.jpg)\n\
  \n**图 3.7.** (A) 使用图 3.8(C) 所示学习率调度器，在模型训练第 20 个轮次由 DCGAN 生成的伪造动漫人脸数据集图像。用于模型训练的真实图像经\
  \ Churchill 和 Chao (2019) 授权复制，许可证为 DbCL v1.0。 (B) 在模型训练第 16 个轮次由 DCGAN 生成的伪造 CelebA\
  \ 图像。CelebA 数据集经 Liu *et al* (2015) 许可使用，由 Ziwei Liu 提供。\n\n根据 GAN 论文，模型训练使用固定学习率\
  \ (2 × 10^(−4))。在每个包含 20 个轮次的训练过程中，模型 G 的损失函数值增加到 5.0 以上，而模型 D 的损失减少到 0.2 以下。在我的电脑上，使用固定学习率生成的伪造图像质量越来越差。最终，你在所有伪造图像中只能得到一种带有一只眼睛的人脸。这在\
  \ GAN 模型训练中被称为“模式崩溃”现象。这是由较弱的模型 G 和较聪明的模型 D 导致的。就像一个不够聪明、无法理解老师改进作业指导的学生，老师会很容易发现其作业中的错误。仍使用固定学习率，我将模型\
  \ G 的学习率调整为模型 D 学习率的 800%。虽然这些伪造图像的质量有所提高，但我们仍能轻松通过肉眼将其与数据集中的真实图像区分开来。从图 3.8 可以看出，Lambda\
  \ 调度器被用于模型 D 的训练。其学习率在前五个轮次为 10^(−4)，然后指数级下降至模型训练结束时的 10^(−6)。模型 G 的学习率被设置为模型 D\
  \ 学习率的 18 倍。G_lr 和 D_lr 的其他比率（如 10、15、20 和 21）也经测试取得了良好结果。\n\n![](img/bk978-0-7503-6244-3ch3uf16_pr.gif)\n\
  \n![](img/bk978-0-7503-6244-3ch3uf17a_pr.gif)\n\n![](img/bk978-0-7503-6244-3ch3uf17b_pr.gif)\n\
