- pgno: 150
  md: '# Joining strings


    You can join strings, a process called *concatenation*, by using a dot (`.`).
    For instance, you can join strings with the following statements:


    ```

    ```php

    $string1 = ''Hello'';

    $string2 = ''World!'';

    $stringall = $string1.$string2;

    echo $stringall;

    ```

    ```


    The `echo` statement outputs


    ```

    ```text

    HelloWorld!

    ```

    ```


    Notice that no space appears between `Hello` and `World`. That’s because no spaces
    are included in the two strings that are joined. You can add a space between the
    words by using the following concatenation statement rather than the earlier statement:


    ```

    ```php

    $stringall = $string1." ".$string2;

    ```

    ```


    You can use `.= ` to add characters to an existing string. For example, you can
    use the following statements in place of the preceding statements:


    ```

    ```php

    $stringall = "Hello";

    $stringall .= " World!";

    echo $stringall;

    ```

    ```


    The `echo` statement outputs this:


    ```

    ```text

    Hello World!

    ```

    ```


    You can also take strings apart. You can separate them at a given character or
    look for a substring in a string. You use functions to perform these and other
    operations on a string. I explain functions in Chapter 7.


    # Working with Dates and Times


    Dates and times can be important elements in a Web database application. PHP has
    the ability to recognize dates and times and handle them differently than plain
    character strings. Dates and times are stored by the computer in a format called
    a *timestamp*. However, this is not a format in which you or I would want to see
    the date. PHP converts dates from your notation into a timestamp that the computer
    understands and from a timestamp into a format that is familiar to people. PHP
    handles dates and times by using built-in functions.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_151_0.png)


    The timestamp format is a Unix Timestamp, which is an integer that is the number
    of seconds from January 1, 1970 00:00:00 GMT (Greenwich Mean Time) to the time
    represented by the timestamp. This format makes it easy to calculate the time
    between two dates — just subtract one timestamp from the other.


    # Formatting a date


    The function that you will use most often is date. date converts a date or time
    from the timestamp format into a format that you specify. The general format is


    ```

    $mydate = date("format",$timestamp);

    ```


    $timestamp is a variable with a timestamp stored in it. You previously stored
    the timestamp in the variable, using a PHP function as I describe later in this
    section. If $timestamp is not included, the current time is obtained from the
    operating system and used. Thus, you can get today''s date with the following
    statement:


    ```

    $today = date("Y/m/d");

    ```


    If today is August 10, 2003, this statements returns


    ```

    2003/08/10

    ```


    The format is a string that specifies the date format that you want stored in
    the variable. For instance, the format "yy-m-d" returns 03-8-10, and "M.d.yyyy"
    returns Aug.10.2003. Table 6-2 lists some of the symbols that you can use in the
    format string. (For a complete list of symbols, see the documentation at www.php.net.)
    The parts of the date can be separated by hyphens (-), dots (.), forward slashes
    (/), or spaces.


    Table 6-2 Date Format Symbols


    | Symbol | Meaning | Example |

    |---|---|---|

    | M | Month in text, abbreviated | Jan |

    | F | Month in text not abbreviated | January |

    | m | Month in numbers with leading zeros | 02, 12 |

    | n | Month in numbers without leading zeros | 1, 12 |

    | d | Day of the month; two digits with leading zeros | 01, 14 |


    (continued)'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Table 6-2 (continued)


    | Symbol | Meaning | Example |

    |---|---|---|

    | j | Day of the month without leading zeros | 3, 30 |

    | l | Day of the week in text not abbreviated | Friday |

    | D | Day of the week in text as an abbreviation | Fri |

    | w | Day of the week in numbers | From 0 (Sunday) to 6 (Saturday) |

    | Y | Year in four digits | 2002 |

    | y | Year in two digits | 02 |

    | g | Hour between 0 and 12 without leading zeros | 2, 10 |

    | G | Hour between 0 and 24 without leading zeros | 2, 15 |

    | h | Hour between 0 and 12 with leading zeros | 01, 10 |

    | H | Hour between 0 and 24 with leading zeros | 00, 23 |

    | i | Minutes | 00, 59 |

    | s | Seconds | 00, 59 |

    | a | am or pm in lowercase | am, pm |

    | A | AM or PM in uppercase | AM, PM |


    # Storing a timestamp in a variable


    You can assign a timestamp with the current date and time to a variable with the
    following statements:


    ```

    $today = time();

    ```


    Another way to store a current timestamp is with the statement


    ```

    $today = strtotime("today");

    ```


    You can store specific timestamps by using strtotime with various keywords and
    abbreviations that are very much like English. For instance, you can create a
    timestamp for January 15, 2003, as follows:


    ```

    $importantDate = strtotime("January 15 2003");

    ```


    strtotime recognizes the following words and abbreviations:'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   ✔ **Month names:** Twelve month names and abbreviations

    +   ✔ **Days of the week:** Seven days and some abbreviations

    +   ✔ **Time units:** Year, month, fortnight, week, day, hour, minute, second,
    am, pm

    +   ✔ **Some useful English words:** ago, now, last, next, this, tomorrow, yesterday

    +   ✔ **Plus and minus:** + or -

    +   ✔ **All numbers**

    +   ✔ **Time zones:** For example, gmt (Greenwich Mean Time), pdt (Pacific Daylight
    Time), and akst (Alaska Standard Time)


    You can combine the words and abbreviations in a wide variety of ways. The following
    statements are all valid:


    ```

    $importantDate = strtotime("tomorrow");   #24 hours from now

    $importantDate = strtotime("now + 24 hours");

    $importantDate = strtotime("last saturday");

    $importantDate = strtotime("8pm + 3 days");

    $importantDate = strtotime("2 weeks ago"); # at current time

    $importantDate = strtotime("next year gmt"); #1 year from now

    $importantDate = strtotime("this 4am");      # 4 AM today

    ```


    If you wanted to know how long ago $importantDate was, you could subtract it from
    $today. For instance:


    ```

    $timeSpan = $today - $importantDate;

    ```


    This gives you the number of seconds between the important date and today. Or
    use the statement


    ```

    $timeSpan = (($today - $importantDate)/60)/60

    ```


    to find out the number of hours since the important date.


    # Using dates with MySQL


    Often you want to store a date in your MySQL database. For instance, you might
    want to store the date when a customer made an order or the time when a member
    logged in. MySQL also recognizes dates and times and handles them differently
    than plain character strings. However, MySQL handles them differently than PHP.
    In order to use dates and times in your application, you need to understand both
    how PHP handles dates (which I describe in the previous few sections) and how
    MySQL handles dates.


    I discuss the DATE and DATETIME data types for MySQL in detail in Chapter 3. The
    following is a summary.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "+   - **DATE:** MySQL date columns expect dates with the year first, the month\
    \ second, and the day last. The year can be `yyyy` or `yy`. The month can be `mm`\
    \ or `m`. The day can be `dd` or `d`. The parts of the date can be separated by\
    \ a hyphen (-), a forward slash (/), a dot (.), or a space.\n+   - **DATETIME:**\
    \ MySQL datetime columns expect both the date and the time. The date is formatted\
    \ as I describe in the preceding bullet. The date is followed by the time in the\
    \ format `hh:mm:ss`.\n\nDates and times must be formatted in the correct MySQL\
    \ format to store them in your database. PHP functions can be used for formatting.\
    \ For instance, you can format today's date into a MySQL format with this statement:\n\
    \n```\n$today = date(\"Y-m-d\");\n```\n\nYou can format a specific date by using\
    \ the statement\n\n```\n$importantDate = date(\"Y.m.d\",strtotime(\"Jan 15 2003\"\
    ));\n```\n\nYou can then store the formatted date in a database with an SQL query\
    \ like this:\n\n```\nUPDATE Member SET createDate=\"$today\"\n```\n\n# Comparing\
    \ Values\n\nIn programs, you often use *conditional statements*. That is, if something\
    \ is true, your program does one thing, but if something is not true, your program\
    \ does something different. Here are two examples of conditional statements:\n\
    \n```\nif user is a child\n  show toy catalog\nif user is not a child\n  show\
    \ electronics catalog\n```\n\nIn order to know which conditions exist, the program\
    \ must ask questions. Your program then performs tasks based on the answers. Some\
    \ questions (conditions) that you might want to ask — and the actions that you\
    \ might want taken — are\n\n+   - Is the customer a child? If so, display a toy\
    \ catalog.\n+   - Which product has more sales? Display the most popular one first.\n\
    +   - Did the customer enter the correct password? If so, display the Members\
    \ Only Web page.\n+   - Does the customer live in Ohio? If so, display the map\
    \ to the Ohio store location."
