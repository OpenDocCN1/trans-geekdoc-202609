    # Building the database


    Building the database means turning the paper database design into a working database.
    Building the database is independent of the PHP programs that your application
    uses to interact with the database. The database can be accessed using programming
    languages other than PHP, such as Perl, C, or Java. The database stands on its
    own to hold the data.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_82_0.png)


    You should build the database before writing the PHP programs. The PHP programs
    are written to move data in and out of the database, so you can''t develop and
    test them until the database is available.


    The database design names the database and defines the tables that make up the
    database. To build the database, you communicate with MySQL by using the SQL language.
    You tell MySQL to create the database and to add tables to the database. You tell
    MySQL how to organize the data tables and what format to use to store the data.
    Detailed instructions for building the database are provided in Chapter 4.


    # Writing the programs


    Your programs perform the tasks for your Web database application. They create
    the display that the user sees in the browser window. They make your application
    interactive by accepting and processing information typed in the browser window
    by the user. They store information in the database and get information out of
    the database. The database is useless unless you can move data in and out of it.


    The plan that you develop (as I discuss in the earlier sections in this chapter)
    outlines the programs that you need to write. In general, each task in your plan
    calls for a program. If your plan says that your application will display a form,
    you need a program that displays a form. If your plan says that your application
    will store the data from a form, you need a program that gets the data from the
    form and puts it in the database.


    The PHP language was developed specifically to write interactive Web applications.
    It has the built-in functionality needed to make writing application programs
    as painless as possible. It has methods that were included in the language specifically
    to access data from forms. It has methods to put data into a MySQL database, and
    it has methods to get data from a MySQL database. Detailed instructions for writing
    PHP programs are provided in Part III of this book.'
  merge: -1
