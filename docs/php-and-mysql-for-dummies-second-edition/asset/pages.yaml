    # Using functions to get data


    In most applications, you get data from the database. Often you get the data in
    more than one location in your program or more than one program in your application.
    Functions — blocks of statements that perform certain specified tasks — are designed
    for such situations. (I explain functions in detail in Chapter 7.)


    A function to get data from the database can be really useful. Whenever the program
    needs to get data, you call the function. Not only do functions save you a lot
    of typing, but they also make the program easier for you to follow.


    For example, consider a product catalog, such as the Pet Catalog. You will need
    to get information about a specific product many times. You can write a function
    that gets the data and then use that function whenever you need data.


    Listing 8-3 for program getdata.php shows how to use a function to get data. The
    function in Listing 8-3 will get the information for any single pet in the Pet
    Catalog. The pet information is put into an array, and the array is returned to
    the main program. The main program can then use the information any way that it
    wants. In this case, it echoes the pet information to a Web page.'
  merge: -1
  img_proc: true
