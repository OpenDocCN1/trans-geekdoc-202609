  md: "function rather than the main program, it would connect every time that you\
    \ called the function. It's more efficient to connect only once, if possible.\n\
    \n+   - If you only have one connection, `mysql_select_db` will use that connection.\
    \ If you have more than one connection, you can pass the connection and use it\
    \ in your `mysql_select_db` function call. If your application only uses one database,\
    \ you can select that database once in the main program instead of selecting it\
    \ in the function.\n+   - The function call sends the string \"Unicorn\". In most\
    \ cases, the function call will use a variable name.\n+   - The program creates\
    \ the variable `$petInfo` to receive the data from the function. `$petInfo` is\
    \ an array because the information stored in it is an array.\n\nThe preceding\
    \ function is very simple — it returns one row of the results as an array. But\
    \ functions can be more complex. The preceding section provides a program to get\
    \ all the pets of a specified type. The program getPets.php in Listing 8-4 uses\
    \ a function for the same purpose. The function returns a multidimensional array\
