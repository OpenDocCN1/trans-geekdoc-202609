  md: '# Moving Data In and Out of the Database


    An empty database is like an empty cookie jar — it''s not much fun. And, searching
    an empty database is no more interesting or fruitful than searching an empty cookie
    jar. A database is only useful with respect to the information that it holds.


    A database needs to be able to receive information for storage and to deliver
    information on request. For instance, the MemberDirectory database needs to be
    able to receive the member information, and it also needs to be able to deliver
    its stored information when you request it. For instance, if you want to know
    the address of a particular member, the database needs to deliver that information
    when you request it.


    Your MySQL database responds to four types of requests:


    +   - **Adding information:** Adding a row to a table.

    +   - **Updating information:** Changing information in an existing row. This
    includes adding data to a blank field in an existing row.

    +   - **Retrieving information:** Looking at the data. This request does not remove
    data from the database.

    +   - **Removing information:** Deleting data from the database.


    Sometimes your question requires information from more than one table. For instance,
    the question, “How much does a green dragon cost?” requires information from the
    Pet table and from the Color table. You can ask this question easily in a single
    SELECT query by combining the tables.


    In the following sections, I discuss how to receive and deliver information as
    well as how to combine tables.


    # Adding information


    Every database needs data. For example, you might want to add data to your database
    so that your users can look at it — an example of this is the Pet Catalog that
    I introduce in Chapter 3. Or you might want to create an empty database for users
    to put data into, making the data available for your eyes only — an example of
    this is the Member Directory. In either scenario, data will be added to the database.


    If your data is still on paper, you can enter it directly into a MySQL database,
    one row at a time, by using an SQL query. However, if you have a lot of data,
    this process could be tedious and involve a lot of typing. Suppose that you'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'have information on 1,000 products that needs to be added to your database.
    Assuming that you''re greased lightening on a keyboard and can enter a row per
    minute, that''s 16 hours of rapid typing — well, rapid editing, anyway. Doable,
    but not fun. On the other hand, suppose that you need to enter 5,000 members of
    an organization into a database and that it takes five minutes to enter each member.
    Now you''re looking at over 400 hours of typing — who has time for that?


    If you have a large amount of data to enter, consider some alternatives. Sometimes
    scanning in the data is an option. Or perhaps you need to beg, borrow, or hire
    some help. In many cases, it could be faster to enter the data into a big text
    file than to enter each row in a separate SQL query.


    The SQL query LOAD can read data from a big text file (or even a small text file).
    So, if your data is already in a computer file, you can work with that file; you
    don''t need to type all the data again. Even if the data is in a format other
    than a text file (for example, in an Excel, Access, or Oracle file), you can usually
    convert the file to a big text file, which can then be read into your MySQL database.
    If the data isn''t yet in a computer file and there''s a lot of it, it might be
    faster to enter that data into the computer in a big text file and transfer it
    into MySQL as a second step.


    Most text files can be read into MySQL, but some formats are easier than others.
    If you''re planning to enter the data into a big text file, read the section,
    “Adding a bunch of data,” to find the best format for your text file. Of course,
    if the data is already on the computer, you have to work with the file as it is.


    # Adding one row at a time


    You use the INSERT query to add a row to a database. This query tells MySQL which
    table to add the row to and what the values are for the fields in the row. The
    general form of the query is


    ```

    INSERT INTO tablename (columnname, columnname,...,columnname)

    VALUES (value, value,...,value)

    ```


    The following rules apply to the INSERT query:


    +   - **Values must be listed in the same order in which the column names are
    listed.** The first value in the value list is inserted into the column that''s
    named first in the column list; the second value in the value list is inserted
    into the column that''s named second in the column list; and so on.

    +   - **A partial column list is allowed.** You don''t need to list all the columns.
    Columns that are not listed are given their default value or left blank if no
    default value is defined.'
  merge: -1
  img_proc: true
