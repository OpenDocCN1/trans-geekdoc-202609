- pgno: 129
  md: "Again, if you access MySQL through an IT department or through a Web hosting\
    \ company, you need to ask the MySQL administrator to restore your database from\
    \ a backup. If you’re the MySQL administrator, you can restore it yourself.\n\n\
    As I describe in Chapter 4, you build a database by creating the database and\
    \ then adding tables to the database. The backup that you create with the mysqldump\
    \ utility is a file that contains all the SQL statements necessary to rebuild\
    \ all the tables, but it does not contain the statements needed to create the\
    \ database.\n\nYour database might not exist at all, or it could exist with one\
    \ or more corrupted tables. You can restore the entire database or any single\
    \ table. Follow these steps to restore a single table:\n\n```\nDROP TABLE tablename\n\
    ```\n\n+   1. **If the table currently exists, delete the table with the following\
    \ SQL query:**\n+   \n+   ```\n+   DROP TABLE tablename\n+   ```\n+   where *tablename*\
    \ is the table that you want to delete.\n+   \n+   2. **Point your browser at\
    \ mysql_send.php.**\n+   For a description of mysql_send.php, see Chapter 4.\n\
    +   \n+   3. **Copy the CREATE query for the table from the backup file into the\
    \ form in the browser window.**\n+   For instance, choose Edit→Copy and Edit→Paste.\n\
    +   \n+   4. **Type the name of the database in which you are restoring the table.**\n\
    +   The form shows where to type the database name.\n+   \n+   5. **Click Submit.**\n\
    +   A new Web page shows the results of the query.\n+   \n+   6. **Click New Query.**\n\
    +   \n+   7. **Copy an INSERT query for the table from the backup file into the\
    \ form in the browser window.**\n+   For instance, choose Edit→Copy and Edit→Paste.\n\
    +   \n+   8. **Type the name of the database in which you are restoring the table.**\n\
    +   The form shows where to type the database name.\n+   \n+   9. **Click Submit.**\n\
    +   A new Web page shows the results of the query.\n+   \n+   10. **Click New\
    \ Query.**\n+   \n+   11. **Repeat Steps 7–10 until all the INSERT queries from\
    \ the backup file have been sent.**"
