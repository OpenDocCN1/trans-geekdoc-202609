  md: "# Getting Information in Files\n\nSometimes you want to receive an entire file\
    \ of information from a user, such as user résumés for your job-search Web site\
    \ or pictures for your photo album Web site. Or, suppose that you’re building\
    \ the catalog from information supplied by Sales. In addition to descriptive text\
    \ about the product, you want Sales to provide you with a picture of the product.\
    \ You can provide a form that Sales can use to upload an image file.\n\n# Using\
    \ a form to upload the file\n\nYou can display a form that allows a user to upload\
    \ a file by using an HTML form designed for that purpose. The general format of\
    \ the form is as follows:\n\n```\n<form enctype=\"multipart/form-data\"\n    action=\"\
    processfile.php\" method=\"POST\">\n    <input type=\"hidden\" name=\"MAX_FILE_SIZE\"\
    \ value=\"30000\">\n    <input type=\"file\" name=\"user_file\">\n    <input type=\"\
    submit\" value=\"Upload File\">\n</form>\n```\n\nNotice the following points regarding\
    \ the form:\n\n+   - **The enctype attribute is used in the form tag.** You must\
    \ set this attribute to `multipart/form-data` when uploading a file to ensure\
    \ that the file arrives correctly.\n+   - **A hidden field is included that sends\
    \ a value (in bytes) for MAX_FILE_SIZE.** If the user tries to upload a file that\
    \ is larger than this value, it won’t upload. You can set this value as high as\
    \ 2MB. If you need to upload a file larger than that, you need to change the default\
    \ setting for `upload_max_filesize` in `php.ini` to a larger number before sending\
    \ a value larger than 2MB for `MAX_FILE_SIZE` in the hidden field.\n+   - **The\
    \ input field that uploads the file is of type file.** Notice that the field has\
    \ a name — `user_file` — as do other types of fields in a form. The filename that\
    \ the user enters into the form is sent to the processing program and is available\
    \ in the built-in array called `FILES`. I explain the structure and information\
    \ in `FILES` in the following section.\n\nWhen the user submits the form, the\
    \ file is uploaded to a temporary location. The script that processes the form\
    \ needs to copy the file to another location because the temporary file is deleted\
    \ as soon as the script is finished."
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Processing the uploaded file


    Information about the uploaded file is stored in the PHP built-in array called
    $_FILES. An array of information is available for each file that was uploaded,
    resulting in $_FILES being a multidimensional array. As with any other form, you
    can obtain the information from the array by using the name of the field. The
    following is the array available from $_FILES for each file that is uploaded.


    ```

    $_FILES[''fieldname''][''name'']

    $_FILES[''fieldname''][''type'']

    $_FILES[''fieldname''][''tmp_name'']

    $_FILES[''fieldname''][''size'']

    ```


    For example, suppose that you use the following field to upload a file, as shown
    in the previous section:


    ```

    <input type="file" name="user_file">

    ```


    If the user uploads a file named test.txt by using the form, the resulting array
    that can be used by the processing program looks something like this:


    ```

    $_FILES[user_file][name] = test.txt

    $_FILES[user_file][type] = text/plain

    $_FILES[user_file][tmp_name] = D:\WINNT\php92C.tmp

    $_FILES[user_file][size] = 435

    ```


    In this array, name is the name of the file that was uploaded, type is the type
    of file, tmp_name is the path/filename of the temporary file, and 435 is the size
    of the file. Notice that name contains only the filename, but tmp_name includes
    the path to the file as well as the filename.


    If the file is too large to upload, the tmp_name in the array is set to none,
    and the size is set to 0. The processing program must move the uploaded file from
    the temporary location to a permanent location. The general format of the statement
    that moves the file is as follows:


    ```

    move_uploaded_file(path/tempfilename,path/permfilename);

    ```


    The path/tempfilename is available in the built-in array element $_FILES[''fieldname''][''tmp_file''].
    The path/permfilename is the path to the file where you want to store the file.
    The following statement moves the file uploaded in the input field, given the
    name user_file, shown earlier in this section:


    ```

    move_uploaded_file($_FILES[''user_file''][''tmp_name''],

    ''c:\data\new_file.txt'');

    ```'
  merge: -1
  img_proc: true
