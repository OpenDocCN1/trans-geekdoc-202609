  md: 'After the following sort statement


    ```

    sort($pets);

    ```


    the array becomes


    ```

    $pets[0] = "dragon";

    $pets[1] = "tiger";

    $pets[2] = "unicorn";

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_177_0.png)


    If you use sort() to sort an array with words as keys, the keys will be changed
    to numbers, and the word keys will be thrown away.


    To sort arrays that have words for keys, use the asort statement as follows:


    ```

    asort($capitals);

    ```


    This statement sorts the capitals by value but keeps the original key for each
    value instead of assigning a number key. For instance, consider the state capitals
    array created in the preceding section:


    ```

    $capitals[''CA''] = "Sacramento";

    $capitals[''TX''] = "Austin";

    $capitals[''OR''] = "Salem";

    ```


    After the following sort statement


    ```

    asort($capitals);

    ```


    the array becomes


    ```

    $capitals[''TX''] = "Austin";

    $capitals[''CA''] = "Sacramento";

    $capitals[''OR''] = "Salem";

    ```


    Notice that the keys stayed with the value when the elements were reordered. Now
    the elements are in alphabetical order, and the correct state key is still with
    the appropriate state capital. If the keys had been numbers, the numbers would
    now be in a different order. For example, if the original array were


    ```

    $capitals[1] = "Sacramento";

    $capitals[2] = "Austin";

    $capitals[3] = "Salem";

    ```


    after an asort statement, the new array would be


    ```

    $capitals[2] = Austin

    $capitals[1] = Sacramento

    $capitals[3] = Salem

    ```'
