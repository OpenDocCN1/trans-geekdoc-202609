    +   3. **Exit WinMySQLadmin by right-clicking in the WinMySQLadmin window and\
    \ then choosing Hide Me.**\n\n# On Windows NT/2000/XP\n\nTo set up the MySQL server\
    \ so that it starts every time the computer boots, set it up as a service. The\
    \ installation procedure might have set it up as a service. You can check whether\
