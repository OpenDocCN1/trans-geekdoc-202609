- pgno: 172
  md: '```

    $counter=0;

    $counter++;

    echo $counter;

    ```


    This echo statement also outputs 1 because ++ adds 1 to the current value of $counter.
    Or you can use the following statement:


    ```

    $counter--;

    ```


    This statement subtracts 1 from the current value of $counter.


    Sometimes you may want to do a different arithmetic operation. You can use any
    of the following shortcuts:


    ```

    $counter+=2;

    $counter-=3;

    $counter*=2;

    $counter/=3;

    ```


    These statements add 2 to $counter, subtract 3 from $counter, multiply $counter
    by 2, and divide $counter by 3, respectively.


    # Using exit


    Sometimes you want the program to stop executing — just stop at some point in
    the middle of the program. For instance, if the program encounters an error, often
    you want it to stop rather than continue with more statements. The exit statement
    stops the program. No more statements are executed after the exit statement. The
    format of an exit statement is


    ```

    exit("message");

    ```


    The message is a message that is output when the program exits. For instance,
    you might use the statement


    ```

    exit("The program is exiting");

    ```


    You can also stop the program with the die statement, as follows:


    ```

    die("The program is dying");

    ```


    The die statement is the same as the exit statement. die is just another name
    for exit. Sometimes it''s just more fun to say die.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Using function calls


    *Functions* are blocks of statements that perform certain specified tasks. You
    can think of functions as mini-programs or subprograms. The block of statements
    is stored under a function name, and you can execute the block of statements any
    place you want by *calling* the function by its name. (For details on how to use
    functions, check out the section, “Using Functions,” later in this chapter.)


    You can call a function by listing its name followed by parentheses, like this:


    ```

    functionname();

    ```


    For instance, you might have a function that gets all the names of customers that
    reside in a certain state from the database and displays the names in a list in
    the format *last name, first name*. You write the statements that do these tasks
    and store them as a function under the name `get_names`. Then when you call the
    function, you need to specify which state. You can use the following statement
    at any location in your program to get the list of customer names from the given
    state, which in this case is California:


    ```

    get_names(''CA'');

    ```


    The value in the parentheses is given to the function so it knows which state
    you’re specifying. This is *passing* the value. You can pass a list of values.


    PHP provides many built-in functions. For example, in Chapter 6, I discuss a built-in
    function called `unset`. You can uncreate a variable named `$testvar` by using
    this function call:


    ```

    unset($testvar);

    ```


    # Using PHP Arrays


    Arrays are complex variables. An *array* stores a group of values under a single
    variable name. An array is useful for storing related values. For instance, you
    can store information about a shirt (such as size, color, and cost) in a single
    array named `$shirtinfo`. Information in an array can be handled, accessed, and
    modified easily. For instance, PHP has several methods for sorting an array.


    The following few sections give you the lowdown on arrays.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Creating arrays


    The simplest way to create an array is to assign a value to a variable with square
    brackets ([ ]) at the end of its name. For instance, assuming that you have not
    referenced $pets at any earlier point in the program, the following statement
    creates an array called $pets:


    ```

    $pets[1] = "dragon";

    ```


    At this point, the array named $pets has been created and has only one value —
    dragon. Next, you use the following statements:


    ```

    $pets[2] = "unicorn";

    $pets[3] = "tiger";

    ```


    Now the array $pets contains three values: dragon, unicorn, and tiger.


    An array can be viewed as a list of key/value pairs. To get a particular value,
    you specify the key in the brackets. In the preceding array, the keys are numbers
    — 1, 2, and 3. However, you can also use words for keys. For instance, the following
    statements create an array of state capitals:


    ```

    $capitals[''CA''] = "Sacramento";

    $capitals[''TX''] = "Austin";

    $capitals[''OR''] = "Salem";

    ```


    You can use shortcuts rather than write separate assignment statements for each
    number. One shortcut uses the following statements:


    ```

    $pets[] = "dragon";

    $pets[] = "unicorn";

    $pets[] = "tiger";

    ```


    When you create an array using this shortcut, the values are automatically assigned
    keys that are serial numbers, starting with the number 0. For example, the following
    statement


    ```

    echo "$pets[0]";

    ```


    sends the following output:


    ```

    dragon

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_174_0.png)


    The first value in an array with a numbered index is 0 unless you deliberately
    set it to a different number. One common mistake when working with arrays is to
    think of the first number as 1 rather than 0.


    An even better shortcut is to use the following statement:'
