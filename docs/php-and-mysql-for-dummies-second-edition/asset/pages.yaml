  md: '# Creating a new database


    To create a new, empty database, use the following SQL query:


    ```

    CREATE DATABASE databasename

    ```


    where databasename is the name that you give the database. For instance, these
    two SQL queries create the sample databases used in this book:


    ```

    CREATE DATABASE PetCatalog

    CREATE DATABASE MemberDirectory

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_93_0.png)


    Some Web hosting companies don’t allow you to create a new database. You are given
    one database to use with MySQL, and you can only create tables in this one database.
    You can try requesting another database, but you need a good reason. MySQL and
    PHP don’t care that all your tables are in one database instead of organized into
    databases with meaningful names. It’s just easier for humans to keep track of
    projects when they’re organized.


    To see for yourself that a database was in fact created, use this SQL query:


    ```

    SHOW DATABASES

    ```


    After you create an empty database, you can add tables to it. (Adding tables to
    a database is described later in this chapter.)


    # Deleting a database


    You can delete any database with this SQL query:


    ```

    DROP DATABASE databasename

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_93_1.png)


    Use DROP carefully because it is irreversible. After a database is dropped, it
    is gone forever. And any data that was in it is gone as well.


    # Adding tables to a database


    You can add tables to any database, whether it’s a new, empty database that you
    just created or an existing database that already has tables and data in it. You
    use the CREATE query to add tables to a database.


    In the sample database designs that I introduce in Chapter 3, the PetCatalog database
    is designed with three tables: Pet, PetType, and PetColor. The MemberDirectory
    database is designed with two tables: Member and Login. Because a table is created
    in a database, you must indicate the database name where you want the table created.
    That is, when using the form shown'
