- pgno: 263
  md: 'cases, the information that the user enters needs to allow pretty much anything.
    For instance, you normally wouldn''t allow the characters < and > in a field.
    However, there might be a situation in which the user needs to enter these characters
    — perhaps the user needs to enter a technical formula or specification that requires
    them.


    PHP provides two functions that can clean the data, thus rendering it harmless:


    strip_tags: This function removes all text enclosed by < and > from the data.
    It looks for an opening < and removes it and everything else, until it finds a
    closing > or reaches the end of the string. You can include specific tags that
    you want to allow. For instance, the following statement removes all tags from
    a character string except <b> and <i>:


    ```

    $last_name = strip_tags($last_name, "<b><i>");

    ```


    htmlspecialchars: This function changes some special characters with meaning to
    HTML into an HTML format that allows them to be displayed without any special
    meaning. The changes are


    +   - < becomes &lt;

    +   - > becomes &gt;

    +   - & becomes &amp;


    In this way, the characters < and > can be displayed on a Web page without being
    interpreted by HTML as tags. The following statement changes these special characters:


    ```

    $last_name = htmlspecialchars($last_name);

    ```


    If you''re positive that you don''t want to allow your users to type any < or
    > characters into a form field, use strip_tags. However, if you want to allow
    < or > characters, you can safely store them after they have been processed by
    htmlspecialchars.


    Another function that you should use before storing data in your database is trim.
    Users often type spaces at the beginning or end of a text field without meaning
    to. Trim removes any leading or trailing spaces so they don''t get stored. Use
    the following statement to remove these spaces:


    ```

    $last_name = trim($_POST[''last_name'']);

    ```


