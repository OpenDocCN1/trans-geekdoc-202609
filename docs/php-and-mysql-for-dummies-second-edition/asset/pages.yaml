- pgno: 254
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_254_0.png)


    Remember, programs that process forms use the information from the form. If you
    run them by themselves, they don’t have any information passed from the form and
    will not run correctly. These programs are intended to run when the user presses
    the submit button for a form.


    Don’t forget the exit statement. Without the exit statement, the program would
    continue and would display the welcome message after displaying the form.


    Figure 8-13 shows the Web page that results if the user didn’t enter his or her
    first or middle name. Notice that the list of missing information doesn’t include
    Middle Name because Middle Name is not required. Also, notice that the information
    the user originally typed into the form is still displayed in the form fields.


    # Checking the format of the information


    Whenever users must type information in a form, you can expect a certain number
    of typos. You can detect some of these errors when the form is submitted, point
    out the error(s) to the user, and then request that he or she retype the information.
    For instance, if the user types 8899776 in the ZIP code field, you know this is
    not correct. This information is too long to be a ZIP code and too short to be
    a ZIP+4 code.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_254_1.png)


    Figure 8-13:

    The result of processing a form with missing information.'
