- pgno: 402
  md: '# ## On Windows 98/Me


    You can start and stop your server with WinMySQLadmin, a program that was installed
    with MySQL. The WinMySQLadmin program is responsible for displaying the traffic
    signal in your system tray. If the traffic signal is displayed, WinMySQL is running.
    If the traffic signal is not in your tray, you need to start WinMySQLadmin.


    If WinMySQLadmin is not running, you might be able to start it from your Startup
    menu: Choose Start➜Programs➜Startup➜WinMySQLadmin. If you can’t find it on your
    Startup menu, use Windows Explorer to navigate to the bin directory in the directory
    where MySQL is installed (for example, `C:\mysql\bin`) and double-click WinMySQLadmin.
    When it’s started, you should be able to see the traffic signal in your system
    tray.


    To start or stop the MySQL server by using WinMySQLadmin, follow these steps:


    +   1. **Right-click the traffic signal in your system tray.**

    +      You see a short menu.

    +   2. **Select your operating system: Windows 9x.**

    +   3. **To start or stop, click either Start the Server or Stop the Server.**

    +   4. **Exit WinMySQLadmin by right-clicking in the WinMySQLadmin window and
    then clicking Hide Me.**


    # ## On Windows NT/2000/XP


    You can start your MySQL server directly by navigating to the `bin` subdirectory
    in the directory where MySQL is installed (such as `C:\mysql\bin`) and then double-clicking
    the file `mysqld.exe`.


    The above procedure might not work if the WinMySQLadmin program isn’t running
    (if there is no traffic signal on your system tray). In this case, you can either
    start the WinMySQL program by double-clicking it or start the MySQL server with
    a DOS Window console. If you are having problems, it is often useful to start
    the server with a console because some helpful error messages will be displayed.


    To start the MySQL server with a console, follow these steps:


    +   1. **Open a command prompt window.**

    +      For instance, choose Start➜Programs➜Accessories➜Command Prompt.

    +   2. **Change to the bin directory for MySQL.**

    +      For instance, `CD C:\mysql\bin`.'
  merge: -1
  img_proc: true
- pgno: 403
