- pgno: 65
  md: 'Here are a few examples:


    +   - An online catalog needs a database containing product information.

    +   - An online order application needs a database that can hold customer information
    and order information.

    +   - A travel Web site needs a database with information on destinations, reservations,
    fares, schedules, and so on.


    In many cases, your application might include a task that collects information
    from the user. You''ll have to balance your urge to collect all the potentially
    useful information that you can think of against your users'' reluctance to give
    out personal information — as well as their avoidance of forms that look too time-consuming.
    One compromise is to ask for some optional information. The users who don''t mind
    can enter it, but users who object can leave it blank. Another possibility is
    to offer an incentive: The longer the form is, the stronger the incentive that
    you''ll need to motivate the user to fill out the form. A user might be willing
    to fill out a very short form to enter a sweepstakes that offers two sneak-preview
    movie tickets for a prize. But if the form is long and complicated, the prize
    needs to be more valuable, such as a free trip to California and a tour of a Hollywood
    movie studio.


    In the first example application, your customers search the online catalog for
    information on pets that they might want to buy. You want customers to see information
    that will motivate them to buy a pet. The information that you want to have available
    in the database for the customer to see is


    +   - **The name of the pet**

    +     For example, poodle, unicorn, and so on

    +   - **A description of the pet**

    +   - **A picture of the pet**

    +   - **The cost of the pet**


    In the second example application, the Members Only section, you want to store
    information about registered members. The information that you want to store in
    the database is


    +   - Member name

    +   - Member address

    +   - Member phone number

    +   - Member fax number

    +   - Member e-mail address'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_66_0.png)


    Take the time to develop a comprehensive list of the information that you need
    to store in your database. Although you can change and add information to your
    database after it’s developed, including the information from the beginning is
    easier. Also, if you add information to the database later — after it’s in use
    — the first users in the database will have incomplete information. For example,
    if you change your form so that it now asks for the user’s age, you won’t have
    the age for the people who have already filled out the form and are already in
    the database.


    # # Organizing the data


    MySQL is a *RDBMS (Relational Database Management System)*, which means that the
    data is organized into tables. (See Chapter 1 for more on MySQL.) You can establish
    relationships between the tables in the database.


    # ## Organizing data in tables


    RDBMS tables are organized like other tables that you’re used to — in rows and
    columns, as shown in Figure 3-1. The place where a particular row and column intersect,
    the individual cell, is a *field*.


    |  | Column 1 | Column 2 | Column 3 | Column 4 |

    |---|---|---|---|---|

    | Row 1 |  |  |  |  |

    | Row 2 |  |  |  |  |

    | Row 3 |  |  |  |  |

    | Row 4 |  |  |  |  |

    | Row 5 |  |  |  |  |


    *Field indicated in the Row 3, Column 3 cell.*


    **Figure 3-1:** MySQL data is organized into tables.


    The focus of each table is an *object* (a thing) that you want to store information
    about. Here are some examples of objects:


    +   - Customers

    +   - Products

    +   - Companies'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - ✓ Animals

    +   - ✓ Cities

    +   - ✓ Rooms

    +   - ✓ Books

    +   - ✓ Computers

    +   - ✓ Shapes

    +   - ✓ Documents

    +   - ✓ Projects

    +   - ✓ Weeks


    You create a table for each object. The table name should clearly identify the
    objects that it contains with a descriptive word or term. The name must be a character
    string with no spaces in it. The table name can contain letters, numbers, underscores
    (_), or dollar signs ($). It''s customary to name the table in the singular. Thus,
    a name for a table of customers might be `Customer`, and a table containing customer
    orders might be named `CustomerOrder`. Upper- and lowercase is significant on
    Linux/Unix but not on Windows: CustomerOrder and Customerorder are the same to
    Windows — but not to Linux or Unix.


    In database talk, an object is an *entity*, and an entity has *attributes*. In
    the table, each row represents an entity, and the columns contain the attributes
    of each entity. For example, in a table of customers, each row contains information
    for a single customer. Some of the attributes contained in the columns might be
    first name, last name, phone number, age, and so on.


    Here are the steps for organizing your data into tables:


    +   1. **Name your database.**

    +      Assign a name to the database for your application. For instance, a database
    containing information about households in a neighborhood might be named `HouseholdDirectory`.

    +   2. **Identify the objects.**

    +      Look at the list of information that you want to store in the database.
    (If you haven''t done this yet, check out the section, “Choosing the data,” earlier
    in this chapter.) Analyze your list and identify the objects. For instance, the
    `HouseholdDirectory` database might need to store the following:

    +      - Name of each family member

    +      - Address of the house

    +      - Phone number'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   - Age of each household member

    +   - Favorite breakfast cereal of each household member


    When you analyze this list carefully, you realize that you''re storing information
    about two objects: the household and the household members. That is, the address
    and phone number are for the household in general, but the name, age, and favorite
    cereal are for a particular household member.


    # 3. Define and name a table for each object.


    For instance, the HouseholdDirectory database needs a table called Household and
    a table called HouseholdMember.


    # 4. Identify the attributes for each object.


    Analyze your information list and identify the attributes that you need to store
    for each object. Break the information to be stored into its smallest reasonable
    pieces. For example, when storing the name of a person in a table, you can break
    down the name into first name and last name. Doing this enables you to sort by
    the last name, which would be more difficult if the first and last name were stored
    together. In fact, you can even break down the name into first name, middle name,
    and last name, although not many applications need to use the middle name separately.


    # 5. Define and name columns for each separate attribute that you identified in
    Step 4.


    Give each column a name that clearly identifies the information in that column.
    The column names should be one word, with no spaces. For example, you might have
    columns named firstName and lastName or first_name and last_name.


    Some words are reserved by MySQL or SQL for its own use and can''t be used as
    column names. The words are currently used in SQL statements or are reserved for
    future use. For example, ADD, ALL, AND, CREATE, DROP, GROUP, ORDER, RETURN, SELECT,
    SET, TABLE, USE, WHERE, and many, many more can''t be used as column names. For
    a complete list of reserved words, see the online MySQL manual at www.mysql.com/doc/en/Reserved_words.html.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_68_0.png)


    # 6. Identify the primary key.


    Each row in a table needs a unique identifier. No two rows in a table should be
    exactly the same. When you design your table, you decide which column holds the
    unique identifier, called the primary key. The primary key can be more than one
    column combined. In many cases, your object attributes will not have a unique
    identifier. For example, a customer table might not have a unique identifier because
    two customers can have the same name. When there is no unique identifier column,
    you need to add a column specifically to be the primary key. Frequently, a column
    with a sequence number is used for this purpose. For example, in Figure 3-2, the
    primary key is the cust_id field because each customer has a unique ID number.'
  merge: -1
  img_proc: true
