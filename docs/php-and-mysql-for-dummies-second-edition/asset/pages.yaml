- pgno: 408
  md: '# 11. Create a link to the new directory so that you can refer to it by a shorter
    name, rather than its current, difficult-to-type name. Type the following:


    ```

    ln -s newdirectoryname mysql

    ```


    For example:


    ```

    ln -s mysql-4.0.17-sun-solaris2.9-sparc-64bit mysql

    ```


    Now you can refer to the directory as mysql, instead of by its long name.


    # 12. Change to the new directory by typing cd mysql.


    You should see several subdirectories, including /bin and /scripts.


    # 13. Add the path to the bin directory (for example, /usr/local/mysql/bin) to
    your system path so that the MySQL programs can be accessed by any programs that
    need to access MySQL.


    You should do this by editing the file that sets the system variables when your
    computer starts up.


    # 14. Type the following:


    ```

    scripts/mysql_install_db

    ```


    This command runs a script that initializes your MySQL databases.


    # 15. Make sure that the ownership and group membership of your MySQL directories
    are correct. Set the ownership with these commands:


    ```

    chown -R root /usr/local/mysql

    chown -R mysql /usr/local/mysql/data

    chgrp -R mysql /usr/local/mysql

    ```


    These commands make root the owner of all the MySQL directories except data and
    make mysql the owner of data. All MySQL directories belong to group mysql.


    # 16. Set up your computer so that MySQL starts automatically when your machine
    starts by copying the file mysql.server from /usr/local/mysql/support-files to
    the location where your system has its startup files.


    # 17. To test MySQL, you can start your server manually, without restarting your
    computer, by typing the following:


    ```

    bin/safe_mysqld --user=mysql &

    ```


    # 18. To test that MySQL is running okay, type


    ```

    bin/mysqladmin --version

    ```


    You should see the version number of your MySQL server.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# From source files


    Before you decide to install MySQL from source files, check for binary files for
    your operating system. MySQL binary files are precompiled, ready-to-install packages
    for installing MySQL. MySQL binary files are very convenient and reliable.


    You install MySQL by downloading source files, compiling the source files, and
    installing the compiled programs. This process sounds terribly technical and daunting,
    but it’s not. Read all the way through the following steps before you begin the
    installation procedure.


    To install MySQL from source code, follow these steps:


    +   1. **Point your Web browser to www.mysql.com, the MySQL home page.**

    +   2. **Click the Production version number link.**

    +      Look in the list on the right side of the screen, labeled MySQL Products.
    Look for the section under the Database Server heading. As of this writing, the
    production release is 4.0.17.

    +   3. **Scroll to the bottom of the screen to the Source Downloads heading.**

    +      This section lists several downloads.

    +   4. **Locate the tarball version and click the download link next to it.**

    +      A dialog box opens.

    +   5. **Select the option to save the file.**

    +      A box opens that lets you select where the file will be saved.

    +   6. **Navigate to where you want to install MySQL and then click Save.**

    +      The standard location is `/usr/local`. It is best to use the standard location
    if possible.

