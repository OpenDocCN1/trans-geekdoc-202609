    \ This message explains to the user that some required information is missing.\n\
    +      ii. Displays a list of missing information. Loops through $blank_array\
    \ and displays the label(s).\n+      iii. Displays the form. Because the form\
    \ includes variable names in the value attribute, the information that the user\
