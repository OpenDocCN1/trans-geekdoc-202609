  md: 'popular, so many RPMs enable support for it, but it is out of your control.
    Also, an RPM usually enables all the most popular options, so an RPM might enable
    options that you don’t need. Consequently, the simplest and most efficient way
    to install PHP could be from the source. If you’re familiar with RPMs, feel free
