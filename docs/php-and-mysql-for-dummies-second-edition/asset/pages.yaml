    ```


    The tables might take a short time to restore. Wait for the command to finish.
    If a problem occurs, an error message is displayed. If no problems occur, you
    see no output. When the command is finished, the prompt appears.


    Your database is now restored with all the data that was in it at the time the
    copy was made. If the data has changed since the copy was made, the changes are
