- pgno: 143
  md: "You can go even further and uncreate the variable by using this statement:\n\
    \n```\nunset($age);\n```\n\nAfter this statement is executed, the variable $age\
    \ no longer exists.\n\nA variable keeps its information for the whole program,\
    \ not just for a single PHP section. If a variable is set to \"yes\" at the beginning\
    \ of a file, it will still hold \"yes\" at the end of the page. For instance,\
    \ suppose your file has the following statements:\n\n```\n<p>Hello World!\n<?php\n\
    \    $age = 15;\n    $name = \"Harry\";\n?>\n<br>Hello World again!<br>\n<?php\n\
    \    echo $name;\n?>\n```\n\nThe echo statement in the second PHP section will\
    \ display Harry. The Web page resulting from these statements is\n\n```\nHello\
    \ World!\nHello World again!\nHarry\n```\n\n# Dealing with notices\n\nIf you use\
    \ a statement that includes a variable that does not exist, you might get a notice.\
    \ It depends on the error message level that PHP is set to. Remember that notices\
    \ aren't the same as error messages; notices don't mean the program can't run\
    \ — the program does continues to run. Notices just tell you that you're doing\
    \ something unusual and to take a second look at what you're doing to be sure\
    \ that you really want to do it. (See the sidebar, “Error messages and warnings.”)\
    \ For instance, suppose you use the following statements:\n\n```\nunset($age);\n\
    echo $age;\n$age2 = $age;\n```\n\nYou might see two notices: one for the second\
    \ statement and one for the third statement. The notices will look something like\
    \ this:\n\n```\nNotice: Undefined variable: age in testing.php on line 9\n```"
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Suppose that you definitely want to use these statements. The program works
    exactly the way you want it to. The only problems are the unsightly notices. You
    can prevent notices within a program by inserting an at sign (@) at the point
    where the notice would be issued. For instance, you can prevent the notices generated
    by the preceding statements if you change the statements to this:


    ```

    unset($age);

    echo @$age;

    $age2 = @$age;

    ```


    If you are the PHP administrator, you can change the error message level so that
    notices are not displayed. For details on how to do this, check out the sidebar,
    “Error messages and warnings,” elsewhere in this chapter.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_144_0.png)


    # Using PHP Constants


    PHP constants are very similar to variables. Constants are given a name, and a
    value is stored in them. However, constants are constant; that is, they can’t
    be changed by the program. After you set the value for a constant, it stays the
    same. If you used a constant for age and set it to 29, it can’t be changed. Wouldn’t
    that be nice — 29 forever?


    Constants are used when information is used several places in the program and
    doesn’t change during the program. It’s useful to set a constant for the value
    at the beginning of the program and use it throughout the program. By making it
    a constant instead of a variable, you make sure that it won’t get changed accidentally.
    By giving it a name, you know what the information is instantly. And by setting
    a constant once at the start of the program (instead of using the value throughout
    the program), you can change the value in one place if it needs changing instead
    of hunting for it in many places in the program to change it.


    For instance, you might set a constant that’s the company name and a constant
    that’s the company address and use them wherever needed. Then, if the company
    moved, you could just change the value in the company address at the start of
    the program instead of having to find every place in your program that echoed
    the company name to change it.


    Constants are set by using the define statement. The format is


    ```

    define("constantname","constantvalue");

    ```'
  merge: -1
