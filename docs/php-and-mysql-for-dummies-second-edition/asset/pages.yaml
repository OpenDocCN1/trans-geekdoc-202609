  md: '# Table B-1 (continued)


    | Option | Tells PHP To |

    |---|---|

    | infodir=DIR | Install info documentation in DIR. Default is PREFIX/info. |

    | mandir=DIR | Install man files in DIR. Default is PREFIX/man. |

    | with-config-file-path=DIR | Look for the configuration file (php.ini) in DIR.
    Without this option, PHP looks for the configuration file in a default location,
    usually /usr/local/lib. |

    | disable-libxml | Disables XML support that''s included be default. |

    | enable-ftp | Enable FTP support. |

    | enable-magic-quotes | Enable automatic escaping of quotes with a backslash.
    |

    | with-apxs=FILE | Build a shared Apache module using the apxs utility located
    at FILE. Default FILE is apxs. |

    | with-apxs2=FILE | Build a shared Apache 2 module using the apxs utility located
    at FILE. Default FILE is apxs. |

    | with-mysql=DIR | Enable support for MySQL 4.0 or earlier databases. Default
    DIR where MySQL is located is /usr/local. |

    | with-mysqli=DIR | Enable support for MySQL 4.1 or later databases. DIR needs
    to be the path to the file named mysql_config that was installed with 4.1. |

