  md: "# Updating existing information\n\nYou update existing information with the\
    \ UPDATE query, as I describe in Chapter 4. Updating means changing data in the\
    \ columns of rows that are already in the database — not adding new rows to the\
    \ database table. The general format is\n\n```\n$query = \"UPDATE tablename SET\
    \ col=value WHERE col=value\";\n$result = mysql_query($query)\n    or die (\"\
    Couldn't execute query.\");\n```\n\nFor instance, the statements to update the\
    \ phone number for Goliath Smith are\n\n```\n$firstName = \"Goliath\";      //\
    \ from form field\n$lastName = \"Smith\";          // from form field\n$phone\
    \ = \"555-555-5555\";      // from form field\n$query = \"UPDATE Member SET phone='$phone'\n\
    \          WHERE lastName='$lastName'\n          AND firstName='$firstName'\"\
    ;\n$result = mysql_query($query)\n    or die (\"Couldn't execute query.\");\n\
    ```\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_268_0.png)\n\nIf you don’t use\
    \ a WHERE clause in an UPDATE query, the field that is SET is set for all the\
    \ rows. That is seldom what you want to do.\n\nListing 8-16 shows a program called\
    \ updatePhone.php that stores a name and a phone number from a form.\n\n# Listing\
    \ 8-16: Program That Updates Data\n\n```\n<?php\n/* Program name: updatePhone.php\n\
    \ * Description: Program checks the phone number for incorrect format. Updates\n\
    \ * the phone number in the database for the specified name.\n */\n?>\n<html>\n\
    <head><title>Member Phone Number</title></head>\n<body>\n<?php\n$phone = strip_tags(trim($_POST['phone']));\n\
    $phone = ereg_replace(\"[^0-9]\",\"\",$phone);\n$first_name = $_POST['first_name'];\n\
    $last_name = $_POST['last_name'];\n\n/* check information from the form */\n\n\
    /* set up array of field labels */\n$label_array = array ( \"first_name\" => \"\
    First Name\",\n                       \"last_name\" => \"Last Name\",\n```"
