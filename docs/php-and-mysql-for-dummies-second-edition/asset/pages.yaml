- pgno: 214
  md: "![](img/d82df0828cfbc6d6be1e9a991861f3b7_214_0.png)\n\nThe *addr* includes\
    \ a port number that is needed for the connection. Almost always, the port number\
    \ is 3306. On rare occasions, the MySQL administrator needs to set up MySQL to\
    \ connect on a different port. In these cases, the port number is required for\
    \ the connection. The port number is specified as *hostname:portnumber*. For instance,\
    \ you might use *localhost:8080*.\n\nWith these statements, `mysql_connect` attempts\
    \ to open a connection to the named computer, using the account name and password\
    \ provided. If the connection fails, the program stops running at this point and\
    \ sends *message* to the browser.\n\nThe following statement connects to the MySQL\
    \ server on the local computer by using a MySQL account named *catalog* that does\
    \ not require a password:\n\n```\n```php\n$connection = mysql_connect(\"localhost\"\
    ,\"catalog\",\"\")\n    or die (\"Couldn't connect to server.\");\n```\n```\n\n\
    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_214_1.png)\n\nFor security reasons, it’s\
    \ a good idea to store the connection information in variables and use the variables\
    \ in the connection statement, as follows:\n\n```\n```php\n$host=\"localhost\"\
    ;\n$user=\"catalog\";\n$password=\"\";\n$connection = mysql_connect($host,$user,$password)\n\
    \    or die (\"Couldn't connect to server.\");\n```\n```\n\nIn fact, for even\
    \ more security, you can put the assignment statements for the connection information\
    \ in a separate file in a hidden location so that the account name and password\
    \ aren’t even in the program. I explain how to do this in Chapter 10.\n\nThe variable\
    \ `$connection` contains information that identifies the connection. You can have\
    \ more than one connection open at a time by using more than one variable name.\
    \ A connection remains open until you close it or until the program ends. You\
    \ close a connection as follows:\n\n```\n```php\nmysql_close($connectionname);\n\
    ```\n```\n\nFor instance, to close the connection in the preceding example, use\
    \ this statement:\n\n```\n```php\nmysql_close($connection);\n```\n```\n\n# ##\
    \ Selecting the right database\n\nAfter the connection to the MySQL server is\
    \ established and open, you need to tell MySQL which database you want to interact\
    \ with. Use the `mysql_select_db` function as follows:"
  merge: -1
  img_proc: true
- pgno: 215
  md: "```\n```php\n$db = mysql_select_db(\"databasename\",$connectionname)\n    \
    \ or die (\"message\");\n```\n```\n\nFill in the following information:\n\n+ \
    \  - `databasename`: The name of the database.\n+   - `connectionname`: The variable\
    \ that contains the connection information. If you don’t enter a connection, PHP\
    \ uses the last connection that was opened.\n+   - `message`: The message that\
    \ is sent to the browser if the database can’t be selected. The selection might\
    \ fail because the database can’t be found, which is usually the result of a typo\
    \ in the database name.\n\nFor instance, you can select the database `PetCatalog`\
    \ with the following statement:\n\n```\n```php\n$db = mysql_select_db(\"PetCatalog\"\
    ,$connection)\n     or die (\"Couldn't select database.\");\n```\n```\n\nIf `mysql_select_db`\
    \ is unable to select the database, the program stops running at this point, and\
    \ the message `Couldn't select database.` is sent to the browser.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_215_0.png)\n\
    \nFor security reasons, it’s a good idea to store the database name in a variable\
    \ and use the variable in the connection statement, as follows:\n\n```\n```php\n\
    $database = \"PetCatalog\";\n$db = mysql_select_db($database,$connection)\n  \
    \   or die (\"Couldn't select database.\");\n```\n```\n\nIn fact, for even more\
    \ security, you can put the assignment statement for the database name in a separate\
    \ file in a hidden location — as suggested for the assignment statements for the\
    \ connection information — so that the database name isn’t even in the program.\
    \ I explain how to do this in Chapter 10.\n\nThe database stays selected until\
    \ you explicitly select a different database. To select a different database,\
    \ just use a new `mysql_select_db` function statement.\n\n# ## Sending SQL queries\n\
    \nAfter you have an open connection to the MySQL server and PHP knows which database\
    \ you want to interact with, you send your SQL query. The *query* is a request\
    \ to the MySQL server to store some data, update some data, or retrieve some data.\
    \ (See Chapter 4 for more on the SQL language and how to build SQL queries.)"
  merge: -1
  img_proc: true
- pgno: 216
  md: "To interact with the database, put your SQL query into a variable and send\
    \ it to the MySQL server by using the function mysql_query, as in the following\
    \ example:\n\n```\n$query = \"SELECT * FROM Pet\";\n$result = mysql_query($query)\n\
    \    or    die (\"Couldn't execute query.\");\n```\n\nThe query is executed on\
    \ the currently selected database for the last connection that you opened. If\
    \ you need to — if you have more than one connection open, for instance — you\
    \ can send the query to a specific database server like this:\n\n```\n$result\
    \ = mysql_query($query,$connection)\n    or    die (\"Couldn't execute query.\"\
    );\n```\n\nThe variable $result holds information on the result of executing the\
    \ query. The information depends on whether or not the query gets information\
    \ from the database:\n\n+   - **For queries that don't get any data:** The variable\
    \ $result contains information on whether the query executed successfully or not.\
    \ If it's successful, $result is set to TRUE; if it's not successful, $result\
    \ is set to FALSE. Some queries that don't return data are INSERT and UPDATE.\n\
    +   - **For queries that return data:** The variable $result contains a result\
    \ identifier that identifies where the returned data is located and not the returned\
    \ data itself. Some queries that do return data are SELECT and SHOW.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_216_0.png)\n\
    \nThe use of single and double quotes can be a little confusing when assigning\
    \ the query string to $query. You are actually using quotes on two levels: the\
    \ quotes needed to assign the string to $query and the quotes that are part of\
    \ the SQL language query itself. The following rules will help you avoid any problems\
    \ with quotes:\n\n+   - Use double quotes at the beginning and end of the string.\n\
    +   - Use single quotes before and after variable names.\n+   - Use single quotes\
    \ before and after any literal values.\n\nThe following are examples of assigning\
    \ query strings:\n\n```\n$query = \"SELECT firstName FROM Member\";\n$query =\
    \ \"SELECT firstName FROM Member WHERE lastName='Smith'\";\n$query = \"UPDATE\
    \ Member SET lastName='$last_name'\";\n```\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_216_1.png)\n\
    \nThe query string itself does not include a semicolon (;), so don't put a semicolon\
    \ inside the final quote. The only semicolon is at the very end; this is the PHP\
    \ semicolon that ends the statement."
  merge: -1
  img_proc: true
- pgno: 217
  md: "# Getting Information from a Database\n\nGetting information from a database\
    \ is a common task for Web database applications. Here are two common uses for\
    \ information from the database:\n\n+   - **Use the information to conditionally\
    \ execute statements.** For instance, you might get the state of residence from\
    \ the Member Directory and send different messages to members who live in different\
    \ states.\n+   - **Display the information in a Web page.** For instance, you\
    \ might want to display product information from your database.\n\nIn order to\
    \ use the database information in a program, you need to put the information in\
    \ variables. Then you can use the variables in conditional statements, echo statements,\
    \ or other statements. Getting information from a database is a two-step process:\n\
    \n+   1. You build a SELECT query and send the query to the database. When the\
    \ query is executed, the selected data is stored in a temporary location.\n+ \
    \  2. You move the data from the temporary location into variables and use it\
    \ in your program.\n\n# Sending a SELECT query\n\nYou use the SELECT query to\
    \ get data from the database. SELECT queries are written in the SQL language.\
    \ (I discuss the SELECT query in detail in Chapter 4.)\n\nTo get data from the\
    \ database, build the SELECT query that you need, storing it in a variable, and\
    \ then send the query to the database. The following statements select all the\
    \ information from the Pet table in the PetCatalog database:\n\n```\n$query =\
    \ \"SELECT * FROM Pet\";\n$result = mysql_query($query)\n    or    die (\"Couldn't\
    \ execute query.\");\n```\n\nThe mysql_query function gets the data requested\
    \ by the SELECT query and stores it in a temporary location. You can think of\
    \ this data as being stored in a table, similar to a MySQL table, with the information\
    \ in rows and columns.\n\nThe function returns a result identifier that contains\
    \ the information needed to find the temporary location where the data is stored.\
    \ In the preceding statements, the result identifier is put into the variable\
    \ $result. The next step after executing the function is to move the data from\
    \ its temporary location into variables that can be used in the program."
  merge: -1
  img_proc: true
- pgno: 218
  md: "If the function fails — for instance, if the query is incorrect — `$result`\
    \ contains `FALSE`.\n\n# ## Getting and using the data\n\nYou use the `mysql_fetch_array`\
    \ function to get the data from the temporary location. The function gets one\
    \ row of data from the temporary location. The temporary data table might contain\
    \ only one row of data or, more likely, your select query resulted in more than\
    \ one row of data in the temporary data table. If you need to fetch more than\
    \ one row of data from the temporary location, you use the `mysql_fetch_array`\
    \ function in a loop.\n\n# ### Getting one row of data\n\nTo move the data from\
    \ its temporary location and put it into variables that you can use in your program,\
    \ you use the PHP function `mysql_fetch_array`. The general format for the `mysql_fetch_array`\
    \ function is\n\n```\n```php\n$row = mysql_fetch_array($resultidentifier,typeofarray);\n\
    ```\n```\n\nThis statement gets one row from the data table in the temporary location\
    \ and puts it in an array variable called `$row`. Fill in the following information:\n\
    \n+   - **`resultidentifier`**: The variable that points to the temporary location\
    \ of the results.\n+   - **`typeofarray`**: The type of array that the results\
    \ are put into. It can be one of two types of arrays or both types. Use one of\
    \ the following values:\n+     - `MYSQL_NUM`: An array with a key/value pair for\
    \ each column in the row using numbers as keys.\n+     - `MYSQL_ASSOC`: An array\
    \ with a key/value pair for each column in the row using the column names as keys.\n\
    +     - `MYSQL_BOTH`: An array with both types of keys. In other words, the array\
    \ has two key/value pairs for each column: one with a number as the key and one\
    \ with the column name as the key. If no array type is given in the function call,\
    \ `MYSQL_BOTH` is assumed.\n\nThe `mysql_fetch_array` function gets one row of\
    \ data from the temporary location. In some cases, one row is all you selected.\
    \ For instance, to check the password entered by a user, you only need to get\
    \ the user’s password from the database and compare it with the password that\
