- pgno: 190
  md: "The following statements set the sales tax rate for different states:\n\n```\n\
    switch ( $custState )\n{\n    case \"OR\" :\n        $salestaxrate = 0;\n    \
    \    break;\n    case \"CA\" :\n        $salestaxrate = 1.0;\n        break;\n\
    \    default:\n        $salestaxrate = .5;\n        break;\n}\n$salestax = $orderTotalCost\
    \ * $salestaxrate;\n```\n\nIn this case, the tax rate for Oregon is 0, the tax\
    \ rate for California is 100 percent, and the tax rate for all the other states\
    \ is 50 percent. The switch statement looks at the value of $custState and skips\
    \ to the section that matches the value. For instance, if $custState is TX, the\
    \ program executes the default section and sets $salestaxrate to .5. After the\
    \ switch statement, the program computes $salestax at .5 times the cost of the\
    \ order.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_190_0.png)\n\nThe break statements\
    \ are essential in the case section. If a case section does not include a break\
    \ statement, the program does not stop executing at the end of the case section.\
    \ The program continues executing statements past the end of the case section,\
    \ on to the next case section, and continues until it reaches the end of the switch\
    \ statement (or perhaps a break statement in a later case section).\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_190_1.png)\n\
    \nThe last case section in a switch statement doesn't actually require a break\
    \ statement. You can leave it out. However, it's a good idea to include it for\
    \ clarity.\n\n# Using Loops\n\nLoops, which are used frequently in programs, set\
    \ up a block of statements that repeat. Sometimes, the loop repeats a specified\
    \ number of times. For instance, a loop to echo all the state capitals needs to\
    \ repeat 50 times. Sometimes, the loop repeats until a certain condition exists.\
    \ For instance, a loop that displays product information for all the products\
    \ needs to repeat until it has displayed all the products, regardless of how many\
    \ products there are. Here are three types of loops:\n\n+   ✔ Basic for loop:\
    \ Sets up a counter; repeats a block of statements until the counter reaches a\
    \ specified number\n+   ✔ while loop: Sets up a condition; checks the condition;\
    \ and if it is true, repeats a block of statements"
  merge: -1
  img_proc: true
- pgno: 191
  md: "✓ do..while loop: Sets up a condition; executes a block of statements; checks\
    \ the condition; if the condition is true, repeats the block of statements\n\n\
    I describe each of these loops in detail in the following few sections.\n\n# Using\
    \ for loops\n\nThe most basic for loops are based on a counter. You set the beginning\
    \ value for the counter, set the ending value, and set how the counter is incremented.\
    \ The general format is\n\n```\nfor (startingvalue;endingcondition;increment)\n\
    {\n    block of statements;\n}\n```\n\nFill in the following values:\n\n+   -\
    \ *startingvalue*: A statement that sets up a variable to be your counter and\
    \ sets it to your starting value. For instance, the statement `$i=1;` sets `$i`\
    \ as the counter variable and sets it equal to 1. Frequently, the counter variable\
    \ is started at 0 or 1. The starting value can be a combination of numbers (2\
    \ + 2) or a variable.\n+   - *endingcondition*: A statement that sets your ending\
    \ value. As long as this statement is true, the block of statements keeps repeating.\
    \ When this statement is not true, the loop ends. For instance, the statement\
    \ `$i<10;` sets the ending value for the loop to 10. When `$i` is equal to 10,\
    \ the statement is no longer true (because `$i` is no longer less than 10), and\
    \ the loop stops repeating. The statement can include variables, such as `$i<$size;`.\n\
    +   - *increment*: A statement that increments your counter. For instance, the\
    \ statement `$i++;` adds 1 to your counter at the end of each block of statements.\
    \ You can use other increment statements, such as `$i+=1;` or `$i--;`.\n\nThe\
    \ basic for loop sets up a variable — for example, a variable called $i, — that\
    \ is a counter. This variable has a value during each loop. The variable $i can\
    \ be used in the block of statements that is repeating. For instance, the following\
    \ simple loop displays Hello World! three times:\n\n```\nfor ($i=1;$i<=3;$i++)\n\
    {\necho \"$i. Hello World!<br>\";\n}\n```"
  merge: -1
  img_proc: true
- pgno: 192
  md: "![](img/d82df0828cfbc6d6be1e9a991861f3b7_192_0.png)\n\nThe statements in the\
    \ block do not need to be indented. PHP doesn't care whether they're indented.\
    \ However, indenting the blocks makes it much easier for you to understand the\
    \ program.\n\nThe output from these statements is\n\n```\n1. Hello World!\n2.\
    \ Hello World!\n3. Hello World!\n```\n\nfor loops are particularly useful to loop\
    \ through an array. Suppose that you have an array of customer names and want\
    \ to display them all. You can do this easily with a loop:\n\n```\nfor ($i=0;$i<100;$i++)\n\
    {\n    echo \"$customerNames[$i]<br>\";\n}\n```\n\nThe output displays a Web page\
    \ with a list of all the customer names, one on each line. In this case, you know\
    \ that you have 100 customer names, but suppose that you don't know how many customers\
    \ are in this list. You can ask PHP how many values are in the array and use that\
    \ value in your for loop. For example, you can use the following statements:\n\
    \n```\nfor ($i=0;$i<sizeof($customerNames);$i++)\n{\n    echo \"$customerNames[$i]<br>\"\
    ;\n}\n```\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_192_1.png)\n\n# Advanced\
    \ for loops\n\nThe structure of a for loop is quite flexible and allows you to\
    \ build loops for almost any purpose. A for loop has this general format:\n\n\
    ```\nfor ( beginning statements;\n    conditional statements;\n    ending statements)\n\
    {\n    block of statements;\n}\n```\n\nWhere\n\n+   - The beginning statements\
    \ execute once at the start of the loop.\n+   - The conditional statements are\
    \ tested for each iteration of the loop.\n+   - The ending statements execute\
    \ once at the end of the loop."
  merge: -1
  img_proc: true
- pgno: 193
  md: "Each of the statement sections is separated by a semicolon (;). Each section\
    \ can contain as many statements as needed, separated by commas. Any section can\
    \ be empty.\n\nThe following loop has statements in all three sections:\n\n```\n\
    for ($i=0,$j=1;$t<=4;$i++,$j++)\n{\n  $t = $i + $j;\n  echo \"$t<br>\";\n}\n```\n\
    \nThe output of these statements is\n\n1\n3\n5\n\nThe loop is executed in the\
    \ following order:\n\n+   1. The beginning section containing two statements is\
    \ executed; $i is set to 0, and $j is set to 1.\n+   2. The conditional section\
    \ containing one statement is evaluated. Is $t less than or equal to 4? Yes, so\
    \ the statement is true. The loop continues to execute.\n+   3. The statements\
    \ in the statement block are executed. $t becomes equal to $i plus $j, which is\
    \ 0 + 1, which equal 1. Then $t is echoed to give the output 1.\n+   4. The ending\
    \ section containing two statements is executed — $i++ and $j++. One is added\
    \ to $i so it equals 1, and 1 is added to $j so that it now equals 2.\n+   5.\
    \ The conditional section is evaluated. Is $t less than or equal to 4? Because\
    \ $t is equal to 1 at this point, the statement is true. The loop continues to\
    \ execute.\n+   6. The statements in the statement block are executed. $t becomes\
    \ equal to $i plus $j, which is 1 + 2, which equal 3. Then $t is echoed to give\
    \ the output 3.\n+   7. The ending section containing two statements is executed\
    \ — $i++ and $j++. One is added to $i so it equals 2, and 1 is added to $j so\
    \ that it equals 3.\n+   8. The conditional section is evaluated. Is $t less than\
    \ or equal to 4? Because $t now equals 3, the statement is true. The loop continues\
    \ to execute.\n+   9. The statements in the statement block are executed. $t becomes\
    \ equal to $i plus $j, which is 2 + 3, which equal 5. Then $t is echoed to give\
    \ the output 5.\n+   10. The ending section containing two statements is executed\
    \ — $i++ and $j++. One is added to $i so it equals 3, and one is added to $j so\
    \ that it equals 4.\n+   11. The conditional section is evaluated. Is $t less\
    \ than or equal to 4? Because $t now equals 5, the statement is not true. The\
    \ loop does not continue to execute. The loop ends, and the program continues\
    \ to the next statement after the end of the loop."
  merge: -1
  img_proc: true
