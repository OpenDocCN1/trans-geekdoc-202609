- pgno: 145
  md: 'For instance, to set a constant with the company name, use the following statement:


    ```

    define("COMPANY","ABC Pet Store");

    ```


    Now use the constant in your program wherever you need your company name:


    ```

    echo COMPANY;

    ```


    When you echo a constant, you can''t enclose it in quotes. If you do, it will
    echo the constant name, instead of the value. You can echo it without anything,
    as shown in the preceding example, or enclosed with parentheses.


    You can use any name for a constant that you can use for a variable, but constant
    names do not begin with a dollar sign ($). By convention, constants are given
    names that are all uppercase, so you can see easily that they''re constants. However,
    PHP itself doesn''t care what you name a constant. You can store either a string
    or a number in it. The following statement is perfectly okay with PHP:


    ```

    define ("AGE",29);

    ```


    Just don''t expect Mother Nature to believe it.


    # Working with Numbers


    PHP allows you to do arithmetic operations on numbers. You indicate arithmetic
    operations with two numbers and an arithmetic operator. For instance, one operator
    is the plus (+) sign, so you can indicate an arithmetic operation like this:


    ```

    1 + 2

    ```


    You can also perform arithmetic operations with variables that contain numbers,
    as follows:


    ```

    $n1 = 1;

    $n2 = 2;

    $sum = $n1 + $n2;

    ```


    Table 6-1 shows the arithmetic operators that you can use.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '**Table 6-1 Arithmetic Operators**


    | Operator | Description |

    |---|---|

    | + | Add two numbers together. |

    | - | Subtract the second number from the first number. |

    | * | Multiply two numbers together. |

    | / | Divide the first number by the second number. |

    | % | Find the remainder when the first number is divided by the second number.
    This is called *modulus*. For instance, in `$a = 13 % 4`, `$a` is set to 1. |


    You can do several arithmetic operations at once. For instance, the following
    statement performs three operations:


    ```

    ```php

    $result = 1 + 2 * 4 + 1;

    ```

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_146_0.png)


    The order in which the arithmetic is performed is important. You can get different
    results depending on which operation is performed first. PHP does multiplication
    and division first, followed by addition and subtraction. If other considerations
    are equal, PHP goes from left to right. Consequently, the preceding statement
    sets $result to 10, in the following order:


    ```

    ```php

    $result = 1 + 2 * 4 + 1    (first, it does the multiplication)

    $result = 1 + 8 + 1        (next, it does the leftmost addition)

    $result = 9 + 1            (next, it does the remaining addition)

    $result = 10

    ```

    ```


    You can change the order in which the arithmetic is performed by using parentheses.
    The arithmetic inside the parentheses is performed first. For instance, you can
    write the previous statement with parentheses like this:


    ```

    ```php

    $result = (1 + 2) * 4 + 1;

    ```

    ```


    This statement sets $result to 13, in the following order:


    ```

    ```php

    $result = (1 + 2) * 4 + 1   (first, it does the math in the parentheses)

    $result = 3 * 4 + 1         (next, it does the multiplication)

    $result = 12 + 1            (next, it does the addition)

    $result = 13

    ```

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_146_1.png)


    On the better-safe-than-sorry principle, it''s best to use parentheses whenever
    more than one answer is possible.


    Often, the numbers that you work with are dollar amounts, such as product prices.
    You want your customers to see prices in the proper format on Web pages. In other
    words, dollar amounts should always have two decimal'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'places. However, PHP stores and displays numbers in the most efficient format.
    If the number is 10.00, it is displayed as 10. To put numbers into the proper
    format for dollars, you can use sprintf. The following statement formats a number
    into a dollar amount:


    ```

    $newvariablename = sprintf("%01.2f", $oldvariablename);

    ```


    This statement reformats the number in $oldvariablename and stores it in the new
    format in $newvariablename. For example, the following statements display money
    in the correct format:


    ```

    $price = 25;

    $f_price = sprintf("%01.2f",$price);

    echo "$f_price<br>";

    ```


    You see the following on the Web page:


    ```

    25.00

    ```


    sprintf can do more than format decimal places. For more information on using
    sprintf to format values, see Chapter 13.


    If you want commas to separate thousands in your number, you can use number_format.
    The following statement creates a dollar format with commas:


    ```

    $price = 25000;

    $f_price = number_format($price,2);

    echo "$f_price<br>";

    ```


    You see the following on the Web page:


    ```

    25,000.00

    ```


    The 2 in the number_format statement sets the format to two decimal places. You
    can use any number to get any number of decimal places.


    # Working with Character Strings


    A character string is a series of characters. Characters are letters, numbers,
    and punctuation. When a number is used as a character, it is just a stored character,
    the same as a letter. It can''t be used in arithmetic. For instance, a phone number
    is stored as a character string because it only needs to be stored — not added
    or multiplied.


    When you store a character string in a variable, you tell PHP where the string
    begins and ends by using double quotes or single quotes. For instance, the following
    two statements are the same.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '```

    $string = "Hello World!";

    $string = ''Hello World!'';

    ```


    Suppose that you wanted to store a string as follows:


    ```

    $string = ''It is Tom''s house'';

    echo $string;

    ```


    These statements won''t work because when PHP sees the '' (single quote) after
    Tom, it thinks that this is the end of the string and displays the following:


    ```

    It is Tom

    ```


    You need to tell PHP to interpret the single quote ('') as an apostrophe instead
    of the end of the string. You can do this by using a backslash (\\) in front of
    the single quote. The backslash tells PHP that the single quote does not have
    any special meaning; it''s just an apostrophe. This is escaping the character.
    Use the following statements to display the entire string:


    ```

    $string = ''It is Tom\''s house'';

    echo $string;

    ```


    Similarly, when you enclose a string in double quotes, you must also use a backslash
    in front of any double quotes in the string.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_148_0.png)


    # Single-quoted strings versus double-quoted strings


    Single-quoted and double-quoted strings are handled differently. Single-quoted
    strings are stored literally, with the exception of \'' , which is stored as an
    apostrophe. In double-quoted strings, variables and some special characters are
    evaluated before the string is stored. Here are the most important differences
    in the use of double or single quotes when writing programs:


    ✓ **Handling variables:** If you enclose a variable in double quotes, PHP uses
    the value of the variable. However, if you enclose a variable in single quotes,
    PHP uses the literal variable name. For example, if you use the following statements:


    ```

    $age = 12;

    $result1 = "$age";

    $result2 = ''$age'';

    echo $result1;

    echo "<br>";

    echo $result2;

    ```'
  merge: -1
  img_proc: true
