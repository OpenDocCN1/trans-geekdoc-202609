- pgno: 170
  md: 'Also, notice that the two lines are echoed on the same line. If you want a
    new line to start, you have to send a signal indicating the start of a new line.
    To signal that a new line starts here in PHP, echo the special character \n. Change
    the echo statements to the following:


    ```

    echo "line 1\n";

    echo "line 2";

    ```


    Now you get what you want, right? Well, actually no. Now you see the following
    on the Web page:


    ```

    line 1 line 2

    ```


    If you look at the source code, you see this:


    ```

    line 1

    line 2

    ```


    So, the \n did its job: It started a new line in the output. However, HTML displays
    the output on the Web page as one line. If you want HTML to display two lines,
    you must use a tag, such as the <br> tag. So, change the PHP end-of-line special
    character to an HTML tag, as follows:


    ```

    echo "line 1<br>";

    echo "line 2";

    ```


    Now you see what you want on the Web page:


    ```

    line 1

    line 2

    ```


    If you look at the source code for this output, you see this:


    ```

    line 1<br>line 2

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_170_0.png)


    Use \n liberally. Otherwise, your HTML source code will have some really long
    lines. For instance, if you echo a long form, the whole thing might be one long
    line in the source code, even though it looks fine in the Web page. Use \n to
    break the HTML source code into reasonable lines. Taking the extra time to add
    these breaks will pay off if you have to troubleshoot a Web page that doesn''t
    look the way you expected. It''s much easier to examine the source code if it''s
    not a mile-long line.


    # Using assignment statements


    Assignment statements are statements that assign values to variables. The variable
    name is listed to the left of the equal sign; the value to be assigned to the
    variable is listed to the right of the equal sign. Here is the general format:'
