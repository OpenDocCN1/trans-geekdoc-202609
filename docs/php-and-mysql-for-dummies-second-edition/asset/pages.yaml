  md: 'becomes totally bizarre during development (as a result of programming errors
    or my weird sense of humor), I can re-create the data table in a moment. Just
    DROP the table, re-create it with the SQL query, and reread the sample data.


    For example, the data file for the Pet table might look like this:


    ```

    <TAB>Pekinese<TAB>Dog<TAB>Small, cute, energetic. Good alarm system.<TAB>100.00<TAB>peke.jpg

    <TAB>House cat<TAB>Cat<TAB>Yellow and white cat. Extremely playful.<TAB>20.00<TAB>catyellow.jpg

    <TAB>House cat<TAB>Cat<TAB>Black cat. Sleek, shiny. Likes children.<TAB>20.00<TAB>catblack.jpg

    <TAB>Chinese Bearded Dragon<TAB>Lizard<TAB>Grows up to 2 feet long. Fascinating
    to watch. Likes to be held.<TAB>100.00<TAB>lizard.jpg

    <TAB>Labrador Retriever<TAB>Dog<TAB>Black dog. Large, intelligent retriever. Often
    selected as guide dogs for the blind.<TAB>100.00<TAB>lab.jpg

    <TAB>Goldfish<TAB>Fish<TAB>Variety of colors. Inexpensive. Easy care. Good first
    pet for small children.<TAB>2.00<TAB>goldfish.jpg

    <TAB>Shark<TAB>Fish<TAB>Sleek. Powerful. Handle with care.<TAB>200.00<TAB>shark.jpg

    <TAB>Asian Dragon<TAB>Dragon<TAB>Long and serpentine. Often gold or red.<TAB>10000.00<TAB>dragona.jpg

    <TAB>Unicorn<TAB>Horse<TAB>Beautiful white steed with spiral horn on forehead.<TAB>20000.00<TAB>unicorn.jpg

    ```


    These are the data file rules:


    +   - ✔ The <TAB> tags represent real tabs — the kind that you create by pressing
    the Tab key.

    +   - ✔ Each line represents one pet and must be entered without pressing the
    Enter or Return key. The lines in the preceding example are shown wrapped to more
    than one line so that you can see the whole line. However, in the actual file,
    the data lines are one on each line.

    +   - ✔ A tab appears at the beginning of each line because the first field is
    not being entered. The first field is the petID, which is entered automatically;
    you don’t need to enter it. However, you do need to use a tab so that MySQL knows
    there’s a blank field at the beginning.


    You can then use an SQL query to read the data file into the Pet table:


    ```

    LOAD DATA LOCAL INFILE "pets" INTO TABLE Pet;

    ```


    Any time that the data table gets odd, you can re-create it and read the data
    in again.'
