    # Before installing


    Before beginning to install PHP, check the following:


    ✓ **The Apache module mod_so is installed.** It usually is. To display a list
    of all the modules, type the following:


    ```

    httpd -l

    ```


    You might have to be in the directory where httpd is located before the command
    will work. The output usually shows a long list of modules. All you need to be
    concerned with for PHP is mod_so. If mod_so is not loaded, Apache must be reinstalled
    using the enable-module=so option.


    ✓ **The apxs utility is installed.** apxs is installed when Apache is installed.
    You should be able to find a file called apxs. If Apache were installed on Linux
    from an RPM, apxs might not have been installed. Some RPMs for Apache consist
    of two RPMs: one for the basic Apache server and one for Apache development tools.
    Possibly the RPM with the development tools, which installs apxs, needs to be
    installed.


    ✓ **Apache version is recent.** See Appendix C for information about Apache versions.


    To check the version, type the following:


    ```

    httpd --v

    ```


    You might have to be in the directory where httpd is located before the command
    will work.


    # Installing


    To install PHP on Unix/Linux with an Apache Web server, follow these steps:


    +   1. Point your Web browser to www.php.net, the PHP home page.

    +   2. Click Downloads.

    +   3. Click the latest version of the PHP source code, which is version 5.0.0
    as of this writing.


    The file you are about to download contains many files compressed into one file
    — a tarball.


    A dialog box opens.'
