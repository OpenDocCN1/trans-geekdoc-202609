- pgno: 371
  md: '124 Lines 124–132 check whether the Member ID submitted by the customer is
    already a loginName in the database table Member. The loginName must be unique.
    $num equals 0 or 1, depending on whether the loginName is found in the database.


    133 Starts an if block that executes if the loginName is already in the database.
    The new member cannot be added if the Member ID is not unique. The block performs
    the following tasks: 1) Unsets $do. 2) Creates an error message that explains
    the problem. 3) Shows the login form again, including the error message. 4) Stops
    the program and waits for the user to submit the form again with a different Member
    ID.


    141 Starts an else block if the loginName is not already in the database. This
    is a successful application for a member account. The block inserts a new row
    in the Member table for the new member account and sends an e-mail message to
    the customer about the new account. The statements in the block are documented
    in more detail in the following list:


    143 Sets $today to today''s date in the correct format for the createDate field
    in the Member table.


    144 Creates an INSERT query to add the new member row. Notice that the password
    is encrypted as password('' $newpass'' ) when it is entered. This is a security
    method so that no one who looks in the database can see the password. If you''re
    totally sure that no one will see the database that shouldn''t, encryption isn''t
    really necessary.


    150 Executes the INSERT query.


    151 In lines 151 and 152, the two session variables, $auth and $logname, are stored
    in the SESSION array.


    154 Lines 154–163 send an e-mail to the new member, verifying the Member ID and
    password. Notice that the e-mail message is created in the variable $emess over
    several lines. It begins in line 154 and is added to (by using .=) on each line
    until it finishes on line 160. This is to make it easier for humans to read —
    not because PHP needs this. Unlike HTML content that ignores extra spaces and
    line ends, extra spaces and other things have an effect on an e-mail message.
    For instance, if I created one long message — with extra spaces to indent it so
    that I could read it — those spaces would show up in the e-mail. So, I set the
    message on several lines that I can indent for readability in the program. Line
    163 uses the PHP function mail to send the e-mail message. The mail function is
    documented in Chapter 14.


    164 Sends the customer to the New Member page.


    165 Ends the else block for a successful new member account application.'
