- pgno: 361
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_361_0.png)


    This e-mail message contains the customer’s password. I think that it’s very helpful
    to both the customer and the business to provide customers with a hard copy of
    their password. Customers will forget their password. It seems to be one of the
    rules. An e-mail message with their password might help them when they forget
    it, saving both them and you some trouble. Of course, e-mail messages aren’t necessarily
    secure, so sending passwords via e-mail isn’t a good idea for some accounts, such
    as an online bank account. But, for this Pet Store application, with only unauthorized
    discounts and pet care information at risk, sending the password via e-mail is
    a reasonable risk.


    # New Member Welcome page


    The New Member Welcome page greets the customer and offers useful information.
    The customer sees that the account has been installed and can then enter the Members
    Only section immediately. Figure 12-4 shows a welcome page.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_361_1.png)


    Figure 12-4:

    A page welcoming new members.'
