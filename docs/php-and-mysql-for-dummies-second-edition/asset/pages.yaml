  md: "```\n{\n    echo \"Invalid password<br>\";\n    statements that allow user\
    \ to try another password\n}\n```\n\n# Using a loop to get all the rows of data\n\
    \nIf you selected more than one row of data, use a loop to get all the rows from\
    \ the temporary location. The loop statements in the loop block get one row of\
    \ data and process it. The loop repeats until all rows have been retrieved. You\
    \ can use a while loop or a for loop to retrieve this information. (For more on\
    \ while loops and for loops, check out Chapter 7.)\n\nThe most common way to process\
    \ the information is to use a while loop as follows:\n\n```\nwhile ( $row = mysql_fetch_array($result))\n\
    {\n    block of statements\n}\n```\n\nThis loop repeats until it has fetched the\
    \ last row. If you just want to echo all the data, for example, you would use\
    \ a loop similar to the following:\n\n```\nwhile ( $row = mysql_fetch_array($result))\n\
    {\n    extract($row);\n    echo \"$petType: $petName<br>\";\n}\n```\n\nNow, take\
    \ a look at an example of how to get information for the Pet Catalog application.\
