    \ information.\n\n# Giving users a choice with multiple submit buttons\n\nYou\
    \ can use more than one submit button in a form. For instance, in a customer order\
    \ form, you might use a button that reads *Submit Order* and another button that\
    \ reads *Cancel Order*. However, you can only list one program in the `action=programname`\
    \ part of your `form` tag, meaning that the two buttons run the same program.\
    \ PHP solves this problem. By using PHP, you can process the form differently,\
    \ depending on which button the user clicks."
  merge: -1
