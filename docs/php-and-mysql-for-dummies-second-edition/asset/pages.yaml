  md: "| Character | Meaning | Example | Match | Not a Match |\n|---|---|---|---|---|\n\
    | `{ , }` | The starting and ending number of a range of repetitions. | `a{2,5}`\
    \ | `aa, aaaaa` | `a, xx3` |\n| `\\` | The following character is literal. | `m\\\
    *n` | `m*n` | `men, mean` |\n| `( | | )` | A set of alternate strings. | `(Tom|Tommy)`\
    \ | `Tom, Tommy` | `Thomas, To` |\n\nLiteral and special characters are combined\
    \ to make patterns, which are sometimes long, complicated patterns. A string is\
