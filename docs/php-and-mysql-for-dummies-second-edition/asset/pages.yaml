  md: "```\n```php\nforeach ($_POST as $field => $value)\n{\n    echo \"$field, $value<br>\"\
    ;\n}\n```\n```\n\nThe output from the `foreach` loop would be\n\n```\n```\nname,\
    \ Smith\ninterest, dog\nhidvar, 3\n```\n```\n\nThe output shows three variables\
    \ with these three values for the following reasons:\n\n+   - **The user didn’t\
    \ change the text in the text field.** The value `\"Smith\"` that the program\
    \ displayed is still the text in the text field.\n+   - **The user selected the\
    \ radio button for dog.** The user can select only one radio button.\n+   - **The\
    \ program passed a hidden field named `hidvar`.** The program sets the value for\
    \ hidden fields. The user can’t affect the hidden fields.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_249_0.png)\n\
    \n# ## Post versus get\n\nYou use one of two methods to submit form information.\
    \ The methods pass the form data differently and have different advantages and\
    \ disadvantages.\n\n+   - **get method:** The form data is passed by adding it\
    \ to the URL that calls the form-processing program. For instance, the URL might\
    \ look like this:\n\n```\n```\nprocessForm.php?name=Smith&\n  fname=Goliath\n\
    ```\n```\n\nThe advantages of this method are simplicity and speed. The disadvantages\
    \ are that less data can be passed and that the information is displayed in the\
    \ browser, which can be a security problem in some situations.\n\n+   - **post\
    \ method:** The form data is passed as a package in a separate communication with\
    \ the processing program.\n\nThe advantages of this method are unlimited information\
    \ passing and security of the data. The disadvantages are the additional overhead\
    \ and slower speed.\n\nFor CGI programs that are not PHP, the program that processes\
    \ the form must find the information and put the data into variables. In this\
    \ case, the `get` method is much simpler and easier to use. Many programmers use\
    \ the `get` method for this reason. However, PHP does all this work for you. The\
    \ `get` and `post` methods are equally easy to use in PHP programs. Therefore,\
    \ when using PHP, it’s almost always better to use the `post` method because you\
    \ have the advantages of the post method (unlimited data passing, better security)\
    \ without its main disadvantage (more difficult to use)."
  merge: -1
  img_proc: true
- pgno: 250
  md: "# Checking the information\n\nJoe Customer fills in an HTML form, selecting\
    \ from lists and typing information into text fields. He clicks the submit button.\
    \ You now have all the information that you wanted. Well, maybe. Joe might have\
    \ typed information that has a typo in it. Or he might have typed nonsense. Or\
    \ he might even have typed in malicious information that can cause problems for\
    \ you or for other people using your Web site. Before you use Joe's information\
    \ or store it in your database, you want to check it to see that it is the information\
    \ that you asked for. Checking the data is validating the data.\n\nValidating\
    \ the data includes the following:\n\n+   - **Checking for empty fields:** You\
    \ can require users to enter information in a field. If the field is blank, the\
    \ user is told that the information is required, and the form is displayed again\
    \ so the user can type the missing information.\n+   - **Checking the format of\
    \ the information:** You can check the information to see that it is in the correct\
    \ format. For instance, *ab3&*xx* is clearly not a valid ZIP code.\n\n# Checking\
    \ for empty fields\n\nWhen you create a form, you can decide which fields are\
    \ required and which are optional. Your decision is implemented in the PHP program.\
    \ You check the fields that are required for information. If a required field\
    \ is blank, you send a message to the user, indicating the field is required,\
    \ and you then redisplay the form.\n\nThe general format to check for empty fields\
    \ is\n\n```\nif ($last_name == \"\")\n{\n    echo \"You did not enter your last\
    \ name.\n        Last name is required.<br>\\n\";\n    display the form;\n   \
    \ exit();\n}\necho \" Welcome to the Members Only club.\n    You may select from\
    \ the menu below.<br>\\n\";\ndisplay the menu;\n```\n\nNotice the exit statement.\
    \ exit statements end the program. Without the exit statement, the program would\
    \ continue to the statements after the if statement. In other words, without the\
    \ exit statement, the program would display the form and then continue to echo\
    \ the welcome statement and the menu as well."
  merge: -1
  img_proc: true
- pgno: 251
  md: "In many cases, you want to check all the fields in the form. You can do this\
    \ by looping through the array $ _POST. The following statements check the array\
    \ for any empty fields:\n\n```\nforeach ($_POST as $value)\n{\n    if ( $value\
    \ == \"\" )\n    {\n        echo \"You have not filled in all the fields<br>\\\
    n\";\n        display the form;\n        exit();\n    }\n}\necho \"Welcome\";\n\
    ```\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_251_0.png)\n\nWhen you redisplay\
    \ the Web form, make sure that it contains the information that the user already\
    \ typed. If users have to retype information, they are likely to get frustrated\
    \ and leave your Web site.\n\nIn some cases, you might require the user to fill\
    \ in most of the fields but not all of them. For instance, you might request a\
    \ fax number in the form or provide a field for a middle name, but you don't really\
    \ mean to restrict registration on your Web site to only users with middle names\
    \ and faxes. In this case, you can just make an exception for the fields that\
    \ are not required, as follows:\n\n```\nforeach ($_POST as $field => $value)\n\
    {\n    if ( $field != \"fax\" and $field != \"middle_name\" )\n    {\n       \
    \ if ( $value == \"\" )\n        {\n            echo \"You have not filled in\
    \ all the fields<br>\\n\";\n            display the form;\n            exit();\n\
    \        }\n    }\n}\necho \"Welcome\";\n```\n\nNotice that the outside if conditional\
    \ statement is true only if the field is not the fax field and is not the middle\
    \ name field. For those two fields, the program does not reach the inside if statement,\
    \ which checks for blank fields.\n\nIn some cases, you might want to tell the\
    \ user exactly which fields need to be filled in. The checkBlank.php program in\
    \ Listing 8-12 processes a form with four fields: first_name, middle_name, last_name,\
    \ and phone. All the fields are required except middle_name. In the example shown\
    \ in Figure 8-13, the user didn't enter a first name: The resulting error message\
    \ when the form is processed tells the user which field was left blank."
