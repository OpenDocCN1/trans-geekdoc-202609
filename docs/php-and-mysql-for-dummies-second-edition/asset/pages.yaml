- pgno: 197
  md: "The output of these statements in a browser is\n\n```\nHuang, not Smith\nSmith\n\
    ```\n\nThis is the same output shown for the while loop example. The difference\
    \ between a while loop and a do..while loop is where the condition is checked.\
    \ In a while loop, the condition is checked at the top of the loop. Therefore,\
    \ the loop will never execute if the condition is never true. In the do..while\
    \ loop, the condition is checked at the bottom of the loop. Therefore, the loop\
    \ always executes at least once even if the condition is never true.\n\nFor instance,\
    \ in the preceding loop that checks for the name Smith, suppose the original condition\
    \ is set to yes, instead of no, by using this statement:\n\n```\n$testvar = \"\
    yes\";\n```\n\nThe condition would test false from the beginning. It would never\
    \ be true. In a while loop, there would be no output. The statement block would\
    \ never run. However, in a do..while loop, the statement block would run once\
    \ before the condition was tested. Thus, the while loop would produce no output,\
    \ but the do..while loop would produce the following output:\n\n```\nHuang, not\
    \ Smith\n```\n\nThe do..while loop produces one line of output before the condition\
    \ is tested. It does not produce the second line of output because the condition\
    \ tests false.\n\n# Infinite loops\n\nYou can easily set up loops so that they\
    \ never stop. These are infinite loops. They repeat forever. However, seldom does\
    \ anyone create an infinite loop intentionally. It is usually a mistake in the\
    \ programming. For instance, a slight change to the program that sets up a while\
    \ loop can make it into an infinite loop.\n\nHere is the program shown in the\
    \ section, “Using while loops,” earlier in this chapter:\n\n```\n$customers =\
    \ array ( \"Huang\", \"Smith\", \"Jones\" );\n$testvar = \"no\";\n$k = 0;\nwhile\
    \ ( $testvar != \"yes\" )\n{\n    if ($customers[$k] == \"Smith\" )\n    {\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "```\n```php\n$testvar = \"yes\";\necho \"Smith<br>\";\n}\nelse\n{\n    echo\
    \ \"$customers[$k], not Smith<br>\";\n}\n$k++;\n}\n```\n```\n\nHere is the program\
    \ with a slight change:\n\n```\n```php\n$customers = array ( \"Huang\", \"Smith\"\
    , \"Jones\" );\n$testvar = \"no\";\nwhile ( $testvar != \"yes\" )\n{\n    $k =\
    \ 0;\n    if ( $customers[$k] == \"Smith\" )\n    {\n        $testvar = \"yes\"\
    ;\n        echo \"Smith<br>\";\n    }\n    else\n    {\n        echo \"$customers[$k],\
    \ not Smith<br>\";\n    }\n    $k++;\n}\n```\n```\n\nThe small change is moving\
    \ the statement $k = 0; from outside the loop to inside the loop. This small change\
    \ makes it into an endless loop. The output of this changed program is\n\n```\n\
    ```text\nHuang, not Smith\nHuang, not Smith\nHuang, not Smith\nHuang, not Smith\n\
    ...\n```\n```\n\n**This will repeat forever.** Every time the loop runs, it resets\
    \ $k to 0. Then it gets $customers[0] and echoes it. At the end of the loop, $k\
    \ is incremented to 1. However, when the loop starts again, $k is set back to\
    \ 0. Consequently, only the first value in the array, Huang, is ever read. The\
    \ loop never gets to the name Smith, and $testvar is never set to \"yes\". The\
    \ loop is endless.\n\nDon’t be embarrassed if you write an infinite loop. I guarantee\
    \ that the best programming guru in the world has written many infinite loops.\
    \ It’s not a big deal. If you are testing a program and get output in your Web\
    \ page repeating endlessly, it will stop by itself in a short time. The default\
    \ time is 30 seconds, but the timeout period may have been changed by the PHP\
    \ administrator."
  merge: -1
  img_proc: true
- pgno: 199
  md: 'You can also click the Stop button on your browser to stop the display in your
    browser. Then figure out why the loop is repeating endlessly and fix it.


    A common mistake that can result in an infinite loop is using a single equal sign
    (=) when you mean double equal signs (==). The single equal sign stores a value
    in a variable; the double equal signs test whether two values are equal. If you
    write the following condition with a single equal sign:


    ```

    while ($testvar = "yes")

    ```


    it is always true. The condition simply sets $testvar equal to "yes". This is
    not a question that can be false. What you probably meant to write is this:


    ```

    while ($testvar == "yes")

    ```


    This is a question asking whether $testvar is equal to "yes", which can be answered
    either true or false.


    You can bulletproof your programs against this particular error by changing the
    condition to "yes" == $testvar. It''s less logical to read but protects against
    the single-equals-sign problem. If you use a single equal sign instead of a double
    equal sign in this condition, you get an error, and your program fails to run.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_199_0.png)


    Another common mistake is to leave out the statement that increments the counter.
    For instance, in the program earlier in this section, if you leave out the statement
    $k++;, $k is always 0, and the result is an infinite loop.


    # Breaking out of a loop


    Sometimes you want your program to break out of a loop. PHP provides two statements
    for this purpose:


    +   - **break**: Breaks completely out of a loop and continues with the program
    statements after the loop.

    +   - **continue**: Skips to the end of the loop where the condition is tested.
    If the condition tests positive, the program continues from the top of the loop.


    break and continue are usually used in a conditional statement. break, in particular,
    is used most often in switch statements, as I discuss earlier in the chapter.


    The following two sets of statements show the difference between continue and
    break. The first statements use the break statement.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "```\n$counter = 0;\nwhile ( $counter < 5 )\n{\n    $counter++;\n    If ( $counter\
    \ == 3 )\n    {\n        echo \"break<br>\";\n        break;\n    }\n    echo\
    \ \"End of while loop: counter=$counter<br>\";\n}\necho \"After the break loop<p>\"\
    ;\n```\n\nThe following statements use the continue statement:\n\n```\n$counter\
    \ = 0;\nwhile ( $counter < 5 )\n{\n    $counter++;\n    If ( $counter == 3 )\n\
    \    {\n        echo \"continue<br>\";\n        continue;\n    }\n    echo \"\
    End of while loop: counter=$counter<br>\";\n}\necho \"After the continue loop<br>\"\
    ;\n```\n\nThese statements build two loops that are the same except that the first\
    \ one uses break, and the second one uses continue. The output from these first\
    \ statements that use the break statement displays in your browser as follows:\n\
    \n```\nEnd of while loop: counter=1\nEnd of while loop: counter=2\nbreak\nAfter\
    \ the break loop\n```\n\nThe output from the second group of statements with the\
    \ continue statement is as follows:\n\n```\nEnd of while loop: counter=1\nEnd\
    \ of while loop: counter=2\ncontinue\nEnd of while loop: counter=4\nEnd of while\
    \ loop: counter=5\nAfter the continue loop\n```\n\nThe first loop ends at the\
    \ break statement. It stops looping and jumps immediately to the statement after\
    \ the loop. The second loop does not end at the continue statement. It just stops\
    \ the third repeat of the loop and jumps back up to the top of the loop. It then\
    \ finishes the loop, with the fourth and fifth repeats, before it goes to the\
    \ statement after the loop."
  merge: -1
  img_proc: true
- pgno: 201
  md: "One use for break statements is insurance against infinite loops. The following\
    \ statements inside a loop can stop it at a reasonable point:\n\n```\n$test4infinity++;\n\
    if ($test4infinity > 100 )\n{\n    break;\n}\n```\n\nIf you're sure that your\
    \ loop should never repeat more than 100 times, these statements will stop the\
    \ loop if it becomes endless. Use whatever number seems reasonable for the loop\
    \ that you're building.\n\n# Using Functions\n\nApplications often perform the\
    \ same task at different points in the program or in different programs. For instance,\
    \ your application might display the company logo on several different Web pages\
    \ or in different parts of the program. Suppose that you use the following statements\
    \ to display the company logo:\n\n```\necho '<hr width=\"50\" align=\"left\">',\"\
    \\n\";\necho '<img src=\"/images/logo.jpg\" width=\"50\" height=\"50\"><br>',\"\
    \\n\";\necho '<hr width=\"50\" align=\"left\"><br>',\"\\n\";\n```\n\nYou can create\
    \ a function that contains the preceding statements and name it display_logo.\
    \ Then whenever the program needs to display the logo, you can just call the function\
    \ that contains the statements with a simple function call, as follows:\n\n```\n\
    display_logo();\n```\n\nNotice the parentheses after the function name. These\
    \ are required in a function call because they tell PHP that this is a function.\n\
    \nUsing a function offers several advantages:\n\n+   ✔ **Less typing:** You only\
    \ have to type the statements once — in the function. Forever after, you just\
    \ use the function call and never have to type the statements again.\n+   ✔ **Easier\
    \ to read:** The line display_logo() is much easier for a person to understand\
    \ at a glance.\n+   ✔ **Fewer errors:** After you have written your function and\
    \ fixed all its problems, it runs correctly wherever you use it.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_201_0.png)"
  merge: -1
  img_proc: true
- pgno: 202
  md: "> > **Easier to change:** If you decide to change how the task is performed,\
    \ you only need to change it in one place. You just change the function instead\
    \ of finding a hundred different places in your program where you performed the\
    \ task and changing the code a hundred times. For instance, suppose that you changed\
    \ the name of the graphics file that holds the company logo. You just change the\
    \ filename in one place, the function, and it works correctly everywhere.\n\n\
    You can create a function by putting the code into a function block. The general\
    \ format is\n\n```\n```php\nfunction functionname()\n{\n    block of statements;\n\
    \    return;\n}\n```\n```\n\nFor instance, you create the function to display\
    \ the company logo with the following statements:\n\n```\n```php\nfunction display_logo()\n\
    {\n    echo '<hr width=\"50\" align=\"left\">',\"\\n\";\n    echo '<img src=\"\
    /images/logo.jpg\" width=\"50\"\n         height=\"50\"><br>',\"\\n\";\n    echo\
    \ '<hr width=\"50\" align=\"left\"><br>',\"\\n\";\n    return;\n}\n```\n```\n\n\
    The return statement stops the function and returns to the main program. The return\
    \ statement at the end of the function is not required, but it makes the function\
    \ easier to understand. The return statement is often used for a conditional end\
    \ to a function.\n\nSuppose that your function displays an electronics catalog.\
    \ You might use the following statement at the beginning of the function:\n\n\
    ```\n```php\nif ( $age < 13 )\n    return;\n```\n```\n\nIf the customer’s age\
    \ is less than 13, the function stops, and the electronics catalog isn’t displayed.\n\
    \nYou can put functions anywhere in the program, but the usual practice is to\
    \ put all the functions together at the beginning or the end of the program file.\
    \ Functions that you plan to use in more than one program can be in a separate\
    \ file. Each program accesses the functions from the external file. For more on\
    \ organizing applications into files and accessing separate files, check out Chapter\
    \ 10."
  merge: -1
  img_proc: true
- pgno: 203
  md: "Notice that the sample function is quite simple. It doesn't use variables,\
    \ and it doesn't share any information with the main program. It just performs\
    \ an independent task when called. You can use variables in functions and pass\
    \ information between the function and the main program as long as you know the\
    \ rules and limitations. The remaining sections in this chapter explain how to\
    \ use variables and pass values.\n\n# Using variables in functions\n\nYou can\
    \ create and use variables that are local to the function. That is, you can create\
    \ and use a variable inside your function. However, the variable is not available\
    \ outside of the function; it's not available to the main program. You can make\
    \ the variable available by using a special statement called global that makes\
    \ a variable available at any location in the program. For instance, the following\
    \ function creates a variable:\n\n```\nfunction format_name()\n{\n    $first_name\
    \ = \"Goliath\";\n    $last_name = \"Smith\";\n    $name = $last_name.\", \".$first_name;\n\
    }\nformat_name();\necho \"$name\";\n```\n\nThese statements produce no output.\
    \ In the echo statement, $name doesn't contain any value. The variable $name was\
    \ created inside the function, so it doesn't exist outside the function.\n\nYou\
    \ can create a variable inside a function that does exist outside the function\
    \ by using the global statement. The following statements contain the same function\
    \ with a global statement added:\n\n```\nfunction format_name()\n{\n    $first_name\
    \ = \"Goliath\";\n    $last_name = \"Smith\";\n    global $name;\n    $name =\
    \ $last_name.\", \".$first_name;\n}\nformat_name();\necho \"$name\";\n```\n\n\
    The program now echoes this:\n\n```\nSmith, Goliath\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: "The global statement makes the variable available at any location in the program.\
    \ You must make the variable global before you can use it. If the global statement\
    \ follows the $name assignment statement, the program does not produce any output.\n\
    \nThe same rules apply when you’re using a variable that was created in the main\
    \ program. You can’t use a variable in a function that was created outside the\
    \ function unless the variable is global, as shown in the following statements:\n\
    \n```\n```php\n$first_name = \"Goliath\";\n$last_name = \"Smith\";\nfunction format_name()\n\
    {\n    global $first_name, $last_name;\n    $name = $last_name.\", \".$first_name;\n\
    \    echo \"$name\";\n}\nformat_name();\n```\n```\n\nIf you don’t use the global\
    \ statement, $last_name and $first_name inside the function are different variables,\
    \ created when you name them. They have no values. The program would produce no\
    \ output without the global statement.\n\n# Passing values between a function\
    \ and the main program\n\nYou can pass values into the function and receive values\
    \ from the function. For instance, you might write a function to add the correct\
    \ sales tax to an order. The function would need to know the cost of the order\
    \ and which state the customer resides in. The function would need to send back\
    \ the amount of the sales tax.\n\n# Passing values to a function\n\nYou can pass\
    \ values to a function by putting the values between the parentheses when you\
    \ call the function, as follows:\n\n```\n```\nfunctionname(value,value,...);\n\
    ```\n```\n\nOf course, the variables can’t just show up. The function must be\
    \ expecting them. The function statement includes variable names for the values\
    \ that it’s expecting, as follows:\n\n```\n```php\nfunction functionname($varname1,$varname2,...)\n\
    {\n    statements\n    return;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 205
  md: "For example, the following `function` computes the sales tax:\n\n```\nfunction\
    \ compute_salestax($amount,$custState)\n{\n  switch ( $custState )\n  {\n    case\
    \ \"OR\":\n      $salestaxrate = 0;\n      break;\n    case \"CA\":\n      $salestaxrate\
    \ = 1.0;\n      break;\n    default:\n      $salestaxrate = .5;\n      break;\n\
    \  }\n  $salestax = $amount * $salestaxrate;\n  echo \"$salestax<br>\";\n}\n$cost\
    \ = 2000.00;\n$custState = \"CA\";\ncompute_salestax($cost,$custState);\n```\n\
    \nThe first line shows that the function expects two values, as follows:\n\n```\n\
    function compute_salestax($amount,$custState)\n```\n\nThe last line is the function\
    \ call, which passes two values to the function `compute_salestax`, as it expects.\
    \ The amount of the order and the state in which the customer resides are passed.\
    \ The output from this program is 2000 because the tax rate for California is\
    \ 100 percent.\n\nYou can pass as many values as you need to. Values can be variables\
    \ or values, including values that are computed. The following function calls\
    \ are valid:\n\n```\ncompute_salestax(2000,\"CA\");\ncompute_salestax(2*1000,\"\
    \");\ncompute_salestax(2000,\"C\".\"A\");\n```\n\nValues can be passed in an array.\
    \ The function receives the variable as an array. For instance, the following\
    \ statements pass an array:\n\n```\n$arrayofnumbers = array( 100, 200 );\naddnumbers($arrayofnumbers);\n\
    ```\n\nThe function receives the entire array. For instance, suppose the function\
    \ starts with the following statement:\n\n```\nfunction addnumbers($numbers)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 206
  md: "The variable `$numbers` is an array. The function can include statements such\
    \ as\n\n```\n```php\nreturn $numbers[0] + $numbers[1];\n```\n```\n\nThe values\
    \ passed are passed by position. That is, the first value in the list that you\
    \ pass is used as the first value in the list that the function expects, the second\
    \ is used for the second, and so forth. If your values aren’t in the same order,\
    \ the function uses the wrong value when performing the task. For instance, for\
    \ `compute_salestax`, you might call `compute_salestax` passing values in the\
    \ wrong order as follows:\n\n```\n```php\ncompute_salestax($custState,$orderCost);\n\
    ```\n```\n\nThe function uses the state as the cost of the order, which it sets\
    \ to 0 because the value passed is a string. It sets the state to the number in\
    \ `$orderCost`, which would not match any of its categories. The output would\
    \ be 0.\n\nIf you do not send enough values, the function sets the missing value\
    \ to an empty string for a string variable or to 0 for a number. If you send too\
    \ many values, the function ignores the extra values.\n\nIf you pass the wrong\
    \ number of values to a function, you might get a warning message, as follows,\
    \ depending on the error message level that PHP is set to.\n\n```\n```text\nWarning:\
    \ Missing argument 2 for compute_salestax() in /test7.php on line 5\n```\n```\n\
    \nFor the lowdown on warning messages, check out Chapter 6.\n\nYou can set default\
    \ values to be used when a value isn’t passed. The defaults are set when you write\
    \ the function by assigning a default value for the value(s) that it is expecting,\
    \ as follows:\n\n```\n```php\nfunction add_2_numbers($num1=1,$num2=1)\n{\n   \
    \ $total = $num1 + $num2;\n    return $total;\n}\n```\n```\n\nIf one or both values\
    \ are not passed, the function uses the assigned defaults. But if a value is passed,\
    \ it is used instead of the default. For example, you could use one of the following\
    \ calls:\n\n```\n```php\nadd_2_numbers(2,2);\nadd_2_numbers(2);\nadd_2_numbers();\n\
    ```\n```\n\nThe results are, in consecutive order:"
  merge: -1
