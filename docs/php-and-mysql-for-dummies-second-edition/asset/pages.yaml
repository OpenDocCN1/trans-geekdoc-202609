- pgno: 356
  md: "+   - **fax**: The fax number that the customer types in. The `CREATE` query\
    \ defines the field as\n+     - `CHAR(15)`: This data type defines the field as\
    \ a character string that’s 15 characters long. The field will always take up\
    \ 15 characters of storage, with padding if the actual string stored is less than\
    \ 15 characters.\n\nNotice that some fields are `CHAR` and some are `VARCHAR`.\
    \ `CHAR` fields are faster, whereas `VARCHAR` fields are more efficient in using\
    \ disk space. Your decision will depend on whether disk space or speed is more\
    \ important for your application in your environment.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_356_0.png)\n\
    \nIn general, shorter fields should be `CHAR` because shorter fields don’t waste\
    \ much space. For instance, if your `CHAR` is 5 characters, the most space that\
    \ could possibly be wasted is 4 characters. However, if your `CHAR` is 200, you\
    \ could waste 199 characters. Therefore, for short fields, use `CHAR` for speed\
    \ with very little wasted space.\n\n# Building the Login table\n\nThe `Login`\
    \ table keeps track of member logins by recording the date and time every time\
    \ that a member logs in. Because each member has multiple logins, the login data\
    \ requires its own table. The `CREATE` query that builds the `Login` table is\n\
    \n```\nCREATE TABLE Login (\n    loginName    VARCHAR(20) NOT NULL,\n    loginTime\
    \    DATETIME    NOT NULL,\n    PRIMARY KEY(loginName,loginTime) );\n```\n\nThe\
    \ `Login` table has only two columns, as follows:\n\n+   - **loginName**: The\
    \ Member ID that the customer uses to log in with. The `loginName` is the connection\
    \ between the `Member` table (which I describe in the preceding section) and this\
    \ table. Notice that the `loginName` column is defined the same in the `Member`\
    \ table and in this table. This makes table joining possible and makes matching\
    \ rows in the tables much easier. The `CREATE` query defines the `loginName` in\
    \ the following ways:\n+     - `CHAR(20)`: This data type defines the field as\
    \ a character string that’s 20 characters long. The field will always take up\
    \ 20 characters of storage, with padding if the actual string stored is less than\
    \ 20 characters. If a string longer than 20 characters is stored, any characters\
    \ after 20 are dropped."
