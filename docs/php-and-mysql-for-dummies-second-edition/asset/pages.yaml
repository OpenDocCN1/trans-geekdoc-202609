  md: '```

    ```php

    $variablename = value;

    ```

    ```


    The value can be a single value or a combination of values, including values in
    variables. A variable can hold numbers or characters but not both at the same
    time. Therefore, a value cannot be a combination of numbers and characters. The
    following are valid assignment statements:


    ```

    ```php

    $number = 2;

    $number = 2+1;

    $number = (2 - 1) * (4 * 5) -17;

    $number2 = $number + 3;

    $string = "Hello World";

    $string2 = $string." again!";

    ```

    ```


    If you combine numbers and strings in a value, you won’t get an error message;
    you’ll just get unexpected results. For instance, the following statements combine
    numbers and strings:


    ```

    ```php

    $number = 2;

    $string = "Hello";

    $combined = $number + $string;

    $combined2 = $number.$string;

    echo $combined;

    echo <br>;

    echo $combined2;

    ```

    ```


    The output of these statements is


    ```

    2      ($string is evaluated as 0)

    2Hello    ($number is evaluated as a character)

    ```


    # Using increment statements


    Often a variable is used as a counter. For instance, suppose you want to be sure
    that everyone sees your company logo, so you display it three times. You set a
    variable to 0. Each time that you display the logo, you add 1 to the variable.
    When the value of the variable reaches 3, you know that it’s time to stop showing
    the logo. The following statements show the use of a counter:


    ```

    ```php

    $counter=0;

    $counter = $counter + 1;

    echo $counter;

    ```

    ```


    These statements would output 1. Because counters are used so often, PHP provides
    shortcuts. The following statements have the same effect as the preceding statements.'
