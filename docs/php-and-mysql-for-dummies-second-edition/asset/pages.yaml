- pgno: 412
  md: '+   8. **Create a user and a group named mysql for MySQL to run under.** In
    most newer Mac versions, this user and group already exist.


    +   9. **Mount the disk image by double-clicking its icon in the Finder.**


    +   10. **Double-click the package icon to install the MySQL PKG.**


    The package installer will run and install the package. It installs MySQL in the
    directory `/usr/local/mysql`, followed by the version number. It also installs
    a symbolic link `/usr/local/mysql/` pointing to the directory where MySQL is installed.
    It also initializes the database by running the script `mysql_install_db`, which
    creates a MySQL account called root.


    +   11. **You might need to change the owner of the mysql directory.**


    The directory where MySQL is installed (for example, `/usr/local/mysql-4.0.17`)
    should be owned by root. The data directory (such as, `/usr/local/mysql-4.0.17/data`)
    should be owned by the account `mysql`. Both directories should belong to the
    group `mysql`. If the user and group are not correct, change them with the following
    commands:


    ```

    sudo chown -R root /usr/local/mysql-4.0.17

    sudo chown -R mysql /usr/local/mysql-4.0.17/data

    sudo chown -R root /usr/local/mysql-4.0.17/bin

    ```


    +   12. **Start the MySQL server using the following commands:**


    ```

    cd /usr/local/mysql

    sudo ./bin/mysqld_safe

    if necessary, enter your password

    Press Ctrl-Z

    bg

    Press Ctrl-D or type exit

    ```


    **This starts the server manually**, meaning you must start the MySQL server every
    time you restart your computer. To have your server start every time the computer
    is started, you need to install the MySQL Startup Item, which is included in the
    installation disk image in a separate installation package. To install the Startup
    Item, double-click the MySQLStartupItem.pkg icon.


    To stop the MySQL server, change to the `bin` subdirectory in the directory where
    MySQL is installed and type


    ```

    mysqladmin -u root -p shutdown

    ```


    The `-p` causes `mysqladmin` to prompt you for a password. If the account doesn’t
    require a password, don’t include `-p`.


