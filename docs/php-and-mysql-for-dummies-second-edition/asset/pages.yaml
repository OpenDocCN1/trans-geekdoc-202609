- pgno: 29
  md: '# Chapter 1


    # Introduction to PHP and MySQL


    # In This Chapter


    +   ► Finding out what a Web database application is

    +   ► Taking a look at PHP

    +   ► Discovering how MySQL works

    +   ► Finding out how PHP and MySQL work together


    So you need to develop an interactive Web site. Perhaps your boss just put you
    in charge of the company’s online product catalog. Or you want to develop your
    own Web business. Or your sister wants to sell her paintings online. Or you volunteered
    to put up a Web site open only to members of your circus acrobats’ association.
    Whatever your motivation might be, you can see that the application needs to store
    information (for instance, information about products, information about paintings,
    member passwords), thus requiring a database. You can also see that the application
    needs to interact dynamically with the user; for instance, the user selects a
    product to view, or the user enters membership information. This type of Web site
    is a Web database application.


    I assume that you’ve created static Web pages before, using HTML (HyperText Markup
    Language), but creating an interactive Web site is a new challenge, as is designing
    a database. You asked three computer gurus you know what you should do. They said
    a lot of things you didn’t understand, but among the technical jargon, you heard
    “quick” and “easy” and “free” mentioned in the same sentence as PHP and MySQL.
    Now you want to know more about using PHP and MySQL to develop the Web site that
    you need.


    PHP and MySQL work together very well; it’s a dynamic partnership. In this chapter,
    you find out the advantages of each, how each one works, and how they work together
    to produce a dynamic Web database application.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "# What Is a Web Database Application?\n\nAn application is a program or a group\
    \ of programs designed for use by an end user (for example, customers, members,\
    \ circus acrobats, and so on). If the end user interacts with the application\
    \ via a Web browser, the application is a Web-based or Web application. If the\
    \ Web application requires the long-term storage of information, using a database,\
    \ it is a Web database application. This book provides you with the information\
    \ that you need to develop a Web database application that can be accessed with\
    \ Web browsers such as Internet Explorer and Netscape.\n\nA Web database application\
    \ is designed to help a user accomplish a task. It can be a simple application\
    \ that displays information in a browser window (for example, it displays current\
    \ job openings when the user selects a job title) or a complicated program with\
    \ extended functionality (for example, the book-ordering application at Amazon.com\
    \ or the bidding application at eBay).\n\nNot surprisingly, a Web database application\
    \ consists of a database and an application — just two pieces:\n\n+   ✔ **Database:**\
    \ The database is the long-term memory of your Web database application. The application\
    \ can’t fulfill its purpose without the database. However, the database alone\
    \ is not enough.\n+   \n+   ✔ **Application:** The application piece is the program\
    \ or group of programs that performs the tasks. Programs create the display that\
    \ the user sees in the browser window; they make your application interactive\
    \ by accepting and processing information that the user types in the browser window\
    \ and they store information in the database and get information out of the database.\
    \ (The database is useless unless you can move data in and out.)\n\nThe Web pages\
    \ that you’ve previously created with HTML alone are static, meaning the user\
    \ can’t interact with the Web page. All users see the same Web page. Dynamic Web\
    \ pages, on the other hand, allow the user to interact with the Web page. Different\
    \ users might see different Web pages. For instance, one user looking at a furniture\
    \ store’s online product catalog might choose to view information about the sofas,\
    \ whereas another user might choose to view information about coffee tables. To\
    \ create dynamic Web pages, you must use another language in addition to HTML.\n\
    \nOne language widely used to make Web pages dynamic is JavaScript. JavaScript\
    \ is useful for several purposes, such as mouse-overs (for example, to highlight\
    \ a navigation button when the user moves the mouse pointer over it) or accepting\
    \ and validating information that users type into a Web form. However, it’s not\
    \ useful for interacting with a database. You wouldn’t use JavaScript to move\
    \ the information from the Web form into a database. PHP, however, is a language\
    \ that is particularly well suited to interacting with databases. PHP can accept\
    \ and validate the information that users type into a"
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Web form and can also move the information into a database. The programs in
    this book are written with PHP.


    # The database


    The core of a Web database application is the *database*, which is the long-term
    memory (hopefully more efficient than my long-term memory) that stores information
    for the application. A database is an electronic file cabinet that stores information
    in an organized manner so that you can find it when you need it. After all, storing
    information is pointless if you can’t find it. A database can be small, with a
    simple structure — for example, a database containing the titles and authors’
    names of all the books that you own. Or a database can be huge, with an extremely
    complex structure — such as the database that Amazon.com must have to hold all
    its information.


    # E-mail discussion lists


    Good technical support is available from e-mail discussion lists. E-mail discussion
    lists are groups of people discussing specific topics via e-mail. E-mail lists
    are available for pretty much any subject you can think of: Powerball, ancient
    philosophy, cooking, the Beatles, Scottish terriers, politics, and so on. The
    discussion takes place via e-mail. The *list manager* maintains a distribution
    list of e-mail addresses for anyone who wants to join the discussion. When you
    send a message to the discussion list, your message is sent to the entire list
    so that everyone can see it. Thus, the discussion is a group effort, and anyone
    can respond to any message that interests him or her.


    E-mail discussion lists are supported by various sponsors. Any individual or organization
    can run a list. Most software vendors run one or more lists devoted to their software.
    Universities run many lists for educational subjects. In addition, some Web sites
    manage discussion lists, such as Yahoo! Groups and Topica. Users can create a
    new list or join an existing list via the Web application.


    Software-related e-mail lists are a treasure trove of technical support. Anywhere
    from a


    hundred to several thousand users of the software subscribe to the list. Many
    have extensive experience with the software. Often the developers, programmers,
    and technical support staff for the software vendor are on the list. Whatever
    your question or problem, someone on the list probably knows the answer or the
    solution. You are unlikely to be the first person to ever experience your problem.
    When you post a question to an e-mail list, the answer usually appears in your
    inbox within minutes. In addition, most lists maintain an archive of previous
    discussions so that you can search for answers to your specific problem. When
    you’re new to any software, you can find out a great deal simply by joining the
    discussion lists for the software and reading the messages for a few days.


    Of course, PHP and MySQL have e-mail discussion lists. Actually, each has several
    discussion lists for special topics, such as *databases* and *PHP*. You can find
    the names of the mailing lists and instructions for joining them on the PHP and
    MySQL Web sites.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The information that you store in the database comes in many varieties. A company’s
    online catalog requires a database to store information about all the company’s
    products. A membership Web site requires a database to store information about
    members. An employment Web site requires a database (or perhaps two databases)
    to store information about job openings and information from résumés. The information
    that you plan to store could be similar to information that’s stored by Web sites
    all over the Internet — or information that’s unique to your application.


    Technically, the term *database* refers to the file or group of files that holds
    the actual data. The data is accessed by using a set of programs called a DBMS
    (Database Management System). Almost all DBMSs these days are RDBMSs (Relational
    Database Management Systems), in which data is organized and stored in a set of
    related tables.


    In this book, MySQL is the RDBMS used because it is particularly well suited for
    Web sites. MySQL and its advantages are discussed in the section, “MySQL, My Database,”
    later in this chapter. You can find out about how to organize and design a MySQL
    database in Chapter 3.


    # The application: Moving data in and out of the database


    For the database to be useful, you need to be able to move data into and out of
    it. Programs are your tools for this because they interact with the database to
    store and retrieve data. A program connects to the database and makes a request:
    “Take this data and store it in the specified location.” Another program makes
    the request: “Find the specified data and give it to me.” The application programs
    that interact with the database run when the user interacts with the Web page.
    For instance, when the user clicks the submit button after filling in a Web form,
    a program processes the information in the form and stores it in a database.


    # MySQL, My Database


    MySQL is a fast, easy-to-use RDBMS used for databases on many Web sites. Speed
    was the developers’ main focus from the beginning. In the interest of speed, they
    made the decision to offer fewer features than their major competitors (for instance,
    Oracle and Sybase). However, even though MySQL is less full featured than its
    commercial competitors, it has all the features needed by the large majority of
    database developers. It’s easier to install and use than its commercial competitors,
    and the difference in price is strongly in MySQL’s favor.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'MySQL is developed, marketed, and supported by MySQL AB, which is a Swedish
    company. The company licenses it two ways:


    +   - **Open source software:** MySQL is available via the GNU GPL (General Public
    License) for no charge. Anyone who can meet the requirements of the GPL can use
    the software for free. If you''re using MySQL as a database on a Web site (the
    subject of this book), you can use MySQL for free, even if you''re making money
    with your Web site.

    +   - **Commercial license:** MySQL is available with a commercial license for
    those who prefer it to the GPL. If a developer wants to use MySQL as part of a
    new software product and wants to sell the new product, rather than release it
    under the GPL, the developer needs to purchase a commercial license. The fee is
    very reasonable.


    Finding technical support for MySQL is not a problem. You can join one of several
    e-mail discussion lists offered on the MySQL Web site at www.mysql.com. You can
    even search the e-mail list archives, which contain a large knowledge base of
    MySQL questions and answers. If you''re more comfortable getting commercial support,
    MySQL AB offers technical support contracts — five support levels, ranging from
    direct e-mail support to phone support, at five price levels.


    # Advantages of MySQL


    MySQL is a popular database with Web developers. Its speed and small size make
    it ideal for a Web site. Add to that the fact that it''s open source, which means
    free, and you have the foundation of its popularity. Here is a rundown of some
    of its advantages:


    +   - **It''s fast.** The main goal of the folks who developed MySQL was speed.
    Consequently, the software was designed from the beginning with speed in mind.

    +   - **It''s inexpensive.** MySQL is free under the open source GPL license,
    and the fee for a commercial license is very reasonable.

    +   - **It''s easy to use.** You can build and interact with a MySQL database
    by using a few simple statements in the SQL language, which is the standard language
    for communicating with RDBMSs. Check out Chapter 4 for the lowdown on the SQL
    language.

    +   - **It can run on many operating systems.** MySQL runs on a wide variety of
    operating systems — Windows, Linux, Mac OS, most varieties of Unix (including
    Solaris, AIX, and DEC Unix), FreeBSD, OS/2, Irix, and others.

    +   - **Technical support is widely available.** A large base of users provides
    free support via mailing lists. The MySQL developers also participate in the e-mail
    lists. You can also purchase technical support from MySQL AB for a very small
    fee.'
  merge: -1
  img_proc: true
