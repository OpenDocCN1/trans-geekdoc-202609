- pgno: 135
  md: '# Chapter 6


    # # General PHP


    # ## In This Chapter


    +   - Adding PHP sections to HTML files

    +   - Writing PHP statements

    +   - Using PHP variables

    +   - Comparing values in PHP variables

    +   - Documenting your programs


    Programs are the application part of your Web database application. Programs perform
    the tasks. They create and display Web pages, accept and process information from
    users, store information in the database, get information out of the database,
    and perform any other necessary tasks.


    PHP, the language that you use to write your programs, is a scripting language
    designed specifically for use on the Web. It is your tool for creating dynamic
    Web pages. It has features designed to aid you in programming the tasks needed
    by dynamic Web applications.


    In this chapter, I describe the general rules for writing PHP programs — the rules
    that apply to all PHP statements. Consider these rules similar to general grammar
    and punctuation rules. In the remaining chapters in Part III, you find out about
    specific PHP statements and features and how to write PHP programs to perform
    specific tasks.


    # ## Adding a PHP Section to an HTML Page


    PHP is a partner to HTML (HyperText Markup Language) that extends its abilities.
    It enables an HTML program to do things it can’t do on its own. For example, HTML
    programs can display Web pages, and HTML has features that allow you to format
    those Web pages. HTML also allows you to display graphics in your Web pages and
    to play music files. But HTML alone does not allow you to interact with the person
    viewing the Web page.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_136_0.png)


    # How the Web server processes PHP files


    When a browser is pointed to a regular HTML file with an .html or .htm extension,
    the Web server sends the file, as-is, to the browser. The browser processes the
    file and displays the Web page that is described by the HTML tags in the file.
    When a browser is pointed to a PHP file (with a .php extension), the Web server
    looks for PHP sections in the file and processes them instead of just sending
    them as-is to the browser. The steps that the Web server uses to process a PHP
    file are as follows:


    +   1. The Web server starts scanning the file in HTML mode. It assumes that the
    statements are HTML and sends them to the browser without any processing.

    +   2. The Web server continues in HTML mode until it encounters a PHP opening
    tag (<?php).

    +   3. When it encounters a PHP opening tag, the Web server switches into PHP
    mode. This is sometimes called escaping from HTML. The Web server then assumes
    that all statements are PHP statements and executes the PHP statements. If there
    is output, the output is sent by the server to the browser.

    +   4. The Web server continues in PHP mode until it encounters a PHP closing
    tag (?>).

    +   5. When the Web server encounters a PHP closing tag, it returns to HTML mode.
    It resumes scanning, and the cycle continues from Step 1.


    HTML is almost interactive. That is, HTML forms allow users to type information
    that the Web page is designed to collect; however, you can’t access that information
    without using a language other than HTML. PHP processes form information, without
    requiring a separate program, and allows other interactive tasks as well.


    HTML tags are used to make PHP language statements part of HTML programs. The
    program file is named with a .php extension. Other extension(s) can be defined
    by the PHP administrator, such as .phtml, .php4, or .php5, but .php is the most
    common. So for this book, I will assume that .php is the extension for PHP programs.
    The PHP language statements are enclosed in PHP tags with the following form:


    ```

    <?php ?>

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_136_1.png)


    Sometimes you can use a shorter version of the PHP tags. You can try using <?
    and ?> without the php. If short tags are enabled, you can save a little typing.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'PHP processes all statements between the two PHP tags. After the PHP section
    is processed, it''s discarded. Or, if the PHP statements produce output, the PHP
    section is replaced by the output. The browser does not see the PHP section —
    only its output if there is any output. For more on this process, check out the
    sidebar, “How the Web server processes PHP files.”


    As an example, I''ll start with a program that displays Hello World! in the browser
    window. (It''s sort of a tradition that the first program you write in any language
    is the Hello World program. You might have written a Hello World program when
    you first learned HTML.) Listing 6-1 shows an HTML program that displays Hello
    World! in a browser window.


    # Listing 6-1: The Hello World HTML Program


    ```

    ```html

    <html>

    <head><title>Hello World Program</title></head>

    <body>

    <p>Hello World!

    </body>

    </html>

    ```

    ```


    If you point your browser at this HTML program, you see a Web page that displays


    ```

    ```

    Hello World!

    ```

    ```


    in the browser window.


    Listing 6-2 shows a PHP program that does exactly the same thing — it displays
    Hello World! in a browser window.


    # Listing 6-2: The Hello World PHP Program


    ```

    ```html

    <html>

    <head><title>Hello World Program</title></head>

    <body>

    <?php

    echo "<p>Hello World!"

    ?>

    </body>

    </html>

    ```

    ```


    If you point your browser at this program, it displays exactly the same Web page
    as the HTML program in Listing 6-1.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_137_0.png)


    Don''t look at the file directly with your browser. That is, don''t choose File→Open→Browse
    from your browser menu to navigate to the file and click it. You must point at
    the file by typing its URL, as I discuss in Chapter 2. If you see the PHP code
    displayed in the browser window instead of the output that you expect, you might
    not have pointed to the file by using its URL.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'In this PHP program, the PHP section is


    ```

    <?php

    echo "<p>Hello World!"

    ?>

    ```


    The PHP tags enclose only one statement — an echo statement. The echo statement
    is a PHP statement that you will use frequently. It simply outputs the text between
    the double quotes.


    There is no rule that says you must enter the PHP on separate lines. You could
    just as well include the PHP in the file on a single line, like this:


    ```

    <?php echo "<p>Hello World!" ?>

    ```


    When the PHP section is processed, it is replaced with the output. In this case,
    the output is


    ```

    <p>Hello World!

    ```


    If you replace the PHP section in Listing 6-2 with the preceding output, the program
    now looks exactly like the HTML program in Listing 6-1. If you point your browser
    at either program, you see the same Web page. If you look at the source code that
    the browser sees (in the browser, choose View→Source), you see the same source
    code listing for both programs.


    # Writing PHP Statements


    The PHP section that you add to your HTML file consists of a series of PHP statements.
    Each PHP statement is an instruction to PHP to do something. In the Hello World
    program shown in Listing 6-2, the PHP section contains only one simple PHP statement.
    The echo statement instructs PHP to output the text between the double quotes.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_138_0.png)


    PHP statements end with a semicolon (;). PHP does not notice white space or the
    end of lines. It continues reading a statement until it encounters a semicolon
    or the PHP closing tag, no matter how many lines the statement spans. Leaving
    out the semicolon is a common error, resulting in an error message that looks
    something like this:


    ```

    Parse error: expecting `'','''' or `'';'''' in /hello.php on line 6

    ```


    Notice that the error message gives you the line number where it encountered problems.
    This information helps you locate the error in your program. This error message
    probably means that the semicolon was omitted at the end of line 5.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "![](img/d82df0828cfbc6d6be1e9a991861f3b7_139_0.png)\n\nI recommend writing\
    \ your PHP programs with an editor that uses line numbers. If your editor doesn't\
    \ let you specify which line you want to go to, you have to count the lines manually\
    \ from the top of the file every time that you receive an error message. Many\
    \ editors that are good for editing PHP are listed at phpeditors.linuxbackup.co.uk.\n\
    \nSometimes groups of statements are combined together into a block. A block is\
    \ enclosed by curly braces ( { } ). A block of statements execute together. A\
    \ common use of a block is in a conditional block, in which statements are executed\
    \ only when certain conditions are true. For instance, you might want your program\
    \ to do the following:\n\n```\nif (the sky is blue)\n{\n    put leash on dragon;\n\
    \    take dragon for a walk in the park;\n}\n```\n\nThese statements are enclosed\
    \ in curly braces to ensure that they execute as a block. If the sky is blue,\
    \ both put leash on dragon and take dragon for a walk in the park are executed.\
    \ If the sky is not blue, neither statement is executed (no leash; no walk).\n\
    \nPHP statements that use blocks, such as if statements (which I explain in Chapter\
    \ 7), are complex statements. PHP reads the entire complex statement, not stopping\
    \ at the first semicolon that it encounters. PHP knows to expect one or more blocks\
    \ and looks for the ending curly brace of the last block in complex statements.\
    \ Notice that there is a semicolon before the ending brace. This semicolon is\
    \ required, but no semicolon is required after the ending curly brace.\n\nIf you\
    \ wanted to, you could write the entire PHP section in one long line, as long\
    \ as you separated statements with semicolons and enclosed blocks with curly braces.\
    \ However, a program written this way would be impossible for people to read.\
    \ Therefore, you should put statements on separate lines, except for occasional,\
    \ really short statements.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_139_1.png)\n\
    \nNotice that the statements inside the block are indented. Indenting is not necessary\
    \ for PHP. Indenting is strictly for readability. You should indent the statements\
    \ in a block so that people reading the script can tell more easily where a block\
    \ begins and ends.\n\nIn general, PHP doesn't care whether the statement keywords\
    \ are in upper- or lowercase. Echo, echo, ECHO, and eCHo are all the same to PHP."
  merge: -1
  img_proc: true
- pgno: 140
  md: "# Error messages and warnings\n\nPHP tries to be helpful when problems arise.\
    \ It provides error messages and warnings as follows:\n\n✔ **Error message:**\
    \ You receive this message when the program has a problem that prevents it from\
    \ running. The message contains as much information as possible to help you identify\
    \ the problem. A common error message is\n\n```\nParse error: parse error in\n\
    c:\\catalog\\test.php on\nline 6\n```\n\nOften, you receive this error message\
    \ because you've forgotten a semicolon, a parenthesis, or a curly brace.\n\n✔\
    \ **Warning message:** You receive this message when the program sees a problem\
    \ but the problem is not serious enough to prevent the program from running. Warning\
    \ messages do not mean that the program can't run; the program does continue to\
    \ run. Rather, warning messages tell you that PHP believes that something is probably\
    \ wrong. You should identify the source of the warning and then decide whether\
    \ it needs to be fixed. It usually does.\n\n✔ **Notice:** You receive a notice\
    \ when PHP sees a condition that might be an error or might be perfectly okay.\
    \ Notices, like warnings, do not cause the script to stop running. Notices are\
    \ much less likely to indicate serious problems than warnings. Notices just tell\
    \ you that you are doing something unusual and to take a second look at what you're\
    \ doing to be sure that you really want to do it.\n\nOne common reason why you\
    \ might receive a notice is if you're echoing variables that don't exist. Here's\
    \ an example of what you might see in that instance:\n\n```\nNotice: Undefined\
    \ variable: age\n    in testing.php on line 9\n```\n\nNotice that all types of\
    \ messages indicate the filename causing the problem and the line number where\
    \ the problem was encountered.\n\nPHP has several kinds of error and warning messages.\
    \ Which kinds are sent depends on the error message level that PHP is set to.\
    \ You do want to see all the error messages, but you might not want to see all\
    \ the warnings and notices. Often the only problem with a notice is the unsightly\
    \ message; the code does exactly what you want it to do. Or, you might want notices\
    \ displayed during development but not after the application is being used by\
    \ customers.\n\nTo change the error message level for your Web site to show more\
    \ or fewer messages, you must be the PHP administrator. Edit the php.ini file\
    \ on your system. It contains a section that explains the error message levels\
    \ and how to set them. Change the line that sets your error message level and\
    \ then save the edited php.ini file. Note: You might need to restart your Web\
    \ server before the changes in the PHP configuration file take effect.\n\nIf you\
    \ are not the PHP administrator for your system and don't have access to php.ini,\
    \ you can add a statement to any program that sets the error reporting level for\
    \ that program only. To set the error level, add the following statement at the\
    \ beginning of the program:"
  merge: -1
  img_proc: true
- pgno: 141
  md: '`error_reporting(OPTIONS);`

    OPTIONS is a code that tells PHP what error reporting level to use. To see all
    errors, use the following:

    `error_reporting(E_ALL);`


    To see all errors except notices, use the following:

    `error_reporting(E_ALL & ~E_NOTICE);`

    OPTIONS can be any of the codes described in the `php.ini` file.


    # Using PHP Variables


    Variables are containers used to hold information. A variable has a name, and
    information is stored in the variable. For instance, you might name a variable
    $age and store the number 12 in it. After information is stored in a variable,
    it can be used later in the program. One of the most common uses for variables
    is to hold the information that a user types into a form.


    # Naming a variable


    When you''re naming a variable, keep the following rules in mind:


    +   - All variable names have a dollar sign ($) in front of them. This tells PHP
    that it is a variable name.

    +   - Variable names can be any length.

    +   - Variable names can include letters, numbers, and underscores only.

    +   - Variable names must begin with a letter or an underscore. They cannot begin
    with a number.

    +   - Uppercase and lowercase letters are not the same. For example, `$firstname`
    and `$Firstname` are not the same variable. If you store information in `$firstname`,
    you can''t access that information by using the variable name `$firstName`.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_141_0.png)


    When you name variables, use names that make it clear what information is in the
    variable. Using variable names like $var1, $var2, $A, or $B does not contribute
    to the clarity of the program. Although PHP doesn''t care what you name the variable
    and won''t get mixed up, people trying to follow the program will have a hard
    time keeping track of which variable holds what information. Variable names like
    $firstName, $age, and $orderTotal are much more descriptive and helpful.'
  merge: -1
  img_proc: true
