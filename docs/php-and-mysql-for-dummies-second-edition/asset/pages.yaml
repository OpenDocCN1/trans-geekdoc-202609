- pgno: 369
  md: '**24** Starts an `if` block that executes if the Member ID was found. That
    means that the user submitted a Member ID that is in the database. This block
    then checks to see whether the password submitted by the user is correct for the
    given Member ID. This block is documented in more detail in the following list:


    **26** Lines 26–28 create a query that looks for a row with both the Member ID
    and the password submitted by the customer. Notice that the password submitted
    in the form (`$fpassword`) is encrypted by using the MySQL function, `password()`.
    Passwords in the database are encrypted, so the password that you’re trying to
    match must also be encrypted, or it won’t match.


    **29** Lines 29–31 execute the query and check whether a match was found. `$num2`
    equals 1 or 0, depending on whether a row with both the Member ID and the password
    is found.


    **32** Starts an `if` block that executes if the password is correct. This is
    a successful login. Lines 32–41 are executed, performing the following tasks:
    1) The two session variables, `auth` and `logname`, are stored in the `SESSION`
    array. 2) `$today` is created with today’s date and time in the correct format
    expected by the database table. 3) A row for the login is entered into the Login
    table. 4) The first page of the Members Only section is sent to the member.


    **43** Starts an `else` block that executes if the password is not correct. This
    is an unsuccessful login. Lines 45–49 are executed, performing the following tasks:
    1) Unset the form variable `$do`. This prevents any confusion later. 2) Set the
    appropriate error message into `$message`. 3) Show the login page again. The login
    page will show the error message.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_369_0.png)


    Notice that the loop starting on line 43 lets the user know when they have a real
    login name but the wrong password. If the security of your data is very important,
    you may want to write this loop differently. Providing that information may be
    helpful to someone who is trying to break in. The cracker now only needs to find
    the password. For more security, just have one condition that gives the same error
    message whenever either the login name or the password is incorrect. In this example,
    I prefer to provide the information because it is helpful to the legitimate member
    (who may not remember whether he or she installed an account at all), and I’m
    not protecting any vital information.


    **51** Ends the block that executes when the Member ID is found in the database.


    **52** Starts an `if` block that executes when the Member ID is **not** found
    in the database. This could actually be an `else`, instead of an `elseif`, but
    I think that it’s clearer to humans with the `if` condition in the statement.
    This block unsets the form variable `$do`, creates the appropriate error message
    and also shows the login page again, which includes the error message.'
