    \ that do not match:\n+   \n+   - play it again, Sam\n+   - i\n\n+   `Dear (son|daughter)`\
    \ — **Two alternate strings**\n+   \n+   - `Dear` — Literal characters\n+   -\
    \ `(son|daughter)` — Either son or daughter\n+   \n+   Strings that match:\n+\
    \   \n+   - Dear son\n+   - My Dear daughter\n+   \n+   Strings that do not match:\n\
    +   \n+   - Dear Goliath\n+   - son"
