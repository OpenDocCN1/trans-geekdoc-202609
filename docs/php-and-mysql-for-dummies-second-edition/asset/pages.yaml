- pgno: 413
  md: '# # Configuring MySQL


    MySQL reads a configuration file when it starts up. If you use the defaults or
    an installer, you probably don’t need to add anything to the configuration file.
    However, if you install MySQL in a nonstandard location or want the databases
    to be stored somewhere other than the default, you might need to edit the configuration
    file.


    The file is named `my.ini` or `my.cnf`. It’s located in your system directory
    (such as WINNT) if you are using Windows and in `/etc` on Linux/Unix/Mac. The
    file looks something like the following:


    ```

    ```ini

    [mysqld]

    basedir=D:/mysql4

    datadir=D:/mysql4/data

    #port=3306

    ```

    ```


    The `basedir` line tells the MySQL server where MySQL is installed. The `datadir`
    line tells the server where the databases are located. The # at the beginning
    of the last line makes the line inactive. You could remove the # and change the
    port number to tell the server to listen for database queries on a different port.'
  merge: -1
  img_proc: true
