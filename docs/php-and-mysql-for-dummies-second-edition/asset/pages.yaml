    \ don’t include the word `ALL`. If `ALL` is not included, duplicate lines are\
    \ not added to the result.\n\nYou can use `ORDER BY` with each `SELECT` query,\
    \ as I discuss in the previous section, or you can use `ORDER BY` with a `UNION`\
    \ query to sort all the rows in the result set. If you want `ORDER BY` to apply\
    \ to the entire result set, rather than just to the query that it follows, use\
    \ parentheses as follows:\n\n```\n```sql\n(SELECT lastName FROM Member UNION ALL\n\
    \    SELECT lastName FROM OldMember) ORDER BY lastName\n```\n```\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_107_0.png)\n\
    \nThe `UNION` statement was introduced in MySQL 4.0. It is not available in MySQL\
    \ 3.\n\n# Join\n\nCombining tables side by side is a *join*. Tables are combined\
    \ by matching data in a column — the column that they have in common. The combined\
    \ results table produced by a join contains all the columns from both tables.\
    \ For instance, if one table has two columns (`memberID` and `height`), and the\
    \ second table has two columns (`memberID` and `weight`), a join results in a\
