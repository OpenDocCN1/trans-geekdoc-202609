- pgno: 155
  md: 'To ask a question in a program, you form a statement that compares values.
    The program tests the statement and determines whether the statement is true or
    false. For instance, you can state the preceding questions as


    +   - The customer is less than 13 years of age. True or false? If true, display
    the toy catalog.

    +   - Product 1 sales are higher than Product 2 sales. True or false? If true,
    display Product 1 first; if false, display Product 2 first.

    +   - The customer’s password is *secret*. True or false? If true, show the Members
    Only Web page.

    +   - The customer lives in Ohio. True or false? If true, display a map to the
    Ohio store location.


    Comparisons can be quite simple. For instance, is the first value larger than
    the second value? Or smaller? Or equal to? But sometimes you need to look at character
    strings to see whether they have certain characteristics instead of looking at
    their exact values. For instance, you might want to identify strings that begin
    with S or strings that look like phone numbers. For this type of comparison, you
    compare a string to a pattern, which I describe in the section “Matching character
    strings to patterns,” later in this chapter.


    # ## Making simple comparisons


    *Simple comparisons* compare one value to another value. PHP offers several ways
    to compare values. Table 6-3 shows the comparisons that are available.


    | Table 6-3 | Comparing Values |

    |---|---|

    | **Comparison** | **Description** |

    | `==` | Are the two values equal? |

    | `>` | Is the first value larger than the second value? |

    | `>=` | Is the first value larger than or equal to the second value? |

    | `<` | Is the first value smaller than the second value? |

    | `<=` | Is the first value smaller than or equal to the second value? |

    | `!=` | Are the two values not equal to each other? |

    | `<>` | Are the two values not equal to each other? |'
  merge: -1
  img_proc: true
- pgno: 156
  md: "You can compare both numbers and strings. Strings are compared alphabetically,\
    \ with all uppercase characters coming before any lowercase characters. For instance,\
    \ SS comes before Sa. Characters that are punctuation also have an order, and\
    \ one character can be found to be larger than another character. However, comparing\
    \ a comma to a period doesn't have much practical value.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_156_0.png)\n\
    \nStrings are compared based on their ASCII (American Standard Code for Information\
    \ Interchange) code. In the ASCII character set, each character is assigned an\
    \ ASCII code that corresponds to a decimal number between 0 and 127. When strings\
    \ are compared, they are compared based on this code. For instance, the number\
    \ that represents the comma is 44. The period corresponds to 46. Therefore, if\
    \ a period and a comma are compared, the period is seen as larger.\n\nComparisons\
    \ are often used to execute statements only under certain conditions. For instance,\
    \ in the following example, the block of statements is only executed when the\
    \ comparison $weather == \"raining\" is true:\n\n```\nif ( $weather == \"raining\"\
    \ )\n{\n    put up umbrella;\n    cancel picnic;\n}\n```\n\nPHP checks the variable\
    \ $weather to see whether it is equal to \"raining\". If it is, PHP executes the\
    \ two statements. If $weather is not equal to \"raining\", PHP does not execute\
    \ the two statements.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_156_1.png)\n\
    \nThe comparison sign is two equal signs (==). One of the most common mistakes\
    \ is to use a single equal sign for a comparison. A single equal sign puts the\
    \ value into the variable. Thus, a statement like if ($weather = \"raining\")\
    \ would set $weather to raining rather than check whether it already equaled raining\
    \ and would thus always be true.\n\nFor example, here's a solution to the programming\
    \ problem presented at the beginning of this section. The problem is\n\n```\n\
    if user is a child\n    show toy catalog\nif user is not a child\n    show electronics\
    \ catalog\n```\n\nTo determine whether a customer is an adult, you compare the\
    \ customer's age with the age when the customer is considered to be an adult.\
    \ You need to decide at what age a customer would stop being interested in toy\
    \ catalogs and start being more interested in electronic catalogs. Suppose you\
    \ decide that 13 seems like the right age. You then ask whether the customer is\
    \ younger than 13 by comparing the customer's age to 13. If the age is less than\
    \ 13, show the toy catalog; if the age is 13 or over, show the electronics catalog.\
    \ These comparisons would have the following format:"
  merge: -1
  img_proc: true
- pgno: 157
  md: "```\n$age < 13    (is the customer's age less than 13?)\n$age >= 13   (is the\
    \ customer's age greater than or equal to 13?)\n```\n\nOne way to program the\
    \ conditional actions is to use the following statements:\n\n```\nif ($age < 13)\n\
    \    $status = \"child\";\nif ($age >= 13)\n    $status = \"adult\";\n```\n\n\
    These statements instruct PHP to compare the customer's age to 13. In the first\
    \ statement, if the customer's age is less than 13, the customer's status is set\
    \ to \"child\". In the second statement, if the customer's age is equal to 13\
    \ or greater than 13, the customer's status is set to \"adult\". You then show\
    \ the toy catalog to customers whose status is child and show the electronic catalog\
    \ to those whose status is adult. Although you can write these if statements in\
    \ a more efficient way, the statements shown will work. A full description of\
    \ conditional statements is provided in Chapter 7.\n\n# Matching character strings\
    \ to patterns\n\nSometimes you need to compare character strings to see whether\
    \ they fit certain characteristics rather than whether they match exact values.\
    \ For instance, you might want to identify strings that begin with S or strings\
    \ that have numbers in them. For this type of comparison, you compare the string\
    \ to a pattern. These patterns are regular expressions.\n\nYou've probably used\
    \ some form of pattern matching in the past. For instance, when you use an asterisk\
    \ (*) as a wildcard when searching for files (dir s*.doc or ls s*.txt), you are\
    \ pattern matching. For instance, c*.txt is a pattern. Any string that begins\
    \ with a c and ends with the string .txt, with any characters in between the c\
    \ and the .txt, matches the pattern. The strings cow.txt, c3333.txt, and c3c4.txt\
    \ all match the pattern. Using regular expressions is just a more complicated\
    \ variation of using wildcards.\n\nThe most common use for pattern matching on\
    \ Web pages is to check the input from a form. If the information doesn't make\
    \ sense, it's probably not something that you want to store in your database.\
    \ For instance, if the user types a name into a form, you can check whether it\
    \ seems like a real name by matching patterns. You know that a name consists mainly\
    \ of letters and spaces. Other valid characters might be a hyphen (-) — for example,\
    \ in the name Smith-Kline — and a single quote (') — for example, O'Hara. You\
    \ can check the name by setting up a pattern that's a string containing only letters,\
    \ spaces, hyphens, and single quotes and then matching the name to the pattern.\
    \ If the name doesn't match — that is, if it contains characters not in the pattern,\
    \ such as numerals or a question mark (?) — it's not a real name."
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Patterns consist of literal characters and special characters. *Literal characters*
    are normal characters, with no other special meaning. A `c` is a `c` with no meaning
    other than it’s one of the 26 letters in the English alphabet. Special characters
    have special meaning in the pattern, such as the asterisk (`*`) when used as a
    wildcard. Table 6-4 shows the special characters used in patterns.


    | Character | Meaning | Example | Match | Not a Match |

    |---|---|---|---|---|

    | `^` | Beginning of line. | `^c` | cat | my cat |

    | `$` | End of line. | `c$` | tic | stick |

    | `.` | Any single character. | `..` | Any string that contains at least two characters
    | a, I |

    | `?` | Preceding character is optional. | `mea?n` | mean, men | moan |

    | `( )` | Groups literal characters into a string that must be matched exactly.
    | `m(ea)n` | mean | men, mn |

    | `[ ]` | Encloses a set of optional literal characters. | `m[ea]n` | men, man
    | mean, mn |

    | `-` | Represents all the characters between two characters. | `m[a-c]n` | man,
    mbn, mcn | mdn, mun, maan |

    | `+` | One or more of the preceding items. | `door[1-3]+` | door111, door131
    | door, door55 |

    | `*` | Zero or more of the preceding items. | `door[1-3]*` | door, door311 |
    door4, door445 |'
  merge: -1
