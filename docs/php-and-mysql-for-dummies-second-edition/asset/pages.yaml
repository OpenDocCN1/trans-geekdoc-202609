    The program in Listing 8-4 proceeds as follows:


    +   1. It connects to the MySQL server in the main program.

    +   2. It calls the function getPetsOfType. It passes "horse" as a character string
    and also sets up $petInfo to receive the data returned by the function.

    +   3. The function selects the database PetCatalog.

    +   4. The function sends a query to get all the rows with horse in the petType
    column. The data is stored in a table in a temporary location. The variable $result
    identifies the location of the temporary table.

    +   5. It sets up a counter. $j is a counter that is incremented in each loop.
    It starts at 1 before the loop.

    +   6. It starts a while loop. The function attempts to get a row from the temporary
    data table and is successful. If there were no rows to get in the temporary location,
    the while loop would end.'
