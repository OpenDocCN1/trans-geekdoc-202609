- pgno: 35
  md: 'The MySQL server must be able to understand the instructions that you send
    it. You communicate by using SQL (Structured Query Language), which is a standard
    language understood by many RDBMSs. The MySQL server understands SQL. PHP doesn’t
    understand SQL, but it doesn’t need to: PHP just establishes a connection with
    the MySQL server and sends the SQL message over the connection. The MySQL server
    interprets the SQL message and follows the instructions. The MySQL server sends
    a return message, stating its status and what it did (or reporting an error if
    it was unable to understand or follow the instructions). For the lowdown on how
    to write and send SQL messages to MySQL, check out Part II of this book.


    # PHP, a Data Mover


    PHP, a scripting language designed specifically for use on the Web, is your tool
    for creating dynamic Web pages. Rich in features that make Web design and programming
    easier, PHP is in use on over 13 million domains (according to the Netcraft survey
    at www.php.net/usage.php). Its popularity continues to grow, meaning that it must
    be fulfilling its function pretty well.


    PHP stands for PHP: HyperText Preprocessor. In its early development by a guy
    named Rasmus Lerdorf, it was called Personal Home Page tools. When it developed
    into a full-blown language, the name was changed to be more in line with its expanded
    functionality.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_35_0.png)


    The PHP language''s syntax is similar to the syntax of C, so if you have experience
    with C, you''ll be comfortable with PHP. PHP is actually simpler than C because
    it doesn''t use some of the more difficult concepts of C. PHP also doesn''t include
    the low-level programming capabilities of C because PHP is designed to program
    Web sites and doesn''t require those capabilities.


    PHP is particularly strong in its ability to interact with databases. PHP supports
    pretty much every database you''ve ever heard of (and some you haven''t). PHP
    handles connecting to the database and communicating with it. You don''t need
    to know the technical details for connecting to a database or for exchanging messages
    with it. You tell PHP the name of the database and where it is, and PHP handles
    the details. It connects to the database, passes your instructions to the database,
    and returns the database response to you.


    Technical support is available for PHP. You can join one of several e-mail discussion
    lists offered on the PHP Web site (www.php.net), including a list for databases
    and PHP. In addition, a Web interface to the discussion lists is available at
    news.php.net, where you can browse or search the messages.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Advantages of PHP


    The popularity of PHP is growing rapidly because of its many advantages:


    +   - **It''s fast.** Because it is embedded in HTML code, the response time is
    short.

    +   - **It''s inexpensive — free, in fact.** PHP is proof that free lunches do
    exist and that you can get more than you paid for.

    +   - **It''s easy to use.** PHP contains many special features and functions
    needed to create dynamic Web pages. The PHP language is designed to be included
    easily in an HTML file.

    +   - **It can run on many operating systems.** It runs on a wide variety of operating
    systems — Windows, Linux, Mac OS, and most varieties of Unix.

    +   - **Technical support is widely available.** A large base of users provides
    free support via e-mail discussion lists.

    +   - **It''s secure.** The user does not see the PHP code.

    +   - **It''s designed to support databases.** PHP includes functionality designed
    to interact with specific databases. It relieves you of the need to know the technical
    details required to communicate with a database.

    +   - **It''s customizable.** The open source license allows programmers to modify
    the PHP software, adding or modifying features as needed to fit their own specific
    environments.


    # How PHP works


    PHP is an embedded scripting language when used in Web pages. This means that
    PHP code is embedded in HTML code. You use HTML tags to enclose the PHP language
    that you embed in your HTML file — the same way that you would use other HTML
    tags. You create and edit Web pages containing PHP the same way that you create
    and edit regular HTML pages.


    The PHP software works in conjunction with the Web server. The Web server is the
    software that delivers Web pages to the world. When you type a URL into your Web
    browser, you''re sending a message to the Web server at that URL, asking it to
    send you an HTML file. The Web server responds by sending the requested file.
    Your browser reads the HTML file and displays the Web page. You also request the
    Web server to send you a file when you click a link in a Web page. In addition,
    the Web server processes a file when you click a Web page button that submits
    a form.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'When PHP is installed, the Web server is configured to expect certain file
    extensions to contain PHP language statements. Often the extension is .php or
    .phtml, but any extension can be used. When the Web server gets a request for
    a file with the designated extension, it sends the HTML statements as-is, but
    PHP statements are processed by the PHP software before they’re sent to the requester.


    When PHP language statements are processed, only the output is sent by the Web
    server to the Web browser. The PHP language statements are not included in the
    output sent to the browser, so the PHP code is secure and transparent to the user.
    For instance, in this simple PHP statement:


    ```

    <?php echo "<p>Hello World"; ?>

    ```


    <?php is the PHP opening tag, and ?> is the closing tag. echo is a PHP instruction
    that tells PHP to output the upcoming text. The PHP software processes the PHP
    statement and outputs this:


    ```

    <p>Hello World

    ```


    which is a regular HTML statement. This HTML statement is delivered to the user’s
    browser. The browser interprets the statement as HTML code and displays a Web
    page with one paragraph — Hello World. The PHP statement is not delivered to the
    browser, so the user never sees any PHP statements.


    PHP and the Web server must work closely together. PHP is not integrated with
    all Web servers, but it does work with many of the most popular Web servers. PHP
    is developed as a project of the Apache Software Foundation — consequently, it
    works best with Apache. PHP also works with Microsoft IIS/PWS, iPlanet (formerly
    Netscape Enterprise Server), and others.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_37_0.png)


    Although PHP works with several Web servers, it works best with Apache. If you
    can select or influence the selection of the Web server used in your organization,
    select Apache. By itself, Apache is a good choice. It is free, open source, stable,
    and popular. It currently powers over 60 percent of all Web sites, according to
    the Web server survey at www.netcraft.com. It runs on Windows, Linux, Mac OS,
    and most flavors of Unix.


    # MySQL and PHP, the Perfect Pair


    MySQL and PHP are frequently used together. They are often called the dynamic
    duo. MySQL provides the database part, and PHP provides the application part of
    your Web database application.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# # Advantages of the relationship


    MySQL and PHP as a pair have several advantages:


    +   - **They’re free.** It’s hard to beat free for cost-effectiveness.

    +   - **They’re Web-oriented.** Both were designed specifically for use on Web
    sites. Both have a set of features that are focused on building dynamic Web sites.

    +   - **They’re easy to use.** Both were designed to get a Web site up quickly.

    +   - **They’re fast.** Both were designed with speed as a major goal. Together
    they provide one of the fastest ways to deliver dynamic Web pages to users.

    +   - **They communicate well with one another.** PHP has built-in features for
    communicating with MySQL. You don’t need to know the technical details; just leave
    it to PHP.

    +   - **A wide base of support is available for both.** Both have large user bases.
    Because they are often used as a pair, they often have the same user base. Many
    people are available to help, including those on e-mail discussion lists who have
    experience using MySQL and PHP together.

    +   - **They’re customizable.** Both are open source, thus allowing programmers
    to modify the PHP and MySQL software to fit their own specific environments.


    # # How MySQL and PHP work together


    PHP provides the application part, and MySQL provides the database part of a Web
    database application. You use the PHP language to write the programs that perform
    the application tasks. PHP is flexible enough to perform all the tasks that your
    application requires. It can be used for simple tasks (such as displaying a Web
    page) or for complicated tasks (such as accepting and verifying data that a user
    typed into an HTML form). One of the tasks that your application must do is move
    data into and out of the database — and PHP has built-in features to use when
    writing programs that move data into and out of a MySQL database.


    PHP statements are embedded in your HTML files with PHP tags. When the task to
    be performed by the application requires storing or retrieving data, you use specific
    PHP statements designed to interact with a MySQL database. You use one PHP statement
    to connect to the correct database, telling PHP where the database is located,
    its name, and the password needed to connect to it. The database doesn’t need
    to be on the same machine as your Web site;'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'PHP can communicate with a database across a network. You use another PHP statement
    to send instructions to MySQL. You send an SQL message across the connection,
    giving MySQL instructions for the task that you want done. MySQL returns a status
    message that shows whether it successfully performed the task. If there was a
    problem, it returns an error message. If your SQL message asked to retrieve some
    data, MySQL sends the data that you asked for, and PHP stores it in a temporary
    location where it is available to you.


    You then use one or more PHP statements to complete the application task. For
    instance, you can use PHP statements to display data that you retrieved. Or you
    might use PHP statements to display a status message in the browser, informing
    the user that the data was saved.


    As an RDBMS, MySQL can store very complex information. As a scripting language,
    PHP can perform very complicated manipulation of data, either data that you need
    to modify before saving it in the database or data that you retrieved from the
    database and need to modify before displaying or using it for another task. Together,
    PHP and MySQL can be used to build a Web database application that has a very
    sophisticated and complicated purpose.


    # Keeping Up with PHP and MySQL Changes


    PHP and MySQL are open source software. If you''ve only used software from major
    software publishers — such as Microsoft, Macromedia, or Adobe — you''ll find that
    open source software is an entirely different species. It''s developed by a group
    of programmers who write the code in their spare time, for fun and for free. There''s
    no corporate office.


    Open source software changes frequently, rather than once every year or two like
    commercial software does. It changes when the developers feel that it''s ready.
    It also changes quickly in response to problems. When a serious problem is found
    — such as a security hole — a new version that fixes the problem can be released
    in days. You don''t receive glossy brochures or see splashy magazine ads for a
    year before a new version is released. Thus, if you don''t make the effort to
    stay informed, you could miss the release of a new version or be unaware of a
    serious problem with your current version.


    Visit the PHP and MySQL Web sites often. You need to know the information that''s
    published there. Join the mailing lists, which often are very high in traffic.
    When you first get acquainted with PHP and MySQL, the large number of mail messages
    on the discussion lists bring valuable information into your'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'e-mail box; you can pick up a lot by reading those messages. And soon, you
    might be able to help others based on your own experience. At the very least,
    subscribe to the announcement mailing list, which only delivers e-mail occasionally.
    Any important problems or new versions are announced here. The e-mail that you
    receive from the announcement list contains information that you need to know.
    So, right now, before you forget, hop over to the PHP and MySQL Web sites and
    sign up for a list or two at `www.php.net/mailing-lists.php` and `lists.mysql.com`.


    You should be aware of some significant changes in previous PHP versions because
    existing scripts that work fine on earlier versions could have problems when they’re
    run on a later version and vice versa. The following are some changes that you
    should be aware of:


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_40_0.png)


    +   - **Version 5.0.0:** Added support for MySQL 4.1. Support for MySQL 4.0 is
    not included automatically; it must be included as an option when PHP is installed.
    Changed the filename of the PHP interpreter used with a Web server from `.php`
    to `.php-cgi`.

    +   - **Version 4.3.1:** Fixed a security problem in 4.3.0. It’s not wise to continue
    to run a Web site using versions 4.3.0 or earlier.

    +   - **Version 4.2.0:** Changed the default setting for `register_globals` to
    `Off`. Scripts running under previous versions might depend on `register_globals`
    being set to `On` and could stop running with the new setting. It’s best to change
    the coding of the script so that it runs with `register_globals` set to `Off`.

    +   - **Version 4.1.0:** Introduced the superglobal arrays. Scripts written with
    the superglobals (as I describe in Chapter 6) won’t run in earlier versions. Prior
    to 4.1.0, you must use the old style arrays, such as `$HTTP_POST_VARS`.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Chapter 2


    # Setting Up Your Work Environment


    # In This Chapter


    +   - Getting access to PHP and MySQL through company Web sites and Web hosting
    companies

    +   - Building your own Web site from scratch

    +   - Testing PHP and MySQL


    After you decide to use PHP and MySQL, your first task is to get access to them.
    A work setting already set up for Web application development might be ready and
    waiting for you with all the tools that you need. On the other hand, it might
    be part of your job to set up this work setting yourself. Perhaps your job is
    to create a whole new Web site. In this chapter, I describe the tools that you
    need and how to get access to them.


    # The Required Tools


    To put up your dynamic Web site, you need to have access to the following three
    software tools:


    +   - **A Web server:** The software that delivers your Web pages to the world

    +   - **MySQL:** The RDBMS (Relational Database Management System) that will store
    information for your Web database application

    +   - **PHP:** The scripting language that you’ll use to write the programs that
    provide the dynamic functionality for your Web site


    I describe these three tools in detail in Chapter 1.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_41_0.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# Finding a Place to Work\n\nTo create your dynamic Web pages, you need access\
    \ to a Web site that provides your three software tools (see the preceding section).\
    \ All Web sites include a Web server, but not all Web sites provide MySQL and\
    \ PHP. These are the most common environments in which you can develop your Web\
    \ site:\n\n+   ✓ **A Web site put up by a company on its own computer:** The company\
    \ — usually the company's IT (Information Technology) department — installs and\
    \ administers the Web site software. Your job, for the purposes of this book,\
    \ is to program the Web site, either as an employee of the company or as a contractor.\n\
    +   \n+   ✓ **A Web site that's hosted by a Web hosting company:** The Web site\
    \ is located on the Web hosting company's computer. The Web hosting company installs\
    \ and maintains the Web site software and provides space on its computer where\
    \ you can install the HTML (HyperText Markup Language) files for a Web site.\n\
    +   \n+   ✓ **A Web site that doesn't yet exist:** You plan to install and maintain\
    \ the Web site software yourself. It could be a Web site of your own that you're\
    \ building on your own computer, or it might be a Web site that you're installing\
    \ for a client on the client's computer.\n\nHow much you need to understand about\
    \ the administration and operation of the Web site software depends on the type\
    \ of Web site access that you have. In the next few sections, I describe these\
    \ environments in more detail and explain how you gain access to PHP and MySQL.\n\
    \n# A company Web site\n\nWhen the Web site is run by the company, you don't need\
    \ to understand the installation and administration of the Web site software at\
    \ all. The company is responsible for the operation of the Web site. In most cases,\
    \ the Web site already exists, and your job is to add to, modify, or redesign\
    \ the existing Web site. In a few cases, the company might be installing its first\
    \ Web site, and your job is to design the Web site. In either case, your responsibility\
    \ is to write and install the HTML files for the Web site. You are not responsible\
    \ for the operation of the Web site.\n\nYou access the Web site software through\
    \ the company's IT department. The name of this department can vary in different\
    \ companies, but its function is the same: It keeps the company's computers running\
    \ and up-to-date."
  merge: -1
  img_proc: true
- pgno: 43
  md: 'If PHP and/or MySQL aren’t available on the company’s Web site, IT needs to
    install them and make them available to you. PHP and MySQL have many options,
    but IT might not understand the best options — and might have options set in ways
    that aren’t well suited for your purposes. If you need PHP or MySQL options changed,
    you need to request that IT make the change; you won’t be able to make the change
    yourself. For instance, PHP must be installed with MySQL support enabled, so if
    PHP isn’t communicating correctly with MySQL, IT might have to reinstall PHP with
    MySQL support enabled.


    In order for the world to see the company’s Web pages, the HTML files must be
    in a specific location on the computer. The Web server that delivers the Web pages
    to the world expects to find the HTML files in a specific directory. The IT department
    should provide you with access to the directory where the HTML files need to be
    installed. In most cases, you develop and test your Web pages in a test location
    and then transfer the completed files to their permanent home. Depending on the
    access that IT gives you, you might copy the files from the test location to the
    permanent location, or you might transfer the files via *FTP (File Transfer Protocol)*,
    which is a method of copying a file from one computer to another on a network).
    In some cases, for security reasons, the IT folks won’t give you access to the
    permanent location, preferring to install the files in their permanent location
    themselves.


    In order to use the Web software tools and build your dynamic Web site, you need
    the following information from IT:


    +   - **The location of Web pages:** You need to know where to put the files for
    the Web pages. IT needs to provide you with the name and location of the directory
    where the files should be installed. Also, you need to know how to install the
    files — copy them, FTP them, or use other methods. You might need a user ID and
    password in order to install the files.

    +   - **The default file name:** When users point their browsers at a URL, a file
    is sent to them. The Web server is set up to send a file with a specific name
    when the URL points to a directory. The file that is automatically sent is the
    *default file*. Very often the default file is named `index.htm` or `index.html`,
    but sometimes other names are used, such as `default.htm`. Ask IT what you should
    name your default file.

    +   - **A MySQL account:** Access to MySQL databases is controlled through a system
    of account names and passwords. IT sets up a MySQL account for you that has the
    appropriate permissions and also gives you the MySQL account name and password.
    (I explain MySQL accounts in detail in Chapter 5.)'
  merge: -1
  img_proc: true
- pgno: 44
  md: "+   - **The location of the MySQL databases:** MySQL databases need not be\
    \ located on the same computer as the Web site. If the MySQL databases are located\
    \ on a computer other than that of the Web site, you need to know the *hostname*\
    \ (for example, `thor.companyname.com`) where the databases can be found.\n+ \
    \  \n+   - **The PHP file extension:** When PHP is installed, the Web server is\
    \ instructed to expect PHP statements in files with specific extensions. Frequently,\
    \ the extensions used are `.php` or `.phtml`, but other extensions can be used.\
    \ PHP statements in files that don't have the correct extension won't be processed.\
    \ Ask IT what extension to use for your PHP programs.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_44_0.png)\n\
    \nYou will interact with the IT folks frequently as needs arise. For example,\
    \ you might need options changed, you might need information to help you interpret\
    \ an error message, or you might need to report a problem with the Web site software.\
    \ So a good relationship with the IT folks will make your life much easier. Bring\
    \ them tasty cookies and doughnuts often.\n\n# A Web hosting company\n\nA Web\
    \ hosting company provides everything that you need to put up a Web site, including\
    \ the computer space and all the Web site software. You just create the files\
    \ for your Web pages and move them to a location specified by the Web hosting\
    \ company.\n\nAbout a gazillion companies offer Web hosting services. Most charge\
    \ a monthly fee (often quite small), and some are even free. (Most, but not all,\
    \ of the free ones require you to display advertising.) Usually, the monthly fee\
    \ varies depending on the resources provided for your Web site. For instance,\
    \ a Web site with 2MB of disk space for your Web page files would cost less than\
    \ a Web site with 10MB of disk space.\n\nWhen looking for a place to host your\
    \ Web site, make sure that the Web hosting company offers the following:\n\n+\
    \   - **PHP and MySQL:** Not all companies provide these tools. You might have\
    \ to pay more for a site with access to PHP and MySQL; sometimes you have to pay\
    \ an additional fee for MySQL databases.\n+   \n+   - **A recent version of PHP:**\
    \ Sometimes the PHP versions offered aren't the most recent versions. You certainly\
    \ shouldn't even consider a Web site that has access only to PHP 3. You want PHP\
    \ 4 at least. Preferably, you want access to PHP 5.\n\nOther considerations when\
    \ choosing a Web hosting company are"
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   - **Reliability:** You need a Web hosting company that you can depend on
    — one that won’t go broke and disappear tomorrow, and one that isn’t running on
    old computers, held together by chewing gum and baling wire, with more downtime
    than uptime.

    +   - **Speed:** Web pages that download slowly are a problem because users will
    get impatient and go elsewhere. Slow pages could be a result of a Web hosting
    company that started its business on a shoestring and has a shortage of good equipment
    — or the Web hosting company might be so successful that its equipment is overwhelmed
    by new customers. Either way, Web hosting companies that deliver Web pages too
    slowly are unacceptable.

    +   - **Technical support:** Some Web hosting companies have no one available
    to answer questions or troubleshoot problems. Technical support is often provided
    through e-mail only, which can be acceptable if the response time is short. Sometimes
    you can test the quality of the company’s support by calling the tech support
    number, or test the e-mail response time by sending an e-mail.

    +   - **The domain name:** Each Web site has a domain name that Web browsers use
    to find the site on the Web. Each domain name is registered for a small yearly
    fee so that only one Web site can use it. Some Web hosting companies allow you
    to use a domain name that you have registered independently of the Web hosting
    company, some assist you in registering and using a new domain name, and some
    require that you use their domain name. For instance, suppose that your name is
    Lola Designer and you want your Web site to be named LolaDesigner. Some Web hosting
    companies will allow your Web site to be LolaDesigner.com, but some will require
    that your Web site be named LolaDesigner.webhostingcompanyname.com, or webhostingcompanyname.com/~LolaDesigner,
    or something similar. In general, your Web site will look more professional if
    you use your own domain name.

    +   - **Backups:** *Backups* are copies of your Web page files and your database
    that are stored in case your files or database are lost or damaged. You want to
    be sure that the company makes regular, frequent backup copies of your application.
    You also want to know how long it would take for backups to be put in place to
    restore your Web site to working order after a problem.

    +   - **Features:** Select features based on the purpose of your Web site. Usually
    a hosting company bundles features together into plans — more features = higher
    cost. Some features to consider are:

    +     - **Disk space:** How many MB/GB of disk space will your Web site require?
    Media files, such as graphics or music files, can be quite large.

    +     - **Data transfer:** Some hosting companies charge you for sending Web pages
    to users. If you expect to have a lot of traffic on your Web site, this cost should
    be a consideration.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - **E-mail addresses:** Many hosting companies provide you with a number
    of e-mail addresses for your Web site. For instance, if your Web site is `LolaDesigner.com`,
    you could allow users to send you e-mail at `me@LolaDesigner.com`.

    +   - **Software:** Hosting companies offer access to a variety of software for
    Web development. PHP and MySQL are the software that I discuss in this book. Some
    hosting companies might offer other databases, and some might offer other development
    tools such as FrontPage extensions, shopping cart software, and credit card validation.

    +   - **Statistics:** Often you can get statistics regarding your Web traffic,
    such as the number of users, time of access, access by Web page, and so on.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_46_0.png)


    # ## Domain names


    Every Web site needs a unique address on the Web. The unique address used by computers
    to locate a Web site is the *IP address*, which is a series of four numbers between
    0 and 255, separated by dots—for example, `172.17.204.2` or `192.163.2.33`.


    Because IP addresses are made up of numbers and dots, they’re not easy to remember.
    Fortunately, most IP addresses have an associated name that’s much easier to remember,
    such as `amazon.com`, `www.irs.gov`, or `mycompany.com`. A name that is an address
    for a Web site is a *domain name*. A domain can be one computer or many connected
    computers. When a domain refers to several computers, each computer in the domain
    can have its own name. A name that includes an individual computer name, such
    as `thor.mycompany.com`, identifies a *subdomain*.


    Each domain name must be unique in order to serve as an address. Consequently,
    a system of registering domain names ensures that no two locations use the same
    domain name. Anyone can register any domain name as long as the name isn’t already
    taken.


    You can register a domain name on the Web. First, you test your potential domain
    name to find out whether it’s available. If it’s available, you register it in
    your name or a company name and pay the fee. The name is then yours to use, and
    no one else can use it. The standard fee for domain name registration is $35 per
    year. You should never pay more, but bargains are often available.


    Many Web sites provide the ability to register a domain name, including the Web
    sites of many Web hosting companies. A search at Google (`www.google.com`) for
    *domain name register* results in over 3 million hits. Shop around to be sure
    that you find the lowest price. Also, many Web sites allow you to enter a domain
    name and see whom it is registered to. These Web sites do a domain name database
    search using a tool called *whois*. A search at Google for *domain name whois*
    results in 770,000 hits. A couple of places where you can do a whois search are
    Allwhois.com (`www.allwhois.com`) and BetterWhois.com (`www.betterwhois.com`).'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'One disadvantage of hosting your site with a commercial Web hosting company
    is that you have no control over your development environment. The Web hosting
    company provides the environment that works best for it — probably setting up
    the environment for ease of maintenance, low cost, and minimal customer defections.
    Most of your environment is set by the company, and you can’t change it. You can
    only beg the company to change it. The company will be reluctant to change a working
    setup, fearing that a change could cause problems for the company’s system or
    for other customers.


    Access to MySQL databases is controlled via a system of accounts and passwords
    that must be maintained manually, thus causing extra work for the hosting company.
    For this reason, many hosting companies either don’t offer MySQL or charge extra
    for it. Also, PHP has a myriad of options that can be set, unset, or given various
    values. The hosting company decides the option settings based on its needs, which
    might or might not be ideal for your purposes.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_47_0.png)


    It’s pretty difficult to research Web hosting companies from a standing start
    — a search at Google.com for *Web hosting* results in almost 6 million hits. The
    best way to research Web hosting companies is to ask for recommendations from
    people who have experience with those companies. People who have used a hosting
    company can warn you if the service is slow or the computers are down often. After
    you gather a few names of Web hosting companies from satisfied customers, you
    can narrow the list to the one that is best suited to your purposes and is the
    most cost-effective.


    # ## Setting up and running your own Web site


    If you’re starting a Web site from scratch, you need to understand the Web site
    software fairly well. You have to make several decisions regarding hardware and
    software. You have to install a Web server, PHP, and MySQL — as well as maintain,
    administer, and update the system yourself. Taking this route requires more work
    and more knowledge. The advantage is that you have total control over the Web
    development environment.


    Here are the general steps that lead to your dynamic Web site (I explain these
    steps in more detail in the next few sections):


    +   1. Set up the computer.

    +   2. Install the Web server.

    +   3. Install MySQL.

    +   4. Install PHP.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'If you’re starting from scratch, with nothing but an empty space where the
    computer will go, start at Step 1. If you already have a running computer but
    no Web software, start at Step 2. Or if you have an existing Web site that does
    not have PHP and MySQL installed, start with Step 3.


    # ### Setting up the computer


    Your first decision is to choose which hardware platform and operating system
    to use. In most cases, you’ll choose a PC with either Linux or Windows as the
    operating system. Here are some advantages and disadvantages of these two operating
    systems:


    +   - **Linux:** Linux is open source, so it’s free. It also has advantages for
    use as a Web server: It runs for long periods without needing to be rebooted;
    and *Apache*, the most popular Web server, runs better on Linux than Windows.
    Running Linux on a PC is the lowest cost option. The disadvantage of running Linux
    is that many people find Linux more difficult to install, configure, administer,
    and install software on than Windows.

    +   - **Windows:** Unlike Linux, Windows is not free. However, the advantages
    are that most people feel that Windows is easier to use, and because it’s widely
    used, many people can help you if you have problems.


    I assume that you’re buying a computer with the operating system and software
    installed, ready to use. It’s easier to find a computer that comes with Windows
    installed on it than with Linux, but Linux computers are available. For instance,
    at this time, Dell, IBM, and Hewlett-Packard offer computers with Linux installed.


    If you’re building your own hardware, you need more information than I have room
    to provide in this book. If you have the hardware and plan to install an operating
    system, Windows is easier to install, but Linux is getting easier all the time.
    You can install Linux from a CD, like Windows, but you often must provide information
    or make decisions that require more knowledge about your system. If you already
    know how to perform system administration tasks (such as installing software and
    making backups) in Windows or in Linux, the fastest solution is to use the operating
    system that you already know.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_48_0.png)


    For using PHP and MySQL, you should seriously consider Linux. PHP is a project
    of the Apache Software Foundation, so it runs best with the Apache server. And
    Apache runs better on Linux than on Windows. Therefore, if all other things are
    equal and the computer is mainly for running a Web site with a Web database application,
    Linux is well suited for your purposes.


    Other solutions besides a PC with Windows or Linux are available, but they’re
    less popular:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - **Unix-based:** Other free, Unix-based operating systems are available
    for PCs, such as FreeBSD (which some people prefer to Linux) or a version of Solaris
    provided by Sun for free download.

    +   - **Mac:** Mac computers can be used as Web servers. Most newer Macs come
    with PHP installed. Installing PHP and MySQL on Mac OS X is fairly simple. There
    are fewer Mac users, however, so it can be difficult to find help when you need
    it. One good site is www.phpmac.com.


    # Installing the Web server


    After you set up the computer, you need to decide which Web server to install.
    The answer is almost always Apache. Apache offers the following advantages:


    +   - **It''s free.** What else do I need to say?

    +   - **It runs on a wide variety of operating systems.** Apache runs on Windows,
    Linux, Mac OS, FreeBSD, and most varieties of Unix.

    +   - **It''s popular.** Approximately 60 percent of Web sites on the Internet
    use Apache, according to surveys at www.netcraft.com/survey and at www.securityspace.com/s_survey/data/.
    This wouldn''t be true if it didn''t work well. Also, this means that a large
    group of users can provide help.

    +   - **It''s reliable.** After Apache is up and running, it should run as long
    as your computer runs. Emergency problems with Apache are extremely rare.

    +   - **It''s customizable.** The open source license allows programmers to modify
    the Apache software, adding or modifying modules as needed to fit their own specific
    environment.

    +   - **It''s secure.** Free software is available that runs with Apache to make
    it into an SSL (Secure Sockets Layer) server. Security is an essential issue if
    you''re using the site for e-commerce.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_49_0.png)


    Apache is automatically installed when you install most Linux distributions. Most
    recent Macs come with Apache installed. For most other Unix flavors, you have
    to download the Apache source code and compile it yourself, although some binaries
    (programs that are already compiled for specific operating systems) are available.
    For Windows, you need to install a binary file — preferably on Windows NT/2000/XP,
    although Apache also runs on Windows 95/98/Me. As of this writing, Apache 1.3.28
    and 2.0.47 are the current stable releases. (Information on Apache versions is
    available in Appendix C.) See the Apache Web site (httpd.apache.org) for information,
    software downloads, documentation, and installation instructions for various operating
    systems. The Web site provides extensive documentation that is improving all the
    time.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Other Web servers are available. Microsoft offers IIS (Internet Information
    Server), which is the second most-popular Web server on the Internet with approximately
    27 percent of Web sites. Sun offers iPlanet (formerly Netscape Enterprise Server),
    which serves less than 5 percent of the Internet. Other Web servers are available,
    but they have even smaller user bases.


    # Installing MySQL


    After setting up the computer and installing the Web server, you’re ready to install
    MySQL. You need to install MySQL before installing PHP because you need to provide
    the path to the MySQL software when you install PHP.


    But before installing MySQL, be sure that you actually need to install it. It
    might already be running on your computer, or it might be installed but not running.
    For instance, many Linux distributions automatically install MySQL. Here’s how
    to check whether MySQL is currently running:


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_50_0.png)


    Linux/Unix/Mac: At the command line, type the following:


    ```

    ps -ax

    ```


    The output should be a list of programs. Some operating systems (usually flavors
    of Unix) have different options for the ps command. If the above comment does
    not produce a list of the programs that are running, type man ps to see which
    options you need to use.


    In the list of programs that appears, look for one called mysqld.


    Windows: If MySQL is running, you should see it in your system tray at the bottom
    of your screen, possibly as a traffic signal with a green light. If you cannot
    find an icon for it, it’s probably not running.


    Even if MySQL isn’t currently running, it might be installed, just not started.
    Here’s how to check to see whether MySQL is installed on your computer:


    Linux/Unix/Mac: Type the following:


    ```

    find / -name "mysql*"

    ```


    If a directory named mysql is found, MySQL has been installed.


    Windows: Look for a program called WinMySQLadmin, which starts and stops MySQL,
    among other functions. You might be able to find it on the Start menu (choose
    Start→Programs). If not, look for it in a MySQL directory, which is probably at
    c:\mysql\bin.


    If MySQL is installed but not started, here’s how to start it:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_51_0.png)


    Linux/Unix/Mac:


    +   1. **Change to the directory** `mysql/bin`.

    +      This is the directory that you should have found when you were checking
    whether MySQL was installed.

    +   2. **Type** `safe_mysqld &`.

    +      When this command finishes, the prompt is displayed.

    +   3. **Check that the MySQL server started by typing** `ps -ax`.

    +      In the list of programs that appears, look for one called `mysqld`.


    Windows:


    +   1. **Start the** `WinMySQLadmin` **program.**

    +      If you can’t find it on the menu, navigate to the program, which is probably
    at `c:\mysql\bin\winmysqladmin.exe`, and then double-click it.

    +   2. **Right-click in the WinMySQLadmin window.**

    +      A submenu appears.

    +   3. **Select the menu item for your operating system — Win 9x or Win NT (which
    includes Win 2000 and XP).**

    +   4. **Click Start the Server.**


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_51_1.png)


    If MySQL isn’t installed on your computer, you need to download it and install
    it from www.mysql.com. The Web site provides all the information and software
    that you need. (You can find detailed installation instructions in Appendix A.)


    # Installing PHP


    After you install MySQL, you’re ready to install PHP. As I mention earlier, you
    must install MySQL before you install PHP because you need to provide the path
    to the MySQL software when you install PHP. If PHP isn’t compiled with MySQL support
    when it is installed, it won’t communicate with MySQL.


    Before you install PHP, check whether it’s already installed. For instance, some
    Linux and Mac distributions automatically install PHP. To see whether PHP is installed,
    search your disk for any PHP files:


    Linux/Unix/Mac: Type the following:


    ```

    find / -name "php*"

    ```


    Windows: Use the Find feature (choose Start→Find) to search for php*.'
  merge: -1
  img_proc: true
- pgno: 52
  md: "If you find PHP files, PHP is already installed, and you might not need to\
    \ re-install it. For instance, even if you installed MySQL yourself after the\
    \ PHP was installed, you might have installed it in the location where PHP is\
    \ expecting it. Better safe than sorry, however: Perform the testing that I describe\
    \ in the next section to see whether MySQL and PHP are working correctly together.\n\
    \nIf you don’t find any PHP files, PHP is not installed. In order to install PHP,\
    \ you need access to the Web server for your site. For instance, when you install\
    \ PHP with Apache, you need to edit the Apache configuration file. All the information\
    \ and software that you need is provided on the PHP Web site (`www.php.net`).\
    \ I provide detailed installation instructions in Appendix B.\n\n# # Testing,\
    \ Testing, 1, 2, 3\n\nSuppose you believe that PHP and MySQL are available for\
    \ you to use, for one of the following reasons:\n\n+   - The IT department at\
    \ your company or your client company gave you all the information that you asked\
    \ for and told you that you’re good to go.\n+   - The Web hosting company gave\
    \ you all the information that you need and told you that you’re good to go.\n\
    +   - You followed all the instructions and installed PHP and MySQL yourself.\n\
    \nNow you need to test to make sure that PHP and MySQL are working correctly.\n\
    \n# ## Testing PHP\n\nTo test whether PHP is installed and working, follow these\
    \ steps:\n\n+   1. **Find the directory in which your PHP programs need to be\
    \ saved.**\n+   \n+      This directory and the subdirectories under it are your\
    \ *Web space*. Apache calls this directory the *Document Root*. The default Web\
    \ space for Apache is `htdocs` in the directory where Apache is installed. For\
    \ IIS, it’s `Inetpub\\wwwroot`. In Linux, it might be `/var/www/html`. The Web\
    \ space can be set to a different directory by configuring the Web server (see\
    \ Appendix C). If you’re using a Web hosting company, the staff will supply the\
    \ directory name."
  merge: -1
  img_proc: true
- pgno: 53
  md: "# 2. Create the following file somewhere in your Web space with the name test.php.\n\
    \n```\n<html>\n<head>\n<title>PHP Test</title>\n</head>\n<body>\n<p>This is an\
    \ HTML line\n<p>\n<?php\n    echo \"This is a PHP line\";\n    phpinfo();\n?>\n\
    </body></html>\n```\n\nThe file must be saved in your Web space for the Web server\
    \ to find it.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_53_0.png)\n\n# 3. Point\
    \ your browser at the file test.php created in Step 1. That is, type the name\
    \ of your Web server (www.myfinecompany.com) into the browser address window.\n\
    \nIf your Web server, PHP, and the test.php file are on the same computer that\
    \ you're testing from, you can type localhost/test.php.\n\nIn order for the file\
