- pgno: 85
  md: '# Chapter 4


    # Building the Database


    # In This Chapter


    +   - Using SQL to make requests to MySQL

    +   - Creating a new database

    +   - Adding information to an existing database

    +   - Looking at information in an existing database

    +   - Removing information from an existing database


    After completing your database design (see Chapter 3 if you haven''t done this
    yet), you''re ready to turn it into a working database. In this chapter, you find
    out how to build a database based on your design — and how to move data in and
    out of it.


    The database design names the database and defines the tables that make up the
    database. In order to build the database, you must communicate with MySQL, providing
    the database name and the table structure. Later on, you must communicate with
    MySQL to add data to (or request information from) the database. The language
    that you use to communicate with MySQL is SQL. In this chapter, I explain how
    to create SQL queries and use them to build new databases and interact with existing
    databases.


    # Communicating with MySQL


    The MySQL server is the manager of your database:


    +   - It creates new databases.

    +   - It knows where the databases are stored.

    +   - It stores and retrieves information, guided by the requests (*queries*)
    that it receives.


    To make a request that MySQL can understand, you build an SQL query and send it
    to the MySQL server. (For a more complete description of the MySQL server, see
    Chapter 1.) The next two sections detail how to do this.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "# # Building SQL queries\n\n*SQL (Structured Query Language)* is the computer\
    \ language that you use to communicate with MySQL. SQL is almost English; it is\
    \ made up largely of English words, put together into strings of words that sound\
    \ similar to English sentences. In general (fortunately), you don’t need to understand\
    \ any arcane technical language to write SQL queries that work.\n\nThe first word\
    \ of each query is its name, which is an action word (a verb) that tells MySQL\
    \ what you want to do. The queries that I discuss in this chapter are `CREATE`,\
    \ `DROP`, `ALTER`, `SHOW`, `INSERT`, `LOAD`, `SELECT`, `UPDATE`, and `DELETE`.\
    \ This basic vocabulary is sufficient to create — and interact with — databases\
    \ on Web sites.\n\nThe query name is followed by words and phrases — some required\
    \ and some optional — that tell MySQL how to perform the action. For instance,\
    \ you always need to tell MySQL what to create, and you always need to tell it\
    \ which table to insert data into or to select data from.\n\nThe following is\
    \ a typical SQL query. As you can see, it uses English words:\n\n```\n```sql\n\
    SELECT lastName FROM Member\n```\n```\n\nThis query retrieves all the last names\
    \ stored in the table named `Member`. Of course, more complicated queries (such\
    \ as the following) are less English-like:\n\n```\n```sql\nSELECT lastName,firstName\
    \ FROM Member WHERE state=\"CA\" AND\n             city=\"Fresno\" ORDER BY lastName\n\
    ```\n```\n\nThis query retrieves all the last names and first names of members\
    \ who live in Fresno and then puts them in alphabetical order by last name. This\
    \ query is less English-like but still pretty clear.\n\nHere are some general\
    \ points to keep in mind when constructing an SQL query, as illustrated in the\
    \ preceding sample query:\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_86_0.png)\n\
    \n+   - **Capitalization:** In this book, I put the SQL language words in all\
    \ caps; items of variable information (such as column names) are usually given\
    \ labels that are all or mostly lowercase letters. I did this to make it easier\
    \ for you to read — not because MySQL needs this format. The case of the SQL words\
    \ doesn’t matter; *select* is the same as `SELECT`, and *from* is the same as\
    \ `FROM`, as far as MySQL is concerned. On the other hand, the case of the table\
    \ names, column names, and other variable information does matter if your operating\
    \ system is Unix and Linux. When using Unix or Linux, MySQL needs to match the\
    \ column names exactly, so the case for the column names has to be correct — *lastname*\
    \ is not the same as *lastName*. Windows, however, isn’t as picky as Unix and\
    \ Linux; from its point of view, *lastname* and *lastName* are the same."
  merge: -1
  img_proc: true
- pgno: 87
  md: '**Spacing:** SQL words need to be separated by one or more spaces. It doesn''t
    matter how many spaces you use; you could just as well use 20 spaces or just 1
    space. SQL also doesn''t pay any attention to the end of the line. You can start
    a new line at any point in the SQL statement or write the entire statement on
    one line.


    **Quotes:** Notice that CA and Fresno are enclosed in double quotes (") in the
    preceding query. CA and Fresno are series of characters called *text strings*
    or *character strings*. (I explain strings in detail later in this chapter.) You
    are asking MySQL to compare the text strings in the SQL query with the text strings
    already stored in the database. Text strings are enclosed in quotes. When you
    compare numbers (such as integers) stored in numeric columns, you don''t enclose
    the numbers in quotes. (In Chapter 3, I explain the types of data that can be
    stored in a MySQL database.)


