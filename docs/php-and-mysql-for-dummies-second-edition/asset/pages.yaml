    echo \"<input type='submit' value='Select Type of Pet'>\n    </form>\\n\";\n?>\n\
    </body></html>\n```\n\nNotice the following in the program in Listing 8-8:\n\n\
    +   - **Using DISTINCT in the query:** DISTINCT causes the query to get each pet\
