- pgno: 353
  md: "# Building the Database\n\nThe database is the core and purpose of this application.\
    \ It holds the customer information that’s the goal of the Members Only section.\
    \ It also holds the Member ID and password so that the user can log into the Members\
    \ Only section.\n\nThe Members Only application database contains two tables:\n\
    \n+   - Member table\n+   - Login table\n\nThe first step in building the login\
    \ application is to build the database. It’s pretty much impossible to write programs\
    \ without a working database to test the programs on. First design your database;\
    \ then build it; then add some sample data for use while developing the programs.\n\
    \n![](img/d82df0828cfbc6d6be1e9a991861f3b7_353_0.png)\n\nSome changes have been\
    \ made to the database design that I develop in Chapter 3 for the Members Only\
    \ restricted section of the Pet Store Web site. Development and testing often\
    \ result in changes. Perhaps you find that you didn’t take some factors into consideration\
    \ in your design or that certain elements of your design don’t work with real-world\
    \ data or are difficult to program. It’s perfectly normal for the design to evolve\
    \ while you work on your application. Just be sure to change your documentation\
    \ when your design changes.\n\n# Building the Member table\n\nIn your design for\
    \ the login application, the main table is the Member table. It holds all the\
    \ information entered by the customer, including the customer’s personal information\
    \ (name, address, phone number, and so on) and the Member ID and password. The\
    \ following SQL query creates the Member table:\n\n```\n```sql\nCREATE TABLE Member\
    \ (\n    loginName      VARCHAR(20)    NOT NULL,\n    createDate     DATE    \
    \       NOT NULL,\n    password       VARCHAR(255)   NOT NULL,\n    lastName \
    \      VARCHAR(50),\n    firstName      VARCHAR(40),\n    street         VARCHAR(50),\n\
    \    city           VARCHAR(50),\n    state          CHAR(2),\n    zip       \
    \     CHAR(10),\n    email          VARCHAR(50),\n    phone          CHAR(15),\n\
    \    fax            CHAR(15),\n    PRIMARY KEY(loginName));\n```\n```"
  merge: -1
  img_proc: true
- pgno: 354
  md: 'Each row represents a member. The columns are


    ✓ loginName: A Member ID for the member to use when logging in. The customer chooses
    and types in the login name. The CREATE query defines the loginName in the following
    ways:


    +   - `CHAR(20)`: This data type defines the field as a character string that''s
    20 characters long. The field will always take up 20 characters of storage, with
    padding if the actual string stored is less than 20 characters. If a string longer
    than 20 characters is stored, any characters after 20 are dropped.

    +   - `PRIMARY KEY(loginName)`: The primary key identifies the row and must be
    unique. MySQL will not allow two rows to be entered with the same loginName.

    +   - `NOT NULL`: This definition means that this field can''t be empty. It must
    have a value. The primary key must always be set to NOT NULL.


    ✓ createDate: The date when the row was added to the database — that is, the date
    when the customer created the account. The query defines createDate as


    +   - `DATE`: This is a string that''s treated as a date. Dates are displayed
    in the format YYYY-MM-DD. They can be entered in that format or some similar formats,
    such as YY/M/D or YYYYMMDD.

    +   - `NOT NULL`: This definition means that this field can''t be empty. It must
    have a value. Because the program, not the user, creates the date and stores it,
    it won''t ever be blank.


    ✓ password: A password for the member to use when logging in. The customer chooses
    and types in the password. The CREATE query defines the password in the following
    ways:


    +   - `VARCHAR(255)`: This statement defines the field as a variable character
    string that can be up to 255 characters long. The field is stored in its actual
    length. You don''t expect the password to be 255 characters long. In fact, you
    expect it to be pretty short. However, you intend to use the MySQL `password`
    function to encrypt it rather than store it in plain view. After it''s encrypted,
    the string will be longer, so you''re allowing room for the longer string.

    +   - `NOT NULL`: This statement means that this field can''t be empty. It must
    have a value. You''re not going to allow an empty password in this application.


    ✓ lastName: The customer''s last name, as typed by the customer. The CREATE query
    defines the field as


    +   - `VARCHAR(50)`: This data type defines the field as a variable character
    string that can be up to 50 characters long. The field is stored in its actual
    length.'
