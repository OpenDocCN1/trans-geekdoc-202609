- pgno: 180
  md: '# Walking through an array


    You will often want to do something to every value in an array. You might want
    to echo each value, store each value in the database, or add six to each value
    in the array. In technical talk, walking through each and every value in an array,
    in order, is iteration. It is also sometimes called traversing. Here are two ways
    to walk through an array:


    +   - ✓ Manually: Move a pointer from one array value to another

    +   - ✓ Using foreach: Automatically walk through the array, from beginning to
    end, one value at a time


    # Manually walking through an array


    You can walk through an array manually by using a pointer. To do this, think of
    your array as a list. Imagine a pointer pointing to a value in the list. The pointer
    stays on a value until you move it. After you move it, it stays there until you
    move it again. You can move the pointer with the following instructions:


    +   - ✓ current($arrayname): Refers to the value currently under the pointer;
    does not move the pointer

    +   - ✓ next($arrayname): Moves the pointer to the value after the current value

    +   - ✓ previous($arrayname): Moves the pointer to the value before the current
    pointer location

    +   - ✓ end($arrayname): Moves the pointer to the last value in the array

    +   - ✓ reset($arrayname): Moves the pointer to the first value in the array


    The following statements manually walk through an array containing state capitals:


    ```

    ```php

    $value = current($capitals);

    echo "$value<br>";

    $value = next($capitals);

    echo "$value<br>";

    $value = next($capitals);

    echo "$value<br>";

    ```

    ```


    Unless you have moved the pointer previously, the pointer is located at the first
    element when you start walking through the array. If you think that the array
    pointer may have been moved earlier in the script or if your output from the array
    seems to start somewhere in the middle, use the reset statement before you start
    walking, as follows:


    ```

    ```php

    reset($capitals);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: "When using this method to walk through an array, you need an assignment statement\
    \ and an echo statement for every value in the array — for each of the 50 states.\
    \ The output is a list of all the state capitals.\n\nThis method gives you flexibility.\
    \ You can move through the array in any manner — not just one value at a time.\
    \ You can move backwards, go directly to the end, skip every other value by using\
    \ two next statements in a row, or whatever method is useful. However, if you\
    \ want to go through the array from beginning to end, one value at a time, PHP\
    \ provides foreach, which does exactly what you need much more efficiently. foreach\
    \ is described in the next section.\n\n# Using foreach to walk through an array\n\
    \nforeach walks through the array one value at a time and executes the block of\
    \ statements by using each value in the array. The general format is\n\n```\n\
    foreach( $arrayname as $keyname => $valuename )\n{\n    block of statements;\n\
    }\n```\n\nFill in the following information:\n\n+   ✓ *arrayname*: The name of\
    \ the array that you’re walking through.\n+   ✓ *keyname*: The name of the variable\
    \ where you want to store the key. *keyname* is optional. If you leave out `$keyname\
    \ =>`, the value is put into `$valuename`.\n+   ✓ *valuename*: The name of the\
    \ variable where you want to store the value.\n\nFor instance, the following foreach\
    \ statement walks through the sample array of state capitals and echoes a list:\n\
    \n```\n$capitals = array ( \"CA\" => \"Sacramento\", \"TX\" => \"Austin\",\n \
    \   \"OR\" => \"Salem\" );\nksort ($capitals);\nforeach ( $capitals as $state\
    \ => $city )\n{\n    echo \"$city, $state<br>\";\n}\n```\n\nThe preceding statements\
    \ give the following Web page output:\n\n```\nSacramento, CA\nSalem, OR\nAustin,\
    \ TX\n```\n\nYou can use the following line in place of the foreach line in the\
    \ previous statements."
  merge: -1
  img_proc: true
- pgno: 182
  md: '```

    foreach ( $capitals as $city )

    ```


    When using this foreach statement, only the city is available for output. You
    would then use the following echo statement:


    ```

    echo "$city<br>";

    ```


    The output with these changes is


    ```

    Sacramento

    Salem

    Austin

    ```


    When foreach starts walking through an array, it moves the pointer to the beginning
    of the array. You don’t need to reset an array before walking through it with
    foreach.


    # Multidimensional arrays


    In the earlier sections of this chapter, I describe arrays that are a single list
    of key/value pairs. However, on some occasions, you might want to store values
    with more than one key. For instance, suppose you want to store these product
    prices together in one variable:


    +   ✓ shirt, 20.00

    +   ✓ pants, 22.50

    +   ✓ blanket, 25.00

    +   ✓ bedspread, 50.00

    +   ✓ lamp, 44.00

    +   ✓ rug, 75.00


    You can store these products in an array as follows:


    ```

    $productPrices[''shirt''] = 20.00;

    $productPrices[''pants''] = 22.50;

    $productPrices[''blanket''] = 25.00;

    $productPrices[''bedspread''] = 50.00;

    $productPrices[''lamp''] = 44.00;

    $productPrices[''rug''] = 75.00;

    ```


    Your program can easily look through this array whenever it needs to know the
    price of an item. But suppose that you have 3,000 products. Your program would
    need to look through 3,000 products to find the one with shirt or rug as the key.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Notice that the list of products and prices includes a wide variety of products
    that can be classified into groups: clothing, linens, and furniture. If you classify
    the products, the program would only need to look through one classification to
    find the correct price. Classifying the products would be much more efficient.
    You can classify the products by putting the costs in a multi-dimensional array
    as follows:


    ```

    $productPrices[''clothing''][''shirt''] = 20.00;

    $productPrices[''clothing''][''pants''] = 22.50;

    $productPrices[''linens''][''blanket''] = 25.00;

    $productPrices[''linens''][''bedspread''] = 50.00;

    $productPrices[''furniture''][''lamp''] = 44.00;

    $productPrices[''furniture''][''rug''] = 75.00;

    ```


    This kind of array is a multidimensional array because it''s like an array of
    arrays. Figure 7-1 shows the structure of $productPrices as an array of arrays.
    The figure shows that $productPrices has three key/value pairs. The keys are clothing,
    linens, and furniture. The value for each key is an array with two key/value pairs.
    For instance, the value for the key clothing is an array with the two key/value
    pairs: shirt/20.00 and pants/22.50.


    | $productPrices | key | value |  |

    |---|---|---|---|

    |  |  | key | value |

    |  | clothing | shirt | 20.00 |

    |  |  | pants | 22.50 |

    |  | linens | blanket | 30.00 |

    |  |  | bedspread | 50.00 |

    |  | furniture | lamp | 44.00 |

    |  |  | rug | 75.00 |


    Figure 7-1:

    An array of arrays.


    $productPrices is a two-dimensional array. PHP can also understand multi-dimensional
    arrays that are four, five, six, or more levels deep. However, my head starts
    to hurt if I try to comprehend an array that is more than three levels deep. The
    possibility of confusion increases when the number of dimensions increases.


    You can get values from a multidimensional array by using the same procedures
    that you use with a one-dimensional array. For instance, you can access a value
    directly with this statement:


    ```

    $shirtPrice = $productPrices[''clothing''][''shirt''];

    ```


    You can also echo the value:


    ```

    echo $productPrices[''clothing''][''shirt''];

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: "However, if you combine the value within double quotes, you need to use curly\
    \ braces to enclose the variable name. The $ that begins the variable name must\
    \ follow the { immediately, without a space, as follows:\n\n```\necho \"The price\
    \ of a shirt is \\${$productPrices['clothing']['shirt']}\";\n```\n\nNotice the\
    \ backslash (\\\\) in front of the first dollar sign ($). The backslash tells\
    \ PHP that $ is a literal dollar sign and not the beginning of a variable name.\
    \ The output is\n\n```\nThe price of a shirt is $20\n```\n\nYou can walk through\
    \ a multidimensional array by using foreach statements (described in the preceding\
    \ section). You need a foreach statement for each array. One foreach statement\
    \ is inside the other foreach statement. Putting statements inside other statements\
    \ is nesting.\n\nBecause a two-dimensional array, such as $productPrices, contains\
    \ two arrays, it takes two foreach statements to walk through it. The following\
    \ statements get the values from the multidimensional array and output them in\
    \ an HTML table:\n\n```\necho \"<table border=1>\";\nforeach( $productPrices as\
    \ $category )\n{\n    foreach( $category as $product => $price )\n    {\n    \
    \    $f_price = sprintf(\"%01.2f\", $price);\n        echo \"<tr><td>$product:</td><td>$$f_price</td></tr>\"\
    ;\n    }\n}\necho \"</table>\";\n```\n\nFigure 7-2 shows the Web page produced\
    \ with these PHP statements.\n\nFigure 7-2:\nThe Web page output for the multi-dimensional\
    \ array.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_184_0.png)"
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Here is how the program interprets these statements:


    +   1. Outputs the `table` tag.

    +   2. Gets the first key/value pair in the `$productPrices` array and stores
    the value in the variable `$category`. The value is an array.

    +   3. Gets the first key/value pair in the `$category` array. Stores the key
    in `$product` and stores the value in `$price`.

    +   4. Formats the value in `$price` into the correct format for money.

    +   5. Echoes one table row for the product and its price.

    +   6. Goes to the next key/value pair in the `$category` array.

    +   7. Formats the price and echoes the next table row for the product and its
    price.

    +   8. Because there are no more key/value pairs in `$category`, the inner `foreach`
    statement ends.

    +   9. Goes to the next key/value pair in the outer `foreach` statement. Puts
    the next value in `$category`, which is an array.

    +   10. Repeats the procedure in Steps 2–9 until the last key/value pair in the
    last `$category` array is reached. The inner `foreach` statement ends. The outer
    `foreach` statement ends.

    +   11. Outputs the `/table` tag to end the table.


    In other words, the outer `foreach` starts with the first key/value pair in the
    array. The key is `clothing`, and the value of this pair is an array that is put
    into the variable `$category`. The inner `foreach` then walks through the array
    in `$category`. When it reaches the last key/value pair in `$category`, it ends.
    The program is then back in the outer loop, which goes on to the second key/value
    pair... and so on until the outer `foreach` reaches the end of the array.


    # Useful Conditional Statements


    A conditional statement executes a block of statements only when certain conditions
    are met. Here are two useful types of conditional statements:


    +   - ✓ `if` statement: Sets up a condition and tests it. If the condition is
    true, a block of statements is executed.

    +   - ✓ `switch` statement: Sets up a list of alternative conditions. Tests for
    the true condition and executes the appropriate block of statements.


    I describe these statements in more detail in the following two sections.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "# Using if statements\n\nAn if statement asks whether certain conditions exist.\
    \ A block of statements executes depending on which conditions are met. The general\
    \ format of an if conditional statement is\n\n```\nif ( condition ... )\n{\n \
    \   block of statements\n}\nelseif ( condition ... )\n{\n    block of statements\n\
    }\nelse\n{\n    block of statements\n}\n```\n\nThe if statement consists of three\
    \ sections:\n\n✓ if: This section is required. It tests a condition.\n\n+   -\
    \ **If condition is true:** The block of statements is executed. After the statements\
    \ are executed, the program moves to the next instruction following the conditional\
    \ statement; if the conditional statement contains any `elseif` or `else` sections,\
    \ the program skips over them.\n+   - **If condition is not true:** The block\
    \ of statements is not executed. The program skips to the next instruction, which\
    \ can be an `elseif`, an `else`, or the next instruction after the if conditional\
    \ statement.\n\n✓ elseif: This section is optional. It tests a condition. You\
    \ can use more than one elseif section if you want.\n\n+   - **If condition is\
    \ true:** The block of statements is executed. After executing the block of statements,\
    \ the program goes to the next instruction following the conditional statement;\
    \ if the if statement contains any additional `elseif` sections or an `else` section,\
    \ the program skips over them.\n+   - **If condition is not true:** The block\
    \ of statements is not executed. The program skips to the next instruction, which\
    \ can be an `elseif`, an `else`, or the next instruction after the if conditional\
    \ statement.\n\n✓ else: This section is optional. Only one else section is allowed.\
    \ This section does not test a condition; rather, it executes the block of statements.\
    \ If the program has entered this section, it means that the if section and all\
    \ the elseif sections are not true."
  merge: -1
  img_proc: true
- pgno: 187
  md: "Each section of the if conditional statement tests a condition that consists\
    \ of one or more comparisons. A comparison asks a question that can be true or\
    \ false. Some conditions are\n\n```\n$a == 1;\n$a < $b\n$c != \"Hello\"\n```\n\
    \nThe first comparison asks whether $a is equal to 1; the second comparison asks\
    \ whether $a is smaller than $b; the third comparison asks whether $c is not equal\
    \ to \"Hello\". You can use two or more comparisons in a condition by connecting\
    \ the comparisons with and, or, or xor. I discuss comparing values and using more\
    \ than one comparison in detail in Chapter 6. The following example uses all three\
    \ sections of the if conditional statement. Suppose that you have German, French,\
    \ Italian, and English versions of your product catalog. You want your program\
    \ to display the correct language version, based on where the customer lives.\
    \ The following statements set a variable to the correct catalog version (depending\
    \ on the country where the customer lives) and set a message in the correct language.\
    \ You can then display a message in the appropriate language.\n\n```\nif ($country\
    \ == \"Germany\")\n{\n    $version = \"German\";\n    $message = \" Sie sehen\
    \ unseren Katalog auf Deutsch\";\n}\nelseif ($country == \"France\")\n{\n    $version\
    \ = \"French\";\n    $message = \" Vous verrez notre catalogue en francais\";\n\
    }\nelseif ($country == \"Italy\")\n{\n    $version = \"Italian\";\n    $message\
    \ = \" Vedrete il nostro catalogo in Italiano\";\n}\nelse\n{\n    $version = \"\
    English\";\n    $message = \"You will see our catalog in English\";\n}\necho \"\
    $message<br>\";\n```\n\nThe if conditional statement proceeds as follows:\n\n\
    +   1. **Compares the variable $country to \"Germany\"**. If they are the same,\
    \ $version is set to \"German\", $message is set in German, and the program skips\
    \ to the echo statement. If $country does not equal Germany, $version and $message\
    \ are not set, and the program skips to the elseif section."
  merge: -1
  img_proc: true
- pgno: 188
  md: "+   2. **Compares the variable `$country` to \"France\".** If they are the\
    \ same, `$version` and `$message` are set, and the program skips to the `echo`\
    \ statement. If `$country` does *not* equal France, `$version` and `$message`\
    \ are *not* set, and the program skips to the second `elseif` section.\n\n+  \
    \ 3. **Compares the variable `$country` to \"Italy\".** If they are the same,\
    \ `$version` is set to `\"Italian\"`, and the program skips to the `echo` statement.\
    \ If `$country` does not equal Italy, `$version` and `$message` are *not* set,\
    \ and the program skips to the `else` section.\n\n+   4. **`$version` is set to\
    \ English, and `$message` is set in English.** The program continues to the `echo`\
    \ statement.\n\nNotice that only the message is echoed in this example. However,\
    \ the variable `$version` is stored because the version is useful information\
    \ that can be used later in the program.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_188_0.png)\n\
    \nWhen the block to be executed by any section of the `if` conditional statement\
    \ contains only one statement, the curly braces are not needed. For instance,\
    \ if the preceding example only had one statement in the blocks, as follows:\n\
    \n```\n```php\nif ( $country == \"France\" )\n{\n    $version = \"French\";\n\
    }\n```\n```\n\nYou could write it as follows:\n\n```\n```php\nif ( $country ==\
    \ \"France\" )\n    $version = \"French\";\n```\n```\n\nThis shortcut can save\
    \ some typing, but when several `if` statements are used, it can lead to confusion.\n\
    \nYou can have an `if` conditional statement inside another `if` conditional statement.\
    \ Putting one statement inside another is *nesting*. For instance, suppose that\
    \ you need to contact all your customers who live in Idaho. You plan to send e-mail\
    \ to those who have an e-mail address and send a letter to those who do not have\
    \ an e-mail address. You can identify the groups of customers by using the following\
    \ nested `if` statements:\n\n```\n```php\nif ( $cust$state == \"ID\" )\n{\n  \
    \  if ( $EmailAdd != \"\" )\n    {\n        $contactMethod = \"letter\";\n   \
    \ }\n    else\n    {\n```\n```"
  merge: -1
  img_proc: true
