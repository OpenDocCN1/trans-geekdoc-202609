- pgno: 370
  md: '59 Ends the case block that executes when the customer submits a Member ID
    and password to log in. The login block extends from line 13 to this line.


    61 Starts the case block that executes when the customer fills out the form to
    get a new member account. The form sends do=new in the URL, causing the program
    to jump to this section of the switch statement.


    62 Starts a foreach loop that loops through every field in the new member form.
    The loop checks for empty required fields and checks the first and last name for
    acceptable characters. The statements in the loop are documented in more detail
    in the following list:


    64 Checks whether the field is the fax field. The fax field is not required. The
    fax field isn''t checked to see whether it is blank because it''s okay for it
    to be blank.


    66 Checks whether the field is blank. If it is, the if block performs the following
    tasks: 1) Unsets $do. 2) Creates an error message that explains the problem. 3)
    Shows the login form again, including the error message. 4) Stops the program
    and waits for the user to submit the form again with the field filled in.


    75 Checks whether the field is the last name or first name field. If so, it checks
    the field format for allowed characters. If any characters that are not allowed
    are found, it performs the following tasks: 1) Unsets $do. 2) Creates an error
    message that explains the problem. 3) Shows the login form again, including the
    error message. 4) Stops the program and waits for the user to submit the form
    again with the correct format.


    86 Trims extra spaces from all the field values after they are checked in line
    66 to be sure that they aren''t blank. Removes any HTML tags that are in any of
    the fields. Creates a variable for each of the fields in the following way. Suppose
    in the first loop of the foreach loop, the variable is $_POST [loginName] = gsmith.
    The foreach loop sets $key="loginName" and $value="gsmith". Therefore, the statement
    in line 86 is equivalent to $loginName=strip_tags(trim("gsmith")). The $$key is
    $loginName because $key=loginName.


    87 Ends the foreach loop.


    88 Lines 88–122 are a series of if blocks that check the fields for the correct
    format. If any of the fields checked doesn''t have the correct format, the block
    performs the following tasks: 1) Unsets $do. 2) Creates an error message that
    explains the problem. 3) Shows the login form again, including the error message.
    4) Stops the program and waits for the user to submit the form again with the
    correct format.'
