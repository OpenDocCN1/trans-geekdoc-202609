    +   - **Pet identification number:** A sequence number assigned to each pet when
    it''s added to the table. This number is the primary key.

    +   - **Description of the pet:** Two attributes: the written description of the
    pet as it would appear in a printed catalog and the color of the pet.

    +   - **Picture of the pet:** A path name to a graphic file containing a beautiful
    picture of the pet.

    +   - **Cost of the pet:** The dollar amount that the store is asking for the
    pet.

    +   - **Category for the pet:** Two attributes: a category name that includes
    the pet — for example, dog, horse, dragon — and a description of the category.


    It would be inefficient to include two types of information in the Pet table:


    +   - The category information includes a description of the category. Because
    each category can include several pets, including the category description in
    the Pet table would result in the same description appearing in several rows.
    It is more efficient to define Pet Category as an object with its own table.

    +   - If the pet comes in several colors, all the pet information will be repeated
    in a separate row for each color. It is more efficient to define Pet Color as
    an object with its own table.


    The added tables are named PetType and PetColor.


