- pgno: 330
  md: "# # Writing the Programs\n\nAfter you know what the pages are going to look\
    \ like and what they are going to do, you can write the programs. In general,\
    \ you write a program for each page, although sometimes it makes sense to separate\
    \ programs into more than one file or to combine programs on a page. (For details\
    \ on how to organize applications, see Chapter 10.)\n\nAs I discuss in Chapter\
    \ 10, keep the information needed to connect to the database in a separate file\
    \ and include that file in all the programs that need to access the database.\
    \ The file should be stored in a secure location and with a misleading name for\
    \ security reasons. For this application, the following information is stored\
    \ in a file named `misc.inc`:\n\n```\n```php\n<?php\n    $user=\"catalog\";\n\
    \    $host=\"localhost\";\n    $password=\"\";\n    $database=\"PetCatalog\";\n\
    ?>\n```\n```\n\nThe Pet Catalog application has two independent sets of programs:\
    \ one set to show the Pet Catalog to customers and one set to enter new pets into\
    \ the catalog.\n\n# ## Showing pets to the customers\n\nThe application that shows\
    \ the Pet Catalog to customers has three basic tasks:\n\n+   - Show the storefront\
    \ page. Provide a link to the catalog.\n+   - Show a page where users select the\
    \ pet type.\n+   - Show a page with pets of the selected pet type.\n\n# ### Showing\
    \ the storefront\n\nThe storefront page doesn’t need any PHP statements. It simply\
    \ displays a Web page with a link. HTML statements are sufficient to do this.\
    \ Listing 11-1 shows the HTML file that describes the storefront page.\n\n# **Listing\
    \ 11-1: HTML File for the Storefront Page**\n\n```\n```php\n<?php\n  /* Program:\
    \ PetShopFront.php\n   * Desc:    Displays opening page for Pet Store.\n   */\n\
    ```\n```"
