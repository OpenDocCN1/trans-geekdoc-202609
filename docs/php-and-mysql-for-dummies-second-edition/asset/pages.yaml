  md: '"From binary files." If neither of these methods works for you, you can always
    install MySQL from source files. To do this, follow the instructions in the section,
    "From source files."


    You can download the RPM file using the following instructions. However, the RPM
    file might already be on the CD that your Linux operating system came on. Installing
    the RPM file from a CD saves you the trouble of downloading (you can skip Steps
    1–9 in the following list), but if the version of MySQL on your CD is not the
    most recent, you might want to download an RPM file anyway.


    To install MySQL on Linux from an RPM file, follow these steps:


    +   1. **Point your Web browser to www.mysql.com, the MySQL home page.**

    +   2. **Click the Production version number link.**

    +      Look in the list on the right side of the screen, labeled MySQL Products.
    Look for the section under the heading Database Server. As of this writing, the
