  md: '+   - `PRIMARY KEY(loginName, loginTime)`: The primary key identifies the row
    and must be unique. For this table, two columns together are the primary key.
    MySQL will not allow two rows to be entered with the same `loginName` and `loginDate`.

    +   - `NOT NULL`: This definition means that this field can''t be empty. It must
    have a value. The primary key must always be set to `NOT NULL`.


    ✓ `loginTime`: The date and time when the member logged in. This field uses both
    the date and time because it needs to be unique. It''s very unlikely that two
    users would log in at the same second at the Pet Store Web site. However, in some
    very busy Web sites, two users might log in during the same second. At such a
    site, you might have to create a sequential login number to be the unique primary
