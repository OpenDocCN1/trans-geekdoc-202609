- pgno: 229
  md: "the information is used in conditional statements to deliver an individual\
    \ Web page. Some of the most common application tasks that require users to answer\
    \ questions are\n\n+   - **Online ordering:** Customers need to select products\
    \ and enter shipping and payment information.\n+   - **Registering:** Many sites\
    \ require users to provide some information before they receive certain benefits,\
    \ such as access to special information or downloadable software.\n+   - **Logging\
    \ in:** Many sites restrict access to their pages. Users must enter an account\
    \ name and password before they can see the Web pages.\n+   - **Viewing selected\
    \ information:** Many sites allow users to specify what information they want\
    \ to see. For instance, an online catalog might allow users to type the name of\
    \ the product or select a product category that they want to see.\n\nYou ask questions\
    \ by displaying HTML forms. The user answers the questions by typing information\
    \ into the form or selecting items from a list. The user then clicks a button\
    \ to submit the form information. When the form is submitted, the information\
    \ in the form is passed to a second, separate program, which processes the information.\n\
    \nIn the next few sections, I don’t tell you about the HTML required to display\
    \ a form; I assume that you already know HTML. (If you don’t know HTML or need\
    \ a refresher, check out *HTML 4 For Dummies*, 4th Edition, by Ed Tittel and Natanya\
    \ Pitts; Wiley.) What I do tell you is how to use PHP to display HTML forms and\
    \ to process the information that users type into the form.\n\n# # Using HTML\
    \ forms\n\nHTML forms are very important for interactive Web sites. If you are\
    \ unfamiliar with HTML forms, you need to read the forms section of an HTML book.\
    \ To display a form by using PHP, you can do one of the following:\n\n+   - **Use\
    \ `echo` statements to echo the HTML for a form.** For example:\n\n```\n```php\n\
    <?php\necho \"<form action='processform.php'\n      method='POST'>\\n\n      <input\
    \ type='text' name='name'>\\n\n      <input type='submit' value='Submit Name'>\\\
    n\n      </form>\\n\";\n?>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 230
  md: "# Use plain HTML outside the PHP sections.\n\nFor a plain static form, there\
    \ is no reason to include it in a PHP section. For example:\n\n```\n```php\n<?php\n\
    \    statements in PHP section\n?>\n<form action=\"processform.php\" method=\"\
    POST\">\n<input type=\"text\" name=\"fullname\">\n<input type=\"submit\" value=\"\
    Submit Name\">\n</form>\n<?php\n    statements in PHP section\n?>\n```\n```\n\n\
    Either of these methods produces the form displayed in Figure 8-4.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_230_0.png)\n\
    \nFigure 8-4:\nA form produced by HTML statements.\n\nJoe Customer fills in the\
    \ HTML form. He clicks the submit button. You now have the information that you\
    \ wanted — his name. So where is it? How do you get it?\n\nYou get the form information\
    \ by running a program that receives the form information. When the submit button\
    \ is clicked, PHP automatically runs a program. The action parameter in the form\
    \ tag tells PHP which program to run. For instance, in the preceding program,\
    \ the parameter action=processform.php tells PHP to run the program processform.php\
    \ when the user clicks the submit button. The program processform.php can display,\
    \ store, or otherwise use the form data that it receives when the form is submitted.\n\
    \nWhen the user clicks the submit button, the program specified in the action\
    \ attribute runs, and statements in this program can get the form information\
    \ from PHP built-in arrays and use the information in PHP statements. Table 8-2\
    \ shows the built-in arrays that contain the form information."
  merge: -1
  img_proc: true
- pgno: 231
  md: "| Array | Description |\n|---|---|\n| `$_POST` | Contains elements for all\
    \ the fields contained in a form if the form uses `method=\"POST\"`. |\n| `$_HTTP_POST_VARS`\
    \ | Same as `$_POST`. |\n| `$_GET` | Contains all the variables passed from a\
    \ previous page as part of the URL. This includes fields passed in a form using\
    \ `method=\"get\"`. |\n| `$_HTTP_GET_VARS` | Same as `$_GET`. |\n| `$_REQUEST`\
    \ | Contains all the array elements together that are in `$_POST`, `$_GET`, and\
    \ `$_COOKIE`. |\n\nWhen the form is submitted, the program that runs can get the\
    \ form information from the appropriate built-in array, as shown in Table 8-2.\
    \ In these built-in arrays, each array index is the name of the input field in\
    \ the form. For instance, if the user typed **Goliath Smith** in the input field\
    \ shown in Figure 8-4 and clicked the submit button, the program `processform.php`\
    \ runs and can use an array variable in the following format:\n\n```\n$_POST['fullname']\n\
    ```\n\nNotice that the name typed into the form is available in the `$_POST` array\
    \ because the form tag specified `method='POST'`. Also, notice that the array\
    \ key is the name given the field in the HTML form with the `name` attribute `name=\"\
    fullname\"`.\n\nA program that displays all the fields in a form is a useful program\
    \ for testing a form. You can see what values are passed from the form to be sure\
    \ that your form is formatted properly and sends the field names and values that\
