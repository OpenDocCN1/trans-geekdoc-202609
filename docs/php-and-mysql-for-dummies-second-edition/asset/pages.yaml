  md: 'easy to use. You can create your design on paper, indicating what the user
    sees, perhaps with sketches or with written descriptions. You should also show
    the user interaction components, such as buttons or links, and describe their
    actions. Include each page of the application in the design.


    The Pet Store Members Only application has three pages that are part of the login
    procedures. In addition, the application includes all the pages that are part
    of the Members Only section, such as the page that shows the special discounts
    and the pages that provide discussions of pets for sale. In this chapter, you
    only build the pages that are part of the login procedure. You don’t build the
    pages that are part of the Members Only section, but I do discuss what needs to
    be included in them to protect them from viewing by non-members.


    The login application includes three pages, plus the group of pages that comprise
    the Members Only section, as follows:


    +   - **Storefront page:** The first page that a customer sees. It provides the
    name of the business and the purpose of the Web site. I introduce a storefront
    page in Chapter 11, and in this chapter, you modify it to provide access to the
    Members Only section.

    +   - **Login page:** Allows the customer to either log in or create a new member
    account. It shows a form for the customer to fill in to get a new account.

    +   - **New Member Welcome page:** Welcomes the new users by name, letting them
    know that their accounts have been created. Provides any information that they
    need to know. Provides a button so that users can continue to the Members Only
    section or return to the main page.

    +   - **Members Only section:** A group of Web pages that contain the content
    of the Members Only section.


    # Storefront page


    The *storefront page* is the introductory page for the Pet Store. Because most
    people know what a pet store is, the page doesn’t need to provide much explanation.
    Figure 12-1 shows the storefront page. Two customer actions are available on this
    page: a link that the customer can click to see the Pet Catalog and a link to
    the Members Only section.


    # Login page


    The login page allows the customer to log in or create a new member account. It
    includes the form that customers need to fill out to get a member account. Figure
    12-2 shows the login page. This page has two different submit buttons: one to
    log in with an existing member account and one to create a new member account.'
