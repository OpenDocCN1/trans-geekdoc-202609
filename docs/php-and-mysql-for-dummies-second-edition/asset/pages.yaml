    # Combining information from tables


    In the earlier sections of this chapter, I assume that all the information you
    want is in a single table. However, you might want to combine information from
    different tables. You can do this easily in a single query.


    Two words can be used in a SELECT query to combine information from two or more
    tables:


    +   - UNION: Rows are retrieved from one or more tables and stored together, one
    after the other, in a single result. For example, if your query selected 6 rows
    from one table and 5 rows from another table, the result would contain 11 rows.

    +   - JOIN: The tables are combined side by side, and the information is retrieved
    from both tables.


    # UNION


    UNION is used to combine the results from two or more select queries. The results
    from each query are added to the result set following the results of the previous
    query. The format of the UNION query is as follows:


    ```

    SELECT query UNION ALL SELECT query ...

    ```


    You can combine as many SELECT queries as you need to. A SELECT query can include
    any valid SELECT format, including WHERE clauses, LIMIT clauses, and so on. The
    rules for the queries are'
