- pgno: 166
  md: '+   - **Setting up statements that execute only when certain conditions are
    met:** Programs frequently need to do this. For instance, you may want to display
    a toy catalog to a child and an electronics catalog to an adult. This type of
    statement is a *conditional statement*. The PHP conditional statements are the
    `if` statement and the `case` statement.

    +   - **Setting up a block of statements that is repeated:** You frequently need
    to repeat statements. For instance, you may want to create a list of all your
    customers. To do that, you might use two statements: one that gets the customer
    row from the database and a second one that stores the customer name in a list.
    You would need to repeat these two statements for every row in the customer database.
    The feature that enables you to do this is a *loop*. Three types of loops are
    `for` loops, `while` loops, and `do...while` loops.

    +   - **Writing blocks of statements that can be reused many times:** Many tasks
    are performed in more than one part of the application. For instance, you might
    want to retrieve product information from the database and display it numerous
    times in an application. Getting and displaying the information might require
    several statements. Writing a block of statements that displays the product information
    and using this block repeatedly is much more efficient than writing the statements
    over again every time that you need to display the product information. PHP allows
    you to reuse statement blocks by creating a *function*.


    In this chapter, you find out how to use the building blocks of PHP programs.
    I describe the most frequently used simple statements and the most useful complex
    statements and variables. You find out how to construct the building blocks and
    what they are used for. Then in Chapter 8, you find out how to use these building
    blocks to move data in and out of a database.


    # Useful Simple Statements


    A simple statement is a single instruction followed by a semicolon (;). Here are
    some useful simple statements used in PHP programs:


    +   - `echo` statement: Produces output that browsers handle as HTML

    +   - Assignment statement: Assigns values to variables

    +   - Increment statement: Increases or decreases numbers in variables

    +   - `exit` statement: Stops the execution of your program

    +   - Function call: Uses stored blocks of statements at any location in a program


    I discuss these simple statements and when to use them in the following sections.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Using echo statements


    You use echo statements to produce output. The output from an echo statement is
    sent to the user''s browser, which handles the output as HTML (HyperText Markup
    Language).


    The general format of an echo statement is


    ```

    echo outputitem,outputitem,outputitem...

    ```


    where the following rules apply:


    +   - An outputitem can be a number, a string, or a variable. A string must be
    enclosed in quotes. The difference between double and single quotes is explained
    in Chapter 6.

    +   - List as many outputitems as you need.

    +   - Separate each outputitem with a comma.


    Table 7-1 shows some echo statements and their output. For the purposes of the
    table, assume that $string1 is set to Hello and $string2 is set to World!.


    **Table 7-1 echo Statements**


    | echo Statement | Output |

    |---|---|

    | echo "Hello"; | Hello |

    | echo 123; | 123 |

    | echo "Hello","World!"; | HelloWorld! |

    | echo Hello World!; | Not valid; results in an error message |

    | echo "Hello World!"; | Hello World! |

    | echo ''Hello World!''; | Hello World! |

    | echo $string1; | Hello |

    | echo $string1,$string2; | HelloWorld! |

    | echo "$string1 $string2"; | Hello World! |

    | echo "Hello ",$string2; | Hello World! |

    | echo "Hello", " ",$string2; | Hello World! |

    | echo ''$string1'',"$string2"; | $string1World! |'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_168_0.png)


    Double quotes and single quotes have different effects on variables. When you
    use single quotes, variable names are echoed as-is. When you use double quotes,
    variable names are replaced by the variable values.


    You can separate variable names with curly braces ({ }). For instance, the following
    statements


    ```

    $pet = "bird";

    echo "The $petcage has arrived.";

    ```


    will not output bird as the $pet variable. In other words, the output will not
    be The birdcage has arrived. Rather, PHP will look for the variable $petcage and
    won’t be able to find it. You can echo the correct output by using curly braces
    to separate the $pet variable:


    ```

    $pet = "bird";

    echo "The {$pet}cage has arrived.";

    ```


    The preceding statement will output


    ```

    The birdcage has arrived.

    ```


    echo statements output a line of text that is sent to a browser. The browser considers
    the text to be HTML and handles it that way. Therefore, you need to make sure
    that your output is valid HTML code that describes the Web page that you want
    the user to see.


    When you want to display a Web page (or part of a Web page) by using PHP, you
    need to consider three stages in producing the Web page:


    +   - **The PHP program:** PHP echo statements that you write.

    +   - **The HTML source code:** The source code for the Web page that you see
    when you choose View→Source in your browser. The source code is the output from
    the echo statements.

    +   - **The Web page:** The Web page that your users see. The Web page results
    from the HTML source code.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_168_1.png)


    The echo statements send exactly what you echo to the browser — no more, no less.
    If you do not echo any HTML tags, none are sent.


    PHP allows some special characters that format output, but they are not HTML tags.
    The PHP special characters only affect the output from the echo statement — not
    the display on the Web page. For instance, if you want to start a new line in
    the PHP output, you must include a special character (\n) that tells PHP to start
    a new line. However, this special character just starts a new line in the output;
    it does not send an HTML tag to start a new line on the Web page. Table 7-2 shows
    examples of the three stages.'
  merge: -1
  img_proc: true
