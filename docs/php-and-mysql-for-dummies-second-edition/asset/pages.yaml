    # Adding pets to the catalog


    The application that adds a new pet to the catalog should do the following tasks:


    +   1. **Create a form that asks for a pet category.** The person adding the pet
    can choose one of the existing pet types or create a new one. To create a new
    type, the user needs to type a category name and description.

    +   2. **If a new type is created, check that the name and description were typed
    in.**

    +   3. **Create a form that asks for pet information — name, description, price,
    picture filename, and color.** The person adding the pet can choose one of the
    existing pet names for the selected category or create a new name. To create a
    new pet name, the user needs to type a pet name.

    +   4. **If new is selected for pet name, check that the name was typed in.**

    +   5. **Store the new pet in the PetCatalog database.**

    +   6. **Send a feedback page that shows what information was just added to the
    catalog.**'
