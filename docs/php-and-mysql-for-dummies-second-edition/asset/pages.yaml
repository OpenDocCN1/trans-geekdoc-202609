- pgno: 285
  md: "```\n<tr><td></td><td align='center'>\n    <br><input type='submit' value='Submit\
    \ phone number'></td>\n</tr>\n</table>\n</form>\";\n?>\n</body></html>\n```\n\n\
    Notice the following key points about this program:\n\n+   - **The same program\
    \ displays and processes the form.** The name of this program is `displayPhone.php`.\
    \ Notice that the `form` tag includes `action=displayPhone.php`, meaning that\
    \ when the user clicks the submit button, the same program runs again.\n+   -\
    \ **Information is added to the URL.** The `form` tag includes `action=displayPhone.php?first=no`.\
    \ When the user clicks the submit button and `displayPhone.php` runs the second\
    \ time, a variable `$first` is passed with the value \"no\".\n+   - **The value\
    \ that was passed for `first` in the built-in `$_GET` array is checked at the\
    \ beginning of the program.** This is to see whether this is the first time that\
    \ the program has run.\n+   - **If `$_GET[first]` equals \"no\", the phone number\
    \ is checked.**\n+     - `$_GET[first]` only equals no if the form is being submitted.\n\
    +     - `$_GET[first]` does not equal no if this is the first time through the\
    \ program.\n+     - If the phone number is okay, it is stored in the database,\
    \ and the program ends.\n+     - If the phone number is not okay, an error message\
    \ is printed.\n+   - **If `$_GET[first]` does not equal \"no\", the phone number\
    \ is retrieved from the database.** In other words, if `$_GET[first]` doesn't\
    \ equal no, it is the first time that the program has run. The program should\
    \ get the phone number from the database.\n+   - **If the program reaches the\
    \ statements that display the form, the form is displayed.** If this is not the\
    \ first time through the program and a phone number was submitted and was okay,\
    \ the phone number is stored in the database, and the program stops. *It never\
    \ reaches the statements that display the form.* In all other cases, the form\
    \ is displayed.\n\nThe form displayed by the program in Listing 9-1 is shown in\
    \ Figure 9-1. This shows what the Web page looks like the first time that it’s\
    \ displayed. Notice that the URL in the browser address field doesn’t have any\
    \ added information.\n\nFigure 9-2 shows the results when a user types a nonsense\
    \ phone number in the form in Figure 9-1. Notice that the URL in the browser address\
    \ field now has `?first=no` added to the end of it."
