    \ this:\n\n```\necho $capitals['TX'];\n```\n\nIf you include the array value in\
    \ a longer echo statement that's enclosed by double quotes, you may need to enclose\
    \ the array value name in curly braces like this:\n\n```\necho \"The capital of\
    \ Texas is {$capitals['TX']}<br>\";\n```\n\nYou can see the structure and values\
    \ of any array by using a print_r statement. To display the $capitals array, use\
