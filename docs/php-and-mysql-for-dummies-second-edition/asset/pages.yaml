- pgno: 308
  md: '# Using functions


    Make frequent use of functions to organize your programs. (In Chapter 7, I discuss
    creating and using functions in detail.) Functions are useful when your program
    needs to perform the same task at repeated locations in a program or in different
    programs in the application. After you write a function that does the task and
    you know it works, you can use it anywhere that you need it.


    Look for opportunities to use functions. Your program is much easier to read and
    understand with a line like this:


    ```

    getMemberData();

    ```


    than with 20 lines of statements that actually get the data.


    In fact, after you''ve been writing PHP programs for a while, you will have a
    stash of functions that you''ve written for various programs. Very often the program
    that you''re writing can use a function that you wrote for an application two
    jobs ago. For instance, I often have a need for a list of the states. Rather than
    include a list of all 50 states every time that I need it, I have a function called
    getStateNames() that returns an array that holds the 50 state names in alphabetical
    order and a function called getStateCodes() that returns an array with all 50
    two-letter state codes in the same order. These functions are frequently useful.


    Name your functions very descriptively. The function calls in your program should
    tell you exactly what the function does. Long is okay. You don''t want to see
    a line in your program that reads


    ```

    function1();

    ```


    This line isn''t very informative. Even a line like the following is less informative
    than it could be:


    ```

    getData();

    ```


    You want to see a line like this:


    ```

    getAllMemberNames();

    ```


    # Keeping It Private


    You need to protect your Web database application. People out there may have nefarious
    designs on your Web site for purposes such as


    +   ✓ **Stealing stuff:** They hope to find a file sitting around full of valid
    credit card numbers or the secret formula for eternal youth.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '+   - **Trashing your Web site:** Some people think this is funny. Some people
    do it to prove that they can.

    +   - **Harming your users:** A malicious person can add things to your Web site
    that harm or steal from the people who visit your site.


    This is not a security book. Security is a large, complex issue, and I am not
    a security expert. Nevertheless, I want to call a few issues to your attention
    and make some suggestions that might help. The following measures will increase
    the security of your Web site, but if your site handles really important, secret
    information, read some security books and talk to some experts:


    +   - **Ensure the security of the computer that hosts your Web site.** This is
    probably not your responsibility, but you may want to talk to the people responsible
    and discuss your security concerns. You''ll feel better if you know that someone
    is worrying about security.

    +   - **Don''t let the Web server display filenames.** Users don''t need to know
    the names of the files on your Web site.

    +   - **Hide things.** Store your information so that it can''t be easily accessed
    from the Web.

    +   - **Don''t trust information from users.** Always clean any information that
    you didn''t generate yourself.

    +   - **Use a secure Web server.** This requires extra work, but it''s important
    if you have top-secret information.


    # Ensure the security of the computer


    First, the computer itself must be secure. The system administrator of the computer
    is responsible for keeping unauthorized visitors and vandals out of the system.
    Security measures include such things as firewalls, encryption, password shadowing,
    scan detectors, and so on. In most cases, the system administrator is not you.
    If it is, you need to do some serious investigation into security issues. If you
    are using a Web-hosting company, you may want to discuss security with those folks
    to reassure yourself that they are using sufficient security measures.


    # Don''t let the Web server display filenames


    You may have noticed that sometimes you get a list of filenames when you point
    at a URL. If you point at a directory (rather than a specific file) and the directory
    doesn''t contain a file with the default filename (such as index .'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'html), the Web server may display a list of files for you to select from. You
    probably don’t want your Web server to do this; your site won’t be very secure
    if a visitor can look at any file on your site. On other Web sites, you may have
    seen an error message that reads


    ```

    Forbidden

    You don’t have permission to access /secretdirectory on this server.

    ```


    On those sites, the Web server is set so that it doesn’t display a list of file-names
    when the URL points to a directory. Instead, it delivers this error message. This
    is more secure than listing the filenames. If the filename is being sent from
    your Web site, a setting for the Web server needs to be changed. If you aren’t
    the administrator for your Web server, request a change. If you are the administrator,
    it’s up to you to change this behavior. For instance, in Apache, this behavior
    is controlled by an option called Indexes, which can be turned on or off in the
    httpd.conf file as follows:


    ```

    Options Indexes      // turns it on

    Options -Indexes     // turns it off

    ```


    See the documentation for your Web server to allow or not allow directory listings
    in the user’s Web browser.


    # Hide things


    Keep information as private as possible. Of course, the Web pages that you want
    visitors to see must be stored in your public Web space directory. But not everything
    needs to be stored there. For instance, you can store include files in another
    location altogether — in space on the computer that can’t be accessed from the
    Web. Your database certainly isn’t stored in your Web space, but it might be even
    more secure if it were stored on a totally different computer.


    Another way to hide things is to give them misleading names. For instance, the
    include file containing the database variables shouldn’t be called passwords.inc.
    A better name might be UncleHenrysChickenSoupRecipe.inc. I know this suggestion
    violates other sections of the book where I promote informative filenames, but
    this is a special case. Malicious people sometimes do obvious things like typing
    www.yoursite.com/passwords.html into their browser to see what happens.


    # Don’t trust information from users


    Malicious users can use the forms in your Web pages to send dangerous text to
    your Web site. Therefore, never store information from forms directly into a database
    without checking it first. Check the information that you receive for'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'reasonable formats and dangerous characters. In particular, you don''t want
    to accept HTML tags, such as <script> tags, from forms. By using script tags,
    a user could enter an actual script — perhaps a malicious one. If you just accept
    the form field without checking it and store it in your database, you could have
    any number of problems, particularly if the stored script was sent in a Web page
    to a visitor to your Web site. For more on checking data from forms, see Chapter
    8.


    # Use a secure Web server


    Communication between your Web site and its visitors is not totally secure. When
    the files on your Web site are sent to the user''s browser, someone on the Internet
    between you and the user can read the contents of these files as they pass by.
    For most Web sites, this isn''t an issue; however, if your site collects or sends
    credit card numbers or other secret information, use a secure Web server to protect
    this data.


    Secure Web servers use Security Sockets Layer (SSL) to protect communication sent
    to and received from browsers. This is similar to the scrambled telephone calls
    that you hear about in spy movies. The information is encrypted (translated into
    coded strings) before it is sent across the Web. The receiving software decrypts
    it into its original content. In addition, your Web site uses a certificate that
    verifies your identity. Using a secure Web server is extra work, but it''s necessary
    for some applications.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_311_0.png)


    You can tell when you are communicating using SSL. The URL begins with HTTPS,
    rather than HTTP.


    Information about secure Web servers is specific to the Web server that you''re
    using. To find out more about using SSL, look at the Web site for the Web server
    that you are using. For instance, if you are using Apache, check out two open-source
    projects that implement SSL for Apache at www.modssl.org and www.apache-ssl.org.
    Commercial software is also available that provides a secure server based on the
    Apache Web server. If you''re using Microsoft Internet Information Server (IIS),
    search for SSL on the Microsoft Web site at www.microsoft.com.


    # Completing Your Documentation


    I''m making one last pitch here. Documenting your Web database application is
    essential. You start with a plan describing what the application is supposed to
    do. Based on your plan, you create a database design. Keep the plan and the design
    up to date. Often as a project moves along, changes are made. Make sure that your
    documentation changes to match the new decisions.'
  merge: -1
  img_proc: true
