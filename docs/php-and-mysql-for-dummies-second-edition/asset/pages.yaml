    +   - `PRIMARY KEY(loginName, loginTime)`: The primary key identifies the row
    and must be unique. For this table, two columns together are the primary key.
    MySQL will not allow two rows to be entered with the same `loginName` and `loginDate`.

    +   - `NOT NULL`: This definition means that this field can''t be empty. It must
    have a value. The primary key must always be set to `NOT NULL`.


    # Adding data to the database


    This database is intended to hold data entered by customers — not by you. It will
    be empty when the application is first made available to customers until customers
    add data. However, to test the programs while you write them, you need to have
    at least a couple of members in the database. You need a couple of Member IDs
    and passwords to test the login program. You can add a couple of fake members
    for testing purposes — by using an `INSERT SQL` query — and remove them when you''re
    ready to go live with your Members Only application.


    # Designing the Look and Feel


    After you know what the application is going to do and what information you want
    to get from customers and store in the database, you can design the look and feel.
    The look and feel includes what the user sees and how the user interacts with
    the application. Your design should be attractive and'
