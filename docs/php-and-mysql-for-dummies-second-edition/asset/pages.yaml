    # Writing it down


    Here’s my usual nagging: Write it down. You probably spent considerable time making
    the design decisions for your database. At this point, the decisions are firmly
    fixed in your mind. You don’t believe that you can forget them. However, suppose
    that a crisis intervenes, and you don’t get back to this project for two months.
    You will have to analyze your data and make all the design decisions again. You
    can avoid this by writing down the decisions now.


    Document the organization of the tables, the column names, and all other design
    decisions. A good format is a document that describes each table in table format,
    with a row for each column and a column for each design decision. For example,
    your columns would be column name, data type, and description.


