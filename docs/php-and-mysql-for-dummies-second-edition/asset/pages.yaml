- pgno: 427
  md: '# Configuring IIS


    To configure IIS to work with PHP, follow these steps:


    +   1. **Enter the IIS Management Console.**

    +      You should be able to enter by choosing Start→Programs→Administrative Tools→Internet
    Services Manager or Start→Settings→Control Panel→Administrative Tools→Internet
    Services Manager.

    +   2. **Right-click your Web site (such as Default Web Site).**

    +   3. **Select Properties.**

    +   4. **Select the Home Directory tab.**

    +   5. **Click the Configuration button.**

    +   6. **Choose the App Mappings tab.**

    +   7. **Click Add.**

    +   8. **In the Executable box, type the path to the PHP interpreter: for example,
    type c:\php\php-cgi.exe.**

    +   9. **In the Extension box, type .php.**

    +      This will be the extension that is associated with PHP scripts.

    +   10. **Select the Script Engine check box.**

    +   11. **Click OK.**

    +       Repeat Steps 6–10 if you want any additional extensions, in addition to
    .php, to be processed by PHP, such as .phtml.


    # Configuring PHP


    PHP uses settings in a file named php.ini to control some of its behavior. PHP
    looks for php.ini when it begins and uses the settings that it finds. If PHP can’t
    find the file, it uses a set of default settings.


    The default location for the php.ini file is one of the following unless you change
    it during installation:


    +   ✔ **Windows:** The system directory, depending on the Windows version, as
    follows:

    +     - Windows 98/Me/XP: `windows`

    +     - Windows NT/2000: `winnt`

    +   ✔ **Unix/Linux/Mac:** `/usr/local/lib`'
  merge: -1
  img_proc: true
- pgno: 428
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_428_0.png)


    If the php.ini file isn''t installed during installation, you need to install
    it now. A configuration file with default settings, called php.ini-dist, is included
    in the PHP distribution. Copy this file into the appropriate location, such as
    the default locations mentioned above, changing its name to php.ini.


    If you have a previous version of PHP installed (such as PHP 4.3), make a backup
    copy of the php.ini file before you overwrite it with the php.ini file for PHP
    5. You can then see the settings you are currently using and change the settings
    in the new php.ini file to match the current settings.


    To configure PHP, follow these steps.


    +   1. **Open the php.ini file for editing.**

    +   2. **Activate mysql or mysqli support.**

    +   3. **Only if you''re using PHP with the IIS Web server, turn off force redirect.
    Find the line:**

    +   4. **Save the php.ini file.**

    +   5. **You might need to restart the Apache server before the new settings go
    into effect.**


    Look for a list of extensions. Find the line for mysql (if you''re using MySQL
    4.0 or earlier) or for mysqli (if you''re using MySQL 4.1 or later), as follows:


    ```

    ;extension=php_mysql.dll

    ;extension=php_mysqli.dll

    ```


    Notice the semicolon (;) at the beginning of the lines. To activate the extension,
    remove the semicolon. If the extension line isn''t in your php.ini file, add it.


    ```

    ;cgi.force_redirect = 1

    ```


    You need to remove the semicolon so that the settings is active, and also change
    the 1 to 0. After the changes, the line looks as follows:


    ```

    cgi.force_redirect = 0

    ```


    In general, the remaining default settings allow PHP to run okay, but you might
    need to edit some of these settings for specific reasons. I discuss settings in
    the php.ini file throughout the book when I discuss a topic that might require
    you to change settings. For example, PHP error-handling actions can be changed
    by settings in the php.ini file. The possible settings for error handling and
    their effects are discussed in Chapter 4.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# Appendix C


    # Installing and Configuring Apache


    Apache is an open-source Web server. A Web server delivers the files on the Web
    site to the visitor who wants to see the Web pages.


    In most cases, you want to get Apache from the Web and install it yourself. Although
    Apache may already be installed on your computer (because most Linux distributions
    and Mac OS X include Apache), it''s unlikely to be the latest version. Or Apache
    may not have been installed with the options you need. Because of this, you''re
    often better off installing Apache yourself.


    # Selecting a Version of Apache


    Apache is currently available in two versions: Apache 1.3 and Apache 2. Apache
    2 is the newer version, released in April 2002. Apache 2 is not supported on Windows
    9x installations; it requires Windows NT/2000/XP.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_429_0.png)


    Many Linux distributions come with Apache 2 installed. However, as of this writing,
    the PHP Web site cautions against using Apache 2 with PHP in a production environment.
    Check the Web page for the current status of PHP with Apache 2 at `www.php.net/manual/en/install.apache2.php#install.apache2.unix`.


    At this time, the current versions are


    +   ✔ Apache 2.0.47

    +   ✔ Apache 1.3.28


    Try to install the most current Apache version so that your Apache server includes
    all the latest security and bug fixes. New features are no longer being added
    to Apache 1.3, but bugs are still being fixed and security issues are being addressed.
    New versions of Apache 1.3 continue to be released but on a less frequent basis
    than for Apache 2.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# Installing Apache


    Apache can be downloaded and installed on your Web server for free. It''s available
    for almost every operating system, including Windows, Linux, many flavors of Unix,
    and Mac.


    # On Linux/Unix


    To install Apache on Linux and Unix, you download the source code, compile it,
    and install it. This sounds daunting but is much easier than it sounds.


    # Before installing


    Before installing Apache, check the following requirements:


    +   - **Disk space:** You may need as much as 50MB of disk space while installing.
    Apache will probably use 10MB after installation, although the amount varies depending
    on the options used and modules installed.

    +   - **C compiler:** Your computer has an ANSI-compliant C compiler installed.
    GNU C (gcc) is a good choice.


    # Installing


    To install Apache from source files, follow these steps:


    +   1. **Point your Web browser to** `httpd.apache.org`, **the Apache home page.**

    +   2. **Click the** From a Mirror **link under Download on the left side of the
    page.**

    +   3. **Scroll down to the Mirror section.**

    +      A specific mirror is selected for you. If you don''t want to use this mirror,
    select another. Or if you have problems downloading from this mirror, return to
    this page and select another.

    +   4. **Scroll further down the same page to the section for Apache 2 or for
    Apache 1.3, whichever you want to install. Locate and highlight the file you want
    to download.**

    +      For instance, at this time, the most recent version of Apache 1.3 for Linux
    is `apache-1.3.28.tar.gz`.

    +   5. **Click the latest version to download it.**

    +   6. **Select the option to save the file.**

    +   7. **Navigate to where you want to save the source code (for example, `/usr/src`).
    Then click Save.**'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 8. After the download, change to the download directory (for example, cd
    -/usr/src).


    You see a file named apache-, followed by the version name and tar.gz. This file
    is called a tarball because it contains many files compressed into the tarball
    file by a program called tar.


    Be sure you''re using an account that has permission to write into /usr/src, such
    as root.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_431_0.png)


    # 9. Verify the downloaded file to be sure it hasn''t been tampered with. To verify
    the file, follow these steps:


    a. Download two files from www.apache.org/dist/httpd/: One file to download is
    named KEYS. The second file is named with the same file name, including version
    number, as the source, but the filename ends in .asc.


    b. Type one of the following lines, depending on which version of PGP is installed
    on your computer:


    ```

    pgp <KEYS

    gpg --import KEYS

    ```


    Several lines of output are displayed.


    c. Type one of the following lines, with the correct version number.


    ```

    pgp apache-1.3.28.tar.gz.asc

    gpg --verify apache-1.3.28.tar.gz.asc

    ```


    You should see something similar to the following:


    ```

    Good signature from user "Sander Striker"

    ```


    This is what you are looking for. Several messages will probably be displayed,
    but the preceding message is the important one. You might also see a message stating
    that the relationship between the key and the signer of the key cannot be verified.
    This is okay.


    If you don''t get a message that the signature is good, the file might have been
    tempered with and may be dangerous. In this case, repeat the process starting
    with Step 1 and select a different mirror to download from.


    # 10. Unpack the tarball.


    The command to unpack the tarball for version 1.3.28 is the following:


    ```

    gunzip -c apache-1.3.28.tar.gz | tar -xf -

    ```


    A new directory called apache-1.3.28 is created with several subdirectories containing
    all the files that you just unpacked from the tarball.


    # 11. Change to the new directory that was created when you unpacked the tarball.'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'For example, you can use a command like the following:


    ```

    cd apache-1.3.28

    ```


    # 12. Type the configure command.


    The configure command consists of ./configure followed by all the necessary options.
    If you can use all the default options, you can use configure without any options.
    However, to use Apache with PHP as a module, use the configure command as follows:


    ```

    ./configure --enable-module=so

    ```


    One of the more important installation options you may want to use is prefix,
    which sets a different location where you want Apache to be installed. By default,
    Apache is installed at /usr/local/apache or usr/local/apache2. You can change
    the installation location with the following line:


    ```

    ./configure --prefix=/software/apache

    ```


    You can see a list of all the available options by typing the following line:


    ```

    ./configure --help

    ```


    This script may take a while to finish running. As it runs, it displays output.
    When the script is done, the system prompt is displayed. If configure encounters
    a problem, it displays a descriptive error message.


    # 13. Type the following command:


    ```

    make

    ```


    This command builds the Apache server. It may take several minutes to finish running.
    As it runs, it displays messages telling you what it''s doing. There may be occasional
    longer pauses as it completes some action. When it''s finished, it returns to
    the system prompt. If it has a problem, it displays a descriptive error message.


    # 14. Type the following command:


    ```

    make install

    ```


    This command installs the Apache software in the proper locations, based on the
    configure command you used in Step 11.


    # 15. Start the Apache Web server.


    See the following section, “Starting and Stopping Apache,” for details.


    # 16. Type the URL for your Web site (for example, www.mysite.com or localhost)
    into a browser to test Apache.


    If all goes well, you see the Apache message telling you that Apache is working.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# Starting and stopping Apache


    A script named apachectl is available to control the server. By default, the script
    is stored in a subdirectory called bin in the directory where Apache is installed.
    Some Linux distributions may put it in another directory.


    The script requires a keyword. The most common keywords are start, stop, and restart.
    The general syntax is as follows:


    ```

    path/apachectl keyword

    ```


    For example, if Apache was installed in the default directory, type the following
    line to start Apache:


    ```

    /usr/local/apache/bin/apachectl start

    ```


    # Starting Apache


    The apachectl script starts the Apache server, which then runs in the background,
    listening for HTTP requests. By default, the compiled Apache server is named httpd
    and is stored in the same directory as the apachectl script, although you can
    change the name and location when you install Apache. The apachectl script serves
    as an interface to the compiled server, called httpd.


    You can run the httpd server directly, but it''s better to use apachectl as an
    interface. The apachectl script manages and checks data that httpd commands require.
    Use the apachectl script to start Apache with the following command:


    ```

    /usr/local/apache/bin/apachectl start

    ```


    The apachectl script contains a line that runs httpd. By default, apachectl looks
    for httpd in the default location — /usr/local/apache/bin or /usr/local/apache2/bin.
    If you installed Apache in a nonstandard location, you may need to edit apachectl
    to use the correct path. Open apachectl and then search for the following line:


    ```

    HTTPD=''/usr/local/apache2/bin/httpd''

    ```


    Change the path to the location where you installed httpd. For example, the new
    line might be this:


    ```

    HTTPD=''/usr/mystuff/bin/httpd''

    ```


    After you start Apache, you can check whether Apache is running by looking at
    the processes on your computer. Type the following command to display a list of
    the processes that are running:


    ```

    ps -A

    ```


    If Apache is running, the list of processes includes some httpd processes.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# Getting information from Apache


    You can use options with the httpd server to obtain information about Apache.
    For instance, you can find out what version of Apache is installed by changing
    to the directory with httpd and typing


    ```

    httpd -v

    ```


    Or, probably, ./httpd -v. You can find out what modules are installed with Apache
    by typing the following:


    ```

    httpd -l

    ```


    To see all the options that are available, type the following:


    ```

    httpd -h

    ```


    # Restarting Apache


    Whenever you change the configuration file, the new directives take effect the
    next time Apache starts. If Apache is shut down when you make the changes, you
    can start Apache as described earlier in “Starting Apache.” However, if Apache
    is running, you can’t use start to restart it. Using start results in an error
    message saying that Apache is already running. You can use the following command
    to restart Apache when it’s currently running:


    ```

    /usr/local/apache2/bin/apachectl restart

    ```


    Although the restart command usually works, sometimes it doesn’t. If you restart
    Apache and the new settings don’t seem to be in effect, try stopping Apache and
    starting it again. Sometimes this solves the problem.


    # Stopping Apache


    To stop Apache, use the following command:


    ```

    /usr/local/apache/bin/apachectl stop

    ```


    You can check to see that Apache is stopped by checking the processes that are
    running on your computer by using the following command:


    ```

    ps -A

    ```


    The output from ps should not include any httpd processes.


    # On Windows


    You can install Apache on almost any version of Windows, although Windows NT/2000/XP
    are preferred.'
  merge: -1
  img_proc: true
