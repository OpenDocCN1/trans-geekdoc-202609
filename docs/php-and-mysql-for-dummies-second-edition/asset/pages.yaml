- pgno: 333
  md: '**11** The `include` statement brings in a file that contains the information
    necessary to connect to the database. I call it `misc.inc` because that seems
    more secure than calling it `passwords.inc`.


    **13** Connects to the MySQL server.


    **15** Selects the `PetCatalog` database.


    **19** A query that selects all the information from the `PetType` table and puts
    it in alphabetical order based on pet type.


    **21** Executes the query on line 19.


    **34** The opening tag for a form that will hold all the pet types. The action
    target is `ShowPets.php`, which is the program that shows the pets of the chosen
    type.


    **36** Creates a counter with a starting value of 1. The counter will keep track
    of how many pet types are found in the database.


    **37** Starts a `while` loop that will get the rows containing the pet type and
    pet description that were selected from the database on lines 19 and 20. The loop
    will execute once for each pet type that was retrieved.


    **39** Separates the row into two variables: `$petType` and `$petDescription`.


    **41/42** Echoes a form field tag for a radio button. The value is the value in
    `$petType`. This statement executes once in each loop, creating a radio button
    for each pet type. This statement echoes only part of the form field tag.


    **43** Starts an `if` block that executes only in the first loop. It echoes the
    word `"checked"` as part of the form field. This ensures that one of the radio
    buttons is selected in the form so that the form can’t be submitted with no button
    selected, which would result in unsightly error messages or warnings. The counter
    was set up solely for this purpose.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_333_0.png)


    Although adding `"checked"` to every radio button works in some browsers, it confuses
    other browsers. However, the extra programming required to add `"checked"` to
    only one radio button can prevent potential problems.


    **47** Echoes the remaining part of the form field tag for the radio button —
    the part that closes the tag.


    **49** Echoes the pet description in a second cell in the table row.


    **51** Adds 1 to the counter to keep track of the number of times that the loop
    has executed.


    **54** Adds the submit button to the form.


    **55** Closes the form.


    When the user selects a radio button and then clicks the submit button, the next
    program — named `ShowPets.php` in the form tag — runs, showing the pets for the
    selected pet type.'
