- pgno: 7
  md: '# About the Author


    **Janet Valade** is the author of *PHP 5 For Dummies* as well as the first edition
    of this book. In addition, Janet has authored and revised chapters for Linux books,
    written chapters for a Certified Internet Webmaster (CIW) book, and written the
    Apache section for a book on LAMP (Linux, Apache, MySQL, and PHP).


    Janet has 20 years of experience in the computing field. Most recently, she worked
    as a Web designer and programmer in a Unix/Linux environment for four years. Prior
    to that, Janet worked for 13 years in a university environment, where she was
    a systems analyst. During her tenure, she supervised the installation and operation
    of computing resources, designed and developed a data archive, supported faculty
    and students in their computer usage, wrote numerous technical papers, and developed
    and presented seminars on a variety of technology topics.


    To keep in touch, see janet.valade.com.'
