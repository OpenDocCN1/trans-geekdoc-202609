    \ the server started. The window remains open and ready to receive any more messages\
    \ from the server. Don’t close the window.\n\nYou might be able to stop the server\
    \ using `WinMySQLadmin` if it is running by right clicking the traffic signal,\
    \ selecting Win NT from the menu displayed, and then clicking Stop the Server.\
    \ If this doesn’t work, you can use the following steps:\n\n+   1. **Open a command\
