- pgno: 313
  md: '# Chapter 11


    # Building an Online Catalog


    # In This Chapter


    +   ► Designing an online catalog

    +   ► Building the database for the Pet Catalog

    +   ► Designing the Web pages for the Pet Catalog

    +   ► Writing the programs for the Pet Catalog


    Online catalogs are everywhere on the Web. Every business that has products for
    sale can use an online catalog. Some businesses use online catalogs to sell their
    products online, and some use them to show the quality and worth of their products
    to the world. Many customers have come to expect businesses to be online and provide
    information about their products. Customers often begin their search for a product
    online, researching its availability and cost through the Web.


    In this chapter, you find out how to build an online catalog. I chose a pet store
    catalog for no particular reason except that it sounded like more fun than a catalog
    of socks or light bulbs. And looking at the pictures for a pet catalog was much
    more fun than looking at pictures of socks. I introduce the Pet Catalog example
    in Chapter 3 and use it for many of the examples throughout this book.


    In general, all catalogs do the same thing: provide product information to potential
    customers. The general purpose of the catalog is to make it as easy as possible
    for customers to see information about the products. In addition, you want to
    make the products look as attractive as possible so that customers will want to
    purchase them.


    # Designing the Application


    The first step in design is to decide what the application should do. The obvious
    purpose of the Pet Catalog is to show potential customers information about the
    pets. A pet store might also want to show information about pet'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'products, such as pet food, cages, fish tanks, and catnip toys . . . but you
    decide not to include such items in your catalog. The purpose of your online catalog
    application is just to show pets.


    For the customer, displaying the information is the sole function of the catalog.
    However, from your perspective, the catalog also needs to be maintained; that
    is, you need to add items to the catalog. So, you must include the task of adding
    items to the catalog as part of the catalog application. Thus, the application
    has two distinct functions:


    +   - ✓ Show pets to the customers

    +   - ✓ Add pets to the catalog


    # Showing pets to the customers


    The basic purpose of your online catalog is to let customers look at pets. Customers
    can’t purchase pets online, of course. Sending pets through the mail isn’t feasible.
    But a catalog can showcase pets in a way that motivates customers to rush to the
    store to buy them.


    If your catalog only has three pets in it, your catalog can be pretty simple —
    one page showing the three pets. However, most catalogs have many more items than
    that. Usually, a catalog opens with a list of the types of products — in this
    case, pets — that are available, such as cat, dog, horse, and dragon. Customers
    select the type of pet they want to see, and the catalog then displays the individual
    pets of that type. For example, if the customer selects dog, the catalog would
    then show collies, spaniels, and wolves. Some types of products might have more
    levels of categories before you see individual products. For instance, furniture
    might have three levels rather than two. The top level might be the room, such
    as kitchen, bedroom, and so on. The second level might be type, such as chairs,
    tables, and so on. The third level would be the individual products.


    The purpose of a catalog is to motivate those who look at it to make a purchase
    immediately. For the Pet Catalog, pictures are a major factor in motivating customers
    to make a purchase. Pictures of pets make people go oooh and aaaah and say, “Isn’t
    he cuuuute!” This generates sales. The main purpose of your Pet Catalog is to
    show pictures of pets. In addition, the catalog also should show descriptions
    and prices.


    To show the pets to customers, the Pet Catalog will do the following:


    +   1. Show a list of the types of pets and allow the customer to select a type.

    +   2. Show information about the pets that match the selected type. The information
    includes the description, the price, and a picture of the pet.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Adding pets to the catalog


    You can add items to your catalog several ways. However, the task of adding an
    item to the catalog is much easier if you use an application designed for adding
    your specific products. In many cases, you aren’t the person who will be adding
    products to your catalog. One reason for adding maintenance functionality to your
    catalog application is so that someone else can do those boring maintenance tasks.
    The easier it is to maintain your catalog, the less likely that errors will sneak
    into it.


    An application to add a pet to your catalog should do the following:


    +   1. **Prompt the user to enter a pet type for the pet.** A selection list of
    possible pet types would eliminate many errors, such as alternate spellings (*dog*
    and *dogs*) and misspellings. The application also needs to allow the user to
    add new categories when needed.

    +   2. **Prompt the user to enter a name for the pet**, such as *collie* or *shark*.
    A selection list of names would help prevent mistakes. The application also needs
    to allow the user to add new names when needed.

    +   3. **Prompt the user to enter the pet information for the new pet.** The application
    should clearly specify what information is needed.

    +   4. **Store the information in the catalog.**


    The catalog entry application can check the data for mistakes and enter the data
    into the correct locations. The person entering the new pet doesn’t need to know
    the inner workings of the catalog.


    # Building the Database


    The catalog itself is a database. It doesn’t have to be a database; it’s possible
    to store a catalog as a series of HTML (HyperText Markup Language) files that
    contain the product information in HTML tags and display the appropriate file
    when the customer clicks a link. However, it makes my eyes cross to think of maintaining
    such a catalog. Imagine the tedium of adding and removing catalog items manually
    . . . or finding the right location for each item by searching through many files.
    Ugh. For these reasons, putting your Pet Catalog in a database is better.


    The PetCatalog database contains all the information about pets. It uses three
    tables:


    +   - Pet table

    +   - PetType table

    +   - Color table'
  merge: -1
  img_proc: true
- pgno: 316
  md: "The first step in building the Pet Catalog is to build the database. It’s pretty\
    \ much impossible to write programs without a working database to test the programs\
    \ on. First you design your database; then you build it; then you add the data\
    \ (or at least some sample data to use while developing the programs).\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_316_0.png)\n\
    \nSome changes have been made to the database design in Chapter 3 for the Pet\
    \ Catalog. Development and testing often result in changes. Perhaps you find that\
    \ you didn’t take some factors into consideration in your design or that certain\
    \ elements of your design don’t work with real-world data or are difficult to\
    \ program. It’s perfectly normal for the design to evolve while you work on your\
    \ application. Just be sure to change your documentation when your design changes.\n\
    \n# Building the Pet table\n\nIn your design for the Pet Catalog, the main table\
    \ is the Pet table. It contains the information about the individual pets that\
    \ you sell. The following SQL query creates the Pet table:\n\n```\n```sql\nCREATE\
    \ TABLE Pet (\n    petID               INT(5)             NOT NULL AUTO_INCREMENT,\n\
    \    petName             CHAR(25)            NOT NULL,\n    petType          \
    \   CHAR(15)            NOT NULL DEFAULT \"Misc\",\n    petDescription      VARCHAR(255),\n\
    \    price               DECIMAL(9,2),\n    pix                 CHAR(15)     \
    \       NOT NULL DEFAULT \"na.gif\",\n    PRIMARY KEY(petID) );\n```\n```\n\n\
    Each row of the Pet table represents a pet. The columns are as follows:\n\n+ \
    \  - **petID:** A sequence number for the pet. In another catalog, this might\
    \ be a product number, a serial number, or a number used to order the product.\
    \ The `CREATE` query defines the `petID` column in the following ways:\n+    \
    \ - `INT(5)`: The data in the field is expected to be a numeric integer. The database\
    \ won’t accept a character string in this field.\n+     - `PRIMARY KEY(petID)`:\
    \ This is the primary key, which is the field that must be unique. MySQL will\
    \ not allow two rows to be entered with the same `petID`.\n+     - `NOT NULL`:\
    \ This definition means that this field can’t be empty. It must have a value.\
    \ The primary key must always be set to `NOT NULL`.\n+     - `AUTO-INCREMENT`:\
    \ This definition means that the field will automatically be filled with a sequential\
    \ number if you don’t provide a specific number. For example, if a row is added\
    \ with 98 for a `petID`, the next row will be added with 99 for the `petID` unless\
    \ you specify a different number. This is a useful way of specifying a column."
  merge: -1
  img_proc: true
- pgno: 317
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 318
  md: 'pix: The filename of the picture of the pet. Pictures on a Web site are stored
    in graphic files with names like dog.jpg, dragon.gif, or cat.png. This field stores
    the filename for the picture that you want to show for this pet. The CREATE query
    defines pix in the following ways:


    +   - `CHAR(15)`: The data in this field is expected to be a character string
    that''s 15 characters long. For some applications, the picture files might be
    in other directories or on other Web sites requiring a longer field, but for this
    application, the pictures are all in a directory on the Web site and have short
    names. The field will always take up 15 characters of storage, with padding if
    the actual string stored is less than 15 characters.

    +   - `NOT NULL`: This definition means that this field can''t be empty. It must
    have a value. You need a picture for the pet. When a Web site tries to show a
    picture that can''t be found, it displays an ugly error message in the browser
    window where the graphic would go. You don''t want your catalog to do that, so
    your database should require a value. In this case, you define a default value
    so that a value will always be placed in this field.

    +   - `DEFAULT "na.gif"`: The value "na.gif" is stored if you don''t provide a
    value for pix. In this way, a value is always stored for pix. The na.gif file
    might be a graphic that reads something like: "picture not available".


    Notice the following points about this database table design:


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_318_0.png)


    **Some fields are CHAR, and some are VARCHAR.** CHAR fields are faster, whereas
    VARCHAR fields are more efficient. Your decision will depend on whether disk space
    or speed is more important for your application in your environment.


    In general, shorter fields should be CHAR because shorter fields don''t waste
    much space. For instance, if your CHAR is 5 characters, the most space that you
    could possibly waste is 4. However, if your CHAR is 200, you could waste 199.
    Therefore, for short fields, use CHAR for speed with very little wasted space.


    **The petID field means different things for different pets.** The petID field
    assigns a unique number to each pet. However, a unique number is not necessarily
    meaningful in all cases. For example, a unique number is meaningful for an individual
    kitten but not for an individual goldfish.


    There are really two kinds of pets. One is the unique pet, such as a puppy or
    a kitten. After all, the customer buys a specific dog — not just a generic dog.
    The customer needs to see the picture of the actual animal. On the other hand,
    some pets are not especially unique, such as a goldfish or a parakeet. When customers
    purchase a goldfish, they see a'
