    ```


    where *accountname* is an account that has create permission. If the account doesn’t
    require a password, leave out the -p. If you use the -p, you will be asked for
    the password. Use the entire path and filename for the backup file. For instance,
    a command to restore the PetCatalog database might be


    ```

