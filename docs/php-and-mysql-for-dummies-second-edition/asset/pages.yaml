    | Unicorn | Horse | Unicorn | white |

    | Unicorn | Horse | Unicorn | silver |


    Notice that only Unicorn appears in the results table — because only Unicorn was
    in both of the original tables, before the join. On the other hand, suppose you
    do a left outer join with the following query:


    ```

    SELECT * FROM Pet LEFT JOIN Color

    ON Pet.petName=Color.petName

    ```


    You get the following results table, with the same four columns — petName (from
    Pet), petType, petName (from Color), and petColor — but with different rows:


    | petName | petType | petName | petColor |

    |---|---|---|---|

    | Unicorn | Horse | Unicorn | white |

    | Unicorn | Horse | Unicorn | silver |

    | Pegasus | Horse | <NULL> | <NULL> |

    | Lion | Cat | <NULL> | <NULL> |


    This table has four rows. It has the same first two rows as the inner join, but
    it has two additional rows — rows that are in the PetType table on the left but
    not in the Color table. Notice that the columns from the table Color are blank
    for the last two rows.


    And, on the third hand, suppose that you do a right outer join with the following
    query:


    ```

    SELECT * FROM Pet RIGHT JOIN Color

    ON Pet.petName=Color.petName

    ```'
