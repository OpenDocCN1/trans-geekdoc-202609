  md: "7. **It starts a foreach loop.** The loop walks through the row, processing\
    \ each field.\n\n8. **It stores values in the array.** $petInfo is a multidimensional\
    \ array. Its first key is a number, which is set by the counter. Because this\
    \ is the first time through the while loop, the counter — $j — is now equal to\
    \ 1. All the fields in the row are stored in $petInfo with the column name as\
    \ the key. (I explain multidimensional arrays in detail in Chapter 7.)\n\n9. **It\
    \ increments the counter.** $j is incremented by 1.\n\n10. **It reaches the end\
    \ of the while loop.**\n\n11. **It returns to the top of the while loop.**\n\n\
    12. **It repeats Steps 6–11 for every row in the results.**\n\n13. **It returns\
