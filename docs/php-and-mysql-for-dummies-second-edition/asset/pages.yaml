  md: "# Chapter 12\n\n# Building a Members Only Web Site\n\n# In This Chapter\n\n\
    +   ► Designing the Members Only Web site\n+   ► Building the database for the\
    \ member directory\n+   ► Designing the Web pages for the Members Only section\n\
    +   ► Writing the programs for logging in to the Members Only section\n\nMany\
    \ Web sites require users to log in. Sometimes users can’t view any Web pages\
    \ without entering a password, while sometimes just part of the Web page requires\
    \ a login. Here are some reasons why you might want to require a user login:\n\
    \n+   ✔ **The information is secret.** You don’t want anyone except a few authorized\
    \ people to see the information. Or perhaps only your own employees should see\
    \ the information.\n+   \n+   ✔ **The information or service is for sale.** The\
    \ information or service that your Web site provides is your product, and you\
    \ want to charge people for it. For instance, you might have a corner on some\
    \ survey data that researchers are willing to pay for. For example, AAA Automobile\
    \ Club offers some of its information for free, but you have to be a member to\
    \ see its hotel ratings.\n+   \n+   ✔ **You can provide better service.** If you\
    \ know who your customers are or have some of their information, you can make\
    \ their interaction with your Web site easier. For instance, if you have an account\
    \ with Barnes and Noble.com or the Gap and log into their site, they use your\
    \ stored shipping address, and you don’t have to type it in again."
  merge: -1
