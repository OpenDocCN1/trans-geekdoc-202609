- pgno: 378
  md: "The customer controls what happens next. If the customer clicks the button\
    \ to return to the main page, the PetShopFront.php programs runs. If the customer\
    \ clicks the Members Only Section submit button, the first page of the Members\
    \ Only section is shown.\n\n# Writing the Members Only section\n\nThe Web pages\
    \ in the Members Only section are no different than any other Web pages. You just\
    \ want to restrict them to members who are logged in. To do this, you start a\
    \ session and check whether they’re logged in at the top of every page. The statements\
    \ for the top of each program are\n\n```\nsession_start();\nif (@$_SESSION['auth']\
    \ != \"yes\")\n{\n    header(\"Location: Login.php\");\n    exit();\n}\n```\n\n\
    When session_start executes, PHP checks for an existing session. If one exists,\
    \ it sets up the session variables. One of the session variables is $auth. When\
    \ the user logs in, $_SESSION[auth] is set to yes. If $_SESSION[auth] doesn’t\
    \ equal yes, the user is not logged in, and the program takes the user to the\
    \ login page.\n\n# Planning for Growth\n\nThe original plan for an application\
    \ usually includes every wonderful thing that the user might want it to do. Realistically,\
    \ it’s usually important to make the application available to the users as quickly\
    \ as possible. Consequently, applications usually go public with a subset of the\
    \ planned functionality. More functionality is added later. That’s why it’s important\
    \ to write your application with future growth in mind.\n\nLooking at the login\
    \ application in this chapter, I’m sure you can see many things that could be\
    \ added to it. Here are some possibilities:\n\n+   - **E-mail a forgotten password.**\
    \ Users often forget their passwords. Many login applications have a link that\
    \ users can click to have their passwords e-mailed to them.\n+   - **Change the\
    \ password.** Members might want to change their password. The application could\
    \ offer a form for password changes."
  merge: -1
  img_proc: true
- pgno: 379
  md: '+   - **Update information.** Members might move or change their phone number
    or e-mail address. The application could provide a way for members to change their
    own information.

    +   - **Create a member list.** You might want to output a nicely formatted list
    of all the members in the database. This probably isn''t something you want to
    make available to other members but just for yourself. In some situations, however,
    you might want to make the list available to all members.


    You can easily add any of these abilities to the application. For instance, you
    can add a button to the login form that reads *Forgot my password* that e-mails
    the password to the e-mail address in the database. The button can run the login
    program with a section for e-mailing the password or run a different program that
    e-mails the password. In the same manner, you can add buttons for changing the
    password or updating the customer information. You don''t need to wait until an
    application has all its bells and whistles to let your customers use it. You can
    write it one step at a time.'
