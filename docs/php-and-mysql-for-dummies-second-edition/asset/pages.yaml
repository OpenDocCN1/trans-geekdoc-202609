    \ 8-7, with cat selected. However, cat is selected in this program because it\
    \ is the first item in the list — not because it's specifically selected as it\
    \ is in the HTML tags that produce Figure 8-7. The drop-down list produced by\
    \ this program is in alphabetical order, as shown in Figure 8-9.\n\nYou can also\
    \ use PHP variables to set up which option is selected when the selection box\
    \ is displayed. For instance, suppose that you want the user to select a date\
