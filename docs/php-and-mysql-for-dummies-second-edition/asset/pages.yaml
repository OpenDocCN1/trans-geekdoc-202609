- pgno: 21
  md: '# Introduction


    Welcome to the exciting world of Web database applications. This book provides
    the basic techniques to build any Web database application, but I certainly recommend
    that you start with a fairly simple one. In this book, I develop two sample applications,
    both chosen to represent two types of applications frequently encountered on the
    Web: product catalogs and customer/member-only sites that require the user to
    register and log in with a password. The sample applications are complicated enough
    to require more than one program and to use a variety of data and data manipulation
    techniques, yet simple enough to be easily understood and adapted to a variety
    of Web sites. After you master the simple applications, you can expand the basic
    design to include all the functionality that you can think of.


    # About This Book


    Think of this book as your friendly guide to building a Web database application.
    This book is designed as a reference, not as a tutorial, so you don’t have to
    read this book from cover to cover, unless you want to. You can start reading
    at any point in the book — in Chapter 1, Chapter 9, wherever. I divide the task
    of building a Web database application into manageable chunks of information,
    so check out the table of contents and locate the topic that you’re interested
    in. If you need to know information from another chapter to understand the chapter
    you’re reading, I reference that chapter number.


    Here’s a sample of the topics that I discuss in this book:


    +   ✓ Building and using a MySQL database

    +   ✓ Adding PHP to HTML files

    +   ✓ Using the features of the PHP language

    +   ✓ Using HTML forms to collect information from users

    +   ✓ Showing information from a database in a Web page

    +   ✓ Storing information in a database'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Conventions Used in This Book


    This book includes many examples of PHP programming statements, MySQL statements,
    or HTML. Such statements in this book are shown in a different typeface that looks
    like the following line:


    ```

    A PHP program statement

    ```


    In addition, snippets or key terms of PHP, MySQL, and HTML are sometimes shown
    in the text of a paragraph. When they are, the special text in the paragraph is
    also shown in the example typeface, different than the paragraph typeface. For
    instance, this text is an example of a PHP statement, showing the exact text,
    within the paragraph text.


    In examples, you will often see some words in italic. Italicized words are general
    types that need to be replaced with the specific name appropriate for your data.
    For instance, when you see an example like the following


    ```

    SELECT field1,field2 FROM tablename

    ```


    you know that field1, field2, and tablename need to be replaced with real names
    because they are in italic. When you use this statement in your program, you might
    use it in the following form:


    ```

    SELECT name,age FROM Customer

    ```


    In addition, you might see three dots (...) following a list in an example line.
    You don''t need to type the three dots. The three dots just mean that you can
    have as many items in the list as you want. For instance, when you see the following
    line


    ```

    SELECT field1,field2,... FROM tablename

    ```


    you don''t need to include the three dots in the statement. The three dots just
    mean that your list of fields can be longer than two. It means you can go on with
    field3, field4, and so forth. For example, your statement might be


    ```

    SELECT name,age,height,shoesize FROM Customer

    ```


    From time to time, you''ll also see some things in bold type. Pay attention to
    these; they either indicate something I want you to see or something that you
    need to type in.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# What You''re Not to Read


    Some information in this book is flagged as Technical Stuff with an icon off to
    the left side. Sometimes you''ll see this technical stuff is in a sidebar: Consider
    it information that you don''t need to read in order to create a Web database
    application. This extra info might contain a further look under the hood or perhaps
    describe a technique that requires more technical knowledge to execute. Some readers
    may be interested in the extra technical information or techniques, but feel free
    to ignore them if you don''t find them interesting or useful.


    # Foolish Assumptions


    To write a focused book rather than an encyclopedia, I need to assume some background
    for you, the reader. I am assuming that you know HTML and have created Web sites
    with HTML. Consequently, although I use HTML in many examples, I do not explain
    the HTML. If you don''t have an HTML background, this book will be more difficult
    for you to use. I suggest that you read an HTML book — such as HTML 4 For Dummies,
    4th Edition, by Ed Tittel and Natanya Pitts, or HTML 4 For Dummies Quick Reference,
    2nd Edition, by Deborah S. Ray and Eric J. Ray (Wiley) — and build some practice
    Web pages before you start this book. In particular, some background in HTML forms
    and tables is useful. However, if you''re the impatient type, I won''t tell you
    it''s impossible to proceed without knowing HTML. You may be able to glean enough
    HTML from this book to build your particular Web site. If you choose to proceed
    without knowing HTML, I would suggest that you have an HTML book by your side
    to assist you when you need to figure out some HTML that isn''t explained in this
    book.


    If you are proceeding without any experience with Web pages, you might not know
    some basics that are required. You must know how to create and save plain text
    files with an editor such as Notepad or save the file as plain text from your
    word processor (not in the word processor format). You also must know where to
    put the text files containing the code (HTML or PHP) for your Web pages so that
    the Web pages are available to all users with access to your Web site, and you
    must know how to move the files to the appropriate location.


    You do not need to know how to design or create databases or how to program. All
    the information that you need to know about databases and programming is included
    in this book.'
