    \ times if it appeared several times in the database.\n+   - **Using ORDER BY\
    \ in the query:** The pet types are sorted alphabetically.\n+   - **echo statements\
    \ before the loop:** The form and select tags are echoed before the while loop\
    \ starts because they are echoed only once.\n+   - **echo statements in the loop:**\
    \ The option tags are echoed in the loop — one for each pet type in the database.\
    \ No item is marked as selected, so the first item in the list is selected automatically.\n\
    +   - **echo statements after the loop:** The end form and select tags are echoed\
    \ after the loop because they are echoed only once.\n\nThe selection list produced\
