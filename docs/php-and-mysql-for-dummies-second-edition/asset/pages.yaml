    # MySQL data type names


    When you create a database, you tell MySQL what kind of data to expect in a particular
    column by using the MySQL names for data types. Table 3-1 shows the MySQL data
    types used most often in Web database applications.


    **Table 3-1 MySQL Data Types**


    | MySQL Data Type | Description |

    |---|---|

    | CHAR(length) | Fixed-length character string. |

    | VARCHAR(length) | Variable-length character string. The longest string that
    can be stored is length, which must be between 1 and 255. |

    | TEXT | Variable-length character string with a maximum length of 64KB of text.
    |

    | INT(length) | Integer with a range from −2147483648 to +2147483647. The number
    that can be displayed is limited by length. For example, if length is 4, only
    numbers from −999 to 9999 can be displayed, even though higher numbers are stored.
    |

    | INT(length) UNSIGNED | Integer with a range from 0 to 4294967295. length is
    the size of the number that can be displayed. For example, if length is 4, only
    numbers up to 9999 can be displayed, even though higher numbers are stored. |

    | DECIMAL(length,dec) | Decimal number where length is the number of characters
    that can be used to display the number, including decimal points, signs, and exponents,
    and dec is the maximum number of decimal places allowed. For example, 12.34 has
    length of 5 and dec of 2. |

    | DATE | Date value with year, month, and date. Displays the value as YYYY-MM-DD
    (for example, 2001-04-03). |

    | TIME | Time value with hour, minute, and second. Displays as HH:MM:SS. |'
