- pgno: 277
  md: '# Chapter 9


    # Moving Information from One Web Page to the Next


    # In This Chapter


    +   - Moving your user from one page to the next

    +   - Moving information from one page to the next

    +   - Adding information to a URL

    +   - Taking a look at cookies

    +   - Using hidden form fields

    +   - Discovering PHP sessions


    Most Web sites consist of more than one Web page. This includes the static Web
    pages that you may have developed in the past. With static Web pages, users click
    links to move from one page to the next. Users click a link in one Web page, and
    a new Web page appears in their browser. When users move from page to page this
    way, no information is transferred from the first page to the second. Each new
    page that is sent to the user''s browser is independent of any other pages that
    the user may have seen previously. With dynamic Web pages, you may need to transfer
    information from one page to the next. If you are an advanced HTML developer,
    you may have some experience with limited methods for transferring information
    from one page to the next by using HTML forms and CGI (Common Gateway Interface)
    or cookies. However, PHP is much more powerful for passing information from Web
    page to Web page.


    # Moving Your User from One Page to Another


    When using HTML only, you provide links so that a visitor can go from one page
    to another in your Web site. When using PHP, however, you have three options for
    moving your user from one page to the next.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '**Links:** You can echo the HTML tags that display a link. The general format
    of an HTML statement that displays a link is


    ```

    <a href="newpage.php">Text user sees as a link</a>

    ```


    When users click the link, the program newpage.php is sent to their browser. This
    method is used extensively in HTML Web pages. You''re likely familiar with creating
    links from your HTML experience, but if you need a refresher, find out more about
    links in any HTML book, such as *HTML 4 For Dummies Quick Reference, 2nd Edition*,
    by Deborah S. Ray and Eric J. Ray (Wiley).


    **Form submit buttons:** You can use an HTML form with one or more submit buttons.
    When the user clicks a submit button, the program in the form tag runs and sends
    a new Web page to the user''s browser. You can create a form with no fields —
    only a submit button — but the user must click the submit button to move to the
    next page.


    I discuss forms and submit buttons thoroughly in Chapter 8.


    **The header function:** You can send a message to the Web server that tells it
    to send a new page by using the PHP header function. When using this method, you
    can display a new page in the user''s browser without the user having to click
    a link or a button.


    The PHP header function can be used to send a new page to the user''s browser.
    The program uses a header statement and displays the new Web page without needing
    any user action. When the header statement is executed, the new page is displayed.
    The format of the header function that requests a new page is


    ```

    header("Location: URL");

    ```


    The file located at URL is sent to the user''s browser. Either of the following
    statements are valid header statements:


    ```

    header("Location: newpage.php");

    header("Location: http://company.com/catalog/catalog.php");

    ```


    The header function has a major limitation, however. The header statement can
    only be used before any other output is sent. You cannot send a message requesting
    a new page in the middle of a program after you have echoed some output to the
    Web page. See the sidebar for a discussion of "Statements that must come before
    output."'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# URLs


    A URL (Uniform Resource Locator) is an address on the World Wide Web. Every Web
    page has its own URL or address. The URL is used by the Web server to find the
    Web page and send it to a browser.


    The format of a URL is


    ```

    HTTP://servername:portnumber/path#target?string=string

    ```


    Here''s a breakdown of the parts that make up the URL:


    HTTP://servername: This tells the server that the address is a Web site and gives
    the name of the computer where the Web site is located. Other types of transfer
    can be specified, such as FTP (File Transfer Protocol), but these aren''t related
    to the subject of this book. If this part of the URL is left out, the Web server
    assumes that the computer is the same computer that the URL is typed on. Valid
    choices for this part are HTTP://amazon.com or HTTP://localhost. Note: HTTP doesn''t
    have to be in uppercase letters.


    :portnumber: The Web server exchanges information with the Internet at a particular
    port on the computer. Most of the time, the Web server is set up to communicate
    via port 80. If the port number isn''t specified, port 80 is assumed. In some
    unusual circumstances, a Web server may use a different port number, in which
    case the port number must be specified. The most common reason for using a different
    port number is to set up a test Web site on another port that''s available only
    to developers and testers, not customers. When the site is ready for customers,
    it is made available on port 80.


    path: This is the path to the file, which follows the rules of any path. The root
    of the path is the main Web site directory. If the path points to a directory,
    rather than a file, the Web server searches for a default file name, such as default.html
    or index.html. The person who administers the Web site sets the default file name.
    The path /catalog/show.php indicates a directory called catalog that is in the
    main Web site directory and a file named show.php. The path catalog/show.php indicates
    a directory called catalog that is in the current directory.


    #target: An HTML tag defines a target. This part of the URL displays a Web page
    at the location where the target tag is located. For instance, if the tag <a name="target"></a>
    is in the middle of the file somewhere, the Web page will be displayed at the
    tag rather than at the top of the file.


    ?string=string: The question mark allows information to be attached to the end
    of the URL. The information in forms that use the get method is passed at the
    end of the URL in the format fieldname=value. You can add information to the end
    of a URL to pass it to another page. PHP automatically gets information from the
    URL and puts it into built-in arrays. You can pass more than one string=string
    pair by separating each pair with an ampersand (&); for example, ?state=CA&city=home.'
  merge: -1
  img_proc: true
- pgno: 280
  md: "# Statements that must come before output\n\nSome PHP statements can only be\
    \ used before sending any output. header statements, setcookie statements, and\
    \ session functions, all described in this chapter, must all come before any output\
    \ is sent. If you use one of these statements after sending output, you may see\
    \ the following message:\n\n```\nCannot add header information - headers already\
    \ sent\n```\n\nThe message will also provide the name of the file and indicate\
    \ which line sent the previous output. Or you might not see a message at all;\
    \ the new page might just not appear. (Whether you see an error message depends\
    \ on what error message level is set in PHP; see Chapter 6 for details.) The following\
    \ statements will fail because the header message is not the first output:\n\n\
    ```\n<html>\n<head><title>testing header</title></head>\n<body>\n<?php\n  header(\"\
    Location: http://company.com\");\n?>\n</body>\n</html>\n```\n\nThree lines of\
    \ HTML code are sent before the header statement. The following statements will\
    \ work, although they don’t make much sense:\n\n```\n<?php\n  header(\"Location:\
    \ http://company.com\");\n?>\n<html>\n<head><title>testing header</title></head>\n\
    <body>\n</body>\n</html>\n```\n\nThe following statements will fail:\n\n```\n\
    <?php\n  header(\"Location: http://company.com\");\n?>\n<html>\n<head><title>testing\
    \ header</title></head>\n<body>\n</body>\n</html>\n```\n\nThe reason why these\
    \ statements fail is not easy to see, but if you look closely, you’ll notice a\
    \ single blank space before the opening PHP tag. This blank space is output to\
    \ the browser, although the resulting Web page looks empty. Therefore, the header\
    \ statement fails because there is output before it. This is a common mistake\
    \ and difficult to spot."
  merge: -1
  img_proc: true
- pgno: 281
  md: "In spite of its limitation, the `header` function can be useful. You can have\
    \ as many PHP statements as you want before the `header` function as long as they\
    \ don’t send output. Therefore, the following statements will work:\n\n```\n```php\n\
    <?php\n    if ($customer_age < 13)\n    {\n        header(\"Location: ToyCatalog.php\"\
    );\n    }\n    else\n    {\n        header(\"Location: ElectronicsCatalog.php\"\
    );\n    }\n?>\n```\n```\n\nThese statements run a program that displays a toy\
    \ catalog if the customer’s age is less than 13 but run a program that displays\
    \ an electronics catalog if the customer’s age is 13 or older.\n\n# Moving Information\
    \ from Page to Page\n\nHTML pages are independent from one another. When a user\
    \ clicks a link, the Web server sends a new page to the user’s browser, but the\
    \ Web server doesn’t know anything about the previous page. For static HTML pages,\
    \ this process works fine. However, many dynamic applications need information\
    \ to pass from page to page. For instance, you might want to store a user’s name\
    \ and refer to that person by name on another Web page.\n\nDynamic Web applications\
    \ often consist of many pages and expect the user to view several different pages.\
    \ The period beginning when a user views the first page and ending when a user\
    \ leaves the Web site is a *session*. Often you want information to be available\
    \ for a complete session. The following are examples of sessions that necessitate\
    \ sharing information among pages:\n\n+   - **Restricting access to a Web site:**\
    \ Suppose that your Web site is restricted and users log in with a password to\
    \ access the site. You don’t want users to have to log in on every page. You just\
    \ want them to log in once and then be able to see all the pages that they want.\
    \ You want users to bring information with them to each page showing that they\
    \ have logged in and are authorized to view the page. You want users to log in\
    \ and remain logged in for the whole session.\n+   \n+   - **Providing Web pages\
    \ based on browser:** Because browsers interpret some HTML features differently,\
    \ you might want to provide different versions of your Web pages for different\
    \ browsers. You want to check the user’s browser when the user views the first\
    \ page and then deliver all the other pages based on the user’s browser type and\
    \ version."
  merge: -1
  img_proc: true
- pgno: 282
  md: 'With PHP, you can move information from page to page by using any of the following
    methods:


    +   - **Adding information to the URL:** You can add certain information to the
    end of the URL of the new page, and PHP will put the information into built-in
    arrays that you can use in the new page. This method is most appropriate when
    you need to pass only a small amount of information.

    +   - **Storing information via cookies:** You can store *cookies* — small amounts
    of information containing `variable=value` pairs — on the user’s computer. After
    the cookie is stored, you can get it from any Web page. However, users can refuse
    to accept cookies. Therefore, this method only works in environments where you
    know for sure that the user will have cookies turned on.

    +   - **Passing information using HTML forms:** You can pass information to a
    specific program by using a `form` tag. When the user clicks the submit button,
    the information in the form is sent to the next program. This method is very useful
    when you need to collect information from users.

    +   - **Using PHP session functions:** Beginning with PHP 4, PHP functions are
    available that set up a user session and store session information on the server;
    this information can be accessed from any Web page. This method is very useful
    for sessions in which you expect users to view many pages.


    # Adding information to the URL


    A simple way to move information from one page to the next is to add the information
    to the URL. Put the information in the following format:


    ```

    variable=value

    ```


    The *variable* is a variable name, but do not use a dollar sign ($) in it. The
    *value* is the value to be stored in the variable. You can add the `variable=value`
    pairs anywhere that you use a URL. You signal the start of the information with
    a question mark (?). The following statements are all valid ways of passing information
    in the URL:


    ```

    <form action="nextpage.php?state=CA" method="POST">

    ```


    ```

    <a href="nextpage.php?state=CA">go to next page</a>

    ```


    ```

    header("Location: nextpage.php?state=CA");

    ```


    You can add several variable=value pairs, separating them with ampersands (&)
    as follows:


    ```

    <form action="nextpage.php?state=CA&city=home" method="POST">

    ```'
  merge: -1
  img_proc: true
- pgno: 283
  md: "Here are two reasons why you might not want to pass information in the URL:\n\
    \n+   - **Security:** The URL is shown in the address line of the browser, which\
    \ means that the information that you attach to the URL is also shown. If the\
    \ information needs to be secure, you don’t want it shown so publicly. For example,\
    \ if you’re moving a password from one page to the next, you probably don’t want\
    \ to pass it in the URL. Also, the URL can be bookmarked by the user. There may\
    \ be reasons why you don’t want your users to save the information that you add\
    \ to the URL.\n+   - **Length of string:** There is a limit on the length of the\
    \ URL. The limit differs for various browsers and browser versions, but there\
    \ is always a limit. Therefore, if you’re passing a lot of information, there\
    \ may not be room for it in the URL.\n\nAdding information to the URL is very\
    \ useful for quick, simple data transfer. For instance, suppose that you want\
    \ to provide a Web page where users can update their phone numbers. You want the\
    \ form to behave in the following way:\n\n+   1. When the user first displays\
    \ the form, the phone number from the database is shown in the form so that the\
    \ user can see what number is currently stored in the database.\n+   2. When the\
    \ user submits the form, the program checks the phone number to see whether the\
    \ field is blank or whether the field is in a format that could not possibly be\
    \ a phone number.\n+   3. If the phone number checks out okay, the number is stored\
    \ in the database.\n+   4. If the phone number is blank or has bad data, the program\
    \ redisplays the form. However, this time you don’t want to show the data from\
    \ the database. Instead, you want to show the bad data that the user typed and\
    \ submitted in the form field.\n\nThe `displayPhone.php` program in Listing 9-1\
    \ shows how to use the URL to determine whether this is the first showing of the\
    \ form or a later showing. The program shows the phone number for the user’s login\
    \ name and allows the user to change the phone number.\n\n# Listing 9-1: Program\
    \ That Displays Phone Number in Form\n\n```\n```php\n<?php\n/* Program name: displayPhone.php\n\
    \ * Description: Displays a phone number retrieved from the database and\n * \
    \             allows the user to change the phone number.\n */\n?>\n<html>\n<head><title>Display\
    \ phone number</title></head>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 284
