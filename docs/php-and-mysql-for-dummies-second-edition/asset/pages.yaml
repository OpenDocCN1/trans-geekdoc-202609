    # Restoring from a backup copy


    If repairing your data doesn''t return the database to working condition or if
    your database is completely unavailable, such as in the case of a computer failure,
    you can replace your current database table(s) with the database stored in a backup
    copy. The backup copy contains a snapshot of the data as it was when the copy
    was made. Any changes to the database since the backup copy was made are not included;
    you have to re-create those changes manually.'
