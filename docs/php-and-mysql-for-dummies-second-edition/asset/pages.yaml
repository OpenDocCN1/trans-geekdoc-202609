- pgno: 301
  md: '# Chapter 10


    # Putting It All Together


    # In This Chapter


    +   ► Organizing your whole application

    +   ► Organizing individual programs

    +   ► Making your application secure

    +   ► Documenting your application


    The previous chapters of this book provide you with the tools that you need to
    build your Web database application. In Part I, you find out how PHP and MySQL
    work and how to get access to them. In addition, you discover what needs to be
    done to build your application and in what order to do it. In Part II, you find
    out how to build and use a MySQL database. In Part III, you discover what features
    PHP has and how to use them. In addition, this part also explains how to show
    information in a Web page, collect information from users, and store information
    in a database. Now you''re ready to put it all together.


    In this chapter, I show you how to put all the pieces together into a complete
    application. To do this, you need to


    +   ✔ Organize the application

    +   ✔ Make sure that the application is secure

    +   ✔ Document the application


    Here, I describe each of these steps in detail.


    # Organizing the Application


    Organizing the application is for your benefit. As far as PHP is concerned, the
    application could be 8 million PHP statements all on one line of one computer
    file. PHP doesn''t care about lines, indents, or files. However, humans write
    and maintain the programs for the application, and humans need organization. Applications
    require two levels of organization:'
  merge: -1
  img_proc: true
- pgno: 302
  md: '+   - **The application level:** Most applications need more than one program
    to deliver complete functionality. You must divide the functions of the application
    into an organized set of programs.

    +   - **The program level:** Most programs perform more than one specific task.
    You must divide the tasks of the program into sections within the program.


    # Organizing at the application level


    In general, Web database applications consist of one program per Web page. For
    instance, you might have a program that provides a form to collect information
    and a program that stores the information in a database and tells the user that
    the data has been stored.


    Another basis for organization is one program per major task. For instance, you
    might have a program to present the form and a program that stores the data in
    a database. For Web applications, most major tasks involve sending a Web page.
    Collecting data from the user requires a Web page for the HTML (HyperText Markup
    Language) form; providing product information to customers requires Web pages;
    and when you store data in a database, you usually want to send a confirmation
    page to the user that the data was stored.


    One program per Web page or one program per major task is not a rule but merely
    a guideline. The only rule regarding organization is that it must be clear and
    easy to understand. And that’s totally subjective. Still, the organization of
    an application such as the Pet Catalog need not be overly complicated. Suppose
    that the Pet Catalog design calls for the first page to list all the pet types
    — such as cat, dog, and bird — that the user can select from. Then, after the
    user selects a type, all the pets in the catalog for that type are shown on the
    next Web page. A reasonable organization would be two programs: one to show the
    page of pet types and one to show the pets based on the pet type that was chosen.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_302_0.png)


    Here are a few additional pointers for organizing your programs:


    +   - **Choose very descriptive names for the programs in your application.**
    Program names are part of the documentation that makes your application understandable.
    For instance, useful names for the Pet Catalog programs might be `ShowPetTypes.php`
    and `ShowPets.php`. It’s usual, but not a requirement, to begin the program names
    with an uppercase letter. Case isn’t important for program names on Windows computers,
    but it’s very important on Unix/Linux computers. Pay attention to the uppercase
    and lowercase letters so that your programs can run on any computer if needed.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Put program files into subdirectories with meaningful names. For instance,
    put all the graphic files into a directory called `images`. If you only have three
    files, you may be okay with only one directory, but looking through dozens of
    files for one specific file can waste a lot of time.


    # Organizing at the program level


    A well-organized individual program is very important for the following reasons:


    It''s easier for you to write. The better organized your program is, the easier
    it is for you to read and understand it. You can see what the program is doing
    and find and fix problems faster.


    It''s easier for others to understand. Others may need to understand your program.
    After you claim that big inheritance and head off to the South Sea Island that
    you purchased, someone else will have to maintain your application.


    It''s easier for you to maintain. No matter how thoroughly you test it, your application
    is likely to have a problem or two. The better organized your program is, the
    easier it is for you to find and fix problems, especially six months later.


    It''s easier to change. Sooner or later, you or someone else will need to change
    the program. The needs of the user may change. The needs of the business may change.
    The technology may change. The ozone layer may change. For one reason or another,
    the program will need to be changed. Figuring out what the program does and how
    it does it so that you can change it is much easier if it is well organized. I
    guarantee that you won''t remember the details; you just need to be able to understand
    the program.


    The following rules will produce well-organized programs. I hesitate to call them
    rules because there can be reasons in any specific environment to break one or
    more of the rules, but I strongly recommend thinking carefully before breaking
    any of the following rules:


    Divide the statements into sections for each specific task. Start each section
    with a comment describing what the section does. Separate sections from each other
    by adding blank lines. For instance, for the Pet Catalog, the first program might
    have three sections for three tasks:


    +   1. Echo introductory text, such as the page heading and instructions. The
    comment before the section might be `/* opening text */`. If the program echoes
    a lot of complicated text and graphics, you might make it into more than one section,
    such as `/* title and logo */` and `/* instructions */`.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '2. **Get a list of pet types from the database.** If this section is long and
    complicated, you can divide it into smaller sections, such as 1) connect to database;
    2) execute `SELECT` query; and 3) put data into variables.


    3. **Create a form that displays a selection list of the pet types.** Forms are
    often long and complicated. It can be useful to have a section for each part of
    the form.


    ✔ **Use indents.** Indent blocks in the PHP statements. For instance, indent `if`
    blocks and `while` blocks as I have done in the sample code for this book. If
    blocks are nested inside other blocks, indent the nested block even further. It''s
    much easier to see where blocks begin and end when they''re indented, which in
    turn makes it easier to understand what the program does. Indenting the HTML statements
    can also be helpful. For instance, if you indent the lines between the open and
    close tags for a form or between the `<table>` tag and the `</table>` tag, you
    can more easily see what the statements are doing.


    ✔ **Use comments liberally.** Definitely add comments at the beginning that explain
    what the program does. And add comments for each section. Also, comment any statements
    that you think aren''t obvious or statements where you think you may have done
    something in an unusual way. If it took you a while to figure out how to do it,
    it''s probably worth commenting. Don''t forget short comments on the end of lines;
    sometimes just a word or two can help.


    ✔ **Use simple statements.** Sometimes programmers get carried away with the idea
    of concise code to the detriment of readability. Nesting six function calls inside
    each other may save some lines and keystrokes, but it will also make the program
    more difficult to read.


    ✔ **Reuse blocks of statements.** If you find yourself typing the same ten lines
    of PHP statements in several places in the program, you can move that block of
    statements into another file and call it when you need it. One line in your program
    that reads `getData()` is much easier to read than ten lines that get the data.
    Not only that, if you need to change something within those lines, you can change
    it in one external file instead of having to find and change it a dozen different
    places in your program. There are two ways to reuse statements: functions and
    `include` statements. Chapter 7 explains how to write and use functions. The following
    two sections explain the use of functions and `include` statements in program
    organization.


    ✔ **Use constants.** If your program uses the same value many times, such as the
    sales tax for your state, you can define a constant in the beginning of the program
    that creates a constant called `CA_SALES_TAX` that is `.97` and use it whenever
    it''s needed. Defining a constant that gives the number a name helps anyone reading
    the program understand what the number is — plus, if you ever need to change it,
    you only have to change it in one place. Constants are described in detail in
    Chapter 6.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "# Using include statements\n\nPHP allows you to put statements into an external\
    \ file — that is, a file separate from your program — and to insert the file wherever\
    \ you want it in the program by using an include statement. include files are\
    \ very useful for storing a block of statements that is repeated. You add an include\
    \ statement wherever you want to use the statements instead of adding the entire\
    \ block of statements at several different locations. It makes your programs much\
    \ shorter and easier to read. The format for an include statement is\n\n```\n\
    include(\"filename\");\n```\n\nThe file can have any name. I like to use the extension\
    \ .inc. The statements in the file are included, as-is, at the point where the\
    \ include statement is used. The statements are included as HTML, not PHP. Therefore,\
    \ if you want to use PHP statements in your include file, you must include PHP\
    \ tags in the include file. Otherwise, all the statements in the include file\
    \ are seen as HTML and output to the Web page as-is.\n\nHere are some ways to\
    \ use include files to organize your programs:\n\n+   ✔ **Put all or most of your\
    \ HTML into include files.** For instance, if your program sends a form to the\
    \ browser, put the HTML for the form into an external file. When you need to send\
    \ the form, use an include statement. Putting the HTML into an include file is\
    \ a good idea if the form is shown several times. It is even a good idea if the\
    \ form is shown only once because it makes your program much easier to read. The\
    \ programs in Chapters 11 and 12 put HTML code for forms into separate files and\
    \ include the files when the forms are displayed.\n+   \n+   ✔ **Store the information\
    \ needed to access the database in a file separate from your program.** Store\
    \ the variable names in the file as follows:\n\n```\n<?php\n$host=\"localhost\"\
    ;\n$user=\"root\";\n$password=\"\";\n?>\n```\n\nNotice that this file needs the\
    \ php tags in it because the include statement inserts the file as HTML. Include\
    \ this file at the top of every program that needs to connect to the database.\
    \ If any of the information (such as the password) changes, just change the password\
    \ in the include file. You don't need to search through every program file to\
    \ change the password. For a little added security, it's a good idea to use a\
    \ misleading filename, rather than something obvious like secret_passwords.inc."
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Put your functions in include files.


    You don''t need the statements for functions in the program; you can put them
    in an include file. If you have a lot of functions, organize related functions
    into several include files, such as data_functions.inc and form_functions.inc.
    Use include statements at the top of your programs, reading in the functions that
    are used in the program.


    # Store statements that all the files on your Web site have in common.


    Most Web sites have many Web pages with many elements in common. For instance,
    all Web pages start with <html>, <head>, and <body> tags. If you store the common
    statements in an include file, you can include them in every Web page, ensuring
    that all your pages look alike. For instance, you might have the following statements
    in an include file:


    ```

    <html>

    <head><title><?php echo $title ?></title></head>

    <body topmargin="0">

    <p align="center"><img src="logo.gif" width="100" height="200">

    <hr color="red">

    ```


    If you include this file in the top of every program on your Web site, you save
    a lot of typing, and you know that all your pages match. In addition, if you want
    to change anything about the look of all your pages, you only have to change it
    one place — in the include file.


    You can use a similar statement as follows:


    ```

    include_once("filename");

    ```


    This statement prevents include files with similar variables from overwriting
    each other. Use include_once when you include your functions.


    You can use a variable name for the filename as follows:


    ```

    include("$filename");

    ```


    For example, you might want to display different messages on different days. You
    might store these messages in files that are named for the day on which the message
    should display. For instance, you could have a file named Sun.inc with the following
    contents:


    ```

    <p>Go ahead. Sleep in. No work today.</p>

    ```


    And similar files for all days of the week. The following statements can be used
    to display the correct message for the current day:


    ```

    $today = date("D");

    include("$today".".inc");

    ```'
  merge: -1
  img_proc: true
