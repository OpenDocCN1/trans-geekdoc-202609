- pgno: 207
  md: "```\n$total = 4\n$total = 3\n$total = 2\n```\n\n# Getting a value from a function\n\
    \nWhen you call a function, you can pass values as described above. The function\
    \ can also pass a value back to the program that called it. Use the return statement\
    \ to pass a value back to the calling program. The program can store the value\
    \ in a variable or use the value directly, such as using it in a conditional statement.\
    \ The return statement also returns control to the main program; that is, it stops\
    \ the function.\n\nThe general format of the return statement is\n\n```\nreturn\
    \ value;\n```\n\nFor instance, in the tax program from the preceding section,\
    \ I echo the sales tax by using the following statements:\n\n```\n$salestax =\
    \ $amount * $salestaxrate;\necho \"$salestax<br>\";\n```\n\nI could return the\
    \ sales tax to the main program, rather than echoing it, by using the following\
    \ statement:\n\n```\n$salestax = $amount * $salestaxrate;\nreturn $salestax;\n\
    ```\n\nIn fact, I could use a shortcut and send it back to the main program with\
    \ one statement:\n\n```\nreturn $amount * $salestaxrate;\n```\n\nThe return statement\
    \ sends the salestax back to the main program and ends the function. The main\
    \ program can use the value in any of the usual ways. The following statements\
    \ use the function call in valid ways:\n\n```\n$salestax = compute_salestax($cost,$custState);\n\
    ```\n\n```\n$totalcost = $cost + compute_salestax($cost,$custState);\n```\n\n\
    ```\nif ( compute_salestax($cost,$custState) > 100000.00 )\n    $echo \"Thank\
    \ you very, very, very much<br>\";\n```\n\n```\nforeach($customerOrder as $amount)\n\
    {\n    $total = $amount + compute_salestax($amount,$custState);\n    echo \"Your\
    \ total is $total<br>\";\n}\n```"
  merge: -1
