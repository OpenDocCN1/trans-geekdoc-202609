- pgno: 161
  md: "To use `ereg` to check the name that a user typed in a form, compare the name\
    \ to a pattern as follows:\n\n```\nereg(\"^[A-Za-z' -]+$\",$name)\n```\n\nThe\
    \ pattern in this statement does the following:\n\n+   - Uses ^ and $ to signify\
    \ the beginning and end of the string. That means that all the characters in the\
    \ string must match the pattern.\n+   - Encloses all the literal characters that\
    \ are allowed in the string in [ ]. No other characters are allowed. The allowed\
    \ characters are uppercase and lowercase letters, an apostrophe ('), a blank space,\
    \ and a hyphen (-).\n+   \n+     You can specify a range of characters using a\
    \ hyphen within the [ ]. When you do that, as in A-Z above, the hyphen does not\
    \ represent a literal character. Because you want the hyphen included as a literal\
    \ character that is allowed in your string, you need to add a hyphen that is not\
    \ between any two other characters. In this case, the hyphen is included at the\
    \ end of the list of literal characters.\n+   - Follows the list of literal characters\
    \ in the [ ] with a +. The plus sign means that the string can contain any number\
    \ of the characters inside the [ ] but must contain at least one character.\n\n\
    # Joining Comparisons with and/or/xor\n\nSometimes one comparison is sufficient\
    \ to check for a condition, but often, you need to ask more than one question.\
    \ For instance, suppose that your company offers catalogs for different products\
    \ in different languages. You need to know which product the customer wants to\
    \ see and which language he or she needs to see it in. This is the general format\
    \ for a series of comparisons:\n\n```\ncomparison and|or|xor comparison and|or|xor\
    \ comparison and|or|xor ...\n```\n\nComparisons are connected by one of the three\
    \ following words:\n\n+   - **and:** Both comparisons are true.\n+   - **or:**\
    \ One of the comparisons or both of the comparisons are true.\n+   - **xor:**\
    \ One of the comparisons is true but not both of the comparisons.\n\nTable 6-5\
    \ shows some examples of multiple comparisons."
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Table 6-5 Multiple Comparisons


    | Condition | Is True If |

    |---|---|

    | $customer == "Smith" or $customer == "Jones" | The customer is named either
    Smith or Jones. |

    | $customer == "Smith" and $custState =="OR" | The customer is named Smith, and
    the customer lives in Oregon. |

    | $customer == "Smith" or $custState == "OR" | The customer is named Smith, or
    the customer lives in Oregon or both. |

    | $customer == "Smith" xor $custState == "OR" | The customer is named Smith, or
    the customer lives in Oregon — but not both. |

    | $customer != "Smith" and $custAge < 13 | The customer is named anything except
    Smith and is under 13 years of age. |


    You can string together as many comparisons as necessary. The comparisons that
    use and are tested first, the comparisons that use xor are tested next, and the
    comparisons that use or are tested last. For instance, the following is a condition
    that includes three comparisons:


    ```

    $age == 200 or $age == 300 and $name == "Goliath"

    ```


    If the customer''s name is Goliath and he is 300 years old, this statement is
    true. The statement is also true if the customer is 200 years old, regardless
    of what his name is. This condition is not true if the customer is 300 years old,
    but his name is not Goliath. You get these results because the program checks
    the condition as follows:


    +   1. **The and is compared.** The program checks $age to see whether it equals
    300, and it checks $name to see whether it equals Goliath. If both match, the
    condition is true, and the program does not need to check or. If only one or neither
    of the variables equal the designated value, the testing continues.

    +   2. **The or is compared.** The program checks $age to see whether it equals
    200. If it does, the condition is true. If it does not, the condition is false.


    You can change the order in which comparisons are made by using parentheses. The
    word inside the parentheses is evaluated first. For instance, you can rewrite
    the previous statement with parentheses as follows:


    ```

    ( $age == 200 or $age == 300 ) and $name == "Goliath"

    ```'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The parentheses change the order in which the conditions are checked. Now the
    or is checked first. This condition is true if the customer’s name is Goliath
    and he is either 200 or 300 years old. You get these results because the program
    checks the condition as follows:


    +   1. **The or is compared.** The program checks `$age` to see whether it equals
    either 200 or 300. If it does, this part of the condition is true. However, the
    comparison on the other side of the `and` must also be true, so the testing continues.

    +   2. **The and is compared.** The program checks `$name` to see whether it equals
    Goliath. If it does, the condition is true. If it does not, the condition is false.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_163_0.png)


    Use parentheses liberally, even when you believe that you know the order of the
    comparisons. Unnecessary parentheses can’t hurt, but comparisons that have unexpected
    results can.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_163_1.png)


    If you are familiar with other languages, such as C, you may have used || (for
    or) and && (for and) in place of the words. The || and && work in PHP as well.
    The statement `$a < $b && $c > $b` is just as valid as the statement `$a < $b
    and $c > $b`. The || is checked before the word or, and the && is checked before
    the word and.


    # Adding Comments to Your Program


    *Comments* are notes that are embedded in the program itself. Adding comments
    in your programs that describe their purpose and what they do is essential. It’s
    important for the lottery factor, that is, if you win the lottery and run off
    to a life of luxury on the French Riviera, someone else will have to finish the
    application. The new person needs to know what your program is supposed to do
    and how it does it. Actually, comments benefit you as well. You might need to
    revise the program next year when the details are long buried in your mind under
    more recent projects.


    Use comments liberally. PHP ignores comments; comments are for humans. You can
    embed comments in your program anywhere as long as you tell PHP that they are
    comments. The format for comments is


    ```

    /* comment text

    more comment text */

    ```


    Your comments can be as long or as short as you need. When PHP sees code that
    indicates the start of a comment (/*), it ignores everything until it sees the
    code that indicates the end of a comment (*/).'
  merge: -1
  img_proc: true
- pgno: 164
  md: "The following is one possible format for comments at the beginning of each\
    \ program:\n\n```\n/*  name:          catalog.php\n    description:  Program that\
    \ displays descriptions of\n                  products. The descriptions are stored\n\
    \                  in a database. The product descriptions\n                 \
    \ are selected from the database based on\n                  the category the\
    \ user entered into a form.\n    written by:   Lola Designer\n    created:   \
    \   2/1/02\n    modified:     3/15/02\n*/\n```\n\nYou should use comments throughout\
    \ the program to describe what the program does. Comments are particularly important\
    \ when the program statements are complicated. Use comments such as the following\
    \ frequently:\n\n```\n/* Get the information from the database */\n/* Check whether\
    \ the customer is over 18 years old */\n/* Add shipping charges to the order total\
    \ */\n```\n\nPHP also has a short comment format. You can specify that a single\
    \ line is a comment by using the pound sign (#) or two forward slashes (//) in\
    \ the following manner:\n\n```\n# This is comment line 1\n// This is comment line\
    \ 2\n```\n\nYou can also use # or // in the middle of a line to signal the beginning\
    \ of a comment. PHP will ignore everything from the # or // to the end of the\
    \ line. This is useful for commenting a particular statement, as in the following\
    \ example:\n\n```\n$average = $orderTotal/$nItems  // compute average price\n\
    ```\n\nSometimes you really want to emphasize a comment. The following format\
    \ makes a comment very noticeable:\n\n```\n###################################\n\
    ## Double-Check This Section   ##\n###################################\n```\n\n\
    PHP comments are not included in the HTML code that is sent to the user's browser.\
    \ The user does not see these comments.\n\nUse comments as often as necessary\
    \ in the script to make it clear. However, using too many comments is a mistake.\
    \ Don't comment every line or everything that you do in the script. If your script\
    \ is too full of comments, the really important comments can get lost in the maze.\
    \ Only use comments to label sections and to explain code that is unusual or complicated\
    \ — not code that is obvious."
