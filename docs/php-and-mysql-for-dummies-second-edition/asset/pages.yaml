  md: '> to one record for each member. This would answer the question, “Has the member
    ever logged in?” rather than the question “How many times has the member logged
    in?”


    The WHERE clause of the SELECT query enables you to make very complicated selections.
    For instance, suppose your boss asks for a list of all the members whose last
    names begin with B, who live in Santa Barbara, and who have an 8 in either their
    phone or fax number. I''m sure there are many uses for such a list. You can get
    this list for your boss with a SELECT query by using a WHERE clause.


    The basic format of the WHERE clause is


    ```

    WHERE expression AND|OR expression AND|OR expression ...

    ```


    expression specifies a value to compare with the values stored in the database.
    Only the rows containing a match for the expression are selected. You can use
    as many expressions as needed, each one separated by AND or OR. When you use AND,
    both of the expressions connected by the AND (that is, both the expression before
    the AND and the expression after the AND) must be true in order for the row to
    be selected. When you use OR, only one of the expressions connected by the OR
    must be true for the row to be selected.


    Some common expressions are shown in Table 4-3.


    Table 4-3 Expressions for the WHERE Clause


    | Expression | Example | Result |

    |---|---|---|

    | column = value | zip="12345" | Selects only the rows where 12345 is stored in
    the column named zip |

    | column > value | zip > "50000" | Selects only the rows where the ZIP code is
    50001 or higher |

    | column >= value | zip >= "50000" | Selects only the rows where the ZIP code
    is 50000 or higher |

    | column < value | zip < "50000" | Selects only the rows where the ZIP code is
    49999 or lower |

    | column <= value | zip <= "50000" | Selects only the rows where the ZIP code
    is 50000 or lower |'
