    +   3. **Scroll down the screen until you come to the Linux x86 RPM Downloads
    heading.**

    +      This section lists several downloads for Linux.

    +   4. **Click the download link for the standard server.** This should be the
    first entry.

    +      A dialog box opens.

    +   5. **Select the option to save the file.**

    +      A box opens that lets you select where you want to save the file.

    +   6. **Navigate to where you want to save the RPM (for example, /usr/src/mysql).
    Then click Save.**

    +   7. **Repeat Steps 5–7 to download the RPM file for Client Programs into the
    same download location.**

    +   8. **Change to the directory where you saved the download.**

    +      For instance, type cd /usr/src/mysql. You see two files in the directory
