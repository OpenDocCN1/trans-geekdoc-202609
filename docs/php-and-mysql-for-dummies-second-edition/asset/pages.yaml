- pgno: 208
  md: "A `return` statement can return only one value. However, the value returned\
    \ can be an array, so you can actually return many values from a function.\n\n\
    You can use `return` statements in a conditional statement to return different\
    \ values for different conditions. For example, the following function returns\
    \ one of two different strings:\n\n```\n```php\nfunction compare_values($value1,$value2)\n\
    {\n    if($value1 < $value2)\n    {\n        return \"less than\";\n    }\n  \
    \  else\n    {\n        return \"not less than\";\n    }\n}\n```\n```\n\nAlthough\
    \ the function contains two return statements, only one is going to be executed,\
    \ depending on the values in `$value1` and `$value2`.\n\n# Using built-in functions\n\
    \nPHP’s many built-in functions are one reason why PHP is so powerful and useful\
    \ for Web pages. The functions included with PHP are normal functions. They are\
    \ no different than functions that you create yourself. It’s just that PHP has\
    \ already done all the work for you.\n\nI discuss some of the built-in functions\
    \ in this chapter and the earlier chapters. For example, see Chapter 6 for more\
    \ on the functions `unset` and `number_format`. Some very useful functions for\
    \ interacting with your MySQL database are discussed in Chapter 8. Other useful\
    \ functions are listed in Part V of this book. And, of course, all the functions\
    \ are listed and described in the PHP documentation on the PHP Web site at `www.php.net/docs.php`."
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Chapter 8


    # Data In, Data Out


    # In This Chapter


    +   ► Connecting to the database

    +   ► Getting information from the database

    +   ► Using HTML forms with PHP

    +   ► Getting data from an HTML form

    +   ► Processing the information that users type into HTML forms

    +   ► Storing data in the database

    +   ► Using functions to move data in and out of the database


    PHP and MySQL work very well together. This dynamic partnership is what makes
    PHP and MySQL so attractive for Web database application development. Whether
    you have a database full of information that you want to make available to users
    (such as a product catalog) or a database waiting to be filled up by users (for
    example, a membership database), PHP and MySQL work together to implement your
    application.


    One of PHP''s strongest features is its ability to interact with databases. It
    provides functions that make communicating with MySQL extremely simple. You use
    PHP functions to send SQL queries to the database. You don''t need to know the
    details of communicating with MySQL; PHP handles the details. You only need to
    know the SQL queries and how to use the PHP functions.


    In previous chapters of this book, I describe the tools that you use to build
    your Web database application. You find out how to build SQL queries in Chapter
    4 and how to construct and use the building blocks of the PHP language in Chapters
    6 and 7. In this chapter, you find out how to use these tools for the specific
    tasks that a Web database application needs to perform.


    # PHP/MySQL Functions


    You use built-in PHP functions to interact with MySQL. These functions connect
    to the MySQL server, select the correct database, send SQL queries, and perform
    other communication with MySQL databases. You don''t need to'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'know the details of interacting with the database because PHP handles all the
    details. You only need to know how to use the functions.


    At the present time, PHP (beginning with version 5) has two sets of functions
    for interacting with MySQL. One set of functions is used to interact with MySQL
    version 4.0 or earlier. The other set of functions is used to interact with MySQL
    version 4.1 or later.


    Throughout the book, my examples and programs show the functions that work with
    MySQL version 4.0. At the time of this writing, the current stable version of
    MySQL is version 4.0. In addition, the PHP functions for use with MySQL version
    4.1 are described in the documentation on the PHP Web site as experimental, with
    a warning: Use this extension at your own risk. At the present time, MySQL version
    4.1 is available only as alpha software, defined in the MySQL manual as follows:
    The release contains some large section of new code that hasn''t been 100% tested.
    Therefore, I am writing this book based on the use of MySQL 4.0 and the PHP functions
    that work with this version.


    The PHP functions for use with MySQL 4.0 have the following general format:


    ```

    mysql_function(value,value,...);

    ```


    The second part of the function name is specific to the function, usually a word
    that describes what the function does. In addition, the function requires one
    or more values to be passed, specifying things such as the database connection,
    the data location, and so on. The following are two of the functions that are
    discussed in this chapter:


    ```

    mysql_connect($connect);

    mysql_query("SQL statement",$connect);

    ```


    By the time you read this book, MySQL 4.1 might be the current stable version
    of MySQL. If so, you can use MySQL 4.1 and the functions that work with it. As
    of this writing, the functions discussed in this book are the same for MySQL 4.0
    and MySQL 4.1 except for a change in name. The names of the functions for use
    with MySQL 4.1 begin with mysqli_ rather than mysql_. Thus, the functions shown
    above would have the following names if used with MySQL 4.1:


    ```

    mysqli_connect($connect);

    mysqli_query($connect,"SQL statement");

    ```


    The functionality and syntax of the functions are the same or very similar. For
    instance, notice the difference between the two following functions:


    ```

    mysql_query($sql,$connect)

    mysqli_query($connect,$sql)

    ```


    Notice that the order of the items passed is different. This is true for several
    functions.'
  merge: -1
  img_proc: true
- pgno: 211
  md: "This discussion refers to the mysqli functions as they are now. The mysqli\
    \ functions can change, of course. If one of the mysqli functions doesn't seem\
    \ to work as it should, check the manual for any possible differences in usage.\n\
    \nThe i added to the name stands for *improved*; this set of MySQL functions is\
    \ provided by the improved MySQL extension. At this time, support for mysqli is\
    \ not included with PHP by default. It must be enabled when PHP is installed.\
    \ However, by the time MySQL 4.1 is the stable release, it's likely that mysqli\
    \ will be part of PHP without your needing to enable it specifically. To see the\
    \ current status of mysqli, check the documentation at www.php.net/manual/en/ref.mysqli.php.\n\
    \nAs of this writing, you can use this installation option to enable mysqli:\n\
    \n```\n--with-mysqli=DIR\n```\n\nDIR is the path to the directory where a program\
    \ called mysql_config, which was installed when MySQL 4.1 was installed, is located.\n\
    \n# Making a Connection\n\nBefore you can store or get any data, you must connect\
    \ to the database. The database might be on the same computer with your PHP programs\
    \ or on a different computer. You don't need to know the details of connecting\
    \ to the database because PHP handles all the details. All you need to know is\
    \ the name and location of the database. Think of a database connection in the\
    \ same way that you'd think of a telephone connection. You don't need to know\
    \ how your words move between telephones. You only need to know the area code\
    \ and phone number. The phone company handles the details.\n\nAfter connecting\
    \ to the database, you send SQL queries to the MySQL database by using a PHP function\
    \ designed specifically for this purpose. You can send as many queries as you\
    \ need. The connection remains open until you specifically close it or the program\
    \ ends. Similarly, in a telephone conversation, the connection stays open until\
    \ you terminate it by hanging up.\n\n# Connecting to the MySQL server\n\nThe first\
    \ step in communicating with your MySQL database is connecting to the MySQL server.\
    \ To connect to the server, you need to know the name of the computer where the\
    \ database is located, the name of your MySQL account, and the password to your\
    \ MySQL account. To open the connection, use the mysql_connect function as follows:\n\
    \n```\n$connection=mysqli_connect(\"addr\",\"mysqlacctname\",\"password\")\n \
    \   or die (\"message\");\n```"
  merge: -1
  img_proc: true
- pgno: 212
  md: "# # Handling MySQL errors\n\nYou use the `mysql` functions of the PHP language,\
    \ such as `mysql_connect` and `mysql_query`, to interact with the MySQL database.\
    \ If one of these functions fails to execute correctly, a MySQL error message\
    \ is returned with information about the problem. However, this error message\
    \ isn’t sent to the browser unless the program deliberately sends it. Here are\
    \ the three usual ways to call the `mysql` functions:\n\n+   - **Calling the function\
    \ without error handling.** The function is called without any statements that\
    \ provide error messages. For instance, the `mysql_connect` function can be called\
    \ as follows:\n\n```\n```php\n$connection = mysql_connect($host,$user,$password);\n\
    ```\n```\n\nIf this statement fails (for instance, the account is not valid),\
    \ the connection is not made, but the remaining statements in the program continue\
    \ to execute. In most cases, this isn’t useful because some of the statements\
    \ in the rest of the program might depend on having an open connection, such as\
    \ getting or storing data in the database.\n\n+   - **Calling the function with\
    \ a `die` statement.** The function is called with a `die` statement that sends\
    \ a message to the browser. For instance, the `mysql_connect` function can be\
    \ called as follows:\n\n```\n```php\n$connection = mysql_connect($host,$user,$password)\n\
    \    or die (\"Couldn't connect to server\");\n```\n```\n\nIf this statement fails,\
    \ the connection is not made, and the `die` statement is executed. The `die` statement\
    \ stops the program and sends the message to the browser. If the connection can’t\
    \ be established, no more statements are executed. You can put any message that\
    \ you want in the `die` statement.\n\n+   - **Calling the function in an `if`\
    \ statement.** The function is called by using an `if` statement that executes\
    \ a block of statements if the connection fails. For instance, the `mysql_connect`\
    \ function can be called as follows:\n\n```\n```php\nif (!$connection = mysql_connect($host,$user,$password))\n\
    {\n    $message = mysql_error();\n    echo \"$message<br>\";\n    die();\n}\n\
    ```\n```\n\nIf this statement fails, the statements in the `if` block are executed.\
    \ The `mysql_error` function returns the MySQL error message and saves it in the\
    \ variable `$message`. The error message is then echoed. The `die` statement ends\
    \ the program so that no more statements are executed. **Notice** the `!` (exclamation\
    \ point) in the `if` statement. `!` means \"not\". In other words, the `if` statement\
    \ is true if the assignment statement is not true.\n\nWhat error handling you\
    \ want to include in your program depends on what you expect to happen in the\
    \ program. When you’re developing the program, you expect some errors to happen.\
    \ Therefore, during development, you probably want error handling that is more\
    \ descriptive, such as the third"
  merge: -1
  img_proc: true
- pgno: 213
  md: "method in the preceding list. For instance, suppose that you're using an account\
    \ called root to access your database and that you make a typo as in the following\
    \ statements:\n\n```\n$host = \"localhost\";\n$user = \"rot\";\n$password = \"\
    \";\nif (!$connection = mysql_connect($host,$user,$password))\n{\n    $message\
    \ = mysql_error();\n    echo \"$message<br>\";\n    die();\n}\n```\n\nBecause\
    \ you typed \"rot\" instead of \"root\", you would see an error message similar\
    \ to the following one:\n\n```\nAccess denied for user: 'rot@localhost' (Using\
    \ password: NO)\n```\n\nThis error message has the information that you need to\
    \ figure out what the problem is; it shows your account name with the typo. However,\
    \ after your program is running and customers are using it, you probably don't\
    \ want your users to see a technical error message like the preceding one. Instead,\
    \ you probably want to use the second method with a general statement in the die\
    \ message, such as The Pet Catalog is not available at the moment. Please try\
    \ again later.\n\nFill in the following information:\n\n+   - **addr:** The name\
    \ of the computer where MySQL is installed — for example, databasehost.mycompany.com.\
    \ If the MySQL database is on the same computer as your Web site, you can use\
    \ localhost as the computer name. If this information is blank (\"\"), PHP assumes\
    \ localhost.\n+   - **mysqlacctname:** The name of your MySQL account. (I discuss\
    \ MySQL accounts in detail in Chapter 5.) You can leave this information blank\
    \ (\"\") — meaning that any account can connect — but this is usually a bad idea\
    \ for security reasons.\n+   - **password:** The password for your MySQL account.\
    \ If your MySQL account does not require a password, don't type anything between\
    \ the quotes: \"\".\n+   - **message:** The message that is sent to the browser\
    \ if the connection fails. The connection fails if the computer or network is\
    \ down or if the MySQL server isn't running. It also can fail if the information\
    \ provided isn't correct — for example, if there's a typo in the password.\n+\
    \   \n+   You might want to use a descriptive message during development, such\
    \ as Couldn't connect to server, but use a more general message suitable for customers\
    \ after the application is in use, such as The Pet Catalog is not available at\
    \ the moment. Please try again later.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_213_0.png)"
  merge: -1
