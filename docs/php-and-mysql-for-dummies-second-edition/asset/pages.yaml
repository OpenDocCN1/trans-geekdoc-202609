    ;\necho \"<table cellspacing='15'>\";\necho \"<tr><td colspan='4'><hr></td></tr>\"\
    ;\nfor ($i=1;$i<=sizeof($petInfo);$i++)\n{\n    $f_price = number_format($petInfo[$i]['price'],2);\n\
