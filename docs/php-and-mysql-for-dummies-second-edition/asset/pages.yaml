- pgno: 62
  md: '# # Leaving room for expansion


    One certainty about your Web application is that it will change over time. Down
    the line, you might think of new functions for it or just simply want to change
    something about it. Or maybe Web site software improves so that your Web application
    can do things that it couldn’t do when you first put it up. Whatever the reason,
    your Web site will change. When you plan your application, you need to keep future
    changes in mind.


    You can design your application in steps, taking planned change into account.
    You can develop a plan in which you build an application today that meets your
    most immediate needs and make it available as soon as it’s ready. Your plan can
    include adding functions to the application as quickly as you can develop them.
    For example, you can build a product catalog and publish it on your Web site as
    soon as it’s ready. You can then begin work on an online ordering function for
    the Web site, which you will add when it’s ready.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_62_0.png)


    You can’t necessarily foresee all the functions that you might want in your application
    in the future. For instance, you might design your travel Web site with sections
    for all possible destinations today, but the future could surprise you. Trips
    to Mars? Alpha Centauri? An alternate universe? Plan your application with the
    flexibility needed to add functionality in the future.


    # # Writing it down


    Write your plan down. You will hear this often from me. I speak from the painful
    experience of not writing it down. When you develop your plan, it’s foremost in
    your mind and perfectly clear. But in a few short weeks, you will be astonished
    to discover that it has gone absolutely hazy while your attention was on other
    pressing issues. Or you want to make some changes in the application a year from
    now and won’t remember exactly how the application was designed. Or you’re working
    with a partner to develop an application and you discover that your partner misunderstood
    your verbal explanation and developed functions for the application that don’t
    fit in your plan. You can avoid these types of problems by writing everything
    down.


    # # Presenting the Two Running Examples in This Book


    In the next two sections, I introduce the two example Web database applications
    that I created for this book. I refer to these examples throughout the book to
    demonstrate aspects of application design and development.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# # Stuff for Sale


    The first example is an online product catalog. You’re the owner of a pet store,
    and you want your catalog to provide customers with information about the pets
    that are for sale. Selling the pets online is not feasible although you’re toying
    with the idea of allowing customers to “reserve” pets online—that is, before they
    come into the store to purchase them. Currently, the application is simply an
    online catalog. Customers can look through the catalog online and then come into
    the store to buy the pet. The information about all the pets is stored in a database,
    and customers can search the database for information on specific pets or types
    of pets.


    Here is your plan for this application:


    +   - ✓ **Allow customers to select which pet they want to see information about.**

    +     Offer two selection methods:

    +     - **Selecting from a list of links:** Display a list of links that are pet
    categories (for example, dog, cat, dinosaur, and so on). When the customer clicks
    a category link, a list of pets is displayed. Each pet in the list is a link to
    a description of the pet.

    +     - **Typing in search terms:** Display a search form in which customers can
    type words that describe the type of pet they’re looking for. The application
    searches the database for matching words and displays the pet information for
    any pets that match the search words. For example, a customer can type **cat**
    to see a list of all available cats. Each cat in the list is a link to a description
    of that cat.

    +   - ✓ **Display a description of the pet when the customer clicks the link.**

    +     The description is stored in a database.


    # # Members Only


    The second example Web database application is related to the preceding pet store
    example. In addition to the online catalog, you also want to put up a section
    on your pet store Web site for members only. In order to access this area of the
    site, customers have to register—providing their names and addresses. In this
    Members Only section, customers can order pet food at a discount, find out about
    pets that are on order but haven’t arrived yet, and also gain access to articles
    with news and information about pets and pet care.'
  merge: -1
  img_proc: true
