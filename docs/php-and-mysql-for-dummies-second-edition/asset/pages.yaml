  md: 'Notice the following in the program in Listing 8-7:


    +   - **The form statement transfers the action to the program** processAddress.php.
    This program processes the information in the form and updates the database with
    any information that the user changed. This is a program that you write yourself.
    Checking data in a form and saving information in the database are discussed later
    in this chapter in the sections “Checking the information” and “Putting Information
    into a Database”.

    +   - **Each input field in the form is given a name.** The information in the
    input field is stored in a variable that has the same name as the input field.

    +   - **The program gives the field names in the form the same names as the columns
    in the database.** This simplifies moving information between the database and
    the form, requiring no transfer of information from one variable to another.

    +   - **The values from the database are displayed in the form fields with the
    value parameter in the input field statement.** The value parameter displays the
    appropriate value from the array $row, which contains data from the database.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_237_0.png)


    For security reasons, always include maxlength in your HTML statement. maxlength
    defines the number of characters that a user is allowed to type into the field.
    If the information is going to be stored in a database, set maxlength to the same
    number as the width of the column in the database table.


    Figure 8-6 shows the Web page resulting from the program in Listing 8-7. The information
    in the form is the information that is stored in the database.


    # Building selection lists


    One type of field that you can use in an HTML form is a selection list. Instead
    of typing into a field, your users select from a list. For instance, in a product
    catalog, you might provide a list of categories from which users select what they
    want to view. Or the form for users’ addresses might include a list of states
    that users can select. Or users might enter a date by selecting a month, day,
    and year from a list.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_237_1.png)


    Use selection lists whenever feasible. When the user selects an item from a list,
    you can be sure that the item is accurate, with no misspelling, odd characters,
    or other problems introduced by users’ typing errors.


    An HTML selection list for the categories in the Pet Catalog is formatted as follows:'
