- pgno: 399
  md: '# Appendix A


    # Installing MySQL


    Although MySQL runs on many platforms, I describe how to install it on Linux,
    Unix, Windows, and Mac, which together account for the majority of Web sites on
    the Internet. Be sure to read the instructions all the way through before beginning
    the installation.


    MySQL can be installed most easily from binaries — precompiled, ready-to-install
    packages. Binaries are available for most operating systems: Linux, Windows, Mac,
    FreeBSD, many flavors of Unix, and others. If such a package is available for
    your operating system, use it. Only install MySQL from source if it’s totally
    necessary, such as when there’s no binary for your operating system or you need
    some functionality that’s not compiled into the binaries (for example, a different
    character set).


    If you have trouble starting the MySQL server after installing it, check the error
    log for useful information. The error log is located in the data directory and
    has the extension .err.


    # On Windows


    In most cases, when you download and install MySQL, the server is started automatically.
    If it isn’t or if you need to stop and start it for another reason, you can start
    it manually using the WinMySQLadmin utility that is installed with MySQL, as I
    describe in the upcoming section, “Starting the MySQL server.” You can also use
    WinMySQLadmin to set up MySQL so that it starts every time your computer starts.'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# Downloading and installing MySQL


    To install MySQL on Windows, follow these steps:


    +   1. **Point your Web browser to www.mysql.com, the MySQL home page.**

    +   2. **Click the Production version number link.**

    +      Look for the section under the heading Database Server. As of this writing,
    the production release is 4.0.17.

    +      MySQL 4.0.x is supported by PHP 4 or 5. Support for MySQL 4.1.x is provided
    beginning with PHP 5.

    +   3. **Scroll down the screen until you come to the Windows Downloads heading.**

    +   4. **Click the download link for the Windows binary labeled Windows 95/98/NT/2000/XP/2003.**
    This binary includes an installer.

    +      A dialog box opens.

    +   5. **Select the option to save the file.**

    +      A dialog box opens that lets you select where you want the file saved.

    +   6. **Navigate to where you want to save the file (for example, c:\downloads).
    Then click Save.**

    +      After the download, you see a Zip file in the download location (for example,
    c:\downloads) containing the MySQL files. The file is named mysql-, followed by
    the version number and -win.zip — for instance, mysql-4.0.17-win.zip.

    +   7. **Use your favorite Zip utility to unzip the files and save them in a temporary
    location (for example, c:\downloads\mysql).**

    +      Two popular Zip utilities are PKZIP at www.pkware.com and WinZip at www.winzip.com.

    +   8. **Navigate to the temporary directory where the unzipped files are stored.
    Then double-click setup.exe.**

    +      *Note:* If you’re installing from a Windows NT/2000/XP system, be sure
    that you’re logged into an account with administrative privileges.

    +      The opening screen shown in Figure A-1 is displayed.

    +   9. **Click Next.**

    +      The license is displayed.

    +   10. **Click the I Agree button to continue.**

    +       You see a screen showing the directory where MySQL will be installed.'
  merge: -1
  img_proc: true
- pgno: 401
  md: "![](img/d82df0828cfbc6d6be1e9a991861f3b7_401_0.png)\n\n**Figure A-1:**  \n\
    The opening screen of the MySQL setup program.\n\n+   11. If you want to install\
    \ MySQL in the default directory, `C:\\mysql`, click Next. If you want to install\
    \ MySQL in a different directory, click Browse, select a directory, and click\
    \ OK; then click Next.\n\nYou see a screen in which you can choose the type of\
    \ installation.\n\n+   12. Select Typical and then click Next.\n\nThe installation\
    \ of MySQL begins. A message appears when the installation is complete.\n\nThe\
    \ server might or might not have been started during installation. If it is running,\
    \ you should see a traffic signal in your system tray (bottom of your screen)\
    \ with a green light showing. If it isn’t running, check out the next section.\n\
    \n# Starting the MySQL server\n\nYou can start and stop your server manually,\
    \ although you’re more likely to want the MySQL server to be running whenever\
    \ your computer is running. To see how to set up MySQL so that it starts when\
    \ the computer boots up, see the next section."
