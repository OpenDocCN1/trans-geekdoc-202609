  md: 'tank full of goldfish and point at one. The only real distinguishing characteristic
    of a goldfish is its color. The customer doesn’t need to see a picture of the
    actual fish in your catalog, just a picture of a generic goldfish, perhaps showing
    the possible colors.


    In your catalog, you have both kinds of pets. The catalog might contain several
    pets with the name cat but with different petIDs. The picture would show the individual
    pet. The catalog also contains pets that aren’t individuals but that represent
    generic pets, such as goldfish. In this case, there’s only one entry with the
    name goldfish, with a single petID.


    I’ve used both kinds of pets in this catalog to demonstrate the different kinds
    of products that you might want to include in a catalog. The unique item catalog
    might include such products as artwork or vanity license plates. When the unique
    item is sold, it’s removed from the catalog. Most products are more generic, such
    as clothing or automobiles. Although a picture shows a particular shirt, many
    identical shirts are available. You can sell the shirt many times without having
    to remove it from the catalog.


    # Building the PetType table


    You assign each pet a type, such as dog or dragon. The first Web page of the catalog
    lists the types for the customer to select from. A description of each type is
    also helpful to show. You don’t want to put the type description in the main Pet
    table because the description would be the same for all pets with the same category.
    Repeating information in a table violates good database design.


    The PetCatalog database includes a table called PetType that holds the type descriptions.
    The following SQL query creates the PetType table:


    ```

    CREATE TABLE PetType (

    petType CHAR(15) NOT NULL,

    typeDescription VARCHAR(255),

    PRIMARY KEY(petType) );

    ```


    Each row of this table represents a pet type. These are the columns:


    petType: The type name. Notice that the petType column is defined the same in
    the Pet table (which I describe in the preceding section) and in this table. This
    makes table joining possible and makes matching rows in the tables much easier.
    However, the petType is the primary key in this table but not in the Pet table.
    The CREATE query defines the petType column in the following ways:


    +   - CHAR(15): The data in this field is expected to be a character string that’s
    15 characters long.

    +   - PRIMARY KEY(petType): This definition sets the petType column as the primary
    key. This is the field that must be unique. MySQL will not allow two rows to be
    entered with the same petType.'
