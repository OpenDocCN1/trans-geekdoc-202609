- pgno: 101
  md: '# Retrieving information


    The only purpose in storing information is to have it available when you need
    it. A database lives to answer questions. What pets are for sale? Who are the
    members? How many members live in Arkansas? Do you have an alligator for sale?
    How much does a dragon cost? What is Goliath Smith’s phone number? And on and
    on. You use the SELECT query to ask the database questions.


    The simplest, basic SELECT query is


    ```

    SELECT * FROM tablename

    ```


    This query retrieves all the information from the table. The asterisk (*) is a
    wildcard meaning all the columns.


    The SELECT query can be much more selective. SQL words and phrases in the SELECT
    query can pinpoint exactly the information needed to answer your question. You
    can specify what information you want, how you want it organized, and what the
    source of the information is:


    +   ✓ You can request only the information (the columns) that you need to answer
    your question. For instance, you can request only the first and last names to
    create a list of members.

    +   ✓ You can request information in a particular order. For instance, you can
    request that the information be sorted in alphabetical order.

    +   ✓ You can request information from selected objects (the rows) in your table.
    (See Chapter 3 for an explanation of database objects.) For instance, you can
    request the first and last names for only those members whose addresses are in
    Florida.


    # Retrieving specific information


    To retrieve specific information, list the columns containing the information
    you want. For example:


    ```

    SELECT columnname,columnname,columnname,... FROM tablename

    ```


    This query retrieves the values from all the rows for the indicated column(s).
    For instance, the following query retrieves all the last names and first names
    stored in the Member table:


    ```

    SELECT lastName,firstName FROM Member

    ```


    You can perform mathematical operations on columns when you select them. For example,
    you can use the following SELECT query to add two columns together:


    ```

    SELECT col1+col2 FROM tablename

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Or you could use the following query:


    ```

    SELECT price,price*1.08 FROM Pet

    ```


    The result is the price and the price with the sales tax of 8 percent added on.
    You can change the name of a column when selecting it, as follows:


    ```

    SELECT price,price*1.08 AS priceWithTax FROM Pet

    ```


    The AS clause tells MySQL to give the name priceWithTax to the second column retrieved.
    Thus, the query retrieves two columns of data: price and priceWithTax.


    In some cases, you don’t want to see the values in a column, but you want to know
    something about the column. For instance, you might want to know the lowest value
    in the column or the highest value in the column. Table 4-2 lists some of the
    information that is available about a column.


    | Table 4-2 | Information That Can Be Selected |

    |---|---|

    | SQL Format | Description of Information |

    | AVG(columnname) | Returns the average of all the values in columnname |

    | COUNT(columnname) | Returns the number of rows in which columnname is not blank
    |

    | MAX(columnname) | Returns the largest value in columnname |

    | MIN(columnname) | Returns the smallest value in columnname |

    | SUM(columnname) | Returns the sum of all the values in columnname |


    For example, the query to find out the highest price in the Pet table is


    ```

    SELECT MAX(price) FROM Pet

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_102_0.png)


    SQL words like MAX() and SUM() are functions. SQL provides many functions in addition
    to those in Table 4-2. Some functions, like those in Table 4-2, provide information
    about a column. Other functions change each value selected. For example, SQRT()
    returns the square root of each value in the column, and DAYNAME() returns the
    name of the day of the week for each value in a date column, rather than the actual
    date stored in the column. Over 100 functions are available for use in a SELECT
    query. For descriptions of all the functions, see the MySQL documentation at www.mysql.com/documentation.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Retrieving data in a specific order


    You might want to retrieve data in a particular order. For instance, in the Member
    table, you might want members organized in alphabetical order by last name. Or,
    in the Pet table, you might want the pets grouped by type of pet.


    In a SELECT query, ORDER BY and GROUP BY affect the order in which the data is
    delivered to you:


    ORDER BY: To sort information, use the phrase


    ```

    ORDER BY columnname

    ```


    The data is sorted by columnname in ascending order. For instance, if columnname
    is lastName, the data is delivered to you in alphabetical order by the last name.


    You can sort in descending order by adding the word DESC before the column name.
    For example:


    ```

    SELECT * FROM Member ORDER BY DESC lastName

    ```


    GROUP BY: To group information, use the following phrase:


    ```

    GROUP BY columnname

    ```


    The rows that have the same value of columnname are grouped together. For example,
    use this query to group the rows that have the same value as petType:


    ```

    SELECT * FROM Pet GROUP BY petType

    ```


    You can use GROUP BY and ORDER BY in the same query.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_103_0.png)


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_103_1.png)


    # Retrieving data from a specific source


    Very frequently, you don''t want all the information from a table. You only want
    information from selected database objects: that is, rows. Three SQL words are
    frequently used to specify the source of the information:


    +   - WHERE: Allows you to request information from database objects with certain
    characteristics. For instance, you can request the names of members who live in
    California, or you can list only the pets that are cats.

    +   - LIMIT: Allows you to limit the number of rows from which information is
    retrieved. For instance, you can request all the information from the first three
    rows in the table.

    +   - DISTINCT: Allows you to request information from only one row of identical
    rows. For instance, in the Login table, you can request the loginName but specify
    no duplicate names, thus limiting the response'
  merge: -1
  img_proc: true
