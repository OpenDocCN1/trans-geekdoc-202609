- pgno: 287
  md: '# Storing information via cookies


    You can store information as cookies. Cookies are small amounts of information
    containing `variable=value` pairs, similar to the pairs that you can add to a
    URL. The user''s browser stores cookies on the user''s computer. Your application
    can then get the cookie from any Web page. Why these are called cookies is one
    of life''s great mysteries. Perhaps they''re called cookies because they seem
    at first glance to be a wonderful thing, but on closer examination, you realize
    that they aren''t that good for you. For some people in some situations, cookies
    are not helpful at all.


    At first glance, cookies seem to solve the entire problem of moving data from
    page to page. Just stash a cookie on the user''s computer and get it whenever
    you need it. In fact, the cookie can be stored so that it remains there after
    the user leaves your site and will still be available when the user enters your
    Web site again a month later. Problem solved! Well, not exactly. Cookies are not
    under your control: They''re under the user''s control. The user can at any time
    delete the cookie. In fact, users can set their browsers to refuse to allow any
    cookies. And many users do refuse cookies or routinely delete them. Many users
    aren''t comfortable with the whole idea of a stranger storing things on their
    computers, especially files that remain after they leave the stranger''s Web site.
    It''s an understandable attitude. However, it definitely limits the usefulness
    of cookies. If your application depends on cookies and the user has turned off
    cookies, your application won''t work for that user.


    Cookies were originally designed for storing small amounts of information for
    short periods of time. Unless you specifically set the cookie to last a longer
    period of time, the cookie will disappear when the user leaves your Web site.
    Although cookies are useful in some situations, you''re unlikely to need them
    for your Web database application for the following reasons:


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_287_0.png)


    +   - **Users may set their browsers to refuse cookies.** Unless you know for
    sure that all your users will have cookies turned on or you can request that they
    turn on cookies (and expect them to follow your request), cookies are a problem.
    If your application depends on cookies, it won''t run if cookies are turned off.

    +   - **PHP has features that work better than cookies.** Beginning with PHP 4,
    PHP includes functions that create sessions and store information that''s available
    for the entire session. This session feature is more reliable and much easier
    to use than cookies for making information available to all the Web pages in a
    session. Sessions don''t work for long-term storage of information, but MySQL
    databases can be used for that.

    +   - **You can store data in your database.** Your application includes a database
    where you can store and retrieve data, which is usually a better solution than
    a cookie. Users can''t delete the data in your database unexpectedly. Because
    you''re using a database in this application, you can use it for any data storage
    needed, especially long-term data storage. Cookies are more useful for applications
    that don''t make use of a database.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'You store cookies by using the setcookie function. The general format is


    ```

    setcookie("variable","value");

    ```


    The variable is the variable name, but do not include the dollar sign ($). This
    statement stores the information only until the user leaves your Web site. For
    instance, the following statement


    ```

    setcookie("state","CA");

    ```


    stores CA in a cookie variable named state. After you set the cookie, the information
    is available to your other PHP programs in the element of a built-in array as
    $_COOKIE[state]. You don''t need to do anything to get the information from the
    cookie. PHP does this automatically. The cookie is not available in the program
    where it is set. The user must go to another page or redisplay the current page
    before the cookie information can be used.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_288_0.png)


    The cookies are also available in an array called $HTTP_COOKIE_VARS with the variable
    names as keys. For instance, the value in the cookie set in the previous example
    can also be used as $HTTP_COOKIE_VARS[''state'']. This built-in array must be
    used if you are using a version of PHP that is earlier than PHP 4.1.


    If you want the information stored in a cookie to remain in a file on the user''s
    computer after the user leaves your Web site, set your cookie with an expiration
    time, as follows:


    ```

    setcookie("variable","value",expiretime);

    ```


    The expiretime value sets the time when the cookie will expire. expire time is
    usually set by using either the time or mktime function as follows:


    +   ✓ time: This function returns the current time in a format that the computer
    can understand. You use the time function plus a number of seconds to set the
    expiration time of the cookie, as shown in the following statements:

    +   ✓ mktime: This function returns a date and time in a format that the computer
    can understand. You must provide the desired date and time in the following order:
    hour, minute, second, month, day, and year. If any value is not included, the
    current value is used. You use the mktime function to set the expiration time
    of the cookie, as shown in the following statements:


    ```

    setcookie("state","CA",time()+3600); //expires in 1 hour

    setcookie("Name",$Name,time()+(3*86400)) // exp in 3 days

    ```


    ```

    setcookie("state","CA",mktime(3,0,0,4,1,2003));

    //expires at 3:00 AM on April 1, 2003.

    setcookie("state","CA",mktime(12,0,0,,));

    //expires at noon today

    ```'
  merge: -1
  img_proc: true
- pgno: 289
  md: "You can remove a cookie by setting its value to nothing. Either of the following\
    \ statements removes the cookie:\n\n```\nsetcookie(\"name\");\nsetcookie(\"name\"\
    ,\"\");\n```\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_289_0.png)\n\nThe setcookie\
    \ function has a major limitation, however. The setcookie function can only be\
    \ used before any other output is sent. You cannot set a cookie in the middle\
    \ of a program after you have echoed some output to the Web page. See the sidebar\
    \ “Statements that must come before output,” elsewhere in this chapter.\n\n# Passing\
    \ information with HTML forms\n\nThe most common way to pass information from\
    \ one page to another is by using HTML forms. An HTML form is displayed with a\
    \ submit button. When the user clicks the submit button, the information in the\
    \ form fields is passed to the program included in the form tag. The general format\
    \ is\n\n```\n<form action=\"processform.php\" method=\"POST\">\n    tags for one\
    \ or more fields\n    <input type=\"submit\" value=\"string\">\n</form>\n```\n\
    \nThe most common use of a form is to collect information from users (which I\
    \ discuss in detail in Chapter 8). However, forms can also be used to pass other\
    \ types of information using hidden fields, which are added to the form and sent\
    \ with the information that the user typed in. In fact, you can create a form\
    \ that has only hidden fields. You always need a submit button, and the new page\
    \ doesn’t display until the user clicks the submit button, but you don’t need\
    \ to include any fields for the user to fill in.\n\nFor instance, the following\
    \ statements pass the user’s preferred background color to the next page when\
    \ the user clicks a button named Next Page:\n\n```\n<?php\n    $color = \"blue\"\
    ; //passed via a user form\n    echo \"<form action='nextpage.php' method='POST'>\n\
    \        <input type='hidden' name='color' value='$color'>\n        <input type='submit'\
    \ value='Next Page'>\n    </form>\\n\";\n?>\n```\n\nThe Web page shows a submit\
    \ button labeled Next Page, but it doesn’t ask the user for any information. When\
    \ the user clicks the button, nextpage.php runs and can use the array element\
    \ $_POST[color], which contains \"blue\"."
  merge: -1
  img_proc: true
- pgno: 290
  md: "# Using PHP Sessions\n\nA session is the time that a user spends at your Web\
    \ site. Users can view many Web pages between the time when they enter your site\
    \ and then leave it. Often you want information to follow the user around your\
    \ site so that it's available on every page. PHP, beginning with version 4.0,\
    \ provides a way to do this.\n\n# How PHP sessions work\n\nPHP enables you to\
    \ set up a session on one Web page and save variables as session variables. Then\
    \ you open the session in any other page, and the session variables are available\
    \ for your use in the built-in arrays $_SESSION. To do this, PHP does the following:\n\
    \n+   1. **Assigns a session ID number:** The number is a really long, nonsense\
    \ number that is unique for the user and that no one could possibly guess. The\
    \ session ID is stored in a PHP system variable named PHPSESSID.\n+   \n+   2.\
    \ **Stores session variables in a file on the server:** The file is named with\
    \ the session ID number. The file is stored in \\tmp on Unix/Linux; in Windows,\
    \ it's stored in a directory called sessiondata under the directory where PHP\
    \ is installed.\n+   \n+   3. **Passes the session ID number to every page:**\
    \ If the user has cookies turned on, PHP passes the session ID using cookies.\
    \ If the user has cookies turned off, PHP passes the session ID in the URL for\
    \ links or in a hidden variable for forms that use the post method.\n+   \n+ \
    \  4. **Gets the variables from the session file for each new session page:**\
    \ Whenever a user opens a new page that is part of the session, PHP gets the variables\
    \ from the file by using the session ID number that was passed from the old page\
    \ and puts them into the built-in array $_SESSION. You can use the array elements\
    \ with the variable name as the key, and they have the value that you assigned\
    \ in the previous page.\n\nIf you are the PHP administrator, you can change the\
    \ location where the session files are stored by editing the configuration file\
    \ php.ini. Find the setting for session.save_path and change the path to the location\
    \ where you want to store the files.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_290_0.png)\n\
    \n![](img/d82df0828cfbc6d6be1e9a991861f3b7_290_1.png)\n\nSessions do not work\
    \ unless track_vars is enabled. As of PHP 4.0.3, track_vars is always turned on.\
    \ For versions previous to 4.0.3, the option --enable-track-vars should be used\
    \ when installing PHP."
  merge: -1
  img_proc: true
- pgno: 291
  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_291_0.png)


    If users have cookies turned off, sessions do not work unless trans-sid is turned
    on. You find out how to turn trans-sid on and off later in the section, “Using
    PHP session variables.”


    # Opening sessions


    You should open a session on each Web page. Open the session with the session_start
    function, as follows:


    ```

    session_start();

    ```


    The function first checks for an existing session ID number. If it finds one,
    it sets up the $_SESSION array. If it doesn’t find one, it starts a new session
    by creating a new session ID number.


    Because sessions use cookies if the user has them turned on, session_start is
    subject to the same limitation as cookies. That is, the session_start function
    must be called before any output is sent. For complete details, see the sidebar
    “Statements that must come before output,” elsewhere in this chapter.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_291_1.png)


    You can tell PHP that every page on your site should automatically start with
    a session_start. To do this, edit the configuration file php.ini. If you are the
    PHP administrator, you can edit this file; otherwise, ask the administrator to
    edit it. Look for the variable session.auto_start and set its value to 1. You
    might have to restart the Web server before this takes effect. With auto_start
    turned on, you don’t need to add a session_start at the beginning of each page.


    # Using PHP session variables


    When you want to save a variable as a session variable — that is, available to
    other Web pages that the user might visit — save it in the $_SESSION array as
    follows:


    ```

    $_SESSION[''variablename''] = value;

    ```


    The variable value is then available in the $_SESSION array on other Web pages.
    For example, you can store the state where the user lives by using the following
    statement:


    ```

    $_SESSION[''state''] = "CA";

    ```


    You can then use $_SESSION[''state''] in any other Web page, and it will have
    the value CA.'
  merge: -1
  img_proc: true
- pgno: 292
  md: "The following two programs show how to use sessions to pass information from\
    \ one page to the next. The first program, `sessionTest1.php` in Listing 9-2,\
    \ shows the first page where the session begins. Listing 9-3 shows the program\
    \ `sessionTest2.php` for the second page in a session.\n\n# Listing 9-2: Starting\
    \ a Session\n\n```\n<?php\n    session_start();\n?>\n<html>\n<head><title>Testing\
    \ Sessions page 1</title></head>\n<body>\n<?php\n    $_SESSION['session_var']\
    \ = \"testing\";\n    echo \"This is a test of the sessions feature.\n       \
    \ <form action='sessionTest2.php' method='POST'>\n            <input type='hidden'\
    \ name='form_var'\n                value='testing'>\n            <input type='submit'\
    \ value='go to next page'>\n        </form>\";\n?>\n</body></html>\n```\n\nNotice\
    \ that two variables are set in this program to be passed to the second page.\
    \ The session variable `session_var` is created. In addition, a form is displayed\
    \ with a hidden variable `form_var`, which is also passed to the second page when\
    \ the submit button is pressed. Both variables are set to \"testing\".\n\n# Listing\
    \ 9-3: The Second Page of a Session\n\n```\n<?php\n    session_start();\n?>\n\
    <html>\n<head><title>Testing Sessions page 2</title></head>\n<body>\n<?php\n \
    \   echo \"session_var = {$_SESSION['session_var']}<br>\\n\";\n    echo \"form_var\
    \ = {$_POST['form_var']}<br>\\n\";\n?>\n</body></html>\n```\n\nPoint your browser\
    \ at `sessionTest1.php` and then click the submit button that reads Go to Next\
    \ Page. You will then see the following output from `sessionTest2.php`:\n\n```\n\
    session_var = testing\nform_var = testing\n```"
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Because sessions work differently for users with cookies turned on and for
    users with cookies turned off, you should test the two programs in both conditions.
    To turn off cookies in your browser, you change the settings for options or preferences.


    To disable cookies in Internet Explorer, follow these steps:


    +   1. **Choose Tools→Internet Options.**

    +      The Internet Options dialog box opens.

    +   2. **Click the Security tab in IE 5.5 or the Privacy tab in IE 6.**

    +   3. **Click the Internet icon to highlight it.**

    +   4. **Click the Custom Level button.**

    +      The Security Settings dialog box appears.

    +   5. **Scroll down to the Cookies section and select Disable for each of the
    cookie settings.**

    +   6. **Click OK.**


    To disable cookies in Netscape Navigator, follow these steps:


    +   1. **Choose Edit→Preferences.**

    +   2. **Highlight Advanced.**

    +   3. **Mark Disable Cookies.**

    +   4. **Click OK.**


    If the output from sessionTest2 shows a blank value for $session_var when you
    turn cookies off in your browser, it is probably because trans-sid is not turned
    on. You can turn on trans-sid in your php.ini file. Find the following line:


    ```

    session.use_trans_sid = 0

    ```


    Change the 0 to 1 to turn on trans-sid. If you can’t get this problem fixed, you
    can still use sessions, but you must pass the session ID number in your programming
    statements because PHP won’t pass it automatically when cookies are turned off.
    For details on how to use sessions when trans-sid is not turned on, check out
    the next section.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_293_0.png)


    For PHP 4.1.2 or earlier, trans-sid is not available unless it was enabled by
    using the option --enable-trans-sid when PHP was compiled.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Sessions without cookies


    Many users turn off cookies in their browsers. PHP checks the user’s browser to
    see whether cookies are allowed and behaves accordingly. If the user’s browser
    allows cookies, PHP does the following:


    +   - ✓ Sets the variable $PHPSESSID equal to the session ID number

    +   - ✓ Uses cookies to move $PHPSESSID from one page to the next


    If the user’s browser is set to refuse cookies, PHP does the following:


    +   - ✓ Sets a constant called SID. The constant contains a variable=value pair
    that looks like PHPSESSID=longstringofnumbers.

    +   - ✓ Might or might not move the session ID number from one page to the next,
    depending on whether trans-sid is turned on. If it is turned on, PHP passes the
    session ID number; if it is not turned on, PHP does not pass the session ID number.


    Turning on trans-sid has advantages and disadvantages. The advantage is that sessions
    work seamlessly even when users turn cookies off. It also is much easier to program
    sessions with trans-sid turned on. The disadvantage is that the session ID number
    is often passed in the URL. In some situations, the session ID number should not
    be shown in the browser address. Also, when the session ID number is in the URL,
    it can be bookmarked by the user. Then, if the user returns to your site by using
    the bookmark with the session ID number in it, the new session ID number from
    the current visit can get confused with the old session ID number from the previous
    visit and possibly cause problems.


    # Sessions with trans-sid turned on


    When trans-sid is turned on and the user has cookies turned off, PHP automatically
    sends the session ID number in the URL or as a hidden form field. If the user
    moves to the next page by using a link, a header function, or a form with the
    get method, the session ID number is added to the URL. If the user moves to the
    next page by using a form with the post method, the session ID is passed in a
    hidden field. PHP recognizes $PHPSESSID as the session ID number and handles the
    session without any special programming on your part.


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_294_0.png)


    The session ID number is only added to the URLs for pages on your own Web site.
    If the URL of the next page includes a server name, PHP assumes that the URL is
    on another Web site and doesn’t add the session ID number. For instance, if your
    link statement is


    ```

    <a href="newpage.php">

    ```'
  merge: -1
  img_proc: true
- pgno: 295
  md: "PHP will add the session ID number. However, if your statement is\n\n```\n\
    <a href=\"HTTP://www.company.com/newpage.php\">\n```\n\nPHP will not add the session\
    \ ID number.\n\n# Sessions without trans-sid turned on\n\nWhen trans-sid is not\
    \ turned on, PHP does not send the session ID number to the next page when users\
    \ have cookies turned off. Rather, you must send the session ID number yourself.\n\
    \nFortunately, PHP provides a constant that you can use to send the session ID\
    \ yourself. A constant is a variable that contains information that can't be changed.\
    \ (Constants are described in Chapter 6.) The constant that PHP provides is named\
    \ SID and contains a variable=value pair that you can add to the URL, as follows:\n\
    \n```\n<a href=\"nextpage.php?<?php echo SID?>\"> next page </a>\n```\n\nThis\
    \ link statement adds a question mark (?) and the constant SID to the URL. SID\
    \ contains the session ID number formatted as variable=value. The output from\
    \ echo SID looks something like this:\n\n```\nPHPSESSID=877c22163d8df9deb342c7333cfe38a7\n\
    ```\n\nTherefore, the URL that is sent is\n\n```\n<a href=\"nextpage.php?PHPSESSID=877c22163d8df9deb342c7333cfe38a7\"\
    >\n    next page </a>\n```\n\nFor one of several reasons (which I discuss in the\
    \ section \"Adding information to the URL,\" earlier in this chapter), you may\
    \ not want the session ID number to appear on the URL shown by the browser. To\
    \ prevent that, you can send the session ID number in a hidden field in a form\
    \ by using the post method. First, get the session ID number; then send it in\
    \ a hidden field. The statements to do this are\n\n```\n<?php\n    $PHPSESSID\
    \ = session_id();\n    echo \"<form action='nextpage.php' method='POST'>\n   \
    \     <input type='hidden' name='PHPSESSID'\n            value='$PHPSESSID'>\n\
    \        <input type='submit' value='Next Page'>\n    </form>\";\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 296
  md: 'These statements do the following:


    +   1. Store the session ID number in a variable called $PHPSESSID. Use the function
    session_id, which returns the current session ID number.

    +   2. Send $PHPSESSID in a hidden form field.


    On the new page, PHP will automatically use $PHPSESSID to get any session variables
    without any special programming needed from you.


    # Making sessions private


    PHP session functions are ideal for Web sites that are restricted and require
    users to log in with a login name and password. Those Web sites undoubtedly have
    many pages, and you don''t want the user to have to log in to each page. PHP sessions
    can keep track of whether the user has logged in and refuse access to users that
    aren''t logged in. You can use PHP sessions to do the following:


    +   1. Show users a login page.

    +   2. If a user logs in successfully, set and store a session variable.

    +   3. Whenever a user goes to a new page, check the session variable to see whether
    the user has logged in.

    +   4. If the user has logged in, show the page.

    +   5. If the user has not logged in, bring up the login page.


    To check whether a user has logged in, add the following statements to the top
    of every page:


    ```

    <?php

    session_start()

    if ( @$_SESSION[''login''] != "yes" )

    {

    header("Location: loginPage.php");

    exit();

    }

    ?>

    ```


    In these statements, $_SESSION[''login''] is a session variable that is set to
    "yes" when the user logs in. The statements check whether $_SESSION[''login'']
    is equal to "yes". If it is not, the user is not logged in and is sent to the
    login page. If $_SESSION[''login''] equals "yes", the program proceeds with the
    rest of the statements on the Web page.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Closing PHP sessions


    For restricted sessions that users log into, you often want users to log out when
    they’re finished. To close a session, use the following statement:


    ```

    session_destroy();

    ```


    This statement gets rid of all the session variable information that is stored
    in the session file. PHP no longer passes the session ID number to the next page.
    However, the statement does not affect the variables currently set on the current
    page: They still equal the same values. If you want to remove the variables from
    the current page — as well as prevent them from being passed to the next page
    — unset them with this statement:


    ```

    unset($_SESSION );

    ```'
  merge: -1
  img_proc: true
