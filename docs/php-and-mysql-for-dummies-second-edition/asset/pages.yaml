- pgno: 423
  md: '# # Configuring Apache for PHP


    You must configure Apache to recognize and run PHP files. An Apache configuration
    file, `httpd.conf`, is on your system, possibly in `/etc` or in `/usr/local/apache/conf`.
    You must edit this file before PHP can run properly.


    Follow these steps to configure your system for PHP:


    +   1. Open the `httpd.conf` file so you can make changes.


    +   2. Configure Apache to load the PHP module.


    Find the list of `LoadModule` statements. Look for the following line:


    ```

    ```text

    LoadModule php5_module libexec/libphp5.so.

    ```

    ```


    If this line isn’t there, add it. If a pound sign (#) is at the beginning of the
    line, remove the pound sign.


    +   3. Configure Apache to recognize PHP extensions.


    You need to tell Apache which files might contain PHP code. Look for a section
    describing `AddType`. You might see one or more `AddType` lines for other software.
    Look for the `AddType` line for PHP, as follows:


    ```

    ```text

    AddType application/x-httpd-php .php

    ```

    ```


    If you find it with a pound sign (#) at the beginning of the line, remove the
    pound sign (#). If you don’t find this line, add it to the `AddType` statements.
    This line tells Apache to look for PHP code in all files with a `.php` extension.
    You can specify any extension or series of extensions.


    +   4. Start (if it is not running) or restart (if it is running) the Apache `httpd`
    server.


    You can start or restart the server by using a script that was installed on your
    system during installation. This script might be `apachectl` or `httpd.apache`,
    and might be located in `/bin` or `/usr/local/apache/bin`. For example, you might
    be able to start the server by typing `apachectl start`, restart it by using `apachectl
    restart`, or stop it by using `apachectl stop`. Sometimes restarting is not sufficient;
    you must stop the server first and then start it.


    # ## On Windows


    PHP runs on Windows 98/Me and Windows NT/2000/XP. It does not run on Windows 3.1.
    Windows 95 is no longer supported as of PHP 4.3.0.'
  merge: -1
  img_proc: true
