- pgno: 362
  md: '# Members Only section


    One or more Web pages make up the contents of the Members Only section. Whatever
    the content is, the pages are no different than any other Web pages or PHP programs,
    except for some PHP statements in the beginning of each file that prevent non-members
    from viewing the pages.


    # Writing the Programs


    After you know what the pages are going to look like and what they are going to
    do, you can write the programs. In general, you create a program for each page,
    although sometimes it makes sense to separate programs into more than one file
    or to combine programs on a page. (See Chapter 10 for details on how to organize
    applications.)


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_362_0.png)


    As I discuss in Chapter 10, keep the information needed to connect to the database
    in a separate file and include it in all the programs that need to access the
    database. Store the file in a secure location, with a misleading name. For this
    application, the following information is stored in a file named dogs.inc:


    ```

    <?php

    $user="catalog";

    $host="localhost";

    $password="";

    $database="MemberDirectory";

    ?>

    ```


    The member login application has several basic tasks:


    +   1. **Show the storefront page.** This provides a link to the login page.

    +   2. **Show a page where customers can fill in a Member ID and a password to
    log in.**

    +   3. **Check the Member ID and the password that the customer types against
    the Member ID and password stored in the database.** If the ID and password are
    okay, the customer enters the Members Only section. If the ID and/or password
    are not okay, the customer is returned to the login page.

    +   4. **Show a page where customers can fill in the information needed to obtain
    a member account.**

    +   5. **Check the information the customer typed in for blank fields or incorrect
    formats.** If bad information is found, show the form again so that the customer
    can correct the information.'
