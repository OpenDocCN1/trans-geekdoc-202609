- pgno: 70
  md: '# Creating relationships between tables


    Some tables in a database are related to one another. Most often, a row in one
    table is related to several rows in another table. A column is needed to connect
    the related rows in different tables. In many cases, you include a column in one
    table to hold data that matches data in the primary key column of another table.


    A common application that needs a database with two related tables is a customer
    order application. For example, one table contains the customer information, such
    as name, address, phone, and so on. Each customer can have from zero to many orders.
    You could store the order information in the table with the customer information,
    but a completely new row would be created each time that the customer placed an
    order, and each new row would contain all the customer’s information. It would
