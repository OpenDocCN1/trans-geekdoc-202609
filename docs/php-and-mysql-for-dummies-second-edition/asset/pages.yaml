  img_proc: true
- pgno: 255
  md: "![](img/d82df0828cfbc6d6be1e9a991861f3b7_255_0.png)\n\nYou also need to protect\
    \ yourself from malicious users — users who might want to damage your Web site\
    \ or your database or steal information from you or your users. You don’t want\
    \ users to enter HTML tags into a form field — something that might have unexpected\
    \ results when sent to a browser. A particularly dangerous tag would be a script\
    \ tag that allows a user to enter a program into a form field.\n\nIf you check\
    \ each field for its expected format, you can catch typo s and prevent most malicious\
    \ content. However, checking information is a balancing act. You want to catch\
    \ as much incorrect data as possible, but you don’t want to block any legitimate\
    \ information. For instance, when you check a phone number, you might limit it\
    \ to numbers. The problem with this check is that it would screen out legitimate\
    \ phone numbers in the form 555-5555 or (888) 555-5555. So you also need to allow\
    \ hyphens (-), parentheses (), and spaces. You might limit the field to a length\
    \ of 14 characters, including parentheses, spaces, and hyphens, but this screens\
    \ out overseas numbers or numbers that include an extension. The bottom line:\
    \ You need to think carefully about what information you want to accept or screen\
    \ out for any field.\n\nYou can check field information by using regular expressions,\
    \ which are patterns. You compare the information in the field against the pattern\
    \ to see whether it matches. If it doesn’t match, the information in the field\
    \ is incorrect, and the user must type it over. (See Chapter 6 for more on regular\
    \ expressions.)\n\nIn general, these are the statements that you use to check\
    \ fields:\n\n```\nif ( !ereg(\"pattern\",$variablename) )\n{\n    echo error message;\n\
    \    redisplay form;\n    exit();\n}\necho \"Welcome\";\n```\n\nNotice that the\
    \ condition in the if statement is negative. That is, the ! (exclamation mark)\
    \ means \"not\". So, the if statement actually says: If the variable does not\
    \ match the pattern, execute the if block.\n\nFor example, suppose that you want\
    \ to check an input field that contains the user’s last name. You can expect names\
    \ to contain letters, not numbers, and possibly apostrophe and hyphen characters\
    \ (as in O’Hara and Smith-Jones, respectively) and also spaces (as in Van Dyke).\
    \ Also, it’s difficult to imagine a name longer than 50 characters. Thus, you\
    \ can use the following statements to check a name."
  merge: -1
  img_proc: true
- pgno: 256
