    the error message printed right above the form.


    When members successfully log in with a valid Member ID and password, they go
    to the first page of the Members Only section. When new members successfully submit
    a form with information that looks reasonable, they go to a New Member Welcome
    page (see the next section). In addition, an e-mail message is sent to the new
    member with the following contents:


    ```

    A new Member Account has been setup for you. Your new

    Member ID and password are:


    gsmith

    secret


    We appreciate your interest in Pet Store at PetStore.com


    If you have any questions or problems, send email

    to webmaster@petstore.com

    ```


    ![](img/d82df0828cfbc6d6be1e9a991861f3b7_360_0.png)


    **Figure 12-3:** Page showing a message resulting from a mistake in the form.'
