    +   9. **Configure your Web server.**

    +      The next section provides instructions for configuring your Web server.

    +   10. **Configure PHP.**

    +       Follow the directions in the section later in this chapter.


    # Configuring Your Web Server for PHP


    Your Web server needs to be configured to recognize PHP scripts and run them.
    Follow the steps in the section for your Web server:


    # Configuring Apache


    You must edit an Apache configuration file, called `httpd.conf`, before PHP can
    run properly To configure Apache for PHP, follow these steps:


    +   1. **Open httpd.conf for editing.**

    +      You might be able to edit it by choosing Start→Programs→Apache HTTPD Server→Configure
    Apache Server→Edit Configuration.

    +      If Edit Configuration isn''t on your Start menu, find the `httpd.conf`
    file on your hard disk, usually in the directory where Apache is installed, in
    a `conf` subdirectory (for example, `c:\program files\Apache group\Apache\conf`).
    Open this file in an editor, such as Notepad or WordPad.

    +   2. **Set up a nickname for the directory where PHP is installed.**

    +      A `ScriptAlias` statement is used to set up a name for the directory where
    PHP is installed. Look for `ScriptAlias` statements in the `httpd.conf` file.
    You might see some for other software. If you don''t see one for PHP, add the
    following:


    ```

    ScriptAlias /php/ "c:/php/"

    ```'
  merge: -1
  img_proc: true
