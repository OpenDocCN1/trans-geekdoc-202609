  md: '![](img/d82df0828cfbc6d6be1e9a991861f3b7_234_0.png)


    Figure 8-5:

    A form for entering a customer''s address.


    The same information is available in two sets of arrays. Use the newer arrays
    (names begin with _) because they can be used anywhere, even inside a function.
    (I explain functions and the use of variables inside functions in Chapter 7.)
    These arrays, called superglobals or autoglobals, were introduced in PHP 4.1.0.
    The older arrays, with long names such as $HTTP_POST_VARS, must be made global
    before they can be used in a function, as I explain in Chapter 7. The older arrays
    should only be used when you are forced to use a version of PHP older than PHP
    4.1.0.


    # Making forms dynamic


    PHP brings new capabilities to HTML forms. Because you can use variables in PHP
    forms, your forms can now be dynamic. Here are the major capabilities that PHP
    brings to forms:


    +   ✓ Using variables to display information in input text fields

    +   ✓ Using variables to build dynamic lists for users to select from

    +   ✓ Using variables to build dynamic lists of radio buttons

    +   ✓ Using variables to build dynamic lists of check boxes


    # Displaying dynamic information in form fields


    When you display a form on a Web page, you can put information into the fields
    rather than just displaying a blank field. For example, if most of your customers
    live in the United States, you might automatically enter US in the country field
    when you ask customers for their address. If the customer does'
  merge: -1
  img_proc: true
- pgno: 235
  md: "indeed live in the United States, you’ve saved the customer some typing. And\
    \ if the customer doesn’t live in the U.S., he or she can just replace **US**\
    \ with the appropriate country. Also, if the program automatically enters **US**\
    \ as the value in the field, you know that the information doesn’t have any errors\
    \ in it.\n\nTo display a text field that contains information, you use the following\
    \ format for the input field HTML statements:\n\n```\n```html\n<input type=\"\
    text\" name=\"country\" value=\"US\">\n```\n```\n\nBy using PHP, you can use a\
    \ variable to display this information with either of the following statements:\n\
    \n```\n```php\n<input type=\"text\" name=\"country\"\n       value=\"<?php echo\
    \ $country ?>\">\necho \"<input type='text' name='country' value='$country'>\"\
    ;\n```\n```\n\nThe first example creates an input field in an HTML section, using\
    \ a short PHP section for the value only. The second example creates an input\
    \ field by using an **echo** statement inside a PHP section. If you’re using a\
    \ long form with only an occasional variable, using the first format is more efficient.\
    \ If your form uses many variables, it’s more efficient to use the second format.\n\
    \nIf you have user information stored in a database, you might want to display\
    \ the information from the database in the form fields. For instance, you might\
    \ show the information to the user so that he or she can make any needed changes.\
    \ Or you might display the shipping address for the customer’s last online order\
    \ so that he or she doesn’t need to retype the address. Listing 8-7 shows the\
    \ program `displayAddress.php`, which displays a form with information from the\
    \ database. This form is very similar to the form shown in Figure 8-5 except that\
    \ this form has information in it (retrieved from the database) and the fields\
    \ in the form in Figure 8-5 are blank.\n\n![](img/d82df0828cfbc6d6be1e9a991861f3b7_235_0.png)\n\
    \n# ## Registering long arrays\n\nA new `php.ini` setting introduced in PHP 5\
    \ allows you to prevent the older, long arrays from being created automatically\
    \ by PHP. It’s very unlikely that you will need to use them unless you’re using\
    \ some old scripts containing the long variables. The following line in `php.ini`\
    \ controls this setting:\n\n```\n```ini\nregister_long_arrays = On\n```\n```\n\
    \nAt the current time, this setting is **On** by default. Unless you’re running\
    \ old scripts that need the\n\nold arrays, you should change the setting to **Off**\
    \ so that PHP doesn’t do this extra work. Although the setting is currently **On**\
    \ by default, that could change. The default setting might change to **Off** in\
    \ a future version. If you’re using some old scripts and are getting errors on\
    \ lines containing the long arrays, such as `$HTTP_GET_VARS`, check your `php.ini`\
    \ setting for long arrays. It might be **Off**, and the long arrays needed by\
    \ the older script are not being created at all."
  merge: -1
  img_proc: true
