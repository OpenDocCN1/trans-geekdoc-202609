  md: '# 5.2 Going beyond Tools


    The core collision-resistance property to prove the security of Cramer and Shoup''s
    public-key encryption scheme from CRYPTO ''98 were target collision hash families
    from Definition 5.2. Now we are going to assume a different tool is at hand, namely
    family of hash functions on a given set, and which can help us simulate a uniform
    distribution on it, moreover, with a trapdoor in some sense. These families of
    functions are, together with so-called hard subset membership problems, the tools
    underlying a general construction (again due to Cramer and Shoup) of a group-theoretic
    encryption scheme [CS02] which we will expend next in Section 5.3.


    # 5.2.1 Projective hash families


    We will need few basic statistical notions measuring to what extent two probability
    distributions are similar,


    # DEFINITION 5.3 [Statistical distance and indistinguishability]


    Let $\xi$ and $

    u$ be random variables taking values in a finite set $X$. The statistical distance
    between $\xi$ and $

    u$ is defined to be


    ```

    $$\delta(\xi, \nu) = \frac{1}{2} \sum_{x \in X} |Pr[\xi = x] - Pr[\nu = x]|$

    ```


    For an $\varepsilon > 0$, we say that $\xi$ and $\nu$ are $\varepsilon$-close
    if $\delta(\xi, \nu) \leq \varepsilon$. Furthermore, if $\xi = (\xi_i)_{i\geq
    0}$ and $\nu = (\nu_i)_{i\geq 0}$ are sequences of random variables (where each
    $\ell$ the corresponding $\xi_{\ell}$ and $\nu_{\ell}$ takes values on the same
    finite set $X_{\ell}$) we say that they are statistically indistinguishable if
    $\delta(\xi_{\ell}, \nu_{\ell})$ is a negligible function in $\ell$.


    Similarly, if any probabilistic polynomial time algorithm $\mathcal{A}$,


    ```

    $Pr[\mathcal{A}(\xi_{\ell})] = 1] - Pr[\mathcal{A}(\nu_{\ell})] = 1$

    ```


    is negligible in $\ell$, we refer to the sequences as computationally indistinguishable.


    Now we formally define the basic cryptographic tools we will need in this section
    and look at some simple examples.


    # DEFINITION 5.4 [Projective hash function]


    By $X$, $\Pi$, and $S$ we denote finite, non-empty sets, and consider a distinguished
    subset $L \subseteq X$. Let $K$ be a finite index set, and $\mathbf{H} = \{H_k\}_{k\in
    K}$ a collection of mappings with domain $X$ and range in $\Pi$. Moreover, if
    $\alpha : K \rightarrow S$ be'
