  md: '# Group Theoretic Cryptography


    generated by X is free if every reduced word in (X∪ X⁻¹)+ is different from the
    identity. If this is the case, then we say that the group is freely generated
    by X and denote this group by F(X).


    By construction, a free group F(X) may seem to be a trivial object—its elements
    are reduced words over an alphabet X, and the group operation is just concatenation
    followed by reducing modulo the relations xx⁻¹ = ε and x⁻¹x = ε (x ∈ X). On closer
    inspection, free groups turn out to have quite remarkable (not so obvious) properties,
    however. In particular, every group can be obtained as quotient of a free group.
    The latter observation is the starting point for putting the notion of presentation
    of a group on many formal grounds.


    **DEFINITION 6.2 [Presentation of a group]** Let G be a group, X ⊆ G a subset
    of G, and R a set of words over the alphabet X∪ X⁻¹ (i.e., R ⊆ (X∪ X⁻¹)). We say
    that (X, R) is a presentation of the group G whenever G is isomorphic to the quotient
    of a group freely generated by X the normal subgroup generated by R. The elements
    of X are referred referred as generators and the ones from R as relations.


    If a group has a presentation (X, R) as above, with both X and R being finite,
    then G is said to be finitely presented.


    The word problem for a finite presentation (X, R) of G refers to the task of finding
    an algorithm that can decide whether two finite words in X∪ X⁻¹ represent the
    same group element in G. Equivalently, to solve the problem one should be able
    to tell whether a given word is representing the identity element of the group
    G.


    **REMARK 6.1** The careful reader may point out that this character of the word
    problem is not sufficiently precise, as it is not clear how the words presented
    to the algorithm are chosen, success probability and which running time to solve
    the word problem is expected to have. In fact, it is not uncommon to impose that
    an algorithm for solving the word problem handle every possible pair of words
    over the alphabet X∪ X¹, always succeeds in finite time, but has no restriction
    on the running time needed to do so. Formalizing the word problem along this line,
    it may not be surprising that obtaining a proof for a property like IND-CPA security
    from a “hard word problem” alone is not a straightforward exercise.


    # 6.1.1 The encryption scheme of Wagner and Mayarikik


    One of the first attempts to exploit the hardness of a group-theoretic problem
    for building an asymmetric encryption scheme dates back several decades.'
