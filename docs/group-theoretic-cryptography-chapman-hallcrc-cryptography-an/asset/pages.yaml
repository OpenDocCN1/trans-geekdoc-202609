- pgno: 223
  md: '# Solutions to selected exercises


    and retrieves $k$ computing it as


    ```

    $k = \frac{H(m_1) - H(m_2)}{s_1 - s_2} \mod q.$

    ```


    Once $k$ has been retrieved, it is straightforward to recover the prover''s secret
    key $x$, just as


    ```

    $x = (s_1k - H(m_1))r^{-1} \mod q.$

    ```


    **Solution to Exercise 72.** Assume the identification protocol is run $n$ times,
    and let $m_1, \dots, m_n$ the challenges presented to the legitimate verifier,
    all in $\{0,1\}^k$. Now, the adversary is presented with a challenge $m^*$ by
    an honest verifier; his probability of outputting a valid signature of that value
    is bounded by the maximum of $n/2^k$ and $P_{forge}$, where $P_{forge}$ would
    be the probability that he outputs a valid signature on $m^*$. Such a signature
    would constitute a *selective forgery*. Indeed, an EUF-CMA scheme would suffice
    for this application, but even a weaker notion is sufficient, namely *selective
    unforgeability under known message attacks*.


    **Solution to Exercise 74.** Given a signature and the public key, the image $\mathcal{H}(m)$
    of the corresponding message $m$ under $\mathcal{H}$ is uniquely determined, as
    $f$ is a permutation. So unless a collision for $\mathcal{H}$ occurs, the message
    $m$ is uniquely determined by the signature. The probability for a collision to
    occur is negligible—and a collision could actually enable a forgery in the sense
    of EUF-CMA. So the FDH signature satisfies this stronger notion of unforgeability.'
