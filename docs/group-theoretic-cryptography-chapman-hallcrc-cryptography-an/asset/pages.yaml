  md: "# DEFINITION 5.1 [Collision-resistant hash functions]\n\nLet $L \\subseteq\
    \ \\mathbb{N}$ and for each $\\ell \\in L$ consider $\\mathcal{H}_\\ell$, a finite\
    \ collection of functions with range $\\{0,1\\}^\\ell$ and having a common finite\
    \ domain of definition $D_\\ell$. We say that the family $\\mathcal{H} = \\{\\\
    mathcal{H}_\\ell\\}_{\\ell \\in L}$ is collision resistant if any probabilistic\
    \ polynomial time algorithm $A$ has negligible probability (in $\\ell$) of given\
    \ a function $H$ uniformly at random from $\\mathcal{H}_\\ell$, finding two values\
    \ $x, y \\in D_\\ell$ such that\n\n$H(x) = H(y)$ and $x \neq y$.\n\nA weaker requirement\
    \ than collision resistance is target collision resistance, where an adversary\
    \ has to commit in advance one of the colliding inputs.\n\n# DEFINITION 5.2 [Target\
    \ collision resistant hash functions]\n\nLet $L \\subseteq \\mathbb{N}$ and for\
    \ each $\\ell \\in L$ consider $\\mathcal{H}_\\ell$, a finite collection of functions\
