    \ 5.7 [Group action projective hash family]** Any projective hash family constructed\
    \ from a group action system as described above is called a group action projective\
    \ hash family—in short, an AcPHF. Such a projective hash family is made explicit\
    \ by the tuple $(X, H, \\chi, S)$.\n\nTo show how diversity of the group action\
    \ system translates into nice properties of the corresponding AcPHF, let us look\
