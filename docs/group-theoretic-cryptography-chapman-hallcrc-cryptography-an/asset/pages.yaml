    # 8.4 Message authentication codes


    As already clear from its name, a message authentication code (MAC) is concerned
    with ensuring the authenticity of a message rather than ensuring confidentiality.
    It has some similarity with digital signatures as discussed in Chapter 10, but
    a major difference is the assumption that sender and receiver have a secret key
    in common. Unlike digital signatures, MACs are not intended to provide a publicly
    verifiable form of authentication. Both creating and verifying a tag involves
    a secret key.


    > **DEFINITION 8.2 [Message Authentication Code]** A message authentication code
    is given by a triple of polynomial time algorithms $(K,\mathcal{T},\mathcal{V})$
    along with a family of message spaces $\{M_\ell\{\ell\in\mathbb{N}}$ as follows.


    +   * $K$: *a probabilistic* key generation algorithm that on input a security
    parameter $\ell$ outputs a secret key sk.

    * $\mathcal{T}$: *a probabilistic* tagging algorithm that on input a secret key
    $sk$ and a message $m \in M_\ellell outputs a tag $t$ or a dedicated error symbol
    $\perp$.

    * $\mathcal{V}$: a deterministic verification algorithm that on input a secret
    key $sk$ and a message $m \in M_\ell$ outputs VALID or INVALID, indicating that
    a tag is considered as valid or invalid.


    To ensure correctness, *we require that* for a key $sk$ generated by the key generation
    algorithm, the event


    $\exists m \in M_\ell : \mathcal{V}(\mathcal{T}(sk)(m)) \neq \text{VALID}$


    occurs with negligible probability only.


    In a typical case, the message space consists of arbitrary bitstrings of bounded
    length, the key generation is a simple uniform random choice in $\mathbbmathbb{F}^ell$,
    the tagging algorithm $\mathcal{T}$ is deterministic, and $\mathcal{V}$ amounts
    to recomputing the tag produced by $\mathcal{T}$. In fact, is common to restrict
    to a small set of choices for the key length. The standard security notion for
    a message authentication scheme is existential unforgeability against adaptive
    chosen message attack, which is defined analogously in the case for signatures
    (see Definition 10.2). The idea is that even having message tags for chosen messages
