  md: '# Chapter 3


    # Cryptology: An introduction


    # 3.1 A short historical overview


    Cryptology is the (art and) science devoted to information protection in a wide
    sense; it provides solutions for storing, sharing, communicating, and even computing
    with data when certain security guarantees are required. It has both a constructive
    and a destructive face. In the classical terminology, *cryptography* deals with
    the design of secure schemes, while *cryptanalysis* audits the claimed robustness
    of cryptographic designs. Nowadays many people do not make a strict separation
    between cryptography and cryptanalysis, and cryptography is often understood as
    a synonym for cryptology.


    One could say cryptology is some extent inherent to language, and it is hard to
    give a precise date of when it started. What is historically clear, however, is
    that different events and technological developments had a strong influence on
    the way people communicated and had a striking consequences on the way cryptology
    was used and understood. We will briefly go through some of these milestones,
    describing a few basic cryptographic schemes. We will see a significantly more
    rigorous approach to discussing cryptographic schemes in the next part of the
    book.


    # 3.1.1 Historical encryption schemes


    Allowing for private communication was the main (if not the only) cryptographic
    goal the second half of the twentieth century. Up until that point, cryptography
    was devoted to the design of encryption schemes—or *ciphers*—that would allow
    a sender to construct messages which, hopefully, could only be read by legitimate
    receivers. Sender and receiver for that purpose hold special piece of information
    (a key) or token (encryption/decryption device). As a result, encryption and decryption
    processes were *symmetric*, in the sense that both sender and receiver performed
    the same operations, that only the recipient might undo the sender''s process
    in reverse order. Similarly, sender and receiver held identical tokens for enabling
    secure communication. This symmetry between sender and receiver is the main idea
    under *secret-key* cryptography, which is also commonly referred to as *symmetric*
    cryptography: all involved users hold'
