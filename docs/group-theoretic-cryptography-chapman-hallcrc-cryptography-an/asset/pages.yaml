- pgno: 15
  md: '# Preface


    Group theory is one of the most beautiful areas of mathematics. Being the algebraic
    language of symmetries, it finds applications in an enormous variety of fields,
    not only within mathematics but notably within physics, chemistry, and life sciences.
    Group-theoretic techniques have propelled many scientific achievements from understanding
    molecular systems biology to analyzing strategies to solve Rubik''s cube.


    This book was conceived as an introduction to cryptography for readers lured by
    group theory who are curious to understand possible interplays between the two
    fields. Even many constructions within modern cryptography exploit certain properties
    of finite groups, it is fair to say they are mostly number theoretic in nature.
    Notwithstanding this, the history of making use of advanced group-theoretic tools
    dates back several decades. In the late 1970s, Magliveras explored the use of
    permutation group mappings for constructing a block cipher. In the early days
    of public-key cryptography, an asymmetric encryption scheme exploiting the hardness
    of the word problem in finitely presented groups were presented in 1984 at the
    Crypto conference in Santa Barbara, California, one of the flagship conferences
    in the field. Ever since there have been numerous attempts to exploit hard group-theoretic
    problems for cryptographic constructions, many inspiring ideas have come to light
    and clever cryptanalytic strategies have shown that coming with practical designs
    is a challenging task. At the same time, interesting theoretical questions within
    group theory have emerged from the cryptographic designs. Differing from what
    happens within ‘standard’ computational group theory, the computational problems
    arising from the cryptographic perspective set up a scenario in which mathematical
    reasoning is challenged by computational limitations and, moreover, by the hardness
    of formally capturing the behavior of malicious entities in real-life applications.


    For a smooth reading of this text elementary mathematical maturity is assumed.
    Namely, the reader should be familiar with material commonly covered in undergraduate
    courses on linear algebra and discrete mathematics. We also assume elementary
    knowledge of algorithms. We have made an effort to make the text accessible for
    both computer science and mathematics undergraduates who have some exposure to
    college-level mathematics and algorithms courses.


    The book is divided into five separate parts. The first two chapters in Part I
    are devoted to reviewing the basic background knowledge from group theory de'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Preface


    and complexity theory. They are very short and intended as a minimalist review
    of the notions needed to undergo the rest of the text. Similarly, the third chapter
    offers a brief informal introduction to cryptology for those who are first approaching
    the field. Again, it is by no means a thorough introduction, but the topics and
    examples have been chosen in the hope the experienced reader will feel a familiar
    glimpse of this quickly evolving area. Part II of the book is devoted to public-key
    encryption, a cryptographic subject which receives a lot of attention from the
    mathematical community. Even though understanding the basics of public-key encryption
    may help in penetrating other cryptographic constructions, this is to a large
    extent independent of the subsequent parts of the book. The techniques in the
    third part, devoted to secret-key encryption, are quite different. Sometimes not
    much group theory is brought to use in this field, but from a cryptographic point
    of view, familiarity with a block cipher as the Advanced Encryption Standard is
    clearly relevant. Readers who may be interested in seeing group-theoretic constructions
    may at least take a look at Permutation Group Mappings in Section 7.3 and Cayley
    hash functions in Section 8.3. The last part of the book, before the appendix,
    discusses signatures, of the most important applications of cryptography next
    to encryption, as well as identification protocols. We also include a discussion
    of key establishment protocols, where proposals using non-Abelian groups—most
    notably braid groups—have been made. The Anshel-Goldfeld protocol discussed in
    Section 9.2 received a lot of attention in the literature.


    Each chapter concludes with a short section summarizing its content and providing
    references for further reading on the topic treated. Furthermore, we included
    a list of exercises, and solutions for some of them are provided in the appendix
    at the end of the book.


    # Acknowledgments


    This text benefited tremendously from the interaction with mathematics and computer
    science students, each of them approaching the world of cryptography from their
    own unique perspective. Our views on the subject certainly have been influenced
    and shaped by the interaction with many colleagues, who generously shared their
    expertise in cryptography and group theory with us. We thank each and all of them
    want to mention some of them explicitly: Ronald Cramer, Juan González-Meneses,
    Samuel Martínez, Adriana Suárez Corona, Tran van Trung, Boaz Tsaban, and Jorge
    Luis Villar.


