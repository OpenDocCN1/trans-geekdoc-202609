    $f(n) \le C \cdot g(n), \text{ for all } n \ge n_0,$


    This notation is useful when we want to simplify without losing relevant information,
    e.g., "operation counting", writing $O(n^3)$ instead of $4n^3 + 12n^2 - 15n +
    3$ can be clever. At the same time, using $O(n^3)$ instead of $e^{-n}$ seems,
