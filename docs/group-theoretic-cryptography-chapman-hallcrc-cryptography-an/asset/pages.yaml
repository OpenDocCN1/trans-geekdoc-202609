    Identification schemes are a subclass of so-called proof of knowledge protocols,
    which are very powerful tools within modern cryptology. Zero-knowledge proofs
    of knowledge play a central role in the design of commitment schemes and are behind
    the IND-CCA security of many public-key encryption schemes. Indeed, to render
    the decryption oracle in the IND-CCA scenario useless, it suffices to require
    that a valid ciphertext should always include a zero-knowledge proof of knowledge
    of the plaintext. For more information on this topic we refer the interested reader
    to [Gol01, Chapter 4]. For recent results on the connections between signature
    and identification schemes, see [KH06].


