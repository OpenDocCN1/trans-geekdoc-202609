    As we did in the earlier discussion of public-key encryption, when aiming at formal
    proofs of signature schemes, we need to specify both the goals and capabilities
    of the adversary. Typically, the adversarial goals are classified as:


    +   * total break: disclosing a valid secret key for impersonating the signer
    at will;

    * universal forgery: constructing a signing algorithm that on any input message
    outputs a signature for it that will be accepted as valid;

    * existential forgery: producing a valid signature of a message $m$ of the adversary''s
    choosing. If $m$ is chosen by the adversary prior to the attack, we speak of *selective
    forgery*.


    Among the above, the more "humble" goal is that of an existential forgery, as
    it can well be that all messages the adversary is to sign have a particular structure—and
    are potentially meaningless in the targeted context.


    When it comes to specifying adversarial capabilities there is a first distinction
    we have to make. Should we assume that the adversary has access to all public
    information but not to any signed messages (*no-message attack*), or (*known-message
    attack*)? Going one step further, we should assume that the adversary granted
