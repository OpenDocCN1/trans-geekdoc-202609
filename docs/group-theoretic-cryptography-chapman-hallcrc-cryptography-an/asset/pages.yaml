    Let $G$ be a finite non-Abelian group generated by $g_1, \dots, g_n \in G$ and
    such that elements from $G$ can be sampled uniformly at random. Let


    ```

    $\phi : G \rightarrow \text{Aut}(G)$

    $h \mapsto \phi_h = (g \mapsto hgh^{-1})$

    ```


    be the homomorphism which maps each element in $G$ to a corresponding inner automorphism.
    With this notation, Figure 4.7 describes key generation, encryption, and decryption
    in MOR.


    +   **Key generation $\mathcal{K}$: chooses $h \in G$ and exponent**

    \n$\alpha \in \1, \dots, \text{ord}(\phi_h)}\$\n\nThe secret key is $sk = \alpha$,
    and the primary key comprised of $\phi_h$ and $\phi_h^\alpha$, represented as

    \n$pk = (\phi_h(g_1), \dots, \phi_h(g_n), \phi_h^{\alpha}(g_1), \dots, \phi_h^{\alpha}(g_n))$


    +   **Encryption $\mathcal{E}$: to encrypt a message $m \in G$, represented as
    a word $m = w(g_1, \dots, g_n)$ in the given generators, under public key $(\phi_h(g_1)^\beta,
    \dots, \phi_h(g_n)^\beta, \phi_h^{\alpha}(g_1)^\beta, \dots, \phi_h^{\alpha}(g_n)^\beta)$,
    choose an exponent $\beta \in \1, \dots, \text{ord}(\phi_h)\}$ and output

    \n$c = (\phi_h(g_1)^\beta, \dots, \phi_h(g_n)^\beta, w(\phi_h^{\alpha}(g_1))\beta,
    \dots, w(\phi_h^{\alpha}(g_n))\beta)$$

    \n$\phi_h^\beta \quad \ \phi_h^{\alpha}(m)$


    +   **Decryption $\mathcal{D}$: to decrypt $c = (\phi_h^\beta, \phi_h^{\alpha}(m))$
    under secret key $sk = \alpha$, express $\phi_h^{\\alpha}(m)$ as a word $w''(g_1,
    \dots, g_n)$ in the given generators, compute a representation of $\phi^{-\alpha\beta}$

    \n$((\phi_h(g_1)^{-\alpha}, \dots, (\phi_h(g_n)^{-\alpha}))^{-\beta})$$

    \n recover the plaintext

    \n$m = w''((\phi_h(g_1)^{-\alpha}, \dots, (\phi_h(g_n)^{-\alpha})^{-\beta})$


    FIGURE 4.7: MOR encryption scheme.


