  md: '# Block ciphers


    Being a composition of even permutations, we recognize the round functions of
    AES as even.


    Similarly as for AES, the round functions of several other block ciphers have
    been shown to generate the alternating group, including the Data Encryption Standard
    (DES), one of the most influential block ciphers, which we will discuss in the
    next section. It deserves to be noted, however, the size of the group generated
    by the round functions alone is not a good indicator of the strength of a block
    cipher. In an article from 1994, Murphy et al. gave an example of a block cipher
    whose round functions generate the symmetric space, but at the same time is rather
    weak [MPW94]. Notwithstanding this, understanding the group generated by the round
    functions of a block cipher is of value to rule out least some major design flaws.
    The description of a block cipher may sometimes not lend itself to a convenient
    algebraic analysis, but for several major block ciphers it has been feasible to
    identify the group generated by their round functions.


    # 7.2 Data Encryption Standard


    From a modern perspective, the short effective key length of 56 bits immediately
    disqualifies the Data Encryption Standard (DES) for applications with high security
    requirements. As manifested in the keys of AES, currently a key length of at least
    128 bits is expected, though 80 bits key still enjoy some popularity when looking
    at low-cost platforms. Looking at the (by now withdrawn) standard publication
    specifying DES [NIS99], one notices that the "nominal" key length is actually
    64 bit, but 8 of these have to satisfy a parity-check condition, which determines
    them uniquely once the remaining part of the keys are fixed (see Section 7.2.3).


    The plaintext and ciphertext space of DES is Fe⁶⁴, and similar to AES encryption
    is performed through iterating a round function which has a (64-bit) key as input.
    A major difference is that in each half of the input bits are only moved to a
    different position without changing their value. Only 32 bits are modified. This
    is due to the Feistel structure of DES.


    # 7.2.1 General structure of DES: A Feistel cipher


    The basic structure of one round of a Feistel cipher is depicted in Figure 7.2.
    The input from the previous round is split into two blocks which are swapped in
    the output of the round. Only one of the input blocks is substituted through the
    addition of a value that depends on the round key and on the unmodified block.'
