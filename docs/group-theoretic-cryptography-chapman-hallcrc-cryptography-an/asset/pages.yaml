    # 2.2 Asymptotic notation and examples


    When comparing the running time of algorithms, it is often convenient to disregard
    parts of the expressions that make explicit the concrete number of bit operations
    performed, they become irrelevant as the input size of the algorithms grows. Hence,
    as complexity statements are asymptotic in nature, it is customary to use a special
    notation that facilitates comparisons between different running times.


    > DEFINITION 2.5 [Big-O notation]

    Consider two functions $f: N_0 \to \mathbb{R}_{\ge 0}$ and $g: N_0 \to \mathbb{R}_{\ge
