  md: "# # Appendix A\n\n#  Solutions to selected exercises\n\n#  A.1 Solutions to\
    \ selected exercises of Part I\n\n**Solution to Exercise 2.** It is clear that\
    \ $f_g$ is bijective. To verify that $f_g$ is a homomorphism, $h, k \\in G$. Then\
    \ $f_g(hk) = g^{-1}hkg = g^{-1}hgg^{-1}kg = f_g(h)f_k(k)$. For (b), a direct computation\
    \ shows that $f_g \\circ f_h = f_{hg}$ and $f_g^{-1} = f_{g^{-1}}$. As a result,\
    \ $\text{Inn}(G) \\le \text{Sym}(G)$ and $\text{Inn}(G) \\le \text{Aut}(G)$. Finally,\
    \ to establish (c) we have to see that conjugates of elements from $\text{Inn}(G)$\
    \ are also in $\text{Inn}(G)$. Indeed, let $\\Psi \\in \text{Aut}(G)$ be any automorphism\
    \ of $G$. Now for any $x \\in G$ we have $(\\Psi^{-1}f_g\\Psi)(x) = (\\Psi^{-1}f_g)(\\\
    Psi(x)) = \\Psi^{-1}(g^{-1}\\Psi(x)) = \\Psi^{-1}(g^{-1})\\Psi(x) = f_{\\Psi^{-1}(g)}(x)$.\n\
    \n**Solution to Exercise 4.** Let $g \\in G$ with $g \neq 1$. As a consequence,\
    \ $g$ must have $|G| = p$, the order of $g$ has to be $p$. $G = \\langle g \r\
    angle$, i.e., $g$ generates the full group.\n\n**Solution to Exercise 6.** This\
    \ follows from the fact that Sylow $p$-subgroups are conjugate. $H$ must be contained\
    \ in a Sylow $p$-subgroup $P$ (or be itself a Sylow $p$-subgroup $P$). Because\
    \ of $H$ being normal, then it will be contained in all.\n\n**Solution to Exercise\
    \ 8.** Just apply Lagrange's theorem to $Z_n^*$.\n\n**Solution to Exercise 10.**\
    \ In the quaternion group, three subgroups of order four are all cyclic. This\
    \ is not the case for $D_4$ which also has three subgroups of order 4, but one\
    \ is cyclic and the others are isomorphic to $\\mathbb{Z}_2 \times \\mathbb{Z}_2$.\
    \ A shorter argument follows by counting elements of order 2.\n\n**Solution to\
    \ Exercise 12.** It is enough to argue that for any polynomial $p(n)$ there exists\
    \ a constant $c \\ge 0$ such that $p(n) \\le n^c$ for every natural $n$.\n\n**Solution\
    \ to Exercise 14.** It is easy to see that the algorithm is quadratic if one compares\
    \ it with the Euclidean algorithm from Example 2.3. Indeed, the whole loop in\
    \ subroutine 1 executes as many divisions—starting from $a = mq + r$ as it would\
    \ do for $gcd(a, m)$, as a result, its running time is in $O(\\ln^2 n)$."
