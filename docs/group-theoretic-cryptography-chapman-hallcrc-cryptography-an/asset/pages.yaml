  md: '# Chapter 10


    # Signature and identification schemes


    # 10.1 Definitions and terminology


    Authenticating an entity or group of entities that “own,” have produced, or modified
    a certain piece of information is central in nearly any scenario where cryptographic
    techniques are to be applied. As we have seen in the middleperson attack in the
    previous chapter, even a simple two-party key exchange can be secured if Alice
    cannot be assured that she is actually communicating with Bob (see Figure 9.1).
    Digital signature schemes are the basic tool providing the functionality to solve
    such a problem in the public-key setting. Given a message $m$ that we receive,
    a digital signature on $m$ can evidence created created $m$, certify it has not
    been altered, or even used to confuse a malicious reader who denies sending $m$.


    **DEFINITION 10.1 [Public-key signature scheme]** A public-key signature scheme
    is given by a triple of polynomial time algorithms $(K, S, V)$ along with a family
    $\{M_K\}$ of message spaces. More specifically, we have the following:


    +   $K$: a probabilistic key generation algorithm that on input a security parameter
    $e^\ell=1^{\ell}$ outputs a pair $(pk, sk)$. We refer to $pk$ as a public key
    and to $sk$ as a secret.


    +   $S$: a probabilistic algorithm that on input of secret key $sk$ and a message
    $m \in M_K$ outputs a signature $\sigma$ for $m$.


    +   $V$: a deterministic algorithm that on input of a public key $pk$, a candidate
    signature $\sigma$, and a message $m \in M_K$ outputs 1 if the verification is
    correct (namely, $\sigma$ is a valid signature for $m$ with the corresponding
    public key $pk$) and 0 otherwise.


    For $S$ and $V$ we will write the first argument as an index, i.e., we set $S_{sk}(m)
    = S(sk, m)$ and $V_{pk}(\sigma, m) = V(pk, \sigma, m)$. Moreover, for key pairs
    $(pk, sk)$ generated by the key generation algorithm $K$, we require that the
    event $$\exists m \in M_K : V_{pk}(S_{sk}(m), m) \neq 1$$'
