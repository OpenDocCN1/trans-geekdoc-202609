  md: "# Group Theoretic Cryptography\n\n**REMARK 4.5** Unless otherwise stated, we\
    \ will talk about the one-wayness property of a function considering the input\
    \ values $x$ as being chosen uniformly at random, but note that the above definition\
    \ generalizes naturally. The same observation applies to other definitions in\
    \ this section.\n\nDefinition 4.8 characterizes a one-way function as a single\
    \ function where finding primes becomes increasingly harder when being presented\
    \ with evaluations at inputs of increasing length. If we try to formalize problems\
    \ like computing a discrete logarithm or decomposing a number into prime factors,\
    \ this definition is not particularly convenient to work with. The function we\
    \ want to work may be defined on a finite domain that defines the security parameter\
    \ and this domain is not necessarily defined as a certain subset of $\\{0,1\\\
    }^*$, as a more complex algebraic structure. The subsequent definition offers\
    \ a formalization of the one-way property that takes into account:\n\n# **DEFINITION\
    \ 4.9 [One-way function family]** Let $I$ be an index set. For each $i \\in I$,\
    \ let $f_i : D_i \to R_i$ be a function such that the sets $D_i$ and $R_i$ are\
    \ finite. The collection of functions $\\{f_i : D_i \to R_i\\}_{i \\in I}$ is\
    \ a one-way family, if there exist probabilistic polynomial time algorithms to\n\
    \n+   * select on input $1^i$ an $i \\in I$,\n* sample on input $i \\in I$ a value\
    \ $x \\in D_i$ uniformly at random,\n* compute on input $i$ and $x \\in D_i$,\
    \ the value $f_i(x)$,\n\nin such way that the following condition holds: for all\
    \ probabilistic polynomial time algorithms $\\mathcal{A}$ the probability\n\n\
    > $Pr[f_i(\\mathcal{A}(f, i, 1^\\ell)) = f_i(x)$\n\nis negligible, where the probability\
    \ is taken over the coin involved in the selection of $i$ and the internal coin\
    \ tosses of $\\mathcal{A}$. A one-way permutation family is a one-way function\
    \ family where each $f_i$ is a permutation.\n\n**Example 4.6** Let $I=\\mathbb{N}$\
    \ be the natural numbers. On input security parameter $2^\\ell$ we choose the\
    \ index $\\ell \\in I$ to satisfy the first requirement in the above definition.\
    \ For any index $q$ we define $D_q$ to be the set of primes $(p,q)$ such that\
    \ $p \neq q$ and $p,q \\in \\{2^\\ell+2, 3, \\dots, 2^{\\ell+1}-1\\}$. The set\
    \ $R_q$ is defined as $\\{1, \\dots, 2^{q+2}\\}$. Assuming the availability of\
    \ a suitable sampling algorithm for the sets $D_i$, the multiplication functions\
    \ $f_i : D_i \\mapsto R_i,(p,q) \\mapsto p \\cdot q$ form a candidate for a one-way\
    \ function family that captures the idea that factoring a sufficiently large RSA\
    \ modulus is not."
