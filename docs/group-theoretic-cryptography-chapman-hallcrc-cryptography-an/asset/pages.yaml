    Collision resistance. It must not be feasible to find any different inputs $m_0
    \neq m_1$ such that $h(m_0) = h(m_1)$. So the (short) function value $h(m)$ can
    serve as “fingerprint” for a (possibly long) message $m$.


    In this introductory text, an informal description of these requirements will
    suffice, but to establish provable precise guarantees, more technical work is
    needed (cf. the definition of collision-resistant hash functions in Section 5.1).

    For the reader who is interested in formalizing hash function requirements and
    understanding the challenges in finding appropriate technical definitions, work
    by Rogaway and Shrimpton [RS04], Rogaway [Rog06], and Andreeva and Stamin [AS11]
    can serve as starting points.


    By design, hash functions do not involve any form of secret key, and their specification
    must be public. In this sense, the reader may ask why we discuss this in a chapter
    on symmetric encryption. As will see in Section 8.4, hash functions can be used
    to derive message authentication codes, and these can be used to augment symmetric
    encryption schemes with guarantees beyond confidentiality of the plaintext. It
    is fair to say that the usual “real-life approximation” of a random oracle (cf.
    Section 4.3) is a (by definition meaningless) hash function. Before looking at
    samples of suggested designs, it is worth noting that the collision resistance
    requirement imposes a lower bound on the output size that should be considered.
    The following result, due to Sayraafiezadeh [Say94], explains why currently used
