    one has in mind—say $m$ encodes an amount of money in a financial transaction
    that can be increased through multiplication with $h$—this may pose a substantial
    problem.


    To enable a more thorough treatment of public-key encryption, let us clarify what
    we mean by this term. A public-key encryption scheme will be specified by a collection
    of algorithms that are parameterized by a $security parameter$ $\ell \in \mathbb{N}$.
    Intuitively, $\ell$ reflects a key length, and to express that an event becomes
    "rather unlikely unless the key size is chosen to be large enough," the concept
    of a negligible function is:


    > **DEFINITION 4.1 [Negligible function]** *A function $f : \mathbb{N} \to \mathbb{R}_{\ge
    0}$ is said to be negligible if for every $k \in \mathbb{R}$ there exists an integer
    $k_0$ such that*


    ```

    $$\forall k > k_0 :quad f(k) < \frac{1}{k^c}$

    ```


    Typically we use negligible functions to express that the probability for a certain
    type of attack to succeed is quickly approaching zero, when the key size is increased.


