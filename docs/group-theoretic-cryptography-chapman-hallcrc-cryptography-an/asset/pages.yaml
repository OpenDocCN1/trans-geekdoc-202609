    # 6.3 Braid groups in cryptography


    Let us take a look at braids as first introduced by Emil Artin in [Art47]. They
    appear in different areas of mathematics and form the mathematical basis for a
    number of cryptographic proposals that were made around the beginning of the 21st
    century. The schemes are mathematically very appealing and the constructions likely
    be efficient enough to be practical. So is not surprising that these proposals
    attracted a lot of attention, both from the group theory and the cryptographic
    community. Unfortunately, a number of practical problems arose after the proposals
    underwent careful scrutiny. Still, the elegant ideas behind these constructions
    continue to stimulate research in the area. Two surveys on the topic have been
    written by P. Dehornoy [De04] and D. Garber [Gar07], and much of what we explore
    in this section follows their presentations.


    # 6.3.1 Basics on braid groups


    Braid groups admit several equivalent definitions. Here we use the so-called Artin
    presentation as a starting point:


    **DEFINITION 6.3 [Braid group: Artin presentation]** For any natural number n
    ≥ 2, the braid group on n strands, is defined by the presentation (X, R), with
    generator X = {σ₁, ..., σ<sub>n₋</sub>}, and relation set


    ```

    R = {σ_iσ_j = σ_jσ_i for 1 ≤ i, j ≤ n-1, |i - j| ≥ 2} ∪

    {σ_iσ_{i+1}σ_i = σ_{i+1}σ_iσ_{i+1} for 1 ≤ i ≤ n-1, |i - j| = 1}.

    ```


    The generators σ<sub>i</sub>, i=1, ..., n-1 are referred to as Artin generators,
    and the elements of B<sub>n</sub> are called *n*-braids.


    This presentation affords an intuitive geometric interpretation: suppose we have
    n strands that are linked to a solid bar at the ceiling, hanging down to the floor,
    where they are linked to another solid bar, parallel to the first'
