  md: '# Group Theoretic Cryptography


    **The conjugacy problem in $B_n$.** For a finite cyclic group $G$ with generator
    $g$ of prime order $p$, the multiplicative group $F_p^*$ acts on $G$ through exponentiation,
    and that group action lies in the last of ElGamal encryption scheme. For cryptographic
    proposals related to braid groups, another group acts on itself through conjugation,
    and different flavors of conjugacy problems have been used in connection with
    cryptographic proposals. Leaving aside technical questions that need to be addressed
    by a formal definition, four variants naturally come to mind:


    **Conjugacy decision problem:** Given $a, b \in B_n$, determine whether they are
    conjugate, i.e., whether there exists $x \in B_n$ such that $a = x^{-1}bx$.


    **Conjugacy search problem:** Given two braids $a, b \in B_n$, find to be conjugate,
    a conjugating $x \in B_n$, such that $a = x^{-1}bx$.


    **Braid Diffie-Hellman decision problem:** Given $a, b, c, d \in B_n$, with $b
    = x^{-1}ax$ and $c = y^{-1}ay$, for some commuting braids $x, y \in B_n$ (i.e.,
    $xy = yx$).


    **Braid Diffie-Hellman search problem:** Given $a, b, c \in B_n$, such that exist
    $x, y \in B_n$ with $b = x^{-1}ax$ and $c = y^{-1}ay$, compute $d = (xy)^{-1}(axy)$.


    Unlike $F_p^*$, the braid group is not Abelian, and for $g, x \in B_n$ the relation
    $(g^x)^y = (g^y)^x$, crucial for decryption in the ElGamal scheme, does not have
    to hold. To enforce a commutativity condition as used in the last one can choose
    $x$ and $k$ from particular subgroups. We instance $LB_n \le B_n$ and right braids
    $RB_n \le B_n$, respectively, $LB_n$ is generated by $\sigma_1, \dots, \sigma_{|g|-1}$,
    and $RB_n$ is generated by $\sigma_{|g|+1}, \dots, \sigma_{n-1}$. In this way,
    every element in $LB_n$ commutes with every element in $RB_n$. Using the “commuting
    elements” and invoking a random map $H$ to map the (normal form) of a braid element
    to its bit, one can make the usual ElGamal procedure as shown in Figure 6.8. A
    variant of ElGamal has been proposed at CRYPTO 2000 by K et. [KLC+00].


    The description of the encryption scheme in Figure 6.8 lacks some important details.
    Specifically, the choice of the “random” braids is not obvious. Unlike the case
    of finite groups here we have obvious uniform choice from a finite set. Only recently,
    Gebhardt et al. have presented a polynomial time algorithm for generating positive
    braids of a given length as Artin generators according to a uniform distribution
    [GGM13].


    It remains a challenging problem to solve all of the variants of the conjugacy
    problem efficiently for arbitrary input choices, or from a cryptanalytic perspective
    already heuristic attacks with a non-negligible success probability threat. Different
    algorithms have been proposed to solve'
