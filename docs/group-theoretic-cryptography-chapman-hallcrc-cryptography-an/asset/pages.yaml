    Several choices for $I_a$ have been considered in the literature, carrying names
    like summit set, super summit set, ultra summit set, or reduced summit set. Qualifiers
    like “super” or “ultra” are commonly used to denote a reduction in size compared
    to previously considered sets—the simpler and smaller such sets, the more efficient
    is the algorithm derived from the above strategy.


    Using the above technique and other sophisticated geometric techniques, J. Birman,
    V. Gebhardt, and J. González Meneses [BGM07b] could identify a polynomial time
    algorithm for the conjugacy search problem for so-called periodic braids. Furthermore,
    the authors have proven that the conjugacy search problem can be solved for all
    instances if a polynomial time algorithm for a type of braids known as rigid braids
    were found. Results are very interesting from the perspective of computational
    group theory, though ambivalent from a cryptographic perspective: on the one hand,
    we learn about certain types of problem instances should be avoided, while on
    the other it seems worrisome that a polynomial time solution is already available
    for at least one type of braids.


    In addition to trying to construct a general solution, heuristic strategies have
    been employed to tackle instances of a conjugacy problem. These strategies include:


    # Neighboring representatives in the super summit set.


    Aiming at a solution of the super version of the conjugacy problem, in [HS02]
    a very basic version of the above strategy was used: given two (conjugate) braids
    $a$ and $b$, compute representatives $\hat{a}$ and $\hat{b}$, respectively, and
    corresponding witnesses. More specifically, the super summit set was used, where
    this computation could be realized efficiently. Next, an attempt is made to find
    a permutation braid conjugating $\hat{a}$ to the other $\hat{b}$. Despite being
    far from constituting a general solution to a conjugacy search problem, this seemingly
    simple strategy turned out to be a very effective attack when invoked with concrete
    instances that have been proposed for cryptographic use in the literature.


    # Length-based attacks.


    These types of attacks were introduced by J. Hughes and A. Tannenbaum [HT03] and
    rely on finding a suitable “length function” $L$. For instance, $L$ may be closely
    related to the number of generators (of a certain type) involved in some normal
    form representation of a braid. The idea is to say, if, Artin generator $\sigma_i$
    appears last in the conjugating element $x$, $\sigma_i x^{-1} ax \sigma_i^{-1}$
