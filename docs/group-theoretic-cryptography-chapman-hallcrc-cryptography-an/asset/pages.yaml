  md: '# Chapter 8


    # Cryptographic hash functions and\message authentication codes


    In the discussion of signature schemes in Chapter 10, cryptographic hash functions
    will play an important role, but they are brought to use in many other cryptographic
    applications as well. Unlike encryption schemes, hash functions do not involve
    any type of secret key, but nonetheless they form an important building block
    in many cryptographic constructions. While proposals for hash functions have been
    made that try to exploit the algebraic structure inherent to a (particular representation
    of) finite group, at this point such designs do not play a prominent role outside
    academia. Also, similarly as for block ciphers, the role of proofs is not given
    as much weight as in the design of asymmetric encryption schemes. Because of hash
    functions being applied to very large datasets, computational efficiency traditionally
    gets a lot of attention in the design process.


    # 8.1 Cryptographic hash functions


    At its core, a cryptographic hash function is a function h with a finite codomain
    and a domain that has a larger cardinality than the codomain. Such a function
    by definition cannot be injective, yet it is one of the four essential design
    requirements that "for practical purposes" we can think of h as being one-to-one:


    Efficiency. Evaluating h must be efficient, i. e., it should be possible to process
    large inputs—preferably on platforms with very limited computational resources.


    Preimage resistance. Given a value h0 in the image of h, applying h to a "random"
    input, it must not be feasible to recover a preimage of h0.


    Second-preimage resistance. Given a value h0 in the image of h along with a preimage
    m0, it must not be feasible to find another preimage m1 ≠ m0 satisfying h(m1)
    = h0.'
