    # **THEOREM 7.2 [DES round functions are even]**

    Taken as permutations on $\mathbb{F}_2^{64}$, the round functions of DES are even.


    **PROOF** The round $(L_i, R_i) \leftarrow (R_{i-1}, L_{i-1} \oplus f_{K_i}(R_{i-1}))$
    can be decomposed into two functions, both of which are:


    +   A map add : $(L, R) \longrightarrow (L \oplus f_K(R), R)$ modifying only the
    left half of 64-bit input. For each $R \in \mathbb{F}_2^{32}$ with $f_K(R) = 0$,
    the map add leaves its input. For all $R$-values that are not mapped to $0^{32}$
    by $f_K$, the $(L, R)$ and $(L \oplus f_K(R), R)$ are exchanged pairwise by add
    for any $L \in \mathbb{F}_2^{32}$. With $\zeta = |f_K^{-1}(0^{32})|$ denoting
    the number of bitstrrings that are mapped to $0^{32}$ by $f_K$, we can see that
    this can be written as a product of $2^{232} - \zeta$ transpositions. (In the
    extreme case of $f_K$, sending every input to $0^{32}$, is the identity permutation.)


    +   A map swap : $(L, R) \longrightarrow (R, L)$ which exchanges the left half
    and the right half of its 64-bit input. This map swaps the $2^{32}$ elements with
    both halves being identical, and swaps the remaining $2^{64} - 2^{32}$ possible
