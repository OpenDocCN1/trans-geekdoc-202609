  md: '# 7.1 Advanced Encryption Standard


    In 2000, the National Institute of Standards and Technology announced the outcome
    of a selection process for a new block cipher that could serve as national standard
    in the USA. This block cipher, originally referred to as Rijndael, is today widely
    known as AES. It is one of the most popular block ciphers, and on the following
    pages we describe its inner workings, following the pertinent standard document
    [NIS01].


    Three different key lengths are possible—we can choose $k=128$, $k=192$, or $k=256$.
    The main structure of the block cipher is not affected by this. Of course the
    change in key length has some effect on the details of the encryption and decryption
    process, but for instance the block length is always $n=128$, independent of the
    key length.


    # 7.1.1 Specifying the round function


    To encrypt a plaintext $m \in \mathbb{F}^{128}$ we split $m$ into 8-bit blocks
    and identify each of them with an element in the field $\mathbb{F}_{256} = \mathbb{F}_2[x]/(x^8+x^4+x^3+1)$.
    Then we write these 8-bit blocks column-by-column into a square matrix. More specifically,
    we apply the function map $\iota$ to the plaintext $m$:


    ```

    $$\iota : \frac{\mathbb{F}^{128}}{2} \longrightarrow \mathbb{F}_{256}^{4\times4}$$

    $(m_0, \dots, m_{127}) \longrightarrow (s_{i,j})_{0\le i,j\le 3}, \quad (7.1)$

    ```


    with $s_{i,j} = \sum_{k=0}^7 m_{8(i+4k)} \cdot x^k \in \mathbb{F}_{256}$. The
    actual encryption will be performed by applying several rounds of invertible transformations
    to the state $S = (s_{i,j})_{0\le i,j\le 3}$. The new state obtained after such
    a round depends on the input state and round key. The individual round keys are
    derived from a secret $k$-bit key by means of a key schedule which we will discuss
    in a moment. But first, let us look at the four basic transformations used to
    form the round functions—none of them depend on the specific key length $k$, as
    round keys always up as elements in $\mathbb{F}_{256}^{4\times4}$. In fact, three
    of the transformations are independent of the secret key.


