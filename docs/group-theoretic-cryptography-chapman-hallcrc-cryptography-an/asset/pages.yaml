    # **Solution to Exercise 30.** Actually, such an example can be found if the family
    of negligible functions is uncountable; the interested reader can look deeper
    into this topic in [Bel97]. Let us then take the collection of all negligible
    functions mapping N to $\mathbb{R}_{\geq0}$. It is easy to see that there is no
    function n fulfilling the required property, as, if n were such function, then
    2n would also be negligible, but $2n(\ell) \geq n(\ell)$ for all $\ell \in \mathbb{N}$.


    # **Solution to Exercise 32.** Take any generator of G. Let $\alpha = [\alpha_1,
    \dots, \alpha_e]$ with


    ```

    $\alpha_i = [\epsilon_H, g^{p^{-i}}, \dots, g^{(p-1)p^{-i}}]$

    ```


    for $i=1, \dots, \ell$, $\ell$ is a logarithmic signature for H of length $\ell,
    p$. Furthermore, as for $i=1, \dots, \ell$ and $j = 0, \dots, p-1$ we have $\alpha_{ij}
    = g^{ij^{-i}}$ if some $h \in G$ we have $h = \alpha_{i1\dots i\ell}^k$ with $k
    = i_1 + i_2 + \dots + i_\ell p^{-\ell}$.


    # **Solution to Exercise 34.** In the proposed variation of the encryption algorithm
    in Cramer-Shoup ''98, a challenge ciphertext of the IND-CCA has the form:


    ```

    $c_b = (u_1, u_2, h''m_b, \alpha)$, where $\alpha = H(u_1, u_2, h'')$.

    ```


    A passive adversary may simply multiply the third component of $c_b$ with the
    inverse of $m_1$ and hash the result together with $u_1$ and $u_2$, which should
    coincide with the received $\alpha$ if $b=1$ was correct. Trivially, he succeeds
    in winning the IND-CCA case with non-negligible probability.


    # **Solution to Exercise 36.** We are asked to characterize the subgroup $P$ of
    $\mathbb{Z}_{N^2}$ consisting of all $N^{th}$ powers of elements in $\mathbb{Z}_{N^2}$,
    namely all


    ```

    $y \in \mathbb{Z}_{N^2}$ such that $\exists x \in \mathbb{Z}_{N^2}$ with $y =
    x^N \pmod{N^2}$.

    ```


    Using the group isomorphism we gather that


    ```

    $y \in P \mapsto f^{-1}(y) = (a, b)^N = (Na, b^N) = (0, b^N)$

    ```


    where $(a, b) = f^{-1}(x)$ with $x \in \mathbb{Z}_{N^2}$ such that $y = x^N \pmod{N^2}$.
    As a result, we have that any $y \in \mathbb{Z}_N^*$ can be mapped to an element
    in $\mathbb{Z}_{N^2}$.


    Reciprocally, given $b \in \mathbb{Z}_N^*$, we find that $f(0, b) \in P$. Let
    us start by recalling that, there exists $d \in \{0, \dots, \varphi(N)\}$ such
    that $Nd \equiv 1 \pmod{\varphi(N)}$, and for any $b \in \mathbb{Z}_N^*$, we are
    going to find an $N^{th}$ root of $y = f(0, b)$. Indeed, let $a$ be any element
    in $\mathbb{Z}_N$ and take $x = (1+N)^{ad} \pmod{N^2}$. Clearly, $f^{-1}(x^N)
    = (Na, b^N) = (0, b)$.


    Thus, $P$ can be seen as the set


    ```

    $\{b \mid b \in \mathbb{Z}_N^*\}$

    ```


    The above proves that $P$ is of size $\varphi(N)$, whereas $\mathbb{Z}_{N^2}$
    is of size $N\varphi(N)$. Moreover, we have identified all $N^{th}$ roots of any
    $y \in P$; those corresponding to pairs $(a, b)$ $a \in \mathbb{Z}_N$ for $b$
    such that $f^{-1}(y) = (0, b)$.'
