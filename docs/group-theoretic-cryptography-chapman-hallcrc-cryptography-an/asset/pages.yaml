  md: '# Basics greater than complexity


    19


    correct with probability greater than 1/2, we speak of the *probabilistic polynomial*
    (class *RP*). Further, the class *BPP* is informally the capturing the case when
    $\mathcal{A}$ is randomized and both the “yes” and “no” answers are correct with
    probability greater than 1/2.


    Another twist of the above notion which is particularly relevant in cryptography,
    is the case for which a *different* algorithm solves the problem depending on
    the instance input size.


    **DEFINITION 2.2 [Non-uniform polynomial time]** A decision problem $P$ is solvable
    in non-uniform polynomial time (denoted $P \in P''\setminus Poly$) if there exists
    a polynomial $p(n)$ and a sequence of algorithms $\{A_n\}_{n\in I}$, for some
    index $I \subseteq \mathbb{N}$ such that an instance of $P$ has length bounded
    by $n \in I$, $A_n$ outputs a correct answer bounded by $p(n)$.


    It can be proved that both the class $\mathcal{P}$ and the class *BPP* are contained
    in $\mathcal{P}\setminus Poly$.


    **DEFINITION 2.3 [The class NP]** A decision problem $P$ is in the class $\mathcal{NP}$
    if given any instance of $P$ an evidence establishing the “yes” answer can be
    checked with a polynomial time algorithm.


    Clearly, we have $\mathcal{P} \subseteq \mathcal{NP}$, but one of the most bewildering
    open problems in theoretical computer science is whether both classes are actually
    equal or not.


    Another important concept is that of polynomial reduction. Informally, we say
    a problem $P_1$ reduces to a problem $P_2$ in polynomial time provided that there
    exists an algorithm for $P_1$ which uses polynomially many calls to a $P_2$-oracle.
    At this, *oracle* is an algorithm that given the input of a $P_2$ provides its
    solution (without revealing anything, i.e., in a black-box manner). Typically,
    the time taken by the oracle for the algorithm is not taken into account when
    evaluating the resources of the algorithm for solving $P_1$. An important issue
    is whether the reduction is or not *tight*. The informal idea is that a tight
    reduction states that $P_1$ and $P_2$ have essentially the same complexity, and
    thus a solution for $P_2$ is effective to solve $P_1$. If the reduction is not
    tight it may happen that the algorithm we construct for $P_1$ using $P_2$ as a
    black box is atrociously; so an efficient algorithm for $P_2$ may not be too helpful
    in practice to solve $P_1$. Using the notion of polynomial reduction, we may define
    another relevant class.


    **DEFINITION 2.4 [NP-complete problems]** A decision problem $P$ in $\mathcal{NP}$
    is said to be $\mathcal{NP}$-complete if every other problem in $\mathcal{NP}$
    can be reduced to $P$ in polynomial time.'
