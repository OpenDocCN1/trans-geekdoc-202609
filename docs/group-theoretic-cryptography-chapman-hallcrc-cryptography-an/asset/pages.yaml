    # 6.3.2 Some computational problems in the braid group $B_n$


    One of the reasons for the appeal of braid groups as a costly platform for cryptography
    lies in the availability of convenient normal forms—it is possible to compute
    efficiently a unique representation of a group element. Such a property may seem
    a trivial when thinking of common representations of multiplicative subgroups
    of a finite field or of subgroups of an elliptic curve, but in the context of
    finitely presented groups this is a remarkable feature. In particular, a normal
    form that can be computed efficiently enables an efficient solution of the word
    problem, and when we can identify group elements with their normal form.


    **The word problem in $B_n$.** Different normal forms have been explored in the
    literature, and what we discuss here is *Garside normal form*—named after Frank
    A. Garside—or *greedy normal form* for braid groups can be found, for instance,
    in work by Epstein et al. [ECH92] and Birman et al. [BKL08].


    $B_n^+$ denote the monoid of *positive braids*, i.e., the *monoid* generated by
    the Artin generators $\sigma_1, \dots, \sigma_{n-1}$. In other words, $B_n^+$
    consists of $n$ strands that can be expressed as a finite word in the Artin generators
    without involving any inverses $\sigma_i^{-1}$. An important example of a positive
    braid is the *fundamental braid*, which plays a central role in the computation
    of the greedy normal form.


    # **DEFINITION 6.5 [Fundamental braid]**


    The fundamental braid $\Delta_n$ in $B_n$, is defined as


    $\Delta_n = (\sigma_1 \dots \sigma_{n-1})(\sigma_1 \dots \sigma_{n-2}) \dots \sigma_1$


    A concrete example, Figure 6.7 shows the geometric interpretation of the fundamental
    braid $\Delta_4$.


    A second concern for the Garside normal form are so-called *permutation braids*—restricting
    the above-mentioned epimorphism $\phi : B_n \to S_n$ to permutation braids results
    in a bijection of sets. In particular, there are exactly $n!$ permutation braids,
    and these are in one-to-one correspondence with the permutations of $1, \dots,
    n$. To give a precise definition, it is helpful to introduce some terminology;
    we call a braid $b_2 \in B_n$ a *prefix* of a braid $b_1 \in B_n$ and write $b_2
