  md: "# # Chapter 7\n\n# ## Block ciphers\n\nWhen large amounts of data have to be\
    \ encrypted, public-key encryption is often considered as being too slow. High-speed\
    \ solutions for encryption are commonly realized by means of cryptographic primitives\
    \ that assume that the encrypting and decrypting party possess a common secret\
    \ key. To establish such a common secret key across a public network, encryption\
    \ as discussed in Part II can be invoked to transport a symmetric key. Alternatively,\
    \ a dedicated solution for key establishment can be used, which may offer additional\
    \ advantages (cf. Chapter 9).\n\nArguably the most important building blocks within\
    \ symmetric cryptography are so-called block ciphers.\n\n**DEFINITION 7.1 [Block\
    \ cipher]** Let $k$ and $n$ be positive integers. Then a block cipher with key\
    \ length $k$ and block size $n$ is a family of permutations $\\{Enc_K : F_2^n\
    \ \rightarrow F_2^n | K \\in F_2^k\\}$, i.e., each $Enc_K$ can be regarded as\
    \ an element of the symmetric group $S_{2^n}$.\n\nDiffering from the situation\
    \ for public-key encryption, for block ciphers it is common to have no provable\
    \ reduction from a security claim to a (hopefully plausible) mathematical hardness\
    \ assumption available. Offering strong security guarantees under plausible hardness\
    \ assumptions and meeting the efficiency needs of high-speed or low-cost applications\
    \ remains a design challenge. The so-called ideal cipher model captures the intuition\
    \ behind a good block cipher: the ideal cipher is abstracted by the choice for\
    \ each $K \\in [0, 1]^k$ of the corresponding $Enc_K$ uniformly at random in $S_{2^n}$.\
    \ A typical choice for the block length is $n = 128$, making it completely impractical\
    \ to write down a random permutation in $S_{2^n}$. For a well-designed block cipher,\
    \ there should be no efficient way to make this distinction, however, as long\
    \ as the secret key $K$ remains completely unknown."
