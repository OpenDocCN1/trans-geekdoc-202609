- pgno: 21
  md: '# Chapter 1


    # Mathematical background


    Let us start by reviewing some basic mathematical definitions and facts which
    are needed for smoothly going through this book. Our approach here is rather minimalistic
    in nature, and those who are willing to know a bit more mathematics (which will
    indeed be helpful) are directed to a number of texts and readings at the end of
    this chapter.


    # 1.1 Algebraic structures in a nutshell


    Throughout we assume familiarity with basic set-theoretic concepts and use standard
    notation for operations (union, intersection, difference, cartesian product) and
    terminology (subset, empty set, cardinality). When needed, the symbol description
    at the beginning of the book can serve as a reminder of common notations.


    > **DEFINITION 1.1 [Equivalence relation]** *Let X be a set and R a subset of
    X \times X. Given x,y \in X, let us write xRy instead of (x,y) \in R. We say R
    is an equivalence relation on X provided that all of the following hold:*


    i. *xRx for all x \in X (reflexivity),*

    ii. *for all x,y \in X if xRy, then yRx (symmetry),*

    iii. *for all x,y,z \in X, if xRy and yRz, then xRz (transitivity).*


    An equivalence relation on a set X induces a partition of X, i.e., a decomposition
    of X into disjoint subsets, each consisting of elements. We refer to these subsets
    as *equivalence classes*. When R is clear from the context, it is common to simply
    write [x] for the equivalence class


    ```

    [x] = {y \in X | xRy}

    ```


    of element x. The set comprised of all equivalence classes is called *quotient
    set of X by R* and denoted by X/R.'
