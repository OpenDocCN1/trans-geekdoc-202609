  md: '# Public-key encryption using infinite groups


    At CRYPTO ''84 Wagner and Magyarik suggested the use of the above-mentioned word
    problem in finitely presented groups as a starting point to build an encryption
    scheme [WM85]. Similar ideas gave rise to other encryption schemes, on which we
    will comment later in this section. In particular, we see that the Polly Cracker
    proposal by Fellows and Koblitz [FK24] can be viewed as a proposal within this
    framework.


    Wagner and Magyarik''s encryption scheme was introduced in a radical conceptual,
    generic way as depicted in Figure 6.1.


    +   K: on input a security parameter, produces:

    - a finite presentation (X, R) of a group G for which the word problem is considered
    to be hard;

    - a subset S ⊆ (X ∪ X⁻¹) such that for the quotient G, specified by (X, RS), the
    word problem can be solved efficiently by means of an algorithm S;

    - a set W(Σ) = {w_σ | σ ∈ Σ}, contained in X ∪ X⁻¹ that if σ ≠ τ, then w_σ and
    w_τ are neither equivalent over G nor over G. At this, σ is the (finite) plaintext
    space.ᵃ


    The public key of the presentation (X, R) and the set W(Σ), sets S (specifying
    the quotient G) constitutes the private key.


    E: on input the public key and a plaintext symbol σ ∈ Σ, w = w_σ and rewrites
    this w using the public relations specified by R, yielding the ciphertext.


    D: recovers the plaintext to indicate an input word (w, w_σ) by running S with
    the input pairs for all σ ∈ Σ.


    > One can think of Σ as plaintext alphabet with words over Σ being encrypted by
    letter (cf. Exercise 27).


    FIGURE 6.1: Wagner and Magyarik encryption scheme—generic proposal.


    As authors pointed out, some care must be taken in the key generation procedure
    in order to avoid very simple attacks to the above scheme: clearly, it must be
    the case that most quotient groups of G with easy word problems all the words
    in W(Σ) collide, i.e., represent the same group element. Further, more subtle
