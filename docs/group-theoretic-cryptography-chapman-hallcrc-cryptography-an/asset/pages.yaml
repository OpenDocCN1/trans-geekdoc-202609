  md: '# Chapter 5


    # Public-key encryption in the standard model


    In Section 4.2 we have seen that security in the sense of IND-CCA equivalent to
    security in the sense of NM-CCA, whereas for adversaries which are restricted
    to chosen plaintext attacks, non-malleability is not implied by ciphertext indistinguishability.
    Thus, if we aim at boosting the security of a public-key encryption scheme that
    it withstands chosen ciphertext attacks, a plausible strategy is to append a “proof
    of integrity” during the encryption process. Namely, by part of the ciphertext
    a tag is included, that ensures the ciphertext was properly constructed and not
    produced by cleverly tampering with known ciphertexts. This “proof of integrity”
    may be derived using random oracles (as is the case in the Bellare-Rogaway construction
    from Figure 4.8, but as we will see in this chapter it is also possible to avoid
    their


    Ronald Kramer and Victor Shoup presented in 1998 the first efficient public encryption
    scheme that could be proven IND-CCA secure in the standard model under a possible
    number theoret assumption [CS98]. A few years later, the same authors introduced
    in [CS02] a new paradigm for constructing IND-CCA secure encryption schemes using
    universal hash proof systems for languages. This, in particular, allowed for the
    construction of the aforementioned “proofs of integrity” without random oracles,
    and this 1998 construction is an instantiation of this paradigm. In this chapter
    we go through the main results in these two papers, and moreover discuss a way
    to adapt their ideas to work with non-Abelian groups.


    # 5.1 The Cramer-Shoup encryption scheme from 1998


    We start by formalizing a type of collision resistance, which one expects a cryptographic
    hash function mentioned in Section 4.3 to satisfy. As for any fixed non-injective
    function $f$ there is always an efficient algorithm $A_f$ that can output a collision
    for $f$ (cf. Exercise 56), instead of discussing collision resistance of a single
    function we look at a family of functions.'
