  md: '# Public-key encryption in the standard model


    # 5.2.2 Subset membership problems


    Another tool in Cramer and Shoup''s general construction are so-called subset
    membership problems, which naturally capture indistinguishability properties—the
    latter lying at the heart of a number of cryptographic constructions. To avoid
    getting very technical in this introductory text, in the sequel we only give a
    somewhat informal description of what is meant by a subset membership problem,
    and also describe informally they can link together with projective hash families
    in which we are hash proof systems.


    Many cryptystems base their security in the sense of IND-PA or IND-CCA on the
    decisional Diff-Hellman assumption which we saw earlier (Definition 4.1) being
    a prominent example. Another example is the quadratic residues (QR) assumption
    which captures the task of deciding whether an element of the unit group $Z_N^*$
    with a composite natural number $N$ has a root. Many of these problems can be
    formulated in terms of indistinguishability of probability distributions.


    Since countless assumptions are complexity theoretic statements in nature, a complexity
    parameter $l \in N$, is taken into account. Also, for each value of $l$, we have
    several possible instances of the problem; the (random) choice of a particular
    instance for complexity parameter $l$ is modeled by a probability distribution
    $L_i$. To describe a subset membership problem, we also consider a probabilistic
    polynomial time algorithm, called the instance generator, which on input $i$,
    outputs a description $i$ of a set $X_i$, and a subset $L_i \subseteq X_i$. The
    instance generator also outputs a witness $W_i$ whose elements provide "proofs
    of belonging" to the elements in $L_i$, given $x \in L_i$, there is always a $w
    \in W_i$ that can be used to prove that $x$ belongs to $L_i$. Thus, there is a
    binary relation $R \subseteq L_i \times W_i$ inherent to each instance (described
    by $i$).


    Given the above, we are ready to prepare a subset membership problem $M$ by means
    of the collection of distributions $(L_i)_{i \in N}$ together with some sampling
    and verification algorithms (see [CS02]).


    +   * sampling according to the distribution $L_i$,


    +   * deciding, on input instance $i$, whether a given input element $x$ is actually
    in $X_i$,


    +   * selecting uniformly at random, on an input $i$, an element $x \in L_i$ and
    a witness $w \in W_i$ for it.


    A subset membership problem $M$ is hard if the probability distributions $(i,
    x)$ and $(i, x'')$, where $i$ is the input of the instance generator and $x, x''$
    are uniformly distributed on $L_i$ and $X_i \setminus L_i$, respectively, are
    polynomially indistinguishable. The following example relates the encryption scheme
    discussed in the previous section to the hardness of a subset membership problem.'
