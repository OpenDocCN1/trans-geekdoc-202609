    4.2 and such that knowing the factorization $h\in G$ along $\alpha$ is equivalent
    to knowing $\log_g(h)$.


    **Exercise 33** Suppose that $G$ is a finite group and $H$ a normal subgroup of
    $G$ such that both $H$ and $G/H$ have a logarithmic signature meeting the length
    bound in Proposition 4.2. Prove that $G$ has a minimal length logarithmic signature
    as well. Conclude that the smallest group for which no minimal length logarithmic
    signature exists (if there is such a group) has to be simple.'
