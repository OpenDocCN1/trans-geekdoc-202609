  md: "# Solutions to selected exercises\n\n**Solution to Exercise 23.** Indeed, suppose\
    \ Alice may construct a pair $(v', r') \\neq (v, r)$ so that $g^v h^r = C = g^{v'}\
    \ h^{r'}$, then $v'+lr \\equiv s \\pmod q$ and as a result $l \\equiv \\frac{v-v'}{r-r'}\
    \ \\pmod q$. Note that, as $q$ is prime and $r \\neq r'$, $r-r'$ is a unit in\
    \ $\\mathbb{Z}_q$.\n\n# A.2 Solutions to selected exercises of Part II\n\n**Solution\
    \ to Exercise 24.** It is easy to see that the security of the proposed two variants\
    \ of the Bellare-Rogawayay construction (Figure 4.8) is by no means as high as\
    \ that of the original construction:\n\n+   **BR-\\\\alpha** $\\mathcal{E}$. on\
    \ input $(pk, m)$, where $m \\in \\{0, 1\\}^ell$, selects uniformly at random\
    \ a value $r$ in $X$ and computes\n\n```\n$x = f(r), y = m \\oplus G(r)$ and $z\
    \ = H(m)$\n```\n\nIt is clear that the scheme is not IND-CPA: an adversary, getting\
    \ the encryption corresponding to a message $m_b$ as part of the challenger value\
    \ $H(m_b)$. As holds $m_0$ and $m_1$, he can simply hash and compare for deciding\
    \ with overwhelming success probability that the plaintexts corresponds to the\
    \ cipher text.\n\n+   **BR-\\\beta** $\\mathcal{E}$. on input $(pk, m)$, where\
    \ $m \\in \\{0, 1\\}^ell$, selects uniformly at random a value $r$ in $\\{0, 1\\\
    }^ell$ and computes\n\n```\n$x = f(r), y = m \\oplus G(r)$ and $z = H(r)$\n```\n\
    \nIn this case it is easy to see that, in the absence of a decryption oracle,\
    \ an adversary can construct new ciphertexts from an eavesdropped one. Consequently,\
    \ the scheme is no longer secure in the sense of NM-CPA. Indeed, just adding (modulo\
    \ 2) any bitstring $\\tilde{m}$ of the appropriate length to the $y$-part of the\
    \ ciphertext leads to a valid encryption of $m \\oplus \\tilde{m}$.\n\n**Solution\
    \ to Exercise 26.** The key point behind the solution is to take any IND-CPA encryption\
    \ scheme with a “\\small” message space. As the success probability of the adversary\
    \ will always be lower-bounded by $\\frac{|M_t|}{|M|}$, if we have $|M_t| \\geq\
    \ p(lell)$ for a polynomial $p$, we get the non-negligible bound.\n\n**Solution\
    \ to Exercise 28.** The adversary holds $(g^\\beta, g^{\\alpha}.m)$. Inverting\
    \ components, he simply constructs $(g^{-\\beta}, g^{-\\alpha\\beta}.m^{-1})$\
    \ which is a valid encryption for $m^{-1}$."
