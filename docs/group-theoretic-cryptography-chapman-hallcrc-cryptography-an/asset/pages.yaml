  md: '# Cryptology: An introduction


    of rotor machines—invented in the 1920s which played a central role in World War
    II. Several different variants of this machine were used, but basically Enigma
    implemented different substitution ciphers using moving rotors, which resulted
    in a 26-alphabet polyalphabetic substitution cipher per rotor. We will not go
    into the specifics of the fascinating history of Enigma and its cryptanalysis
    here, but let us at least take a brief look at how rotors are combined to implement
    a polyalphabetic substitution.


    # Example 3.1


    Given five rotors indexed with alphabets in the order


    ```

    EKMLFGQDQVZNTHXUSPABRCJ

    ADJKSIRUXBLWTMCQZNPYFVOE

    BDHFJLCPRTXZNYEIGWAKMUSQO

    ESOVPJZAYQUIRHXLNFTGKDCDMWB

    VZBRGITYUPSDNHLXAWMJQOFFECK

    ```


    a machine like the Enigma is, say, ever, initialized with three of them in a certain
    position. For instance we may encode the following initial position as CRE:


    ```

    CQZNPYFVOEAJDJKKSIRUXBLHWTM

    RTXVZNYEIGWAKMUSQOBDFHJJLCP

    ESOVPJZAYQUIRHXLNFTGKDCDMWB

    ```


    Then, we encrypt the letter A it will first go through the first rotor and encode
    as C, then it will go to X from the second rotor and finally it will come out
    encrypted as M. The Enigma involved a special type of rotor, a reflector, which
    implemented a fixed-point permutation and was used to send the "intermediate ciphertext"
    a second time through the rotors—in reverse order. Each time the first rotor acted,
    its initial position (changed by a ring hitting notch), and this would have an
    effect on the position of the second rotor, which likewise influenced the position
    of the third rotor. For the Enigma machine, a plugboard offered a further refinement.
    It induced a swap of two letters on each encryption/decryption. All these settings
    translate into a key space that even by today''s standards is rather substantial,
