    ALGORITHM 7.1 AES encryption

    Input: $m \in \mathbb{F}_2^{128}$

    secret key $K \in \{0,1\}^{128} \cup \{0,1\}^{256}$

    Output: $ciphertext \text{AES}_K(m) \in \mathbb{F}_2^{128}$


    +   1. Apply the key schedule to $K$ to obtain session keys $key_0, \dots, key_{r-1}$.

    2. Initialize the internal state $S \leftarrow \iota(m)$.

    3. Update the internal state to $S \leftarrow$ AddRoundKey($S, key_0)

    4. For $i=1,\dots,r$ update the internal state

    $S \leftarrow$ AddRoundKey(MixColumns(ShiftBytes($S))), key_i).

    5. Update the internal state to $S \leftarrow$ SubBytes($S$).

    6. Update the internal state to $S \leftarrow$ ShiftRows($S$).

    7. Update the internal state to $S \leftarrow$ AddRoundKey($S, key_r$)

    8. Return $AES_K(m) = \iota^{-1}(S)$ as ciphertext.


