    to that of the whole RSA problem. This is due to a property of the RSA function,
    called *random self-reducibility*; namely, it is possible to compute a concrete
    preimage of a given value, provided that certain (randomly selected in some sense)
    instances of this same problem can be solved.


    # 4.6 One-way functions from non-Abelian groups?


    Constructions like OAEP or the general Bellare-Rogaway construction offer a mathematically
    luring approach to designing a new public-encryption scheme: if we can use a mathematical
    hardness assumption to derive a (family) of functions with a suitable trapdoor
    one-way property, these constructions take care of the “cryptographic technicalities”
    like chosen-ciphertext attacks.


    With the multiplicative group $Z_n^*$ used in RSA being a special (and from a
    group-theoretic point of view not particularly complicated) group, it is tempting
    to take a look at other (non-Abelian) groups to derive one-way functions that
    can be combined with, e. g., OAEP. Interestingly, this task turns out to be challenging,
    and so far no non-Abelian construction has been accepted within the cryptographic
    research community. In this section we discuss one approach, which builds on the
    public-key scheme known as $MST_i$—proposed by Magliveras, Douglas Stanton, and
    Tran in [MSv072]—and which naturally yields to a conjecture about the existence
    of certain types of factorizations of finite groups.


    # DEFINITION 4.12 [Logarithmic signature of a finite group]


    Let $G$ be a finite group and denote by $\alpha = [\alpha_1, \dots, \alpha_s]$
    a sequence of length $s \in \mathbb{N}_0$, where each block $\alpha_i = [\alpha_{i0},
    \dots, \alpha_{ir_i-1}] \in G^{r_i}$ is a sequence of $r_i \in \mathbb{N}_0$ group
    elements.'
