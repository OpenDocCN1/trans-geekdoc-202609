    Cayley hashes have a remarkable (homomorphic) property in regard to concatenation—for
    any inputs $m_1, m_2$ we have $h(m_1||m_2) = h(m_1)\cdot h(m_2)$. Moreover, the
    evaluation of such a hash function is straightforward, as multiplication in $G$
    is associative. Differing from Merkle-Damgård design with a compression function
    shown in Figure 8.1, making use of available processors to speed up the hashing
    process is quite obvious. By bringing this appealing idea to use, one has to fix
    group generators and a concrete representation.


    One of the most prominent constructions in the Cayley hash functions is due to
    J.-P. Tillich and G. Zémor dates back to the end of the 20th century [TZ94]. The
    platform used in this proposal is the special linear group $SL_2(\mathbb{F}_{2^m})$
    of $2 \times 2$ matrices with determinant 1 over a binary field $\mathbb{F}_{2^m}$.
    The size of this group computes to $2^{3m}-2^m$, and the proposed values for $m$
    are (prime numbers) in the range $130 \leq m \leq 170$. A motivation for choosing
    $m$ to be prime is to thwart attacks that make use of intermediate fields between
    $F_2$ and $\mathbb{F}_{2^m}$. Using a polynomial basis representation, one can
    represent elements in $SL_2(\mathbb{F}_{2^m})$ compactly as a sequence of four
    $\mathbb{F}_{2^m}$-elements. Exploiting the determinant of each matrix is 1, one
    can try to reduce the size of hash values even further.


    Let us write $\mathbb{F}_{2^m} = \mathbb{F}_2[x]/(f(x))$ with an irreducible polynomial
    $f(x) \in \mathbb{F}_2[x]$ of degree $m$, and let $\alpha \in \mathbb{F}_{2^m}$
    be a root of $f(x)$. With this, the generators specified by Tillich and Zémor


    > $g_0 = \begin{pmatrix} \alpha & 1 \ 1 & 0 \end{pmatrix} \text{ and } g_1 = \begin{pmatrix}
    \alpha & \alpha+1 \ 1 & 1 \end{pmatrix}$.


    By construction, multiplication with one of these matrices can be implemented
    quite efficiently, making this hash function a rather interesting proposal. Unfortunately,
    more than a decade after the hash function was published, Grassl et al. demonstrated
