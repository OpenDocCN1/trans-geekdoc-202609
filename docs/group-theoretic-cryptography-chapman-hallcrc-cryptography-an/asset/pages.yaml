  md: 'As a result, it is possible to translate group-theoretic properties of simple
    building blocks into cryptographic robustness for practical purposes.


    # 5.6 Summary and further reading


    In this chapter we have


    +   - presented the public-key encryption scheme of Cramer and Shoup from 1998,
    which offers IND-CCA security in the standard model, and detailed its corresponding
    security proof.


    +   - introduced the basic tools behind the general Cramer and Shoup construction
    for achieving schemes with security in sense of IND-CCA, namely *projective hash
    families, subset membership problems*, and the tool to combine them suitably:
    *hash proof systems*.


    +   - sketched the general Cramer and Shoup construction from 2002, as well as
    a concrete instantiation of it.


    +   - elaborated on ways to adapt the Cramer and Shoup framework for using non-*Abelian
    groups* as a base. As a main tool to this aim we introduced *group action systems*.


    The main results and schemes from this chapter are taken from the original papers
    of Cramer and Shoup [CS98, CS02]. The non-Abelian adaptations from [GVMS05, GVV08].
    For the reader who is interested in reading about other applications of projective
    hash families within cryptography, the literature offers quite a number of illustrations
    of this technique; some examples are due to work by Kurosawa and Desmed (hybrid
    encryption [KD04]), Gennaro and Lindell (password-authenticated key exchange [GL06]),
    Halevi and Kalai (oblivious transfer [TK05, HK12]), and Abdalla et al. (commitment
    schemes [ACP09]). This list already indicates that, despite the technical details
    that have be taken care of, projective hash families have established themselves
    as an important tool in cryptographic protocol design.


    Furthermore, in this chapter we have taken a look at the importance of different
    types of hash function families, which are nowadays at the core of many cryptographic
    constructions. One of the seminal papers pointing out the relevance of universal
    hashing is due to Naor and Yung [NY89].'
