  md: '# Public-key encryption in the standard model


    mapping. We say that $\mathcal{H} = (\mathbf{H}, K, X, L, S, \alpha)$ is a projective
    hash family for $(X, L)$—short, a $PHF$—if all $k_1, k_2 \in K$ and for all $x
    \in L$ the equality $H_{k_1}(x) = H_{k_2}(x)$ holds if and only if $\alpha(k_1)
    = \alpha(k_2)$.


    The above definition can be stated equivalently by saying that for all $k \in
    K$ the action of $H_k$ on $L$ is completely determined by $\alpha(k)$. Note, however,
    that this does not imply that $\alpha(k)$ suffices to compute $H_k(x)$ for any
    $x \in L$; additional information may be required in order to do so.


    # Example 5.1


    Let $G$ be a finite non-abelian group, $x \in G$ and $L=C_G(x)$, i.e., $L$ is
    comprised of exactly those group elements $y \in G$ that satisfy $xy=yx$. Now,
    consider a finite index set $K \subseteq \mathbb{N}$ and define for each $k \in
