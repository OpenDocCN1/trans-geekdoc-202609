    A strategy of the early days was to assume that the encryption method was unknown
    to a potential adversary, but it was soon realized that this asumption should
    not be vital for security. Rather than having to rely on the assumption that an
    adversary cannot capture a device that is used for encryption or decryption, security
    should be based on the fact that a shared key is known to the adversary. This
    idea (together with some other statements towards good cryptographic practice),
    was made concrete by Auguste Kerckhoffs in the nineteenth century in a principle
    that has been named after him [Ker83];


    > Il faut qu''il n''expire le secret, et qu''il puisse sans inconvenient tomber
    entre les mains de l''ennemi;


    An approximate translation to English offered by Fabian Peticolas [Nic14] that
    is [the system must not require secrecy and can be stolen by the enemy without
    causing trouble. Encryption transformations until the twentieth century essentially
    combined two types of strategies:


    +   **Substitution:** Each letter of the plaintext alphabet is substituted by
    a letter from the ciphertext alphabet via a secret rule (the key). Note that the
    two alphabets may very well coincide. The simplest way to do so is the so-called
    shift cipher, where each letter of the plaintext alphabet is replaced by the one
    located k in the same alphabet (wrapping around the end of the alphabet in the
    obvious way), $k$ being the secret. Julius Caesar was known to use this method
    with $k=3$. Another example is the *Vigenère cipher* from the sixteenth century,
    which applies several different substitution rules at the same time, thus being
    called a polyalphabetic substitution cipher.


    +   **Permutation:** The plaintext words are parsed into subwords—say, of length
    $t \in \mathbb{N}$, whose characters are permuted by a secret permutation $\sigma
    \in S_t$. A simple example in which the complete text is permuted is the spartan
    *scytale* (500 B.C.); it is formed by a ribbon that is wrapped around a dowel
    of a particular (secret) diameter and length. The plaintext is written on the
    ribbon around the dowel, so that, hopefully, a dowel of the same diameter (which
    is actually the key) is needed to read off the message.


    It is clear that such basic strategies, would not hide the language statistics
    sufficiently, and as a result these historical methods become insecure when encrypting
    natural language and sufficient amount of ciphertext are available. Notwithstanding
    this, until the day of symmetric encryption schemes makes extensive use of (more
    or less sophisticated) substitution and permutation techniques.


    Substitution ciphers were mechanized, achieving remarkable robustness. A famous
    example is the *Enigma*, a rotor machine—or more accurately a family'
