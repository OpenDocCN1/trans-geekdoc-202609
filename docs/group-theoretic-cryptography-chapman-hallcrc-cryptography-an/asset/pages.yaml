    have to be taken into account, but there are also implementation-level imperatives,
    which, if neglected, may lead to failure of a nice mathematical idea.


    # 4.7 Summary and further reading


    In this chapter we have


    +   - introduced the basic formal definitions related to public-key encryption,
    some fundamental security notions for encryption schemes as well as one-way (trapdoor)
    function families.

    - presented the random oracle model and a generic construction of a secure scheme
    achieving IND-CCA security in this model. This allowed us to see a first proof
    using the game-hopping technique.

    - discussed a method for developing IND-CCA secure schemes from the above construction
    using a base group-theoretic problem: factoring with respect to logarithmic signatures
    of finite groups. The problem of finding logarithmic signatures of minimum length
    (as an example of a group-theoretic question arising from a cryptographic context).


    For a brief survey on provable security for public-key encryption and signature
    schemes, see [CCD05, Chapter D] by D. Pointchev. Game hopping proofs may be intricate
    for the inexperienced reader; V. Shou’s tutorial on this technique [Sho04] can
    be highly recommended. Another interesting (and rather controversial) writing
    is that of [KM07], an informal exposition and critique of the provable security
    paradigm presented.


    For readers interested in knowing more about the random oracle model, besides
    looking at the seminal paper [BR93] in which it is introduced, it is indeed worth
    reading the work of Canetti et al. [CGH04]. In this paper, the'
