    **FIGURE 4.6:** Relations among different security notions.


    **REMARK 4.4** Different security notions are cined for modeling adversaries with
    somewhat weaker oracles than the CCA one. A relevant example is the one capturing
    the so-called *reaction attacks*. In that scenario, we assume the adversary has
    access to a *validity checking oracle* which on input of a public key and a (presumably
    valid) ciphertext will determine if the ciphertext is consistent with the input
    key and the encryption algorithm. Such an oracle, as we will have the chance to
    see later, is quite effective against a number of schemes (see [HGS99]).


    Figure 4.6 illustrates implications among different security notions and particularly
    for adaptive ciphertext attacks, imposing security against "malleability attacks"
    is equivalent to imposing security in the sense of ciphertext indistinguishability.
    While IND-CCA is not the strongest security notion for a public-key encryption
    scheme, it is to say that it is the most common one. Its equivalence to NM-CCA
    may be taken for an indication that a "natural" class of public-key encryption
    schemes is captured by this notion. This intuition is backed by the observation
    that a seemingly different characterization of secure public-key encryption has
    turned out to be equivalent to IND-CCA security as well.


    Before looking at to build public-key encryption schemes meeting this level of
    security, let us present an example of the proposed public-key encryption scheme
    which has similarity with the ElGam encryption scheme, but builds on a non-Abelian
    setting. The cryptanalytic successes against this proposal provide evidence that
    relying on an informal security analysis comes with a certain risk.


