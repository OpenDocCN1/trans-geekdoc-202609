    In an actual case, one may need more evidencing that a message has been at a certain
    point produced by a user and not modified by some else afterwards. In some cases,
    we need to be sure that throughout the execution of our partners is the one we
    presume foresee. Identification schemes are cryptographic protocols geared towards
    this goal. They can be classified from what they actually use to identify an entity
    or individual ([Mv096]):


    +   * what we know: a cryptographic key is linked inescapably to an identity,
    this is both the case for public-key identification schemes and secret-key challenge-response
    protocols;

    * what they have: entities are identified with a device or token that might produce
    evidence, e.g., a smartcard, a password generator, or a PUF [Pap01];

    * what they are: physical characteristics or involuntary actions (like hand-written
    signatures or gait) are used for identifying individuals. **Biometrics** are used
    with these methods.


    We define public-key identification schemes informally, as we will only provide
    some examples and the formalization of security notions (which is better introduced
    in the context of *zero-knowledge proofs*). Proofs of knowledge (typically interactive)
    protocols in which a certain user gives irrefutable assurance of his knowledge
    of a "critical" piece of information to another. It is desirable that this interaction
    reveals as little as possible about the secret whose knowledge is being assessed,
    ideally none at all (this is the case in *zero-knowledge proofs*). A detailed
    discussion on these topics can be found in [Gol01, Chapter 4].


    In a public-key identification scheme two entities are involved: a prover P and
    a verifier V. The prover generates a public key/private key pair $(pk, sk)$ and
    uses it to provide evidence of his identity, executing a protocol with the verifier
    (who holds $pk$). Security is perceived in terms of a passive eavesdropper who
    may monitor multiple executions of the protocol, or an active one, who may act
