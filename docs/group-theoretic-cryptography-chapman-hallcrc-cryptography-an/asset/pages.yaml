    **Linearization attacks.** There exist several ways to linearize braid groups,
    i.e., to homomorphically map the braid $B_n$ onto a certain group of matrices.
    The idea of a linearization attack is to solve a conjugacy problem in a matrix
    group and then try to recover a preimage in $B_n$ of the (matrix) solution found.
    This approach is the key idea behind the cryptanalyses in [Hug02, CJ03], which
    more specifically invoke the *Brauer representation* and the *Lawrence-Kramer
    representation* of braid groups. We will learn more about this in Section 9.3,
    where we discuss recently proposed algorithms for violating the security of braid-based
    key exchange protocols.


    # 6.4 Summary and further reading


    With Wagner and Magyarik''s proposal and a subsequent proposal by Birget et al.
    we have seen two attempts to build cryptographic schemes in the context of combinatorial
    group theory. Polly Cracker offers an example of a scheme that is naturally formulated
    in the language of polynomial rings and ideals, that can also be interpreted in
    a group-theoretic framework. For each of these examples we have seen an attack,
    showing that getting from a computationally hard (or even undecidable) problem
    to a cryptographically secure scheme is not a non-trivial challenge. The example
    with Grigorchuk groups that we have seen illustrates the complexity of an algebraic
    structure such is not an adequate indicator for cryptographic strength.


    Braid groups are generally quite appealing, and as we have, the conjugacy problem
    in these groups forms the basis for an ElGamal-like encryption scheme. The obvious
    line of attack against this is to tackle the conjugacy problem, and as indicated,
    various approaches to this problem have been proposed, resulting in analytical
    successes. Outside cryptography, the theory of braid groups has a long history,
    and for the reader who would like to learn more about the mathematical theory
    of braids, a text-book by Murasagi and Kurpita [MK99] can serve as a starting
    point, for instance. On the cryptographic side, much of the initial optimism in
    using braids for deriving secure public-key encryption schemes has been lost,
    but the rich algebraic structure of $B_n$ remains tempting. The surveys by Dehornoy
    [Deh04] and Garber [Gar07] are good starting points for learning more about cryptographic
    uses of the braid group that have been considered. A more detailed description
    of length attacks against a (generalized) conjugacy problem can be found in [GKT+06].


