    Group theory does not play a prominent role in the analysis of block ciphers,
    and in this book we do not explore the details of the design of block ciphers.
    For readers who would like to get more acquainted with the design of block ciphers,
    *The Block Cipher Companion* by Knudsen and Rogshaw [KR11] can serve as a starting
    point. For the specific case of AES, a book by the authors of the algorithm offers
    insight into the underlying design choices [DR02].


    The round-based construction of AES is very typical for a block cipher, and having
    in mind the ideal cipher abstraction we mentioned earlier, a question with group-theoretic
    nature arises quite naturally. When we iterate over all possible session keys,
    which permutations on the plaintext space can we realize in this way? For AES
    specifically, we have a plaintext space of $2^{128}$, and in the ideal cipher
    model a session key results in a uniform random selection of all $2^{128}!$ possible
    permutations on this plaintext'
