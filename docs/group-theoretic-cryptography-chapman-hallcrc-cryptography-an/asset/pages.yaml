- pgno: 207
  md: '# Signature and identification schemes


    which is one of the most prominent examples of the above generic construction.
    Once a security parameter $\ell$ is fixed, the prover selects uniformly at random
    $N$, a product of two $\ell$-bit prime numbers, and $s \in \mathbb{Z}_N$. The
    prover further


    $t = s^2 \quad (mod N)$


    and publishes $(N, t)$. To prove his identity, he must convince the verifier of
    his knowledge of a square root of $t$, which he achieves by repeating the steps
    depicted in Figure 10.5 many times.


    ![](img/5dc6342114f5ad54877c95d1a661801c_207_0.png)


    FIGURE 10.5: Fiat-Shamir identification.


    In order to evaluate an identification scheme, there are three properties that
    must be carefully analyzed. We describe them informally:


    +   * *Completeness*: if both participants follow the protocol specification,
    the verifier will accept the input provided by the prover with overwhelming probability;


    +   * *Soundness*: anyone who succeeds in impersonating the prover is also able
    to compute his private key from the public information;


    +   * *Zero-Knowledge*: the verifier learns nothing beyond the validity of the
    proof.


    Certainly, completeness is a strict requirement, whereas the soundness and zero-knowledge
    properties can be granted or loosened depending on the application scenario. For
    the basic version of Fiat-Shamir identification in Figure 10.5, completeness is
    straightforward to verify, while soundness comes with a probabilistic argument.
    Namely, if the identification step is repeated $k$ times, the probability of an
    adversary successfully impersonating the legitimate prover is bounded by $2^{-k}
    + P_{sqrt}$, where $P_{sqrt}$ is the probability he has of computing a square
    root of $t$ mod $N$ from the public information.'
