  md: '# Cryptology: An introduction


    developed a few years before James Ellis, Clifford Cocks, and Malcolm Williamson
    at the Government Communications Headquarters in the UK (see a summary of their
    work on the subject [Ill97]). In an asymmetric setting different key material
    is (publicly) distributed to users depending on their role. As a result, key management
    can become simpler, resulting in cheaper and more flexible schemes. Moreover,
    the development of different dedicated cryptographic protocols beyond encryption
    (signature, authentication, identification, etc.) becomes possible. The advent
    of public-key cryptography led to a variety of new methods useful in different
    scenarios, including the use of cryptographic techniques useful outside military
    applications. Today, symmetric and public-key cryptography complement each other
    and cryptographic constructions try to exploit the particular strengths of each.


    # 3.2 Modern cryptography


    The way information is created, stored, and transmitted today has little in common
    with information processing as it was known fifty years ago. Cryptography is used
    every day in modern society, by the average citizen, often obliviously. At the
    same time people are becoming more aware of the dangers of leaving sensitive data
    exposed, and ensuring the confidentiality of data has become a concern not only
    to corporations and governments, but also to individuals. The design of different
    cryptographic tools to meet a wide variety of demanded services is an ongoing
    process. An incomplete list of generic goals to pursue is the following:


    **Confidentiality.** Secure message transmission and message storage is one of
    the main goals of cryptographic constructions, though nowadays multiple scenarios
    are considered beyond “plain” two-party communication we discussed so far. We
    may consider different sender sets that aim at interacting with dedicated receiver
    sets (e.g. *threshold schemes, broadcast schemes*), or message transmission takes
    into account features of the input plaintext in order to enable an efficient management
    of encrypted data (*attribute-based encryption, searchable encryption*). We may
    use public-key encryption schemes in a setting in which public keys are not previously
    distributed, but linked to the users'' identities (*identity-based encryption*),
    or schemes that not only hide the message, but also the keying material used to
    secure it (*key-private encryption*).


    Further, the preservation of data confidentiality can also be a concern when carrying
    out cooperative computations with non-trusted partners; the research area dealing
    with this type of problem is *multiparty computation*.'
