    In order to gain insight on an algebraic structure it is useful to investigate
    the functions that preserve its specific properties.


    **DEFINITION 1.8 [Group homomorphism]** Let $(G, \cdot)$ and $(H, \circ)$ be groups.
    When a function $f : G \longrightarrow H$ is said to be a group homomorphism provided
    that $f(g \cdot h) = f(g) \circ f(h)$, for all $g, h \in G$.


    Group homomorphisms are called *isomorphisms*; if there exists an isomorphism
    from a group $G$ to a group $H$ they are called isomorphic, which actually means
    they can be fully identified, as their underlying structure is identical. Every
    group of finite order can actually be proven to be isomorphic to a permutation
    (group called *Cayley''s Theorem*).


    **Example 1.7** [Permutation groups]


    Let $X$ be a non-empty set. The set of all *permutations on* $X$, with the operation
    being composition, is usually referred to as the *symmetric group on* $X$. Common
    notations are $Sym(X)$, $S_X$, or if $X$ is of cardinality $n \in N$, simply $S_n$.
    The order of $S_n$ is $n!$ and each of its elements can be expressed as a product
    of transpositions, which are bijections that leave elements in $X$ fixed, except
    two of them are swapped. That, given two different selected elements $x_i, x_j
    \in X$, a transposition $(i, j)$ is the bijection on $X$ defined by $(i, j)x =
    x$ for $x_i, x_j$ and $(i, j)x_i = x_j, (i, j)x_j = x_i$. The subset of all permutations
    that can be written as the product of an even number of transpositions is a subgroup
    of $S_X$, the *alternating group on* $X$ and typically denoted by $A_n$, and its
    elements are referred to as even permutations.


    > **REMARK 1.1** To represent elements in a symmetric group $S_n$, cycle notation
    can be convenient, and we will use: if $a_1, \dots, a_r \in \{1, \dots, n-1\}$
    are pairwise disjoint, then we will write $(a_1, \dots, a_r)$ to represent the
    permutation that maps $a_1 \mapsto a_2, a_2 \mapsto a_3, \dots, a_{r-1} \mapsto
    a_r, a_r \mapsto a_1$, and leaves all other elements pointwise fixed. Any permutation
    can be decomposed into a product of disjoint cycles.


