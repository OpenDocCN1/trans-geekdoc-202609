    # 10.4 Summary and further reading


    In this chapter we have


    +   - defined public-key signature scheme, and discussed how to prove them secure
    in the sense of EUF-CMA. As prominent examples we have seen RSA-based constructions
    and DSA;

    - introduced the notion of identification scheme and briefly introduced the generic
    Fiat-Shamir construction;

    - informally described two proposals using braid groups to construct an identification
    scheme.


    There are many different application scenarios the need for a dedicated signature
    procedure arises. Such applications are behind the introduction of group signatures,
    where any member of a specific group is authorized to sign on behalf of the group,
    maintaining a level of anonymity as individual. Ring signatures are a special
    type of group signatures, with the property that any subgroup of users at a certain
    point constitute a new signing without any additional setup. The anonymity of
    users, unlike in group signatures, irrevocable. When designing signatures it may
    also be interesting to impose threshold conditions both at the signing and at
    the verification phase: if we go for threshold signing, a minimum of $t$ out $n$
    users from a group are needed in order to form a valid signature, while any smaller
    coalition is not supposed to create a valid signature or prevent the legitimate
    group from doing so (see, for instance [Sho00]). On the other hand, if the threshold
    phase is at the verification, we wish to enforce that no verifier can gain advantage
    from stating the authenticity of a message before the other group members assess
    its validity [PM97]. Numerous other examples of'
