    # 7.4 Modes of operation


    By design, a block cipher encrypts only a (short) message block of a fixed length
    $n$, and it needs to be clarified what a larger amount of data, or a plaintext
    stream, is to be handled. This is addressed by the *mode of operation* of a block
    cipher. Conceptually it is important to note that a mode of operation treats the
    block cipher as a black box. In the subsequent sections, we will take a brief
    look at a few common ways block ciphers are used when dealing with larger amounts
    of data. More details on these modes can be found in [Dwo01], and it should be
    noted that our discussion of modes of operation is not exhaustive. For instance,
    our discussion does not cover the *Galois/counter (GCM) mode*, which is specified
    in [Dwo07].


    # 7.4.1 Electronic codebook (ECB) mode


    Perhaps the most obvious way to deal with larger amounts of data is to divide
    the data into consecutive pieces which are then encrypted individually, either
    processing one by one, if multiple instances of the block cipher are available,
    several independently in parallel (see Figure 7.5).


