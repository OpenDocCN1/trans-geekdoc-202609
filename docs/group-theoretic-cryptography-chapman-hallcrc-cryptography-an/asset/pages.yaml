- pgno: 243
  md: 'Group theoretic problems have propelled scientific achievements across a wide
    range of fields, including mathematics, physics, chemistry, and the life sciences.
    Many cryptographic constructions exploit the computational hardness of group theoretical
    problems and the area is viewed as a potential source of quantum-resilient cryptographic
    primitives for the future.


    # **Group Theoretical Cryptography** supplies an ideal introduction to cryptography
    for those who are interested in group theory and to learn about the possible interplays
    between the two fields.


    Assuming an undergraduate-level understanding of linear algebra and discrete mathematics,
    the book details the specifics of using non-Abelian groups in the field of cryptography.
    Moreover, it evidences how group theoretic techniques help us gain insight into
    well-known, seemingly unrelated, cryptographic constructions (such as DES).


    The book starts with brief overviews of the fundamentals of group theory, complexity
    theory, and cryptography. Part two is devoted to public-key encryption, including
    provable security guarantees, public-key encryption in the standard model, and
    public-key encryption using infinite groups.


    The third part book covers secret-key encryption. It examines block ciphers, like
    the Advanced Encryption Standard, and cryptographic hash functions and message
    authentication codes. The last part delves into a number of cryptographic applications
    which are nowadays as relevant as encryption—identification protocols, key establishment,
    and signature schemes are covered.


    The book supplies formal security analyses and highlights potential vulnerabilities
    for cryptographic constructions involving group theory. Summaries, references
    for further reading, and exercises are included at the end of each chapter. Selected
    solutions for exercises are provided in the back of the book.


