  md: '# Chapter 9


    # Key establishment protocols


    # 9.1 Setting the stage


    Key establishment (also called key exchange) protocols are cryptographic schemes
    allowing a set of users connected through an insecure communication network to
    agree on a common secret value. This value is typically a secret key that can
    subsequently be used by the set of participants for a variety of cryptographic
    purposes. When attempting to design a key establishment protocol the first relevant
    issues are to consider:


    +   - the number of involved entities; protocols involving only two users are
    simpler than those designed for larger groups. In particular, in larger groups
    a subset of legitimate participants may act cooperatively in a malicious way,
    or users may join/leave the protocol at different steps raising efficiency and
    security concerns;


    +   - the influence different participants have on the output key; key transport
    schemes aim the secure transmission of a key typically generated by a fully trusted
    entity involved in the protocol. On the other hand, key agreement protocols are
    designed in a cooperative way, in the sense that all participants have some influence
    in the final output value;


    +   - the way legitimate participants authenticate themselves; it may be the case
    that the communication network is authentic or may authenticate themselves as
    individuals—e.g., using digital signatures—or as group members—using passwords.


    We have already seen a first example of a key exchange protocol, the Diffie-Hellman
    key agreement from Section 3.1.2. Note that this is a two-party protocol in which
    implicitly is assumed that the communication channel is authenticated. Indeed,
    if this is not the case, a third (malicious) participant may easily mount a middle
    attack; impersonating Bob to Alice and Alice to Bob. As a result, Alice and Bob
    end up with different keying material, which is also owned by Eve may interfere
    in their future communication at will. Denoting by G a public group of order q
    and g a public generator of G, this situation is described in Figure 9.1.'
