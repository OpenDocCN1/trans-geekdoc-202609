    # **THEOREM 3.1 [Security of Rabin encryption]**


    Let $N \in Z$ be the product of the two odd primes $p \neq q$. Let $A$ be an algorithm
    for finding one of the solutions of the equation


    ```

    $y^2 \equiv c \modmod N$

    ```


    in time $T(N)$. Then, there exists an algorithm for factoring $N$ requiring $2T(N)
    + 2\log_2 N$ steps.


    The interested reader can find a proof of the above theorem in the original paper
    [Rab79]. An outline of the proof is as follows: there are four solutions to the
    congruence $x^2 \equiv c \mod N$ which we may denote $k, -k, \nu k, -\nu k$ where
    $\nu$ is a square root of unity, $\nu^2 \equiv 1 \mod N$. Now $m \in Z$ and assume
    $gcd(m,N)=1$. (If we are able to $0 < m < N$ with $gcd(m,N) \neq 1$, then we would
    have found a factor of $N$). Compute, $m^e \mod N$ and feed $A$ with input. If
    $\hat{A}$ outputs a value equal to $m$ or $-m$, discard and start again (this
    happens with probability $1/2$). Otherwise, if the output is $\hat{m}$ we have
    $gcd(\hat{m},N) \neq 1$, it must be a factor of $N$.


