    $r$ in $\mathbb{Z}_q$ (which she may do using the extended Euclidean algorithm).
    Now $cs = \sum_{i=1}^n r_i b_i (mod q)$ and $cs = \sum_{i=1}^n b_i w_i (mod q)$.
    Note that $cs \in \{0, \dots, q-1\}$. The secret message is retrieved using a
    greedy strategy; if $w_n > cs$, then $b_n = 0$, otherwise, $b_n = 1$. Now set
    $cs = cs - w_n b_n$ and do the same with $n-1, n-2$ up to 1. The assumption-under
    Merkle-Hellman encryption is that the (so-called Knapsack) problem is hard; given
    an arbitrary sequence $\beta = (\beta_1, \dots, \beta_n)$ in $\mathbb{Z}_q$ and
    a positive integer $S$, it is hard to compute a $n$-bit string $b_0, \dots, b_{n-1}$
    such that $S = b_0 + \dots + b_{n-1}$.


