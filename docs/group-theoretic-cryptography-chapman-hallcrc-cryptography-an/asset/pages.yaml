    # 5.2.3 Hash proof systems


    A *hash proof system* (HPS) provides a link between a subset membership problem
    and a collection of projective hash families. More precisely, each instance $i$
    of a hash proof system $\mathcal{P}$ will be specified by a corresponding instance
    $(X_i, L_i, W_i)$ of a subset membership and a "matching" instance $(H_i, K_i,
    W_i, \Pi_i, \alpha_i)$ of a projective hash family—plus some efficient algorithms.
    For example, some of the algorithms provided by an instance $i$ are:


    +   * the *private evaluation algorithm*, that on inputs $i \in K$ and $x \in
    X$ outputs $H_k(x)$


    +   * a *sampling algorithm* for $L \times W$, that on input $i$ outputs a random
    $x \in L$ and a witness $w \in W$ for $x$,


    +   * the *public evaluation algorithm*, that on inputs $i, s \in S$, and $(x,
    w) \in \mathcal{R}$ outputs $H_k(x)$, for any $k \in K$ such that $s = \alpha(k)$.


    Notions of $(\varepsilon$-)-universality and $(\varepsilon$-)-smoothness for $\mathcal{P}$
    are directly inherited from those of the underlying projective hash families.
