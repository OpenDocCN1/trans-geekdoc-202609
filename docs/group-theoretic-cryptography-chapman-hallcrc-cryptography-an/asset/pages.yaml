    # 10.3 Identification schemes


    Identification schemes can be seen as special *proof of knowledge*; an entity
    is identified by proving (typically, disclosing as little information as possible)
    knowledge of critical data only this entity is supposed to hold. A general technique
    (due to U. Feige, A. Fiat, and A. Shamir [FFS88]) to derive identification schemes
    is based on one-way functions and essentially builds on the idea that a prover,
    holding a randomly selected value $r$, may publish $y = f(r)$ for a public one-way
    function $f$ and later identify by proving knowledge of an $f$-preimage for $y$.
    The *proof of knowledge* should not disclose any useful information to subsequently
    compute $f^{-1}$. It can actually be formally proved that secure identification
    is possible if one-way functions exist.


    Let us informally describe the so-called Fiat–Shamir identification scheme,'
