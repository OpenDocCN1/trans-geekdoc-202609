  md: '# Group Theoretic Cryptography


    of a block cipher [CG75]. Paterson demonstrated that next to the size of this
    group, more fine-grained properties can be of interest—he demonstrates that a
    weakness can arise if the group generated by the round functions acts imprimitively
    on the message space [Pat99].


    Block ciphers derived from factorizations in finite groups have been explored
    by several authors since the original PGM proposal, including implementation aspects.
    For instance Horváth et al. [HMvT94] report on a hardware implementation of permutation
    multiplication as occurring in PGM and Canda et al. report on software experiments
    [CvTMH01]. It seems far to say, however, that the main interest in these constructions
    is so far within academia. At the time of writing this, AES can be seen as the
    most popular block cipher, but there is interest in alternative designs, especially
    if implementations on platforms with limited hardware resources. One example of
    such a lightweight cipher is PRESENT [BKL07].


    Efficient and secure modes of operation for block ciphers play an important role
    in securing data, and the interest in identifying such modes goes beyond academia.
    Our discussion covered only the most common modes and we focused on the confidentiality
    of the transmitted data. The Galois/Counter Mode (GCM) [Dwo07] briefly mentioned
    in the text, on the other hand, takes the question of authenticity explicitly
    into account well.


