  md: '# # Chapter 6


    # ## Public-key encryption using infinite groups


    In the constructions we have discussed so far, the involved groups have always
    been finite. Thinking of tasks like sampling a random element or bounding the
    size of a ciphertext in advance, dealing entirely with finite sets certainly has
    advantages. Notwithstanding standing this, from the mathematical point of view,
    looking at a wider class of algebraic structures appears natural when looking
    for hard algorithmic questions that may ultimately lead to public-key encryption
    schemes. In infinite groups one quickly encounters questions that cannot be solved
    algorithmically at all. Thus, it is not surprising that a number of authors suggested
    conceptual public-key encryption schemes, which involve infinite groups.


    In this chapter we discuss a number of these proposals, along with problems that
    have been encountered. The task of exploiting algorithmic problems in infinite
    groups to realize public-key encryption with provable security turns out to be
    a challenging one.


    # ### 6.1 The word problem in finitely presented groups


    As in the case for finite groups, we have to pay attention to how the groups we
    are working with are represented. The schemes discussed in the sequel are formulated
    in the language of combinatorial group theory. Roughly speaking, this area of
    mathematics is concerned with the questions that arise when describing a group
    in terms of a set of generators and relators, which play the role of rewriting
    rules. The language induced by such a presentation may, to some extent, be ambiguous,
    and several interesting problems arise when trying to relate the combinatorial
    properties of the language with its underlying group structure.


    **DEFINITION 6.1 [Free group]** *Let X be a set. Then a finite non-empty word
    $w \in (UX^{-1})^*$ over the alphabet $UX^{-1}$ is said to be reduced, if it does
    not contain any bigram $xx^{-1}$ or $x^{-1}x$ with $x \in X$. The group*'
