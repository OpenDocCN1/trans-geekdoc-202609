  md: '# Group Theoretic Cryptography


    should cover a wide range of adversarial strategies and at the same time be enough
    to work with in proofs. Identifying good security definitions is a non-trivial
    task; it is actually an active area of cryptographic research. instance, when
    implementation-dependent aspects like power consumption, running time and electromagnetic
    emanation are to be taken into account, finding adequate theoretical security
    models is not an easy task. Common security definitions typically restrict to
    a large class of “structural” attacks and do not consider adversarial strategies
    that rely on characteristics of a specific implementation platform. This does
    not imply that the chosen formal model is irrelevant, but it is important to be
    aware of the limitations of the guarantees that are established by a proof.


    From a practical point of view, it is desirable that we can characterize the security
    level of an encryption scheme for specific key lengths—instance, we might want
    to know how much of it takes for an attacker to find the plaintext underlying
    the ElGamal encryption based on the multiplicative group $F_{219}$ in a particular
    representation. To simplify the analysis, it can be convenient, however, to define
    formal security notions asymptotically and postpone the (important) discussion
    of specific values of the security parameter to a later stage.


    Different approaches can be taken to express mathematically what we mean by “secure”
    public-key encryption scheme, and it is interesting to note that seemingly different
    paradigms turned out to characterize the same class of public-key encryption schemes.
    In the sequel we follow one of the most common approaches and characterize each
    security notion in terms of a game played by the adversary. We then try to show
    that under certain (hopefully plausible) assumptions for any efficient algorithm
    the probability of winning the game in question is negligible.


    # 4.2 Characterizing secure public-key encryption


    In order to be able to prove statements about the security of a public-key encryption
    scheme, we should specify what we mean by a successful attack. To this aim, we
    detail


    +   - the security goal we want to achieve and

    - the tools that are available to the adversary.


    A obvious security goal is that the adversary should not be capable of recovering
    a plaintext message from the ciphertext and a public key alone—provided that the
    plaintexts are distributed appropriately.'
