    Each of the algebraic structures is said to be *Abelian* if it fulfils the commutative
    property; namely, for any given $s, t \in S$ the equality $s \cdot t = t \cdot
    s$ holds. One often writes $s+t$ or $s t$ instead of $s \cdot t$, respectively,
    multiplicative or additive notation, at convenience. Additive notation is mainly
    common when dealing with a commutative operation. In multiplicative notation,
    the identity element is denoted by $1$ or $e$. Similarly, in additive notation
    it is common to write $0$ for the identity. Following common convention, we will
    write $|S|$ to denote the number of elements in a finite algebraic structure $S$.
    Especially in the context of finite groups, $|S|$ is also called *order* of $S$.


    Given a certain algebraic structure, it is always of interest to study subsets
    of it that preserve the structure.


    > **DEFINITION 1.5 [Subgroup]** A subgroup of a group $G$ is a non-empty subset
    $H \subseteq G$ which inherits the binary operation from $G$, i. e., for any $g,
    h \in G$, we have $g h^{-1} \in H$. The fact that $H$ is a subgroup of $G$ is
    expressed as $H \leq G$.


    Every group $G$ with $|G| \geq 2$ has at least two different subgroups: the group
    itself, and the one consisting of the identity element (the latter is denoted
    by $1$). Any other subgroup of $G$ is said to be *proper*.


