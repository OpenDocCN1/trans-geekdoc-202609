  md: "# Group Theoretic Cryptography\n\n**Authentication.** When exchanging information\
    \ over an insecure channel one would like to authenticate both information itself\
    \ and any entities involved in the communication. Examples of cryptographic constructions\
    \ geared towards this goal are *signature schemes* and *identification schemes*.\n\
    \n**Data integrity.** Preventing unauthorized alteration of data is crucial when\
    \ we are exchanging or storing information. It is often achieved using dedicated\
    \ encryption schemes (cf. *non-malleable encryption schemes*, see Definition 4.6).\
    \ Hash functions are a basic building block of integrity-preserving cryptographic\
    \ design. These functions *condense information*, in the sense that they transform\
    \ input bitstrings (much shorter) bitstrings of fixed length. As a result, they\
    \ are “highly” non-injective, but designed in such a way that lack of injectivity\
    \ is hard to exploit computationally (we will learn more about this in Sections\
    \ 4.3 and 8.1).\n\n**Non-repudiation.** When data is processed, there is the need\
    \ to guarantee that the involved entities will not be able to deny their actions.\
    \ Non-repudiation techniques allow for many applications in asynchronous networks\
    \ (like the Internet)—such as e-auctions, e-bets, voting protocols, etc. A common\
    \ cryptographic tool serving as a building block for schemes providing non-repudiation\
    \ is a *commitment scheme*.\n\nLet us take a look at basic examples for a signature\
    \ scheme and a commitment scheme.\n\n# **Example 3.2** [RSA signature]\n\nIn the\
    \ same paper RSA encryption was proposed [RSA78], a digital signature protocol\
    \ was suggested with basically the same strategy as encryption. More specifically,\
    \ now Alice (the signer) computes $N$ a product of two primes $p, q$, with $\\\
    log p \\approx \\log q$, and $e$ a unit in $Z_{\\varphi(n)}$. Again, $(N, e)$\
    \ is the public key, while $e$'s multiplicative inverse $d$, is the signing key\
    \ that she will keep.\n\n+   1. Alice signs a message $m \\in Z_N$ as $\\sigma\
    \ = m^d \\quad (\text{mod } N)$, and sends Bob the message-signature pair $(m,\
    \ \\sigma)$.\n\n+   2. Bob accepts the signature if $\\sigma^e = m \text{ in }\
    \ Z_N$, and otherwise rejects Alice’s authorship.\n\nWhile intuitive, this basic\
    \ scheme has a major security flaw. It is *existentially forgeable*, for anyone\
    \ can obtain a valid signature pair $(m, \\sigma)$ from the public information\
    \ by setting, for any $\\sigma \\in Z_N, m = \\sigma^e \\quad (\text{mod } N)$.\
    \ Almost 20 years later, Bellare and Rogaway proposed a modification of this scheme\
    \ known as RSA-FDH [BR96] that made use of a full domain hash function"
