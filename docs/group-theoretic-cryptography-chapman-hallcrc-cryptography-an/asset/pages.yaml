    This representation is called Garside normal form or greedy normal form of b.


    We do not prove this theorem here, but as discussed in [ECH+92], an efficient
    rewriting procedure allows to compute the Garside normal form of a braid in time
    O(|w|^2-n log(n)) with |w| denoting the length of a braid word representing b
    in the Artin generators. Deriving the greedy normal form involves three steps:


    +   1. Any negative generator σ_i^{-1} is replaced by Δ_n^{-1}p_i, with a permutation
    braid p_i.


    +   2. Exploiting the relations σ_iΔ_n^{-1} = Δ_n^{-1}σ_{n-i}, all foundational
    braids Δ_n are moved to the left of the braid word.


    +   3. Steps 1 and 2 yield a representation b = Δ_n^+b'' with b'' ∈ B_n^+. The
    positive braid b'' is decomposed into simple braids such that the condition on
    starting and finishing sets in Theorem 6.1 is fulfilled.


    # Example 6.3


    To find the Garside normal form


    b = σ_2σ_3^{-1}σ_3^{-1}σ_2 \in B_4,


    we replace both occurrences of σ_3^{-1} by Δ_4^{-1}σ_1σ_2σ_1σ_3σ_2 and obtain


    b = σ_2(Δ_4^{-1}σ_1σ_2σ_1σ_3σ_2)(Δ_4^{-1}σ_3σ_2σ_1σ_3σ_2)σ_2.


    Moving the Δ_4^{-1} to the left, we


    b = Δ_4^{-1}σ_1σ_2σ_1σ_3σ_2(Δ_4^{-1}σ_3σ_2σ_1σ_3σ_2)σ_2.


    Proceeding analogously with the second occurrence of Δ_4^{-1} yields


    b = Δ_4^{-2}σ_2σ_1σ_3σ_1σ_3σ_2σ_3σ_2σ_1σ_3σ_2.


    Finally, expressing σ_2σ_1σ_2σ_1σ_3σ_2σ_3σ_2σ_1σ_2 as a product of permutation
    braids results in the Garside normal form


