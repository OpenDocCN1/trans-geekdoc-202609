    \ assume that $n$ is large enough for collision resistance not being thwarted\
    \ by the birthday phenomenon.\n\nAs a hash function must be able to handle inputs\
    \ of varying (arbitrary) length, whereas the block cipher is restricted to inputs\
    \ of fixed length, in a first step the message is to be hashed *padded*. After\
    \ padding, the message length is guaranteed to be a multiple of $n$. To realize\
    \ this without making a collision search trivial, a common technique is to append\
    \ bits to the original message length by appending a block of fixed length that\
    \ reflects the length of the original message. This technique is commonly known\
    \ as *Merkle–Damgård strengthening*.\n\n# Example 8.1\n\nHere is a popular variant,\
    \ where $\\gamma \\geq 0$ is a fixed parameter, e.g., $\\gamma = 128$.\n\n+  \
    \ - Append a single 1-bit to $m$: $m||1$\n- Append a minimal non-negative $j$\
    \ of 0-bits to $m||1$, so that the length of $m||1|0^+\\gamma$ is divisible by\
    \ $n$.\n- Output $m||1|0^c$ where $c$ is the unique $\\gamma$-bit representation\
    \ of the length of the original input $m$ in binary.\n\nObviously such a padding\
    \ restricts the input length of $m$ to at most $2^\\gamma-1$, but already a value\
    \ of $\\gamma=128$ suffices to satisfy rather extreme requirements for input sizes.\n\
    \nNext, we need a *compression function* $f : \\{0,1\\}^n \times \\{0,1\\}^n \r\
    ightarrow \\{0,1\\}^n$. As shown in Figure 8.1, a compression function with a\
    \ fixed (and public) initialization value $h$ can then be used to process input\
    \ by block, finally obtaining a hash value of length $n$. This design principle\
    \ is named after Merkle and Damgård, and we are interested in deriving the compression\
    \ function $f$ from a block cipher. [PGV94] and Black et al. [BRS02] explored\
    \ 64 natural candidates to derive the compression function $f$ from a block cipher.\
