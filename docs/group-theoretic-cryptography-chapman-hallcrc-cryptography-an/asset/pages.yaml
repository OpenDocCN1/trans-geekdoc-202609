    # 10.2 RSA signatures: FDH and PSS


    In Example 3.2, we have seen a first example of an RSA-based public-key signature
    scheme. As already noted there, this straightforward construction is insecure,
    for given a valid signature $\sigma$ and a public key $(N, e)$ the adversary can
    immediately create a valid message/signature pair $(\sigma^e$ mod $N$), $\sigma$.
    In the random oracle model, a (in the sense of EUF-CMA) secure variant can be
    constructed easily using the so-called full domain hash (FDH) paradigm, introduced
    by Bellare and Rogaway in [BR96]. This paradigm is summarized in Figure 10.2,
    where the main tools for signing $\ell$-bit messages are a trapdoor one-way permutation
    defined on a set $X$ of size superpolynomial in $\ell$, and a hash function $\mathcal{H}$
    with range $X$ and domain $\{0,1\}^\ell$.


    +   $K$: on input $\ell$ outputs a description of a trapdoor one-way-permutation
    $f$ defined over $X$ as public key $pk$, and trapdoor information for evaluating
    the inverse $f^{-1}$ of $f$ as secret key $sk$.

    $\mathcal{S}$: on input $(sk, m)$, where $m \in \{0,1\}^\ell$, sets $r = \mathcal{H}(m)$,
    computes $\sigma = f^{-1}(r)$ and returns the signature $\sigma$ for $m$.

    $\mathcal{V}$: on input $(pk, m, \sigma)$, checks whether $f(\sigma) = \mathcal{H}(m)$
    and returns 1 if this is the case, otherwise it returns 0.


    **FIGURE 10.2:** FDH signature with trapdoor one-way permutation.


    # **THEOREM 10.1 [Security of FDH signature scheme]**


    The public-key signature scheme depicted in Figure 10.2 is secure in the sense
    of EUF-CMA in the random oracle model, under the assumption that the function
    $f$ is chosen from a trapdoor one-way permutation family defined over $X$.


