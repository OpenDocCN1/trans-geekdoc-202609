  md: "# Provable security guarantees\n\nIt is most interesting for cryptographic\
    \ purposes to have at hand seemingly hard computational problems that may be efficiently\
    \ solved with some (secret) additional information. The trapdoor property of one-way\
    \ function families captures exactly situation. More precisely, a one-way permutation\
    \ family has a trapdoor if for each $f_i$ exists some value $t_i$ allowing to\
    \ efficiently compute the (unique) preimage of any given value in $R_i$. Formally,\
    \ we have the following definition:\n\n# DEFINITION 4.10 [Trapdoor one-way function\
    \ family]\n\nLet $F = \\{f_i : D_i \to R_i\\}$ be a one-way function family, and\
    \ for each $i \\in I$ $T_i$ be a finite set. We say that $F$ is a trapdoor one-way\
    \ function family if there exist probabilistic polynomial time algorithms for\
    \ the following tasks:\n\n+   - on input $1^\\ell$ output a pair $(i, t_i) \\\
    in I \\times T_i$,\n- on input $(i, t_i, f_i(x))$, for any $i \\in I$ and $x \\\
    in D_i$ output $x'$ with $f_i(x') = f_i(x)$.\n\nIf $f_i$ in a trapdoor one-way\
    \ function family is a permutation, we call $F$ a trapdoor one-way permutation\
    \ family.\n\nAs an example, let us define a candidate for a trapdoor one-way permutation\
    \ family that describes the hardness of inverting RSA encryption.\n\n# Example\
    \ 4.7\n\nDenote by the set all tuples $(i, p, q, e) \\in N^4$ that $p \\neq q$\
    \ are prime, $p, q \\in [2^i+1, 2^{i+1}-1]$$ and $\\gcd(e, \\varphi(n)) = 1$.\
    \ We have a suitable algorithm which on input $1^\\ell$ samples a tuple of the\
    \ form $(\\ell, \\cdot, \\cdot, \\cdot) \\in I$ uniformly at random. For an index\
    \ $(i, p, q, e)$ we define $D_i$ and $R_i$ to be the group of units $Z_{p q}^*$,\
    \ and $T_i$ the set containing the smallest positive integer $d$ such that $d-e$\
    \ is divisible by $(p-1)(q-1)$.\n\nTo simplify the presentation, we sometimes\
    \ speak of a (trapdoor) one-way function family where $\\ell$ is the security\
    \ parameter, representing the execution of the algorithm which derives the index\
    \ $i$ from $1^\\ell$. While this would not cause any confusion, one should keep\
    \ in mind that for a given security parameter $\\ell$ the selection of a corresponding\
    \ index $i$ (and in case of a trapdoor one-way function family also the trapdoor)\
    \ is in general randomized. In fact, it is easy to see that the derivation of\
    \ a trapdoor from the security parameter cannot be deterministic.\n\nUnfortunately,\
    \ the construction of efficient and secure public-key encryption turns out to\
    \ be rather challenging, if we want to base our proof of security on a mathematical\
    \ assumption like the Diffie-Hellman assumption or the availability of a trapdoor\
    \ one-way function family alone."
