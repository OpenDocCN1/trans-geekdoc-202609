    \nLet $G_\\ell$ be a family of, multiplicatively written, finite cyclic groups\
    \ with a polynomial time algorithm $\\mathcal{G}$ that on input $1^\\ell$ outputs\
    \ a generator $g_\\ell$ (along with polynomial time algorithms for computing the\
    \ product and for deciding equality of elements in $G_\\ell$).\nThe Computational\
    \ Diffie-Hellman (CDH) assumption states that every probabilistic polynomial time\
    \ algorithm $A$ agrees as input $g \\leftarrow G(1^\\ell)$, $g^\\alpha$ and $g^\b\
    eta$ with $\\alpha \\in \\{1, \\dots, ord(g)\\}$ and $\beta \\in \\{1, \\dots,\
    \ ord(g)\\}$has negligible probability in $\\ell$ of computing $g^{\\alpha\beta}$.\n\
    \nThe protocol is defined in Figure 9.4. It is a refinement of the Burmester-Desmed\
    \ group key establishment protocol we discussed in the previous section. Two-party\
    \ keys are agreed on in a first communication around neighboring participants;\
    \ however, these are used for securing the communication and detecting messages\
    \ that have been tampered with (replayed), rather than constructing the session\
    \ key. Messages are authenticated by means of a signature scheme, and the random\
    \ order is used both to guarantee the key indistinguishability and to bind the\
    \ session identifier and the session key together. The CDH assumption holds for\
    \ $(G,g)$ (more precisely, the corresponding group family), the function $H(\\\
    cdot)$ is modeled as a random order over codomain $\\{0,1\\}^\\ell$ and the underlying\
    \ scheme is secure in a strong sense, then the protocol in Figure 9.4 is a secure\
    \ key agreement in the sense of Definition 9.3.\n\nProof sketch. Let $\\ell$ be\
    \ the security parameter. Let $q_s$ and $q_{ro}$ be bounds for the number of the\
    \ adversary's queries to the Send random order. By defining three events and give\
