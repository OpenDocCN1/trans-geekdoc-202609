  md: '# Public-key encryption in the standard model


    # PROPOSITION 5.1


    Let $H = (X, H, K, S, \chi)$ be a group action projective hash family. If the
    underlying group action system $(X, H, \chi, S)$ is $p$-diverse then the group
    action system $H$ is $1/p$-universal.


    PROOF From Lemma 5.2, for any $x \in X \setminus L$, the probability of guessing
    the correct value of $h(k)x$ for a random choice of $k \in K$ given $\chi(h(k))$
    is $1/|x|$, which is at most $1/p$.


    Once a universal projective hash family is constructed choosing the right elements
    according to the results above, the generic method of [CS02] may be used in order
    to transform it into a smooth projective hash family. Moreover, this transformation
    is superfluous: in some special cases, smoothness can be guaranteed directly.


    # PROPOSITION 5.2


    Let $H = (X, H, K, S, \chi)$ be a group action projective hash family. If the
    whole set $X \setminus L$ is a single orbit under $ker \chi$ then the group action
    projective hash family $H$ is $|L|/|X|$-smooth.


    PROOF Let $x \in X \setminus L$. From Lemma 5.2, $h(k)x$ is uniformly distributed
    on a set of size $|x| = |X \setminus L|$. Then, the statistical of $h(k)x$ and
    the uniform distribution on $X$ is


    ```

    $$\frac{1}{2} \sum_{x \in X \setminus L} \frac{1}{|X| - |L|} - \frac{1}{|X|} +
    \frac{1}{2} \sum_{x \in L} \frac{1}{|X|} = \frac{|L|}{|X|}$

    ```


    Therefore the probability distribution of $h(k)x$ is $|L|/|X|$-close to the uniform
    distribution on $X$.


    Similarly, from a universal PHF one can derive a smooth PHF, a simple extension
    of a universal PHF leads to the construction of a universal$_\epsilon$ extended
    PHF. Furthermore, in [CS02], Cramer and Shoup outline a generic transformation
    from any $\epsilon$-universal projective hash family to an $\epsilon$-universal
    extended projective hash family. A more efficient extension can also be found
    in [GVV08]; both are quite technical.


    Summarizing the discussion in this section, we can say that needed cryptographic
    proof systems may be derived from suitable group action systems: Cramer and Shoup''s
    construction for an IND-CCA encryption scheme required a hard subset membership
    problem $\mathcal{M}$ and two suitable hash proof systems. Diverse group action
    systems also provide strong universal projective hash families for the Kurosawa-Desmedt
    encryption scheme [KD04].'
