    proposal on this line can be found in [LvTMW09]; see also the corresponding cryptanalysis
    in [BCM09, GVpdT10]. Some results on minimal length logarithmic signatures can
    be found in [GVRS03, LvT05] and in more recent papers focusing on sporadic [Hol04]
