    To have a sufficient number of rounds used available, AES relies on a key expansion
    process which takes the secret key as input and derives 10, 12, or 14 round keys,
    depending on the length $k$ of the secret key.


    # 7.1.2 Key schedule


    The number of rounds used for an AES encryption is a function of the key length
    $k$, and we define $r = 6 + (k/32)$ in dependence on the key length $k \in \{128,
    192, 256\}$. To enable a "whitening step" at the beginning of the encryption process,
    a total of $r+1$ round keys are needed, of which can be represented as a $4 \times4$
    matrix over $F_{256}$. To derive these rounds, we interpret the initial $k$-bit
    secret as a sequence $L_0, \dots, L_{r-7}$ of eight vectors in $F_{256}$. This
    sequence is extended recursively according to the following rule:


    ```

    $L_i = L_{i-(r-6)} + f_i(L_{i-1}),$

    ```


    where


    ```

    $f_i : F_{256}^{4\times4} \longrightarrow F_{256}^{4\times r-6}$

    ```


    \begin{matrix} SubBytes(a_1) & + & 0 \ SubBytes(a_2) & + & 0 \ SubBytes(a_3) &
    + & 0 \ SubBytes(a_0) & + & 0 \end{matrix} \quad \text{if } k=256 \text{ and }
    i \bmod {(r-6)} = 0\n\begin{matrix} a_0 \ a_1 \ a_2 \ a_3 \end{matrix} \to \begin{matrix}
    SubBytes(a_0) \ SubBytes(a_1) \ SubBytes(a_2) \ SubBytes(a_3) \end{matrix} & \,
    & \text{otherwise} \end{matrix}$


    for $i = r-6, \dots, 4r-1$. The resulting $r$ column vectors $L_0, \dots, L_{4r-1}$
    are combined in groups of four in the natural way to obtain the required $r$ round
    keys:


    ```

    $key_j = (L_{4j}|L_{4j+1}|L_{4j+2}|L_{4j+3}) \in F_{256}^{4\times4} \quad (j =
    0, \dots, r-1)$

    ```


