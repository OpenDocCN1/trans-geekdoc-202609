  md: "# Group Theoretic Cryptography\n\nA *function* from a set $X$ to a set $Y$\
    \ is a law assigning an element $f(x)$ from $Y$ to each element of $X$, and we\
    \ refer to $X$ as the *domain* of $f$, the set $\\{y \\in Y \\mid x \\in X$ such\
    \ that $f(x) = y\\}$ is called the *image* of $f$ and denoted by $f(X)$. The sets\
