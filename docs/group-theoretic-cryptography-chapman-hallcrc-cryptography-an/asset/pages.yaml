    # Assumption 9.2 (Ko-Le decisional assumption)


    Let $a, b, c \in B_n$ such that for some (randomly chosen) $x \in LB_n$ and $y
    \in RB_n$ we have


    ```

    b = x^{-¹}ax and nc = y^{-¹}ay.

    ```


    Then it is hard to distinguish the group element $d = a^{xy}$ from a random conjugate
    of a.


    R. Gennaro and D. Micciano proved this assumption to be false, by providing in
    [GM02] a polynomial time algorithm solving the corresponding decisional problem.
    Moreover, they provided an explicit attack against the pseudo-random number generator
    proposed using that assumption. The goal of Gennaro and Micciano''s algorithm
    is to disprove the Ko-Le decisional assumption by showing that for any choice
    of probability distribution on $a, x$, and $y$, it is always possible to derive
    information about $a, b$, and $c$. Let us assume that $n$ is even. Then Gennaro
    and Micciano''s strategy can be split into four main parts:


    +   i. We first note that the permutation induced by $x$ acts only on the leftmost
    letters of $\{1, \dots, n\}$, and the permutation induced by $y$ only on the corresponding
    rightmost letters. Then, the permutation induced by $d$ must satisfy certain constraints.
    This allows the authors of the attack to argue that $a$ is not a pure braid, the
    Ko-Le decisional assumption does not hold.


    +   ii. Suppose $a$ is a pure braid, then one can distinguish $d$ from a random
    conjugate of $a$ by comparing the two projections of $d$ on $B_{\frac{n}{2}}$
    (i.e., considering only the first or last $\frac{n}{2}$ strands of $d$) with the
    corresponding projections of $b$ (first strands) and $c$ (last strands). This
    will coincide significantly more often if $d$ is a “Ko-Le key” than $d$ is a random
    conjugate. This strategy is not valid if both (left and right) projections of
    $a$ yield the identity.


    +   iii. Now assume $a$ is pure and the attack ii does not apply. They perform
    a similar comparison projecting the pure braids on different sets of $\frac{n}{2}
    + 1$ strands, which allows to distinguish $d$ from random unless all projections
    of $a$ coincide.


    +   iv. For the remaining choices of $a$, the authors argue that all conjugates
    involving braids in $LB_n$ or $RB_n$ are trivial (i.e., conjugate with $a$). As
    a consequence, the Ko-Le decisional problem always has a “yes” answer.


    Thus, to explore the security of the key exchange protocol of Ko et al. forward
