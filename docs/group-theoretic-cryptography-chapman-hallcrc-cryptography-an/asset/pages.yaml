    # 8.3 Cayley hash functions


    Let $G$ be a finite group and $S = \{g_0, \dots, g_{t-1}\}$ a set of generators
    for $G$. Then we can define a surjective map


    $h : \{0, \dots, t-1\}^* \longrightarrow G$\n$(m_1, \dots, m_r) \longmapsto g_{m_1}
    \cdots \ g_{m_r}$


    In particular, for a generating set with two elements, we have a map that assigns
    each bitstring to an element of the group $G$. Intuitively, applying $h$ describes
    a walk on a Cayley graph of $G$.


    **DEFINITION 8.1 [Cayley graph]** Let $G$ be a finite group and $S$ a set of generators
    for $G$. Then a (directed) graph with vertex set $G$ and edge set $\{(g, g \cdot
    s) : g \in G, s \in S\}$ is called a Cayley graph for $G$.


    The mapping $h$ is a basic version of a *Cayley hash* [PLQ07]. With the interpretation
    of applying $h$ as a walk in a Cayley graph, one can try to use graph-theoretic
    insights to obtain information about the security of it. For instance, $\gamma$
    be the length of the shortest cycle—the *girth*—in the undirected version of the
    Cayley graph. The lengths of two colliding inputs $m \neq m''$, i.e., inputs with
    $h(m) = h(m'')$, must satisfy $|m_1| + |m_2| \ge \gamma$.'
