  md: '# # Chapter 4


    # ## Provable security guarantees


    So far, our discussion of public-key encryption has been very informal, and we
    made no serious attempt to define what we mean by a “secure” public-key encryption
    scheme. In this chapter we establish some terminology that enables us to formalize
    security requirements and to establish strong provable guarantees for public-key
    encryption under clearly defined assumptions. Furthermore, we discuss fairly generic
    construction to derive secure asymmetric encryption from basic tools (trapdoor
    one-way functions and random oracles) and comment on an idea for developing secure
    constructions using certain factorization sequences of finite groups (logarithmic
    signatures).


    # ### 4.1 Public-key encryption revisited


    The intuitive approach we so far to describe and discuss encryption schemes is
    helpful for conveying basic ideas. There is a significant danger, however, of
    revealing attacks that could have been avoided by a more careful analysis.


    The basic RSA scheme in Section 3.1.2 is deterministic, i. e., if we encrypt the
    plaintext twice with the same public key, then we obtain exactly the same ciphertext.
    Consequently, if the set of possible plaintexts is small, then an adversary may
    compute a table containing all plaintexts along with their (unique!) encryption
    under a given public key. With such a table, decrypting an eavesdropped message
    reduces to a simple table look-up.


    In regard to small message spaces, the ElGamal scheme from Section 3.1.2 appears
    to be more robust than RSA: The encryption algorithm¹ is probabilistic, and even
    for a fixed public key $pk=g^a$ and a fixed plaintext $m$,


    > ¹As a function we expect to always obtain the same value when evaluating the
    argument, we do not use the term *encryption function*. Instead, we describe the
    process of encrypting a plaintext as applying a probabilistic algorithm to it.'
