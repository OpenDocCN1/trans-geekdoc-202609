  md: "# Public-key encryption in the standard model\n\nCramer and Shoup: given three\
    \ finite Abelian groups $X, L$ and II, where $L$ is a proper subgroup of $X$,\
    \ a *group system* is a tuple $(\\mathcal{H}, X, L, \text{II})$, where $\\mathcal{H}\
    \ = \text{Hom}(X, \text{II})$ is any chosen subgroup of the homomorphism group\
    \ between $X$ and II.\n\nNow, for $h \\in \text{Hom}(X, \text{II})$, the mapping\
    \ $\\phi(x, \\pi) = (x, h(\\pi))$ is an element of $\text{Aut}(X \times \text{II})$.\
    \ Further, denote by $\\Psi$ the group monomorphism\n\n```\n$\\Psi : \\text{Hom}(X,\
    \ \\text{II}) \\longrightarrow \\text{Aut}(X \\times \\text{II})$$\n$h \\longrightarrow\
    \ \\phi$,\n```\n\nand consider the natural restriction\n\n```\n$\\eta : \\text{Hom}(X,\
    \ \\text{II}) \\longrightarrow \\text{Hom}(L \\times \\text{II})$$\n$h \\longrightarrow\
    \ h|_L$,\n```\n\nFinally, $\\chi = \\eta \\circ \\Psi^{-1}$ be the functional\
    \ composition of these two morphisms. Then, putting it all together, we obtain\
    \ a group action system $(X \times \text{II}, \\Psi(H), \\chi, \text{Hom}(L \t\
    imes \text{II}))$.\n\n# **Example 5.5** [Using of collineations]\n\nLet $\\pi$\
    \ be a projective plane over a finite field $\\mathbb{F}_q$. Automorphisms of\
    \ $\\pi$ are usually called *collineations*, and it is easy to see that a collineation\
    \ is faithful both on the point-set and the line-set of $\\pi$. (For basic notions\
    \ on colation groups of finite planes, [Bon99]).\n\nAn *elation* is a collineation\
    \ fixing both a point of a fixed line $l$ (the *axis*) and each line through a\
    \ point $C$ in $l$; the point $C$ is usually referred to as the *center*. The\
    \ fixed points of a non-identity elation are exactly the points on the axis, while\
    \ the only fixed lines are incident. Let $X$ be the point-set of $\\pi$, $L$ a\
    \ fixed line in $\\pi$, and $C$ a fixed point on the line $L$. Take $H$ be the\
    \ group consisting of all elations with center $C$.\n\nNotice that every elation\
    \ induces a permutation of the points of $L$, since the center $C$ is contained\
    \ in $L$. We define $\\chi$ as the group homomorphism translating each elation\
    \ into the corresponding permutation of $L$.\n\n```\n$\\chi : H \\longrightarrow\
    \ S_L$$\n$$\\zeta \\longrightarrow \\zeta_L$,\n```\n\nClearly, $\\ker \\chi$ is\
    \ exactly the subgroup of all elations in $H$ with axis $L$. Note that, moreover,\
    \ the points in $L$ are exactly the points of $X$ stabilized by $\\ker \\chi$.\
    \ On the other hand, if $A$ is an arbitrary point outside $L$, each elation in\
    \ $\\ker \\chi$ is uniquely determined by the image of $A$, that can be any point\
    \ in the line defined by $C$ and $A$, except for $C$ (as an elation is completely\
    \ determined giving its center, axis, and the image of the point outside the axis).\
    \ Hence, $|\\ker \\chi| = q$ and therefore $q$-diversity is guaranteed in this\
    \ construction."
