  md: '# Key establishment protocols


    Diffie-Hellman protocol of Ko et al. explained a cryptanalysis technique, based
    on linear centralizers, that succeeds against these two (and other) constructions.
    Also, we have described two matrix protocols which succumb to simple linear algebra
    attacks.


    Key establishment protocols are basic cryptographic constructions widely deployed
    and frequently integrated as blocks of more complex constructions. A good book
    to get into the subject is that of Boyd and Mathematica [BM04]. The Bermester-Desmed
    concert key agreement from [BD95] was proven secure in the passive mode in [BD05],
    a variant which provides security guarantees even if the adversaries are active
    later proposed by Katz and Yung [KY07]. Some up-to-date papers refining key establishment
    security models are [BCP01, BGVS07].


    Besides the ones mentioned in this chapter, a number of different proposals have
    been made for developing key exchange protocols using non-Abelian groups as a
    base, including [SU05, St05, SU06]. Many of them are only conceptual, and in still
    contain the heuristic and linearization attacks described in this chapter they
    cannot be considered secure [Sh08, Mat08]. A generic framework for building key
    exchange protocols from group-theoretical problems can be found in [BSG06], where
    the approach is to build a so-called encapsulation mechanism from a group-theoretical
    problem and then construct a group establishment protocol on top of it. This approach
    results in a 2-Round construction providing strong guarantees (not only security,
    in the sense of Definition 9.3, but further properties like forward secrecy and
    strong entity authentication). This construction is however conceptual, in the
    sense that it comes without a proposal of a non-Abelian assumption on which the
    proposed framework may be materialized.


