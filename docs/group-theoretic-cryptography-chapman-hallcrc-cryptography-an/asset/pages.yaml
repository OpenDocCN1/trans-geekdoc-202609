    # 8.5 Summary and future reading


    In this section we learned about the basic properties expected from a cryptographic
    hash function. Next to dedicated constructions, it is possible to derive a hash
    function from a block cipher, but it is important to keep in mind the restrictions
    on the output length imposed by the birthday phenomenon.

    Cayley hash functions are an elegant attempt to build cryptographic hash functions
    within a group-theoretic framework. To protect the authenticity of data, message
    authentication codes can be used, and with HMAC and CMAC we have seen two popular
    constructions.


    From the perspective of group theory, Cayley hash functions are interesting idea
    to derive a hash function, but there is so far no parameter choice that is widely
    accepted as being secure and usable for practical applications. Dedicated constructions,
    such as the SHA family [N112, NIS14], are much more popular, and they are designed
    to offer high performance on typical computer platforms. Block-cipher based constructions
    are popular as well, for a block cipher AES, where the output length is only 128
    bit, the construction in Section 8.2 is problematic. In view of the phenomenon
    it is natural to ask how one can (efficiently) derive a hash function with output
