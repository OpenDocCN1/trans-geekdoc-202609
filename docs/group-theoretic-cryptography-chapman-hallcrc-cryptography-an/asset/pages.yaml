  md: '# Group Theoretic Cryptography


    While the SubBytes step in AES is naturally specified in a compact manner as the
    substitutions used in DES as an algebraic operation in a finite field, commonly
    given directly as look-up tables in the form of the matrices $S^{(i)}$. These
    matrices are commonly referred to as S-boxes. The details of designing good S-boxes
    is a topic that we will not pursue in this book, but the reader who is interested
    in this topic may want to take a look at the lightweight version of DES proposed
    by Lander et al. in [LPPS07]—this DES replaces all eight S-boxes with a single
    new S-box, which is chosen to provide strong guarantees.


    # 2.2.3 Key schedule


    The nominal key length for DES is 64 bit, but every eighth of a secret key $(k_1,
    \dots, k_{64}) \in \mathbb{F}_2^{64}$ cannot be chosen freely. Instead, those
    bits satisfy the parity check condition


    ```

    $k_{8i} = 1 + \sum_{j=1}^{7} k_{8i-j} \quad (i=1, \dots, 8).

    ```


    Consequently, the effective key length of DES is only 56 bit, but in Exercise
    50 we will see that a particular property of DES can be exploited to reduce an
    exhaustive search to $2^{55}$ secret keys.


    To form the 16 round keys from the 64 bit key $(k_1,\dots,k_{64})$, we start by
    forming two-bit subkeys


    ```

    $C_0 = (k_{57}, k_{49}, k_{41}, k_{33}, k_{25}, k_{17}, k_9, k_{58}, k_{50}, k_{42},
    k_{34}, k_{26}, k_{18},\nk_{10}, k_{22}, k_{59}, k_{43}, k_{35}, k_{27}, k_{19},
    k_{11}, k_3, k_{60}, k_{52}, k_{44}, k_{36})$ and\nnD_0 = (k_{63}, k_{55}, k_{47},
    k_{39}, k_{31}, k_{23}, k_{15}, k_7, k_{54}, k_{46}, k_{38}, k_{30}, k_{22},\nk_{14},
    k_6, k_{53}, k_{45}, k_{37}, k_{29}, k_{21}, k_{13}, k_{28}, k_{20}, k_{12}).$.

    ```


    In addition, we need a function $\mathbb{F}_2^{28} \times \mathbb{F}_2^{28} \rightarrow
    \mathbb{F}_2^{48}$ that selects a 48-round key on input of two-8 bit values. Specifically,
    with $C = (c_1, \dots, c_{28})$ and $D = (d_1, \dots, d_{28})$ we have


