  md: "space. Even with the largest specified key length of 256 bits we certainly\
    \ cannot hope to be able to realize all permutations on this plaintext space,\
    \ $2^{256} \rightarrow 2^{128}$!\n\nIt turns out even with independently chosen\
    \ round keys, the round functions of AES do not generate the complete symmetric\
    \ group. More specifically, Wernsd showed that the set of round functions (7.2),\
    \ iterating over all possible round keys, generates a group that is isomorphic\
    \ to the alternating group $A_{128}$ [Wer02]. We will not prove this statement\
    \ completely here, but it is interesting to look in some more detail into working\
    \ with a group whose elements are represented in such a non-standard way. For\
    \ this, we have given one direction of Wernsd's proof.\n\n# **THEOREM 7.1** [AES\
    \ round functions are even]\n\nTaken as permutations on $\\mathbb{F}_2^{128}$,\
    \ all of the following are even: SubBytes, ShiftRows, MixColumns, and AddRoundKey\
    \ (with an arbitrary fixed round key). Consequently, the round functions of AES\
    \ generate a subgroup of $A_{128}$.\n\n# **PROOF** Let us look at the four types\
    \ of permutations in turn.\n\nSubBytes: This permutation can be written as a product\
    \ of 16 permutations, each of which captures the substitution on a single entry\
    \ of the state and stabilizes the remaining 15 entries of the state. The permutation\
    \ $\text{inv} : F_{256} \rightarrow F_{256}$, which describes the substitution\
    \ on one entry of the state, is an involution with two fixed points (0 and 1),\
    \ so each of the 16 permutations comprising SubBytes can be written as a product\
    \ of $127 \\cdot 2^{120} \\cdot 2^{24}$ transpositions. SubBytes is even.\n\n\
    ShiftRows: This map is $\\mathbb{F}_2$-linear and invertible. Thus we can represent\
    \ ShiftRows as multiplication of an invertible matrix $M \\in \\mathbb{F}_2^{128\
    \ \times 128}$ with a binary vector of length 128 representing the current state.\
    \ Using Gaussian elimination, we can decompose the $M$ into a product of matrices\
    \ that differ from the $128 \times 128$ identity matrix by a single off-diagonal\
    \ entry. Each of these elementary matrices captures the addition of one row to\
    \ another. Seen as permutation on $\\mathbb{F}_2^{128}$, these elementary matrices\
    \ have $2^{127}$ fixed points and split into a product of an even number $2^{120}$\
    \ of transpositions. ShiftRows must be even.\n\nMixColumns: This map is $\\mathbb{F}_2$-linear,\
    \ and we can apply the same reasoning as for ShiftRows.\n\nAddRoundKey: For the\
    \ zero round key, we have the identity map, which is clearly even. For all other\
    \ choices of the round key, addition of the round key translates into the composition\
    \ of $2^{127}$ transpositions, which is obviously even."
