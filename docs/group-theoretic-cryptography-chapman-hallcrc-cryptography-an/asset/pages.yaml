    Having said this, let us define what we mean by a public-key encryption scheme.


    **DEFINITION 4.2 [Public-key encryption scheme]** A public-key encryption scheme
    is given by a triple of polynomial time algorithms $(K, \mathcal{E}, \mathcal{D})$
    along with a family $\{M_\ell\}_{\ell\in\mathbb{N}}$ of message spaces. More specifically,
    we have the following:


    +   $K$: a probabilistic key generation algorithm that on input a security parameter
    $\ell = 1, \dots, \ell$ outputs a pair $(pk, sk)$. We refer to $pk$ as a public
    key and $sk$ as a secret key.


    +   $\mathcal{E}$: a probabilistic algorithm that on input a public key $pk$ and
    a plaintext $m\in M_\ell$ outputs a ciphertext $c$.


    +   $\mathcal{D}$: a deterministic algorithm that on input a secret key $sk$ and
    a candidate ciphertext $c$ outputs a plaintext $m\in M_\ell$ or a dedicated symbol
    $\perp \perp \bigcup_{\ell\in\mathbb{N}} M_\ell$.


    For $\mathcal{E}$ and $\mathcal{D}$ we will write the first argument as an index,
    i. e., we set


    ```

    $$\mathcal{E}_{pk}(m) = \mathcal{E}(pk, m)\n$\mathcal{D}_{sk}(c) = \mathcal{D}(sk,
    c)$$

    ```


    Moreover, for key pairs $(pk, sk)$ generated by the key generation algorithm $K$,
    we require that the event


    ```

    $$\exists m \in M_{\ell : \mathcal{D}_{sk}(\mathcal{E}_{pk}(m)) \neq m$

