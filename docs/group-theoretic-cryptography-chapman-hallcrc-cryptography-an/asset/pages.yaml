    If every element $g \in G$ can be expressed as a product


    ```

    $g = \alpha_{1j_1} \cdots \alpha_{1j_s}. \quad (4.4)$

    ```


    with $\alpha_{ij}, \in \alpha_i$ ($1 \le i \le s$), then we refer to $\alpha$
    as a cover of $G$. Further, if $\alpha$ is a cover of $G$ and the representation
    (4.4) is unique for all $g \in G$, then $\alpha$ is called a logarithmic signature
    of $G$.


    **REMARK 4.8** The term "logarithmic signature" is motivated by taking the elements
    in a compact representation of the group $G$—a logarithmic signature comprised
    of $s$ blocks of size 2 describes a group of size $2^s$.


    From the definition it is clear that each finite group $G$ has at least one logarithmic
    signature—we can always set $\alpha = [\alpha_1]$ with $\alpha_1$ containing all
    the elements of the group $G$ in some order. According to Definition 4.12 changing
    the order in which we list the elements of $G$ in $\alpha_1$ would yield a different
    logarithmic signature, and so we have for each group $G$ at least $ord(G)!$ (trivial)
    signatures. It is also obvious that the product of all block lengths occurring
    in a logarithmic signature of a finite group $G$ must be equal to the order of
    $G$, i. e., with the notation from Definition 4.12 we have


    ```

    $r_1 \cdots r_s = ord(G).$

    ```


    Consequently, if we exclude blocks of size 1, for finite groups of prime order,
    trivial logarithmic signatures consisting of a single block are the only ones
    that exist. On the other hand, if the group $G$ has a non-trivial subgroup $G_1
    < G$, then we can derive logarithmic signatures for $G$ in a simple way: if the
    sequence $\alpha_2$ is a complete set of right-cost representatives of $G_1$ in
    $G$ (i. e., a right-transversal for $G_1$ in $G$) and we store in $\alpha_1$ the
    elements of the subgroup $G_1$ in some order, then $[\alpha_1, \alpha_2]$ is a
    logarithmic signature for $G$. Analogously, if we choose $\beta_1$ to be a left-transversal
    of $G_1$ in $G$ and store in $\beta_2$ the elements of $G_1$ in some order, then
    $[\beta_1, \beta_2]$ is a logarithmic signature for $G$. Iterating this, a subgroup
    produces


    ```

    $G = G_0 > G_1 > \cdots > G_{s-1}$

    ```


    we derive a logarithmic signature for $G$ which consists of $s$ blocks. For the
    obvious reason, logarithmic signatures of this type are often referred to as transversal;
    note that $G_{s-1}$ can be seen as a transversal as well, namely as a transversal
    of the 1-element subgroup in $G_{s-1}$.


