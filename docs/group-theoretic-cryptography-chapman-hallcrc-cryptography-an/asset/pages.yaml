  md: '# Group Theoretic Cryptography


    Known efficient constructions often make use of a cryptographic hash function
    H for which no formal security proof under the assumption in question is available,
    but when replacing H with an idealization known as random oracle, then a security
    becomes possible. We conclude this section with a brief introduction to the so-called
    random oracle model in which many of the constructions introduced in the sequel
    are defined. While "pathological" examples have shown that this model has clear
    limitations, these seem of more practical concern, and random oracles have become
    a common tool in the design of cryptographic protocols. If a result involves neither
    random nor any other idealizing assumptions, it is common to say that a result
    holds in the standard model.


    Cryptographic hash functions are essential building blocks of many cryptographic
    constructions. Variations favor of collision resistance, capturing the hardness
    of finding different inputs the same hash value, are the key argument in proofs.
    Moreover, many security arguments actually call for the stronger assumption that
    values output by a hash function random to those ignoring the corresponding preimage.
    With the aim of providing a formal scenario capturing the use of cryptographic
    hash functions in practice, Belleare and Rogaway proposed in [BR93] an "articulated
    paradigm," the random oracle model, and applied it to derive cryptographic schemes
    that could be proven in this model. For the case of encryption, their original
    proposal led to widely known RSA-based encryption method: RSA-OAEP, we will present
    in Section 4.5. It addresses shortcomings in the basic version of RSA encryption
    we have seen in Section 3.1.2 (cf. Example 4.1).


    The random oracle model formalizes a hash function as an oracle that produces
    a random value for each new query. Further, as cryptographic hash functions are
    deterministic, if the same input is queried to a random oracle repeatedly, always
    the same random value is returned. Commonly the set from which this output of
    the random oracle is selected uniformly at random increases exponentially in the
    security parameter $l$--a typical choice is strings of length $l$ or a cyclic
    group with at $2^l$ elements. A random oracle can be seen as a probabilistic mechanism,
    which on input outputs an element $H(v)$ chosen uniformly from the fixed image
    set. This machine stores all encountered input-output pairs $(v, H(v))$, so that
    repeated queries for the same value can be answered consistently.


    **REMARK 4.6** It is not uncommon to have a random oracle H with an infinite set
    of possible inputs (each of which has finite length), e.g., $\{0, 1\}^*$. This
    provides no problem, as to answer a query, the probabilistic mechanism we just
    described needs to sample uniformly at random in the finite output to answer a
    query.


    With the terminology established, we are now ready to discuss the general'
