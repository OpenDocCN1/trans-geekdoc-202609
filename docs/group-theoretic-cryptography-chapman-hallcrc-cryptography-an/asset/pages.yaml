    The standard strategy to evaluate the complexity of a computational task is to
    classify problems and algorithms considering the worst possible scenario in terms
    of complexity “time”. In this case, “time” reflects the number of basic bit operations,
    though often the only computations taken into account are multiplications (additions/subtractions)
    and modular reductions are disregarded, and exponentiations are computed in terms
    of time—see Exercise 11). The choice about the operations that are counted important
    for the practical value of complexity statements—it is desirable that the models
    made here reflect the cost in an actual implementation.


    Another approach that is (often more or less explicitly) used when aiming at a
    cryptographic design is average-complexity. As O. Goldreich points out in [Gol08],
    this paradigm may be better referred to as typical-complexity, for its spirit
    is to analyze the time consumption ignoring instances that may be considered exceptionalnot
    only rare, but also irrelevant in some (often practical) sense. As much as this
    approach is of interest to this book, we restrict our study to the more classical
    worst-case scenario.


    # DEFINITION 2.1 [The class P]


    A decision problem P is in the class P of polynomial time problems, if there exists
    a polynomial p(n) and an algorithm A such that an instance of P has input length
    bounded by n, A outputs a correct answer in time bounded by p(n). This holds for
    any natural number n encoding the input length for P.


    The above definition can also be phrased as there exists an algorithm A for the
    problem P which is polynomial time (namely, the number of bit operations it performs
    on an input of length n is bounded by p(n) for some polynomial p). The primality
    testing problem from Example 2.1 is known to be in P, whereas factoring and RSA-cryptography
    are not known to be in P (and often presumed not to be).


    The class P comprises computational problems that may “in principle” be solved
    rapidly in practice. Nevertheless this one, there has to refine the analysis of
    the fact that a problem lies in P are sometimes limited. Indeed, it can be the
    case that the best algorithm for a problem in P is terribly slow in practice—the
    degree and leading coefficient of the polynomial p from the above definition may
    be a good hint for identifying such cases.


    Usually, the algorithm A from the above definition is deterministic. If we generalize
    the above definition and allow random selections and then impose that “yes” answers
    are always right and “no” answers are'
