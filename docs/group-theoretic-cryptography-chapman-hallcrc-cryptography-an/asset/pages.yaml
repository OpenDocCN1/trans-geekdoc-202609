    linking ciphertext and plaintext substrings as follows:


    ```

    $E = \begin{pmatrix} 13 & 11 \ 3 & 18 \end{pmatrix} = \begin{pmatrix} 15 & 10
    \ 25 & 17 \end{pmatrix}.$$

