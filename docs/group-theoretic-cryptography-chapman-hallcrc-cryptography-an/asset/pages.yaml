  md: '# Group Theoretic Cryptography


    During World War I, an encryption method patented by Gilbert Vernam was extensively
    used—the one-time pad. Its structure is very simple. The plaintext message is
    encoded as a sequence over the binary field $\mathbb{F}_2$ (a bit-string), and
    encryption is performed bit by bit, adding each bit of the plaintext with a corresponding
    bit of the key (modulo 2). It is essential that one-use key bits are generated
    independently and uniformly at random for each encryption. The experienced robustness
    of the one-time pad was theoretically justified by Claude Shannon, who published
    a foundational paper in the Bell Labs Technical Journal in 1949 [Sha64] introducing
    the perfect secrecy, which will capture the property of an encryption procedure
    for ciphertexts to reveal any information about the corresponding plaintext—apart
    from the length of the plaintext. Shannon''s theory is central to modern cryptography
    and his visionary work is the seed of modern provable security (see Chapter 4).


    It is not hard to see that the one-time pad meets this requirement, given a truly
    random key is used only once, a ciphertext can be translated into any plaintext
    of the same length, and all are equally likely. Perfect secrecy is obviously a
    very attractive secrecy guarantee. It has, however, a crucial drawback: the key
    space must be as large as the message space (which, in particular, if keys and
    messages are of fixed size implies that the key must be at least long as the message).
    This limitation can be proved to be inherent to perfect secrecy (see KL07, Chapter
    2).


    # 3.1.2 Public-key cryptography


    All the encryption methods we have mentioned so far have two things in common.


    +   - They were constructed primarily for military use.


    +   - They rely on a secure pre-distribution of secret keying material.


