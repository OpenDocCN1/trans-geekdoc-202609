    **Abstract**—Cloud manufacturing is a service-oriented

    manufacturing model to provide consumers with

    demand manufacturing services over the Internet. Scheduling is a

    technology for cloud manufacturing to achieve its

    halls. However, scheduling in cloud manufacturing faces series of

    challenges. To ensure the credibility of scheduling

    solutions (i.e. being able to function as expected) is one of the challenges.

    IoT and blockchain provide key technologies for addressing

    t challenges. We propose a framework for

    credible scheduling in cloud manufacturing based on

    the aforementioned technologies. A framework for credible

    scheduling in cloud manufacturing based on IoT and blockchain

    scheduling services are developed. Finally, a case study

    the car industry is given to validate the effectiveness and

    of feasibility of the proposed framework.


