    # IV. CONCLUSION AND FUTURE WORK


    In this paper, we have introduced the concept of ''credible scheduling'' in cloud
    manufacturing and proposed a framework for the achievement of credible scheduling.
    We achieved credible scheduling based on various technologies like IoT, edge computing,
    and blockchain. These technologies play different roles in enhancing the credibility
    of scheduling. In the context of scheduling in cloud manufacturing, credible scheduling
    faces many challenges, including credibility of manufacturing industries, data
    acquisition process, credibility of the entire cloud-blockchain process, credibility
    of cloud services, and service operation. For example, real-time data exchange
    through IoT. Blockchain technology enables credible scheduling process and transactions
    in cloud manufacturing. Future work can be conducted in the following directions:


