    In this paper, a credible scheduling framework is proposed, but some content is
    still missing in this article. Future work includes: (1) Building a blockchain
    network to implement the proposed system; (2) Focus on packaging manufacturing
    resources and data into blocks; (3) Considering the scalability of the blockchain-based
