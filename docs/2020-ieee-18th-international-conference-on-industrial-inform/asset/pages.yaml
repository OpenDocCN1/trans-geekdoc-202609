    4) Perception layer. The perception layer is for perceiving states of manufacturing
    resources and manufacturing capabilities through RFIDs and sensors to ensure that
    the services and manufacturing data provided by the manufacturing resources provided
    by enterprises are credible. IoT and edge computing play important roles in perceiving
    resource states and connecting them to the cloud.


    5) Resource layer. The resource layer consists of various manufacturing resources
    and manufacturing capabilities.


    Manufacturing resources are divided into hardware resources and software manufacturing
    resources. Manufacturing capabilities include capabilities of experimentation,
    design, and simulation, etc.


    # A. Trustworthy manufacturing resources


    Credibility of manufacturing resources is ensured through the combined use of
    IoT and edge computing, with real-time data. Physical resources and cloud-edge
    connection can be achieved by part of the scheduling strategy, which determines
    the process and quality of manufacturing resources. Only by the real-time processing
    of the information of manufacturing resources can global scheduling optimization
    be achieved to ensure the efficiency and credibility of scheduling. After a scheduling
    solution is generated, the corresponding instructions are transmitted from the
    cloud to the edge for execution. By equipping physical resources with RFID and
    other sensor devices, the device sends real-time data generated in time based
    on the real-time data to reduce idle manufacturing resources. The later, data
    is processed by the edge and transmitted to the cloud for further analysis and
    processing. The cloud sends operating instructions to the edge again, forming
    a real-time communication process. By combining with IoT technology, the efficiency
    of collecting real-time production of massive physical resources has improved.
