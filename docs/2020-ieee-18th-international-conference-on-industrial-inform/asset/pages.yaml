    Currently, many different research areas have focused on Li et al. [12] proposed
    a blockchain-based distributed manufacturing platform, a cross-enterprise network
    and service framework based on blockchain and edge computing. Li et al. [14] proposed
    a blockchain-based composition architecture in cloud manufacturing. After adding,
    blockchain technology can directly see the result of services and can directly
    execute contracts without a third-party platform.


    # C. IoT and Edge computing


    The idea of IoT was proposed in 1982 [12]. Connectivity refers to connect devices
    through sensors, RFID and other techniques to the Internet to achieve intelligent
    identification and management. With the rapid development of network, RFID and
    sensor technology, the Internet of Things is widely used in our lives. Yang et
    al. [15] proposed a service-oriented architecture for multi-manufacturing methods.
    Li et al. [16] developed an IoT-based tracking platform for the packaged food
    chain.


    Edge computing is one implementing the technology needed for cloud manufacturing.
    It is a decentralized computing architecture that moves data and services from
    central nodes to edge nodes. Field devices can be embedded in the computing function
    to achieve autonomy of distributed information processing [17]. With the rapid
    development of the Internet, Georgopoulos et al. [18] proposed a roadmap for the
    combination of edge computing and IoT-based manufacturing to improve product quality
    and the ability to respond to changing contexts. Sugana al. [19] proposed a edge
    computing architecture based on multi-agents, which is suitable for large-scale
    IoT systems.'
