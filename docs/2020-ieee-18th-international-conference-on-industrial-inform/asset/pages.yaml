    # B. Service Trust


    Service trust includes scheduling trust and transaction trust agreeing that the
    cloud is credible, first of all a user enters the system, he or she needs to provide
    the platform with his information. After the platform is verified, he enters the
    system with his wallet. Only authenticated users can enter the network. Each user
    of the system acts as a node, and the management of the system contributes to
    the stability and security of the system. In the cloud, users request tasks and
    service providers publish their information. The cloud platform performs reasonable
    scheduling according to the task requirements and stores the information, in the
    block, and broadcasts it to the entire system. After other nodes pass the block
    verification, the scheduling information is stored in the blockchain. The user
    signs a smart contract based on the scheduling information. When the task is completed
    and submitted, the user sends the transaction block to the service provider on
    wallet in time to create a transaction block about the success of the transaction.
    Broadcast in the verification of other nodes, the block to the blockchain correctly.
    If the transaction fails, this block will also be added to the blockchain. The
    design is equivalent to user-service offerings. If a problem occurs at a later
    stage, the retrospective query can be performed faster. Since the entire scheduling
    information and transaction information are stored in the blockchain, it cannot
    be modified, ensuring the credibility of the scheduling process. Figure 5 shows
    the operation process.


    # C. Case Study


    We will explain an example of a vehicle to better illustrate the mentioned architecture.
    First, the user logs into the system to register wallet name and then publishes
    relevant information (such as production date, color, and model) to the cloud
    platform, and the cloud generates a scheduling strategy for the task to form a
    transaction. After that, the user uses the transaction parties to form a smart
    contract and the corresponding rules are embedded in the block for use. Each manufacturer
    loads the data generated by the equipment in the production process into the block
    and finally joins the blockchain after verification.


