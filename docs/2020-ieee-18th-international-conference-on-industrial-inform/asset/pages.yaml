    +   1) Innovative data storage and sharing modes: During the scheduling process,
    huge amounts of data regarding research state and transactions will be generated
    and collected. When the size of blocks is limited, innovative data storage and
    sharing methods are needed, so that important information can be stored and shared
    during the scheduling process.


    +   2) Scientific consensus protocols: In the scheduling process of cloud manufacturing,
    transactional throughput, accounting frequency, and requirement for consistency
    are much higher than those of traditional methods. As a result, it is necessary
    to develop consensus mechanism that can support high throughput.


    +   3) Development of new scheduling algorithm: Algorithms are an important part
    to ensure credibility of scheduling in cloud manufacturing. The current scheduling
    algorithms are focused more on optimizing instead of making scheduling efficient.
    In fact, different algorithms have different degrees of credibility. A credible
    scheduling algorithm can guarantee scheduling with high reliability and efficiency.


    +   4) Efficient retrieval mechanism: Blockchain provides a mechanism for credibility
    of scheduling, but its structure is insufficient in retrieving information from
    the blocks. As the number of blocks in a blockchain grows, efficiency may become
    a bottleneck for scheduling because the scheduling process needs many information
    about and their transactions needs to be obtained in real-time to accelerate the
    scheduling process. Therefore, the efficiency of the retrieval mechanism needs
    to be improved to enhance the efficiency of scheduling.'
