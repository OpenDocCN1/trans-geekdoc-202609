    # IoT - blockchain-enabled credible scheduling in cloud manufacturing: a systemic
    framework


    Yongkui Liu

    School of Mechano-Electronic Engineering

    Xidian University

    Xi''an, China

    yongkliu@163.com


    Jingxin Zhang

    School of Electronics and Control

    Chang''an University

    Xi''an, China

    1556753630@qq.com


    Lin Zhang

    School of Automation Science and Electrical Engineering

    Beijing University

    Beijing, China

    jlin9999@163.com


    Huang Liang

    School of Electronics and Control

    Chang''an University

    Xi''an, China

    hliang@cctd.edu


    **Abstract—Cloud manufacturing is a service-oriented manufacturing model to provide
    consumers with demand manufacturing services over the Internet. Scheduling is
    a technology for cloud manufacturing to achieve its goals. However, scheduling
    in cloud manufacturing faces series of challenges. To ensure the credibility of
    scheduling solutions (i.e. being able to function as expected) is one of the challenges.
    IoT and blockchain provide key technologies for addressing these challenges. We
    propose a framework for credible scheduling in cloud manufacturing based on the
    aforementioned technologies. A framework for credible scheduling in cloud manufacturing
    based on IoT and blockchain scheduling services are developed. Finally, a case
    study of the car industry is given to validate the effectiveness and feasibility
    of the proposed framework.**


    **Keywords—Cloud manufacturing, Credible scheduling, IoT blockchain**


    Blockchain provides an effective means to solve the credible problem of scheduling
    in cloud manufacturing. The combination of IoT and edge computing facilitates
    real-time monitoring and credible perception of manufacturing resources and manufacturing
    capability, thereby solving the problem of machine-to-human trust in manufacturing
    processes. blockchain technology with its decentralized feature provides effective
    means for ensuring the credibility of physical manufacturing resources and manufacturing
    capabilities and the credibility of transaction information during the manufacturing
    process. To solve the problem of complexity of scheduling in cloud manufacturing,
    this paper focuses on credibility of data and information in the scheduling process
    without considering credibility.


    The rest of this paper is structured as follows. Section II reviews related work
    on cloud manufacturing, and scheduling, IoT, and edge computing. Section III presents
    a framework for IoT-blockchain-based credible scheduling in this cloud manufacturing.
    Section IV concludes this paper with some discussions on future work.


    ## I. INTRODUCTION


    In 2010, mimicking the concept of cloud computing, and integrating with technologies
    like IoT, a service-oriented new manufacturing model was proposed [1]. The aim
    of cloud manufacturing is to provide consumers with on-demand manufacturing services
    over the Internet. More technologies such as big data, artificial intelligence,
    blockchain, are rapid upon development. The integration of these technologies
    into cloud manufacturing makes it a key technology for cloud manufacturing to
    achieve its aim.


    However, scheduling in cloud manufacturing faces series of challenges [2]. To
    ensure the credibility of scheduling solutions (being able to function as expected)
    is one of the challenges. A scheduling solution depends on the credibility of
    data and algorithms. IoT and blockchain provide key technologies for ensuring
    the credibility of data and information. As shown in Figure 1, technologies of
    IoT, edge computing, and


    ![](img/3b0db0de942e3f1d134343b9abb2b23a_0_0.png)


    Fig. 1. Problems with cloud manufacturing scheduling.


    Problem 1: The cloud scheduling trust is easily established, and the credit of
    parties to transaction cannot be guaranteed, ensuring transparency and transaction
    risks.


    Problem 2: There are many participating companies with uneven qualifications,
    and the ability to provide physical resources reliable data, and developing a
    better algorithm is difficult.


    This work was supported by the National Science Foundation of NSFC (under Grant
    No. 61973243 and 61873014.


    ## II. RELATIVE WORK


    This section introduces some of the major technologies of cloud manufacturing,
    scheduling, blockchain, IoT, and edge computing.


    ### A. Scheduling in cloud manufacturing


    Cloud manufacturing is a manufacturing model that supports the aggregation of
    distributed manufacturing resources in the form of configurable manufacturing
    services and on-demand use of cloud services. Scheduling is one of the core problems
    in cloud manufacturing system [4]. Li et al. [5] proposed a multi-task-based model.
    Dynamic resources were taken into account, logistics across enterprises, and enterprises.
    They further investigated the issue-oriented cloud manufacturing service composition
    of work-based manufacturing scheduling. Li et al. [6] proposed a multi-agent architecture
    that includes scheduling and optimizing resources in platform-based smart manufacturing
    systems. Li et al. [7] proposed a framework for cloud manufacturing with DRL.
    A DRL model for online task scheduling in cloud manufacturing improves the effectiveness
    of the framework. Li et al. [9] proposed a resource cloud strategy based on Deep
    Q network to minimize the average complexity and speed.


    ### B. Blockchain


    Blockchain is a chain where data is maintained by multiple blocks [10]. It typically
    includes a header and a block body. The header contains the index, the hash value
    of the previous block, the timestamp, and the hash value of each transaction.
    The block body contains the data of each transaction in order. Figure 2 shows
    the structure of a blockchain.


    - Types of blockchains: To accommodate different degrees of openness and transparency
    with some application scenarios, blockchains can be divided into three types:
    public, consortium chains, and private chains.

    - Public chains: A public chain is the most decentralized. Anyone can participate
    in the maintenance and reading of the blockchain, and can freely join and exit
    the blockchain.

    - Consortium chains: A consortium chain is the most closed and only members within
    the organization can participate. Other nodes not on the chain can query the content
    of the alliance, but cannot participate in the consensus process in the chain.

    - Private chains: A private chain is different it has the lowest degree of decentralization.
    It is limited to within the enterprise or individual members. The query and permissions
    of the chain can be publicly opened to the public.


    ![](img/3b0db0de942e3f1d134343b9abb2b23a_1_0.png)


    Figure 2. Structure of blockchain


    2) Smart contract: Smart contracts are decentralized, and share code deployed
    on the blockchain [11]. Digital interact with the present conditions and executing
    smart contract terms are


    Currently, many different research areas have focused on Li et al. [12] proposed
    a blockchain-based distributed manufacturing platform, a cross-enterprise network
    and service framework based on blockchain and edge computing. Li et al. [14] proposed
    a blockchain-based composition architecture in cloud manufacturing. After adding,
    blockchain technology can directly see the result of services and can directly
    execute contracts without a third-party platform.


    ### C. IoT and Edge computing


    The idea of IoT was proposed in 1982. Connectivity refers to connect devices through
    sensors, RFID and other techniques to the Internet to achieve intelligent identification
    and management. With the rapid development of network, RFID and sensor technology,
    the Internet of Things is widely used in our lives. Yang et al. [15] proposed
    a service-oriented architecture for multi-manufacturing methods. Li et al. [16]
    developed an IoT-based tracking platform for the packaged food chain.


    Edge computing is one implementing the technology needed for cloud manufacturing.
    It is a decentralized computing architecture that moves data and services from
    central nodes to edge nodes. Field devices can be embedded in the computing function
    to achieve autonomy of distributed information processing [17]. With the rapid
    development of the Internet, Georgopoulos et al. [18] proposed a roadmap for the
    combination of edge computing and IoT-based manufacturing to improve product quality
    and the ability to respond to changing contexts. Sugana al. [19] proposed a edge
    computing architecture based on multi-agents, which is suitable for large-scale
    IoT systems.

