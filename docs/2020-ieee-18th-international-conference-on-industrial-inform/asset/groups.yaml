    > 图 3. 一种基于物联网和区块链的可信调度建议框架


    # III. 基于物联网和区块链的可信调度框架


    制造业中的物联网、边缘计算和区块链可信调度确保了三个方面的可信度：物理资源、云边协作以及云端生成的解决方案。物理资源的可信度可以通过物联网、边缘计算、监控、调度来确保；云边协作的可信度可以通过区块链确保；而物联网、边缘计算和区块链的可信度得到了保障。我们提出了一个由
    5 层组成的框架，即用户层、核心功能层、基础层、感知层和资源层。每一层的功能如下：


    - 1) 用户层：用户层中的用户包括平台运营者、服务提供商和服务消费者。每个


    - 2) 核心功能层：核心功能层负责执行云制造系统的各种核心功能。在本文中最重要的功能是执行任务分解为子任务、服务搜索与匹配、组合与调度等。在物联网、边缘计算和区块链的帮助下，本文中的调度通过两个特性得到了增强：云边协作和可信。前者意味着调度考虑了云端边缘制造资源和能力的实时状态，并且云与边缘之间存在实时协作；后者意味着生成的调度解决方案在边缘计算和物联网的帮助下作为消费者需求发挥作用，我们可以确保数据和信息的实时交互，并有信地制造产品；通过区块链，可以在智能合约的帮助下执行调度和传感器，以确保用户交易的安全可靠，从而确保制造过程从每一个环节都是可信的。


    - 3) 基础层：基础设施指的是云平台、边缘计算、存储、物联网等基础设施，以及传感器、执行器等。这一层在实现整个系统的层级功能中起支持作用，确保信息采集和交互的完整性。


    - 4) 感知层：感知层通过 RFID 和传感器感知制造资源和制造能力的状态，以确保企业提供的服务和制造数据是可靠的。物联网和边缘计算在感知资源状态并将其连接到云端起着重要作用。


    - 5) 资源层：资源层由各种制造资源和制造能力组成。制造资源分为硬件资源和软件制造资源。制造能力包括实验、设计、仿真等能力。


    ## A. 可信制造资源


    制造资源的可信度通过物联网与边缘计算结合实时数据来确保。物理资源和云边连接可以通过调度策略的一部分来实现，该策略决定了制造资源的工艺和质量。只有实时处理制造资源信息才能实现全局调度优化，确保调度的效率和可信度。生成调度解决方案后，相应的指令将从云端传输到边缘。通过配备
    RFID 等传感器的物理资源，指令从云端传输到边缘进行执行。通过物联网技术，云边缘之间的实时通信改进了大量数据的性能。边缘计算确保了物理资源的可信性。图 4
    展示了物理资源的可信结构。


    ## B. 服务可信


    服务可信包括调度可信和交易可信。用户进入系统后首先需要向平台提供信息。通过验证后，用户进入系统。只有经过认证的用户才能进入网络。系统的每个用户充当节点，有助于系统的稳定性。在云端，用户请求任务，服务提供者发布信息。云平台根据任务需求进行合理的调度并存储信息。通过区块验证后，调度信息存储在区块链中。用户根据调度信息签署智能合约。任务完成并提交后，用户将交易区块发送给服务提供者以创建交易区块。通过节点验证后区块加入区块链。如果交易失败，该区块也会添加到区块链中。这种设计等同于服务。如果后期出现问题，回顾查询可以进行得更快。由于整个调度信息和交易信息都存储在区块链中，因此无法修改，确保了调度过程的可信度。图
    5 显示了操作流程。


    ## C. 案例研究


    我们将通过车辆示例来更好地说明上述架构。首先，用户登录系统注册钱包名称，然后向云平台发布相关信息（如生产日期、颜色和型号），云平台生成任务调度策略以形成交易。之后，用户利用交易双方形成智能合约，相应的规则嵌入区块中。每个制造商将生产过程中产生的数据加载到区块中，并在验证后最终加入区块链。


