    # A. Scheduling in cloud manufacturing


    Cloud manufacturing is a manufacturing model that supports the aggregation of
    distributed manufacturing resources in the form of configurable manufacturing
    services and on-demand use of cloud services. Scheduling is one of the core problems
    in cloud manufacturing system [4]. Li et al. [5] proposed a multi-task-based model.
