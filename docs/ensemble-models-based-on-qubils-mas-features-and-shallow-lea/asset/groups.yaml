    # 基于 QuBiLS-MAS 特征和浅学习的集成模型用于药物诱导肝毒性的预测：改进深度学习与传统方法


    Jose R. Mora, Yovani Marquez-Ponce,‡ César R. García-Jacas, and Amileth Suarez
    Causedo


    引用此文：Chem. Res. Toxicol. 2020, 33, 1855–1873


    在线阅读


    访问 | 指标 | 相关 | 文章推荐 | 支持信息


    ![](img/d712c719d520e68489790616d7410fde_0_0.png)


    摘要：药物诱导肝损伤（DILI）是药物开发中的安全性关注问题，也是监管关注的问题。因此，许多药物被认为会诱导有机化学品的肝毒性。本研究基于2D-3D 描述符和机器学习技术，在包含1075个分子的训练集上开发了预测
    DILI 的分类器。获得的最佳集成模型 E13 在学习系列中具有良好的统计参数，其准确率 = 0.840，灵敏度 = 0.890，精确率 = 0.761；MannWhitney
    相关性 = 0.660，ROC曲线下面积 = 0.904。该模型还通过 Y 采样测试、重复 k 折交叉验证和重复 k 折验证通过了验证。此外，还使用两个和五个外部测试集进行了外部验证（准确率
    = 0.802，灵敏度 = 0.845，精确率 = 0.715；在其适用范围内的准确率为 98.4%）。对 E13 模型结果和预测的性能进行统计分析表明，文献中也介绍了
    DAE、Dropout SoftClassifier、深度学习和随机森林。总而言，E13 在所有实验中表现出最佳的全局性能。排名程序的总和提供了与 MANOVA
    统计分析相似的分组程序，其中 E13 被确定为 DILI 预测的最佳模型。此外还开发了一种 DILI 预测推荐工具，可在 http://tomcomond.com/api/ptoxra
    免费获取。该软件用于筛选包含天然产物、先导化合物、毒性材料和 FDA 批准药物的各种数据集，以评估 QSAR 模型在物质 DILI 标记中的作用用性；所评估的分子均为
    DILI 类化合物。综上所述，E13 模型是预测人类 DILI 风险的相关方法，且在所有使用的方法中显示出最佳结果。


    ## 引言


    肝脏是主要的毒素器官，因为它与药物和异物代谢有关。药物诱导肝损伤（DILI）²是最昂贵且最危险的毒性类型之一。许多临床试验的存续、新药拒绝和药物撤回决定都是基于肝毒性药物导致肝损伤的证据做出的。早期识别
    DILI 是必需的，尽管体外/体内元素与人体之间的相关性有限，且当人群暴露于上市药物时，观察到对肝脏特异性反应的预测。⁵⁶ 因此，结合以下经典研究


    接收日期：2020年2月27日

    发表日期：2020年5月14日


    ![](img/d712c719d520e68489790616d7410fde_0_1.png)


    © 2020 美国化学学会 1855

    https://doi.org/10.1021/acs.ctrx.0.00030

    Chem. Res. Toxicol. 2020, 33, 1855–1873


    通过动物进行化学毒理学研究，重点在于使用不同方法构建许多预测模型，例如毒性因子、基因敲除或化学小鼠；生物标志物方法、化学结合和体外方法。体外方法可以获得超过70%的灵敏度，其准确率可以替代体内方法。虽然这些体外实验更容易比较，但它们的成本高昂，且受到实验试剂可用性的限制。毒理学家已经在大量化合物中进行了评估，但尽可能少使用动物或体外实验。此外，已经确定将消除所有动物测试要求。


    意义上，使用动物的潜在替代方案是创建分子规则和计算机模拟（in silico）模型。在体外和体内分析之前使用计算机模拟方法。需要提到，必须通过生物测试来生成用于此类实验的数据。


    在过去的20年里，已经开发了许多用于预测肝毒性的数据集和技术。主要工作集中在对不同类型的描述符和分子编码使用浅学习和深度学习方法。此外，一些参与药物结合预测建模的小组开发了具有用户界面（UI）的不同程序应用程序，例如
    DILIweb-15、HepatProEL-21 和 ProTox-22。在数据方面，许多数据集的开发基于药物与人类蛋白的结合亲和力（正值或负）。最常用的数据集之一就是上述提到的。


    该数据集尚不充分且难以研究其本质；它包含了药物和类有机化合物。这一事实近年来得到了解决。其他重要的数据集，如 DILI 数据库和 DILshift 也被采用；它们已通过
    FDA 批准用于 DILI 的药物标记集。


    据我们所知，当前模型的性能/适用范围有限，DILI 预测在药物开发早期的应用仍不尽人意。因此，需要开发新方法。


    在本研究中，使用 QChemBL-MS 软件获得了基于原子和键的 0-2D 代数索引，QChemBL-MS 描述符已广泛用于 QSAR 建模，并且比化合物索引保留更多信息。其他索引包括
    MACCS、Daylight、Dragon 和 Mordell。在这里，首次使用了这些拓扑模型；开发了用于二进制药物预测的新方法和跨平台，可在 pubs.org/
    免费下载 优化（使用 RDK (https://www.rdkit.org/) 使用 UFF 力场进行 3D 结构预测）。 训练集（基于 0_TR_1075
    并由 1075 个化合物组成）和测试集（基于由 120 个分子组成的 VALID 集 (1_RS_120) 和由 2 个分子组成的 valBLOCK 集 (2_BS_47)）由
    Li 等人¹ 进行了评估。选择该训练集是因为它足以代表化合物的化学多样性，并被用于确认所用分类器的稳健性和预测能力。此外，我们发现数据集 3_HE_205、4_DR_417、5_DERS_928
    和 6_AI_280 包含与训练集重复的化合物。因此，我们决定使用不同的化合物进行训练，重复的仅用于评估我们模型的优劣（预测能力）。


    数据集 7_HE_554 的性能是根据相对于训练集的 554 个非重复化合物来判断的。除了化合物标签外，没有使用其他模型；即原始论文中使用的。分别是 3D
    结构、支持信息、DILI 标记文件以及 II_i 和 II_j。每个数据中的正例和负例的信息见表 1。


    ## 1. 训练、验证和外部数据集


