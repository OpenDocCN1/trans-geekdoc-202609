    # 研究中的化学毒理学


    pubs.acs.org/ct

    文章

    针对特定健康问题的新具特异性或强效的药物并不一定是因为毒性的存在。


    在 FDA 批准药物的特定案例，分析中识别出 2608 个分子，覆盖率达到 69.99%。从这些分子集中，筛选出 668 个化合物并分别标记为 DILI（肝毒性损伤）和非
    DILI。在用 Data-DL 和 DL-Lead 方法对该集合进行筛选时，注意到使用前一种方法筛选了化合物总数的 49% 和 51%，而分别对 DILI
    和非 DILI 筛选的化合物，比例分别为 61% 和 93%。最后，在对分子进行评估时，分别有 78% 和 22% 的分子被预测为阳性 DILI 和阴性 DILI。


    同样，在表 3 中，当对基于性能的预测结果在 ETS 上的相似性应用多种分析措施时，表 5 显示的 FDA 批准药物 ETS、Padel DDPredictor
    和 Voxel 的性能结果优于其他 SDR（SDR 均值）结果。这些结果支持可以将模型联合用于预测吲唑（indazole）的 DILI 标记。其中几类别的选择是通过多数投票完成的（见
    SI4），其性能结果对于 ETS 而言优于 E15 模型。


    已使用不同开发阶段的大型化合物集进行了筛选。DILI 预测的分布说明了这些数据集在药物发现和开发中的当前状态。预计计算方法的结合可以为药物发现阶段的药物分子提供最佳的毒性估计。


    ## 总结与结论


    在过去的 50 年中，DILI 是导致安全相关药物市场撤回最常见的原因。DILI 估计对患者和制药行业来说都是一个主要问题。事实上，人类模型对于国际模型来说仍然是一个挑战。事实证明，基于
    QSAR 的 2D-SD 分子描述符和浅层机器学习技术（通过使用不同的集成生成和严格的内部及外部验证方案）的模型可以增强 DILI 预测的性能和可靠性。


    为此，开发了两个健壮的模型（M2 和 M9），它们在随机测试集和黑验证测试集上的训练准确率分别为 0.735±0.76 和 0.76±0.84。通过使用单个模型的预测概率值，我们构建了一些集成模型，其中
    E15 是 DILI 预测中最好的。这些集成模型相对于单个模型取得了显著增强，AC、SE 和 SD 的准确率分别达到 0.853、0.88 和 0.76。通过内部验证测试和外部验证测试获得了良好结果。


