    For the specific case of the FDA approved drugs, 2608 molecules were identified
    in the analysis and a coverage of 69.99% was obtained. From the set of molecules
    into 668 and the compounds were labeled as DILI and negative-DILI, respectively.
    In the screening of this set with the Data-DL and DL-Lead methods, it is noted
    that 49 and 51% of the total number of compounds with the former method, and 61
    and 93% of the compounds screened with DILI and negative-DILI, respectively. Finally,
    78 and 22% of the molecules were predicted as positive-DILI and negative-DILI,
    respectively, when the molecules were evaluated.


    Likewise, in Table 3, when many measures were applied to the analysis of the similarity
    of performance-based prediction results on ETS, the results in Table 5, showing
    performance of the FDA approved drugs ETS, Padel DDPredictor, and Voxel yielded
    better results than those of the other SDR (SDR means) results. These results
    support that the models could be used jointly to predict DILI labeling of indazole.
    For the selection of several of these classes was carried out by a majority vote
    (see SI4), the performance yielded results better than the E15 model for ETS.


    A screening has been performed using a large set of compounds in different development
    phases. Distributions of DILI predictions illustrate the current status of drug
    discovery and development of these data sets. It is anticipated that combination
    of computational approaches could provide the best estimation of toxicity for
    drug molecules in the early stages of discovery.


    ## SUMMARY AND CONCLUSIONS


    DILI has been the most frequent cause of safety-related drug market withdrawals
    for the past 50 years. The DILI estimation is a major issue for both patients
    and pharmaceutical industry. In fact humans remains a challenge for inational
    models. It should be shown that models based on QSAR-based 2D-SD molecular descriptors
    and shallow machine learning techniques (by using different ensembles generation
    and a rigorous internal and external validation scheme) were employed to enhance
    the performance and reliability of DILI predictions.


    To end this, two robust models, were developed (M2 and M9), which present training
    accuracies 0.735±0.76 and test accuracies 0.76±0.84 for the random and black validation
    test sets, respectively. By using the prediction probability values from the individual
    models, we constructed some ensembles, being the E15 and the best ones in DILI
    prediction. These ensemble yielded important enhancements with respect to the
    individual models, achieving accuracies of AC, SE, and SD of 0.853, 0.88, and
    0.76, respectively. Good results were obtained by using internal validation tests
    and external validation tests (two validation sets and five external sets), to
    improve the robustness and reliability of these.


