    ## 毒理学中的化学研究


    文章


    ## 用于预测 DLI 的 SiLS-PTOXRA 软件


    SiLS-PTOXRA 软件是一个具有友好桌面界面的框架（见图 7），其步骤可以总结为三个步骤：(1) 从 SDF 和 MDL 文件中选择化合物。需要注意的是会生成
    3D 结构；可以直接跳转到 3D 结构的生成（RDKit），将其作为中间步骤。(2) 选择预测模型和评估方法。(3) 选择报告结果的方法。


    筛选后，会显示一个处理结果的界面，并生成一个包含模型所有输出信息的文件夹。大多数情况下，本研究中使用的测试集是以数据集的形式提供的。通过使用测试集 2_B_TS_47
    对每个分子的处理时间进行了实验，结果发现在使用 M2、M9、E12 和 E13 方法时，考虑到用于 AD 的共识方法，每个分子的处理时间约为 3 秒。该实验使用了配备
    Intel i7 处理器和 4 GB RAM 的计算机。


    表 6 给出了我们的软件与文献中报道的一些最相关软件的通用和定性比较。这里介绍的软件与之前报道的相比具有许多优势，并用于数据集筛选，这将在下一节中描述。


    **前瞻性虚拟筛选。** 最后，使用了一个大型天然产物、药物和 EAD 类化合物的数据库（描述在文件 S2、表 S1 中）。使用计算机 E13 模型进行计算
    DLI 预测的结果，对 22,678 个化合物进行了筛选。惊讶的是，发现的比例小于 93%。大多数阳性 DLI 化合物出现在所有数据集中（48），先导化合物和毒化合物数据集显示超过
    65% 的结果为阳性 DLI。


    疟疾数据集获得的结果特别受到关注，$^{73}$ 显示 86% 的病例为阳性。这组分子包含新型且有趣的骨架（40 种化学结构），被用于构建预防疾病的多样化集合。这些化合物中有一是根据药物属性（ADME-tox
    规则）选择的，其他作为分子探针。将化合物纳入疟疾框的主要因素是显示出至少 4 μM 的活性，且选择性比细胞毒性（$CC_{50}$）至少高 10 倍，后者是使用
    HEK-293 细胞测量的。事实上，该数据集通过药理测试要求提供数据和化合物。然而，只有 8% 的这些化合物会被发现（对于 E13 模型为阴性-DLI），因为这些结果对人类具有肝毒性。以上所有场景都证明了计算机
    E13 模型在过程早期对新候选进行 DLI 筛选的适用性。


    对于由天然化合物组成的1_0_ADB 数据集，根据 E13 模型，3% 的分子为阳性 DLI。


