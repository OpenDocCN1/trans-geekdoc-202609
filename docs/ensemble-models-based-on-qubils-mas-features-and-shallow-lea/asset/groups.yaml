    individual classes are used in this disagreement function and the decoration were
    used to quantify the diversity between base models (see S2, S3). The main results
    for the ensembles are given in the Supporting Information, files S1 and S4.


    **Evaluation of QSAR.** Finally, three kinds of validation were used to judge
    the accuracy of QSARs (or other methods) see file S12, S4). Specifically, the
    randomization used were k-fold cross-validation, external validation, and internal
    validation. The Y-randomization test is performed to check the reliability of
    the DLI (activity) in the training set; the k-fold cross validation was used to
    shuffle the test sets obtained from the different training set. Moreover, several
    k-fold iterations were also considered. For each fold and k-fold considered we
    performed 1000 times. So, for each period we obtained in validation (see Supporting
    Information, files S5 and S6) the values were considered from 10 to 50, with a
    scale of 10. Finally, the final validation was performed by using calibration
    and test sets (training/test set). All results are given in the Supporting Information,
    files S1 and S4 and S5.


    **Applicability domain.** The applicability domain (AD) was carried out to evaluate
    the behavior of the models to perform reliably (see S7). In this study, we used
    one method to determine the features that fall within the AD of a model. However,
    there are several AD methods that characterize the interpolation and extrapolation
    of models. So by the ideas of consensus-based prediction, we found that if a molecule
    lies outside of the AD in at least three of the AD methods (consensus-then) it
    is considered as unreliable.


    AD methods were taken from the


    Abstract discovery (see the Supporting Information, file S7).

    **Multiple Comparison of QSAR models.** The comparison is the best way to select
    among the strategies used. We aim to compare various criteria (ACC, SE, SP, and
    MCC) of the models developed by using different methods (similarity), hierarchical
    clustering analysis (HCA), PCA (SCA), one-way multivariate analysis of variance
    (M-ANOVA, with regression parameters), and parameter-based descriptors (PBD).
    The method was used to compare all group properties (each sample group per group);
    that is a test also to perform analysis of the distribution of AD in the seven
    data sets, using an alpha-value of 0.05 (for, see S5 in file S12). The results
    of the distribution and AD values are given in the Supporting Information, files
    S8 and S9. However, M-ANOVA, HCA, and PCA were performed with STATISTICS Software.


    **Software Development and Predictive Screening.** We used the software named
    SwissAD-PROTOX (the in silico screening and prediction of toxicity hazard and
    risk assessment, developed by the University of Basel), consensus models M12,
    and M24 were then incorporated into the aforementioned software in order to predict
    the order organic toxicity of groups. The best estimates in this study were obtained
    by the software written in the Java (version 1.8) programming language, and it
    is cross-platform. The development used the Java Development Kit (JDK) (version
    1.8.091), QQiBit-S, and AMBIT (version 0.0.4), which were used to calculate the
    chemical properties, the calculation of applicability domain (AD), and prediction
    of toxicity end points.


