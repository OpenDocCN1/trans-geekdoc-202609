    |---|---|---|---|

    | 训练集 | 0_TR_1075 | 652 | 423 |

    | 测试集 | 1_RS_120 | 72 | 48 |

    | | 2_BS_47 | 23 | 24 |

    | 外部测试集 | 3_HE_205 | 130 | 75 |

    | | 4_DR_417 | 178 | 239 |

    | | 5_DERS_928 | 682 | 246 |

    | | 6_AI_280 | 214 | 61 |

    | | 7_HE_554 | 176 | 374 |


