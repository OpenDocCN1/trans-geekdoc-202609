    The best (and base models) in this study showed a significantly better performance
    when based on a statistical and “risk analysis”, with regard to the results reported
    by the literature for the same data sets. The ensemble also showed a better performance
    compared to the prediction by the well-known Padel DDPredictor, as well as with
    regard to DL-Combined, DL-Liew and Vlead models established in the literature.


    A variety and free classification screening of drug toxicity was achieved with
    DDPredictor (http://www.chem.com/priority). This software showed advantages over
    other methods, and it is clear that the software has the capacity to create big
    data sets.


    In summary this study provides a highly accurate approach using a set of compounds
    in different development phases, that highlights the potential of the DLI compounds.
    This scenario demonstrates the necessity of a high priority hepatotoxicity in
    silico evaluation, mainly in the early stages of preclinical trials.


