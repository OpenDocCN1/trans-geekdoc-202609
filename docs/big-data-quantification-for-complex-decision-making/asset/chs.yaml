  \ |\n| --- |\n\n## 结论\n\n本章提出了一种基于优势粗集理论的新型`GOMADMMADD`方法，并证明了其通过评估销售团队来对群体进行评估和排序的有效性。然而，它面临着两个问题：一个是评估和排序群体数量的指数级爆炸，另一个该方法在优劣混合程度上缺乏最优性，这使其陷入了瓶颈。为了解决这些问题，对`GOMADMMADD`方法进行了改进，并提出了优化后的`GMADMDRS`方法。在数值实例中，与各种传统方法的排序结果相比，`GMADMDRS`的排序结果是合理的。再次利用`ADND`特征对`GMADMDRS`方法进行优化，优化前后结果保持一致。数值实例的时间性能对比表明，优化后的`GMADMDRS`相比优化前时间性能有了显著提升。最后，利用优化后的`GMADMDRS`解决了破产公司数据集上的证券投资问题。\n\
  \n本章的主要贡献在于基于优势的粗集理论，它提出了`GOMADMMADD`方法并对其进行了改进，提出了`GMADMDRS`方法并对其进行了优化，显著提升了其性能。`GOMADMMADD`方法可以评估每个组群体（如销售组），而优化后的`GMADMDRS`方法可以有效选出最优群体，可应用于投资组合投资问题、队列检查和队列分段等实际问题。通过分析我们所提方法的局限性，发现优化前后的算法仅适用于序数信息系统，而不适用于分类数据。\n\
  \n对于未来的研究方向，我们将从以下三个方面进行研究。首先，我们将`GMADMDRS`扩展到模糊环境并在该环境下设计相应的方法。其次，我们将设计一种新算子使`GMADMDRS`适用于分类数据，扩展`GMADMDRS`能够处理的数据类型范围。最后，凭借`GMADMDRS`的有效性和时间性能，将其应用于面向群体的多属性决策问题，如群体检查、群体划分、群组检查和队列分段。\n\
