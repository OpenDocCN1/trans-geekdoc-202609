  \ & Lai, C. X. (2022). 农业问答系统问题分类研究. 河南科技大学学报, 3, 63–70.\n\n## 第 9 章\n\n- **牛雨格**（中国山西大学）\n\
  - **刘可欣**（中国山西大学）\n- **陆芳**（中国山西大学）\n- **张嘉怡**（爱尔兰圣特林斯学院）\n\n### 摘要\n\n多属性决策（MADM）分析是决策过程中广泛应用的一个重要领域。随着数据量的增加，全面理解大规模数据变得至关重要。然而，目前的研究缺乏获取大规模数据的全方位方法。本章旨在通过总结\
  \ MADM 研究中的经典论文、开放数据集、遥感数据、情感分析和问卷调查数据收集形式，解决这一研究空白。经典论文提供了丰富的背景知识，开放数据集提供了多样化的大规模数据。此外，遥感数据为城市规划和环境管理决策提供了实时信息。最后，情感分析利用社交媒体获取独特见解，而问卷调查是有效的。总而言，本章有助于研究人员和专业人士改进数据收集方法的选择和设计，确保数据收集的可靠有效，从而提高决策能力。\n\
  \n## 引言\n\n\n\n\n\n随着互联网技术、云计算和物联网等新兴技术的快速发展，数据规模呈爆炸式增长。海量数据的积累和存储为国家决策和企业运营带来了巨大的机遇和挑战。这些数据包含了各个领域的丰富信息，可以帮助人们更好地理解现实世界的运作方式和演变规律。大数据动态地反映了各种经济和社会指标的发展趋势，并从多个维度和层面反映了政策实施的效果，使社会管理更加精细化和智能化，并为人们提供了更科学、基于数据的决策思维（Yaqoob\
  \ et al., 2016; Zhang et al., 2024)）。`MADM` 是决策科学的重要组成部分，是指在决策过程中需要综合考虑多个属性因素以实现最优决策目标的过程(Zanakis\
  \ et al., 1998)。现实生活中的决策问题往往受到多个属性因素的影响，需要综合考虑多个属性的影响(Zhang, 2008a; Wang et al.,\
  \ 2021)。通过综合考虑多个属性因素，我们可以更全面地评估决策对象，更准确地把握决策环境，并做出更科学合理的决策，这有助于提高决策的准确性和有效性(Zhang\
  \ & Yager, 2008b; Zhang et al., 2023)。\n\n数据收集是 `MADM` 研究的关键部分，因为其质量和完整性直接影响最终的决策结果(Platts\
  \ et al., 2002)。目前，学术界常用的有五种数据收集方法：\n\n1. (1) 从经典论文中获取数据：经典论文是指在某一领域具有重要影响和代表性的研究结果。经典论文包含了丰富的数据，可用于\
  \ `MADM` 的分析和决策。通过对这些数据进行深入分析和评估，决策者（DM）可以更好地理解问题的本质和背景，从而做出更准确的决策(Van Oudenhoven\
  \ et al., 2018)。这些数据可以建立各种不同类型的决策模型，如层次分析法（`AHP`）、模糊综合评价法、熵权法等，也可以用于优化决策方案，帮助决策者评估和比较不同的决策方案，从而选择最优方案并提高决策的科学性和效率(Zhang\
  \ et al., 2019)。然而，经典论文中的数据可能存在更新滞后、获取困难和缺乏多维度信息等问题。\n\n2. (2) 情感分析：情感分析也称为意见挖掘或情感分析，是指利用自然语言处理和机器学习（`ML`）技术识别并理解文本中表达的情感和情绪。情感分析与多属性决策之间存在紧密的关系(Ji\
  \ et al., 2018)。情感分析可以帮助决策者更全面地了解决策对象的心理倾向和态度，从而在 `MADM` 中更好地考虑决策对象的情感因素（Tan et\
  \ al., 2022; Awajan et al., 2021)）。通过考虑情感分析的结果，可以将情感因素纳入 `MADM` 的考虑范围，从而更全面地评估不同选择对情感因素的影响(Wu\
  \ & Zhang, 2019)。这有助于制定更符合市场需求和消费者偏好的决策与策略。\n\n3. (3) 遥感数据：遥感数据是通过卫星、飞机等远程手段获取的地表信息，包括土地覆盖类型、温度、湿度等各种属性(Zhang\
  \ et al., 2016)。这些多属性遥感数据可以应用于环境监测、城市规划和农业生产等领域。在 `MADM` 中，它们提供了全面的地理信息、实时信息、高准确性和跨区域性。通过对这些属性进行分析，可以为决策提供科学依据。\n\
  \n4. (4) 开源数据集：开源数据集是指政府、组织或社区提供的公开可用数据集。这些数据集涵盖广泛，如人口统计、环境数据、经济数据，并包含与决策相关的各种属性，提供了更全面准确的信息并避免了主观偏差。通过分析这些数据集，可以提取出相关性、趋势等信息，帮助决策者更好地理解其决策背景(Barlas\
  \ et al., 2015)。开源数据集可以提供分析所需的历史和趋势数据，促进社区参与，并节省数据收集的时间成本(Zhang et al., 2020a)。然而，它们可能存在数据不完整、隐私安全问题以及数据质量和一致性问题，影响\
  \ `MADM` 的可靠性和准确性(Immonen et al., 2018)。\n\n5. (5) 问卷调查：问卷调查法是通过有效利用数字准确把握复杂宏观世界现象或问题的科学方法。它是一种为解决问题、改进现状和规划未来提供现实依据的方法，是研究社会现象背后各种社会力量产生的客观事实的方法。调查调查法的出现和广泛应用为决策者获取客观有效的数据提供了可行途径。问卷是定量研究（尤其是调查研究）中最常用的数据收集工具或仪器(Taherdoost,\
  \ 2016)。\n\n本章的贡献如下：\n\n\n\n\n\n* (1) 本章将全面讨论各种数据收集方法，包括开放数据集、遥感数据、情感分析、问卷调查等。通过对这些方法进行全面比较，研究人员和从业者可以更好地选择合适的数据收集方法。\n\
  * (2) 本章将侧重于不同数据收集方法的实际应用。通过讨论如何获取和利用这些数据，为决策者（DMs）提供实用的建议，以更好地利用数据支持决策分析。\n* (3)\
  \ 本章将关注较新的数据收集方法，如遥感数据和情感分析。这些方法在多准则决策（MADM）研究中的应用较少被探索。通过对这些新兴方法的讨论，为研究人员和从业者提供新的思路和方法，丰富\
  \ MADM 研究的数据源。\n\n本章其余部分的结构如下：第 2 节深入了 MADM 领域内五种数据收集方法论的演变。第 3 节详述了这五种数据收集技术在 MADM\
  \ 中的应用，并配有说明实例。第 4 节探讨了与这些方法相关的障碍，并对未来的研究趋势提出了建议。最后，第 5 节提供了全文的总结。\n\n## 文献综述\n\n\
  ### 从经典论文获取数据的文献综述\n\n从经典论文中获取数据，是指从发表的研究论文中提取数据用于后续分析和应用，这是一种常见的研究方法，研究人员可以在现有文献中收集、组织和分析数据，以支持自己的研究\
  \ (Zahedi-Seresht et al., 2016)。这种方法通常用于研究设计，如文献综述、元分析和二次数据分析。在 MADM 领域，也有许多研究人员从经典论文中获取数据。算子、模糊集和粒度计算是\
  \ MADM 中重要的数学工具。在算子方面，Zhang et al. (2018)使用了 Wei (2017)的数值实例，验证了所提方法在模糊 Dombi Heronian\
  \ 平均值算子研究及其在 MADM 应用中的有效性。在模糊集方面，Li et al. (2019)以 Ju and Wang (2013)的案例作为多准则群体决策研究中的数值实例。在粒度计算方面，Zhang\
  \ et al. (2020b)使用了 Zhang et al. (2017)的数据，以便在多粒度概率模型研究中为了处理多准则群体决策问题和区间中性信息，与现有的多准则群体决策方法进行有效的比较和分析。从经典论文中获取数据有助于决策者理解历史决策过程和结果，从而更好地理解当前的决策环境和挑战\
  \ (Brehmer, 1992; Cobo et al., 2014)。这些历史数据也可以用于预测未来的趋势和方向 (Sanchez-Nunez et al.,\
  \ 2021)，从而帮助决策者做出更准确可靠的决策。\n\n### 情感分析的文献综述\n\n“情感分析”一词由 Nasukawa and Yi (2003)提出。情感分析可以在三个层面进行：句子层级\
  \ (Tang et al., 2015),文档层级 (Pu et al., 2019)以及方面层级 (Ma et al., 2019; Nandhini &\
  \ Pradeep, 2020; Nandwani & Verma, 2021)。情感分析技术通常分为基于字典的方法 (Bernabe-Moreno et al.,\
  \ 2020)、基于机器学习的方法 (Tiwari et al., 2020; Maslej-Kresakova et al., 2020](979-8-3693-1582-8.ch009.xhtml#r26)\
  \ ... Dashtipour et al., 2020)以及混合方法 (Ersahin et al., 2019)。情感分析在 MADM 中的应用可分为两类。一类是基于文本的方法，用于从反馈、评论和其他文本中提取情感信息；另一类是基于情感识别的\
  \ MADM，将情感因素视为决策属性之一。情感分析在 MADM 中的应用可以分为两类。一类是基于文本的情感分析，用于从反馈、评论和其他文本中提取情感信息；另一类是基于情感识别的\
  \ MADM，将情感视为决策属性之一。对于基于文本的情感分析，以往研究提出了基于情感词典的情感分析方法。例如，Cheng et al. (2023)构建了血糖仪情感词典，并结合文本清洗等分析技术分析用户评价，将其作为血糖仪的重要指标。此外，研究人员利用机器学习算法对大规模文本进行情感挖掘，为产品营销、舆论监控等\
  \ MADM 提供支持。Rahman and Hossen (2019)使用了伯努利朴叶斯、决策树、支持向量机和极大熵等五种机器学习分类器，对收集的电影评论进行情感分析，从而支持相应的\
  \ MADM。Wu et al. (2023)利用深度神经网络 `BERT`（双向编码器表示）对医疗服务评论进行情感分析，以支持患者选择在线医生。对于基于情感识别的\
  \ MADM，一些研究结合心理理论和决策模型，探索了情感对决策结果的影响，为不同情感状态下的行为提供了理论基础。Sudhakaran et al. (2022)整合心理理论、面部表情和深度学习技术，开发了基于情感识别的音乐模型。总之，将情感分析应用于\
  \ MADM 可以帮助决策更好地更好地民意，提高决策的客观性和民主性，从而更好地满足公众需求并优化决策结果。\n\n### 遥感数据的文献综述\n\n遥感数据在\
  \ MADM 中的应用可以分为定性和定量两类。定性应用主要涉及利用遥感数据进行土地覆盖分类和识别，为决策提供空间信息支持。而定量应用则涉及从遥感数据中提取土地覆盖特征，并将其与其他属性数据结合进行多准则决策分析。\n\
  \n\n\n\n\n在文献综述中，研究人员关注了遥感数据在多属性决策分析（MADM）中的定性应用，特别是遥感影像的分类方法和技术，以及不同遥感数据在陆地覆盖识别和分类中的应用。例如，已有研究针对利用高分辨率遥感影像进行土地利用类型分类（`Shao\
  \ et al., 2020`; `Cao et al., 2023)`），以及利用多源遥感数据进行植被被覆盖度估计（`Hu et al., 2017`）。在定量应用方面，研究人员集中在遥感数据与其他属性数据的融合方法，以及多属性决策分析模型的构建上。例如，研究已开展了利用遥感数据提取城市土地利用信息，并结合经济、社会等多属性数据进行城市规划决策的研究（`Liu\
  \ et al., 2017`），以及利用遥感数据进行环境监测并结合污染源、气象等多属性数据进行环境管理决策的研究（`Ehlers et al., 2006`）。\n\
  \n总之，遥感数据在 MADM 中的应用涵盖了定性和定量两类。相关文献综述证明了遥感数据在陆地覆盖识别与分类、多属性决策分析等领域广阔的应用前景。然而，仍需进一步的研究和探索，以增强遥感数据在\
  \ MADM 中的应用有效性和水平。\n\n# 开放数据集文献综述\n\n开放数据集的发展可以追溯到 20 世纪 80 年代。彼那时，各国政府和学术机构逐渐意识到数据的重要性，并开始开放大量数据，以便更多人能够访问和利用这些信息。在这一阶段，开放数据集主要由政府数据和学术研究数据组成，并受限于当时的技术和网络条件，使得获取和利用数据较为困难（`Uhlir\
  \ & Schroder, 2007`）。随着互联网的普及和技术的进步，开放数据集开始得到更广泛的推广和应用。2007 年，美国政府启动了`data.gov`网站，使大量政府数据集向开放，标志着开放政府数据的开端。随后，越来越多的国家和机构也启动了类似的开放数据平台。这一阶段的开放数据集还涵盖了更广泛的领域，包括经济、社会、环境及其他各方面的数据。\n\
  \n开放数据集的发展也受益于开源社区和数据科学的快速发展（`Janssen, et al., 2012`）。在数字时代，开放数据集已成为经济发展、科学研究和社会治理的重要支持。越来越多的国家和地区必须重视数据政策，加强了开放数据集的建设并拓展了各个领域，为创新和问题解决提供了新可能性。\n\
  \n随着新技术的发展和统计方法的改进，调查方法在收集和组织数据方面变得更快、更科学。在 21 世纪初，越来越多的政府和地区开始发布开放数据集，扩大了应用范围。一些国家和地区建立了专门的数据平台以鼓励数据收集，从而促进数据复用（`Harper\
  \ & Konstan, 2015`）。进入 21 世纪中期，开放数据集成为全球趋势，企业和研究机构也开始开放自己的数据（`Molloy, 2011`）。\n\n\
  ## 问卷调查文献综述\n\n问卷法最早出现在 1882 年，当时人类学家尔顿在伦敦建立了人类学实验室，通过打印问卷收集数据。从那时起，调查方法在探索和理解社会现象方面发挥了重要作用（`Cobanoglu\
  \ al., 2003`）。随着人工智能和大数据的发展，开放数据集在数据驱动决策中发挥着重要作用。越来越多的国家和地区重视数据政策，加强了开放数据集的建设并拓展了各个领域，为创新和问题解决提供了新可能性。一些学者将调查法称为“书面调查法”和“填空法”，其关键点是按照标准程序向个体提供设计的问卷（`Wettergren,\
  \ et al., 2016`）。\n\n\n\n\n\n* (2) 文献检索：搜索学术数据库、期刊或相关的专业网站（如 `Google Scholar`、`IEEE\
  \ Xplore`、`Elsevier`、`Springer` 等），寻找相关的经典论文，以确保论文的可性和学术价值。从论文中获取实验数据、案例数据、调查数据等，为\
  \ `MADM` 的数据分析和决策提供支持。\n\n* (3) 数据组织：将从论文中获取的数据组织成结构化形式，包括属性、属性值、权重等。这可能需要将文本中的描述性数据转换为可以计算和分析的数据格式，例如将描述转换为数字数据。\n\
  \n* (4) 确定属性权重：根据论文提出的方法或实验结果确定每个属性的权重。常见方法包括 `AHP`、`主成分分析`等。根据论文中的特定方法，对数据进行处理和计算，以每个属性的权重值。\n\
  \n* (5) 数据分析：利用论文中的数据和方法分析 `MADM` 对象的数据。这可能包括计算单个属性的得分或排名、计算总分等。这些分析可以基于论文中提出的模型或方法进行，确保数据分析的准确性和可靠性。\n\
  \n* (6) 决策：根据数据分析的结果，结合多个属性的权重，制定决策策略或提出决策建议。这包括对不同的决策方案进行评估、排名或评分，以及最终的决策建议或决策依据。\n\
  \n需要注意的是，在获取数据时，必须遵守相关的法律法规和数据使用协议。某些数据可能受版权保护，或访问和使用时需要特殊许可。因此，在获取数据时务要注意相关的法律要求。\n\
  \n接下来，以环境管理领域的一项研究为例，其目的是评估不同城市的环境质量以制定环保政策，以便更好地解释这种数据收集的形式。以下是一个具体的步骤示例（完整框架见图\
  \ 1）：\n\n| 图 1. 环境质量保护 MADM 框架。 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch009.f01](img/ch009.f01.png)\
  \ |\n| --- |\n\n* (1) 收集每个城市的环境质量数据`，包括空气质量指数、水质指数、垃圾处理、绿地覆盖率等。\n\n* (2) 彻底检索学术数据库，识别出一篇对不同城市环境质量提供全面调查和评估的开创性论文。所论文应提供详细的数据和分析结果。\n\
  \n* (3) 从所选论文中提取相关数据，如空气质量指数、水质指数、垃圾处理和绿地覆盖率。\n\n* (4) 根据论文中提出的方法或实验结果确定每个属性的权重。\n\
  \n* (5) 利用论文中的数据和方法分析 `MADM` 对象的数据。\n\n* (6) 根据数据分析的结果，结合多个属性的权重，制定决策策略或提出决策建议。\n\
  \n| 图 2. 对 IEEE 上的情感分析。 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch009.f02](img/ch009.f02.png)\
  \ |\n| --- |\n\n### MADM 情感分析的具体方法\n\n情感分析应用于 `MADM` 的具体步骤如下：\n\n* (1) 确定决策对象：明确识别对象，如产品、服务或品牌。\n\
  \n* (2) 数据收集：收集相关数据，如用户评论、社交媒体评论等。这些数据应涵盖多个属性，如产品性能、价格、外观等。研究人员还使用 `SemEval`、`Stanford\
  \ Sentiment Treebank`、`国际情感推理与情感调查` 等数据集来评估模型的有效性。此外，使用网络爬虫工具收集数据也是数据收集的好形式。\n\n\
  * (3) 数据预处理：清洗并预处理收集的数据，包括去除噪声、文本标准化和情感词提取，为情感分析做准备。\n\n* (4) 情感分析：使用情感分析技术识别并分析文本中的情感倾向。情感分析可以基于\
  \ `ML` 模型或深度学习模型来识别文本中的情感极性（积极、消极、中性）和情感强度。\n\n* (5) 确定属性权重：根据决策对象的多个属性，使用专家评估、`AHP`\
  \ 等方法确定每个属性的权重。\n\n* (6) 计算情感得分：通常涉及情感词提取、分类和情感强度。然后，根据情感强度值和情感词频率计算文本的情感得分和极性，以评估用户对每个属性的情感影响。\n\
  \n* (7) 决策：根据情感得分和权重，综合评估决策对象的各个属性，形成综合评估结果，从而制定相应的决策策略，如产品改进、市场定位调整等。\n\n这里，我们将使用\
  \ Yang 等人 (2023) 关于个性化新能源汽车购买的研究为例，解释如何更好地将情感分析应用于 `MADM`。完整框架见图 3。\n\n| 图 3. 个性化新能源汽车购买\
  \ MADM 框架 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch009.f03](img/ch009.f03.png)\
  \ |\n| --- |\n\n第一步：“汽车之家”平台的“口碑”界面提供了用户对所购新能源汽车的丰富评价。因此，Yang 等人选择利用平台评论信息来帮助“汽车之家”改进其个性化产品推荐服务。\n\
  \n\n\n\n\n### 步骤 2\nYang 等人利用爬虫工具从“汽车之家”平台（[`www.autohome.com.cn`](https://www.autohome.com.cn)）选取了\
  \ 6 款电动汽车（玲宝 T03、五菱宏光 MINIEV、比亚迪 汉、比亚迪唐、蔚来 ES6 和小鹏 P7），并将这些电动汽车的评价分为八个属性：空间、动力、操控、能耗、舒适性、外观、内饰和性价比。为了方便理解，我们展示了“汽车之家”平台上这些车辆的车主评论，所示图\
  \ 4。\n\n### 步骤 3 和 步骤 4\nYang 等人对每种新能源汽车利用产品推荐平台上的 Gooseeker（[`www.gooseeker.com/`](http://www.gooseeker.com/)））。他们通过清理数据、建立情感字典、获取数据趋势以及对新能源汽车各属性的评价进行转换，进行了情感分析，从而获得正面、负面和中性评论的数量。\n\
  \n### 步骤 5\n根据公式，他们计算了每个产品属性的三种不同情感极性的比例，并将其转换为相应的值。随后，他们构建了一个多属性综合情感矩阵。\n\n###\
  \ 步骤 6\n使用 q 隶正交模糊加权划分 Mourehd 算子，通过聚合信息矩阵获取每种情况的 q 隶正交模糊数。之后，根据实际意义将属性分为三个部分，并由用户设置每个属性的权重。然后他们根据评分函数的方程计算产品得分。\n\
  \n### 步骤 7\n他们根据评分函数的比较规则，推荐了符合用户个性化偏好的新能源汽车。\n\n| 图 4. 汽车之家上的车辆类型和评论 |\n| --- |\n\
  | ![Figure979-8-3693-1582-8.ch009.f04](img/ch009.f04.png) |\n| --- |\n\n## 结合遥感数据的\
  \ MADM 具体方法\n\n遥感数据在多属性决策分析（MADM）中的应用通常涉及以下具体步骤：\n\n*   (1) 数据获取：第一步是获取相关的遥感数据，可能包括卫星图像、航空摄影图像、激光雷达数据等。这些数据可用于获取表面地形、植被覆盖、土地利用等信息。\n\
  *   (2) 数据预处理：获取的原始遥感数据可能需要进行预处理，包括大气校正、几何校正、图像配准等，以确保数据的准确性和可用性。\n*   (3) 特征提取：利用遥感数据提取相关的地理特征，如植被覆盖、土地类型、水域分布等。这些特征通常通过图像处理和遥感技术实现。\n\
  *   (4) 数据集成：将从遥感数据中提取的不同特征进行整合，形成多属性数据集，其中可能包括植被覆盖、土地类型、地形起伏等。\n*   (5) 属性权重确定：对于不同的属性，需要确定它们在决策中的重要性和权重。这可以通过专家评估、层次分析法（AHP）、模糊综合评价等确定。\n\
  *   (6) 决策模型建立：根据多属性数据及其权重，建立 MADM 模型，常见模型包括加权线性组合模型、模糊综合评价模型、TOPSIS 模型等。\n*   (7)\
  \ 决策分析：使用建立的决策模型对不同的方案或选项进行评估和分析，以确定最优决策方案。\n*   (8) 结果展示：将决策分析的结果视觉化，供决策者（DM）和利益相关者理解和参考。\n\
  \n上述步骤是遥感数据应用于 MADM 的通用过程，在实际应用中可以根据具体问题和数据情况进行适当调整和扩展。\n\nMADM 涉及的具体步骤通常包括以下内容（完整框架通过图\
  \ 5 所示）：\n\n*   (1) 数据获取：需要获取相关的遥感数据，可能包括卫星图像、航空照片、激光雷达（LiDAR）数据等。这些数据可用于获取有关地形、植被覆盖、土地利用等信息。数据可以从\
  \ USGS 地球探险、LAADS、Copernicus Open Access Hub、地理空间数据云等平台获取。\n*   (2) 数据预处理：获取的原始遥感数据可能需要经过预处理，包括大气校正、几何校正、图像配准等，以确保数据的准确性和可用性。\n\
  *   (3) 特征提取：利用遥感数据提取相关的地理信息特征，如植被覆盖、土地类型、水域分布等。这些特征通常通过图像处理和遥感技术获得。\n*   (4) 数据集成：整合从遥感数据中提取的不同特征，形成多属性数据集，其中可能包括植被覆盖、土地类型、地形变化性等属性。\n\
  *   (5) 属性权重确定：对于不同的属性，有必要确定它们在决策过程中的重要权重。这可以通过专家评估、AHP、模糊综合评价等方法实现。\n*   (6) 决策模型建立：基于多属性数据及其权重，建立多属性决策模型。常见模型包括加权线性组合模型、模糊综合评价模型、TOPSIS\
  \ 模型等。\n*   (7) 决策分析：使用建立的决策模型评估和分析不同的替代方案或选项，确定最优决策。\n*   (8) 结果呈现：将决策分析的结果视觉化，供决策者和利益相关者理解和参考。这可能包括地图或其他最优决策结果的可视化表示。\n\
  \n| 图 5. 结合遥感数据的 MADM 框架 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch009.f05](img/ch009.f05.png)\
  \ |\n| --- |\n\n## 用于 MADM 的开放数据集具体方法\n\n开放数据集可以支持各种类型的 MADM，无论是政府决策、商业管理还是社区发展。它是为决策提供数据支持的主要方法\
  \ (Kirchner et al., 2015)）。互联网上有数千个数据存储库，提供了数百万数据集的访问 (Zhang et al., 2022)）。国家和地区政府、科学出版社和联盟、商业数据提供者等发布了从社会科学到生命科学、高能物理到气候科学等领域的数据。这些数据对于促进研究结果的可重复性、使科学家能够在他人工作的基础上进行研究，以及为数据新闻记者提供更易获取的信息及其溯源至关重要\
  \ (Uhlir & Schroder, 2007)。\n\n从开放数据集获取数据的过程可能涉及以下步骤（完整框架通过图 6 所示）：\n\n| 图 6. 从开放数据集获取数据的框架\
  \ |\n| --- |\n| ![Figure979-8-3693-1582-8.ch009.f06](img/ch009.f06.png) |\n| ---\
  \ |\n\n*   (1) 寻找相关的开放数据集：使用互联网搜索引擎、数据门户（如 data.gov、Kaggle 等）或专门的数据资源平台搜索合适的开放数据集。\n\
  \n\n\n\n\n* (2) 理解数据集的内容和格式：在选择数据集之前，了解数据的类型、规模、数据结构和其他相关信息是非常重要的（Janssen, et al.,\
  \ 2012）。这有助于判断数据是否符合要求，并决定如何提取和处理数据。\n\n* (3) 获取访问权限：某些开放数据集可能需要用户注册或获取访问授权才能下载和使用数据。在此步骤中，遵守数据提供者设定的规则并遵循法律和合规原则至关重要。\n\
  \n* (4) 下载或导入数据集：根据数据集的可用性，你可以选择直接下载数据文件，或通过 API、数据库连接等方式导入数据。\n\n* (5) 数据清洗和处理：获取数据后，可能需要进行数据清洗和处理。这包括处理缺失值、离群值以及标准化数据格式，以确保数据质量和一致性。Zhang\
  \ et al. (2023) 使用了开放数据集的数据，在数据清洗和分析后，他们利用获得的数据集支持森林火相关的决策，提供了一个很好的示例。\n\n例如，Kaggle\
  \ 数据集是一个开放的数据科学竞赛平台，为数据科学家和机器学习专家提供各种数据集。如图 7 所示，Kaggle 上的开放数据集涵盖了金融、医疗、交通等不同领域。数据科学家可以利用这些数据集来解决现实世界的问题，例如预测股市趋势、诊断疾病、优化交通流等。例如，人员可以使用\
  \ Kaggle 上的医疗数据集，利用机器学习算法分析患者的电子病历，识别疾病的风险因素，并为医疗保健提供更好的决策支持。因此，若要开始，人们可以登录 Kaggle\
  \ 官方网站，搜索相关关键词寻找数据集，并选择符合其研究方法论和算法的数据集。由于 Kaggle 数据集源于真实场景并经过了准确性和可靠性验证，人员可以相对可靠地利用它们进行分析和建模。尽管如此，Kaggle\
  \ 数据集可能存在不完整或偏差等局限性，因此在访问或下载数据集后进行数据清洗和预处理至关重要。此外，数据集的开放性可能会引发隐私和安全担忧，特别是在涉及个人数据时。因此，人员在使用\
  \ Kaggle 数据集时需要遵守相关法规和伦理指南，确保数据安全和隐私保护。\n\n| 图 7. Kaggle 数据集上的医疗数据集数据 |\n| --- |\n\
  | ![Figure979-8-3693-1582-8.ch009.f07](img/ch009.f07.png) |\n| --- |\n\n## 多准则决策（MADM）的问卷调查特定方法\n\
  \n问卷调查是各领域学术或营销研究中常用的数据收集方法。面对面、电话采访和邮寄调查是完成问卷调查的传统方法。然而，随着全球互联网设施普及率的提高（Evans &\
  \ Mathur, 2005），例如，低收入国家尼泊尔的互联网普及率在过去二十年中呈指数级增长，从 1995 年的不到 50 个用户增加到 2015 年的 1190\
  \ 万用户（占总人口的约 45%）（Wright, 2005），技术设备（如平板电脑、硬件）和软件的价格不断下降（Van Selm & Jankowski, 2006），一种新型的在线数据收集技术如在线问卷调查在近年来变得流行（Wettergren,\
  \ et al., 2016）。最近，通过在线焦点小组进行定性数据收集也开始兴起（Stewart et al., 2016），这表明数字时代的研究参与者现在可以在在线多媒体环境中相互以及与访访者或协调员进行互动。\n\
  \n因此，为了获得有效的问卷数据，在开发和运行在线调查时，有六个方法论组成部分对于在线调查的成功至关重要（Lietz, 2010）。这些是：友好的设计布局；选择调查参与者；避免重复回答；数据管理；伦理问题。一旦设计并完成调查问卷，就有必要从中提取数据。在在使用可用软件模块进行分析之前，了解从问卷调查获得的数据性质、结构和特征是非常重要的。例如，比例中的浪费比例通常是调查报告中最常包含的内容。除了比例外，列联表也是调查数据的主要表现形式和分析基础之一。因此，为了从问卷调查中获取数据（Lietz,\
  \ 2010），你可以遵循以下步骤（完整框架见图 8）：\n\n| 图 8. MADM 使用问卷数据的框架 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch009.f08](img/ch009.f08.png)\
  \ |\n| --- |\n\n* (1) 有必要设计有针对性和操作性的问卷，包括开放式和封闭式问题以获取全面的信息，必须是用户友好的设计。\n* (2) 需要选择合适的调查参与者，以确保他们能够真实反映数据。\n\
  * (3) 可以通过面对、电话、在线或其他方法进行调查，以确保数据的完整和准确。\n* (4) 需要对收集的数据进行组织和分析以得出结论并提出建议，这包括分析比例、设置列联表和检查伦理问题。\n\
  \n通过这些方法，可以从问卷中有效获取数据，为后续决策提供强有力支持，如图 9 所示。\n\n| 图 9. 从问卷获取数据。 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch009.f09](img/ch009.f09.png)\
  \ |\n| --- |\n\n## 问题与期望\n\n从经典论文中获取数据的疑问与期望\n\n\n\n\n从经典论文中获取数据是一种传统的数据获取方法。然而，随着人工智能、元宇宙和\
  \ `ML` 的发展，这种方法也面临着若干挑战。首先，随着 `AI` 和 `ML` 技术的进步，对大规模、多样化数据的需求日益增长。传统的经典论文可能无法提供足够多样化且大规模的数据，这使得需要探索替代数据源，以满足算法和模型的需求。其次，来自经典论文的数据可能存在质量和准确性方面的问题，特别是在涉及来自元宇宙等虚拟世界的数据时。未来的工作需要解决如何确保数据的质量和准确性，以增强\
  \ `AI` 和 `ML` 模型的精度和鲁棒性。此外，随着对大规模数据需求的增加，与数据隐私和安全相关的问题变得日益突出。在数据获取过程中保护用户隐私和数据安全是一项重大挑战。最后，随着\
  \ `AI` 技术的进步，可能需要更自动化、更智能的数据获取方法来满足大规模数据的需求。这需要集成 `AI` 技术以实现自动化的数据检索、清洗和整合。\n\n\
  总而言之，从经典论文中获取数据的方法在应用于人工智能、元宇宙和 `ML` 领域时面临着诸多挑战。因此，需要不断改进数据获取方法和技术，以满足对大规模、多样化和高质量数据的需求。这将有助于\
  \ `MADM` 领域的发展，并推动人工智能和 `ML` 的发展。\n\n## 情感分析的问题与展望\n\n未来，情感分析将面临一系列挑战，特别是随着人工智能、元宇宙和\
  \ `ML` 的持续发展。首先，情感分析需要不断增强对多样化语境和用户评价的理解。随着 `AI` 技术的进步，用户在不同环境中以日益多样化的方式表达情感，这对情感分析更准确地捕捉用户情感需求和评价提出了更高要求。其次，随着元宇宙的兴起，情感分析需要适应人们在虚拟环境中情感体验和表达。在元宇宙中，人们可能以不同的方式表达情感，例如通过虚拟角色和环境。情感分析需要理解并解释这些新的情感表达形式，以更好地支持用户在元宇宙中的交互和体验。此外，`ML`\
  \ 技术的发展为情感分析带来了挑战与机遇。随着深度学习和自然语言处理技术的进步，情感分析可以从海量数据中更好地学习和理解情感。然而，它也需要解决数据偏差和模型泛化等问题，以提高情感分析的准确性和鲁棒性。\n\
  \n结论是，面对人工智能、元宇宙和 `ML` 的挑战，情感分析需要不断改进算法和模型，以增强对多样化语境和用户评价的理解。它需要适应元宇宙中人们情感体验和表达，同时利用\
  \ `ML` 技术的优势更准确地捕捉用户情感需求和评价。这将为 `MADM` 提供更可靠的支持，从而驱动人工智能和元宇宙技术的发展，为人们创造更智能、更个性化的体验和服务。\n\
  \n## 遥感数据的问题与展望\n\n遥感数据在 `MADM` 中表现出某些局限性，包括复杂的数据处理和分析需要专业技术和设备；数据质量和准确性受多种因素影响，可能会产生误差；同时，遥感数据的使用可能个人隐私和安全问题，相关信息需要仔细处理和保护。因此，在使用遥感数据进行\
  \ `MADM` 时，必须仔细评估数据的可靠性和准确性，加强数据保护和隐私保护措施，以确保决策的科学性和。\n\n未来，随着人工智能和元宇宙技术的发展，遥感数据在\
  \ `MADM` 中的应用将变得更加智能化和全面。人工智能可以帮助处理和分析大量的遥感数据，提供更准确、更快速的信息提取和决策支持。元宇宙技术可以将遥感数据与虚拟现实、增强现实等技术相结合，实现对地球各种属性的全面仿真和可视化，为\
  \ `DMs` 提供更直观、沉浸式的决策支持。这将推动人类社会向更智能、更可持续的方向发展。\n\n## 开源数据集的问题与展望\n\n通过开源数据集获取数据可以支持\
  \ `MADM`，帮助 `DMs` 更全面、更准确地理解决策背景，提供科学依据，实现预测和规划，促进信息共享和创新。这为决策过程带来了更多的透明度、准确性和可信度。\n\
  \n然而，从开源数据集获取数据面临着诸多挑战。需要关注数据质量、隐私和安全问题，以及数据的适应性和特殊性。研究人员在选择和使用数据集时应进行全面评估，并结合其他方法和数据源来验证研究结果。在人工智能领域，训练算法和模型需要大量高质量数据，而数据质量的不确定性和不一致性可能导致模型不稳定和预测不准确\
  \ (`Antony & Salian, 2021`)。在元宇宙领域，虚拟环境的构建同样需要真实、准确的数据，以确保虚拟世界的真实性和原真性。\n\n其次，与数据相关的隐私和安全问题不容忽视。随着数据的不断收集和共享，个人隐私数据的保护变得尤为重要。在人工智能领域，必须确保敏感数据的合理使用和保护，防止数据泄露和滥用。在元宇宙领域，需要充分保护用户的个人信息和虚拟身份，防止虚拟环境中的隐私侵犯和安全漏洞。\n\
  \n此外，数据的多样性和互操作性也是挑战。不同来源和格式数据的有效整合和利用是一个复杂的问题。在人工智能领域，需要解决不同数据源之间的互操作性和一致性，以确保数据的有效利用和分析。在元宇宙领域，需要建立统一的标准和协议，实现不同虚拟环境之间的数据交换和互联，实现虚拟世界的互通。\n\
  \n因此，为了克服这些挑战，需要加强数据治理和管理，同时促进数据标准化和共享。此外，还需要加强技术研究创新，以应对不断出现的数据挑战，推动人工智能和元宇宙技术的发展。\n\
  \n\n\n\n未来，我们可以预计开放数据集将更加全面，涵盖更广泛的主题，并持续更新。这将使得决策者（DMs）能够获取实时且最新的信息以做出明智的决策 (Kirchner\
  \ et al., 2015)）。此外，人工智能和机器学习（ML）等技术的进步将通过自动化数据处理、提取有价值的洞察以及生成预测模型进一步增强对开放数据集的分析和利用。此外，随着不同利益相关者之间合作与伙伴关系的增加，开放数据集的质量控制流程将更加稳健。这将确保数据的可靠性和准确性，在用户之间建立进一步的信任。数据标准和操作性也将得到提高，允许不同来源的数据更容易集成和比较。\n\
  \n总的来说，从开放数据集获取数据的未来对于为决策者提供价值信息、驱动创新和提高透明度具有巨大潜力。随着技术的进步和合作的加强，开放数据集将继续演进，并在决策格局中发挥关键作用。\n\
  \n## 问卷调查的问题与期望\n\n在人工智能和元宇宙领域，从调查中获取数据面临着挑战。首先，调查数据通常是静态且碎片化的，无法完全反映用户在虚拟环境中的真实行为和情感。这需要结合其他数据源（如虚拟现实环境中的行为数据和社交媒体数据）进行全面分析，以更好地理解用户的行为和需求。其次，由于人工智能和元宇宙技术的快速发展，调查涉及的主题和领域不断扩展和深化。这要求调查设计者和数据分析师具有更广泛专业知识和技能，以更好地应对复杂多变的调查需求\
  \ (Fenton, et al., 2001)。最后，随着个人隐私保护意识的增强，调查数据还需要更严格的保护和合规管理，以确保用户数据的安全和隐私。因此，人工智能和元宇宙领域的数据获取调查需要持续创新以应对日益复杂的挑战。\n\
  \n为了解决这些问题，可以采取若干措施。首先，可以使用更先进的统计方法（如因子分析或回归分析）分析数据，以识别回答中的模式和关系。其次，改进问卷设计以确保问题清晰且无歧，可以增强受访者的理解并提高回答的准确性\
  \ (Ikart, 2019)。此外，采用在线调查等新技术可以促进更高效的数据收集，并更易地实施随机实验和其他高级调查设计。此外，随着数据隐私和安全意识的提高，加强保护数据隐私和安全的措施（包括应用加密技术和其他安全措施以防止敏感信息泄露）是未来的发展趋势。\n\
  \n结论，尽管从问卷中获取数据可能面临一些挑战，但方法和技术的持续改进可以确保问卷调查仍然是研究人员和从业者获取价值信息的重要工具。\n\n## 结论\n\n\
  多属性决策（MADM）中的数据收集方法是该领域的研究方向之一。本章系统地讨论了五种数据收集方法的发展过程，并详细介绍了它们在 MADM 中的应用，包括示例描述、数据处理和模型构建。我们提出了这些方法的挑战，例如如何确保数据质量以及如何提高数据处理效率，并讨论了未来研究的发展趋势。本章的研究结果为未来研究提供了基本框架和参考，也为决策者和从业者提供了宝贵的指导。在未来的研究中，我们需要进一步探索如何确保数据收集过程中数据的准确性和可靠性，以及如何结合不同的数据收集方法以实现更全面、准确的\
  \ MADM。\n\n## 参考文献\n\nAwajan, I., Mohamad, M., & Al-Quran, A. (2021). Sentiment\
