  \ 0 影响 `ADND` 的含义。\n\n\n\n\n\n在 `GOMADMMADD` 方法中，首先利用对象的优势集 (↑x) 和劣势邻域集 (↓x)，结合粗集近似的思想构建了群度量。这些包括局部优势邻域\
  \ (![Mathtype979-8-3693-1582-8.ch001.m104](img/ch001.m104.png)) 和局部劣势邻域 (![Mathtype979-8-3693-1582-8.ch001.m105](img/ch001.m105.png))，优势邻域\
  \ (![Mathtype979-8-3693-1582-8.ch001.m106](img/ch001.m106.png)) 和劣势邻域 (![Mathtype979-8-3693-1582-8.ch001.m107](img/ch001.m107.png))。\n\
  \n其次，借助局部优势和劣势邻域构建了局部优势劣势邻域度 (`LADD`)，并借助优势和劣势邻域构建了优势劣势邻域度 (`ADD`)。最后，通过 `LADD`\
  \ 和 `ADD` 的线性组合构建了主体群的混合优势劣势度 (`MADD`)。易见，`MADD` 的思想是从局部和全局视角对群进行衡量。其优点是可以使用更全面的信息，但缺点是设计的\
  \ `MADD` 缺乏某些有利于优化的性质。\n\n在本文的 `GMADMDRS` 方法中，首先将对象的优势集 (`D^↑(x)`) 和劣势集 (`D^↓(x)`)\
  \ 与粗集的近似思想相结合构建了群度量。包括优势下邻域算子 (![Mathtype979-8-3693-1582-8.ch001.m108](img/ch001.m108.png))\
  \ 和优势上邻域算子 (![Mathtype979-8-3693-1582-8.ch001.m109](img/ch001.m109.png))，劣势下邻域算子\
  \ (![Mathtype979-8-3693-1582-8.ch001.m110](img/ch001.m110.png)) 和劣势上邻域算子 (![Mathtype979-8-3693-1582-8.ch001.m111](img/ch001.m111.png))。\n\
  \n其次，分别从优势和劣势两个视角对群进行衡量，这很重要，因为它们具有相似的性质，然后将优势和劣势度量非线性结合得到优势劣势邻域度 (`ADND`)。可以看出\
  \ `ADND` 既考虑了优势和劣势，也考虑了局部和全局，这体现在下、上邻域中。总之，`ADND` 与 `MADD` 的本质区别在于考虑角度的不同和组合形式的不同，由此导致的性质变化是真实目的。这也是考虑将\
  \ `MADD` 改进为 `ADND` 的原因。利用 `ADND` 的性质可以优化方法并减少由指数级爆炸引起的问题，而 `MADD` 无法做到。\n\n为了更好地理解\
