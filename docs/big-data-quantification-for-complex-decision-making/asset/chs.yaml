  \ `Algorithm 3` 的有效性，根据表 13 中的破产（B）和非破产（NB）预测，我们分析 `Algorithm 3` 选择的对象的有效性。在所选的公司中，非破产的比例越高，`Algorithm\
  \ 3` 的效果越好。为了分析 `Algorithm 3` 的有效性，我们分别选择了两组数据：`{1,3,9,22,42,58,72}` 和 `{1,11,21,31,41,51,61,71}`。结果分别所示图\
