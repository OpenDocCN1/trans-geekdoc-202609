  \nVicente García Díaz（西班牙奥维埃多大学），Juan Manuel Cueva Lovelle（西班牙奥维埃多大学），B. Cristina\
  \ Pelayo García-Bustelo（西班牙奥维埃多大学）以及 Oscar Sanjuán Martínez（西班牙奥维埃多大学）\n\n\n*软件开发中的基于知识的过程*\n\
  \nSaqib Saeed（沙特阿拉伯达穆姆伊玛曼·法萨尔大学计算机科学与信息技术系）以及 Izzat Alsmadi（沙特阿拉伯苏尔丹大学）\n\n\n*面向业务的分布式计算创新*\n\
  \nAlfred Waising Loo（香港南岭大学），美国布法罗\n\n\n*数据密集型挑战与解决方案*\n\nDimosthenis Kyriazis（希腊国立技术大学），Theodora\
  \ Varigou（希腊国立技术大学）以及 Kleopatra Konstanteli（希腊国立技术大学）\n\n\n*分布式系统的原理与应用*\n\nAnnika\
  \ M. Hinze（新西兰怀卡托大学）以及 Alejandro Buchmann（新西兰怀卡托大学）\n\n\n*大规模分布式计算模型与趋势*\n\nValentin\
  \ Cristea（罗马尼亚布加勒斯特理工大学），Ciprian Dobre（罗马尼亚布加勒斯特理工大学），Corina Stratan（罗马尼亚布加勒斯特理工大学），Florin\
  \ Pop（罗马尼亚布加勒斯特理工大学）以及 Alexandru Costan（罗马尼亚布加勒斯特理工大学）\n\n\n复杂决策的数据量化\n\n在数据主宰的时代，决策者必须应对海量且复杂的信息，这已成为一项前所未有的挑战。《复杂决策的数据量化》为这一时代点亮了灯光，揭示了从大规模数据集中提取见解所需的方法、技术和框架。\n\
  \n本书的核心目标是阐明大数据与微妙决策过程之间的动态相互作用，特别是在不稳定的背景下。我们的范围涵盖了一系列目标，每个目标都对知识的进步做出了贡献。我们探讨了大数据在决策中的重要性、揭示了方法的细节、如何处理不确定性、将理论与现实应用相结合、为持续研究做出贡献、为从业者提供务实指导，并展望了未来的方向和启示。本质上，本书旨在为读者提供全面的工具箱，使其能够在数据丰富的决策环境中进行有效导航。\n\
  \n理论框架、实践应用和前瞻性视角的结合构成了我们方法的基础。通过无缝整合这些元素，我们的目标是加深对如何战略地利用大数据来应对充满不确定性的挑战并促进明智决策的理解。\n\
  \n编辑\n\n*   张朝（中国山西大学）\n*   李文涛（中国西南大学）\n\n\n\n\n\n我们的目标读者群体非常多元，这反映了大数据对各个领域决策的广泛影响。数据科学、决策科学、机器学习、人工智能及相关领域的研究人员和学者将发现本书是极具价值的参考，它为利用大数据过程中所固有的挑战、技术和前景提供了见解。从事数据分析、商业智能、风险管理和战略决策的从业者和专业人士可以从中获得在多变环境下制定明智决策的务实见解和方法论。最后，探索数据科学、决策分析及相关领域的研究生将从书中发现一种基础性资源，该资源为他们应对复杂的现实世界挑战提供了知识和工具。\n\
  \n本书的主题涵盖范围极广，包括了如大数据分析、不确定性建模、不确定性下的决策、模糊决策、形式概念分析、粗糙集理论、深度学习模型、神经网络模型、自然语言处理、三元决策、多粒度分析和智能控制系统等主题。每一章都贡献了独特的视角，丰富了人们对如何对大数据量化以进行复杂决策的整体理解。\n\
  \n作为编辑，我们对为这一事业贡献专业知识的作者们表示诚挚的谢意。我们相信，《复杂决策的大数据量化》将成为大数据与决策这一动态交叉领域中推动学术探究和实际应用的催化剂。\n\
  \n## 第一章：基于主从粗糙集的群体面向型多属性决策方法\n\n本章由中国的于斌（Bin Yu）、肖泽宇（Zeyu Xiao）和戴颖龙（Yinglong Dai）编写，介绍了基于混合优劣度的面向型多属性决策方法（`GOMADMMADD`）。`GOMADMMADD`\
  \ 方法通过提出“局部优度”和“优劣度”等概念，解决了面向型决策分析的挑战。作者进一步改进了该方法，引入了基于主从粗糙集的决策方法（`GMADMDRS`），利用“优势”和“劣势”邻域算子优化了\
  \ `GMADMDRS` 方法。该优化涉及定义“优劣邻度”（`ADND`），为增强效率的面向型多属性决策提供了解决方案。\n\n## 第二章：基于 PROMETHEE\
  \ 和三元决策的多粒度三角模糊法糖尿病患者血糖计选择\n\n本章由王丽音（Liyin Wang）、程宇婷（Yuting Cheng）、范世庆（Xueqing Fan）、王安（Anna\
  \ Wang）和赵汉（Hansen Zhao）编写，解决了糖尿病患者血糖计的选择问题。作者结合三角模糊（`TF`）逻辑、多粒度（`MG`）三元决策（`TWD`）和粗糙集理论开发了一个全面的评估模型。`TF`\
  \ 逻辑对建模并确定权重，而 `TWD` 处理不完全和不确定信息。引入 `PROMETHEE` 方法对备方案进行评估和排序，根据模型在解决血糖计选择问题上的有效性为糖尿病患者提供个性化建议。\n\
  \n## 第三章：基于特征优化的帕金森病程度预测\n\n本章由中国燕山大学张涛（Tao Zhang）、薛才（Zaifa Xue）和霍泽胜（Zesheng Huo）编写，重点关注利用语音特征预测帕金森病（`PD`）的严重程度。作者分别提出了\
  \ `LDFSF` 和 `GWT-RF-Att` 方法用于特征选择和变换。`LDFSF` 方法使用了基于 `SOM` 聚类的动态特征选择策略，而 `GWT-RF-Att`\
  \ 方法利用了图小波变换和带有注意力机制的随机森林。这些方法优于现有的对比方法，证明了它们在提高帕金森远程监控数据集预测性能方面的有效性。\n\n## 第四章：为南非政府部门构建增量提取-加载-转换管道执行质量控制的数据湖仓\n\
  \n本章由印度的 Dharmesh Dhabliya、Vivek Veeraiah、Sukhvinder Singh Dari、Jambi Ratna Raja\
  \ Kumar、Ritika Dhabliya、Sabyasachi Pramanik 和 Ankur Gupta 编写，重点是为南非一个政府部门创建一个数据湖仓系统。德班理工大学参与了该项目，强调了数据质量对于数据湖仓系统效率的重要性。该章探索了摄取层流水线的质量控制方法，评估了完备性、准确性、完整性、正确性和及时性等指标。通过在样本半结构化数据集上的实现，展示了该框架的效率，并对未来的开发和来自不同数据源的整合整合给出了建议。\n\
  \n## 第五章：基于划分序积空间的决策\n\n本章由中国安徽大学的徐毅（Yi Xu）编写，介绍了划分序积空间的概念，将多级粒度结构与多视图粒度结构相结合。提出了两种搜索算法——深度优先搜索和广度优先搜索，在该空间寻找解决方案。该章还探索了基于划分序积空间的三元决策，提出了四种多视图序列三元决策。该方法代表了通过粒度计算原理描述和解决问题的有效合理的方法。\n\
  \n## 第六章：基于强化学习的变化三元决策策略选择与结果评估\n\n中国福建理工大学的江春茂（Chunmao Jiang）在本章中增强了三元决策（`3WD`）的划分-动作-结果（`TAO`）模型。这种新方法引入了强化学习中的\
  \ `Q-learning` 用于策略选择和结果预测。划分和动作的变化被重新解释为状态和动作，并利用累计前景理论量化奖励。`Q-learning` 算法迭代地确定动作集以高效实现目标奖励，为预测基于变化的\
  \ `3WD` 中的效用提供了一种具有成本效益且符合心理特征的动作集。\n\n## 第七章：基于模糊数的 MAIRCA 扩展：智能供应商选择\n\n本章由土耳其\
  \ Necmettin Erbakan 大学的 Hatice Özensel 和 Burak Efe 编写，解决了供应链管理中的供应商选择阶段。他们提出了一种基于区间值四丛正对模糊（`IVqROF`）数的\
  \ `MAIRCA` 方法来对备选供应商进行排序。这种 `MAIRCA` 方法的扩展使用了模糊数但引入了 `IVqROF` 数，增强了对专家意见的评估。研究考察了工业\
  \ 4 标准的智能供应商选择，为一家汽车子行业面临的供应商选择问题提供了见解。\n\n\n赵新（Xinyue Zhao）和宋云（Yunsheng Song）对农业文本挖掘进行了综述。该章分析了农业文本的特征，涵盖了中国农业文本预处理、文本表示、农业文本分类和文本匹配。此外，作者探讨了农业文本挖掘的应用场景、农业智能服务以及该领域的研究现状。\n\
  \n## 第九章：多属性决策研究中数据获取形式快照调查\n\n\n\n\n\n本章由牛雨格、刘可欣、陆方辉和张嘉怡编写，探讨了多属性决策分析（MADM）分析中大规模数据收集的需求。作者提供了一项快照调查，总结了\
  \ MADM 研究中的经典论文、开放数据集、遥感数据、情感分析以及问卷调查数据收集形式。通过评估经典论文、开放数据集和各种数据收集方法，本章旨在帮助研究人员和专业人士选择并设计有效的数据收集方法，以确保决策的可靠性和影响力。\n\
  \n## 第 10 章：基于决策蕴涵的知识表示与推理研究\n\n来自中国山西财经大学的张晓霞探讨了基于决策蕴涵（decision implication）的知识表示与推理。引入了决策蕴涵标准基（`DICB`），提供了一组具有信息完整性且极其简单的决策蕴涵。本章对知识表示的能力进行了系统且深入的研究，重点关注决策蕴涵对不完全形式背景的适应性。研究还扩展到基于决策蕴涵的推理，为该方法在形式背景下的有效性提供了见解。\n\
  \n在《复杂决策的大数据量化》一书的结束部分，我们反思了对大数据与复杂决策过程共生关系的广泛探索。随着信息格局的不断演变，决策者应对复杂数据的迫性已变得至关重要。这本书被构想为数据支配时代的一盏明灯，展现了一系列从海量数据集中提取深刻见解至关重要的方法、技术和框架。\n\
  \n我们共同努力的本质在于意识到，处理大数据不仅是技术的演变，更是决策本身结构的根本性转变。这本书的核心诉求是阐明大数据与细致决策之间的动态相互作用，特别是在面对不确定性时。每一章都经过精心设计，以协同贡献，推动这一变革性领域的研究和知识进步。\n\
  \n从解码大数据在决策中的意义到理清方法论的复杂性，从熟练处理不确定性到架起理论基础与现实应用之间的桥梁，此本书旨在赋能读者。书中提供的全面工具箱使各个领域的人员具备了在数据丰富的的格局中航行并做出明智决策的技能。\n\
  \n我们独特的方法融合了理论框架、实践应用和前瞻性视角，旨在深化对战略性地利用大数据应对多方面挑战的理解。这本书证明了这样一种信念：理解大数据与决策之间的相互作用对于在无处不在的不确定性中开启信息选择的新时代至关重要。\n\
  \n目标读者群体从资深研究人员到从业者以及有志的研究生，这反映了本书对不同领域决策的广泛影响。作为编辑，我们对向这本集体著作注入专业知识的贡献者表示感谢。我们认为《复杂决策的大数据量化》不仅是知识的汇编，更是大数据与决策交叉的动态领域未来探索与创新的催化剂。\n\
  \n最后，我们邀请读者以书中提供的见解和工具为武器，开启属于自己的智力之旅，在大数据的未知海域中航行，并继续塑造决策的未来格局。\n\n## 第 1 章\n\n\
  *   **余斌**：中国湖南师范大学信息工程学院\n*   **萧泽宇**：中国湖南师范大学信息工程学院\n*   **戴英龙**：中国湖南师范大学信息工程学院\n\
  \n### 摘要\n\n本章提出了一种基于混合优劣度方法（`GOMADMMADD`）的面向群体的多属性决策方法，用于处理面向群体的决策分析。基于群体成员之间严格的属性关系，该方法提出了“局部优劣度”和“优劣度”的概念，解决了面向群体的多属性决策（`GOMADM`）的挑战。然而，该方法仍存在待评估群体数量呈指数级增长的问题。因此，作者首先改进了\
  \ `GOMADMMADD` 方法，并提出了基于主关系的粗集决策方法（`GMADMDRS`）。然后，引入了群体的“优”邻域算子和“劣”邻域算子来定义“优劣邻域度”（`ADND`），并利用\
  \ ADND 优化了 `GMADMDRS` 方法。实验结果显示，`GOMADMMADD` 方法和 `GMADMDRS` 方法都能有效评估群体，优化后的 `GMADMDRS`\
  \ 算法在实验结果一致，时间性能极大提升，计算性能显著提高，这对于解决待评估群体数量指数级增长的问题具有实际意义。这些方法为面向群体的多属性决策提供了一种新视角和有效方法。\n\
  \n**关键词**：基于主关系的粗集、`GOMADM`、`GOMADMMADD`、`GMADMDRS`、`GMADMDRS` 的优化\n\n## 引言\n\n\
  #### 问题背景\n\n群体评价和排名一直是一项需求。在团队排名中，需要对团队整体进行评估；在金融投资中，组合投资是规避风险的一种良好方式，组合投资需要评估组合整体金融产品；当特征选择揭示决策变量与描述变量之间的相关性时，考虑决策变量之间的相互作用以及对组合决策变量的整体评价具有深远意义。对整体进行评价和排名广泛应用于团队排名、组合投资、特征选择、群体识别等领域。\n\
  \n#### DRSA 简要回顾\n\n\n\n\n\n在现实生活场景中，决策者经常会遇到涉及不精确或模糊信息的问题。为了解决这类多属性决策分析（`MADM`）问题，Pawlak\
  \ 引入了粗糙集（Pawlak, 1982），后来由于其等效关系的局限性，各学者学者此对其进行了扩展。\n\n在处理双层犹豫模糊语言元素（`DHHFLTS`）时，Yu\
  \ 等提出了一种 `\\lambda-Rough set` 模型，并将其应用于多属性决策（Yu et al., 2019a; Yu et al., 2019b）。Gireesha\
  \ 等通过提出基于改进的区间直觉模糊集加权聚合和乘积评估的方法，解决了云服务提供者评估中的不确定性（Gireesha et al., 2020）。在骨移植选择背景下，Zhang\
  \ 等利用变变精度直觉模糊粗糙集（`CVPIFRS`）模型获取标准权重，并提出了一种结合 `CVPIFRS` 与 `TOPSIS` 的新 `MADM` 方法（Zhang\
  \ et al., 2020b）。Gou 等引入了一种扩展的概率双层语言 `VIKOR` 方法，用于智能医疗中的 `MCDM`（Gou et al., 2021）。Dogan\
  \ 提出了一种基于球形模糊 `AHP` 的模糊 `MCDM` 方法，用于技术小组筛选（Dogan, 2021）。Zhang 等解决了基于代数的 `DHHFLTS`\
  \ 在距离和相似性上的局限性，并提出了一种使用余弦相似度的 `DHHFL-ELECTRE II` 方法用于金融物流企业的 `MADM`（Zhang et al.,\
  \ 2022）。Kang 等基于一种新型模糊粗糙集理论，在模糊信息系统中阐述了一种多属性预测分析模型（Kang et al., 2022）。\n\nGreco\
  \ 等引入了粗糙集的扩展，即基于优势的粗糙集方法（`DRSA`），其中条件属性是根据偏好排序的准则（Greco et al., 1999; Greco et al.,\
  \ 2001）。在骨移植选择背景下，Zhang 等利用变变精度直觉模糊粗糙集（`CVPIFRS`）模型获取标准权重，并提出了一种结合 `CVPIFRS` 与 `TOPSIS`\
  \ 的新 `MADM` 方法（Zhang et al., 2020b）。Gou 等引入了一种扩展的概率双层语言 `VIKOR` 方法，用于智能医疗中的 `MCDM`（Gou\
  \ et al., 2021）。Dogan 提出了一种基于球形模糊 `AHP` 的模糊 `MCDM` 方法，用于技术小组筛选（Dogan, 2021）。Zhang\
  \ 等解决了基于代数的 `DHHFLTS` 在距离和相似性上的局限性，并提出了一种使用余弦相似度的 `DHHFL-ELECTRE II` 方法用于金融物流企业的\
  \ `MADM`（Zhang et al., 2022）。Kang 等基于一种新型模糊粗糙集理论，在模糊信息系统中阐述了一种多属性预测分析模型（Kang et\
  \ al., 2022）。\n\nGreco 等引入了粗糙集的扩展，即基于优势的粗糙集方法（`DRSA`），其中条件属性是根据偏好排序的准则（Greco et\
  \ al., 1999; Greco et al., 2001）。Gireesha 等通过提出基于改进的区间直觉模糊集加权聚合和乘积评估的方法，解决了云服务提供者评估中的不确定性（Gireesha\
  \ et al., 2020）。在骨移植选择背景下，Zhang 等利用变变精度直觉模糊粗糙集（`CVPIFRS`）模型获取标准权重，并提出了一种结合 `CVPIFRS`\
  \ 与 `TOPSIS` 的新 `MADM` 方法（Zhang et al., 2020b）。Gou 等引入了一种扩展的概率双层语言 `VIKOR` 方法，用于智能医疗中的\
  \ `MCDM`（Gou et al., 2021）。Dogan 提出了一种基于球形模糊 `AHP` 的模糊 `MCDM` 方法，用于技术小组筛选（Dogan,\
  \ 2021）。Zhang 等解决了基于代数的 `DHHFLTS` 在距离和相似性上的局限性，并提出了一种使用余弦相似度的 `DHHFL-ELECTRE II`\
  \ 方法用于金融物流企业的 `MADM`（Zhang et al., 2022）。Kang 等基于一种新型模糊粗糙集理论，在模糊信息系统中阐述了一种多属性预测分析模型（Kang\
  \ et al., 2022）。\n\nGreco 等引入了粗糙集的扩展，即基于优势的粗糙集方法（`DRSA`），其中条件属性是根据偏好排序的准则（Greco\
  \ et al., 1999; Greco et al., 2001）。后来，他们通过将 `DRSA` 引入直觉模糊集，建立了一种优势模型（Greco et al.,\
  \ 2006）。在犹豫语言背景下，Zhang 等通过变变精度直觉模糊粗糙集建立了一种具有吸引力的 `DRSA`（Zhang et al., 2018）。在犹豫语言语境下，他们通过结合变精度粗糙集理论提出了一种多属性预测模型（Zhang\
  \ et al., 2020）。Ahmad 等通过 `DRSA` 解决了犹豫语言中计算上、下近似的问题（Ahmad et al., 2020）。Huang 等通过考虑分类、区间值属性，将\
  \ `DRSA` 应用于模糊决策系统（Huang et al., 2020）。Palangć 等通过考虑加权平均（`OWA`）增强了 `DRSA` 的属性（Palangć\
  \ et al., 2021）。Błaszński 等使用基于优势的粗糙集集成（`BRE`）为金融欺诈预测测试了一种新数据集（Błaszński et al.,\
  \ 2021）。Kusunoki 等通过使用变精度粗糙集（`VP-DRSA`）和变一致性粗糙集（`VC-DRSA`）解决了分类数据下的过严近似问题（Kusunoki\
  \ et al., 2021）。\n\n\n\n\n群体评估通常涉及使用多属性决策方法对个体进行排名，然后根据个体性能推导出整体性能。目前已经提出了多种方法来解决传统多属性决策方法（MADM）在群体评估和排名问题中的局限性。这些方法包括：Hussain\
  \ 等人提出的 MADM 集成方法（Hussain et al., 2020）、平均公式排名聚合，以及 Tidke 等人提出的加权平均共识排名聚合方法（Tidke\
  \ et al., 2020）、Yu 等人提出的用于缓解属性权重影响的新 MADM 方法（Yu et al., 2022b），以及 Yu 等人提出的一种以群体为导向的多属性决策方法（Yu\
  \ et al., 2022a），该方法在（Yu et al., 2023b）中得到了进一步优化。\n\n## 本章的动机与贡献\n\n在本章中，设计了一种基于优势粗集的群体优势多属性方法来解决问题。具体而言，本章的主要研究动机如下：\n\
  \n1. 随着数据分析细节水平的提高，与传统的多属性方法相比，`GOMADM` 方法正成为趋势。\n2. 粗集理论是比较群体优劣的有效工具。因此，有必要设计一种基于粗集理论的群体优势多属性决策方法。\n\
  3. 在设计 `GOMADMMADD` 方法后，该方法存在待评估群体数量呈指数级增长且不易优化的问题，因此对 `GOMADMMADD` 方法进行了改进。\n\n\
  针对上述研究动机，我们进一步总结了本章的显著贡献：\n\n1. 基于优势粗集理论，设计了 `GOMADM MADD` 方法以应对决策分析的挑战，并扩展了优势粗集的应用前景。\n\
  2. 为了解决 `GOMADMMADD` 方法无法优化指数爆炸问题的问题，将 `GOMADMMADD` 方法改进为 `GMADMDRS` 方法。实验结果表明 `GMADMDRS`\
  \ 方法是合理的，为解决指数爆炸问题奠定了坚实基础。\n3. 为了优化 `GMADMDRS` 方法，本文设计了适用于基于优势粗集的 `GMADMDRS` 方法的优劣势域度（`ADND`），并充分研究了该测量的性质，扩展了优势粗集模型的适用性。\n\
  4. 为了解决候选群体数量指数级增长的问题，利用 `ADND` 的特性对 `GMADMDRS` 方法进行了优化。在确保 `GMADMDRS` 方法优化前后结果一致的同时，优化后的\
  \ `GMADMDRS` 方法的时间性能较于优化前方法得到了极大提升。\n\n基于上述文献分析，我们安排了本章结构如下：在第 2 节中，我们回顾了信息系统，并根据粗集的优势提出了优势（劣势）邻域和（局部）优势劣势度。在下一节中，为了进一步优化，我们提出了优势（劣势）邻域运算符和优势劣势域。在第\
  \ 4 节中，我们基于优势（劣势）邻域和（局部）优势劣势度设计了 `GOMADMMADD` 方法，进一步改进了 `GMADMDRS` 方法，并基于优势（劣势）邻域运算符和优势劣势对该方法进行了进一步优化。在第\
  \ 5 节中，利用从真实数据提取的 UCI 数据集进行了案例研究。最后，总结了一些结论并提出了未来的研究问题。\n\n## 基础知识\n\n### 信息系统\n\
