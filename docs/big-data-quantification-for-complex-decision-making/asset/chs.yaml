  \n`k=1,2,…n`。\n\n令 `Cχ` 表示 `k` 步转移后改变的三分区域 `R^χ` 的估计概率 ![Mathtype979-8-3693-1582-8.ch006.m31](img/ch006.m31.png)\
  \ 与实际值 ![Mathtype979-8-3693-1582-8.ch006.m32](img/ch006.m32.png) 之间的误差：\n\n![Mathtype979-8-3693-1582-8.ch006.m33](img/ch006.m33.png)\n\
  \n其中 `j={+,0,-}`，`χ={+,0,-}`，且 `+ ≻ 0 ≻ –`。\n\n那么对于 `n` 个循环，区域 `R^χ` 中的误差平方和 `E[χ]`\
  \ 由下给出：\n\n![Mathtype979-8-3693-1582-8.ch006.m34](img/ch006.m34.png)\n\n在每个循环中，变化的三分区域内物体转移过程中的误差平方和\
  \ `D` 如下：\n\n![Mathtype979-8-3693-1582-8.ch006.m35](img/ch006.m35.png)\n\n我们将约束引入模型，建立一个优化模型，利用最小二乘法求解马尔可夫状态概率矩阵。该模型的目标函数是最小化每个阶段每个状态误差平方和\
  \ `D`。模型的约束是行和条件和非负条件。具体公式如下：\n\n![Mathtype979-8-3693-1582-8.ch006.m36](img/ch006.m36.png)\n\
  \n求解二次规划有多种方法，如 `Lemke`、`active set` 和线性变换方法。这里将模型转换为线性规划模型进行求解，以简化求解复杂度。\n\n##\
  \ 策略选择\n\n对于每个循环中的每个三分状态，存在多种可以应用的策略，这些策略被视为马尔可夫决策过程中的动作集。目标是选择一个从初始状态到终止状态状态累积奖励最大的策略。为了实现这一目标，我们采用了\
  \ `Q-learning 算法`，它不断探索并学习更新 `Q table`。该表记录了每个状态-动作对的值函数。\n\n在策略选择过程中，最初构建 `Q table`，列标签为三分状态\
