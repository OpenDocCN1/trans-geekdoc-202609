  | 22: ||     `l=q.pop()`//获取队列头节点 |\n| 23: || for ![Mathtype979-8-3693-1582-8.ch005.m65](img/ch005.m65.png)`k`\
  \ do |\n| 24: ||               if `adj[l][i]=True and visited[i]=False` then |\n\
  | 25: ||                 `L=L∪problem solving level i` |\n| 26: ||             \
  \    `visited[i]=True` //遍历 `l` 的未访问的相邻顶点 |\n| 27: ||                 `q.push(i)`\
  \ |\n| 28: || end if |\n| 29: || end for |\n| 30: || end while |\n| 31: || end if\
  \ |\n| 32: || end for |\n| 33: || return `L` |\n\n在算法 1 和算法 2 中，根据深度优先搜索策略和广度优先搜索策略，我们可以得到一个求解层级序列。基于求解层级序列，我们可以从粗粒度到细粒度解决问题。\
  \ |\n\n算法 1 中，步骤 3-5 将`k`个求解层级的访问矩阵初始化为`False`。步骤 6-14 初始化`k`个求解层级的邻接矩阵。如果求解层级`i`和求解层级`j`\
  \ 相邻，则`adj[k][k]`为`True`；否则为`False`。步骤 15-19 使用深度优先搜索策略，从当前求解层级`l`开始遍历划分序积空间中的求解层级。步骤\
  \ 21-32 是使用递归方法的深度优先遍历函数。在该函数中，首先访问未访问的求解层级`l`并将其添加到遍历序列`L`中，然后递归访问`l`未访问的相邻顶点。注意步骤\
  \ 24-26 表示，如果`l`是最细的求解层级，则算法结束。通常，深度优先遍历方法会遍历划分序积空间中的所有求解层级。但在算法 1 中，当访问最细的求解层级时，不需要遍历其他更粗的层级。\
  \ |\n\n### 基于划分序积空间的三元决策\n\n三元决策产生决策理论粗集（DTRS），该粗集根据最小期望总体决策风险（Yao, 2010）将空间划分为两个阈值的三个两不交区域。从粒度计算的角度来看，三元决策主要有四类：经典三元决策、顺序三元决策、多粒度三元决策和多粒度顺序三元决策。\n\
  \n\n\n\n为了清晰地阐明这四个模型之间的关系和区别，我们从两个方面进行分析：第一个方面是它们的问题描述空间，第二个方面是它们的问题求解空间。\n\n###\
  \ 1. 经典三路决策\n由于经典三路决策使用一组属性来描述对象且没有多层级，因此经典三路决策的问题描述空间只有一个视图，且该视图只有一个层次。因此，基于单视图和单层次的问题描述空间，经典三路决策的问题求解空间只有一个解（`Yao,\
  \ 2011`; `Yao, 2010`）。经典三路决策的问题描述空间和问题求解空间如图`图 4 (a)`所示。\n\n### 2. 顺序三路决策\n由于顺序三路决策使用一组属性来描述对象并基于属性集构建了多个层级，其问题描述空间具有具有多层次的单视图。因此，基于单视图和多层次的问题描述空间，顺序三路决策的问题空间有多个解，并形成从粗粒度到细粒度的决策过程，构成一个顺序过程（`Yao,\
  \ 2013`; `Yang, Li, Liu, Chen, & Luo, 2017`; `Yang, Li, Fujita, Liu, & Yao, 2017`）。顺序三路决策的问题描述空间和问题求解空间如图`图\
  \ 4 (b)`所示。\n\n### 3. 多粒度三路决策\n多粒度三路决策使用多组属性来描述对象，且每个属性集中没有多层级，因此其问题描述空间具有多个视图，但每个视图仅包含一个层次。因此，基于多视图和单层次的问题描述空间，多粒度三路决策通过融合多个视图的决策结果来进行决策，其问题求解空间有一个解（`Qian,\
  \ Zhang, Sang, & Liang, 2014`; Qian, Liang, & Lin, 2017; `Sang, Liang, & Qian, 2015`;\
  \ Zhou & `Yao, 2010`）。多粒度三路决策的问题描述空间和问题求解空间如图`图 4 (c)`所示。\n\n### 4. 多粒度顺序三路决策\n\
  多粒度顺序三路决策使用多组属性来描述对象，且每个属性集中同样没有多层级，因此其问题描述空间具有多个视图，且每个视图仅有一个层次。多粒度顺序三路决策的问题描述空间与多粒度三路决策相同。然而，它们的问题空间是不同的。\n\
  \n注意，多粒度顺序三路决策使用一系列阈值序列来实现顺序过程，而不是基于属性集构建多个层级。因此，多粒度顺序三路决策的问题空间有多个解，并通过阈值序列从粗粒度到细粒度地进行决策；每个解都是多个视图决策结果的融合（`Qian,\
  \ Liu, & Yue, 2019`; Qian, Liu, & Miao, 2020）。多粒度顺序三路决策的问题描述空间和问题求解空间如图`图 4 (d)`所示。\n\
  \n| 图 4. 不同三路决策的描述空间和求解空间 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch005.f04](img/ch005.f04.png)\
  \ |\n| --- |\n\n### 总结分析\n通过上述分析，经典三路决策、顺序三路决策和多粒度三路决策都没有结合多视图和多层级。虽然多粒度顺序三路决策考虑了多视图和多层级，但它们仅使用多视图来描述对象，每个视图仍然只有一个层次，也就是说，每个视图中的粒度是固定的，不会随着决策过程的顺序而从粗粒度变为细粒度发生改变。\n\
  \n因此，我们基于划分顺序讨论三路决策。\n\n\n\n\n假设 $L=\\{l¹,l²,\\dots,l^t\\}$ 是基于深度优先或广度优先搜索算法的问题求解层遍历序列，![Mathtype979-8-3693-1582-8.ch005.m70](img/ch005.m70.png)\
  \ 是 $k$ 个问题求解层，![Mathtype979-8-3693-1582-8.ch005.m71](img/ch005.m71.png)，而 ![Mathtype979-8-3693-1582-8.ch005.m72](img/ch005.m72.png)\
  \ 是 $x\\in U$ 关于 ![Mathtype979-8-3693-1582-8.ch005.m73](img/ch005.m73.png) 的等价类。在接下来的节中，我们引入四种多视图顺序三路决策。\n\
