  \ |\n\n在总差距矩阵中，按照 `Eq. (9)` 相加每个方案的准则评分，计算出方案的权重程度。在获得的值中，值最小的方案被接受为最佳方案。Table 17\
  \ 显示了方案的排名。在基于 MAIRCA 的 IVqROF 数字排名中，发现业务最合适的智能供应商方案是 A2。`A2` 方案之后分别是 `A1-A4-A3`\
  \ 和 `A5` 方案。对 `q` 值变化产生的影响进行了敏感性分析，结果如下。\n\n\n\n\n\n由于全球化的日益增强，供应链管理在现实业务和文献中已变得非常重要。企业旨在与最理想的供应商建立战略合作，以通过构建高效的供应链来增强自身的竞争力。选择合适的供应商将显著降低总成本，因为供应商选择决策对企业的盈利能力影响巨大，并直接影响企业的交货时间。然而，这一过程复杂且困难，因为供应商选择可能涉及多个冲突且不明确的标准。\n\
  \n## 决策与多准则决策分析 (MCDM)\n从简单形式来说，决策问题可以被认为根据目标或标准在选项之间做出选择。决策者对他们将做出的决策需要准确且可靠的预测。在这一过程中考虑科学标准可以使他们做出更好的决策。传统的\
  \ `MCDM` 技术通常不足以评估这些不明确且矛盾的标准。\n\n## MAIRCA 方法\n本研究提出了一种基于 `interval valued q-ROF\
  \ numbers` 的 `MAIRCA` 方法，该方法尚未出现在文献中，用于评估冲突和不确定的标准。这一新方案被应用于一家汽车供应商公司的智能供应商选择问题中。\n\
  \n在确定智能供应商选择的标准时，通过详细的文献研究，在传统标准的基础上增加了智能标准。在研究中，使用 `interval valued q-ROF numbers`\
  \ 来反映专家对问题陈述中的不确定性。为了研究构成方案智能供应商选择概念的各项权重，通过 `IVqROF numbers based MAIRCA` 将专家的语言表达定义转换为模糊数值表达式。\n\
