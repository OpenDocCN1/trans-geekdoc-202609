  \ 16 中。\n\n#### 表 16：集合 `i/ch010.m697.png`\n| `∅ → {a[1]}` | `{a[3]} → {a[1],a[2],a[4]}`\
  \ |\n| --- | --- |\n| `{a[2]} → {a[1]}` | `{a[5]} → {a[1],a[3],a[4]}` |\n| `{a[4]}\
  \ → {a[1],a[3]}` | `{a[1],a[4]} → {a[3],a[5]}` |\n\n考虑 `{a[3],a[4]}→{a[2]}`，它是其中的一个可接受蕴含。它可以通过首先对\
  \ `{a[3]}→{a[1],a[2],a[4]}` 应用扩张性的组合来推导出。\n\n 结论与未来工作\n\n本章对决策蕴含、概念规则和粒度规则，以及不完全形式语境下基于决策蕴含的知识再表示与推理进行了对比研究，包括以下贡献：\n\
  \n* (1) 证明了概念规则和粒度规则对于决策蕴含均不是完备的，且粒度规则对于概念规则也是不完备的。这意味着当仅使用概念规则或粒度规则研究决策蕴含时，或者当仅使用粒度规则研究概念规则时，存在信息丢失。在决策蕴含逻辑的帮助下，\n\
  * (2) 我们发现，虽然必要蕴含和可接受蕴含都可以在形式语境中表示，但最初应用于可接受蕴含的推理规则在应用时产生无效结果。为了解决这个问题，我们引入了专门构建的决策语境，连接了形式语境的最小和极大完成。\n\
  * (3) 我们将最初为决策蕴含设计的推理规则（如扩张性和组合）扩展到必要蕴和可接受蕴含。此外，我们引入了自反性推理规则以增强冗余能力。基于扩张和组合，定义了必要/可接受蕴含集合的完备性和非冗余性。我们构建了必要蕴含基和可接受蕴含基，它们分别作为了必要/可接受蕴含中包含的所有信息的紧凑表示。\n\
  \n未来工作将集中在以下方面：\n\n* (1) 概念规则和粒度规则的潜在价值探索。在这些应用中判断概念规则或粒度规则对于决策蕴含是否完备也是一个有意义的课题。事实上，研究并进行一些实验以验证概念规则或粒度规则中的信息丢失在某些应用中是否存在或重要也是值得的，并寻找决策信息的近似和最优表示类型。\n\
  * (2) 概念规则和粒度规则的推理系统构建。这指的是概念规则逻辑的研究，包括语义和句法方面。语义方面定义了概念规则的正确性和概念规则基。句法方面考虑概念规则的推理规则，这些规则相对于语义方面是正确的、完备且非冗余的。\n\
  * (3) 逻辑视角下的不确定知识描述。语义研究蕴含的正确性、完备性和冗余性，以及规范基的构建。句法关注具有语义一致性的推理规则，并以本章中应用的推理规则为启发。\n\
