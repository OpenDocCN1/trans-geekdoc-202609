- "# 复杂决策的大数据量化\n\n\n\n* 张超，中国山西大学\n* 李文涛，中国西南大学\n\n\n![tpg_2327-3453.png](img/tpg_2327-3453.png)![Engineering_Science_Reference.png](img/Engineering_Science_Reference.png)\n\
  \n\n\n\n\n\n\n张超，李文涛\n\n\n\n\n\n\n\n\nVijayan Sugumaran（美国奥克兰兰大学，罗彻斯特） ISSN: 2327-3453\n\
  \n## 使命\n\n计算应用和分布式系统的理论与实践已成为驱动商业、工程和科学创新的关键领域之一。软件工程、系统分析和高性能计算领域为解决任何现代组织中的计算问题提供了广泛的应用和解决方案。\n\
  \n《系统分析、软件工程与高性能计算进展》(ASASEHPC) 丛书汇集了分布式计算、系统与软件工程、高性能计算以及服务科学领域的研究。这系列出版物对于寻求该领域最新实践和知识的学者、研究人员和从业者非常有用。\n\
  \n## 涵盖范围\n\n* 企业信息系统\n* 软件工程\n* 工程环境\n* 存储系统\n* 性能建模\n* 分布式云计算\n* 计算机图形\n* 计算机系统分析\n\
  * 人机交互\n* 元数据与语义网\n\nIGI Global 目前正在接受该系列出版的手稿。如需提交书卷提案，请联系我们的收购部门 `Acquisitions@igi-global.com`\
