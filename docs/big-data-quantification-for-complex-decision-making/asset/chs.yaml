  \n广度优先悲观多视图顺序三决策是广度优先搜索算法与悲观融合策略的结合。广度优先搜索算法获取问题求解层次序列以构建顺序决策过程。悲观融合策略在问题求解层融合多个单层视图做出三决策。在问题求解层，根据悲观融合策略，在正区域内，我们使用“与”操作来融合多个视图，从而从多视图做出三决策。基于问题求解层次序列，从高求解层到低求解层，我们从多层次做出三决策。因此，广度优先悲观多视图顺序三决策不仅可以从多个不同的视图做出决策，还可以从多个抽象层次做出决策。详细过程见算法\
