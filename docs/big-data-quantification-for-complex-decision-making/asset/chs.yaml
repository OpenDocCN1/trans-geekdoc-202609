  \ SCIE、Scopus、ESCI、ACM、DBLP 等索引）。他正从事云计算、数据安全和机器学习领域的研究。他在硕士期间的研究工作是基于云计算中的生物识别安全。`f5185489-45d5-4932-bb39-e01fe069`\n\
