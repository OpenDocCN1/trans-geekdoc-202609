  \ et al., 2020)。\n\n## 表 2. 数据湖与数据仓库的区别\n\n| 参数 | 数据仓库 | 数据湖 |\n| --- | --- | ---\
  \ |\n| 信息内容 | 数据仓库仅关注业务流程。 | 数据湖保留所有的处理信息 |\n| 处理 | 经过广泛处理的数据 | 大多数数据未经过处理 |\n|\
  \ 数据类型 | 主要为表格和结构化形式 | 它们可能被分类为半结构化、结构化或非结构化 |\n| 工作 | 针对数据检索进行了优化 | 分布式数据管理 |\n\
  | 灵活性 | 与数据湖相比，这种安排是固定的，灵活性较低。 | 非常灵活，能够根据需要进行调整和重新定位 |\n| 用户 | 广泛用于业务分析师和专家 | 数据科学家、数据开发人员和业务分析师利用数据湖。\
  \ |\n| 存储 | 使用反应快速的高成本存储 | 数据湖设计用于廉价存储。 |\n| 安全性 | 高成本存储 | 低成本存储 |\n\n## 数据收集\n\n\
  提供的数据集是一个 `CSV` 文件，包含来自 `datablist.com` 的人员信息。该集合包含 100 条条目的 `User ID`、`First Name`、`Last\
  \ Name`、`Date of Birth` 和 `Job Title`。为了实验目的，仅对前 80 条记录进行摄取。接下来的 20 条记录分配用于第一阶段后的测试数据导入。数据条目由分号分隔，在将\
  \ `CSV` 文件转换为 `SQL` 数据库表时，这些分隔符将被消除。至关重要的一点是，`CSV` 的第一表示列标题。\n\n## 数据流流程\n\n图 4\
  \ 展示了从源（即 `SharePoint`）的数据流。正在传输的数据集表示为 `CSV` 文件，包含半结构化数据。箭头符号表示将用于传输数据的管道。重要的是，`Azure\
  \ Data Factory` 将用于此过程。数据将从源传输到 `DL`，然后在名为“Raw”的容器中复制。该容器内包含的数据将保持其原始、未更改的状态，禁止进行任何修改。数据时间戳（Data\
  \ timestamp）用于监控新实例，指示数据的当前状态。随后，存储在 `Raw` 容器中的数据将被复制并转换成 `Azure SQL database` 内部的表，以便实施数据编排。将包含另外两列，即\
  \ `hashing` 和 `date timestamp`。`Hashing` 生成一个独特的哈希值，用作记录的唯一标识符，从而防止记录重复。日期时间戳将记录数据添加或更改的精确时刻。随后，组织后的信息将存放在数据湖中名为“Curated”的容器内。然而，本研究将专门检查针对清洗后数据（curate\
  \ data）的数据编排功能。数据编排将防止之前添加的记录重复。这将减少由 `hashing` 引起的数据重复。如果现有记录的数据有任何修改，将进行更新。此外，为了实现数据的逐步摄入，将部署触发机制以在特定间隔自动执行管道。\n\
