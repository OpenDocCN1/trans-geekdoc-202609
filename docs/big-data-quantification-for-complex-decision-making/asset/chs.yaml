  \n## 搜索方法\n\n给定由 `m` 个视图 `v[i]` 的划分序积空间 `POPS[m]\\= (×P[i],≼[P])`，其中每个视图有 `n[i]`\
  \ 层。根据定义 3，`POPS[m]` 具有 ![Mathtype979-8-3693-1582-8.ch005.m51](img/ch005.m51.png)求解层级。当我们解决问题时，如何在划分序空间中搜索以找到合适的求解层级是一个关键问题。\n\
  \n由于划分序空间的拓扑结构是一个格，通常有两种搜索策略。第一种搜索策略是深度搜索策略，第二种搜索策略是广度搜索策略。在下部分，我们给出划分序空间中的两种搜索算法，称为深度搜索算法和广度搜索算法，如算法\
  \ 1 和算法 2 所示。\n\n### 算法 1：深度搜索算法\n\n输入：具有 `k` 个求解层级的划分序积空间 `POPS[m]\\= (×P[i],≼[P])`。\n\
  输出：求解层级的遍历序列 `L`。\n\n```\n![Mathtype979-8-3693-1582-8.ch005.m52](img/ch005.m52.png)\n\
  假设 visited k 是 k 个求解层级的访问矩阵，adj 是邻接矩阵\n// 初始化访问矩阵\nfor ![Mathtype979-8-3693-1582-8.ch005.m53](img/ch005.m53.png)k\
  \ do {\n    visited[i]=False\n}\n// 初始化邻接矩阵\nfor ![Mathtype979-8-3693-1582-8.ch005.m54](img/ch005.m54.png)k\
  \ do {\n    for ![Mathtype979-8-3693-1582-8.ch005.m55](img/ch005.m55.png)k do {\n\
  \        if (层级 i 和层级 j 之间存在边) {\n            adj[i][j]=True\n        } else {\n\
  \            adj[i][j]=False\n        }\n    }\n}\n// 划分序空间中的深度遍历\nfor k do {\n\
  \    if (visited[l]=False) {\n        DFS(POPS[m],l)\n    }\n}\nreturn L\n// 使用递归方法的深度遍历函数\n\
  function DFS(POPS[m],l) {\n    visited[l]=Trueed\n    L=L∪层级 l\n    if (l=k) {\n\
  \        break // 如果 l 是最细的求解层级则算法结束\n    }\n    for i do {\n        if (adj[l][i]=True\
  \ and visited[i]=False) {\n            DFS(POPS[m],i) //递归遍历 l 的未访问相邻顶点\n      \
