  \ |\n\n### 使用 Azure 服务建立流水线的步骤：\n\n### 步骤 1\n你你需要建立一个 Azure 账户。\n为了访问 Azure 门户并使用\
  \ Azure 服务，必须注册 Azure 账户。此外，某些服务的使用需要获取积分，这些积分将根据生成和使用的服务性质产生费用。\n\n#### 步骤 2：建立环境\n\
  从创建一个资源组开始，作为将要使用的所有资源的存储。如果相关，选择一个用于未来用途的资源组很重要。该资源组应该是已经创建的那个。要继续，接下来的操作是建立一个存储账户以安全地保留源数据。部署成功后，继续建立容器。然后，在该容器内创建一个文件夹并将必要文件上传其中。出于测试原因使用了\
  \ Blob 存储。\n\n### 步骤 3\n将 CSV 文件的内容传输到数据库表。\n\n\n\n\n在 ADF 中为源和汇点创建连接服务。为 blob 存储建立链接服务，在该研究中，CSV\
  \ 文件被保存为 blob。第二个连接的服务是 Azure SQL Database，它已链接到数据库。接下来，构建一个新的流水线并选择数据流活动（dataflow\
  \ activity）。必须生成一个新的数据流，并将其分配为数据流活动的数据流。随后，为每个关联服务生成数据集。接着，创建一个新的流水线并选择复制操作（copy\
  \ action）。将源分配到包含 CSV 文件的数据集，并将汇点分配到包含 SQL 数据库的数据集。选择在数据库中不存在表时自动创建表的选项。随后，验证流水线并排除任何问题。\n\
  \n### 第 4 步：建立数据编排流水线\n\n生成一个新的数据流，然后建立一个新的流水线并使用数据流活动。随后，建立数据流以匹配之前生成的数据流。建立两个源：第一个源从\
  \ blob 存储检索数据，而引用源从数据库获取数据。将对这些源进行比较。有必要激活数据流调试，因为这使数据流能够执行。为初始源链接一个派生列转换（derived\
  \ column transformation），并生成一个用于哈希的列和一个用于日期时间戳的列。由于引入了两个额外的列，必须在数据库中建立新列。重要的是，列的数据类型、`Dataflow\
  \ expression builder` 中返回的表达式以及数据库的类型必须相同。随后，有必要通过 `Lookup` 转换建立连接，以验证记录已存在或被视为新记录。为了实现此点，你可以配置查找流以匹配引用源。查找条件用于为比较两个源提供标准。为了确定比较后记录的结果，数据流中链接了一个条件拆分转换（conditional\
  \ split transformation）。本研究包含三个潜在的流：新记录、更新和无操作。每个流的状态由其相应的条件 `Dataflow expression\
  \ builder` 决定。处理过程将根据满足的条件遵循各自的流并最终到达汇点。新记录流链接到汇点，但更新流与相比之下需要额外的转换。为了启用记录更新，有必要在更新流上附加一个更改行转换（alter\
  \ row transformation）。最后，汇点决定存储记录的目标数据集。在所选选项方面，新记录流和更新流之间的更新技术有所不同。在新记录流中，仅选择了插入（insert）选项，而在更新流中，同时选择了插入（insert）和更新（update）选项。随后，数据流中的列必须准确链接到目标数据集中的相应列。\n\
  \n### 第 5 步：实施流水线\n\n启动流水线，选择随后构建的流水线，并验证流水线是否存在任何潜在错误。假设没有问题，通过调试（debug）选项执行流水线。要查看写入的行数，选择输出选项然后选择数据流详情。\n\
  \n## 框架评估\n\n在获取和使用 ADF 环境之前，本研究使用了理论策略来执行实验并评估生成产物的效效。这种理论评估包含了每种给定情况的有利和不利结果。相同的可能性都从理论和实践两个方面进行了评估。\n\
