  \n## 第 2 章\n\n*   王丽颖\n    中国，山西大学\n*   程宇婷\n    中国，山西大学\n*   范雪晴\n    中国，山西大学\n\
  *   王安娜\n    ![Orcid Imagehttps://orcid.org/0009-0001-5196-9132](https://orcid.org/0009-0001-5196-9132)\n\
  \    中国，山西大学\n*   赵汉森\n    美国，佐治亚理工学院\n\n### 摘要\n\n本章关注糖尿病患者血糖仪选择的问题。。为了解决这个问题，作者开发了一个综合评价模型，该模型结合了三角形模糊逻辑（`TF`）、多粒度（`MG`）、三路决策（`TWD`）和粗集理论。评价模型考虑了血糖仪的性能指标和用户需求。作者利用\
  \ `TF` 逻辑对指标进行建模并确定其权重，同时整合了 `TWD` 方法来处理不完整和不确定信息。随后，他们引入了 `PROMETHEE` 方法对各种方案进行全面评价和排名。最后，在该评价模型中根据分数选择了最优方案。实验结果证明了我们提出的方法在解决血糖仪选择问题以及为糖尿病患者提供个性化建议方面的有效性。\n\
  \n## 引言\n\n#### 问题背景\n\n现代医疗技术的进步显著提高了糖尿病患者管理和监测其血糖水平的能力（Domingo-Lopez, 2022）。血糖仪作为方便的医疗设备，在家庭和临床环境中被广泛使用。然而，市场已经充满了各种型号和品牌的血糖仪，这为患者选择最合适的设备带来了挑战。准确性、质量、售后支持和疼痛感等因素必须被考虑在内。患者必须仔细评估这些因素，以选择一个符合其特定需求和偏好的血糖仪。因此，为了帮助患者做出明智决策，必须仔细评估这些因素并选择符合其特定需求和偏好的血糖仪。为了解决这些挑战，本研究提出了一个整合了三角形模糊集（`TF`）、`TWD`\
  \ 和 `PROMETHEE` 方法的综合模型，以提高血糖仪选择的效率和准确性。在选择血糖仪时，患者必须考虑价格、准确性和便利性等因素。然而，这些因素引入了模糊性，增加了决策过程的复杂性。\n\
  \n#### 模糊集简述\n\n1965 年，Zadeh 引入了模糊集的概念，扩展了二值在现实场景中的表示。模糊集在决策中起了至关重要的作用。然而，模糊集也存在局限性。例如，在设定成员函数方面存在困难，处理大型数据集会导致计算复杂性。为了解决这些局限性，模糊集出现了多种泛化形式，例如直觉模糊集（[Atanassov,\
  \ 1986](https://doi.org/10.1007/BF001919333)）、犹豫模糊集（[Torra, 2010](https://doi.org/10.1016/j.fuzzy.2009.09.005)）以及其他（[Turksen,\
  \ 1986](https://doi.org/10.1007/BF001919333)；[Peng & Selvachandran, 2019](https://doi.org/10.1016/j.futuresys.2019.01.003)；[Zhang\
  \ et al., 2019](https://doi.org/10.1016/j.fss.2018.11.016) ）））。这些泛化形式拓宽了模糊数学的范围，并为处理不确定性提供了额外方法。这些泛化形式在不同领域得到了广泛应用。[Ecer,\
  \ 2022](https://doi.org/10.1016/j.future.2022.04.005)引入了`MAIRCA`框架的新型扩展，即直觉模糊`MAIRCA`，用于根据特定标准评估新冠疫苗。[Mishra\
  \ et al., 2022](https://doi.org/10.1016/j.future.2022.01.012) 提出了一种基于犹豫模糊集和改进`VIKOR`方法的多属性决策方法，有效解决了现有`MADM`方法的局限性。[Chai\
  \ et al., 2023](https://doi.org/10.1016/j.as.2022.104635) 结合直觉模糊集、区间值模糊集和累积前景理论，提出了一种新型模糊多属性决策方法，用于选择最具可持续性的供应商。[Wang\
  \ et al., 2022](https://doi.org/10.1016/j.future.2022.03.012) 提出了一种测量毕得模糊集熵的新型方法，同时考虑了基于隶属度和非隶属度的毕得模糊性熵以及基于犹豫程度的毕得犹豫熵。[Zhang\
  \ et al., 2021a](https://doi.org/10.1016/j.fsys.2021.101633), [2022a](https://doi.org/10.1016/j.fsys.2022.102155)\
  \ ))将`q-ROFSs`引入`MG TWD`框架中，并探索了 q-环对正模糊信息系统中多属性群体决策（`MAGDM`）的新型方法。其主要关注点是在具有不精确和不完整\
  \ q-环对模糊信息的情况下进行`MAGDM`。\n\n\n\n\nTFSs（Van Laarhoven & Pedrycz, 1983）是一种常用的模糊集类型，能够熟练地捕捉变量的模糊性。它们在多属性决策问题中的广泛应用，源于其能够精确地刻画变量的模糊特征。Yue\
  \ 等人 (2023) 整合了 TFSs 和直觉模糊集，重新定义并验证了三角形直觉模糊数的算法、期望函数和距离度量，并引入了三角形直觉模糊集（TIFSs）的新型理论。Garg\
  \ and Rani (2022) 利用不同的三角形形心，为决策中的直觉模糊集提出了新颖的距离度量，并通过各种模式和挑战验证了其有效性，同时还提供了一种基于置信水平的对象匹配聚类算法。相比之下，本文采用融合方法，将\
  \ TFSs 与 MG TWD 结合，以评估血糖计产品的不同指标。目标是为患者识别最合适的产品。\n\n## MG TWD 简述\n\n粒度计算是一种关注在理解和处理数据及信息时粒度问题的计算模型。它将它们视为由不同粒度级元素组成的复杂系统。通过分组、分类和聚合等操作，建立了不同粒度之间的关系和映射，从而促进了高效的信息处理和管理。在粒度计算使用的技术中，TWD\
  \ 是一项突出工具。与传统的双向决策不同，TWD 引入了延迟决策的概念（Wang 等., 2021）。这使得决策者（DMs）能够收集充足的信息并掌握不同选择的相关风险，从而实现更精确的决策过程。\n\
  \nTWD 由 Yao (2010) 于 2010 年首次提出，此后通过后续研究经历了进一步的扩展和发展（Yao, 2016, 2018, 2020)）。事实上，近年来对\
  \ TWD 进行了大量的研究。Wang 等人 (2023) 了一种将遗憾理论与模糊不完全信息系统中的 TWDs 结合的新型决策方法。Yi 等人 (2022) 成功实现了毕达哥德模糊理论与\
  \ TWD 的有效整合，通过引入风险偏好增强了三向决策。Liu 等人 (2022) 将区间值直觉模糊集引入决策理论粗糙集的损失函数中，并提出了基于优化的区间值直觉模糊\
  \ TWD 方法。此外，在一些学者的研究中（Zhang 等., 2020b; Lei 等., 2020b; Zhang 等., 2023a; Han 等人, 2022`）），他们将\
  \ TWD 方法与语言集结合，以解决更广泛的问题和领域。Qian 等人 (2010) 将 MG 粗糙集作为单粒度粒度计算模型的扩展，承认单粒度方法只能对复杂问题提供有限的视角。通过引入来自不同视角的多个等价关系，MG\
  \ 粗糙集在信息融合和分析方面具有优势。通过将 TWD 与 MG 计算相结合，一些学者（Zhang 等., 2020a`; Pang 等., 2020`; Zhang\
