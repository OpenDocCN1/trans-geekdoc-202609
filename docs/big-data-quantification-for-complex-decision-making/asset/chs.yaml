  \ 3`，如果选取结果中非破产公司的比例高于基准，说明`Algorithm 3`的选取结果是有效的。在图 4 中，`k`值根据对象层级选取。在图 5 中，`k`值按等间隔取值。根据定性破产集中非破产公司的数量，`k`值不超过`78`。在图\
  \ 4 和图 5 中，有效值 = 所选公司中非破产公司的数量 / 所选公司总数，有效值高于基准，达到了`0.90`以上。总体而言，`Algorithm 3`的有效性非常好。\n\
