  \n## 第 4 章\n\n- Dharmesh Dhabliya，印度 Vishwakarma 信息技术学院\n- Vivek Veeraiah，印度 Sri\
  \ Siddhartha 高等教育学院\n- Sukhvinder Singh Dari，印度 Symbiosis 法律学院，Symbiosis 国际大学\n\
  - Jambi Ratna Raja Kumar，印度 Gen Sopanrao Moze 工程学院\n- Ritika Dhabliya，印度 ResearcherConnect\n\
  - Sabyasachi Pramanik，印度 Haldia 技术学院\n- Ankur Gupta，印度 Vaish 工程学院\n\n### 摘要\n\n\
  德尔班理工大学（Durban University of Technology）目前正参与一个项目，该项目旨在为南非政府部门的一家培训机构创建一个数据湖仓（data\
  \ lake house）系统。该系统对于提高培训机构的监测和评估能力以及确保高效的服务交付至关重要。确保输入湖仓的数据具有高质量至关重要，因为低数据质量会负面影响湖仓系统的有效性。本章研究了摄取层管道的质量控制方法，以提供一个确保数据质量的框架。评估数据质量时考虑的指标包括完整性、准确性、一致性和正确性和及时性。通过在示例半结构化数据集上有效实施，验证了该框架的效率。未来的发展建议包括通过整合更广泛的数据源以及为增量数据采集提供触发机制。\n\
  \n## 引言\n\n在南非，行业教育与培训机构（SETAs）是负责经济各部门技能开发和培训的政府机构。这些机构被称为政府部门培训机构（GTAs），它们在国家提高技能和培训水平方面发挥着至关重要的作用。德尔班理工大学（DUT）已与南非政府技术局（GTA）合作，增强其在进行项目中使用的数据管理策略。这是通过帮助\
  \ DUT 学生培养额外技能来实现的。为了增强 GTA 的数据管理能力，需要一个能够存储数据并自动生成报告的系统。经过讨论，DUT 建议使用 Microsoft\
  \ Azure 服务建立数据仓库解决方案。该项目的更多背景信息见 (Mthembu 等人，2024)。本章侧重于为南非政府部门的培训机构建立数据湖仓。一个关键方面是研究在数据通过系统移动过程中确保其完整性的技术，特别是在摄取层采用数据编排的增量提取-加载-转换（ETL）管道中。\n\
  \n\n\n\n\n在大数据时代，海量信息既带来了优势也带来了挑战，有效地的处理和使用数据已成为组织成功的关键。数据类型涵盖广泛，包括结构化、半结构化和非结构化形式，这需要复杂的方法来处理数据操作（Azad\
  \ et al., 2020）。提取、加载、转换（ELT）框架是一种多功能工具，其在处理现代数据环境复杂性方面的效率已广公认可（Singhal & Aggarwal,\
  \ 2022）。然而，随着数据流水线变得日益庞大且复杂，确保数据质量（DQ）的完整性变得更加重要。\n\n大数据的出现使得分布式数据仓库（DLH）的使用成为必要。Harby\
  \ and Zulkernine (2022) 指出，大数据时代给传统数据仓库（DWs）带来了新问题。数字化转型导致多样化数据数量增加，为企业的传统数据仓库解决方案带来了难题（Čuš\
  \ & Golec, 2022; Giebler et al., 2021）。此外，(Barika et al. 2019） 强调了研究人员在组织、控制和实施大数据工作流方面面临的挑战，这些工作流与典型工作流有显著差异。在经过转换并被放入数据仓库（DW）之后，原始的过滤后的信息将不再被保留（Figueira,\
  \ 2018）。根据传统观点，（Nambiar and Mundra 2022），ETL 过程被认为无法满足某些数据管理需求。\n\n数据湖（DL）是一种专门用于管理大量异构数据的综合性存储和探索系统。它被广泛地认为是处理和存储各种数据的首选方法（Begoli\
  \ et al., 2021）。DUT 团队开展的进一步研究强调了通过实施流程、规则、组织结构和职责，数据治理在确立数据利用和决策权威性方面的重要性（Mthembu\
  \ et al., 202423)）。未能定期维护数据湖可能会导致昂贵且困难的数据管理。DL 系统中数据治理的执行不足可能会导致混乱的“数据沼泽”的产生，由于存在难以处理和分析的数据，这将损害知识管理和分析系统中信息的价值。\n\
  \nDLH 作为一种创新概念应运而生，它整合了 DL 和 DW 的优点，使公司能够以灵活且成本效益的方式处理、分析和存储海量数据。根据（Harby and Zulkernine\
  \ 2022），这旨在加速有效提取信息的过程。\n\n## 本章目标\n\n本章的目标是提供一个结构化的系统，用于管理和将数据整合到数据湖仓（DLH）中，以确保数据的准确性和可靠性。本研究概述了以下目标，这些目标与宗旨一致：\n\
  \n*   分析现有文献，识别数据编排和摄取的关键参数和质量控制措施。\n*   创建并实施一个框架，包含已指示的关键要素和质量控制措施，以便在分布式账本医疗（DLH）系统中高效地管理和集成数据。\n\
  *   评估所建立框架的效性，并为分布式账本技术（DLT）医疗系统的数据编排和摄取的数据质量管理提供建议。\n\n通过提供关于使用 `Azure Data Factory\
  \ (ADF)` 进行数据湖数据编排和摄取的进一步研究数据，本研究丰富了现有知识库，有助于未来使用 `Azure Services` 进行数据编排和摄取的研究。识别建立数据编排和摄取流水线的局限性。此外，为该领域的后续调查提供见解增强了我们研究的重要性。本研究探索了数据编排的概念，这是一个结合了数据管理和质量控制的关键领域。主要目标是在数据仓库（DW）摄取层内部的增量\
  \ ELT 流水线提供质量控制程序。研究强调了使用半结构化数据的困难，并认识需要特定的方法来确保最佳的数据质量和完整性。研究结果描述了一个流水线框架的构建，允许来自\
  \ `SharePoint` 的数据导入数据湖架构内部的特定容器。该流水线包含了将半结构化数据转换为结构化格式的关键步骤，并利用数据编排方法确保处理数据的正确性、完整性和一致性。\n\
  \n第 1 节清晰地解释了差距产生并提供了强有力的补救，这由目标所示，并由为研究领域提供有价值的见解和实现特定目标的愿望驱动。研究的目标、范围和局限性对内容提供了全面的理解。第\
  \ 2 节描述了实验的方法论、数据集以及使用的工具和平台，为后续章节提供了充分的时间。第 3 节展示了实验结果并评估了框架的效性。此外，第 3 节讨论了限制并对实验执行进行了评估。第\
  \ 4 节展示了实验发现并评估了所制品的整体性能。\n\n## 文献综述\n\n(Figueira, 2018) 认为大数据领域的主要目标是提供管理海量数据的方法，以产生价值的见解和知识。(Gupta,\
  \ 2023) 解释了大数据的概念源于被称为 3V 的三个要素。这些因素包括：\n\n*   量（volume），指的是数据量（Liu & Zhang, 2020;\
  \ Pratsri & Nilsook, 2020)））；\n*   多样（variety），涵盖了广泛的数据类型和来源，如结构化、半结构化和非结构化数据（Liu\
  \ & Zhang, 2020)）；\n*   速度（velocity），代表新数据生成和传输的速度（Liu & Zhang, 2020)）。\n\n随后，出现了\
  \ 5V 框架，包含了原始的 3V 并整合了以下新增：大数据的真实性（veracity）至关重要，因为确保数据准确无重复是一项挑战且耗时的任务。价值（value）指的是对业务应用具有价值和意义的数据，包括用于总结和战略规划的分析，旨在提高产品价值并在目标市场的竞争力。图\
  \ 1 由 Sandhu 于 2021 年创建，展示了 5V 的许多实例。\n\n| 图 1. 5V 的表示 |\n\n| --- |\n\n| ![Figure979-8-3693-1582-8.ch004.f01](img/ch004.f01.png)\
  \ |\n\n| --- |\n\n\n\n\n\n内容格式来源分为三类：结构化数据、半结构化数据和非结构化数据。结构化数据是指按照特定的层级模式系统组织的数据。以这种方式存储数据有助于搜索引擎更轻松地呈现和理解这些数据。半结构化数据的特征是具有不规则且隐性的结构，没有明确定义的数据模型。在这种特定的数据库格式中，数据与模式（schema）之间的区别并不明显。与组织良好的数据相比，非结构化数据是其完全对立面。缺乏定义良好的框架导致数据处理成为一项耗时的任务。\n\
  \n由于半结构化数据不遵循预定义的数据模型且缺乏稳定的模式，处理起来最为困难。这是由于其([Dickson & Asagba, 2020)](不规则且隐性的框架造成的。(Nadal\
  \ et al. 2022) 指出了使得将半结构化数据接入具有模式灵活性的流水线具有挑战性的因素，这为创建处理的标准化框架带来了困难，因为可能需要接受各种数据示例。\n\
  \n(Raj, et al. 2020) 断言 `ETL` 和 `ELT` 是数据流水线的主要分类。数据湖（`DLs`）使用提取、加载和转换（`ELT`）方法，第一步涉及加载“原始数据”，然后进行后续转换（(Cherradi\
  \ & El Haddadi, 2022)）。与 `ETL` 过程相比，`ELT` 技术遵循相似的基本思想，但在顺序上有所不同。它不是在加载之前进行转换，而是先加载数据然后再进行转换。与数据集成相比，数据编排涵盖了更广泛的活动。数据集成主要集中在为了报告目的而整合数据，而数据编排包括了资源分配、监控、数据发现、准备，以及跨各种景观的富集数据的集成、处理和链接等任务（(Dinh\
  \ & Nguyen, 2022)）。(Kevin and Ginger 2021) 强调了系统的目标是高效地处理和组合数据，从而改进或建立企业运营。\n\n\
  ### 数据摄取 (Data Intake)\n\n数据摄取通常是设计中的第一层。摄取层的主要功能是从各种源获取数据并将其集成到分布式学习系统中。(Cherradi\
  \ & El Haddadi, 2022)已经显示，摄取层的数据摄取可以通过多种方式进行，取决于源和目的地。这些方法包括批处理、实时处理或两者的结合。根据(Isah\
  \ et al. 2019)，流式处理涉及连续或动态数据的处理，与批处理不同。流式处理是一种在不依赖持久性存储的情况下进行实时分析的技术，在 Twitter 和\
  \ Facebook 等社交媒体平台中起着至关重要的作用。接收数据的速度极大影响这一过程（(Nambiar & Mundra, 2022)）。流式处理擅长处理不断流动的大量数据，并且可以快速适应(Puni,\
  \ 2021)的需求（(Nambiar & Mundra, 2022) 提供了一种结合批处理的混合策略）。\n\n### 质量 (Qualities)\n\n\
  选择的 `DQ` 质量是准确性、完整性和时效性（此处原文此处似乎不完整）。\n\n数据摄取通常是设计中的第一层。摄取层的主要功能是是从各种源获取数据并将其集成到分布式学习系统中。(Cherradi\
  \ & El Haddadi, 2022)已经显示，摄取层的数据摄取可以通过多种方式进行，取决于源和目的地。这些方法包括批处理、实时处理或两者的结合。根据(Isah\
  \ et al. 2019)，流式处理涉及连续或动态数据的处理，与批处理不同。流式处理是一种在不依赖持久性存储的情况下进行实时分析的技术，在 Twitter 和\
  \ Facebook 等社交媒体平台中起着至关重要的作用。接收数据的速度极大影响这一过程（(Nambiar & Mundra, 2022)）。流式处理擅长处理不断流动的大量数据，并且可以快速适应(Puni,\
  \ 2021)的需求（(Nambiar & Mundra, 2022) 提供了一种结合批处理的混合策略）。\n\n*(注：由于原文文本在“Qualities”部分似乎存在重复或截断，上述翻译已根据提供的逻辑进行了对齐。以下是基于剩余文本的完整翻译：)*\n\
  \n选择的 `DQ` 质量是准确性、完整性和时效性。\n\n在摄取层进行数据完整性检查对于防止数据传输过程中的损坏至关重要(Anastasova & Yanev,\
  \ 2021)这评估了数据是否符合预设标准。(Peng et al. 2015) 准确性是指数据精确、忠实地呈现预期内容。完整性是指数据包含了所有属性（(Koltay,\
  \ 2020)）。时效性是指数据的新旧程度，对于处理数据的系统至关重要(Gabarro and Stewart, 2021)，强调编排的有效性可以通过两种独立衡量标准进行评估：首先通过其计算结果。\n\
  \n### 研究方法论 (Research Methodology)\n\n本研究使用了设计科学研究（`DSR`）范式，(Vom Brocke et al. 2020)，他们认为\
  \ `DSR` 从根本上是一种解决问题的范式。图 3 展示了由 Ellis 和 Levy (2010) 开发的 `DSR` 范式。\n\n| 图 3. DSR\
