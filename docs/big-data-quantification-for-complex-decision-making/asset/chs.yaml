  \n## 江万涛 (Chunmao Jiang) - 贡献作者\n江万涛目前任福建大学计算机与数学学院教授，并在那里指导学生。他拥有哈尔滨工业大学（2004 年）硕士学位和哈尔滨大学计算机科学博士学位。他对粒度计算、三维决策理论和云计算有深厚的兴趣和研究。作为学术社区的活跃成员，他担任\
  \ CCF 开源委员会委员和 CAAI 粒度计算委员会委员。近年来，江教授主持了多项重大项目。他主持了一项省级教改项目和一项一般性项目。在科学研究方面，他主持并参与了十多项国家自然科学基金、国家社会科学基金、中国博士后基金及各类省级资助。江教授的学术成果丰富，在*TFS*、*INS*、*KBS*和《电子学报》等期刊上发表了\
  \ 80 多篇文章。他对领域的致力于体现了他对教学和的投入。`2b4c7b84-b430-4b2f-b3e7-b41ea069`\n\n## 刘可欣 (KeXin\
