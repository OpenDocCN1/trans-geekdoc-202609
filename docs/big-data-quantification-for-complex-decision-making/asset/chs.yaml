  \n广度优先乐观多视图顺序三路决策是广度优先算法和乐观融合策略的结合。广度优先算法获取问题求解层序列以构建顺序决策过程。乐观融合策略在问题求解层融合多个单层视图以做出三路决策。在问题求解层，根据乐观融合策略，在正区域中，我们使用“取并”操作融合多个视图，从而从多视图做出三路决策。基于问题求解层序列，从高层问题求解到低层问题求解，我们从多层做出三路决策。因此，广度优先乐观多视图顺序三路决策不仅可以从多个不同视图做出决策，还可以从多个抽象层面。详细过程见算法\
