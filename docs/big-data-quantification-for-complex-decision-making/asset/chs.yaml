  \n## Zaifa Xue\n薛再法目前在燕山大学信息科学与工程学院读博士，并在河北省信息传输与处理关键实验室。他目前的研究兴趣包括机器学习。\n`71887fcf-3552-4e6c-a7be-0470334`\n\
  \n## Dai Yinglong\n戴颖龙在长沙湖南大学获得应用数学博士学位。他是长沙湖南大学的一名教师。他目前的研究领域包括粒度计算、智能信息处理、模糊系统和拓扑学。\n\
  `efbd436f-5296-4336-047033d`\n\n## Xiao Zeyu\n萧泽宇是湖南大学的学生。他目前的研究领域包括粒度计算、智能信息处理、模糊系统和拓扑学。\n\
  `19e24f68-4af0-4918-b522-b1492e1557`\n\n## Jia Zhang\n张毅在爱尔兰都柏林大学计算机科学与统计学院获得硕士学位。\n\
  `0b28cb83-2465-4583-b770-61248c54`\n\n## Shaoxia Zhang\n张晓霞于 2021 年在山西大学计算机与信息学院获得博士学位。她任职于山西财经大学信息学院。她的研究兴趣包括概念分析\
  \ (`FCA`) 和粒度计算。\n`58aef21e-d156-4c51-9bc6-1a708ce8ea5`\n\n## Tao Zhang\n张涛是燕山大学信息科学与工程学院教授，河北省优秀人才。他的研究兴趣包括概念分析、机器学习和因果推理。他提出了属性拓扑理论，并将其概念学习、机器学习和医学信号处理。\n\
  `5e9783ba-c5da-4cfa-be15-b7fb4ee15`\n\n## Hansen Zhao\n赵汉森在美国佐治亚理工学院获得硕士学位。\n`8cc6af17-c5fa-4313-bc50-a3cae95d58db`\n\
  \n## Xinyue Zhao\n赵欣悦于 2023 年在中国山东农业大学获得数据科学与大数据学士学位。她目前正在山东农业大学攻读计算机技术硕士学位。她的研究兴趣是农业短文本分析。\n\
