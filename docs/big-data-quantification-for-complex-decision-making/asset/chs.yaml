  ### 算法 2. 最短和最长路径搜索算法\n\n**输入：** 加权图 `G=(V,E,Dis)`，其中 `V={v[0],v[1],…,v[N-1]}`，`E={v[0]v[1],v[1]v[2],…v[N-2]v[N-1]}`\n\
  **输出：** `U[short]` 和 `U[long]` 分别为最短和最长路径集合。\n**过程：**\n```\nfor i=0,1,...,N-1 do\n\
  \  # 短路径搜索\n  U[short]={v[i]}\n  repeat\n    找到当前特征最近的特征，排除自身\n    U[short]添加该特征\n\
  \  until 无法找到\n\n  # 最长路径搜索\n  U[long]={v[i]}\n  repeat\n    找到当前特征最远的特征，排除自身\n\
  \    U[long]添加该特征\n  until 无法找到\nend\n```\n\n## 基于注意力权重的随机森林预测\n\n在对 PD 特征向量进行频率提取后，新特征向量\
  \ ![Mathtype979-8-3693-1582-8.ch003.m82](img/ch003.m82.png) 和 ![Mathtype979-8-3693-1582-8.ch003.m83](img/ch003.m83.png)\
  \ 的维度均为 `J+1`。随机森林是处理高维数据的强大算法，能有效降低过拟合风险。因此，多维特征矩阵 ![Mathtype979-8-3693-1582-8.ch003.m84](img/ch003.m84.png)\
  \ 和 ![Mathtype979-8-3693-1582-8.ch003.m85](img/ch003.m85.png) 输入随机森林以预测 PD 患者的运动-UPDRS\
  \ 和总-UPDRS。随机森林回归是由多个决策回归树组成的集成学习算法。随机森林中的每棵决策树都是在随机样本和特征上训练的。假设特征向量 ![Mathtype979-8-3693-1582-8.ch003.m86](img/ch003.m86.png)\
  \ 和 ![Mathtype979-8-3693-1582-8.ch003.m87](img/ch003.m87.png) 输入随机森林以生成 `T` 棵决策树，那么\
  \ `3T` 棵决策树的预测结果为 ![Mathtype979-8-3693-1582-8.ch003.m88](img/ch003.m88.png)，其中 `Tr[t]`\
  \ 代表第 `t^(th)` 决策树的预测结果。\n\n随机森林在假设每个决策树结果准确的情况下，通过平均所有决策树的结果来获得最终预测值。然而，由于随机森林的随机性，并不是所有的决策树都是准确的，且每个决策树预测结果的重要性可能不同。简单地平均所有决策树的预测结果可能会增加随机森林的预测误差。\n\
  \n\n\n\n为了提高模型性能，决策树中引入了注意力权重。图 6 展示了结合注意力加权的改进型随机森林预测模型。它能够自适应地关注预测准确性较高的决策树，并抑制预测性能较差的决策树，从而减少预测误差。权重的计算公式如下：\n\
  \n```\nw = tanh(W∙Tr+b) (16)\n```\n\n![Mathtype979-8-3693-1582-8.ch003.m91](img/ch003.m91.png)\
  \ (17)\n\n其中![Mathtype979-8-3693-1582-8.ch003.m92](img/ch003.m92.png)代表全连接网络训练的权重向量![Mathtype979-8-3693-1582-8.ch003.m93](img/ch003.m93.png)和![Mathtype979-8-3693-1582-8.ch003.m94](img/ch003.m94.png)表示待训练的注意力层参数，`tanh(∙)`表示激活函数。`w[i]`是第`i^(th)`决策树的未归一化权重，`α[i]`是第`i^(th)`决策树的注意力权重。注意力机制通过为每个决策树分配不同的权重，增强了随机森林（RF）中关键决策树的预测影响。加权决策树的预测结果为\
  \ `Tr’`：\n\n```\n![Mathtype979-8-3693-1582-8.ch003.m95](img/ch003.m95.png) (18)\n\
  ```\n\n为了提高预测准确性，将加权结果输入全连接网络以获得预测值，记为![Mathtype979-8-3693-1582-8.ch003.m96](img/ch003.m96.png)，用于帕金森病（PD）患者的运动-UPDRS\
  \ 或总-UPDRS。\n\n```\n![Mathtype979-8-3693-1582-8.ch003.m97](img/ch003.m97.png) (19)\n\
  ```\n\n其中`δ`表示`ReLU`激活函数，`W[1]`和`W[2]`分别是两个全连接层的权重矩阵。`b[1]`和`b[2]`是对应全连接层的偏置项。一旦将测试集中的`P`个样本输入`GWT-RF-Att`模型，最终预测结果记为![Mathtype979-8-3693-1582-8.ch003.m98](img/ch003.m98.png)。其中![Mathtype979-8-3693-1582-8.ch003.m99](img/ch003.m99.png)代表第`p^(th)`个测试样本的预测\
  \ UPDRS 得分。\n\n| 图 6. 基于注意力加权的随机森林预测 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch003.f06](img/ch003.f06.png)\
  \ |\n| --- |\n\n## 实验\n\n### 帕金森远程监测数据集\n\n帕金森远程监测数据集（PTDS)(Tsanas et al., 2010)源于牛津大学，广泛用于预测\
  \ PD 症状的严重程度(Ji et al., 2018; Tsanas et al., 2021; Despotovic et al., 2020; Yoon\
  \ & Li, 2019)。该数据集包含从 42 名原发性 PD 患者收集的语音数据，包括 28 名男性和 14 名女性，每人都有 5 年的病史。患者需在每周的同一天记录\
  \ 6 个具有不同音量水平的持续元音 /a/，且测试期间不服药。这一录音过程持续了 6 个月，共产生了 5,875 个语音样本。Tsanas et al. (2010)应用线性和非线性语音信号处理算法，从记录的数据中提取了\
  \ 16 个语音特征，所示表 1。此外，性别和年龄是预测 PD 症状严重程度的重要因素(Yoon & Li, 2019)。注意力机制通过为每个决策树分配不同的权重，增强了随机森林（RF）中关键决策树的预测影响。帕金森病症状的严重程度可以通过分层来评估([979-8-3693-1582-8.ch003.xhtml#r13))。在研究中，分层后的\
  \ UPDRS 分值为 55 和 41，这表明分层后的 UPDRS 分值是有效的。通过线性分段插值法，对起始、6 个月后的 UPDRS 得分进行了估计。总结而言，该数据集在这些分层后的\
  \ UPDRS 分值对 PD 提供了有价值的信息。表 1. 语音处理提取的特征\n| 特征 |\n| 频率 | 抖动 (Jitter %) |\n| 振幅 |\
  \ 闪烁 (Shimmer dB) |\n| 信噪比 | NN |\n| 频率 | DFA |\n\n### 实验设置\n\n### 帕金森远程监测数据集\n\n\
  #### LDSF 模型的实验设置\n\n在实验期间，LDSF 主要调整的参数包括 MIC 的确定。因此，本章将 MIC 的上限设置为 0.6`([979-8-3693-1582-8.ch003.xhtml#r15))。SOM\
  \ 参数设置如下：学习率`η=0.9`，输出维度`dim[x]=4`，最大迭代次数`T=1000`。\n\n#### GWT-RF-Att 模型的实验设置\n\n\
  为了评估预测能力并验证预测结果的准确性，本章采用平均绝对误差（MAE）作为评估指标。\n\n```\n![Mathtype979-8-3693-1582-8.ch003.m100](img/ch003.m100.png)\
  \ (20)\n```\n\n其中`M’`代表样本数量，`y[k]`和![Mathtype979-8-3693-1582-8.ch003.m101](img/ch003.m101.png)分别代表真实值和预测值。MAE\
  \ 越小，预测值越接近真实值，说明预测性能越好。\n\n为了简化建模过程，本章使用了标准的 K 聚类算法对帕金森远程监测数据集中的样本进行聚类。聚类数量会影响聚类算法的性能。之前的研究([979-8-3693-1582-8.ch003.xhtml#r13))探索了该数据集的聚类数量，并认为\
  \ 4 或 9 是合理的。考虑到 PD 数据集规模较小，我们选择了 4。\n\n\n\n\n为了提高 `GWT-RF-Att` 模型的性能，对注意力权重随机森林模型的超参数进行了优化。这包括\
  \ `RF` 中的决策树数量、注意力层中的单元数、`FC` 层中的单元数以及训练批次大小。最佳参数选择方法是仅调整相关参数而保持其他参数不变，以获得最佳的预测性能\
  \ (Zhang et al., 2021)）。每个簇中预测 `motor-UPDRS` 和 `total-UPDRS` 的最佳超参数分别在表 2 和表 3 中提供。\n\
