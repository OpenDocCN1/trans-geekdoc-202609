  \n*   **备注**：根据定义 2.7 (1) 和 (2) 的语义，信息系统中对象子集的 `|D|` 越小，对象子集越好。特别是 ![Mathtype979-8-3693-1582-8.ch001.m98](img/ch001.m98.png)\
