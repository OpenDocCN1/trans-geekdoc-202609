  =X`, `X^k\\= POPSBND^(B\\_P)(X^(k-1))`。\n\n从 `L` 的第一个问题求解层到第 `t` 个问题求解层，广度优先悲观多视图顺序三路决策的正区域、负区域和边界区域定义为：\n\
