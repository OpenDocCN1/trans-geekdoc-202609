  \ `g∈G`，为了符号简便，`{g}^I` 写为 `g^I`。\n\n**命题 2.1** (Wille, 1982)设 `K=(G,M,I)` 为形式语境。对于\
  \ `A,A[1],A[2]⊆G` 以及 `B,B[1],B[2]⊆M`，我们有：\n\n*   (1) ![Mathtype979-8-3693-1582-8.ch010.m03](img/ch010.m03.png)\
