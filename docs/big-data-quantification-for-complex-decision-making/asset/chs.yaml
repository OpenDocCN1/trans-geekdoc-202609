  \ = X – POPSPOS^(D_P)(X) – POPSNEG^(D_P)(X).` (13)\n\n深度优先悲观多视图序列三路决策是深度优先搜索算法和悲观融合策略的结合。深度优先搜索算法获取一个问题求解层序列以构建序列决策过程。悲观融合策略在问题求解层上融合多个单层视图以做出三路决策。在问题求解层上，根据悲观融合策略，在正区域，我们使用“与”操作来融合多个视图，从多视图做出三路决策。基于问题求解层序列，从高层到低层，我们从多层做出三路决策。因此，深度优先悲观多视图序列三路决策不仅可以从多个不同的视图做出决策，还可以从多个抽象层次做出决策。与深度优先乐观多视图序列三路决策相比，主要区别在于融合多个视图的融合策略。详细过程见算法\
