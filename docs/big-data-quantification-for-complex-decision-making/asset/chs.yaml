  \ 也是接受的。□\n\n# 必要蕴含基与接受蕴含基\n\n第 4.2 节应用推理规则 `Augmentation` 和 `Combination` 对必要蕴含和接受蕴含进行推理。从知识完备性的角度来看，导出的必要/接受蕴含可以被视为数据中的冗余知识，因此可以被消除。因此，在本节中，我们讨论了基于\
  \ `Augmentation` 和 `Combination` 定义必要蕴含集和接受蕴含集的完备性和非冗余性，从而获得紧凑的必要蕴含集和接受蕴含集，即必要蕴含基和接受蕴含基。\n\
  \n然而，我们发现仅使用 `Augmentation` 和 `Combination` 无法彻底消除蕴含中的冗余，特别是前提和结论集不相交的蕴含。\n\n##\
  \ 示例 4.6（示例 4.1 的延续）。以示例 4.1 中的不完备形式语境为例。$L=\\{\\{a[1]\\}\\to\\{a[1]\\}, \\{a[3],a[5]\\\
  }\\to\\{a[1]\\}, \\{a[3],a[5]\\}\\to\\{a[1],a[3]\\}\\}$ 是 . 的一组必要蕴含集。\n\n考虑蕴含 $\\\
  {a[1]\\}\\to\\{a[1]\\}$。显然，这个蕴含是平凡成立的。然而，从决策的角度来看，这种蕴含是没有意义且冗余的，因此应该被移除。尽管如此，可以验证的是\
  \ $\\{a[1]\\}\\to\\{a[1]\\}$ 无法通过 `Augmentation` 和 `Combination` 从 $L$ 中的其他蕴含（即\
  \ $\\{a[3],a[5]\\}\\to\\{a[1]\\}$ 和 $\\{a[3],a[5]\\}\\to\\{a[1],a[3]\\}$）中导出，阻止了从\
  \ $L$ 中移除 $\\{a[1]\\}\\to\\{a[1]\\}$。\n\n那么，取蕴含 $\\{a[3],a[5]\\}\\to\\{a[1]\\}$\
  \ 和 $\\{a[3],a[5]\\}\\to\\{a[1],a[3]\\}$ 为例。对于 $\\{a[3],a[5]\\}\\to\\{a[1],a[3]\\\
  }$，结论中的决策 $a[3]$ 是冗余的（因为 $a[3]$ 已经在前提中给出）。因此，为了计算和分析，应该删除 $\\{a[3],a[5]\\}\\to\\\
  {a[1],a[3]\\}$ 而保留 $\\{a[3],a[5]\\}\\to\\{a[1]\\}$。然而，我们发现仅使用 `Augmentation` 和 `Combination`\
  \ 无法实现这种效果。\n\n在接受蕴含上应用 `Augmentation` 和 `Combination` 时也会出现类似的问题，此处不再阐述。为了克服 `Augmentation`\
  \ 和 `Combination` 的缺点，我们引入了另一种推理规则：\n\n* `Reflexivity`（自反性）：\n\n![Mathtype979-8-3693-1582-8.ch010.m572](img/ch010.m572.png)\n\
  \n示例 4.7（示例 4.6 的延续）。考虑示例 4.6 中的必要蕴含集 $L=\\{\\{a[1]\\}\\to\\{a[1]\\}, \\{a[3],a[5]\\\
  }\\to\\{a[1]\\}, \\{a[3],a[5]\\}\\to\\{a[1],a[3]\\}\\}$。首先，应用 `Reflexivity` 得到 $\\\
  {a[1]\\}\\to\\{a[1]\\}$，然后可以从 $L$ 中移除。其次，同样应用 `Reflexivity` 得到 $\\{a[3]\\}\\to\\\
  {a[3]\\}$，通过进一步对 $\\{a[3],a[5]\\}\\to\\{a[1]\\}$ 和 $\\{a[3]\\}\\to\\{a[3]\\}$ 使用\
