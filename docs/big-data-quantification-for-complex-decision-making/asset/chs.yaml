  \ `(5)`、`(6)` 和 `(7)`，我们根据第一层的 `ADND` 值从小到大地选择对象。\n\n## GOMADMMADD\n\n在本节中，我们比较了组之间的优劣势，提出了“局部优劣度”和“优劣度”，并基于此设计了一种算法。\n\
  \n### 算法 1：基于混合优劣度的面向群体的多属性决策 (GOMADMMADD)\n\n| |\n| :--- |\n| 输入：`k` 个对象组 ![Mathtype979-8-3693-1582-8.ch001.m171](img/ch001.m171.png)，`(m[1],m[2],...,m[k])`\
  \ 表示组成员数量，以及 `k` 个信息系统 `S[1]={X[1],A,V,f}`, `S[2]={X[2],A,V,f}`, ..., `S[k]={X[k],A,V,f}`。\
  \ <br> 输出：一个对象组 `X`。 <br> 步骤 1：对于每个对象 ![Mathtype979-8-3693-1582-8.ch001.m172](img/ch001.m172.png)，根据定义\
  \ 2.1 计算 `↑x` 和 `↓x`； <br> 步骤 2：对于每个对象组 `X[t]`，`t=1,2,...,k`，根据定义 2.3 比较![Mathtype979-8-3693-1582-8.ch001.m173](img/ch001.m173.png)\
  \ 和 ![Mathtype979-8-3693-1582-8.ch001.m174](img/ch001.m174.png)； <br> 步骤 3：对于每个对象组\
