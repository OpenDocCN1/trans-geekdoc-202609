  \ (13)\n\n## 特征排序与小波变换\n\n为了从 PD 特征向量中提取不同的频率信息，我们通过沿着最短和最长路径组织特征序列，获得了向量 ![Mathtype979-8-3693-1582-8.ch003.m54](img/ch003.m54.png)\
