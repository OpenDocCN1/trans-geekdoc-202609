  \n## 核心术语与定义\n\n数据摄取 (Data Ingestion): 从各种来源收集并导入信息到存储库中的过程，例如 `Data Lakehouse`，以便进行分析。\n\
  \n数据湖仓 (Data Lakehouse): 一种统一的数据管理架构，允许组织在单一平台上存储和分析结构化与非结构化数据，结合了`Data Lakes`和`Data\
  \ 仓库`的优势。\n\n数据编排 (Data Orchestration): 指通过协调和管理不同的处理任务，确保数据的高效流转和系统集成，通常通过自动化工作流程实现。\n\
  \n数据质量 (Data Quality): 数据准确、完整、及时和一致的程度，为决策提供可靠且有意义的信息。\n\n半结构化数据 (Semi-Structured\
  \ Data): 具有不规则和隐含结构但缺乏定义数据模型的数据。\n\n## 第五章\n\n徐毅\n安徽大学，中国\n\n### 摘要\n\n粒计算关注结构化思维和问题解决，基于粒度结构解决复杂问题。关于粒度结构的研究主要关注多级粒结构和多视图粒结构，未将两者结合。为了更有效、合理地描述和解决问题，我们通过结合多级粒结构与多视图粒结构提出了划分序空间。为了获得划分序空间中解决问题的解决方案，我们提出了两种搜索算法：深度优先搜索和广度优先搜索。由于划分序空间遵循多视图和多级原则，我们讨论了基于划分序空间的三类决策。我们提出了四种多视图顺序三类决策。\n\
  \n## 引言\n\n\n\n\n\nZadeh 提出并讨论了模糊信息粒度概念，这是“粒度”概念首次被提出（Zadeh, 1979）。Hobbs 发表了一篇直接以“粒度”为题的论文（Hobbs,\
  \ 1985），讨论了粒子的分解与合并，并提出了生成不同粒度粒子的方法和模型。Lin T.Y. 在访问加利福尼亚大学伯克利分校期间提出了了“粒化计算”（Lin,\
  \ 1998）。粒化计算侧重于结构化思维和问题解决，这被视为受人类启示的计算和信息处理范式（Bargiela & Pedrycz, 2008; Pedrycz,\
  \ Skowron, & Kreinovich, 2008; Yao, 2009; Yao, 2016）。它基于粒化结构解决复杂问题。\n\n在粒化结构中，一组属性（特征）通常被选为一个视图，用以从特定角度描述对象。在每个视图中，对象可以从不同粒度（抽象程度）进一步描述，每个粒度都决定了一个层次。多视图和多层次是粒化计算的两个基本原则（Yao,\
  \ 2009; Yao, 2016）。在实际应用中，为了在解决问题时获得更全面、合理的方案，人们通常同时从多视图和多层次两个维度解决问题，而不是仅仅从多视图或多层次中解决（Bargiela\
  \ & Pedrycz, 2008; Yao, 2009; Yao, 2016）。\n\n我们以医学诊断为例，来说明结合多视图和多层次的重要性。在医学诊断中，假设医生需要诊断患者是否患有流感或肺炎。为了获得准确的诊断结论，患者通常需要接受几种检查，例如：常规检查（包括对患者体温、咳嗽和喉咙痛的评估）、生化检查（包括常规血检、C\
  \ 反应蛋白检测和肺炎原体肺炎检测）以及影像学检查（包括 X 光）。\n\n现有的关于粒化结构的研究主要分别关注多层次粒化结构和多视图粒化结构，而没有将多层次与多视图结构结合。基于多层次的粒化结构由一个线性有序的层次族组成，它只提供了具有多个层次的单一视图。基于多视图的粒化结构提供了多个视图，但每个视图只包含一个层次。为了更全面地理解和描述问题，从而更有效、合理地解决问题，在给定全体的情况下，我们将划分（partition）作为粒化方法。通过将多层次粒化结构与多视图粒化结构结合，我们提出了划分序积空间（partition\
  \ order product space）。\n\n\n\n由 Yao 提出的三元决策理论（Yao, 2011; Yao, 2010)）可以从粒度计算的视角进行动机化、解释和实现（Bargiela\
  \ & Pedrycz, 2008; Fang, Gao, & Yao, 2020; Pedrycz, Skowron, & Kreinovich, 2008;\
  \ Yao, 2013），它与概念学习（Zhi, Qi, Qian, & Wei, 2019）、决策制定（Li, Zhang, Zhou, & Huang, 2017;\
  \ Liang & Liu, 2016; Luo, Hu, & Qin, 2020; Yao, 2019; Zhang, Li, & Liang, 2020）、分类（Dai,\
  \ Zhou, Li, & Liu, 2019; Liu, Li, & Liang, 2014; Savchenko, 2016; Yue, Chen, Miao,\
  \ & Fujita, 2020; Zhang, Xia, & Wang, 2017）以及聚类（Wang & Yao, 2018; Xie, Xia, Wang,\
  \ & Gao, 2023）相关。在实际应用中，该理论已成功应用于许多领域，例如图像处理（Li, Zhang, Huang, & Zhou, 2016; Savchenko,\
  \ 2019）、文本处理（Zhang, 2019; Behzadidoost, Mahan, & Izadkhah, 2024）、推荐系统（Zhang & Min,\
  \ 2016）、数据挖掘和知识获取（Chen, Li, Min, Liu, & Tsang, 2017; Min, Zhang, Zhai, & Shen, 2020;\
  \ Wang, Shi, Yang, & Mi, 2019; Wei, Liu, Qi, & Qian, 2020; Xu, Miao, Zhang, & Zhang,\
  \ 2017)）。与传统的二元决策不同，三元决策当信息不足或证据不足以在特定粒度支持接受或拒绝时，三元决策允许我们将决策推迟到下一个粒度。从粒度计算的角度来看，主要有四种三元决策：-\
  \ 经典三元决策（Yao, 2011; Yao, 2010)）\n- 序贯三元决策（Yao, 2013; Zhi, Qi, Qian, & Wei, 2019）；Li,\
  \ Zhang, Zhou, & Huang, 2017; Liang & Liu, 2016; Luo, Hu, & Qin, 2020; Yao, 2019;\
  \ Zhang, Li, & Liang, 2020）\n- 分类（Dai, Zhou, Li, & Liu, 2019; Liu, Li, & Liang,\
  \ 2014; Savchenko, 2016; Yue, Chen, Miao, & Fujita, 2020; Zhang, Xia, & Wang, 2017）\n\
  - 聚类（Wang & Yao, 2018; Xie, Xia, Wang, & Gao, 2023）\n\n### 划分积空间\n\n划分划分积空间从多视角和多粒度上解决问题（Xu,\
  \ 2019），同时遵循多视角和多粒度的原则。基于划分划分空间，首先，划分空间通过对域进行划分来定义一个粒度；其次，使用嵌套划分序列来定义层次，以表示一个具有线性关系的视角；最后，给定多个视角确定多个线性关系，基于这些关系的笛卡尔积提出了划分划分空间，它是一个格。格中的每个节点都是一个问题的解决方案，即一组单层级视角。重要符号的描述见表\
  \ 1。\n\n#### 表 1. 符号与描述\n\n| 符号 | 描述 |\n| --- | --- |\n| U | 域 |\n| X | 目标概念 |\n\
  | x | 对象 |\n| POS(X) | X 的正区域 |\n| NEG(X) | X 的负区域 |\n| BND(X) | X 的边界区域 |\n| ||\
  \ | x 的等价类 |\n| Pr(X\\|\\[x\\]) | x 属于 X 的条件概率 |\n| á,â | 阈值 |\n| IS= (U,AT=C∪D,V,f)\
  \ | 信息系统 |\n\n我们在第 2 节介绍了划分划分空间。在第 3 节中，我们提出了两种搜索类型：深度优先搜索算法和广度优先搜索算法，以获取划分空间的解。在第\
  \ 4 节中，结合深度优先、广度优先搜索以及乐观和悲观策略，我们提出了四种多视角序贯决策。第 5 节是结论。\n\n\n\n\n| ![Mathtype979-8-3693-1582-8.ch005.m02](img/ch005.m02.png)\
