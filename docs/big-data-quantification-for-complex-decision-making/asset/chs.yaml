  \ 是 `x` 相对于 `C[i]` 的等价类。\n\n嵌套属性序列决定了嵌套等价关系序列，基于此我们可以构造视图。在该视图中，属性的数量随层级而增加。从高级到低级，颗粒的质量从粗变精，颗粒的大小从大变小。因此，在较高的粒度上，可能有一个更抽象、紧凑的表示，导致决策过程更快；另一方面，在较低的粒度上，可能会有一个更具体的详尽表示，导致决策过程较慢但结果更准确。\n\
  \n**定理 2** (Yang, Li, & Luo, 2017)。给定 ![Mathtype979-8-3693-1582-8.ch005.m20](img/ch005.m20.png)\
