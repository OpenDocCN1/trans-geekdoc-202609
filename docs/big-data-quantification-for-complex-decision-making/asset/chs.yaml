  \nLucio Grandinetti（意大利卡拉布里亚大学），Ornella Pisacane（意大利马尔凯理工大学）以及 Mehdi Sheikhalishahi（意大利卡拉布里亚大学）\n\
  \n\n*云计算的通信基础设施*\n\nHussein T. Mouftah（加拿大渥太华大学）以及 Burak Kantarci（加拿大渥太华大学）\n\n\n\
