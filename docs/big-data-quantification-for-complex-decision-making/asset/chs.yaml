  \ 则 `a`=[0,0],[1,1]。同样，对于 0≤`P(a)`≤1，`P(a)` 得分越高，`IVq-ROF` 数越高。得分函数用于对模糊数排序。\n\n\
  - **定义 4**：`IVq-ROF` 数 (`a[1],a[2],...,a[n]`) 可以通过几何平均聚合算子进行组合。该算子用于聚合专家意见。\n\n\n\
  \n\n在本部分学习中，展示了所提议的新模型在汽车子行业某公司中的应用。该特定企业成立于 1988 年，是该行业的先驱之一。除了汽车领域，其在船舶-机车和固定式发动机组中还拥有超过\
  \ 1000 种产品。表 1 显示了所提方法的伪代码。\n\n### 表 1. 伪代码\n\n```\n| Inputs: The expert group,\
  \ criteria, alternatives, the judgments of expert group, the value of q |\n| ---\
  \ |\n| -begin |\n| --- |\n| -Start algorithm and data entries |\n| for each expert,\
  \ collect the criteria weights judgments |\n| for E1 to E4 |\n| - Collect the judgment\
  \ of each criteria weight by using linguistic terms |\n| - Transform to q-ROF numbers\
  \ from linguistic terms |\n| End |\n| Aggregate the judgments of experts |\n| for\
  \ each expert, collect the criteria based alternative judgments |\n| for E1 to E4\
  \ |\n| - Collect the judgment of each criteria based alternative by using linguistic\
  \ terms |\n| - Transform to q-ROF numbers from linguistic terms |\n| End |\n| Aggregate\
  \ the judgments of experts |\n| Calculate the criteria based alternative |\n| Apply\
  \ the steps of MAIRCA based on IVqROF number |\n| Rank the alternative suppliers\
  \ and find the best supplier |\n| End |\n```\n\n在应用的第一阶段，根据 4 位专家（E1, E2, E3, E4）的经验确定了\
  \ 4 个主标准下的 18 个子准则和 5 种替代方案（A1, A2…A5）。通过全面的文献研究和专家意见获得的数据如表 2 所示。专家 1 是总协调员，在该业务领域拥有超过\
  \ 20 年的经验，并访问了确定的替代方案供应商。专家 2 是采购经理，在该业务领域工作了 8 年。专家 3 是采购工程师，目前负责业务中的采购活动；专家 4\
  \ 是库存经理，在该行业工作了 15 年，对供应的产品具有丰富的经验和深厚的技术知识。\n\n### 表 2. 智能供应商选择准则\n\n| Main criteria\
  \  || Subcriteria |\n| --- | --- |\n| Economical (C1) || Price (C11) |\n| Quality\
  \ (C12) | |\n| Delivery time (C13) | |\n| Technology capacity (C14) | |\n| Flexibility\
  \ (C15) | |\n| Environmental (C2) || Environment pollution control (C21) |\n| Environment\
  \ management system (C22) | |\n| Eco-design recycling (C23) | |\n| Green point (C24)\
  \ | |\n| Social (C3) || Occupational health and safety (C31) |\n| Staff development\
  \ (C32) | |\n| Local community effect (C33) | |\n| Information disclosure (C34)\
  \ | |\n| Smart (C4) || Industry 4.0 staff (C41) |\n| Digital customer relations\
  \ (C42) | |\n| Smart maintenance (C43) | |\n| Industry 4.0 utilization (C44) | |\n\
  | Prediction ability (C45) | |\n\n经济性标准下的价格准则属于最小化类型，用于评估所供产品的高昂成本。质量准则是极大化类型，用于处理供应商的质量标准。交货时间是最小化类型，用于评估供应商根据其地理位置和物流管理所提供的交货时间长度。技术能力是极大化类型，用于处理供应商的发展节奏和未来的生产能力。灵活性准则是极大化类型，用于处理供应商的交货期长短、解决争议的速度以及适应能力。\n\
  \n环境污染控制和环境管理系统属于环境主标准，是极大化类型准则，用于评估供应商在环境管理方面的文档丰富程度，以及他们所实施的保护环境免受制造废物影响的程序。生态设计回收准则是极大化类型，用于评估生产废物的回收程度。绿色积分是极大化类型，用于评估供应商如何利用包装废物。\n\
  \n职业健康与安全准则属于社会主标准，是极大化类型，用于评估供应商的职业健康与安全文档及程序。员工发展准则是极大化类型，用于评估供应商的人员培训。当地社区影响是极大化类型，被用于评估供应商对其所在地社区的回报。信息披露是最小化类型，用于评估供应商共享和传播现有数据的比率。\n\
  \n智能标准下的准则是为了智能供应商选择确定的。工业 4.0 员工和工业 4.0 利用准则是极大化类型准则，用于评估供应商内部单位和人员对智能技术的集成率。数字客户关系准则是极大化类型，用于评估供应商目前的设施以及使用户通过数字环境快速通信需求的速度。智能维护准则是极大化类型，用于评估供应商利用人工智能和物联网等智能技术维护其提供产品的速率、检测故障、维修或预防故障的能力。预测能力准则是极大化类型，用于处理供应商通过智能技术分析历史客户数据来预测客户需求的能力。\n\
  \n准则权重是根据从 4 位专家收集的语言数据，使用区间值 q-ROF 数计算的。在研究中，接受 `q = 3`。在第一阶段，根据语言数据接收了针对 4 个主标准和\
