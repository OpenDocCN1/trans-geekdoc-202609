  \ (完备性) `A→B` 在其中可接受的，当且仅当 `A→B` 可以通过对 `i/ch010.m689.png` 应用自反性、扩张性和组合得到。\n* 2.\
  \ (完备性) 对于任何 `i/ch010.m690.png`，无法通过对 `i/ch010.m691.png` 应用自反性、扩张性和组合得到。\n* 3. (最优性)\
  \ `i/ch010.m692.png` 是最优的，即对于任何可接受蕴含的完全集 `L`，`i/ch010.m693.png`\n\n证明。参考定理 4.3 的证明。\n\
  \n与必要蕴含类似，基于可接受蕴含的推理系统可以基于 `i/ch010.m694.png` 以及推理规则自反性、扩张性和组合来构建。\n\n#### 示例 4.9（延续示例\
