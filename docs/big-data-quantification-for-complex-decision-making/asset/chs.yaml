  \n## 第 6 章\n\n## 春卯理工大学\n\n### 摘要\n在这一章中，我们使用 `Q-learning` 增强了三值决策（3WD）的三划分执行结果（TAO）模型。该方法通过实际示例确定了能够实现预期结果并保持稳定的动作集。\n\
  \n## 引言\n三值决策（3WD）模型符合人类认知，并为决策提供了一个细致的框架（Yao, Y. Y., 2010）。该方法将决策分为三类：接受、不承诺和拒绝，分别来源于粗集近似的正区域、边界和负区域（Yao,\
  \ Y. Y., 2012）。\n\n随着时间的推移，`3WD` 的范围已扩展到其最初的粗集基础，演变为更广泛的概念框架（Yang, X., 2017）。这种三元思维方法通过将复杂问题分为三个相互关联的组件来简化问题，减少了认知和信息过载（Yao,\
  \ Y. Y., 2019）。在其演变发展过程中，产生了大量的研究成果（Yao, 2011）。\n\n这种扩展解释的一个显著例子是三划分执行（TAO）模型，其中`三划分`指的是将全集分为三部分，`执行`是选择并提供满足结果且保持在中间水平的过程。一方面，根据所需的结果，决策者为划分设计了相应的策略以实现预期结果；另一方面，选择策略以保持结果处于中间水平。\n\
