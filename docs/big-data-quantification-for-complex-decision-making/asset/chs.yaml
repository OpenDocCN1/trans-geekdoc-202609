  \n## 第 3 章\n\n* 张涛\n  ![Orcid 图像 https://orcid.org/0000-0003-0450-724X](https://orcid.org/0000-0003-0450-724X)]\n\
  \  中国，燕山大学\n* 雪再法\n  中国，燕山大学\n* 霍泽胜\n  中国，燕山大学\n\n### 摘要\n\n语音障碍是帕金森病（PD）的早期症状症状之一。大多数现有的\
  \ PD 严重程度预测方法基于基准特征，通常选择高相关性特征进行降维。为了进一步提高预测性能，分别从特征选择和特征变换的角度提出了 `LDFSF` 和 `GWT-RF-Att`\
  \ 方法。`LDFSF` 方法利用基于 `SOM` 的动态特征选择策略来选择高相关性、低冗余和高互补性的特征。`GWT-RF-Att` 方法使用图小波变换提取更有效的特征集，并利用注意力机制通过随机森林来改进预测。在帕金森数据集上的结果显示，两种方法优于现有方法。\n\
  \n## 引言\n\n帕金森病（PD）是一种常见的退行性系统疾病，特征是震颤、动作缓慢、姿态平衡等症状。PD 还会伴有语音障碍等症状（Zhang 等，2022）。幸运的是，语音障碍是较早的症状之一（Zhang\
  \ 等，2023）。通过分析语音特征，可以使用机器学习来评估帕金森病患者的严重程度。\n\n统一帕金森评分量表（UPDRS）是一种国际认可的评估 PD 严重程度的方法。它由两个部分组成：运动\
  \ UPDRS 和总分 UPDRS。在过去的几十年里，简单线性回归 (`LR`）、非线性回归、k-近邻 (`KNN`) 和支持向量回归 (`SVR`) 是是常用的传统方法。然而，这些模型可能无法达到理想的准确率。\n\
  \n近年来，机器学习和神经网络方法变得流行。`Mayo & Frank` (2017) 应用了贝叶斯回归及其改进版本来提高预测。神经网络，如前馈神经网络和自适应网络模糊系统\
  \ (`ANFIS`) (Nilashi 等，2017)，也由于其处理非线性关系的能力而被采用。然而，神经网络需要大型数据集和精细的参数调优，并且可能容易过拟合且缺乏泛化性。\n\
  \n为了增强 PD 预测模型的泛化能力，Tunc 等 (2020) 提出了一种基于决策树 (`DT`) 的特征选择和极端梯度提升 (`XGBoost`) 结合方法来预测\
  \ UPDRS 分。Despotovic 等 (2020) 使用自动相关性确定 (`ARD`) 方法对语音特征权重排序。在 Tsanas 等 (2021) 的研究中，使用随机森林\
  \ (`RF`)、`SVR` 和 `XGBoost` 来评估 PD 严重程度，`RF` 表现出卓越的预测性能。发现 `RF` 具有更高的有效性、稳定性和鲁棒性（Dong\
  \ 等，2021），使其成为预测 UPDRS 分数的合适选择。此外，为 `RF` 选择不同的输入特征会影响模型的预测性能。\n\n\n\n\n\n为了解决上述两个问题，本章提出了两种解决帕金森病（PD）研究中上述问题的方法。首先，引入了局部动态特征选择融合（`LDFSF`）方法，用于\
  \ PD 病情预测任务中基于相关性、冗余性和互补性的特征选择。该方法引入了最大信息系数（`MIC`）作为特征相关性的有效测量(Reshef et al., 2011)。为了降低计算复杂度，该方法利用自组织映射（`SOM`）(Nilashi\
  \ et al., 2019)聚类来选择每个簇内的特征。该方法还设计了一种基于聚类的动态特征选择（`DFS`）策略，可以动态更新候选特征与所选特征子之间的重要性。所选特征被输入随机森林模型以预测患者的疾病严重程度。`LDFSF`方法的优势在于，基于相关性、冗余性和互补性选择的特征子更具通用性。在帕金森病监测数据集（`PTDS`）上进行了实验评估，将提出的`LDFSF`方法与传统的`FS`方法以及现有文献进行了比较。结果表明，`LDFSF`方法能够有效地选择较小的特征子，在与合适的回归器结合时具有优越的预测性能。其次，本章提出了`GWT-RF-Att`方法，该方法结合了图波变换（`GWT`）与注意力加权随机森林，能够提取更有效的特征表示并获得更好的\
  \ PD 病情预测结果。基于 PD 语音特征，`GWT-RF-Att`方法通过`GWT`提取有效的频率特征，并使用注意力改进随机森林模型自适应地选择随机森林中性能更好的决策树模型进行预测，从而提高预测准确性。因此，`GWT-RF-Att`方法的优势在于获得了更多与目标值相关的特征，并进一步提高了`RF`在预测\
  \ PD 病情程度方面的性能。\n\n本章的主要贡献如下：\n\n* (1) 从特征选择和特征转换的角度，本章提出了`LDFSF`和`GWT-RF-Att`方法，优化患者语音特征以获得更好的\
  \ PD 病情预测性能。\n* (2) `LDFSF`方法不仅考虑了特征与目标值之间的相关性，还设计了基于聚类的动态特征选择方法来分析特征间的冗余性以及特征与特征集之间的互补性。\n\
  * (3) `GWT-RF-Att`方法通过`GWT`转换基准特征以获取与目标值更相关的特征，并通过在随机森林引入注意力机制提高了预测性能。\n* (4) `PTDS`数据集上的实验结果显示，与现有方法相比，提出的`LDFSF`和`GWT-RF-Att`方法在\
  \ PD 病情预测上获得了优性能，从而验证了从特征选择和特征转换角度优化患者特征的有效性。\n\n## 相关工作\n\n### 特征选择\n\n学者们针对 PD\
  \ 病情预测任务提出了多种特征选择（`FS`）方法。Tunc et al. (2020)利用`Boruta`算法通过探索所有相关特征之间的关系来建立特征显著性，并对所选特征进行了分析。他们得出结论：声带振动模式是评估\
  \ PD 病情的关键指标。Tsanas et al. (2021)使用四种`FS`算法对特征进行评估以获取重要特征，并测试了三个回归模型，即`SVR`、`XGBoost`和`RF`。结果显示`RF`的预测性能始终优于`SVR`和`XGBoost`，验证了其在\
  \ PD 病情预测中的优越性。Despotovic et al. (2020)使用`ARD`方法对 PD 语音特征权重进行排序，并选择了五个与目标值相关性较高的特征。高斯过程可以将多变量高斯分布扩展到无限多个随机变量，已成功用于高维数据的隐变量建模。通过将`ARD`与高斯过程结合，减少了\
  \ PD 语音特征的数量并提高了预测准确性。\n\n上述基于相关性和冗余性的`FS`方法分析了 PD 语音特征之间的内在关系，并结合合适的分类器和回归器获得了良好的预测模型。然而，仅使用这两种属性进行`FS`分析是不够的。这是因为一个分类能力较低的单个特征可能与其他特征具有很高的依赖性，即特征之间存在互补性，将它们加入特征子中可能有助于增强模型的识别能力(Chen\
  \ et al., 2021)）。因此，为了选择有效特征并提高预测模型的准确性，有同时分析特征的相关性、冗余性和互补性。\n\n## 图波变换\n\n图波变换是一种利用数据构建加权路径图的方法，该图由顶点和边权重组成。这些边权重代表连接顶点之间的相似性信息。通过将已知数据转换为图表示，`GWT`增强了输入信息(Dong\
  \ et al., 2021)。在应用`GWT`之前，波变换（`WT`）是信号处理中广泛使用的多尺度分析方法。它将原始序列分解为不同频率尺度的子序列，从信号中提取重要信息。通过`WT`分解获得的波系数提供了关于序列频率变化的详细信息。在\
  \ PD 病理信号背景下，`WT`通常被用于提取时频特征。利用这些特征，可以开发 PD 预测模型并提高准确性(Chakraborty & Nandy, 2020)。\n\
  \n此外，`WT`还可以通过将序列分解为不同的系数向量来提取序列信息。通过分析这些系数向量与目标值之间的关系，可以确定不同序列对目标值的影响。因此，`WT`可以从\
  \ PD 特征向量中提取频率特征。Lai et al. (2016 提出了一种使用图波变换的方法，涉及对序列排序、提取序列信息并生成新的特征向量。随后验证了波变换提取的特征的有效性。\n\
  \n为了有效表示 PD 患者的病理信号，本章采用了`GWT`方法从 PD 特征向量中提取频率特征。然而，PD 特征向量是高维数据，特征的不同排列代表了不同的频率信息。为了应对这一挑战，本章考虑了不同的特征数组。\n\
  \n## 预测方法：机器学习与深度学习\n\n\n\n\n\n机器学习（ML）算法已广泛应用于帕金森病（PD）的诊断，为该疾病提供了可靠且早期的检测(Senturk,\
  \ 2020)）。Tsanas 等人 (2010) 比较了 `LR` 方法与分类回归树（`CART`）在将 PD 语音特征映射到 UPDRS 值方面的性能。`CART`\
  \ 的表现优于线性预测器，表明语音特征的线性组合对 UPDRS 预测并不有效。从那时起，研究人员提出了更有效的预测模型。Ji 等人 (2018) 和 Yoon\
  \ & Li (2019) 将迁移学习与 ML 算法结合，以考虑 PD 患者之间疾病趋势的差异。Jain & Shetty (2016) 发现，与多元 `LR`\
  \ 和回归树方法相比，`KNN` 达到了最低误差。Nilashi 等人 (2020) 利用经过处理的 PD 语音特征使用 `SVR`，两者在所比较的方法中均达到了最佳性能。`XGBoost`\
  \ 和 `RF` 也被用于 PD 严重程度的评估。Tunc 等人 (2020) 利用 `Boruta` 方法选择具有信息性的特征并将其输入 `XGBoost`，得到了最低的平均绝对误差。`RF`\
  \ 以其集成学习投票机制而闻名，在生物医学信息学中有广泛应用(Xu & Pan, 2020)。Sharma 等人 (2019) 和 Tsanas 等人 (2021)\
  \ 将 `RF` 与其提出的模型结合，均实现了改进的预测结果，这凸显了 `RF` 在预测 PD 严重程度方面的可靠性及其巨大潜力。\n\n除了 ML 技术外，深度学习（DL）因其强大的自动特征提取能力而受到了广泛关注(Zhang\
  \ 等., 2022)。在 PD 分类任务中，Oung 等人 (2018) 使用经验小波变换和经验包变换分析了音频信号。他们采用 `KNN`、`probabilistic\
  \ neural network` 和 `extreme learning machine` 作为分类器，实现了高分类准确率。Kadam & Jadhav (2019)\
  \ 提出了一种基于稀疏自编码器的特征集成学习方法，通过与各种分类方法的比较，验证了其在 PD 研究中的有效性和实用价值。对于预测 PD 患者的症状严重程度，Xiang\
  \ 等人 (2016) 设计了一个三层前馈神经网络并利用高斯混合模型进行非线性预测，与 `KNN` 和回归树相比，该方法的结果更平滑。Nilashi 等人 (2019)\
  \ 开发了一种结合了奇异值分解和 `ANFIS` 的方法来预测 PD 患者的疾病进展。该方法改进了 PD 诊断系统的复杂性和准确性。Nilashi 等人 (2020)\
  \ 构建了一个基于深度信念网络的预测模型，并使用 `SVR` 整合预测结果，进一步提高了 PD 严重程度预测的准确性。然而，DL 模型需要仔细调优超参数以避免欠拟合和过拟合(Shahid\
  \ & Singh, 2020)。此外，DL 模型是数据驱动的，并以消耗数据著称，需要更大的数据集来展示其卓越性能(Nilashi 等., 2020)。相比之下，帕金森病远程监测数据集较小，限制了\
  \ DL 方法在 PD 严重程度预测任务中的常用性。然而，随着 PD 语音数据集的不断扩大，DL 方法仍然具有巨大的潜力。\n\n## 提出的方法\n\n##\
  \ 问题定义\n本章的目标是预测帕金森病的严重程度。设 PD 数据集为 `D={X,Y}`，其中维度为 `M×1` 的 `Y` 代表 `M` 个样本的运动-UPDRS\
  \ 或总-UPDRS PD 严重程度评分。维度为 `M×N` 的 `X` 代表所有样本的特征。维度为 `N×1` 的 `x[m]` 代表第 `m` 个样本的 `N`\
  \ 维特征向量。本章的目标之一是语音特征向量 `X` 预测帕金森患者的严重程度 `Y`。由于语音特征与目标值（即运动-UPDRS 或总-UPDRS）之间不存在简单的线性关系，本实验采用非线性函数\
  \ `f()` 来捕捉它们之间的复杂关系。将真实目标值表示为 `Y`，相应的预测值表示为 `Y’`，则 PD 症状严重程度估计可以公式化为\n\n```\nY’=\
  \ f(X,Y).\n```\n\n## LDFSF 模型\n在本章中，提出的 `LDFSF` 方法由三个部分组成：`MIC` 相关性分析、基于 `SOM` 的聚类策略以及回归模型。详细过程见图\
  \ 1。\n\n### 基于相关性的特征选择\n`MIC` 不限于特定的函数类型，可以捕捉线性、非线性和非函数关系。其中，函数关系包括线性、抛物线、指数关系，而各种函数的叠加属于非函数关系。因此，`MIC`\
  \ 是评估变量关系的有效方法。考虑到帕金森语音数据的非线性特征，`MIC` 可有效衡量语音特征与目标值之间的关系。\n\n| 图 1 局部动态特征选择方法示意图\
  \ |\n| --- |\n| ![979-8-3693-1582-8.ch003.xhtml#f01](img/ch003.f01) |\n\nPD 数据集可以表示为\
  \ `D={X,Y}`，其中 `X` 和 `Y` 代表特征，`N` 和 `M` 分别代表特征维度和样本数。`Y = {motor-UPDRS, total-UPDRS}`\
  \ 表示目标值。首先，本章计算特征与目标值之间的 `MIC` 分。`MIC` 的核心思想是划分特征变量 `f[i]` 与目标值 `Y` 的散点图，然后利用互信息计算每个网格中变量\
  \ `f[i]` 与目标值 `Y` 的相关性。\n\n**第一步：网格划分**。假设 PD 语音特征与目标值之间的所有数据是一个有限的序对 ![979-8-3693-1582-8.ch003.xhtml#m04](img/ch003.m04)。`MIC`\
  \ 的目标是通过将特征 `f` 的取值范围划分为 `a` 段，目标值的取值范围划分为 `b` 段来识别所有关系。`a×b` 网格定义为 `G`。变量空间的划分对\
  \ `MIC` 结果有显著影响，从而影响特征与目标值的相关性。\n\n**第二步：网格划分后计算互信息**。`MIC` 利用互信息计算每个网格内变量的相关性。互信息\
  \ `MI(f,y)` 表示特定网格内特征变量 `f` 与目标值 `y` 的关联程度。\n\n\n\n\n\n变量 `f` 和 `y` 之间的联合概率分布函数记为\
  \ `p(f[k],y[k])`，通过落入特定网格的样本比例来近似。`f` 和 `y` 的边缘概率分布函数分别记为 `p(f[k])` 和 `p(y[k])`。\n\
  \n### 步骤 3：计算最大互信息 (MI)\n通过改变网格 `G` 的划分数量 `a` 和 `b`，改变网格的位置并重复计算互信息，得到最大 MI。不同划分下获得的\
  \ `MIC` 值记为 `MI’`，代表网格 `G` 的互信息值。给定网格 `G` 下 `D’` 的最大互信息公式为：\n\n`MI’(D’,a,b) = max\
  \ MI(D’|G)`\n\n其中 `D’|G` 代表给定网格 `G` 的数据分布 `D’`。\n\n### 步骤 4：归一化\n为了比较不同划分下的 `MI’`，需要对其进行归一化，以获得不同划分下的归一化互信息值矩阵\
  \ `C(D’)[a,b]`：\n\n![Mathtype979-8-3693-1582-8.ch003.m06](img/ch003.m06) (4)\n\n\
  ### 步骤 5：MIC 结果\n`MIC` 的结果定义为特征变量 `f` 与目标值 `y` 之间获得的最大信息值：\n\n![Mathtype979-8-3693-1582-8.ch003.m07](img/ch003.m07)\
  \ (5)\n\n其中 `B(M)` 指网格 `G` 内的划分上限。`MIC(D’)` 的值范围为 `[0,1]`。`MIC` 值越大，`f` 与 `y` 的相关性越强，即\
  \ `f` 是强相关；`MIC` 值越小表示 `f` 与 `y` 的相关性越弱，`f` 可能被移除。当 `MIC=0` 时，`f` 无关应被移除。\n\n# 基于冗余性和互补性的动态特征选择\n\
  特征选择方法同时考虑相关性和冗余性以选择最优特征子集。但在某些情况下，冗余特征之间的相互作用会对模型产生不利影响。本文提出了一种选择最优特征子集的方法：首先，使用\
  \ `SOM` 对高相关性的 `PD` 特征进行聚类，然后根据相关性、冗余性和互补性从候选特征中动态选择特征形成最终特征子集。其中，`SOM` 聚类可以将候选特征分为若干簇，`DFS`\
  \ 选择每个簇的特征可以极大减少特征数量并降低模型复杂度。\n\n## 自组织映射网络聚类\n为了更好地近似 `PD` 多变量特征之间复杂的相关性（Chen et\
  \ al., 2021），本文使用 `SOM` 对与目标值相关的特征进行聚类。`SOM` 网络包括输入层和竞争层。输入层表示特征向量，竞争层由 `dim[x]×dim[y]`\
  \ 个神经元组成。特征向量与神经元之间的相关性通过距离确定，神经元通过竞争学习进行激活。最佳匹配单元（BMU）是时刻被激活的神经元。`BMU` 邻域内神经元的权重根据学习率\
  \ `η(t,d)` 进行更新。该过程更新胜利神经元及其邻域的权重，使其靠近输入向量，从而将高维 `PD` 特征映射到低维空间。\n\n获取输出层每个神经元的权重向量\
  \ `W` 后，将高维特征映射到输出层的平面上。通过确定特征向量与输出层每个神经元之间的最短距离来进行聚类。在该方法中，输入 `PD` 特征数据的相似性通过 `SOM`\
  \ 聚类中的邻域映射来实现，同时保持了数据的拓扑结构。\n\n### 算法 1. 基于 SOM 的 PD 特征聚类\n\n| 输入：特征向量 ![Mathtype979-8-3693-1582-8.ch003.m08](img/ch003.m08.png)，竞争层神经元的初始权重向量\
  \ `W`，输出网格大小 `dim[x]×dim[y]`，最大迭代次数 `T` 和学习率 `ç(t,d)`。\n| 输出：竞争层神经元的权重向量 `W`。\n\
  | 过程：\n| 初始化 `W` 和 `ç`，并归一化特征向量 `X’` |\n| 对于时间步 `t=1,…T` |\n| 从 `X’` 中选择输入向量 `fi`\
  \ |\n| `dis=0` |\n| 对于神经元 `v=1,…dim[x]×dim[y]` |\n| 若 `dis=0` 则 |\n| 更新 `fi` 与 `v`\
  \ 的距离： |\n| `d(fi–Wv) = ||fi–Wv|` |\n| `dis = d(fi–Wv)` |\n| `BMU: u=v` |\n| 否则\
  \ |\n| 若 `d(fi–Wv)<dis` 则 |\n| `dis = d(fi–Wv)` |\n| 更新 BMU: `u=v` |\n| 结束循环 |\n\
  | 对于神经元 `v=1,…dim[x]×dim[y]` |\n| 更新权重向量：![Mathtype979-8-3693-1582-8.ch003.m09](img/ch003.m09.png)\
  \ |\n| 结束循环 |\n| 结束循环 |\n| --- |\n\n## 动态特征选择\n本节中的动态特征选择（DFS）策略既考虑了特征与目标值之间的相关性，也考虑了特征冗余对候选特征重要性的影响。它可以选取相关性高、冗余性低且具有高互补性的特征。图\
  \ 2 阐了基于 `SOM` 聚类的动态特征选择过程。\n\n| 图 2. 基于 SOM 聚类的动态特征选择过程 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch003.f02](img/ch003.f02.png)\
  \ |\n| --- |\n\n\n\n\n\n在当前的聚类方法中，采用了动态特征选择策略。该策略利用公式 (6) 和 (7) 计算每个候选特征 `f` 与已选特征集\
  \ `F[s]` 之间的互补性 `C[f]`。然后，根据 `C[f]` 值对候选特征集 `F[c]` 进行降序排序。将 `C[f]` 值最高的特征 `f` 添加到已选特征子集\
  \ `F[s]` 中，创建一个集合 ![Mathtype979-8-3693-1582-8.ch003.m12](img/ch003.m12.png)。将 `F[s]`\
  \ 和 ![Mathtype979-8-3693-1582-8.ch003.m13](img/ch003.m13.png) 同时输入 `RF` 回归器，各自得到的平均绝对误差\
  \ `MAE(F[s])` 分别表示为 `MAE(F[s])` 和 ![Mathtype979-8-3693-1582-8.ch003.m14](img/ch003.m14.png)。如果\
  \ ![Mathtype979-8-3693-1582-8.ch003.m15](img/ch003.m15.png)，则将特征 `f` 添加到已选特征子集 `F[s]`\
  \ 中，并从候选特征集 `F[c]` 中移除。然而，如果 ![Mathtype979-8-3693-1582-8.ch003.m16](img/ch003.m16.png)，则将\
  \ `F[c]` 中的第二个特征添加到 `F[s]` 以确定误差。此过程持续进行直到 `F[c]` 为空。此时，下一个聚类中的所有特征被视为一个新的候选子集 ![Mathtype979-8-3693-1582-8.ch003.m17](img/ch003.m17.png)，并从\
  \ ![Mathtype979-8-3693-1582-8.ch003.m18](img/ch003.m18.png) 中选择与已选特征子集互补性最高的特征并将其添加到\
  \ `F[s]`。重复上述过程，直到所有候选特征都经过测试，或者 `F[s]` 中的特征数量达到实验设定的预定上限。在这种情况下，`F[s]` 成为最终输出特征子集。\n\
  \n## GWT-RF-Att 模型\n\n本节详细描述了所提 GWT-RF-Att 模型中每个模块的功能。图 3 展示了该方法的工作流。所提出的 GWT-RF-Att\
  \ 方法计算所有 PD 样本之间的相似性，转换相似样本中的特征以获取更高效的信息，最后使用改进的 `RF` 模型来预测 PD 的严重程度。为了更具体地阐述本章介绍的\
  \ GWT-RF-Att 方法流程，我们对每个模块进行了适当扩展，如图 4 所示。\n\n| 图 3. 用于运动和总 UPDRS 预测的 GWT-RF-Att\
  \ 方法工作流 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch003.f03](img/ch003.f03.png) |\n\
