  \ || 32 |\n| FC 层单元 2 || 1 || 1 || 1 || 1 |\n| Epoch || 500 || 500 || 500 || 1000\
  \ |\n| Batch_size || 16 || 32 || 16 || 32 |\n\n# 实验结果\n\n## LDFSF 模型的实验结果\n\n####\
  \ 选取特征集的结果\n\n在本章中，采用了提出的 `LDFSF` 方法来解决与帕金森病（PD）诊断相关的回归问题。通过选择特征子集并将其与合适的回归器相结合，`LDFSF`\
  \ 框架有效地实现了准确的 PD 严重程度预测。`RF` 方法在公共数据集 `PTDS`上的有效性已得到证实。因此，本章将 `LDFSF` 框架与 `RF` 结合，以验证所提方法的可行性和可靠性。\n\
  \n对于 PD 严重程度预测，`LDFSF` 方法最初使用 `MIC` 评估特征与目标值之间的相关性，如图 7 所示。与目标值（`UPDRS`）相关性低的特征会降低分类和回归模型的性能。为了解决这个问题，本章将所有特征的\
  \ `MIC(f,y)` 值按降序排列，并消除相关性最低 20% 的特征，保留前 80% 的特征。随后，采用 `SOM` 方法对所选特征进行聚类。`SOM` 对特征的聚类结果如表\
  \ 4 所示，揭了每个簇内部的高相似性以及可能存在的冗余特征。\n\n| 图 7. 特征与目标值 UPDRS 之间的相关性 (MIC) |\n| --- |\n\
  | ![Figure979-8-3693-1582-8.ch003.f07](img/ch003.f07.png) |\n| --- |\n\n提出的动态特征选择过程将\
  \ `SOM` 聚类与 `RF` 结合，根据冗余和互补性导出最优特征子集。图 8 展示了验证集在动态特征选择过程中的准确率和 MAE 变化。使用相同 `PTDS`\
  \ 数据集的现有特征选择方法通常产生 8 个特征的最简单特征集。为了与最新文献对比，提出的 `DFS` 策略将 `PTDS` 数据集的选取特征数量限制为 8 个。如表\
  \ 4 和图 8 所示，当所选特征集达到 8 个时，`DFS` 策略在簇 3 停止运行。\n\n### 表 4. PD 回归任务中 SOM 的聚类结果\n\n\
  | 簇 || 特征集 |\n| --- | --- |\n| 1 || {Age, HNR, RPDE, DFA} |\n| --- | --- |\n| 2\
  \ || {Sex} |\n| 3 || {Jitter (Abs), Jitter (Abs), Jitter (Abs), Jitter (Abs)} |\n\
  | 4 || {PPE} |\n\n| 图 8. 子集的动态选择过程 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch003.f08](img/ch003.f08.png)\
  \ |\n| --- |\n| *(过程的每一步都向子集添加特征，◆ 表示添加到子集的特征将被移除。最终确定的特征子集为 {Age, HNR, RPDE, DFA})*\
  \ |\n\n## SOM 聚类的影响\n\n表 5 展示了提出的 `LDFSF` 模型在 `SOM` 聚类前后的性能，以及相应的时间消耗。该分析旨在突出 `SOM`\
  \ 聚类对预测的影响。\n\n如表 5 所示，两个数据集上的模型运行时间都减少了。这归因于同一簇内特征的高相似性以及簇之间的低相似性。对于预测结果，`SOM`\
  \ 聚类后的模型性能得到了提高，这与 Nilashi et al., 2019 和 Nilashi et al., 2020 的结果一致。由于他们测量语音信号的方式，某些冗余特征可能需要消除。然而，基于\
  \ `SOM` 聚类的动态特征选择方法不仅减少了计算成本，还有助于消除冗余特征，从而增强 PD 回归模型的性能。\n\n## 与现有方法的比较\n\n为了进一步验证提出的\
  \ `LDFSF` 框架及其结合 `RF` 进行预测的有效性，本节将 `LDFSF` 方法与传统的特征选择方法及近期文献结果进行了对比。\n\n\n\n\n\n\
  表 6 展示了传统特征选择（FS）方法与 `LDFSF` 方法对模型性能影响的对比。传统的 FS 方法，如 `ReliefF`、`mRMR` 和 `Boruta`\
  \ (Tunc et al., 2020)，根据特征与目标值的相关性以及特征之间的冗余性来选择特征。本章的 `LDFSF` 框架在此基础上增加了互补性，以探索特征之间的内在联系。为了验证结合相关性、冗余互补性进行特征选择的有效性，表\
  \ 6 比较了不同特征选择算法在相同回归器下对预测模型性能的影响。`RF` 在帕金森病（PD）回归预测中表现良好 (Tsanas et al., 2021)。因此，在表\
  \ 6 中，每种特征选择方法均与 `RF` 结合以比较 FS 方法的性能。此外，本节设置了相同数量的以比较所选特征子集的有效性。总而言，本节对不同特征选择方法提供了全面对比，突出了所提出的\
  \ `LDFSF` 框架结合 `RF` 进行预测的有效性。\n\n表 6. 所提方法与传统特征选择方法的结果对比\n\n| FS 方法 | RF 回归 | |\n\
  | --- | --- | --- |\n| Motor-UPDRS | Total-UPDRS | |\n| ReliefF | 1.80 | 2.12 |\n\
  | `mRMR` | 1.78 | 2.12 |\n| `Boruta` | 1.82 | 2.19 |\n| `LDFSF(ours)` | 1.62 | 1.99\
  \ |\n\n表 6 表明，所提出的 `LDFSF` 方法在 PD 严重进展预测任务中优于传统的 FS 算法。`ReliefF` 只考虑特征相关性，而 `mRMR`\
  \ 和 `Boruta` 专注于选择高相关性和低冗性的特征。然而，这些方法没有考虑候选特征与特征子集之间的互补性。相比之下，`LDFSF` 方法结合了相关性、冗余互补性进行特征选择，使得所提的预测模型在表\
  \ 6 中通过相同的回归器 `RF` 显示出优越性。具体而言，`LDFSF` 方法预测的 `motor-UPDRS` 的 `MAE` 分别比 `ReliefF`、`mRMR`\
  \ 和 `Boruta` 低了 10.00%、8.99% 和 10.99%，而预测的 `total-UPDRS` 的 `MAE` 分别比 `ReliefF`、`mRMR`\
  \ 和 `Boruta` 低了 6.13%、6.13% 和 9.13%。\n\n此外，表 7 比较了所提 `LDFSF` 方法与现有文献的结果。具体而言，本章比较了\
  \ Ji et al. (2018)、Yoon & Li (2019)、Tsanas et al. (2021) 以及 Despotovic et al. (2020)\
  \ 的结果与所提 `LDFSF` 方法在 `PTDS` 数据集上的结果。\n\n表 7 揭，与文献相比，`LDFSF` 模型取得了更好的预测结果。对于回归，Ji\
  \ et al. (2018) 和 Yoon & Li (2019) 利用迁移学习来解决 PD 患者数据有限的问题，但在衡量不同时间维度上的相似性方面面临挑战。Tsanas\
  \ et al. (2021) 采用了四种 FS 方法，但高斯模型在带宽限制可能会影响精度。Despotovic et al. (2020) 通过 `RF` 取得了更好的预测结果，但未考虑冗余互补性。在表\
  \ 7 中，`LDFSF` 方法在预测方面超过了整个语音数据的选择，这验证了所提方法的有效性。\n\n表 7. 所提方法与现有方法的性能对比\n\n| 方法 |\
  \ Motor-UPDRS | Total-UPDRS |\n| --- | --- | --- |\n| Ji et al. (2018)](#979-8-3693-1582-8.ch003.xhtml#r7)\
  \ | 3.00 | 4.60 |\n| Yoon & Li (2019)](#979-8-3693-1582-8.ch003.xhtml#r27) | 2.40\
  \ | 3.10 |\n| Tsanas et al. (2021)](#979-8-3693-1582-8.ch003.xhtml#r20) | 2.65 |\
  \ 3.17 |\n| Despotovic et al. (2020)](#979-8-3693-1582-8.ch003.xhtml#r3) | 2.11\
  \ | 3.3 |\n| LDFSF | 1.62 | 1.99 |\n\n### GWT 的有效性\n\n为了进一步了解 `GWT` 的有效性，计算了斯尔曼系数以量化特征与\
  \ `UPDRS` 的相关性。图 9 显示了基线特征与 `UPDRS` 的斯尔曼相关性。\n\n每个特征与 `UPDRS` 的相关强度由斯尔曼相关系数的绝对值表示。在图\
  \ 9 中，颜色越深，表示相关性越强。可以观察到，与基线特征相比，通过 `GWT` 提取的频率特征具有更多与 `UPDRS` 高相关的特征，这证实了这些频率特征的有效性。\n\
  \n| 图 9a. 聚类 1 中特征与 UPDRS 的斯尔曼相关系数 |\n| --- | --- |\n| ![Figure979-8-3693-1582-8.ch003.f09a](img/ch003.f09a.png)\
  \ |\n\n| 图 9b. 聚类 2 中特征与 UPDRS 的斯尔曼相关系数 |\n| --- | --- |\n| ![Figure979-8-3693-1582-8.ch003.f09b](img/ch003.f09b.png)\
  \ |\n\n| 图 9c. 聚类 3 中特征与 UPDRS 的斯尔曼相关系数 |\n| --- | --- |\n| ![Figure979-8-3693-1582-8.ch003.f09c](img/ch003.f09c.png)\
  \ |\n\n| 图 9d. 聚类 4 中特征与 UPDRS 的斯尔曼相关系数 |\n| --- | --- |\n| ![Figure979-8-3693-1582-8.ch003.f09d](img/ch003.f09d.png)\
  \ |\n\n### 聚类结果\n\n\n\n\n\n为了验证聚类结果，图 10 显示了每个聚类的 `MAE`。Tsanas 等人 (2021)指出，当帕金森病（PD）严重程度预测模型的\
  \ `MAE` 小于 5 分时，该预测模型在实践中将非常有用。图 10 中的柱状图表明，将帕金森病远程监测数据集划分为四类后，所提出的 `GWT-RF-Att`\
  \ 模型对 `motor-UPDRS` 和 `total-UPDRS` 的预测 `MAE` 均小于 5，这表明该模型的实用性。\n\n| 图 10. 各聚类中\
  \ PD 进展评估的性能结果 |\n| --- |\n| ![Figure979-8-3693-1582-8.ch003.f10](img/ch003.f10.png)\
  \ |\n| --- |\n\n`UPDRS` 由三个主要部分组成：“精神、行为和情绪”、“日常生活活动”和“运动检查”。`motor-UPDRS` 专门评估帕金森病的运动体象，包括语音特征。另一方面，`total-UPDRS`\
  \ 不仅包含 `motor-UPDRS`，还包含了心理健康和日常活动。因此，与 `total-UPDRS` 相比，假设 `motor-UPDRS` 与发声运动活动中的语音障碍更为密切（Despotovic\
  \ 等人, 2020）。这解释了为什么如图 10](#979-8-3693-1582-8.ch003.xhtml#f10)所示，每个聚类中预测的 `motor-UPDRS`\
  \ 的 `MAE` 均低于 `total-UPDRS`。\n\n`GWT` 特征的统计显著性通过 `p-values` 进行评估，如表 8](#979-8-3693-1582-8.ch003.xhtml#t8)所示。`p-value`\
  \ 通过 `t-tests` 以评估方法的显著性。观察到，在所有情况下，`GWT` 特征与 `UPDRS` 均具有统计学显著的相关性（`p-value < 0.05`）（Tsanas\
  \ 等人, 2021）。因此，本章获得的 `GWT` 特征被认为具有统计显著性。\n\n表 8. GWT 特征进行 t 检验的 p 值\n| UPDRS  ||\
  \ GWT 特征 |\n| --- | --- |\n| Cluster1 || Cluster2 || Cluster3 || Cluster4 |\n| Motor-UPDRS\
  \ || 0.0002 || 0.0058 || 0.0002 || 0.0047 |\n| Total-UPDRS || 0.0197 || 0.0020 ||\
  \ 0.0002 || 0.0107 |\n\n## 结果比较\n\n为了评估我们提出的 `GWT-RF-Att` 模型的性能，我们将其与传统的机器学习方法以及文献中的先进方法进行了比较。实验使用了包括\
  \ `SVR`、`XGBoost` 和 `RF` 在内的基准方法。此外，我们将提出的方法与结合 `GWT` 的 `SVR`、`XGBoost` 和 `RF`（即\
  \ `GWT-SVR`、`GWT-XGBoost`、`GWT-RF`）对比，以突出 `GWT` 提取特征的影响；与结合注意力机制的 `RF`（`RF-Att`）对比，以评估注意力权重对预测结果的影响。为了确保公平，所有模型都在相同的数据上使用优化后的参数进行了训练和测试。\n\
  \n表 9 显示了上述模型在测试集上预测 `motor-UPDRS` 和 `total-UPDRS` 的 `MAE`。结果表明，用 `GWT` 提取的特征替换基准特征提高了传统方法的预测性能，而引入注意力加权降低了\
  \ `RF` 的 `MAE`。此外，我们将提出的模型与文献中的几种先进方法进行了对比，包括 `FDAMF`、`PTL`、`FS-RF` 和 `GPR-ARD`。这些方法在相同帕金森病远程监测数据集上的性能也记录在表\
  \ 9](#979-8-3693-1582-8.ch003.xhtml#t9)中。\n\n表 9. 帕金森病进展评估预测的比较结果\n| 模型  || 输入特征\
  \ || Att || Motor-UPDRS || Total-UPDRS |\n| --- | --- | --- | --- | --- |\n| 传统机器学习方法\
  \ || SVR || Baseline || No || 2.77 || 3.53 |\n| | XGBoost || Baseline || No || 1.72\
  \ || 2.44 |\n| | RF || Baseline || No || 1.69 || 2.09 |\n| | RF-Att || Baseline\
  \ || Yes || 1.66 || 2.04 |\n| | GWT-SVR || GWT || No || 2.63 || 3.33 |\n| | GWT-XGBoost\
  \ || GWT || No || 1.71 || 2.16 |\n| | GWT-RF || GWT || No || 1.67 || 2.08 |\n| 先进方法\
  \ || Ji 等人 (2018) || Baseline || No || 3.00 || 4.60 |\n| | Yoon & Li (2019) || Baseline\
  \ || No || 2.45 || 3.02 |\n| | Tsanas 等人. (2021) || Baseline || No || 2.65 || 3.17\
  \ |\n| | Despotovic 等人. (2020) || Baseline || No || 1.65 || 2.02 |\n| 提出的方法 || GWT-RF-Att\
  \ || Yes || 1.53 || 1.91 |\n\n表 9](#979-8-3693-1582-8.ch003.xhtml#t9)中每个模型的具体预测结果可以分析如下。在传统机器学习方法中，`XGBoost`\
  \ 和 `RF` 由于其集成算法优于单一预测模型 `SVR`。此外，`RF` 结合了 Bag 和随机选择，有效地解决了 `XGBoost` 的过拟合问题。这不仅增强了\
  \ `RF` 模型的鲁棒性，还提高了预测准确性。因此，与 `SVR` 和 `XGBoost` 相比，`RF` 在 `motor-UPDRS` 和 `total-UPDRS`\
  \ 的 `MAE` 分别降低了 40.07% 和 40.79%，证明了其在预测 PD 严重性方面的有效性。此外，与 `SVR`、`XGBoost` 和 `RF`\
  \ 相比，`GWT-SVR`、`GWT-XGBoost` 和 `GWT-RF` 模型在 `motor-UPDRS` 和 `total-UPDRS` 上的 `MAE`\
  \ 分别降低了 5.05%、0.58%、1.18% 以及 5.67%、11.48% 和 0.48。图 11 比较了注意力机制对模型的影响。可以看出，添加注意力机制后误差有所减少。此外，与\
  \ `RF` 模型相比，`GWT-RF` 和 `RF-Att` 模型预测的 `motor-UPDRS` 和 `total-UPDRS` 的 `MAE` 分别减少了\
  \ 1.18%、1.78% 以及 0.48% 和 2.39%。因此，这些结果证明了 `GWT` 可以提取更有效的 PD 特征，而基于注意力权重的 `RF` 能够关注预测性能更好的决策树。通过结合这两种方法，所提出的\
  \ `GWT-RF-Att` 模型进一步降低了 `MAE` 并提升了预测性能。\n\n\n\n\n\n此外，表 9 显示，所提模型在预测帕金森病（PD）病情方面优于现有文献，实现了最低的\
  \ `MAE` 值。结果显示，所提方法预测 `motor-UPDRS` 和 `total-UPDRS` 的 `MAE` 分别为 1.53 和 1.91。与表 9\
  \ 中的文献结果相比，该方法取得了显著改进，`MAE` 降低了 7.27% 和 4.05%。在以往的研究中，如 `FDAMF` (Ji et al., 2018)和\
  \ `PTL` (Yoon & Li, 2019)尝试通过学习其他患者的信息来预测 PD 患者的 `UPDRS` 评分。然而，衡量不同时间维度上 PD 患者的相似性具有挑战性，这限制了预测误差的减少。`FS-RF`\
  \ (Tsanas et al., 2021)和 `GPR-ARD` (Despotovic et al., 2020)使用了特征选择算法来选择重要的 PD 特征，从而提高了预测准确性。然而，这种方法可能会导致关键信息的丢失，影响模型性能。相比之下，所提出的\
  \ `GWT-RF-Att` 模型克服了这些局限性。它利用图波变换捕获更有效的 PD 特征，并采用注意力权重机制关注具有不同预测性能的决策树模型。结果，所提模型有效增强了预测准确性。与表\
  \ 7 中 `LDFSF` 方法的结果相比，`GWT-RF-Att` 方法的预测误差更，表明 `GWT-RF-Att` 方法提取的特征具有有效性。然而，由于该方法需要波变换变换和注意力层训练，所提模型的局限性在于运行时间可能较长。\n\
  \n# 结论与未来工作\n\n本章从特征选择和特征变换的角度提出了预测 PD 情的 `LDFSF` 和 `GWT-RF-Att` 方法，两者都提高了预测性能。`LDFSF`\
  \ 方法分析了 PD 语音特征之间的相关性、冗余性和互补性。它利用最大信息系数确定特征相关性，并使用基于 `SOM` 聚类的动态特征选择方法选择高相关性、低冗余和高互补性的特征子集。`GWT-RF-Att`\
  \ 方法基于图波变换和注意力加权随机森林。它利用 PD 语音特征中提取的有效频率特征预测 PD 患者当前症状的严重程度。该方法自适应地关注随机森林中性能更好的决策树模型，从而提高了准确性。在真实公开\
  \ PTDS 数据集上的实验结果表明，`LDFSF` 和 `GWT-RF-Att` 方法均比现有方法具有更好的预测性能，验证了这两种方法在 PD 病情预测中的有效性。\n\
  \n在未来的研究中，结合提出的两种方法以获得更好的结果是一个有趣的尝试。此外，将引入因果特征选择方法来发现目标变量 `UPDRS` 的马尔可夫边界。方法旨在识别与\
  \ `UPDRS` 有因果关系的语音特征，从而增强诊断模型的稳健性和实用性。\n\n## 参考文献\n\nChakraborty, J., & Nandy, A.\
