  \ 12 通过吸收总计 30 条记录评估了初始数据导入过程。\n\n\n\n\n## 实验执行与挑战\n\n在实验实际执行过程中，遇到的主要障碍是获取访问和利用\
  \ Azure 环境内资源所需的额度。额度余额限制了资源的创建，特别是额外“SQL 数据库”的创建。此外，在构建数据流时，需要监控 Azure 额度，因为运行调试过程会产生费用，其费用取决于使用时长。\n\
  \n更新流未能按预期运行，导致产生的数据不可信。尽管已尝试解决这一难题，但并未达到预期的结果。这种差异可能归因于哈希过程中的不匹配。如果不满足任何要求，则不会对记录产生影响。此外，日期时间戳已在“Azure\
  \ SQL Database”的查询编辑器中成功实现。然而，流水线未能为摄入的条目包含日期/时间戳。\n\n# 数据湖的应用趋势\n\nFresh Research\
  \ Investigation `Marketresearch.biz` 现在提供一份关于 2023 年数据湖市场的研究，涵盖趋势（驱动因素、限制因素、机会、威胁、挑战和投资机会）、规模、份额及展望。预计数据湖市场规模将从\
  \ 2022 年的 139 亿美元增长到 2032 年的约 921 亿美元，2023 年至 2032 年的复合年增长率（CAGR）为 21.4%。原始形式的有组织和非结构化数据都可以集中存储在数据湖中。公司可以利用数据湖以原始形式存储数据，为未来的分析提供灵活性和便捷性。这与传统的数据仓库方法形成对比，后者要求数据在存储之前经过处理和整理。数据湖市场包含了各种产品。\n\
  \n# 方法论与实验分析\n\n实验完成后发现，在程序开始时使用 `copy activity` 是不可妥的。当数据从源发送到汇端而不检查任何重复条目时，就会发生这种情况。虽然本研究没有专门侧于数据清洗，但这仍然是一个需要考虑的重要问题。对于未来的研究，以更有效的方式记录并获取汇端的架构（schema）非常重要。\n\
  \n选择使用 `blob storage` 作为源而非 `SharePoint` 等替代源，是为了解决任何问题或困难。过程中出现了一些困难，这使得理解和追溯错误源头变得更加方便。这种方法论增强了理解，有望作为未来使用其他源实施的路线图。\n\
  \n汇端未配置分布式账本（DL），因为这项工作将在未来的研究中解决。汇端配置为“Azure SQL Database”，有助于数据从半结构化向结构化格式转换的可视化。尽管如此，接下来的研究将最终关注深度学习（DL）。该框架在捕每个场景事件的结果方面显示了有效性。设计是合适的；但由于在整个过程中发现了缺陷，它必须进行更新。此外，注意到备注部分是可选的，这可能被视为个人喜好问题。\n\
  \n## 结论\n\n\n\n\n\n# 总结\n\n本研究通过根据现有文献识别关键标准并实施数据质量控制措施，实现了既定目标。研究发现了多种数据质量（DQ）特征，这促使了对这些特征的发生及其重要性的进一步深入调查。本研究使用的\
  \ DQ 特性专门用于确保数据在整个摄取过程中的质量。在成功实现初步研究目标后，发现的数据质量标准被用作数据编排和摄取框架的设计与开发衡量标准。通过实施数据编排并观察实验结果，评估了所建立框架的效能。因此，最终的研究目标已经达成。\n\
  \n创建框架的效能首先通过理论方法进行评估，然后通过实际评估进行验证。仅凭理论评估无法完全对应现实情况；尽管如此，它有助于理解使用 DQ 框架的结果，无论成功还是失败。为了充分理解研究产出物的效率，有必要在实践中应用该流水线。\n\
  \n实验的实际执行表明，对时效性的评估应基于将被消耗的预期质量。第 3 节给出的数据表明实验是成功的，成功率为 84%，失败率为 16%。尽管结果积极，但根据\
  \ DQ 标准来看，该实验被认为是失败的。为了实现缺陷量化（DQ），实验必须提供 100% 的成功率。本研究产生的产物展示了某种程度的效能，而结果表明它们需要进一步完善，以充分发挥其潜力并提高效率。\n\
  \n## 发现与限制\n\n值得注意的是，这项调查的另一个重要结果包括获取曲线。它有助于对设计和执行流水线涉及的复杂性进行理解和直观体验，并理解数据编排的机制。利用云技术会产生高昂成本。本研究的主要限制是贷款可用性有限。调试的经济影响导致了对数据编排组件实验的减少。尽管存在这些限制，但它增强了对\
  \ DQ 维护和数据编排的理解。\n\n通过提供一套全面的数据编排系统设计和执行原则，它显著丰富了当前的知识库。此外，它为创建数据编排流水线提供了宝贵的见解。\n\
  \n## 未来工作\n\n未来的研究应该利用本研究提供的分析框架和经验见解，进一步研究 SharePoint 和 DL 之间数据传输的适配。此外，确定这项调查结果在\
  \ Amazon Web Services 和 Oracle 等其他云平台上是否会产生类似的结果，将是非常有趣的。\n\n未来的努力应优先将本研究的发现与深度学习技术相结合，并改进从\
  \ SharePoint 提取数据的过程。建议进一步研究优先创建一个用于管理元数据活动的稳健框架。此外，提供一个触发函数以实现从源逐渐采集数据至关重要。进行彻底测试对于确定框架在数据编排中的效率至关重要。\n\
  \n值得注意的是，未来的研究应专门针对本研究中发现的缺陷。这涉及增强 DQ 指标、测试用例以及解决与数据更新相关的问题。此外，已确定需要一种更高效的方法来首先将数据从源传输到汇点（sink）。这种技术应仅优先导入从源到汇点所使用的架构，因为采用的方法仅仅复制了条目，而没有确认是否存在重复。\n\
  \n未来工作还应包括在数据湖仓库（DLH）中保留更新后的记录而不覆盖它们，以保留完整的历史记录。相反，应该引入新条目并将其清晰地标记为当前记录的不同版本。数据时间戳未来可能用于该解决方案的开发。\n\
  \n根据表 1，正确性特征被识别为文献中提到的 DQ 属性之一。因此，未来的研究应该调查一种额外的 DQ 特性。此外，在未来的工作中，优先分析不同类型的变化至关重要，因为随着时间的推移可能会发生大量变化。考虑渐进变化维度（progressively\
  \ changing dimensions）的概念非常重要。最后，仍有很多方面需要改进和考虑，因为本研究仅仅触及了数据编排潜表面。因此，未来的研究应该深入该领域内数据操作更复杂的方面。\n\
