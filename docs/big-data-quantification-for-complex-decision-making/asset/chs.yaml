  \ |\n\n## 结果与分析\n\n## 指标计算\n\n本研究中的术语 `benchmark` 指预期的记录数量。`benchmark` 用于比较。`Accuracy`\
  \ 指集合内部预期的记录数量。\n\n## 完整性\n\n完整性（Completeness）涉及整体符合预期的程度。`Completeness` 通过计算实际记录数与总预期记录之间的比例来评估。`Completeness`\
  \ 可以用百分比或 `N/A` 表示。\n\n### 正确性\n\n数据正确性（Correctness）是指完全没有错误；它遵循二元概念，即数据要么准确要么错误。`Accuracy`\
  \ 可能会变化，但要使数据被认为是准确的，它必须是。`Correctness` 指对真实性和 `accuracy` 的绝对遵循，而 `accuracy` 量化了数据准确反映世界的程度。\n\
  \n## 准确率\n\n以下展示了公式中符号代表的含义：\n\n*   `Acc%`: 数据集的准确率。\n*   `Arecords`: 实际记录数。\n*\
  \   `Erecords`: 预期记录总数。\n\n\n\n\n\n如果哈希计算准确，则该记录被认为是合法的。本质上，这是在消耗的记录总数中合法记录的总数。有效性和数据完整性的结果可能以百分比或\
  \ `N/A` 的形式显示。结果的成功标准是达成率达到 100%。\n\n以下列出了公式中符号代表的含义：\n\n- `Vi%`: 数据集完整性记录的率。\n\
  - `Tvalid`: 数据集中显示的有效记录总数。\n- `Arecords`: 数据集中呈现的记录总数。\n- `Tinacc`: 数据集中呈现的不准确记录总数。\n\
  \n`Tvalid = Arecords – Tinacc` (4)\n\n![Mathtype979-8-3693-1582-8.ch004.m03](img/ch004.m03.png)\
  \ (5)\n\n如果：\n若未摄入数据；则 `Vi% = N/A`\n\n## 时效性\n\n在数据管理背景下，时效性涉及数据提供或供业务用户使用的速度。本质上，它衡量的是数据生成到展示给用户之间的时间差。“发生时间”是时效性的重要组成部分，因为它精确地识别了数据所代表的现实事件发生的特定时刻。它也代表了对象相关的特定特征或值首次可见的时刻。本质上，“发生时间”表示第一次时间。为了量化这一点，数据传输持续通过计算结束时间与开始时间之差来确定，以秒为单位。结果的成功标准必须在\
  \ 120 秒的时间范围内达成。值得注意的是，有几个程序提供了执行长度的信息。\n\n以下列出了公式中符号代表的含义：\n\n- `Time(s)`: 摄入数据集所需的时间（以秒为单位）。\n\
  - `ST`: 数据集的开始时间（发生时间）。\n- `ET`: 数据集的结束时间（数据交付时间）。\n\n`Time(s) = ET – ST` (6)\n\n\
  如果：\n`Time(s) < 120s`；则有效\n`Time(s) > 120s`；则无效。\n\n## 场景\n\n建立场景及其成功标准有助于确定预期结果和预测结果。在表\
  \ 3 中，变量 `n` 表示场景编号。“目标”一词指的是场景的主要目标。“描述”提供了对涉及过程的说明。最后，“成功标准”描述了用于判断是否实现了预期结果的标准。\n\
  \n### 表 3. 场景用例\n\n| 用例 n ||  |\n| --- | --- |\n| 目标 || 摄入新鲜数据 |\n| 说明 || 解释将遵循的程序。\
  \ |\n|  || 规定结果何构成成功的条件。 |\n\n## 测试用例\n\n测试用例提供了一种系统化的方法，用于使用之前指定的数据质量（DQ）标准来评估数据。用户可以在此框架内记录初始数据、整个过程中的任何更改或添加以及预期结果。此外，它有一个部分专门用于监控许多测试尝试，评估它们的成功或失败，并添加补充注释。最后部分提供了对测试用例整体有效性的简要概述。头部提供了给定测试用例中测试用例和场景的详细信息。测试编号由`<number>`\
  \ 表示，场景编号由 `n` 表示，标题由`<title>` 表示。数据集包含位于头部下方的条目计数。输入变量代表数据集中的原始行数，而变量反映了当前行数。过程变量指示将添加到数据集中的新行数。最终，结果准确地描绘了摄入过程的预期结论。下一部分展示了测试结果，包括矩阵的计算，这证明了流水线在特定特定情况下的效率。随后，根据建立的成功标准判断成功与。这可能通过正面响应（Y）或否定响应（N）来指示。如有必要，可以为每个矩阵记录补充备注或观察。\n\
