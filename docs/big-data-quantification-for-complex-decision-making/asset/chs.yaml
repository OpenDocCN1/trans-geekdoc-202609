  \ (Wille, 1982)设 `K=(G,M,I)` 为形式语境。对于 `A⊆G` 和 `B⊆M`，如果 `A^I⊆B^I`，则 `A→B` 称为 `K`\
  \ 的蕴。\n\n**示例 2.2**（延续示例 2.1）。验证\n\n![Mathtype979-8-3693-1582-8.ch010.m12](img/ch010.m12.png)\n\
  \n则 `{a[2]}→{a[5]}` 是 `K` 的蕴。\n\n## 决策蕴逻辑\n\n决策蕴是蕴在决策情况下的扩展，研究不同领域属性之间的依赖关系（例如原因和结果、条件和行为）。类似于蕴的研究\
  \ (Ganter and Wille, 1999)，决策蕴可以从两个角度研究，即逻辑方法和数据驱动方法 (Zhai et al., 2015b, 2014,\
  \ 2015a)。通过逻辑方法，我们指的是决策蕴逻辑，它具有语义和语法方面。通过数据驱动方法，从给定的决策语境中提取决策蕴，并讨论决策蕴相对于决策语境的完性和非冗余性。Zhai\
  \ et al., 2014) 显示逻辑方法获得的结果可以直接应用于数据驱动方法。\n\n决策蕴逻辑中决策蕴的定义首先在定义 2.6 中给出。\n\n**定义\
  \ 2.6** (Zhai et al., 2014)设 `C` 为条件属性集，`D` 为决策属性集，使得 ![Mathtype979-8-3693-1582-8.ch010.m13](img/ch010.m13.png)。如果\
  \ `A⊆C` 且 `B⊆D`，则 `A→B` 称为决策蕴，其中 `A` 是 `A→B` 的前提，`B` 是结论。\n\n在决策蕴逻辑的语义方面，研究了决策蕴的可靠性以及决策蕴集的完备性和非冗余性。\n\
  \n**定义 2.7** (Zhai et al., 2014)设 `C` 为条件属性集，`D` 为决策属性集，`L` 和 `L1` 为决策蕴集。我们定义：\n\
  \n*   1. 对于集合 `T⊆C∪D` 和决策蕴 `A→B`，如果 ![Mathtype979-8-3693-1582-8.ch010.m14](img/ch010.m14.png)\
  \ 或 `B⊆T∩D`，则 `T` 满足 `A→B`（或 `T` 是 `A→B` 的模型），记为 `T|=A→B`。如果对于任意 `A1→B1∈L`，`T|=A1→B1`\
  \ 都成立，则 `T` 满足 `L`，记为 `T|=L`。\n*   2. 对于蕴 `A→B`，如果对于任意 `T⊆C∪D`，`T|=L` 意味着 `T|=A→B`，则\
  \ `A→B` 可以从 `L` 中语义导出，记为 `L⊢A→B`。如果对于任意 `A1→B1∈L1`，`L⊢A1→B1` 都成立，则 `L1` 可以从 `L`\
  \ 中语义导出，记为 `L⊢L1`。\n*   3. 如果对于任意 ![Mathtype979-8-3693-1582-8.ch010.m15](img/ch010.m15.png)\
  \ 成立，则 `L` 是非冗余的。\n*   4. 如果任何可以从 `L` 中语义导出的蕴包含在 `L` 中，则 `L` 是闭的。\n*   5. 如果 `L`\
  \ 是闭的，`L1⊆L` 且 `L1⊢L`，则 `L1` 对于 `L` 是完备的。\n\n\n\n\n\n从定义 2.7 可以看出，`T|= A→B` 意味着\
  \ `A→B` 在 `T` 中成立，即如果 `A⊆T`，则 `B⊆T`；而 `T|=L` 意味着 `L` 在 `T` 中成立，即 `L` 中所有的决策蕴含在 `T`\
  \ 中成立。因此，`L⊢ A→B` 意味着如果 `L` 成立，则 `A→B` 也成立，即 `A→B` 是由 `L` 推导出的决策信息。从这个意义上说，`L` 是非冗余的当且仅当\
  \ `L` 中的任何决策蕴含都是不可或缺的，即任何决策蕴含不被 `L` 中的其他决策蕴含所推导。此外，根据定义 2.7，很容易验证：决策蕴含 `A→B` 相对于\
  \ `L` 是冗余的，当且仅当 `A→B` 可以从 `L` 中的其他决策蕴含在语义上推导出，即 `L\\{ A→B }⊢ A→B`。\n\n条件属性集 `A`\
  \ 相对于决策蕴含集 `L` 的闭在定义 2.8 中给出，正如命题 2.3 验证，它实际上是基于 `A` 从 `L` 推导出的最大结论。\n\n**定义 2.8\
  \ (Zhai et al., 2014)** 令 `C` 为条件属性集，`L` 为决策蕴含集。`A⊆C` 相对于 `L` 的闭定义为：\n\n```\nA^L\
  \ = ∪{B[i]| A[i]→B[i]∈L, A[i]⊆A}\n```\n\n**命题 2.3 (Zhai et al., 2014).** 令 `L` 为决策蕴含集，`A→B`\
  \ 为决策蕴含。则有 `L⊢ A→B` 当且仅当 `B⊆A^L`。\n\n在语法方面，人们研究推理规则的可靠性、完备性和非冗余性 (Zhai et al., 2014)）。Zhai\
  \ 等 (Zhai et al., 2014) 提出了两种推理规则：扩展（Augmentation）和组合（Combination），通过这些规则，可以从给定的决策蕴含中获得决策蕴含：\n\
  \n*   **扩展**\n    ![Mathtype979-8-3693-1582-8.ch010.m16](img/ch010.m16.png) (1)\n\
  *   **组合**\n    ![Mathtype979-8-3693-1582-8.ch010.m17](img/ch010.m17.png) (2)\n\n\
  扩展意味着如果 `T` 是 `A→B` 的模型，且 `A[1]⊇A` 和 `B[1]⊆B`，则 `T` 也是 `A[1]→B[1]` 的模型。同样，组合意味着如果\
  \ `T` 是 `A→B` 和 `A[1]→B[1]` 的模型，则 `T` 也是 `A∪ A[1]→B∪B[1]` 的模型。\n\n以下定理展示了扩展和组合的可靠性、完备性和非冗余性。\n\
  \n**定理 2.1 (Zhai et al., 2014). (可靠性)** 扩展和组合是可靠的，即：\n\n1. 如果 `A→B A[1]⊇A` 且 `B[1]⊆B`，则\
  \ `A→B ⊢ A[1]→B[1]`。\n2. 如果 `A→B` 且 `A[1]→B[1]`，则 ![Mathtype979-8-3693-1582-8.ch010.m18](img/ch010.m18.png)。\n\
  \n推理规则的可靠性确保了语法推导的语义兼容性，即如果一个决策蕴含 `A→B` 可以通过迭代应用推理规则从 `L` ，那么 `A→B` 就可以从 `L` 在语义上推导出。\n\
  \n**定理 2.2 (Zhai et al., 2014). (完备性)** 扩展和组合在语义方面是完备的，即对于任何闭集 `L` 和完全集 `L[1]⊆L`，我们有\
  \ `A→B ∈L` 当且仅当 `A→B` 可以通过扩展和组合从 `L[1]` 。\n\n推理规则的完备性确保了语法推导的完备性，即如果一个决策蕴含 `A→B`\
