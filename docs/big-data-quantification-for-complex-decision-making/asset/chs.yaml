  \n\n\n# 贡献作者\n\n## Sabyasachi Pramanik\nSabyasachi Pramanik 是 IEEE 专业会会员。他在印度博帕尔的斯斯里·萨蒂亚·赛技术与医学大学获得计算机科学与工程博士学位。目前，他是印度哈尔迪亚学院（Haldia\
  \ Institute of Technology）计算机科学与工程系的副教授。他在各种国际会议、期刊和书籍章节发表了大量论文（被 SCIE、Scopus、ESCI\
  \ 等检索）。他的研究领域涵盖人工智能、数据隐私、网络安全、信息安全和机器学习。他还担任几本国际期刊的编辑委员会成员。他是 IEEE、Springer、Elsevier、Inderscience、IET\
  \ 和 IGI Global 期刊的审稿人。他审稿过许多会议论文，并曾担任多次国际会议的主席演讲员、会议主席和技术程序委员会成员。他编写了一本关于无线传感器网络的书籍。他还为\
