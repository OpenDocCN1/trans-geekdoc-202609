  \n## 奖励与未来效用\n\n在三路决策的马尔可夫决策过程中，基于变化的三元划分状态的每次变化都会产生奖励以更新 Q-table。我们采用累积前景理论来计算每个周期产生的奖励。\n\
  \n累积前景理论描述了决策者在不确定性和风险条件下的行为和态度。其核心思想可以总结为三个方面：\n1. 相对于参考点的收益或损失，而非财富的最终状态。\n2.\
  \ 第二，决策者对收益表现出风险规避，对损失表现出风险寻求，且对损失的敏感度高于收益。\n3. 最后，面对低概率事件，决策者倾向于放大其影响，而对于高概率事件，他们倾向于缩小。\n\
  \n累积前景理论认为决策者倾向于具有最高累积前景值的决策。使用价值函数 `v(x[h])` 和决策权重函数 `ψ[h]`，累积前景价值函数 `v` 给出如下：\n\
  \n![Mathtype979-8-3693-1582-8.ch006.m55](img/ch006.m55.png)\n\n对于 `k^{th}` 周期中的基于变化的三元划分状态\
  \ ![Mathtype979-8-3693-1582-8.ch006.m56](img/ch006.m56.png)，应用策略 `A` 会导致全集 `U` 中对象的区域变化，从而导致\
  \ `k+1^{th}` 周期中的基于变化的三元划分状态 ![Mathtype979-8-3693-1582-8.ch006.m57](img/ch006.m57.png)。策略\
  \ `A` 的应用可能导致 ![Mathtype979-8-3693-1582-8.ch006.m58](img/ch006.m58.png) 区域对象发生理想、不确定或非理想的变化，而在\
  \ ![Mathtype979-8-3693-1582-8.ch006.m59](img/ch006.m59.png) 和 ![Mathtype979-8-3693-1582-8.ch006.m60](img/ch006.m60.png)\
  \ 区域产生相似的潜在变化。令 `x[k]` 表示由 ![Mathtype979-8-3693-1582-8.ch006.m61](img/ch006.m61.png)\
  \ 区域对象变为 ![Mathtype979-8-3693-1582-8.ch006.m62](img/ch006.m62.png) 所产生的效用。\n\n决策者需要设置一个参考值\
  \ ![Mathtype979-8-3693-1582-8.ch006.m63](img/ch006.m63.png)；如果策略 `A` 影响下的 ![Mathtype979-8-3693-1582-8.ch006.m64](img/ch006.m64.png)\
  \ 区域对象发生理想或不确定变化，则产生 ![Mathtype979-8-3693-1582-8.ch006.m65](img/ch006.m65.png) 收益。否则产生损失。Tversky\
  \ 和 Kahneman 提供了价值函数 `v(x[h])` 的详细公式：![Mathtype979-8-3693-1582-8.ch006.m66](img/ch006.m66.png)。这里\
  \ `μ=0.8` 且 `θ=2.5`。该价值函数是单调递增函数。通过将变化效用 `x[k]` 代入价值函数 `v(x[h])`，可以获得策略 `A` 影响下周期\
  \ `k` 的基于变化的三元划分状态导致周期 `k+1` 最有效基于变化的三元划分状态的每个区域的价值函数，见 [#979-8-3693-1582-8.ch006.xhtml]。\n\
