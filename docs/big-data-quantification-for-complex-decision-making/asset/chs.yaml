  \ Necmettin Erbakan 大学\n*   Burak Efe, Necmettin Erbakan 大学\n\n### 摘要\n本文研究了供应链管理中的一个阶段——供应商选择。通过专家意见和文献综述，评估了环境、经济、社会和智能四个主要标准，以及\
  \ 18 个子标准。提出了一种基于区间值四序对模糊（IVROF）数的 MACA 方法。在本文中，对 MACA 使用了模糊数，但与文献不同，应用了 IVROF 数。可以看出作为直觉模糊数和毕达模糊数扩展的\
  \ IVROF 数在评估意见方面具有优势。此外，考虑了工业 4.0 标准，并研究了一家汽车企业的供应商选择问题。\n\n## 引言\n零售市场通过全球化日益增长，一个大陆生产的产品可以作为另一个大陆的原材料并销售到其他大陆。全球化在带来优势的同时，也使得供应链管理变得更加复杂和困难。它促使企业寻求更系统、技术化和更快速的方法。能够建立这些系统化、可持续供应链并通过无错误供应流程和正确产品来实现竞争力的企业，比其他企业具有竞争优势。尽管供应链非常重要，但可见直到最近，专家们在如何将供应链管理整合到所有其他业务政策中方面尚未进行许多实证研究。供应商选择是供应链中降低成本的第一步也是最重要的环节之一。许多企业旨在与供应商建立紧密联系并进行合作，以提高竞争力，并以最小偏差履行给客户的计划交付日期。供应商选择已成为一个重要的管理问题之一。供应商选择旨在识别性能最高的供应商以持续满足需求。在许多可能的候选供应商中选择最佳供应商是一项复杂的任务。\n\
  \n\n\n\n\n## 引言\n\n由于客户与供应商的关系在业务经营中至关重要，选择合适的供应商远不仅仅是成本比较，其选择取决于多种定量和定性因素的预测。一旦供应商被完全整合到运行良好且组织良好的供应链中，这种关系将对竞争力产生长期影响。因此，供应商选择问题在组织高效供应链系统方面发挥着至关重要的作用。供应商选择问题旨在减少采购风险、为客户实现价值化，并在消费者与供应商之间建立短期长期联系。多年来智能技术的发展不可避免地影响了供应链。作为工业\
  \ 4.0 组件的先进智能技术（如物联网、网络化系统、大数据和人工智能）确保了构成供应链的所有环节更具感知性、可解释性、预测性、可控性和优化性。整合了这些技术的供应链被称为智能供应链。\n\
  \n供应链面临着日益增长的自然性、人为性或技术性风险，例如由于全球化导致的自然灾害、交通事故、工人罢工和恐怖袭击。这些因素的后果会导致生产力、利润、竞争和收入的损失，从而引发供应链中断。因此，使供应链智能化和可持续化已成为保护客户免受短缺和中断的必要手段。具有可持续供应链视角的企业既需要与供应商沟通，又要满足客户、政府和股东的需求。此外，为了在可持续供应链中生产可持续产品，在选择合适的供应商时必须考虑可持续性准则（Hosseini\
  \ and Khaled, 2019）。\n\n在智能供应链管理中，智能技术被应用于从运输到操作工作流程分析的每一个阶段，以在社会、环境和经济方面提供更高的可持续性。可持续的供应商选择是维持这种可持续性最重要的组成之一。因为供应商的行为对于子公司实现可持续竞争优势具有重要意义。在评估过程中使用智能技术以在供应商选择中实现这种可持续性是至关重要的（Chen\
  \ et al., 2020; Ghadimi et al., 2019）。\n\n传统的供应商选择很大程度上基于价格便宜和距离近等准则。随着供应链中使用智能信息技术，出现了一些智能化的供应商选择准则，如供应商信息管理、仓储自动化、物流系统数字化和数据安全（Hasan\
  \ et al., 2020; Torğul and Paksoy, 2023）。\n\n通常，决策者在为按需供应商提供决策偏好时面临着许多不确定因素。供应商选择取决于成本、质量、性能、技术等。这是一个涉及许多准则的复杂问题。因此，为了获得符合现有准的系统化供应商选择过程，需要一种可以对准则进行评估和排序的方法（Tam\
  \ and Tummala, 2001）。\n\n## 相关工作\n\n本使用了许多缩写，可以在附录 1 中看到。在 Tam 等人进行的一项针对电信公司经销商选择的研究中，通过对文献中的决策方法进行回顾，以支持经销商选择过程。基于文献中的广泛研究，该研究提出了一种基于\
  \ `AHP`（层次分析法）的模型，以包含目标冲突的决策者。案例研究结果表明，`AHP` 确保缩短供应商选择的时间（Tam and Tummala, 2001）。\n\
  \n在不同的研究中应用了不同的方法：\n- `AHP` 和 `ELECTRE`（Organisation et Rangement des Choix d'Ensemble\
  \ par Preference）用于供应商选择（Tam and Tummala, 2001）。\n- `DEMATEL`（决策与评价实验室）用于描述准则之间的关系（Kaya\
  \ and Yet, 2019）。\n- `BWM`（最劣值法）和 `TODIM`（多准则交互决策）用于对供应商进行排名（Liu et al., 2021）。\n\
  - `VIKOR`（折中方案的多准则优化）应用于供应商选择（Liu et al., 2021）。\n- 基于 `q 阶正交对模糊数 (q-ROF)` 数的 `TOPSIS`\
  \ 用于选择（Pınar and Boran, 2020）。\n- `fuzzy inference system`（模糊推理系统）用于供应商选择（Alavi\
  \ et al., 2021）。\n- `graph neural networks`（图神经网络）被用于毕达模糊环境下的 `TOPSIS` 方法（Meng et\
  \ al., 2024）。\n\n\n\n\n尽管模糊集在评估不确定性方面非常成功，但在解释决策者的非隶属度/犹豫度方面仍显不足。为了弥补模糊集的这一缺陷，Atanassov\
  \ 提出了一种直觉模糊集模型，在该模型中可以同时评估隶属度和非隶属度（Atanassov, 1986; Ali et al., 2022）。\n\n毕达哥模糊集被认为是直觉模糊集的扩展，其引入是为了满足更宽的定义范围的需求。在直觉模糊集中，隶属度和非隶属度的之和允许最多为\
  \ 1，如果小于 1，则其差值定义为犹豫度。在毕达哥模糊集中，隶属度和非隶属度的平方和允许最多为 1，从而获得了更宽的定义范围。然而，毕达哥模糊集在实际应用中也存在不足。为了在这些实践中获得更准确的结果，广义\
  \ `q-ROF` 集可以作为毕达哥模糊集的扩展，从参数类型调整对隶属度和非隶属度的限制。\n\n一些研究将 `q-orthopair` 模糊数应用于不同领域，例如天然气管道风险评估（Efe\
  \ and Efe, 2023b）和手套设计（Efe and Efe, 2022）。提出了基于 `q-orthopair` 模糊数的 `MAIRCA` 方法用于急诊患者的选择（Efe\
  \ and Efe, 2023a）。`q-ROF` 集模型及其混合结构作为强大的思想，吸引了研究者的关注，并使他们深化了对其的研究。其中一项研究提出了一种整合了区间值模糊集和\
  \ `q-ROF` 集的混合结构（Joshi et al., 2018）。\n\n本章对文献的贡献如下：\n\n- 与文献中现有研究不同，本文通过使用区间值 `q-ROF`\
  \ 数对 `MAIRCA` 扩展。本研究同时确保了 `MAIRCA` 和区间值 `q-ROF` 数的优点。它确保了在基于准则的方案评估中防止专家信息的丢失。\n\
  - 智能供应商选择是一个新趋势。本章除了传统的供应商选择标准外，还处理了工业 4.0 准则。它使用了一种新方法，即基于区间值 `q-ROF` 数的 `MAIRCA`\
  \ 来智能供应商选择问题。\n\n## 本章主要重点\n\n本节介绍了 `MAIRCA` 方法的步骤和区间值 `q-ROF` 数的定义。`MAIRCA` 方法的步骤总结如下（Pamucar\
  \ et al., 2018）。\n\n- **步骤 1**：建立决策矩阵。每个方案 `A[i]` 的 `C[j]` 值包含在公式 (1) 中。\n`C1 C2\
