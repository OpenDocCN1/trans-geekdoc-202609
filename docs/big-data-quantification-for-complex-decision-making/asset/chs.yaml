  \ 3 部学术专著，获得 2 项国家发明专利。曾获得山西省高校科研成果一等奖、山西省社会科学二等奖、太原市优秀学术论文奖、ACM 分会优秀博士论文、CGCKD\
  \ 优秀论文奖。|\n\n\n\n\n\n## 李万涛 (Wentao Li) - 编辑\n李万涛于 2019 年获得中国哈尔滨工业大学数学学院博士学位，并于\
  \ 2015 年获得中国重庆理工大学数学与统计学院硕士学位。2016 年至 2018 年期间，他在加拿大阿尔伯塔大学（位于埃德蒙顿）担任联合读博士生。他目前是中国重庆大学人工智能学院的副教授。他目前的研究方向包括人工智能、特征选择和粒度计算。近年来，他发表了\
  \ 30 多篇论文，涵盖了如*IEEE Transactions on Fuzzy Systems*、*IEEE Transactions on Neural\
  \ Networks and Learning Systems*、*IEEE Transactions on Cybernetics*、*IEEE Transactions\
  \ on Emerging Topics in Computational Intelligence*、*Fuzzy Sets and Systems*、*Information\
  \ Sciences*、*Artificial Intelligence Review*等期刊。其中有 3 篇论文入选“ESI 热点论文”和“ESI 高引论文”。他担任多个国际期刊的编委，并成功在*International\
  \ Journal of Fuzzy Systems*、*Wireless Communications and Mobile Computing*、*Intelligent\
  \ Automation & Soft Computing*以及*Frontiers in Neurorobotics*等期刊上主过多个特刊。他还担任*IEEE\
  \ TFS*、*IEEE TNNLS*、*IEEE TCYB*、*IEEE TKDE*、*INS*、*KBS*、*AIRE*等许多期刊的审稿人，并于 2018\
  \ 年获得*Knowledge-Based Systems*优秀审稿人证书。`aed6ac2a-1d54-4a57-8644-687be5380726`\n\n\
