  \ |\n| --- |\n\n## 标准化聚类\n\n该聚类算法可以有效将数据集中的 PD 样本划分为不同的簇，这有助于降低数据维度并最小化预测模型的预测误差\
  \ (Nilashi et al., 2020)。为了提高聚类过程的效率并减少迭代次数，本章对 PD 样本数据进行了数据标准化。在聚类之前，标准化的 `K-means`\
  \ 算法对样本数据进行极值标准化，从而简化了数据处理的复杂性：\n\n![Mathtype979-8-3693-1582-8.ch003.m19](img/ch003.m19.png)\
  \ (8)\n\n其中 `x[:,n]` 表示 `X` 中第 $n$ 列的样本特征。`min(x[:,n])` 和 `max(x[:,n])` 分别代表 `x[:,n]`\
  \ 中的最小值和最大值。为了将 `M` 个样本聚类为 `K` 个簇，在初始样本空间中随机选择包含 `M` 个样本的初始均值向量集 ![Mathtype979-8-3693-1582-8.ch003.m20](img/ch003.m20.png)。然后计算\
  \ `M` 个样本与 `K` 个质心之间的公式 (9) 中的 `D[mk]` 代表的欧几里得距离。根据该距离，样本被自动分配到距离其质心最近的簇 `clus[m]`：\n\
  \n![Mathtype979-8-3693-1582-8.ch003.m21](img/ch003.m21.png) (9)\n\n其中 `||||` 代表二范数。在所有样本分组后，更新每个簇的均值向量并根据公式\
  \ (9) 重复聚类步骤，直到均值向量不再变化，形成 `K` 个 PD 样本簇。\n\n## 图波变换\n\n`GWT-RF-Att` 模型的初始步骤是通过图\
