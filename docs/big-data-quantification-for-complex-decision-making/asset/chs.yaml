  \n**定义 2.3** (Wille, 1982)设 `K=(G,M,I)` 为形式语境。对于 `A⊆G` 和 `B⊆M`，如果 `A^I=B` 且 `B^I=A`，则\
  \ `C=(A,B)` 是 `K` 的形式概念。在这种情况下，`A` 是 `C` 的扩展，`B` 是 `C` 的意。\n\n**定义 2.4** (Wille,\
  \ 1982)设 `K=(G,M,I)` 为形式语境，`C1=(A1,B1), C2=(A2,B2)` 为 `K` 的两个概念。我们定义：\n\n![Mathtype979-8-3693-1582-8.ch010.m10](img/ch010.m10.png)\n\
  \n那么，按这种方式排序的所有 `K` 的形式概念构成一个格，称为 `K` 的概念格，记为 `L(K)`。\n\n**命题 2.2** (Wille, 1982)设\
  \ `K=(G,M,I)` 为形式语境，`L(K)` 为 `K` 的概念格。那么 `L(K)` 是一个完格，任意概念对 `(A1,B1)` 和 `(A2,B2)`\
