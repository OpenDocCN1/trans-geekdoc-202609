  \ doi:10.1016/j.knosys.2019.105350\n\n\n\n\n\nJiang and Yao (2018) 引入了一种基于通用 `3WD`\
  \ 模型和基于运动的 `3WD` 的定量评估方法，而 Jiang 和 Guo (2020) 开发了一种基于信息熵的策略选择概率模型。他们还引入了比例效用函数（`PUF`），用于从两个维度视角评估基于运动的\
  \ `3WD` 的结果（Jiang & Guo, 2021; Jiang & Guo, 2022）。此外，还提出了基于变更的 `TAO` 模型（Jiang &\
  \ Duan, 2022），通过整合区间集和区分性效用函数来衡量有效性。该框架使用区间集来表示策略或动作的影响，使用效用测量方法评估三个区间之间的变化，并合并这些效用以进行全面的有效性评估。\n\
  \n然而，在处理基于变更的三元决策决策时，仍有一些关键问题需要得到妥善解决。基于变更的三元决策决策的目标是将对象从原始的三元划分转变为更有效的划分。基于变化的决策解释并回答了一类问题：我们为什么需要“三分与行动”？也就是说，三元决策旨在产生更令人满意的变化。在本章中，我们开发了一种基于基于变更的三元决策选择最优策略并计算未来效用的方法。\n\
  \n本章应用强化学习，通过 `Q-learning` 算法预测未来效用并生成一组策略，以便在未来效用计算过程中用最短周期达到目标奖励。在预测过程中，改变的三元划分可以被视为强化学习中的状态。应用于改变后的三元划分有多种策略可用，这些策略在强化学习中被称为动作。每当策略改变三元划分时，它就会产生一个视为强化学习奖励的效用。\n\
  \n## 本章的动机与贡献\n\n本研究的主要动机是解决基于变更的三元决策（`C-3WD`）中的关键问题，并加强对决策过程中的“三分-行动-结果”（`TAO`）模型的理解。以往的研究主要集中在“三分”和“行动”阶段，对“结果”的关注较少。此外，还需要找到能够在有限周期内高效实现所需效用的策略，以减少试错成本。\n\
  \n为了应对这些挑战，本研究提出了一种利用强化学习来预测未来效用并为基于变更的三元决策生成最优策略的方法。这项工作的主要贡献包括：\n\n1. 关注基于变更的三元决策：`TAO`\
  \ 模型旨在将原始的三元划分转换为更有效的划分，解决“三分与行动”的问题。\n2. 强化学习方法：利用 `Q-learning` 算法预测未来效用并选择策略。将改变的三元划分视为状态，目标是达到目标奖励。\n\
  3. 结果预测：本研究通过评估基于变更的三元决策的有效性为该领域做出了贡献。\n\n根据上述，本章结构如下：\n- 第 2 节回顾了三元决策的基本概念。\n-\
  \ 第 3 节描述了使用强化学习进行策略选择的方法。\n- 第 4 节提供了所提方法的示例。\n- 第 5 节总结了未来研究的建议。\n\n## 基础知识\n\n\
  TAO 模型\n\n图 1 展示了决策中的三分-行动-结果（`TAO`）模型。该模型由三个部分组成：三分、行动和结果，每个部分具有不同但相关的功能。虽然每个部分独立运行，但它们共同构成了一个整体。\n\
  \n三分是三元决策中的关键步骤，主要侧重于评估结果。其有效性在于产生多样化的结果。\n\n行动是三元决策的另一个重要方面，涉及为了实现目标的特定策略。三元决策的有效性取决于此。\n\
  \n三分和行动对于三元决策的成功都至关重要。无论是由三分驱动还是行动驱动，该方法取决于具体的语境。结果部分与三分和行动不同，它主要侧重于评估这两个过程的有效性。\n\
  \n| 图 1. 三元决策的 TAO |\n| --- |\n| |\n\n## 结果评估\n\n在三元决策中，结果的主要功能是评估过程的有效性。这种评估侧重于识别和分析在实施三分和行动步骤之前之后出现的差异。为了量化这种变化，我们使用以下通用公式\
  \ (Gao & Yao, 2017)：\n\n```\nQ(pi') = Q(pi)\n```\n\n\n\n\n\n在现有研究中，重点主要放在三划分和动作方面，而对结果评估的关注有限。Yao\
  \ 和 Jiang 在他们的开创性工作中，提出了一种基于三划分和动作的衡量结果的综合指标框架，如下方的公式所示：\n\n![Mathtype979-8-3693-1582-8.ch006.m02](img/ch006.m02.png)\n\
  \n在这里，`Q(π)` 表示整体结果，可能包含成本、收益或风险。`Q(P[i])`, `i=1,2,3` 表示特定区域 `P[i]` 的结果，而 `w[i]`\
  \ 是分配给 `Q(P[i])` 的权重，`i=1,2,3`。该框架有助于对结果进行更细致、更全面的评估，对三元决策领域做出了显著贡献。\n\n## 基于变化的三元决策\n\
  \n**定义 8.1**: (Jiang et al., 2022)。评估空间由三元组 `E=(U,S,e)` 定义，其中 `U` 是一个有限非空对象集，`S`\
  \ 是一个状态集，`e` 是一个从 `U×S` 到实数集 ![Mathtype979-8-3693-1582-8.ch006.m03](img/ch006.m03.png)\
  \ 的映射，即 ![Mathtype979-8-3693-1582-8.ch006.m04](img/ch006.m04.png)。对于对象 `x∈U` 和状态\
  \ `s∈S`，`e(xs)` 表示对象 `x` 在状态 `s` 下评估值。\n\n作为 ![Mathtype979-8-3693-1582-8.ch006.m05](img/ch006.m05.png)\
  \ 的特殊情况，我们可以使用三值集合 `{-1,0,+1}` 来定性地表示对象的某些属性。我们也可以使用单位区间 `[0,1]`。评估值 `e(xs)` 代表处于状态下的对象。通过观察两个状态，我们可以观察到变化。\n\
  \n**定义 8.2**: (Jiang et al., 2022)。在评估空间 `E(U,S,e)` 中，给定一对状态 ![Mathtype979-8-3693-1582-8.ch006.m06](img/ch006.m06.png)，对象\
  \ `x∈U` 的评估值变化定义为：\n\n![Mathtype979-8-3693-1582-8.ch006.m07](img/ch006.m07.png)\n\
  \n在上面的定义中，我们产生了一种新的评估方法。它不再仅仅评估单个状态下的对象，而是通过计算对象在两个不同状态下的值差来使用值。这种新评估扩展了传统的评估方法。具体而言，我们使用两个值之间的差作为变化。它没有将此差与初始值\
  \ `e(xs)` 联系起来。有时我们需要考虑相对于值 `e(xs)` 的变化。\n\n**定义 8.3**: (Jiang et al., 2022)。在评估空间\
  \ `E=(U,S,e)` 中，假设对于所有 `x∈U` 和 `s∈S`，`e(xs)≠0`。给定一对状态 ![Mathtype979-8-3693-1582-8.ch006.m08](img/ch006.m08.png)，对象\
  \ `s∈U` 的值的相对变化定义为：\n\n![Mathtype979-8-3693-1582-8.ch006.m09](img/ch006.m09.png)\n\
  \n其中 `abs (.)` 表示实数的绝对值。\n\n在某些情况下，我们可能想要评估一组对象的整体变化。最简单的方法是汇总集合中对象变化。\n\n**定义 8.4**:\
  \ (Jiang et al., 2022)。假设 `X⊆U` 是对象的子集。`X` 中对象的整体变化定义为：\n\n![Mathtype979-8-3693-1582-8.ch006.m10](img/ch006.m10.png)\n\
  \n其中 `X={x[1],x[2],x[3],…x[n]}`。\n\n求和了集合 `X` 中所有对象在两个状态下的差。如果求和结果大于零，则策略实现了积极效果；如果结果为零，则没有变化；否则，方法将产生负面影响。\n\
  \n## 强化学习\n\n强化学习 (RL) (Kaelbling,1996) 被视为机器学习中的一种方法，它强调智能体如何通过动作和接收到的奖励在环境中学习最优策略。假设环境具有马尔可夫特性，序列强化学习问题可以通过马尔可夫决策过程\
  \ (MDP) 进行恰当建模。\n\n策略动作的状态变化遵循马尔可夫属性，这意味着后续状态仅取决于当前状态和策略，与历史无关。马尔可夫决策过程由元组 `(π[c],\
  \ A, P, R)` 表示。在这里，`π[c]` 是所有可能状态的有限集，`A` 是所有可用策略的有限集。`P` 代表状态转移转移概率 ![Mathtype979-8-3693-1582-8.ch006.m11](img/ch006.m11.png)，表示在当前状态\
  \ `π[c]` 和策略 `A` 下转移到下一个状态 ![Mathtype979-8-3693-1582-8.ch006.m12](img/ch006.m12.png)\
  \ 的概率。奖励函数 ![Mathtype979-8-3693-1582-8.ch006.m13](img/ch006.m13.png) 量化了在状态 `π[c]`\
  \ 和策略 `A` 条件下转移到状态 ![Mathtype979-8-3693-1582-8.ch006.m14](img/ch006.m14.png) 时获得的奖励。由于\
  \ MDP 能够有效地封装智能体与环境之间的动态交互，马尔可夫决策过程常用于描述强化学习任务。\n\n强化学习中的 Q 学习算法在马尔可夫决策过程 (MDP)\
  \ 背景下，通过探索和学习不断更新 Q 表来寻找最优策略。该表记录了每个状态-动作对的值函数，代表了执行特定动作的预期回报。该算法使用公式更新 Q 函数 `Q(π[c],A)`：\n\
  \n![Mathtype979-8-3693-1582-8.ch006.m15](img/ch006.m15.png)\n\n\n\n\n\n| 图 2. 基于强化学习的三路决策\
  \ (RL-3WD) |\n| --- |\n| ![Figure979-8-3693-1582-8.ch006.f02](img/ch006.f02.png)\
  \ |\n| --- |\n\n图 2 展示了使用 `Q-learning 算法` 更新 `Q table` 的过程。对于循环 `t` 中的三分状态 ![Mathtype979-8-3693-1582-8.ch006.m19](img/ch006.m19.png)，使用\
  \ `ε-greedy` 方法选择策略 `A`，该策略的应用后会在循环 `t+1` 中产生一个更有效的三分状态 ![Mathtype979-8-3693-1582-8.ch006.m20](img/ch006.m20.png)，从而生成奖励\
  \ `r[t]`。该奖励随后被用于更新 `Q-table`。此过程通过多次训练迭代重复，直到 `Q-table` 中的 `Q-values` 稳定。以下概述了针对三分状态\
  \ `{R+,R⁰,R^(--)}` 进行的一系列策略训练的具体方法：\n\n*   **状态转移概率矩阵**：计算应用每种策略产生的转移概率矩阵。基于该矩阵，确定下一个循环的三分状态。\n\
  *   使用累积前景理论计算每种策略应用产生的新三分状态的效用值，并将其视为强化学习中的奖励。\n*   **策略选择**：在每个循环中，使用 `ε-greedy`\
  \ 方法从 `Q table` 为每个三分状态选择策略。\n*   **设置训练终止准则**：在策略训练期间建立目标奖励值。当训练的累积奖励达到该目标值时，训练停止。\n\
  *   进行多次训练，直到 `Q-table` 中的 `Q values` 稳定，然后为每个循环选择 `Q value` 最高的策略。\n\n## 状态与转移概率矩阵\n\
  \n在与三路变化相关的马尔可夫决策过程中，随循环变化的三分状态序列被视为状态集。不同策略的应用产生各种状态转移概率矩阵。这些矩阵决定了下一循环中三分状态的分布。本节采用二次规划来求解不同循环之间的状态转移概率矩阵。\n\
  \n假设仿真轮轮中共有 `n` 个循环，每个循环在应用策略后生成一个三分状态。表示初始循环三分状态分布的向量为：\n\n![Mathtype979-8-3693-1582-8.ch006.m21](img/ch006.m21.png)\n\
