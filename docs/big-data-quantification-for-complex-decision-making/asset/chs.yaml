  \n\n\n\n## 第 10 章\n\n*   张晓侠  \n    山西财经大学，中国\n\n摘要\n\n\n\n\n基于决策蕴涵的知识表示与推理是对数据中隐含的决策信息进行极其紧凑的，并基于当前的表示通过推理获取数据中的所有决策信息。决策蕴涵在逻辑和数据方面的现有研究提出了一组具有信息完整性和极简性（非冗余和最优性）的决策蕴涵，即决策蕴涵规范基（`DICB`），这为在形式环境下构建知识表示与推理框架奠定了坚实基础。本章对决策蕴涵的知识表示能力、不完整形式背景适应性以及基于决策蕴涵的推理等重要问题进行了系统深入的研究。\n\
  \n## 引言\n\n## 形式概念分析简述\n\n形式概念分析（`FCA`）是一种基于阶论的概念分析与可视化方法，由 Wille 在 80 年代中期创立（Wille,\
  \ 1982）。概念是由其扩展和内涵构成的对。概念的扩展是属于该概念的所有对象的集合，其内涵是扩展中所有对象共同属性的集合。`FCA` 建立了内涵与扩展之间的关系，并通过概念格实现了概念泛化与特有化的视觉化。由于其优势，`FCA`\
  \ 已成为数据挖掘（Mouakher and Yahia, 2019; Bartl and Konecny, 2019）、社交网络（Roth et al., 2008）、软件工程（Tilley\
  \ et al., 2005）、基于认知的概念学习（Kuznetsov and Makhalova, 2018）以及知识削减（Konecny and Krajca,\
  \ 2019; Cornejo et al., 2018）。\n\n在 `FCA` 的知识表示与推理研究中，（属性）蕴涵（Ganter and Wille, 1999;\
  \ Qu and Zhai, 2008; Zhai et al., 2012; Ma et al., 2011; Zhai and Li, 2019）以 `A→B`\
  \ 的形式提出，意味着如果 `A` 中的所有属性都满足，那么 `B` 中的所有属性也都满足。Duquenne 等人（V and `J-L`, 1986）构建了所谓的规范基，事实证明其在蕴涵逻辑上是完备且非冗余的（Ganter\
  \ and Wille, 1999; Stumme, 1996），并且在所有完备蕴涵集中是最小的。从形式背景的规范基开始，可以通过应用 Armstrong 规则（Armstrong,\
  \ 1974）获得该背景中的所有蕴涵。\n\n## 决策蕴涵简述\n\n决策蕴涵揭示了条件与决策之间的依赖关系，是一种在决策案例内发展的知识表示与推理理论（Zhai\
  \ et al., 2014, 2015b; Li et al., 2017; Zhang et al., 2021; Zhai et al., 2015a）。与其他决策知识表示相比，例如概念规则（Wu\
  \ et al., 2009; Li et al., 2013a）和颗粒规则（Wu et al., 2009），决策蕴涵已被证明具有更强的表示能力（Zhang\
  \ et al., 2020）。\n\nZhai 等人（Zhai et al., 2014, 2015b; Li et al., 2017; Zhang et\
  \ al., 2021）开展了决策蕴涵，涵盖了语义和语法两个方面。在语义方面，研究考虑了决策蕴涵的可靠性、完备性和非冗余性，以及决策蕴涵基（Zhai et al.,\
  \ 2015a; 20019）。在给定的数据，决策蕴涵的可靠性意味着决策蕴涵是有效的，决策蕴涵的完备性意味着所有决策蕴涵都可以被推导出，决策蕴涵的非冗余性意味着没有决策蕴涵是可以被推出的。在语法方面，提出了两条推理规则，即\
  \ `Augmentation`（扩张）和 `Combination`（组合）。决策蕴涵的推理结果可以应用到 Li et al., 2017; Zhang et\
  \ al., 2021。此外，还探索了基于决策蕴涵的推理策略（Zhai et al., 2014, 2015b）。\n\n## 概念规则与颗粒规则简述\n\n\
  颗粒计算是一个术语，指的是用于分析解决过程中遇到的信息颗粒的理论、方法和工具（Wu et al., 2009; Li and Wu, 2017）。Wu 等人（Wu\
  \ et al., 2009）基于从数据提取的概念格能够表示所有信息这一事实，将颗粒计算视角引入了 `FCA`（Ganter and Wille, 1999）。因此，预计从概念格提取的决策蕴涵也能表示数据的所有信息。Wu\
  \ 等人（Wu et al., 2009）考虑了这种决策蕴涵，称为概念规则，要求决策蕴涵的假设和结论必须是条件和决策的内涵。然而，概念规则与决策蕴涵之间的关系尚未触及（Wu\
  \ et al., 2009）。\n\n`FCA` 的另一个重要结果是任何概念都可以由某些对象的并（join）来表示（Wille, 1982）。受此结果启发，Wu\
  \ 等人（Wu et al., 2009）考虑了对象之间的特殊概念规则，称为颗粒规则，并预期所有概念规则都可以由颗粒规则表示。Li 等人（Li et al.,\
  \ 2013a）通过在概念规则上定义非冗余性实现了目标，并证明非冗余概念规则可以通过合并相应的颗粒规则来表示。此外，Li 等人（Li et al., 2011）提出了一种从决策背景导出所有非冗余概念规则的方法，并在\
  \ Li et al., 2013a 中用更低的复杂度优化了该方法。Li 等人（Li et al., 2013a）还基于概念规则的知识削减（Li et al.,\
  \ 2011）与基于颗粒规则的知识削减（Wu et al., 2009）进行了对比。\n\n\n\n\n数据不完整在现实场景中是一个常见现象。在形式概念分析（FCA）中，不完全形式上下文被用于形式地描述无法对个体进行完整描述的情况。Burmeister\
  \ 和 Holzer 等人开创了不完全形式上下文下的属性探索（`P` 和 `R`，2000；Holzer, 2001；Carpineto and Romano,\
  \ 2004a,b; Ganter, 1999)）。此外，(Holzer, 2004a,b) 提出了一种属性探索算法。此外，属性探索深入研究了交互式协作探索的思想，正如在\
  \ (Ganter and Wille, 1999) 中被广泛研究的那样。\n\n尽管信息系统中缺乏信息，但从知识获取的角度来看，人们期望能够表示蕴含在不完全信息中的知识，并发现不需要先验知识的自动推理规则（Wasserkrug\
  \ et al., 2008）。事实上，在不完全形式上下文领域，对不完全知识建模已经有了大量工作（`S`, 2002；`P` 和 `R`, 2000）。与可以精确描述知识的形式上下文不同，不完全形式上下文中的蕴涵通过评估其在补全（completions）中的有效性来进行语义评估，而补全代表了不完全形式上下文可能形成的不同形式上下文（`P`\
  \ 和 `R`, 2000）。这意味着，当一个蕴涵在不完全形式上下文的所有补全中都成立时，则该蕴涵被认为是必要的；而一个可接受的蕴涵被认为在至少一个补全中成立。可接受的蕴涵和必要的蕴涵都适用于实际应用，并可以有效用于现实场景中的决策和问题解决。Sergei\
  \ Obiedkov (`S`, 2002) 提出了一种推演机制，允许从基推导出所有必要的/可接受的蕴涵。\n\n## 本章的动机与贡献\n\n相比之下，决策蕴涵（decision\
  \ implication）比概念规则（concept rule）和粒度规则（granular rule）更通用，因此应用范围更广（Zhai et al., 2015b,\
  \ a, 2014）。概念规则和粒度规则揭示了意图之间的依赖关系（Wu et al., 2009），它们比决策蕴涵更特殊，且在仅提供概念或对象概念时，它们通常非常有用且易于获取。在本体论等实际应用中正是如此，其中知识通常由概念描述，因此，考虑概念之间的决策蕴涵（即概念规则或粒度规则）可能更为理想。然而，决策蕴涵可能不是概念规则或粒度规则，因为其前提或结论可能不是意图或粒度意图。所有结果都是基础性的，但不足以澄清一个核心问题：概念规则和粒度规则是否具有表示决策蕴涵中所有信息的能力。根据决策蕴涵逻辑，决策蕴涵的一个子集可能保留决策蕴涵的所有决策信息，因此对于闭合决策蕴涵集可能是完备的（Zhai\
  \ et al., 2014）。\n\n从不完全形式上下文的角度来看，属性探索依赖于专家的先验知识，而专家掌握知识的准确性和完备性会影响知识推理的质量。在这种情况下，本文旨在研究自动推理规则，以便在没有先验知识的情况下完全推导出应用于知识库的知识。在现有的推演机制中，必要蕴涵基和可接受蕴涵基并不方便，因为它们递归地涉及所有补全的基，导致生成和推理过程中出现指数级复杂度。需要一种简洁的知识基表示方法来实现基的流式生成并促进推理过程。我们在文中揭示的另一个关键问题是，虽然不完全形式上下文中的必要和可接受蕴涵可以用（完全）形式上下文内的蕴涵来表示，但原始适用于形式上下文的推理规则在应用于这两种类型的蕴涵时可能会产生无效蕴涵。在这种情况下，需要为这两种类型的蕴涵重新制定一种新的知识表示形式和推理规则。\n\
  \n实际上，尽管一个不完全形式上下文可能扩展到大量的形式上下文，但它可以通过采用两个补全来建立有效建模：一个用于对象*确定*拥有的属性，另一个用于对象*可能*拥有的属性（Ganter,\
  \ 1999）。从这种意义上说，产生了一个有趣的概念，即不完全形式上下文的建模基于两个补全。因此，不完全形式上下文的知识表示和推理转化为两个形式上下文内的处理。这种转换为知识获取提供了更通用、更高效的方法。此外，另一个不可忽视的问题是，即使是小规模数据，也可能存在大量的蕴涵，使得它们无法直接应用。因此，寻求蕴涵的紧凑表示是至关重要的。这些集合预计将比闭合集显著减少蕴涵的数量，同时保留闭合集所隐含的信息。\n\
  \n本章对决策蕴涵、概念规则、粒度规则以及基于决策蕴涵的不完全形式上下文知识重表示和推理进行了对比研究。其创新性和贡献如下：\n\n* (1) 证明了概念规则和粒度规则对于决策蕴涵来说是不完备的，且粒度规则对于概念规则来说是不完备的。这意味着当仅使用概念规则或粒度规则研究决策蕴涵，或仅使用粒度规则研究概念规则时，存在信息丢失。在决策蕴涵逻辑的帮助下，我们通过识别无法从概念规则或粒度规则推出的决策蕴涵，以及无法从粒度规则推出的概念规则，揭示了这种信息丢失。\n\
  * (2) 我们通过引入连接最小和最大补全特殊决策上下文，推进了不完全形式上下文的建模。这使我们能够基于特殊的决策上下文重新表示必要和可接受的蕴涵。\n* (3)\
  \ 我们将最初为决策蕴涵设计的推理规则（`Augmentation` 和 `Combination`）扩展到必要/可接受蕴涵。此外，我们引入了 `Reflexivity`\
  \ 规则来共同定义必要和可接受蕴涵集的完备性和非冗余性，并结合 `Augmentation` 和 `Combination` 有效消除内部冗余。建立了必要蕴涵基和可接受蕴涵基，在保留必要/可接受蕴涵所有隐含信息的同时，减少了蕴涵的数量。\n\
  \n\n\n本章其余部分的安排如下：第 2 节回顾了 FCA 中的基本概念和属性。第 3 节对决策蕴、概念规则和粒度规则进行了比较。第 4 节对不完全形式上下文内基于决策蕴的知识再表示和推理进行了比较。第\
  \ 5 节通过结论和未来工作结束本章。\n\n## FCA 中的基本概念和属性\n\n本节简要概述 FCA 中的一些基本概念和属性。\n\n## 形式语境、蕴与概念格\n\
  \n**定义 2.1** (Wille, 1982)形式语境是一个三元组 `K=(G,M,I)`，其中 `G` 和 `M` 分别是对象集和属性集，`I⊆G×M`\
  \ 是对象与属性之间的关系集。对于 `g∈G` 和 `m∈M`，`(g,m)∈I` 表示“对象 `g` 具有属性 `m`”。\n\n形式语境通常用一个二维表表示，其中行标题是对象名称，列标题是属性名称，“1”表示行对象具有该列属性。\n\
