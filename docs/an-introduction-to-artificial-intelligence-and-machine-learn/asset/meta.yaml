- - '##'
  - 步骤 6：现在我们有了一个新表格和表格权重。我们需要对另一个分类桩（stump）重复此过程。学习通过 Adaboost 算法中的这些权重进行移动。为了选择第二个分类桩，我们可以使用加权
    Gini 指数从新权重中选择它。加权 Gini 指数会强调正确分类样本（被上一个分类桩误分类的样本），因为该样本具有最显著的权重。
- - '##'
  - 步骤 7：分类桩和权重修改将重复多次。最后，我们将来自所有树的“发言权”（Amount to say）相加以获得最大分类。这意味着在生产或测试阶段，数据将在所有测试树中执行并获得“发言权”计数。最高的“发言权”计数将决定分类。根据我们的示例，最后，在所有分类桩之后，“愿意参与”
    – “发言权”和“不愿参与” – “发言权”将决定分类。
