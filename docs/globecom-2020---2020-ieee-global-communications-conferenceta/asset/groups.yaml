    # II. BACKGROUND AND RELATED WORK


    # A. Background


    +   1) Browser-based privacy protection techniques: Several browser-based privacy
    protections have been designed to protect end-users from third-party tracking,
    such as Ghostery [5], Disconnect [6], and uBlock Origin [7]. They work effectively
    to detect third-party tracking.


    ![](img/c2a5bacf959b7153149e0b560c03e8c2_1_0.png)


    +   2) CNAME cloaking-based tracking: The usage of DNS CNAME records coupled with
    Content Delivery Network is increasingly commonplace to improve site load times,
    reduce bandwidth costs, and increase content availability and redundancy. CNAME
    has also been used for user tracking. Tracking providers ask their clients to
    delegate a subdomain for data collection and tracking, and link it to an external
    server using a CNAME DNS record [15]. It behaves differently from ordinary third-party
    tracking because it uses the first-party subdomains; browsers and extensions generally
    do not impact these resources.


    For example, when end-users access a site example.com, this site embeds a first-party
    tracker a.example.com, which points to a tracking provider tracker.com via the
    CNAME metric.tracker.com. Tracking provider tracker.com thus track activities
    of end-users on the site example.com (Figure 1).


    # B. Term definitions


    +   1) Request linked to CNAME cloaking-related tracking: An HTTP request by a
    subdomain is used for collecting, and sharing information about a particular user’s
    activities on the web by using CNAME cloaking-based tracking.


    +   2) Site with CNAME cloaking-related tracking occurring: A site sets up a subdomain
    that points to a tracking provider domain using a CNAME record.


    # C. Related work


    +   1) Anti third-party tracking techniques: The privacy hazards of online web
    tracking have been studied extensively.


    Machine learning-based tracking detection: Harrass et al. [9] develop an unsupervised
    detection method that inspects URL queries in HTTP(S) requests to detect tracking
    activities. Yamada et al. [16] analyze traffic at the network gateway to monitor
    all tracking sites in the administrative network and constructs a graph between
    sites and their visited time to detect tracking sites. Wu et al. [8] develop DMTrackerDetector
    which automatically detects third-party trackers offline to efficiently generate
    blacklists using structural hole theory and supervised machine learning.


    Non-machine learning-based tracking detection: Schelter and Kunegis [17] perform
    a large-scale analysis of third-party


    trackers by extracting third-party embeddings from more than 41 million domains
    to study global online tracking. Roesner et al. [11] develop a client-side method
    for detecting and classifying five kinds of third-party trackers on the 500 most
    popular and 500 less popular sites according to the Alexa ranking. To cut off
    the tracking chain of third-party web tracking, Pan et al. [12] develop TrackingFree
    which isolates unique identifiers into different browser principals so that the
    identifiers still exist but are not unique among different websites.


    +   2) Existing in-browser CNAME cloaking-based tracking detection techniques:
    In order to block first-party trackers using CNAME records, uBlock Origin resolves
    the hostname of a DNS record to determine if an underlying subdomain is related
    to CNAME cloaking or not. However, only Firefox with DNS API allows uBlock Origin
    to block the CNAME cloaking [7]. Besides that, the well-know tracking filter lists
    make an continuous effort to manually update first-party subdomains which are
    fronts for CNAME cloaking to these blacklists. It makes day-to-day filter lists
    updating tedious and time-consuming.


    # III. DESIGN AND IMPLEMENTATION


    Here, we describe our method to detect CNAME cloaking-based tracking.


    # A. Method overview


    ![](img/c2a5bacf959b7153149e0b560c03e8c2_1_1.png)


    Our goal is to develop a CNAME cloaking-based tracking detection method using
    machine learning. Our method flags sites and requests related to CNAME cloaking-based
    tracking. As shown in Figure 2, the method consists of four steps: data collection,
    feature extraction, model development, and evaluation.


    +   1) Crawl the target sites, including sites with and without CNAME cloaking
    based tracking, and save all the HTTP requests and their attributes. Then we perform
    DNS lookup for all subdomains, and label all instances automatically by matching
    well-known tracking filter lists with CNAME behind all subdomain as described
    in [18].'
