    # B. Data collection


    1) Finding CNAME cloaking-based tracking with blacklists: We present our method
    to label CNAME cloaking-based tracking. Firstly, we perform DNS queries for CNAME
    answer set on all subdomains of each site. Then, we apply wildcard matching based
    on well-known tracking filter lists to each resolved CNAME in order to detect
    CNAME cloaking base tracking. More specifically, we select third-party tracking
    domains and international third-party tracking domains from Easy privacy list
    [19] and tracking servers list from AdGuard tracking protection filter [14] as
    of April 26, 2020. This approach was used in the previous work [18].


    2) Datasets: We use OpenWPM [20] with vanilla Firefox in April 2020 to crawl 1,762
    sites from Alexa Top 300k where CNAME cloaking-based tracking was previously detected
    [18]. We also crawl 1,762 sites that were randomly picked from all sites without
    CNAME cloaking-based tracking [18]. The stored data is all HTTP/HTTPS requests
    and their responses for each site. Then, applying the method (§ III-B1) to the
    stored crawled data, we find that 4,047 HTTP requests in 1,532 sites used CNAME
    cloaking-based tracking¹.


    We also rely on another dataset crawled on Alexa Top 100K sites using OpenWPM
    [20] in April 2018. We check the historical forward DNS (FDNS) datasets provided
    by Rapid7 [21], and apply the methodology in § III-B1 to detect CNAME cloaking-based
    tracking in this historical data. We find that 2,546 HTTP requests in 1,005 sites
    are related to CNAME cloaking-based tracking. We also use 1,005 additional randomly
    picked sites without CNAME cloaking from this dataset to analyze concept drift
    in § IV-C. The details of the 2020 dataset and the 2018 dataset are listed in
