    [21] 提供的历史前向 DNS（FDNS）数据集，并将 § III-B1 中的方法论应用于此历史数据以检测基于 CNAME 匿装的追踪。我们发现 1,005
    个站点中的 2,546 个 HTTP 请求与基于 CNAME 匿装的追踪相关。我们还从该数据集中使用 1,005 个额外随机选取的不包含 CNAME 匿装的站点来分析
    § IV-C 中的概念漂移。2020 年数据集和 2018 年数据集的详细信息列于表 I 中。


    表 I


    数据摘要：2018 年 2,010 个站点和 2020 年 3,524 个站点。


    | 指标 | 2018 | 2020 |

    |---|---|---|

    | 第三方请求 | 185,896 (62.2%) | 276,686 (63.8%) |

    | 第一方请求域名 | 60,278 (20.2%) | 120,689 (27.8%) |

    | 子域 | 52,476 (17.6%) | 36,399 (8.4%) |

    | 请求总数 | 298,649 (100%) | 433,774 (100%) |

    | 站点总数 | 2,010 | 3,524 |


    ## C. 特征提取


    我们通过实验提取了与站点和请求相关的以下特征。


    ¹数据集可于 https://github.com/fukuda-lab/cname-cloaking 获取


    ### 1) 发生与 CNAME 匿装相关追踪的站点：


    - num_url：站点中的 HTTP 请求总数。

    - num_1st：站点中的第一方请求总数。

    - num_3rd：站点中的第三方请求总数。

    - pct_script_call：站点中与指纹识别相关的方法调用比例。

    - pct_xhr：站点中 XMLHttpRequest 的比例，这是浏览器内置对象，可用于在 JavaScript 中发出 HTTP 请求，以便在 Web
    浏览器和服务器之间交换数据。

    - pct_3rd_window：窗口层次结构中源自第三方 DOM 窗口的请求比例 [22]。

    - ranking：根据 Alexa 排名 [23] 的站点排名。

    - country：基于 Free IP Geolocation API [24] 的站点所在国家。

    - category：根据 2020 年 4 月的 FortiGuard Web Filtering [25] 数据集的站点类别。


    ### 2) 与 CNAME 匿装相关追踪关联的请求：


    - method：针对给定请求期望执行的操作。

    - is_xhr：该请求使用一种 API，该 API 提供脚本化的客户端功能，用于在客户端和服务器之间传输数据。

    - content_type：导致请求的 HTML 标签，例如 image、javascript 或 document，这些标签在此 IDL [22] 中定义。

    - len_url：请求 URL 的长度。

    - len_sub：请求的子域长度。

    - len_prefix_sub：请求的子域前缀长度。

    - num_prefix_sub：子域前缀的数量。

    - prefix_sub_blacklist：子域前缀位于追踪过滤列表 [14] [19] 的子域前缀中。

    - is_sub_dic：子域前缀是英语字典中的单词。

    - entropy_url：通过从请求 URL 计算度量熵得到的请求 URL 的随机性。

    - entropy_sub：通过从子域计算度量熵得到的子域的随机性。

    - entropy_prefix_sub：通过从子域前缀计算度量熵得到的子域前缀的随机性。


    ## D. 建模与初步结果


    首先，我们将 2020 年数据集（表 I）分割为测试数据和训练数据。用于测试的数据占比为 20%。它将在 § IV-A 中用于评估我们的模型。接下来，我们描述如何使用测试数据（2020
    年数据集的 80%）构建分类模型以检测基于 CNAME 匿装的追踪。


    ### 1) 模型交叉验证：


    我们将训练数据集随机分割为 10 个较小的子集（折叠），且不放回抽样，其中九个折叠用于模型训练，剩余一个折叠用于验证。通过重复此过程十次获得 10 个性能估计值后，我们取其平均值作为最终性能估计值。随后，我们比较
    10 种分类算法，并使用分层交叉验证过程在训练数据（2020 年数据集的 80%）上评估其 F1 分数。我们使用 scikit-learn 模块中的 10
    种有监督分类算法（random_state = 2，使用默认参数）：


    - 支持向量分类 (SVC)

    - 决策树

    - AdaBoost

    - 随机森林

    - 极端随机树

    - 梯度提升

    - 多层感知机 (MLP)

    - K 近邻 (KNN)

    - 逻辑回归

    - 线性判别分析 (LDA)


    我们使用 F1 分数来评估分类器的性能。F1 分数越大（≈ 1.0）表示性能越好，值越小（≈ 0）表示性能越差。图 3(a) 显示了在 2020 年数据集中，使用
    10 折分层交叉验证对 10 种选定算法针对发生 CNAME 匿装相关追踪的站点进行检测时的 F1 分数。所有分类算法的检测性能各不相同。最有效的分类算法是随机森林、极端随机树和梯度提升，而支持向量分类、多层感知机和
    K 近邻在该数据集上表现中等。


    图 3(b) 显示了检测与 CNAME 匿装相关追踪关联的请求时的 F1 分数。最有效的分类算法是随机森林和极端随机树，而 SVC 表现最差。


    ### 2) 最佳模型的超参数调优：


    根据之前的性能评估，我们为站点分类检测的超参数调优阶段选择了 RandomForest、ExtraTrees 和 GradientBoosting 分类器。对于请求，我们选择随机森林和极端随机树分类器。


    我们针对 F1 分数对它们全部进行了网格搜索优化。在训练数据上效果最佳的参数设置如表 II 所示。


    表 II


    | 算法 | 参数 | 站点 | 请求 |

    |---|---|---|---|

    | 随机森林 | max_features<br>min_samples_split<br>min_samples_leaf<br>n_estimators
    | 1<br>8<br>3<br>100 | 1<br>2<br>1<br>300 |

    | 极端随机树 | max_features<br>min_samples_split<br>min_samples_leaf<br>n_estimators
    | 10<br>2<br>3<br>300 | 1<br>2<br>1<br>100 |

    | 梯度提升 | max_features<br>min_samples_leaf<br>n_estimators<br>learning_rate<br>max_depth
    | 0.3<br>100<br>300<br>0.2<br>8 | 未选中 |


    ### 3) 模型组合：


    现在，我们有一组性能良好的模型，用于检测与基于 CNAME 匿装的追踪相关的站点和请求。为了平衡各自的弱点，我们组合在概念上不同的机器学习分类算法，并使用预测概率之和来预测类别标签。


    因此，我们使用带软投票的 VotingClassifier 来组合来自以下有监督分类算法的预测：用于检测站点的 RandomForest、ExtraTrees
    和 GradientBoosting，以及用于检测请求的 RandomForest 和 ExtraTrees。各独立算法和组合模型的性能将在下一节中讨论。


    ## IV. 分类性能分析


    我们就检测基于 CNAME 匿装的追踪问题评估我们的模型和特征重要性。我们还使用 2018 年至 2020 年的数据集研究概念漂移。


    ### A. 总体结果


    ### 1) 模型性能：


    表 III 和表 IV 显示了在 2020 年数据集的 20%（保留用于此测试）上使用测试集针对与基于 CNAME 匿装的追踪检测相关的站点和请求所获得的结果。我们首先表明，对于站点和请求，超参数调优后所有分类算法的
    F1 分数均略有提升。接下来，组合模型在检测站点时达到 0.790 的 F1 分数，在检测请求时达到 0.885 的 F1 分数。这些结果表明，组合模型在检测与基于
    CNAME 匿装的追踪相关的站点方面与其他分类器表现相似，但组合模型在检测请求方面效果更好。为了便于后续结果比较，我们将在后续分析中使用组合模型。


    在检查假阴性时，我们发现，某些与 CNAME 匿装关联的站点/请求与没有基于 CNAME 匿装的追踪的站点/请求具有相同的属性。例如，与追踪提供商 Adobe
    关联的 healthpartners.com，仅有六个脚本，且该站点中 XMLHttpRequest 的比例为 0.07。对于请求，请求 https://gjr5.yoigo.com/ea.js
    指向追踪提供商 Eulerian；其前缀 gjr5 不在黑名单中，且不包含任何用户标识。然而，我们认为，如果爬取更多与追踪提供商 Eulerian 关联的请求数据，我们可以将此请求分类为基于
    CNAME 匿装的追踪。


    表 III


    | 指标 | RandomForest 默认/调优 | ExtraTree 默认/调优 | GradientBoosting 默认/调优 | 组合 |

    |---|---|---|---|---|

    | 精确率 | 0.777/0.784 | 0.771/0.763 | 0.781/0.801 | 0.794 |

    | 召回率 | 0.730/0.748 | 0.736/0.770 | 0.779/0.782 | 0.785 |

    | F1 分数 | 0.753/0.766 | 0.753/0.766 | 0.780/0.791 | 0.790 |

