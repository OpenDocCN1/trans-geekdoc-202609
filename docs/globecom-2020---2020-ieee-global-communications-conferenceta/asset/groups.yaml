    ## V. CONCLUSION AND DISCUSSION


    Recently, CNAME cloaking-based tracking on the web has attracted much attention.
    The current best countermeasure, blacklist approach, strongly dependant on realtime
    name resolution. In this paper, we proposed a machine learning approach to detect
    sites and HTTP requests containing CNAME cloaking-based tracking. Through the
    comprehensive analysis, we demonstrated the effectiveness of our method.


    The proposed method complements existing techniques for CNAME cloaking-based tracking
    detection and it can help researchers, browser extensions developers, and blacklist
    maintainers to build highly effective systems against this tracking technique.
    Once tracking providers know the existence of the proposed detection methodology,
    they could attempt to evade it. In future work, we intend to add new features
    to improve our detection performance.


