    ## V. 结论与讨论


    最近，Web 上基于 CNAME 伪装的跟踪引起了广泛关注。当前最佳对策是黑名单方法，该方法强烈依赖于实时名称解析。本文提出了一种机器学习方法，用于检测包含基于
    CNAME 伪装跟踪的站点和 HTTP 请求。通过全面分析，我们证明了我们方法的有效性。


    所提方法补充了用于基于 CNAME 伪装的跟踪检测的现有技术，可以帮助研究人员、浏览器扩展开发人员和黑名单维护者构建针对这种跟踪技术的高效系统。一旦跟踪提供商知道所提检测方法的存在，他们可能会试图规避它。在未来工作中，我们打算添加新功能以提高我们的检测性能。


