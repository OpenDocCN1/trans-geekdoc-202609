    # IV. CLASSIFICATION PERFORMANCE ANALYSIS


    We evaluate our model and feature importance regarding detection of CNAME cloaking-based
    tracking. We also investigate concept drift using our datasets from 2018 to 2020.


    # A. General results


    1) The performance of model: The results obtained using the test set for sites
    and requests linked to CNAME cloaking-based tracking detection on 20% of the 2020
    dataset (preserved for this test) are shown in Table III and Table IV. We first
    show that the F1 score of all classification algorithms improve slightly after
    the hyper-parameter tuning for both sites and request. Next, the combined model
    achieves 0.790 of F1 score for detecting sites and 0.885 of F1 score for detecting
    requests. These results show that the combination model exhibit similar performance
    to other classifiers regarding detection of sites linked to CNAME cloaking based-tracking,
    but that combined model works better for detecting requests. In order to ease
    following result comparison, we use the combined models for further analyses.


    Checking false negatives, we find that some sites/requests linked to CNAME cloaking
    have the same attributes with sites/requests without CNAME cloaking based tracking.
    For example, the healthpartners.com linked to tracking provider Adobe, with only
    six scripts and the proportion XML-HttpRequest in this site is 0.07. For request,
    the request https://gjr5.yoigo.com/ea.js points to tracking provider Eularian;
    its prefix gjr5 is not in the blacklists and it does not contain any user identification.
    However, we believe that if we crawl more data with the request linked to track
    provider Eulerian, we can classify this request as CNAME cloaking-based tracking.


