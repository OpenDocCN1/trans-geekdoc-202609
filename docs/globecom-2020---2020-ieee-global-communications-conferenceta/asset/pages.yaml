- pgno: 0
  md: '# A machine learning approach for detecting CNAME cloaking-based tracking on
    the Web


    Ha Dao

    The Graduate University for Advanced Studies (Sokendai)

    Email: hadao@nii.ac.jp


    Kensuke Fukuda

    NII/Sokendai

    Email: kensuke@nii.ac.jp


    Abstract—Various in-browser privacy protection techniques have been designed to
    protect end-users from third-party tracking. In an arms race against these counter-measures,
    the tracking providers developed a new technique called CNAME cloaking-based tracking
    to avoid issues with browsers that block third-party cookies and requests. To
    detect this tracking technique, browser extensions require on-demand DNS lookup
    APIs. This feature is however only supported by the Firefox browser.


    In this paper, we propose a supervised machine learning-based method to detect
    CNAME cloaking-based tracking without the on-demand DNS lookup. Our goal is to
    detect both sites and requests linked to CNAME cloaking-related tracking. We crawl
    a list of target sites and store all HTTP/HTTPS requests with their attributes.
    Then we label all instances automatically by looking up CNAME record of subdomain,
    and applying wildcard matching based on well-known tracking filter lists. After
    extracting features, we build a supervised classification model to distinguish
    site and request related to CNAME cloaking-based tracking. Our evaluation shows
    that the proposed approach outperforms well-known tracking filter lists: F1 scores
    of 0.790 for sites and 0.885 for requests. By analyzing the feature permutation
    importance, we demonstrate that the number of scripts and the proportion of XMLHttpRequests
    are discriminative for detecting sites, and the length of URL request is helpful
    in detecting requests. Finally, we analyze concept drift by using the 2018 dataset
    to train a model and obtain a reasonable performance on the 2020 dataset for detecting
    both sites and requests using CNAME cloaking-based tracking.


    # I. INTRODUCTION


    There are several reasons websites intend to track user’s browsing activities.
    In some acceptable cases, it is simply to make the user browsing experience faster
    and more convenient. On the other hand, user’s browsing activities are also used
    to determine user browsing habits and preferences for advertisement and analytics
    on the web, which can be frightful for privacy-sensitive users [1].


    Aiming to capture the economic value of user browsing habit through tracking,
    many entities design services to collect user’s information, even without any
    user’s knowledge or consent [2] [3] [4]. There are some effective approaches against
    third-party tracking for user’s privacy-preserving. Ad-blocking and third-party
    tracking protections have been successfully preventing such trackers using blacklist
    [5] [6] [7], machine learning-based detection [8] [9], and others [10] [11] [12].


    However, third-party web tracking has been getting more sophisticated in an arms
    race against these counter-measures. One of the current trends is the exploitation
    of Canonical


    Name Record or Alias (CNAME) record in DNS, to bypass the filter lists in browsers
    and extensions. This technique, called CNAME cloaking-based tracking, uses CNAME
    to disguise requests to a third-party tracker as first-party ones. The current
    counter-measures mainly focus on third-party tracking and do not impact first-party
    resources. CNAME cloaking-based tracking can thus bypass this blocking


    There are some existing methods to detect CNAME cloaking-based tracking. EasyPrivacy
    [13], AdGuard tracking protection [14], and other filter lists manually add new
    first party subdomains which are fronts for CNAME cloaking to these blacklists.
    However, this approach will dramatically increase the size of the blacklists and
    these subdomains need to be updated frequently. Besides that, uBlock Origin since
    version 1.24.1b0 performs a DNS lookup of the hostname loading a resource to determine
    if the underlying subdomain is related to CNAME cloaking or not. Nevertheless,
    only Firefox allows uBlock Origin to block CNAME cloaking because the other browsers
    do not support DNS resolution API [7].


    In this paper, we propose a machine learning approach to detect CNAME cloaking-based
    tracking on the web without dynamic DNS lookup. Our method consists of three steps.
    (1) We crawl a list of target sites and store all HTTP requests with their attributes.
    Then we look up CNAME record of subdomains, and label all instances by applying
    wildcard matching based on well-known tracking filter lists on this CNAME records
    (§ III-B). (2) Next, we extract their features (§ III-C). (3) Finally, we build
    a supervised classification model to distinguish sites and requests using CNAME
    cloaking-based tracking (§ III-D).


    The contributions of this study are summarized as follows:


    +   - We propose an effective method to detect CNAME cloaking-based tracking.
    We obtain a F1 score of 0.790 for detecting CNAME cloaking sites and of 0.885
    for requests (§ IV-A).

    +   - We introduce site-related and request-related features for CNAME cloaking
    detection (§ III-C). We also make a detailed analysis about the discriminative
    power of features regarding CNAME cloaking-based tracking detection (§ IV-B).

    +   - We show that our supervised model also works against newly crawled data
    by analyzing concept drift (§ IV-C).'
