    this procedure ten times, we take their average as the final performance estimate.
    We then compare 10 classification algorithms and evaluate their F1 score using
    stratified cross-validation procedure on the training data (80% the dataset 2020).
    We employ 10 supervised classification algorithms with scikit-learn module (random_state
    = 2 with default parameters):


    +   - Support Vector Classification (SVC)

    +   - Decision Tree

    +   - AdaBoost

    +   - Random Forest

    +   - Extra Trees

    +   - Gradient Boosting

    +   - Multi-layer Perceptron (MLP)

    +   - K-Nearest Neighbors (KNN)

    +   - Logistic Regression

    +   - Linear Discriminant Analysis (LDA)


    We use the F1 score for evaluating the performance of the classifiers. Larger
    values of the F1 score (≈ 1.0) indicate better performance, and lower values (≈
    0) correspond to worse performance. Figure 3(a) shows the F1 scores for the 10
    selected algorithms using 10-fold stratified cross-validation in the 2020 dataset
    for detecting sites with CNAME cloaking-related tracking occurring. All classification
    algorithms have a different detection performance. The most effective classification
    algorithms are Random Forest, Extra Trees, and Gradient Boosting, while Support
    Vector Classification, Multilayer Perceptron, and K-nearest Neighbor achieve moderate
    performances for this dataset.


    Figure 3(b) shows the F1 scores for detecting requests linked to CNAME cloaking-related
    tracking. The most effective classification algorithms are Random Forest and Extra
    Trees, while SVC shows the worst performance.


    2) Hyper-parameter tuning for best models: From the previous performance evaluations,
    we select RandomForest, ExtraTrees, and GradientBoosting classifiers for the hyper-parameter
    tuning phase for site classification detection. For requests, we select Random
    Forest and Extra Trees classifiers.


    We perform a grid search optimization for all of them regarding F1 score. The
    parameter setting that gave the best results on the training data are shown in
    Table II.


    3) Model combination: Now, we have a set of closely well-performing models for
    detecting site and requests linked to CNAME cloaking-based tracking. In order
    to balance out their individual weaknesses, we combine conceptually different
    machine learning classification algorithms and and use the sum of predicted probabilities
    to predict the class labels.


    We thus use VotingClassifier with soft voting to combine the predictions coming
    from the following supervised classification algorithms: RandomForest, ExtraTrees,
    and GradientBoosting for detecting sites, and RandomForest and ExtraTrees for
