    | Easy Privacy list | 0.880 | 0.721 | 0.792 |

    | Adguard tracking filter | 0.918 | 0.417 | 0.574 |


    # B. Feature permutation importance


    We investigate the permutation importance [26] to discuss the feature importance
    of the selected classifier. Figure 4(a) represents the feature permutation importance
    regarding site detection. We observe that the number of script (num_script) and
    the proportion of XMLHttpRequest requests (pct_xhr) are the most useful features.
    In addition, tracking providers are spread across different types of sites [18],
    site category (category) and site country (country) are thus not helpful in detecting
    sites with CNAME cloaking-related tracking occurring.


    Figure 4(b) shows the feature permutation importance of the model for detecting
    the requests. The result reveals that the length of request URL (len_url) has
    the highest importance. We assume that almost requests with a subdomain used for
    CNAME cloaking-based tracking have a bigger length than the request used for collecting
    content of site, because they contain user'' identification. Also, the subdomain
    prefix length (len_prefix_sub), the XHR usage request (is_xhr), and the randomness
    of URL request (entropy_url) are discriminative features for request detection.
    In addition to that, the sub-domain prefix blacklist presence (prefix_sub_blacklist)
    is not effective to detect requests. This is because some publishers also use
    the same subdomain prefix that is used for both CNAME cloaking and other non-tracking
    resources.


    # C. Concept drift analysis


    Finally, we investigate the ability to detect sites and requests related to CNAME
    cloaking-based tracking in the latest dataset (2020) using a model trained on
    the old dataset (2018). We use the 2018 dataset to train a model and test it on
    new data collected in 2020 (Table I). We apply the method explained in § III-D
    to build a model and obtain the results in Table VI.


    # TABLE VI RESULTS OBTAINED USING THE NEW SITE/REQUEST IN 2020 DATASET TO EVALUATE
    THE 2018 DATASET MODEL.


    | Instance type | Precision | Recall | F1 score |

    | :--- | :--- | :--- | :--- |

    | Site | 0.608 | 0.787 | 0.686 |

    | Request | 0.935 | 0.558 | 0.699 |


    Our result shows that the performance degradation is limited. Specifically, F1
    score for sites with CNAME cloaking-related tracking decreases by 0.104, and by
    0.186 for requests. To explain this degradation, we examine the 2018 and 2020
    datasets. In 2018, we do not see many random subdomain prefixes and short requests,
    while it is the case in 2020. For sites, we observe a decreasing number of requests,
    including third and first-party request for each site in the 2020 dataset. These
    changes can be plausible reasons for the degradation in our model. Besides that,
    with rapid changes of web technology, tracking providers might also adjust their
    target site and change'
