    2) Comparison with the well-known tracking filter lists: To block CNAME cloaking-based
    tracking without DNS resolution, well-known tracking filter lists such as the
    EasyPrivacy list and the AdGuard tracking filter list include the first-party
    subdomains which are fronts for CNAME cloaking. We compare the request detection
    performance between our machine learning approach and these tracking filter lists
    in Table V. We confirm that our method outperforms the evaluated blocking lists.
    Meanwhile, almost all browsers (except Firefox) do not provide a DNS resolution
    API which is critical CNAME cloaking-based tracking detection [18]. Beyond automating
    blacklist building, our approach is thus especially helpful to block CNAME cloaking-based
    tracking.


