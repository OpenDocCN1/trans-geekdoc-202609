    # 加密货币


    ## 投资日志

    一份加密货币投资基础的引导式日志


    [Guru Notebooks](https://gurunotebooks.com)


    版权所有 © PV


    本精简易于使用的引导式日志将帮助你上手加密货币投资基础。这是印刷版的电子书版本，可以在大多数数字设备上使用。本引导式日志允许五十条记录。书中包含了电子书的使用说明。


    本引导式日志仅作为帮助你深入思考加密货币投资基础的工具。它旨在被用作起点和参考。


    在出版时，加密货币属于高风险投资。本书既不鼓励也不反对投资加密货币。投资加密货币可能导致本金、资金和财富的巨大损失。建议您咨询认证且信誉良好的受托人，获取有关加密货币和其他区块链技术投资的专业建议。


    投资可能会带来压力。从投资决策中消除情绪至关重要。正念和冥想是帮助你清晰思考下一个决策的极佳练习。您可以在 Amazon 上的 [30-Days-Now 书系列](https://www.amazon.com/dp/B08XY4MLG5)
    页面或 [30DaysNow.com](https://30daysnow.com/) 正念指南。


    访问 [GuruNotebooks.com](https://gurunotebooks.com) 获取具有引导和启发性的笔记本，或访问 Amazon 上的
    Guru Notebooks 作者页面来发现适合您的笔记本。


    ## 如何使用本电子笔记本


    1. 当在记录区域看到 `Note` 单词时，请高亮该词。

    2. 选择您设备上允许您输入笔记/评论的功能。

    3. 输入您的笔记并保存。


    *如果您没有看到 `Note` 单词但被提示提供答案，请根据您的判断，高亮问题或所提供选项中的一个词，以输入您的笔记、答案或评论。*


    ## 基础知识：


    引导式日志包含一个目录页，允许您对记录进行日期标记和命名以便参考。只需高亮每个目录条目旁的 `Date/Title`，并根据您的意愿为其赋予标题、标签或名称。然后您可以轻松地在目录页与特定记录之间来跳转。


    使用您设备的笔记或注释应用程序记录并保存您的笔记。每当在记录区域看到 `Note` 单词时，请高亮它，然后使用您的设备轻松输入您的评论。您的设备（电子阅读器、平板电脑、Kindle、手机、笔记本电脑等）应配备易于使用的笔记功能和菜单。


    设备上的笔记选项名称可能不同——因此在高亮 `Note` 单词后，请寻找 `Note`、`Create Note`、`Add Note`、`Comment`
    或您的设备使用的任何名称。


    此外，可能存在没有 `Note` 单词但会向您提问或提示输入信息的记录区域。在这种情况下，请根据您的判断，高亮与该提示或问题相关的最近词或术语。


    本电子书是为了配合印刷版设计的。


    ### 您有想要分享的笔记或见解吗？


    使用 `#CryptoGuruNotes` 在线分享您的加密货币笔记。别忘记发布时包含 `#GuruNotebooks`！通过分享，我们可以共同探索加密市场。


    ## 内容：加密货币


