    # What exchange (intermediary) will you use to invest in this cryptocurrency?

    (Exchange name, website, physical address, birth date of exchange, method of payment,
    etc)


    ## Fees and Transaction Costs

    (What are the fees and costs for buying, selling, holding, and withdrawing this
    coin from the exchange? Are the fees spread, fixed, or variable? Does trading
    activity impact fees, costs, and taxes? Are there any foreign exchange fees? Get
    to know all the fees, penalties, and costs associated with the exchange!)


    ## Security and Privacy

    (What’s the level of security provided by the exchange? You can describe the account
    creation process, any security and privacy issues reported by customers, user
    interface or platform complaints, API wallet issues, any digital wallet issues
    reported, etc.)


    ## Your Basic Assessment of the Investment

    (How risky is this investment? How much money are you willing to invest and be
    comfortable losing? What else do you need to review and research?)


    ## [Cryptocurrency](#text00004.html#CON23)

    ### Cryptocurrency Name/Symbol

    ### Today’s Date

    ### Coin Price

    ### Trading Volume

    ### Market Cap

    ### Performance to Date

    (3 Month Return %, 6 Month Return %, 1 Year Return %, 5 Year Return %, 10 Year
    Return %, Max Return %)

    ### Peak Historical Price and Lowest Historical Price


    ### Summarize the data above and determine the value:

    (How long has the coin been in circulation, have the returns been volatile or
    steadily increasing over many years, what is the total value of coins that have
    been mined to date, does the current price reflect the market capitalization,
    is the price inflated or overvalued, etc?)

