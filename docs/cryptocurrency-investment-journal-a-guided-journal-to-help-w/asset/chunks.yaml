    # Cryptocurrency


    ## Investment Journal

    A guided journal for crypto investing basics


    [Guru Notebooks](https://gurunotebooks.com)


    Copyright © PV


    This streamlined and easy-to-use guided journal will help you get started with
    cryptocurrency investing basics. This is the e-book version of the print copy
    and can be used on most digital devices. This guided journal allows for fifty
    entries. Instructions for using this e-book are included.


    This guided journal is strictly a tool to help you think through the cryptocurrency
    investing basics. It is meant to be utilized as a starting point and reference.


    At the time of this publication, cryptocurrency is a high-risk investment. This
    book does not promote nor discourage cryptocurrency investment. Investing in cryptocurrency
    can result in a substantial loss of principal, capital, and wealth. It’s advised
    that you consult a certified and reputable fiduciary for professional advice regarding
    cryptocurrency and other blockchain technology investments.


    Investing can be stressful. It’s important to remove emotion from investment decisions.
    Mindfulness and meditation can be great practices for helping you think clearly
    about your next decision. Mindfulness guides can be discovered at the [30-Days-Now
    book series](https://www.amazon.com/dp/B08XY4MLG5) page on Amazon or at [30DaysNow.com](https://30daysnow.com/).


    Visit [GuruNotebooks.com](https://gurunotebooks.com) for notebooks that guide
    and inspire, or visit the Guru Notebooks author page on Amazon to discover a notebook
    that works for you.


    ## How to Use this E-Notebook


    1. Highlight the word `Note` when you see it within an entry area.

    2. Choose the function on your device that allows you to enter notes/comments.

    3. Enter your notes and save.


    *If you don’t see the word `Note` and are prompted to provide an answer, use your
    discretion and highlight a word in the question or the choices provided to enter
    your note, answer, or commentary.*


    ## The Basics:


    The guided journal comes with a Content page that allows you to date and title
    entries for easy reference. Simply highlight `Date/Title` next to each Content
    entry and give it a title, label, or name at your discretion. You can then easily
    link back and forth to a specific entry from the Content page.


    Use your device’s note or comments application to record and save your notes.
    Highlight the word `Note` whenever you see it in an entry area, and then use your
    device to easily enter your commentary. Your device (e-reader, tablet, kindle,
    smartphone, laptop, etc) should come equipped with an easy-to-use note-taking
    function and menu.


    The note-taking option on devices may be titled differently – so after you highlight
    the word `Note`, look for `Note`, `Create Note`, `Add Note`, `Comment`, or whatever
    name your device uses.


    Also, there may be entry areas that do not have the word `Note` but may ask you
    a question or prompt you to enter information. In this case, please use your discretion
    and highlight the nearest word or term associated with that prompt or question.


    This e-book was created to accommodate the print version.


    ### Do you have notes or insights to share?


    Share your cryptocurrency notes online by using `#CryptoGuruNotes`. Don’t forget
    to include `#GuruNotebooks` with your post! By sharing, we can explore the crypto
    market together.


