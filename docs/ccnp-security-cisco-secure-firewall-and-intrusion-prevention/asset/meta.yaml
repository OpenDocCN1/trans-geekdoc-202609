  - 第 11 章：预过滤策略 (Prefilter Policy)
- - '###'
  - “我掌握这些了吗？”测验
- - '##'
  - 绕过深度包检测
- - '##'
  - 预过滤策略最佳实践
- - '###'
  - 通过预过滤策略启用绕过
- - '###'
  - 前提条件
- - '###'
  - 在预过滤策略中配置规则
- - '###'
  - 步骤10：可选，为此预过滤规则启用日志，这样当流量匹配此规则中的条件时，威胁防护就会生成日志并将其发送到中心。这有助于你判断策略是否运行，以及是否有预期的流量绕过了。执行此操作，转到
    `Logging` 选项卡并选择 `Log at Beginning of Connection` 连接开始日志或 `Log at End of Connection`
    连接结束日志（参见图11-9）。不要同时选择两者，因为可能会影响性能。
- - '###'
  - 步骤11：点击 `Add` 按钮完成规则配置，返回到策略编辑器页面。
- - '###'
  - 步骤12：在策略编辑器上，保持默认操作为 `Analyze All Traffic.`（分析所有流量）。点击 `Save` 按钮保存你在此自定义预过滤策略中进行的所有更改（参见图11-10）。
- - '###'
  - 在访问控制策略中调用预过滤策略
- - '###'
  - 步骤1：导航到 `Policies > Access Control > Access Control`。出现 `Access Control Policy`
    页面（参见图11-11）。
- - '###'
  - 步骤2：要修改你想要部署到威胁防护的策略，点击策略旁边的笔图标。访问控制策略将打开到策略编辑器页面（参见图11-11）。
- - '###'
  - 步骤3：查看策略编辑器页面的上方。你将找到当前选的预过滤策略。默认情况下，访问控制策略使用默认预过滤策略。点击当前预过滤策略名称。出现 `Prefilter
    Policy` 弹出窗口。
- - '###'
  - 步骤4：`Prefilter Policy` 窗口在下拉列表中显示可用的预过滤策略。选择 `Custom Prefilter Policy` 并点击 `OK.`。
- - '###'
  - 步骤5：现在你完成了两个阶段——配置新的预过滤策略并将其调用到访问控制策略中——你已经准备好部署策略了。转到 `Deploy > Deployment`，选择你想部署策略的威胁防护设备，并点击
    `Deploy` 按钮开始部署（参见图11-13）。
- - '###'
  - 通过访问控制策略建立信任
- - '###'
  - 步骤1：导航到 `Policies > Access Control > Access Control`。出现 `Access Control Policy`
    页面（参见图11-11）。
- - '###'
  - 步骤2：要编辑你想要部署到威胁防护的策略，点击策略旁边的笔图标。访问控制策略将打开到策略编辑器页面（参见图11-11）。
- - '###'
  - 步骤3：在策略编辑器上，点击 `Add` 按钮创建新的访问控制规则。
- - '###'
  - 步骤4：命名访问控制规则并选择 `Trust` 操作。
- - '###'
  - 步骤5：转到 `Ports` 选项卡并选择 `HTTP` 和 `HTTPS` 作为端口。同样，在 `Networks` 选项卡，选择子网 `192.168.0.0/16`
    作为网络。
- - '###'
  - 步骤6：可选，转到 `Logging` 选项卡启用日志，以便威胁防护该连接。选择 `Log at Beginning of Connection` 或 `Log
    at End of Connection`。不要同时选择两者，因为可能会影响性能（参见图11-9）。
- - '###'
  - 步骤7：点击 `Add` 按钮完成规则。返回策略编辑器页面。
- - '###'
  - 步骤8：使用下拉列表选择默认操作。选择威胁防护进行深度检查。
- - '###'
  - 步骤9：点击 `Save` 按钮保存更改（参见图11-18）。
- - '###'
  - 步骤10：最后，转到 `Deploy > Deployment` 并选择威胁防护设备。点击 `Deploy` 按钮在威胁防护设备上激活。
