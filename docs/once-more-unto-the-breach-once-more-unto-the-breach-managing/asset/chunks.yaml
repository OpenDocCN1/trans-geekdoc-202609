- fmt: "\nFrom an academic perspective, the author is both examining the historical\
    \ methodology – seeking to review the history of `IA` and why it is that there\
    \ is so little real agreement with regard to the correct definition – and building\
    \ a grounded theory, whereby through interactions and research, the author creates\
    \ a theory and then tests it over a period of time. The author’s contention is\
    \ that it is as a result of a fundamental lack of knowledge that we now have difficulty\
    \ (and confusion) in progressing to a mature `IA` profession. Health warning –\
    \ I should say up front that this book won’t pull any punches.\n\nWhen this book\
    \ originally came out, it focused on a period of time between 2009 and 2011. In\
    \ many media reviews of the time 2011 was hailed as the year of the hacker, in\
    \ terms of the volume of media coverage and, therefore, widespread global awareness,\
    \ and was noted to be a year of significant data breaches and losses because of\
    \ the large numbers of individuals directly affected or impacted. Today we regularly\
    \ see reports of well-known companies falling victim to cyber attacks, and the\
    \ situation that seemed exceptional in 2011 has become the norm. In fact, given\
    \ the volume of breaches experienced since this book was first published, its\
    \ contents have never been more accurate or more appropriate. 2014 in particular\
    \ was a year of extreme activity, with vulnerability after vulnerability being\
    \ experienced across all operating systems – including the first significant chink\
    \ in the armour of all things *nix* (with the Bourne Again Shell – `BASH/Shellshock`\
    \ vulnerability). In reality, the breaches that are covered by the media are only\
    \ the tip of the iceberg, and the longer you work in the industry the clearer\
    \ this becomes.\n\nBeneath the story reported by the media there is usually a\
    \ raft of information security-based failings that have been present for quite\
    \ some time.\n\n## Security is having a bad decade….\n\n*So many breaches!*\n\n\
    * 10/2014: Home Depot (53m records)\n* 9/2014: Home Depot (56m cards)\n* 8/2014:\
    \ JPMorgan Chase (83m records)\n* 6/2014: iCloud (celebrity ‘hacking’)\n* 5/2014:\
    \ eBay (145m records)\n* 12/2013: Target (110m records)\n* 10/2013: Adobe (152m\
    \ records)\n\nAnd on, and on … It.s obvious there are some serious issues to be\
    \ addressed. \n\nAll of these, one after the other, like multiple buses arriving\
