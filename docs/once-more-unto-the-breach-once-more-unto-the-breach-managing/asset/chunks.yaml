    另一位用户从未将他们的笔记本电脑连接到网络，因为他们只在家里使用。他们将数据从工作电脑传输到加密的 `USB` 优盘中，然后在家里使用笔记本工作。显然，他们没有意识到这导致笔记本电脑可能暴露在风险之中，因为该电脑从未更新过防病毒软件，也没有应用过补丁。


    一个特定的团队会对他们的工作内容拍照并将其存放在笔记本电脑上，而这台电脑既没有密码保护，也没有存放在锁着的柜子里。


    一名用户在笔记本电脑上将 16,000 条记录传输到 `CDs` 时，所有的记录、笔记本和 `CDs` 都从用户家中被盗了。这等同于另一家规模机构发生的类似事件，该机构被监管机构处以巨额罚款，但在本例中，用户是受独立第三方提供商派遣的。这由谁来承担后果？


    ## 电子表格与附件


    许多团队仍然在电子邮件中使用电子表格和 Word 附件，而不是将数据输入到现有的企业系统中。因此，当这些电子邮件四处传输（无论是在安全的企业系统内部还是外部）时，存在数据丢失的风险。这种情况在大多数组织中每天发生，但并不意味着底层问题不需要解决。需要鼓励人们分享超链接，而不是发送邮件附件。更大任务的一部分是维护一份关于可用企业系统数量及其使用水平的时间线，并将其与其中包含信息的敏感性水平进行对比。如果数据被“提取”出来是为了转换成更适合用户使用的格式，这将导致更大的风险——因此，需要考虑数据防泄露机制。


    ## 邮寄失败


    一份原始协议被发送到了错误的人手中，且发送到了错误的机构。他们被要求通过邮寄寄回，但信件丢失了。现在，你该怎么办？如果需要的话，应该向谁报告这次违规？这些小事件一直在发生，你的雷达需要对它们保持敏感。根据具体情况，你能够提出合适的解决方案，但要做好成为相关人员关注点的准备，因为他们正努力平复自己像被路灯下的兔子一样被抓获时的恐慌。


    然而，他们还制作了一份邮寄指南，其中没有提到任何保护标记或对大量数据的处理。这又是一个典型的“孤岛思维”案例，人们孤立地无法理解在涉及信息资产的任何活动中参与
    `ISM` 的必要性——通常，只有当人们接受并理解什么是信息资产时，改变才能开始。


    ## 打印问题


    打印服务器没有正确设置，因为文件服务器、打印服务器以及旧打印机没有被妥善移除或报废。这是另一个“需要记住的事项”，因为当用户选择默认打印机并试图维持他们的工作模式和生产力时，这会给他们带来混乱。


    ## 可移动媒体管理


    部门之间收到了矛盾的通信信息。一个团队被告知他们的部门负担不起加密的 `USB` 优盘，于是他们转而从商店购买。其他用户以类似的方式购买了便携式硬盘备份数据，该硬盘也没有加密。便携式硬盘被带回家，数据随后被用于远程办公。如果在任何时候它遗失或被盗，对该组织来说将是一次令人尴尬的数据泄露。你的组织规模越大，越难同时向所有人传达正确的信息，除非你有授权这样做。但这类事件确实说明了获得许可以人类所能的最快速度发送此类信息的必要性。


    事故和挫败感随处可见。一家第三方集成提供商花费两年试图关闭一台服务器，因为该服务器允许垃圾邮件通过其适当的保护软件通过。软件可以检测到它，但服务器配置错误、版本过旧且脱离监控。遗憾的是，委员会会议接连一场地召开，没有任何进展。在此期间，该组织一直面临风险。


    ## 访问控制问题


    组织中有的用户可以通过远程连接获得全系统访问权限，因此有能力将所有内容复制到他们的家用电脑上。在这样的时刻，你的本能是感到绝望！诚实地说，考虑到监管机构的预期，保留和维持控制的能力可能是极其有限的。


    ## 密码管理异常


    在登录组织内网时，密码似乎是明文可见的，且 90 天重置密码的功能未生效。用户们对全量重置密码的部署准备得非常充分，因此他们对这类异常警觉性很高，这些异常是由于边缘部门并不总是被纳入系统变更范围内。这绝对是
    `ISM` 需要继续向 IT 同事施压以跟进的情况。


    ## 物理安全困境


    某个人参加完安全意识简报会后回到办公桌，将手机插着电源充电，将钱包放在桌子上，然后冲了出去。他们回来取钥匙，但仍然留下了所有其他个人物品。噢，真是讽刺！


    （ISM 解决方案——准备一个工具包，其中除了许多东西外，你还有一套明片，可以在人们犯下蠢事时留在他们的桌子上！）


    在特定情况下，该团队所在的建筑在下午 6:30 之前门都没有锁。人们关上了百叶窗，但把钥匙留在了柜子和钥匙柜里，并在桌子上留了大量文件和物品。还有无法锁的抽屉柜。


    客人在会议结束后没有被护送离开，但他们完全可以走过多个未锁的屏幕，看到屏幕上显示的组织和公民敏感信息。


    这类事情可以完全按照我们在第 2 章中发现结果的方式进行报告。


    所有这一切都在发生，但仍然有人认为信息安全与他们无关，或者认为不值得设立一个全职职位来负责！

    '
- fmt: '

    When your pet project gets cancelled, how do you move forward? Therein lies the
    rub of labelling anything in the information security space as a ‘project’. As
    we have seen throughout this book, it needs to be incorporated into the DNA of
    the organisational infrastructure and so there is no ending, as it is constantly
    changing and adapting to the threat and vulnerability landscape within which we
    are operating.


    Equally, as an ISM, you need to know the business. The IT community in its entirety
    is so often charged with ‘not understanding the business’, so as a professional
    (see section below) it is important that you take the time to learn as much as
    you can about your environment – as we saw and learnt in `[Chapter 1](#09_ch01.xhtml#ct1)`.
    This is most often referred to as ‘situational awareness’ and requires constant
    vigilance, in particular, to assimilate the nuances of both the culture and the
    language being used by those around you, so that you can seek to mirror it. The
    more you can successfully achieve this, the better your results will be when you
    are trying to either change behaviour or gain support for a change in activity
    – any change which is designed to provide greater security and protection for
    both the individuals to whom the change will apply and the individuals whose information
    may be tangentially involved, too.


    ## The life of an information security manager


    So what have we learnt about being an ISM?


    You should never be idle or bored, that’s for sure! It is possible to try to apply
    some level of structure across your year, if you are not experiencing too much
    organisational flux or change. There are constantly recurring themes – laptop
    management, password management, access control, server management, etc. This
    is to be expected. Things reoccur which would disappear once dealt with, but which,
    if you just stick on a plaster, will keep on coming back. Your role is very much
    one of providing solutions, often in difficult circumstances, so think creatively,
    too.


    It’s an ‘always on’ existence, as you are always considering the dangers that
    may arise. The more you allow this kind of thinking to become second nature, the
    more you can apply the solutions you come up with to your day-to-day role.


    How long does it take for something to become an established discipline, understood
    and followed by all? What is the motivation for adoption? Will mandating make
    this adoption more successful? Your user base will, in some cases, have a ‘what’s
    in it for me?’ mentality and you must be sure to address it. We have seen that
    there will be challenges around compliance: personalities, prioritisation, internal
    versus external politics, convergence, centralisation and professionalism. Ultimately,
    you will need collaboration to gain trust – across teams and across the whole
    organisation. You need to be a counsellor, guide and adviser, busy all the time
    working out ways to inspire and enthuse those around you!


    In the preface, I described the reality; that so many people find themselves in
    the role of ISM after having it presented to them as a ‘gift’. So, often, you
    are left feeling like you have received a poisoned chalice. It is a constant uphill
    battle trying to persuade people to do different things.


    Imagine, if you will, that you are in the care of the dental hygienist. Over the
    years, the dental practice has found that they can reduce time spent in the dentist’s
    chair by increasing the time spent in the dental hygienist’s chair, instead. It’s
    not clear that this is any more pleasant for anyone, but the idea is that they
    are moving from a reactive to a more preventative approach. So the dental hygienist
    will tell you, on each and every occasion that you visit, that you need to floss
    more, you need to use the interdental brushes and you need to work your main brush
    into the gaps between your teeth to reduce plaque and ultimately reduce tooth
    decay and gum disease. You can end up feeling both patronised and chastised by
    this, in equal measure, depending on your behaviour. It comes down to the choices
    you have made in the intervening time.


    Delivering robust information security into and across your organisation can be
    considered in alignment with this thinking. What you are trying to do is implement
    controls that will be prove to be preventative and will reduce the need for fire-fighting.
    They will protect the information assets of all concerned (the teeth) if suitably
    constructed and enforced.


    As the ISM, there will be a time when you will need to take on battles with the
    organisation itself, effectively holding up the mirror of sense in the face of
    seemingly nonsensical and conflicting requirements. If you spot inconsistencies
    with regard to the planned roll-out of systems, find a way to communicate this.
    This is not a role for a wallflower.


    ## Things I haven’t spent a lot of time on


    These include other frameworks (e.g. `COBIT®®`), regulatory requirements (e.g.
    the `PCI DSS`), standards (e.g. `ISO27001`) and activities, such as undertaking
    back-up, risk assessments and business continuity planning. Some of these activities
    could be done in February, as it seems to be a quiet month! There are many great
    resources to address all of these issues directly. There will no doubt be other
    things, too, that you might think I should have spent some time on. I hope that
    this goes to illustrate quite how much there is to be done in the role of ISM.
    I may not have focused on everything, but it all needs to be done!


    In many ways, we have only scratched the surface. There’s a long career available
    to you if you take up the challenge of being chief protector of all things information
    in your organisation! Or, at least caring enough to try and grab attention from
    as wide an audience as possible across your organisation.


    ## Closing thoughts


    What this book was designed to do was take the reader on a journey through a year
    in the life of an ISM. This has been delivered in a combination of real time and
    the past tense, and I hope the reader will forgive that as it is only from reflecting
    on the past that we can learn lessons for the present and adapt the learning for
    the future.


    There may be no particular ‘eureka’ moments, but it is hoped that putting together
    these thoughts and experiences in one place will provide a level of sanity checking
    that will be helpful in ensuring you get the best out of your day-to-day interactions
    in the role of ISM. You are an important company asset.


    Some thoughts to help consolidate learning points:


    - Don’t constrain yourself to technological concerns. Think more broadly.

    - Have a mission and do all you can to stick to it. For example, ‘Information
    is at the heart of all we do, and we will all endeavour to protect it accordingly.’


    I hope that you have seen enough to be sure that it’s a full-time job and to be
    confident in explaining to your management why it should be kept as such and resourced
    appropriately.


    A lot of work going on in the industry to professionalise IA in particular. Certifications
    are already available for information security professionals. This all holds tremendous
    value and you should either be involved in development from the ground up, or
    ensure that you are maintaining your own continuous professional development.
    For example, as a result of reading this book, it may be that you need to focus
    on information and RM learning.


    Read old internal audit reports – and obviously new ones, too!


    Be a member of the relevant bodies, for example:


    - `ISACA`: `[www.isaca.org.uk/](http://www.isaca.org.uk/)`

    - `ISSA`: `[https://issa.org/](https://issa.org/)`

    - `ISSP`: `[www.iisp.org/](http://www.iisp.org/)`

    - `BCS`: `[www.bcs.org/](http://www.bcs.org/)`

    - `IAPP`: `[www.privacyassociation.org/](http://www.privacyassociation.org/)`

    - `AIIM`: `[www.aiim.org/](http://www.aiim.org/)`

    '
