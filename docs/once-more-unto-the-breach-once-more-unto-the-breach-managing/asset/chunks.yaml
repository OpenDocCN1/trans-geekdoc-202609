    all of the time and, if not, how best to store it in a secure way that is suitable
    for the likely classification of the information itself. Of course, there’s the
    rub. If you haven’t identified the information assets and applied the classification
    in a way that labels your information to be identified and distinguished sufficiently,
    then it will be difficult to know how to make distinctions between the different
    types of information and how best to look after it.


