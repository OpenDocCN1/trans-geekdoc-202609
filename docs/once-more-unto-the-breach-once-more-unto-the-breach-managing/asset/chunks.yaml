    A standard corporate desktop PC may have up to eight `USB` ports. Some are required
    for peripherals, such as a keyboard or security token reader, but there are usually
    one or more unused ports. In the case of the organisation used as the example
    in this book `USB` ports are ‘always on’ by default, ready to serve any `USB`-enabled
    device that is plugged into the endpoint computer.


    Your organisation may choose to disable `USB` access via the Windows^® Group Policy
    and an Active Directory Management (ADM) template, but this action does not provide
    administrators with granular control. It’s all or nothing, so all `USB` ports
    on an endpoint are either available or not. And since most endpoints now require
    `USB` for mandatory peripherals, this control is practically useless. Solving
    this difficulty can require project team resources to investigate the best approach
    with regard to port control. However, cost may often dictate that a cheaper solution
    be deployed, even if it provides less security overall – and increases administrative
    overheads. This is just another of the many conundrums your role will involve
    you in, seeking to provide guidance and steering, and the best overall solution
    to meet all needs. It’s a tall order and a difficult task.


    Following a change in the political landscape and the resultant pull-back on spend,
    the intended port control project was stalled, so the control of removable media
    devices was not progressing as planned. A less expensive interim solution was
    being put in place using Active Directory to control ports. This highlighted an
    interesting difficulty with regard to tactics and approach. The accuracy of the
    data held within the Active Directory listing is always a vital starting point.
    Also, the Global Address List (`GAL`) is a fundamentally important element of
    your organisation’s configuration and it is vital that you have accurate and up-to-date
    information contained therein. When it comes to users, it harks back to our references
    to the need to have an up-to-date user listing, so that you know who your user
    base is – and this can only be achieved and maintained with the assistance of
    the various teams that manage people in and out of the organisation. You also
    need to know who might require being on the ‘exception’ list, for whatever justified
    and risk-assessed reason, so that they can be excluded from any ‘apply all’ setting
    that is fixed in the Active Directory as a way to roll out a policy setting for
    all users.


    In reality, so many of your tasks and challenges as an ISM will come back to this
    kind of conundrum – you cannot do anything effectively without quality information
    and a solid foundation upon which to move forward.


    ### Outsourcing functions


    When your staff are moving from your organisation to an umbrella third-party agency,
    can they really take their e-mail `.pst` files with them? If so, what level of
    review of these should take place, to ensure that your organisational information
    assets are not leaving inadvertently – particularly if the owner of the `.pst`
    was using it as a file repository system (records management store), as is mostly
    the reality. Just another of the myriad of conundrums you may face and which require
    answers appropriate for your organisation. If only it was possible to wave a magic
    wand and say that one answer fits all. The principles and the approach are the
    same, though. Consider the information assets at risk, the threat, the likelihood,
    the impact (on whom), etc. – and apply appropriate controls accordingly.


    ### Security incident


    An individual received 50 payslips in a brown envelope at their home address.
    They were on a short-term contract before going back to college and their own
    payslip was posted to their home, but obviously they were not expecting this.


    ### Security awareness theme


    Being a security professional, this is a topic I am passionate about. The awareness
    of security is vital for any organisation. It is not just about the tools, but
    about the people and the culture. Employees need to understand the risks and how
    to protect themselves. This is a continuous process, not a one-time event.


    ### Security awareness theme


    Security awareness security security security security security security security
    security security security security security security security security security
    security security security security security security security security security
    security security security security security security security security security
    security security security security awareness security security security security
    awareness. The goal is to foster a security-aware culture.


    ### Chapter summary


    Another brief, you need to “prove all things; hold fast that is good” (1iansians5:21).


    ### CHAPTER 11: WHAT THE AUDORS SHOULD’T


    #### Internal audit has history


    The relationship with internal audit can often be fractious, but at the outset
    of this book, the intention was to portray information security in a positive
    light. Befending internal audit is very much part of the experience because you
    can often find that any changes you need to implement have already been identified,
    long ago and many times over, in previous audit reports.


    In the case of the organisation at the heart of many experiences, it had been
    subject to ‘special measures’ and was fraught with political infighting. This
    had a highly detrimental impact on the ability of the organisation to run effectively
    and efficiently. While it may feel that this is straying the bounds of a typical
    ISM role, it is vital to understand the landscape within which you are forced
    to operate. You can then continue to make the necessary progress, in spite of
    all that is going around you. There is always a ‘bigger picture’, an historical
    context to be considered and remembered while in the eddies of political wrangling.


    The chronology in `Table 7` is designed to show how much history there can be
    in your organisation if you look for it - an understanding of the timeline which
    you are working can be most useful.


    **Table 7: Organisation’s history**


    | Date | Description | Comments |

    | :--- | :--- | :--- |

    | May 1997 | Finance and general purposes subcommittee paper entitled ‘Information
    technology – contingency planning and disaster recovery’. | “… planning to introduce
    best-practice notes during the course of 1997/1998 to aid departments to consider
    the issues involved.” None have been specifically evidenced.<br><br>Sadly, the
    hard copy available states “never sent” at the top. |

    | Jun 1997 | District audit network risk assessment sent to a senior manager.
    A strategic review was ongoing at the time – something the public sector suffers
    from a lot (14.5 years on and very little had changed, sadly). | Issues identified:<•
    Lack of a defined and tested DR plan.<• Lack of security, fault and performance
    management on the network.<• Lack of standards, procedures and guidance for everyone
    to follow. ICT audit states that “activities of the risk assessment are a cause
    of concern”. |

    | Oct 1999 | External risk management review of computer systems conducted. |
    Referenced issues with back-up, disaster recovery and implementation of risk management
    cases for all new systems. |

