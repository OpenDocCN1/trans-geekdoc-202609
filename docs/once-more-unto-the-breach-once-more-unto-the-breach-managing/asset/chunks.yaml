    iceberg, and the longer you work in the industry the clearer this becomes.


    Beneath the story reported by the media there is usually a  raft of information
    security-based failings that have been present for quite some time.


    **Security is having a bad decade..…**


    *So many breaches!*


    10/2014: Home Depot (53m records)


    9/2014: Home Depot (56m cards)


    8/2014: JPMorgan Chase (83m records)


    6/2014: iCloud (celebrity ‘hacking’)


    5/2014: eBay (145m records)


    12/2013: Target (110m records)


    10/2013: Adobe (152m records)


    And on, and on … It.s obvious there are some serious issues to be addressed.


    All of these, one after the other, like multiple buses arriving at the same time,
    could have been adequately resolved with three key information security management
    tenets, which are addressed through this book:


    1\. Inventory management (knowing what you have) \[[Chapters 1](#09_ch01.xhtml#ct1),
    [4](#12_ch04.xhtml#ct4), [7](#15_ch07.xhtml#ct7) and [8](#16_ch08.xhtml#ct8)\]


    2\. Patch management (keeping it up to date) \[[Chapter 2](#10_ch02.xhtml#ct2)\]


    3\. Vulnerability management (protecting it from harm) \[[Chapter 3](#11_ch03.xhtml#ct3)\]


    Why is this the case, given that there are likely to have been many valid audit
    reports containing reference to issues that needed to be addressed? Indeed, there
    is no doubt that had recommendations been adhered to in these cases, risk reduction
    would have occurred and the number of breaches would equally have been lessened.
    It seems to me that, as a society, we have seen a greater shift in recent times
    towards openness and transparency in all walks of life and across all levels of
    leadership. I believe we should be following this trend in our own industry.


    This book is an insider’s view of how many actual breaches (often seen as incidents)
    are going on all the time, but which do not get reported, either internally or
    externally. The educational point of the book is to reframe what it actually means
    to be an ISM, as well as what is meant by an incident, how we respond to it and
    what the most appropriate reporting and reactions should be. We will do this through
    the old art of storytelling, in the hope that better informed and more aware ISMs
    will be able to  provide much greater protection to their organisations and their
    information assets.


    The book will be peppered with references to real issues, conflicts and conundrums
    that ISMs constantly have to deal with, and I hope that it will shed light on
    possible solutions and pragmatic ways forward. It should be usable as a learning
    device and reference guide.


    The chapter structure is based on a 12-month chronology, running from August to
    July.


    August – pulling a team together. As a project manager in information security
    you get what you are given and you have to make the best of it, so you have to
    enthuse those around you regarding your goals while explaining the changes in
    behaviour expected and what the end game looks like.


    September – street trash. This chapter is centred on an event that may remind
    you of those times when you read news stories and don’t expect them to happen
    to you. But when you spot the blindingly obvious, always remember to take a photo
    so you have the evidence to ‘show and tell’, following the mantra ‘a picture is
    worth a thousand words’.


    October – compliance is only skin deep. Once you’ve completed an audit, in whatever
    shape or form, following a ‘tick box’ exercise is no good if you can’t back it
    up with evidence. Now starts the hard work of living by your word.


    November – how remote is remote? Identifying home-workers and remote workers can
    be a tricky business depending on your partners and your boundaries, the competing
    requirements of each, and conflicting legislative and standard requirements.


    December – oh, for the sake of yet another proposal. A large project involves
    much more than just dealing with the actual security controls which must be implemented.
    Battling with politics and management can be hugely time-consuming and diverting.


    January – a battle won. While the project politics game can be won in the end
    and you’ve got your budget, you still need to manage it tightly and closely before
    everyone else wants to get their hands on it and get their pet projects funded!


    February – money doesn’t buy happiness: ’twas ever thus. While the financial resources
    are available, it can be difficult to apportion them appropriately and spend them
    in time, particularly in the public sector. And if you don’t spend them, you run
    the risk of losing them, which is a shame when you have worked so hard to get
    them in the first place!


    March – slipping through the net. When working in local government, you are only
    a small part of a much larger picture. The links with central government can be
    strong or weak, depending on your position. An impending election puts a significant,
    nationwide embargo on spend and project completion seems further and further away.
    And to top it all off, there is a virus outbreak. So what do you do when malware
    strikes? A Conficker infection runs the risk of doing some significant network
    damage and any publicity needs to be very carefully handled.


    April – linking InfoSec with InfoGov. In order to arrange some level of succession
    management, it is important to arrange for the right players to work together
    to deliver a more holistic solution for the organisation. This has always  been
    the case, but takes on a new meaning, given the changing political landscape.


    May – politics and management. Situational awareness is an important element of
    your role and you need to be aware of the bigger picture in which you are operating,
    as an organisation, in order to maintain appropriate information security.


    June – what the auditors shouldn’t know. Following a significant review of laptop
    usage across the organisation, it was found that the costs and likely level of
    breach to the organisation were huge if one was to be lost or stolen, given their
    current unencrypted status. But a senior management team thought it best to ‘bury
    the bad news’.


    July – so near and yet so far. Following the election of the new government, and
    in line with many public sector cuts and project closures, the project management
    role was let go and it was time to walk away.'
