    The ‘cut and paste’ facility was worrying a lot of users as they realised that
    this could be a huge risk, given the nature of the information that could easily
    be copied out of corporate systems. This needed to be monitored in terms of the
    number of applications that allowed it and the likely level of information contained
    in those systems. This might be leaking out as a result of users trying to be
    helpful,  cutting and pasting information from a corporate, secure, sensitive
    system into an e-mail, to exchange with colleagues in other third-party locations
    in order to fast-track solutions.


    Following delivery of another information security awareness briefing in an outlying
    office location, a laptop ‘appeared’ from under a desk. It clearly hadn’t been
    used in weeks, so was locked out of the hard-disk encryption tool. As an ISM,
    you need to decide whether or not you are going to start to report every one of
    these kinds of breach as an ‘incident’ in the appropriate system, as it can be
    very useful for both planning and management visibility – particularly in explaining
    what it is you have been getting up to!


    Security awareness theme


    This month’s information security theme should usually be focusing on Easter,
    as it occurs at this time. You could run a campaign whereby you leave chocolates
    (mini eggs, for example, to keep in theme!) on the desks of those users who are
    adhering to your clear-desk policy.


    Chapter summary


    This chapter has very much focused on a journey through the history of the various
    terms that populate the industry, to help the ISM understand their role in all
    things information. While it may feel like the end result is greater confusion,
    the chapter can be used for reference on an ongoing basis, depending on the needs
    that arise as your role grows and you become embedded in your organisation.


    Much like any other profession, there will be many who will disagree with the
    way these definitions have been represented, but the author would challenge their
    research and depth of reading!


    CHAPTER 10: MAY - POLITICS AND MANAGEMENT


    Situational political awareness


    Wikipedia describes ‘situational awareness’ as:


    The perception of environmental elements with respect to time and/or space, the
    comprehension of their meaning, and the projection of their status after some
    variable has changed, such as time... It is also a field of study concerned with
    perception of the environment critical to decision-makers in complex, dynamic
    areas.


    In many ways, the construction of this book is about pulling together a lot of
    elements that are important to the ISM role because they help you to maintain
    your situational awareness. An understanding of the impact of politics is part
    of that jigsaw.


    This was the month of a change of government in the UK, which had a profound impact
    on the whole of the public sector ICT infrastructure and strategy planning for
    quite some time. While the arrival of the new government (Conservative–Liberal
    alliance) should have heralded momentum, it did not transpire that way, particularly
    because of the tremendous recession and economic turmoil that was having a lasting
    impact.


    The new government of the day planned to scrap some £15bn of controversial IT
    projects, including the ID card scheme and the national identity register (£4bn),
    the next generation of biometric passports and the contact point database (£224m).
    This was to have a significant impact on a number of working plans at the time
    related to  authentication of users on systems and information sharing out of
    some of those systems.'
