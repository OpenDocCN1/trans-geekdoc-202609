    ## Risk Management and ISMS Implementation


    - **Risk analysis** – the possibility of the occurrence of a security incident
    is calculated, based on a database of security weaknesses. This step needs to
    take into account technical controls that are already in place to reduce risk
    and any other complementary controls already available.

    - **Risk management** – once identified, the risks are prioritised in relation
    to the impact level and business appetite for risk.

    - **ISMS implementation** – this is a robust management framework implementation,
    including consideration of human, cultural, technical, business and external factors,
    and requires metrics, measurement and continuous improvements.


    ## Challenges in Implementation


    Unfortunately, what we have ended up experiencing in implementation terms is a
    lack of consistency, as each sector, industry and organisation has appeared to
    implement security on the basis of their specific business needs and created different
    security definitions to suit themselves.


    As mentioned earlier, `IA` must be maintained throughout the life cycle of a system;
    threats change with the changing political or business environment; vulnerabilities
    appear and disappear as the configuration of the system changes and new weaknesses
    are discovered; and the impact of systems failure changes as dependency on a system
    develops. This is where `CESG` (the UK Government’s Communications-Electronics
    Security Group, known formally as `CESG`) come in with the various accreditation
    schemes, etc. (UK `CESG`, Certification).


    Often security is thought of as an event rather than a process, as a stitch in
    time rather than a thread that runs throughout each phase of a system’s life cycle.
    Security is often not considered during the initial planning, design and development
    of the system. Attempts to retrofit security into the system after it is developed
    are typically more expensive and less effective than if it is incorporated from
    inception. Likewise, security does not end once the system has been accredited
    and approved to operate under certain conditions. Throughout the system’s operational
    and maintenance phase, the system’s compliance with the terms of its accreditation
    must be verified. Even when the system’s life cycle is over, security policies
    and procedures must govern the secure destruction and disposal of the system.
    ([Boyce and Jennings, 2002], p.170)


    ## Evolution of Information Assurance (IA)


    It can be shown that in the UK, `IA` broadens out to include data protection and
    privacy (because of the close confidentiality links and the Organisation for Economic
    Co-operation and Development (`OECD`) guidance requirements), information management
    and quality, records management, and much more. However, the assurance function
    cannot be deployed until the risks are fully understood ([Schou and Shoemaker,
    2007], p.13). The `OECD` guidance clearly states that the “use of an information
    system and its security should respect the legitimate rights and interests of
    others and should be compatible with the legitimate use and flow of data and information
    in a democratic society”. That requirement has not diminished, rather increasing
    in importance in the past two decades.


    In the late 1990s, the term `IA` was known only by small groups of security experts,
    often considered to be ‘paranoid’ or ‘rigid’. Today, `IA` is well known by a much
    wider audience involved with public sector projects and contracts, ranging from
    high-level executives to engineers in many disciplines. Many have sought information
    on `IA` processes through reading papers and attending briefings. Yet even in
    the late 2000s it appeared that the status quo was very similar, with only a small
    number of professionals truly understanding the breadth of meaning and the scale
    of available material upon which to draw experience, understanding and wisdom
    ([Hutton, 2008]).


    ## GRC and International Standards


    Today, you can choose from ‘information security’, ‘information risk’, ‘information
    risk management’, ‘information protection’ or ‘information assurance’ and also
    the US-centric, all-embracing umbrella of “governance, risk and compliance (GRC)”
    (Tone at the Top, 2010). `GRC`, itself, is prone to as many as 22 different definitions
    ([Marks, 2011]), although the most favoured is that provided by the Open Compliance
    and Ethics Group (`OCEG`, 2011`). Fundamentally, `GRC` is not about technology,
    but about business processes and doing them better. It is a lens through which
    an organisation can understand their business and appreciate why these elements
    need to work together in harmony (risk management and strategy), addressing fragmented
    processes, removing silos and working pan-organisationally. The international
    standard for risk management, `ISO31000`, provides a definition and is of value
    in this context ([British Standards Institution, 2009]).


    The goal is to transform information security into a multidisciplinary field in
    which technologists work closely with experts in ‘soft issues’, such as public
    policy, economics and sociology ([Shostack and Stewart, 2008], p.103). `ISACA`
    picked up this concept well in their Business Model for Information Security (see
    `[Figure 7]`), seeking to provide an “in-depth explanation to a holistic business
    model which examines security issues from a systems perspective” ([ISACA, 2009]).


    Even if you do not like the term ‘information assurance’ it has a long history,
    which clearly not enough people are aware of; so this section seeks to put the
    pieces together. It can be seen from what is widely available in published form
    that `IA` is often used as a synonym for security ([Boyce and Jennings, 2002]).
    While it may be that “attempts to create strictly defined vocabulary within information
    security are likely doomed to failure as long as English remains a living language”
    ([Shostack and Stewart, 2008]), it is important to appreciate that practical issues
    flow from definitions. Security may historically have been an IT issue, but assurance
    raises the bar to a much more organisational issue which, given the importance
    of valuing information as an asset and the need to protect both reputation and
    personal privacy, clearly shows the breadth of the requirement.


    ![](Images/P172_01.jpg)


    Figure 7: `ISACA BMIS` – business model for information security


    The Business Model for Information Security, © 2010, `ISACA`. ^® All rights reserved.
    Used by permission.


    ## From IA to IG


    Putting `IA` and `InfoSec` together, you actually get ‘information governance’
    (`IG` or `InfoGov`). `InfoGov` is the set of multidisciplinary structures, policies,
    procedures, processes and controls implemented to manage information on all media
    in such a way that they support an organisation’s immediate and future regulatory,
    legal, risk, environmental and operational requirements. This includes information
    held in every form (information systems, on paper, other records). It is underpinned
    by a management process that takes a co-ordinated approach to information assets
    across an organisation. It embraces information management, including information
    security management, information and records management, data protection, privacy
    (because of close confidentiality links and the `OECD` guidance requirements)
    and physical protection. It includes aspects of corporate governance, risk management
    and business continuity, and must be maintained throughout an organisation’s life
    cycle in the face of changing threats, vulnerabilities and dependencies.

