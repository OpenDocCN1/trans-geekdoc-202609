  trans: "\n\n## 执行过程中的沟通与挑战\n\n- **沟通团队** – 为了确保在各种组织简报中（在线时事通讯、海报等）分阶段交付一套信息传递。管理层简报确保了可以在面对面的团队会议中提供层级传递。组织简报按以下间隔进行：\n\
    \    - 100 天\n    - 50 天\n    - 30 天（一个月）\n    - 一周\n    - 前一天\n- **第三方供应商** –\
    \ 这是一个必须考虑在内的很有意思的群体。从 ICT（信息与通信技术）的角度来看，我们越是尝试标准化和整合我们的基础设施，并使用户体验变得更加整体和连贯，由于运营平台和系统开发的差异，这些提供商本身在处理起来就越发令人沮丧。在这种情况下，特别是移动设备（`PDAs`等）的供应商，必须作为流程的一部分被接受，因为当时存在两种竞争技术。在任何一种情况下，都无法轻松对系统中所有具有设备身份的用户应用密码策略更改，因为他们的设备会锁定并产生混乱，由于发送了大量请求重置密码的虚假信息，导致了网关缓冲区溢出。`预计意料之外的事`\
    \ 是一个非常有帮助的 ISM（信息安全经理）格言！\n\n在实施的第一周内，上述整个实施过程似乎每天都会出现新挑战。出现了服务器密码重置的惨剧——多年未重启的服务器需要安全关机然后恢复，而在过程中，往往没有可用技能来处理所面临的技术。由于原始开发者已离职，系统上存在未知密码，这意味着重置这些密码几乎是不可能的。\n\
    \n对于需要保持运行的遗留应用程序也是如此，但由于无法登录服务器，就无法进行任何其他维护。集成应用程序也有复杂之处，而且必须“一直开启”的 PC 也需要被识别出来。因此，他们被迫至少重置一次以符合新的密码配置，以便尽可能多的配置项符合在整个基础设施中推出的新密码策略。\n\
    \nISM 的任务通常是为所有情况实施最精简、最完善的策略套件，但这可能并不总是可行的。当你脱离组织的实际业务孤立编写策略文档时，会有许多场景是你无法预先想象到的。因此，在策略套件的生命周期内——从制定阶段和交付到实施阶段——进行广泛沟通具有真正的价值。\n\
    \n## 笔记本电脑管理\n\n为什么用户拥有从不连接到网络的笔记本电脑？需要提醒笔记本用户在发生重要更新时将设备连接到网络，以进行适当的维护。没有借口！如果用户不准备好这样做，那么就不应该为他们提供设备。这种要求必须作为其劳动合同和工作条件的一部分嵌入。笔记本电脑应按照指定的定期连接以进行更新，如果没有发生这种情况，则必须有某种追究和召回机制，以便用户能够看到策略得到了执行，从而规则是有意义并被遵守的。\n\
    \n你还要问问自己“为什么有些人会有笔记本电脑？”当你知道一台两周前才插入的新笔记本电脑上还连接了显示器（“因为分辨率更高”）、键盘和鼠标时，为什么不用 PC\
    \ 呢？有些人总会有办公桌和办公室的角色。尽管在大多数采购过程中，购买新的笔记本电脑显然“更容易更快”，但这真的需要解决，以确保提供正确方式连接到网络的台式电脑。否则，用户将面临每天晚上寻找安全地点存放笔记本电脑的困难——更糟糕的是，在真的不需要的情况下将其带到组织之外（这本身就带有风险）。\n\
    \n到目前为止学到的教训是，无论你的组织是大小，无论库存管理的技术解决方案多么可用，在识别所有配置项、管理它们和适当保护它们方面似乎存在着持续的挑战。再次，这是不可接受的，我们真的必须做得更好。ISM\
    \ 需要承担更多的“执行者”角色，以确保人们不会失去对手任务的关注，无论这些任务看起来多么多样。\n\n## 章节总结\n\n本章回顾了 ISM 应该在组织中带头的若干关键活动环节，这取决于现有的信息安全管理体系（ISMS）的成熟程度。\n\
    \n现实中，为了确保组织的资产基础处于适当的安全水平，通常需要大量的投资来继续推出基于安全的变更需求。ISM 面临的挑战部分是跨组织建立正确的沟通渠道，以便最好地利用现有资源交付预期的最终结果。\n\
    \n## 第 3 章：10 月 - 合规可能仅流于表面\n\n### 引言\n\n编写这本书背后的经验是，通常在最后时刻切入，只有大约六周的时间为一个组织交付一个合规状态。然而，大多数组织往往很快意识到，说你已经做到（安全）并不意味着你已经是（安全的）。当你考虑到许多组织中措辞内容与基础设施及运营的实际情况之间的差距时，成功填写表格并“通过”审计的能力是惊人的。这可能是“合规仅流于表面”，你必须实际上挖掘修辞之下的内容，制定一个计划来实现所声明的合规主张，并确保所需的安全水平贯穿整个组织。\n\
    \n“业务”总是试图理解任何安全相关支出的投资回报率。在安全领域，成本效益分析是出名的困难，且往往是徒劳的。有些人会将我们视为“追救护车的人”——我们总是在事件发生后（泄露、损失等）跟进，被要求在出现问题后进行修复，介入解决他人的疏忽。或者，我们可能被视为本质上的保险销售员，建议采取特定的方法（策略）以在事件发生时降低风险并保护组织，同时没有明确发生的概率，尽管影响可能是非常具体的。过去几年中数据泄露和事件发生的数量足以提供大量的真实案例与你的组织分享，立场是“若非你所拜的神佑，轮到我们”。换句话说，如果我们不实施以下安全控制和保护措施，这种情况可能会在我们身上发生，我们并不希望那样，对吗？\n\
    \n"
- fmt: '

    A key cornerstone of the work of the `ISM` is building an appropriate information
    security policy suite of documentation. The first big hurdle is to ensure that
    the intended audience understands that a ‘security policy’ is, in fact, not a
    single document in itself, but a suite of related policies, procedures and guidance
    that gets built up over a period of time, and is reviewed and added to constantly.
    It is an ongoing task, as maintaining records and documentation is always hard
    work and so is rarely afforded the continual attention necessary to be meaningful.


    As a career `ISP`, invest in books on this particular subject. There are many
    good ones out there, some of which have been mentioned in the reference section
    at the end of this book. One good resource in particular is Thomas Peltier. He
    describes the ‘tiers of policy’ and places the key information security policy
    as a `Tier 1` policy that applies to the whole organisation. `Tier 2` policies
    exist underneath this, addressing specific subject-related matters (personnel
    security, business continuity, access control, etc.). `Tier 3` policies are considered
    to be application or system specific. The larger your organisation, the more documentation
    you can see needs to be built up to create your `ISMS`. This requires a significant
    overhead in terms of maintenance to ensure that the guidance you are providing
    for the organisation is followed; it needs to be in order to maintain the security
    of the information assets that are being created, stored, processed, entrusted
    to everyone and shared widely.


    Policy creation needs to be risk assessed, as do any requested, planned or intended
    changes to existing policies. There may be impacts on users, business processes
    or technologies, and these need to be captured, addressed and understood by all
    parties. Different teams need to be engaged, depending on the scope of the policy
    (procedure or guidance) to form either a change control or a governance review
    level, so that you are not left writing your documentation suite alone in a vacuum.


    The outputs have to live and breathe, and be used by everyone in order to evidence
    compliance. Otherwise, there will be constantly references in audits to policy
    not being adhered to, and this will give the appearance of insecurity when, in
    reality, it may be that the policy was written wrongly and needs to be changed
    to meet the working practices of the organisation more appropriately.


    One way of forcing the agenda is to ensure that employees sign off on the information
    security policies most directly applicable to them. For example, they should certainly
    be signing off in terms of ‘I have read and understood …’ on electronic communications
    usage (e-mail, blogging, social networking, instant messaging, etc.) and remote/
    home/mobile working. This should be tied in with their personnel file and, if
    possible, ensure that all employees are provided with a personal information security
    plan for each year, which will include merit for attending annual awareness briefings,
    adherence to policy, application of password changes, etc. You should be able
    to see that this can then be linked to your requirements for metrics and measurements,
    so that you can start to evidence the effectiveness of the whole security policy
    piece to senior management. You are obviously aiming for a near 100% coverage
    of all full-time employees, plus some level of coverage for ad hoc workers.


    From your point of view, as `ISM`, you need to have input from legal, personnel,
    facilities management, IT, etc. – depending on the circumstances and intentions
    of the policy documentation itself – at both the creation and the review stages,
    prior to release and implementation. This means having a planned programme of
    delivery of documentation across a timeline that may have to be agreed with these
    parties and a line item on the agenda of the `ISMF`, or equivalent, that reviews
    the latest documents ready for revision, approval or issue.


    ### Policy Documents Standards


    Policy documents themselves need to be short and punchy, direct and to the point.
    They are a clear statement of the stance an organisation is taking on a particular
    technology, people or process issue. They should be supported by procedural documents,
    or controls or standards. Organisations have different terminology for their chosen
    structure of documentation and, wherever possible, you need to resonate with this,
    so that your work is seen to be in keeping with the ‘house style’. Security policy
    documentation should not be hidden away in the IT department.


    As a note of caution, be wary of ‘death by policy’. It is easy to fall into the
    trap of creating one for each and every situation (or assuming one should be written),
    rather than ensuring that there is a higher-level, all-encompassing policy that
    is technology agnostic and supported by appropriate procedural documents, control
    standards or good practice guides. There are those who use a perceived lack of
    policy ownership as a way of halting progress, i.e. waiting for responsibility
    to be decided. If you are bound by an incessant need to follow protocol, it may
    be that this will hamper momentum. Hence, there is a need for brevity in the writing
    of the documentation and the written word should be enforced as quickly as possible.


    ### Managing corporate antivirus


    The average computer user knows that they should have an antivirus program – and
    they even know that they should update it regularly, even if they don’t actually
    do it! So there is certainly no excuse for an organisation that supports a large
    number of users not to be doing something effective in this space. However, there
    are many different products on the market and, because of the complexity of system
    designs (back to the `OSI stack`, I’m afraid), it is possible that conflicts could
    arise between the chosen corporate antivirus program and a departmental application.
    Experience of this can render your systems exposed as it may be that, rather than
    progress with a planned update to a new more secure version of a corporate antivirus,
    you have to ‘roll back’ to an older and, by implication, less secure version in
    order to maintain the functioning of existing corporate applications. This is
    usually as a result of conflicts that are already understood by the third parties
    who are supplying the corporate applications that are suffering from this conflict.
    As I have said before, we should not have to put up with this in the IT industry,
    but it seems to be part of some kind of unspoken set-up that is maintained, but
    that is ultimately costing us all dearly and is rendering our information assets
    ill-protected.


    Greater complexity has not brought greater security, that’s for sure. This is
    clearly not a new issue - Bruce Schneier, security guru of note, wrote about this
    in 2007 (*see* *[www.wired.com/politics/security/commentary/securitymatters/2007/05/securitymatters_0503](http://www.wired.com/politics/security/commentary/securitymatters/2007/05/securitymatters_0503)*)
    and again in 2008 (*see* *[www.schneier.com/blog/archives/2008/03/security_produc_1.html](http://www.schneier.com/blog/archives/2008/03/security_produc_1.html)*).


    ### Standard build and image


    The implementation of a standard build of machine is an IT strategy deployed in
    order to ensure that all desktops, laptops, etc. are managed across the infrastructure
    in a holistic manner (having been purchased through one procurement agreement
    from one provider) and in adherence with all the required security-related policies.
    Rolling out a new ‘image’ on that ‘standard build’ may be needed – simply replacing
    the machines would no doubt be the easiest option, but this approach may not be
    possible because of a lack of financial resources available to you.

