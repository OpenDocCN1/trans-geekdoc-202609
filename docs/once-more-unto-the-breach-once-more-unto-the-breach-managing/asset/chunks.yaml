  trans: '


    在 2007 年 11 月，英国公共部门处理数据处理的方法由于一个政府部门丢失了两个 `CDs` 而发生了根本性转折。随后的几个月里，出现了持续不断的审查、调查和报告输出，所有这些都得出了相似的结论，即需要在组织及整个公共部门的各个层面建立更好的信息安全文化、意识、教育、数据处理等（`etc.`）。因此，产生了新的数据处理需求。一年后的
    2008 年 11 月，**信息专专员**（`Information Commissioner`）举办了一场名为“**设计隐私**”的会议，他在会议上发布了一项研究成果（参见
    `[www.ico.gov.uk/news/current_topics/privacy_by_design_conference.aspx]`）。最终结果是养成了下文所述的开展
    `PIAs` 的习惯。


    # 定义


    - **个人数据**（Personal data）——指任何可以识别出个人身份的数据，无论是独立存在还是与组织掌握的其他数据结合。

    - **隐私**（Privacy）——隐私的定义超越了个人数据，涵盖了可能侵入个人生活或事务的行为。这可能包括不会以永久形式保存的监控或筛选。


    # 开展隐私影响评估的好处


    在处理个人数据时使用的流程和技术存在许多风险。通过在项目早期识别风险，可以在仍有机会进行更改时避免或减轻这些风险。在后期或实施后做出的更改可能会产生高昂成本，无论是在财务方面还是对声誉的损害上。


    当提议任何新流程或系统时，应考虑其对利益相关者隐私可能产生的影响，并在适当开展 `PIA`。同样，当提议对现有流程或技术进行重大更改时，也应开展 `PIA`。评估涉及审查项目早期的提议，以识别对所有可能受影响的人的隐私风险。随后，下一步是记录拟的解决方案和减轻隐私风险的方法。


    ## 对个人的风险


    这些包括丢失、损坏、被未经授权的人访问或使用，以及个人数据泄露或进入公共领域。此外，还需要考虑可能违反个人权利的活动。


    ## 对组织的风险


    这些包括声誉损害、法律/赔偿成本、利益相关者对方案的采用率低、为了提高合规性重新设计系统的成本，以及项目崩溃或支持撤回。


    # 被视为高风险的数据


    根据《英国数据保护法》（`UK Data Protection Act`）定义的敏感数据可以简要描述为涵盖健康、种族、性取、犯罪、政治观点和工会成员。通常，这些被列为：


    - 种族或族群起源；

    - 政治观点；

    - 宗教信仰或性质的信仰；

    - 工会成员；

    - 身体或心理健康或状况；

    - 性倾向；

    - 犯罪或涉嫌犯罪的行为；

    - 任何犯罪或涉嫌犯罪的诉讼，或法院判决。


    应当预期个人联系信息保持保密，包括 `e-mail` 地址、电话号码和家庭地址。其他需要考虑的信息包括财务信息、风险个人的详情和旅行计划，这些也可能带来风险。


    # 预期结果


    这些可以表示为：

    - 识别隐私风险；

    - 从利益相关者的角度理解隐私风险；

    - 识别替代方案；

    - 理解对项目的接受程度；

    - 识别减少/避免对隐私负面影响的方法；

    - 在负面影响不可避免的情况下，接受风险的合理性；

    - 已考虑过隐私的记录证据；

    - 如果很明显项目无法满足法律义务或合规要求，或者无法对涉及的个人数据维持适当且预期的安全和隐私水平，则终止/停止项目。


    取决于观众是谁以及你的利益相关者是谁，这一切可能极其重要且有价值。为了使评估进行，必须收集以下信息。


    # 开展隐私影响评估


    应识别所有对项目感兴趣或受项目影响的群体，并简要描述他们的角色以及可能产生的影响性质。


    进行环境扫描。从其他项目中学习，无论是内部还是更广泛的外部环境。有效的来源包括：

    - 之前项目的文档，包括 `LLLs`（特别是当项目旨在替换现有技术时）；

    - 公共领域的报告、文章和论文；

    - 与该项目领域的专家或了解合规问题的人士进行讨论；

    - 在购买新技术时，与参考网站进行讨论可能提供有关他们如何处理隐私问题的信息。


    大多数情况下，对于涉及个人数据的项目，小规模评估是合适的。适用小规模评估的项目示例包括：

    - 用新软件替换现有的个人数据系统；

    - 设计和开发一个基于同意原则持有数据的系统；

    - 对现有系统进行更改，并将收集额外的个人数据；

    - 从新源收集个人数据的提议；

    - 创建或重新设计用于收集个人数据的 Web 表单；

    - 开发新的身份验证程序；

    - 外包涉及存储和处理个人数据的业务流程的计划；

    - 开发或修订有关员工使用委员会提供的技术（例如手机手机和笔记本电脑）的政策声明。


    只有在可能对组织处理个人数据方面产生重大影响时，才应考虑全面评估，包括以下一项或多项活动：

    - 使用可能影响隐私的技术；

    - 使用敏感个人数据（如《数据保护法》定义，例如种族或族群起源、健康、政治观点、宗教、性取）；

    - 使用机密信息或可能用于身份盗窃的信息，例如银行账户详情或其他财务信息；

    - 使用过量的身份验证数据，例如生物识别（指纹或虹膜扫描）或出生证明或类似文件的的副本；

    - 在未经许可的情况下发布未受保护的个人数据；

    - 与第三方机构共享敏感数据；

    - 持有有关个人的大量个人数据；

    - 持有涉及大量个人的个人数据。


    # 开展小规模隐私影响评估


    **信息专专员**（`Information Commissioner’s`）的指南建议以下阶段：

    - **准备阶段**：为咨询活动做安排。识别主要利益相关者并制定咨询策略/计划。在小型项目中，这可能不需要正式化。

    - **咨询与分析阶段**：与关键利益相关者讨论隐私问题，以便识别主要的隐私风险。此阶段还包括识别可能的解决方案。在某些情况下，咨询可以是小规模的，例如通过
    `e-mailing` 关键利益相关者以征取意见。


    '
- fmt: '

    - **Documentation phase:** record the outcomes of the analysis, either in report
    format or by using a checklist, with any relevant documented information attached.
    Alternatively, risks and solutions can be included in a project risk register,
    where available.

    - **Review phase:** any recommendations should have a brought-forward time, in
    which the documentation should be reviewed to ensure that the solutions have been
    put into effect and to review the success of such measures. Any new aspects to
    the project should also be reviewed to ensure that they do not impact on privacy.


    ## Compliance with legislation and regulations


    In addition to the `PIA`, the project owner/leader must ensure that the project
    is compliant with relevant legislation including:


    - `Data Protection Act 1998`

    - `Human Rights Act 1998`

    - `Regulation of Investigatory Powers 2000 (RIPA)`

    - `Privacy and Electronic Communications Regulations 2003`

    - `Sector legislation and Codes of Practice`


    Other legislative considerations in the UK include:


    - `Anti-terrorism, Crime and Security Act, Section 11 – Retention of Communications
    Data 2001`

    - `Civil Contingencies Act 2004`

    - `Computer Misuse Act 1990`

    - `Copyright, Designs and Patents Act 1988`

    - `Criminal Justice and Immigration Act 2008`

    - `Defamation Act 1996`

    - `Electronic Communications Act 2000`

    - `Environmental Information Regulations 2004 (EIR)`

    - `Freedom of Information Act 2000`

    - `Government Connect Code of Connection (CoCo)`

    - `Obscene Publications Act 1959 & 1964`

    - `Payment Card Industry Data Security Standard (PCI DSS)`

    - `Waste Electrical & Electronics Equipment (WEEE)` directive.


    Across the globe, there is a plethora of information-led legislative statutes
    that apply to organisations, and the `ISM` role includes the need to identify
    these and document them for reference and compliance purposes.


    There seems to be a tendency for those who bury their security function in `ICT`
    to have a very narrow view of what compliance means. It is far beyond complying
    with a technical control, like a `firewall rule set`. It is this and so much more
    – compliance with all policies, procedures and guidelines as required by the legislative,
    regulatory and statutory frameworks to which your organisation, in whatever sector
    it is based, is expected to adhere.


    ## Addressing privacy risks


    By addressing privacy risks up front in any new system development or process
    change, your organisation can avoid the risk of falling foul of the applicable
    data protection legislation:


    - Minimising data collection to information necessary for a specified purpose,
    and restricting its use for that purpose, is an important strategy. If you don’t
    hold the information in the first place, you can mitigate your risks by not recording
    it at all.

    - Eliminating collection of contentious data is another, i.e. blocking the use
    of particular information for decision making.

    - Non-collection of biometric data for authentication is another.

    - Delete or destroy data on completion of transactions for which it was required
    – this is best achieved through the application of retention and destruction schedules
    (in conjunction with `RM`).


    It’s important to use your organisation’s complaints process to determine avoidance
    and mitigation measures. You can easily identify trends when you see what people
    are complaining about. Ask for a review of a few months’ worth of external complaints,
    as well as internal user complaints. There is often some gold to be sifted therein.
    Users can spot when there is too much data being asked for on new forms, or are
    aware of historic forms where the data is never required or never used in any
    meaningful way. It needs to be part of your communication strategy to engage in
    this way as it becomes part of your risk mitigation.


    A `PIA` can be carried out at any point on existing systems, too, so that you
    have one as evidence that the above considerations have been dealt with. You could
    schedule this for corporate systems, in particular, throughout the year so that
    you are able to refer to the outputs and update them annually in case there have
    been any external legislative or regulatory changes, or internal system or process
    changes.


    ## Managing a virus outbreak


    Remember `Conficker`? It was painful if you experienced it in your organisation
    – and the instant response, as with any major virus outbreak, is to keep quiet.
    But you need to take action, so you have to get people involved, in particular,
    in locking down the offending machine(s) and patching like crazy! Given that your
    users can just as easily leak information to the outside as anyone else, handling
    communications becomes part of your `ISM` role and needs to be done very carefully.
    Upwards management amongst you and your teams internally, as well as across a
    large organisation, takes staging and resourcing, too.


    Obviously we’ve talked about the requirements for patch management and vulnerability
    assessments. An outbreak like this is your chickens coming home to roost, as it
    is the most obvious result of a lack of housekeeping. The first patch for `Conficker`
    was issued in October 2008, so to be experiencing it in your network in 2010,
    and to be exposed, was pretty embarrassing and told quite a tale in itself. While
    the child in you desperately wants to shout from the rooftops ‘I told you so’,
    it obviously isn’t the polite, politically correct or job-enhancing response,
    so tread lightly!


    We found, through some rapid network analysis, that there were many devices showing
    they had the hotfixes for `Conficker` applied. But it was hard to gauge whether
    the data being presented was wholly accurate and whether all the servers and other
    hosts were present, given there was a gap between the known total number of devices
    and the number of devices analysed. (Back to my `[Chapter 1](#09_ch01.xhtml#ct1)`
    checklist of tasks – it is vital that you have that inventory of your estate accurate
    and up to date at all times, for just this kind of eventuality.) The scan across
    the network only picks up what is visible in the configuration management system
    and, thus, if it is not visible, it is not captured and the network may be exposed.


    `NT4` had no patch against `Conficker` because, of course, it was on Microsoft’s
    planned unsupported software listing and, therefore, there were no plans to bother
    with it. So, at the time, if you were still hosting `NT4` machines (and they still
    exist out there to this day) then they were at risk of virus exposure.


    The `IPS` was generating warnings from a host network obfuscating behind the `proxy`
    and `DNS`. This is odd behaviour and indicative of the creative nature of the
    malware. Finding the host was the first task, as it was sending out replication
    messages across the network for as long as it was allowed to broadcast a signal.


    So, what do you do if a significant part of your estate has not yet been updated?
    It transpired that there were, in fact, quite a number of servers that had not
    been audited because the antivirus system had been turned off. The antivirus technology
    stops communicating if it is not updated, and the users needed to be set up in
    appropriate groups to have their local machines updated.


    While turning off the technical solution may solve one problem, for a short period
    of time, it may create another risk. In panic mode, there will always be impractical
    considerations with regard to what could be done manually and technically, so
    your role as `ISM` is to maintain a level head and manage the teams and resources
    necessary to achieve a satisfactory outcome for all.

    '
