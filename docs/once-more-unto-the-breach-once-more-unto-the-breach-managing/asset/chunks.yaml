    负责桌面更新的项目团队正试图将某些类型的机器存放在同一地点——即将所有的 `Dells` 放在一个地方，所有的 `HP` 放在另一个地方，以此类推——以确保站点维护的某种程度的便利性。如果工程师到达某栋大楼，他们就会知道整个过程中面对的是什么类型的机器，以及它可能出现的问题，并能够比面对多种不同机器类型导致复杂的冲突、系统故障和失效时更快地解决这些问题。同样，这使得更容易在网络上分块对机器组应用补丁和更新，而必非一次性应用于整个资产。你对变更交付的控制力越强，管理过程中出现的任何故障就越容易。


    此外，外面可能存在大量的旧设备，它们遗弃在你地理覆盖范围内的各个橱子、储物区域和旧档案柜中，你需要积极鼓励人们去寻找这些设备，并让他们觉得可以上交这些而无需担心任何后果——以确保它们根据你的基础设施战略得到适当的处置或循环利用。


    关于这一区域的最后一点，鼓励人们从家里带来旧的 PC 电脑，并以适当安全且环保的方式进行翻新或回收是有帮助的。初读之下，这似乎是一项昂贵（或疯狂！）的任务，但从长远来看它将产生回报。你考虑到，你的用户很可能实际上使用过家用电脑来完成你的组织工作，审查报告、编辑报告、转发邮件……在多年的服务过程中，那台家用电脑上可能存储了各种信息，敏感的、个人的或其他信息。对设备处置的控制是一种风险降低机制，在当前的工作环境中非常恰当，因为信息专员期望你在所有组织信息资产的整个生命周期内，始终对它们的位置具有可见性和知情。


    # 本月其他安全任务


    ### 职位描述


    在 `Chapter 1` 中，我提到过你需要提供一个框架，在员工进入你组织之前、期间和之后对其进行有效管理。这项活动的一部分是确保安全角色和职责得到分配，并在职位描述中引用相关任务。此外，实施一个个人信息安全计划并与他们的年度个人发展计划挂钩也是值得的。这是一份关于技能、培训和发展的计划，他们承诺承担，以提高他们代表组织的理解力或表现，并确保他们正尽一切保护他们所管理的信息资产。这源于让用户——从
    CEO 直到所有用户——理解他们他们创建了需要管理、存储、传输、共享和安全保存的信息资产的人。ICT 仅仅是信息的守护者，而不是所有者。因此，用户群体需要理解其角色的重要性——将其与年度绩效和评估挂钩往往有助于集中注意力。如果能将其与实际财务要素结合起来就更好！


    ### 用户的理解


    记住，虽然我们假设现在的用户对技术必须非常了解，因为技术无处不在，但他们实际上了解的是他们与消费相关的体验，而不是任何水平的“打开引擎盖看内部”的实操经验。因此，多年来，许多用户被放在电脑前并让他们开始工作，而几乎没有或完全没有为他们提供培训。他们一直摸索着过，如果遇到瓶颈，就会向同事寻求帮助。但你可以看出这种方法的缺陷。如果他们的同事也采用了同样的培训模式——即，什么都没有！——那么他们对面前系统带来的益处的理解就非常松散。发现他们真正不知道什么可能会让你感到惊讶！所以，ISM（信息安全管理）的另一个大杀手锏是提供一个安全的环境——例如，一次信息安全意识简报——让与会者知道他们可以分享顾虑和局限性，希望你可以帮助他们提供一条通往解决方案的路径。


    有很多用户不知道 `.pst` 文件是什么，也不知道如何寻找它。（以防万一，这是微软对你所有 `mail` 邮件文件的称呼 `post`）。在很多情况下，他们甚至从未想过去问。只有在丢失邮件后，他们才会意识到这些信息的意义——并对学到这一点表示感激，这不仅在工作中，也能帮助他们成为更好的家庭用户。所以，在前期对他们多解释一下是值得的——益处将随着时间的推移而变得清晰。


    ### 人员管理


    如果你正处于长期的变革计划中，你需要在同事休假或缺席回来后继续激励他们，以便他们继续做一份到目前可能看起来很无聊的工作。例如，任务可能涉及大量机器的升级、更换、维修和恢复；或者是一个在补丁方面需要大量心照的大型服务器群。在“机房”里有许多乏味的任务，这是一个很恰当的比喻，因为这些系统确实是保持组织其他部分运转的引擎。你需要所有的同事——无论是技术人员还是其他人员——都理解这些基本事实并相应地提高他们的水平。


    ### 安全意识主题


    本月的信息安全主题可以利用一月通常是新年愿望时间的这一。例如，“你的愿望是什么……？我们的愿望是始终更新防病毒软件……”或“新年新气象……让我们锁定那些设备！”尽管这些听起来可能很陈腐，但用户群体会对这种讽刺与幽默的混合产生一些理解，至少会看到正在进行一个主题和信息传递。


    ### 章节总结


    这一章真正开始分享了 ISM 在任何给定月份内可以预期的活动范围广度，其中许多并非基于技术——也不应该被预期为基于技术。线索就在标题里！


    接下来的几章将这种对 ISM 角色的宏观视角与所有需要执行的海量任务结合起来。它们还强调了你必须理解你组织的整体目的和意图，这样你就可以为安全地使用其信息资产和资源提供更好的建议。


    # 第 7 章：二月 - 钱确实买到快乐


    ## 分而治之？


    作为一名 ISM，你现在应该看出你必须把自己看作某种“转盘高手”——任何时候都有许多不同的子项目在进行。这可能是为了满足管理的需求，而不是由你设计的任何东西。所以结果可能是没有人知道发生了什么！


    然而，总有一种担心，你的大项目像一头大象，无法一次吃掉。因此，将其拆分为若干子项目是一个很好的策略，因为会让每个团队专注于特定的任务，而不是将他们太薄地分散在整个项目中。我们被鼓励将其拆分为以下内容：


    • 端口控制/移动介质——数据泄露防护技术（也称为稳健的终端安全）已安装在端口，以确保对连接到设备具有更高的可见性，并确保这些设备得到适当管理，特别是通过扫描所有连接的设备。


