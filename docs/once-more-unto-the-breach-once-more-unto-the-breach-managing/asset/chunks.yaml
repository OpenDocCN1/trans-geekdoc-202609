- fmt: '

    You have learnt a vast amount about the organisation already – if you have all
    the answers to the questions asked in `[Chapter 1](#09_ch01.xhtml#ct1)]`, that
    is! No doubt, there are many people surprised at how interested you are in such
    a wide variety of issues. This is precisely how it should be. The ISM is interested
    in the security of information in all its forms, in all its locations, in all
    its transactions across the organisation and beyond. Remember, implementing and
    maintaining information security is not solely about focusing on bits and bytes
    – it requires the triad of people, process and technology-based solutions, controls
    and safeguards. Part of your `ISM` role is being able to express the importance
    of the tasks you are undertaking in executive management speak – so this is the
    language of risk and financials, not bits and bytes. The focus needs to be both
    strategic and service orientated, explaining security in pragmatic terms.


    In `[Chapter 1](#09_ch01.xhtml#ct1)]`, we looked at the requirement to know how
    many users there are across the organisation and how to manage them throughout
    the life cycle. Then you learnt that you need to check for duplicates of users
    in the various system resources. These may have arisen as a result of data entry
    errors when inputting the names originally. Not every system resource may be directly
    linked to a central `Active Directory`, or equivalent, and, therefore, there are
    IT administrators managing a multiplicity of systems with different directories
    of users. These need to be synchronised, so that the users do not lose any access
    rights or connectivity as a result of any data migration or server infrastructure
    changes carried out by IT.


    ### Incompatible software


    There are still many organisations finding that they are in relationships with
    third-party software suppliers that provide products that apparently cannot be
    upgraded, as to do so would, in all likelihood, cause incompatibilities and configuration
    errors. This means that any security patching or upgrading, which should have
    been done, has not been carried out for fear of affecting the currently working
    system’s performance. These are large software providers continuing to deliver
    substandard products, in terms of not having inbuilt security, to large organisations
    in both the public and private sectors. This is in spite of the length of time
    that the importance of patching and upgrading has been an industry-relevant mantra
    that should amount to best practice. Many available and widely used systems currently
    have to be made backwards-compatible by internal IT teams, rather than being patched
    to a future state of security. Given the number of users this can impact in some
    organisations, it can leave hundreds of PCs not patched to today’s expected security
    levels. It is unacceptable to continue to tolerate or support this situation.


    It seems there are people across the IT industry who do not fully understand the
    `OSI model` – the seven-stack layer (see `[Table 1](#10_ch02.xhtml#tb1)]`). Security
    needs to be happening across many of these layers, all at the same time, which
    requires a great deal of consideration and configuration management. People selling
    products may not appreciate this sufficiently to understand the impact of what
    they are going to be leaving an organisation with. There will then be a great
    deal of maintenance and support required afterwards to get the product, as sold,
    to deliver the anticipated benefits, and usually there is an extra cost that was
    not factored in. This needs to be addressed and the `ISM` continues to need eyes
    in the back of their head to watch out for potential problems from all angles!


    Table 1: OSI model (source: Wikipedia Commons)


    ![](Images/P46_01.jpg)


    In the UK public sector the austere time and recession environment have been circling
    overhead like a black cloud since 2010, and continue to cast a shadow even now
    – as a result, there is the madness of a central government approach to developing
    authentication systems, which is taking a great deal of time to get right despite
    its importance. Meanwhile, local government bodies have had to develop and implement
    their own, as they could not wait for the centralised system to be implemented.
    Yet more cost and integration issues will arise over time as the achievement of
    standardisation and centralisation is sought in an attempt to reduce overheads.
    In the meantime, the duplication of effort in terms of software, technology and
    policy requirements is significant, and the users are ultimately part of the fallout
    as they end up having to manage a number of authentication devices to access different
    systems and conflicting set-ups. I have often had to suggest to users that they
    will need a Lara Croft-style lock-and-load belt in order to contain their various
    authentication dongles, `USB` devices, mobile phones, PDAs and access cards.


    This is, of course, almost the antithesis of achieving good security as the users
    will psychologically want to keep all their kit and equipment together in one
    safe place; but, in doing so, they may expose themselves to a greater degree of
    threat than the organisation is comfortable with, in terms of managing the risk.
    In your day job, as `ISM`, you will have to solve many of these conundrums, which
    require constant reassurance and ‘fleet-of-foot’ responses to questions and queries
    from the user base – and often slightly different answers for management.


    ### Remote workers


    Another conundrum within this space is identifying and clarifying who is a remote-
    or home-worker. You need to know:


    *   Are all remote users remote?

    *   Are all home-workers working from home?


    Your `remote-working policy` or equivalent really needs to contain appropriate
    definitions of mobile workers, in as many scenarios as possible, in order to ensure
    that the set-up they are using is the most appropriate one (safe, secure and reliable)
    and the one that can be best supported.


    Possible ways of categorising the different types of roles are provided in `[Table
    2](#10_ch02.xhtml#tb2)]`. The original source of this helpful approach was a white
    paper written by Siemens Enterprise Communications on contact centres.


    The examples provided in `[Table 3](#10_ch02.xhtml#tb3)]` are for public-sector-type
    roles and organisations, but can be easily tailored to your requirements.


    Table 2: Role categorisation


    | **Profile** | **Description** | **Typical requirements** |

    | --- | --- | --- |

    | **Internal** | | |

    | Office-based worker | Staff who spend 90%+ of their time in the office (e.g.
    clerical staff). | A dedicated desk, fully equipped with ICT equipment and services.
    |

    | Flexible office-based worker | Staff who spend 90% of their time in an organisation.s
    office (e.g. managers, ICT staff). | A dedicated desk, probably equipped with
    a `laptop and a docking station/touchdown area within each office, enabling them
    full access to ICT services. |

    | Home-based worker | Staff who spend all, or a significant proportion of their
    time, working from home (e.g. part-time contact-centre agents). | A dedicated
    work environment at home with access (typically via broadband) to the ICT services
    they require; plus a docking station/touchdown area within one or more offices.
    |

    | Nomadic worker | Staff who have no fixed work location, are often in transit,
    but may visit organisation offices and may also work from home (e.g. social workers).
    | Ability to access ICT services as/when/wherever required, including external
    locations while in transit, at home or in the office. |

    | **Associates** | | |

    | Members | Elected members. In general, highly mobile across the organisation
    and external locations. High level of communication. Frequent meetings. | Ability
    to access certain ICT services as/when/ wherever required. Needs to manage contact.
    Increased use of conferencing to save on travel/meeting time. |

