    这里关于此的一点额外说明，以反映这个问题将会反复出现。你应该考虑服务包（service packs）与关键补丁（critical patches）的问题，这取决于你正在部署的系统性质，或者你通过
    IT 服务已经获得的可用资源——当你的环境跨越数千台机器时，你如何对这些操作的顺序和优先级基础做出决策？网络对更新的响应方式以及 IT 处理出现故障机器的方式是有区别的。在可能的情况下，你希望这些更新在半夜运行——显然，如果你在一个“全天候”的环境中运行，这更加困难。因此，你可能希望按照我们提供的物理布局示例对机器进行聚类，并能够根据它们对组织的优先级和重要性向特定组部署更新。无论你选择何种方法，都要准备好应对即使一台机器故障可能产生的影响，因为这会产生连锁反应，导致整个团队出现负面影响，而这正是你最不想看到的。


    ## 物理安全问题


    我经常思考我们在组织内部建立的这种部门隔离（silos）以及它们除了维护个人自尊之外，到底有什么用处。为了组织的未来发展，协调和协作通常是必要的。这些问题之一是应急计划（emergency
    planning）与确保业务连续性计划（business continuity plans）之间的差距。解决 `DR` 问题已经足够困难了，此外，业务连续性计划需要与利用这些系统的流程相关。关于这一点，有大量的文献可用。介绍中提到的一点是，要开始思考应急计划——很多时候，这些活动被视为完全不同的。我访问过一次应急区域，惊讶地看到那里堆满了等待送往警方进行粉碎处理的磁带。团队曾要求这样做，但这是一个典型的寻求支持却得而无获的例子。被要求的人并不理解这些材料的性质（其有效标签，因此需要以某种方式处理），也不理解如果信息落入错误的人手中可能产生的影响；即，请求本身没有经过风险评估，因此遗憾地被忽视了。`ISM`
    需要介入并`make`采取行动。这类情况不能不管，必须得到处理——这种紧急性需要传回给服务台，以便他们学会理解收到的随机请求的性质，并将响应机制加速到更合理的水平。


    ## 减少、重用、回收


    桌面更新计划在组织内更广泛的范围内继续进行。现在，已经有了一批可以重新分配的退役机器，这需要对用户的需求进行仔细考虑——而不是他们的愿望和欲望！


    在确定了那些不再使用的设备后，显然会有大量设备需要销毁。毕竟，你不会希望你的组织出现在 `BBC` 的纪录片里。早期的项目计划包括与回收服务提供商建立关系，由他们对运走的设备数量进行认证，并确保每一次都得到了恰当的销毁或回收。移除数量的物理证书被作为记录保存。这产生了一组有趣的统计数据，可以提交给管理层，包括移除的设备吨数、可重用的体积、回收的体积、带回组织的任何价值、更换的机器数量以及升级的机器数量——所有这些都可以根据总规模进行衡量，以评估进展并向更广泛的组织提供实用的反馈。


    对于某些机器，可以通过更新或升级内存芯片提供短期解决方案，以延长其目前的寿命。更关键的是，更换了机器。有些机器和连接方式非常老旧，甚至还在通过拨号调制解调器连接。信不信，它们仍然存在！


