    others. This is a normal part of good management and can certainly benefit from
    the exercise.


    ### Table 4: Lessons-nt log


    | Issue area | Description | Commentary |

    | :--- | :--- | :--- |

    | Start earlier | The organisation compressed efforts into activities dictated
    by ‘what we can get away with’ mentality, with a two-month window, and did the
    ‘minimum’ to gain connection to secure infrastructure. This left ICT workers overstretched,
    stressed and behind on normal jobs. It left users bewildered by the scale of change
    and frustrated by the number of niggles that needed to be ironed out. | If a project
    looks too difficult to do, it probably is – but fear is not a good reason to put
    off starting the process sooner. Invariably, there will be resources available
    to provide the appropriate advice as to how best to tackle the ‘whole elephant’,
    and they need to be engaged sooner and relied on more heavily initially for skills
    transfer. Bottom line: start earlier and provide more management support for the
    project team. Ensure knowledge is gained in the subject area early enough to appreciate
    the scale of the task. |

    | Working together | Including bringing the ‘customer’ in early on the project.
    But not engaging everyone! | Once the team were galvanised, and empowered sufficiently
    that they felt their contribution was both valued and welcomed, their activity
    level increased significantly and had a hugely positive impact on the ultimate
    success of the project. Bringing the customer in on the project early was hugely
    beneficial. In reality, most projects are really not isolated activities and so
    there is always a need to engage across all team members and keep people informed,
    even if they are not on a specific project team. Also, provide the project team
    with a feeling of engagement, which means they have something that binds them
    together (OK, so ours was partly inspired with sweets, but it helped!) |

    | Holiday management | Active project management requires rigorous attention to
    any ongoing reduction in people days available to a project, particularly during
    known busy periods and holiday periods (e.g. July, August and December). | |

