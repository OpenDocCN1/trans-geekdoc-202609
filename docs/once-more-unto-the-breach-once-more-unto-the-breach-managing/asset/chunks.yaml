    | 公民 | 需要该组织提供信息和服务的当地公民。 | 越来越多的公民倾向于使用互联网或其他媒体来获取企业服务或与组织通信。这可能扩展到 ISP 类型的服务。
    |

    | 合作伙伴 | 地区/单一组织、其他公共机构（如医疗、消防）以及外部服务提供者/私立机构。 | 共享服务和增强的通信。 |


    ### 表 3：公共部门角色的示例


    | 用户群体 | 概描述 | 需求 |

    | --- | --- | --- |

    | 社会工作者 | 移动式 | 大部分时间花在访问成人或儿童的家庭以提供社会关怀服务。作为以人为本的工作人员，他们通常不精通技术，因此灵活的工作解决方案需要易于使用，并针对其特定需求进行定制。作为处于弱势地位的独立工作者，他们需要与支持人员和管理层保持高频率的接触。
    |

    | 学校顾问 | 移动式 | 大部分时间在访问学校。他们也会回到主办公室并在家中工作。他们有一位共同的助理（PA），负责分配任务并为他们提供返回组织的链接。总来说，他们对技术有良好的理解。例如，一些学校顾问在晚上使用家里电脑上的
    Skype 电话与同事进行通信和协作。此外，由于他们向学校推广该组织的技术和服务，他们自己需要被视为高级用户。 |

    | ICT 支持人员 | 灵活的办公型/移动式 | ICT 支持人员可能被归类为灵活的办公型/移动式。ICT 支持人员可能被归类为灵活的办公型/移动式。ICT
    支持人员可能被归类为灵活的办公型/移动式。ICT 支持人员可能被归类为灵活的办公型/移动式。（等等） | |

    | 管理人员（特定领域） | 灵活的办公型 | 共享服务和增强的通信。共享服务和增强的通信。共享服务和增强的通信。共享服务和增强的通信。共享服务和增强的通信。（等等）
    | （等等） |


    注：非常感谢，如今很可能是更少的人在完成更多的任务（我假设你们并不一定拥有许多人团队来逐一处理每个要素）。


    | 正常业务 (Business as usual)


    有许多被明确描述为与安全相关的任务，现在需要成为 ICT 常规业务（BAU）的一部分。换句话说，它们不仅仅是信息安全经理（ISM）或管理员的职责范围。这些包括：


    * 访问控制

    * 杀病毒软件/恶意软件

    * 备份

    * 业务连续性

    * 灾难恢复

    * 事件管理

    * 补丁管理

    * 漏洞评估


    简而言之，对于每个领域：


    * `access control` – IT 需要管理设置新用户、删除旧用户或更改角色配置的过程。

    * `antivirus/malware` – IT 需要确保所有网络节点（服务器、桌面式电脑、笔记本电脑等）都有最新的签名，以及经过完全管理和授权的产品。

    * `back-up` – IT 需要确保备份正在进行，并定期对恢复进行测试。

    * `business continuity` – IT 需要确保其本身有一份计划，正如组织的每个其他部门都需要一份计划一样。

    * `disaster recovery (DR)` – IT 需要确保已让组织的所有部门或部门参与到对系统的业务影响分析中，以便在事件管理方面有明确的预期。

    * `incident management` – IT 是捕获基础设施和用户发生事件的绝佳起点。ISM 应与 IT 工作人员紧密合作，识别并分类事件，以便对其进行调查并吸取改进教训。
    |


    '
- fmt: '

    - `Patch management` – IT needs to ensure that it is applying patches in a timely
    manner across the whole infrastructure in order to maintain risk reduction.

    - `Vulnerability assessments` – IT needs to ensure that it is carrying out assessments
    on the infrastructure in order to maintain an awareness of the level of threat
    and to mitigate it accordingly.


    The role of the `ISM` is to set up the framework – the policies, procedures and
    guidelines – and to create and deliver security awareness sessions to communicate
    and explain all these. Thereafter, everyone else has to actually do their part,
    continually, not just immediately after the first rush of enthusiasm following
    the launch of the framework. This is an ongoing task, and not a project with an
    ending, hence the earlier references to a programme focus, rather than a project
    focus, being more appropriate.


    ## Information ownership


    In a great many organisations, there is a large divide between IT security and
    roles that address information governance topics, including data protection, freedom
    of information and `RM`. Given that the focus of an `ISM` is that of protecting
    information assets and enabling business initiatives with security enhancements
    and implementation, and that of an information governance manager is knowing when,
    within the bounds of legislative and regulatory requirements, to share, disclose,
    save, store or publish information, if the two are not working hand in glove there
    will be trouble: this way madness lies! It is vital to have a close working relationship.
    In an ideal world, the aim should be for a coalescence of the roles (teams, if
    you are very lucky), and this will actually provide the organisation with the
    best overall approach to protecting its information assets, keeping them safe,
    secure and reliable over time. We’ll return to this in `[Chapter 9](#17_ch09.xhtml#ct9)`.


    ## Physical security


    The longer you are in an organisation, the more physical security starts to take
    shape as a really valuable mechanism for providing visual aids, which you can
    use to as examples of the change that people need to embrace. Every day, you should
    be able to identify an event that has happened or find example of an event that
    is likely to happen, just by doing a tour of your buildings. The following is
    a real (true) story.


    ### Incident


    At 09:45 am, I observed the ‘facilities’ personnel bringing a trolley cart between
    two buildings to collect confidential waste bags and remove these for shredding.
    The trolley was left unattended as the single operative went into one building,
    up and down many flights of stairs, to collect bags on each floor. As the trolley
    got stacked up, it was left for longer and longer. It was still unattended at
    11:25 am, and by 12:35 pm it had been removed, but had obviously become so stacked
    that a bag dropped off and the operative didn’t notice, so it was just left on
    the street (see picture in `[Figure 1](#10_ch02.xhtml#fg1)`). As a sad reflection
    of these unsafe and uncertain times we live in, the mentality now is that you
    wouldn’t pick it up in case it had a bomb in it. But, as I had observed the chain
    of events, I felt on safe enough ground and, ultimately, found the contents to
    be extremely disappointing – nothing juicy or newsworthy! So actually, in reality,
    the bag need never have existed at all as the paper materials therein could have
    been recycled a long time previously or shredded on site.


    ![](Images/P57_01.jpg)


    Figure 1: Confidential waste


    Top tip – always have a camera facility available to you! I’m old school, so I
    carry a proper camera in my handbag at all times (where allowed) while on sites.
    Obviously, most mobile devices have photographic capability these days, so this
    is not hard to achieve either way. You are then able to capture, visually, the
    ‘wrong’ behaviour that you are seeing so that you can ‘play’ it back to your user
    population to explain what it is that you want to see done differently.


    By using the example and photograph in the above incident while delivering user
    information security awareness briefings, it made it all the more real for everyone
    as the location was so close to a regional newspaper that anyone else could have
    taken the bag straight there instead; irrespective of how dull the contents were,
    the story would have been in the data breach itself.


    Side issues were raised as a result of talking about this one small incident to
    a wide audience. For example, other locations had to wait too long for their collection
    of confidential waste, which meant that there were often times when quite a considerable
    collection of bags could be found. This is the equivalent of the jars of sweets
    in a candy store – slips like this are tempting and present an opportunist thief
    with a target. Then there are the constant examples of keys left in cabinets,
    doors left open that shouldn’t be, etc. We will return to this later on.


    Other physical security issues transpired during the month, which really started
    to highlight the need for broadening the scope of coverage and understanding.
    It is often the case that facilities management deals with physical security and
    there is little communication with `ICT`, or wherever information security is
    housed in the organisation. Since 2011, there has been a lot of discussion around
    the need for convergence of these two key functions, in an attempt to address
    these gaps. Having spent many years implementing `ISO27001 ISMSs`, however, I
    couldn’t see the need for such convergence as it implied that people had not been
    doing `ISO27001` properly, given that physical security is an embedded and expected
    requirement. It is important, either way, to watch out for exits and entrances
    and put yourself in the mind of a would-be criminal. Consider how you might gain
    access to your building and, in so doing, what you can see and what you could
    walk out with. It doesn’t have to hold obvious value at the time, but may have
    a sell-on value that you have not currently considered.


    It is extremely important to live and breathe security visibly and physically,
    as well as electronically and technically, so that your user population sees it
    in action and believes that it is being taken seriously all the time.


    ## Password management


    Here is another tale from the trenches.


    A key piece of the project implementation was to change from user-defined passwords
    to a `WindowsR`-driven password management process that demanded a minimum eight-character
    alphanumeric password. The decision was to apply a global setting on the `Active
    Directory`, as anything else required phased changes that involved a lot more
    effort and management for both users and `ICT staff`.


    This required communication across several areas:


    - `ICT help desk` – to ensure that they were ready (in terms of staffing and knowledge)
    for an increase in call volumes on the day of the password change.

    - `ICT systems teams` – to ensure that all system administrators and database
    administrators were ready to change the passwords on the systems for which they
    were responsible and, more particularly, to ensure that the systems themselves
    could handle the new password requirements. This turned out not to be the case
    in all circumstances, which led to a need for a high volume of password policy
    exceptions in the short term, something you want to avoid if at all possible,
    and the need for a great deal of system remediation in the medium to long term.

    - `Personnel` – in order to ensure that the changes to user behaviour in no way
    contravened any rights and obligations issues. It was also necessary to capture
    any issues relating to long-term absence as a result of sickness or career breaks,
    as those individuals would not be around for all the information about the password
    change and then would return to their PCs, probably having forgotten their passwords,
    and the reset would require more interaction.

