    # Training Services


    IT Governance offers an extensive portfolio of training courses designed to educate
    information security, IT governance, risk management and compliance professionals.
    Our classroom and online training programmes will help you develop the skills
    required to deliver best practice and compliance to your organisation. They will
    also enhance your career by providing you with industry standard certifications
    and increased peer recognition. Our range of courses offer a structured learning
    path from Foundation to Advanced level in the key topics of information security,
    IT governance, business continuity and service management.


    ISO/IEC 27001:2013 is the international management standard that helps businesses
    and organisations throughout the world develop a best-in-class Information Security
    Management System (ISMS). Knowledge and experience in implementing and maintaining
    ISO27001 compliance are considered to be essential to building a successful career
    in information security. We have the world’s first programme of certificated ISO27001
    education with Foundation, Lead Implementer, Risk Management and Lead Auditor
    training courses. Each course is designed to provide delegates with relevant knowledge
    and skills and an industry-recognised qualification awarded by the International
    Board for IT Governance Qualifications (IBITGQ).


    Full details of all IT Governance training courses can be found at [www.itgovernance.co.uk/training.aspx](http://www.itgovernance.co.uk/training.aspx).


    # Professional Services and Consultancy


    Your mission to plug critical security gaps will be greatly assisted by IT Governance
    consultants, who have advised hundreds of information security managers in the
    adoption of ISO27001 information security management systems (ISMS).


    At IT Governance, we understand that information, information security and information
    technology are always business issues, and not just IT ones. Our consultancy services
    assist you in managing information security strategies in harmony with business
    goals, conveying the right messages to your colleagues to support decision-making.


    The organisation’s assets, security and data systems, not to mention its reputation,
    are all in your hands. A major security breach could spell disaster. Timely advice
    and support from IT Governance expert consultants could make all the difference,
    enabling you to identify risks and put the necessary controls in place before
    there’s a need to respond to a serious incident.


    For more information about ISO27001 consultancy from IT Governance Ltd, see: [www.itgovernance.co.uk/consulting.aspx](http://www.itgovernance.co.uk/consulting.aspx).


    # Newsletter


    IT governance is one of the hottest topics in business today, not least because
    it is also the fastest moving.


    You can stay up to date with the latest developments across the whole spectrum
    of IT governance subject matter, including; risk management, information security,
    ITIL and IT service management, project governance, compliance and so much more,
    by subscribing to ITG’s core publications and topic alert emails.


    Simply visit our subscription centre and select your preferences: [www.itgovernance.co.uk/newsletter.aspx](http://www.itgovernance.co.uk/newsletter.aspx).

    '
