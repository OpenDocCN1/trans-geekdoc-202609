    this is, how much of it is internal and how much may be outsourced and, thus,
    managed externally. This will become more important, the more you try and get
    your head and hands around specific issues relating to patch and vulnerability
    management. Addressing the challenges of protecting systems is an element of maintenance
    that should be part of business as usual (BAU) operation. Sadly, it is all too
    often to be the case that this is not happening, as it is not explicitly annotated
    as part of various individuals’ full-time roles. Information security is, in so
    many cases, not ‘baked into’ the organisation, as has been described in so many
    articles, papers, blogs and books over the last decade. This is something that
    must be discovered and addressed as part of the ISM’s programme of change action.


    What about information assets?


    Over and above identifying hardware and software, there is a need to identify
    information assets. This is best done by the ISM, in conjunction with the records
    manager and/or the information governance manager, taking a proactive stance and
    providing the user base with a checklist for consideration. This should cover:


    • how the information is stored;


    • what volume of data constitutes the information assets;


    • how legislative requirements are met (data protection, freedom of information,
    retention periods, etc.);


    • who it is shared it with;


    • whether these colleagues are inside or outside the organisation;


    • how many people there are;


    • on what devices the information is stored;


    • what kind of impact there would be if there was a loss of the information assets.


    What version (or versions) of antivirus is (are) running and how often is it (are
    they) being updated?


    Again, there may be many questions that could be asked in this area, but you need
    to know the basics to get you started. There are still IT people out there, in
    organisations that should know better, who believe that Linux, Unix and platforms
    other than Windows^® do not require antivirus updates. No computing environment
    is immune.


    How many systems administrators are there?


    You need to be aware of this, so that you know the size of one of your key audiences.
    Then you need to know across how many platforms, corporate systems, etc. those
    system administrators (sysadmins) are stretched. You need to know how many people
    have administrator access to how many different systems – and you don’t always
    have to accept the reasons for this! Nor should you accept that there may still
    be passwords that are unchanged from default or are particularly obvious. You
    also need to be able to log each user to the IP address of the PC that the user
    registered at – access control management needs to happen across a number of layers
    of the open systems interconnection (OSI) model stack.


    There are reasons why issues like this keep featuring in the ‘top 20 critical’
    lists of security controls that need to be implemented to achieve a baseline of
    best practice in terms of security management across your organisation.


    It is also worth gauging how long sysadmins have worked for the organisation.
    Over a period of time, sysadmins can become quite personally involved with their
    systems, in the sense of feeling a great deal of ownership of them and responsibility
    for them. This may need to be tempered with a requirement to look outward enough
    to see and understand the increasing levels of threat over time. If ongoing education
    and attendance at various workshops, conferences, etc. has not been part of your
    sysadmins’ role, then they may not be aware of the scale of system management
    required and the need to make swift and deep changes to configuration, sufficient
    to provide a greater level of protection.


    How often are systems updated?


    Obviously, this is meant to be the start of a much larger conversation around
    patch and vulnerability management. And much like antivirus updates, it’s not
    just Windows^® that needs patching. Every platform can be exploited by an attacker
    and, therefore, the more protected you are, the less vulnerable you will potentially
    be.


    How many exceptions (deviations) to policy are there?


    Identifying this can tell you a lot about the current organisational culture and
    view of information security. If there are too many exceptions being sought, either
    the security policies have been written too harshly or  impractically, or management
    and/or the users are not taking the requirements seriously enough and are seeking
    to demote the intentions by finding ways around policy requirements, rather than
    seeking to mitigate gaps in compliance.


    All exceptions to policy need to be made on the basis that they will only be agreed
    to for a period of time, rather than being allowed to remain unchallenged on an
    ongoing basis.


    When were access controls last reviewed?


    Every organisation appears to have retired accounts that are still showing as
    active on their system, so there is always somewhere you can start to tidy things
    up. You need to correlate the number of users (identified employees) with the
    number of active accounts and manage these. System users are often not cleansed
    out of systems, and this won’t help if you have any migration requirements. Early
    review of last usage and deleted users will be a helpful strand of your work.


    The process of retiring old accounts still seems to suffer from a lack of timely
    co-ordination between management and HR, and yet it seems like such an easy issue
    to resolve. Somewhere along the line, it is clearly not perceived as being of
    enough importance to warrant the much-needed attention required to bring it up
    to the expected level of security control to provide true information assurance.
    Obviously, the more these kinds of scenario can be automated or dealt with by
    online forms, the better. The ISM can usually assist in smoothing the process
    by ensuring these kinds of suggestions are made and followed through.


    Another common bad practice with regard to user access control is that of copying
    users’ accounts, rather than creating appropriate, new role profiles, and ensuring
    that the new user being created on the system has a clean instance. Given the
    volume of ageing or non-retired accounts, this is another aspect that needs close
    review and ongoing management.


    Then you find out that agency staff may not come through the HR route, as departments
    can employ people directly for part-time contract requirements. This may mean
    that those users are not part of the leavers’ process either. There are a lot
    of different types of worker these days, and you need to capture the different
    routes through which they may join the organisation, so that their before, during
    and after journey of employment can be tracked and managed throughout the life
    cycle. Without a level of co-ordination, weaknesses arise.


    What level of information security awareness is there across the organisation?


    By now, most organisations have delivered some level of user information security
    awareness briefings to their employees at least once. The trick is to plan to
    do this more than once and to ensure that for every employee attending a session,
    an acceptable usage statement is captured that can be retained in their personnel
    file. The statement needs to capture whether they are considered to be a remote
    user or not, and this should then tie them to some assets. Background verification
    checks may need to be carried out for some individuals, too, and these should
    also be retained in personnel files. These checks should then be linked to  their
    training profile and to confirmation that policies have been ‘read and understood’.


    How is incident management addressed?


    You need to be able to identify:


    • what an incident is;


    • what its impact might be – on the organisation or on an individual to whom it
    might relate;


    • what it looks like for different audiences;'
