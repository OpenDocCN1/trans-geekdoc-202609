    | 日期 | 事件 | 描述 |

    | :--- | :--- | :--- |

    | Jan 2009 | Another government department set of guidance notes was produced
    and circulated. | This did not arrive with the right people within the organisation
    until November 2009 – at which point there were only two months left before their
    insecure connectivity was turned off in January 2010. This was another example
    of a clear lack of understanding of the importance of the various missives coming
    out of central government relating to networks, security and connectivity. The
    lack of an appropriately appointed `ISM` meant the organisation risked being unable
    to fulfil its obligations with regard to service delivery while maintaining the
    security of its information assets. |

    | Feb 2009 | Land registry full network access agreement produced. | As with the
    above, this arrived in the right place in November 2009 – with the old service
    to be turned off from January 2010. Shorter timescales to implement the required
    secure network connectivity risked mistakes by the project team – never a position
    an `ISM` wants to find themselves in. |

    | Feb 2009 | More guidance issued from a government department regarding one of
    the corporate systems. | The `ISM` first heard about this on 15 December 2009,
    with a lead time of two weeks to implement by the deadline of 28 December 2009.
    |

    | Apr 2009 | External request for further connectivity. | Another external requirement
    appeared that required a different service area to utilise a secure connection.
    This took another nine months to filter its way through to the `ISM` to be dealt
    with properly. |

    | Jun 2009 | A project team was finally pulled together internally. | First meeting
    took place where the data access policy was discussed and the implications of
    the work ahead to deliver the project were appreciated. |

    | Jun 2009 | Business case submitted. | Revised `BC` was presented to senior management
    requesting funding. Finally, the penny drops, resources are made available and
    a project is instigated that has to operate under stressful conditions due to
    the tight timescales afforded. |


    What is depicted in Table is largely replicated across many organisations and
    should resonate with many readers. It is not uncommon for there to be many (often
    failed) attempts at getting proper information security procedures off the ground.
    Refer back to the opening statement of this book – information security is *not*
    a project … and there’s the rub. As long as it is tackled in your organisation
    as such, there is the risk of a disaster. It must be accepted as part of the fabric
    of the organisation. Information security management is as much a vital component
    as financial and people management. What the auditors know is vital in helping
    to tell the story to sell this message across the organisation.


    However, when there is a significant audit finding that is made known to the appropriate
    governance group, and the choice made is to ‘bury the bad news’, this can present
    the `ISM` with an ethical dilemma.


    A laptop audit was conducted that identified results that were considered to be
    ‘too explosive’. After all the work that had been done on the desktop infrastructure,
    and after months of trying to gain some traction on the laptop estate, audit finally
    made an attempt to apply some metrics and measurement to this vital area. It was
    hard to explain away the fact that the organisation could have 1,500 laptops on
    its hardware asset inventory log and yet only 300 laptops connected to the network
    for updates, especially at a time when similar organisations were being fined
    for not being able to evidence appropriate controls across their ‘estate’ to protect
    information in all its guises and in all its states.


    That was until I came across an organisation that knew it had over 300,000 laptops
    of which:


    * 220,000 were encrypted;

    * 70,000 were unaccounted for;

    * 10,000 were ‘waivered’ – i.e. allowed to be outside the expected security policy
    process.


    The number outside the scope of security policy requirements was significant and
    could not be explained away. Obviously, all things are relative and there are
    always issues with reporting and statistics that make a fool of those reporting
    them, which does none of us any favours. But this situation was made worse by
    the decision not to present the findings to the corporate management team for
    their view and guidance. There was a corporate annual audit taking place the following
    month, and, unfortunately, there were tactics and politics at work. This meant
    that the decision taken was to maintain the laptop audit report as a ‘confidential
    draft’ for the subsequent few months, during which it would be possible to create
    an action plan that would evidence solutions to make the reading ultimately more
    palatable. Audit reports are not necessarily designed to be ‘palatable’. They
    are supposed to represent the facts of any situation at the time, as found, and
    are intended to signpost areas of action required with recommendations for appropriate
    routes forward.


    Remember your memberships – professional bodies have resources to help you through
    just these kinds of scenario, so don’t be afraid to reach out, in confidence.


    As previously advised, work closely with internal (and external) audit, and make
    sure you can help them in formulating an annual audit plan to cover the areas
    of highest priority when reflected across threat, vulnerability, risk assessment
    and business impact, etc.


    ### Increasing and varied security incidents


    As a result of having put in an appropriate information security incident reporting
    process, more information was now being provided to management and the perception
    was that information security incidents were increasing. This was obviously not
    the message that needed to be conveyed at a time when money was being spent on
    improving security! However, this is the risk of opening up the organisation and
    encouraging honesty about the real state of security. It is definitely a case
    of ‘it usually gets worse before it gets better’. Once you shine the light on
    a situation, you see it ‘warts and all’ and this gives you the opportunity to
    embed more appropriate solutions for the future to help reduce this apparent volume
    of incidents.


    The incidents were being reported mainly because, by now, people were ringing
    up with their woes, as they realised that what had hitherto been their normal
    practice was probably unwise. An individual called, concerned that they had no
    keys for their cabinets, but that their work pattern required them to often leave
    their desk in a hurry, leaving papers out and visible all the time. The easy solution
    was for them to get into the habit of putting their papers in a drawer, at least.


    ### Laptop incidents


    It transpired that a laptop provided to the organisation by external funding was
    obviously not needed as it was never networked and never used. The individual
    it was intended for used her husband’s laptop instead, as he also worked for the
    organisation. What would you do? For transparency, you are supposed to be able
    to evidence where the money went and what you did with it – obviously. But, given
    your programme of improvement, what you really want to do is to health-check and
    update the laptop, and ensure it goes to a user that needs it. In straitened times,
    there is nothing worse than having unused resources.


    Some users had laptops, but were told they were not allowed to remove them from
    the building. However, since they were not needed inside the building, as everyone
    had desktops to use, they had not been on the intranet for ages and password lock-out
    had occurred. This was a useless situation for everyone. But it helped to highlight
    a cultural issue; people had the perception that ‘it’s my laptop’, rather than
    ‘it’s an organisational asset’. With the latter attitude, appropriate reallocation
    is a lot easier!

