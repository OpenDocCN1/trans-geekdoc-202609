- fmt: 'Applying hotfixes across a WAN can be tricky, but is part of your solution
    set and again requires some planning in order to ensure that users leave their
    machines in the appropriate ‘switched on’ state to allow for the application of
    the hotfix. This relates back to our discussion in `[Chapter 5](#13_ch05.xhtml#ct5)`
    about needing to be aligned with the IT folk addressing ‘green’ IT, whereby they
    would be seeking to ensure that machines were switched off every evening. Co-ordination
    and communication were going to be required in order to achieve the desired outcome
    on this one (as with all other tasks and challenges).


    ## Other information security tasks this month


    ### Maintain a lively and trustworthy intranet presence

    You need an interactive intranet that is regularly updated with useful information
    – FAQs and guides, as well as policy documentation – so that people know that
    there is a trusted source of information. Seed this with an equivalent RSS feed
    of daily news items that reflect issues that are bound up in good information
    security practice, or are evidence of why it needs to be in place. Most breaches
    are reflective of ‘there but for the grace of whoever you worship go the rest
    of us’. Often it is only a matter of time – no one can be complacent and the larger
    your organisation, the greater the risk of an ill-informed user making a human
    error – without meaning or malice, it’s just the reality of the law of averages.


    Things we were asked for included ‘Instant Astrologer’ and access to `[www.mates.com](http://www.mates.com)`
    … um, really?


    ### Inventory management (again)

    I thought I’d heard it all with the dictaphones query, until I was asked what
    we were doing about camcorders! Somewhere, in the many lists of things you need
    to keep juggling and spinning as an ISM, you need to have an overview, for each
    team, section, department and directorate, of what their function is and what
    type of equipment you should therefore expect them to need. Your colleagues in
    the RM area could already be gathering this kind of information, as it should
    be picked up under ‘what media do you use to capture, use, share and store information?’
    Either way, you need to be able to research the requirements and to help design
    the most appropriately secure solution.


    ### Security awareness theme

    This month’s information security theme could pick up on any subject of your choice.
    In this particular example and with experience from the chapter, tackling antivirus
    best practice would be the obvious choice! As long as you encourage the users
    to ensure that they update their own antivirus product on their home machines,
    they will appreciate the scale of the effort you will be applying across your
    whole organisation when it comes to protection mechanisms.


    ## Chapter summary

    This chapter has, in particular, focused on the mechanisms that constitute a `PIA`
    process. This has been done in order to help the ISM appreciate the role they
    play in steering the organisation to conduct such assessments and keep track of
    the results on an ongoing basis.


    ## CHAPTER 9: APRIL - LINKING INFOSEC WITH INFOGOV


    ### A linguistic journey to information governance

    As we’ve established, the information security industry loves its acronyms and
    abbreviations, so in this instance we have `InfoSec` for information security,
    and for information governance we have `InfoGov`.


    As an ISM, you need to be thinking more broadly, as this is the trajectory at
    the moment. Information security begets information assurance begets information
    governance. If we are truly protecting information assets, holistically, this
    is where we will end up. So, be prepared to think more widely than your current
    scope of understanding, and do a lot of reading and extra learning.


    We have seen other acronyms in our space, including `GRC` (governance, risk and
    compliance) - but we need to really start getting to grips with the meaning of
    the words that make up these acronyms. Governance is supposed to mean visibility
    of governance across the whole organisation. Risk, in this instance, is again
    supposed to mean risk management across the organisation, not just specifically
    IT risk. Business risk, financial risk, reputational risk, information risk –
    they all need to be dealt with holistically. Finally, the compliance aspect of
    this triangle requires an appreciation of the whole legislative, regulatory and
    standards requirements for your organization, not just compliance with a firewall
    policy. It is far beyond this. It is compliance with everything that we have been
    talking about in this book, all the policies, procedures, standards and guidelines
    combined. This is because they should have been crafted with an understanding
    of the compliance landscape so that you can evidence that you are complying with
    everything required of you.


    The international standard `ISO/IEC 38500:2008` described the corporate governance
    of IT as being “the system by which the current and future use of IT is directed
    and controlled”. Corporate governance of IT involves evaluating and directing
    the use of IT to support the organisation, and monitoring this use to achieve
    plans. It includes the strategy and policies for using IT within an organisation.
    However, what we are talking in this chapter are the links from information security
    to information governance. This takes IT governance to the next level, beyond
    just the technology, in keeping with all the movements over the last few years
    across ‘big data/raw data’, the `information spring` if you will. What is required
    is a holistic view. So let’s take a journey through the various stages from IT
    security through to information governance.


    ### How did we get here?

    Research can show that the journey to `IA`, which precedes information governance,
    is via the following themes that have emerged over time:


    * physical security;

    * operational security (`OpSec`);

    * computer security (`CompuSec`);

    * communications security (`ComSec`);

    * IT security (`ITSec`);

    * information systems security (`InfoSec`), which merged `ComSec` and `CompuSec`
    following rapid changes in technology and, thus, combined in a new paradigm to
    become `InfoSec`, internationally recognised in the Common Criteria for Information
    Technology Security Evaluation Protection Profiles (see `[www.commoncriteriaportal.org](http://www.commoncriteriaportal.org/)`);

    * system safety;

    * system reliability.


    System safety is not something that we have found ourselves focusing on to any
    great extent in the information security industry, although there are a number
    of publications that put it squarely inside our boundaries. In many ways, this
    is a better lens through which to view things, as it provides a broader perspective.
    It also shows why we must provide the high levels of protection that we are seeking
    after risk assessments. The classic triad of ‘CIA’ was originally a `ComSec` definition
    covering:


    * Confidentiality of information: ensuring it is accessible only to those authorised
    to have access and ensuring data is kept private whether manual or electronic.

    * Integrity of information: safeguarding the accuracy (inputs and outputs) and
    completeness of information through the application of controls and management
    checks.

    * Availability of information: ensuring that only authorised users have access
    to information when required during its life cycle; making sure information stays
    in the right hands, in the right place, at the right time.

