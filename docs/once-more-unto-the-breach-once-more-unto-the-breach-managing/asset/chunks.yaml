    \ of why there are so many potential systems with a list of employees in them.\
    \ The staff directory that you find through an intranet may have different records\
    \ to what `Outlook^®` appears to hold. What you need, at least in one instance,\
    \ is one version of the truth for the user population that needs to be managed\
    \ in terms of policy, standards and controls, and information asset handling,\
    \ which leads to your next data set requirement.\n\n### How many assets require\
    \ protection in your organisation?\n\nSo often, information asset protection is\
    \ utterly misunderstood and considered far too narrowly. It is one thing to have\
    \ a configuration management database (`CMDB`) – an `ITIL^®` element that is supposed\
    \ to contain all the components of an information system. But the focus may only\
