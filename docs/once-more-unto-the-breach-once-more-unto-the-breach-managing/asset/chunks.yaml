  trans: '


    # ISM 活动 – 1 月


    - 植入安全文化

    - 桌面设备更新与消费化

    - 事件报告

    - 数据共享协议/信息共享协议

    - 记录管理

    - 渗透测试

    - 环境管理问题


    # ISM 活动 – 2 月


    - 用户管理（及权限管理）

    - 清单管理

    - 审查备份安排

    - 审查业务连续性需求并在全公司范围内广泛参与，开展业务影响分析

    - 审查整个组织范围风险评估安排


    # ISM 活动 – 3 月


    - 处理用户需求

    - 隐私影响评估

    - 管理病毒爆发

    - 建立一个实用的信息安全内网


    # ISM 活动 – 4 月


    - 审查信息保证安排

    - 与信息治理需求接轨

    - 安全指标与测量

    - 设备生命周期管理


    # ISM 活动 – 5 月


    - 维持态势感知

    - 处理语言和管理挑战

    - 笔记本电脑管理

    - 外包/第三方管理

    - 处理端口控制


    # ISM 活动 – 6 月


    - 审查审计报告 – 内部外部

    - 审查其他项目建议

    - 审查组织投诉

    - 安全事件响应管理

    - 访问控制

    - 可移动媒体设备管理


    # ISM 活动 – 7 月


    - 阅读 – 期刊文章、书籍、博客

    - 维持持续职业发展


    # ISM 活动 – 8 月


    - 识别所有资产 – 硬件、软件、信息、人员

    - 人 – 扩展人脉

    - 审查访问控制

    - 审查信息安全意识水平并设计新材料

    - 审查事件管理流程并在必要时改进


    # ISM 活动 – 9 月


    - 软件许可

    - 远程和移动工作人员管理

    - 用户验收测试

    - 处理物理安全（融合）

    - 密码管理

    - 笔记本电脑管理


    # ISM 活动 – 10 月


    - 信息安全策略的制定与开发

    - 防病毒软件（恶意软件）管理

    - 标准构建与镜像部署

    - 密码管理（再次）

    - 审计日志管理

    - 漏洞管理

    - 云计算 – 第三方管理等

    - 项目与人员管理


    # ISM 活动 – 11 月


    - 远程办公（再次） – 地点网络设置

    - 确保安全从一开始就构建到所有项目中

    - 信息标签化与信息资产分类

    - 确保教训被记录并共享


    # ISM 活动 – 12 月


    - 安全改进计划 (SIP)

    - 传真管理

    - 镜像构建（再次）

    - 物理安全（再次）


