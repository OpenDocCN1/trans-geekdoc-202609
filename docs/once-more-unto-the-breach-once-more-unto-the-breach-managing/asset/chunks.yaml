    - Most external connectivity requirements that are auditable put a high degree
    of focus on the way services and systems are deployed. Compliance will require
    corporate commitment to ensure users comply with new regimes surrounding governance
    of network access, control of the utilisation of hardware and general adherence
    to associated corporate guidelines and policies.

    - Extending the depth of information security across the organisation, accepting
    it as a BAU activity that benefits from corporate mandate, and embracing management
    into the information governance culture, are the ultimate goals. In other words,
    this is how a user culture should always operate, not just for the purposes of
    gaining connection to a secure network or fulfilling any other contractual, regulatory
    or legislative requirements.


    In reality, anything that is described in this book is nothing more than encouragement
    to achieve the minimum expected security standards for an organisation.


    ## Embracing data protection and privacy


    There is a fundamental and intrinsic link between security and data protection
    and, indeed, privacy. You cannot have the latter two without the former, and the
    seventh data protection principle in the `UK Data Protection Act` defines security
    as a fundamental requirement to be woven into the fabric of your organisation,
    ensuring you are in a position to protect personal data in whatever form it might
    take.


    > `UK Data Protection Act 1998, seventh principle`


    > Appropriate technical and organisational measures shall be taken against unauthorised
    or unlawful processing of personal data and against accidental loss or destruction
    of, or damage to, personal data.


    As the `ISM`, it may be that you are asked to assist with fulfilling subject access
    requests (`SARs`) when individuals ask to see all the information that your organisation
    holds on them. This can require trawling through data logs, e-mail archives, system
    records, etc., as well as paper/manual records, and can be time-consuming and
    challenging in terms of piecing together the breadth of information captured and
    ensuring that the response is provided within the requirements of the legislation.


    Data protection is a huge legislative learning curve, but it behoves the `ISM`
    to learn the `Act` and understand it from both a legal and technical point of
    view, as it is not going away. More changes are planned in terms of data breach
    notification, and the underlying premise in terms of how data protection authority
    bodies will change too – currently your organisation must handle personal data
    in a certain way; a) you must know that you have it, b) you must know where it
    is at all times and c) you must have taken “appropriate technical and organisational
    measures” to protect that data. The latter, in the 21st century, implies encrypting
    data at rest, data in motion and data in transit, at a minimum. Again, this is
    a massive area in itself, and there are many great books that can be found on
    the subject.


    We will address the need to undertake privacy impact assessments (`PIAs`) in the
    next chapter. Suffice to say that if you are in this mode of thinking, then you
    should be able to see the links with business impact assessments or analysis too.
    The `ISM` has a key role to play in identifying the likely root causes of threats
    being realised and establishing their likelihood. Above all, the `ISM` can write
    the definition of a great many of the mitigating or compensatory controls that
    could be implemented to ensure the appropriate protection of personal data and/or
    information assets, as expected by the regulators, stakeholders and the public
    at large.


    ## Other security tasks for this month


    ### User administration


    This is another easy fix – a low-hanging fruit task – and yet it is so often not
    addressed. We talked about this back in `[Chapter 1](#09_ch01.xhtml#ct1)`. It
    is an ongoing task and you really need to make it a mission to ensure that:


    - there are no users on the systems who are no longer part of the organisation;

    - every single user only has the access they need to do the current job for which
    they are employed;

    - no one is still holding access rights for systems that related to other roles
    they have previously carried out, for which they no longer require such access.


    It’s these kinds of little things that really show whether an organisation is
    taking security seriously, both internally to itself and to outsiders (when audited
    or otherwise).


    ### Inventory management


    The list of items needing to be included on your inventory gets longer and longer,
    or at least it does if you reflect on the potential risks associated with the
    use of some machines. Consider the purchase of new dictaphones – the technology
    has come on so far that these now have an inbuilt storage element similar to a
    `USB` drive, and if that drive is not encrypted, you need to review the potential
    requirement for addressing this risk. What if the dictaphone was dropped in the
    street? Anyone could pick it up and press play to hear what had been recorded
    and, depending on the result of the discovery, take it straight to the local media
    – or worse still, the national press. In all likelihood, this would become an
    immediate data breach and an incident response would need to swing into action.
    Mighty oaks from little acorns grow…


    ### Security awareness theme


    This month’s information security theme could pick up on the fact that the media
    focus is usually, at least for the first two weeks of February, related to Valentine’s
    Day, so there’s a ‘love’ element. You could run a campaign entitled ‘Love your
    Laptop’, where users are encouraged to ensure that they have connected to the
    network, updated the patches and antivirus status, run a back-up, cleaned out
    the cookies and Internet history, etc.


    ## Chapter summary


    The brevity of this chapter reflects that February always feels like a short month
    for everyone, depending on how it ‘falls’ across the calendar weeks. It is a time
    to make the most of the speed of the month and tackle some of the basics, as have
    been expressed, while continuing to keep plates spinning at a management level.


    ## CHAPTER 8: MARCH - SLIPPING THROUGH THE NET


    ### The impact of politics


    During the period when the core of this research was undertaken, the `UK` political
    landscape was changing beyond recognition. In the `UK` public sector, when an
    election is forthcoming, there is a time referred to as `purdah` - the period
    from when an election is announced until after the election is held, now more
    referred to as the pre-election period. There is an immediate hold on spend, no
    new projects get approved and ultimately money gets clawed back on projects which
    have already been funded. This results in most employees feeling quite ‘stuck’,
    unable to progress existing plans, uncertain of their future – this feeling can
    be exacerbated depending on the political leaning of their organisation and the
    likely impact a change of government will have on their future and that of their
    landscape. Stasis exists.


    There will be another one before every general election, so bear this in mind
    if that’s the sector you are in. If you are new in the sector or the role at such
    a time, it can be quite bewildering as all your planned timelines for delivery
    of security improvement programmes change suddenly and come to a grinding halt.


    This thread will be picked up again in `[Chapter 10](#18_ch10.xhtml#ct10)`.


    Privacy impact assessments

