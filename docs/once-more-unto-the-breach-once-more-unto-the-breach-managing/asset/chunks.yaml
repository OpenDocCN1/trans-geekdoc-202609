- fmt: '` 标签内是关于“ISM（信息安全经理）职业”的英文书籍内容，但结尾处突然变成了“人际交往术（Make friends and influence
    people）”的标题。


    作为高级文档工程师，我将根据您的要求，针对提供的 **ISM 职业文本** 进行标准的 Markdown 化排版。


    以下是排版后的内容：


    [content]

    Throughout the book, there are breakout sections referencing events that have
    occurred or thoughts that have arisen as a result of things people have said which
    provided inspiration to the author. There is also what will appear to be a great
    deal of repetition – but this is exactly the reality of the job as an `ISM`. Life
    in the trenches is one long exercise of doing the same things over and over again
    but with nuances, and with superior solutions as you get to know the organisation,
    its culture and what works. The tasks don’t stop – hence security is a process
    not a project!


    The job of the `ISM` is to consider everything in terms of the potential risks
    to the organisation and to seek to implement appropriate preventative or deterrent
    controls in due course. The role is never-ending, as there are always new employees
    that need to be embraced into the culture of your organisation and who need to
    understand their responsibilities and the requirements placed upon them in terms
    of protection of information assets.


    Being an `ISM` is about being both a counsellor for many and a change activist
    for your organisation. There is a level of inspiration required for you to do
    what needs to be done, given that the historical view of the role and its positioning
    has not necessarily been entirely positive. I hope that this book goes some way
    to changing this impression for the better.


    Consumerisation will no doubt be featuring large for many organisations as part
    of ‘the three Cs’ of `Cyber`, `Consumerisation` and `Cloud` that have dominated
    the conversation in recent years. This is now more commonly known as ‘bring your
    own device (BYOD)’ and presents significant challenges to ICT departments in terms
    of estate management and the incorporation of different operation platforms alongside
    existing corporate systems. This book is not designed to address these issues,
    as there is a growing number of resources available to do so. Suffice to say that,
    from an information security point of view, the task in hand is still to protect
    information assets. This requires controls and safeguards, and consideration of
    all aspects of confidentiality, integrity and availability.


    ## CHAPTER 1: AUGUST - PULLING A TEAM TOGETHER


    ### It’s not a project …


    The most important thing to remember from this book may very well be that there
    should be no more information security projects, but rather programmes. What we,
    as information security professionals, are ultimately delivering are programmes
    of change across our organisations. All the security breaches that have dogged
    the second decade of the 21st century appear to have been as a result of operating
    at odds with the importance of the key elements of security (i.e. maintaining
    the integrity, confidentiality and availability of information assets). This book
    will not repeat detailed definitions of information security per se – there are
    many, many resources available out there to do just that. In particular, the reader
    is referred to the 10 domains of the common body of knowledge (`CBK`) for information
    security, maintained by the International Information Systems Security Certification
    Consortium ((ISC)²). But for the sake of clarity, here is a quick reminder of
    what are considered to be information assets.


    **Information assets include:**


    * paper-based systems and hard-copy reports

    * telephone conversations and instant messages

    * internal and external post

    * information on fax machines and printers

    * information on laptops and palmtops

    * information on hard drives of all sorts, including stateless

    * information stored on CDs, USBs, DVDs, disks and tapes

    * information on servers and workstations

    * information transmitted over networks.


    This book is designed for a readership that appreciates operating in a paradigm
    that knows and understands something of the expectations of information security
    – i.e. that the task at hand is very much more about the people and the processes
    involved in information asset protection than it is about the information technology
    used to support these. In fact, it is often the case that the `ISM` is not a technical
    expert in any of the technologies being used, or intended to be deployed, across
    the network of the organisation for which they are providing security advice.
    The `ISM` needs to know about the requirements and how best to achieve them, and
    to understand all sorts of peripheral issues, rather than the specifics of each
    and every technology. It simply isn’t possible, and in many cases, this is why
    it is necessary to have IT security administrators, security architects and many
    other roles, as well as the `ISM` – i.e. the responsibility should not rest on
    just one individual.


    While it is true that the role and its functions started out in technology, as
    data security has matured into information security the skills and role profile
    have matured too. For an organisation to benefit from the possible outcomes of
    dealing with the plethora of information-related challenges being faced on the
    daily basis, the `ISM` role needs to be one with a broader reach and a broader
    skill set.


    So, the idea in these chapters is to provide an insider’s view of what it is really
    like to operate as an `ISM`, in a real organisation dealing with everyday challenges.
    By using the role of ‘project manager’ on a programme of change we will highlight
    all the various incidents and issues that arise on an almost daily basis – many
    of which often go unnoticed. Consider reading this book as the equivalent of a
    training ground of things to watch out for, in case you ever find yourself blinkered
    and starting to miss the smaller things. This is very much akin to missing the
    flapping of the proverbial butterfly wing and, thus, not spotting the fact that
    a storm is coming down on you, as a result of having missed the small detail earlier
    on.


    When you are set the task of delivering a particular project, your team members
    will always be a significant part of the success or failure of that project. One
    of the key failures of security change management is that it is perceived as a
    project, and, thus, by its very nature is assumed to have a beginning, middle
    and an end. In reality, security is something that needs to be baked into an organisation
    and, thus, embedded into its fabric – and because of this, it lends itself more
    to a programme than a project because there is no real end to these activities;
    security will ultimately be constantly changing in order to adapt to the information
    risks that present themselves along the journey.

