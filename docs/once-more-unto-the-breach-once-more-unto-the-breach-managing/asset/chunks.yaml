    || Ability to access ICT services as/when/wherever required, including external
    locations while in transit, at home or in the office. |


    | **Associates** |


    | Members || Elected members. In general, highly mobile across the organisation
    and external locations. High level of communication. Frequent meetings. || Ability
    to access certain ICT services as/when/ wherever required. Needs to manage contact.
    Increased use of conferencing to save on travel/meeting time. |'
