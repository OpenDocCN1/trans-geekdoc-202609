    # 组织版图与基础设施


    你需要了解整个组织版图，以便你能够根据数据敏感性、用户数量、所用资产类型、使用的软件以及硬件要求，从面上以有意义的方式进行绘图。每个地点都有许多考虑因素。然而，构成你基础设施一部分的每个独立建筑位置都应该被视为网络上的一个“节点”，而不是“远程”位置。只要你知道它们在哪里，它们就不是“远程”的。由于它们是静态建筑，你可以对其中包含的配置项实施某种程度的控制，包括每个位置管理的端口数量。在涉及
    IT 部门如何建立连接时，你需要消除任何“他们与我们”的对立情绪，因为诚然，你们实际上都是同一个组织的一部分，除非根据法律规定实体之间有明确的。


    ## 第三方


    与外部第三方合作是真正困难所在之处，特别是当需要第三方在你的内部地点工作时。大多数挑战可以通过制定和签署适当的第三方访问协议或数据共享协议（或两者兼顾）来解决。到目前，已经有许多优秀的案例可以参考，因此不缺资源来帮助解决这些难题。但你仍需要更广泛地与法律人员、设施管理等人员接触，为所有相关方寻求最佳解决方案。


    ## 创新


    创新、创新、创新


    你经常发现你的组织内部某些领域正在进行非常出色且具有创新性的工作，发现这一点非常重要。如果你散发出开放和积极的态度，人们会更多地让你参与进来，并确保你处于各种决策循环中。在一个项目中，事实有一项极其有趣且突破性的公共部门工作正在进行，但面临着安全挑战。因为我一直在到处跑，积极地宣传安全意识，相关人员感到放心，认为他们可以与项目办公室对接并获得所需的支持，以确保他们自己的项目也能成功。他们面临的最大挑战是第三方以及上述的远程办公挑战，大多数问题都是通过仔细制定必要的协议得以解决的。


    对于 ISM（信息安全管理）而言，困难通常在于此类项目在 ICT 参与之前就已经启动了，这是由于长期的预期或早期与知识缺乏或支持缺乏相关的挫败感。如果不积极参与创新项目（这注定会发生，因为事实就是如此），将面临项目团队无法意识到的风险，因为他们中没有人具备必要的技能组合来考虑基于数据和信息的风险。


    # 信息标记


    ISO27001 长期以来一直建议通过对信息资产进行分类来处理信息处理。在英国公共部门，信息资产有多种标记选项（也称为标记）可供选择，这些在每个层级都需要特定的处理方式。例如，`1998
    年数据保护法`（`DPA`）中定义的敏感个人数据等同于政府术语中的受限（`restricted`）数据，需要以特定方式进行处理。在美国，这通常被称为个人身份信息（`PII`），其定义范围更广，涵盖了更多元素，因此你需要了解哪种对你的整个组织最适用。


    这是提供适当信息安全中一个众为人知的困难因素，需要大量的思考和考虑。


    ## 教训总结


    在执行过程中维护教训日志（`LLL`）是一项非常有价值的练习。确保将其编写记录并进行演示更有用，这样就可以与他人分享。这是良好管理的正常部分，并且可以从中获益。


    ### 表 4：教训日志


    | 问题领域 | 描述 | 备注 |

    | :--- | :--- | :--- |

    | 尽早开始 | 组织将工作压缩在由“如何应付”的心态驱动的活动中，并在两个月的窗口期内，仅为了连接基础设施而做了“最小化”处理。这导致 ICT 工作人员压力过大、紧张且工作滞后。它让用户对变化感到困惑，并对需要解决的小问题感到沮丧。
    | 如果一个项目看起来很难，那么它可能确实很难——但恐惧不是推迟开始的良好理由。通常会有资源提供如何最好应对“整个大问题”的建议，而且他们需要尽早接触并更多地依赖技能转移。结论：尽早开始，并为项目团队提供更多支持。确保尽早获得领域知识以评估任务规模。
    |

    | 协作工作 | 包括尽早让客户参与。但没有让所有人参与！ | 一旦团队受到激励并获得充分授权，感到自己的贡献受到重视和欢迎时，他们的活动水平显著提高，并对项目的最终成功产生了巨大的积极影响。尽早让客户参与项目非常有益。事实上，大多数项目并不是孤立的活动，因此始终需要与所有团队成员互动并保持信息畅，即使他们不在特定的项目团队中。此外，为项目团队提供一种参与感，意味着他们有某种凝聚在一起的东西（好吧，我们的部分是零食激发的，但确实有帮助！）
    |


