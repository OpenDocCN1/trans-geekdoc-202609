    exist and so they know that they have a recourse in the future.


    People also started to notice the little things when it came to system development,
    like passwords being displayed in a field on the screen in clear text, and they
    took the time and trouble to report these kinds of findings to the ISM, who then
    would have to come up with a solution and provide some feedback. The information
    security standards are developed on the basis of an understanding of the ‘plan,
    do, check, act’ loop – where you *plan* to do something, *do* it, *check* if it’s
