    This has to be calculated in terms of actual number of days lost in any one week;
    if you are running a project in a compressed timeframe, this is unsustainable.
    The worst loss in one week was 32 days! You would have thought this was blindingly
    obvious. However, managing single points of failure becomes an impossible task
    if the project manager has no influencing capabilities over the project team memberss’
    managers – or there is no active management support that recognises team members
    need extra time to do their security tasks properly, rather than on top of their
    day jobs. So set ground rules and boundaries in week one and make sure commitments
    are adhered to and priorities appreciated.


    ### Loss of momentum

    On several occasions, a loss of momentum (`LoM`) was experienced. This was as
    a result of the culture, which tended to see this entire process as an entirely
    separate project from BAU, even though all the snags that were stumbled upon were
    as a result of BAU misconfigurations. In particular, there was a `LoM` from a
    successful extension application (i.e. an external deadline extension); there
    was a `LoM` during the summer holiday period and there was a further `LoM` as
    a result of having gained the compliance approval without continuing to close
    down the items on the snag list.

    **Recommendation:** Ensure management support is consistent and sustained.


    ### Project funding availability

    Without the injection of the executive-approved funding, this project would not
    have succeeded. The funding was only granted following significant effort by the
    externally recruited `ISM`, their preparation of various business case justification
    documents and delivery of executive briefings and presentations.

    **Recommendation:** Ensure that those charged with the task of delivering a significant
    project are adequately resourced and, if not, that only those with the necessary
    skills are put in front of executive management, with the ability to speak in
    a language that will resonate appropriately.


    ### Understanding wider implications

    Somewhere along the line, you have to understand that IT works on a ‘seven-stack
    layer’ and deep security infrastructure improvement projects usually deliver across
    all seven layers in order to provide the requisite level of protection for the
    nature of information traversing the network.

    **Recommendation:** Ensure vision of impact and likely coverage is captured at
    the outset, and on an ongoing basis as the landscape and requirements continue
    to be changed and formalised.


    ### Interpretation of requirements

    This relates to the ‘start earlier’ lesson learnt, because actually an earlier
    start would have afforded the adoption of the preferred solution, which was the
    application of all the requirements to the whole network rather than to a segment.
    Either way the technical solution adopted, in conjunction with external consultant
    advice provided at the time, left the organisation with a lot of work to do to
    maintain the current compliance expected. This also relates to ‘lack of technical
    skills’ (below), as without the necessary internal skills to see the likely pitfalls,
    there was an element of ‘the blind leading the blind’.

    **Recommendation:** Ensure the right skill sets are available at the earliest
    opportunity. (Bit of a chicken and egg situation, this one, because if you don.t
    know you need to know a certain skill, then you don.t know, do you? Donald Rumsfeld,
    anyone?)


    ### Lack of documented processes

    Because people didn.t follow existing documented processes where they were available
    things were made up and guessed at. Under pressure this creates mistakes which
    take more time to be addressed. (*See also ‘bottom-up decision making’*.) The
    pace and scale of change meant that actions were taken ‘on the fly’.

    **Recommendation:** Ensure documented procedures are available for all known BAU
    tasks in all areas – and where they don’t exist, build them into the project as
    deliverables. All changes need to be raised through the change request process,
    so that they are appropriately tracked.


    ### Lack of server management

    Servers are not patched and kept up to date. There is no tangible ownership and
    day-to-day housekeeping of the server ‘farm’. The state of the servers, their
    lack of ownership and proper management, puts the accuracy, integrity and availability
    of those information assets (including users. and citizens. data) at risk on a
    daily basis.


    Lack of server management meant that servers were not up to date enough to be
    repurposed, so new kit had to be purchased at short notice and rolled out in a
    hurry, without the requisite security hardening applied; this was then (thankfully)
    picked up as a vulnerability that had to be addressed. So double the work was
    done, time and effort that could have been better spent elsewhere. This led to
    tasks taking longer than expected and each security control element became more
    laborious and more long-winded that it would otherwise have been.

    The servers, at the end of the day, are the custodians of the crown jewels of
    data that the organisation has a responsibility to protect.

    **Recommendation:** Ensure patch management is a responsibility and active role
    within the infrastructure management.


    ### Lack of SLAs

    Service level agreements (`SLAs`) need to be in place between service areas and
    ICT, and internally between teams in ICT, to support each other and provide an
    appropriately expected level of service in response to requests (rather than just
    ignoring things or ‘shrugging shoulders’).

    **Recommendation:** Documented `SLAs` help everyone to have their expectations
    set and hopefully met (and sometimes even exceeded!).


    ### Lack of data ownership, management and prioritisation by users

    ICT ends up being responsible for issues that are, in essence, not of their own
    making, but are the responsibility of the users. There are also links with green
    IT work, because just adding another server into your farm should not be the answer
    every time.

    **Recommendation:** Data cleansing is required – particularly when migrating to
    new systems. It is better to cleanse than to take erroneous data with you. There
    are links here with file management, and training in it is required. Implementation
    of a proper `RM` file plan structure on the servers is required (it is appreciated
    that this is easier said than done!) Users must be encouraged to take more responsibility
    for the data that they are, let.s face it, creating on a day-to-day basis.


    ### Lack of role profiles

    User access rights are currently not adequately managed and this needs to be addressed,
    so that groups of users can be migrated together in the future on the basis of
    their expected access rights, permissions, mappings, etc.

    **Recommendation:** Less user disruption is possible if the role profile exercise
    has been undertaken - to identify who is doing what function, where, and what
    system access they require to do that job, on the basis of applying the ‘need
    to know’ principle.


    ### Lack of service desk management commitment

    There was a need to ‘pump’ out messages to the users across the whole organisation,
    saying that the service desk would be experiencing an increase in call volume
    as a result of a specific project workload and to be patient. This was difficult
    to achieve without the proper involvement of representation from the service desk
    itself.

    **Recommendation:** Ensure that a) the service desk is appropriately staffed to
    deal with project ebb and flow, and b) that you communicate with users en masse,
    so that they are aware that while they may be ‘screaming’ for resolution, there
    may, in fact, be an operational priority that exceeds their own immediate needs.

