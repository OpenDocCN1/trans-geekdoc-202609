  raw: 'In November 2007, the UK public sector approach to data handling turned on
    its axis as a result of a government department’s loss of two CDs. The subsequent
    months brought forth a relentless number of reviews, inquiries and report outputs,
    all of which came up with relatively similar conclusions surrounding the need
    to embed better information security culture, awareness, education, data handling,
    etc. at all levels across the organisation and the public sector as a whole. As
    a result new data-handling requirements were required. In November 2008, a year
    on, the Information Commissioner held a conference entitled ‘Privacy by Design’
    at which he launched the results of some research done (see *[www.ico.gov.uk/news/current\_topics/privacy\_by\_design\_conference.aspx](http://www.ico.gov.uk/news/current_topics/privacy_by_design_conference.aspx)*).
    The end result was the uptake of the habit of undertaking PIAs as described below.


    Definitions


    Personal data – This is any data from which a living individual can be identified,
    whether stand-alone or when combined with other data available to the organisation.


    Privacy – The definition of privacy goes beyond personal data to include actions
    that may intrude on an individual’s personal life or affairs. This may include
    monitoring or screening that will not be held in permanent form.


    Benefits of undertaking privacy impact assessment


    There are many risks associated with the processes and technology used in the
    handling of personal data. By  identifying risks in the early stages of the project,
    they can be avoided or mitigated while there is still the opportunity to effect
    change. Changes made at a later stage or after implementation can be costly, both
    in financial terms and in damage to reputation.


    When any new process or system is proposed, consideration should be given to the
    impact it may have on the privacy of the stakeholders and, where appropriate,
    a PIA should be undertaken. Equally, a PIA should be undertaken where significant
    changes to existing processes or technology are proposed. The assessment involves
    reviewing proposals in the early stages of the project to identify the privacy
    risks for all those it may impact upon. Following this, the next step is to document
    proposed solutions and ways of mitigating privacy risks.


    Risks to the individual


    These are loss, damage, access or use by unauthorised persons, and personal data
    being exposed or getting into the public domain. Also, consideration will need
    to be given to any activity that may contravene the individual’s rights.


    Risks to the organisation


    These are damage to reputation, legal/compensation costs, low adoption of scheme
    by stakeholders, costs to redesign systems for greater compliance, and collapse
    of the project or withdrawal of support.


    Data considered to be high risk


    Sensitive data, as defined in the UK Data Protection Act, can be described in
    brief as covering health, ethnicity, sexuality, offences, political opinion and
    trade union membership. More usually, these are listed as:


    • racial or ethnic origin;


    • political opinions;


    • religious beliefs or beliefs of a similar nature;


    • membership of a trade union;


    • physical or mental health or condition;


    • sexual orientation;


    • commission or alleged commission of an offence;


    • proceedings for any offence or alleged offence, or sentence of court.


    There should be an expectation that personal contact information is kept confidential,
    including e-mail addresses, phone numbers and home address. Other information
    to be considered includes financial information, details of individuals at risk
    and travel plans, which could also present risks.


    Expected outcomes


    These can be expressed as:


    • identification of privacy risks;


    • understanding of privacy risks from the stakeholders’ perspective;


    • identification of alternative options;


    • understanding of acceptance of the project;


    • identification of ways to lessen/avoid negative impacts on privacy;


    • where negative impacts are unavoidable, justification for accepting risks;


    • documented evidence that privacy has been considered;


    • dissolution/cessation of the project, if it is clear that it is not going to
    meet legal obligations or compliance requirements, or if is not going to be possible
    to maintain the appropriate and expected levels of security and privacy for the
    individuals’ personal data involved.


    All of these can be incredibly important and valuable, depending on who the audience
    is and who your stakeholders are.


    To enable the assessment to take place, the following information must be gathered.


    Conducting a privacy impact assessment


    All groups who may have an interest in, or be affected by, the project should
    be identified, with a brief description of their role and the nature of any likely
    impact.


    Carry out an environmental scan. Learn from other projects, whether internal or
    in the wider external environment. Useful sources include:


    • project documentation for previous projects, including LLLs (especially where
    the project is aimed at replacing existing technology);


    • reports, articles and papers in the public domain;


    • discussions with others with expertise in the project area or with knowledge
    of compliance issues;


    • when purchasing new technology, discussions with reference sites may provide
    information on how they have addressed privacy issues.


    In most circumstances, for projects which involve personal data, a small-scale
    assessment will be appropriate. Examples of projects where a small-scale assessment
