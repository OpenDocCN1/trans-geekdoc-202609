    ### Other security tasks for this month


    ##### Addressing user requirements

    We had a need to revoke `CD auto-enable` on our PC build in order to achieve a
    government-dictated security requirement. However, sometime later a request was
    received by ICT to switch the auto-run feature back on as the users were finding
    it too.


    ##### Addressing old equipment

    We’ve seen over the months that there are various requirements for assisting in
    what might be considered to be facilities management. The reason for your apparent
    ‘meddling’ is to ensure that you are actually providing the right level of care
    and attention to the end-life stage of equipment. So, when a user comes forward
    with a large box of disks, what do we do with them? The users says they are fine
    to be disposed of, but how do we know what on them, so that we can justify the
    decision to destroy them? It would be a laborious task to review all the disks.
    Every day is filled with this kind of conundrum to be solved. Perhaps a random
    sampling of the contents could be done – if the disks are still machine readable
    – and then a level of judgement applied as to whether or not the information in
    its entirety is actually past its retention period. Engage with the `RM` team,
    whenever possible, so that they can make the appropriate amendments to the `RM`
    systems that should be recording such information. As long as you have some evidence
    for the actions taken and justification for the approach, it will be easy enough
    to explain yourself, should anyone question this further down the line.


    ##### Ongoing antivirus management

    When your organisation experiences a serious virus (malware) outbreak, it can
    be a pretty defining moment for the ISM. The team was still trying to contain
    the Conficker attack, which had spread still further as a result of the lack of
    previous management of the servers (as highlighted in the penetration test results
    report). The extent of the damage was eventually realised when a brute-force attack
    was identified on a server. This was immediately isolated from the network, but
    it needed to be patched and this brought forward some real thorny issues of:

    • why servers were not being patched;

    • which ones were in or out of a management loop;

    • how long it takes to make decisions about patching and updating these servers.
    The demonstration of how easily and quickly you can get exposed, and how it is
    likely to play out in the public perception if the media get hold of the news,
    showed how inadequate the patching process was.


