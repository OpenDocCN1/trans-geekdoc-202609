    标准的企业台式电脑可能有多达八个 `USB` 端口。某些端口用于外围设备，如键盘或安全令牌读取器，但通常会有一个或多个未使用的端口。在本书作为示例的组织中，`USB`
    端口默认是“始终开启”的，随时准备为插入终端计算机的任何支持 `USB` 设备提供服务。


    您的组织可以选择通过 Windows® 组策略和活动目录管理 (ADM) 模板禁用 `USB` 访问，但此操作并不能为管理员提供细粒度的控制。它是“全有全无”的，因此终端上的所有
    `USB` 端口要么可用，要么不可用。由于大多数终端现在都需要 `USB` 来连接强制性外围设备，这种控制实际上是徒用的。解决这一难题可能需要项目团队资源来调查有关端口控制的最佳方法。然而，成本往往决定了部署更廉价的解决方案，即使这会降低整体安全性——并增加管理开销。这只是您的职责中将面临的众多困境之一，即寻求提供指导、引导以及满足所有需求的最佳整体解决方案。这是一项艰巨的任务，也是一项困难的挑战。


    随着政治格局的变化以及随之而来的支出收紧，原定的端口控制项目停滞了，因此可移动设备的控制并未按计划进行。目前正在实施一种更廉价的过渡方案，使用活动目录来控制端口。这凸显了战术和方法方面一个有趣的难题。活动目录列表所持数据的准确性始终是一个至关重要的起点。此外，全局地址列表
    (`GAL`) 是您组织配置中具有根本意义的元素，确保其中包含准确且最新的信息至关重要。当涉及到用户时，这回到了我们提到的需要一份最新的用户列表的需要，以便您了解自己的用户群是谁——而这只有在管理人员进出组织的各个团队的协助下才能实现并维护。您还需要知道谁可能由于出于任何合理且经过风险评估的原因而需要进入“例外”列表，以便他们可以从在活动目录中固定的“应用所有”设置中排除，而该设置是作为针对所有用户发布策略设置的一种。


    事实上，作为信息安全经理 (ISM)，您面临的许多任务和挑战都会回到这种困境中——如果没有高质量的信息和向前迈的坚实基础，您无法有效地完成任何事情。


    ### 外包功能


    当您的员工从您的组织移动到伞下的第三方代理机构时，他们真的可以带走他们的电子邮件 `.pst` 文件吗？如果是的话，应该对这些文件进行何种程度的审查，以确保您的组织信息资产不会意外流——特别是当
    `.pst` 所有者将其作为文件存储系统（记录管理存储）时，这在大多数情况下是事实。这只是您可能面临的无数困境之一，并且需要适用于您组织的答案。如果能挥一挥魔术棒，说一个答案适用于所有情况就好了。尽管如此，原则和方法是相同的。请考虑面临风险的资产资产、威胁、可能性、影响（对谁产生）等——并相应应用适当控制措施。


    ### 安全事件


    某个人在家庭地址收到了一封装在棕色封里的 50 张工资单。他们在回到大学之前签过一份短期合同，他们自己的工资单被寄到了家里，但显然他们并没有预料到这一点。


    ### 安全意识主题


    作为一名安全专业人员，这是我非常感兴趣的话题。安全意识对任何组织都是至关重要的。这不仅关乎工具，更关乎人员和文化。员工需要理解风险以及如何保护自己。这是一个持续的过程，而不是一次性的事件。


    ### 安全意识主题


    安全意识安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全意识安全安全安全安全安全意识。目标是培养一种具有安全意识的文化。


    ### 章节总结


    简而言之，你需要“凡事都要省；要守良好的”（约翰一后书 5:21）。


    ### 第 11 章：作者不应该做的


    #### 内部审计是有历史的


    与内部审计的关系往往是紧张的，但在本书的开头，意图是以积极的光线来描绘信息安全。维护内部审计是经验的很大一部分，因为你经常发现，你需要实施的任何更改在很久以前就已经很多次在之前的审计报告中被识别出来了。


    在作为许多经历核心的那个组织案例中，它曾受到过“特别措施”，并充满了政治内斗。这对组织有效高效地运行造成了极大的负面影响。虽然可能觉得这超出了典型的 ISM
    角色的范围，但理解你被迫运营的环境至关重要。这样，尽管周围发生了这一切，你仍然可以继续取得必要的进展。在政治斗争的漩涡中，总有一个“大局”，一个需要考虑和记忆的历史背景。


    `表 7` 中的时间顺序旨在展示，如果你去寻找，你的组织中会有多长的历史——对你所工作的时间线表示理解最有帮助。


    **表 7：组织历史**


    | 日期 | 描述 | 备注 |

    | :--- | :--- | :--- |

    | 1997 年 5 月 | 财务和通用目的小组论文，标题为“信息技术——应急计划和灾难恢复”。 | “…计划在 1997/1998 年期间引入最佳实践注释，以帮助各部门考虑涉及的问题。”目前尚无具体证据。<br><br>遗憾的是，现有的纸质副本在顶部写着“从未发送”。
    |

    | 1997 年 6 月 | 地区审计网络风险评估发送给一位高级经理。当时正在进行一项战略审查——这是公共部门经常面临的问题（14.5 年后，遗憾的是，情况几乎没有发生变化）。
    | 识别出的问题：<• 缺乏定义和测试过的灾难恢复计划。<• 缺乏网络安全、故障和性能管理。<• 缺乏供大家遵循的标准、程序和指南。ICT 审计指出“风险评估的活动是一个关注点”。
    |

    | 1999 年 10 月 | 对计算机系统进行了外部风险管理审查。 | 提到了有关备份、灾难恢复以及对所有新系统实施风险管理案例的问题。 |


