    ### [#12_ch04.xhtml#not_1]

    While the server management issue was experienced in 2009, and was worrying enough
    then, in 2014 the same situation continues to exist, so the lessons are not being
    learned and improvements are not being made. It is depressing to report that there
    is little sign of the IT industry understanding the need for appropriate server
    management as part of ongoing environment health maturity.


    ### Security awareness theme

    This month’s information security theme could pick up on the fact that November
    contains Bonfire Night, very quickly after Halloween. Utilising the ‘Remember,
    remember the fifth of November’ mantra, you can play on that and deliver messages
    around ‘Remember, remember… your removable media devices!’ or ‘Remember, remember…
    to clear your desk before you leave every day!’ Or take it up a notch and go for
    a fireworks-related theme.


    ### Chapter summary

    The lessons learnt above pull together the experiences outlined in the book so
    far and address many of the recurring themes. If information security is not being
    built into the organisation from the ground up, ensuring that it is part of the
    structure, it is a much harder task to make progress so it becomes a constant
    task for the `ISM`. If you are lucky, you have management who will take such lessons
    learnt seriously and be able to support you in providing it.


    The next chapters flesh out the requirements.


    ### CHAPTER 5: DECEMBER - OH, FOR THE SAKE OF ANOTHER


    #### Security improvement programme

    In this particular instance, what was presented to external auditors was not untypical.
    The `SIP` was moving along apace. The gaps spanned all points of people, processes
    and technology.


    The answers (solutions/controls) are simple once explained, i.e. there is no real
    rocket science involved. This is the beauty of real information security laid
    bare for users in a way with which they can resonate. The solutions are simple
    and easy to grasp.


    #### Fax management

    There are still many organisations where facsimile (fax) communications are the
    most reliable medium (and, in some cases, most secure). However, in order to ensure
    a consistent level of safety, fax handling procedures may be required as a mechanism
    for reminding people how to use the medium.


    **Table 5: Faxing – what can go wrong**


    | **Issue description** | **Mitigation** |

    | --- | --- |

    | An individual incorrectly transcribed the number to which a fax was sent, resulting
    in the intended recipient’s sensitive personal data being sent to a personal residence.
    The owner of the residence notified the organisation of the incident and shredded
    the document (thankfully). | Recommended documentation of the disclosure for audit
    purposes. Instructed to ensure staff confirm the fax number before faxing sensitive
    personal data and follow up with a call to the recipient to ensure receipt. Update
    the information security messaging around usage of faxes for all staff. |


