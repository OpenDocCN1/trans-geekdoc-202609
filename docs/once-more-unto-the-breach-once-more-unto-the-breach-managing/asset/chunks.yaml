  raw: '| Citizens || Local citizens who require information and services from the
    organisation. || An increasing number of citizens prefer to use the Internet or
    other media for accessing corporate services or communicating with the organisation.
    This could extend to ISP-type services. |


    | Partners || District/unitary organisations, other public bodies (e.g. health,
    fire) and external service providers/private bodies. || Shared services and enhanced
    communication. |


    **Table 3: Examples of public sector roles**


    | **User group** || **Profile** || **Requirements** |


    | --- | --- | --- |


    | Social workers || Nomadic || Spend most of their time visiting the homes of
    adults/children to deliver social care services. As people-orientated staff, they
    are often non-technical, so flexible working solutions need to be user-friendly
    and tailored to their specific needs. As lone workers in a vulnerable position,
    they need to maintain a high level of contact with support staff and management.
    |


    | School advisers || Nomadic || Spend most of their time visiting schools. They
    also visit their main office and work from home. They have a shared PA who allocates
    their jobs and provides them with a link back to the organisation. In general,
    they have a good understanding of technology. For instance, some school advisers
    use Skype phones on their home PCs to communicate and collaborate with colleagues
    during the evening. Also, as they are promoting the organisation.s technology
    and services to schools, they need to be seen as advanced users themselves. |


    | ICT support staff || Flexible office-based/nomadic || ICT support staff would
    probably be categorised as flexible, office-based users. However, as an increased
    number of organisation staff will be remote from an organisation office, the profile
    and individual needs of ICT staff will also change. ICT staff clearly need the
    greatest levels of access to network-based systems (administrator rights) from
    anywhere on the network, including remote access connectivity (i.e. via the Internet).
    |


    | Managers (selected areas) || Flexible office-based || Managers generally spend
    a significant proportion of time in meetings. These often necessitate them travelling
    to other offices within the same building/campus or different locations. Maintaining
    contact while in transit and during meetings (i.e. for selected contacts) is important.
    Tools to reduce travelling or wasted time, and manage meetings more efficiently/effectively,
    are regarded as very desirable. |


    Note: some office-based and flexible office-based staff may be required (or wish)
    to work from home/elsewhere, so appropriate provisions still need to be made.
    These may or may not extend to full ICT service access. The whole premise is one
    of flexibility in delivery.


    The reason for spending some time on this, and providing resources, is that the
    question of who is captured under what category keeps coming up in meetings and
    discussions. Therefore, your best bet is to make sure that you have a clear remote
    (home/mobile) working policy that addresses this, so that you can keep referring
    to it as the central source of guiding principles to which you will adhere when
    you structure solutions to suit the needs of  these roving users. We will be returning
    to this in *[Chapter 4](#12_ch04.xhtml#ct4)*.


    Consumerisation will make this an even more important task, as you will need to
    have identified, specifically, what type of technology each of these users is
    operating in order to carry out their roles. You also need to clarify whether
    the devices are their own or whether they belong to the organisation, as there
    are clear impacts with regard to protecting the information, keeping the devices
    up to date and operating safely and securely.


    Another aspect to this is that the increasing drive for achieving mobile and remote
    working for employees, to reduce organisational infrastructure overheads, may
    be exposing the organisation to greater risks in maintaining compliance with various
    regulatory, legislative and standards-based requirements. For example, if you
    had a number of payment card industry (PCI) users operating from home on an organisationally
    secured laptop, but taking credit card details over the telephone, potentially
    writing them down, faxing or e-mailing them, would you be happy or not? The reality
    is that there should be a display screen equipment (DSE) related health and safety
    check going on in every home or remote environment where your user may be operating.
    However, it is appreciated that this is a potentially significant undertaking
    and, at present, in most cases there is only lip service being paid to knowledge
    and visibility of the circumstances in which your potentially classified information
    assets are being handled while not within your immediate scope of control.


    User acceptance testing


    User acceptance testing is vital and needs to be built into all change processes.
    Getting the right users at the right time in your programme plan can be a challenge.
    Going back to your *[Chapter 1](#09_ch01.xhtml#ct1)* answer set, you need to know
    what users have access to which systems and try to create some kind of ‘uber’
    set of users – a control group, if you will – that represents the most likely
    and most used combinations of software and applications across the organisation.
    This is so you can call on them to test your newly configured desktop or laptop
    build, if you are rolling out new platforms or upgrading existing ones. Again,
    while this may appear to be a very IT-focused task, all roads so often lead back
    to a perception that any issue is fault of security; as a result it really is
    better to be involved and fully cognisant of what is going on than be the last
    to know. For too long, security has had a bad rap, being seen more as an inhibitor
    than an enabler, and so the more that can be done to improve this perception,
    the better the overall information protection results will be.


    Business as usual


    There are many tasks explicitly described as security related that by now need
    to be appreciated as being part of BAU for ICT (IT). In other words, they are
    not solely in the remit of the ISM or administrator. These include:


    • access control


    • antivirus/malware


    • back-up


    • business continuity


    • disaster recovery


    • incident management


    • patch management


    • vulnerability assessments


    These need to be explained to your IT team, so that there is an understanding
    of ownership and responsibility for tasks. (I am assuming you do not necessarily
    have the luxury of many teams of people who will be addressing each element individually.
    It is very much appreciated that, in all likelihood, there are fewer people doing
    more tasks these days)


    In brief, for each area:


    • Access control – IT needs to manage the process of setting up new users, deleting
    old ones or changing role profiles.


    • Antivirus/malware – IT needs to ensure that there are up-to-date signatures
    and fully managed and licensed products on all nodes of the network – servers,
    desktops, laptops, etc.


    • Back-up – IT needs to ensure that back-ups are taking place and that restores
    are tested on a regular basis.


    • Business continuity – IT needs to ensure that it has a plan itself, just as
    every other organisational department needs to have a plan.


    • Disaster recovery (DR) – IT needs to make sure that it has fully engaged all
    sections or departments of the organisation in the exercise of carrying out business
    impact analysis on the systems, so that there is clarity of expectations with
    regard to incident management.


    • Incident management – IT is a great starting point for capturing incidents that
    are occurring across the infrastructure and the users. The ISM should work closely
    with IT staff to identify and categorise incidents  in order to investigate them
    and learn lessons for improvement.'
