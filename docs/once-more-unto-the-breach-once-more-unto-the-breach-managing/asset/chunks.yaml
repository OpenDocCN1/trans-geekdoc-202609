    信息治理（IG）的核心在于理解从 IT 安全、信息安全到信息保证（IA）的演变过程——所有这些阶段都是为了成熟到一种境界，即能够对信息管理过程中的安全措施、流程和实践表现出合理的信心。虽然近年来信息保证被视为从信息安全中演进而来的增长领域，但最终目标必须是在所有组织中嵌入完整的
    IG 框架，以完全涵盖当今网络主导环境中需要管理、处理和保护的所有相关法律、法规、标准、政策、程序、技术和人员问题。


    请考虑一下信息治理的“11 个 C”。


    ### 信息治理的 11 个 C


    1. 中心化 (centralisation)

    2. 沟通 (communication)

    3. (法律)合规性 (compliance)

    4. 信心 (confidence)

    5. 机密性（完整性、可用性）（confidentiality）

    6. 符合性 (conformance)

    7. 一致性 (consistency)

    8. 内容 (content)

    9. 连续性 (continuity)

    10. (安全)控制 (controls)

    11. 企业记录管理 (corporate records management)


    （现在来点完全不同的内容……！对于那些灵性倾向的人来说，数字 11 似乎具有直觉、耐心、诚实、敏感和灵性的特质，并且是理想主义的。人们向具有这些“11”特质的人寻求教学和启发，并通常从这种经历中受益。这些事选择并非偶然，也不是随机！）


    作为信息安全经理（ISM），你的目标应该是对 IG 以及良好的信息管理和处理原则、赋能技术和当前最佳实践寻求更深入的理解，同时对你将遇到的所有问题的核心信息的多个方面获得广泛的认知。


    至少，随着时间的推移，你可以考虑完善知识体系，以确保对所有这些领域都有广泛的理解：


    • IA 及其他领域的原则

    • 信息安全的标准与最佳实践管理 (BP)

    • 软件保证 (SA)

    • 数据保护与隐私 (DP)

    • 记录管理 (RM)

    • 业务连续性/灾难恢复/韧性 (BC)


    #### 表 6：所需的知识领域


    | 信息保证原则及其他 (IA) | 数据保护与隐私 (DP) |

    | --- | --- |

    | • 信息治理概览<br>• 信息治理框架<br>• 信息保证 – 历史——我们是如何走到这里的？<br>• 相关信息类法律概述<br>• 数据处理审查和其他政府主导的倡议<br>•
    信息保证成熟度模型 (IAMM)<br>• 文化、伦理与职业精神<br>• 内部和外部审计 | • 数据保护原则<br>• 维护公众信任并尊重个人隐私<br>•
    信息共享/数据传输 – 收益与限制<br>• 隐私影响评估<br>• 获取同意、直接营销<br>• 管理 Cookie<br>• 数据质量管理<br>• 数据泄露管理——与安全事件管理的关联<br>•
    职场数据保护<br>• 系统测试中个人数据的使用<br>• 刑事犯罪和 ICO 的罚款权<br>• 处理主体访问请求 (SARs)<br>• 约束性企业规则<br>•
    PIMS 和 BS10012 |


    | 信息安全的标准与最佳实践管理 (BP) | 记录管理 (RM) |

    | --- | --- |

    | • 信息风险管理 (IRM)<br>• 风险偏好与风险文化<br>• 治理、风险与合规 (GRC)<br>• ISO27001 和 ISMS<br>•
    支付行业数据安全标准 (PCI DSS)<br>• COBIT, COSO, ITIL | • 记录管理计划 (RMP)<br>• 记录与信息管理 (RIM)<br>•
    标准 (ISO15489) 与合规<br>• 关键和历史记录<br>• 归档、销毁、保留计划<br>• 并购中的记录处理<br>• 系统退役中的 RM 要求<br>•
    RM 与灾难恢复和备份的关联<br>• RM 与电子邮件管理及存档的关联<br>• RM 与文件计划和目录结构的关联 |


    | 软件保证 (SA) | 业务连续性/灾难恢复/韧性 (BC) |

    | --- | --- |

    | • 网络如何适配<br>• 威胁与漏洞分析<br>• 安全控制（访问控制模型和机制）<br>• 可用安全<br>• 设计安全<br>• 防火墙和数据加密<br>•
    隐私增强技术<br>• 深度防御<br>• 密码学<br>• 身份管理<br>• 安全设计中的人为因素 | • 将信息安全包含在业务连续性管理过程中<br>•
    业务连续性与风险评估<br>• 业务连续性计划框架，BS25999<br>• 业务影响分析<br>• 测试、维护和重新评估业务连续性计划<br>• 选择、开发和实施灾难恢复计划<br>•
    嵌入韧性策略<br>• 在规划中应对反恐 |


    ### 本月其他安全任务


    ##### 处理用户需求

    我们需要在 PC 镜像中撤销 `CD auto-enable` 以满足政府规定的安全要求。然而，过段时间后，ICT 收到请求，要求重新开启自动运行功能，因为用户发现这太不方便。


    ##### 处理旧设备

    在几个月里，我们看到在协助可能被认为是设施管理方面有各种需求。你之所以在“干涉”的原因是为了确保你确实对设备的生命终点提供了正确的关注和照顾。那么，当一个用户带着一大箱磁盘走来时，我们该如何处理它们？用户说这些可以丢弃，但我们如何知道里面有什么，以便证明销毁它们的决定是合理的？审查所有磁盘将是一项艰巨的任务。每天都充满了这种需要解决的难题。也许可以对内容进行随机抽样——如果磁盘仍然可被读取的话——然后应用判断标准，确定全部信息是否已超过其保留期。尽可能地与
    `RM` 团队对接，以便他们对记录此类信息的 `RM` 系统进行适当修订。只要你对所采取的行动有证据，并对方法有合理的理由，日后有人质疑，你也会容易解释。


    ##### 持续的杀毒软件管理

    当你的组织发生严重的病毒（恶意软件）爆发时，这可能是 ISM 的一个决定性时刻。团队仍在试图控制 Conficker 攻击，由于之前对服务器缺乏管理（正如渗透测试结果所强调的），攻击已传播得更远。当在某服务器上发现暴力破解攻击时，最终意识到损害的程度。该服务器被立即从网络中隔离，但需要打补丁，这引发了一些非常棘手的问题：

    • 为什么没有打补丁；

    • 哪些在管理循环之外；

    • 决定对这些服务器进行补丁和更新需要多久。这种演示展示了暴露是多么容易且快速，以及如果媒体获取新闻后公众认知可能会如何演变，表明了补丁流程是多么不完善。


    #### 安全指标


