    ## 风险管理与 ISMS 实施


    - **风险分析** – 根据安全漏洞数据库计算安全事件发生的可能性。这一步骤需要考虑已经实施的用于降低风险的技术控制措施，以及任何其他可用的补充控制措施。

    - **风险管理** – 一旦识别出风险，将根据其影响程度和业务对风险的承受能力对风险进行排序。

    - **ISMS 实施** – 这是一项稳健的管理框架实施，包括对人员、文化、技术、业务和外部因素的考量，并需要指标、衡量和持续改进。


    ## 实施过程中的挑战


    遗憾的是，我们在实施方面最终经历的问题是缺乏一致性，因为每个部门、行业和组织似乎都是根据其特定的业务需求来实施安全，并创建了适用于自己的不同安全定义。


    如前所述，`IA` 必须贯穿系统的整个生命周期；威胁随着政治或业务环境的变化而改变；漏洞随着系统配置的变化和新缺陷的发现而出现或消失；随着对系统依赖性的增加，系统故障的影响也会发生变化。这正是
    `CESG`（英国政府通信电子安全小组，正式名称为 `CESG`）通过各种认证计划等发挥作用的地方（英国 `CESG`，认证）。


    安全通常被视为一个事件而非一个过程，被视为及时的补救而非贯穿系统生命周期每个阶段的线索。在系统的初始规划、设计和开发期间，安全往往不被考虑。在开发后尝试将安全补入系统，通常比从一开始就纳入安全要昂得多，且效果也较差。同样，系统在获得特定条件下的认证并批准运行后，安全并没有结束。在系统的整个运行和维护阶段，必须验证系统对认证条款的遵守情况。即使在系统生命周期结束后，安全策略和程序也必须指导系统的安全销毁和处置。（[Boyce
    and Jennings, 2002], p.170）


    ## 信息保证 (IA) 的演变


    可以证明，在英国，`IA` 扩展到包括数据保护和隐私（因为密切的机密性联系以及经济合作与发展组织 `OECD` 的指导要求）、信息管理与质量、记录管理等。然而，在充分理解风险之前，无法部署保证职能（[Schou
    and Shoemaker, 2007], p.13）。`OECD` 指南明确指出，“信息系统的使用及其安全性应尊重他人的合法权利和利益，并应与民主社会中数据和信息的合法使用和流动相兼容”。这一要求没有减少，反而过去的过去的十年里变得越来越重要。


    在 20 世纪 90 年代后期，`IA` 术语只有少数安全专家知道，通常被认为是“偏执的”或“刻板的”。今天，`IA` 对于参与公共部门项目和合同的更广泛受众为人知，从高级高管到许多学科的工程师。许多人已通过阅读论文和参加简报来寻求有关
    `IA` 流程的信息。然而，即使在 21 世纪 20 年代后期，现状似乎仍然相似，只有少数专业真正理解其含义的广度以及可以从中汲取经验、理解和智慧的材料规模（[Hutton,
    2008]）。


    ## GRC 与国际标准


    今天，你可以从“信息安全”、“信息风险”、“信息风险管理”、“信息保护”或“信息保证”中进行选择，还可以选择以美国为中心的、全涵盖的伞术“治理、风险与合规
    (GRC)”(Tone at the Top, 2010)。`GRC` 本身可能有多达 22 种不同的定义（[Marks, 2011]），尽管最受青的是开放合规与伦理小组
    (`OCEG`, 2011）提供的定义。从根本上说，`GRC` 与技术无关，而是关于业务流程以及将其做得更好。它是一个透镜，组织可以通过它理解自己的业务，并理解为什么这些元素需要协调工作（风险管理与战略），从而解决碎片化的流程，消除孤岛并进行跨组织的工作。风险管理的国际标准
    `ISO31000` 提供了一个定义，并在这种范围内具有价值（[British Standards Institution, 2009]）。


    目标是将信息安全转化为一个多学科领域，在该领域中，技术人员与“软性问题”专家密切合作，例如公共政策、经济学和社会学领域的专家（[Shostack and Stewart,
    2008], p.103）。`ISACA` 在其信息安全业务模型中（见 `[Figure 7]`）很好地捕捉了这一概念，寻求对一个“从系统角度检查安全问题的整体业务模型提供深入解释”（[ISACA,
    2009]）。


    即使你不喜欢“信息保证”这个术语，它也有很长的历史，显然没有足够的人意识到这一点；因此本节试图将这些碎片整合在一起。从广泛的出版物可以看出，`IA` 经常被用作安全的同义词（[Boyce
    and Jennings, 2002]）。虽然“只要英语仍然是一种活的语言，在信息安全内部创建严格定义的词汇的尝试可能注定会失败”（[Shostack and
    Stewart, 2008]），但意识到实际问题源于定义是很重要的。安全在历史上可能是一个 IT 问题，但保证将门槛提高到了更层次的组织问题，考虑到将信息视为资产的重要性以及保护声誉和个人隐私的需求，这显然显示了该要求的广度。


    ![](img/P172_01.jpg)


    图 7：`ISACA BMIS` – 信息安全业务模型


    The Business Model for Information Security, ©2010, `ISACA`。® 保留所有权利。经许可使用。


    ## 从 IA 到 IG


    将 `IA` 和 `InfoSec` 放在一起，你实际上得到了“信息治理” (`IG` 或 `InfoGov`)。`InfoGov` 是通过实施的多学科结构、策略、程序、流程和控制措施，以此方式管理所有媒介的信息，以支持组织当前和未来的监管、法律、风险、环境和运营需求。这包括以任何形式的信息（信息系统、纸质、其他记录）。它由一个管理过程支撑，该过程跨组织的方法管理信息资产。它涵盖了信息管理，包括信息安全管理、信息和记录管理、数据保护、隐私（因为密切的机密性联系和
    `OECD` 指南要求）以及物理保护。它包含了公司治理、风险管理和业务连续性的方面，并在面对变化的威胁、漏洞和依赖性时，必须在组织的整个生命周期内维持。


