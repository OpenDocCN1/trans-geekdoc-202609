- fmt: '

    Laptop users still have a tendency to save a great deal of information to the
    hard drive of the machine and this can only be justified if the machine itself
    is being encrypted at boot-up. In the UK, this is particularly important, given
    the strong focus of the Information Commissioner’s Office on this area. It (full
    disk encryption) is also an expectation that is spreading more globally, too,
    given the scale of data breaches and information losses being experienced and
    their impact throughout the last few years.


    New laptops are being produced all the time and some of the latest models are
    designed without CD/DVD drives. You need to consider this if you are buying in
    bulk and ensure that you order the right style of equipment to serve the needs
    of your users. This means their work needs, not their personal use needs, given
    that, of course, they should not be using the equipment for personal use, wherever
    possible. Certain functions in your organisation may require a CD read/write facility
    and you need to be able to keep track of the information being written, as the
    assumption is that it will be either shared or stored. In both cases, this needs
    to be done securely. So you need to establish whether you can enforce any kind
    of encryption on the transport and/or transfer of that data, and maintain some
    kind of register of CDs/DVDs burnt and shared, particularly if you are expecting
    them to be returned to the organisation. These kinds of things really arise when
    the policy or procedure that you have written requiring this kind of action comes
    into contact with the real world; it can be hard to maintain such a policy so
    you need to be flexible enough to review, revisit and ultimately rewrite it to
    meet the needs of both the users’ group and the organisation. As ever, as long
    as you are providing the best level of protection for the sensitivity of the information
    assets concerned, you won’t go far wrong.


    ## Security awareness theme


    This month’s information security theme should definitely pick up on Christmas
    – focusing on the aspect of gift-giving so as not to cause any religious offence.
    Picking up on the well-used phrase ‘A dog is for life, not just for Christmas’
    you could pick any element of best-practice information security and the same
    would apply. ‘Back-up is for life, not just for Christmas’ perhaps?


    ## Chapter summary


    This chapter has focused on the physical security issues that can cause you difficulties
    across your organisation and hopefully teased out some elements that you may not
    have previously considered. If you change your viewpoint, you can get an even
    better view of your organisation – and that will really help you to think further
    outside of the box!


    There is a real need to have a particular mind-set if you are going to be a successful
    ISM, and it seems to be something you need to have innately, rather than something
    that can be taught… although reading books is a good place to start to build a
    better arsenal of capabilities for yourself!


    This mind-set is difficult to teach, and may be something you’re born with or
    not. But in order to train people possessing the mind-set, they need to search
    for and find security vulnerabilities – again and again and again. And this is
    true regardless of the domain. ([Schneier, 2008](#23_app3.xhtml#ref16), p.260)


    Being a security engineer gives you a certain skillset, as does being a security
    architect. Perhaps even being a ‘bouncer’ (a physical security person) would help.
    You need to be able to think ‘like an attacker’, be it a technological one or
    a physical one. In property law, the terms ingress, egress and regress are used
    to denote the rights of an individual to enter, leave and return to a property,
    respectively. These terms are also used in the IT world with regard to system
    access. You need to consider what points of egress and ingress, in particular,
    could be compromised (and in what way), so that you can be prepared with some
    solutions. Wherever possible, apply proactive, rather than reactive, security
    safeguards.


    In becoming an ISM, you may not have started out through any kind of standard
    route, but if you are of a more open and flexible mind-set you are likely to flourish.
    Your responses need to be relatively ‘fleet of foot’ in order to address the multitude
    of different challenges that may meet you on any given day - ranging from the
    sublime to the ridiculous, but most often based on people and process, not on
    technology.


    ## CHAPTER 6: JANUARY - A BATTLE WON


    ### Baking security in


    So why do you need to keep on explaining what your ICT colleagues ought to be
    doing to support BAU functions? Constantly having to explain to internal ICT management
    what ICT colleagues should be doing normally is a long battle - never mind that
    you also have to add other extra duties for an initial period while you go through
    a transition to a new infrastructure or new platform.


    Any large infrastructure-based project can have the unsettling ability to highlight
    missing work that should have been being done as part of BAU. Therefore, the difficulty
    is that somehow this work needs to be done post-haste – both to catch up for the
    time during which it has not been done, and also to attempt to provide you with
    some relatively up-to-date data with which to work, in order to move forward in
    a sensible manner.


    Once a project receives its initial injection of support from management and team
    delivery of tasks gets it to the first milestone, there is usually an immediate
    slip back to the day job, and you find your resources are significantly depleted
    and you are once again starting from ground zero. Trying to keep your changes
    in place can be like running in a hamster wheel–ridiculous, given that the work
    should already be part of BAU and of best practice in information security management,
    if security had been baked into the organisation properly, in a meaningful way.


    ### Desktop refresh versus consumerisation


    When doing a desktop refresh, there will always be issues of prioritisation, pecking
    order and contingency requirements to be juggled. There is no doubt that the increasing
    march of consumerisation (bring your own device) is changing the landscape of
    any ICT department-based strategy for infrastructure refresh. But given the age,
    budget and maintenance cost of some existing organisational portfolios, there
    are likely to be those still with this pain to go through.


    Considerations must include the age of the desktops (machines, PCs, call them
    what you will); those with a certain type of monitor (and costing the replacement
    monitors into your plans is an important element of the overall cost of the budget
    portion); knowing which ones need CD/DVD writing facilities; knowing which ones
    may be for front-line services and which ones for back office; which ones require
    payment functionality and which ones will be in shared areas. Who needs SD cards?
    There are those for whom photography is an important part of their job function
    and, therefore, this may be a requirement.


    Will switch and router cabinets require replacing, too? If so, in what order do
    things need to be planned out? There is a contingent disruption factor to users
    when this kind of infrastructure upgrade work is going on, which requires appropriate
    communication planning in advance, so that preparations can be made. With the
    volume of laptops available to users, homeworking arrangements can be put in place
    to help alleviate any perceived downtime or lack of connectivity expected to corporate
    systems.


    ### Incident reporting


    By now, more and more people should be aware of what you are doing in your organisation.
    Therefore, you actually start to hear more and more war stories, skeletons appear
    from closets, and long-standing gripes and issues start to get aired. While you
    may be used as the whipping person for things that may never be resolved, you
    need to allow an open-door policy to exist wherever possible, as within the silt
    may be some gold.

