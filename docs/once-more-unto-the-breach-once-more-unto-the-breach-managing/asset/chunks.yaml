    - **E-mail marking** – technology was implemented for the e-mail system to allow
    users to select from a drop-down menu the appropriate marking for the classification
    of information being sent at a particular instance.

    - **PC replacement** – to continue the work being done on the desktop refresh
    programme, a dedicated team was afforded the time to reallocate equipment and
    ensure that the disposals element was appropriately handled.

    - **Patch and vulnerability management** – a team was required to address the
    results of the recent penetration testing report and the various patching and
    server update processes that needed to be done as a matter of urgency.

    - **E-mail archiving** – a solution was implemented to provide quick and searchable
    e-mail functionality, and retention capabilities that integrated with the existing
    e-mail system.

    - **Server farm upgrade** – the server infrastructure was upgraded across all
    of ICT to ensure that the whole server farm met the minimum expected housekeeping
    levels of ICT operation and information security best practice, in terms of vulnerability
    assessment and patch management.


    As the ISM, you may have no day-to-day authority over the time allocation of resources
    provided to you on project tasks, and this can be very destabilising in terms
    of project progress. Of course, the reality, in these straitened financial times,
    is that it’s the same people on each of the project teams. Therefore, setting
    up sub-projects actually increases their workload as they now have to do even
    more reporting and upward management, in addition to attending even more meetings.
    This is very wasteful of time, energy and resources.


    Sadly, people never seem to pay attention to the blindingly obvious. So your task
    has to be to keep highlighting to management that for as long as resources are
    not afforded appropriate time, the overall project will slip further and further
    backwards, and they will ultimately pay the price for a lack of compliance with
    a required external mandate or a lack of connectivity to a particular infrastructure.
    This would impact a significant number of users, way beyond the immediate management
    team considerations.


    ## Remember the big picture


    Every now and then, you need to take a step back and remind yourself, and everyone
    else, what it is that you are trying to achieve. Your programme of change is ultimately
    seeking to influence the review of information flow and business process re-engineering;
    you have to ensure that any processes undertaken are appropriate, adequate, safe
    and secure, given the nature of the information assets at risk. This is fundamentally
    about ensuring your organisation is in compliance with relevant legislation. For
    example, particularly in the UK, information processing in all its forms must
    not breach the Data Protection Act, which is from a European Data Protection Directive.
    Therefore, similar principles apply to all organisations processing information
    across Europe.


    Most endeavours in this area have always been about more than just technology,
    in spite of their uptake usually being served by the implementation of new tools.
    It is part and parcel of the information governance agenda, which embraces any
    legislation, regulation and standard that relates to information as an asset and
    that requires risk assessment, impact analysis and proper management (we will
    return to describing the breadth of information governance itself in the next
    chapter). This, therefore, needs to be owned at a senior level in the organisation
    and supported with appropriate resources. Otherwise, ICT continues to be perceived
    as the natural lead, which results in projects being afforded a technical focus
    rather than an operational one, and users who are left feeling that things are
    being done *to* them rather than *with* them.


    It is certainly true that technological solutions can be used to make the policing
    and implementation of information security easier, but to ensure the protection
    of data and information there will always be implications for how we do business.
    Continuing to deliver on your programme of activity requires changes to policies
    as well as technology. For example:


    - More stringent security checks are required for staff employed by the organisation
    and these need to be embedded into your personnel-related policies.

    - An enhancement to asset management security is usually required, to ensure that
    all assets are identified across hardware, software and information.

    - A meaningful clear-desk policy needs to be in place and adhered to and the acceptable
    use of ICT services and systems needs to be defined more clearly.

    - Information ownership should be established by appointing information asset
    owners for all systems containing personally identifiable information, in order
    that such information can be appropriately managed and secured. This should be
    embedded as a management responsibility.

    - Provide all users with some level of information security awareness delivery.
    This is best achieved through the roll-out of briefings on as many occasions as
    possible.

    - Refresh ICT business continuity arrangements to reflect the updated policies
    once they define those security requirements.


    ## Breadth of technological change


    As mentioned previously, many of the issues addressed by information governance-related
    programmes of change concern personnel and procedures, but there are obviously
    technical matters, too. A lot of these have already been covered in previous chapters,
    but others are identified below:


    - Moving users’ data to a secure storage area network (`SAN`) – in our scenario
    it resulted in data being unavailable to those who were not in the same secure
    segment of the network.

    - Upgrading firewalls, antivirus technology, anti-spam software, routers, switches,
    cabling, servers, etc. – while this was done for the segmented network, a great
    deal of work was still required in order to bring the rest of the network up to
    the expected minimum baseline security standards, as demanded by most external
    connectivity, regulatory and legislative arrangements.

    - Implementing two-factor authentication (`2FA`) – done in order to address a
    requirement to identify users reliably. The first factor, ‘something you know’,
    is the familiar system password (and as previously described this was upgraded
    to a mandated minimum eight-character standard), but setting up the second, ‘something
    you have’, takes real effort.

    - Gathering, storing and presenting security event data is another important part
    of some external requirements and agreements. This means keeping control over
    all the security-relevant log data generated by various systems and devices on
    the network, and putting it into secure storage for future analysis and reporting.
    Again, there can be a lot of server work to be done in order to identify, upgrade
    and maintain this accordingly.

    - Implementing a secure network – sadly, not all networks are historically created
    equal. Most have been created in a segmented manner, cascading across geographical
    boundaries as organisations grow and system and transactional requirements develop.
    Achieving the transformation programme requirements for relocating staff and systems
    can be hampered by old infrastructure, as users may be straddled between secure
    and insecure platforms, with data housed on different servers in different locations.
    Adopting a ‘one organisation network’ usually enables wider transformation and
    secure information sharing, thus helping the realisation of corporate aims and
    objectives around information sharing, particularly if you are working in a public
    sector environment.

