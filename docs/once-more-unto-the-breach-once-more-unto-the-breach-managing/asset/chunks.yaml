    | 日期 | 事件 | 描述 |

    | :--- | :--- | :--- |

    | 2000 年 6 月 | 收到合格外部审计函，确认了根据 `BS7799:1999` 进行组织的评估费用。 | 显然，该组织一直在考虑针对当时的信息安全管理体系标准（`BS7799`——现为国际标准
    `ISO27001`）进行认证。 |

    | 2002 年 11 月 | `BS7799`注册项目。 | 两年年后，创建了一份 `BS7799` 项目启动文档 (`PID`)。但在其期间，该项目似乎没有任何实质性进展。
    |

    | 2002 年 11 月 | 政策与原则手册包含信息安全。 | 第二版，基于 `BS7799-2:2002` 并完全遵循了其结构——但并未实施。 |

    | 2002 年 11 月 | 详细的应用风险分析。 | 准备了流程和模板——但未完成、嵌入或共享。 |

    | 2002 年 11 月 | 居家办公详细风险分析 `v1`。 | 文档已完成，但没有证据表明后续得到了跟进。 |

    | 2003 年 | 审查了外部信息安全课程供应。 | 可能是为了将其嵌入并使在 ICT 及其他部门可用——其中包含了关于信息分类的讨论/教育。 |

    | 2003 年 6 月 | 数据风险分析 `v1`。 | `ISM` 风险管理流程的所有者——但尚未被使用、完成，显然也没有被共享。 |

    | 2003 年 6 月 | 详细的 `BS7799` 行动计划。 | 文档不完整。如果所有这些都得到跟进并完成，整个信息安全改进计划和合规工作将是轻而易举——将提供即时响应，且
    `BS7799` 认证将足以通过外部审计要求的证据。 |

    | 2003 年 6 月 | 信息安全行动计划。 | 涵盖了所有预期方面，包括 `InfoSec` 策略和基础设施，但遗憾的是，人员和 `InfoSec`
    意识表是空白的，没有任何任务。内容严重依赖外部咨询服务提供的资源来协助完成任务。因此，有证据表明当时投入了精力和财力。 |

    | 2003 年 7 月 | 完成了资产清单和风险评估。 | 对 IT 资产清单进行了全面的风险分析——利用了外部咨询支持。 |

    | 2003 年 8 月 | 引入了企业级业务连续性计划计划。 | 提供了外部支持，与 ICT 部门共同研讨以开发适当的服务级别 `BCP`。准备了 `BCP`
    指南（日期为 2003 年 6 月）。 |

    | 2005 年 2 月 | 收到英国政府技术权威提供者的信息保证 `CD`。 | 这是扩展提供给中央政府建议的工作的一部分，以惠及更广泛的公共部门。该资源对该组织来说本应是无价之宝，因为它包含了政策文件和最佳实践指南
    (`GPGs`)，如果利用并实施，将为跨信息资产提供提供适当的安全控制框架。 |

    | 2005 年 10 月 | 收到英国政府技术权威提供者的第二版《面向更广泛公共部门的信息保证指南》`CD`。 | 该 `CD` 包含 `IS2`——一个提供信息系统风险管理和认证策略及指导的工具。再次，提供此资源的目的是为了确保组织意识到安全和连接性要求及预期。
    |

    | 2007 年 2 月 | `ISO27001` 审计报告（内部）。 | 在 2006 年 12 月进行了一次审计，反映出在 2004 年需要取得重大进展，因此之前的审计被放弃了。所以
    2003 年开始的工作显然没有任何成效，遗憾的是，实际上此后没有取得任何进展。读到审计报告称进展和实现标准的可能性“适中”，这令人失望，而当时并没有一份最新的标准副本。
    |

    | 2008 年 4 月 | 来自第三方网络提供商发给首席执行官的信。 | 这封信是所有相关合作伙伴发出的，要求首席执行官他们早期采用安全网络。 |

    | 2008 年 4 月 | 安全网络提供商的信。 | 安全网络被描述为一项针对 ICT 的计划。 |

    | 2008 年 6 月 | ICT 安全审计——行动计划。 | 高级经理明确了安全职责，通过工作描述——目标日期为 2008 年 12 月。然而，由于对用户的潜在干扰以及可能产生的工作量，这被拒绝了。
    |

    | 2008 年 7 月 | 来自安全网络发给所有信息风险所有者的另一封信。 | 这封信通知组织对数据访问策略的重要修订。在缺乏关键人员的情况下，这种沟通没有得到妥善处理，因为没有人知道如何处理。
    |

    | 2008 年 7 月 | 来自外部联盟及其政府赞助者的沟通。 | 政府向该组织提出了直接请求，要求其为连接安全网络下单。 |

    | 2008 年 8 月 | 来自第三方联盟发给所有信息风险所有者的信。 | 这封信提供了选择早期连接安全网络的豁免流程详情。遗憾的是，公共部门很少是早期采用者，尽管情况显而易见。现实通常是等待得越久，实施成本越高，因为技术和安全在期间已经落后了。
    |

    | 2008 年 9 月 | 高级执行管理决策会议。 | 议程项目——高级 经理向服务代表介绍了安全网络以及获得连接所需的事项。 |

    | 2008 年 9 月 | 提交了业务案例。 | `BC` 概述了要求。 |

    | 2008 年 9 月 | 组织高级信息风险所有者发给政府的信。 | 请求在 `2009/9/30` 之前豁免数据访问政策。这留下了两周时间向政府提交“连接代码”回复，解释组织正在做哪些工作来满足要求。
    |

    | 2008 年 10 月 | 第三方联盟发给高级信息风险所有者的信。 | 豁免请求获得了批准。 |

    | 2008 年 11 月 | 政府部门发给当地部门部门的信。 | 这是一关于在运营处理转到安全连接期间预期的“谅解备忘录”。 |

    | 2008 年 12 月 | 第三方联盟发给所有信息风险所有者的信。 | 告之文件传输安排，但实际上这些安排并不完全安全。 |


