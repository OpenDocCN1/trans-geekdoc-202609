    In 1991, John McCumber presented a pedagogic framework at the National Computer
    Security Conference on this subject and highlighted the constituent parts of InfoSec,
    including the need for a ‘common language/terminology in order to communicate
    effectively’. The model embraced the need to embed the people, process and technology
    triad as an overlay on the three main goals of security (achieving the CIA of
    the information you are seeking to protect). McCumber articulated these as “Education,
    Training and Awareness (people); Policy and Practices (process) and Technology”.
    ([McCumber, 1991](#23_app3.xhtml#ref11) and [2004](#23_app3.xhtml#ref12)). The
    original model, presented by McCumber, for InfoSec, is shown in [Figure 6](#17_ch09.xhtml#fg6).


    ![](Images/P164_01.jpg)


    Figure 6: Model of three main security goals (source: [McCumber, 1991](#23_app3.xhtml#ref12))


    So, InfoSec was very much about the integration of personnel security, computer
    security, communications security and operational security into an identifiable
    profession. InfoSec “in any language, in any culture, in any country” is relative
    to the protection of those information systems. ([Kovacich, 1998](#23_app3.xhtml#ref8))


    A decade after McCumber’s InfoSec model was described, there was an update in
    the form of a seminal paper that articulated the definition and direction of IA
    for the coming years. Maconachy, working at the US National Security Agency at
    the time, saw IA as embracing the triad of information security; but he believed
    it needed to be articulated in terms of four dimensions ([Maconachy *et al*, 2001](#23_app3.xhtml#ref9)):


    - Information states – can be aligned with protective marking classifications
    and types in the UK.

    - Security services – these are the five pillars.

    - Security countermeasures – we refer to these as controls or safeguards in the
    UK, embracing people, process and technology aspects.

    - Time – this aligns with the security development life cycle as our information
    is in constant flux dependent upon time.


    Information assurance should be viewed as “both multidisciplinary and multidimensional”.
    The dimensions are represented as information states, security countermeasures
    and security services – and these are all understood to be affected by time. Information
    can have a greater sensitivity, depending on when it is produced or released.
    Information assurance is both art and science, so it needs to be tackled through
    multidisciplinary efforts ([Petersen *et al*, 2004](#23_app3.xhtml#ref15)).


    The information states can also be overlaid with the following approach: creating
    information profiles that correspond to levels of protection required for information
    (UK CESG, Protection Profiles), which in turn correspond with the likely countermeasures
    to be implemented in the solution space:


    - (being) aware (medium)

    - deter (medium-high)

    - detect and resist (high)

    - defend (very high)


    In 2002, Debra Herrmann proposed a broader definition of IA as an engineering
    discipline that cuts across the safety domain, and some 10 years on we are finally
    seeing some real traction in this safety space.


    Herrmann contended that a “safe, reliable and secure system by definition has
    proactively built-in error/fault/failure (whether accidental or intentional) prevention,
    detection, containment, and recovery mechanisms” ([Herrmann, 2002](#23_app3.xhtml#ref4),
    p.9). Herrmann saw IA as a three-dimensional challenge, encompassing “safety,
    reliability and security”. This book should be mandatory reading for all IA professionals
    across the UK!


    The most fulsome and concise definition of IA can be found in a US Air Force instruction
    bulletin ([US Department of the Air Force, 2001](#23_app3.xhtml#ref22)) which
    describes IA in terms of information operations (military language) and includes
    reference to the need to also be able to restore systems and how to do so. This
    means you need to be able to protect, detect and react to situations:


    ```

    Information operations that protect and defend information and information systems
    by ensuring their availability, integrity, authentication, confidentiality, and
    non-repudiation. This includes providing for restoration of information systems
    by incorporating protection, detection, and reaction capabilities.

    ```

    ([US Department of the Air Force, 2001](#23_app3.xhtml#ref22))


    Most other US Department of Defense publications also refer to the same definition
    (NIST, CNSS, CNSSI, etc.).


    Separating out what the term ‘information’ refers to is key to understanding IA.
    For example, the function and responsibility of an organisation’s security personnel
    are to protect corporate assets. Information systems and the information that
    they store, process and transmit are some of the most valuable assets. Information
    assurance includes those actions that protect and defend information and information
    systems.


    Information assurance should be seen as both a business enabler and a business
    protector, ensuring that users of information systems are not unwittingly exposing
    themselves to unacceptable risk. This has also been expressed as IA representing
    a migration from a preventative approach to an enabling approach ([McFadzean,
    2005](#23_app3.xhtml#ref13)).


    A combination of this thinking was then brought from the US to the UK by the independent
    partnership organisation – the Information Assurance Advisory Council (IAAC) –
    who described IA as follows:


    ```

    Information Assurance is the certainty that the information within an organisation
    is reliable, secure and private. IA encompasses both the accuracy of the information
    and its protection, and includes disciplines such as information security management,
    risk management and business continuity management.

    ```

    ([IAAC, 2003](#23_app3.xhtml#ref6))


    Information is fundamental to the business of government. Effective IA is at the
    core of ensuring that this asset is safeguarded appropriately. The continued growth
    throughout government of the use of ICT systems, all linked together, carries
    with it increased vulnerability. In addition, these ICT systems are under threat
    of attack from foreign intelligence services, criminal gangs, and even individuals
    inside the organisation.


    Information security in itself requires controls to be implemented, the best of
    which are preventive (in the most obvious sense of preventing any breach of security
    from taking place in the first instance). These are elements which form the basic
    components of security architecture, for example, firewalls, user access control
    mechanisms, encryption of data and communications, digital signatures and data
    back-up systems, and detective controls, such as IDSs or security monitoring platforms.
    The various technical controls are usually complemented by a framework of security
    policies, procedures and guidelines aimed at controlling the actions of the users
    to whom the framework applies.


    This was at a time when the discourse of the period was beginning to change, as
    departmental IT went through the push and pull of decentralisation and the struggle
    to manage information assets really began, as Wylder pointed out ([Wylder, 2004](#23_app3.xhtml#ref23),
    p.21).


    Wylder’s writing is some of the most comprehensive at the time, with regard to
    the breadth and depth of information security and what a professional should be
    doing in terms of their role.


    There are a number of basic steps that are found sequentially in most information
    security standards (ISO27001, ISACA BMIS, etc.), which build towards the identification
    and implementation of an ISMS ([Dimitriadis, 2011](#23_app3.xhtml#ref3)). These
    are:


    - Business impact analysis – looking at the impact on the business following the
    appearance of a threat, usually in terms of the monetary, reputation or legal
    impact.

