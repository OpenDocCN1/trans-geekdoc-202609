    • how this can be communicated, and to whom.


    As the ISM, you have a significant part to play in ensuring that the mechanisms
    are in place for everyone to be able to report incidents, so that these can be
    captured and reviewed in order to assess whether there is policy change required
    or behaviour change, or both. Joining up incident management across the organisation
    will go a long way towards addressing risk management. Incidents need to be added
    to performance management reporting, so that visibility is achieved across an
    appropriate management layer.


    What about team and company communications?


    ‘It’s the little things that get you’ is an oft-used phrase. When you discover
    that different departments are using their own banner at the bottom of their e-mails,
    some of which are referring to the e-mail scanner used and some are not, your
    task as the ISM has to be to attempt to bring some order and structure to the
    situation, with appropriate reasoning for needing to do so. As I said before,
    the ISM has to live and breathe security in all its manifestations, so  integrity
    of information and output is one of the cornerstones and this is a manifestation
    of it operating in error. As a starting point, the e-mail system should be applying
    banners, so individuals should not feel the need to create their own. However,
    in the absence of automation, a standard piece of text should be provided that
    is applicable across the organisation.


    A key pick-up from this small example of an ISM-related task is that consistency
    of delivery is what drives security home for the users. When they understand why
    it is that a change is required, and how, in particular, it could be applied to
    their own personal environment, this makes it more meaningful. Security through
    obscurity can be a valuable approach for achieving defence in depth – the less
    you display about the products you use and the versions you are up to, the less
    an attacker may know about your likely vulnerabilities.


    What about other projects going on in your organisation at the same time?


    It is very important to be mindful of these because busy employees will be distracted
    and pulled in all directions with a multitude of priorities. The trick for the
    ISM is to show how information security is part and parcel of all that busy work,
    not an extra in isolation. So you need to have eyes and ears across the landscape
    to pick up on plans and changes, as well as connections to existing teams and
    projects so that you have visibility of what’s coming up and can ensure that security
    considerations are being included from the earliest possible point.


    Project management


    So we’ve seen the importance of finding the people who have a vested interest
    in delivering positive change and those who are going to be helpful, for various
    reasons. With your immediate team, which will probably be made up of predominantly
    IT-based skills, you may find it necessary to explain information security ‘from
    scratch’ to them in the way that you want to see it implemented across the organisation.
    It really has developed beyond firewalls and antivirus software, although we obviously
    must also still apply these technologies. I’ll come back to this under BAU in
    *[Chapter 2](#10_ch02.xhtml#ct2)*.


    IT people should appreciate why it is that you are getting involved in so many
    elements outside their domain – because you are following the information train
    and know about the need to protect it.


    There are many risks that can befall a programme of activity. You need to know
    who will authorise ongoing expenditure on your project and who will require any
    budget monitoring reports. Finance people certainly need visibility of the appropriate
    reporting on a monthly basis or your project spend may very well disappear, so
    start with your own activity. It is helpful to know where the spend is going and
    is part of the expanding profile of skills required of the ISM role.


    Always check the small print – suppliers can try and pull a fast one with larger
    customers as they don’t believe that the ‘small print’ is, in fact, being checked.
    Always check the following:


    • Do the hours of work tally with the quoted costs?


    • Do the people coming and going in your organisation have the authority to be
    there?


    • Has the job they were contracted to do been done properly?


    The bottom line is – don’t assume anything, check everything.


    There are always a number of key activities that need to have taken place prior
    to reaching a milestone. Now, I don’t want to make this chapter a regurgitation
    of any kind of PRINCE2^® methodology, but there are basics that get applied and
    then people seem to end up unaware of them or lost in terms of responsibility,
    accountability and participation.


    So, it is important at the outset to have explained your management style and
    your expectations with regard to the commitment of all the participants.


    Also, check people’s holiday commitments! You can have the best plan in the world
    and it all goes Pete Tong (Cockney rhyming slang for ‘wrong’!) as a result of
    a key player not being available at a critical time within the delivery phase.
    A key milestone may, thus, be missed, especially if that individual is, in fact,
    unaware of the critical nature of their input.


    These are just a few of the key fundamentals that you need to have as ‘stock-in-trade’
