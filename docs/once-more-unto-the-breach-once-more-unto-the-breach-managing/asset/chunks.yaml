    Befriend the installations team, too. Depending on your organisational set-up,
    you may have the luxury of still having one internally; otherwise, it may be an
    outsourced function. Either way, it is valuable to get to know the teams who are
    actually going out to your various office locations and having interaction with
    your users. They should be able to provide some level of interesting feedback
    with regard to how your infrastructure is being used ‘in the wild’, looked after
    (or not), treated, handled, managed, etc. They may have many war stories they
    can recount that will provide you with a wealth of information regarding the reality
    of your user base in terms of their PC literacy, and such knowledge can pay dividends
    when it comes to key changes you may wish to implement further down the line.


    Make friends with the database administrators (`DBAs`) too. They hold great insights
    into the systems that they guard with regard to user behaviour, incidents and
    experiences. Equally, the DBAs will need to be kept abreast of back-up and recovery
    strategies and requirements, and will need to ensure that they have documented
    their activities and best practice with regard to system management for the systems
    for which they are responsible. Such input and resources will be invaluable to
