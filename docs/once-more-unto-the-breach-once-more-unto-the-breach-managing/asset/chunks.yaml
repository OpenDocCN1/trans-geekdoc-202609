    confidential waste is of concern, especially when it is not being stored behind
    locked doors. Again, it makes too easy a target; someone could simply steal a
    bag at random, not knowing what jewels of information might be contained therein
    – but you never know your luck, and that’s why it’s called an ‘opportunistic theft’.


    ![](Images/P109_01.jpg)


    Figure 5: Awaiting collection


    Physical security solution suggestions


    • Wherever possible, recommend some reorganisation of office filing to make best
    use of the available storage. The space crisis is rarely as bad as you are led
    to believe, given the volume of Christmas decorations, tea bags and old (out of
    retention period/should be in the archives) papers you can find in cupboards!


    • Seek to ensure that files in regular use are locked away as a matter of course
    when not in use, and ensure that no papers are left out on desks at the end of
    each day.


    • Make it mandatory that any files that identify living individuals are locked
    away at the end of every day in a secure storage area.


    • Move the files that are not required to the appropriate secure storage area
    – either external archive storage or onsite secure storage - in conjunction with
    your records manager, if you have one.


    • Ensure rooms that need to be locked at the end of the day are locked, with the
    keys removed!


    • Seek to increase staff awareness on the issue of information security and the
    importance of reporting issues to the correct person.


    • Arrange for all redundant equipment (telephones, printers, chairs, desks – everything,
    do not be selective as it just becomes divisive) to be removed in the appropriate
    manner. For example, electronic equipment should be removed in compliance with
    the Waste Electronics and Electrical Equipment Directive. (*See* *[http://en.wikipedia.org/wiki/Electronic\_waste](http://en.wikipedia.org/wiki/Electronic_waste)*.)


    • Ensure that exposed cabling and power supplies are secured. This means the blindingly
    obvious – i.e. make sure that no one could walk up to any cabinet or similar and
    unplug anything just because they can, or because the mischief-maker in them thinks
    it might be funny to see what the end result would be. You may need to liaise
    with your equivalent of facilities management to put the right physical protection
    measures in place (lockable cabinets, cable boxing, ducting, etc.).


    • As an overall physical security improvement measure, build the right kind of
    messaging into information security awareness briefings so that all your employees
    know what to be looking out for, and understand and appreciate the importance
    of reporting even the smallest of issues to the right person, in a timely manner.


    • Ensure that you have an appropriate information security incident handling process
    to support this. We will discuss this in the next chapter.


    Other security tasks for this month


    Environmental concerns


    I have already mentioned the need to be aware of as many projects as possible,
    so that you can ensure that security is being woven in. Most organisations are
    in the process of ensuring that their IT strategy meets a ‘green’ agenda – consolidating
    data centres, reducing carbon footprints and impact on the environment, etc. Some
    of the more useful technology to appear in this space is the kind that helps to
    put your desktops, etc. to sleep when not in use. For the users across your organisation,
    there are security implications that need to be considered with regard to leaving
    machines on overnight depending on what machines are used for. Messaging software
    is a particular risk.


    Information security awareness briefings


    You need to be aware of the project and be aligned with it, so that you can assist
    with the right kind of communication, particularly as your information security
    awareness briefings may be giving out the wrong message.


    By now, we were four months into the security improvement plan. Briefings had
    been delivered to thousands of employees on a one-time basis, face to face. Work
    was now required in communicating with both personnel and IT training colleagues
    to ensure that the  delivery commitment was picked up in a way that would ensure
    a repeat redelivery 12 months hence, with reminder notifications to all employees
    to undertake the supporting computer-based training (CBT) module that was available
    across the organisational intranet. This all needed to be made available to new
    starters as part of induction and a plan of delivery was required for contractors
    and agency staff, too. Also, for those workers who did not have access to the
    intranet, it was important to provide a ‘train the trainer’ function to ensure
    that local delivery of the security awareness briefings could be carried out,
    so that no one was left out.


    The positive benefits of ensuring that the delivery had been done on a face-to-face
    basis, with one trainer providing a consistency of message and style, were beginning
    to be reaped. The users were starting to report more incidents, advising us of
    concerns and asking questions. This highlights gaps in policy understanding or
    in security infrastructure implementation that you can seek to address.


    ‘Kit’ movement


    Users have become much more tech savvy in their home environment, without a doubt,
    although the reality is actually that users are experiencing more up-to-date equipment
    being available to them, with faster speeds and lower prices, but with no more
    training or awareness of what it is that they are handling. This increased level
    of technological expectation in the home environment cannot easily translate to
    the corporate/organisation environment, as it is unrealistic. It also does not
    give them licence to move or disrupt existing installations in your organisational  infrastructure
    and this must be explained to them, then enforced and monitored.


    Central management systems that provide detailed logs of activity on all desktops,
    laptops, servers, etc. in your network provide invaluable information once analysed,
    and the analysis needs to be used to inform policy reviews. You need to know if
    a desktop is moved or if a network cable is disconnected – for how long, by whom
    (if possible) and for what reason. You need to be able to explain to the users
    why this is important and what problems it creates at the technology end, as all
    they see is a cable that they can easily unplug. They don’t understand the ‘bits
    and bytes’ and data being exchanged through that cable.


    Laptop users… again!'
