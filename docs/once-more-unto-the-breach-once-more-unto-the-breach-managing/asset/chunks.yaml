    The next chapters flesh out the increasing breadth of focus that needs to be embraced
    in order to achieve holistic information security management.


    CHAPTER 5: DECEMBER - OH, FOR THE SAKE OF YET ANOTHER PROPOSAL …


    Security improvement programme


    In this particular instance, there was an initial budget to deliver a particular
    goal, then a realignment of expectations following the achievement of that goal.
    This was because in reality, what was put on the submissions that were required
    to be presented to external auditors was not the reality of what was actually
    going on inside the organisation. Not untypical. So a plan of action (in security
    terms, this is usually called a security improvement programme (SIP)) was put
    into place to address the compliance gaps. The gaps were way beyond just technological
    issues and spanned all three points of an imagined triangle of people, processes
    and technology.


    By now, a couple of months down the line from the initial upgrading of compliance
    to an external connection requirement, the SIP was moving along apace. However,
    executive management required many more business proposals in order to explain
    why a quite significant amount of further funding was being sought to help with
    addressing these gaps.


    In spite of the ability to continue to deliver change on an incremental basis
    without it having a significant impact on anyone’s bottom line, senior management
    need constant evidence of how these improvements are making a difference and to
    whom. If the evidence is not compelling, it can become incumbent on the ISM to
    provide senior management with visually convincing reports or, worse still, you
    may find yourself having to write further  proposals to hold on to the budget
    you have already secured, in order to ensure that you are allowed to continue
    to spend it on the security enhancements as planned.


    In many ways, this approach is flawed and harks back to my opening statement –
    as long as ‘doing security’ is seen as a project, with a beginning, middle and,
    most importantly, a presumed end, then management find it hard to understand why
    there is a constant demand for further investment, resources, technology enhancements,
    etc. But this is the reality of the landscape within which we are operating. Our
    information assets are now more highly prized and more actively sought after than
    ever before, and so the role of the ISM needs to involve constantly educating
    staff and management and raising awareness, highlighting the latest trends, threats,
    vulnerabilities, risks and mitigation strategies.


    Fax management


    There are still many organisations where facsimile (fax) communications are the
    most reliable medium (and, in some cases, most secure). However, in order to ensure
    a consistent level of safety, fax handling procedures may be required as a mechanism
    for reminding people how to use the medium. The answers (solutions/controls) are
    simple once explained, i.e. there is no real rocket science involved. This is
    the beauty of real information security laid bare for users in a way with which
    they can resonate. The solutions are simple and easy to grasp.


    **Table 5: Faxing – what can go wrong**


    | **Issue description** || **Mitigation** |


    | --- | --- |


    | An individual incorrectly transcribed the number to which a fax was sent, resulting
    in the intended recipient’s sensitive personal data being sent to a personal residence.
    The owner of the residence notified the organisation of the incident and shredded
