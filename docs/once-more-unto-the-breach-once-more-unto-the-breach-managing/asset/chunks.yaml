    • replacing an existing personal data system with new software;


    • design and development of a system where the data held is on a consent basis;


    • changes to an existing system, where additional personal data will be collected;


    • a proposal to collect personal data from a new source;


    • creation or redesign of web forms for collecting personal data;


    • development of new procedures for authentication;


    • plans to outsource business processes involving storing and processing personal
    data;


    • developing or amending policy statements relating to staff usage of council-provided
    technology, e.g. mobile phones and laptops.


    A full-scale assessment should only be considered where there is likely to be
    considerable impact on your organisation’s handling of personal data, including
    one or more of the following activities:


    • use of technologies that could impact on privacy;


    • use of sensitive personal data (as defined in the Data Protection Act, e.g.
    race or ethnic origin, health, political opinion, religion, offences, sexuality);


    • use of confidential information or information which could be used for identity
    theft, e.g. bank account details or other financial information;


    • use of excessive authentication data, e.g. biometrics (fingerprints or iris
    scans) or copies of birth certificates or similar documentation;


    • publication of unprotected personal data without consent;


    • sharing of sensitive data with third-party organisations;


    • holding of large quantities of personal data relating to an individual;


    • holding personal data relating to a large number of individuals.


