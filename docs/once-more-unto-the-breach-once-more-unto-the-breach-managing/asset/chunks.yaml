  raw: 'By now, most organisations should already have information security best practices
    implemented to some degree in the organisation. However, there are still many
    who have it buried in IT in such a way that the struggle to implement the necessary
    safeguards is an ongoing one, and new projects are set up to try and achieve compliance
    with external legislation, regulations, standards, contracts or government-led
    requirements that must be adhered to. In order to be truly effective, these initiatives
    require constant explanation as to why you need to be linked into various activities
    and other change-related projects that you may stumble upon along the way.


    The ISM role also requires a level of listening. At this stage, in so many organisations,
    there have been many, many change programmes. This can lead to fatigue being experienced,
    so people can tend to be resistant to any further attempts at delivering on change
    programmes. Therefore, the best way to ease the forward momentum required is often
    to allow people a short period of time to get those issues that they feel are
    blocking progress at the present time off their chests. Early scheduling of introductory
    meetings helps to get this listening phase out of the way. The ISM cannot afford
    to be either a wallflower or a shrinking violet! You need to be out there, amongst
    the people, as it were! Once you have heard the issues you can usually implement
    solutions that you already had in mind, as the concerns are usually not difficult
    to address; or,  indeed, you can frequently point out to people that there are
    already controls and safeguards in place that may not have been adequately explained
    thus far, but that are likely to be appropriate for providing protection.


    You have to show a certain level of commitment to delivering on the change in
    order for people to start to buy into the idea that things are going to be different.
    The ISM has to be seen to realise some quick wins as early as possible in the
    life cycle of the intended change programme. Actually, the ISM has to be seen
    to live and breathe security in all that they do, day in and day out: always wearing
    their employee (or equivalent) badge; always encrypting their data; always backing
    it up, etc. If you consider all the controls we ask our users to bear in mind
    on a daily basis, the ISM really must be seen to be doing them, and doing them
    well and with ease in order to prove that security need not be a hindrance and
    to evidence that it has both value and meaning. You also need to have almost a
    superpower of awareness – we will continue to delve into this in the forthcoming
    chapters.


    Given how much ‘transformation’ everyone has been going through for more than
    a decade now, it is always helpful to ensure that you have adequate background
    information on the organisation and its cultural make-up and challenges, including
    what’s worked before and what hasn’t in the realm of change management. You will
    need help in galvanising the resources, communicating the changes, etc., including
    from those folks in human resources, training, corporate communications, etc.
    You’ve got to make links and friends across the entire organisation, way beyond
    the expected IT/ICT restrictions.


    In larger organisations there are usually people responsible for the issuance
    of corporate policy, who also need to be positively engaged. If this is not the
    case, some level of governance review of policy must occur at your information
    security management forum (ISMF) meetings, which you should schedule on a regular
    basis. All updated documentation should be required to have some level of management
    sign-off prior to release into the operational environment.


    Writing policy in isolation from people will render it doomed to failure, so it
    is vital that this work is done in conjunction with key stakeholders. You need
    a wide portfolio of support across the organisation. With any element of security
    change to your secure infrastructure amendments to policies, procedures or controls
    are usually required, and it is vital that these changes are made in order for
    them to be embedded into the fabric of the organisation and accepted as things
    that are connected to the disciplinary process. There need to be obvious and active
    consequences for failures to adhere to policy. The ISM cannot administer this,
    as that is tantamount to marking your own homework. This is why, in particular,
    you need to have engagement with colleagues in human resources. They need to understand
    the requirement to ensure that employees have job responsibilities identified
    for information security and that these are measurable within their annual personal
    development plans (or whatever your equivalent is). This may also require the
    input of colleagues from training to ensure that relevant learning objectives
    are measured by individuals and updated annually.


    An interesting source of assistance is the ICT help/service desk – or whatever
    it is called in your organisation. Get the management of this area on side early,
    understand how  many people are normally operating it, and establish what their
    level of understanding is with regard to information security issues. Is it, for
    example, that they get increased calls for password resets after significant holiday
    periods (Christmas, summer, etc.)? What other key issues are they constantly receiving
    queries on? You need to identify these key elements and frame them in language
    that explains that they are part and parcel of delivering good information security
    for your organisation. This will enable the help desk staff to see where you are
    coming from (your paradigm), and hopefully to better understand if your change
    agenda ultimately involves increased help-desk calls as a result of confused users
    not quite understanding the message you are pushing. This is so often the case,
    usually in spite of the hours you have spent painstakingly explaining the changes
    to their managers, and to them, through e-mail notifications, newsletters and
    intranet bulletins, etc. – i.e. doing all that you can! You can further help the
    help desk by providing them with cheat sheets and FAQs to make sure that they
    have the right answers to hand for each phase of your security change programme.
    This will help both their understanding and the level of service they are giving
    to the user population – a win-win all round.


    Befriend the installations team, too. Depending on your organisational set-up,
    you may have the luxury of still having one based internally; otherwise, it may
    be an outsourced function. Either way, it is valuable to get to know the teams
    who are actually going out to your various office locations and having interaction
    with your users. They should be able to provide some level of interesting feedback
    with regard to how your infrastructure is being used ‘in the wild’, looked after
    (or not), treated, handled, managed, etc. They may have many war stories they
    can  recount that will provide you with a wealth of information regarding the
    reality of your user base in terms of their level of PC literacy, and such knowledge
    can pay dividends when it comes to key changes you may wish to implement further
    down the line.


    Make friends with the database administrators (DBAs) too. They hold great insights
    into the systems that they guard with regard to user behaviour, incidents and
    experiences. Equally, the DBAs will need to be kept abreast of back-up and recovery
    strategies and requirements, and will need to ensure that they have documented
    their activities and best practice with regard to system management for the systems
    for which they are responsible. Such input and resources will be invaluable to
    the ISM.'
