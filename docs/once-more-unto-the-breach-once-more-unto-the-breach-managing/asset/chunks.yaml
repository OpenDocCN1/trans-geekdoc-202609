    Depending on the size of your estate this can obviously take a great deal of time
    to achieve for all machines, so you need to work out a process. Deploying upgraded
    software across the network would be the most sensible approach, i.e. using a
    technological solution, rather than a people-based solution (one where you would
    need to visit each machine), but there are many organisations that still have
    a long way to go in terms of gaining efficiencies from the deployment of technologically
    appropriate solutions.


    In spite of your best laid plans, because of the vagaries of different systems,
    the standard build approach may not work on every single machine, for every single
    instance, as the combination of different applications can cause conflicts in
    system operation. So, having spent time developing the ‘image’ you want to use
    for all desktops to be rolled out, what do you do when it has issues? In the case
    of the real situation in the background of this book, we found that macro settings
    in certain corporate systems caused problems with image roll-out; more because,
    in fact, once one user has a bad experience, it can taint the new standard build
    for many others. Part of the difficulty can be that, while the intended conflicting
    system may be on a replacement programme, there may be a time lag between the
    implementation of the new, non-conflicting system and the present day and, thus,
    your users have to remain frustrated by system glitches.


    You need to be able to manage the communication very carefully and ensure that
    you resolve any niggles very quickly. The implementation of a new ‘image’ across
    your machines may be required in order to roll out security-based enhancements,
    but it will quickly be used as the excuse for slowing the project whenever something
    goes wrong. Any negativity needs to be nipped in the bud swiftly, so that future
    security enhancements are not hampered by any lingering memories of poor performance
    caused by bad press.


    ### Security Assessment Tools


    Microsoft® Baseline Security Analyser (`MBSA`) proved to be a very valuable tool
    in the arsenal of available technologies to help identify the security state of
    assets. `MBSA` is a software tool released by Microsoft to determine security
    states by assessing missing security updates and less-secure security settings
    within `Windows` and `Windows` components, such as `Internet Explorer`, `SQL server`
    and `Microsoft Server` macro settings. As we were finding macro settings’ issues
    with corporate applications, this was a good place to start. Knowing the volume
    of machines that needs to be kept up to date is a starting point (we mentioned
    this in `[Chapter 1](#09_ch01.xhtml#ct1)` as being one of those key questions
    that needed answering). Having a view of the spread of their security status is
    extremely valuable. Your resources may be stretched too thinly to be able to achieve
    full compliance with all policy requirements in one delivery, so to be able to
    prioritise machines against their security status makes the task all the easier
    and you can justify your approach on the basis of the evidence you have gathered.


    ### Software Licensing


    Software licensing has to be managed in this process, too. This is also a key
    issue when rolling out new images. You need to know the current status of the
    number of licences for each application and what the requirements are in each
    team, section, department, directorate, etc. – not just from an operational point
    of view, but obviously from a legal point of view, too. Compliance with all requirements
    and knowledge of the maintenance level, length of licence and number of users,
    concurrent or otherwise, are all information elements required for managing the
    software assets in your estate.


    ### Password Management


    In `[Chapter 2](#10_ch02.xhtml#ct2)`, we focused quite a bit on password management,
    but, as with all elements of information security management, they are ongoing
    and repeat regularly. With the roll-out of the password change segment of the
    security change programme, it was necessary to deal with various devices and users,
    and manage both the human and the technological responses to the change. In order
    to achieve this, support was required to ensure that centralised control of the
    estate (mobile or otherwise) was possible, so that equipment could be recalled.
    This was important in order to ensure that upgrades were applied, so that users
    were not able to avoid responding to communications requesting product returns.


    As part of the communication process it was necessary to visit various teams,
    departments and directorates, and deliver briefings to the management and both
    their regular meetings and the update sessions that were carried out as part of
    their monthly activities. Getting information security on to the agenda as often
    as possible is hugely valuable, so that people can hear what your plans are and
    what is forthcoming in the programme of change. More importantly, it is an opportunity
    to listen to the employees and hear what their concerns are; you might learn,
    for example, that they are still writing down their passwords(!) or that they
    don’t have enough lockable cabinets - but I’ll come back to that one later in
    the book.


    ### Consumerisation


    Consumerisation has been building as an industry theme during recent years, but
    I have certainly been dealing directly with it since at least 2009. Users have
    wanted to have all the capabilities and facilities of their own mobile devices
    for quite some time. However, they lack the appreciation of how this might affect
    the organisation from a legal standpoint. For example, in some instances using
    their own devices (`BYOD`) would involve breaking motoring laws – you are not
    supposed to be operating a mobile device while driving.


    As an organisation you usually have a wide range of obligations that must be seen
    to be adhered to, and these are supposed to be documented. Even if you are not
    following a framework like `ISO27001` you need to know the legislative landscape
    within which you are operating and to be able to explain to your user population
    that their home experience may well be different (faster, etc.) than their work
    experience of technology, but that this is necessary in order to manage an infrastructure
    often operating across a wide area network and a vast number of individuals.


    ### Third-party Management


    There are a number of layers to third-party management. You may have many third-party
    software suppliers providing a spread of products to your organisation. Depending
    on the nature of these, not all of them will be directly security related, and
    there are still many providers of IT within the industry who are well behind the
    understanding curve when it comes to information security. So, the role of the
    `ISM` is to be the educator in these circumstances; to be aware of the contract
    terms and conditions, the intentions of the purchase and the expectations of the
    delivery, all within the bounds of protecting the information assets that the
    system is ultimately designed to support, process, store, share, transmit, etc.


    So when we found we had a third party e-mailing `zip` files with patches for their
    products, which were being quarantined as unised files, it led to a couple of
    different responses. As a public sector supplier, the query had to be whether
    e-mailing security updates in the clear (unencrypted) was the most appropriate
    approach. They should have known better and been providing a more secure support
    service. It presents a negative image of security when government-related providers
    still have a tendency to ‘talk the talk’ but not ‘walk the walk’ in all cases.


    ### Audit Log Management


    Audit logs are rarely reviewed – why is this? Who looks at these and who should
    look at these? How often? What’s the value?

