- fmt: '

    Central to IG is an understanding of the journey from IT security, through information
    security, to IA – all of which are about maturing to a position of being able
    to demonstrate justified confidence in security measures, processes and practices
    in the management of information. While IA has been seen to be the growth area
    in recent years, maturing out of information security, the ultimate goal must
    be to embed a full IG framework across all organisations in order to fully include
    the total breadth of information-related legislation, regulation, standards, policies,
    procedures, technology and people issues that need to be managed, handled and
    protected in today’s cyber-dominated environment.


    Consider, if you will, the ‘11 Cs’ of IG.


    ### Eleven Cs of IG


    1. centralisation

    2. communication

    3. (legislative) compliance

    4. confidence

    5. confidentiality (integrity, availability)

    6. conformance

    7. consistency

    8. content

    9. continuity

    10. (security) controls

    11. corporate records management.


    (And now for something completely different…! For those of a spiritual nature,
    apparently the number 11 possesses the qualities of intuition, patience, honesty,
    sensitivity, and spirituality, and is idealistic. People turn to those who have
    these ‘11’ qualities for teaching and inspiration, and are usually uplifted by
    the experience. Not for nothing, nor randomly, are these things chosen!)


    Your aim as an ISM should be to seek a deeper understanding of IG and the principles
    for good information management and handling, enabling technologies and current
    best practices and, at the same time, to gain a broad appreciation of the many
    facets of the information at the heart of all that you will encounter.


    At a minimum, over time, you could consider your body of knowledge to ensure you
    have a broad understanding across all of these areas:


    • principles of IA and beyond

    • standards and best-practice management of information security (BP)

    • software assurance (SA)

    • data protection and privacy (DP)

    • records management (RM)

    • business continuity/disaster recovery/resilience (BC).


    #### Table 6: Areas of knowledge required


    | Information assurance principles & beyond (IA) | Data protection & privacy (DP)
    |

    | --- | --- |

    | • Information governance overview<br>• Information governance framework<br>•
    Information assurance – history – how did we get here?<br>• Overview of relevant
    information-based legislation<br>• Data-handling review and other government-led
    initiatives<br>• Information assurance maturity model (IAMM)<br>• Culture, ethics
    and professionalism<br>• Internal and external audit | • Data protection principles<br>•
    Maintaining public trust and respecting personal privacy<br>• Information sharing/data
    transfers – benefits and constraints<br>• Privacy impact assessments<br>• Gaining
    consent, direct marketing<br>• Managing cookies<br>• Data-quality management<br>•
    Data-breach management – and links to security incident management<br>• Data protection
    in the workplace<br>• Use of personal data in system testing<br>• Criminal offences
    and the ICO.s power to fine<br>• Handling subject access requests (SARs)<br>•
    Binding corporate rules<br>• PIMS and BS10012 |


    | Standards and best-practice management of information security (BP) | Records
    management (RM) |

    | --- | --- |

    | • Information risk management (IRM)<br>• Risk appetite and risk culture<br>•
    Governance, risk and compliance (GRC)<br>• ISO27001 and ISMS<br>• Payment card
    industry data security standard (PCI DSS)<br>• COBIT, COSO, ITIL | • Records management
    programme (RMP)<br>• Records and information management (RIM)<br>• Standards (ISO15489)
    and compliance<br>• Vital and historic records<br>• Archives, destruction, retention
    schedules<br>• Handling records in mergers and acquisitions<br>• RM requirements
    in system decommissioning<br>• RM links with DR and back-up<br>• RM links with
    e-mail management and archiving<br>• RM links with file plan and directory structures
    |


    | Software assurance (SA) | Business continuity/ disaster recovery/ resilience
    (BC) |

    | --- | --- |

    | • How cybersecurity fits in<br>• Threats and vulnerability analysis<br>• Security
    controls (access control models and mechanisms)<br>• Usable security<br>• Designing
    security in<br>• Firewalls and data encryption<br>• Privacy enhancing technologies<br>•
    Defence in depth<br>• Cryptography<br>• Identity management<br>• Human factors
    in security design | • Including information security in the business continuity
    management process<br>• Business continuity and risk assessment<br>• Business
