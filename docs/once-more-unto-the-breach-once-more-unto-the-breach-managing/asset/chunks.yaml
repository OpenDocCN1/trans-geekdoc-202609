    | 日期 | 事件 | 描述 |

    | :--- | :--- | :--- |

    | Jun 2000 | Qualified external auditor letter confirming the costs for assessment
    of the organisation against `BS7799:1999`. | Clearly the organisation had been
    considering certification to the then British Standard for Information Security
    Management Systems (`BS7799` – now an international standard, `ISO27001`). |

    | Nov 2002 | `BS7799` registration project. | Over two years later, a `BS7799`
    project initiation document (`PID`) was created. But nothing concrete appeared
    to happen to this project in the intervening years. |

    | Nov 2002 | Policies and principles manual includes information security. | Version
    2nd, based on `BS7799-2:2002` and following its structure in its entirety - but
    it was not implemented. |

    | Nov 2002 | Detailed application risk analysis. | Process and template prepared
    – not completed, embedded or shared. |

    | Nov 2002 | Homeworking detailed risk analysis `v1`. | Document completed, but
    there is no evidence that the actions were followed up. |

    | 2003 | External information security course provision reviewed. | Presumably
    with a view to it being embedded and available within ICT and beyond – it included
    discussion/education about information classification. |

    | Jun 2003 | Data risk analysis `v1`. | `ISM` owner of risk management process
    – but it hasn.t been used, completed or apparently shared. |

    | Jun 2003 | Detailed `BS7799` action plan. | Document incomplete. If this had
    all been followed up and completed, the whole information security improvement
    programme and compliance efforts would have been a breeze – instant responses
    would have been available and the `BS7799` certification would have been evidence
    enough to pass external audit requirements. |

