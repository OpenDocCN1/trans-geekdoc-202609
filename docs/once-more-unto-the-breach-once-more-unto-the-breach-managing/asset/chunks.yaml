- fmt: '


    | Issue Description | Risk Description | Mitigation Strategy |

    | :--- | :--- | :--- |

    | Ensure kit is ordered in a timely manner | There was a significant risk of time
    line slippage as a result of delays in ordering the large volume of PCs required
    to deliver this project – in spite of knowing that it was a requirement from the
    outset and knowing the supplier.s lead time in advance. | Ensure orders are placed
    as early as possible within the project – even though it makes the figures look
    scary initially (i.e. lots of spend up front) – but at least you can then plan
    the roll-out of equipment in the sure and certain knowledge that you actually
    have it available to you. |

    | Desktop ‘image’ problems | Systems were included on the desktop image that were
    not needed – and some were missed out. It is not clear who did the user acceptance
    testing and why this happened, given that someone on the ‘customer’ side signed
    off the image as appropriate. This is symptomatic of ‘bottom-up decision making’
    – see below. | Ensure that the service area properly signs off on user acceptance
    testing of whatever is intended to be implemented for them. |

    | Lack of recognition of and reference to data protection and security issues
    in contracts | There were consistently issues with regard to third-party suppliers
    not being adequately bound by appropriate contractual arrangements that addressed
    privacy concerns (data protection and security). | Ensure all third-party suppliers
    are bound by appropriate contractual arrangements that address privacy concerns
    (data protection and security). Engage with procurement personnel to ensure this
    is addressed in contracts, as well as at a local level. |

    | Lack of software licensing management | ICT staff and responsible information
    asset owners were unable to be clear about who had access to what software at
    their desktop (or what they should have access to). | Ensure that you have an
    adequate configuration management system that captures all hardware, software
    and information assets, so that these can be appropriately identified, managed,
    secured and controlled. |

    | Windows^® takes scripts literally | An intelligent ICT developer wrote a script
    to copy all the users in A–J only, but Windows^® thought it was smarter than the
    programmer (!) and copied only all the files beginning with A through to J, rather
    than everything under the user beginning with A through to J. And, randomly for
    a user, it picked up a six-year-old e-mail signature block and other users couldn.t
    see their `.pst` files or their address books for quite some time. | Ensure time
    is available to understand the ramifications of the written word in script language
    from a development point of view – but also ensure there is time to test system
    upgrades. |

    | Embedding passwords in systems is a bad idea | Embedded passwords need to be
    identified as early as possible as, once you enforce a password management policy
    that requires a change every 90 days, a great deal of overhead is then added.
    Passwords have been embedded in Access^® databases and also in externally provided
    applications. | Ensure that applications and systems across the organisation have
    been identified and addressed within the required password rules. |

    | User migration issues – corrupted privileges and excessive permissions | FAF
    = file and folder – permissions were a huge issue in managing user migration from
    one area of the network to another. User moves created a mismatch in server datasets
    and locations, for mapping drives and shares. Corrupted privileges in the shared
    and home areas, as a result of the way the user migration took place, meant that
    operations staff could not resolve issues as they normally would, as they did
    not have the requisite rights. This was going to take some time to unravel, time
    that was not being allowed for within the day jobs of project team members. |
    When undertaking a large-scale system or server migration project, wherever possible
    encourage service areas to create a new, clean file structure for the teams and
    the shared area of the service – identifying who needs access to which folders.
    Apply new permissions from the top down (cascading them across the folder structure).
    |

    | Lack of technical skills | Translation of security issues across existing technical
    disciplines proved difficult without an IT or InfoSec officer in post dealing
    with ICT colleagues on a day-to-day basis. There was no knowledge transfer regarding
    risks, implications and impacts, and without this or allowing for these skills
    to develop over time, it was difficult for many ICT members to appreciate the
    potential scale of the challenge. | Ensure that there are those capable of horizon
    scanning across the ICT landscape within which you are operating – both technically
    and from a security point of view – so that the two end up more in synch than
    in competition with each other. There really is no need for divisiveness in the
    delivery of ICT strategy and ensuring security is baked in alongside this. |

    | Back-up/restore issues | Problems arose when restoring `.pst` files. This was
    a technical resource issue on the servers and needed to be addressed in order
    to ensure that the project team could successfully migrate larger numbers of users
    during later phases. | Regularly test support applications to ensure that they
    operate as expected. It sounds so obvious when you type and read it – but in the
    reality of a busy ICT team, it is easy to see how the obvious can get missed –
    so make a note! |

    | Storage copy issues | Problems were experienced with the infrastructure in place
    to provide storage, as security issues meant that it was necessary to do manual
    copies and restores. Again, this added project delays and needed to be resolved
    prior to rolling out more widely. | As per the previous comment, ensure that available
    resources operate as expected – without security conflicts – as these are exactly
    the kinds of issue that turn people off to security. |

    | Lack of SLAs | SLAs need to be in place between service areas and ICT, and internally
    between teams in ICT, to support each other and provide an appropriate, expected
    level of service in response to requests. | Ensure documented SLAs exist as these
    help everyone to have their set. |

    | Lack of controlled user registration and deregistration | There was a need to
    ensure that all users on the network were appropriately authorised to be there
    and were captured in terms of their systems and building access, and that this
    was monitored and controlled throughout their employment, right through to their
    eventual departure. There was also a need to put in place mechanisms for addressing
    long-term sickness, career breaks, etc. | Ensure that there is a `new starter`
    form and a `leavers` form (and a process to support these) on the intranet (or
    equivalent). More devices are being added to the environment all the time (often
    directly by the employee) and these need to be factored into a `leavers checklist`,
    in particular. |

    | Cloning live user data on test servers | Test servers were, in the main, clones
    of the data that was held on the live servers, wholly in contravention with industry
    standard best practice, the Data Protection Act and the British Standard BSI BIP0002:2003
    – Guidelines for the use of personal data in system testing. | Adhere to industry
    standard best practice – the Data Protection Act 1998 and the British Standard
    BSI BIP0002:2003 – Guidelines for the use of personal data in system testing,
    ensuring that live data is not used in test situations. |


