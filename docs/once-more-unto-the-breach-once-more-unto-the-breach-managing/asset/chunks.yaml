  trans: '

    当你的兴趣类项目被取消时，你该如何继续前进？这正是将信息安全领域的任何事物都简单标记为“项目”的症结所在。正如我们在本书中所看到的，信息安全需要被整合到组织基础设施的
    DNA 中，因此没有尽头，因为它必须不断变化，并适应我们所处环境中的威胁和漏洞格局。


    同样，作为一名 ISM（信息安全经理），你得了解业务。整个 IT 社区往往被指责为“不理解业务”，因此作为一名专业人士（见下文章节），花时间尽可能多地学习你的环境至关重要——正如我们在
    `第 1 章` 中所看到和学到的那样。这通常被称为“情境意识”，它需要持续的警惕，特别是要吸收你周围的人使用的文化和语言的细微差别，以便你可以寻求模仿它们。你成功实现这一点的程度越高，当你试图改变行为或为活动变更赢得支持时，你的结果就会越好——无论这种变更目的是为了给受影响的个人以及信息可能间接涉及的个人提供更好的安全和保护。


    ## 信息安全经理的职业生涯


    那么，关于成为 ISM，我们学到了什么呢？


    你永远不会空闲或无聊，这一点是肯定的！如果你没有经历太多的组织变动或变化，可以尝试在一年中应用某种程度的结构。存在不断出现的主题——笔记本电脑管理、密码管理、访问控制、服务器管理等。这是预料之中的。问题会反复出现，处理完本会消失，但如果你只是贴上创可贴，它们就会反复回来。你的角色在很大程度上是提供解决方案，往往是在困难的境地下，所以也要创造性地思考。


    这是一个“始终在线”的存在，因为你始终在考虑可能发生的危险。你越能让这种思维成为本能，你就越能将你想出的解决方案应用到日常工作中。


    一个东西要成为一个成熟的学科并被所有人理解和遵循需要多久？采纳的动力是什么？强制性执行会让这种采纳更成功吗？在某些情况下，你的用户群体会有“这对我有什么好处？”的心态，你必须确保解决这个问题。我们已经看到在合规性方面将面临挑战：个性、优先级、内部与外部政治、收同、集中化和专业化。最终，你需要跨团队、跨组织协作来获得信任。你需要成为一名导师、引导者顾问，整天忙于寻找方法激励和鼓舞你周围的人！


    在序言中，我描述了现实；许多人在被当作一份“礼物”送给后，发现自己承担了 ISM 的角色。因此，通常你会感觉自己接到了一杯毒酒。说服人们做不同的事情是一场持久的攻坚战。


    想象一下，你正在接受牙科保健师的护理。多年来，牙科诊发现，通过增加在牙科保健师那里停留的时间，可以缩短坐在牙医椅上的时间。并不清楚这对于任何人来说是否更愉快，但其理念是他们正在从反应性方法转向更具预防性的方法。因此，牙科保健师会在你每次光顾时告诉你，你多多用牙线，需要使用牙间刷，并且要把主牙刷刷牙齿缝隙，以减少斑菌，并最终减少龋齿和牙周病。根据你的行为，你可能会感到同样程度的被轻视和被责备。这取决于你在中间时间里所做出的选择。


    在你的组织内部及跨部门交付稳健的信息安全，可以被认为是与这种思维保持一致。你正在做的是实施控制措施。作为 ISM，你可能需要不断反思，以确保你所做的一切是有效的。你所尝试做的是确保这些资源到位，并确保你投入足够的时间来关注这些问题。


    ## 我投入大量精力关注的内容


    这些包括：


    - 框架（例如 `COBIT®`）

    - 监管要求（例如 `PCI DSS`）

    - 标准（例如 `ISO27001`）

    以及 活动，例如备份、风险评估和业务连续性计划。


    在许多方面，我们需要花费时间来确保这些。在组织中关注这些！


    ## 结语


    本书的设计目的是让读者经历一段 ISM 的职业生涯。这结合了真实的时间和过去，希望通过反思过去来学习并适应未来。


    可能没有特定的“顿悟”时刻，但希望将这些想法整合在一起可以提供帮助巩固知识点：


    - 不要局限于技术问题。要更广泛地思考。

    - 有一个使命，并尽一切努力坚持它。例如，“信息是我们工作的核心，我们将竭全力保护它。”


    希望通过这些，你会有足够的信心向管理层解释为什么它应该是一个全职工作并获得适当的资源。


    行业有大量工作在推动 IA 的专业化。信息安全专业人士已经有了许多认证。这些都具有巨大的价值，你应该从底层参与发展，或者确保保持自己的持续职业发展。例如，作为读完这本书的结果，你可能需要关注信息和风险管理的学习。


    阅读旧的内部审计报告——当然，还有新的！


    成为相关组织的成员，例如：


