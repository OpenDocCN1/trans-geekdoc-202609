  raw: "You need to know your entire organisational landscape, so that you can literally\
    \ map it out in a meaningful way in terms of sensitivity of data, number of users,\
    \ types of asset in use, software in use and hardware requirements. There  are\
    \ a lot of considerations per location. However, each separate building location\
    \ that forms a part of your infrastructure needs to be considered as ‘a node’\
    \ on your network rather than a ‘remote’ location. They are not ‘remote’, given\
    \ that you know where they are. They are static buildings and you can apply a\
    \ level of control to the configuration items contained therein, including the\
    \ number of ports being managed from each location. You need to get past any hint\
    \ of ‘them and us’ when it comes to how IT set up their connections since, of\
    \ course, you are really all part of the same organisation unless, by way of legal\
    \ statute, there is a clear separation of entities.\n\nWorking with external third\
    \ parties is where the real difficulties are found, particularly if there is a\
    \ need for third parties to work within your own locations. Most of the challenges\
    \ can be addressed through the crafting and signing of appropriate third-party\
    \ access agreements or data-sharing protocols, or both. By now, there are many\
    \ great examples available, so there is no shortage of resources to help in resolving\
    \ these conundrums. But there will be a need to engage more widely with the likes\
    \ of the legal folk, facilities management, etc. to get the best solution for\
    \ all concerned.\n\nInnovation, innovation, innovation\n\nYou may often find that\
    \ there are pockets of great, innovative work going on in your organisation and\
    \ it is important to find this out. If you radiate openness and positivity, people\
    \ will involve you more and ensure that you are kept in the various loops. In\
    \ the project, it turned out that there was an extremely interesting and ground-breaking\
    \ public sector piece of work going on that had  security challenges. Because\
    \ I had been out and about, banging the security drum positively, those involved\
    \ felt reassured that they could engage with the project office and get the support\
    \ they needed in order to ensure that their own project was a success, too. Their\
    \ biggest challenges were with third parties and addressing remote-working challenges,\
    \ as identified above, and most of the issues were resolved through careful crafting\
    \ of the necessary agreements.\n\nFor the ISM, the difficulty is usually that\
    \ such projects will have started without involvement from ICT, due to long-standing\
    \ expectations or earlier frustrations related to either a lack of knowledge or\
    \ lack of support. By not engaging positively the innovative project, which will\
    \ happen anyway because such is the way of things, will be running risks that\
    \ the project team is not be aware of, because they have none of the necessary\
    \ skill sets amongst them to consider the data- and information-based risks.\n\
    \nInformation labelling\n\nISO27001 has long suggested that information handling\
    \ should be approached through the classification of your information assets.\
    \ In the UK public sector, there are various labelling options (also known as\
    \ markings) available for information assets and these require particular handling\
    \ at each level. For example, sensitive personal data, as defined in the Data\
    \ Protection Act 1998 (DPA) is the equivalent of *restricted* data in government\
    \ speak and needs to be handled in a particular manner. In the US, this is often\
    \ referred to as personally identifiable information (PII) and a broader net of\
    \ definitions is cast to include more elements,  so you need to know which is\
    \ the most applicable to your organisation in its entirety.\n\nThis is a notoriously\
    \ difficult element of the provision of appropriate information security and requires\
    \ a great deal of thought and consideration. Deciding to apply protective markings\
    \ to information means that you need to have the option of doing so in all systems,\
    \ through the use of templates in your chosen ‘office’ product suite for example,\
    \ and you must also be able to apply the labelling through the e-mail suite. What\
    \ about messaging sent through instant mechanisms and through mobile devices?\
    \ These areas all need to be considered from both a technological and an operational\
    \ (practical) angle. Will the users really apply the labelling on each and every\
    \ occasion? Can technology be applied that will help to ensure that they do? The\
    \ answer to the latter is yes, but, of course, it comes at a price.\n\nLessons\
    \ learnt\n\nMaintaining a lessons-learnt log (LLL) as you go along through your\
    \ change programme is a very valuable exercise. Ensuring that you write it up\
    \ and present it is even more useful, so that it can be shared with others and\
    \ so a wider audience appreciates what can be learnt from experience. This is\
    \ a normal part of good project management and a security improvement programme\
    \ can certainly benefit from the exercise.\n\n*[Table 4](#12_ch04.xhtml#tb4)*\
    \ is an edited version of an LLL that should resonate, given how much of it has\
    \ strands of common sense running through it!\n\n**Table 4: Lessons-learnt log**\n\
    \n| **Issue area** || **Description** || **Commentary** |\n\n| --- | --- | ---\
