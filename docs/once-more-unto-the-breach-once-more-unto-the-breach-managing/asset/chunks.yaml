    As I say, getting into the mind-set is tricky. So, what’s wrong with the picture
    in `[Figure 4](#13_ch05.xhtml#fg4)`?


    ![](Images/P107_01.jpg)


    Figure 4: Confidential waste bin?


    A confidential waste bin should be one that you cannot put your hand in to get
    papers out; it should be lockable, and the keys and access should be tightly controlled.
    This is like the best a kindergarten could come up with and is not what you would
    expect to find in a mature and professional organisation. But, until such issues
    are pointed out visually, the required change doesn’t occur, because the attitude
    becomes ‘it’s the way we’ve always done it’.


    In one office I visited, there was a supermarket trolley being used for file storage!
    We’re into the second decade of the 21st century, and yet some offices still appear
    to be operating like something out of the 1950s. It is simply astonishing what
    people tolerate on a daily basis.


    Expect the unexpected – there may still be floppy disks lurking in people’s desk
    drawers. There really is no point in keeping these if you have no mechanism for
    reading the data. If this is the case, they need to be securely destroyed – shredded,
    for example.


    Any build-up of waste does not look good – overflowing waste-paper bins are definitely
    not to be encouraged. The first question has to be ‘why isn’t the paper being
    recycled?’ Then you check the contents and consider whether, in fact, it should
    have been placed for shredding or confidential waste. Equally, any build-up of
    confidential waste is of concern, especially when it is not being stored behind
    locked doors. Again, it makes too easy a target; someone could simply steal a
    bag at random, not knowing what jewels of information might be contained therein
    – but you never know your luck, and that’s why it’s called an ‘opportunistic theft’.


    ![](Images/P109_01.jpg)


    Figure 5: Awaiting collection


    ### Physical security solution suggestions


    * Wherever possible, recommend some reorganisation of office filing to make best
    use of the available storage. The space crisis is rarely as bad as you are led
    to believe, given the volume of Christmas decorations, tea bags and old (out of
    retention period/should be in the archives) papers you can find in cupboards!

    *   Seek to ensure that files in regular use are locked away as a matter of course
    when not in use, and ensure that no papers are left out on desks at the end of
    each day.

    *   Make it mandatory that any files that identify living individuals are locked
    away at the end of every day in a secure storage area.

    *   Move the files that are not required to the appropriate secure storage area
    – either external archive storage or onsite secure storage - in conjunction with
    your records manager, if you have one.

    *   Ensure rooms that need to be locked at the end of the day are locked, with
    the keys removed!

    *   Seek to increase staff awareness on the issue of information security and
    the importance of reporting issues to the correct person.

    *   Arrange for all redundant equipment (telephones, printers, chairs, desks –
    everything, do not be selective as it just becomes divisive) to be removed in
    the appropriate manner. For example, electronic equipment should be removed in
    compliance with the Waste Electronics and Electrical Equipment Directive. (*See*
    `[http://en.wikipedia.org/wiki/Electronic\_waste](http://en.wikipedia.org/wiki/Electronic_waste)`*)

    *   Ensure rooms that need to be locked at the end of the day are locked, with
    the keys removed! Seek to increase staff awareness on the issue of information
    security and the importance of reporting issues to the correct person.

