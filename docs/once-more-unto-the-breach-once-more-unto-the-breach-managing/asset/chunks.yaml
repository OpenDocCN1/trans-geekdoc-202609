    risks that present themselves along the journey.


    When an organisation has a project focus all of the time, it seems that there
    are ‘meetings about meetings’ plus project plans and reports to be maintained
    constantly, usually at the expense of doing the actual job that needs to be done.
    It’s a very difficult path to be negotiated, between playing the political animal
    and delivering on the requirements of the job. It is better if the ISM stays focused
    on actually seeking to implement controls that will provide the best protection
    possible for the information assets of the organisation employing them.


