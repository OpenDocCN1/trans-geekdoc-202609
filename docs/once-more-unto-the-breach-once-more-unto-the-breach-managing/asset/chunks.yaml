  trans: '

    一旦你完全掌握了自己作为信息资产保护者以及组织内未来项目和计划方案创建者的角色，你这种“保管员式”的角色就需要扩展到你寻求提供保护的信息资产的整个生命周期中。如果你足够幸运（如前提到的），你的组织已经雇佣了记录管理员。你应该寻求与他们紧密合作，以确保你的保护机制符合法律规定的留存要求，以及记录生命周期的其他维护要素。


    无疑，随着 `Cloud` 技术的不断普及，未来需要对其进行一些有趣的访问和存储讨论。组织需要确定是否有必要在任何时候都让所有数据可用；如果不是，应该如何以一种适用于信息本身可能分类的安全性方式对其进行存储。当然，问题就在于此：如果你还没有识别出信息资产，并没有以能够对你的信息进行充分标识和区分的方式应用分类，那么将很难知道如何区分不同类型的信息，以及如何最好地保护它们。


    其中一个方面是与各个项目团队合作，以确保围绕信息生命周期的考虑被纳入所有系统的采购过程中。很多时候，归档设施并未被视为新系统初始需求的一部分，但应当理解，从法律上来说，数据不能永久保存，因此必须通过阶段进行管理。对于这必须有某种过渡计划——从日常使用到短期归档，再到长期的留存。


    此外，取决于数据的性质，需要规定安全要求，以确保数据的长期安全和安全性。还需要安排身份验证机制，以满足恢复数据或在留存期之外访问数据的需求。


    ## 渗透测试结果


    正如我们在 `第 3 章]` 中看到的，漏洞管理是 `ISM`（信息安全管理人员）需要管理和监控的关键任务。这部分工作通过对所有系统进行渗透测试，并利用报告的发现来管理随之产生的缓解活动来实现。


    以下是渗透测试报告中最一致的发现：


    *    似乎没有人负责整体网络安全。这可能是由于责任碎片化导致（通常是由于人员裁减，许多组织在过去的五到十年中经历了这种情况），同时也反映了人们关注的是系统的功能，而非其安全性。这表现为：似乎没有人对网络层面的系统生命周期维护以及日常管理和维护负责——例如通过不应用更新、补丁等——这对系统和最终对数据成了真实风险；也没有人了解行业范围内已识别的系统前
    10 或前 20 个漏洞，而且显然没有人应用所需的解决方案，或从零开始设计系统，以确保它们在未来不包含这些缺陷。


    由上述所有权缺失而导致的一些关键问题如下：


    *   在安装新设备时仍在使用空密码——这是一个经典问题，虽然我们都知道需要处理并更改它，但时间似乎阻碍了这一点，每个人都忙于其他事情了。

    *   SQL 数据库使用默认和空密码——与上述问题类似，但至少这凸显了仍需解决的层次中问题的规模。

    *   密码易被破解——这可能是一个非常引人入胜的发现。当然，在我的案例中，这是最引起高层关注的一项，特别是考虑到正在进行的工作。

    *   补丁管理似乎没有得到及时管理，这种失职使架构和基础设施暴露在漏洞之中。

    *   发现了过多的管理员账户——考虑到正在进行的工作，当时这是一个令人失望的发现。


    ## 测试结果总结


    渗透测试和漏洞评估为组织安全实施的状况提供了宝贵的见解。这两者经常被混淆。漏洞评估应被认为与风险评估相关。首先识别系统（资产、资源）并为它们分配价值（重要性）。然后识别对每个资产的潜在威胁。显然，预期是在提交发现结果后采取缓解措施——至少对于最有价值的资源和最严重的漏洞是如此。渗透测试证明了所发现的漏洞（它实际上是这些漏洞的`概念证明`），提供了对底层网络、操作系统、数据库等缺陷的影响分析。


    上述任何发现并不罕见，但它们证明了良好的安全实践尚未到位。预计这些测试将在全年内定期进行。这样做可能会带来一些畏惧情绪，但请记住我们的准则——不存在 100%的安全，你永远不会
    100%无风险的，因此永远不要期待一份完美的健康报告。始终利用这些机会进行学习，并相应设定预期。然后，将修复工作与那些无疑已计划的网络（及其他）改进一同规划。

    '
- fmt: '

    Here is a small further note on this, to reflect that it will come up again and
    again. You should consider the issue of service packs versus critical patches,
    as affected by the nature of the system you are rolling out, or already have available
    to you through your IT provision – how do you make the decision as to the order
    in which these should be done and on what priority basis, when your landscape
    spans thousands of machines? There is a difference in how the network responds
    to the updates and how IT deals with machines that are struggling. Where possible,
    you want to have these updates running in the middle of the night – harder, obviously,
    if you are operating in an ‘always on’ environment. So, again it may be that you
    want to cluster your machines as per our physical layout example, and be able
    to deploy updates to specific sets on the basis of their priority and criticality
    to the organization. Whichever way you choose to do it, be prepared to have to
    deal with fallout from even just one machine not working ‘the morning after’,
    as it can create a ripple effect, a chain reaction of bad press across a team
    that extends outwards, and that’s the last thing you want when you are on a programme
    of change – or at any time really.


    ## Back to physical security issues


    I have often wondered at the separations and silos we have built up in our organisations
    and our industries, and what useful purpose they really serve, apart from maintaining
    empires and egos. For the sake of the organisation in the future, co-ordination
    and collaboration are usually required. One of these fractures is between emergency
    planning and the need to ensure that business continuity plans are in place. It’s
    hard enough sorting out `DR` plans, but these need to relate to systems. Furthermore,
    the business continuity plans need to relate to the business processes that utilize
    those systems. There is plenty of separate literature available on all this. The
    point made in the introduction is to get back to thinking about emergency planning
    in a certain way – all too often similar activities with shared risks are seen
    as very different. I visited an emergency planning room once and was surprised
    to see all of the emergency plans for each service area, with the folder titles
    visible (for ease of access). It was suggested, perhaps, that these could be moved
    into the new lockable cabinet that was available within the room, given that on
    a Thursday, Friday and Saturday night there were external third parties who occupied
    the room, carrying out night marshal activities, to whom these plans should not
    be so readily available. This had not occurred to the information custodians up
    to that point. Also, updates to the plans appeared to be difficult to manage,
    but they also contained a lot of personal data with home phone numbers and general
    contact details. So, the learning point of the visit of the `ISM` was that greater
    care needed to be afforded to this kind of material on a day-to-day basis.


    Another finding was that there were two users who found it necessary, as a perceived
    result of previous poor corporate system performance and server storage space,
    to utilize `8 GB` `USB` sticks as their file storage system. These were stored
    securely on site at the end of every day. The `USB` sticks contained personal
    data including stored sickness records, timesheets, etc., all of which was stored
    manually as well. This highlighted a significant amount of duplication in terms
    of both electronic and manual data, creating storage challenges. The `ISM` was
    able to reassure the users that there had been significant improvements in the
    corporate network and infrastructure, and to suggest that they should review their
    processes, particularly given the availability of the secure storage area within
    the storage area network. Also, the users needed to consider that the information
    was not ‘theirs’ as such, but belonged to the organisation, and, therefore, the
    files needed to be more readily accessible by other colleagues across the organisation.


    Beyond the emergency planning visit, there was a visit to the `CCTV` team which
    was equally educational. In general, recordings were normally kept on tape for
    31 days and then overwritten. However, `CCTV` evidence was burnt to `CDs` when
    requested and these were kept in `A4` folders in sleeves on the shelves, openly
    accessible, rather than in lockable cabinets. There were two `A4` folders a month
    of collated ongoing and transferred sheets. This seemed to be a significant undertaking,
    and while not directly referencing people, the `CD` contents presumably provided
    visual recognition of individuals. As this represented personal data, under the
    `UK Data Protection Act` it should have been stored safely and securely at all
    times.


    ‘Maintaining situational awareness’ is a phrase I’ve heard often during the past
    few years. It means what you think it does – having eyes in the back of your head
    and being aware of your surroundings and the situations you find yourself in.
    With awareness, you then have to work with whatever resources you have to hand.
    In the case of this review, there was an extra storeroom, near a main entrance,
    that was literally piled high with tapes that were waiting to go to the police
    for appropriate shredding. The team had asked for this to be done, but it was
    a classic example of having asked for support, but getting nowhere. The people
    being asked did not appreciate the nature of the material (its effective labelling
    and, therefore, the requirement to handle it in a certain way) nor the potential
    impact if the information had ended up in the wrong hands; i.e. the request itself
    was not risk assessed so was sadly ignored. The `ISM` needed to step in and `make`
    something happen. These kinds of situations must not be left, but must be attended
    to – this urgency needed to be transmitted back to the service desk, so that they
    learnt to appreciate the nature of the random requests they might receive and
    sped up their response mechanisms to a more appropriate level.


    ## Reduce, reuse, recycle


    The programme of desktop refresh continued to rumble on as it spread more widely
    across the organisation. By now, there was a stockpile of returned machines that
    could potentially be reallocated and this required some careful consideration
    as to the needs of the users – as opposed to their wants and desires!


    There was obviously going to be a large amount of equipment requiring destruction,
    having established those that were no longer of use. After all, you wouldn’t want
    your organisation ending up on a `BBC` documentary. Earlier project plans included
    building a relationship with a recycling provider that would certify the quantity
    of equipment that was taken away and ensure that it was appropriately destroyed
    or recycled, each and every time. The physical certificates for the quantities
    removed were maintained as records. This led to an interesting set of statistics
    which could be presented to management, including the tonnage of equipment removed,
    the volume of that it was possible to reuse, the volume recycled, any value brought
    back into the organisation, the number of machines replaced and the number of
    machines upgraded – all of which could be measured against the total estate to
    assess progress and provide useful feedback to the wider organisation.


    For some machines, it was possible to provide the short-term fix of updating or
    upgrading the memory chips to extend their current life. More critical, machines
    were replaced. Some machines and connectivity were so old that they were connecting
    through dial-up modems. They still exist out there, believe it or not!

