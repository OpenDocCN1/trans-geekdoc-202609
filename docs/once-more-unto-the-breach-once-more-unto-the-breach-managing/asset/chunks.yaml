    To make it more official, I put in an enhanced incident reporting process in order
    to ensure that people knew they had a ‘right of say’ (which psychologically can
    be more important an imperative than a ‘mandate to say’) and, thus, a gem appeared.
    This was to be handled through the ICT help desk for visibility. An individual
    ‘raised a ticket’ to say that they were told that they were not allowed to buy
    more encrypted memory sticks. As a result of this purchasing clampdown, the users
    were utilising their own USB sticks at home – by implication, unencrypted and
    probably not antivirus protected either.


    The reality was that this was only reflective of a larger project-wide situation,
    but a member of staff raising it as a ‘ticket’ incident helped to expose the need
    to increase appropriate organisation-wide communication and to progress the intended
    project much faster to incorporate a wider number of users, so that there could
    be a greater level of protection of information assets. The particular information
    being put on the ‘home owner’ USB sticks would, in most circumstances, be classified
    as ‘sensitive personal data’ and would be labelled (protectively marked) as ‘restricted’
    at minimum.


    Either way, you need your users to be able to report incidents, and you need there
    to be a record of these to collect data that can be analysed and reported to management
    in a meaningful way. This will all help to build up your metrics that you can
    measure the effectiveness of the security framework that you have been seeking
    to implement across the organisation. Some people prefer numbers (rising or falling);
    others prefer pictures (pie graphs, bar charts, etc.). You need to understand
    what works best for your organisation and be able to create some kind of dashboard
    that provides ‘confidence’ for security – i.e. is it explainable, translatable,
    measurable and tangible?


    ### Information Security

    Information security is a very subjective delivery mechanism for your organisation
    and continues to require visible representation to explain the benefits. People
    tend to notice when it’s not there. This is most notable when data breaches and
    information losses are being experienced, particularly if incidents arising are
    making it into the media (national press or otherwise). When it is working, when
    information security has become embedded, it is likely that people won’t really
    notice it-to-day, as it should not be getting in their way.


    ### Data-sharing protocols

    The industry loves acronyms and phraseology. So, when a colleague comes and asks
    what it means to be ‘trusted source’, you need to be able to construct an answer!
    Context is, of course, very important. But how is this identified and what makes
    someone ‘trusted’? The difficulty is that the context is related to trying to
    deliver on the promise of information sharing. It seems that each agency within
    the public sector is making up its own language, just as each industry in the
    private sector does too. You need to watch out for this as your role as ISM is
    often one of translator. Wherever possible, you need to develop relationships
    across the various agencies that your organisation has connections with, in order
    to learn their language. You cannot operate in isolation. Then there are all the
    conflicting initiatives that are harbingers of change attempts. Again, you need
    to keep abreast of these as every related change has an impact on information
    systems that will be used to produce statistics or manage a requirement; your
    organisation will need to secure the data and the people managing it. There are
    usually far wider implications than were originally considered.


    ### Compliance and contracts

    Back to the ‘trusted source’, it was a crossed-wires scenario where one agency
    was claiming it wouldn’t trust unless we proved certain things. Yet both agencies
    were in the same sector and should have been adhering to the same policies, procedures,
    guidance, network connectivity, legislation, regulations and standards. It was
    a clear example of the need for data-sharing protocols to be in place – and for
    them to be meaningful, in terms of having the right breadth of security controls
    to support the clauses contained therein. As an ISM, you end up needing to know
    about contracts and agreements. This involves having to understand legalese. It
    hurts, but it’s worth it! Data protection clauses – think of these as information
    asset protection clauses – need to be better referenced in contracts from the
    outset – either directly or as an annex in the form of a security schedule.


    You need to be able to provide a sensible response to providers when their sales
    teams are determined to sell you the world, but the reality may fall short. In
    particular, with Cloud and virtualization intentions moving apace, it really is
    important to know where your information is, who is going to look after it, for
    how long, how you will be able to get it back and how long that would take. You
    can’t be afraid to challenge the legal jargon and ask for what the actual facts
    might turn out to be, because, in breach mode, it might just be too late to find
    out out. Time will always be of the essence. There are times when you have to
    be explicit about data disclosure, data sharing, data retention and data destruction,
    obviously, throughout the life cycle of the data.


    ### Risk mitigation

    Over and above that, you need to have a register of protocols, so that you have
    visibility of who signed them on behalf of which organisations, and when they
    are due to be renewed. This is ultimately part of your mitigation strategy for
    risk reduction. The reality may be that the only time you need to know this information
    is if something goes wrong, but the same can be said of your car and house insurance
    policy details. Regulatory bodies expect an organisation to have control and visibility
    over its information assets and know who has access to them, where they are being
    transmitted to, who are being shared with, how long they are being kept for, under
    what conditions, in what circumstances and on what media – USB drives, CDs, DVDs,
    laptops, etc. Hence the need for the early establishment of the inventory as highlighted
    in `Chapter#09_ch01.xhtml#ct1`.


    There are constant perceptions of differences in security requirements across
    industry sectors, agencies, government and the private and public sectors. The
    perspective of the ISM should really be that, whatever is at the heart of the
    requirement, there is always a need to protect information assets; the task is
    finding the best way to do so that suits all. You often need to cut through all
    the rhetoric and polysyllables, as the solutions are invariably tried and tested
    – and simple – and this can be hard for people to take, as they don’t believe
    anything can be easy anymore! But it’s too easy to make things seem complicated
    and that isn’t what you want to be known for. You want to be seen as the ‘department
    of yes’, not the ‘department of no’! You want to be seen as a solution provider.


    ### Linking InfoSec with records management

