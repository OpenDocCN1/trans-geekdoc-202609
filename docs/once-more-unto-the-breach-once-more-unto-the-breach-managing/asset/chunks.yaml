    rather than spreading them too thinly across the project. We were encouraged to
    break it down into the following:


    • Port control/removable media –data loss prevention technology, also referred
    to as robust endpoint security, was installed at the ports in order to ensure
    greater visibility of the devices being connected to the network and to ensure
    that these were managed appropriately, in particular through scanning all connected
    devices.'
