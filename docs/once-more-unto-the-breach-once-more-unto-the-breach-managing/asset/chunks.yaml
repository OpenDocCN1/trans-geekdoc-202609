  raw: 'You need to make sure you are closely aligned with the other compliance functions
    in the organisation: data protection, freedom of information, risk, ethics, legal,
    records management and information governance. These may be separate or combined
    functional resources. If you are lucky, you will have some responsibility in all
    these areas. While this can sound daunting, it is ultimately where the profession
    is heading, as oversight of all the elements of information asset protection provides
    the best chance of ensuring you can provide the required amount of information
    assurance for all involved.


    External providers may also be important to the delivery of a successful infrastructure
    security change programme, e.g. kit providers, and recycling and destruction providers.
    We will return to the latter, in particular, in *[Chapter 3](#11_ch03.xhtml#ct3)*.


    The corporate communications team is a really important strand in all this. If
    you are lucky, it will be large enough to have marketing and communications people
    amongst its  number on a permanent basis and will be well used to structuring
    messages (both good and bad) and understanding the kind of tone and delivery that
    suits your organisation. You are going to be expecting a change in behaviour from
    all your users (or at least that’s what you should be aiming for) and, thus, you
    need to engage with them from a number of vantage points – i.e. what’s worked
    in the past, what hasn’t and, thus, what might work in the future as part of your
    communications roll-out. You need a theme, a strap line, a motto, an avatar, etc.
    All these elements can make your programme of activity appear more real, tangible
    and visible across the organisation. The users need to feel that they are part
    of something. Belonging is a core human need in Maslow’s Hierarchy (the middle
    layer) and is no less important for us security people to be aware of.


    There’s always a need for a ‘list’ (well, if it’s good enough for Santa Claus!)


    There are some key fundamentals that you also need to have as ‘stock-in-trade’
    information to hand, and this list grows over time, the more interaction you have
    with your organisation. Here are some examples.


    How many users are there?


    You may find that you need to get to the bottom of why there are so many potential
    systems with a list of employees in them. The staff directory that you find through
    an intranet may have different records to what Outlook^® appears to hold. What
    you need, at least in one instance, is one version of the truth for the user population
    that needs to  be managed in terms of policy, standards and controls, and information
    asset handling, which leads to your next data set requirement.


    How many assets require protection in your organisation?


    So often, information asset protection is utterly misunderstood and considered
    far too narrowly. It is one thing to have a configuration management database
    (CMDB) – an ITIL^® element that is supposed to contain all the components of an
    information system. But the focus may only be either corporate PC assets or corporate
    IT systems, and they are rarely as up to date as they could be; it depends on
    how centralised or otherwise your procurement processes may be. However, there
    are many spreadsheets being operated locally that need to be taken into account.
    There are USB sticks that need to be included; there are mobile devices that need
    to be considered; and there are all the laptops and their contents. The task is
    actually enormous, in fairness. The reality is that a CMDB may not always contain
    the full picture. Over and above the actual hardware assets are software assets.
    You need to have visibility of software licensing in terms of numbers and renewal
    status, for legal and regulatory compliance reasons. Then you need to cross-reference
    this with other record sets, including your RM system or equivalent (if you have
    one), in order to capture the information assets that need to be protected and
    to start to appreciate the level of sensitivity of those information assets.


    Another niggle arises when it transpires that some of the service areas/departments/teams
    no longer exist, so the configuration database fields containing this information
    will be out of date. If you are using that as part of your  selection criteria
    for delivering system updates, upgrades and so on, it will mean some machines
    are neglected.


    Part of asset management is, obviously, disposal. However, this is an area that
    can be very uncoordinated across the organisation and so it must be within the
    ISM’s vision to join together the various strands of requirements and provide
    a more holistic view of the life of an asset throughout its life cycle.


    For example, mobile devices (PDAs, phones, etc.) and laptops (notebooks, netbooks,
    etc.) may get reallocated from one user to another within a department locally.
    However, the IT department that initially released the configured item and noted
    it on the CMDB might not be notified. So the organisation may potentially end
    up with inadvertently exposed information assets by not following an appropriate
    data-wiping procedure as part of the transfer of assets process – probably because
    it never occurred to them that there would need to be any kind of process! This
    is why there are still instances of laptops and mobile phones being sold on e-Bay
    and the recipient finding organisational data still on there. Not only is it embarrassing,
    but it is a breach of the UK Data Protection Act and, therefore, counts as illegal
    behaviour by the data controller – the owner of the asset containing information
    that needed to be protected throughout its life cycle.


    Another risk that manifests itself in this space is that, given the opportunity
    to replace your ‘estate’, your users can be very creative in making claims as
    to how many assets they have or need to have available to them. Old PCs have an
    interesting habit of ending up reactivated! The users may not realise that this
    can create licensing issues and poor performance from old machines that have not
    been  appropriately updated and maintained along the pathway of regular IT management.
    But rest assured that teams have a capacity for stashing old equipment in their
    cupboards when they don’t know what the appropriate disposal process is (or choose
    not to pay attention), so they don’t tell ICT and the CMDB ends up less accurate
    or up to date than it should be.


    What about USB devices? These are mobile, too, don’t forget! Central control on
    ordering and delivering USB devices would allow for visibility of their usage.
    However, because the devices are so small and so portable, they are often not
    considered for such treatment. Users, historically, have had a great deal of free
    will with regard to the purchase or usage of these devices across the organisation.
    But they, too, need to be managed throughout their life cycle, particularly when
    you consider the nature of information often saved on to them and passed around
    and their capacity to be left lying around, lost in the back seat of taxis or
    left in suits for dry cleaning. The list of errors in this space is endless and
    depressing.


    The end-of-life process should also include servers. They need to be managed when
    they are being reassigned or repurposed, as do routers and switches. All equipment
    needs to be accounted for, in terms of both its identification on the asset management
    database and its compliance status in relation to an up-to-date operating system,
    software, connectivity, etc.


    So the ISM has a lot to pay attention to – keep thinking about that butterfly
    flapping its wings.


    Of the assets identified, how many servers are there?'
