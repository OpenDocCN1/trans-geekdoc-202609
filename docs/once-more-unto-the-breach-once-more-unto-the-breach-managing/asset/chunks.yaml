  raw: 'Here is a small further note on this, to reflect that it will come up again
    and again. You should consider the issue of service packs versus critical patches,
    as affected by the  nature of the system you are rolling out, or already have
    available to you through your IT provision – how do you make the decision as to
    the order in which these should be done and on what priority basis, when your
    landscape spans thousands of machines? There is a difference in how the network
    responds to the updates and how IT deals with machines that are struggling. Where
    possible, you want to have these updates running in the middle of the night –
    harder, obviously, if you are operating in an ‘always on’ environment. So, again
    it may be that you want to cluster your machines as per our physical layout example,
    and be able to deploy updates to specific sets on the basis of their priority
    and criticality to the organisation. Whichever way you choose to do it, be prepared
    to have to deal with fallout from even just one machine not working ‘the morning
    after’, as it can create a ripple effect, a chain reaction of bad press across
    a team that extends outwards, and that’s the last thing you want when you are
    on a programme of change – or at any time really.


    Back to physical security issues


    I have often wondered at the separations and silos we have built up in our organisations
    and our industries, and what useful purpose they really serve, apart from maintaining
    empires and egos. For the sake of the organisation in the future, co-ordination
    and collaboration are usually required. One of these fractures is between emergency
    planning and the need to ensure that business continuity plans are in place. It’s
    hard enough sorting out DR plans, but these need to relate to systems. Furthermore,
    the business continuity plans need to relate to the business processes that utilise
    those systems. There is plenty of separate literature  available on all this.
    The point made in the introduction is to get back to thinking about emergency
    planning in a certain way – all too often similar activities with shared risks
    are seen as very different. I visited an emergency planning room once and was
    surprised to see all of the emergency plans for each service area, with the folder
    titles visible (for ease of access). It was suggested, perhaps, that these could
    be moved into the new lockable cabinet that was available within the room, given
    that on a Thursday, Friday and Saturday night there were external third parties
    who occupied the room, carrying out night marshal activities, to whom these plans
    should not be so readily available. This had not occurred to the information custodians
    up to that point. Also, updates to the plans appeared to be difficult to manage,
    but they also contained a lot of personal data with home phone numbers and general
    contact details. So, the learning point of the visit of the ISM was that greater
    care needed to be afforded to this kind of material on a day-to-day basis.


    Another finding was that there were two users who found it necessary, as a perceived
    result of previous poor corporate system performance and server storage space,
    to utilise 8 GB external USB sticks as their file storage system. These were stored
