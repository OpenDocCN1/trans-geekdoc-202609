    \ up to date as they could be; it depends on how centralised or otherwise your\
    \ procurement processes may be. However, there are many spreadsheets being operated\
    \ locally that need to be taken into account. There are USB sticks that need to\
    \ be included; there are mobile devices that need to be considered; and there\
