    By now, most organisations should already have information security best practices
    implemented to some degree in the organisation. However, there are still many
    who have it buried in `IT` in such a way that the struggle to implement the necessary
    safeguards is an ongoing one, and new projects are set up to try and achieve compliance
    with external legislation, regulations, standards, contracts or government-led
    requirements that must be adhered to. In order to be truly effective, these initiatives
    require constant explanation as to why you need to be linked into various activities
    and other change-related projects that you may stumble upon along the way.


    The ISM role role also requires a level of listening. At this stage, in so many
    organisations, there have been many, many change programmes. This can lead to
    fatigue being experienced, so people can tend to be resistant to any further attempts
    at delivering on change programmes. Therefore, the best way to ease the forward
    momentum required is often to allow people a short period of time to get those
    issues that they feel are blocking progress at the present time off their chests.
    Early scheduling of introductory meetings helps to get this listening phase out
    of the way. The `ISM` cannot afford to be either a wallflower or a shrinking violet!
    You need to be out there, amongst the people, as it were! Once you have heard
    the issues you can usually implement solutions that you already had in mind, as
    the concerns are usually not difficult to address; or, indeed, you can frequently
    point out to people that there are already controls and safeguards in place that
    may not have been adequately explained thus far, but that are likely to be appropriate
    for providing protection.


    You have to show a certain level of commitment to delivering on the change in
    order for people to start to buy into the idea that things are going to be different.
    The `ISM` has to be seen to realise some quick wins as early as possible in the
    life cycle of the intended change programme. Actually, the `ISM` has to be seen
    to live and breathe security in all that they do, day in and day out: always wearing
    their employee (or equivalent) badge; always encrypting their data; always backing
    it up, etc. If you consider all the controls we ask our users to bear in mind
    on a daily basis, the `ISM` really must be seen to be doing them, and doing them
    well and with ease in order to prove that security need not be a hindrance and
    to evidence that it has both value and meaning. You also need to have almost a
    superpower of awareness – we will continue to delve into this in the forthcoming
    chapters.


    Given how much ‘transformation’ everyone has been going through for more than
    a decade now, it is always helpful to ensure that you have adequate background
    information on the organisation and its cultural make-up and challenges, including
    what’s worked before and what hasn’t in the realm of change management. You will
    need help in galvanising the resources, communicating the changes, etc., including
    from those folks in human resources, training, corporate communications, etc.
    You’ve got to make links and friends across the entire organisation, way beyond
    the expected `IT/ICT` restrictions.


    In larger organisations there are usually people responsible for the issuance
    of corporate policy, who also need to be positively engaged. If this is not the
    case, some level of governance review of policy must occur at your information
    security management forum (`ISMF`) meetings, which you should schedule on a regular
    basis. All updated documentation should be required to have some level of management
    sign-off prior to release into the operational environment.


    Writing policy in isolation from people will render it doomed to failure, so it
    is vital that this work is done in conjunction with people. You need to engage
    with those who are affected by the policy to ensure that it is practical and supported.
