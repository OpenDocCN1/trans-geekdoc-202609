    # PREFACE


    This book was first spawned from years of experience in the UK information security
    industry, both from being in the role of an information security manager and more
    recently a chief information security officer, and from observing many individuals
    adopting the role from a standing start, without making a deliberate career choice
    or realising that it would be part of their role. Let’s be honest, you don’t hear
    many (any?) teenagers planning to leave school to be an information security manager!
    The role is often ‘gifted’ (in the poisoned chalice sense!) to an individual on
    top of their existing, hugely busy, day job, because the person handing over the
    ‘gift’ does not understand the breadth of what is required. Therefore, the individual
    in receipt of the ‘gift’ is not afforded the time or respect required either to
    provide appropriate advice and guidance for the protection of information assets
    belonging to the organisation in question, nor to actively encourage colleagues
    to do likewise.


    The aim of this book is to provide a ‘coalface’ view of what tackling this role
    actually looks like in action, drawn from my own experience; having spent a year
    during my PhD studies taking on the role of information security manager for a
    UK public sector body, I quickly realised the benefit of keeping copious notes!
    In academic circles, this is known as carrying out ‘participant observation’ and
    was done as part of PhD research into embedding best-practice information assurance.
    The author observed a great many incidents, events and risks, and also participated
    in innovative solution creation in order to address all of these. The results
    of this study are worth putting together in this tome - almost every day brought
    with it a little gem which, if you were not ‘in tune’ with the wondrous breadth
    of information security, you might have missed, including the cause and the potential
    mitigation and ‘lessons-learned’ elements.


    This book is effectively written through the spectrum of the ‘project lessons
    learned’, which were harshly, but fairly, created after phase one of a long project.
    Given that this book is based on a real project that took place several years
    ago, the text is imbued with a great deal of hindsight. However, these lessons
    could no doubt have been written by many people in any organisation. Part of the
    author’s current research has been looking into the whys and wherefores of how
    organisations create lessons-learned logs, but do not actually learn the lessons
    well nor implement the required changes in practices. The work is appropriately
    anonymised.


