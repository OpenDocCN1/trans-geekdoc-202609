- fmt: "\nYou need to make sure you are closely aligned with the other compliance\
    \ functions in the organisation: data protection, freedom of information, risk,\
    \ ethics, legal, records management and information governance. These may be separate\
    \ or combined functional resources. If you are lucky, you will have some responsibility\
    \ in all these areas. While this can sound daunting, it is ultimately where the\
    \ profession is heading, as oversight of all the elements of information asset\
    \ protection provides the best chance of ensuring you can provide the required\
    \ amount of information assurance for all involved.\n\nExternal providers may\
    \ also be important to the delivery of a successful infrastructure security change\
    \ programme, e.g. kit providers, and recycling and destruction providers. We will\
    \ return to the latter, in particular, in `[Chapter 3](#11_ch03.xhtml#ct3)`.\n\
    \nThe corporate communications team is a really important strand in all this.\
    \ If you are lucky, it will be large enough to have marketing and communications\
    \ people amongst its number on a permanent basis and will be well used to structuring\
    \ messages (both good and bad) and understanding the kind of tone and delivery\
    \ that suits your organisation. You are going to be expecting a change in behaviour\
    \ from all your users (or at least that’s what you should be aiming for) and,\
    \ thus, you need to engage with them from a number of vantage points – i.e. what’s\
    \ worked in the past, what hasn’t and, thus, what might work in the future as\
    \ part of your communications roll-out. You need a theme, a strap line, a motto,\
    \ an avatar, etc. All these elements can make your programme of activity appear\
    \ more real, tangible and visible across the organisation. The users need to feel\
    \ that they are part of something. Belonging is a core human need in Maslow’s\
    \ Hierarchy (the middle layer) and is no less important for us security people\
    \ to be aware of.\n\n## There’s always a need for a ‘list’ (well, if it’s good\
    \ enough for Santa Claus!)\n\nThere are some key fundamentals that you also need\
    \ to have as ‘stock-in-trade’ information to hand, and this list grows over time,\
    \ the more interaction you have with your organisation. Here are some examples.\n\
