    # Statistics, metrics and measurements


    Statistics, metrics and measurements – call them what you will, but you really
    need to get your head around them in order to be able to provide management with
    something tangible, be it a list or a picture with a pie chart or graph. People
    need to see things either improving or not, with answers or explanations for the
    latter and options for returning to a state of improvement. As the ISO set about
    creating the numbering scheme for information security management, `ISO27000`,
    it allowed for a lot of supporting standards. So we now have `ISO/IEC 27004:2009
    Information Technology – Security Techniques – Information Security Management
    – Measurement`.


    There are also several existing maturity models that can be adapted to suit your
    needs. In the UK public sector, there is a more than adequate `IA` maturity model,
    which is supported by an `IA` assessment framework to help assess your progress
    towards achieving the required level of maturity. (Available at `[www.cesg.gov.uk/Pages/Search.aspx?k=Information%20Assurance%20Maturity%20Model](http://www.cesg.gov.uk/Pages/Search.aspx?k=Information%20Assurance%20Maturity%20Model)`.)


    Most maturity models adopt the phased approach of grading, from no implementation
    to embedded. In this case (`IAMM`), the gradings are as follows:


    * Level 1 – initial

    * Level 2 – established

    * Level 3 – business enabling

    * Level 4 – quantitatively managed

    * Level 5 – optimised.


    Adopting an accepted framework relevant to your industry helps to benchmark your
    starting point and provides a trajectory of expected progress. This is something
    well worth considering from as early on as is possible in your role. You then
    have a level of tangibility in your management reporting and can provide graphical
    or pictorial representation of the current status of information security in your
    organisation. Think of it as seeking to provide a ‘confidence count’ – how confident
    you are in the data that is being collected, the way in which it is currently
    being represented and the way in which it could be represented to better tell
    the story of information security implementation and its onward journey.


    # Managing a more security-aware user population


    The most applicable phrase here has to be ‘be careful what you wish for’. The
    more you heighten awareness, the more you are likely to garner responses and input
    from your user base. When you run regular information security awareness briefings,
    people feel more able to talk about issues of concern regarding information security
    and data protection.


    And now for a completely random user share!


    A concerned employee, after experiencing my open style of delivering an information
    security awareness briefing session, i.e. having her eyes opened, took me aside
    with a query. Following the sad and tragic loss of a baby, should the university
    have contacted her, researching how this made her feel, without reference to any
    data protection/privacy statement? All it did was bring the incident back to the
    fore for the poor individual and upset them all over again. Greater care and caution
    is required, as the legal phrase in question is ‘damage and distress’. When an
    individual is stood before you, querying whether this should ever have happened
    to them, you’re presented with a powerful example. But in terms of the bigger
    picture, they certainly learnt more about the legislative wrap-around that does
    exist and so they know that they have a recourse in the future.


    People also started to notice the little things when it came to system development,
    like passwords being displayed in a field.


    # CHAPTER 10: MAY - POLITICS AND MANAGEMENT


    ## Situational political awareness


    Wikipedia describes ‘situational awareness’ as:


    > The perception of environmental elements with respect to time/or space, the
    comprehension of their meaning, and the projection of their status after some
    variable has changed... It is also a field of study concerned with perception
    of the environment critical to decision-makers in complex, dynamic areas.


    In many ways, the construction of this book is about pulling together a lot of
    elements that are important to the ISM role because they help you to maintain
    your situational awareness. An understanding of the impact of politics is part
    of that jigsaw.


    This was the month of a change of government in the UK, which had a profound impact
    on the whole of the public sector ICT infrastructure and strategy planning for
    quite some time. While the arrival of the new government (Conservative–Liberal
    alliance) should have heralded momentum, it did not transpire that way, particularly
    because of the tremendous recession and economic turmoil that was having a lasting
    impact.


    ## Security awareness theme


    This month’s information security theme should usually be focusing on Easter,
    as it occurs at this time. You could run a campaign where you leave chocolates
    (mini eggs, for example!) on the desks of those users who are adhering to your
    clear-desk policy.


    ## Chapter summary


    This chapter has very much focused on a journey through the history of the various
    terms that populate the industry, to help the ISM understand their role. While
    it may feel like the end result is greater confusion, the chapter can be used
    for reference on an ongoing basis, depending on the needs that arise as your role
    grows and you become embedded in your organisation.


    Much like any other profession, there will be many who will disagree with the
    way these definitions have been represented, but the author would challenge their
    research and depth of reading.

