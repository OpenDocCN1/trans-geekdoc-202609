    As there were a number of key deliverables contained within the change programme,
    one of these – the delivery of a secure image on to all desktops – continued to
    be a challenge. The difficulties were very often not of our own making. For example,
    we ended up having to take off `JavaScript™` because the software from a third-party
    supplier was not able to work with it and it was creating conflicts with other
    applications. As previously mentioned, this was part of a bigger issue, as it
    was a well-known industry third-party supplier who had clearly not upgraded their
    software with patches and software updates provided by other key providers to
    address known vulnerabilities. So you end up having to downgrade your security
    to operate some of the most fundamental services using key corporate systems.


    This continues to be an unacceptable industry-based situation, which the third-party
    providers should be embarrassed into changing – and not at the great expense of,
    in particular, the public purse, which they have already plundered with hefty
    ongoing maintenance charges for many years.


    With the reality that about 300 public sector organisations using the same software,
    the cost for upgrading should be on the vendor and not each individual public
    sector organisation separately. Central government procurement – and those involved
    in mandating centralised delivery of systems – should be making these kinds of
    pleas and ensuring these changes in the future, as part of the intended savings
    and improvements anticipated by the UK Conservative and Liberal Democrat government
    coalition.


    In January 2013, the National Audit Office (NAO) confirmed that the government
    initiatives to reduce spending on ICT were starting to gain traction. 2013 and
    2014 saw a significant programme to reduce the usage of private sector organisations
    and consolidate suppliers, and asked all of them to reduce their costs for service
    provision by significant percentages throughout the period. It is feared, however,
    that this will come at the expense of genuine security.


    The public sector must get tougher in renegotiating contracts and demand better
    security for its citizens, whose data they are using, sharing, transferring and
    processing, all day, every day, and which is being stored and housed in these
    flaky systems across our land.


    ## Physical security findings


    There are many aspects of physical security that need to be understood by the
    ISM and not just assumed to be within the control of facilities management (or
    whatever your equivalent is).


    In many cases, you will find that not all of your sites (buildings, locations)
    have locked cabinets where cables are sited. So, these need to be physically visited
    and secured in order to maintain that outward display of ‘security in action’.


    ![](Images/P102_01.jpg)


    Figure 2: Unlocked cable cabinets


    The kind of thing shown in `[Figure 2](#13_ch05.xhtml#fg2)` was discovered by
    conducting physical security reviews of teams, sections or departments, usually
    at the request of their management, in the early evening, when the cleaners were
    around. Cleaners are usually very helpful. Part of their process may be to lock
    doors to all the rooms that they have keys to, but if there are no keys this is
    obviously impossible. Doing these physical walk-arounds, doors were frequently
    found open that should have been locked. This exposed other weaknesses, because
    they provided extra access as a result of conjoined rooms, and especially when
    internal doors that joined several offices together were not secured. Wherever
    possible, I carry out these reviews in a pair so that one person can make notes
    and the other can take pictures. The visual evidence is the most powerful tool
    you can imagine for showing users and management the error of their ways. It is
    the information security equivalent of holding up the mirror, so that they can
    see what’s wrong, and by implication work out what needs to be changed in order
    to effect a security improvement. This is tangible and gives you instant quick
    wins in terms of improved information asset protection, the importance of which
    cannot be overstated. All the effort in the world at protecting network security
    – server scanning, etc. – cannot reduce the risk of someone leaving something
    they should not have done on their desk for someone else to see, photograph or
    steal.


    With the availability of camera phones these days, anyone with their eye on making
    a ‘fast buck’ could easily penetrate your organisation through physical security
    vulnerabilities and then either sit down and have a good long read, or take photos
    and send them off to the local, or even national, press and make quite a splash.


    If people had to value the information assets they handled on the daily basis,
    like they do currency, then they might end up better protected. But the items
    are so easy to discard that it becomes more difficult to encourage consistent
    protective behaviour. Information labeling and handling can help in this area
    – ensuring that markings are given to the information assets being used, stored,
    handled, shared, processed, transferred, etc.


    There are a great many files that should be marked as ‘restricted’ and kept permanently
    under lock and key – and the keys need to be registered and controlled, not left
    out on display. But this will take a significant culture change and education
    effort.


    So, we need to start with personal responsibility – people really need to take
    on board that they need to be actively participating in protecting and caring
    for these files. This means locking them away at night and then secreting the
    keys appropriately. It means keeping their rooms neat and tidy and not allowing
    stacks of cardboard to pile up, nor prioritising stacking newspapers over stacking
    files.


    In the majority of cases, keys were left in most cupboards, drawers, etc. – and
    on one occasion it was even possible to locate the ‘stash’ of all the keys to
    all the doors in a drawer in a unit, and another stash on top of a cupboard in
    a corridor.


    Why is it that there is always ‘kit’ left around? In any office you go into, rest
    assured you will find old equipment that is unused – perhaps a telephone or two
    that need to be decommissioned and a printer. There are proper recycling companies
    for electronic waste in operation these days that can make the task of kit removal
    so much easier that there is really no excuse for clutter.


    Consider, also, the age of the information that may be readily available. Papers
    are usually left around that are older than the ‘current year’. Given that most
    organisations should be operating a proper RM programme with a records retention
    schedule in place, having documents lying around that are outside their immediate
    period of use is inappropriate, as these should be in the archives or destroyed.
    The ISM needs to work closely with their records manager – if such a role exists.
    If it doesn’t exist then the ISM needs to take this on as part of their functionality,
    in order to provide the appropriate breadth of protection to information assets
    for their organisation.


    Part of your task is to try and get into the mind of your colleagues to help you
    explain why you think what they are doing is wrong. I have seen some interesting
    prioritations in my time – a neat stack of newspapers on a shelf inside a cupboard
    near a door, and yet there were files out on both the desk and the shelves (all
    identifying individuals). People usually claim a lack of space, and yet the picture
    in `[Figure 3](#13_ch05.xhtml#fg3)` shows just how much shelf space was available.


    ![](Images/P106_01.jpg)


    Figure 3: Virtually empty cupboard


    Some people seem to think it is appropriate to leave their filing on the floor
    when they run out of space. Why would that ever be considered appropriate? Each
    office needs a dedicated person who does a ‘sweep’ every evening to watch out
    for these information traps.

