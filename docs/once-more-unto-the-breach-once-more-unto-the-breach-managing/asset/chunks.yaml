    great to actually analyse with any degree of value. However, in some cases, system
    owners do not know whether they are being maintained or whether anything of value
    is being generated. This has to be another area for the ISM to get their teeth
    into.


    There are many levels of audit log to be tracked and some level of prioritisation
    is probably worthwhile. Start with the systems that contain the most sensitive
    information assets and seek to provide the best protection for them first. Thereafter,
    target those systems that have logs that provide management with data that helps
    focus resources – system log ins, failed attempts, intrusion prevention systems
    (IPSs), intrusion detection systems (IDSs), firewalls, routers and switches. There
    is a wealth of data to be gathered and analysed in order to get a true picture
    of your day-to-day levels of vulnerability and needs for patch management, updating
    and maintenance.


    Vulnerability management


    Managing the running of vulnerability scans is a vital part of any ongoing ISM
    role and it is alarming to read vulnerability reports from external providers
    where the results are so often the same:


    • SANS top 10 or top 20 vulnerabilities identified (therefore, known vulnerabilities
    are not being addressed with known solutions).


    • Defence in depth helps, but needs to be maintained – there is still a problem
    if firewalls and reverse proxy units functioning as expected, but those managing
    them are not feeling supported internally. There is not always time to ensure
    the firewalls and reverse proxy units are maintained appropriately – both technically
    and also in terms of the skill sets required of those responsible for managing
    the machines. This is an important point for an ISM to be aware of in order to
    help influence either budget spend or resource planning for future training needs
    analysis, as these areas relate to those in system admin positions for security-related
    tools and technologies.


    We will return to this issue in *[Chapter 6](#14_ch06.xhtml#ct6)*.


    Cloud computing


    There is a problem that arises as you become part of a wider connected network:
    if any part of your own internal infrastructure, or remote locations and users,
    are not following the necessary security protocols and controls that you have
    sought to implement in order to secure information assets appropriately, then
    it may be that you, yourself, are considered to be a vulnerability. Such  architecture
    vulnerabilities need to be identified on an ongoing basis, with plans in place
    to rectify, modify, deter, react and protect the information assets in your care.


    Such Cloud implications are now more fully understood, and the ramifications of
    the constant and persistent interconnectedness we are all facing will continue
    to, work themselves out over time. We can but hope that it is not at the expense
    of users, citizens or their personal data, although the first signs of impact
    were seen in 2014 with events like the loss of celebrities’ personal information
    from the iCloud. Ultimately, the Cloud is still hardware in a data centre somewhere
    – there is *still* a physical element to the technological landscape and it *still*
    requires securing, end-to-end. In fact, the Cloud requires far greater investment
    in and maintenance of security than traditional IT, so it is hard to see how the
    financial savings model actually stacks up.


    Project management


    When it comes to managing a large infrastructure-related project, where a great
    deal of investment is required due to consistent lack of spend over an extended
    period of years, plural, the ISM is often faced with a constant need to justify
    the requirements. This is, in itself, distracting from the day job of actually
    making the required changes. Frankly, playing politics in an organisation can
    be utterly tedious. However, there are times when it is a necessary evil that
    must be embraced! Too often, the cry goes up that ‘IT doesn’t understand the business’,
    and you, as the ISM, don’t want to be tarred with this same brush.


    If you lack management support or understanding, taking the battle outside your
    immediate arena may be required. You need to find the right audiences and language
    to achieve the hoped-for aims. Always provide options, and in many ways, seek
    to embed the one you want in amongst options that you know your audience will
    never approve! Make sure that you learn what works in terms of management speak,
    too.


    Benchmarking against other peers is helpful in order to provide management with
    reassurance as to your actions. Become a member of any regional groups, so that
    you can discuss issues, threats, vulnerabilities, experiences, risks, etc. with
    your peers. This helps to keep you up to date, informed and able to converse with
    certainty in terms of expectation amongst industry counterparts.


    Security awareness theme


    Each month, consider focusing on a subject suitable for the time of the year and
    harnessing your information security endeavours to that. It helps to keep the
    subject at the forefront of everyone’s considerations and ensures that you are
    baking information security into your organisational cake, embedding it into best
    practice and slowly, but surely, changing the culture for the better.


    Always use whatever news stories have appeared during the month. There is no shortage
    of these, day in and day out, that should be crossing your desk as the ISM - but
    they may not even register for the average user. In fact, there are many stories
    that appear in the news that involve information security but are not deliberately
    presented in this light by the media. But you can find the security  element –
    be it a personnel issue, a physical security issue, a technical security issue
    or an information-specific security issue. Let your creative juices flow!


    This month’s information security theme could pick up on the fact that October
    ends with Halloween, a holiday celebrated around the world. Given the volume of
    malware, spyware and spooky tales to tell in the world of security, there’s enough
    to hang your ISM hat on, if you are creative enough!


    Chapter summary


    This chapter dealt with a number of standard subject areas that will be part of
    the ISM activities on a day-to-day basis. It also introduced the idea of creating
    security awareness themes for each month, so that you are making the subject live
    and breathe throughout the organisation on a monthly and changing basis to ensure
    that the messaging does not get stale.


    CHAPTER 4: NOVEMBER - HOW REMOTE IS REMOTE?


    Introduction


    There are times in your career as an ISM when you really have to put your hand
    up and say, ‘hold on a moment’, and ask yourself where sanity and sense have gone!


    We can all too easily make things far too complicated. The answers we are seeking
    are often so simple that they are not what we first consider; nor are they easy
    to believe because of their simplicity.


    Location, location, location


    If you set yourself up with a particular network segmentation approach, it may
    label a significant amount of users as ‘remote’, and this will mean needing to
    apply two-factor authentication to them all as part of best-practice security
    management controls. Managing every user outside your core location as a ‘remote
    user’ is a significant overhead and should be avoided wherever possible. Incorporate
    all users into the whole network view, so that all users are treated as ‘one’,
    without the need for the added overheads of managing the distribution of key fobs.
    This will reduce their enablement, management and replacement, and prevent headaches
    for all users.'
