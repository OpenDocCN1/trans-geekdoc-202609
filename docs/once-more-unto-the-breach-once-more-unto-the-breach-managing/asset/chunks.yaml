    \ of the users.  \n\nThere are also links with green IT work, because just adding\
    \ another server into your farm should not be the answer every time. || Data cleansing\
    \ is required – particularly when migrating to new systems. It is better to cleanse\
    \ than to take erroneous data with you. There are links here with file management,\
    \ and training in it is required.  \n\nImplementation of a proper RM file plan\
    \ structure on the servers is required (it is appreciated that this is easier\
    \ said than done!)  \n\nUsers must be encouraged to take more responsibility for\
    \ the data that they are, let.s face it, creating on a day-to-day basis. |\n\n\
    | Lack of role profiles || User access rights are currently not adequately managed\
    \ and this needs to be addressed, so that groups of users can be migrated together\
    \ in the future on the basis of their expected access rights, permissions, mappings,\
    \ etc. || Less user disruption is possible if the role profile exercise has been\
    \ undertaken - to identify who is doing what function, where, and what system\
    \ access they require to do that job, on the basis of applying the ‘need to know’\
    \ principle. |\n\n| Lack of service desk management commitment || There was a\
    \ need to ‘pump’ out messages to the users across the whole organisation, saying\
    \ that the service desk would be experiencing an increase in call volume as a\
    \ result of a specific project workload and to be patient. This was difficult\
    \ to achieve without the proper involvement of representation from the service\
    \ desk itself. || Ensure that a) the service desk is appropriately staffed to\
    \ deal with project ebb and flow, and b) that you communicate with users en masse,\
    \ so that they are aware that while they may be ‘screaming’ for resolution, there\
    \ may, in fact, be an operational priority that exceeds their own immediate needs.\
    \ |"
