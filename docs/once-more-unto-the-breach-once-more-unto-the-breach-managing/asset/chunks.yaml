    Directory, as anything else required phased changes that involved a lot more effort
    and management for both users and ICT staff.


    This required communication across several areas:


    • ICT help desk – to ensure that they were ready (in terms of staffing and knowledge)
    for an increase in call volumes on the day of the password change.


    • ICT systems teams – to ensure that all system administrators and database administrators
    were ready to change the passwords on the systems for which they were responsible
    and, more particularly, to ensure that the systems themselves could handle the
