  raw: 'Central to IG is an understanding of the journey from IT security, through
    information security, to IA – all of which are about maturing to a position of
    being able to demonstrate justified confidence in security measures, processes
    and practices in the management of information. While IA has been seen to be the
    growth area in recent years, maturing out of information security, the ultimate
    goal must be to embed a full IG framework across all organisations in order to
    fully include the total breadth of information-related legislation, regulation,
    standards, policies, procedures, technology and people issues that need to be
    managed, handled and protected in today’s cyber-dominated environment.


    Consider, if you will, the ‘11 Cs’ of IG.


    *Eleven Cs of IG:*


    1 centralisation


    2 communication


    3 (legislative) compliance


    4 confidence


    5 confidentiality (integrity, availability)


    6 conformance


    7 consistency


    8 content


    9 continuity


    10 (security) controls


    11 corporate records management.


    (And now for something completely different…! For those of a spiritual nature,
    apparently the number 11 possesses the qualities of intuition, patience, honesty,
    sensitivity, and spirituality, and is idealistic. People turn to those who have
    these ‘11’ qualities for teaching and inspiration, and are usually uplifted by
    the experience. Not for nothing, nor randomly, are these things chosen!)


    Your aim as an ISM should be to seek a deeper understanding of IG and the principles
    for good information management and handling, enabling technologies and current
    best practices and, at the same time, to gain a broad appreciation of the many
    facets of the information at the heart of all that you will encounter.


