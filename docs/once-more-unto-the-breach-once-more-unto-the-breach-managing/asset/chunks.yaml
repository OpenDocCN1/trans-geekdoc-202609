    from your user base. When you run regular information security awareness briefings,
    people feel more able to talk about issues of concern regarding information security
    and data protection.


    And now for a completely random user share!


    A concerned employee, after experiencing my open style of delivering an information
    security awareness briefing session, i.e. having her eyes opened, took me aside
    with a query. Following the sad and tragic loss of a baby, should the university
    have contacted her, researching how this made her feel, without reference to any
    data protection/privacy statement? All it did was bring the incident back to the
    fore for the poor individual and upset them all over again. Greater care and caution
    is required, as the legal phrase in question is ‘damage and distress’. When an
    individual is stood before you, querying whether this should ever have happened
    to them, you’re presented with a powerful example. But in terms of the bigger
