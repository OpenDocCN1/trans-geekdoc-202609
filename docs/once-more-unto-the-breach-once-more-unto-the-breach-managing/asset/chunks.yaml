    The project team working on the desktop refresh were trying to keep certain types
    of machine in single locations – i.e. all `Dells` in one, all `HP` in another,
    etc. – in order to ensure a level of ease of maintenance on sites. If an engineer
    turned up at one building, they would know what type of machine they would be
    facing throughout and the likely issues it would have, and would be able to resolve
    these faster than if there were a number of different machine types that would
    have complicated varieties of conflicts, system faults and failures. This, equally,
    made it easier to apply patches and updates across the network to blocks of machines
    at a time, rather than necessarily to the whole estate in one move. The more you
    can control the delivery of changes, the easier it is to manage any glitches that
    arise along the way.


    On top of this, there is likely to be a quantity of old pieces of equipment out
    there, languishing in cupboards, storage areas and old filing cabinets across
    your geographical outreach, you need to actively encourage people to hunt these
    out and feel that they can turn them in, with impunity – ensuring that they are
    appropriately disposed of or recirculated in line with your infrastructure strategy.


    As a final note on this area, it is helpful to encourage people to bring in their
    old PCs from home, to be either refurbished or recycled in an appropriately secure
    and environmentally friendly way. At first reading, this sounds like an expensive
    (or mad!) undertaking, but it will pay dividends in the long run. You have to
    consider that it is likely that many of your users have actually used their own
    home machines to do your organisational work, reviewing reports, editing them,
    forwarding them on… There may be all sorts of information, sensitive, personal
    or otherwise, stored on that home PC, over many years of service. Taking control
    of the disposal of equipment is a risk reduction mechanism, appropriate in the
    current working environment where the Information Commissioner is expecting you
    to have both visibility and knowledge of the whereabouts of all of your organisational
    information assets, at all times throughout their life cycle.


    # Other security tasks for this month


    ### Job descriptions


    In `[Chapter 1](#09_ch01.xhtml#ct1)`, I mentioned that you needed to provide a
    framework to effectively manage employees before, during and after their time
    with your organisation. Part of this activity is ensuring that security roles
    and responsibilities are allocated and tasks are referenced on job descriptions.
    It is also worth implementing a personal information security plan to be linked
    with their annual personal development plans. This would be a plan of skills,
    training and development that they would commit to undertaking to improve their
    understanding or their performance on behalf of the organisation and ensure that
    they are doing all they can to protect the information assets in their care. It
    stems from getting the users – all users, from the CEO down – to understand that
    they are the ones creating the information assets that need to be managed, stored,
    transmitted, shared, and kept safe. ICT is only ever a custodian of the information
    – it is not the owner. So the user population needs to understand the importance
    of its role - ensuring it is tied to their annual performance and appraisal tends
    to focus the mind. It is even better if it can be linked to the actual financial
    element of it!


    ### Users’ understanding


    Remember that while we assume that our users must know a lot about technology
    these days, because it is all around us, what they in fact know is their consumer-related
    experience of it rather than any level of ‘under-the-bonnet’, hands-on experience.
    So over the years many users have been sat in front of a computer and told to
    get on with it, with little or no training provided for them. They have had to
    muddle along and, if they have come unstuck, prevail upon their colleagues for
    assistance. But you can see the flaw in that kind of approach. If their colleagues
    have had the same training pattern – i.e. none! – they have a very loose grasp
    on the benefits of the systems they are sat in front of. It can be surprising
    to learn what they genuinely don’t know! So another string to the ISM bow is being
    able to provide a safe environment - for example, an information security awareness
    briefing - in which those attending know that they can share their concerns and
    their limitations in the hope that you can help to provide them with a route through
    to a solution.


    There are lots of users that do not know what a `.pst` file is, nor how to look
    for it. (Just in case, it’s what Microsoft calls your `post` file for all your
    `mail`). In many cases, they never even thought to ask. They only ever appreciate
    the significance of this information once they lose their mail – and are grateful
    for learning it, both at work and to help them in being better home users, too.
    So it is worth explaining a bit more to them up front – the benefits will become
    clear as time goes by.


    ### People management


    If you are on a long programme of change, you need to be able to continue to motivate
    your colleagues when they return from holiday or absence, so that they continue
    to do a job that, by now, may appear boring. For example, the tasks may be across
    a significant number of machines for upgrade, replacement, repair and restore;
    or a large server farm that needs a lot of tender loving care on the patching
    side. There are a great many tedious tasks in the ‘engine room’, that’s an apt
    metaphor, as these systems really are the engine that keeps the rest of the organisation
    motoring. You need all your colleagues – both technical and otherwise – to appreciate
    these bare facts and step up their game accordingly.


    ### Security awareness theme


    This month’s information security theme could pick up on the fact that January
    is usually a time for New Year’s resolutions. For example, ‘So what’s yours …?
    Ours is to always update our antivirus …’ or ‘New Year, new attitude … let’s lock
    down those devices!’ However trite these may seem, the user population will have
    some appreciation for the mix of irony and humour, and at least will see that
    there is a theme and a messaging effort going on.


    ### Chapter summary


    This chapter really started to share the breadth of the scope of activities that
    can be expected of an ISM in any given month, not of which are technologically
    based – nor should they be expected to be. The clue is in the title!


    The next few chapters embed this broad-brush view of the ISM role with a myriad
    of tasks that all need to be undertaken. They also reinforce that you must understand
    what the purpose and intent of your organisation in its totality is, so that you
    can provide better advice for the safe and secure use of its information assets
    and resources.


    # CHAPTER 7: FEBRUARY - MONEY DOES buy happiness


    ## Divide and conquer?


    As an ISM, you can see by now that you have to consider yourself to be some kind
    of plate spinner – with a number of different sub-projects going on at any time.
    This may have been done to serve the needs of management, rather than for anything
    designed by you. So the end result could be that nobody knows what’s going on!


    However, there is always a concern that your large project is like an elephant
    that cannot be eaten all at once. Therefore, breaking it down into a number of
    sub-projects is a good tactic as this will focus each team on specific tasks,
    rather than spreading them too thinly across the project. We were encouraged to
    break it down into the following:


    • Port control/removable media –data loss prevention technology, also referred
    to as robust endpoint security, was installed at the ports in order to ensure
    greater visibility of the devices being connected to the network and to ensure
    that these were managed appropriately, in particular through scanning all connected
    devices.

