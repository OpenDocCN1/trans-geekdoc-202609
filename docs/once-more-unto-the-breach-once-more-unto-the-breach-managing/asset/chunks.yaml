    \ and did the ‘minimum’ to gain connection to a secure network infrastructure.\
    \ This left ICT workers overstretched, stressed and behind on their normal day\
    \ jobs. It left users bewildered by the scale of change to their desktop/working\
    \ environment and frustrated by the number of niggles that needed to be ironed\
    \ out through the process of change. A number of the niggles were as a result\
    \ of mistakes made by the overworked ICT project team members, compounded by a\
    \ rudderless systems team and servers that had suffered appalling neglect over\
    \ an extensive period of time (plural years). || If a project looks too difficult\
