    A great deal of the intended focus was on transparency and the ‘right to government
    data’ which turned into the UK’s effort at ‘big data’ and ‘raw data’, as well
    as the publication of all local government spending over £500 and the publishing
    online of all government tender documents, etc. All of this had huge implications
    for the IT engine room of organisations involved in such work, as well as for
    the InfoSec-related controls and safeguards that had been building up over time.
    As the intention was to publish a large swathe of information that had hitherto
    been under wraps, risk assessments would be needed to judge the impact and to
    address issues of data quality, integrity, accuracy and presentation. This was
    the start of a mammoth undertaking for all concerned. While entirely worthy as
    a public sector goal, it was not without its overheads and represented a significant
    distraction from what was already a full workload with depleting resources.


    # Language and management challenges


    It can often be the case that managers appear not to be paying attention because
    their perception is that security is getting in the way. Information security
    is accused of stifling innovation. This is an unfair representation of the reality
    when you take an objective look at the situation.


    Failure to consider the time and motion costs of stopping projects, clawing back
    money and then reigniting the work at a later stage are costing organisations
    (the public sector, in particular) dearly. Capitalisation of the funding for projects
    is also the wrong view, as ICT can then find itself running out of funding for
    its own department. This can be a risky strategy, given the need for ICT to be
    the firm and secure bedrock upon which the organisation is founded.


    There are obviously time and cost considerations when implementing all the latest
    technologies. Just because one lone powerful enthusiast in your ICT department
    is allowed to do so – without engaging the business or fully understanding or
    appreciating the business processes that the technologies were seeking to support,
    nor risk-assessing the impacts, threats and vulnerabilities – does not make it
    right or wise. You need to watch out for this.


    ‘I don’t understand what’s involved in hardening a server’, said the individual
    ultimately responsible for the relevant ICT function. On one hand, this was a
    very honest admission, but on the other was an appalling reality. But it is probably
    very likely the case, many times over in many organisations, as security continues
    to be so little understood by the ICT profession. However, as none of the staff
    underneath the individual had the skills to ‘manage upwards’, nor were they motivated
    to go away and find out more about the challenges, this key issue was left constantly
    floundering.


    Several staff attended a security certification course and thereafter understood
    that a key phrase to use was ‘does the business accept the risk?’ But while they
    were happy ‘throwing it out there’, there was no mechanism to find out whether
    or not the business did or did not accept the risk – or even understand it.


    ‘Why am I doing licensing?’ asked the person whose responsibility it was, even
    though they knew they were the only one with the appropriate software licensing
    qualification (`FAST`). You need to check your licences, as you could be spending
    money on licences for products that the users will never need or have no training
    for and, thus, will never use. Either way, there are cost implications.


    A senior director left in a hurry and those underneath were then left with little
    or no faith in the continuity of the change programme, its sustainability or financial
    support. Consultants were being brought in at director level and were blocking
    progress because they were new and frequently needed to find out everything from
    scratch. This is a constant and classic organisational problem, where skills and
    knowledge disappear out of the organisation and someone is always left needing
    to play catch up. It is a costly and foolhardy practice, ultimately. The everyday
    worker bees end up stuck and unable to progress, while witnessing director-level
    departures on ‘fat cat’ bonuses and pensions. It is very destabilising and creates
    depressed employees.


    Also, due to the language and management challenges people end up avoiding decisions
    so that they do not get blamed for others’ mistakes; more paralysis ensues.


    # Other security tasks for this month


    ## Inventory management (yet again)


    Users are now coming forward with all sorts of technology options that they use
    on a daily basis, and querying the security of these. So what about the use of
    headphones and privacy filter screens? Who should use these and what, if any,
    are the disability and accessibility issues versus the security issues they seek
    to resolve? The answers are whatever you decide they need to be for your organisation,
    your users and the nature of the information being used.


    What about mobile devices with unencrypted onboard memory? These were mobile devices
    with only the `SD` cards encrypted, being used by mobile workers doing surveys.
    They needed to be advised to ensure that they closed out of the survey using the
    `SD`. For each asset item, you can see the need to have it listed on the inventory,
    and to have some kind of reference column identifying the appropriate security
    control to secure the information that the asset is used to process.


    As an aside on inventory management – watch out for the wily user. One most interesting
    help desk call we received was a claim for a new PC, using the ‘excuse’ that the
    PAT testing had failed.


    ## Ongoing laptop management issues


    As a result of a decentralised purchasing process, it was not possible to control
    those devices that were out with the departments, sections and teams. There was
    also a stockpile of laptops too old to put into into the. This was unfortunate,
    but proved to be a ‘lessons-learnt’ point in itself, particularly given the increasing
    attention being paid to laptop control by regulators and the media.


    Homeworkers need to appreciate that if they have a laptop in their own home, no
    matter what they use it for, it will still be identifiable as belonging to a particular
    organisation if it has an asset tag, and it is that organisation that will end
    up in the news – even if the device is encrypted.


    ## Port control


    The background to the requirement to manage ports is well known by now. Under
    UK data protection legislation, data controllers have a responsibility to ensure
    that all reasonable steps are taken to mitigate the potential for data loss or
    breach of security. The seventh principle in the UK Data Protection Act requires
    an organisation, as data controller, to implement appropriate “technical and organisational”
    measures to keep personal data safe. Failure to do so exposes the organisation
    to the risk of fines, which can be up to £500,000. People constantly plug personal
    storage devices into their work PCs to upload music and wallpaper images, or transmit
    digital photos over the Internet. Their intent may be innocent. The capability
    to also siphon off corporate data from an endpoint, through a `USB` port on to
    a portable storage device, may place your organisation at considerable risk of
    undetected data leaks and exposure to malicious files. In this particular case,
    with the experience of the Conficker outbreak across the network, it turned out
    that the threat vector was considered to be unencrypted `USB` devices. Hence significant
    focus was needed on addressing this particular organisational vulnerability.

