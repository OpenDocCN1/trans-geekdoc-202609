- fmt: '

    Another user never connected their laptop to the network as they only used it
    at home. They transferred data to an encrypted `USB` from their work PC and then
    worked on the laptop at home. Obviously, they did not realise that this rendered
    the laptop potentially exposed, as it was never having its antivirus updated or
    patches applied.


    One particular team was taking photos of what they did and putting them on a laptop,
    which was neither password protected nor kept in a locked cupboard.


    One user was transferring 16,000 records on a laptop to `CDs` when they were all
    stolen, laptop and `CDs`, from the user’s house. This was equivalent to a similar
    incident by an equivalent organisation that received a significant fine by the
    regulator, but in this case the user was contracted by an independent third-party
    provider. Who takes the hit?


    ## Spreadsheets and attachments


    Many teams still use spreadsheet and Word attachments in e-mails, as opposed to
    inputting data into the available corporate systems. Thus, there is a risk of
    data loss as these e-mails` fly around, both inside the safe and secure corporate
    system and outside it. This is happening every day in most organisations, but
    it doesn’t mean that the underlying issues don’t need to be resolved. People need
    to be encouraged to share hyperlinks, rather than e-mailing attachments. Part
    of the larger task is keeping some kind of time line for the number of available
    corporate systems and their level of usage, compared to the level of sensitivity
    of the information contained therein. If data is being ‘lifted’ out in order to
    put it into a more usable format to suit the user, this is causing greater risk
    - therefore, data loss prevention mechanisms need to be considered.


    ## Postal failures


    An original agreement was sent to the wrong person, in the wrong organisation.
    They were asked to send it back by post, but it went missing. Now, what do you
    do? To whom should the breach be reported, if at all? These small incidents are
    occurring all the time and your radar needs to be alive to them. Depending on
    the prevailing circumstances you will be able to come up with an appropriate solution,
    but be prepared to be a focus for those concerned as they try and work through
    their own panic at being caught like a bunny in the headlights.


    And yet a postal guide was produced that made no reference to protective marking
    or handling of volume data. Again, this is a classic example of people thinking
    only in a silo, isolated from understanding the need to engage the `ISM` in all
    cases of activity relating to information assets – usually the change can only
    begin when people accept and understand what an information asset is.


    ## Printing problems


    Printer servers were not set up properly as file and print servers and old printers
    were not properly removed or decommissioned. This is another one of those ‘things
    to remember’, as it can cause havoc for users when selecting default printers
    and trying to maintain their usual work patterns and productivity.


    ## Removable media management


    Mixed communication messages were being received across departments. One team
    was told that their department could not afford encrypted `USB` sticks, so they
    resorted to buying them from a shop. Other users were backing up data on to a
    portable hard drive purchased similarly, which was also not encrypted. The portable
    hard drive was being taken home and the data then used for remote working. If,
    at any point, it had been lost or stolen, this would have been an embarrassing
    data breach for the organisation. The larger your organisation is, the harder
    it is to get the right message to everyone at the same time, unless you have a
    mandate to do so. But these kinds of incident really illustrate the need to get
    permission to send the message as quickly as is humanly possible.


    Incidents and frustrations are arising everywhere. A third-party integration provider
    spent two years trying to get a server to be switched off because it was allowing
    spam through its appropriate protection software. The software could see it, but
    the server was erroneously configured, out of date and out of band. Sadly, committee
    meeting after committee meeting took place with no progress being made. All the
    while, the organisation was at risk.


    ## Access control issues


    There were users in the organisation with full system access through remote connectivity
    and, therefore, the ability to copy everything to their home PCs. At times like
    this, your natural instinct is to despair! The ability to retain and maintain
    control can be extremely limited, given what the regulators expect, if we are
    honest.


    ## Password management anomalies


    Passwords appeared visible, in the clear, when logging into the organisation intranet
    and the 90-day password reset was not working. The users had been so well prepared
    for the full password reset roll-out that they were had heightened awareness of
    these kinds of anomalies, which arose as a result of outlying departments not
    always being captured by system changes. This was definitely something for the
    `ISM` to keep putting pressure on IT colleagues to keep abreast of.


    ## Physical security conundrums


    An individual attended a security awareness briefing then went back to their desk,
    left their phone plugged in and charging, their wallet on the desk, and dashed
    out. They came back for their keys, but still left all these other personal belongings.
    Oh, the irony!


    (ISM solution – have a toolkit, in which you have available, amongst many other
    things, a set of postcards that you can use to leave on people’s desks when they
    do silly things like this!)


    In this particular case, the team were working in a building where the doors were
    not locked until 6:30 pm. People closed the blinds, but left keys in the cabinets
    and in the key cabinet, and a lot of paperwork and items on desks. There were
    also roller cabinets that could not be locked.


    Guests were not chaperoned out after meetings, and yet it was possible to walk
    past a number of unlocked screens and see organisational and citizen-sensitive
    information on display.


    These kinds of things can be reported back in the same way as our findings in
    [Chapter 2](#10_ch02.xhtml#ct2).


    All of this is going on, and yet there are still people who believe that information
    security is not relevant to them, or that it does not warrant a full-time employee
    in the role!


    ## Security awareness theme


    Start considering messages around a holiday theme. Users go away for their two-week
    break from June onwards and they return revived and refreshed, but having wiped
    their mind clean of all things to do with work. They’ve ‘lost’ the synapse that
    contains their password, too! If the 90-day password reset occurs while they are
    away, and they miss it, that’s even worse! Remember to prepare your help desk
    for an increase in reset calls in the coming months, too.


    ## Chapter summary


    This chapter focused on two particular areas that, put together, provide a time
    line of understanding how things come unstuck. Internal and external audit reports
    will always be available in any organisation. These are a gold-dust resource for
    the `ISM` to trawl through and see what the recurring themes have been over time,
    and whether improvements have been embedded. If not, research the barriers and
    help come up with workable solutions through the security improvement programme.


    It is appreciated that it may just be, sadly, that the culture of the organisation
    will render it ultimately impossible to achieve sweeping change, ‘slowly, slowly,
    catchy monkey’, as one particular saying goes. But it is still possible to make
    some change and achieve improved information security from the bottom up, if doing
    so from the top down is proving unsuccessful.


    ## CHAPTER 12: JULY - JOURNEY’S END… AND CONCLUSION


    Returning to the lessons learnt

    '
