    The ITG website (`www.itgovernance.co.uk`) is the international one-stop-shop
    for corporate and IT governance information, advice, guidance, books, tools, training
    and consultancy. On the website you will find the following page related to the
    subject matter of this book:


    `www.itgovernance.co.uk/iso27001.aspx`.


    # Publishing Services


    IT Governance Publishing (ITGP) is the world’s leading IT-GRC publishing imprint
    that is wholly owned by IT Governance Ltd.


