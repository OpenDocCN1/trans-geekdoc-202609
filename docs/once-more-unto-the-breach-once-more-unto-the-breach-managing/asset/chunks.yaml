    – compliance with all policies, procedures and guidelines as required by the legislative,
    regulatory and statutory frameworks to which your organisation, in whatever sector
    it is based, is expected to adhere.


    Addressing privacy risks


    By addressing privacy risks up front in any new system development or process
    change, your organisation can avoid the risk of falling foul of the applicable
    data protection legislation:


    • Minimising data collection to information necessary for a specified purpose,
    and restricting its use for that purpose, is an important strategy. If you don’t
    hold the information in the first place, you can mitigate your risks by not recording
    it at all.


    • Eliminating collection of contentious data is another, i.e. blocking the use
    of particular information for decision making.


    • Non-collection of biometric data for authentication is another.


    • Delete or destroy data on completion of transactions for which it was required
    – this is best achieved through the application of retention and destruction schedules
    (in conjunction with RM).


    It’s important to use your organisation’s complaints process to determine avoidance
    and mitigation measures. You can easily identify trends when you see what people
    are complaining about. Ask for a review of a few months’ worth of external complaints,
    as well as internal user complaints. There is often some gold to be sifted therein.
    Users can spot when there is too much data being asked for on new forms, or are
    aware of historic forms where the data is never required or never used in any
    meaningful way. It needs to be part of your communication strategy to engage in
    this way as it becomes part of your risk mitigation.


    A PIA can be carried out at any point on existing systems, too, so that you have
    one as evidence that the above considerations have been dealt with. You could
    schedule this for corporate systems, in particular, throughout the year so that
    you are able to refer to the outputs and update them annually in case there have
    been any external legislative or regulatory changes, or internal system or process
    changes.


    Managing a virus outbreak


    Remember Conficker? It was painful if you experienced it in your organisation
    – and the instant response, as with any major virus outbreak, is to keep quiet.
    But you need to take action, so you have to get people involved, in particular,
    in locking down the offending machine(s) and patching like crazy! Given that your
    users can just as easily leak information to the outside as anyone else, handling  communications
    becomes part of your ISM role and needs to be done very carefully. Upwards management
    amongst you and your teams internally, as well as across a large organisation,
    takes staging and resourcing, too.


    Obviously we’ve talked about the requirements for patch management and vulnerability
    assessments. An outbreak like this is your chickens coming home to roost, as it
    is the most obvious result of a lack of housekeeping. The first patch for Conficker
    was issued in October 2008, so to be experiencing it in your network in 2010,
    and to be exposed, was pretty embarrassing and told quite a tale in itself. While
    the child in you desperately wants to shout from the rooftops ‘I told you so’,
    it obviously isn’t the polite, politically correct or job-enhancing response,
    so tread lightly!


    We found, through some rapid network analysis, that there were many devices showing
    they had the hotfixes for Conficker applied. But it was hard to gauge whether
    the data being presented was wholly accurate and whether all the servers and other
    hosts were present, given there was a gap between the known total number of devices
    and the number of devices analysed. (Back to my *[Chapter 1](#09_ch01.xhtml#ct1)*
    checklist of tasks – it is vital that you have that inventory of your estate accurate
    and up to date at all times, for just this kind of eventuality.) The scan across
    the network only picks up what is visible in the configuration management system
    and, thus, if it is not visible, it is not captured and the network may be exposed.


    NT4 had no patch against Conficker because, of course, it was on Microsoft’s planned
    unsupported software listing and, therefore, there were no plans to bother with
    it. So, at the time, if you were still hosting NT4 machines (and they  still exist
    out there to this day) then they were at risk of virus exposure.


    The IPS was generating warnings from a host network obfuscating behind the proxy
    and DNS. This is odd behaviour and indicative of the creative nature of the malware
    itself. Finding the host was the first task, as it was sending out replication
    messages across the network for as long as it was allowed to broadcast a signal.


    So, what do you do if a significant part of your estate has not yet been updated?
    It transpired that there were, in fact, quite a number of servers that had not
    been audited because the antivirus system had been turned off. The antivirus technology
    stops communicating if it is not updated, and the users needed to be set up in
    appropriate groups to have their local machines updated. In spite of these glaring
    compounded risks, decisions needed to be made urgently in order to get to a position
    where the antivirus system could be put back on, across the whole network.


    While turning off the technical solution may solve one problem, for a short period
    of time, it may create another risk. In panic mode, there will always be impractical
    considerations with regard to what could be done manually and technically, so
    your role as ISM is to maintain a level head and manage the teams and resources
    necessary to achieve a satisfactory outcome for all.'
