  trans: '

    为了让流程更加正式，我引入了一套增强的事件报告流程，以确保人们知道自己有“发言权”（这在心理上可能比“必须报告”更具有紧迫性），结果，一个问题出现了。这本应该通过
    ICT 帮助台处理以确保其可见性。一位员工“提交了工单”，称他们被告知不允许购买更多的加密 U 盘。由于这种购买限制，用户们开始在家里使用自己的 U 盘——含言之，这些
    U 盘未经过加密，而且可能没有杀病毒软件保护。


    现实情况是，这仅仅反映了整个项目范围内的状况，但一名员工将其作为“工单”事件提出来，有助于暴露增加适当的跨组织沟通的必要性，并更快地推进拟定的项目以吸纳更多用户，从而对信息资产提供更高水平的保护。存放在“家庭用户”U
    盘上的特定信息，在大多数情况下会被归类为“敏感个人数据”，并且至少会被标记（保护性标记）为“限制”。


    无论如何，你都需要你的用户能够报告事件，并且你需要这些事件的记录，以便收集可以分析并以有意义的方式向管理层报告的数据。这都有助于建立你的指标，通过这些指标你可以衡量一直在整个组织寻求实施的安全框架的有效性。有些人偏好数字（上升或下降）；另一些人喜欢图片（饼图、柱状图等）。你需要了解什么对你的组织最有效，并能够创建某种为安全提供“信心”的仪表板——即：它是可解释的、可翻译、可衡量且真实的吗？


    ### 信息安全

    信息安全对于你的组织来说是一种非常主观的交付机制，并且持续需要视觉呈现来解释其益处。人们往往在它缺失时才会注意到。这在发生数据泄露和信息丢失时尤为明显，特别是当发生的事件进入媒体（国家报纸或其他）时。当它运行良好、当信息安全已经植根时，人们在日常生活中可能不会注意到它，因为它不应该阻碍他们的工作。


    ### 数据共享协议

    行业热爱缩写词和术语。所以，当同事过来问你什么是“信任源”时，你能够构造出一个答案！当然，背景非常重要。但这是如何被识别的，又是什么让某人“受信任”？困难之处在于，背景与尝试实现信息共享承诺有关。公共部门的每个机构似乎都在制定自己的语言，私营部门的每个行业也是如此。你需要留意这一点，因为你作为
    ISM（信息安全经理）的角色往往是翻译员。尽可能可能，你需要与你的组织有联系的各种机构建立关系，以学习它们的语言。你不能孤立运作。还有所有冲突的倡议，它们是变革尝试的信号。同样，你需要关注这些，因为每一个相关的变化都会影响用于产生统计数据或管理需求的信息系统；你的组织需要保护数据以及管理数据的人。其影响通常比最初考虑的要广泛得多。


    ### 合规与合同

    回到“信任源”，这是一个信号交叉的场景：一个机构声称，除非我们证明了某些事情，否则他们不会信任。然而，两个机构都属于同一个部门，本应该遵守相同的政策、程序、指南、网络连接、法律、法规和标准。这清楚地说明了建立数据共享协议的必要性——而且为了使这些协议具有意义，它们必须拥有足够的安全控制范围，以支持其中包含的条款。作为一名
    ISM，你最终需要了解合同和协议。这涉及到要理解法律术语。这很痛苦，但完全值得！数据保护条款——把这些看作信息资产保护条款——从一开始就需要更好地引用在合同中——要么直接引用，要么以安全计划的形式作为附件。


    当提供商的销售团队执着于向你推销整个世界时，你需要能够对他们提供一个合理的回复，但现实可能差如人意。特别是随着云和虚拟化意图的飞猛发展，了解你的信息在哪里、谁将负责它、维护多久、你将如何取回它以及这需要多久，真的非常重要。你不要害怕挑战法律术语并询问实际事实可能是什么，因为在泄露模式下，等发现时可能已经太晚了。时间永远是关键。在某些时候，你必须在数据的整个生命周期内明确数据披露、数据共享、数据保留和数据销毁。


    ### 风险缓解

    除此之外，你还需要一份协议清单，这样你就可以看到谁代表哪个组织签署了协议，以及它们何时需要续签。这归结底是你风险缓解策略的一部分。现实可能是，你唯一需要知道这些信息是在出现问题时，但这对于你的汽车和房屋保险单详情也是一样。监管机构期望组织对其信息资产拥有控制和可见性，并知道谁有访问权限、数据被传输到哪里、与谁共享、保留多久、在什么条件下、什么情况下以及在什么介质上——U
    盘、CD、DVD、笔记本电脑等。因此，需要像 `Chapter#09_ch01.xhtml#ct1` 中强调的那样尽早建立清单。


    人们对行业部门、机构、政府以及私营和公共部门之间的安全需求差异存在持续感知。ISM 的观点应该是：无论需求的核心是什么，始终需要保护信息资产；任务在于找到适合大家的最佳方法。


    ### 将信息安全与记录管理关联


    '
- fmt: '

    Once you have fully grasped your role as a provider of protection for information
    assets and solution creator for future projects and programmes across the organisation,
    your custodian-style role needs to extend across the life cycle of the information
    assets for which you are seeking to provide the protection. If you are lucky,
    as previously mentioned, there will already be a records manager employed by your
    organisation. You should seek to work closely with them to ensure that your protection
    mechanisms are in keeping with legislative retention requirements, amongst other
    maintenance elements of records’ life cycle.


    Certainly with the `Cloud` technology take-up that is continuing apace, there
    are some interesting access and storage discussions required moving forward. The
    organisation needs to establish whether it is necessary to have all of the data
    available, all of the time and, if not, how best to store it in a secure way that
    is suitable for the likely classification of the information itself. Of course,
    there’s the rub. If you haven’t identified the information assets and applied
    the classification in a way that labels your information to be identified and
    distinguished sufficiently, then it will be difficult to know how to make distinctions
    between the different types of information and how best to look after it.


    One aspect of this is working with various project teams in order to ensure that
    considerations surrounding the life cycle of the information are built into the
    procurement process for all systems. So often, archive facilities are not considered
    as part of the initial requirements for intended new systems, and yet there should
    be some understanding that, legally, data cannot be kept forever and, therefore,
    it has to be managed through stages. There must be some kind of transition plan
    for it – from day-to-day usage, to short-term archive and then to longer-term
    retention.


    Also, depending on the nature of the data, the security requirements need to be
    dictated in order to ensure the long-term safety, as well as security, of the
    data. There will also need to be authentication arranged for the requirement to
    reinstate data or to access it outside its retention periods.


    ## Penetration testing results


    As we saw in `[Chapter 3](#11_ch03.xhtml#ct3)]`, vulnerability management is a
    key task that an `ISM` needs to manage and monitor. Part of this is achieved by
    arranging for penetration tests to take place on all systems and using the reported
    findings to manage the resultant mitigation activities.


    The following are the most consistent findings from penetration testing reports:


    * No one appears to be in charge of network security as a whole. This can be a
    result of the fracturing of responsibilities, often due to workforce reduction,
    which a lot of organisations have experienced in the last five to ten years, and
    also is symptomatic of a focus on the functionality of systems, rather than their
    security. This is manifested in the appearance that no one is taking responsibility
    for the life-cycle maintenance and day-to-day management and upkeep of systems
    at a network level – through not applying updates, patches, etc. – causing real
    risk to both systems and ultimately data; nor does anyone appear to know about
    the top 10 or top 20 vulnerabilities for systems that have already been identified
    industry wide, and certainly nobody is applying the required solutions or designing
    systems from the ground up so that in future they do not contain these weaknesses.


    Some of the key issues that result out of the above lack of ownership are as follows:


    * Blank passwords still being used on the installation of new equipment – this
    is a classic, and something we all know to deal with and change, but time appears
    to get in the way and everyone moves on to something else.

    * SQL database with default and blank passwords – similar to the above issue,
    but at least this served to highlight the scale of the issue for layers that still
    needed to be addressed.

    * Passwords easily cracked – this can be a most fascinating revelation. Of course,
    in my case, it was the one that caught the eye of senior management the most,
    particularly given the work that had been ongoing.

    * Patch management appears to not being managed in a timely fashion, and this
    dereliction exposes the architecture and infrastructure to vulnerabilities.

    * Excessive number of administrator accounts found – and at the time this was
    a disappointing finding, given the work that had been ongoing.


    ## Summary of testing findings


    Penetration testing and vulnerability assessments provide valuable insights into
    the state of the security implementation of an organisation. These are often confused.
    A vulnerability assessment should be considered to be linked to risk assessment.
    Systems (assets, resources) are identified and a value (importance) is assigned
    to them. Then, the potential threats to each asset are identified. The expectation
    is obviously that mitigation steps are put in place as a result of presenting
    the findings – at least for the most valuable resources and most serious vulnerabilities.
    A penetration test proves the vulnerabilities that are found (it is effectively
    a `proof of concept` of them), providing an impact analysis of the flaws on the
    underlying network, operating system, database, etc.


    None of the above findings are uncommon, but they demonstrate that good security
    practice is not in place. It is expected that these tests will be carried out
    at regular intervals throughout the year. Doing so can involve some trepidation,
    but remember our mantra – there’s no such thing as 100% security and you will
    never be 100% risk free, so never expect a clean bill of health. Always use these
    opportunities for learning and set expectations accordingly. Then plan in the
    remediation work alongside the, no doubt, already intended network (and other)
    improvements.

    '
