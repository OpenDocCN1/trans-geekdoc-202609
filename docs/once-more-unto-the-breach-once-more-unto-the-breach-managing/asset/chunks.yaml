- fmt: "\n## Communications and Challenges in Implementation\n\n- **Communications\
    \ team** – in order to ensure a phased set of messaging was delivered in various\
    \ organisational briefings – online newsletters, posters, etc. Management briefings\
    \ ensured that cascade messaging could be provided in face-to-face team meetings.\
    \ Organisational briefings were done at the following intervals:\n    - 100 days\n\
    \    - 50 days\n    - 30 days (one month)\n    - one week\n    - the day before\n\
    - **Third-party providers** – this was an interesting group to have to factor\
    \ in. The more we try, from an ICT point of view, to standardise and consolidate\
    \ our infrastructure and make the user experience more holistic and joined up,\
    \ the more providers themselves continue to be frustrating to deal with as a result\
    \ of differences in operating platforms and system development. In this case,\
    \ the mobile device (`PDAs`, etc.) providers, in particular, had to be embraced\
    \ as part of the process as there were two competing technologies in play. It\
    \ was not possible, in either case, to easily apply the password policy change\
    \ across all the users who had device identities in the system, as their devices\
    \ would lock up and get confused, creating gateway buffer overflows due to the\
    \ number of false messages being sent requesting password resets. `Expect the\
    \ unexpected.` is a pretty helpful ISM mantra to have!\n\nThe whole implementation\
    \ of the above seemed to have a new challenge every day, over the first week of\
    \ its implementation. There were server password reset traumas – servers that\
    \ had not been rebooted in years needed to be safely downed and then restored\
    \ and, when doing so, there were often no skills available to deal with the technologies\
    \ faced. Unknown passwords on systems for which the original developer was no\
    \ longer employed meant that resetting these was pretty much impossible.\n\nThe\
    \ same was true for legacy applications that needed to be kept running, but no\
    \ other maintenance could take place as nothing could be changed if you could\
    \ not log on to the server. Integrated applications had complications, too, and\
    \ PCs that had to be ‘always on’ needed to be identified. So they were forced,\
    \ at least once, to reset to the new password configuration, so that as many configuration\
    \ items as possible were in compliance with the new password policy rolled out\
    \ across the infrastructure.\n\nThe ISM’s task is usually to implement the sleekest,\
    \ most polished form of policy suite for all circumstances, which simply may not\
    \ always be possible. There are many scenarios you cannot have imagined in advance\
    \ when you are writing policy documentation in isolation of the real business\
    \ of the organisation. So there is real value in wide communication during the\
    \ life cycle of the policy suite – from the formulation stages and delivery through\
    \ to the implementation stages.\n\n## Laptop management\n\nWhy do users have laptops\
    \ that they never connect to the network? Laptop users need to be reminded to\
    \ connect their equipment to the network when important updates are occurring\
    \ in order to be appropriately maintained. No excuses! If a user is not prepared\
    \ to do this, then they should not be provided with the equipment. This kind of\
    \ requirement must be embedded as part of their contract of employment and job\
    \ working conditions. Laptops should be connected for updating purposes on a specified\
    \ regular basis and, if this does not occur, there must be some mechanism of recourse\
    \ and recall in place, so that the users can see that policy is enforced, and,\
    \ thus, the rules have meaning and are adhered to.\n\nYou also have to ask yourself\
    \ the question ‘why do some people have laptops at all?’ What do you do when you\
    \ know that there is a laptop that has been plugged in as new two weeks ago, but\
    \ it has a monitor plugged into it ‘because the resolution is better’, and a keyboard\
    \ and a mouse? Why not have a PC? There are some people who will always have a\
    \ desk and office-based role. Even though, in most procurement processes, it is\
    \ apparently ‘easier and quicker’ to purchase a new laptop, this really needs\
    \ to be resolved in order to ensure that an appropriate desktop is provided that\
    \ is attached to the network in the right way. Otherwise, it leaves the user with\
    \ the difficulty of having to find a safe place to store their laptop every evening\
    \ – or worse still, having to take it outside the organisation (presenting risk\
    \ in itself) when there is really no need.\n\nThe lesson learnt so far is that\
    \ however large or small your organisation is, and no matter how available technological\
    \ solutions for inventory management are, there seem to be ongoing challenges\
    \ with identifying all configuration items, managing them and protecting them\
    \ appropriately. Again, this is unacceptable and we really must be doing better.\
    \ The ISM needs to be taking on much more of an ‘enforcer’ role to ensure that\
    \ people do not lose focus on the tasks in hand, however manifold they may appear.\n\
    \n## Chapter summary\n\nThis chapter has reviewed a number of key chunks of activity\
    \ that the ISM should be spearheading in their organisation, depending on the\
    \ level of maturity of the ISMS in place.\n\nIn reality, in order to ensure that\
    \ the asset base of the organisation is at an appropriately secure level, significant\
    \ investment is often required to continue to roll out security-based change requirements.\
    \ Part of the challenge for the ISM is to develop the right communication channels\
    \ across the organisation, in order to best leverage existing resources to deliver\
    \ the desired end result.\n\n## CHAPTER 3: OCTOBER - COMPLIANCE MAY BE ONLY SKIN\
    \ DEEP\n\n### Introduction\n\nThe experience that is behind the writing of this\
    \ book is that of usually swooping in at the last minute, with about six weeks\
    \ to deliver a compliance state for an organisation. However, most organisations\
    \ tend to realise very quickly that saying you’ve done it (security) doesn’t necessarily\
    \ mean that you are it (secure). The capacity to successfully fill in forms and\
    \ ‘get through’ audits is staggering, when you consider the gap between the contents\
    \ of the verbiage and the reality of the infrastructure and operation across many\
    \ organisations. It may be that ‘compliance is only skin deep’ and you have to\
    \ actually dig below the rhetoric, then formulate a plan to achieve the stated\
    \ claims of compliance and ensure that the level of required security is embedded\
    \ across the organisation.\n\nThe ‘business’ is always seeking to understand what\
    \ the return on investment will be for any security-related spend. Cost-benefit\
    \ analysis in the security arena is notoriously tricky, and often fruitless. Some\
    \ would see us as being ‘ambulance chasers’ – we are constantly coming along after\
    \ an incident has occurred (a breach, a loss, etc.), being asked to fix things\
    \ after they have gone wrong, swooping in to solve the oversights of others. Or,\
    \ we could be seen as being fundamentally insurance salespeople, advising that\
    \ a particular approach (policy) is taken that would reduce risk and protect the\
    \ organisation in the event of an incident arising, while not being clear on the\
    \ level of likelihood, even though the impact may, indeed, be very tangible. There\
    \ has been a sufficient volume of data breaches and incidents of loss in the last\
    \ few years to provide a plethora of real examples to share with your organisation,\
    \ with the stance of ‘there, but for the grace of whoever you worship, goes us’.\
    \ In other words, if we don’t implement the following security-related controls\
    \ and safeguards, this could happen to us, and we wouldn’t want that, would we?\n"
