    their mind clean of all things to do with work. They’ve ‘lost’ the synapse that
    contains their password, too! If the 90-day password reset occurs while they are
    away, and they miss  it, that’s even worse! Remember to prepare your help desk
    for an increase in reset calls in the coming months, too.


    Chapter summary


    This chapter focused on two particular areas that, put together, provide a time
    line of understanding for how things come unstuck. Internal and external audit
    reports will always be available in any organisation. These are a gold-dust resource
    for the ISM to trawl through and see what the recurring themes have been over
    time, and whether improvements have been embedded. If not, research the barriers
    and help come up with workable solutions through the security improvement programme.


    It is appreciated that it may just be, sadly, that the culture of the organisation
    will render it ultimately impossible to achieve sweeping change, but ‘slowly,
    slowly, catchy monkey’, as one particular saying goes. It is still possible to
    make some change and achieve improved information security from the bottom up,
    if doing so from the top down is proving unsuccessful.


    CHAPTER 12: JULY - JOURNEY’S END… AND CONCLUSION


    Returning to the lessons learnt'
