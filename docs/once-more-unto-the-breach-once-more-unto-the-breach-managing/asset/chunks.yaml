    - DP 论坛（英国）– [www.dpforum.org.uk/](http://www.dpforum.org.uk/)

    - BCI – [www.thebci.org/](http://www.thebci.org/)

    - IRMS – [www.irms.org.uk/](http://www.irms.org.uk/)


    阅读这些各个专业机构和成员小组的月刊。此外，跟进期刊文章中的参考文献和资源，并与其作者取得联系。大多数作者都欢迎反馈和交流，借此建立一个更广泛的志同道合者网络，与他们保持联系，他们会在你需要帮助时为你提供协助。


    底线之所在必须是：贪婪地阅读！有许多动态需要跟进，因此你需要尽最大努力跟上信息行业不断进步的步伐。请放心，在接下来的几年里，我们完全有可能通过云和虚拟化的历程，重新回到一种更类似于大型机的存在状态。这无疑是一段充满波折的旅程，与此同时，还需要通过各种技术来管理日益增长的外部托管信息资产。设备与服务的整合将日益增加——智能手机将与家用电脑和电视同步。随着这些进步，`ISM`
    的角色不会变得任何容易或不重要，因为这些进步将使组织更难以知道自己的信息去向了何处，即使用户仍在为他们工作。而且，这种情况产生了一个非常大的攻击面。


    保持你的安全雷达开启，让你的知识水平尽可能高——永远不要失去你的幽默感！


    # 附录 1：安全意识主题


    每个月，考虑关注一个与季节合适的主题，并将你的信息安全工作投入到其中。这有助于将该主题置于每个人考虑的前沿，并确保你正将信息安全融入组织的 DNA 中，将其嵌入到最佳实践中，并缓慢但坚定地向好的方向改变文化。


    始终利用本月出现的任何新闻报道。作为 `ISM`，每天摆放在你办公桌上的这类新闻层出不穷，但普通用户可能甚至不会注意到。事实上，新闻中出现的许多故事涉及信息安全，但媒体并没有刻意地以这种方式进行呈现。不过，你可以发现其中的安全元素——无论是人员问题、物理安全问题、技术安全问题还是特定的信息安全问题。让你的创意喷涌而出吧！


    尽管这些建议听起来可能是陈词滥调，但用户群体会对这种讽刺与幽默的结合表示赞赏，至少会看到正在进行某种主题和信息传递。


    ## 安全意识主题 – 1 月


    本月的信息安全主题可以利用 1 月通常是新年愿望之段时间。例如，“你的愿望是什么……？我们的是始终更新杀毒软件……”或“新年，新气象……让我们把那些设备锁起来！”


    ## 安全意识主题 – 2 月


    本月的信息安全主题可以利用媒体焦点通常（至少在 2 月的前两周）与情人节有关，因此“爱”的元素。你可以开展一个名为“爱你的笔记本”的活动，鼓励用户确保他们已连接网络、更新了补丁和杀毒状态、运行了备份、清理了
    Cookie 和上网记录等。


    ## 安全意识主题 – 3 月


    本月的信息安全主题可以由你选择的任何主题。在本章节的特定示例和经验中，应对杀毒软件的最佳实践将是明显的选择！只要你鼓励用户确保他们在家庭电脑上更新自己的杀毒软件产品，他们就会感激你在保护机制方面对整个组织所付出的努力规模。


    ## 安全意识主题 – 4 月


    本月的信息安全主题可以关注复活节这一主题（由于复活节在 4 月）。你可以开展一个针对复活节的活动，例如，确保所有设备。


    ## 安全意识主题 – 5 月


    作为我个人的爱好者，5 月的主题可以围绕欧洲歌大赛（Eurovision）展开！5 月的主题通常是围绕这种主题的活动。考虑到我们所生活的多元化世界，这也许适用于你的组织。你可以提供一种国家身份风格（如联合国风格）的，针对每个部门/团队的遵守桌面政策的活动；或者在月底发放一些“奖励”。一盒巧克力通常很有用！


    ## 安全意识主题 – 6 月


    6 月的安全意识主题可以考虑围绕假期主题。用户从 6 月开始会休两周假，回来时神清气爽，但清空了所有关于工作的大脑。这还涉及到密码的命题。如果 `90 天密码重置`
    在他们不在时发生，那就更糟了！请为未来几个月增加的重置请求为帮助台做好准备。


    ## 安全意识主题 – 7 月


    夏季月份是关注移动存储设备（RMD）安全的理想时间。由于人们普遍通勤和旅行，导致移动存储设备丢失的情况将会增加。确保你的信息分享关于离开工作场所时保护所有设备的最佳实践。


    ## 安全意识主题 – 8 月


    紧随 7 月 RMD 主题之后，8 月可以围绕远程办公的主题，从机场（使用无线网络）到酒店。将其与提高物理安全问题的意识结合起来，这对你的用户群体和他们的信息资产也有。


    ## 安全意识主题 – 10 月


    本月的信息安全主题可以利用以万圣节结束的事实，这是一个全球庆祝的年度节日考虑到考虑到世界中大量的恶意软件、间谍软件和恐怖故事，你有足够的素材可以发挥 `ISM`
    的创意！


    ## 安全意识主题 – 11 月


    本月的信息安全主题可以利用 11 月包含篝火节的事实，它在万圣节之后不久。利用“记住，记住 11 月 5 日”的格言，你可以以此并传递围绕“记住，记住……你的移动存储设备！”或“记住，记住……每天离开前清理你的桌面！”或者更进一步，举办一个与烟花相关的主题。


    ## 安全意识主题 – 12 月


    本月的信息安全主题应该绝对关注圣诞节——关注送礼物的一面，以免引起任何宗教反感。借鉴那句常用的短语“狗是一辈子的，不仅仅是为了圣诞节”，你可以挑选任何信息安全的最佳实践元素，情况同样适用。也许是“备份是一辈子的，不仅仅是为了圣诞节”？


    # 附录 2：ISM 活动


    [content]

    `ISM` 需要应对有许多活动或任务，显然这些任务无法在一个月内全部完成。你需要尝试通过某种程度的规划将你的活动分散到整年，这样你就不会一直处于“救火”状态。以下是每个章节的核心要点，表示为
    `ISM` 需要重点关注的任务点。


    '
- fmt: '

    # ISM activities – January


    - Embedding security culture

    - Desktop refresh and consumerisation

    - Incident reporting

    - Data-sharing protocols/information sharing agreements

    - Records management

    - Penetration testing

    - Environmental management issues


    # ISM activities – February


    - User administration (and rights management)

    - Inventory management

    - Review back-up arrangements

    - Review business continuity requirements and engage widely across the business,
    conducting business impact analyses

    - Review risk assessment arrangements across the whole organisation


    # ISM activities – March


    - Addressing user requirements

    - Privacy impact assessments

    - Managing a virus outbreak

    - Embedding a useful InfoSec intranet


    # ISM activities – April


    - Reviewing information assurance arrangements

    - Linking up with information governance requirements

    - Security metrics and measurements

    - Equipment life-cycle management


    # ISM activities – May


    - Maintaining situational awareness

    - Addressing language and management challenges

    - Laptop management

    - Outsourcing/third-party management

    - Addressing port control


    # ISM activities – June


    - Reviewing audit reports – internal and external

    - Review other project proposals

    - Review organisational complaints

    - Security incident response management

    - Access control

    - Removable media device management


    # ISM activities – July


    - Reading – journal articles, books, blogs

    - Maintaining continuous professional development


    # ISM activities – August


    - Identify all assets – hardware, software, information, people

    - People – network widely

    - Review access control

    - Review information security awareness levels and design new material

    - Review incident management processes and improve if necessary


    # ISM activities – September


    - Software licensing

    - Remote and mobile worker management

    - User acceptance testing

    - Addressing physical security (convergence)

    - Password management

    - Laptop management


    # ISM activities – October


    - Information security policy creation and development

    - Antivirus (malware) management

    - Standard build and image roll-out

    - Password management (again)

    - Audit log management

    - Vulnerability management

    - Cloud Computing – third-party management, etc.

    - Project and people management


    # ISM activities – November


    - Remote working (again) – location network set-up

    - Ensuring security is built into all projects from the outset

    - Information labelling and classification of information assets

    - Ensuring lessons learnt are recorded and shared


    # ISM activities – December


    - Security improvement programme (SIP)

    - Fax management

    - Image build (again)

    - Physical security (again)


