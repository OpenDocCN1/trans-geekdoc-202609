  \ 这些指南直到 2009 年 11 月才到达组织内部的相关人员手中——而此时距离 2010 年 1 月关闭其不安全连接仅剩两个月了。这再次说明，该机构对中央政府下达的、关于网络、安全和连接的各种文件的重要性缺乏明显的理解。由于缺乏适当任命的`ISM`（信息安全经理），该机构在维护其信息资产安全的同时，面临着无法履行服务交付义务的风险。\
  \ |\n| 2009 年 2 月 | 制定了土地注册局全网络访问协议。 | 与上述类似，该协议于 2009 年 11 月到达了正确的部门——而旧服务将于 2010\
  \ 年 1 月关闭。实施所需的安全网络连接的时间跨缩短，增加了项目组出错的风险——这是任何`ISM` 绝不愿陷入的境地。 |\n| 2009 年 2 月 | 政府部门针对某一个企业系统发布了更多指导。\
  \ | `ISM`在 2009 年 12 月 15 日首次听到此事，距离 2009 年 12 月 28 日的截止日期仅剩两周实施时间。 |\n| 2009 年\
  \ 4 月 | 进一步连接的外部请求。 | 出现了另一个外部需求，要求另一个业务区域使用安全连接。这又花费了九个月才传递到`ISM`手中得到妥善处理。 |\n\
  | 2009 年 6 月 | 内部终于组建了一个项目组。 | 召开了首次会议，讨论了数据访问策略，并意识到了交付该项目所面临工作的影响。 |\n| 2009 年\
  \ 6 月 | 提交了商业计划书。 | 修改后的`BC`（商业计划书）提交给高级管理层请求资金。最终，资金拨下来了，资源到位，项目启动，但由于时间非常紧迫，该项目必须在压力条件下运行。\
  \ |\n\n表格中所描述的内容在许多组织中很大程度上是，并引起许多读者的共鸣。在启动完善的信息安全程序时，进行多次（往往是失败的）尝试并不罕见。回到本书的开头陈述——信息安全*不是*一个项目……这正是问题所在。只要你在你的组织中将其作为一个项目来处理，就存在发生灾难的风险。它必须被接受为组织架构的一部分。信息安全管理与财务和人员管理一样，都是组成部分。审计人员所了解的信息对于通过讲述故事向整个组织推销这一信息至关重要。\n\
  \n然而，当出现重大审计发现并已告知相应的治理小组时，如果做出的选择是“掩盖坏消息”，这可能会让`ISM`陷入伦理困境。\n\n曾对笔记本电脑进行过审计，其结果被认为“太具爆炸性”。在对桌面基础设施投入了大量工作之后，并在几个月来尝试在笔记本电脑资产上取得进展之后，审计终于尝试对这一关键领域应用了一些指标和衡量。事实很难解释这样一个事实：该组织的硬件资产清单上可能有\
  \ 1,500 台笔记本电脑，但只有 300 台笔记本连接到网络进行更新，特别是在其他组织正因无法证明其在整个“资产范围”内采取了适当的控制措施以保护所有形式和所有状态的信息而被罚款的时候。\n\
  \n直到我遇到了一个组织，他们知道自己有超过 300,000 台笔记本电脑，其中：\n\n* 220,000 台已加密；\n* 70,000 台失踪；\n* 10,000\
  \ 台被“豁免”——即允许在预期的安全策略流程之外运行。\n\n安全策略要求范围之外的数量非常显著，且无法解释。显然，一切都是相对的，报告和统计中总是存在问题，这会让报告的人显得很愚蠢，这对我们任何人都都没有处。但由于决定不将发现结果提交给公司管理团队征求意见和指导，情况变得更糟了。下个月将进行公司年度审计，不幸的是，当时存在战术和政治斗争。这意味着所做的决定是将笔记本审计报告在接下来的几个月内作为“机密草案”，在此期间可以制定一份行动计划，以证明解决方案，使结果最终变得更容易被接受。审计报告并不一定设计成是“易于接受的”。它们应该代表当时发现的任何任何事实，旨在为所需的行动领域提供指示，并对后续路线给出建议。\n\
  \n记住你的会员身份——专业机构有资源帮助你应对此类场景，所以不要害怕，可以私下寻求帮助。\n\n如之前建议的，与内部（及外部）审计紧密合作，并确保你能帮助他们制定年度审计计划，以涵盖威胁、漏洞、风险评估和业务影响等各个方面反映出的优先级最高的领域。\n\
  \n### 增加且日益多样化的安全事件\n\n由于建立了适当的信息安全事件报告流程，现在向管理层提供了更多信息，人们认为信息安全事件正在增加。在这样一个投入资金改进安全性的时期，这显然不是需要传达的信息！然而，这是开放组织并鼓励对安全状况保持诚实所带来的风险。这绝对是一个“情况在好转之前通常会变糟”的。一旦你对某种情况投射光，你就会看到它的“所有瑕疵”，这给了你机会为未来嵌入更合适的解决方案，以减少这种表面上的事件数量。\n\
  \n事件之所以被报告，主要是因为现在人们开始来诉苦，因为他们意识到以前的惯做法可能是不明智的。一位个人打电话，担心他们没有柜子的钥匙，但他们的工作模式要求他们经常匆忙离开座位，导致文件遗留在外面且可见。简单的解决方案是让他们养成把文件放进抽屉的习惯。\n\
  \n### 笔记本电脑事件\n\n事实证明，由外部资助提供给该组织的笔记本电脑显然不需要，因为它从未连接过网络，也从未被使用过。目标对应的个人使用了她丈夫的笔记本电脑，因为她丈夫也在该组织工作。你会怎么做？为了透明，你应该能够证明资金流向了哪里以及你对此做了什么——显然如此。但考虑到你的改进计划，你真正想做的是对笔记本进行健康检查和更新，并确保它交给需要的用户。在资金紧张的时期，没有比闲置资源更糟糕的。\n\
  \n有些用户拥有笔记本电脑，但被告知不允许带出建筑。然而，由于在建筑内部并不需要（因为大家都有台式机可以使用），这些电脑很久没有接入内网，并且发生了密码锁定。这对每个人来说都是一个徒劳的局面。但这有助于凸显一个文化问题；人们的观念是“这是我的笔记本”，而不是“这是组织的资产”。有了后者的态度，重新分配资源会变得容易得多！\n\
  \n\n\n\n另一位用户从未将他们的笔记本电脑连接到网络，因为他们只在家里使用。他们将数据从工作电脑传输到加密的 `USB` 优盘中，然后在家里使用笔记本工作。显然，他们没有意识到这导致笔记本电脑可能暴露在风险之中，因为该电脑从未更新过防病毒软件，也没有应用过补丁。\n\
  \n一个特定的团队会对他们的工作内容拍照并将其存放在笔记本电脑上，而这台电脑既没有密码保护，也没有存放在锁着的柜子里。\n\n一名用户在笔记本电脑上将 16,000\
  \ 条记录传输到 `CDs` 时，所有的记录、笔记本和 `CDs` 都从用户家中被盗了。这等同于另一家规模机构发生的类似事件，该机构被监管机构处以巨额罚款，但在本例中，用户是受独立第三方提供商派遣的。这由谁来承担后果？\n\
  \n## 电子表格与附件\n\n许多团队仍然在电子邮件中使用电子表格和 Word 附件，而不是将数据输入到现有的企业系统中。因此，当这些电子邮件四处传输（无论是在安全的企业系统内部还是外部）时，存在数据丢失的风险。这种情况在大多数组织中每天发生，但并不意味着底层问题不需要解决。需要鼓励人们分享超链接，而不是发送邮件附件。更大任务的一部分是维护一份关于可用企业系统数量及其使用水平的时间线，并将其与其中包含信息的敏感性水平进行对比。如果数据被“提取”出来是为了转换成更适合用户使用的格式，这将导致更大的风险——因此，需要考虑数据防泄露机制。\n\
  \n## 邮寄失败\n\n一份原始协议被发送到了错误的人手中，且发送到了错误的机构。他们被要求通过邮寄寄回，但信件丢失了。现在，你该怎么办？如果需要的话，应该向谁报告这次违规？这些小事件一直在发生，你的雷达需要对它们保持敏感。根据具体情况，你能够提出合适的解决方案，但要做好成为相关人员关注点的准备，因为他们正努力平复自己像被路灯下的兔子一样被抓获时的恐慌。\n\
  \n然而，他们还制作了一份邮寄指南，其中没有提到任何保护标记或对大量数据的处理。这又是一个典型的“孤岛思维”案例，人们孤立地无法理解在涉及信息资产的任何活动中参与\
  \ `ISM` 的必要性——通常，只有当人们接受并理解什么是信息资产时，改变才能开始。\n\n## 打印问题\n\n打印服务器没有正确设置，因为文件服务器、打印服务器以及旧打印机没有被妥善移除或报废。这是另一个“需要记住的事项”，因为当用户选择默认打印机并试图维持他们的工作模式和生产力时，这会给他们带来混乱。\n\
  \n## 可移动媒体管理\n\n部门之间收到了矛盾的通信信息。一个团队被告知他们的部门负担不起加密的 `USB` 优盘，于是他们转而从商店购买。其他用户以类似的方式购买了便携式硬盘备份数据，该硬盘也没有加密。便携式硬盘被带回家，数据随后被用于远程办公。如果在任何时候它遗失或被盗，对该组织来说将是一次令人尴尬的数据泄露。你的组织规模越大，越难同时向所有人传达正确的信息，除非你有授权这样做。但这类事件确实说明了获得许可以人类所能的最快速度发送此类信息的必要性。\n\
  \n事故和挫败感随处可见。一家第三方集成提供商花费两年试图关闭一台服务器，因为该服务器允许垃圾邮件通过其适当的保护软件通过。软件可以检测到它，但服务器配置错误、版本过旧且脱离监控。遗憾的是，委员会会议接连一场地召开，没有任何进展。在此期间，该组织一直面临风险。\n\
  \n## 访问控制问题\n\n组织中有的用户可以通过远程连接获得全系统访问权限，因此有能力将所有内容复制到他们的家用电脑上。在这样的时刻，你的本能是感到绝望！诚实地说，考虑到监管机构的预期，保留和维持控制的能力可能是极其有限的。\n\
  \n## 密码管理异常\n\n在登录组织内网时，密码似乎是明文可见的，且 90 天重置密码的功能未生效。用户们对全量重置密码的部署准备得非常充分，因此他们对这类异常警觉性很高，这些异常是由于边缘部门并不总是被纳入系统变更范围内。这绝对是\
  \ `ISM` 需要继续向 IT 同事施压以跟进的情况。\n\n## 物理安全困境\n\n某个人参加完安全意识简报会后回到办公桌，将手机插着电源充电，将钱包放在桌子上，然后冲了出去。他们回来取钥匙，但仍然留下了所有其他个人物品。噢，真是讽刺！\n\
  \n（ISM 解决方案——准备一个工具包，其中除了许多东西外，你还有一套明片，可以在人们犯下蠢事时留在他们的桌子上！）\n\n在特定情况下，该团队所在的建筑在下午\
  \ 6:30 之前门都没有锁。人们关上了百叶窗，但把钥匙留在了柜子和钥匙柜里，并在桌子上留了大量文件和物品。还有无法锁的抽屉柜。\n\n客人在会议结束后没有被护送离开，但他们完全可以走过多个未锁的屏幕，看到屏幕上显示的组织和公民敏感信息。\n\
  \n这类事情可以完全按照我们在第 2 章中发现结果的方式进行报告。\n\n所有这一切都在发生，但仍然有人认为信息安全与他们无关，或者认为不值得设立一个全职职位来负责！\n\
  \n\n\n当你的兴趣类项目被取消时，你该如何继续前进？这正是将信息安全领域的任何事物都简单标记为“项目”的症结所在。正如我们在本书中所看到的，信息安全需要被整合到组织基础设施的\
  \ DNA 中，因此没有尽头，因为它必须不断变化，并适应我们所处环境中的威胁和漏洞格局。\n\n同样，作为一名 ISM（信息安全经理），你得了解业务。整个 IT\
  \ 社区往往被指责为“不理解业务”，因此作为一名专业人士（见下文章节），花时间尽可能多地学习你的环境至关重要——正如我们在 `第 1 章` 中所看到和学到的那样。这通常被称为“情境意识”，它需要持续的警惕，特别是要吸收你周围的人使用的文化和语言的细微差别，以便你可以寻求模仿它们。你成功实现这一点的程度越高，当你试图改变行为或为活动变更赢得支持时，你的结果就会越好——无论这种变更目的是为了给受影响的个人以及信息可能间接涉及的个人提供更好的安全和保护。\n\
  \n## 信息安全经理的职业生涯\n\n那么，关于成为 ISM，我们学到了什么呢？\n\n你永远不会空闲或无聊，这一点是肯定的！如果你没有经历太多的组织变动或变化，可以尝试在一年中应用某种程度的结构。存在不断出现的主题——笔记本电脑管理、密码管理、访问控制、服务器管理等。这是预料之中的。问题会反复出现，处理完本会消失，但如果你只是贴上创可贴，它们就会反复回来。你的角色在很大程度上是提供解决方案，往往是在困难的境地下，所以也要创造性地思考。\n\
  \n这是一个“始终在线”的存在，因为你始终在考虑可能发生的危险。你越能让这种思维成为本能，你就越能将你想出的解决方案应用到日常工作中。\n\n一个东西要成为一个成熟的学科并被所有人理解和遵循需要多久？采纳的动力是什么？强制性执行会让这种采纳更成功吗？在某些情况下，你的用户群体会有“这对我有什么好处？”的心态，你必须确保解决这个问题。我们已经看到在合规性方面将面临挑战：个性、优先级、内部与外部政治、收同、集中化和专业化。最终，你需要跨团队、跨组织协作来获得信任。你需要成为一名导师、引导者顾问，整天忙于寻找方法激励和鼓舞你周围的人！\n\
  \n在序言中，我描述了现实；许多人在被当作一份“礼物”送给后，发现自己承担了 ISM 的角色。因此，通常你会感觉自己接到了一杯毒酒。说服人们做不同的事情是一场持久的攻坚战。\n\
  \n想象一下，你正在接受牙科保健师的护理。多年来，牙科诊发现，通过增加在牙科保健师那里停留的时间，可以缩短坐在牙医椅上的时间。并不清楚这对于任何人来说是否更愉快，但其理念是他们正在从反应性方法转向更具预防性的方法。因此，牙科保健师会在你每次光顾时告诉你，你多多用牙线，需要使用牙间刷，并且要把主牙刷刷牙齿缝隙，以减少斑菌，并最终减少龋齿和牙周病。根据你的行为，你可能会感到同样程度的被轻视和被责备。这取决于你在中间时间里所做出的选择。\n\
  \n在你的组织内部及跨部门交付稳健的信息安全，可以被认为是与这种思维保持一致。你正在做的是实施控制措施。作为 ISM，你可能需要不断反思，以确保你所做的一切是有效的。你所尝试做的是确保这些资源到位，并确保你投入足够的时间来关注这些问题。\n\
  \n## 我投入大量精力关注的内容\n\n这些包括：\n\n- 框架（例如 `COBIT®`）\n- 监管要求（例如 `PCI DSS`）\n- 标准（例如 `ISO27001`）\n\
  以及 活动，例如备份、风险评估和业务连续性计划。\n\n在许多方面，我们需要花费时间来确保这些。在组织中关注这些！\n\n## 结语\n\n本书的设计目的是让读者经历一段\
  \ ISM 的职业生涯。这结合了真实的时间和过去，希望通过反思过去来学习并适应未来。\n\n可能没有特定的“顿悟”时刻，但希望将这些想法整合在一起可以提供帮助巩固知识点：\n\
  \n- 不要局限于技术问题。要更广泛地思考。\n- 有一个使命，并尽一切努力坚持它。例如，“信息是我们工作的核心，我们将竭全力保护它。”\n\n希望通过这些，你会有足够的信心向管理层解释为什么它应该是一个全职工作并获得适当的资源。\n\
  \n行业有大量工作在推动 IA 的专业化。信息安全专业人士已经有了许多认证。这些都具有巨大的价值，你应该从底层参与发展，或者确保保持自己的持续职业发展。例如，作为读完这本书的结果，你可能需要关注信息和风险管理的学习。\n\
  \n阅读旧的内部审计报告——当然，还有新的！\n\n成为相关组织的成员，例如：\n\n\n\n\n\n- DP 论坛（英国）– [www.dpforum.org.uk/](http://www.dpforum.org.uk/)\n\
  - BCI – [www.thebci.org/](http://www.thebci.org/)\n- IRMS – [www.irms.org.uk/](http://www.irms.org.uk/)\n\
  \n阅读这些各个专业机构和成员小组的月刊。此外，跟进期刊文章中的参考文献和资源，并与其作者取得联系。大多数作者都欢迎反馈和交流，借此建立一个更广泛的志同道合者网络，与他们保持联系，他们会在你需要帮助时为你提供协助。\n\
  \n底线之所在必须是：贪婪地阅读！有许多动态需要跟进，因此你需要尽最大努力跟上信息行业不断进步的步伐。请放心，在接下来的几年里，我们完全有可能通过云和虚拟化的历程，重新回到一种更类似于大型机的存在状态。这无疑是一段充满波折的旅程，与此同时，还需要通过各种技术来管理日益增长的外部托管信息资产。设备与服务的整合将日益增加——智能手机将与家用电脑和电视同步。随着这些进步，`ISM`\
  \ 的角色不会变得任何容易或不重要，因为这些进步将使组织更难以知道自己的信息去向了何处，即使用户仍在为他们工作。而且，这种情况产生了一个非常大的攻击面。\n\n\
  保持你的安全雷达开启，让你的知识水平尽可能高——永远不要失去你的幽默感！\n\n# 附录 1：安全意识主题\n\n每个月，考虑关注一个与季节合适的主题，并将你的信息安全工作投入到其中。这有助于将该主题置于每个人考虑的前沿，并确保你正将信息安全融入组织的\
  \ DNA 中，将其嵌入到最佳实践中，并缓慢但坚定地向好的方向改变文化。\n\n始终利用本月出现的任何新闻报道。作为 `ISM`，每天摆放在你办公桌上的这类新闻层出不穷，但普通用户可能甚至不会注意到。事实上，新闻中出现的许多故事涉及信息安全，但媒体并没有刻意地以这种方式进行呈现。不过，你可以发现其中的安全元素——无论是人员问题、物理安全问题、技术安全问题还是特定的信息安全问题。让你的创意喷涌而出吧！\n\
  \n尽管这些建议听起来可能是陈词滥调，但用户群体会对这种讽刺与幽默的结合表示赞赏，至少会看到正在进行某种主题和信息传递。\n\n## 安全意识主题 – 1 月\n\
  \n本月的信息安全主题可以利用 1 月通常是新年愿望之段时间。例如，“你的愿望是什么……？我们的是始终更新杀毒软件……”或“新年，新气象……让我们把那些设备锁起来！”\n\
  \n## 安全意识主题 – 2 月\n\n本月的信息安全主题可以利用媒体焦点通常（至少在 2 月的前两周）与情人节有关，因此“爱”的元素。你可以开展一个名为“爱你的笔记本”的活动，鼓励用户确保他们已连接网络、更新了补丁和杀毒状态、运行了备份、清理了\
  \ Cookie 和上网记录等。\n\n## 安全意识主题 – 3 月\n\n本月的信息安全主题可以由你选择的任何主题。在本章节的特定示例和经验中，应对杀毒软件的最佳实践将是明显的选择！只要你鼓励用户确保他们在家庭电脑上更新自己的杀毒软件产品，他们就会感激你在保护机制方面对整个组织所付出的努力规模。\n\
  \n## 安全意识主题 – 4 月\n\n本月的信息安全主题可以关注复活节这一主题（由于复活节在 4 月）。你可以开展一个针对复活节的活动，例如，确保所有设备。\n\
  \n## 安全意识主题 – 5 月\n\n作为我个人的爱好者，5 月的主题可以围绕欧洲歌大赛（Eurovision）展开！5 月的主题通常是围绕这种主题的活动。考虑到我们所生活的多元化世界，这也许适用于你的组织。你可以提供一种国家身份风格（如联合国风格）的，针对每个部门/团队的遵守桌面政策的活动；或者在月底发放一些“奖励”。一盒巧克力通常很有用！\n\
  \n## 安全意识主题 – 6 月\n\n6 月的安全意识主题可以考虑围绕假期主题。用户从 6 月开始会休两周假，回来时神清气爽，但清空了所有关于工作的大脑。这还涉及到密码的命题。如果\
  \ `90 天密码重置` 在他们不在时发生，那就更糟了！请为未来几个月增加的重置请求为帮助台做好准备。\n\n## 安全意识主题 – 7 月\n\n夏季月份是关注移动存储设备（RMD）安全的理想时间。由于人们普遍通勤和旅行，导致移动存储设备丢失的情况将会增加。确保你的信息分享关于离开工作场所时保护所有设备的最佳实践。\n\
  \n## 安全意识主题 – 8 月\n\n紧随 7 月 RMD 主题之后，8 月可以围绕远程办公的主题，从机场（使用无线网络）到酒店。将其与提高物理安全问题的意识结合起来，这对你的用户群体和他们的信息资产也有。\n\
  \n## 安全意识主题 – 10 月\n\n本月的信息安全主题可以利用以万圣节结束的事实，这是一个全球庆祝的年度节日考虑到考虑到世界中大量的恶意软件、间谍软件和恐怖故事，你有足够的素材可以发挥\
  \ `ISM` 的创意！\n\n## 安全意识主题 – 11 月\n\n本月的信息安全主题可以利用 11 月包含篝火节的事实，它在万圣节之后不久。利用“记住，记住\
  \ 11 月 5 日”的格言，你可以以此并传递围绕“记住，记住……你的移动存储设备！”或“记住，记住……每天离开前清理你的桌面！”或者更进一步，举办一个与烟花相关的主题。\n\
  \n## 安全意识主题 – 12 月\n\n本月的信息安全主题应该绝对关注圣诞节——关注送礼物的一面，以免引起任何宗教反感。借鉴那句常用的短语“狗是一辈子的，不仅仅是为了圣诞节”，你可以挑选任何信息安全的最佳实践元素，情况同样适用。也许是“备份是一辈子的，不仅仅是为了圣诞节”？\n\
  \n# 附录 2：ISM 活动\n\n[content]\n`ISM` 需要应对有许多活动或任务，显然这些任务无法在一个月内全部完成。你需要尝试通过某种程度的规划将你的活动分散到整年，这样你就不会一直处于“救火”状态。以下是每个章节的核心要点，表示为\
  \ `ISM` 需要重点关注的任务点。\n\n\n\n\n\n# ISM 活动 – 1 月\n\n- 植入安全文化\n- 桌面设备更新与消费化\n- 事件报告\n\
  - 数据共享协议/信息共享协议\n- 记录管理\n- 渗透测试\n- 环境管理问题\n\n# ISM 活动 – 2 月\n\n- 用户管理（及权限管理）\n-\
  \ 清单管理\n- 审查备份安排\n- 审查业务连续性需求并在全公司范围内广泛参与，开展业务影响分析\n- 审查整个组织范围风险评估安排\n\n# ISM 活动\
  \ – 3 月\n\n- 处理用户需求\n- 隐私影响评估\n- 管理病毒爆发\n- 建立一个实用的信息安全内网\n\n# ISM 活动 – 4 月\n\n-\
  \ 审查信息保证安排\n- 与信息治理需求接轨\n- 安全指标与测量\n- 设备生命周期管理\n\n# ISM 活动 – 5 月\n\n- 维持态势感知\n-\
  \ 处理语言和管理挑战\n- 笔记本电脑管理\n- 外包/第三方管理\n- 处理端口控制\n\n# ISM 活动 – 6 月\n\n- 审查审计报告 – 内部外部\n\
  - 审查其他项目建议\n- 审查组织投诉\n- 安全事件响应管理\n- 访问控制\n- 可移动媒体设备管理\n\n# ISM 活动 – 7 月\n\n- 阅读\
  \ – 期刊文章、书籍、博客\n- 维持持续职业发展\n\n# ISM 活动 – 8 月\n\n- 识别所有资产 – 硬件、软件、信息、人员\n- 人 – 扩展人脉\n\
  - 审查访问控制\n- 审查信息安全意识水平并设计新材料\n- 审查事件管理流程并在必要时改进\n\n# ISM 活动 – 9 月\n\n- 软件许可\n- 远程和移动工作人员管理\n\
  - 用户验收测试\n- 处理物理安全（融合）\n- 密码管理\n- 笔记本电脑管理\n\n# ISM 活动 – 10 月\n\n- 信息安全策略的制定与开发\n\
  - 防病毒软件（恶意软件）管理\n- 标准构建与镜像部署\n- 密码管理（再次）\n- 审计日志管理\n- 漏洞管理\n- 云计算 – 第三方管理等\n- 项目与人员管理\n\
  \n# ISM 活动 – 11 月\n\n- 远程办公（再次） – 地点网络设置\n- 确保安全从一开始就构建到所有项目中\n- 信息标签化与信息资产分类\n\
  - 确保教训被记录并共享\n\n# ISM 活动 – 12 月\n\n- 安全改进计划 (SIP)\n- 传真管理\n- 镜像构建（再次）\n- 物理安全（再次）\n\
