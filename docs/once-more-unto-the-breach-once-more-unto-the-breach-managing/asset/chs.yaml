  \n## 安全意识主题（注：原文“笔记本电脑用户仍然倾向于将大量信息保存到机器硬盘中，只有当机器本身在启动时进行加密时，这种做法才是合理的。在英国，这一点尤为重要，因为信息专专员办公室（Information\
  \ Commissioner’s Office）对这一领域高度关注……”）\n\n重新整理完整译文：\n\n[content]\n笔记本电脑用户仍然倾向于将大量信息保存到机器硬盘中，只有当机器本身在启动时进行加密时，这种做法才是合理的。在英国，这一点尤为重要，因为信息专专员办公室（Information\
  \ Commissioner’s Office）对这一领域高度关注。鉴于过去几年所经历的数据泄露和信息损失的规模及其产生的影响，全盘加密也成为一种正在全球范围内蔓的预期。\n\
  \n新款笔记本电脑层出不穷，一些最新型号在设计时并没有配备 CD/DVD 驱动器。如果你是批量购买，就需要考虑这一点，并确保订购了正确的设备类型以满足用户的需求。这意味着要考虑他们的工作需求，而不是个人使用需求，因为当然地，在任何可能的情况下，他们不应该将设备用于个人用途。（此处原文出现重复逻辑，直接进入后续翻译）\n\
