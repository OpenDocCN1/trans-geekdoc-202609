- "# 再次向突破口（Once More Unto the Breach：在不确定世界中管理信息安全），第2版\n\n\n\n[content]\n\n\n\n\n\
  \n\n\n\n\n\n\n\n# 前言\n\n这本书的诞生源于我在英国信息安全行业的多年经验，既包括担任信息安全经理的经历，也包括近期担任首席信息安全官的经历；此外，我还观察到许多人在没有刻意做出职业选择或意识到这会成为其工作职责的情况下，从零开始承担这一角色。坦诚地说，你不会听到很多（或者没有？）青少年计划离开学校后成为信息安全经理！这个角色往往是作为一份“礼物”（带有“有毒圣杯”的意思！）赋予给个人的，加在他们原本就极其忙碌的日常工作之上，因为交出这份“礼物”的人并不理解其所需的广度。因此，接受这份“礼物”的个人既没有足够的时间或尊重来为保护相关组织的资产提供适当的建议和指导，也无法积极鼓励同事比这样做。\n\
  \n本书的目的是提供一个关于实际操作中应对这一角色的“一线”视角，这源于我自己的经验；在读博士期间，我曾担任一家英国公共部门机构的信息安全经理，一年，我很快意识到记录详尽笔记的好处！在学术界，这被称为“参与式观察”，是作为研究嵌入最佳实践信息保证的博士论文的一部分进行的。作者观察了大量的事件、事故和风险，并参与了创新解决方案的创建以解决所有这些问题。这项研究的结果值得汇集在这本巨书中——几乎每天都会带来一个小惊喜，如果你不熟悉信息安全那奇妙的广度，你可能会错过它，包括原因、潜在的缓解措施以及“经验教训”元素。\n\
  \n本书实际上是通过“项目教训总结”的光谱编写而成的，这些教训是严苦地获得的；由于本书是基于过去几年中的实际情况编写的，包含了许多见解。然而，由于书中包含了许多对实际情况的观察，这些见解可以用于信息保证的实践……（注：此处原文存在大量重复和逻辑断层，翻译已按原文结构尽可能处理）。\n\
  \n\n\n\n\n# 致谢\n\n我要感谢我的父母，他们培养了我坚韧的性格，使我成为一个比较开朗的人，这意味着人们倾向于亲近我，而不是避而远之。在信息安全经理这一角色上，这是一个非常有用的特质，因为你需要让人们觉得可以信任你，并分享任何发生需要解决方案的问题。我也感谢我的母亲珍（Jean），特别感谢她对语言和口语的热爱——更感谢的是她愿意花时间读这本书，这完全超出了她平时的阅读习惯，并从中找出了所有需要修正的细微瑕疵！\n\
  \n我感谢在过去的二十年里，我在各种职位上遇到的所有同事，在这些职位上，我有幸发挥了影响力。世界上确实有一些非常迷人的工作，但从我们的角度来看，更有趣的莫过于如何将信息安全织入我们业务的肌理中，使其在日常生活中焕发生机、自由呼吸。\n\
  \n我同样感谢一路上遇到的各各同事——特别是那些像我一样渴望为了更好的发展而改变现状的人——他们致力于以积极的方式代表信息安全，而不是一以负面的方式（遗憾的是，后者通常是默认的立场）。我们不必成为“拒绝部门”！\n\
  \n最后，但也绝不是最后，我当然非常感谢我的丈夫，忍受了我不断想要写东西的需求！\n\n我们感谢以下对本书的审稿员提供的他们的有用贡献：Chris Evans\
  \ DPSM MBCS 和 Giuseppe G. Zorzino CISA CGEIT CRISC，27001 首席审计师，安全架构师。\n\n\n\n##\
  \ 引言\n\n“再次突破口”是莎士《亨利五世》第三幕中“为哈利、英国和圣乔治祈祷！”演讲中的关键短语。这里的突破口是指哈弗尔（Harfleur）城墙上的一个缺口，英军当时对该市进行了围困。亨利正鼓励他的士兵再次进攻该市，即使他们必须用“英国人的尸体来封堵城墙”。\n\
  \n\n\n\n\n从学术角度来看，作者既在考察历史方法论——试图回顾 `IA`（信息审计）的历史，以及为什么在正确定义上几乎没有共识——而且在构建一种扎根理论（grounded\
  \ theory），即通过互动和研究，作者创建一个理论并在一段时间内对其进行测试。作者的观点是，正是由于知识的根本匮乏，导致我们现在在向成熟的 `IA` 职业迈进的过程中面临困难（和困惑）。预警——我应该事先说明，这本书将不会任何留情。\n\
  \n当这本书最初出版时，它关注的是 2009 年到 2011 年之间的一段时间。在当时的许多媒体评论中，2011 年被誉为“黑客之年”，从媒体报道的量以及因此全球范围内的广泛意识来看都是如此，并被认为是发生重大数据泄露和损失的一年，因为有大量个人直接受到影响或冲击。今天，我们经常看到知名公司遭受网络攻击的报道，而在\
  \ 2011 年似乎是异常的情况已变成常态。事实上，鉴于自本书首次出版以来经历的泄露规模，其内容从未像现在这样准确或合适。2014 年特别是异常活跃的一年，所有操作系统都出现了一个又又一个漏洞——包括所有\
  \ *nix* 系统的防御盔甲上的第一个重大漏洞（通过 Bourne Again Shell – `BASH/Shellshock` 漏洞）。实际上，媒体报道的泄露事件只是冰山一角，你在行业内工作的时间越长，这一点就越清晰。\n\
  \n在媒体报道的故事背后，通常存在许多已经存在相当长时期信息安全方面的失效。\n\n## 安全领域正处于糟糕的十年……\n\n*太多的泄露了！*\n\n* 10/2014:\
  \ Home Depot (5300 万条记录)\n* 9/2014: Home Depot (5600 万张卡)\n* 8/2014: JPMorgan Chase\
  \ (摩根大通，8300 万条记录)\n* 6/2014: iCloud (名人“被黑”）\n* 5/2014: eBay (1 亿 4500 万条记录)\n\
  * 12/2013: Target (1.1 亿条记录)\n* 10/2013: Adobe (1 亿 5200 万条记录)\n\n以此类推，不断……显然有一些严重的问题需要解决。\n\
  \n所有这些问题接一个一个发生，就像多辆汽车同时到达一样，可以通过三个关键的信息安全管理原则得到充分解决，这些原则在本书中得到了涉及：\n\n1. `库存管理`（了解你拥有什么）`[章节\
  \ 1, 4, 7 和 8]`\n2. `补丁管理`（保持更新）`[章节 2]`\n3. `漏洞管理`（保护免受伤害）`[章节 3]`\n\n鉴于可能已经有许多包含相关问题的有效审计报告，为什么会这样呢？\n\
  \n请注意，以下章节提供了文中提到的安全事件的按顺序概述：\n\n### 泄露事件每月概述\n\n**一月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n\
  **二月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n**三月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n**四月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n\
  **五月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n**六月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n**七月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n\
  **八月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n**九月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n**十月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n\
  **十一月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n**十二月**：为什么会这样？鉴于可能已经有许多包含相关问题的有效审计报告。\n\
  \n（注：提供的文本在每月部分包含大量重复的占位符；已进行清理，以在保留要求的结构的同时维持核心叙事的流畅。）\n\n\n\n\n` 标签内是关于“ISM（信息安全经理）职业”的英文书籍内容，但结尾处突然变成了“人际交往术（Make\
  \ friends and influence people）”的标题。\n\n作为高级文档工程师，我将根据您的要求，针对提供的 **ISM 职业文本** 进行标准的\
  \ Markdown 化排版。\n\n以下是排版后的内容：\n\n[content]\n在整书中，有很多插页章节，引用了已经发生的事件或由于人们的言行结果而产生的想法，这些内容都为作者提供了灵感。书中似乎还存在大量的重复——但这恰恰是\
  \ `ISM` 工作的真实写。在第一线工作是一场漫长的、重复执行相同工作的练习，但带有细微的差别，并且随着你对组织、文化以及哪些方法有效的了解，会有更优的解决方案。任务不会停止——因此，安全是一个过程，而不是一个项目！\n\
  \n`ISM` 的工作是从组织潜在风险的角度来考虑一切问题，并寻求在适当的时候实施适当的预防或威慑控制。这一角色是无休止的，因为总会有新员工需要融入你组织的文化中，他们需要理解自己的职责以及在信息资产保护方面所面临的要求。\n\
  \n成为一名 `ISM` 既要成为许多人的顾问，又要成为你组织的变革活动家。鉴于对该角色及其定位的历史观点并不一定完全积极，你需要具备某种水平的灵感来完成必须完成的工作。我希望这本书能在某种程度上使这种印象发生良好的转变。\n\
  \n消费化（Consumerisation）无疑将成为许多组织的重点，它是近年来主导对话的“三个 C”之一：`Cyber`（网络）、`Consumerisation`（消费化）和\
  \ `Cloud`（云）。这现在更多地被称为“自备设备（BYOD）”，并在资产管理以及在现有企业系统旁边整合不同操作平台方面给 ICT 部门带来了严峻挑战。本书并非为了解决这些问题而设计的，因为现在有越来越多的资源可以完成这些工作。仅可以说，从信息安全的角度来看，眼下的任务仍然是保护信息资产。这需要控制和保护措施，以及对机密性、完整性和可用性方面的考量。\n\
  \n## 第一章：八月 - 组建团队\n\n## 它不是一个项目……\n\n从书中记住最重要的一点可能是：不应该再有信息安全项目，而应该是计划（programmes）。我们作为信息安全专业人员，最终交付的是跨整个组织的变革计划。21\
  \ 世纪第二个十年一直困扰我们的所有安全漏洞事件，似乎都是由于运作方式与安全关键要素（即维护信息资产的完整性、机密性和可用性）的重要性背道而驰导致的。本书不会重复信息安全本身的详细定义——那里有大量的资源可以做这些。特别是，建议读者参阅由国际信息系统安全认证协会（(ISC)²）维护的信息安全通用知识体系（`CBK`）的\
  \ 10 个领域。但为了条理起见，这里快速回顾一下哪些被视为信息资产。\n\n**信息资产包括：**\n\n*   纸质系统和硬拷贝报告\n*   电话会话和即时消息\n\
  *   内部和外部邮政\n*   传真机和打印机上的信息\n*   笔记本电脑和掌上电脑上的信息\n*   各种类型硬盘硬盘上的信息，包括无状态硬盘\n*  \
  \ 存储在 CD、USB、DVD、磁盘和磁带上的信息\n*   服务器和工作站上的信息\n*   通过网络传输的信息。\n\n此书是为那些欣赏在某种范式下运行的读者设计的，这种范式了解并理解信息安全的预期——即，眼下的任务更多地关于涉及信息资产保护的人员和流程，而不是支持这些过程的信息技术。事实上，通常情况下，`ISM`\
  \ 针对其所提供安全建议的组织网络中正在使用或计划部署的任何技术，并不是这些技术的技术专家。`ISM` 需要了解需求以及如何最好实现这些需求，并理解各种外围问题，而不是每项技术的具体细节。这简单来说是不可能的，而且在很多情况下，这正是为什么需要\
  \ IT 安全管理员、安全架构师和许多其他角色，以及 `ISM` 的原因——也就是说，责任不应仅落在某一个人身上。\n\n虽然该角色及其功能最初始于技术，但随着数据安全成熟为信息安全，其技能和角色画像也随之成熟了。为了让一个组织能够从每天面对的海量信息相关挑战中获益，`ISM`\
  \ 角色需要具有更广阔的触达和更全面的技能组合。\n\n因此，这些章节的构想是提供一个内部视角，展示在处理日常挑战的真实组织中作为 `ISM` 运作的真实情况。通过在变革计划中运用“项目经理”的角色，我们将强调几乎每天发生的各种事件和问题——其中许多往往不被察觉。将阅读这本书看作是一个需要注意事项的训练场，以防你某天发现自己变得狭隘并开始忽略小事。这非常类似于错过了预言中蝴蝶翅膀的扇动，因此由于早些忽略了小细节，而没有发现风暴正向你袭来。\n\
  \n当你被赋予交付特定项目的任务时，你的团队成员始终是该项目成功或失败的重要部分。安全变更管理的一个关键失败之处在于，它被视为一个项目，因此根据其本质，被认为有开始、中间和结束。现实中，安全是需要植入组织中的东西，因此被嵌入到其结构之中——正如此，它比项目更像是一个“计划”，因为这些活动没有真正的终点；安全最终将不断变化，以适应在旅途中出现的各种信息风险。\n\
  \n\n\n\n到目前，大多数组织应该已经在内部某种程度上实施了信息安全最佳实践。然而，仍有许多组织将这些深埋在 `IT` 部门中，导致实施必要的保护措施变成了一项持续的斗争，而新项目的建立往往是为了尝试满足外部法律、规章、标准、合同或必须遵守的政府主导要求。为了确保真正有效，这些倡议需要不断解释，说明为什么你需要参与到各种活动以及你可能在旅程中偶然遇到的其他与变革相关的项目中。\n\
  \n`ISM`（信息安全经理）的角色还需要具备某种程度的倾听能力。现阶段，许多组织已经经历了很多、很多次变革计划。这可能导致人们产生疲劳感，因此他们对于进一步实施变革计划的尝试往往会产生抵触情绪。因此，缓解所需前进动力的最佳方法通常是给人们留出短时间，让他们把目前认为阻碍进展的问题说出来。及早安排介绍会议有助于完成这一倾听阶段。`ISM`\
  \ 不能当旁旁观者或胆畏缩的小角色！你必须身处其中，与人们在一起！一旦你听取了这些问题，你通常可以实施预先想好的解决方案，因为这些担忧通常并不难解决；或者，你也可以经常向人们指出，已经存在一些控制和保护措施，这些措施到目前为止可能还没有得到充分解释，但很可能适用于提供保护。\n\
  \n你必须在交付变革方面表现出某种程度的投入，人们才会开始认同“事情将发生变化”的观点。`ISM` 必须被看到在预期变革计划生命周期的早期实现一些快速胜利（quick\
  \ wins）。实际上，`ISM` 必须被看到在他们所有的工作中生活并呼吸安全，日复一日：始终佩戴员工（或同等）胸牌；始终加密数据；始终备份数据等。如果你考虑到我们要求用户每天记住的所有控制措施，`ISM`\
  \ 真的必须被看到正在执行这些操作，而且做得良好且从容，以证明安全不必成为障碍，并证明它既有价值又有意义。你还需要拥有一种近乎超能力的感知力——我们将在接下来的章节中继续探讨这一点。\n\
  \n鉴于十年来大家一直在经历如此多的“转型”，确保你对组织及其文化构成和挑战有充分的背景信息（包括在变革管理领域哪些过去是有效的，哪些是无效的）总是很有帮助的。在调动资源、传达变革等方面，你需要帮助，包括来自人力资源、培训、企业传等等部门的人员。你必须跨整个组织建立联系和友谊，远超预期的\
  \ `IT/ICT` 限制。\n\n在较大的组织中，通常有负责发布公司政策的人员，他们也需要被积极参与。如果不是如此，那么在你的信息安全管理论坛（`ISMF`）会议上必须对政策进行某种程度的治理审查，你应该定期安排此类会议。所有更新的文档在发布到运行环境之前，都应要求获得某种程度的管理认可。\n\
  \n脱离人们编写政策将导致其注定失败，因此这项工作与人们共同完成至关重要。你需要与受政策影响的人接触，以确保其实用性并获得支持。这项工作应该与人们共同完成，以确保其现实性。你需要与受政策影响的人接触，以确保其清晰性。这项工作应该与人们共同完成，以确保其可行性。你需要与受政策影响的人接触，以确保其相关性。这项工作应该与人们共同完成，以确保其有效性。\n\
  \n（注：原文后续存在大量重复段落，根据指令“不要重复输出原文”，此处仅保留核心逻辑翻译，重复部分已去重。）\n\n\n\n你需要确保自己与组织内的其他合规职能保持紧密衔接：数据保护、信息自由、风险、伦理、法律、记录管理和信息治理。这些可能是独立的或组合的职能资源。如果你足够幸运，将在所有这些领域承担一些责任。虽然这听起来可能令人生畏，但这终究是该职业的发展方向，因为对信息资产保护的所有元素进行监管，是确保你能为所有相关方提供所需信息保证的最佳机会。\n\
  \n外部提供商对于成功实施基础设施安全变更计划也可能至关重要，例如设备提供商、回收和销毁提供商。特别是后者，我们即将在 `第 3 章` 中再次讨论。\n\n企业传播团队在这一切中是一个非常重要的环节。如果你足够幸运，该团队规模足够大，常驻有营销和传播人员，并擅长构建信息（无论好坏），以及理解适合你组织的语调和交付方式。你将预期所有用户的行为发生变化（或至少这是你应该追求的目标），因此，你需要从多个角度与他们互动——即过去哪些有效，哪些无效，以及作为你沟通推广的一部分，未来哪些可能奏效。你需要一个主题、一个口号、一个格言、一个形象（avatar）等。所有这些元素都能让你的活动计划在整个组织中显得更加真实、具体且可见。用户需要感上认为自己是某项事业的一部分。归属感是马斯洛需求层次中的核心人类需求（中间层），对于我们安全人员来说，意识到这一点也同样至关重要。\n\
  \n## 总是需要一个“列表”（好吧，如果这个列表足够让圣诞老人满意的话！）\n\n你还需要掌握一些关键的基础性作为“随手备用”的信息，随着你与组织的互动增加，这个列表也会随之不断增长。以下是一些例子。\n\
  \n### 共有多少用户？\n\n你可能会发现，你需要彻底搞清楚为什么会有这么多潜在系统都包含了一份员工列表。你通过内网找到的员工目录可能与 `Outlook^®`\
  \ 中持有的记录不同。你需要的是，至少在一种情况下，针对用户群体拥有一个“单一真相源”，以便在政策、标准、控制以及信息资产处理方面进行管理，这引出了你的下一个数据集需求。\n\
  \n### 你的组织中有多少资产需要保护？\n\n很多时候，信息资产保护被完全误解并被认为过于狭隘。拥有一个配置管理数据库 (`CMDB`) 是一回事——它是一个\
  \ `ITIL^®` 元素，应该包含信息系统的所有组件。但重点可能仅限于公司 PC 资产或公司 IT 系统，而且它们很少能保持最新的更新状态；这取决于你的采购流程的集中化程度。然而，有很多在本地运行的表格需要被考虑。有需要包含在内的\
  \ USB 盘；有需要考虑移动设备；还有所有的笔记本电脑及其内容。公平地说，这项任务实际上是巨大的。现实是，`CMDB` 并不总是包含全貌。\n\n\n\n您的组织可能会提到“服务器集群”，您需要了解它的规模有多大，其中有多少是内部的，有多少可能是外包的并由外部管理。您越是试图深入理解并处理与补丁和漏洞管理相关的特定问题，这一点就变得越重要。解决系统保护的挑战是维护工作的一个元素，本应作为日常业务（BAU）运营的一部分。遗憾的是，这种情况往往并没有发生，因为这些工作没有被明确标注为某些个人全职职责的一部分。在许多情况下，正如过去十年在许多文章、论文、博客和书籍中所描述的那样，信息安全并没有“植入”组织之中。这是一项必须作为\
  \ ISM（信息安全管理）计划）变革行动计划的一部分被发现并解决的问题。\n\n## 信息资产如何？\n\n除了识别硬件和软件之外，还需要识别信息资产。最佳做法是由\
  \ ISM 会同记录管理器和/或信息治理经理共同完成，采取积极立场，并为用户群体提供一份供其考虑的清单。这应该涵盖：\n\n• 信息是如何存储的；\n\n• 多大容量的数据构成了信息资产；\n\
  \n• 如何满足法律要求（数据保护、信息自由法、保留期等）；\n\n• 信息与与谁共享；\n\n• 这些同事是在组织内部还是外部；\n\n• 有多少人涉及；\n\
  \n• 信息存储在哪些设备上；\n\n• 如果信息资产丢失将产生什么样的影响。\n\n## 运行的是哪个版本（或哪些版本）的防毒软件？多久更新一次（或）？\n\n\
  同样，在这个领域可能有很多可以的问题，但您需要了解基础知识来开始。在那些本该更理性的组织中，仍然有一些 IT 人员认为 `Linux`、`Unix` 以及 `Windows®`\
  \ 以外的平台不需要防毒软件更新。没有任何计算环境是能够免疫的。\n\n## 有多少个系统管理员？\n\n您需要意识到这一点，以便了解您的关键受众之一的规模。然后，您需要知道这些系统管理员（`sysadmins`）分布在多少平台、企业系统等。您需要知道有多少人拥有多少不同系统的管理员访问权限——而且并不总是得接受这些理由！也不应该接受可能存在未从默认值更改或特别明显的密码。您还需要能够将每个用户记录到其注册的\
  \ PC IP 地址上——访问控制管理需要在开放系统互连（`OSI`）模型栈的多个层级上进行。\n\n此类问题之所以一直出现在安全控制“前 20 关键”列表中，是有原因的，实施这些控制是实现整个组织安全管理最佳实践基准所需要的。\n\
  \n衡量 `sysadmins` 在组织工作了多久也是值得的。随着时间的推移，`sysadmins` 可能会与他们的系统产生很深的个人感情，即对它们产生强烈的所有权感和责任感。这可能需要一种向外看的要求，以看到并理解随时间推移而增加的威胁水平。如果持续教育和参加各种研讨会、会议等不是您的\
  \ `sysadmins` 职责的一部分，那么他们可能意识不到规模。\n\n## 系统更新频率是多少？\n\n同样，在这个领域可能有很多可以的问题，但您需要了解基础知识来开始。在那些本该更理性的组织中，仍然有一些\
  \ IT 人员认为 `Linux`、`Unix` 以及 `Windows®` 以外的平台不需要防毒软件更新。没有任何计算环境是能够免疫的。\n\n## 策略中有多少个例外（偏离）？\n\
  \n同样，在这个领域可能有很多可以的问题，但您需要了解基础知识来开始。在那些本该更理性的组织中，仍然有一些 IT 人员认为 `Linux`、`Unix` 以及\
  \ `Windows®` 以外的平台不需要防毒软件更新。没有任何计算环境是能够免疫的。\n\n## 上一次审查访问控制是什么时候？\n\n同样，在这个领域可能有很多可以的问题，但您需要了解基础知识来开始。在那些本该更理性的组织中，仍然有一些\
  \ IT 人员认为 `Linux`、`Unix` 以及 `Windows®` 以外的平台不需要防毒软件更新。没有任何计算环境是能够免疫的。\n\n## 整个组织的信息安全意识水平如何？\n\
  \n到目前，大多数组织已经至少向员工提供过一次用户信息安全意识简报。诀窍在于计划执行多次，并确保为每位参加会议的员工都获取一份可接受的许可声明，并将其保留在他们的人事文件中。声明需要记录他们是否被视为远程用户，这应该将他们与某些资产关联起来。对于某些个人可能还需要进行背景调查检查，这些检查也应该保留在人事文件中。这些检查随后应与他们的培训档案以及确认已“读过并理解”策略的记录相关联。\n\
  \n## 如何处理事件管理？\n\n您需要能够识别：\n\n• 什么是事件；\n\n• 事件可能产生什么影响——对组织或可能与之相关的个人；\n\n• 在不同受众眼中它是什么样子的；\n\
  \n\n\n\n\n-   人们应该关注的；\n-   如何进行这些沟通，以及向谁沟通。\n\n作为 `ISM`，你在确保机制到位以让每个人都能报告事件方面发挥着重要作用，这样这些事件就能被记录和审查，以评估是否需要改变政策或行为，或两者兼有。将跨整个组织的事件管理整合起来对解决风险管理大有帮助。事件需要被纳入绩效管理报告中，以便在适当的管理层级实现可见性。\n\
  \n## 团队和公司内部又是怎样的？\n\n“细节决定成败”（*It’s the little things that get you*）是一句经常被使用的话。当你发现不同部门在邮件底部使用自己的横幅时，其中一些提到了所使用的邮件扫描器，而另一些则没有，你作为\
  \ `ISM` 的任务就必须尝试给这种情况带来一些秩序和结构，并为这样做提供合理的理由。正如我之前所说，`ISM` 必须生活并呼吸在所有表现形式的安全之中，因此信息和输出的完整性是基石之一，而这种错误正是其运行出错的一种表现。从起点开始，邮件系统应该应用横幅，这样个人就不应该觉得有必要创建自己的横幅。然而，在缺乏自动化的情况下，应该提供一段适用于整个组织的标准文本。\n\
  \n从这个与 `ISM` 相关任务的小型示例中可以获得一个关键点：交付的一致性是推动用户建立安全意识的关键。当他们理解为什么需要进行变化，以及这种变化具体如何应用于他们自己的个人环境时，这会让它更有意义。通过隐藏来实现安全（*Security\
  \ through obscurity*）可以是实现深度防御的一种有价值的方法——你展示的使用的产品和版本信息越少，攻击者对你可能漏洞的了解就越少。\n\n##\
  \ 组织中同时进行的其他项目如何？\n\n考虑到这些项目是非常重要的，因为忙碌的员工会被分散注意力，被各种优先事项四方拉扯。`ISM` 的技巧在于展示信息安全是如何所有忙碌工作中不可或缺的一部分，而不是孤立的额外负担。因此，你需要在整个范围内拥有眼睛和耳朵，以捕捉计划和变化，并与现有团队和项目建立联系，这样你就能看到即将到来的情况，并确保从尽可能早的阶段就把安全考虑。\n\
  \n## 项目管理\n\n我们已经看到，找到那些对交付积极变化有切利益的人以及那些由于各种原因会提供帮助的人是非常重要的。对于你的直接团队（可能主要由 IT 技能组成），你可能会发现有按照你希望在整个组织中实施的方式，向他们“从零开始”解释信息安全。它实际上已经发展超越了防火墙和防病毒软件，尽管我们显然必须继续应用这些技术。我将在\
  \ BAU（日常运营）部分在 `Chapter 2` 中回到这个问题。\n\nIT 人员应该理解你为什么要参与他们领域之外的如此许多元素——因为你正在遵循信息链索，并知道保护它的需求。\n\
  \n一个活动计划可能会面临许多风险。你需要知道谁会授权你项目的持续支出，以及谁需要任何预算监控报告。财务人员确实需要每月获得适当报告的可见性，否则你的项目支出很可能就会无影无踪，所以从你自己的活动开始。了解开支流向哪里是有帮助的，这也是\
  \ `ISM` 角色所需的不断扩展技能图谱的一部分。\n\n始终检查细字条款——供应商可能会尝试对大客户耍花招，因为他们认为“细字条款”实际上并没有被检查。始终检查以下内容：\n\
  \n-   工作时长是否与报价成本相符？\n-   在你组织中进出的人是否有权待在那里？\n-   他们合同约定的工作是否执行得恰当？\n\n底线是——不要假设任何事情，检查一切。\n\
  \n在达到某个里程碑之前，总会有一些需要完成的关键活动。现在，我不想让这一章变成任何类型的 `PRINCE2®` 方法论的重复，但确实有一些基础知识被应用，然后人们似乎最终没有意识到它们，或者在责任、问责和参与方面迷失了方向。\n\
  \n因此，在开始解释你的管理风格以及对所有参与者投入的期望是非常重要的。\n\n此外，检查大家的假期安排！你可能拥有世界上最完美的计划，但由于某个关键人物在交付阶段的关键时间无法可用，一切都会变得搞砸（*Pete\
  \ Tong*，伦敦东区韵脚俚语，意为“错误”！）！因此，一个关键里程碑可能会被错过，特别是当该个人实际上不知道他们的输入的关键性时。\n\n这些只是你作为“看家本”需要掌握的少数关键基本点——而且作者在项目第一个月就需要掌握这些信息，以便推进工作。\n\
  \n\n\n\n你已经对该组织有了深入的了解——前提是你已经对`第一章]`中提出的所有问题了如胸！毫无疑问，许多人对你对如此广泛的问题感兴趣感到惊讶。这恰恰应该是这样的。ISM（信息安全经理）关注整个组织内所有形式、所有地点、跨组织及以外所有交易的信息安全。请记住，实施和维护信息安全不仅仅是关注比特和字节——它还需要基于人员、流程和技术的组合解决方案、控制措施和保护措施。你的\
  \ `ISM` 职责之一是能够用高层管理语言来表达你所承担任务的重要性——因此，这是风险和财务的语言，而不是比特和字节。重点既需要具有战略性，又要以服务为导向，用务实的术语来解释安全。\n\
  \n在`第一章]`中，我们查看了需要了解全组织有多少多少用户，以及如何在整个生命周期内管理他们的要求。然后你学到了需要检查各种系统资源中是否存在重复用户。这些可能是由于最初输入名称时的录入错误导致的。并不是每个系统资源都直接链接到中央\
  \ `Active Directory` 或等效系统，因此有 IT 管理员管理着具有不同用户目录的多个系统。这些系统需要同步，以确保用户不会因为 IT 执行任何数据迁移或服务器基础设施更改而丢失任何访问权限或连接性。\n\
  \n### 不兼容的软件\n\n许多组织仍然发现，他们与第三方软件供应商的关系中，这些供应商提供的产品显然无法升级，因为这样做极有可能导致不兼容和配置错误。这意味着任何本应执行的安全补丁或升级都由于担心影响当前运行系统的性能而没有进行。这些大型软件供应商继续向公共部门和私营部门的大型组织提供不符合标准的产品，其表现为没有内置安全功能。尽管长期以来，补丁和升级的重要性一直是行业相关的一条准则，且理应被视为最佳实践，但目前，许多可用且广泛使用的系统必须由内部\
  \ IT 团队进行向后兼容处理，而不是升级到未来的安全状态。考虑到在某些组织中这可能影响的用户数量，这可能导致数百台 PC 无法达到如今预期的安全水平。继续容忍或支持这种情况是不可接受的。\n\
  \nIT 行业中似乎有些人人并不完全理解 `OSI 模型`——即七层模型（参见`表 1]`）。安全需要在这些层中的许多层同时发生，这需要大量的考虑和配置管理。销售产品的人可能没有充分意识到这一点，因此无法理解他们将给组织留下什么影响。随后将需要大量的维护和支持，以使售出的产品发挥预期的效益，而且通常会有一项未计入的额外成本。这需要得到解决，而\
  \ `ISM` 仍然需要“长有后脑眼”，以从各个角度警惕潜在问题！\n\n表 1：OSI 模型（来源：Wikimedia Commons）\n\n![](img/P46_01.jpg)\n\
  \n在英国公共部门，自 2010 年以来，紧缩的时间和经济衰退环境像黑云一样在头顶盘旋，直到现在仍在投下阴影——结果是中央政府在开发身份验证系统的方法上是疯狂的，尽管这非常重要，但花费了大量时间才能做好。与此同时，地方政府不得不开发并实施自己的系统，因为他们无法等待中央系统的实施。然而，随着时间的推移，为了试图实现标准化和集中化以减少开销，将产生更多的成本和集成问题。在此，软件、技术和政策要求方面的重复劳动是巨大的，而用户最终成为受害者，因为他们最终不得不管理多个身份验证设备来访问不同的系统和冲突的设置。我经常不得不建议用户，他们需要一个像劳拉·克罗夫式的战术腰带，用来收纳他们的各种身份验证令牌、`USB`\
  \ 设备、手机手机、PDA 和访问卡。\n\n### 远程工作者\n\n该领域的另一个难题是识别和明确谁是远程或或居家办公人员。你需要知道：\n\n*   所有的远程用户都是远程的吗？\n\
  *   所有的居家办公人员都是在家里工作的吗？\n\n你的`远程工作政策`或等效文件确实需要包含对移动办公人员在尽可能多场景下的适当定义，以确保他们使用的设置是最合适的（安全、可靠且稳定的），并且是能得到良好支持的设置。\n\
  \n不同类型角色的可能分类方法见`表 2]`。这种有用方法的原始来源是西门子企业通信公司关于呼叫中心的一份白皮书。\n\n`表 3]`中提供的示例是公共部门类型的角色和组织，但可以根据你的需求轻松进行调整。\n\
  \n表 2：角色分类\n\n| **分类** | **描述** | **典型需求** |\n| --- | --- | --- |\n| **内部** | |\
  \ |\n| 办公室办公人员 | 90% 以上时间在办公室度过的员工（例如文职人员）。 | 专用的办公桌，配备齐全的 ICT 设备和服务。 |\n| 灵活办公办公人员\
  \ | 90% 时间在组织办公室内度过的员工（例如经理、IT 人员）。 | 专用的办公桌，可能在每个办公室内配备`笔记本电脑和扩展底座/临时工作区`，使他们能够完全访问\
  \ ICT 服务。 |\n| 居家办公人员 | 所有或大部分时间在家里工作的员工（例如兼职呼叫中心座席员）。 | 家中有专门的工作环境，并可访问（通常通过宽带）他们所需的\
  \ ICT 服务；此外在一个或多个办公室内有扩展底座/临时工作区。 |\n| 游牧办公人员 | 没有固定工作地点、经常在途中、但可能会访问组织办公室并也可能在家里工作的员工（例如社会工作者）。\
  \ | 能够在任何时间、任何地点访问 ICT 服务，包括在途中、家里或办公室的外部地点的。 |\n| **关联人员** | | |\n| 成员 | 选出的成员。通常情况下，在组织内部和外部地点之间移动性极强。频繁沟通。频繁会议。\
  \ | 能够在任何时间、任何地点访问某些 ICT 服务。需要管理联系。增加会议的使用以节省旅行/会议时间。 |\n\n\n\n\n\n| 公民 | 需要该组织提供信息和服务的当地公民。\
  \ | 越来越多的公民倾向于使用互联网或其他媒体来获取企业服务或与组织通信。这可能扩展到 ISP 类型的服务。 |\n| 合作伙伴 | 地区/单一组织、其他公共机构（如医疗、消防）以及外部服务提供者/私立机构。\
  \ | 共享服务和增强的通信。 |\n\n### 表 3：公共部门角色的示例\n\n| 用户群体 | 概描述 | 需求 |\n| --- | --- | ---\
  \ |\n| 社会工作者 | 移动式 | 大部分时间花在访问成人或儿童的家庭以提供社会关怀服务。作为以人为本的工作人员，他们通常不精通技术，因此灵活的工作解决方案需要易于使用，并针对其特定需求进行定制。作为处于弱势地位的独立工作者，他们需要与支持人员和管理层保持高频率的接触。\
  \ |\n| 学校顾问 | 移动式 | 大部分时间在访问学校。他们也会回到主办公室并在家中工作。他们有一位共同的助理（PA），负责分配任务并为他们提供返回组织的链接。总来说，他们对技术有良好的理解。例如，一些学校顾问在晚上使用家里电脑上的\
  \ Skype 电话与同事进行通信和协作。此外，由于他们向学校推广该组织的技术和服务，他们自己需要被视为高级用户。 |\n| ICT 支持人员 | 灵活的办公型/移动式\
  \ | ICT 支持人员可能被归类为灵活的办公型/移动式。ICT 支持人员可能被归类为灵活的办公型/移动式。ICT 支持人员可能被归类为灵活的办公型/移动式。ICT\
  \ 支持人员可能被归类为灵活的办公型/移动式。（等等） | |\n| 管理人员（特定领域） | 灵活的办公型 | 共享服务和增强的通信。共享服务和增强的通信。共享服务和增强的通信。共享服务和增强的通信。共享服务和增强的通信。（等等）\
  \ | （等等） |\n\n注：非常感谢，如今很可能是更少的人在完成更多的任务（我假设你们并不一定拥有许多人团队来逐一处理每个要素）。\n\n| 正常业务 (Business\
  \ as usual)\n\n有许多被明确描述为与安全相关的任务，现在需要成为 ICT 常规业务（BAU）的一部分。换句话说，它们不仅仅是信息安全经理（ISM）或管理员的职责范围。这些包括：\n\
  \n* 访问控制\n* 杀病毒软件/恶意软件\n* 备份\n* 业务连续性\n* 灾难恢复\n* 事件管理\n* 补丁管理\n* 漏洞评估\n\n简而言之，对于每个领域：\n\
  \n* `access control` – IT 需要管理设置新用户、删除旧用户或更改角色配置的过程。\n* `antivirus/malware` – IT\
  \ 需要确保所有网络节点（服务器、桌面式电脑、笔记本电脑等）都有最新的签名，以及经过完全管理和授权的产品。\n* `back-up` – IT 需要确保备份正在进行，并定期对恢复进行测试。\n\
  * `business continuity` – IT 需要确保其本身有一份计划，正如组织的每个其他部门都需要一份计划一样。\n* `disaster recovery\
  \ (DR)` – IT 需要确保已让组织的所有部门或部门参与到对系统的业务影响分析中，以便在事件管理方面有明确的预期。\n* `incident management`\
  \ – IT 是捕获基础设施和用户发生事件的绝佳起点。ISM 应与 IT 工作人员紧密合作，识别并分类事件，以便对其进行调查并吸取改进教训。 |\n\n\n\n\
  \n\n- `Patch management`（补丁管理）——IT 需要确保在整个基础设施中及时应用补丁，以维持风险降低。\n- `Vulnerability\
  \ assessments`（漏洞评估）——IT 需要确保对基础设施进行评估，以保持对威胁水平的认知并据此进行缓解。\n\n`ISM`（信息安全经理）的角色是建立框架——即政策、程序和指南——并创建和交付安全意识培训课程，以沟通和解释所有这些内容。此后，其他人必须不断地尽到自己的职责，而不仅仅是在框架发布后最初的一波热情之后。这是一项持续进行的任务，而不是一个有终点的项目，因此之前提到的“计划关注（programme\
  \ focus）”而非“项目关注（project focus）”更为合适。\n\n## 信息所有权\n\n在许多组织中，IT 安全与处理信息治理主题的角色（包括数据保护、信息自由法和\
  \ `RM` 风险管理）之间存在巨大的鸿沟。鉴于 `ISM` 的重点是保护信息资产，并通过安全增强和实施来实现业务倡议，而信息治理经理的重点是了解在法律和法规要求的范围内，何时该共享、披露、保存、存储或发布信息，如果这两者不配合默契，就会出现问题：这简直是疯狂的！建立紧密的工作关系至关重要。在理想的世界中，目标应该是角色的融合（如果你足够幸运，甚至是团队），这实际上为组织提供了保护其信息资产的最佳整体方法，确保它们随着时间的推移保持安全、可靠。我们将在\
  \ `第 9 章` 中回到这个问题。\n\n## 物理安全\n\n你在组织中待得越久，物理安全就越开始成为一种提供视觉辅助的非常有价值的机制，你可以将其作为人们需要接受的变化的示例。每天，你都应该能够通过巡视建筑识别出已经发生的事件，或找到可能发生的事件示例。以下是一个真实（真）的故事。\n\
  \n### 事件\n\n上午 09:45，我观察到“设施”人员在两栋建筑之间推着手车，收集机密垃圾袋并将其运走进行粉碎。由于操作员需要进入其中一栋建筑，上上下许多层楼梯收集每层的袋子，手车处于无人看管的状态。随着手车上的堆积越来越多，它被遗弃的时间也越来越长。到上午\
  \ 11:25 时，它依然无人看管，到下午 12:35 时被移走，但显然堆得太高了，以至于一个袋子掉了而操作员没有注意到，所以就这样被留在了街道上（见 `图 1`\
  \ 中的图片）。作为我们所处的这个不安全且不确定的时代的悲哀反映，现在的心态是你不会去捡它的，以防里面有炸弹。但是，由于我观察了这一系列事件，我觉得自己处于相对安全的地面，最终发现内容非常令人失望——没有什么有趣或具有新闻价值的东西！所以实际上，在现实中，那个袋子根本不应该存在，因为里面的纸质材料很久以前就可以回收或在现场粉碎了。\n\
  \n\n图 1：机密垃圾\n\n小贴士——始终确保随身带有相机设备！我是个老派的人，所以在现场时（在允许的情况下）我会在手包里一直带着一台真正的相机。显然，如今大多数移动设备都具有拍照功能，因此无论哪种方式这都不难实现。你就可以从视觉上捕捉你看到的“错误”行为，以便你可以将其“回放”给你的用户群体，解释你希望他们采取不同的做法。\n\
  \n在交付用户信息安全意识简报时，使用上述事件中的示例和照片，这让每个人都觉得更加真实，因为该地点离一家地区报纸非常近，任何人都可以直接把那个袋子带到那里；无论内容多么无聊，数据泄露事件本身就是一个新闻。\n\
  \n由于向广泛观众谈论这个微小事件，引发了一些旁带问题。例如，其他地点收集机密垃圾的等待时间太长，这意味着经常能发现相当数量的袋子。这等同于糖果店里的罐装糖果——这种疏忽具有诱惑力，并为机会主义者偷犯提供了目标。还有不断把钥匙留在柜子里、不该关上的门门开着等常见例子。我们稍后会回到这里。\n\
  \n本月还发生了其他物理安全问题，这真的凸显了扩大覆盖范围和理解深度的必要性。通常情况下，设施管理负责物理安全，而与 `ICT` 或组织中任何安置信息安全的部门几乎没有交流。自\
  \ 2011 年以来，关于这两个关键功能融合的必要性进行了大量讨论，试图解决这些差距。然而，在实施了多年 `ISO27001 ISMS` 后，我并没有看到这种融合的必要，因为物理安全是一项嵌入且符合预期的要求，这暗示人们没有正确地执行\
  \ `ISO27001`。无论如何，留意出口和入口，并将自己置于潜在犯罪犯的心中，是非常重要的。考虑你如何进入你的建筑，并在此过程中你能看到什么，以及你可以带走什么。这些东西在当时可能没有显性价值，但可能有你目前尚未考虑的转售价值。\n\
  \n在视觉和物理上，以及在电子和技术上，生活并呼吸安全是至关重要的，这样你的用户群体才能看到它的实际行动，并相信它一直在被认真对待。\n\n### 密码管理\n\
  \n这里是另一个来自战壕的故事。\n\n项目实施的一个关键部分是从用户定义密码改为由 `Windows` 驱动的密码管理过程，该过程要求至少 8 位的字母数字密码。决定是在\
  \ `Active Directory` 上应用全局设置，因为任何其他方法都需要分阶段更改，这对用户和 `ICT` 工作人员来说意味着更多的努力和管理。\n\n\
  这需要跨多个领域沟通：\n\n- `ICT 帮助台`——确保他们在密码更改当天（在人员配备和知识方面）准备好应对增加的呼叫量。\n- `ICT 系统团队`——确保所有系统管理员和数据库管理员都准备好更改他们负责的系统密码，特别重要的是，要确保系统本身能够处理新的密码要求。事实证明在所有情况下并非如此，这导致短期内需要大量的密码策略例外（这是你尽可能想要避免的），并且在中长期需要大量的系统修复。\n\
  - `人事资源部门`——为了确保用户行为的改变不会以任何方式违反权利和义务问题。也有必要捕获与因病或职业休假导致的长期缺勤相关的问题，因为这些人不会在场接收密码更改的所有信息，等回到电脑时可能已经忘记了密码，重置将需要更多的互动。\n\
  \n\n\n\n\n## 执行过程中的沟通与挑战\n\n- **沟通团队** – 为了确保在各种组织简报中（在线时事通讯、海报等）分阶段交付一套信息传递。管理层简报确保了可以在面对面的团队会议中提供层级传递。组织简报按以下间隔进行：\n\
  \    - 100 天\n    - 50 天\n    - 30 天（一个月）\n    - 一周\n    - 前一天\n- **第三方供应商** – 这是一个必须考虑在内的很有意思的群体。从\
  \ ICT（信息与通信技术）的角度来看，我们越是尝试标准化和整合我们的基础设施，并使用户体验变得更加整体和连贯，由于运营平台和系统开发的差异，这些提供商本身在处理起来就越发令人沮丧。在这种情况下，特别是移动设备（`PDAs`等）的供应商，必须作为流程的一部分被接受，因为当时存在两种竞争技术。在任何一种情况下，都无法轻松对系统中所有具有设备身份的用户应用密码策略更改，因为他们的设备会锁定并产生混乱，由于发送了大量请求重置密码的虚假信息，导致了网关缓冲区溢出。`预计意料之外的事`\
  \ 是一个非常有帮助的 ISM（信息安全经理）格言！\n\n在实施的第一周内，上述整个实施过程似乎每天都会出现新挑战。出现了服务器密码重置的惨剧——多年未重启的服务器需要安全关机然后恢复，而在过程中，往往没有可用技能来处理所面临的技术。由于原始开发者已离职，系统上存在未知密码，这意味着重置这些密码几乎是不可能的。\n\
  \n对于需要保持运行的遗留应用程序也是如此，但由于无法登录服务器，就无法进行任何其他维护。集成应用程序也有复杂之处，而且必须“一直开启”的 PC 也需要被识别出来。因此，他们被迫至少重置一次以符合新的密码配置，以便尽可能多的配置项符合在整个基础设施中推出的新密码策略。\n\
  \nISM 的任务通常是为所有情况实施最精简、最完善的策略套件，但这可能并不总是可行的。当你脱离组织的实际业务孤立编写策略文档时，会有许多场景是你无法预先想象到的。因此，在策略套件的生命周期内——从制定阶段和交付到实施阶段——进行广泛沟通具有真正的价值。\n\
  \n## 笔记本电脑管理\n\n为什么用户拥有从不连接到网络的笔记本电脑？需要提醒笔记本用户在发生重要更新时将设备连接到网络，以进行适当的维护。没有借口！如果用户不准备好这样做，那么就不应该为他们提供设备。这种要求必须作为其劳动合同和工作条件的一部分嵌入。笔记本电脑应按照指定的定期连接以进行更新，如果没有发生这种情况，则必须有某种追究和召回机制，以便用户能够看到策略得到了执行，从而规则是有意义并被遵守的。\n\
  \n你还要问问自己“为什么有些人会有笔记本电脑？”当你知道一台两周前才插入的新笔记本电脑上还连接了显示器（“因为分辨率更高”）、键盘和鼠标时，为什么不用 PC\
  \ 呢？有些人总会有办公桌和办公室的角色。尽管在大多数采购过程中，购买新的笔记本电脑显然“更容易更快”，但这真的需要解决，以确保提供正确方式连接到网络的台式电脑。否则，用户将面临每天晚上寻找安全地点存放笔记本电脑的困难——更糟糕的是，在真的不需要的情况下将其带到组织之外（这本身就带有风险）。\n\
  \n到目前为止学到的教训是，无论你的组织是大小，无论库存管理的技术解决方案多么可用，在识别所有配置项、管理它们和适当保护它们方面似乎存在着持续的挑战。再次，这是不可接受的，我们真的必须做得更好。ISM\
  \ 需要承担更多的“执行者”角色，以确保人们不会失去对手任务的关注，无论这些任务看起来多么多样。\n\n### 章节总结\n\n本章回顾了 ISM 应该在组织中带头的若干关键活动环节，这取决于现有的信息安全管理体系（ISMS）的成熟程度。\n\
  \n现实中，为了确保组织的资产基础处于适当的安全水平，通常需要大量的投资来继续推出基于安全的变更需求。ISM 面临的挑战部分是跨组织建立正确的沟通渠道，以便最好地利用现有资源交付预期的最终结果。\n\
  \n# 第 3 章：10 月 - 合规可能仅流于表面\n\n## 引言\n\n编写这本书背后的经验是，通常在最后时刻切入，只有大约六周的时间为一个组织交付一个合规状态。然而，大多数组织往往很快意识到，说你已经做到（安全）并不意味着你已经是（安全的）。当你考虑到许多组织中措辞内容与基础设施及运营的实际情况之间的差距时，成功填写表格并“通过”审计的能力是惊人的。这可能是“合规仅流于表面”，你必须实际上挖掘修辞之下的内容，制定一个计划来实现所声明的合规主张，并确保所需的安全水平贯穿整个组织。\n\
  \n“业务”总是试图理解任何安全相关支出的投资回报率。在安全领域，成本效益分析是出名的困难，且往往是徒劳的。有些人会将我们视为“追救护车的人”——我们总是在事件发生后（泄露、损失等）跟进，被要求在出现问题后进行修复，介入解决他人的疏忽。或者，我们可能被视为本质上的保险销售员，建议采取特定的方法（策略）以在事件发生时降低风险并保护组织，同时没有明确发生的概率，尽管影响可能是非常具体的。过去几年中数据泄露和事件发生的数量足以提供大量的真实案例与你的组织分享，立场是“若非你所拜的神佑，轮到我们”。换句话说，如果我们不实施以下安全控制和保护措施，这种情况可能会在我们身上发生，我们并不希望那样，对吗？\n\
  \n\n\n\n\n`ISM` 工作的一个关键基石是构建一套适当的信息安全策略文档体系。第一个巨大的障碍是确保目标受众理解，“安全策略”本身并不是单份文件，而是一系列相关的策略、程序和指导性集合，这些内容随着时间的推移而不断构建，并持续进行审查和补充。这是一项持续的任务，因为维护记录和文档始终是一项艰巨的工作，而且很少获得使其产生意义的持续关注。\n\
  \n作为一名职业 `ISP`，请投资购买关于这一特定主题的书。市面上有很多优秀的书籍，其中一些已在本书末的参考文献部分中提到过。一个特别好的资源是托马斯·帕尔蒂尔（Thomas\
  \ Peltier）。他描述了“策略分级”，并将关键的信息安全策略置于适用于整个组织的 `Tier 1` 级策略。`Tier 2` 策略存在于之下，处理与特定主题相关的事务（人员安全、业务连续性、访问控制等）。`Tier\
  \ 3` 策略被认为是针对特定应用程序或系统的。组织规模越大，你发现需要构建的文档越多，以创建你的 `ISMS`。这在维护方面需要大量的开销，以确保你为组织提供的指导得到遵循；这是必要的，以维护那些正在创建、存储、处理、委托给所有人并广泛共享的信息资产的安全性。\n\
  \n策略的创建需要进行风险评估，对现有策略的任何请求、计划或意图中的更改也是如此。这可能会对用户、业务流程或技术产生影响，这些影响需要被各方记录、解决并理解。根据策略（程序或指导）的范围，需要引入不同的团队，以形成变更控制或治理审查层级，这样你就不会孤立地在真空中独自撰写你的文档集。\n\
  \n输出产物必须是“活的”的，并且被所有人使用，以证明合规性。否则，审计中将不断出现关于未遵守策略的引用，这给人一种不安全的假象，而实际上，可能是因为策略编写错误，需要进行修改以更恰地符合组织的实际工作实践。\n\
  \n强制执行议程的一种方法是确保员工对与其最相关的信息安全策略进行签字。例如，他们确实应该就“我已阅读并理解……”等条款，对电子通信使用情况（电子邮件、博客、社交网络、即时消息等）以及远程/居家/移动办公进行签字。这应该与他们的人员档案挂钩，并在可能的情况下，确保所有员工每年都能获得一份个人信息安全计划，其中将包括参加年度意识简报的奖励、对策略的遵守、密码更改的应用等。你应该能够看到这可以链接到你对指标和衡量的要求上，这样你就可以开始向高级管理层证明整个安全策略体系的有效性。你显然的目标是实现对所有全职员工近\
  \ 100% 的覆盖，外加上对临时工的某种程度的覆盖。\n\n从你作为 `ISM` 的角度来看，你需要法律、人事、设施管理、IT 等部门的投入——这取决于策略文档本身的情况和意图——且应涵盖创建和审查阶段，并在发布和实施之前。这意味着在一个可能需要与这些方达成的时间线内，有一个计划的文档交付方案，并在\
  \ `ISMF` 或对等机构的议程中列出一项任务，用于审查准备好进行修订、批准或发布的最新文档。\n\n### 策略文档标准\n\n策略文档本身需要简短有力、直接且切中重点。它们是组织对特定技术、人员或流程问题所采取立场的清晰声明。它们应该有程序性文档或控制措施或标准的支持。组织对于其选择的文档结构有不同的术语，在可能的情况下，你需要与之产生共鸣，以便使你的工作被视为符合“公司内部风格”。安全策略文档不应被隐藏在\
  \ IT 部门中。\n\n作为一个警告，要警惕“政策致死”。很容易掉入为每种情况都创建一个策略（或假设应该写一个）的陷阱，而不是确保有一项更高层次、全涵盖的、与技术无关且由适当的程序文档、控制标准或良好实践指南支持的策略。有些人利用感知到的缺乏策略所有权作为停止进展的方法，即等待责任的决定。如果你受限于对遵循协议的无休止需求，那么这可能会阻碍动力。因此，文档的编写需要保持简洁，并且应该尽快落实书面工作。\n\
  \n### 管理企业防病毒软件\n\n普通电脑用户知道他们应该有一个防病毒程序——他们甚至知道应该定期更新它，即使他们并没有真的这样做！所以，对于一个拥有大量用户的组织来说，没有理由在这一领域不采取有效的措施。然而，市场上有许多不同的产品，由于系统设计的复杂性（恐怕要回到\
  \ `OSI stack` 谈起），所选企业防病毒程序与部门应用程序之间可能会产生冲突。这种经历可能会导致你的系统暴露在风险之中，因为与其计划更新到新的更安全的企业防病毒版本，你可能不得不“回滚”到旧的且从意义上说安全性较低的版本，以维持现有企业应用程序的功能。这通常是由于遭受此类冲突的企业应用程序的第三方供应商已经理解了这些冲突。正如我之前所说的，我们不应该在\
  \ IT 行业忍受这些，但这似乎是某种不成说设置的一部分，这种设置最终让我们付出了沉重的代价，并导致我们的信息资产保护不足。\n\n### 标准构建与镜像\n\n\
  标准构建的实施是一种 IT 策略，旨在确保基础设施中的所有台式电脑、笔记本电脑等以整体方式进行管理（通过一个供应商的一份采购协议购买），并遵守所有要求的安全相关策略。这可能需要在这些“标准构建”上投放新的“镜像”——直接更换机器无疑是最简单的选择，但由于缺乏可用资金，这种方法可能是不可行的。\n\
  \n\n\n\n\n取决于你资产的规模，在所有机器上实现这一目标显然需要花费大量时间，因此你需要制定出一个流程。在整个网络中部署升级后的软件是最明智的方法，即使用技术解决方案，而不是基于人员的解决方案（即你必须访问每台机器的方案），但许多组织在通过部署适当的技术解决方案来提高效率方面仍然有很长的路要走。\n\
  \n尽管你制定了最周密的计划，由于不同系统的变异性，标准的构建方法可能并不适用于每台机器或每一个实例，因为不同应用程序的组合可能会导致系统运行中的冲突。所以，当你花时间开发了想要部署到所有桌面电脑的“镜像”后，如果它出现问题，你该怎么办？在本书背景的实际情况下，我们发现某些企业系统中的宏设置导致镜像部署出现问题；更因为，事实上，一旦某个用户有了糟糕的体验，就会影响其他人的标准构建。困难之一在于，虽然预期的系统可能处于实施计划中，但在当前与未来之间可能存在时间滞后，导致用户对系统感到沮丧。你需要细致地管理沟通，并确保快速解决任何小问题。为了确保用户不会因为系统故障而感到沮丧，在所有机器上实施新的“镜像”可能是必要的，但任何负面影响都需要被迅速地消灭在萌芽状态。\n\
  \n### 安全评估工具\n\n微软基线安全分析器（`MBSA`）被证明是可用工具中一个非常有用的工具。`MBSA` 是微软发布的一种工具，通过评估缺失更新以及\
  \ `Windows` 组件（如 `Internet Explorer`、`SQL Server` 和 `Microsoft Server`）的安全设置来确定安全状态。在发现企业应用程序的宏设置问题时，这是一个很好的起点（我们在第\
  \ 1 章 中提到过这一点）。拥有资产状态的视图是非常价值的。你的资源可能分配得非常薄，以便在交付时完全符合策略要求，使任务变得更容易，你可以根据所收集的证据来论证你的方法。\n\
  \n### 软件许可\n\n在这个过程中也必须管理软件许可。在部署新镜像时，这也是一个关键问题。你需要了解每个团队、部门、机构等每个应用程序的许可当前状态以及要求——这不仅从运营角度来看，显然从法律角度也是如此。遵守所有要求并了解许可期限和用户数量，都是管理软件资产所需的元素。\n\
  \n### 密码管理\n\n在第 2 章 中，我们重点关注了密码管理，与其他所有信息安全元素一样，它们是持续且重复的。在密码变更计划中，有必要处理各种设备和用户，并管理人为和技术响应。为了实现这一点，需要支持确保对资产（移动或其他）的集中控制是可能的，以便设备可以被召回。这对于确保升级得以应用非常重要。\n\
  \n作为沟通流程的一部分，有必要访问各个团队、部门和机构，并在他们的定期更新会议中进行简报。尽可能将信息安全带入议程是有价值的，这样人们就能了解你的计划以及变更计划中即将发生的内容。更重要的是，这是一个倾听员工并了解他们的顾虑的机会；你可能会发现，例如他们仍在手写密码（！）或者他们没有足够的锁柜——不过我稍会在书的其他部分回到这一点。\n\
  \n### 消费者化\n\n近年来，消费者化已成为一个行业议题，但我至少从 2009 年起就在直接处理它。长期以来，用户一直想要拥有自己移动设备的所有功能和设施。然而，他们缺乏对这从法律角度可能如何影响组织的认知。例如，在某些情况下，使用自己的设备（`BYOD`）将违反交通法——你不应该在开车时操作移动设备。\n\
  \n作为一个组织，你通常有一系列必须遵守的义务，并且这些义务应该是记录在案的。即使你没有遵循如 `ISO27001` 之类的框架，你需要了解你运营所在的法律环境，并向你的用户群体解释，他们的家庭体验可能与工作技术体验不同（更快等），但为了管理通常跨越广域网并涉及大量个人的基础设施，这是必要的。\n\
  \n### 第三方管理\n\n第三方管理有多个层次。你可能有许多第三方软件供应商为你的组织提供各种产品。根据这些产品的性质，并非所有的都与安全直接相关，而且行业内仍有很多\
  \ IT 提供商在信息安全方面的理解远远落后。因此，在这种情况下，`ISM` 的角色是担任教育者；了解合同条款和条件、购买意图以及交付预期，这一切都在保护系统最终设计用于支持、处理、存储、共享、传输等信息资产的范围内。\n\
  \n所以，当我们发现某个第三方通过电子邮件发送带有产品补丁的 `zip` 文件，而这些文件被隔离为未知文件时，导致了两种不同的响应。作为一个公共部门供应商，必须的问题是，通过电子邮件发送明文（未加密）安全更新是最合适的方法吗。他们本应该更明智并提供更安全的支持服务。当政府相关供应商仍然倾向于“只说不做”时，这给安全呈现出一种负面的形象。\n\
  \n### 审计日志管理\n\n审计日志很少被审查——为什么？谁在查看这些？谁应该查看这些？频率是多少？价值何？\n\n\n\n\n人们普遍认为，产生的数据量可能已经大到无法以任何价值的程度对其进行实际分析。然而，在某些情况下，系统所有者并不知道系统是否正在被维护，或者是否产生了任何价值的内容。这必须是\
  \ `ISM`（信息安全经理）需要发力的另一个领域。\n\n有许多层级的审计日志需要跟踪，进行某种程度的优先级排序可能是值得的。从包含最敏感信息资产的系统开始，并寻求为它们提供最佳保护。之后，针对那些日志能够为管理层提供有助于集中资源的数据的系统——系统登录、失败尝试、入侵防御系统（`IPSs`）、入侵检测系统（`IDSs`）、防火墙、路由器和交换机。有大量数据需要收集和分析，以真实反映你日常漏洞水平以及对补丁管理、更新和维护的真实需求。\n\
  \n## 漏洞管理\n\n管理漏洞扫描的运行是任何持续 `ISM` 职责中至关重要的一部分，阅读外部提供商提供的漏洞报告令人担忧，因为其结果往往是完全相同的：\n\
  \n- 识别出 `SANS` 前 10 个或前 20 个漏洞（因此，已知漏洞并未通过已知解决方案得到解决）。\n- 深度防御（`Defence in depth`）有所帮助，但需要维护——如果防火墙和反向代理单元按预期运行，但管理它们的人在内部没有感到支持，那么问题仍然存在。并不总有时间确保防火墙和反向代理单元得到适当的维护——无论是在技术上，还是在负责管理机器的人员所需的技能\
  \ set 方面。这是 `ISM` 需要意识到的重要点，以便帮助影响预算支出或未来培训需求分析的资源规划，因为这些领域涉及安全相关工具和技术的系统管理员职位的人员。\n\
  \n我们将在第 6 章 中回到此问题。\n\n## 云计算\n\n当你成为更广泛的连接网络的一部分时，会产生一个问题：如果你自己的内部基础设施的任何部分，或者远程地点和用户没有遵循你为了妥善保护信息资产而寻求实施的必要安全协议和控制措施，那么你本人可能被视为一个漏洞。此类架构漏洞需要持续被识别，并制定计划来纠正、修改、威慑、反应和保护你所负责的信息资产。\n\
  \n此类云的影响现在已经有了更充分的理解，我们所有人所面临的持续且持久的互联性的影响将随着时间的推移继续显现。我们只能希望这不是以用户、公民或其个人数据为代价，尽管影响的第一迹在\
  \ 2014 年通过 `iCloud` 丢失名人个人信息等事件中已经出现。最终，`云` 仍然是某处数据中心中的硬件——技术格局仍然存在物理元素，它仍然需要端到端的安全。事实上，`云`\
  \ 在安全方面的投入和维护比传统 IT 大得多，因此很难看出这种财务节约模型实际上如何站得住脚。\n\n## 项目管理\n\n当涉及到管理大型基础设施相关项目时，由于多年持续缺乏支出，需要大量的投资，`ISM`\
  \ 经常面临着不断证明这些需求合理性的需要。这本身就分散了执行实际必要变更的本职工作的注意力。坦率地说，在组织中玩政治可能是极其乏味的。然而，某些时候这是必须拥抱的必要恶！经常会听到“IT\
  \ 不懂业务”的呼喊声，而你作为 `ISM`，不想被划入圈子一而同仁。\n\n如果你缺乏管理层的支持或理解，可能需要将战斗扩大到直接领域之外。你需要找到合适的受众和语言以实现预期的目标。始终提供选项，并在许多方面，寻求将你想要的嵌入到选项之中。\n\
  \n### 安全意识主题\n\n每个月考虑一个适合该季节的主题，并利用你的安全努力来确保。这有助于你保持最新状态，并能够与同行进行交流。与行业进行对比为管理层提供信心。\n\
  \n始终利用本月出现的任何新闻故事。作为 `ISM`，每天都有这类故事出现在你的办公桌上，但对于用户来说可能根本不会注意到。事实上，新闻中出现了许多涉及安全的故事，但媒体并没有刻意以这种方式呈现。但你可以发现其中的安全元素——无论是人员问题、物理安全问题、技术问题还是特定的安全问题。让你的灵感迸发吧！\n\
  \n本月的安全意识主题可以结合 10 月结束的万圣节，这是一个在全球庆祝的节日。考虑到安全世界中大量的恶意软件、间谍软件和恐怖故事，有足够的素材让你挂 ISM\
  \ 的帽子，只要你有足够的创意！\n\n### 章节总结\n\n本章讨论了作为 `ISM` 日常活动的若干标准主题领域。它还引入了每月创建安全意识主题的想法，以便让主题在组织内保持生命力并不断变化，确保信息不会过时。\n\
  \n# 第 4 章：11 月 - 远程有多远？\n\n## 引言\n\n在你担任 `ISM` 的职业生涯中，有时你真的需要停下来说“等一下”，并问自己理智和逻辑去哪儿了！\n\
  \n我们往往很容易把事情变得过于复杂。我们寻找的答案往往简单到我们最初根本没有考虑过，而且也因为其简单性而难以相信。\n\n## 位置、位置、位置\n\n如果你采用特定的网络分段方法，可能会将大量用户标记为“远程”，这意味着作为最佳实践安全管理控制的一部分，需要对他们应用双重身份验证。管理核心位置之外的每一个“远程用户”是一项巨大的开销，应该尽可能避免。将所有用户纳入整个网络视图，以便所有用户都被视为“整体”，而无需管理发放钥匙令牌的额外开销。\n\
  \n\n\n\n\n# 组织版图与基础设施\n\n你需要了解整个组织版图，以便你能够根据数据敏感性、用户数量、所用资产类型、使用的软件以及硬件要求，从面上以有意义的方式进行绘图。每个地点都有许多考虑因素。然而，构成你基础设施一部分的每个独立建筑位置都应该被视为网络上的一个“节点”，而不是“远程”位置。只要你知道它们在哪里，它们就不是“远程”的。由于它们是静态建筑，你可以对其中包含的配置项实施某种程度的控制，包括每个位置管理的端口数量。在涉及\
  \ IT 部门如何建立连接时，你需要消除任何“他们与我们”的对立情绪，因为诚然，你们实际上都是同一个组织的一部分，除非根据法律规定实体之间有明确的。\n\n##\
  \ 第三方\n\n与外部第三方合作是真正困难所在之处，特别是当需要第三方在你的内部地点工作时。大多数挑战可以通过制定和签署适当的第三方访问协议或数据共享协议（或两者兼顾）来解决。到目前，已经有许多优秀的案例可以参考，因此不缺资源来帮助解决这些难题。但你仍需要更广泛地与法律人员、设施管理等人员接触，为所有相关方寻求最佳解决方案。\n\
  \n## 创新\n\n创新、创新、创新\n\n你经常发现你的组织内部某些领域正在进行非常出色且具有创新性的工作，发现这一点非常重要。如果你散发出开放和积极的态度，人们会更多地让你参与进来，并确保你处于各种决策循环中。在一个项目中，事实有一项极其有趣且突破性的公共部门工作正在进行，但面临着安全挑战。因为我一直在到处跑，积极地宣传安全意识，相关人员感到放心，认为他们可以与项目办公室对接并获得所需的支持，以确保他们自己的项目也能成功。他们面临的最大挑战是第三方以及上述的远程办公挑战，大多数问题都是通过仔细制定必要的协议得以解决的。\n\
  \n对于 ISM（信息安全管理）而言，困难通常在于此类项目在 ICT 参与之前就已经启动了，这是由于长期的预期或早期与知识缺乏或支持缺乏相关的挫败感。如果不积极参与创新项目（这注定会发生，因为事实就是如此），将面临项目团队无法意识到的风险，因为他们中没有人具备必要的技能组合来考虑基于数据和信息的风险。\n\
  \n# 信息标记\n\nISO27001 长期以来一直建议通过对信息资产进行分类来处理信息处理。在英国公共部门，信息资产有多种标记选项（也称为标记）可供选择，这些在每个层级都需要特定的处理方式。例如，`1998\
  \ 年数据保护法`（`DPA`）中定义的敏感个人数据等同于政府术语中的受限（`restricted`）数据，需要以特定方式进行处理。在美国，这通常被称为个人身份信息（`PII`），其定义范围更广，涵盖了更多元素，因此你需要了解哪种对你的整个组织最适用。\n\
  \n这是提供适当信息安全中一个众为人知的困难因素，需要大量的思考和考虑。\n\n## 教训总结\n\n在执行过程中维护教训日志（`LLL`）是一项非常有价值的练习。确保将其编写记录并进行演示更有用，这样就可以与他人分享。这是良好管理的正常部分，并且可以从中获益。\n\
  \n### 表 4：教训日志\n\n| 问题领域 | 描述 | 备注 |\n| :--- | :--- | :--- |\n| 尽早开始 | 组织将工作压缩在由“如何应付”的心态驱动的活动中，并在两个月的窗口期内，仅为了连接基础设施而做了“最小化”处理。这导致\
  \ ICT 工作人员压力过大、紧张且工作滞后。它让用户对变化感到困惑，并对需要解决的小问题感到沮丧。 | 如果一个项目看起来很难，那么它可能确实很难——但恐惧不是推迟开始的良好理由。通常会有资源提供如何最好应对“整个大问题”的建议，而且他们需要尽早接触并更多地依赖技能转移。结论：尽早开始，并为项目团队提供更多支持。确保尽早获得领域知识以评估任务规模。\
  \ |\n| 协作工作 | 包括尽早让客户参与。但没有让所有人参与！ | 一旦团队受到激励并获得充分授权，感到自己的贡献受到重视和欢迎时，他们的活动水平显著提高，并对项目的最终成功产生了巨大的积极影响。尽早让客户参与项目非常有益。事实上，大多数项目并不是孤立的活动，因此始终需要与所有团队成员互动并保持信息畅，即使他们不在特定的项目团队中。此外，为项目团队提供一种参与感，意味着他们有某种凝聚在一起的东西（好吧，我们的部分是零食激发的，但确实有帮助！）\
  \ |\n\n\n\n\n这必须根据任何一周内损失的实际天数来计算；如果你在紧迫的时间范围内运行项目，这将是不可持续的。单周最糟糕的损失达到了 32 天！你本以为这是显而易见的。然而，如果项目经理对项目团队成员的经理没有影响力——或者没有积极的管理支持来承认团队成员需要额外时间来妥善完成安全任务，而不是在日常工作之余完成它们——那么管理单点故障将变成一项无法完成的任务。因此，在第一周就要设定规则和边界，并确保承诺得到遵守，优先事项得到重视。\n\
  \n### 动能丧失\n在几情况下经历了动能丧失（`LoM`）。这是由于文化导致的，这种文化倾向于将整个过程视为与日常业务（BAU）完全独立的项目，尽管所遇到的每一个障碍都是由于\
  \ BAU 配置错误导致的。特别是，一次成功的延期申请（即外部截止日期延期）导致了 `LoM`；夏季休假期间出现过 `LoM`；在获得合规性批准后没有继续关闭问题清单上的项目，又导致了进一步\
  \ `LoM`。\n**建议：** 确保管理支持是一致且持续的。\n\n### 项目资金可用性\n如果没有执行层批准的资金注入，这个项目将无法成功。只有在外部招聘的\
  \ `ISM` 付出巨大努力、准备了各种业务案例证明性文件，并交付了执行层简报和演示后，资金才获得批准。\n**建议：** 确保负责交付重大项目的人员拥有足够的资源；如果没有，则只让具备必要技能的人员面对执行管理层，并且他们能够使用产生适当共鸣的语言进行交流。\n\
  \n### 理解更广泛的影响\n在某个阶段，你必须理解 IT 是运行在“七层架构”之上的，深层安全基础设施改进项目通常会跨越所有七层交付成果，以为网络中传输的信息性质提供必要的保护水平。\n\
  **建议：** 确保在开始时记录影响范围和可能的覆盖范围，并随着格局和需求的不断变化和正式化，持续进行记录。\n\n### 需求的解读\n这与学到的“更早开始”教训有关，因为实际上，更早的开始本可以采用首选解决方案，即将所有需求应用于整个网络，而不是某个分段。无论采用何种技术解决方案，结合当时的外部顾问建议，都让组织留下了大量工作来维持预期的合规性。这与“缺乏技术技能”（下文）有关，由于缺乏必要的内部技能来预见潜在的陷阱，存在某种“盲人摸象”的成分。\n\
  **建议：** 确保尽早获得正确的技能组合。（这有点像先有鸡还是有蛋的困境，因为如果你不知道自己需要某项技能，你就不知道，对吧？有人想谈谈唐纳德·鲁姆斯菲尔德吗？）\n\
  \n### 缺乏记录的流程\n由于人们没有遵循现有的可用记录流程，事情就变成了凭空和猜测。在压力下，这导致了错误，需要花费更多时间来解决。（*另见“自下而上的决策”*）。变化的节奏和规模意味着行动是“临时采取”采取的。\n\
  **建议：** 确保所有区域的所有已知 BAU 任务都有记录的程序——在程序不存在的情况下，将其作为项目交付物构建到项目之中。所有更改都需要通过变更请求流程提交，以便得到妥善跟踪。\n\
  \n### 缺乏服务器管理\n服务器没有打补丁也没有保持更新。对于服务器“集群”，没有明确的所有权和日常维护。服务器的状态、缺乏所有权和妥善管理，每天使这些信息资产（包括用户的数据数据）的准确性、完整性和可用性面临风险。\n\
  \n缺乏服务器管理意味着服务器没有更新到可以重新利用的状态，因此必须购买新设备，并在通知不足的情况下仓忙推出，没有进行必要的加固；这幸运地被发现是一个需要解决的问题。这导致了双倍的工作，这些精力本可以花在其他地方。这导致任务比预期的要长，每个安全控制元素变得更加繁琐。\n\
  到底，服务器是组织有责任保护的数据资产的守护者。\n**建议：** 确保补丁管理是基础设施管理中的一项积极职责。\n\n### 缺乏 SLA\n服务水平协议（`SLAs`）需要在服务部门与\
  \ IT 之间、IT 内部团队之间建立，以相互支持并对请求提供预期的服务水平（而不是仅仅忽视或耸耸肩）。\n**建议：** 记录的 `SLAs` 有助于所有人设定并可能符合（有时超出）预期！\n\
  \n### 用户缺乏数据所有权、管理和优先级\nIT 最终要对本质上并非他们制造的问题负责，但这些问题是用户的责任。这与绿色 IT 工作也有联系，因为每次向你的集群添加另一个服务器不应该是答案。\n\
  **建议：** 需要进行数据清洗——特别是迁移到新系统时。带着错误数据迁移不如清洗要好。这里与文件管理有关，并需要相关培训。需要在服务器上实施正确的 `RM`\
  \ 文件计划结构（理解这说起来容易做起来难！）必须鼓励用户对他们每天创建的数据承担更多责任。\n\n### 缺乏角色画像\n用户访问权限目前没有妥善管理，这需要解决，以便未来可以根据预期的访问权限、许可、映射等将用户组一起迁移。\n\
  **建议：** 如果开展了角色画像调研，就可以减少用户的干扰——即识别谁在执行什么功能、在哪里执行、以及他们完成工作需要哪些系统访问，基于“按需”原则。\n\n\
  ### 缺乏服务台管理承诺\n需要向整个组织的用户“推送”信息，说明由于特定的项目工作负载，服务台的来电量将会增加，请保持耐心。在没有服务台自身代表适当参与的情况下，这很难实现。\n\
  **建议：** 确保 a) 服务台有足够的人员应对项目的起伏，以及 b) 你们对用户进行批量沟通，让他们意识到虽然他们可能正在“尖叫”要求解决，但实际上存在一个高于他们自身需求的运营优先级。\n\
  \n\n\n\n| 问题描述 | 风险描述 | 缓解策略 |\n| :--- | :--- | :--- |\n| 确保及时订购设备 | 由于延迟订单交付此项目所需的大批量\
  \ PC，导致了时间线后移的巨大风险——尽管从一开始就知道这是一项需求，并且提前知道了供应商的交货周期。 | 确保在项目范围内尽早下订单——尽管这在最初会让数据看起来看起来很惊人（即前期支出巨大），但至少你就可以在确信已拥有可用设备的情况下，规划设备的部署计划。\
  \ |\n| 桌面“镜像”问题 | 桌面镜像中包含了一些不需要系统，而某些系统又遗漏了。目前尚不清楚是谁进行了用户验收测试（UAT）以及为什么会发生这种情况，因为“客户”侧有人已经对镜像进行了恰当的签字确认。这是“自下而上决策”的征症——见下文。\
  \ | 确保服务部门对他们计划实施的任何内容进行适当的用户验收测试并签字。 |\n| 合同中缺乏对数据保护和安全问题的识别和引用 | 第三方供应商始终未能通过适当的合同安排得到充分约束，以解决隐私问题（数据保护和安全）。\
  \ | 确保所有第三方供应商都受到解决隐私问题（数据保护和安全）的适当合同安排的约束。与采购人员合作，确保在合同以及本地层面解决此问题。 |\n| 缺乏软件许可管理\
  \ | ICT 人员和负责的信息资产所有者无法明确谁对桌面上的软件拥有访问权限（或他们应该拥有哪些访问权限）。 | 确保你有一个完善的配置管理系统，记录所有硬件、软件和信息资产，以便对这些进行适当的识别、管理、保护和控制。\
  \ |\n| Windows® 对脚本采取字面意思 | 一名智能 ICT 开发人员编写了一个脚本仅复制 A–J 的所有用户，但 Windows® 认为自己比程序员更聪明（！），只复制了以\
  \ A 到 J 开头的文件，而不是以 A 到 J 开头的用户下的所有内容。而且，对于某个用户来说，它随机抓取了一个六年前的邮件签名档，导致其他用户在很一段时间内看不到他们的\
  \ `.pst` 文件或地址录。 | 确保有时间从开发角度理解脚本语言中书面文字的影响——但也要确保有时间对系统升级进行测试。 |\n| 在系统中嵌入密码是一个坏主意\
  \ | 嵌入密码需要尽早识别，因为一旦执行了要求每 90 天更改一次的密码管理策略，就会增加大量的开销。密码已被嵌入在 Access® 数据库中，以及外部提供的应用程序中。\
  \ | 确保整个组织内的应用程序和系统已在要求的密码规则内得到识别和处理。 |\n| 用户迁移问题——权限损坏和权限过度 | FAF =文件和文件夹——在管理用户从网络一个区域迁移到另一个区域的过程中，权限是一个巨大的问题。用户移动导致了服务器数据集和位置、映射驱动器和共享文件夹出现不匹配。由于用户迁移发生的方式，共享区域和主目录中的权限损坏，导致操作人员无法像往常那样解决问题，因为他们不具备所需的权限。这需要一些时间来理顺，而项目团队成员的日常工作中并没有被留出这段时间。\
  \ | 在进行大规模系统或服务器迁移项目时，尽可能鼓励服务部门为团队和服务的共享区域创建一个新的、整洁的文件结构——识别谁需要访问哪些文件夹。从上到下应用新权限（并在跨越文件夹结构中进行级联应用）。\
  \ |\n| 缺乏技术技能 | 在没有 IT 或信息安全（InfoSec）官员每天与 ICT 同事打交道的情况下，跨现有技术领域翻译安全问题被证明非常困难。关于风险、影响和后果缺乏知识传递，如果没有这些知识或不让这些技能随时间推移而发展，许多\
  \ ICT 成员很难意识到挑战的潜在规模。 | 确保在你们所运营的 ICT 布局中有能够进行前瞻性扫描的人——无论是从技术角度还是安全角度——这样使两者最终变得更加同步，而不是相互竞争。在交付\
  \ ICT 策略和确保安全贯穿其中的过程中，真的没有必要产生分歧。 |\n| 备份/恢复问题 | 在恢复 `.pst` 文件时出现问题。这是服务器上的一个技术资源问题，需要得到解决，以确保项目团队在后期能够成功迁移大量用户。\
  \ | 定期测试支持应用程序，以确保它们按预期运行。当你输入并阅读它时，听起来很显而易见——但在忙碌的 ICT 团队现实中，很容易忽视这些显而易见的事——所以记录下来！\
  \ |\n| 存储复制问题 | 提供的存储基础设施出现问题，因为安全问题意味着有必要进行手动复制和恢复。这再次增加了项目延迟，并在更广泛的部署之前需要解决。 |\
  \ 如前所述，确保可用资源按预期运行——没有安全冲突——因为这些恰恰是让人对安全产生反感的问题。 |\n| 缺乏 SLA | 服务部门与 ICT 之间、ICT\
  \ 内部各团队之间需要建立 SLA，以相互支持并在响应请求时提供适当、预期的服务水平。 | 确保存在记录在案的 SLA，因为有助于大家设定自己的标准。 |\n\
  | 缺乏受控的用户注册和注销 | 需要确保网络上的所有用户都获得了进入那里的适当授权，并且在系统和建筑访问方面被记录，并在他们的整个雇佣期间进行监控和控制，直到他们最终离开。还需要建立处理长期病假、职业假等机制。\
  \ | 确保在内网（或类似平台）上有`入职`表单和`离职`表单（以及支持这些表单的流程）。不断有设备被添加到环境中（通常由员工直接添加），这些设备需要考虑进`离职清单`中，特别是。\
  \ |\n| 在测试服务器上克隆实时用户数据 | 测试服务器在很大程度上是实时服务器上存储数据的克隆，这完全违反了行业标准最佳实践、数据保护法以及英国标准 BSI\
  \ BIP0002:2003《系统测试中使用个人数据的指南》。 | 遵循行业标准最佳实践——1998 年数据保护法和 英国标准 BSI BIP0002:2003《系统测试中使用个人数据的指南》，确保不要在测试情况下中使用实时数据。\
  \ |\n\n\n\n\n\n| 缺乏权限管理 | 未对 ICT 用户和通用账户进行审查，以证明其创建的合理性。这与角色配置的需求有关。 | 确保用户根据“最小权限”和“按需知晓”原则获得其所需的系统访问权限，而不是复制上一个已知的易用用户。\
  \ |\n| 自下而上的决策 | 由于高层 ICT 管理层对项目、强制性要求以及有关信息安全管理的基本良好运维预期缺乏明确支持，项目团队不得不不断做出本应通过管理风险评估过程完成的基础决策。这让每个人都感到孤立无援——但最终必须采取行动。不采取行动不是一个持续的选项。高级信息风险所有者（SIRO）必须具有实际意义。\
  \ | 确保执行管理了解其对组织内部负责的信息资产进行必要保护的责任。确保高级信息风险所有者的角色由理解信息风险管理要求的人员履行。 |\n| 永远不要错过显而易见的事！\
  \ | 直接访问互联网影响了所有基于 Web 的系统。防火墙规则集的更改对用户产生了重大影响，并导致由于不安引发的售后服务台支持电话增加。 | 确保分阶段、分步骤提供良好的沟通，以便预计划事件，并确保所有人都对系统和基础设施变化的潜在影响做好准备。\
  \ |\n| 缺乏策略执行 | 这是许多领域的一个严重问题。特别是，由于缺乏执行，用户可以随时随地下载他们任何想下载的内容。这在某些情况下导致了病毒进入机器和网络，并在桌面式电脑和笔记本电脑的支持方面造成了维护和管理问题。如果没有一个确定的（而不是“无限的”！）软件库可供参考，就不无法断性地告诉用户哪些软件下载是可以接受的，哪些是不接受的。\
  \ | 确保提供清晰的策略声明以及适当的用户指导支持。还需确保建立指标和衡量标准，以确保策略得到遵守且用户执行显而易见——以及不遵守策略的后果。 |\n\n###\
  \ [#12_ch04.xhtml#not_1]\n虽然服务器管理问题在 2009 年就已经出现，并且在当时已经足够令人担忧，但在 2014 年相同的情况仍然存在，说明教训没有被吸取，改进也没有落实。令人沮丧的是，IT\
  \ 行业几乎没有表现出对适当的服务器管理作为持续环境健康成熟度的一部分的需求。\n\n### 安全意识主题\n本月的信息安全主题可以利用 11 月包含篝火节（紧随万圣节之后）这一事实。利用“记住，记住\
  \ 11 月 5 日”的口号，你可以以此切入，传递围绕“记住，记住……你的可移动媒体设备！”或“记住，记住……每天离开前清理你的办公桌！”的信息。或者更进一步，采用与烟花相关的主题。\n\
  \n### 章节总结\n上述教训汇总了书中到为止概述的经验，并解决了许多反复出现的主题。如果信息安全没有从底层开始构建到组织中（即确保它是结构的一部分），那么取得进展将是一项艰巨的任务，使其成为\
  \ `ISM` 的一项持续性任务。如果你足够幸运，你会有认真对待这些教训并能够支持你提供支持的管理层。\n\n接下来的章节将详细阐述这些要求。\n\n# 第 5\
  \ 章：12 月——噢，为了另一个 sake\n\n### 安全改进计划\n在特定情况下，提交给外部审计员的内容并不典型。`SIP` 正在快速推进。差距涵盖了人员、流程和技术的所有方面。\n\
  \n一旦解释，答案（解决方案/控制措施）非常简单，也就是说，并不涉及真正的火箭科学。这就是真实信息安全之美，以一种用户可以共鸣的方式呈现出来。解决方案简单且易于理解。\n\
  \n### 传真管理\n在许多组织中，传真（fax）通信仍然是最可靠的媒介（在某些情况下，是最安全的）。然而，为了确保一致的安全水平，可能需要传真处理程序作为提醒人们如何使用该介质的机制。\n\
  \n**表 5：传真——可能出现的问题**\n\n| **问题描述** | **缓解措施** |\n| --- | --- |\n| 个人错误转抄了传真发送号码，导致接收者的敏感个人数据被发送到了私人住宅。该住户通知了组织该事件并（谢天地）粉碎了文件。\
  \ | 建议对泄露进行记录以供审计。指示员工在传真敏感个人数据之前确认传真号码，并致电给接收者以确认收到。向所有员工更新关于使用传真的信息安全信息。 |\n\n\
  再次构建图像\n\n\n\n\n由于变更计划中包含许多关键交付物，其中之一——即在所有桌面电脑上分发安全镜像——一直是一项挑战。这些困难往往不是由我们造成的。例如，我们最终不得不禁用\
  \ `JavaScript™`，因为来自第三方供应商的软件无法与其协同工作，并且它与其他应用程序产生了冲突。正如之前提到的，这是一个更大问题的一部分，因为这是一家广为人知的行业第三方供应商，显然没有使用其他关键提供商提供的补丁和软件更新来升级其软件，以解决已知的漏洞。因此，你最终不得不降低安全性，以通过关键的企业级系统运行一些最基础的服务。\n\
  \n这仍然是一个不可接受的行业现状，第三方供应商应该为此感到羞愧并做出改变——而且而不是以巨大的代价，特别是以公共资金为代价，因为多年来，他们已经通过巨额的持续维护费用掠夺了这笔资金。\n\
  \n考虑到约有约 300 家公共部门机构使用相同的软件这一现实，升级成本应该由供应商承担，而不是由每个公共部门机构单独承担。中央政府采购——以及参与强制中心化系统部署的人——应当提出此类诉求，并确保未来实现这些变化，作为英国保守党和自由民主党联合政府预期的预期节省和改进的一部分。\n\
  \n2013 年 1 月，国家审计署（NAO）确认了政府减少 ICT 支出的倡议开始取得成效。2013 年和 2014 年实施了一项减少私营部门机构使用并整合供应商的重大计划，并要求所有供应商在期间内大幅降低其服务提供的成本。然而，人们担心这将以真正的安全性为代价。\n\
  \n公共部门在重新谈判合同时必须变得更加强硬，并为其公民争取更好的安全性，因为他们每天全天候都在使用、共享、传输和处理这些公民的数据，而这些数据正存储并安置在我们国家各地各地这些不可靠的系统中。\n\
  \n## 物理安全发现\n\nISM（信息安全经理）需要理解物理安全的许多方面，而不仅仅是假设它们在设施管理（或你所在的对等部门）的控制范围内。\n\n在许多情况下，你会发现并非所有的站点（建筑、地点）都拥有存放电缆的锁闭柜。因此，需要对这些地方进行实地访问并加固，以维持那种“行动中的安全”的外在展示。\n\
  \n\n图 2：未锁的电缆柜\n\n`Figure 2` 所示的内容是通过对团队、科室或部门进行物理安全检查发现的，这通常是根据管理层的要求，在傍晚保洁人员在场时进行的。保洁人员通常非常有帮助。他们的流程可能包括锁上他们持有钥匙的所有房间的门，但如果没有钥匙，这显然是不可能的。在进行这些物理巡视时，经常发现本该锁上的门是开开的。这暴露了其他弱点，因为由于房间的连通提供了额外的访问机会，特别是当连接几个办公室的内部门没有妥善固定时。在可能的情况下，我成两人进行这些检查，这样一个人可以记录，另一个人拍照。视觉证据是你能想象的向用户和管理层展示其错误行为的最强大的工具。这等于在信息安全领域举起镜子，让他们看到哪里错了，并借此推出需要进行哪些改变来实现安全性的改进。这是切切实的，并能在改进信息资产保护方面为你带来即时的快速胜利，其重要性再如何强调都不为过。在保护网络安全方面所做的所有努力——服务器扫描等——都无法降低某人将不该放在桌子上的东西留在桌子上，供他人看到、拍摄或偷窃的风险。\n\
  \n鉴于如今手机摄像的普及，任何想要“赚快钱”的人都可以轻松通过物理安全漏洞渗透进你的组织，然后坐下来仔细读上好久，或者拍照发送给当地甚至国家媒体，并引起不小的轰动。\n\
  \n如果人们每天像对待货币一样，对他们每天处理的信息资产进行估值，那么他们可能会得到更好的保护。但这些物品太容易被丢弃，以至于鼓励持续的保护行为变得更加困难。信息的标记和处理可以在这方面提供帮助——确保对正在使用、存储、处理、共享、加工、传输等信息资产进行标记。\n\
  \n有许多文件应该被标记为“受限”并永久锁在柜内——而且钥匙需要经过注册和控制，而不是随地摆在外面展示。这将需要重大的文化转变和教育努力。\n\n因此，我们需要从个人责任开始——人们真的需要意识到他们需要积极参与保护和照看这些文件。这意味着在晚上将它们锁起来，然后妥善地隐藏钥匙。这意味着保持房间整洁，不要让纸板箱堆积，也不要将堆叠报纸优于堆叠文件。\n\
  \n在大多数情况下，钥匙被留在了大多数柜子、抽屉等处——在一次情况下，甚至在一个单元的抽屉里发现一个所有门钥匙的“堆积”，在廊廊的柜子上又发现了另一处堆积。\n\
  \n为什么总会有“设备”散落在周围？在你进入的任何办公室里，请放心，你会发现未使用的旧设备——也许有一两部需要退役的电话和一台打印机。现在有专业的电子垃圾回收公司在运营，这使得移除设备的任务变得容易得多，因此真的没有理由让杂乱。\n\
  \n此外，还要考虑可以获取的信息年龄。通常遗留着比“当年”更旧的文件。考虑到大多数机构应该运行一套带有记录保留计划的适当记录管理计划，留存超出即时使用范围的文件是不合适的，因为这些文件应该归档或销毁。ISM\
  \ 需要与他们的记录管理员紧密合作——如果存在这样一个职位的话。如果不存在，那么 ISM 需要将其作为职能的一部分承担，以便为组织的信息资产提供适当的范围保护。\n\
  \n你的任务部分是尝试进入同事的思维，帮助你解释为什么你认为他们所做的是错误的。在我的经历中，我见过一些有趣的优先级——在门附近的柜子架子上有一叠整齐的报纸，而文件却散落在桌面和架子上（全部可识别身份）。人们通常声称空间不足，然而`Figure\
  \ 3` 中的照片显示了到底有多少架空间。\n\n\n图 3：几乎空的柜子\n\n某些人似乎认为在空间用完时将文件夹放在地板上是合适的。为什么这会被认为认为是合适的呢？每个办公室都需要一个专门的人员每天晚上进行“巡查”，以防范这些信息陷阱。\n\
  \n\n\n\n\n正如我所说，进入这种心态是非常困难的。那么，`图 4`中的图片有什么问题呢？\n\n![](img/P107_01.jpg)\n\n图 4：机密废弃桶？\n\
  \n机密废弃桶应该是那种你无法伸手进去取回纸张的箱；它应该是可锁的，并且钥匙和访问权限应该受到严格控制。这就像是幼儿园所能想出的最好办法，而不是你在一个成熟且专业的组织中预期能看到的。但是，在这些问题从视觉上被指出之前，必要的改变就不会发生，因为态度会变成“我们一直都是这么做的”。\n\
  \n在我访问过的一间办公室里，竟然有人用超市推车来存放文件！我们已经进入了 21 世纪的第二个十年，但有些办公室运行起来仍然像 20 世纪 50 年代的东西。人们日常生活中忍受的程度简直令人惊讶。\n\
  \n要做好意料的准备——人们的办公桌抽屉里可能仍然藏着软盘。如果你没有读取这些数据的机制，那么保留它们真的没有意义。如果是这样，它们需要被安全地销毁——例如，粉碎。\n\
  \n任何废物的堆积看起来都不好——溢出的废纸篓绝对是不被鼓励的。第一个问题必须是“为什么纸张没有被回收？”然后检查内容，并考虑实际上它们是否应该被放在碎纸机旁或机密废物。同样，任何机密废物的堆积也令人担心，特别是当它们没有存放在锁上的门后面。同样，这让它很容易成为攻击目标；有人可能随机偷走一个袋，而不知道里面可能包含什么珍贵信息——但你永远不知道运气，这就是为什么它被称为“机会主义盗窃”。\n\
  \n\n图 5：等待收集\n\n### 物理安全解决方案建议\n\n*   尽可能建议办公室文件归档进行重新组织，以充分利用可用的存储空间。考虑到柜子里能找到圣诞装饰品、茶包和旧（超过保留期/本应归档）的纸张，空间危机很少像你让你认为的那么糟糕！\n\
  *   确保经常使用的文件在不使用时习惯锁好，并确保每天结束时桌子上不要遗留任何纸张。\n*   强制任何识别活体身份的文件在每天结束时锁在安全存储区域内。\n\
  *   与你的记录经理（如果有的话）合作，将不需要的文件移到适当的安全存储区域——外部存档存储或现场安全存储。\n*   确保每天结束时需要锁住的房间已锁好，并取出钥匙！\n\
  *   努力提高员工对信息安全问题的意识，以及向正确人员报告问题的重要性。\n*   安排以适当的方式移除所有冗余设备（电话、打印机、椅子、桌子——所有东西，不要有选择性，否则只会引起分歧）。例如，电子设备的移除应符合《废弃电子电气设备指令》（（*参见*\
  \ `[`en.wikipedia.org/wiki/Electronic\\_waste`](http://en.wikipedia.org/wiki/Electronic_waste)`）\n\
  *   确保每天结束时需要锁住的房间已锁好，并取出钥匙！努力提高员工对信息安全问题的意识，以及向正确人员报告问题的重要性。\n\n\n\n\n笔记本电脑用户仍然倾向于将大量信息保存到机器硬盘中，只有当机器本身在启动时进行加密时，这种做法才是合理的。在英国，这一点尤为重要，因为信息专专员办公室（Information\
  \ Commissioner’s Office）对这一领域高度关注。鉴于过去几年所经历的数据泄露和信息损失的规模及其产生的影响，全盘加密也成为一种正在全球范围内蔓的预期。\n\
  \n新款笔记本电脑层出不穷，一些最新型号在设计时并没有配备 CD/DVD 驱动器。如果你是批量购买，就需要考虑这一点，并确保订购了正确的设备类型以满足用户的需求。这意味着要考虑他们的工作需求，而不是个人使用需求，因为在任何可能的情况下，他们不应该将设备用于个人用途。贵组织中的某些功能可能需要\
  \ CD 读写设备，而且你需要能够跟踪正在写入的信息，因为假设是这些信息要么会被共享，要么会被存储。在这两种情况下，这都必须安全地进行。因此，你需要确定是否可以对此类数据的传输和/或转移任何类型的加密，并对刻录和共享的\
  \ CD/DVD 维护某种登记，特别是当你期望它们被还给组织时。这类问题通常出现在你编写的此类此类行动的政策或程序与现实世界接触时；维护此类政策可能很困难，因此你需要足够的灵活性来审查、重新审视并最终重写，以满足用户群体和组织的需求。一如既往，只要你能够为相关的敏感信息资产提供最佳级别的保护，你就不会出大错。\n\
  \n### 安全意识主题\n\n本月的信息安全主题应该明确结合圣诞节——关注送礼这一方面，以避免引起任何宗教反感。借用广为人知的““狗是一辈子的，而不仅仅是为了圣诞节”这句名言，你可以选择信息安全最佳实践的任何元素，道理都是一样的。也许是“备份是一辈子的，而不仅仅是为了圣诞节”？\n\
  \n### 章节总结\n\n本章重点关注了可能会给整个组织带来困难的物理安全问题，并希望能梳理出你以前可能没有考虑过的元素。如果你改变观点，你就能更清晰地审视你的组织——这将真正帮助你跳出框架思考！\n\
  \n如果你想成为一名成功的信息安全经理（ISM），确实需要一种特定的心态，这似乎是你与生俱有的，而不是可以教出来的……尽管阅读书籍是建立更完善的能力库的好起点！\n\
  \n这种心态很难教，可能是你与生具备，也可能不是。但为了培养拥有这种心态的人，他们需要寻找并发现安全漏洞——一遍又一遍，再一遍。无论在哪个领域都是如此。（Schneier,\
  \ 2008，p.260）\n\n成为安全工程师让你拥有一定的技能组合，成为安全架构师也是如此。或许成为一名“保镖”（物理安全人员）也会有帮助。你需要能够像“攻击者”一样思考，无论是技术上的还是物理上的。在物产权法中，ingress（入口）、egress（出口）和\
  \ regress（返回）术语分别表示个人进入、离开和返回某处财产的权利。这些术语也用于 IT 领域关于系统访问。你需要考虑特别是哪些出口和入口点可能会被破坏（以及以何种方式），以便你准备好一些解决方案。尽可能应用主动的、而非被动的安全防护防护措施。\n\
  \n在成为 ISM 的过程中，你可能并没有通过任何标准路线起步，但如果你拥有更加开放灵活的心态，你可能会大放异彩。由于在任何可能的情况下都不应该将设备用于个人用途，这意味着要考虑他们的工作需求，而不是个人使用需求。贵组织中的某些功能可能需要\
  \ CD 读写设备，而且你需要能够跟踪正在写入的信息，因为假设是这些信息要么会被共享，要么会被存储。在这两种情况下，这都必须安全地进行。因此，你需要确定是否可以对此类数据的传输和/或转移任何类型的加密，并对刻录和共享的\
  \ CD/DVD 维护某种登记，特别是当你期望它们被还给组织时。这类问题通常出现在你编写的此类行动的政策或程序与现实世界接触时；维护此类政策可能很困难，因此你需要足够的灵活性来审查、重新审视并最终重写，以满足用户群体和组织的需求。一如既往，只要你能够为相关的敏感信息资产提供最佳级别的保护，你就不会出大错。\n\
  \n### 安全意识主题\n\n本月的信息安全主题应该明确结合圣诞节——关注送礼这一方面，以避免引起任何宗教反感。借用广为人知的““狗是一辈子的，而不仅仅是为了圣诞节”这句名言，你可以选择信息安全最佳实践的任何元素，道理都是一样的。也许是“备份是一辈子的，而不仅仅是为了圣诞节”？\n\
  \n### 章节总结\n\n本章重点关注了可能会给整个组织带来困难的物理安全问题，并希望能梳理出你以前可能没有考虑过的元素。如果你改变观点，你就能更清晰地审视你的组织——这将真正帮助你跳出框架思考！\n\
