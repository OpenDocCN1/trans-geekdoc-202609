  \n### 章节总结\n\n本章重点关注了可能会给整个组织带来困难的物理安全问题，并希望能梳理出你以前可能没有考虑过的元素。如果你改变观点，你就能更清晰地审视你的组织——这将真正帮助你跳出框架思考！\n\
  \n如果你想成为一名成功的信息安全经理（ISM），确实需要一种特定的心态，这似乎是你与生俱有的，而不是可以教出来的……尽管阅读书籍是建立更完善的能力库的好起点！\n\
  \n这种心态很难教，可能是你与生具备，也可能不是。但为了培养拥有这种心态的人，他们需要寻找并发现安全漏洞——一遍又一遍，再一遍。无论在哪个领域都是如此。（Schneier,\
  \ 2008，p.260）\n\n成为安全工程师让你拥有一定的技能组合，成为安全架构师也是如此。或许成为一名“保镖”（物理安全人员）也会有帮助。你需要能够像“攻击者”一样思考，无论是技术上的还是物理上的。在物产权法中，ingress（入口）、egress（出口）和\
  \ regress（返回）术语分别表示个人进入、离开和返回某处财产的权利。这些术语也用于 IT 领域关于系统访问。你需要考虑特别是哪些出口和入口点可能会被破坏（以及以何种方式），以便你准备好一些解决方案。尽可能应用主动的、而非被动的安全防护防护措施。\n\
  \n在成为 ISM 的过程中，你可能并没有通过任何标准路线起步，但如果你拥有更加开放灵活的心态，你可能会大放异彩。（由于用户提供的文本存在大量重复，此处已按要求去重处理）。\n\
  \n\n\n为了让流程更加正式，我引入了一套增强的事件报告流程，以确保人们知道自己有“发言权”（这在心理上可能比“必须报告”更具有紧迫性），结果，一个问题出现了。这本应该通过\
  \ ICT 帮助台处理以确保其可见性。一位员工“提交了工单”，称他们被告知不允许购买更多的加密 U 盘。由于这种购买限制，用户们开始在家里使用自己的 U 盘——含言之，这些\
  \ U 盘未经过加密，而且可能没有杀病毒软件保护。\n\n现实情况是，这仅仅反映了整个项目范围内的状况，但一名员工将其作为“工单”事件提出来，有助于暴露增加适当的跨组织沟通的必要性，并更快地推进拟定的项目以吸纳更多用户，从而对信息资产提供更高水平的保护。存放在“家庭用户”U\
  \ 盘上的特定信息，在大多数情况下会被归类为“敏感个人数据”，并且至少会被标记（保护性标记）为“限制”。\n\n无论如何，你都需要你的用户能够报告事件，并且你需要这些事件的记录，以便收集可以分析并以有意义的方式向管理层报告的数据。这都有助于建立你的指标，通过这些指标你可以衡量一直在整个组织寻求实施的安全框架的有效性。有些人偏好数字（上升或下降）；另一些人喜欢图片（饼图、柱状图等）。你需要了解什么对你的组织最有效，并能够创建某种为安全提供“信心”的仪表板——即：它是可解释的、可翻译、可衡量且真实的吗？\n\
  \n### 信息安全\n信息安全对于你的组织来说是一种非常主观的交付机制，并且持续需要视觉呈现来解释其益处。人们往往在它缺失时才会注意到。这在发生数据泄露和信息丢失时尤为明显，特别是当发生的事件进入媒体（国家报纸或其他）时。当它运行良好、当信息安全已经植根时，人们在日常生活中可能不会注意到它，因为它不应该阻碍他们的工作。\n\
  \n### 数据共享协议\n行业热爱缩写词和术语。所以，当同事过来问你什么是“信任源”时，你能够构造出一个答案！当然，背景非常重要。但这是如何被识别的，又是什么让某人“受信任”？困难之处在于，背景与尝试实现信息共享承诺有关。公共部门的每个机构似乎都在制定自己的语言，私营部门的每个行业也是如此。你需要留意这一点，因为你作为\
  \ ISM（信息安全经理）的角色往往是翻译员。尽可能可能，你需要与你的组织有联系的各种机构建立关系，以学习它们的语言。你不能孤立运作。还有所有冲突的倡议，它们是变革尝试的信号。同样，你需要关注这些，因为每一个相关的变化都会影响用于产生统计数据或管理需求的信息系统；你的组织需要保护数据以及管理数据的人。其影响通常比最初考虑的要广泛得多。\n\
  \n### 合规与合同\n回到“信任源”，这是一个信号交叉的场景：一个机构声称，除非我们证明了某些事情，否则他们不会信任。然而，两个机构都属于同一个部门，本应该遵守相同的政策、程序、指南、网络连接、法律、法规和标准。这清楚地说明了建立数据共享协议的必要性——而且为了使这些协议具有意义，它们必须拥有足够的安全控制范围，以支持其中包含的条款。作为一名\
  \ ISM，你最终需要了解合同和协议。这涉及到要理解法律术语。这很痛苦，但完全值得！数据保护条款——把这些看作信息资产保护条款——从一开始就需要更好地引用在合同中——要么直接引用，要么以安全计划的形式作为附件。\n\
  \n当提供商的销售团队执着于向你推销整个世界时，你需要能够对他们提供一个合理的回复，但现实可能差如人意。特别是随着云和虚拟化意图的飞猛发展，了解你的信息在哪里、谁将负责它、维护多久、你将如何取回它以及这需要多久，真的非常重要。你不要害怕挑战法律术语并询问实际事实可能是什么，因为在泄露模式下，等发现时可能已经太晚了。时间永远是关键。在某些时候，你必须在数据的整个生命周期内明确数据披露、数据共享、数据保留和数据销毁。\n\
  \n### 风险缓解\n除此之外，你还需要一份协议清单，这样你就可以看到谁代表哪个组织签署了协议，以及它们何时需要续签。这归结底是你风险缓解策略的一部分。现实可能是，你唯一需要知道这些信息是在出现问题时，但这对于你的汽车和房屋保险单详情也是一样。监管机构期望组织对其信息资产拥有控制和可见性，并知道谁有访问权限、数据被传输到哪里、与谁共享、保留多久、在什么条件下、什么情况下以及在什么介质上——U\
  \ 盘、CD、DVD、笔记本电脑等。因此，需要像 `Chapter#09_ch01.xhtml#ct1` 中强调的那样尽早建立清单。\n\n人们对行业部门、机构、政府以及私营和公共部门之间的安全需求差异存在持续感知。ISM\
  \ 的观点应该是：无论需求的核心是什么，始终需要保护信息资产；任务在于找到适合大家的最佳方法。\n\n### 将信息安全与记录管理关联\n\n\n\n\n一旦你完全掌握了自己作为信息资产保护者以及组织内未来项目和计划方案创建者的角色，你这种“保管员式”的角色就需要扩展到你寻求提供保护的信息资产的整个生命周期中。如果你足够幸运（如前提到的），你的组织已经雇佣了记录管理员。你应该寻求与他们紧密合作，以确保你的保护机制符合法律规定的留存要求，以及记录生命周期的其他维护要素。\n\
  \n无疑，随着 `Cloud` 技术的不断普及，未来需要对其进行一些有趣的访问和存储讨论。组织需要确定是否有必要在任何时候都让所有数据可用；如果不是，应该如何以一种适用于信息本身可能分类的安全性方式对其进行存储。当然，问题就在于此：如果你还没有识别出信息资产，并没有以能够对你的信息进行充分标识和区分的方式应用分类，那么将很难知道如何区分不同类型的信息，以及如何最好地保护它们。\n\
  \n其中一个方面是与各个项目团队合作，以确保围绕信息生命周期的考虑被纳入所有系统的采购过程中。很多时候，归档设施并未被视为新系统初始需求的一部分，但应当理解，从法律上来说，数据不能永久保存，因此必须通过阶段进行管理。对于这必须有某种过渡计划——从日常使用到短期归档，再到长期的留存。\n\
  \n此外，取决于数据的性质，需要规定安全要求，以确保数据的长期安全和安全性。还需要安排身份验证机制，以满足恢复数据或在留存期之外访问数据的需求。\n\n## 渗透测试结果\n\
  \n正如我们在 `第 3 章]` 中看到的，漏洞管理是 `ISM`（信息安全管理人员）需要管理和监控的关键任务。这部分工作通过对所有系统进行渗透测试，并利用报告的发现来管理随之产生的缓解活动来实现。\n\
  \n以下是渗透测试报告中最一致的发现：\n\n*    似乎没有人负责整体网络安全。这可能是由于责任碎片化导致（通常是由于人员裁减，许多组织在过去的五到十年中经历了这种情况），同时也反映了人们关注的是系统的功能，而非其安全性。这表现为：似乎没有人对网络层面的系统生命周期维护以及日常管理和维护负责——例如通过不应用更新、补丁等——这对系统和最终对数据成了真实风险；也没有人了解行业范围内已识别的系统前\
  \ 10 或前 20 个漏洞，而且显然没有人应用所需的解决方案，或从零开始设计系统，以确保它们在未来不包含这些缺陷。\n\n由上述所有权缺失而导致的一些关键问题如下：\n\
  \n*   在安装新设备时仍在使用空密码——这是一个经典问题，虽然我们都知道需要处理并更改它，但时间似乎阻碍了这一点，每个人都忙于其他事情了。\n*   SQL\
  \ 数据库使用默认和空密码——与上述问题类似，但至少这凸显了仍需解决的层次中问题的规模。\n*   密码易被破解——这可能是一个非常引人入胜的发现。当然，在我的案例中，这是最引起高层关注的一项，特别是考虑到正在进行的工作。\n\
  *   补丁管理似乎没有得到及时管理，这种失职使架构和基础设施暴露在漏洞之中。\n*   发现了过多的管理员账户——考虑到正在进行的工作，当时这是一个令人失望的发现。\n\
  \n## 测试结果总结\n\n渗透测试和漏洞评估为组织安全实施的状况提供了宝贵的见解。这两者经常被混淆。漏洞评估应被认为与风险评估相关。首先识别系统（资产、资源）并为它们分配价值（重要性）。然后识别对每个资产的潜在威胁。显然，预期是在提交发现结果后采取缓解措施——至少对于最有价值的资源和最严重的漏洞是如此。渗透测试证明了所发现的漏洞（它实际上是这些漏洞的`概念证明`），提供了对底层网络、操作系统、数据库等缺陷的影响分析。\n\
  \n上述任何发现并不罕见，但它们证明了良好的安全实践尚未到位。预计这些测试将在全年内定期进行。这样做可能会带来一些畏惧情绪，但请记住我们的准则——不存在 100%的安全，你永远不会\
  \ 100%无风险的，因此永远不要期待一份完美的健康报告。始终利用这些机会进行学习，并相应设定预期。然后，将修复工作与那些无疑已计划的网络（及其他）改进一同规划。\n\
  \n\n\n\n这里关于此的一点额外说明，以反映这个问题将会反复出现。你应该考虑服务包（service packs）与关键补丁（critical patches）的问题，这取决于你正在部署的系统性质，或者你通过\
  \ IT 服务已经获得的可用资源——当你的环境跨越数千台机器时，你如何对这些操作的顺序和优先级基础做出决策？网络对更新的响应方式以及 IT 处理出现故障机器的方式是有区别的。在可能的情况下，你希望这些更新在半夜运行——显然，如果你在一个“全天候”的环境中运行，这更加困难。因此，你可能希望按照我们提供的物理布局示例对机器进行聚类，并能够根据它们对组织的优先级和重要性向特定组部署更新。无论你选择何种方法，都要准备好应对即使一台机器故障可能产生的影响，因为这会产生连锁反应，导致整个团队出现负面影响，而这正是你最不想看到的。\n\
  \n## 物理安全问题\n\n我经常思考我们在组织内部建立的这种部门隔离（silos）以及它们除了维护个人自尊之外，到底有什么用处。为了组织的未来发展，协调和协作通常是必要的。这些问题之一是应急计划（emergency\
  \ planning）与确保业务连续性计划（business continuity plans）之间的差距。解决 `DR` 问题已经足够困难了，此外，业务连续性计划需要与利用这些系统的流程相关。关于这一点，有大量的文献可用。介绍中提到的一点是，要开始思考应急计划——很多时候，这些活动被视为完全不同的。我访问过一次应急区域，惊讶地看到那里堆满了等待送往警方进行粉碎处理的磁带。团队曾要求这样做，但这是一个典型的寻求支持却得而无获的例子。被要求的人并不理解这些材料的性质（其有效标签，因此需要以某种方式处理），也不理解如果信息落入错误的人手中可能产生的影响；即，请求本身没有经过风险评估，因此遗憾地被忽视了。`ISM`\
  \ 需要介入并`make`采取行动。这类情况不能不管，必须得到处理——这种紧急性需要传回给服务台，以便他们学会理解收到的随机请求的性质，并将响应机制加速到更合理的水平。\n\
  \n## 减少、重用、回收\n\n桌面更新计划在组织内更广泛的范围内继续进行。现在，已经有了一批可以重新分配的退役机器，这需要对用户的需求进行仔细考虑——而不是他们的愿望和欲望！\n\
  \n在确定了那些不再使用的设备后，显然会有大量设备需要销毁。毕竟，你不会希望你的组织出现在 `BBC` 的纪录片里。早期的项目计划包括与回收服务提供商建立关系，由他们对运走的设备数量进行认证，并确保每一次都得到了恰当的销毁或回收。移除数量的物理证书被作为记录保存。这产生了一组有趣的统计数据，可以提交给管理层，包括移除的设备吨数、可重用的体积、回收的体积、带回组织的任何价值、更换的机器数量以及升级的机器数量——所有这些都可以根据总规模进行衡量，以评估进展并向更广泛的组织提供实用的反馈。\n\
  \n对于某些机器，可以通过更新或升级内存芯片提供短期解决方案，以延长其目前的寿命。更关键的是，更换了机器。有些机器和连接方式非常老旧，甚至还在通过拨号调制解调器连接。信不信，它们仍然存在！\n\
  \n\n\n\n\n负责桌面更新的项目团队正试图将某些类型的机器存放在同一地点——即将所有的 `Dells` 放在一个地方，所有的 `HP` 放在另一个地方，以此类推——以确保站点维护的某种程度的便利性。如果工程师到达某栋大楼，他们就会知道整个过程中面对的是什么类型的机器，以及它可能出现的问题，并能够比面对多种不同机器类型导致复杂的冲突、系统故障和失效时更快地解决这些问题。同样，这使得更容易在网络上分块对机器组应用补丁和更新，而必非一次性应用于整个资产。你对变更交付的控制力越强，管理过程中出现的任何故障就越容易。\n\
  \n此外，外面可能存在大量的旧设备，它们遗弃在你地理覆盖范围内的各个橱子、储物区域和旧档案柜中，你需要积极鼓励人们去寻找这些设备，并让他们觉得可以上交这些而无需担心任何后果——以确保它们根据你的基础设施战略得到适当的处置或循环利用。\n\
  \n关于这一区域的最后一点，鼓励人们从家里带来旧的 PC 电脑，并以适当安全且环保的方式进行翻新或回收是有帮助的。初读之下，这似乎是一项昂贵（或疯狂！）的任务，但从长远来看它将产生回报。你考虑到，你的用户很可能实际上使用过家用电脑来完成你的组织工作，审查报告、编辑报告、转发邮件……在多年的服务过程中，那台家用电脑上可能存储了各种信息，敏感的、个人的或其他信息。对设备处置的控制是一种风险降低机制，在当前的工作环境中非常恰当，因为信息专员期望你在所有组织信息资产的整个生命周期内，始终对它们的位置具有可见性和知情。\n\
  \n# 本月其他安全任务\n\n### 职位描述\n\n在 `Chapter 1` 中，我提到过你需要提供一个框架，在员工进入你组织之前、期间和之后对其进行有效管理。这项活动的一部分是确保安全角色和职责得到分配，并在职位描述中引用相关任务。此外，实施一个个人信息安全计划并与他们的年度个人发展计划挂钩也是值得的。这是一份关于技能、培训和发展的计划，他们承诺承担，以提高他们代表组织的理解力或表现，并确保他们正尽一切保护他们所管理的信息资产。这源于让用户——从\
  \ CEO 直到所有用户——理解他们他们创建了需要管理、存储、传输、共享和安全保存的信息资产的人。ICT 仅仅是信息的守护者，而不是所有者。因此，用户群体需要理解其角色的重要性——将其与年度绩效和评估挂钩往往有助于集中注意力。如果能将其与实际财务要素结合起来就更好！\n\
  \n### 用户的理解\n\n记住，虽然我们假设现在的用户对技术必须非常了解，因为技术无处不在，但他们实际上了解的是他们与消费相关的体验，而不是任何水平的“打开引擎盖看内部”的实操经验。因此，多年来，许多用户被放在电脑前并让他们开始工作，而几乎没有或完全没有为他们提供培训。他们一直摸索着过，如果遇到瓶颈，就会向同事寻求帮助。但你可以看出这种方法的缺陷。如果他们的同事也采用了同样的培训模式——即，什么都没有！——那么他们对面前系统带来的益处的理解就非常松散。发现他们真正不知道什么可能会让你感到惊讶！所以，ISM（信息安全管理）的另一个大杀手锏是提供一个安全的环境——例如，一次信息安全意识简报——让与会者知道他们可以分享顾虑和局限性，希望你可以帮助他们提供一条通往解决方案的路径。\n\
  \n有很多用户不知道 `.pst` 文件是什么，也不知道如何寻找它。（以防万一，这是微软对你所有 `mail` 邮件文件的称呼 `post`）。在很多情况下，他们甚至从未想过去问。只有在丢失邮件后，他们才会意识到这些信息的意义——并对学到这一点表示感激，这不仅在工作中，也能帮助他们成为更好的家庭用户。所以，在前期对他们多解释一下是值得的——益处将随着时间的推移而变得清晰。\n\
  \n### 人员管理\n\n如果你正处于长期的变革计划中，你需要在同事休假或缺席回来后继续激励他们，以便他们继续做一份到目前可能看起来很无聊的工作。例如，任务可能涉及大量机器的升级、更换、维修和恢复；或者是一个在补丁方面需要大量心照的大型服务器群。在“机房”里有许多乏味的任务，这是一个很恰当的比喻，因为这些系统确实是保持组织其他部分运转的引擎。你需要所有的同事——无论是技术人员还是其他人员——都理解这些基本事实并相应地提高他们的水平。\n\
  \n### 安全意识主题\n\n本月的信息安全主题可以利用一月通常是新年愿望时间的这一。例如，“你的愿望是什么……？我们的愿望是始终更新防病毒软件……”或“新年新气象……让我们锁定那些设备！”尽管这些听起来可能很陈腐，但用户群体会对这种讽刺与幽默的混合产生一些理解，至少会看到正在进行一个主题和信息传递。\n\
  \n### 章节总结\n\n这一章真正开始分享了 ISM 在任何给定月份内可以预期的活动范围广度，其中许多并非基于技术——也不应该被预期为基于技术。线索就在标题里！\n\
  \n接下来的几章将这种对 ISM 角色的宏观视角与所有需要执行的海量任务结合起来。它们还强调了你必须理解你组织的整体目的和意图，这样你就可以为安全地使用其信息资产和资源提供更好的建议。\n\
  \n# 第 7 章：二月 - 钱确实买到快乐\n\n## 分而治之？\n\n作为一名 ISM，你现在应该看出你必须把自己看作某种“转盘高手”——任何时候都有许多不同的子项目在进行。这可能是为了满足管理的需求，而不是由你设计的任何东西。所以结果可能是没有人知道发生了什么！\n\
  \n然而，总有一种担心，你的大项目像一头大象，无法一次吃掉。因此，将其拆分为若干子项目是一个很好的策略，因为会让每个团队专注于特定的任务，而不是将他们太薄地分散在整个项目中。我们被鼓励将其拆分为以下内容：\n\
  \n• 端口控制/移动介质——数据泄露防护技术（也称为稳健的终端安全）已安装在端口，以确保对连接到设备具有更高的可见性，并确保这些设备得到适当管理，特别是通过扫描所有连接的设备。\n\
  \n\n\n\n\n-   **邮件标记** – 在电子邮件系统中实施了该技术，允许用户从下拉菜单中选择适当的标记，以便对特定时刻发送的信息进行分类。\n- \
  \  **PC 替换** – 为了继续进行桌面刷新计划工作，已安排专门团队投入时间重新重新分配设备，并确保处置环节得到妥善处理。\n-   **补丁与漏洞管理**\
  \ – 需要一个团队来处理近期渗透测试报告的结果，以及需要尽快完成的各种补丁和服务器更新流程。\n-   **邮件存档** – 实施了一种解决方案，以提供快速且可搜索的电子邮件功能，以及与现有电子邮件系统集成的留存能力。\n\
  -   **服务器集群升级** – 对整个 ICT（信息通信技术）的服务器基础设施进行了升级，以确保整个服务器集群符合 ICT 运营的最低预期维护水平以及信息安全最佳实践（尤其是在漏洞评估和补丁管理方面）。\n\
  \n作为信息安全经理（ISM），你可能对分配给项目任务的资源时间分配没有日常管理权，这在项目进度方面可能会产生非常不稳定的影响。当然，在当前财务紧张的时期，现实是每个项目团队中的都是同一批人。因此，建立子项目实际上增加了他们的工作负载，因为他们现在除了参加更多的汇报和向上管理之外，还要参加更多的会议。这对于时间、精力和资源的极度浪费。\n\
  \n遗憾的是，人们似乎从不关注那些显而易见的事实。因此，你的任务必须不断向管理层强调：只要资源没有获得适当的时间，整个项目就会进一步落后，最终他们将为未能遵守某项强制性外部指令或缺乏与特定基础设施的连接而付出代价。这将影响大量用户，其影响远超直接管理团队的考量范围。\n\
  \n## 记住大局\n\n每而久之，你需要向后退一步，提醒自己和所有人，你们正试图实现什么。你的变革计划最终目标是寻求影响对信息流的审查和业务流程重组；鉴于面临风险的信息资产的性质，你必须确保所采取的任何流程都是恰当、充分且安全的。这从根本上关乎确保你的组织符合相关立法。例如，特别是在英国，所有形式的信息处理都不能违反《数据保护法》，该法源于一项《欧洲数据保护指令》。因此，类似的原则也适用于在欧洲范围内处理信息的组织。\n\
  \n尽管该领域的多数努力通常通过实施新工具来服务，但其核心始终不仅仅是技术。它是信息治理议程不可或的一部分，涵盖了任何与作为资产的信息相关的法律、法规和标准，这些标准要求进行风险评估、影响分析和适当管理（我们将在下一章重新描述信息治理本身的广度）。因此，这需要在组织的高层由人负责，并获得适当资源的支持。否则，ICT\
  \ 将继续被视为天然的主导者，导致项目侧重于技术而非运营，使用户会觉得这些事情是*强加于*他们身上的，而不是*与他们*共同*完成的。\n\n诚然，技术解决方案可以使信息安全的监管和实施变得更容易，但要确保数据和信息的保护将始终对我们的业务模式产生影响。继续交付你的活动计划需要政策的变革，以及技术的变革。例如：\n\
  \n-   对组织雇用的员工需要更严格的安全检查，这些检查需要嵌入到与人员相关的政策中。\n-   通常需要增强资产管理安全性，以确保识别硬件、软件和信息范围内的所有资产。\n\
  -   需要建立并遵守一项有意义的清洁桌面政策，并需要更清晰地定义 ICT 服务和系统的可接受用途。\n-   应通过为所有包含个人身份信息的系统指定信息资产所有者来建立信息所有权，以便此类信息得到妥善管理和保护。这应作为管理责任被嵌入。\n\
  -   为所有用户提供某种信息安全意识。这最好通过尽可能多次简报来实现。\n-   刷新 ICT 连续性安排，以反映一旦定义了那些安全需求。\n\n## 技术变革的广度\n\
  \n如前所述，信息治理相关计划所解决的许多问题涉及人员和程序，但显然也有技术性问题。其中许多问题在之前的章节已经涵盖过，其他问题列举如下：\n\n-   将用户数据迁移到安全的存储区域网络（`SAN`）\
  \ – 在我们的场景中，这导致不在同一网络安全分段的用户无法访问数据。\n-   升级防火墙、杀病毒技术、反垃圾软件、路由器、交换机、电缆、服务器等 – 虽然已对分段后的网络进行了这些工作，但仍需大量工作使网络其他部分达到大多数外部连接、监管和法律安排要求的最低基线安全标准。\n\
  -   实施双因素身份验证（`2FA`） – 为了解决可靠识别用户的需求。第一个因素“你所知的”是熟悉的系统密码（如前所述，这已升级为强制性的八字符标准），但设置第二个因素“你所拥有的”需要真正的努力。\n\
  -   收集、存储和展示安全事件数据是某些外部要求和协议的重要部分。这意味着要控制网络上各种系统和设备生成的与安全相关的日志数据，并将其放入安全存储中以供未来分析和报告。同样，需要大量的服务器工作来相应地识别、升级和维护。\n\
  -   实施安全网络 – 遗憾的是，并非所有网络在历史上都是平等的。大多数网络是分段创建的，随着组织的增长以及系统和交易需求的发展，跨了地理边界。实现迁移员工和系统的转型计划需求可能会受到旧基础设施的阻碍。\n\
  \n\n\n\n\n- 大多数可审计的外部连接需求都高度关注服务和系统的部署方式。合规性要求企业做出承诺，确保用户遵守有关网络访问管理、硬件利用控制以及普遍遵守相关的企业准则和政策的新规制度。\n\
  - 将信息安全的广度扩展到整个组织中，将其视为一项受益于企业指令的日常性业务（BAU）活动，并将管理层纳入信息治理文化，这些最终目标。换句话之，这应该是用户文化一直保持运作的方式，而不仅仅是为了连接安全网络或履行任何其他合同、监管或法律要求。\n\
  \n现实中，书中描述的任何内容无非都是对组织达到预期的最低安全标准的鼓励。\n\n## 拥抱数据保护与隐私\n\n安全与数据保护、事实上与隐私之间存在着一种根本且内在的联系。没有前者，就不可能有后两者。`英国数据保护法案`中的第七条数据保护原则将安全定义为一项必须织入组织结构中的基本要求，以确保你能够保护可能以任何形式呈现的个人数据。\n\
  \n> `1998 年英国数据保护法案，第七条原则`\n\n> 应当采取适当的技术和组织措施，防止对个人数据进行未经授权或非法处理，并防止个人数据的意外丢失、销毁或损坏。\n\
  \n作为 `ISM`（信息安全经理），当个人要求查看组织持有的关于他们的所有信息时，你可能会被要求协助履行访问请求（`SARs`）。这可能需要检索数据日志、电子邮件存档、系统记录等，以及纸质/手动记录，而且在汇总捕获的广泛信息并确保在法律要求范围内提供响应方面，这可能非常耗时且具有挑战性。\n\
  \n数据保护是一条漫长的法律学习曲线，但 `ISM` 有责任从法律和技术两个角度学习并理解该《法案》（`Act`），因为它是不会消失的。在数据泄露通知方面已经计划了更多变化，数据保护机构的变更方式的底层前提也将发生变化——目前，你的组织必须以特定的方式处理个人数据：a)\
  \ 你必须知道你拥有这些数据；b) 你必须随时知道它们在哪里；c) 你必须已经采取了“适当的技术和组织措施”来保护这些数据。在 21 世纪，后者至少意味着对静止存储数据、运动中数据和传输中数据进行加密。再次，这本身就是一个巨大的领域，关于这个主题可以找到许多优秀的书籍。\n\
  \n我们将在下一章讨论开展隐私影响评估（`PIAs`）的需求。简单来说，如果你处于这种思维模式，那么你也应该能看到它与业务影响评估或分析之间的联系。`ISM`\
  \ 在识别威胁实现的可能根源并确定其发生概率方面起着关键作用。此外，`ISM` 可以为许多可以实施的缓解或补偿控制编写定义，以确保按照监管机构、利益相关者和大众的预期，对个人数据和信息资产进行适当保护。\n\
  \n# 本月其他安全任务\n\n### 用户管理\n\n这是另一个容易解决的问题——一个“触手可得的果实”任务——尽管它经常被忽视。我们在 `第 1 章` 中讨论过这个问题。这是一项持续性任务，你真的需要将其视为一项使命，确保：\n\
  \n- 系统中没有不再属于该组织的用户；\n- 每个用户仅拥有其执行当前受职工作所需的访问权限；\n- 没有人仍然持有与其此前担任过的其他角色相关的系统访问权限，而他们已不再需要此类访问权限。\n\
  \n正是这些小事真正反映出了一个组织是否在内部以及对外部（审计时或其他情况下）认真对待安全。\n\n### 清单管理\n\n你需要包含在清单中的项目列表变得越来越长，或者说，如果你考虑到使用某些机器的潜在风险，它至少会变成那样。考虑购买新的录音机——技术已经进步了这么多，这些设备现在已经有了类似于\
  \ `USB` 驱动器的内置存储元件，如果该驱动器没有加密，你就需要审查处理这一风险的潜在需求。如果录音机掉在街上怎么办？任何人都可以捡起来并按下播放键听录制的内容，并根据发现的结果直接将其交给当地媒体——或者更糟，交给国家级媒体。在很大情况下，这将成为一次立即的数据泄露，并需要启动事件响应。大木成林，始于种子……\n\
  \n### 安全意识主题\n\n本月的信息安全主题可以结合这样一个事实：媒体的焦点通常（至少在二月的前两周）与情人节有关，因此有一个“爱”的元素。你可以开展一个名为“爱你的笔记本电脑”的活动，鼓励用户确保他们已连接网络、更新了补丁和杀毒软件状态、运行了备份、清理了\
  \ Cookie 和浏览器历史等。\n\n### 章节总结\n\n本章的简短反映了二月对每个人来说总是一个短月份，取决于它在日历周中如何“跨越”。这是一个利用这个月的速度来处理一些如前所述的基础工作的时间，同时继续在管理层面维持各项工作的运转。\n\
  \n# 第 8 章：三月 - 漏网之\n\n## 政治的影响\n\n在进行这项研究的核心期间，`英国`的政治格局发生了翻天覆地的变化。在 `英国` 公共部门，当选举临近时，有一段时间被称为\
  \ `purdah`（政前审查期）——即从宣布选举到选举举行后的这段，现在更多地被称为选前期间。此时支出被立即冻结，新项目无法获得批准，最终已资助的项目资金会被收回。这导致大多数员工感到被“困”住了，无法推进现有计划，对未来感到不确定——这种感觉取决于组织的政治倾向，以及政府更迭对其未来及其格局可能产生的影响而加剧。存在停滞状态。\n\
  \n在每次大选之前都会有这样这种情况，所以如果你在该领域，请记住这一点。\n\n这一线索将在 `第 10 章` 中再次捡起。\n\n隐私影响评估\n\n\n\n\
  \n\n在 2007 年 11 月，英国公共部门处理数据处理的方法由于一个政府部门丢失了两个 `CDs` 而发生了根本性转折。随后的几个月里，出现了持续不断的审查、调查和报告输出，所有这些都得出了相似的结论，即需要在组织及整个公共部门的各个层面建立更好的信息安全文化、意识、教育、数据处理等（`etc.`）。因此，产生了新的数据处理需求。一年后的\
  \ 2008 年 11 月，**信息专专员**（`Information Commissioner`）举办了一场名为“**设计隐私**”的会议，他在会议上发布了一项研究成果（参见\
  \ `[www.ico.gov.uk/news/current_topics/privacy_by_design_conference.aspx]`）。最终结果是养成了下文所述的开展\
  \ `PIAs` 的习惯。\n\n# 定义\n\n- **个人数据**（Personal data）——指任何可以识别出个人身份的数据，无论是独立存在还是与组织掌握的其他数据结合。\n\
  - **隐私**（Privacy）——隐私的定义超越了个人数据，涵盖了可能侵入个人生活或事务的行为。这可能包括不会以永久形式保存的监控或筛选。\n\n# 开展隐私影响评估的好处\n\
  \n在处理个人数据时使用的流程和技术存在许多风险。通过在项目早期识别风险，可以在仍有机会进行更改时避免或减轻这些风险。在后期或实施后做出的更改可能会产生高昂成本，无论是在财务方面还是对声誉的损害上。\n\
  \n当提议任何新流程或系统时，应考虑其对利益相关者隐私可能产生的影响，并在适当开展 `PIA`。同样，当提议对现有流程或技术进行重大更改时，也应开展 `PIA`。评估涉及审查项目早期的提议，以识别对所有可能受影响的人的隐私风险。随后，下一步是记录拟的解决方案和减轻隐私风险的方法。\n\
  \n## 对个人的风险\n\n这些包括丢失、损坏、被未经授权的人访问或使用，以及个人数据泄露或进入公共领域。此外，还需要考虑可能违反个人权利的活动。\n\n##\
  \ 对组织的风险\n\n这些包括声誉损害、法律/赔偿成本、利益相关者对方案的采用率低、为了提高合规性重新设计系统的成本，以及项目崩溃或支持撤回。\n\n# 被视为高风险的数据\n\
  \n根据《英国数据保护法》（`UK Data Protection Act`）定义的敏感数据可以简要描述为涵盖健康、种族、性取、犯罪、政治观点和工会成员。通常，这些被列为：\n\
  \n- 种族或族群起源；\n- 政治观点；\n- 宗教信仰或性质的信仰；\n- 工会成员；\n- 身体或心理健康或状况；\n- 性倾向；\n- 犯罪或涉嫌犯罪的行为；\n\
  - 任何犯罪或涉嫌犯罪的诉讼，或法院判决。\n\n应当预期个人联系信息保持保密，包括 `e-mail` 地址、电话号码和家庭地址。其他需要考虑的信息包括财务信息、风险个人的详情和旅行计划，这些也可能带来风险。\n\
  \n# 预期结果\n\n这些可以表示为：\n- 识别隐私风险；\n- 从利益相关者的角度理解隐私风险；\n- 识别替代方案；\n- 理解对项目的接受程度；\n\
  - 识别减少/避免对隐私负面影响的方法；\n- 在负面影响不可避免的情况下，接受风险的合理性；\n- 已考虑过隐私的记录证据；\n- 如果很明显项目无法满足法律义务或合规要求，或者无法对涉及的个人数据维持适当且预期的安全和隐私水平，则终止/停止项目。\n\
  \n取决于观众是谁以及你的利益相关者是谁，这一切可能极其重要且有价值。为了使评估进行，必须收集以下信息。\n\n# 开展隐私影响评估\n\n应识别所有对项目感兴趣或受项目影响的群体，并简要描述他们的角色以及可能产生的影响性质。\n\
  \n进行环境扫描。从其他项目中学习，无论是内部还是更广泛的外部环境。有效的来源包括：\n- 之前项目的文档，包括 `LLLs`（特别是当项目旨在替换现有技术时）；\n\
  - 公共领域的报告、文章和论文；\n- 与该项目领域的专家或了解合规问题的人士进行讨论；\n- 在购买新技术时，与参考网站进行讨论可能提供有关他们如何处理隐私问题的信息。\n\
  \n大多数情况下，对于涉及个人数据的项目，小规模评估是合适的。适用小规模评估的项目示例包括：\n- 用新软件替换现有的个人数据系统；\n- 设计和开发一个基于同意原则持有数据的系统；\n\
  - 对现有系统进行更改，并将收集额外的个人数据；\n- 从新源收集个人数据的提议；\n- 创建或重新设计用于收集个人数据的 Web 表单；\n- 开发新的身份验证程序；\n\
  - 外包涉及存储和处理个人数据的业务流程的计划；\n- 开发或修订有关员工使用委员会提供的技术（例如手机手机和笔记本电脑）的政策声明。\n\n只有在可能对组织处理个人数据方面产生重大影响时，才应考虑全面评估，包括以下一项或多项活动：\n\
  - 使用可能影响隐私的技术；\n- 使用敏感个人数据（如《数据保护法》定义，例如种族或族群起源、健康、政治观点、宗教、性取）；\n- 使用机密信息或可能用于身份盗窃的信息，例如银行账户详情或其他财务信息；\n\
  - 使用过量的身份验证数据，例如生物识别（指纹或虹膜扫描）或出生证明或类似文件的的副本；\n- 在未经许可的情况下发布未受保护的个人数据；\n- 与第三方机构共享敏感数据；\n\
  - 持有有关个人的大量个人数据；\n- 持有涉及大量个人的个人数据。\n\n# 开展小规模隐私影响评估\n\n**信息专专员**（`Information Commissioner’s`）的指南建议以下阶段：\n\
  - **准备阶段**：为咨询活动做安排。识别主要利益相关者并制定咨询策略/计划。在小型项目中，这可能不需要正式化。\n- **咨询与分析阶段**：与关键利益相关者讨论隐私问题，以便识别主要的隐私风险。此阶段还包括识别可能的解决方案。在某些情况下，咨询可以是小规模的，例如通过\
  \ `e-mailing` 关键利益相关者以征取意见。\n\n\n\n\n\n- **文档阶段：** 记录分析结果，可以以报告形式记录，也可以使用清单，并附上任何相关的文档信息。或者，在可用的情况下，可以将风险和解决方案包含在项目风险注册中。\n\
  - **审查阶段：** 任何建议都应该有一个跟进时间，在此期间应对对文档进行审查，以确保解决方案已经实施，并审查此类措施的成功情况。项目的任何新方面也应进行审查，以确保它们不会影响隐私。\n\
  \n## 法律法规的遵守\n\n除了 `PIA` 之外，项目负责人/领导必须确保项目符合相关法律，包括：\n\n- `Data Protection Act 1998`（《1998\
  \ 年数据保护法》）\n- `Human Rights Act 1998`（《1998 年人权法》）\n- `Regulation of Investigatory\
  \ Powers 2000 (RIPA)`（《2000 年调查权力条例》）\n- `Privacy and Electronic Communications\
  \ Regulations 2003`（《2003 年隐私与电子通信条例》）\n- 行业立法和规范\n\n英国其他的立法考虑因素包括：\n\n- `Anti-terrorism,\
  \ Crime and Security Act, Section 11 – Retention of Communications Data 2001`（《2001\
  \ 年反恐、犯罪与安全法第 11 条 – 通信数据保留》）\n- `Civil Contingencies Act 2004`（《2004 年民事应急法》）\n\
  - `Computer Misuse Act 1990`（《1990 年计算机滥用法》）\n- `Copyright, Designs and Patents\
  \ Act 1988`（《1988 年版权、设计与专利法》）\n- `Criminal Justice and Immigration Act 2008`（《2008\
  \ 年刑事司法与移民法》）\n- `Defamation Act 1996`（《1996 年诽谤法》）\n- `Electronic Communications\
  \ Act 2000`（《2000 年电子通信法》）\n- `Environmental Information Regulations 2004 (EIR)`（《2004\
  \ 年环境信息条例》）\n- `Freedom of Information Act 2000`（《2000 年信息自由法》）\n- `Government Connect\
  \ Code of Connection (CoCo)`（《政府互联连接规范》）\n- `Obscene Publications Act 1959 & 1964`（《1959\
  \ 年及 1964 年淫秽出版法》）\n- `Payment Card Industry Data Security Standard (PCI DSS)`（支付卡行业数据安全标准）\n\
  - `Waste Electrical & Electronics Equipment (WEEE)` directive（《废弃电气电子设备指令》）。\n\n\
  在全球范围内，有大量适用于组织的信息驱动型法规，`ISM` 的职责包括识别这些法规并将其记录下来，以供参考和合规之用。\n\n那些将安全功能埋没在 `ICT`\
  \ 中的人，往往对合规的含义理解非常狭隘。合规远不止遵守某个技术控制（例如 `firewall rule set`，防火墙规则集）。这以及更多内容——即您的组织无论处于哪个行业，都必须遵守法律、法规和法定框架要求的所有政策、程序和指南。\n\
  \n## 处理隐私风险\n\n通过在任何新系统开发或流程变更中尽早处理隐私风险，贵组织可以避免违反适用数据保护法的风险：\n\n- 将数据收集减少至实现特定目的必需的信息，并限制其在该目的的使用是一项重要策略。如果您从根本上没有这些信息，可以通过完全不记录它们来降低风险。\n\
  - 消除争议性数据的收集是另一种方法，即阻止在决策中使用特定信息。\n- 不收集用于身份验证的生物识别数据是另一种方法。\n- 在完成需要的数据交易后删除或销毁数据——这最好通过应用保留和销毁计划（结合\
  \ `RM`，记录管理）来实现。\n\n利用组织的投诉流程来确定规避和缓解措施是重要的。当你看到人们在抱怨什么时，可以很容易地发现趋势。要求审查过去几个月的外部投诉以及内部用户投诉。其中往往隐藏着值得挖掘的价值信息。用户可以察觉新表单是否索取了过多数据，或者意识到某些历史表单中的数据从未需要过，也从未以任何有意义的方式使用。以这种方式参与进来应该是您的沟通策略的一部分，因为它已成为您风险缓解的一部分。\n\
  \n`PIA` 也可以在现有系统的任何时候进行，这样您就有证据证明已处理上述考虑因素。您可以为公司系统安排此工作，特别是在全年范围内，以便在出现外部立法或法规变化，或者内部系统或流程变化时，能够引用输出结果并每年更新。\n\
  \n## 管理病毒爆发\n\n还记得 `Conficker` 吗？如果你在组织中经历过它，那将将是痛苦的——而且像任何重大病毒爆发一样，即时反应是保持沉默。但你需要采取行动，所以必须让人们参与进来，特别是锁定违规的机器并疯狂地打补丁！鉴于你的用户可以像其他人一样轻易地向外泄露信息，处理沟通成了你\
  \ `ISM` 职责的一部分，并且需要非常谨慎地进行。你和内部团队之间、以及跨大型组织的向上管理也需要阶段安排和资源支持。\n\n显然，我们已经讨论了补丁管理和漏洞评估的要求。这种爆发是你们的自作自受，因为这是缺乏维护的最而易见的结果。`Conficker`\
  \ 的第一个补丁于 2008 年 10 月发布，因此在 2010 年在你的网络中遇到它并暴露在风险是非常尴尬的，这本身就说明了很多问题。虽然你内心的孩子极切想在屋顶上喊“我早就告诉过你们的”，但这显然不是礼貌、政治正确或能提升职业前景的回应，所以要小心！\n\
  \n通过一些快速网络分析，我们发现许多设备显示已应用了 `Conficker` 的热补丁。但由于已知设备总数与分析的设备数量之间存在差距，很难判断呈现的数据是否完全准确，以及所有的服务器和其他主机是否都存在。（回到我的\
  \ `Chapter 1` 任务清单——确保你的资产清单始终准确且最新是至关重要的，就是为了应对这类突发事件。）跨网络扫描只能捕获到在配置管理系统中可见的内容，因此，如果它是不可见的，就不会被捕获，网络可能会暴露在风险之中。\n\
  \n`NT4` 没有针对 `Conficker` 的补丁，因为，当然，它在微软计划的不再支持软件列表中，因此没有计划理会它。所以，当时，如果你仍在托管 `NT4`\
  \ 机器（它们直到今天仍然存在），那么它们就面临着病毒暴露的风险。\n\n`IPS` 从一个隐藏在 `proxy` 和 `DNS` 之后的主机生成了警告。这是一种异常行为，反映了恶意软件的创造性。找到该主机是首要任务，因为它在允许广播信号的情况下，一直在整个网络中发送复制消息。\n\
  \n那么，如果你的资产中很大一部分尚未更新，你该怎么办？事实证明，实际上大量的服务器没有经过审计，因为杀毒系统被关闭了。杀毒技术如果不更新就会停止通信，并且需要将用户设置到相应的组中以更新他们的本地机器。\n\
  \n\n\n\n在广域网（WAN）上应用热补丁（hotfixes）可能非常棘，但它是你的解决方案的一部分，并且同样需要一些规划，以确保用户离开机器时处于适当的“开启”状态，以便应用热补丁。这回到了我们在`第\
  \ 5 章` 中的讨论，即需要与处理“绿色”IT 的 IT 人员保持一致，他们会倾向于确保机器每天晚上都关闭。为了实现这一预期的结果（与所有其他任务和挑战一样），需要进行协调和沟通。\n\
  \n## 本月其他信息安全任务\n\n### 维护活跃且可信赖的内网存在\n你需要一个定期更新有用信息的交互式内网——包括常见问题解答（FAQs）和指南以及策略文档——这样人们就知道有一个信赖的信息源了。为之植入等效的每日新闻\
  \ RSS 馈送，反映与良好的信息安全实践紧密相关的问题，或证明为什么这些实践是必须的。大多数数据泄露都反映了“如果不是由于你崇拜的神保佑，我们其他人都会面临同样的遭遇”。这往往只是时间问题——没有人可以掉以轻心，而且你的组织越大，信息匮乏的用户犯人为错误（并非出于故意或恶意）的风险就越大——这就是大数法则的现实。\n\
  \n我们被要求提供的包括“即时占星术”以及对`[www.mates.com](http://www.mates.com)`的访问……额，真的吗？\n\n###\
  \ 资产管理（再次）\n我本以为在听录笔查询后已经听够了了，直到我被问及对摄像机要做什么！作为一名信息安全经理（ISM），在许多需要不断处理和应对的任务清单中，你需要对每个团队、部门、科和局处有一个概述，了解他们的功能是什么，因此你应该预期他们需要什么类型的设备。你在\
  \ RM 领域的同事可能已经在收集这类信息，因为这应该涵盖“你们使用什么媒体来捕获、使用、共享和存储信息？”之下。无论如何，你都能够研究需求并帮助设计最合适的安全解决方案。\n\
  \n### 安全意识主题\n本月的信息安全主题可以由你选择任何课题。在这个特定的例子中，结合章节中的经验，处理杀毒软件的最佳实践将是明显的选择！只要你鼓励用户确保更新他们家里电脑上的杀毒软件，他们就会理解你在整个组织保护机制方面所付出的巨大努力。\n\
  \n### 章节总结\n本章特别关注了构成 `PIA` 过程的机制。这样做是为了帮助 ISM 理解他们在引导组织进行此类评估并持续跟踪结果方面所扮演的角色。\n\
  \n# 第 9 章：4 月份 - 将信息安全与信息治理挂钩\n\n### 通往信息治理的语言之旅\n正如我们所确定的，信息安全行业喜爱缩写和简写，在这种情况下，我们对信息安全称为\
  \ `InfoSec`，对信息治理则称为 `InfoGov`。\n\n作为一名 ISM，你需要更广泛地思考，因为这是目前的趋势。信息安全产生信息保证，信息保证产生信息治理。如果我们从整体上保护信息资产，这就是我们的归宿。所以，准备好思考超出你目前理解范围的内容，并大量的阅读和学习。\n\
  \n我们在该领域见过其他缩写，包括 `GRC`（治理、风险和合规）——但我们需要真正开始掌握构成这些缩写的词汇的含义。治理（Governance）应该是跨整个组织的治理可见性。在这里，风险（Risk）同样是指整个组织的风险管理，而不仅仅是特定的\
  \ IT 风险。业务风险、财务风险、声誉风险、信息风险——它们都需要从整体上处理。最后，这个三角形的合规性方面需要对组织的整个法律、法规和标准要求有理解，而不仅仅是遵守防火墙策略。这远超于此。它是遵守我们在书中一直讨论过的所有内容，即所有策略、程序、标准和指南的结合。这是因为它们在制定时应该对合规格局有理解，以便你能够证明自己正在遵守你所要求的一切。\n\
  \n国际标准 `ISO/IEC 38500:2008` 将企业 IT 治理描述为“指导和控制 IT 的当前及未来用途的系统”。企业 IT 治理涉及评估和指导 IT\
  \ 的使用以支持组织，并监控这种使用以实现计划。它包含了组织内部使用 IT 的策略和政策。然而，我们在本章中讨论的是信息安全到信息治理的联系。这把 IT 治理提升到了新的水平，超越了技术本身，符合过去几年跨越“大数据/原始数据”（所谓的“信息之泉”）的所有运动。这需要一个全局视角。所以，让我们开启一次从\
  \ IT 安全到信息治理的各个阶段。\n\n### 我们是如何到达这里的？\n研究表明，通往信息治理之前的 `IA` 之旅是通过以下随时间推移而出现的主题：\n\
  \n* 物理安全；\n* 运行安全 (`OpSec`);\n* 计算机安全 (`CompuSec`);\n* 通信安全 (`ComSec`);\n* IT 安全\
  \ (`ITSec`);\n* 信息系统安全 (`InfoSec`)，在技术快速变化后，它合并了 `ComSec` 和 `CompuSec`，并因此在一个新的范式中结合成为\
  \ `InfoSec`，并在《信息技术安全评估通用标准保护配置文件》获得国际认可（参见`[www.commoncriteriaportal.org](http://www.commoncriteriaportal.org/)`）；\n\
  * 系统安全；\n* 系统可靠性。\n\n\n\n\n\n1991 年，John McCumber 在国家计算机安全会议上就这一主题提出了一个教学框架，并强调了信息安全（InfoSec）的组成部分，包括“为了进行有效通信而需要一种共同语言/术语”。该模型接受了将“人员、过程和技术”三位一体作为安全三个主要目标（实现你正寻求保护的信息的\
  \ CIA 密性）的叠加层的需求。McCumber 将这些表述为“教育、培训和意识（人员）；策略与实践（过程）以及技术”。（McCumber, 1991 和 2004）。McCumber\
  \ 提出的信息安全原始模型所示于图 6。\n\n![](img/P164_01.jpg)\n\n图 6：三个主要安全目标模型（来源：McCumber, 1991）\n\
  \n因此，信息安全在很大程度上是将人员安全、计算机安全、通信安全和运行安全整合成一个可识别的专业领域。“任何语言、任何文化、任何国家”的信息安全是相对于对这些信息系统的保护而言。（Kovacich,\
  \ 1998）\n\n在 McCumber 的信息安全模型被描述十年后，一篇开创性论文进行了更新，阐述了未来几年信息保障（IA）的定义和方向。当时在美国国家安全局工作的\
  \ Maconachy 认为信息保障涵盖了信息安全的三位一体；但他认为这需要从四个维度来表述（Maconachy *et al*, 2001）：\n\n- 信息状态——可以与英国的保护标记分类和类型对齐。\n\
  - 安全服务——这些是五大支柱。\n- 安全应对措施——我们在英国将其称为控制措施或防护，涵盖了人员、过程和技术方面。\n- 时间——这与安全开发生命周期对齐，因为我们的信息随时间不断流变。\n\
  \n信息保障应被视为“既多学科的又是多维的”。这些维度表示为信息状态、安全应对措施和安全服务——而这些都被理解为受时间的影响。信息的敏感性可能取决于其产生或发布的时间。信息保障既是艺术也是科学，因此它需要通过多学科的努力来解决（Petersen\
  \ *et al*, 2004）。\n\n信息状态还可以叠加以下方法：创建与信息所需的保护级别相对应的信息概（英国 CESG，保护概况），这反过来对应于解决方案空间中可能实施的应对措施：\n\
  \n- （具有）意识（中等）\n- 震慑（中等偏高）\n- 检测和抵抗（高）\n- 防御（极高）\n\n2002 年，Debra Herrmann 提出了更广泛的信息保障定义，将其视为一种横跨跨安全领域的工程学科，大约\
  \ 10 年后，我们终于在这个安全领域看到了一些真正的进展。\n\nHerrmann 认为，“从定义上说，安全、可靠且安全的系统主动内置了错误/故障/失效（无论是意外还是故意的）的预防、检测、遏制和恢复机制”（Herrmann,\
  \ 2002, p.9）。Herrmann 将信息保障视为一个三维挑战，涵盖了“安全性、可靠性和安全性”。这本书应该是全英国所有信息保障专业人员的必读物！\n\n\
  最全面且简洁的信息保障定义可以在美国空军的一份公告中找到（US Department of the Air Force, 2001），该公告从信息操作（军事术语）的角度描述了信息保障，并提到需要能够恢复系统以及如何这样做。这意味着你需要能够保护、检测并对情况做出反应：\n\
  \n```\n信息操作通过确保信息和信息系统的可用性、完整性、真实性、机性和不可否认性来保护和防御信息及信息系统。这包括通过整合保护、检测和反应能力为信息系统的恢复提供支持。\n\
  ```\n(US Department of the Air Force, 2001)\n\n大多数其他美国国防部出版物也引用了相同的定义（NIST, CNSS,\
  \ CNSSI 等）。\n\n区分出“信息”一词指的是什么是理解信息保障的关键。例如，组织安全人员的功能和责任是保护公司资产。信息系统以及它们存储、处理和传输的信息是有价值的资产之一。信息保障包含了保护和防御信息及信息系统的行动。\n\
  \n信息保障应被视为是业务的促进者也是业务的保护者，确保信息系统的用户不会无意中暴露于不可接受的风险之中。这也被认为是信息保障代表了从预防方法向赋能方法的转变（McFadzean,\
  \ 2005）。\n\n这种思想的结合随后由独立伙伴组织信息保障顾问委员会（IAAC）从美国引入英国，他们对信息保障描述如下：\n\n```\n信息保障确保组织内信息是可靠、安全和私密的确定。信息保障涵盖了信息的准确性及其保护，并包括信息安全管理、风险管理和业务连续性管理等学科。\n\
  ```\n(IAAC, 2003)\n\n信息是政府业务的基础。有效的信息保障是确保这一资产得到妥当保护的核心。政府范围内所有互联的 ICT 系统的持续增长也带来了脆弱性的增加。此外，这些\
  \ ICT 系统面临着来自外国情报机构、犯罪团伙甚至组织内部人员的攻击威胁。\n\n信息安全本身需要实施控制措施，其中最好的是预防性的（在最明显的意义上，从头上防止任何安全漏洞的发生）。这些元素形成了安全架构的基础组件，例如防火墙、用户访问控制机制、数据和通信加密、数字签名和数据备份系统，以及检测性控制（如\
  \ IDS 或安全监控平台）。各种技术控制通常由安全策略、程序和指南框架进行补充，旨在控制该框架所涵盖的用户行为。\n\n当时那个时期的论述开始发生变化，因为部门\
  \ IT 正在经历去中心化的推拉锯，而管理信息资产的斗争也真正开始了，正如 Wylder 所指出的那样（Wylder, 2004, p.21）。\n\nWylder\
  \ 的著作关于信息安全的广深度以及专业人士在角色上应该做什么，在当时看来是最全面的。\n\n\n\n\n\n## 风险管理与 ISMS 实施\n\n- **风险分析**\
  \ – 根据安全漏洞数据库计算安全事件发生的可能性。这一步骤需要考虑已经实施的用于降低风险的技术控制措施，以及任何其他可用的补充控制措施。\n- **风险管理**\
  \ – 一旦识别出风险，将根据其影响程度和业务对风险的承受能力对风险进行排序。\n- **ISMS 实施** – 这是一项稳健的管理框架实施，包括对人员、文化、技术、业务和外部因素的考量，并需要指标、衡量和持续改进。\n\
  \n## 实施过程中的挑战\n\n遗憾的是，我们在实施方面最终经历的问题是缺乏一致性，因为每个部门、行业和组织似乎都是根据其特定的业务需求来实施安全，并创建了适用于自己的不同安全定义。\n\
  \n如前所述，`IA` 必须贯穿系统的整个生命周期；威胁随着政治或业务环境的变化而改变；漏洞随着系统配置的变化和新缺陷的发现而出现或消失；随着对系统依赖性的增加，系统故障的影响也会发生变化。这正是\
  \ `CESG`（英国政府通信电子安全小组，正式名称为 `CESG`）通过各种认证计划等发挥作用的地方（英国 `CESG`，认证）。\n\n安全通常被视为一个事件而非一个过程，被视为及时的补救而非贯穿系统生命周期每个阶段的线索。在系统的初始规划、设计和开发期间，安全往往不被考虑。在开发后尝试将安全补入系统，通常比从一开始就纳入安全要昂得多，且效果也较差。同样，系统在获得特定条件下的认证并批准运行后，安全并没有结束。在系统的整个运行和维护阶段，必须验证系统对认证条款的遵守情况。即使在系统生命周期结束后，安全策略和程序也必须指导系统的安全销毁和处置。（[Boyce\
  \ and Jennings, 2002], p.170）\n\n## 信息保证 (IA) 的演变\n\n可以证明，在英国，`IA` 扩展到包括数据保护和隐私（因为密切的机密性联系以及经济合作与发展组织\
  \ `OECD` 的指导要求）、信息管理与质量、记录管理等。然而，在充分理解风险之前，无法部署保证职能（[Schou and Shoemaker, 2007],\
  \ p.13）。`OECD` 指南明确指出，“信息系统的使用及其安全性应尊重他人的合法权利和利益，并应与民主社会中数据和信息的合法使用和流动相兼容”。这一要求没有减少，反而过去的过去的十年里变得越来越重要。\n\
  \n在 20 世纪 90 年代后期，`IA` 术语只有少数安全专家知道，通常被认为是“偏执的”或“刻板的”。今天，`IA` 对于参与公共部门项目和合同的更广泛受众为人知，从高级高管到许多学科的工程师。许多人已通过阅读论文和参加简报来寻求有关\
  \ `IA` 流程的信息。然而，即使在 21 世纪 20 年代后期，现状似乎仍然相似，只有少数专业真正理解其含义的广度以及可以从中汲取经验、理解和智慧的材料规模（[Hutton,\
  \ 2008]）。\n\n## GRC 与国际标准\n\n今天，你可以从“信息安全”、“信息风险”、“信息风险管理”、“信息保护”或“信息保证”中进行选择，还可以选择以美国为中心的、全涵盖的伞术“治理、风险与合规\
  \ (GRC)”(Tone at the Top, 2010)。`GRC` 本身可能有多达 22 种不同的定义（[Marks, 2011]），尽管最受青的是开放合规与伦理小组\
  \ (`OCEG`, 2011）提供的定义。从根本上说，`GRC` 与技术无关，而是关于业务流程以及将其做得更好。它是一个透镜，组织可以通过它理解自己的业务，并理解为什么这些元素需要协调工作（风险管理与战略），从而解决碎片化的流程，消除孤岛并进行跨组织的工作。风险管理的国际标准\
  \ `ISO31000` 提供了一个定义，并在这种范围内具有价值（[British Standards Institution, 2009]）。\n\n目标是将信息安全转化为一个多学科领域，在该领域中，技术人员与“软性问题”专家密切合作，例如公共政策、经济学和社会学领域的专家（[Shostack\
  \ and Stewart, 2008], p.103）。`ISACA` 在其信息安全业务模型中（见 `[Figure 7]`）很好地捕捉了这一概念，寻求对一个“从系统角度检查安全问题的整体业务模型提供深入解释”（[ISACA,\
  \ 2009]）。\n\n即使你不喜欢“信息保证”这个术语，它也有很长的历史，显然没有足够的人意识到这一点；因此本节试图将这些碎片整合在一起。从广泛的出版物可以看出，`IA`\
  \ 经常被用作安全的同义词（[Boyce and Jennings, 2002]）。虽然“只要英语仍然是一种活的语言，在信息安全内部创建严格定义的词汇的尝试可能注定会失败”（[Shostack\
  \ and Stewart, 2008]），但意识到实际问题源于定义是很重要的。安全在历史上可能是一个 IT 问题，但保证将门槛提高到了更层次的组织问题，考虑到将信息视为资产的重要性以及保护声誉和个人隐私的需求，这显然显示了该要求的广度。\n\
  \n![](img/P172_01.jpg)\n\n图 7：`ISACA BMIS` – 信息安全业务模型\n\nThe Business Model for\
  \ Information Security, ©2010, `ISACA`。® 保留所有权利。经许可使用。\n\n## 从 IA 到 IG\n\n将 `IA`\
  \ 和 `InfoSec` 放在一起，你实际上得到了“信息治理” (`IG` 或 `InfoGov`)。`InfoGov` 是通过实施的多学科结构、策略、程序、流程和控制措施，以此方式管理所有媒介的信息，以支持组织当前和未来的监管、法律、风险、环境和运营需求。这包括以任何形式的信息（信息系统、纸质、其他记录）。它由一个管理过程支撑，该过程跨组织的方法管理信息资产。它涵盖了信息管理，包括信息安全管理、信息和记录管理、数据保护、隐私（因为密切的机密性联系和\
  \ `OECD` 指南要求）以及物理保护。它包含了公司治理、风险管理和业务连续性的方面，并在面对变化的威胁、漏洞和依赖性时，必须在组织的整个生命周期内维持。\n\
  \n\n\n\n\n信息治理（IG）的核心在于理解从 IT 安全、信息安全到信息保证（IA）的演变过程——所有这些阶段都是为了成熟到一种境界，即能够对信息管理过程中的安全措施、流程和实践表现出合理的信心。虽然近年来信息保证被视为从信息安全中演进而来的增长领域，但最终目标必须是在所有组织中嵌入完整的\
  \ IG 框架，以完全涵盖当今网络主导环境中需要管理、处理和保护的所有相关法律、法规、标准、政策、程序、技术和人员问题。\n\n请考虑一下信息治理的“11 个\
  \ C”。\n\n### 信息治理的 11 个 C\n\n1. 中心化 (centralisation)\n2. 沟通 (communication)\n3.\
  \ (法律)合规性 (compliance)\n4. 信心 (confidence)\n5. 机密性（完整性、可用性）（confidentiality）\n6.\
  \ 符合性 (conformance)\n7. 一致性 (consistency)\n8. 内容 (content)\n9. 连续性 (continuity)\n\
  10. (安全)控制 (controls)\n11. 企业记录管理 (corporate records management)\n\n（现在来点完全不同的内容……！对于那些灵性倾向的人来说，数字\
  \ 11 似乎具有直觉、耐心、诚实、敏感和灵性的特质，并且是理想主义的。人们向具有这些“11”特质的人寻求教学和启发，并通常从这种经历中受益。这些事选择并非偶然，也不是随机！）\n\
  \n作为信息安全经理（ISM），你的目标应该是对 IG 以及良好的信息管理和处理原则、赋能技术和当前最佳实践寻求更深入的理解，同时对你将遇到的所有问题的核心信息的多个方面获得广泛的认知。\n\
  \n至少，随着时间的推移，你可以考虑完善知识体系，以确保对所有这些领域都有广泛的理解：\n\n• IA 及其他领域的原则\n• 信息安全的标准与最佳实践管理 (BP)\n\
  • 软件保证 (SA)\n• 数据保护与隐私 (DP)\n• 记录管理 (RM)\n• 业务连续性/灾难恢复/韧性 (BC)\n\n#### 表 6：所需的知识领域\n\
  \n| 信息保证原则及其他 (IA) | 数据保护与隐私 (DP) |\n| --- | --- |\n| • 信息治理概览<br>• 信息治理框架<br>•\
  \ 信息保证 – 历史——我们是如何走到这里的？<br>• 相关信息类法律概述<br>• 数据处理审查和其他政府主导的倡议<br>• 信息保证成熟度模型 (IAMM)<br>•\
  \ 文化、伦理与职业精神<br>• 内部和外部审计 | • 数据保护原则<br>• 维护公众信任并尊重个人隐私<br>• 信息共享/数据传输 – 收益与限制<br>•\
  \ 隐私影响评估<br>• 获取同意、直接营销<br>• 管理 Cookie<br>• 数据质量管理<br>• 数据泄露管理——与安全事件管理的关联<br>•\
  \ 职场数据保护<br>• 系统测试中个人数据的使用<br>• 刑事犯罪和 ICO 的罚款权<br>• 处理主体访问请求 (SARs)<br>• 约束性企业规则<br>•\
  \ PIMS 和 BS10012 |\n\n| 信息安全的标准与最佳实践管理 (BP) | 记录管理 (RM) |\n| --- | --- |\n| • 信息风险管理\
  \ (IRM)<br>• 风险偏好与风险文化<br>• 治理、风险与合规 (GRC)<br>• ISO27001 和 ISMS<br>• 支付行业数据安全标准\
  \ (PCI DSS)<br>• COBIT, COSO, ITIL | • 记录管理计划 (RMP)<br>• 记录与信息管理 (RIM)<br>• 标准 (ISO15489)\
  \ 与合规<br>• 关键和历史记录<br>• 归档、销毁、保留计划<br>• 并购中的记录处理<br>• 系统退役中的 RM 要求<br>• RM 与灾难恢复和备份的关联<br>•\
  \ RM 与电子邮件管理及存档的关联<br>• RM 与文件计划和目录结构的关联 |\n\n| 软件保证 (SA) | 业务连续性/灾难恢复/韧性 (BC) |\n\
  | --- | --- |\n| • 网络如何适配<br>• 威胁与漏洞分析<br>• 安全控制（访问控制模型和机制）<br>• 可用安全<br>• 设计安全<br>•\
  \ 防火墙和数据加密<br>• 隐私增强技术<br>• 深度防御<br>• 密码学<br>• 身份管理<br>• 安全设计中的人为因素 | • 将信息安全包含在业务连续性管理过程中<br>•\
  \ 业务连续性与风险评估<br>• 业务连续性计划框架，BS25999<br>• 业务影响分析<br>• 测试、维护和重新评估业务连续性计划<br>• 选择、开发和实施灾难恢复计划<br>•\
  \ 嵌入韧性策略<br>• 在规划中应对反恐 |\n\n# 本月其他安全任务\n\n### 处理用户需求\n我们需要在 PC 镜像中撤销 `CD auto-enable`\
  \ 以满足政府规定的安全要求。然而，过段时间后，ICT 收到请求，要求重新开启自动运行功能，因为用户发现这太不方便。\n\n### 处理旧设备\n在几个月里，我们看到在协助可能被认为是设施管理方面有各种需求。你之所以在“干涉”的原因是为了确保你确实对设备的生命终点提供了正确的关注和照顾。那么，当一个用户带着一大箱磁盘走来时，我们该如何处理它们？用户说这些可以丢弃，但我们如何知道里面有什么，以便证明销毁它们的决定是合理的？审查所有磁盘将是一项艰巨的任务。每天都充满了这种需要解决的难题。也许可以对内容进行随机抽样——如果磁盘仍然可被读取的话——然后应用判断标准，确定全部信息是否已超过其保留期。尽可能地与\
  \ `RM` 团队对接，以便他们对记录此类信息的 `RM` 系统进行适当修订。只要你对所采取的行动有证据，并对方法有合理的理由，日后有人质疑，你也会容易解释。\n\
  \n### 持续的杀毒软件管理\n当你的组织发生严重的病毒（恶意软件）爆发时，这可能是 ISM 的一个决定性时刻。团队仍在试图控制 Conficker 攻击，由于之前对服务器缺乏管理（正如渗透测试结果所强调的），攻击已传播得更远。当在某服务器上发现暴力破解攻击时，最终意识到损害的程度。该服务器被立即从网络中隔离，但需要打补丁，这引发了一些非常棘手的问题：\n\
  • 为什么没有打补丁；\n• 哪些在管理循环之外；\n• 决定对这些服务器进行补丁和更新需要多久。这种演示展示了暴露是多么容易且快速，以及如果媒体获取新闻后公众认知可能会如何演变，表明了补丁流程是多么不完善。\n\
  \n### 安全指标\n\n\n\n\n\n# 统计、指标与测量\n\n统计、指标与测量——无论你如何称呼它们，你真的需要理解它们，以便向管理层提供具体的内容，无论是一个列表，还是带有饼图或图表的图片。人们需要看到事物是在改进还是没有改进，对于后者，需要答案或解释，以及恢复改进状态的方案。当\
  \ ISO 制定信息安全管理编号方案 `ISO27000` 时，它允许大量的支持性标准。因此，我们现在有了 `ISO/IEC 27004:2009 信息技术 –\
  \ 安全技术 – 信息安全管理 – 测量`。\n\n还有几种现有的成熟度模型可以适应你的需求。在英国公共部门，有一个非常充足的 `IA` 成熟度模型，它由 `IA`\
  \ 评估框架支持，帮助评估你在实现所需成熟度方面的进展。（可用 `[www.cesg.gov.uk/Pages/Search.aspx?k=Information%20Assurance%20Maturity%20Model](http://www.cesg.gov.uk/Pages/Search.aspx?k=Information%20Assurance%20Maturity%20Model)`。）\n\
  \n大多数成熟度模型采用分阶段的评级方法，从未实施到嵌入。在这种情况下 (`IAMM`)，分级如下：\n\n* 第 1 级 – 初始级\n* 第 2 级 – 已建立\n\
  * 第 3 级 – 业务支持\n* 第 4 级 – 量化管理\n* 第 5 级 – 优化\n\n采用与你行业相关的认可框架有助于对你的起点进行基准测试，并提供预期进展的轨迹。这是在你的职位中尽早非常值得考虑的事情。然后，你的管理报告将具有某种程度的实体性，并能为组织信息安全的现状提供图表化或形象化的表示。将其视为在寻求提供一种“信心计数”——你对所收集的数据有多大的信心，对目前的表示方式有多信心，以及可以通过怎样的表示来更好地讲述信息安全实施及其后续历程的故事。\n\
  \n# 管理更具安全意识的用户群体\n\n这里最合适的短语非得是小心你的所愿”。你提高意识的程度，就越可能从用户群体中获得响应和投入。当你定期举行信息安全意识简报时，人们会觉得更有能力讨论有关信息安全和数据保护的关注问题。\n\
  \n现在分享一个完全随机的用户故事！\n\n一位感到忧虑的员工在经历了我开放式风格的信息安全意识简报会议后（即：让她大开眼界），将我拉到一边提出了一个问题。在失去婴儿这一悲伤和悲剧事件之后，大学是否应该联系过她，研究她的感受，而不参考任何数据保护/隐私声明？大学所做的只是让那个事件再次回到那个可怜的人脑海中，并让她再次心烦意乱。需要更多的关注和谨慎，因为涉及的法律术语是“损害和痛苦（damage\
  \ and distress）”。当一个人站在你面前，质疑这是否本应该发生在他们身上时，你就面对了一个强有力的例子。但从大局来看，他们确实更多地了解了确实存在的法律保护，因此他们知道未来他们有救济途径。\n\
  \n在涉及到系统开发时，人们也开始注意到一些细节，例如密码显示在字段中。\n\n# 第 10 章：5 月 - 政治与管理\n\n## 情境政治意识\n\n维基百科对“情境意识”的描述为：\n\
  \n> 对相对于时间/空间的环境元素的感知，对其意义的理解，以及在某些变量变化后的状态预测……它也是一门关注复杂、动态领域中对决策者至关重要的环境感知的学科。\n\
  \n在许多方面，这本书的构建是为了整合许多对 ISM（信息安全经理）角色至关重要的元素，因为它们能帮助你维持情境意识。对政治影响的理解是这块拼图的一部分。\n\n\
  这个月是英国政府换届月份，这对整个公共部门的 ICT 基础设施和战略规划产生了长时间的深远影响。虽然新政府（保守党–自由党联盟）的到来本应预示着动力，但事实并非如此，特别是由于产生持续影响的严重衰退和经济动荡。\n\
  \n### 安全意识主题\n\n本月的信息安全主题通常应该关注复活节，因为它恰好在此时。你可以开展一次活动，在那些遵守你的整洁桌面策略的用户桌子上留下巧克力（例如，小蛋！）！\n\
  \n## 章总结\n\n本章很大程度上侧重于回顾行业内各种术语的历史之旅，以帮助 ISM 理解他们的角色。虽然这可能感觉结果是更加困惑了，但根据你职位的增长以及融入组织过程中产生的需求，本章可以作为长期参考。\n\
  \n与任何其他职业一样，会有许多人不同意这些定义的表示方式，但作者会挑战他们的研究能力和阅读深度。\n\n\n\n\n\n很大一部分重点被放在了透明度和“获取政府数据的权利”上，这演变成了英国在“大数据”和“原始数据”方面的努力，以及公布所有超过\
  \ 500 英镑的当地政府支出，并在在线发布所有政府招标文件等。所有这一切对参与此类工作的机构的 IT 后勤部门产生了巨大影响，对随着时间推建立的与信息安全（InfoSec）相关的控制和保护措施也是如此。由于其意图是发布大量此前一直保密的信息，因此需要进行风险评估来判断其影响，并解决数据质量、完整性、准确性和呈现方面的问题。这对于所有相关人员来说，这是一项巨型工程的开始。虽然作为一个公共部门的目标完全值得追求，但它并非没有额外开销，而且对于已经工作满载且资源不断的环境来说，代表了重大的分散。\n\
  \n# 语言与管理挑战\n\n通常情况下，管理人员似乎没有在关注，因为他们的认知是安全措施正在阻碍工作。信息安全被指责扼杀了创新。但当你客观地观察这种情况时，这种对现实的描述是不公平的。\n\
  \n未能考虑停止项目、收回资金以及稍后重新启动工作的时间和行动成本，正让组织付出沉重的代价（特别是公共部门）。项目资金的资本化也是错误的观点，因为 ICT（信息通信技术）可能会发现自己部门的资金耗尽。鉴于\
  \ ICT 需要作为组织赖足的坚固且安全的基石，这可能是一个风险很大的策略。\n\n在实施所有最新技术时，显然存在时间和成本的考量。仅仅因为你 ICT 部门中一个孤立的强大爱好者被允许这样做——而没有参与业务部门、没有充分理解或欣赏这些技术寻求支持的业务流程，更没有对影响、威胁和脆弱性进行风险评估——并不意味着这样做是正确或明智的。你需要警惕这一点。\n\
  \n“我不理解加固服务器涉及什么，”最终负责相关 ICT 职的个人说道。一方面，这是一个非常诚实的承认，但另一方面，这也是一个令人震惊的现实。然而，在许多组织中，这种情况很可能发生很多次，因为\
  \ ICT 行业对安全的理解一直非常匮乏。但是，由于该人员下属没有一名员工具备“向上管理”的技能，也没有动力去进一步了解这些挑战，导致这个关键问题一直处于停滞状态。\n\
  \n几名员工参加了安全认证课程，此后他们明白一个关键的短语是“业务部门是否接受风险？”但虽然他们乐意“把这个问题抛出去”，却没有任何机制来发现业务部门到底接受还是不接受该风险——甚至是否理解它。\n\
  \n“为什么我要做许可管理？”负责此的人问道，尽管他们知道自己是拥有适当软件许可资质（`FAST`）的人。你需要检查你的许可，因为你可能在那些用户永远不需要或没有接受过培训、因此永远不会使用的产品许可上花费金钱。无论如何，都会产生成本影响。\n\
  \n一位高级总监匆匆离开，留下来的人对变革计划的持续性、可持续性或财务支持几乎完全没有信心。顾问被聘请到总监级别，他们阻碍了进度，因为他们是新人，并且经常需要从头开始了解一切。这是一个持续且经典的组织问题，即技能和知识离开了组织，总有人需要不断追赶。归根结底，这是一种昂贵且愚蠢的做法。普通的基层劳动者最终被困住无法进展，同时目睹了总监级的人凭借“肥猫”奖金和退休金离开。这非常不稳定，并导致员工情绪低落。\n\
  \n此外，由于语言和管理挑战，人们最终会避免做决策，以免为他人的错误负责；这导致了更多的瘫痪。\n\n# 本月其他安全任务\n\n## 清单管理（再次）\n\n\
  用户现在开始提出他们日常使用的各种技术选项，并查询这些设备的安全性。那么，使用耳机和隐私滤屏呢？谁应该使用这些设备？与他们试图解决的安全问题相比，残障和无障碍访问问题（如果有的话）是什么？答案取决于你为你的组织、你的用户以及所用信息的性质决定它们应该是什么。\n\
  \n那么带有未加密板载内存的移动设备呢？这些是仅加密了 `SD` 卡的移动设备，供正在进行调查的移动办公人员使用。他们需要被建议确保在使用 `SD` 完成调查后退出程序。对于每一项资产项目，你可以看到有将其列在清单上的必要性，并设置某种参考列，以识别适当的安全控制措施，以保护该资产用于处理的信息。\n\
  \n关于清单管理顺便提一下——要留心狡猾的用户。我们收到的最有趣的帮助台电话之一是申请新电脑，使用的“理由”是 PAT 测试（固电器测试）未通过。\n\n##\
  \ 持续的笔记本电脑管理问题\n\n由于去中心化的采购流程，无法控制那些分发到部门、部门和团队设备。还有一堆老旧到无法投入使用的笔记本电脑。这很遗憾，但本身证明是一个“吸取的教训”点，特别是考虑到监管机构和媒体对笔记本电脑控制的关注日益增加。\n\
  \n居家办公的人员需要意识到，如果他们家里有一台笔记本电脑，无论他们用它来做什么，只要它有资产标签，它仍然会被识别为属于某个组织，而最终出现在新闻中的将该组织——即使设备经过了加密。\n\
  \n## 端口控制\n\n管理端口要求的背景现在已众所周知。根据英国数据保护法，数据控制者有责任确保采取所有合理措施来减轻数据泄露或安全被泄露的潜在风险。英国《数据保护法》中的第七条原则要求组织作为数据控制者，实施适当的“技术和组织”措施来确保个人数据安全。未能这样做将使组织面临罚款风险，金额最高可达\
  \ 500,000 英元。\n\n\n\n\n\n标准的企业台式电脑可能有多达八个 `USB` 端口。某些端口用于外围设备，如键盘或安全令牌读取器，但通常会有一个或多个未使用的端口。在本书作为示例的组织中，`USB`\
  \ 端口默认是“始终开启”的，随时准备为插入终端计算机的任何支持 `USB` 设备提供服务。\n\n您的组织可以选择通过 Windows® 组策略和活动目录管理\
  \ (ADM) 模板禁用 `USB` 访问，但此操作并不能为管理员提供细粒度的控制。它是“全有全无”的，因此终端上的所有 `USB` 端口要么可用，要么不可用。由于大多数终端现在都需要\
  \ `USB` 来连接强制性外围设备，这种控制实际上是徒用的。解决这一难题可能需要项目团队资源来调查有关端口控制的最佳方法。然而，成本往往决定了部署更廉价的解决方案，即使这会降低整体安全性——并增加管理开销。这只是您的职责中将面临的众多困境之一，即寻求提供指导、引导以及满足所有需求的最佳整体解决方案。这是一项艰巨的任务，也是一项困难的挑战。\n\
  \n随着政治格局的变化以及随之而来的支出收紧，原定的端口控制项目停滞了，因此可移动设备的控制并未按计划进行。目前正在实施一种更廉价的过渡方案，使用活动目录来控制端口。这凸显了战术和方法方面一个有趣的难题。活动目录列表所持数据的准确性始终是一个至关重要的起点。此外，全局地址列表\
  \ (`GAL`) 是您组织配置中具有根本意义的元素，确保其中包含准确且最新的信息至关重要。当涉及到用户时，这回到了我们提到的需要一份最新的用户列表的需要，以便您了解自己的用户群是谁——而这只有在管理人员进出组织的各个团队的协助下才能实现并维护。您还需要知道谁可能由于出于任何合理且经过风险评估的原因而需要进入“例外”列表，以便他们可以从在活动目录中固定的“应用所有”设置中排除，而该设置是作为针对所有用户发布策略设置的一种。\n\
  \n事实上，作为信息安全经理 (ISM)，您面临的许多任务和挑战都会回到这种困境中——如果没有高质量的信息和向前迈的坚实基础，您无法有效地完成任何事情。\n\n\
  ### 外包功能\n\n当您的员工从您的组织移动到伞下的第三方代理机构时，他们真的可以带走他们的电子邮件 `.pst` 文件吗？如果是的话，应该对这些文件进行何种程度的审查，以确保您的组织信息资产不会意外流——特别是当\
  \ `.pst` 所有者将其作为文件存储系统（记录管理存储）时，这在大多数情况下是事实。这只是您可能面临的无数困境之一，并且需要适用于您组织的答案。如果能挥一挥魔术棒，说一个答案适用于所有情况就好了。尽管如此，原则和方法是相同的。请考虑面临风险的资产资产、威胁、可能性、影响（对谁产生）等——并相应应用适当控制措施。\n\
  \n### 安全事件\n\n某个人在家庭地址收到了一封装在棕色封里的 50 张工资单。他们在回到大学之前签过一份短期合同，他们自己的工资单被寄到了家里，但显然他们并没有预料到这一点。\n\
  \n### 安全意识主题\n\n作为一名安全专业人员，这是我非常感兴趣的话题。安全意识对任何组织都是至关重要的。这不仅关乎工具，更关乎人员和文化。员工需要理解风险以及如何保护自己。这是一个持续的过程，而不是一次性的事件。\n\
  \n### 安全意识主题\n\n安全意识安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全安全意识安全安全安全安全安全意识。目标是培养一种具有安全意识的文化。\n\
  \n### 章节总结\n\n简而言之，你需要“凡事都要省；要守良好的”（约翰一后书 5:21）。\n\n### 第 11 章：作者不应该做的\n\n### 内部审计是有历史的\n\
  \n与内部审计的关系往往是紧张的，但在本书的开头，意图是以积极的光线来描绘信息安全。维护内部审计是经验的很大一部分，因为你经常发现，你需要实施的任何更改在很久以前就已经很多次在之前的审计报告中被识别出来了。\n\
  \n在作为许多经历核心的那个组织案例中，它曾受到过“特别措施”，并充满了政治内斗。这对组织有效高效地运行造成了极大的负面影响。虽然可能觉得这超出了典型的 ISM\
  \ 角色的范围，但理解你被迫运营的环境至关重要。这样，尽管周围发生了这一切，你仍然可以继续取得必要的进展。在政治斗争的漩涡中，总有一个“大局”，一个需要考虑和记忆的历史背景。\n\
  \n`表 7` 中的时间顺序旨在展示，如果你去寻找，你的组织中会有多长的历史——对你所工作的时间线表示理解最有帮助。\n\n**表 7：组织历史**\n\n|\
