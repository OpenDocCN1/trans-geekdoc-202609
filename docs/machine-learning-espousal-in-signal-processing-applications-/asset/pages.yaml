  md: 'where


    a is the scaling parameter, and b is the time-shift parameter.


    $\varphi\left(\frac{t - b}{a}\right)$ is the mother wavelet function.


    $C(a, b)$ represents the wavelet coefficients.


    Wavelets are generated from the single mother wavelet $\varphi\left(\frac{t -
    b}{a}\right)$ by scaling $a$ and shifting $b$; if $a > 1$ dilates, $a < 1$ contracts
    the signal. The coefficient $\frac{1}{\sqrt{a}}$ is used because the signal has
    to normalize for all scales. The CWT is a dot product of the original signal $s(t)$
    and scaled, shifted version of the mother wavelet $\varphi(t)$.


    CWT introduces a lot of duplication in the calculation of wavelet transforms,
    and also, it does not support multiresolution analysis (MRA) of signals. An alternative
    to this is using DWT, which is a sampled version of CWT. The limitations of the
    CWT are handled by the DWT efficiently.


    # 12.2.2.2 Discrete Wavelet Transformation (DWT)


    DWT is a powerful tool for digital signal analysis in the time domain. An original
    time series is broken down into various components, each of which can hold meaningful
    signals from the original time series. The main goal of the transition is aimed
    at reducing data size and/or reducing noise. Wavelets consist of mathematical
    functions that are used to decompose data into different components. DWT separates
    the input signal into different components and different scales into different
    frequencies. The frequency is the count of the repeated occurrences over a time
    unit, and the scale is the time interval of that time series. A time series with
    a frequency of six event occurrences per minute can be represented as a 10 s interval
    (scale) between events [2]. DWT transforms data into a new representation which
    is decomposed into multiple scales; the analysis of the transformed data is also
    performed at multiple resolution levels as well [3].


    For different applications, wavelets display different attributes and performance.
    Hence, choosing a suitable wavelet filter is vital in finding the distinctive
    features of time series analysis. The DWT decomposes a signal into a set of mutually
    orthogonal wavelet basis functions in wavelet analysis. The signals are analyzed
    by wavelet transforms at multiple resolutions for different frequencies. In the
    medical domain such as EEG which is the most important for the diagnosis of epilepsy.
    The EEG signal is decomposed into several subbands of frequency using DWT. The
    intermediate results are given to the classification algorithm (e.g., artificial
    neural network). From the decomposed subband of EEG, ANN can classify the diagnosed
    patients as healthy or epileptic.


    DWT plays an essential role in time series analysis, such as the reduction of
    dimensionality, noise reduction, and MRA. The original signal is distributed as
    separate signals with different frequencies with the help of the DWT function.
    Also, the original signal can be reconstructed from these separated signals. DWT
    converts the time series data into DWT coefficients. Different data analyses are
    then carried out on these DWT coefficients. To project a large time series into
    DWT coefficients, other data analyses are performed on these coefficients. Since
    DWT transforms the original time series data into approximation'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'and detail coefficients, it can detect sudden changes in the signal as well.
    In general, the approximation features rough features, while the detailed coefficients
    capture the features that designate the frequent movement of the data. The detail
    coefficients can be analyzed to identify the sudden changes in the data by observing
    the peaks or spikes in the signal, which is difficult to detect from the original
    signal.


    # 12.2.2.3 Computation of Discrete Wavelet Transform


    +   - **Step 1:** The wavelet is placed at the beginning of the signal, the inner
    product of the signal, and the wavelet is calculated and integrated for all times.
    The result is the correlation coefficient c, which provides the ‘local similarity’
    of a part of a signal and the wavelet.

    - **Step 2:** The wavelet is then shifted to the right, and the above step is
    repeated until the end of the signal.

    - **Step 3:** After scaling the wavelet, the above two steps are repeated.

    - **Step 4:** Repeat steps 1 through 3 for all scales.


    Calculating wavelet coefficients at every possible scale requires a lot of data.
    If a and b are chosen discrete, the wavelet won’t generate massive amounts of
    data. If a and b are powers of two, then the analysis becomes much more efficient
    and accurate. Equation (12.3) depicts the formula to estimate the wavelet coefficients.


    $$D(a, b)=\frac{1}{\sqrt{a}}\sum_{m=0}^{p-1} f[t_m]\varphi\left[\frac{t_m - b}{a}\right],\qquad
    (12.3)$$


    +   where

    - $a, b$ are scaling and shifting parameters and

    - $a=2^{j}$ and $b=k2^{j}$,

    - $j$ indicates the scale index value, and

    - $k$ is the wavelet transform signal index.

    - $f[t_m]$ is the time-series signal, and

    - $\varphi$ is the mother wavelet function.


    Wavelet transform $D(a, b)$ can decompose a signal into different scales with
    different levels of resolution through the shifting of a single prototype function
    known as the basis wavelet let $\varphi$. The DWT is widely used in the decomposition
    of time series signals from various domains.


    For a time-series signal of length $N$, the DWT processes the signal in different
    stages. In the first stage, the signal is simultaneously convoluting the signal
    with a low-pass and high-pass filter. The outcome of this approach provides a
    set of low pass and high pass filter approximation coefficients $(A1)$ and detail
    coefficients $(D1)$, respectively. The approximation coefficients represent the
    low-frequency, coarse-scale signal components, while the detailed coefficients
    represent the high-frequency fine-scale signal components. The resultant data
    are down-sampled by 2. In the next step, the approximation coefficient $(A1)$
    is again decomposed into approximation coefficient $(A2)$ and detailed coefficients
    $(D2)$ using the same process. This process is repeated to produce $A3, D3$, and
    so on.'
