    which is important for real-time applications as in the case of our study, so
    we classified it as priority 2 and finally the memory consumption because of the
    size of the microprogrammed circuits, so priority 3. At the end of this analysis
    and according to Table 11.11, we agree that the ESPRIT_TLS variant is the most
    suitable.


    # 11.11.2 Fault Classification Algorithms


    In this part, we are looking for, among the fault classification algorithms, the
    architecture capable of detecting a fault with a very good precision in order
    to compare it with the ESPRIT_TLS algorithm to choose the best adapted technology
    for the purpose of this work. The simulations here, we made them in the time and
    frequency domain.


    # 11.11.2.1 Artificial Neural Networks and Genetic Algorithms


    The transfer functions used in the layers are: logsig, tansig, softmax. For the
    drive function, we used the trainbr function which is suitable as a learning function
    for the transfer functions used. The performance function that is also suitable
    is the MSE.'
