    # 3.5.2.5 Support Vector Machines


    A SVM is considered to be the enhancement of the perceptron algorithm. The optimization
    objective is to set a decision line that splits the classes by increasing the
    merging between the line and the sample data that are nearby to the hyperplane
    as shown in Figure 3.10. These data points are expressed as support vectors [39–42].


    # 3.5.2.6 Maximum Margin Lines


    To set the extreme margins, two parallel lines (margins) are added, and the distance
    is maximized to the original decision line. The errors or misclassified points
    (errors), points between the margins and the line, are considered. Large margin
    decision lines incline to have a lower overview error. In other words, models
    having small margins incline to be less disposed to overfitting [43–58].


    The calculation of maximization function is done as follows:


    ```

    w0 + w^T x_pos = 1

    w0 + w^T x_neg = -1

    ```


    Subtraction of expressions leads to


    ```

    => w^T (x_pos - x_neg) = 2

    ```


    the vector length w,


    ```

    ||w|| = sqrt( sum_{j=1}^{m} w_j^2 )

    ```'
