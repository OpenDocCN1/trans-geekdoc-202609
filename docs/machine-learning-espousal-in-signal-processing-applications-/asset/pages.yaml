  md: 'The signals in the corresponding subspaces are related as


    $x_M(t)=\sum_{i=1}^{J}y_{M-i}(t)+x_{M-J}(t)$  (8.15)


    where


    $x_{M-J}(t)$ is the coarsest approximation of $x_M$, and


    $x_j(t)=\sum_k c_{j,k}\phi(2^j t - k)\in\mathbf{C}_j$  (8.16)


    $y_j(t)=\sum_k w_{j,k}\psi(2^j t - k)\in\mathbf{W}_j$  (8.17)


    # 8.3.2 Wavelet Neural Network


    WNN combines the principles of wavelet and neural network into one. From Equation
    (8.15), it can be concluded that an arbitrary function can be approximated using
    basis functions from wavelet and approximation subspaces. This idea has led to
    the development of WNN where scale and position factors are iteratively adapted
    to approximate a target function.


    The simplest form of WNN consists of only one hidden neuron as shown in Figure
    8.3. It consists of input $x$, wavelet function translated by $\tau$ and dilated
    by factor $\delta$. The output of the function is $y$ and computed as follows:


    $y = \psi_{\delta,\tau}(x)=\psi\left(\frac{x-\tau}{\delta}\right)$  (8.18)


    The output $y$ of such a neuron is nonzero only when the input lies within the
    support of the function $\psi_{\delta,\tau}(x)$. Several such single “wavelet
    neurons” or “wavelons” form a hidden layer of WNN and their output are linearly
    combined to approximate a given function. Wavelet neural networks are mainly of
    two types based on their architecture. The first one is based on relation (8.16)
    in which a given function is approximated using scaling function $\phi$ only.
    In this variety of WNN, wavelet analysis and neural network operations are performed
    separately (Veitch 2005). Such networks are called wavenet, in which signal input
    to the network is decomposed using different wavelet basis in the hidden layer
    and then combined at the output layer. In the architecture of wavenets, translation
    and dilation factors are fixed initially and are not changed during learning process
    of neural network.


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_208_0.png)


    FIGURE 8.3

    A single wavelon.'
