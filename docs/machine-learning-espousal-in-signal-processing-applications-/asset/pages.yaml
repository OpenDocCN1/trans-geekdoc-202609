    which minimize the error function between the actual results produced (calculated)
    and the corresponding target (desired) values in the learning set. One of the
    widely used error functions is the mean square error (MSE) and the most commonly
    used algorithms are based on the delta rule for hidden layer networks called the
    back-propagation rule of the error gradient. This algorithm, which has the advantage
    of existing, remains debatable insofar as its convergence is not proven. Its use
    may lead to blockages in a local minimum of the error surface. Its efficiency
    depends, in fact, on many parameters that must be set by the user: the gradient
    step, the parameters of the automaton sigmoid functions, the network architecture,
    the number of layers, the number of neurons per layer, the initialization of the
    weights. The MLP neural network, used in this work, is composed of an input layer
