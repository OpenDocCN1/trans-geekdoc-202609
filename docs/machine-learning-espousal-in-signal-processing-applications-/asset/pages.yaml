    in an array needed to represent it.

    - Vectors in math’s consist of a collection of numbers, whereas a matrix comprises
    2-D vectors.


    The concept of vectors plays a vital role in supervised machine learning algorithms
    as the target variables, whereas the features extracted from the data form the
    matrix. A number of operations can be performed using the matrix such as conjugate,
    multiplication, rank, and transformation. Two vectors with the same number of
    elements and dimension may be used in order to perform both subtraction and addition
    [11].


    2. Symmetric Matrix: Symmetric matrix plays a vital role in both linear algebra
    as well as machine learning. Linear algebra matrices are majorly used in order
    to carry out functions. In majority of the cases, such functions are symmetrical
    in nature, along with their corresponding matrices. These defined functions as
    well as their values may be used for measuring the feature distance as well as
    feature covariance.


    Some of the identified features of symmetric matrices are as follows [12]:


    +   - The matrix and its inverse are both symmetrical in nature.

    - Eigenvalues consist of only real numbers.

    - A matrix multiplied with its transpose gives a symmetric matrix.

    - The symmetric matrices consist of the factorization property.

    - For matrices having linear independent columns, the matrix multiplied with its
    transpose results in a matrix which is invertible in nature.


