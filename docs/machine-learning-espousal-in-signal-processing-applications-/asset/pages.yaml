  md: '# 6.7.3.2.1 KNN (K-Nearest Neighbors)


    The KNN is recognized as the simplest machine learning algorithm based on supervised
    machine learning in which the function vector among k neighbors is assigned to
    its closest class by the nearest unattended neighbor classifiers. The KNN algorithm
    stores all available data and, on the basis of similarity, classifies a new data
    point. This means that it can be easily grouped into a well suite category as
    new data emerge.


    Basic steps of KNN algorithm are as follows:


    +   1. Pick the neighbors’ number K.

    2. Calculate the Euclidean distance from the number of neighbors of K.

    3. Take the K nearest neighbors, as per the determined Euclidean distance.

    4. Count the number of data points between these k neighbors and the group.

    5. Assign the category for which the limit is the neighbor’s number to new data
    points.

    6. The model’s readiness.


    KNN is a nonparametric (does not take any inference of underlying data) algorithm
    and a lazy learner algorithm that does not automatically learn from the training
    set.


    Simplicity is the main technical beauty of KNN algorithms. This machine learning
    algorithm owes an easy way of implementation and effectiveness. It can therefore
    give good results with successful algorithms for characteristic selection and
    reduction.


