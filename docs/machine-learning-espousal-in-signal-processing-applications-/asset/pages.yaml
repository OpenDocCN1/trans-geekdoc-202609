  md: 'Any **random variable** (x) can be defined as a variable that randomly picks
    on any values from a considered sample space. For example, let us say x represents
    the outcome of flipping a coin, it may be defined as holding a specific outcome
    as x = heads/tail.


    Random variables can hold discrete values like the coin outcome or continuous,
    i.e., infinite number of possible outcomes within a range.


    To define the chance of every individual possible value of any given random variable
    x, a **probability distribution can be specified**. Random variable (x) here can
    be defined as x ~ P(x) to indicate that it is a random number that is extracted
    out of the probability distribution P(x). The probability distributions factor
    here is described different basing upon weather the random variable is discrete
    or continuous [18,19].


    +   - **Discrete Distributions**: A discrete random variable may be defined with
    a **probability mass function** (PMF) which maps every value given within the
    considered variable''s sample space to the probability. For example, uniform distribution
    over n number of possible outcomes: P(x = x) = 1/n.


    This can be calculated as “The probability of x taking on the value x is 1 divided
    by the number of possible values.” It’s named as uniform distribution since every
    outcome has equal likelihood (the possibility of the outcome is uniformly extended
    over all possible values). Here, fair dice rolls are modeled by a uniform distribution
    as every face of the die has equal opportunity to occur. A loaded die is modeled
    with a categorical distribution, as shown in Figure 10.3, where every outcome
    has been attached with a different probability.


