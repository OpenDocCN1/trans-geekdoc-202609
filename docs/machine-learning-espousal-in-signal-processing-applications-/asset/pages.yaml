  md: "iii. **Echo-State Networks (ESN)**: It is a type of RNN. Usually, RNN is rarely\
    \ used in TSC. By removing the need to measure the gradient for the hidden layers,\
    \ reducing the training time, and avoiding the vanishing gradient problem, ESN\
    \ is designed to mitigate RNNs’ problems [16]. The hidden layers constitute a\
    \ reservoir and are initialized randomly [17]. Each neuron in the reservoir creates\
    \ its nonlinear activation function for the input series. The inter-connected\
    \ weights and the input weights in the reservoir are not trained. The output of\
    \ the reservoir is prepared by learning algorithms such as logistic regression\
    \ or ridge classifier. RNNs are based on ESNs and speed up the training process\
    \ as they are very sparsely related, with most of their weights a priori set to\
    \ randomly selected values [18]. After rapid preparation, they show impressive\
    \ results. Besides, they are beneficial for dealing with the chaotic time series.\n\
    \nThe basic equations of ESNs are given below in Equations (12.5) and (12.6):\n\
    \ns(n+1) = f(W^{in}·i(n+1) + W·s(n)·W^{back}·o(n))          (12.5)\no(n+1) = f^{out}(W^{out}·i(n+1),\
    \ s(n), o(n))          (12.6)\n\nwhere\n  i(n), s(n), and o(n) are input vector,\
    \ state vector, and output vector of ESNs, respectively.\n  The terms f and f^{out}\
    \ are activation functions for internal neurons of the processing unit and output\
    \ unit of the reservoir, respectively.\n\nFigure 12.3 illustrates the ESN.\n\n\
    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_364_0.png)\n\nFIGURE 12.3\nAn echo state\
    \ diagram for time-series classification."
