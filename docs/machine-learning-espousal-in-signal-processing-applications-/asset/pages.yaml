    filters.


    # 8.3 Wavelet Neural Network


    Wavelets were first introduced in the field of multiresolution analysis and have
    since been applied to numerous areas including signal processing (Goswami and
    Chan 2011). WNN, on the other hand, is usually a three-layer neural network consisting
    of input, hidden and output layer. Contrary to ANN, the hidden layer in WNN consists
    of wavelet bases as activation function instead of sigmoid function. The idea
    of WNN is to iteratively update the parameter of wavelet basis suitable for the
    training data. In this section, the fundamental concepts of wavelet analysis and
    WNN are explained.


    # 8.3.1 Wavelet Analysis


    The ability of wavelet transforms which distinguishes it from Fourier transform
    is its ability to efficiently represent an arbitrary signal in both time and frequency
    domain. It allows us to identify the time at which specific frequency components
    appear, exist or vanish. This is possible due to *compact support* feature of
    wavelet basis functions. Compact support of wavelet basis function allows the
    wavelet transform to efficiently represent abrupt changes or localized features
    in the signal.


    Wavelet basis is generated from translation and dilation of *mother wavelet* $\psi$.
    The mother wavelet is a short duration oscillatory signal whose average value
    is zero, i.e.,


    $$\int \psi(t) dt = 0\tag{8.8}$$


    besides fulfilling other requirements like admissibility condition (Goswami and
    Chan 2011). Translated and dilated versions of mother wavelet are given as


    $$\psi_{a,b}(t)=\frac{1}{\sqrt{a}}\psi\left(\frac{t-b}{a}\right)\tag{8.9}$$


    +   where

    - $a > 0$ is the scale or dilation factor, and

    - $b$ is the position or translation factor. Let us consider an arbitrary function
    $x(t)$.


    The continuous wavelet transform (CWT) of $x(t)$ is given as'
