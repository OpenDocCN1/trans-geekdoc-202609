    # 7.4.3.2 Multiple Access Interference Mitigation in CDMA


    In a CDMA system, all users share same frequency band, and they are distinguished
    by (quasi)-orthogonal spreading codes. However, on dispersive broadband channels,
    orthogonality among codes is disrupted, and multi-user access interference (MAI)
    is present on received signal. But interference among the symbols and chips of
    the same user arises. One of the most common solutions to suppress the MAI is
    use of an adaptive filter. A single user receiver, based on a linear filter, minimizes
    the square of the difference between the output and the transmitted symbols of
    the user. In multi-user communication systems, for example, code division multiple
    access (CDMA) systems, the dominant source of impairment is co-channel interference
    coming from simultaneous active user signals occupying the same frequency band.
    Significant efforts have been made on developing multi-user detection techniques
    for reducing interference [4,5].


    We can use LMS algorithm-based adaptive filter in a direct-sequence code-division
    multiple-access (DSCDMA) dispreading application. The filter can extract useful
    information from noisy data by correlating input chips with PN sequence of the
    desired user. Interference from other users as well as any multipath effects are
    all treated as noise in this system (Figure 7.10).


