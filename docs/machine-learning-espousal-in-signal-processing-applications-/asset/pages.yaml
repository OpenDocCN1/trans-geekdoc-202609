    # 12.4 Comparison for Morlet, Mexican Hat, Frequency B-Spline Wavelet Toward the
    Classification of ECG Signal


    In the recent advance on IoT-based healthcare systems, the ECG exhibits a vital
    role in heart disease diagnosis. IoT- based biosensors are used to record these
    ECG signals [19–21]. The ECG signals capture the heart condition as electrical
    activities and convey different pathological data of heart functioning. The medical
    practitioners judge the heart functioning status based on the characteristics
    of the electrical signal of ECG. However, such a mere naked eye-based diagnosis
    is not possible in every patient’s case. The factors such as the number of patients,
    limited time, and a large amount of data increase the complexity of the doctors
    to be efficient. Hence, the intervention of IoT sensor devices, artificial intelligence,
    and automated computer-aided diagnostic systems are required for ECG-based heart
    disease diagnosis.


    In this study, the arrhythmia data from the Physionet Database of MIT- BIH Arrhythmia
    Laboratory are considered for experimentation purposes. The database consists
    of 48 records of ECG signals over 45 human subjects, where 19 females are in the
    age group of 23–89 years, and 26 males are in the age group of 32–89 years. In
    total, the MIT-BIH arrhythmia data set consists of 13,724 heartbeats. There is
    an annotation file that marks the complexity and heartbeat type of each signal
    record along with the database [22,23].


    The classification of ECG signal involves differentiating between arrhythmia (ARR),
    congestive heart failure (CHF), and normal sinus rhythm (NSR) heart function disorders
    [24,25]. Arrhythmia represents the inappropriate electrical activity detected
    in the sinus node of the heart. Congestive heart failure occurs due to inefficient
    pumping of blood by the heart [13]. In these cases, the blood accumulates in the
    organs such as the legs, hand, liver, and lungs due to CHF. Normal Sinus Rhythm
    occurs due to exiting of the sinoatrial node stimulus and outspread to the left
    heart ventricles. Abnormal ECG signal characteristics due to NSR heart disorder
    are given below in Table 12.1.


    TABLE 12.1

    Abnormal ECG Signal Characteristics Due to NSR


    | Parameter | Characteristics |

    |---|---|

    | PR distance | ≤0.20 s |

    | QT distance | 0.39 s in Female and 0.44 s in male |

    | QRS complex | ≤0.10 s |

    | PR & ST segment | Isoelectric |

    | P wave | 0.04–0.12 s and amplitude ≤0.25 mv |

    | T wave | 0.10–0.25 s |

    | Rhythm | R-R range and P-P range must be equal |

    | Rate | 60–100 per min |'
