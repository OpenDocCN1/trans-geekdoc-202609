  md: '# 12.3 Machine Learning and Deep Learning Techniques for Time Series Analysis
    in IoT


    Machine learning and deep learning make use of wavelet transform for feature extraction
    and dimensionality reduction. Features, in general, provide essential information
    about the data. It is the primary quantity that represents the uniqueness between
    different classes. Due to the time-frequency localization and adaptive multiscale
    properties, the wavelet transform is beneficial for feature extraction [4]. The
    critical aspect of using wavelet transform for feature extraction includes selecting
    suitable wavelet transform and the number of decomposition levels. The number
    of levels of decomposition is dependent on the signal''s dominant frequency components.
    It is important to choose the decomposition levels in such a way that the signal
    and the frequencies preserved by the coefficients of the wavelet should be well
    associated. Compared to CWT, DWT is easy to implement and reduces resource and
    computation time. Besides, it produces sufficient information for analysis of
    the original signal.


    The signal was broken down into different resolution levels during feature extraction.
    Coarse-resolution data contain information about the lower-frequency components
    that preserve the original signal''s key characteristics, while the fine-resolution
    data retain information about the higher-frequency components. The detail coefficients
    D1, D2, etc. are the outputs of the high-frequency bands, and the approximation
    coefficients A1, A2, etc. are the outputs of the low-frequency bands. The extracted
    features known as wavelet coefficients represent the energy distribution of the
    signal in time and frequency.


    As the IoT and pervasive computing are becoming part of our daily lives, time-series
    data are generated by numerous applications, including financial applications,
    environment monitoring, medical and healthcare, etc. Often, the high dimensionality
    of the time-series data is making the general-purpose machine learning algorithm
    underperform or fail. Hence, to extract meaningful knowledge from the time-series
    data, efficient algorithms are required. Time series classification (TSC) algorithms
    implement to classify the unknown time-series examples based on the pattern existing
    in the data. As the first step of classification, the dimensionality of the time
    series data can be reduced by using DWT to improve the classification accuracy.
    Also, DWT can be used to reduce the noises in time-series data for better classification
    performance. Implicitly, the wavelets smoothen the time-series data for more effective
    classification.


    # 12.3.1 Time Series Classification Algorithms


    Like general classification algorithms, the TSC algorithms also involve learning
    from existing labeled time series instances and utilizing the knowledge learned
    to classify a new unknown instance whose label is unknown. The time-series data
    are generated from the IoT devices and the application domain such as image and
    speech recognition (e.g., for recognizing spoken words), medical diagnosis (e.g.,
    for detecting heart disease from the ECG signal), gesture detection, and so on.


    The fundamental concept behind wavelet analysis is to express a signal as a linear
    combination of a certain set of functions (wavelet transform, WT), which is obtained
    by moving and dilating a single function called a mother wavelet. The signal decomposition
    leads to a set of coefficients called coefficients of the wavelet. Therefore,
    as a linear combination of wavelet functions weighted by the wavelet coefficients,
    the signal can be reconstructed. A sufficient number of coefficients must be calculated
    to achieve an exact reconstruction of the signal. Time-frequency localization
    is the main function of wavelets.'
