  md: '# 7.1 Introduction


    A filter is a system that is used to extract useful information from noisy input
    data. There are varieties of sources from which noise may arise. For example,
    data collected by means of sensors or noise that gets added to useful signal component
    by transmitting it through a communication channel. Linear and nonlinear filters
    are two classes of filters. If the filtered output is a linear function of input
    data, then filter is said to be linear. Otherwise, filter is said to be nonlinear.
    Prior information about the statistical nature (i.e., mean, variance) of useful
    information and unwanted additive noise is required to design a linear filter.
    Linear filter can be optimized to reduce the mean square value (MSE) of the unwanted
    additive noise. The resulting linear filter which is optimized in mean square
    sense is Wiener filter. Wiener filter cannot deal with the situations in which
    signal and/or noise has nonstationary nature. In such situations, Kalman filter
    (time-varying form of linear filter) can be used. Linear filter is most efficient
    when the characteristics of the input observations are the same or nearly the
    same as prior information which was used to design the filter. Whenever this condition
    becomes false, it is difficult to design efficient Wiener filter. The “estimate
    and plug” approach can be used in such situations. It is a two-step process. Firstly,
    filter “estimates” statistical parameters of the useful signal and then “plugs”
