    # 1.3.3 Hilbert Space


    The notion of a Hilbert space emerged from the efforts of a German mathematician
    David Hilbert to generalize the concept of Euclidean space to an infinite dimensional
    space. It expands the vector space from the two- and three-dimensional domains
    to domains with multidimensions or infinite dimensions. Hilbert space includes
    few additional properties to normal vector spaces such as an inner product operation
    that allows length and angle measurements. They are complete metric spaces that
    satisfy the following three properties [17]. Here, F is considered as a linear
    vector space.


    +   (a) **Positive:** $x, x \ge 0$, for $x \in F$; $\langle x, x \rangle = 0$
    only if $x = 0$

    (b) **Symmetry:** $\langle x, y \rangle = \langle y, x \rangle$ for $F \in \mathbb{R}$
    ; $\langle x, y \rangle = \overline{\langle y, x \rangle}$ for $F \in \mathbb{C}$

    (c) **Distributive:** $\langle x, y_1 + y_2 \rangle = \langle x, y_1 \rangle +
    \langle x, y_2 \rangle$, $x, y_1, y_2 \in F$

    (d) **Multiplicative:** $\langle \lambda x, y \rangle = \langle \lambda x, y \rangle$,
    for $x, y \in F$ and $\lambda \in \mathbb{C}$


    The advantage of Hilbert space is that there is no restriction on the vector dimensions—they
    can be finite, infinite, or even functions. Kernel methods in machine learning
    use Hilbert space to perform dot product computations.


