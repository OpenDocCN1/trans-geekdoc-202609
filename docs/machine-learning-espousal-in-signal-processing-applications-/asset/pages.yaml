    The adjective “adaptive” refers to a system that tries to adjust itself such that
    it will be able to understand and respond to some phenomenon that is happening
    in its surrounding environment. The system tries to adjust its parameters to meet
    specific objectives that depend on the state of the system and the state of system
    environment. This is called as adaptation. Moreover, “adaptation” can be achieved
    using many algorithms. Adaptation is achieved using a recursive or iterative algorithm,
    which helps for the filter to operate efficiently in an environment where absolute
    information of the relevant parameters is not available. This algorithm starts
    with some predetermined set of initial values, representing whatever is already
    known. In reality, adaptive filter is a nonlinear device (because filter parameters
    are data-dependent), which means it does not follow the principle of superposition.
    Adaptive filters can be classified into linear and nonlinear filters. If the value
    of the required quantity is calculated adaptively as a linear function of samples
    applied as input of filter, then it is said to be linear.


    The advantages of using iterative algorithm for achieving adaptation are as follows:


    +   1. Direct calculation of the statistical properties and their usage for calculating
    the other quantities of interest (filter coefficients) can be done only by adding
    a large number of input observations. Iterative solutions do not require accumulation
    of a large number of observations, thereby reducing memory usage.

    2. In non-iterative solutions, accumulation of signal samples and post processing
    to produce the filter output result in a significant delay in computation of filter
    output. This is not acceptable in many real-time applications. Recursive solutions,
    on the other hand, do not add any considerable amount of delay in computation
    of the filter output.

