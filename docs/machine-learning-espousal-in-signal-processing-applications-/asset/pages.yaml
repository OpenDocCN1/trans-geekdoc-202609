  md: '# 11.3 Asynchronous Machines


    The asynchronous machine is an alternating current machine that has no connection
    between the stator and the rotor. The term asynchronous comes from the fact that
    the rotor speed is different from the pulsation of the stator currents.


    The reason for our choice to focus on the asynchronous machine is that the asynchronous
    machine is widely used in industrial applications, because due to its design,
    its cost is relatively lower than that of other machines, its electromagnetic
    robustness is high, and there is good standardization between different manufacturers.
    However, the simplicity of design of this machine hides a rather important functional
    complexity. It should also be mentioned that the asynchronous machine was for
    a long time strongly competed with the synchronous machine in high power domains,
    until the advent of power electronics. Today it is found in many applications,
    particularly in transport (metro, trains, ship propulsion), industry, and household
    appliances.


    Originally it was only used in engines, but thanks to power electronics, it is
    more and more often used in generators. This is for example the case of wind turbines.


    These asynchronous machines are made up of a fixed part called the stator and
    a moving part called the rotor which, depending on the operating mode (motor or
    generator) of the machine, provides the source of the induction.


    We present, respectively, an asynchronous machine, a rotor, and a stator in Figures
    11.1 and 11.2.


