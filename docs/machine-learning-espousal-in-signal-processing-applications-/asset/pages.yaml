    # 1.3 Distance-Based Signal Classification, Nearest Neighbor Classifier, and Hilbert
    Space


    # 1.3.1 Distance-Based Signal Classification


    Various real-world applications require machine learning algorithms to classify
    signals or objects. Identifying input data patterns is fundamental for such classification
    applications, and choosing the right distance metric is critical to make informed
    decisions. Good distance metrics can be used to enhance model accuracy and performance
    of machine learning algorithms. This section focuses on various distance metrics
    and how they contribute to SPML. Few key definitions are fundamental to distance
    metrics as that of metric space, normed linear space, and inner product space.
    From the definitions, you will notice that normed linear spaces and inner product
    spaces are just types of metric spaces that belong to the same family.


    # 1.3.1.1 Metric Space


    Metric space is simply a collection of objects (e.g., numbers and matrices), and
    a metric or distance function is a function that defines a distance between each
    pair of point elements of a set [17]. Some applications in SPML require the use
    of functions for measurement of distances in arbitrary spaces, and distance metrics
    belong to this class of functions. An arbitrary space can be any space including
    vector spaces. The simplest example of a metric space is a number line with real
    numbers, and the associated metric is ||a − b||, where a, b ∈ ℝ.


    Let us consider Z as an arbitrary space; a and b are two points in this space,
    and d is a distance function. The distance function d is a distance metric if
    it satisfies the following four conditions:


    +   (a) The distance d(a, b) ≥ 0

    (b) The distance d(a, b)=0 only if a=b (implies that distance from a point to
    itself is zero).

    (c) The distances must be symmetric which means d(a, b)=d(b, a)

    (d) It must satisfy the triangle inequality property where d(a, k) ≤ d(a, b)+d(b,
    k)


    # 1.3.1.2 Normed Linear Space


    A complex normed linear space is a linear space with a function |.| : L → ℝ is
    called a norm called a norm [17]. The Euclidean distance and l_p norms fall under
    this category, and norms are used to measure distance as well as lengths in vector
    spaces. Let us consider a Euclidean plane ℝ^n with n dimensions. The Euclidean
    distance or l_2 distance'
