    # 11.7 The MCSA Measurement Method


    Motor Current Signature Analysis (MCSA) is a condition monitoring technique for
    rotating machines used to diagnose problems in induction motors [9,10]. The concept
    originated in the early 1970s and was first proposed for use in nuclear power
    plants for inaccessible motors and motors located in hazardous areas [11]. But
    over time, it quickly gained increasing acceptance in industry. The tests are
    performed on-line without interrupting production with the motor running under
    load under normal operating conditions [11,12]. The MCSA method can be used as
    a predictive maintenance tool to detect common engine faults at an early stage
    and thus avoid costly catastrophic failures, production interruptions, and extend
    engine life. It can be used as a diagnostic tool and a powerful complement to
    vibration and heat monitoring (checking a fault with more than one technology)
    [13,14]. MCSA is a method in the broader field of Electrical Signature Analysis
    (ESA) [15], useful for analyzing not only electric induction motors, but also
    generators, power transformers, and other electrical equipment. The most popular
    of these techniques are: Current Signature Analysis (CSA), which we use and others
    such as VSA (Voltage Signature Analysis), EPVA (Extended Park''s Vector Approach),
    and IPSA (Instantaneous Power Signature Analysis).


    # 11.7.1 Modeling of the Stator Current of the Asynchronous Machine


    The detection of faults in electric induction machines has been widely studied.
    It is based on the monitoring of their vibrations. The reliability of the results
    obtained is strongly dependent on the position of the accelerometers placed on
    these machines and elongated on their vertical, axial, and radial axes. This location
    is, in fact, the difficult task of this vibration modeling technique. In addition,
    it may also be affected by the machine''s speed'
