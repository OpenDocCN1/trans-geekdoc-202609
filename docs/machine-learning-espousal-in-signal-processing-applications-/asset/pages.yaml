  md: '# 11.4 Electromechanical Faults


    These machines, made up of a set of mechanical systems, are most often prey to
    numerous faults that affect their operation, even impacting their productivity
    and even the health of their material and human environment as it could be the
    case of a nuclear power plant. They are certainly numerous, but this article focuses
    on only four types of faults, as follows.


    # 11.4.1 Bearing Fault


    In the literature, the major cause of rotating machine failures is due to faults
    caused by fatigue spalling, lubricant contamination, excessive load, or other
    causes or electrical causes such as the flow of leakage currents induced by inverters
    [3]. Faults of bearings are at the base of several effects in rotating machines,
    namely: an increase of the noise level and the appearance of vibrations by the
    rotor’s movements around the longitudinal axis of the machine [3]. This type of
    fault also gives rise to variations (oscillations) in the torque of the machine
    load inducing the blocking of the rotor. It should also be mentioned that bearings
    with balls are composed of two rings, one internal and the other one between which
    are several balls or rotating rollers. When the bearing is operating in normal
    conditions, the fatigue fault starts with small cracks located below the surfaces
    of the raceway and rolling element and propagates gradually over the contact surface.
    In addition, bearing faults are most often related to Eccentricity faults that
    induce asymmetry of the rotor. On the other hand, the faults linked to the bearing
    at balls can be classified as follows [3]: outer ring fault, inner ring fault,
    ball, and cage faults. Also, since the ball bearing supports the machine''s rotor,
    any bearing fault could cause radial displacement between the rotor and stator.
    These air-gap variations caused by bearing vibrations affect the variation of
    the internal magnetic flux by producing harmonics in the stator current [4,5].
    In Figure 11.3, we show by a diagram what a bearing looks like and the faults
    it can suffer, namely, the inner race damage, the outer race damage, and the cage
    fault (Figure 11.4).


    # 11.4.2 Broken Rotor Bar Fault


    The breakage of the bars of an asynchronous machine is a fault most commonly studied
    in the laboratory because of its simplicity of realization. The bar breakage causes
    a dissymmetry of the rotor. The result of the asymmetry is the creation of a field
    rotating in the opposite direction to that generated by the stator and this at
    the slip frequency. Consequently, an additional current is created in the stator
    winding [6]. A rotor bar breakage fault is shown in Figure 11.5.


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_287_0.png)


    FIGURE 11.3

    Bearing.'
