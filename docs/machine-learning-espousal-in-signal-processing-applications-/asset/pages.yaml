    # 11.10.1.2 Genetic Algorithms (GA)


    The aim of using the genetic algorithm in our study is to find as quickly as possible
    and to lead to an optimal architecture giving a good precision in the classification
    of the machine condition in the context of a bearing fault. But like any genetic
    algorithm [28], there are steps to be respected in order to achieve its employability.
    In the following lines, we explain how these can cohabit without case.


    # 11.10.1.2.1 Chromosome Coding


    Chromosome coding is a crucial step in any algorithm application process genetics
    because it consists in defining the genes on which operations such as the mutation
    and crossing. Thus, by finding the nature of the genes to be used, it becomes
    easy to form what we want to use calls the individual or chromosome from which
    the candidate population for our evolutionary process will be formed during the
    search for elected or expected individuals. The choice, it is sometimes not easy.
    But it is made depending on the problem you are facing. Thus, in the framework
    of our study we have chosen two data types to define the types of genes used.
    The first which is an integer and which is the first gene and the other two genes
    of the string type. The chromosome was then defined as a combination of three
    genes:


    +   - the number of hidden layer (integer)

    - the number of neurons in each hidden layer (string)

    - and transfer functions in each hidden layer (string).


    Example of an individual with four hidden layers from MATLAB:

    individual=[4,[7, 6, 4, 8, 2], logsig{4}'']; for this individual, we read that
    he has four hidden layers, seven neurons in the first layer, six in the second
    layer, four in the third layer, and eight in the last. And the transfer functions
    are, respectively, each logsig. Here there is not the number of neurons in the
    output layer.


    # 11.10.1.2.2 Generation of the Initial Population


    The initial population consists of a set of randomly generated individuals (chromosomes).
    The number of individuals in a population or the size of the population is an
    important parameter for GA that will need to be determined. We have set it at
    10 (ten). The representation of the population P is: P = [P1, P2, P3,..., Pi....
    PNp] where Pi represents the i-th chromosome in the population and Np represents
    the number of chromosomes in the population.'
