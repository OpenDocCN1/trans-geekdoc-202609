- pgno: 207
  md: '$$W(a,b)=\int_{-\infty}^{\infty}x(t)\psi_{a,b}(t)dt\tag{8.10}$$ where


    a \neq 0.


    Wavelet transform $W(a,b)$ can be considered as “strength” or “amplitude” of corresponding
    basis function $\psi_{a,b}(t)$ component in the signal $x(t)$. Inverse wavelet
    transform (IWT) allows reconstruction of original signal back from wavelet coefficients
    $W(a,b)$:


    $$x(t)=\frac{1}{C_{\psi}}\int_{-\infty}^{\infty}\int_{-\infty}^{\infty}\frac{1}{a^{2}}W(a,b)\psi_{a,b}(t)da\,db\tag{8.11}$$
    where


    $$C_{\psi}=\int_{-\infty}^{\infty}\frac{|\psi(\omega)|^{2}}{\omega}d\omega.$$


    Discrete wavelet transform (DWT) is more used in practice due to high computational
    complexity associated with CWT. But in DWT, instead of discretizing the time,
    the translation and dilation parameters are taken to be discrete values. If in
    Equation (8.10), $a$ and $b$ are respectively substituted with $2^{-j}$ and $k2^{-j}$,
    where $j,k\in\mathbb{Z}$, DWT of a function $x(t)\in L^{2}$ is given as


    $$W_{\psi}x(j,k)=2^{j/2}\int_{-\infty}^{\infty}x(t)\psi(2^{j}t-k)dt\tag{8.12}$$


    To study the reconstruction of a function from wavelet coefficients and the idea
    behind WNN, multiresolution analysis (MRA) plays an important role. MRA views
    a function at various levels of approximations or scales. Decomposition of a function
    $x(t)$ into various scales begins by projecting it into a sufficiently high-resolution
    subspace $\mathbf{C}_{M}$, i.e.


    $$x_{M}=\sum_{k}c_{M,k}\phi(2^{M}t-k)\in\mathbf{C}_{M}\tag{8.13}$$


    Thus, subspace $\mathbf{C}_{\infty}$ is the space of original analog (continuous-time)
    signal $x(t)$, and $x_{M}\in\mathbf{C}_{M}\subseteq\mathbf{C}_{\infty}$ is its
    lower resolution version. Subspace $\mathbf{C}_{j}$ at each level is itself composed
    of coarser approximation subspace $\mathbf{C}_{j-1}$ and a wavelet subspace $\mathbf{W}_{j-1}$.
    Since the subspaces are nested, we can write


    $$\mathbf{C}_{M}=\mathbf{W}_{M-1}+\mathbf{C}_{M-1}$$


    $$=\sum_{i=1}^{I}\mathbf{W}_{M-i}+\mathbf{C}_{M-I}\tag{8.14}$$ where


    $I$ is the number of levels of subspace or wavelet decomposition.'
