    # 12.5 Conclusion


    This chapter focuses on various techniques of signal processing involved from
    the perspective of IoT. Secondly, this chapter presents different machine learning
    and deep learning techniques for the classification and prediction of the events
    in IoT sensor devices. Finally, a case study on the prediction of IoT device events
    using continuous wavelet transformation and machine learning models is presented.
    Morlet, Mexican, and Frequency B-spline wavelet transforms were considered for
    experimentation of ECG signal classification under three categories, namely ARR,
    CHF, and NSR. The performance metrics, such as accuracy was compared for three
    wavelets. The Morlet and Mexican hat wavelet-based ARR classification exhibited
    98% accuracy in comparison with the Frequency B-spline wavelet with 99% accuracy.
    Next, the Morlet and Mexican hat wavelet-based CHF classification exhibited 97%
    accuracy in comparison with the Frequency B-spline wavelet with 98% accuracy.
    In conclusion, regarding NSR classification, all three classifications demonstrated
    87% accuracy results.


