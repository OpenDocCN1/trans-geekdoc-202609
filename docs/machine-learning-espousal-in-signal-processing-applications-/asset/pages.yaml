    # 12.4.1 Mexican Wavelet Transform


    Mexican wavelet is considered as the second-order derivative of the Gaussian function
    as given in Equation (12.7) below. This type of wavelet is popularly used for
    data classification problems in large-scale data analysis [32–34]. The chirp signal
    of the Mexican hat wavelet is given below in Figure 12.5. For this case study,
    the central frequency of the Mexican Hat wavelet is considered at 0.2 Hz.


    $$W(t) = (1 - t^2) * e^{-(t^2 / 2)}$$ (12.7)


