  md: '# 8.5.3 CSO-Based Training of WNN DFE


    The proposed algorithm for channel equalization uses CSO for training weights
    in DFE WNN. The flowchart of the training algorithm is shown in Figure 8.7. While
    weights in artificial neural network can be initialized randomly, initialization
    of parameters in WNN needs careful attention. Since wavelet bases are time-shifted
    oscillatory waveforms of limited duration having an average value of zero, random
    initialization of τ_ij and δ_ij may lead to wavelets with zero value (Alexandridis
    and Zapranis, 2013). It was reported that training algorithms for WNN like gradient
    descent are severely sensitive to initial values of parameter w, and various techniques
    of initialization were proposed to improve network


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_215_0.png)


    FIGURE 8.7

    Flow chart of training WNN DFE with cuckoo search optimization.'
  merge: -1
