    the stator current signal of the asynchronous machine at the occurrence of the
    MCSA, in the seventh point we expose the ESPRIT method and these variants used
    to talk in the eighth point about intelligent methods of fault classification
    before tackling the part of the simulation in the ninth place and closing the
    whole with the general conclusion and perspectives.


    # 11.2 Related Works


    In the diagnosis of electromechanical faults in electric induction machines, there
    is not only the combination of MCSA, high-resolution signal processing (HRM) method,
    and learning machine algorithms as it is the case in this study. Indeed, in the
    past, associations such as MCSA, PCA, and signal processing methods have been
    used to perform the same work. Although the signal processing methods used with
    these techniques have produced good results, but each of them had more or less
    a limitation that did not allow to extend it in all cases of study. This is the
    case, for example, of the FFT [1] (Fast Fourier Transform) which, although it
    is widely used in signal processing, does not give any information about when
    a frequency component occurs, or the DWT (Discrete Wavelet Transform) which, although
    it gives an interpretation of the signal in time and frequency, offers good temporal
    resolution and poor frequency resolution at high frequencies, and offers good
    frequency resolution and poor temporal resolution at low frequencies. Moreover,
    these methods require a very high level of knowledge in signal processing without
    forgetting that PCA [2] is a linear method and therefore not applicable in most
    cases on conventional machines which are nonlinear. With this observation in mind,
    researchers have gradually migrated toward more adequate solutions; hence, the
    choice of this association which, in addition to dispensing with the nature of
    the system studied, offers an intelligent and adaptable diagnosis as the machine
    operates (Table 11.1).


    # TABLE 11.1

    Technical Shortcomings of Existing Methods


    | Methods | Technical Deficiencies |

    |---|---|

    | MCSA + FFT | Does not give any information about when a frequency component
    occurs |

    | MCSA + PCA | PCA is a linear method, not applicable in most cases on conventional
    machines which are nonlinear |

    | MCSA + DWT | Offers good temporal resolution and poor frequency resolution at
    high frequencies

    Offers good frequency resolution and poor temporal resolution at low frequencies
