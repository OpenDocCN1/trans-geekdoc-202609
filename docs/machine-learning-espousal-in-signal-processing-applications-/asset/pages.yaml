- pgno: 200
  md: 'Linear equalizers were first introduced by Robert W. Lucky in 1965 to eliminate
    the distortion caused by the transmission channel (Lucky 2006). The original form
    of the equalizer utilized the conventional gradient descent method to train the
    weights of the tapped delay line. Various adaptive equalizers were proposed since
    then, which are based on gradient descent algorithms and minimize MSE of the output
    to achieve the desired objective of removing ISI from the received signal (Haykin
    2008). However, the performance of these linear equalizers with gradient descent
    learning is severely constrained in channels with deep spectral nulls in their
    magnitude response or has severe nonlinear distortions. Numerous research studies
    have shown that the performance of nonlinear equalizers is far superior compared
    to their linear counterpart in such cases. Decision feedback equalizers (DFEs)
    are one such category of nonlinear equalizers which is more robust to ISI and
    nonlinear effects in channel compared to linear equalizers. DFEs also show excellent
    capabilities for tracking changes in time-varying channels (Ling and Proakis 1985).


    In recent times, neural networks have been applied to numerous engineering problems
    successfully (Abiodun et al. 2018). Artificial neural networks (ANNs) can learn
    complex mapping functions and can perform decision between regions with nonlinear
    boundaries. In the literature, several innovative applications of ANNs have been
    proposed recently. Jay et al. proposed multilayer perceptron and long-term short-term
    memory-based models for predictions of cryptocurrency price (Jay et al. 2020).
    A cancer disease diagnosis system was proposed by Al-Zubi et al. by utilizing
    ANN and ensemble classification technique (Al-Zubi et al. 2019). The resulting
    algorithm can classify attributes of cancer patients with higher accuracy and
    lesser false alarm rate. In a study by Farsad and Goldsmith (2018), the authors
    show that symbols transmitted through wireless channel can be detected without
    the knowledge of underlying communication channel model using neural networks.
    They evaluated the proposed model for data transmitted over the molecular communication
    platform.


    Due to the ability of ANNs in efficiently modeling arbitrary nonlinearities, different
    neural network architectures and training algorithms were proposed for channel
    equalization. One of the first instances of application of ANN for digital communication
    channel equalization was proposed in Siu et al. (1990) and Chen et al. (1990),
    where multilayer perceptron (MLP) architecture is used. In their work, authors
    show that MLP equalizers perform better in general and overcome some of the limitations
    of equalizer based on LMS algorithm. Recently, radial basis function (RBF) neural
    network was proposed for equalization in coherent optical orthogonal frequency
    division multiplexing (OFDM) system (Ahmad and Kumar 2016). RBF neural networks
    are single hidden layer networks with significantly reduced complexity compared
    to MLP neural networks. Zhao et al. proposed a DFE using functional link neural
    network with LMS learning algorithm (Zhao et al. 2011). The novelty of the work
    lies in utilizing a finite impulse response (FIR) filter along with FLNN to accommodate
    for linear channels. The authors showed that this scheme results in improvement
    of convergence speed without further increase in steady-state error. A block LMS
    algorithm operating on fast Fourier transform (FFT) of the received signal and
    subsequent equalization using FLNN was proposed in a study by Sahoo and Mohanty
    (2016). The proposed equalizer is also based on decision feedback principle and
    is evaluated in terms of eye diagram and BER. An extreme learning machine (ELM)-based
    model was proposed for channel prediction and equalization for the OFDM system
    in a study by Liu et al. (2019). ELM is a variety of ANN in which only the weights
    at the output layer are trained and have significantly reduced training time requirement.
    In a study by Jarajreh (2019), an ANN design is proposed to compensate the nonlinearities
    introduced by the optical fiber channel. It was shown by those authors that the
    application of ANN equalizers enables extension of transmission reach compared
    to the existing techniques.'
