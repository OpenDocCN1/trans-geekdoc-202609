    more adaptive and intelligent.


    # 7.8 Conclusion


    In this chapter, we have presented an overview of adaptive filters and neural
    net, emphasizing the applications and basic algorithm that have already proven
    them to be useful in practice. Despite the many contribution in respective fields,
    research efforts continue at a strong pace, and are likely that new applications
    will be developed in future. The field of neural networks encompasses many other
    types of network structures and learning algorithms. Indeed, they have been established
    as an interdisciplinary subject with deep roots in the neurosciences, psychology,
    mathematics, and the physical sciences, and engineering. Needless to say, they
    have a major impact on adaptive signal processing, particularly in those applications
    that require the use of nonlinearity.'
