  md: '# 5.5.3 Wavelet-Based Feature Extraction


    Pattern recognition in audio signals can apply feature extraction methods. The
    wavelet-based method can localize both time and frequencies of data, allowing
    easy recognition of useful patterns. In neural networks, the method can be combined
    with forwarding selection, whereby the variables of the data are added to the
    model one at a time. [142] indicates a way to apply this type of feature extraction
    using discrete wavelet transform (DWT). The requirements are to compute the subband
    codes of the signal. This approach proves to be much more efficient and faster.
    The acoustic features of the audio signal determine the method of getting the
    features. The features are applicable in classifying the audio signals, especially
    in music files. Mel frequency cepstral coefficients also make up important parameters
    of audio signals, with their success going toward speech recognition. Applying
    support vector machines on the transformed audio signals allows machine learning
    training, improving the result accuracy.


    Short-term features on the frequency of the audio signals are applicable when
    refining the results of analysis [143]. The features include things like the entropy
    of the spectrum, energy entropy, energy, spread of the spectrum, and harmonic
    ratio, among others. Extracting such features has proven to introduce discrimination
    against certain sounds, which makes them inaccurate in determining the nature
    of the signal. Implementation in fingerprinting audio files shows success using
    the DWT process [144]. The researcher, in this case, combines statistics with
    audio signal processing to look for the unique features that define the signal.
    Despite different types of audio encoding losing some information, the process
    shows much promise in creating unique fingerprints each time. The reliability
    of the feature extraction technique is also much higher, but the results need
    boosting from further techniques such as applying filters, sampling the signals,
    and reducing the noise present. Compressing the audio files also has a limit,
    with reduced accuracy as the audio quality becomes less pronounced.


    The perceptual wavelet packet process handles feature extraction as in Figure
    5.14 by filtering the transformations upon segmenting the signal and calculating
    the necessary coefficients after extracting meaningful parameters [145]. High-
    and low-pass filters keep the necessary components for analysis. An algorithm
    based on this technique has been shown as much more effective than conventional
    comparisons. The technique is possible to handle successful noise reduction or
    recognition in noisy signals. The performance of


