    - **Object Detection:** To detect where the objects are in the image.

    - **Object Landmark Detection:** To find out the key points of the object in the
    image.

    - **Object Segmentation:** To identify the pixels belonging to the object.

    - **Object Recognition:** To find out what object and where they are in the image.


    Computer vision first acquires the image or large sets of photographs in real-time
    or videos, and then it applies machine learning or deep learning models to automate
    the process. Finally in the interpretive step, the machine learning or deep learning
    models are deployed to output the scores and decision. The basic steps followed
    in the process of multi-level computer vision for image are illustrated in Figure
    4.14. First, image segmentation is carried out for the input image data, and then,
    feature extraction is done followed by object recognition. The image segmentation
    process is supported by segmentation parameter sets and genetic algorithm for
    parameter adaption. Learning new object features is done in synchronization with
    the feature extraction process. Object model acquisition and refinement are also
    carried out along with the object recognition process.


    Machine learning-based approaches tend to improve computer vision for better recognition
    and tracking. They provide effective techniques for improving the acquisition
    of the image, processing the image, and focusing on the object which are primary
    components of computer vision [29]. For object recognition, the most common machine
    learning approach'
