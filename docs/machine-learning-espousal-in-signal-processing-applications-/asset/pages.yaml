  md: '# 7.2.1 Stochastic Gradient Approach


    In this approach, a transversal or tapped-delay filter can be used as a structural
    basis for implementing the linear adaptive filter. In stationary environment,
    the cost function (i.e., index of performance) is calculated as the difference
    between expected response and transversal filter output (i.e., mean-square error).
    A second-order function of the tap weights in the tapped-delay filter is cost
    function. The dependence of the MSE on the unknown tap weights may be treated
    as a multidimensional paraboloid having a uniquely defined minimum point. This
    paraboloid is called the error-performance surface. Optimum Wiener solution can
    be obtained by considering tap weights corresponding to the minimum point of the
    surface.


    There are two steps in developing an iterative algorithm for estimating unknown
    tap weights of the adaptive tapped-delay filter. First, use the method of steepest
    descent, a well-known procedure in optimization theory, to change the system of
    Wiener-Hopf equations which is the matrix equation defining the optimum Wiener
    solution. This change has to be done using a gradient vector. The value of gradient
    vector depends on two parameters: the auto-correlation matrix of the tap inputs
    and the cross-correlation vector between expected response and the same tap inputs.
    Next, use the obtained results to get an estimate for the gradient vector. The
    resulting algorithm is popularly known as the least-mean-square (LMS) algorithm,
    which can be described in words as follows for the case of a tapped-delay structure
    working on real-time data:


    (updated value) = (old value) + (tap input vector) * (learning rate) * (error
    signal)


    The error signal is the difference between some expected response and the obtained
    response of the tapped-delay filter. The LMS algorithm is simple, but it has the
    capability to achieve satisfactory results under the right conditions. Major issues
    of concern in LMS algorithm are high sensitivity to changes in the correlation
    matrix of the tap inputs and a relatively slow rate of convergence. LMS algorithm
    is highly popular and widely used in many applications. In a nonstationary environment,
    the LMS algorithm should also track the bottom of the error-performance surface
    provided that rate of change of input data is relatively slow when compared to
    the adaptation rate of the LMS algorithm.


    Lattice structure can also be used to develop the stochastic gradient approach
    which results in the gradient adaptive lattice (GAL) algorithm. The GAL and LMS
    algorithms are two types of filters belonging to the stochastic gradient family.
    So far, the LMS algorithm is the most popular and widely used member of the stochastic
    gradient family.


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_177_0.png)


    FIGURE 7.2

    Computation of coefficients in LMS filter.'
