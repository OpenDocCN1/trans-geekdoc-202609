  md: 'Due to the ability of ANN in accurately modeling the nonlinearities present
    in wireless channel, several neural networks, which are optimized by nature inspired
    algorithm, were proposed in the literature. A neural network equalizer trained
    by the PSO algorithm was proposed for recovery of signal transmitted over ISI
    and nonlinear channels (Das et al. 2014). Panda et al. proposed a training algorithm
    based on directed search optimization (DSO) for neural network for equalization
    over nonlinear channel (Panda et al. 2015). Subsequently, the authors also proposed
    a neural network equalizer trained by shuffled frog leaping algorithm (SFLA) in
    Panda et al. (2014). A radial basis function neural network was introduced for
    equalization of wireless communication channel in the study by Sahu et al. (2018),
    where the authors proposed to train the RBF-NN with SFLA. In their study, Ingle
    and Jatoth (2020) enhanced the JAYA optimization algorithm with Levy search to
    mitigate its shortcoming due to lack of diversity of population and weak exploration
    capability. The proposed optimization algorithm was then utilized for training
    a FLNN equalizer. A quantum behaved PSO algorithm was proposed for training ANN
    based equalizer in Das et al. (2018). In this work, besides training the network
    weights, the authors also optimize the ANN topology using quantum PSO algorithm.


    Through extensive literature survey, it has been observed that neural network-based
    equalizers are more suited for equalization over nonlinear channels compared to
    adaptive equalizers with the FIR structure. Moreover, decision feedback equalizers
    provide better BER performance in channels with deep spectral nulls and time-varying
    channel. Though there are some recent works on simple DFE equalizers trained by
    nature inspired algorithm (Iqbal et al. 2015), the literature on DFE based on
    neural networks and their training by metaheuristic algorithm is scant. Inspired
    by the WNN-based equalizer and its training by SOS algorithm (Nanda and Jonwal
    2017), we propose a WNN decision feedback equalizer (WNN DFE) for communication
    channel suffering from ISI and nonlinearity. Significant contributions of this
    work are as follows:


    +   1. New equalizer architecture based on WNN and decision feedback principle
    is proposed. The proposed structure allows equalization of symbols transmitted
    through time-varying channels and channels with deep spectral nulls.

    2. In this work, we develop a new training method for WNN using cuckoo search
    optimization (CSO). To the best of our survey of existing literature, there is
    no existing scheme on training of WNN DFE equalizer with CSO.

    3. In contrast to WNN equalizer proposed in Nanda and Jonwal (2017), in which
    only outer layer weights are modified in the process of training, proposed WNN
    DFE trains all the weights of the network, including translation and dilation
    parameters. This is especially challenging considering the involvement of a large
    number of parameters but results in significantly improved performance.


    The rest of this chapter is organized as follows. System model for the study and
    some basic principles of equalization are introduced in Section 8.2. Principles
    of wavelet and the architecture of wavelet neural networks are described in Section
    8.3. Section 8.4 introduces the CSO algorithm and presents the proposed architecture
    of WNN DFE. CSO-based training algorithm for WNN DFE is also given in this section.
    Simulation results are presented and discussed in Section 8.5. Finally, this chapter
    concludes in Section 8.6 with some scope of future work discussed.'
