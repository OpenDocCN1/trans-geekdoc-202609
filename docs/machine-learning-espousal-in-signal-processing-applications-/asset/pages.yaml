  md: '# 11.10.1.2.3 Calculation of the Evaluation Function (Fitness)


    The evaluation function chosen is the evaluation of the architecture on the detection
    of the rolling fault. For this purpose, we use an algorithm to extract the five
    best individuals after one generation based on the max accuracy.


    # 11.10.1.2.4 Selection of Individuals for Reproduction


    To generate new offspring (children), in our case, parents are selected based
    on their accuracy in detecting the rolling fault, then crossover and mutation
    mechanisms are applied.


    # 11.10.1.2.4.1 Mutation


    Mutation is the process of changing the value of a gene at a given position in
    the chromosome. In this work, we mutated only 3 (three) out of 10 individuals
    from the crossing. We choose 1 individual at random for each mutation process
    that will serve as a donor to the individual who is to undergo the mutation also
    chooses randomly. Then we randomly generate the position of the gene to be modified
    and we proceed with the operation. The operation is repeated 3 times which corresponds
    to the three mutations.


    # 11.10.1.2.4.2 Crossover


    Crossing is the process by which two gene sequences from two different chromosomes
    are fused together. In crossbreeding, the best 5 resulting from the selection
    are merged into their half to give birth to 5 new individuals (children) which
    are added to the previous ones to give a total of 10 individuals.


    # 11.10.2 Fusion ANN et AG


    The algorithm starts with ten randomly generated individuals for a given number
    of hidden layers. Each individual is evaluated. For any individual in the population,
    if the accuracy is greater than or equal to a given max, the max is updated and
    saved. At the same time, each individual and its accuracy are saved. At the end
    of the evaluation of these ten individuals, we extract from the backup the five
    best ones on which we first mutate and then crossbreed by returning a candidate
    population to the second generation. This process is repeated until the tenth
    generation and the number of layers is changed hidden then we start all over again
    from the beginning. After evaluation on the interval of the number of layers hidden,
    we come out with four architectures which according to the algorithm, are the
    best architectures. Figure 11.19 shows the diagram of such an association


