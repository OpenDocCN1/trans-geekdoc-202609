- pgno: 338
  md: "# 11.11.2.2 Conclusion\n\nThe findings in the frequency and time domain have\
    \ shown that the results remain the same as long as two generalist architectures\
    \ are associated, respectively, on each of the states of the machine.\n\nFrom\
    \ the confusion matrices in the time and frequency domain, we found that unlike\
    \ the frequency domain in the time domain, there is less precision on the classification\
    \ of the turnover failure at any of the SNR learning steps and the other SNR steps.\
    \ This was not the case for the frequency domain where the precision was good\
    \ for the 4dB step on learning and testing on the other steps.\n\nBased on these\
    \ findings, we concluded that the second frequency domain architecture was the\
    \ best. This architecture is characterized by:\n\n+   - six neurons in the input\
    \ layer.\n- three hidden layers each having 9, 7, and 7 neurons, respectively.\n\
    - the transfer function in all layers being logsig.\n- two neurons in the output\
    \ layer.\n\nBut only for simple architectures. On the other hand, comparing it\
    \ to the network architecture from the precision point of view, it would be rejected\
    \ although in execution time and memory size it is preferable. In conclusion,\
    \ as the difference in time is only a few tenths of a second, based on precision,\
    \ we have chosen the network architecture even though its memory size is much\
    \ greater.\n\n# 11.11.3 Vector Machine Supports\n\nThe same previous data were\
    \ used in the search for the best model. The kernels used are the polynomial kernel,\
    \ the linear kernel and the Gaussian kernel and the back-end processing algorithms\
    \ are the SMO (Sequential Minimal Optimization), ISDA (Iterative Single Data Algorithm)\
    \ and L1QP (L1 quadratic programming) algorithms. The characteristic parameters\
    \ of the model are the KernelScale γ and the BoxConstraint (C). The results obtained\
    \ are presented below:\n\n# 11.11.3.1 Simulation in the Time Domain\n\nFor each\
    \ given kernel, we have applied the possible resolution algorithms to it. The\
    \ results in the time domain are given in Tables 11.16-11.21 below:\n\n+   - **The\
    \ Gaussian Kernel or RBF**\n  - Table 11.16 shows the results of learning and\
    \ testing with the SMO resolution algorithm.\n  - Table 11.17 shows the results\
    \ of learning and testing with the ISDA resolution algorithm.\n  - Table 11.18\
    \ shows the results of learning and testing with the L1QP resolution algorithm.\n\
    - **The Linear Kernel**\n  - Table 11.19 shows the results of learning and testing\
    \ with the SMO resolution algorithm."
  merge: -1
  img_proc: true
