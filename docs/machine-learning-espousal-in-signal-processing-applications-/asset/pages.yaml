- pgno: 216
  md: 'performance. In this work, where network parameters are learnt through CSO,
    we did not find significant difference in performance for different initialization
    techniques. We adopt a simple technique for initialization of translation and
    dilation parameters (Alexandridis and Zapranis, 2013):


    $$\tau_{ij} = \frac{m_i + M_i}{2}\tag{8.35}$$ $$\delta_{ij} = \frac{M_i - m_i}{5}\tag{8.36}$$


    where

    $m_i$ and $M_i$ are minimum and maximum value of input $x_i$, respectively.


    All other weights are initialized to a small random number in the range $[a_{\max},
    a_{\min}]$ where $a_{\max}, a_{\min}$ are selected through experiments.


    Steps involved in the training and testing of the proposed WNN DFE are as follows:


    +   1. **Selection of Network and Optimization Parameters**: Algorithm begins
    with initialization of network parameters like number of inputs $N_I$, number
    of wavelons $N_{\psi}$, size of feedback filter $N_B$, and range of translation
    and dilation parameters. In addition, channel parameters like type of channel
    and its EVR, training SNR, and order of the channel filter are specified.

    2. **Initialization**: In the next step, elements of vector $\mathbf{w}$, which
    consists of $D = 1+N_I+N_{\psi}+N_B+2N_I N_{\psi}$ elements, are mapped to a host
    nest $\mathbf{w}_p = [w_{p1},..., w_{pD}]$. $P$ vectors of initial population
    $\mathbf{W} = [\mathbf{w}_1,..., \mathbf{w}_P]^T$ are generated as:

    $$\mathbf{W} = \begin{bmatrix} w_{11} & \cdots & w_{1D} \\ \vdots & \ddots & \vdots
    \\ w_{P1} & \cdots & w_{PD} \end{bmatrix}\tag{8.37}$$ While the weights corresponding
    to translation and dilation parameters are initialized according to Equations
    (8.35) and (8.36), other weights can be initialized uniformly in the range $[a_{\max},
    a_{\min}]$ where $a_{\max} = -a_{\min}$.

    3. Evaluate the cost of each nest as $\mathcal{M}_p^{(0)}$ using cost function
    given by (8.28) and find the nest $\mathbf{w}_{min}$ with minimum cost $\mathcal{M}_{min}$.

    4. Generate new solutions $\mathbf{w}_p^{(l)}$ using $\mathbf{w}_{min}$ and Equation
    (8.29) for $p=1,...,P$ and evaluate their costs as $\mathcal{M}_p^{(l)}$, $p=1,...,P$.

    5. Select only those nests $\mathbf{w}_p^{(l)}$ in the present generation for
    which there is a reduction in cost compared to the previous generation. Otherwise,
    carryover nests from $(l-1)$-th generation to $l$-th generation for which cost
    has not decreased.

    6. Replace a fraction $p_a$ of the worse nests with new ones generated via Equation
    (8.34) and evaluate their costs to find the best nest $\mathbf{w}_{min}$.

    7. **Stopping Criteria**: Check if there is no significant change in minimum cost
    through few generations or maximum number of iterations is attained. If no, go
    to step 4.'
