    # 11.4.3 Eccentricity Fault


    These cause the variation of the air gap in the motor, the nonhomogeneous distribution
    of the currents in the rotor and the unbalance of the stator currents. The unbalance
    of the forces on the busbars generates a nonconstant overall torque. When the
    eccentricity becomes large, the resulting radial forces created by the stator
    with the rotor friction strip cause stator and rotor damage. The geometry of the
    rotor can present asymmetries of natural order. These fall into three categories
    of eccentricity of the air gap, we can see them in Figures 11.6 and 11.7:


    +   - **Static Eccentricity**: when the stator axis coincides with the rotation
    axis and not with the rotor axis.

    - **Dynamic Eccentricity**: when the axis of rotation of the rotor does not coincide
    with the axis of symmetry of the stator.

    - **Mixed Eccentricity**: when the axis of rotation of the rotor does not coincide
    with the axes of symmetry of the rotor and stator.'
