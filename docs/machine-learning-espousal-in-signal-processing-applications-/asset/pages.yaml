    The majority vote of all trees in the forest is used to predict the class of the
    new series


    # 12.3.2 Time Series Classification Using Deep Learning


    The architecture for TSC using deep learning combines multiple layers to implement
    nonlinear functions. The multivariate time series is the input to the deep learning
    network [15]. The output of each layer will be input to the next layer and uses
    its nonlinear transformation function to produce its output.


    The nonlinear transformation in each layer is controlled by a set of parameters
    of that layer, which links the input to the output of that layer. Three different
    deep learning networks used in general for TSC are (i) convolutional neural networks
    (CNNs), (ii) inception time, a new architecture that is based on CNN, and (iii)
    echo state networks, which are based on the recurrent neural networks (RNNs).


    +   i. **Convolutional Neural Networks (CNN)**: A CNN is a deep learning algorithm
    that takes the multivariate time-series data as input and extracts the spatial
    and temporal patterns. The patterns are captured by applying filters, and the
    extracted features are assigned a trainable weight according to the importance
    in general; three separate layers, such as a convolutional layer, pooling layer,
    and completely linked layer, are composed of CNN. A general form of applying the
    convolution for a centered time stamp t can be expressed as Equation (12.4) given
    below:


    $$\text{con}_t = f\left(\omega \cdot X_{\left(\frac{t-l}{2}:\frac{t+l}{2}\right)}
    + b\right), \quad \text{for all } t \in [1,T] \tag{12.4}$$


    where

    X denotes univariate time series data of length T with a filter ω of length l,

    b denotes bias and

    f denotes nonlinear function such as ReLU.


    The result of the convolution is denoted by con_t.


    There can be several convolutional and pooling layers that are staggered before
    the fully connected layer. The convolutional layer performs the convolution operation
    on the input series of feature maps and convolution matrix to obtain high-level
    features. The pooling layer extracts dominant features and is responsible for
    dimension reduction. The pooling layer takes a series of feature maps as input
    and produces a series of feature maps with lower dimensions as output. The two
    types of pooling used by the pooling layer are max pooling and average pooling
    [15]. Max pooling discards noise from the signal and is usually better than average
    pooling.


    The fully connected layer learns the nonlinear combinations of the high-level
    features of the convolutional and pooling layer. In general, the fully connected
    layer'
