    Single-layer neural network.


    # 7.6.2 Multilayer Neural Net


    Multilayer neural networks use hidden layers in between input and output layer
    to work on nonlinear set of inputs. Geometrically, additional hidden layers are
    referred to as additional hyper-planes to increase the computation capability
    of the neural network. Figure 7.15 shows the typical multilayer network architecture.


    A multilayer neural network is also called a “multilayer perceptron” (MLP) which
    is a typical example of a feedforward artificial neural network. Multilayer neural
    networks are trained using back propagation algorithm. Each artificial neuron
    present in a particular layer is connected to all neurons in the subsequent layer.
    The weight coefficient assigned to a link shows the importance of that connection
    in the working of neural network.


    The multilayer neural networks in two modes: training and prediction mode. In
    the training set, expected output is known and test set are two data sets that
    are necessary for the training of multilayer NN and for the prediction using the
    multilayer neural network. At the starting of training, random values are assigned
    to weights of connections. Then, multilayer NN proceeds recursively. Each iteration
    of the complete training set is called an


    # INPUT LAYER ! HIDDEN LAYER ! OUTPUT LAYER


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_190_1.png)


    FIGURE 7.15

    Multilayer neural network architecture.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'epoch. The goal of each epoch is to reduce the error. As the recursive process
    of adjustment of weights proceeds, the weights slowly converge to an optimal set
    of values. For a given training set, it requires many epochs for the training
    to be completed. Back-propagation algorithm is used for updating weights [15–20].


    For a given training set, back-propagation learning algorithm may operate in one
    of two basic ways: pattern mode and batch mode. In the pattern mode, weights are
    updated after the processing of each training pattern. In the batch mode, weight
    updating is done after the processing of all the training sets (i.e., after the
    whole epoch). Pattern mode consumes less memory when compared to batch mode of
    updating weights. Usually, the patterns are fed to the network in a random manner.
    The use of pattern mode of updating weights makes the search in weight space more
    complex, which makes it difficult for the back-propagation algorithm to converge
    to a local minimum. On the other hand, the use of batch mode of weight updating
    provides a more exact estimate of the gradient vector.


    A network is considered to be efficient when the input-output data relationship
    generated by neural network match with expected result for data streams never
    used in the learning process of the NN. There are chances that the neural network
    may memorize the training data and therefore be less able to generalize between
    similar input-output patterns when the learning process is repeated for too many
    training sets. Then NN is said to be over trained NN or over fitted NN because
    of which NN produces a nearly perfect outcome for examples from the training set
    but fails for examples from the test set.


    Use of multilayer NN for any application has the following advantages:


    +   1. **Learning**: Adaptive ability of the ANN.

    2. **Nonlinearity**: A neural network is a nonlinear system because neurons are
    nonlinear elements. Nonlinearity property plays a very important role when the
    system has to deal with nonlinear data.

    3. **Input-Output Mapping**: The NN learns from the training set by constructing
    an input-output mapping for the presented problem. An example picked from the
    training set is fed to the network, and the weight coefficients are adjusted with
    the aim to minimize the difference between the expected output and the actual
    response of the network. The training of the network is repeated for different
    training sets until the network reaches the stable state.

    4. **Robustness**: Multilayer neural networks are very robust, i.e., their performance
    degrades considerably in the presence of a significant amount of noise.


    # 7.7 Applications of Neural Networks


    # 7.7.1 ECG Classification


    The ECG waveform is a graphical representation of electrical activity of the heart.
    In this application, our main focus is on five important features of ECG signal,
    i.e., P, Q, R, S, T. This is achieved by extracting various features and P-wave,
    PR segment, PR interval, QRS complex, ST segment, T-wave, ST- interval, QT and
    QRS voltage segments of different ECG waveforms.'
