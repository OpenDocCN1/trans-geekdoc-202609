  md: '# 7.7.3.3 A Hybrid Path Loss Prediction Model based on Artificial Neural Networks


    In [38], the authors presented a hybrid, error correction-based NN model to predict
    path loss for suburban areas at 800 and 2,600 MHz, ECC-33, Ericsson 9999, Okumura
    Hata, and 3GPP’s TR 36.942. Feedforward ANN model is designed by combining empirical
    propagation models. The efficiency and accuracy of hybrid model were compared
    against common types of the empirical models, and a simple NN fed with input data
    commonly used in related works. At the end, the hybrid NN obtained the lowest
    RMSE indexes, besides almost equalizing the distribution of simulated and experimental
    data, indicating greater similarity with measurements. Prediction data are calculated
    by models Ericsson 9999, Free Space, ECC-33, and TR 36.942.


    The experiment was set in suburban areas, at frequencies of 800 and 2,600 MHz.
    ECC-33 model was employed in 2,600 MHz, while Free Space model was employed in
    the frequency of 800 MHz; Ericsson and TR 36.942 covered both bands. An error
    correction-based ANN model, using empirical models, is used for prediction of
    path loss. The ANN is trained to learn the deviation from expected values. The
    error is obtained by taking the difference between predicted and expected path
    loss. E=PLmeasured−PLpredicted. The output of ANN is the corrected path loss.
    A feedforward multilayer perceptron type with two inputs, one output and one hidden
    layer, is used. The input data stream consists of two vectors with 455 elements
    each (in the 2,600 MHz scenario, while in 800 MHz case, it consists in 450 elements).
    The transfer functions used for hidden and output layers were tangent-sigmoid
    and linear, respectively, while the algorithm chosen to train the network was
    the Levenberg-Marquardt backpropagation [35–39].


    # 7.7.3.4 Classification of Primary Radio Signals


    A new technique, automatic modulation classification (AMC) proposed in Ref. [40–43]
    developed a primary modulation technique in the cognitive radio environment. The
    objective of the ANN training is to identify primary signal’s modulation technique.
    So, AMC here tries to distinguish 2ASK, 4ASK, BPSK QPSK, and 2FSK from each other.
    Power spectral density, standard deviation of absolute value of the nonlinear
    components of the instantaneous phase, standard deviation of the direct value
    of nonlinear component of direct instantaneous phase, and standard deviation of
    the absolute value of the normalized instantaneous amplitude values of different
    modulation techniques are applied as input to the ANN system. The NN is trained
    with these four characteristics of the signal at the input to identify the modulation
    technique used. 2,500 training data sets with four inputs and five outputs is
    used to make the NN learn to identify and distinguish the modulated signals. The
    structure of ANN has seven neurons in the hidden layer and five neurons in the
    output layer [45]. The ANN system precisely identifies the modulation technique
    [46] (Figure 7.19).


