    researchers making it quite popular which has found its applicable areas in media
    services, search engines, and intelligent human-computer systems [33].


    The Audio classification can be considered as important due to the following:


    +   a. need of different processing requirement for audios of different quality
    and types.

    b. Due to the distribution of audio into various subclasses based on its quality,
    the search space for retrieval of any specific audio data has been reduced significantly.


    Every classified audio piece can be uniquely processed as well as indexed in order
    to be effective for further comparison and retrieval.


    The various features extracted from the given audio signals considered for process
    of classification using Machine Learning approach are [29] the following:


    +   1. **Sampling Frequency or the Rate**: rate of number of samples considered
    over fixed time span.

    2. **Amplitude**: measure of change of sound waves over the considered period
    of time.

    3. **Fourier Transform**: Decomposing the function of time/signal into its constituting
    frequencies, i.e., amplitude of each frequency present in the underlying function.

    4. **Power Spectrum**: it describes the power distribution into its discrete frequency
    components.

    5. **Cepstrum**: it is calculated by considering the Fourier transform of the
    logarithm of estimated power spectrum of a signal.

    6. **Spectrogram**: it is the visual representation of a spectrum of frequencies
    over a signal considering its variations with time.

    7. **Cochlea**: this is the spiral cavity located at the inner portion of human
    ear that contains organ of corti. It produces nerve impulse as a response to the
    sound vibration.


