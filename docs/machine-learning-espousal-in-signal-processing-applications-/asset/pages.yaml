    # 6.7.3 Proposed Solutions


    In order to confront and restrict the effect of the previously noted technological
    challenges, multiple solutions have been explored. Numerous BCI machine additives
    can be scattered over them. The following sections provide an overview of a few
    techniques used to enhance the performance of structures based on BCI.


    # 6.7.3.1 Noise Removal


    Preprocessing has contributed to the improvement of the signal in both spatial,
    time, and frequency domains, especially with the aid of external factors. Being
    positive, sometimes noise can improve the accuracy of BCIs. Decreasing the level
    of noise and improving SNR (Signal to Noise Ratio) are discussed in Ref. [104].


    An unbiased independent component analysis (ICA) is a commonly used spatial filtering
    process [105]. ICA performs spatial filtering in unmanaged way of independent
    components. By separating the components of the project-associated EEG from the
    inappropriate EEG and the components of the assignment artifact, it aims to increase
    the SNR of EEG signals.


    Electrooculography (EOG) measures the Corneo-retinal standing potential (CRSP)
    between front and back of the eye. Using eye motion recording electrodes, a linear
    combination of EEG signal polluted by the EOG, temporary-primarily-based preprocessing
    will lead to casting off artifacts [106] from the signal. Mixture variables are
    calculated using linear regression techniques. Due to the difficulty of positioning
    muscle detection electrodes, while it is the most common method for the removal
    of ocular objects from EEG indicators, it no longer satisfies the same satisfaction
    as the disposal of EMG signals.


    Filtering of frequency bands allows disposing of noise and artifacts. In addition,
    it could provide valuable assistance in handling the internal nonstationary components.
    The task-related frequencies may be used in BCI systems for additional evaluation.
    For the eye or muscle movement to be placed, this form of filtering no longer
    involves larger electrodes. The benefit of the filtering implementation is its
    simplicity. A critical review was done by Neela and Kahlon [99].'
