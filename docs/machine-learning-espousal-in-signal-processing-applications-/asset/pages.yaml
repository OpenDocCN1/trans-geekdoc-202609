    # 7.7.3.2 ANN-Based Call Handoff Management Scheme for Mobile Cellular Network


    In [30–34], ANN-based handoff algorithm is proposed which has the capability to
    give more accurate results. A handoff process is basically changing of the controlling
    base station when the mobile station moves from one cell to other. So, in order
    to make the call continuous, a handoff process is required. The handoff has to
    be initiated in such a manner that there is no unnecessary handoff, or there is
    no call termination. Handoff is dependent on the velocity characteristics and
    path loss which further depends on the distance between the transmitting base
    station and the mobile station, path loss exponent, and the velocity of the MS.
    So based on these factors, an algorithm is developed in this paper.


    Signal strength from serving and target base stations and traffic intensities
    of the serving and target base stations are considered. A three-layered ANN model
    is chosen in the design. Signal strengths from serving and target base stations
    are estimated using the least square estimation method incorporating Rayleigh
    fading. The input parameters to the ANN model are signal strength of mobile from
    the serving base station and the transmitted base station, traffic intensity of
    the serving, and target base station. Depending on these parameters, ANN model
    will decide whether a hand off is required. So, the handoff process is initiated
    at a proper state of network.'
