  md: '# 11.10.1.1 Artificial Neural Networks


    Artificial neural networks based on the functioning of the human brain are developed
    in the form of parallel distributed network models. The applications of NAS are
    numerous by example in data analysis, model identification and control [26,27].
    And among the different types of NAS, the Multilayer Perceptron (MLP) are most
    popular and used in most work, as is the case in this study. In this project,
    the terms RNA and MLP were used for each other in the absence of other types of
    neural networks. Here a brief introduction to MLP is given for perfection. An
    MLP network consists of an input layer of source neurons, one or more hidden layers
    and a layer of exit. The number of neurons in the input and output layers depend
    on the number of input variables and number of desired classes, respectively.
    The number of hidden layers and the number of neurons in each hidden layer affect
    the generalizability of the network. For a smaller number of hidden layers and
    neurons, execution may not be proportionate. Consider that too much of hidden
    neurons may have the risk of over-adjusting the accuracy of the data. There are
    various heuristic and systematic methods to choose the number of hidden layers
    and neurons [26].


    Figure 11.18 shows a typical MLP architecture consisting of three layers; M, N,
    and O for the input, hidden, and output layers, respectively.


