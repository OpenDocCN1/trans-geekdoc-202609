    # 8.2.2 Decision Feedback Equalization


    Linear equalizer model as described in Section 8.2.1 is effective on simple channels
    like wireline telephony, where the problem of ISI is not too severe. The severity
    of an ISI channel is dependent on the spectral characteristics of the channel
    and is measured in terms of eigenvalue ratio (EVR) (Haykin 2008). Channels with
    larger EVR have a higher degree of spectral null, and linear equalizers will need
    to produce higher gains to compensate it. This will result in increased noise
    gain and significantly poorer equalizer performance. Nonlinear equalizers like
    DFE are not limited by such constraints and are suitable for both nonlinear channels
    and channels with high EVR. A DFE operates by utilizing the previous outputs of
    the equalizer to cancel out the ISI from the present symbol.


    A simplified block diagram of a conventional DFE is shown in Figure 8.2, consisting
    of three main units: feed forward filter, decision device, and feedback filter.
    The input to the equalizer is noisy and distorted signal x(n), while the output
    is an estimate \hat{u}(n) of the transmitted symbol. If the feed-forward filter
    and feedback filters are of length N_f and N_b, respectively, the states of these
    filters at time n are given as


    $$\mathbf{x}(n)=\left[x(n),...,x(n-N_f+1)\right]\tag{8.4}$$


    $$\mathbf{u}(n)=\begin{cases}\left[y(n-1),...,y(n-N_b)\right], & \text{in training
    mode}\\ \left[\hat{u}(n-d-1),...,\hat{u}(n-d-N_b)\right], & \text{in decision
    directed mode}\end{cases}\tag{8.5}$$


    Input to the decision device is then obtained as


    $$\hat{y}(n)=\sum_{i=1}^{N_f}x(n-i+1)h_i^f-\sum_{j=1}^{N_b}\hat{u}(n-d-j)h_j^b\tag{8.6}$$


    where \([h_1^f,...,h_{N_f}^f]\) and \([h_1^b,...,h_{N_b}^b]\) are filter coefficients
    of the feedforward and feedback filters, respectively.


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_205_0.png)


    FIGURE 8.2

    Simple block diagram of a DFE.'
