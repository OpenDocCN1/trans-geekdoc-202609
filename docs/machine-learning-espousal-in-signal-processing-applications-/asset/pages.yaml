  md: '# 11.8 Variants of the ESPRIT Method


    ESPRIT which stands for Estimation of Signal Parameters via Rotational Invariant
    Techniques is a method of estimating signal parameters using the rotational invariance
    technique. It is an algorithm for the determination and detection of harmonics
    with a very high accuracy of frequency and amplitude estimation. This is independent
    of the window size used. It is an appropriate approach to get reliable spectral
    estimation results without synchronization effects [8]. It is based on shift invariance.
    It exists naturally between the discrete time series leading to rotational invariance
    and the corresponding signal subspaces. In this case, the eigenvectors U of the
    signal autocorrelation matrix define two subspaces (signal and noise) using two
    selection matrices γ₁ and γ₂.


    $S_1 = \gamma_1 U,\; S_2 = \gamma_2 U$  (11.2)


    The rotational invariance between the two subspaces leads to the following equation:


    $S_1 = \phi S_2$  (11.3)


    where


    $\phi = \begin{bmatrix} e^{j2\pi f_1} & 0 & \dots & 0 \\ 0 & e^{j2\pi f_2} & \dots
    & 0 \\ \vdots & \vdots & \dots & \vdots \\ 0 & 0 & \dots & e^{j2\pi f_N} \end{bmatrix}$  (11.4)


    The matrix $\phi$ contains all the information on the N frequency components.
    The estimated matrices $S_1$ and $S_2$ may contain errors [8]. In addition, the
    TLS least-squares approach allows to find the matrix $\phi$ by minimizing the
    Frobenius standard for the error matrix. The determination of this matrix allows
    to obtain the estimates of the frequency defined by the following formula:


    $f_k = \frac{\operatorname{Arg}(\phi_{k,k})}{2\pi},\quad k = 1,2,\dots,N.$  (11.5)


    The application of all these methods makes it possible to carry out a comparison
    between their performances below. They are used in the detection of faults that
    may occur in an electric induction machine.


    In this work, we use six variants which, like their roots, are used to estimate
    the frequencies and amplitudes contained in the stator current signal of the machine.
    And apart from the TLS variant which takes as an argument a third parameter which
    is the window length, these variants take two essential parameters, the signal
    vector and the number of harmonics or the mode of estimation of the number of
    harmonics which is based on order selection models (MOS). These variants are:
    ESPRIT_TLS, ESPRIT_ITCMP, ESPRIT_SVDSSA, ESPRIT_IRLBA, ESPRIT_SVD, and ESPRIT_ECON.


    The procedure for estimating the frequencies and amplitudes by these variants
    is given in Figure 11.9.'
