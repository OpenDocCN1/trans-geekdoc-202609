    # 11.4.4 Misalignment Fault


    Misalignment results from the fact that the rotation source shaft and the rotation-driven
    shaft do not have the same axis of rotation. Figure 11.8 shows the two most common
    types of misalignment.


    However, if it is true that the literature and previous research focused on the
    diagnosis of rotating machines focus on these faults, it must nevertheless be
    mentioned that many analyses were needed to get to this point, among which we
    can talk about the methods of detection of anomalies.


    # 11.5 Methods for Detecting Anomalies


    Anomaly detection is an important part of data science (science of data processing),
    especially when it comes to categorizing a set of data such as in the case of
    a decision on the operating state of an electric induction machine as in the case
    of our present study. It is therefore incumbent on us to know what an anomaly
    is, why to detect anomalies and how to detect them.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '![](img/fd1f01f43f88aeb77031cd9d187a2e8d_290_0.png)


    FIGURE 11.8


    Misalignment (above angular misalignment, below parallel misalignment).


    # 11.5.1 Definition


    As soon as we talk about monitoring, it is like distinguishing an inappropriate
    operation in a batch. This is known as an anomaly. An anomaly is therefore a behavior
    contrary to what would seem normal. Example: a number slipped among the alphabetical
    letters, an order different from the normal order of a withdrawal from a bank
    account, an appearance of harmonics completely different from the normal harmonics
    of a known signal, etc.


    # 11.5.2 Importance of Anomaly Detection


    From the definition and the examples given, we immediately understand that the
    detection of anomalies is very important for several reasons:


    +   - it allows you to set a limit between what would be allowed or not allowed

    - it allows to monitor

    - it is therefore a decision support tool (e.g., should the machine be stopped
    or not?)

    - it thus makes it possible to avoid entering critical situations such as the
    explosion of an electric induction machine


    In other words, to follow closely the evolution of the state of an observation
    to decide or wait for the right moment to act. We must also remember that without
    the notion of anomaly we would not be talking about the diagnosis. Otherwise,
    why diagnose and what to diagnose?


    # 11.5.3 Some Techniques for Anomaly Detection


    Because of its crucial stakes, as we have seen with the examples above, it is
    obvious that a lot of study would be accentuated by developing a set of approaches
    and techniques to understand the subject. The first thing to remember is to make
    the difference between what is normal'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'and what is abnormal. We also talk about discretizing the data set. And then
    the rest of the work is just a matter of technique. Among these, we have the following:
    extreme value analysis, classification-based technique (RNA, decision tree, SVM),
    statistical techniques, proximity-based model technique (KNN, LOF, K-means), information
    theoretic model technique, meta-algorithm technique, and subspace-based technique
    (RPCA). So right away, we also understand the reason for the choice of classification
    algorithms for anomaly detection [7].


    Thus, we can say that the diagnosis of the asynchronous machine consists of the
    detection of anomalies affecting them during their operating life within the entities
    that incorporate them. In addition, this diagnosis can be done by human intervention
    or in an automated way, which is, moreover, the one adopted in recent years. And
    earlier to use the curative way (which is very expensive), we opt for the predictive
    way which allows to detect the fault at its first appearance. This makes it possible
    to decide in time and not after the machine is damaged or caught on fire.


    The only dilemma is to distinguish the characteristic frequencies of one fault
    from another, which has been the objective of several researchers whose results
    are more than convincing. We speak of a frequency signature.


    # 11.6 Frequency Signatures


    In fact, it is worth mentioning that in the annals of research on the monitoring
    of machines that most of the abnormal symptoms have been identified in order to
    develop specific models concerning each state of failure of the latter and its
    severity. The best way to analyze each symptom and to obtain information on its
    evolution is its frequency, duration of the symptom, its amplitude, its variance,
    and its phase. In fact, its diagnosis is based on the analysis of the harmonics
    contained in in the machine’s supply current, flow, torque, or speed. Advanced
    methods have been applied in this case. They are elaborated with spectral analysis
    of the signals of this machine or with the comparison of the real behavior of
    the installation with that of the machine envisaged based on a mathematical model.
    Several types of research have been oriented towards the exploitation of the stator
    current of rotating machines and more precisely of the asynchronous machine as
    in the case of our present study. We analyze the spectrum of this current to extract
    the frequency components introduced by the fault that occurred because when a
    fault occurs in the asynchronous machine, it is found that this has an influence
    on the spectrum of the stator current. This makes it the seat of the trace of
    these faults. The most frequent faults in the machines and their associated frequencies
    are shown in Table 11.2.


    In Table 11.2,


    +   - $f_0$ is the power supply frequency,

    - $s$ is the slip (g) per unit,

    - $P$ is the number of poles,

    - $f_r$ is the rotor frequency,

    - $f_{i,o}$ is any indoor or outdoor frequency, it depends on the dimensions and
    characteristics of vibration of the bearings,

    - $n_h$ is the number of balls in a bearing,

    - $m, k$ are integers [8].'
