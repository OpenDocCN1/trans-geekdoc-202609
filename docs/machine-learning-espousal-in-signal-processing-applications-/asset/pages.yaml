    # 4.3 Audio Compression


    Audio compression is a very important subfield of data compression. Storing audio
    on a computer system requires a large amount of memory, and therefore, the audio
    must be compressed before it is kept on a computer system. In addition to this,
    due to the compression of audio, cell phones are able to communicate with a better
    voice. Audio compression approaches are implemented as an audio codec in computer
    software. The applications of audio compression include digital TV, movies, DVDs,
    and many more. Optimal audio compression algorithms can be categorized as lossy
    algorithms and lossless algorithms. Lossy compression algorithms have a relatively
    greater compression rate and are generally used to compress real-time audio. The
    main aim of both lossy compression and lossless compression is to reduce the redundancy
    using different techniques like pattern recognition, coding, and prediction.


    # 4.3.1 Modeling and Coding


    The two foremost building blocks of the development of compression algorithms
    are modeling and coding. In the modeling stage, information about redundancy existing
    in the data is represented using a model. In the coding stage, the description
    of the model is encoded using binary symbols. Encoding can be done either in lossy
    format or lossless format. Encoding in lossless format is used to preserve the
    original quality of the media source. Minor degradations can be caused as a result
    of subsequent encoding using other lossless formats.


