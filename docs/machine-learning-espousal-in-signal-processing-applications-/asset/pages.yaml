    a task with extracted data and/or models [15]. Machine learning is the branch
    of science that enables computers to learn, adapt, extrapolate patterns, and communicate
    with each other without explicitly being programmed to do so [16]. Machine learning
    algorithms can solve various real-world problems such as detecting frauds, analyzing
    the sentiments of customers to promote sales growth, translating languages, and
