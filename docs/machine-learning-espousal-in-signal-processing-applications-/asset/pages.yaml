- pgno: 223
  md: '# 8.6 Conclusion


    In this chapter, a wavelet neural network-based decision feedback equalizer for
    noisy and nonlinear ISI channels was proposed. The equalizer consists of a wavelet
    neural network and FIR filter in the forward path and a FIR filter for the backward
    path. While wavelet network helps in dealing with channels with high EVR and nonlinear
    functions, a forward FIR filter is suitable for channels with linear characteristics.
    To alleviate the problem of conventional wavelet network training methods where
    solutions get trapped in local minima, a WNN training algorithm based on CSO was
    proposed. Finally, simulation studies were carried out on benchmark linear and
    nonlinear channels to evaluate the performance of the equalizer in terms of mean
    square error and bit error rate. Simulations also evaluate the performance of
    the equalizer for a varying degree of EVR parameter and SNR of the channel. The
    results show that the performance of the proposed scheme is significantly improved
    compared to existing schemes in the literature.


    Some possible future extensions of this work are as follows:


    +   1. The number of parameters to be optimized in WNN is very large. It is observed
    that only a few of the translation and dilation parameters change during the process
    of learning. As a future work, a DFE with wavenet architecture can be explored,
    and various parameter initialization techniques may be compared.

    2. The literature on neural network equalizers with decision feedback architecture
    is scarce. Moreover, very few authors have explored training ANN-based DFE with
    metaheuristic optimization algorithms. As a future study, design of the swarm
    optimization-based training algorithm for DFE with other neural network architectures
    like RBF and FLNN can be explored.


