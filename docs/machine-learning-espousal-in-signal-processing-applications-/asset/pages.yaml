  md: '# 7.4 Applications of Adaptive Filter


    # 7.4.1 Biomedical Applications


    # 7.4.1.1 ECG Power-Line Interference Removal


    An ECG signal distorted by the PLI can be given by d(n)=x(n)+N(n); d(n) is noisy
    ECG signal samples, x(n) is the useful part of noisy ECG signal, and N(n) is the
    noise having sinusoidal nature with the frequency 50 Hz.


    The block diagram in Figure 7.7 shows that if approximation of N(n) signal is
    computed and later subtracted from noisy signal d(n), original signal x(n) can
    be obtained. If N''(n) is nearly same as N(n), then the gauged desired signal
    x''(n) considerably matches with x(n). Mathematical equations of output can be
    written as follows:


    e(n) = x(n) + N - y  (7.2)


    The power of signal is calculated by squaring equation (7.2),


    e² = x² + (N - y)² + 2x(N - y)  (7.3)


    Taking statistical mean on both sides of the above equation,


    E(e²) = E(x²) + E(N - y)²  (7.4)


    Decreasing the error using adaptive LMS filter does not have any impact on signal
    power. So, minimum error is


    E(e²)_min = E(x²) + E(N - y)²_min  (7.5)


    The LMS algorithm delivers the least mean squared error signal by modifying filter
    weight coefficient, and the coefficient equation is


    W_{k+1} = W_k + 2μ e_k x_k  (7.6)


