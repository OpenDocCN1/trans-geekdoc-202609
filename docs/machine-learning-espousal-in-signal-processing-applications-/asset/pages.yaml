  md: 'learning, regularization is the process which regularizes or shrinks the coefficients
    toward zero. In simple words, regularization discourages learning a more complex
    or flexible model, to prevent overfitting.


    # 2.8.14.1 How Does Regularization Work?


    The basic idea is to penalize the complex models, i.e., adding a complexity term
    that would give a bigger loss for complex models. To understand it, let''s consider
    a simple relation for linear regression. Mathematically, it is stated as below:


    $Y \approx W_0 + W_1 X_1 + W_2 X_{(2)} + ... + W_p X_p$


    +   where

    - $Y$ is the learned relation, i.e., the value to be predicted.

    - $X_1, X_{(2)},..., X_p$ are the features deciding the value of $Y$.

    - $W_1, W_{(2)},..., W_p$ are the weights attached to the features $X_1, X_{(2)},...,
    X_p$, respectively.

    - $W_0$ represents the bias.


    Now, in order to fit a model that accurately predicts the value of $Y$, we require
    a loss function and optimized parameters, i.e., bias and weights.


    The loss function generally used for linear regression is called the residual
    sum of squares (RSS). According to the above stated linear regression relation,
    it can be given as follows:


    $$RSS = \sum_{(j=1)}^{m} \left( Y_i - W_0 - \sum_{(i=1)}^{n} W_i X_{ji} \right)^2$$


    We can also call RSS as the linear regression objective without regularization.


    Now, the model will learn by the means of this loss function. Based on our training
    data, it will adjust the weights (coefficients). If our dataset is noisy, it will
    face overfitting problems, and estimated coefficients won''t generalize on the
    unseen data.


    This is where regularization comes into action. It regularizes these learned estimates
    toward zero by penalizing the magnitude of coefficients.


    # 2.8.15 Regularization Techniques


    There are two main regularization techniques, namely ridge regression and lasso
    regression. They both differ in the way they assign a penalty to the coefficients.


    # 2.8.15.1 Ridge Regression (L2 Regularization)


    This regularization technique performs L2 regularization. It modifies the RSS
    by adding the penalty (shrinkage quantity) equivalent to the square of the magnitude
    of coefficients.


    $$\sum_{(j=1)}^{m} \left( Y_i - W_0 - \sum_{(i=1)}^{n} W_i X_{ji} \right)^2 +
    \alpha \sum_{(i=1)}^{n} W_i^2 = RSS + \alpha \sum_{(i=1)}^{n} W_i^2$$'
