    Sudeep Tanwar (M''15, SM''21) is currently working as a professor in the Computer
    Science and Engineering Department at the Institute of Technology, Nirma University,
    India. Dr Tanwar was a visiting professor at Jan Wyzykowski University in Polkowice,
    Poland and the University of Pitesti in Pitesti, Romania. Dr Tanwar''s research
    interests include Blockchain Technology, Wireless Sensor Networks, Fog Computing,
    Smart Grid, and IoT. He has authored 2 books and edited 13 books, and also published
