    # 6.1.1 BCI Components


    There are four fundamental components of BCI systems, as shown in Figure 6.1.


    +   1. **Signal Acquisition:** The signal acquisition stage captures the electrophysiological
    signals mainly feeding to the BCI for signal enhancement and noise reduction.
    Sensory stimulation may be required depending on analyzed brain signals.

    2. **Signal Preprocessing:** The need of signal preprocessing is to improve the
    SNR (signal-to-noise ratio). It may include artifact reduction strategies and
    to apply advanced signal processing methods.

    3. **Feature Extraction:** In order to generate suitable representation of improved
    signal, feature extraction algorithms are necessary, reducing the scale of the
    statistics applied to the class factor. Extracted features of electrophysiological
    data simplify the detection of brain signal patterns. Examples of feature extraction
    methods are amplitude measures and family of auto-encoders for de-noising, variation,
    sparse, etc.

    4. **Classification:** Produced features are translated by classifiers. Classifier
    components use the features produced by feature extractor to assign and categorize
    the brain patterns and to translate the produced functions into device instructions
    [2]. Single trial EEG data sets are detected by means of the threshold method.


    # 6.2 Framework/Architecture of BCI


    In BCI, individual imagery activities can be classified primarily based on the
    adjustments in μ and β rhythms and their spatial distributions. Model and taxonomy
    are considered a general framework for BCI system design. In BCI framework, error-related
    potentials (ErrPs) are studied to define whether the machine has selected to perform
    assignment or instruction given by the user. It is possible to subdivide this
    task into two separate phases. The first one is externally paced computer-driven
    cue-based synchronous BCI with a pre-defined time window, and the second one is
    internally paced user-driven non-cue-based asynchronous BCI. Most of known BCIs
    work like cue-based. The main difference in synchronous and asynchronous BCIs
    is that in asynchronous BCI, a self-paced system has to work independently, which
    may be in rest or idle state. The framework supports features of BCI shown in
    Figure 6.2. The proposed framework and basic architecture have been'
