    # 11.10.4 Support Vectors Machine (SVM)


    The SVMs are classification algorithms allowing to find one or more borders between
    a data set [29]. They can be simple for so-called separable data, but sometimes
    they can be very complex for inseparable data. But what makes them powerful is
    that, whether it’s one or the other case, they always manage to classify them.
    Indeed, their power is based on a powerful philosophy called kernels tricks. And
    yes, it must be said, that it is really a trick. They were developed by Vapnik
    during his work on learning theory statistics around 1998.


    # 11.10.4.1 How It Works


    The principle is to find optimal plans to separate given objects. But the first
    thing to remember is to do what we call learning first. The latter would allow
    to come up with a model capable of making decisions about new objects later on.
    For this, we must Label the learning data before proceeding with the learning
    process. Otherwise, it would be like approaching two magnets of opposite poles.
    And when the data are not linear, we use what is called the kernel functions.
    It consists in finding the solution of the dual of a problem, to find the solution
    of the original problem. Therefore, we use several kernels to decide which one
    would give the best plan to achieve the best separation. There are thus two important
    parameters that would help to find that optimal plan.


    These are C (BoxConstraint) and gamma (KernelScale). The cores used in this work
    are:


    +   - the polynomial kernel

    - the Gaussian kernel

    - the linear kernel.


    And the resolution algorithms used are:


    +   - the SMO algorithm

    - the ISDA algorithm

    - the L1QP algorithm


    In Figures 11.21 and 11.22, we present the schema of an SVM and an application.'
