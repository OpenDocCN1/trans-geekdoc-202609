  md: 'variation, especially when the mechanical components are deteriorated. However,
    these techniques are expensive, as they require additional transducers. Their
    use only makes sense in the case of large machines or critical applications.


    The monitoring of the stator current lines is indeed the most interesting modeling
    basis and the most attractive for fault detection. This is so for two main reasons.
    Firstly, the stator current can be used to diagnose electrical and mechanical
    faults such as: phase imbalance, short circuit in stator windings, bearing failure,
    twisted shaft, broken bar, etc. Then, the stator current is very easy to access,
    because it is directly measurable and is used to control the machine itself. This
    offers an important advantage to modeling techniques indicated.


    The application of the CSA stator current analysis technique for fault diagnosis
    in the asynchronous machine requires a precise knowledge of the various frequency
    and amplitude components contained in the frequency spectrum of the stator current.
    This current is taken from a machine in generator mode. Indeed, its analysis allows
    the correct discrimination of modulations and signatures faults of the asynchronous
    machine. For this, it is necessary to build a complex signal which models the
    real physical phenomenon. This analytical model of the signal must accurately
    describe the behavior and the evolution of the real stator current. It must contain
    all fault information correspondents. This current is often used for command-and-control
    purposes.


    To study the detection of the mentioned faults, the stator current of the asynchronous
    machine is designated by the discrete signal x[n]. We obtained it by sampling
    direct current x(t) with a step equal to Ts=1/Fs. This stator current x[n] of
    the electric induction machine in the presence of mechanical and/or electrical
    failures is expressed as follows [8]:


    ```

    x[n] = sum_{k=-L}^{L} a_k cos( 2π f_k (w(n)) × n / F_k + φ_k ) + b[n]   (11.1)

    ```


    +   where

    - x[n] corresponds to a single sample of the stator current.

    - b[n] is a sample of Gaussian noise.


    The parameter L is the number of side frequencies introduced by malfunctions.
    The quantities f_k(w), a_k, φ_k correspond to frequency, amplitude, and phase,
    respectively. ω(n) is a parameter to be estimated at each instant of order n.
    It depends on the fault studied. It is assumed that the time and space of harmonics
    are not considered. The problem to be solved is treated as a statistical estimation
    problem. This is an estimate of the fundamental frequency, the frequencies characterizing
    the faults that have occurred, and the relative amplitudes. It is carried out
    by calculating the stator current spectrum x[n].


    The only problem with this signal is that it alone is not enough to properly diagnose
    the machine’s states (for example, when you want to decide on the operating state
    of the machine at a given moment). It is therefore necessary to associate it with
    techniques capable of following the characteristic parameters of the machine’s
    operating state. Among them are methods such as: The Fast Fourier Transform, the
    instantaneous power of the Fast Fourier Transform, the spectrum of the demodulated
    current, the wavelet analysis has proven themselves in old research. But it turns
    out that these techniques are very expensive in terms of time. This leads us to
    explore other avenues such as the technique based on variants of the ESPRIT method
    and intelligent faults classification algorithms.'
