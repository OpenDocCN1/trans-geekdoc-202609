    # 7.5.1 Learning Techniques in ANN


    +   - **Supervised Learning:** In supervised learning, the training data is fed
    as input to the network for which the expected output is already known. Weights
    are updated until the algorithm produces the required value.

    - **Unsupervised Learning:** This type of learning is done without supervision
    which means that there is no feedback from the environment indicating what is
    the required output and whether it is correct or not.

    - **Offline Learning:** The weight vector and threshold are adjusted only after
    all the training set is fed to the NN. It is also called batch learning.

    - **Online Learning:** The weight vector and threshold are adjusted after feeding
    each training sample to the NN.

    - **Reinforcement Learning:** The value of the output is unknown, but the NN provides
    feedback to help in checking whether the output is correct or not. It is also
    called semi-supervised learning.


    # 7.6 Single and Multilayer Neural Net


    Single and multilayer neural networks are two classes of network architectures.
    The manner in which NN is organized is directly linked with the learning method
    used to train the NN.


    # 7.6.1 Single-Layer Neural Networks


    It is the simplest form of NN which contains only one layer of input nodes that
    forward weighted inputs to the next layer of receiving nodes. Perceptron and single-layer
    binary linear classifier are early examples of a single-layer neural network.
    In single-layer NN, information moves in only the direction from inputs to outputs.
    So, single-layer neural network can also be treated as a part of feedforward neural
    networks (Figure 7.14).'
