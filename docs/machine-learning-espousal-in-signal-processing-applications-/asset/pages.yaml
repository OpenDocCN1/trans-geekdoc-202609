    # 4.6.6 Economic Forecasting


    Economic forecasting deals with making predictions of the various economical parameters
    that affect the economic condition of the nation. The parameters like inflation,
    fiscal deficit, GDP, employment rate, foreign exchange, etc. are predicted to
    make financial analysis in advance. Economic forecasting is a means to identify
    the key financial patterns existing in the economy of a nation [30]. The officials
    of the government and the business managers utilize the economic forecasts to
    plan financial policies and future economic activities. Machine learning-based
    methods are proving to be effective and less time consuming for the area of financial
    forecasting. The primary advantage of machine learning in financial forecasting
    is its capability to analyze both structured data and unstructured data. The sources
    of structured data include ERP data of the organization, internal audit reports,
    or warehousing system while unstructured data can be gathered from reviews of
    products and services of the company.


    For adopting the machine learning approach in business, the very first phase is
    to determine the scope which will be the specific area of the business-like expenses
    and revenues. Data availability and quality checks are also performed in this
    phase. The scope must include the most impactful area of the organization. In
    the second phase, the hypothesis is developed to determine the drivers of the
    business. In the third phase, the appropriate machine learning model is built
    to test the hypothesis and considerations about the business drivers. In the last
    phase, various tools are integrated into the process of financial forecasting,
    and then, visualizations and reporting are performed. This process of adopting
    machine learning for financial forecasting is shown in Figure 4.15.


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_106_1.png)


