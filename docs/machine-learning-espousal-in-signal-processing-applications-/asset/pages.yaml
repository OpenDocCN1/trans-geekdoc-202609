    # 4.1 Introduction


    Machine learning technology tends to make a machine learn by its own from the
    information stored previously and from the new circumstances. The aim of continuous
    learning is to improve the system to get better results. Machine learning algorithms
    can be categorized as supervised learning algorithms, unsupervised learning algorithms,
    and reinforcement learning algorithms. Supervised learning algorithms can be further
    categorized as classification and regression algorithms while clustering and association
    are the two subcategories of unsupervised learning [1]. Various modern computing
    systems generally perform some kind of signal processing for improving efficiency,
    quality, and transmission of a signal. Signal processing obtains, interprets,
    explains, and modifies the physical phenomena of a system. Probability, statistics,
    mathematics, and stochastic processes in signal processing are used to interpret
    and model the physical phenomena of a system for extracting critical information.
    Certainly, machine learning algorithms can improve the efficacy of this process
    due to its many advantages including easy pattern identification, no human intervention,
    continuous improvement, and capability to handle multi-dimensional multi-variety
    data. In this chapter, ten applications of signal processing that are now being
    used massively in different computing environments and are also utilizing machine
    learning approaches have been discussed. Specifically, applications of machine
    learning approaches in audio signal processing, audio compression, digital image
    processing, video compression, digital communications, healthcare, seismology,
    speech recognition, computer vision, and economic forecasting have been highlighted.


