    # 11.1 Introduction


    From all the rotating systems that abound in the sectors of our daily life, asynchronous
    machines are among the most used because of their low manufacturing and maintenance
    costs on the one hand and their robustness on the other hand. Made up of countless
    components that are the same, the other components are prey to faults that cause
    them to be damaged over time, thus generating consequences both on productivity
    and on the human and material environment. Therefore, to ensure the availability
    of industrial units and the safety of goods and people, the monitoring and diagnosis
    of faults affecting these main components should prove to be a crucial issue not
    to be ignored for increased productivity within any entity that incorporates them.
    Thus, through this project we study the development of an intelligent system able
    to detect these faults in a predictive way. And if the literature allows us to
    understand that vibration analysis has had its share of lot in these research
    studies which do not date from today, it is nevertheless necessary to mention
    that it does not prove to be completely ideal when it is a question of the secure
    taking of data because the probes used are directly linked to the machine, and
    in case of failure, it would be necessary to go to the field to change them, which
    cannot be appreciable in all cases. Based on this observation and recent techniques,
    it was wise to think of other means of measurement, among which the stator current
    has proven to be one, allowing recent researchers to dispense with this problem
    to better focus on the real problem. It is this method that we are using in this
    project which moreover allows us to do without the no accessibility of these installations
    in case of fire. It remains to be noted that the'
