    # 7.7.3.1 Mobile Station Location Identification Using ANN


    In [25,26], ANN-based mobile station, a location identification system is designed.
    The authors have proposed a method that uses time of arrival (TOA) records and
    angle of arrival (AOA) data to locate MS when three base stations (BSs) are available.
    The proposed method uses the intersections of three TOA circles (and the AOA line),
    based on various NN, to find MS location in non-line-of-sight (NLOS) environments
    when MS is heard by three base stations. Location-based services in the wireless
    communication networks are mostly provided by the mobile positioning technique.
    E-911 wireless emergency services, location-based billing, fleet management, and
    the intelligent transportation system (ITS) are different applications of wireless
    location services. The ANN model proposed helps find the location of the mobile
    station. If the TOA measurements are available, then the location of the BS is
    estimated by the intersection of the circles as given in Figure 7.18 [27–29].


    The true location of MS is in the intersection region of the circles denoted by
