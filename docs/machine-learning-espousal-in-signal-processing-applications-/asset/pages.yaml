  img_proc: true
- pgno: 209
  md: 'Only weights $w_i$ from hidden layer to the output nodes are modified. The
    output of such a network is given as


    $$ y = \sum_{i=1}^{N_{\theta}} w_i \phi_{\delta,\tau}(x) \tag{8.19} $$


    where


    $N_{\theta}$ is the number of hidden layer units required to cover the domain
    of the function to be analyzed, and $\phi_{\delta,\tau}$ is a scaling function.


    Wavenets are limited by their fixed set of basis functions and are not suitable
    for modeling channels with time-varying response. The architecture of wavelet
    networks in which translation and dilation parameters of the hidden units are
    also modified, along with output weights of the network, is in the process of
    training. In prevalent nomenclature, such networks are referred to as *wavelet
    networks* and are considered in this work. In all the subsequent discussions,
    we shall mean WNN to be wavelet networks only. Figure 8.4 shows the architecture
    of a one-dimensional WNN. In contrast to multidimensional WNN discussed in the
    next section, input $x$ to this network is a scalar or a one-dimensional sequence.
    Wavelons in this network are shown as $\psi_1, ..., \psi_{N_{\psi}}$ with corresponding
    values of translation parameters $\tau_1, ..., \tau_{N_{\psi}}$ and dilation parameters
    $\delta_1, ..., \delta_{N_{\psi}}$. Output $y$ is obtained by weighted sum as


    $$ y = \sum_{i=1}^{N_{\psi}} c_i \psi_i(x) + a_0 \tag{8.20} $$


    where


    $c_1, ..., c_{N_{\psi}}$ are output layer weights.


    The term $a_0$ in Equation (8.20) is the bias parameter and is required for approximating
    functions whose mean is not zero.


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_209_0.png)


    FIGURE 8.4

    One-dimensional wavelet neural network.'
