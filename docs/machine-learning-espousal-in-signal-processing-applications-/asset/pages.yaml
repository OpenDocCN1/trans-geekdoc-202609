    which is indicated as *f(x)* for a random variable x. PDFs can map down any given
    infinite sample space to relative possible output values. For example, Gaussian
    (Normal) distribution commonly termed as the bell curve is majorly used in order
    to model various natural events like heights of every gender that are approximately
    Gaussian distributed. Two major parameters used here are the *mean* μ (mu) and
    *variance* σ² (sigma squared). The mean may be defined as the center of the distribution,
    whereas the variance specifies the width of the distribution [20].


    Other factors like standard deviation σ may be defined as the square root of the
    variance. To indicate that x is a random variable that is drawn from a Gaussian
    with mean μ and variance σ², we can write:


    $X \sim N(\mu, \sigma^2)$


