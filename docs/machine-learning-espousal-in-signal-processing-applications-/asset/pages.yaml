    information. Audio, image, electrocardiograph (ECG) signals, radar signals, stock
    price movement, and electricity voltage are few examples.


    Signal processing as shown in Figure 10.6 may be defined as a branch of engineering
    which primarily focuses over synthesizing, analyzing, and modifying various signal
    types. Few application areas of signal processing are [30]:


    +   - Conversion of one signal kind to another through the process of filtering,
    decomposition, and de-noising.

    - Extracting various information and patterns from the communicated signal through
    computer vision, speech recognition, iris recognition, finger print recognition,
    etc.

    - Error control and source coding via low-density parity codes (LDPC), turbo coding,
    linear prediction coding, JPG, and PNG.

    - Detection of signals through devices like SONAR and RADAR.'
