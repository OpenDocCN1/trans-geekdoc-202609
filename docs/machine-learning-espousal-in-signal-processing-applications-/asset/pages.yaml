    # 12.4.2 Morlet Wavelet Transform


    The Morlet wavelet is one of the popularly used wavelets for handling classification
    problem in IoT signals [35–37]. Equation (12.8) given below represents the Morlet
    wavelet:


    $$W(t)=\frac{1}{\sqrt{4/\pi}} * \left(e^{i\omega_0 t} - e^{-\left(\frac{\omega_0^2}{2}\right)}\right)
    * e^{-\left(\frac{t^2}{2}\right)}\tag{12.8}$$


    Here, $\omega_0$ represents the central frequency of the original wavelet. In
    this study experiment, $\omega_0$ is considered at 0.8 Hz. Figure 12.6 below depicts
    the chirp signal of the Morlet wavelet.


    # 12.4.3 Frequency B-Spline Wavelet Transform


    The frequency-based B-spline wavelet is defined as the frequency domain of B-Spline
    performed over central frequency ($w_c$), integer order ($\omega_m$), and signal
    bandwidth ($\omega_b$). The chirps of frequency B-spline are depicted in Figure
    12.7 below. The central frequency is considered as 1Hz. The expression for this
    wavelet is given in Equations (12.9) and (12.10) below.


