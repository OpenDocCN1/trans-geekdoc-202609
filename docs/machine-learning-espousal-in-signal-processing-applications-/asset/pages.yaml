- pgno: 90
  md: 'The basic reasoning of why to consider the frequency of an audio signal is
    related to the biology of the hearing process by an ear. The cochlea is a part
    of the human ear that is filled with fluid, and it contains thousands of tiny
    hairs that have a connection to the nerves. The length of these hair is different,
    and the hair with shorter length resonates with higher frequencies while the hair
    with longer length resonates with lower frequencies. The time domain signal of
    air pressure is converted into a frequency spectrum, which is then processed by
    the brain. In this way, the human ear can be considered as a Fourier transform
    analyzer naturally.


    # 4.2.1.2 Mel Frequency Cepstral Coefficients


    It is a fact about hearing of sound by a human that the human ear gets less selective
    toward frequencies if the frequency of sound increases beyond 1 KHz. This resembles
    the Mel filter bank. Mel cepstrum can be produced by inputting the spectrum to
    the Mel filter bank and then taking the long magnitude of the result followed
    by discrete cosine transform (DCT). This process is demonstrated in Figure 4.3.
    The DCT obtains the significant information and peak values that are the summary
    of the audio. Generally, MFCCs are the very first thirteen coefficients obtained
    from the Mel cepstrum. MFCCs contain valuable information about the audio signal,
    and thus, they are utilized in training the machine learning models.


    # 4.2.1.3 Gammatone Frequency Cepstral Coefficients


    Gammatone filter bank is the another filter which is closely related to human
    hearing process. It provides simulation of cochlea which can be applied in different
    applications of audio processing. For producing GFCCs we must pass the spectrum
    through the Gammatone filter bank. After this, the result is downsampled/compressed
    which is followed by the computation of DCT. The GFCC feature consists of the
    very first twenty-two features. Speaker identification is one of the well known
    applications of GFCC. The process of producing GFCC is illustrated in Figure 4.4.


    # 4.2.1.4 Building the Classifier


    To build the classifier, special features of GFCC and MFCC can be utilized, in
