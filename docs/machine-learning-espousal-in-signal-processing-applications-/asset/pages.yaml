    is a device which samples and quantizes the analog signal and produces the digital
    signal, whereas digital to analog convertor (ADC) performs reconstruction and
    produces analog signal from the digital signal.


    # 4.2.1 Machine Learning in Audio Signal Processing


    Development of machine learning models in audio signal processing requires the
    clear understanding of the features of audio signals. Features can be described
    as “measurable attributes and characteristics of a phenomenon.” Features are of
    great importance because using features, a machine can comprehend the data, classify
    it into different categories, and can perform the prediction [3]. In this section,
    the features of audio which can be utilized in audio processing and machine learning
    have been discussed.


    # 4.2.1.1 Spectrum and Cepstrum


    Spectrum and cepstrum are the two significant attributes of audio signal processing.
    Mathematically speaking, a spectrum of an audio signal is obtained by computing
    its Fourier transform which converts a signal of time domain into the signal of
    frequency domain. In other words, using spectrum, the audio signal is represented
    in the frequency domain. In order to form the cepstrum first, the long magnitude
    of the spectrum is computed, and then the inverse Fourier transform of the long
    magnitude is calculated. This is the signal which is neither in the time domain
    nor in the frequency domain. The steps in creating the spectrum and cepstrum of
    the audio signal are shown in Figure 4.2.


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_89_1.png)


    FIGURE 4.2

    Steps in creating the spectrum and cepstrum of the audio signal.'
