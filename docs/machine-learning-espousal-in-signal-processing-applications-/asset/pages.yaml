  md: '# 12.2.2 Wavelet Transform


    Fourier transformation transforms a time signal into a frequency spectrum.


    Fourier transform is well suited for the stationary signals where the frequencies
    present in the signal are not time-dependent. However, most of the signals in
    the real life are time-dependent like stock data, sensor data, etc. In general,
    the Fourier transform mainly concentrates on how the signals are localized in
    space. It detects the peak frequencies, and it is not able to tell when that frequency
    happens. It is unable to detect the time resolution of the real signal. In contrast
    to the Fourier transform, the wavelet transform (WT) can provide the frequency
    of the signals along with the time associated with those frequencies.


    Compared to the Fourier transform, the wavelet transform has a high resolution
    in frequency and time domain. It analyzes the signal and outputs the frequency
    type and time at which the frequency has occurred. By analyzing the signal in
    large-scale and small-scale windows, the large-scale and small-scale features
    can be extracted. It comes in different sizes are shapes.


    The wavelets are chosen depending on the type of application. The two important
    wavelet transform concepts are (i) scaling and (ii) shifting.


    +   i. Scaling: Scaling is a process of stretching and shrinking a signal in time.
    Scaling is used to either reduce the frequency band of interest or determine the
    frequency content in a narrower time interval. The more compressed wavelets are
    the result of the smaller scale factor. It is used to rapidly change details from
    signals, like high frequency, whereas the high scaling represents a stretched
    wavelet, and it slowly changes. It is usually used to extract coarse features
    or low-frequency components.

    ii. Shifting: Shifting a wavelet means delaying (or hurrying) its onset. In mathematical
    terms, the delaying function f(t) by k is denoted as f(t − k).


    Two main transforms in wavelet are continuous wavelet transform (CWT) and discrete
    wavelet transform (DWT). These transforms are differed by how the wavelets are
    scaled and shifted. Key applications of CWT are time-frequency analysis and time
    localized frequency components. The key applications of DWT are denoising and
    compression of signals and images.


    A wavelet transform is applied to a continuous signal, which breaks the signal
    into constituent wavelets of different scales and positions. The CWT produces
    wavelet coefficients as the result and multiplying scaled and shifted wavelet
    with these produces the constituent wavelet of the original signal


    # 12.2.2.1 Continuous Wavelet Transform (CWT)


    The output of CWT is coefficients, which are functions of scale and frequency.
    The given input signal is projected on a continuous family of frequency bands.
    The wavelet transform of a continuous signal f(t) is known as CWT and is defined
    in Equation (12.2) as


    ```

    $$C(a, b)=\frac{1}{\sqrt{a}}\int_{-\infty}^{+\infty}s(t)\phi\left(\frac{t-b}{a}\right)dt,\tag{12.2}$$

    ```'
