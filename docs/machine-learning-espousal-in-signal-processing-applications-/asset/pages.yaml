    # 10.4.2 Machine Learning (ML) Concepts


    Machine learning can be defined as an area of computer science which deals with
    creating algorithm or model from input data. Arthur Samuel (1959) [1] (Arthur
    Lee Samuel was an American pioneer in the field of computer gaming and artificial
    intelligence who popularized the term “machine learning” in 1959) defined the
    field of machine learning as “Field of study that gives computers the ability
    to learn without being explicitly programmed.” Kevin Murphy has further stated
    in his Seminal Book that machine learning is merely a collection of algorithms
    which is capable of auto detecting or extracting various uncovered and hidden
    patterns in data and use them to predict future data or other important information
    [31].


    The extraction of knowledge from data via using learning algorithms can be explained
    as follows:


    +   - **Extracting Various Hidden Patterns from the Data–Example:** text patterns
    recognition within a set of spam emails.

    - **Data Classification and Grouping into Different Categories–Example:** classification
    of all incoming emails into spam or nonspam.

    - **Prediction of Futuristic Result Based on Current Data–Example:** prediction
    about the occurrence of incoming spam email.


    As we know, machine learning algorithms have been segregated into four categories:


    +   - **Supervised learning:** this is explained is a *predictive learning* approach,
    which mainly aims toward learning from a labeled set of input-output pairs. These
    sets provide examples for further processing into either classifying the data
    into groups or predicting the data where the inputs are named *“features”* and
    outputs are termed as *“response variables.”*'
