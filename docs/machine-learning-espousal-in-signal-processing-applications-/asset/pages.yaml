- pgno: 350
  md: '# 11.12 Conclusion


    The aim of this work was to carry out a design study allowing the development
    of an intelligent system capable of detecting in real time and with a very good
    accuracy the electromechanical defaults of an electric induction machine. In this
    work, we did not present all these defaults but only that of the bearing because
    the principle remains the same for the others. Thus, after a rather global view
    of the electric induction machine and the defaults it is prey to, we lingered
    on the possible techniques allowing to design such a system by showing some high-resolution
    signal processing techniques (the variants of the ESPRIT method) and some artificial
    intelligence techniques (ANN-GA, KNN, SVM, ELM) in the frequency and time domain
    to finally decide which one would suit our purpose. And it was clear that analysis
    in the frequency domain allowed to have very good results in terms of not only
    of speed, memory size but also precision for reasons we have not forgotten to
    mention. After a detailed study, we have come to the conclusion that the machine
    learning technique ELM was best placed to meet our expectations.


    It should be mentioned, however, that the study was conducted with only one SNR
    step for learning and testing. And this did not allow for a generalist ELM on
    the other steps that were not used for learning. Therefore, the ideal would be
    to continue the work to develop a generalist ELM. It should also be added that,
    according to certain theories that we did not consider in this work, one of the
    advantages of MLEs was their ability to detect several defects at the same time;
    this could be verified for a continuation of this work.


    Finally, for health reasons, due to the current pandemic, we have not been able
    to access the university laboratory to verify the results obtained in a concrete
    way, which we were planning to do soon.


