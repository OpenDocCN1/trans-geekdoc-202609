    Machine learning algorithms learn from the data and continuously improve performance
    through experience. However, the data generated and stored by smart gadgets or
    systems are available in enormous volumes, and the term “big data” is used to
    describe this large-scale data set. Moreover, the data are available in diverse
    formats such as 2D signals, videos, and images, and traditional signal processing
    techniques will not come in handy to extract the information hidden in the data.
    Considering the enormous data sets and diverse formats, it is vital for ML algorithms
    to perform with high speed and efficiency. The great need to cope with big data
    and dissimilar formats has led to the adoption of ML algorithms that use intelligent
    learning methods to extract information and process data with high speed and accuracy.


    Artificial intelligence techniques and ML algorithms are widely used in a number
    of vast and complex applications that require statistical signal processing including
    bioinformatics, astronomy, environment, and communications, just to name a few.
    For example, under bioinformatics, several academic researchers have adopted SPML
    techniques such as short-time Fourier transform (STFT) to detect epileptic seizures
    through EEG data as in [19] and [20]. As the data keep growing bigger and bigger,
    some applications in the modern world would even require advanced ML techniques.
    The performance of traditional ML algorithms may be slow as they require data
    to be fully loaded into memory for data mining and processing. The inability of
    such algorithms to learn all the data within a reasonable allotted time may pose
    a challenge.


    Advanced ML techniques such as deep learning have gained a lot of importance in
    the recent years due to their state-of-the-art performance in terms of speed and
    deep architecture. Deep learning architecture can capture complex input data patterns
    outperforming traditional ML techniques in making informed predictions. Especially,
    the deep learning technique called convolutional neural networks (CNN) has been
    showing some promising results for future work. The continuous evolution of technology
    and research efforts will definitely give rise to modern applications in various
    domains with a requirement to learn from multifarious environments, and this is
    where ML algorithms will play a vital role.'
