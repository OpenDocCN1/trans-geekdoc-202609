    Parameters of the equalizer are:


    **w** = {a₀, aᵢ, cⱼ, τᵢⱼ, δᵢⱼ, bₖ}  (8.27)


    where


    i = 1, …, N_I, j = 1, …, N_ψ and k = 1, …, N_B.


    The basic idea of training the equalizer is to adjust parameter vector **w** so
    as to minimize MSE given by


    ℳ(**w**) = 1/(2N) Σₙ₌₁ᴺ |y(n) − ŷ(n)|²  (8.28)


    Argument in MSE cost function ℳ(**w**) indicates that its value is dependent on
    network weight vector **w**. Conventional techniques of training the WNN involve
    algorithms like BP, EKF LMS, which follow the hill-climbing approach to achieve
    optimality. However, these techniques are limited by slow rate of convergence
    and get easily trapped in local optima. In this work, ℳ is minimized iteratively
    with the CSO algorithm.


    # 8.5.2 Cuckoo Search Optimization


    CSO is an optimization algorithm which mimics the breeding behavior of cuckoo
    birds (Yang and Deb 2014). Cuckoo birds are known for their aggressive breeding
    strategy. To increase the probability of survival of their offspring, they practice
    various types of'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'brood parasitism. Birds of many cuckoo species, like European common cuckoo,
    lay their eggs in the nests of host species. Generally, eggs of cuckoo birds hatch
    earlier than the eggs of host bird, and cuckoo chicks can escape before detection.
    Moreover, shells of cuckoo eggs are stronger than the host bird so that they are
    not easily damaged. But the cost incurred by the brood parasitism is high on the
    host species, and it makes all attempt to identify and remove the cuckoo eggs.
    Thus, there is an evolutionary “arms race” where cuckoos try to fool the host
    species into making them raise their chicks and host birds trying to prevent it.
    This competitive behavior is utilized in CSO for finding the optimal solution.


    Levy flights are random or quasi-random walks which model the search of food by
    insects, birds, and animals. It was shown that some fruit flies explore landscape
    by flying along a straight flight followed by sudden 90-degree turn. Similarly,
    in some hunter gatherer tribes of human, hunting is done by exploring the landscape
    in a series of straight paths and then taking a sudden turn. Time series representation
    of Levy flight is characterized by short burst of activity throughout the time
    series, resulting in a “heavy tailed” distribution. That is, it has high concentration
    of short steps and low concentration of large steps, though the concentration
    of large steps is higher than usual random walk. A distinguishing feature of Levy
    flight which gives it an edge over normal random walks for exploring wider search
    space is that its variance increases faster than normal random walks. This reduces
    the required number of iterations by approximately four orders compared to normal
    random walk (Marelli and Twala 2018).


    In CSO, potential solutions are associated with cuckoo eggs. Cuckoo birds lay
    their eggs in the nest of other birds with the expectation that their offspring
    will be raised by the proxy parents. If some of them are identified by the host
    bird, they are removed from the nest. Based on these ideas, CSO is developed based
    on the following rules (Abdelaziz and Ali 2015):


    +   - Each cuckoo lays an egg and randomly places it in any one of the nests.

    - The nest having good quality of eggs (or solutions) will be permitted to carry
    over to the next generation.

    - In a fixed fraction $p_a \in [0,1]$ of nests, the host bird will be able to
    identify parasitic eggs. In such cases, these eggs are either dropped, or the
    host bird completely abandons the nest.


    Based on these three rules, the CSO algorithm is summarized in Algorithm 1. In
    the implementation, initially $P$ random solutions $\mathbf{w}_p^{(0)}$, $p =
    1,..., P$ are generated. New solution $\mathbf{w}_p^{(l+1)}$ at $(l+1)$-th generation
    for $p$-th cuckoo is generated as


    $$\mathbf{w}_p^{(l+1)} = \mathbf{w}_p^{(l)} + \alpha L(\beta) \tag{8.29}$$


    where


    $0 < \beta \le 2$ is Levy flight parameter and


    $\alpha > 0$ is step-size scaling factor.


    $L(\beta)$ are random numbers drawn from Levy distribution.


    In practice, Levy flights are generated using Mantegna’s algorithm as (Yang 2010):


    $$L(\beta) = s \left( \mathbf{w}_p^{(l)} - \mathbf{w}_{min} \right) \otimes \mathbf{r}
    \tag{8.30}$$'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'where

    **w**_min is the best nest (with least cost),

    **r** = [r₁, ..., r_D]^T with r_i ~ N(0,1) and ⊗ indicates element-wise multiplication
    of vectors.


    In Equation (8.30), step length s is computed as


    $$s = \frac{u}{|v|^{1/\beta}}\tag{8.31}$$


    where

    *u* ~ N(0, σ_u²) and

    *v* ~ N(0, σ_v²) are Gaussian random variables with standard deviation.


    $$\sigma_u = \left(\frac{\Gamma(1+\beta)\sin\left(\frac{\pi\beta}{2}\right)}{\Gamma\left[\frac{1+\beta}{2}\right]\beta^{2^{(\beta-1)/2}}}\right)^{1/\beta}\tag{8.32}$$


    $$\sigma_v = 1\tag{8.33}$$


    However, to accommodate exploration capability of the algorithm, some fraction
    p_a of new solutions are generated as given below (Abdelaziz and Ali 2015):


    $$\mathbf{w}_p^{(l+1)} = \mathbf{w}_p^{(l)} + \alpha\delta \otimes H(p_a - \delta)
    \otimes \left(\mathbf{w}_i^{(l)} - \mathbf{w}_j^{(l)}\right)\tag{8.34}$$


    +   where

    - δ is step size,

    - H is Heaviside function,

    - ó is a uniformly distributed random number.


    # Algorithm 1 Cuckoo Search Optimization (CSO)


    **Input:** Objective function ℳ(**w**) with **w** = [w₁, ..., w_D]^T

    **Initialize:** Generate a population of P nests **w**_p^(0), p = 1, ..., P.

    Evaluate cost of each nest as ℳ_p^(0), with **w**_min having minimum cost ℳ_min.

    **while** (l < MaxGeneration) or (stop criteria) do

    Generate new solutions **w**_p^(l) using **w**_min and Equation (8.29) for p =
    1, ..., P.

    Evaluate its cost as ℳ_p^(l), p = 1, ..., P.

    **if** ℳ_p^(l) > ℳ_p^(l-1) **then**

    Replace **w**_p^(l) by older solution **w**_p^(l-1).

    **end**

    Replace a fraction p_a of the worse nests with new ones generated via (8.34).

    Evaluate the nests.

    Based on ℳ_p^(l), find the current best nest as **w**_min.

    **end**'
