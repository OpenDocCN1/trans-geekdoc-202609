    # 6.6.1 Evoked Potential (EP) or Evoked Response


    EP is an electrical response that is recorded from the specific part of the nervous
    system after a stimulus is introduced. The Steady state evoked potential (SSEP)
    and event-dependent potential could be split similarly [93]. The components of
    the EP are known as exogenous or endogenous [94]. The physical characteristics
    of stimuli, including depth, modality, and rate of presentation, influence exogenous
    components. However, the endogenous elements are determined by the stimulus’ psychological
    or cognitive meaning, i.e., the state of affairs’ psychological or cognitive demands.
    They are not affected by the stimulus’s physical characteristics. Endogenous components
    differ with techniques, perceptions, and other mental behaviors triggered by the
    occurrence in terms of amplitude, latency, and scalp distribution [95].


    The SSEP study by Maye et al. [96] was evoked with the assistance of a stimulus
    modulated at a fixed frequency and occurs as an increase in stimulus frequency
    EEG behavior. The stimulus can be either visual, as in steady state visually evoked
    potentials, auditory, as in steady state auditory evoked potentials [97], or somatosensory
    (related to sensation), as in steady state somatosensory evoked potential [98].


    A change in stimulus is elicited by event-related potential (ERP). After exposure
    to the spontaneous prevalence of the desired target case, it is the direct result
    of specific sensory, cognitive, or motor family. Sensory stimulation, a cognitive
    phenomenon, or the implementation of a motor response may be the case. Paulraj
    et al. [17] described ERPs. Visual evoked potentials, somatosensory evoked potential
    and AEP were discussed by Neela and Kahlon [99].


    # 6.6.2 Event-Related Desynchronization and Synchronization


    As a result of these practices, improvements were found to be capable of blocking
    or reducing the strength of the ongoing EEG signal. ERS (event-related synchronization)
    is hike in rhythmic activity. Event-related desynchronization shows a decrease
    in brain oscillatory activities. They are time-locked to the events, and averaging
    cannot be extracted.


    The degree of synchrony of the neuronal populations underlying it can be related
    to this. The energy decrease is referred to as de-synchronization related to events
    or ERD, whereas the increased electricity is referred to as synchronization related
    to events (ERS) [100]. With the assistance of emerging mental duties, like motor
    visualization, mental mathematics, or mental rotation, they can be taken on.


