  img_proc: true
- pgno: 361
  md: "In general, there are two ways to integrate the DWT into a classification of\
    \ time series data [11]. The first method is to apply the classification methods\
    \ to the wavelet domain, and the second is to incorporate the multiresolution\
    \ property into the classification process.\n\nIn the first approach, the classification\
    \ is performed on the transformed data rather than the original data. Here, the\
    \ main task is to identify the decomposition level, which is suitable to apply\
    \ the classification. The solution to this problem mainly depends on the data\
    \ and application domain. This approach can be used in many domains, such as medical,\
    \ audio, and texture. Classification can be performed on the wavelet-transformed\
    \ data rather than the original data. For example, in medical signal classification,\
    \ the prominent features from the original signal are identified using DWT. Classification\
    \ of the medical signals, for example, EEG signals were decomposed into subbands\
    \ of different frequencies. After that, the wavelet coefficients are fed to a\
    \ classifier like neural networks for the classification task. In [12], the authors\
    \ classify the EEG signal as normal or epileptic. The DWT retains the EEG signals\
    \ with significant frequencies. For this, first, the EEG signals are digitized\
    \ at 200 samples. Applying DWT to each signal, the decomposed signals are generated.\
    \ Each signal of level i, on decomposition, produces corresponding approximation\
    \ and detail coefficients A_i and D_i of that signal. Different frequency ranges\
    \ and the resultant wavelet coefficients provide meaningful information to the\
    \ medical practitioners. The components that do not provide much significant information\
    \ are not considered in the classification model's neural network.\n\nThe wavelet-based\
    \ TSC incorporates the multiresolution property of the DWT in the classification\
    \ process. The dominant features of the signals that possess the large energy\
    \ values in the wavelet coefficients are chosen for classification and computed\
    \ by the wavelet coefficients with large energy values that are then used for\
    \ the classification.\n\nSome of the classification algorithms used in the TSC\
    \ are listed below:\n\n+   i. **One Nearest Neighbor (1NN)**: 1NN classification\
    \ is a specialization of a KNN where k value is set to one. In general, kNN works\
    \ based on similarity measures such as Euclidean distance, Manhattan distance,\
    \ etc., to compute the nearest neighbor. In time-series data, the best measure\
    \ for the underlying is Dynamic Time Warping (DTW), Time Warp Edit Distance (TWED),\
    \ Edit Distance on Real Sequence (EDR), Minimum Jump Cost (MJC), and kNN requiring\
    \ a distance measure to find the nearest neighbors [6–8].\n\nii. **Shapelet Transform**:\
    \ This algorithm works like a decision-tree like-classification. It tries to find\
    \ the most representative subsequences from the training set as shapelet. Shapelets\
    \ are representative of a class. This shapelet is then used to match unknown time-series\
    \ data. By optimizing the data benefit of dividing time series data into subsequences\
    \ and selecting the best candidates from the series segments, the shapelets are\
    \ obtained. Besides, the Shapelet Transform (ST) is suggested to find and use\
    \ top k shapelets from each class to transform datasets by measuring the distances\
    \ between a sequence and each shapelet [9,10]. After transforming the time-series\
    \ data into shapelets, generic classification can also be utilized for the classification\
    \ of time series data.\n\niii. **Time Series Forest Classifier (TSF)**: works\
    \ as a random forest classifier to time series data [14]. The basic steps followed\
    \ by the TSF are as follows:\n   a. It splits the time series signals into random\
    \ intervals with random lengths and starts periods.\n   b. Extracts the statistical\
    \ features like mean, standard deviation, slope, etc. into a single feature vector\
    \ from each random interval."
