    # 6.3 Functions of BCI


    Most of the functions of BCI are related to the state of the user and enabling
    the user to communicate his ideas. BCI provides a nonmuscular communication channel
    that, depending on the case of the patient, can be used in healthcare to support
    a patient who has extremely impaired motor functions. Using invasive or noninvasive
    techniques, to complete the intended tasks, BCI systems record brain signals and
    send them to the computer system. To communicate an idea or regulate an entity,
    the transmitted waves are then used.


    The main functions of BCI are correspondence and control and client state checking.'
