    # 2.8.9.3 Geometrical Interpretation of Derivatives


    Let AB be the line passing through the points (x, f(x)) and (x+Δx, f(x+Δx)). If
    Δx, that is, approaches zero, then the line approaches the tangent line at the
    point (x, f(x)) [32]. Accordingly, the slope of the tangent line is the limit
    of the slope of the line when Δx approaches zero, as shown in Figure 2.17.


    Thus, the derivative f''(x) can be interpreted as the slope of the tangent line
    at the point (x, y) on the graph of the function y=f(x).


    Whenever the function starts increasing at some interval, the slope of the tangent
    is positive at each point of that interval, and hence, the derivative of the function
    is positive.


    Whenever the function starts decreasing at some interval, the slope of the tangent
    is negative at each point of that interval, and hence, the derivative of the function
    is negative.


