    # 10.2.2.2 The Mathematics of Probability


    Considering the mathematical framework for probability, there are important theories
    and axioms that are required to take full advantage of the theory as a tool for
    machine learning. The concept of probability is majorly about possibility of various
    outcomes. Here, the set of every feasible outcome is called the **sample space**.
    For example, the sample space for a coin flip is {heads, tails} or temperature
    of water is every value possible between the freezing and boiling point. At any
    given time only, a single outcome is possible out of the considered sample space
    [17].


    Here, the probability of an event ω is P(ω).

    Ω (capital omega) is the sample space

    ω (lowercase omega) is the specific outcome.

    The two basic axioms of probability can be defined as follows:


    +   - 0 ≤ P(ω) ≤ 1

    - ∑_ω P(ω) = 1


    According to the given rule, the probability of an occurrence of any given event
    has to fall between 0, i.e., impossible, and 1 corresponding to certain, and the
    sum of the probabilities of all events should be 1. This given axiom can be further
    extended to the fact that the sample space must contain all possible outcomes.
    Hence, it is quite certain (probability 1) for one of the possible outcomes to
    occur.'
