  md: 'processes used in temporal, wavelets, frequency, time-frequency, cepstral,
    and domain features. Studies indicate that these areas have the best defining
    characteristics in what the different types of audios have. Audio types such as
    speech operate in a specific frequency range of between 100 Hz and 17 kHz. Other
    sounds like environmental sounds are also more continuous and permanent than created
    ones like music. The research indicates the importance of considering these factors,
    alongside the consideration of their magnitude.


    # 5.5.4.4 Speech Classification


    Classification of speech has been progressing in through years, with recent techniques
    being quite accurate in recognizing simple cases. The complex technological tools
    are powerful enough to process human speech with high accuracy rates [149]. Building
    an acoustic model for automatic speech recognition is a growing trend in audio
    processing. DNN models have been steadily improving acoustic models since they
    are in a better position to learn and fix the mistakes of prior models like the
    Gaussian mixture models. The advantages of DNNs are evident, especially in audio
    signals with noise, and work with higher efficiency rates.


    # 5.5.4.5 Music Processing


    Music also presents a good platform to perform audio processing with deep learning
    methods. Music files include a collection of different sounds that provide entertainment
    for people. Classifying music files requires creating spectrogram images of the
    audio signals and applying filters to distinguish the defining features of each
    one [150]. Using timbre to distinguish sound has shown to have excellent results,
    especially when considering time-constrained pieces like music. Other considerable
    factors include a variance of speech, loudness levels, differences in duration,
    and spatial differences. Deep learning models collect each music piece and consider
    the variables for creating unique signatures for the files.


    # 5.5.4.6 Natural Sound Processing


    Environmental sounds represent a large portion of audio recordings. Although the
    human mind has learned to ignore them and concentrate on the meaningful sound,
    machines still need to learn how to filter them out [151]. The current models
    have a hard time classifying and filtering out environmental sounds. Improving
    performance is possible by merging DNN with traditional GMM ones improving the
    accuracy by a high margin. Training the classification algorithms separately with
    different files and parameters also helps improve the overall performance of the
    technique. With such techniques, future research is possible to make it possible
    to filter out unnecessary noise and leave meaningful ones.


    # 5.5.4.7 Technological Tools


    TensorFlow is an open-source tool that helps in applying machine learning techniques
    to data. The tool was developed by Google and had widespread applications, one
    of which is audio processing. The tool shows much promise in effective audio processing
    since it is built with efficiency in mind [152]. TensorFlow is also adaptable
    to other tools and techniques, making it dynamic for meaningful results. The customization
    options for TensorFlow are also many, making it quite useful for audio processing.
    Previous research'
