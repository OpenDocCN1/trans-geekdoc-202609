    # 7.5 Neural Network


    Neural network is a computational system that is inspired by the structure and
    functioning of human brain. An artificial neuron network (ANN), commonly known
    as NN, is a computational system based on the structure and functioning of biological
    neural networks. It is similar to an artificial human nervous system which receives,
    processes, and transmits information. It has been developed by using biological
    NN as a reference. The human brain processes information in an entirely different
    way from the existing digital computer. The human brain is a highly complex, nonlinear,
    and parallel information-processing system. It has the capability to arrange and
    use its structural components, known as neurons, in order to achieve specific
    goals (e.g., pattern recognition, perception, and motor control) in a much faster
    way than the existing fastest digital computer [5–7].


    In general, a NN is a system that is implemented to operate the way in which the
    brain performs a particular task. The NN is usually designed by using electronic
    components or is simulated using software on a digital computer. The complexity
    of ANN is much lesser when compared to the complexity of the brain. But there
    are two key similarities between ANN and biological NN. First, building blocks
    of both the networks are computational devices called neurons, which are highly
    interconnected. Interneuron connection strengths (called as synaptic weights)
    are used to keep a record of acquired information. Second, knowledge is acquired
    by both the networks from its environment through a learning process. Learning
    algorithm (i.e., procedure used for the learning process) modifies the synaptic
    weights of the inter-connected network in a required manner to achieve a required
    design objective [8–10]. The modification of synaptic weights is the traditional
    method for the design of ANN. Such an approach is similar to adaptive filter theory,
    which is already well developed and successfully applied in many fields. NN are
    also called connectionist networks, neurocomputers, parallel distributed processors,
    etc.


    Any NN consists of the following basic layers:


    +   1. **Input Layer**: It is made up of artificial neurons which take input from
    the physical world based on which the NN will learn about or process the information
    to produce desired results.

    2. **Hidden Layer**: It comes in between input layer and output layer. There can
    be more than one hidden layer to process the input data received from the input
