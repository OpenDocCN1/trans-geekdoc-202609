    # 7.2.2 Least Square Estimation


    In this second approach, a cost function is minimized. Cost function is computed
    by accumulating weighted error squares. The method of least squares can be implemented
    using block estimation or iterative estimation. Block estimation works in two
    steps. First, the input data observations are organized as blocks of equal length
    (duration), and then, filtering of input samples proceeds by considering one block
    at a time. On the contrary, in recursive estimation, the quantities of interest
    (e.g., tap weights of a transversal filter) are calculated and updated by processing
    each sample at a time. However, recursive estimator is mostly used in practice
    because it consumes less storage than a block estimator. Recursive least-squares
    (RLS) estimation can be thought as a special case of Kalman filtering. A special
    feature of the Kalman filter is the notion of state, which provides statistical
    properties of all the inputs applied to the filter up to a particular instant
    of time. Thus, recursion is used at the heart of the Kalman filtering algorithm
    which may be described in words as follows:


    (updated value) = (old value) + (Kalman gain) * (innovation vector),


    where new information fed to the filtering process at the time of the processing
    is treated as the innovation vector. It can be said that there is indeed a one-to-one
    correspondence between the RLS and Kalman variables. This correspondence means
    that the vast literature on Kalman filters can be used for designing least square
    estimation-based linear adaptive filters. Moreover, depending on the approach
    taken, the recursive RLS family of linear adaptive filters can be classified into
    three types:


    +   1. Standard RLS algorithm uses a tapped-delay filter as the structural basis
    for implementing the linear adaptive filter. Standard RLS algorithm is derived
    completely based on the result of matrix inversion lemma. Standard RLS algorithm
    has advantages and limitations (lack of numerical robustness and more computational
    complexity) as the standard Kalman filtering algorithm. Indeed, these limitations
    have prompted the development of the other variations of RLS algorithms.


    2. Square-root RLS algorithms, which are based on QR-decomposition of the incoming
    data stream. The Householder transformation and the Givens rotation are two well-known
    techniques used for performing this decomposition. RLS algorithms developed based
    on the Householder transformation or Given''s rotation result in computationally
    stable and robust adaptive filters which are called square-root adaptive filters.


    3. Fast RLS Algorithms, which are modified RLS algorithms. Standard RLS algorithm
    and square-root RLS algorithms are O(M²) algorithms where computational complexity
    is directly proportional to the square of M, where M is the number of adjustable
    weights. O() denotes "order of." On the other hand, the LMS algorithm has less
    computational complexity in which computational complexity increases linearly
    with M. So, LMS algorithm is called O(M) algorithm. When M is large, the computational
    complexity of O(M²) algorithms is not tolerable from a hardware implementation
    point of view. Therefore, it is very much necessary to modify the implementation
    of the RLS algorithm in such a way that it can be referred as O(M) algorithm.
    This objective can be achieved by exploring the redundancy in'
