  md: '# 8.5.4.1 MSE Performance


    In the first set of experiments, the performance of the proposed WNN DFE equalizer
    is compared with other schemes in the literature. Simulation is performed on two
    reference channels from Iqbal et al. (2015), whose transfer function are given
    as


    ```

    Ch 1: $H(z) = 0.408 + 0.816z^{-1} + 0.408z^{-2}$  (8.38)


    Ch 2: $H(z) = 1 - 1.9114z^{-1} + 0.95z^{-2}$  (8.39)

    ```


    Further, either of these linear channels is cascaded with one of the three types
    of nonlinear functions given below (Nanda and Jonwal 2017):


    ```

    NL 0: $y = x$  (8.40)


    NL 1: $y = \tanh x$  (8.41)


    NL 2: $y = x + 0.2x^2 - 0.1x^3$  (8.42)

    ```


    Obviously, NL 0 is a linear function (linear functions are subclass of nonlinear
    functions), while other two relations represent different degrees of nonlinearity.


    In Table 8.2, the settled value of training and testing MSE for linear channels
    Ch 1 and Ch 2 are reported. While in this experiment, the nonlinearity model considered
    is NL 0, training and testing is done for 20 dB SNR. It is observed that the proposed
    WNN DFE trained by the CSO algorithm provides the lowest MSE among all the considered
    techniques. Moreover, second to the proposed algorithm, FIR DFE optimized by PSO
    provides the most competitive performance. Between both the channels, all the
    considered algorithms show relatively better performance in Ch 1. Further, it
    can be observed that in the absence of linear mapping in ANN-based models; their
    performance is worse compared to FIR DFE and the proposed scheme.


    In Table 8.3, the effect of nonlinearity on the MSE performance is reported. In
    this experiment, the simulation setup consists of linear channel Ch 1 in cascade
    with either NL 1 or NL 2. The received signal SNR is again maintained at 20 dB
    for all the schemes. In this scenario also, the proposed equalization scheme shows
    the best performance for both NL 1 and NL 2. Different from the linear channel
    scenario given earlier, the ANN SFLA algorithm is the second best performing in
    case of nonlinear channels at 20 dB. This shows that neural network-based equalizers
    are better in approximating nonlinear functions compared to simple FIR DFE structure
    of Iqbal et al. (2015).


    # 8.5.4.2 Effect of EVR


    In the next set of simulations, we study the effect of eigenvalue ratio (EVR)
    of the channel on the BER performance of the proposed equalizer and compare it
    with other schemes in the literature. EVR is defined as $\lambda_{\max}/\lambda_{\min}$,
    where $\lambda_{\max}$ and $\lambda_{\min}$ are the largest and smallest eigenvalues
    of received signal correlation matrix $R = E[\mathbf{x}\mathbf{x}^T]$, respectively
    (Haykin 2008). If the EVR of the channel is high, the receiver input signal is
    more concentrated in the direction of eigenvector corresponding to the largest
    eigenvalue. The transmitted signal is usually uncorrelated, but on passing through
    a channel with large EVR, it develops strong correlation resulting in severe ISI.
    On the other hand, if the EVR of the channel is low, the'
  merge: -1
  img_proc: true
