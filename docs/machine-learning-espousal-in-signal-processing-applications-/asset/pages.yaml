    # 1.1 Introduction


    Signal processing has gained a lot of appreciation in the modern era with its
    applications growing virtually in all walks of life such as communications, entertainment,
    control, and environment, just to mention a few. Digital signal processing (DSP)
    is a main driver of a digital revolution that introduced compact disks, DVDs,
