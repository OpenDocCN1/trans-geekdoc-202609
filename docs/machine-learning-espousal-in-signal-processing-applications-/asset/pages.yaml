    the expected behavior.

    2. **Rate of Convergence:** It is defined as the number of iterations required
    for the considered algorithm to converge close enough to the efficient Wiener
    solution in a stationary environment.

    3. **Tracking:** There should be some form of tracking in nonstationary environment
    to track statistical variations in the input observations. The tracking efficiency
    of the algorithm depends on two opposite factors: (i) steady-state fluctuation
    due to noise and (ii) rate of convergence.

    4. **Computational Requirements:** Number and type of operations in each iteration
    and memory usage are major issues to be considered here. The investment required
    to implement the algorithm is also a major concern.

    5. **Robustness:** Whenever small variations in input statistical properties result
    in small estimation changes in computed values, then adaptive filter is said to
    be robust.

    6. **Structure:** The manner in which adaptive filter is implemented in hardware
    form is determined by the structure.


    The above factors should also be considered while designing a nonlinear adaptive
