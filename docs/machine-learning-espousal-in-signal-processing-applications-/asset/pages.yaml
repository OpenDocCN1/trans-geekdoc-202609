    learning that uses the concept of retro-propagation to adjust synapse weights
    and that are very costly in terms of computing time. This makes it 1,000 times
    faster in terms of time execution than its predecessors. Better than that, moreover,
    its application in recent research studies have proven time to give a good performance
    in terms of generalization on his learning. What is not the case for the neural
    networks known so far.


