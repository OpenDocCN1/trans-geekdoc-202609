  md: '(where $p=2$) is the most commonly used distance metric. It is simply the distance
    measured between any two points in this plane using the Pythagorean theorem. For
    example, the Euclidean distance between two points $a$ and $b$ shown in Figure
    1.5 can be calculated using Equations (1.10a).


    $l_2 = \|a - b\|_2 = \sqrt{\sum_{i=1}^{n} (a_i - b_i)^2}$ (1.10a)


    This is a two-dimensional Euclidean space, and $a_i$ and $b_i$ are the variables
    of vectors $a$ and $b$ in this space, i.e., $a = (a_1, a_2, a_3, ...)$ and $b
    = (b_1, b_2, b_3, ...)$.


    Therefore, $a_i - b_i = (a_1 - b_1) + (a_2 - b_2) + ... + (a_n - b_n)$.


    For example, the Euclidean distance between two vectors, let us say points $a$
    $(1, 2)$ and $b$ $(3, 5)$ in the $\mathbb{R}^2$ plane can be calculated as follows:


    $l_2 = \|a - b\|_2 = \sqrt{(a_i - b_i)^2} = \sqrt{(3-1)^2 + (5-2)^2} = \sqrt{13}$
    (1.10b)


    So, $\sqrt{13}$ is the Euclidean distance between $a$ and $b$ in two dimensions.


    While Euclidean distance is sufficient to capture distance measurements in a given
    space, some applications require measurement of larger distances, and $l_p$ norms
    are used for such applications. $l_p$ norm where $p \ge 1$ is represented as in
    Equation (1.11).


    $l_p = \|a - b\|_p = \left( \sum_{i=1}^{n} |a_i - b_i|^p \right)^{\frac{1}{p}}$
    (1.11)


