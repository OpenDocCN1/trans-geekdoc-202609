- pgno: 201
  md: 'Some of the recent developments on recurrent neural networks (RNNs) have also
    benefited channel equalization research. RNNs are a kind of neural network with
    feedback. They are typically used for modeling dynamical systems in which output
    is not just dependent on the present input, but also on the previous states also.
    RNN are capable of outperforming both MLP and RBF neural networks, despite the
    large training complexity. Several computationally efficient equalizer designs
    based on RNN were proposed in literature (Zhao et al. 2011; Li et al. 2017). Li
    et al. (2017) leverage shift-invariance properties of convolutional neural network
    to learn matched filters. Learnt matched filters are then fed into RNN with long-short
    term memory (LSTM) memory cells for temporal modeling of the channel. In general,
    popular training methods for RNNs are computationally expensive and often have
    extremely slow convergence. Reservoir computing (RC) techniques are often proposed
    as a substitute for RNN. An echo state network (ESN)-based MIMO-OFDM equalization
    and detection technique was proposed by Mosleh et al. (2017). ESN neural networks
    belong to the broad class of RC techniques which can be trained without the complexity
    of RNN. In studies by Bauduin et al. (2015) and Majumder (2020a), ESN was applied
    for equalization of nonlinear satellite and wireless communication channels. Deep
    neural networks (DNNs) are also increasingly finding application in the field
    of channel equalization. Generally, DNNs are neural networks having a large number
    of hidden layers and have feature learning ability. In Ye et al. (2017), DNN is
    trained for channel estimation and signal detection for OFDM network. A variational
    autoencoder-based blind channel equalizer and decoder was proposed in (Caciularu
    and Burshtein 2020), in which the authors consider detection of symbols transmitted
    over ISI channels. They demonstrate significant and consistent improvement in
    error rate compared to existing techniques like constant modulus algorithm (CMA)
    equalizers. A DNN-based equalizer was proposed for equalization and detection
    of multilayer magnetic recording in a study by Aboutaleb et al. (2020). In this
    work, a convolutional neural network is utilized for equalization and separation
    of signals from each other. Finally, detection is performed by multilayer magnetic
    recording Viterbi detection algorithm.


    Wavelet neural network (WNN) is an important tool in time series analysis. Similar
    to RBF neural networks, they are a single hidden layer network consisting of multiple
    neurons, which are linearly added at the output node. But unlike RBF neural networks,
    neurons in the hidden layer of WNN utilize wavelets functions for activation (Yang
    and Hu 2016). Though ANNs can be used to model any nonlinear dynamical system,
    classical sigmoidal networks have a series of drawbacks. With sigmoidal activation
    function, there is significant chance that training algorithm will converge to
    local minima. Moreover, random weight initialization in conventional neural network
    results in extended training times. WNN allows for constructive procedures for
    efficient initialization of the parameters of the network, resulting in reduced
    training time (Alexandridis and Zapranis 2013). WNN have been used in a variety
    of prediction applications, like load forecasting (Ribeiro et al. 2019), wind
    speed prediction (Zhang et al. 2019), distributed cooperative learning (Xie et
    al. 2019), and channel equalization (Majumder 2020b; Majumder and Giri 2020).
    Pradhan et al. proposed one of the first algorithms for WNN-based equalization
    of linear and nonlinear channels (Pradhan et al. 2006). They proposed a scheme
    to train WNN using extended Kalman filter based recursive algorithm and demonstrated
    its superiority over MLP and RBF neural network. Recently, Nanda et al. developed
    equalizers based on WNN trained by symbiotic organism’s search (SOS) algorithm
    (Nanda and Jonwal 2017). They optimized the output weights of the WNN to achieve
    desired performance, leaving the translation and dilation parameters unchanged.'
