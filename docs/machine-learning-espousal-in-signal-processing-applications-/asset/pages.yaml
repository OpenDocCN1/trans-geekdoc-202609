    # 8.1 Introduction


    Equalizers are one of the important building blocks of wireless communication
    receivers for compensating the effects of inter-symbol interference (ISI) resulting
    from dispersive channels. Equalizers are also utilized for removing distortion
    in received signal affected by nonlinearities in transmitter and receiver hardware.
    Equalization aids in combating multipath and noise effect of channel resulting
    in enhancement of performance and spectral efficiency. Moreover, due to widespread
    access of internet through mobile devices and increasing requirement of high data
    rate, more and more bits are required to be transmitted in a small duration. As
    a consequence, interference between symbols (i.e., ISI) will continue to increase
    many folds in future and will demand significant improvement in equalizer performance.'
