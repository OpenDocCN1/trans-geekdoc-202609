  md: 'In recent times, swarm intelligence algorithms have attracted a lot of attention
    in problem solving in various fields (Nayyar et al. 2018; Nayyar and Nguyen 2018).
    Swarm intelligence refers to the field of artificial intelligence in which an
    intelligent multiagent system is designed by taking inspiration from the collective
    behavior of animals or insects in nature for problem solving (Beni 2020). In a
    study by Lipa et al. (2015), a bio-inspired time synchronization protocol was
    proposed for cognitive radio networks. The protocol is inspired by the synchronization
    observed in fireflies in which they seem to glow or dim together. This algorithm
    allows cognitive radio nodes to synchronize in a decentralized manner. Sutantyo
    and Levi proposed an algorithm inspired by firefly and frog for facilitating scheduling
    within robotic swarm (Sutantyo and Levi 2015). They have shown through simulations
    and experiments that the proposed swarm-based model is robust and viable for underwater
    swarm robots. Swarm intelligence was applied for wind energy potential and prediction
    of wind speed in the study by Zhao et al. (2019), which can be beneficial for
    wind farm management.


    Various optimization algorithms based on swarm intelligence have been proposed
    in recent times. Ant colony optimization and particle swarm optimization are the
    best examples of such optimization algorithms and have been immensely popular
    (Mavrovouniotis et al. 2017). Inspired by the swarm behavior of a grasshopper,
    an optimization algorithm called grasshopper search optimization (GOA) was proposed
    to find the optimal shape of bar truss and cantilever beams (Saremi et al. 2017).
    An optimization algorithm called salp swarm optimization (SSA) was proposed by
    Mirjalili et al. based on the swarming behavior of salps when moving and foraging
    in oceans (Mirjalili et al. 2017). Besides swarm intelligence algorithms, another
    class of nature inspired algorithms is evolutionary algorithms. Instead of swarm
    behavior, they derive their capability from the theory of evolution and how species
    develop over multiple generations. Some optimization algorithms in this class
    are genetic algorithm (Mirjalili 2019), differential evolution (DE) (Opara and
    Arabas 2019), and biogeography-based optimization (BBO) (Ma et al. 2017).


    Recently, metaheuristic techniques applied to equalization problems have shown
    significant improvement over conventional algorithms. Unlike conventional gradient-based
    optimization algorithms, nature-inspired or metaheuristic learning techniques
    can avoid getting trapped in local optima. Particle swarm optimization (PSO) is
    one such heuristic algorithm which was applied for optimization of weights in
    channel equalizers (Al-Awami et al. 2011; Al-Shaikhi et al. 2019; Iqbal et al.
    2014). A modification to the PSO algorithm which resulted in improved performance
    of adaptive equalizer compared to other similar schemes was presented by Al-Awami
    et al. (2011). Al-Shaikhi et al. (2019) proposed a modification to PSO the algorithm,
    called hybrid PSO (HPSO) for improvement in equalizer performance. HPSO includes
    randomization and assignment of inertia weights to the particles so that they
    do not get trapped in local minima. In the study by Iqbal et al. (2014), a PSO
    trained equalizer for single carrier frequency division multiple access (SC-FDMA)
    system is proposed, where the authors demonstrate its robustness in high Doppler
    scenario. Decision feedback equalizers (DFEs) are known to outperform linear FIR
    equalizers in terms of performance. A DFE equalizer for multiple-input multiple
    output (MIMO) system was proposed for channels with high eigenvalue spread in
    the study by Iqbal et al. (2015). In it, the authors presented a hybrid of PSO
    and least mean square (LMS) algorithm to demonstrate improved performance over
    equalizer utilizing only PSO. Equalizer structures with FIR and infinite impulse
    response (IIR) filters optimized by moth flame optimization (MFO) was proposed
    by Nanda and Garg (2019). While the proposed FIR equalizer is an adaptive equalizer,
    the IIR equalizer is a blind adaptive equalizer for IIR channel.'
