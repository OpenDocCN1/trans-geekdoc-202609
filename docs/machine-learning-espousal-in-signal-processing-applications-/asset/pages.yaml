    algorithms and machine learning is creating better tools and techniques.


    # 5.5.4 Current Methods


    # 5.5.4.1 Audio Classification


    Classifying audio files using deep learning methods has been recently applied
    by researchers. This process is possible through building classification models
    tailored for audio signals [146]. The process entails the use of CNN models, which
    require modification given that they were tailored for natural images. The time
    factor in audio images makes it difficult for conventional CNN models to work.
    The results of the trained ImageNet classification models show high accuracy,
    especially in performing training prior to using them for real audio. Further,
    fine-tuning shows better promise of more accurate results.


    # 5.5.4.2 Audio Fingerprinting


    Fingerprinting of audio as shown in Figure 5.15 is a process that provides a unique
    identity of a piece of an audio signal, depending on its nature. Fingerprinting
    audio files has shown excellent application for recognition and identification
    purposes. An example by [147] illustrates the process of fingerprinting, whereby
    different versions of similar audio files are compared.


    The example derives its technique from convolution neural networks, which allow
    step by step encoding for the audio. The results of the traditional CNN for distorted
    audio files are still weak, making it hard to use them for uniquely identifying
    them. The process, though, can be improved by tuning it for general similarities
    and possible changes.


    # 5.5.4.3 Feature Extraction


    The features of an audio file contain meaningful characteristics that can distinguish
    different types, such as music, speech, and other sounds [148]. The study indicates
    the different


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_130_0.png)


