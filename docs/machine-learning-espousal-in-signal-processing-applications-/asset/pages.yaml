- pgno: 210
  md: '# 8.4 Multidimensional Wavelet Neural Network


    Based on the WNN model in Alexandridis and Zapranis (2013), a multidimensional
    wavelet network is constructed in which different inputs are interconnected with
    multiple hidden units. Outputs of the hidden units ψ_j(x), as well as direct inputs
    x_i, are then linearly combined, to obtain the final output ŷ. Fig. 8.5 shows
    the structure of single hidden-layer multidimensional WNN. For N_I input wavelet
    network with N_ψ hidden units or wavelons, input-output relation is given as


    $$\hat{y}=f(\mathbf{x})=\sum_{j=1}^{N_{\psi}}c_j\psi_j(\mathbf{x})+\sum_{i=1}^{N_I}a_i
    x_i + a_0\tag{8.21}$$


    where


    +   - c_j are weights from wavelons to output,

    - a_i are weights from input layer to the output, and

    - a_0 is the bias at the output layer.


    In the expression (8.21), ψ_j(x) is a multidimensional wavelet given as


    $$\psi_j(\mathbf{x})=\prod_{i=1}^{N_I}\psi(z_{ij})\tag{8.22}$$


    where


    z_{ij} = (x_i - τ_{ij}) / δ_{ij}.


    The weights τ_{ij} correspond to translation and δ_{ij} correspond to dilation
    factors.


    For performance evaluation of the proposed equalizer, Mexican hat function is
    considered for mother wavelet and is given as


    $$\psi(z)=(1-z^2)e^{-z^2/2}\tag{8.23}$$


    A WNN with N_I inputs and scalar output ŷ is considered, which is trained using
    a set of N examples {x(n), y(n)}, where x(n)=[x1(n),..., x_NI(n)]^T is the input
    vector for training example n. The objective of the training is to minimize mean-square
    error (MSE) E[|y - ŷ|^2] between target output y(n) and actual network output
    ŷ(n). The WNN can be represented in the form of a parametrized nonlinear model
    (Figure 8.5):


    $$\hat{y}(n)=f(\mathbf{x}(n),\mathbf{w})\tag{8.24}$$


    where the set of adjustable parameters of the WNN is w = {a0, a_i, c_j, τ_ij,
    δ_ij} with i=1,..., N_I and j=1,..., N_ψ.'
