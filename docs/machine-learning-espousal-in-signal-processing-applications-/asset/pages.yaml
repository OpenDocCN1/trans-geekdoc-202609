  md: '# 5.3 Natural Language Processing


    NLP [4–6] is also called computational linguistics with the interactions between
    computer language and human (natural language). The earliest research in NLP is
    generally considered to have started in the 1950s where the so-called Turing test
    was introduced, proposing a test in machine intelligence which to this day is
    widely known. The Turing test, developed by Alan Turing in 1950, is a test of
    a machine’s ability to possess indistinguishable human behavior and to appear
    to have human-like intelligence and interaction. The test is based on a machine’s
    ability to analyze, process, and contribute in an interaction based in a human
    language [43].


    Up until the 1980s, as in Figure 5.1, the area of NLP relied on sets of complex
    hand-written rules in order to execute decision-making. In the late 1980s, however,
    probabilistic models were introduced with machine learning algorithms, often based
    on decision trees or hidden Markov models [44]. These models required a higher
    amount of computational power which were not available until then. Today, computers
    have orders of magnitudes stronger computing power with more and more natural
    language data being accumulated over time, especially with the global usage of
    internet in recent years.


