    +   - **Conclusion:** By analyzing the two results, we realized that in the frequency
    domain the detection accuracy was clearly better than in the time domain. This
    led us to choose the frequency-domain architecture. It should be mentioned, however,
    that the architecture based on one learning SNR step will remain blind to the
    data of the other steps. But what makes it powerful is that it gives a very good
    accuracy on the test data of its learning step.


    At the end of all the results, in this section we will make a comparison of the
    best results obtained in the two domains in order to decide which one is best
    placed within the framework of the objective of our present study.


    # 11.11.6 Comparative Table of the Different Algorithms Developed in Time and
    Frequency


    The data below are taken from previous calculations and have been reported here
    in order to choose the algorithm that until then would be best suited to achieve
    the goal: that of having a real-time system with a very good accuracy in terms
    of detection of electromechanical defaults.


    The precision of the ESPRIT_TLS algorithm is calculated by the following formula:


    accuray = (1 − (n − n_es)/n) × 100%  (30)'
