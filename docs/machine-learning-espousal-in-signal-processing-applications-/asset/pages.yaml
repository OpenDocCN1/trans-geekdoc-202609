    In the current scenario, there has been an exciting move from the analog model
    to a sequence of discrete values, which has led to a major paradigm shift in digital
    signal processing. When compared to the traditional analog model, discrete models
    are simple and easy to use in terms of computational efforts. For example, if
    we want to find the average speed between two points using the analog model, the
    computation involves using calculus to determine the integral of the speed function
    x(t) and then dividing it by the interval length. Conversely, if discrete speed
    measurements are used, the average can be easily obtained by dividing the sum
    of discrete values by the number of samples. The signals are processed in batches
    or samples, reducing the complexity and processing time, and discrete data storage
    is less complicated. Moreover, the noise levels can also be controlled effectively
    using digital signals. To summarize, the advantages of using the discrete model
    include the following: (i) easy storage of data, (ii) processing does not depend
    on the nature of the signal, and (iii) effective transmission with minimal noise.


    # 1.2.1.2 Sampling and Quantization


    Digital signals have two components: time and amplitude, and each sample can take
    values from a predetermined set of integers. Digitization is a two-step process
    and includes two distinct operations: sampling and quantization. Initially, through
    sampling, the analog signal s[t] is converted to a discrete signal s[n], and the
    signal is sampled at regular time intervals nT, where n is the number of samples,
    and T is the sampling period (seconds) as represented in Equation (1.3). However,
    through the process of sampling, the analog signal is transformed into a discrete
    time signal s(nT) with continuous amplitude value [14].


    $$s[n] = s(nT) \tag{1.3}$$


    Since the sampled signal includes a continuous amplitude value, it is not yet
    a completely digital signal. So, there is a need for it to go through the process
    of quantization where the continuous amplitude is quantized by assigning a discrete
    number to represent its value for each sample. So, to summarize, a discrete time
    signal quantizes time as well as signal amplitude. An ideal sampler can be compared
    to a simple switch that turns ON and OFF every T seconds, and the period of sampling
    is given by Equation (1.4).


    $$T = \frac{1}{f_s} \tag{1.4}$$'
