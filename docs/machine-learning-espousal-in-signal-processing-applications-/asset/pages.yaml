    # 11.9 MOS (Order Selection Model)


    When recording a stator signal coming from an electric induction machine prey
    to a fault and operating in a more or less noisy environment, we find ourselves
    with a signal in the frequency domain composed of several harmonics not all of
    which are not explanatory of the fault or do not translate the real number of
    harmonics constituting the signal [16,17]. When we want to evaluate it, we use
    MOS.


    MOS understood by model order selection is an important and fundamental problem
    in a variety of signal processing applications [18]. For example, the determination
    of the number of coefficients in a linear regression model [19], the selection
    of the order in the time series analysis [20], the detection of the number of
    clusters in the n-way probabilistic classification [20], the decision dimensionality
    for Principal Component Analysis (PCA) for the reduction of the dimension [21],
    and the choice of the number of sources in a linear transformation model for separating
    the signal and noise subspaces [22]. In general, the model order selection methods
    can be derived from the criteria of information theory [16], Bayesian estimation
    [21], and based on the deviation in an ordered sequence of parameters [22].


    # 11.9.1 Principle


    They all estimate the number of harmonics in the signal using the eigenvalues
    of the signal covariance matrix. If X is the recorded signal of the electric induction
    machine affected by the fault, then its covariance matrix is:


    $$R_x = \frac{\sum_{n=1}^{M} X(n) X(n)^T}{M}\tag{11.6}$$


    where

    M is the number of samples collected.'
