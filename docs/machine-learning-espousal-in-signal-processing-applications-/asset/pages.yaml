  md: '# 8.5.4.3 Effect of Time-Varying Channel


    The transfer function of the channel in Equation (8.43) can be represented as
    H(z)= h1 + h2 z⁻¹ + h3 z⁻² for a given value of Λ. If we assume the channel to
    be time-varying with channel coefficients h_i(n), the linear part of the channel
    is given as follows (Zhao et al. 2011):


    H_n(z)=h₁(n)+h₂(n)z⁻¹+h₃(n)z⁻² (8.44)


    Time variation in channel filter coefficients is generated as h_i(n)=h_i + f_LPF
    (ρw(n)), where f_LPF is low-pass filter (LPF) with a normalized cutoff frequency
    of 0.1. w(n) is white Gaussian noise, and its standard deviation ρ is taken to
    be 0.1. Simulation results in Figure 8.11 show that the performance of the proposed
    equalizer is worse compared to the FIR DFE equalizer for lower EVR values, but
    for EVR higher than 400, the proposed technique exhibits significantly improved
    BER performance. BER performances of all other equalizers are far inferior compared
    to the proposed equalizer.


    # 8.5.4.4 BER Performance Evaluation


    We now evaluate the BER performance of the proposed equalizer for different values
    of SNR and compare it with the FIR DFE algorithm. Figure 8.12 shows the comparison
    when symbols are transmitted over linear channels Ch 1 or Ch 2 with receiver SNR
    variation from 0 to 20 dB. It can be observed that the proposed equalizer results
    in lower BER compared to the FIR DFE technique. At SNR of 20 dB, the proposed
    technique achieves a BER of 10⁻⁶ and 6×10⁻⁵ with Ch 1 and Ch 2, respectively.
    For higher values of SNR (> 20 dB), it hits error floor and there is no significant
    increase in performance. BER plots are compared in Figure 8.13 when the transmitted
    signal is passed through a cascade of channel Ch 1 and either of the nonlinear
    functions. In this scenario also, we find that the proposed equalizer performs
    significantly better than the FIR DFE technique.


