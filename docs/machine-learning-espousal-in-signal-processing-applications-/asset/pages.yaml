  md: '# 8.2 System Model


    # 8.2.1 Channel Equalization


    The system model for the proposed equalizer is shown in Fig. 8.1. In it, the channel
    is modeled as FIR filter with impulse response **h** = [h₁...hᵢ..., h_Nh], where
    N_h is the length of the response. The impulse response **h** reflects the combined
    effect of channel response, transmit, and receive filters. In this work, we consider
    baseband equivalent model, and the channel is excited by binary phase shift keying
    (BPSK) symbols u(n) ∈ {+1, −1} at time n. The output of the channel in response
    to input u(n) is


    v(n) = Σ_{i=1}^{N_h} h_i u(n−i)  (8.1)


    While going through power amplifier stage of the transmitter, nonlinear effects
    are introduced into the signal in the form of function Φ(.). Signal received is
    further corrupted by additive white Gaussian noise w(n) of mean E[w(n)] = 0 and
    variance σ². Thus, input to the adaptive equalizer is given as


    x(n) = Φ(v(n)) + w(n),  n = 1, ..., N  (8.2)


    where


    N is the number of received symbols.


    The purpose of the equalization is to mitigate the ISI effects caused by the FIR
    channel as well as neutralize the nonlinear distortions caused by the transmit/receive
    hardware. It is to be noted that in a typical communication receiver, equalizer
    operates in baseband and is placed after matched filter cum sampler stage. Equalizer
    reconstructs the transmitted sequence u(n) or its delayed version y(n) = u(n−d),
    where d is the propagation delay. An equalizer is trained with pair of training
    dataset {x(n), y(n)}, n = 1, ..., N, with the objective to minimize the expected
    value of squared error E[e²(n)] = E[(ŷ(n)−y(n))²], where ŷ(n) is the actual output
    of the equalizer corresponding to the input x(n). After training is completed,
    the weights are frozen, and subsequent symbols are detected based on these weights.
    The last stage consists of decision device which maps the continuous signal to
    discrete symbol set (Figure 8.1). For BPSK transmission, the output of the decision
    device is given as


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_204_0.png)


    FIGURE 8.1

    Transmitter and receiver system consisting of an equalizer in a wireless communication
    setup.'
