    # FIGURE 12.2


    CNN architecture for TSC with three convolutional layers.


    is implemented with a multilayer perceptron (MLP). The original time series, after
    several convolutional and pooling operations, are converted into a series of feature
    maps. The feature maps are flattened into the column vector, which is given as
    an input to multilayer perceptron. The output of the MLP has the number of neurons
    that is equal to the number of possible classes of time series. Figure 12.2 illustrates
    convolutional network architecture for TSC with three convolutional layers.


    ii. Inception Time: Inception network is a deep convolutional network. In the
    inception network, the convolutional and pooling layers are replaced with inception
    modules. Inception modules in the CNN perform more computation more efficiently
    via dimensionality reduction with stacked 1×1 convolutions. It solves the problem
    of computational expense, overfitting, and other issues. The inception module
    learns from the same input data through multiple kernel size filters parallel
    rather than stacking them sequentially. For example, inception performs 1×1, 3×3
    and 5×5 and more convolutional transformation and some pooling in parallel. It
    then stacks all the outputs of the transformation and allows the model to choose
    information from it.


    The inception module consists of four layers. The first layer reduces the dimensionality
    of the input data, which reduces the computational cost and number of features.
    It also speeds up the training process. The second layer is the set of parallel
    convolutional layers of different sizes, such as 1×1, 3×3, 5×5, etc., which act
    on the same input feature map. The third layer is the max pooling layer. Finally,
    the last layer is the concatenation layer, which concatenates the parallel convolutional
    and Max pooling output to form the output multivariate time series of the inception
    module.'
