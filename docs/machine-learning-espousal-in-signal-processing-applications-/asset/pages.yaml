    # 9.1 Introduction


    In computer vision, video surveillance is the emerging research area for the academicians,
    researchers, and industrialists. In recent days, the video surveillance system
    has become most popular and widely used in almost all places which in turn produces
    a huge amount of data from all the needed surveillance places. Therefore, it is
    highly essential to utilize a powerful computational tool for processing huge
    data in less time. It is also important to know the activities happening in different
    scenarios like identifying a movement of person in the screen, observing traffic
    in highways, monitoring the activities in offices, pedestrian detection in walking
    areas, monitoring gaming activities, and also monitoring people in shopping malls,
    hospitals, tourism locations, and parking places to prevent and reduce the chances
    of unusual or criminal activities. The video surveillance system is also playing
    a prominent role as evidence in identifying the criminals in shopping locations
    at crime scenes, hit and run accidents, etc.


    The video surveillance system needs various tools to identify the people, objects,
    unusual activities, etc. For these tools, to find the given activities accurately,
    highly sophisticated and sensible models have to be developed. In video surveillance
    applications, manually observing the activities in video recordings takes more
    time to identify the object, motion and places, and events happening in various
    situations..


    In recent days, the video surveillance system is used in many application areas
    such as academic institutions, government organizations, private sector companies,
    industries, hospitals, public areas, highway transportation system, automatic
    teller machines, medical imaging, and shopping malls. In these application areas,
    all the needful activities are recorded by using surveillance cameras. Patel et
    al. [1] proposed a Kafka-based model for fast live video streaming and also AWS
    S3 for distributed storage to accommodate a huge set of video frames. In this
    chapter, the proposed deep learning models are accurately performed in image classification
    using lightweight deep convolutional neural networks (LW-DCNN) model and unified
    model-based moving object detection.'
