  md: 'Now, the coefficients are estimated using this modified loss function.


    In the above equation, you may have noticed the parameter α (alpha) along with
    shrinkage quantity. This is called a tuning parameter that decides how much we
    want to penalize our model. In other terms, tuning parameter balances the amount
    of emphasis given to minimizing RSS vs. minimizing the sum of the square of coefficients.


    Let’s see how the value of α alpha affects the estimates produced by ridge regression.


    When α=0, the penalty term has no effect. It means it returns the residual sum
    of the square as loss function which we choose initially, i.e., we will get the
    same coefficients as simple linear regression.


    When α=∞, the ridge regression coefficient will be zero because the modified loss
    function will ignore the core loss function and minimize coefficients square and
    eventually end up taking the parameter’s value as 0.


    When 0<α<∞, for simple linear regression, the ridge regression coefficient will
    be somewhere between 0 and 1.


    That’s the reason for selecting a good value of α (alpha) is critical. The coefficient
    methods produced by the ridge regression regularization technique are also known
    as the L2 norm.


    # 2.8.16 Lasso Regression (L1 Regularization)


    This regularization technique performs L1 regularization. It modifies the RSS
    by adding the penalty (shrinkage quantity) equivalent to the sum of the absolute
    value of coefficients.


    $$\sum_{i=1}^{m}\left(Y_i - W_0 - \sum_{i=1}^{n}W_i X_{ij}\right)^2 + \sum_{i=1}^{n}|W_i|
    = \text{RSS} + \sum_{i=1}^{n}|W_i|$$


    Now, the coefficients are estimated using this modified loss function.


    Lasso regression is different from ridge regression as it uses absolute coefficient
    values for normalization.


    As loss function only considers absolute coefficients (weights), the optimization
    algorithm will penalize high coefficients. This is known as the L1 norm.


