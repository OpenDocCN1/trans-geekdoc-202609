    X = [x₁, x₁, ..., xₘ]ᵀ  (11.18)


    is transformed to an intermediate vector of the hidden variables U by using the
    activation function.


    fⱼ: the output Uⱼ of the hidden layer j-th neurons is obtained as follows:


    Uⱼ = fⱼ( ∑ᵢ₌₁ᴹ Wᵢ,ⱼ¹ × xᵢ + bⱼ¹ )  (11.19)


