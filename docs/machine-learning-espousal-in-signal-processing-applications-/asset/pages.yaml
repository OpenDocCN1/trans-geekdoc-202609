    # 7.3 Nonlinear Adaptive Filters


    The implementation of optimum linear filters is purely based on the MSE criterion.
    The optimum Wiener filter, which is developed to get minimum MSE, and which is
    treated as a frame of reference for linear adaptive filters working in a stationary
    environment, considers until second order statistics of the input data stream
    but not higher. This is the major limitation due to which a linear adaptive filter
    can''t be used to extract useful information from input data stream in a nonstationary
    environment. In many signal processing applications, nonstationary processes are
    encountered quite often in practice. This limitation can be overcome by making
    the adaptive filter nonlinear to use in a nonstationary environment. Wiener filter
    is no longer a frame of reference, and mathematical analysis also gets complicated.
    Improved learning efficiency is the main advantage because of which nonlinear
    adaptive filters can be used in broad application areas.


