    # 8.5 Proposed WNN DFE Architecture


    # 8.5.1 Equalizer Architecture


    Block diagram of the proposed WNN DFE is shown in Fig. 8.6. The equalizer consists
    of three subsections: $N_{\psi}$ wavelet basis functions which map the input to
    vector $[\psi_1(\mathbf{x}),...,\psi_1(\mathbf{x})]$ a feedback finite impulse
    response (FIR) filter with coefficients $b_1,...,b_{N_B}$ and a feedforward FIR
    filter with coefficients $a_1,...,a_{N_I}$ connecting inputs to the output $\hat{y}(n)$.
    The input to the equalizer $\mathbf{x}(n)$ is composed of vector of length $N_I$,
    which is applied to $N_{\psi}$ wavelons or wavelet basis functions and feed-forward
    FIR filter. Input to the feedback filter part is delayed hard decision outputs
    $[\hat{u}(n-1),...,\hat{u}(n-N_B)]$ of the equalizer. Output $\hat{y}(n)$ is obtained
    by adding signals from these three subsections.


    $$\hat{y}(n)=\sum_{j=1}^{N_{\psi}}c_j\psi_j(\mathbf{x}(n))+\sum_{i=1}^{N_I}a_i
    x_i(n)+\sum_{k=1}^{N_B}b_k\hat{u}(n-k)+a_0\qquad(8.25)$$


    In Equation (8.25), $c_j$, $j=1,...,N_{\psi}$ are weights of the connections from
    the output of multidimensional wavelets $\psi_j(\mathbf{x}(n))$ to the output
    adder. For binary transmission, the estimate of transmitted symbol is obtained
    at the receiver as (Figure 8.6)


    $$\hat{u}(n)=\text{sign}\{\hat{y}(n)\}\qquad(8.26)$$


    where

    sign{$\hat{y}$} returns the sign of $\hat{y}$.'
