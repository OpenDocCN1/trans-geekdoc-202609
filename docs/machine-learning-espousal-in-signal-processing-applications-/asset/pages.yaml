    # 1.2 Basic Terminologies


    It is important to know some of the core concepts before we deep dive into the
    advanced concepts of signal processing, machine learning, and SPML. In this section,
    we will go over some of the basic terminologies related to signal processing and
    machine learning.


    # 1.2.1 Signal Processing


    # 1.2.1.1 Continuous and Discrete Signals


    A signal is generally defined as a physical magnitude that changes with time [14],
    and examples include light, audio, images, and videos that are captured by sensors
    or measurement systems. It is a quantity that conveys information with respect
    to time. For example, a sound signal conveys information about the changes in
    air pressure over time.


    A signal is classified according to whether it is continuous in time or discrete.
    Figure 1.1a and b represents the two different types. Continuous time signals
    have values for all points in time, and real-world signals are mostly continuous
    with time that varies from −∞ to +∞.


    A general representation of a one-dimensional continuous-time signal x[t] is given
    by Equation (1.1). As indicated, the signal x[t] may be a complex (C) or real-valued
    (R) function of time, and t ∈ R, e.g., continuous time.


    ```

    x[t]: R → ℂ or x[t]: R → ℝ

    (1.1)

    ```


    A discrete time signal is represented by a sequence of numbers [14] denoted as
    x[n] and n ∈ Z where Z is a set of integers. A general representation of a discrete
    time signal is given in Equation (1.2).


    ```

    x[n]: Z → ℂ or x[n]: Z → ℝ

    (1.2)

    ```


    ![](img/fd1f01f43f88aeb77031cd9d187a2e8d_17_0.png)


    FIGURE 1.1

    Representation of signal types: (a) continuous; (b) discrete.'
