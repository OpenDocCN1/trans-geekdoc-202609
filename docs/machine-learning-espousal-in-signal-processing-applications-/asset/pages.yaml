  md: '# 7.7.1.1 Methodology


    The block diagram in Figure 7.16 explains the overall methodology for detection
    and classification of arrhythmias. The overall block diagram shown in Figure 7.16
    consists of signal preprocessing, QRS peak detection, feature extraction, and
    ANN signal classification blocks.


    Different ECG signals with different abnormalities are recorded. In signal preprocessing,
    the ECG signal is usually filtered to remove noise, and the signal is presented
    to the QRS detection block. The second step is QRS detection which corresponds
    to the period of ventricular contraction or depolarization which is done for determining
    the heart rate. The third step is to find the smallest set of features by processing
    the ECG signal that facilitate in maximizing the performance of the classification
    step. The last step is classification, and MLP neural network is known to be the
    best for this classification. Each ECG waveform can be either used as a training
    set or data set. First, a set of ECG signals with known abnormalities are used
    for training the NN. Then, the data set is presented to the NN to find the abnormality
    present in ECG signal based on feature extraction and classification.


    # 7.7.2 Speech Recognition


    Speech is the most efficient way of communication used by human beings. This,
    being the best mode of communication, could also be used as a protocol to interact
    with high-end machines. Therefore, the popularity of automatic speech recognition
    systems has been greatly increased. Hidden Markov model (HMM), dynamic time warping
    (DTW), vector quantization (VQ), etc. are different approaches to speech recognition.
    This section provides an insight about the use of ANN in speech recognition [20–24]
    (Figure 7.17).


    # 7.7.2.1 Methodology


    Speech is a vocalized form of human interactions. Often, background noise or room
    reverberation sounds will get added to speech which makes it noisy. Noise may
    get added to speech even during transmission through noisy channels. Therefore,
    we go for speech preprocessing. This plays an important role in eliminating noise
    from speech signal to improve efficiency and accuracy of speech recognition. The
    speech preprocessing step generally involves processes like noise filtering, smoothing,
    framing, windowing, reverberation cancelling and echo removing, etc. Theoretically,
    a system should be able to recognize speech from the digitized waveform. But due
    to large variations in speech signal, there is a need to extract useful features
    to reduce those variations. Mel frequency cepstrum coefficient (MFCC) is the most
    prominent method used in the process of feature extraction in speech recognition.
    A tool which is most widely used for medium or low bit rate coder is linear predictive
    coding (LPC).


