  md: '# 9.1.1 Deep Learning


    Profound learning is at the cutting edge of what machines can do. Deep learning
    is a subset of AI that dominates in perceiving objects in pictures as it’s actualized
    utilizing at least three layers of counterfeit neural organizations where each
    layer is answerable for extricating at least one component of the picture. Late
    advances in profound learning made errands, for example, image and discourse acknowledgment,
    conceivable. Deep learning allows machines to solve complex problems even when
    using a dataset that is very diverse, unstructured, and inter-connected. The deeper
    learning algorithms learn the better they perform. It also powers some of the
    most interesting applications in the world, like autonomous vehicles and real-time
    translation. Deep learning models are more useful in data analytics. Kumari et
    al. [2] presented deep learning based data analytics framework which obtains the
    best results with less computation time. In recent days, deep learning models
    are popular and also achieve great power and flexibility by learning to represent
    the world as nested hierarchy of concepts, and each concept is related to a simple
    concept. The major difference between deep learning and machine learning is that
    the performance of deep learning increases as the scale of data increases. Deep
    learning algorithms work efficiently even on large amount of data. Deep learning
    algorithms try to learn high-level features from data, which reduces the task
    of developing feature extractor for new problems. In this chapter, the proposed
    customized deep learning model accurately detected moving objects in the agricultural
    domain.


    # 9.1.2 Deep Learning – Past, Present, and Future


    Through deep learning usage of techniques and algorithms, a model can learn from
    data in multiple levels of abstraction and representation. Mainly, deep learning
    (DL) algorithms outperform in various application areas. DL is a class of machine
    learning techniques and base on artificial neural networks. DL algorithms process
    data by using various numbers of layers. The first and last layer of the network
    layer are called input layer and out layer. The in-between layers are called hidden
    layers. Mainly, deep learning concepts are not new; they are revealed from the
    developments of huge dataset availability, new algorithms, and high computation
    power. McCulloch and Walter [3] proposed a neural network model where every neuron
    is postulated as being in binary state, which is in on or off condition in an
    initial stage of deep learning evolution. Rosenblatt [4] proposed a concept of
    perceptron which learns from data as similar to biological neurons. Hubel and
    Weisel [5] implemented receptive field-based neurons for detection of local features
    for a cat’s visual system. Fukushima [6] proposed convolutional neural network
    for recognition of visual patterns for resembles the organization of animal visual
    cortex. Lecun [7] developed convolutional neural network-based backpropagation
    for zip code recognition. Later, Lecun [8] implemented LeNet for document recognition
    for gradient-based learning. Deep convolutional neural network (DCNN) is a base
    model for various applications like image classification, object detection, tracking,
    etc.


    Hinton [9] proposed a method which converted high dimensional data to low dimensional
    code with multilayer network for reduction of dimensionality of data. Mainly,
    they have used restricted Boltzmann machines instead of random weight initialization.
    Alex and Stskever [10] developed deep convolutional neural networks for ImageNet
    classification on 1,000 different classes. In older days, region-based convolutional
    neural networks (RCNNs) are used for object classification and detection. From
    last four years usage of you only look once (yolo) method and single shot detectors
    for localization detection of'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'objects with bounding boxes. From past 50 years handling huge data and the
    find the hidden patterns from underlying layers is a challenging task. From the
    twenty-first century, the current research majorly focused on deep learning to
    resolve this issue. The focused applications are object detection, social media
    analytics, spam detection, etc.


    In a few years, deep learning will become a part of many software applications
    to embed the capabilities into devices which improves customer experience. These
    deep learning-based systems are very useful in understanding and processing simple
    human languages using natural language processing.


    # 9.1.3 Recent Methodologies


    Mohanty et al. [11] proposed convolution neural network on plant village dataset.
    This method obtained an accuracy of 85.3%. This method obtained more time to train
    the data and also constrained to the classification of single leaves on a homogeneous
    background. When they tested on a set of images which has taken under various
    conditions which they used for training, then automatically the model accuracy
    substantially reduced. Fuentes et al. [12] used combined meta-architectures like
    R-CNN and SSD with deep feature extractors. Here, the challenged part of this
    approach is to consider a small set of samples in which some classes with high
    pattern variation tend to be confused with others, resulting in false positives
    or lower average precision. Ferentinos [13] proposed the CNN approach, the main
    drawback of which was that the entire photographic material included solely images
    in experimental setups but not in real conditions in the cultivation field. Another
    important issue that should be noted and should be resolved is that the tested
    dataset used for the assessment of the models and part of the same database that
    constituted the trainset. Bhatt et al. [14] applied a model which has been used
    small set of images to train and evaluate the models are with different resolutions
    like quality, focus and brightness as they are captured with mobile phones having
    different cameras through a participatory sensing approach. They used the application
    of single shot detection in tea leaves that helps in reduced detection time of
    disease and pest through automation. From these results, it can also be realized
    that only classification cannot reliably help when there are occurrences of multiple
    pets and also disease conditions in a single image. Anandakrishnan and Hanson
    [15] proposed deep learning-based CNN approach with dataset images of apple leaf
