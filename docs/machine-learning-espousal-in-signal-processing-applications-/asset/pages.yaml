    \ transform is used to decompose a signal in the time domain into frequencies.\
    \ The analysis of signals is then performed using the calculated amplitude and\
    \ phase values which are used to classify the signals. Complex waveforms can be\
    \ replicated with a sum of varying amplitude sine waves. Any waveform can be transformed\
    \ into a sum of varying amplitude sine waves. The noise in the signal shows itself\
