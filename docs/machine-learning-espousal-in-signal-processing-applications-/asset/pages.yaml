    # 12.2 Digital Signal Processing Techniques for IoT Devices


    Signals can be in different forms such as audio signals, video signals, seismic
    data, radar signals, medical signals such as ECG, electroencephalograph (EEG),
    etc. The signal carries information within itself. For example, the picture contains
    information about the brightness of RGB across the two spatial domains, and radar
    signals carry information about the electromagnetic waves.


    The signals are broadly classified into two categories, such as continuous time-domain
    and discrete time-domain signals. The continuous time-domain signals, also known
    as analog signals, are continuous as they are present in each time step within
    their domain. In contrast, the discrete time-domain signals are discrete and defined
    in discrete time-steps. In general, most of the signals in nature are continuous
    signals such as human speech, electrical signals, etc. To analyze these signals
    in the computer, it needs to be digitized, i.e., it needs to convert into discrete
    signals.


    Recently, IoT devices are widely used in different applications ranging from predictive
    maintenance to user behavior monitoring. Signals from different devices can be
    sounds, vibrations, images or accelerometers, vibrators, or other kinds of sensor
    data needing richer analytics methods. Machine learning for sensors has become
    widely used to train machines to detect and classify events in real-time, even
    with noisy, high variation data.


    # 12.2.1 Fourier Transform


    Digital signal data are generally periodic signals representing some pattern and
    are captured at an equally spaced interval of time. The time it takes to repeat
    itself is called a period, and the distance it travels during this period is called
    the wavelength. Fourier analysis is widely used to analyze periodic signals. It
    can be used to decompose the signals into various periodic components. The complex
    signals can be decomposed into the sum of simpler signals, which are represented
    as trigonometric functions such as sine and cosine waves. Similarly, different
    signals can be combined to form a new signal that consists of all of its components.
    The signals in the time-domain can be transformed into frequency-domain using
    the mathematical function known as Fourier transform. The function that performs
    the opposite function is called the inverse Fourier transform.'
