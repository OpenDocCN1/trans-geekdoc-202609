    ## 综述文章

    ## 机器学习如何帮助解析分子电化学中的机理？

    Jingwen Sun¹ 和 Chong Liu¹,²


    ## 摘要

    电化学家长期致力于通过细致的目视检查启发式地分析电化学数据，并力求确定性地指认反应机理。我们认为机器学习（ML）提供了一种新的机理分析方法，具有高数据通量和最小的人工干预。在本文中，我们提出将
    ML 应用于电化学将能够在不可避免的机理模糊性中实现概率驱动的机理分析。我们将讨论 ML 在电分析中的部署实例，列出实验人员面临的当前挑战，并讨论 ML 在分子电分析中的前景。我们希望这样的讨论能够在长远中促进和推进电化学体系的
    ML 辅助机理解析。


    ## 地址

    ¹ 加州大学洛杉矶分校化学与生物化学系，美国洛杉矶，加州 90095

    ² 加州大学洛杉矶分校加州纳米系统研究所，美国洛杉矶，加州 90095


    通讯作者：Liu, Chong (chongliu@chem.ucla.edu)


    Current Opinion in Electrochemistry 2023, 39:101306

    本文来自 Organic and Molecular Electrochemistry (2023) 主题专刊。

    编辑：Cyrille Costentin

    有关该栏目的完整概览，请参阅 Organic and Molecular Electrochemistry (2023)

    可在线获取日期 2023 年 4 月 21 日

    https://doi.org/10.1016/j.coelec.2023.101306

    2451-9103/© 2023 Elsevier B.V. All rights reserved.


    ## 关键词

    分子电化学，机理模糊性，机器学习，信息丰富的数据集，概率驱动方法。


    ## 引言

    电化学机理分析的本质要求从有限的电化学数据集中提取合理的反应机理，同时尽可能最小化持续且不可避免的机理模糊性。正如 Feldberg 等人在 20 世纪 70
    年代对循环伏安法的案例所说明的那样 [1]，机理模糊性指的是不同反应机理经常会

    收敛到相似的伏安图，在测量误差范围内无法区分，从而在存在竞争反应路径和多种可能解释时使确定性的机理指定变得不可行。这种机制与电化学数据之间这种满射关系不仅限于循环伏安法，而且几乎存在于所有电化学技术中，因为每种电化学表征实际上都是在有限时间分辨率下的电流和电压的扰动与检测。数十年来，多种电化学技术
    [2]，包括伏安法 [3,4]、计时安培法 [5] 以及包括电化学阻抗谱在内的交流法 [6,7]，已被用于机理分析。然而，确定性机理指定与电化学数据的机理模糊性之间的内在不相容性仍然未得到解决。这种不相容性会带来偏倚、误指或被忽视的机理发现风险。


    在这种背景下，我们认为机器学习（ML）辅助的分析将有利于分子电化学的机理研究，如果不是电化学的一般研究的话 [8]。将 ML 在模式识别和特征提取方面的知名专长视为电化学数据人工检查的补充甚至替代是合理的
    [10,11]。ML 算法中概率驱动分析的特性 [9] 为上述电化学中的机理模糊性提供了更令人满意的调和，可能基于有限的电化学数据和表征分辨率，为各种反应路径产生概率分布。最后但同样重要的是，基于
    ML 的分析算法的部署不仅预示着具有高数据通量的自动化电化学分析，而且还为多种电化学技术的同时数据分析提供了机会，这是人类由于数据的高维特性而无法实现的壮举。


    在这种前景鼓舞下，我们在此尝试回答一个问题：ML 如何以及在何种程度上可以帮助分子电化学中的机理分析？在以下三个相互关联的部分中，我们首先将讨论 ML 在机理检验中的概念验证应用；随后将指出几个可能受益于
    ML 辅助分析的电化学研究领域；最后，我们将提出关于如何更好地利用 ML 来理解所指出的领域的机理的看法。我们希望这些讨论，尽管并不旨在全面，仍能激励社区的研究人员更好地利用
    ML 并解决电化学中的长期挑战。


    已知、预先确定的 CE 机理包括在电子转移（E 步）之前发生的均相溶液反应（C 步）（图 1a）[14,15]。对循环伏安法的先验理解导致将算法输入指定为正向和反向扫描中峰值电流密度不同百分比下的电流密度（i）和电压（E）值。只要反应机理是预先确定且具有明确定义的动力学形式，基于
    ML 的算法似乎可以替代用于数值提取反应参数的有限差分方法 [16]。


    由于伏安图的目视检查确实包括图像识别和特征提取，深


