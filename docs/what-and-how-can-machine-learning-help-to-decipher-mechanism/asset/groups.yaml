    DNN 基于模拟伏安图进行训练，对分子电化学中的三种机理分类准确率约为 90%：单电子准可逆电荷转移（E 机理）、E 步随后是可逆 C 步的 EC 机理，以及具有两个连续
    E 步的 EE 机理 [8]。同一研究组的后续工作将该技术扩展到伏安图的三个连续循环，利用原本为彩色图像分析设计的 DNN 的三个 RGB（红、蓝、绿）输入通道
    [17]。这种开创性的基于 ML 的算法的输出是对反应机理的确定性分配。


    与其将像素化图像作为 ML 分析的数据输入，Liu 等人定义了一个三维张量 {v, i(E)}n 作为 ML 模型的输入，该输入数值上包含 i、E 和扫描速率（v）（图
    1c）[18]。据假设，这种信息丰富的数据格式比像素化图像更适合电化学分析，后者的空白区域包含的信息很少。张量数据格式可以容纳在各种扫描速率（v）下无限数量的伏安图，并且与当前的研究实践相兼容，即在动力学区域图的背景下通过比较不同
    v 值下伏安图的变化来提取机理信息 [8]。基于此类张量输入的残差神经网络（ResNet），使用多达六个不同 v 值下的伏安图进行训练并由模拟伏安图建立，对五种不同的分子机理的准确率达到
    98.5%（图 1c）。在每次分析中，ResNet 模型不仅研究机理，还会产生一个“注意力”图，说明伏安图轨迹的哪一部分在得出结论时权重更大。此处的另一个特点是，产生的输出不仅仅是二分分类，而是一个定量倾向分布，作为对所考虑的每种机理的统计概率的替代。虽然这种倾向分布尚未通过严格的测试/验证与统计概率分布相关联，但所展示的分析伏安图并提供反应机理相对可能性的能力与分子电化学中遇到的机理模糊性本质相符。


    ## ML 辅助机理分析的发展潜力领域


    上述示例展示了一些令人鼓舞的能力，ML 有可能为机理分析做出贡献。因此，问题在于电分析的哪个领域可能需要此类 ML 赋能能力。下面，我们列出并评论了手动分析在多种电化学方法中遇到的一些经验性挑战
    [8,19]，以及我们对概率驱动的基于 ML 的分析可能带来的益处的看法。


    循环伏安法几十年来一直是机理分析的必备技术 [8,19]；然而，分析和定量机理研究仍至少有一个可以改进的潜在方向（图 2a）。传统上，在进行进一步的数值模拟和数据拟合之前，必须先确定性地决定单一假设机理，尽管可能存在竞争机理共存，或在测量和统计不确定性范围内存在针对同一数据的多种机理解释。因此，手动的、确定性的伏安图分析方法与上述机理模糊性并不完全兼容
    [1]，尤其是在存在多个竞争机理时。在初步目视检查伏安图后，在没有先验知识的情况下，在此类场景中破译机理的典型迭代流程包括启发式地假设特定的 E 和/或 C
    步机理，用所提议的机理对实验伏安图进行数值拟合，进行目视比较以检查拟合是否令人满意，以及决策是否需要用修订后的拟议机理再次尝试 [20]。此类协议的性质在很大程度上依赖于研究人员的训练，以便全面考虑所有可能的机理变化，并且隐含地偏向于反对多个竞争途径共存。一个经典的例子体现了此类方法带来的挑战，即分子电化学中净两电子过程中
    ECE（两个 E 步由不可逆速率限制 C 步连接，第二 E 步在热力学上比第一步更容易）和 DISP（E 步随后是不可逆 C 步，C 步产物发生歧化反应）机理的共存和竞争
    [8]。已有大量文献示例 [21,22] 说明了以确定性方式区分这两条途径的困难。由于最近报道的 ResNet 模型能够分析伏安图并给出包括 ECE 和 DISP
    在内的机理倾向分布（图 1c）[18]，似乎 ML 可以通过两种不同的方法改善分子电化学中的机理分析：（1）ML 模型可以为每个考虑的机理提供估计的可能性，并指导上述现有迭代流程中拟议机理的选择；（2）ML
    可以建立机理分析的独立替代途径，包括由 ResNet 启用的机理概率分布报告 [18] 以及与上述示例类似的 ML 启用的反应参数值测定（图 1a）[14,15]。值得注意的是，后一种方法不仅产生一种更适合电化学固有机理模糊性的基于概率的分析，而且还表现出足够的统计复杂性，暗示了所生成分析的不确定性，这是当前研究中缺失的特征。


