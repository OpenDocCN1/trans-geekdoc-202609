    基于概率的、全面且人为偏差最小的反应路径理解，同时也使这种深入的机理分析对更广泛的研究社区更易于获取。尽管机器学习模型本身并不免疫于偏差，提醒社区注意这一问题是值得的，在机器学习模型开发过程中引入额外偏差的潜在风险应通过仔细准备训练数据集、适当的正则化技术以及监控模型性能来缓解。由于分子电化学中机理分析的专家培训有时可能有些要求较高
    [19]，用户友好的机器学习辅助协议将极大地促进我们对电极-溶液界面化学的理解。


    ## 在分子电化学中部署机器学习的建议


    受上述讨论的启发；在此，我们提出一些要点信息和建议，以解决长期存在的机理模糊性问题，并推动分子电化学领域的发展，以便更广泛地利用机理研究。


    - (a) 在机理研究中采用概率方法。 如上所述，电化学中机理模糊性的存在需要一种目前仍未充分发展的概率驱动分析。我们最近的工作 [18] 证明了同时考虑多种可能机理并将机理模糊性作为概率分布来处理的可行性。事实上，我们主张在分子电化学中更广泛地利用机器学习的主要原因之一是深度学习模型中概率方法的广泛采用
    [25,26]，这将改变我们分析电化学的方式。


    - (b) 采用机器学习友好的电化学数据结构。 现有的电化学表征方法产生的数据结构大多适用于生成人类能够分析的二维图。由于机器学习模型能够很好地接收高维数据输入，机器学习辅助分析的广泛采用应鼓励使用信息丰富的高维数据结构，例如在近期示例
    [11,17,18] 中用张量输入代替像素化图像，这些结构不仅涵盖单一电化学表征，还涵盖多种表征方法以进行同时分析。然而，这里有一个需要注意的问题是，数据结构应针对所需应用的具体情况量身定制，并避免过度的数据插值，以减轻不必要的误解和分析准确性的损失。


    - (c) 注意由模拟数据训练的机器学习模型的限制。 尽管现有的机器学习模型是使用模拟电化学数据进行训练和开发的，但必须认识到这些机器学习模型仅限于训练集；因此，在建立模拟训练数据期间部署的参数边界和范围。关于机器学习分析适用性和有效性的任何讨论都应考虑这种潜在的局限性。此外，期望并关键的是用实验数据训练/完善所开发的机器学习模型，以便适应电化学测试中的实际因素，例如未补偿电阻和电容，并减轻潜在的错误分配。


    - (d) 促进机器学习辅助分析的可解释性。 机器学习研究的常见批评是其“黑箱”性质以及机器学习算法缺乏可解释性。为了应对这一缺陷并促进可信度，电化学中机器学习辅助分析的开发应考虑产生输出，例如我们在最近的工作
    [18] 中的“注意力”图，以获得更大的模型可解释性。更可解释的机器学习辅助分析不仅有助于检测和减轻偏差，还能证明所开发机器学习模型的有效性，并提示可能逃避人类检查的隐藏数据特征，从而丰富我们对电化学表征的基本理解。


    - (e) 更广泛的多学科合作。 随着我们开发由机器学习辅助的概率驱动电化学分析，电化学家、统计学家和计算机科学家之间的合作将不可避免且必不可少。我们设想分子电化学的更大进步源于对电化学积累见解之美、统计解释的严谨性以及机器学习架构中迷人设计之间的协同作用。


    - (f) 一个开放且易于获取的社区。 鉴于分子电化学的广泛范围，设想的进步只能在开放的研究社区中实现。机器学习模型的发展、测试和验证依赖于对电化学机理的丰富理解以及研究人员提供的模拟和实验数据。与此同时，针对电化学研究量身定制的开放获取机器学习模型将拓宽机器学习辅助分析的采用，促进电化学中的其他研究主题，并帮助教育精通编程、机器学习和统计分析的下一代研究人员。整个社区的集体努力将决定机器学习在电化学中采用的未来。


