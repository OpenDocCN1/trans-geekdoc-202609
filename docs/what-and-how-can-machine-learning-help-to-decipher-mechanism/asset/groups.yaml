  - '[PAGE 2]


    neural networks (DNNs) have been developed by Bond and coworkers to analyze individual
    cyclic voltammogram for mechanistic categorization [11]. In this analysis, a single
    cyclic of voltammogram was analyzed as gray-scale image (Figure 1b), and a DNN
    was trained based on simulated voltammograms with about 90% accuracy for the classification
    of three mechanisms in molecular electrochemistry: a single-electron quasi-reversible
    charge transfer (E mechanism), a EC mechanism in which the E step is followed
    by a reversible C step, and a EE mechanism with two consecutive E steps [8]. A
    follow-up work from the same group expands the technique to three consecutive
    cycles of voltammograms, taking advantage of the three RGB (red, blue, green)
    input channels for the DNN originally designed for the analysis of colored images
    [17]. The output of such a pioneering ML-based algorithm is a deterministic assignment
    of reaction mechanism.


    Instead of deploying pixelated images as the data input for ML analysis, Liu and
    coworkers defined a three-dimensional tensor {v, i(E)}n as ML model''s input that
    numerically includes i, E, and scan rate (v) (Figure 1c) [18]. It is hypothesized
    that such information-rich data format is more suitable for electrochemical analysis
    in comparison with the pixelated images whose white space contains little information.
    The tensor data format can accommodate infinite number of voltammograms at various
    scan rates (v), and it is compatible with the current research practice that mechanistic
    information is extracted by comparing the evolution of voltammograms at different
    v values in the context of the kinetic zone diagram [8]. A residual neural network
    (ResNet) based on such a tenor input with up to six voltammograms under different
    v values is trained and established by simulated voltammograms, yielding an accuracy
    of 98.5% for five different molecular mechanisms (Figure 1c). In each analysis,
    the ResNet model not only studies the mechanism but also yields an “attention”
    plot illustrating which part of the voltammogram traces weights more in order
    to draw a conclusion. One feature here is that the yielded output is not merely
    a dichotomic classification, yet a quantitative distribution of propensity as
    a surrogate of statistical probability toward each of the considered mechanisms.
    While such propensity distribution has yet to be correlated to the distribution
    statistical probabilities with rigorous testing/validation, the demonstrated capability
    of analyzing voltammograms and delivering the comparative likelihood of reaction
    mechanisms is commensurate with the nature of mechanistic ambiguity encountered
    in molecular electrochemistry.


    # Potential areas of development of ML-assisted mechanistic analysis


    The above examples demonstrated some encouraging capabilities that ML can potentially
    contribute toward mechanistic analysis. Thus, the questions


    come to which area of electroanalysis might need such ML-enabled capabilities.
    Below, we list and comment on some of the empirical challenges that the manual
    analysis has encountered for a variety of electrochemical methods [8,19], along
    with our thoughts on what a probability-driven ML-based analysis may offer.


    Cyclic voltammetry has been the bread-and-butter technique for mechanistic analysis
    for decades [8,19]; yet, there remains at least one potential direction that the
    analysis and quantitative mechanistic studies can be improved (Figure 2a). Conventionally,
    a single hypothesized mechanism has to be deterministically decided before further
    numerical simulation and data fitting, despite the possible coexistence of competing
    mechanisms or the possible presence of multiple mechanistic explanations toward
    the same data within measurement and statistical uncertainties. Hence, the manual,
    deterministic approach of voltammogram analysis is not fully compatible with the
    aforementioned mechanistic ambiguity [1], especially when multiple competing mechanisms
    are present. After initial visual voltammogram inspection, a typical iterative
    routine of deciphering mechanisms in such scenarios without a priori knowledge
    includes heuristically hypothesizing a specific mechanism of E and/or C steps,
    numerically fitting the experimental voltammograms with the proposed mechanism,
    visual comparison to check if the fitting is satisfactory, and decision-making
    about whether another attempt with a revised proposed mechanism is necessary [20].
    The nature of such protocol relies strongly on researcher''s training in order
    to comprehensively consider all possible mechanistic variations and implicitly
    biases against the co-existence of multiple competing pathways. One classic example
    that epitomizes the challenges from such a methodology is the coexistence and
    competition between ECE (two E steps connected by an irreversible rate-limiting
    C step with the second E step being more thermodynamically facile than the first
    one) and DISP (the E step is followed by an irreversible C step with the product
    from the C step undergoing an disproportionation reaction) mechanisms for a net
    two-electron process in molecular electrochemistry [8]. There have been plentiful
    literature examples [21,22] to illustrate the difficulty of disentangling those
    two pathways in a deterministic manner. As the recently reported ResNet model
    is capable of analyzing voltammograms and yielding the propensity distribution
    of mechanisms including the ECE and DISP ones (Figure 1c) [18], it seems feasible
