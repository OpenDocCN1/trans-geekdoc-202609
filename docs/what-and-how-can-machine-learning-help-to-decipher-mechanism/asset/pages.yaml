    regularization techniques, and monitoring of model performance. As expert training
    for mechanistic analysis in molecular electrochemistry could be sometimes a bit
    demanding [19], a user-friendly ML-aided protocol will greatly facilitate our
    understanding of chemistry at the electrode-solution interface.


    # Suggestions for deploying ML in molecular electrochemistry


    Intrigued by our own discussions shown above; here, we present some take-home
    messages and suggestions in the context of addressing the long-standing issue
    of mechanistic ambiguity and advancing the field of molecular electrochemistry
    for a wider utilization of mechanistic investigation.


    (a) Accommodate a probabilistic approach in mechanistic studies. As discussed
    above, the existence of mechanism ambiguity in electrochemistry necessitates a
    probability-driven analysis that currently is underdeveloped. Our recent work
    [18] demonstrates the possibility of simultaneously considering multiple possible
    mechanisms and accounting for the mechanism ambiguity as a distribution of probabilities.
    Indeed, one of the main reasons that we advocate for a broader utility of ML in
    molecular electrochemistry is the wide adoption of probabilistic methods in deep
    learning models [25,26] that will transform how we analyze electrochemistry.


    (b) Adopt ML-friendly electrochemical data structures. The existing data structures
    from electrochemical characterization methods are mostly suited for the generation
    of two-dimensional plots that humans are capable of analyzing. As ML models are
    well capable of receiving high-dimensional data inputs, a wide adoption of ML-aided
    analysis should encourage the use of information-rich high-dimensional data structures,
    such as tensor inputs in lieu of pixelated images in recent examples [11,17,18]
    that encompass not only a single electrochemical characterization but also multiple
    cauterization methods for simultaneous analysis. Yet, one caveat here is that
    the data structure should cater to the specifics in the desired application and
    avoid excessive data interpolation in order to mitigate the undesired misinterpretation
    and loss of analysis accuracy.


    (c) Be aware of the constraints from ML models trained by simulated data. While
    existing ML models are


    trained and developed with simulated electrochemical data, it is important to
    acknowledge that those ML models are limited to training set; hence, the boundaries
    and ranges of parameters deployed during the establishment of simulated training
    data. Any discussion regarding the applicability and validity of ML-based analysis
    should consider such a potential limitation. Moreover, it is desirable and critical
    to train/refine the developed ML models with experimental ones in order to accommodate
    practical factors in electrochemical testing, such as uncompensated resistance
    and capacitance and mitigate potential missassignments.


    (d) Promote interpretability in ML-aided analysis. One common criticism to ML-based
    research is the “black box” nature and the lack of interpretability for ML algorithms.
    To counter such a caveat and promote trustworthiness, the development of ML-aided
    analysis in electrochemistry should consider yielding outputs, such as the “attention”
    plot in our recent work [18], for greater model interpretability. A more interpretable
    ML-aided analysis will not only help detect and mitigate bias but also justify
    the validity of the developed ML models, as well as suggest hidden data features
    that may have escaped human inspection, thus enriching our fundamental understanding
    about electrochemical characterizations.


    (e) Broader multidisciplinary collaborations. As we develop probability-driven
    electrochemical analysis aided by ML, collaborations among electrochemists, statisticians,
    and computer scientists will be inevitable and essential. We envision greater
    advances in molecular electrochemistry originated from the synergies among the
    beauty of accumulated insights into electrochemistry, the rigor of statistical
    interpretation, and the fascinating design in ML architectures.


    (f) An open community with great accessibility. Given the wide scope of molecular
    electrochemistry, the envisioned advance can only take place in an open research
    community. The development, testing, and validation of ML models rely on the rich
    understanding of electrochemical mechanisms and researchers’ provision of simulated
    and experimental data. Meanwhile, open-access ML models tailored to electrochemical
    research will broaden the adoption of ML-aided analysis, facilitate other research
    topics in electrochemistry, and help educate the next-generation researchers well
    versed in programming, ML, and statistical analysis. It is the collective efforts
    of the whole community that will dictate the future of ML adoption in electrochemistry.


