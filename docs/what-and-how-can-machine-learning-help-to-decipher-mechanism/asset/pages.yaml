    Another potential topic for improved mechanistic study is the combined, simultaneous
    analysis of multiple electrochemical characterization techniques (Figure 2b).
    One hypothesis that the authors hold is that electrochemical perturbation for
    mechanistic information should benefit from different techniques with their complementary
    temporal resolutions. Thus, one


    corollary is that transient and high-frequency measurements, such as pulse voltammetry
    [23] and electrochemical impedance spectroscopy [24], should accompany cyclic
    voltammetry for mechanistic studies, thanks to the former techniques’ reach in
    shorter time scales (10^6 Hz or 1 µs). Current analysis of pulse voltammetry and
    impedance data in conjunction with cyclic voltammetry commands separate two-dimensional
    plots, additional expert training, and an iterative procedure similar to the one
    in cyclic voltammetry that analysis is sequentially conducted for individual electrochemical
    techniques [19].


    We envision that ML-based analysis will enable simultaneous analysis of a high-dimensional
    data format comprised of all the results from different electrochemical methods.
    Such a ML-enabled analysis may not only provide a'
