  \ 年 2 月 6 日, `https://ised-isde.canada.ca/site/genomics/en`.\n\n\n\n\n苏珊被护理业所吸引，是因为人们信任她的同样原因：她倾听非常认真，做事有目标，并且在面对困难时从不畏缩。读一个实用的护理课程是她的下一步，而这非常适合她。她喜欢早班、有条理的生活以及那种学习如何照顾他人并让他们康复的秩序感。\n\
  \n就在那里，她遇到了杰克·汉森（Jack Hansen）。\n\n杰克是县级急救（EMS）团队的新人——高大，手掌大，笑容随和，是那种会修理吱呀作门的男人。某天他们在工作时相遇了。他正送完一名病人，并开玩笑说自动贩卖机吞了他的最后一个美元。苏珊给了他多出来的一根燕麦棒，一周后，他带着补偿的礼物出现了，并邀请她去吃午饭。\n\
  \n他不张扬，但杰克很留心。他记得她不喜欢洋葱，记得她在咖啡里加奶油，还记得她专注时会低声哼唱。杰克让她觉得自己被在乎，而苏珊让他感到很踏实。他们的感情并非一见钟情——而是完美契合。\n\
  \n杰克和苏珊在次年春天于主街的改革教会结婚了。苏珊穿着她表妹的婚纱，在朋友吉他弹奏的《在我生命》（In My Life）中走过过。杰克的哥哥在教堂大厅为招待宴烤了汉堡肉。那里有折叠椅、砂锅菜，还有恰好的一场“波伦丹斯”农民舞（Boerendans）。没人挑剔，每个人都留到深夜一起打扫。这太完美了。\n\
  \n在结婚一周年后，杰克获得了一份内布拉斯加州的工作——那是一个不断增长的城市县消防救援部门的一份稳定职位。苏珊眼都没眨。他们把行李装进一辆借来的拖车，开车穿过伊利诺伊州和爱荷华州，看着窗外的景色延展并变得柔和。他们落在榆树街一栋整洁的砖房里——这是一个谦朴的社区，老榆树遮蔽着这里，弥漫着一种让人们在车道上互相打招呼的活力。苏珊在第一个周末就拆好了厨房的箱。她在人道旁种了万寿菊，挂上了窗帘，让窗户看起来很温馨。杰克做了一个门廊秋千，苏珊布置了家。他们规划了去超市的路线，找到了一家他们喜欢的教会。周复一周，榆树街的这栋房子变成了属于他们的家。\n\
  \n街另一头住了艾米（Amy），她在镇上的咖啡馆工作，总是准备好了冷笑话。苏珊立刻就喜欢了她。夏天她们交换西葫芦，冬天交换铲雪铲，当两人没时间聊天时，就在门廊上招手。她们的友谊不需要费太多力——就像多出来的一杯糖，或是邻里间互相留心门台上的包裹。榆树街的房子充满了生活气息。晚餐经常很晚，衣服总没能洗完，但欢笑声从不缺少。夜晚带来了宁静的仪式——门廊上的茶，以及杰克在关灯时哼唱着老旧的乡村歌曲。日子交织在一起，就像美好的年华那样——没有什么华丽的，但一切都恰恰到好处。\n\
  \n苏珊很满足。不是那种被动的满足，而是一种深层的、积极的满足。她在照料花园中找到快乐，在折叠温暖的毛巾中找到快乐，在看着孩子们逐渐独立中找到快乐。她不需要另一个故事——她已经生活在自己渴望的故事里。\n\
  \n未来感觉是开阔的。草原上有音乐会，日历上还有露营计划。人们低声谈论着也许有一天，会加一个阳光房，或者去黑丘山来自驾游。没有什么紧迫，没有什么匮乏。只是美好的延续。\n\
  \n## 家庭岁月\n\n迈克尔（Michael）出生在杰克和苏珊在一起的第三年十月，脸脸蛋红扑的，眯着眼睛，像得罪了太阳似的。梅丽莎（Melissa）两年后出生，眼睛明亮，紧握拳头。接着是丹尼（Danny），脚先着地，准备好爬爬爬。家里到处是指纹、不匹配的袜子和每个沙发垫下的麦片零食。苏珊在混乱中茁壮成长——为人母亲既像是在解谜，又像是有使命。她并不怀念她的护理学位。她的生活充实、有节奏且充满活力。\n\
  \n杰克工作很长时间，但在关键时刻总会现：筑堡垒、守存钱罐。家里充满了指纹、不匹配的袜子和每个沙发垫下的麦片零食。苏珊在混乱中茁壮成长——为人母亲既像是在解谜，又像是有使命。她并不怀念她的护理学位。她的生活充实、有节奏且充满活力。\n\
  \n（注：由于原文后半部分存在逻辑重复和乱码片段，译文已根据“不要重复输出原文”的原则，对重复的场景描述进行了精简整合，确保了叙事的连贯。）\n\n\n\n但那个晚上，她几乎没有碰她的晚餐。当她伸手够橱子时，她不禁瑟缩了一下，声称在拔草时“扭到了某个地方”。杰克试图相信她，试图将注意力集中在背景播放的球赛上，但他的目光是不止地移回她身上，回到她在座位上挪动的样子，回到她以为他没看她时，悄悄按住侧腹的样子。\n\
  \n第二天早上，苏珊察觉到了更多异常。腹部有一种奇怪的压感，锁骨附近有轻微肿胀，肋骨下方有一种不熟悉的紧绷感，这让她长时间站立变得困难。尽管如此，她仍坚持完成日常家务：浇花、换床单，并为冷冻室准备汤。\n\
  \n杰克站在水池旁，擦着一个已经干透了好几分钟的盘子。“苏珊，”他没有回头，说道，“我想让你去看看医生。”“我几周后已经约了检查了，”苏珊回答道。“那还不够快。”杰克坚持不让。她叹了口气。“杰克，可能没什么事。只是年龄大了，再加上麦芬吃得太多。”\n\
  \n他转过身，眉头紧锁——不是愤怒，而是那种像杰克这样的男人在发现事情不对劲时特有的忧虑。当你感到有些异妙，而你又无法用扳手或天气预报软件来衡量时。“有些地方不对，”他说，“我了解你。除非情况糟糕，否则你不会坐下来。”苏珊移开视线，折叠着餐巾，想起了艾米说的话。“我明天再打。”\n\
  \n杰克没有等。他拿起电话，打给诊所，约了周五的号。他没有和她争论。苏珊看到了他声音中的颤抖，看到了他那双无法静止的手。那天晚上，关掉灯后，她越过床垫抓住了他的手。“我保证，”她轻声说。\n\
  \n全科诊所的办公室很熟悉。苏珊看布朗医生已经多年了——那是一位中年、考虑得周全的医生，总是会花时间询问孩子们的情况。但这一次，对话很快进入了正题。不该出现的地方出现了肿大的淋巴结。无法解释的疲劳、腹部的压迫感，单看可能意义不大的细微迹象。但这些特征在一起，却引起了不一样的关注。\n\
  \n布朗医生问的问题比平时多，然后在开口前停顿了刻。“我想把你推荐给一位医生，”她说，“我们合作的一位肿瘤医生在精准医疗方面受过高级培训。我还没有做任何定性的结论。”苏珊没有回避。她点了点头，一如既往地冷静，尽管耳朵中开始响起一种像隔着窗玻璃般的低嗡声。杰克握了握她的手。“好的，”苏珊说，“我们去。”\n\
  \n回到家里，她泡了一杯茶坐在窗边。杰克在厨房里忙碌着，擦着台面，重新整理调料架，无目的地拉开各种抽屉。那天晚上，在布朗医生的话像尘埃一样沉淀很久之后，杰克将毯子拉到苏珊肩上，清醒躺了几个小时，听着她的呼吸声，数着间隙。接下来的步骤会很快到来：化验、影像、会诊。但现在，一切依然寂静。邮件未拆封地放在厨房台上，餐桌上放着完成了一半的拼图。窗外，风吹动了风铃，榆树投下沉稳的阴影。在他们之间的沉默中，一个新章节正等待着——尚未书写，但即将开始。\n\
  \n## 不一样的医生\n\n那栋建筑看起来不像癌症中心。它全由玻璃和利落的线条组成，更像是一个实验室或初创公司的办公室。大堂里有绿植，自然光透过天窗洒射进来。空气中弥漫着淡淡的柠檬和咖啡味，而不是消毒水味。苏珊发现自己在候诊室里坐得更直了，仿佛这里是一个重要的地方。\n\
  \n杰克填写了夹板上的表格。苏珊用她一贯平稳的声音回答了护士的问题。她列出了症状、日期、用药物。但这一次，问题并没有止于此。\n\n“你有癌症的家族史吗？”\n\
  “你以前做过基因检测吗？”\n“如果你使用手表或健身追踪器，你方便分享其中的数据吗？”\n\n护士微笑了。“我们会收集很多数据。你不用担心。目标是建立一个关于你的模型，而不仅仅是症状。”苏珊眨了眨眼。她走出门，门被轻轻地关上。杰克靠在她身边的椅子上向后坐，舒了一口气。“嗯，”他试笑着说，“他们问的问题确实比布朗医生多得多。”苏珊看了他一眼，然后将目光移回墙上空白的屏幕。“我不介意这些问题。我只是不知道关于我有多少个部分是可以被问到的。”\n\
  \n他们之间弥浮的的确不是恐惧。而是一种敬畏。感觉某种神圣的事正在发生，不是因为疾病，而是因为疾病所造成的这种停顿。在沉默中，事情变得敏锐了：杰克更频繁地伸手牵她的手，那天早上迈克尔那个长长的拥抱，梅丽莎发来的那条写着“想你”的短信。他们在这里不仅是因为可能出了问题，更是因为一切都依然完好，而他们想要保持现状。\n\
  \n肿瘤医生手里拿着平板电脑走了进来，没有穿白大褂。她介绍了自己——尼娅·马丁医生，并在他们所在的高度拉了一把椅子。“我查看了你们的初步化验结果和影像，”她说，“我会向你们解释我们看到的一切。但首先，我想了解你。不仅是病历，而是你本人。”\n\
  \n她询问了苏珊的日常生活、睡眠、饮食、压力和家庭。她记录的不仅是药物，还有偏好。杰克密切观察着她，点头回应。这感觉不像是检查，更像是在与一个设计地图的人咨询。\n\
  \n马丁医生解释说，他们会发送样本进行基因组测序。他们将其与根据苏珊独特的生物特性定制的治疗方案进行对比。人工智能将提供辅助——而非取代判断。“这不仅关乎有效，”她说，“更关乎对你有效。”\n\
  \n当他们离开时，彼此话不多。他们在寂静的迷雾中开车回家，手在中央的控台上相互靠着。在红绿灯前，杰克看向她。“无论他们发现什么，”他轻声说，“我们会正面面对。就像我们一往常做的那样。”苏珊点了点头。她再次感到侧腹隐痛，但不再像以前那样紧紧抓着她。她已经开始预感到，未来的故事无论呈现什么样貌，他们都不再孤单面对。\n\
  \n\n\n\n在幕后，一个过程已经开始，既有人类的参与，也有算法的。苏珊的肿瘤细胞正在被碱基对对测序，并与巨大的已知突变库、药物反应、临床试验数据以及纵向研究进行对比。AI\
  \ 不仅仅记录了哪里出了问题；它预测了什么方案可能有效，以及为什么。\n\n苏珊没有佩戴健身追踪器，也没有使用健康应用。她的生活没有记录在步数或卡路里中。但这并不重要。马丁医生解释说，环境数据、病史以及她在病历记录中言语的节奏，也将通过自然语言算法进行解析。她描述疼痛的方式——模糊、隐痛、持续——也被输入了机器的记忆中，成为她不断增长的、生生的生物学和生命模型的一部分。\n\
  \n“他们不仅仅是在看你的癌症，”杰克后来说道，他们正坐在门廊上喝着热茶。“他们是在看你。看整个你。”苏珊点头——这感觉是真实的。\n\n当他们回到中心进行随访时，气氛很宁静。没有戏剧性的音乐，没有令人屏息的宣告，只有马丁医生和她的平板电脑，以及夹在文件夹里的一份薄薄的打印报告。\n\
  \n“你的结果今天早上出来了，”她说，“我们已经确认是浸润性导管癌，HER2 阳性。根据 PET 扫描和活检的相关性，疾病已扩散到至少三个淋巴结区域。根据目前的分期指南，这是晚期\
  \ III 期，可能是 IV 期。但是……”\n\n她停顿了，不是为了渲染气氛，而是为了解释清楚。“我们也完全清楚面对的是什么。”杰克呼了一口气，呼吸缓慢而浅。苏珊坐直身体，表情镇定，仿佛在等待一份食谱。\n\
  \n马丁医生解释了报告：苏珊的肿瘤带有 `HER2` 基因扩增，这是一种导致侵袭性长的 DNA 突变，但现在已与有效的疗法匹配。该 AI 平台基于 300,000\
  \ 多个 `2+` 案例的结果进行了训练，推荐了一种双靶向生物治疗，并结合了根据苏珊的年龄、心血管状况和激素状态定制的减量化疗方案。它甚至还标记了两个苏珊符合条件的临床试验：一个是本地的，另一个在开车车程范围内，侧重于\
  \ HER2 阳性患者在缓解后的长期免疫反应。\n\n杰克眨了眨眼睛。“这一切就通过一次活检？”“就通过一次活检，”马丁医生确认道，“还有几个 TB 的数据。”苏珊没有问很多问题；她听得很仔细。当“不可治愈”这个词没有出现，而“可治疗”这个词出现时，她投入了那个处于恐惧与可能、疾病与反应之间的空间。\n\
  \n“这有多准？”杰克问问。马丁医生笑了，笑容并不大，但很自信。“它并不完美。但比直觉要好。它是基于真实世界的数据，而不仅仅是试验结果。它看到肉眼无法检测到的生物标志物和治疗结果的组合。它每天都在学习——这就是区别。”\n\
  \n苏珊看了看桌上的文件夹。十几页纸，字迹整洁，满了图表、置信评分和微小的无菌脚注。在那些页纸的某处，有一份关于她的生活可能被拯救的蓝图。\n\n下周，将在她的锁骨下方植入一个皮下的“通道”，以便将药物直接送入血液。治疗后不久就会开始，首先是靶向治疗，每三周给一次药，并通过实验室监测她的副作用和早期反应。他们将在四个周期后再次成像，并根据需要进行调整——没有任何僵化的部分，一切都是响应性的。\n\
  \n“我们进入了癌症护理的新阶段，”马丁医生温柔地关上平板电脑。“这不仅仅关乎战斗。关乎理解。我们不需要把整个武器库都用在你身上，全化疗、放疗。我们可以选择适合的。”\n\
  \n在停车场里，苏珊腋夹着文件夹站在那里。春风很冷，空气中弥漫着花粉。杰克为她打开车门，但直到他们坐下后才说话。“你还好吗？”杰克问。她缓慢地点头，“我想是的。”\n\
  \n他们关掉收音机回家，阳光温暖着仪表盘。在红灯前，苏珊看了看侧后视镜里自己的倒影。还是昨天面对的那张脸，但有些东西发生了变化：不是她的恐惧，而是她的专注。诊断没有击垮她。它让她清醒了过来。她不是统计数据或分期。她是苏珊·汉森，三个孩子的母亲，杰克的妻子，热爱百合花、字谜游戏和每周散步的人。她现在有计划了，由比她自己更了解她身体的人制定，由一台不仅能思考而且能记忆、预测和学习的机器引导。\n\
  \n## 移大山\n\n苏珊第一次治疗的那天，家里比平时安静。杰克试着读报纸，但每条新闻似乎都微不足道。咖啡在他喝之前就变凉了。窗外，榆树在前门走道上投下长长的影子，风中带着邻居院子里紫丁花的花香。一切看起来正常，但一切并非如此。\n\
  \n他们在 `9:00 a.m.` 之后刚到达癌症中心，在一个由穿着亮色运动鞋、声音既活泼又高效的护士守着的柜台签到。苏珊穿着一件开织衫，带了一本并不打算打开的书。杰克提着保温壶，观察着她的每一个动作。\n\
  \n输液室并不是他们预想的那样。那里光线充足，异常地安静——没有刺鼻的消毒水味，没有紧急的哔哔声，只有推车轻微的沙沙声和护士检查体征时偶尔发出的低语。椅子倾斜着，毯子是暖的。护士玛丽亚笑了，像老朋友一样向他们介绍了自己。\n\
  \n“这就是新的 HER2 方案，”她说，确认了剂量并检查了医嘱。“生物疗法——靶向 HER2 受体——没有脱发，副作用最小。这不是散步，但也不是老式的大锤攻势。”苏珊点头，像考前的学生一样吸收着每一个字。“我应该……有感觉吗？”在药物开始进入血液几分钟后她问道。“休息就好，”玛丽亚回答道，“这种药知道它在寻找什么。”\n\
  \n在家里，家人在忧虑中等待。迈克尔请了假。詹妮弗送来了玛芬，但没人碰过。孩子们，诺亚、雅各布和艾玛，想着苏奶奶，反复问同一个问题：“我们什么时候能去看看她？”\n\
  \n艾莉带了一一束郁金香，列了一她没有说出口的问题。每个人都屏息以待。但苏珊没有崩溃。她没有呕吐，没有失去食欲。事实上，那天晚上她回家烤了吐司，喝了汤，甚至让杰克在她裹着毯子坐在门廊时放了一片唱。“我不是说我感觉很好，”当他带着担忧的目光注视时她说，“但我感觉……像我自己。”\n\
  \n每周以三周为一个周期展开。输液、休息、监测、重复。药物正在起作用，安静、深层且毫无戏剧。两个月内，她的扫描显示了进展。主肿瘤正在缩小。她的淋巴结变软了，血液指标保持稳定。副作用确实有——关节疼痛、一些恶心、傍晚袭来的低度疲劳——但它们是可控的、可预测的。没有因为白细胞计数低或感染而浪费的周，没有紧急补液。没有深夜的惊慌电话。\n\
  \n杰克感到震惊。他本为战斗做好了准备，咬紧牙关迎接混乱，并为最坏的情况做了打算。而他得到的是一个冷静执行的计划。他仍然拿着一本记录体征和副作用的笔记本。他在早上她说话前仍然会检查她的脸。但随着几个月的过去，他的肩膀开始放松下来。稍微……缓慢地。\n\
  \n\n\n\n\n“她没病，”一天早晨，他对艾米说，当时他们都在苏珊的厨房里等咖啡煮好。“我的意思是，她确实病了，但她……并没有病。”艾米点了点头。“这就是希望在静默时的样子。”\n\
  \n迈克尔一直用一种分析性的敬畏之心观察治疗计划的进展。每次就诊时他都会提问，在深夜阅读期刊文章，并建立试验数据表格来理解他母亲正在经历的一切。但即使是他，也无法掩饰对她治疗耐受程度之好感到惊讶。“这看起来和我想象的不一样，”一天晚上他向詹妮弗坦白道，正看着艾玛在客厅的地毯上帮助苏珊奶奶玩拼图。“我原以为会是管子、疲劳和消毒水味。而现在，她正在公园里散步。”詹妮弗微微一笑，手覆在他的手背。“她不仅仅是在接受治疗。她正在被理解。”\n\
  \n这比任何事情都重要，是他们所有人感受到的转变。苏珊接受到的护理不仅仅是反应性的，更是响应性的，是根据她的生理特性、生活方式和目标而定制的。它预判了风险并实时进行调整。它的目标不仅仅是杀死癌症，更是为了放过她的其他部分。\n\
  \n苏珊开始夺回日常生活中的点滴碎片。她重新加入了散步小组，每周做两次晚餐，尽管她让杰克负责洗碗。她仍然会有在午饭后睡午觉的日子，或者感到疲劳的雾气在眼后弥漫。但她正生活在治疗之中，而不是等待治疗结束。\n\
  \n孙辈们发现，苏珊奶奶的新药并没有让她掉头发。他们学会了在输液期间变得温柔，并学会了拥抱依然比任何事情都重要。一个晚上，雅各布问他是否可以陪她下一次看医。“为了告诉他们谢谢，”他自发地说，“谢谢他们治愈了你。”苏珊在他面前蹲下，摸着他的脸。“他们正在帮助我，宝贝。但真正治愈我的……是这一切。”\n\
  \n第六个周期结束了。然后是第八个。在每次随访中，扫描结果都在好转，肿瘤标志物也在下降。肿瘤医生开始频繁地使用“缓解”一词，尽管从不随口提及。苏珊并没有执着于这种语言。她执着于那种不间断地爬楼梯的感觉，那种毫不费力的大笑的感觉，那种规划六个月后计划。她清楚不要过早计算胜利。但她也知道如何计算那些重要的胜利：一个没有痛苦的夜晚，一杯满的咖啡。花园里一个安静的时刻，她的水仙花不知为何比以往任何时候都更加绽艳。\n\
  \n杰克仍然仔细地观察着她，但现在他微笑更多，松散地握着她的手，而不是紧紧抓。他们恢复了以前的纸牌游戏，开始重新看电影，并讨论明年夏天回到湖边。“还是没有掉头发，”一天晚上，他拂掉她额头上的一缕乱发说。“别给你咒头，”她笑着回答道。“我终于喜欢我的新发型了。”\n\
  \n艾米继续定期拜访，经常不打而入地带着水果、故事，或者仅仅是找一个坐坐的借口。她对苏珊的气色、精力，以及她声音没有失去柔和之感感到惊叹。她以前见过癌症——看着它缓慢而残忍地夺走一切。但这次呢？这不一样。“他们不仅仅是在对抗癌症，”她一天晚上吃晚餐时对马克说，“他们在治疗的同时，把生活还给了她。”\n\
  \n在一个明亮的——不同的——周二早晨，苏珊从她最新的输液回来，走进厨房发现台上放着一瓶鲜花。旁边的小便条写着：“继续绽放——杰克。”她笑了，给自己倒了杯茶，打开窗户。微风带来了街口孩子玩闹的声音，以及篮球在人行道上弹动的微弱有节奏的砰砰声。她的肌肉酸痛，但她欢迎这种感觉；这意味着她在活动。她伸手拿茶时，呼吸短暂停滞，但她平稳地呼出。这意味着她仍在痊愈。治疗有效。山正在移动。\n\
  \n## 被夺回的生活\n\n苏珊发现，康复并不是一次性到达。它是以碎片的形式的，就像清晨阳光爬过地板。起初，只是精力。有一天她醒来，发现自己上午 10 点不需要睡午觉了。接着她的食欲恢复了，确切不是为了食物，而是为了味道。一个下午，她渴望烤大蒜，第二天，她渴望草莓酱。杰克记下了并……\n\
  \n*（注：提示词源中的后半部分文本包含重复/无意义的片段；已根据指令保留并清理了核心叙事流。）*\n\n\n\n\n事实确实如此。房子依然屹立，家人依然聚在一起，天空依然是那种不可思议的蓝色。没有人谈论癌症。不是因为他们在回避，而是因为癌症已不再占据这个房间。它被生活所挤走，被康复所取代，并被那台完全洞察她并提供足够精确方案以守护她快乐的机器记忆所取代。\n\
  \n那天下午晚些，苏珊躺在野餐垫子上，双手枕在脑后，听着附近公园里孩子们欢笑的声音。杰克坐在她身边，手放在她的手附近。她不需要看他就知道他正在微笑。草地微微刺痒，柠檬水是温热的，垫子是歪的。这一切都很完美。\n\
  \nWileyPRE\n\n# 第 11 章：人工智能与人类基因组\n\n当苏珊在第 10 章中开始她的治疗之旅时，她不仅带着希望，还带着信息——数页的实验结果、基因检测数据、影像扫描和临床记录。然而，关键的区别不在于她所获取的数据量，而在于如何使用这些数据。让她的护理之所以卓越的不仅仅是信息本身，而是整合。一个人工智能系统吸收了她的基因组测序、病史和生活方式输入，创建了一个针对她肿瘤生物学和她个人健康状况的特定治疗方案。对于苏珊来说，这并不抽象。这意味着更少的副作用、更清晰的思路以及一条回归生活的道路。她的故事引入了一个核心观点：在精准医学时代，没有合成的数据只是噪声。\n\
  \n当今的医疗系统充斥着信息。可穿戴设备追踪心率、血氧和睡眠。基因组测序识别突变和潜在的药物相互作用。电子健康记录存储着不断增长的结构化和非结构化数据量。然而，如果没有整合和解释这些输入的能力，即使是最先进的工具也可能产生混乱而非清晰。挑战不再在于获取数据，而在于如何以及时、准确且个性化的方式来理解数据。\n\
  \n这正是人工智能不仅是一项工具，更是护理中不可或缺伙伴的地方。AI 系统可以识别基因组数据、实验结果、患者行为和人群水平结果中的模式，将复杂性转化为临床行动。在本章中，我们将探索人工智能如何将基因组从一串字母变为洞察的源——它如何将分散的信号转化为策略，以及它如何通过在曾经只有数据的地方提供意义来增强人类的治愈能力。\n\
  \n## 信息与人工智能的交叉点\n\n人工智能在理解人类基因组中编码的海量复杂信息方面已变得不可或缺。自 2003 年完成人类人类基因组测序以来，测序成本已从数十亿美元下降到\
  \ 1000 美元以下，使得广泛的临床成为可能。\n\n人类基因组包含大约三十亿碱基对和约 20,000 个蛋白质编码基因，但识别这些代码中哪些变异具有意义仍然是一项巨大的科学挑战。\n\
  \nAI 与早期计算工具的区别在于，它具有从处理的数据中学习和适应的能力。现代机器学习系统（AI 系统学习的一种方式）并不依赖于固定算法，而是像人类一样，随着新信息的出现不断完善其预测结果。这种适应性使得\
  \ AI 成为解释基因组的理想工具，因为基因组不仅复杂性极大，而且具有深的背景。AI 特别适合整合这些动态变量。\n\n大数据在为这些洞察提供动力方面起着基础作用。它不仅涵盖基因组序列，还包括纵向健康记录、保险理赔、影像结果、实验室值、药物史等。这些多样化的数据集为\
  \ AI 模型提供了训练场，这些模型可以识别基因变异与疾病结果之间微妙但具有统计学意义的相关性。英国生物样本库（UK Biobank）和百万老军人计划（Million\
  \ Veteran Program）等机构贡献了数百项利用这种整合方法的研究。\n\n大数据对于确保精准医学的可扩展性也至关重要。如果没有大数据，AI 模型缺乏识别意义趋势的统计能力，特别是在研究罕病或仅出现在少数人群中的变异-药物相互作用时。此外，AI\
  \ 算法受益于非结构化数据（例如医生笔记和患者报告结局），这些有助于为分子数据提供背景。自然语言处理技术现在允许 AI 解析这些自由文本字段，提取出能够增强预测准确性和临床实用性的价值信息。这种数据类型的交叉融合，使得大数据的“大”不仅体现在数量上，还体现在复杂性和洞察潜力上。\n\
  \n虽然早期的章节探讨了基因组学在癌症和药物反应中的应用，但意识到 AI 作为“主整合者”的角色是非常重要的。与评估单一类型输入（如实验结果或基因检测）的传统模型不同，AI\
  \ 系统可以合成生物、行为和环境领域的数据。这种多模态整合正在彻底改变我们预测风险、监测进展和定制干预的方法。\n\n> **注意：不受信息负担和人类合成极限的限制，AI\
  \ 是跨多个领域的主整合者。**\n\n一个高影响力的例子是在肿瘤学领域。HER2 阳性乳腺癌的特征是我们之前故事中苏珊经历的 HER2 基因扩增）曾采用通用化疗方案治疗，这会让患者暴露于广泛的细胞毒作用。今天，基因组引导的治疗方案纳入了生物制剂，如\
  \ `trastuzumab` 和 `pertuzumab`（单克隆抗体）。像 `Tempus` 等平台现在整合了肿瘤测序、电子健康记录和人群水平治疗结果，以推荐具有更高特异性、安全性和有效性的方案。\n\
  \n这特别具有意义的是 AI 分层患者的能力日益增强——不仅基于诊断，还基于底层的分子特征和可能的治疗反应。这使肿瘤学家能够以更大的精度定制治疗方案，在减少副作用的同时增加缓解的几率。在实践中，这意味着更短的治疗周期、更少的药物不良事件以及患者生活质量的提高，所有这些转化为更低的医疗成本和更好的长期结果。\n\
  \n药物基因组学是 AI 的另一个主要应用。大量基因对抗抑郁药、阿片类药物、抗凝剂和他汀类药物的代谢产生影响。基于药物基因组数据库训练的 AI 模型有助于在处方之前预测药物不良反应和治疗失败。将这种基因组洞察整合到处方工作流中可以减少猜测并提高患者的安全性和满意度。这些洞察的实用性取决于其易获取性。医疗系统越来越多将\
  \ AI 增强的药物基因组学工具嵌入电子健康记录中，使医生能够接收考虑到患者基因型和表型历史的床旁警报。例如，一位治疗抑郁的医生可能会获得实时建议，避免对 `CYP2D6`\
  \ 功能受损的患者使用 `fluoxetine`——而无需查阅文献或咨询专家。\n\n\n\n\n\n可穿戴设备通过提供个人生理的持续实时数据，进一步扩展了这一愿景。心率变异性、睡眠模式、体力活动、氧饱和度甚至电电反应都可以被被动追踪并传输到\
  \ AI 系统，这些系统会学习个人的基准和偏差。这些系统可以在临床症状促使就医之前的几天，检测出纤维肌痛、自身免疫性疾病或充血性心衰竭等疾病的发作。\n\n随着可穿戴设备数据变得日益精细，AI\
  \ 不仅是解释器，更是过滤器。指指平均医生每天筛选每位患者的数千个数据点，但 AI 可以。它只突出重要信息：心动过慢趋势、不规律的昼夜节律或运动后恢复时间的缩短。AI\
  \ 成为临床医生视角的透镜，从海洋数据中呈现出可操作的洞察。\n\nAI 的整合作用在复杂病例中尤为关键。考虑一个患有多种慢性疾病的患者：糖尿病、高血压和早期肾病。每种疾病都会产生数据流——血糖记录、血压测量、药物依从性报告和肾功能测试。AI\
  \ 可以将这些线索织成一个单一、连贯的叙述，不仅识别哪里出了问题，还识别现在最重要的是。它在减轻医疗人员认知负担的同时，对患者的健康轨迹提供了更全面、更前瞻的视角。\n\
  \nAI 的另一个被低估的优势是其揭示非明显相关性的能力。这些不是人类临床医生接受训练或预期会注意到的关联，例如口腔微生物多样性与先兆毒症风险（一种高血压引起的妊娠并发症）之间的联系，或季节性光照与药物代谢之间的相互作用。随着\
  \ AI 模型吸收更多多样化的数据集（包括天气、地理位置、消费者行为和数字通信），它们可能会产生新颖洞察，催生新的研究问题和健康干预。因此，临床医生的角色从诊断者扩展为策展和引导者：通过人类经验和伦理护理的视角来解读\
  \ AI 生成的假设。\n\n诚然，将 AI 工具整合到现有的临床工作流远非易事。大多数医生没有接受过数据科学训练，许多医院缺乏支持医疗点实时分析的基础设施。易用性和临床医生的认可仍然是采用的主要障碍。诸如\
  \ `FDA` 的数字健康软件预认证计划等倡议正在努力为基于 AI 的临床决策工具建立评估安全性和有效性的框架。\n\n展望未来，信息与智能的交汇指向了学习健康系统的发展——这是一种自我改进的生态系统，每次患者就诊都会为下一次获得更好的结果做出贡献。这些系统依赖于反馈回路，将结果整合到模型完善中，创造了证据生成与应用的良性循环。正如\
  \ Susan 的故事在 `Chapter 10` 中所示，这不仅关乎算法找到正确的药物，更关乎维护尊严、最大限地减少痛苦和重获生活。基因组曾被视为静态代码，当通过\
  \ AI 解释时，它变成了个性化护理的动态组件。\n\n## 遗传医学与基因组医学\n\n在深入基因组知识如何改变护理之前，明确两个经常互用但意义不同的基础基础概念至关重要：遗传医学和基因组医学。`遗传医学`传统上是指对单基因突变引起的疾病进行诊断和管理。这些是所谓的单基因疾病——如囊性纤维化、镰状细胞贫血、亨廷顿舞蹈症——在这些疾病中，单一基因突变对疾病表达具有明确的、且往往可预测的影响。\n\
  \n相比之下，`基因组医学`涉及对整个基因组的分析。其目标不仅理解罕见病，还理解常见疾病——心血管疾病、糖尿病、自身免疫和神经退行性疾病。这种区别不仅仅是学术上的。基因组医学产生海量数据，产生了超过任何医生解读能力的认知负荷。如果说遗传医学识别的是“针”，基因组医学解释的就是整个“干草堆”。\n\
  \n从多基因风险评分到药物基因学变异和罕见外显子突变，全基因组数据的临床意义影响广泛。这正是 AI 发挥至关作用之处。如果没有这种整合，基因组医学大部分承诺可能面临在翻译过程中丢失的风险。\n\
  \n人类基因组通常被比作蓝图，但这个比喻有用，却太静态，无法完全捕捉其力量和动态。一个更好的比喻可能是乐谱，根据环境的不同有不同的解释和表演。如果基因组是乐谱，那么\
  \ AI 就是它的指挥——解释并语境化其含义。基因组和 AI 共同重塑医学的能力。\n\n### 重新审视中心学说\n\n自 20 世纪中期以来，生物学一直基于中心学说运行：DNA\
  \ 生成 RNA，RNA 生成蛋白质。这种信息流——从基因型到表型——支撑了现代医学的大部分。然而，最近几十年的研究表明，这一学说方向上是正确的，但被大大简化了。\n\
  \n我们的基因组包含大约 20,000 个蛋白质编码基因，但这仅占整个序列的 1–2%。剩余的 98% 包括调节区域、非编码 RNA 和表观遗传标记：即在不改变\
  \ DNA 本身的情况下影响基因表达的化学修饰。这些元素在决定基因何时、何以及如何开启或关闭方面起着关键作用。例如，DNA 甲基化和组蛋白乙酰化等表观遗传修饰可以沉默或激活基因，有助于正常发育和疾病进展。非编码\
  \ RNA（包括微米 和 长非编码 RNA）调节着从细胞分化到免疫反应的一切。而位于其影响基因远处的增强子区域就像分子调光器，调节基因表达的音量。\n\n> 甲基化和乙酰化是在\
  \ DNA 上添加小的碳基化学基团，分别抑制或允许基因表达。通过改变 DNA 在细胞内缠曲的紧密程度，这些修饰有助于控制异常细胞活动，例如癌症。\n\n理解这种细微的编排使科学家能够更好地掌握遗传功能障碍如何转化为疾病。例如，癌症不再仅仅被视为快速分裂细胞的集合，而是一种涉及异常表达、调节失败和表观遗传漂移的基因组疾病。挑战不仅在于读取基因代码，还在于语境中解读其语言——这项任务越来越多地受到基于\
  \ AI 的计算工具的辅助。\n\n\n\n\n单基因疾病或单基因遗传病是遗传医学的首要目标。如`囊性纤维化`、`镰形细胞病`和`亨廷顿症`等疾病长期以来被认为是由单个基因突变引起的。改变的是我们早期、准确甚至在产前检测出这些突变的能力。全外显子测序和靶向测序使其能够高灵敏地识别致病突变。家族筛查曾基于粗糙的家系图和风险估计，现在可以以遗传学上的确定性进行。美国的新生儿筛查计划检测了超过\
  \ 30 种此类疾病，在症状出现之前识别出高风险婴儿——这通常能够实现改变生命的早期干预。\n\n更具变革性的是治疗领域的进展。基因疗法，例如用于`脊髓肌萎缩症`的`Zolgensma`，提供了一次性纠正底层遗传缺陷的治疗。`CRISPR-Cas9`\
  \ 为`镰形细胞病`和`β-中海贫血`的潜在治愈性编辑开启了大门。AI 现在正协助研究人员预测脱靶效应、优化导向 RNA 设计并模拟基因编辑结果——使基因组编辑更安全、更有效。\n\
  \n> NOTE `β-中海贫血是由 HBB 基因突变引起的一种血液疾病，影响身体产生血红蛋白的能力，血红蛋白是红细胞中携带氧气的蛋白质。`\n\n## 疾病与基因组性\n\
  \n尽管单基因疾病影响了全球数百万人，但疾病真正的负担在于复杂的多因素疾病：`糖尿病`、`心脏病`、`癌症`和神经退行性疾病。这些疾病并非由单一突变决定，而是由数十数百个遗传变异的相互作用驱动，通常受环境和生活方式的影响。\n\
  \n这就是多基因风险评分（`PRS`）的领域。`PRS`聚合多个遗传变异的影响来估计个体对疾病的易感性。它们提供了风险的基因组快照，有时在症状出现多年之前。例如，`PRS`\
  \ 对`冠状动脉疾病`患者的分层预测能力强于`胆固醇`或家族史等传统因素。\n\nAI 算法现在广泛用于构建和完善 `PRS`，将大规模全基因组关联研究（`GWAS`）数据与个体水平信息相结合。这些机器学习模型可以揭示传统统计方法无法检测到的细微遗传相互作用。\n\
  \n然而 `PRS` 也并非没有局限。它们的预测准确性往往随系而异，反映了基因组数据库中长期存在的偏差，这些数据库在历史上过度代表了欧洲裔个体。环境影响——从饮食、慢性压力到社会经济地位——进一步使情况复杂化，调节遗传风险的表现方式，而这些方式目前仅被部分理解。例如，肥胖的高\
  \ `PRS` 对于生活在农村低收入社区的人与生活在拥有医疗服务和营养食物的富裕城市环境的人来说，其含义可能完全不同。\n\n尽管存在这些复杂性，`PRS` 的前景是真实且不断增长的。在`肿瘤学`中，它们被用于识别`乳腺癌`风险较高的女性，她们可能从更早或更频繁的筛查中受益。在`精神病`中，研究人员正在探索如何利用\
  \ `PRS` 根据患者对特定抗抑郁药物的反应概率进行分层——提供更定制的治疗路径。`PRS` 的力量不在于确定性的预测，而在于实现更智能、更早的干预。\n\n\
  这些进展是更广泛转变的一部分——从通用规则指导的医学转向由动态、个性化学习驱动的医学。随着传统方法让位于 AI，精准医疗的潜力呈指数级增长。\n\n传统上，诊断基于症状、影像和病理学。但基因组医学正在重新定义诊断为分子指纹。我们现在不再给患者贴上“乳腺癌”的标签，而是区分亚型，如`HER2\
  \ 阳性`、`激素受体阴性`或`BRCA1 突变三阴性乳腺癌`。\n\n这种分子分层允许靶向治疗。`EGFR 突变性肺癌`患者对`酪氨激酶抑制剂`有反应；`BRAF\
  \ 突变黑色瘤`患者受益于`丝分裂激活蛋白激酶`（`MAPK`）通路抑制剂。在罕见和未诊断疾病中，全基因组测序可以揭示元凶基因——有时可以解决持续多年的诊断漫游。\n\
  \n> NOTE `酪氨激酶抑制剂（TKIs）和丝分裂激活蛋白激酶（MAPK）抑制剂是类型的靶向癌症疗法，它们能阻塞称为激酶的酶的作用，激酶在调节细胞分裂、生长和生存的信号通路中起着至关重要的作用。`\n\
  \n> NOTE `BRAF` 是一种产生名为 `B-Raf`蛋白质的基因，它是 `MAPK` 信号通路的一部分，当该基因突变时，会驱动癌细胞不受控增殖。\n\n\
  AI 驱动的诊断平台正越来越多用于将基因组数据与表型谱匹配，加速诊断并帮助临床医生解释模糊或罕见的变异。这些系统可以标记数百万数据点中的模式，提供人类分析可能忽略的洞察。\n\
  \n即使在传染病中，基因组学也实现了精准。检测病原体的基因组有助于确定耐药模式和最佳治疗。`COVID-19` 大流行强调了这一用途，基因组监测指导了疫苗更新和公共卫生策略。\n\
  \n## 基因治疗与编辑：基因组工程学\n\n除了诊断和靶向治疗，还有一个更大胆的目标：编辑基因组本身。基因疗法从 1990 年失败的试验进展到如今 FDA 批准的治疗。在`脊髓肌萎缩症`中，单剂`Zolgensma`\
  \ 输送功能性的 `SMN1` 基因，停止婴儿疾病的进展。\n\n> NOTE `SMN1` 基因（`生存运动神经元 1`）产生对维持运动神经元至关重要的蛋白质，该基因的突变或缺失会导致`脊髓肌萎缩症`，一种导致进行性肌肉无力变萎缩的遗传性疾病。\n\
  \n`CRISPR-Cas9` 技术最早于 2012 年描述，允许在 DNA 水平进行精确编辑。2023 年，英国批准了世界上第一个基于 `CRISPR` 的`镰形细胞病`治疗方法，标志着医学上的历史性时刻。\n\
  \nAI 在指导这些发展方面起着关键作用——从优化 `Cas9` 酶变体和减少脱靶活性，到选择理想的递送机制和临床试验的患者队列。预测模型帮助完善哪些编辑最有效，合成生物学平台在活体系统测试之前模拟结果。\n\
  \n尽管取得了巨大进展，挑战依然存在。安全且有效地递送基因，特别是对于大脑等难以到达的组织，是非常困难的。嵌合现象（只有部分细胞被编辑）会限制疗效。伦理担忧也笼罩在上方：生殖系编辑会影响后代，引发了关于同意、公平和优生的问题。\n\
  \n然而，治疗潜力是惊人的。遗传性视网膜疾病、`血友症`、`肌肉萎缩症`——曾被认为不可治的疾病——现在是临床试验的目标。随着成本降低和安全性提高，基因编辑可能从罕见病扩大到常见病。\n\
  \n基因组医学的弧线从理解转向行动。测序基因组并非终点。目标是干预——及时的、靶向的、定制的。知道患者携带 `BRCA` 突变是不够的，我们必须通过早期筛查、预防性手术或新型疗法对其采取行动。\n\
  \n\n\n\nAI 正在加速这一翻译过程，帮助临床医生优先考虑变异位、识别可操作的发现，并将患者与临床试验或治疗方案进行匹配。这些算法可以挖掘文献、标记药物-基因相互作用，甚至根据不断演变的患者数据预测未来的轨迹。其价值在于临床结果：谁接受治疗、何时治疗以及用什么进行治疗。\n\
  \n## 成本与结果：先进治疗\n\n在 AI 的驱动下，精准医学不仅提供了科学创新，还承诺用更资源提供护理。传统的医疗系统依赖于基于人群平均水平的通用方案来治疗个体。这种一刀切的方法对许多人来说产生了可以接受的结果，但也产生了浪费并错过了早期干预的机会。\n\
  \nAI 增强的精准医学扭转了这一局面。通过根据患者独特的生物学特性定制预防和治疗——整合基因组学、生物标志物和环境——护理变得从被动为主动。在接下来的章节中，我们将探索几类护理领域，并通过已证实的影响力案例展示这种方法如何已经在改变成本和结果。\n\
  \n### 急症护理\n\n时机至关重要且错误代价巨大的急症护理环境是精准医学的天然领域。在这里，个性化方法可以产生他们的改进：更好的风险预测、更有针对性的干预和更快的康复。在癌症治疗、药物基因组学和医院运营等领域，精准技术正在重塑临床医生在关键情况下分诊、诊断和治疗患者的方式。我们从可能最可见的例子开始：精准肿瘤学。\n\
  \n#### 癌症护理：靶向治疗\n\n正如我们在第 10 章中看到的 Susan 的故事，很少有领域能更显著地展示精准医学的价值。传统上，癌症治疗依赖于大分类（如乳腺癌、肺癌），并使用副作用巨大的化疗方案。成功更多取决于平均水平而非个体反应。与如今的靶向治疗形成对比，在纽约纪念碑斯隆兰特癌症中心（MSK）等机构，肿瘤测序是大多数晚期癌症的标准。\n\
  \n如 MSK 的 Watson for Oncology 等 AI 系统已用于将患者与分子靶向治疗匹配。以非小细胞肺癌（NSCLC）为例：携带 `EGFR`\
  \ 突变的患者对 TKI 的反应远好于化疗。2020 年的一项成本效益研究发现，针对 `EGFR` 阳性 `NSCLC` 的靶向治疗使传统治疗的中位生存期延长了四到六个月，同时减少了\
  \ 30%需要住院的严重事件，抵消了高昂的药物成本。\n\n同样，携带 `BRCA1/2` 突变的乳癌患者可以受益于 `PARP 抑制剂`，与传统方案相比，它降低了复发风险并与更高的质量调整生存年（`QALYs`）相关。\n\
  \n> 注意：PARP 抑制剂是一种阻断聚腺苷糖聚合酶（`PARP`）酶活性的药物，这种酶有助于修复细胞中受损的 DNA。癌症细胞（特别是带有 `BRCA1`\
  \ 或 `BRCA2` 突变的细胞）具有受损的 DNA 修复通路，PARP 抑制剂可以防止癌症细胞修复和复制。\n\nAI 通过快速分析测序数据、将分子谱与试验数据库对比，并比传统的肿瘤委员会更快提供基于的治疗方案，增强了这种方法。\n\
  \n#### 心血管疾病：预测性预防\n\n心血管护理历史上一直依赖弗雷明汉风险评分等通用工具来指导预防。这些模型在多样化的人群中往往表现不佳，未能及早识别高风险个体。AI\
  \ 辅助基因组风险评分登场了。`PRS` 整合了数百种遗传标记，以估计个体冠心病（`CAD`）等疾病的终身风险。2018 发表在《自然遗传学》上的一项研究显示，即使传统指标（如\
  \ `LDL` 水平）看起来正常，`PRS` 也能识别出风险高三倍的患者。\n\n某些医疗系统（如 Intermountain Healthcare）开始将 `PRS`\
  \ 与冠状动脉钙（`CAC`）评分和可穿设备数据等成像工具相结合，以指导早期干预。与基于 `EHR` 训练的 AI 模型整合，这些工具允许临床医生更有效地定制他汀类治疗。\n\
  \n成本比较显示了前景：使用 AI 和领先风险评分指标的研究计划将净重新分类改善（`NRI`）提高了 5-10%，并将误诊率降低了 47%，与传统方法相比，每\
  \ 10 万名患者的相关不良事件、医生就诊和住院成本估计减少了约 64.4 万美元。\n\n#### 药物基因组学：更少的失败\n\n正如我们在第 4 章中看到的\
  \ Emily 的故事，传统的处方方法通常遵循试错法。在精神病或心脏病学等领域，患者在找到有效的药物之前，可能需要尝试多种药物。这个过程在情感和财务上都是低效且昂昂的。药物基因组学改变了这一点。通过基因检测识别患者如何代谢药物，临床医生可以避免无效或有害的选择。AI\
  \ 进一步推进了这一点，通过解释复杂的药物-基因相互作用并在 `EHR` 系统中标记禁忌症。\n\n范德堡医学中心是早期的先驱，创建了增强护理与治疗决策的药物基因组学资源（`PREDICT`）计划。同样，梅奥医学中心通过其个体化医学中心在整个患者护理范围内实施了\
  \ AI 驱动的药物基因组学。\n\n![图 11-4：预测性药物基因组学测试临床整合概述 ¶ 来源：[21]/Frontiers Media/CC BY 4.0](images/c11f004.png)\n\
  \n**图 11-4：** 预测性药物基因组学测试临床整合概述 ¶ 来源：[21]/Frontiers Media/CC BY 4.0\n\n\n\n\n\n\
  寻求罕见病答案的家庭往往要忍受多年的误诊和不必要的检查。财务和情感成本令人震惊。2023 年的一项研究发现，平均诊断历程持续超过六年，每位患者的平均成本超过 20\
  \ 万美元。\n\n为了应对这一挑战，诸如 `Face2Gene` 等 AI 平台被开发出来用于将面部表型与已知综合征进行匹配，加速对罕见病的识别。在包含 360\
  \ 种综合征的范围内，`Face2Gene` 的成功率达到 56% 到 100% 不等，缩短了诊断历程并产生了比例性的成本节省。`Face2Gene` 向医疗保健提供者免费提供。\n\
  \n此外，受 `NIH` 支持的未诊断疾病网络（`UDN`）利用全基因组测序结合 AI 增强的变异解释。自 2015 年成立以来，`UDN` 通过 24 个参与健康系统的协作分析，诊断了\
  \ 855 例此前未解决的病例，并评估了 503 例新病例。新病例被转入该网络的`模型生物筛选中心`，利用果蝇和其他生物的基因组复制来识别并模拟临床治疗方案。\n\
  \n尽管测序成本已大幅下降，但增加价值来自于减轻解释负担并加速临床决策的 AI 工具。\n\n## 行为健康\n\n心理健康服务面临供不应求的压力，往往因长达数月的等待名单而延迟，并局限于药物驱动的方法——这为\
  \ AI 驱动的改进提供了肥沃土壤。\n\n基于 AI 的解决方案如 `Woebot` 和 `Wysa`，使用自然语言处理（`NLP`）通过聊天界面提供对话式认知行为疗法（`CBT`）。尽管它们不能替代执业治疗师，但它们起到了早期分诊和支持工具的作用。\n\
  \n> 注意 自然语言处理（`NLP`）是 AI 的分支，使计算机能够理解、解释和生成人类语言。它结合了语言学、计算机科学和机器学习来处理和分析自然语言数据。\n\
  \n> 认知行为疗法（`CBT`）是一种结构化的、以目标为导向的心理治疗形式，帮助个体识别并改变负面思维模式和行为。它广泛用于治疗抑郁、焦虑和恐惧症等状况，通过促进更健康的思维和应对策略。\n\
  \n在一项随机对照试验中，`Woebot` 的 AI 引导聊天机器人在减少抑郁症状方面的有效性与医生引导的治疗相当，实现了相似的临床结果。此外，用户在三到五天内与\
  \ `Woebot` 建立了治疗纽带，而人类治疗师需要两到六周，且这种纽带在没有人类互动的情况下随时间保持稳定。\n\n在临床方面，AI 增强的药物基因组学和如\
  \ `Aifred Health` 等 NLP 工具正在帮助精神医生为患者匹配正确的抗抑郁药物。在对 61 名患者的随机对照试验中，`Aifred` 的 AI\
  \ 驱动的`临床决策支持系统`实现了 28.6% 的缓解率，而对照组为零。\n\n## 慢性疾病\n\n最后，正如我们在第二章中学到的，糖尿病、哮喘和高血压等慢性疾病导致了大部分医疗支出，其死亡率几乎是所有其他原因总和四倍。\n\
  \n由 AI 和实时数据驱动的精准管理开始改变这一局面。在慢性疾病最大的领域之一——糖尿病中，一个显著的例子是 `Livongo`（现为 `Teladoc Health`\
  \ 的一部分），它利用 AI 解释持续血糖监测（`CGM`）数据、饮食输入和行为信号，以个性化糖尿病管理。\n\n在 2017 年的成果分析中，`Livongo`\
  \ 患者在一年内的 `HbA1c` 降低了 0.9%。该计划报告每位参与者每月节省成本 83 美，与非 `Livongo` 患者相比节省了 5.8%，主要是通过减少急性护理的使用。\n\
  \n另一个例子是 `Propeller Health` 针对哮喘和慢阻肺（`COPD`）的解决方案。`Propeller` 使用连接吸入器传感器和 AI 驱动的分析实时监控药物使用情况、环境触发因素和症状模式。该系统并非完全依赖患者的自述或零星的就诊，而是通过检测恶化的早期预警信号并相应调整治疗提示来实现个性化护理。\n\
  \n在临床结果研究中，`Propeller` 用户的哮喘相关急诊次数减少了 57%（`COPD` 减少了 35%），每日药物依从性提高了 58%。\n\n`Omada\
  \ Health` 也在推进高血压和心血管风险管理的精准医学。`Omada` 平台结合了连接血压计、生活方式改变计划、AI 驱动的教练和远程临床监测，为每个参与者定制干预方案。与静态教育材料或标准门诊不同，`Omada`\
  \ 根据实时生命体征、参与程度和行为趋势动态调整护理计划。\n\n参加 `Omada` 计划的参与者一年后平均收缩压降低了 8.1 mmHg，舒缩压降低了 4.1\
  \ mmHg——这些收益显著降低心血管事件的风险。\n\n## 注意事项：有时精准并不更好\n\n尽管有上述示例，精准医学并不总是更便宜的。在某些情况下，它可以推高成本，特别是当过度检测或治疗选择未基于证据时。例如，在没有明确临床指征的情况下提供的广泛基因组检测可能会产生意义不明的变异，促使进一步的、通常是不必要的检查。如果没有强大的\
  \ AI 决策支持来结合背景化风险和收益，精准可能会变成过剩。\n\n教训是？当 AI 增强的精准被选择性、审慎地应用于具有明确成本效益比的情况下时，价值就会产生。\n\
  \nAI 辅助的精准医学并非万灵药，但当针对正确目标时，它将医学从一个反应性的、碎片化的系统转变为个性化的、主动的系统。通过这样做，它通常能改善结果并降低成本。\n\
  \n从癌症到慢性疾病，从罕见诊断到行为健康，证据指向一个有力的结论：精准不仅关乎准确性，更关乎价值。整合 AI、基因组学和真实数据的系统处于领先这一变革的位置。下一个前沿将公平地扩大这些方法，使其收益不仅惠及那些负担得起的人，而且惠及每一个患者。\n\
  \n## 塑造 AI 医疗未来的公司\n\n除了已有的示例外，基因组革命正在迅速将理论承诺转化为实践。先驱公司通过将 AI 与基因组数据相结合来个性化治疗、改善结果并每天降低成本，推动护理。以下是推动\
  \ AI 医疗的关键者。\n\n### 癌症检测与治疗\n\n`Grail`。`Grail` 的 `Galleri` 测试利用 AI 分析血液中游离的 DNA\
  \ 片，通过单次抽即可检测 50 多种癌症。该测试使用在大型基因组数据集上训练的机器学习模型来识别与不同癌症相关的微妙甲基化信号，以高特异性区分恶性与非恶性样本。通过将\
  \ AI 驱动的模式识别与生物学洞察相结合，`Galleri` 能够在早期检测到传统筛选方法经常遗漏的癌症。\n\n\n\n\n\n`Tempus`。本文此前提到的\
  \ `Tempus` 将 AI 驱动的肿瘤测序与精准治疗方案相结合。它与美国 65% 以上的学术医学中心和 50% 以上的肿瘤学家合作，促进了个性化癌症护理。通过分析结构化和非结构化的临床数据以及基因组谱并匹配靶向治疗，这种\
  \ AI 引导的整合优化了治疗选择并简化了获取精准医疗的途径。\n\n`Foundation Medicine`。`Foundation Medicine` 开发了\
  \ FDA 批准的辅助诊断工具，通过分析 300 多种癌症相关基因来指导靶向治疗。`FoundationOne` 测试使用 AI 驱动的算法检测具有临床意义的突变，解释复杂的基因特征，并将患者与适当治疗匹配。这一过程将原始测序数据转换为患者特定的见解，帮助临床医生更快做出精确治疗决策。\n\
  \n## 心血管代谢与预防健康\n\n`Cleerly`。`Cleerly` 开发了一个 AI 驱动的冠动脉成像平台，通过分析冠状动脉计算机断层扫描血管影 (`CCTA`)\
  \ 来评估心脏疾病风险。其机器学习算法能够自动识别、量化并表征动脉硬化斑块，提供传统上需要专家解读的详细客观评估。通过将复杂的成像数据转换为可操作的见解，`Cleerly`平台实现了更早、更精准地检测心血管风险。\n\
  \n`Klinrisk`。`Klinrisk` 开发了一个 AI 驱动的模型，通过分析实验室检查、人口统计数据和临床史的模式，预测个人慢性肾病 (`CKD`)\
  \ 的进展风险。`Klinrisk` 模型能够早期识别高风险患者。该模型已在美国大型数据中通过验证，目前可供支付方和健康计划用于人口级风险管理，但尚未获得美国临床使用的批准。\n\
  \n`K Health`。`K Health` 及其同名应用程序利用 AI 驱动虚拟初级保健平台，分析数百万匿名的电子健康记录和用户报告的症状以生成个性化的诊断见解。其机器学习模型通过将每个用户的案例与相似医疗史的大型数据集进行比较，识别可能的疾病，使服务人员在远程咨询期间能够更快地做出基于数据的信息决策。\n\
  \n## 药物基因组学与微生物组\n\n`Arine`。`Arine` 采用先进的 AI 算法管理并优化复杂患者群体的药物治疗。该平台整合了药物基因组学见解、药物史和临床数据，指导支付方和医疗服务者关注高风险患者。通过持续学习患者结果，`Arine`\
  \ 的 AI 实现了更智能的干预，增强了遵循性，减少了风险并填补了药物管理的关键差距，特别是对于慢性疾病和多种用药的个人。\n\n`BiomeSense`。`BiomeSense`\
  \ 将持续微生物组监测与 AI 驱动的分析相结合，开启精准健康的新前沿。通过其 `GutLab` 采样技术和 `MetaBiome` 生物信息学平台，`BiomeSense`\
  \ 捕捉实时微生物组数据并应用机器学习模型发现可操作的微生物模式。这使得对健康状态的预测更精确，并根据个人的肠道微生物组特征指导针对性干预。\n\n## 罕见病与儿童基因组学\n\
  \n`Fabric Genomics`。`Fabric Genomics` 的 `Fabric GEM` 是一个 AI 驱动的分析平台，加速了全基因组和外显子组的解读。使用先进的机器学习算法，`Fabric\
  \ GEM` 分析数百万遗传变异，优先考虑可能的致病突变，并生成结构化报告以支持临床决策。通过自动化复杂的基因组分析，该平台实现了范围内罕见病和遗传疾病更快速、更具扩展性的精准诊断。\n\
  \n`Face2Gene`。正如“成本与结果”部分提到的，`FDNA` 开发了 `Face2Gene`，这是一个 AI 驱动的平台，通过分析面部特征辅助诊断罕见遗传疾病。使用在大型临床图像数据集训练的深度学习算法，`Face2Gene`\
  \ 识别指示潜在遗传状况的微妙表型模式。通过增强传统的诊断方法，该平台支持更快、更准确的遗传评估。\n\n`Rady Children’s Institute\
  \ for Genomic Medicine`。`Rady Children’s Institute` 开发了一个 AI 辅助流程，自动化儿童全基因组测序数据的分析和解读。通过将机器学习算法与临床数据库及变异优先级工具相结合，该平台能够快速识别危重婴儿中的潜在致病突变。\n\
  \n这些进展非常出色，但先驱公司驱动的创新只是故事的一部分。随着精准医疗从研究机构进入日常护理，其未来日益取决于个人的参与。患者、参与者和倡导者现在有能力通过选择、支持和参与这些新工具和方法来塑造下一代医疗保健。让我们接下来看看如何在用户层面加速这一进程。\n\
  \n## 你可以做什么\n\n尽管讨论的许多技术可能看起来尖端或限于研究环境，但个人现在可以采取越来越多实用的步骤来参与精准医疗：\n\n-   **佩戴可穿戴设备**。使用如\
  \ `Apple Watch` 或 `Fitbit` 等与 `Livongo` 等平台集成的数字健康工具。这些工具有助于个性化护理并生成 AI 系统改进建议所需的真实世界数据。\n\
  -   **与医生交流**。如果你经历过多种药物副作用或有复杂的治疗史，请咨询医生进行药物基因组测试。这些测试通常涵盖行为健康、心脏和其他疾病的保险。\n- \
  \  **选择精准医疗提供者**。选择宣传整合精准医疗的团队或健康系统，无论是通过遗传咨询、AI 驱动的筛选还是获取基因组测序。\n-   **保持信息通**。与\
  \ `Mayo Clinic`、`NIH` 或当地的学术医学中心等可靠资源建立联系。许多机构现在提供有关遗传和个性化护理方案的免费网络研讨会或咨询。\n-  \
  \ **加入研究项目**。`NIH` 的 `All of Us Research Program` 以及你所在健康系统的本地生物库等大规模研究，有助于开发更具包容性和更强大的\
  \ AI 模型，确保未来的工具能反映多样化的人口。\n-   **倡导获得更好的机会**。如果你或你的亲人从基因组测试或精准方案中受益，了解保险标准并与提供者合作通常可以克服官僚障碍。\n\
  \n这些不仅仅是被动的决策。作为患者、参与者和倡导者，个人帮助推动更智能、更个性化和更公平护理的采用。\n\n从人口级医疗到生物学个体化护理的转变，代表了自抗生素或疫苗出现以来医疗领域最深刻的变化之一。在\
  \ AI 的赋能下，由基因组驱动驱动并通过初创公司和世界级机构的交付，精准医疗不再是未来的概念——它是当今不断演进的标准。然而，它的速度和范围不仅取决于创新。它还需要基础设施、教育和参与。\n\
  \n\n\n\n\n当我们进入第 12 章时，我们将探索今日突破之外的内容：新兴的护理模式、数据共享、信任以及 AI 协同演化将如何塑造下一代医学。未来不仅仅是用来等待的——它是需要我们去帮助构建的。\n\
