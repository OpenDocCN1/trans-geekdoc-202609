  \n\n\n艾米再次笑了——因为她一向如此。但当艾米莉转身离开时，她感到腰部传来熟悉的紧绷感，手指因整天忙碌而残留着阵阵的酸痛。艾米莉并没有意识到艾米说的是真话。她微笑是因为那是预期的。因为如果她停下来——如果她让疲惫、酸痛以及这一切沉重感表现出来——人们就会注意到。而注意到会引来艾米并不想回答的问题。\n\
  \n下一个顾客过来了，她想都没想，再次笑了起来。\n\n## 身体的代价\n\n疼痛已经像开启新的一天一样，成了艾米日常生活的一部分。当她醒来时，疼痛就在；在她从床边垂下腿之前，膝盖传来隐隐隐的作痛。当她踏上\
  \ `Metro` 时，疼痛沉降在腰部；在她准备工作时，双手变得僵硬。到了中午，疼痛在她的脚踝跳动，顺着脊椎向上爬，像是一个无声的提醒：她的身体正在记录着这一切。\n\
  \n她学会了在疼痛中穿行，忽视肌肉对每一步移动的抗议。她的工作不会等待疼痛。顾客不断走来，订单源源不断，工作一直持续。\n\n年轻的同事特莉动作夸张地伸了个懒腰，抱怨着需要休息。艾米只是苦笑了一下，摇了摇头。休息是留给年轻人的。当她和他们那个年纪时，也许她会花五分钟，转转肩膀，坐一会儿。但现在？停下来会让情况更糟。慢下来会让酸痛扎得更深，让重新开始变得更加困难。所以她继续忙碌着。新鲜的冰茶需要冲泡。她装满了容器，在换上盖子时手指僵硬。她站在旁边时，厨房里叮当作响，温暖的空气刺着她的衬衫。每一个动作都有代价，但她从不抱怨地付出了代价。因为这就是工作的意义——做该做的事。艾米有工作要做。\n\
  \n当晚餐高峰的人群开始聚集时，艾米听到了自己的名字。“嘿，艾米——你今晚能留到晚吗？”她的老板从厨房里头都没回，显然已经知道了答案。她犹豫了仅仅一秒；她已经好几个小时没有坐下了。她的背很僵，手很酸，头在剧烈跳动。但她知道他为什么问。“好的，没问题，”她说，强挤出一丝微笑，“谢谢。”就这样，他离开了，去忙下一件事了，从未问过她是否真的想留下来。年轻员工们想都不想就请假了，因为知道其他人会替。她从不为此闹事，除非真的快死了，否则从不请假。她不是声音最大或最快的，但她很可靠。在这样的工作中，这已经赢得了一半胜利。\n\
  \n她擦了手，走到餐厅前。很快又有一波顾客会涌进来。这份工作并不光鲜，但它是必要的。这就是成为一个可靠者的隐藏代价：人们会依赖你。他们根据你的可靠性来安排日程，而当你总是在那里、总是在工作、总是说好时，他们就不会注意到你可能也需要休息。艾米挺直身子，微笑着，回到工作中。\n\
  \n## 艾米的年轻岁月：另一种辛劳\n\n艾米曾经拥有过精力，真正的精力，那种能让她脚步轻盈、让她在做晚餐时在厨房里跳舞，并让她毫无顾虑地度过长班的精力。\n\
  \n她结婚得很早——也许太早了。在 25 岁之前有了两个孩子，丈夫总是忙忙碌，追逐下一份工作。稳定并不容易，所以她成了那个恒定的存在，那个确保冰箱是满的、孩子们有所需物资的人。\n\
  \n她从零售业做起：折衬衫、收银、整理那些没人能保持超过五分钟整洁的陈列。这精疲力竭，但是另一种精疲力竭。在那时，她可以站一整天，晚上还能给自己留点余地。那时她也会跳舞——是真的在跳舞。在客厅里，在厨房里，在超市的货架间，孩子们在旁边对着她咯笑。她动作自如，完全没有考虑过之后会有多疼。但零售业薪水微薄，提供的也更少——没有保障，没有福利，凡你能想到的都没有——所以她转到了餐饮业，那里的工资更稳定，小费难以预测，工作也永无停止。\n\
  \n疼痛起初很微小。长班后膝盖的一丝僵硬，腰部的一阵隐隐作痛，虽然会持续但总会在早晨消失。这些都不是她处理不了的。\n\n## 与马克的对话\n\n艾米的丈夫马克看着她。一个傍晚，她慢慢坐到沙发上，动作缓慢而小心，一只手按着腰部。她努力不露痛苦，但他还是看到了。“也许你应该考虑辞掉这份工作，”他轻声说。艾米发出一声干笑。“那干什么？这是我擅长的。”马克叹了口气，揉着后脑勺。“不知道。我们会想办法的。”他们从未想出来。\n\
  \n\n\n艾米工作是因为她必须工作。因为账单不会自己付，因为冰箱里不会魔法般地出现食物，因为她的家人需要她。她工作是因为她一直以来都是这么做的。从从小起，她就打卡上班，感受着手中工资条带来的那份自豪。她很早就明白，工作意味着安全感，意味着一天结束时疲惫的双意味着餐桌上有饭吃，意味着即使在艰难时刻准时出现也是意义的。\n\
  \n所以她继续坚持下去。即使她的身体在抗议，疼痛像一个不速客的宾客一样渗进骨子里。即使当马克用那种交织着爱与无奈的熟悉表情告诉她慢一点时。“怎么，难道要让我错过所有的乐趣吗？”她开着玩笑道，整个人陷进椅子里。马克只是摇了摇头：“你真是没救了。”也许她确实如此。也许她不知道如何停下来。也许，即使她可以停，她也不会停。因为在内心深处，她依然那个在惯例、在运动、在简单的行动中寻找慰藉的女孩。于是，她伸了伸身体，转了转肩膀，为新的一天做好了准备。因为工作就是工作——也是她自己。\n\
  \n## 一辈子的耸肩叹息\n\n艾米翻着一本旧杂志，几乎没看书页的内容。候诊室里弥漫着消毒水和旧旧地毯的味道，那是她熟悉的气味。其他几名患者散坐在四周，有的盯着手机，有的像她一样只是在等待。她已经知道这次就诊会如何进行了。护士会叫她进去，检查她的体重，测量她的血压。问她今天是因为什么来就的，尽管答案和上次完全一样——然后医生就会进来。几乎不看她的病历；几乎不看她一眼。“这只是老化的常态。”\n\
  \n艾米已经数不清听过这句话多少次了。那是熟悉的调调，同样的剧本，只是不同的办公室。他们会建议常规的疗法——拉伸、转诊物理治疗、也许还有一些外用药膏。没人问过她的工作。没问过她站着工作的时长、搬运、弯腰、移动。没问过那种让她的骨头感觉比平时沉重的疲惫。如果他们问了，也许就能理解为什么物理治疗并不现实。为什么“仅仅休息”不是选项。她想问——当疼痛不消失时会怎样？当它不仅仅是“老了”时？但她已经知道他们会如何回答。\n\
  \n艾米叹了口气，合上杂志。护士叫了她的名字，她起身，忍着膝盖的钝痛。又一次就诊，又一次无奈。\n\n## 止痛药的虚假希望\n\n花了几年，医生终于给她开了了处方。“这些应该会有帮助，”他一边把单子递给她，“按需要服用。”\n\
  \n艾米犹豫了。她不喜欢吃药，但她太绝望了。疼痛正在消磨她，将她的日子变成了她勉强才能完成的马拉松。如果这是坚持下去的代价，也许值得一试。\n\n第一片药让她感觉……不对劲。疼痛减轻了，但其他一切也随之迟钝了。她感到头脑发昏，思绪像在糖浆中挣扎。她的胃翻腾着，一种深层的恶心感持续了整整天。她的动作慢了。遗忘了事情。不得不反复检查，有时还要检查三遍。她的注意力尽管疲惫但曾很敏锐，现在感觉像正在流失。第一周结束时，她意识到了一件可怕的事：工作并没有变得更容易。反而更难了。她硬撑着，希望身体能适应。但那些药并不只是减轻了疼痛的锐度。它们磨灭了她的锐气。接着是恐惧。\n\
  \n她听过那些故事——人们起初只吃几片药，只在需要时吃，直到某一天，他们需要一直吃。直到药片接管了身体。她不会让那种事情发生。所以在一个早晨，她直接停了。\n\n\
  疼痛回来了——像一个躲在阴影里的老敌人——但至少她感觉找回了自己。至少疼痛是她的。由她来承担，由她来应对，由她去克服。像往常一样，艾米继续移动。\n\n那是一个糟糕的下午。那种让她的身体感觉像被拧干并丢在一边的日子。当她回到家时，她几乎无法走路了。她的膝盖肿胀、僵硬，每走一步都剧痛。她的腰部在灼烧，疼痛深层、尖锐、无孔不入。\n\
  \n马克看了她一眼，摇了摇头：“艾米，你需要去医院看看。“我会没事的，”她咕囔着，挪到沙发上时缩了缩脸。“不，你不会。”他在她面前蹲下，手按她的膝盖上。“来吧。就这一次，我们别为了这事吵架。”\n\
  \n她想跟他争辩。想告诉他这毫无意义，什么都没有改变。但现在的疼痛感觉不同了——更糟了。她没有精力去争论。她让他扶着她走向车旁。\n\n## 无力感\n\n医院急诊室挤满了人，人们瘫坐在椅子上，不安地挪动着，低声私语。艾米找了个坐下，开始等待。时间流逝，她看着时，听着护士叫名字，看着那些有更“紧急”问题的人排在她前面。当他们终于叫到她时，离黎明只有几个小时。\n\
  \n艾米僵硬地坐在铺了纸的检查诊台上，疲惫和疼痛像重量一样压在她身上。医生年轻而匆忙，在翻看了几秒病历后才看她。“你考虑过减肥吗？”艾米眨了眨眼。她想尖叫。我考虑过，我敷过冰，我吃了让我感觉像自己皮肤里的陌生人一样的药。医生在病历上写了些什么，离开了，已经在想下一个患者了。而艾米坐在那里，疼痛依旧，深知什么都没有改变。\n\
  \n艾米走出急诊室，来到清晨的空气中，天空残留着夜晚最后的痕迹。城市正在醒来——汽车在街道上穿梭，人们上班，世界运转得仿佛什么都没发生过。她走得很慢，每一步都在提醒她为什么要来。\n\
  \n马克打开副驾，仔细看着她，等着她说话。她无话。什么都没有改变。\n\n 担忧的声音\n\n艾米帮助厨房工作人员时，咖啡机发出嘶嘶声，气味弥漫在空气中。她像既往那样机械，带着微笑。又一天，又一个顾客，又一种疼痛。她的关节今天特别糟糕，由于不断的转身、搬运、移动而变得僵硬酸痛。在帮助另一位顾客时，她下意识地揉着手，活动着手指以缓解不适。\n\
  \n\n\n\n就在那时，她注意了他。一个穿着整洁纽扣衫、戴着眼镜的男人站在餐厅内部，盯着她的手。他并不不耐烦，不像那种等得太久的客户——只是在……观察。当她把找零递给他时，他开口了。\n\
  \n“慢性疼痛？”艾米发出一声干涩而疲惫的笑，“还有别的吗？”她预料到了那种反应——礼貌的轻笑、点头，也许还有几句关于这有多艰难的模糊评论。人们总是出于好好的，但寒聊并没有帮助。相反，他接下来的话让她彻底愣住了。\n\
  \n“可能有一些真正有帮助的方法。”\n\n艾米眨了眨眼。帮助？真正的帮助？而不只是冰敷、药膏、药物和无用的建议？她不确定该嗤之以鼻还是倾听。但他声音里的某种东西——冷静、确定——让她停顿了。第一次，有人不再只是对他耸耸肩。这已经足够让她产生了好奇。艾米处理了下一位客户的订单，手依然在手腕上无意识地揉着。穿纽扣衫的男人还没离开。他多观察了她片刻，才再次开口。\n\
  \n“你曾经用精准医学分析过你的疼痛吗？”艾米眨了眨眼。“我的什么？”\n\n她预以为他会说些关于拉伸或换双鞋的话，甚至可能建议她“轻松点”。但从未有人要求她用一种不仅仅是忍受的方式去思考她的疼痛。\n\
  \n他笑了，调整了一下眼镜。“我在医学中心工作。我们正在运行一个计划，从不同的角度看待慢性疼痛，不再把它当作需要‘硬挺过去’的东西，而是需要被理解的东西。”艾米挑起一边眉毛。“理解？”\n\
  \n“我们不是把疼痛当作一种普通的疾病来对待，我们看的是你。你独特的生物特性、你的工作、你的日常活动、你的基因——甚至是环境因素。我们不猜测什么可能有帮助：我们使用真实数据来找出什么有效。”艾米盯着他，既怀疑又好奇。\n\
  \n“有什么猫端吗？”她交叉双臂问道。“没有猫端，”他说，“只是有一个机会弄清楚你身上发生了什么——并为此采取行动。”\n\n艾米不确定自己是否相信他。但这是第一次有人把她的疼痛看作是值得研究的事。\n\
  \n## 治疗人，而非症状\n\n艾米靠在柜台上，双臂交叉，虽然怀疑但一直在听。那个男人——本·米勒医生，他自我介绍过自己——在继续之前仔细地观察了她的反应。\n\
  \n“现在的大多数疼痛治疗都是一场猜谜游戏，”他说。“医生们给每个人开同样的药，做同样的物理治疗，给同样的通用建议。但疼痛不是一种东西。它对每个人来说都是不同的。所以，我们为什么要像对待它们都一样地对待它呢？”艾米耸耸肩：“你找错人了。我只是听他们说的。”米勒医生摇了摇头。“这就是问题所在。我们一直在告诉你们错误的信息。”她挑起眉毛。“是吗？”\n\
  \n他点了点头。“我们在医学中心使用大数据和高级分析来研究慢性疼痛——不仅将其视为症状，而是视为一种有病因的状况。我们分析了成千上万的案例寻找模式，并发现不同的人对不同的干预措施反应最好。有些人需要针对性的物理治疗，要真正考虑到他们的工作和日常活动；有些人则需要神经刺激来缓解过度活跃的疼痛信号。还有人需要根据其基因图谱定制非阿片类药物。”\n\
  \n艾米皱起眉头。“基因图谱？”“是的，”他说。“你的基因影响你处理疼痛的方式——你的神经是否会过度反应，炎症是否会持续存在，甚至某些药物对你有多有效。与其猜测，我们现在可以进行测试。我们可以具体地看到你身体里发生了什么，并根据真实数据进行针对性治疗。”艾米看向自己的手，弯动着她酸痛的手指。“所以……而不只是掩盖疼痛——”“我们弄清楚它最初发生的原因，”米勒医生补充道。艾米缓慢地呼了一口气。\n\
  \n多年来，医生一直把她的疼痛当成一种不便——一种需要管理、忍受和接受的东西。从未有人建议过它是有因的。她不确定自己是否已经信任这种新方法，但现在，有人在告诉她她的疼痛很重要。米勒医生没有强迫。他只是看着她，耐心、稳稳，仿佛他完全知道她在想什么。也许他确实知道——因为与那些无视她的医生不同，他没有递给她处处方，没有告诉她这会‘治好’她。他甚至没有承诺治愈……他只是在看着她。\n\
  \n“你愿意了解更多吗？”艾米犹豫了。她能听到脑海里马克的声音——“轻松点”。但这种感觉很不同。她呼了口气，揉着酸痛的手臂，仿佛在权衡这个决定。\n\n最后，她点了点头。“我没什么损失的。”米勒医生笑了。“这正是我希望你说的。”艾米不知道这是否会有任何结果。但在经历了多年空洞的建议后，她不再是被告知去忍受。\n\
  \n## 弄清原因的力量\n\n艾米站在医学中心外，盯着玻璃门。那个男人——本·米勒医生，他自我介绍过自己——在继续之前仔细地观察了她的反应。\n\n现在的大多数疼痛治疗都是一场猜谜游戏，”他说。“医生们给每个人开同样的药，做同样的物理治疗，给同样的通用建议。但疼痛不是一种东西。它对每个人来说都是不同的。所以，我们为什么要像对待它们都一样地对待它呢？”艾米耸耸肩：“你找错人了。我只是听他们说的。”米勒医生摇了摇头。“这就是问题所在。我们一直在告诉你们错误的信息。”她挑起眉毛。“是吗？”\n\
