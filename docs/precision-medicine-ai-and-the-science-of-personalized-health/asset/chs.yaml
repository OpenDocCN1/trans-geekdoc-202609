  \n# 关于作者\n\n![](img/ffirsuf001.png)\n\n`James Wallace` 是一位医疗健康战略师、研究人员和执行官，在个性化医学方面拥有深厚的专业知识。他是美国陆军学院的毕业生，拥有哈佛商学院的\
  \ MBA 学位和佛罗里达州南立大学的工商管理博士学位。\n\n在跨越多个学科的创新、交付和政策职业生涯中，Jim 曾为医疗提供者、投资者和政策制定者就人工智能、情感认知系统和精准医学在现实世界的应用提供建议。\n\
  \nJim 是塑造医疗健康未来的国内外国际论坛的频繁演讲者。在不在履行未来承诺时，他喜欢在新罕布什州和亚利桑那州徒步露营——并渴望加入第一艘前往火星的“星舰”。\n\
