    # Metabase


    Metabase is a database abstraction layer for SQL-compliant databases. Developed
    by Manuel Lemos as an open-source software project, Metabase is available under
    the BSD license, and can be downloaded from http://www.phclasses.org/package/20.html.


    # Design Goals


    Metabase was designed to accomplish two main goals:


    +   - Provide a database-independent API for PHP applications

    - Provide a database-independent mechanism for maintaining and updating database
    schema


    Metabase accomplishes the first goal using PHP, and the second using a combination
    of PHP and XML.


    # Application Components


    Metabase consists of the following components, implemented as PHP classes:


    +   - A database-independent public interface, or API, that developers can use
    in their application

    - Database-specific "drivers" that implement public interface methods for database
    type

    - A manager to handle database schema comparison, installation, and upgrade

    - A Metabase-specific parser, which verifies the syntax and structure of an XML-encoded
    database schema

    - A generic XML parser, which is used to convert any XML document into a native
    PHP structure


    # Abstract Thinking


    If you''ve worked with databases, you already know that PHP comes with a different
    set of database-manipulation functions for each database type. For example, opening
    a connection to a MySQL database is accomplished via the mysqli_connect() function,
    whereas opening a connection to an Oracle database is accomplished via the OciLogin()
    function.


    With this in mind, it follows that any change to the database server used in a
    PHP application immediately implies a change to the application code—specifically,
    to the native PHP functions used to manipulate the'
