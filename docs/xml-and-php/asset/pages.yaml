- pgno: 384
  md: '# # Colophon


    Pictured on the cover of this book is a photograph of Stonehenge, one of the oldest
    and best-preserved megalithic structures in the world. Located on the Salisbury
    Plain in Wiltshire, England, this ancient British icon consists of a series of
    concentric rings constructed from gigantic sarsen stones and smaller bluestones.
    The sarsen stones that make up the outer circle of the henge weigh as much as
    25 tons and are said to have been transported at least twenty miles over steep
    hills. Estimates suggest that it would taken approximately 600 men to move each
    stone and many millions of hours of labor to build the entire structure.


    The original purpose of Stonehenge is unclear, although many theories swirl around
    this mysterious landmark. Some theorists suggest that it was constructed as a
    temple for worshipping ancient earth deities; others credit it with being an ancient
    burial ground for nobleman; and still others refer to it as a gigantic sun clock,
    a primitive calculator, or an astronomical observatory to mark events on a prehistoric
    calendar. Whatever its original purpose, the ruined structure, with some of its
    upright stones rising to a height of over 18 feet, still remains an awe-inspiring—and
    thought-provoking—sight.


    This book was written and edited in Microsoft Word, and laid out in QuarkPress.
    The font used for the body text is Benbo and MCPdigital. It was printed on 50#
    Husky Offset Smooth paper at VonHoffman Graphics Inc., in Owensville, Missouri.
    Prepress consisted of PostScript computer-to-plate technology (filmless process).
    The cover was printed at Moore Langen Printing in Terre Haute, Indiana, on 12
    pt., coated on one side.'
