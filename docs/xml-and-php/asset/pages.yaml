- pgno: 26
  md: '+   - attributes

    - entities

    - notations

    - CDATA blocks

    - processing instructions

    - comments


    These components are explained in the sections that follow.


    # Document Prolog


    Every XML document begins with a special identifier called the document prolog,
    such as


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    ```


    This prolog appears at the top of an XML document and specifies things like the
    XML version and type of encoding used, the location of any DTD that may be used
    to validate the document,and one more entity definitions.

    In Listing 1.2, the prolog contained two entity definitions and one notation:


    ```

    <!ENTITY terms "Payment on delivery. Cash only, no checks or money orders

    =accepted. Returns within 15 days.\ >

    <!ENTITY logo SYSTEM "images/logo.gif" NDATA gif>

    <!!NOTATION gif SYSTEM "gifviewer.exe">

    >

    ```


    # Elements


    The document prolog is followed by one or more elements. Elements are the most
    basic units of XML data—they consist of attributes and content (or character data)
    surrounded by descriptive tags (or markup). Here are three examples:


    ```

    <street>15, Booger Avenue</street>

    <rate>9.99</rate>

    <name>Vampire bat (DNA sequence)</name>

    ```


    To be well-formed, an XML document must contain at least one nonempty element.
    This outermost element, sometimes referred to as the root element, serves as the
    container for the remainder of the document.


    Elements can be empty, contain other elements nested within them, or enclose a
    combination of character data and elements.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Chapter 1 XML and PHP Basics\n\n# Attributes\n\nElements can be enhanced\
    \ further by the addition of attributes, which are name-value pairs that can be\
    \ used to attach any type of additional descriptive information to an element.\
    \ Here are two examples:\n\n```\n<invoice id=\"AS2354R\">\n  <price currency=\"\
    USD\">9.99</price>\n```\n\nIn order to be well-formed, attribute values must be\
    \ enclosed within quotation marks, and attributes cannot be repeated within the\
    \ same element.\n\n# Entities\n\nEntities serve as placeholders for frequently\
    \ used pieces of text within an XML document. They provide a convenient shortcut\
    \ for authors to store and easily update commonly used text snippets.\n\nEntities\
    \ consist of two components:\n\n+   The entity definition, which links an entity\
    \ name to the text block it represents:\n<ENTITY terms \"Payment on delivery.\
    \ Cash only, no checks or money orders accepted. Returns within 15 days.\">\n\
    nThe entity reference, which serves as a placeholder for the longer text block:\n\
    \  &entity;\n\nWhen an XML parser processes an XML document, entity references\
    \ automatically are replaced with their actual values.\nXML comes with five predefined\
    \ entities. You might already be familiar with them if you have worked with HTML\
    \ (see Table 1.1).\n\n| Table 1.1 XML's Five Predefined Entities |\n| Entity |\
    \ Represents |\n| --- | --- |\n| &lt; | The less-than (<) symbol |\n| &gt; | The\
    \ greater-than (>) symbol |\n| &apos; | The single-quote(') symbol |\n| &quot;\
    \ | The double-quote(\"\") symbol |\n| &amp; | The ampersand (&) symbol |\n\n\
    A variant of the regular entity just described is the unparsed entity, typically\
    \ used to reference data that should not be processed by the XML parser. This\
    \ is usually binary data—images, audio files, video streams, and the like. The\
    \ preceding example demonstrates one unparsed entity, which holds the path to\
    \ the company logo:\n\n```\n<ENTITY logo SYSTEM \"images/logo.gif\" NOTATA gif>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Note the NDATA keyword, which tells the parser that it should look up the appropriate
    notation to find out how to handle this data (notations are discussed next).


    In order for a document to be well-formed, entities cannot contain references
    to themselves—think infinite loop and you''ll understand why.


    # Notations


    A notation is an XML construct designed to help the parser identify non-XML data—for
    example, images or sound files—and typically goes in hand with unparsed entities.
    A notation is always enclosed within a notation declaration, which appears either
    within a DTD or the document prolog, and looks like this:


    ```

    <NOTATION notation-name notation-identifier>

    ```


    The notation name is a unique identifier used within unparsed entities, while
    the notation identifier is a string that tells the XML processor how to handle
    that particular entity. This string could be anything from a URL that identifies
    the data type to the location of a program that can decode the data. Here''s an
    example:


    # CDATA Blocks


    CDATA blocks are "boxes" in an XML document, identified by special opening and
    closing delimiters. The text within these boxes is treated by the parser as character
    data, not markup, and can therefore contain special characters which would normally
    cause the parser to generate an error.


    CDATA blocks begin with the special sequence <!CDATA[ and end with the sequence
    ]>. For example,


    ```

    <dna_sequence>

    <!CDATA[

    0101 9394 %425 9393 0209 0220 8348 #577 7493 2543 6646

    ]>

    </dna_sequence>

    ```


    The option to CDATA blocks is, of course, using the predefined entities discussed
    earlier to represent special characters like the less-than (<), greater-than (>),
    and ampersand (&). Because entities allow for reusability within the document,
    using entities is sometimes preferable to using CDATA blocks.


    # Processing Instructions


    Processing instructions (PIs) are special instructions embedded within an XML
    document. These PIs are not usually intended for human readers; rather, they provide
    special information or commands to the XML application responsible for parsing
    the document. Parsers that do not recognize these instructions will simply ignore
    them'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Chapter 1 XML and PHP Basics


    PIs are typically enclosed within <? ... ?> tags, as demonstrated here:


    ```

    <?sales_agent include_promotional_message="1"?>

    ```


    Notice that the very first line in an XML document is actually a PI indicating
    the version number and encoding to the parser:


    ```

    <xml version="1.0" encoding="UTF-8"?>

    ```


    The parser can use this information to make decisions on how to process the XML—
    for example, reject the document if the XML version is unsupported, or switch
    its internal character handling routines to use the encoding specified in the
    prolog.


    # Comments


    Finally, comments provide a simple and convenient way for document authors to
    include human-readable notes within their XML markup. Comments must be placed
    within <-- --> markers, and they are usually ignored by the parser.


    # Ancillary Technologies


    As XML''s popularity has grown, so has an understanding of its capabilities and
    potential; and, in turn, has spawned a new generation of related technologies.
    Together, they are an oft-confusing amass of acronyms and buzzwords; individually,
    each make an important contribution to the overall picture.


    Here''s a list of the best-known XML development efforts underway at the W3C:


    +   - XSL and XSLT. The Extensible Styles Language (XSL) is a language designed
    to handle the presentation of XML-encoded data. The language has three components:
    XSL Transformations (XSLT), which is responsible for restructuring XML data into
    something new and different; XSL Path Language (XPath), which provides constructs
    to access specific parts of an XML document; and XSL Formatting Objects (XSL-FO),
    which is responsible for the formatting and presentation of the new-and-different
    result.


    +   - Xpointer. Xpointer is a mechanism for locating specific nodes within an
    XML document. Xpointer “addresses” use both relative and absolute paths to find
    and identify particular nodes in an XML document and are sometimes used with XLink
    for more precise links between data fragments.


    You can find out more about Xpointer at http://www.w3.org/XML/Linking.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'XLink makes it possible to link resources in much the same way as standard
    HTML hyperlinks. However, XLink takes things a step further, allowing for single
    links that have multiple destinations and offering link authors the ability to
    control the direction of link traversal.


    You can find out more about XLink at http://www.w3.org/XML/Linking.


    XHTML is a re-write of HTML 4.0, combining standard XML rules with HTML markup
    for more efficient and structured pages. By incorporating the best features of
    both versions, XHTML hopes to lay the groundwork for the next generation of web
    applications.


    You can find out more about XHTML at http://www.w3.org/Markup/. Also, see XHTML
    by Chelsea Valentine and Chris Minnick (New Riders Publishing, 2001).


    XML Query. XML Query hopes to do for what SQL does for databases: provide a standard
    interface to XML documents and extract subsets of the data contained within. Possible
    applications of this technology include more efficient full-text searches, multilingual
    search engines, and easier access to XML-encoded information and the relationships
    they embody.


    You can find out more about XML Query at http://www.w3.org/XML/Query.


    XML Schema. Unlike DTDs, XML Schemas are rulesets specifying constraints on XML
    data. Unlike DTDs, they include support for namespaces, derived types and inheritance,
    and merged rulesets, and are expected to quickly supplant DTDs as the tool of
    imposing conformance on XML documents.


    You can find out more about XML Schema at http://www.w3.org/XML/Schema.


    XML Signature. XML Signature offers a mechanism to digitally sign electronic—specifically
    XML—content and verify this signature in an error-free manner at the other end.


    You can find out more about XML Signature at http://www.w3.org/Signature/.


    # Applications


    As the preceding demonstrates, XML has the potential to change the way we deal
    with web-based content. Here are four of XML''s most important applications:


    +   Better searches. Because XML describes data, it can significantly improve
    the indexing techniques used by most popular search engines, thereby resulting
    in faster, more efficient searches and more relevant results. Today, given the
    search term "rock," search engines cannot distinguish between rock, a mass of
    stone, and the musical genre. Tomorrow, document authors will be able to use XML
    to ensure that the distinction between the two is clear.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   Better analysis of data. XSLT makes it possible to create different views
    of the same XML data, simplifying the task of understanding and acting on complex
    business information. Using XSLT, the same XML document can be sliced, diced,
    and served up in an innumerable amount of ways, making it easier to see hidden
    relationships between the data and to gain a better understanding of the big picture.


    +   More efficient content management. By providing document authors with standard
    ways to describe data, XML opens the door to more efficient content management
    and publishing solutions. Publishers can use XML to create, classify, and publish
    data in a standard format; because this data now meets basic rules of structure
    and syntax, it can easily be shared with other XML-compliant organizations.


    +   More efficient information exchange. To businesses, the ease and flexibility
    of the web and the inherent power of XML make a powerful combination, one enables
    a new generation of web applications. These new applications are capable of receiving
    XML data from different sources, integrating these fragments to create a composite
    picture, and using this information to make business decisions on purchases, inventory,
    and billing. This is good for the organization, for the employees, and (let''s
    not forget!) the bottom line.


    Of course, this is just the tip of the iceberg. XML and its related technologies
    are still coming to fruition, and new applications for this family of powerful
    technologies appear all the time.


    If you''d like to learn more about XML, there are a number of very good books
    available to get you up to speed. The book companion web site (http://www.xmlphp.com
    or http://www.newriders.com) has details, with a list of useful websites and mailing
    lists.


    # PHP


    Let us move on PHP, easily my favorite web development language. This section
    provides a brief overview of PHP''s history, capabilities, and applications.


    PHP (the name actually is a recursive acronym for PHP: Hypertext Pre-Processor—you
    know how we are!) became a light in the eye of Rasmus Lerdorf in 1994. For the
    full story, visit http://www.php.net/manual/en/history.php#history). Rasmus needed
    a tool to visit his personal web page; using a C wrapper and special tags embedded
    into the HTML code, became the first version of PHP.


    PHP hit the big time between 1997 and 2000 as more and more sites adopted it.
    The release of PHP 4.0 in 2000 only served to widen its fan base. As a complete
    rewrite of the PHP engine, PHP 4.0 is faster, more scalable, and more full-featured
    than any of its predecessors. It is in use on more than six million websites today,
    and that number is climbing rapidly.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Still wondering exactly what PHP is? Well, to quote its authors, PHP is "...a
    serverside HTML-embedded scripting language...". In English, this means that PHP
    code is typically embedded within HTML documents; this code—variables, functions,
    commands—is interpreted and executed by the server, with the resulting output
    returned to the browser. Special PHP tags are used to distinguish PHP commands
    and regular HTML markup.


    That''s not all, though—PHP also happens to be the most fun language I''ve had
    the opportunity to work over the past few years.


    Unlike other scripting languages, which seem to delict in convoluted syntax and
    tortuous structures, PHP code is clean, easy to read and understand, and incredibly
    user-friendly. The language comes with great documentation, a friendly and knowledgeable
    community, and a feature set that would turn most other web scripting languages
    green. And its development team (more than 300 people across the globe) is constantly
    innovating and adding support for new technologies, ensuring that it''s on the
    cutting edge of new technology. What''s more, PHP''s huge library of built-in
    functions ensures that the most complex tasks can be accomplished in less time
    than you thought possible.


    All of this, would come to want without the active support of real developers.
    Fortunately, PHP has that. The Netcraft survey (http://www.netcraft.com/survey/)
    reveals that PHP usage is growing at the rate of more than 20 percent per month,
    with over 40 percent of the web''s Apache servers running PHP. This widespread
    acceptance can only be music to the ears of PHP''s many devotees, who have elevated
    PHP''s developers to the status of gods and the language itself to the forefront
    of the popularity sweepstakes.


    # ### Language Features


    PHP is a remarkably full-featured programming language, making it the ideal tool
    for developers looking to build complex, high-traffic web sites. Here''s why:


    +   - Portability. PHP distributions are available for a wide variety of platforms,
    including Windows, Macintosh, OS/2, and most flavors of UNIX. Because PHP code
    written on one platform usually works “as is” on any other supported platform,
    PHP can significantly reduce development time in a multiplatform environment.
    (Some PHP functions are platform-specific.)


    +   - Performance. Independent evaluations have demonstrated that PHP is faster
    and more reliable than most other scripting languages. Fortune 500 companies and
    Mom-and-Pop businesses use it to run their web sites. The completely reworked
    engine in PHP 4.0 raises the performance bar even further. Zend Technologies,
    Ltd. (http://zend.com/zend/aboutphp), which played a


    1. Stig Sæther Bakken, Egon Schmidt, et al. PHP Manual. Available from Internet:

    http://www.php.net/manual/en'
