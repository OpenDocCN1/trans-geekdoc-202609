    # A Few Examples


    So that''s the theory.There wasn''t much of it, but don''t let that discourage
    you—it''s possible to build some powerful distributed applications using the simple
    functions described in the previous sections.


    # Information Delivery with WDDX and HTTP


    This section discusses one of the most popular applications of this technology,
    using it to build a primitive push/pull engine for information delivery over the
    web. I''ll be using a MySQL database as the data source, WDDX to represent the
    data, and PHP to perform the actual mechanics of the transaction.


    # Requirements


    Let''s assume the existence of a fictional corporation—XTI Inc.—that plans to
    start an online subscription service offering access to share market data. It
    already has access to this information via an independent source, and its database
    of stocks and their prices is automatically updated every few minutes with the
    latest market data. XTI''s plan is to offer customers access to this data, allowing
    them to use it on their web sites in exchange for a monthly subscription fee.


    Listing 5.16 has a slice of the MySQL table that holds the data we''re interested
    in.'
