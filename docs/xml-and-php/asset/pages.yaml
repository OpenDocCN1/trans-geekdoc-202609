    \ and dumpmem() methods come handy when you're creating or modifying an XML document\
    \ tree in memory (discussed in detail in the “Manipulating DOM Trees” section).\n\
    \n# X Marks the Spot\n\nIn case you're wondering, XPath, or the XML Path Language,\
