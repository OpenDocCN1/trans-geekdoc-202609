- pgno: 128
  md: '![](img/df1553d823d294a2dc53fc5d66efb8fd_128_0.png)


    Figure 4.1 An HTML page created via an XSL Transformation.


    # PHP and XSLT


    Although there is nothing to stop you from creating an XML document and corresponding
    XSLT stylesheet, you typically need to rely on a third-party XSLT processor (such
    as Sablotron) to combine the two. Web browsers today have limited XML parsing
    capabilities, and even less support for XSLT processing; this implies that an
    intermediary layer, such as PHP, is required to perform the task of formatting
    XML data per XSLT-specified templates.


    PHP 4.0.6 (and later) comes with an XSL extension specifically designed to provide
    a consistent interface to different XSLT processors (Sablotron, Xalan, and so
    on). Created by Sterling Hughes, this XSLT extension works much like an abstraction
    layer, exposing a generic API that can be used to interact with any compatible
    XSLT processor. Because the functions defined in this API are common to most XSLT
    engines, it allows developers to switch between different processors without requiring
    any changes to the PHP code or application layer.


    If you''re using a stock PHP binary, it''s quite likely that you''ll need to recompile
    PHP to add support for this extension to your PHP build (detailed instructions
    for accomplishing this are available in Appendix A, "Recompiling PHP to Add XML
    Support").


    As of PHP 4.1.1, the XSL extension supports only the Sablotron engine, although
    you can expect to see support for other XSLT engines in future PHP releases.'
  merge: -1
  img_proc: true
- pgno: 129
  md: "# 110 Chapter 4 PHP and Extensible Stylesheet Language Transformations (XSLT)\n\
    \nEarlier versions of PHP supported a different Sablotron-specific extension that\
    \ was activated by adding the --with-sablot option during the build process. Extension\
    \ has now been superseded by the newer, more generic API described in the \"PHP\
    \ and XSLT\" section. If you're using a PHP build earlier than 4.0.6, you should\
    \ upgrade to the latest version in order to use the functions discussed in this\
    \ chapter.\n\n# A Sample Example\n\nPHP's XSLT extension exposes a number of functions\
    \ to easily transform XML documents into other formats. Together, these functions\
    \ can be organized into a standard process that is applicable to all XSL Transformations\
    \ performed with PHP.\n\nIn order to demonstrate this, consider the PHP script\
    \ in Listing 4.3, which uses the XML and XSLT documents from Listing 4.1 and Listing\
    \ 4.2 to carry out an XSL Transformation on the server and return the generated\
    \ result tree to the browser.\n\n+   Listing 4.3 Performing an XSL Transformation\
    \ with PHP\n\n```\n<?php\n// set the filenames\n$xml_file = 'list.xml';\n$xslt_file\
    \ = 'list.xsl';\n\n// create the XSLT processor\n$xp = xslt_create() or die(\"\
    Could not create XSLT processor\");\n\n// process the two files to get the desired\
    \ output\nif($result = xslt_process($xp, $xml_file, $xslt_file)) {\n    // print\
    \ output\n    echo $result;\n} else {\n    // else display error\n    echo \"\
    An error occurred: \" . xslt_error($xp) . \" *(error code * \" . $xslt_errno($xp)\
    \ . \" \")*\";\n}\n\n// free the resources occupied by the handler\nxslt_free($xp);\n\
    ?>\n```"
  merge: -1
  img_proc: true
- pgno: 130
  md: "# PHP and XSLT 111\n\nThis is much simpler than it. Let's go through it step\
    \ by step:\n\n+   1. The first order of business is to create an instance of the\
    \ XSLT processor, which is accomplished via PHP's xslt_create() function.\n\n\
    ```\n$xp = xslt_create() or die('Could not create XSLT processor\\');\n```\n\n\
    The resulting handle is assigned to a variable, and it is used in calls to subsequent\
    \ XSLT functions.\n\n+   2. Next, the stylesheet and XML source need to be processed.\
    \ For this purpose, PHP offers the xslt_process() function which accepts three\
    \ arguments: a handle for the XSLT processor, the name of the file containing\
    \ the XML data, and the name of the file containing the XSLT template rules.\n\
    \n```\nif($result = xslt_process($xp, $xml_file, $xslt_file)) {\n    echo $result;\n\
    } else {\n    echo \"An error occurred: \" . xslt_error($xp) . \" (error code\
    \ \" . $xslt_errno($xp) . \")\";\n}\n```\n\nThe xslt_process() function is the\
    \ real workhorse here—it reads the XML source tree, which rules against the XSLT\
    \ stylesheet, and outputs a new result tree. The results of the transformation\
    \ are assigned to a variable ($result in the previous example). Note that for\
    \ large or complex transformations, the process can take awhile.\n\n# Windows\
    \ on the World\n\nIf you're using Windows, you'll need to specify the full path\
    \ to the XML and XSL files for these examples to work correctly.\n\nMost often,\
    \ you want to store and display the results of the transformation to the user.\
    \ If, however, you prefer to write the result tree to a file, you can specify\
    \ the filename as an optional fourth argument to xslt_process(). For example,\
    \ check out Listing 4.20.\n\nIf the processing is successful, all that remains\
    \ is to output the result. If it is not successful, however, the xslt_error()\
    \ and xslt_errno() functions can be used to obtain error information (see the\
    \ \"Handling Errors\" section for more on these functions)."
