- pgno: 356
  md: '> What''s in a name? That which we call a rose

    By any other name would smell as sweet.\n~William Shakespeare, Romeo And Juliet


    # Glossary


    American Standard Code for Information Interchange (ASCII)


    A format for text display that consists of a set of 128 characters.


    associative array An array whose keys are strings rather than integers (sometimes
    referred to as a “hash” or “hash table”).


    BASE64 An encoding scheme for representing any type of data as ASCII text, so
    that it may be easily transmitted across the Internet.


    callback function A function registered with the SAX parser as the handler for
    a specific type of event.


    case folding In the context of an XML document, converting element names to uppercase
    to make them more consistent.


    Cocoon A Java-based content publishing framework, with support for a variety of
    different data sources (including XML and databases).


    Component Object Model (COM)


    A component-based software architecture for integrated, reusable client and server
    objects.


    deserialization The process of converting a serialized object back into its original
    representation. In the context of WDDX, the process of converting WDDX packet
    into language-specific data structures.


    Document Object Model (DOM)


    A tree-based approach to XML processing.


    Document Type Definition (DTD)


    A document specifying conformance rules for an XML document to be considered valid.


    ![](img/df1553d823d294a2dc53fc5d66efb8fd_356_0.png)'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Appendix C Glossary


    entity reference A text string that serves as the placeholder for an entity (for
    example, the string &lt; serves as a placeholder for the less-than symbol).


    Extensible Stylesheet Language (XSL) A language used to format and present XML
    data. The language consists of three components: XPath, XSLT, and XSL-FO.


    external entity An entity whose definition exists in a different file.


    File Transfer Protocol (FTP) A protocol for transferring files over the Internet.


    GNU General Public License (GPL) A software license that allows developers to
    easily share, modify, and reuse software.


    Internet Message Access Protocol (IMAP) A protocol for reading email on a remote
    server (without first to download it to your local machine).


    Java Virtual Machine (JVM) Software that interfaces between Java bytecode and
    a specific hardware platform.


    Lesser General Public License (LGPL) A variant of the GPL that allows derivative
    works to use alternate licenses (whereas works on a GPL will always remain under
    the terms of the GPL).


    location path An XPath address that consists of axes, node tests, and predicates.


    Microsoft Component Object Model (COM) A Component Object Model


    named buffer A storage area in memory that is accessible by name.


    node A branch or leaf in the XML document tree.


    Portable Document Format (PDF) A standard file format for electronic documents
    popularized by Adobe Systems, Inc.


    Post Office Protocol (POP) An Internet protocol for downloading email to your
    local machine.


    processing instruction Information or command embedded within an XML document.


    RedHat Package Manager (RPM) An open software packaging system designed to simplify
    software distribution and updates.


    Relational Database Management System (RDBMS) An application designed to manage
    a series of linked, related, databases and tables.


    Remote Procedure Call (RPC) A client-server architecture for invoking remote procedures
    across a network.


    Resource Description Framework (RDF) An XML-based metadata language to describe
    content on the World Web.


    Scalable Vector Graphics (SVG) An XML-based language for describing vector graphics.


    serialization The process of converting an object into a byte stream for transmission
    or storage. In the context of WDDX, the process of converting a data structure
    into a WDDX packet.


    Simple API for XML (SAX) An event-based interface for XML processing.


    Simple Mail Transfer Protocol (SMTP) A protocol for sending email.


    Simple Object Access Protocol (SOAP) An emerging W3C standard for information
    exchange.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Glossary 339


    SMIL See Synchronized Multimedia Language source encoding Character encoding used
    by PHP when parsing an XML document.


    Web Standards Description Language (WSDL) An XML-based language for describing
    network services.


    Standardized General Markup Language (SGML) A standard for the creation of markup
    languages.


    Wireless Markup Language (WML) A presentation language for handheld devices (PDAs),
    cellular phones, and so on that is similar to HTML.


    Structured Query Language (SQL) A standard, widely used programming language to
    access and manipulate data records.


    XML-RPC A protocol for encoding RPC requests and decoding RPC responses using
    XML.


    stylesheet A set of rules or templates that define the formatting and appearance
    of a document.


    XML Schema A blueprint for a "class" of XML documents that is similar to (though
    far more powerful than) a Document Type Definition (DTD).


    SVG See Scalable Vector Graphics Synchronized Multimedia Integration Language
    (SMIL) A markup language used for synchronized multimedia presentations.


    XPath A language for accessing different parts of an XML document, usually on
    the basis of specific user-defined criteria. XPath is a part of the W3''C XSL
    specification.


    target encoding Character encoding used by callback functions when parsing the
    XML data passed to them.


    XSL See Extensible Stylesheet Language XSL-FO) A language that specifies formatting
    information for an XSL result tree (most often used for printable documents).
    XSL-FO is a part of the W3''C XSL specification.


    unparsed entity An entity that references data (usually binary data) that should
    not be processed by the parser.


    XSL Transformations (XSLT) A language that specifies the rules whereby an XML
    source tree is converted into a new result tree. XSLT is a part of the W3''C XSL
    specification.


    Web Distributed Data Exchange (WDDX) An XML-based technology for data transfer
    over the Web.'
  merge: -1
  img_proc: true
