    Once encoded, the RPC request needs merely to be transmitted to the RPC server.
    This transmission may take place by manually implement PHP-based utilities using
    any protocol; in the case of the web, this is usually HTTP. For a full-fledged
    example, take a look at Listing 6.26.


    # Making the Connection


    It''s important to note that the RPC extension that ships with PHP merely provides
    encoding and decoding functions, and a server and introspection API. It does not
    address the very important issue of how the request will be transmitted across
    the network, and how the response will be retrieved. Listing 6.26


    As it is now, developers need to implement a network transmission layer. Listing
    6.26 demonstrates an example of how this might work over HTTP, and the extension''s
    official web site also provides an additional set of utilities to implement this
    function (these utilities are also demonstrated in this chapter—take a look at
    Listing 6.29).


    When the server receives the encoded RPC request, it needs to decode it, execute
    the procedure, obtain a return value, encode it as an RPC response, and transmit
    it back to the requesting client. At the server end of the connection, PHP''s
    RPC extension automatically handles decoding and response encoding via the xmlrpc_server_call_method()
    function (discussed in the next section); at the client however, the decoding
    of the server response needs to be implemented manually. This is primarily accomplished
    by the xmlrpc_decode() function, a mirror of the xmlrpc_encode() function discussed
    in the preceding section. This function accepts an XML-RPC response and decodes
    it into native PHP data types for subsequent use. Listing 6.18 demonstrates this.


    # Listing 6.18 Decoding an XML-RPC Response


    ```

    ?php


    // sample response from server (XML-RPC)

    $response = <<< END

    <?xml version="1.0"?>

    <methodResponse>

    <params>

    <param>

    <struct>

    <member>

    <name>start</name>

    <value>

    <int>2</int>

    </value>

    </struct>

    </value>

    ```


    continues'
