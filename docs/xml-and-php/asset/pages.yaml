- pgno: 14
  md: '# Introduction


    > There are more things in heaven and earth, Horatio,

    Than are dreamt of in your philosophy."


    ~ William Shakespeare, Hamlet


    Unless you''ve been doing a Rip Van Winkle for the past few years, you''ve heard
    about

    PHP and XML.


    Probably not in the same context, I''ll grant you—one is, after all, a programming

    language for the web, whereas the other is a standard toolkit for describing data.

    Individually, they''re both long-time sweetheart of the notoriously fickle web
    com-

    munity—PHP for its rapid application development capabilities and XML for its

    capability to make data more useful by attaching descriptive tags to it.


    Although there is no shortage of information on either of these two technologies

    ividually, there are very few resources that explain how to use them in combina-

    with other. Which exactly the problem I had about a year ago, when I

    decided to use XML as one of the components of a web-based project I was working

    on. PHP was my development language of choice. (I''d long since gone up on Perl

    and JSP). Although I knew very little about how PHP and XML could be integrated

    with each other, I blithe assumed the web, with its gargantuan knowledge

    bases, would have more enough information to help me complete the project.


    Imagine my horror, when I was able to find only the sketchiest information

    ton the topic, despite hours tapping different permutations of "php xml develop-

    ment" Google''s search box. With time running out, I decided to plan B:

    i printed a copy of the XML and XML specs, stocked up on microwave dinners, and

    started experimenting with PHP''s built-in functions.


    I realized that combining PHP with XML wasn''t hard at all—in fact, it is

    pretty easy. Before long, I had worked out the SAX and DOM functions, and figured
    out what I needed

    to deliver the project on time. All of it took patience, a little research ...
    and a

    lot of time.


    In the highly competitive world of web development, where contracts often

    turn on which quality project can be executed, time is valuable commodity.

    Working with picky customers against aggressive deadlines is stressful for most

    developers; having to spend most of the day on research, rather than implementation,

    is unlikely to make their day any sunnier. And so, one of my most important reasons

    for writing this book was that it might serve as a starting point and reference
    for other

    developers looking to build XML- PHP-enabled web applications.


    This book is the book I wish''d had a year ago. It includes detailed explanations
    of

    PHP''s XML extensions, together with illustrations of using PHP to parse, validate,
    and

    transform XML markup. I''ve also discussed, other things, how to traverse XML'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'data trees, exchange data between web applications, overlay remote procedure
    calls over HTTP, and use free open-source XSLT to add new capabilities to your
    XML/PHP applications. You can read it all the way through, or use it in traditional
    cookbook style, flipping it over to the chapter that addresses your specific problem.
    Either way, I hope you find it useful, informative, and (dare I say it) fun.


    Over the past year, I''ve written a few articles on how XML and PHP can be used
    together, and I have given a couple of presentations on the topic. The feedback
    I''ve received, it seems there are still many, many people—developers, consultants,
    educators, webmasters, systems engineers, or just good ol'' PHP enthusiasts—who
    would love to know how XML and PHP can be combined together, but don''t know to
    start.


    If you''re one of these people, this book is for you.


    # # Who Should Read This Book


    You should read this book if you''re a developer looking to create XML-based web
    applications with PHP This book examines PHP''s support for different XML technologies,
    explaining how to develop XML-based web applications using standard PHP libraries
    and tools.


    Regardless of whether you want to format marked-up XML data with XSLT stylesheets,
    create XML documents from SQL-compliant databases, exchange information with WDDX,
    or implement remote procedure calls with SOAP, this book has the theory and practical,
    hands-on code to get you started.


    # # Who This Is For Not


    If you''re new to PHP or XML, you shouldn''t be reading this book. Throughout
    the material that follows, I''ll be assuming that you have a working knowledge
    of PHP (its variables, syntax, structures, and methods), and I''m also assuming
    that you are comfortable using it for standard web programming tasks. I''ll also
    be assuming to the extent of XML and XSLT, being able to construct XML files and
    XSLT transformations to them, and that you are comfortable using SQL to retrieve
    and manipulate records from a database.


    That said, the very first chapter of this book includes a brief discussion of
    XML and PHP concepts, and many of the subsequent chapters also introduce readers
    to the new technology. However, this material is intended more as a refresher
    course than an exhaustive reference, and you should make it a point to look up
    other specialized works if you find it insufficient.


    Some of the titles you might want to consider adding to your shopping list are
    the following:


    +   - Inside XML, by Steven Holzner (New Readers, 2000) ISBN: 0735710201.

    - Inside XSLT, by Steven Holzner (New Readers, 2001) ISBN: 0735711364.'
