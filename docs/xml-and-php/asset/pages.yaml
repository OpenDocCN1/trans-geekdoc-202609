- pgno: 188
  md: '# So Many Choices...


    With so many similarities between WDDX, XML-RPC, and SOAP, you might be wondering
    which one to use, and when. Making the choice between these competing technologies
    becomes easier when you consider the problems they were originally designed to
    solve.


    WDDX was developed in order to provide a simple framework for typed data exchange
    over the web. If your application needs to exchange typed information in a client-server
    environment, and WDDX components are available for your platform, WDDX is usually
    a good bet.


    XML-RPC, on the other hand, is a specification focused solely on remote procedure
    invocation and response. Since it is less versatile than WDDX when it comes to
    exchanging typed information between peers. This is not necessarily a bad thing—all
    if you''re interested in RPC, XML-RPC provides you with everything you need to
    do your job efficiently, without bogging you down in unnecessary features or convoluted
    structures.


    SOAP, which includes both WDDX and XML-RPC, offers a more powerful and complete
    solution to the problem of data interchange between platforms and servers. As
    Eric Kidd puts it in his XML-RPC HOWTO, "If you use XML-RPC, but the protocol
    had more features, check out SOAP-"


    For a more detailed comparison of these and other XML-based protocols, take a
    look at the W3C''s XML Protocol Matrix at http://www.w3.org/2000/23/xml-protocol-matrix.


    # PHP and RPC


    A PHP module for RPC has been available since version 4.1.0 of the language (released
    in December 2001). Created by Dan Libby of Enipinions, this RPC extension (which
    goes by the distressingly unpronounceable name of XMLRPC-EPI-PHP) provides standard
    encoding, decoding, and server administration functions for XML-RPC and SOAP requests
    and responses. This extension is also available as a standalone C library at the
    project''s official web site: http://xmlrpc-epi.sourceforge.net/


    If you''re using a PHP binary, it is quite likely that you''ll need to recompile
    PHP to add support for this PHP build (detailed instructions for accomplishing
    this are available in this book''s Appendix A, "Recompiling PHP to Add XML Support")


    This chapter will focus exclusively on the XMLRPC-EPI-PHP extension. However,
    it should be noted that this RPC library is not the only game in town—both the
    XML-RPC web (http://www.xmlrpc.org/) and SOAPWare (http://www.soapware.org/) list
    other PHP implementations of these protocols. Links to these alternative implementations
    are also available on this book''s website, and some of them are discussed in
    Chapter 8, "Open SOAP/PHP Alternatives"


    +   2. Kidd, Eric. "The XML-RPC HOWTO." SourceForge.Net (2001). Available from
    the Internet: http://xmlrpc-c.sourceforge.net/xmlrpc-'
