    \ Gilbert Gumpfinch III</author>\n  <date>11-23-2001</date>\n  <body>\n\n\n```\n\
    \nIn a development may consider to be the first of its kind, the Hungarian scientist\
    \ <person type='scientist'>Professor Harbert Floopshot</person> today announced\
    \ that he had succeeded in inventing 'a better mouse.' The new mouse, created\
    \ using advanced genetic splicing techniques and some good old-fashioned SuperGlue,\
    \ can emit ultrasonic squeals to frighten off predators twice its size, leap tall\
    \ mousetraps in a single bound, and comes equipped with a built-in Catdetector\
    \ to detect approaching felines.\n\n```\n</body>\n</story>\n```\n\nBy marking\
    \ the data with descriptive tags, XML makes it easy to distinguish between different\
    \ types of information—even for a computer. In today's weird world, this capability\
    \ is more valuable than most might survive; with today's business decisions handled\
    \ by computer, XML can significantly improve the accuracy of information processing,\
    \ thereby increasing overall business efficiency, streamlining business processes,\
    \ and (ultimately) fattening the bottom line—which probably explains why the industry's\
    \ so enthusiastic about it.\n\n# Features\n\nXML was designed to incorporate the\
    \ following features:\n\n+   - Ease of use. By virtue of the descriptive tags\
    \ they contain, XML documents are easy to read and understand, for users with\
    \ little or no computer knowledge. They are exceedingly simple to create: a non-technical\
    \ user is typically able to create an XML document in far less time than it takes\
    \ to create a corresponding HTML document.\n- This simplicity is XML's greatest\
    \ selling point. Think about it—adopting a markup language that can be understood\
    \ and used by all employees without any special training makes it easier and more\
    \ cost-effective for businesses to exchange information between individuals, departments,\
    \ and business units.\n- Formal structure. Although XML offers document authors\
    \ flexibility in naming and using their own tags, it nonetheless does impose some\
    \ structure on a document. Tags must be named and nested correctly; opening tags\
    \ must have corresponding closing tags; and namespaces must be defined wherever\
    \ they are required. These rules ensure that every XML document meets minimum\
    \ expectations of structure and syntax, and make it easier for applications and\
