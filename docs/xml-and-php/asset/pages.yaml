  md: '# Chapter 6 PHP and XML-Based Remote Procedure Calls (RPC)


    This entire script is split into two main sections. The first section merely displays
    an HTML form for user input; this form contains a text field for the city code
    and a pair of radio buttons to choose the data format required.


    After the form is submitted, the script calls itself again; this time, however,
    the $submit variable will exist, the second half of the script will be executed.
    At this stage, the first order of business is to create an array to hold the remote
    procedure arguments, and create an XML-encoded RPC request with xmlrpc_encode_request().


    Next, a socket is opened to the remote RPC server (actually a web server with
    PHP''s RPC extension compiled in), and the XML data is sent to it as a POST request
    (note the various HTTP headers that must accompany the data packet). After the
    server has received the data, it executes the remote procedure, the response is
    sent back (through the same socket connection) to the client as a POST response.


    This POST response contains a bunch of HTTP headers, in addition to the XML-RPC
    response string. These need to be stripped out so that the remaining XML can be
    decoded into a native PHP data type with xmlrpc_decode(). Finally, depending on
    the data format requested (this format is included in the RPC response), the temperature(s)
    are displayed with an appropriate message.


    Figure 6.3 and Figure 6.4 demonstrate what the client looks like, both before
    and after sending an RPC request.


