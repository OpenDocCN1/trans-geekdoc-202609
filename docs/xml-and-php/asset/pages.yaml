  md: "# Whitespace Processing\n\nYou can tell the parser to skip the whitespace it\
    \ encounters by setting the XML_OPTION_SKIP_WHITE attribute to true. This attribute\
    \ can come in handy if your XML document contains tabs or spaces that could interfere\
    \ with your program logic.\nThe following example turns whitespace processing\
    \ off:\n\n```\nxml_parser_set_option($xml_parser, XML_OPTION_SKIP_WHITE, 1);\n\
    ```\n\nYou can obtain the current value of the parser's attributes using xml_parser_get_option()\
    \ function, which returns the value of the specified attribute. For example:\n\
    \n```\nxml_parser_get_option($xml_parser, XML_OPTION_CASE_FOLDING);\n```\n\n#\
    \ Using Native Data Structures\n\nYou may come across a situation that requires\
    \ you to convert raw XML markup into native data structures as variables, arrays,\
    \ or custom objects. For these situations, PHP offers a very specialized little\
    \ function named xml_parse_into_struct(). The xml_parse_into_struct() function\
    \ requires four arguments:\n\n+   - A reference to the XML parser\n- The raw XML\
    \ data to be processed\n- Two arrays to hold the data in structured form\n\nAfter\
    \ xml_parse_into_struct() has processed the XML document, it populates the two\
    \ arrays with detailed information on the structure of the XML document. One array\
    \ holds a list of all the elements encountered by the parser in its journey through\
    \ the XML document; the other contains information on the frequency of occurrence\
    \ of each element.\nAn example might help to make this clearer. Consider the XML\
    \ document in Listing 2.16.\n\n> Listing 2.16 XML-Compliant Bookmark List (links.xml)\n\
    \n```\n<?xml version=\"1.0\"?>\n<bookmarks category=\"News\">\n  <link id=\"15696\"\
    >\n    <title>CNN</title>\n    <url>http://www.cnn.com/</url>\n    <last_access>2000-09-08</last_access>\n\
    \  </link>\n\n  <link id=\"3763\">\n    <title>Freshmeat</title>\n    <url>http://www.freshmeat.net/</url>\n\
    ```"
