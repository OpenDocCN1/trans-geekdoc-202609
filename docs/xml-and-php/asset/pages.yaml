  md: "# Traversing the DOM with PHP's DOM Classes 75\n\n# Treading the Right Path\n\
    \nIf you're using Windows, you'll need to give xmldocfile() the full path to the\
    \ XML file. Don't forget to include the drive letter!\n\nWhen you examine the\
    \ structure of the DomDocument object with print_r(), you can see that it contains\
    \ basic information about the XML document—including the XML version, the encoding\
    \ and character set, and the URL of the document:\n\n```\nDomDocument Object (\n\
    \  [name] =>\n  [url] =>\n  [version] => 1.0\n  [standalone] => -1\n  [type] =>\
    \ 9\n  [compression] => -1\n  [charset] => 1\n)\n```\n\n# Peekaboo!\n\nYou'll\
    \ notice many examples in this book (particularly in this chapter) use the print_r()\
    \ function to display the structure of a particular PHP variable. In case you're\
    \ not familiar with this function, you should know that it provides an easy way\
    \ to investigate the innards of a particular variable, array, or object. Use whenever\
    \ you need to look inside an object to see what makes it tick; and, if you're\
    \ feeling really adventurous, you might also want to take a look at the var_dump()\
    \ and var_export() functions, which provide similar functionality.\n\nEach of\
    \ these properties provides information on some aspect of the XML document:\n\n\
    +   - name–Name of the XML document\n- url–URL of the document\n- version–XML\
    \ version used\n- standalone–Whether or not the document is a standalone\n- type–Integer\
    \ corresponding to one of the DOM node types (see Table 3.1)\n- compression—Whether\
    \ or not the file was compressed\n- charset—Character set used by the document\n\
    \nThe application can use this information to make decisions about how to process\
    \ the XML data—for example, as Listing 3.3 demonstrates, it may reject objects\
    \ based on the version of XML being used."
