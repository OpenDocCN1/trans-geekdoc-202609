    # An Alternative PHP/SOAP Implementation: SOAP4


    SOAP4 is a PHP implementation of the Simple Object Access Protocol (SOAP) and
    Web Services Description Language (WSDL). Developed by Dietrich Ayala, these two
    standards are implemented as a pair of PHP classes (one for the server, and one
    for the client), and are freely available under the GNU LGPL at http://dietrich.ganx.com/soap4/.


    SOAP4 uses a similar approach to that demonstrated in Edd Dumbill''s XML-RPC implementation
    (discussed in the preceding section). Here too, the fundamental unit is a soapval
    object, which represents a single SOAP object. Multiple soapval can be built into
    a SOAP message, complete with header and body sections. This soaps object, once
    serialized, is suitable for transmission to any SOAP-compliant server or client.


    +   Crunching Numbers

    All the examples in this section use version 0.5 of SOAP4x.'
