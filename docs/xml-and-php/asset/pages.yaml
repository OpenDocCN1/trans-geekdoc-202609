  md: '# Chapter 3 PHP and the Document Object Model (DOM)


    model, and map the document elements into your own custom structures—a process
    that adds to complexity and can possibly degrade performance.

    Where SAX flounders, though, the DOM shines. The DOM creates a tree representation
    of the document in memory, making it possible to easily travel from node to another,
    or even access the same node repeatedly (again, not something you can do easily
    in SAX). This tree representation is based on a standard, easy-to-understand model,
    making it easier to write code to interact with.

    This flexibility does, however, come with an important caveat. Because the DOM
    builds a tree in memory, DOM processing cannot begin until the document has been
    fully parsed by SAX, on the other hand, can begin parsing a document if it''s
    not all available immediately. This reduces a developer''s ability to “manage”
    the parsing process by feeding the data to the parser, which also adds greater
    memory consumption and consequent performance degradation.

    Consequently, the choice of technique depends significantly on the type of constraints
    the application will be performing, and the type of processing it will be carried
    out. For systems with limited memory, SAX is a far more efficient approach. On
    the other hand, complex data-processing requirements can benefit from the standard
    object model and API of the DOM.


    # Summary


    This chapter demonstrated an alternative approach to the event-based method of
    parsing XML data. The Document Object Model (DOM) builds a representation of the
    document structure in memory, and provides the application layer with a standard
    API to traverse and manipulate this tree.

    PHP implements the DOM via a number of standard classes; this chapter examined
    these classes in detail, together with examples of how they can be used to format
    XML data, construct XML documents on the fly, and create customized representations
    of XML data.

    Finally, the concluding section of this chapter examined the pros and cons of
    the SAX and DOM approaches, discussing them vis-a-vis with each other, in an attempt
    to help developers with the correct approach for their specific requirements.

    In the next chapter, I will be discussing Extensible Stylesheet Language Transformations
    (XSLT), which provides developers with yet another option when it comes to formatting
    and processing XML data.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '> "Out of intense complexities, intense simplicities emerge."

    ~Winston CHURCHILL


    # PHP and Extensible Stylesheet Language Transformations (XSLT)


    DATA marked UP IN XML CAN be put to a variety of different uses. It can be tagged
    for identification by search engines, transmitted from one location to another,
    or formatted for rendering in a web browser or other display agent. The preceding
    chapters have focused primarily on formatting and display, using either DOM or
    SAX to process and format XML data for simple user-friendly display.


    For more information formatting and display, using the DOM or SAX approach is
    a snap. The process is simple and, once you''ve figured out how it works, adapting
    it to your particular requirements is a piece of cake. When it comes to longer,
    more complex transformations, using either of these two approaches can be a lot
    like using a water pistol to put out a forest fire—tedious, and in the long run,
    not very efficient. For these conversions, it''s far more effective to use XSL
    Transformations (XSLT), a stylesheet language designed expressed for the purpose
    of converting, or “transforming” XML documents into other formats (XML, HTML,
    WML, ASCII, and so on).


    This chapter examines PHP’s XSLT extension, reprising examples from earlier chapters
    to demonstrate how XSLT can be used to quickly and easily create and format types
    of documents from a single XML source.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Chapter 4 PHP and Extensible Stylesheet Language Transformations XSLT


    # XSLT


    As you know, XML, by itself, merely provides the constructs necessary to describe
    data; it offers no information about how data is to be presented to a user. Hence,
    a requirement exists for a separate stylesheet language to handle the presentation
    aspects of an XML application. This stylesheet language is the Extensible Stylesheet
    Language (XSL), and it consists of the following three components:


    +   - XML Path (XPath), which provides constructs to locate specific nodes or
    node collections in an XML document tree

    - XML Transformations (XSLT), which is responsible for restructuring, transforming,
    XML data into a different format

    - XML Formatting Objects (XSL-FO), which is responsible for the formatting and
    presentation of the result.


    The first Working Draft of XSL appeared on the W3C''s web site in August 1998.
    At that time, the specification combined XSL, XPath, and XSL-FO into a single
    document; the three were later separated into independent entities. The XSL and
    XPath specifications were approved by the W3C as W3C Recommendations in November
    1999, with the XSL 1.0 specification achieving Recommendation status in October
    2001. The W3C''s XSL Working Group is currently working to develop the next versions
    of these specifications in order to address new XML technologies and develop extensions
    to the language.


    By separating the layout and presentation of data from the data itself, the XSL
    family of technologies makes it possible to create representations and views of
    the same data, for example, a single inventory statement that is marked up XML
    could be combined with different stylesheets to create views customized to the
    requirements of a purchase manager (who needs to view stock quantities), an accountant
    (who needs to view costs), and a customer (who needs to view unit availability).
    In a similar vein, a report presentation layer makes it easier to export data
    into a variety of formats—the XML source could therefore be used to generate ASCII
    documents, HTML web pages, and XML content.


    This chapter focuses on XSLT, which provides high-level constructs to transform
    a source XML document (referred to in the official specification as a source tree)
    into a new document (the result tree). It does this by using a stylesheet containing
    template rules to locate and match structures in the source tree, and transform
    them into new structures in the corresponding result tree.


    Perhaps the best way to understand this is with a simple example. Consider the
    XML document in Listing 4.1, which contains a (fictional) list of best-selling
    books.'
