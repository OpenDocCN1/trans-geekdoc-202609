- pgno: 135
  md: 'The second time the function is invoked, the first parameter remains the same;
    how-ever, the second parameter is now the name of the file to write log messages
    to:


    ```

    xslt_set_log($xp, "*/tmp/xslt.log");

    ```


    This is very simple and works like a charm. Listing 4.6 puts it in its context.


    # Listing 4.6 Logging XSLT Processor Messages


    ```

    <php

    // set the filenames

    $xml_file = "list.xml";

    $xslt_file = "list.xslt";


    // create the XSLT processor

    $xp = xslt_create() or die("Could not create XSLT processor");


    // set a log file for processor messages

    xslt_set_log($xp, true);

    xslt_set_log($xp, "*/tmp/xslt.log");


    // process the two files to get the desired output

    $result = xslt_process($xp, $xml_file, $xslt_file);


    // print output

    echo $result;


    // free the resources occupied by the handler

    xslt_free($xp);

    ?>

    ```


    And here''s an excerpt from the resulting log file:


    > Sablotron Message on line none, level log: Parsing

    ->file=/usr/local/apache/htdocs/list.xml...

    nSablotron Message on line none, level log: Parse done in 0.003 seconds

    Sablotron Message on line none, level log: Executing stylesheets

    ->file=/usr/local/apache/htdocs/list.xslt...

    nSablotron Message on line none, level log: Execution done in 0.006 seconds


    This excerpt is not very useful at the moment, but expect the log messages to
    get more descriptive as the API evolves.


    The second argument to xslt_set_log()—the name of the log file—is absent (or NULL),
    errors are written to the standard error display (usually the browser running
    the script). If the specified log file already exists, new messages are appended
    to the end of the log.'
