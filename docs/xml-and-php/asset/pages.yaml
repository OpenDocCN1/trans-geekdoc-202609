- pgno: 37
  md: '# Chapter 1 XML and PHP Basics


    Some of the applications that arise as a result of this combination


    +   Data processing. PHP''s XML functions make it possible to parse XML data and
    carry out commands based on the type of data encountered. With some clever coding,
    this can be used to easily convert XML-encoded data into browser-compatible HTML
    output. You also use PHP''s XML functions to create a database from an XML document,
    or vice versa.


    +   Data transformation. PHP''s XSLT extension brings the full power of XSLT processing
    to the language, making it possible to apply XSLT stylesheets to XML data. With
    support for a wide range of XSLT processing instructions, transforming data from
    one format to another becomes very simple.


    +   Platform-independent information exchange. PHP''s WDDX functions make it possible
    to transfer information (including typed data like arrays) from one system to
    another using platform-neutral data structures. This capability is particularly
    useful for content publishers who need to distribute information to requesting
    clients on a periodic basis, yet have no control over the platform and operating
    environment of these clients—for example, news syndication services or stock market
    tickers. Because WDDX structures are platform-neutral, the PHP/WDDX combination
    encourages interoperability by making it possible to exchange data between programming
    languages in a simple and elegant manner.


    +   Remote process execution. Support for XML-RPC implies that PHP scripts can
    trigger processes on remote servers by sending them messages encoded in XML. This
    makes it possible to access different web services directly from your PHP script
    using standard client-server protocols and create new types of web applications
    based on these services.These processes/scripts might be written in other languages
    (such as Java, Python, Perl, and so on), again demonstrating how the XML/PHP combination
    can encourage greater interoperability between platforms and languages.


    # Summary


    Clearly, PHP and XML are each powerful and flexible tools. Given the current state
    of the web, however, with browser support still evolving and ancillary technologies
    yet to mature, you will need to use them together to get the true measure of their
    capabilities.


    Unlike the chapters yet to follow, this one contained almost no code; instead,
    attempted to place both PHP and XML in context with a discussion of their individual
    capabilities and applications. It then proceeded to an explanation of how the
    two fit together and previewed some of the applications that become possible as
    a result.


    The subsequent chapters explore some of these applications in depth.'
