- pgno: 23
  md: '# Chapter 1 XML and PHP Basics


    This emphasis on structured markup is in stark contrast to the "anything-goes"
    approach of HTML, which frequently sacrifices conformance in the name of greater
    flexibility. An HTML document containing incorrectly nested tags, for example,
    would immediately generate conformance errors when passed through an XML parser;
    the same document would likely be displayed correctly, with no errors recorded,
    viewed in any of today''s web browsers (many of which incorporate their own error-correction
    routines for precisely this sort of situation).


    +   **Internet-friendly.** XML was designed to be used on the Internet, where
    it plays two very important roles.


    First, XML provides a toolkit that enables users to describe the huge amount of
    data flowing around on the Internet—this immediately opens the door to better
    organization and classification of information on the web, more intelligent search
    engines, and new types of mechanisms between data.

    Second, XML provides a standard mechanism for information exchange, encoding in
    a format that is easily transmissible from one computer to another using existing
    Internet protocols and transport mechanisms. Because XML is essentially text-based,
    it can be used to transmit information over any FTP, HTTP, or any other text-capable
    protocol.

    Examples of technologies that use XML to exchange data include Resource Description
    Framework (RDF), Channel Definition Format (CDF), Web Distributed Data Exchange
    (WDDX), and Simple Object Access Protocol (SOAP).


    +   **Wide expansion support.** XML is easy to use and easy to move around, it''s
    not hard to write an application that uses XML-encoded data. A number of XML parsers
    are available online; XML editors, validators, and similar tools are gaining market
    share; and most popular web browsers now support XML.


    +   **SGML-compatible.** As mentioned earlier in this chapter, XML is an offshoot
    of SGML, and XML documents comply with all the rules and constraints of SGML markup.
    That being, XML is easier to use than SGML because its focus is much narrower.
    By straddling both worlds, XML combines the power of SGML with the flexibility
    and ease of use we''ve come to expect from the Internet.


    # Basic Concepts


    XML documents come in two flavors: well-formed and valid.

    A well-formed document is one that adheres to the basic rules laid down in the
    XML specification; for example, all elements must be properly nested; attribute
    values must be enclosed within quotation marks; the document must contain at least
    one non-empty element.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "A valid document is one that, in addition to being well-formed, meets the requirements\
    \ and constraints laid down in a Document Type Definition (DTD) or XML schema.\
    \ This DTD or schema is an additional ruleset an author can use to specify the\
    \ element names and data types that are allowed in the document. This helps to\
    \ reduce the risk of corrupted or invalid data. Listing 1.2 shows well-formed\
    \ XML document, which describes an invoice for materials purchased. It a slightly\
    \ contrived example, but it will serve to illustrate XML's most commonly used\
    \ constructs.\n\n# Listing 1.2 An XML Document Demonstrating Most of the Language's\
    \ Constructs\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE invoice\n\
    [\n  <!ENTITY terms \"Payment on delivery. Cash, only on checks or money orders\
