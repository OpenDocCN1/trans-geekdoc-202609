  md: '# Chapter 6 PHP and XML-Based Remote Procedure Calls (RPC)


    3. With the remote procedure(s) registered with the XML-RPC server, the xmlrpc_server_call_method()
    function is used to parse and process the XMLencoded RPC request from the client.
    As Listing 6.21 demonstrates, this function requires three arguments: a handle
    to the RPC server, the XML-encoded request string, and any additional data that
    may be required by the procedure.


    ```

    $response = xmlrpc_server_call_method($rpc_server, $request, NULL);

    echo $response;

    ```


    In Listing 6.21, after the request is decoded by xmlrpc_server_call_method(),
    the phpgetRange() function iterates through the number array to determine the
    highest and lowest in the series, and then returns an array containing these two
    values.


    The xmlrpc_server_call_method() encodes this return value as an XML document,
    for display or further processing. The return value may be encoded as either an
    XML-RPC response or a SOAP response (refer to the sidebar titled "What’s in a
    Name?" on how to do this).


    4. After the remote procedure has been executed and a return value encoded into
    XML, the final step is to destroy the server and free up the memory it was occupying.
    This is accomplished via the aptly xmlrpc_server_destroy() method.


    ```

    xmlrpc_server_destroy($rpc_server);

    ```


    The previous steps make up a fairly standard process, and you’ll see them used
    over and again in the examples that follow:


    > What’s in a Name?

    nBoth the xmlrpc_encode_request() and the xmlrpc_server_call_method() functions
    can accept one optimal argument: an array containing information on the format
    of the XML.


    This array is an associative array containing any or all of the following key-value
    pairs. The default value for each key is marked in bold.


    +   * "type" => ("php"|xml") specifies whether the function should return an XML
    document or a PHP data structure.

    * "verbosity" => ("white_space"|newlines_only"|pretty") specifies whether the
    XML should be returned as indented, multiline, or a single-line string.

    * "escaping" => ("cdata"|"non-ascii"|"non-print"|markup") specifies if and how
    to escape special characters.

    * "Version" => ("xmlrpc"|soap 1.1"|simple"|auto") specifies the protocol to be
    used. Supported protocols include XML-RPC, SOAP 1.1, and a non-standard variant
    named simpleRPC. The "auto" value indicates that output should be sent in the
    same form as input.

    * "encoding" => ("iso-8859-1"|"utf-8"...) encoding to use for the output.'
