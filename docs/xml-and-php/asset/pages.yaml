    # Handling SAX Events


    Let''s move on to a more focused discussion of the various event handlers we can
    register with the parser.

    PHP includes handlers for elements and attributes, character data, processing
    instructions, external entities, and notations. Each of these is discussed in
    detail in the following sections.


    # Handling Elements


    The xml_set_element_handler() function is used to identify the functions that
    handle elements encountered by the XML parser as it progresses through a document.
    This function accepts three arguments: the handle for the XML parser, the name
    of the function to call when it finds an opening tag, and the name of the function
    to call when it finds a closing tag, respectively.

    Here''s an example:


    ```

    xml_set_element_handler($xml_parser, "startElementHandler", "endElementHandler");

    ```


    In this case, I''ve told the parser to call the function startElementHandler()
    when it finds an opening tag and the function endElementHandler() when it finds
    a closing tag.

    These handlers must be set up to accept certain basic information about the element
    generating the event.


    When PHP calls the tag handler, it passes it the following three arguments:


    +   - A handle representing the XML parser

    - The name of the element

    - A list of the element''s attributes (as an associative array)


    Because closing tags do not contain attributes, the end tag handler is only passed
    two arguments:


    +   - A handle representing the XML parser

    - The element name'
