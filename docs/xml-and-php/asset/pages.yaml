- pgno: 313
  md: "# Chapter 9 Case Studies\n\n+   The patXMLRenderer class, which takes care\
    \ of parsing XML documents, converting attribute values and character data into\
    \ template variables, and displaying the rendered content\n\nIf you look at the\
    \ source code for the patTemplate class, you'll see that it's fairly simple. It\
    \ first reads and parses the available template(s), and then creates PHP arrays\
    \ to hold the template name(s) and data. Listing 9.21 demonstrates a snippet from\
    \ the readTemplatesFromFile() method of this class.\n\n# Listing 9.21 A Function\
    \ to Read and Parse Templates (from patTemplate.php)\n\n```\n<?php\n// some parts\
    \ of this function\n// have been deleted for greater readability\nfunction readTemplatesFromFile($file)\n\
    {\n    // Tag depth\n    $this->depth = -1;\n    // Names, extracted from the\
    \ Tags\n    $this->template_names = array();\n    // All HTML code, that is found\
    \ between the tags\n    $this->template_data = array();\n    // Attributes, extracted\
    \ from tags\n    $this->template_types = array();\n\n    $this->last_opened =\
    \ array();\n    $this->last_keep = array();\n    $this->whitespace = array();\n\
    \n    $this->createParser($file);\n\n    $open_tag = array_pop($this->last_opened);\n\
    \    if ($open_tag != NULL) {\n        die(\"Error in template '*'.$file.'&lt;'.$open_tag.'&gt;\
    \ still open-at end of file.\");\n    }\n}\n?>\n```\n\nIf you're wondering, the\
    \ createParser() method of the class is used to actually parse the template file\
    \ and obtain information on the templates within.\n\nAfter the templates have\
    \ been parsed, the next step is to obtain a list of template variables and values\
    \ (remember that these variables must be manually defined by the application using\
    \ the AddVar() method, as was done in Listing 9.12), and replace the variable\
    \ placeholders in the template with their corresponding values. This is accomplished\
    \ via the parseTemplate() method, which internally calls the parseStandardTemplate()\
    \ method (see Listing 9.22)."
