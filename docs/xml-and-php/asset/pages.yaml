    \ root of the node, processes them, and then calls itself again to process the\
    \ next level of nodes in the tree. The process continues until all the nodes in\
    \ the tree have been exhausted. An element counter is used to track the number\
    \ of elements found, and to display a total count of all the elements in the document.\n\
