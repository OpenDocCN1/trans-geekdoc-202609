- pgno: 36
  md: 'platforms and support for important web technologies like Java and Flash make
    it suitable- for a diverse range of other applications.


    Today, PHP is used by businesses (such as Mitsubishi and Ericsson), government
    organizations (such as the United States Naval Research Laboratory), and popular
    open-source portals (for example, freshmeat.net and phpbuilder.com) for applications
    ranging from content management to wireless data transfer. This fact again demonstrates
    the versatility of the language.


    If you''re interested in PHP''s numerous applications for business, you''ll find
    some very interesting case studies at http://www.zend.com/cs/.


    I''m not going to get the details of PHP''s syntax and structure, but will assume
    you know the basics. If you don''t, take a look at PHP Functions Essential Reference
    by Zak Greant, Greeme Mral, Torben Wilson, and Bricht Michlichitsch (New Riders
    Publishing, 2001) ISBN: 0735709070.


    # PHP and XML


    Now you''ve seen what PHP and XML are each individually, you''re probably wondering
    how the two of them fit together.


    The overall vision of XML and its ancillary technologies is very clear—mark up
    in XML, format with XML, link it together with XLink, and use it in a myriad of
    different ways. In reality, this vision hits an obstacle at the first stage itself—most
    browsers don''t come with either an XML parser or an XML processor. The latest
    versions of Internet Explorer and Netscape Communicator support XML, but older
    versions don''t This presents an obvious question: given that browsers do not
    support XML (or support it in an incomplete manner), how do you, as a web developer,
    even begin to build the next generation of cutting-edge XML applications?


    Well, there''s a simple solution: insert an intermediary layer between the client
    and the server to handle XML-encoded XML parsing, XSLT transformation, and other
    related tasks, serving as a translator between the server (which has XML data
    to transmit) and the client (which only understands a specific language like HTML
    or Wireless Markup Language (WML)).


    Where PHP fits in. PHP serves as the medium in the sandwich, as an intermediary
    layer through which XML processing is handled. Although PHP does not support the
    entire variety of XML technologies, the latest version does not yet a capable
    XML parser with both DOM and SAX extensions, and an XML processor, with its Sablotron
    extension.


    PHP also supports Web Distributed Data Exchange (WDDX), a rapidly emerging XML-based
    standard for data transmission over the web and can be coaxed into working with
    XML-RPC and SOAP to issue XML-based procedures over the Internet. Finally, because
    PHP has support for a wide variety of databases, it''s possible to use the language
    to build an XML document from a database or populate a database by parsing an
    XML document.


