    # Executing Shell Commands via RPC


    Finally, an example that demonstrates the power inherent in RPC, and illustrates
    what a double-edged sword that power can be. The next (and final) example creates
    an RPC server that can accept any system or shell command from a client and execute
    this command on the server.


    # Requirements


    Again, fairly simple: a client who accepts a command through user input, encodes
    it, and transmits it to a server that executes this command and returns the resulting
    output to the client. Both client and server communicate using XML-RPC, with HTTP
    as the network transport layer.


    # The Server


    Listing 6.32 has the complete code for the server. This is probably one of the
    simplest servers created in this section: it merely exposes one procedure—that
    in turn simply uses PHP’s backtick operator command (equivalent to the exec()
    command you read about in Chapter 2, "PHP and the Simple API for XML (SAX)") to
    execute the command received and return the output to the calling script.'
