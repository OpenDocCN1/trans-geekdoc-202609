- pgno: 387
  md: '# XML and PHP


    XML and PHP is designed to introduce PHP developers to the synergies thatat become
    visible when their favorite web-scripting language is combined with one of the
    most talked-about and used technologies of recent times, XML. XML and PHP teaches
    PHP developers to use PHP’s functions to develop and maintain XML-based web applications
    and sites, and it demonstrates the power inherent in the XML/PHP combination.
    This book provides information on all the major XML technologies supported in
    PHP, demonstrating how the XML/PHP combination can be used to deliver cutting-edge
    web applications through practical examples and real-world case studies.


    XML and PHP serves as both an implementation guide to the topic and a handy desktop
    reference for quick lookups— combining all the information that developers need
    into a single, focused package.


    # With XML and PHP, you will learn how to:


    Use PHP to parse, process, and validate XML markup with the Simple API for XML
    (SAX) and Document Object Model (DOM)


    Perform server-side XSL Transformations with PHP’s Sablotron processor


    Syndicate content and exchange data over the web with Web Distributed Exchange
    (WDDX)


    Overlay remote procedure calls over HTTP with XML-RPC and SOAP


    Convert data between XML and SQL-compliant databases


    Use free-source tools to add new capabilities to your XML/PHP projects


    Understand the applications of XML/PHP in the real world with practical examples
    and real-life case studies


    > Vikram Vaswani is the founder and CEO of Melonfire (www.flatiron.com), a company
    specializing in content creation and syndication services. He is an enthusiastic
    contributor to the PHP community and is the author of numerous well-received articles
    on open-source technologies (including Perl, Python, XML, and PHP)—all written
    with the goal of making complex technologies accessible and understandable to
    novices.


