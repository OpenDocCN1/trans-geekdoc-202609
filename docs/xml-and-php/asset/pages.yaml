- pgno: 223
  md: '# Summary


    This chapter discussed RPC, explaining how they could be used to implement distributed,
    network-based applications. It then went on to apply RPC theory to the web, examining
    how XML and HTTP could be combined to encode and transport procedure calls over
    the Internet and discussing two XML-based protocols, XML-RPC and SOAP, which are
    designed to do that.


    With the broad overview out of the way, this chapter then proceeded to a detailed
    examination of PHP''s RPC extension, examining how it could be used to encode
    and decode RPC data, create and manage an RPC server, and examine itself to automatically
    deliver documentation on its available procedures. Finally, two real-world examples
    (and one not-so-real-world illustration) put the theory to the test, demonstrating
    how PHP and XML can be used to build distributed web applications such as a meteorological
    data retrieval utility and a POP3 mail notification service.


    The next chapter will focus on connecting XML with other data sources, using a
    MySQL database to dynamically generate XML data, and apply XSLT stylesheets to
    it.'
  merge: -1
  img_proc: true
- pgno: 224
  md: "> \"If we spoke a different language, we would perceive a somewhat different\
    \ world.\"\n~LUDWIG WITGENSTEIN\n\n# PHP, XML, and Databases\n\nXML works by marking\
    \ up data with descriptive tags. Databases work by tabulating information into\
    \ rows and columns. Though the two approaches are fundamentally different, they\
    \ share a common goal: to impose order on unstructured data in order to make it\
    \ more useful.\n\nThe language has limitations, which may render it unsuitable\
    \ for use in particular situations—a fact amply attested by the numerous web sites\
    \ that continue to prefer databases for information storage and retrieval, even\
    \ in this age of XML. Consequently, web application developers need a thorough\
    \ understanding of the advantages and disadvantages of these two technologies,\
    \ and must factor them into their calculations when making project-wide decisions.\n\
    \nOften, however, understanding the issues is insufficient. When it comes to redeeming\
    \ database-powered web applications to use XML, or exchanging information between\
    \ sites or applications built on back ends (using some database), a developer\
    \ also needs a practical understanding of how to reconcile the two technologies\
    \ in order to offer customers the most bang for their buck.\n\n chapter examines\
    \ the relationship between XML and databases, demonstrating how technologies discussed\
    \ previously in this book (SAX, DOM, and XSLT) can be mobilized to translate database\
    \ records into well-formed XML documents, and versa. It also includes a brief\
    \ discussion of the pros and cons of these two technologies, with a view to helping\
    \ you choose the right one for your particular requirements."
  merge: -1
  img_proc: true
- pgno: 225
  md: '# XML versus the Database


    Nope, this isn''t tonight featured bout at the World Wrestling Federation. It''s
    a discussion- stemming from one very basic question: What truly is the difference
    between storing information as XML and storing it in a database?


    In the broad sense, there isn''t much. After all, both are technologies designed
    to impose structure on raw data, thereby making it more useful to the applications
    that we need. XML accomplishes this with elements and attributes, a database with
    rows and columns. Both also come with some powerful tools—databases with Structured
    Query Language (SQL) or some variant there, XML with the XML Path Language (XPath),
    and Extensible Stylesheet Language Transformations (XSLT)—that facilitate the
    manipulation of the data contained within them.


    In a narrower, more technical sense, however, the technologies exist. A database
    is designed for highly structured data; XML, on the other hand, favors data that
    is less structured and more hierarchical in nature. Although others exist (and
    are discussed in greater length in the following sections), the consequences of
    ignoring one can prove to be fairly serious.


    In the web application area, developers tend to prefer a RDBMS over XML; too often,
    this choice is influenced by technical reasons than a better-devil-under-you-know
    physics. As you might imagine, this is not a good thing in a production environment
    where performance, portability, and ease of use are paramount; a developer needs
    to make implementation decisions based on sound technical reasons and a fundamental
    understanding of the technologies involved.


    To that end, the following sections list the factors to be kept in mind when deciding
    between XML and a database.


    # Nature of the Data


    If you have highly structured or volatile data—for example, stock symbols and
    their corresponding prices, or an address book with specific fields for contact
    information—a database is a far better choice than XML. This is because databases
    are designed to handle structured data (thats the whole point of those rigid rows
    and columns), and can offer a (much!) higher level of performance when manipulating
    this type of data.


    When it comes to unstructured or irregularly structured information (recipes,
    poetry, lengthy dissertations, and so on), a traditional database tends to run
    into difficulties, because this type of data tends to resist easy classification
    into rows and columns. In such cases, XML is a much better choice; its self-describing
    approach offers authors greater flexibility, allowing them to easily describe
    relationship between data fragments and create data models that are efficient
    without necessarily conforming to the two-dimensional table paradigm.


    That said, XML is not a good choice for volatile and frequently updated information
    simply because there exists no easy way to manipulate XML-encoded documents. It''s
    easier to put this type of information into a database and manipulate it with
    SQL than it is to store it in a text file and modify it with read/write functions.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Data Retrieval Requirements


    When deciding on whether to use XML or a database for your data, it''s also important
    to take note of your data-retrieval requirements. If you''re planning to work
    only with data organized in a clearly defined manner, you''re fairly safe using
    a traditional database. An example of this is the retrieval of a name and telephone
    number from a table containing contact information. Because the required dataset
    is clearly defined and already maps into specific fields of a table, retrieving
    it via SQL is a snap.


    If, however, the data you need to retrieve isn''t so clearly defined, with the
    required dataset blurring or extending across the clearly defined boundaries of
    a table, the XML family of technologies is a far better choice. An example of
    this might be the retrieval of every alternate stanza in a poem—hard to do with
    SQL, fairly easy with XPath.


    XPath, together with stanza XSLT and XPointer, makes it extremely easy to customized
    node connections from an XML document tree, and restructure this node collection
    into the format you require. If your data contains recursive or nested structures,
    a traditional database will have difficulty organizing it in a format suitable
    for easy retrieval; XML, on the other hand, is well-suited for this task.


    # Performance


    Data organized in a traditional database, which typically has built-in support
    for indexing and stored procedures, can usually accessed faster than the corresponding
    XML-encoded version. Because XML documents are, at their core, ordinary text files,
    accessing individual data fragments parsing the text file line-by-line; this can
    degrade performance substantially, especially if there is a large amount of data
    involved.


    A database also tends to handle simultaneous access better than an XML document,
    implementing a more secure and robust locking arrangement that is possible with
    a “regular” flat file.


    # Portability


    There’s a flip side to the performance argument, though. Because XML markup is
    stored as text, XML data is immediately portable across platforms; databases,
    on the other hand, may store data in proprietary formats that cannot be easily
    ported to other systems and platforms. If portability is a concern, or if you
    anticipate data manipulation by non-technical users, you can''t get any more portable
    or simple than ASCII text; in these situations, it''s worthwhile to consider whether
    XML might be a better solution than a database.


    # Standardization and Integration with Other Applications


    Most databases support SQL, which provides a simple and efficient method of accessing
    records in a database. An upcoming W3C technology named XML Query is proposed
    to do for XML documents what SQL does for databases; at the moment, it’s still
    under development. Consequently, most developers still need to write'
