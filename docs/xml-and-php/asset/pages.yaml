- pgno: 176
  md: '# Summary 157


    The additional -q (quiet) parameter forces PHP to omit the Content-Type: text/html
    header that it usually sends prior to executing a script.


    In case you don''t have a PHP binary available, it''s pretty easy to compile one.
    Just follow the instructions in Appendix A.


    Although the socket server should always be active–which is why I suggest running
    it as a service managed by the inet daemon–the client should be set up to initiate
    connections on a more irregular basis, either via manual intervention or cron.


    # Other Applications for WDDX


    As the preceding examples demonstrated, WDDX makes it possible to exchange data
    between different sites and systems. Consequently, one of its more common applications
    involves acting as the vehicle for the synchronization of frequently updated content
    over the web. Examples of areas in which WDDX can be used include the following:


    +   - WDDX news services, which “push” the latest headlines, sports scores, stock
    and currency market information, and weather forecasts to connecting clients links
    to appropriate banner ads for display on the resulting web page

    - Ad-rotation services, which accept demographic data from requesting clients
    and return links information for selected items

    - E-commerce agents, which browse different sites and return comparative pricing
    information for selected items

    - Software-update services, which automatically update remote systems with new
    software versions


    # Summary


    This chapter discussed WDDX, a method of creating platform-neutral data structures
    for information exchange over the web. It discussed PHP''s WDDX support, explaining
    how to serialize and deserialize WDDX packets, and demonstrated how PHP and WDDX
    could be used to create a content distribution server for financial information
    updates and a software distribution network for web-based software updates. It
    also briefly discussed other applications of this technology for content dissemination
    over the web.'
