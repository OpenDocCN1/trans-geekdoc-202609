  md: '# SAX


    There are two basic approaches to parsing an XML document:


    +   - The event-based approach. Under this approach, an XML parser reads an XML
    document one chunk at a time, processing each tag as it finds in the document.
    Each time the parser encounters an XML construct (an element tag, a CDATA block,
    or a PI), it generates an event that can be intercepted and processed by the application
    layer. A Simple API for XML (SAX) parser uses this event-based approach to parsing
    an XML document.

    - The tree-based approach (DOM). Here, an XML parser reads the entire document
    into memory at one time, and creates a hierarchical representation of it in memory.
    The parser also exposes a number of traversal methods, which developers can use
    to navigate between, and process, individual tree nodes. A Document Object Model
    (DOM) parser uses this tree-based approach to parsing an XML document.


    This chapter focuses on the first approach. The second approach is dealt with
    in Chapter 3,"PHP and the Document Object Model (DOM"

    In order to better understand the event-driven approach, consider Listing 2.1.


    Listing 2.1 Simple XML Document (fox.xml)


    ```

    <?xml version="1.0"?>

    <sentence>The animal color="blue"><fox></animal> leaped over the <vegetable

    color="green"></vegetable> patch and vanished into the darkness.</</sentence>

    ```


    Now, if a SAX parser processed this document, it would generate an event trail
    that

    would look something like this:


    ```

    [tag opened] sentence

    [cdata] The

    [tag opened] animal

    [attribute name] color

    [attribute value] blue

    [cdata] fox

    [tag closed] animal

    [cdata] leaped over the

    [tag opened] vegetable

    [attribute name] color

    [attribute value] green

    [cdata] cabbage

    [tag closed] vegetable

    [cdata] patch and vanished into the darkness.

    [tag closed] sentence

    ```


    Under the SAX approach, the parser has a very clear and defined role. Its function
    is

    merely to parse the XML data that being fed into it and call appropriate functions'
