  md: "# PHP and WDDX\n\nAs previously stated, WDDX module has been available for\
    \ PHP since version 4.0 of the language. Created by Andrei Zmiewski, this WDDX\
    \ module includes standard serial- ization and deserialization functions to convert\
    \ PHP variables and arrays into WDDX- compatible data structures.\n\nIf you're\
    \ using a stock PHP binary\n\n# Encoding Data with WDDX\n\nPHP WDDX module offers\
    \ a number of different ways to encode data into WDDX. The following sections\
    \ demonstrate this by using the following:\n\n+   - The wddx_serialize_value()\
    \ function\n- The wddx_serialize_vars() function\n- The wddx_add_vars() function\n\
    \n# The wddx_serialize_value() Function\n\nThe simplest way to encode data into\
    \ WDDX (and the one I will use most frequently in this chapter) is via the wddx_serialize_value()\
    \ function, which is used to encode a single variable into WDDX. Listing 5.3 demonstrates\
    \ its application.\n\n> Listing 5.3 Serializing a Single Variable with wddx_serialize_value()\n\
    \n```\n<?php\n$flavor = \"strawberry\";\n\nprint wddx_serialize_value($flavor);\n\
    ?>\n```\n\nListing 5.4 demonstrates the result.\n\n> Listing 5.4 A WDDX Packet\
    \ Generated via wddx_serialize_value()\n\n```\n<wddxPacket version='1.0'>\n  <header/>\n\
    \  <data>\n    <string>strawberry</string>\n  </data>\n</wddxPacket>\n```"
