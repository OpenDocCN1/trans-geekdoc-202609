    \ everyone else.</message> |\n\n```\n<?php\n// data handler\nfunction characterDataHandler($parser,\
    \ $data) {\n    echo \"| handler in | \";\n    $data . \"| | handler out | \"\
    ;\n}\n```\n\n```\n<?php\n// data handler\nfunction characterDataHandler($parser,\
