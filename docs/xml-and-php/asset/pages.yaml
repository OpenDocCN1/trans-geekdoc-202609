  md: "# Handling SAX Events\n\n# Handling External Entities\n\nYou already know that\
    \ an entity provides a simple way to reuse frequently repeated segments within\
    \ an XML document. Most often, entities are defined and referenced within the\
    \ same document. However, sometimes a need arises to separate entities that are\
    \ common across multiple documents into a single external file. These entities,\
    \ which defined in one file and referenced in others, are known as external entities.\n\
    \nIf a document contains references to external entities, PHP offers xml_set_external_entity_ref(),\
    \ which specifies how these entities are to be handled.\n\nThis snippet designates\
    \ the function ExternalEntityHandler() as the handler for all external entities\
    \ found in the document:\n\n```\nxml_set_external_entity_ref_handler($xml_parser,\
    \ \"externalEntityHandler\");\n```\n\nThe handler designated by xml_set_external_entity_ref_handler()\
    \ must be set up to accept the following five arguments:\n\n+   * A handler representing\
    \ the XML parser\n* The entity name\n* The base URI for the SYSTEM identifier\
    \ (PHP currently sets to an empty string)\n* The SYSTEM identifier itself (if\
    \ available)\n* The PUBLIC identifier (if available)\n\nIn order to illustrate\
    \ this, consider the following XML document (see Listing 2.9), which contains\
    \ an external entity reference (see Listing 2.10).\n\n> Listing 2.9 XML Document\
    \ Referencing an External Entity (mission.xml)\n\n```\n<?xml version=\"1.0\"?>\n\
    <!DOCTYPE mission SYSTEM \"warning.txt\">\n<mission>\n  <object>Find the nearest\
    \ Starbucks</object>\n  <goal>Bring back two lattes, one espresso and one black\
    \ coffee</goal>\n  <priority>Critical</priority>\n  <w&warning;=w>\n</mission>\n\
    ```\n\nTrue You\nThe handler for external entities must explicitly return true\
    \ if its actions are successful. If the handler returns false (or returns nothing\
    \ at all, which works out to the same thing), the parser exits with error code\
    \ 21 (see the \"Handling Errors\" section for more information on error codes)."
