  md: "# Handling SAX Events 33\n\nThe designated handler must accept three arguments:\n\
    \n+   - A handle representing the XML parser (you can see that this is standard\
    \ for all event handlers)\n- The PI target (an identifier for the application\
    \ that is to process the instruction)\n- The instruction itself\n\nListing 2.8\
    \ demonstrates how it works in practice. When the parser encounters the PHP code\
    \ within the document, it calls the PI handler, which executes the code as a PHP\
    \ statement and displays the result.\n\n# Listing 2.8 Executing PIs within an\
    \ XML Document\n\n```\n<html>\n<head>\n  <basefont face=\"Arial\">\n</head>\n\
    <body>\n\n<?php\n\n// cdataDataHandler\nfunction characterDataHandler($parser,\
    \ $data)\n{\n  echo $data . \"<p>\";\n}\n\n// PI handler\nfunction PIHandler($parser,\
    \ $target, $data)\n{\n  // if php code, execute it\n  if (strtolower($target)\
    \ == \"php\")\n  {\n    eval($data);\n  }\n  // otherwise just print it\n  else\n\
    \  {\n    echo \"PI found: [$target] $data\";\n  }\n}\n\n// XML data\n$xml_data\
    \ = <<EOF\n<?xml version=\"1.0\"?>\n<article>\n  <header>insert slug here</header>\n\
    \  <body>insert body here</body>\n  <footer><?php print \"Copyright UnNoHoo Inc.\"\
    \ . date(\"Y\", mtime());)); ?></footer>\n```\n\ncontinues"
