- pgno: 17
  md: '# xvi Introduction


    history, features, capabilities, and applications of these two technologies. It
    then goes to explain the rationale for using PHP to process XML, and provides
    an introduction to how the two can be combined together.


    +   Chapter 2:“PHP and the Simple API for XML (SAX)”—With the basics of the way,
    this chapter discusses the Simple API for XML, lists SA functions available in
    PHP, and explains how to use them to traverse and parse an XML document.


    +   Chapter 3:“PHP and the Document Object Model (DOM)”—There’s more than one
    way to see a cat—a fact amply demonstrated by this chapter, which discusses an
    alternative to the SAX method of parsing XML data. It explains basic DOM concepts,
    lists DOM functions available in PHP, and explains how to use them to traverse
    and parse an XML document using both recursive and non-recursive techniques.


    +   Chapter 4:“PHP and Extensible Stylesheet Language Transformations (XSLT)—Now
    that you know how to parse an XML document with PHP, takes things to the next
    level with a discussion of the PHP XSLT API, which is used to transform XML documents
    on the server using XSLT stylesheets.


    +   Chapter 5:“PHP and Web Distributed Data eChange (WDDX)—WDDX is an open framework
    for distributing XML-encoded data systems. This chapter explores the possibilities
    for using PHP to transmit DDWX-encoded XML data, and illustrates the process of
    building a PHP-based DDWX server and client to handle this type of information
    exchange.


    +   Chapter 6:“PHP and XML-Based Remote Procedure Calls (RPC)—XMLRPC makes it
    possible to transmit XML-encoded Remote Procedure Calls from one system to another,
    and retrieve the response. SOAP is an evolution of XML-RPC, which offers more
    features and flexibility. This chapter explores the PHP implementation of XML-RPC
    and SOAP.


    +   Chapter 7:“PHP, XML, and Databases”—Thus far, you’ve been dealing with static
    XML documents. Now, add a database to the equation by generating XML data dynamically
    from a MySQL database and applying XSL Transformations to it.


    +   Chapter 8:“Open Source PHP/XML Alternatives”—What do you do if your PHP build
    doesn’t include support for certain XML processing functions? Turn to the open-source
    community for help, course! This chapter examines open-source projects that allow
    you to simulate PHP’s native XML processing functions, with detailed usage examples
    and explanations.'
