    # # Introspection


    PHP''s RPC extension also supports introspection, a fairly cool concept that allows
    your RPC server to display a certain degree of self-awareness about the procedures
    registered with it. A primitive introspection API makes it possible for developers
    to document the procedures they create, and provide this documentation to clients
    using a simple XML vocabulary.


    # # The Art of Self-Evaluation (Or, What The Heck Introspection?)


    In a general sense, introspection refers to the capability of a piece of code
    to "discover" information about itself, and return this information when asked
    for it. So, for example, an object might be able to display a list of its exposed
    properties, together with information on what each one represents, or deliver
    a list of its public methods, together with the expected parameters and return
    values for each.


    Obviously, this is not as magical or automatic as it sounds. The developer needs
    to define these properties and describe them in a manner that can be used by an
    introspection API. However, by providing a simple description mechanism for an
    object''s properties and methods, introspection makes it possible to analyze objects
    in a standard manner, automatically generate API documentation, and validate input
    parameters and output values.


    In the long run, this reduces development times and makes code more maintainable—which
    is why introspection is generally considered a Good Thing, and one that should
    be used whenever possible.


    An example might make this clearer. Consider Listing 6.22, which invokes, over
    RPC, the procedure system.listMethods().'
