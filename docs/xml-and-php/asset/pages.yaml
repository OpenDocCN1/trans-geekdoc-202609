  md: "# PHP and the DOM\n\n```\n<element> \"sentence\"\n  <text> \"What a wonderful\
    \ profusion of colors and smells in the market \" - \"\n  <element> \"vegetable\"\
    \n    <attribute> \"color=green\"\n    <text> \"cabbages\"\n  <text> \"\", *\n\
    \  <element> \"vegetable\"\n    <attribute> \"color=red\"\n    <text> \"tomatoes\"\
    \n  <text> \"\", *\n  <element> \"fruit\"\n    <attribute> \"color=green\"\n \
    \   <text> \"apples\"\n  <text> \"\", *\n  <element> \"vegetable\"\n    <attribute>\
    \ \"color=purple\"\n    <text> \"aubergines\"\n  <text> \"\", *\n  <element> \"\
    fruit\"\n    <attribute> \"==yellow\"\n    <text> \"bananas\"\n```\n\nFigure 3.1\
    \ A DOM tree.\n\nAs you can see, the parser returns a tree containing multiple\
    \ nodes linked to each other by parent-child relationships. Developers can then\
    \ code to move around the tree, access node properties, and manipulate node content.\n\
    \nThis approach is in stark contrast to the event driven approach you studied\
    \ in Chapter 2, “PHP and the Simple API for XML (SAX).” A SAX parser progresses\
    \ sequentially through a document, firing events on the tags it encounters and\
    \ leaving it to the application layer to decide how to process each event. A DOM\
    \ parser, on the other hand, reads the entire document into memory, and builds\
    \ a tree representation of its structure; the application layer can then use standard\
    \ DOM interfaces to find and manipulate individual nodes on this tree, in a non-sequential\
    \ manner.\n\n# PHP and the DOM\n\nPHP 4.0 comes with a primitive, though effective,\
    \ implementation of the DOM, based on the libxml2. Created by Daniel Veillard,\
    \ libxml2 (http://www.xmlsoft.org/) is a modular, standards-compliant C library\
    \ that provides XML parsing capabilities to the GNOME project (http://www.gnome.org/).\n\
    \nIf you’re using a stoc PHP binary, it’s quite likely that you’ll need to recompile\
    \ PHP to add support for this library to your PHP build. (Detailed instructions\
    \ for accomplishing this are available in Appendix A,“Recompiling PHP to Add XML\
    \ Support.”)"
