- pgno: 243
  md: '# 224 Chapter 7 PHP, XML, Databases


    Taking the Scenic Route

    You may be wondering whether the long, convoluted process outlined in Listing
    7.7 was even necessary.

    Strictly speaking, it wasn''t-I could have achieved the same effect with PHP''s
    MySQL functions alone, completely bypassing the DOM and SAX parsers (and obtaining
    a substantial performance benefit as a result). XML was added to the equation
    for illustrative purposes, to demonstrate yet another of the myriad uses which
    PHP''s DOM and SAX extensions can be put when working with XML-based applications.


    Note that the approach outlined in Listing 7.7 is not recommended for a production
    environment; simply because the performance degradation resulting from using it.
    When working with tables thousands of records, the process of retrieving data,
    converting it to XML, parsing the XML, and formatting it into HTML would inevitably
    be slower than directly converting the result into HTML using PHP''s native functions
    and data structures.


    After my MySQL result has been converted into XML, it''s fairly simple to parse
    it using SAX, and to replace the XML elements with corresponding HTML markup.
    This HTML markup is sent to the browser, which displays it as a neatly formatted
    table (see Figure 7.2).


    # Revisiting SAX


    SAX, the Simple API for XML provides an efficient, event-driven approach to parsing
    an XML document. If you''re not familiar with how it works, or with the SAX functions
    used in Listings 7.7 and 7.11, drop by Chapter 2, "PHP and the Simple API for
    XML (SAX)," which should bring you up to speed.


    ![](img/df1553d823d294a2dc53fc5d66efb8fd_243_0.png)


    Figure 7.2 The result of formatting a dynamically generated, XML-encoded database
    schema into an HTML table with SAX.'
  merge: -1
  img_proc: true
