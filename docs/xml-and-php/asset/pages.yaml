    # Development Environment


    This book assumes that you have a working PHP 4.1 development environment, and
    that your PHP builds the various XML extensions discussed in this book (instructions
    on how compile PHP to include this support are available in Appendix A,"Recompiling
    PHP to Add XML Support.).


    Some of the chapters in this book require additional development tools—for example,
    the MySQL database server. Wherever additional tools are required, I''ve included
    links to online resources that will assist you in obtaining and installing them.


    Finally, the examples and code codings in this book have been tested on UNIX (specifically
    Linux) and Windows. So, the platform you''re using shouldn''t matter too much.
    In places where it does, I''ve made a point to flag the section and explain the
    issues involved.


    # How to Use This Book


    You can approach the material in this book in two ways:


    +   - The traditional thing is to read it through from beginning to end. If you''re
    just getting started with the XML/PHP combo, this is the approach I,d recommend
    because it will teach you the basics in a structured manner, prepare you for the
    more advanced topics in the latter half of the book.


    +   - Use it as a desktop reference, reading only those chapters that address
    specific topics or problems you may be facing. If you''ve already played with
    PHP''s XML functions in the past, you might find this approach quicker and more
    convenient.


    However you decide to approach the subject, you should ensure that the experience
    is a participatory one. Make a point to try out the examples within each chapter,
    and futz around with the code codings to see what happens. You''re not likely
    to break anything, and you''ll learn a lot by actually putting the theory into
    practice.


