- pgno: 234
  md: '# Emerging from a Cocoon


    After the XML document has been generated, it may be processed and transformed
    by any XSLT-capable engine. Although PHP does with a very capable XSLT extension,
    you can just as easily the dynamically generated XML to any other engine for processing.


    One example of such an engine is Cocoon, a Java-based application that simplifies
    the process of publishing XML documents to the web. Fast and scalable, Cocoon
    is built around the JVM (for portability and performance), SAX (for fast document
    parsing), and XSLT (for document transformation). It supports content creation
    in (among others) HTML, WML, and PDF formats.


    Cocoon has been developed by The Apache Group


    # Transforming Dynamically Generated XML with XSLT


    The most common use of this dynamically generated XML usually transforming it
    into some other format via an XSL Transformation. I will just do that by using
    the very simple XSL stylesheet illustrated in Listing 7.5.


    +   Listing 7.5 An XSL Stylesheet Displays a Table of CDs and Tracks (cds.xsl)


    ```

    <?xml version="1.0"?>

    <xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <!-- set up page template -->

    <xsl:template match="*">

    <html>

    <head>

    <basefont face="Arial" />

    </head>

    <body>

    <h3>My CD Collection</h3>

    <table border="1" cellspacing="0">

    <tr>

    <td align="center">Artist</td>

    <td align="center">Title</td>

    <td align="center">Track list</td>

    </tr>

    <xsl:apply-templates />

    </table>

    </body>

    </html>

    </xsl:template>

    <!-- look for CDs -->

    <xsl:template match="//cd">">"

    ```


    continues'
