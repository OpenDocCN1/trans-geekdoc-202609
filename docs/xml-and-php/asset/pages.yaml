    This is a very basic example of introspection—the server is aware of all the methods
    currently registered with it and can provide this information to clients on demand.
    Of course, this is not limited to a list of procedure names. The system.describeMethods()
    procedure provides more exhaustive information on registered procedures, including
    details such as expected arguments and argument types, expected return values,
    optional and required arguments, related methods, bugs, and version information;
    whereas the system.methodHelp() provides information on the purpose of each registered
    procedure. There are a few other procedures as well (take a look at the next beside
    titled "Telling Back" for a list). As an illustration, consider List 6.24, which
    demonstrates what system.methodHelp() has to say about the getRandomQuote() function.


    # List 6.24 Obtaining an XML Description of the getRandomQuote() with system.methodHelp()


    ```

    <?xml version="1.0" encoding="iso-8859-1"?>

    <methodResponse>

    <params>

    <param>

    <value><string>Retrieves a random quote by the specified author</string></value>

    </param>

    </params>

    </methodResponse>

    ```


    # Talking Back


    The system.listMethods() is just one of a number of introspection functions for
    PHP''s RPC extension. Here''s a list of all them:


    +   - system.listMethods() - Lists currently registered methods

    - system.describeMethods() - Describes the available methods in detail

    - system.methodHelp() - Returns documentation for a specified method

    - system.methodSignature() - Returns signature for a specified method

    - system.getCapabilities() - Lists server capabilities'
