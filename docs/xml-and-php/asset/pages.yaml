- pgno: 154
  md: '# WDDX 135


    be separated into distinct header and data areas. The header contains a human-readable
    comment, whereas the data block contains an XML-encoded structure representing
    the data to be transmitted.


    This WDDX representation can be decoded (or "serialized" or "unpickled") and be
    used by any application that understands WDDX. And so, by creating a standard
    framework for representing common data structures and by expressing this framework
    in XML, WDDX makes it possible to easily exchange information over the Internet
    backbone.


    WDDX consists of two parts: the WDDX representation that defines basic WDDX structures,
    and a set of WDDX components for different languages that handles the translation
    of language-specific data structures into platform-independent XML representations.
    As of this writing, the WDDX specification most commonly used data structures
    (like the "Not My Type" sidebar for a list), and WDDX components are available
    for PHP, Perl, Asp, Java, Python, JavaScript, and COM. This immediately makes
    the technology attractive to developers whose work involves exchanging bits and
    bytes in multipatform environments.


    It''s important to note that WDDX is not an "official" specification per se; rather,
    it is an open standard created and supported by one. Despite this, it''s fairly
    popular, primarily for use in client-server or server-server content publishing
    systems, or as a wrapper for data exchange between multiple programming languages.
    By allowing applications written in different languages to easily communicate
    with each other, it also opens the door to new B2B applications, particularly
    in the areas of streamlining business processes and transactions.


    For more information on WDDX, you should refer to the official web site at http://www.openwdx.org/,
    which contains the WDDX Document Type Definition (DTD), and SDK (if you need to
    implement WDDX on an unsupported platform), and usage examples.


    # Not My Type


    The WDDX specification currently defines the following data types:


    +   - Boolean values, represented by the <boolean> element

    - Numbers, represented by the <number> element

    - Strings, represented by the <string> element

    - Date/time values, encoded in ISO8601 format, represented by the <dateTime> element

    - Integer-indexed arrays, represented by the <array> element

    - Structures, or string-indexed arrays, represented by the <struct> element;

    - Recordsets, or two-dimensional (rows versus columns) data collections, represented
    by the <recordset> element'
