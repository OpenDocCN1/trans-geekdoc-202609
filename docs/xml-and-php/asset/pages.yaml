    ar a tool for rapid application development, with more and more developers

    using it to construct high-traffic web sites and complex web-based applications.


    +   **Open source.** PHP is a child of the open source community—its source code

    isis freely available, and developers are encouraged to make their contribu-

    ton it. This open source approach has been the single most important factor

    responsible for the widespread acceptance of PHP all over the world. By sharing

    code with other developers, the PHP development team has been able to

    stay abreast of current technologies and incorporate them into the language

    faster than their more traditional counterparts. This open source approach

    has also given rise to a network of skilled PHP developers, who through mailing

    lists and chat rooms with questions, comments, and knowledgeable advice.


    +   **Modular extensions.** Support for new technologies can be added to PHP

    through its modular extensions, which make possible for developers to quickly

    incorporate new features and capabilities into the PHP build. Extensions avail-

    table allow developers to use PHP to perform FTP, IMAP, and POP3 operations-

