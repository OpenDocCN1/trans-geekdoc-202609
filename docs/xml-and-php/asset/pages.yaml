- pgno: 179
  md: "# Chapter 6 PHP and XML-Based Remote Procedure Calls (RPC)\n\nIn the preceding\
    \ chapter, you saw how potent the XML/PHP combination can be, and how much it\
    \ simplifies information exchange over the web. This chapter takes things step\
    \ further by examining, through examples and code listings, how PHP's implementation\
    \ of XML-based RPC can be used to enable new types of distributed, web-based applications\
    \ and services.\n\n# RPC\n\nFor users new to RPC, this section will provide a\
    \ broad overview of what it is, and of the different components involved in the\
    \ process. If you're already familiar with how RPC works, feel free to skip this\
    \ section.\n\nSpeaking generically, RPC is a toolkit designed for distributed\
    \ computing. It provides a framework for executing procedures on one system from\
    \ another, completely independent system in a secure, reliable, and efficient\
    \ manner.\n\nThe best way to understand the RPC programming model is perhaps comparing\
    \ it to the \"regular\" programming model, in which procedures, or functions,\
    \ are invoked on a client-server framework and within the same program. Figure\
    \ 6.1 and Figure 6.2 illustrate the difference.\n\nAs you can see from Figure\
    \ 6.2, the RPC programming model is built completely around a client-server framework\
    \ and consists of the following components:\n\n+   - An API to handle procedure\
    \ registration and execution on the server, and procedure invocation on the client\n\
    - A set of rules for encoding and decoding RPC requests and responses\n- A network\
    \ transmission layer to actually perform communication between the client and\
    \ server, and carry data packets back and forth (HTTP works well here, although\
    \ other protocols may also be used)\n\nFunction definition\n\n```\ngetRandomQuote(author)\
    \ {\n  connect_to_database();\n  construct_query(author);\n  retrieve_result_set();\n\
    \  return_result_set();\n}\n```\n\nFunction invocation\n\n```\ngetRandomQuote(\"\
    Shakespeare\");\n```\n\n![](img/df1553d823d294a2dc53fc5d66efb8fd_179_0.png)"
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Function definition RPC SERVER\n\n```\ngetRandomQuote(author){\n  connect_to_database();\n\
    \  construct_query(author);\n  retrieve_result_set();\n  return_result_set();\n\
    }\n```\n\nencode and transmit response\n\ndecode request and invoke function\n\
    \nNetwork transmission layer\n\ndecode response and use return value in program\n\
    \nencode and transmit request\n\nFunction invocation\n\n```\ngetRandomQuote(\"\
    Shakespeare\")\n```\n\nRPC CLIENT\n\nFigure 6.2 A remote function call.\n\nHere's\
    \ how it comes together:\n\n+   1. A remote procedure is invoked by an RPC client.\n\
    2. The procedure call, together with arguments (if any), is encoded into a request\
    \ packet suitable for transmission across a network.\n3. The request packet is\
    \ transmitted to the RPC server.\n4. The RPC server receives the packet and extracts\
    \ the procedure name and arguments (if available) from it.\n5. The RPC server\
    \ invokes the named procedure on the server and obtains a return value from it.\n\
    6. The return value is encoded into a response packet.\n7. The response packet\
    \ is transmitted back to the RPC client.\n8. The RPC client receives the response\
    \ packet, decodes it, and extracts the procedure’s return value from it. This\
    \ result value can then be used by the client within a script or program."
  merge: -1
