- pgno: 312
  md: "# patTemplate and patXMLRenderer 293\n\nThough these are simple examples, which\
    \ clearly demonstrate the potential of this system on a content-heavy web site.\
    \ By separating the presentation of the data from the data itself, this system\
    \ makes it possible to decouple the graphical interface of a web site from the\
    \ data that appears within this interface, so designers and content editors can\
    \ (finally) work independently of each other.\n\n# Extending Yourself\n\nOne of\
    \ the nice things about patXMLRenderer is its capability to incorporate and use\
    \ new extensions (remember the third design goal?) thereby allowing developers\
    \ to add custom functionality to the class.\n\nEach extension has its own namespace;\
    \ the XML parser uses this unique namespace to store extension-specific variables\
    \ and execute extension-specific methods.\n\nAs an example, consider Listing 9.20,\
    \ which illustrates usage of a custom time extension. This extension provides\
    \ a bunch of useful date and time formatting functions for use in a template.\n\
    \n# Listing 9.20 Using patXMLRenderer's Time Extension\n\n```\n<?xml version=\"\
    1.0\"?>\n<doc>\n  <!-- include time extension -->\n  <randy:addextension namespace=\"\
    time\" file=\"patXMLRendererTimeExtension.php\" extension=\"patXMLRendererTimeExtension/\"\
    >\n  <modified>This page was last modified on <time:format=\n  -out=\"D M Y Y\"\
    >2002-06-04</time:format></modified>\n  <!-- outputs \"This page was last modified\
    \ on Tue 04 Jun 2002\" -->\n</doc>\n```\n\nThis capability to add custom extensions\
    \ to the class is unique to patXMLRenderer, and it is what makes the class different\
    \ from (and more powerful than) your average XSLT processor. Extensibility makes\
    \ it a snap to add any new functionality to the class on an as-needed basis, while\
    \ retaining the feature set and scalability of the base application.\n\nA number\
    \ of extensions for patXMLRenderer are available on the official web site for\
    \ the project. Check them out at http://www.php-tools.de/\n\n# Implementation\
    \ Overview\n\nAs stated previously, the system consists of two components, which\
    \ are implemented as PHP classes:\n\n+   The patTemplate class, which handles\
    \ the creation and management of document templates and performs variable interpolation"
