    \ of the way, all that’s left is to iterate through the MySQL result set, and\
    \ create XML representations of the data within it. In Listing 7.1, every record\
    \ in the result set is represented as a <cd> element, with the fields within each\
    \ record represented as attributes or children of the <cd> element.\n\n```\nwhile(list($id,\
    \ $title, $artist) = mysql_fetch_row($result)) {\n  $record = $root->new_child('cd',\
