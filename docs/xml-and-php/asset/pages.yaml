    # An Alternative PHP/XML-RPC Implementation: XML-RPC for PHP


    Before XML-RPC support appeared in PHP, Ed Dumbull''s XML-RPC implementation was
    the only real choice for PHP developers working with the protocol. Powerful, flexible,
    and easy to use, this XML-RPC implementation provides developers with a full-featured
    alternative to the XML-RPC-EPI extension that first shipped with PHP 4.1.0. Released
    under the BSD license, it can be downloaded from http://phpxmlrpc.sourceforge.net/.


    Completely object-oriented in nature, Ed Dumbull''s implementation begins with
    the construction of a fundamental unit: an XML-RPC value, or xmlrpcval, object.
    This object is then used as the base for more complex objects: an XML-RPC request,
    or xmlrpcmsg, object; and an XML-RPC response, or xmlrpcresp, object. Finally,
    client and server objects are available to handle data transmission between the
    two ends of the XML-RPC connection.


    In order to better understand this, consider Listing 8.9, which demonstrates the
    construction of an XML-RPC request using these objects.


