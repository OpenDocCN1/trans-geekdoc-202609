- pgno: 185
  md: "# 166 Chapter 6 PHP and XML-Based Remote Procedure Calls (RPC)\n\nA SOAP packet\
    \ is a well-formed XML document consisting of the three primary parts:\nThe envelope\
    \ contains information on the encoding used for the SOAP packet.\n\n+   * The\
    \ envelope contains information on the encoding used for the SOAP packet.\n* An\
    \ optional header that can be used to transmit authentication information, transaction\
    \ parameters, trace data.\n* The body that contains the actual data to be transmitted.\
    \ In the context of this chapter, this data is either an RPC request or response\
    \ (although SOAP can be used to transmit other kinds of data too).\n\nTake a look\
    \ at Listing 6.4, which demonstrates the SOAP equivalent of the RPC request you\
    \ saw in Listing 6.1.\n\n# Listing 6.4 A SOAP Request\n\n```\nPOST /SOAPserver\
    \ HTTP/1.0\nUser-Agent: Mozilla/4.0 (compatible; MSIE 5.0; Windows)\nHost: some.server\n\
    Content-Type: text/xml\nContent-Length: 360\n```\n\n```\n<xml version=\"1.0\"\
    \ ?>\n<soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ xmlns:xsd=\"http://www.w3.org/1999/XMLSchema\" soap:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    >\n  <soap:Body>\n    <getRandomQuote>\n      <xsd:string>Shakespeare</xsd:string>\n\
    \    </getRandomQuote>\n  </soap:Body>\n</soap:Envelope>\n```\n\nAs you can see,\
    \ an RPC request is encoded within the body of the SOAP packet as a series of\
    \ nested elements, with the name of the first element in the body corresponding\
    \ to the name of the remote procedure. Arguments to the remote procedure are specified\
    \ as elements within this outermost element.\n\nUnlike XML-RPC, it is not necessary\
    \ that a SOAP response return an HTTP status code of 200 OK; rather, the SOAP\
    \ specification suggests the use of standard HTTP error codes to identify whether\
    \ the request was successfully received and processed. The results of a successful\
    \ RPC invocation would resemble Listing 6.5 (note the Response suffix added to\
    \ the element to contain the return value)."
