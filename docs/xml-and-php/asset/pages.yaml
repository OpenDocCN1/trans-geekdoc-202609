- pgno: 156
  md: "# PHP and WDDX 137\n\n# Manual Labor\n\nNote that PHP typically generates the\
    \ WDDX packet as one long string. This can sometimes get confusing, so I manually\
    \ indented and spaced out some of the output listings in this chapter for greater\
    \ readability. Whitespace within a WDDX packet, but outside WDDX elements, is\
    \ ignored by the WDDX deserializer; whitespace embedded within a WDDX element\
    \ is, obviously.\n\nAs Listings 5.5 and 5.6 demonstrate, this works with arrays,\
    \ too.\n\n+   Listing 5.5 Serializing a PHP Array with wddx_serialize_value()\n\
    \n```\n<?php\n$flavors = array(\"strawberry\", \"chocolate\", \"raspberry\", \"\
    peach\");\n\nprint wddx_serialize_value($flavors);\n?>\n```\n\n+   Listing 5.6\
    \ A WDDX Packet Representing an Array\n\n```\n<wddxPacket version='1.0'>n  <header/>\n\
    \  <data>\n    <array length='4'>n      <string>strawberry</string>\n      <string>chocolate</string>\n\
    \      <string>raspberry</string>\n      <string>peach</string>\n    </array>\n\
    \  </data>\n</wddxPacket>\n```\n\nAn optional second parameter to wddx_serialize_value()\
    \ lets you add a human-readable comment to the resulting packet. Listing 5.7 is\
    \ a variant of Listing 5.5 that demonstrates this, with the output shown in Listing\
    \ 5.8.\n\n# Going to the Source\n\nIf you're using your web browser to view the\
    \ examples in the section, you may wonder why the output you see on your screen\
    \ doesn't match the output shown here. Well, that's because web browsers tend\
    \ to hide tags they don't know about; consequently, the WDDX tags generated during\
    \ the serialization process are not displayed in the rendered web page.\n\nThe\
    \ solution is fairly simple: use your browser's View Source command to view the\
    \ raw source for the web page, and you should see the full uncensored output."
