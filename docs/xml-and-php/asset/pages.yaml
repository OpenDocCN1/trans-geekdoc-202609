  md: "# Handling Errors 113\n\n# Listing 4.4 Basic Error Handling\n\n```\n<?php\n\
    // set the two filenames\n$xml_file = 'list.xml';\n$xslt_file = 'list.xsl';\n\n\
    // create the XSLT processor\n$xp = xslt_create() or die('Could not create XSLT\
