- pgno: 182
  md: "An XML-RPC procedure call is encoded as a well-formed XML document, with both\
    \ procedure name and arguments enclosed within a <methodCall> document element.\
    \ This procedure call is transmitted to the XML-RPC server as a standard HTTP\
    \ POST request.\n\nListing 6.1 demonstrates an XML-RPC request to the server some.quote\
    \ server; the request itself is equivalent to calling the function getRandomQuote(\"\
    Shakespeare\").\"\n\n# 6.1 An XML-RPC Request\n\n```\nPOST /RPC2 HTTP/1.0\nUser-Agent:\
    \ Mozilla/4.0 (compatible; MSIE 5.0; Windows 95)\nHost: some.quote.server\nContent-Type:\
    \ text/xml\nContent-Length: 287\n```\n\n```\n<?xml version=\"1.0\" ?>\n<methodCall>\n\
    \  <methodName>getRandomQuote</methodName>\n  <params>\n    <param>\n      <value>\n\
    \        <string>Shakespeare</string>\n      </value>\n    </param>\n  </params>\n\
    </methodCall>\n```\n\nAs you can see, the XML-RPC request body is clearly demarcated\
    \ into two sections The <methodName> element contains the name of the procedure\
