- pgno: 91
  md: "# 72 Chapter 3 PHP and the Document Object Model (DOM)\n\n# Under Construction\n\
    \nIf you're planning on using PHP's DOM extension in your development activities,\
    \ be warned that this extension is still under development and is, therefore,\
    \ subject to change without notice. Consequently, DOM code that works with one\
    \ version of PHP may need to be rewritten or retested with subsequent versions.\n\
    \nNote also that each of these objects in this chapter have been tested with the\
    \ DOM extension that ships with PHP 4.1.1, and are not likely to work with earlier\
    \ versions PHP's DOM implementation underwent some fairly radical changes between\
    \ the release of PHP 4.0.6 and PHP 4.1.1. If you're using an earlier PHP body,\
    \ you might need to upgrade to PHP 4.1.1 in order to try out the examples in this\
    \ chapter.\n\n# A Simple Example\n\nWhen PHP parses an XML document, it creates\
    \ a hierarchical tree structure (mirroring the structure of the document) that\
    \ is composed of objects. Each of these objects has standard properties and methods,\
    \ and you can use these properties and methods to traverse the object tree and\
    \ access specific elements, attributes, or character data.\n\nThe best way to\
    \ understand how this works is with a simple example. Take a look at Listing 3.2,\
    \ which demonstrates the basic concepts of this technique by traversing a DOM\
    \ tree to locate a particular type of element, and print its value.\n\n# Listing\
    \ 3.2 Traversing a DOM Tree\n\n```\n<?php\n$xml_string = \"<?xml version='1.0'?>\n\
    <sentence>What a wonderful profusion of colors and smells in the market -\n<vegetable\
    \ color='green'>cabbages</vegetable>\n<vegetable color='red'>tomatoes</vegetable>\n\
    <fruit color='green'>apples</fruit>\n<vegetable color='purple'>aubergines</vegetable>\n\
    <fruit color='yellow'>bananas</fruit>\n</sentence>\n\n// create a DOM object from\
    \ the XML data\nif(!$doc = simplexml_load_string($xml_string)) {\n    die('Error\
    \ parsing XML\\');\n}\n\n// start at the root\n$root = $doc->root();\n\n// move\
    \ down one level to the root's children\n$children = $root->children();\n```"
