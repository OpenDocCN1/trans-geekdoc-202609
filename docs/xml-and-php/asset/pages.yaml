    # An Alternative PHP/XPath Implementation: PHP/XPath


    In the words of its developers, PHP/XPath is “... a PHP class for searching an
    XML document using XPath, and making modifications using a DOM style API [it]
    does not require the XML PHP library”. The class, which is maintained as an open
    source project on the SourceForge network (http://www.sourceforge.net) by Nigel
    Swinson, Sam Blum, and Daniel Allen, is released under the Mozilla Public License,
    and is freely downloadable from http://www.sourceforge.net/projects/phpxpath.


    As the previous description suggests, there isn''t anything very complicated about
    the PHP/XPath class. It accepts XML data (either a file or a string) as argument,
    parses the data, and creates an object representing the XML document. The methods
    exposed by this object allow developers to create XML nodes based on XPath expressions;
    add, edit, and delete nodes from the document tree; and extract character data
    embedded within specific XML elements. In order to demonstrate how the class works,
    let''s consider a simple example (see Listing 8.5).


    # Listing 8.5 A simple XML Document (market.xml)


    ```

    <?xml version="1.0"?>

    <sentence>

    Today in the market, I spy

    <vegetable color=''green''>cabbages</vegetable>

    <fruit color=''red''>apples</fruit>

    <fruit color=''green''>pears</fruit>

    <vegetable color=''purple''>aubergines</vegetable>, and

    <fruit color=''orange''>oranges</fruit>

    </sentence>

    ```


