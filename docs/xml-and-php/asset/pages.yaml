    \ from http://www.apache.org/\n- In order to activate PHP's DOM and XSLT, you\
    \ also need a few\nexternal libraries:\n  - The zlib library (version 1.1.3 or\
    \ better) is available from\n    http://www.gzip.org/zlib/\n  - The expat library\
    \ (version 1.95.2 or better) is available from\n    http://sourceforge.net/projects/expat/\n\
    \  - The GNOME XML library,a.k.a. libxml (version 2.4.2 or better),\nfrom http://www.microsoft.org/\n\
    \  - The Sablotron library (version 0.71 or better) is available from\n    http://www.gingerall.com/\n\
    \n+   - Many of the examples in this book assume you have a MySQL database\nserver\
    \ up and running on your system. In case you don't, you will want to\ndownload\
    \ and install it. MySQL (version 3.23.23 or better) is available from\nhttp://www.mysql.com.\n\
    - Because you will be compiling all this software afresh, you also need a C++\n\
    compiler. Your development environment should already have one of these;\nhover,\
    \ in case it doesn't, you can get the GCC compiler. GCC is available at\nhttp://gcc.gnu.org/\n\
    \n+   - Finally, you need the tar and gunzip utilities to decompress and extract\
