  md: "# 74 Chapter 3 PHP and the Document Object Model (DOM)\n\n+   4. This list\
    \ of child nodes is returned as an array containing both text and element nodes.\
    \ All I need to do now is iterate through this node list, looking for vegetable\
    \ elements. And when I find these, I dive one one level deeper into the tree to\
    \ access the corresponding character data and print it (this is a snap, given\
    \ that each text node has a content property).\n```php\nforeach ($children as\
    \ $child) {\n  if <vegetable> element\n    if ($child->tagname == 'vegetable')\
    \ {\n      // go down one more level\n      $text = $child->children();\n    \
    \  // print the content of the text node\n      echo \"Found: \" . $text[0]->content\
    \ . \"br>\";\n    }\n}\n```\n\nWhen this script runs, it produces the following:\n\
    Found: cabbages\nFound: tomatoes\nFound: aubergines\n\nAs Listing 3.2 demonstrates,\
    \ DOM traversal takes place primarily by exploiting the parent-child relationships\
    \ that exist between the nodes of the tree. After traversal to a particular depth\
    \ has been accomplished, node properties can be used to extract all required information\
    \ from the tree.\n\n# Traversing the DOM with PHP’s DOM Classes\n\nBecause PHP’s\
    \ DOM parser works by creating standard objects to represent XML structures, an\
