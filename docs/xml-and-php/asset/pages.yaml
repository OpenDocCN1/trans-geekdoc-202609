- pgno: 152
  md: '> "Beam me up, Scotty!"

    ~CAPTAIN JAMES T. KIRK, "STAR TREK",


    # PHP and Web Distributed Data eXchange (WDDX)


    THE PRECEDING CHAPTERS HAVE FOCUSED PRIMARILY on parsing XML documents with a
    strong emphasis on producing content for web browsers. Although accomplishing
    this is no mean feat—in fact, it’s one of the most popular ways to use the XML/PHP
    combo—it’s just the tip of the XML iceberg.


    You’ll remember from my opening remarks that XML provides constructs to encode
    any type of information in a standard, machine-readable format. This makes XML
    the ideal vehicle for information exchange over the web. All that’s needed is
    an encoding format that is understandable to both sender and receiver and can
    piggyback over standard Internet protocols (HTTP, FTP, and so on).


    That’s where the Web Distributed Data eXchange (WDDX) comes in. WDDX provides
    a standard format for creating XML-based data structures designed for easy transmission
    across the Internet. These WDDX data structures are largely platform-independent,
    and they can be decoded and used by any application that understands the WDDX
    format.


    Over the next few pages, I will be examining WDDX in greater detail, demonstrating
    how it can be combined with PHP to encode and exchange data across different systems
    and platforms.


    This chapter marks the transition from merely parsing XML data to actually using
    XML as the vehicle for other applications. In addition to detailed descriptions
    of how PHP can be used to create WDDX structures, I’ll also be demonstrating some
    real-life applications of the technology to illustrate its usefulness and versatility.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "# WDDX\n\nInvented by Allaire Corp. (makers of the HomeSite HTML editor and\
    \ the ColdFusion development environment), WDDX is “... an XML-based technology\
    \ that enables the exchange of complex data between web programming languages....\
    \ It was created in 1998 as an open standard designed specifically to simplify\
    \ data exchange across different platforms, and it quickly gained popularity with\
    \ web developers for its elegance and ease of use.\n\nWDDX works by converting\
    \ language-specific data structures into their corresponding XML representations.\
    \ These XML data structures are text-based, platform-independent entities, and,\
    \ as such, can be transmitted between different systems over standard HTTP protocols\
    \ with minimal difficulty. Any WDDX-friendly application can read these WDDX packets,\
    \ and convert them back into their original form. For example, a Python list could\
    \ be encoded into WDDX and transmitted across HTTP to a PHP script, which could\
    \ decode it into a PHP array. A PHP associative array could be translated into\
    \ WDDX, sent to a Perl script, and decoded into a Perl-compliant hash, for use\
    \ within a Perl script.\n\nPerhaps an example would make this clearer. Consider\
