- pgno: 160
  md: '# PHP and WDDX 141


    2. With the packet created, the next step is to add data to it. In Listing 5.13,
    the data is generated dynamically from a form submission, and each value is then
    added to the packet via the wddx_add_vars() function.


    ```

    wddx_add_vars($wp, "HTTP_POST_vars");

    ```


    This function works much in the same way as wddx_serialize_vars() — it (although
    I''ve only used one here), serializes these variables into WDDX structures, and
    adds them to the packet. Note, however, that wddx_add_vars() requires, as first
    argument, the handle representing the packet to which the data is to be added.


    3. After all the required data has been inserted into the packet, the final step
    is to close the packet, accomplished via the wddx_packet_end() function. Again,
    the packet handle is used to identify the packet to be closed.


    ```

    wddx_packet_end($wp);

    ```


    Note that the wddx_packet_end() function returns the contents of the newly minted
    packet, this return value can be assigned to a variable and used in subsequent
    lines of the PHP script.

    This approach comes in particularly handy if you''re dealing with dynamically
    generated data, from a database or elsewhere.


    With your data safely encoded in WDDX, let''s look at how you can convert it back
    into usable PHP DDX structures.


    # Decoding Data with WDDX


    Although there are five different functions available to encode data into WDDX,
    PHP has only a single function to perform the deserialization of WDDX packets.
    This function is named wddx_deserialize(), and it accepts a string containing
    a WDDX packet as its only argument.


    Listing 5.14 demonstrates how a PHP variable encoded in WDDX can be deserialized
    by wddx_deserialize().


    Listing 5.14 Deserializing a WDDX Packet into a Native PHP Structure


    ```

    <?php

    $flavor = "blueberry";


    // print value before converting to WDDX

    echo "Before serialization, \$flavor = $flavor <br>";


    // serialize into WDDX packet

    $packet = wddx_serialize_value($flavor);

    ```


