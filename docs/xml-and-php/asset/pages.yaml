- pgno: 34
  md: "+   Built-in session management. Unlike many other languages, PHP comes with\
    \ native session management support, making it possible to track individual client\
    \ sessions on a web site and create web applications that respond to the needs\
    \ of individual users. With personalization features now almost de facto on popular\
    \ web sites, PHP's built-in session management can significantly reduce both the\
    \ time spent on developing and testing such sites.\n\nListing 1.3 demonstrates\
    \ some of these features.\n\n# 1.3 A simple PHP script\n\n```\n<?php\n///////////////////////////////////////////////////////////////////////\n\
