    # XPathContext and XPathObject Classes


    PHP''s XPath class adds flexibility to the DOM parser by freeing developers from
    the standard parent-child paradigm when constructing node collections. The XPath
    classes allow developers to quickly build node collections matching specific criteria—for
    example, every third element or every element containing the attribute shape=square—with
    scant regard for their position in the hierarchical tree.


    The XPathContext class is used to set up a context for all XPath evaluations,
    and is created by a call to the xpath_new_context() function. This function must
    be passed a reference to a DomDocument object. For example:


    ```

    // create a DomDocument object

    $doc = xmldoc($xml_string);


    // create an XPath context

    $xpath = $doc->xpath_new_context();


    ?

    ```


    If you think this doesn''t look very interesting, you''re right—it''s not. The
    XPathContext object sets up a context for all future XPath evaluations. These
    XPath evaluations usually result in instances of the XPathObject class, which
    are far more interesting.


    An instance of the XPathObject class may be created with a call to the xpath_eval()
    method of the XPathContext object, which requires an XPath address for evaluation.
    If the XPath evaluates successfully, xpath_eval() returns an instance of the XPathObject'
