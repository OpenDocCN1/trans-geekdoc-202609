  md: '# A Few Examples 19


    Most of this should be familiar to you from the previous sections of this chapter.
    The procedure getWeather(), which maps internally to the PHP function phpWeather(),
    is set up to accept two arguments: the three-letter city code and the data format
    (raw readings or arithmetic mean of raw readings) required by the client. This
    procedure is registered with the RPC server via the xmlrpc_server_register_method()
    function, and is invoked when the server receives a POST request containing the
    XML-encoded RPC request.


    # Going POST-al


    In you''re wondering, the special variable $HTTP_RAW_POST returns the raw data
    to the server via the POST method (or, if you''re using a command-line script,
    the data entered via the standard input) can then be parsed and processed by your
    script.


    Internally, the phpWeather() function is perfectly simple. It uses the arguments
    provided to connect to a MySQL database, retrieve the data from it, and return
    it to the caller as an array containing either the average or the raw data. This
    returned array is then encoded into XML and sent back to the client as a POST
    response.


