  md: "# Chapter 9 Case Studies\n\nNow, when a Metabase API function is called by\
    \ the application, the Metabase interface layer diverts the request to the appropriate\
    \ database driver, which uses PHP's native function(s) for that database to perform\
    \ the selected action. The result of the function call(s) is sent back to the\
    \ application from the database driver via the Metabase interface layer.\nThis\
    \ hierarchical flow can be better represented by Figure 9.1.\n\n![](img/df1553d823d294a2dc53fc5d66efb8fd_299_0.png)\n\
    \nFigure 9.1 Interaction between the Metabase public API and the database-specific\
    \ driver.\n\nSo, for example, a call to the Metabase function MetabaseNumberOfRows()\
    \ in a MySQL environment would first get intercepted by the Metabase interface\
    \ layer and then diverted to the MySQL database driver, which would execute the\
    \ function using PHP's native MySQL functions.\nThis can be clearly seen from\
    \ the following code snippets. Listing 9.5 contains the definition for the MetabaseNumberOfRows()\
    \ function as it appears in the Metabase interface layer.\n\n+   Listing 9.5 The\
    \ Definition for the MetabaseNumberOfRows() API Function for metabase_interface.php\n\
    \n```\n<?php\nFunction MetabaseNumberOfRows($database,$result)\n{\n    global\
    \ $metabase_databases;\n\n    return($metabase_databases[$database]->NumberOfRows($result));\n\
    }?\n```\n\nAs you can see, this function definition is merely a stub pointing\
    \ to the NumberOfRows() function, which is individually defined for each database\
    \ driver.\nListing 9.6 demonstrates what the one for MySQL looks like."
  merge: -1
  img_proc: true
- pgno: 300
  md: "Listing 9.6 The Definition for the MySQL-Specific NumberOfRows() Function (from\
    \ database_mysql.php)\n\n```\n<?php\nFunction NumberOfRows($result)\n{\n    return(mysql_num_rows($result));\n\
    }\n?>\n```\n\nAnd Listing 9.7 demonstrates what the one for PostgreSQL looks like.\n\
