    ```\n// all done, clean up\nxml_parser_free($xml_parser);\n```\n\n```\n?\n</body>\n\
    </html>\n```\n\n# When Less Work Is More\n\nThere's an important caveat you should\
    \ note when dealing with character data via PHP's SAX parser. If a character data\
    \ section contains entity references, then PHP will not replace the entity reference\
    \ with its actual value first and then call the handler. Rather, it will split\
    \ the character data into segments around the reference and operate on each segment\
    \ separately.\n\nWhat does this mean? Well, here's the sequence of events:\n\n\
    +   1. PHP first calls the handler for the CDATA segment before the entity reference.\n\
    2. It replaces the reference with its value, and calls the handler again."
