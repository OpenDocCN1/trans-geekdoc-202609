  img_proc: true
- pgno: 314
  md: "# Listing 9.22 A Function to Replace Variables in a Template with Their Actual\n\
    Values (from patTemplate.php)\n\n```\n<?php\n// some parts of this function\n\
    // have been deleted for greater readability\n\nfunction parseStandardTemplate($name,\
    \ $mode=\"w\")\n{\n    $name = strtoupper($name);\n\n    // get a copy of the\
    \ plain content\n    $temp = $this->getTemplateContent($name);\n\n    $vars =\
    \ $this->getVars($name);\n    $vars[$this->tag_start.PAT_ROW_VAR.]$tag_end] =\
    \ 1;\n    while(list($tag, $value) = each($vars)) {\n        if (is_array($value))\
    \ {\n            $value = $value[0];\n        }\n        $temp = str_replace($tag,\
    \ $value, $temp);\n    }\n}\n// snippet\n?>\n```\n\nAfter variable interpolation\
    \ has taken place (see the call to str_replace() in Listing\n9.22), all that's\
    \ left is to display the resulting output. This is taken care of by a little\n\
    method called DisplayParsedTemplate(), which merely echoes the result to the\n\
    out device.\nSo long as your activities are restricted only to patTemplate, the\
    \ process described\nin the preceding paragraphs holds good. However, if you have\
    \ a large amount of data,\nmually defining the values for a large number of template\
    \ variables can get tedious.\nIn such situations, it's easier to mark your data\
    \ in XML and let patXMLRenderer\nautomatically import this data into your template).\n\
    A close look at the source code for the patXMLRenderer class reveals that most\
    \ of\nthe activity begins with the initRenderer() method, which sets the name\
    \ of the\nXML file to parse, and also creates some global variables for use in\
    \ the patTemplate\nclass. Listing 9.23 has a snippet from this method."
