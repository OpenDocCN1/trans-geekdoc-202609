  md: '# Chapter 6 PHP and XML-Remote Procedure Calls (RPC)


    # Teething Trouble


    It''s important to note, at the outset itself, that some of the examples in this
    chapter (those related to PHP and SOAP) will not work with the released versions
    of PHP 4.1.0 and 4.1.1. This is because those versions of the language come with
    version 0.41 of the XMLRPC-EPI-PHP extension, which does not include support for
    SOAP (de)serialization.


    The affected lists in this chapter are:


    +   - Listing 6.12 and its output, Listing 6.13


    +   - Listing 6.19


    +   - Listing 6.30 and Listing 6.31


    In order to get these examples working as advertised, you will need to upgrade
    to PHP 4.2.0 or better, which includes a newer version of the XMLRPC extension.


    You might like to take a look at SOAPx4, an alternative PHP-based SOAP implementation
    that''s been discussed in Chapter 8, "Open Source XML/PHP Alternatives."


    Note that, as of this writing, the Windows version of PHP does not include an
    RPC extension, and therefore the examples in this chapter cannot be viewed in
    Windows. You will need a "NIX-based PHP build in order to try out the examples
    in this chapter.


    # Encoding and Decoding RPC Requests


    PHP''s RPC extension offers two functions designed specifically to encode RPC
    requests into XML. The first (and most commonly used) is the xmlrpc_encode_request()
    function that accepts, as function arguments, the name of the procedure to be
    called on the remote server and the parameters to be passed to it. Listing 6.8
    demonstrates how it works.


    Listing 6.8 Encoding a Remote Call with PHP


    ```

    <php

    // $numbers is an array of arguments to be passed to the remote procedure

    $numbers = array(34, 78, 2, 674);


    // encode procedure call

    echo xmlrpc_encode_request("getRange", $numbers);

    ?>

    ```'
