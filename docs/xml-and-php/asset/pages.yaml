- pgno: 228
  md: "# Exporting Database Records To XML 209\n\nNow, the process of converting these\
    \ rows and columns into XML would break down into the following steps:\n\n+  \
    \ 1. Connect to the database.\n2. Retrieve a result set.\n3. Iterate through this\
    \ result set, and create XML structures corresponding to the data retrieved.\n\
    4. Output the complete XML document.\n\nXML does not possess any database manipulation\
    \ capabilities. PHP, however, does, and because it also comes with a capable implementation\
    \ of the DOM, and can be used to accomplish the preceding four steps with minimal\
    \ difficulty. Listing 7.1 demonstrates the script that does all the work.\n\n\
    # Listing 7.1 A Dynamically Constructed XML DOM Tree from a Database\n\n```\n\
    // query database for records\n$connection = mysqli_connect('cdserver', 'joe',\
    \ 'cool') or die (\"Unable to\nconnect!\");\nmysql_select_db($db712) or die (\"\
    Unable to select database!\");\n$query = \"SELECT id, title, artist FROM cds\"\
    ;\n$result = mysql_query($query) or die (\"Error in query: $query. \" . mysql_sql_error());\n\
    \nif (mysql_num_rows($result) > 0) {\n    // create DomDocument object\n    $doc\
    \ = new_xmldocument(\"1.0\");\n\n    // add root node\n    $root = $doc->add_root('cds');\n\
    \n    // iterate through result set\n    while(list($id, $title, $artist) = mysqli_fetch_row($result))\
    \ {\n        // create item node\n        $record = $root->new_child('cd', \"\"\
    );\n        $record->set_attribute('id', $id);\n\n        // attach title and\
    \ artist as children of item node\n        $record->new_child('title', $title);\n\
    \        $record->new_child('artist', $artist);\n    }\n}\n\n// print the tree\n\
    echo $doc->dumpmem();\n```\n\ncontinues"
