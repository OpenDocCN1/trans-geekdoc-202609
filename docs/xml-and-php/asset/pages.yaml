- pgno: 131
  md: '# Chapter 4 PHP and Extensible Stylesheet Language Transformations (XSLT)


    3. After the processing is complete, the final task is to clean up by freeing
    all memory occupied by the handle:


    ```

    xslt_free($xp);

    ```


    And that''s it. XSLT processing in three easy steps!


    # A Closer Look at xslt_process()


    If you take a look at the documented API for PHP''s XSLT extension, you will find
    I told a little lie in my explanation of Listing 4.3. The xslt_process() function
    is actually capable of accepting six different arguments, not just the three described
    after Listing 4.3.


    These arguments are in the following, in order:


    +   - Handle representing the XSLT processor

    - Name of the file or buffer containing XML data

    - Name of the file or buffer containing XSLT data

    - Name of the file to save the result tree (optional)

    - Associative array of argument buffers (optional)

    - Associative array of XSLT parameters (optional)


    Named buffers are discussed in the "Using Buffers" section.


    XSLT parameters are discussed in the "Passing Parameters to an XSLT Stylesheet"
    section.


    # Handling Errors


    PHP''s XSLT API includes some functions designed specifically to tracking and
    displaying errors. Depending on your requirements, you can set up a primitive
    handler to display error codes and messages with the xslt_errno() and xslt_error()
    functions, or define a custom error handler with the xslt_set_error_handler()
    function.


    # Primitive Error Handling with xslt_errno() and xslt_error()


    The xslt_errno() function returns the code of the last error encountered by the
    XSLT processor, whereas the xslt_error() function generates a corresponding human-readable
    error message. Both functions require, as argument, a handle representing the
    current XSLT processor, as defined by xslt_create(). If no argument is provided,
    the last XSLT error number/error string that occurred is returned.


    To illustrate how this error handling works, let''s take another look at our first
    example (see Listing 4.4), which demonstrates this technique.'
  merge: -1
  img_proc: true
