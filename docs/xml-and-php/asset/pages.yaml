- pgno: 96
  md: "# Traversing the DOM with PHP's DOM Classes\n\nIn Listing 3.4, the variable\
    \ $fruit contains the root node (the element named fruit).\n\n# Listing 3.4 Accessing\
    \ the Document Element via the DTD\n\n```\n<?php\n\n// create a DomDocument object\n\
    $doc = new xmlDocument('<xml version='1.0' encoding='UTF-8'>\n-standalone='yes'><fruit>watermelon</fruit>');\n\
    \n// root node\n$fruit = $doc->root();\n?>\n```\n\nDTD or Not to DTD\nThe() method\
    \ of the DomDocument object creates a DTD object, which contains basic information\n\
    about the document's Document Type Definition. Here's what it looks like:\n\n\
    ```\nDTD Object\n(\n    [systemId] => weather.dtd\n    [name] => weather\n)\n\
    ```\n\nThis DTD object exposes two properties: the systemId property reveals the\
    \ filename of the DTD document,\nwhereas the name property contains the name of\
    \ the document element.\n\n# DomElement Class\n\nThe PHP parser represents every\
    \ element within the XML document as an instance\nof the DomElement class, which\
    \ makes it one of the most important in this lineup.\nWhen you view the structure\
    \ of a DomElement object, you see that it has two distinct\nproperties that represent\
    \ the element name and type, respectively. You'll remember\nfrom Listing 3.2 that\
    \ these properties can be used to identify individual elements and\nextract their\
    \ values. Here is an example:\n\n```\nDomElement Object\n(\n    [type] => 1\n\
    \    [tagName] => vegetable\n)\n```\n\nA special note should be made here of the\
    \ type property, which indicates the type of\nnode under discussion. This type\
    \ property contains an integer value mapping to one\nof the parser's predefined\
    \ node types. Table 3.1 lists the important types."
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Chapter 3 PHP and the Document Object Model (DOM)


    Table 3.1 DOM Node Types

    | Integer | Node type | Description |

    | --- | --- | --- |

    | 1 | XML_ELEMENT_NODE | Element |

    | 2 | XML_ATTRIBUTE_NODE | Attribute |

    | 3 | XML_TEXT_NODE | Text |

    | 4 | XML_CDATA_SECTION_NODE | CDATA section |

    | 5 | XML_ENTITY_REF_NODE | Entity reference |

    | 7 | XML_PI_NODE | Processing instruction |

    | 8 | XML_COMMENT_NODE | Comment |

    | 9 | XML_DOCUMENT_NODE | XML document |

    | 12 | XML_NOTATION_NODE | Notation |


    If you use the type property within a script to identify node types (as I will
    be doing shortly in Listing 3.5), you should note that it is considered preferred
    to use the named constants rather than their corresponding integer values, both
    for readability and to ensure stability across API changes.

    Element object also exposes a number of useful object methods:


    +   * children()-Returns an array of DomElement objects representing the children
    of this node

    * parent()-Returns a DomElement object representing the parent of this node

    * attributes()-Returns an array of DomAttribute objects representing the attributes
    of this node

    * get_attribute()-Returns the value of an attribute of this node

    * new_child()-Creates a new DomElement object, and attaches it as a child of this
    node (note that this newly created node is placed at the end of the existing child
    list)

    * set_attribute()-Sets the value of an attribute of this node

    * set_content()-Sets the content of this node


    Again, the two commonly used ones are the children() and attributes methods, which
    return an array of DomElement and DomAttribute objects, respectively. The get_attribute()
    method can be used to return the value of a specific attribute of an element (refer
    to Listing 3.8 for an example), whereas the new_child(), set_attribute(), and
    set_content() methods are used when creating or modifying XML trees in memory,
    and are discussed in detail in the section titled “Manipulating DOM Trees.\nNote
    that PHP’s DOM implementation does not currently offer any way of removing an
    attribute previously set with the set_attribute() method.'
  merge: -1
