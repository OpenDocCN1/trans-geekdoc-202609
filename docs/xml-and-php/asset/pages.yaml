- pgno: 89
  md: '# Document Object Model (DOM)


    The Document Object Model (DOM) is a standard interface to access and manipulate
    structured data.


    As the name suggests, it does this by modeling, or representing, a document as
    a tree of objects. A number of different object types are defined in the W3C DOM
    specification; these objects expose methods and attributes that can be used by
    the application layer to navigate and process the DOM, exploit the relationships
    between the different branches of the tree, and extract information from it.


    The W3C DOM specification defines a number of different objects to represent the
    different structures that appear within an XML document. For example, elements
    are represented by an Element object, whereas attributes are represented by Attr
    attributes.


    Each of these different object types exposes specific methods and properties.
    Element objects expose a tagName property containing the element name and getAttribute()
    and setAttribute() methods for attribute manipulation, Attr expose a value property
    containing the value of the particular attribute. These methods and properties
    can be used by the application layer to navigate and process the DOM, exploit
    the relationships between the different branches of the tree, and extract information
    from it.


    The very first specification of the DOM (DOM Level 1) appeared on the W3C web
    site in October 1998, and simply specified the "core" features of the DOM—the
    basic objects and the interfaces to them. The next major upgrade, DOM Level 2,
    appeared in November 2000; it examined the DOM from the perspective of core functions,
    event handling, and document traversal. DOM Level 3, which is currently under
    development, built on past work, and incorporates additions and changes from other
    technologies (XPath, abstract schemas, and so on).


    As a standard interface to structured data, the DOM was designed from the get-go
    to be platform- and language-independent. It can (and is) used to represent HTML
    and XML data, with DOM (or DOM-based) implementations currently available for
    Java, JavaScript, Python, C/C++, Visual Basic, Delphi, Perl, SVG, and PHP. (The
    PHP implementation is discussed in the next section.)


    In order to understand how the DOM works, consider Listing 3.1.


    +   Listing 3.1 A Simple XML Document


    ```

    <xml version="1.0"?>

    <sentence>A wonderful infusion of colors and smells in the market -

    <vegetable color=''green''>cabbages</vegetable>, <vegetable

    color=''red''>tomatoes</vegetable>, <fruit color=''green''>apples</fruit>

    <vegetable color=''purple''>aubergines</vegetable>, <fruit

    color=''yellow''>bananas</fruit></sentence>

    ```


    Once a DOM parser parsed this document, it would spit out the tree shown in Figure
    3.1.'
