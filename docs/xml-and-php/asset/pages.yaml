- pgno: 308
  md: "Now, let's convert this XML-encoded list into a web page. The first step is\
    \ to create a series of templates (compliant to the patTemplate format described\
    \ earlier) to define the formatting and layout of this web page. Listing 9.15\
    \ contains the templates I'd like to use.\n\n# Listing 9.15 A Series of Templates\
    \ for an HTML Shopping List\n\n```\n<!-- this template sets up the main container\
    \ -->\n<patTemplate:tmpl name=\"shoppinglist\">\n<html>\n<head></head>\n<body>\n\
    <h2>My Shopping List</h2>\n<ul>\n{CONTENT}\n</ul>\n</body>\n</html>\n</patTemplate:tmpl>\n\
    ```\n\n```\n<!-- this sets up the list element for each <item> element -->\n<patTemplate:tmpl\
    \ name=\"item\">\n<li>{CONTENT}</li>\n</patTemplate:tmpl>\n```\n\n```\n<!-- this\
    \ prints the content of each <name> element within an <item> element -->\n<patTemplate:tmpl\
    \ name=\"name\">\n{CONTENT}\n</patTemplate:tmpl>\n```\n\n```\n<!-- this prints\
    \ the content of each <quantity> element within an <item> element, \n=in italics\
    \ and parentheses -->\n<patTemplate:tmpl name=\"quantity\">\n<i>{CONTENT}</i>\n\
    </patTemplate:tmpl>\n```\n\nAs you see, the desired output is fairly simple—an\
    \ HTML document with the items in the shopping list displayed as elements of a\
    \ bulleted list. In Listing 9.15, this simple document is broken up into individual\
    \ pieces, with each piece represented as a separate template.\n\nThe CONTENT marker\
    \ that appears within each template is a special placeholder variable that is\
    \ used by patXMLRer when it generates the final output. When a template is parsed\
    \ by the rendering engine, the CONTENT placeholder is automatically replaced with\
    \ contents of the corresponding XML element (this may be either character data\
    \ or nested XML elements)."
  merge: -1
  img_proc: true
- pgno: 309
  md: "# Those Amazing Acrobatics variable!\n\nThe CONTENT placeholder is not the\
    \ only one recognized by patXMLRenderer. The class allows you to import the values\
    \ of XML attributes into the template, simply by using template variables corresponding\
    \ to the attribute names.\n\nConsider Listing 9.16, which has an XML document\
    \ cyntaining elements and element attributes.\n\n# Listing 9.16 A Simple XML Document\
    \ (size.xml)\n\n```\n<?xml version=\"1.0\"?>\n<size units=\"inches\">\n  <height>20</height>\n\
    \  <width>40</width>\n</size>\n```\n\nWhen patXMLRenderer reads and combines this\
    \ XML document with the template in Listing 9.17, the attribute values are automatically\
    \ imported into the template as template variables and used to replace the template\
    \ placeholders.\n\n# Listing 9.17 A Template that Uses XML Attributes as Template\
    \ Variables\n\n```\n<!-- this template sets up the main container -->\n<patTemplate:tpl\
    \ name=\"size\">\n<html>\n<head></head>\n<body>\nDimensions: {CONTENT} {UNITS}\n\
    </body>\n</html>\n</patTemplate:tpl>\n\n<!-- template for printing height -->\n\
    <patTemplate:tpl name=\"height\">\n{CONTENT}\n</patTemplate:tpl>\n\n<!-- template\
    \ for printing width -->\n<patTemplate:tpl name=\"width\">\n{CONTENT}\n</patTemplate:tpl>\n\
    \n<!-- output is \"Dimensions: 20 x 40 inches\" -->\n```\n\nThis capability to\
    \ automatically convert XML attributes into template variables is unique to patXMLRenderer,\
    \ and is one of the class' most useful features."
  merge: -1
  img_proc: true
