    # Going Native


    You may sometimes come across situations that you require to write raw XML markup
    into native data structures such as variables, arrays, or objects. For these situations,
    PHP''s DOM parser has a very specialized function named xmltree().


    The xmltree() function parses an XML string, and constructs a hierarchical tree
    of PHP objects representing the structured markup. This tree includes many of
    the objects you''ve become familiar with—instances of DOMDocument, DOMElement,
    DOMText, and DOMAttribute objects.


    xmltree() provides an easy way to quickly see the structure of a complete XML
    document. For the moment, that''s all it''s useful for; it''s not possible to
    write the tree back to a file, or to memory, after manipulating it.


    Note also that, as this writing, xmltree() only accepts an XML string. You cannot
    pass it a file or or reference.


    # DOM or SAX?


    Now that you''ve seen (and hopefully understood) you''re probably wondering: Which
    one do I use?


    It''s a good question, and one that doesn''t have a one-size-fits-all answer.
    Both DOM and SAX approaches have advantages and disadvantages, and your choice
    of technique must depend on the type of data being parsed, the requirements of
    your application, and the constraints under which you are operating.


    The SAX approach is linear: it processes XML structures as it finds them, generating
    events and leaving the event handlers to decide what to do with each structure.
    The advantage of this approach is that it is resource-friendly; because SAX does
    not build a tree representation of the document in memory, it can parse XML data
    in chunks, processing large amounts of data with very little impact on memory.
    This translates into better performance; if your document is simple, and the event
    handlers don''t have anything too complicated to do, SAX-based applications will
    generally offer a speed advantage over DOM-based ones.


    The downside, though, is an inability to move around the document in a nonlinear
    manner. SAX does not maintain any internal record of the relationships between
    the different nodes of an XML document (as the DOM does), making it difficult
    to create customized node collections or to traverse the document in a non-sequential
    manner. The only way around this with SAX is to create your own custom object'
