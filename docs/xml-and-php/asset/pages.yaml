  md: "# Chapter 6 PHP and XML-Based Remote Procedure Calls (RPC)\n\nObviously, this\
    \ information is not generated automatically; the developer needs to provide it\
    \ to the RPC server while registering the corresponding procedure. For this purpose,\
    \ PHP's RPC extension includes a function xmlrpc_server_register_introspection_callback(),\
    \ which names a callback function to handle introspection requests. Listing 6.25\
    \ has an example.\n\n# Listing 6.25 Registering an Introspection Handler\n\n```\n\
    <?php\nxmlrpc_server_register_introspection_callback($rpc_server,\n    \"generateIntrospectionData\"\
    );\n\n```\n\nIn this case, the callback function generateIntrospectionData() is\
    \ responsible for generating documentation in the approved XML vocabulary when\
    \ it intercepts an introspection request. Listing 6.26 has a more detailed example.\n\
    \n# Listing 6.26 A more Complete Introspection Handler\n\n```\n<?php\n\n// create\
    \ server\n$rpc_server = xmlrpc_server_create() or die(\"Could not create RPC server\"\
    );\n\n// register methods\nxmlrpc_server_register_method($rpc_server, \"getRandomQuote\"\
    , \"phpGetRandomQuote\")\nor die(\"Could not register method\");\n\n// function\
    \ to run when introspection request comes through\nxmlrpc_server_register_introspection_callback($rpc_server,\n\
    \    \"generateIntrospectionData\");\n\n// generate an XML-RPC request for system.methodHelp\n\
    // this would normally come from an RPC client\n$request = xmlrpc_encode_request(\"\
    system.methodHelp\", \"getRandomQuote\");\n\n// call method\n$response = xmlrpc_server_call_method($rpc_server,\
    \ $request, NULL, array(\"version\"\n    => \"xml\"));\n\n// print response\n\
    echo $response;\n\n// clean up\nxmlrpc_server_destroy($rpc_server);\n\n// function\
    \ to auto-generate documentation for procedures\n// (introspection)\n\n```"
