- pgno: 136
  md: '# Using Named Buffers


    In a production environment, it''s more professional to log processor messages
    to a file rather than display them to the user via the browser. Consequently,
    you should make it a point to add the second argument to xslt_set_log() after
    you''ve finished debugging your code and are preparing to roll it out for release.


    It should be noted that xslt_set_log() merely provides a mechanism to log processor
    messages. It does not catch or log errors in syntax; in order to catch these,
    you need to use one of the error-handling mechanisms described in the “Handling
    Errors” section.


    # Using Named Buffers


    Thus far, all the examples you''ve seen assumed the XML and XSLT data to be stored
    in static files. This assumption is true in most cases; some occasions arise when
    your XML is dynamically generated, either from a database, by combining two or
    more files, or from some other dynamic data source. In such cases, saving this
    generated XML to a file and then processing it with xslt_process() can be a needlessly
    and tedious process.


    This is where named buffers come in. Named buffers allow you to store your XML
    and XSLT data in memory and then pass these variables to xslt_process() for normal
    XSLT transformation.


    As discussed in the “A Closer Look at xslt_process()” sidebar, the xslt_process()
    function can actually accept up to six arguments. Typically, the second and third
    arguments are references to the XML and XSLT data; however, they can also be the
    names of buffers containing the XML and XSLT data.


    The following snippet might make this clearer:


    ```

    $arg_buffer = array("*xml" => $xml_string, "*xslt" => $xslt_string);

    ```


    ```

    $xp = xslt_create();

    ```


    ```

    $result = xslt_process($xp, "arg:xml", "arg:xslt", NULL, $arg_buffer);

    ```


    As you see, I first defined an associative array $arg_buffer, and set it up with
    two keys representing the XML and XSLT data, respectively. Next, I used these
    keys (with the arg: prefix) as arguments to xslt_process(), which reads the data
    in the corresponding buffer and uses it to perform the transformation.


    It should be noted at the outset that this capability is only only if your PHP
    build uses the Sablotron engine. This is because: URI scheme is a Sablotron-specific
    extension, and it is not likely to work with other XSLT processors.


    When using this technique, it is mandatory to specify the name of the variable
    containing the buffers as the (otherwise optional) fifth argument to xslt_process().


    Listing 4.7 is a detailed example to put it in all context.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 118 Chapter 4 PHP and Extensible Stylesheet Language Transformations (XSLT)


    Listing 4.7 Using Named Buffers


    You should also take a look at Listing 4.12, which demonstrates how named buffers
    can be used with dynamically generated XML data from a database.


    # Passing Parameters to an XSLT Stylesheet


    If you need to pass data from the PHP script to the XSLT stylesheet, PHP xslt_process()
    function can be used to pass associative arrays of parameters to the XSLT stylesheet.


    You''ll remember that the xslt_process() function can accept an array containing
    parameter-value pairs as an optional sixth argument. These parameters can be passed
