    This XML document is a little more generic than the one demonstrated in Listing
    7.10. The table name is specified as an attribute of the document element <table>,
    whereas individual table records are enclosed within <record> elements. Every
    record contains a series of field names (elements) and field values (character
    data). The field names within each <record> may be variable, as may be the total
    number of fields per record.


    Listing 7.14 builds on the basic concepts demonstrated in Listing 7.11 and the
    generic XML document described in Listing 7.13 to create a more generic parser—one
    that makes no assumptions about the number of values in each record, and retrieves
