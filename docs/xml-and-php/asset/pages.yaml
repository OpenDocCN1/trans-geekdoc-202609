- pgno: 187
  md: "# Chapter 6 PHP and XML-Remote Procedure Calls (RPC)\n\nFor more information\
    \ and examples, you should refer to the W3C SOAP primer at http://www.w3.org/TR/soap2-part0/,\
    \ which contains the official SOAP specification. (See the book's companion web\
    \ site at http://www.xmlhttp.com or http://www.newriders.com for more specific\
    \ links.) You might also want to visit http://www.soap.org/, a directory of SOAP\
    \ implementations for numerous different languages and platforms.\n\n# Simple\
    \ Simon\n\nWhen it comes to data, SOAP offers far greater flexibility than XML-RPC.\
    \ This is because SOAP builds on the work done by the W3C XML Schema Working Group,\
    \ allowing developers to create and use their own named data types in SOAP packets.\n\
    \nThe XML Schema specification defines two data types: simple and complex. Simple\
    \ data types include string, int, boolean, decimal, float, duration, datetime,\
    \ hexBinary, and base64Binary. These simple data types can be combined with each\
    \ other to create new, complex data types that are customized to the specific\
    \ requirements of the application.\n\nConsider List 6.7, which might make this\
    \ clearer.\n\n# List 6.7 Simple and Complex Data Types in an XML Schema\n\n```\n\
    <xsd:schema xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n\n<!-- a simple data\
    \ type -->\n<xsd:element name=\"movie\" type=\"xsd:string\"/>\n\n<!-- a complex\
    \ data type --\n<xsd:element name=\"movie\">\n  <xsd:complexType>\n    <xsd:sequence>\n\
    \      <xsd:element name=\"title\" type=\"xsd:string\"/>\n      <xsd:element name=\"\
    director\" type=\"xsd:string\"/>\n    </xsd:sequence>\n  </xsd:complexType>\n\
    </xsd:element>\n\n</xsd:schema>\n```\n\nList 6.7 contains two alternative definitions\
    \ for the movie element. The first uses a simple data type (string) to define\
    \ the type of data expected for the movie element; the second uses a combination\
    \ of two string data types to create a new complex type definition for the same\
    \ element.\n\nFor more information on how XML Schema data types work, you should\
    \ refer to the XML Schema specification, available on the web at http://www.w3.org/TR/xmlschema-0/."
  merge: -1
