    \ Now, whenever an unparsed entity is encountered, the unparsedEntityHandler()\
    \ function matches the notation name within the entity declaration to the keys\
    \ of the associative array, and launches the appropriate script with the entity\
    \ as parameter.\nObviously, how you use these two handlers depends a great deal\
    \ on how your notation declarations and unparsed entities are set up. In this\
    \ case, I use the notation to specify the location of the application and the\
    \ entity handler to launch the application whenever required. You can also use\
    \ these handlers to display binary data within the page itself (assuming that\
    \ your target environment is a browser), to process it, or to ignore it.\n\n#\
    \ Rapid \"exec()-ution\"\n\nThe PHP exec() function provides a handy way to execute\
