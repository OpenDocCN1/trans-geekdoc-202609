  md: 'In this case, the output from the XSL Transformation is equivalent to Listing
    7.15—a series of SQL statements, returned as a single string. These SQL statements
    are separated from each other and individually executed via PHP''s mysql_query()
    function.


    # Things to Do on a Rainy Day


    Obviously, INSERT statements aren''t the only types of SQL statements you can
    build—it''s as easy to dynamically construct UPDATE and DELETE statements from
    XML data. And you don''t have to do it just SAX or XSLT—either-this of conversion
    lends very well to DOM-type tree traversal and node manipulation. PHP''s DOM extension
    represents every node of the DOM as an tree object, exposing properties such as
    the element name and value; consequently, it''s not too hard to manipulate these
    properties to build an INSERT or UPDATE statement.


    In order to gain a better understanding of the XML-to-SQL conversion process,
    you should attempt to duplicate the preceding examples using the DOM; for variety,
    try constructing a series of UPDATE instead of INSERT statements.


    # Summary


    This chapter took an in-depth look at the relationship between PHP, XML, and databases,
    and demonstrated how to encode database records as XML, and vice-versa. In an
    attempt to assist developers in choosing the technology for their specific requirements,
    it first evaluated the pros and cons of each approach, examining the two technologies
    vis-à-vis each other. Then,fors theory for in-depth, practical examples, it built
    on your knowledge of SAX, XSLT, and the DOM to illustrate how painful the conversion
    process is, and how many different ways there are to accomplish it.


    And speaking of choice, you''ll be interested to hear that the next chapter offers
    you even more of it, exploring some of the alternatives available to simplify
    XML-based application development with PHP. Most of these alternatives are open-source
    projects, and some of them give PHP''s native XML functions a serious run for
    their money.'
