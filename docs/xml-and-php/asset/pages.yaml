  md: '# X Marks the Spot


    You might be interested to hear that version 4.x of the MySQL client application
    includes the ability to format an SQL result set as well-formed XML. For example,
    the command


    ```

    $ echo ''USE db127; SELECT * FROM cds | mysql -X

    <xml version="1.0"?>

    <resultset statement="SELECT * FROM cds">

    <row>

    <id>1</id>

    <title>Get A Grip</title>

    <artist>Aerosmith</artist>

    </row>

    <row>

    <id>2</id>

    <title>Androgynyn</title>

    <artist>Garbage</artist>

    </row>

    </resultset>

    ```


    This XML output may then be saved to a file, or sent to another application for
    further processing.


    The MySQL client application may be downloaded from the official MySQL Web site,

    http://www.mysql.com/


    You do not have to restrict your activities to a single table, either; it''s just
    as easy to build an XML document from multiple tables, either by joining them
    or by performing multiple queries at a time. Consider the following revised database
    schema, which links each CD to a track list stored in a separate table:


    | id | artist |

    | 2 | Get A Grip | Aerosmith |

    | 3 | All That You Can''t Leave Behind | U2 |

    | 4 | Androgynyn | Garbage |


    | cd | index |

    | 3 | Beautiful Day | 1 |

    | 3 | Stuck In A Moment You Can''t Get Out Of | 2 |

    | 3 | Elevation | 3 |

    | 2 | Eat The Rich | 1 |

    | 2 | Livin'' On The Edge | 2 |'
