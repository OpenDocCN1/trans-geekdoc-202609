  md: "# Implementation Overview\n\nNow that you've seen how Metabase works, let's\
    \ briefly focus on what happens behind the scenes (you might find it helpful to\
    \ refer to the source code of the application while reading this section).\n\n\
    Metabase is implemented as a collection of different PHP classes, each performing\
    \ a clearly defined set of functions. These classes are the:\n\n+   - Metabase_database_class:A\
    \ class that provides base functionality to driver classes, and that may be reused\
    \ or overridden in the actual driver classes\n\n+   - Metabase_dbtype_class:A\
    \ database-specific class that implements Metabase public interface functions\
    \ for a particular database type\n\n+   - Metabase_manager_class:A class that\
    \ processes database schema documents, compares different schema to build a list\
    \ of differences, and makes the database changes necessary to install or upgrade\
    \ to the new schema\n\n+   - Metabase_parser_class:A class that validates the\
    \ XML-encoded database schema xml_parser_class:A generic XML parser for parsing\
    \ any XML document\n\n# Putting Pieces Together\n\nIt should be noted that the\
    \ generic XML parser used by Metabase, the xml_parser_class, is not included in\
    \ the standard Metabase distribution. You can download it separately from http://phpclasses.upperdesign.com/browse.html/package/4.\n\
    \nListing 9.1 demonstrated, the first order of business is to configure Metabase\
    \ by providing it with information on the database type, username, and password:\n\
    \n```\nMetabaseSetupDatabase(array(\"Type\" => \"mysql\", \"User\" => \"John\"\
    , \"Password\" => \"doe\\ \\$db));\n```\n\nThis allows the Metabase public interface\
    \ (defined in the file database_interface.php) to select the appropriate database\
    \ driver for subsequent queries. Listing 9.4 demonstrates this with a snippet\
    \ of the function code.\n\n> Listing 9.4 The Functions for Configuration of the\
    \ Metabase Public Interface (from database_interface.php)\n\n```\n<php\n// some\
    \ parts of these functions\n// have been deleted for greater readability\nFunction\
    \ MetabaseSetupDatabase($arguments,$$db)\n{\n    global $metabase_databases;\n\
    \n    $database=count($metabase_databases)+1;\n    if(strcmp($error=MetabaseSetupInterface($arguments,$metabase_database[$database]),\"\
    \"))\n{\n```"
