  md: "# Handling SAX Events\n\n# Handling Everything Else\n\nFinally, PHP also offers\
    \ the xml_set_default_handler() function for all those situations not covered\
    \ by the preceding handlers. In the event that no other handlers are defined for\
    \ the document, all events generated will be trapped and resolved by this handler.\n\
    \nThis snippet designates the function defaultHandler() as the default handler\
    \ for the document:\n\n```\nxml_set_default_handler($xml_parser, \"defaultHandler\"\
    );\n```\n\nThe function designated by xml_set_default_handler() must be set up\
    \ to accept the following two arguments:\n\n+   - A handler representing the XML\
    \ parser\n- The data encountered\n\nIn Listing 2.14, every event generated by\
    \ the parser is passed to the default handler (because no other handlers are defined),\
    \ which simply prints the data received. The final output? An exact mirror of\
    \ the input!\n\n# Listing 2.14 Demonstrating the Default Handler\n\n```\n<html>\n\
    <head>\n<basefont=\"Arial\">\n</head>\n<body>\n\n<?php\n// default handler\nfunction\
