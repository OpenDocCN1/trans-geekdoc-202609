    This works with arrays, too—in Listing 5.15, the deserialized result output is
    an array containing the same elements as the original array $stooges.


    Listing 5.15 Deserializing a WDDX Packet into a PHP Array


    ```

    <php

    $stooges = array("larry", "curly", "moe");


    // serialize into WDDX packet

    $packet = wddx_serialize_value($stooges);


    // deserialize generated packet

    $output = wddx_deserialize($packet);


    // view it

    print_r($output);

    ?>

    ```


    # Buyer Beware!


    There''s important caveat to keep in mind when using PHP''s WDDX module. As shown
    in Listings 5.4 and 5.12, the wddx_serialize_var() and wddx_add_var() functions
    work in a slightly different manner from the wddx_serialize_value() function.
    Both wddx_serialize_var() and wddx_add_vars() use WDDX structures (represented
    by <struct> elements) to store variables and their values, regardless of whether
    the variable is a string, number, or array. On the other hand, wddx_serialize_value()
    uses <struct> only if the variable is an associative array.


    This variation in the serialization process can significantly impact the deserialization
    process because PHP''s deserialize() function automatically converts <struct>
    into associative arrays. Consequently, the manner in which you access the original
    value of the variable will change, depending on how it was originally serialized.


    Consider Table 5.1, which demonstrates the difference.


    Table 5.1 A Comparison of Serialization with wddx_serialize_value() and wddx_serialize_var()


    ```

    wddx_serialize_value()

    <php

    $lang = array("PHP", "Perl", "Python", "XML", "JSP");

    ```


    ```

    wddx_serialize_var()

    <php

    $lang = array("PHP", "Perl", "Python", "XML", "JSP");

    ```'
