    PostgreSQL, Sybase, dBase, and ODBC. To simplify every further, PHP

    4.0 includes a database abstraction layer (conceptually similar to Perl''s DBI
    mod-ule) that makes it possible to migrate from one DB to others.


    +   **OOP support.** Classes and objects have been available to PHP since

    version 3.0 of the languages; PHP''s OO support has always been a lit-

