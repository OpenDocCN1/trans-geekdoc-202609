    # Not My Type


    It''s sad true: Different database management systems are not always consistent
    in their support for basic data types. This lack of consistency can cause serious
    difficulties when porting data over one database to another.


    As a database abstraction layer, Metabase has an interesting solution to this
    problem. It defines a set of "base data types" that are independent of the database
    system, and may be used transparently by developers within their applications.
    These base data types include date, numeric (integer, float, decimal), string,
    and Boolean types.


    When it comes to inserting the data into the database, the Metabase API internally
    does the hard work of translating the database type into a native data type supported
    by the underlying database system. For applications that support multiple database
    backends, this feature is extremely useful because it allows developers to work
    with a uniform set of data types without worrying about compatibility between
    different database systems.


    In the event of any change to the database schema, Metabase also allows you to
    update the XML document with the new schema; it then takes care of altering the
    database to conform to the new schema, and by posting records in Listing 9.1 and
    Listing 9.3, all these tasks are accomplished via the database-independent Metabase
    API, which currently supports a number of different databases (including Oracle,
    MySQL, PostgreSQL, mSQL and ODBC), and is therefore a viable real-world alternative
    for developers looking to create portable database-driven web applications.


    +   1. Lemos, Manuel. Class: Metabase—Database Independent Access and Management.
