  md: "database. is both tedious (a developer to manually inspect the code and alter\
    \ it to use the functions specific to the new database) and time-consuming (the\
    \ entire application needs to be retested in order to verify that things still\
    \ work as advertised).\n\nThat's where a database abstraction layer comes in.\
    \ A database abstraction layer provides an interface that can be used with any\
    \ database type, providing the developer with a uniform API to develop applications\
    \ portable across databases. This interface (which may be represented as public\
    \ functions or object methods) is internally mapped to the corresponding native\
    \ PHP functions for each database-type, with the abstraction layer possessing\
    \ the necessary intelligence to decide which native function to call when the\
    \ corresponding public function or object method is invoked. For example, an abstraction\
    \ layer might expose a generic () function, which internally invokes either mysql_connect(),\
    \ OCILogon(), or orbc_connect(), depending on the database type it has been configured.\n\
    \nSo that's the good news. Now, here's the news: In the real world, database abstraction\
    \ layers are usually slower than native functions, take advantage of fewer database\
    \ features, and are slower to catch up with the native API.\n\n# Usage Examples\n\
    \nBefore getting into an analysis of the code, it's instructive to look at a couple\
    \ of usage examples in order to see how Metabase fulfills the design goals stated\
    \ previously. Consider Listing 9.1, which shows the abstraction layer in action:\n\
    \n+   Listing 9.1 Retrieving Data from a MySQL Database with the Metabase\n\n\
    ```\n<?php\n// require Metabase public interface files\nrequire('metabase_interface.php');\n\
    require('metabase_database.php');\n\n// configure Metabase with database type\
    \ and connection parameters\n$Error = MetabaseSetupDatabase(array(\"Type\" =>\
    \ \"mysql\", \"User\" => \"john\",\n\"Password\" => \"doe\", $db);\n\n// select\
    \ a database\nMetabaseSetDatabase($db, \"db127\\\n\n// check for errors\nif($Error\
    \ != \\*\\*)\n{\n  die(\"Database setup error: $Error\\n\");\n}\n```\n\ncontinues"
