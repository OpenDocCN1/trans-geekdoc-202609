    \ internals of the Metabase parser class (defined in the file metabase_parser.php),\
    \ you'll notice a good portion of the code consists of error checks. In you're\
    \ wondering whether this is really necessary, you might want to keep in mind that\
    \ PHP's SAX parser is a non-validating XML parser, and consequently does not support\
    \ a DTD to verify the integrity of the marked-up schema definition. The only way\
    \ to validate the XML data is to manually parse it and aggressively check the\
    \ elements and data within it for type errors.\n\nAfter all the error checks have\
    \ been completed successfully, the next step is to compare the current definition\
    \ with the previous one (if it exists), and build a list of changes between the\
    \ two versions. This list of changes (again structured as an array of arrays)\
    \ is then passed on to the Metabase interface layer (specifically to the MetabaseAlterTable\
    \ function), and then to the driver for that specific database—which takes care\
    \ of performing the actual table modification, dropping, renaming, and adding\
    \ columns to the table."
  merge: -1
  img_proc: true
- pgno: 304
  md: '# patTemplate and patXMLRenderer


    Obviously, this is a broad overview of how Metabase works—a line-by-line explanation
    of the code is beyond the scope of this chapter, especially when you consider
    that the application consists of well over eight thousand lines of code. That
    said, if you have the time (and patience), it''s instructive to read through the
    source code of the application, if only to increase your familiarity with code
    modularization, error handling, and object-oriented programming techniques.


    # Concluding Remarks


    By providing developers with a uniform, database-independent mechanism for executing
    queries, Metabase makes it possible to write web applications that can be ported
    across databases with minimal difficulty, time, and cost. It''s also a good example
    of the type of applications that the XML/PHP combination makes possible, illustrating
    clearly how the simplicity of XML can be combined with the power of PHP''s XML
    parser to create a robust and useful real-world solution.


    # patTemplate and patXMLRenderer


    patTemplate is a rendering engine that employs to simplify web application development
    by using a template-based framework to separate presentation information from
    formatting. It does this by using simple templates to hold presentation semantics—formatting,
    layout, alignment, and so on—and inserting placeholders in these templates to
    represent data. When these templates are rendered by the engine, the placeholders
    embedded within them are replaced by actual data, which may be dynamically retrieved
    from a database, a text file, or any other data source.


    patXMLRenderer builds on the functionality offered by patTemplate, adding an XML
    parser to the mix. This allows data encoded in XML to be retrieved and used in
    a template, with the XML parser automatically creating appropriate variables and
    handing them off to the template engine for inclusion in the final output.


    Together, patTemplate and patXML-renderer provide a simple, efficient solution
    to the problem of generating HTML (or other ASCII) documents from XML-encoded
    data. Part of a larger suite of PHP-based application tools, they are developed
    and maintained by Stefan Schmidt, and can be downloaded free of charge from http://www.php-tools.de/


    # Design Goals


    The patXMLRenderer publishing system was designed around the following goals:


    +   - Separate content from its presentation

    - Allow for the easy transformation of raw data into any other format

    - Provide an extensible framework for the development of new application modules'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Chapter 9 Case Studies


    It accomplishes these goals using a combination of PHP and XML programming techniques.


    # Application Components


    Assuming an XML data source, a patXMLREnderer publishing system consists of two
    primary components:


    +   - A template engine (patTemplate) that handles the creation and management
    of document templates and performs variable interpolation


    +   - An XML parser (patXMLREnderer) that parses one or more XML documents, retrieves
    data from them, and merges this raw data with the templates to produce a composite
    result.


    # Usage Examples


    As before, let''s look at a couple of simple examples before diving into the code
    that drives the application. Consider Listing 9.11, which contains a simple template.


    Listing 9.11 A Template for a Simple HTML Document (superhero.tpl)


    ```

    <!-- this template sets up the main page --

    <patTemplate:tpl name=''superhero''>

    <html>

    <head></head>

    <body>

    <font face=''Arial''>My friends call me (NICKNAME), although my real name

    is {REALNAME}. Why don''t we get together for dinner sometime?</font>

    </body>

    </html>

    </patTemplate:tpl>

    ```


    Each template is enclosed within a pair of <patTemplate:tpl>...</patTemplate:tpl>
    elements and a unique name (in this case, "superhero"). This name attribute is
    used when assigning values to different template variables.

    As you will see in Listing 9.12,


    The uppercase strings you use are enclosed within curly braces in the template
    definition (REALNAME, NICKNAME) are template variables; they serve as placeholders
    for actual data and will be replaced during the rendering phase.


    Listing 9.12 demonstrates the PHP script that initializes the template engine,
    assigns values to the template variables, and puts the two together to create
    a composite result.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Listing 9.12 Assigning Data to Template Variables and Displaying the Composite
    Result


    ```

    <?php

    // include template engine

    include("include/patTemplate.php");


    // initialize template engine

    $template = new patTemplate();


    // set base path for templates

    $template->-SetBaseDir("templates");


    // read template data

    $template->ReadTemplatesFromFile("superhero.tpl");


    // define values for template variables

    $template->AddVar(''superhero'', ''NICKNAME'', ''The Incredible Hulk'');

    $template->AddVar(''superhero'', ''REALNAME'', ''Bruce Banner'');


    // display output

    $template->DisplayParsedTemplate();

    ?>

    ```


    Listing 9.13 contains the resulting HTML document, with Figure 9.3 demonstrating
    what it looks like in a browser.


    # Listing 9.13 The HTML Document Generated by Listing 9.12


    ```

    <html>

    <head>

    <body>

    <font face="Arial" size="+1">My friends call me The Incredible Hulk, although
    my=real name is Bruce Banner. Why don''t we get together for dinner sometime?</font>

    </body>

    </html>

    ```


    # Checking Out the Competition


    If you''re interested in developing template-driven web sites, you might want
    to also look at the FastTemplate and Smarty engines, which share some semantic
    similarities with the patTemplate class. Both are available on the web at http://www.thewebmasters.net/
    and http://freshmeat.net/projects/smarty/, respectively.'
  merge: -1
