  md: '# Chapter 6 PHP and XML-Based Remote Procedure Calls (RPC)


    By and large, introspection is a good idea. It provides application developers
    with an efficient, transparent mechanism of obtaining API documentation, thereby
    making remote services more accessible and easier to use—which, after all, is
    the holy grail of RPC. This book''s web site includes links to few web-based introspection
    clients that demonstrate this capability further.


    # Few Examples


    Over the preceding sections, you''ve seen quite few examples of how the RPC library
    works and should now have a fairly clear understanding of the theory. This section
    puts it into practice with a few real-life demonstrations of how this technology
    can be used across the web.


    # Retrieving Meteorological Data with XML-RPC


    I''ll begin with something simple—a basic RPC client-server implementation for
    information delivery over HTTP. I''ll be using a MySQL database as the data source,
    XML-RPC as the expression language for the procedure calls and responses, and
    PHP for the actual mechanisms.


    # Requirements


    Let us assume the existence of a fictional government department that is charged
    with the task of obtaining meteorological information and charting it for statistical
    purposes. In a rare feat of generosity, this department has decided to make some
    of the meteorological readings available to the general public, in the hope of
    encouraging amateur meteorologists (and interested science students) to take an
    interest in the subject-field. Consequently, this department needs some way to
    broadcast its raw data (at the moment, sets of temperature readings for different
    cities) over the web, to be available to any connecting client.


    Here''s a snippet of the MySQL database table that contains the temperature data
    (you may assume that this table is automatically updated on a regular basis by
    an independent process).


    | | t1 | t2 | t3 |

    |---|---|---||

    | BOM | 27.6 | 26.9 | 26.1 |

    | LON | 10.5 | 11.9 | 10.8 |

    | NYC | 17.69 | 15.8 | 14.99 |


    All that is required is an interface to this database so that users can connect
    to the system and obtain readings for each city (keyed against each city''s unique
    three-letter city code). RPC''s client-server architecture provides a suitable
    framework for this kind of application. An RPC server can be used at one end of
    the connection to accept XML-encoded remote procedure calls (containing arguments
    such as the city code'
