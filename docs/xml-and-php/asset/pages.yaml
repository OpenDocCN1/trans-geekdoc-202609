- pgno: 178
  md: '> "Any sufficiently advanced technology is indistinguishable from magic."

    ~ARTHUR C. CLARKE


    # 6


    # PHP and XML-Based Remote

    Procedure Calls (RPC)


    IT''S QUITE LIKELY, IF YOU''RE COMING AT THIS from a non-C/C++ background, that
    you''ve never heard of Remote Procedure Calls (RPC).This is a shame, because not
    only has RPC been around for a while, it''s also a fairly interesting idea that
    opens the door to a new generation of cutting-edge, network-based services.


    Stripped down to its bare bones, RPC defines a client-server framework for distributed
    computing, allowing procedures on a server to be remotely executed by a client.
    The existing network layer is used for communication between the client and server;
    this implies that the client invoking the procedure may be on either the same
    physical machine or a completely different machine on the network (hence the remote
    procedure call).


    Now, the Internet is the biggest, fastest of all; and when it comes to implementing
    RPC over the web, it makes sense to use HTTP as the transport layer and XML as
    the encoding toolkit. All that''s required is a formal specification to handle
    the nitty-gritty details: the format of RPC requests and responses, data types,
    error handling, and so on. And so we have XML-RPC, a specification for remote
    procedure calls in XML; and Simple Object Access Protocol (SOAP), an emerging
    W3C standard for encoding and packaging data for distribution across a peer-to-peer
    network. Both are XML-based technologies, both are fairly simple to use, and both
    are supported in PHP 4.1.0.'
