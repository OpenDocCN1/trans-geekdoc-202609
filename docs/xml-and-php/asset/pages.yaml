  md: '# 208 Chapter 7 PHP, XML, and Databases


    their own took to access XML-encoded data, using either a SAX or DOM parser; this
    can add to development time (because there isn''t a common standard) possible
    integration difficulties with applications from other vendors.


    Encoding your data into XML can also cause problems if your applications or systems
    don''t understand the language. In such situations, too, a traditional database
    system (that exposes a standard API to developers) would be preferable.

    It should be noted that there''s no "one-size-fits-all" answer to the question
    of which technology is most appropriate; the factors involved are fairly complex,
    and they vary from situation to situation. As technology evolves, the question—many
    databases now support XML as a data type; and a new database, the native XML database,
    offers the best of both worlds, combining the simplicity of XML with the feature
    set of traditional database systems.


    # Knowledge Is Power


    Interested in learning more about XML databases, and XML databases? Drop by the
    companion web site for this book for articles on the topic. Go to: http://www.xmlphp.com
    or http://www.newriders.com.


    # Exporting Database Records To XML


    As the web moves to an XML-based paradigm, one of the most common problems faced
    by developers converting legacy data, usually stored in a database, into corresponding
    XML data. With this in mind, let''s look at some practical examples that demonstrate
    how data stored in an SQL-compliant database system can be converted into well-formed
    XML.


    Note that the code listings in this section assume the existence of a MySQL database
    and a familiar access functions (specifically, its MySQL functions). In case you
    don''t already have MySQL, you can download it from http://www.mysql.com/, and
    SQL dump files for the database tables used in this section may be obtained from
    this book''s companion web site.


    # Dynamically Generating XML from a Database


    I''ll begin with a simple example. Let''s assume the existence of a table holding
    information on a personal CD collection. Here''s a snippet from the table:


    |----------------------+----------------------+|

    | id | title               | artist               |

    |----------------------+----------------------+|

    | 2 | Get A Grip          | Aerosmith            |

    | 3 | All That You Can''t Leave Behind | U2     |

    | 4 | Androgyny           | Garbage             |

    |----------------------+----------------------|'
