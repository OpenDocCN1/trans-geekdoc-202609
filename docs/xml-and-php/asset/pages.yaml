    \ in | GenericCorp | handler out | | handler in | | We're just like everyone else.\
    \ | handler out |\n\n# Handling Processing Instructions\n\nYou can set up a handler\
    \ for PIs with xml_set_processing_instruction_handler(), which operates just like\
    \ the character data handler above. This snippet designates the function PIHandler()\
