  md: '# A Few Examples 151


    # Requirements


    In order to set the tone, let''s again consider a fictional organization, Generic
    Corp (GCorp), which provides its customers with Linux-based software widgets.
    GCorp updates these widgets on a regular basis, and makes them available to paying
    customers via an online repository.


    Now, GCorp has no fixed update schedule for these widgets—they''re handled by
    different development teams, and are released to the online repository as installable
    features in RedHat Package Manager (RPM) runtime at irregular intervals. What
    GCorp wants is for every customer to automatically receive notification of software
    updates and when they are released.


    Most companies would send out email notification when an update happened. But
    this is GCorp, and they like to make things complicated.


    What GCorp has planned, therefore, is to have a WDDX server running on its web
    site, which automatically scans the repository and creates a WDDX packet containing
    information on the latest software versions available. This information can then
    be provided to any requesting client.


    The client at the other end should have the necessary intelligence built into
    it to compare the version numbers received from the server with the version numbers
    of software currently installed on the local system. It may automatically download
    and install the latest versions, or simply send notification to the system administrator
    about the update.


    This is easily accomplished with WDDX; for variety, I''ll perform the data exchange
    over TCP/IP sockets rather than HTTP.


    # Server


    Let''s begin with the server (see Listing 5.21), which opens up a socket and waits
    for connections from requesting clients.


    Listing 5.21 A WDDX Server to Read and Communicate Version Information Over TCP/IP
    Socket


    ```

    <php

    // IMPORTANT! This script should not be run via your Web server!

    // You will need to run it from the command line,

    // or as a service from inetd.conf


    // set up some socket parameters

    $ip = ''127.0.0.1'';

    $port = 7890;


    // area to look for updated files

    $repository = ''/tmp/updates/'';

    ```


    continues'
