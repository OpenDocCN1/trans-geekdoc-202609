  md: '# Handling Errors


    During the initial stages of application development, it''s possible to get by
    using error handlers in your code, however, as an application is being packaged
    for release, graceful error handling and recovery becomes a must.


    PHP allows developers to accomplish this error handling via its xml_get_error_code()
    function (which returns the error code returned by the parser when it hits a bump)
    and xml_error_string() function (which returns a short, human-readable error message
    corresponding to the error code). Table 2.2 is a list of error codes and their
    corresponding named constants, together with what they mean.


    Table 2.2 SA Parser Error Codes


    | Error Code | Error Constant | Meaning |

    |---|---|--|

    | 1 | XML_ERROR_NO_MEMORY | Parser out of memory |

    | 2 | XML_ERROR_SYNTAX | Syntax error |

    | 3 | XML_ERROR_NO_ELEMENT | No element found |

    | 4 | XML_ERROR_INVALID_TOKEN | Document not well-formed |

    | 5 | XML_ERROR_UNCLOSED_TOKEN | Unclosed token |

    | 6 | XML_ERROR_PARTIAL_CHAR | Unclosed token |

    | 7 | XML_ERROR_TAG_MISMATCH | Mismatched attribute |

    | 8 | XML_ERROR_DUPLICATE_ATTRIBUTE | Duplicate attribute |

    | 9 | XML_ERROR_JUNK_AFTER_DOC_ELEMENT | Junk after document element |

    | 10 | XML_ERROR_PARAM_ENTITY_REF | Illegal parameter entity reference found |

    | 11 | XML_ERROR_UNDEFINED_ENTITY | Undefined entity |

    | 12 | XML_ERROR_RECURSIVE_ENTITY_REF | Recursive entity reference |

    | 13 | XML_ERROR_ASYNC_ENTITY | Asynchronous entity |

    | 14 | XML_ERROR_BAD_CHAR_REF | Reference to invalid character number |

    | 15 | XML_ERROR_BINARY_ENTITY_REF | Reference to binary entity found |

    | 16 | XML_ERROR_ATTRIBUTE_EXTERNAL_ENTITY_REF | Reference to external entity
    within attribute |

    | 17 | XML_ERROR_MISPLACED_XML_PI | XML processing instruction not found at start
    of external entity |

    | 18 | XML_ERROR_UNKNOWN_ENCODING | Unknown document encoding |

    | 19 | XML_ERROR_INCORRECT_ENCODING | Incorrect document encoding specified |'
  merge: -1
