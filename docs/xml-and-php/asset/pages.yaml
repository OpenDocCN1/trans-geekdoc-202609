  md: "# 140 Chapter 5 PHP and Web Distributed Data exchange (WDDX)\n\nListing 5.12\
    \ Continued\n\n```\n<struct>\n  <var name='flavor'>n    <string>strawberry</string>\n\
    \  </var>\n</struct>\n</data>\n</wddxPacket>\n```\n\n# The wddx_add_vars() Function\n\
    \nPHP also allows you to build a WDDX packet incrementally, adding variables to\
    \ it as they become available, with the wddx_add_vars() function. Listing 5.13\
    \ demonstrates this approach, building a WDDX packet from the results of a form\
    \ POST operation.\n\nListing 5.13 Building a WDDX Packet Incrementally with wddx_add_vars\n\
    \n```\n?php\n\n// create a packet handle\n// the argument here is an optional\
    \ comment\n$wp = wddx_packet_start(\"A packet containing a list of form fields\
    \ with values\");\n\n// iterate through POSTed fields\n// add variables to packet\n\
    wddx_add_vars($wp, \"HTTP_POST_VARS\");\n\n// end the packet\n// you can now assign\
    \ the generated packet to a variable\n// and print it\nwddx_packet_end($wp);\n\
    ?\n```\n\nThis is slightly more complicated technique than the ones described\
    \ previously. Let's go through it step by step:\n\n+   1. The first order of business\
    \ is to create an empty WDDX packet to hold the data; this is accomplished with\
    \ the aptly named wddx_packet_start() function, which returns a handle for the\
    \ newly minted packet.\n\n```\n$wp = wddx_packet_start(\"A packet containing a\
    \ list of form fields with\nvalues\");\n```\n\nThis handle is used in all subsequent\
    \ operations. Note that the wddx_packet_start() function can be passed an optional\
    \ comment string, which is used to add a comment to the header of the generated\
    \ packet."
