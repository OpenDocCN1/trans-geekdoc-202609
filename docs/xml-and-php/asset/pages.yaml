    # Using XSLT to Generate Output in Different Formats from a Single XML Source


    Although XSLT is certainly exciting, there''s an important caveat: Using PHP to
    perform XSLT can degrade performance on a web site quite substantially. So, it''s
    a very bad idea to use this technique simply as a one-time publishing mechanism
    to generate static HTML or XML files on the server, which can be parsed and returned
    to the client faster than code-intensive PHP scripts. You need to regenerate,
    or repubish, the static documents each time your stylesheet or XML source changes,
    but the extra effort pays out dividends in terms of better server performance
    and faster response times.


    With this mind, my final example demonstrates an extremely primitive publishing
    system. I use a single XML document and multiple XSLT stylesheets to output data
    in three different formats: HTML, WML, and comma-separated ASCII (CSV). Listing
    4.16 is the sample XML document, which lists elements from the periodic table.'
  merge: -1
  img_proc: true
