- pgno: 181
  md: '# Chapter 6 PHP and XML-Based Remote Procedure Calls (RPC)


    Obviously, this is a simplified version of the RPC programming model—it does not
    address issues such as procedure registration, state maintenance, error handling,
    or security. However, it should be sufficient to explain the fundamental principles
    of the programming model, and lay the foundation for the material in subsequent
    sections.


    If you want to learn more about RPC, drop by this book''s companion web site,
    which contains links to web sites with more information on the topic.


    # XML-RPC


    XML-RPC, as defined on its official web site, is “… a spec and a set of implementations
    that allow software running on disparate operating systems, running in different
    environments to make procedure calls over the Internet…” it was created in 1998
    to provide a simple framework for transmitting procedure calls and receiving responses
    over the Internet.


    As the preceding definition states, XML-RPC actually consists of two parts: the
    XML-RPC specification itself, which defines the structure and format of XML-RPC
    procedure calls and responses; and a set of implementations for different platforms.
    Because XML-RPC was designed from the-get to be easily portable, it won’t surprise
    you to hear that it has spawned a diverse array of implementations. As of this
    writing, the official web site lists more than 50 implementations in languages
    such as Lisp, AppleScript, JavaScript, C, Perl, Python, and PHP.


    # Déjà Vu


    If this sounds familiar, give yourself 10 points for attentiveness—because it
    should. Though the two specifications address different problems, XML-RPC shares
    a number of important traits with Web Distributed Data Exchange (WDDX) that was
    last seen in Chapter 5, “PHP and Web Distributed Data Exchange(WDDX).” Here’s
    a brief list:


    +   - WDDX nor XML-RPC is an official standard per se; they’re both open specifications
    created by one company and popularized by the developer community.


    +   - Both specifications provide an open, extensible architecture for information
    exchange.


    +   - Both specifications use XML as their encoding toolkit. XML-RPC requires
    HTTP exclusively as its transmission layer, where WDDX can be transmitted over
    any protocol that supports text (HTTP, POP, FTP, SMTP, and so on).


    +   - Both specifications use similar data structures to represent native data
    types.


    +   - Both specifications’ implementations are available for a wide variety of
    languages and platforms.


    +   1. UserLand Software, Inc. “XML-RPC Home Page!” Available from the Internet:
    http://www.xmlrpc.org/. Last updated: November 5, 2001.'
