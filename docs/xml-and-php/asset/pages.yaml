    </methodResponse>\n```\n\nIn this case, the document element remains the same,\
    \ the <params> element is replaced by a <fault> element, which is itself a <struct>\
    \ containing an error code and a human-friendly error string.\n\nPretty much covers\
    \ the basics of XML-RPC. For more information and examples, you should refer to\
    \ the official web site at http://www.xmlrpc.org/, which contains the complete\
    \ XML-RPC specification (with examples and code samples), a list of implementations\
    \ for different platforms, tutorials, FAQs, and a discussion forum.\n\n# SOAP\n\
    \nSimilar in concept, yet broader in scope and implication, the Simple Object\
    \ Access Protocol (SOAP), an emerging W3C standard for decentralized information\
    \ exchange between peers in a networked environment. Designed specifically for\
    \ information transfer between distributed applications and objects built on different\
    \ platforms, layered (like XML-RPC) on XML and HTTP, SOAP has the support of industry\
    \ heavyweights such as Microsoft, IBM, HP, Ariba, Lotus, SAP, and is expected\
    \ to shortly share W3C Recommendation status.\n\nSOAP is, fundamentally, a framework\
    \ for stateless data exchange systems. It is a specification for the creation\
    \ of structured, typed data designed for easy transmission across a network. As\
    \ of this writing, the SOAP specification addresses the structure of SOAP packets\
    \ and the SOAP processing model, leaving items such as the mechanics of packet\
    \ transmission and routing, packet integrity, and security to be handled at the\
    \ application layer.\n\nIt is not necessary that the data encoded using SOAP be\
    \ an RPC request or response. SOAP can be used to transfer data of any kind—RPC\
    \ is just one example of its applications."
  merge: -1
