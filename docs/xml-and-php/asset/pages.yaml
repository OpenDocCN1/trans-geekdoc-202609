    \ are written. If I'd omitted this file, the output would have been returned as\
    \ a string.\n\n# Summary\n\nThis chapter offered a brief explanation of XSL Transformations,\
    \ moving on rapidly to a description of PHP's support via its generic XSLT API.\
    \ It demonstrated the standard process of performing XSL transformations with\
