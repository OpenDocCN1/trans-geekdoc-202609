    # Manipulating DOM Trees


    The preceding section discussed an already-extant DOM tree, demonstrating how
    the nodes of the tree can be processed in a recursive manner. That''s not all
    you can do with the DOM, though; it''s also possible to programmatically construct
    DOM trees from scratch, or modify existing tree structures, and save the result
    as one or more XML documents. This section discusses the details.


    # Creating New DOM Trees


    If you go back to the section dealing with PHP''s DOM classes, you''ll see that
    the DOMDocument and DOMElement objects include functions to create new nodes,
    documents, and attributes. The first of these is the `new_xmldoc()` method of
    the DOMObject object, which constructs and returns a new instance of the DOMDocument.


    After a DOM instance is available, it becomes possible to add new element and
    text nodes with the `add_root()` and `new_child()` methods. And why stop at elements?
    The `set_attribute()` method allows you to define and add attributes to specific
    elements as well. The following code snippet (see Listing 3.14) demonstrates this
    by creating a XML document tree on the fly with the `add_root()` and `new_child()`
    methods:


    Listing 3.14 Creating an XML Document Tree


    ```

    <php

    // createDocument object

    $doc = new_xmldoc("1.0");


    // add root node

    $root = $doc->add_root("article");


    // set attribute for root node

    $root->set_attribute("id", "567");


    // add children to the root

    $title = $root->new_child("title", "Goat milk for dinner can cause insomnia");

    $author = $root->new_child("author", "K. Kittle");

    ```'
