- pgno: 20
  md: '> "Toto, I''ve a feeling we''re not in Kansas anymore."

    ~DOROTHY, THE WIZARD OF OZ


    # XML and PHP Basics


    XML AND PHP ARE BOTH POWERFUL TECHNOLOGIES and open up tremendous possibilities
    for the creative developer. Each has its own advantages and unique capabilities;
    but together they form an integrated whole which is far greater than just the
    sum of its parts.


    Before getting into the nitty-gritty of program code or tackling the intricacies
    of PHP''s XML functions, it''s important to take a look and look at things in
    context. This chapter is designed to accomplish that—it contains a quick overview
    of both XML and PHP; discusses the design goals, capabilities, and features of
    each; and puts the material that follows within a larger context.


    If you''re new to PHP or XML (or both), you should make it point to browse the
    material in this chapter; it will explain some fundamental concepts and principles
    and prepare you for the journey ahead. If you''re an experienced PHP or XML user,
    you might want to skip the introductory comments (found the "XML" and "PHP" sections)
    and jump straight to the concluding material (in the section, "PHP and XML"),
    which explains how PHP and XML fit together and offers a preview of the possibilities
    that arise from their union.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# XML


    This section is designed to give you a broad overview of the Extensible Markup
    Language (XML). It discusses XML''s history, need, and rationale, together with
    a quick look at some basic XML constructs and applications.


    XML actually is a subset of the the Standardized General Markup Language (SGML).
    SGML is an internationally accepted standard for describing any type of information;
    however, it''s too complex for the relatively simple world of the web. And so,
    the World Wide Web Consortium (W3C) created a modified version of SGML specifically
    for the web, named it XML, and released it on an unsuspecting public sometime
    in 1998.


    Over the past years, XML has received more than its allotted fifteen minutes of
    fame, with technology pundits and business leaders alike singing its praises.
    It''s been crowned the Next Big Thing, both on account of its ease of use and
    its potential for revolutionizing the way information is exchanged and used. Some
    of this is hype and is not; either, it''s quite clear that XML is going to be
    around for a while, and that, wisely, can indeed be a powerful tool for the management
    and effective exploitation of information.


    XML works by "marking up" with descriptive tags, in the same way HTML does. The
    difference is that HTML was designed specifically to format data for web browsers,
    and, as such, limited to a predefined set of tags and functions. XML, by contrast,
    was designed as a web-friendly meta-data language and, therefore, lays down the
    rules for document markup (leaving it to the document author to define his her
    own tags). As an example, consider the following block of text:


    A Man His Mouse


    J. Gilbert Gumpfinch III, 23 Nov 2001


