    # # Recompiling PHP to Add XML Support


    YOUR SOJOURN THROUGH THIS BOOK, you may have noticed that many of the extensions
    require special extensions to be compiled into PHP in order to function correctly.
    In the event that your PHP build doesn''t already include support for these XML-specific
    extensions, you will need to recompile PHP to activate support for these extensions.


    Some of these extensions can be activated simply by adding an appropriate compile
    time parameter during the build process; others require more complex configuration,
    including the installation of specific external libraries. This appendix documents
    the entire process, describing how the different pieces can be put together to
    create a PHP build that supports all the technologies discussed in this book.


    It should be noted at the outset that this appendix is intended only as an overview
    of the process of recompiling PHP as a static Apache module with support for XML-specific
    extensions. It is not intended to replace the installation instructions that ship
    with each of the packages described as follows. In the event that you encounter
    difficulties in installing or compiling any of the packages discussed in this
