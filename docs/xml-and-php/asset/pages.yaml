    \ $title);\n  $record->new_child('artist', $artist);\n}\n```\n\n+   5. After the\
    \ document has been completely generated, the dumpmem() object method is used\
    \ to dump the XML tree as a string.\n\n```\necho $doc->dumpmem();\n```"
