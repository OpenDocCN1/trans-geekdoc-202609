  md: '# Chapter 2 PHP and the Simple API XML (SAX)


    How did I accomplish this? Quite easily by using the various event handlers exposed

    by SAX. As the script in Listing 2.23 demonstrates, I defined handlers for elements,

    character data, PIs, and external entities. I created two associative arrays,
    which

    map XML element names to HTML constructs; each time one of the XML elements

    entounters, PHP replaces it with the corresponding HTML output, and

    prints it. Pis and external entities are handled in the normal manner; note that
    this

    time around, my external entity handler is not merely displaying the content of
    the

    referenced entity, but it is also parsing its contents.


    Listing 2.23 demonstrates how easy it is to take marked-up XML data and “do

    some useful” with it—in this case, render it in a format capable of display in
    a

    standard web browser. You could easily format the XML as ASCII text, WML\pages,
    or (in combination with PHP’s PDF generation functions) documents.

    A technique like the one described previously is suitable for short, XML

    d own; however, it can prove to be tedious when dealing with larger, more\complex
    documents. For documents like these, you might want to consider using the

    Document Object Model (DOM), discussed in the next chapter; or a more powerful

    sheetsheet language as XSLT, discussed in Chapter 4, “PHP” and Extensible

    sheetsheet Language Transformations (XSLT).


    # Parsing and Displaying RSS Data on a Web Site


    Another common application of PHP’s SAX parser involves using it to parse

    RDF Site Summary (RSS) documents and extract data from them for display on a

    web site.


    In case you already know, RSS 1.0 documents are well-formed XML docu\ments that
    conform to the W3C’s Resource Description Format (RDF) specification.

    RSS 1.0 documents typically contain a description of the content on a web site.
    Many

    popular portals publish these documents as an easy way to allow other web sites

    sndicate and link to their content.


