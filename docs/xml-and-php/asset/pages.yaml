- pgno: 53
  md: "# 34 Chapter 2 PHP and the Simple API for XML SAX\n\nListing 2.8 Continued\n\
    \n```\n</article>\nEOF;\n\n// initialize parser\n$xml_parser = xml_parser_create();\n\
    \n// set cdata handler\nxml_set_character_data_handler($xml_parser, \"characterDataHandler\"\
    );\n\n// set PI handler\nxml_set_processing_instruction_handler($xml_parser, \"\
    PIHandler\");\n\nif ($xml_parse($xml_parser, $xml_data))\n{\n    die(\"XML parser\
    \ error: \" . xml_error_string(xml_get_error_code($xml_parser)));\n}\n\n// all\
    \ done, clean up!\nxml_parser_free($xml_parser);\n\n?>\n<body>\n</html>\n```\n\
    \nListing 2.8 designates the function PIHandler() as the handler to be called\
    \ for all PIs encountered within the document. As explained previously, this function\
    \ is passed the PI target and instruction as function arguments.\n\nWhen a PI\
    \ is located within the document, PIHandler() first checks the PI target ($target)\
    \ to see if it is a PHP instruction. If it is, eval() is called to evaluate and\
    \ execute the PHP code ($data) within the PI. If the target is any other application,\
    \ PHP obviously cannot execute the instructions, and therefore resorts to merely\
    \ displaying the PI to the user.\n\nCareful eval()-uation\n\nYou may not know\
    \ this (I didn't), PHP--which is usually pretty rigid about ending every statement\
    \ with a semicolon--allows you to omit the semicolon from the statement immediately\
    \ preceding a closing PHP tag. For example, this is valid PHP code:\n\n```\n<php\
    \ print 'Copyright UNhooo Inc., . date(\"Y\", mtime()) ?>\n```\n\nHowever, if\
    \ you were to place this code in a PI, and pass it to eval(), as in Listing 2.8,\
    \ eval() would generate an error. This is because the eval() function requires\
    \ that all PHP statement(s) passed to it for evaluation must end with semicolons."
  merge: -1
  img_proc: true
