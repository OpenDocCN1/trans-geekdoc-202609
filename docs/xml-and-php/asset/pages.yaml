    # Applications


    In the old days, web sites consisted of static HTML pages with a few images thrown
    in for variety. That is no longer the case: today''s web sites are complex and
    demanding, with movie-quality animation, high-res audio and video, and web pages
    built-the-fly from immense databases churning in the background. And, as you might
    imagine, PHP''s use of, performance, and proven track record ensure that the language''s
    primary applications lie in the field of these dynamic, high-traffic web sites
    and applications.


    PHP is well-suited to such complex web applications for a number of reasons. The
    language''s built-in database capabilities ensure that it can connect easily to
    a variety of different databases for dynamic page generation; its payment processing
    and validation capabilities make it a good choice for online commerce; and its
    portability across'
