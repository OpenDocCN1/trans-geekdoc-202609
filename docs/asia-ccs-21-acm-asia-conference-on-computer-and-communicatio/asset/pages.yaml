    # 4.6  Implementation


    We implemented Eth2Vec by utilizing Kam1n0² and py-solc-x³. First, the main module,
    PVDM model, was implemented by Kam1n0, which is a server system [10] utilized
    for binary analysis [11]. We mainly modified the source codes in DisassemblyFactoryIDA.java
    and ExtractBinaryViaIDA.py. In particular, ExtractBinaryViaIDA.py initially generates
    a JSON file extracted from IDA by disassembling binary codes, and then DisassemblyFactoryIDA.java
    takes the file to store the binary codes within Kam1n0. However, IDA cannot use
    EVM bytecodes for implementing Eth2Vec. Therefore, we changed ExtractBinaryViaIDA.py.
    For instance, the code information is obtained by compiling a Solidity file with
    py-solc-x without IDA, and then its resultant assembly codes, abstract syntax
    tree (AST), and binary codes are extracted.


    Meanwhile, the current output display follows the interface of Kam1n0, vulnerabilities
    are listed as the function-level for each contract. In particular, vulnerabilities
    of test contracts are displayed with their confidence. We show an output example
    of Eth2Vec in Appendix A.


    We release the source codes of the whole implementation publicly via GitHub (https://github.com/fseclab-osaka/eth2vec).


    # 5  EXPERIMENTS


    In this section, we describe the experiments we conducted to evaluate Eth2Vec.
    First, we describe the purpose of the experiments. Then, we discuss the datasets
    and the training methodologies used for evaluation. Finally, we show the experimental
    results.


    # 5.1  Purpose of Experiments


    To evaluate the performance of Eth2Vec, we try to detect vulnerabilities in codes
    to be analyzed through the training with the known vulnerable contracts. To do
    this, we first check if Eth2Vec appropriately represents the relationship between
    codes to be analyzed and codes learned in the training phase. We evaluate clone
    detection of codes written in the Solidity language to confirm whether Eth2Vec
    can appropriately extract features of the codes. In doing so, we also evaluate
    semantic clones based on the lexical-semantic relationship to confirm the robustness
    of Eth2Vec against code rewrites.


    Next, we check whether all the learned vulnerabilities are identified by training
    the codes and their code similarity with a given code. In doing so, we also evaluate
    consistency of the vulnerability detection with the results of the clone detection
    described above. In particular, we check if an output of the vulnerability detection
    is identical to the vulnerabilities in code identified as clones and if the clones
    are contained in the clone detection output.


    We confirm that Eth2Vec can extract features precisely and thus can detect vulnerabilities
    through the experiments mentioned above. We also compare the performance of Eth2Vec
    with that of the existing work by Momeni et al. [31], which extracts features
    manually, as a baseline.


    # 5.2  Experimental Setting


    As mentioned above, experiments are conducted in two stages, i.e., clone detection
    and vulnerability detection of smart contracts. We describe the setting for each
    experiment below. We first describe the dataset and the baseline in detail.


    # 5.2.1  Dataset.


    We collect 5,000 contract files from Etherscan⁴, which is an open database of
    smart contracts, as a dataset utilized in the experiments. These 5,000 files are
    also identical to files


