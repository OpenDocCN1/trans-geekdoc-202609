    $$\mathcal{CT}(in)=\vec{v}_{\mathcal{P}(in)}\Vert\frac{1}{|\mathcal{A}(in)|}\sum_{t\in\mathcal{A}(in)}\vec{v}_t.$$
    \tag{3}


    where $\mathcal{P}(in)$ is one operation with respect to $in$, $\mathcal{A}(in)$
