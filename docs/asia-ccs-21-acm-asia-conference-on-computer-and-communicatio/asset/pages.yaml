    # 3.2  Technical Difficulty


    Although several machine-learning-based static analysis tools for smart contracts
    have been proposed in literature [25, 26, 31, 42, 48], accuracy of their vulnerability
    detection is limited even on known vulnerabilities. In other words, accuracy significantly
    decreases when codes are rewritten from the original codes. Following the problem
    formulation described above, the limitation described in Section 1.1 as our motivation
    is formalized as follows: even if $c_t$ with a vulnerability $V_i$ which is included
    in $CV$ for any $i \in [1,n]$, $\epsilon_i^{c_t} \ll \epsilon_i^{c_t''}$ holds
    for $c_t \notin CV$. We call such a situation non-robust. The limitation related
    to the accuracy of vulnerability detection described above is caused by the insufficient
    extraction of features of the existing tools. In general, a machine learning model
    needs features as inputs, which are manually extracted, and then learns the features
    explicitly. However, features for representing smart contracts to be analyzed
    are non-obvious because the history of Ethereum smart contracts is shorter than
    other general languages such as C and Java [52]. Intuitively, the limitation about
    the non-robustness is denoted as that required of a model $M$ is unknown. Another
    reason for the insufficient extraction of features is the lack of code samples
    of smart contracts [52].


    # 4  DESIGN OF ETH2VEC


    In this section, we present Eth2Vec. We first describe the design concept to overcome
    the technical difficulty described in the previous section and then present the
    tool overview and its building blocks. Finally, we present the Eth2Vec model with
    its objective function.


    # 4.1  Design Concept


    We aim to solve the technical difficulty by leveraging neural networks for natural
    language processing. For the natural language processing by machine learning,
    each word is vectorized as a token, and each sentence is vectorized as a sequence
    in general. To incorporate natural language processing, we leverage the *PV-DM*
    model [22] which vectorizes each paragraph by taking into the context of the paragraph
    account. More specifically, we extend the PV-DM model whereby code of each contract
    is vectorized instead of the natural language. Eth2Vec can thus extract features
    implicitly.


    To provide the extended PV-DM model with code of contracts, we also developed
    a new module named *EVM Extractor* to obtain syntax and semantics for each contract.
    For instance, EVM Extractor obtains principal code information, e.g., a function
    name and start address. Eth2Vec then restricts the amount of the code information
    to be provided the PV-DM model because the throughput of Eth2Vec may decrease
    in proportion to the amount of the information. Eth2Vec can thus achieve the feature
    extraction appropriately and efficiently. Afterwards, Eth2Vec computes the code
    similarity by utilizing the code information vectorized through neural networks
    for the natural language processing described above. When


    # 4.2  Tool Overview


    Eth2Vec consists of two modules, i.e., PV-DM model [22] for neural networks to
    deal with paragraphs and EVM Extractor to create inputs of the PV-DM model from
    Solidity source codes.


    The overview of Eth2Vec is shown in Figure 1. First, a PV-DM model is utilized
    as neural networks to deal with bytecodes. In particular, the PV-DM model executes
    unsupervised learning by taking JSON files generated from bytecodes as input and
    then computes the code similarity for each contract. To do this, we developed
    the EVM Extractor as a module to create inputs of the PV-DM model from EVM bytecodes
    because the PV-DM model cannot deal with EVM bytecodes initially. More specifically,
    the EVM Extractor analyzes EVM bytecodes syntactically and creates JSON files
    for instruction-level, block-level, function-level, and contract-level.


    As a result, Eth2Vec takes EVM bytecodes to be analyzed as input, and then returns
    lists of code clones and their vulnerabilities for contract-level from a user’s
    standpoint. Meanwhile, vulnerabilities in contracts for training data are identified
    in advance by the use of existing tools [27, 45]. Vulnerabilities for test data
    are then evaluated by the code similarity with the vulnerable contracts. Eth2Vec
    outputs vulnerabilities for the function-level in codes to be analyzed. Namely,
    vulnerable functions can be identified by Eth2Vec.


    # 4.3  Building Blocks


    Eth2Vec utilizes the PV-DM model [22] and EVM Extractor as building blocks.


    # 4.3.1  PV-DM model.


    The PV-DM model vectorizes text data for paragraph-level in contrast to Word2Vec
    [29] to vectorize text data for sentence-level. Intuitively, it outputs vector
    representations for each word and each paragraph. More concretely, given a text
    paragraph consisting of multiple sentences, a PV-DM model applies a sliding window
    over each sentence. The sliding window starts from the beginning of the sentence
    and moves forward a single word at each step. In doing so, the PV-DM model executes
    a multi-class inference task such that it maps the current paragraph into a vector
    and each word in the context into a vector. More precisely, the model averages
    these vectors and infers the target word from the vocabulary via the softmax function.
    The architecture of the PV-DM model consists of one hidden layer: for instance,
    the model obtains vectors for the given input and then compute the average of
    the vectors and a sigmoid function. The output layer computes a classification
    result based on a softmax function. Formally, given a text that contains a list
    of paragraphs $p \in T$, each paragraph $p$ contains a list of sentences $s \in
    p$, and each sentence is a sequence of $|s|$ words $w_t \in s$. Then, the PV-DM
    model maximizes the log probability as follows:


    $$\sum_{p}^{T}\sum_{s}^{p}\sum_{t=k}^{|s|-k} \log P(w_t \mid p, w_{t-k}, \cdots,
    w_{t+k}). \tag{1}$$'
