    Second, the current work only detected vulnerabilities in contracts included in
    the training dataset utilized in our experiment. There are potentially many vulnerable
    contracts that have already been deployed, and thus it would be ideal if all deployed
    contracts are analyzed to determine potential vulnerabilities.


    Finally, the current construction does not support inter-contract analysis where
    multiple contracts are interconnected. For instance, Rodler et al. [37] presented
    a new kind of vulnerability by utilizing CALL and CREATE instructions, which requires
    inter-contract analysis [8, 49]. Thus, the attacks by Rodler et al. are out of
    the scope of Eth2Vec currently. Our future work will aim to extend the current
    construction of Eth2Vec and overcome the limitations described above.


    # ### 6.1  Further Extensions


    Possible extensions of Eth2Vec are described below.


    First, important features for detecting vulnerabilities can be clarified by introducing
    the interpretability of neural networks. Although the current specification of
    Eth2Vec does not provide insight into the important features, the importance for
    each feature can be evaluated on Eth2Vec by utilizing a universal method, e.g.,
    permutation importance [5].


    Second, the output of Eth2Vec with respect to vulnerabilities can be extended
    from the current function-level to the instruction-level. Asm2Vec [11], which
    is an application of Kam1n0, outputs vulnerabilities for the instruction-level
    by utilizing AbstractCloneSearch Handler of Kam1n0. Eth2Vec will be able to output
    vulnerabilities for the instruction-level by incorporating the module.


    # ### 6.2  Limitations


    Several limitations of Eth2Vec, which will be improved in future works, are described
    below. First, the current construction is in the unsupervised setting, and the
    supervised setting is not implemented. According to Hill et al. [20], the supervised
    setting seems to be more suitable for the classification of natural language processing
    than the unsupervised setting. Intuitively, evaluating a kind of vulnerability
    contained in codes is a classification problem about vulnerabilities. Therefore,
    the performance of Eth2Vec can be improved by utilizing the supervised setting.


    # ## 7  RELATED WORKS


    In this section, we describe related works in terms of security analysis by machine
    learning.


    # ### 7.1  Security Analysis of Ethereum by Machine Learning


    As machine learning-based analysis, ContractWard [48] and the tool by Momeni et
    al. [31] are based on support vector machine (SVM) and random forest, whose features
    are extracted manually by an analyst. Hence, identifiable vulnerabilities are
    limited due to insufficient feature extraction as described in Section 3. As research
    on automated feature extraction, VulDeeSmartContract [36] has been proposed by
    combining Word2Vec with long-short term memory (LSTM), but it specializes only
    in reentrancy vulnerability. Eth2Vec can be considered as a tool dealing with
    more versatile vulnerabilities in a similar approach.


    Next, EClone [25] is a tool that detects code clones of Ethereum smart contracts
    through the computation of code similarity. Although EClone does not utilize neural
    networks, a symbolic analysis tool suitable for vector computations of codes has
    also been proposed. The detectability of Eth2Vec can be improved potentially by
    combining it with EClone.'
