    # 1 INTRODUCTION


    # 1.1 Backgrounds


    Ethereum [50] is the largest platform that provides an execution environment for
    smart contracts, and many distributed applications have been developed and deployed
    as smart contracts on the Ethereum blockchain. Ethereum smart contracts are programs
    that are stored on the Ethereum blockchain and are run by the Ethereum Virtual
    Machine (EVM) as EVM bytecodes¹.


    Given the transparent and decentralized nature of the Ethereum blockchain, the
    EVM bytecodes of smart contracts deployed on the Ethereum blockchain can be accessed
    and analyzed by anyone. Unfortunately, this also means that an adversary can abuse
    smart contracts [52] by analyzing their EVM bytecodes and looking for vulnerabilities.
    Consequently, attacks on vulnerable smart contracts can occur and possibly cause
    significant damages, especially when the attacked smart contracts handle assets.
    For example, the DAO attack is an infamous springboard attack where the attacker/s
    exploited a vulnerability in the DAO smart contract and stole more than 60 million
    USD worth of Ether, the cryptocurrency used in Ethereum.


    According to literature [52], the security of smart contracts cannot be guaranteed
    because of the complexity (or lack of complexity) of the programming languages
    used for creating smart contracts, e.g., Solidity, which is a relatively new language,
    and the insufficient knowledge of programmers when creating smart contracts. To
    make matters worse, smart contracts that are successfully deployed on a blockchain
    cannot be modified, i.e., their source codes cannot be edited or deleted. In the
    past years, many attacks on deployed smart contracts have been reported [2], and
    thus making sure that the source code of smart contracts is not vulnerable before
    they are deployed on a blockchain is desirable. To do this, many analysis tools
    for vulnerability detection in Ethereum smart contracts have been developed [9].


    In this paper, we aim to develop a static analysis tool that can precisely detect
    various vulnerabilities in smart contract codes with high throughput by analyzing
    these codes. In static analysis, only the source code of a target to be analyzed
    is provided as input to identify if the code has vulnerabilities without executing
    the target


    ¹Hereafter, “Ethereum smart contract/s” and “smart contract/s” are used interchangeably
    but have the same meaning.'
