    by the $k$-negative sampling [22, 30] as follows:


    $$\sum_{C_i\in Dict}\sum_{f_s}\sum_{seq_i}\sum_{in_j}\sum_{t_c}J(\theta) = \sum_{C_i\in
    Dict}\sum_{f_s}\sum_{seq_i}\sum_{in_j}\sum_{t_c}\log P(t_c\mid\delta(in_j,f_s)).
    \tag{5}$$


    $$J(\theta)\approx\log(\sigma(X))+\sum_{i=1}^{k}\mathbb{E}_{t_d\sim P_n(t_c)}\left([\![t_d\ne
    t_c]\!]\log\sigma(X)\right). \tag{6}$$


    where $[\![t_d\ne t_c]\!]$ is an identity function which returns 1 if the expression
    inside the function is true or 0 otherwise. On the other hand, $\mathbb{E}_{t_d\sim
    P_n(t_c)}$ is a sampling function that samples a token $t_d$ in accordance with
    the noise distribution $P_n(t_c)$ from $t_c$. We finally utilize Equation (6)
    as the objective function of Eth2Vec. Intuitively, the function maximizes the
    probability of a token $t_c$ of the current instruction and decreases that of
    a token $t_d$ of the other instructions. Then, we can compute the gradient with
    respect to $\theta_{f_s}$ through the following derivative:


    $$\frac{\partial J(\theta)}{\partial\theta_{f_s}}=\frac{\partial J(\theta)}{\partial
    X}\frac{\partial X}{\partial\theta_{f_s}}=\frac{\vec{v}_{t_c}}{3}(1-\sigma(X))
    + \frac{\vec{v}_{t_c}}{3}\sum_{i=1}^{k}\mathbb{E}_{t_d\sim P_n(t_c)}\left([\![t_d\ne
    t_c]\!](1-\sigma(X))\right).$$


    Moreover, we can also utilize a more intuitive gradient by approximating the aforementioned
    gradient computation as follows:


    $$\frac{\partial J(\theta)}{\partial\theta_{f_s}}\approx\frac{\vec{v}_{t_c}}{3}\sum_i^k\mathbb{E}_{t\sim
    P_n(t_c)}\left([\![t=t_c]\!]-\sigma(X)\right). \tag{7}$$


    Intuitively, Equation (7) approximates the original derivative described above
    in a manner that it moves a gradient to the positive if a token is identical to
    the current instruction or to the negative otherwise. Likewise, the gradient with
    respect to the vector representation $\vec{v}_{t_c}$ of a token on the current
    instruction can be approximated. Moreover, for the vector representation $\vec{v}_{\mathcal{P}(in)}$
    of a token of some operation $\mathcal{P}(in)$ and that $\vec{v}_{\mathcal{A}(in)}$
    of operands on the current instruction, their gradients can be approximated in
    a similar manner. These gradients are computed as follows although we omit their
    derivation:


    $$\frac{\partial J(\theta)}{\partial\vec{v}_{t_c}}\approx([\![t=t_c]\!]-\sigma(X))\cdot\delta(in_j,f_s).
    \tag{8}$$


    $$\frac{\partial J(\theta)}{\partial\vec{v}_{\mathcal{P}(in_j)}}\approx([\![t=t_c]\!]-\sigma(X))\cdot\frac{1}{|\mathcal{A}(in)|}\sum_{t\in\mathcal{A}(in)}\vec{v}_t.
    \tag{9}$$


    $$\frac{\partial J(\theta)}{\partial\vec{v}_{\mathcal{A}(in_{j+1})}}\approx([\![t=t_c]\!]-\sigma(X))\cdot\left(\vec{v}_{\mathcal{P}(in_{j+1})}\right).
    \tag{10}$$


    Similar equations hold for the previous instruction $in_{j-1}$ by replacing $in_{j+1}$
    with $in_{j-1}$ although we omit the details due to space limitation.


    # 4.5 Training and Inference


    We now present the training algorithm and the inference algorithm with the gradients
    described in the previous subsection. First, the training algorithm is shown in
    Algorithm 1. The goal of the training is to optimize vectors for each instruction
    belonging to the given contract file as input. Instructions with similar meaning
    are mapped to a similar position in the vector space through the training. These
    resulting vectors by the algorithm can be used as features for vector representation
    of contract-level analysis. The algorithm is an unsupervised training algorithm,
    and thus the procedure does not require a ground-truth mapping between equivalent
    contracts.


    The aforementioned features can be utilized directly in the inference algorithm
    shown in Algorithm 2. In particular, for an unseen contract $C_t\notin Dict$,
    the algorithm first initializes $\vec{\theta}_{f_t}$, which is associated with
    any function $f_t$ belonging to $C_t$. Then, the algorithm follows the same procedure
    as the training algorithm. However, all $\vec{v}_t$''s in the trained model are
    kept, and $\vec{\theta}_{f_t}$''s are updated following their errors. At the end
    of the inference, $\vec{\theta}_{f_t}$ is output whereas the vectors for all $C_i\in
    Dict$ remain the same except for $\vec{\theta}_{f_t}$. Finally, to search contracts
    for a match with the given contract $C_t$, the resultant vectors are compared
    with those of the training contracts using a typical statistical method, e.g.,
    the cosine similarity.'
