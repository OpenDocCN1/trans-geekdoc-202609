    peers to execute contract functions, Ethereum relies on gas, which is paid in
    Ether, to “fuel computations”. The amount of gas needed to execute a transaction
    is relative to the complexity of the computations, thus also preventing infinite
    loops.


    Smart contracts are typically written in a high-level language, such as Solidity
    [1]. The source code is then compiled to low-level bytecode that runs in the EVM.
    The EVM is a simple stack-based architecture. Its instruction set is kept minimal
    to avoid incorrect implementations that could cause consensus problems. The EVM
    is a global singleton, i.e., it operates like a global, single-instance computer
    that runs in all peers in the network. Each peer runs a local copy of the EVM
    to validate the execution of contract functions, and the processed transactions
    and smart contracts are recorded on the blockchain.


    # 2.2 Machine Learning


    Machine learning consists of two algorithms, i.e., training and inference. The
    training algorithm takes data as input to learn their features and optimize parameters
    inside the model for an objective function. On the other hand, the inference algorithm
    takes unlearned data as input and infers a similar set of features to that of
    the training data. When each data is unlabeled, a learning algorithm is called
    unsupervised learning. The most popular approach to machine learning in the recent
    years is deep learning, which is based on neural networks and can extract features
    in a black-box manner. In this paper, we aim to develop a model for learning vulnerable
    smart contracts to detect vulnerabilities in unlearned smart contracts.


    A neural network model is a machine learning model representing connections between
    neurons, which is a brain mechanism on a human, on a computer. The model approximately
    expresses complicated non-linear functions on a computer. Two kinds of tasks,
    or a regression task and a classification task, are treated on a neural network
    as well-known settings. The regression problem infers continuous numbers from
    input data, and the classification problem infers a class that an input data belongs
    to. The feature extraction of Eth2Vec with a neural network for natural language
    processing is classified as a regression problem. Each input signal of a neural
    network has a unique weight, and the weight is an element to propagate the importance
    of the input signal to the output layer. Namely, the impact of input on the output
    of the neural network becomes large in proportion to the weight of the input.
    An activation function decides how to activate a sum of input signals of the neural
    network.


    Support Vector Machine (SVM) is a linear binary classifier to classify the input
    into two classes, and provides significantly high performance for the classification.
    Furthermore, SVM provides non-linear classification by combining with the kernel
    method.


    # 2.3 Natural Language Processing


    Natural language processing deals with languages that humans use to communicate
    with each other, and the languages are expressed as texts. Typical applications
    of natural language processing are, for instance, document classification, machine
    translation, document summarization, response to questions, and interactive conversation.


    In general, “word” is a minimum unit (token) to process a language, and “sentence”
    is processed together as one unit string. Word is also the smallest unit as components
    in a sentence from the perspective of grammar or semantics, and each sentence
    has a cohesive context. A unit string that is shorter than sentence and consists
    of more than two words is called “phrase”, and natural languages sometimes are
    processed in a unit of phrase. However, splitting a text into word, phrase, and
    sentence units is not simple and the definition of each unit is non-trivial.


    One of the important differences between a text written in a natural language
    and code written in a programming language is that only the code has syntax and
    structures. Natural language processing needs to consider the syntax and structure
    of code for processing the code.


    # 3 ANALYSIS OF SMART CONTRACTS VIA MACHINE LEARNING


    This section describes the analysis target as the problem setting and its technical
    difficulty to be tackled in this paper.


    # 3.1 Analysis Target


    In this paper, we focus on security analysis of the Solidity language as a target
    of static analysis of Ethereum smart contracts. In particular, we aim to detect
    the existence of vulnerabilities and classify the kinds of vulnerabilities in
    the codes to be analyzed. Assume for example that a developer uses a tool that
    analyzes the smart contracts he/she is developing in local.


    Such tool potentially needs to convince the developer that the smart contract
    being developed does not have any vulnerability even if the developer does not
    have sufficient knowledge about smart contract vulnerabilities. Therefore, we
    aim to develop a tool that can detect the existence of vulnerabilities (if there
    are any) in smart contracts even if only the codes of the smart contracts are
    given as input. Such a specification for analyzing smart contracts is preferable
    because standardized knowledge about Ethereum smart contracts is insufficient
    compared to general programming languages such as C and Java [52]. Meanwhile,
    strong obfuscation, i.e., the use of encryption, on Solidity codes is out of the
    scope of this paper because such an obfuscated code of smart contracts does not
    exist as far as we know.


    Hereafter, we refer to codes written in Solidity as a contract and a file of codes
    consisting of more than a single contract as a contract file. We also call contracts
    to evaluate a vulnerability as test contracts and those to learn the vulnerability
    as training contracts. We call codes obtained from the compilation of the contracts
    as EVM bytecodes. The largest unit in each contract is a function, and a library
    function is also identical to a function. Finally, “the blockchain” will be used
    to refer to the Ethereum blockchain unless otherwise specified. The problem setting
