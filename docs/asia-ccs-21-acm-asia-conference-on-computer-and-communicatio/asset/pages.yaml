    codes from being deployed.


    However, static analysis has two problems in general: (1) accuracy of its vulnerability
    detection is limited, and (2) its analysis time can be long. For instance, disassembly
    from EVM bytecodes [6, 35, 43, 51] does not have the capability to identify whether
    a program is vulnerable or not, and the early literature focuses on simply improving
    the readability of disassembled codes. In other words, disassembled codes often
    need to be analyzed manually, consequently increasing the number of false positives
    and false negatives. Moreover, symbolic execution [8, 27, 46, 49], which extracts
    control flow graphs (CFGs) from a target code, achieves high accuracy by automating
    the analysis, but the generation of CFGs needs to search all states such that
    the target code transits. Therefore, the analysis takes significant amounts of
    time [48].


    A potential solution to the problems described above is machine learning. Static
    analysis based on machine learning infers whether a given code is vulnerable by
    learning features of codes. In doing so, the analysis also achieves a versatile
    analysis within a short time. However, static analysis based on machine learning
    has two inherent limitations: (1) code rewrites decrease analysis accuracy, and
    (2) appropriate features of smart contracts are indefinite. In the first limitation,
    for instance, CFGs with inlined functions are different from those of the original
    functions. Therefore, identifying the original function with the inlined function
    as the same codes is challenging. A pair of functions with the same semantics
    but different structures may generate different analysis results because the differences
    between structures of the codes strongly affect the analysis. In the second limitation,
    although features are manually extracted for machine learning, code samples and
    open knowledge about smart contracts are insufficient. Common knowledge about
    smart contract features has never been established [52]. Notably, kinds of features
    representing vulnerabilities in codes of smart contracts are unknown. Besides,
    features that are robust against differences in code structures are still not
    obvious. Neural Network is a common approach to extract features implicitly. However,
    the existing approach based on neural network [15, 31] have not solved the above
    limitations, and are insufficiently robust against code rewrites.


    # 1.2  Contributions


    In this paper, we propose *Eth2Vec*, a static analysis tool based on machine learning
    that identifies smart contract vulnerabilities by learning smart contract code
    via their EVM bytecode, assembly code, and abstract syntax trees. Eth2Vec has
    high throughput, high accuracy, and robustness against code rewrites. Eth2Vec
    is an analysis tool based on a neural network for natural language processing,
    and it outputs the existence and kind of vulnerabilities in a target smart contract
    code by only taking the code as input. Using Eth2Vec, a user can analyze code
    of smart contracts quickly even without expert knowledge on smart contract vulnerabilities.


    In terms of analysis of Ethereum smart contracts by using machine learning, a
    major contribution of this paper is the provision of a method that is robust against
    code rewrites. Loosely speaking, Eth2Vec overcomes the limitations described in
    Section 1.1 by leveraging a neural network for natural language processing. Namely,


    Eth2Vec can extract features more precisely than a trivial use of a neural network
    by virtue of the natural language processing that learns the context of each function.
    Although there are several existing tools [15, 36] based on a typical language
    model for the analysis of Ethereum smart contracts, i.e., Word2Vec [29], Eth2Vec
    is novel since it achieves robust analysis against code rewrites. To do this,
    we also developed a module that gives the EVM bytecode and their syntactic information
    to the neural network as inputs. By virtue of the developed module, Eth2Vec can
    extract and learn features of code more informatively than the Word2Vec-based
    tools. Furthermore, we designed a learning methodology based on a neural network
    for natural language processing which takes the EVM bytecode through the compilation
    of Solidity code as inputs. (See Section 4 for detail.)


    We conducted experiments to evaluate the performance of Eth2Vec. The experimental
    results show that Eth2Vec can detect vulnerabilities within 1.2 seconds per contract
    with an average precision of 77.0%. Notably, reentrancy, whose severity is the
    highest among known vulnerabilities [45], can be detected with 86.6% precision.
    Eth2Vec outperforms a typical method [31] in terms of well-known metrics on vulnerability
    detection. Moreover, Eth2Vec can detect vulnerabilities of rewritten code, which
    were not found by the existing Word2Vec-based tool named SmartEmbed [15]. (See
    Section 5 for detail.) We release the source code of Eth2Vec via GitHub for reproducibility
    and as reference for future works (https://github.com/fseclab-osaka/eth2vec).


    # 2  PRELIMINARIES


    In this section, we describe background knowledge to help readers understand our
    work.


    # 2.1  Ethereum Smart Contracts


    In Ethereum, there are two kinds of accounts, namely, an externally owned account
    (EOA) and a contract account. EOAs have a private key that can be used to access
    the corresponding Ether or contracts. A contract account has smart contract code,
    which an EOA cannot have, and it does not have a private key. Instead, it is owned
    and controlled by the logic of its smart contract code. In Ethereum, a smart contract
    refers to an *immutable* computer program that is deployed on the blockchain and
    runs *deterministically* in the context of the EVM. The immutability property
    indicates that, similar to any data published on a general blockchain, smart contract
    codes can be considered as trustworthy, i.e., once deployed, they cannot be changed
    or deleted. The deterministic property indicates that the execution of the code
    functions of smart contracts will produce the same result for anyone who runs
    them. Once deployed on the blockchain, a contract is self-enforcing and managed
    by the peers in the network, i.e., its functions are executed when the conditions
    in the contract are met. A smart contract is given an identity in terms of a contract
    address. Using this address, it can receive Ether and its functions can be executed.
    A contract is invoked when its contract address is the destination of a transaction,
    which is a signed message originating from an EOA, transmitted by the network,
    and recorded on the blockchain. Such transaction causes a contract to run in the
    EVM using the transaction (and transaction’s data) as input. The data indicate
    which specific function in the'
