  - '[PAGE 10]


    In the neural network-based approach, there is ILF [18] which automatically generates
    an input of fuzzing test via neural networks. Loosely speaking, ILF learns codes
    by extracting features via symbolic execution. Since ILF learns outputs by symbolic
    execution, it is an entirely different tool from Eth2Vec, which learns codes themselves.


    Finally, SmartEmbed [15] is a tool that identifies bugs of smart contract codes
    by leveraging FastText, which represents the codes as vectors. SmartEmbed is the
    closest work to Eth2Vec. However, SmartEmbed did not discuss an objective function
    and training algorithm explicitly and just vectorizes codes in accordance with
    Word2Vec and FastText. Consequently, there are several code samples which are
    unidentified as clones, as shown in the paper [15]⁶. In contrast, Eth2Vec can
    precisely extract features of codes with a vast vocabulary and thus can detect
    vulnerabilities even after codes are rewritten. Nevertheless, SmartEmbed is an
    elegant work that also discussed code repairing as well as versatile bugs. Interested
    readers are advised to read the SmartEmbed paper.


    # 7.2 Other Analysis Tools for Ethereum


    To the best of our knowledge, symbolic execution [27] is the principal approach
    for analysis of Ethereum smart contracts. Since symbolic execution deals with
    unknown variables as symbolic variables, it is potentially suitable for analysis
    of smart contracts, which utilizes information outside codes [8], i.e., blockchain.
    Hence, many tools have been proposed so far [7, 13, 24, 32–34, 46]. The primary
    motivation of recent works aims to extend analysis areas, e.g., inter-contract
    analysis and contract creation. Although symbolic execution consumes a longer
    time in comparison with a machine learning-based approach as described in Section
    1.1, the vulnerability detection of Eth2Vec may be improved by combining it with
    such tools.


    Another approach for smart contract analysis is formal verification [4] which
    deduces whether a program satisfies a specification via predicate logic. In general,
    formal verification can provide precise analysis by representing the security
    in a mathematical way. However, the verification itself is a rigid and challenging
    work. Many works just formalized a specification of Ethereum and did not achieve
    the analysis of vulnerabilities [16, 17, 17, 19, 21, 47]. As the latest work,
    Grishchenko et al. presented a formal verification tool named eThor [39] that
    can analyze vulnerabilities in a versatile way.


    Finally, there are several tools on dynamic analysis which execute codes themselves
    [14, 37]. However, using dynamic analysis, an analyst needs to implement and execute
    attack patterns by himself/herself to prevent vulnerabilities in advance. Although
    a universal attack pattern that can capture various attacks was proposed [14],
    an analyst still needs to have knowledge about attacks on smart contracts. Therefore,
    analysts with the ability of utilizing a dynamic analysis are limited, and thus
    static analysis is more reasonable.


    ⁶ Although the authors of [15] describe that the samples are not clones, these
    sample are type-IV clones following the definition in [38].


    # 7.3 Security Applications of Natural Language Processing


    We briefly describe natural language processing applications to the binary analysis
    and cybersecurity defense as further related works. After Shin et al. [41] proposed
    binary analysis based on neural networks, many works for binary analysis based
    on natural language processing, such as Word2Vec, have been proposed in recent
    years [11, 12, 28, 53]. These works are based on neural networks. The closest
    work to Eth2Vec is Asm2Vec [11], which focuses on assembly language. Eth2Vec can
    be seen as an extension of the implementation of Asm2Vec. The source code of Asm2Vec
    is publicly available and readers are advised to read that paper in conjunction
    with our work. We also note that the same construction can be implemented with
    other tools described above.


    Likewise, natural language processing is another attractive area in cybersecurity.
    Walk2Friends, which performs a social relation inference attack [3], and DarkEmbed
    [44], which learns low dimensional distributed representations of darkweb/deepweb
    discussions, are examples of natural language processing. Other examples are Log2Vec
    [23] and Attack2Vec [40], which learn more generalized cybersecurity information.
    These tools apply natural language processing to cybersecurity areas, while Eth2Vec
    is an application to Ethereum smart contracts.


    # 8 CONCLUSION


    In this paper, we proposed Eth2Vec, a static analysis tool based on machine learning
    that detects vulnerabilities in Ethereum smart contracts. The most striking property
    of Eth2Vec is the automated feature extraction for each contract by leveraging
    neural networks for natural language processing. Consequently, by extracting features
    implicitly and incorporating lexical semantics between contracts, the vulnerabilities
    can be detected with 77.0% precision even after the codes are rewritten. Moreover,
    reentrancy, which is one of the most important vulnerabilities, can be detected
    with 86.6% precision. We also demonstrated that Eth2Vec outperforms the SVM-based
    method by Momeni et al. [31] in terms of precision, recall, and F1-score. We are
    releasing the implementation of Eth2Vec via GitHub as well (https://github.com/fseclab-osaka/eth2vec).


