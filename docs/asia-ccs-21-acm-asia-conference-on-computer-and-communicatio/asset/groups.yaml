    is given contracts and their instructions, and then it maximizes the log probability
    for the current token $t_c$. Intuitively, the lexical meaning for each contract
    is computed through the current instruction and its neighbor instructions. Moreover,
    codes consisting of multiple contracts can also be analyzed by extracting features
    for each contract.


    We describe the objective function to represent the aforementioned intuition in
    detail below. Given a contract file $Dict$, a function $f_s$ for each contract
    $C_i$ is vectorized and then we denote by $\vec{\theta}_{f_s}$ the vector representation
    of $f_s$. Furthermore, we denote by $\mathcal{CT}(in)$ the average of the vector
    representation of neighbor instructions of $in$. We then define a concatenation
    of the vector representation of the instruction itself and that of its operands
    as follows:


    $$\mathcal{CT}(in)=\vec{v}_{\mathcal{P}(in)}\Vert\frac{1}{|\mathcal{A}(in)|}\sum_{t\in\mathcal{A}(in)}\vec{v}_t.$$
    \tag{3}


    where $\mathcal{P}(in)$ is one operation with respect to $in$, $\mathcal{A}(in)$
    is a list of operands with respect to $in$, and $\Vert$ is a concatenation of
    strings. In doing so, for any contract $C_i$, by averaging $f_s$ and the $j$-th
    instruction in $in_j$ (with $j\in\{1,\ldots,n\}$), a function $\delta(in_j,f_s)$
    to evaluate the joint memory of neighbor instructions in $f_s$ is defined as follows:


    $$\delta(in_j,f_s)=\frac{1}{3}\left(\vec{\theta}_{f_s}+\mathcal{CT}(in_{j-1})+\mathcal{CT}(in_{j+1})\right).
    \tag{4}$$


    Therefore, the log probability in Equation (2) can be replaced with $P(t_c\mid
    C_i,in_{j-1},in_{j+1})=P(t_c\mid\delta(in_j,f_s))$. According to the literature
    [11], by letting $X=(\vec{v}_{t_c})^T\times\delta(in_j,f_s)$ and utilizing a sigmoid
    function $\sigma(X)=\frac{1}{1+e^{-X}}$, the above computation can be approximated
    by the $k$-negative sampling [22, 30] as follows:


    $$\sum_{C_i\in Dict}\sum_{f_s}\sum_{seq_i}\sum_{in_j}\sum_{t_c}J(\theta) = \sum_{C_i\in
    Dict}\sum_{f_s}\sum_{seq_i}\sum_{in_j}\sum_{t_c}\log P(t_c\mid\delta(in_j,f_s)).
    \tag{5}$$


    $$J(\theta)\approx\log(\sigma(X))+\sum_{i=1}^{k}\mathbb{E}_{t_d\sim P_n(t_c)}\left([\![t_d\ne
    t_c]\!]\log\sigma(X)\right). \tag{6}$$


    where $[\![t_d\ne t_c]\!]$ is an identity function which returns 1 if the expression
    inside the function is true or 0 otherwise. On the other hand, $\mathbb{E}_{t_d\sim
    P_n(t_c)}$ is a sampling function that samples a token $t_d$ in accordance with
    the noise distribution $P_n(t_c)$ from $t_c$. We finally utilize Equation (6)
    as the objective function of Eth2Vec. Intuitively, the function maximizes the
    probability of a token $t_c$ of the current instruction and decreases that of
    a token $t_d$ of the other instructions. Then, we can compute the gradient with
    respect to $\theta_{f_s}$ through the following derivative:


    $$\frac{\partial J(\theta)}{\partial\theta_{f_s}}=\frac{\partial J(\theta)}{\partial
    X}\frac{\partial X}{\partial\theta_{f_s}}=\frac{\vec{v}_{t_c}}{3}(1-\sigma(X))
    + \frac{\vec{v}_{t_c}}{3}\sum_{i=1}^{k}\mathbb{E}_{t_d\sim P_n(t_c)}\left([\![t_d\ne
    t_c]\!](1-\sigma(X))\right).$$


