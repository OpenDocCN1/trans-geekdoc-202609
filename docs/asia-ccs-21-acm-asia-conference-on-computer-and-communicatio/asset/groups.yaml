    frac{\\partial J(\\theta)}{\\partial X}\\frac{\\partial X}{\\partial\\theta_{f_s}}=\\\
    frac{\\vec{v}_{t_c}}{3}(1-\\sigma(X)) + \\frac{\\vec{v}_{t_c}}{3}\\sum_{i=1}^{k}\\\
    mathbb{E}_{t_d\\sim P_n(t_c)}\\left([\\![t_d\\ne t_c]\\!](1-\\sigma(X))\\right).$$\n\
    \nMoreover, we can also utilize a more intuitive gradient by approximating the\
