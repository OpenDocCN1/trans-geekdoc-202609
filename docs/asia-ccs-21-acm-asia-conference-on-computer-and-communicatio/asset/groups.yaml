    vec{v}_t. \\tag{9}$$\n\n$$\\frac{\\partial J(\\theta)}{\\partial\\vec{v}_{\\mathcal{A}(in_{j+1})}}\\\
    approx([\\![t=t_c]\\!]-\\sigma(X))\\cdot\\left(\\vec{v}_{\\mathcal{P}(in_{j+1})}\\\
    right). \\tag{10}$$\n\nSimilar equations hold for the previous instruction in_{j-1}\
    \ by replacing in_{j+1} with in_{j-1} although we omit the details due to space\
    \ limitation.\n\n## 4.5 Training and Inference\n\nWe now present the training\
