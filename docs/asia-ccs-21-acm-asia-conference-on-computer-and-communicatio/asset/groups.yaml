  mdcn: "\n![](img/0d980298d6e695afbf52eecaa73818c4_4_0.png)\n\n**图 1：Eth2Vec 概述**\n\
    \nPV-DM 模型最初是为顺序排列的文本数据设计的，同时通过扩展语言的向量表示也可以用于汇编代码的分析 [11]。\n\n本文提出了一种通过扩展 PV-DM\
    \ 模型以符合第 4.4 节所述的 EVM 字节码语法而实现的合约级表示学习模型。\n\n### 4.3.2 EVM Extractor.\n\nEVM Extractor\
    \ 是一个用于 PV-DM 模型的模块，用于对 EVM 字节码进行语法分析。特别是，EVM Extractor 按以下层次结构解析 Solidity 文件：\n\
    \n```\ndata: dictionary\n  name: file name\n  md5: md5 hash\n  functions: list\n\
    \    name: function name\n    sea: start point\n    see: end point\n    id: function\
    \ id\n    call: list of callee functions\n    blocks: list\n      name: block\
    \ name\n      bytes: bytecodes\n      sea: start point\n      eea: end point\n\
    \      id: block id\n      call: list of callee blocks\n      src: assembly instructions\n\
    ```\n\n顶层 data 表示待分析的合约文件。第二层表示文件相关信息。第三层表示函数相关信息。第四层表示由多个指令组成的块。在每个层级中，sea 表示当前函数和当前块的起始地址。同样，see\
    \ 和 eea 分别表示下一个函数和下一个块的起始地址。相比之下，call 表示从当前函数（或块）调用的被调用函数（或被调用块）。最后，在最底层，EVM 字节码的指令连同其地址一起存储在\
    \ src 中。同时，库函数被视为一个独立的函数。\n\n## 4.4 目标函数设计\n\nEth2Vec 是一种通过无监督学习学习和推断以太坊智能合约代码的模型。直观上，它可以被视为\
    \ Word2Vec 的扩展，具有更宽的代码向量表示，因为它能够针对以太坊智能合约。\n\nEth2Vec 的目标函数是通过扩展第 4.3.2 节所示语法中描述的原始\
    \ PV-DM 模型在公式 (1) 中的目标函数而设计的。以下论证受 Asm2Vec [11] 的启发，后者是针对汇编语言的 PV-DM 模型的扩展。给定待分析的以太坊智能合约文件，Eth2Vec\
    \ 对指令级代码进行向量化，然后计算与训练学习到的代码的相似度。上述过程针对与指令相关的块级、函数级和合约级递归执行，因此 Eth2Vec 可以检测出与训练数据分布相似的代码。形式上，目标函数定义如下：\n\
    \n$$\\sum_{C_i}^{Dict} \\sum_{f_s}^{U(C_i)} \\sum_{seq_i}^{S(f_s)} \\sum_{in_j}^{I(seq_i)}\
    \ \\sum_{t_c}^{T(in_j)} \\log P(t_c | C_i, in_{j-1}, in_{j+1}), \\tag{2}$$\n\n\
    其中我们用 Dict 表示合约文件，用 C_i 表示合约，用 f_s 表示函数，用 seq_i 表示由多个指令组成的块，用 in_j 表示每个指令，用 t_c\
    \ 表示与当前指令相关的标记。同样，我们用 U(C_i) 表示多个函数，用 S(f_s) 表示多个块，用 I(seq_i) 表示指令列表，用 T(in_j)\
    \ 表示标记列表。\n\n这里，第一求和项，即 ∑_{C_i}^{Dict}，包含在上一节所示的第二层中，即文件名。公式 (2) 给出合约及其指令，然后最大化当前标记\
    \ t_c 的对数概率。直观上，每个合约的词汇含义是通过当前指令及其邻近指令计算得出的。此外，由多个合约组成代码也可以通过为每个合约提取特征来分析。\n\n\
    我们将在下面详细描述目标函数以表示上述直觉。给定合约文件 Dict，每个合约 C_i 的函数 f_s 被向量化，然后我们用 \\vec{\\theta}_{f_s}\
    \ 表示 f_s 的向量表示。此外，我们用 \\mathcal{CT}(in) 表示 in 的邻近指令的向量表示的平均值。然后我们将指令本身的向量表示与其操作数的向量表示的拼接定义如下：\n\
    \n$$\\mathcal{CT}(in)=\\vec{v}_{\\mathcal{P}(in)}\\Vert\\frac{1}{|\\mathcal{A}(in)|}\\\
    sum_{t\\in\\mathcal{A}(in)}\\vec{v}_t. \\tag{3}$$\n\n其中 \\mathcal{P}(in) 是相对于\
    \ in 的一个操作，\\mathcal{A}(in) 是相对于 in 的操作数列表，而 \\Vert 是字符串的拼接。这样，对于任意合约 C_i，通过对\
    \ f_s 和第 j 条指令 in_j（其中 j\\in\\{1,\\ldots,n\\}）取平均，定义一个用于评估 f_s 中邻近指令的联合记忆的函数 \\\
    delta(in_j,f_s) 如下：\n\n$$\\delta(in_j,f_s)=\\frac{1}{3}\\left(\\vec{\\theta}_{f_s}+\\\
    mathcal{CT}(in_{j-1})+\\mathcal{CT}(in_{j+1})\\right). \\tag{4}$$\n\n因此，公式 (2)\
    \ 中的对数概率可以用 P(t_c\\mid C_i,in_{j-1},in_{j+1})=P(t_c\\mid\\delta(in_j,f_s)) 替换。根据文献\
    \ [11]，令 X=(\\vec{v}_{t_c})^T\\times\\delta(in_j,f_s) 并利用 sigmoid 函数 \\sigma(X)=\\\
    frac{1}{1+e^{-X}}，上述计算可以用 k-负采样 [22, 30] 近似如下：\n\n$$\\sum_{C_i\\in Dict}\\sum_{f_s}\\\
    sum_{seq_i}\\sum_{in_j}\\sum_{t_c}J(\\theta) = \\sum_{C_i\\in Dict}\\sum_{f_s}\\\
    sum_{seq_i}\\sum_{in_j}\\sum_{t_c}\\log P(t_c\\mid\\delta(in_j,f_s)). \\tag{5}$$\n\
    \n$$J(\\theta)\\approx\\log(\\sigma(X))+\\sum_{i=1}^{k}\\mathbb{E}_{t_d\\sim P_n(t_c)}\\\
    left([\\![t_d\\ne t_c]\\!]\\log\\sigma(X)\\right). \\tag{6}$$\n\n其中 [\\![t_d\\\
    ne t_c]\\!] 是一个恒等函数，如果函数内部的表达式为真则返回 1，否则返回 0。另一方面，\\mathbb{E}_{t_d\\sim P_n(t_c)}\
    \ 是一个采样函数，根据噪声分布 P_n(t_c) 从 t_c 采样标记 t_d。我们最终利用公式 (6) 作为 Eth2Vec 的目标函数。直观上，该函数最大化当前指令的标记\
    \ t_c 的概率并降低其他指令的标记 t_d 的概率。然后，我们可以通过以下导数计算相对于 \\theta_{f_s} 的梯度：\n\n$$\\frac{\\\
    partial J(\\theta)}{\\partial\\theta_{f_s}}=\\frac{\\partial J(\\theta)}{\\partial\
    \ X}\\frac{\\partial X}{\\partial\\theta_{f_s}}=\\frac{\\vec{v}_{t_c}}{3}(1-\\\
    sigma(X)) + \\frac{\\vec{v}_{t_c}}{3}\\sum_{i=1}^{k}\\mathbb{E}_{t_d\\sim P_n(t_c)}\\\
    left([\\![t_d\\ne t_c]\\!](1-\\sigma(X))\\right).$$\n\n此外，我们还可以通过以下方式近似上述梯度计算来利用更直观的梯度：\n\
    \n$$\\frac{\\partial J(\\theta)}{\\partial\\theta_{f_s}}\\approx\\frac{\\vec{v}_{t_c}}{3}\\\
    sum_i^k\\mathbb{E}_{t\\sim P_n(t_c)}\\left([\\![t=t_c]\\!]-\\sigma(X)\\right).\
    \ \\tag{7}$$\n\n直观上，公式 (7) 以一种方式近似上述原始导数：如果标记与当前指令相同则将梯度移动到正方向，否则移动到负方向。同样，相对于当前指令上标记的向量表示\
    \ \\vec{v}_{t_c} 的梯度也可以近似。此外，对于某个操作 \\mathcal{P}(in) 的标记的向量表示 \\vec{v}_{\\mathcal{P}(in)}\
    \ 以及当前指令上操作数的向量表示 \\vec{v}_{\\mathcal{A}(in)}，它们的梯度也可以以类似方式近似。尽管我们省略了推导，这些梯度计算如下：\n\
    \n$$\\frac{\\partial J(\\theta)}{\\partial\\vec{v}_{t_c}}\\approx([\\![t=t_c]\\\
    !]-\\sigma(X))\\cdot\\delta(in_j,f_s). \\tag{8}$$\n\n$$\\frac{\\partial J(\\theta)}{\\\
    partial\\vec{v}_{\\mathcal{P}(in_j)}}\\approx([\\![t=t_c]\\!]-\\sigma(X))\\cdot\\\
    frac{1}{|\\mathcal{A}(in)|}\\sum_{t\\in\\mathcal{A}(in)}\\vec{v}_t. \\tag{9}$$\n\
    \n$$\\frac{\\partial J(\\theta)}{\\partial\\vec{v}_{\\mathcal{A}(in_{j+1})}}\\\
    approx([\\![t=t_c]\\!]-\\sigma(X))\\cdot\\left(\\vec{v}_{\\mathcal{P}(in_{j+1})}\\\
    right). \\tag{10}$$\n\n尽管由于篇幅限制我们省略了细节，但对于前一个指令 in_{j-1}，用 in_{j-1} 替换 in_{j+1}\
    \ 后同样适用。\n\n## 4.5 训练与推理\n\n我们现在介绍训练算法和推理算法，其中使用上一小节描述的梯度。首先，训练算法如算法 1 所示。训练的目标是优化作为输入的给定合约文件中每个指令的向量。通过训练，含义相似的指令被映射到向量空间中的相似位置。该算法产生的这些向量可作为合约级分析的向量表示的特征。该算法是一种无监督训练算法，因此该过程不需要等价合约之间的真实映射。\n\
    \n上述特征可以直接用于算法 2 所示的推理算法。特别是，对于未见过的合约 C_t\\notin Dict，算法首先初始化与 C_t 所属的任意函数 f_t\
    \ 相关的 \\vec{\\theta}_{f_t}。然后，算法遵循与训练算法相同的过程。然而，训练模型中所有的 \\vec{v}_t 都被保留，并且 \\\
    vec{\\theta}_{f_t} 根据其误差进行更新。在推理结束时，输出 \\vec{\\theta}_{f_t}，而所有 C_i\\in Dict 的向量保持不变，除\
    \ \\vec{\\theta}_{f_t} 外。最后，为了搜索与给定合约 C_t 匹配的合约，结果向量使用典型的统计方法，例如余弦相似度，与训练合约的向量进行比较。\n\
    \n"
