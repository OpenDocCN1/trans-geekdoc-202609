    \ function (or a callee block) from the current function (or block). Finally,\
    \ at the bottom level, instructions of EVM bytecodes are stored in src together\
    \ with their addresses. Meanwhile, a library function is treated as an individual\
    \ function.\n\n## 4.4 Design of Objective Function\n\nEth2Vec is a model that\
    \ learns and infers codes of Ethereum smart contracts through unsupervised learning.\
    \ Intuitively, it can be regarded as an extension of Word2Vec with a wider vector\
    \ representation of codes given its ability to target Ethereum smart contracts.\n\
    \nThe objective function of Eth2Vec is designed by extending that of the original\
