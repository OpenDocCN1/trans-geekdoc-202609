    [15]⁶ 所示，有一些代码样本未被识别为克隆。相比之下，Eth2Vec 能够利用庞大的词汇量精确提取代码特征，因此即使在代码被重写后也能检测漏洞。尽管如此，SmartEmbed
    是一项优雅的工作，它还讨论了代码修复以及多种漏洞。感兴趣的读者建议阅读 SmartEmbed 论文。


    ## 7.2 以太坊的其他分析工具


    据我们所知，符号执行 [27] 是以太坊智能合约分析的主要方法。由于符号执行将未知变量视为符号变量，它可能适合分析那些利用代码外部信息 [8]（即区块链）的智能合约。因此，迄今已提出了许多工具
    [7, 13, 24, 32–34, 46]。近期工作的主要动机是扩展分析领域，例如合约间分析和合约创建。尽管与第 1.1 节中描述的基于机器学习的方法相比，符号执行消耗的时间更长，但将
    Eth2Vec 与此类工具结合可能会提高其漏洞检测能力。


    智能合约分析的另一种方法是形式化验证 [4]，它通过谓词逻辑推断程序是否满足规范。一般来说，形式化验证可以通过以数学方式表示安全性来提供精确的分析。然而，验证本身是一项严格且具有挑战性的工作。许多工作仅形式化了以太坊的规范，并未实现漏洞分析
    [16, 17, 17, 19, 21, 47]。作为最新的工作，Grishchenko 等人提出了一个名为 eThor [39] 的形式化验证工具，可以以多种方式分析漏洞。


    最后，还有一些动态分析工具会执行代码本身 [14, 37]。然而，使用动态分析时，分析师需要自己实现并执行攻击模式以提前防范漏洞。尽管有人提出了可以捕获各种攻击的通用攻击模式
    [14]，但分析师仍然需要具备有关智能合约攻击的知识。因此，能够使用动态分析的分析师有限，所以静态分析更为合理。


    ⁶ 尽管 [15] 的作者描述这些样本不是克隆，但根据 [38] 中的定义，这些样本属于 IV 型克隆。


    ## 7.3 自然语言处理的安全应用


    我们简要介绍自然语言处理在二进制分析和网络安全防御中的应用，作为进一步的相关工作。在 Shin 等人 [41] 提出基于神经网络的二进制分析之后，近年来出现了许多基于自然语言处理（如
    Word2Vec）的二进制分析工作 [11, 12, 28, 53]。这些工作基于神经网络。与 Eth2Vec 最接近的工作是专注于汇编语言的 Asm2Vec
    [11]。Eth2Vec 可以看作是 Asm2Vec 实现的扩展。Asm2Vec 的源代码是公开的，建议读者结合我们的工作阅读该论文。我们还注意到，上述其他工具也可以实现相同的构建。


    同样，自然语言处理是网络安全中另一个有吸引力的领域。Walk2Friends [3] 执行社会关系推断攻击，DarkEmbed [44] 学习暗网/深网讨论的低维分布式表示，这些都是自然语言处理的例子。其他例子还有
    Log2Vec [23] 和 Attack2Vec [40]，它们学习更通用的网络安全信息。这些工具将自然语言处理应用于网络安全领域，而 Eth2Vec 则是应用于以太坊智能合约。


    ## 8 结论


    在本文中，我们提出了 Eth2Vec，一种基于机器学习的静态分析工具，用于检测以太坊智能合约中的漏洞。Eth2Vec 最显著的特性是利用自然语言处理神经网络为每个合约自动提取特征。因此，通过隐式提取特征并融入合约之间的词汇语义，即使在代码被重写后，也能以
    77.0% 的精确率检测漏洞。此外，重入漏洞作为最重要的漏洞之一，可以以 86.6% 的精确率被检测到。我们还证明了 Eth2Vec 在精确率、召回率和 F1
    分数方面优于 Momeni 等人 [31] 的基于 SVM 的方法。我们还通过 GitHub 发布了 Eth2Vec 的实现 (https://github.com/fseclab-osaka/eth2vec)。


