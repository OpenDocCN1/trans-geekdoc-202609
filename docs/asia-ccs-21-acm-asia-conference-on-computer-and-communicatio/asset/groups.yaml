    \ token t_c. Intuitively, the lexical meaning for each contract is computed through\
    \ the current instruction and its neighbor instructions. Moreover, codes consisting\
    \ of multiple contracts can also be analyzed by extracting features for each contract.\n\
    \nWe describe the objective function to represent the aforementioned intuition\
    \ in detail below. Given a contract file Dict, a function f_s for each contract\
    \ C_i is vectorized and then we denote by \\vec{\\theta}_{f_s} the vector representation\
    \ of f_s. Furthermore, we denote by \\mathcal{CT}(in) the average of the vector\
    \ representation of neighbor instructions of in. We then define a concatenation\
    \ of the vector representation of the instruction itself and that of its operands\
    \ as follows:\n\n$$\\mathcal{CT}(in)=\\vec{v}_{\\mathcal{P}(in)}\\Vert\\frac{1}{|\\\
    mathcal{A}(in)|}\\sum_{t\\in\\mathcal{A}(in)}\\vec{v}_t. \\tag{3}$$\n\nwhere \\\
    mathcal{P}(in) is one operation with respect to in, \\mathcal{A}(in) is a list\
    \ of operands with respect to in, and \\Vert is a concatenation of strings. In\
    \ doing so, for any contract C_i, by averaging f_s and the j-th instruction in\
