    ## Eth2Vec：学习以太坊智能合约漏洞检测的合约级代码表示


    Nami Ashizawa

    Naoto Yanai

    Jason Paul Cruz*

    n-ashizawa@ist.osaka-u.ac.jp

    yanai@ist.osaka-u.ac.jp

    Osaka University

    Suita, Osaka, Japan


    Shingo Okamura

    okamura@info.nara-k.ac.jp

    National Institute of Technology, Nara College

    Yamatokoriyama-shi, Nara, Japan


    ## 摘要


    以太坊智能合约是运行在以太坊区块链上的程序，过去十年中发现了许多智能合约漏洞。已经创建了许多安全分析工具来检测此类漏洞，但在分析代码被重写时，其性能会急剧下降。在本文中，我们提出了
    Eth2Vec，这是一种基于机器学习的智能合约漏洞检测静态分析工具。它对代码重写也具有鲁棒性，即即使在重写后的代码中也能检测出漏洞。现有的基于机器学习的漏洞检测静态分析工具需要分析人员手动创建的特征作为输入。相比之下，Eth2Vec
    通过自然语言处理的神经网络，利用隐性知识自动学习易受攻击的以太坊虚拟机（EVM）字节码的特征。因此，Eth2Vec 可以通过比较目标 EVM 字节码与已学习的
    EVM 字节码之间的代码相似性来检测智能合约中的漏洞。我们使用现有的开放数据库（如 Etherscan）进行了实验，结果表明 Eth2Vec 在众所周知的指标（即精确率、召回率和
    F1 分数）方面优于基于支持向量机的近期模型。


    ## CCS 概念


    - 安全与隐私 → 软件安全工程；软件逆向工程；漏洞管理。


    ## 关键词


    以太坊，智能合约，神经网络，静态分析，代码相似性，漏洞检测


    ACM 参考格式：


    Nami Ashizawa, Naoto Yanai, Jason Paul Cruz 和 Shingo Okamura. 2021. Eth2Vec: Learning
    Contract-Wide Code Representations for Vulnerability Detection on Ethereum Smart
    Contracts. 收录于第 3 届 ACM 区块链与安全关键基础设施国际研讨会论文集（BSCI ’21），2021 年 6 月 7 日，虚拟活动，香港。ACM，纽约，NY，美国，13
    页。https://doi.org/10.1145/3457337.3457841


    ## 1 引言


    ### 1.1 背景


    Ethereum [50] 是提供智能合约执行环境的最大平台，许多分布式应用程序已作为智能合约开发并部署在以太坊区块链上。以太坊智能合约是存储在以太坊区块链上并由以太坊虚拟机（EVM）作为
    EVM 字节码¹ 运行的程序。


    ¹此后，“以太坊智能合约/智能合约”和“智能合约/智能合约”可互换使用，但含义相同。


    鉴于以太坊区块链的透明和去中心化特性，部署在以太坊区块链上的智能合约的 EVM 字节码可以被任何人访问和分析。不幸的是，这也意味着攻击者可以通过分析其 EVM
    字节码并寻找漏洞来滥用智能合约 [52]。因此，对易受攻击的智能合约的攻击可能会发生，并可能造成重大损害，尤其是在被攻击的智能合约处理资产时。例如，DAO
    攻击是一个臭名昭著的攻击事件，攻击者利用了 DAO 智能合约中的漏洞，窃取了价值超过 6000 万美元的以太币，即以太坊中使用的加密货币。


    根据文献 [52]，智能合约的安全性无法得到保证，这是由于用于创建智能合约的编程语言的复杂性（或缺乏复杂性），例如 Solidity，这是一种相对较新的语言，以及程序员在创建智能合约时知识不足。更糟糕的是，一旦成功部署到区块链上的智能合约就无法修改，即其源代码无法编辑或删除。在过去几年中，已报告了许多对已部署智能合约的攻击
    [2]，因此在智能合约部署到区块链之前确保其源代码没有漏洞是可取的。为此，已开发了许多用于以太坊智能合约漏洞检测的分析工具 [9]。


    在本文中，我们旨在开发一种静态分析工具，通过分析这些代码，以高吞吐量精确检测智能合约代码中的各种漏洞。在静态分析中，仅将待分析目标的源代码作为输入，以在不执行目标本身的情况下识别代码是否存在漏洞。因此，理想情况下，静态分析可用于防止易受攻击的代码被部署。


    然而，静态分析通常存在两个问题：（1）其漏洞检测的准确性有限，（2）其分析时间可能很长。例如，从 EVM 字节码 [6, 35, 43, 51] 反汇编没有识别程序是否易受攻击的能力，早期文献主要关注提高反汇编代码的可读性。换句话说，反汇编代码通常需要手动分析，从而增加了假阳性和假阴性的数量。此外，符号执行
    [8, 27, 46, 49] 从目标代码中提取控制流图（CFGs），通过自动化分析实现高准确性，但生成 CFGs 需要搜索目标代码转换的所有状态。因此，分析需要大量时间
    [48]。


    上述问题的潜在解决方案是机器学习。基于机器学习的静态分析通过学习代码的特征来推断给定代码是否易受攻击。在此过程中，分析还可以在短时间内实现多功能分析。然而，基于机器学习的静态分析存在两个固有局限性：（1）代码重写会降低分析准确性，（2）智能合约的适当特征不确定。在第一个局限性中，例如，内联函数的
