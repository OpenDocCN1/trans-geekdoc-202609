    \ f_s a function, by seq_i a block consisting of multiple instructions, by in_j\
    \ each instruction, and by t_c a token with respect to the current instruction.\
    \ Likewise, we denote by U(C_i) multiple functions, by S(f_s) multiple blocks,\
    \ by I(seq_i) a list of instructions, and by T(in_j) a list of tokens.\n\nHere,\
    \ the first summation term, i.e., ∑_{C_i}^{Dict}, is included in the second level\
    \ shown in the previous section, i.e., file name. Equation (2) is given contracts\
