    \ the joint memory of neighbor instructions in f_s is defined as follows:\n\n\
    $$\\delta(in_j,f_s)=\\frac{1}{3}\\left(\\vec{\\theta}_{f_s}+\\mathcal{CT}(in_{j-1})+\\\
    mathcal{CT}(in_{j+1})\\right). \\tag{4}$$\n\nTherefore, the log probability in\
