    支持向量机（SVM）是一种线性二分类器，用于将输入分类为两个类别，并为分类提供显著高的性能。此外，SVM 通过结合核方法提供非线性分类。


    ### 2.3 自然语言处理


    自然语言处理处理人类之间用于交流的语言，而这些语言以文本形式表达。自然语言处理的典型应用例如，文档分类、机器翻译、文档摘要、问题响应和交互式对话。


    一般来说，“词”是处理语言的最小单位（token），而“句子”作为一个单元字符串一起处理。词也是句子中组件的最小单位，从语法或语义的角度来看，每个句子都有一个连贯的上下文。短于句子且由两个以上单词组成的单元字符串称为“短语”，自然语言有时以短语为单位进行处理。然而，将文本拆分为词、短语和句子单元并不简单，每个单元的定义也并非微不足道。


    自然语言编写的文本与编程语言编写的代码之间的重要区别之一是只有代码具有语法和结构。自然语言处理在处理代码时需要考虑代码的语法和结构。


    ## 3 通过机器学习分析智能合约


    本节描述了分析目标作为本文需要解决的问题设置及其技术难点。


    ### 3.1 分析目标


    本文将 Solidity 语言的安全性分析作为以太坊智能合约静态分析的目标。特别是，我们旨在检测待分析代码中漏洞的存在并对漏洞类型进行分类。例如，假设开发人员使用一个工具来分析他/她本地开发的智能合约。


    这样的工具可能需要说服开发人员，即使开发人员对智能合约漏洞的知识不足，正在开发的智能合约也没有任何漏洞。因此，我们旨在开发一种工具，即使仅将智能合约的代码作为输入，也能检测智能合约中是否存在漏洞（如果有的话）。这种分析智能合约的规范是可取的，因为与
    C 和 Java 等通用编程语言相比，以太坊智能合约的标准知识不足 [52]。同时，Solidity 代码的强混淆，即使用加密，不在本论文的范围内，因为据我们所知，并不存在此类混淆的智能合约代码。


    此后，我们将用 Solidity 编写的代码称为合约，由一个以上合约组成的代码文件称为合约文件。我们还将用于评估漏洞的合约称为测试合约，用于学习漏洞的合约称为训练合约。我们将从合约编译得到的代码称为
    EVM 字节码。每个合约中最大的单元是函数，库函数也与函数相同。最后，除非另有说明，“区块链”将用于指以太坊区块链。本文中的问题设置随后形式化如下：


    **问题表述：** 我们按如下方式形式化我们对智能合约分析的方法。每个合约 $c_i \in \mathcal{C}$ 包含漏洞 $V_i = \{v_1^i,
    \dots, v_l^i\} \in \mathcal{V}^l$，其中 $\mathcal{C}$ 表示合约集合，$\mathcal{V}$ 表示彼此独立的漏洞集合，$l$
    表示任意数量。给定任意整数 $n \in \mathbb{N}$，合约与漏洞的组合 $CV = \{(c_1, V_1), \dots, (c_n, V_n)\}$
    和测试合约 $c_t \in \mathcal{C}$ 是模型 $M$ 的输入。设 $\{\epsilon_i^{c_t}\}_{i\in[1,d]} \subseteq
    \mathbb{R}^d$ 表示模型 $M$ 的输出，该模型有 $d = |\mathcal{V}|$ 个元素，其中 $|\mathcal{V}|$ 表示
    $\mathcal{V}$ 的大小，$\epsilon_i^{c_t}$ 表示 $\mathcal{V}$ 中漏洞的概率。我们的目标是开发一个优化 $M(\mathcal{CV},
    c_t) \rightarrow \{\epsilon_i^{c_t}\}$ 的工具。


    ### 3.2 技术难点


    尽管文献中已提出了几种基于机器学习的智能合约静态分析工具 [25, 26, 31, 42, 48]，但其漏洞检测的准确性即使在已知漏洞上也有限。换句话说，当代码从原始代码重写时，准确性显著下降。按照上述问题表述，作为我们动机的第
    1.1 节中描述的局限性形式化如下：即使 $c_t$ 具有漏洞 $V_i$ 且该漏洞包含在 $CV$ 中，对任意 $i \in [1,n]$，对于 $c_t
    \notin CV$，$\epsilon_i^{c_t} \ll \epsilon_i^{c_t''}$ 成立。我们称这种情况为非鲁棒。上述与漏洞检测准确性相关的局限性是由现有工具特征提取不足造成的。一般来说，机器学习模型需要特征作为输入，这些特征是手动提取的，然后显式学习这些特征。然而，表示待分析智能合约的特征并不明显，因为以太坊智能合约的历史比
    C 和 Java 等其他通用语言短 [52]。直观上，非鲁棒性的局限性表示为模型 $M$ 所需的内容未知。特征提取不足的另一个原因是智能合约代码样本缺乏 [52]。


    ## 4 ETH2VEC 设计


    在本节中，我们介绍 Eth2Vec。我们首先描述为克服上一节所述技术难点的设计概念，然后介绍工具概述及其构建模块。最后，我们介绍 Eth2Vec 模型及其目标函数。


    ### 4.1 设计概念


    我们旨在通过利用自然语言处理的神经网络来解决技术难点。对于机器学习的自然语言处理，每个词通常被向量化为一个 token，每个句子被向量化为一个序列。为了融合自然语言处理，我们利用
    *PV-DM* 模型 [22]，该模型通过考虑段落的上下文来向量化每个段落。更具体地说，我们扩展了 PV-DM 模型，其中每个合约的代码被向量化而不是自然语言。因此
    Eth2Vec 可以隐式提取特征。


    为了为扩展的 PV-DM 模型提供合约代码，我们还开发了一个名为 *EVM Extractor* 的新模块，以获取每个合约的语法和语义。例如，EVM Extractor
    获取主要代码信息，例如函数名和起始地址。Eth2Vec 然后限制提供给 PV-DM 模型的代码信息量，因为 Eth2Vec 的吞吐量可能会随着信息量的增加而下降。因此
    Eth2Vec 可以适当且高效地实现特征提取。之后，Eth2Vec 通过利用上述自然语言处理神经网络向量化的代码信息来计算代码相似度。当分析代码的安全性时，模型学习易受攻击的代码，然后可以通过待分析代码与已学习代码的相似性来检测漏洞。因此，即使漏洞的本质特征不明确，Eth2Vec
    也能分析代码中的漏洞。


    ### 4.2 工具概述


    Eth2Vec 由两个模块组成，即用于处理段落的神经网络的 PV-DM 模型 [22] 和从 Solidity 源代码创建 PV-DM 模型输入的 EVM
    Extractor。


    Eth2Vec 的概述如图 1 所示。首先，PV-DM 模型被用作处理字节码的神经网络。特别是，PV-DM 模型通过以从字节码生成的 JSON 文件作为输入执行无监督学习，然后为每个合约计算代码相似度。为此，我们开发了
    EVM Extractor 作为模块，从 EVM 字节码创建 PV-DM 模型的输入，因为 PV-DM 模型最初无法处理 EVM 字节码。更具体地说，EVM
    Extractor 在语法上分析 EVM 字节码，并为指令级、块级、函数级和合约级创建 JSON 文件。


    结果，Eth2Vec 以待分析的 EVM 字节码作为输入，然后从用户角度返回合约级的代码克隆列表及其漏洞。同时，训练数据的合约中的漏洞由现有工具 [27,
    45] 预先识别。然后测试数据的漏洞通过与易受攻击合约的代码相似度进行评估。Eth2Vec 输出待分析代码中函数级的漏洞。也就是说，易受攻击的函数可以由 Eth2Vec
    识别。


    ### 4.3 构建模块


    Eth2Vec 利用 PV-DM 模型 [22] 和 EVM Extractor 作为构建模块。


    #### 4.3.1 PV-DM 模型。


    PV-DM 模型将文本数据向量化为段落级，而 Word2Vec [29] 将文本数据向量化为句子级。直观上，它为每个词和每个段落输出向量表示。更具体地说，给定由多个句子组成的文本段落，PV-DM
    模型对每个句子应用滑动窗口。滑动窗口从句子的开头开始，每一步向前移动一个词。在此过程中，PV-DM 模型执行多类推理任务，将当前段映射为向量，并将上下文中的每个词映射为向量。更精确地说，模型对这些向量取平均，并通过
    softmax 函数从词汇表中推断目标词。PV-DM 模型的架构包含一个隐藏层：例如，模型获取给定输入的向量，然后计算向量的平均值并应用 sigmoid 函数。输出层基于
    softmax 函数计算分类结果。形式上，给定包含段落列表 $p \in T$ 的文本，每个段落 $p$ 包含句子列表 $s \in p$，每个句子是 $|s|$
    个词 $w_t \in s$ 的序列。然后，PV-DM 模型最大化对数概率如下：


    $$\sum_{p}^{T}\sum_{s}^{p}\sum_{t=k}^{|s|-k} \log P(w_t \mid p, w_{t-k}, \cdots,
    w_{t+k}). \tag{1}$$

