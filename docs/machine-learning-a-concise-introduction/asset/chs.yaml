  bold\">Q</mi><msup><mrow/><mi mathvariant=\"normal\">T</mi></msup><mi>z</mi><mo>=</mo><msub><mi>&#x03bb;</mi><mi>j</msub></msub><mrow><mo><mi\
  \ mathvariant=\"bold\">Q</mi><msup><mrow/><mi mathvariant=\"normal\">T</mi></msup><mi>z</mi><mo>)</mo></mrow><mi>j</mi></msub></mo></math></displayedItem>\
  \ ![numbered Display Equation\n\n因此，当 `j = 1, …, h` 时，`HX[j]` 与 `HXz` 的样本协方差为零，那么\n\
  \n<displayedItem xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\"\
  \ xmlns=\"http://www.wiley.com/namespaces/wiley\" xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
