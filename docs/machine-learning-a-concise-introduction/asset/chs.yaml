  ><mrow><mo>{</mo><msub><mi>e</mi><mi>i</mi></msub><mi>k</mi><msqrt><msub><mi>&#x03bb;</mi><mi>i</mi></msub></msqrt><mo:</mo><mi>i</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#x22ef;</mo><mo>,</mo><mi>m</mi><mo>}</mo><mo>,</mo></mrow></math></displayedItem>\n\
  ```\n\n\n\n\n其中 `e[1]`, …, `e[m]` 是 $\\mathbb{R}^m$ 的标准基向量。轴为矩阵 $k\\lambda^{1/2}$\
  \ 的列向量。椭球的体积为：\n\n$$\n\\frac{\\pi^{m/2}}{\\Gamma(\\frac{m}{2}+1)} \\prod_{i=1}^m\
  \ k\\sqrt{\\lambda_i} = \\frac{\\pi^{m/2}}{\\Gamma(\\frac{m}{2}+1)} k^m |\\lambda|^{1/2}\
  \ = \\frac{\\pi^{m/2}}{\\Gamma(\\frac{m}{2}+1)} k^m |\\Sigma|^{1/2}\n$$\n\n椭圆 (C.1)\
  \ 的轴通过 $z = \\Gamma w + \\mu$ 变换回得到。它们是 $\\Gamma\\lambda^{1/2}$ 的列向量（且椭圆中心位于 $\\\
  mu$）。\n\n### C.2 轴到参数\n\n为了计算协方差矩阵，给定 $k$ 和一组轴 $\\{a[1], \\dots, a[m]\\}$，令 $\\\
  Gamma$ 为 $m \\times m$ 矩阵，其第 $i$ 列为 $\\frac{a_i}{\\|a_i\\|}$，令 $\\Lambda$ 为 $m \\\
