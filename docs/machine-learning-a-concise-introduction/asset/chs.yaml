  \ 0.272（标准差为 0.047）。(4)\n\n将偏差-方差权衡正式扩展到任意损失函数（或仅针对 0–1 损失的分类）是一个活跃的研究领域：例如，参见 Kong\
  \ and Dietterich (1995)、Breiman (1996b)、Kohavi and Wolpert (1996)、Tibshirani (1996a)、Friedman\
  \ (1997b)、James and Hastie (1997)、Breiman (1998)、Domingos (2000)、James (2003)、Efron\
  \ (2004) 以及 Le Borgne (2005)。这些论文大多针对 0–1 损失的分类提出了偏差和方差的定义，尽管一些也处理了更一般的损失。此外，这些论文大多将风险加法分解为内在风险加偏差加方差之和（类似于\
  \ (5.1) 的形式），尽管 Domingos (1999) 提出了一种加权加法分解，而 Friedman (1997b) 提出了一种与高斯累积分布函数复合的乘法分解。在对称损失函数的情况下，偏差-方差权衡的正式扩展实际上可能比内在风险、偏差和方差更多的项：James\
  \ 在这种情况下考虑了这种可能性。\n\n\n\n\n以下将偏差和方差扩展到 0–1 损失分类的方法来源于 Breiman (1996b, 1998)。让 `f^S(X)`\
  \ 表示一种分类方法，它以训练数据集 `S` 和特征空间中的点 `X` 为输入，并返回一个类别标签（`X` 处的预测类别）。让 `f[b]` 表示贝叶斯分类器，在练习题\
  \ 4.2 中已证明其形式为：\n\n```\nf_b(X) = argmax_{c=1, \\dots, C} P(Y=c|X)\n```\n\n让 `P[S]`\
  \ 表示给定大小的训练数据集上的概率分布，并令\n\n```\nf^a(X) = argmax_{c=1, \\dots, C} P(f^S(X)=c)\n```\n\
  为关于训练数据集的分布在 `X` 处最可能被预测的类别标签。展望第 7 章，可以将 `f^a(X)` 认为是通过对从 `P[S]` 中抽取的许多数据集应用分类方法，并让训练好的分类器对\
  \ `X` 处的预测类别标签进行“投票”而产生的。Breiman 称为*聚合分类器*（aggregated classifier）。\n\nBreiman 定义，如果\
  \ `f^a(x) = f_b(x)`，则该分类方法在 `x \\in X` 处是无偏的：也就是说，分类方法在 `x` 处的预测可能是最优（贝叶斯）预测，而不是任何其他值。Breiman\
  \ 定义分类方法在 0–1 损失下的*偏差*（bias）和*方差*（variance）为\n\n```\nbias = P_{X,Y}(f_b(X)=Y and\
  \ f_b(X) \\neq f^a(X)) - E_S[P_{X,Y}(f^S(X)=Y)]\n```\n以及\n\n```\nvariance = E_S[P_{X,Y}(f^S(X)=Y)]\
  \ - P_{X,Y}(f^a(X)=Y)\n```\n\n\n\n\n并且表明，在 0–1 损失下，分类方法的风险可以分解为：\n\n$$R = E_{S,X,Y}\
  \ [L(Y, f^S(X))] = P_{X,Y}(f_b(X) \\neq Y) + bias + variance. $$\n\n(5.2) \n\n右侧的第一项是不可归约误差，即贝叶斯误差率。\n\
  \n针对图 5.2 所示的三个 `k`-最近邻分类器，使用从第 4.3 节描述的源中抽取的 1000 个独立 150 点数据集，对 Breiman 的偏差和方差量进行估计，结果如下：\n\
  \n| k | 固有风险 | 偏差 | 方差 | 总风险 |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | 0.191705\
  \ | 0.00002 | 0.082 | 0.275 |\n| 9 | 0.191705 | 0.00049 | 0.021 | 0.215 |\n| 100\
  \ | 0.191705 | 0.021 | 0.058 | 0.272 |\n\n有趣的是，方差并没有随着 `k` 的增加而单调递减。\n\n**练习 5.2**\
  \ 证明 (5.2)。\n\n**练习 5.3** 使用上述分类偏差和方差的定义，证明如下：\n\n1. 贝叶斯分类器 `f_b` 的偏差为零；\n2. `f_b`\
  \ 和 `f^a` 的方差为零；\n3. 更一般地，如果训练后的分类器不依赖于数据，则任何分类方法的方差均为零；\n4. 偏差和方差可以表示为：\n\n$$bias\
  \ = \\sum_{x \\in X : f_b(x) \\neq f^a(x)} (E[Y|X=x][f_b(x) = Y] - E[S,Y|X=x][f^S(x)\
  \ = Y]) P_X(x) dx$$\n\n以及\n\n$$variance = \\sum_{x \\in X : f_b(x) = f^a(x)} (E[Y|X=x][f_b(x)\
  \ = Y] - E[S,Y|X=x][f^S(x) = Y]) P_X(x)dx$$\n\n5. 偏差和方差是非负的。\n\n\n\n\n接下来的练习意义在于，`Breiman`\
  \ 对偏差（bias）和方差（variance）的定义有一个奇特性：当分类器从“比随机猜测类别标签更像贝叶斯分类器”变为“比随机猜测类别标签更不像贝叶斯分类器”时，可能会表现出不连续性。\n\
  \n### 练习 5.4\n假设给出一个（虚拟的）`C`-类分类问题，且已知贝叶斯分类器，并将噪声贝叶斯分类器定义如下：给定 `x*`，噪声贝叶斯分类器随机选择预测贝叶斯分类器预测的类（概率为\
  \ `γ`），或者从贝叶斯分类器未预测的 `C − 1` 个类中随机选择一个进行预测。即：\n\n```math\nf^S(x) \\sim \\text{Multinomial}(1,\
  \ (p_1, \\dots, p_C))\n```\n\n![numbered Display Equation](img/c05_M0016.gif)\n\n\
  其中，对于 `c = 1, …, C`，\n\n```math\np_c = \\begin{cases} \\gamma & \\text{if } f_b(x)\
  \ = c \\\\ \\frac{1-\\gamma}{C-1} & \\text{if } f_b(x) \\neq c \\end{cases}\n```\n\
  \n![numbered Display Equation](img/c05_M0017.gif)\n\n随机决策是针对每个训练集 `S` 和每个输入 `x*`\
  \ 做出一次，因此虽然 `f^S(x)` 在训练时是随机生成的，一旦训练完成，它就是一个确定性函数。请用 `γ`、`C*` 和贝叶斯风险表示对于任何 `γ \\\
  in [0, 1]`、`γ \\neq 1/C` 以及任何 `C ⩾ 2`，噪声贝叶斯分类器的偏差、方差和风险。\n\n## 6 集成分类器\n本章的目标是将多个分类器结合产生一个比任何单个分类器都更好的单一分类器。这种方法被称为集成学习（ensemble\
  \ learning）。单个分类器被称为*基学习器*（base learners），组合后的分类器被称为*集成*（ensemble）。在本章中，我们将讨论几种类型的集成方法。\n\
  \n> 本章的目标是将多个分类器产生一个比任何单个分类器都更好的单一分类器。单个分类器被称为*基学习器*，组合后的分类器被称为*集成*。在本章中，我们将讨论几种类型的集成方法。\n\
  \n### 6.1 集成\n如果愿意训练 `L` 个分类器，可以通过让各个分类器“投票”来获得一个新的分类器。这被称为硬投票（hard voting）。新分类器预测得票最多的类别。如果出现平局，则随机选择一个票数最多的类别之一。另一种方法是软投票（soft\
  \ voting），即新分类器预测各个分类器中平均预测概率最高的类别。\n\n> 单个分类器被称为*基学习器*，组合后的分类器被称为*集成*。这种方法被称为集成学习。单个分类器被称为*基学习器*，组合后的分类器被称为*集成*。在本章中，我们将讨论几种类型的集成方法。\n\
  \n### 6.2 Bagging\n我们将讨论的方法是 bagging（自助聚合）。其思想是在训练数据的不同自助样本上训练多个基学习器，然后结合它们的预测结果。自助样本是通过从大小为\
  \ `n` 的训练集中有放回地采样 `n` 个观测值创建的。由于某些观测值会在自助样本中重复，而另一些则完全不会出现，每个自助样本与原始样本略有不同。\n\n\
  > 其思想是在训练数据的不同自助样本上训练多个基学习器，然后结合它们的预测结果。自助样本是通过从大小为 `n` 的训练集中有放回地采样 `n` 个观测值创建的。由于某些观测值会在自助样本中重复，而另一些则完全不会出现，每个自助样本与原始样本略有不同。\n\
  \n### 6.3 Boosting\n另一种集成方法是 boosting。与 bagging 不同，boosting 是顺序训练基学习器的。每个新学习器尝试尝试之前学习器的错误。这通常通过增加被之前学习器误分类的观测值的权重来实现。\n\
  \n> 另一种集成方法是 boosting。与 bagging 不同，boosting 是顺序训练基学习器的。每个新学习器都尝试修正之前学习器的错误。这通常通过增加被之前学习器误分类的观测值的权重来实现。\n\
  \n### 6.4 Stacking\n我们将讨论的最后方法是 stacking。stacking 使用元学习器（meta-learner）来结合基学习器的预测。基学习器在原始数据上训练，而元学习器则在基学习器的折外（out-of-fold）预测上训练。\n\
  \n> 我们将讨论的最后方法是 stacking。stacking 使用元学习器来结合基学习器的预测。基学习器在原始数据上训练，而元学习器则在基学习器的折外预测上训练。\n\
  \n### 6.5 随机森林\n一种流行的 bagging 方法是随机森林。随机森林是决策树的集合，其中每棵树都生长在自助样本上，并在每次分裂时使用特征的随机子集。这使得树之间的相关性降低。\n\
  \n> 一种流行的 bagging 方法是随机森林。随机森林是决策树的集合，其中每棵树都生长在自助样本上，并在每次分裂时使用特征的随机子集。这使得树之间的相关性降低。\n\
  \n### 6.6 神经网络\n神经网络也可以用于集成方法。例如，可以训练多个具有不同初始化的神经网络并结合它们的预测结果。\n\n> 神经网络也可以用于集成方法。例如，可以训练多个具有不同初始化的神经网络并结合它们的预测结果。\n\
  \n### 6.7 总结\n总而言之，集成方法是提高分类器性能的一种强大方法。bagging、boosting、stacking 和随机森林都是常见的集成技术。\n\
  \n> 总而言之，集成方法是提高分类器性能的一种强大方法。bagging、boosting、stacking 和随机森林都是常见的集成技术。\n\n\n\n\n\
