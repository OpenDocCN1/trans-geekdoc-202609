  \ 个自助样本（选择不同数量的自助样本是为了使每个袋装分类器总共在约 100 个 `n` 数据重复样本上训练）。自助样本的大小对袋装分类器的风险有很大影响。在这个例子中，由于\
  \ `n` = 150，选择远小于 `2− 6` 的 `ρ` 会导致自助样本仅包含一个数据点，这使得集成模型在每个点 `x` 处预测相同的类别。中间行显示了使用大小为\
  \ `n` 的自助样本的 100 个分类器袋装集集的决策。底行显示了使用 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c06\\_ILM0019.gif\"><mfrac><mn>100</mn><mi>&#x03c1;</mi></mfrac></math>![](img/c06_ILM0019.gif)\
  \ 个分类器的袋装集集的决策，使用大小为 `ρn` 的自助样本，`ρ` 的值是根据第 7.3 节中描述的袋外估计选定的近似最优值。视觉对比图 6.3 的顶行和中间行显示，大小为\
  \ `n` 的袋装分类器与基学习器的性能几乎相同。图 6.4 显示了 `ρ` 对袋装 1-最近邻分类器和袋装决策树回归桩风险的影响。当 `ρ` = 1 时，每个袋装分类器的风险与其基于所有数据训练的基学习器相同，正如预期那样。随着\
  \ `ρ` 从 1 减少，风险降低——作者认为这意味着它们之间的相关性降低了。当 `ρ` = `2− 5` 时，每个基分类器在五个数据点上训练，而当 `ρ` =\
  \ `2− 6` 时，每个基分类器在两个数据点上训练，即使对于这些小的自助样本，该示例也没有显示风险上升的迹。对于足够小的 `ρ`，每个自助样本包含一个数据点，每个基学习器预测它所训练的类别（无论输入向量如何），因此袋装分类器预测大小为\
  \ 1 的集中出现最多的类别。作者认为这意味着基学习器偏差和方差的增加超过了它们之间相关性的降低。\n\n**练习 6.4** *考虑使用 L 个大小为 `ρn`\
  \ 的自助样本（`ρ` 为正数）对 1-最近邻分类器进行袋装。设 X 是由袋装分类器分类的特征向量，x, y) 是距离 X 最近的训练数据点。假设 n 足够大，可以使用\
  \ 6.3 中的近似值且误差忽略不计，请证明当 L → ∞ 时，至少一半自助样本包含训练点 (x, y) 的概率趋于 1 当且仅当 ρ 大于 log 2 ≈ 0.693\
  \ 时。得出结论：除非 ρ 小于约 log 2，否则袋装 1-最近邻分类器的性能与单个 1-最近邻分类器相似。*\n\n\n\n\nBumping（提升法）由\
  \ Tibshirani 和 Knight (1999) 提出，它通过构建数据的自助样本，在每个样本上训练一个分类器，然后在整个数据集上计算每个分类器的训练误差。最后使用整体训练误差最小的分类器。如果一个分类器由于少数误导性数据点而陷入次优拟合状态，这种方法可能会非常有用。在第\
  \ 4.3 节数据上训练的提升 1-最近邻分类器所做出的预测显示在图 6.5 的左上单元格中。该提升分类器是从图 6.4 在生产过程中训练的所有基分类器集合中选出的。\n\
  \n![图 6.5 通过提升 1-最近邻分类器所做出的分类决策（左上单元格）、应用 1000 树随机森林（右上单元格）、1000 个提升分类桩的集成（左下单元格）以及\
  \ 1000 个弧形 1-最近邻分类器的集成（右下单元格），均在第 4.3 节的数据上训练。提升分类器是一个单一的 1-最近邻分类器，是从图 6.4 所示自助实验训练的所有基分类器中选择出的具有最小袋外风险（out-of-bag\
  \ risk）。分类桩（stump）是指限制为最多有两个叶节点的分类树。这些分类器的估计风险分别为：提升 1-最近邻为 0.245，随机森林为 0.220，提升桩为\
  \ 0.268，弧形桩为 0.262。](img/c06f005.jpg)\n\n**图 6.5** 通过提升 1-最近邻分类器所做出的分类决策（左上单元格）、应用\
  \ 1000 树随机森林（右上单元格）、1000 个提升桩的集成（左下单元格）以及 1000 个弧形 1-最近邻分类器的集成（右下单元格），均在第 4.3 节数据上训练。提升分类器是一个单一的\
  \ 1-最近邻分类器，是从图 6.4 在自助实验训练的所有基分类器集合中选出的具有最小袋外风险。*分类桩*（stump）是指限制为最多有两个叶节点的分类树。这些分类器的估计风险分别为：提升\
  \ 1-最近邻为 0.245，随机森林为 0.220，提升桩为 0.268，弧形桩为 0.262。\n\n### 6.5 随机森林\n\n随机森林分类器由 Breiman\
  \ (2001a)，它是他所相关的早期技术的结合：分类树和自助装法（bagging）。^(7) 忽略一个细节，随机森林分类器简单来说就是自助装的树：在数据的 *L*\
  \ 个自助样本上训练树（生长到过拟合状态，不进行剪枝），然后由树进行委员会投票。省略的细节是，在生长树的每一步中都会做出随机训练决策：考虑 `m` 个特征的一个小随机样本（通常约为\
  \ `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley\" xmlns:cms=\"http://wiley.com\"\
  \ xmlns:dct=\"http://www.documentum.com\" display=\"inline\" location=\"image_n/c06_ILM021\"\
  ><m`)images/c06_M021.gif` 中的特征）用于分裂，而不是考虑所有的 `m` 个。此目的目的是减少森林中树对树之间的相关性。^(8) 在第\
  \ 4.3 节数据上训练的 1000 树随机森林所做出的预测显示在图 6.5 的右上单元格中。随机森林在证明上是抗过拟合的，其意义在于无限地增加树的数量 `L`\
  \ 不会导致随机森林过拟合，尽管描述该森林所需的参数数量趋于无穷大。^(9) 令 `P(X, Y)` 为抽取数据的概率分布：假设训练数据和所有未来数据均从该分布中抽取。令\
  \ `(X, Y)` 表示从 `P(X, Y)` 抽取的随机数据。可以证明，在 0–1 损失下，具有树 `T[1], …, T[L]` 的随机森林风险为：\n\n\
  ```\nR(T1, ..., TL) = P(X, Y | trees voting for class Y < max c != Y | trees voting\
  \ for class c)\n```\n![公式](img/c06_M010.gif)\n\n令 `P(F)` 为训练随机森林树时用于生成随机决策的概率分布。Breiman\
  \ (2001a) 已证明，当 `L → ∞` 时，具有 `L` 棵树的随机森林的风险于从数据分布 `P(X, Y)` 抽取的新数据 `(X, Y)` 被一个使用\
  \ `P(F)` 在训练数据上做出随机训练决策的随机树错误分类的概率。\n\n```\nR(T1, ..., TL) → P(X, Y) (P(F(a tree\
  \ voting for class Y < max c != Y | tree voting for class c))\n```\n<span class=\"\
  equationNumber\"><a href=\"#c06-disp-0011-2\">(6.2)</a></span>![公式](img/c06_M011.gif)\n\
  \n概率为 1。因此在实践中，除了计算成本外，没有理由担心 `L` 变得太大。\n\n随机森林的接近性可用于发现数据中的簇，特别是给定类别内的簇。\n\n\n\n\
  \n### 练习 6.5\n\n设 $L(d, c)$ 为任意损失函数，其具有如下（极小的）性质：对于所有 $c$，$L(c, c) = 0$，且对于所有 $d\
  \ \\neq c$，$L(d, c) > 0$。\n\n![numbered Display Equation](img/c06_M0012.gif)\n\n\
  证明：如果随机森林中的每棵树都生长到所有叶子节点的纯度为零（即仅包含一类别的训练数据），那么损失函数所取的实际值对森林做出的预测没有影响。假设对于所有 $c$\
  \ 有 $P(Y=c) > 0$，类别的边缘分布 $(P(Y=1), \\dots, P(Y=C))$是否有影响？\n\n### 6.6 提升 (Boosting)\n\
  \n为训练数据分配真实的非负权重 $w[1], \\dots, w[n]$，并令 $(x[i], y[i])$ 分类为类别 $d$ 所产生的损失为 $w[i]L(y[i],\
  \ d)$。权重 $w[i]$ 反映了正确分类训练数据 $(x[i], y[i])$ 的相对重要性。\n\n**练习 6.6 开放性挑战。** 修改第 4 章中的每个分类算法，使其适用于加权数据。**提示：**\
  \ 如果所有权重 $w[1], \\dots, w[n]$ 均为整数，则将其等同于未加权的情况，但数据 $(x[i], y[i])$ 在训练集中出现了 $w[i]$\
  \ 次。如果所有权重都是有理数，则可以通过整数常数 $\\rho > 0$ 对权重进行放大，使得 $\\rho w[1], \\dots, \\rho w[n]$\
  \ 均为整数，并且损失函数可以除以 $\\rho$。一组实权重可以被处理为有理权重集的极限。\n\n提升分类器是指图 6.6 所示的通用类型算法。一种特定的提升算法是\
  \ `AdaBoost`（“adaptive boosting”的缩写）（Freund and Schapire, 1997; Schapire and Freund,\
  \ 2012）。原始的 AdaBoost 算法是针对 $C = 2$ 个类定义的。使用 0–1 损失，`AdaBoost` 如图图 6.7 所示（Friedman\
  \ et al., 2000）。\n\n![Figure 6.6 A generic boosting algorithm.](img/c06f006.jpg)\n\
  \n**图 6.6** 通用提升算法。\n\n![Figure 6.7 The AdaBoost algorithm for 0–1 loss and C =\
  \ 2 classes. Modifications for the case C > 2 and a reason for the particular choice\
  \ of weight 是在正文和练习中描述。](img/c06f007.jpg)\n\n**图 6.7** 针对 0–1 损失和 $C = 2$ 类的 AdaBoost\
  \ 算法。针对 $C > 2$ 情况的修改以及选择特定权重 $(1-\\hat{R}_l)/\\hat{R}_l$ 的原因在正文和练习中描述。](images/c06_ILM0027.gif)\n\
  \n\n\n\n\n在 Adaboost 中，如果 $R^l = 0$，则不会发生重加权（因为没有训练数据被分类错误），并且如果步骤 (2A) 中的训练是确定性的（即不涉及数据外部之外的随机性源），则\
  \ $f^l = f^{l+1} = \\dots = f^L$。这些看似完美的分类器对其投票分配了无限大的权重，因此 AdaBoost 产生与 $f^l$ 相同的预测结果。\n\
  \n如果 $R^l$ 为正但非常小，那么 $(1-R^l)/R^l$ 就会很大，而较少的分类错误点会被大幅增加权重，导致 $f^{l+1}$ 关注这些点。同时，分类器\
  \ $f^l$ 以相对较高的权重进行投票。只要 $R^l < 1/2$，$f^l$ 的预测被认为比抛掷均匀硬币的预测更好，因此分类错误点会被增加权重，且 $f^l$\
  \ 以正权重进行投票。\n\n如果 $R^l = 1/2$，则 $f^l$ 的预测被认为等同于抛掷均匀硬币，且权重实际上没有改变（再次增加了出现 $f^l =\
  \ f^{l+1} = \\dots = f^L$ 的可能性）。这些完全无用的分类器对其投票分配了零权重。\n\n\n\n\n如果 $R^l > 1/2$，则\
  \ $f^l$ 所出的预测被认为比抛均匀硬币的预测结果`更差`。这并不意味着分类器是没用的，它仅仅混淆了两个类别标签的含义（或者等价地，$f^l$ 正处于`反向日`状态\
  \ (Watterson, 1988)）。因此它的投票具有负权重，也就是说，给相反的投票分配了正权重。被分类错误的点权重会被降低，因为从 AdaBoost 的角度来看，让一个比抛硬币更差的分类器变得更差是有用的，只要我们知道通过赋予其投票负权重来反转分类器的预测结果即可。如果\
  \ $Rl = 1$，则所有被分类错误点的权重都将减为零，且 $f^l$ 以无限负权重投票。\n\n### 练习题 6.7\nAdaBoost 算法的表述也可以与图\
  \ 6.7 所示略有不同。具体来说，步骤 (2C) 可以被替换为：\n\n- (2C') 对于 $i = 1, \\dots, n$，如果 $y_i \\neq\
  \ f^l(x_i)$，将权重 $w[i]$ 更新为值 $wi^{-1}$；如果 $y_i = f^l(x_i)$，将权重 $w[i]$ 更新为值 $wi^{1/2}$。\n\
  \n并且步骤 (3) 可以被替换为：\n\n- (3') 将新数据分类为 $\\text{argmax}_{c \\in \\{1, \\dots, C\\}}\
  \ \\sum_{l=1}^L f^l(x_i)$\n\n证明这种不同的 AdaBoost 表述产生的与图 6.7 完全相同的分类器集成。\n\n### 练习题\
  \ 6.8\n在图 6.7 所示的 AdaBoost 算法的第 $l$ 次迭代中，令 $w[1], \\dots, w[n]$ 表示 (2A) 中的权重，$v[1],\
  \ \\dots, v[n]$ 表示 (2D) 中更新后的权重。即：\n\n```\nv[i] = \\begin{cases} c * w[i] & \\text{if\
  \ } y_i = f^l(x_i) \\\\ c * w[i] & \\text{if } y_i \\neq f^l(x_i) \\end{cases}\n\
  ```\n\n其中 $c$ 的选取使得 $v[1] + \\dots + v[n] = 1$。\n\n\n\n\n\n1. 证明 $c = \\frac{1}{2(1-R^l)}$\
  \ (images/c06_M0014.gif)，因此 AdaBoost 中的步骤 (2D) 等同于将每个权重除以 $2(1-R^l)$ (images/c06_ILM0046.gif)。\n\
  \n2. 证明新权重 $v[1], \\dots, v[n]$使得分类器 $f^l(x_i)$ (images/c06_ILM0047.gif) 在训练风险方面尽可能差，即\
  \ $\\sum_{i=1}^n v_i [y_i \\neq f^l(x_i)] = \\frac{1}{2}$ (images/c06_M0015.gif)。\n\
  \nZhu 等人 (2009) 将 AdaBoost 推广到了 $C > 2$ 类的情况。他们的算法与原始算法的区别仅在于在步骤 (2) 中对分类错误数据的权重采用的重新加权，即\
  \ $w_i \\frac{1-R^l}{R^l(C-1)}$ (images/c06_M0016.gif)，以及在步骤 (3) 中分配给第 $l$ 个分类器投票的权重，即\
  \ $\\log(\\frac{1-R^l}{R^l}(C-1))$ (images/c06_M0017.gif)。\n\n只要 $R^l < \\frac{C-1}{C}$\
  \ (images/c06_ILM0048.gif)，多分类 AdaBoost 的解释和行为与原始算法相同。如果出现 $R^l = \\frac{C-1}{C}$\
  \ (images/c06_ILM0049.gif)，则 $f^l$ (images/c06_M0050.gif) 的预测被认为等同于掷一个 $C$ 面骰子。在这种情况下，权重实际上没有改变（增加了\
  \ $f^l + 1 = C$ 的可能性） (images/c06_ILM0051.gif)，且 $f^l$ (images/c06_M0052.gif) 的投票被分配的权重为零。如果\
  \ $R^l > \\frac{C-1}{C}$ (images/c06_ILM0053.gif)，广义 AdaBoost 会给 $f^l$ (images/c06_M0054.gif)\
  \ 的投票赋予负权重，因为 $f^l$ (images/c06_M0055.gif) 的预测结果比公平掷骰子还要差。\n\n\n\n\n使用三分类泛化 AdaBoost\
  \ 训练的 1000 个决策树分类器（stumps）在第 4.3 节数据上生成的预测结果如图 6.5 的左下单元格所示。\n\n## 6.7 Arcing\n\n\
  *Arcing*（自适应重采样与组合，全称 adaptive resampling and combining）与提升（boosting）类似。Arcing 不是在分类算法内部对数据应用权重，而是根据不断变化的概率分布从训练数据中进行放回抽样，从而提取一个新的数据集来训练分类器。\n\
  \n一种基于 0–1 损失的 AdaBoost 模型的特定 arcing 算法^(11)所示于图 6.8。在 Breiman (1996b) 的术语中，AdaBoost\
  \ 是*非随机 arcing*。\n\n![图 6.8 基于 AdaBoost 算法的用于 0–1 损失和 C = 2 类的 arcing 算法。针对 C >\
  \ 2 情况的修改在第 6.6 节的正文中描述。](img/c06f008.jpg)\n\n`图 6.8**` 基于 AdaBoost 算法的用于 0–1 损失和\
  \ *C* = 2 类的 arcing 算法。针对 *C* > 2 情况的修改在第 6.6 节的正文中描述。\n\n使用三分类泛化 arcing 训练的 1000\
  \ 个决策树分类器在第 4.3 节数据上生成的预测结果如图 6.5 的右下单元格所示。\n\n## 6.8 堆叠（Stacking）与专家混合（Mixture\
  \ of Experts）\n\n堆叠并不是像委员会那样投票，一组训练好的分类器的输出（预测的类别或对类别的估计后验分布）可以作为另一个分类器的输入。这被称为*堆叠*（stacking）分类器\
  \ (Wolpert, 1992)。在堆叠时，训练好的分类器的输出被视为新特征。\n\n图 6.9 的左侧单元格显示了在数据集上训练的分类树预测 <displayedItem\
