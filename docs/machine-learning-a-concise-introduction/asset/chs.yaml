  \ $\\alpha/I$ 的检验。\n\n### 练习 10.5\n设 $\\alpha = = E[X]$。由于 $g$ 是凹函数，存在一条穿过点 $(\\\
  alpha, g(\\alpha))$ 的直线，使得由 $(y, g(y))$ 参数化的曲线始终位于该直线上或下方。设 $s$ 为该直线的斜率，则：\n\n$$g(y)\
  \ \\leq g(\\alpha) + s(y - \\alpha)$$\n\n对于所有 $y \\in \\mathbb{R}$。那么：\n\n$$E[g(X)]\
