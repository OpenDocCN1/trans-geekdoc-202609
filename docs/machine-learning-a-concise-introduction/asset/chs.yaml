  \n编号方程\n\n这些参数都是为了最小化留一交叉验证风险而选择的。例如，\n\n```r\nsvmpoly.loo.all = function(datx,daty,theta)\
  \ {\n  m = svm(as.factor(daty)˜.,data=datx,kernel=“polynomial”,\n  cost=theta[1],gamma=theta[2],coef=theta[3],\n\
  \  degree=theta[4],cross=dim(datx)[1]);\n  return(1-m$tot.accuracy/100);\n}\nlibrary(stats);\n\
  opt = optim(c(1,1,0,3),svmpoly.loo.all,\n```\n\n给定 `θ` 值（现在是一个四元向量），函数 `svmpoly.loo.all()`\
  \ 返回惩罚参数 `γ = θ[1]` 和内核参数 `α = θ[2]`、`β = θ[3]` 的多项式支持向量机的留一交叉验证风险。使用 `stats` 库中的通用多变量优化函数\
  \ `optim()` 找到这些参数的近似最优值。`optim()` 实现了多种优化算法：Nelder-Mead（第 10.2 节](#c10_2)）、BFGS（第\
  \ 10.1.4 节](#c10_1_4)）、共轭梯度（与 BFGS 类似，但在第 10 章中未介绍）和模拟退火（第 10.3 节](#c10_3)）。在本应用中，Nelder-Mead\
  \ 算法是一个方便的选择，可以快速找到 `<R^cv`](images/c14_ILM055.gif) 的局部最小值。尽管付出了努力，作者未能找到比 Nelder-Mead\
  \ 找到更好的最小值。`R^cv` 的近似最小值是从 `optim()` 的输出中恢复的，如所示：![14056.gif]。\n\n最优的多项式支持向量机随后可以在训练数据上拟合，并应用于测试数据：\n\
  \n```r\ntheta = opt$par;\nm = svm(as.factor(tdat[,3])˜.,data=tdatDF,kernel=“polynomial”,\n\
  cost=theta[1],gamma=theta[2],coef0=theta[3],\ndegree=theta[4]);\npred.class = predict(m,edatDF);\n\
  risk.test(pred.class);\n```\n\n\n\n\n\n如第 4.9 节所示，支持向量机是一种类别标签集合为\\{-1, 1\\}$的二分类器，训练好的支持向量机对新特征向量\
  \ $X$ 预测的类别标签为：\n\n```\nsign(\\theta_0 + \\sum_{i: (x_i, y_i) \\text{ is a support\
  \ vector}} \\psi_i^i y_i K(x_i, X))\n```\n![numbered Display Equation](img/c14_M0050.gif)\n\
  \n其中 $\\theta_0$ 是估计的截距参数，$\\psi_1¹, \\dots, \\psi_n^n$ 是对偶优化问题的参数，当且仅当 $(x_i, y_i)$\
  \ 是支持向量时，$\\psi_i^i \\neq 0$。如第 6.1 节所示，当面对 $C > 2$ 类的数据时，函数`svm()` 训练二分类支持机来区分类别\
  \ $c$ 和类别 $d（对于所有 $c \\le d \\le C$），生成的 $C²$ 个分类器在一个委员会中进行投票。因此，`svm()` 输出的分类器由\
  \ $C²$ 个截距参数 $\\theta^{(c,d)}$、$C²$ 组支持向量和 $C²$ 组值决定：\n\n```\n\\{\\theta_i(c,d)\
  \ : (x_i, y_i) \\text{ is a support vector for the } (c,d)\\text{ classifier}\\\
  }\n```\n其中 $1 \\le c < d \\le C$。![images/c14_M0051.gif 注意，给定的训练数据 $(x_i, y_i)$\
  \ 可能是 $C²$ 个二分类支持向量机中的一个、多个或无的支持向量。在函数`svm()` 内部，当 $C$ 个类别标签为整数 $1, 2, \\dots, C$\
  \ 时，用于区分类别 $c$ 和类别 $d$ 的二分类器在且仅当 $c < d$ 时，将类别 $c$ 编码为“1”，并将类别 $d$ 编码为“−1”。函数`svm()`\
  \ 的输出包含了 $C²$ 个模型的所有估计参数并拼接。对于 $1 \\le c < d \\le C$，将成对索引 $(c, d)$ 按以下顺序写入：```(1,2),\
  \ (1,3), \\dots, (1,C), (2,3), \\dots, (2,C), \\dots, (C-1,C)```![numbered Display\
  \ Equation](img/c14_M0052.gif)\n\n\n\n\n让这个成对索引的有序集合与有序集合 $1, 2, \\dots, C²$![](img/c14_ILM0066.gif)：具体来说，从成对索引\
  \ $(c, d)$ 到单个索引 $i$ 的映射为：\n\n```math\ni = C(c-1) - \\frac{c+1}{2} + d.\n```\n\n\
  ![numbered Display Equation](img/c14_M0053.gif)\n\n第 $(c, d)$ 个分类器的截距参数的负值 $-\\\
  theta^{((c, d))}[0]$ 存储在一个长度为 $C²$![](img/c14_ILM0067.gif) 的向量 $m_2\\rho$ 中：\n\n\
  ```math\n-\\theta_0^{(c,d)} = m_2\\rho[i].\n```\n\n![numbered Display Equation](img/c14_M0054.gif)\n\
  \n所有 $C²$![](img/c14_ILM0068.gif) 分类器使用的支持向量存储在一个具有 $m$ 列的单矩阵 $m_{SV}$ 的行中。支持向量在\
  \ $m_{SV}$ 的行中按类别分组：首先是第 1 类的支持向量，然后是第 2 类，以此此类推。每类支持向量的数量存储在长度为 $C$ 的向量 $m_{nSV}$\
