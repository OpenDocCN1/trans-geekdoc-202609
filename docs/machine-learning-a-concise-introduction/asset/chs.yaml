  ]</mo></mrow><mi>m</mi></msup><mo>&#x2192;</mo><msup><mrow><mo>\\[</mo><mn>0</mn><mo></mo><mn>1</mn><mo>\\\
  ]</mo></mrow><msup><mi>N</mi><mrow><mo>(</mo><mi>k</mi><mo>)</mo></mrow></msup></msup></mrow></math>![](img/c11_ILM0130.gif)由\
  \ *$X*↦ Z^*((*k*))}$ 给出的函数在 *$N^*((*k*)) < *m*$ 时产生特征空间的低维表征。\n\n训练完深度自动编码器后，由 *$X*↦\
