  \ mathvariant=\"normal\">T</mi></msup><msup><mi>&#x03b1;</mi><mrow><mo>-</mi><mn>1</mn></mrow></msup><mi>w</mi><mo>=</mo><msup><mi>k</mi><mn>2</mn></msup><mo>}</mo></mrow></math></displayedItem>\n\
  ```\n\n椭圆\n\n```xml\n<displayedItem xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"\
