  \n| 符号 | 描述 |\n| :--- | :--- |\n| ![images/bapp01_ILM0011.gif) | 观测响应 $\\in(\\cdot)$，$\\\
  cdot$ 的一个实现 |\n| ![images/bapp01_ILM0014.gif) | 误差，作为一个随机变量 |\n| $\\epsilon$ | 观测误差，$\\\
