  bold\">X</mi><mo>^</mo></mover><mi>j</msub></math>![](img/c11_ILM0120.gif) 的坐标进行排序并删除\
  \ *pn* 个最小值和 *pn* 个最大值后得到的数字集合的标准差。\n\n### 11.3.8 特征选择\n\n\n\n\n\n`Feature selection`是将特征空间到由某些特定坐标构成的子空间的投影，而寻找能够产生低风险模型的特征集的过程可以被视为一种特殊的投影追求。给定来自第\
  \ 7 章的风险估计或模型选择标准——或任何其他模型选择标准——特征选择寻求一个特征子集 `{i[1]`, `i[2]`, …, `i[k]}`⊆{1, …,\
  \ `m`*}，使得在该特征子集上训练的模型能够优化该准则。\n\n```math\n\\left[\n\\begin{matrix}\n\\text{\\aligned{right}}x_{1,i_1}\
  \ & \\text{\\aligned{right}}x_{1,i_2} & \\text{\\aligned{right}}\\dots & \\text{\\\
  aligned{right}}x_{1,i_k} \\\\\n\\text{\\aligned{right}}x_{2,i_1} & \\text{\\aligned{right}}x_{2,i_2}\
  \ & \\text{\\aligned{right}}\\dots & \\text{\\aligned{right}}x_{2,i_k} \\\\\n\\\
  text{\\aligned{right}}\\dots & \\text{\\aligned{right}}\\dots & & \\text{\\aligned{right}}\\\
  dots \\\\\n\\text{\\aligned{right}}x_{n,i_1} & \\text{\\aligned{right}}x_{n,i_2}\
  \ & \\text{\\aligned{right}}\\dots & \\text{\\aligned{right}}x_{n,i_k}\n\\end{matrix}\n\
  \\right],\n```\n\n这可以通过离散优化来实现，即使用第 10 章中描述方法的离散模拟，或第 7.10 节描述的逐步特征选择。\n\n### 11.3.9\
  \ 聚类\n将聚类算法应用于任何被视为 `m`-维特征到单个分类变量（分配给特征向量的簇标签）的“投影”的数据集。通过改变算法、参数或原始特征，不同的聚类结果产生不同的分类变量。\n\
  \n### 11.3.10 流形学习\n有时在多维缩放之前会有一个步骤，其中给定的不相似性矩阵 \n\n```math\nD = [d(o_i, o_j)]_{i,j=1..n}\n\
  ```\n\n被另一个不相似性矩阵替换\n\n```math\nD' = [d'(o_i, o_j)]_{i,j=1..n}\n```\n\n其中不相似度量 `d'`\
  \ 是由度量 `d` 构建的，但认为 `d'` 比 `d` 更好地表示对象 `o[1]`, …, `o[n]` 的信息。当 `R^m` 中的数据位于（或近似位于）维度低于\
  \ `m` 的流形^15 上，且不相似性 `d` 是 `R^m` 中的欧式距离时，就会出现这种情况。在这种情况下，尊重流形几何结构的度量 `d'` 可能优 `d`，因为流形在\
  \ `R^m` 中的曲率可能导致在 `d'` 下距离远的点在 `d` 下彼此靠近。恢复流形 `d'` 的问题被称为*流形学习*。\n\n几种方法通过从数据中构建加权*最近邻图*并根据路径权重产生新距离\
  \ `d'` 来解决这一问题。我们将通过 Tenenbaum 等人 (2000) 提出的特定方法进行说明，该方法被称为 *isomap*（等距映射的缩写）。如果对于给定的阈值\
  \ `ε > 0` 满足 `d(o_i, o_j) < ε`，则两个数据对象 `o[i]` 和 `o[j]` 为邻居；或者在另一种方法中，对于给定的参数 `k\
  \ ⩾ 1`，`o[i]` 是距离 `o[j]` 最近的 `k` 个数据之一——反亦然。每个数据对应图的一个*顶点*，当且仅当 `o[i]` 和 `o[j]`\
  \ 为邻居时，对应的顶点对 `o[i], o[j]` 通过图的*边*连接。如果对应于 `(o[i], o[j])` 的边在图中，则它被赋予 `d(o_i, o_j)`\
  \ 的*边权重*。`o[i]` 和 `o[j]` 在（假设的）流形内的距离由图中连接对应 `o[i]` 的顶点和对应 `o[j]` 的顶点的最低权重路径（边序列）来近似。\n\
  \n![图 11.9 应用于 simplex-edges 数据集的 isomap 流形学习算法。顶部三个单元格显示数据集中所有点之间的距离，点沿一维流形排列（点的颜色沿流形形成彩虹）。中间两个单元格显示了将一维线性缩放应用于欧式（左）和近似测地（右）距离矩阵的结果，为了清晰添加了垂直抖动。底部两个单元格显示了将二维线性缩放应用于欧式（左）和近似测地（右）距离矩阵的结果。文中给出了进一步分析。](img/c11f009.jpg)\n\
  \n\n\n\n\n**图 11.9** 应用于 simplex-edges 数据集的 isomap 流形学习算法。顶部三个单元格显示了数据集中所有点对之间的距离，点沿着一维流形排序（点被着色使得沿流形呈现出彩虹色）。中间两个单元格显示了对欧几里得距离（左）和近似地线距离（右）距离矩阵应用一维线性\
  \ MDS 的结果，并为了清晰起见加入了垂直抖动。底部两个单元格显示了对欧几里得距离（左）和近似地线距离（右）距离矩阵应用二维线性 MDS 的结果。正文中给出了进一步的分析。\n\
  \n这在图 11.9 中通过第 11.2 节中 simplex 数据集的变体说明。`simplex-edges dataset` 包含 1000 个点 `x`[1],\
  \ …, `x`[1000]，位于 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
