  \ mathvariant=\"normal\">T</mi></msup><msup><mi>&#x03a3;</mi><mrow><mo>-</mi><mn>1</mn></mrow></msup><mrow><mo>(</mo><mi>z</mi><mo>-</mi>&#x03bc;</mi><mo>)</mo></mrow><mo>=</mo><mi>1</mi></msup></mrow></math></displayedItem>\n\
  ```\n\n注意 `Γ` 是正交的，且所有特征值均为正，因为 `Σ` 是正定的。令 `w` = `Γ`，因此 (C.1) 等价于：\n\n```xml\n<displayedItem\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" xmlns=\"\
