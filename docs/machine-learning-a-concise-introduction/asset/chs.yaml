  \ width=\"0.166667em\"/><mi>&#x0cc;</mi><mo>(</mo><msub><mi>&#x03b8;</mi><mn>0</mn><mrow><mo</mo><mn>1</mn><mo>)</mo</mrow></msub><mo>+</mo><msub><mi>&#x03b8;</mi><mi>&#x2605;</mi><mrow><mo</mo><mn>1</mn><mo>)</mo</mrow></msub><mspace\
  \ width=\"0.166667em\"/><mi>X</mi><mo stretchy=\"true\">)</mo><mo>.</mo></mrow></math></displayedItem>\n\
  \n\n\n\n输出向量 `T` = (`T[1]`, …, `T[C]`) 的转换方式与逻辑回归一样，转换为概率向量。\n\n```\nP(Y=c|X) =\
  \ \\frac{exp(T_c)}{\\sum_{d=1}^{C} exp(T_d)}\n```\n![numbered Display Equation](img/c04_M0073.gif)\n\
  \n在神经网络语境下，映射\n```\n(T_1, ..., T_C) \\to \\frac{exp(T_c)}{\\sum_{d=1}^{C} exp(T_d)}\n\
  ```\n![numbered Display Equation](img/c04_M0074.gif)\n被称为 `softmax` 函数。与逻辑回归一样，新的数据点被归类以最小化估计风险。\n\
  \n神经网络可以有多个隐藏层。通过将向量 `Z` 作为另一层神经元的输入（神经元数量可能与第一层不同），可以由图 4.17 所示的结构构建一个双隐藏层神经网络，其输出随后被用线性函数\
  \ `T[1]`、 …, `T[C]` 的输入。\n\n训练神经网络意味着估计所有参数的值。神经网络通过使用数值优化方法，在训练数据上最小化均方误差或交叉熵损失来完成训练（例如，图\
  \ 4.18 所示的拟合神经网络是通过将第 10 章描述的 BFGS 算法应用于 1000 个随机生成的初始状态，并保留似然然最大的单一拟合结果而训练的）。神经网络的一个重要计算元素是`反向传播`\
  \ (`back-propagation`)，它指的是一种计算训练风险梯度的有效方法，用于梯度下降算法。有关交叉熵损失下训练估计风险梯度的计算等细节，可见第 10\
  \ 章。在训练深度网络（即具有许多层的网络）中证明实用的技术见第 11.3.11 节。\n\n从几何上看，图 4.17 中对应于 `N` 个隐藏神经元的 `N`\
  \ 个超平面将 $\\mathbb{R}^m$ 分为 $N_0 + \\dots + N_{\\min(m,N)} \\le 2^N$ (images/c04_ILM0087.gif)（退化情况下多面体数量更少），隐藏层的完整状态\
  \ `Z` = (`Z[1]`, …, `Z[N]`) 可以被视为二进制字码输入 `X` 的软版本。那么，输出层的线性函数可以被视为二进制字码。\n\n###\
