  ```\n关于 `μ`、`Σ` 的拉格朗日函数最大化已知等同于二次分类器对数似然的最大化：这在练习 5.2 中已完成。由于 X 在单位球内均匀分布：\n```xml\n\
  <math display=\"block\" location=\"image\\_n/bapp02\\_M089.gif\"><mi>B</mi>=</mo=\\\
  {\\mo><mrow><msub><z</mi</mn>1</msub><mo><mo><msub><z</mi</mn>2</msub><mo><mo><mo>...</mo><mo><momo><msub><z</mi</mn>m</msub><mo><lt;1</mo></mo></mo></math>`\n\
  ```\n因此 `X[1]` 在点 `x[1]` 处的密度等于 `B` 与超平面相交的 (m-1) 维体积：\n```xml\n<math display=\"\
  block\" location=\"image\\_n/bapp02\\_M090.gif\"><mi>H</mi>=</mo=\\{\\mo><mrow><mo><msub><z</mi</mn>1</msub><mo><mo><msub><z</mi</mn>2</msub><mo><mo><mo>...</mo><mo><mo><msub><z</mi</mn>m</msub><mo)momomo><mo&#x00b7;</mo><mrow><mo><mn>1</mn><mo><mo><mn>0</mn><mo><mo><mo>...</mo><mo><mo><mn>0</mn><mo>)</mo>=</mo><msub><x</mi</mn>1</msub></mo>.</math>`\n\
  ```\n\n\n\n\n交集 $B \\cap H$ 为空（因此体积为零），除非 $x[1] \\in [-1, 1]$，在这种情况下，交集 $B \\cap\
  \ H$ 是一个以 $(x[1], 0, \\dots, 0)$ 为中心、半径为 $\\sqrt{1-x_1²}$ 的 $(m-1)$ 维球![](img/bapp02_ILM0051.gif)。因此，$X[1]$\
  \ 在 $x[1]$ 处的密度为\n\n```math\nV(m-1, \\sqrt{1-x_1²}) = \\frac{\\pi^{(m-1)/2}}{\\\
  Gamma((m-1)/2)} \\frac{(1-x_1²)^{(m-1)/2}}{\\Gamma((m-1)/2+1)} \\int_{1}¹ (1-x_1²)^{(m-1)/2}\
  \ dx.\n```\n对于 $x[1] \\in [-1, 1]$![编号显示方程](img/bapp02_M0091.gif)。$X[1]$ 的密度关于零点对称，因此\
  \ $X[1]$ 服从 $N \\times |X[1]|$ 的分布，其中 $N$ 均匀分布在 $\\{-1, 1\\}$ 上，而 $|X[1]|$ 是定义在区间\
  \ $[0, 1]$ 上的随机变量。这意味着\n\n```math\nE[X_1] = 0 \\text{ and } Var[X_1] = E[X_1²] -\
  \ E[X_1]² = E[X_1²].\n```\n(M092.gif) $X²[1]$ 的分布通过通过\n\n```math\nP(X_1² \\le x)\
  \ = P(|X_1| \\le \\sqrt{x}) = \\int_0^{\\sqrt{x}} (1-x_1²)^{(m-1)/2} dx_1 = \\int_0^x\
  \ (1-u)^{(m-1)/2} \\frac{1}{2}u^{-1/2} du.\n```\n![编号显示方程](img/bapp02_M0093.gif)\
  \ 在最后一个积分中使用代换 $x_1 = \\sqrt{u}$ (images/bapp02_ILM0052.gif)。由此我们识别出 $X_1²$ 是 $Beta(1/2,\
  \ (m+1)/2)$ (images/bapp02_ILM053.gif)，因此\n\n```math\nVar[X_1] = \\frac{1/2}{m/2+1}\
  \ = \\frac{1}{m+2}.\n```\n(M094.gif)\n\n**练习 11.4** 令 $D$ 为原点到均匀分布在以原点为中心的单位球内点的距离。对于\
  \ $r \\in [0, 1]$，$D$ 的密度正比于半径为 $r$ 的 $m$ 维球的表面积，\n\n```math\nS(m, r) = \\frac{\\\
  pi^{m/2}}{\\Gamma(m/2)} r^{m-1}.\n```\n![编号显示方程](img/bapp02_M0095.gif)\n\n对于平方距离，\n\
  \n\n\n\n\n```math\nP(D² \\leq x) = P(D \\leq \\sqrt{x}) = \\int_{0}^{\\sqrt{x}}\
  \ r^{m-1} dr = \\int_{0}^{x} u^{\\frac{m-1}{2}} \\frac{1}{2} u^{-\\frac{1}{2}} du,\n\
  ```\n在最后一个积分中使用代换法 `r = u^{1/2}`。由此我们可知：\n```math\nD² \\sim Beta(m/2, 1).\n```\n\
  \n### 练习 11.7\n内球与以 $(1/2, 1/2, \\dots, 1/2)$ 为中心、半径为 $1/2$ 的球在点 $(x, x, \\dots,\
  \ x)$ 处切，其中 $x$ 是方程两个解中的较小值：\n```math\nm(x-1/2)² = (1/2)²\n```\n即：\n```math\nx =\
  \ 1/2 - 1/(2√m)\n```\n$S$ 的半径是原点到 $(x, x, \\dots, x)$ 的距离，即：\n```math\n\\sqrt{nx²}\
  \ = m-1/2.\n```\n该半径大于 1，因此 $S$ 包含 $C$ 外部的一个点。\n\n### 练习 11.10\n令 `1` 表示全 1 的 $n$\
