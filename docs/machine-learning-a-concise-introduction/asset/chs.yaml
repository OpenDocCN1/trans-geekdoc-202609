  \ 50%概率质量的估计密度等高线由虚线表示（等高线的获取见附录 C）。注意所有等高线的形状相同，仅位置不同，与 QDA（图 4.3）不同。LDA 的估计风险为\
  \ 0.229。\n\n**练习 4.6** 设 $(x_1, y_1), \\dots, (x_n, y_n)$ 是来自联合分布 $(X, Y)$ 的 $n$\
  \ 个独立样本，对于每个类别 $c=1, \\dots, C$，特征向量 $X|Y=c \\sim N(\\mu^c, \\Sigma)$。\n\n![编号显示公式](img/c04_M0026.gif)\n\
  \n证明在给定类别标签 $y_1, \\dots, y_n$ 使得特征向量 $x_1, \\dots, x_n$ 似然最大的参数 $\\mu¹, \\dots,\
  \ \\mu^C, \\Sigma$ 为：\n\n```\n\\mu^c = \\frac{1}{n_c} \\sum_{i=1, y_i=c}^{n} x_i\n\
  ```\n\n\n\n\n![numbered Display Equation](img/c04_M0027.gif)\n\n且 $\\Sigma² = \\\
  frac{1}{n} \\sum_{i=1}^{n} (x_i - \\mu_{y_i})(x_i - \\mu_{y_i})^T = \\sum_{c=1}^{C}\
  \ \\frac{n_c}{n} \\Sigma_c,$\n\n![numbered Display Equation](img/c04_M0028.gif)\n\
  \n其中 $n[c]$ 是类别 $c$ 的训练数据数量。**提示：** 请参见练习 4.5 的提示。\n\n**练习 4.7** 在 $C = 2$ 类类的情况下，最小后验风险\
  \ LDA 类别边界是一个超平面。在给定任意先验概率 $P(Y = 1)$ 和 $P(Y = 2) = 1 - P(Y = 1)$、任意损失函数 $L$（满足\
  \ $L(1, 1) = L(2, 2) = 0$）以及估计的类别密度 $P^c(x|Y=c) = \\phi(x|\\mu_c, \\Sigma_c) = \\\
  frac{1}{\\sqrt{|2\\pi\\Sigma_c|}} \\exp\\left(-\\frac{1}{2}(x-\\mu_c)^T\\Sigma_c^{-1}(x-\\\
  mu_c)\\right)$ 的情况下，建立该超平面并找到其方程。\n\n![numbered Display Equation](img/c04_M0029.gif)\n\
  \n将解写成类似于“如果 $x \\cdot v \\le \\alpha$，则预测 $x$ 为类别 1”的形式。当 $P(Y=1) = 1/2$ 且 $L(1,\
  \ 2) = L(2, 1)$ 时会发生什么？将你的解与练习 2.2 进行比较。\n\n### 4.4.3 高斯混合模型\n\n假设每个类别 $c$ 的然函数\
  \ $P(x|Y=c)$ 是高斯密度的混合，$P(x|Y=c) = \\sum_{j=1}^{J_c} w_{jc}\\phi(x|\\mu_{jc}, \\\
  Sigma_{jc})$，\n\n![numbered Display Equation](img/c04_M0030.gif)\n\n其中 $\\phi(x|\\\
  mu, \\Sigma)$ 表示均值为 $\\mu$ 协方差矩阵为 $\\Sigma$ 的高斯密度函数，$w[jc]$ 是非负权重对于每个 $c$ 满足 $\\\
  sum_{j=1}^{J_c} w_{jc} = 1$(images/c04_ILM040.gif)，且 $J[c] > 0$ 是第 $c$ 类的混合成分数量。高斯混合通过第\
  \ 10.7 节描述的期望极大（EM）算法进行拟合。必须使用模型选择标准确定每个类别的混合成分数量 $J[c]$，例如第 7 章讨论的标准（例如，交叉验证风险估计或赤池信息准则）。对所有\
  \ $c$ 设置 $J[c] = 1$ 等同于 QDA。\n\n对于基于似然的分类器使用高斯混合模型，如果 $m$ 很大，会导致需要估计的参数数量巨大。对协方差矩阵施加结构（例如全部相等、为对角矩阵或缩放的单位矩阵）可以减少参数数量。\n\
  \n图 4.5 显示了拟合图 4.1 数据的两个高斯混合模型。第一个模型每个类使用两个高斯成分（$J[1] = J[2] = J[3] = 2$），第二个模型每个类使用三个高斯成分（$J[1]\
  \ = J[2] = J[3] = 3$）。肉眼易见，拟合的三成分高斯混合模型性能很差（根据测试数据估计的风险为 0.228）：*然而，从意义上说，三成分高斯混合才是正确的模型，因为数据确实是由每个类三个成分的高斯混合生成的。*\n\
  \n\n\n\n\n![图 4.5 使用在图 4.1 数据上训练的高斯混合模型所得的估计类别密度（左侧）和分类决策（右）。上方两个单元格对应于每个类具有两个组件的高斯混合，下方两个单元格对应于每个类具有三个组件的高斯混合（绘图伪影可能会导致实际上平滑的密度图出现锯齿状）。注意，三组件高斯混合是正确的模型，从某种意义上说，数据确实是由每类三个组件的高斯混合生成的。白色曲线显示了贝叶斯边界。高斯混合模型的估计风险分别为\
  \ 0.205（每类两个组件）和 0.228（每类三个组件）。](img/c04f005.jpg)\n\n图 4.5 使用在图 4.1 数据上训练的高斯混合模型所得的估计类别密度（左侧）和分类决策（右）。上方两个单元格对应于每个类具有两个组件的高斯混合，下方两个单元格对应于每个类具有三个组件的高斯混合（绘图伪影可能会导致实际上平滑的密度图出现锯齿状）。注意，三组件高斯混合是正确的模型，从某种意义上说，数据确实是由每类三个组件的高斯混合生成的。白色曲线显示了贝叶斯边界。高斯混合模型的估计风险分别为\
  \ 0.205（每类两个组件）和 0.228（每类三个组件）。\n\n表 4.1 图 4.1 数据按类别划分后，在由近似极大似然法拟合的三组件高斯混合模型（中间列）以及数据提取自的三组件高斯混合模型（右列）下的的对数似然。在每个类别中，拟合模型分配给数据的似然度远高于真实模型。\n\
  \n|  || 类别 *c* 数据的拟合三组件模型对数似然 | 类别 *c* 数据的真实三组件模型对数似然 |\n| --- | --- | --- |\n|\
  \ 类别 *c* = 1 || − 136.41 || − 153.10 |\n| 类别 *c* = 2 || − 145.45 || − 168.40 |\n\
  | 类别 *c* = 3 || − 158.60 || − 179.53 |\n\n有些人认为，“结构上正确”的模型可能会产生风险相当高的训练分类器，是不直直觉的。该拟合模型的高风险是因为参数过多或数据太少。用第\
  \ 5 章的语言来说（该章将详细讨论这个问题），每个类具有三个组件的高斯混合模型具有低偏差高方差。然而，了解正确模型的参数形式应该有帮助这种直觉也有道理：参见第\
  \ 8 章，特别是定理 8.5，以及第 4.4.5 节中关于收敛速度的注释。\n\n使用 Student *t* 分布的混合代替高斯分布可能提供对离群值的鲁棒性。具有\
  \ `ν` 自由度的 Student *t* 分布的密度为：\n\n```\nP(x|μ,σ,ν) = \\frac{Γ((ν+1)/2)}{Γ(ν/2)√(νπσ²)}\
  \ [1 + (x-μ)²/(νσ²)]^{-(ν+1)/2}\n```\n![](img/c04_M031)\n\n对于较小的 `ν` 值，Student *t*\
  \ 分布的尾部比高斯分布重得多，而当 `ν` → ∞ 时，它趋近于高斯分布。当 `ν` = 1 时，Student *t* 分布被称为柯西分布。\n\n###\
  \ 4.4.4 核密度估计\n\n*核密度估计*通过在每个观测数据点及其附近放置概率质量来估计产生数据样本的密度函数。对于类别 *c*（*c* = 1, …,\
  \ *C*）数据的核密度估计形式如下：\n\n```\nP(x|Y=c) = \\frac{1}{n_c} \\sum_{i=1, y_i=c}^{n_c} \\\
  frac{1}{h_c^m} K(\\frac{x-x_i}{h_c})\n```\n![](img/c04_M0032)\n\n其中 `n[c]` 是类别 *c*\
