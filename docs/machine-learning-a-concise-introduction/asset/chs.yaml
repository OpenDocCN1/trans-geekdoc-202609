  \n**图 7.2** 模型选择。\n\n## 7.11 奥卡剃刀\n\n*奥卡剃刀*是一种原则，在统计模型的背景下认为，给定一组统计模型，我们应该选择风险足够低的简单模型，除非存在更复杂的模型。当模型的简单性被视为一种美德时，遵循这一原则的原因包括：\n\
  \n*   简单模型比复杂模型更容易理解，因此更容易被未参与其构建的人（Jeffreys, 1931）理解并应用；\n*   简单模型的计算开销可能更小，特别是当复杂模型需要昂贵的特征时。\n\
  \n然而，*简单模型并不一定比复杂模型预测得更好。回到章节首的引言，“美学与统计准确性并非同一。”\n\n# 8 一致性\n\n> 当你有数据时，你分析数据。当你没有数据时，你证明定理。\n\
  \n到此为止，数学上高明的读者可能在考虑了第 3 章](#c03.xhtml)、第 4 章](#c04.xhtml)和第 6 章](#c06.xhtml)介绍的所有分类方法后，感到沮丧，认为如此大量的方法不是知识的表现，而是无知的表现。这样的读者可能会说：“至少随着数据量\
  \ *n* 无限增长，应该有*一种*方法可以解决所有问题吧？”\n\n本章通过肯定回答这个问题，向读者介绍了一种名为一致性的分类方法属性。如果一个分类方法对于某个问题是一致的，那么它所产生的分类器的风险在\
  \ *n* → ∞ 时收敛于该问题的贝叶斯分类器的风险（对于某种适当收敛定义）。如果一个分类方法对于给定区域和范围的所有联合分布 P(*X*, Y*)都是一致的，<math\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c08\\_ILM0001.gif\"><mrow><mi mathvariant=\"script\">X</mi><mo>&#x00d7</mo><mi>f</mi><mo>(</mo><mi\
  \ mathvariant=\"script\">X</mi><mo>)</mo></mrow></math>![](img/c08_ILM0001.gif)，则该方法是通用一致的。\n\
  \n本章提出的主要结果是：存在已知通用一致的分类方法；存在一种广泛使用的分类方法（随机森林），它是已知不是通用一致的；以及（在作者看来）分类方法在 *n* →\
  \ ∞ 时的行为对于解决任何特定的应用问题并没有提供太多有用的见解。尽管如此，应用导向的读者可以跳过本章而没有影响。理论导向的读者可以在文中省略的证明和其他细节中查阅\
  \ Devroye et al. (1996)、Biau et al. (2008) 以及 Biau 和 Devroye (2010)。\n\n## 注意\n\n\
  ## 8.1 随机变量序列的收敛\n\n\n\n\n令 `Z[1]`, `Z[2]`, … 表示一个无限实值随机向量序列，并令 `Z` 表示另一个实值随机向量。如果序列\
  \ `Z[1]`, `Z[2]`, … *依概率收敛*到 `Z`，则对于任意 $\\epsilon > 0$，\n\n```math\n\\lim_{n \\\
  to \\infty} P(|Z_n - Z| > \\epsilon) = 0.\n```\n![numbered Display Equation](img/c08_M0001.gif)\n\
  \n概率收敛记为 $Z_n \\xrightarrow{P} Z$(images/c08_ILM0002.gif)。如果序列 `Z[1]`, `Z[2]`, …\
  \ *几乎处处敛*到 `Z`（或*强收敛*到 `Z`，或*以概率 1 收敛*到 `Z`），则\n\n```math\nP(\\lim_{n \\to \\infty}\
  \ Z_n = Z) = 1.\n```\n![numbered Display Equation](img/c08_M002.gif)\n\n几乎处处收敛记为\
  \ $Z_n \\xrightarrow{a} Z$(images/c08_ILM003.gif)。\n\n## 8.2 参数估计的一致性\n\n令 `z` 为一个固定但未的量，令\
  \ `Z[1]`, `Z[2]`, … 为作为 `z` 估计值的随机变量序列。如果估计序列 `Z[1]`, `Z[2]`, … *对 z 是一致的*（相应*对\
  \ z 是强一致的*），则 `Z[1]`, `Z[2]`, … 依概率收敛到 `z`（相应强收敛到 `z`）。\n\n例如，考虑以下情况：`z` 是某个分布的均值，从该分布中独立抽取无限数据序列\
  \ `W[1]`, `W[2]`, …,，并且对于每个 `n`，`Z[n]` 是前 `n` 个数据的样本均值，\n\n```math\nZ_n = \\frac{1}{n}\
  \ \\sum_{i=1}^{n} W_i\n```\n(images/c08_ILM007.gif)。在这种情况下，序列 `Z[1]`, `Z[2]`, …,\
  \ 对 `z` 既是一致的也是强一致的——这两个事实分别被称为*大数的弱数定理*和*大数的强定理*。\n\n在某些正则条件下（参见 Ferguson (1996)\
  \ 或 van der Vaart (2000)），模型参数的极大似然估计量既是一致的也是强一致的。特别，在具有独立同分布噪声的线性回归中，在练习 3.2 和练习\
  \ 3.7 中得到的回归参数估计\n\n```math\n\\hat{\\theta} = (x^T x)^{-1} x^T y\n```\n![numbered\
  \ Display Equation](img/c08_M0004.gif)\n\n当数据 (`X[1]`, `Y[1]`), (`X[2]`, `Y[2]`),\
  \ …, 实际上由线性模型生成时，该估计量对真实参数 $\\theta$ 是强一致的，即当 $Y[i] = (1, X[i])\\theta + E[i]$ 且\
  \ `E[1]`, `E[2]`, … 是独立同分布的 $N(0, \\sigma²)$ 时。\n\n## 8.3 预测的一致性\n\n回想第 2 章，近似方法是一种函数，它接收观测数据集（假设大小为\
  \ $n$）作为输入，并输出产生类别标签或连续响应的真实未知函数 $f$ 的近似值。近似方法（在大小为 $n$ 的数据集上训练）的风险，是由于抽取大小为 $n$\
  \ 的随机训练集 $S$，从中构建一个近似函数 $f_S$，并在新数据 $(X, Y)$ 上使用 $f_S(X)$ 代替 $Y$ 所产生的期望损失，\n\n```math\n\
  R_n = E_{S, X, Y} [L(Y, f_S(X))]\n```\n![numbered Display Equation](img/c08_M0005.gif)\n\
  \n\n\n\n其中 ![](img/c08_145_001.jpg) 是近似风险 ![](img/c08_145_002.jpg)。回想第 4.1 节，贝叶斯风险是对于在\
  \ (*X*, *Y*) 上具有给定联合分布的数据，任何近似方法所能达到的最小可能风险：\n\n```\nR_{Bayes} = E_X [\\min_{c \\\
  in \\{1, \\dots, C\\}} E_{Y|X} [L(Y, c)]]\n```\n\n![numbered Display Equation](img/c08_M0006.gif)\n\
  \n贝叶斯风险是贝叶斯分类器的风险。\n\n对于 $X \\times f(X)$ 上给定的联合分布 $P(X, Y)$，如果预测方法满足，则该方法为*一致预测方法*（或*弱一致预测方法*）：\n\
  \n```\nR_n \\to R_{Bayes}\n```\n\n![numbered Display Equation](img/c08_M0007.jpg)\n\
  \n![](img/c08_143_001.jpg)且如果满足，则该方法为*强一致预测方法*：\n\n```\nR_n \\xrightarrow{a.s.}\
  \ R_{Bayes}\n```\n\n![numbered Display Equation](img/c08_143_002.jpg)\n\n如果一个预测方法对于\
  \ $X \\times f(X)$ 上所有的联合分布都是一致的（相应的强一致的），则称其为*通用一致预测方法*（相应地*通用强一致预测方法*）。\n\n##\
  \ 8.4 一致与通用一致的分类器\n\n关于一致性和通用一致性，泛而言以及针对各种特定方法已有许多研究。我们这里紧随 Devroye 等人 (1996) 的书籍，以及\
  \ Biau 等人 (2008) 和 Biau 与 Devroye (2010) 的论文，在此对*二分类*分类器进行总结。\n\n集合 $R$ 的*直径*是 $R$\
  \ 中任意两点之间欧几里得距离的上确界：\n\n```\ndiam R = sup_{r,s \\in R} |r-s|\n```\n\n![numbered\
  \ Display Equation](img/c08_M009.gif)\n\n### 定理 8.1 划分分类器的一致性。\n\n设特征 $X \\in \\\
  mathbb{R}^m$。设一种二分类方法通过将 $\\mathbb{R}^m$ 划若干不相交的区域来操作，对于任意点 $x \\in \\mathbb{R}^m$，在\
  \ 0–1 损失下，预测包含 $x$ 的区域 $R(x)$ 中训练数据的多数类（以以固定但任意的方式打破平局）。当 $n \\to \\infty$ 时，如果该分类方法对于\
  \ $P(X, Y)$ 是一致的：\n\n```\ndiam R(X) \\to P = 0\n```\n\n![numbered Display Equation](img/c08_M0010.gif)\n\
  \n并且\n\n```\nthe number of training data in R(X) \\to P = \\infty\n```\n\n![numbered\
  \ Display Equation](img/c08_M0011.gif)\n\n直方图分类器（第 4.4.5 节）和分类树（第 4.8 节）是适用于该定理的分类器示例。\n\
  \n\n\n\n`立方直方图分类器`是将 $R^m$ 划分为边长为 $h$ 的立方体，并且对于任意点 $x \\in R^m$，它通过预测包含 $x$ 的立方体\
  \ $R(x)$ 中训练数据的多数类来进行，并以一种固定但任意的方式处理平局。在后续由定理 8.1 导出的下一个定理中，带宽（边长）$h = h(n)$ 是关于训练数据数量\
  \ $n$ 的函数。\n\n**定理 8.2 立方直方图分类器的通用一致性。** *当 $n \\to \\infty$ 时，如果 $h(n) \\to 0$\
  \ 且 $n h(n)^m \\to \\infty$，则立方直方图分类器具有通用一致性。*\n\n`加权平均分类器`对任意 $x \\in R^m$ 和任意训练点\
  \ $x[i]$ ($i = 1, \\dots, n$ ) 分配一个权重 $w(x, x[i])$。在点 $x \\in R^m$ 处，它预测使得该类别权重之和最大的类别\
  \ $c$，即它预测：\n\n$$\n\\text{argmax}_{c \\in \\{1, \\dots, C\\}} \\sum_{i=1}^n [y_i\
  \ = c] w(x, x[i])\n$$\n\n例如，`k`-最近邻分类器就是一种加权平均分类器，其权重为：\n\n$$\nw(x, x[i]) = \\begin{cases}\
  \ 1 & \\text{如果 } x[i] \\text{ 是距离 } x \\text{ 最近的 } k \\text{ 个训练点之一 \\\\ 0 & \\\
  text{否则} \\end{cases}\n$$\n\n**定理 8.3 加权平均分类器的一致性 (Stone)。** *在关于 $X$ 的分布和权重 $w(X,\
  \ x[i]), i = 1, \\dots, n$ 的以下三个条件下，加权平均分类器：*\n\n1. 存在常数 $\\alpha$，使得对于每个可测函数 $g$，$E[g(X)]\
  \ < \\epsilon$ 意味着 $E[\\sum_{i=1}^n w(X, x[i]) f(x[i])] < \\alpha E[g(X)]$，\n\n\
  2. 对于所有 $\\epsilon > 0$，$\\lim_{n \\to \\infty} E[\\sum_{i=1}^n w(X, x[i]) [|X -\
  \ x[i]| \\ge \\epsilon]] = 0$，\n\n3. $\\lim_{n \\to \\infty} E[\\max_{i=1, \\dots,\
  \ n} w(X, x[i])] = 0$。\n\n定理 8.3 意味着在特定条件下，`k`-最近邻分类器具有通用一致性。\n\n\n\n\n## 定理 8.4\
  \ *k*-最近邻分类器的通用一致性 (Stone)。 \n\n*当 *n* $\\to \\infty$ 时，*k* $\\to \\infty$ 且 <math\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c08\\_ILM0020.gif\"><mrow><mfrac><mi>k</mi><mi>n</mi></mfrac><mo>&#x2192;</mo><mn>0</mn></mrow></math>![](img/c08_ILM0020.gif)\
  \ ，则 **k*-最近邻分类器具有通用一致性。*\n\n基于参数化模型的似然方法是一致的，前提是模型假设是正确的，并且使用了模型参数的一致估计器。\n\n##\
  \ 定理 8.5 带有插件参数估计的参数化似然分类器的一致性。*设 $P(*Y* | *X*) = P(*Y* | *X*, $\\theta)$ 是特征向量\
  \ *X* 和参数向量 $\\theta$ 的连续函数。如果 $P(*Y* | *X*, \\theta)$ 是 *X* 的连续函数且 <math xmlns:wiley=\"\
  http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c08\\_ILM0021.gif\"><mrow><msub><mover accent=\"true\"><mi>&#x03b8;</mi><mo>^</mo></mover><mi>n</mi></msub><mfrac\
  \ linethickness=\"0pt\"><mi mathvariant=\"normal\">P</mi><mo>&#x2192;</mo></mfrac><mi>&#x03b8;</mi></mrow></math>![](img/c08_ILM0021.gif)\
  \ ，那么从 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c08\\_ILM0022.gif\"><mrow><mi mathvariant=\"normal\">P</mi><mo>(</mo><mi>Y</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo></mo><mover\
  \ accent=\"true\"><mi>&#x03b8;</mi><mo>^</mo></mover><mo>)</mo></mrow></math>![](img/c08_ILM0022.gif)\
  \ 构建的似然分类器是一致的。*\n\n已知某些分类器*不是*通用一致的。例如，如果 *k* 距离 $\\infty$ 有界，或者当 *n* $\\to \\\
  infty$ 时， <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c08\\_ILM0023.gif\"><mfrac><mi>k</mi><mi>n</mi></mfrac></math>![](img/c08_ILM0023.gif)\
  \ 距离 0 有界，则 *k*-最近邻分类器不是通用一致的（Devroye et al., 1996, Exercise 11.1）。随机森林已知也不是通用一致的，尽管存在某些通用一致的袋装分类器\
  \ Biau et al. (2008)。\n\n## 8.5 指向渐近性的收敛不是均匀的且可能很缓慢\n\n以下两个定理调节了前一节带来的任何乐观情绪。第一个说，对于每种分类方法和每种数据规模，存在某种联合分布，使得我们距离渐近状态（Asymptopia）仍然任意远。第二个说，存在某种联合分布，使得接近渐近状态的速度是任意缓慢的。\n\
  \n## 定理 8.6 每种方法在某些简单问题上表现糟糕 (Devroye)。*在 0–1 损失下，对于任何 $\\epsilon > 0$、任何整数 *n*\
  \ 和任何二分类方法，存在某种联合分布，使得我们距离渐近状态仍然任意远。第二个说，存在某种联合分布，使得接近渐近状态的速度是任意缓慢的。*\n\n## 定理 8.7\
  \ 指向渐近状态的收敛是任意缓慢的 (Devroye)。*设 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c08\\_ILM0023.gif\"><mfrac><mi>k</mi><mi>n</mi></mfrac></math>![](img/c08_ILM0023.gif)\
  \ 为整数序列，使得当 $n$ $\\to \\infty$ 时，$k/n \\to 0$ 且 $k \\to \\infty$。存在某种联合分布，使得对于所有的\
  \ $n$，*k*-最近邻分类器的风险都大于某个 $\\epsilon$。*\n\n\n\n\n\n假设数据 `x[1]`, …, `x[n]` 采样自一个高斯混合模型。也就是说，假设数据采样自一个分布，其密度函数\
  \ `P(x)` 形式如下：\n\n```\nP(x) = \\sum_{j=1}^{J} w_j \\phi(x | \\mu_j, \\Sigma_j)\n\
  ```\n\n![numbered Display Equation](img/c09_M0001.gif)\n\n其中 `φ(x | μ, Σ)` 表示均值为\
  \ `μ` 协方差矩阵为 `Σ`的高斯密度函数，`w[1]`， …,`w[J]` 是非负权重且满足 `w[1] + ⋅⋅⋅ + w[J] = 1`，`J` >\
  \ 0 是假设数据中存在的聚类数量。在基于似然的分类器背景下，第 4.4.3 节讨论了高斯混合模型。拟合高斯混合模型（即为给定的 `J` 值估计参数 `μ[1]`,\
  \ …, `μ[J]`, `Σ[1]`, …, `Σ[J]`, `w[1]`, …, `w[J]`）是通过第 10.7 节中描述的期望极大化算法完成的。选择此类模型（即选择\
  \ `J`）的方法在第 7 章的多个章节中有所描述：请特别参阅第 7.7 节中的贝叶斯信息准则 (BIC)。\n\n拟合的高斯混合模型提供了一种“软性”或“模糊”聚类规则，用混合分量\
  \ `j` 对数据点 `x[i]` 的*责任* `γ[ij]` 来表示：\n\n```\ngamma_{ij} = \\frac{w_j \\phi(x_i |\
  \ \\mu_j, \\Sigma_j)}{\\sum_{k=1}^{J} w_k \\phi(x_i | \\mu_k, \\Sigma_k)}\n```\n\
  \n![numbered Display Equation](img/c09_M0002.gif)\n\n拟合的均值 `μ_1`, `μ_J` 是*聚类中心*。使用高斯混合模型进行聚类的优点是：它提供了关于哪些数据点被分配到聚类的确定性度量，并且它是一个可解释的统计模型。缺点是期望极大化算法往往收敛较慢，特别是当\
  \ `m` 很大且协方差矩阵 `Σ[j]` 未受约束时。在某些情况下，使用其他分布代替高斯分布可能有用：例如，使用 Student `t` 分布可以对离群值具有鲁棒性。\n\
  \n## 9.2 k-Means\n\n`k-means 算法`从一组初始的假设聚类中心 `μ_1`, `μ_k` 开始（例如，通过不放回地随机采样数据 `x[1]`,\
  \ …, `x[n]` `k` 次获得）。然后，`k-means 算法` 迭代图 9.1 所示的两个步骤。当聚类分配在迭代之间不再变化时，算法终止。\n\n![Figure\
  \ 9.1 k-means clustering algorithm iterates two steps.](img/c09f001.jpg)\n\n`k-means\
  \ 算法`近似拟合高斯混合模型，通过放弃混合模型的灵活性（软聚类分配和可变协方差矩阵）来换取速度。图 9.1 所示的步骤 (1) 是期望极大化算法中期望步骤的近似，步骤\
  \ (2) 是极大化步骤的近似（参见第 10.7 节）。从几何角度上看，在步骤 (2)中使用均值隐含地将 `k-means 算法` 与（平方）欧距离联系起来。这是因为\
  \ `R^m` 中一组数据 `S` 的样本均值是使 `z` 与 `S` 中每个点之间的平方偏差和最小的点 `z`。因此，步骤 (2) 等于于\n\n```\n\\\
  mu_j = argmin_{z \\in R^m} \\sum_{x_i \\in \\text{cluster } j} |x_i - z|²\n```\n\
  \n![numbered Display Equation](img/c09_M0003.gif)\n\n## 9.3 通过密度估计中的众值搜索进行聚类\n\n\
  \n\n\n\n聚类数据 `x[1]`, …, `x[n]` 可以等同于在绘制这些数据的 $X$ 上未知概率分布的密度函数 `P(x)` 中寻找众数（局部极大值）的问题（当采用这种方法时，假设密度函数存在）。密度函数\
  \ `P(x)` 可以通过多种方式进行估计，既可以通过参数方法（如高斯混合模型），也可以通过非参数方法（如核密度估计）：在分类似然方法的背景下，第 4.4 节`\
  \ 中找到众数，并跟踪算法终止时的局部极大值。在密度估计中通过模式寻优进行聚类的算法见图 9.2。\n\n![图 9.2 一种用的模式寻优聚类算法。](img/c09f002.jpg)\n\
  \n图 9.2 一通用的模式寻优聚类算法。\n\n通过模式寻优进行聚类对所使用的优化算法参数可能敏感，而且成本很高。请注意，对于聚类目的而言，优化算法终止于局部而非全局最优的倾向是一个理想的特征：这会影响优化器的选择及其参数的选择。可以通过提前终止优化算法，并结合放宽步骤\
  \ (3) 中“不同”的标准来降低计算成本。\n\n## 9.4 使用分类器进行聚类\n\n“如果你能分类，你就能聚类”——偶尔能听到这种说法。解释这一陈述的一种方法是使用二分类器来构建密度估计的技巧，然后可以像第\
  \ 9.3 节 那样用于聚类。给定数据 `x[1]`, …, `x[n]`，并让这些未标记数据全部标记为类 1。我们的目标是估计绘制数据的分布的密度函数：我们将该密度函数写为\
  \ `P(x | Y = 1)`。\n\n该技巧是从具有已知密度函数 `P(x | Y = 2)` 的概率分布中随机抽取，合成所有标记为类 2 的数据 $x_{n+1},\
  \ \\dots, x_{n^\\star}$。在标记数据上训练二分类算法：\n\n```\n((x_1, 1), ..., (x_n, 1), (x_{n+1},\
  \ 2), ..., (x_{n^\\star}, 2))\n```\n以产生每个类后验分布的估计 [1]：\n\n```\nP(Y=1|x), P(Y=2|x)\n\
  ```\n这可以在任何点 $x \\in X$ 处进行评估。由于\n\n```\nP(Y=1|x) = \\frac{P(x|Y=1)P(Y=1)}{P(x)}\
  \ = \\frac{P(x|Y=1)P(Y=1)}{P(x|Y=1)P(Y=1) + P(x|Y=2)P(Y=2)}\n```\n\n<a href=\"#c09-disp-0006-1\"\
  >(9.1)</a>![编号显示方程](img/c09_M0006.gif)\n\n\n\n\n求解 `P(x | Y = 1)` 得到\n\n```\nP(x\
  \ | Y = 1) = P(x | Y = 2) * P(Y = 1 | X = x) / P(Y = 2 | X = x) * P(Y = 2) / P(Y\
  \ = 1)\n```\n\n![numbered Display Equation](img/c09_M0007.gif)\n\n类别 2 数据的密度是已知的，类别标签的条件概率由训练好的分类器估计，而类别标签边际概率之比根据构造定义为\
  \ `n*/n`。（images/c09_ILM0009.gif) 这产生了密度估计：\n\n```\nP^(x | Y = 1) = P(x | Y = 2)\
  \ * P(Y = 1 | X = x) / P(Y = 2 | X = x) * P(Y = 2) / P(Y = 1)\n```\n(images/c09_M0008.gif)\n\
  \n### 9.5 不相似性\n\n聚类需要对数据之间的某种距离有一个概念。这通常以*不相似性*（dissimilarity）的形式出现，这是一个函数\n\n\
  ```\nd: X -> R\n```\n(images/c09_ILM010.gif) 使得对于所有 `x ∈ X` 有 `d(x, x) = 0`（images/c09_ILM011.gif），且对于所有\
  \ `w ∈ X` 有 `d(w, x) = d(x, w)`。对于特定的数据集，*不相似性矩阵*是\n\n\n\n```\n[d(x_i, x_j)], i,j=1n\n\
  ```\n(images/c09_M0009.gif)\n\n![numbered Display Equation](img/c09_M0009.gif)\n\
