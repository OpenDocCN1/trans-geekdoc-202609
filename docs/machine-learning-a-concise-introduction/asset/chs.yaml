  \n*我们看到*\n\n\n\n\n```\nR(f^\\tau) = EX[R(f^\\tau|X)]\n= \\int_{-\\infty}^{\\tau}\
  \ L(2,1) e^{-\\frac{1}{2}(x-\\mu_2)²} (1-p) S^{S-1} \\frac{1}{\\sqrt{2\\pi}} Sdx\n\
  + \\int_{\\tau}^{\\infty} L(1,2) e^{-\\frac{1}{2}(x-\\mu_1)²} p S^{S-1} \\frac{1}{\\\
  sqrt{2\\pi}} Sdx\n= L(2,1)(1-p)P(Z_2 \\le \\tau) + L(1,2)pP(Z_1 > \\tau)\n= L(2,1)(1-p)P(Z_2\
  \ \\le \\tau) + L(1,2)pP(Z_1 > \\tau),\n```\n其中 $Z_1 \\sim N(\\mu_1, 1)$ 且 $Z_2\
  \ \\sim N(\\mu_2, 1)$。\n\n### 4. 对 C 部分的结果关于 $\\tau$ 求导，\n\n```\n\\frac{d}{d\\tau}R(f^\\\
  tau) = L(2,1)(1-p)\\frac{1}{\\sqrt{2\\pi}} e^{-\\frac{1}{2}(\\tau-\\mu_2)²} - L(1,2)p\\\
  frac{1}{\\sqrt{2\\pi}} e^{-\\frac{1}{2}(\\tau-\\mu_1)²}.\n```\n\n将此式置于零并解出 $\\tau$，可得到一个唯一的临界点，\n\
  \n```\n\\tau = \\frac{\\mu_1+\\mu_2}{2} + \\frac{1}{\\mu_2-\\mu_1} \\log\\left(\\\
  frac{L(1,2)}{L(2,1)} \\cdot \\frac{p}{1-p}\\right).\n```\n\n\n\n导数 $\\frac{d}{d\\\
  tau}R(f^\\tau)$ 在 $\\tau \\to -\\infty$ 时从下方趋于零，在 $\\tau \\to \\infty$ 时从上方趋于零，因此\
  \ $\\frac{d}{d\\tau}R(f^\\tau)$ 在唯一临界点的左侧为负，右侧为正，所以它是一个最小值。注意，当 $\\mu*[1]$ 从左侧趋于\
  \ $\\mu*[2]$ 时，根据对数项的符号，临界点趋于 $\\pm \\infty$。\n\n5. 如果 $L(1, 2) = L(2, 1)$，则临界点\
  \ $\\tau = \\frac{\\frac{\\mu_1 + \\mu_2}{2} + \\frac{1}{\\mu_2 - \\mu_1}\\log(\\\
  frac{p}{1-p})}$；如果此时 $p=1/2$，则临界点 $\\tau = \\frac{\\mu_1 + \\mu_2}{2}$，这是 $\\mu[1]$\
  \ 和 $\\mu[2]$ 之间的中点。\n\n**练习 2.4** 考虑以下算法：给定一个训练数据集 $\\{(x*[1], y*[1]), \\dots,\
  \ (x[n], y[n])\\}$ 和一个待分类的特征向量 $x$，如果对于任意 $i$ 有 $x = x[i]$，则预测 $y[i]$，否则从类别标签集合\
  \ $\\{1, \\dots, C\\}$ 中均匀随机抽取预测结果。该算法的训练风险为零，实际风险为 $\\frac{C-1}{C}$。\n\n**练习 2.6**\
