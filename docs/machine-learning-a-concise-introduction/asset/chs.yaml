  inline\" location=\"image\\_n/c07\\_ILM0114.gif\"><mfrac><mi> TSS </mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfrac></math>![](img/c07_ILM0114.gif)是\
