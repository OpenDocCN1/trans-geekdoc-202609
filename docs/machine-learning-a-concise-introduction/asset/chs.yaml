  \ *假设* (`x[1]`, `y[1]`), …, (`x[n]`, `y[n]`) *是来自联合分布* (*X*) 的 *n 个独立样本，其中对于每个类\
  \ c* = 1, …, *C*，*特征向量*\n\n```\nX | Y = c \\sim N(\\mu_c, \\Sigma_c)\n```\n\n\n\n\
  \n证明：参数 $\\mu^*[1], \\dots, \\mu^*[C], \\Sigma[1], \\dots, \\Sigma^*[C]$ 在给定类别标签\
  \ $y^*[1], \\dots, y^*[n]$ 的条件下使得特征向量 $x^*[1], \\dots, x[n]$ 的似然极大，公式为：\n\n```\n\
  \\mu^c = \\frac{1}{nc} \\sum_{i=1, y_i=c}^n x_i\n```\n(images/c04_M0023.gif)\n\n\
  以及\n\n```\n\\Sigma^c = \\frac{1}{nc} \\sum_{i=1, y_i=c}^n (x_i - \\mu^c)(x_i - \\\
  mu^c)^T\n```\n(images/c04_M0024.gif)\n\n其中 $n[c]$ 是类别 $c$ 的训练数据数量。\n\n提示：\n1) 最大化对数似然等同于最大化似然；\n\
  2) 使用矩阵恒等式（对于任意向量 $v$ 和任意可逆对称矩阵 $A$）：\n\n```\n\\frac{\\partial}{\\partial v} v^T\
  \ w = w\n```\n(images/c04_ILM026.gif)\n\n```\n\\frac{\\partial}{\\partial v} v^T\
  \ Av = 2Av\n```\n(images/c04_ILM027.gif)\n\n```\n\\frac{\\partial}{\\partial A}\
  \ \\log|A| = A^{-1}\n```\n(images/c04_ILM028.gif)\n\n以及\n\n```\n\\frac{\\partial}{\\\
  partial A} v^T A^{-1} v = -A^{-1}vv^T A^{-1}\n```\n(images/c04_ILM0029.gif)\n\n\n\
  \n\n\n每个类别的参数总数为 `m`（对应于长度为 `m` 的向量 $\\mu^c$(images/c04_ILM0030.gif)）加上 $\\frac{m+m(m-1)}{2}$（对应\
  \ `m` × `m` 的对称矩阵 $\\Sigma^c$(images/c04_ILM0031.gif）），当 `m` 很大时，这个数字非常大。\n\n如果类别\
  \ `c` 相对稀疏，可能会导致估计的协方差矩阵 $\\Sigma^c$(images/c04_ILM0033.gif) 是奇异的。有时通过将 $\\Sigma^c$\
  \ 替换为 $\\Sigma^c$(images/c04_ILM0034.gif) 和在假设所有类别具有相同协方差的情况下估计的协方差矩阵 $\\Sigma^c$(images/c04_ILM0036.gif)\
  \ 的凸组合来避免这一问题（见下文 $\\Sigma^c$(images/c04_ILM0037.gif) 的定义）。\n\n```\n\\Sigma^c =\
  \ \\sum_{c=1}^{C} \\frac{n_c}{n} \\Sigma^c\n```\n\n对于某些参数 $0 \\le \\alpha \\le 1$，所示![编号显示公式](img/c04_M0025.gif)。这种技术被称为正则化判别分析。有时通过假设每个类别的协方差矩阵是对角矩阵，可以将每个类的参数数量减少到\
  \ $2m$。\n\n### 4.4.2 线性判别分析\n\n线性判别分析与二次判别分析相同，不同在于假设类别密度的协方差矩阵是相等（即上述 $\\alpha\
  \ = 0$ 的正则化判别分析）。估计的类别边界是分段线性的，公共协方差矩阵 $\\Sigma$ 可以从所有数据中估计。图 4.4 展示了基于图 4.1 数据训练的线性判别分析所得的估计密度\
  \ $P(X|Y=c)$$(images/c04_ILM0038.gif)和类别预测。\n\n![图 4.4 基于图 4.1 数据训练的线性判别分析 (LDA)\
  \ 所估计的类别密度（左）和分类决策（右）。估计的类别边界是分段线性的。估计的类别均值用黑点表示，包含 50%概率质量的估计密度等高线由虚线表示（等高线的获取见附录\
  \ C）。注意所有等高线的形状相同，仅位置不同，与 QDA（图 4.3）不同。白色曲线显示了贝斯类边界。LDA 的估计风险为 0.229。](img/c04f004.jpg)\n\
