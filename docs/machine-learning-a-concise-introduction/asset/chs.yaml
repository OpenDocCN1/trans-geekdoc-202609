  \ `I` 索引的特征在训练数据上训练的分类器（注意，如果 `I` 为空，则 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0118.gif\"><msub><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover><mi>I</mi></msub></math>![](img/c07_ILM0118.gif)\
  \ 预测所有数据为同一类）。*逐步模型选择*泛指任何用于搜索集合 `{1, …, *m*}` 的子集的离散优化算法，用以找到一个子集 `I`，使得 <math\
