  block\" location=\"image\\_n/bapp02_M110.gif\"><mrow><msub><mi>&#x03bb;</mi><mi>j</mi></msub><msub><mrow><mo>(</mo><mi\
  \ mathvariant=\"bold\">Q</mi><msup><mrow/><mi mathvariant=\"normal\">T</mi></msup><mi>z</mi><mo>)</mo></mrow><mi>j</mi></msub><mo>=</mo><mn>0</mn><mspace\
  \ width=\"2.em\"/><mi> for </mi><mspace width=\"4pt\"/><mi>j</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#x22ef;</mo><mo>,</mo><mi>h</mi><mo>.</mrow></math></displayedItem>\
  \ ![numbered Display Equation](img/110.gif)\n\n\n\n\n与 (2) 相同，使 `HX_z` 的样本方差最大的\
  \ `z` 等于找到使以下表达式最大的 `z`：\n\n```\n\\sum_{i=1}^{m} \\lambda_i (Q^T z)_i²\n```\n（注：上述公式对应\
  \ image_n/bapp02_M0111.gif）\n![numbered Display Equation](img/bapp02_M0111.gif)\n\
  \n如果 `HX_Q[j]` 和 `HX_z` 之间的样本协方差对于 `j = 1, \\dots, h` 为零，则最大化的表达式变为：\n\n```\n\\\
  sum_{i=h+1}^{m} \\lambda_i (Q^T z)_i².\n```\n（注：上述公式对应 image_n/bapp02_M0112.gif）\n\
  ![numbered Display Equation](img/bapp02_M0112.gif)\n\n关于 `z = Q[h+1]` 使该表达式最大的论点（无论\
  \ `λ[h+1] > 0` 还是 `λ[h+1] = 0`）与 (2) 中 `z = Q[1]` 的论点相同。\n\n**练习题 11.15** 对于部分 (A)，令\
  \ `c_\\lambda = h(\\theta)` 并令 `tilde{\\theta}` 为受约束优化问题的解：\n\n```\nminimize over\
  \ theta: g(theta)\nsubject to: h(theta) <= c_\\lambda.\n```\n（注：上述公式对应 image_n/bapp02_M0113.gif）\n\
  \n由于 `h(\\tilde{\\theta}) <= h(\\theta)`，如果 `g(\\tilde{\\theta}) < g(\\theta)`，则：\n\
  \n```\ng(\\tilde{\\theta}) + \\lambda h(\\tilde{\\theta}) < g(\\theta) + \\lambda\
  \ h(\\theta),\n```\n（注：上述公式对应 image_n/bapp02_M0114.gif）\n![numbered Display Equation](img/bapp02_M0114.gif)\n\
  \n\n\n\n\n这与 $\\theta²$ 最小化 $g(\\theta²) + \\lambda h(\\theta²)$ 的事实相矛盾。因此 $g(\\\
  tilde{\\theta}) \\geq g(\\theta²)$，也就是说 $\\theta²$ 是约束问题的解。对于部分 (B)，令 $\\theta²$\
  \ 为该约束优化问题的解：\n```\n\\text{minimize } g(\\theta²)\n\\text{subject to } h(\\theta²)\
  \ \\geq c\n```\n如果该约束优化问题有多个解，则取 $\\theta²$ 使得 $h(\\theta²)$ 最小。如果 $h(\\theta²)\
  \ < c$，则 $\\theta²$ 是 $g$ 的局部最小值。由于 $g$ 是凸函数，因此 $\\theta²$ 是 $g$ 的全局最小值，从而 $\\theta²$\
  \ 是以下无约束优化问题的解：\n\n```\n\\text{minimize } g(\\theta²) + \\lambda h(\\theta²)\n```\n\
  对应的取值为 $c=0$。如果 $h(\\theta²) = c$，则 $\\theta²$ 是该约束优化问题的解。\n\n\n\n\n令 `∂H = {θ:\
  \ h(θ) = c}` 为集合 `H = {θ: h(θ) ⩽ c}` 的边界。在 `∂H` 的每一点 `θ` 上，梯度 `∇h(θ)` 都与 `∂H` 正交并指向\
  \ `H` 的外部（因为当 `θ` 从 `H = {θ: h(θ) ⩽ c}` 内部跨越边界 `∂H = {θ: h(θ) = c}` 到 `H` 的补集 `{θ:\
  \ h(θ) > c}` 时，`h(θ)` 会增大）。特别是 `∇h(θ^)` 在 `θ^` 处正交 `H`![](img/bapp02_ILM0081.gif)。同样，`∇g(θ^)`\
  \ 在 `θ^` 处正交 `H`![](img/bapp02_ILM0083.gif)，因为如果不是这样，在 `H` 内部的微移动将减少 `g` 的值，那么 `θ^`\
  \ 将不会是约束优化问题的解。也就是说，存在一个标量 `λ` 使得：\n\n```\n∇g(θ^) = λ∇h(θ^).\n```\n![numbered Display\
  \ Equation](img/bapp02_M0118.gif)\n\n令 `∂G = {θ: g(θ) = c}` 为集合 `G = {θ: g(θ) ⩽\
  \ c}` 的边界![](img/bapp02_ILM0085.gif)。`G` 也是一个凸集。在 `∂G` 的每一点 `θ \\in ∂G` 上，梯度 `∇g`\
  \ 都与 `∂G` 正交并指向 `G` 的外部。`H` 和 `G` 的内部交为空，因为如果存在则存在一个点 `θ` 使得 `g(θ) < θ^`![](img/bapp02_ILM0087.gif)\
  \ 且 `h(θ)` 将不是约束优化问题的解。因此，在同时属于 `∂H` 和 `∂G` 的点 `θ` 处，梯度 `∇g(θ)` 和 `∇h(θ)`![](img/bapp02_ILM090.gif)\
  \ 指向相反，即 `λ < 0`。令 `λc = -λ`。则 `λc geqslant 0` 且：\n\n```\n∇g(θ) + λc∇h(θ) = 0.\n\
  ```\n![numbered Display Equation](img/bapp02_M0119.gif)\n\n\n\n由于 `λ[c]` ⩾ 0，`g(θ)\
  \ + λ[c]h(θ)` 是一个凸函数。由于 `∇(g(θ) + λ[c]h(θ))|_{θ=θ^} = 0` 是 `g(θ) + λ[c]h(θ)` 的局部最小值，因此也是全局最小值。也就是说，`θ^`\
  \ 是该无约束优化问题的解。\n\n### 练习 12.1\n针对部分 (A)，\n\n```\n() = E([])\n(1,2) = (1,2) = (1,2)\
  \ + (2,1) + (2,1) = (2,1)\n (1,2) = (1,2) = (1,2) = (2,1) + (2,1) = (2,1) = (2,2)\n\
  \ (1,2) = (1,2) = (1,2) + (2,1) = (2,2) = (2,2) = (2,2) = (1,2) = (1,2) = S(θ) ≥\
  \ θ = 2 = (222).\n```\n\n针对部分 (B)，我们应用部分 (A) 来解决\n\n\n\n\n```\n0 = \\frac{d}{d\\\
  tau}()\n= (1,2)\\frac{d}{d\\tau}(S(\\tau) \\ge \\tau = 1)(==1) + (2,1)\\frac{d}{d\\\
  tau}(1-(S(\\tau) \\ge \\tau = 2))(=2)\n= (1,2)\\frac{d}{d\\tau}(1-(S(\\tau) \\le\
  \ \\tau = 1))(=1) + (2,1)\\frac{d}{d\\tau}(S(\\tau) < \\tau = 2)(=2)\n= (1,2)(1-(\\\
  tau=1))(=1) + (2,1)(\\tau=2)=2.\n```\n![](img/bapp02_M021.gif)\n\n将损失项移到一侧得：\n```\n\
  \\frac{L(2,1)}{L(1,2)} = \\frac{(\\tau=2)}{(\\tau=1/2)}.\n```\n\n**练习 12.2** 由于\
  \ `F` 是累积分布函数，$\\lim_{s \\to -\\infty}F(s) = 0$ 且 $\\lim_{s \\to \\infty}F(s) =\
  \ 1$，且由于 `F` 是连续且严格递增的，它是从 $(-\\infty, \\infty)$ 到 $(0,1)$ 的一一（因此可逆）且满映射。对于任何 `u`\
  \ $\\in (0, 1)$,\n```\n(U \\le u) = (F(S) \\le u) = (S \\le F^{-1}(u)) = F(F^{-1}(u))\
  \ = u.\n```\n![](img/bapp02_M0123.gif)\n\n因此 `U` 在 (0, 1) 上服从均匀分布。如果 $F(s) = (S\
  \ \\ge s)$，结果也不会改变![](img/bapp02_ILM0095.gif)(也就是说，`U` = `F(S)` 仍然在 (0, 1) 上服从均匀分布)。\n\
  \n\n\n\n## 练习 12.3\n\n通过应用练习 12.2，`U*[1]`，`U*[2]` = `h(`S*[1]`, `S*[2])` 的分布在 (0,\
  \ 1) × (0, 1) 上是均匀的，因为每个坐标在 (0, 1) 上都是均匀分布的且这两个坐标是相互独立的。根据均匀分布的定义，ROC 曲线下的面积是点 `U*[1]`，`U*[2]`\
  \ 位于 ROC 曲线下方的概率；由于 `h` 是单射的，这就是 `h` 将 `S*[1]`，`S*[2]` 映射到 ROC 曲线下方某点的概率。现在，`h`\
  \ 将点 `s*[1]`，`s*[2]` 映射到 ROC 曲线下方，充当且仅当点 `((S1 ≥ s1), (S2 ≥ s2))` 位于点 `((S1 ≥ s1),\
  \ (S2 ≥ s1))` 下方，即当且仅当 `(S2 ≥ s2) ≤ (S2 ≥ s1)`。由于 `(S2 ≥ s)` 是 `s` 的递减函数，`h` 将点\
  \ `s*[1]`，`s*[2]` 映射到 ROC 曲线下方当且仅当 `s*[2] ≥ s*[1]`。\n\n## 练习 12.7\n\n令 `E[i]` 为在原假设为假的\
  \ `T − T[0]` 次测试中，第 `i` 次测试错误地拒绝原假设的事件。根据布尔尔不等式（Boole’s inequality），至少有一个测试错误拒绝原假设的概率为：\n\
  \n```\np(s) ≤ P(E1) + ... + P(ET-T0) = (T-T0).\n```\n\n对于 0 < α < 1，方程 `p(s) = α`\
  \ 的解为：\n\n```\ns = α / (T-T0).\n```\n\n`T[0]` 的值是的，但由于 `p(s)` 是 `T[0]` 的递减函数，通过将\
  \ `T[0]` 替换为零得到的 `s` 值：\n\n```\ns0 = α / T,\n```\n\n提供了一个可计算的值，使得 `p(s[0]) ≤ α`。\n\
  \n# C 在正态参数与等高线椭圆之间的转换\n\n令 `Z` 为一个均值为 `μ`、协方差矩阵为 `Σ` 的 `m` 维正态随机变量。`Z` 的密度函数为：\n\
  \n```\nφ(z) = (2π)^(-m/2) |Σ|^(-1/2) exp(-1/2 (z-μ)ᵀ⁻¹(z-μ)).\n```\n\n\n\n\n\n因此密度的密度线可以写为：\n\
  \n```xml\n<displayedItem xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\"\
  \ xmlns=\"http://www.wiley.com/namespaces/wiley\" xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ id=\"bapp03-disp-0002\" type=\"mathematics\" numbered=\"no\"><math display=\"\
  block\" location=\"image\\_n/bapp03\\_M0002.gif\"><mrow><mrow><mo>{</mo><mi>z</mi><mo:</mo><mi>&#x03c6;</mi><mrow><mo>(</mo><mi>z</mi><mo>)</mo></mrow><mo>=</mo><mi>c</mi><mo>}</mo></mrow><mo>=</mo><mfenced\
  \ separators=\"\" open=\"{\" close=\"}\"><mi>z</mi><mo:</mo><mrow><mo>(</mo><mi>z</mi><mo>-</mi>&#x03bc;</mi><mo>)</mo></mrow><msup><mrow/><mi\
  \ mathvariant=\"normal\">T</mi></msup><msup><mi>&#x03a3;</mi><mrow><mo>-</mi><mn>1</mn></mrow></msup><mrow><mo>(</mo><mi>z</mi><mo>-</mi>&#x03bc;</mi><mo>)</mo></mrow><mo>=</mo><mo>-</mi><mn>2</mo><mo\
  \ form=\"prefix\">log</mo><mfenced separators=\"\" open=\"(\" close=\")\"><mi>c</mi><msup><mrow><mo>(</mo><mn>2</mn><mi>&#x03c0;</mi><mo)</mo></mrow><mfrac><mi>m</mi><mn>2</mn></mfrac></msup><msup><mrow><mo|</mo><mi>&#x03a3;</mi><mo>|</mo></mrow><mfrac><mn>1</mn><mn>2</mn></mfrac></msup></mfenced></mfenced><mo>,</mo></mrow></math></displayedItem>\n\
  ```\n\n![numbered/000000.)\n\n因此 `φ`(`z`)的等值线是 (`z` − `μ`)^TΣ^(− 1)(`z` − `μ`)的等值线。\n\
  \n根据一个著名的定理，随机变量 `Z` − `μ`)^TΣ^(− 1)(`Z` − `μ`) 服从 χ²[`m`] 分布。因此，以 `μ` 为中心、由密度的等值线边界、且包含总概率质量\
  \ `ρ` 的椭圆由以下方程给出：\n\n```xml\n<displayedItem xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"\
  http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\" xmlns:wiley=\"\
  http://www.wiley.com/namespaces/wiley/wiley\" id=\"bapp03-disp-0003\" type=\"mathematics\"\
  ><math display=\"block\" location=\"image\\_n/bapp03\\_M0003.gif\"><mrow><mrow><mo>(</mo><mi>z</mi><mo>-</mi>&#x03bc;</mi><mo>)</mo></mrow><msup><mrow/><mi\
  \ mathvariant=\"normal\">T</mi></msup><msup><mi>&#x03a3;</mi><mrow><mo>-</mi><mn>1</mn></mrow></msup><mrow><mo>(</mo><mi>z</mi><mo>-</mi>&#x03bc;</mi><mo>)</mo></mrow><mo>=</mo><msup><mi>k</mi><mn>2</mn></msup><mo>,</mo></mrow></math></displayedItem>\n\
  ```\n\n(C.1) ![numbered/000000.)\n\n其中 `k`² 是 χ²[`m`] 随机变量 `ρ`-分位数。\n\n## C.1 参数到轴\n\
  \n给定 `ρ`（以及相应的 `k`）和协方差矩阵 `Σ`，计算椭圆的轴，令：\n\n```xml\n<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/bapp03\\_ILM0001.gif\"><mrow><mi>&#x039b;</mi><mo>=</mo><mi>\
  \ diag </mi><momomo><msub><mi>&#x03bb;</mi><mn>1</mn></msub><mo>mo><mo>&#x22ef;</mo><mo>,</mo><msub><mi>&#x03bb;</mi><mi>m</mi></msub><mo>)</mrow></math>\n\
  ```\n\n为 `Σ` 特征值的对角矩阵，并令 `Γ` 为对应的特征向量矩阵（列形式），使得：\n\n```xml\n<displayedItem xmlns:cms=\"\
