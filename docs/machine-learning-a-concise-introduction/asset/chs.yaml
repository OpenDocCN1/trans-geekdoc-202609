  \ adj </mi><mn>2</mn></msubsup><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mfrac><mi>\
  \ RSS </mi><mrow><mi>n</mi><mo>-</mo><mi>m</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mfrac><mi>\
  \ TSS </mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfrac></mfrac></mrow></mstyle></math></displayedItem>\n\
  \n![编号的显示方程](img/c07_M0040.gif)\n\n并且，如第 3 章所示，<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
