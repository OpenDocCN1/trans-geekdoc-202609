  \ width=\"0.166667em\"/><mfrac><mn>1</mo><mrow><mo>1</mo><momo><msup><e</mi><mo>-</mo><mi>v</mo></mo></mrow></mfrac>-</mn>1</mo>=</mo><mfrac><><><mn>1</mo><momo><msup><e</mi><mo>-</mo><mi>v</mo></mo></mrow><mrow><mn>1</mo><momo><msup><e</mi><mo>-</mo><mi>v</mo></mo></mrow></mfrac><mo>=</mo><mo\
  \ form=\"prefix\">tanh</mo><mo>(</mo><mfrac><mi>v</mi><mn>2</mn></mfrac></mo></mo>,</mo></mrow></math></displayedItem>\n\
  \n![带编号的公式](img/c04_M058.gif)\n\n它是经过平移和缩放以取 (- 1, 1) 范围内值的 sigmoid，整流线性单元 (ReLU)，<displayedItem\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" xmlns=\"\
