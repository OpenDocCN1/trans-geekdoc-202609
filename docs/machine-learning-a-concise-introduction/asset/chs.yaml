  \n\n\n\n\n处理维度灾难的方法大致可分为两类。首先是寻找从高维特征空间到低维空间的显式或隐式映射，以便保留解决给定学习问题所需的有用信息。这类方法可以简单如线性投影，也可以复杂如深层自动编码器。其次，有些方法将高维数据视为偏差-方差问题，并在模型参数的估计中引入偏差（通常通过强制这些参数的绝对值比通常情况下更小），以降低方差并产生一个低风险的近似函数\
  \ $f^x$ ![](img/c11_ILM0001.gif)。此类方法在第 3 章和第 4 章中有特定实例出现，在本章中将进行更详细、更通用的讨论。\n\n\
  ## 11.1 维度灾难\n\n本节通过一些示例来说明维度灾难，并将理论性结果留给练习题。$\\mathbb{R}^m$ 中的一个 `ball`（球体）是指距离给定点不超过某个给定距离的点的集合，即球体为：\n\
  \n```math\n{x \\in \\mathbb{R}^m : |x - c| \\le r}\n```\n\n![numbered Display Equation](img/c11_M0001.gif)\
  \ 对于某些中心 $c \\in \\mathbb{R}^m$ 和正半径 $r$。为了以后参考，半径为 $r$ 的 $m$ 维球体的体积和表面积分别为：\n\n\
  ```math\nV(m,r) = \\frac{\\pi^{m/2}r^m}{\\Gamma(\\frac{m}{2} + 1)} \\text{ and }\
  \ S(m,r) = \\frac{2\\pi^{m/2}r^{m-1}}{\\Gamma(\\frac{m}{2})}\n```\n\n![numbered\
  \ Display Equation](img/c11_M0002.gif) 其中 $\\Gamma(z) = \\int_0^\\infty t^{z-1}e^{-t}\
  \ dt$ 是伽马函数，它是阶角的通常推广：对于整数 $z \\ge 0$，$\\Gamma(z+1) = z!$。对于我们的目的，球体并没有特殊之处：它只是一个在解析上易于处理的\
  \ $m$ 维“块体”[](images/c11_ILM0004.gif)。\n\n考虑一个 `spherical shell`（球面壳）$S$，它由球体内所有距离边界在给定距离\
  \ $\\delta$ 以内的点组成（等价于，$S$ 是去除了半径为 $(1-\\delta)$ 同心球体后的单位球）：\n\n```math\nS = \\\
  {x \\in \\mathbb{R}^m : 1-\\delta < |x-c| \\le 1\\} = \\{x \\in \\mathbb{R}^m :\
  \ |x-c| \\le 1-\\delta\\}\n```\n\n![numbered Display Equation](img/c11_M0003.gif)\
  \ 距离 $\\delta$ 需要多大，才能使球面壳的体积占球体体积的给定比例——具体来说，占体积的 90%？答案是任何满足以下条件的 $\\delta$ 值：\n\
  \n```math\nV(m,1) - V(m,1-\\delta) = 0.90 \\times V(m,1),\n```\n\n![numbered Display\
  \ Equation](img/c11_M0004.gif)\n\n\n\n\n\n其为 `<displayedItem xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\"\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" id=\"c11-disp-0005\"\
  \ type=\"mathematics\" numbered=\"no\"><math display=\"block\" location=\"image\\\
  _n/c11\\_M0005.gif\"><mrow><mi>&#x03b4;</mi><mo>=</mo><mn>1</mn><mo>-</mo><msup><mrow><mo>(</mo><mn>1</mn><mo>-</mo><mn>0</mn><mo>.</mo><mn>90</mn><mo>)</mo></mrow><mfrac><mn>1</mn><mi>m</mi></mfrac></msup><mo>.</mo></mrow></math></displayedItem>`\n\
  \n![编号显示方程](img/c11_M0005.gif)\n\n`δ` 的这个值在图 11.1 和图 11.2 所示的不同维度 `m` 中给出。随着维度的增大，移除的“较小”同心球的半径变得接近原始球的半径，如图\
  \ 11.2 所示。这意味着*高维球中的几乎所有点都几乎位于边界上。*^(1)\n\n![图 11.1 在...中，单位球体积的 90% 位于距离边界 0.90\
