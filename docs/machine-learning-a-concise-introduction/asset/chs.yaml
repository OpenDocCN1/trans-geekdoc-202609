  \ |\n| 3 | 150 | 0.004459 | 0.026418 | 1.030877 |\n| 3 | 1500 | 0.004427 | 0.002672\
  \ | 1.007099 |\n| 3 | 15000 | 0.004427 | 0.000272 | 1.004700 |\n| 3 | 150000 | 0.004427\
  \ | 0.000027 | 1.004454 |\n| 0 | 15 | 0.1 | 2.81166 | 2.91166 |\n| 0 | 150 | 0.01\
  \ | 0.11805 | 1.16855 |\n| 0 | 1500 | 0.001429 | 0.01416 | 1.015790 |\n| 0 | 15000\
  \ | 0.000146 | 0.000146 | 1.000507 |\n| 0 | 150000 | 0.000014 | 0.000074 | 1.000075\
  \ |\n\n\n\n\n对于平方误差损失，`偏差-方差权衡（bias–variance trade-off）`是指最小化风险需要最小化 (5.1) 中平方偏差和方差之和：\n\
  \n```\nE_X[(f(X) - E_S f(X)]²] + E_X[Var_S f(X)]\n```\n\n![numbered Display Equation](img/c05_M0007.gif)\n\
  \n这种重要性并非一直得到认可：在统计学的早期，人们非常强调寻找方差最小且具有`zero` 偏差（即`无偏性`）的近似方法。可以将第 3.10 节中描述的岭回归看作是一种利用`偏差-方差权衡`的早期方法，它通过增加偏差来减少方差，从而产生低风险的预测。\n\
  \n## 5.2 任意损失\n\n近似方法的偏差和方差可以可以`直观地（intuitively）`扩展到具有任意损失函数的通用学习（无论是回归还是分类）：\n\n\
  *   `低偏差`意味着 \n    *   平均近似值接近真实值^(3)；\n*   `高偏差`意味着 \n    *   平均近似值远离真实值；\n   \
  \ *   近似方法的活性不足；\n    *   个体近似值与数据的适应程度不够；\n*   `低方差`意味着 \n    *   每个个体近似值都接近平均近似值；\n\
  \    *   个体近似值彼此相似；\n    *   近似方法对于其展示的数据集（在所有可能的集中）是“稳定”的；\n*   `高方差`意味着 \n   \
  \ *   个体近似值往往远离平均近似值；\n    *   个体近似值之间差异很大；\n    *   近似方法对于其展示的数据集非常敏感。\n\n对于任意损失，`偏差-方差权衡`是由\
  \ (5.1) 启发的观点，即寻找具有最小风险的近似方法涉及在最小化偏差（从而在平均范围内是正确的）和最小化方差（从而对于训练数据集的变化是稳定的的）之间取得平衡。一个由于高方差导致表现不佳的近似方法在面对数据时被称为`过拟合（over-fit）`。一个由于高偏差导致表现不佳的方法被称为`欠拟合（under-fit）`。\n\
