  \ 中抽取的样本 (`X`, `Y`)。首先，每个数据点的类别标签 `Y` 从类别标签的边际分布中抽取，该分布是集合 {1, 2, 3} 上的均匀分布（橙色、蓝色、紫色）!(images/c14_ILM0007.gif)。这在第一行完成，并存储在变量\
  \ `cls` 中。接下来，每个数据点的高斯混合成分从类条件的混合成分分布中抽取。对于每个类，它是集合 {1, 2, 3} 上的均匀分布。这在第二行完成，并存储在变量\
  \ `mix` 中（第 10.7 节中的 Z）。然后，特征向量 `X` 从具有单位协方差矩阵 `sigma` 且由类别标签和类内混合成分共同决定的均值 `mus[1+3*(cls-1),]`\
  \ 的二维高斯分布中抽取。这在第三和第四行完成，使用了 R 库 MASS 中的多元正态采样函数 `mvrnorm()`，并存储在 $n \\times (m+1)$\
  \ 矩阵 `dat` 的前两列。最后，类别标签 `Y` 存储在 `dat` 的第三列，并返回样本，对 `dat` 的行进行排序使得类别标签非递减（对 `dat`\
  \ 的行进行排序没有理由，只是为了方便视觉检查）。\n\n```R\nlibrary(MASS);\ndraw.sample = function(ndat)\
  \ {\n  cls = sample(c(1,2,3),ndat,replace=TRUE);\n  mix = sample(c(1,2,3),ndat,replace=TRUE);\n\
  \  dat = matrix(NA,ndat,3);\n  dat[,1:2] = t(apply(mus[1+3*(cls-1)+(mix-1),],1,mvrnorm,\n\
  \  n=1,Sigma=sigma));\n  dat[,3] = cls;\n  return(dat[order(dat[,3]),]);\n}\n```\n\
  \n从内到外解释 `draw.sample()` 的第四行，变量 `1+3*(cls-1)+(mix-1)` 是一个长度为 `ndat` 的向量，其坐标位于集合\
  \ {1, …, 9} 中，该向量的第 $i$ 个坐标指示第 $i$ 个特征向量将从九个高斯分布中的哪一个中抽取。变量 `mus[1+3*(cls-1)+(mix-1),]`\
  \ 是一个 `ndat \\times 2` 矩阵![](img/c14_ILM0008.gif)：第 $i$ 行是第 $i$ 个特征将抽取的高斯分布的均值。函数\
  \ `mvrnorm()` 输入均值、协方差矩阵和样本数量，并从具有给定均值和协方差的多元高斯分布中输出给定数量的样本。函数 `apply(mus[1+3*(cls-1)+(mix-1),],1,mvrnorm,n=1,Sigma=sigma)`\
  \ 对矩阵 `mus[1+3*(cls-1)+(mix-1),]` 的每一行应用 `mvrnorm()` 函数从一个具有单位协方差矩阵（`Sigma=sigma`，`sigma`\
  \ 是 2 × 2 单位矩阵）且均值等于 `mus[1+3*(cls-1)+(mix-1),]` 某行的的高斯分布中抽取一个（n=1）样本。该操作的结果将 `ndat`\
  \ 个样本存储为 $2 \\times \\text{ndat}$ 矩阵的列![](img/c14_ILM0009.gif)，因此通过 R 函数 `t()` 对结果进行转置，以处于特征向量作为行的通常形式。\n\
  \n使用 `draw.sample()` 函数分别抽取大小为 $n = 150$ 和 $n' = 50,000$![](img/c14_ILM0010.gif)\
  \ 的训练集和测试集，分别称为 `tdat` 和 `edat`，(3)。\n\n\n\n\n\n```R\nnt=150; tdat = draw.sample(nt);\n\
  ne=50000; edat = draw.sample(ne);\n```\n\n一些 R 函数要求特征向量为 R 矩阵的行，而另一些函数则要求特征向量为 R\
  \ 数据框（data frame）的行。为了提高后续代码的可读性，训练数据和评估数据的特征向量被存储在数据框 `tdatDF` 和 `edatDF` 中：\n\n\
  ```R\ntdatDF = as.data.frame(tdat[,1:2]);\nedatDF = as.data.frame(edat[,1:2]);\n\
  ```\n\n在将代码应用到其他问题时，将类别数量存储在一个变量中也是非常有用的：\n\n```R\nnc = 3;\n```\n\n测试数据（微点）、训练数据（中等大小点）和高斯均值（带有粗黑边界的大圆点）如图图\
  \ 14.1;\npar(mar=c(2,2,2,2)+0.1); idx=sample(1:ne,ne);\nplot(edat[idx,1:2],col=cols[edat[idx,3]],axes=FALSE,xlab=“,\n\
  ylab=““,pch=“.“);\npoints(tdat[,1:2],col=cols[tdat[,3]],pch=20);\npoints(tdat[,1:2]);\n\
  points(mus,col=cols[c(1,1,1,2,2,2,3,3,3)],pch=19,cex=1.5);\npoints(mus,cex=1.5,lwd=2);\n\
  ```\n\n![图 14.1 本节由 R 代码生成的测试和训练数据。数据按类别着色。测试数据以微点绘制，训练数据以带有黑色边界的中等大小点绘制，九个高斯均值以带有黑色边界的大点形式绘制。](img/c14f001.jpg)\n\
  \n图 14.1 本节由 R 代码生成的测试和训练数据。数据按类别着色。测试数据以微点绘制，训练数据以带有黑色边界的中等大小点绘制，九个高斯均值以带有黑色边界的大点绘制。\n\
  \n综而言，为第 4.3 节的示例创建训练和测试样本定义了以下 R 变量，这些变量将在整个章节中使用。\n\n| R 变量 | R 变量 | 含义 | 书中符号\
  \ |\n| :--- | :--- | :--- | :--- |\n| `nt` | 训练数据数量 | $n$ |\n| `tdat[,1:2]` | 训练特征向量\
  \ ($n \\times 2$ R 矩阵) | $x_1, \\dots, x_n$ |\n| `tdatDF` | 训练特征向量 ($n \\times 2$\
  \ R 数据框) | $x_1, \\dots, x_n$ |\n| `tdat[,3]` | 训练标签 | $y_1, \\dots, y_n$ |\n| `ne`\
  \ | 测试数据数量 | $n'$ |\n| `edat[,1:2]` | 测试特征向量 ($n' \\times 2$ R 矩阵) | $x'_1, \\dots,\
  \ x'_{n'}$ |\n| `edatDF` | 测试特征向量 ($n' \\times 2$ R 数据框) | $x'_1, \\dots, x'_{n'}$\
  \ |\n| `edat[,3]` | 测试标签 | $y'_1, \\dots, y'_{n'}$ |\n| `nc` | 类别数量 | $C$ |\n\n\
  ![编号显示公式](img/c14_M003.gif)\n\n\n\n\n\n在接下来的 R 代码中，每个方法都将应用于测试数据，生成一个包含预测类别标签的 R\
  \ 向量 `pred.class`。以下函数将测试数据的预测类别标签向量与真实标签进行比较，并报告测试风险估计值，正负一个标准差。\n\n```r\nrisk.test\
  \ = function(pred.class) {\n err = sum(as.numeric(pred.class)!=edat[,3]);\n p =\
  \ err/ne; sd = round(sqrt(p*(1-p)/ne),4); p = round(p,4);\n print(paste(“test estimate\
  \ of risk:”,p,“+/-”,sd));\n}\n```\n\n## 14.4 贝斯分类器 (第 4.1 节)\n\n在 0–1 损失下，且类别标签服从均匀先验概率分布的情况下，贝斯分类器预测特征向量\
