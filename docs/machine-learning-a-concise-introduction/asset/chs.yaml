  \n**练习 6.5** 回忆第 4.8 节中的分类树符号：`n[c]` 是类别 `c` 的训练数据数量，`n^t[c]` 是进入节点 `t` 的类别 `c`\
  \ 的训练数据数量。在叶子节点 `t` 上，分类树应用贝叶斯定理\n\n```\n\\hat{P}(Y=c|X \\in t) = \\int \\hat{P}(X\
