  normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>c</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo)</mo></mrow></math></displayedItem>\n\
  \n![带编号的公式](img/c04_M057.gif)\n\n它是指示函数的软版本 `v ≥ 0`。该激活函数在图 4.15 的左上单元格中。\n\n![图\
  \ 4.15 神经网络中使用的激活函数。](img/c04f015.jpg)\n\n神经网络中其他使用的激活函数是 `symmetric sigmoid`，<displayedItem\
