  \n在难以分离的数据上使用简单分类器的一种方法是将特征映射到高维空间，使得类别比在原始特征空间中更容易分离。例如，在 $R²$ 中使用线性分类器来分类图 4.31\
  \ 所示的数据似乎是个坏主意。然而，考虑将映射 $\\phi: R² \\to R³$ 定义为 $\\phi(x_1, x_2) = (x_1, x_2, x_1x_2)$\
  \ 应用于图 4.31 中的数据。结果如图 4.32 所示，通过观察正确的方向，可以看到类别在 $R³$ 中已变为线性可分。$R³$ 中线性分类边界在 $R²$\
  \ 中的原逆是一个椭圆，如图 4.31 中的数据上表现良好的非常简单的分类器。*\n\n\n\n\n\n图 4.31 该数据集中的两个类（橙色和紫色）在 $R²$\
  \ 中不是线性可分的![](img/c04_ILM0130.gif)，尽管它们是显式可分的（例如，浅灰色的椭圆是一个产生零训练误差的类别边界）。\n\n![图\
  \ 4.32 图 4.31 中的数据已映射到二维曲面上，使得这些类别变得是线性可分的：右侧的单元格显示这两个类可以通过一个平面分开。图 4.31 中的浅灰色椭圆是包含数据的曲面与\
  \ $R³$ 中类别分离平面的交点，并投影回 $R²$。](img/c04f032.jpg)\n\n图 4.32 图 4.31 中的数据已映射到 $R³$ 中的一个二维曲面上![](img/c04_ILM0131.gif)，使得这些类别是线性可分的：右侧的单元格显示这两个类可以通过一个平面分开。图\
  \ 4.31 中的浅灰色椭圆是包含数据的曲面与 $R³$ 中类别分离平面的交点![](img/c04_ILM0132.gif)，然后被投影回 $R²$![](img/c04_ILM0133.gif)。\n\
  \n将数据从 $R_{small}$ 映射到 $R_{big}$ 的缺点是在 $R_{big}$ 中训练分类器可能会产生昂贵的计算代价。然而，在某些情况下，有一种避免这种计算开销的技巧。例如，如果训练分类器所需的特征\
  \ $(x[i])^n[i=1]$ 中的所有信息都包含在 $n \\times n$ 的内积矩阵中\n```\nφ(x_i)^T φ(x_j)\n```![](img/c04_M012.gif)（如支持向量机的情况），则不需要计算\
  \ $(φ[i])^n$，而只需要计算 $n \\times n$ 的矩阵\n```\nφ(x_i)^T φ(x_j)\n```![](img/c04_M013.gif)\n\
  \n此外，我们甚至不需要知道 $\\phi$，我们只需要构造一个映射 $K: R^m \\times R^m \\to R$![](img/c04_ILM0137.gif)，使得存在某些\
  \ $\\phi$ 满足\n```\nK(x, w) = φ(x)^T φ(w)\n```![](img/c04_M0114.gif)\n\n\n\n\n二元函数\
  \ `K(x, w)` 具有分解形式 `K(x, w) = φ(x)^Tφ(w)`（其中 `φ` 的值域维可能是可数无限）的条件由 Mercer 定理^45（Ash,\
  \ 1965）给出。通常，我们会指定 `K`，并将 (4.9) 中的 `x[i]^Tx[j]` 替换为 `K(x[i], x[j])`。常用的核有：\n\n```math\n\
  K(x, w) = (αxw + β)δ\nK(x, w) = tanh(αxw + β)\nK(x, w) = exp(-α|x-w|2)\n```\n\n\
  ![numbered Display Equation](img/c04_M0115.gif)\n\n这些核的参数值是通过交叉验证或其他其他的风险估计方法选择的。\n\
  \n根据估计的截距参数 `θ₀` 和估计的对偶参数 `ψ`，新特征向量 `X` 的预测类别为\n\n```math\nsign(θ₀ + ∑_{i:(x_i,y_i)}\
  \ ψᵢyᵢK(x_i, X)) = a\n```\n\n使用多项式核和高斯核在图 4.1 的数据上训练的支持向量机所做的预测结果如图 4.33 所示。\n\n\
  \n\n证明如果参数 `β` = 0，则 `K(x, w) = φ(x)^Tφ(w)`，其中 `φ` 是一个将 `x = (x[1], …, x[m])` 映射到\
  \ `(m+δ-1)/δ`-维基向量的函数：\n\n```\nx_1^{k_1} x_2^{k_2} \\dots x_m^{k_m} : k_1, k_2,\
  \ \\dots, k_m \\text{ are non-negative integers}, k_1 + \\dots + k_m = \\delta.\n\
  ```\n\n![![numbered Display Equation](img/c04_M0118.gif)\n\n**提示：** 使用多式定理。\n\n\
  **练习 4.20** 证明对于高斯核，`K(x, w) = φ(x)^Tφ(w)`，其中 `φ` 是一个将 `x = (x[1], …, x[m])` 映射到无限维基向量的函数：\n\
  \n```\nx_1^{k_1} x_2^{k_2} \\dots x_m^{k_m} : k_1, k_2, \\dots, k_m \\text{ are\
  \ non-negative integers}.\n```\n\n![![numbered Display Equation](img/c04_M0119.gif)\n\
  \n### 4.9.3 近端支持向量机分类器\n\n在 1999 年至 2001 年间，实验观察发现，SVM (4.9) 的最小化问题可以在不改变分类性能的情况下，修改为：\n\
  \n```\nminimize over θ*, θ_0 and ξ:\n  1/2 |θ*|² + 1/2 |θ_0|² + 1/2 ξ²\nsubject\
  \ to:\n  y_i (θ*x_i + θ_0) = 1 - ξ_i, for all i:\n  y_i (θ*x_i + θ_0) ≥ 0.\n```\n\
  \n通过将误差度量从 1-范数更改为 2-范数，误差函数已变为凸函数，这使得二次规划变得更容易求解。!![numbered Display Equation](img/c04_M0120.gif)\
  \ 由 Fung 和 Mangasarian 引入的近端支持向量机 (PSVM) 是 SVM 的进一步扩展。\n\n等等，拟合 PSVM 非常简单。毕竟，PSVM\
  \ 解决的是一个加权最小二乘回归问题，其解可以用闭式形式写出。此外，PSVM 可以像 SVM 一样使用核化，因为偶问题仍然通过内积涉及数据（Fung and Mangasarian,\
  \ 2001）。\n\n\n\n注意，PSVM 在解释上与 SVM 有显著不同。SVM 的约束\n\n$$\ny_i(\\theta^T x_i + \\theta_0)\
  \ \\geq 1 - \\xi_i\n$$\n\n![numbered Display Equation](img/c04_M0122.gif)\n\n意味着“类别\
  \ (+ 1 或 − 1) 的数据位于超平面 $\\{v : \\theta^T v + \\theta_0 = (+1 \\text{ or } -1)\\\
  }$ 之上或其之外，![](img/c04_ILM0143.gif)，除某些误差外。”PSVM 的约束\n\n$$\ny_i(\\theta^T x_i + \\\
  theta_0) = 1 - \\xi_i\n$$\n\n![numbered Display Equation](img/c04_M0123.gif)\n\n\
  意味着“类别 (+ 1 或 − 1) 的数据位于超平面 $\\{v : \\theta^T v + \\theta_0 = (+1 \\text{ or } -1)\\\
  }$，![](img/c04_ILM0144.gif)，除某些误差外。”也就是说，一个训练好的 PSVM 是通过一对平行的超平面来近似两个类别的数据。因此，PSVM\
  \ 本质上是一种原型方法，其类别原型不是点，而是超平面。如果使用了核化，那么在该陈述中，“超平面”变为“流形”，而两个类别原型之间的平行性则于于某个高维空间中。\n\
  \n通过将 (4.12) 重写，PSVM 的解释变得更加明确：\n\n$$\n\\min_{\\theta, \\theta_0, \\xi} \\frac{1}{2}\
  \ \\|\\theta\\|² + \\frac{C}{n} \\sum_{i=1}^n \\xi_i \\quad \\text{subject to }\
  \ y_i(\\theta^T x_i + \\theta_0) \\geq 1 - \\xi_i, \\xi_i \\geq 0\n$$\n\n(4.27)\
  \ ![numbered Display Equation](img/c04_M0124.gif)\n\n(4.13) 中的求和是同时通过超平面 $\\{v :\
  \ \\theta^T v - \\theta_0 = 1\\}$ 和 $\\{v : \\theta^T v - \\theta_0 = -1\\}$ 拟合两个类别数据所产生的总平方误差损失，而另外两项则惩罚参数向量\
  \ $\\theta = (\\theta_0, \\theta^*)$ 的大小。从这个角度看，PSVM 是岭回归的重新发现（见第 3 章）。\n\n## 4.10\
  \ 结语：回顾示例问题\n\n本章描述的模型（以及第 6 章中描述的一些模型）对图 4.1 示例数据进行拟合的结果总结在表 4.2 和图 4.34 中。有趣注意的是，虽然每个类别具有三个分量的高斯混合模型是正确的模型（从训练数据确实是由此类模型生成的意义上），但它的预测性能相对较差。许多起初认为这个结果是反直觉的：这在\
  \ 4.4.3 节中讨论过，并在第 5 章和第 8 章进一步讨论。\n\n表 4.2 和图 4.34 的目的绝对不是证明任何分类方法在图 4.1 所示的任何数据集上都优于其他方法。图\
  \ 4.1 的数据集的设计也不是为了让任何方法与其它方法相比显得更好。表 4.2 和图 4.34 表的是，在给定数据集上训练的分类器可以预期有一系列不同的风险，而且方法的相对性能可能提供数据性质的一些线索。在这个示例中，第\
  \ 4 章的分类器自然地分为两组，之间存在显著的性能差距：风险为 0.212 或以下的，以及风险为 0.220 或以上的。在风险为 0.220 或以上的八个分类器中，有七个产生了段超平面的类别边界，在这些，当强制超平面与坐标轴正交时，性能往往会变差。我们可以从此推断，无论类别边界是什么，它们无法被超平面良好近似，特别是无法被正交轴的超平面良好近似。实践中，我们可能决定不再将此示例未来的分类工作放在分类树或直方图上，而是专注于可以学习曲线边界的方法。对数据拟合分类器是一个探索性过程！\n\
