  \n![显示公式](img/c06_M0002.gif)\n\n那么就可以基于类别概率的组合估计（例如估计类别概率的平均值）通过最小风险预测，从而获得一个新的分类器。\n\
  \n许多糟糕的统计预测组合可能会形成良好的预测，这一观察是非常古老的。1907 年，弗朗西斯·加尔顿（Francis Galton）报告了一项基于活牛观察的 787\
  \ 次重量猜测分析（Galton, 1907）。加尔顿发现，中位数 1207 磅非常接近牛的实际重量（1198 磅），尽管这组猜测显示出巨大的差异（四分位距为[1162,1236]磅，五位数范围为[1074,1293]磅）。每个投票的人都可以接触相同的数据——观察活牛——但在经验和专业知识上有所不同。2\n\
  \n## 集成设计\n\n集成分类器设计的一个重要部分是通过控制偏差和方差来控制风险。正如在第 5.2 节中提到的，由于这些概念对于分类和通用损失函数没有广泛接受的正式定义，因此集成设计部分取决于直觉以及与平方误差的类比。\n\
  \n某些集成设计方法可以通过考虑估计参数时产生的平方误差风险来实现。假设 `Z[1]`, …, `Z[L]` 是未知实向量 `θ` 的估计器。3 第 `l` 个\
  \ `θ` 的估计器具有偏差 `Bias[Z[l]] = E[Z[l]] - θ` 和方差 `Var[Z[l]]`。\n\n现在考虑通过形成样本平均值将估计值\
  \ `Z[1]`, …, `Z[L]` 组合成 `θ` 的单个集成估计器，<displayedItem xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\"\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" id=\"c06-disp-0003\"\
  \ type=\"mathematics\" numbered=\"no\"><math display=\"block\" location=\"image\\\
  _n/c06\\_M0003.gif\"><mrow><mo>(</mo><mover accent=\"true\"><mi>Z</mi><mo>&#x203e;</mo></mover><mo>=</mo><mfrac><mn>1</mn><mi>L</mi></mfrac><munderover><mo>&#x2211;</mo><mrow><mi>l</mi><mo>=</mo><mn>1</mn></mrow><mi>L</mi></munderover><msub><mi>Z</mi><mi>l</mi></msub><mo>.</mo></mrow></math></displayedItem>\n\
  \n![显示公式](img/c06_M0003.gif)\n\n\n\n\n$\\bar{Z}$ 对 $\\theta$ 的偏倚以及 $\\bar{Z}$ 的方差为：\n\
  \n$$\n\\text{ Bias } [\\bar{Z}] = \\frac{1}{L} \\sum_{l=1}^{L} \\text{ Bias } [Z_l]\n\
  $$\n\n$$\n\\begin{aligned}\n\\text{ Var } [\\bar{Z}] &= \\frac{1}{L²} \\sum_{l=1}^{L}\
  \ \\text{ Var } [Z_l] + \\frac{1}{L²} \\sum_{l \\neq k} \\text{ Cov } [Z_l, Z_k]\
  \ \\\\\n&= \\frac{1}{L²} \\sum_{l=1}^{L} \\text{ Var } [Z_l] + \\frac{1}{L²} \\\
  sum_{l \\neq k} \\text{ Cor } [Z_l, Z_k] \\sqrt{\\text{ Var } [Z_l]} \\sqrt{\\text{\
  \ Var } [Z_k]}.\n\\end{aligned}\n$$\n(6.1)\n\n### 集成设计方法 A.\n\n偏倚和方差的表达式表明，如果能找到一组估计器\
  \ $Z[1], \\dots, Z[L]$，它们满足：\n\n1. 均具有相同的偏倚 $\\beta$，\n2. 均具有相同的方差 $\\sigma² > 0$，且\n\
  3. 均互不相关，\n\n那么估计器 $\\bar{Z}$ 的偏倚为 $\\beta$，方差为 $\\frac{\\sigma²}{L}$，其风险也比任何单个估计器都小。因此，只要单个估计器的方差较低，就可以通过构建许多高风险的\
  \ $Z[1], \\dots$ 生成一个低风险的估计器 $\\bar{Z}$。\n\n### 集成设计方法 B.\n\n偏倚和方差的表达式同样表明，如果能找到一组估计器\
  \ $Z[1], \\dots, Z[L]$，它们满足：\n\n1. 具有和为零的非零偏倚 $\\beta[1], \\dots, \\beta[L]$，\n\
  2. 均具有相同的方差 $\\sigma²$，\n\n那么估计器 $\\bar{Z}$ 的偏倚为 0，方差为\n$$\n\\frac{1}{L²} \\sum_{l=1}^{L}\
  \ \\text{ Var } [Z_l] + \\frac{1}{L²} \\sum_{l \\neq k} \\text{ Cor } [Z_l, Z_k]\
  \ \\sqrt{\\text{ Var } [Z_l]} \\sqrt{\\text{ Var } [Z_k]}\n$$\n其风险也比任何单个估计器都小。因此，只要单个估计器（具有相互抵消的高偏倚），就可以通过构建许多高风险的\
  \ $Z[1], \\dots$ 生成一个低风险的估计器 $\\bar{Z}$。虽然可能存在 $\\text{Var } [\\bar{Z}] = \\sigma²$\
  \ 的情况，但这类情况是病态的，通常情况下，除了偏倚为零外，我们预期 $\\text{Var } [\\bar{Z}] < \\sigma²$。\n\n\n\n\
  \n### 练习 6.1\n考虑样本平均的泛化：`Z = ∑^L[l=1]c[l]Z[l]`，其中所有系数 `c[l]` 均为非负，且 `c[1] + ⋅⋅⋅\
  \ + c[L] = 1`。假设 `Z[1], …, Z[L]` (1) 具有相同的偏差 `β`，(2) 具有已知的正方差 `σ²[1], …, σ[L]²`且\
  \ (3) 均不相关，找到系数 `c[1], …, c[L]` 的值，使得 `Z` 在平方误差损失下的风险最小化。\n\n### 练习 6.2\n对于五种集成方法（bagging、随机森林、boosting、arcing\
  \ 和 stacking，详见第 6.3 节、6.5 节、6.6 节、6.7 节 和 6.8 节），说明它们类似于设计方法 A 或设计方法 B（或两者都是，或两者都不是）。对于这些集成方法中的每一种，你能否找到基学习器和参数（集成方法的参数或基学习器的参数）的选择，使得该方法类似于方法\
  \ A，以及另一种使其方法类似于方法 B 的选择？\n\n## 6.3 自助聚合 (Bagging)\n\n自助法（Bootstrap）是 Efron (1979)\
  \ 提出的技术，用于生成与给定数据集具有近似相同（未知）采样分布的新数据集。大小为 `n` 的数据集的*自助样本*是通过通过独立且均匀地对该集合进行 `n` 次有回抽样得到的。因此，集合\
  \ \n```\n{(x1, y1), (x2, y2), (x3, y3), (x4, y4), (x5, y5), (x6, y6)}\n```\n(images/c06_M0007.gif)\
  \ 的自助样本可能是 \n```\n{(x2, y2), (x4, y4), (x5, y5), (x6, y6)}\n```\n(images/c06_M0008.gif)\
  \ Efron 使用自助法的原始动机是为了估计统计估计量的方差。\n\n### 练习 6.3\n令 `ρ > 0`。证明如果大小为 `n` 的数据集被独立且均匀地有回抽样\
  \ `ρn` 次，则数据集中的任意特定点被排除在样本外的概率为 `(1 - 1/n)ⁿ` (images/c06_ILM0013.gif)。证明 \n```\n\
  lim_{n→∞} (1 - 1/n)ⁿ = e⁻ρ.\n```\n(images/c06_M0009.gif) 因此，被排除在给定自助样本中的数据集预期比例（`ρ\
  \ = 1`）约为 `e⁻¹ ≈ 0.368`，包含在内的预期比例约为 `1 − e⁻¹ ≈ 0.632`。\n\n*Bagging* 是“自助聚合”（bootstrap\
  \ aggregation）的合成词，是 Breiman (1996a) 提出的集成技术。Bagging 的思想非常简单：选择一种分类算法，从训练数据抽取 `L`\
  \ 个独立的自助样本（即从训练数据中独立且有回地抽取 `L` 个大小为 `n` 的集合），在每个 `L` 个集合中的每一个上训练一个分类器，然后将它们组合成一个委员会。\n\
  \nbagging 中使用的自助样本的大小不需要是 `n`（训练数据的数量）。相反，可以使用大小为 `ρn` 的自助样本，对于某个实数 `ρ > 0`（原始自助法对应于\
  \ `ρ = 1`）。根据第 5 章，可以预见降低 `ρ` 会导致基学习器的方差和偏差均增加，同时减少任何两个学习器之间的相关性（因为两个大小为 `ρn` 的自助样本中共有的训练数据预期比例约为\
  \ `(1 − e⁻ρ)²`）。\n\n在基于第 4.3 节数据上训练的自助 1-最近邻分类器和自助决策树桩^(5) 中，改变自助样本大小的影响如图 6.3 和\
  \ 6.4 所示。\n\n![图 6.3 第一行：在第 4.3 节数据上训练的 1-最近邻分类器（风险 0.248）和决策树桩（风险 0.423）。中间行：在\
  \ L = 100 个大小为 n 的自助样本上训练的自助 1-最近邻分类器（风险 0.248）和自助决策树桩（风险 0.419）。底行：在大小为 ρn 的自助样本上训练的自助\
  \ 1-最近邻分类器（风险 0.199）和在大小为 ρn 的自助样本上训练的自助决策树桩（风险 0.219）。底行的自助样本大小是使用第 7.3 节描述的袋外风险估计（out-of-bag\
  \ risk estimation）选择的近似最优值，用于估计训练数据的风险。](img/c06f003.jpg)\n\n\n\n\n\n图 6.3 *顶行：*一个\
