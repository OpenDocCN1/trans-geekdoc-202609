  \ < α[2]`\n\n\n\n\n\n对 (A) 到 (D) 中的每个参数进行何种修改可以将逻辑“与”（and）操作转换为“与非”（nand）操作？任何布尔函数都可以通过与非门的复合来构建，因此本练习表明，足够深的神经网络可以以任意精确的精度近似关于其输入的不不等式的任何布尔函数。\n\
