  inline\" location=\"image\\_n/c12\\_ILM0037.gif\"><mrow><mo>F</mi><mo>(</mo><mi>s</mi><mo>)</mo><mo>=</mo><mo>S</mi><mo>&#x264;</mi>s</mo></mo></math>![](img/c12_ILM0037.gif)`\
  \ 是连续且严格递增的。令 `U = F(S)`。证明 `U` 在区间 (0, 1) 上服均匀分布。如果 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c12\\_ILM038.gif\"><mrow><mo>F</mi><mo>(</mo><mi>s</mi><mo>)</mo><mo>=</mo><mo>S</mi><mo>&#x265;</mi>s</mo></mo></math>![](img/c12_ILM0038.gif)`\
  \ 会发生什么变化？\n\n**练习 12.3** 令 `S[1]` 为一个分布为 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
