  \ accent=\"true\"><mi>&#x03b8</mi><mo>^mo</mover><mrow><mo>(</mo><mi>k</mi><mo)</mo></mrow></msup></mrow></math>![](img/c11_ILM0136.gif)\
  \ 来优化任何分类器的性能。深度神经网络在图 11.14 中所示。\n\n\n\n\n\n在为高维数据拟合预测模型的背景下，人们可以使用第 11.3 节中描述的方法之一先找到数据的低维表示，然后对该数据的低维表示拟合预测模型。或者，也可以设计预测建模方法，使其倾向于生成使用一小部分特征的模型。这是通过同时最大化模型质量指标（通常是最大化似然函数或最小化某种风险估计值）和最小化模型复杂度指标来实现的，其中模型复杂度指标与模型实际使用的特征数量相关。这被各种称为`model\
  \ regularization`（模型正则）、`parameter penalization`（参数惩罚）或`shrinkage`（收缩）。\n\n模型正则化的主要工具是在描述建模技术“优劣”的目标函数中添加一个模型参数\
  \ `θ` 的惩罚函数。在最一般的情况下，`θ`的`penalty function`（惩罚函数）是一个在某个集合 `Ω` 上取最小值，并随着 `θ` 离开 `Ω`\
  \ 而增加的函数。直观地说，`Ω` 代表 `θ` 的一组“默认”值，而惩罚函数描述了在面对来自数据的证据时，接受 `Ω` 之外 `θ` 值的意愿（或不愿意）。第\
  \ 11.4.2 节将建立惩罚函数与关于 `θ` 先验信念之间的明确联系。\n\n考虑第 3 章中描述的最小二法线性回归情况。使用平方误差损失函数，选择参数以最小化训练风险估计值：\n\
  \n```\nθ^ = argmin θ ∑_{i=1}^n (y_i - (1, x_i1, ..., x_im) * (θ_0, θ_1, ..., θ_m)^T)²\
  \ .\n```\n\n![numbered Display Equation](img/c11_M0062.gif)\n\n在练习 3.7 中，目标是证明：在残差服从\
  \ N(0, σ²) 分布的情况下，选择 `θ` 来最小化平方误差和与选择 `θ` 来最大化数据似然是等价的。通常应用于参数向量 `θ = (θ[0], θ[1],\
  \ …, θ[*m])` 的惩罚函数为：\n\n```\n∑_{i=1}^m |θ_i|^p\n```\n\n对于某些 `p` > 0。在这个惩罚函数中，对截距\
  \ `θ[0]` 不进行惩罚，而所有其他参数在它们的绝对值增大时都会受到惩罚：惩罚函数在集合 {0}![](img/c11_ILM0137.gif) 上最小。使用该惩罚函数，`penalized\
  \ least-squares`（惩罚最小二法）选择最小化训练风险和惩罚加权和的参数：\n\n```\nθ^ = argmin θ ∑_{i=1}^n (y_i\
  \ - (1, x_i1, ..., x_im) * (θ_0, θ_1, ..., θ_m)^T)² + λ ∑_{i=1}^m |θ_i|^p\n```\n\
  \n<a href=\"#c11-disp-0063-3\"></a>(11.3)![numbered Display Equation](img/c11_M0064.gif)\n\
  \n其中权重参数 `λ` 的选择是为了最小化受惩罚模型的估计风险。\n\n\n\n\n在逻辑回归中，参数的选择是为了最大化数据的对数似然：\n\n```math\n\
  \\sum_{i=1}^{n} \\log P(y_i | X=x_i) = \\sum_{i=1}^{n} T(x_i, \\theta_{y_i}) - \\\
  sum_{i=1}^{n} \\log \\sum_{d=1}^{C} \\exp(T(x_i, \\theta_d))\n```\n\n![numbered\
  \ Display Equation](img/c11_M0065.gif)\n\n这对应于这种情况：对于每个 `i`，`Y[i]` 是从 {1, …, `C`}\
  \ 上的多项分布中抽取的，概率为 `P(Y=1|X=x_i), ..., P(Y=C|X=x_i)`。在练习 41 中，目标是证明选择 `θ` 来最大化该似然函数等同于选择\
  \ `θ` 来最小化关于交叉熵的训练风险估计。使用相同的惩罚函数，惩罚逻辑回归选择的参数最小了训练风险与惩罚函数的加权和：\n\n```math\n\\hat{\\\
  theta} = \\text{argmin}_{\\theta} -\\sum_{i=1}^{n} \\log P(y_i | X=x_i) + \\lambda\
  \ \\sum_{i=1}^{m} |\\theta_i|^p\n```\n\n(11.4) ![numbered Display Equation](img/c11_M0066.gif)\n\
  \n其中权重参数 `λ` 的选择是为了最小化惩惩罚模型的估计风险。\n\n### 11.4.1 对偶性与参数惩罚的几何结构\n\n在某些情况下，无约束的惩罚函数优化与带不等式约束的无惩罚函数优化之间存在有用的对偶性。例如，对于任何给定的\
  \ `p ⩾ 1` 和 `λ ⩾ 0`，惩罚最小二乘回归中的参数估计是通过求解无约束优化问题来实现：\n\n```math\nminimize over θ:\
  \ \\sum_{i=1}^{n} (y_i - (1, x_{i1}, \\dots, x_{im}))^T (\\theta_0, \\theta_1, \\\
  dots, \\theta_m)² + \\lambda \\sum_{i=1}^{m} |\\theta_i|^p\n```\n\n![numbered Display\
  \ Equation](img/c11_M0067.gif)\n\n这等同于带约束优化问题：\n\n```math\nminimize θ: \\sum_{i=1}^{n}\
  \ (y_i - (1, x_{i1}, \\dots, x_{im}))^T (\\theta_0, \\theta_1, \\dots, \\theta_m)²\n\
  subject to: \\sum_{i=1}^{m} |\\theta_i|^p \\le c\n```\n\n![numbered Display Equation](img/c11_M0068.gif)\n\
  \n\n\n\n受约束问题中的上限 `c` 取决于无约束问题中的惩罚参数 `λ`。类似的示例出现在第 4.9 节中，涉及支持向量机的背景。\n\n### 练习\
  \ 11.15\n设 `g` 和 `h` 是关于向量 `θ` 的两个实值函数。\n\n1. 设 `λ` 给定，令 `θ^` 为无约束优化问题的解：\n```\n\
  minimize over θ: g(θ) + λh(θ).\n```\n令 `c_λ = h(θ^)`。证明 `θ^` 是受约束优化问题的解：\n```\n\
  minimize over θ: g(θ)\nsubject to: h(θ) ≤ c_λ.\n```\n**提示：** 假设受约束问题存在解 `θ~` 使得\
  \ `g(θ~) < g(θ^)`，并导出矛盾。\n\n\n\n\n## 2. 假设 `g` 和 `h` 是凸且可微的。设 `c` 为给定值，并 $\\theta^c$\
  \ 为约束优化问题的解\n\n```\nminimize over theta: g(\\theta)\nsubject to: h(\\theta) \\le\
  \ c\n```\n\n如果 $h(\\theta^c) < c$，令 $\\lambda[c] = 0$；如果 $h(\\theta^c) = c$，令 $\\\
  lambda[c] \\ge 0$ 满足 $\\nabla g(\\theta^c) = -\\lambda_c \\nabla h(\\theta^c)$。证明\
  \ $\\theta^c$ 是无约束优化问题的解\n\n```\nminimize over theta: g(\\theta) + \\lambda_c h(\\\
  theta)\n```\n\n**提示：** 如果 $h(\\theta^c) < c$，令 $\\lambda[c] = 0$；如果 $h(\\theta^c)\
  \ = c$，令 $\\lambda[c] \\ge 0$ 满足 $\\nabla g(\\theta^c) = -\\lambda_c \\nabla h(\\\
  theta^c)$。证明 $\\theta^c$ 是无约束优化问题的解。在多种条件下，两种优化形式（一种带惩罚，另一种不）是等价或几乎等价。我们不涉及精确阐述这些条件，因为从对偶性中获得的几何直觉证明是有用的。\n\
  \n**图 11.15**：形式为 $\\sum |i|^p$ 的惩罚函数如何影响模型的稀疏性。每个面显示了变量 (theta1, theta2) 函数（蓝色表面）在约束条件下的最小值（红点）。当\
  \ $p$ 较小时，约束区域沿坐标轴是“尖锐的”，导致 (theta1, theta2) 的最小值倾向于出现在 $\\theta$ 的某个坐标为零的地方。当 $p$\
  \ 较大时，约束区域沿 $|i| = |j|$ 线是“尖锐的”，导致 (theta1, theta2) 的最小值倾向于出现在 $|i| \\approx |j|$\
  \ 的地方（在高维情况下，$\\theta$ 的大部分坐标量级近似相等）。\n\n### 11.4.2 参数惩罚作为先验信息\n\n在模型质量度量由对数似然函数给出的情况下（如上述的最小二乘回归和逻辑回归），添加惩罚项可以被视为添加关于模型参数的先验信息。在这些特定示例中，(11.3)\
  \ 和 (11.4) 可以被显式地选择参数 $\\theta$ 的值，该值使得由数据和先验分布诱导的参数 $\\theta$ 后验分布的密度函数最大。图 11.16\
  \ 显示了四种先验分布，它们分别对应图 11.15 所示的四种惩罚函数。\n\n\n\n\n\n## 练习 11.16\n\n在具有加性、独立高斯误差的最小二乘线性回归中，`Y\
  \ = (1, X)θ^T + E` 且 `E \\sim N(0, \\sigma² I)` ![](img/c11_ILM0152.gif)，似然函数为：\n\
  \n```\nP(Y|X,θ,σ²) = \\frac{1}{\\sqrt{2\\pi\\sigma²}} \\exp\\left(-\\frac{1}{2\\\
  sigma²}(Y - (1,X)θ^T)²\\right)\n```\n\n![numbered Display Equation](img/c11_M0073.gif)\n\
  \n证明：给定独立同分布的数据 `(x[1], y[1]), …, (x[n], y[n])`，参数值 \n\n```\nθ^* = argmin_{\\theta}\
  \ \\sum_{i=1}^n (y_i - (1,x_i)θ^T)² + \\lambda \\sum_{i=1}^n |\\theta_i|^p\n```\n\
  \n![numbered Display Equation](img/c11_M0074.gif) 是当对 `(θ[1], …, θ[m])` 的先验分布密度为\n\
  \n```\nP(θ|Y,X,σ²,λ,p) \\propto \\exp\\left(-\\frac{\\lambda}{2\\sigma²}\\sum_{j=1}^m\
  \ |\\theta_j|^p\\right)\n```\n\n使得后验概率密度 `P(θ|Y,X,σ²,λ,p)` ![](img/c11_ILM0153.gif)\
  \ 最大的值![numbered Display Equation](img/c11_M0075.gif)\n\n当 `p = 2` 时，先验分布是一个 `m`-维高斯分布，![](img/c11_ILM0154.gif)。\n\
