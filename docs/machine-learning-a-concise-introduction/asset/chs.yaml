  >\n</\n>\n</math>\n</displayedItem>\n\n因此答案是是的，贝叶斯分类器的形式为“如果特征低于阈值，否则预测类别 2”。**练习\
  \ 2.2**的 D 部分答案是**练习 4.5**。在给定类别标签`y[1]`, `y[n]` 的情况下`x[1]`, `x[n]` 的似然值为：\n\n<displayedItem\
