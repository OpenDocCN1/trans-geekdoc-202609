  \ (Wolpert, 1992)。在堆叠时，训练好的分类器的输出被视为新特征。\n\n图 6.9 的左侧单元格显示了在数据集上训练的分类树预测 <displayedItem\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" xmlns=\"\
  http://www.wiley.com/namespaces/wiley\" xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ id=\"c06-disp-0015\" type=\"mathematics\" numbered=\"no\"><math display=\"block\"\
  \ location=\"image\\_n/c06\\_M0018.gif\"><mrow><mrow><mo>(</mo><msub><mi>z</mi><mn>1</mn></msub><mo>,</mo><msub><mi>y</mi><mn>1</mn></msub><mo)</mo></mrow><mo>,</mo><mo>&#x22ef;</mo><mo>,</mo><mrow><mo><mo><msub><mi>z</mi><mn>150</mn></msub><mo>,</mo><msub><mi>y</mi><mn>150</mn></msub><mo)</mo></mrow></mrow></math></displayedItem>![numbered\
  \ Display](img/msub><mo)</mo></mrow><mo>,</mo><mo>&#x22ef;</mo><mo>,</mo><msub><mover\
  \ accent=\"true\"><mi>f</mi><mo>^mo></mover><mn>L</mn></msub><mo>(</mo><msub><mi>x</mi><mi>i</mi></msub><mo)</mo></mo></mo></mrow></math></displayedItem>![numbered\
  \ Display](img/c06_M0019.gif)![图 6.9 使用第 6.1 节描述的 20 个坏分类器（风险 ⩾ 0.220）的预测作为类别特征并训练一个分类树（左侧单元格），以及使用在训练数据的“全尺寸”（尺寸-150）自助样本上训练的\
  \ 100 个决策树的预测来生成预测，并训练一个回归分类器（右侧单元格）。堆叠在坏分类器上的树风险为 0.247，堆叠在自助决策树上的逻辑回归风险为 0.231。](img/c06f009.jpg)[`图\
  \ 6.9**` 使用第 6.1 节描述的 20 个坏分类器（风险 ⩾ 0.220）的预测作为类别特征并训练一个分类树（左侧单元格），以及使用在训练数据的“全尺寸”（尺寸-150）自助样本上训练的\
  \ 100 个决策树的预测来生成预测，并训练一个回归分类器（右侧单元格）。堆叠在坏分类器上的树风险为 0.247，堆叠在自助决策树上的逻辑回归风险为 0.231。](\n\
  \n\n\n图 6.9 右侧单元格显示了在数据集上训练的逻辑回归分类器的预测结果：\n\n```\n((z_1, y_1), ..., (z_{150}, y_{150}))\n\
  ```\n\n![numbered Display Equation](img/c06_M0020.gif)\n\n其中\n\n```\nz_i = (f¹(x_i),\
  \ ..., f^L(x_i))\n```\n\n![numbered Display Equation](img/c06_M0021.gif)\n\n并且基础学习器\
  \ \n```\nf¹, ..., f^L\n```  是基于训练数据的 100 个全尺寸（尺寸为 150）自助样本训练的决策树（因此 `L` = 100）。与之前一样，向量\
  \ `z[1]`、……`z[n]` 被视为用于训练逻辑回归分类器的分类型特征。\n\n堆叠逻辑回归相对于第 4.6 节所述的逻辑回归需要进行两处微调：虚拟变量和参数惩罚。`L`\
  \ 个基础学习器做出的预测是具有三种可能值（橙色、蓝色或紫色）的分类型特征，每个分类型特征都通过^(12)两个二进制虚拟变量来表示，这在第 3.8 节中描述。从虚拟变量的角度来看\n\
  \n```\nz_i = (f¹(x_i) = blue, f¹(x_i) = purple, ..., f^L(x_i) = blue, f^L(x_i) =\
  \ purple)\n```\n\n![numbered Display Equation](img/c06_M0022.gif)\n\n是一个长度为 `L`\
  \ 的二值向量：对于 `l` = 1，……`L`，坐标（`z[i, 2l-1]`, `z[i, 2l]`）如果 `f^l(x_i) = orange` 则为 (0,\
  \ 0)，如果 `f^l(x_i) = blue` 则为 (1, 0)，如果 `f^l(x_i) = purple` 则为 (0, 1)。由于其中某些虚拟变量与其他变量高度相关，因此对非截距逻辑回归参数施加了二次惩罚（对比第\
  \ 3.10 节中的岭回归）。即，逻辑回归模型参数的 `C` × (`m` + 1) 矩阵 \n\n```\ntheta = [[0, 0, ..., 0],\n\
  \ [theta_{2,0}, theta_{2,1}, ..., theta_{2,m}],\n [theta_{3,0}, theta_{3,1}, ...,\
  \ theta_{3,m}]] = [[theta_1], [theta_2], [theta_3]]\n```\n\n![numbered Display Equation](img/c06_M0023.gif)\n\
  \n\n\n当 `C` = 3，`m` = 2 且 `L` = 200 时（100 个基础学习器中的每个类别预测由两个二值虚拟变量表示），选择最小化：\n\n\
  ```math\n<mo>-</mo><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>T</mi><mrow><mo>(</mo><msub><mi>z</mi><mi>i</mi></msub><mo>,</mo><msub><mi>&#x03btheta;</mi><msub><mi>y</mi><mi>i</mi></msub></msub><mo)</mo></mrow><mo>+</mo><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mo\
  \ form=\"prefix\">log</mo><mfenced separators=\"\" open=\"(\" close=\")\"><munderover><mo>&#x2211;</mo><mrow><mi>d</mi><mo>=</mo><mn>1</mn></mrow><mi>C</mi></munderover><mo\
  \ form=\"prefix\">exp</mo><mrow><mo>(</mo><mi>T</mi><mrow><mo>(</mo><msub><mi>z</mi><mi>i</mi></msub><mo>,</mo><msub><mi>&#x03btheta;</mi><msub>d</mi></msub></msub><mo)</mo></mrow><mo)</mo></mo></mfenced><mo>+</mo><mi>&#x03bb;</mi><munderover><mo>&#x2211;</mo><mrow><mi>d</mi><mo>=</mo><mn>1</mn></mrow><mi>C</mi></munderover><munderover><mo>&#x2211;</mo><mrow><mi>j</mi><mo>=</mo><mn>1</mn></mrow><mi>m</mi></munderover><msubsup><mi>&#x03btheta;</mi><mrow><mi>d</mi><momo><mi>j</mi></mrow><mn>2</mn></msubsup></mrow></math>\n\
  ```\n\n![编号显示方程](img/c06_M0024.gif)\n\n与第 3.10 节中的岭回归进行比较，并注意截距参数 `θ[d, 0]` 不被惩罚。应用于二次惩罚的权重参数\
  \ `λ` 通过留一交叉验证（见第 7.3 节）被选择为近似最优，以从训练数据估计逻辑回归分类器的风险。\n\n在集成（stacking）中，顶层分类器仅使用\
  \ `L` 个基础学习器的输出：其输入特征向量为 `z[1]`、…… `z[n]`。如果顶层分类器同时使用 `L` 个基础学习器的输出和原始特征，使得其输入特征向量为\
  \ (`x[1]`, `z[1]`),…… (`x[n]`, `z[n]`)，则得到的分类器被称为`专家混合` (Jacobs et al., 1991)。图\
  \ 6.11 显示了在数据集上训练的逻辑回归分类器所做的预测：\n\n```math\n<mrow><mrow><mo>(</mo><mrow><mo>(</mo><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><msub><mi>z</mi><mn>1</mn></msub><mo)</mo></mrow><mo>,</mo><msub><mi>y</mi><mn>1</mn></msub><mo)</mo></mrow><mo>,</mo><mi>&#x2026;</mi><mo>,</mo><mrow><mo>(</mo><mrow><mo>(</mo><msub><mi>x</mi><mn>150</mn></msub><mo>,</mo><msub><mi>z</mi><mn>150</mn></msub><mo)</mo></mrow><momomo><msub><mi>y</mi><mn>150</mn></msub><mo)</mo></mrow></math>\n\
  ```\n\n![编号显示方程](img/c06_M0025.gif)![图 6.11 在数据的“全尺寸”（大小为 150）自助样本以及原始特征向量上训练的 100\
  \ 个决策树（stumps）的预测，并训练逻辑回归分类器。逻辑回归专家混合模型的风险为 0.227。](img/c06f011.jpg)\n\n**图 6.11**](#c06.xhtml#figureanchor6-11)\
  \ 在数据的“全尺寸”（大小为 150）自助样本上训练的 100 个决策树（stumps）的预测，*以及*原始特征向量，并训练逻辑回归分类器。逻辑回归专家混合模型的风险为\
  \ 0.227。\n\n其中 `z[1]`、…… `z[150]` 中的每一个都是如上所述，在训练数据的 100 个全尺寸（大小为 150）自助样本上训练的树的拼接输出。\n\
  \n取决于具体的网络架构，神经网络可以被视为一种集成或专家混合。输出层正下方隐藏层中的神经元可以被视为基础学习器，它们是二值分类器的软版本。这些二值分类器学习到的类别并不一定对应于类别\
  \ 1、…… `C`。相反，它们是从数据中提取的、与问题相关的`隐含类别`。\n\n## 风险估计与模型选择\n\n在第 2 章中，我们提出的目标是找到具有最小风险\
  \ `R(f)` 的近似 `f`，即对新特征 `X` 预测值或类别 `Y` 时产生的期望损失：\n\n```math\n<mrow><mi mo=\"normal\"\
  >R</mi><mo>(</mo><mspace width=\"0.16667em\"/><mover=\"true\"><mi>f</mi><mo>^</mo></mover><mo)</mo></mrow><mo>=</mo><msub><mi\
  \ mo=\"normal\">E</mi><mrow><mo>(</mo><mi>X</mi><mo>,</mo><mi>Y</mi><mo)</mo></mrow></msub><mrow><mo>\\\
  [</mo><mi mo=\"normal\">L</mi><mrow><mo>(</mo><mi>Y</mi><mo>,</mo><mover=\"true\"\
  ><mi>f</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>)</mo></mrow><mo)</mo></mrow><mo>\\\
  ]</mo></mrow><mo>.</mo></mrow></math>\n```\n\n![编号显示方程](img/c07_M0024.gif)\n\n通常情况下，无法精确计算风险，因为\
  \ (`X`, `Y`) 的联合分布是未知的。风险 `R(f)`![](img/c07_ILM003.gif)必须从数据中估计，就像估计 `f` 一样。\n\n\
  ## Notes\n\n- `R(f)` 可能不是同一件事。\n- 表征总能拟合数据这一事实本身就是反对它的理由。\n- — Wasserman, 2001\n\
  - — Jeffreys, 1931\n- — 个人通信\n\n\n\n\n本章描述了估计近似函数 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0004.gif\"><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover></math>![](img/c07_ILM0004.gif)of\
  \ `f` 的风险，以及选择具有近似最小风险的近似函数的方法。7.1 节至 7.5 节描述了估计风险的方法。所有这些方法都有其优缺点，文中对这些内容进行了讨论。7.6\
  \ 节至 7.9 节描述了不涉及显式风险估计的模型选择标准。7.10 节和 7.11 节包含了关于模型选择的一般性。\n\n## 7.1 通过训练数据进行风险估计\n\
  \n令 (`x[1]`, `y[1]`), …, (`x[n]`, `y[n]`) 为用于训练近似函数 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0005.gif\"><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover></math>![](img/c07_ILM0005.gif)of\
  \ `f` 的数据。在第 2 章中，训练风险被定义为使用 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0006.gif\"><mrow><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover><mrow><mo>(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>)</mo></mrow></mrow></math>![](img/c07_ILM0006.gif)\
  \ 预测训练数据上的 `y[i]` 值所产生的平均损失，<displayedItem xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"\
  http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\" xmlns:wiley=\"\
  http://www.wiley.com/namespaces/wiley/wiley\" id=\"c07-disp-0002\" type=\"mathematics\"\
  \ numbered=\"no\"><math display=\"block\" location=\"image\\_n/c07\\_M0002.gif\"\
  ><mrow><msub><mover accent=\"true\"><mi font=\"normal\">R</mi><mo>^</mo></mover><mi>\
  \ train </mi></msub><mrow><mo><mspace width=\"0.166667em\"/><mover accent=\"true\"\
  ><mi>f</mi><mo>^</mo></mover><momomrow><mo>=</mfrac><mn>1</mn><mi>n</mfrac><munderover><mo>&#x21;</mo><mrow><mi>i</mi></mo><mn>1</mn</mi>n</n><mi\
  \ font=\"normal\">L</mi</mi><mo><msub><mi>y</mi</mi>mi</i</momomover accent accenttruetruetruetrueffffmomomomomo></momomomomomsubmsub>xmi</</mi</momomomomomomo></></math>\n\
  \n训练风险的计算较低，但它倾向于低估风险（即产生乐观的估计），因为用于评估 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0007.gif\"><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover></math>![](img/c07_ILM0007.gif)\
  \ 的数据与最初用于计算 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c07\\_ILM0008.gif\"><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover></math>![](img/c07_ILM0008.gif)\
  \ 的数据是相同的。因此，在选择模型以最小化训练风险时，往往会选择方差极大的复杂模型，这些模型在训练数据附近良好拟合 `f`，但在远离训练数据时拟合效果很差（练习\
  \ 2.4 给出过此类示例）。\n\n**练习 7.1** 令 `x[1]`, …, `x[n]` 为不同的实数，对于每个 `i`，令 `y[i] = θ[1]x[i]\
  \ + θ[0] + e[i]`，其中 `e[1]`, …, `e[n]` 是来自 `N(0, σ²)` 分布的独立同分布样本。数据对 (`x[1]`, `y[1]`),\
  \ …, (`x[n]`, `y[n]`) 是已知的。未知的是 `θ[0]`, `θ[1]`, `σ²`、`e[i]` 以及 `f(x) = θ[1]x + θ[0]`\
  \ 是线性函数这一事实。考虑近似函数序列 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0009.gif\"><mrow><msub><mover accent=\"true\"\
  ><mi>f</mi><mo>^</mo></mover><mn>0</mn></msub><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover><mn>1</mn></msub><mover\
  \ accent=\"true\"><mi>f</mi><mo>^</mo></mover><mn>2</mn></msub></math>![](img/c07_ILM0009.gif)\
  \ 对于 `f`，其中 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c07\\_ILM0010.gif\"><msub><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover><mn>d</mn></msub></math>![](img/c07_ILM0010.gif)\
  \ 是关于训练风险最小化损失的 $d$ 次多项式。证明 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0011.gif\"><mrow><mover accent=\"true\"><mi\
  \ font=\"normal\">R</mi><mo>^</mo></mover><mi> train </mi></msub><mrow><mo><mspace\
  \ width=\"0.166667em\"/><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover><mn>d</mn></msub></mo></math>![](img/c07_ILM0011.gif)\
  \ 是 `d` 的减函数。证明当 `d geqslant n` 时 `R^train(f) = 0`。从偏差-方差权衡的角度解释这些事实。\n\n## 7.2\
  \ 通过验证数据或测试数据进行风险估计\n\n估计近似函数 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0013.gif\"><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover></math>![](img/c07_ILM0013.gif)of\
  \ `f` 风险最准确的方法，是使用与未来应用的数据分布相同的 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c07\\_ILM0014.gif\"><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover></math>![](img/c07_ILM0014.gif)\
  \ 将应用的数据，且这些数据未被用于训练。获取此类*验证数据*或*测试数据*的一种方法是在训练任何模型之前从所有可用数据中移除它们。\n\n### 7.2.1\
  \ 训练、验证和测试数据\n\n令所有可用数据集随机([1])划分为两个或三个集合：*训练数据集*（用于训练模型）、*验证数据集*（用于估计已训练模型的风险以进行模型选择），可能还有一个*测试数据集*（用于估计通过模型选择过程找到的最佳模型的风险）。\n\
  \n\n\n\n\n在某些应用中，近似值 `f^` 只有在证明其风险 `R(f^)` 低于给定的阈值时才认为具有实现价值。此类应用除了验证集外，还需要一个测试集。在其他应用中，无论风险如何，都会使用最佳近似值\
  \ `f^`（至少是试验性的），在这种情况下可能只需要一个验证集。\n\n在下文中，令 `(x~1, y~1), ..., (x~n, y~n)` 表示验证数据。假设这些数据是从与训练数据相同的分布中独立抽取的，但`它们不用于训练任何模型`，并且在最大程度上，`它们被排除在探索性分析之外`。所有关于验证数据的说明也同样适用于测试数据。\n\
  \n### 7.2.2 风险估计\n\n`f^` 的验证风险估计 `R^valid(f^)` 为：\n\n```\nR^valid(f^) = 1/n sum_{i=1}^{n}\
  \ L(y_i, f^(x_i))\n```\n![numbered Display Equation](img/c07_M003.gif)\n\n验证风险估计是无偏的，因为：\n\
  \n```\nE[(X_1, Y_1), ..., (X_n, Y_n)] [R^valid(f^)] = 1/n sum_{i=1}^{n} E[L(Y_i,\
  \ f^(X_i))] = R(f^)\n```\n![numbered Display Equation](img/c07_M004.gif)\n\n因此，根据大数定律，当\
  \ `n~ -> ∞` 时，`R^valid(f^) -> R(f^)` 的概率为 1 (images/c07_ILM0023.gif)。根据中心极限理，在弱假设下，`R^valid(f^)`\
  \ 渐近正态分布。只要能够估计风险估计的方差，就可以对风险的假设进行方便的检验。\n\n\n\n\n\n### 练习 7.2\n在 0–1 损失的情况下，训练后的分类器\
  \ $f^\\wedge$ 的风险（泛化误差）为：\n\n$$\nR = \\text{新数据点被 } f^\\wedge \\text{ 错误分类的概率。}\n\
  $$\n\n证明在 0–1 损失下，风险的验证估计为：\n\n$$\nR_{valid}(f^\\wedge) = \\text{验证数据中被 } f^\\wedge\
  \ \\text{ 错误分类的比例。}\n$$\n\n### 练习 7.3\n利用独立随机变量之和的方差等于各个变量方差之和这一事实，证明：\n\n$$\n\\\
  text{Var}((X_1, Y_1), \\dots, (X_n, Y_n))[R_{valid}(f^\\wedge)] = \\frac{1}{n} \\\
  text{Var}(X, Y)[L(Y, f^\\wedge)] = \\frac{1}{n} (E(X, Y)[L(Y, f^\\wedge)]² - R(f^\\\
  wedge)²).\n$$\n\n### 练习 7.4\n利用练习 7.3 的结果证明，如果 $L(c, d)$ 的范围是 $[0, 1]$（即损失从未大于 1），则：\n\
  \n$$\n\\text{Var}((X_1, Y_1), \\dots, (X_n, Y_n))[R_{valid}(f^\\wedge)] \\le \\\
  frac{1}{n} R(f^\\wedge)(1 - R(f^\\wedge)).\n$$\n\n\n\n\n\n当且仅当 `L` 为 0–1 损失时取等。证明：如果\
  \ `L(*c*, *d*)` 的范围为 `{0}∪[1, ∞)`（即任何非零损失至少为 1），则：\n\n```\nVar((X~1, Y~1), ...,\
  \ (X~n, Y~n)) [R_valid(f^)] >= 1/n~ * R(f^) / (1-R(f^))\n```\n\n![numbered Display\
  \ Equation](img/c07_M0009.gif)\n\n当且仅当 `L` 为 0–1 损失时取等。\n\n练习 7.3 和 7.4 导出了一个简单的方差代入估计量：\n\
  \n```\nVar^[R_valid(f^)] = 1/n~ * (1/n~ * sum_{i=1}^n~ L(y~i, f^(x~i))² - R_valid(f^)²)\n\
  ```\n\n![numbered Display Equation](img/c07_M0010.gif)\n\n在 0–1 损失的情况下，它简化为：\n\n\
  ```\nVar^[R_valid(f^)] = 1/n~ * R(f^*) * (1-R(f^))\n```\n\n练习 7.3 的结论是：\n\n```\n\
  Var((X~1, Y~1), ..., (X~n, Y~n)) [R_valid(f^)] -> 0\n```\n\n![images/c07_ILM026.gif)\
  \ 当\n\n```\nn~ -> inf\n```\n\n![images/c07_ILM0027.gif), 只要\n\n```\nVar((X, Y))\
  \ [L(Y, f^(X))] < inf\n```\n\n![images/c07_ILM0028.gif).\n\n\n\n\n给定一个特定大小的数据集，训练集、验证集和测试集的大小应该是多少呢？答案取决于如何平衡两个（或三个）相互竞争的需求。随着更多数据被分配到验证集，验证风险估计\
  \ $R_{valid}(f)$ 得到了改进，正如练习 7.3 所示，$R_{valid}(f)$ 的标准差以 $n^{-1/2}$ 的速度趋于 0。测试集和测试风险估计的情况也是如此。但随着，随着更多数据被分配到验证集和测试集，分配到训练集的数据就会减少，人们自然会预期随着训练数据数量的减少，训练近似模型\
  \ $\\hat{f}$ 的风险会变差——尽管如果训练集中留有足够的数据，这种影响可能是可以忽略不计的。\n\n**练习 7.5** 在一个使用 0–1 损失的给定应用中，希望风险估计的标准差不超过\
  \ $\\sigma$。请找到实现这一目标所需的验证数据最小数量 $n^\\circ$，假设：\n\n1. 专家意见或初步研究表明，任何“合理”分类器的风险都不会超过\
  \ $\\rho$，其中对于某个给定的数值 $\\rho_1 < 1/2$；\n2. 对风险可能是多少无所知；\n3. 如 (A) 所示，$\\rho = 0.25$\
  \ 且 $\\sigma = 0.01$；\n4. 如果总共有 1800 条数据可用，给出 (C) 中的行动建议。\n\n人们偶尔会遇到关于训练、验证和测试集大小的启发式规则，例如使用\
  \ 70% 的用于训练，20% 用于验证，10% 用于测试（或 60-20-20，或 50-30-20）。作者建议，关于数据的决策应根据数据分析的应用目标做出，而不是通过可能与应用目标无关的启发式规则。\n\
  \n### 7.2.4 关于风险的假设检验\n\n风险估计 $R_{valid}(f)$ 的近似正态分布使得能够为真实风险 $R(f)$ 构建近似置信区间，并基于此类区间进行假设检验。除了基于风险估计渐近正态性的检验外，还可以非参数检验。\n\
  \n**练习 7.6** 假设验证数据数量 $n^\\circ$ 足够大，使得对于所考虑的任何模型 $\\hat{f}$，验证风险估计 $R_{valid}(f)$\
  \ 可以被认为符合正态分布且误差忽略不计。给定随机变量（检验统计量）$T \\sim N(\\mu, \\sigma²)$ 的观测值和固定值 $\\rho$，针对原假设\n\
  ```\nH_0: \\mu \\ge \\rho\n```\n反对备择假设\n```\nH_a: \\mu < \\rho\n```\n水平为 $\\alpha$\
  \ 的单侧 Z 检验方法如下：(1) 令阈值 $\\tau$ 使得 $P(U \\le \\tau) = \\alpha$，其中 $U \\sim N(\\rho,\
  \ \\sigma²)$（$\\tau$ 是 $N(\\rho, \\sigma²)$ 分布的 $\\alpha$ 分位数）；(2) 如果 $T < \\tau$\
  \ 则拒绝 $H_0$，否则保留 $H_0$。\n\n1. 证明如果原假设成立，则拒绝原假设的概率不超过 $\\alpha$（这就是检验具有 $\\alpha$\
  \ 水平的含义——请参见第 12 章）。\n\n\n\n\n\n## 2. 假设在某个应用中，除非有证据表明 $R(f^t) < \\rho$，否则训练好的分类器\
  \ $f^t$ 将不会被实现，其中 $\\rho$ 是给定的阈值。使用 $R_{valid}(f^t)$ 作为检验统计量，针对零假设 $R(f^t) \\geq\
  \ \\rho$ 和对择假设 $R(f^t) < \\rho$，构造一个水平为 $\\alpha$ 的单侧 $Z$ 。\n\n## 3. 设 $f_1^t$ 和\
  \ $f_2^t$ 是两个训练好的分类器。使用基于将 $f_1^t$ 和 $f_2^t$ 应用于验证数据得到的检验统计量，针对零假设 $R(f_2^t) \\\
  geq R(f_1^t)$ 和对择假设 $R(f_2^t) < R(f_1^t)$构造一个水平为 $\\alpha$ 的单侧 $Z$ 。\n\n### 7.2.5\
  \ 训练集、验证集和测试集的使用示例 假设有一个分类数据集已通过某种方式划分为训练集、验证集和（可能的）测试集，为了具体起见，我们决定使用树来近似 $f$。我们寻求一棵近似风险的树来用于预测，并（可能）估计最优树的风险。回顾第\
  \ 4.8 节，训练树是一个两阶段的过程：第一阶段通过连续分割数据来生长树，直到树的训练误差为零或接近于零；第二阶段通过在第一阶段生长的树中找到一个子树来修剪树，该子树需最小化代价复杂度准则：\n\
  \n```\nα number of leaf nodes + Σ all leaf nodes t L(d,c) P(Y=d|X \\in t) P(X \\\
  in t)\n```\n\n\n\n\n为了简单起见，让我们假设第 4.8 节中描述的所有其他树训练方面都是固定的。那么，从任何给定的训练集中获得的树集是一个由\
  \ `α` 索引的单参数族，而寻找近似最优树就对应于寻找 `α` 的近似最优值。直观上，设置 `α = 0` 通常会导致产生一个高风险、高方差且低偏差的树。随着\
  \ `α` 从零开始增加，我们期望最小代价复杂度准则的树风险首先会降低，然后达到某个与最优偏差-方差权衡相应的极值（不一定是唯一的），随后随着树的偏差过大而方差过小，风险会再次增加。最终，对于超过某些阈值的所有\
  \ `α`，最小代价复杂度准则的树仅包含一个叶节点：这棵树具有高偏差和低方差，通常是高风险的。\n\n可以通过这种方法找到近似最优树：^(3)\n\n1. 指定一个非负数的有限集合\
  \ `A` 作为 `α` 的值；\n2. 使用训练数据，为每个 `α` ∈ `A` 计算最小代价复杂度准则的树 `f^α` (images/c07_ILM0051.gif)；\n\
  3. 使用验证数据计算每棵树 `f^α` 风险的验证估计 `R^valid(f^α)` (images/c07_ILM0052.gif)；\n4. 选择估计风险\
  \ `R^valid(f^α)` (images/c07_ILM0055.gif) 最小的树 `f^α`。\n\n风险估计只是*估计*，因此步骤 (4) 中的准则通常替换为：\n\
  \n4. 在所有考虑的树中，选择最简单的树 `f^α` (images/c07_ILM0056.gif)，使得无法拒绝其具有最小风险的假设。\n\n找到^(4)近似最优值\
  \ `α` (images/c07_ILM0057.gif) 后，该过程返回的树是对应于 `α` 的 (images/c07_ILM0058.gif)，它是在训练数据上训练的，或者为了不浪费数据而在两种数据上训练。\n\
  \n## 7.3 交叉验证\n\n当数据不充足时，创建验证集的替代方案是*k 折交叉验证*。在*k*折交叉验证中，数据被随机划分为*k* 个大小近似为 `S`\
  \ 的子集。具体而言，*k*折验证估计是由图 7.1 所示算法定义的物理量 `R^valid(f)` (images/c07_ILM059.gif)。\n\n\
  交叉验证估计的期望值（相对于 `S` 划分为 `k` 个子集的随机划分 `π` 和训练数据）为：\n\n```\nE[S,π][R^valid] = 1/k Σ\
  \ E[S,π][Ri] ≈ R(f^*)\n```\n\n![numbered Display Equation](img/c07_M0015.gif)\n\n\
  \n\n\n其中 $f^\\star$ 是在 $\\frac{k-1}{k}n$ 数据而非 $n$ 数据上训练的分类器。方差近似为：\n\n$$Var(S,\\\
  theta)[R^{cv}(f)] = \\frac{1}{k²} \\left( \\sum_{i=1}^k Var(S,\\theta)[R_i²] + \\\
  sum_{i \\neq j} k Cov(S,\\theta)[R^i, R^j] \\right)$$\n$$ \\ge \\left( \\frac{1}{k}\
  \ + \\frac{k-1}{k} Cov(S,\\theta)[R¹, R²] \\right) Var(S,\\theta)[R¹]$$\n\n当所有子集\
  \ $S[i]$ 的大小完全相同时，该近似等式成立。将 $S[1]$ 视为 $f[1]$ 的验证集，其大小约为 $n/k$，练习 7.3 的结果得出：\n\n\
  $$Var(S,\\theta)[R^{cv}(f)] \\approx \\left( \\frac{1}{k} + \\frac{k-1}{k} Cov(S,\\\
  theta)[R¹, R²] \\right) \\frac{1}{|S_1|} \\left( E(X,Y)[L(Y, f¹(X))] - (f¹(X))²\
  \ \\right)$$\n$$ \\ge \\left( \\frac{1}{n} + \\frac{k-1}{n} Cov(S,\\theta)[R¹, R²]\
  \ \\right) (f^\\star)².$$\n\n![numbered Display Equation](img/c07_M0017.gif)\n\n\
  \n\n如所示，交叉验证风险估计的期望值 $R_{cv}(\\hat{f})$![](img/c07_ILM0063.gif)（近似）等于使用 $\\frac{k-1}{k}n$\
  \ 个训练数据![](img/c07_ILM0064.gif) 来近似 $f$ 的风险。\n\n当 $k$ 较小时，$\\frac{k-1}{k}$![](img/c07_ILM0065.gif)\
  \ 较小，$R_{cv}(\\hat{f})$![](img/c07_ILM0066.gif) 的期望值是在远少于实际可用的训练数据上训练近似方法的风险。由于减少给定的特定近似方法的可用训练数据往往会产生更高风险的近似，因此\
  \ $R_{cv}(\\hat{f})$![](img/c07_ILM0067.gif) 通常倾向于高估在 $n$ 个数据上训练 $\\hat{f}$ 的风险（$R_{cv}(\\\
  hat{f})$ 是一个*悲观的风险估计*）。\n\n当 $k$ 较大时（极端情况 $k = n$ 称为*留一交叉验证*），$\\frac{k-1}{k}$![](img/c07_ILM0070.gif)\
  \ 接近于 1，因此 $R_{cv}(\\hat{f})$![](img/c07_ILM0071.gif) 几乎是无偏的。风险估计对之间的相关性，例如 $R¹$![](img/c07_ILM0072.gif)\
  \ 和 $R²$![](img/c07_ILM0073.gif)，取决于 $k$。\n\n当 $k$ 较大时，近似方法 $\\hat{f}¹$![](img/c07_ILM0074.gif)\
  \ 和 $\\hat{f}²$![](img/c07_ILM0075.gif) 在几乎相同的数据上训练，因此 $R¹$![](img/c07_ILM0076.gif)\
  \ 和 $R²$![](img/c07_ILM0077.gif) 通常会高度相关：在留一交叉验证的极端情况下，用于训练 $\\hat{f}¹$![](img/c07_ILM0078.gif)\
  \ 和 $\\hat{f}²$![](img/c07_ILM0079.gif) 的 $(n-1)$ 点数据集 $S \\setminus S[1]$ 和 $S\
  \ \\setminus S[2]$ 具有 $n-2$ 个共同点。因此，当 $k$ 较大时，$[R¹, R²]$![](img/c07_ILM0080.gif)\
  \ 较大。当 $k$ 较小时，近似方法 $\\hat{f}¹$![](img/c07_ILM0081.gif) 和 $\\hat{f}²$![](img/c07_ILM0082.gif)\
  \ 的相关性较小。\n\n\n\n\n在计算 `k`-折交叉验证的风险估计值时，选择 `k` 存在着偏差-方差权衡问题。当 `k` 较小时，估计值具有较高的偏差和较低的方差；而当\
  \ `k` 较大时，它具有较低的偏差但较高的方差。偏差和方差都会随着 `n` 的增加而减小，但这并没有太大帮助，因为对于大型数据集，我们通常会选择使用独立的验证集来估计风险。在实践中，`k\
  \ = 5`、`k = 10` 和 `k = n` 是最常用的。\n\n## 7.4 交叉验证的改进\n\n自助法（bootstrap）的发明者提出了几种将自助法应用于风险估计的方法（Efron,\
  \ 1983, 1986; Efron and Tibshirani, 1997）。这些方法的通用思想是构建训练数据的自助样本，在每个自助样本上训练模型，并将训练好的模型应用于未包含在训练自助样本的数据上，然后对得到的风险估计值取平均值（自助样本在[第\
  \ 6.3 节]中讨论过）。用 Efron 和 Tibshirani (1997) 的的话，“自助程序无非是交叉验证的平滑版本，为了纠正偏差进行了一些调整。”根据\
  \ Efron 和 Tibshirani (1997) 的模拟研究确定，其中最好的是 `.632+ bootstrap 风险估计`，其计算方法如下（符号遵循 Efron\
  \ 和 Tibshirani (1997)）。\n\n首先，从训练数据中构建 `B` 个独立的自助样本：Efron 和 Tibshirani (1997) 建议使用\
  \ `B = 50` 个样本，并讨论了选择 `B` 的标准。在第 `b` 个自助样本（`b ∈ {1, …, B}`）上训练模型 `f^b`。对于 `i ∈ {1,\
  \ …, n}`，令 `B_i` 为不包含训练数据点 (`x[i]`, `y[i]`) 的自助样本索引集，并令 `E[i]` 为使用 `f^b(x[i])` 代替\
  \ `y[i]` 所产生的平均损失（对 `b ∈ B_i` 取平均）：\n\n```\nE[i] = {\n  0 if B_i = 5 (也就是说，如果 (x[i],\
  \ y[i]) 在每个自助样本中),\n  1/(|B_i|-1) * Σ_{b ∈ B_i} L(y[i], f^b(x[i])) otherwise\n}\n\
  ```\n\n令`留一法自助风险估计值`为\n\n```\nErr¹(f) = 1/n * Σ_{i=1}^n E_i,\n```\n\n\n\n\n\n使用不包含该数据的自助采样样本来预测该数据的类别或响应时，所遭受的平均损失。将训练风险标记为\
  \ `R^{train}(f*)`（其中，不带下标的 `f*` 通常表示在所有训练数据上训练出的模型）。\n\n`无信息风险`（no-information risk）是指当输入\
  \ `X` 与响应或类别标签 `Y` 独立时，使用 `f*` 进行预测所产生的期望损失。也就是说，假设 `X` 不包含关于 `Y` 的任何信息，即条件分布 `P(Y\
  \ | X)` 等于边缘分布 `P(Y)`。\n\n无信息风险通过以下公式估计：\n\n```\ngamma^*(f^*) = \\frac{1}{n²} \\\
  sum_{i=1}^{n} \\sum_{j=1}^{n} L(y_i, f^*(x_j))\n```\n\n这确实是一个非常悲观的风险估计！Efron 和 Tibshirani\
  \ 定义了：\n\n```\nErr¹'(f^*) = min(Err¹'(f) - gamma^*(f*))\n```\n它将留一法交叉验证截断在无信息风险处，并将`相对过拟合`（relative\
  \ overfitting）定义为：\n\n```\nrelative\\ overfitting = \n\\begin{cases} \n\\frac{Err¹'(f)\
  \ - gamma^*(f*)}{R^{train}(f)} & \\text{if } Err¹'(f) > R^{train}(f) \\text{ (这意味着\
  \ } gamma^*(f*) > R^{train}(f)) \\\\\n0 & \\text{otherwise} \n\\end{cases}\n```\n\
  \n\n\n\n其取值范围在 `[0,1]`。任何合理的风险估计必须落入范围被认为是区间 $[R_{train}(f²), \\gamma(f²)]$![](img/c07_ILM0090.gif)，而\
  \ $R'$ 是该范围被 $Err(1)^f$![](img/c07_ILM0092.gif) 覆盖的比例，从乐观开始向悲观的方向移动。如果 $R'=1$，则\
  \ $Err(1)^f \\geq \\gamma(f)² > R_{train}(f²)$![](img/c07_ILM0094.gif)，这意味着留一法自助法（leave-one-out\
  \ bootstrap）风险估计至少与估计的无信息风险 $\\gamma(f²)$![](img/c07_ILM0095.gif)一样悲观。如果 $R'=0$![](img/c07_ILM0096.gif)，则训练风险估计至少与留一法自助法估计一样悲观。\n\
  \n`.632+` 自助法估计为：\n```\nErr(0.632) = 0.368 * R_{train}(f²) + 0.632 * Err(1)^f\n\
  Err(.632+) = R_{train}(f²) + (Err(1)^f - R_{train}(f²)) / ( \\frac{1}{0.632} - \\\
  frac{0.632 - 1}{0.368} ) \n```\n![numbered Display Equation](img/c07_M0023.gif)\n\
  \n直观地说，`.632+` 自助法风险估计在乐观风险估计（训练风险）和倾向于悲观的估计（留一法自助法估计）之间取得了平衡。平衡点的选择基于这两个估计值之间的分歧程度。关于风险自助估计的讨论，请参考\
  \ Efron (1983, 1986) 以及 Efron and Tibshirani (1997)。\n\n## 7.5 袋外风险估计 (Out-of-Bag\
  \ Risk Estimation)\n\n通过其他基分类器进行自助聚合（bagging）产生的分类器被称为*袋分类器*（参见 Section 6.3）。例如，随机森林就是一个袋分类器。袋分类器的风险可以使用训练过程中已经构建的自助样本进行估计。\n\
  \n\n\n假设自助样本的大小为 `n`，装袋分类器训练集中的每个数据点被用于训练大约比例 $1-1/e \\approx 0.632$ 的基分类器。对于这些基分类器，该数据点是*袋内的*\
  \ (in-bag)；而对于剩余的分类器（即未被用于训练的分类器），它是*袋外的* (out-of-bag)：根据第 7.4 节中的符号，`B_i` 索引了 (`x[i]`,\
  \ `y[i]`) 为袋外的自助样本。将某个数据点袋外的基分类器集合聚合在一起形成委员会分类器，该该数据点的*袋外分类器* (out-of-bag classifier)。\n\
  \n装袋分类器的*袋外风险估计* $R_{oob}²(f)$ 为：\n\n```\nR_{oob}²(f) = \\frac{1}{n} \\sum_{i=1}^{n}\
  \ L(y_i, f^b(x_i)) : b \\in B_i\n```\n![](img/c07_M0024.gif)\n\n袋外风险估计通常存在高估偏差 (Bylander,\
  \ 2002)，即 $R_{oob}²(f)$ 倾向于高估 $f^*$ 的风险。至少在随机森林的情况下，作者的实验表明，随着树数量的增加，这种偏差会变得很小。作者通过经验观察到，对\
  \ $R_{oob}²(f)$ 方差的简单估计：\n\n```\n\\frac{1}{n} \\left(\\frac{1}{n} \\sum_{(d,c) \\\
  in C \\times C} \\frac{L(d,c)²}{N_{oob}(d,c)} - R_{oob}²(f^*)²\\right)\n```\n![](img/c07_M0025.gif)\n\
  \n其中\n\n```\nN_{oob}(d,c) = \\text{number of training data }(x_i,d) \\text{ such\
  \ that the out-of-bag classifier for } x_i \\text{ predicts } c,\n```\n![](img/c07_M0026.gif)\n\
  \n倾向于低估偏差。\n\n\n\n对于通过计算参数的最大似然估计来训练的参数模型（例如似然法、逻辑回归和神经网络），\n\n```\n\\theta^* =\
  \ \\text{argmax}_{\\theta} P(y_1, \\dots, y_n | x_1, \\dots, x_n)\n```\n\n![numbered\
  \ Display Equation](img/c07_M0027.gif)\n\n存在一种计算廉价的方法来选择风险近似最小的模型。这是通过最小化 `Akaike\
  \ 信息准则 (AIC)` 实现的，其值为\n\n```\n-2 \\log P(y_1, \\dots, y_n | x_1, \\dots, x_n) +\
  \ 2k\n```\n\n![numbered Display Equation](img/c07_M0028.gif)\n\n其中 `k` 是参数向量 $\\\
  theta$ 中的坐标数量。在此处及其他，`log` 是自然对数。模型越符合观测数据，AIC 越小；模型越复杂，AIC 越大，其中复杂度由参数数量 `k` 衡量。在文献和软件中，AIC\
  \ 有时被定义为上述表达式乘以 $1/2$ 或 $-1$。\n\nAkaike 准则是极大似然原理的扩展。假设有 `L` 个待考虑的模型 `M[1]`、$\\\
  dots$ `M[L]`，模型 `M[i]` 拥有维度为 `k[i]` 的向量参数 $\\theta[i]$，且 $\\hat{\\theta}_i^\\circ$\
  \ 是根据 $S = (x_1, \\dots, x_n, y_n)$ 推导出的 $\\theta[i]$ 估计。`极大似然原理`规定，给定 $(x_1, \\\
  dots, x_n, y_n)$，模型 `M[i]` 和 $\\theta[i]$ 的“最佳”选择是使观测值似然最大化的那个\n\n```\n\\text{argmax}_{M[i],\
  \ \\theta[i]} P(y_1, \\dots, y_n | x_1, \\dots, x_n)\n```\n\n![numbered Display\
  \ Equation](img/pg138-2.gif)\n\n注意，最大化是在所有模型 `M[i]` 以及每个模型 `M[i]` 的所有可能参数 $\\theta[i]$\
  \ 上进行的。练习 7.1 指出了使用极大似然原理进行模型选择的潜在问题。与极大似然原理相反，Akaike (1973) 从这样一个想法出发：模型 `M[i]`\
  \ 的“最佳”选择是使尚未观测的未来数据期望对数似然最大化的那个\n\n```\n\\text{argmax}_{M[i], \\dots} E_{S, X,\
  \ Y} [\\log P(Y | X, \\hat{\\theta}_i^\\circ, M[i])]\n```\n\n![numbered Display\
  \ Equation](img/pg138-3.gif)\n\n其中模型 `M[i]` 的参数估计 $\\hat{\\theta}_i^\\circ$ 是从数据集\
  \ $S$ 中估计的。Akaike 表明，对于较大的 $n$，最大化期望对数似然的模型近似于使本节开始时给出的 AIC 公式的模型。在具有相加性高斯分布噪声的回归情况下，期望对数似然为\n\
  \n\n\n\n```\nE_{S,X,Y} \\left[ \\log P(Y|X,\\lambda_{\\circ}i,M_i) \\right] = -\\\
  frac{1}{2} \\log(2\\pi\\sigma²) - \\frac{1}{2\\sigma²} E_{S,X,Y} \\left[ (Y - \\\
  lambda_{\\circ}i X)^{-1})² \\right]\n```\n![images/pg138-4.gif)\n\n因此，选择极大期望对数似然的模型等同于选择关于平方误差损失风险最小的模型（参见第\
  \ 3.6 节）。在逻辑回归和某些神经网络进行分类的情况下，选择极大期望对数似然的模型等同于选择关于交叉熵损失风险最小的模型（参见第 4.6 节和第 4.7 节，练习\
  \ 4.11）。\n\n在交叉验证和 AIC 同时开发后不久，Stone 指出，对于通过计算参数极大然估计来训练的参数模型，当数据量 $n \\to \\infty$\
  \ 时，交叉验证和 AIC 会选择相同的模型（Stone, 1977）。\n\n## 7.7 Schwartz 的贝叶斯信息准则\n\n`贝叶斯信息准则 (BIC)`\
  \ 适用于与 AIC 相同的，具有相似的形式：选择模型以最小化\n```\n-2 \\log P(y_1, \\dots, y_n|x_1, \\dots, x_n)\
  \ + k \\log n\n```\n![images/c07_M029.gif)\n\n与 AIC 一样，模型与观测数据的拟合程度越高，BIC 越小；模型越复杂，BIC\
  \ 越高，其中复杂度由参数数量 `k` 衡量。在文献和软件中，BIC 有时定义为上述表达式乘以 $1/2$，或者\n\nBIC 的背后的思想是这样的。假设有 $L$\
  \ 个考虑的模型 $M[1], \\dots, M[L]$，且模型 $M[i]$ 具有一个维度为 $k[i]$ 的向量参数 $\\theta[i]$，令 $P(M[i])$\
  \ 和 $P(\\theta[i]|M[i])$ 分别表示模型集合和第 $i$ 个模型参数空间 $\\Theta[i]$ 上的先验分布。给定数据 $(x[1],\
  \ y[1]), \\dots, (x[n], y[n])$，第 $i$ 个模型的后验概率为\n```\nP(M[i]) = \\int P(y_1, \\dots,\
  \ y_n|x_1, \\dots, x_n, \\theta[i], M[i]) P(\\theta[i]|M[i]) P(M[i]) d\\theta[i]\n\
  ```\n![images/c07_M030.gif)\n其中比例系数 $P(y[1], \\dots, y[n])^{-1}$ 对于所有模型都是相同的。在 Schwartz\
  \ (1978) 中，Schwartz 证明了在 $P(\\theta[i]|M[i])$ 和似然函数 $P(y[1], \\dots, y[n] | x[1],\
  \ \\dots, x[n], \\theta[i], M[i])$ 满足良的正则条件下，上述表达式的对数为\n```\n-2 \\log P(y_1, \\\
  dots, y_n|x_1, \\dots, x_n) + k \\log n + (\\text{term bounded in } n)\n```\n![images/c07_M031.gif)\n\
  \n\n\n\n$\\theta^{*i}$ 是 $\\theta[*i]$ 的极大似然估计。因此，当 $n \\to \\infty$ 时，选择 BIC 最小的模型等于选择后验概率最大的模型。\n\
  \n由于选择 BIC 最大的模型等同于选择（近似）后验概率最大的模型，*BIC 是选择良好解释模型的标准，而非良好预测模型的标准*。相比 AIC，BIC 对参数数量施加了更重的惩罚（前提是在至少在八个数据点上进行训练），因此\
  \ BIC 选择的模型不会比 AIC 选择的复杂，且通常更简单。\n\n## 7.8 Rissanen 的最小描述长度准则\n\n*最小描述长度（MDL）准则*比\
  \ AIC 或 BIC 具有更具通用性。MDL 准则是选择最小化以下公式的模型：\n```math\n-\\log_2 P(y_1, \\dots, y_n |\
  \ x_1, \\dots, x_n, \\theta) + \\log_2 \\left( \\frac{(\\theta^T H \\theta)^{k/2}}{\\\
  pi^{k/2} \\Gamma(k/2+1)} \\right)\n```\n其中 `log [2]` 是以 2 为底的对数，$\\theta$ 是长度为 `k`\
  \ 的参数向量。在第二项中，\n```math\nH_{ij} = \\frac{\\partial²}{\\partial \\theta_i \\partial\
  \ \\theta_j} -\\log_2 P(y_1, \\dots, y_n | x_1, \\dots, x_n, \\theta) = 1/k\n```\n\
  是 $-\\log_2 P(y_1, \\dots, y_n | x_1, \\dots, x_n, \\theta)$ 关于 $\\theta$ 的海森矩阵，$\\\
  frac{\\pi^{k/2}}{\\Gamma(k/2+1)}$ 是 `k` 维单位球的体积，且对于任何正数 $z$，\n```math\n\\log_2 z\
  \ + \\log_2(\\log_2 z) + \\log_2(\\log_2(\\log_2 z)) + \\dots\n```\n是所有形式为 `log\
  \ [2]\\cdot⋅log 2` 的正项的有限和。注意，与 AIC 和 BIC 不同（在两者中 $\\theta$ 是通过极大似然估计的），MDL 准则同样适用于参数值\
  \ $\\theta$ 以及模型复杂度 `k` 的选择。\n\nMDL 准则背后的思想是：最好的模型是一个能够同时高效编码数据且自身编码也高效的模型。MDL 准则中的第一项\
  \ $-\\log_2(P(y_1, \\dots, y_n | x_1, \\dots, x_n, \\theta))$ 是在给定模型、参数 $\\theta$\
  \ 和观测特征向量 $x_1, \\dots, x_n$ 的情况下，表示观测响应 $y_1, \\dots, y_n$ 所需位数。MDL 准则中的第二项 $\\\
  log_2 \\left(\\frac{(\\theta^T H \\theta)^{k/2}}{\\pi^{k/2} \\Gamma(k/2+1)}\\right)$\
  \ 是在 Rissanen (1978) 构建的模型近似最优编码中表示该模型所需的位数。与 AIC 和 BIC 一样，MDL 准则中模型对观测数据的拟合程度越高，值越小；模型越复杂，值越大。\n\
  \n## 7.9 *R*² 和调整后 *R*²\n\n\n\n\n\n在平方误差损失的标准回归设置中，训练误差乘以 *n* 被称为模型的`残差平方和` (RSS)，\n\
  \n```\nRSS = \\sum_{i=1}^{n} (y_i - f(x_i))² = R_{train}(f)²\n```\n![](img/c07_M0035.gif)\n\
  \n请参见第 3.4 节。RSS 被解释为观测响应中*未*被训练模型 `f` 解释的变异性。`总平方和` (TSS) 为\n\n```\nTSS = \\sum_{i=1}^{n}\
  \ (y_i - \\bar{y})² = R_{train}(constant model f(x) = \\bar{y})²\n```\n![](img/c07_M0036.gif)\n\
  \n其中 $\\bar{y} = \\frac{1}{n}\\sum_{i=1}^{n}y_i$ 是数据中的平均响应：它衡量了观测响应的整体变异性。在非常宽松的模型假设下，RSS\
  \ 不可能大于 TSS，且当且仅当 `RSS = 0` 时，训练模型能够完美预测观测响应。![](img/c07_ILM0110.gif)`模型平方和`为\n\n\
  ```\nMSS = \\sum_{i=1}^{n} (y_i - f(x_i))² = \\sum_{i=1}^{n} (f(x_i) - \\bar{y})²\n\
  ```\n![](img/c07_M0037.gif) 模型平方和衡量了拟合值相对于平均观测响应的整体变异性。回归中常用的拟合优度是\n\n```\nR² =\
  \ 1 - RSS/TSS = MSS/TSS\n```\n![](img/c07_M0038.gif) 它被解释为`由模型解释的响应变异比例`。当 `R²`\
  \ 接近 1 时，模型解释了数据中大部分变异；当 `R²` 接近 0 时，模型解释的极少。如练习 3.6 所示，`R²` 是观测响应向量 (`y[1], …,\
  \ y[n]`) 与拟合响应向量 `(y¹, …, y^n)` 之间样本相关系数的平方![](img/c07_ILM0113.gif)\n\n随着模型变得复杂，`R²`\
  \ 往往会增加（实际上，如果模型是嵌套的，它不会减少——参见练习 7.1）。毕竟 RSS ![](img/pg141-1.gif)。这一点在`调整 R²` 中得到了补偿：\n\
  \n```\nR_{adj}² = 1 - \\frac{n-1}{n-k} \\frac{RSS}{TSS}\n```\n![](img/c07_M0039.gif)\n\
  \n\n\n\n这惩罚了模型的复杂度（参数数量，`k`）。^(8) 注意，当 `k` = `m` + 1 时，<displayedItem xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\"\
