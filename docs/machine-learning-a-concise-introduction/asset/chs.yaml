  \n1 & x_2 & x_2² & \\dots & x_2^d \\\\\n\\vdots & \\vdots & \\vdots & \\ddots &\
  \ \\vdots \\\\\n1 & x_n & x_n² & \\dots & x_n^d\n\\end{matrix}\n\\end{bmatrix}\n\
