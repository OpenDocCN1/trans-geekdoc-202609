  \ 对于 `c` = 1, 2, 3，作为特征 `x` 的函数绘制。逻辑回归的估计风险为 0.220。## 7 神经网络\n\n### 7.1 激活函数\n\n\
  神经网络需要一个激活函数，它通常是指示函数的“软”分段可微版本。最常用的是 `sigmoid`](#c04.xhtml-note-24) 函数，<displayedItem\
