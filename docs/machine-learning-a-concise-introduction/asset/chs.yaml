  \ D.2 拟合参数\n\n本节包含第 4 章中拟合某些模型的拟合参数。\n\n### D.2.1 二次与线性判别分析\n\n$$\n\\mu¹ = (0.0931711,\
  \ 1.9437887), \\mu² = (-1.56152789, -0.2902658), \\mu³ = (1.39352262, -0.9527820)\n\
  $$\n\n$$\n\\Sigma¹ = \\begin{pmatrix} 0.0367611 & 0.0140027 \\\\ 0.0140027 & 0.0984903\
  \ \\end{pmatrix}, \\Sigma² = \\begin{pmatrix} 2.2583093 & -0.8557902 \\\\ -0.8557902\
  \ & 1.5960710 \\end{pmatrix}, \\Sigma³ = \\begin{pmatrix} 0.8889359 & -0.3959331\
  \ \\\\ -0.3959331 & 3.5267115 \\end{pmatrix}\n$$\n\n$$\n\\Sigma = \\begin{pmatrix}\
  \ 1.703569 & -0.119592 \\\\ -0.119592 & 2.198208 \\end{pmatrix}\n$$\n\n\n\n\n\n\
  参数 $\\theta$ 的近似最大似然估计值为：\n\n$$\n\\theta = \\begin{pmatrix} 0 & 0 & 0 \\\\ 0.4198989\
  \ & -0.8577562 & -1.560357 \\\\ 0.3935905 & 1.2712873 & -1.542454 \\end{pmatrix}.\n\
  $$\n\n![numbered Display Equation](img/bapp04_M0002.gif)\n\n因此，定义类别 2 或类别 3 相对于类别\
  \ 1 的对数优势（log-odds）的线性函数分别为：\n\n$$\nT_2 = T(x_1, x_2, \\theta²) = 0.4198989 - 0.8577562x_1\
  \ - 1.560357x_2\n$$\n\n![numbered Display Equation](img/bapp04_M0003.gif) 以及\n\n\
  $$\nT_3 = T(x_1, x_2, \\theta³) = 0.3935905 + 1.2712873x_1 - 1.542454x_2\n$$\n\n\
  ![numbered Display Equation](img/bapp04_M0004.gif)\n\n### D.2.3 神经网络\n\n具有两个隐藏神经元的单隐藏层网络的的拟合参数如下。对于隐藏层，\n\
  \n$$\n\\begin{pmatrix}\n\\theta^{1,0} = -5.27, \\theta^{1,1} = (0.70, -1.46) \\\\\
  \n\\theta^{2,0} = 2.72, \\theta^{2,1} = (1.99, 1.23) \\\\\n\\theta^{1,0} = 7.93,\
  \ \\theta^{1,1} = (-6.57, -5.94) \\\\\n\\theta^{2,0} = 9.72, \\theta^{2,1} = (311.05,\
  \ -11.44) \\\\\n\\theta^{3,0} = -16.89, \\theta^{3,1} = (344.26, 16.93)\n\\end{pmatrix}.\n\
  $$\n\n![numbered Display Equation](img/bapp04_M0005.gif)\n\n\n\n\n作为特征的函数，\n\n```\n\
  T_1 = 7.93 - 655.57*σ(-5.27 + 0.70x_1 - 1.46x_2) - 5.94*σ(2.72 + 1.99x_1 + 1.23x_2)\n\
  T_2 = 9.72 + 311.05*σ(-5.27 + 0.70x_1 - 1.46x_2) - 11.44*σ(2.72 + 1.99x_1 + 1.23x_2)\n\
  T_3 = -16.89 + 344.26*σ(-5.27 + 0.70x_1 - 1.46x_2) - 16.46*σ(2.72 + 1.99x_1 + 1.23x_2)\n\
