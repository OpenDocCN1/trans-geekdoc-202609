  \n### 风险总结\n大多数方法的风险随着 `S` 数量的增加而减少，因此偏差和方差取决于训练数据的数量。这在使用不同大小的 `S`：`{15, 150, 1500,\
  \ 15000, 150000}` 的示例中得到了体现。对于 6 次多项式的情况，方差大约与偏差成比例，如表 5.1 所示。\n\n| 次数 | S | 偏差\
