  \n![显示公式](img/c06_M0001.gif)\n\n通过使用类别概率的组合估计来产生单个预测类别。如果所考虑的每个分类器都计算类别成员的近似概率，<displayedItem\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" xmlns=\"\
