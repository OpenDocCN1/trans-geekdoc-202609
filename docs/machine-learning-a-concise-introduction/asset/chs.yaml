  \ width=\"0.166667em\"/><msub><mover accent=\"true\"><mi>&#x03c3</mi><mo>^</mo></mover><mrow>c</mi><mo>,</mo><mi>j</mi></mrow></msub></mo>,</mrow></math></displayedItem>\n\
  \nwhere <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
