  *(注：由于原文中 Math 代码块存在大量截断和格式错误，此处仅保留原始结构并翻译了其周围对应的文本描述。)*\n\n### 4.8.4 剪枝\n\n如前所述，树一直训练直到它们在训练数据上达到零误差（除非具有相同特征但标签不同）。这表明它们可能会过拟合（参见第\
  \ 5 章和第 7 章）。有两种避免过拟合的方法。第一种是根据某些准则（例如非零纯度）停止生长。第二种由 Breiman 等（1984）建议的方法是先完全生长树然后进行剪枝。对于给定的调优参数\
  \ $\\alpha$，在全树中找到使代价复杂度最小的子树：\n\n\n\n\n第一项惩罚树的大小，第二项惩罚树的风险训练估计，而参数 `α` 设置了这两项的相对重要性^38（α\
  \ = 0 对树的大小不进行惩罚，在这种情况下没有节点被剪枝，随着 `α` → ∞，树将剪剪回根节点）。Breiman 等人（1984）的第 10 章展示了如何针对给定的\
  \ `α`，根据复杂度准则高效地计算最优子树。通过交叉验证或其他风险估计方法选择近似最优的 `α` 值——参见第 7 章。\n\n**练习 4.16** 证明在\
  \ 0–1 损失下，复杂度准则为：\n\n```\nα * (number of leaf nodes) + Σ_{all leaf nodes t} [1 -\
  \ max_{c∈{1,...,C}} P(Y=c|X=t)] * P(X∈t)\n```\n\n![numbered Display Equation](img/c04_M0098.gif)\n\
  \n树的优势之一是非常容易解释，而且树甚至被设计用于手工实现。例如，由 Dorcas S. Miller 编写、Cherie Hunter Day 插图的口袋书\
  \ *Berry Finder: A Guide to Native Plants with Fleshy Fruits* 包含了一个 54 页的分类树实现，由大约\
  \ 120 个叶节点和 150 个内部节点节点组成（其中某些节点具有两个以上的子节点）。内部节点是对植物特征（叶子、茎、果实、生长位置等）的查询，而叶节点预测特定的物种^39。\n\
  \n### 4.8.5 回归树\n\n树也用于回归。用于回归树的纯度度量是：\n\n```\nI(t) = Var[Y|X∈t] = E[(Y - E[Y|X∈t])²\
  \ | X∈t]\n```\n\n\n\n假设有 $C = 2$ 类，特征空间 $X$ 为 $\\mathbb{R}^m$，且这两类数据在特征空间中是线性可分的，这意味着存在一个超平面\n\
  \n```\nH(\\theta^*, \\theta_0) = {v \\in \\mathbb{R}^m : \\theta^* \\cdot v + \\\
  theta_0 = 0} = {v \\in \\mathbb{R}^m : \\frac{\\theta^* \\cdot v}{\\|\\theta^*\\\
  |} + \\frac{\\theta_0}{\\|\\theta^*\\|} = 0}\n```\n\n使得某一类的所有数据都位于 $H(\\theta^*,\
  \ \\theta_0)$ 的一侧，另一类的所有数据都位于另一侧。线性可分分类的数据如图 25 所示。假设我们的目标是使用线性边界对新数据进行分类：我们必须在\
  \ $\\mathbb{R}^m$ 中选择一个超平面，并将一侧的所有点声明为类 1，将另一侧的所有点声明为类 2。哪种超平面是最好的选择？\n\n![图 25\
  \ 图 4.1 中橙色和紫色数据的子集，使得这些类别是线性可分的。图中展示了分离这两个类的三个不同超平面（直线）：当然，有无限条直线。关于什么使得分离这两个类的直线是“良好的”的几何定义，是支持向量机（SVM）分类器的动力。](img/c04f25)\n\
  \n该问题的一个答案是：首先，将选择限制在分离训练数据的超平面集合上。只有这些超平面产生训练误差为零的分类器。对于这些超平面中的任意一个 $H$，从 $H$ 到类\
  \ 1 数据的最小距离为 $d_1$，从 $H$ 到类 2 数据的最小距离为 $d_2$，因此 $H$ 可以扩展为宽度为 $d_1 + d_2$ 的带，用以分离这两类。该宽度\
  \ $d_1 + d_2$ 被称为基于 $H$ 的分类器的间隔（margin）。支持向量机分类器的基本假设是，在 0–1 损失和类别均匀先验分布下，“最佳”二分类线性分类器具有最大间隔的分类平面，使得\
  \ $d_1 = d_2$。\n\n让两个类标签进行编码，使得响应变量 $Y_i$ 属于$\\{−1,1\\}$。数据 $(x_1, y_1), \\dots,\
  \ (x_n, y_n)$ 被超平面分离，当且仅当存在一个超平面 $H(\\theta^*, \\theta_0)$使得对于所有的 $i$：\n\n```\n\
  y_i = \\begin{cases} 1 & \\text{if } \\theta^* \\cdot x_i + \\theta_0 \\geq 1 \\\
  \\ -1 & \\text{if } \\theta^* \\cdot x_i + \\theta_0 \\leq -1 \\end{cases}\n```\n\
  \n(4.4)images/c04_M0101.gif\n\n更紧凑的写法为：\n\n```\ny_i(\\theta^* \\cdot x_i + \\theta_0)\
  \ \\geq 1 \\text{ for all } i\n```\n\n(4.5)images/c04_M0102.gif\n\n\n\n\n如图 4.26\
  \ 所示，如果将分离超平面的法向量设置为单位向量，则该情况的几何结构将更加明显：\n\n$$\ny_i \\left( \\frac{\\theta^\\star\
  \ \\cdot x_i}{\\|\\theta^\\star\\|} + \\frac{\\theta_0}{\\|\\theta^\\star\\|} \\\
  right) \\geq \\frac{1}{\\|\\theta^\\star\\|} \\quad \\text{对于所有 } i.\n$$\n\n(4.6)-->![numbered\
  \ Display Equation](img/c04_M0103.gif)\n\n**图 4.26** 图 4.25 中的线性可分数据，图中具有最大间隔分离超平面（实线）以及定义间隔的两个超平面（虚线）。右下角显示了单位向量\
  \ `\\hat{\\theta} = \\frac{\\theta^*}{\\|\\theta^\\star\\|}`。橙色点代表类别“1”，紫色点代表类别“−1”，且所有数据点\
  \ (`x_i`, `y_i`) 满足不等式 `y_i(\\theta^\\star x_i + \\theta_0) \\geq 1`。三个实心圆点（两个橙色和一个紫色）是支持向量，即满足\
  \ `y_i(\\theta^\\star x_i + \\theta_0) = 1` 的数据点。这样写，很容易看出特征向量 `x_i` 到分离超平面 `H(\\\
  theta^\\star, \\theta_0)` 的距离为：\n\n$$\n\\left| \\frac{\\theta^\\star \\cdot x_i}{\\\
  |\\theta^\\star\\|} + \\frac{\\theta_0}{\\|\\theta^\\star\\|} \\right|,\n$$\n\n\
  ![numbered Display Equation](img/c04_M0104.gif)且该距离的下限为：\n\n$$\n\\frac{1}{\\|\\\
  theta^\\star\\|}\n$(images/c04_ILM013.gif).\n\n因此，最大化间隔意味着求解优化问题 42：\n\n$$\n\\begin{aligned}\n\
  &\\text{minimize}_{\\text{over } \\theta^\\star \\text{ and } \\theta_0:} \\quad\
  \ & \\frac{1}{2} \\|\\theta^\\star\\|² \\\\\n&\\text{subject to, for all } i: \\\
  quad & y_i(\\theta^\\star \\cdot x_i + \\theta_0) \\geq 1.\n\\end{aligned}\n$$\n\
  \n(4.7)![numbered Display Equation](img/c04_M0105.gif)\n\n这是通过二次规划技术近似完成的，得到训练后的参数值\
  \ `\\theta^*` (images/c04_ILM015.gif) 和 `\\theta_0` (images/c04_ILM016.gif)。一个训练好的支持向量机由参数以及分类规则组成：“给定特征向量\
  \ `X`，预测其类别为 `\\theta^* \\cdot X + \\theta_0` 的符号”(images/c04_ILM017.gif)。训练好的支持向量机的间隔为\
  \ 2/\\|\\theta^\\star\\| (images/c04_ILM0118.gif)。任何满足 (4.5) 等等条件的训练数据点 (`x_i`,\
  \ `y_i`) 都是*支持向量*。\n\n\n\n\n\n虽然二次规划的细节超出了本书的范围，但这里有一些点是必须提及的。优化问题 (4.7) 通过求解一个对偶问题来解决，在对偶问题中，目标函数仅通过内积集合\
  \ `(x[i]^T x[j])^n[i, j = 1]` 于数据。求解该对偶问题可以得到长度为 `n` 的参数向量 `ψ = (ψ[1], …, ψ[n])`\
  \ 的估计，其性质为：仅当训练数据点 `(x[i], y[i])` 是支持向量时，`\\psi_i \\neq 0`。用对偶参数 `ψ` 表示，新特征向量 `X`\
  \ 的预测类别为：\n\n```\nsign(θ_0 + \\sum_{i=1}^n ψ_i y_i x_i^T X) = sign(θ_0 + \\sum_{i:(x_i,y_i)\
  \ \\text{ is support vector}} ψ_i y_i x_i^T X) = sign(θ_0 + ψ*T X)\n```\n\n![numbered\
  \ Display Equation](img/c04_M0106.gif)\n\n其中 `θ* = \\sum_{i:(x_i,y_i) \\text{ is\
  \ support vector}} ψ_i`![](img/c04_ILM0120.gif).\n\n如果类别不是线性可分的（如图 4.27。然而，通过引入松弛变量\
  \ (43)，可以满足 (4.5) 的弱化形式：\n\n```\nξ_i = max(0, 1 - y_i(θ_0 + ψ^T X))\n```\n\n![numbered\
  \ Display Equation](img/c04_M0107.gif)\n\n并将 (4.5) 改为：\n\n```\ny_i(θ_0 + ψ^T X)\
  \ \\geq 1 - ξ_i, ξ_i \\geq 0 for all i.\n```\n\n(4.8)![numbered Display Equation](img/c04_M0108.gif)![图\
  \ 4.27 图 4.25 和图 4.26 的数据，修改后使得类别不可线性可分。具有正松弛变量的数据用灰色箭头表示。实线上方的紫色点是具有松弛变量 \\xi_i\
  \ > 1 的数据，并被线性分类器分类错误。实线下方、虚线上方的紫色点，以及实线上方、虚线下方的橙色点，是具有松弛变量 0 < \\xi_i < 1 的数据：它们贡献了惩罚，但没有被分类错误。](img/c04f027.jpg)\n\
  \n**图 4.27** 图 4.25 和 4.26 的数据，修改后使得类别不可线性可分。具有正松弛变量的数据用灰色箭头表示。实线上方的紫色点是具有松弛变量 `ξ[i]`\
  \ > 1 的数据，并被线性分类器分类错误。实线下方、虚线上方的紫色点，以及实线上方、虚线下方的橙色点，是具有松弛变量 0 < `ξ[i]` < 1 的数据：它们贡献了惩罚，但没有被分类错误。\n\
  \n\n\n\n松弛变量 `ξ[*i*]` 是可以添加到 `y[i]*(θ[⋆] *x[i]* + θ[0])` 中的最小量，使得总和至少为 1：因此对于每个\
  \ `i`，要么 `y[i]*(θ[⋆] *x[i]* + θ[0]) ⩾ 1` 且 `ξ[*i*] = 0`，要么 `y[i]*(θ[⋆] *x[i]* +\
  \ θ[0]) + ξ[*i*] = 1` 且 `ξ[*i*] > 0`。如果 `ξ[*i*] > 0`，则数据点*超出间隔*。当且当 `ξ[*i*] > 1`\
  \ 时，数据点被分类边界 `H(θ[⋆], θ[0])` 分类错误。支持向量仍然寻求最大间隔分类器，允许某些数据点超出间隔甚至分类错误。优化问题 (4.7) 变为：\n\
  \n```\nminimize over θ*, θ0 and ξ1, ..., ξn:\n1/2 * |θ*|/2 + γ * ∑_{i=1}^n ξ_i\n\
  subject to, for all i:\ny_i(θ*x_i + θ0) ≧ 1 - ξ_i, ξ_i ≧ 0\n```\n\n(4.3) 其中 `γ ⩾\
  \ 0` 是一个调节参数。在这种情况下，支持向量是满足 (4.7) 取等式或满足 `ξ[i] > 0` 的训练数据点 `x[i], y[i]`。\n\n优化问题\
  \ (4.9) 有两个目标：最大化间隔（即最小化 `|θ[⋆]|`）以及最小化训练数据的“风险”函数 `∑ξ_i`。这两个目标需要同时满足，它们的相对权重由 `γ`\
  \ 决定。“损失”函数\n\n```\nmax(0, 1 - Y(θ*X + θ0))\n```\n\n(4.4) 对于位于分类边界正确侧且距离至少为 `1/|θ[⋆]|`\
  \ 的正确分类数据分配零惩罚。当从正确分类数据到边界超平面的距离从 `1/|θ[⋆]|` 变到 0 时，“损失”从 0 变为 1；当该数据点跨越边界平面并被分类错误时，“损失”随与边界的距离成比例增加。这通过将\
  \ (4.9) 重写为显式地表示的：\n\n```\nminimize over θ*, θ0 and ξ1, ..., ξn:\n1/2 * |θ*|/2 +\
  \ γ * ∑_{i=1}^n ξ_i\nsubject to, for all i:\ny_i(θ*x_i + θ0) ≧ 1 - ξ_i, ξ_i ≧ 0\n\
  ```\n\n(4.5)\n\n\n\n\n![Figure 4.28 The loss functions max (0, 1 − Y(θ⋆X + θ0))\
  \ which are applied to the blue data (blue surface, class Y = 1) and the purple\
  \ data (purple surface, class Y = −1) in the example of Figure 4.1. Training data\
  \ which are support vectors are shown as solid dots, while the rest are shown as\
