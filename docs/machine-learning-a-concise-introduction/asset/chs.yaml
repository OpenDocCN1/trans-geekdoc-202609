  \ 0–1 损失，因此在任何一点，贝叶斯分类器都会预测密度最高的类别（练习题 4.2）。被贝叶斯分类器分类为橙色、蓝色和紫色的点区域在右侧单元格中，类别边界用白色高亮。右侧单元格的阴影与数据的边缘密度\
  \ `P(*X*)` 成正比：明亮区域的错误对分类器风险的贡献比深色区域的错误更大。这些图用于与本章以及第 5 章和第 6 章中描述的行为图进行比较。该问题的贝叶斯风险为\
  \ 0.191705。\n\n## 4.4 似然方法\n\n假设来自第 *c* 类的数据是从样本空间上具有似然度（(9) `P(*X* | *Y* = *c*)`\
