  \ 用于区分类别 `c` 和类别 `d` 的二分类支持机根据 <displayedItem xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\"\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" id=\"c14-disp-0055\"\
  \ type=\"mathematics\" numbered=\"no\"><math display=\"block\" location=\"image\\\
  _n/c14\\_M0057.gif\"><mrow><mi var=\"monospace\">idx</mi><mo>=</mo><mi var=\"monospace\"\
  >c</mi><mo>(</mo><mn var=\"monospace\">0</mn><momo><mi var=\"monospace\">cumsum</mi><mo>(</mo><mi\
  \ var=\"monospace\">m</mi><mi>&#x0024;</mi><mi var=\"monospace\">nSV</mi><mo)</mo><mo)</mo></mrow></math></displayedItem>\
  \ 对新特征 `X` 进行决策，其中上标 (`c`, `d`) 表示训练好的对偶参数 <math xmlns=\"cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\"\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" id=\"c14-disp-0055\"\
  \ type=\"mathematics\" numbered=\"no\"><math display=\"block\" location=\"image\\\
  _n/c14\\_M0057.gif\"><mrow><mi var=\"monospace\">idx</mi><mo>=</mo><mi var=\"monospace\"\
  >c</mi><mo>(</mo><mn var=\"monospace\">0</mn><momo><mi var=\"monospace\">cumsum</mi><mo>(</mo><mi\
  \ var=\"monospace\">m</mi><mi>&#x0024;</mi><mi var=\"monospace\">nSV</mi><mo)</mo><mo)</mo></mrow></math></displayedItem>\
  \ \n\n\n\n\n\n在上述表达式中，求和可以在更大的向量集合上（因为除非 $x[i]$ 是 `c vs. d` 分类器的支持向量，否则 $\\psi^{((c,\
  \ d))}[i] = 0$），因此用于区分类 `c` 和类 `d` 的二分类支持向量根据以下公式做出决策：\n\n```math\nsign(\\theta⁰(c,d))\
  \ + \\sum_{i:x_i \\text{ is labeled } c \\text{ and is a support vector for at least\
  \ one classifier}} \\psi^i(c,d)y_i(c,d)K(x_i, X) + \\sum_{i:x_i \\text{ is labeled\
  \ } d \\text{ and is a support vector for at least one classifier}} \\psi^i(c,d)y_i(c,d)K(x_i,\
  \ X).\n```\n\n![numbered Display Equation](img/c14_M0061.gif)\n\n\n\n\n现在 `x[i]`\
  \ 被标记为类 `c` 是至少一个分类器的支持向量，当且仅当 $x_i = m\\$SV[j,\\]![](img/c14_ILM070.gif)对于某个 $j\
  \ \\in \\{m\\$nSV[idx[c]+1], \\dots, m\\$nSV[idx[c]+1]\\}$![](img/c14_ILM071.gif)。对应的值\
  \ $\\hat{\\varphi}_i(c,d)y_i(c,d)$![](img/c14_ILM072.gif)存储在矩阵 $m\\$coefs[j,c]$![](img/c14_ILM073.gif)中。同样，`x[i]`\
  \ 被标记为类 `d` 并是至少一个分类器的支持向量，当且仅当 $x_i = m\\$SV[j,\\]![](img/c14_ILM074.gif)对于某个 $j\
  \ \\in \\{m\\$nSV[idx[d]+1], \\dots, m\\$nSV[idx[d]+1]\\}$![](img/c14_ILM075.gif)。对应的值\
  \ $\\hat{\\varphi}_i(c,d)y_i(c,d)$![](img/c14_ILM076.gif)存储在矩阵 $m\\$coefs[j,d-1]$![](img/c14_ILM077.gif)中。([13])\
  \ 因此，训练用于区分类 `c` 和类 `d` 的二分类支持机（带有 `c` `d`）根据以下公式做出决策：\n\n$$\n\\begin{matrix}\n\\\
  begin{aligned}\n\\text{sign } & \\left(\\theta⁰(c,d) + \\sum_{j=m\\$nSV[idx[c]+1]}^{m\\\
  $nSV[idx[c]+1]} m\\$coefs[j,c] K(m\\$SV[j,],X)\\right) \\\\\n& + \\sum_{j=m\\$nSV[idx[d]+1]}^{m\\\
  $nSV[idx[d]+1]} m\\$coefs[j,d-1] K(m\\$SV[j,],X)\\right).\n\\end{aligned}\n\\end{matrix}\n\
  $$\n\n\n\n\n在线性支持向量机的情况下，`K`(`x[i]`, `X`) = `x[i]`^T`X`，区分类别 `c` 和类别 `d` 的训练分类器为：\n\
  \n```\nsign(theta⁰(c,d) + theta^(c,d)^T * X)\n```\n(images/c14_M0063.gif)\n\n其中\
  \ `theta^(c,d)` 是长度为 `m` 的向量：\n\n```\ntheta^(c,d) = sum_{j=mnSV[idx[c]+1]}^{mnSV[idx[c]+1]}\
  \ mcoefs[j,c] * mSV[j] + sum_{j=mnSV[idx[d]+1]}^{mnSV[idx[d]+1]} mcoefs[j,d-1] *\
  \ mSV[j]\n```\n(images/c14_M0064.gif)\n\n## 14.17 自助法聚合 (Bootstrap Aggregation)\n\
  \n以下两个函数实现了任何委员会方法（committee method）。`weighted.count()` 接收类别 `c`、标签向量 `v` 和权重向量\
  \ `w`（可以为正或负），并输出类别 `c` 的权重之和：\n\n```\nweighted.count = function(c, v, w) {\n  sum(w[v==c])\n\
  }\n```\n(images/c14_M0065.gif) `vote()` 结合了 `weighted.count()` 和 `max.col()`，输出一个类别标签，并在平局时随机决定：\n\
  \n```\nvote = function(v, w) {\n  votes = sapply(1:n, weighted.count, v, w)\n  return(max.col(t(votes)))\n\
  }\n```\n\nbagging、boosting 和 arcing 的委员会方法都可以使用树作为基学习器进行说明。*决策桩*（stump）是指受限于两个叶节点的树。以下函数应用\
  \ `rpart` 库来构建一个决策桩：\n\n```\nlibrary(rpart)\ntrain.stump = function(y, x, wt=NULL)\
  \ {\n  if(length(wt)==0) { wt=rep(1,length(y)) }\n  m = rpart(as.factor(y), data=x,\
  \ method=\"class\", maxdepth=1, cp=0, minsplit=2, weights=wt)\n  return(m)\n}\n\
  ```\n\n通过以下代码训练一个由 `L` 个袋装决策桩组成的委员会。虽然使用 `lapply()`（或 `mclapply()`，因为袋装分类器可以并行训练）会更有效，但我们使用了\
  \ for 循环来简化 bagging 代码与后续代码的比较。该代码块输出一个长度为 `L` 的决策桩列表 `committee`，和一个 `L` × `n`\
  \ 的矩阵 `oob`。如果训练数据（`x[i]`, `y[i]`）对于第 `l` 个分类器是袋（out-of-bag），则 `oob[l,i]` 是第 `l`\
  \ 个分类器对特征向量 `x[i]` 预测的类别。否则，`oob[l,i]` 是特殊的 R 值 NA，表示（`x[i]`, `y[i]`）对于第 `l` 个分类器是在袋（in-bag）（`votes()`\
  \ 函数会忽略 NA 值，因此使用 NA 作为袋内指示器可以简化袋外风险估计的实现）。\n\n\n\n```\nnbase = 1000; bagsize =\
  \ nt;\ncommittee = vector(“list”,nbase); oob = matrix(NA,nbase,nt);\nfor(i in 1:nbase)\
  \ {\n\tidx = sample(1:nt,bagsize,replace=TRUE);\n\tm = train.stump(tdat[idx,3],tdatDF[idx,]);\n\
  \tcommittee[[i]] = m;\n\toob[i,setdiff(1:nt,idx)] = predict(m,newdata=tdatDF[-idx,],\n\
  type=“class”);\n}\n```\n\n袋分类器（bagged classifier）的参数是使用的分类器数量 `L` 以及训练每个分类器的自助样本（bootstrap\
  \ sample）的大小（当然，还有分类器的选择以及它可能使用的任何参数）。如第 6 节所述，自助样本的大小可能非常重要，可以通过最小化袋外（out-of-bag）风险的估计来选择，该估计通过以下代码计算。\n\
  \n```\npred.oob = apply(oob,2,vote,w=rep(1,nbase));\nerrs = pred.oob!=tdat[,3];\
  \ risk.oob = mean(errs);\n```\n\n一旦选定了 `L = nbase` 和 `bagsize`，训练好的袋分类器就可以应用于新数据：\n\
  \n```\npred.stumps = do.call(rbind,lapply(committee,predict,\nnewdata=edatDF,type=“class”));\n\
  pred.class = apply(pred.stumps,2,vote,w=rep(1,nbase));\nrisk.test(pred.class);\n\
  ```\n\n## 14.18 Boosting（第 6.6 节）\n\n以下代码实现了一个由 `L = nbase` 个提升桩（boosted stumps）组成的分类器。它使用了与袋算法代码相同的\
  \ R 结构，其他部分是图 6.7 所示 Adaboost 伪代码的翻译，并使用了第 6.6 节描述的 Zhu 等人（2009）的多分类推广。\n\n```\n\
  nbase = 1000; committee = vector(“list”,nbase);\ncommittee.risk = rep(NA,nbase);\
  \ data.weights = rep(1/nt,nt);\nfor(i in 1:nbase) {\nm = train.stump(tdat[,3],tdatDF,data.weights);\n\
  committee[[i]] = m;\npred.class = predict(m,tdatDF,type=“class”);\nidx = which(pred.class!=tdat[,3]);\n\
  committee.risk[i] = risk = sum(data.weights[idx]);\ndata.weights[idx] = data.weights[idx]\
  \ * (1-risk)/risk *\n(nc-1);\ndata.weights = data.weights/sum(data.weights);\n}\n\
  ```\n\n应用训练好的提升分类器与应用袋分类器类似，但单个桩以不同的权重进行投票：\n\n```\npred.stumps = do.call(rbind,lapply(committee,predict,\n\
  newdata=edatDF,type=“class”));\ncommittee.weights = log((1-committee.risk)/committee.risk*\n\
  (nc-1));\npred.class = apply(pred.stumps,2,vote,w=committee.weights);\nrisk.test(pred.class);\n\
  ```\n\n## 14.19 Arcing（第 6.7 节）\n\n在实现代码方面，boosting 和 arcing 之间只有微小的区别。arcing 的实现与上述\
  \ boosting 完全相同，只是提升循环中确定性的第一行：\n\n```\nm = train.stump(tdat[,3],tdatDF,data.weights);\n\
  ```\n\n被一个随机过程所替换：\n\n```\nidx = sample(1:nt,nt,replace=TRUE,prob=data.weights);\n\
  m = train.stump(tdat[idx,3],tdatDF[idx,]);\n```\n\n## 14.20 随机森林（第 6.5 节）\n\n随机森林是使用\
  \ `randomForest` 库中的 `randomForest()` 函数进行训练的：\n\n```\nlibrary(randomForest);\n\
  m = randomForest(as.factor(tdat[,3]),data=tdat[,1:2],ntree=1000);\n```\n\n选择随机森林等同于训练若干（`ntree`）过拟合树。森林中的第\
  \ `i` 棵树可以通过函数 `getTree(m, i)`（对于 `i=1, ..., ntree`）查看。当所有特征都是实值时，`getTree()` 报告的随机森林树表示为\
  \ `k` × 6 的矩阵：\n\n$$\n\\begin{bmatrix}\nt_{1,1} & t_{1,2} & \\dots & t_{1,6} \\\\\
  \n\\vdots & \\vdots & \\ddots & \\vdots \\\\\nt_{k,1} & t_{k,2} & \\dots & t_{k,6}\n\
  \\end{bmatrix}\n$$\n\n其中 `k` 是树的节点总数（包括内部节点和叶子节点）。树的每个节点对应矩阵的一行，其\n\n\n\n\n对于第 `i`\
  \ 棵树的第 `j` 个节点，执行 `row.names(getTree(m, i)) = j`：\n\n```math\nt_{j,1} = 左子代节点在 {1,\
  \ ..., k} 中的索引，如果是叶子节点则为 0\nt_{j,2} = 右子代节点在 {1, ..., k} 中的索引，如果是叶子节点则为 0\nt_{j,3}\
  \ = 节点进行划分的变量的索引 i ∈ {1, ..., m}，如果是叶子节点则为 0\nt_{j,4} = 用于划分的阈值 τ，如果是叶子节点则为 0\n\
  t_{j,5} = 如果是内部节点则为 1，如果是叶子节点则为 -1\nt_{j,6} = 节点预测的类别 c ∈ {1, ..., C}，如果是内部节点则为\
  \ 0。\n```\n\n\n\n\n\n“左”和“右”术语定义为：如果第 `j` 个节点是内部节点，则进入该节点的特征向量 `X` 在满足 $X_{t,4}\
  \ \\le t_{j,5}$ 时被传递给左子节点，在满足 $X_{t,4} > t_{j,5}$ 时被传递给右子节点。因此，图 4.22 所示的树可以用此矩阵形式表示：\n\
  \n$$\n\\begin{bmatrix}\n2 & 3 & 1 & -0.311 & 1 & 0 \\\\\n4 & 5 & 2 & -0.197 & 1\
  \ & 0 \\\\\n6 & 7 & 2 & 0.167 & 1 & 0 \\\\\n0 & 0 & 0 & 0.000-1.2(\\text{blue})\
  \ & 0 & 0 \\\\\n8 & 9 & 1 & -1.801 & 1 & 0 \\\\\n0 & 0 & 0 & 0.000-1.3(\\text{purple})\
  \ & 0 & 0 \\\\\n0 & 0 & 0 & 0.000-1.1(\\text{orange}) & 0 & 0 \\\\\n0 & 0 & 0 &\
  \ 0.000-1.2(\\text{blue}) & 0 & 0\n\\end{bmatrix}\n$$\n\n由于随机森林基于自助采样法（bagging），可以使用袋外（out-of-bag）风险估计。袋外混淆矩阵存储在\
  \ `m$confusion` 中，混淆矩阵以及关于 0–1 损失的袋外风险估计 (15) 可以从此处处获取：\n\n```\nprint(m);\n```\n\
  \n使用函数 `predict()` 通过训练好的随机森林 `m` 对测试数据进行预测：\n\n```\npred.class = predict(m,edat);\n\
  risk.test(pred.class);\n```\n\n# Notes\n\n## 符号列表\n\n以下符号基本保持一致。\n\n| ![images/bapp01_ILM0001.gif}\
