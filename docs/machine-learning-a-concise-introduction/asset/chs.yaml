  http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c12_ILM041.gif\"><mrow><mo>(</mo><msub>S</mi><mn>2</msub><mo>&#x265;</mi><msub>S</mi><mn>1</msub></mo)</mo></math>![](img/c12_ILM041.gif)`。**提示：**\
  \ 通过 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
