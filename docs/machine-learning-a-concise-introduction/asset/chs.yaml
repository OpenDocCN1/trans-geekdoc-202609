  n_{c't} > 0\n```\n且对于所有 `c` ≠ `c′`，有 `n^t[c] = 0`。在叶子节点 `t` 上预测类别 `c′` 的风险为：\n\n\
  ```math\nR(c′ | X \\in t) = \\frac{n_{c't}}{n_{c't}} P(Y=c') + \\sum_{d \\neq c'}\
