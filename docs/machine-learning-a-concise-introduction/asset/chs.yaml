  ><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>c</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo>)</mo></mrow><mo>=</mo><mfrac><mrow><mo\
  \ form=\"prefix\">exp</mo><mo>(</mo><mi>T</mi><mrow><mo>(</mo><mi>X</mi><mo,</mo><msub><mover\
  \ accent=\"true\"><mi>&#x03b8;</mi><mo>^</mo></mover><mi>c</msub><mo>)</mo></mrow><mo>)</mo></mrow><mrow><msubsup><mo>&#x2211;</mo><mrow><mi>d</mi><mo>=</mo><mn>1</mn></mrow><mi>C</mi></msubsup><mo\
  \ form=\"prefix\">exp</mo><mrow><mo>(</mo><mi>T</mi><mrow><mo>(</mo><mi>X</mi><mo,</mo><msub><mover\
  \ accent=\"true\"><mi>&#x03b8;</mi><mo>^</mo></mover><mi>d</msub><mo>)</mo></mrow><mo>)</mo></mrow></mrow></mfrac><mo>.</mo></mrow></math></displayedItem>\n\
  \n![带编号的公式](img/c04_M0056.gif)\n\n### 练习 4.11 证明通过极大化上述多项分布似然概率来估计 θ，等同于通过交叉熵损失（定义在第\
  \ 2 章中）最小化训练风险来估计 θ。\n\n与线性判别分析一样，逻辑回归产生的估计类别边界是分段线性的。在图 4.1 数据上训练的逻辑回归所做的分类决策如图图\
