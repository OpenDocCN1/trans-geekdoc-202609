  \n![编号公式](img/c04_M0033.gif)\n\n其中 `K[1]`、…… `K[m]` 是单变量核函数，`x[j]` 和 `x[i]` 分别表示\
  \ `x` 的第 `j` 个坐标，带宽参数 `h[c, j]` 允许取决于类别 `c` 以及坐标 `j`。当特征尺度非常不同时，这非常有用。m 维高斯核是 `m`\
  \ 个一维高斯核的积。\n\n常识认为核函数的选择没有良好的带宽选择那么重要，尽管已经对核函数进行了理论上的比较(15)（Epanechnikov, 1967;\
  \ Scott, 1992）。针对近似最优带宽的选择开发了一些经验法则，例如*正态参考规则*（Scott, 1992），对于乘积核，该规则为：<displayedItem\
