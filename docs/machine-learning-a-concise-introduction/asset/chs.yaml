  \n```math\nTSS = MSS + RSS.\n```\n\n### 练习 3.9\n在这里，值 `1` 和 `-1` 分别是任何正数和负数的占位符。它们必须相等：\n\
  1. `θ[a] = -1` 且 `θ[c] = 1`。\n2. `θ[c] = 1` 且 `θ[2c] = -1`。\n3. `θ[a] = 1`，`θ[c]\
  \ = 1` 且 `θ[a, c] = -1`。\n4. `θ[a] = 1`，`θ[c] = 1` 且 `θ[a, c] = 1`。\n5. 截距参数 `θ[0]`\
  \ 衡量一个人平均对食物的喜爱程度。\n6. 将连续特征 `x[b]` 替换为二值特征 `x[b] > 0`。使 `θ[b]` 取一个很大的负数。\n\n###\
  \ 练习 4.1\n令 `P(Y | X)` 为某种条件分布，其性质为：\n```math\n0 < P(Y | X) < 1\n```\n(images/bapp02_M018.gif)\
  \ 对于至少一个 (X, Y) 取值。关于该条件分布的贝叶斯分类器为：\n\n```math\nf^Bayes,P(x) = argmin_{c ∈ {1, ...,\
  \ C}} RP(c | X = x) = argmin_{c ∈ {1, ..., C}} ∑_{d=1}^C L(d, c) P(Y = d | X)\n\
  ```\n(images/bapp02_M019.gif) 其中符号强调对的依赖关系。令\n```math\nP~(Y | X)\n```\n(images/bapp02_M010.gif)\
  \ 为在以下\n```math\nf^Bayes,P(X)\n```\n(images/bapp02_M011.gif) 处赋予概率 1 的概率分布，即：\n\n\
  ```math\nP~(Y = y | X = x) = \\begin{cases} 1 & y = f^Bayes,P(x) \\\\ 0 & else \\\
  end{cases}.\n```\n(images/bapp02_M0020.gif)\n\n\n\n\n那么对于所有 $x \\in X$，$f_{Bayes,P}(x)\
  \ = f_{Bayes,P^\\circ}(x)$，但 $P^\\circ \\neq P$（因为 $P^\\circ(Y|X)$ 始终为 0 或 1，而 $P(Y|X)$\
  \ 则不是）。\n\n### 练习 4.3\n练习 2.2 第 (A) 部分解为：\n\n```\nP(Y=1|X) = \\int e^{-\\frac{1}{2}(X-\\\
  mu_1)²}p\nP(Y=2|X) = \\int e^{-\\frac{1}{2}(X-\\mu_2)²}(1-p),\n```\n\n因此贝叶斯分类器为\n\
