  \n\n\n\n以及 `radial basis function`，\n\n```\n\\sigma(v) = \\exp(-v²),\n```\n\n![编号显示方程](img/c04_M0060.gif)\n\
  \n它是指示函数 $[v = 0]$ 的软版本。这些激活函数的图如图图 4.15。为了起起见，在本节的剩余部分中，我们将使用 sigmoid 函数\n```\n\
  \\sigma(v) = \\frac{1}{1+e^{-v}}\n```\n![](img/c04_ILM0073.gif)\n\n### 4.7.2 神经元\n\
  \n神经网络的基本单元是`neuron`（神经元），它是激活函数 $\\sigma$ 和线性映射的组合：\n```\n\\mathbb{R}^k \\to \\\
  mathbb{R}\n```\n由长度为 $(k + 1)$ 的参数向量 $\\theta = (\\theta[0], \\theta[1], \\dots,\
  \ \\theta[k])$ 指定。有时将参数向量考虑为标量参数 $\\theta[0]$ 和长度为 $k$ 的向量 $\\theta^{\\star} = (\\\
  theta[1], \\dots, \\theta[k])$ 的拼接会非常方便。那么，一个神经元的组合为：\n\n```\n\\sigma([\\theta_0,\
  \ \\theta_1, \\dots, \\theta_k], \\begin{bmatrix} 1 \\\\ v_1 \\\\ \\vdots \\\\ v_k\
  \ \\end{bmatrix}) = \\sigma(\\theta_0 + \\theta^{\\star}v) = \\sigma(\\theta_0 +\
  \ \\sum_{i=1}^k \\theta_i v_i),\n```\n![编号显示方程](img/c04_M0061.gif)其中向量 $v = (v[1],\
  \ \\dots, v[k])$ 是神经元的输入。当 $\\theta^{\\star}$ 的长度与其方向分离时，神经元的几何意义变得更加显而：\n```\n\\\
  hat{\\theta} = \\frac{\\theta^{\\star}}{\\|\\theta^{\\star}\\|}\n```\n![](img/c04_ILM0075.gif)。单位向量\n\
  ```\n\\hat{\\theta} = \\frac{\\theta^{\\star}}{\\|\\theta^{\\star}\\|}\n```\n![](img/c04_ILM0076.gif)、$\\\
  |\\theta^{\\star}\\|$ 和标量参数 $\\theta[0]$ 定义了 $\\mathbb{R}^k$ 中的一个超平面 $H(\\theta^{\\\
  star}, \\theta[0])$，\n![](img/c04_ILM0077.gif)，\n\n```\nH(\\theta^{\\star}, \\theta[0])\
  \ = \\{v : \\theta_0 + \\theta^{\\star}v = 0\\} = \\{v : \\frac{\\theta_0}{\\|\\\
  theta^{\\star}\\|} + \\frac{\\theta^{\\star}}{\\|\\theta^{\\star}\\|}v = 0\\} =\
  \ \\{v : \\frac{\\theta_0}{\\|\\theta^{\\star}\\|} + \\hat{\\theta}v = 0\\} = \\\
  {v : v = -\\frac{\\theta_0}{\\|\\theta^{\\star}\\|}\\hat{\\theta}\\}.\n```\n![编号显示方程](img/c04_M0062.gif)\n\
  \n\n\n\n\n上述神经元是指示函数的软版本\n\n```\n\\left[\\frac{\\frac{\\theta^*}{\\|\\theta^*\\\
  |}}{\\|\\frac{\\theta^*}{\\|\\theta^*\\|}\\|}v \\geq -\\frac{\\theta_0}{\\|\\theta_0\\\
  |}\\right]\n```\n\n![带编号的公式](img/c04_M0063.gif)\n\n当输入 `v` 位于超平面 `H(θ[⋆], θ[0])`\
  \ 的 `θ[⋆]` 方向时，其值为 1；当输入 `v` 位于超平面 `H(θ[⋆], θ[0])` 的 `- θ[⋆]` 方向时，其值为 0。这种情况的几何结构在图\
  \ 4.16 中所示。\n\n![图 4.16 对于任意标量 θ0 和长度为 k 的实向量 θ⋆，该点集是 $\\mathbb{R}^k$ 中的一个超平面。该超平面位于距离原点的距离处，要么在\
  \ θ⋆ 方向（如果 $-\\frac{\\theta_0}{\\|\\theta_0\\|} > 0$，即 θ0 < 0），要么在 - θ⋆ 方向（如果 $-\\\
  frac{\\theta_0}{\\|\\theta_0\\|} < 0$，即 θ0 > 0）。超平面 H(θ⋆, θ0) 将空间分为两个半空间。神经元 σ(θ0\
  \ + θ⋆v) 随着 v 沿着 θ⋆ 方向远离 H(θ⋆, θ0) 而从 $1/2$ 增加，最终趋于值 1。神经元 σ(θ0 + θ⋆v) 随着 v 沿着 -\
  \ θ⋆ 方向远离 H(θ⋆, θ0) 而从 $1/2$ 减小，最终趋于值 0。这种符号表示法将在第 4.9 节再次使用。](img/c04f016.jpg)\n\
  \n**图 4.16**](#c04.xhtml#figureanchor4-16) 对于任意标量 `θ[0]` 和长度为 `k` 的实向量 `θ[⋆]`，点集\
  \ `H(θ[⋆], θ[0]) = {v \\in \\mathbb{R}^k : \\theta_0 + \\theta^*v = 0}` 是 $\\mathbb{R}^k$\
  \ 中的一个超平面。该超平面距离原点 $\\frac{\\theta_0|}{\\|\\theta_0\\|}$，要么在 `θ[⋆]` 方向（如果 $-\\frac{\\\
  theta_0}{\\|\\theta_0\\|} > 0$，即 `θ[0] < 0`），要么在 `- θ[⋆]` 方向（如果 $-\\frac{\\theta_0}{\\\
  |\\theta_0\\|} < 0$，即 `θ[0] > 0`）。超平面 `H(θ[⋆], θ[0])` 将 $\\mathbb{R}^k$ 分为两个半空间。神经元\
  \ `σ(θ0 + θ⋆v)` 随着 `v` 沿着 `θ[⋆]` 方向远离 `H(θ[⋆], θ[0])` 而从 $1/2$ 增加，最终趋于值 1。神经元 `σ(θ0\
  \ + θ⋆v)` 随着 `v` 沿着 `- θ[⋆]` 方向远离 `H(θ[⋆], θ[0])` 而从 $1/2$ 减小，最终趋于值 0。这种符号表示法将在第\
  \ 4.9 节再次使用。\n\n长度为 `k` 的向量 `\\|θ[⋆\\|` 的长度被称为*激活率*（activation rate），它影响神经元对其输入的敏感程度。如果\
  \ `\\|θ[⋆]\\|` 很大，那么当 `v` 跨越 `H(θ[⋆], θ[0])` 从一侧到另一侧时，神经元的值会从接近 0（或 1）迅速变为接近 1（或\
  \ 0）——因此神经元紧密近似指示函数。如果 `\\|θ[⋆]\\|` 很小，当 `v` 从 `H(θ[⋆], θ[0])` 的一侧移动到另一侧时，神经元的值变化缓慢——因此对于大量的\
  \ `v`，神经元近似为关于 `v` 的梯度为 `θ[⋆]` 的线性函数。\n\n### 4.7.3 神经网络\n\n*神经网络*将多个神经元组合成一个函数。28\
  \ 神经网络中的某些神经元使用特征向量作为输入，另一些使用其他神经元的输出作为输入，还有一些可能将两者结合。29 神经网络的参数是神经元的参数（包括神经元的连接方式）以及类似于逻辑回归中定义的线性*输出层*的参数，\n\
  \n```\nT(v, θ) = θ_0 + θ*v\n```\n\n![带编号的公式](img/c04_M0064.gif)\n\n与逻辑回归不同，没有任何线性输出函数被限制为零。神经元通常根据它们接收的输入类型分层。神经元的*输入层*接收特征向量作为输入，而输入层或输出层之外任何层都被称为神经元的*隐藏层*。\n\
  \n\n\n\n\n图 4.17 展示了一个包含 `C` 个线性函数 `T[1]`、……`T[C]` 的输出层，以及一个包含 `N` 个神经元 `Z[1]`、……`Z[N]`\
  \ 的单隐藏层的神经网络。隐藏层中的每个神经元都接收整个特征向量 `X` = (`X[1]`、……`X[m]`）作为输入。输出层中的每个线性函数都接收隐藏层神经元取值的整个向量\
  \ `Z` = (`Z[1]`、……`Z[N]`）作为输入。该神经网络的参数可以写成两个矩阵：\n\n```\n\\theta^{(1)} = \\begin{bmatrix}\
  \ \\theta_{1,0} & \\theta_{1,1} & \\dots & \\theta_{1,m} \\\\ \\theta_{2,0} & \\\
  theta_{2,1} & \\dots & \\theta_{2,m} \\\\ \\vdots & \\vdots & \\dots & \\vdots \\\
  \\ \\theta_{N,0} & \\theta_{N,1} & \\dots & \\theta_{N,m} \\end{bmatrix}\n```\n\n\
  ![numbered Display Equation](img/c04_M0065.gif)\n\n它决定了隐藏层神经元对特征向量的响应，以及\n\n```\n\
  \\theta^{(2)} = \\begin{bmatrix} \\theta_{1,0} & \\theta_{1,1} & \\dots & \\theta_{1,N}\
  \ \\\\ \\theta_{2,0} & \\theta_{2,1} & \\dots & \\theta_{2,N} \\\\ \\vdots & \\\
  vdots & \\dots & \\vdots \\\\ \\theta_{C,0} & \\theta_{C,1} & \\dots & \\theta_{C,N}\
  \ \\end{bmatrix}\n```\n\n![numbered Display Equation](img/c04_M0066.gif)\n\n它决定了输出层函数对隐藏层输出向量的响应。参数的总数为\
  \ `N(m + 1)` + `C(N + 1)`。隐藏层中第 `i` 个神经元的输出为：\n\n```\nZ_i = \\sigma([\\theta_{i,0}^{(1)},\
  \ \\theta_{i,1}^{(1)}, \\dots, \\theta_{i,m}^{(1)}] \\cdot [1, X_1, \\dots, X_m]^T)\
  \ = \\sigma(\\theta_{i,0}^{(1)} + \\sum_{j=1}^m \\theta_{i,j}^{(1)} X_j)\n```\n\n\
  ![numbered Display Equation](img/c04_M0067.gif)\n\n\n\n\n\n对向量逐分元素应用 $\\sigma$，则整个隐藏层可以写为：\n\
  \n$$\n\\begin{bmatrix} Z_1 \\\\ \\vdots \\\\ Z_N \\end{bmatrix} = \\sigma \\left(\
  \ \\begin{bmatrix} \\theta_{1,0}^{(1)} & \\theta_{1,1}^{(1)} & \\dots & \\theta_{1,m}^{(1)}\
  \ \\\\ \\theta_{2,0}^{(1)} & \\theta_{2,1}^{(1)} & \\dots & \\theta_{2,m}^{(1)}\
  \ \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ \\theta_{N,0}^{(1)} & \\theta_{N,1}^{(1)}\
  \ & \\dots & \\theta_{N,m}^{(1)} \\end{bmatrix} \\begin{bmatrix} X_1 \\\\ X_2 \\\
  \\ \\vdots \\\\ X_m \\end{bmatrix} \\right)\n$$\n\n或者，使用更紧凑的记法，用 $\\theta^{(1)}_0$\
  \ 表示 $\\theta^{(1)}$ 的第一列，用 $\\theta^{(1)}*$ 表示 $\\theta^{(1)}$ 的其余部分，如下：\n$$\n\
  Z = \\sigma(\\theta^{(1)}_0 + \\theta^{(1)}*)\n$$\n\n![numbered Display Equation](img/c04_M068.gif)\n\
