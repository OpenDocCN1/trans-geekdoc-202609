  \n![图 4.34 表 4.2 数据的可视化表示。对于每个方法，估计风险以黑点表示，红线表示标准误差。](img/c4f34.jpg)\n\n**图 4.34**\
  \ 表 4.2 数据的可视化表示。对于每个方法，估计风险以黑点表示，红线表示标准误差。\n\n# 5 偏差-方差权衡\n\n> 能力过大（能够精确拟合训练数据）的机器[分类器]就像一个拥有摄影记忆的植物学家，面对一个新的树时，她认为它不是树，因为叶子数量与她见过的不同；而能力不足的机器就像植物学家的懒惰兄弟，只要它是绿色的，他就会宣布它是树。\n\
  >\n> ——Christopher J. C. Burges，《数据挖掘与知识发现》，1998\n\n回顾第 2 章，近似方法是一个将训练数据集 `S` 映射到近似值\
  \ `f^S` 的函数，而近似方法的风险是相对于新数据和训练数据集的期望损失：\n\n```\nR = E_{S,X}[L(Y, f^S)]\n```\n\n\
  当使用平方误差损失时，近似方法的风险具有启发性的分解方式。具体而言，在平方误差损失下，风险可以分解为三个非负项之和，其中一个我们无法改变，另外两个是可以影响的。正如我们将在第\
  \ 6 章中看到的，将风险最小化看作两个非负项之和的最小化，并对这两个项有有用的解释，极大地影响了近似方法的设计。尽管作者认为风险分解的问题尚未解决，但对已知知识的直观理解对算法设计具有不可否定的益处。\n\
  \n## 5.1 平方误差损失\n\n在加噪声回归问题中，`Y = f(X) + E`，其中 `E = 0`，因此 `Y|X = f(X)`。在这种设置下，在平方误差损失下，风险分解为：\n\
  \n```\nR = E_{S,X,Y}[(Y - f^S)²] = E_{X,Y}[(Y - f(X))²] + E_X[(f(X) - E_S f^S)²]\
  \ + E_X[Var_S f^S(X)]\n```\n\n(5.1)\n\n(Geman et al., 1992).\n\n\n\n\n该分解中的三个术语值得用文字进行描述。第一个：\n\
  \n```\nE_X[(Y - f(X))²]\n```\n\n（编号为显示方程）是当 `X` 处的预测值为 `f(X)` 时所遭受的期望损失。在平方误差损失函数下，这是最小风险预测，因此\
  \ `f(X)` 是*贝叶斯回归器*，上述项为贝叶斯风险：在此语境下，它被称为*固有风险*或*不可归约风险*，表明问题本身存在如此巨大的风险。它也等于 `E[X][Var[Y|X]]`。请注意，它不依赖于对\
  \ `f` 的任何近似。\n\n表达式 `E_S[f^S(x)] - f(x)` 被称为近似方法（在 `x` 处）的*偏差*。第二个项：\n\n```\nE_X[(f(X)\
  \ - E_S[f^S(X)])²]\n```\n\n是平方偏差的期望（关于 `X` 的分布）。它衡量了平均近似值 `E_S[f^S]` 在 `X` 分布上平均与真实函数\
  \ `f` 的接近程度。方差 `Var_S[f^S(X)]` 衡量了特定近似值 `f^S` 与平均近似值 `E_S[f^S]` 之间的平均平方距离。因此，第三项：\n\
  \n```\nE_X[Var_S[f^S(X)]]\n```\n\n衡量了该方法产生的近似值 `f^S` 与平均近似值 `E_S[f^S]` 之间的平均平方距离（关于\
  \ `X` 的分布）。\n\n### 练习 5.1\n证明 (5.1)，假设 `E[Y|X] = f(X)` 且训练集 `S` 与进行预测的点 `(X, Y)`\
  \ 独立。\n\n**提示：** 将 `Y - f^S(X)` 写为：\n\n```\nY - f^S(X) = Y - f(X) + f(X) - E_S[f^S(X)]\
