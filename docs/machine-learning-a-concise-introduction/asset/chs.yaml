  \ 9.6 k-Medoids\n\n数据的非相似性可以以多种方式扩展到数据集之间的非相似性。质心聚类法是一种将 `k-means` 推广到任意相似性的方法。质心聚类法要求数据具有相似性。\n\
  \n## 9.7 Agglomerative Clustering\n\n*凝聚类层次聚类*通过考虑数据的大小，产生所有 $k=1, \\dots, n$ 的\
  \ $k$ 个类。它通过计算所有类对之间的相似性并合并最不相似的类，直到只只有一个类，如图 9.4 所示。\n\n## 9.8 Divisive Hierarchical\
  \ Clustering\n\n*分裂类层次聚类*通过考虑数据的大小，产生所有 $k=1, \\dots, n$ 的 $k$ 个类。它从考虑所有数据为一个聚类开始，然后不断分裂类，直到所有类的大小为\
  \ 1，如图 9.5 所示。\n\n## 9.9 有多少个类？聚类的解释\n\n\n\n确定数据集中“真实”有多少个簇是一项统计推断，因此应该使用针对数据的统计模型来处理。处理这一问题的方法之一是拟合不同混合分量数量的高斯混合模型，并在适当的范围内选择概率最大的模型。这可以使用渐近近似（例如如第\
  \ 7.7  所示，选择贝叶斯信息准则最大的模型），或者使用显式的全贝叶斯程序，并通过可逆跳转马尔可夫链蒙特卡洛方法（Green, 1995）从簇数量的后验分布中进行采样。（3\
  \ 将统计推断方法扩展为适用于聚类的启发式方法，其估计数据中簇数量的方法如下：对于 `k` \\in {`k[1]`, `k[1] + 1`, …, `k[2]`}，使用\
  \ `k`-means 算法对数据 `x[1]`， …, `x[n]` 进行聚类，并计算 `distortion`（失真度）：\n\n```\nd^k = (1/mn)\
  \ * sum_{i=1 to n} |x_i - center of cluster which contains x_i|/2\n```\n\n![numbered\
  \ Display Equation](img/c09_M0011.gif)\n\nSugar–James 对数据中簇数量的估计为\n\n```\nargmax_{k\
  \ ∈ {k1+1, ..., k2}} (d^kc - d^{k-1}c), \n```\n\n![numbered Display Equation](img/c09_M0012.gif)\n\
  \n其中 `c` 是一个正数（Sugar and James (2003) 建议 `c = m/2`）。(images/c09_ILM0016.gif)\n\n\
  从层次化的聚类集中选择一个合理的聚类是一个被充分研究的问题：综述参见 Gan et al. (2007) 的第 17 章。一种基于非参数统计检验的方法如下：对数据\
  \ `x[1]`， …, `x[n]` 的聚类将所有成对不相似性的集合进行划分：\n\n```\nd^k = (1/mn) * sum_{i=1 to n} |x_i\
  \ - center of cluster which contains x_i|/2\n```\n\n（注：为了清晰起见，上述数学公式根据提供的 XML/文本结构进行了重构）。\n\
  \n## 9.10 不可能定理\n\n聚类有时被认为是一个“软性”学科，这是因为缺乏明确、严谨的目标陈述（相比之下，预测建模的风险最小化目标相对清晰）。聚类也可以是严谨的、通性陈述的主体：我们以\
  \ Kleinberg (2002) 的一个卓越定理作为结束。\n\nKleinberg 定义了聚类算法的三个属性，这些属性似乎都是理想的：\n\n- *尺度不变性（Scale-invariance）*：当不相似性矩阵被正常数缩放时，算法的输出保持不变；\n\
  - *丰富性（Richness）*：对于 *n* 个数据点的任意划分，都存在某个 *n* × *n* 不相似性矩阵，能够使算法产生该划分；\n- *一致性（Consistency）*：给定算法产生的数据聚类，减小同一簇内点之间的不相似性并增加不同簇之间点之间的不相似性，再次运行算法将*不会*导致簇的改变。\n\
  \n他随后证明了三个定理：\n\n**定理 9.1 Kleinberg 不可能定理。** *对于 *n* \\geqslant 2，没有任何聚类算法能同时满足这三个属性。*\n\
  \n**定理 9.2** *对于这三个属性中的任意两个，可以为单链凝聚聚类定义一个停止条件（Kleinberg 显式地给出了该条件），使得生成的算法满足这两个属性。*\n\
  \n**定理 9.3** *一类通基于质心的聚类算法（包括 k-means 和 k-medoids，且它们显然不满足丰富性属性）也不满足一致性属性。*\n\n\
  批评者指出，Kleinberg 的一致性属性并不一定是理想的，如图 9.6 所示。\n\n\n\n\n\n![图 9.6 左侧单元格显示了一个二维数据集。中间单元格显示了一个应用于该数据集的函数，其特性是：数据集图像（红色所示）中任意两点之间的距离小于原始数据集（黑色所示）中对应两点之间的距离。数据集的图像在右侧单元格中。该函数将显然属于一簇的数据转换为显然属于两个簇的数据，但没有任何一种聚类算法能够检测到这种变化并在\
  \ Kleinberg 的意义上是 `consistent` 的。](img/c09f006.jpg)\n\n**图 9.6** 左侧单元格显示了一个二维数据集。中间单元格显示了一个应用于该数据集的函数，其特性是：数据集图像（红色所示）中任意两点之间的距离小于原始数据集（黑色所示）中对应两点之间的距离。数据集的图像在右侧单元格中。该函数将显然属于一簇的数据转换为显然属于两个簇的数据，但没有任何一种聚类算法能够检测到这种变化并在\
  \ Kleinberg 的意义上是 `consistent` 的。\n\n## 注释\n\n# 10 优化\n\n> 我羡慕你的自信和从容，但我极其怀疑你判断的准确性。\n\
  \n> —Alcon 来自 Edward E. Smith 的《镜战士第二阶段》（*Second Stage Lensmen*），1943\n\n第 4 章中的许多预测建模技术以及第\
  \ 9 章中的聚类方法都需要求解（至少是近似求解）某些数值优化问题。本介绍了几类优化技术。\n\n优化问题是指：给定一个已知的^(1) *目标函数* `g:Rm→R`，找到\
  \ `g` 的*最小化点*^(2) `ω⋆`，定义为 `g(ω⋆) = min_{ω∈Rm} g(ω)`。最小化可能是可能是唯一的也可能不是。在某些情况下，对最小值\
  \ `g(ω⋆)` 感感兴趣，但在第 3 章、第 4 章、第 6 章和第 9 章中，我们通常更关注最小化点 `ω⋆`。\n\n本章的所有方法都是迭代的：也就是说，它们从最小化点的初始估计值\
  \ `ω¹` 开始，对于每一次迭代 `t` = 1, 2, 3, …,，它们都会构造一个新的近似值 `ω(*t* + 1)`。新的近似值可能比上一个好，也可能不好。通常，这些方法会一直运行到达到迭代上限，或者检测到\
  \ `g` 的定义域和值域均收敛，例如通过：\n\n```\nmax_{i=1,...,m} |ω(t+1) - ω(t)|\n```\n\n当目标函数可微分时，还可以对梯度的范数\
  \ `∇g(ωt)` 应用收敛准则：\n\n```\n|∇g(ωt)| < threshold\n```\n\n在本章中 `g` 的定义域是连续的，但这里介绍的许多方法都有离散域的对应算法。\n\
  \n## 10.1 拟牛顿法\n\n### 10.1.1 求零点的牛顿法\n\n![图 10.1 牛顿法求零点的几何结构。从 ω 轴上的估计值 ωt 开始，垂直移动到曲线\
  \ (ω, g(ω))上的点 (ωt, g(ωt))，然后从 (ωt, g(ωt)) 出发沿沿切线并向实线的射线离开。射线击中 ω 轴的点是新的估计值 ωt +\
  \ 1。](img/c10f001.jpg)\n\n\n\n\n\n我们从牛顿法开始，该方法用于近似寻找可微函数 $g: \\mathbb{R} \\to \\\
  mathbb{R}$ 的零点。目标是找到一个 $\\omega^\\star \\in \\mathbb{R}$ 使得 $g(\\omega^\\star) =\
  \ 0$，从一个初始且假设错误的点估计值 $\\omega¹$ 开始。从当前的估计值 $\\omega^t$ 出，牛顿法可以产生一个新的估计值：\n\n```\n\
  \\omega^{t+1} = \\omega^t - \\frac{g(\\omega^t)}{g'(\\omega^t)}\n```\n\n以这种方式更新估计值的几何动机见图\
  \ 10.1。牛顿法并不总是收敛的。取决于函数 $g$ 和起始点 $\\omega¹$ 的选择，它可能会发散到 $\\pm \\infty$，或者陷入在无限循环中，反复访问一组有限的点集。\n\
  \n### 10.1.2 用于优化的牛顿法\n\n用于优化可微函数 $g$ 的牛顿法是寻找 $g$ 梯度的零点。让 $\\nabla g$ 表示 $g$ 的梯度，让\
  \ $Hg$ 表示 $g$ 的海森矩阵，并给定一个起始点 $\\omega¹ \\in \\mathbb{R}^m$。从当前的估计值 $\\omega^t$ 出，牛顿法可以产生一个新的估计值：\n\
  \n```\n\\omega^{t+1} = \\omega^t - \\rho H(\\omega^t)^{-1}\\nabla g(\\omega^t)\n\
  ```\n\n其中 $\\rho \\in (0, 1]$ 是一个参数（称为`学习率`），可用于限制步长。\n\n计算逆海森矩阵 $H(\\omega^t)^{-1}$\
  \ 可能代价高昂的，而且在数值上可能是不稳定的。此外，在 $g$ 的局部最小值之外，海森矩阵 $H(\\omega^t)$ 可能不是正定的，这意味着在从 $\\\
  omega^t$ 出发、沿 $-H(\\omega^t)^{-1}\\nabla g(\\omega^t)$ 方向的射线上，可能不存在某一点的 $g$ 值比 $g(\\\
  omega^t)$ 更小。从启发上看，对牛顿算法的近似版本进行更多迭代更快。这类方法被称为`准牛顿法`。\n\n**练习 10.1** 如果矩阵 $M$ 是对称的且对于所有\
  \ $x \\in \\mathbb{R}^m, x \\neq 0$ 都有 $x^T Mx > 0$，则 $M$ 为`正定矩阵`。证明：如果 $M$ 是正定的且\
  \ $\\nabla g(\\omega^t) \\neq 0$，那么从 $\\omega^t$ 出发沿 $-M^{-1}\\nabla g(\\omega^t)$\
  \ 方向取足够小的步会导致 $g$ 值的减少。***提示：*** (1) 从 $\\omega^t$ 出发沿向量 $v$ 方向取足够小的步会导致 $g$ 值的减少，当且仅当\
  \ $g$ 在 $\\omega^t$ 处沿 $v$ 方向的方向导数 $\\nabla g(\\omega^t) \\cdot v$ 为负时；(2) 所有正定矩阵都是可逆的，且正定矩阵的逆也是正定的。\n\
  \n### 10.1.3 梯度下降\n\n`梯度下降`算法是用 $m \\times m$ 单位矩阵来近似牛顿法中的海森矩阵 $Hg(x)$ 的结果，因此更新规则为：\n\
  \n```\n\\omega^{t+1} = \\omega^t - \\rho \\nabla g(\\omega^t)\n```\n\n当起始点 $\\omega¹$\
  \ 不靠近梯度 $\\nabla g$ 的零点，且当它遇到 $g$ 的定义域中 $\\|\\nabla g\\|$ 很小但附近没有 $\\nabla g$ 零点的区域时，梯度下降往往收敛缓慢。梯度下降（其随机形式——参见第\
  \ 10.6.2 节）似乎是训练神经网络的*事实标准*算法。\n\n### 10.1.4 BFGS 算法\n\n\n\n\n\n`Broyden-Fletcher-Goldfarb-Shanno\
  \ (BFGS)` 算法维护了 $(H*g(\\omega^t))^{−1}$ 的运行近似值 $H^t$，这是 $g$ 在 $\\omega^t$ 处的海森矩阵逆。初始值\
  \ $H⁰$ 是 $m \\times m$ 的单位矩阵。在每次迭代中，$H^t$ 通过加上三个秩 1 的矩阵来更新（3）。具体而言，\n\n$$\nH^{t+1}\
  \ = H^t + \\frac{uu^T}{ut} - \\frac{ww^T}{ws} + \\left(\\frac{ut}{t} - \\frac{ws}{s}\\\
  right)\\left(\\frac{ut}{t} - \\frac{ws}{s}\\right)^T\n$$\n\n其中向量 $u$、$v$ 和 $w$ 以及标量\
  \ $s$ 和 $t$ 定义如下：\n$$\n\\begin{aligned}\nu &= \\omega^{t+1} - \\omega^t \\\\\ns\
  \ &= v^T w \\\\\nv &= v^T H^t v \\\\\nt &= \\nabla g(\\omega^{t+1}) - \\nabla g(\\\
  omega^t) \\\\\nw &= H^t v\n\\end{aligned}\n$$\n\nBFGS 算法并不是沿着 $H^t \\nabla g(\\\
  omega^t)$ 的方向移动 $\\rho$ 个单位，而是从 $\\omega^t$ 出发、沿 $H^t \\nabla g(\\omega^t)$ 方向的射线上对\
  \ $g$ 进行一维数值最小化。此外，$H^t$ 的更新公式使得 $H^t$ 始终保持正定性（4），因此除非算法已经收敛，否则在该射线上始终存在一个 $g$ 值比\
  \ $\\omega^t$ 更小的点。\n\nBFGS 有时用于极大似然估计（例如第 4.6 节 中的逻辑回归）。收敛后，人们倾向于使用最后一个 BFGS 海森矩阵逆估计\
  \ $H^t$ 来为真实参数构建高斯置信区间，但 BFGS 可能会收敛到近似局部最小值，而此时 $H^t$ 并没有收敛到在该最小值处海森矩阵逆的良好估计值。\n\
  \n\n\n\n准牛顿法被广泛使用，通过实验发现某些修改被证明是普遍通用的。其中一种修改是添加`momentum`，在梯度下降中，它将更新规则更改为：\n\n\
  ```\n\\omega_{t+1} = \\omega_t - \\rho \\sum_{s=1}^{t} \\eta_{t-s} \\nabla g(\\\
  omega_s)\n```\n\n![numbered Display Equation](img/c10_M0008.gif)\n\n其中 $\\eta \\\
  in [0, 1]$ 是`momentum parameter`。这通过初始化一个`momentum term` $\\nu¹ = 0$ 并迭代更新来实现：\n\
  \n```\n\\nu_{t+1} = \\eta \\nu_t + \\nabla g(\\omega_t)\n\\omega_{t+1} = \\omega_t\
  \ - \\nu_{t+1}\n```\n\n(10.1) ![numbered Display Equation](img/c10_M0009.gif)\n\n\
  第二种修改是使用`adaptive learning rate`，即允许参数 $\\rho = \\rho[i]$ 随时间变化。在梯度下降中实现这种方法的一种方法是`bold\
  \ driver`方法，它使用更新规则：\n\n```\n![](img/c10uf001.jpg\n```\n\n在这里，`c[1]` 和 `c[2]` 是`adaptation\
  \ parameters`，其中 `c[1] > 1` 且 `c[2] < 1`。通常 `c[1] \\in [1.01, 1.10]` 且 `c[2] \\\
  approx 0.5`。\n\n第三种修改将在 10.6.2 节中介绍。\n\n### 10.1.6 逻辑回归与神经网络的梯度\n\n计算目标函数 $g$ 的梯度\
  \ $\\nabla g$ 的代价取决于多个因素，例如输入空间的维度 ($R^m$)，以及 $g$ 的计算是否涉及对观测数据集上某些数量的累加。接下来的案例说明了这一点，这些案例出现在拟合第\
  \ 4 节描述的逻辑模型或单层神经网络时。\n\n练习 10.2：回想第 6 节，逻辑分类器在特征向量 $X$ 的条件下，将每个标签 $c = 1, \\dots,\
  \ C$ 的概率建模为：\n\n```\nP(Y=c|X) = \\frac{\\exp(T(X, \\theta_c))}{\\sum_{d=1}^{C} \\\
  exp(T(X, \\theta_d))}\n```\n\n![numbered Display Equation](img/c10_M010.gif)\n\n\
  其中：\n\n```\nT(X, \\theta_c) = \\theta_{c,0} + \\sum_{j=1}^{m} \\theta_{c,j} X_j\n\
  ```\n\n![numbered Display Equation](img/c10_M0011.gif)\n\n\n\n\n是 `X` 的线性函数且\n\n\
  $$\n\\theta = \\begin{bmatrix} \\theta_1 & \\theta_2 & \\theta_3 & \\dots & \\theta_C\
  \ \\end{bmatrix} = \\begin{bmatrix} 0 & 0 & \\dots & \\dots & 0 \\\\ \\theta_{2,0}\
  \ & \\theta_{2,1} & \\dots & \\theta_{2,m} \\\\ \\theta_{3,0} & \\theta_{3,1} &\
  \ \\dots & \\theta_{3,m} \\\\ \\dots & \\dots & \\ddots & \\dots \\\\ \\theta_{C,0}\
  \ & \\theta_{C,1} & \\dots & \\theta_{C,m} \\end{bmatrix}\n$$\n\n![numbered Display\
  \ Equation](img/c10_M0012.gif)\n\n是一个 `C` × (`m` + 1) 的参数矩阵，其中第一行被限制为零。逻辑回归通常通过寻找一个\
  \ $\\theta$ 值来（近似）最大化一组观测数据的似然性从而进行拟合。根据练习 4.11，这等同于寻找一个使交叉熵损失下的训练风险最小化的 $\\theta$，\n\
  \n$$\nR_{train} = -\\sum_{i=1}^{n} T(x_i, \\theta_{y_i}) + \\sum_{i=1}^{n} \\log\\\
  left(\\sum_{d=1}^{C} \\exp(T(x_i, \\theta_d))\\right)\n$$\n\n![numbered Display\
  \ Equation](img/c10_M0013.gif)\n\n证明对于 `c` = 1, …, `C`，$R_{train}$ 的梯度由下式给出：\n\n\
  $$\n\\frac{\\partial R_{train}}{\\partial \\theta_c} = -\\sum_{i=1, y_i=c}^{n} 1\
  \ + \\sum_{i=1}^{n} \\frac{\\exp(T(x_i, \\theta_c))}{\\sum_{d=1}^{C} \\exp(T(x_i,\
  \ \\theta_d))} = -\\sum_{i=1, y_i=c}^{n} 1 + \\sum_{i=1}^{n} P(Y=c|X=x_i)\n$$\n\n\
  ![numbered Display Equation](img/c10_M0014.gif)\n\n\n\n\n对于 `j` = 1, …, `m`，\n\n\
  ```math\n\\frac{\\partial}{\\partial \\theta_{c,j}} = -\\sum_{i=1, y_i=c}^n x_{ij}\
  \ + \\sum_{i=1}^n x_{ij} \\frac{\\exp(T(x_i, \\theta_c))}{\\sum_{d=1}^C \\exp(T(x_i,\
  \ \\theta_d))}\n= -\\sum_{i=1, y_i=c}^n x_{ij} + \\sum_{i=1}^n x_{ij} P(Y=c|X=x_i).\n\
  ```\n(10.2) 因此，对于 $\\theta$ 的任意值，梯度的计算可以通过遍历一遍训练数据（`x[1]`， …, `x[n]`，`y[n]`），通过评估求和项并累加总和来完成。\n\
  \n### 练习 10.3 回想第 4.7 节，单隐藏层神经网络在特征向量 `X` 的条件下，对每个类别标签 `c` = 1, …, `C` 的概率建模为：\n\
  \n```math\nP(Y=c|Z) = \\frac{\\exp(T(Z, \\theta_c(2)))}{\\sum_{d=1}^C \\exp(T(Z,\
  \ \\theta_d(2)))}\n```\n\n其中\n```math\nT(Z, \\theta_c(2)) = \\theta_{c,0}(2) + \\\
  sum_{j=1}^N \\theta_{c,j}(2)Z_j\n```\n是 `Z` = (`Z[1]`， …, `Z[N]`）的线性函数，且对于 `j` =\
  \ 1, …, `N`，\n\n```math\nZ_j = \\sigma\\left(\\theta_{j,0}(1) + \\sum_{k=1}^m \\\
  theta_{j,k}(1)X_k\\right)\n```\n\n\n\n是 sigmoid 函数 $\\sigma(v) = \\frac{1}{1+e^{-v}}$\
  \ 与 $X$ 的线性函数的组合![](img/c10_ILM0025.gif)，\n\n$$\n\\theta^{(2)} = \\begin{bmatrix}\
  \ \\theta_1^{(2)} \\\\ \\theta_2^{(2)} \\\\ \\vdots \\\\ \\theta_C^{(2)} \\end{bmatrix}\
  \ = \\begin{bmatrix} \\theta_{1,0}^{(2)} & \\theta_{1,1}^{(2)} & \\dots & \\theta_{1,N}^{(2)}\
  \ \\\\ \\theta_{2,0}^{(2)} & \\theta_{2,1}^{(2)} & \\dots & \\theta_{2,N}^{(2)}\
  \ \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ \\theta_{C,0}^{(2)} & \\theta_{C,1}^{(2)}\
  \ & \\dots & \\theta_{C,N}^{(2)} \\end{bmatrix}\n$$\n(10.3)\n\n它们分别是 $C \\times\
  \ (N+1)$ 和 $N \\times (m+1)$ 的参数矩阵。关于交叉熵损失的训练风险为：\n\n$$\nR_{train} = -\\sum_{i=1}^{n}\
  \ T(z_i, \\theta_{y_i}^{(2)}) + \\sum_{i=1}^{n} \\log\\left(\\sum_{d=1}^{C} \\exp(T(z_i,\
  \ \\theta_d^{(2)}))\\right)\n$$\n\n![numbered Display Equation](img/c10_M0020.gif)\n\
  \n\n\n\n其中，对于 `i` = 1, …, `n`，`z[i]` 代表长度为 $N$ 的向量\n\n$$\n\\left(\\sigma\\left(\\\
  theta_{j,0}^{(1)} + \\sum_{k=1}^m \\theta_{j,k}^{(1)} x_{ik}\\right)\\right)_{j=1}^N\\\
  cdot\n$$\n\n![编号显示方程](img/c10_M0021.gif)\n\n证明对于 `c` = 1, …, `C`，$R_{train}$ 的梯度由下式给出：\n\
  \n$$\n\\frac{\\partial}{\\partial \\theta_{c,0}^{(2)}} R_{train} = -\\frac{\\sum_{i=1,\
  \ y_i=c}^n n}{1 + \\sum_{i=1}^n n} \\frac{exp(T(z_i, \\theta_c^{(2)}))}{\\sum_{d=1}^C\
  \ exp(T(z_i, \\theta_d^{(2)}))} = -\\sum_{i=1, y_i=c}^n n + \\sum_{i=1}^n n P(Y=c|Z=z_i)\n\
  $$\n\n(10.4)![编号显示方程](img/c10_M0022.gif)\n\n并且，对于 `j` = 1, …, `N`，\n\n$$\n\\frac{\\\
  partial}{\\partial \\theta_{c,j}^{(2)}} R_{train} = -\\frac{\\sum_{i=1, y_i=c}^n\
  \ n z_{ij}}{1 + \\sum_{i=1}^n n z_{ij}} \\frac{exp(T(z_i, \\theta_c^{(2)}))}{\\\
  sum_{d=1}^C exp(T(z_i, \\theta_d^{(2)}))} = -\\sum_{i=1, y_i=c}^n n z_{ij} + \\\
  sum_{i=1}^n n z_{ij} P(Y=c|Z=z_i)\n$$\n\n(10.5)![编号显示方程](img/c10_M0023.gif)\n\n\n\
  \n\n\n同样，对于 `j` = 1, …, `N`，\n\n```math\n\\frac{\\partial²}{\\partial \\theta_{j,0}^{(1)}²}\
  \ R_{train} = -\\sum_{i=1}^{n} \\theta_{y_i,j}^{(2)} z_{ij}(1-z_{ij}) + \\sum_{i=1}^{n}\
  \ \\frac{\\sum_{d=1}^{C} \\theta_{d,j}^{(2)} z_{ij}(1-z_{ij}) \\exp(T(z_i, \\theta_d^{(2)}))}{\\\
  sum_{d=1}^{C} \\exp(T(z_i, \\theta_d^{(2)}})}}\n= -\\sum_{i=1}^{n} \\theta_{y_i,j}^{(2)}\
  \ z_{ij}(1-z_{ij}) + \\sum_{i=1}^{n} \\sum_{d=1}^{C} \\theta_{d,j}^{(2)} z_{ij}(1-z_{ij})\
  \ P(Y=d|Z=z_i)\n```\n(10.6)\n\n\n\n\n\n并且对于 `k` = 1, …, `m`，\n\n$$\n\\frac{\\partial}{\\\
  partial \\theta_{j,k}^{(1)}} \\text{ train} = -\\sum_{i=1}^n \\theta_{y_i,j}^{(2)}\
  \ z_{ij}(1-z_{ij}) x_{ik} + \\sum_{i=1}^n \\frac{\\sum_{d=1}^C \\theta_{d,j}^{(2)}\
  \ z_{ij}(1-z_{ij}) x_{ik} \\exp(T(z_i, \\theta_d^{(2)}))}{\\sum_{d=1}^C exp(T(z_i,\
  \ \\theta_d^{(2)}))}\n$$\n\n(10.7) ![编号显示公式](img/c10_M0025.gif)\n\n因此，对于任意的 $\\\
  theta^{(1)}$ 和 $\\theta^{(2)}$ 值，梯度的计算可以通过遍历一遍训练数据 (`x[1]`, `y[1]`), …, (`x[n]`,\
  \ `y[n]`)来完成，即通过评估各项项并累加和。\n\n## 10.2 Nelder–Mead 算法\n\n*Nelder–Mead 算法* 用于优化不可微函数（或导数计算代价过高或难以计算的函数）。它从\
  \ $\\mathbb{R}^m$ 中一个单纯形的 `m` + 1 个顶点开始![](img/c10_ILM0027.gif)，并在每个顶点处评估函数 `g`。\n\
  \n该算法的每次迭代如图图 10.2 所示。沿从 `A` 到相反单纯形面中点的射线线移动，可以被解释为在现有信息范围内，沿最速下降方向移动的近似。\n\nNelder–Mead\
  \ 算法有时被称为“变形虫法”（amoeba method），因为单纯形在 $\\mathbb{R}^m$ 中不断爬动![](img/c10_ILM0027.gif)，根据\
  \ `g` 定义的表面轮廓调整其形状和大小。当\n$$\n\\frac{|g(A) - g(C)|}{|g(A)| + |g(C)|}\n$$\n![](img/c10_ILM031.gif)低于给定的阈值时，宣告收敛。\n\
  \n![图 10.2 Nelder–Mead 算法的一次迭代对单纯形进行评估的点和执行的操作](img/c10f002.jpg)\n\n**图 10.2** Nelder–Mead\
  \ 算法的一次迭代对单纯形进行评估的点和执行的操作。\n\n## 10.3 模拟退火\n\n*模拟退火*是一种随机随机搜索策略。给定当前状态 `ω^(t*)`，从某个称为*提议分布*的概率分布\
  \ `P` 中随机抽取一个点 `w`，该分布是算法定义的一部分，通常取决于当前状态。决定是否接受提议的点 `w` 作为新状态 `ω^(t + 1)` 也是随机的：该概率取决于\
  \ `g(w)`、`g(ω^(t))` 以及一个正参数 `T`（即*退火温度*），该温度随着算法的进行而降低。具体而言，`T` 在每一步中通过乘以一个接近但小于\
  \ 1 的常数（例如 0.999）来减小。\n\n\n\n\n注意，如果 `g(w) ≤ g(ω^t)`，则提议的移动总是会被接受，这意味着 `ω^(t + 1)\
  \ = w`。相反，如果 `g(w) > g(ω^t)`，则从 `ω^t` 到 `w` 的提议以一定的正概率接受，该概率取决于 `g(w)` 比 `g(ω^t)`\
  \ 大多少。随着退火温度 `T > 0` 的降低，接受任何满足 `g(w) > g(ω^t)` 的给定提议 `w` 的概率会降低。在初期，模拟退火愿意从“好”点移动到一个“坏”点，而在后期它不愿意移动到“坏”点，本质上变成了一种贪婪随机搜索。这使得当\
  \ `g` 有许多局部最小值时，模拟退火是一种很好的搜索策略。\n\n## 10.4 遗传算法\n\n在*遗传算法*中，`g` 域中的一个点 `ω`被称为*基因*。该算法对一组基因（称为*种群*）进行迭代操作。每个基因\
  \ `ω` 都有一个称为*适应度*的属性，这是一个随着 `g(ω)` 减小而增加的非负数：\n\n```\nfitness(ω) = e^{-g(ω)}\n```\n\
  \n![numbered Display Equation](img/c10_M0026.gif)\n\n这是一个典型的例子。算法需要两个随机函数：一个*交叉映射\
  \ C*，它接受一对基因并返回一个新的基因；以及*变异映射 M*，它接受单个基因并返回一个新的基因。\n\n在第 `t` 次迭代中，使用当前种群 `S^t` 产生新种群\
  \ `S^(t + 1)`，如下：\n\n![](img/c10uf003.jpg)\n\n通常，种群规模从一次迭代（也称为*代*）到下一次保持不变。\n\n\
  在某些遗传算法中，`S^(t + 1)` 可能包含 `S^t` 中基因的未变异交叉，而 `S^(t + 1)` 可能包含来自 `S^t` 抽取的单个基因的变异。此外，`S^(t\
  \ + 1)` 可能包含直接从 `S^t` 复制的基因，例如通过用 `S^t ∪ S^(t + 1)` 中适应度最高的元素替换 `S^(t + 1)`。\n\n\
  变异映射 `M` 类似于模拟退火的提议分布：给定一个基因 `ω`，它从某个分布中抽取随机基因，通常在某种意义上概率质量集中在 `ω`。遗传算法的定义特征是交叉映射\
  \ `C`，它通过结合另外两个基因的部分来创建一个新基因。例如，当 `g` 的域为 `R^m` 时，应用于基因 `u` 和 `v` 的交叉映射可以定义为 `C(u,\
  \ v) = (w[1], …, w[m])`，其中每个 `w[i]` 是从集合 `{u[i], v[i]}` 中独立均匀随机抽取。\n\n遗传算法对于最小化那些输入之间存在已知（或怀疑）结构性关系的函数最为有用，这种关系可以通过选择良好的交叉映射来利用。给出一个极不实际的例子，假设\
  \ `g` 的域为 `R⁶` 且\n\n```\ng(ω) = min(ω[1], ω[2], ω[3], ω[4], ω[5], ω[6])\n```\n\n\
  在这里，如果 `g` 较小，那么前三个坐标或后三个坐标都是很小的。交叉映射利用这一属性来提议 `g` 值可能较小的新成员：\n\n```\nC(u, v) =\
  \ {u[1], ..., u[6]} if a fair coin toss comes heads else {v[1], ..., v[6]}\n```\n\
  \n## 10.5 粒子群优化\n\n*粒子群优化算法*是 Kennedy 和 Eberhart (1995) 提出的用于模拟鸟群、鱼群和其他群体行为的计算机模型的衍生产物。一个*粒子群*是一组对象，每个对象都具有以下属性：\n\
  \n1.  一个*位置 p*，`g` 域中的一个点；\n2.  一个*速度 v*，`g` 域中的一个向量；\n3.  一个*个体最佳点*，该粒子过去占据过的所有位置中\
  \ `g` 的最小值；\n4.  *全局最佳点*，*任何*粒子过去占据过的所有位置中 `g` 的最小值。\n\n粒子的位置和速度是随机初始化的（通常使得它们在\
  \ `g` 域中分布良好良好）。\n\n\n\n在每次迭代中，群中的每个粒子根据根据规则进行更新：\n\n```\np_new = p_current + v_current\n\
  ```\n![numbered Display Equation](img/c10_M0029.gif)\n\n```\nv_new = k(v_current\
  \ + c1*U1*(personal_best - p_current) + c2*U2*(global_best - p_current))\n```\n\n\
  ![numbered Display Equation](img/c10_M0030.gif)\n\n在速度更新公式中，`k`、`c[1]` 和 `c[2]`\
  \ 是通用正常数，`U[1]` 和 `U[2]` 是来自均匀 (0, 1) 分布的随机数（每个粒子在每次迭代中均独立抽取的）。粒子的个人最佳点和全局最佳点会在每次迭代中进行更新。\n\
  \n常量 `k`、`c[1]` 和 `c[2]` 的目的是控制每个粒子对其自身最佳点以及全局最佳点的“吸引力”程度。常量 `c[1]` 和 `c[2]` 分别称为`认知参数`，常量\
  \ `k` 称为`收缩因子`。根据模拟研究，Carlisle 和 Dozier (2000) 推荐 `c[1] = 2.8`、`c[2] = 1.3` 以及 `k\
  \ = 2 / (|2-c1-c2|-sqrt((c1+c2)*(c1+c2-4))) ≈ 0.7298`![](img/c10_ILM0034.gif)。\n\
  \n粒子群优化器有许多变体。一种常见的变体是对粒子施加邻域结构，将“全局最佳”替换为“邻域最佳”。这意味着目前发现的全局最佳点信息在群中的传播较慢，因为它在每次迭代中是在邻居之间传递的，这使得群具有较小的攻击性且更具鲁棒性。其他变体包括多个群（用于精炼估计的“定居者”和寻找局部最小值的“探索者”）。如何判断粒子群是否收敛是一个开放性问题。\n\
  \n## 通用备注\n\n### 不完美的已知函数\n\n在机器学习中，我们真正想要优化的目标函数 `g` 通常是不可的，因此我们只能优化 `g` 的一个近似值。对\
  \ `g` 估计的不确定性可以为迭代算法引入新的停止准则：给定一个训练数据集，指定一种方法，并令 `θ` 为包含模型参数和控制该方法的调优参数的向量：在分类树中，`θ`\
  \ 可能包含代价参数，而在神经网络中，`θ` 可能编码了隐藏层数以及每层中神经元的数量。训练分类器定义了一个函数 `f^θ`，而 `θ` 的最优值是使训练后的分类器风险最小化的值。即，目标函数\
  \ `g` 为：\n\n```\ng(θ) = R(f^θ) = E(X,Y)[L(Y, f^θ(X))]\n```\n\n\n\n\n已训练分类器的真实风险是不可计算的（因为它依赖于未知的概率分布\
  \ $P(X, Y)$），因此必须使用估计值。例如，如果可用验证数据集（参见第 7 章），可以寻找参数 $\\theta$ 以最小化风险的验证估计值。这提供了一个代理目标函数\
  \ $g^\\theta$![](img/c10_ILM0038.gif)，\n\n```\ng(\\theta) = R_{valid}(f^\\theta)\
  \ = \\frac{1}{n} \\sum_{i=1}^{n} L(y_i, f^\\theta(x_i))\n```\n![numbered Display\
  \ Equation](img/c10_M0032.gif)\n\n代理目标函数 $g^\\theta$ 源自数据，因此具有随机性，其均值和方差（以及方差估计量）如第\
  \ 7.2.2 节所示。\n\n**练习 10.4** 假设验证数据的数量 $n$ 足够大，使得对于任何考虑的 $\\theta$ 值，$g^\\theta(\\\
  theta) = R_{valid}(f^\\theta)$ 可以被看作正态分布且误差忽略不计。请基于使用验证估计 $g^\\theta$ 作为 $g$，对原假设\
  \ $g(\\theta[i+1]) \\ge g(\\theta[i])$ 进行水平-$\\alpha$ 统计检验，为迭代算法 $\\theta[1], \\\
  theta[2], \\dots$ 描述一个停止标准。如果预先固定最大迭代次数 $I$，请解释如何使用第 12 章中描述的 Bonferroni 修正，使得任何错误拒绝的概率被限制在\
  \ $\\alpha$ 以。**提示：** 测试部分请参见练习 7.5 的 (C) 部分，Bonferroni 方法的推导请参见练习 12.7。\n\n###\
  \ 10.6.2 作为和形式的目标\n\n在某些情况下，要优化的目标函数 $g$（或代理函数 $g$）自然地表示为和。例如，某些分类器通过显式最小化训练或验证风险估计值来训练，在这种情况下\n\
  \n```\ng(\\theta) = \\frac{1}{n} \\sum_{i=1}^{n} L(y_i, f^\\theta(x_i))\n```\n\n\
  ![numbered Display Equation](img/c10_M0033.gif)\n\n或者\n\n```\ng(\\theta) = \\frac{1}{n}\
  \ \\sum_{i=1}^{n} L(y_i, f^\\theta(x_i))\n```\n\n![numbered Display Equation](img/c10_M0034.gif)\n\
  \n某些分类器通过最大化独立数据的对数似然函数 (9) 来训练，在这种情况下\n\n```\ng(\\theta) = -\\frac{1}{n} \\sum_{i=1}^{n}\
  \ \\log P(y_i | X=x_i, \\theta)\n```\n\n\n\n\n\n![images/c10_M0035.gif]\n\n忽略目标函数是理想函数还是代理函数的区别，在上述两种情况下，目标函数都是数据的求和，其中第\
  \ `i` 个求加项仅取决于参数 `θ` 和第 `i` 个数据点。梯度也是如此，因此：\n\n```\ng(θ) = \\sum_{i=1}^n g(x_i,\
  \ y_i, θ) and ∇g(θ) = \\sum_{i=1}^n ∇g(x_i, y_i, θ).\n```\n\n![images/c10_M0036.gif]\n\
  \n当数据量 `n` 很大时，计算 `g` 和 `∇g` 的开销可能非常大，当参数数量 `k` 很大时更是如此。在使用拟牛顿法优化方法时，应对这种情况的一种方法是仅通过在数据的随机样本上进行计算来近似\
  \ `∇g`：\n\n```\n∇g(θ) ≈ \\sum_{i \\in S} ∇g(x_i, y_i, θ),\n```\n\n![images/c10_M0037.gif]\n\
  \n其中 `S` 是从 {1, …, `n`} 中随机抽取的一个小样本。在极端情况下，随机样本是单个数据点：*随机梯度下降*是一种梯度下降算法，其 `∇g(θ)`\
  \ 由针对单个点（`x[i]`, `y[i]`）计算的 `∇g(x[i], y[i], θ)` 近，该点是在算法的每次迭代中从数据中均匀抽取的。\n\n###\
  \ 10.6.3 从多个起点开始优化\n\n从启发式来看，从多个点开始优化算法是一种良好的做法。事实上，对于给定的总工作量，从不同起点运行简单优化算法的多次应用（从总体而言）可能比仅从一个点开始的复杂算法找到更好的更优解。某些算法显式地包含了这种启发式：例如具有“探索者”和“定居者”粒子的粒子群，以及将种群分为“岛屿”的遗传算法（只有当波动的“海平面”足够低时，岛屿之间才会进行交叉）。\n\
  \n当优化算法收敛到近似最小值 `ω*` 时，在 `ω*` 处重启算法也是良好的做法。算法要么没有找到比 `ω*` 更好的最小值，此时它相对于最初寻找 `ω*`\
  \ 所花费的工作宣布在 `ω*` 处收敛；要么它确实找到了比 `ω*` 更好的最小值。\n\n## 10.7 期望最大化算法\n\n### 10.7.1 通用算法\n\
  \n在某些应用中，数据是缺失的。我们将详细研究的一个例子是高斯混合的拟合，此时可用数据是点 `x1, ..., x`，而没有关于这些点取自分布中哪个分量的任何信息。在本节中，我们将观测（或可见）数据标记为\
  \ `X`，将未观测（或隐藏、潜在）数据标记为 `Z`。\n\n假设有一个关于观测数据 `X` 和隐藏数据 `Z` 的统计模型，其参数为 `θ`。似然为 `P(X,\
  \ Z | θ)`，我们需要得到 `θ` 的极大似然估计 `θ^`。理想情况下，这应该通过边缘化——即对隐藏数据 `Z` 的分布（假设它依赖于 `θ`）取平均来获得，选择一个使观测数据边缘分布\
  \ `P(X | θ)` 最大化的 `θ` 值：\n\n```\nθ^ = \\text{argmax}_{\\θ} \\int P(X, z | θ) dz.\n\
  ```\n\n(10.1) ![images/c10_M0038.gif]\n\n用优化的语言来说，我们寻求最小化目标函数 `g(θ) = −P(x[1], ...,\
  \ x[n] | θ)`，其中对于某些观测数据 `x[1], ..., x[n]`。(10.1) 中的积分通常难以处理，导致目标函数是不可计算的。\n\n针对这一情况，Dempster\
  \ 等人 (1977) 开发了*期望最大化 (EM) 算法*，这是一种近似 `θ^` 的迭代算法。给定观测数据 `x[1], ..., x[n]` 和初始值 `θ⁰`，EM\
  \ 算法重复以下两个步骤，直到宣布收敛：\n\n\n\n\n期望步骤看起来很令人生畏，但它实际上涉及计算参数，描述在第 `t` 次迭代时关于隐藏数据 `Z` 的知识或信念状态的状态。\n\
  \n### 10.7.2 EM 算法提升观测值的边际似然\n\n值得注意的是（因此我们特此说明此点），在 EM 算法的任何迭代次数中，观测数据的边际似然满足：\n\
  \n```\nP(X|θ^(t+1)) ≥ P(X|θ^t)\n```\n\n![](img/c10_M0039.gif)\n\n原因如下。对于任意取值 `θ`、`x`\
  \ 和 `z`，观测数据与未观测数据的联合密度可以分解为：\n\n```\nP(X=x, Z=z|θ) = P(Z=z|θ, X=x) * P(X=x|θ)\n\
  ```\n\n![](img/c10_M0040.gif)\n\n取对数后，这变为：\n\n```\nlog P(X=x|θ) = log P(X=x, Z=z|θ)\
  \ - log P(Z=z|θ, X=x)\n```\n\n(10.2)\n\n由于 (10.2) 对于隐藏变量的所有值 `z` 均成立，因此两边对隐藏变量的`任意`分布进行积分后依然保持等式。特别，我们可以选取某个值\
  \ `θ'`，并对 (10.2) 的两边关于其在隐藏数据上诱出的分布 `P(Z|θ', X=x)` 进行积分。这得到：\n\n```\nlog P(X=x|θ)\
  \ = E[Z|θ', X=x][log P(X=x|θ)] - E[Z|θ', X=x][log P(Z|θ, X=x)]\n```\n\n(10.3)\n\n\
  考虑 (10.3) 右侧的第二项。下面的练习序列表明，作为 `θ` 的函数，\n\n```\nE[Z|θ', X=x][log P(Z|θ, X=x)]\n```\n\
  \n\n\n\n<a href=\"#c10-disp-0044-11\"></</a>(10.4)![编号显示方程](img/c10_M0043.gif)\n\
  \n在 $\\theta = \\tilde{\\theta}$ 时达到最大值![](img/c10_ILM0050.gif)\n\n**练习 10.5 詹森不等式。**\
  \ 如果对于函数 $g: \\mathbb{R} \\to \\mathbb{R}$ 的任意 $x, y \\in \\mathbb{R}$ 和任意 $t \\\
  in [0, 1]$，都有 $g(tx + (1 - t)y) \\ge tg(x) + (1 - t)g(y)$，则称 $g$ 为凹函数；如果 $g(tx +\
  \ (1 - t)y) > tg(x) + (1 - t)g(y)$，则称 $g$ 是严格凹函数。等价地，$g$ 是凹的，意味着对于在每个点 $x$，都有一条通过点\
  \ $(x, g(x))$ 的直线，使得由 $(y, g(y))$ 参数化的曲线始终位于直线上方或下方。这被称为曲线在 $x$ 处的支撑线。以此表述，$g$ 是严格凹的，意味着对于在每个点\
  \ $x$，都有一条通过点 $(x, g(x))$ 的直线，使得由 $(y, g(y))$ 参数化的曲线位于直线下方，且仅在点 $(x, g(x))$ 处与直线相交。这些定义在图\
  \ 10.3 中所示。证明对于实随机变量 $X$ 和凹函数 $g$，\n\n```\nE[g(X)] \\ge g(E[X]).\n```\n\n![编号显示方程](img/c10_M0044.gif)\n\
  \n证明如果 $g$ 是严格凹的，则 $E[g(X)] = g(E[X])$ 当且仅当存在某个常数 $c$ 使得 $P(X = c) = 1$。**提示：**\
  \ 令 $\\alpha = E[X]$，考虑一条方程为 $g(\\alpha) + s(y - \\alpha)$ 的直线，该直线位于曲线 $(y, g(y))$\
  \ 之上，并对不等式的两侧进行积分。\n\n![图 10.3 凹函数（左侧）和严格凹函数（右）。对于每条曲线，在点 (x, g(x)) 处显示了一条虚支撑线。对于严格凹函数，支撑线仅在该点与曲线相交，而对于凹函数，直线可能在曲线的其他处相交（加粗显示）。](img/c10f003.jpg)\n\
  \n**图 10.3** 凹函数（左侧）和严格凹函数（右）。对于每条曲线，在点 $(x, g(x))$ 处显示了一条虚支撑线。对于严格凹函数，支撑线仅在该点与曲线相交，而对于凹函数，直线可能在曲线的其他处相交（加粗显示）。\n\
  \n**练习 10.6 香农-柯尔莫哥洛夫信息不等式。**^(11) 设 $P[0]$ 和 $P[1]$ 是某些集合 $S$ 上的概率密度，设 $X$ 具有密度为\
  \ $P[0]$ 的分布。证明\n\n```\nElog(P[0/P1)] \\ge 0\n```\n\n![编号显示方程](img/c10_M0045.gif)\
  \ 当且仅当 $P[0] = P[1]$ 时取等号。**提示：** 使用詹森不等式、log 在正数轴上是凹函数的实以及密度积分为 1 的事实。\n\n**练习\
  \ 10.7** 应用香农-柯尔莫哥洛夫不等式证明对于所有的 $\\theta$，\n\n```\nE[log(P(Z|X=\\theta))] \\le E[log(P(Z|Z=\\\
  tilde{\\theta}))].\n```\n\n\n\n\n现在考虑 (10.3) 右侧的第一项。如果 $\\theta$ 和 $\\tilde{\\theta}$\
  \ 是任意两个满足 \n$$\nE[Z|\\tilde{\\theta}, X=x] \\log P(X=x, Z|\\theta) \\le E[Z|\\tilde{\\\
  theta}, X=x] \\log P(X=x, Z|\\tilde{\\theta}) \\text{)}\n$$\n（例如，如果 $\\theta$ 是\
  \ $E[Z|\\theta, X=x]$ 的极大化值，那么在 (10.3) 中插入 (10.5) 和 (10.6) 会使正项变小而负项变大，从而得出\n$$\n\
  \\log P(X=x|\\theta) \\ge \\log P(X=x|\\tilde{\\theta}) \\text{.\n$$\n在实际实现中，$\\\
  tilde{\\theta} = \\theta^t$，且 $\\theta^{t+1}$ 被设置为 $E[Z|\\theta^t, X=x]$ 的极大化值。因此，EM\
  \ 算法产生了一系列参数估计值 $\\theta⁰, \\theta¹, \\theta², \\dots$，使得 \n$$\nP(X=x|\\theta⁰),\
  \ P(X=x|\\theta¹), P(X=x|\\theta²), \\dots\n$$\n是非递减的（事实上，除非在 (10.4) 和 (10.6) 中均取等号，否则它是递增的）。此外，我们不需要在\
  \ EM 的步骤 (2)M 步）中真正极大化期望对数似然：只需找到一个新的参数 $\\theta^{t+1}$，使其比当前参数 $\\theta^t$ 更大的期望对数似然即可。\n\
  \n### 10.7.3 示例——通过 EM 拟合高斯混合模型\n\n\n\n\nEM 算法通过提供在第 4.4.3 节和第 9.2 节中省略的技术细节来阐。令`x[1]`，……`x[n]`\
  \ 是来自具有`J`个分量的高斯混合模型的独立抽样。对于每个`i`，`x[i]` 处的密度为：\n\n```\nP(x_i|θ) = \\sum_{j=1}^{J}\
  \ w_j φ(x_i|μ_j, Σ_j)\n```\n\n![numbered Display Equation](img/c10_M0049.gif)\n\n\
  其中`φ(x | μ, Σ)`表示均值为`μ`、协方差矩阵为`Σ`的高斯密度函数，`w[1]`，……`w[J]`是和为 11 的非负权重，且\n\n```\n\
  θ = (w_1, ..., w_J, μ_1, ..., μ_J, Σ_1, ..., Σ_J)\n```\n\n![numbered Display Equation](img/c10_M0050.gif)\n\
  \n是所有参数的简写。对于`i = 1, …, n`，定义`z[i] ∈ {1, …, J}`为提取`x[i]`的混合分量标签。可以将数据理解为这样生成的：\n\
  \n![](img/c10uf005.jpg)\n\n如果`z[1]`，……`z[n]`是已知的，则很容易计算`θ`的极大似然估计。对数似然可以写为：\n\n\
  ```\nlog P(x_1, ..., x_n, z_1, ..., z_n|θ) = \\sum_{i=1}^{n} log(w_{z_i} φ(x_i|μ_{z_i},\
  \ Σ_{z_i})) = \\sum_{j=1}^{J} (\\sum_{i=1, z_i=j}^{n} log(w_j φ(x_i|μ_j, Σ_j)))\n\
  ```\n\n![numbered Display Equation](img/c10_M0051.gif)\n\n并且右侧关于`j`的和式中的每一项都可以独立地最大化。\n\
  \n### 练习 10.8\n证明参数的极大似然估计为：\n\n```\nw_j^* = |{i: z_i=j}| / n,\nμ_j^* = 1 / |{i:\
  \ z_i=j}| * \\sum_{i: z_i=j} x_i\n```\n\n![numbered Display Equation](img/c10_M0052.gif)\n\
  \n以及\n\n```\nΣ_j^* = 1 / |{i: z_i=j}| * \\sum_{i: z_i=j} (x_i - μ_j^*)(x_i - μ_j^*)^T.\n\
  ```\n\n![numbered Display Equation](img/c10_M0053.gif)\n\n**提示：** 别忘了引入一个格朗日乘子项来捕捉约束条件\
  \ `w[1]` + ⋅⋅⋅ + `w[J]` = 1。*\n\n\n\n\n如果 `z[1], …, `z[n]` 是未知的，可以通过期望极大化（EM）算法找到边际对数似然的近似极大值。\n\
  \n```\nlog P(x1, ..., xn|theta) = \\sum_{i=1}^n log P(xi|theta) = \\sum_{i=1}^n\
  \ log( \\sum_{j=1}^J w_j phi(xi|mu_j, sigma_j) )\n```\n\n### 10.7.4 示例\n\n#### 示例——期望步\n\
  \n从理论上讲，期望步的目的是根据由当前估计值 `theta^t` 导出的对 `Z[1], …, Z[n]` 分布，获得 `X` 和 `Z` 的联合对数似然的期望值。具体而言：\n\
  \n```\nE(Z1, ..., Zn|(x1, ..., xn), theta^t) = [log P(x1, ..., xn, Z1, ..., Zn|theta)]\n\
  = E(Z1, ..., Zn|(x1, ..., xn), theta^t) [\\sum_{i=1}^n log(w_Zi phi(xi|mu_Zi, sigma_Zi))]\n\
  = \\sum_{i=1}^n E(Zi|(x1, ..., xn), theta^t) [log(w_Zi phi(xi|mu_Zi, sigma_Zi))]\n\
  = \\sum_{i=1}^n \\sum_{j=1}^J P(Zi=j|x1, ..., xn, theta^t) gamma_{ij}^t log(w_j\
  \ phi(xi|mu_j, sigma_j))\n```\n\n\n\n\n最后一步引入了简记符号 \n\n```xml\n<displayedItem xmlns:cms=\"\
