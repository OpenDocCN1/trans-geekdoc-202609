  v_R^T v_M = y^T(i-h)hy - y^T(i-h)y + y~1 = y^T(h-hh)y - y~ + y^T(i-h)y,1\n```\n\
  (images/bapp02_M0016.gif)\n\n并且练习 3.3 已经了 `hh = h`（因此右侧的第一项为零），且 `h1 = i1`，因为 `1`\
