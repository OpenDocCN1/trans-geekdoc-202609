  \ H0 的真值视为随机变量），但这些思想适用于做出二元决策的贝叶斯方法和频率派方法。](img/c12_ILM0006.gif)\n\n\n\n\n**表 12.2**\
  \ (#c12.xhtml#tableanchor12-2) 表 12.1 中边缘概率的名称。对于一个分类器或假设检验，统计学家可能会从功效和规模的角度描述其性能，计算机科学家可能会从精确率和召回的角度，而医生可能会从敏感性和特异性的角度描述。尽管使用的符号是贝叶斯的（例如，`P(reject\
  \ H0 | H0 is true)` 在符号上将 `H[0]` 的真值视为随机变量），但这些思想适用于贝叶斯和频率派的二元决策方法。\n\n表 12.1 显示了两种可能的决策（预测类别\
  \ 1 或类别 2，拒绝或保留 `H[0]`）以及两种可能的真值状态（真实类别为 1 或 2，数据在 `H[0]` 或 `H[a]` 下生成）。表格中的每个单元格包含一个概率\
  \ `a`、`b`、`c` 或 `d`，且 `a + b + c + d = 1`。表 12.2 显示了 表 12.1 中某些边缘或条件概率的名称。\n\n有两个重要的术语没有出现在这些表中，因为它们是由不等式定义的。如果一个假设检验的规模不大于\
  \ `α`，则该检验为 `level-α 检验`，即如果 `P(reject H0 | H0 is true) ≤ α`。`观测统计量 S(*X*) 的 p 值`\
  \ 是使 `α` 的最小值，使得观测值 `S(X)` 能够导致水平-*α* 检验拒绝零假设。\n\n## 12.3 ROC 曲线\n\n设 `S` 为一个实值统计量，并暂时考虑一种如下形式的分类决策：“如果\
  \ `S` 的观测值大于或等于阈值值 `τ`，则预测类别 2，否则预测类别 1。”对于假设检验，其等价的形式是：“如果 `S` 的观测值大于或等于阈值值 `τ`，则拒绝零假设\
  \ `H[0]` 并转而备择假设 `H[a]`。”\n\n这两个类别或假设对统计量 `S` 放置了（假定不同的）分布：设 `P(S | Y = 1)` 表示真实类别为\
  \ 1 时 `S` 的分布，设 `P(S | Y = 2)` 表示真实类别为 2 时 `S` 的分布。`接收者工作特征曲线`（或 `ROC 曲线”）是由以下公式参数化的曲线：\n\
  \n```\n(P(S ≥ τ | Y = 1), P(S ≥ τ | Y = 2))\n```\n\n示例见 图 12.1。\n\n**图 12.1** (#c12.xhtml#table12-1)\
  \ 统计量 `S(*X*)` 的类别-1 和类别-2 分布以及对应的功效-规模（ROC）曲线。在左侧单元格中，类别-1 和类别-2 分布均为正态分布。右侧单元格中绘制的功效-规模曲线随\
  \ `τ` 在实数范围内变化，由 `(P(S ≥ τ | Y = 1), P(S ≥ τ | Y = 2))` 参数化。在这个示例中，当 `τ = ∞` 时，曲线在\
  \ (0, 0) 处接触垂直轴；当 `τ = -∞` 时，在 (1, 1) 处接触水平线；否则它位于直线 `y = x` 之上，这对应于基于硬币对每个数据预测类别\
  \ 1 或 2。左侧单元格中实线的彩虹颜色对应产生 ROC 曲线点的阈值 `τ` 的值。\n\nROC 曲线非常有用，因为它们说明了给定分类器或假设检验在两种错误之间允许的权衡。因此，ROC\
  \ 曲线可以使应用统计学家或机器学习从业者从客户或合作者处获取损失函数。具体来说，客户表示希望在 ROC 曲线上的某个特定运行点的愿望揭示了两个点：首先是对应于该点的\
  \ `τ` 值；其次是曲线上没有其他点是优的，因此客户的损失函数在该点隐含地满足 `d/dτ R(f^) = 0`。\n\n\n\n\n练习 12.1 展示了如何从\
  \ ROC 曲线上的选定工作点、类别 $Y=1$ 和 $Y=2$ 的统计量 $S$ 的密度函数估计值（通常通过对用于绘制 ROC 曲线的数据应用直方图或核密度估计获得），以及两个类别的边际赔率比或先验赔率比\
  \ $P(Y=1)/P(Y=2)$ 中，恢复出客户的的损失比率 $L(2,1)/L(1,2)$。\n\n### 练习 12.1\n假设分类器 $(X)$ 基于统计量\
  \ $S(X)$（关于特征向量 $X$ 的实值函数）和阈值 $\\tau$，因此有：\n\n```\n(X) = \\begin{cases} 1 & \\text{if\
  \ } S(X) < \\tau \\\\ 2 & \\text{if } S(X) \\geq \\tau \\end{cases}.\n```\n(12.1)\n\
  \nROC 曲线为：\n```\n{(S) \\geq \\tau = 1, (S) \\geq \\tau = 2\\} : \\tau \\in \\mathbb{R}.\n\
  ```\n(12.2)\n\n1. 证明 $L(2,1)$ 的风险通过以下方程与 ROC 曲线上的某点相关：\n```\n() = (1,2)((S) \\geq\
  \ \\tau = 1) + (2,1)(1 - (S) \\geq \\tau = 2) = 2.\n```\n(12.3)\n\n\n\n\n\n## 2.\
  \ 假设 $S(\\cdot)=1$ 和 $S(\\cdot)=2$ 的分布分别具有密度函数 $(s=1)$ 和 $(s=2)$，使得\n\n```\n(S(\\\
  cdot) < \\tau=1) = \\int_{-\\infty}^{\\tau} (s=1)ds \\text{and }\n(S(\\cdot) < \\\
  tau=2) = \\int_{-\\infty}^{\\tau} (s=2)ds.\n```\n\n证明 $\\frac{d}{d\\tau}(\\tau)=0$\
  \ 当且仅当损失之比满足：\n\n```\nL(2,1)/L(1,2) = \\frac{\\frac{d}{d\\tau}(\\tau=1)}{\\frac{d}{d\\\
  tau}(\\tau=2)}=2.\n```\n\n在许多应用中，我们更关注限制一种类型的错误（例如，将类 1 误分类为类 2），而不是另一种错误（将类 2 误分类为类\
  \ 1）。在这样的情况下，我们寻求一种分类器，能够尽可能正确地识别类 2 的数据，同时将类 1 数据的误分类率保持在可接受的水平。这种情况在假设检验中是为人知的，假设的命名使得目标是找到一个效力最大的检验，只要其水平在可接受的范围内，且在该范围内都是有效的。\n\
  \n[图 12.2] 显示了 $S$ 的类 1 和类 2 分布对，以及对应的功效-水平曲线。选择这些分布是为了说明在实践中遇到的经验功效-水平曲线中出现的某些特征。\n\
  \n![图 12.2 类 1 或类 2 分布的各种特征对功效-水平（ROC）曲线的影响。左上角的单元格显示了两个具有重叠、非嵌套、紧凑支撑的分布。右侧单元格中的\
  \ ROC 曲线在 (0, 0) 以外的点交于垂直轴，并在 (1, 1) 以外的点交于水平线 $y=1$。左侧第二个单元格显示了两个具有相同均值的分布，但类 2\
  \ 分布的方差更大。右侧单元格中的 ROC 曲线在小水平下（曲线与 $y=x$ 交叉点的左侧，在本例中为一半）优于随机猜测，但在大水平下劣于随机猜测。左侧第三个单元格显示了一个带有点质量的类\
  \ 2 分布（略微加粗以便可见）。右侧单元格中的 ROC 曲线显示了一个垂直间隙，对应于点质量导致的 $P(S \\ge \\tau | Y=2)$ 随 $\\\
  tau$ 变化的不连续。左侧最下方单元格显示了一个带有点质量的类 1 分布（略微加粗以便可见）。右侧单元格中的 ROC 曲线显示了一个水平间隙，对应于点质量导致的\
  \ $P(S \\ge \\tau | Y=1)$ 随 $\\tau$ 变化的不连续。](img/c12f002.jpg)\n\n\n\n\n\n图 12.2\
  \ 类别 1 或类别 2 分布的不同特征对功率-尺寸（ROC）曲线的影响。左上角单元格显示了两个具有重叠、非嵌套、紧凑支撑的分布。右侧单元格中的 ROC 曲线在\
  \ (0, 0) 以外的点交垂直轴，并在 (1, 1) 以外的点交水平线 `y` = 1。左侧数第二个单元格显示了两个均值相同的分布，但类别 2 分布的方差更大。右侧单元格中的\
  \ ROC 曲线在小尺寸下优于随机猜测（曲线与直线 `y` = `x` 交点左侧，在本例中为一半），在大尺寸下劣于随机猜测。左侧数三个单元格显示了一个具有点质量的类别\
  \ 2 分布（稍微加粗以便显示）。右侧单元格中的 ROC 曲线显示出一个垂直间隙，对应于作为 `τ` 函数的 `P(S ⩾ τ | Y = 2)` 的不连续性，这是由点质量引起。左下角单元格显示了一个具有点质量的类别\
  \ 1 分布（稍微加粗以便显示）。右侧单元格中的 ROC 曲线显示出一个水平间隙，对应于作为 `τ` 函数的 `P(S ⩾ τ | Y = 1)` 的不连续性，这是由点质量引起。\n\
  \n## 12.4 性能的一维测量\n\n给定分类器 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c12\\_ILM0036.gif\"><mrow><mover accent=\"true\"><mi>f</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>)</mo></mrow></mrow></math>![](img/c12_ILM0036.gif)`\
  \ 的风险是一个一维值，它结合了分类器的错误倾向以及产生不同类型错误所遭受的主观损失。正如第 2 章 中讨论，使用能够表达这些错误现实后果的损失函数对于恰当选择和训练分类器至关重要。\n\
  \n尽管如此，文献中有很多种尝试将训练好的分类器的性能表示为单一数字。这里介绍了其中两种。\n\n将两种类型的错误概率简化为单一总结数字的一种流行方法是 `ROC\
  \ 曲线下的面积`，它是一个 0 到 1 之间的数字。(4) 正如下练习所示，ROC 曲线下的面积可以解释为：当随机（且独立地）抽取一个类别 2 数据和一个类别\
  \ 1 数据时，类别 2 数据产生更高的测试统计量 `S` 值的概率。\n\n### 概率积分变换\n\n**练习 12.2 概率积分变换。** 令 `S` 为一个具有正密度函数的实值随机变量，使得\
  \ `S` 的累积分布函数 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
