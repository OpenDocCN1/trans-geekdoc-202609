  \ `h` 应用于联合随机变量 `(S[1], S[2])`，并注意到 ROC 曲线是集合 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c12\\_ILM044.gif\"><mrow><mo>{</mo><mi>h</mi><mo>(</mo><mi>&#x03ca</mi><mo>,<mi>&#x03ca</mi</mo><mo>:</mo><mi>&#x03ca</mi><mo>&#x2208;</mo><mi\
  \ class=\"double-struck\">R</mi</mo></mo></math>`*![](img/c12_ILM044.gif)`。\n\n\
  通过 ROC 曲线下的面积来衡量分类器的质量，隐含地假设了从业人员对损失函数一无所知：在二分类分类中，即比率 L(1, 2)/L(2, 1)。这从是不可能（或者说不应该）的情况。\n\
  \n\n\n\n另一种用单个数字概括性能的方法（其值也处于 0 到 1 之间）是分类器或假设检验的 `F-measure`（`F-measure`）。它的定义为：\n\
  \n```\nF = 2 \\times \\frac{precision \\times recall}{precision + recall}\n```\n\
  \n![numbered Display Equation](img/c12_M0016.gif)\n\n**练习 12.4** 证明 `F-measure`\
  \ 满足：\n\n```\nF = 2 \\times \\frac{P(H_a \\text{ is true and reject } H_0)}{P(H_a\
  \ \\text{ is true}) + P(\\text{ reject } H_0)} \\in [0, 1].\n```\n\n![numbered Display\
  \ Equation](img/c12_M0017.gif)\n\n## 12.5 混淆矩阵\n\n训练过的分类器在验证（或测试）数据上的性能可以用 `C` ×\
  \ `C` 矩阵来总结，该矩阵称为`混淆矩阵`，定义如下：\n\n```\nN(d, c) = \\text{number of validation data\
  \ } (x_i, d) \\text{ such that } \\hat{f}(x_i) = c.\n```\n\n![numbered Display Equation](img/c12_M0018.gif)\n\
  \n该矩阵的对角线元素统计分类正确的验证数据，而非对角线元素 `N(d, c)` 则统计分类器 `hat{f}` 将类别 `d` 的数据误分类为类别 `c` 的次数。当分类器通过装袋（bagging）产生时，每个数据可以通过其袋外（out-of-bag）分类器，从而产生一个`袋外混淆矩阵`。\n\
  \n对于真实标签是索引混淆矩阵的行还是列，并没有统一的标准。在展示混淆矩阵时，应该注意明确行索引是什么。\n\n**练习 12.5** 证明从混淆矩阵的角度来看，第\
  \ 7.2 节定义的验证风险估计为：\n\n```\n\\hat{R}_{valid} = \\frac{1}{n} \\sum_{(d,c) \\in C \\\
  times C} L(d, c) N(d, c)\n```\n\n![numbered Display Equation](img/c12_M0019.gif)\n\
  \n其方差估计为：\n\n```\nVar(\\hat{R}_{valid}) = \\frac{1}{n} \\sum_{(d,c) \\in C \\times\
  \ C} L(d, c)² N(d, c) - \\hat{R}_{valid}²\n```\n\n![numbered Display Equation](img/c12_M0020.gif)\n\
  \n## 12.6 多重检验\n\n通常会有多个类别预测产生的情况——即一个训练好的分类器用于预测不止一个数据点的类别——或者等价地进行多次假设检验。在某些应用中，每个拒绝零假设的数据（预测为类别\
  \ 2 的数据）都会触发某种行动（可能是进一步分析），而每个保留零假设的数据（预测为类别 1 的数据）不触发任何行动。每个行动都会产生成本，而且正确识别类别 2\
  \ 数据（在零假设实际上为假时拒绝它）认为会有相应的收益。\n\n如果执行了 `T` 次不同的显著性水平为α检验，那么假阳性的预期数量为 `αT`，如果 `T`\
  \ 很大，这可能对应于数量不可接受的高成本产生行动数量。如果提前已知 `T`，那么调整 `α` 以使假阳性带来的预期成本受到限制是自然而然的。关于应该如何这样做，至少有两种观点。\n\
  \n### 12.6.1 控制族错误率 (Familywise Error)\n\n\n\n\n`T` 次统计检验的`全族错误率`（familywise error\
  \ rate）是其中`任何`检验错误地拒绝零假设的概率，\n\n<displayedItem type=\"mathematics\" xml:id=\"c138-disp-0001\"\
  \ numbered=\"no\"><math display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><mi mathvariant=\"normal\">P</mi><mfenced open=\"(\" close=\")\"><mrow><mspace\
  \ width=\"0.25em\"/><munderover><mo>&#8899;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>T</mi></munderover><mspace\
  \ width=\"0.25em\"/><mfenced open=\"{\" close=\"}\"><mrow><msub><mi>H</mi><mn>0</mn></msub><mspace\
  \ width=\"0.25em\"/><mtext>is true for the</mtext><mspace width=\"0.25em\"/><mi>i</mi><mi>th</mi><mspace\
  \ width=\"0.25em\"/><mtext>test and the</mtext><mspace width=\"0.25em\"/><mi>i</mi><mi>th</mi><mspace\
  \ width=\"0.25em\"/><mtext>test rejects</mtext><mspace width=\"0.25em\"/><msub><mi>H</mi><mn>0</mn></msub></mrow></mfenced><mspace\
  \ width=\"0.25em\"/></mrow></mfenced><mo>.</mo></math></displayedItem> ![numbered\
  \ Display Equation](img/pg226-1.gif)\n\n后续练习介绍了两种方法，称为`Šidák 校正`(Šidák correction）和`Bonferroni\
  \ 校正`(Bonferroni correction），它们通过调整单个检验的大小，使得全族错误率低于给定的边界。从应用角度来说，这些方法限制了由于处理假阳性而产生`任何成本`的概率，而无论处理真阳性会产生多少成本。\n\
  \n**练习 12.6** 假设在 `T[0] ⩽ T` 次规模为 `s` 的独立检验中，零假设是正确的。计算至少有一个检验错误地拒绝零假设的概率 `p(s)`。给定\
  \ `α`，解方程 `p(s) = α` 得 `s`，并提出一个 `s` 值，使得这 `T` 次检验的全族错误率小于或等于 `α`。这被称为多次检验的`Šidák\
  \ 校正`。\n\n**练习 12.7** 假设在 `T[0] ⩽ T` 次（不一定独立）规模为 `s` 的检验中，零假设是正确的。利用基本事实^(6)：对于任何事件集\
  \ `E[1], …, E[k]`，`P(E[1]∪⋅⋅⋅∪E[k]) ⩽ P(E[1]) + ⋅⋅⋅ + P(E[k])`，找到至少有一个检验错误地拒绝零假设的概率边界\
  \ `p(s)`。给定 `α`，解方程 `p(s) = α` 得 `s`，并提出一个 `s` 值，使得这 `T` 次检验的全族错误率小于或等于 `α`。这被称为多次检验的`Bonferroni\
  \ 校正`。\n\n这些方法在意义上都是保守的，因为如果 `T[0] ≪ T`，它们产生的全族错误率将小于目标值 `α`。布尔不等式的使用使得 Bonferroni\
  \ 校正更加保守，特别是当 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c12\\_ILM0046.gif\"><mrow><mi>s</mi><mo>&#x226a;</mo><mfrac><mn>1</mn><mi>T</mi></mfrac></mrow></math>`(images/c12_ILM0046.gif)。\n\
  \n### 12.6.2 控制错误发现率\n\n`T` 次统计检验的`错误发现率`（false discovery rate）是在该检验拒绝零假设的条件下，任何给定检验的零假设为正确的概率，\n\
  \n![numbered Display Equation](img/pg227-1.gif)\n\n介绍了两种略有不同的方法来控制错误发现率，取决于检验是否独立：\n\
  \n![](img/c12uf001.jpg)\n\n其中 `<displayedItem xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" id=\"c12-disp-0016\"\
  \ type=\"mathematics\" numbered=\"no\"><math display=\"block\" location=\"image\\\
  _n/c12\\_M0021.gif\"><mrow><msub><mi>a</mi><mi>T</mi></msub><mo>=</mo><mfenced separators=\"\
  \" open=\"{\" close=\"\"><<table>><mtr><td columnalign=\"right\"><mn>1</mn></td><td\
  \ columnalign=\"right\"><mrow><mi> if </mi><mi> the </mi><mi> tests </mi><mi> are\
  \ </mi><mi> independent </mi></mrow></td></mtr><mtr><td columnalign=\"right\"><mn>0</mn></td><td\
  \ columnalign=\"right\"><mrow><mi> if </mi><mi> the </mi><mi> tests </mi><mi> not\
  \ </mi><mi> independent </mi></mrow></td></mtr></</table>></mfenced></mrow></math></displayedItem>`\n\
  \n\n\n针对这种情况，有一种建设性的应对方法：寻找一位专家（理想情况下是多位独立的专家）。在这种语境下，专家是指在训练或工作生涯中见过许多麦肯锡苹果和许多脐果橙的人。她的大脑中存在一个预测过程，可以区分苹果和橙子，这个过程已经通过许多连续的应用得到了验证和更新。该过程的某些可能是潜意识的。在上述情况下，`model\
  \ the expert`可能比建模可用数据要好得多。建模专家的结果就是一个`expert system`。\n\n建模专家简单的方法是询问专家她如何根据观察做出“苹果对\
  \ 橙子”的决策，并尝试用算法模拟她的决策过程。`Naive Bayes` 和树类分类器 classifiers 器是实现此目的的良好框架。如果可能，观察专家对以前未见的苹果和橙子做出决策也是很有用的，以便捕捉她决策过程中重要但潜意识的元素。这可能需要很长时间。\n\
  \n成功近似专家行为可能非常具有挑战性，特别是在为不同类型的证据分配权重时。如果可能，从专家处获取的模型应该在标记数据上进行验证。然而，唯一可能的验证方法可能是另一位专家的意见——“听起来合理”。\n\
  \n# 13 机器学习面临的挑战\n\n> 决策者只有在对未来存在不确定性时才需要预测。\n> —J. Scott Armstrong, *预测原理：研究人员与从业者手册*,\
  \ 2001\n\n本章简要介绍了机器学习的几个增长领域，这些领域通常源于获取数据、传输数据、存储数据、分析数据以及计算数据的相对成本的变化。\n\n## 13.1\
  \ 流式数据\n\n`Streaming data`是指生成速度或数量超过长期存储能力的数据。每个`datum`在到达时必须立即用于任何适当的目的（训练模型、用于预测、更新聚类等），然后被永久丢弃。一个关注领域是预测模型的持续训练和评估。\n\
  \n## 13.2 分布式数据\n\n`Distributed data` 在抽象上包含单个数据集，但在物理上位于通信网络中独立的存储设备上，该网络延迟高到以至于单个处理器无法以原始形式处理所有数据。数据的分布可能是因为最初在多个地点收集，或者为了通过在许多硬盘上并行读取操作来缩短对大量数据的访问时间。为了\
  \ Practical 可行性，应用于分布式数据的算法可能只跨网络传输任何特定存储设备上数据的较小摘要。这就是`cloud computing`的基础。\n\n\
  ## 13.3 半监督学习\n\n`Semi-supervised learning`试图通过从未标记数据中提取信息来提高在标记数据上训练的分类器的性能。半监督学习的动机是标记数据昂贵或稀少，而未标记数据廉价或丰富。半监督学习问题的一个例子是训练近簇分类器，其中未标记数据可以提供关于簇的大小、形状和数量的信息，而标记数据也提供关于每个簇中数据类别的信息。\n\
  \n## 13.4 主动学习\n\n`Active learning`指的是一个迭代过程，根据分类器预测的不确定性按顺序获取标记数据。主动学习的目标是获得一个较小的（因此相对便宜的）标记数据集，对于训练分类器尽可能有用。主动学习从一组初始标记数据\
  \ `M` = {`x[1]`, `y[1]`, …, (`x[n]`, `y[n]`)} 和一组特征向量 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c13_ILM0001.gif\"><mrow><mi>U</mi><mo>=</mo><mo>{</mo><msub><mover\
  \ accent=\"true\"><mi>x</mi><mo>&#x02dc;</mo></mover><mn>1</mn></msub><mo>,</mo><mo>&#x22ef;</mo><mo>,</mo><msub><mover\
  \ accent=\"true\"><mi>x</mi><mo>&#x02dc;</mo></mover><mi>k</mi></msub><mo>}</mo></mrow></math>`![](img/c13_ILM0001.gif)\
  \ 它们是未标记的。假设任何未标记数据 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c13\\_ILM0002.gif\"><msub><mover accent=\"true\"><mi>x</mi><mo>&#x02dc;</mo></mover><mi>i</mi></msub></math>`![](img/c13_ILM0002.gif)\
  \ 的真实类别标签可以获得（通过某种代价），主动学习通过迭代以下步骤进行：\n\n![](img/c13uf001.jpg)\n\n预测的不确定性可以通过估计概率分布中的熵来衡量，`<math\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c13_ILM0003.gif\"><mrow><mover accent=\"true\"><mi>x</mi><mo>&#x02dc;</mo></mover><mi>i</mi></msub></math>`（此处未完全显示但在文中有引用）在似然方法、逻辑回归或神经网络中；或者通过支持机的松弛变量。\n\
  \n## 13.5 通过深度神经网络构建特征\n\n通过深度神经网络构建新的、富有信息的特征（例如第 11.3.1 节所述的自动编码器）仍处于早期阶段。在写作时，这可能是机器学习中进展最快的部分。\n\
  \n## 13.6 迁移学习\n\n`Transfer learning`试图从一个分类问题学习实用的想法并将其应用于另一个问题：通常是从数据丰富的问题到数据稀少的问题。例如，给定一组足够大的照片，每张都标记为“猫”或“狗”，可以训练一个深度自动编码器来构建用于区分猫和狗照片的高阶特征。这些特征（即深度自动编码器的参数）在一个相关的分类问题（例如，区分土拨和兔子的照片）中可能非常有用，而该问题没有足够的数据来训练实用的自动编码器。\n\
  \n## 13.7 复杂模型的解释性\n\n随着人类越来越多地依赖使用机器学习做出可能改变生活的决策（例如，在自动驾驶汽车或算法医疗诊断中）或具有全球影响的决策（例如算法对金融市场的影响），对准确且可解释的预测模型的需求将增加。为了回顾性分析、为了知道谁或什么对严重错误的后果负责，以及为了开发对未见输入组合具有验证稳健性的模型，将需要解释性模型。\n\
  \n# 14 R 源代码\n\n\n\n本章展示了如何实现第 4 章和第 6 章中描述的几乎所有分类器的训练和应用方法，使用了第 7 章中描述的风险估计和模型选择方法，以及（至少隐含地）第\
  \ 10 章中描述的优化方法。在本章中提供 R 代码的目的是让读者以最少的努力学习更多分类知识，特别是书中描述的许多特定方法。为此，代码编写得既透明又简洁，以便计算机语言不会成为读者理解和感知所实现的数学、统计和算法思想之间的障碍。这导致了以下选择：\n\
  \n1. 代码本身依赖于从综合 R 归档网络 (CRAN) `cran.r-project.org` 轻松获取的 R 库。\n\n2. 代码中没有留空间检查输入是否满足各种要求（例如，读者可以自由地在用于内核密度估计的分类器中使用负带宽，并承担后果）。代码中也没有留空间来防止数值溢出或下溢等数值问题。\n\
  \n3. 关于代码的大部分讨论集中在匹配调优参数，这些参数控制分类器的行为（以及在相关情况下，通过在数据上训练分类器估计的模型参数）与软件作为输入或输出返回的值进行匹配。也就是说，将分类器背后的思想对应代码参数，并进一步对应数据在特定情况下关于这些思想告诉我们的信息。(1)\n\
  \n4. 几件可以做得更通用、因此作为软件可能更有用的事情，被刻意没有进行通用化处理。\n\n本章并不打算作为 R 语言的通用教程，也不是所使用的各种 R 函数和库文档的替代品。\n\
  \n## 14.1 作者的偏见\n\n与本书的其他章节不同（其他章节本质上是关于*是什么*：神经网络是一种，二次判别分析是另一种，且两者通常不相同），本章是关于人们*做什么*。在作者看来，人们的所为受到许多因素的影响：习惯、偏见和懒惰，以及对某些主观目标进行理性、客观优化的尝试。为了让读者更容易将本章代码的客观要求与作者的偏见分开来，这里列出了其中的几种偏见。\n\
  \n1. 对于计算，我的母语言是 `C`。我写过超过 100,000 行 `C` 代码，尽管许多“高层”语言提供了便利，我仍然偏爱 `C` 的优雅极简主义。\n\
  \n2. 如果我要在软件开发上投入大量时间，我倾向于在一个标准下工作。我 20 多年前用 `ANSI-C` 编写的代码仍然可以编译并正确运行——而为本章初稿编写的代码就无法做到，更不用说我为\
  \ R 版本 1 编写的代码了。\n\n3. 我倾向于在一个屏幕上尽可能显示更多的代码，利用水平和垂直空间来排列行。这意味着我在每行 R 代码的结尾都会加上一个（通常是不必要的）分号。\n\
  \n## 14.2 库\n\n本章代码使用了 R 库的函数：`cluster`、`MASS`、`mclust`、`nnet`、`randomForest`、`rpart`、`stats`\
  \ 以及（可选的）`parallel`。每个章节将通过使用 `library()` 函数加载库来指示特定库的使用。这些库包含许多本章未使用的函数和数据集，但读者在探索时可能会发现它们有用。尽管通常使用现有的\
  \ R 库，但在某些情况下作者不知道实现第 4 章和第 6 章中描述特定方法的库，或者发现直接在 R 中实现某种方法相当高效。\n\n## 14.3 运行示例（第\
  \ 4 节）\n\n第 4 章和第 6 章中描述的各种分类方法通过 R 代码进行了说明，使用了第 4 节中介绍的示例问题数据。回想该示例，数据具有 `m = 2`\
