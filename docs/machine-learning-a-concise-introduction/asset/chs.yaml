  \ 4.1 中所示的真实密度相似。带宽参数的较大值会导致密度估计在数据周围的大邻域内几乎保持常数。\n\n![图 4.7 使用高斯核密度估计估计的类别密度（左）和分类决策（右侧），从上到下带宽分别为\
