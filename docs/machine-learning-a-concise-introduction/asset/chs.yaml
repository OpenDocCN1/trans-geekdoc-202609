  \ 分类器。第三行显示了从第 4.3 节 左侧的四个单元格显示了 1-邻域分类器。这种方法具有高方差：从单元格之间，平面上的分类发生了显著变化，特别是在每个单元格的中心。这种方法具有低偏差：大多数预测的边界非常接近贝叶斯边界（白色曲线）。该方法的风险约为\
