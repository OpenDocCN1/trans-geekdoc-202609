  \ Display Equation](img/c14_M0008.gif)\n\n第二行将该向量与权重向量 (`w[1]`, …, `w[J]`) 逐坐标元素地相乘，并返回得到的\
  \ `J` 个数字之和。混合分量的数量 `J` 在 R 代码中没有被显式指定，因为它是通过输入矩阵 `mu` 的维度和输入向量 `w` 的长度确定的。\n\n\
  贝斯分类器在给定的点 `x` 处应用函数 `bayes.lik.mix()`，使用对应于三个类别中每个类别的每组三个均值，在每种情况下均具有相等的混合权重。函数\
  \ `bayes.predict()` 输出对应于 `x` 处产生极大似然的高斯混合模型的类别^(4)。\n\n\n\n\n\n注意，`bayes.lik.one()`\
  \ 中的常数 $\\frac{1}{2\\pi}$ 对贝叶斯分类器没有影响，可以省略以节省工作量；`bayes.lik.mix()` 中每个高斯混合模型分量的等权重值\
  \ $\\frac{1}{3}$ 也是如此。可以通过对测试数据应用贝叶斯分类器来估计贝叶斯风险\n\n```\npred.class = bayes.predict.many(edat[,1:2]);\n\
  risk.test(pred.class);\n```\n\n## 14.5 二次判别分析\n\n使用 `MASS` 库中的 `qda()` 函数拟合二次判别分析（QDA）模型：\n\
  \n```\nlibrary(MASS);\nm = qda(as.factor(tdat[,3])~.,data=tdatDF,method=\"mle”);\n\
  ```\n\n拟合模型等于分别计算训练数据中每个类的均值和协方差。每个类别的估计均值保存为 $\\mu_c$，其中 $c = 1, \\dots, C$。`qda()`\
  \ 函数没有保存每个类的估计协方差矩阵 $\\Sigma_1², \\dots, \\Sigma_C²$，而是保存了逆协方差矩阵的 Cholesky 分解。即\
  \ `qda()` 计算并保存了三角矩阵 $W_c$，使得 $W_c W_c^T = \\Sigma_c^{-1}$（对于 $c = 1, \\dots, C$）。这是为了计算在拟合模型下任意点\
  \ $x$ 处的似然函数：\n\n$\\delta_c(x) = -\\frac{1}{2}(x-\\mu_c)^T\\Sigma_c^{-1}(x-\\mu_c)\
  \ - \\frac{1}{2}\\log|\\Sigma_c| - \\frac{p}{2}\\log(2\\pi)$\n\n使用 `predict()` 函数通过拟合模型\
  \ `m` 对测试数据进行预测，并将预测结果与测试数据的真实类别标签比较，以产生风险的测试估计。\n\n```\npred.class = predict(m,edatDF)$class;\n\
  risk.test(pred.class);\n```\n\n## 14.6 线性判别分析\n\n使用 `MASS` 库中的 `lda()` 函数拟合线性判别分析（LDA）模型：\n\
  \n```\nlibrary(MASS);\nm = lda(as.factor(tdat[,3])~.,data=tdatDF,method=\"mle”);\n\
  ```\n\n与 `qda()` 类似，每个类的估计均值保存在 `m$means` 中。该函数返回一个不一定是三角的矩阵 $W = m\\$scaling$，其属性为\
  \ $WW^T = \\Sigma^{-1}$。使用 `predict()` 函数通过拟合模型 `m` 对测试数据进行预测，方法与 QDA 完全相同\n\n```\n\
  pred.class = predict(m,edatDF)$class;\nrisk.test(pred.class);\n```\n\n## 14.7 高斯混合模型\n\
  \n使用 `mclust` 库中的 `MclustDA()` 函数拟合高斯混合模型。\n\n```\nlibrary(mclust);\n```\n\n每个类使用的混合分量数量由向量\
  \ $J[1], \\dots, J[C]$ 表示，由用户指定。在第 4.4 节中，我们考虑过每个类使用两个混合分量或每个类使用三个混合分量：\n\n```\n\
  J = c(2,2,2);\n```\n\n或\n\n```\nJ = c(3,3,3);\n```\n\n给定 $J$，通过调用以下代码拟合模型\n\n```\n\
  m = MclustDA(tdat[,1:2],tdat[,3],G=as.integer(J),\nmodelNames=“VVV”);\n```\n\n\n\
  \n\n拟合模型等同于对于每个类 `c = 1, …, C`，寻找权重 $w_{1c}, \\dots, w_{J_cc}$![](img/c14_ILM0017.gif)、均值\
  \ $\\mu_{1c}, \\dots, \\mu_{J_cc}$![](img/c14_ILM0018.gif)以及协方差矩阵 $\\Sigma_{1c},\
  \ \\dots, \\Sigma_{J_cc}$![](img/c14_ILM0019.gif)，使得似然近似极大化\n\n```math\n\\prod_{i=1}^{n}\
  \ \\left( \\sum_{j=1}^{J_i} w_{ji} \\exp\\left( -\\frac{1}{2}(x_i - \\mu_{ji})^T\
  \ \\Sigma_{ji}^{-1} (x_i - \\mu_{ji}) \\right) \\right) = .\n```\n![](img/c14_M0015.gif)\
  \ 这是通过期望极大化（`EM`）算法实现的，如 `Section 10.7` 中的 `6` 所述。字符串 `\"VV\"` 表示在搜索最优参数时对协方差矩阵没有设置任何限制。\n\
  \n每个类 `c = 1, …, C` 和每个混合分量 `j = 1, …, J[c]` 的估计权重、均值和协方差被保存为\n\n```math\n\\begin{aligned}\n\
  w^jc &= m$\"c\"parameters\"j \\\\\n\\mu^jc &= m$\"c\"mean\"j \\\\\n\\Sigma^jc &=\
  \ m$\"c\"parameters\"variance sigmaj.\n\\end{aligned}\n```\n![](img/c14_M0016.gif)\
  \ 估计协方差矩阵的 Cholesky 分解也被保存了，其中上述行中的 `chol` 替换了 `sigma`。使用拟合的 `m` 通过 `predict()`\
  \ 函数在测试数据上进行预测：\n\n```r\npred.class = as.numeric(predict(m[,2])$class);\n```\n\n\
  ## 14.8 核密度估计 ([4.4])\n\n核密度估计始于核函数。在 `Section 4.4` 中，高斯核定义为\n\n```r\nK = function(x)\
  \ { return(exp(-0.5*x%x)) }\n```\n\n而 Epanechnikov 核被定义为\n\n```r\nK = function(x)\
  \ { return(max(0,length(x)-x%x)) }\n```\n\n在上面的代码中，高斯核省略了归一化常数 $\\Gamma(\\frac{m}{2}+2)\\\
  pi^{-\\frac{m}{2}}$![](img/c14_ILM0020.gif)，Epanechnikov 核省略了归一化常数 $\\Gamma(\\frac{m}{2}+2)\\\
  pi^{-\\frac{m}{2}}(m+4)^{-\\frac{m}{2}-1}$![](img/c14_ILM0021.gif)，因为这些常数不影响 KDE\
  \ 分类器的预测结果。\n\n\n\n\n函数 `kde.liks()` 输入一个点 $x \\in \\mathbb{R}^m$，一组存储在 $k \\times\
  \ m$ 矩阵行中的 $k$ 个 $\\mathbb{R}^m$ 空间点，\n\n```\ndat = \\begin{bmatrix} z_1 \\\\ \\\
  vdots \\\\ z_k \\end{bmatrix}\n```\n\n以及一个带宽参数 $h$，并计算似然函数在 $x$ 处的核密度估计：\n\n```\n\
  \\hat{P}(x) = \\frac{1}{k} \\sum_{i=1}^{k} \\frac{1}{h^m} K\\left(\\frac{x-z_i}{h}\\\
  right)\n```\n\n```\nkde.liks = function(x,dat,h) {\n\tv = t(x-t(dat))/h;\n\tliks\
  \ = apply(v,1,K);\n\treturn(mean(h^-dim(dat)[2]*liks));\n}\n```\n\n`kde.liks()`\
  \ 的第一行计算向量\n```\n\\left(\\frac{x-dat[1,]}{h}, \\dots, \\frac{x-dat[k,]}{h}\\right)\n\
  ```\n第二行将核函数 `K` 逐元素应用于该向量，计算出\n```\nK\\left(\\frac{x-dat[1,]}{h}\\right), \\dots,\
  \ K\\left(\\frac{x-dat[k,]}{h}\\right)\n```\n\n第三行将该向量的每个坐标乘以 $h^{-m}$，对该长度为 $k$\
  \ 的向量的元素求和，并除以 $k$。\n\n函数 `kde.predict()` 输入一个点 $x \\in \\mathbb{R}^m$，一组存储在 $n\
  \ \\times m$ 矩阵 `datx` 行中的 $n$ 个 $\\mathbb{R}^m$ 空间点，一个范围在 $1, \\dots, C$ 的长度为 $n$\
  \ 的类别标签向量 `daty`，以及长度为 $C$ 的带宽向量 $h = (h[1], \\dots, h[C])$。在第一行中，它根据向量 `daty` 的计数估计类别标签的先验（边缘）分布：\n\
  \n```\nP(Y=c) = \\frac{|\\{i : daty[i]=c\\}|}{n}\n```\n\n\n\n\n对于 `c` = 1, …, `C`。在第二和第三行中，它计算了每个类别数据似然函数的核密度估计：\n\
  \n```math\nP(x|Y=c) = \\frac{1}{n_c} \\sum_{i=1, y_i=c}^n \\frac{1}{h_c} K\\left(\\\
  frac{x-x_i}{h_c}\\right)\n```\n\n![numbered Display Equation](img/c14_M0022.gif)\n\
  \n对于 `c` = 1, …, `C`。在第四行中，它预测后后验概率最大的类别：\n\n```math\nargmax_{c=1,\\dots,C} P(Y=c|x)\
  \ = argmax_{c=1,\\dots,C} P(x|Y=c)P(Y=c).\n```\n\n![numbered Display Equation](img/c14_M0023.gif)\n\
  \n```r\nkde.predict.one = function(x,datx,daty,h) {\n t = table(daty); priors =\
  \ t/sum(t);\n liks = vector(“numeric”,nc);\n for(cc in 1:nc) {\n liks[cc] = kde.liks(x,datx[daty==cc,],h[cc]);\
  \ }\n return(max.col(t(priors*liks)));\n}\n```\n\n选择一个 KDE 分类器意味着选择一个带宽向量 `h` =\
  \ (`h[1]`, …, `h[C]`) 来优化某些风险估计。函数 `kde.loo.one()` 的输入是一个 `n` × `m` 的特征向量矩阵 `datx`、一个长度为\
  \ `n` 的类别标签向量 `daty`、一个长度为 `C` 的带宽向量 `h` 以及集合 `{1, …, `n`}` 中的一个索引 `o`。它使用带有带宽向量\
  \ `h` 除第 `o` 外的所有数据的 KDE 分类器预测第 `o` 个数据的类别。然后它将预测结果与真实类别 `daty[o]` 进行比较。如果 KDE 分类器预测错误，则返回\
  \ R 布尔值 `TRUE`（数值值 1）；如果 KDE 分类器预测正确，则返回 R 布尔值 `FALSE`（数值值 0）。\n\n```r\nkde.loo.one\
  \ = function(datx,daty,h,o) {\n pred = kde.predict.one(datx[o],datx[-o],daty[-o],h);\n\
   return(pred!=daty[o]);\n}\n```\n\n函数 `kde.loo.all()` 对每个留出的数据点都应用函数 `kde.loo.one()`，并返回\
  \ KDE 分类器产生错误预测平均次数：即，`kde.loo.all()` 计算了在给定带宽向量 `h` 以及给定的训练数据 `datx` 和 `daty` 下，基于\
  \ 0–1 损失的 KDE 分类器的留一交叉验证风险估计。\n\n```r\nkde.loo.all = function(datx,daty,h) {\n errs\
  \ = sapply(1:dim(datx)[1],kde.loo.one,datx=datx,\n daty=daty,h=h);\n return(mean(errs));\n\
  }\n```\n\n引入所有带宽均等的约束 `h[1]` = ⋅⋅ = `h[C]`（这在第 4 章的运行示例中似乎是合理的），带宽选择被简化为一个一维优化问题。图\
  \ 14.2 显示了对于高斯核和 Epanechnikov 核，不同带宽下的留一风险估计。图 14.2 中的图表表明，任何粗略处于 [0.3, 1.2] 范围内的带宽可能都一样好，从风险的角度来看，没有太大理由选择高斯核而非\
  \ Epanechnikov 核。\n\n```r\nhcol = c(0.01,0.05,seq(0.1,1.5,0.05),2:5);\nhmat = cbind(hcol,hcol,hcol);\n\
  errs = apply(hmat,1,kde.loo.all,datx=tdat[,1:2],\n daty=datat[,3]);\nplot(hcol,errs,xlab=“Bandwidth\"\
  ,ylab=“Estimated Risk”,\n type=“l”,ylim=c(0,0.4*1.05));\n```\n\n![Figure 14.2 密度密度估计分类器风险的留一交叉验证估计，它是关于每个类别所使用的带宽\
  \ h = h1 = h2 = h3 的函数。](img/c14f002.jpg)\n\n图 14.2 密度密度估计分类器风险的留一交叉验证估计，它是关于每个类别所使用的带宽\
  \ `h` = `h[1]` = `h[2]` = `h[3]` 的函数。\n\n人们不必接受 `h[1]` = ⋅⋅ = `h[C]` 的约束，而是可以寻找一个带宽向量（`h[1]`,\
  \ …, `h[C]`）来使留一交叉验证风险估计最小化，可以使用优化方法如 Nelder–Mead 算法（在第 10.2 节描述）。这是通过 R 函数 `optim()`\
  \ 实现的，从用户指定的点开始（从下方代码中的 `h` = (0.8, 0.8, 0.8) 开始）。\n\n```r\nlibrary(stats);\noptim(rep(0.8,3),kde.loo.all,method=“Nelder-Mead”,\n\
  datx=tdat[,1:2],daty=tdat[,3]);\n```\n\n在这个示例中，在多次启动的情况下，Nelder–Mead 倾向于在 `h` ∈\
  \ [0.3, 1.2]³ 区域达到最优解，如果 Nelder–Mead 从该框内的某个值启动，它会迅速陷入起始点附近的局部最优。这表明目标函数（留一交叉验证风险估计）具有足够的噪声，以至于没有没有的信息让我们在该区域内选择带宽。\n\
  \n分类器通常用于一次性预测多个点的类别。函数 `kde.predict.many()` 是一种对多个输入点应用 `kde.predict.one()` 的高效方法。待分类的特征向量存储在输入矩阵\
  \ `x` 的行中。\n\n```r\nkde.predict.many = function(x,datx,daty,h) {\n return(apply(x,1,kde.predict.one,datx=datx,daty=daty,h=h));\n\
  }\n```\n\n例如，可以使用 `kde.predict.many()` 计算 KDE 分类器的测试风险估计：\n\n```r\npred.class =\
  \ kde.predict.many(edat[,1:2],tdat[,1:2],tdat[,3],\nrep(0.5,3));\nrisk.test(pred.class);\n\
  ```\n\n## 14.9 直方图 (Section 4.4.5)\n\n\n\n\n\n给定特征向量 `x` = (`x[1]`, …, `x[m]`)，以及一个\
  \ `C` × `m` 的带宽参数矩阵：\n<math display=\"block\" location=\"image\\_n/c14\\_M0024.gif\"\
  ><mrow><mi>h</mi><mo>=</mo><mfenced separators=\"\" open=\"\\[\" close=\"\\]\"><mtable><mtr><td\
  \ columnalign=\"right\"><msub><mi>h</mi><mrow><mn>1</mn><momo><mn>1</mn></mrow></msub></mtd><td\
  \ columnalign=\"right\"><mo>&#x22ef;</mo></td><td columnalign=\"right\"><msub><mi>h</mi><mrow><mn>1</mn><momo><mi>m</mi></mrow></msub></mtd></mtr><mtr><td\
  \ columnalign=\"right\"><mo>&#x22ee;</mo></td><td/><td columnalign=\"right\"><mo>&#x22ee;</mo></td></mtr><mtr><td\
  \ columnalign=\"right\"><msub><mi>h</mi><mrow><mi>C</mi><momo><mn>1</mn></mrow></msub></td><td\
  \ columnalign=\"right\"><mo>&#x22ef;</mo></td><td columnalign=\"right\"><msub><mi>h</mi><mrow><mi>C</mi><momo><mi>m</mi></mrow></msub></td></mtr></mtable></mfenced><mo>,</mo></mrow></math></displayed>\n\
  \n编号的显示方程\n\n矩形 <math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c14\\_ILM0028.gif\"><mrow><msub><mi>R</mi><mi>c</mi></msub><mrow><mo>(</mo><msub><mi>i</mi><mn>1</mn></msub><momo><mo>&#x22ef;</mo><momo><msub><mi>i</mi><mi>m</mi></msub><mo>)</mo></mrow><mo>&#x2282;</mo><msup><mrow><mi\
  \ mathvariant=\"double-struck\">R</mi></mrow><mi>m</mi></msup></mrow></math>](images/c14_ILM0028.gif)\
  \ 对于每个类 `c` = 1, …, `C`，可以通过设置找到包含 `x` 的矩形：\n<displayedItem xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\"\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" id=\"c14-disp-0024\"\
  \ type=\"mathematics\" numbered=\"no\"><math display=\"block\" location=\"image\\\
  _n/c14\\_M0025.gif\"><mrow><msub><mi>i</mi><mi>j</mi></msub><mo>=</mo><mfenced open=\"\
  &#x230a;\" close=\"&#x230b;\"><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msub><mi>x</mi><mi>j</mi></msub><msub><mi>h</mi><mrow><mi>c</mi><momo><mi>j</mi></mrow></msub></mfrac></mstyle></mfenced></mrow></math></displayedItem>\n\
  编号的显示方程\n\n对于所有 `j` = 1, …, `m`（这里，⌊⌋ 表示实数 `r` 的整数地板）。实现直方图分类器的关键在于构建一个高效的函数，该函数输入特征向量\
  \ `x`，并对于每个类 `c` = 1, …, `C` 输出包含 `x` 的类-c 矩形 `R[c]`(`i[1]`, …, `i[m]`) 中的训练数据数量。实现这一点的一种方法（在许多情况下是高效的）是构建哈希表。\n\
  \n就目前的目的而言，`hash table` 可以被看作一个数组，其索引不是非负（或正）整数，而是任意离散集合的元素。哈希表的索引称为哈希表的 `keys`（键），而由键索引的条目是哈希表的\
  \ `values`（值）。哈希表是在 R 库 `hash` 中实现的。\n\n```R\nlibrary(hash);\n```\n\n选择直方图分类器通过三个函数：`hist.key()`，`hist.insert()`\
  \ 和 `hist.train()`。这些函数创建并操作一个 R 数据结构（具体是一个 R 列表），它包含以下组件：\n\n1. `HT[[1]]`, …, ,\
  \ `HT[[C]]`—一个包含 `C` 个哈希表的列表，每个类一个；\n2. `HT$h`—`C` × `m` 的带宽参数矩阵 `h`；\n3. `HT$iv`—单元格体积倒数的向量（`V(R[1])^(–1)`,…,*V(R[C])^(–1)`）；\n\
  4. `HT$prior`—在训练数据中出现的类标签的边际分布。\n\n数据结构 `HT` 将是一个全局变量，不会显式地在操作它的 R 函数之间输入输出。\n\n\
  函数 `hist.key()` 输入特征向量 `x` 和类标签 `c`，输出包含 `x` 的类-c 矩形 `R[c]`(`i[1]`, …, `i[m]`) 的索引。在\
  \ `hist.key()` 的输出中，索引（`i[1]`, …, `i[m]`）表示为字符串。\n\n```R\nhist.key = function(datx,cc)\
  \ {\n\tbins = floor(as.numeric(datx)/h);\n}\n```\n\n函数 `hist.insert()` 输入特征向量 `x`。在第二行中，它调用\
  \ `hist.key()` 找到包含 `x` 的类-c 矩形 `R[c]`(`i[1]`, …, `i[m]`) 的索引。在第三和第四行，如果特征落在 `R[c]`\
  \ 中，则创建一个条目；否则增加计数。\n\n```R\nhist.insert = function(dat) {\n\tdatx = dat[,1]; daty\
  \ = dat[,2];\n\tkey = hist.key(datx,cc);\n\tif(has.key(key,HT[[cc]])==FALSE) { HT[[cc]][key]=iv[key];\
  \ }\n\telse { HT[[cc]][key]+1; }\n}\n```\n\n函数 `hist.train()` 输入一组点，通过首先创建必要的哈希表，然后使用\
  \ `hist.insert()` 处理每个点 (`x`, `y`)，最后计算类标签的分布并存储在 `HT$prior` 中。\n\n```R\nhist.train\
  \ = function(datx,daty,h) {\n\tHT <<- vector(\"list\",nc); HT$h <<- h;\n\tfor(cc\
  \ in 1:nc) { HT[[cc]] <<- hash(); };\n\tHT$iv <<- 1/apply(HT$h,1,prod);\n\tapply(cbind(datx,daty),1,hist.insert);\n\
  \tHT$prior <<- as.numeric(table(daty));\n}\n```\n\n训练分类器是 `HT`，即包含 `C` 个哈希表、带宽矩阵和类边际分布的结构。\n\
  \n使用训练分类器进行预测通过四个函数完成：`hist.lookup()`，`hist.post()`，`hist.predict.one()` 和 `hist.predict.many()`。函数\
  \ `hist.lookup()` 输入特征向量 `x` 和类标签 `y`，并返回包含 `x` 的类-y 矩形中的类 `y` 训练数据数量。它通过第一行计算包含\
  \ `x` 的类-y 矩形的索引（`i[1]`, …, `i[m]`）来实现。如果该索引不在类-y 哈希表中作为键出现，则 `hist.lookup()` 返回值\
  \ 0，因为哈希表中缺少该索引表示没有类-y 训练数据落在 `R[y]`(`i[1]`, …, `i[m]`)。否则，(`i[1]`, …, `i[m]`）在类-y\
  \ 哈希表中作为键出现，`hist.lookup()` 返回键关联的值，即矩形中类-y 训练数据的数量。\n\n```R\nhist.lookup = function(datx,daty)\
  \ {\n\tkey = hist.key(datx,daty);\n\tif(has.key(key,HT[[daty]])==FALSE) { return(0);\
  \ }\n\treturn(as.numeric(values(HT[[daty]][key])));\n}\n```\n\n\n\n\n\n函数 `hist.post()`\
  \ 输入一个特征向量 `x`，并对于每个类别 `c = 1, …, C`，返回包含 `x` 的类-c 矩形中出现的训练数据数量。这正比于直方图分类器对后验分布的估计\
  \ `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c14\\_ILM0031.gif\"><mrow><mo>(</mo><mover accent=\"true\"\
  ><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mn>1</mn><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo>=</mo><mi>x</mi><mo)</mo></mrow><mo>,</mo><mo>&#x22ef;</mo><mo>,</mo><mover\
  \ accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>C</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo>=</mo><mi>x</mi><mo)</mo></mrow><mo)</mo></mrow></math>![](img/c14_ILM0031.gif)`，参见练习\
  \ 4.8。如果具有最大后验概率的类别之间存在平（这发生在没有训练数据落在任何包含 `x` 的矩形中时），则通过类别的先验分布来打破。\n\n```\nhist.post\
  \ = function(datx) {\n\tposterior = sapply(1:nc,hist.lookup,datx=datx);\n\tidx =\
  \ which(posterior==max(posterior));\n\tif(length(idx)>1) { posterior=rep(0,nc);\n\
  \tposterior[idx]=HT$prior[idx]; }\n\treturn(posterior);\n}\n```\n\n选择直方图分类器意味着选择一个带宽矩阵\
  \ `h` 以优化某些风险的估计。函数 `hist.loo.one()` 输入一个 `n × m` 的特征向量矩阵 `datx`、一个长度为 `n` 的类别标签向量\
  \ `daty`、一个 `C × m` 的带宽矩阵 `h` 以及集合 `{1, …, n}` 中的一个索引 `o`。它使用带有带宽矩阵 `h` 的直方图分类器和除第\
  \ `o` 条以外的所有数据来预测第 `o` 条数据的类别。然后它将预测结果与真实类别 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c14\\_ILM0032.gif\"><mrow><mrow><mi mathvariant=\"\
  monospace\">daty</mi><mo>\\[</mo></mrow><mi>o</mi><mo>\\]</mo></mrow></math>![](img/c14_ILM0032.gif)`\
  \ 进行比较。如果直方图分类器做出错误的预测，则返回 R 布尔值 TRUE（数值 1），如果直方图分类器做出正确的预测，则返回 R 布尔值 FALSE（数值 0）。\n\
  \n```\nhist.loo.one = function(datx,daty,o) {\n\tposterior = hist.post(datx[o,]);\n\
  \tposterior[daty[o]] = posterior[daty[o]]-1;\n\tpred = max.col(t(posterior));\n\t\
  return(pred!=daty[o]);\n}\n```\n\n函数 `hist.loo.all()` 逐个留出每个数据并应用函数 `hist.loo.one()`，并返回直方图分类器做出错误预测的平均次数：即，`hist.loo.all()`\
  \ 计算在使用给定的带宽向量 `h` 以及给定的训练数据 `datx` 和 `daty` 时，在 0–1 损失下直方图分类器的留一交叉验证风险估计。\n\n```\n\
  hist.loo.all = function(datx,daty,h) {\n\thist.train(datx,daty,h);\n\terrs = sapply(1:dim(datx)[1],hist.loo.one,datx=datx,\n\
  \tdaty=daty);\n\treturn(mean(errs));\n}\n```\n\n引入所有带宽相等的约束 `h[1, 1] = ⋅⋅⋅ = h[C,\
  \ m]`（这在第 4 章的运行示例中似乎是合理的），带宽选择被简化为一维优化。图 14.3 显示了不同带宽的留一交叉验证风险估计。图 14.3 中的图表表明，任何在\
  \ `[1.5, 2]` 范围内的带宽可能一样好。\n\n![图 14.3 直方图分类器风险的留一交叉验证估计，作为每个类别所使用的公共带宽的函数。带宽为 m\
  \ × C h，但我们添加了其元素全部相等的约束](img/c14f003)\n\n图 14.3 直方图分类器风险的留一交叉验证估计，作为每个类别所使用的公共带宽的函数。带宽为\
  \ m × C h，但我们添加了其元素全部相等的约束。`hist.predict.one` 输入一个特征向量 `x` 并根据训练好的分类器预测一个具有后验概率的类别。`hist.predict.many`\
  \ 输入一个 `k × m` 的特征向量矩阵并为每个数据预测一个类别。\n\n```\nhist.predict.one = function(datx) {\n\
  \treturn(max.col(t(hist.post(datx)))); }\nhist.predict.many = function(datx) {\n\
  \treturn(apply(datx,1,hist.predict.one)); }\n```\n\n现在可以训练一个带宽为 `h[1, 1] = ⋅⋅⋅ =\
  \ h[C, m] = 2` 的直方图分类器，并计算其风险的测试估计：\n\n```\nhist.train(datat[:1:2],datat[,3],matrix(2,3));\n\
  pred.class = hist.predict.many(edat[:1:2]);\nrisk.test(pred.class);\n```\n\n## 14.10\
  \ 朴素贝斯分类器 (第 4.4.6 节)\n\n使用核密度估计对每个特征应用朴素贝斯分类器始于一个核函数。可以使用 14.8 中定义的高斯核或帕森核，但由于朴素贝斯分类器以标量而非向量应用这些核，使用\
  \ R 的标量乘法 `x*x` 比 R 的向量内积 `x*%x` 更高效。因此我们定义了高斯核和帕森核的一维版本：\n\n```\nK = function(x)\
  \ { return(exp(-0.5*x*x))}\n```\n\n和\n\n```\nK = function(x) { return(max(0,length(x)+4-x*x))\
  \ }\n```\n\n与 14.8 节一样，高斯核省略了归一化常数 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c14\\_ILM0031.gif\"><msqrt><mrow><mn>2</mn><mi>&#x3c0;</mi></mrow></msqrt></math>`![](img/c14_ILM0031.gif)，帕森核省略了归一化常数\
  \ `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c14\\_ILM0034.gif\"><mfrac><mn>3</mn><mrow><mn>20</mn><msqrt><mn>5</mn></msqrt></mrow></mfrac></math>`![](img/c14_ILM0034.gif)，因为它们不影响预测。\n\
  \n\n\n\n\n`kde.liks.one()` 是第 14.8 节中函数 `kde.liks()` 的一维特化：它输入一个点 $x \\in \\mathbb{R}$![](img/c14_ILM0035.gif)，一组存储在长度为\
  \ $k$ 的向量 `dat` 中的 $k$ 个点 $z_1, \\dots, z_k \\in \\mathbb{R}$![](img/c14_ILM0036.gif)，以及一个带宽\
  \ `h`，并计算然函数在 $x$ 处的一维核密度估计：\n\n$$\\hat{P}(x) = \\frac{1}{k} \\sum_{i=1}^{k} \\\
  frac{1}{h} K\\left(\\frac{x-z_i}{h}\\right).$$\n\n![numbered Display Equation](img/c14_M0026.gif)\n\
  \n```javascript\nkde.liks.one = function(x,dat,h) {\n\tv = (x-dat)/h;\n\tliks =\
  \ K(v);\n\treturn(mean(liks^-1));\n}\n```\n\n`kde.liks.one()` 的第一行计算向量：\n\n$$K\\\
  left(\\frac{x-dat[1]}{h}, \\dots, \\frac{x-dat[k]}{h}\\right)$$\n\n![numbered Display\
  \ Equation](img/c14_M0027.gif)\n\n第二行将核函数 `K` 逐元素应用于该向量，计算：\n\n$$\\left(K\\left(\\\
  frac{x-dat[1]}{h}\\right), \\dots, K\\left(\\frac{x-dat[k]}{h}\\right)\\right).$$\n\
  \n![numbered Display Equation](img/c14_M0028.gif)\n\n第三行通过 $h^{-1}$ 对该向量的每个坐标进行缩放，对所得长度为\
  \ $k$ 的向量的所有项求和，并除以 $k$。\n\n`kde.liks.dim()` 将 `kde.liks.one()` 应用于多维输入的一个维度。具体来说，`kde.liks.dim()`\
  \ 输入一个点 $x \\in \\mathbb{R}^m$![](img/c14_ILM0037.gif)，一组存储为 $k \\times m$ 矩阵 `dat`\
  \ 行的 $\\mathbb{R}^m$ 中的 $k$ 个点![](img/c14_ILM0038.gif)，一个长度为 $m$ 的带宽向量 `h = (h[1],\
  \ \\dots, h[m])` 以及一个索引 $i \\in \\{1, \\dots, m\\}$，并输出应用于输入数据第 $i$ 维的 `kde.liks.one()`\
  \ 的值（即 `kde.liks.dim(x, dat, h, i) = kde.liks.one(x[i], dat[,i], h[i])`![](img/c14_ILM0039.gif)）。\n\
  \n```javascript\nkde.liks.dim = function(x,dat,h,i) {\n\treturn(kde.liks.one(x[i],dat[,i],h[i]));\
  \ }\n```\n\n\n\n\n\n函数 `nb.kde.liks()` 输入一个点 $x \\in \\mathbb{R}^m$、一组存储在 $k \\\
  times m$ 矩阵 `dat` 行中的 $k$ 个 $\\mathbb{R}^m$ 中的点，以及一个长度为 $m$ 的带宽向量 $h = (h[1], \\\
  dots, h[m])$，并输出密度函数的朴叶贝斯估计：\n\n$$\\hat{P}(x) = \\hat{P}((x_1, \\dots, x_m)) = \\\
  prod_{j=1}^{m} \\hat{P}(x_j)$$\n\n通过对输入的每个维度应用 `kde.liks.dim()` 并相乘结果来实现。\n\n```r\n\
  nb.kde.liks = function(x,dat,h) {\n  marginal.liks = sapply(1:dim(dat)[2],kde.liks.dim,x=x,\n\
  \    dat=dat,h=h);\n  return(prod(marginal.liks))\n}\n```\n\n将密度估计应用于分类器，工作方法与第\
  \ 14.8 节中的 KDE 分类器完全相同，有一个例外：KDE 分类器使用长度为 $C$ 的带宽参数向量 $h = (h[1], \\dots, h[C])$，其中带宽\
  \ $h[c]$ 用于为类别 $c$ 数据形成密度估计；而基于一维 KDE 的朴叶贝斯分类器使用一个 $C \\times m$ 的带宽参数矩阵：\n\n$$h\
  \ = \\begin{bmatrix} h[1,1] & \\dots & h[1,m] \\\\ \\vdots & \\ddots & \\vdots \\\
  \\ h[C,1] & \\dots & h[C,m] \\end{bmatrix}$$\n\n其中带宽 $h[c,j]$ 用于为类别 $c$ 数据形成特征 $j$\
  \ 的密度估计（类似于第 14.9 节](#c14.xhtml#c14_9）中的直方图分类器）。\n\n应用朴叶贝斯分类器的函数与第 14.8 节中应用 KDE\
  \ 分类器的函数基本相同。函数 `nb.kde.predict.one()` 与 `kde.predict.one()` 相同，区别在于前者调用 `nb.kde.liks()`，而后者调用\
  \ `kde.liks()`，并且使用带宽向量 $(h[c,1], \\dots, h[c,m])$ 代替了标量 $h[c]$。\n\n```r\nnb.kde.predict.one\
  \ = function(x,datx,daty,h) {\n  t = table(daty); priors = t/sum(t);\n  liks = vector(\"\
  numeric\",nc);\n  for(cc in 1:nc) {\n    liks[cc] = nb.kde.liks(x,datx[daty==cc,],h[cc,])\n\
  \  }\n  return(max.col(priors*liks))\n}\n```\n\n第 14.8 节中的函数 `kde.loo.one()`、`kde.loo.all()`\
  \ 和 `kde.predict.many()` 只需通过将所有出现的字符串 \"kde\" 替换为 \"nb.kde\" 即可复用。\n\n```r\nnb.kde.loo.one\
  \ = function(datx,daty,h,o) {\n  pred = nb.kde.predict.one(datx[o,],datx[-o,],daty[-o],h);\n\
  \  return(pred!=daty[o])\n}\nnb.kde.loo.all = function(datx,daty,h) {\n  errs =\
  \ sapply(1:dim(datx)[1],nb.kde.loo.one,datx=datx,\n    daty=daty,h=h);\n  return(mean(errs))\n\
  }\nnb.kde.predict.many = function(x,datx,daty,h) {\n  return(apply(x,1,nb.kde.predict.one,datx=datx,\n\
  \    daty=daty,h=h))\n}\n```\n\n一旦选定了带宽矩阵，可以使用 `nb.kde.predict.many()` 如下方式计算朴叶贝斯分类器错误率的测试估计：\n\
  \n```r\npred.class = nb.kde.predict.many(dat[,1:2],dat[,1:2],dat[,3],matrix(0.7,3,2));\n\
  risk.test(pred.class)\n```\n\n## 14.11 $k$-最近邻 (第 4.5 节)\n\n使用 `class` 库中的函数 `knn()`\
  \ 训练 $k$-最近邻 (KNN) 分类器。\n\n```r\nlibrary(class)\n```\n\n给定训练特征向量 `dat[,1:2]` 及其类别标签\
  \ `dat[,3]`，并给定 $k$ 的值，例如\n\n\n\n```r\nk = 9;\n```\n\n通过函数 `knn` 为测试特征向量 `dat[,1:2]`\
  \ 预测类别标签：\n\n```r\npred.class = knn(dat[,1:2],dat[,1:2],dat[,3],k);\nrisk.test(pred.class)\n\
  ```\n\n选择 KNN 分类器意味着选择一个原型数量 $k$ 来优化某些风险的估计。函数 `knn.loo.one()` 输入一个 $n \\times m$\
  \ 的特征向量矩阵 `datx`、一个长度为 $n$ 的类别标签 `daty`、一个原型数量 $k$ 以及集合 $\\{1, \\dots, n\\}$ 中的索引\
  \ $o$。它使用除第 $o$ 个数据以外的所有数据通过 KNN 分类器预测第 $o$ 个数据的类别。然后将预测结果与真实类别 $daty[o]$ 进行比较。如果\
  \ KNN 分类器预测错误，返回 R 布尔值 `TRUE`（数值 1）；如果 KNN 分类器预测正确，返回 R 布尔值 `FALSE`（数值 0）。\n\n```r\n\
  knn.loo.one = function(datx,daty,k,o) {\n  pred = knn(datx[-o,],datx[o,],daty[-o],k);\n\
  \  return(pred!=daty[o])\n}\n```\n\n函数 `knn.loo.all()` 依次对每个数据应用 `knn.loo.one()`，并返回\
  \ KNN 分类器预测错误的平均次数：即 `knn.loo.all()` 为给定的原型数量 $k$ 以及给定的训练数据 `datx` 和 `daty` 计算 0–1\
  \ 损失下的留一交叉验证风险估计。\n\n```r\nknn.loo.all = function(datx,daty,k) {\n  errs = sapply(1:dim(datx)[1],knn.loo.one,datx=datx,\n\
  \    daty=daty,k=k);\n  return(mean(errs))\n}\n```\n\n选择原型数量是一个一维优化问题。图 14.4 的左侧单元显示了不同原型数量的留一交叉验证风险估计。该图表明原型数量应该较小（大约\
  \ $k$ = 9）。\n\n\n\n\n```\nks = 1:100; errs = vector(“numeric”,length(ks));\nerrs\
  \ = sapply(ks,knn.loo.all,datx=tdat[,1:2],daty=tdat[,3]);\nplot(ks,errs,xlab=“Number\
  \ of Nearest Neighbors”,\nylab=“Estimated Risk”,type=“l”,ylim=c(0,0.3*1.05));\n\
  ```\n\n![图 14.4 k-最近邻分类器（左）和学习向量量化分类器（右）风险的留一交叉验证估计，这些是关于最近邻居数量或每类原型数量变化的函数。](img/c14f004.jpg)\n\
  \n图 14.4 `k`-最近邻分类器（左）和学习向量量化分类器（右）风险的留一交叉验证估计，这些是关于最近邻居数量或每类原型数量变化的函数。\n\n## 14.12\
  \ 学习向量量化 (第 4.5.4 节)\n\n使用类库中的函数 `lvqinit()` 和 `olvq1()` 训练学习向量量化 (LVQ) 分类器。\n\n\
  ```\nlibrary(class);\n```\n\n给定特征向量 `tdat[,1:2]` 及其相关的类别标签 `tdat[,3]`，以及一个原型总数 `k`\
  \ 的值，假设\n\n```\nk = 6;\n```\n\n通过函数调用初始化 LVQ 分类器：\n\n```\ncd1 = lvqinit(tdat[,1:2],tdat[,3],size=k);\n\
  ```\n\n该函数选择一个不放回的训练点均匀随机样本，作为每个类的初始原型集。第 $c$ 类原型的数量为 $k \\times n_c$，四舍五入到最近的整数![](img/c14_ILM0043.gif)。由于训练数据包含三个类，别的\
  \ 49、48 和 53 个点，设置 `k` = 6 导致每类有两个原型。从初始状态 `cd1` 开始，通过函数调用训练 LVQ 分类器：\n\n```\ncd2\
  \ = olvq1(tdat[,1:2],tdat[,3],cd1,niter=3000*k);\n```\n\n使用函数 `lvqtest()` 将其应用于测试数据\
  \ `edat`：\n\n```\npred.class = lvqtest(cd2,edat[,1:2]);\nrisk.test(pred.class);\n\
  ```\n\n训练好的 LVQ 分类器由每个类的一个原型列表组成。对于 `i` = 1, …, `k`，第 $i$ 个原型的特征向量和类别标签由对 $cd2\\\
  $x[i, \\]$ 给出![](img/c14_M0031.gif)\n\n训练 LVQ 分类器意味着 `olvq1()` 输入一个 $n \\times m$\
  \ 的特征矩阵 `datx`、一个长度为 $n$ 的类别向量 `daty`、原型数量 `k` 以及一个索引 `o`![](img/c14_ILM0043.gif)。如果\
  \ LVQ 分类器做出错误预测，则返回 `TRUE`（数值 1），如果预测正确，则返回 `FALSE`（数值 0）。\n\n```\nolvq1 = function(datx,daty,k,o)\
  \ {\n\tcd1 = lvqinit(datx,daty,size=k);\n\tcd2 = olvq1(datx,daty,cd1,niter=3000*k);\n\
  \tpred = lvqtest(cd2,datx[o]);\n\treturn(pred!=daty[o]);\n}\n```\n\n`lvq.all()`\
  \ 对每个留出的数据点应用函数 `lvq.one()`，并返回 LVQ 分类器做出错误预测的平均次数。\n\n```\nlvq.all = function(datx,daty,k)\
  \ {\n\terrs = sapply(1:dim(datx)[1],lvq.one,datx=datx,daty=daty,k=k);\n\treturn(mean(errs));\n\
  }\n```\n\n选择原型数量是一个一维优化。图 14.4 的右侧单元显示了不同原型数量的留一风险估计。该图表明原型数量应该是较小（大约 `k` = 6）。\n\
  \n```\nks = 3:20; errs = vector(“numeric”,length(ks));\nfor(i in 1:length(ks)) {\n\
  \terrs[i] = lvq.all(tdat[,1:2],tdat[,3],ks[i]);\n}\nplot(ks,errs,xlab=“Number of\
  \ Prototypes”,\nylab=“Estimated Risk”,type=“l”,ylim=c(0,0.3*1.05));\n```\n\n## 14.13\
  \ 逻辑回归 (第 4.6 节)\n\n对于多分类 (*C* > 2) ，使用 nnet 库中的函数 `multinom()` 训练逻辑回归分类器。\n\n通过函数调用训练逻辑回归模型：\n\
  \n```\nm = multinom(as.factor(tdat[,3])˜.,maxit=10000,data=tdatDF,MaxNWts=3000);\n\
  ```\n\n使用函数 `predict()` 将其应用于测试数据：\n\n```\npred.class = predict(m,edatDF,type=“class”);\n\
  ```\n\n\n\n逻辑回归模型假设，每个类别 `c` 相对于特定参考类别（也可以是类别 1）的对数几率（log-odds）是特征向量的线性函数，\n\n```\n\
  \\left[\\begin{matrix}\n\\log\\frac{P(Y=1|X)}{P(Y=1|X)} & \\log\\frac{P(Y=2|X)}{P(Y=1|X)}\
  \ & \\log\\frac{P(Y=3|X)}{P(Y=1|X)} & \\dots \\\\\n\\log\\frac{P(Y=C|X)}{P(Y=1|X)}\n\
  \\end{matrix}\\right] = \\left[\\begin{matrix}\n0 & 0 & \\dots & 0 \\\\\n\\theta_{2,0}\
  \ & \\theta_{2,1} & \\dots & \\theta_{2,m} \\\\\n\\theta_{3,0} & \\theta_{3,1} &\
  \ \\dots & \\theta_{3,m} \\\\\n\\dots & \\dots & \\dots & \\dots \\\\\n\\theta_{C,0}\
  \ & \\theta_{C,1} & \\dots & \\theta_{C,m}\n\\end{matrix}\\right] \\begin{bmatrix}\
  \ 1 \\\\ X_1 \\\\ \\vdots \\\\ X_m \\end{bmatrix}\n```\n\n拟合逻辑回归模型意味着找到一个 $C \\\
  times (m + 1)$ 的实参数矩阵 $\\theta$（其中 $m+1$ 个参数被限制为零），使其使得训练数据的似然函数近似最大化。上述格式的拟合参数矩阵可以从拟合模型\
  \ `m` 获取：\n\n```\ntheta = rbind(rep(0, m+1), summary(m)$coefficients)\n```\n\n更明确地，对于\
  \ $i = 2, \\dots, C$ 和 $j = 0, \\dots, m$，\n\n```\n\\theta_{i,j} = summary(m)$coefficients[i-1,\
  \ j+1].\n```\n\n在多个竞争的逻辑回归模型（例如，包含不同特征或特征组合的模型）之间进行选择，可以通过编写交叉验证风险估计的函数来实现，但由于参数估计是通过最大化训练数据的似然来完成的，也可以通过选择赤池信息准则（AIC）最小的模型来完成选择。AIC\
  \ 是通过 `stats` 库中的 `AIC()` 函数计算的：\n\n```\nlibrary(stats);\nAIC(m);\n```\n\n## 14.14\
  \ 神经网络\n\n单隐藏层神经网络分类器使用 `nnet` 库中的 `nnet()` 函数进行训练。\n\n```\nlibrary(nnet);\n```\n\
  \n假设隐藏层中有 `k` 个神经元，例如\n\n```\nk = 2;\n```\n\n通过函数调用训练神经网络分类器：\n\n```\nm = nnet(as.factor(tdat[,3])~.,size=k,maxit=10000,data=\n\
  tdatDF,MaxNWts=3000);\n```\n\n使用 `predict()` 函数将其应用于测试数据 `edatDF`：\n\n```\npred.class\
  \ = predict(m,edatDF,type=\"class\");\nrisk.test(pred.class);\n```\n\n此此等价的方法是使用\
  \ R 矩阵和向量输入代替上述的 R 数据框和公式：\n\n```\nm = nnet(tdat[,1:2],class.ind(tdat[,3]),size=k,maxit=10000,\n\
  MaxNWts=3000);\npred.class = max.col(predict(m,edat));\nrisk.test(pred.class);\n\
  ```\n\n\n\n\n隐藏层神经元的数量 `k` 的选择是为了最小化留一交叉验证（leave-one-out cross-validated）风险估计。`nnet.onestart()`\
  \ 和 `nnet.multistart()` 函数在给定数据集上训练多个神经网络，并返回数据似然概率最大的网络（等同于最小化交叉熵损失的训练风险）。这样做是为了为\
  \ `nnet()` 中训练网络的梯度下降优化增加一些鲁棒性，因为该优化可能会陷入局部最优解。\n\n```\nnnet.onestart = function(i,datx,daty,k)\
  \ {\n  m = nnet(datx,class.ind(daty),size=k,maxit=10000,\n  MaxNWts=3000,trace=FALSE);\n\
  \  return(m);\n}\n\nnnet.multistart = function(datx,daty,k,nstart) {\n  ms = lapply(1:nstart,nnet.onestart,datx=datx,daty=daty,\n\
  \  k=k);\n  best.idx = which.min(unlist(lapply(ms,getElement,“value”)));\n  return(ms[[best.idx]]);\n\
  }\n```\n\n函数 `nnet.loo.one()` 的输入是一个 `n` × `m` 的特征向量矩阵 `datx`、长度为 `n` 的类别标签向量 `daty`、隐藏层神经元的数量\
  \ `k` 以及集合 {1, …, `n`} 中的一个索引 `o`。它使用具有 `k` 个隐藏层节点的神经网络以及除 `o` 个数据以外的所有数据，来预测第 `o`\
  \ 个数据的类别。然后它将预测结果与真实类别 `daty[o]` 进行比较。如果神经网络预测错误，则返回 R 布尔值 `TRUE`（数值为 1）；如果神经网络预测正确，则返回\
  \ R 布尔值 `FALSE`（数值为 0）。\n\n```\nnnet.loo.one = function(datx,daty,k,o) {\n  m =\
  \ nnet.multistart(datx[-o,],daty[-o],k,20);\n  pred = max.col(t(predict(m,datx[o,])));\n\
  \  return(pred!=daty[o]);\n}\n```\n\n函数 `nnet.loo.all()` 依次留出每个数据并应用 `nnet.loo.one()`\
  \ 函数，然后返回神经网络预测错误的平均次数：即 `nnet.loo.all()` 计算了具有 `k` 个隐藏层神经元以及给定训练数据 `datx` 和 `daty`\
  \ 的神经网络在 0–1 损失函数下的留一交叉验证风险估计。\n\n```\nnnet.loo.all = function(datx,daty,k) {\n\
  \  if(require(parallel)) {\n    errs = unlist(mclapply(1:dim(datx)[1],nnet.loo.one,\n\
  \    datx=datx,daty=daty,k=k,mc.cores=256);\n  } else {\n    errs = sapply(1:dim(datx)[1],nnet.loo.one,datx=datx,\n\
  \    daty=daty,k=k);\n  }\n  return(mean(errs));\n}\n```\n\n图 14.5 显示的图表表明，在二到五之间的任何数量的隐藏神经元可能一样好。\n\
  \n```\nks = 1:16; errs = sapply(ks,nnet.loo.all,datx=tdat[,1:2],\ndaty=tdat[,3]);\n\
  plot(ks,errs,xlab=“Number of Hidden Neurons”,\nylab=“Estimated Risk”,type=“l”,ylim=c(0,max(errs)*1.05));\n\
  ```\n\n![图 14.5 具有不同数量隐藏层神经元的单隐藏层神经网络分类器的留一交叉验证风险估计。](img/c14f005.jpg)\n\n**图 14.5**\
  \ 具有不同数量隐藏层神经元的单隐藏层神经网络分类器的留一交叉验证风险估计。\n\n由于示例问题中有 150 条训练数据，且我们使用了留一交叉验证，同时每个神经网络都从\
  \ 20 个随机起始点（`θ*` 值）开始训练，并考虑了 16 种不同的隐藏神经元数量（`k` 从 1 到 16），因此上述描述的过程需要训练 150 × 20\
  \ × 16 = 48,000 个小型神经网络。由于这些网络没有任何一个依赖于其他网络，如果可用计算环境支持，它们可以并行训练。如果可用 `parallel`\
  \ 库，`nnet.loo.all()` 函数将使用 `mclapply()` 函数并行执行对留出训练数据的循环；否则，将使用 `sapply()` 函数串行执行循环。\n\
  \n\n\n\n如第 4.7 节所示，单隐藏层神经网络的参数可以写为两个矩阵：一个 $N \\times (m + 1)$ 的矩阵 $\\theta^{(1)}$，它控制隐藏层神经元对特征向量的响应；以及一个\
  \ $C \\times (N + 1)$ 的矩阵 $\\theta^{(2)}$，它控制输出函数如何对隐藏层神经元的输出向量做出响应。参数的估计值 $\\theta^{(1)}$\
  \ 和 $\\theta^{(2)}$ 记录在一个长度为 $(N(m + 1) + C(N + 1))$ 的数组 `mwts` 中，如下所示。\n\n矩阵 $\\\
  theta^{(1)}$：\n```\n\\theta^{(1)} = \\begin{bmatrix}\n\\theta_{1,0}^{(1)} & \\dots\
  \ & \\theta_{1,m}^{(1)} \\\\\n\\theta_{2,0}^{(1)} & \\dots & \\theta_{2,m}^{(1)}\
  \ \\\\\n\\vdots & \\vdots & \\vdots \\\\\n\\theta_{N,0}^{(1)} & \\dots & \\theta_{N,m}^{(1)}\n\
  \\end{bmatrix} = \\begin{bmatrix}\nmwts[1] & \\dots & mwts[m+1] \\\\\nmwts[m+2]\
  \ & \\dots & mwts[2m+1] \\\\\n\\vdots & \\vdots & \\vdots\n\\end{bmatrix}\n```\n\
  (images/c14_M0035.gif)\n\n通过以下方式获得：\n```\n\\theta_{i,j}^{(1)} = mwts[(i-1)(m+1)\
  \ + j + 1] for i=1, \\dots, N and j=0, \\dots, m\n```\n(images/c14_M0036.gif)\n\n\
  \n\n并且，引入简写 `s = N(m + 1)`，矩阵\n\n$$\n\\theta^{(2)} = \\begin{bmatrix}\n\\theta^{1,0}\
  \ & \\theta^{1,1} & \\dots & \\theta^{1,N} \\\\\n\\theta^{2,0} & \\theta^{2,1} &\
  \ \\dots & \\theta^{2,N} \\\\\n\\vdots & \\vdots & \\ddots & \\vdots \\\\\n\\theta^{C,0}\
  \ & \\theta^{C,1} & \\dots & \\theta^{C,N}\n\\end{bmatrix}\n$$\n\n(14.1) ![numbered\
  \ Display Equation](img/c14_M0037.gif) 得到为：\n\n$$\n\\theta^{(i,j)} = s + (i-1)(N+1)\
  \ + j + 1 \\quad \\text{for } i=1, \\dots, C \\text{ and } j=0, \\dots, N.\n$$\n\
  \n![numbered Display Equation](img/c14_M0038.gif)\n\n## 14.1 分类树\n\n使用 `rpart` 库中的\
  \ `rpart()` 函数训练分类树。\n\n```r\nlibrary(rpart)\n```\n\n通过以下调用来训练树：\n\n```r\nm = rpart(as.factor(yt),\
  \ method=\"class\", cp=0.006, minbucket=1)\n```\n\n使用 `predict()` 函数将其应用于测试数据：\n\
  \n```r\npred.class = predict(m, ed, type=\"class\")\nrisk(pred.class)\n```\n\n如第\
  \ 4.8 节所述，`rpart()` 函数通过生长和剪剪树来优化代价复杂度准则：\n\n$$\n\\alpha \\sum_{\\text{all leaf\
  \ nodes } t} \\min_{c \\in \\{1, \\dots, C\\}} \\sum_{d=1}^C L(d,c) P(Y=d|X \\in\
  \ t) P(X \\in t)\n$$\n\n![numbered Display Equation](img/c14_M0039.gif)\n\n\n\n\
  这取决于一个必须选择的调节参数 `α`。在函数 `rpart()` 中，用户并不直接指定 `α`，而是指定一个与 `α` 相关的参数 `cp`：\n\n$$\n\
  cp = \\frac{\\alpha}{R_0},\n$$\n\n![numbered Display Equation](img/c14_M0040.gif)\n\
  \n其中 $R_0$ 是由单个叶节点组成的树的训练风险估计值。$R_0$ 的值仅取决于损失函数和类别的先验分布 $(P(Y=1), ..., P(Y=C))$，并且可以从\
  \ `rpart()` 的输出中提取：\n\n$$\nR_0 = (m\\$frame\\$dev/m\\$frame)^{-1}.\n$$\n\n![numbered\
  \ Display Equation](img/c14_M0041.gif)\n\n单叶节点树的估计风险 $R_0$ 可以将复杂度参数设置为无穷大并将生成的树应用于训练数据来计算：\n\
  \n```\nm = rpart(as.factor(tdat[,3])~.,method=\"class\",data=atatDF,\ncp=Inf);\n\
  pred.class = predict(m,tdatDF,type=\"class\");\n```\n\n在 `m = rpart(as.factor(tdat[,3])~.,method=\"\
  class\",data=tdatDF,cp=Inf); pred.class = predict(m,tdatDF,type=\"class\")` 中，`m`\
  \ 是生成的树，`tdat` 是训练数据，而 `cp` 是复杂度参数。`predict` 函数用于对数据进行分类。\n\n\n\n\n图 14.6 分类树风险随复杂度参数\
  \ `cp` 变化的留一法交叉验证估计（左），以及线性支持向量机风险随惩罚参数 $\\gamma$ 变化的估计（右）。两个横轴均按对数刻度绘制。左侧单元格中的曲线被绘制成阶梯函数的形式，以强调尽管复杂度参数\
  \ `cp` 是实值，但从给定数据集中产生的分类树数量是有限的。左侧单元格中曲线每个线段上方的数字对应于给定 `cp` 值范围的树的叶子节点数量。\n\n如第\
  \ 4.8 节所示，在这种情况下，选择使留一法风险估计最小化的分类树会导致选择一个次优的树（它选择了一个具有 15 个叶子节点的树，而在相同数据上训练的 5 个叶子节点的树的风险要低得多）。\n\
  \n## 分类树的表示\n\n分类树可以用多种数据结构来表示。本节描述了 R 库 `rpart` 使用的表示方法：R 库 `randomForest` 使用的表示方法见第\
  \ 14.20 节。`rpart()` 函数返回一个类为 `rpart` 的 R 对象，其中包含了训练后的树以及关于如何构建的信息。可以从对象 `m` 的两个组件恢复训练后的树：`m$frame`\
  \ 和 `m$splits`。组件 `m$frame` 是一个 R 数据框，树中的每个节点对应有一行。如果树的第 `j` 个节点满足 `m$frame$var[j]\
  \ <=<leaf>`，则该节点为叶子节点，否则它是内部节点，此时 `m$frame$var[j]` 是用于划分的特征名称。组件 `m$splits` 是一个\
  \ R 矩阵，其行数不确定：这里感兴趣的行是对应于内部节点的行，它们通过如下定义的变量 `internal` 进行索引（Therneau et al., 2017,\
  \ `labels.rpart.R` 的源代码）。\n\n```\nnotleaf = (m$frame$var!=“<leaf>“);\nidx = cumsum(c(1,m$frame$ncomp+m$frame$nsurrogate+notleaf));\n\
  internal = idx[c(notleaf,FALSE)];\n```\n\n假设 `m$frame` 的第 `j` 行恰好是树的第 `i` 个内部节点（从\
  \ `m$frame` 顶部开始计数）。假设 R 对 `m` 个特征的命名（存储在 `m$frame$var` 中）简单地为整数 1, …, `m`，则\n\n\
  $$\nb = bad hbox\nτ = bad hbox\nk = s.\n$$\n\n![numbered Display Equation](img/c14_M0042.gif)\n\
  \n如果 `X[k]`、`τ` 和 `s` 满足以下条件，则到达该内部节点的特征向量 `X` 被发送到该节点的“左”孩子——即对应于 `row.names(m$frame)`\
  \ 中索引值 `2*b` 的唯一节点：\n\n$$\n(s = 1 and X_k < τ) or (s = 1 and X_k ≥ τ)\n$$\n\n![numbered\
  \ Display Equation](img/c14_M0043.gif)\n\n\n\n\n否则，特征向量 `X` 将被发送到节点的“右”子节点——即对应\
  \ `row.names(m$frame)` 中索引值 `2*b* + 1` 的唯一节点。\n\n相反，如果 `m$frame` 的第 `j` 行对应于一个叶子节点，则任何到达该节点的特征向量\
  \ `X` 都被预测属于类别 `m$frame$yval[*j]`。因此，例如图 4.22 中所示^(12) 的树表示为：\n\n```math\n$var \
  \  $yval\n$m$frame = [1, 2, 4, 8, 9, 5, 3, 6, 7] \\cdot [1 \\cdot \\cdot \\cdot\
  \ 3 \\cdot \\dots, 2 \\cdot \\cdot \\cdot 2 \\cdot \\dots, 1 \\cdot \\cdot \\cdot\
  \ 1 \\cdot \\dots, <leaf> \\cdot \\cdot \\cdot 1 \\cdot \\dots, <leaf> \\cdot \\\
  cdot \\cdot 2 \\cdot \\dots, <leaf> \\cdot \\cdot \\cdot 2 \\cdot \\dots, 2 \\cdot\
  \ \\cdot \\cdot 3 \\cdot \\dots, <leaf> \\cdot \\cdot \\cdot 1 \\cdot \\dots, <leaf>\
  \ \\cdot \\cdot \\cdot 3 \\cdot \\dots]\n```\n\n![numbered Display Equation](img/c14_M0044.gif)\n\
  \n以及 \n\n```math\n$m$splits[internal,] = [1 - 0.310529, 1 - 0.197331, 1 - 0.800977,\
  \ 1 - 0.766253]\n```\n\n![numbered Display Equation](img/c14_M0045.gif)\n\n在这里，`m$frame`\
  \ 的行名被写在矩阵的左侧，而 `m$frame` 中除第一列和第五列以外的值，以及 `m$splits` 中除第二列和第四列以外的值已被省略。\n\n## 14.16\
  \ 支持向量机 (Section 4.9)\n\n使用 `e1071` 库中的 `svm()` 函数来训练支持向量机。\n\n```r\nlibrary(e1071);\n\
  ```\n\n通过调用函数来训练线性支持向量机：\n\n```r\nm = svm(as.factor(tdat[,3]),data=tdatDF,kernel=\"\
  linear\", cost=2.112);\n```\n\n并使用 `predict()` 函数将其应用于测试数据：\n\n```r\npred.class\
  \ = predict(m,edatDF);\nrisk.test(pred.class);\n```\n\n惩罚参数 γ（由 `svm()` 函数中的参数 `cost`\
  \ 表示）的选择是为了最小化留一交叉验证的风险估计。`svm()` 函数提供了通过调用带有 `cross=k` 选项![](img/c14_ILM0054.gif)\
  \ 调用来执行 `k`-折交叉验证的能力，在这种情况下，可以从函数的输出中获得交叉验证的风险估计：\n\n```math\n$R^{cv} = 1 - \\frac{m$tot.accuracy}{100}.\n\
  ```\n\n![numbered Display Equation](img/c14_M0046.gif)\n\n因此，留一交叉验证可以通过以下方式执行\n\n\
  \n\n\n```r\nsvmlin.loo.all = function(datx,daty,gamma) {\n  m = svm(as.factor(daty)˜.,data=datx,kernel=“linear”,\n\
  \  cost=gamma,cross=dim(datx)[1]);\n  return(1-m$tot.accuracy/100);\n}\n\ngammas\
  \ = 2∧seq(-12,12);\nerrs = sapply(gammas,svmlin.loo.all,datx=tdatDF,\n  daty=tdat[,3]);\n\
  plot(log2(gammas),errs,xlab=expression(paste(“Penalty\nParameter “,log[2],“(“, gamma,”)“)),ylab=”Estimated\
  \ Risk“,\n  type=“l”,ylim=c(0,max(errs)*1.05));\n```\n\n给定 `γ` 的值，函数 `svmlin.loo.all()`\
  \ 返回惩罚参数为 `γ` 的线性支持向量机的留一交叉验证风险估计。留一风险估计是针对许多 `γ` 值计算的，通过观察数字或绘制图形找到近似最小该值的 `γ`\
  \ 值，如图 14.6 右侧单元格所示。\n\n使用常用内核之一拟合支持向量机，除了惩罚参数 `γ` 之外，还会引入一个、两个或三个需要优化的额外参数：<displayedItem\
