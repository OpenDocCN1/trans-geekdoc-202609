  \n```math\nR(c | X \\in t) = \\frac{n_{c't}}{n_{c't}} P(Y=c') + \\sum_{d \\neq c'}\
  \ L(d, c) \\frac{n_{dt}}{n_t} P(Y=d) > 0\n```\n因此，无论损失函数的取值如何，无论类别的先验分布如何，叶子节点 `t`\
  \ 都会预测类别 `c′`。\n\n\n\n\n\n### 练习 7.1\n\n对于任意 `d`，$0 \\le d < n - 1$，近似函数 $f^d$ 通过求解以下优化问题得到：\n\
  \n```\nminimize (\\theta_0, \\theta_1, \\dots, \\theta_d) \\in \\mathbb{R}^{d+1}\
  \ \\sum_{i=1}^{n} (y_i - \\sum_{j=1}^{d} \\theta_j x_{ij})²\n```\n\n而近似函数 $f^{d+1}$\
  \ 通过求解以下优化问题得到：\n\n```\nminimize (\\theta_0, \\theta_1, \\dots, \\theta_d, \\theta_{d+1})\
  \ \\in \\mathbb{R}^{d+2} \\sum_{i=1}^{n} (y_i - \\sum_{j=1}^{d+1} \\theta_j x_{ij})²\n\
  ```\n\n由于上述问题中考虑的任何向量 $(\\theta_0, \\theta_1, \\dots, \\theta_d)$ 都对应于下述问题中考虑的向量\
  \ $(\\theta_0, \\theta_1, \\dots, \\theta_d, 0)$，因此下问题的解至少不优于上问题的解，即 $\\mathbb{R}(f^{d+1})\
  \ \\ge \\mathbb{R}(f^d)$。\n\n如果 $\\mathbb{R}(f^{d+1}) = \\mathbb{R}(f^d)$，那么在下问题的解中\
