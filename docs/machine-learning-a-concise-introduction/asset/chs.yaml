  \ |\n\n# B 练习题解答\n\n## 练习 2.2\n\n1. *根据贝叶斯定理，*\n$$\nP(Y=1|X=x) = \\frac{\\int P(X=x|Y=1)P(Y=1)d}{\\\
  int P(X=x|Y=1)P(Y=1)d + \\int P(X=x|Y=2)P(Y=2)d} = \\frac{e^{-\\frac{1}{2}(x-\\\
  mu_1)^T\\Sigma_1^{-1}(x-\\mu_1)}}{p}\n$$\n*因此，利用 $P(Y=1) + P(Y=2) = 1$ 这一事实，*\n\
  $$\nP(Y=1|X=x) = \\frac{e^{-\\frac{1}{2}(x-\\mu_1)^T\\Sigma_1^{-1}(x-\\mu_1)}}{e^{-\\\
  frac{1}{2}(x-\\mu_1)^T\\Sigma_1^{-1}(x-\\mu_1)} + e^{-\\frac{1}{2}(x-\\mu_2)^T\\\
  Sigma_2^{-1}(x-\\mu_2)}(1-p)}\n$$\n*其中*\n\n\n\n\n\n```xml\n<math display=\"block\"\
