  <msup><mrow><mo|</mo><mn>2</mn><mi>&#x03bc;</mi><msub><mi>y</mi><mi>i</mn></msub></msub><mo|</mo><mrow><mo>-</mo><mfrac><mn>1</mn><mn>2</mfrac></mrow></msup>\n\
  <msup><mi>e</mi><mrow><mo>-</mo><mfrac><mn>1</mn><mn>2</mfrac></msup><mrow><mo(\\\
  mo><msub><mi>x</mi><mi>i</mn></msub><mo>-</mo><msub><mi>&#x03bc;</mi><msub><mi>y</mi><mi>i</mn></msub></msub><mo)</mo></mrow></mrow><msup><mrow/><mi\
  \ mathvariant=\"normal\">T</mi></msup><msubsup><mi>&#x03a3;</mi><msub><mi>y</mi><mi>i</mn></msub></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msubsup><mrow><mo(\\\
  mo><msub><mi>x</mi><mi>i</mn></msub><mo>-</mo><msub><mi>&#x03bc;</mi><msub><mi>y</mi><mi>i</mn></msub></msub><mo)</mo></mrow></mrow></msup>\n\
  <mo>,</mo>\n</mrow>\n</math>\n</displayedItem> ![带有编号的显示公式](img/bapp02_M0023.gif)\n\
  \n所以对数似然为\n\n\n\n\n\n![numbered Display Equation](img/bapp02_M0024.gif)\n\n最大化对数似然需要找到参数\
  \ `μ[c]` 和 `Σ[c]`，使得和中的第 `c^(th)` 项对于 `c` = 1, …, `C` 最大化。为了找到 `μ[c]`，注意到第 `c^(th)`\
  \ 加项可以写为\n\n![numbered Display Equation](img/bapp02_M0025.gif)\n\n因此，第 `c^(th)`\
  \ 加项对 `μ[c]` 的导数为\n\n![numbered Display Equation](img/bapp02_M0026.gif)\n\n将该导数设为\
  \ 零并求解 `μ[c]`，可得到唯一解\n\n![numbered Display Equation](img/bapp02_M0027.gif)\n\n\n\
  \n```math\n-\\frac{n_c}{2} + \\sum_{c-1} + \\frac{1}{2} \\sum_{i=1}^{n} [y_i=c]\
  \ \\sum_{c-1} (x_i - \\mu_c)(x_i - \\mu_c)^T = 0 \\cdot\n```\n![编号显示方程](img/bapp02_M0028.gif)\n\
  \n将此式设为零并解出 `Σ[c]` 可得到唯一解：\n\n```math\n\\hat{\\Sigma}_c = \\frac{1}{n_c} \\sum_{i=1}^{n}\
  \ [y_i=c] (x_i - \\mu_c)(x_i - \\mu_c)^T ,\n```\n![![编号显示方程](img/bapp02_M0029.gif)\n\
  \n在上述解中使用值 $\\mu_c = \\hat{\\mu}_c$，会导致对数似然对 `μ[c]` 和 `Σ[c]` 的导数同时为零。\n\n**练习题 4.7**\
  \ 当且仅当预测类别 1 的风险看起来比预测类别 2 低时，LDA 分类器预测为类别 1。这里用以下估计值替换 `c` = 1, 2 中的：\n\n```math\n\
  P^c(x|Y=c) = \\phi_c |\\Sigma_c|^{-1/2} \\exp\\left[-\\frac{1}{2}(x-\\mu_c)^T\\\
  Sigma_c^{-1}(x-\\mu_c)^T\\right]\n```\n![编号显示方程](img/bapp02_M0030.gif)\n\n贝叶斯分类器中真实但未知的条件似然\
  \ P(x|Y=c)。因此，LDA 分类器预测为类别 1 当且仅当\n\n\n\n\n$$L(2,1)P(Y=2)|2\\pi = \\sum^{\\Sigma}|\\\
  Sigma|^{-1/2}\\exp\\left(-\\frac{1}{2}(x-\\mu_2)^T\\Sigma^{-1}(x-\\mu_2)-\\frac{1}{2}T\\\
  right\\right) \\le L(1,2)P(Y=1)|2\\pi$$\n![images/bapp02_M031.gif]\n\n且该不等式成立当且仅当：\n\
  \n$$-\\frac{1}{2}(x-\\mu_2)^T\\Sigma^{-1}(x-\\mu_2) + \\frac{1}{2}(x-\\mu_1)^T\\\
  Sigma^{-1}(x-\\mu_1) \\ge \\log\\left(\\frac{P(Y=1)P(Y=2)}{P(Y=1)}\\right)$$\n![images/bapp02_M032.gif]\n\
  \n且其成立当且仅当：\n\n$$-\\frac{1}{2}(x-\\mu_2)^T\\Sigma^{-1}(x-\\mu_2) + \\frac{1}{2}(x-\\\
  mu_1)^T\\Sigma^{-1}(x-\\mu_1) \\ge \\log\\left(\\frac{L(1,2)P(Y=2)}{P(Y=1)}\\right).$$\n\
  ![images/bapp02_M033.gif]\n\n因此，LDA 分类器预测类别为 1 当且仅当 `x` · `v` ⩽ `α` 时，其中\n\n\n\n\
  \n\n$$\nv = \\sum_{i=1}^{n} (\\mu_2^i - \\mu_1^i)\n$$\n\n以及\n\n$$\n\\alpha = \\\
  frac{1}{2}\\mu_2^T\\Sigma^{-1}(\\mu_2 - \\mu_1) + \\frac{1}{2}\\mu_1^T\\Sigma^{-1}(\\\
  mu_2 - \\mu_1) + \\log\\left(\\frac{L(1,2)}{L(2,1)} \\frac{P(Y=1)}{P(Y=2)}\\right).\n\
  $$\n\n也就是说，LDA 分类器当且仅当 $x$ 位于超平面的一侧时，预测类别为 1\n\n$$\n\\{z \\in \\mathbb{R}^m : z\
  \ \\cdot v = \\alpha\\}.\n$$\n\n当 $P(Y=1) = \\frac{1}{2}$ 且 $L(1,2) = L(2,1)$ 时，对数项为零，且\n\
  \n$$\n\\alpha = \\frac{1}{2}\\mu_2^T\\Sigma^{-1}(\\mu_2 - \\mu_1).\n$$\n\n在练习 2.2\
  \ 的设定中，$\\Sigma = 1$ 且 $m = 1$（这意味着内积是标量），因此 LDA 分类器当且仅当此时预测类别为 1\n\n$$\nx(\\mu_2\
  \ - \\mu_1) \\ge \\frac{1}{2}(\\mu_2 - \\mu_1)² + \\log\\left(\\frac{L(1,2)}{L(2,1)}\
  \ \\frac{P(Y=1)}{P(Y=2)}\\right).\n$$\n\n如果 $\\mu_2 - \\mu_1 > 0$，上述条件等价于\n\n\n\n\
  \n\n```math\nx \\le \\frac{1}{2} \\left( \\mu_2² + \\mu_1² \\right) + \\frac{1}{2}\
  \ \\left( \\mu_2² - \\mu_1² \\right) \\log \\left( \\frac{L(1,2)}{L(2,1)}, \\frac{P(Y=1)}{P(Y=2)}\
  \ \\right)\n``` ![numbered Display Equation](img/bapp02_M0039.gif)\n\n这是练习 2.2 中\
  \ D 部分的解，其中 $\\mu_1$ 和 $\\mu²$ 分别替换了 [1] 和 [2]。\n\n### 练习 4.17\n\n设[图 4.31] 中的橙色数据为类别\
  \ 1，紫色数据为类别 2。在具有 0–1 损失函数和均匀类别概率 $P(Y=1) = P(Y=2) = 1/2$ 的二分类情况下，判别分析预测为类别 1 当且仅当\n\
  \n```math\n|2\\theta_1\\Sigma_1^{-1}(x-\\mu_1)| \\ge |2\\theta_2\\Sigma_2^{-1}(x-\\\
  mu_2)|\n``` ![numbered Display Equation](img/bapp02_M0040.gif)\n\n或者等价于（两边取对数并移项），当且仅当\n\
  \n```math\n(x-\\mu_2)^T\\Sigma_2^{-1}(x-\\mu_2) - (x-\\mu_1)^T\\Sigma_1^{-1}(x-\\\
  mu_1) \\ge \\log|\\Sigma_2| - \\log|\\Sigma_1|\n``` ![numbered Display Equation](img/bapp02_M0041.gif)\n\
  \n如果我们加上限制条件 $\\mu_{[1]} = \\mu_{[2]}$ 且 $\\Sigma_{[1]} = \\alpha\\Sigma_{[2]}$（对于某个\
  \ $\\alpha > 1$），这些条件在[图 4.31]所示的数据中似乎近似成立，那么二次判别分析预测为类别 1 当且仅当\n\n```math\n(\\\
