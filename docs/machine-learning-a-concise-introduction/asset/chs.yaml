  \ + e^{T_2} + e^{T_3}} (\\text{橙色表面})\nP(Y=2|X) = \\frac{e^{T_2}}{e^{T_1} + e^{T_2}\
  \ + e^{T_3}} (\\text{蓝色表面})\nP(Y=3|X) = \\frac{e^{T_3}}{e^{T_1} + e^{T_2} + e^{T_3}}\
  \ (\\text{紫色表面}).\n$$\n(4.14)\n\n### 4.7.4 逻辑回归与神经网络\n\n考虑一个没有隐藏层的神经网络，如图 4.21 所示。类别概率的输出向量为：\n\
  \n$$\nP(c=1) = \\frac{\\exp(T_c)}{\\sum_{d=1}^C \\exp(T_d)}\n$$\n\n在不失一般性的情况下，可以假设通过缩放使得\
  \ $\\exp(T_1(X, \\theta^{(1)})), \\dots, \\exp(T_C(X, \\theta^{(1)}))$ 中的任意一个具有任何给定的正值（该缩放因子取决于\
  \ `X` 和 $\\theta^{(1)}$，在归一化过程中会被抵消）。特别是，可以假设 $\\exp(T_1(X, \\theta^{(1)})$ 等于 1，这等同于假设其参数向量\
  \ $\\theta^{(1)}$ 恒等于 0。这正是逻辑回归。\n\n这段备注提供了神经网络的另一种解释。具有单个隐藏层的神经网络是在不相交多面体的“软性”指示函数基上执行的逻辑回归，其中这些多面体是在神经网络训练时通过自适应选择的。具有多个隐藏层的神经网络是在更复杂的基上执行的逻辑回归。\n\
  \n## 4.8 分类树\n\n分类树是一种为数据分配类别标签的决策树算法。所有数据进入树的根节点，每个内部（非叶子）节点都会根据特征向量对数据进行某种划分。每个叶子节点（终端节点）为进入它的所有数据分配一个特定的类别标签。图\
  \ 4.22 显示了一个小型分类树。\n\n### 4.8.1 通过叶子节点（终端节点）对数据分类\n\n给定一棵树，令 `t` 表示树的一个叶子节点。事件“数据\
  \ ($X$, $Y$) 进入节点 $t$”被记为 $X \\in t$：根据构造，至少有一个训练点进入树的每个叶子节点。令 `n[c]` 表示类别为 `c`\
  \ 的训练数据数量，`n^t[c]` 表示进入节点 `t` 的类别为 `c` 的训练数据数量，$n^t = \\sum^{(C)}_{c=1}n[c]^{(t)}$\
  \ 表示进入节点 `t` 的训练数据总数。\n\n\n\n\n\n给定数据 (`X`, `Y`) 类别为 `c` 的条件下，其进入节点 `t` 的概率是通过进入该节点的类别为\
  \ `c` 的训练数据比例来估计的。\n\n```\n<math display=\"block\" location=\"image\\_n/c04\\_M0082.gif\"\
  ><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>Y</mi><mo>=</mo><mi>c</mi><mo>)</mo></mrow><mo>=</mo><mfrac><msubsup><mi>n</mi><mrow><mi>c</mi></mrow><mi>t</mi></msubsup><msub><mi>n</mi><mi>c</mi></msub></mfrac><mo>.</mo></mrow></math>\n\
  ```\n\n![编号显示方程](img/c04_M0082.gif)\n\n该估计随后被用于作为似然分类器进行预测。也就是说，给定数据 (`X`, `Y`)\
  \ 进入节点 `t` 的条件下，其为类别 `c` 的估计后验概率为：\n\n```\n<math display=\"block\" location=\"image\\\
  _n/c04\\_M0083.gif\"><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>c</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo>)</mo></mrow><mo>=</mo><mfrac><mrow><mover\
  \ accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>Y</mi><mo>=</mo><mi>c</mi><mo>)</mo></mrow><mspace\
  \ width=\"0.166667em\"/><mi mathvariant=\"normal\">P</mi><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>c</mi><mo>)</mo></mrow><mrow><mover\
  \ accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo>)</mo></mrow></mfrac><mo>,</mrow></math>\n\
  ```\n\n![编号显示方程](img/c04_M0083.gif) 其中 \n\n```\n<math display=\"block\" location=\"\
  image\\_n/c04\\_M0084.gif\"><mrow><mover accent=\"true\"><mi mathvariant=\"normal\"\
  >P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo>)</mo></mrow><mo>=</mo><sum_{d=1}^{C}\
  \ \\mover accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi>,momo><mi>Y</mi><mo>=</mo><mi>d</mi><mo>)</mo></mrow><mo>=</mo><sum_{d=1}^{C}\
  \ \\mover accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>Y</mi><mo>=</mo><mi>d</mi><mo>)</mo></mrow><mspace\
  \ width=\"0.166667em\"/><mi mathvariant=\"normal\">P</mi><mrow><mo>mo><mi>Y</mi><mo>=</mo><mi>d</mi><mo>)</mo></mrow><mo>.</mo></></math>\n\
  ```\n\n![编号显示方程](img/c04_M0084.gif)\n\n节点 `t` 将所有进入它的数据分类为类别 `c`，该类别使得估计后验风险最小：\n\
  \n```\n<math display=\"block\" location=\"image\\_n/c04\\_M0085.gif\"><mrow><mover\
  \ accent=\"true\"><mi mathvariant=\"normal\">R</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>c</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo)</mo></mrow><mo>=</mo><sum_{d=1}^{C}\
  \ L(d,c)\\mspace width=\"0.166667em\"/><mover accent=\"true\"><mi mathvariant=\"\
  normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>d</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo)</mo></mo><mo>666666666</mi><mo><momomo><mi><Y</mi><mo>=</mo><mi>d</><mo</momomo></math>\n\
  ```\n\n![编号显示方程](img/c04_M0085.gif)\n\n**练习 4.13** 证明如果从训练数据估计先验概率使得\n\n```\n<math><mover\
  \ accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo>)</mo></mrow><mo>=</mo><msub><n</mi</</c</n></math>\n\
  ```\n\n(images/c04_MLM101.gif)，则\n\n```\n<math display=\"block\" location=\"image\\\
  _n/c04\\_M0086.gif\"><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo>)</mo></mrow><mo>=</mo><frac{n_t}{n_t></mrow></math>\n\
  ```\n\n(images/c04_M0086.gif) 以及 \n\n```\n<math display=\"block\" location=\"image\\\
  _n/c04\\_M0087.gif\"><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>c</mi><mspace\
  \ width=\"0.166667em\"/><mo>|</mo><mspace width=\"0.166667em\"/><mi>X</mi><mo>&#x2208;</mo><mi>t</mi><mo>)</mo></mrow><mo>=</mo><frac{n_{ct}}{n_t}</mo></mrow></math>\n\
  ```\n\n(images/c04_M0087.gif)\n\n*证明在这样的先验下，对于 0-1 损失，叶节点将进入它的所有数据分类为进入它的训练数据中最常见的类别。*\n\
  \n\n\n\n叶节点 `t` 的纯度是一个函数 `I(t)`，它是给定 `X` ∈ `t` 的条件下，数据 `(X, Y)` 所属类的估计后验分布：\n\n\
  ```\n(P^(Y=1|X∈t), ..., P^(Y=C|X∈t))\n```\n它衡量了分布在值集合 `{1, …, C}` 上的离散程度。常用的纯度度量包括：\n\
  \n- 非多数类比例：\n```\nI(t) = 1 - max_{c{1,...,C}} P^(Y=c|X∈t)\n```\n- 多数类熵：\n```\nI(t)\
  \ = -∑_{c=1}^C P^(Y=c|X∈t) log P^(Y=c|X∈t)\n```\n- 多样性基尼指数：\n```\nI(t) = 1 - ∑_{c=1}^C\
  \ (P^(Y=c|X∈t))² = ∑_{c≠d} (1/d) P^(Y=c|X∈t)\n```\n\n在这些定义中的每一种下，纯度 `I(t)` 均为非负；当概率分布\
  \ `(P^(Y=1|X∈t), ..., P^(Y=C|X∈t))` 为均匀分布时，纯度取得唯一最大值；当该分布赋予某一类概率为一，而赋予所有其他类概率为零时，纯度最小且等于零。\n\
  \n树的纯度是关于叶节点上概率分布 `P^(X∈t)` 的叶节点期望纯度：\n\n```\n∑_{all leaf nodes t} I(t) P^(X∈t).\n\
  ```\n\n\n\n\n### 练习 4.14\n\n证明当叶节点的纯度通过多样性基尼指数（Gini index）衡量时，整棵树的纯度可以表示为：\n\n$$1\
  \ - \\sum_{all \\ leaf \\ nodes \\ t} \\frac{\\sum_{c=1}^{C} P²(X \\in t | Y=c)P(Y=c)}{P²(X\
  \ \\in t)} .$$\n\n![numbered Display Equation](img/c04_M0092.gif)\n\n### 4.8.3 树生长\n\
  \n分类树的训练（“生长”）是从单个节点开始的，根节点也是叶节点，并按照以下方式迭代分裂叶节点。令 `t` 为一个叶节点，令\n\n$$R = \\{(x_i,\
  \ y_i) : x_i \\in t\\}$$\n\n为进入 `t` 的训练数据集，并假设 `R` 中至少包含两个类，即 $|y_i : x_i \\in t|\
  \ \\ge 2$。考虑将 `R` 划分为两个非空子集 `R = R[1] \\cup R[2]` 的所有划分，这些划分是通过根据第 `j` 个特征划分数据产生的，对于每个\
  \ `j = 1, \\dots, m`。如果第 `j` 个特征是连续的，通过应用阈值 $\\tau$ 来分裂：\n\n$$R[1] = \\{(x_i, y_i)\
  \ : R : x_j \\le \\tau\\} \\text{ and } R[2] = \\{(x_i, y_i) : R : x_j > \\tau\\\
  }.$$\n\n$\\tau$ 的取值有无限多个，但考虑的划分是有限的，因为 `R` 是有限集合。如果第 `j` 个特征是分类的，则通过划分分类特征的范围来进行分裂：\n\
  \n$$R[1] = \\{(x_i, y_i) : R : x_j \\in S[1]\\} \\text{ and } R[2] = \\{(x_i, y_i)\
  \ : R : x_j \\in S[2]\\},$$\n\n其中 `S[1] \\cup S[2]` 是对第 `j` 个特征可取有限值集合的两个非空子集的划分。每个划分对应于向树中添加两个叶节点\
  \ `R[1]` 和 `R[2]`，此时原节点不再是叶节点：`R[1]` 是进入 `R[1]` 的训练数据，`R[2]` 是进入 `R[2]` 的训练数据。\n\
  \n重复分裂过程，直到每个叶节点都满足停止准则，例如，可以一直分裂叶节点，直到每个叶节点至少满足以下条件之一：其训练数据均属于同一类；其训练数据具有相同的特征向量；其包含的训练数据量不超过指定的数目。\n\
  \n图 4.23 显示了在图 4.1 数据上训练分类树的前四步。在每一步中，所示的数据划分是使树在经验先验概率 $(48/150, 49/150, 53/150)$\
  \ 下三个类别上纯度最小的划分![](img/c04_ILM106.gif)。\n\n图 4.23 右下角单元格对应的分类树在图 4.22 中以决策树算法表示。该树所作的预测显示在图\
  \ 4.24 的右上角单元格中。任何只有两个叶节点的树（如图 4.23 左上角单元格所示）被称为*决策桩**stump*）。\n\n![Figure 4.23\
