  \ `c` 数据中第 `j` 个特征坐标的样本标准差。然而，请注意，此类规则通常选择的是使核密度估计作为真实密度估计时，相对于平方误差损失的风险最小的带宽，且在该准则下的最优性并不意味着基于核密度估计的分类器具有最优性。在分类器中使用核密度估计时，应通过优化分类器的估计风险来调整带宽（尽管图\
  \ 4.8 显示正态参考规则效果良好）。\n\n\n\n\n![图 4.8 估计的类别密度（左侧）和使用积高斯核密度估计得出的分类决策（右侧），该估计基于图 4.1\
  \ 的数据进行训练，带宽从正态参考规则获得：h1, 1 = 0.76, h1, 2 = 0.62, h2, 1 = 0.79, h2, 2 = 0.67, h3,\
  \ 1 = 0.49 以及 h3, 2 = 0.98。白色曲线显示贝叶斯分类边界。该核密度估计的估计风险为 0.199，尽管留一交叉验证更倾向于图 4.7 中间单元格所示的带宽\
  \ h = 0.5 分类器。](img/c04f008.jpg)\n\n**图 4.8** 估计的类别密度（左侧）和使用积高斯核密度估计得出的分类决策（右侧），该估计基于图\
  \ 4.1 的数据进行训练，带宽从正态参考规则获得：`h*[1, 1] = 0.76`、`h*[1, 2] = 0.62`、`h*[2, 1] = 0.79`、`h*[2,\
  \ 2] = 0.67`、`h*[3, 1] = 0.49` 以及 `h*[3, 2] = 0.98`。白色曲线显示贝叶斯分类边界。该核密度估计的估计风险为 0.199，尽管留一交叉验证更倾向于图\
  \ 4.7 中间单元格所示的带宽 `h = 0.5` 分类器。\n\n尽管带宽参数 `h*[1]`、…… `h[C]` 是预先固定的，但注意每个观测数据 (`x[i]`,\
  \ `y[i]`) 都会向其中一个密度估计添加一项 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c04_ILM0047.gif\"><mrow><mi>K</mi><mo>(</mo><mfrac><mrow><mi>x</mi><mo>-</mo><msub><mi>x</mi><mi>i</mi></msub></mrow><msub><mi>h</mi><mi>c</mi></msub></mfrac><mo>)</mo></mrow></math>`![](img/c04_ILM0047.gif)，因此数据实际上也是核密度估计的参数，所以参数的数量随着\
  \ n → ∞ 无限增加。从这个意义上说，核密度估计是非参数方法。由于对每个类别 `c` 计算 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c04_ILM0048.gif\"><><><mover accent=\"true\"><mi mathvariant=\"\
  normal\">P</mi><mo>^</mo></mover><mrow><mo}(\\mo><mi>x</mi><mspace width=\"0.166667em\"\
  /><mo>|</mo><mspace width=\"0.166667em\"/><mi>Y</mi><mo>=</mo><mi>c</mi><mo)</mo></mrow></mrow></math>`![](img/c04_ILM0048.gif)\
  \ 需要对每个数据点求一次核函数，当数据量 `n` 很大时，KDE 的实现可能会代价很高。\n\n### 4.4.5 直方图\n\n直方图是密度函数的阶函数近似。与核密度估计一样，直方图有一个必须仔细选择的带宽参数。对于每个类别\
  \ `c`，给出了一个依赖于带宽的特征空间 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c04_ILM0049.gif\"><mi mathvariant=\"script\">X</mi></math>`![](img/c04_ILM0049.gif)\
  \ 的矩形单元划分。当 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c04_ILM0050.gif\"><mrow><mi mathvariant=\"script\">X</mi><mo>=</mo><msup><mrow><mi\
  \ typeof=\"double-struck\">R</mi></mrow><mi>m</mi></msup></mrow></math>`![](img/c04_ILM0050.gif)，这些单元是\
  \ `<displayedItem xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\"\
  \ xmlns=\"http://www.wiley.com/namespaces/wiley\" xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ id=\"c04-disp036\"> \n\n(4.6) \n\n，由 `<math>` 索引。与核密度估计一样，直方图有一个必须仔细选择的带宽参数。对于每个类别\
  \ `c`，给出了依赖于带宽的特征空间 `X`![](img/c04_ILM0049.gif) 的矩形单元划分。当 `X = R^m` 时，这些单元是 `Rc\
  \ = {(x[1], ..., x[m]) ∈ R^m : h[c,1] ≤ x[1] < h[c,1]+h[c,1], h[c,2] ≤ x[2] < h[c,2]+h[c,2],\
  \ ..., h[c,m] ≤ x[m] < h[c,m]+h[c,m]}` (images/c04_M035.gif)，其中 `h[c,j]` 是第 `j`\
  \ 个特征和第 `c` 个类别的带宽参数。给定任意特征向量 `x` 和任意类别 `c`，令 `Rc`![](img/c04_M035.gif) 表示包含 `x`\
  \ 的矩形 `Rc`：索引向量 (`i[1], ..., i[m])`) 通过设置得到：\n\n```\ni_j = floor(x_j / h_{c,j})\n\
  ```\n!(images/c04_M0037.gif)\n\n\n\n对于 `j = 1, …, `m`，其中 `⌊r⌋` 表示实数 `r` 的整数下地板。对于任意特征向量\
  \ `x` 和任意类别 `c`，令 `n^(Rc)[c]` 表示落在矩形 `Rc` 中的类别为 `c` 的训练数据数量。直方图密度估计为：\n\n```\nP(x|Y=c)\
  \ = n_c(R_c(x)) / n_c.\n```\n\n![numbered Display Equation](img/c04_M0038.gif)\n\
  \n这种情况在图 4.9 中得到了所示。\n\n![Figure 4.9 将  into 划分为由  hc, 1 × hc, 2 多个矩形 Rc(i, j) 组成的网格，并展示了图\
  \ 4.1 中的部分紫色数据。](img/c04f009.gif)\n\nFigure 4.9 将 `X=R²` 划分为由 `h[c, 1] × h[c, 2]`\
  \ 个矩形 `Rc` 组成的网格，并展示了图 4.1 中的部分紫色数据。\n\n注意，与核密度估计不同，直方图密度估计除了带宽外，还依赖于 `X` 中原点的选择。上述定义的矩形单元可以通过加上\
  \ `[0, h[c, 1]) × ⋅⋅⋅ × [0, h[c, m])` 中的任意常数向量来平移，为分类器提供额外的灵活性。与乘积密度估计一样，具有不同边长\
  \ `h[c, 1], …, h[c, m]` 的矩形单元可以适应在不同尺度上量的特征。\n\n带宽参数 `h[c, i]` 的影响在图 4.10 中所示，其中为了方便起见，施加了约束\
  \ `h[1, 1] = h[1, 2] = h[2, 1] = h[2, 2] = h[3, 1] = h[3, 2]`，并且每个类别单元 `R(0, 0)`\
  \ 的左下角均位于原点。带宽参数的值较小（相对于数据尺度）会导致密度估计呈现“尖峰状”，并高度集中在观测数据周围。它也会导致许多直方图单元完全没有任何数据。在\
  \ `R1 = ⋅⋅⋅ = RC = 0` 的单元中，直方图分类器将所有类别 `c` 的 `P(X=x | Y=c)` 处理为相同的极正数，并对 `c = 1,\
  \ …, C` 使用估计值 `P(Y=c | X=x)∝P(Y=c)`。带宽参数的中等值产生的密度估计在视觉上与图 4.1 中所示的真实密度相似。带宽参数的大值会导致密度估计在较大的矩形区域内为常数。\n\
  \n\n\n\n`for c` = 1, …, `C`。证明在特征向量 `x` 处，分类器的预测为：\n\n```\n\\text{argmin}_{c=1,\\\
  dots,C} \\sum_{d=1}^C L(d,c)n_d(R_d(x))\n```\n\n![numbered Display Equation](img/c04_M0040.gif)\n\
  \n证明如果分类器额外使用 0–1 损失，则分类器的预测为：\n\n```\n\\text{argmax}_{c=1,\\dots,C} n_c(R_c(x))\n\
  ```\n\n![numbered Display Equation](img/c04_M0041.gif)\n\n### 4.4.6 朴素贝叶斯分类器\n\n\
  朴素贝叶斯分类器是一种基于似然的方法，其假设是特征（`X` 的坐标）都是相互独立的，至少是近似相互独立的。这意味着每个类别的似然函数 `P(x | Y = c)`\
  \ 可以表示为 `m` 个边缘似然函数的乘积：在点 `x = (x[1], …, x[m])` 处，\n\n```\nP(x | Y=c) = \\prod_{j=1}^m\
  \ P(x_j | Y=c)\n```\n\n![numbered Display Equation](img/c04_M0042.gif)\n\n朴素贝叶斯分类器的训练是通过通过某种方式（例如上述任一种方法）估计每个类别\
  \ `c` 和特征 `i` 的一维坐标密度 `P(x[i] | Y = c)`，并将这些估计值代入乘积中实现的。图 4.1 展示了边缘密度的核密度估计\n\n\
  ```\nP(x_1 | Y=c)\n```\n\n(images/c04_ILM056.gif) 和 \n\n```\nP(x_2 | Y=c)\n```\n\
  \n(images/c04_ILM057.gif)，得到的估计联合密度\n\n```\nP(x | Y=c)\n```\n\n(images/c04_ILM058.gif)，以及在图\
  \ 4.1 数据上训练的朴素贝叶斯分类器所做的类别预测。不应仅仅因为这个贬义名称就忽视这项技术。\n\n![图 4.11 估计的类别密度（左上角）和使用在图 4.1\
  \ 数据上训练的朴素贝叶斯密度估计所做的分类决策（右上角）。密度估计是由两个一维核密度估计的乘积形成的，使用了高斯核和 0.7 的带宽，如下方两个单元格所示（带有数据的一维投影作为参考）。朴素贝叶斯分类器的估计风险为\
  \ 0.212。通过第 7.3 节描述的留一交叉验证从训练数据估计风险，选择了近似最优的带宽 0.7。](img/c04f011.jpg)\n\n[图 4.11]\
  \ 估计的类别密度（左上角）和分类决策（右上角）...\n\n**练习 4.9** 证明假设所有特征均服从高斯分布的朴素贝叶斯分类器等同于所有协方差矩阵均为对角矩阵的二次判别器。\n\
  \n## 4.5 原型方法\n\n原型方法的核心思想是通过考虑邻近训练数据点的类别来对新数据点进行分类，其中“邻近”是根据对于当前应用有意义的某种距离定义的。训练数据由原型表示，原型是\
  \ `X` 中的特征向量。（images/c04_ILM059.gif）。原型可以是观测数据点，也可以是理想化的数据点。\n\n### 4.5.1 k-最近邻\n\
  \n给定训练数据 `x[1], y[1]), …, (x[n], y[n])` 和新点 `x`，k-最近邻（KNN）算法将 `x` 分类为最近的 `k` 个训练数据中频率最高的类别（在可能的情况下，平局通常随机决定）。`k`\
  \ 值较小会导致类别边界弯曲，而较大的 `k` 值会导致边界平滑。取 `k > 1` 可以在存在错误训练数据的情况下提供鲁棒性。在 k-最近邻分类器中，每个数据点都是一个原型。\n\
  \n\n\n\n\n邻居数量参数 `k` 的影响在图 4.12 左侧单元格中所示。`k` 的小值会使得分类器的行为对特定数据点敏感。注意 1-最近邻分类器如何预测左上单元格顶部中央的某个区域为紫色，这是因为在图\
  \ 4.1 右侧单元格的顶部中央可以看到单个离群紫色数据点。`k` 的中等值在对类别密度局部变化的敏感性与平滑数据中的噪声之间取得了平衡。`k` 的大值会导致分类器对类别密度的局部变化相对不敏感。\n\
  \n![图 4.12 使用 k-最近邻（左）和学习向量量化（右）进行的分类决策，这些模型是基于图 4.1 的数据训练的。最近邻数量 k = 1, 9 和 100\
  \ 分别产生了估计风险 0.248、0.202 和 0.247。LVQ 原型数量 60、6 和 3（每个类 20、2 和 1 个，用黑色所示）分别产生估计风险\
  \ 0.213、0.195 和 0.245。值 k = 9 和 6 个 LVQ 原型使用第 7.3 节描述的留一交叉验证被选为近似最优，用以从训练数据中估计风险。](img/c04f012.jpg)\n\
  \n**图 4.12** 使用 `k`-最近邻（左）和学习向量量化（右）进行的分类决策，这些模型是基于图 4.1 的数据训练的。最近邻数量 `k` = 1, 9\
  \ 和 100 分别产生估计风险 0.248、0.202 和 0.247。LVQ 原型数量 60、6 和 3（每个类 20、2 和 1 个，用黑色所示）分别产生估计风险\
  \ 0.213、0.195 和 0.245。值 `k` = 9 和 6 个 LVQ 原型使用第 7.3 节描述的留一交叉验证被选为近似最优，用以从训练数据中估计风险。\n\
  \n`k`-最近邻分类器的直观实现需要计算每个待分类点 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c04\\_ILM0060.gif\"><mrow><mi>X</mi><mo>&#x2208;</mo><mi\
  \ mathvariant=\"script\">X</mi></mrow></math>`(images/c04_ILM0060.gif)每个训练数据点之间的距离：每个待分类点需要\
  \ `O(n)` 的工作。如果待分类点数足够大，可以使用名为`多维二叉搜索树`或更常见的 `k-d tree` (Bentley, 1975) 的数据结构来实现更高效的\
  \ `k`-最近邻算法。构建 `k-d tree` 需要 `O(nlog n)` 的工作，但使用 `k-d tree` 每个待分类点平均只需要 `O(log n)`\
  \ 的工作。\n\n这是一种非常老的分类方法：1-最近邻可以追溯到 1951 年美国空军航空医学学院的一份技术报告 (Fix and Hodges, 1951)。通用\
  \ `k`-最近邻归于 Cover 和 Hart (1967)。\n\n### 4.5.2 压缩*k*-最近邻\n\n压缩 `k`-最近邻是一种以较低成本获得\
  \ `k`-最近邻性能的方法 (Hart, 1968)。给定训练数据 (`x[1]`, `y[1]`)， …, (`x[n]`, `y[n]`)，按照以下方式形成一个压缩集\
  \ `S`：初始时，`S = {(x[1], y[1])}`。对于 `i = 2, 3, …, `n`，如果 `x[i]` 被在 `S` 上训练的 `k`-最近邻分类器错误分类，则将\
  \ `(x[i], y[i])` 添加到 `S`，否则丢弃。一旦使用所有训练数据构建了 `S`，压缩 `k`-最近邻分类器就是基于子集 `S ⊆{(x[1],\
  \ y[1]), …, (x[n], y[n])}` 训练的 `k`-最近邻分类器。压缩集 `S` 是一组实际数据点的原型集合。当然，与其在 `S` 上训练 `k`-最近邻分类器，人们可以使用其他分类器——例如压缩\
  \ `k`-最近邻。\n\n### 4.5.3 最近聚类\n\n最近聚类是减少 `k`-最近邻成本的另一种尝试。其想法非常简单：对每个类别的训练数据单独运行聚类算法（见第\
  \ 9 章）。所得聚类中心为每个类的原型，新数据通过在原型集上训练的 `k`-最近邻分类器进行分类。聚类原型不需要是实际数据点。例如，如果使用了 `<math\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c04_ILM0061.gif\"><mrow><mi>X</mi><mo>=</mo><msup><mrow><mi mathvariant=\"double-struck\"\
  >R</mi></mrow><mi>m</mi></msup></mrow></math>`(images/c04_ILM0061.gif) 和 `k`-means\
  \ 算法，原型通常不是特征向量。另一方面，如果使用了第 9.6 节 `k`-medoids 算法，原型将是特征向量。\n\n### 4.5.4 学习向量量化\n\
  \n在 `k`-最近邻和最近聚类分类器中，类的原型仅基于该类的训练数据选择，而不是基于所有训练数据 (Kohonen 1986)。学习向量量化 (LVQ) 使用所有训练数据来选择原型。对于每个类，选择一定数量的初始原型：可以通过对训练数据进行随机采样或使用如聚类类的算法来实现。训练原型集（等同于训练\
  \ LVQ 分类器）的方法是将原型移向所属类的数据点并远离其他类的数据点。训练好的 LVQ 分类器预测点 `x` 的类别为距离 `x` 最近的原型的类别。LVQ\
  \ 的应用要求特征空间 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c04\\_ILM0062.gif\"><mi mathvariant=\"script\">X</math>`(images/c04_ILM0062.gif)\
  \ 使得点 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"\
  http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"inline\"\
  \ location=\"image\\_n/c04\\_ILM0063.gif\"><mrow><mi>x</mi><mo>&#x2208;</mo><mi\
  \ mathvariant=\"script\">X</mi></mrow></math>`(images/c04_ILM0063.gif) 能够在沿给定方向移动给定距离（例如，`<math\
  \ xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c04\\_ILM0064.gif\"><mrow><mi mathvariant=\"script\">X</mi><mo>=</mo><msup><mrow><mi\
  \ mathvariant=\"double-struck\">R</mi></mrow><mi>m</mi></msup></mrow></math>`(images/c04_ILM0064.gif)).\n\
  \n\n\n\n\n训练算法从步长 `ε < 1` 开始，并反复迭代图 4.13 所示的步骤，直到达到某些收敛准则或迭代次数上限。某些版本的 LVQ 在每次迭代的步骤\
  \ (7) 中减小 `ε`，例如使用更新规则：\n\n```\nε_i = ε_0 * (1 - i/I)\n```\n\n![图 4.13 学习向量量化算法](img/c04f013.jpg)\n\
  \n图 4.13 学习向量量化算法。\n\n![编号显示公式](img/c04_M0043.gif)\n\n其中索引 `i` 统计算法从 0 到 `I - 1`\
  \ 的迭代次数，`I` 是用户指定的执行的迭代次数。另一种更复杂的 LVQ^(20) 为每个类别 `c` 使用不同的 `ε` 值，通过规则在步骤 (7) 中更新\
  \ `ε[c]`：\n\n```\nε_c = { \n  ε_c / (1 + ε_c) if x and p are of the same class;\n\
  \  min(ε, ε_c / (1 - ε_c)) if x and p are of different classes\n}\n```\n\n![编号显示公式](img/c04_M0044.gif)\n\
  \n其中 `c` 是原型 `p` 的类别，`ε < 1` 是 `ε[1], …, ε[C]` 的初始值。因此，当训练算法发现 LVQ 在类别 `c` 上的表现良好时，它会收缩\
  \ `ε[c]`；当发现 LVQ 在类别 `c` 上的表现糟糕时，它会增加 `ε[c]`（最大不超过 `ε`）。\n\n原型数量 `k` 的影响在图 4.12\
  \ 的右侧单元格中所示。在这些示例中，原型是通过对于每个 `c` = 1, …, `C`，从类别 `c` 的特征向量中均匀随机且不放回地选择比例 `P(Y =\
  \ c)` 的 `k` 个点初始化的。使用了“更复杂”的更新规则，`ε[c]` 初始化为 0.3，并执行了 600 次迭代。较大的 `k` 值使得 LVQ 的行为对特定点敏感，而较小的\
  \ `k` 值则敏感度较低。在每个类别一个原型的极端情况下（`k = C`），每对类别之间的边界是线性的。\n\n逻辑回归通过将分类问题转化为回归问题来解决，显式地估计类别概率向量：\n\
  \n```\nP(Y=1|X), ..., P(Y=C|X)\n```\n\n![编号显示公式](img/c04_M0045.gif)\n\n具体而言，逻辑回归的假设假设是相对于某些类别的长度为\
  \ `(C - 1)` 的对数优势（log-odds）向量，在不失一般性的情况下，这可以是类别 1：\n\n```\nlog(P(Y=2|X)/P(Y=1|X)),\
  \ ..., log(P(Y=C|X)/P(Y=1|X))\n```\n\n![编号显示公式](img/c04_M0046.gif)\n\n\n\n\n是特征向量\
  \ `X` 的线性函数。也就是说，假设\n\n\\[\n\\begin{pmatrix}\n\\log\\frac{P(Y=1|X)}{P(Y=1|X)} \\\
  \\\n\\log\\frac{P(Y=2|X)}{P(Y=1|X)} \\\\\n\\log\\frac{P(Y=3|X)}{P(Y=1|X)} \\\\\n\
  \\vdots \\\\\n\\log\\frac{P(Y=C|X)}{P(Y=1|X)}\n\\end{pmatrix} =\n\\begin{pmatrix}\n\
  0 & 0 & \\dots & 0 \\\\\n\\theta_{2,0} & \\theta_{2,1} & \\dots & \\theta_{2,m}\
  \ \\\\\n\\theta_{3,0} & \\theta_{3,1} & \\dots & \\theta_{3,m} \\\\\n\\vdots & \\\
  vdots & \\ddots & \\vdots \\\\\n\\theta_{C,0} & \\theta_{C,1} & \\dots & \\theta_{C,m}\n\
  \\end{pmatrix}\n\\begin{pmatrix}\n1 \\\\\nX_1 \\\\\n\\vdots \\\\\nX_m\n\\end{pmatrix}\n\
  \\]\n\n(4.2) c04_M0047\n\n对于某个 `C` × (`m` + 1) 的实参数矩阵（其中 `m` + 1 个参数被限制为零）\n\n\\\
  [\n\\theta =\n\\begin{pmatrix}\n0 & 0 & \\dots & 0 \\\\\n\\theta_{2,0} & \\theta_{2,1}\
  \ & \\dots & \\theta_{2,m} \\\\\n\\theta_{3,0} & \\theta_{3,1} & \\dots & \\theta_{3,m}\
  \ \\\\\n\\vdots & \\vdots & \\ddots & \\vdots \\\\\n\\theta_{C,0} & \\theta_{C,1}\
  \ & \\dots & \\theta_{C,m}\n\\end{pmatrix}\n\\]\n\n其中 `θc` 表示 $\\theta$ 的第 `c` 行。给定\
  \ $\\theta$ 的值，可以从公式 (4.2) 中恢复类别成员概率。对于 `c` = 1, …, `C`，定义线性函数\n\n\\[\nT_c(X, \\\
  theta_c) = \\theta_{c,0} + \\sum_{j=1}^{m} \\theta_{c,j}X_j\n\\]\n\nc04_M0048\n\n\
  \n\n并注意 `T[1]` = `T(X, \\theta[1])` = 0。线性函数 `T(X, \\theta[c])` 是类别 `c` 相对于类别 1\
  \ 的对数优势（log-odds）的逻辑回归估计 $\\frac{P(Y=c|X)}{P(Y=1|X)}$![](img/c04_ILM0065.gif)，其中\
  \ `c` = 1, …, `C`。\n\n### 4.10\n证明在逻辑回归模型假设 (4.2) 下，特征向量 `X` 属于类别 `c` 的概率为：\n\n\
  ```\nP(Y=c|X) = \\frac{\\exp(T(X, \\theta_c))}{\\sum_{d=1}^{C} \\exp(T(X, \\theta_d))}\n\
  ```\n\n(4.3)![numbered Display Equation](img/c04_M0051.gif)\n\n训练逻辑回归分类器意味着找到矩阵\
  \ `theta` 的估计值 $\\hat{\\theta}$。假设训练数据是独立的，这意味着类别标签 `Y[i]` 是从概率参数为 `P(Y | X = x[i])`\
  \ 的多项分布中抽取的：\n\n```\nY_i | (X_i = x_i) \\sim \\text{Multinomial}(1, (P(Y=1|X=x_i),\
  \ ..., P(Y=C|X=x_i)))\n```\n\n![numbered Display Equation](img/c04_M02)\n\n因此，数据\
  \ (`x[1]`, `y[1]`), …, (`x[n]`, `y[n]`) 的对数似然为：\n\n```\n\\sum_{i=1}^{n} \\log P(y_i|X=x_i)\
  \ = \\sum_{i=1}^{n} T(x_i, \\theta_{y_i}) - \\sum_{i=1}^{n} \\sum_{d=1}^{C} \\log\
  \ \\exp(T(x_i, \\theta_d))\n```\n\n![numbered Display Equation](img/c04_M054)\n\n\
  通过使用数值优化算法（近似）最大化该对数似然来找到 `theta` 的估计值 $\\hat{\\theta}$。细节包括对数似然梯度的计算（等价于通过练习 4.11，即交叉熵损失下训练风险估计的梯度）可以参见第\
  \ 10 章。训练好的分类器为：\n\n```\n\\hat{f}(x) = \\text{argmin}_{c \\in \\{1, \\dots, C\\\
  }} L(d, c) \\hat{P}(Y=d|X=x)\n```\n\n![numbered Display Equation](img/c04_M055.gif)\n\
  \n\n\n其中，对于 *c* = 1, …, *C*，<displayedItem xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"\
  http://www.documentum.com\" xmlns=\"http://www.wiley.com/namespaces/wiley\" xmlns:wiley=\"\
