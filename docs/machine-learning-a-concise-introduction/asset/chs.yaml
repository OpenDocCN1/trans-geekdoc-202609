  > — 简·奥斯汀，《傲慢与偏见》，1813\n\n为了产生现实世界的影响，机器学习从业者需要与一个或多个自然科学、社会科学或计算机科学合作。因此，对于机器学习从业者能够与这些领域的人交流是有益的。事实上，作者认为，机器学习从业者说他们自己所属领域的语言更为必要——我们必须更多地向他们迈出一步。\n\
  \n## 12.1 二分类分类与假设检验\n\n我们首先回顾两种基于数据做出决策的框架。在二分类分类中，对于每个特征向量 `X`，我们必须根据近似函数 `f(X)`\
  \ 的值在两个操作之间做出选择。要么预测 `X` 属于类 1（因为 `f(X) = 1`），要么预测 `X` 属于类 2（因为 `f(X) = 2`）。\n\n\
  同样，在进行假设检验时，对于每个特征向量 `X`，我们必须根据检验统计量 `S(X)` 和拒绝域 `R`（`S` 范围的一个子集）在两个操作之间做出选择。要么拒绝原假设\
  \ `H[0]` 而接受备择假设 `H[a]`（因为 `S(X) ∈ R`），要么保留原假设（因为 `S(X)∉ R`）。\n\n这两个框架可以通过考虑贝叶斯分类器来统一，前提是将类\
  \ 1 识别为 `H[0]`，将类 2 识别为 `H[a]`。在分类中（特别是第 2 章和第 4 章），我们关注的是做出最小风险预测：\n\n```\nargmin_{c∈1,2}}\
  \ R(c|X)\n```\n\n其中\n```\nR(c|X) = d_1 P(Y=d|X) = P(Y=d|X)\n```\n\n由于只有两个类，贝叶斯分类器预测类\
  \ 2 当且仅当\n```\nR(1|X) ≥ R(2|X)\n```\n\n即当且仅当\n```\nL(2,1) P(Y=2|X) ≥ L(1,2) P(Y=1|X)\n\
  ```\n\n\n\n将所有涉及特征向量 `X` 的项移到一侧，贝叶斯分类器预测为类别 2 当且仅当：\n\n```\n\\frac{P(Y=2|X)}{P(Y=1|X)}\
  \ \\geq \\frac{L(1,2)}{L(2,1)}\n```\n\n![numbered Display Equation](img/c12_M0005.gif)\n\
  \n或者等价于，当且仅当：\n\n```\n\\frac{P(X|Y=2)}{P(X|Y=1)} \\geq \\frac{L(1,2)}{L(2,1)} \\\
  cdot \\frac{P(Y=1)}{P(Y=2)}\n```\n\n![numbered Display Equation](img/c12_M0006.gif)\n\
  \n通过以下方式定义统计量 `S(X)` 和拒绝域 `R`：\n\n```\nS(X) = \\frac{P(Y=2|X)}{P(Y=1|X)} \\text{\
  \ and } R = \\{S(X) \\geq \\frac{L(1,2)}{L(2,1)}\\\n```\n\n![numbered Display Equation](img/c12_M0007.gif)\n\
  \n或者通过：\n\n```\nS(X) = \\frac{P(X|Y=2)}{P(X|Y=1)} \\text{ and } R = \\{S(X) \\geq\
  \ \\frac{L(1,2)}{L(2,1)} \\cdot \\frac{P(Y=1)}{P(Y=2)}\\\n```\n\n![numbered Display\
  \ Equation](img/c12_M0008.gif)\n\n将产生一个与贝叶斯分类器执行完全相同的假设检验（即：该检验当且仅当贝叶斯分类器预测为类别 2\
  \ 时拒绝 `H0`）。([3])\n\n## 12.2 二元决策的术语\n\n统计学、计算机科学以及各种自然科学和社会科学对从数据做出二元决策问题的许多方面都给出了名称，无论该问题被视为分类还是假设检验。不同的领域强调该问题的不同侧面，并在某些情况下对同一个事物给出了多个不同的名称。这些名称如表\
  \ 12.1 和表 12.2 所示。\n\n**表 12.1** 上述决策问题中的四种可能性。列反映了观测值的真实状态（数据确实是类别 1 或类别 2，或者确实是在\
  \ `H0` 或 `Ha` 下产生的）。行反映了所采取的行动（我们预测为类别 1 或类别 2，我们保留或拒绝 `H0`）。数字 `a`、`b`、`c` 和 `d`\
  \ 代表概率，且 `a + b + c + d = 1`。\n\n| | 数据为类别 1 | 数据为类别 2 |\n| --- | --- | --- |\n\
  | | `H0` 为真 | `Ha` 为真 |\n| | `a` | `b` |\n| --- | --- | --- |\n| 预测类别 1 | | `type\
  \ II error` (二类错误) |\n| 保留 `H0` | `true negative` (真阴性) | `false negative` (假阴性)\
  \ |\n| | `true nondiscovery` (真未发现) | `false nondiscovery` (假未发现) |\n| | `c` | `d`\
  \ |\n| 预测类别 2 | `type I error` (一类错误) | |\n| 拒绝 `H0` | `false positive` (假阳性) |\
  \ `true positive` (真阳性) |\n| | | `false discovery` (假发现) | `true discovery` (真发现)\
