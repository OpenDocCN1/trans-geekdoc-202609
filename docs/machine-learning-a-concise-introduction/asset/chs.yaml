  \ (11.2) 的测量，二维线性 MDS 保留了 34.8% 的欧几里得距离矩阵。\n\n### 11.3 非降维\n\nisomap 算法加上一维线性 MDS\
  \ 提供了一种寻找高维数据低维表示的方法。自编码器。源于 Hinton 和 Salakhutov (2006) 的工作，自 2007 年以来，它导致了神经网络研究和应用的剧剧增长。\n\
  \n### 11.3.1 自编码器\n\n本节描述了一种训练深度神经网络的明智想法。假设特征空间 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c11_ILM024.gif\"><msup><mrow><mi6=\"double-struck\"\
  >R</mi></mrow><mn>64</mn></msup></math>`![](img/c11_ILM0124.gif)。可能是自然发生的，也可能通过某种方式变换空间（17）。考虑一个单隐藏层神经网络，输出层\
  \ `T` 由 `m` 个节点组成，输出层 `T` 和 `N` 节点隐藏层 `Z` 都由神经元组成（这与第 4 节的符号，\n\n\n\n\n\n```\nT\
  \ = \\sigma(\\theta_0(2) + \\theta_\\star(2)\\theta(1))Z = \\sigma(\\theta_0(2)\
  \ + \\theta_\\star(2)\\sigma(\\theta_0(1) + \\theta_\\star(1)X)) \\in \\{0,1\\}^m.\n\
  ```\n\n![numbered Display Equation](img/c11_M0057.gif)\n\n神经网络是一个映射 $\\mathcal{X}\
  \ \\to \\mathcal{X}$。(images/c11_ILM0127.gif)\n\n观察到第一层的参数矩阵 $\\theta^{(1)}[\\star]$\
  \ 是 $N \\times m$，而第二层的参数矩阵 $\\theta^{(2)}[\\star]$ 是 $m \\times N$，因此对参数可以施加以下约束：\n\
  \n```\n\\theta_\\star(2) = \\theta_\\star(1)^T\n```\n\n![numbered Display Equation](img/c11_M0058.gif)\n\
  \n其他参数 $\\theta^{(1)}[0]$ 和 $\\theta^{(2)}[0]$ 是未约束的。因此，该神经网络的自由参数是整个矩阵 $\\theta^{(1)}$\
  \ 和长度为 $m$ 的向量 $\\theta^{(2)}[0]$。令 $d$ 为 $\\mathcal{X}$ 中元素的任意不相似度量。`single-hidden-layer\
  \ autoencoder`（单隐藏层自编码器）是一种类型的神经网络，其参数的选择使得在给定数据集上，相对于不相似度 $d$，输出尽可能匹配输入。也就是说，选择自由参数\
  \ $\\theta^{(1)}$ 和 $\\theta^{(2)}[0]$ 是为了最小化：\n\n```\n\\sum_{i=1}^n d(x_i, T(x_i))\n\
  ```\n\n显示方程](images/c11_M0059.gif)\n\n换句话说，该网络被用于近似训练数据 $x[1], \\dots, x[n]$（以及可能的训练数据附近）的恒等函数。单隐藏层自编码器如图\
  \ 11.1 所示。\n\n使用估计的参数 $\\sigma(\\theta_0(1) + \\theta_\\star(1)X)$(images/c11_ILM0129.gif)，从输入向量\
  \ $x[1], \\dots, x[n] \\in \\{0,1\\}^m$ 计算出一组中间向量 $z[1], \\dots, z[n] \\in \\{0,1\\\
  }^N$：\n\n```\nz_i = \\sigma(\\theta_0(2) + \\theta_\\star(2)x_i)\n```\n对于 $i=1,\
  \ \\dots, n$。\n\n显示方程](images/c11_M0060.gif)\n\n长度为 $N$ 的向量 $z[1], \\dots, z[n]$\
  \ 代表当长度为 $m$ 的观测特征向量 $x[1], \\dots, x[n]$ 馈入网络时隐藏层 $Z$ 的状态。可以在中间向量 $z[1], \\dots,\
  \ z[n]$ 上训练一个新的单隐藏层自编码器。\n\n![Figure 11.11 一个单隐藏层自编码器。长度为 $N$ 的隐藏层是 Z = \\sigma(\\\
  theta(1)0 + \\theta(1)\\*)X)，长度为 $m$ 的顶层是 T = \\sigma(\\theta(2)0 + \\theta(2)\\\
  *)Z)。寻找参数矩阵 \\theta(1) 和 \\theta(2) 的值，使得 \\sumni = 1d(xi, T(xi)) 最小，受约束 \\theta(2)\\\
  * = (\\theta(1)\\*)T，其中 d 是特征空间上的某种不相似度量。](img/c11f011.jpg)\n\n**图 11.11** 一个单隐藏层自编码器。长度为\
  \ $N$ 的隐藏层是 $Z = \\sigma(\\theta^{(1)}[0] + \\theta^{(1)}[\\star]X)$，长度为 $m$ 的顶层是\
  \ $T = \\sigma(\\theta^{(2)}[0] + \\theta^{(2)}[\\star]Z)$。寻找参数矩阵 $\\theta^{(1)}$\
  \ 和 $\\theta^{(2)}$ 的值，使得在约束 $\\theta^{(2)}[\\star] = (\\theta^{(1)}[\\star])^T$\
  \ 下，$\\sum_{i=1}^n d(x_i, T(x_i))$ 最小，其中 $d$ 是特征空间上的某种不相似度量。\n\n该过程可以迭代 $k$ 次，具体如图\
  \ 11.2 所示的步骤。当 $k > 1$ 时，结果被称为 `deep autoencoder`（深度自编码器），如图 11.3 所示。深度自编码器具有隐藏层\
  \ $Z^{(1)}, Z^{(2)}, \\dots, Z^{(k-1)}, Z^{(k)}, Z^{(k+1)}, \\dots, Z^{(2k-1)}$，其长度分别为\
  \ $N^{(1)}, N^{(2)}, \\dots, N^{(k-1)}, N^{(k)}, N^{(k-1)}, \\dots, N^{(2)}, N^{(1)}$——这种对称性是迭代过程自然的结果，因为隐藏层\
  \ $Z^{(j)}$ 和 $Z^{(2k-j)}$是在第 $j$ 次迭代中构建的。\n\n![Figure 11.12 通过迭代单隐藏层自编码器来训练深度自编码器。](img/c11f012.jpg)\n\
  \n**图 11.12** 通过迭代单隐藏层自编码器来训练深度自编码器。\n\n\n\n\n\n![图 11.13 一个 (2k − 1)隐藏层的“深度”自动编码器。首先，通过在\
  \ Z(j − 1)（其中 $Z(0) = X$）上训练单隐藏层自动编码器，按顺序获得 j = 1, \\dots, k 的参数矩阵 $\\theta(j)$\
  \ 和 $\\theta(2k − j)$。将得到的参数作为初始状态，寻找参数矩阵 $\\theta(1), \\dots, \\theta(2k)$ 以使得\
  \ $\\sum_{ni = 1}^d(xi, T(xi))$ 最小化且无任何约束，其中 $d$ 是特征空间上给定的不相似性度量。由 $X \\mapsto Z(k)$\
  \ 给出的函数在 $N(k) < m$ 时产生特征空间的低维表征。](img/c11f013.jpg)\n\n**图 11.13** 一个 (2*k* − 1)隐藏层的“深度”自动编码器。首先，通过在\
  \ $Z^*^{((j* - 1))}$（其中 $Z^*^{((0))} = *X*$）上训练单隐藏层自动编码器，按顺序获得 *$j* = 1, \\dots,\
  \ *k*$ 的参数矩阵 $\\theta^{((*j*))}$ 和 $\\theta^{((2*k* - *j*))}$。将得到的参数作为初始状态，寻找参数矩阵\
  \ $\\theta^{((1))}, \\dots, \\theta^{((2*k*))}$ 以使得 $\\sum^{(n*)}[i* = 1]*d(*x[i]*,\
  \ *T*(*x[i]*))$ 最小化且无任何约束，其中 $d$ 是特征空间上给定的不相似性度量。<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
