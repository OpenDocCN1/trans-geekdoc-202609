  \ accent=\"true\"><mi mathvariant=\"normal\">P</mi><mo>^</mo></mover><mrow><mo>(</mo><mi>Y</mi><mo>=</mo><mi>d</mi><mo)</mo></mrow><mo><mo></1</mi>C</mrow><mover\
