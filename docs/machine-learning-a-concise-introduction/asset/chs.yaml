  \ `m` 的增加而迅速趋于零。\n\n\n\n\n\n根据对称性，如果 `X` 和 `Y` 是单位球或单位球面中的独立均匀分布点，那么 `X^T Y` 的分布与\
  \ `‖Y‖ X[1]` 的分布相同，即 `Y` 的长度乘以 `X` 的第一个坐标（即 `X` 与第一个标准基向量的点积）。因此，根据下文的练习 11.2、11.3\
  \ 和 11.4，如果 `X` 和 `Y` 在球体内独立且均匀分布，则：\n\n```\nE[X·Y] = 0 and Var [X·Y] = E[X1²]E[|Y|²]-E[X1]²\
  \ = 1/(m+2) * m/(m+2)\n```\n![images/c11_M0006.gif)\n\n并且如果 `X` 和 `Y` 在球面上独立且均匀分布，则：\n\
  \n```\nE[X·Y] = 0 and Var [Y] = 1/(m+1).\n```\n![images/c11_M0007.gif)从这个意义上说，以原点为中心的高维球或球面上几乎所有的向量与任何给定向量都几乎正交。**练习\
  \ 11.1** 确定 `m` 维球半径 `r` 的比例 `ρ`，使得 `ν` 的体积位于边界 `ρr` 范围内。**练习 11.2** 仅考虑单位球 `{x∈Rm\
  \ : x≤1}`![](img/c11_ILM012.gif) 中均匀随机点 `X` 的第一个坐标 `X[1]`。证明 `X[1]` 在点 `x[1]` ∈\
  \ [-1, 1] 处的密度正比于：\n\n```\nV(m-1, √(1-x1²)) · (1-x1²)^(m-1)/2.\n```\n![images/c11_M008.gif)\n\
  \n证明\n\n```\nE[X1] = 0 and Var [X1] = 1/(m+2).\n```\n![images/c11_M0009.gif)\n\n\
  证明 `X[1]` 的分布服从 `N·W^(1/2)`![](img/c11_ILM013.gif)，其中符号 `N` 在集合 {-1, 1} 上均匀分布：\n\
  \n```\nW  ~ Beta(1/2, (m+1)/2),\n```\n![images/c11_M0010.gif)且 `N` 和 `W` 独立。***提示：**\
  \ 方差可以通过分部积分法得到，但有一种更简单的方法。考虑分布函数 `P(X1²≤x)`![](img/c11_ILM0014.gif)对于 `x` ∈ [0,\
  \ 1]。\n\n\n\n\n\n## 练习 11.3\n\n考虑单位球面 $\\{x \\in \\mathbb{R}^m : |x| = 1\\}$ (images/c11_ILM0015.gif)\
  \ 中均匀分布随机点 `X` 的第一个坐标 `X[1]`。证明 `X[1]` 在点 $x[1] \\in [- 1, 1]$ 处的密度正比于：\n\n$$\n\
  S_{m-1}\\int_{0}^{\\sqrt{1-x_1²}} (1-x_1²)^{\\frac{m-2}{2}} dx.\n$$\n\n![numbered\
  \ Display Equation](img/c11_M0011.gif)\n\n证明：\n$$\nE[[X_1]] = 0 \\text{ and } Var[[X_1]]\
  \ = \\frac{1}{m+1}.\n$$\n![numbered Display Equation](img/c11_M0012.gif)\n\n证明 `X[1]`\
  \ 服从 $N W^{1/2}$ (images/c11_ILM0016.gif) 的分布，其中 `N` 均匀分布在集合 $\\{-1, 1\\}$ 上：\n\
  $$\nW \\sim \\text{Beta}(1/2, m/2).\n$$\n![numbered Display Equation](img/c11_M0013.gif)\n\
  \n且 `N` 和 `W` 是独立的。\n\n**提示：** 参考练习 11.2 的提示。注意 `X[1]` 既是 `X` 与第一个标准向量的点积，也是这些向量之间夹角的余弦值。\n\
  \n注意，根据对称性，练习 11.2 给出了单位球 $\\{x \\in \\mathbb{R}^m : |x| \\le 1\\}$ (images/c11_ILM0017.gif)\
  \ 中均匀分布的随机点与任意给定单位向量的点积分布（在练习中，球体经过旋转，使得给定的单位向量变为 $(1, 0, \\dots, 0)$）。同样，练习 11.3\
  \ 给出了单位球面 $\\{x \\in \\mathbb{R}^m : |x| = 1\\}$ (images/c11_ILM0018.gif) 中均匀分布的随机点与任意给定单位向量的点积分布。这两个分布都关于零对称（因此期望值为\
  \ 0），且它们的方差随着 $m \\to \\infty$ 趋于 0。因此，对于较大的 $m$，对于任何向量 `v`，从原点到球内或球面上均匀随机点的向量可能与\
  \ `v` 几乎正交。\n\n## 练习 11.4\n\n均匀分布在单位球内的随机点与球心之间距离的分布是什么？距离平方的分布是什么？\n\n## 练习 11.5\n\
  \n设 `X` 和 `Y` 是单位球内独立且均匀分布的变量。证明：\n$$\nE[[X, Y]] = 0 \\text{ and } \\lim_{m \\to\
  \ \\infty} Var[[X, Y]] = 0.\n$$\n![numbered Display Equation](img/c11_M0014.gif)\n\
  \n$$\n\\lim_{m \\to \\infty} E[[X-Y]²] = 2 \\text{ and } \\lim_{m \\to \\infty}\
  \ Var[[X-Y]²] = 0.\n$$\n![numbered Display Equation](img/c11_M0015.gif)\n\n\n\n\n\
  \n由于函数 $z \\to \\sqrt{z}$ 对于正数 $z$ 是连续的，可以得出：\n\n```\n\\lim_{m \\to \\infty} E[|X-Y|]\
  \ = \\sqrt{2} \\text{ and } \\lim_{m \\to \\infty} \\text{Var}[|X-Y|] = 0\n```\n\
  \n![numbered Display Equation](img/c11_M0016.gif) 这解释了为什么图 11.3 所示的分布随着 $m$ 的增大而集中在\
  \ $\\sqrt{2}$ 附近。\n\n**提示：** 使用关于 $\\|X\\|$、$\\|Y\\|$ 和 $X \\cdot Y$ 的已知事实 $\\|X-Y\\\
  |² = \\|X\\|² + \\|Y\\|² - 2X \\cdot Y$。\n\n**练习 11.6** 证明如果 $X$ 和 $Y$ 独立，且在单位球或单位球面的非负正形内均匀分布，则有\n\
  ```\nE[X \\cdot Y] \\to 0\n```\n当 $m \\to \\infty$。得出结论，对于球体和球面，$X$ 到 $Y$ 的期望平方距离趋近于\n\
  ```\n2(1 - 2/\\pi) \\to 0\n```\n当 $m \\to \\infty$。\n\n**提示：** 使用练习 11.2、11.3 和\
  \ 11.4。此外，关于 Gamma 函数的两个可能有用：\n```\n\\lim_{x \\to \\infty} \\frac{\\Gamma(x+1/2)}{\\\
  Gamma(x)\\sqrt{x}} = 1\n```\n且 $\\Gamma(1/2) = \\sqrt{\\pi}$。\n\n**练习 11.7** 设 $C$\
  \ 为 $m$ 维立方体，其顶点为 $(\\pm 1, \\pm 1, \\dots, \\pm 1)$。在 $2^m$ 个形式为 $(\\pm 1/2, \\\
  pm 1/2, \\dots, \\pm 1/2)$ 的点上各中心一个半径为 $1/2$ 的球。每个球在 $m$ 个点与立方体的表面相切，并与另外 $m$ 个球相切。设\
  \ $S$ 为位于原点中心并与所有 $2^m$ 个球相切的球。图中展示了球 $S$，这是 $m=2$ 的情况。确定 $S$ 的半径，并找到使得 $S$ 包含 $C$\
  \ 之外点的最小维 $m$。\n\n**练习 11.8** 两个 $m$ 维向量之间参数为 $p \\in (0, \\infty]$ 的闵可斯基距离（或 $l_p$\
  \ 距离）为：\n```\nd_p(x,y) = \\left(\\sum_{i=1}^m |x_i - y_i|^p\\right)^{1/p}\n```\n\
  当 $p < \\infty$ 时，\n```\nd_\\infty(x,y) = \\max_{i=1 \\dots m} |x_i - y_i|\n```\n\
  \n\n\n欧几里距离对应于 `p` = 2。距离 `d[1]` 被称为曼哈顿距离或坦克距离，而 `d[∞]` 被称为切比雪夫距离。证明当 `p` = ∞ 时，以\
  \ `c \\in R^m` 为中心、半径为 `r` 的“球”是一个立方体：\n\n```\n{x \\in R^m : |x_i - c_i| \\le r,\
  \ \\text{ for all } i = 1, \\dots, m}\n```\n![images/c11_ILM0028.gif)\n\n(该球的体积和表面积分别为\
  \ $(2r)^m$ 和 $2m(2r)^{m - 1}$)。证明当 `p` = 1 时，以 `c` 为中心、半径为 `r` 的“球”是交叉多顶点（正八面体的\
  \ $m$ 维泛化）：\n\n```\n{x \\in R^m : (x-c) \\cdot (\\pm 1, \\dots, \\pm 1) \\le r}\n\
  ```\n![images/c11_M0020.gif)\n\n(该球的体积和表面积分别为 $\\frac{1}{m!}(2r)^m$ 和 $\\frac{2}{(m-1)!}(2r)^{m-1}$)\
  \ (images/c11_ILM0030)。`l[p]` 中不同 `p` 值下的二维球面所示：\n\n11uf002.jpg\n\n**练习 11.9 开放式挑战。**\
  \ 如果将 `l[2]` 距离替换为 `l[1]` 或 `l[∞]` 距离，本节的观察结果会发生什么变化？\n\n## 11.2 示例\n\n在随后的文中，一些说明性的示例将很有帮助。与第\
  \ 4 章一样，我们在这里引入示例，并在章节的其余部分引用它们。\n\n### 11.2.1 示例 1：等边单纯形\n\n`simplex dataset` 由位于\
  \ $R^{64}$ 中的 650 个点 `x[1]` …, `x[650]` 组成（images/c11_ILM0031.gif），其构建方式如下：指定了一个边长为\
  \ 1 的等 64  维单纯形，并将其 65 个顶点标记为 `v[1]` …, `v[65]`。然后对于每个 `i \\in {1, \\dots, 650}`，从集合\
  \ `{1, \\dots, 65}` 中均匀随机抽取一个索引 `j`，并从均值为 `v[j]`、协方差矩阵等于缩小 $10^{-5}$ 倍的单位矩阵的高斯分布中抽取\
  \ `x[i]`。该数据集包含 65 个紧凑簇，它们彼此之间的距离大致相等，且大小相似（簇的大小在 4 到 19 个数据点之间变化）。在图中，数据点将根据其在\
  \ 65 个簇之一中的成员身份着色，由于数据生成的方式，这一点是已知的。\n\n第 11.3 节的方法将应用于此数据集的 64 维向量，或通过欧几里距离测量的向量间的差异性。该数据集对于降维来说是一个困难的案例，虽然它具有以紧凑簇形式的可识别结构，但这种结构并不是低维的。\n\
  \n### 11.2.2 示例 2：文本\n\n`text dataset` 取自本书本身。这本书可以分解为 130 个小文档：110 个带编号的章节、13 个章节引言（视为每章的“第\
  \ 0 节”）、第 1 章（没有章节）、四个附录（标记为 A 到 D）、一个前言（标记为 P，包括组织结构和感谢）以及一个参考文献（标记为 R）。这些每一个都包含在用排版语言编写的计算机文件中（images/c11_ILM0032.gif）。在图中，章节将按章节着色。\n\
  \n通过统计每个文件中术语的出现次数，为这 130 个文件每一个构建了一个特征向量。`character N-gram` 是任何 `N` 个连续字符的序列，包括空白字符。例如，该句子允许重叠的前十个五元语法\
  \ 单元为：\n\n```\n\"Fore \", \"orex\", \"rexa\", \"exam\", \"xamp\", \"ample\", \"\
  mple,\", \"ple,\", \"and \", \"le,t\"\n```\n\n\n\n符号“![](img/c11_ILM0035.gif)”代表一个单个空格字符。在这个示例中，`term`\
  \ 是任何五字母的词（five-gram），允许像上文那样发生重叠。本书包含 61,190 个不同的术语，其中最常见的六个术语按顺序分别为：“the![](img/c11_ILM0036.gif)”（出现\
  \ 6429 次）、“tion![](img/c11_ILM0038.gif)”（2876 次）、“![](img/c11_ILM0039.gif)and![](img/c11_ILM0040.gif)”（2145\
  \ 次）、“param”（1784 次）、“regre”（1706 次）以及“class”（1573 次）——术语 `param` 和 `regre` 高频部分是因为作者使用了\
  \ `macro \\regreparam` 来排版符号 `\\theta`。\n\n每个术语在每个文件中出现的次数被计入统计，从而生成一个长度为 61,190\
  \ 的 `term-frequency (TF)` 向量。术语频率向量可以被视为描述每个文件的数值特征向量。通常对该向量的坐标进行加权是有用的，以便让在大多数文件中出现的术语（例如，“the![](img/c11_ILM0042.gif)![](img/c11_ILM0043.gif)”出现在本书的所有\
  \ 130 个章节中，“and![](img/c11_ILM0044.gif)![](img/c11_ILM0045.gif)”出现在 126 个章节中）与出现在较少文件中的术语（例如，“eigen”仅出现在本书的五个章节中）的权重得到增强。实现这一点的方法一种是统计每个术语出现的章节数（由于术语是书中出现的精确\
  \ `N`-grams，因此每个术语至少出现在一个章节），并根据章节数的反比对每个术语加权。这通常在对数尺度上进行，因此与每个章节 `S` 关联的特征向量为：\n\
  \n```\ntf(t, S) = (number of term t in S) * log(total number of documents / number\
  \ of documents in which term t occurs)\n```\n\n![](img/c11_M0022.gif\n\n这就是与章节 `S`\
  \ 关联的 `term-frequency inverse-document-frequency (TF-IDF)` 向量。TF-IDF 向量通常会被缩放为单位向量。在许多应用中，术语集要远大于出现在任何特定文档中的术语集，在这种情况下，结果生成的\
  \ TF-IDF 向量的大部分坐标都等于零。\n\n令 `x[1]`、… `x[n]` 表示书中 `n=130` 个章节的 TF-IDF 向量。衡量这些向量之间相似性的常用方法是\
  \ `cosine similarity`，\n\n```\ns(w, x) = cos(w, x) = (w · x) / (|w| * |x|)\n```\n\
  \n![](img/c11_M0023.gif\n\n当向量 `w` 和 `x` 的所有坐标均为非负时（如 TF-IDF 向量所示），`s(w, x)` ∈ [0,\
  \ 1]。当两个 TF-IDF 向量的余弦相似度很大时，通常意味着某些相对罕见的术语在两个文档中都出现频繁。\n\n\n\n\n第 11.3 节\n\n**图\
  \ 11.5** 本书 130 个章节之间的两两差异性矩阵，是根据从 5-grams 计算的对应 TF-IDF 向量之间的余弦相似度衡量的。差异性以灰度阶表示，范围从零（黑色）到一（白色）。\n\
  \n## 11.3 在保留信息的同时降维\n\n本节介绍了各种寻找观测的 `m` 维特征向量集 $x_1, \\dots, x_n$ 的 `k` 维近似表示 $x_1,\
  \ \\dots, x_n$ 的方法，其中 `k < m`。人们可能想这样做有几个几个原因：因为并不是所有的 `m` 个特征都带有与给定问题相关的信息，且希望拥有更小、信息更丰富的特征空间；因为某些算法被认为在低维空间中运行具有更好的性能（更低的预测风险、更低的计算成本或两者兼顾）；或者为了对数据进行探索性可视化（在这种情况下，值\
  \ `k = 1`、`k = 2` 和 `k = 3` 特别重要）。\n\n每种方法都通过一组定义 `x[1], ..., ..., x[n]` “良好”低维表示的准则来区分，以及一种根据这些准则寻找最优（或近似最优）表示的方法。某些方法（主成分分析、线性多维缩放、投影追踪、自动编码器）构建了显式映射\
  \ $R^m \\to R^k$，这些映射可以应用于尚未观测到的数据，而其他方法（应力最小的多维缩放、流形学习、聚类）仅适用于给定的数据。某些方法（多维缩放、流形学习）仅依赖于特征向量之间的差异矩阵，因此可以推广到仅给定差异性的情况，在这种情况下，目标是在\
  \ $R^k$ 中寻找一组 `n` 个点，其点间的欧氏距离近似于给定的差异性。\n\n### 11.3.1 实特征的均值与协方差的几何\n\n当所有特征均为实数时，观测到的特征向量可以表示为\
  \ $n \\times m$ 矩阵的行（8）\n\n$$\nX = \\begin{bmatrix} x_{11} & x_{12} & \\dots & x_{1m}\
  \ \\\\ x_{21} & x_{22} & \\dots & x_{2m} \\\\ \\vdots & \\vdots & \\ddots & \\vdots\
  \ \\\\ x_{n1} & x_{n2} & \\dots & x_{nm} \\end{bmatrix} = \\begin{bmatrix} x_1 \\\
  \\ x_2 \\\\ \\vdots \\\\ x_n \\end{bmatrix}.\n$$\n\n![编号显示公式](img/c11_M0025.gif)\n\
  \n我们遵循将所有向量——包括特征向量 `x[1], ..., x[n]`——视为列向量的惯，尽管 `x[1], ..., x[n]` 被表示为 **X** 的行。有时将数据平移使得均值特征向量位于原点是方便的，而有时将数据旋转使得特征之间互不相关也是方便的。这可以通过对\
  \ **X** 进行矩阵运算来实现。\n\n\n\n\n\n令特征向量 `x[1]` …, `x[n]`（`X` 的行）的样本均值和样本协差矩阵分别表示为：\n\
  \n```\n\\bar{x} = \\frac{1}{n} \\sum_{i=1}^{n} x_i and S = \\frac{1}{n} \\sum_{i=1}^{n}\
  \ (x_i - \\bar{x})(x_i - \\bar{x})^T = \\frac{1}{n} X^T X - \\bar{x}\\bar{x}^T\n\
  ```\n![numbered Display Equation](img/c11_M026.gif)\n\n将数据平移至均值向量位于原点等同于从 `X` 的每一行减去\
  \ `\\bar{x}`，这种数据被称为*中心化*。一种方法是在左侧乘以 `n` × `n` 中心化矩阵 `H`：\n\n```\nH = I - \\frac{1}{n}\
  \ \\begin{bmatrix} 1 \\\\ 1 \\\\ \\vdots \\\\ 1 \\end{bmatrix} [1, \\dots, 1] =\
  \ \\begin{bmatrix} 1-1/n & -1/n & \\dots & -1/n \\\\ -1/n & 1-1/n & \\dots & -1/n\
  \ \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ -1/n & -1/n & \\dots & 1-1/n \\\
  end{bmatrix}\n```\n![numbered Display Equation](img/c11_M027.gif)\n\n以下练习说明，如果数据集由\
  \ `X` 的行表示，则中心化后的数据集由 `HX` 的行表示。\n\n**练习 11.10** 证明矩阵 `HX` 等于从 `X` 的每一行减去 `\\bar{x}`\
  \ 后。证明 `H² = H`。证明 `X` 和 `HX` 的样本协差矩阵为：\n\n```\nS = \\frac{1}{n} (HX)^T(HX) = \\\
  frac{1}{n} X^T HX\n```\n\n样本协差矩阵 `S` 是非负定的，因此它可以表示为：\n\n```\nS = Q\\Lambda Q^T\n\
  ```\n![numbered Display Equation](img/c11_M029.gif)\n\n\n\n\n其中 $\\Lambda = \\text{diag}(\\\
  lambda_1, \\lambda_2, \\dots, \\lambda_m)$ 和 $\\lambda[1] \\ge \\lambda[2] \\ge\
  \ \\dots \\ge \\lambda[m] \\ge 0$ 是按降序排列的 `S` 的特征值，且 `Q` 是一个 $m \\times m$ 正交矩阵，其列是对应的特征向量。通过在\
  \ `HX` 的右侧乘以 `Q` 可以对中心化数据进行旋转使得特征互不相关。经过平移使得均值特征向量位于原点，并经过旋转使得特征互不相关的特征向量被称为*中心化且去相关化的*（centered\
  \ and decorrelated）。\n\n#### 练习 11.11 证明 `HXQ` 的样本协方差矩阵是对角矩阵 $\\Lambda$。\n\n这一过程可以更进一步：$HXQ^{-1/2}$\
  \ 的行具有零样本均值且样本协方差矩阵等于单位矩阵。经过这种平移、旋转和缩放的特征向量被称为*球化了*（sphered）。\n\n### 11.3.2 主成分分析\n\
  \n*主成分分析（PCA）*的目标是找到将 $\\mathbb{R}^m$ 中 $n$ 个中心化数据点到 $\\mathbb{R}^k$（$k < m$）的线性投影，尽可能保留信息，其中信息通过方差来衡量。给定由\
  \ `HX` 的行表示的中心化数据集，寻求一个由 $m \\times k$ 矩阵 `W` = $[W[1], \\dots, W[k]]$ 表示的线性映射 $\\\
  mathbb{R}^m \\to \\mathbb{R}^k$，使得：\n\n1. 列 `W[1], \\dots, W[k]` 是相互正交的单位向量；\n2.\
  \ 对于所有单位向量 $z \\in \\mathbb{R}^m$，$SVar[HXW[1]] \\ge SVar[Hz]$，即 $W[1] = \\text{argmax}_{z\
  \ \\in \\mathbb{R}^m} SVar[Hzz]$；\n3. 对于 $j = 2, \\dots, k$，对于所有与 `W[1], \\dots,\
  \ W[j-1]` 互不相关的单位向量 $z \\in \\mathbb{R}^m$，$SVar[HXW[j]] \\ge SVar[Hz]$，即 $W[j]\
  \ = \\text{argmax}_{z \\in \\mathbb{R}^m} SVar[Hzz]$。\n\n\n\n其中 `SVar`· 和 `SCor`·\
  \ 分别代表样本方差和相关系数。通俗地说，`第一主成分 W[1]` 是 `R^m` 中的单位向量，指向数据方差最大的方向。`第二主成分` `W[2]` 是 `R^m`\
  \ 中的单位向量，其限制为与第一主成分正交，指向数据方差最大的方向。依此类推：`第 j 个主成分 W[j]` 是 `R^m` 中的单位向量，其限制为与前 `j\
  \ - 1` 个主成分都正交，指向数据方差最大的方向。`n` × `k` 矩阵 `HXW` 的行是 `n` 个特征向量（数据点）投影到它们前 `k` 个主成分上的。\n\
  \n**练习 11.12** 证明由取 `Q` 的前 `k` 列形成的 `m` × `k` 矩阵 `[Q[1], …, Q[k]]` 满足性质 (1)、(2)\
  \ 和 (3)，因此 `HXQ` 的前 `k` 列是 `x[1], …, x[n]` 投影到它们前 `k` 个主成分上的。\n\n练习 11.12 表明主成分分析等同于将数据集平到原点、旋转以消除特征的相关性，并取前\
  \ `k` 个去相关的特征。这意味着在计算上，将数据投影到前 `k` 个主成分等同于寻找协方差矩阵 `S` 的 `k` 个最大特征值及其对应的特征向量。这也意味着投影到第\
  \ `i` 个主成分上的数据方差为 `λ[i]`，即 `S` 的第 `i` 个最大特征值。将 PCA 应用于单纯形数据集以产生二维表示的结果如图 11.6 的左侧单元格所示。\n\
  \n`k` 的选择通常是启发式的，平衡了任何给定应用中对 `k` 较小的需求与保留数据信息需求之间的关系。将数据投影到其前 `k` 个主成分时保留的`总变异比例`定义为：\n\
  \n$$\n\\frac{\\sum_{i=1}^{k} \\lambda_i}{\\sum_{i=1}^{m} \\lambda_i} = 1\n$$\n\n\
  在 PCA 的背景下，**Q** 的 `Q[1], …, Q[k]` 被称为*载荷向量*。例如，你可能会发现第一主成分的大部分坐标相对于少数几个坐标。取决于应用，这种组合可能是意义的。\n\
  \n### 11.3 在“不相似空间”中工作\n\n`X` 上的`不相似度量`是一个函数 `d: X × X → R+`，使得对于所有 `x ∈ X` 都有 `d(x,\
  \ x) = 0`，且对于所有 `w, x ∈ X` 都有 `d(w, x) = d(x, w)`。值 `d(w, x)` 被解释为两个特征向量 `w` 和 `x`\
  \ 之间的不相似性。通常，`d(w, x)` 不需要满足三角不等，尽管 `R^m` 上常用的不相似度量通常满足，例如练习 11.8 中定义的度量族。为任何特定应用构建良好的不相似度量某种程度上是一种艺术：本章稍后部分将讨论某些特定的度量及其动机。^(12)\n\
  \n\n\n\n差异度量允许在不进一步考虑特征空间 $X$ 结构的情况下应用某些技术。例如，[第 9 章]中描述的层次聚类和 $k$-质类聚类算法，以及[第 4\
  \ 章]中描述的 $k$-最近邻和最近类分类器，只需不相似值矩阵即可应用：\n\n```\nD = [d(x_i, x_j)]i,j=1^n\n```\n\n\
  ### 11.3.4 线性多维尺度分析\n\n多维尺度分析（MDS）是一类从差异空间到真实特征空间 $\\mathbb{R}^k$ 转换的技术。假设存在对象 $o[1],\
  \ \\dots, o[n]$（这些对象可能也或不以某些特征空间中的向量表示），并且给出了对象两两之间的差异性矩阵：\n\n```\nD = [d(o_i, o_j)]i,j=1^n\n\
  ```\n\n在给定值 $k$ 的情况下，多维尺度分析试图构建一组 $n$ 个点 $\\hat{x}_1, \\dots, \\hat{x}_n \\in \\\
  mathbb{R}^k$，其性质使得这些点之间的欧几里得距离矩阵：\n\n```\nD = [d(\\hat{x}_i, \\hat{x}_j)²]i,j=1^n\n\
  ```\n\n在某种用户指定的意义上接近差异矩阵 $D$。然后，这些点 $\\hat{x}_1, \\dots, \\hat{x}_n$ 被用作对象 $o[1],\
  \ \\dots, o[n]$ 的代理，且 $\\hat{x}_i$ 的坐标被解释为对象的潜在特征。本节介绍了原始的线性多维尺度分析算法。[第 11.3.6 节]中介绍了另一种方法。\n\
  \n我们从定义的几何动机开始考虑。假设差异矩阵 $D$ 实际上是作为 $\\mathbb{R}^m$ 中点两两之间的欧几里得距离矩阵而产生的：即，假设对象 $o[1],\
  \ \\dots, o[n]$ 对应于点 $x_1, \\dots, x_n \\in \\mathbb{R}^m$，且对于所有的 $i$ 和 $j$，都有 $D[i,\
  \ j] = d(o[i], o[j]) = d2$。那么对于所有的 $i$ 和 $j$：\n\n```\nD_{i,j}² = d(o_i, o_j)² =\
  \ (x_i - x_j)^T(x_i - x_j) = x_i^T x_i + x_j^T x_j - 2x_i^T x_j\n```\n\n\n\n\n这意味着距离矩阵\
  \ `D` 可以从内积矩阵 `[x^T[i]x[j]]^(n)[i, j = 1]` 获得。由于点 `x[1]`, …, `x[n]` 之间的距离具有平移不变性，`D`\
  \ 也可以通过 `x[i]` 经过中心化处理后的内积矩阵获得。因此，`D` 可以从矩阵获得：\n\n```math\nB = [(x_i - x_cdot)(x_j\
  \ - x_cdot)^T]_{i,j=1}^n = HX(HX)^T.\n```\n\n![images/c11_M0037.gif)\n\n此外，内积矩阵\
  \ `B`可以直接从距离矩阵获得。\n\n**练习 11.13** 证明在上述公式中，`B = HAH`，其中：\n\n```math\nA = -1/2 d(x_i,\
  \ x_j)²_{i,j=1}^n\n```\n\n![images/c11_M0038.gif)\n\n且 `H` 是中心化矩阵。\n\n这一观察引出了一个通用的定义。给定任意一个差异矩阵\
  \ `D = [d(o[i], o[j])^(n)[i, j = 1]`（而不是欧几里得距离矩阵），通过以下方式定义矩阵 `A` 和 `B`：\n\n```math\n\
  A = -1/2 d(o_i, o_j)²_{i,j=1}^n and B = HAH.\n```\n\n![images/c11_M0039.gif)\n\n\
  **定理 1.1 欧距离性质（Young and Householder）。** `D` 是欧几里得空间中一组点两两间距离的充分必要条件是矩阵 `B`是非负的，在这种情况下，除刚性运动外，该点集是唯一的。\n\
  \n线性多维缩放（Linear MDS）是将矩阵 `B` 视为 `R^k` 中 `n` 个点的内积矩阵（对于某个值 `k`）得到的结果。由于 `B` 是实对称矩阵，它具有特征值分解：\n\
  \n```math\nB = QQ^T,\n```\n\n![images/c11_M0040.gif)\n\n其中 `λ = diag(λ[1], λ[2],\
  \ ..., λ[m])` 且 `λ[1] ≥ λ[2] ≥ ... ≥ λ[m]` 是按非递减排序的 `B` 的特征值。某些特征值可能是负数：事实上，根据定理\
  \ 11.1，除非 `D` 是欧几里得距离的，否则至少有一个特征值必须是负的。如果正特征值少于 `k` 个，线性 MDS 无法构建 `k` 维的实现。如果至少有\
  \ `k` 个正特征值，线性 MDS 就可以构建 `k` 维实现：它由 `n × k` 矩阵的行组成：\n\n```math\nX^ = [Q_1, ...,\
  \ Q_k]^T diag(λ[1]/2, ..., λ[k]/2).\n```\n\n![images/c11_M0041.gif)\n\n\n\n\n总变异比例\
  \ (11.1) 的两种推广形式，两者都被解释为由 `k` 维表示所“解释的差异相似性矩阵比例”（Mardia et al., 1979)：\n\n```\n\\\
  frac{\\sum_{i=1}^{k} |\\lambda_i|}{\\sum_{i=1}^{m} |\\lambda_i|}\n```\n\n(11.2)\n\
  \n以及\n\n```\n\\frac{\\sum_{i=1}^{k} \\lambda_i²}{\\sum_{i=1}^{m} \\lambda_i²}\n\
  ```\n\n我们将在随后的示例中使用 (11.2)。\n\n当线性 MDS 返回的 `k` 维数据集存在时，它在两个准则下都是优的，这两个准则通过 $X$ 的行之间的两对欧几里得距离矩阵表示：\n\
  \n```\n\\mathbf{D} = [d_2(\\hat{x}_i, \\hat{x}_j)]_{i,j=1}^n\n```\n\n以及相应的内积矩阵：\n\
  \n```\n\\mathbf{B}^T = \\mathbf{H}(\\mathbf{H}\\mathbf{X})^T = \\mathbf{H} - \\\
  frac{1}{2}[d_2²(\\hat{x}_i, \\hat{x}_j)]_{i,j=1}^n\\mathbf{H}\n```\n\n最优性准则是以关于\
  \ Frobenius 范数（Frobenius norm）的距离表述的。`n` $\\times$ `m` 实数矩阵 `M` 的 Frobenius 范数是其视为长度为\
  \ `nm` 的向量时的欧几里得长度：\n\n```\n\\|\\mathbf{M}\\|_F = \\left(\\sum_{i=1}^n \\sum_{j=1}^m\
  \ M_{ij}²\\right)^{1/2}\n```\n\n### 线性 MDS 的约束最优准则\n\n**定理 11.2 线性 MDS 的约束最优准则。**\
  \ *如果差异矩阵 `D` 是 `X` 的行之间的欧几里得距离矩阵，则线性 MDS 实现在所有通过 `X` 投影到 $\\mathbb{R}^k$ 得到的 `n`\
  \ 点配置中，最小化了 $\\|\\mathbf{D} - \\hat{\\mathbf{D}}\\|_F$。*\n\n**定理 11.3 线性 MDS 的全局最优准则。**\
  \ *线性 MDS 实现在所有 $\\mathbb{R}^k$ 中的 `n` 点配置中，最小化了 $\\|\\mathbf{B} - \\hat{\\mathbf{B}}\\\
  |_F$。*\n\n\n\n\n\n注意在定理 11.3 中，矩阵 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c11\\_ILM0091.gif\"><mover accent=\"true\"><mi mathvariant=\"\
  bold\">B</mi><mo>^</mo></mover></math>`![](img/c11_ILM0091.gif`)-是一个内积矩阵，但矩阵 `B`\
  \ 不定是（因为矩阵 `D` 不定是某些点集之间的欧几里得距离矩阵）。\n\n![图 11.6 应用于单纯形数据集（左侧单元格）和第 11.2 节带有 TF-IDF\
  \ 的文本数据集（右侧单元格）的线性多尺度缩放（MDS）。在单纯形数据集中，线性 MDS（在这种情况下等同于 PCA）已在第一主轴（水平）上将大小为 19 的单个最大簇从其余数据中分离出来。它在第二主轴（垂直）上将两个大小均为\
  \ 16 的第二大簇从彼此以及其余数据中分离出来。线性 MDS 保留了这三个簇之间相互等距的事实，代价是将其他 62 个簇折叠在一起。单纯形数据的二维线性 MDS\
  \ 表征保留了 5.4% 的总变异（11.1）。在文本数据集中，线性 MDS 在第一主轴（水平）上将第 3 章（回归）的大部分以及第 4 章（逻辑回归、神经网络和支持向量机）、第\
  \ 10 章（拟牛顿法、一般性和 EM 算法）以及第 11 章（模型正则化）的部分从书的其他部分分离出来。它在第二主轴（垂直）上将第 14 章（R 代码）的大部分从书的其他部分分离出来。文本数据的二维线性\
  \ MDS 表征保留了 10.3% 的不相似性矩阵（11.2）。](img/c11f006.jpg`)\n\n**图 11.6** 应用于单纯形数据集（左侧单元格）和第\
  \ 11.2 节带有 TF-IDF 的文本数据集（右侧单元格）的线性多尺度缩放（MDS）。在单纯形数据集中，线性 MDS（在这种情况下等同于 PCA）已在第一主轴（水平）上将大小为\
  \ 19 的单个最大簇从其余数据中分离出来。它在第二主轴（垂直）上将两个大小均为 16 的第二大簇从彼此以及其余数据中分离出来。线性 MDS 保留了这三个簇之间相互等距的事实，代价是将其他\
  \ 62 个簇折叠在一起。单纯形数据的二维线性 MDS 表征保留了 5.4% 的总变异（11.1）。在文本数据集中，线性 MDS 在第一主轴（水平）上将第 3\
  \ 章* 定义为：\n\n```\nM = U Σ V^T\n```\n\n![numbered Display Equation](img/c11_M047.gif`)\n\
  \n其中 `U` 是一个 *n* × *n* 正交矩阵，`V` 是一个 *m* × *m* 正交矩阵，且 `<math xmlns:wiley=\"http://www.wiley.com/namespaces/wiley/wiley\"\
  \ xmlns:cms=\"http://cms.wiley.com\" xmlns:dctm=\"http://www.documentum.com\" display=\"\
  inline\" location=\"image\\_n/c11\\_ILM0093.gif\"><mrow><mi mathvariant=\"bold-italic\"\
  >&#x0a3</mi></mrow></math>`![](img/c11_ILM0093.gif`)-是一个 *n* × *m* 对角矩阵，其对角线元素 σ[1]\
  \ geqslant σ[2] geqslant ⋅⋅⋅ geqslant σ[min (*n*, *m*)] geqslant 0。`<math xmlns:wiley=\"\
  http://www.wiley.com/namespaces/wiley/wiley\" xmlns:cms=\"http://cms.wiley.com\"\
  \ xmlns:dctm=\"http://www.documentum.com\" display=\"inline\" location=\"image\\\
  _n/c11\\_ILM0094.gif\"><mrow><mi mathvariant=\"bold-italic\">&#x0a3</mi></mrow></math>`![](img/c11_ILM0094.gif`)\
  \ 的对角线元素是矩阵 `M` 的*奇异值*，`U` 的列是 `M` 的*左奇异向量*，`V` 的列（`V`^T 的行）是 `M` 的*右奇异向量*。\n\n\
  **定理 11.4 SVD 的存在性。***每个实矩阵都有奇异值分解。*\n\n可以使用 SVD 构建低秩近似，这些近似在 Frobenius 范数的距离意义上是最优的。\n\
  \nSVD 优性准则。\n\n\n\n\n\n### 定理 11.5 SVD 的最优性准则 (Eckhart-Young)。\n\n设 `M` 为 $n \\\
  times m$ 矩阵，其奇异值分解为 $M = U\\Sigma V^T$，且 $k \\le \\text{rank}(M)$。在所有秩为 $k$ 的 $n\
  \ \\times m$ 矩阵 `Z` 中，使得 $\\|M - Z\\|_F$ 最小的矩阵为：\n\n```\nZ = [U_1, \\dots, U_k]\
  \ \\text{diag}(\\sigma_1, \\dots, \\sigma_k) [V_1, \\dots, V_k]^T\n```\n\n其中 $U_1,\
  \ \\dots, U_k$ 是 `U` 的前 $k$ 列，$V_1, \\dots, V_k$ 是 `V` 的前 $k$ 列，中间的矩阵为 $\\text{diag}(\\\
  sigma_1, \\dots, \\sigma_k)$。当 $\\sigma_k > \\sigma_{k+1}$ 时，最优矩阵 `Z` 是唯一的。\n\n\
  对于任意矩阵 `M`，可以通过 `M` 的奇异值分解得到 $MM^T$ 和 $M^TM$ 的特征值分解：\n\n```\nMM^T = U\\Sigma² U^T\n\
  M^TM = V\\Sigma² V^T\n```\n\n它们分别为对应矩阵的特征值分解。特别，$MM^T$ 的特征值为 $\\sigma_1² \\ge \\\
  sigma_2² \\ge \\dots \\ge \\sigma_{\\min(n,m)}² \\ge 0$，如果 $n > m$，则额外包含 $n-m$ 个零特征值；$M^TM$\
  \ 的特征值为 $\\sigma_1² \\ge \\sigma_2² \\ge \\dots \\ge \\sigma_{\\min(n,m)}² \\ge\
  \ 0$，如果 $m > n$，则额外包含 $m-n$ 个零特征值。\n\n---\n\n**练习 11.14**\n\n设 `X` 为 $n \\times\
  \ m$ 矩阵，其行表示 $\\mathbb{R}^m$ 中的 $n$ 个特征向量。设 `HX` 为中心化后的特征向量矩阵，且 $HX = U\\Sigma V^T$\
  \ 为 `HX` 的奇异值分解。\n\n1.  证明 `HX` 在其前 $k$ 个主成分方向上的投影是 `HXV` 的前 $k$ 列。\n\n2.  证明线性多维尺度分析构建了\
  \ $U\\Sigma$ 的前 $k$ 列。\n\n3.  证明这两者是等价的。\n\n\n\n\n\n另一种处理多维缩放的方法是通过优化问题的近似数值解。给定一组点集配置\
  \ $x_1, \\dots, x_n \\in \\mathbb{R}^k$，令\n\n$$\nD = \\left[ d²(x_i, x_j) \\right]_{i,j=1}^n\n\
  $$\n\n为点间的欧几里得距离矩阵。\n\n给定一个目标差异性矩阵 $D$，$\\hat{D}$ 与 $D$ 的接近程度由目标函数来衡量，在本文背景下，该函数被称为*应力函数*（stress\
  \ function）：例如，从 $\\hat{D}$ 到 $D$ 的 Frobenius 距离 $\\|D - \\hat{D}\\|_F$。从点集的初始配置开始，可以使用第\
  \ 10 章中的优化算法来找到在最小化 $\\hat{D}$ 与 $D$ 之间应力意义上的近似最优配置。最小化应力的 MDS 有许多变体：点间距离不需要是非得是欧几里得的，且应力函数也不需要是\
  \ Frobenius 距离。\n\n![图 11.7 应用于第 11.2 节单纯形数据集（左单元）和文本数据集（右单元）的最小化应力 MDS。在单纯形数据集中，最小化应力的\
  \ MDS 已将所有 65 个类相互分离，并使 8 个类破碎（类碎片之间由灰色线段连接）。在文本数据集中，最小化应力的 MDS 将大部分章节保留在一起，例外是第\
  \ 4 章（分类）、第 6 章（集成）、第 8 章（一致性）和第 12 章（通信），这些章节较为分散。](img/c11f007.jpg)\n\n**图 11.7**\
  \ 应用于第 11.2 节单纯形数据集（左单元）和文本数据集（右单元）的最小化应力 MDS。在单纯形数据集中，最小化应力的 MDS 已将所有 65 个类相互分离，并使\
  \ 8 个类破碎（类碎片由灰色线段连接）。在文本数据集中，最小化应力的 MDS 将大部分章节保留在一起，例外是第 4 章（分类）、第 6 章（集成）、第 8 章（一致性）和第\
  \ 12 章（通信），这些章节较为分散。\n\n给定一个高维数据集 $x_1, \\dots, x_n \\in \\mathbb{R}^m$，其点间距离接近\
  \ $x[1], \\dots, x[n]$ 点间距离的 $\\mathbb{R}^k$ 点配置可以通过最小化应力的 MDS 和 PCA（或线性 MDS，在这种情况下二者是相同的）找到。这两种方法的一个区别在于，PCA\
  \ 构建了一个从 $\\mathbb{R}^m$ 到 $\\mathbb{R}^k$ 的函数，而最小化应力的 MDS 则没有。这样做的结果是，新数据 $x[n+1],\
  \ \\dots$可以通过 `PCA` 找到的函数映射到 $k$ 维实现中，而这通过最小化应力的 MDS 是实现的。因此，在两种方法之间进行选择的一个标准是：应用是否需要将尚未观测的数据映射到观测数据的现有低维实现上。应用最小化应力的\
  \ MDS 寻找单纯形和文本数据集的二维实现的结果所示图 11.7。\n\n### 11.3.7 投影追逐\n\n主成分分析找到 $\\mathbb{R}^m$\
  \ 中 $n$ 个数据点到 $\\mathbb{R}^k$（$k < m$）的线性投影，该投影对于第 11.3.2 节中列出的(1),(2),(3)标准是最优的，该最优值的计算通过计算中心化数据矩阵\
  \ `HX` 的奇异值分解来实现。作为替代方案，可以保留线性投影的思想，但将 (1),(2),(3) 替换为任何一组标准，并使用第 10 章中的方法来根据给定标准寻找数据集的最佳表示。此类方法被称为*投影追逐*（projection\
