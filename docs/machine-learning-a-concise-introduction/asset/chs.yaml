  \n![带编号显示公式](img/c04_M0019.gif)\n\n并且新数据点 *X* 的分类以最小化估计的后验风险。\n\n\n\n\n假设对于每个类 `c`，似然函数\
  \ `P(x | Y = c)` 是高斯密度（为了使用这种方法，所有特征必须是实数，因此 $X = \\mathbb{R}^m$）![](img/c04_ILM0024.gif)),\n\
  \n```\nP(x | Y = c) = φ(x | \\mu_c, \\Sigma_c) = |2\\pi\\Sigma_c|^{-1/2} \\exp(-\\\
  frac{1}{2}(x-\\mu_c)^T \\Sigma_c^{-1} (x-\\mu_c))\n```\n\n第 `c` 个密度由均值 `\\mu[c]`\
  \ 和协方差矩阵 `\\Sigma[c]` 决定，训练密度等同于估计这些参数，例如通过极大似然估计：\n\n```\nargmax_{μ_1, Σ_1, ...,\
  \ μ_C, Σ_C} (μ_1, Σ_1, ..., μ_C, Σ_C) = argmax_{μ_1, Σ_1, ..., μ_C, Σ_C} (μ_1, Σ_1,\
  \ ..., μ_C, Σ_C) \\sum_{i=1}^n P(x_i | Y = y_i) = argmax{μ_1, Σ_1, ..., μ_C, Σ_C}\
  \ (μ_1, Σ_1, ..., μ_C, Σ_C) \\sum_{c=1}^C \\sum_{i:y_i=c}^n P(x_i | Y = c)\n```\n\
  \n(4.5)![images/c04_M0021.gif 该分类器的命名源于其所产生的估计类边界（将特征空间划分为同类预测类区域的表面）是分段二次曲。图 4.3\
  \ 展示了基于图 4.1 数据训练的二次判别分析（Quadratic Discriminant Analysis）所得的估计密度 `P(x | Y = c)`![](img/c04_ILM0025.gif)以及类别预测。\n\
  \n![图 4.3 基于图 4.1 数据训练的二次判别分析得出的估计类密度（左）和分类决策（右）。估计的类边界是分段二次的。估计均值由黑点表示，估计密度内部包含\
