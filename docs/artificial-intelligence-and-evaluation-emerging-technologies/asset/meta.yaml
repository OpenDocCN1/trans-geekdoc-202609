  - 自然语言处理 (NLP) 和生成式 AI
- - '#'
  - NLP 是一项机器技术，赋予计算机解读、处理和理解人类语言的能力。生成式 AI 是指一类人工智能（AI）算法，它们基于训练数据生成新的输出。在语言领域（而非图像领域），NLP
    提供了一种处理大量文本（人类无法以时间高效的方式完成）的方法，随后利用生成式 AI 对文档集（或语料库）进行查询。
