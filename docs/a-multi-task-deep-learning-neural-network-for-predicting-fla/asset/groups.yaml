    successfully employed to correlate a new multi-task model for the simultaneous
    prediction of four flammability-related properties with a good accuracy. Compared
    with the multi-task learning technique of PLS, the proposed MDNN does not require
    that each molecule in the training set have a complete set of properties. Thus,
    the proposed MDNN can be applied on more samples and provides more accurate prediction.
    The proposed method can solve challenges in the descriptor-based QSPR modelling,
    e.g., the development of a suitable descriptor for property correlation, the selection
    of descriptor and correlation analysis. As MDNN employs 2D structures (SMILES)
    rather than 3D, it is much easier to do massive screening of previously-unknown
    compounds without having to do 3D structural determination or prediction before
    property prediction. To avoid the risks of using the deep learning model, the
    outlier identification and AD determination were introduced into the evaluation
    of MDNN models. The residual ECDF was employed to identify these outliers. This
    study illustrates that it is feasible to observe the position of outliers in the
    latent chemical space with AD analysis based on PCA and the calculation of convex
    hulls. The results suggest that the ADs became narrower after outliers were excluded
    from training and validation sets. It can be also found that some compounds included
    in test sets appear outside the ADs. The exclusion of outliers could not necessarily
    improve the prediction ability of MDNN. The proposed method can identify whether
    the properties of a compound are estimated inside or outside the ADs of a deep
    learning model. Our strategy can open new avenues for modelling QSPRs with multiple-property
    outputs using the multi-task deep learning. This can be used as a promising tool
    for the data-driven virtual screening of green chemicals.


