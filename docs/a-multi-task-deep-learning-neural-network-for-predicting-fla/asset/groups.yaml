    ### 2.1 网络架构


    如上所述，Tree-LSTM 网络用作自编码器，以提取分子结构对所有性质的整体特征。相比之下，几个 FNNs 的工作方式类似于过滤器，仅捕获每个性质的相关特征。在此，使用了四个
    FNNs 来关联/输出四种可燃性相关性质，并共享一个 Tree-LSTM 网络作为分子结构的编码器。


    ![](img/ad669faf9aa9b269abc88758f2d39753_2_0.png)


    ### 2.1.1 The extraction block of molecular features.


    ### 2.1.1 分子特征提取模块。


    由于 Tree-LSTM 网络可以遍历 DAG 中的所有顶点并模仿 DAG 的拓扑图，起点是分子结构应转换为 DAG 形式。虽然 DAGs 可以按照某些规则47
    进行规范化，但得到的规范化方向在所有可能方向中仍可能相当任意。39 因此，在本研究中，每个 DAG 都是从每个方向生成的（即，从所有可能的根原子遍历）并然后分别由
    Tree-LSTM 网络向量化。整个工作流程由化学物质 2,4,6-三氯甲苯 (Fig. 2) 展示和举例说明。


    在 DAGs 的原始格式中，每条边都不对应分子的化学键，每个顶点仅与每个原子符号相关联。例如，两个原子之间的双键无法在原始 DAG 中记录，这也违背了 DAGs
    的定义。为了记录分子的所有键，对原始 DAG 样式进行了修改，即，键类型附加在 DAG 子顶点的相邻原子符号上（见图 2 的第三步）。由于 Tree-LSTM
    网络仅接受向量作为每个单元的输入，该单元映射到 DAG 的每个顶点。因此，表示顶点的字符串（即图 2 第三步中所示的 “[c]”、“[c]”、“[Cl]”、“[C]”
    和 “[c0]”）应转换为向量（即图 2 第四步中所示的 v1–v5）。采用了词嵌入模型 skip-gram48 将这些字符串编码为向量。


    值得注意的是，Tree-LSTM 网络可以被视为一种动态计算图，具有对各种分子结构的自适应能力。对于与 Tree-LSTM 网络计算图对应的每个 DAG（见图
