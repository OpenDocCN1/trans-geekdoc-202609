  - '[PAGE 2]


    and with less manual work. As the powerful capabilities of DNNs on extracting
    features, deep learning techniques can formulate QSPRs/QSARs from visual representations
    of molecular structures, e.g., images learned by convolutional neural network
    (CNN),37 texts learned by recurrent neural network (RNN)38 and graphs learned
    by graph neural networks (GAN).35,39,40 Even though deep learning provides a way
    to reduce the dependency of QSPRs/QSARs on molecular descriptors,41 the powerful
    ability could easily make DNNs over-fitted on small data sets. The reason is that
    DNNs are often formed in the sophisticated architectures involving a very large
    number of parameters.


    Generally, the best way is to train a QSPR/QSAR model based on deep learning using
    a larger number of samples. Although the prediction models10,27,28 of flammability-related
    properties performed well, they were trained on more data points including estimated
    values. In fact, the experimental data sets of four flammability-related properties
    are available with small sizes in DIPPR801 database according to previous studies.3
    We noticed that multi-task learning (MTL) is a type of transfer learning that
    can gain relevant knowledge among multiple tasks for modelling on a small data
    set, even though the relevant knowledge among these tasks may be tenuous and unnoticeable
    to humans.42 Caruana43 studied many technical details in this field and summarized
    the improvements over single task learning (STL) obtained by MTL: (a) amplification
    of used data; (b) attention focusing; (c) representation bias and feature selection;
    and (d) regularization against overfitting. Hence, MTL was used to tackle data
    deficiencies or improve prediction performance for modelling QSARs/QSPRs based
    on molecular descriptors, e.g., ANN with a multiple output layer44 and multi-task
    partial least squares (PLS).45 It should be mentioned that the multi-task PLS
    requires that every molecule in the training set have a complete set of properties.
    If a particular row of employed data sets has a null value of a feature or a target
    property, the row corresponding to a compound cannot be utilized in the training
    of multi-task PLS models.


    In this research, an architecture of multi-task deep learning neural networks
    (MDNN) is proposed to establish the predictive model for flammability-related
    properties. Molecular structures are transformed into directed acyclic graphs
    (DAGs) by a program developed in this work, and the DAGs are vectorized by two
    techniques, word embedding and a tree structured long short-term memory46 (Tree-LSTM)
    network. Importantly, unlike previous models46, there is no need to extract corresponding
    features of molecular structures through pre-defined descriptors. The proposed
    MDNN can extract molecular features related to a unique property and may capture
    some possible interactions among multiple properties using two training strategies,
    i.e., joint training and alternative training. The procedures involving outlier
    detection and AD analysis are also proposed to assess the predictive model based
    on multi-task deep learning. All of these are aimed at developing an automatic
    tool of multi-task QSPR modelling that can simultaneously correlate diverse target
    properties in one deep learn-


    ing model without descriptor selections, and fully utilize limited experimental
    datasets. Another technique of multi-task learning, PLS regression, is taken as
    a baseline of comparison to highlight better performance and scalable data-handling
    capacity of the proposed MDNN.


    # 2. Methodology


    The entire architecture of MDNN is first introduced which involves two types of
    modules (see Fig. 1): (1) an encoder based on the Tree-LSTM network46 that can
    vectorize the molecular structures depicted in DAG, as well as capture all relevant
    features and commonality for all tasks; (2) multiple feedforward neural networks
    (FNNs) are assigned for extracting task-specific features (learning personality
    of each task) and outputting each property respectively. Afterwards, the implementation
    and modelling of MDNN are detailed. In the data preparation, SMILES expressions
    were converted to DAGs using our program based on Faulon''s algorithm47 in advance.
    Each vertex of a DAG was labelled in a string involving symbols of atoms and chemical
    bonds, and the strings were mapped to vectors with the algorithm of word embedding.48
    The procedure had been proposed to transform molecular structures in the previous
    work.40 Herein, joint training and alternative training were both employed especially
    for the multi-task deep learning. The obtained model was finally tested on an
    external test set to validate the extrapolating ability. Empirical cumulative
    distribution functions (ECDF) of prediction residuals were employed to detect
    outliers. The ECDF is a step function that increases by 1/n in every data point.
    An approach based on principal component analysis (PCA) was proposed to explore
    applicability domains of the obtained model.


