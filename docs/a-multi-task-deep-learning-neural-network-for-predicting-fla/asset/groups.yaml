    UFL. Another two compounds involving N-methyl-2-pyrrolidone and morpholine in
    the family of polyfunctional C, H, O, N were predicted with the high relative
    errors for UFL. In short, the MDNN model could show more prediction errors in
    polyfunctional molecules.


