    ## 从分子结构预测可燃性相关性质的多任务深度学习神经网络†


    Ao Yang, Yang Su, Zihao Wang, Saimeng Jin, Jingzheng Ren, Xiangping Zhang, Weifeng
    Shen and James H. Clark


    - a 重庆大学化学化工学院，中国重庆 400044。电子邮箱: shenweifeng@cqu.edu.cn

    - b 香港理工大学工业与系统工程系，中国香港特别行政区

    - c 重庆科技大学智能技术与工程学院，中国重庆 401331

    - d 中国科学院过程工程研究所，离子液体洁净工艺北京重点实验室，绿色过程与工程中科院重点实验室，中国北京 100190

    - e 英国约克大学绿色化学卓越中心，约克 YO10 5D

    † 提供电子补充信息 (ESI)。参见 DOI: 10.1039/d1gc00331c

    ‡ 这些作者对该工作做出了同等贡献。


    评估包括禁用或限制产品替代品在内的化学品危险特性，在产品和工艺设计的早期阶段具有重要意义。本工作提出了一种基于多任务深度学习的定量结构–性质关系建模新策略，用于同时预测四种可燃性相关性质，包括可燃极限下限和上限、自燃点温度和闪点温度。已开发了一种多任务深度神经网络
    (MDNN)，用于自动提取分子特征，并通过将 Tree-LSTM 神经网络与多个前馈神经网络相结合来关联多种性质。分子特征编码在分子树图中，无需用户手动操作或预先计算分子描述符即可计算和提取。采用了两种方法（联合训练和交替训练）来训练所提出的
    MDNN，该网络可以捕捉多个目标性质之间的相关信息和共性。异常值检测和适用域的确定也被引入深度学习模型的评估中。由于所提出的 MDNN 利用数据更高效，最终获得的模型在预测可燃性相关性质方面优于多任务偏最小二乘模型。所提出的多任务深度学习框架提供了一种无需计算描述符即可预测多种性质的有前景的工具。


    ## 1. 引言


    在过去几十年中，随着化学品产量的增长，处理危险物质所伴随的潜在风险一直受到工业界、政府和公众的高度关注。虽然大多数地区现在对（危险）化学物质的生产和处理进行严格控制，但影响化学品本身的立法才刚刚变得至关重要。欧洲化学品注册、评估、许可和限制
    (REACH) 条例的出台，以及中国、日本和韩国等其他地区类似的化学品专项立法，正迫使工业界评估所有工业化学品的危害。未被证明足够安全的化学品将被禁止或严格控制使用。许多广泛使用的化学品（包括一些最重要的工艺溶剂）已以这种方式分类，不可接受化学品的清单正在迅速增加。评估涉及禁用或限制产品替代品的化学品的危险特性，在产品和工艺设计的早期阶段非常重要。


    在《全球化学品分类和标签协调制度》(GHS) 中，使用闪点温度 (FPT)、自燃温度 (AIT)、上可燃极限和下可燃极限 (UFL/LFL) 四种性质采用类似类别对化学品进行分类。1
    FPT 性质通常用于在 REACH 立法中评估有机液体的可燃风险。AIT 对于工厂和设备防爆（即欧洲 ATEX）中的温度类别划分非常重要，可用于评估物质可能自燃的情况。UFL
    和 LFL 通常被视为物质燃烧或被点燃的难易程度。许多标准和规范中常使用这四种性质来估计物质起火的可能性。


    然而，通过在授权实验室对所有关键风险参数进行实验评估，从许多可能的化合物中筛选出更安全的危险化学品候选物非常耗时。许多人认为，这对企业开发新的更安全化学品以替代被
    REACH 及相关评估判定不佳的危险化合物是一种重大消极因素。GHS 规则还规定，如果无法使用任何性质的实验值来评估化学品的危害等级，则可以使用数学模型（如定量结构–活性/性质关系
    (QSAR/QSPR)）来预测单个分子的这些性质。这些预测模型至少在初步评估阶段能加速工艺开发，从而使在筛选低成本替代品时能够早期做出 go/no-go 决策。在这之中，以前的
    QSPR 模型可以通过利用分子结构的一些信息（例如，特定分子团的出现次数、2、3、6 种分子描述符和性质）来估计性质。5–7 涉及 AIT、FPT、UFL
    和 LFL 的物理化学性质的大部分现有研究已由 Nieto-Draghi 等人 8 和 Jiao 等人 9 综述。本文中，表 1 举例说明了一些利用分子结构的各种特征预测这四种性质的现有模型。


    许多研究应用基团贡献法和多元线性回归 (MLR) 来预测可燃性相关性质，其他模型则采用分子结构的各种数值描述符构建。除了线性模型外，还采用了非线性回归 (NLR)
    来关联更灵活的模型。随机优化也被用于构建预测模型，例如 Garagheizi 等人 10,11、Pan 等人 12 和 Lazzús 13 进行全局优化关联。基于
    MLR 和 NLR 的现有研究建议，应使用异常值检测、适用域 (AD) 和不确定性分析来评估模型。14–17 虽然这为可燃性相关性质提供了良好的准确性，但表
    1 中列出的所有研究都集中在将单一性质与分子描述符在单任务模型回归中进行关联。


    表 1 预测可燃性相关性质的典型可用 QSPR 模型


    | 性质 | 分子特征 | 模型 | 参考文献 |

    | :--- | :--- | :--- | :--- |

    | FPT | 分子团的出现次数 | MLR | Hukkerikar 等人 2 |

    | | 分子团的出现次数 | MLR | Frutiger 等人 3 |

    | | 原子连通指数，分子团的出现次数 | MLR | Suzuki 21 |

    | | 拓扑指数 | MLR, ANN | Patel 等人 5 |

    | | 分子团的出现次数 | MLR | Alibakhshi 22 |

    | | 分子描述符，沸点 | MLR | Katritzky 6 |

    | AIT | 分子团的出现次数 | GA-MLR | Garagheizi 等人 10 |

