    # A multi-task deep learning neural network for predicting flammability-related
    properties from molecular structures†


    Ao Yang, Yang Su, Zihao Wang, Saimeng Jin, Jingzheng Ren, Xiangping Zhang, Weifeng
    Shen and James H. Clark


    It is significant that hazardous properties of chemicals including replacements
    for banned or restricted products are assessed at an early stage of product and
    process design. This work proposes a new strategy of modeling quantitative structure–property
    relationships based on multi-task deep learning for simultaneously predicting
    four flammability-related properties including lower and upper flammable limits,
    auto-ignition point temperature and flash point temperature. A multi-task deep
    neural network (MDNN) has been developed to extract molecular features automatically
    and correlate multiple properties integrating a Tree-LSTM neural network with
    multiple feedforward neural networks. Molecular features are encoded in molecular
    tree graphs, calculated and extracted without manual actions of the user or preliminary
    molecular descriptor calculation. Two methods, joint training and alternative
    training, were both employed to train the proposed MDNN, which could capture the
    relevant information and commonality among multiple target properties. The outlier
    detection and determination of applicability domain were also introduced into
    the evaluation of deep learning models. Since the proposed MDNN utilized data
    more efficiently, the finally obtained model performs better than the multi-task
    partial least squares model on predicting the flammability-related properties.
    The proposed framework of multi-task deep learning provides a promising tool to
    predict multiple properties without calculating descriptors.


    # 1. Introduction


    In the last decades, with the growth of chemical production, the potential risks
    associated with handling hazardous substances have always been of great concern
    to industry, government and the public. While the production and treatment of
    (hazardous) chemical substances are now strictly controlled in most regions, legislation
    affecting the chemicals themselves is only now becoming critical. The advent of
    Registration,


    (REACH) in Europe and similar chemical-focused legislation in other regions including
    China, Japan and Korea is forcing industry to assess the hazards of all industrial
    chemicals. Chemicals that are not proven to be sufficiently safe are to be banned
    or strictly controlled in use. Many widely used chemicals including some of the
    most important process solvents have been classified in this way, and the list
    of unacceptable chemicals is increasing rapidly. It is important that the hazardous
    properties of chemicals involving replacements for banned or restricted products
    are assessed at an early stage of product and process design.


    In Globally Harmonized System (GHS) of classification and labelling of chemicals,
    four properties including flash point temperature (FPT), auto-ignition temperature
    (AIT), upper and lower flammability limits (UFL/LFL) are employed to classify
    chemicals using similar categories.1 The property, FPT, is often used to evaluate
    the flammable risk of organic liquid in REACH legislation. AIT is important for
    the assignment of temperature classes in explosion protection (i.e., ATEX in Europe)
    of plants and equipment, which can be used to assess situations in which a substance
    can spontaneously catch fire. UFL and LFL are usually seen as the ease with which
    a substance can burn or be ignited. The four properties are often


