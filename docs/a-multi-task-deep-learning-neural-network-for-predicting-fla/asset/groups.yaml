    消失。尽管可扩展架构可以为建模QSPR的多项任务提供灵活配置，但优化更多超参数变得更加具有挑战性。在此，对应四种易燃性相关属性（即FPT、AIT、UFL、LFL）的四个FNN被配置为相同的结构参数，以降低优化的复杂度。


    ## 2.2 MDNN实现与训练


    由于所提出的MDNN包含动态神经网络（即Tree-LSTM网络），因此在支持动态网络的开源软件平台PyTorch上实现了它。50 训练、验证和测试的所有任务均在搭载NVidia
    GTX1060和Intel i5 8400的硬件平台上完成。开发了基于RDKit的解析器，并用Python实现了Faulon算法，以将SMILES表达式翻译为Python中的DAG。同时，利用简单的词嵌入算法实现，在TensorFlow中训练了嵌入向量。53
    在所有程序准备就绪后，使用图3所示的流程获得了四种易燃性相关属性的多任务预测模型。


    在图3的工作流中，采用了一种名为Adam的回归算法作为优化器来训练所提出的MDNN。在交替训练中，为每个任务配置了八个具有不同超参数的优化器。同时，还使用了另一个优化器来对整个MDNN进行联合训练。此外，采用早停法以避免过拟合，即，一旦在指定时间内（例如，二十个epoch）验证集的损失值没有改善，则训练过程将终止。


    ### 2.2.1 数据分析与准备。


    用于训练MDNN的涉及FPT、AIT、LFL和UFL的实验数据是从名为DIPPR801的权威数据库中提取的。55 该数据库DIPPR801为每个实验数据点提供不确定度和接受度，其中所有数据均已由数据库维护人员检查和审查。因此，它被用作许多QSPR研究的可靠数据源。从PubChem收集了一份分子结构列表，表示异构SMILES，包括DIPPR801中所有可用化合物和其他化合物。56
    从所使用的数据集中排除了涉及无机气体、盐类、金属有机物和金属元素的某些化合物，因为这些未使用化合物的分子结构与大多数传统有机物有显著差异，且其易燃性属性数据通常不可用。仅包含接受值和实验值的所用数据集以（逗号分隔值）CSV格式存储。所用化合物列表在ESI的S4节中提供。†


    关于四种易燃性相关属性之间不同的单位和数值水平，有必要对原始数据集进行标准化，以便更轻松地训练模型。原因是不同的数值指标可能导致各任务之间梯度出现较大差距。请注意，原始实验数据集应采用线性变换进行标准化，以保证分布形状不变。采用了如等式（1）所示的Z-score变换，它始终可以生成均值为0、标准差为1的分布。


    ```

    \(\hat{x}_i^{\text{exp}} = \frac{x_i^{\text{exp}} - \bar{x}^{\text{exp}}}{\sigma}\)

    ```


    其中，\(\hat{x}_i^{\text{exp}}\)表示转换后的属性值，\(x_i^{\text{exp}}\)表示原始值，\(\bar{x}^{\text{exp}}\)和\(\sigma\)分别是数据集的平均值和标准差。应注意，\(\bar{x}^{\text{exp}}\)和\(\sigma\)必须在训练集上计算，然后使用这两个参数来转换验证集和测试集。


    ![](img/ad669faf9aa9b269abc88758f2d39753_4_0.png)


    图3 基于深度学习构建多任务QSPR模型的方法概览。


