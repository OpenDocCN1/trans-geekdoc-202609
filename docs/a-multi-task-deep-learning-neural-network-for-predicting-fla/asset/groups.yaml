    Many studies applied group contribution methods and multiple linear regression
    (MLR) in predicting flammability-related properties, and other models were formulated
    with various numerical descriptors of molecular structures. Except for linear
    models, non-linear regression (NLR) was employed to correlate more flexible models.
    The stochastic optimization was also used to build prediction models, for the
    globally optimized correlations e.g., Garagheizi et al., 10,11 Pan et al. 12 and
