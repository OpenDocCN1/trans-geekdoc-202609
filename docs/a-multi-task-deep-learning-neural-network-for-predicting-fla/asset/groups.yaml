    After the time-consuming tuning of hyperparameters was finished in the MDNN training,
    the obtained model was evaluated on the data sets. For each property, the model
    performance was measured in four statistical indicators involving MAE, MPE, r
    and R². The identified outliers are provided in Table S10 of the ESI.† Another
    multi-task learning algorithm with partial least square (PLS) [45] were employed
    to compare with the proposed MDNN. Comparisons with the existing predictive models
    of flammability-related properties are provided in section S6 of the ESI.†


    在 MDNN 训练中完成耗时的超参数调优后，对所得模型在数据集上进行了评估。对于每个属性，模型性能通过 MAE、MPE、r 和 R² 四个统计指标进行了衡量。已识别的离群点列于
    ESI 的表 S10 中。† 另一种采用偏最小二乘法 (PLS) [45] 的多任务学习算法被用于与所提 MDNN 进行比较。与现有可燃性相关属性预测模型的比较载于
