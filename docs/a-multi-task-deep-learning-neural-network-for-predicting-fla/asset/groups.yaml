    ## 2. 方法论


    首先介绍 MDNN 的整体架构，它涉及两种类型的模块（见图 1）：(1) 基于 Tree-LSTM 网络46 的编码器，可以向量化 DAG 中描绘的分子结构，并捕获所有任务的所有相关特征和共性；(2)
    分配多个前馈神经网络 (FNNs) 用于提取任务特定特征（每个任务的学习个性）并分别输出每个性质。接下来详细介绍 MDNN 的实现和建模。在数据准备中，SMILES
    表达式预先使用基于 Faulon 算法47 的程序转换为 DAGs。DAG 的每个顶点都标记在一个涉及原子符号和化学键的字符串中，这些字符串通过词嵌入算法48
