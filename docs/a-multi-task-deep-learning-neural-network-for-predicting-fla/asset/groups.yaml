    在大多数情况下，网格搜索和随机搜索两种方法可以为特定数据集提供可接受的超参数配置。由于拟议MDNN中存在19个超参数，评估所有可能的超参数组合极其耗时。在拟议MDNN的训练过程中，为了参考以往研究的成功经验，选择了结构参数的初始猜测来确定网络架构。\(^\text{35,58,59}\)
    为了降低超参数优化的复杂性，扫描了隐藏层中的神经元数量，而每个任务特定FNN的层数固定为四层（三个隐藏层和一个输出层），因为增加更多层数并没有显著改进。随后，先使用网格搜索来确定其他超参数的初始最优范围。超参数也手动微调至最优范围内。在此过程中，每次手动调整一两个超参数，并应观察手动调整后MDNN在验证集上的性能是否得到改善。最终采用的超参数配置列于表5和表6中。在所有超参数确定并验证后，该模型最终在外部测试集上进行了测试。


    ### 2.2.4 统计评价


    以下统计指标被采用作为性能度量，以评价所学习的MDNN模型。


    平均绝对误差(MAE)是预测值与实验值之间偏差的度量，它可*通过*公式(4)计算获得。


    \(\text{MAE} = \frac{\sum_{i=0}^N |x_i^{\text{exp}} - x_i^{\text{pre}}|}{N}\)
    (4)


    表5 拟议MDNN最终采用的结构超参数


    | 超参数 | 数值 |

    |---|---|

    | 嵌入向量的维度 | 48 |

    | Tree-LSTM的记忆维度 | 32 |

    | Tree-LSTM的输出维度 | 32 |

    | 每个任务特定FNN的隐藏层数 | 3 |

    | FNN中每个隐藏层的神经元数 | 32 |


    表6 训练优化器最终采用的超参数


    | 超参数 | 数值 | 任务 |

    |---|---|---|

    | 学习率 \(\eta_t\) | 0.020000 | 共同，根据所有属性训练整个MDNN |

    | 学习率 \(\eta_1\) | 0.00120 | 交替，根据FPT训练Tree-LSTM网络 |

    | 学习率 \(\eta_2\) | 0.00120 | 交替，根据AIT训练Tree-LSTM网络 |

    | 学习率 \(\eta_3\) | 0.0006 | 交替，根据LFL训练Tree-LSTM网络 |

    | 学习率 \(\eta_4\) | 0.00023 | 交替，根据UFL训练Tree-LSTM网络 |

    | 学习率 \(\eta_1\) | 0.00120 | 交替，根据FPT训练任务特定FNN |

    | 学习率 \(\eta_2\) | 0.00180 | 交替，根据AIT训练任务特定FNN |

    | 学习率 \(\eta_3\) | 0.00009 | 交替，根据LFL训练任务特定FNN |

    | 学习率 \(\eta_4\) | 0.00020 | 交替，根据UFL训练任务特定FNN |

    | 批量大小 \(b_t\) | 32 | 共同，根据所有属性训练整个MDNN |

    | 批量大小 \(b_1\) | 32 | 交替，对应于FPT的Tree-LSTM和FNN |

    | 批量大小 \(b_2\) | 32 | 交替，对应于AIT的Tree-LSTM和FNN |

    | 批量大小 \(b_3\) | 32 | 交替，对应于LFL的Tree-LSTM和FNN |

    | 批量大小 \(b_4\) | 32 | 交替，对应于UFL的Tree-LSTM和FNN |


    平均百分误差(MPE)提供预测值与实验值之间百分误差的平均值，可表示为公式(5)。


    \(\text{MPE} = \frac{1}{N} \sum_{i=0}^N \frac{|x_i^{\text{exp}} - x_i^{\text{pre}}|}{x_i^{\text{exp}}}
    \times 100\%\) (5)


    由于已发表文献\(^\text{21,22,24,32,33,60,61}\)中报道的相关性分析通常将相关系数\(r\)或\(R^2\)作为性能指标，因此在本研究中两者均用于评估拟议的MDNN。皮尔逊相关系数，


    \(r = \frac{\sum_{i=1}^n (x_i^{\text{exp}} - \overline{x^{\text{exp}}})(x_i^{\text{pre}}
    - \overline{x^{\text{pre}}})}{\sqrt{\sum_{i=1}^n (x_i^{\text{exp}} - \overline{x^{\text{exp}}})^2}
    \sqrt{\sum_{i=1}^n (x_i^{\text{pre}} - \overline{x^{\text{pre}}})^2}}\) (6)


    决定系数，


    \(R^2 = 1 - \frac{\sum_{i=1}^n (x_i^{\text{exp}} - x_i^{\text{pre}})^2}{\sum_{i=1}^n
    (x_i^{\text{exp}} - \overline{x^{\text{exp}}})^2}\) (7)


    ### 2.3 异常值检测与AD确定


    在本工作中，还研究了基于深度学习的QSPR的异常值检测。四个任务的异常值是根据实验值与预测值之间残差的经验累积分布函数(ECDF)进行检测的。ECDF是一个阶梯函数，在每个数据点处增加1/n。设\((X_1,
    ..., X_n)\)为具有共同累积分布函数\(F(t)\)的独立同分布实随机变量，那么对于实现值\((x_1, ..., x_n)\)，ECDF可如公式(8)所示定义。


    \(\widehat{F}_n(t) = \frac{\text{number of element in the sample } \le t}{n} =
    \frac{1}{n} \sum_{i=1}^n I_{X_i \le t}\) (8)


    对于固定的\(t\)，指示变量\(I_{X_i \le t}\)是参数\(p = F(t)\)的伯努利随机变量。ECDF的值是样本值小于或等于t的样本数除以样本总数n。Frutiger
    et al. [14]在群贡献模型的残差分析中提出了该方法，其中残差分布不能预先假设为正态分布。Frutiger et al. [14]在未分段数据集上应用了该方法，并在排除异常值后反复回归群贡献模型。最终，由于残差离散程度的降低，模型性能得到了成功改善。


    然而，在基于深度学习的QSPR建模中，原始数据集通常分别分为训练集、验证集和测试集三个子集。尽管可以在三个数据集上检测异常值，但只能排除训练集和验证集中的异常值。测试集通常用于评估训练好的深度学习模型的泛化能力，它与训练集和验证集独立，不应在模型训练中进行评估。此外，测试集中包含的一些化合物可能会漂出由训练集和验证集确定的潜在化学空间。


    为了描绘MDNN学习的潜在化学空间，并检查排除异常值后化学空间的变化，我们还从结构域和属性域两个方面研究了最终模型的AD。[16] 分子特征由Tree-LSTM网络输出的高维向量表示。由于高维向量不易直观显示和分析，因此适合对涉及训练集和验证集的AD确定应用降维算法主成分分析(PCA)。[62]
    我们决定共同评估结构空间和属性空间，即将数据集中所有高维向量和目标属性组合成一个矩阵。PCA可以降低维度，并使仅少数几个主成分(PCs)保留所有数据的大部分方差。这样，ADs可以在较低维空间中进行分析和可视化。另一个因素是AD的范围也应确定，应用基于凸包的策略来探索AD边界。因此，可以轻松发现测试集中的某些化合物是否存在于AD之外。同时，通过ECDF识别的异常值也可以在可视化AD中标记，以研究异常值与AD之间的关系。凸包的计算方法在ESI的第S7节中公开。†


