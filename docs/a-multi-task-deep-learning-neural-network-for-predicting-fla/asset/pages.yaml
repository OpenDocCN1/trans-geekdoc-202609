    Mean percentage error (MPE) provides an average of percentage error by which the
    predicted values differ from the experimental values, and it is expressed as eqn
    (5).


    \(\text{MPE} = \frac{1}{N} \sum_{i=0}^N \frac{|x_i^{\text{exp}} - x_i^{\text{pre}}|}{x_i^{\text{exp}}}
    \times 100\%\) (5)


    Since the correlation analysis reported in the published literatures\(^\text{21,22,24,32,33,60,61}\)
    usually chose the correlation coefficients of \(r\) or \(R^2\) as the performance
    indicator, both of them were employed to assess the proposed MDNN in this research.
    The Pearson correlation coefficient,


    \(r = \frac{\sum_{i=1}^n (x_i^{\text{exp}} - \overline{x^{\text{exp}}})(x_i^{\text{pre}}
    - \overline{x^{\text{pre}}})}{\sqrt{\sum_{i=1}^n (x_i^{\text{exp}} - \overline{x^{\text{exp}}})^2}
    \sqrt{\sum_{i=1}^n (x_i^{\text{pre}} - \overline{x^{\text{pre}}})^2}}\) (6)


    The coefficient of determination,


    \(R^2 = 1 - \frac{\sum_{i=1}^n (x_i^{\text{exp}} - x_i^{\text{pre}})^2}{\sum_{i=1}^n
    (x_i^{\text{exp}} - \overline{x^{\text{exp}}})^2}\) (7)


    # 2.3 The outlier detection and AD determination


    The outlier detection was also studied for deep learning based QSPRs in this work.
    The outliers of four tasks were detected with the empirical cumulative distribution
    function (ECDF) of the residuals between experimental and predicted values. The
    ECDF is a step function that increases by 1/n in every data point. Let \((X_1,
    ..., X_n)\) be independent, identically distributed real random variables with
    the common cumulative distribution function \(F(t)\), then the ECDF can be defined
    as shown in eqn (8) for a realization \((x_1, ..., x_n)\).


    \(\widehat{F}_n(t) = \frac{\text{number of element in the sample } \le t}{n} =
    \frac{1}{n} \sum_{i=1}^n I_{X_i \le t}\) (8)


    For a fixed \(t\), the indicator \(I_{X_i \le t}\) is a Bernoulli random variable
    with parameter \(p = F(t)\). The value of the ECDF is the'
