    # 2.2.2 Training and evaluating a deep learning based QSPR model.


    Unlike single-task DNNs, there are two strategies to train multi-task DNNs as
    usual, _i.e._, alternate training and joint training.$^{57}$ With joint training
    for property prediction, a distribution of vectors representing molecules in the
    chemical latent space is simultaneously organized by the four properties and commonalities
    among the four tasks which could be learned. There is a requirement on the training
    data for joint training, _i.e._, the experimental values of four properties must
    be available simultaneously in one data row. Therefore, all parameters of the
    MDNN can be trained in each epoch of the joint training. After the joint training
    had been conducted, alternate trainings were employed to train each FNN as well
    as the Tree-LSTM network in one epoch. It is not necessary to fill all training
    data matrices in the alternate training which could transfer some information
    from rich data sets to sparse ones. In the alternate training, only the corresponding
    FNN is updated for the current task during each iteration, while all parameters
    of other task-specific FNNs are frozen. Two types of loss function were employed
    in the two types of training methods. For the joint training, all parameters of
    the whole network were updated to minimize a combined loss function eqn (2).$^{58}$


    ```

    \(L(W, \sigma_1, \sigma_2, \dots, \sigma_i) = \sum_l \left( \frac{1}{2\sigma_l^2}
    L_i(W) + \log \sigma_i \right) \quad (2)\)

    ```


    ```

    \(L(W, \sigma_i) = \frac{1}{2\sigma_i^2} L_i(W) + \log \sigma_i \quad (3)\)

    ```


    where \(W\) is used to represent model parameters and \(\sigma_i\) is the observation
    noise variable (_i.e._, standard deviation) of each task. This loss function weighs
    the losses of all tasks using the homoscedastic uncertainty of each task, which
    allows each task corresponding to each property to be learned simultaneously.
    \(L_i(W)\) representing the loss function for each task was calculated by mean
    square error (MSE) between the estimated values and the experimental values. It
    should be noted that the loss function \(L_i(W)\) was employed for each FNN and
    the weighted loss function \(L_i \ (W, \sigma_i)\) was used to train the Tree-LSTM
    encoder in the alternate training. The details related to model training are presented
    in the section S5 of ESI.$^\dagger$


    # 2.2.3 Determination of hyper-parameters.


    It is significant to determine the optimal configuration of hyper-parameters for
    a deep learning model. In general, two parts of hyper-parameters should be determined:
    the structural parameters of deep neural network (_e.g._, number of hidden layers,
    number of neurons, types and parameters of activation functions) and parameters
    of training optimizers. Unfortunately, there is no such a universal configuration
    that can work well for all models and data sets. It is necessary to optimize the
    hyper-parameters for different models separately.'
