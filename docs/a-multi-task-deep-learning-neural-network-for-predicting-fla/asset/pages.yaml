    A data-driven technique, deep learning, has been recently employed to build QSPR/QSAR
    models.32–35 One important reason is that deep learning techniques can extract
    valuable features automatically and discover potential relationships among various
    big data. For example, in the Tox21 Data Challenge launched by NIH, EPA and FDA,36
    various deep learning neural networks (DNNs) were employed to automatically extract
    the relevant molecular features from a huge number of descriptors and detect toxiphores.
    This could help chemists to identify valuable candidates at early stage'
