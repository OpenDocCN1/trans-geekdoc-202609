    # 2.1.1 The extraction block of molecular features.


    Since Tree-LSTM networks can traverse all vertexes in a DAG and mimic the topological
    graph of the DAG, the starting point is that molecular structures should be transformed
    to DAG forms. Although DAGs can be canonized in a certain rule,47 the resulting
    canonical orientation is still likely to be quite arbitrary among all possible
    orientations.39 Hence, in this study, every DAG was generated from each orientation
    (i.e., traversed from all possible root atoms) and was then vectorized by the
    Tree-LSTM network respectively. The whole workflow is presented and exemplified
    by the chemical 2,4,6-trichlorotoluene (Fig. 2).


    In the original format of DAGs, each edge does not correspond to a chemical bond
    of molecules and each vertex is only associated with each atom symbol. For example,
    a double bond between two atoms cannot be recorded in an original DAG, which is
    also contrary to the definition of DAGs. To record all bonds of a molecule, a
    modification was implemented on the original style of DAG, i.e., bond types are
    attached on adjacent atom symbols (see the third step in Fig. 2) in the children
    vertexes of a DAG. As the Tree-LSTM network only accepts vectors as inputs of
    each unit mapping to each vertex of a DAG. As such, the strings (i.e., “[c]”,
    “[c]”, “[Cl]”, “[C]” and “[c0]” shown in the third step of Fig. 2) representing
    the vertexes should be converted to vectors (i.e.,


    v1–v5 shown in the fourth step of Fig. 2). A word embedding model, skip-gram,48
    was employed to encode such strings as vectors.


    Of note is that the Tree-LSTM network can be considered as a dynamic computational
    graph which has a self-adaptive capability of various molecular structures. For
    each DAG corresponding to a computation graph of the Tree-LSTM network (see the
    fourth step in Fig. 2, there are five computation graphs), a recurrent algorithm
    traverses from the root vertex to leaf vertexes of each DAG and calculate corresponding
    units of the Tree-LSTM network according to the inputting vectors and neighbourhood
    outputs. Afterwards, all the vectors representing the DAGs of all orientation
    are summed into a vector which can represent a molecule (see the fifth and sixth
    steps in Fig. 2). As space is limited, more details related to the transformation
    of molecular structures, word embedding and Tree-LSTM are disclosed in the sections
    S1 to S3 of ESI.†


    # 2.1.2 The extraction block of task-specific features.


    Each task-specific block was used to extract relevant features of a specific property
    and output prediction values. Hence, the number of target properties will determine
    the number of task-specific blocks, i.e., the number of tasks. Theoretically,
    each task-specific block can be designed as a different FNN with the independent
    structure and parameters, and it is also workable to train each block with different
    optimizers respectively. In the task-specific block, an activation function, rectified
    linear (ReLU),49 was applied to perform non-linear transformations and generate
    activation values, since ReLU has lower computation consumptions and lower risks
    of gradient


