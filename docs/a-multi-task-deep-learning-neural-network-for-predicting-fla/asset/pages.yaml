- pgno: 7
  md: 'number of samples whose sample value is less than or equal to t divided by
    the total number of samples n. This methodology was suggested in the residual
    analysis of group contribution models by Frutiger et al.,14 in which the distribution
    of residuals could not be assumed as a normal distribution in advance. Frutiger
    et al.14 applied the approach on an unsegmented data set and repeatedly regressed
    a group contribution model after outliers were excluded. Finally, the model performance
    was improved successfully thanks to the reduction of residual dispersion. However,
    raw data sets are often divided into three subsets for training, validation, and
    test respectively in the modelling of QSPRs based on deep learning. Although outliers
    can be detected on all the three data sets, only the outliers in the training
    and validation sets can be excluded. The test set is often utilized to evaluate
    the generalization ability of a trained model of deep learning, which is independent
    to the training and validation sets and should not be evaluated in the model training.
    Moreover, there is a possibility that some compounds included in test sets could
    drift out of the latent chemical space determined by training and validation sets.
    To depict the latent chemical space learned by MDNN and check the changes of chemical
    space after outliers are excluded, we


    also investigated ADs of the final model from two aspects: structural domain and
    property domain.16 Molecular features are depicted in a high-dimensional vector
    output by the Tree-LSTM network. As the high-dimensional vector cannot be visualized
    and analysed easily, it is suitable to apply a dimension-reduction algorithm,
    principal components analysis (PCA), on the determination of ADs involving training
    and validation sets.62 We decided to assess structural space and property space
    together, i.e., all the high-dimensional vectors and target properties in a dataset
    were combined into a matrix. PCA can reduce dimensionality and enable only a few
    principal components (PCs) to retain the most of variance of all data. As such,
    ADs could be analysed and visualized in a lower dimensional space. Another factor
    is that the scope of an AD should be also determined, a strategy based on convex
    hull was applied to explore the AD boundary. For this reason, it is easy to discover
    whether some compounds in test sets exist outside the AD. Meanwhile, the outliers
    identified by ECDF can also be marked in a visualized AD, to investigate relationships
    between the outliers and ADs. The calculation method of convex hull is disclosed
    in section S7 of the ESI.†


