    # 2.2 MDNN implementation and training


    As the proposed MDNN includes a dynamic neural network (i.e., Tree-LSTM network),
    it was implemented on an open-source software platform supporting dynamic networks,
    PyTorch.50 All tasks of training, validation and testing were finished on the
    hardware platform with NVidia GTX1060 and Intel i5 8400. A parser based on RDKit51
    was developed and Faulon’s algorithm40 was implemented in Python, to translate
    SMILES expressions into DAGs in Python. Meanwhile, a simple implementation of
    word embedding algorithm52 was utilized to train the embedding vectors in TensorFlow.53
    After all programs were prepared, a multi-task prediction model of the four flammability-related
    properties was obtained using the procedure illustrated in Fig. 3.


    In the workflow of Fig. 3, a regression algorithm named Adam54 was employed as
    optimizers to train the proposed MDNN. Eight optimizers were configured with different
    hyper-parameters for each task in alternate training. Meanwhile, another optimizer
    was employed to carry out the joint training on the entire MDNN. Additionally,
    early stopping was used to avoid overfitting, i.e., once there was no improvement
    on loss values of validation sets for a specified time (e.g., twenty epochs),
    the training process would be terminated.


    # 2.2.1 Data analysis and preparation.


    The experimental data involving FPT, AIT, LFL and UFL were used to train the MDNN,


    which were extracted from an authoritative database named DIPPR801.55 The database,
    DIPPR801, provides the uncertainty and acceptance for each experimental data point
    in which all data had been checked and reviewed by database maintainers. Hence,
    it was employed in many QSPR studies as a reliable data source. A list of molecular
    structures was gathered from PubChem56 representing isomeric SMILES, including
    all the available compounds in DIPPR801 and other compounds. Some compounds involving
    inorganic gas, salts, metal-organics and metallic elements were excluded from
    the employed data set, as molecular structures of these unemployed compounds are
    significantly different from most conventional organics and their flammability
    property data are often unavailable. The employed datasets only including accepted
    and experimental values were stored in (Comma-Separated Values) CSV format. The
    lists of employed compounds are provided in the section S4 of ESI.†


