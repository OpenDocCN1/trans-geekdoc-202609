    The multi-task PLS model can also correlate four properties in a single model
    successfully, but its predictions are less accurate. Fig. 8 presents the deviations
    between the predicted values and experimental values obtained by the multi-task
    PLS. The PLS model provides lower values of Pearson correlation coefficient r
    than those given by the MDNN model. The PLS model performs undesirably on AIT
    and shows some lower errors on other three properties. This could be attributed
    to the data dispersion of properties. In particular, the combustion reaction is
    complicated and related to various factors, e.g., chemical equilibrium, mass transfer,
    kinetics, etc. It is possible that uncertainty and inconsistent configurations
    in experiments may cause different measured values, and the impact of the gas
    composition is not frequently considered in experiments.64 All these factors are
    not always available for each compound in the common-used databases, although
    the used data were carefully reviewed in DIPPR801 database.


    The proposed multi-task learning strategy could be an approach to employ a unified
    molecular representation to correlate multiple properties in one model. We admit
    that it might be easier to obtain acceptable results via the previous single-task
    models specially designed for a unique property and with a particular representation
    of a molecule structure.


    However, these previous single-task models often describe molecular structures
    by various descriptors and their used data sets of properties could also be far
    different. As such, the ADs of various models are often different and there is
    a potential risk that various models may output different values on same compounds.
    The molecular representation can be unified in various models if the employed
    set of descriptors contains all the information of a chemical structure, however,
    this is practically impossible.65 In this work, the proposed approach learns the
    molecular graphs directly, which aims to depict a molecule in 2D graphs as much
    as possible and unify the molecular representations for correlating various properties
    simultaneously, though all the precise information of molecules cannot be still
    perfectly recorded. In other words, the selection and calculation of molecular
    descriptors can be eliminated in the modelling of QSPRs through the proposed strategy.


    # 4. Conclusions


    To accelerate the process development at least during initial assessments and
    thus enable early go/no-go decisions in screening of the banned or restricted
    products based on the hazardous properties, a new methodology has been developed.
    This involves building QSPR models based on multi-task deep learning, involving
    data preparation, model training, outlier detection and AD determination. The
    methodology was suc-'
