  md: '# ## 3. Results and discussion


    After the time-consuming tuning of hyperparameters was finished in the MDNN training,
    the obtained model was evaluated on the data sets. For each property, the model
    performance was measured in four statistical indicators involving MAE, MPE, r
    and R2. The identified outliers are provided in Table S10 of the ESI.† Another
    multi-task learning algorithm with partial least square (PLS),45 were employed
    to compare with the proposed MDNN. Comparisons with the existing predictive models
    of flammability-related properties are provided in section S6 of the ESI.†


    Two results were presented for two models obtained before and after outliers were
    excluded, respectively. Fig. 4 shows prediction deviations obtained by the model
    (I) trained with all data points. After the outliers were identified and excluded,
    the proposed MDNN was re-trained without the outliers of training and validation
    sets. Outliers were identified for the retrained model (II) again, Fig. 5 provides
    predictions of the model (II). In Fig. 4 and 5, diagonal lines represent the equivalence
    between experimental values and predicted values, while circles, rectangles, and
    plus signs indicate the predicted values of compounds in training, validation,
    and test sets, respectively. Tables 7 and 8 present the values of performance
    metrics for the models (I) and (II) respectively. It suggested that the proposed
    MDNN model can accurately predict the four flamm-


    ability-related properties with small deviations for most compounds.


    The relationships between compound families as well as the prediction errors have
    also been investigated according to the model (I). Distributions of compounds
    in various families were presented with MPE in Fig. S15–S18 of the ESI.† For each
    property, the MPE of each family was calculated on a union set of training, validation
    and test sets. Since a method of random sampling was used to divide data sets,
    some families with much less compounds would be not selected into the validation
    and test sets. As shown in Fig. S15–S18,† chemicals in training sets are more
    diverse than validation and test sets. For example, several compound families
    (e.g., 1-alkenes, alkynes, formates, etc.) were not sampled into the validation
    and test sets for FPT, i.e., the diversity of training set is larger than that
    of validation and test set. Among the four properties, compounds correlated with
    FPT distribute in 79 families, the least number of families employed in the correlation
    of UFL is 67. Molecules used to train MDNN on AIT distribute in 73 families, and
    the compounds used in the correlation of LFL distribute in 72 families.


    Although the MDNN model predicted FPT accurately on most compounds, the MDNN model
    would produce a large prediction error on a small molecule, for example, methane
    which only has one carbon atom. The model provided a good value of MPE within
    10% on halogenated hydrocarbons only


