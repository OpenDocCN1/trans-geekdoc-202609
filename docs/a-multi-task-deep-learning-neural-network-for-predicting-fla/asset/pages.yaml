    It is however, very time-consuming to screen safer candidates of hazardous chemicals
    from many possible compounds through experimental assessments of all the key risk
    parameters in authorized laboratories. This is considered by many people to be
    a major disincentive to companies developing new safer chemicals to replace those
    hazardous compounds judged badly by REACH and related assessments. The GHS rule
    also states that if experimental values of any properties are unavailable to assess
    the hazardous level of a chemical, these properties of an individual molecule
    can be predicted by mathematical models such as quantitative structure–activity/property
    relationships (QSAR/QSPR). These predictive models could accelerate the process
    development at least during initial assessments and thus enable early go/no-go
    decisions in screening of alternatives with lower costs. Among these, the previous
    QSPR models can estimate properties by using some information of molecular structures,
    e.g., the occurrences of certain molecular groups, 2,3,66 molecular descriptors
    and properties. 5–7 Most existing studies of physicochemical properties involving
    AIT, FPT, UFL and LFL were reviewed by Nieto-Draghi et al. 8 and Jiao et al. 9
    Herein, Table 1 exemplifies some existing models for predicting the four properties
    with various features of molecular structures.


    Many studies applied group contribution methods and multiple linear regression
    (MLR) in predicting flammability-related properties, and other models were formulated
    with various numerical descriptors of molecular structures. Except for linear
    models, non-linear regression (NLR) was employed to correlate more flexible models.
    The stochastic optimization was also used to build prediction models, for the
    globally optimized correlations e.g., Garagheizi et al., 10,11 Pan et al. 12 and
    Lazzús. 13 The existing studies based on both MLR and NLR suggested that outlier
    detection, applicability domain (AD) and uncertainty analysis should be used to
    evaluate the models. 14–17 Even though this provided a good accuracy for the flammability-related
    properties, all the studies as listed in Table 1 focused on correlating one property
    with molecular descriptors in a single task of model regression.


    On the other hand, most previous QSPR studies employed manually-defined methods
    based on chemistry or graph theory to depict molecular features as numerical descriptors.
    For example, group contribution methods count occurrences of molecular fragments
    but connectivity is frequently ignored among groups. When only one topological
    index of connectivity is used in a QSPR model, differences among atoms are frequently
    not recorded. If a new compound has an undefined group or other ambiguous features
    which cannot be depicted in these manually-defined methods, these models based
    on only a type of molecular descriptors could not provide a satisfactory estimation.
    Hence, a variety of descriptors have been developed to enhance the resolution
    and coverage of diverse molecular structures. 18 As an example, the group contribution
    plus (GC+) proposed by Hukkerikar2 combined the multi-level group contribution
    and atom con-


