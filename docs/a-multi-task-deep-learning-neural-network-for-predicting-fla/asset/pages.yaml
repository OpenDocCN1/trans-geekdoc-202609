    To the best of our knowledge, there is a lack of equivalent and available deep-learning
    models on the flammability-related properties that makes it difficult to compare
    the proposed MDNN with other existing models. Moreover, most existing models predict
    a single flammability-related property according to the manually selected molecule
    features. The proposed MDNN can correlate four flammability-related properties
    in a single model with molecular structures but not using pre-defined descriptors.
    Despite the large differences between the proposed model and existing single-task
    models, the proposed MDNN was still compared with the existing classical models
    (section S6 of esi†). The results show that the accuracy of the MDNN model is
    competitive to that of other types of classical models. Unlike some other studies
    those employ both experimental and prediction values, only the experimental values
    were used in this work. For the deep learning model, the smaller data sets could
    make the model performance less remarkable.


