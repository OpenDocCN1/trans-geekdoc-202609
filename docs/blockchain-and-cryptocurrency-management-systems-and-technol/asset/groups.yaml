    ### 2.11.3 易用性


    无需真实银行账户或实际货币，数字货比即可随时随地使用。特别是对于生活在偏远或农村地区的人们，这可以提高交易的便利性和效率。使用e-卢比无需银行账户。银行也可以让我们以代币形式购买数字卢比。通常情况下，这类似于从银行取款，区别在于它是以电子钱包从我们的银行账户中存入资金，而非向我们交付现金，让我们使用常规货币。账户支付将随着在线交易实时进行。


    ### 2.11.4 全球接受度


    跨境货币兑换和转账既耗时又费钱。数字卢比将通过快速跨境转账来增强银行的现金管理和运营。无论身在何处，持有数字卢比的NRI都可将其用于国际金融交易。这将有助于印度经济举措的扩展（Li
    et al., 2022）。


    ### 2.11.5 对经济的积极影响


    与澳大利亚和英国等北欧国家相比，印度拥有更强的现金提取倾向，占GDP的17%。如果人们使用e-卢比，他们可能会减少对现金的依赖。这自然将降低实际货币的管理、印刷和分发成本。此外，使用数字卢比有助于减少非法金融交易和用途的数量，从而增加税收收入并减少腐败。除了为政府提供更多数据信息外，数字货币的发展还带我们到最后一个要点，即消费者购买趋势，政府可利用这些趋势来提高经济项目的效率并增加收入。总体而言，数字卢比的引入可能随着时间的推移对印度经济产生积极影响，并提供税收资金。当前电子支付时代的主要趋势是数字货币的扩展。由于CBDC的诸多优势，越来越多的国家正在研究它。数字支付方式在印度已变得非常普遍，这一趋势预计将持续下去。这可能导致对e-卢比作为其他数字支付方式替代品的需求（Xiong
    et al., 2022）。


    ### 2.11.6 保险


    区块链可以支持保险行业中多个客户、投保人和保险公司之间的交易。除了支持保险公司之间的再保险交易外，区块链还可用于保险单的议价、购买和登记。智能合约可用于自动化不同的保险计划，从而大幅节省管理费用。处理


