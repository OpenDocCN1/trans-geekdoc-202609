    ## 7.2.2 OPEN RESEARCH CHALLENGES


    The open research challenges when combining artificial intelligence with blockchain
    networks are elaborately detailed below.


    ### Privacy Protection


    The records fed into the blockchain network are publicly available in the shared
    ledgers and the same are available to all the readers. In parallel, the devices
    concerned are continuously collecting private and sensitive data and putting them
    onto the open shared ledgers. This is the point of concern we look into. Data
    privacy should be ensured by using encryption functions to allow access. The increased
    number of records can be effectively handled when processed with the AI to make
    the necessary decisions.


    ### Scalability and Side Chains


    Scalability is one of the important parameters when considering any kind of network.
    For example, to date 4 and 12 transactions per second are performed by the Bitcoin
    and Ethereum blockchain networks, respectively. Facebook handles millions of transactions
    every second. To enhance the process of blockchain, side chains are used. Transactions
    made between the two parties are sorted out quickly outside the main chain and
    updated once a day in the main chain. Even though more algorithms are available
    to improve the performance, it still needs more algorithms to address scalability
    issues.


    ### Security


    The new trusted execution environments are needed to avoid the tampering issue
    in the miner nodes of blockchain networks that contain the hyper ledgers. The
    system using the public ledger type suffers (cyberattacks) more, about 51% compared
    to the private type. The private type uses predefined consensus protocols among
    the peers. In this view, the security is the major issue in the blockchain network
    that needs to be focused more.


    ### Smart Contracts and External Functions


    The poor programming practices used to code the smart contract between the application
    side and the blockchain network is one of the serious issues and is vulnerable.
    Hence, it is necessary to protect the code as well as the records on the blockchain
    network. New effective testing tools also need to be developed to test the security
    condition of the smart contract. AI-based machine learning algorithms are used
    to approximate the outcomes rather than random ones. Hence, a clear step needs
    to be taken against the issues listed above.


    ### Trusted Database


    The peers of the blockchain network simultaneously work with the external functions
    by using the smart contracts (i.e. database). Sometimes the data are pulled into
    the blockchain network and pushed to the third party. Hence, to work with the
    third-party external functions, trusted functions to be deployed to avoid insecurity.


    ### Application level – AI-Specific Consensus Algorithms


    The consensus protocols in the blockchain network act as a middle layer to validate
    the processes. An urgent focus is needed to concentrate on developing the consensus
    algorithms at the application level with enhanced learning approaches to improve
    performance and optimization quality.


