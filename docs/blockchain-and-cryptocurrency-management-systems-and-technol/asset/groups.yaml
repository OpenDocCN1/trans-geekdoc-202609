    在持续稳定收入的驱动下，人们纷纷运行高能耗设备参与这一行业。比特币的成本随之上升，网络的平均能耗率也随之上扬。


    ## 2.12.7 安全性


    区块链安全方面最广为人知的问题是51%攻击。在51%攻击中，一个或多个恶意行为者控制了区块链的大部分哈希率。凭借该哈希率，他们可以通过撤销交易、阻止区块被其他矿工验证来进行双重支付。矿池为了提高区块奖励而采用的“自私挖矿”这种不道德做法，会影响区块链网络的可靠性。尽管人们通常认为，拥有区块链网络51%以上计算能力的恶意节点可能会受到权力的控制，但只要任何人希望利用哈希算力，网络就仍容易遭受欺诈。矿工或矿工群体可以选择不向现有网络广播已验证区块，从而发起自私挖矿过程。他们继续挖掘下一个区块以保持自身优势。只有满足特定条件后，普通公众才能看到已解出的区块。因此，随着自私网络的链变得更长、更复杂，该网络不得不接受矿工的解决方案，而其他矿工则在无用的分支上消耗能量。最终，贪婪的矿工想要更多现金，这使得拥有超过51%算力的自私矿池更有可能出现，因为理性矿工会受到诱惑加入更长的链（Tschorsch
    et al., 2016）。


    ## 2.13 比特币的未来研究


    研究人员断言，区块链技术在学术和商业应用中具有巨大前景。标准化、资产保护、大数据和智能合约只是本节简要介绍的区块链技术众多潜在应用中的一小部分。投资者在使用区块链技术时，可能会被巨额利润的前景所吸引。为了在商业解决方案中正确实施这项技术，必须确定是否满足相关标准。采用系统化的测试流程来检验基于区块链的解决方案的优缺点至关重要。该流程包含两个不同阶段：标准化阶段和测试阶段。第一步将基于一套特定标准评估开发者对其区块链解决方案的声明。在测试阶段则评估基于区块链的系统的运行情况。例如，在线零售商的所有者会对基于区块链的系统如何运作感兴趣。所购解决方案使用的平台应具备一定的测试和标准化方法，以评估其容量、吞吐量和延迟（Yli-Huumo
    et al., 2016）。


    通过使用区块链技术注册新想法、概念验证和图纸，企业可以为其创作建立数字轨迹，并生成可用于证明任何知识产权资产的合法性、存在性和所有权的证书。所有经公证的信息，包括商业秘密，都通过鼓励竞争和高效支付得到保护。希望这一努力能够引发关于适当行动的进一步讨论。


