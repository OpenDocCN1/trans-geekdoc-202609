    ### 3.1 预览


    随着数字时代的到来，加密货币成为一种新兴概念。根据现有的学术资源，可以明显看出，加密货币正获得认可，并在经济的增长和发展过程中日益流行。加密货币预计将在从风险管理转向实现金融稳定的过程中发挥关键作用，同时扩大金融包容性的机会，并促进金融领域的创新（Kelly,
    2014）。在本章撰写时，比特币的价格正升至 26,500 美元的水平，有人猜测，一旦突破这一关口，就可能引发负面市场情绪。专家们认为，从整体技术角度来看，比特币的行情走势略偏积极。本章旨在探索加密行业，并尝试预测比特币在不久的将来的走势。


    世界经济论坛（WEF）于 2022 年 7 月报告称，加密货币是一种虚拟资产，主要由加密算法和分布式账本技术构成。本章旨在讨论比特币等虚拟资产和在线基础设施，它们本质上可以自由访问、公开可见且无需许可。比特币的运作在很大程度上依赖全球计算机网络来验证交易并确保网络完整性（Saito,
    2016）。颇具讽刺意味的是，加密货币常常被误解为货币，但它们根本不是货币（Kelly, 2014）。它们是投机性资产，其估值会随时间变化。这一特征使加密货币在用户中的接受和使用变得更加复杂。对加密货币的认识和监管尚处于起步阶段，这吸引学术研究者深入挖掘并形成见解，这些见解将对各行各业的人士有所裨益（Team,
    2016）。


    据经济学专家称，加密货币领域尚未得到充分研究。人们对加密行业的概念、运作和监管政策的了解甚少。有人声称，加密货币的经济影响仍是一个未被触及的领域（Team,
    2016）。关于加密货币与经济之间的关系，仍有许多未解问题。对于各国政府来说，这仍然是一个有待决定的开放领域：是让其成为法定货币以促进其在经济中的顺畅流通，还是彻底禁止，抑或制定监管政策和框架以保障投资者的金融稳定与增长（世界银行集团,
    2018）。


    本章旨在理解加密货币（BTC）的特征，建立线性回归模型来分析 BTC 收盘价与 BTC 交易量之间的关系，并进而预测 BTC 在不久的将来的平均收盘价。这一统计结果将有助于形成对
    BTC 走势的洞察（Patterson, J., 2015）。


    ### 3.2 文献综述


    加密货币代表一种去中心化、虚拟且独立的货币体系。它们使货币摆脱了对任何单一货币在交易、投资和财富保值方面的依赖，从而打破垄断（Saito, 2016）。它们存在于主权政府或政府实体的控制和监管之外。这些数字货币由加密系统保护，并确保安全、受保护的互联网体验，无论是否有中介机构或监管机构（如印度储备银行）进行监控（世界银行集团,
    2018）。加密货币本质上是私人数字货币，缺乏印度政府的官方支持。印度政府正在开发自己的原生在线货币，并且不支持当前任何加密货币（Team, 2016）。可以说，这一概念最初由中本聪提出，他是比特币的创造者，而比特币是所有加密货币中最受欢迎、使用最广泛的。


    ### 3.3 不同的加密货币


    除比特币外，其他一些流行的加密货币包括以太坊（ETH）、莱特币（LTC）、Chainlink（LINK）、Cosmos（ATOM）、门罗币（XMR）、Tether（USDT）、XRP、币安币（BNB）、USD
    Coin（USDC）、Cardano（ADA）、Solana（SOL）、狗狗币（DOGE）、Tron（TRX）、Polygon（MATIC）等。当今许多加密货币都在某种程度上源于比特币。尽管存在众多比特币竞争者，但最初的加密货币在采用率和经济价值方面仍保持主导地位。迄今为止，没有一种能够超越其市值和价值（Team,
    2016）。自 2009 年推出以来，大量模仿者、替代品以及基于其区块链的新技术纷纷涌现。这些替代币统称为“山寨币”。它们的目的多种多样——从玩笑/表情包，到在分布式全球虚拟机上为交易付费的币种（Nakamoto,
    2008）。


    设定这样的上限。一些加密货币采用“销毁”机制，即永久性地将现有代币从流通中移除，以防止流通供应量过大并抑制通胀。销毁涉及将代币发送到区块链上不可找回的地址（Stefan
    Hubrich, 2017）。每种加密货币都遵循其独特的货币政策。


    ### 3.5 生产成本


    挖矿是生产新加密货币代币的过程。该过程使用计算机来验证区块链中的下一个区块。从事这项工作的人被称为矿工。他们使用去中心化网络来完成这项工作。作为报酬，矿工将获得新创建的加密货币代币，以及加密货币交易各方支付的任何交易费用（Pilkington,
    2016）。整个过程需要计算能力，因此矿工需要投资于昂贵的设备和电力。矿工需要解决复杂的数学问题才能验证区块（Kar, 2016）。对于比特币和以太坊等流行加密货币，挖矿的竞争更为激烈。因此，挖矿成本也会上升。随着与加密货币挖矿相关的费用上升，加密货币的价值也必须随之上升（Hopp
    et al., 2017）。只要加密货币的价值高于成本，矿工就不会介意，对该特定加密货币的需求就会更大。因此，其价值也会开始上升（Hanna Halaburda
    & Guillaume Haeringer, 2018）。但一旦挖矿成本高于加密货币的价值，矿工就会面临损失，并且不再有兴趣挖掘该特定加密货币。因此，对该加密货币的需求下降，其价值也随之下降（Kar,
    2016）。


    ### 3.6 加密货币交易所


    与其他证券一样，加密货币也有自己的交易所，并在其中进行交易。比特币和以太币等知名加密货币在许多交易所中交易活跃。显然，加密货币交易所会列出最受欢迎的币种（Hopp
    et al., 2017）。


    但一些较小、不太流行的加密货币只在特定交易所提供。这使得对其感兴趣的投资者获得这些币种的机会受限。这些交易所会对加密货币的上架收取费用（Hopp et al.,
    2017）。


    当一种加密货币在多个交易所上市时，它会增加愿意购买的投资者中的需求，从而提高整体需求。随着需求增加，价格上涨（Lagarde, Christine (Ed.),
    2018）。


    ### 3.7 竞争


    随着加密货币成为投资者的另类投资选择，数千种不同的加密货币已进入市场。新竞争者的进入门槛相对较低（Aisen & Veiga, 2006）。但要创造一种可行的加密货币


