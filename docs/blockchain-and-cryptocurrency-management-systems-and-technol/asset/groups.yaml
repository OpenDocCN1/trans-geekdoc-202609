    The World Economic Forum (WEF) reported in July 2022 that cryptocurrencies are
    a type of virtual asset, primarily composed of cryptographic algorithms and distributed
    ledger technologies. This chapter intends to deal with virtual assets and online
    infrastructure such as Bitcoin, which are freely accessed, exposed, and permissionless
