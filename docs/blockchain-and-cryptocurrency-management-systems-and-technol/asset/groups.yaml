    \n## 3.12 加密货币的优势\n\n作为一种基于技术的金融产品，近年来，得益于软件、硬件和信息技术的巨大发展，加密货币在全球投资者中广受欢迎。加密货币无需银行和其他金融机构即可实现资金转移，这使得国际和跨境交易尤为便捷。因此，比特币和以太坊在这方面占据了有利地位。加密货币的优势可总结如下：\n\
    \n### 1. 抵御通货膨胀\n\n通货膨胀会降低产品和货币的实际价值。但投资者认为加密货币是一种能够抵御通货膨胀的产品。大多数加密货币使用相同的机制来保持对通货膨胀的免疫力（B.\
    \ Scott，2016，econstor.eu）。\n\n### 2. 交易速度快\n\n电子转账通常需要几个小时甚至几天，具体取决于各种因素，如发送方和接收方之间的地理距离、出发地和目的地的位置（尤其是国际和跨境交易）以及其他变量。相比之下，加密货币交易可以在几分钟内完成，为许多人提供了省心且具有吸引力的选择。\n\
    \n### 3. 交易成本低\n\n加密货币完成交易不需要任何第三方、机构或像VISA这样的支付网关的干预。因此，它们几乎可以免费帮助在全球转移资金。与加密货币相关的交易成本可能极低甚至可忽略不计（Investopedia：Adam\
    \ Hayes，2023年4月23日更新）。\n\n## 8. 运营透明度\n\n区块链形式的运营为加密货币提供了透明度。这种透明度使整个运营系统变得简单，并增强了投资者的信心，因为它消除了任何腐败的可能性。投资者可以通过平台上的区块链浏览器轻松监控其资金转账交易，从而实时跟踪实时转账（Coursera，2023年6月16日更新）。\n\
    \n## 9. 隐私性\n\n由于没有任何政府或机构的干预，整个系统具有一定程度的隐私性。投资者可以使用假名，借助其钱包密钥或地址进行交易，即无需透露其原始身份（Coursera，2023年6月16日更新）。\n\
    \n## 10. 与其他货币的兑换/流动性\n\n加密货币可以通过加密货币交易所兑换成其他广泛使用的流行货币，如美元、欧元、日元、英镑等。这为投资者的资金提供了巨大的流动性（Coursera，2023年6月16日更新）。\n\
    \n## 3.13 加密货币的劣势/缺点\n\n- 尽管加密货币声称是伪匿名的，但政府或政府机构在需要时可以追踪交易痕迹，因此存在干预的可能性。\n- 许多区块链采用工作量证明共识机制运行。要参与此类网络，个人通常需要使用强大的ASIC计算机，这些计算机会消耗大量电力并产生热量，使其成为一项昂贵的工作。\n\
    - 大多数加密货币没有关于交易的具体政策，例如无退款或取消政策（发表于：2021年第一届计算机科学与人工智能国际会议（ICCSAI），印度尼西亚雅加达）。\n\
    \n## 3.14 结论与未来研究展望\n\n加密货币似乎已经超越了新技术通常伴随的初始采用阶段，就像早期的机动车一样。比特币已开始建立自己的专业市场，这要么推动虚拟资产进一步进入主流，要么可能导致其衰落。\n\
    \n比特币社区正积极努力通过促进创新和解决长期挑战来融入主流应用。众多\n\n"
