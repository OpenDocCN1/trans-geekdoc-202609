    ## 5.5.4 案例研究4


    ### 5.5.4.1 Ekwateur，法国


    法国公司 Ekwateur 发展迅速，如今拥有超过 30 万消费者。该公司借助 BCT 记录所消耗能源的单位和来源。消费者能够了解所消耗能源的类型，而 BCT
    反过来又使消费者能够根据价格和来源定制自己的能源组合。该公司每 30 分钟对能源交易进行认证和结算，消费者可以选择最便宜的能源，这些能源可能来自家门口的屋顶，也可能来自居所附近的风电场。


    ## 5.5.5 案例研究5


    ### 5.5.5.1 Enerchain，德国


    Enerchain 是德国于 2017 年启动的一个项目，它开发了一种技术基础设施，通过消除中间商，利用 BCT 以去中心化的方式促进能源（尤其是电力和天然气）的批发交易。这是首个在电力和天然气市场实现现货和远期合约的项目，在很大程度上降低了运营成本。


