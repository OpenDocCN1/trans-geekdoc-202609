    better understanding of blockchain’s significance and its core concepts for designing
    the blockchain along with the challenges for the implementation of the blockchain
    system.


    Bansod Smita and Ragha Lata (2022) raise the concern of critical technological
    requirements for ensuring data privacy and protection in blockchain technology.
    They suggest security as one of the most important concern for the data. Many
    online transactions in today’s contactless digital world are sensitive and require
    security, for which blockchain gives promising solution. They also discuss the
    increasing emphasis on user privacy rights in existing and proposed data protection
    regulations across various countries. Their study also explores the use of Privacy
    Enhancing Techniques for cryptocurrencies by using efficient crypto-privacy algorithms.
    Their study offers significant contributions to the understanding of the dynamic
    field of data security and privacy in the digital age, serving as a basis for
    future progress in the realm of blockchain technology.


    Mukherjee Pratyusa and Pradhan Chittaranjan (2021) provide a comprehensive analysis
    of the historical development of blockchain technology. They include detailed
    explanations of two fundamental concepts in blockchain, namely the consensus mechanism
    and the structure of a block. They also discuss about the evolutionary phases
    of blockchain technology with the characteristics of each generation. They define
    “Blockchain” as secured linked ledger created through blocks of hash functions.
    They further elaborate upon the fundamental principles behind blockchain technology,
    including cryptography, decentralization, immutability, and transparency. They
    then discuss the inclusion of descriptive test scenarios within the realm of supply
    chain management, with the objective of improving understanding of the practical
    implementations of blockchain technology in supply chain management.


    Kamath Reshma (2018) provides a comprehensive study, which demonstrates the key
    part that blockchain technology can play in the revolutionary process of improving
    supply chain management as well as food safety. The author discusses about the
    adoption of blockchain technology in food supply chain management system as a
    future for maintaining global food ecosystem. The study emphasizes the significant
    cost reductions and enhanced visibility in the management of the food supply chain
    that Walmart effectively accomplished. In the study, the author mainly focuses
    on challenges as well as opportunities in implementing blockchain technology for
    the food supply chain management ecosystem on a global scale. She examines IBM’s
    blockchain solution, built upon the Hyperledger Fabric framework citing successful
    implementation by Walmart of two blockchain pilots’ programs in both China and
    the United States of America.


    Samsir N and Jain A (2022) discuss about the working of blockchain by understanding
    the structure of block and transaction. They present the significance of consensus
    algorithms as well as the workings of these algorithms in depth. In addition to
    this, they also present an in-depth review of a few important consensus algorithms,
    including proof of work (PoW), proof of stake (PoS), practical Byzantine fault
    tolerance (PBFT), delegated proof of stake (DPoS), and Tendermint. Their study
    provides insight into the relative merits of different algorithms by analyzing
    and contrasting them.'
