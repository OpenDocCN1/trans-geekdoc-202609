    # 1 Blockchain Adoption for Sustainable Management System


    Sumanta Choudhury and Uddipan Nath


    # 1.1 THE FUNDAMENTALS OF BLOCKCHAIN


    Blockchain functions as a real-time distributed ledger system (Panda et al., 2021).
    It can be visualized as a digital equivalent of a bank ledger, meticulously recording
    financial transactions between accounts. Unlike conventional data models in which
    a single entity wields control, a distributed ledger empowers multiple parties
    to collectively manage data following a mutually agreed-upon framework. Data is
    inscribed only when a consensus among the involved parties is reached, obviating
    the need for pre- and post-processing reconciliation. This mechanism guarantees
    that all stakeholders perceive identical information, promoting unanimity on the
    recorded facts.


    Transactions are grouped into blocks, and each block accommodates a multitude
    of transactions (Wu et al., 2023). These blocks are intricately linked, forming
    an unbroken chain. In the realm of blockchain-based networks, a vast network of
    computers known as nodes preserves a comprehensive copy of the blockchain ledger.
    Remarkably, this ledger is not confined to a central authority, but instead spreads
    across myriad participants worldwide. Each node autonomously scrutinizes transactions
    adhering to predefined criteria. Only when the entire network harmonizes on a
    consensus does a transaction gain confirmation and find its place on the blockchain.


    Blockchain gets its name from its method of storing transaction data: in blocks
    that link together to create a chain. As transactions increase in number, so does
    the blockchain itself. These blocks serve to record and verify the timing and
    order of transactions, which are then permanently added to the blockchain. All
    of this occurs within a well-defined network, governed by rules agreed upon by
    its participants.


    Each block comprises a hash, which acts as a unique identifier (Wu et al., 2023)
    or digital fingerprint, along with batches of recent valid transactions marked
    with timestamps. Additionally, it includes the hash of the preceding block. This
    connection via the previous block’s hash ensures that no block can be altered
    or inserted between two existing blocks. Consequently, each new block reinforces
    the validation of the previous one, fortifying the entire blockchain. This approach
    imbues the blockchain with tamper-evident properties, a cornerstone of its immutability.'
