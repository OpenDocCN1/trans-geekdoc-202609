    ### 10.1 引言


    在金融交易中，所交易货币的合法性和真实性是一个关键问题，无论它们涉及实物纸币还是数字版本。接收方必须确认他们收到的任何传统纸币或法定货币是合法的，而不是伪造的。同样，在数字交易中，当资金以电子方式从一个账户转移到另一个账户时，银行对于确认相关银行账户的合法性至关重要（印度储备银行，2021）。然而，一些人设想了银行不再参与这一等式的场景，这种想法有可能减少对中介机构的需求（印度储备银行，2021）。这种动机可归因于多种因素，例如对银行的不信任、金融机构收取的过高交易成本，或交易追踪带来的隐私担忧。


    为了回应这种避免银行和其他中介机构参与的愿望，人们开发了私人协议来简化交易。然而，电子货币带来了一个重大问题，因为它容易复制，因此可能被再次使用。双重支付现象严重阻碍了这些替代交易机制的可行性。比特币被作为这一问题的解决方案提出，它基于区块链技术（Orcutt，2017）。通过要求在区块链的每个连续区块中进行更改，使用这种技术进行的交易会被广播到网络中的所有计算机，从而有望消除双重支付的可能性。


    货币对每个人来说都是必不可少的，它的使用满足了各种人类需求。在以现代化和全球化为标志的第四次工业革命到来之际，区块链技术应运而生，催生了加密货币。加密货币是一种去中心化的数字货币，代表一种没有物理形态的虚拟货币，可确保安全且无法追踪的交易。


    以及以太币。USDT 与美元挂钩，旨在保持每枚 USDT 的价值稳定在 1 美元。这种稳定性是通过 Tether 以价值 1 美元的现金或现金等价物储备资产支持每一枚
    USDT 来维持的。然而，必须指出的是，稳定币在没有政府监管或监督的情况下运行。这凸显了在投资稳定币之前进行深入研究和尽职调查的重要性，包括仔细审查白皮书，并了解该稳定币如何管理其储备资产（DeVries，2016）。


    ### 10.2.4 中央银行数字货币（CBDC）


    中央银行数字货币（CBDC）是一种由各国中央银行发行的加密货币。这些数字货币以代币形式或通过与国家本币挂钩的电子记录形式发行，由各自的中央银行进行监管和控制。尽管在许多国家，将
    CBDC 融入金融体系和货币政策仍处于初期阶段，但未来有可能得到更广泛的采用。与传统加密货币类似，CBDC 利用区块链技术，旨在提高支付效率并可能降低交易成本。虽然全球各中央银行正在持续开发
    CBDC，但其中一些与比特币等成熟加密货币共享基本原理和技术。


    CBDC 以代币形式或电子记录形式发行以进行所有权验证，这使其与现有加密货币保持一致。然而，CBDC 的不同之处在于，它们受到发行政府的密切监控和监管，放弃了通常与其他加密货币相关的去中心化、匿名性和抗审查优势。CBDC
    会留下可追踪的交易“纸质记录”，使政府能够征税和收取经济租金。从积极的一面来看，在政治稳定和通胀受控的环境中，CBDC 预计会随着时间的推移保持其价值，或至少密切跟踪所挂钩实物货币的价值。CBDC
