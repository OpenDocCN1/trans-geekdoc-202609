    在 BCT 的帮助下，泰国发展了点对点能源交易。自 2022 年以来，该公司每月成功交易约 112 兆瓦的太阳能。TDED 以不同的方式处理能源问题，通过教育人们并改变他们采用太阳能技术的行为，有效地开启了能源交易的新旅程。TDED
