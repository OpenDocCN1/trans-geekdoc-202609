    ## 3.10 印度现状


    印度政府至今尚未宣布加密货币在印度具有合法地位。因此，迄今为止尚未出台相关监管规定。加密货币在印度的运行既不受监管，也不由任何中央机构发行。在这一缺乏监管的环境中，处理加密货币相关事务时没有专门的争议或分歧解决指南，这一点尤为突出。因此，若有意参与者想要交易加密货币，就必须自行承担风险。不过，根据印度储备银行行长和印度尊敬的财政部长尼尔玛拉·西塔拉曼女士迄今发表的声明和表明的立场，我们可以明确地说，截至目前，加密货币在印度并未被禁止。印度财政部长已对加密货币征税，由此引发了有关加密货币在该国法律地位的讨论与辩论（Hanna
    Halaburda & Guillaume Haeringer, 2018）。与此同时，政府也采取了相关措施，计划推出印度自己的加密货币，并建立交易所，以监管加密货币交易和投资（Saito,
    2014）。截至2022年，加密货币基本处于不受监管的环境中运行。然而，2022年联邦预算案宣布对加密货币收益征收30%的税，并在源头扣缴1%的税款，情况由此发生变化。这一举措明确了印度官员的意图。大多数参与者赞成这一做法，并认为这是推动加密货币在该国获得官方认可的第一步（Saito,
    2014）。


    ### 3.10.1 比特币


    DeVries（2016）指出，比特币是目前使用最广泛、最受欢迎的加密货币。作者还认为，比特币的生成数量有限，这可以防止加密货币在经济中过度供应，并保持其稀缺性。Kelly（2014）进一步解释说，比特币的价值具有主观性。这意味着，只要用户在支付或进行其他交易时仍然相信或信任比特币的用途，其价值就会持续存在并继续增长。另有观点指出，比特币并不像黄金、钻石或其他实物那样具有内在价值。


    尽管加密货币尚处于起步阶段，但如果获得认可，它们将成为全球经济中使用和交易最广泛的货币。据 Team 2016 所述，BitPay 是全球最大的比特币处理商，其交易量增长了110%。交易量的增长表明这种货币的接受度正在提高。本章将利用2016年至2023年间的
    BTC-USD 历史价格数据集，探讨比特币的现状。加密货币的普及将吸引学术研究人员的广泛关注。影响人们对加密货币认知和接受程度的因素仍有待发现和研究，相关领域具有巨大的研究空间（Rothstein
    & Uslaner, 2005）。


    根据以往研究，比特币的设计优势在于供应量有限。每四年，比特币的新增发行量都会递减，直至达到2100万枚的供应上限（King 2013）。比特币的稀缺性是决定其市场价值的重要因素。作者还称，比特币的稀缺性可以防止其在市场上过度供应，进而影响金融稳定性和风险（Magro,
    2016）。Magro 还指出，除比特币以外的其他加密货币能够避免因政府政策变化而引发的通货膨胀，为投资者提供安全的投资环境。与其他货币一样，比特币也会受到外部不确定因素的影响而出现价格波动。比特币兼具交易安全这一优势，同时又存在价格不稳定的问题；凭借这两方面的特点，比特币在2015年依据美元指数被评为最佳货币，这可以视为全球经济中的一个里程碑事件。


    文献表明，全球经济中的比特币交易量大幅增长。2014年至2015年间，南美洲的比特币交易量增长了510%。


    比特币要获得广泛的用户认可，仍面临若干重大挑战。一个主要问题是其价值频繁且大幅波动，这给用户和投资者都带来了不确定性。价值波动削弱了人们对加密货币日常保值能力的信任，从而动摇了人们对这类数字货币的整体信心。根据
    PwC 于2015年开展的一项调查，受访者中有83%对比特币知之甚少或完全不了解。加密货币缺乏集中控制，这也带来了独特的挑战。试图通过广告活动消除认知不足，可能会无意中使竞争公司受益，因此不利于制定营销计划（McMillan,
    2014）。此外，加密货币领域还发生过欺诈和盗窃事件，这些事件往往源于交易所系统中的漏洞。此类安全漏洞经常成为新闻头条，进一步阻碍公众将这些平台视为安全的投资场所（McMillan,
    2014）。


    此外，加密货币的使用还面临明显的监管空白。只要数字货币仍处于法律灰色地带，用户的接受程度就会受到限制。用户必须确信，涉及加密货币的交易具有法律约束力，并符合现行法律法规。市场和政府往往难以迅速适应新兴技术，这加剧了建立人们对比特币及其他加密货币信任的难度（Saito,
    M. 2016）。加密货币面临的另一项重大挑战，是在获得广泛用户认可之前，必须应对美国复杂的监管体系。美国政府尚未提供一项


    **正态性**：误差来自一个均值和方差未知的正态分布，这些参数可以根据数据估算。利用这一假设，可以通过成熟的解析表达式计算“置信”区间。


    **多重共线性**：对于多元线性回归，必须满足这一假设，即预测变量之间应当不存在或仅存在极弱的线性依赖关系。


    线性回归方程可表示为：


    $Y = \beta0 + \beta1 X$


    - 其中，$Y$ = 比特币价格。

    - $X$ = 比特币交易量。

    - $\beta0$ = 回归最佳拟合直线的截距。

    - $\beta1$ = 自变量的系数。


    模型假设的验证结果如图3.2所示。


    随后，采用时间序列预测流程，基于每日季节性将模型拟合到向量中。时间序列预测是一种广受欢迎的研究方法，广泛应用于不同领域，尤其是高频交易。通过构建精确的预测模型，预测交易工具的未来价格，时间序列预测模型可以为交易者提供有效优势。本章将着重开发


    ![](img/4912d151d56a592b7c7c477c5efa929c_72_0.png)


    图3.2 验证模型假设。


