    ![](img/4912d151d56a592b7c7c477c5efa929c_150_0.png)


    图 6.3 调查详情。来源：作者。


    ### 6.19.1 调查


    调查在印度开展，重点地区是班加罗尔，即“印度硅谷”，当地大多数居民都了解数字签名。本次调查旨在为理论研究提供支持。调查问题参考了 Arlen Fink 所著《调查工具包：如何设计调查问题》第二版，并借鉴了“Survey
    Monkey.com”提供的建议。调查对象包括非技术和技术领域的普通公众，但不包括文盲。调查问卷仅设计了简单问题并进行发放，主要为是/否类问题，此外也包含选择题。


    本次调查旨在了解印度民众对数字签名的认知情况。研究人员从印度各地随机选取约 150 人回答问题，参与者主要来自班加罗尔。大部分数据通过请参与者填写问卷和进行访谈收集。此外，还通过电话访谈、Google
    Meet 和 Microsoft Teams，使用名为“Qualtrics”的在线软件收集参与者数据。访谈中也询问了相同的问题。实际上，根据参与者对前序问题的回答，有些问题会被跳过。


    ### 6.19.2 参与者的选择


    调查参与人数取决于总体规模和统计中允许的误差。由于时间有限，且本调查旨在为理论研究提供支持，研究人员选取了 150 名参与者。图 6.4 清楚地展示了参与者的筛选过程。


    ![](img/4912d151d56a592b7c7c477c5efa929c_151_0.png)


    图 6.4 参与者的选择。注：35 岁以下的人也都在 18 岁以上。被归类为文盲的人没有接受访谈或调查。来源：作者。


    ### 6.19.3 调查结果


    由于调查对象涵盖受教育者和文盲等不同群体，问题设计得较为简单。调查旨在收集数据，为以下内容提供信息。


    - 互联网用户与人口总数的比较。

    - 根据调查得出的互联网用户情况。

    - 数字签名用户。

    - 他们从何处获得数字签名。

    - 他们如何描述数字签名的重要性。


    ### 6.19.4 互联网用户


    印度人口在 2020 至 2023 年间持续增长，已达到 14.2 亿。与此同时，互联网用户数量也在增加，这是一个积极的趋势。图 6.5 展示了人口与互联网用户数量的对比。


    ![](img/4912d151d56a592b7c7c477c5efa929c_151_1.png)


    图 6.5 印度人口与互联网用户数量对比。来源：作者。


    图 6.6 展示了不同年龄段的互联网用户人数。


    男性中，60 名 35 岁以上者有 39 人是互联网用户；而在 35 岁以下者中，40 人里有 28 人是互联网用户。女性中，35 名 35 岁以上者有 26
    人是互联网用户；而在 35 岁以下者中，15 人里有 11 人是互联网用户。收集这些数据是为了了解有多少人虽然使用互联网，却没有使用数字签名。因此，随着数字签名普及度的提高，可以预期这些人也会成为数字签名用户。


    ![](img/4912d151d56a592b7c7c477c5efa929c_152_0.png)


    图 6.6 不同年龄段的互联网用户。来源：作者。


    调查还提供了参与者使用互联网频率的信息。瑞典参与者使用互联网的频率相较于印度参与者更高。大多数印度参与者每周几乎每天都会使用互联网，主要用于查看电子邮件和社交网络。


    ### 6.19.5 数字签名用户


    图 6.7 展示了所选参与者中数字签名用户的人数。在印度，150 人中有 32 人使用数字签名。数字签名用户大多属于 35 岁以下年龄组。35 岁以下人群中有
    25% 使用数字签名，而 35 岁以上人群中只有 20% 使用。这并不令人意外，因为在印度，35 岁以下年龄组的互联网用户比 35 岁以上年龄组更多。


