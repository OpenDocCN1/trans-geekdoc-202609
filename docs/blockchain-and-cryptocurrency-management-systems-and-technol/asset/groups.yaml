    该调查提供了人们对数字签名了解程度的信息。参与者被问及数字签名在哪里使用？对此，大多数参与者回答“用于电子邮件身份验证”，也有人回答用于 ITR（所得税申报）目的。还有一些人说用于文件验证。有些参与者是特许会计师，因此他们完全了解其用途。参与者了解数字签名，但并不完全了解数字签名的使用地点和方式。每位参与者都被问及数字签名在当今世界的重要性，了解数字签名的人回答称，不断发展的技术还带来了安全性和时间节省。甚至银行中数字签名在
    KYC（了解你的客户）表格中的使用也被讨论过。不使用数字签名的人认为 DS（数字签名）很复杂，不愿使用它。


    ## 6.19.7 访谈


    我们对五家已注册的金融科技公司进行了访谈。所有注册公司都了解强制使用的数字签名。由于这些公司是金融科技公司，它们都是在数字签名强制实施后成立的。


    本章对数字签名及其法律的历史发展提供了清晰的视角。它还提供了关于数字签名、其工作原理以及使其更安全、更可信的详细信息。本章由


    使用互联网银行的网站完成。银行拥有所有清晰且经认证的数字签名信息，可以向公众传播。但在印度，只有 14 家认证机构（参见表 6.1），公众可以在那里获得数字签名（3
    类数字签名）。除此之外，对于 2 类数字证书，需要带有视频通话的 PAN 卡。通过使产品在银行和邮局等公众更容易接触到的地方可用，可以提高数字签名的可用性。D-mat
    账户访问已提供给所有银行，因此公众投资股市的比例大幅增加。除此之外，数字签名服务的改进使人们能够购买更多的数字签名。当使用量增加时，意识也会增加。


    ## 6.22 未来工作


    发展中国家可以在本国实施数字签名时借鉴发达国家。2023 年，全球数字签名市场规模估计约为 59 亿美元，预计将以 40.98% 的复合年增长率（CAGR）增长，到
    2032 年达到约 1298.2 亿美元。推动市场需求的因素包括对安全且具有法律约束力的电子签名日益增长的需求、政府法律以及电子文件需求的扩大。从地理上看，北美引领市场，原因包括数字技术使用的增长、对安全高效文件管理的需求，以及
    Adobe Inc.、DocuSign Inc.、OneSpan Inc. 和 HelloSign Inc. 等重要参与者的存在。


    提供电子签名解决方案以验证和签署电子文档的行业被称为“数字签名市场”。密码技术是数字签名的基础，确保所签署文档的真实性和完整性。由于政府、银行和金融服务、医疗保健、教育等一系列行业对安全和可执行的电子交易的需求日益增长，数字签名市场正在迅速扩张。该技术的众多优势中包括价格实惠、成本效益高和使用便捷。物理签名不再必要，因为数字签名可以通过各种设备（包括电脑、平板电脑和智能手机）随时随地进行签名。此外，它们还提供了出色的安全性，因为数字签名的密码方法可确保文本、文件和文档未被篡改。


    ## 6.23 关键市场挑战


    数字签名是使用加密技术来验证签名者身份和已签署文档完整性的电子签名。它们提供了一种安全高效的方式来签署和传输电子文档，但缺乏标准化阻碍了它们的广泛采用。存在多种数字签名格式，不同国家在认可和监管数字签名方面也有不同的法律框架。


    ## 7 面向重点应用的 AI 融合区块链技术


    C. Venkataramanan, S. Dhanasekar,

    V. Govindaraj, K. Martin Sagayam, and P. Geetha


    ### 7.1 引言


    区块链是一种以分布式方式构建的数据库，用于不可变地保存数据（Verma 等，2022）。相互连接的区块安全地连接在一起，用于跟踪和建立信任。如果某个区块中的任何交易需要更新，那么在不修改后续区块的情况下就无法更改它。根据定义，它维护一个有序数据记录（即区块）列表，其中包含有关其前一区块详细信息的信息（Zerka
    等，2020）。数字化将涵盖大多数工程领域，对涉及快速数据传输的广域通信网络产生更大影响（Dhanasekar 等，2022；Dhanasekar 等，2021；Neebha
    等，2023）。链式结构是去中心化的，数据可以在感兴趣的区域上记录，并且在不影响后续区块的情况下无法更改（Raja 等，2022；Firouzi 等，2022）。区块链以数字方式记录信息。区块链与传统数据库的主要区别在于，区块链中的数据以结构化方式存储。它以组（即区块）的形式收集信息。每个区块都有存储容量，一旦填满，就会与其前一个区块连接，形成链（Govindaraj
    等，2023；Bruntha 等，2022）。新填满区块中的每条信息都与前一个区块相连，继续形成链，这被称为区块链。每当区块与链关联时，都会给出一个精确的时间戳（Firouzi
    等，2023）。在没有任何第三方协助的情况下，区块链技术确保了数据的完整性和安全性。


    它是一种先进的数据库技术，允许在网络内以透明方式共享信息。来自多个来源的数据通过区块链云环境进行收集和共享（Bansal 等，2022）。链中的每个区块包含一个唯一的加密哈希
    ID，从而避免数据重复。该技术的主要特点是，未经相关方知晓，数据无法进行交易（Wazid 等，2023）。


    ![](img/4912d151d56a592b7c7c477c5efa929c_160_0.png)


    图 7.2 区块链过程的生命周期。来源：作者。


    ## 2. 验证过程


    然后，输入的记录通过区块链分布式网络在感兴趣的区域中共享。网络中的相应节点验证其资源，以有效执行给定的交易。


    ## 3. 新区块形成


    在给定时间，大量交易经过验证并被认定为合法。然后，合法交易被合并在一起形成区块。


    ## 4. 共识机制


    由合法来源形成的区块会被尝试添加到区块链网络中。如果所有节点同时尝试执行该过程，则会影响区块链的运行。为了解决这个问题，节点使用共识机制。共识机制允许节点安全地将区块仅添加一次到网络中，并确保其他节点不会重复该过程。参与共识过程的来源称为矿工。共识算法为目标区块生成哈希码，并将其添加到区块链中。


    ## 5. 新区块的添加


    一旦区块获得其哈希密钥并通过验证，就可以添加到区块链中。区块链的每个区块都包含有关前一个区块的信息以及目标区块如何与区块链中其他区块连接的详细信息。新形成的区块可以公开添加到网络中，并位于其末端。


    ## 6. 交易完成


    一旦区块连接到区块链网络，记录交易过程即完成，有关交易的全部细节将永久地在区块链网络中共享。任何感兴趣的人都可以检索网络中共享的记录并确认它们。


