    数字证书的执行（创建、分发、批准）是 PKI 框架的关键。数字证书的功能类似于真实的身份证，是一种经电子方式识别的证明卡。它由认证机构（验证官）提供。人们可以用它与他人建立联系并了解彼此的身份。在书面文件中，签署旨在确认文件。此外，它还有两个目的：第一，它确保文件的真实性和可靠性，因为人们难以否认自己的签名，而这正是对文件上所作标记的验证；第二，它确保文件的合法性和真实性，因为数字签名使用了非对称密码学，签名很难被篡改。


    公钥基础设施（PKI）是一个用于创建、管理、分发和跟踪公钥证书的服务框架。PGP 是 PKI 标准的一种变体，它同时使用对称密钥和公钥密码学，但在如何将公钥与用户身份关联方面有所不同。PGP
    使用“信任网络”，而 PKI 使用 CA 来验证用户身份并将其与数字证书关联。PGP 用户自行决定验证哪些身份以及信任谁。PKI 用户则信任信誉良好的 CA。


    私钥安全性的强度决定了数字签名的安全程度。如果没有 PKI 或 PGP，识别某人或撤销已泄露密钥将变得更加困难，恶意行为者也更容易冒充合法个人。


    ## 数字签名与电子签名的区别


    | 数字签名 | 电子签名 |

    |---|---|

    | 不仅使用算法，还使用密码学过程来验证数据序列，以核实签名的来源和文件的真实性。 | 使用附加或关联到合同或记录上的电子声音、符号或过程来核实签名的来源。
    |

    | 必须由证书颁发机构（CA）签发。它是电子签名的一种类型。 | 可以是任何以电子方式应用的签名。它是一个更广泛的术语，其定义中包含数字签名。 |

    | 提供密码学证明，证明文件和签署人签名的真实性与完整性。 | 确认签署人签署文件的意图，但并不总是提供签署人身份或文件完整性的证明。 |


    在提供了数字签名的理论背景、用途和类别之后，接下来讨论文献综述。


    ## 6.6 文献综述


    根据 Hart（1998）的观点：


    > 文献综述是相关主题上可用文献的集合，这些文献可以是已发表的，也可以是未发表的。文献综述包括从某一明确视角出发所获取的数据、信息、观点和证据。该视角应具有特定目标，并应说明该主题将如何被研究。


    从传统角度来看，书面签名用于验证和批准纸质文件，是提供真实性的一种非常好的方式。电子文件也需要类似的程序。数字签名满足了电子文件验证和鉴别的需求，它只是通过应用数字签名算法生成的一串
    0 和 1。验证（verification）指的是确认文件发送者的过程，而批准（approval）则指确保文件内容的方式。在讨论数字签名和传统签名的特征时，消息与文件这两个术语之间没有区别（Cabanellas
    2018）。传统签名的显著特征如下：相对容易证明签名是真实的；难以伪造；不可转让；难以更改；并且不可抵赖，确保签署人事后不能否认签署。鉴于数字签名正被用于敏感但有用的应用中，例如安全电子邮件和互联网上的信用卡交易，它应当具备上述传统签名的所有特征，并且还应具备更多特征。


    鉴于数字签名仅由 0 和 1 组成，它应当具备以下属性：必须相当容易生成；必须普遍易于理解和验证数字签名的有效性；在计算上必须不可能通过为给定消息伪造数字签名，或为现有数字签名构造另一条消息来制造数字签名；签名必须是一种依赖于被签署消息的设计（因此，对于同一签署人，不同文档的数字签名是不同的）；并且必须使用发送者独有的某些数据，以防止伪造和抵赖。此外，数字签名的副本必须有用，以便于未来关于其不可抵赖性的讨论（Elisa）。目前已开发出多种称为验证程序的技术，以确保收到的文件确实来自承诺的发送者，且内容未被更改。然而，由于确认系统并不完善，消息验证过程不能直接用作数字签名（Duggal
    2002）。例如，消息验证保证两方在交换消息时没有外部人介入，但并不能保证两方不相互争执。基本的验证策略所产生的签名在扩展后与消息等长。重要概念和术语。需要被各方认可的文件（消息/数据）以及发送者独有的某些私人信息，决定了数字签名的处理方式。实际上，为了获得消息摘要，是对消息应用哈希函数，而不是使用完整消息。在这种特定情况下，哈希运算在接收一个自行确定的近似值后，会生成一个固定大小的消息摘要作为输出。


    ### 6.9.2 最低限度法律


    顾名思义，这些法规允许电子签名在限制很少的情况下被广泛使用。这些法律不针对特定技术，并允许所有用户使用电子签名。最低限度规则就像盾牌一样，提供最广泛的保护，并且在大多数情况下都有效。这类规则在加拿大、澳大利亚、新西兰和美国等国家很常见。


    ### 6.9.3 两级法律


    两级规则赋予数字签名作为证据更高的权重，并允许使用电子签名。这是规定性立法和最低限度立法的结合。与最低限度法律类似，两级法律也像规定性法律一样建立一类经授权的技术，但它们同时以技术中立的方式接受全部或大多数电子签名。中国、韩国和大多数欧洲国家已实施两级电子签名规则。


    ## 6.10 了解世界各地的数字签名法律


    ### 6.10.1 美利坚合众国


    统一法律委员会于 1999 年制定了《统一电子交易法》（UETA），为电子签名的使用建立了法律框架。美国国会于 2000 年通过了《全球和国家商务中的电子签名法》，以确保以电子方式订立的合同的合法性和有效性，从而促进电子记录和电子签名在州际和国际商务中的使用。所有商业协议和金融合同均通过数字签名完成。如今，电子签名等同于书面签名。无论是什么文件，电子签名都具有完全的法律效力。在这里，即使是未经国家认证的企业也在签发
    EDS。因此，不存在任何认证中心。除房地产、医疗保健和政府合同等高度负责的领域外，签名分类也不存在。签署协议的必要性是美国法律这一领域的一个显著特点。这意味着企业需要撰写一份合同，阐明其开展业务和提供基本书面文件的共同承诺。


    ### 6.10.2 联合王国


    英国属于最早使用 EDS 的国家群体之一。这意味着电子签名与书面签名具有同等的法律效力和完整的法律效力。此类证书在法庭上将与同类书面文件一样有效。特别鼓励中小企业采用
    EDS。


