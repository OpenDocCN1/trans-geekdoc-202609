    # 1.2 BLOCKCHAIN''S IMMUNITY TO CHANGE: THE FIVE PILLARS OF IMMUTABILITY


    The term “immutable” refers to something that cannot be changed, modified, or
    altered. When this term is applied to a blockchain, it means that the data or
    information stored within the blockchain is considered permanent and unchangeable
    once it has been recorded and confirmed in a block. Immutability is a fundamental
    characteristic of blockchain technology, as it ensures the integrity and trustworthiness
    of the data stored on the blockchain, making it resistant to unauthorized tampering
    or modifications. Blockchain is considered immutable primarily due to its structure
    and the consensus mechanism it employs. Here are the key reasons why blockchain
    is considered immutable (Panda et al., 2021).


    +   - **Cryptographic Hashing:** Each block in a blockchain contains a cryptographic
    hash of the previous block’s data, including its own hash. This forms a chain
    of blocks, with each block intrinsically linked to the one before it. Changing
    any information in a block would require recalculating the hash for that block
    and all subsequent blocks. This is computationally infeasible, making it extremely
    difficult to alter any information in a completed block without detection (Panda
    et al., 2021).

    +   - **Decentralization:** Blockchains are decentralized networks, which means
    that multiple copies of the ledger exist across numerous nodes (computers) within
    the network. This decentralization ensures that no single entity or central authority
    has control over the entire blockchain. To alter a block, an attacker would need
    to compromise the majority of nodes in the network work simultaneously, which
    is highly improbable in a well-established and secure blockchain.

    +   - **Consensus Mechanism:** Blockchain networks rely on consensus mechanisms
    to validate and agree on the contents of new blocks. In the case of popular blockchains
    like Bitcoin and Ethereum, the consensus mechanism is proof of work (PoW), where
    miners compete to solve complex mathematical puzzles. Once a block is added to
    the blockchain, it requires the consensus of the majority of participants to alter
    or remove it. This consensus process adds another layer of security against tampering.

    +   - **Transparency:** Blockchain transactions are transparent and visible to
    all participants in the network. Any unauthorized changes made to a block’s data
    would be immediately noticeable to the network participants, making it nearly
    impossible to tamper with the information without being detected.

    +   - **Timestamps:** Each block contains a timestamp that records the exact time
    when the block was added to the blockchain. This chronological order of blocks
    further reinforces the immutability of the data, as it becomes evident when someone
    tries to alter historical transactions.


    These combined features create a robust and tamper-resistant system, making it
    exceedingly challenging to change data once it has been recorded on a blockchain.'
