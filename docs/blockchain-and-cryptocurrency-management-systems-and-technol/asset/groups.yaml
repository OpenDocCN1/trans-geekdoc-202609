    R. L., Adamashvili, N., & Tricase, C., 2022）。


    为了保障密钥安全，每条链的认证机制必须与其他比特币指纹采集数据相关联。区块链采用的另一个障碍是区块链框架缺乏标准化。由于不同架构在集成方面存在困难，这可能会妨碍医疗机构通过实施区块链架构来建立业务联系。此外，实际实施中的监管限制使得智能合约在许多国家无法落地。最后，能源浪费方面的可持续性问题始终存在。与集中式、非复制数据源相比，公共区块链会消耗更多电力。另一方面，专家和利益相关者正在努力克服分布式账本技术的限制。近期的立法措施、组织合作以及更高效区块链框架的进步，都只是区块链采用能够得到推动的几个实例。


    ## 11.9 新冠肺炎疫情下区块链应用的前景


    COVID-19 全球疫情对人类居民以及几乎所有企业和市场产生了巨大影响。医疗旅游在全球范围内受到多方面的影响。许多国家限制人员流动，实施了长期封锁、宵禁和其他形式的社会隔离。许多航空公司，特别是飞往热门医疗旅游目的地的航空公司，以及本地和城际交通、若干旅游行业企业都停运了。COVID-19
    对医疗旅游目的地的医疗系统造成了重大影响。许多医院不得不治疗 COVID-19 病例，并设立 COVID-19 康复单元，而不是为国际医疗游客提供病房或治疗单元。大多数医院只能执行安全规程；非必要程序被推迟或取消。此外，医疗服务提供者的
    COVID-19 安全措施对于维持全球医疗游客所认可的优秀质量和创新性至关重要。尽管疾病爆发给医疗旅游市场带来了困难，但区块链技术的使用仍可能存在若干机会。首先，区块链技术更有可能被用作安全数据库，用于存储和分发患者的健康记录，供多名患者和医疗专业人员使用。在促进远程医疗方面，疫情迫使医疗旅游行业实现数字化。世界各地的医生可以通过内容和远程会议技术讨论并治疗国内外客户。有时需要讨论多位医生的意见，或者需要替换执业医生。在这些情况下，医生可以安全、及时地将必要信息发送给医生们。


    首先，区块链可用于创建和验证 SSL 签名，以证明医疗旅游服务提供商的高质量认证。在疾病爆发时，外国患者更倾向于选择经过认证的国内医疗旅游提供商，以确保符合世界卫生组织指南和适用的公共医疗法规。基于区块链的系统将确认金融机构和受益人的凭证，重在确保证书的真实性，并揭露伪造的认证。此外，区块链还可用于创建包含
    PCR 检测结果和其他健康文件的虚拟凭证。PCR 检测凭证是旅行者在离开和试图进入一个国家时必须满足的最低标准之一。区块链确实可以消除凭证伪造和滥用，确保其真实性。此外，访客将完全掌控这些文件，并能向需要这些文件的官员出示（Srivastava
    et al., 2021）。


    最后，分布式账本有潜力为医疗旅行者签发签证。医疗游客访问医疗旅游目的地时通常需要签证。签证处理需要时间，而在紧急情况下，医疗游客没有太多时间等待居留许可。区块链能够通过有效管理所有出行相关的官方文件（如居留许可的签发）来大幅减少等待时间。


    ## 11.10 结论


    本章的主要目标是扩展以往的研究，并丰富现有关于区块链技术在医疗旅游中优势的文献。早期研究考察了医疗旅游在手术前后数据创新的影响；然而，它们并未集中在区块链的有益作用上。为了增加知识积累，本章主要关注区块链技术的潜在战略作用，并概念化了区块链技术对医疗旅游两个主要阶段（治疗过程中和治疗后）的益处。


    因此，本章认为，医疗游客和医疗服务提供者都可以从区块链技术的使用中受益，包括更便捷地找到医疗服务提供者、更快更安全的支付方式、有保障的数据安全和隐私，以及可信赖且备受推荐。此外，本章通过提出这些现代特性对医疗旅游行业的未来影响，扩展了旅游研究中关于区块链的现有文献。鉴于
    COVID-19 疾病的爆发，本章既及时又切题。疫情影响了整个旅游业，包括医疗旅游。为解决这一问题，本章总结了医疗旅游行业因疫情而面临的若干挑战，并概述了当前情况下区块链技术使用的一些机会，例如减少所有旅行相关政府文件（包括居留许可签发）的等待时间，以及确保这些记录的真实性。


    尽管本章提供了关于区块链技术在医疗旅游中优势和潜力的多个视角，但它确实存在一些局限性。由于本章仅关注医疗旅行在手术前后的多个阶段，其范围受到限制。此外，需要更深入的定性方法以及实证研究，以提高我们对区块链在医疗旅游业务中潜力的认识。开展评估研究以发现可能受到区块链技术使用影响的更多医疗保健服务潜在领域至关重要。此外，研究者必须面对创新的困难以及在医疗旅游行业中使用区块链技术的威胁。


