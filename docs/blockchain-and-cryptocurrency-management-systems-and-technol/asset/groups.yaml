    # # 10 Decoding Cryptocurrency

    ## *A Digital Revolution in Transactions*


    Kyvalya Garikapati,

    Akash Bag, and Sambhabi Patnaik


    # 10.1 INTRODUCTION


    The legitimacy and authenticity of the currency being traded is a key problem
    in financial transactions, whether they include actual paper money or digital
    versions. Recipients must confirm that any traditional paper or fiat currency
    they receive is legitimate and not a counterfeit. Similarly, as money is transferred
    electronically from one account to another in digital transactions, banks are
    crucial in confirming the legitimacy of the involved bank accounts (Reserve Bank
    of India, 2021). However, some people have imagined a scenario in which banks
    are no longer a factor in this equation, which is a notion with the potential
    to reduce the need for intermediaries (Reserve Bank of India, 2021). This motive
    can be attributed to several things, such as mistrust of banks, excessive transaction
    costs imposed by financial institutions, or privacy worries brought on by transaction
    tracking.


    Private agreements were developed to ease transactions in response to this desire
    to avoid the participation of banks and other intermediaries. Electronic money,
    however, presented a significant problem because it was simple to duplicate and
    could thus be used again. Double spending is a phenomenon that significantly hampered
    the feasibility of these alternative transaction mechanisms. Bitcoin was offered
    as a solution to this problem, and it is based on blockchain technology (Orcutt,
    2017). By requiring changes to be made across every consecutive block on the blockchain,
    transactions made using this technique are broadcast to all computers in the network,
    presumably eliminating the chance of double spending.


    Money is essential for every individual, addressing various human needs through
    its utilization. Amidst the advent of the Fourth Industrial Revolution marked
    by modernization and globalization, blockchain technology has emerged, giving
    rise to cryptocurrency. Cryptocurrency, a decentralized digital currency, signifies
    a virtual form of money that lacks physical presence, ensuring secure and untraceable
    transactions.'
