    Whereas the chapter provides many perspectives on the advantages and potential
    of blockchain technology for health tourism, it does have some constraints. The
    extent is restricted because the chapter just concentrates on many phases of medical
    travel before and after procedure. Furthermore, a more in-depth qualitative approach,
    as well as empirical research, is required to improve our knowledge of the potential
    of blockchains in the medical tourism business. It will be critical to undertake
    evaluation research to discover additional potential areas of healthcare services
    that might be impacted by the use of blockchain technology. Furthermore, investigators
    must confront the difficulties of innovation as well as the threat of using blockchain
    technology in the medical tourism industry.


