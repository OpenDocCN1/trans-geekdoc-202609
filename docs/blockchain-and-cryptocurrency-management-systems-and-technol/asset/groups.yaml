    # 4.2.5 Secure Hash Algorithm (SHA-256)


    SHA-256 is an abbreviation for a commonly used and extremely secure cryptographic
    hash function, short for Secure Hash Algorithm. It is useful for a variety of
    Computer Science applications such as password hashing and sensitive data hashing
    as well as digital signatures. Many blockchain applications, for example Bitcoin,
    Namecoin, Peercoin use SHA-256. SHA-256 is a part of the SHA-2 family of hash
    functions, designed by the National Security Agency (NSA) and published by the
    National Institute of Standards and Technology (NIST). SHA-256 takes an input
    message of arbitrary length and produces a fixed-size (256-bit) alphanumeric string
    as the output, known as the hash value (AkhibeJoy, 2018). A few of the characteristics
    of SHA-256 algorithm are deterministic, Avalanche effect, irreversibility, and
    fixed-length alphanumeric code. Deterministic property means that the same hash
    value will be generated for a particular input. “Avalanche effect” means that
    a small change in the input data will produce an entirely different hash value.
    Irreversibility means no algorithm exists to produce original value from the hashed
    value. The length of the string produced by the SHA-256 is fixed to 256 bits,
    i.e. 32 bytes of alphanumeric code. It is a novel algorithm whose properties make
    it a crucial component in securing sensitive data and verifying the integrity
    of digital information.The design and security elements of the blockchain data
    structure, such as cryptographic hashing and block linking, make the system resistant
    to tampering and ensuring immutability (Rajnak et al., 2021).


