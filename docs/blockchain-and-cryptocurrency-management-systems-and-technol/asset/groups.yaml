    factors (stock indices and gold) had stronger effects on the return of Ethereum
    price rather than the crypto market.


    Bhowmik (2022) analysed the role of Bitcoin and Ethereum in the economy through
    their trends during 2017m01–2021m12 where the traditional regression model explained
    that the market capitalization of Bitcoin is positively related to the price of
    Bitcoin and the inflation rate, and negatively related to the price of Ethereum
    significantly. The cointegration and vector error correction model suggested that
    the market capitalization of Bitcoin has long-run causality with the price of
    Bitcoin, the price of Ethereum, and Ethereum and inflation rate. The cointegrating
    equation has been diverging away from equilibrium due to volatility. The price
    of Ethereum has short-run causality with the market capitalization of Bitcoin.


    Li (2023) examined the relationship between Global Economic Policy Uncertainty
    (GEPU) and Ethereum Price by decomposing Ethereum into trend and cyclical components
    and extracting the cyclical component and excluding the irrelevant trend component
    during 2015–2022 and found that without the distortion from the trend component,
    GEPU Granger causes Ethereum. Additionally, GEPU and Ethereum cyclical patterns
    have a stable long-run negative cointegration relationship, which is positive
    and that may be disturbed by the trend component, of which the upward-sloping
    trend dominates. When Ethereum cyclical character does not have a trend, it responds
    negatively to GEPU and its lagging terms. This implies that cryptocurrencies may
    react ahead of the market, similar to stocks and other financial assets, when
    global economic uncertainty escalates. The error correction model demonstrates
    that the Ethereum cyclical component responds in the short run to changes in GEPU
    and deviations from their long-run equilibrium.


    ## 8.5 OBJECTIVE OF THE CHAPTER


    The chapter endeavours to examine the behaviour of the Ethereum US Dollar rate,
    or in other words, the closing price of the Ethereum in terms of USD, from 2015m08
    to 2023m05 which enabled it to show the nonlinear trend, cyclical trends, cycles,
    and seasonal fluctuations. Additionally, the chapter explores the AR and MA characteristics
    of the series and finally identifies the prediction trend of ARIMA(p,d,q) for
    2025m01 which was also tested in the decomposed model of the Hamilton filter during
    the same period.

