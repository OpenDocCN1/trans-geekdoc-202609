    ## 5.8 讨论


    区块链技术在实现去中心化能源供应的透明度和准确性方面大有可为。财政激励和能源政策推动了可再生能源的发展，但只有通过应用 BCT，能源转型才有可能实现。发达国家部署智能电表帮助各国减少了温室气体排放，并提前实现了净零目标。英国已规划了
    5300 万个电力供应智能电表，这反过来需要巨额投资，美国每年约为 2 万亿美元。英国发布的一份报告指出，BCT 不仅能够像比特币和加密货币那样彻底改变金融市场，还能通过实现透明度、安全性和问责制来彻底改变能源市场。BCT
    被认为是能源供应商的颠覆者，有助于实现低碳转型。


    BCT 在能源转型过程中有巨大的应用空间，但可扩展性、成本和安全性被认为是 BCT 在能源领域应用的主要挑战。当今各种微观和宏观层面的问题都需要政策制定者关注，以规范布局，加速
    BCT 及其在能源市场中的采用。与此同时，各国政策制定者可以制定有效的战略来应对 BCT 在能源领域的挑战，并能在不削弱环境挑战应对的前提下加强能源供应。


    ## 5.9 结论


