    # 2.3 BLOCKCHAIN ARCHITECTURE


    A small portion of work recorded in public documents might be called a blockchain
    transaction. Blocks are another name for these documents. All miners working on
    the blockchain network execute, put into place, and store these blocks for further
    confirmation. Evaluating past transactions is always possible, but updating them
    is not permitted. The blockchain, which is the underlying technology of Bitcoin,
    enables the decentralized global network of peer-to-peer exchanges. Bitcoin is,
    therefore, a censorship-resistant, universal form of electronic money. Trust may
    often be the primary problem in old centralized systems, such as banks, where
    users must rely entirely on the system. It is an area in which public blockchain
    technology excels since it allows ownership of digital products to be transferred
    from one peer to another without requiring trust. A trustless blockchain establishes
    trust by adhering to standards that disclose information about all network operations.
    Before beginning a transaction, security is another critical consideration. Consensus
    processes like blockchain mining, which are significantly dependent on cryptographic
    hash functions, can be utilized to solve security issues. As an illustration,
    Bitcoin uses the SHA-256 secure hashing algorithm. For inputs of any kind, the
    output of Bitcoin is 256 bits or 64 characters, known as a hash, which may be
    created from data of any kind, including text, numbers, strings, or even computer-created
    files of any size. The converted hash function output will always match the input.
    One-way functions are more names since it is impossible to compute the input from
    the output when the input is slightly changed while the output is altered. It
    is secure because one can only speculate about the input, and there are incredibly
    high probabilities that they are correct (Jabbar et al., 2022).


    As the sender and not a third party requests the data exchange between sender
    and recipient, the first transaction stage procedure is to confirm sender’s identity.
    Assuming that Bob and Alice each have a Bitcoin balance, Alice wishes to send
    Bob 10 Bitcoins, Alice will now publish transaction information on the network
    for sending the money. Private and public keys for digital signatures are employed
    by blockchain to do this. Bob’s information includes transaction amount and public
    address which is accessible for the broadcast with Alice’s public key and digital
    signature. Alice created that digital signature using her private key. All miners
    individually perform transaction validation based on several standards covered
    in more detail in this paragraph. In blockchain, the elliptic curve digital signature
    technique is employed. Thanks to this algorithm, the money can only be used by
    those who own it. Each transaction has a 256-bit signature, requiring 2,256 guesses
    to forge to generate a fraudulent transaction. An adversarial peer or attacker
    would be wasting their resources by trying to do this, which is computationally
    impossible. The validator must check both the sender’s and the transaction’s validity
    by assessing whether or not the sender has sufficient funds to deliver to the
    recipient. The ledger, which is filled with information about each preceding successful
    transaction, might be examined to carry it out.'
  - '[PAGE 41]


    # 2.3.1 BITCOIN TRANSACTIONS


    The primary target of digital currency according to Bitcoin whitepaper is to eliminate
    central middlemen and establish a system of electronic money transfers between
    many parties that are decentralized. A Bitcoin transaction moves particular Bitcoins
    from one Bitcoin address to another. It usually starts in a client’s Bitcoin wallet
    and is then broadcast to the network. Only if the transaction is genuine will
    the network nodes rebroadcast the block they are mining and incorporate it into
    it. Included in the transaction and other transactions in a block takes about
    10 minutes. By this time, the receiver should be able to view the total transaction
    in their wallet. Unspent Transaction Output (UTXO) or the portion of a transaction’s
    output that a user receives and has the option to spend in the future, is the
    primary component of a Bitcoin structure (Rajashekar et al., 2022). Assume that
    coins or cash in real wallet may become mixed up, although this differs from the
    received Bitcoin amount. The whole amount received and stored is stored in a Bitcoin
    wallet, for instance, if we maintain two sums ($2 and $3), they will total $5
    in the same physical or digital wallet. As you are in the Bitcoin wallet, they
    will continue to be distinct entities and display the precise amounts. Consider
    Alice, who wants to give Bob 0.15 BTC but has only three distinct UTXOs in her
    wallet (0.01, 0.2, and 3). The wallet must choose one of these three output UTXO
    as a spend candidate to do that. If the wallet chooses to output 0.2, this amount
    will be unlocked, and the entire sum will be used in the UTXO entry field for
    the 0.15 BTC transactions. The next step is to transmit 0.15 BTC as an output
    UTXO to Bob’s address wallet. The work required for miners to manage will be rewarded
    if they validate transaction by creating the fresh block and adding it to the
    existing chain.


    Transaction fee = Input – Output (2.1)


