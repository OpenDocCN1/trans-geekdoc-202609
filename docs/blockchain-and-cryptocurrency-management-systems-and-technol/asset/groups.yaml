    transaction fees are likely to repel clients. The design should provide affordable
    transaction rates to promote adoption and usage. Incentives might be used to encourage
    the usage of digital currencies because there are many unbanked and under-banked
    people in India. Strategies like referral or transaction rewards should be part
    of the design.


    ### 2.12.3 Scalability


    Blockchain and cryptocurrency-based business model solutions are increasing across
    all industries. Its scalability and performance, in particular, make one wonder
    if it can meet the expanding demand from diverse governmental and business sectors.
    Some researchers concentrate on performance issues like throughput (number of
    transactions/second), latency (total time needed to add a transaction block to
    the blockchain), and scalability concerns on the number of network replicas. Performance
    and latency may suffer if more copies are added because the network must manage
    more messages being exchanged and processed. PoW is one of the protocols that
    can guarantee scalability, even if it has a high latency and limited throughput.
    This bottleneck is caused by the resources needed to post a block for inclusion
    in the chain, which requires solving a cryptographic problem (Hoy et al., 2017).


    ### 2.12.4 PRIVACY


    Blockchain is designed to give protection and anonymity to delicate personal data,
    since transactions may be done using generated addresses rather than real names.
    Even if other network users may not see real names, several researchers theorized
    that as others verify the public key employed to initiate a transaction, blockchain
    would be vulnerable regarding transactional privacy. The Bitcoin platform has
    recently undergone research, and it has been demonstrated that comparing a member’s
    transaction history might reveal their genuine identity. This contradicts the
    claim that peers can preserve anonymity within the blockchain network. Peck et
    al. (2016) proposed that a technique for connecting IP addresses to peers’ aliases
    can be used even if NAT or firewalls protect them. He claims that a peer’s linked
    group of nodes, which make up that peer, might be applied to identify that peer
    specifically. The visibility of all balances is the main factor contributing to
    blockchain’s sensitivity to information leakage, and data associated with public
    keys are available to all users on the network. In light of this, the privacy
    and security criteria for blockchain applications should be established at the
    outset.


    ### 2.12.5 INTEROPERABILITY


    Numerous sectors may be interested in using blockchain technology at the moment.
    But they can’t cooperate and integrate since there isn’t a set mechanism. This
    problem is referred to as a lack of interoperability and is harmful to the development
    of the blockchain sector. As a result, rather than offering diverse real-world
    solutions to various business models, Bitcoin still serves as the primary platform
    for blockchain technology. Blockchain programmers may build code for multiple
    platforms because they have no interoperability, but each network is locked off
    from the others and cannot connect. For instance, on GitHub, over 6,500 blockchain
    projects are active using various platforms, protocols, consensus procedures,
    computer languages, and security measures. Because of this, standardization is
    needed for corporate cooperation in application development to distribute blockchain-based
    products and incorporate them into current platforms.


    ### 2.12.6 ENERGY


    The proof-of-work (PoW) algorithm has enabled Bitcoin to facilitate P2P transactions
    in a potentially dispersed, decentralized environment. Moreover, miners’ computers
    require huge energy to perform the activity. Bitcoin’s energy usage indicator
    demonstrates how seriously unsustainable the PoW algorithm is. The system of incentives
    encourages individuals to mine Bitcoin all around the world. Since mining produces

