    block in blockchain, if one tries to make even a small change in the data of the
    block, it will lead to breaking of the link due to change in the hash value. Now,
    let’s understand the generation of hash value in detail by using the concept of
    Merkle Tree and Merkle Root (Latif i Sobhan et al., 2019).


    Figure 4.3 elaborates the connection between the blocks of a blockchain. The index
    of a block is the unique number representing a sequence in the blockchain making
    management and identification of the blocks in the blockchain easier.


    **Time Stamp:** Time stamp is the date and time of adding the block to the chain.
    It can also be regarded as the time when the block was mined. In general, the
    mined time of the block and added time will be the same. Time stamp is very crucial
    for maintaining the sequential and progressive order and ensuring that blocks
    are added to the blockchain in a time-sequenced manner (Hueber O., 2019).


    **Hash Value:** It is a unique value generated by applying SHA-256 algorithm.
    It is one kind of alphanumeric value depending on the data or transactions of
    the block. If the data inside the block are modified, the alphanumeric value will
    also get changed automatically. It is one of the components that is responsible
    for the security of data in the blockchain. More about hash value is discussed
    in the section 4.2.5 of the Chapter.


    **Previous Hash Value:** It is the hash value of the block, previous to the current
    mined block and it is used for interlinking the previous block and current block.


    **Data:** Data are a transaction or list of transactions mapped inside the block.
    Data are one of the major components in the block, for which the security concerns
    need to be addressed. For example, in the world of Bitcoin blockchain, the data
    would include transaction details, i.e. information of sender, information of
    recipient, and the total number of Bitcoins to be transferred. Figure 4.4 demonstrates
    the sample structure of the block of blockchain.


    Now, let us understand the working of all the components in detail in the following
    sections 4.2.4 and 4.2.5.


    # 4.2.4 MERKLE ROOT AND MERKLE TREE


    The Merkle Root of a block is the final generated hash value for all the transactions
    in a block of a blockchain. The root node has many of the levels maintaining sub
    nodes. The Merkle Root node is calculated on the basis of the Merkle Tree. A tree
    structure data arrangement for which the combination of multiple hash values will
    generate a Merkle Root and that will be the final hash address given to the next
    node which is going to be added. Following is an example, illustrated in Figure
    4.5, by which the concept of Merkle Root and Merkle Tree can be well understood.


