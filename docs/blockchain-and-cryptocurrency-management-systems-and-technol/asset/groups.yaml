    ## 4.2 BLOCKCHAIN BASICS AND ESSENTIALS


    A blockchain is made up of many connected data blocks that are linked together
    in chronological order. The blockchain has many blocks. The very first block is
    called genesis block. It doesn’t have the address of any other block. After the
    genesis block, each block contains the address of its previous block, so that
    the chain sequence can be maintained. Address is mapped in the form of a 256-bit
    hash code. Each block is a combination of block header and transactions. Block
    header consists of the block version, Merkle root, Timestamp, Nonce value, and
    the hash key of the previous block wherein a transaction contains the list of
    transactions and coinbase.


    Block version is a number which will help to track protocol upgrades. Merkle root
    is the topmost hash value of a transaction which is a combination of all the nodes
    at different levels. Merkle root is one of the most secure hash codes generated
    by the SHA-256 algorithm. Timestamp will tell the time of the block added to the
    blockchain. Nonce value is a value which always starts from zero and indicates
    increment to solve the mathematical puzzle for the verification of a transaction.
    Previous hash is the address of the previous block for the proper consecutive
    linking of blocks (Kang et al., 2018).


