    trust among participants. Greater control over data protection, quicker processing
    of transactions, and customized governance models are all made possible by such
    types of restricted access. For the industries requiring security and confidentiality
    for their data, a private type of blockchain is more appropriate. The primary
    drawback of private blockchain is its small size, which may lower the security.
    Most common examples of private blockchain are Hyperledger Fabric and R3 Corda.
