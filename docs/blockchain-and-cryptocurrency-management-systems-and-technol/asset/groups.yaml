    data. A digital signature is a mechanism to authenticate data, meaning that it
    confirms that the document you have received is from the person who has claimed
    to be the sender and that its content hasn’t been changed since they made it.
    Similar to how traditional systems use stamps, seals, or signatures to establish
    the authenticity of paper documents, digital signatures authenticate the electronic
    record. By adding this digital signature, a subscriber of the digital signature
    wishes to authenticate any electronic record, and it establishes the authenticity
    of that record. In today’s digital world, on an average trillions of transactions
    are enabled. Among the most pressing and unsolvable outstanding issues in cryptography
    are effective digital signatures and information-theoretic security that guarantees
    the integrity, authenticity, and non-repudiation of data. Now it is used for electronically
    signing contracts between two countries, papers, filing taxes, and more.


    UNCITRAL Model Law on Electronic Commerce established uniform standards for digital
    signature laws for e-business and e-commerce, which was released by the UN in
    1996. The majority of the countries began to adopt it. When a document is digitally
    signed, it has legal bounds. Laws pertaining to digital signatures may differ
    slightly among nations.


