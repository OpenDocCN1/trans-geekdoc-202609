    ![](img/4912d151d56a592b7c7c477c5efa929c_102_0.png)


    **图4.7 区块链类型的用例。来源：作者。**


    - a) **Dragonchain**：Dragonchain 是一个于2016年发布的开源平台。它最初由迪士尼开发为一种私有区块链，但后来转变为开源平台，也用于构建和支持其他应用。它提供了在安全环境中共享数据和验证的灵活性。通过将区块链技术的优势与满足实际业务需求的功能相结合，Dragonchain
    旨在提高区块链技术对企业和开发者的可用性和可访问性。

    - b) **币安区块链与智能链**：币安链是一条用于加密货币交易的公有链。币安链还提供了一种名为币安币的代币。币安智能链是一种许可区块链，是与币安链并行的网络，当与币安区块链结合时，提供一种混合环境（M.
    Samaniego, U. Jamsrandorj 和 R. Deters，2016）。币安提供了两条独立但相关的区块链。币安链充当交换加密资产的去中心化市场，而币安智能链通过支持智能合约来增强功能（见图4.7）。


    表4.1简要展示了不同类型区块链的属性对比。


    ## 4.5 共识机制


    “共识”一词的含义是“一群人之间的协议”。在区块链技术中，共识算法扮演着至关重要的角色。这些是基于协议的算法，专门用于在网络参与者之间就特定交易能否被添加到区块链接达成协议。不同的区块链平台和技术会搭配不同的共识算法（Jafar
    Umar 等，2021）。基于适用性，不同的区块链平台会根据其需求采用特定的共识算法。以下是用于将交易添加到特定区块链中的几种主要共识算法。这些算法通常是用于解决复杂问题的数学算法。


    ## 4.6 工作量证明（PoW）


    在区块链领域，工作量证明的通用缩写是 PoW。它由中本聪（Satoshi Nakamoto）于2008年首次使用。它是比特币平台使用的共识算法。在这个过程中，当个人想要将区块添加到特定区块链时，需要由矿工进行验证，矿工负责通过解决复杂的数学问题来验证交易。许多矿工可以参与验证交易的过程，但只有最先解决问题/数学难题的矿工才能获得验证交易和将区块添加到区块链的权利。矿工必须通过随机值对区块进行重复哈希运算。这个随机值称为随机数（nonce）（Chen
    等，2019）。该过程将持续进行，直到随机数满足难度要求所需的标准为止。作为奖励，矿工将根据所解决问题的复杂度获得少量比特币（即加密货币）的部分。这是用于验证交易的最早共识机制之一。比特币完全遵循
    PoW 共识机制/算法来将区块添加到区块链。PoW 过程需要高端的计算能力，导致高能耗，这被认为是 PoW 共识机制的主要缺点之一。


    ## 4.7 权益证明（PoS）


    权益证明的通用缩写是 PoS，由 Sunny King 和 Scott Nadal 于2012年开发。它是 PoW 的替代方案，旨在以不同方式实现相似的目标。与
    PoW 不同，在 PoS 中，并非所有矿工都必须争相使用随机数来解决问题。在 PoS 中，通过一种简单的机制，即权益或加密货币的所有权，选择矿工的概率非常高。任何拥有高权益的人首先有资格参与确定问题的解决方案。这将在早期过滤掉所有矿工，而不会让他们全都忙碌。PoS
    的主要优点是它比 PoW 更节能，并且通常能实现更快的区块挖矿。以太坊、Polkadot、Avalanche 等流行平台都使用 PoS（Yoshida H.，Biryukov
    A.，2006）。每个平台都与不同的 PoS 变体相关联，这使得它们具有更快的挖矿速度和更少的能耗。以太坊早期与 PoW 相关，但到2022年，以太坊正式过渡到
    PoS。


    由于挖矿速度更快，以太坊在当前市场上仅次于比特币，非常受欢迎，其代币 ETH 在市场上持续增长。但 PoS 的问题在于矿工需要大量投资来维持权益。


    ## 4.8 委派权益证明（DPoS）


    委派权益证明的通用缩写是 DPoS，由 BitShares、Steemit 和 EOS 的创始人 Daniel Larimer 于2014年开发[44]。它是
    PoS 的流行变体之一，旨在与比特币等传统工作量证明（PoW）系统相比提高可扩展性和能源效率。它基于代币投票系统运作。在这个系统中，区块链网络上的代币持有者可以选择预定数量的代表。这些代表在验证交易后可以将新区块添加到区块链。代表的数量通常不超过网络中代币持有者的总数。一般来说，与代币持有者数量相比，代表数量相当少，从而实现高效且可扩展的共识机制流程。它是一种网络算法，只有受信任的验证者才有权验证交易。这些权利由特定区块链的其他网络代表授予。其主要目标是提供一种比传统工作量证明共识机制更节能、更具可扩展性的替代方案。DPoS
    旨在通过允许所有代币持有者在共识过程中投票，来在去中心化、安全性和效率之间找到平衡（Aithal 等，2021）。


    ## 4.9 实用拜占庭容错（PBFT）


    实用拜占庭容错的通用缩写是 PBFT。Miguel Castro 和 Barbara Liskov 通过1999年发布的一项研究提出了这一想法（Amiri
    等，2021）。只有可靠的验证者才能参与许可区块链的共识算法。PBFT 是一种适用于许可区块链的共识算法，仅与受信任的验证者协作。它还在物联网（IoT）领域发挥着重要作用。拥有拜占庭容错的主要好处是管理系统故障。如果某个节点发生故障，则建议移除该节点，而优化在更短时间内完成工作则是
    PBFT 的主要用途。它主要提供所有节点的顺序排序，其中一个节点是主节点，所有其他节点被视为从节点。PBFT 主要保持记录，确保恶意活动的节点不超过总节点的三分之一。例如，如果总节点数为
    n，则恶意活动的节点不应超过 n/3。实用拜占庭容错（PBFT）方法被包括 Zilliqa、Hyperledger Fabric 和 Tendermint
    在内的区块链系统使用。


    ## 4.10 权威证明（PoA）


    权威证明的缩写是 PoA，它是一种具有有限数量受信任节点的共识机制。这些受信任节点的主要任务是验证


    **表4.2 共识机制对比**


    共识机制


    | 属性 | PoW | PoS | DPoS | PBFT | PoA |

    |---|---|---|---|---|---|

    | 可扩展性 | 低 | 中 | 高 | 中 | 高 |

    | 速度 | 中 | 中 | 高 | 高 | 高 |

    | 安全性 | 高 | 高 | 高 | 高 | 中 |

    | 存储（去中心化） | 高 | 中 | 低 | 低 | 低 |

    | 能源消耗 | 高 | 低 | 低 | 低 | 低 |

    | 参与方式 | 所有矿工 | 权益持有者 | 代币持有者 | 节点 | 经批准的实体 |

    | 示例 | 比特币 | 以太坊 | 波场 | Hyperledger Fabric | Quorum |


