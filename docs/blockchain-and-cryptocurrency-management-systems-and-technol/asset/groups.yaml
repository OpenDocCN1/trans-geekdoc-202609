    供辩论。尽管日本、瑞士等一些国家已立法鼓励加密货币的使用，但印度却在彻底禁止和将其纳入金融体系之间左右为难。


    当我们审视印度环境时，会看到关于如何对加密货币进行法律分类的有趣讨论。在定义之间取得微妙的平衡对于将加密货币视为证券至关重要。根据1956年《证券合约（监管）法》（“SCRA”），加密货币并未被明确视为证券。然而，更宽泛的“其他可流通证券”一词可能适用，涵盖它们。尽管如此，要求由法人机构发行这些证券与加密货币的基本匿名性相悖，因此将它们排除在SCRA的管辖范围之外（1934年《印度储备银行法》）。


    当我们把加密货币视为虚拟货币时，我们会关注1999年《外汇管理法》（“FEMA”）第2(h)条对“货币”的定义（Baxter, 2016）。由于缺乏提供类似价值的发行者，加密货币难以与传统法定货币对齐，而将加密货币归类为“商品”或大宗商品也有不足之处。根据《证券合约（监管）法》，货币和证券不被视为“商品”，而且由于加密货币的模糊性，很难确定地对其进行分类（Narayanan
    et al., 2016）。加密货币无与伦比的隐私性和去中心化正是它们如此吸引人的原因。交易隐私是任何其他身份管理系统都无法比拟的。一个人在此系统内的行为最终会形成一系列可识别的模式。因此，确实出现了一句警告。这种无意中泄露用户现实世界身份的行为过程，可能会损害人们最初认知中的匿名性。


    在这些困难中，一个根本性的担忧浮现出来：加密货币天生抗拒政府监管。如果加密货币成为法定货币的可行替代品，“美元化”可能导致人们采用美元或欧元等更稳定的货币。由于交易的匿名性，这种变化会危及中央银行货币政策的有效性，并为非法活动提供便利。因此，通过控制货币供应量和利率来对抗通货膨胀变得困难，使现有的法律结构不适合处理这些问题（Narayanan
    et al., 2016）。


    ## 10.4 加密货币监管揭秘：欧洲视角


    加密货币在欧盟（EU）的旅程是一个关于谨慎、适应和观点演变的故事。为了更好理解这个故事，我们来看看影响该地区比特币规则的趋势。欧洲银行管理局（EBA）在2013年前后就对比特币等虚拟货币发出警告。它们对购买、持有或交易这些数字资产的风险表示担忧。这些危险包括用户可能遭受财务损失或被盗窃、虚拟货币被用于非法目的，以及此类数字形式的波动性。


    禁止虚拟货币，这被认为侵犯了《印度宪法》第19(1)(g)条保障的贸易和经商权利。印度储备银行（RBI）表示，该禁令符合宪法，且虚拟货币属于其管辖范围（Bhardwaj,
    2020）。RBI还强调了其对责任以及虚拟货币可能被滥用于非法目的的担忧。最终，最高法院裁定，2018年4月的通告违反了相称性原则，侵犯了第19(1)(g)条保障的权利。换句话说，法院认为，即使虚拟货币可能不被正式承认为法定货币，它们仍可发挥真实货币的作用，因此应得到考虑和保护。


    公司事务部对此作出回应，于2021年3月发布通知，要求企业申报其虚拟货币交易（James, 2022）。随后，RBI于2021年5月撤销了其2018年4月的通告，并指示加密货币交易平台遵守《外汇管理法》（FEMA）、了解你的客户（KYC）和反洗钱标准。在应对数字金融生态系统的复杂性并试图平衡创新、安全和合法性时，RBI正在发展其对加密货币的立场，这一谨慎与监管之旅凸显了这一点（Singh,
    2021）。


    ## 10.9 探索加密货币与数字卢比：税收、央行数字货币与潜在颠覆的故事


    “数字资产”一词最近变得流行起来，现在指的是加密货币以外的各种数字持有物。除了监管加密货币和非同质化代币外，这一定义的扩展还赋予政府控制新型数字资产的权力。由于加密货币行业格局的不断变化，印度政府已采取措施来管理这一领域的税收。在《所得税法》中增加第115BBH条，对转让虚拟数字资产的所得征收30%的税（不含附加费和
    cess），是关键一步。¹ ² 为简化税收，自2022年7月1日起，对比特币交易实施1%的源头扣税。³ 然而，这一立法举措引发了质疑，因为分析人士认为它可能损害印度新兴的加密货币市场，并导致日交易量减少超过70%。⁴


    2022年11月29日，印度储备银行（RBI）推出了零售数字卢比创新试点项目（Das, 2022）。该计划确立了与纸币相对应的数字卢比面额，用于通过合作银行提供的数字钱包进行交易，并将于2022年12月1日生效。⁵
    RBI的央行数字货币（CBDC）项目通常被称为数字卢比，旨在利用数字交易的效率和速度，补充现有的支付方式。RBI的CBDC战略有两个主要目标：密切模拟纸币的特性，并将卢比无缝融入数字经济。通过渐进式部署计划，RBI正在研究面向批发业的基于账户的CBDC和面向零售业的基于代币的CBDC。然而，该项目需要解决金融业与加密货币相关的监管规避问题。


    文章在展望未来时强调了加密货币在金融领域的变革潜力。对于银行服务受限的地区，加密货币提供了一种绕过传统银行限制的点对点系统（DeVries, 2016）。与传统银行程序的漫长拖延相比，这些数字货币能够实现快速的跨境交易。加密货币的优势在于较低的交易费用和数字交易效率的提高（Williams,
    2021）。由于不受金融体系内置制衡机制的约束，加密货币可以实现快速交易（Watorek et al., 2023）。此外，该技术的快速性和有效性鼓励了诸如网络资产交易等创新应用，最近的例子如古驰（Gucci）销售其产品的数字复制品，体现了市场的兴趣。


    文章将加密货币对能源消耗的可能影响与互联网对数据交换的革命性影响进行比较，以解决环境问题。加密货币可用于抵消现有能源密集型挖矿流程以及传统银行的基础设施需求，符合可持续能源目标。此外，众筹民主化和增强金融包容性是加密货币另外两个有前景的用途，可支持全球范围内的社会经济增长。然而，作者强调，仅将加密货币视为货币是有局限性的。由于加密货币具有透明和资本主义的双重属性，它可以实现实时交易跟踪，并消除对托管账户的需求（Finlay,
    2021）。然而，困难依然存在，因为政府的沉默和加密货币投资的投机性加剧了市场波动，可能破坏经济稳定（Catlow et al., 2017）。


    萨尔瓦多作为第一个接受比特币为法定货币的国家，其例子展示了此类采用的风险。比特币的价值在大量投资中下跌，影响了经济。萨尔瓦多的例子是一个警示故事，突显出当印度等国家考虑采用加密货币时，必须审慎权衡（Catlow
    et al., 2017）。


    ## 10.10 结论


    需要国际合作来为加密货币这些跨国数字资产制定有效规则。印度储备银行（RBI）2022年12月的《金融稳定报告》强调了加密货币在全球范围内的影响（Acosta,
    2022）。由于近期的市场波动以及加密货币与传统金融日益融合，需要立即采取行动。金融稳定委员会支持基于“相同活动、相同风险、相同监管”原则的全球加密货币监管一致性，是本次讨论的重要参与者。该研究还强调了巴塞尔委员会的……

