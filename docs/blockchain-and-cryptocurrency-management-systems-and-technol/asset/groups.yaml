    # 6.2 HISTORY OF DIGITAL SIGNATURE


    In 1976, Diffie and Hellman laid the groundwork for public key encryption and
    introduced the notion of digital signature. Shortly after in 1977, Rivest, Shamir,
    and Adleman developed the RSA encryption method, which allowed for meaningful
    homomorphic operations on signatures and could also be used to create crude digital
    signatures, but these were far from safe. Soon later, in 1979, Lamport created
