  md: '![](img/4912d151d56a592b7c7c477c5efa929c_160_0.png)


    FIGURE 7.2 Life cycle of the blockchain process. Source: Authors.


    # 2. Verification Process


    The entered record is then shared into the blockchain distributed network across
    the region of interest. The respective peers in the network verify its resources
    to effectively carry out the given transaction.


    # 3. New Block Formation


    At the given time, a greater number of transactions are verified and identified
    as legitimate. Then, the legitimate transactions are combined together and form
    the block.


    # 4. Consensus Mechanism


    The block formed by the legitimate sources is tried to be added to the blockchain
    network. If all the peers simultaneously try to do the process, it causes the
    working of the blockchain. To address this issue, the peers use the consensus
    mechanism. The consensus mechanism allows the peers to add the block only once
    to the network securely and ensures the process is not done by other peers. The
    source that is involved in the consensus process is called as miners. The consensus
    algorithm generates the hash code for the intended block and adds the same to
    the blockchain.


    # 5. Addition of New Blocks


    Once a block gets its hash key and is authenticated, it can be added to the blockchain.
    Every block of the blockchain has information about the previous one and details
    about how the intended block is connected with others in the blockchain. The newly
    formed block can be added to the network openly and end of it.


    # 6. Transaction Complete


    Once the block gets connected to the blockchain network, the record transaction
    process is completed, and the entire details about the transaction are permanently
    shared in the blockchain network. Whoever is interested can retrieve the records
    shared in the network and confirm them.'
