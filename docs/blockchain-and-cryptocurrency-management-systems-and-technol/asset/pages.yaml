    # 2.12.7 SECURITY


    The most widely acknowledged issue with blockchain security is 51% of assaults.
    One or more malevolent actors take over most of a blockchain’s hash rate during
    a 51% assault. With the hash rate, it may commit double-spending by reversing
    transactions and preventing blocks from being validated by other miners. The unethical
    practice of “selfish mining”, utilized by mining pools to increase block rewards,
    affects a blockchain network’s reliability. If anyone wishes to use hashing power,
    the network is still susceptible to fraud even though it is typically considered
    that rogue nodes with more than 51% of the computational blockchain network may
    come under the grip of power. A miner or groups of miners can inductee the selfish
    mining process by electing not to broadcast the validated blocks to the available
    network. They continued mining for the following block to maintain their edge.
    Only after specific requirements have been satisfied may the general public view
    the solved blocks. Because of this, the self-centered network is compelled to
    accept a miner’s solutions as their chain grows more prolonged and complex, while
    other miners expend energy on a useless branch. At last, rapacious miners want
    more cash that makes it more likely to selfish pool with more than 51% of the
    power since it is tempted to join the longer chain, the logical miners (Tschorsch
    et al., 2016).


    # 2.13 FUTURE RESEARCH WITH BITCOIN


    Researchers assert that blockchain technology has great promise for academic and
    commercial applications. Standardization, asset protection, big data, and smart
    contracts are only a few of the many potential applications for blockchain technology
    that have been briefly covered in this section. Investors can be seduced by the
    prospect of enormous profits when using blockchain technology. To properly implement
    this technology in a commercial solution, it is essential to ascertain whether
    the criteria are met. It is crucial to examine the advantages and disadvantages
    of blockchain-based solutions using a systematic testing process. The standardization
    and testing phases are the two different stages of this procedure. The first step
    will evaluate the developers’ claims on their blockchain solutions based on a
    specified set of criteria. The blockchain-based system’s functioning is assessed
    during the testing phase. For instance, the owner of an online retailer is interested
    in how the blockchain-based system works. The platform used for the purchased
    solution should have certain testing and standardization approaches to assess
    its capacity, throughput and latency (Yli-Huomo et al., 2016).


    By registering new ideas, proofs of concept, and drawings using blockchain technology,
    businesses may build a digital trail of their creations and produce certificates
    that can be used to demonstrate the legitimacy, existence, and ownership of any
    intellectual property asset. All notarized information, including trade secrets'
