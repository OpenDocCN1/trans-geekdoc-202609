    In Phase 1, Exploration Phase: The companies and the economies willing to step
    ahead for energy transition initiate pilot projects and startups to integrate
    BCT with existing energy infrastructure to increase the efficiency and reduce
    the cost together.


    In Phase 2, Growth Phase: Significant progress is witnessed in the dissemination
    of technology across the countries. This technology initially developed to support
    cryptocurrencies like Bitcoin, has matured and has found its applications in energy
    sector. Blockchain has made substantial strides is in meeting the energy demand
    in an economically and environmentally friendly manner.


    Phase 3, Maturity Phase: Blockchain technology has evolved beyond its initial
    applications and has gained maturity. Widely adopted in the energy sector, BCT
    becomes a common place and is ready for further advancements to meet the evolving
    needs of the industry.


    It is also evident that most of the developed and developing countries like India,
    China, France, and many other countries have embarked on the journey of energy
    transition already and are moving towards phase 2, i.e. growth phase.


