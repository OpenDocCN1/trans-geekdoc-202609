  md: '# 7 AI-Infused Blockchain Technology for Thrust Applications


    C. Venkataramanan, S. Dhanasekar,

    V. Govindaraj, K. Martin Sagayam, and P. Geetha


    # 7.1 INTRODUCTION


    Blockchain is a database constructed in a distributive manner to hold the data
    immutably (Verma et al., 2022). The interconnected blocks are securely connected
    to each other and used to track and build trust. If any transaction needs to be
    updated in a block, it can’t be altered without altering the succeeding blocks.
    By definition, it maintains a list of arranged data records (i.e. blocks) contains
    a information about its previous section details (Zerka et al., 2020). Digitalization
    will encompass the majority of engineering fields, with a bigger impact on wide-area
    communication networks involving fast data transmission (Dhanasekar et al., 2022;
    Dhanasekar et al., 2021; Neebha et al., 2023). The chain-like construction is
    a decentralized one, and the data can be recorded across the region of interest,
    and the same cannot be altered without impacting the subsequent blocks (Raja et
    al., 2022; Firouzi et al., 2022). The blockchain records the information digitally.
    The main difference between the blockchain and a conventional database is that
    in blockchain, the data is stored in a structured manner. It gathers the information
    in groups (i.e blocks). Each block has a storage capacity, and it gets connected
    with its previous one once filled, forming the chain (Govindaraj et al., 2023;
    Bruntha et al., 2022). Every piece of information in the freshly filled blocks
    is connected to its previous one, continuing the chain, which is called the blockchain.
    Whenever a block is associated with the chain, an exact timestamp is given (Firouzi
    et al., 2023). Without any assistance from a third party, the blockchain technology
    ensures the integrity and security of the data.


    It is an advanced database technology that allows the information sharing in a
    transparent manner within a network. Data originating from many sources are collected
    and shared using the blockchain cloud environment (Bansal et al., 2022). Each
    block in the chain contains a unique cryptographic hash ID, which avoids the duplication
    of data. The main feature of this technology is that data can’t be transacted
    without the knowledge of the associated parties (Wazid et al., 2023).'
