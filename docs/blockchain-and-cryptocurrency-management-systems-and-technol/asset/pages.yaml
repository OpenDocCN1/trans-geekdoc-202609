    The RBI said that the prohibition was constitutionally permissible and that virtual
    currencies fell under its authority (Bhardwaj, 2020). The RBI also emphasized
    its worries about responsibility and the potential abuse of virtual currencies
    for illicit purposes. Ultimately, the Supreme Court determined that the April
    2018 Circular breached the Doctrine of Proportionality and violated the rights
    guaranteed by Article 19(1)(g). In other words, the court made the case that even
    while virtual currencies may not be officially recognized as legal currency, they
    can nonetheless act as real money and, as a result, deserve consideration and
    protection.


    The Ministry of Corporate Affairs responded to this decision by issuing a notification
    in March 2021 requiring businesses to declare their virtual currency transactions
    (James, 2022). The RBI then revoked its April 2018 Circular in May 2021 and instructed
    cryptocurrency trading platforms to abide by Foreign Exchange Management Act (FEMA),
    know your customer (KYC), and anti-money laundering standards. As it navigates
    the complexity of a digital financial ecosystem and attempts to balance innovation,
    security, and legality, the RBI is developing its stance on cryptocurrencies,
    highlighted by this journey of caution and regulation (Singh, 2021).


