  md: '# 8. Operational Transparency


    Blockchain form of operations provide transparency in cryptocurrencies. This transparency
    makes the whole operational system simple and boosts investors’ confidence as
    it makes it free of any scope of corruption. Investors can easily monitor their
    money transfer transactions by using a blockchain explorer on the platform, allowing
    them to track live transfers in real time (Coursera, updated on June 16, 2023).


    # 9. Privacy


    As there is no intervention from any government or agency, the whole system has
    a certain level of privacy. The investors can transact using pseudonyms with the
    help of their wallet keys or addresses, i.e. without divulging their original
    identities (Coursera, updated on June 16, 2023).


    # 10. Conversion vis-à-vis Other Currencies/Liquidity


    Cryptocurrencies can be converted into other widely used and popular currencies
    such as USD, Euro, Yen, Pound, etc., through the cryptocurrency exchanges. This
    gives immense liquidity to the investors for their funds (Coursera, updated on
    June 16, 2023).


    # 3.13 DISADVANTAGES/DRAWBACKS OF CRYPTOCURRENCY


    +   1. Though cryptocurrencies are claimed to be pseudonymous, the government
    or government agencies can track the transaction trails if required and hence
    the possibility of intervention.

    +   2. Many blockchains operate on the proof-of-work consensus mechanism. To participate
    in such networks, individuals are often obligated to utilize powerful ASIC computers
    that consume significant amounts of electricity and generate heat, making it a
    costly endeavour.

    +   3. Most of the cryptocurrencies do not have specific policies regarding transactions,
    such as no refund or cancellation policies (Published in: 2021 1st International
    Conference on Computer Science and Artificial Intelligence (ICCSAI), Jakarta,
    Indonesia).


    # 3.14 CONCLUSION AND FUTURE SCOPE OF RESEARCH


    Cryptocurrency appears to have moved beyond the initial phase of adoption typically
    associated with new technologies, much like motor vehicles did in their early
    days. Bitcoin has initiated the establishment of its own specialized market, which
    could either propel virtual assets further into the mainstream or potentially
    lead to their downfall.


    The Bitcoin community is proactively striving to integrate itself into mainstream
    usage by fostering innovation and addressing longstanding challenges. Numerous'
