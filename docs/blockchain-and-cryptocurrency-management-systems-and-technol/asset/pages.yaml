- pgno: 145
  md: '+   - d. Any alternation to the information made after its authentication by
    electronic signature is detectable.

    +   - e. There should be an audit trail of steps taken during the signing process,
    and

    +   - f. The signer certificate must be issued by a certifying authority (CA)
    recognised by the Controller of Certifying Authorities appointed under the IT
    Act.


    The second schedule provides that an “electronic signature” or electronic record
    can be authenticated by using electronic authentication techniques as described
    in the ESEATPR. The ESEATPR provides that an “electronic signature” can be authenticated
    by using either of the following methodologies.


    +   - a. Aadhaar e-KYC services, or

    +   - b. A third-party service by subscriber’s key pair generation, storing of
    key pairs on hardware security module and creation of digital signature provided
    that the trusted third party providing such services shall be offered by any of
    the licenced certifying authority.


    # 6.15 PROHIBITED DOCUMENTS


    The documents or transactions that cannot be entered into by using an electronic
    signature are:


    +   - a. Negotiable instruments such as promissory notes or bills of exchange
    other than a cheque.

    +   - b. Power of attorney.

    +   - c. Trust deeds.

    +   - d. Will and any other testamentary disposition by whatever name called,
    and

    +   - e. Any contract for the sale or conveyance of immovable property or any
    interest in such property.


    Further, documents to be notarised are generally required to be physically signed
    before the Notary public. Documents requiring registration are also to be physically
    signed before the concerned registrar.


    # 6.16 DIGITAL SIGNATURE AND ITS SECURITY


    Security is the primary benefit of using digital signatures. Security features
    of digital signatures are listed below:


    **Passwords, Codes, and PINs:** These are employed to confirm the identity of
    the signer and validate their signature. The most frequently utilised techniques
    are email, username, and password.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '**Asymmetric Cryptography**: This uses a public key algorithm that encrypts
    and authenticates using both private and public keys.


    **Checksum**: The validity of transmitted data is assessed using this lengthy
    string of letters and numbers. A piece of data is hashed using a cryptographic
    algorithm to produce a checksum. To find errors or changes, the checksum value
    of the calculated file is compared to the checksum value of the original file.
    A checksum can be compared to a data fingerprint.


    **Cyclic Redundancy Check (CRC)**: This error-detecting code and verification
    feature, which is a subset of a checksum, is used in digital networks and storage
    devices to identify changes to raw data.


    **Certificate Authority (CA) Validation**: By accepting, authenticating, issuing,
    and maintaining digital certificates, CAs serve as trustworthy third parties and
    provide digital signatures. False digital certificates can be prevented by using
    CAs.


    **Trust Service Provider (TSP)**: This individual or organisation provides reports
    on signature validation and validates digital signatures on behalf of an organisation.


    # 6.16.1 DIGITAL SIGNATURE ATTACKS


    The following attacks are common in digital signature:


    **Chosen-message Attack**: Either the victim is tricked into digitally signing
    a document they didn’t intend to sign, or the attacker manages to gain the victim’s
    public key.


    **Known-message Attack**: The victim’s communications and a key that allows the
    attacker to forge the victim’s signature on documents are both obtained by the
    attacker.


    **Key-only Attack**: The victim’s digital signature can be recreated by the attacker,
    who merely has access to the victim’s public key, to sign documents or messages
    that the victim did not want to sign.


    # 6.17 DIGITAL SIGNATURE IN FILING INCOME TAX IN INDIA


    The main area where the digital signature is used is in income tax returns. Below
    is the table of income tax filed using the e-filing option. The table has been
    taken from the Income Tax Department from 2013 to 2023. In India, for the firms
    and companies, the digital signature is mandatory, so it has been steadily increasing
    (Table 6.2 Table 6.3).


    Table 6.2 depicts the e-filing of income tax from 2013 to 2023. Every year the
    taxpayers are increasing, which means digital signature use is increasing. After
    the compulsion of digital signatures for the firms the digital signature users
    increased simultaneously. Figures 6.1 and 6.2 explain ITR filing year on year.
    Individuals are separated, and others are grouped as individuals generally do
    not use digital signature.'
