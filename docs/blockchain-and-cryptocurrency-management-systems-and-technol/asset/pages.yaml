  md: '# 4.1.4 CHALLENGES OF BLOCKCHAIN TECHNOLOGY


    Technology always helps people to work effectively and efficiently. While there
    are many advantages to technology, it is vital to also take into account any potential
    drawbacks, such as privacy problems, digital inequality, and the effect of automation
    on jobs majorly. The difficulty for society is to balance the benefits of technology
    with any potential downsides. The challenges are quite often resolved with the
    numerous benefits of technology [7]. But it is always required to incorporate
    the challenges for understanding the technology in a better way. Figure 4.2 illustrates
    the challenges associated with blockchain, which are discussed in greater detail
    as follows:


    +   i) **Concern of Privacy**: Our lives are now a part of the internet through
    various digital channels or it can well be said that the internet has become a
    prominent factor in our lives. Through various digital platforms, people are sharing
    data continuously. Due to this, security and privacy have become a major concern
    today. People even do not know where and for what purpose their data are in use.
    Nowadays, especially after Covid-19, many personal transactions pertaining to
    finance, commerce, business, and healthcare are all done online leading to increase
    of data on the internet (Miglietti et al., 2019). As a result, ensuring the privacy
    and security of sensitive data are a significant concern.


    ![](img/4912d151d56a592b7c7c477c5efa929c_90_0.png)


    FIGURE 4.2 Concerns of blockchain. Source: Authors.'
