- pgno: 104
  md: 'protocol-based algorithms designed specifically for fulfilling an agreement
    among network participants for the acceptability of a specific transaction to
    be added to the chain of blocks. Various blockchain platforms and technologies
    are paired with different consensus algorithms (Jafar Umar et al., 2021). Based
    on suitability, different blockchain platforms adopt a particular consensus algorithm
    according to their requirement. The following are a few major consensus algorithms
    used for adding the transaction into the specific blockchain. These are in general
    mathematical algorithms to solve a complex problem.


    # 4.6 PROOF OF WORK (POW)


    In the world of blockchain, the general abbreviation used for proof of work is
    PoW. It was first used by Satoshi Nakamoto in 2008. It is a consensus algorithm
    used by the Bitcoin platform. In this process, when an individual wants to add
    a block to the specific blockchain then it needs to get it verified by miners,
    who are responsible to validate the transaction by solving a complex mathematical
    problem. Many of the miners are allowed to participate in the process of validating
    a transaction but only the miner who will be able to solve the problem/mathematical
    puzzle first will get the authority to validate the transaction and right to add
    the block to the blockchain. Miners have to involve themselves in repeatedly hashing
    the block by a random value. The random value is called nonce value (Chen et al.,
    2019). The process will continue until the nonce value meets with the required
    criteria of satisfying the difficulty requirements. As a reward, the miner will
    get a few fractions of a Bitcoin, i.e. cryptocurrency, depending on the complexity
    of the problem solved. It is one of the initial consensus mechanisms used for
    validating a transaction. Bitcoin follows completely the PoW consensus mechanism/algorithm
    for adding a block into blockchain. The process of PoW requires high-end computational
    power which leads to high energy consumption and it is considered as one of the
    major drawbacks of the PoW consensus mechanism.


    # 4.7 PROOF OF STAKE (POS)


    The general abbreviation used for proof of stake is PoS and was developed by Sunny
    King and Scott Nadal in 2012. It is an alternative to PoW and aims to achieve
    similar objectives in a different way. In PoS, unlike PoW, not all the miners
    have to rush to solve the problem by using nonce value. In PoS the probability
    of choosing a miner is very high by applying a simple mechanism, i.e. stake or
    ownership of the cryptocurrency. Whoever has a high stake with them are first
    eligible for taking the part to identify the solution of the problem. This will
    filter all the miners at an early stage and would not keep all of them busy. The
    major benefit of PoS is that it is more energy-efficient than PoW and generally
    results in faster mining of blocks. Popular platforms like Ethereum, Polkadot,
    Avalanche, etc. use PoS (Yoshida H., Biryukov A. 2006). Each one of them is associated
    with a different variation of PoS, which leads them towards a faster rate of mining
    and less energy consumption. Ethereum earlier had association with PoW, but by
    2022, Ethereum officially moved to PoS.'
