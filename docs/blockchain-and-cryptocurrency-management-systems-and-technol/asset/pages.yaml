  img_proc: true
- pgno: 64
  md: 'of the crypto industry. It has been claimed that the economic impact of cryptocurrencies
    is still an untouched area (Team, 2016). There are many unanswered questions about
    the relations between cryptocurrencies and the economy. It is still an open area
    for the government of countries to decide whether to make it a legal tender for
    the smooth flow of it in the economy, ban it completely, or develop regulatory
    policies and frameworks to safeguard the financial stability and growth of investors
    (World Bank Group, 2018).


    This chapter intends to understand the features of cryptocurrencies (BTC), develop
    a linear regression model to analyse the relationship between the closing price
    and the volume of BTC transacted, and then proceed with forecasting the average
    closing price of BTC in the near future. This statistical outcome will help to
    develop an insight about the position of BTC Patterson, J. (2015).


    # 3.2 LITERATURE REVIEW


    Cryptocurrencies represent a decentralized, virtual, and independent monetary
    system. They liberate money from being reliant on any single currency for transactions,
    investments, and wealth preservation, thereby breaking free from monopolies (Saito,
    2016). They exist beyond the control and regulation of sovereign governments or
    government entities. These digital currencies are safeguarded by cryptographic
    systems and ensure a safe and protected internet experience irrespective of monitoring
    by intermediaries or regulators, such as the Reserve Bank of India (World Bank
    Group, 2018). Cryptocurrencies are essentially private digital currencies that
    lack official backing from the Indian government. India’s government is in the
    process of developing its own native online currencies and does not support any
    of the current cryptocurrencies (Team, 2016). Arguably, this concept was first
    developed by Satoshi Nakamoto, the creator of Bitcoin, the most popular and widely
    used of all the cryptocurrencies.


    # 3.3 DIFFERENT CRYPTOCURRENCIES


    Apart from Bitcoin, some other popular cryptocurrencies are Ethereum (ETH), Litecoin
    (LTC), Chainlink (LINK), Cosmos (ATOM), Monero (XMR), Tether (USDT), XRP, Binance
    Coin (BNB), USD Coin (USDC), Cardano (ADA), Solana (SOL), Dogecoin (DOGE), Tron
    (TRX), Polygon (MATIC), etc. Many of today’s cryptocurrencies have their roots
    in Bitcoin to some extent. Despite the existence of numerous Bitcoin competitors,
    the original cryptocurrency still holds its dominant position in terms of adoption
    and economic worth. To date, none of them has been able to surpass its market
    capitalization and value (Team, 2016). Since its introduction in 2009, a host
    of imitators, alternatives, and new technologies based on its blockchain have
    emerged. These alternative coins are collectively called altcoins. Their purposes
    have wide ranges – from being a joke/meme to a coin that pays for transactions
    on a distributed and global virtual machine (Nakamoto. 2008).'
