    # Reliability of e-signature in Indian Law:


    +   a. The signature creation data or authentication data are, within the context
    in which they are used, linked to the signatory or, as (the case may be, the authenticator
    and to no other person i.e. the signature must be unique to the signatory.

    +    b. The signature creation data or the authentication data were, at the time
    of signing, under the control of the signatory or as the case may be, the authenticator
    and of no other person.

    +    c. Any alteration to the electronic signature made after affixing such signature
    is detectable.'
