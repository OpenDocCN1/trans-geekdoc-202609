  md: '# 5 Empowering Energy Transition through Blockchain Technology


    Oum Kumari R.


    # 5.1 INTRODUCTION


    According to the UNEP report 2022, the top seven countries—China, USA, India,
    EU, Russia, Indonesia, and Brazil—account for 50% of global greenhouse gas emissions
    (UNEP 2022). Almost all countries have announced net-zero targets to be achieved
    2050–2070. Energy sector alone contributes three-fourth of the total greenhouse
    gases (IEA 2021) and effective energy transition towards renewable energy sources
    like solar, wind, etc., can only help us reduce the emission and achieve net-zero
    targets worldwide. Traditional centralized grid systems may not help the economies
    in achieving net-zero targets as they are suitable for economies relying on fossil
    fuels for their power demand. Net-zero targets can be achieved with the help of
    a flexible grid, which can easily adapt to the dynamic nature of renewable energy
    supply and demand. Nations are striving hard to attain the status of “Developed
    Nation,” which has led to an increase in the production and consumption of energy
    in the last few decades (Oum Kumari, 2019). The ever-increasing demand for energy
    has forced the sector to increase the installed capacity to strike a balance between
    demand and supply. The per capita of energy consumption of the world from primary
    sources has increased from 27,972 TWh in 1950 to 160,764 TWh in 2022. Fossil fuels
    have continued to dominate the energy sector for the last two centuries and the
    dependence on fossil fuels for energy is shown in Figure 5.1.


    Heavy reliance on coal, oil, gas, and traditional biomass has led to unsustainable
    production and consumption of natural resources, which has caused climate change
    and global warming (Khan et al., 2022). Sustainability includes three dimensions
