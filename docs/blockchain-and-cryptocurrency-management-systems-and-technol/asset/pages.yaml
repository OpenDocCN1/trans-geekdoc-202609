  md: 'Generally, digital signature tools and services are used contract heavy industries
    such as government for public and private laws, and budgets. Digital signatures
    are used by governments all over the world to process tax returns, confirm business-to-government
    transactions, ratify laws, and manage contracts. When utilising digital signatures,
    the majority of governmental organisations are required to abide by tight laws,
    rules, and guidelines. Smart cards are also widely used by businesses and governments
    to identify their workers and constituents. These are physical cards with a chip
    inside that holds a digital signature and grants the cardholder access to the
    systems or actual buildings of an institution. In the healthcare sector, digital
    signatures are used to streamline administrative and therapeutic procedures, boost
    data security, enable e-prescribing, and manage hospital admissions. Digital signatures
    are used by manufacturing organisations to streamline operations such as product
    design, quality control, production improvements, marketing, and sales. For contracts,
    paperless banking, loan processing, insurance documentation, and mortgages digital
    signatures are used. Digital signatures are used by Bitcoin and other cryptocurrencies
    to verify the blockchain. With digital assets, such as music, artwork, and films,
    digital signatures are utilised to secure and track these kinds of NFTs everywhere
    on the blockchain.


    # 6.4 CLASSES AND TYPES OF DIGITAL SIGNATURE


    There are three types of digital signatures:


    +   - **Class 1:** Since they are solely validated based on an email ID and username,
    this sort of DSC cannot be used for official business documents. Class 1 signatures
    offer a fundamental level of security and are applied in settings where there
    is little chance of data compromise.

    +   - **Class 2:** These DSCs are frequently used for electronic (or “e-”) filing
    of tax papers, including as returns for both the goods and services tax and the
    income tax. Class 2 digital signatures check the identity of the signer against
    a database that has already been confirmed. In settings with moderate risks and
    effects of data compromise, class 2 digital signatures are utilised.

    +   - **Class 3:** The highest level of digital signatures, Class 3 signatures
    demand that individuals or organisations present themselves before a CA to establish
    their identity before signing. Class 3 digital signatures are used in e-auctions,
    e-tendering, e-ticketing, court filings, and other settings where there are significant
    risks to data or repercussions from a security breach.


    # 6.5 THE USE OF PUBLIC KEY INFRASTRUCTURE (PKI) AND PRETTY GOOD PRIVACY (PGP)
    WITH DIGITAL SIGNATURE


    Public key infrastructure (PKI) and the pretty good privacy (PGP) encryption programme
    are both used in digital signatures to minimise any potential security risks associated
    with transmitting public keys. They authenticate the sender’s identity and confirm
    that the sender’s public key indeed belonged to that person.'
