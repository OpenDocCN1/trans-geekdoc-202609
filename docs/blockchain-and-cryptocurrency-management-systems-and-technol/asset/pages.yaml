    # ### 10.2.4 Central Bank Digital Currencies (CBDC)


    Central bank digital currency (CBDC) represents a type of cryptocurrency that
    is issued by the central banks of various nations. These digital currencies, issued
    either in token form or through an electronic record linked to the country’s domestic
    currency, are regulated and controlled by the respective central banks. Although
    the integration of CBDCs into financial systems and monetary policies is still
    in its nascent stage in many countries, there is potential for wider adoption
    in the future. Similar to conventional cryptocurrencies, CBDCs utilize blockchain
    technology, aiming to enhance payment efficiency and potentially reduce transaction
    costs. While the development of CBDCs is ongoing among central banks globally,
    some share fundamental principles and technology with established cryptocurrencies
    like Bitcoin.


    The issuance of CBDCs in token form or electronic records for ownership verification
    aligns them with existing cryptocurrencies. However, CBDCs differ in that they
    are closely monitored and regulated by the issuing government, relinquishing the
    advantages of decentralization, pseudonymity, and censorship resistance typically
    associated with other cryptocurrencies. CBDCs leave a traceable “paper trail”
    of transactions, enabling governments to enforce taxation and economic rents.
    On the positive side, in a politically stable and inflation-controlled environment,
    CBDCs are expected to maintain their value over time, or at least closely track
    the value of the pegged physical currency. Buyers of CBDCs benefit from the backing
    of the issuing country’s full faith and credit, reducing concerns related to fraud
    and abuse that have plagued some traditional cryptocurrencies (Fokri, 2021).


    # ### 10.2.5 From Digital Ledger to Cryptocurrency Craze


    There is a common misperception that the birth of blockchain technology can only
    be credited to the anonymous author known as “Satoshi Nakamoto,” who published
    the Bitcoin white paper in 2008. However, it is possible to go back much further,
    all the way to the 1980s, to find the origins of this revolutionary technology.
    A digital ledger system with a distinctive structure was developed in that era
    by two pioneers, Stuart Haber and Scott Stornetta. This design ensured that changing
    just one link in the chain would cause the entire sequence to fall out of place—significant
    questions developed at the time as personal computing started to permeate the
    typical American family. The first was how one could have confidence in digital
    data, which was prone to manipulation. Second, could these changeable digital
    records be'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'trusted at all in the absence of a centralized authority to control them? Nakamoto
    added the idea of “mining” to the decentralization theory that Haber and Stornetta
    had previously developed. People could receive Bitcoin as an incentive by figuring
    out difficult mathematical riddles connected to transactions within a block. This
    clever reward system served as a deterrent to tampering. Blockchain technology
    is safe and resistant to fraud because of the network’s interconnection, which
    means that any attempt to tamper with a single block would cause the entire chain
    to break.


    Although Bitcoin didn’t leave the world of computer programming until the late
    2000s, this technology went in intriguing new directions. The tale of Florida-based
    computer programmer Laszlo Hanyecz serves as a prime illustration. A remarkable
    10,000 Bitcoins were offered by Hanyecz in 2010 in exchange for the simple pleasure
    of receiving two pizzas delivered to his home (Jones, 2022).The pizzas then went
    for a reasonable $30 each. But by May 2018, those identical pizzas, sent to Hanyecz
    by a person in England, had accumulated an incredible worth of USD82 million (Whitaker,
    2019). This crucial event took place on May 22, and that day is now recognized
    as “Bitcoin Pizza Day” (Whitaker, 2019). The laws of supply and demand govern
    the value of Bitcoin, just like they do for traditional commodities. It’s important
    to understand the path that cryptocurrencies have taken, from their conception
    in specialized computer programming circles to their incorporation into the lives
    of regular people. Comprehending this trip becomes essential when considering
    the potential uses of cryptocurrencies shortly. However, as with every game-changing
    development, it’s critical to recognize and handle the various worries and difficulties
    that emerge alongside this technological advancement. As time goes on, realizing
    cryptocurrencies’ full potential necessitates striking a fine balance between
    the concerns they raise and the promises they provide.


    # 10.3 DECRYPTING CRYPTOCURRENCY’S REGULATORY CONUNDRUM


    A puzzling conundrum remains in the complex world of cryptocurrencies: why do
    governments and central banks hesitate to accept this progressive financial system?
    The main problem is that a formal regulatory framework does not govern cryptocurrency
    transactions. The decentralized structure of Bitcoin transactions creates concerns
    due to the lack of channels for addressing issues, in contrast to traditional
