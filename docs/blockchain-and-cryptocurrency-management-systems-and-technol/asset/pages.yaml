    # 3.10 INDIAN SCENARIO


    The government of India has still not declared cryptos to be legal in India. Hence,
    no regulations have been laid down so far. Cryptocurrency in India operates without
    regulation or issuance by any central authority. The absence of specific guidelines
    for resolving disputes or disagreements when dealing with cryptocurrency is a
    notable aspect of this unregulated landscape. Hence, if interested persons want
    to deal in it, they will have to do it at their own risk. But from the statements
    issued and stances taken by the Governor of the Reserve Bank of India and the
    Honourable Finance Minister of India, Ms. Nirmala Sitharaman, so far, we can safely
    say that it is not banned in India till date. The Finance Minister of India has
    implemented taxes on cryptocurrencies, leading to discussions and debates regarding
    the legal status of cryptocurrency within the country (Hanna Halaburda & Guillaume
    Haeringer, 2018). Concurrently, the government has also undertaken efforts to
    launch India’s own cryptocurrency and establish an exchange to oversee the regulation
    of cryptocurrency trading and investments (Saito, 2014). Until 2022, cryptocurrency
    operated in a largely unregulated environment. However, the situation altered
    when the authority introduced a 30% tax on cryptocurrency profits and a 1% tax
    deducted at the source in the Union Budget of 2022. This clarified the motives
    of the officials in India. Most of the participants voted in favour of this action
    and believe that it is the initial step towards achieving official recognition
    for cryptocurrency within the country (Saito, 2014).


