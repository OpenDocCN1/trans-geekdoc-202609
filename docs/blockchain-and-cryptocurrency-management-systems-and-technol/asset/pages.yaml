  md: '# ### 6.9.2 Minimalist Laws


    As the name suggest, these regulations permit e-Signatures to be widely enforced
    with little limitations. These laws are not technology-specific and allow the
    use of e-Signatures for all users. Like a shield, minimalist rules offer the broadest
    protection and are effective in the majority of circumstances. These rules are
    typical in nations including Canada, Australia, New Zealand, and the United States.


    # ### 6.9.3 Two-tier Laws


    Two-tier rules give digital signatures more weight as evidence and allow the use
    of e-Signatures. This is a combination of prescriptive and minimalist legislation.
    Similar to minimalist laws, two-tier laws establish a class of authorised technologies,
    similar to prescriptive laws, but they also accept all or most e-Signatures on
    a technology-neutral basis. Two-tier e-Signature rules have been implemented by
    China, South Korea, and most European countries.


    # ## 6.10 Understanding Digital Signature Law Around the World


    # ### 6.10.1 United States of America


    The Uniform Electronic Transactions Act (UETA), which established a legal framework
    for the use of e-Signatures, was created in 1999 by the Uniform Law Commission.
    The U.S. Congress passed the Electronic Signatures in Global and National Commerce
    Act in 2000 to ensure the legality and validity of contracts entered electronically,
    thereby facilitating the use of electronic records and e-Signatures in interstate
    and international commerce. All business agreements, financial contracts are done
    by digital signature. Today the electronic signature is equal to writing. Irrespective
    of whatever may be the documents, it has its full legal force. Here even non-state
    certified businesses are issuing EDS. There aren’t any certification centres as
    a result. The signature classification is also absent, with the exception of the
    highly responsible sectors of real estate, healthcare, and government contracts.
    The necessity of executing an agreement is one distinctive feature of this area
    of US law. This implies that companies need to write a contract outlining their
    shared commitment to conducting business and supplying basic paperwork.


    # ### 6.10.2 United Kingdom


    The UK belongs to the first group of nations that use EDS. This implies that electronic
    signatures have equal legal weight and full legal force as a written one. A certificate
    of this kind will be just as valid in court as a comparable written document.
    Small- and medium-sized enterprises are especially encouraged to adopt EDS'
