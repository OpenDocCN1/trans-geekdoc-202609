    # 11.10 CONCLUSION


    The primary goal of this chapter was to expand on past studies as well as enrich
    the existing publications on the advantages of blockchain technology in healthcare
    tourism. Earlier studies investigated the impact of data innovations in medical
    tourism before and after procedures; nevertheless, they did not concentrate on
    the beneficial role of blockchains. To add to the body of knowledge, this chapter
    primarily focused on the potential strategic role of blockchain technology and
    conceptualized the benefits of blockchain technology for two major stages of health
    tourism: during and after the process.


    As a result, the chapter contends that medical tourists and healthcare providers
    alike may benefit from the use of blockchain technology in terms of an easier
    way to find a healthcare provider, a faster and more secure payment method, guaranteed
    data security and privacy, and trusted and highly recommended. Furthermore, the
    chapter extends the current literature on blockchain in tourism research by suggesting
    the future consequences of these modern features for the medical travel industry.
    Given the COVID-19 disease outbreak, the chapter is both timely and pertinent.
    The pandemic had an impact on the entire tourism industry, including medical tourism.
    To address this issue, the chapter summarized several challenges that the medical
    tourism industry is facing as a result of the pandemic and outlined some opportunities
    for blockchain technology use in the current situation, such as reducing waiting
    times for all travel-related government documents, including residence permit
    granting, as well as ensuring the authenticity of these records.


    Whereas the chapter provides many perspectives on the advantages and potential
    of blockchain technology for health tourism, it does have some constraints.'
