    # 3.12 ADVANTAGES OF CRYPTOCURRENCY


    As it is a technology-based financial product, cryptocurrencies have gained popularity
    among investors worldwide in recent years, thanks to the massive technological
    development in software, hardware, and information technology. Cryptocurrencies
    facilitate the transfer of funds without the need for banks and other financial
    institutions, making it particularly convenient for international and cross-border
    transactions. Consequently, Bitcoin and Ethereum have gained a favourable position
    in this regard. The advantages of cryptocurrencies can be summarized as follows:


    # 1. Protection against Inflation


    Inflation reduces the actual values of products as well as currencies. But investors
    consider cryptocurrency as a product that gives protection against inflation.
    Most cryptocurrencies use the same mechanism to maintain immunity against inflation
    (B Scott - 2016 - econstor.eu)


    # 2. High Speed of Transactions


    Electronic money transfers typically take several hours to even a few days, depending
    on various factors such as the geographical distance between the sender and recipient,
    the location of the origin and destination, especially for international and cross-border
    transactions, and other variables. In contrast, cryptocurrency transactions can
    be conducted within a matter of minutes, providing a hassle-free and appealing
    option to many.


    # 3. Low Cost of Transactions


    Cryptocurrencies do not need the intervention of any third parties, agencies,
    or payment gateways like VISA to complete transactions. Hence, they can help transfer
    funds globally almost free of cost. Transaction costs associated with cryptocurrency
    can be minimal or even negligible (Investopedia: Adam Hayes, updated April 23,
    2023).'
