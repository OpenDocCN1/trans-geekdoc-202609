    # 3.11.4 FORECASTING PROCEDURE


    The forecasting model has been developed in R software by using readxl, stringr,
    dplyr, and prophet packages. The dataset is cleaned and preprocessed by replacing
    the null values with 0, and renaming the date and close columns as ds and y, respectively.
    Model 1 is constructed by utilizing the Prophet library’s function “f(x)” to fit
    the model to a vector with daily seasonality.


    ```

    Model1<-prophet (my_data2, daily.seasonality = TRUE)

    ```


    To forecast the closing price of BTC-USD, another dataset is created for a time
    period of 1 year.


    ```

    Future1<-make_future_dataframe (Model1, periods = (365*1))

    ```


    The future dataset is tested and trained by Model 1 to forecast. Another vector
    is created that includes the


    +   Date “Ds”;

    +   Standard predicted close price ŷ;

    +   lower estimated close price ŷ_lower;

    +   and upper estimated close price ŷ_upper.


    ```

    Forecast1<-predict(Model1,Future1)

    ```


    The predicted price trend is depicted by the slender line, while the dashed black
    line illustrates the historical price evolution over time in Figure 3.5.


    ![](img/4912d151d56a592b7c7c477c5efa929c_75_0.png)


