    # 7.3.3 Offline AI competence with Fog Computing in Mobile Health Monitoring System


    The fog computing permits the AI to run nearby the end network devices with or
    without internet connectivity. This particular case is more beneficial where internet
    access is not required continuously or in areas where the network outages persist.


    The development of handheld health monitoring devices such as smartwatches and
    fitness bands is used to monitor the human health in an optimal manner. It collects
    the vital signs of human health continuously and stores them in a central cloud
    system. The data stored in the cloud is analyzed, processed, and given the alerts.
    In the conventional process, the wearables continuously monitor the signs and
    send them directly to the cloud server for analysis. The AI algorithms available
    in the cloud environment process the data and generate recommendations. The major
    challenge of the conventional system is that the entire architecture is internet-dependent.
    It requires continuous internet support to provide optimum recommendations, and
    false alarm may be generated in areas of poor network.


    The fog computing can be integrated into mobile health monitoring to facilitate
    AI competence without the internet. The fog nodes are deployed in various places
    to process data that belong to health monitoring locally without the need of an
    internet connection. The fog nodes with AI capabilities can run AI algorithms
    locally, analyze the health data, detect abnormalities, and provide the insights
    to users without sending all the information to the cloud. The fog nodes can generate
    alerts locally to the end users about their health conditions without any internet
    support. The mist nodes collect the information from the sources until an internet
    connection is available; when the connection is restored, the collected data is
    synchronized with the cloud environment, ensuring that data may not be lost at
    any point.


    The integration of blockchain in mobile health monitoring leads the safe and secure
    data processing using fog nodes. Once the health-related data is entered onto
    the blockchain, it becomes tamper-proof and immutable, which improves the data
    integrity.


    This arrangement permits users to receive health-related recommendations even
    when they are not in the area of internet coverage. It provides timely alerts
    to individuals and healthcare professionals with greater reliability and accessibility.


