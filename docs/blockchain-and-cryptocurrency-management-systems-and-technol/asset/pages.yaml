  img_proc: true
- pgno: 105
  md: 'Because of the faster rate of mining, Ethereum is very much popular after Bitcoin
    in the current market and its token ETH is consistently growing into the market.
    But the problem with PoS is that the miner needs a large investment to maintain
    the stake.


    # 4.8 DELEGATED PROOF OF STAKE (DPOS)


    The general abbreviation used for Delegated Proof of Stake is DPoS and is developed
    by Daniel Larimer, founder of BitShares, Steemit, and EOS in 2014 [44]. It is
    one of the popular variants of PoS, and is designed to improve scalability and
    energy efficiency compared to traditional proof of work (PoW) systems like Bitcoin.
    It works on the voting system for tokens. In this system, token holders on the
    blockchain network have the ability to choose a predetermined number of delegates.
    These delegates can add new blocks to blockchain after validating the transactions.
    The number of delegates is typically not more than the total number of token holders
    in the network. In general, it is quite less compared to the number of token holders,
    allowing efficient and scalable consensus mechanism processes. It is a network
    algorithm, where only trusted validators have rights to validate the transactions.
    These rights are given by other network delegates of the specific blockchain.
    The major aim is to provide a more energy-efficient and scalable alternative to
    the traditional proof of work consensus mechanisms. DPoS aims to find a balance
    between decentralization, security, and efficiency by permitting all token holders
    to vote in the consensus process (Aithal et al., 2021).


    # 4.9 PRACTICAL BYZANTINE FAULT TOLERANCE (PBFT)


    The general abbreviation used for practical Byzantine fault tolerance is PBFT.
    Miguel Castro and Barbara Liskov came up with an idea through a study released
    in 1999 (Amiri et al., 2021). Only dependable validators can participate in a
    consensus algorithm for Permissioned blockchains. PBFT is a consensus algorithm
    for Permissioned blockchains that works with only trusted validators. It plays
    a major role in the world of internet of things (IoT) also. The major benefit
    of having the Byzantine fault tolerance is to manage a failure of the system.
    If a node is met with failure then the removal of node is suggested and optimizing
    the work in less time is the major usage of PBFT. It mainly offers the sequential
    order of all the nodes, where one node is the primary node and all other nodes
    are considered to be secondary nodes. PBFT mainly keeps the record so that no
    more than one-third of the total nodes have malicious activity. For example, if
    the total number of nodes is n, then not more than n/3 should have malicious activity.
    The practical Byzantine fault tolerance (PBFT) method is used by blockchain systems
    including Zilliqa, Hyperledger Fabric, and Tendermint.


    # 4.10 PROOF OF AUTHORITY (POA)


    The abbreviation for proof of authority is PoA and is a consensus mechanism with
    a limited number of trusted nodes. The major task of these trusted nodes is to
    validate'
