    # 6.13.2 DIGITAL SIGNATURE FOR INDIAN CITIZENS – CLASS 3


    Nowadays, a lot of documentation is sent electronically, and digital signatures
    aid in proving the sender’s identity. DSC is used to validate online transactions,
    including Income Tax E-Filing and Company or LLP Incorporation.


    # 6.13.3 OBTAINING A CLASS 3 DIGITAL SIGNATURE IS MANDATORY IN THE FOLLOWING CASES


    +   1. E-filing income tax returns in case of every registered trust, partnership
    firm, companies, any other entity, or individual who is required to get tax audit
    under the Income Tax act.

    +   2. Company filing with Ministry of Corporate Affairs (MCA).


    MCA has mandated digital signature for the following individuals:


    +   (i) Directors.

    +   (ii) Auditors.

    +   (iii) Company secretaries – whether in job or practice.

    +   (iv) Bank official – for registration and satisfaction of charges.

    +   (v) Other authorised signatories.


    # 6.14 CERTIFYING AUTHORITIES


    Certification agencies are appointed by the office of the Controller of Certification
    Agencies (CCA) under the provisions of IT Act, 2000, in India. There are a total
    of 14 certification agencies authorised by the CCA to issue the digital signature
    certificates (www.cca.gov.in). In India, digital signature certificates are issued
    under section 24 of the Indian IT Act, 2000, and the below certifying authorities
    has been given a licence to issue these certificates. One can procure class 2
    or 3 certificates from any of the certifying authorities (Table 6.1).


    There are a total of seven certification agencies authorised by the CCA to issue
    the digital signature certificates. As per the CCA 2.0 guideline 2.0 for crypto
    tokens, only new series of token can be used to download certificate from July
    1, 2023. So old series token cannot be used to download new certificate from July
    1, 2023.


    # 6.14.1 E-MUDHRA DIGITAL SIGNATURE ONLINE


    From e-Mudhra both individual and organisations can obtain digital signatures
    online with ease and without using physical documents. Anyone who is interested
    in purchasing digital signatures can use this service. e-Mudhra is a reputable
    certifying'
