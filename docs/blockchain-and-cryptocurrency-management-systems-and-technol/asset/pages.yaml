    in various ways. Numerous nations have limited mobility and imposed long-term
    lockdowns, curfews, and other forms of social segregation. Many airlines, especially
    those to popular medical tourism destinations, have been cancelled, along with
    local and intercity connectivity, and several tourist industry enterprises. COVID-19
    has had a significant impact on the healthcare system in medical tourism destinations.
    Many hospitals have had to treat COVID-19 cases and develop COVID-19 recovery
    units instead of providing hospital rooms or treatment units for international
    medical tourists. Most hospitals could only perform safety protocols; non-essential
    procedures were delayed or cancelled. Moreover, a healthcare provider’s COVID-19
    safety measures are critical for maintaining the outstanding quality and innovativeness
    regarded by world healthcare visitors. Despite the difficulties of a disease outbreak
    for the medical tourism market, several opportunities for blockchain use may exist.
    For starters, blockchain technology is more likely to be used as a secure database
    for data storage and dissemination from patients’ health records among multiple
    patients and medical professionals. In terms of encouraging telemedicine, the
    pandemic forced the digitization of the medical tourism industry. Physicians from
    all over the world can discuss and treat both national and international clients
    using content and teleconferencing techniques. There are times when the views
    of many physicians must be discussed, or a practitioner must be substituted. In
    these cases, the physician can send the necessary information to the doctors in
    a safe and timely manner.'
