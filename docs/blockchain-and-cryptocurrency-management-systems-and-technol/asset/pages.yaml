    # 6.19.1 SURVEY


    A survey was performed in India, especially in Bangalore, which is the “Silicon
    Valley of India,” where majority of the population is aware of digital signature.
    The survey was conducted to support the theoretical study. The survey questions
    were formed by adopting “The Survey Kit: How to Ask Survey Questions” 2nd edition
    by Arlen Fink. Apart from this, the suggestions were taken from “Survey Monkey.com”
    too. The survey was conducted among non-technical, and technical, general public,
    but not illiterate people. Only simple questions were prepared and distributed,
    consisting mainly of yes/no type questions. Apart from these, multiple-choice
    questions were also asked.


    The survey was conducted to find the knowledge about digital signatures among
    people from India. Around 150 people were taken randomly to answer the questions
    from various parts of India, especially from Bangalore. Most of the data were
    received by asking the participants to fill up the questionnaire and through interviews.
    Apart from this, the participants’ data were collected through telephonic interviews,
    Google Meet, and Microsoft Teams using the online software named “Qualtrics.”
    The same questions were asked in the interviews as well. In fact, some questions
    were skipped based on the answers given to the previous questions.


    # 6.19.2 CHOOSING THE PARTICIPANTS


    The population and the allowable error in the statistics determine how many people
    participate in the survey. Owing to the time constraint and the fact that the
    survey serves as support for the theoretical investigation, the researcher selected
    150 participants Figure 6.4 gives a clear idea of how the participants were selected.


    # 6.19.3 FINDINGS OF THE SURVEY


    The questions were made simple as they were distributed to a diverse group of
    people such as educated and illiterate people. The survey''s aim is to collect
    data that provide information for the following.'
