    # 5.5.4.1 Ekwateur, France


    A firm in France, Ekwateur, has grown rapidly with more than 300,000 consumers
    today. The firm, with the help of BCT, accounts the units and sources of energy
    consumed. The consumers are able to know the type of energy consumed, and BCT
    in turn enables the consumers to customize their energy mix according to price
    and source. The company certifies and settles the energy transactions every 30
    minutes, and consumers can choose the cheapest energy that could be either from
    a rooftop next to their door or from a wind farm close to their residence.


    # 5.5.5 CASE STUDY 5


    # 5.5.5.1 Enerchain, Germany


    Enerchain, a project of Germany launched in 2017, has developed a technical infrastructure
    facilitating wholesale trading of energy, especially power and gas, in a decentralized
    manner using BCT by eliminating the intermediaries. This is the first project
    to enable spot and forward contracts in both power and gas markets, which has
