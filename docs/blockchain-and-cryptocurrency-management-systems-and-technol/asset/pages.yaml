- pgno: 92
  md: 'a combination of block header and transactions. Block header consists of the
    block version, Merkle root, Timestamp, Nonce value, and the hash key of the previous
    block wherein a transaction contains the list of transactions and coin base.


    Block version is a number which will help to track protocol upgrades. Merkle root
    is the topmost hash value of a transaction which is a combination of all the nodes
    at different levels. Merkle root is one of the most secure hash codes generated
    by the SHA-256 algorithm. Timestamp will tell the time of the block added to the
    blockchain. Nonce value is a value which always starts from zero and indicates
    increment to solve the mathematical puzzle for the verification of a transaction.
    Previous hash is the address of the previous block for the proper consecutive
    linking of blocks (Kang et al., 2018).


    # 4.2.1 MANAGEMENT OF BLOCKS IN BLOCKCHAIN


    Blockchain is the series of blocks consisting of multiple transactions in every
    block and all the blocks are interconnecting to each other for proper linking.
    Blockchain block management is dependent on a series of steps, each of which has
    multiple substeps. The first step is to choose the specific blockchain according
    to the requirement. Choosing the right blockchain for the right purpose will make
    the business more efficient and prompt. The basic understanding should be what
    kind of blockchain is required, i.e. private, public, or hybrid. The second step
    is the creation of a transaction and its broadcasting to the network after the
    validation process. The transaction management of each block is also one of the
    major aspects in validation of the blocks. Every block consists of one or multiple
    transactions which adds some of the major information in the block. The steps
    to be taken for managing blocks in blockchain in detail are explained below.


    The process begins with the inception of a transaction that leads to creation
    of a new block. Transaction is the data to be added into blocks for the fulfillment
    of chains in blockchain. This transaction can be between two parties also where
    one party wants to forward some data or cryptocurrency to the other party. It
    can be a transfer of assets from one person to another or a digital money transfer
    in case of a crypto transaction. The transaction mainly leads to the data to be
    maintained in the blockchain. Once the transaction is done, the next phase is
    to look for the broadcast of the same into the network. Broadcasting the transaction
    requires the process of verification and validation (Mukherjee et al., 2021).
    The management of broadcasted transactions into the network is to maintain a peer-to-peer
    protocol, so that every node in the chain can have the information about the transaction
    and its management in blockchain. The verification part generally proceeds towards
    the checking of data viability, when it is transferred from one person to another.
    In the case of digital financial transactions, the main focus should be on whether
    the person/node who wants to transfer the digital asset has sufficient assets
    with him or not. For example, if a person wants to forward 100 Bitcoins to the
    other person using the Bitcoin blockchain, then the verification of the transaction
    should lead to checking whether the first person has 100 Bitcoins or not and the
    source of these 100 Bitcoins (Kamath Reshma, 2018).'
