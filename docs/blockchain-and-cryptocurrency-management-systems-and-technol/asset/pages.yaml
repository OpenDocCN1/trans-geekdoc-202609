    # 7.2.1 BLOCKCHAIN AND AI IN HEALTHCARE


    The algorithms designed in AI are used to enhance decision-making according to
    the data fed into them. In healthcare industry, AI algorithms are used to gather
    data, analyze it, and make decisions according to the algorithms designed. The
    analysis and output presentation provide optimized results through significant
    patterns with reduced errors. Past history and symptoms are fed as input to the
    AI-based algorithms to predict the disease as output. The output can be given
    in the form of alerts, warnings, and care tips for the data given as input. In
    medical imaging systems, AI algorithms can detect even the minute changes that
    can’t be recognized by human beings directly. One of the widespread applications
    of AI is telemedicine. The programs developed in the system can monitor patients
    and convey the necessary information to the concerned person to take immediate
    action and improve the success rate.


    One of the emerging techniques in the healthcare industry is blockchain technology,
    which can store data in a shared ledger securely and in an organized manner. The
    utilization of fake drugs is noticeably reduced with the help of a blockchain
    network. The combination of blockchain and AI can transform the healthcare industry
    to the next level.


    The proof of work and the proof of stake are the consensus algorithms used widely
    in the blockchain network and will not consider the computational complexity and
    other metrics (Kumar et al., 2020). The fairness of the blockchain network is
    enhanced by implementing AI into the consensus algorithms. A healthcare setup
    has been established to produce the dataset and applied input to the network.
    The role of the miner peer is to substantiate the data among others. The disadvantages
    of the miner nodes are noticeably discarded by using the AI-based blockchain consensus
    model, which can further improve the performance of the blockchain network.


    One of the major issues of the health care industry is fraudulent claims of health
    insurance (Kapadiya et al., 2022). At present, most of the people are engaged
    with health insurance to face sudden expenditures (i.e. health emergency) if any.
    Nowadays, the healthcare insurance industries are facing many challenges like
    security, fraud, and privacy. Organizations need to come forward to develop systems
    to'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'act against malicious parties. The AI-based blockchain approach effectively
    diminishes fake users and provides secure transaction.


    Digital farming is one of the emerging areas to be focused on currently. The Internet
    of Things (IoT) is playing a major role in smart agriculture (Fan et al., 2021).
    The area of interest is continuously monitored and collected for further processing.
    However, accuracy and reliability are the two main parameters deciding the decision.
    Conventional data aggregation and privacy protection will not solve the issues
    completely in digital farming. Blockchain, along with the AI module, provides
    the best effort solution and decentralized architecture to enhance fault-tolerant
    capability in digital agriculture.


    The AI-enabled blockchain network was implemented in agricultural supply chain
    management. AI-based algorithms enhance the quality of service and efficiently
    use the resources. Unmanned aerial vehicles (UAVs) combined with the AI and blockchain
    are used in agriculture for tracing, tracking, and contracts (Zawish et al., 2022).
    Instead of a single compressed convolutional neural network, the fully convolutional
    neural network (FCN) is used to handle more than one task-specific model with
    less complexity and improved accuracy.


    AIoT enabled novel blockchain architecture is developed and used to monitor the
    area of interest (Alrubei et al., 2022). The collected data are processed, analyzed,
    and validated and then shared into the blockchain network. During the process,
    the AI engine effectively handles the data and provides meaningful outcomes.


    According to the expert’s prediction, in the near future millions of devices can
    connect with the internet, out of which one-third are mobiles, desktops, and tablets
    (Banafa 2022). The remaining devices are sensor units, smart home appliances,
    and other IoT-enabled terminals. The role of IoT is to connect people, data, and
    processes. To provide trustworthiness among all the peers in the network, it is
    necessary to combine AI with blockchain and IoT. By enabling this, it can be ensured
    that the necessary privacy is provided among every node in the blockchain network
    (Gupta et al., 2021).


    # 7.2.2 OPEN RESEARCH CHALLENGES


    The open research challenges when combining artificial intelligence with blockchain
    networks are elaborately detailed below.


    +   - **Privacy Protection**


    The records fed into the blockchain network are publicly available in the shared
    ledgers and the same are available to all the readers. In parallel, the devices
    concerned are continuously collecting private and sensitive data and putting them
    onto the open shared ledgers. This is the point of concern we look into. Data
    privacy should be ensured by using encryption functions to allow access. The increased
    number of records can be effectively handled when processed with the AI to make
    the necessary decisions.'
