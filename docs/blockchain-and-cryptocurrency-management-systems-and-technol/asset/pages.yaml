  md: '# 3 Exploring Cryptocurrencies – Heading towards the Peak or Valley


    *Baisakhi Mukherjee and Biswarup Chatterjee*


    # 3.1 PREVIEW


    With the advent of the digital era, cryptocurrencies are an emerging concept.
    Based on the academic resources available, it is evident that cryptocurrency is
    gaining acceptance and is becoming popular in the growth and development process
    of the economy. Cryptocurrencies are expected to play a pivotal role in the shift
    from risk management to achieving financial stability, simultaneously expanding
    opportunities for financial inclusion and fostering innovation in the financial
    sector (Kelly, 2014). At the time when this chapter was being written, Bitcoin
    was rising to the level of $26,500, and there was speculation that it could trigger
    negative market sentiment if it crossed this threshold. Experts have opined that,
    from the overall technical perspective, the position of Bitcoin is trending slightly
    towards positivity. This chapter intends to explore the crypto industry and attempts
    to forecast the position of Bitcoin in the near future.


    The World Economic Forum (WEF) reported in July 2022 that cryptocurrencies are
    a type of virtual asset, primarily composed of cryptographic algorithms and distributed
    ledger technologies. This chapter intends to deal with virtual assets and online
    infrastructure such as Bitcoin, which are freely accessed, exposed, and permissionless
    in nature. The operation of Bitcoin largely depends on a global network of computers
    to validate transactions and ensure network integrity (Saito, 2016). As an irony
    of life, cryptocurrencies are misunderstood many times as currencies, but they
    are not currencies at all (Kelly, 2014). They are conjectural assets whose estimates
    vary over time. This feature of crypto makes its acceptance and usage more complicated
    among users. The awareness and regulation of crypto are at its nascent stages,
    which attracts the academic researchers to dig deeper and develop insights that
    will prove fruitful for individuals in every industry (Team, 2016).


    According to experts in economics, the field of cryptocurrency is not yet researched.
    There is very little knowledge about the concept, operations, and regulatory policies'
