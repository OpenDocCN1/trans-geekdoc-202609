  img_proc: true
- pgno: 98
  md: '# Permissionless Permissioned


    ![](img/4912d151d56a592b7c7c477c5efa929c_98_0.png)


    FIGURE 4.6 Types of blockchain. Source: Authors.


    # 4.3.1 PERMISSIONED BLOCKCHAIN


    Permissioned blockchain is a closed constrained network where the chain of blocks
    is in a restrictive environment of an individual or an organization. It follows
    the concept of DLT, i.e. distributed ledger technology, and manages the nodes
    in the peer-to-peer fashion. These blockchains are generally not very large because
    everyone on the internet is not permitted to join the network and participate
    in consensus mechanisms. Permissioned blockchains require the participants to
    obtain authorization or permission to access the network and engage in various
    activities. Private and Consortium type of blockchains come under the category
    of Permissioned blockchain. A private blockchain is controlled by a specific authority
    and the consortium is controlled by a group, responsible for granting access permission
    to a community (Mohanty Debajani 2019).


    # 4.3.2 PRIVATE BLOCKCHAIN


    A private blockchain, also referred to as Permissioned blockchain, is generally
    a restricted blockchain designed inside the firewall of an organization, so that
    the restrictions can be managed more efficiently. Basically, private blockchains
    are designed for controlled environments where only known entities can collaboratively
    carry out the operations. Such a type of blockchains builds a higher level of
    trust among participants. Greater control over data protection, quicker processing
    of transactions, and customized governance models are all made possible by such
    types of restricted access. For the industries requiring security and confidentiality
    for their data, a private type of blockchain is more appropriate. The primary
    drawback of private blockchain is its small size, which may lower the security.
    Most common examples of private blockchain are Hyperledger Fabric and R3 Corda.
    Both of them'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'are open source enterprise-grade permissioned distributed ledger technology
    (DLT) platforms (Amu D. and Santhi Baskaran 2022).


    # a) Hyperledger Fabric


    Hyperledger Fabric is one of the open source projects of Hyperledger. As opposed
    to restricted domain-specific languages (DSL), Fabric is the first distributed
    ledger platform that supports smart contracts written in general-purpose programming
    languages like Go, Node.js and Java (Ana et al., 2018). This implies that further
    training of the individuals to learn a new language is not required as a majority
    of businesses are already working with such technologies and therefore possess
    the skill set required to create smart contracts. It also enables developers,
    teams and organizations to build together a few tools to simplify and secure the
    work. Healthcare is one of the industries, where Hyperledger Fabric can be used
    to develop a structure to maintain the digital records of an individual in sequence
    more securely. The documents can be fetched directly by having a unique id or
    a fingerprint, so that instant medication help can be easily provided to an individual.


    # b) R3 Corda


    R3 Corda is an open source blockchain platform and is built on ISP principle,
    i.e. Interoperability–Security–Privacy principle. It is a suitable platform for
    financial institutions and enterprises. Corda can handle secured rapid execution,
    one of the most important needs of today’s financial organizations. Corda is intended
    to provide privacy. It enables participants to share data transactions with only
    those individuals or organizations, who have authorization and access rights.
    This level of discretion is necessary for businesses working in sensitive financial
    and legal domains. Banking institutions intend to employ R3 Corda to keep global
    financial transactions agile and simple. According to the information provided
    by Andre Carneiro on bbchain.com, R3 Corda has been used to build applications
    for some of the world’s largest institutions, including HSBC, ING, and J.P. Morgan
    (Khan et al.,2018).


    # 4.3.3 CONSORTIUM BLOCKCHAIN


    Consortium blockchain is generally a community blockchain. The community type
    stands for sharing of the same network by multiple trusted organizations for the
    completion of collective work. Each organization can enter into the dedicated
    network by having permission and work collectively. These types of blockchains
    are permissioned networks where no entity can enter without permission. Multiple
    organizations having rules and protocols to maintain and manage the data can use
    consortium blockchain for governance. MediLedger and IBM Food Trust are examples
    of consortium blockchain. MediLedger is basically designed for the healthcare
    industry globally. It is one of the major players in drug supply chain management,
    whereas IBM Food Trust, a product by IBM, is used for the improvisation of food
    supply chain management.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# a) MediLedger


    The healthcare business is one of the most important industries where people work
    collaboratively on the shared network to have the solutions of a particular problem.
    Collaborative work requires to establish protocols and business rules to control
    transactions and interactions among trading partners. MediLedger is one of the
    networks best suitable for enhancing the integrity and security of the pharmaceutical
    supply chain (Carolin Plewa et al., 2012). It was created to address challenges
    in the pharmaceutical industry such as traceability, counterfeit drugs, and regulatory
    compliance. MediLedger is also used to handle drug compliance and traceability.


    # b) IBM Supply Chain Intelligence Suite – Food Trust


    IBM Food Trust program is a blockchain-based modular solution that benefits all
    network participants by making the food environment safer, smarter, and more sustainable.
    The IBM Food Trust is a collaborative supply chain network from beginning to end.
    This process includes seed distribution to farmers, crop management in farming,
    crop processing, crop cutting, and crop distribution to wholesalers and retailers.
    IBM Food Trust program oversees it all. This IBM blockchain-based solution connects
    parties through a permissioned and immutable blockchain.


    # 4.3.4 PERMISSIONLESS BLOCKCHAIN


    The terms “permissionless” and “public” bockchains are frequently used interchangeably.
    They share a key characteristic, i.e. open access to participants. It works on
    the concept of distributed ledger technology, where the nodes are available and
    accessible to everyone. Everyone with approved login on the blockchain is considered
    as a participant. The participants have rights to validate the transactions and
    are referred to as miners. Permissionless blockchains are typically unrestricted,
    simple to use, and regarded as the public variety of blockchains (Castro et al.,
    1999).


    # 4.3.5 PUBLIC BLOCKCHAIN


    This one allows you to write, view, and validate transactions without any limitations.
    These blockchains maintain a dispersed network of nodes. The security issues are
    taken care of by the use of a consensus process. Public blockchain are commonly
    used in a wide range of applications, including cryptocurrencies, smart contracts,
    and decentralized apps (Dapps) (Veronese et al., 2013). They are notable for their
    dependability and resistance to censorship, because no single entity controls
    the network. Despite being an open access blockchain, it is resistant to hacking
    as the security will be jeopardized only if a hacker gains control of more than
    51% stake of blocks, which is difficult due to the size of blockchain. Bitcoin
    and Litecoin are two instances of the public blockchains, permitting participants
    to engage in activities without centralized control or permission.'
