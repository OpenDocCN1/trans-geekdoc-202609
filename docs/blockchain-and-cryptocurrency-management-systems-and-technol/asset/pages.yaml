  md: '# Big Data for Industry 4.0: Challenges and Applications


    Series Editors: Sandhya Makkar, K. Martin Sagayam, and Rohail Hassan


    Industry 4.0 or the fourth industrial revolution refers to interconnectivity,
    automation, and real-time data exchange between machines and processes. There
    is a tremendous growth in big data from the Internet of Things (IoT) and information
    services which drives the industry to develop new models and distributed tools
    to handle big data. Cutting-edge digital technologies are being harnessed to optimize
    and automate production including upstream supply-chain processes, warehouse management
    systems, automated guided vehicles, drones etc. The ultimate goal of industry
    4.0 is to drive manufacturing or services in a progressive way to be faster, effective
    and efficient that can only be achieved by embedding modern day technology in
    machines, components and parts that will transmit real-time data to networked
    IT systems. These, in turn, apply advanced soft computing paradigms such as machine
    learning algorithms to run the process automatically without any manual operations.


    The new book series will provide readers with an overview of the state-of-the-art
    in the field of Industry 4.0 and related research advancements. The respective
    books will identify and discuss new dimensions of both risk factors and success
    factors, along with performance metrics that can be employed in future research
    work. The series will also discuss a number of real-time issues, problems and
    applications with corresponding solutions and suggestions. Sharing new theoretical
    findings, tools and techniques for Industry 4.0, and covering both theoretical
    and application-oriented approaches. The book series will offer a valuable asset
    for newcomers to the field and practicing professionals alike. The focus is to
    collate the recent advances in the field, so that undergraduate and postgraduate
    students, researchers, academicians, and industry people can easily understand
    the implications and applications of the field.


    # Industry 4.0 Interoperability, Analytics, Security, and Case Studies


    Edited by G. Rajesh, X. Mercilin Raajini, and Hien Dang


    # Big Data and Artificial Intelligence for Healthcare Applications


    Edited by Ankur Saxena, Nicolas Brault, and Shazia Rashid


    # Machine Learning and Deep Learning Techniques in Wireless and Mobile Networking
    Systems


    Edited by K. Suganthi, R. Karthik, G. Rajesh, and Ho Chiung Ching


    # Big Data for Entrepreneurship and Sustainable Development


    Edited by Mohammed el Amine Abdelli, Wissem Ajili Ben Youssef, Ugur Ozgoker, and
    Imen Ben Slimene


    # Entrepreneurship and Big Data


    The Digital Revolution


    Edited by Meghna Chhabra, Rohail Hassan, and Amjad Shamim


    # Microgrids


    Design, Challenges, and Prospects


    Edited by Ghous Bakhsh, Biswa Ranjan Acharya, Ranjit Singh Sarban Singh, and Fatma
    Newagy


    # Handbook of Artificial Intelligence for Smart City Development


    Management Systems and Technology Challenges


    Edited by Sandhya Makkar, Gobinath Ravindran, Ripon Kumar Chakraborty, Arindam
    Pal


