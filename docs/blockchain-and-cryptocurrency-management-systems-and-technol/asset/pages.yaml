  md: 'impose such a limit. Some cryptocurrencies employ “burning” mechanisms, where
    existing tokens are permanently removed from circulation to prevent an excessively
    large circulating supply and curb inflation. Burning involves sending tokens to
    an irretrievable address on the blockchain (Stefan Hubrich, 2017). Each cryptocurrency
    follows its unique monetary policy.


    # 3.5 PRODUCTION EXPENSES


    Mining is a process through which new cryptocurrency tokens are produced. The
    process uses a computer to verify the next block in a blockchain. The persons
    who do this work are called miners. They use a decentralized network for this.
    As a form of compensation, miners receive newly created cryptocurrency tokens,
    along with any transaction fees paid by the parties involved in the cryptocurrency
    transactions (Pilkington, 2016). This whole process requires computing power for
    which the miners need to invest in expensive equipment and electricity. The miners
    need to solve complex mathematical problems in order to verify a block (Kar, 2016).
    The competition is higher for mining popular cryptocurrencies such as Bitcoin
    and Ethereum. As a result, mining costs also increase. As the expenses associated
    with cryptocurrency mining rise, it becomes necessary for the cryptocurrency’s
    value to increase as well (Hopp et al., 2017). As long as the value of the crypto
    is more than the costs, the miners do not mind and the demand for that particular
    crypto will be more. As a result, its value will also start increasing (Hanna
    Halaburda & Guillaume Haeringer, 2018). But once the cost of mining becomes more
    than the value of the crypto, the miners face a loss and are not interested in
    mining that particular crypto anymore. Hence, the demand for that crypto goes
    down. As a result, its value also goes down (Kar, 2016).


    # 3.6 CRYPTOCURRENCY EXCHANGES


    Just like any other securities, cryptos also have their own exchanges where they
    are traded. Prominent cryptocurrencies like Bitcoin and Ether are actively traded
    on numerous exchanges. It is obvious that cryptocurrency exchanges list the most
    popular ones (Hoppp et al., 2017).


    But some smaller, not-so-popular cryptos are available only on select exchanges.
    It makes their access limited for the investors interested in them. These exchanges
    charge fees for the listings of the cryptos (Hoppp et al., 2017).


    When a cryptocurrency is listed on multiple exchanges, it increases its demand
    among investors who are willing to buy it, thus increasing the overall demand.
    As demand increases, the price goes up (Lagarde Christine (Ed.) 2018).


    # 3.7 COMPETITION


    As cryptos have become an alternate investment option for investors, thousands
    of different cryptocurrencies have entered the market. The entry barrier is relatively
    low for new competitors (Aisen & Veiga, 2006). But creating a viable cryptocurrency'
