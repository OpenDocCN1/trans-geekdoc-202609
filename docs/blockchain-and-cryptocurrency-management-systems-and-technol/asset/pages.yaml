    # 8.4 LITERATURE STUDIED


    European Banking Authority (2014) examined more than seventy risks of using virtual
    currencies and found that they constitute substantial volatility, significant
    medium- and long-term risks of investing, risk of financial integration, money
    laundering, illegal financing, terrorism, and other illicit activities in which
    there are significant disadvantages of cryptocurrency. All these qualities have
    been preventing cryptocurrency from becoming a legitimate asset or currency.


    Sovbetov (2018) examined the determinants that influence the prices of the most
    common five cryptocurrencies such as Bitcoin, Ethereum, Dash, Litecoin and Monero
    during 2010–2018 applying the ARDL technique using weekly data. The article explored
    that crypto-market-related factors such as market beta, trading volume, and volatility
    appeared as significant determinants for all five cryptocurrencies both in the
    short run and in the long run.


    Antonakakis et al. (2019) used a Time-Varying Parameter Factor Augmented VAR model
    (TVP-FAVAR) to verify the transmission mechanism among nine leading cryptocurrencies.
    The authors found that Bitcoin is the most important transmitter of shocks in
    the cryptocurrency market, followed by Ethereum. The article found that connectedness
    measures among the nine cryptocurrencies exhibit large dynamic variability, with
    periods from high market uncertainty corresponding to strong connectedness and
    vice versa.


    Mariana, Ekaputra, and Husodo (2021) found that both Bitcoin and Ethereum are
    suitable as short-term safe-havens during extreme stock market plunges. Moreover,
    Ethereum was plausibly a better safe-haven than Bitcoin during the pandemic. The
    article also examined that during the Covid-19 both Bitcoin and Ethereum returns
    were positively associated with gold return and negatively interrelated with stock
