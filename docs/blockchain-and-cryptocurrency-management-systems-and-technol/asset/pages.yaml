    and flexibility to the electricity grids, allowing the consumers to track and
    trace every unit of electricity generated and consumed. BCT has not only helped
    with consumption but the decentralization of grids has enabled people to participate
    in energy markets, resulting in generation of income and improvement of lives.
    BCT is viewed as one of the effective solutions to create a stable and efficient
    power'
