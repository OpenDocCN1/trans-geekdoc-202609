  md: '# 5.8 DISCUSSION


    Blockchain technology can go a long way in creating transparency and accuracy
    in terms of decentralized energy supplies. Financial incentives and energy policies
    have developed renewable energy sources, but the transition can be possible through
    the application of BCT. Deployment of smart meters in developed countries has
    helped nations reduce the greenhouse gas emissions and reach the net-zero target
    well in advance. Fifty-three million smart meters for electricity supply have
    been planned in the UK, which in turn requires a huge investment, approximately
    $2 trillion per year for the USA. A report published by the UK stated the capacity
    of BCT not only to revolutionize financial markets, as in the case of Bitcoins
    and Cryptocurrency, but in the energy markets by enabling transparency, security,
    and accountability. BCT, believed to be a game-changer for energy suppliers can
    help achieve the low-carbon transition.


    There is a huge scope for BCT in the process of energy transition, but the scalability,
    cost, and security are considered major challenges in the application of BCT in
    the energy sector. Various micro and macro aspects today require the attention
    of policymakers to regulate the layout to accelerate BCT and its adoption in energy
    markets. Along with this, the policymakers of the nations can frame effective
    strategies to cope with the challenges of BCT in the energy sector and can strengthen
    the energy supply without compromising the environmental challenges.


    # 5.9 CONCLUSION


    The chapter has provided an in-depth discussion about BCT in the energy sector
    as it is considered a disruption. The energy sector across the globe is undergoing
    serious challenges related to transparency, safety, security, environmental harm,
    etc., and BCT can provide a long-run sustainable solution through an effective
    decentralization system.


    The global market for BCT is said to grow between 50% and 75% annually, reflecting
    rapid digital transformation, and the industries have successfully raised $23.7
    billion since 2013. Decentralized power generation and consumption through BCT,
    contrary to the centralized energy markets, enable a dynamic balance between the
    demand and supply of energy across the electrical infrastructure very efficiently
    and effectively.


    Many countries across the globe have successfully initiated BCT in the energy
    sector in the last few years, but commercially successful business in the energy
    blockchain space is yet to be witnessed. BCT enables players to manage demand
    in an effective manner, but the challenges are primarily found in the deployment
    of blockchain applications for EV infrastructure. Technology acceptance and public
    adoption limit the use of BCT in the energy sector, which could be overcome through
    educating people about the economic and environmental benefits arising from the
    application of BCT in energy markets.'
