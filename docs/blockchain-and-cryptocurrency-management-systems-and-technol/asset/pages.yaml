  md: '# 7.3.1.1 Pervasiveness of Privacy and Security


    In fog computing, the integrity and security of data are improved locally instead
    of sending it to a cloud server. This is one of the significant services of blockchain,
    which handles the personalized information. The stakeholders can rely on data
    privacy and integrity in blockchain technology associated with AI. The example
    shown below is brief about how an intelligent home automation system is enhanced
    with the adoption of fog computing with AI and blockchain.


    # 7.3.2 Intelligent Home Automation System


    The smart home automation system consists of various devices such as cameras,
    locks, and thermostats, providing seamless connectivity for a smart living environment.
    The devices, with respect to the area of interest, gather the data and convey
    it to centralized coordinator to manage smart activities. In the conventional
    system, the collected information is directly sent to the cloud server for further
    processing. The AI algorithms available in the cloud server analyze the received
    data to make wiser decisions regarding control and automation. The major challenges
    associated with smart home systems are privacy preservation, security, and so
    on. The smart home environment always handles sensitive information, such as video
    from a surveillance camera. When this information is shared with the cloud server,
    it leads the privacy issues that may be undergone with the unauthorized access.
    Another issue is tampering of the cloud server by hackers. A security breach can
    compromise the data as well as lead to unauthorized access to the smart home automation
    systems. The introduction of fog computing with intelligent home automation limits
    security and privacy issues.


    In general, the fog nodes are deployed at the edge of the network to process the
    data locally instead of sending it to the centralized cloud. The data received
    from the sensors is processed at the network edge itself and not sent outside
    the network. The main advantage of these fog nodes in a smart home is that they
    manage different tasks separately according to the data received and processed.
    Along with data collection and processing, they are also involved with the actuator
    control mechanisms. They send the data required for a particular task only to
    the cloud server.


    A fog node improves privacy protection by minimizing the amount of data transferred
    to cloud which results in increased privacy. The video information available from
    the security cameras remains in the local network and can be accessed by only
    authorized users. The fog nodes are integrated with additional features like encryption
    and access control, which protects the information within the network itself.


    To enhance the security, the smart home network can be integrated with a blockchain-based
    access control mechanism, and the smart contract ensures permission across various
    smart systems. The authorized users can access the environment at the fog node
    level with limited privileges.


    This approach ensures the cloud server can receive only the aggregated information
    from each device and not all the data, which reduces the chances of data breaches
    as well as unauthorized access. From the given example, it is clear that'
  merge: -1
