  \ ROM 文件受版权法保护。你不需要下载任何受保护的 ROM 文件来测试你的模拟器，因为书籍的源代码仓库包含了几个处于开源许可下或发布到公有领域的非商业 ROM。\n\
  \n## 关于 NES\n\nNES 是历史上最畅销的视频游戏机之一。它于 1983 年在日本作为 `Famicom`（红白）首次发布，并在 1985 年国际发行后俘获了全球整代游戏玩家的心。.^(1)\
  \ 在它诞生时，视频游戏行业才只有十年左右。视频游戏机中的微处理器和其他硬件仍然相当原始。尽管如此，NES 能够处理 60 FPS 的彩色精灵和背景，播放悦耳的芯片音乐，并且是一些历史上最标志性游戏的宿平台。\n\
  \n> 注意：在本章中提供的 NES 许多硬件规格以及关于其功能的大部分信息来自 `NesDev`，这是一个由 NES 自制开发者和模拟器编写者组成的社区，地址位于\
  \ [`www.nesdev.org`](https://www.nesdev.org)。虽然我认为本章是关于如何编写 NES 模拟器的最佳概述和教程，但我强烈建议查看\
  \ `NesDev` 网站以获取细节。为了避免大量引用该网站的引用条文，我向你展示了这条显眼的注释。此外，本章中的几张图像也来自 `NesDev` 并已发布到公有领域，正如本书的版权页上提到的。感谢\
  \ `NesDev` 的朋友们，他们提供了如此出色的资源，并将大量参考资料发布到了公有领域。\n\n### 硬件\n\nNES 中的中央处理单元（`CPU`）是\
  \ `MOS Technology 6502` 微处理器的克隆，由 `Ricoh` 制造，运行频率略低于 2 MHz。`6502` 与当时流行的家用电脑（如 `Apple\
  \ II` 和 `Commodore 64`）使用的是相同的微处理器。`6502` 由约 3500 个晶体管组成，是一个特别简单的微处理器；例如，它缺乏乘法和除法的指令.^(2)\
  \ 这些算术操作必须在软件中实现。尽管如此，NES 能够处理 60 FPS 的彩色精灵和背景，播放悦耳的芯片音乐，并且是一些历史上最标志性游戏的宿平台。\n\n\
