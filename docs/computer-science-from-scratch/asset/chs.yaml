  \            case (0x5, x, y, _): # 如果 v[x] 等于 v[y] 则跳过\n                if self.v[x]\
  \ == self.v[y]:\n                    self.pc += 4\n                    jumped =\
  \ True\n            case (0x6, x, _, _): # 设置 v[x] 为最后两个字节\n                self.v[x]\
  \ = last2\n            case (0x7, x, _, _): # 将最后两个字节加 v[x]\n                self.v[x]\
  \ = (self.v[x] + last2) % 256\n            case (0x8, x, y, 0x0): # 设置 v[x] 为 v[y]\n\
  \                self.v[x] = self.v[y]\n            case (0x8, x, y, 0x1): # 设置\
