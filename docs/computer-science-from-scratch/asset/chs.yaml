  \ Intelligence*.\n\n## 8 基于 K 邻的回归\n\n![](img/opener.jpg)\n\n在本章中，我们将扩展 `KNN` 实现以执行回归。对于我们的目的来说，*回归*简单来说意味着预测一个数值。通过对我们在\
  \ 第 7 章 中的代码进行一些微小的调整，我们就可以使用相同的 `KNN` 类不仅进行分类，还可以对数据集中的任何数值属性值进行预测。\n\n我们将回归应用到前一章的两个\
  \ KNN 示例中。首先，我们将重新审视鱼类数据集，并使用回归根据鱼的尺寸预测鱼的重量。然后，我们将编写一个程序，允许用户绘制数字的一部分，然后预测该图剩余部分可能是什么样子。\n\
  \n与本书中的其他章节不同，本章并不是独立的。它是建立在前章节基础之上的。在深入学习本章之前，请确保你已经学习了 第 7 章。\n\n### KNN 回归的工作原理\n\
  \n在 KNN 分类中，我们尝试预测数据点所属的类或类别，从有限的选项集合中选择合适的类。在 KNN 回归中，我们不是在预测一个类，而是尝试预测一个属性值。这些属性值通常是数值的，这意味着可能存在无限范围的值可以赋值。当然，如果属性值是我们想要预测的内容，那么该属性值缺失是合理的。\n\
  \n例如，假设我们是一家为患者分配房间的医院。我们可能想知道患者可能需要留院几天。我们可以查看具有相似诊断、症状和生命体征的患者的历史数据来做出预测。让我们通过两个维度上的散点图直观地观察这个例子(图\
  \ 8-1）。\n\n![图 8-1：根据体温和疾病严重程度预测流感的住院时长](img/Figure_8-1.jpg)\n\n图 8-1：根据体温和疾病严重程度预测流感的住院时长\n\
  \n假设 图 8-1 中的菱形代表因流感入住医院的过去患者。他们的疾病由医生根据 1 到 10 的严重程度标准进行评分，并在入院时记录了他们的体温。我们还有关于他们最终住院了多长时间的数据。\n\
  \n圆点代表一个刚入住的患者。我们有他们的严重程度评分和体温，我们想预测他们最终会在医院呆多久，以便将他们安排在合适的房间。如果我们使用带有欧几里得的 KNN\
  \ 并将 `k` 设置为 3，那么我们将查看历史数据中在散点图上距离新患者点最近的三个患者。图中记录他们的住院时间分别为三、四和五天。使用这种方法估计新患者的住院时长可以简单地对三个最近的邻居取平均值。该平均值（无论是平均数还是中位数）为四，因此我们预测新患者将在医院呆四天。\n\
  \n更广泛地说，以下是使用 KNN 执行回归的步骤：\n\n1. 选择 `k`，即与具有缺失属性的数据点进行比较的邻居数量。\n2. 找到距离数据点的 `k`\
  \ 个最近邻居。\n3. 对 `k` 个最近邻居的对应属性值取平均值，以预测该数据点缺失的属性值应该是多少。\n\n如你所见，使用 KNN 进行回归与使用 KNN\
  \ 进行分类非常相似。它只是最后一步不同。我们对算法的疑问和解答在上一章中也是类似的：`k` 的取值是什么？如何计算距离？参见 第 7 章 的讨论。\n\n###\
  \ 使用 KNN 实现回归\n\n为了执行回归，我们需要在 `KNN` 类中添加两个方法。像前一章的 `classify()` 一样，这些方法从寻找最近邻居开始。在这里，`predict()`\
  \ 和 `predict_array()` 之间真正的区别在于，我们利用了 Python 的动态特性，允许调用者指定属性字符串，并使用 `getattr()`\
  \ 获取该属性。\n\n```python\n### KNN/knn.py\n### 预测邻居的标量属性。\n### 找到属性的平均值并返回。\ndef predict(self,\
  \ k: int, data_point: Any, property_name: str) -> float:\n    neighbors = self.nearest(k,\
  \ data_point)\n    return sum([getattr(neighbor, property_name) for neighbor in\
  \ neighbors]) / len(neighbors)\n\n### 预测邻居的 NumPy 数组属性。\n### 找到该属性的平均值并返回。\ndef\
  \ predict_array(self, k: int, data_point: Any, property_name: str) -> np.ndarray:\n\
  \    neighbors = self.nearest(k, data_point)\n    return np.sum([getattr(neighbor,\
  \ property_name) for neighbor in neighbors], axis=0) / len(neighbors)\n```\n\nNumPy\
  \ 数组实际上也可以内置的 `sum()` 函数，因为它们实现了加法运算符，但 NumPy 的版本速度更快。就是这样。基本上只需要两行代码我们就可以进行预测。\n\
  \n### 预测鱼的重量\n\n让我们 `FishTestCase` 中添加一个单元测试以确保我们的 `predict()` 方法正常工作。我们想回答这个问题：“如果我们知道鱼的尺寸，我们能对它的可能重量做出合理的推测吗？”答案是肯定的：\n\
  \n```python\n### tests/test_knn.py\ndef test_predict(self):\n    k: int = 5\n  \
  \  fish_knn = KNN(Fish, self.data_file)\n    test_fish: Fish = Fish(\"\", 0.0, 20.0,\
  \ 23.5, 24.0, 10.0, 4.0)\n    predict_fish: float = fish_knn.predict(k, test_fish,\
  \ \"weight\")\n    self.assertEqual(predict_fish, 165.0)\n```\n\n在这个方法中，我们创建了一个没有指定重量的\
  \ test\\_fish（0.0），并根据其解剖尺寸（长度 1、长度 2、长度 3、宽度和高度）与其最近的五个鱼进行比较。（回顾前一章，我们在 `distance()`\
  \ 方法中不按重量比较鱼。）然后我们通过对这五个最近邻居的重量取平均来预测它的重量。再次运行单元测试，你应该发现鱼的重量被正确预测。\n\n### 预测手写数字的剩余部分\n\
  \n\n\n\n在上一章中，我们使用 KNN 成功地将一组同类型的 8×8 像素手写数字测试集中的图像与训练集进行对比并分类，准确率达到了 98%。在这个最后的\
  \ KNN 示例中，我们将对用户绘制的 8×8 数字进行分类，甚至可以预测图像其他部分像素可能的外观。我们不会将其实现为另一组单元测试，而是将使用 Pygame\
  \ 创建一个有趣的交互式程序，允许用户在建有 8×8 网格的窗口中进行绘图。\n\n以下是我们正在构建的内容预览。图 8-2 显示了绘图窗口，其中有一个我尝试画的扭曲的\
