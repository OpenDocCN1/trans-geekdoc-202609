  \ type (default ellipse).')\n    argument_parser.add_argument('-l', '--length',\
  \ type=int, default=256,\n                                 help='The length of the\
  \ final image in pixels (default 256).')\n    argument_parser.add_argument('-v',\
  \ '--vector', default=False, action='store_true',\n                            \
  \     help='Create vector output. A SVG file will also be output.')\n    argument_parser.add_argument('-a',\
  \ '--animate', type=int, default=0,\n                                 help='If greater\
  \ than 0, will create an animated GIF '\n                                     'with\
  \ the number of milliseconds per frame provided.')\n    arguments = argument_parser.parse_args()\n\
  \    method = ColorMethod[arguments.method.upper()]\n    shape_type = ShapeType[arguments.shape.upper()]\n\
  \    Impressionist(arguments.image_file, arguments.output_file, arguments)\n```\n\
  我们的主文件只是表 4-1 的代码实现。所有选项都将传递给 `Impressionist` 类的构造函数，我们稍后会回到这个类。\n（注：此处部分代码根据要求未翻译，保持原样）\n\
  `-v` 选项指示程序以矢量格式输出。\n\n### SVG 格式\n\nSVG 代表可缩放矢量图形（Scalable Graphics）。它是一种基于 XML\
  \ 的格式。所有主流浏览器和矢量图形程序都支持它。在利用第三方库来写入 SVG 之前，我们只需要编写自己的类。SVG 是一个文本格式，由于我们是在输出它而不是解析它，SVG\
  \ 规范很大，但我们只需要其中的一小部分，这轻而易的。\n\nSVG 颜色表示，正如构造函数中的 `background_color` 属性所示，颜色使用三个整数的元组表示。这些是\
  \ RGB 颜色代码。每个元素都是 0 到 255 之间的整数，表示输出中相应原色（红、绿、蓝）的量。例如，“纯”红色将是 (255, 0, 0)，而紫色可能是\
  \ (128, 0, 128)，它是红色和蓝色的混合。\n\n在进入代码之前，这里有一个程序可以输出的简单 SVG 文件示例。这使用多边形元素创建了一个三角形（我稍微改进了缩进）：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<svg version=\"1.1\" baseProfile=\"\
  full\" width=\"342\" height=\"256\"\nxmlns=\"http://www.w3.org/2000/svg\">\n   \
  \ <rect width=\"100%\" height=\"100%\" fill=\"rgb(108, 98, 91)\" />\n    <polygon\
  \ points=\"201,3 24,9 162,182 \" fill=\"rgb(128, 120, 112)\" />\n</svg>\n```\n如果你将此代码保存为带有\
  \ `.svg` 扩展的文件，可以使用网络浏览器或矢量编辑器打开它来查看结果。\n\nSVG 文件以其为 XML 文件的声明开始，第一个元素是 svg 元素，描述了\
  \ SVG 版本以及图像的宽度和高度。此外，我们程序生成的每个图像都有一个包含平均颜色的巨大矩形支撑。这有助于算法更好地混合。因此，我们的 SVG 文件也从巨大的\
  \ rect 元素开始：\n\n```python\n### Impressionist/svg.py\nclass SVG:\n    def __init__(self,\
  \ width: int, height: int, background_color: tuple[int, int, int]):\n        self.content\
  \ = '<?xml version=\"1.0\" encoding=\"utf-8\"?>\\n' \\\n                       f'<svg\
  \ version=\"1.1\" baseProfile=\"full\" width=\"{width}\" ' \\\n                \
  \       f'height=\"{height}\" xmlns=\"http://www.w3.org/2000/svg\">\\n' \\\n   \
  \                    f'<rect width=\"100%\" height=\"100%\" fill=\"rgb{background_color}\"\
  \ />'\n```\n\n绘制我们程序支持的三种形状（椭圆、直线和多边形）只需要向输出文本文件中放入相应的椭圆、直线或多边形 SVG 元素：\n\n\n\n\n\
  ```python\n    def draw_ellipse(self, x1: int, y1: int, x2: int, y2: int, color:\
  \ tuple[int, int, int]):\n        self.content += f'<ellipse cx=\"{(x1 + x2) //\
  \ 2}\" cy=\"{(y1 + y2) // 2}\" ' \\\n                        f'rx=\"{abs(x1 - x2)\
  \ // 2}\" ry=\"{abs(y1 - y2) // 2}\" ' \\\n                        f'fill=\"rgb{color}\"\
  \ />\\n'\n\n    def draw_line(self, x1: int, y1: int, x2: int, y2: int, color: tuple[int,\
  \ int, int]):\n        self.content += f'<line x1=\"{x1}\" y1=\"{y1}\" x2=\"{x2}\"\
  \ y2=\"{y2}\" stroke=\"rgb{color}\" ' \\\n                        'stroke-width=\"\
  1px\" shape-rendering=\"crispEdges\" />\\n'\n\n    def draw_polygon(self, coordinates:\
  \ list[int], color: tuple[int, int, int]):\n        points = \"\"\n        for index\
  \ in range(0, len(coordinates), 2):\n            points += f\"{coordinates[index]},{coordinates[index\
  \ + 1]} \"\n        self.content += f'<polygon points=\"{points}\" fill=\"rgb{color}\"\
  \ />\\n'\n```\n\n最后，为了输出 SVG 文件，我们关闭在构造函数中定义的 svg 元素，并将合并后的字符串写入磁盘：\n\n```python\n\
  \    def write(self, path: str):\n        self.content += '</svg>\\n'\n        with\
  \ open(path, 'w') as f:\n            f.write(self.content)\n```\n\n如果你查看官方 SVG 规范，可能会觉得它极其晦涩，但不必被它吓倒。正如这一节希望所示，要从像\
  \ SVG 这样的大标准中获取价值并不一定费精力。只需 20 行代码，我们就编写了一个非常简单但实用的 SVG 创建器。\n\n## 算法\n\n产生这些（有时是）美照片照片抽象印象的算法非常简单。简而言之，它尝试一次绘制一个随机大小和位置的形状。如果添加的形状让抽象图像看起来更像原始照片，就将其保留。通过调整形状的大小可以进一步细化这种改进，这涉及到移动它的每一个点。如果添加的形状让图像看起来不再像原始照片，则将其丢弃并尝试新形状。\n\
  \n以下是该算法更详细的步骤步骤说明：\n\n1. 创建一个与原始照片尺寸相同的空白画布，背景颜色与原始照片的平均颜色相同。\n2. 尝试在画布的随机位置以随机大小绘制一个形状。使用原始照片中对应区域的平均颜色、该区域最常见的颜色或随机颜色为该形状上色。\n\
  3. 将画布（带有添加的形状）的像素颜色与原始照片进行比较。如果添加的形状使得整个画布的像素与原始照片的像素更加相似，则保留添加的形状。\n4. 尝试每次移动一个像素对形状的每个点进行修改（扩展或收缩）。持续向某个方向移动点以进一步缩小整个画布像素与原始照片像素之间的差异。当移动不再能改善差异时停止。\n\
  5. 重复执行步骤 2、3 和 4 指定的次数。\n6. 在经过指定次数实验后，输出画布上创建的最终图像。\n\n该算法有许多可配置参数。应该使用什么种形状？应该运行多少次？每个形状的颜色应该如何选择？还有几个子问题需要解决。如何计算两幅图像之间的差异？如何找到包含形状的区域内的像素？\n\
  \n## 主实现\n\n除去注释，我们绘画算法的主实现少于 150 行 Python 代码。这种简洁性很大程度上归功于强大的 Pillow 库，它在第 3 章\
  \ 中已经讨论过。Pillow 处理读取和写入各种位图图像格式。它还提供了绘制我们所需的形状等简单原始图形的功能。最后，Pillow 拥有计算图像差异和计算图像区域平均颜色的函数。这些将是我们程序关键的辅助函数，允许我们专注于核心算法，而将繁琐的工作留给\
  \ Pillow。这就是一个优秀的库所实现的功能。\n\n### 设置\n\n我们从一些基础导入、一些需要的类型、一个常量和一个辅助函数开始：\n\nImpressionist/impressionist.py\n\
  \n```python\nfrom enum import Enum\nfrom PIL import Image, ImageDraw\nfrom PIL import\
  \ ImageChops, ImageStat\nimport random\nfrom math import trunc\nfrom timeit import\
  \ default_timer as timer\nfrom Impressionist.svg import SVG\n\nColorMethod = Enum(\"\
  ColorMethod\", \"RANDOM AVERAGE COMMON\")\nShapeType = Enum(\"ShapeType\", \"ELLIPSE\
  \ TRIANGLE QUADRILATERAL LINE\")\nCoordList = list[int]\nMAX_HEIGHT = 256\n\ndef\
  \ get_most_common_color(image: Image.Image) -> tuple[int, int, int]:\n    colors\
  \ = image.getcolors(image.width * image.height)\n    return max(colors, key=lambda\
  \ item: item[0])[1]\n```\n\n`ColorMethod` 枚举控制我们如何计算区域颜色。`ShapeType` 枚举设置了我们将绘制的形状。当前版本的程序只绘制一种类型的形状，但要修改代码以支持更多类型很容易的。`CoordList`\
  \ 类型用于定义坐标。\n\n在运行算法时，为了性能，我们需要处理有限数量的像素。实现这一点最简单的方法是如果图像高于 `MAX_HEIGHT` 则进行缩放。也就是说，`MAX_HEIGHT`\
  \ 是缩放后图像的高度。注意，从技术上说我们应该也定义最大宽度，但在实践中，很少有图像的长宽比会导致只限制一个维度是不够的（很少有图像非常宽但高度很小）。为了简单，我们只定义了最大维度。\n\
  \n`get_most_common_color()` 方法计算图像中出现频率最高的颜色。它使用了 Pillow 方法 `getcolors()`，该方法返回图像中所有的颜色及其计数。然后，它使用\
  \ Python 内置的 `max()` 来提取最频繁的。\n\nImpressionist 类的构造函数负责设置算法运行的唯一参数、打开输入图像、缩放、创建输出图像的背景、调用算法的实际迭代并调用方法输出最终文件。听起来可能很多，但算法的核心在其他方法。构造函数只是一个启动点，调用\
  \ Pillow 库的方法以及我们很快就会实现的实际工作方法。这里是构造函数的开头：\n\n```python\nclass Impressionist:\n\
  \    def __init__(self, file_name: str, output_file: str, trials: int, method: ColorMethod,\n\
  \                 shape_type: ShapeType, length: int, vector: bool, animation_length:\
  \ int):\n        self.method = method\n        self.shape_type = shape_type\n  \
  \      self.shapes = []\n        # 打开图像文件并存储在实例变量中，执行算法\n        with open(file_name,\
  \ \"rb\") as fp:\n            self.original = Image.open(fp).convert('RGB')\n  \
  \          # 缩小图像以提高处理速度，高度最大 256 像素\n            width, height = self.original.size\n\
  \            aspect_ratio = width / height\n            new_size = (int(MAX_HEIGHT\
  \ * aspect_ratio), MAX_HEIGHT)\n            self.original.thumbnail(new_size, Image.Resampling.LANCZOS)\n\
  ```\n\n\n\n\n\n```python\n# Start the generated image with a background that is\
  \ the\n# average of all the original's pixels in color\naverage_color = tuple((round(n)\
  \ for n in ImageStat.Stat(self.original).mean))\nself.glass = Image.new(\"RGB\"\
  , new_size, average_color)\n```\n\n`Pillow ImageStat`模块可以用于查找图像的平均颜色。它查看图像中每个像素的\
  \ RGB 值，并分别对红、绿、蓝分量取平均值。我们将得到的平均颜色提取，并设置为算法工作图像（`self.glass`）的背景。换句话说，原始图像的平均颜色将成为工作图像中每个像素的起始颜色。\n\
  \n> 注意\n\n> 工作图像的变量命名为 `glass`，是因为我最初将此程序命名为“Stained Glass”（彩绘玻璃）。在重命名后，我仍然觉得变量名\
  \ `glass` 解释了它是一个提供原始图像过滤后印象的表面。\n\n 构造函数继续：\n\n```python\n# Keep track of how far\
  \ along we are, our best result so far, and\n# how much time elapses as the processing\
  \ takes place\nself.best_difference = self.difference(self.glass)\nlast_percent\
  \ = 0\nstart = timer()\nfor test in range(trials):\n    self.trial()\n    percent\
  \ = trunc(test / trials * 100)\n    if percent > last_percent:\n        last_percent\
  \ = percent\n        print(f\"{percent}% Done, Best Difference {self.best_difference}\"\
  )\nend = timer()\nprint(f\"{end-start} seconds elapsed. {len(self.shapes)} shapes\
  \ created.\")\nself.create_output(output_file, length, vector, animation_length)\n\
  ```\n\n算法的核心在于 `trial()` 方法，该方法尝试绘制一个形状，以查看该形状是否提高了工作图像与原始图像之间的相似性评分。在这里，`trial()`\
  \ 被调用了 `trials` 次。在执行尝试期间，我们记录了完成进度以及程序运行的时间。最后，在 `create_output()` 的帮助下输出完成的工作图像。\n\
  \n### 实用方法\n\n在进入 `trial()` 之前，我们需要一些辅助方法。绘画算法的关键部分是验证每个新增的形状是否都让工作图像更接近原始图像。`difference()`\
  \ 方法计算两幅图像的相似性评分，衡量它们之间的相似程度：\n\n```python\n    def difference(self, other_image:\
  \ Image.Image) -> float:\n        diff = ImageChops.difference(self.original, other_image)\n\
  \        stat = ImageStat.Stat(diff)\n        diff_ratio = sum(stat.mean) / (len(stat.mean)\
  \ * 255)\n        return diff_ratio\n```\n\n`Pillow` 中的 `ImageChops` 模块内置了 `difference()`\
  \ 方法。它能找到两幅图像之间像素级的差异。换句话说，两幅图像中相同位置的两个像素之间有什么不同？差异只是每个像素中每个颜色通道相减后的绝对值。例如，颜色为 (10,\
  \ 100, 50) 的 RGB 像素与另一个为 (10, 40, 20) 的像素之间的差异为 (0, 60, 30)。然而，这对于我们的算法是不够的。我们需要一个数字（一个评分）来表示两幅图像的相似程度。在逐像素找到差异后，通过对所有差异取平均值，将其压缩为一个单一数字。我们使用在构造函数中用于计算平均颜色的相同\
  \ `ImageStat` 模块来实现。最后，尽管不是绝对的（像素平均值也可以作为评分），但我们将除以可能的最大差异，以比例形式获得评分。\n\n每次生成一个新形状时，它会被放置在屏幕上的随机位置。我们使用\
  \ `random_coordinates()` 计算这些随机坐标：\n\n```python\n    def random_coordinates(self)\
  \ -> CoordList:\n        num_coordinates = 4 # ellipse or line\n        if self.shape_type\
  \ == ShapeType.TRIANGLE:\n            num_coordinates = 6\n        elif self.shape_type\
  \ == ShapeType.QUADRILATERAL:\n            num_coordinates = 8\n        coordinates\
  \ = []\n        for d in range(num_coordinates):\n            if d % 2 == 0: # x\
  \ coordinates\n                coordinates.append(random.randint(0, self.original.width))\n\
  \            else: # y coordinates\n                coordinates.append(random.randint(0,\
  \ self.original.height))\n        return coordinates\n```\n\n不同类型的形状需要不同数量的坐标。例如，三角形有六个坐标，因为它有三个点，每个点都有一个\
  \ x 坐标和一个 y 坐标。坐标必须是有效的——即它们必须位于图像表面的某处。\n\n\n\n\n\n```python\ndef experiment()\
  \ -> bool:\n    new_image = original.copy()\n    glass_draw = ImageDraw.Draw(new_image)\n\
  \    if self.shape_type == ShapeType.ELLIPSE:\n        glass_draw.ellipse(self.bounding_box(coordinates),\
  \ fill=color)\n    else: # must be triangle or quadrilateral or line\n        glass_draw.polygon(coordinates,\
  \ fill=color)\n    new_difference = self.difference(new_image)\n    if new_difference\
  \ < self.best_difference:\n        self.best_difference = new_difference\n     \
  \   self.glass = new_image\n        return True\n    return False\n```\n\n内部函数 `experiment()`\
  \ 如果尝试绘制新形状并成功降低了工作图像与原始图像之间的差异，则返回 `True`。`Pillow` 中的 `ImageDraw` 模块负责实际的绘图。差异是使用之前定义的\
  \ `difference()` 方法计算的，并与目前找到的最佳差异进行比较。如果该形状改进了图像，则用工作图像替换为包含新形状的图像。\n\n`trial()`\
  \ 的最后一部分尝试通过微调坐标来对每个形状进行增量改进。如果微调后的差异得分与使用形状原始坐标的工作图像版本相比有所提高，则保留该微调并在同一方向上尝试下一次微调：\n\
  \n```python\nif experiment():\n    # 尝试扩展每个方向，在更好的方向继续\n    for index in range(len(coordinates)):\n\
  \        for amount in (-1, 1):\n            while True:\n                old_coordinates\
  \ = coordinates.copy()\n                coordinates[index] = coordinates[index]\
  \ + amount\n                if not experiment():\n                    coordinates\
  \ = old_coordinates\n                    break\n    self.shapes.append((coordinates,\
  \ color))\n```\n\n这段代码是一种`爬山算法`（hill climbing algorithm），只要解决方案持续改进，我们就一直沿着同一个方向移动以解决问题（在本例中是优化差异）。当改进停止时，我们就停止。这可能会导致局部最优，但它是改进现有解决方案的一种简单而有效的方法。在这种情况下，我们已经有一个现有解决方案，因为我们只保留了最初对差异有改进的形状（由\
  \ `experiment()` 返回 `True` 表示）。更多关于这种算法工作原理的信息，请参见“爬山算法”框。\n\n如果没有微调过程，整个算法也可以运行，但微调改进了每个形状的拟合度。这反过来提高了最终绘画的整体效果，并减少了获得合理结果所需的形状数量。\n\
  \n一旦在微调后确定了最终形状，我们就将其坐标和颜色添加到 `shapes` 列表中。维护这个列表（与在工作图像中绘制形状分开来）对于生成最终输出是必要的。\n\
  \n## 输出\n\n工作图像被缩放到了 `MAX_HEIGHT`，但最终输出图像应该具有用户指定的高度（再次为了简化，我们让用户只设置高度而不设置宽度）。我们不能简单地“拉伸”位图而不产生像素化。相反，我们使用\
  \ `shapes` 列表中的数据重新绘制工作图像，并对每个形状进行适当缩放。输出图像的方法还包含了输出矢量文件（利用了之前的 `SVG` 类）和通过 `Pillow`\
  \ 输出动画 GIF 的选项。这显著增加了代码的长度。以下是 `create_output()` 的开头：\n\n```python\ndef create_output(self,\
  \ out_file: str, height: int, vector: bool, animation_length: int):\n    average_color\
  \ = tuple((round(n) for n in ImageStat.Stat(self.original).mean))\n    original_width,\
  \ original_height = self.original.size\n    ratio = height / original_height\n \
  \   output_size = (int(original_width * ratio), int(original_height * ratio))\n\
  \    output_image = Image.new(\"RGB\", output_size, average_color)\n    output_draw\
  \ = ImageDraw.Draw(output_image)\n```\n\n我们首先根据用户指定的高度参数创建一个合适大小的新图像。使用原始图像的平均颜色填充初始输出图像，就像处理工作图像时一样。方法继续：\n\
  \n```python\nsvg = SVG(*output_size, average_color) if vector else None\nanimation_frames\
  \ = [] if animation_length > 0 else None\nfor coordinate_list, color in self.shapes:\n\
  \  ❶ coordinates = [int(x * ratio) for x in coordinate_list]\n```\n\n输出图像将通过以正确比例迭代复制\
  \ `shapes` 列表中的每个形状 ❶ 生成。为了同时创建 SVG 或动画 GIF 输出，在生成输出图像时，每一步都将在 `svg` 对象上重复，或者作为图片复制到构成动画\
  \ GIF “电影”的 `animation_frames` 列表中：\n\n```python\nif self.shape_type == ShapeType.ELLIPSE:\n\
  \    output_draw.ellipse(self.bounding_box(coordinates), fill=color)\n    if svg:\n\
  \        svg.draw_ellipse(*coordinates, color) # type: ignore\nelse: # must be triangle\
  \ or quadrilateral or line\n    output_draw.polygon(coordinates, fill=color)\n \
  \   if svg:\n        if self.shape_type == ShapeType.LINE:\n            svg.draw_line(*coordinates,\
  \ color) # type: ignore\n        else:\n            svg.draw_polygon(coordinates,\
  \ color)\nif animation_frames is not None:\n    animation_frames.append(output_image.copy())\n\
  output_image.save(out_file)\nif svg:\n    svg.write(out_file + \".svg\")\nif animation_frames\
  \ is not None:\n    animation_frames[0].save(out_file + \".gif\", save_all=True,\n\
  \                             append_images=animation_frames[1:], optimize=False,\n\
  \                             duration=animation_length, loop=0,\n             \
  \                transparency=0, disposal=2)\n```\n\n该方法的最后部分是在输出图像（s）上绘制形状并写入磁盘。\n\
  \n## 结果\n\n\n\n\n\n图 4-9：在铺好的路面上打滚的猫\n\n最后，我在图 4-10 中展示了一个万圣节场景。\n\n![图 4-10：带有椭圆的万圣节场景](img/Figure_4-10.jpg)\n\
  \n图 4-10：带有椭圆的万圣节场景\n\n我和儿子正在逛一个南瓜展示展。我很喜欢背景中的南瓜和人物使用椭圆呈现的效果。\n\n### 实际应用\n\n除了看起来很酷之外，这个程序的输出并没有许多实际应用。然而，构建它时使用的技术确实有很多应用。这些技术属于一个被称为`随机优化`（stochastic\
  \ optimization）的统术语。假设你有一个想要解决的优化问题，但你不知道某种确定性算法（即通过遵循相同的步骤每次得到相同结果的算法）来解决它。在这种情况下，涉及随机（随机性）试验的技术可能是必要的。\n\
  \n虽然这可能并不十分清晰，但本章的挑战就是一个优化问题的示例。我们的程序试图优化出一幅尽可能接近原始照片的画。目标函数（检查我们是否朝着正确方向移动的机制）是\
  \ `difference()` 方法。`difference` 越小，特定图像所代表的问题潜在解决方案就越优。\n\n随机优化算法实用的一个著名实际领域是经典的旅行推员问题。该问题要求旅行者以最短路线访问地图上的每个指定位置，且仅访问一次，并返回起点。这是送货卡车（如联邦快递\
  \ FedEx 或联邦敦 UPS）每天做的事情，因此具有很强的实用性。遗憾的是，目前没有已知的确定性算法可以在合理时间内为大量位置最优地解决旅行推员问题。相反，遗传算法等随机优化技术提供了一种解决该问题的有效方法，但它们的解决方案可能是次优的。遗传算法并不总是为旅行推员问题提供完美解决方案，但它几乎总能产生一个足够好的解决方案。\n\
  \n我们的程序还利用了爬山算法（hill climbing）。尽管这是最简单的局部搜索程序之一（只要该方向有效，就一直向该方向移动），但它是非常常用的技术，在许多场景下它的性能与更先进的技术不上下。爬山算法也是其他更复杂算法的基础。例如，用于线性规划问题的单纯形算法就利用了爬山算法.^(2)\n\
  \n## 练习\n\n1. 修改程序以在同一幅画中画出多种类型的形状。例如，它可以在最终输出中创建一个同时包含椭圆和三角形的图形。\n\n2. 由于用于计算新形状颜色的像素是基于边界框（bounding\
  \ box）而非形状下方的精确区域，因此结果是不准确的。修改 `trial()`，使其不仅尝试坐标偏移（nudges），也尝试颜色偏移（nudges）。这可能会带来更匹配的颜色。\n\
  \n3. 修改 `trial()`，使用形状下方的精确像素来确定该形状的颜色。这具有挑战性。一种方法是使用某些几何计算来确定每种形状的正确像素。这的计算效率可能比原始程序中简单地裁剪边界框低得多。考虑考虑使用\
  \ `Pillow` 中的掩码功能。\n\n4. `trial()` 开头的 `while True` 循环感觉像是一个代码异味（code smell）。在不使用它的情况下重写\
  \ `trial()` 的开头。\n\n### 备注\n\n1. 1。Michael Fogleman, “Primitive,” 访问于 2023 年 1 月\
  \ 9 日，[`https://www.michaelfogleman.com/#primitive`](https://www.michaelfogleman.com/#primitive)。\n\
  \n2. 2。Steven S. Skiena, “Combinatorial Search and Heuristic Methods,” 见 *Algorithm\
  \ Design Manual*, 第 2 版 (Springer, 2008), 第 252–253 页。\n\n# 第三部分 模拟器\n\n## 5 构建\
  \ CHIP-8 虚拟机\n\n![](img/opener.jpg)\n\n在本章中，我们将开发一个名为 CHIP-8 的虚拟机版本，它是个人计算早期的一个平台，主要用于玩游戏。虽然我们的程序能够运行\
  \ CHIP-8 游戏，但我们感兴趣的并不是游戏本身——而是构建 CHIP-8 虚拟机能教给我们的关于底层编程以及计算机在寄存器和指令层级上是如何工作的知识。这些见解使得构建\
  \ CHIP-8 虚拟机成为进入编程模拟器世界的热门入门。\n\n### 虚拟机\n\n将 `虚拟机 (VM)` 想象为一台完全由软件定义的计算机。设计在 VM\
  \ 中运行的程序可以在任何具有该虚拟机实现的的平台上运行。通过这种方式，VM 实现了真正可移植的软件。\n\n虚拟机与模拟器密切相关。`模拟器 (emulator)`\
  \ 是一段伪装成硬件的软件。这使得为该硬件编写的程序可以在缺少该硬件的其他机器上运行。模拟器必须严格遵循原始硬件的规范，以便重新创建运行在其上的无知程序所期望的所有功能。我用*无知*一词，是因为运行在模拟器上的软件并不知道自己并没有运行在真实的硬件上；如果程序要正常运行，模拟器的工作方式最好与原始硬件完全一样。\n\
  \n虚拟机也是一种紧密遵循软件运行在其之上的环境规范的软件。区别在于，模拟器遵循硬件规范，而虚拟机遵循的是可能完全用软件定义的规范。\n\n尽管一个是硬件规范，另一个是软件规范，但实现一个简单的模拟器与实现一个简单的虚拟机非常相似。事实上，本章完成的项目在技术上是一个虚拟机项目，但它经常被建议作为第一个模拟项目。如果你是模拟器社区的新手，询问应该哪里开始，CHIP-8\
  \ 几乎总是答案。\n\n也许著名的虚拟机是 Java 虚拟机 (JVM)。当 Java 在 20 世纪 90 年代中期推出时，其“编写一次，到处运行”的哲学广受推崇。JVM\
  \ 为所有主流操作系统（Windows、Linux、Mac OS 等）开发，同一个 Java 程序可以编译成 JVM 的原生字节码格式，并在任何带有 JVM 的计算机上运行，无需更改平台。这在今天仍然成立，但\
  \ Java 原有的“编写一次，到处运行”领域在很大程度上已被 Web 应用取代了。\n\nCHIP-8 虚拟机源于一个更早的时代。在 20 世纪 70 年代，Joseph\
  \ Weiscker 是一位开创性的工程师，他开发了最早的 8 位微处理器之一的 RCA 1802。他和 RCA 利用他的发明制造了一台早期的个人电脑.^(1)他希望有一种方法比机器码更高级的语言为该机器编写游戏，因此他开发了\
  \ CHIP-8（以及相应的的操作码语言）。他的女儿 Joyce Weisbecker 后来利用 CHIP-8 成为第一位出版的女性视频游戏开发者.^(2)在\
  \ 20 世纪 80 年代，CHIP-8 被移植到许多其他平台，包括许多图形计算器。因此，它变成了一个真正可移植的虚拟机，类似于我们今天对 VM 的早期形式。\n\
  \n### CHIP-8 虚拟机\n\n\n\n\n\n`CHIP-8` 虚拟机最初是为 20 世纪 70 年代资源极其受限的个人电脑设计的，例如 `COSMAC\
  \ VIP`。`COSMAC VIP` 于 1977 年发布，配备运行频率低于 2 兆赫（MHz）的 `RCA 1802` 8 位微处理器、`2KB` RAM（可扩展至\
  \ `4KB`）以及 512 字节的 ROM。它还拥有专门的芯片，用于显示分辨率高达 `64×128` 的 1 位图形、读写磁带以及播放蜂鸣声。\n\n以今天的标准来看，能在像\
  \ `COSMAC VIP` 这样的机器上编写任何有价值程序都是令人惊叹的，然而它它是为视频游戏设计的。事实上，那些游戏甚至通过另一层抽象——`CHIP-8`\
  \ 虚拟机运行。那个时代最流行的视频游戏机 `Atari 2600` 也于 1977 年发布，其规格与其旗鼓相当。这些限制完全是常态。\n\n在编写虚拟机或模拟器时，你所使用的工具的性能是一个要考虑的问题。虚拟机或模拟器在程序和硬件之间增加了另一层抽象，而每一层抽象通常都会带来性能开销。为了达到原始系统的预期速度，必须将开销降至最低，某些编程语言（或者说，某些编程语言的主要运行时实现）会成为障碍。这就是为什么经常看到用\
  \ `C`、`C++` 和 `Rust` 等低级语言编写虚拟机和模拟器。尽管如此，考虑到 `CHIP-8` 目标硬件的局限，今天在任何现代系统上创建一个高效的\
  \ `CHIP-8` 虚拟机并不困难。即使是像 `CPython` 这样相对慢的编程语言运行时也足够了。你可能不想用 `Python` 或 `JVM` 来编写尖端游戏机模拟器，但\
  \ `CHIP-8`？完全没问题。\n\n为了理解 `CHIP-8`，让我们从讨论它的寄存器和内存布局开始。然后，我将对虚拟机可以执行的指令提供一个概述，最后进入实现的具体细节。\n\
  \n### 寄存器与内存\n\n在物理微处理器上，`registers（寄存器）是可用最快的内存。它们直接位于微处理器内部，不需要访问另一个芯片的延迟。将数据放入寄存器中通常是操作它的唯一方法，因为微处理器支持的大多数数据操作指令（例如算术运算）都是在寄存器内进行的。独立的加载/存储指令在寄存器和外部\
  \ RAM 之间传输数据。\n\n提到寄存器，存在经典的时间空间权衡：寄存器是存储数据最快的位置，但其尺寸极其有限。例如，20 世纪 70 年代一个典型的 8\
  \ 位微处理器可能只有几个 8 位寄存器（是的，每个只能容一个字节），但它可以寻址几十 KB 的外部 RAM。\n\n大多数虚拟机（如 `CHIP-8`）也有寄存器，但这些寄存器并不总是直接映射到微处理器上的物理硬件寄存器。因此，它们并不一定比\
  \ RAM 快。这听起来可能很奇怪，但寄存器为指令提供了一个基础。\n\n> 注意\n> 在接后的讨论中，使用相同的名称来指代 `v0` 到 `v15`。`v15`\
  \ 是特殊寄存器。\n\n表 5-1：CHIP-8 寄存器与伪寄存器\n\n| 寄存器 | 名称 | 描述 |\n| :--- | :--- | :--- |\n\
  | `v0` 到 `v14` | 通用寄存器 | 每个可以存储任何类型的 8 位数据。 |\n| `v15` | 标志寄存器 | 在某些操作后存储一个标志（1\
  \ 或 0）。 |\n| `pc` | 程序计数器 | 跟踪下一条指令的地址。 |\n| `i` | 索引寄存器 | 存储用于指令的 16 位地址。 |\n|\
  \ `delay_timer` | 延迟计时器 | 存储每秒减 60 次的 8 位值。 |\n| `sound_timer` | 声音计时器 | 存储每秒减 60\
  \ 次的 8 位值。 |\n\n一个典型的 `CHIP-8` 虚拟机拥有 `4KB` 通用 RAM。这与加载扩展内存后的 `COSMAC VIP` 一致。但有一个问题：在\
  \ VIP 上，前 `512 字节` 必须包含虚拟机本身的代码。这只剩下 `3.5KB` 的可用 RAM。为了在今天保持后兼容，我们的虚拟机也必须预留 RAM\
  \ 的前 512 字节。\n\n### 指令\n\n`CHIP-8` 虚拟机主要用于编写游戏，因此它包含了用于移动精灵和播放蜂鸣声等操作的特殊指令。这些指令与任何微处理器指令集或低级语言中常见的各种平庸、实用指令并存——用于操作内存、进行算术运算、监督控制流、处理计时器和管理显示的指令。总共我们将实现\
  \ 35 条指令。所有指令均以十六进制指定。\n\n这里列出指令是为了作为快速参考，并让你对“整体情况”有一个直观感受。我们将进入代码中每条指令如何工作的细节，但事实是，根据指令描述，大部分代码是非常自显易懂的。\n\
  \n我花了很多时间思考如何为这些讨论对指令分组。最终，我决定按数值排序，以便它们的顺序与代码中的顺序一致。`CHIP-8` 中的每条指令都是 16 位，换句话说是\
  \ 2 字节或 4 个半字节，因此对应四个十六进制数字。指令中的任何大写十六进制数字 0–F 字面量。任何小写字母表示将作为指令实现的一部分的值。下划线 (\\\
  _) 表示该半字节是任意的。\n\n\n\n\n\n*此处列出的几条指令并不存在于原始 CHIP-8 规范中（例如 `8x_6` 和 `8x_E`）。它们的功能在不同的\
  \ CHIP-8 实现中可能会有所差异。*\n\n### 清屏与基础跳转\n\n第一组指令用于一次性清理整个屏幕，以及从程序的一个部分移动到另一个部分。\n\n\
  > `00E0` 清除屏幕。\n> `00EE` 从子程序返回。\n> `0nnn` 调用地址 `nnn` 处的程序，重置计时器和寄存器，并清空屏幕。\n> `1nnn`\
  \ 跳转到地址 `nnn` 而不重置。\n> `2nnn` 调用地址 `nnn` 处的子程序。\n\n### 条件跳过\n\n下一组指令用于在满足特定条件为真时跳转到程序的另一部分。\n\
  \n> `3xnn` 如果 `v[x]` 等于 `nn`，则跳过下一指令。\n> `4xnn` 如果 `v[x]` 不等于 `nn`，则跳过下一指令。\n> `5xy_`\
  \ 如果 `v[x]` 等于 `v[y]`，则跳过下一指令。\n\n### 通用寄存器调整、运算与位操作\n\n接下来是标准指令，你可以在任何 CPU 或 VM\
  \ 中找到，用于执行数学运算、设置寄存器和位移等操作。\n\n> `6xnn` 将 `v[x]` 设置为 `nn`。\n> `7xnn` 将 `v[x]` 加上\
  \ `nn`。\n> `8xy0` 将 `v[x]` 设置为 `v[y]`。\n> `8xy1` 将 `v[x]` 设置为 `v[x] | v[y]`（按位或）。\n\
  > `8xy2` 将 `v[x]` 设置为 `v[x] & v[y]`（按位与）。\n> `8xy3` 将 `v[x]` 设置为 `v[x] ^ v[y]`（按位异或）。\n\
  > `8xy4` 将 `v[y]` 加到 `v[x]` 并设置进位标志。\n> `8xy5` 从 `v[x]` 中减去 `v[y]` 并设置借位标志。\n> `8x_6`\
  \ 将 `v[x]` 向右移动一位，并将标志设为最低位。\n> `8xy7` 从 `v[y]` 中减去 `v[x]`并将结果存储在 `v[x]` 中；设置借位标志。\n\
  > `8x_E` 将 `v[x]` 向左移动一位，并将标志设为最高位。\n\n### 杂指令\n\n这些指令没有统一的主题领域，但它们的操作码在数值上彼此接近。\n\
  \n> `9xy0` 如果 `v[x]` 不等于 `v[y]`，则跳过下一指令。\n> `Annn` 将 `i` 设置为 `nnn`。\n> `Bnnn` 跳转到\
  \ `nnn + v[0]`。\n> `Cxnn` 将 `v[x]` 设置为随机整数（0–255）与 `nn` 的按位与结果。\n> `Dxyn` 在 `(v[x],\
  \ v[y])` 处绘制高度为 `n` 的精灵；若发生碰撞则设置标志。\n\n### 按键与计时器指令\n\n下一批指令用于操作 VM 的计时器，检查各种按键的状态或等待特定按键被按下。\n\
  \n> `Ex9E` 如果按键 `v[x]` 被设置（已按下），则跳过下一指令。\n> `ExA1` 如果按键 `v[x]` 未设置（未按下），则跳过下一指令。\n\
  > `Fx07` 将 `v[x]` 设置为延迟计时器。\n> `Fx0A` 等待直到下一次按键，然后将按键存储在 `v[x]`。\n> `Fx15` 将延迟计时器设置为\
  \ `v[x]`。\n> `Fx18` 将声音计时器设置为 `v[x]`。\n\n### 寄存器 i 指令\n\n最后这一组中的所有指令都与内存索引寄存器 (`i`)\
  \ 有关。\n\n> `Fx1E` 将 `v[x]` 加到 `i`。\n> `Fx29` 将 `i` 设置为字体集中字符 `v[x]` 的位置。\n> `Fx33`\
  \ 将 `v[x]` 中的二进制编码进制 (BCD) 值存储在内存位置 `i`、`i + 1` 和 `i + 2` 中。\n> `Fx55` 从内存 `i` 开始转储寄存器\
  \ `v[0]` 到 `v[x]` 到内存中。\n> `Fx65` 将从 `i` 到 `i + x` 的内存存储到寄存器 `v[0]` 到 `v[x]` 中。\n\
  \n### 实现\n\n想想这些指令听起来是平凡。要拥有一个可以运行的“计算机”，你不需要任何复杂的机制。将这里描述的 35 条 CHIP-8 指令与我们 Brainfuck\
  \ 实现中的 8 条指令对比。\n\n### 运行循环\n\n运行循环负责推进 VM、重绘屏幕以及处理事件。让我们从一些初始化开始：\n\nChip8/__main__.py\n\
  \n```python\nimport sys\nfrom argparse import ArgumentParser\nfrom Chip8.vm import\
  \ VM, SCREEN_WIDTH, SCREEN_HEIGHT\nfrom Chip8.vm import TIMER_DELAY, FRAME_TIME_EXPECTED,\
  \ ALLOWED_KEYS\nimport pygame\nfrom timeit import default_timer as timer\nimport\
  \ os\n\ndef run(program_data: bytes, name: str):\n    # 启动 Pygame，创建窗口，并加载声音\n \
  \   pygame.init()\n    screen = pygame.display.set_mode((SCREEN_WIDTH, SCREEN_HEIGHT),\
  \ pygame.SCALED)\n    pygame.display.set_caption(f\"Chip8 - {name}\")\n    bee_sound\
  \ = pygame.mixer.Sound(os.path.dirname(os.path.realpath(__file__)) + \"/bee.wav\"\
  )\n    currently_playing_sound = False\n    vm = VM(program_data) # 加载程序数据到虚拟机\n\
  \    timer_accumulator = 0.0 # 用于限制计时器为 60 Hz\n    # 主虚拟机循环\n    while True:\n \
  \       frame_start = timer()\n        vm.step()\n        if vm.needs_redraw:\n\
  \            pygame.surfarray.blit_array(screen, vm.display_buffer)\n          \
  \  pygame.display.flip()\n```\n\n在运行循环开始时，使用 `frame_start = timer()` 记录时间以测量每次迭代的持续时间。这是因为\
  \ CHIP-8 的计时器每秒需要递减 60 次（如果它们大于 0）。然后通过 `vm.step()` 通知 VM 执行一条指令（从而移动到下一条指令）。如果\
  \ `vm.needs_redraw` 为真，则通过两次简单的 Pygame 调用重新绘制显示。\n\n注意，代码对 *frame*（帧）一词的用法与通常不同。在大多数程序中，帧是指程序整个图形输出的一次完整刷新，但在这种境下，我们的运行循环并不每次迭代都重绘图形，因为\
  \ `vm.needs_redraw` 并不总是为 True。\n\n\n\n\n每一个“帧”一定会发生的事情是，调用 `vm.step()` 后会执行一条指令。因此，在代码的这一部分，我考虑过使用\
  \ `instruction`（指令）一词而不是 `frame`（帧），例如，使用 `instruction_start` 而不是 `frame_start`。然而，运行循环中发生的不仅仅是执行一条指令——还包括图形输出、键盘处理和音频输出——所以\
  \ `instruction` 听起来太局限了。但同样，`frame` 也不完全准确。正如人们所说的：计算机科学中最困难的问题之一就是命名。\n\n运行循环通过处理键盘事件、在\
  \ VM 的布尔值 `vm.play_sound` 指明为真时播放声音，以及处理计时来结束：\n\n```python\n        # Handle keyboard\
  \ events\n        for event in pygame.event.get():\n            if event.type ==\
  \ pygame.KEYDOWN:\n                key_name = pygame.key.name(event.key)\n     \
  \           if key_name in ALLOWED_KEYS:\n                    vm.keys[ALLOWED_KEYS.index(key_name)]\
  \ = True\n            elif event.type == pygame.KEYUP:\n                key_name\
  \ = pygame.key.name(event.key)\n                if key_name in ALLOWED_KEYS:\n \
  \                   vm.keys[ALLOWED_KEYS.index(key_name)] = False\n            elif\
  \ event.type == pygame.QUIT:\n                sys.exit()\n\n        # Sound\n  \
  \      if vm.play_sound:\n            if not currently_playing_sound:\n        \
  \        bee_sound.play(-1)\n                currently_playing_sound = True\n  \
  \      else:\n            currently_playing_sound = False\n            bee_sound.stop()\n\
  \n        # Handle timing\n        frame_end = timer()\n        frame_time = frame_end\
  \ - frame_start # time it took in seconds\n        timer_accumulator += frame_time\n\
  \        # 每 1/60 秒递减一次计时器\n        if timer_accumulator > TIMER_DELAY:\n      \
  \    ❶ vm.decrement_timers()\n            timer_accumulator = 0\n        # 将整个机器的速度限制在每秒\
  \ 500“帧”\n        if frame_time < FRAME_TIME_EXPECTED:\n            difference =\
  \ FRAME_TIME_EXPECTED - frame_time\n          ❷ pygame.time.delay(int(difference\
  \ * 1000))\n            timer_accumulator += difference\n```\n\n尽管我们没有使用帧来测量传统的每秒帧数（FPS），正如你可能在游戏领域熟悉的那，每次迭代的计时仍然非常重要。我们需要跟踪计时，以确保\
  \ VM 的倒计时计时器按照 CHIP-8 规范 ❶ 的要求每 1/60 秒跳动一次，并限制 VM 的整体速度 ❷。如果 VM 运行得太快，游戏将无法运行，因为它们是为\
  \ 20 世纪 70 年代的慢速设计的。可以通过更改 `vm.py` 中的 `FRAME_TIME_EXPECTED` 常量来调整 VM 的速度，从而调整运行在上面的任何软件的速度。在测试中，我发现每秒\
  \ 500“帧”，换句话说，每个“帧”大约是 1/500 秒，对于大多数游戏来说是一个可靠的速度。\n\n### 命令行参数\n\n与之前一样，我们使用 `ArgumentParser`\
  \ 来处理命令行参数：\n\n```python\nif __name__ == \"__main__\":\n    file_parser = ArgumentParser(\"\
  Chip8\")\n    file_parser.add_argument(\"rom_file\", help=\"A file containing Chip-8\
  \ game.\")\n    arguments = file_parser.parse_args()\n    with open(arguments.rom_file,\
  \ \"rb\") as fp:\n        file_data = fp.read()\n        run(file_data, arguments.rom_file)\n\
  ```\n\n在这种情况下，我们只有一个命令行参数——包含 CHIP-8 VM 程序数据的文件名。文件的原始字节被读取并传递给 `run()`，然后它们会被传递给\
  \ VM 的构造函数。\n\n### VM 设置与辅助函数\n\n我们已经准备好进行实际实现了。我们像往常一样，从 `Chip8/vm.py` 中的一些常量开始：\n\
