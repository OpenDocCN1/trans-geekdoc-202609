  \ n2, n3)\n                jumped = True\n            case (0x2, n1, n2, n3): #\
  \ 调用子程序\n                self.stack.append(self.pc + 2) # 将返回位置入栈\n            \
  \    self.pc = concat_nibbles(n1, n2, n3) # 跳到子程序\n                jumped = True\n\
  \            case (0x3, x, _, _): # 如果 v[x] 等于最后两个字节则跳过\n                if self.v[x]\
  \ == last2:\n                    self.pc += 4\n                    jumped = True\n\
