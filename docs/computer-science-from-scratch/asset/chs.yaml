  源代码中还附带了另外几个游戏供你查看。注意文件大小：这些游戏中的大多数只有 500 字节或更小！最大的 `BLINKY` 也仅有 2KB。\n\n### 实际应用\n\
  \n虚拟机在历史和现代开发中无处不在。它们的主要优势是移植性。为虚拟机编写的程序将运行在任何安装了该虚拟机的平台上。虚拟机还提供了基础设施，通过消除实现垃圾回收等常见运行时功能的需求，减轻了语言作者的负担。\n\
  \n一个早期的例子是 20 世纪 70、80 年代某些编译器将 `Pascal` 编译为所谓的 `p-code`（一种字节码），并在 `p-code` 虚拟机上运行。两个著名的现代虚拟机环境是本章前面提到的\
  \ `JVM` 以及微软作为 `.NET` 平台一部分的通用语言运行时（`CLR`）。多种流行语言都以 `JVM` 和 `CLR` 为目标。例如，`C#`、`F#`\
  \ 和 `Visual Basic` 是常用的针对 `CLR` 的语言，但 `Python` 和 `Swift` 等流行语言也有 `CLR` 的实现。\n\n\
  为什么这些语言实现要编译成 `CLR` 的字节码而不是机器码？一旦编译完成，这些字节码就可以任何安装了 `CLR` 的平台上运行。这是一种编译后的即时移植性。此外，像\
  \ `CLR` 这样的虚拟机将提供垃圾回收、多线程和安全机制等语言服务。最后，当像 `CLR` 这样的虚拟机即时（JIT）将中间代码编译为机器码时，它将应用语言作者没有考虑过的优化。\n\
  \n除了作为运行时的抽象机器外，“虚拟机”一词也被混淆地用于指软件中实现的整个硬件实现——换句话说，即模拟器。构建模拟器是下一章的主题。\n\n## 练习\n\n\
  1. 尝试使用三种不同的方法测量主操作码解释器的性能：已经实现的 `match` 语句、一系列 `if...elif` 语句和跳转表。使用性能分析器或简单的计时器确定哪种方法最快。你可能需要关闭主运行循环中的计时代码来完成，或者使用一组单元测试来完成。\n\
  \n2. CHIP-8 有一个扩展版本被称为 `SCHIP`（超级芯片）。它需要实现更多的操作码，并更改原始 CHIP-8 虚拟机的某些元素，例如其分辨率。查找\
  \ `SCHIP` 的文档并尝试将 CHIP-8 虚拟机转换为 `SCHIP` 虚拟机。然后，尝试玩一些 `SCHIP` 游戏！\n\n3. 尝试使用 CHIP-8\
  \ 的机器码指令编写一个非常简单的游戏，在屏幕上显示几个字母。你需要一个十六进制编辑器来实现。看到自己写的二进制代码在虚拟机上运行是一件令人欣慰的事。\n\n\n\
  \n\n我们的模拟器将不是对原始硬件的 100% 准确重新实现。为了让构建模拟器的任务在书的一个章节内变得可行，我们将进行若干简化。尽管有这些简化，我们的模拟器仍然能够运行一些基础\
  \ NES 游戏，包括书籍源代码仓库中包含的几个业余者的免费开源游戏。我们不会用任何商业游戏来测试模拟器，尽管它能够运行一些简单的游戏。我们的动力是学习模拟器，而不是实现完全的游戏兼容性。我将进一步增强模拟器游戏兼容性的工作留给读者作为一项练习。\n\
  \n我们将使用纯 `Python` 来构建模拟器，在写此书时，`Python` 这种语言在现代 PC 上的运行速度不够，无法以全速模拟 NES。我们生成的代码可以通过\
  \ `Cython`、`C extensions` 或其他类型的原生代码层进行增强，以实现全速运行。这也将留给读者作为练习。\n\n这是书中书中挑战性的项目。我假设在本章中，你已经拥有完成第\
  \ 1 章、第 2 章 尤其是第 5 章项目的经验。在开始本章之前，你至少应该完成第 5 章 中的 CHIP-8 项目，但之前几乎所有章节中解释的概念都会出现在这个项目中。\n\
