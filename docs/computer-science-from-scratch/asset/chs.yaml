  \                                        dtype=np.uint32)\n        self.needs_redraw\
  \ = False\n        # 计时器 - 以 60 赫频率减到 0 的简单寄存器\n        self.delay_timer = 0\n \
  \       self.sound_timer = 0\n        # 这些存储按键是否按下状态\n        # CHIP-8 有 16 个按键\n\
  \        self.keys = [False] * 16\n```\n\n这些状态变量中具有重要的默认值。例如，程序计数器（`pc`）应该始终设置为位置\
  \ `0x200`（十进制为 `512`），因为 CHIP-8 机器的前 512 字节内存最初用于存储 CHIP-8 VM 本身。这意味着 CHIP-8 程序无法使用该内存，必须从第\
  \ 512 字节开始。我对构造函数进行了详细的注释，以解释每个声明的变量。注意，我们的 VM 大部分都使用 Python 标准库进行实现，但 `display_buffer`\
  \ 是一个 NumPy 数组。这是 Pygame 期望的格式。\n\n接下来，我们有一个简单易的辅助方法 `decrement_timers()` 和一个简单的动态属性\
  \ `play_sound`：\n\n```python\n    def decrement_timers(self):\n        if self.delay_timer\
  \ > 0:\n            self.delay_timer -= 1\n        if self.sound_timer > 0:\n  \
  \          self.sound_timer -= 1\n\n    @property\n    def play_sound(self) -> bool:\n\
  \        return self.sound_timer > 0\n```\n\n`decrement_timers()` 和 `play_sound`\
  \ 都用于我们之前在 `__main__.py` 中看到的运行循环中。\n\n### 图形\n\nCHIP-8 将屏幕视为 64×32 像素的平面，具有笛卡尔坐标系，原点位置\
  \ `(0,0)` 在左上角，y 轴向下延伸。换句话说，当我们从左向右移动时，x 坐标增加；当我们从上向下移动时，y 坐标增加。因此，右下角的像素位于位置 `(63,31)`。没有负坐标，并且无法访问屏幕之外的像素位置。\n\
  \n每个像素在内存中以单比特表示。在我们的实现中，1 代表白色像素，0 代表黑色像素。图形内存（或“缓冲区”）与主程序内存分离，只能通过 CHIP-8 指令进行间接操作。Pygame\
  \ 使用 32 位整数以 RGBA 格式表示屏幕上的像素（`A` 代表 `alpha`，即透明度），因此当我们将每个 1 位像素值存储在 `display_buffer`\
  \ 中时，它必须变成一个 32 位整数。\n\nCHIP-8 使用精灵（sprites）进行绘制，精灵是较小的位图（或如果你喜欢，是图像），可以在屏幕上移动。每个精灵宽\
  \ 8 像素，高可达 15 像素。\n\n```python\n    # 使用高度在 x, y 处绘制精灵\n    def draw_sprite(self,\
  \ x: int, y: int, height: int):\n        flipped_black = False # 绘制是否翻转了像素？\n  \
  \      for row in range(height):\n            row_bits = self.ram[self.i + row]\n\
  \            for col in range(SPRITE_WIDTH):\n                px = x + col\n   \
  \             py = y + row\n                if px >= SCREEN_WIDTH or py >= SCREEN_HEIGHT:\n\
  \                    continue # 忽略屏幕外像素\n                new_bit = (row_bits >>\
  \ (7 - col)) & 1\n                old_bit = self.display_buffer[px, py] & 1\n  \
  \              if new_bit and old_bit: # 如果都设置了，翻转为黑色\n                    flipped_black\
  \ = True\n                # CHIP-8 通过异或绘制\n                new_pixel = new_bit ^\
  \ old_bit\n                self.display_buffer[px, py] = WHITE if new_pixel else\
  \ BLACK\n        # 设置碰撞标志位\n        self.v[0] = 1 if flipped_black else 0\n```\n\
  \nCHIP-8 使用异或操作绘制精灵。*XOR*（或*异或*）是一种按位运算，当两个比特位不同时返回 1，当它们相同时返回 0。Python 使用 `^` 运算符进行异或。\n\
  \n### 表 5-2：异或真值表\n\n| 0 ^ 0 | 0 ^ 1 | 1 ^ 0 | 1 ^ 1 |\n| --- | --- | --- | ---\
  \ |\n| 0 | 1 | 1 | 0 |\n\n\n\n\n`draw_sprite()` 方法是该过程的编码实现。我们遍历精灵图的所有行和列，精灵图从寄存器\
  \ `i` 指定内存位置开始，使用右移操作提取精灵图的每个像素并将其存储在 `new_bit` 中。对输入 `new_bit` 的数据进行 `&` 操作，确保了只有移位操作的最后一位被存储在\
  \ `new_bit` 中。我们将每个 `new_bit` 与屏幕上已有的位 `old_bit` 进行比较，如果 `old_bit` 将从白色变为黑色，我们就会设置标志寄存器。我们通过对\
  \ `new_bit` 和 `old_bit` 进行异或（XOR）运算来改变显示缓冲区。\n\n为什么我们需要一个标志位来跟踪绘制精灵图是否会导致之前亮起的屏幕像素被关闭？这本质上是碰撞检测的一种形式。如果精灵图撞到了屏幕上已经存在的物体，这在游戏中是非常有用的。例如，如果你正在编写一个网球游戏，你会想知道球何时移动并击中屏幕上已经存在的球拍。\n\
  \n## 指令执行\n\n现在是进入 VM 的核心部分了。我们还剩下一个方法了，但它非常大：我们需要实现 VM 的所有指令。这与我们在第 1 章和第  2 章的解释器中执行语句并不相似。无论是执行解释器语句、VM\
  \ 指令还是模拟器中的微处理器操作码，我们都需要做一件相当简单的事情：识别出下一条指令是什么，然后执行几行不同的代码，根据其意图操作来处理 VM 的状态。\n\n\
  例如，如果我们看到 `add` 指令，我们应该将两个指定的数字相加并将结果存储在指定位置。如果我们看到 `jump` 指令，我们应该将执行流移动到内存中的指定位置。这本质上是关于识别正在执行哪条指令，并根据该指令更改代表内存、寄存器等的状态变量。实现此点的最简单方法是使用大量的\
  \ `if` 语句。伪代码可能如下：\n\n```\nif instruction == ADD:\n    将某些数字相加并存储和\nelif instruction\
  \ == JUMP:\n    通过改变程序计数器跳转到某个位置\nelif instruction == DRAW:\n    通过改变显示缓冲区在指定位置绘制精灵图\n\
  etc.\n```\n\n除了使用大量的 `if` 语句外，编写执行指令的代码还有三种常见模式。第一种是巨大的 `switch` 语句，这种结构在许多语言中存在，但在\
  \ Python 中并没有完全相同的形式。我假设大多数读者以前在 C 或 Java 等语言中见过 `switch` 语句。如果你没见过，可以将其看作 Python\
  \ `match` 语句的原始形式，就像我们在第 1 章和第  2 章中使用的那样。`switch` 语句执行的哪一个分支取决于指令。这与刚刚显示的伪代码有些相似。事实上，在\
  \ Python 3.10 引入 `match` 语句之前，在 Python 中实现这种模式的方法确实是大量的 `if` 和 `elif` 子句。这是实现指令执行的最简单方法，但对于大型指令集来说，可能会变得非常笨肿。\n\
  \n下一种模式是使用*跳转表*（jump table），它由一个函数指针数组组成。我们根据指令索引该数组，然后执行返回的相应函数。指令只是整数，这就是为什么它们可以作为数组索引。如果由于某种原因指令是字符串，我们可以改用字典，其中键是指令，值是函数指针，尽管这样效率低一些。由于这种模式将工作分配到许多辅助函数中，它生成的代码通常比巨大的\
  \ `switch` 语句更整洁，并且可能更适用于更大的指令集。\n\n第三种模式是使用*动态重编译*（dynamic recompilation），即我们将每条指令翻译成底层硬件可以理解的指令（或可以进一步翻译成此类的内容）。例如，如果我们在运行在\
  \ x86 微处理器上的 VM 中有一个加法指令，我们可以将 VM 的加法指令翻译成等效 x86 加法指令的机器码。这是实现起来最复杂的模式，因为它不仅需要熟悉原始指令集，还需要深入了解被翻译的目标指令集。然而，它将带来最快的性能。\n\
  \n在这个程序中，我们将使用巨大的 `match` 语句，因为 CHIP-8 的指令集相对较小。当我们在下一章创建 NES 模拟器时，我们将使用跳转表，因为 6502\
  \ 微处理器的指令集大小大约是它的两倍（尽管仍然比几乎任何其他微处理器小）。动态重编译是一项复杂得多的技术，超出了本书的范围。\n\n`step()` 方法负责执行指令，但首先该方法需要获取要执行的下一条指令：\n\
  \n```python\n    def step(self):\n        # 我们按照半字节（4 位片段）来查看操作码\n        # 操作码是\
  \ 16 位，由内存中的后两个字节组成\n        first2 = self.ram[self.pc]\n        last2 = self.ram[self.pc\
  \ + 1]\n        first = (first2 & 0xF0) >> 4\n        second = first2 & 0xF\n  \
  \      third = (last2 & 0xF0) >> 4\n        fourth = last2 & 0xF\n\n        self.needs_redraw\
  \ = False\n        jumped = False\n```\n\n下一条指令位于程序计数器（`pc`）存储的内存地址处。由于指令由 16 位组成，我们在\
  \ `pc` 处获取后 2 个字节并存储在 `first2` 和 `last2` 中。正如之前讨论的，将每条 CHIP-8 指令考虑为四个半字节的组合是方便的。我们将这些半字节存储在\
  \ `first`、`second`、`third` 和 `fourth` 中。\n\n在执行指令时，我们还会通过 `needs_redraw` 跟踪它是否需要重绘，通过\
  \ `jumped` 跟踪它是否修改了 `pc`。运行循环使用 `needs_redraw` 进行优化。如果什么都没有变化，为什么要绘图呢？跟踪 `jumped`\
  \ 允许将通用代码放在 `step()` 的底部，从而减少一些代码重复。\n\n现在我们到了实际指令部分。巨大的 `match` 语句出现了。我们的实现利用 Python\
  \ 优雅的 `match` 语法，将执行指令所需的半字节捕获到临时变量中。每条指令执行的细节直接遵循其在本章早些的描述。许多指令只需要一行代码即可实现。逐一编写每一个指令将极其枯燥。相反，接下来的内容是\
  \ `step()` 剩余部分的复制，并附有注释提供额外的背景信息。\n\n\n\n本章早期对指令的描述相当简短，但你可以在线上的无数份 CHIP-8 参考资料中找到更详细的说明。不过，不要在单条指令上花费太多时间。如果你卡住了，可以随时查看这里的实现代码。在你尝试编写自己的指令实现后，可以回到本书的代码中双双检查你的工作。先自己完成这些工作将让你对编写一个简单的虚拟机或模拟器所需的内容有一个良好的了解。不要害怕：你会对实现许多指令之简单而感到惊讶。记住，原始的\
  \ CHIP-8 VM 仅占了 512 字节的内存！\n\n```\n        match (first, second, third, fourth):\n\
