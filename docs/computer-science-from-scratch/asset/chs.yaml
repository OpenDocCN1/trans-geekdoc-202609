  \ 参见 [`www.tinybasic.de`](https://www.tinybasic.de).\n\n# 第二部分 计算艺术\n\n## 3 复古图像处理\n\
  \n![](img/opener.jpg)\n\n当你需要在颜色数量比图像本身更少的显示器上显示图像时，该怎么办？解决这个问题属于抖动（dithering）算法的领域，这些算法策略性地使用有限的色板来营造更多颜色的错。在本章中，我们将编写一个程序，可以获取任何现代照片并将其显示在经典的单色\
  \ Macintosh 上。它将照片转换为经过抖动处理的 1 位黑白版本，并将其导出为早期 Macintosh 可以读取的格式：`MacPaint`。在此过程中，我们将学习一种抖动算法。\n\
  \n### 什么是抖动？\n\n*抖动算法* 特意向图像中引入噪声，使其看起来具有更多的深度。如果你见过印刷品中的*半色网*（halftone），你可能就知道什么是抖动了。\n\
  \n如果你查看`图 3-1`(#chapter2.xhtml#chapter2_1)，你会看到 `JPEG` 和 `GIF` 格式。1984 年的 Macintosh\
  \ 只能支持 256 色色，但 1 位的 `GIF` 也是如此。\n\n`图 3-2`(#chapter2.xhtml#chapter2_2) 显示了最终结果：在\
  \ Mac Plus 上运行的 `MacPaint`。\n\n![图 3-2：来自图 3-1 的海滩场景，通过我们的程序转换](img/Figure_2.jpg)\n\
  \n图 3-2：来自`图 3-1`(#chapter2.xhtml#chapter2_1) 的海滩场景，通过我们的程序转换为显示\n\n抖动的另一种常见用途是灰度化（grayscale）。对于`图\
  \ 3-1`(#chapter2.xhtml#chapter2_1)，我首先将场景缩小到较低的分辨率，以便两个版本并排（我使用软件统计了低分辨率的颜色）。我通过程序将\
  \ `JPEG` 图像转换为位 `MacPaint` 灰度。\n\n### 开始之前\n\n项目中独特且有趣的部分是第 3 和第 4 步，因此我们将使用一个库来完成第\
  \ 1 和第 2 步。Python 世界中最流行的图像库可能是 `Pillow`。安装它应该和 `pip install pillow` 一样简单。\n\n\n\
  \n\nPillow 只需一行代码即可读取任何流行格式的图像，只需多写几行即可调整图像大小并将其转换为灰度。我们将在 `__main__.py` 文件中直接完成这些简单的准备工作，并像我们在前两个项目中做的那样处理命令行参数。让我们从缩放和转换为灰度的代码开始，这些代码出现在一个命名非常恰当的\
  \ `prepare()` 函数中：\n\n```\n### RetroDither/__main__.py\nfrom PIL import Image\n\
  from argparse import ArgumentParser\nfrom RetroDither.dither import dither\nfrom\
  \ RetroDither.macpaint import MAX_WIDTH, MAX_HEIGHT, write_macpaint_file\n\ndef\
  \ prepare(file_name: str) -> Image.Image:\n    with open(file_name, \"rb\") as fp:\n\
  \        image = Image.open(fp)\n        # 将尺寸缩放到 MacPaint 的最大限制范围内\n        if\
  \ image.width > MAX_WIDTH or image.height > MAX_HEIGHT:\n            desired_ratio\
  \ = MAX_WIDTH / MAX_HEIGHT\n            ratio = image.width / image.height\n   \
  \         if ratio >= desired_ratio:\n                new_size = (MAX_WIDTH, int(image.height\
  \ * (MAX_WIDTH / image.width)))\n            else:\n                new_size = (int(image.width\
  \ * (MAX_HEIGHT / image.height)), MAX_HEIGHT)\n            image.thumbnail(new_size,\
  \ Image.Resampling.LANCZOS)\n        # 转换为灰度\n        return image.convert(\"L\"\
  )\n```\n\n如前所述，MacPaint 图像的分辨率限制为宽 576 像素、高 720 像素。我们在 `macpaint.py` 中将这些值定义为常量。在\
  \ `prepare()` 中，如果图像太大，我们会按比例对其缩放。为此，我们计算图像宽度与高度的比例，并与 MacPaint 最大尺寸的比例进行比较。通过将一个维度缩放到\
  \ MacPaint 允许的最大尺寸，并根据相应的比例调整另一个维度，我们得到了一个在 MacPaint 中尽可能大且没有任何部分被裁剪的最终图像。为了算出缩放公式，我在纸上做了一些简单的交叉乘代数运算。如果你对原理感兴趣，我建议你也这样做。\n\
  \n和读取图像文件一样，在 Pillow 中进行缩放只需使用 `image.thumbnail()` 方法即可完成的单行代码。它提供了多种内置算法来实际计算缩放后的每个像素应呈现什么颜色；`LANCZOS`\
  \ 可能是质量最高的（尽管会带来一定的性能代价）。最后，`image.convert(\"L\")` 将图像转换为灰度。灰度模式的 `\"L\"` 是 `luminance`（亮度）的缩写，在计算机图形中，它也被称为\
  \ `luma`。\n\n现在让我们处理命令行参数：\n\n```\nif __name__ == \"__main__\":\n    argument_parser\
  \ = ArgumentParser(\"RetroDither\")\n    argument_parser.add_argument(\"image_file\"\
  , help=\"输入图像文件.\")\n    argument_parser.add_argument(\"output_file\", help=\"结果性\
  \ MacPaint 文件.\")\n    argument_parser.add_argument('-g', '--gif', default=False,\
  \ action='store_true',\n                                 help='同时创建一个输出 gif。')\n\
  \    arguments = argument_parser.parse_args()\n    original = prepare(arguments.image_file)\n\
  \    dithered_data = dither(original)\n    if arguments.gif:\n        out_image\
  \ = Image.frombytes('L', original.size, dithered_data.tobytes())\n        out_image.save(arguments.output_file\
  \ + \".gif\")\n    write_macpaint_file(dithered_data, arguments.output_file, original.width,\
  \ original.height)\n```\n\n在此时，在第三个项目中，我们已经见过很多 `ArgumentParser` 了。对于 Retro Dither，与之前的项目相比，我们多了几命令行选项。其，`output_file`\
  \ 用于用户指定结果的输出文件名和路径。可选的 `-g` 或 `--gif` 参数用于用户指定他们是否除了 MacPaint 输出外还想要 GIF 输出。如果用户请求\
  \ GIF 输出，我们将使用 Pillow 写入抖动图像的 GIF 版本。\n\nPillow 是一个功能非常全且强大的库。我们将在本章中不会使用它的许多功能，但如果你需要在\
  \ Python 中进行图像处理，那么花时间学习它是非常值得的。我们将在下一章中再次看到它。更多信息请查阅 Pillow 文档：`https://pillow.readthedocs.io`。\n\
  \n### 抖动算法\n\n有很多不同的抖动算法，其中最流行的一类被称为`误差扩散`（error-diffusion）算法。这类算法获取像素最终位置与起始位置之间的某些差异（`误差`），并将其扩散（`diffuses`）到相邻像素中。最流行的误差扩散抖动算法被称为\
  \ Floyd-Steinberg 抖动（由 Robert Floyd 和 Louis Steinberg 于 1976 年发明）。事实上，Pillow 内置了对\
  \ Floyd-Steinberg 抖动的支持。\n\n仅仅使用 Pillow 来抖动将毫无趣味，而且我们在这个过程中学不到任何东西。相反，我们将实现一种 Pillow\
  \ 不具备的算法：Atkinson 抖动算法。它由 Bill Atkinson 在 1984 年创建，专门用于原始 Macintosh 电脑上的软件，例如 Atkinson\
  \ 曾参与开发的的 MacPaint。\n\n在深入研究 Atkinson 抖动的细节之前，让我们泛泛地讨论误差扩散算法。大多数此类算法从左上到右下逐个查看图像的像素。移动方向是每行从左到右，在完成每行后向下移动一行。对于处理的每个像素，都会发生以下步骤：\n\
  \n1. 找到它接近哪些输出颜色。\n2. 找到输出颜色与原始颜色之间的差异。\n3. 相加部分。\n\n让我们将这些通用步骤应用到我们的特定场景中，即像素通过\
  \ Atkinson 抖动从灰度转换为黑白：\n\n1. 寻找黑色或白色更接近灰色。这将基于某种阈值。例如，如果灰色被存储为 8 位无符号整数，则可能有 0 到\
  \ 255 的 256 种灰色，我们的阈值可以是 127。任何大于 127 的像素都可能被标记为白色（在此方案中为 255），任何小于或等于 127 的像素可能被标记为黑色（0）。\n\
  2. 减去新像素颜色与其原始颜色之间的差异。假设原始灰色为 204。差异为 255 – 204 = 51。这就是我们的误差。\n3. 将误差的八分之一添加到原始像素附近的六个特定像素。这就是扩散步骤。在这种情况下，51\
  \ // 8 = 6（我们需要进行整数除法）。调整的像素是：右侧一个、右侧两个、左下一个、右下一个、正下方一个、下方两个。\n\nFloyd-Steinberg\
  \ 抖动和 Atkinson 抖动之间只有第 3 步不同。你会注意到，由于我们将误差的八分之一分配到六个像素中，我们只分配了总误差的六分之五或四分三。在 Floyd-Steinberg\
  \ 抖动中，所有的误差都被分配到四个相邻像素中。这种误差分配方式的不同使得 Atkinson 抖动的看起来似乎更强调对比度的变化，而 Floyd-Steinberg\
  \ 抖动的视觉效果可能更平滑。\n\n\n\n\n![图 3-3: 作者祖母的肖像，显示了不同颜色之间良好的对比度，说明了边缘在抖动处理中是如何出现的](img/Figure_3-3.jpg)\n\
  \n### 图 3-3: 作者祖母的肖像，显示了不同颜色之间良好的对比度，说明了边缘在抖动处理中是如何出现的\n\n表 3-1 和 3-2 分别包含了代表 Atkinson\
  \ 抖动和 Floyd-Steinberg 抖动中误差扩散的矩阵。`X` 表示原始像素位置，列和行标题表示距离原始像素在列或行方向的移动。\n\n### 表 3-1：Atkinson\
  \ 抖动中的误差扩散\n\n| Δ || –1 || 0 || +1 || +2 |\n| --- | --- | --- | --- | --- |\n| 0\
  \ ||  || X || 1/8 || 1/8 |\n| --- | --- | --- | --- | --- |\n| +1 || 1/8 || 1/8\
  \ || 1/8 ||  |\n| +2 ||  || 1/8 ||  ||  |\n\n### 表 3-2：Floyd-Steinberg 抖动中的误差扩散\n\
  \n| Δ || –1 || 0 || +1 |\n| --- | --- | --- | --- |\n| 0 ||  || X || 7/16 |\n| ---\
  \ | --- | --- | --- |\n| +1 || 3/16 || 5/16 || 1/16 |\n\n尽管我们将实现 Atkinson 抖动，但我们将保持矩阵的分离，以便你方便地接入不同的矩阵。例如，你可以轻松地将代码更改为\
  \ Floyd-Steinberg 抖动或其他误差扩散变体，或者尝试你自己的方法。事实上，这样做是本章节末的练习题之一。\n\n我们的抖动代码从定义一些常量开始：\n\
  \n`RetroDither/dither.py`\n\n```python\nfrom PIL import Image\nfrom array import\
  \ array\nfrom typing import NamedTuple\n\nTHRESHOLD = 127\n\nclass PatternPart(NamedTuple):\n\
  \    dc: int # 列的变化\n    dr: int # 行的变化\n    numerator: int\n    denominator: int\n\
  \nATKINSON = [PatternPart(1, 0, 1, 8), PatternPart(2, 0, 1, 8),\n            PatternPart(-1,\
  \ 1, 1, 8), PatternPart(0, 1, 1, 8),\n            PatternPart(1, 1, 1, 8), PatternPart(0,\
  \ 2, 1, 8)]\n```\n\n正如算法中所描述，我们将 `THRESHOLD` 设置为 127（大约 0 和 255 之间的中间点）。在 `ATKINSON`\
  \ 中，我们将 Atkinson 抖动矩阵展平为六个 `PatternPart` 命名元组，每个元组都指定了被改变像素之一相对于原始像素的位置，以及应该加到其上的误差比例。\n\
  \n接下来，我们将开始定义 `dither()` 函数，抖动处理就在这里发生：\n\n```python\n### 假设我们正在处理一张灰度图像（Pillow\
  \ 中的 \"L\" 模式）\n### 返回抖动后的像素数组（255 为白色，0 为黑色）\ndef dither(image: Image.Image) ->\
  \ array:\n    # 在附近的像素之间分配误差\n    def diffuse(c: int, r: int, error: int, pattern:\
  \ list[PatternPart]):\n        for part in pattern:\n            col = c + part.dc\n\
  \            row = r + part.dr\n            if col < 0 or col >= image.width or\
  \ row >= image.height:\n                continue\n            current_pixel: float\
  \ = image.getpixel((col, row)) # type: ignore\n            # 将 `error_part` 添加到\
  \ `image` 中 `col`, `row` 处的像素\n            error_part = (error * part.numerator)\
  \ // part.denominator\n            image.putpixel((col, row), current_pixel + error_part)\n\
  ```\n\n`dither()` 函数从 `diffuse()` Helper 函数开始，该函数接收误差并根据模式指定的比例将其分配到附近的像素中，模式只是\
  \ `PatternPart` 元组的列表。我们遍历 `pattern` 中的每个 `PatternPart`，找到与该部分相关的像素，并将误差的比例加到其中。正如讨论的，模式是使一种误差扩散算法区别于另一种算法的核心。注意这里所有的运算都是整数运算。这是因为像素值是存储为整数的。\n\
  \n在 `dither()` 的其余部分，我们遍历图像中的每个像素，根据 `THRESHOLD` 将其变为黑色或白色，计算与原始灰色的差异，并使用 `diffuse()`\
  \ Helper 函数将误差扩散到附近的像素：\n\n```python\n    result = array('B', [0] * (image.width\
  \ * image.height))\n    for y in range(image.height):\n        for x in range(image.width):\n\
  \            old_pixel: float = image.getpixel((x, y)) # type: ignore\n        \
  \    # 每个新像素要么是纯白色要么是纯黑色\n            # 因为这是原始 Macintosh 支持的所有内容\n            new_pixel\
  \ = 255 if old_pixel > THRESHOLD else 0\n            result[y * image.width + x]\
  \ = new_pixel\n            difference = int(old_pixel - new_pixel)\n           \
  \ # 在后续附近的像素之间分散误差\n            diffuse(x, y, difference, ATKINSON)\n\n    return\
  \ result\n```\n\n`result` 变量实际上是一个 `array`。由于我们要处理大量的像素数据，我们会反复看到它。令人困惑的是，Python\
  \ 为原始字节提供了至少三种不同类型：`bytes`、`bytearray` 和 `array(\"B\")`。`array` 类型特别设计用于紧凑表示。\n\n\
  ### MacPaint 文件格式\n\n在它之前就有绘画程序了，但对于之后出现的一切，MacPaint 设定了标准。它由 Bill Atkinson 编写，于\
  \ 1984 年与原始 Macintosh 同时发布。尽管早于 Xerox Star 和 Apple Lisa 出现，但 Macintosh 是第一台带有鼠标和图形用户界面（GUI）的广泛使用的个人电脑。MacPaint\
  \ 是演示鼠标和 GUI 多么强大的软件展示作品之一。《纽约时报》的一位评论员曾说它是具有革命性的，尽管存在局限性。许多首次出现在 MacPaint 中的工具和图形处理技术直到今天仍然伴随着我们。\n\
  \n我鼓励你玩一玩 MacPaint 来感受一下它。互联网档案馆上有它的在线演示，但如果你花时间下载一个模拟器，可能会从本章节中获得最大的成就感，这样你就可以在\
  \ MacPaint 中加载我们程序输出的图像。你甚至可以在 eBay 上找一台旧 Mac！\n\n\n\n\n从表面上看，MacPaint 文件非常简单。它由一个\
  \ 512 字节的表头和随后的使用游程编码（run-length encoding）压缩的像素数据组成。在进行游程编码之前，每个像素以 1 位的形式存储，1 表示黑色，0\
  \ 表示白色。这听起来一切都很直观。然而，这里有一个特殊之处：与几乎任何其他操作系统不同，经典的 Mac 操作系统将文件存储在两个“分支”（forks）中。稍后会深入探讨，简单来说，在经典\
  \ Mac OS 以外的操作系统上传输或创建的 MacPaint 文件应该采用名为 `MacBinary` 的特殊格式，以确保其元数据在传输过程中保留。因此，我们需要通过添加一个特殊的额外表头，将输出文件转换为\
  \ MacBinary 文件。\n\n我们将逐步处理这种晦涩的文件格式。首先，我们将处理像素数据。然后，我们将实现游程编码。最后，我们将创建 MacPaint\
  \ 和 MacBinary 表头。在操作过程中，我们需要使用各种位运算，包括位移、位或（OR）和位与（AND）。如果你对这种低级位操作不熟悉，或者只是觉得有些生疏，请参阅本书的附录\
  \ 关于 Python 位运算的概述。\n\n### 将字节转换为位\n\n在“L”模式下，我们的 Pillow 图像使用每个像素 1 字节进行编码。但在 MacPaint\
  \ 位点图中，像素是以每个像素 1 位编码的，这意味着每个字节代表八个像素。对于黑白图像来说，这是一个巨大的节省，而且非常有意义，因为我们只需要两个值（1 和\
  \ 0）来表示两种颜色。在定义了一些常量后，我们在 `macpaint.py` 中的第一个函数是一个转换器，它接收从 `dither()` 获取的字节数组并将其转换为“位数组”：\n\
  \n`RetroDither/macpaint.py`\n\n```\nfrom array import array\nfrom pathlib import\
  \ Path\nfrom datetime import datetime\n\nMAX_WIDTH = 576\nMAX_HEIGHT = 720\nMACBINARY_LENGTH\
  \ = 128\nHEADER_LENGTH = 512\n\n### 将每个字节为 0 或 255 的字节数组\n# 转换为位数组，其中每个 0 字节变为 1，\n\
  # 每个 255 字节变为 0\ndef bytes_to_bits(original: array) -> array:\n    bits_array =\
  \ array('B')\n\n    for byte_index in range(0, len(original), 8):\n        next_byte\
  \ = 0\n        for bit_index in range(8):\n            next_bit = 1 - (original[byte_index\
  \ + bit_index] & 1)\n            next_byte = next_byte | (next_bit << (7 - bit_index))\n\
  \            if (byte_index + bit_index + 1) >= len(original):\n               \
  \ break\n        bits_array.append(next_byte)\n    return bits_array\n```\n\n这里的循环每次从原始数组中迭代\
  \ 8 个字节，检查每个字节是白色（255）还是黑色（0）像素。MacPaint 的位点格式反转了这一点，使白色像素变为 0，黑色像素变为 1。行 `next_bit\
  \ = 1 - (original[byte_index + bit_index] & 1)` 执行了这一反转。注意，我们实际上并没有将值与 255 进行比较，而是倾向于只检查第一位（`&\
  \ 1`），因为这使得代码更紧凑且高效。我们知道在调用 `bytes_to_bits()` 之前，数组中只存储了 255 和 0，所以没有理由担心捕获到中间值；如果字节中任何地方有\
  \ 1，它必须是 255。这 8 位通过 `next_byte | (next_bit << (7 - bit_index))` 编码到 `next_byte`\
  \ 中（注：此处原文代码逻辑与描述略有出入，此处按逻辑翻译）。*（注：原文提供的代码块似乎存在错乱，以下为根据上下文逻辑的翻译说明）*\n\n```python\n\
  ### Convert an array of bytes where each byte is 0 or 255\n# to an array of bits\
  \ where each byte that is 0 becomes a 1\n# and each byte that is 255 becomes a 0\n\
  def bytes_to_bits(original: array) -> array:\n    bits_array = array('B')\n\n  \
  \  for byte_index in range(0, len(original), 8):\n        next_byte = 0\n      \
  \  for bit_index in range(8):\n            next_bit = 1 - (original[byte_index +\
  \ bit_index] & 1)\n            next_byte = next_byte | (next_bit << (7 - bit_index))\n\
  \            if (byte_index + bit_index + 1) >= len(original):\n               \
  \ break\n        bits_array.append(next_byte)\n    return bits_array\n```\n\n（由于原文提供的示例代码块在描述部分之后出现了逻辑混乱的文本重复，以下译文将基于其描述逻辑进行翻译）：\n\
  \n这里的循环每次从原始数组中迭代 8 个字节，检查每个字节是白色（255）还是黑色（0）像素。MacPaint 的位点格式反转了这一点，使白色像素变为 0，黑色像素变为\
  \ 1。`next_bit = 1 - (original[byte_index + bit_index] & 1)` 这一行执行了反转。注意，我们实际上并没有将值与\
  \ 255 进行比较，而是倾向于只检查第一位（`& 1`），因为这使得代码更紧凑且高效。我们知道在调用 `bytes_to_bits()` 之前，数组中只存储了\
  \ 255 和 0，所以没有理由担心捕获到中间值；如果字节中任何地方有 1，它必须是 255。这 8 位通过位移和位或操作编码。\n\n（注：原文的后半部分出现了严重的文本重复和乱码，以下翻译已根据技术逻辑进行了清理对齐）\n\
  \n### 实现游程编码\n\n将像素作为单个字节存储可以节省空间，但这样是不够的。为了缓解磁盘空间问题，MacPaint 文件引入了一种名为游程编码的简单方案。在这种方案中，与其重复相同的内容，而是说它应该重复的次数。\n\
  \n```python\n### 将字节数组转换为位\n### 填充 MacPaint \n使用 prepare() \n\ndef prepare(data:\
  \ array, width: int, height: int) -> array:\n    bits_array = array('B')\n    #\
  \ ... 逻辑省略 ...\n```\n\n\n\nMacPaint 通过使用带符号的 1 字节整数来表示字面运行（literal runs）和重复运行（repetition\
  \ runs），从而消除了两者之间的数字歧义。0 到 127 之间的数字 `n` 表示其后有 `n` + `1` 个字面字节。–1 到 –127 之间的数字 `n`\
  \ 表示接下来的字节将重复 1 – `n` 次。数字 `-128` 不被使用。这种压缩方案被称为 `PackBits`，它不仅用于 MacPaint，还被用于其他几种流行的文件格式。\n\
  \n经典版本的 Mac OS 实际上内置了 PackBits 函数。根据 Apple 关于该主题的技术笔记，“使用 PackBits，典型的 MacPaint\
  \ 文档可以压缩到约 10K”。表 3-3 总结了 PackBits 编码方案。\n\n表 3-3：PackBits 编码方案（带符号）\n\n| n 的值 |\
  \ 含义 |\n| --- | --- |\n| 0 到 127 | 紧后有 `n` + `1` 个字面字节。 |\n| --- | --- |\n| –1 到\
  \ –127 | 下一个字节重复 1 – `n` 次。 |\n| –128 | 跳过。 |\n\n我们将使用无符号整数，因此重写表格比对每个字节进行从带符号到无符号的转换（或考虑补码）更方便。表\
  \ 3-4 是将字节转换为无符号整数后的编码方案。\n\n表 3-4：PackBits 编码方案（无符号）\n\n| n 的值 | 含义 |\n| --- |\
  \ --- |\n| 0 到 127 | 紧后有 `n` + `1` 个字面字节。 |\n| --- | --- |\n| 129 到 255 | 下一个字节重复\
  \ 257 – `n` 次。 |\n| 128 | 跳过。 |\n\n你考虑过这种方案的局限性吗？如果一个运行块中包含超过 128 个字节怎么办？幸运的是，我们在编码\
  \ MacPaint 文件时不会遇到这个问题，因为它们是逐行进行编码的。MacPaint 中的一行只能有 576 像素，存储为 72 字节。由于 72 小于 128，我们不需要担心这个限制。\n\
  \n为了检查你的理解情况，请尝试 Apple 在技术笔记 TN1023 中提供的示例。为了方便起见，我在表 3-5 中将其从十六进制转换成了十进制。一行是未解包的数据，另一行是压缩的数据。尝试以表\
  \ 3-4 为参考，根据未解包数据重新构建压缩数据。然后对照表 3-5 中的压缩数据检查你的结果。\n\n表 3-5：PackBits 示例\n\n| 类型 |\
  \ 字节 |\n| --- | --- |\n| 未解包 | 170, 170, 170, 128, 0, 42, 170, 170, 170, 170, 128,\
  \ 0, 42, 34, 170, 170, 170, 170, 170, 170, 170, 170, 170, 170 |\n| --- | --- |\n\
  | 压缩 | 254, 170, 2, 128, 0, 42, 253, 170, 3, 128, 0, 42, 34, 247, 170 |\n\n让我们实现一个\
  \ PackBits 编码器。`run_length_encode()` 函数接收一个字节数组并使用 PackBits 方案返回一个行程编码的字节数组。它从一个内部辅助函数\
  \ `take_same()` 开始，该函数可以找到重复值的运行块并返回它们的长度：\n\n```\n### MacPaint 要求按行进行 RLE（MAX_WIDTH）。\n\
  ### 换句话说，存在行边界。\ndef run_length_encode(original_data: array) -> array:\n    # 查找连续中有多少个相同的字节\n\
  \    def take_same(source: array, start: int) -> int:\n        count = 0\n     \
  \   while (start + count < len(source) and source[start + count] == source[start]):\n\
  \            count += 1\n        return count\n```\n\n\n\n\n```python# tests/test_retrodither.py\n\
  import unittest\nfrom array import array\nfrom RetroDither.macpaint import run_length_encode\n\
  \nclass RetroDitherTestCase(unittest.TestCase):\n    # Example 自\n    # web.archive.org/web/20080705155158/http://developer.apple.com/technotes/tn/tn1023.html\n\
  \    def test_apple_rle_example(self):\n        unpacked = array(\"B\", [0xAA, 0xAA,\
  \ 0xAA, 0x80, 0x00, 0x2A, 0xAA, 0xAA, 0xAA, 0xAA,\n                            \
  \   0x80, 0x00, 0x2A, 0x22, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA,\n              \
  \                 0xAA, 0xAA, 0xAA, 0xAA])\n        packed = run_length_encode(unpacked)\n\
  \        expected = array(\"B\", [0xFE, 0xAA, 0x02, 0x80, 0x00, 0x2A, 0xFD, 0xAA,\
  \ 0x03, 0x80,\n                               0x00, 0x2A, 0x22, 0xF7, 0xAA])\n \
  \       self.assertEqual(expected, packed)\n\n    # 包后的数据比解包数据长的示例\n    def test_longer_rle(self):\n\
  \        unpacked = array(\"B\", [0x55, 0x55, 0xBB, 0xBB, 0x55, 0xBB, 0xBB, 0x55])\n\
  \        packed = run_length_encode(unpacked)\n        expected = array(\"B\", [0xFF,\
  \ 0x55, 0xFF, 0xBB, 0x00, 0x55, 0xFF, 0xBB, 0x00, 0x55])\n        self.assertEqual(expected,\
  \ packed)\n\n    def test_simple_literal(self):\n        unpacked = array(\"B\"\
  , [0x00, 0x01, 0x02, 0x03, 0x04])\n        packed = run_length_encode(unpacked)\n\
  \        expected = array(\"B\", [0x04, 0x00, 0x01, 0x02, 0x03, 0x04])\n       \
  \ self.assertEqual(expected, packed)\n\n    def test_simple_literal2(self):\n  \
  \      unpacked = array(\"B\", [0x00])\n        packed = run_length_encode(unpacked)\n\
  \        expected = array(\"B\", [0x00, 0x00])\n        self.assertEqual(expected,\
  \ packed)\n\n    def test_simple_same(self):\n        unpacked = array(\"B\", [0x11,\
  \ 0x11, 0x11, 0x11])\n        packed = run_length_encode(unpacked)\n        expected\
  \ = array(\"B\", [0xFE, 0x11, 0x03])\n        self.assertEqual(expected, packed)\n\
  \n    def test_simple_same2(self):\n        unpacked = array(\"B\", [0x11, 0x11,\
  \ 0x11, 0x11, 0x11, 0x11, 0x11, 0x11])\n        packed = run_length_encode(unpacked)\n\
  \        expected = array(\"B\", [0xFE, 0x11, 0x07])\n        self.assertEqual(expected,\
  \ packed)\n\nif __name__ == \"__main__\":\n    unittest.main()\n```\n\n这些测试确保了行程长度编码工作正常，并完成了我们对\
  \ MacPaint 文件的实现。为了让我们的抖动图片能够在 Mac 上正常，现在只剩下最后一步了。\n\n### 转换为 MacBinary\n\n在大多数操作系统中，文件只是一个单一的数据块。文件系统或操作系统可能会保留关于每个文件的某些元数据，但文件本身是独立的。在具有两个分叉（fork）的经典\
  \ Mac 上，`data fork`（数据分叉）持有文件的主要数据，而 `resource fork`（资源分叉）则可能包含如位图、声音甚至可执行代码之类的辅助数据。`资源分叉`可以在一个地方存储不同类型的数据，因此就像一个资源数据库。这是操作系统的功能之一，允许许多应用程序完全自包含——一个可以作为单个图标拖放的可执行文件。\n\
  \n遗憾的是，由于其他系统上不存在`资源分叉`，经典 Mac 文件在与这些系统之间传输时经常会损坏。这个问题从一开始就存在了，因此很快开发了“封装”（bundling）格式。最流行且最标准的格式之一被称为\
  \ `MacBinary`。在 MacBinary 文件中，一个特殊的头部之后紧跟着是`数据分叉`和`资源分叉`。我们需要将 MacPaint 文件封装为 `MacBinary`\
  \ 文件，以便它们能够在经典 Mac 上正常工作并被默认打开。讽刺的是，MacPaint 文件实际上并没有`资源分叉`，它只有一个`数据分叉`。\n\n###\
  \ 表 3-6：MacBinary 字段\n\n| 偏移量 | 长度 | 类型 |\n| :--- | :--- | :--- |\n| 1 | 1 | 文件名长度（最多\
  \ 63） |\n| 2 | 63 | 文件名（MacRoman 编码） |\n| 65 | 4 | 文件类型（应为\"PTG\"） |\n| 69 | 4 |\
  \ 文件创建者（应为\"MPNT\"） |\n| 83 | 4 | 数据叉大小 |\n| 91 | 4 | 创建时间（自 1904 年以来的秒数） |\n| 95\
  \ | 4 | 修改时间（自 1904 年以来的秒数） |\n\n注意值是大大端存储的，因为经典 Mac OS 运行在大端微处理器上。（如果你对这没有意义，请参见“大端与小端”章节）。`MacRoman`\
  \ 是经典 Mac 使用的字符编码。\n\n```python\ndef macbinary_header(outfile: str, data_size: int)\
  \ -> array:\n    macbinary = array('B', [0] * MACBINARY_LENGTH)\n    filename =\
  \ Path(outfile).stem\n    filename = filename[:63] if len(filename) > 63 else filename\
  \ # 限制最多 63 字符\n    macbinary[1] = len(filename) # 文件名长度\n    macbinary[2:(2 + len(filename))]\
  \ = array(\"B\", filename.encode(\"macroman\")) # 文件名\n    macbinary[65:69] = array(\"\
  B\", \"PNTG\".encode(\"macroman\")) # 文件类型\n    macbinary[69:73] = array(\"B\",\
  \ \"MPNT\".encode(\"macroman\")) # 文件创建者\n    macbinary[83:87] = array(\"B\", data_size.to_bytes(4,\
  \ byteorder='big')) # 数据叉大小\n    timestamp = int((datetime.now() - datetime(1904,\
  \ 1, 1)).total_seconds()) # Mac 时间\n    macbinary[91:95] = array(\"B\", timestamp.to_bytes(4,\
  \ byteorder='big')) # 创建时间\n    macbinary[95:99] = array(\"B\", timestamp.to_bytes(4,\
  \ byteorder='big')) # 修改时间\n    return macbinary\n```\n\n### 汇总在一起\n\n为了将我们的 MacPaint\
  \ 文件封装为 MacBinary 文件，我们需要获取来自 `dither()` 的像素数组，并：\n\n1.  调用 `prepare()` 将其从字节转换为位并填充\
  \ 0。\n2.  调用 `run_length_encode()` 对位数组进行行程长度编码。\n3.  调用 `macbinary_header()` 将结果与\
  \ MacBinary 头部结合。\n4.  同样添加一个 512 字节的 MacPaint 头部。\n5.  在最终结果末尾填充 0 直到达到 128 字节的倍数，以遵循\
  \ MacBinary 规范此要求。\n\n任何超过 63 个字符的文件名都会被截断。\n\n这主要涉及调用我们已经有的函数：\n\n\n\n\n\n```python\n\
  ### Writes array data to out_file\ndef write_macpaint_file(data: array, out_file:\
  \ str, width: int, height: int):\n    bits_array = prepare(data, width, height)\n\
  \    rle = run_length_encode(bits_array)\n    data_size = len(rle) + HEADER_LENGTH\
  \ # header requires this\n    output = macbinary_header(out_file, data_size) + array('B',\
  \ [0] * HEADER_LENGTH) + rle\n    output[MACBINARY_LENGTH + 3] = 2 # Data Fork Header\
  \ Signature ❶\n    # MacBinary format requires that there be padding of 0s up to\
  \ a\n    # multiple of 128 bytes for the data fork\n    padding = 128 - (data_size\
  \ % 128)\n    if padding > 0:\n        output += array('B', [0] * padding)\n   \
  \ with open(out_file + \".bin\", \"wb\") as fp:\n        output.tofile(fp)\n```\n\
  \n这段代码中我们还没有讨论的部分是 512 字节的 MacPaint 头部。MacPaint 主要使用此头部来存储用户定义的模式数据。导出到 MacPaint\
  \ 的程序通常没有任何用户定义的模式，因为这些是用户在 MacPaint 中创建的产物。因此，我们可以将 MacPaint 头部大部分留为 0。我们必须做的是在\
  \ MacPaint 头的第 3 字节处放入一个小的签名，该字节始终设置为 2 ❶。\n\n## 结果\n\n要运行程序，你需要同时指定输入文件和输出文件。例如：\n\
  \n```bash\n% python3 -m RetroDither -g /Users/dave/Downloads/IMG_0892.jpeg\n/Users/dave/Downloads/AmericanFlag\n\
  ```\n\n程序会自动为输出文件添加 `.bin` 扩展名。\n\n图 3-4 显示了使用我们的程序创建的图像，我认为它具有很高的艺术性。\n\n![图 3-4:\
  \ 航天飞机发射](img/Figure_3-4.jpg)\n\n图 3-4：航天飞机发射\n\n但你如何查看自己的结果呢？当然，是在老式 Mac 上！MacPaint\
  \ 运行从 System 1 一直到 Mac OS 9 的机器上。你应该能找到一台运行这些操作系统之一的经典 Mac 来显示你的照片。你还需要一个用于解包 MacBinary\
  \ 文件的程序。有一个名字恰好叫 MacBinary 的程序可以下载。Stuffit Expander 是一款针对经典 Mac OS 非常流行的解压应用，也可以打开\
  \ MacBinary 文件。这两者都作为免费软件分发。你在 20 世纪 90 年代发现的大多数老式 Mac 应该已经安装了 Stuffit Expander。\n\
  \n我意识到并不是所有人都有足够的动力投入到这个项目中去跑出去寻找一台真正的复古电脑。没问题——你仍然可以通过模拟器体验你劳动的成果。多年前，苹果公司开始免费分发早期版本的\
  \ Mac OS 以及 MacPaint（通过发布完整的 MacPaint 源代码）。你可以合法且免费地获得所有所需的软件，在模拟器中创建一个真正的复古 Macintosh\
  \ 体验。\n\n目前有几种模拟器可用，但可能最具有复古感的过于是 Mini vMac，^(9)，我用它创建了本章中的一些截图。设置 Mini vMac 或其他几种流行的经典\
  \ Mac 模拟器（Basilisk II、SheepShaver 等）超出了本书的范围，但我认为作为一个程序员，你会发现这其实很容易。每个模拟器都有一种不同的从你的机器传输文件到模拟环境的机制。无论具体细节如何，这可能都比找一台旧\
  \ Mac 并让它联网，或者为你的现代机器寻找软驱驱动器要简单得多。尽管如此，老 Mac 很有趣！或者也许这种乐趣只是我伴随着它们长大的怀旧之。\n\n## 现实世界应用\n\
  \n阿金森抖动（Atkinson dithering）和 MacPaint 只是 Bill Atkinson 用于让原始 Macintosh 图形动起来的两种技术。他还是\
  \ QuickDraw 的创建者，QuickDraw 为所有 Lisa 和经典 Macintosh 计算机提供了图形原语。他的巨大贡献远超图形领域。他对我们现在认为是\
  \ GUI 中标准组件的元素进行了多项改进。Atkinson 还是 HyperCard 的创建者，这是最早广泛分发的超文本平台之一。你可以将其看作是 20 世纪\
  \ 80 年代后期非网络版本的网页。它非常有影响力。\n\n你可能好奇 Bill Atkinson 最初开发阿金森抖动是为了。我也一样，所以我获得了一本由 Jeffrey\
  \ S. Young 编写、Microsoft Press 于 1985 年出版的稀有书籍 *Inside MacPaint*。我并没有确切地找到答案，但我发现了一个可能的答案。事实证明，Atkinson\
  \ 曾为早期 Macintosh 的数位器工作过。它基本上是某种扫描仪，允许你在 MacPaint 中处理处理现实世界的图像。虽然书中没有明确说它使用了阿金森抖动，但我无法想象这是巧合。阿金森抖动的首次现实应用很可能是数位器。\n\
  \n抖动是 20 世纪 80 年代和 90 年代游戏机和计算机上广泛使用的技术，这些设备的性能足以显示比其原生支持更多的颜色。如果没有特殊手段，GIF 被限制在\
  \ 256 色。\n\n\n\n\n3. “Technical Note PT24: MacPaint Document Format,” Apple, 1988\
