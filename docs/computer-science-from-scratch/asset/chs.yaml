  \       / \"datasets\" / \"digits\" / \"digits.csv\")\n    digits_knn = KNN(Digit,\
  \ digits_file, has_header=False)\n    # 初始化 Pygame，创建窗口\n    pygame.init()\n   \
  \ screen = pygame.display.set_mode(size=(PIXEL_WIDTH, PIXEL_HEIGHT),\n         \
  \                            flags=pygame.SCALED | pygame.RESIZABLE)\n    pygame.display.set_caption(\"\
  Digit Recognizer\")\n```\n\n在最初几行中，我们创建了像素数组，加载了数据集并初始化了 Pygame。主窗口被初始化为一个“拉伸的”\
  \ 8×8 窗口。在最初几行中，我们创建了像素数组，加载数据集并初始化了 Pygame。主窗口被初始化为一个“拉伸的” 8×8 窗口。主窗口被初始化为一个“拉伸的”\
