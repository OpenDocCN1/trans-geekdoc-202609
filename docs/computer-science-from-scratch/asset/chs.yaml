  \ CPU 是完美的，你也可能遗漏某个可能导致整个程序崩溃的小 Bug。此外，你还需要确保修改模拟器的某部分不会破坏它的其他部分。\n\n### 运行游戏\n\n\
  单元测试是一回事，但我们模拟器的真实测试标准是看它是否能运行真实的 NES 软件。由于法律原因，我们不会在 NES 模拟器中测试任何商业软件。由于其局限性，我们的模拟器本身也无法运行\
  \ NES 库中的大多数游戏。相反，本书的源代码仓库包含了几个开源或公共领域的游戏，我们的模拟器能够运行这些游戏。从意义上来说，它们是真实的游戏，因为可以在真实的\
  \ NES 主机上运行。\n\n让我们从 `BrickBreaker` 开始，这是我之前提到的由 Aleff Correa 编写的一款类似 `Breakout`\
  \ 的游戏。假设你已经安装了 `Pygame` 和 `NumPy`，可以在仓库根目录下运行以下命令来玩此游戏：\n\n```\n% python3 -m NESEmulator\
  \ NESEmulator/Games/brix.nes\n```\n\n它看起来很不错（参见图 6-8）。\n\n![Figure 6-8: BrickBreaker\
  \ by Aleff Correa](img/Figure_6-8.jpg)\n\n图 6-8: Aleff Correa 的 BrickBreaker\n\n\
  接下来，让我们尝试 Shiru 编写的 `Chase`：\n\n```\n% python3 -m NESEmulator NESEmulator/Games/Chase.nes\n\
  ```\n\n图 6-9 显示了游戏。\n\n![Figure 6-9: Chase by Shiru](img/Figure_6-9.jpg)\n\n图 6-9:\
  \ Shiru 的 Chase\n\n最后，让我们尝试 Shiru 编写的 `Lan Master`：\n\n```\n% python3 -m NESEmulator\
  \ NESEmulator/Games/LanMaster.nes\n```\n\n这是一款益智游戏，如图 6-10 所示。\n\n![Figure 6-10:\
  \ Lan Master by Shiru](img/Figure_6-10.jpg)\n\n图 6-10: Shiru 的 Lan Master\n\n`Lan\
  \ Master` 在我们的模拟器上运行得良好，但另外两个不是。为什么呢？嗯，你可能注意到它们都运行得非常慢。例如，在我运行 `CPython` 3.13 的\
  \ M1 MacBook Air 上，它们的运行速度大约为 14 FPS。这只有真实 NES 速度四分之一。我们的模拟器正在正确地运行这些游戏，只是非常慢。\n\
  \n教训是什么？Python，特别是 Python 的主版本 `CPython`，非常慢。近年来，尽管一直在努力提高 `CPython` 的性能，但与大多数其他编程语言实现相比，它仍然非常慢，而且没有针对编写模拟器之类的底层程序进行开箱优化。要编写更高效的程序，你需要克服一些困难：你可以使用用底层语言实现的特定库、使用\
  \ `Cython`、编写 C 扩展，或者使用像 `PyPy` 这样的替代 Python 解释器。\n\n我将使用 `Cython` 之类的工具加速模拟器留给读者作为练习。我坚信，通过正确的解决方案，你可以让这个\
  \ NES 模拟器的速度达到真实 NES 的 60 FPS。\n\n### 现实世界的应用\n\n模拟器最常见的用途可能是运行已不再生产的系统的视频游戏，但长期以来，它们一直被用于计算机史上的关键节点。例如，当\
  \ Bill Gates 和 Paul Allen 在 1975 年通过为 `Altair 8800` 编写 `BASIC` 解释器来创立微软时（如第 2 章\
  \ 所示），他们实际上并没有 `Altair 8800` 可用。相反，他们在哈佛大学（Gates 上大学的地方）的一台微型计算机上([chapter6.xhtml#chapter6-8])\
  \ 为 `Altair` 的 `8080` 微处理器编写了一个模拟器。\n\nApple 三次切换了其 Macintosh 系列中使用的微处理器：从 `Motorola\
  \ 68K` 切换到 `Motorola/IBM PowerPC`，从 `PowerPC` 切换到 `Intel x86`，最后从 `Intel x86` 切换到苹果自己的基于\
  \ `ARM` Apple Silicon。这意味着 Apple 必须多次重新编译或重写他们的所有软件吗？从长期来看，是的，但在过渡期内，Apple 提供了模拟器。`PowerPC\
  \ Macs` 可以运行 `68K` 软件，`Intel Macs`（初期）可以运行 `PowerPC` 软件，而 `Apple Silicon Macs` 也可以运行\
  \ `Intel` 软件。Apple 是一个 amazing 模拟器开发者。事实上，`PowerPC Macs` 运行 `68K` 的速度比 `68K Macs`\
  \ 快。Apple Silicon 运行 Intel 软件有时也是如此。\n\n模拟器对于软件保护也很重要。当难以获取编写某软件的原始硬件时会发生什么？在这种情况下，模拟器可能是唯一的选择。在另一端，模拟器有时用于新平台的设计阶段。在平台存在之前，设计师可能会利用模拟器模拟它的样子，并帮助在真实环境中完善其功能。最后，编写模拟器极具教育意义。它是教授计算机底层原理的最佳方式之一，正如我希望在本章中发现的那样。\n\
  \n## 练习\n\n1. 尝试将我们的模拟器的性能提升到真实 NES 的水平——也就是说，60 FPS。你可能需要使用 `Cython`，或者通过扩展将 `Python`\
  \ 与 `C` 或 `Rust` 等底层语言结合。对于 `CPython` 3.13 和 2025 年时代的处理器，要让纯 `Python` 运行在 60 FPS\
  \ 几乎是不可能的。\n2. 使用 `https://nesdev.org`(https://nesdev.org) 的文档为我们的模拟器添加滚动支持。\n3.\
  \ 实现另一个 mapper。目前我们的模拟器只实现了最基础的 mapper `NROM`。另外两个流行的 mapper 是 `MMC1` 和 `UxROM`。\n\
  4. 现在是面临最大的挑战：尝试为我们的模拟器编写一个 `APU`，这样你就可以玩带声音的游戏了。\n\n### 笔记\n\n1. 1. David Sheff,\
