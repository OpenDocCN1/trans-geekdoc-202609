  本章将介绍 `k-最近邻 (KNN)`，这是一种极其简单的机器学习算法，在某些应用中非常有效。KNN 最早开发于 20 世纪 50 年代和 60 年代，既可以用于`分类`（决定某物属于哪一类），也可以用于`回归`（预测一个值）。对于对机器学习的复杂性感到畏惧的读者来说，KNN\
  \ 提供了一个易于上手且贴近现实的切入点。在本章中，我们将使用 KNN 以高精度的解决两个分类问题：区分不同类型的鱼和识别手写数字。然后，在第 8 章中，我们将\
  \ KNN 扩展到一些相关的回归问题。\n\n## 机器学习的兴起\n\n回到 20 世纪 50 年代，传统人工智能（AI）研究主要关注利用算法来模拟人类智能。然而，从\
  \ 20 世纪 90 年代开始，特别是随着 2000 年代 `GPU` 计算支持的神经网络出现后，AI 研究和产品化的很大重心已转向机器学习这一子领域。机器学习使用大型数据集来训练模型，这些模型不需要参考人类解决问题的方法就能做出决策。要理解这一转变，请想想两种象棋程序的区别：一种是基于大师们广为人知的启发式方法来评估局势，另一种是基于通过统计分析数百万局游戏后同化的自动调整权重来评估局势。事实上，机器学习在很大程度上基于统计学。\n\
  \n我们所熟悉的所有令人兴奋的机器学习应用，包括 `LLMs`、图像识别和数字助手，都是使用在 `GPUs` 或专用神经处理器上训练的复杂层神经网络构建的。这被称为`深度学习`。要从零编写一个深度学习框架，你需要对微积分和统计学都有深入的理解。即使你通过使用库来规避这些内容，你通常仍然需要巨大的数据集（这通常很难获得）以及强大的硬件。\n\
  \n由于这些障碍，对开始学习机器学习感兴趣的程序员有时会感到畏缩。他们担心数学会太难，或者他们缺乏开发自己感兴趣的应用所需的资源。此外，有些学习型程序员者喜欢从零开始构建项目；他们不想仅仅通过\
  \ `pip install` 来得到一个解决方案，却完全无法理解底层过程实际上是如何运作的。\n\n然而，正如你在本章中看到的，如果你不直接跳进深度学习的深水，机器学习可以有一个非常平易近手的起点。你可以从零开始编写\
  \ KNN 算法并用它来解决实际问题，而且不需要超出中学水平的数学背景就能理解你正在做什么。实现 KNN 所需要的统计概念是平均值（mean）的概念，你唯一需要的另一个公式是寻找两点之间欧几里距离的勾股定理。这并没有什么要求，对吧？\n\
  \n> 注意\n\n如果你想学习更多关于神经网络的知识，可以查看我之前的书籍《Classic Computer Science Problems in Python》（Manning,\
  \ 2019）中的第 7 章，“相当简单的神经网络”。\n\n## KNN 如何工作\n\nKNN 算法做出了一个简单的假设：数据点的邻居很可能是与它有最多共同点的其他数据点。例如，如果我正试图弄清一个患者患有哪种疾病，也许其他具有相同症状和相同生命体征的患者是最好的线索。顺便说，这就是为什么你可能不想找一个刚医毕业的医生。更有经验的医生可以使用“我以前见过类似的患者”这种显而易见的启发式方法为你提供更好的初始指导。\n\
  \n另一种表达方式是，距离未知值最近的数据点最可能告诉我们那个未知值是什么。也许你是一个汽车经销商，你想知道是否应该投入更多的营销资金，通过向她发送更多邮件来吸引一位潜在的回头客。该客户填写了一份客户满意度调查，对各个方面进行了评分。距离未知值最近的数据点最可能告诉我们那个未知值是什么。也许你是一个汽车经销商，你想知道是否应该投入更多的营销资金，通过向她发送更多邮件来吸引一位潜在的回头客。该客户填写了一份客户满意度调查，对各个方面进行了评分。\n\
  \n（注：由于提供的文本中存在重复段落，译文已根据“不要重复输出原文”的原则进行了去重处理，确保逻辑连贯。）\n\n\n\n\n“最近”通常使用欧几里得距离来确定。换句话说，如果我们在图\
  \ 7-1 中在未分类的点（圆点）与图上的所有其他数据点之间画直线，那么最短的线段就决定了邻居。然而，对于某些没有数值数据点的应用，可能适用像 `Hamming\
  \ distance`（计算差异）之类的方法。欧几里得距离以外的距离函数超出了本章的范围。\n\n投票通常意味着确定多数邻居属于哪一类。不过，即使你坚持对 `k`\
  \ 使用奇数，你仍然需要某种平局标准。这是因为许多应用具有两个以上的类别。例如，如果你有三个类别，且 `k` 设置为 5，会怎样？你可能会发现两个最近的邻居属于\
  \ A 类，两个属于 B 类，一个属于 C 类。那么，所讨论的数据点应该被归类为 A 还是 B 呢？\n\n确定 `k` 的正确值实际上非常简单。除非我们有特定的领域知识告诉我们其他，否则我们应该使用在测试中证明最准确的值。我们可以针对特定的数据集和测试点，使用几个不同的\
  \ `k` 值对 KNN 进行测试，看看哪个值最有用。\n\n这些都是使用 KNN 分类的基础。显然，在这个简单的大纲之外，还可以进行许多选择和增强，但你已经掌握了足够实现\
  \ KNN 的知识！\n\n### 使用 KNN 实现分类\n\n与算法本身一样，我们实现 KNN 的代码也将非常简单。但在实现算法之前，我们需要一个通用的类型来表示数据点。我们将创建一个\
  \ `DataPoint` 类，它是一个 `protocol`（协议），这意味着该类型本身不会有实例，只有其子类会有实例。它是一个抽象模板，概述了更具体的数据点类型必须具备的功能：\n\
  \n`KNN/knn.py`\n\n```\nfrom pathlib import Path\nimport csv\nfrom typing import\
  \ Protocol, Self\nfrom collections import Counter\nimport numpy as np\n\nclass DataPoint(Protocol):\n\
  \    kind: str\n\n    @classmethod\n    def from_string_data(cls, data: list[str])\
  \ -> Self: ...\n\n    def distance(self, other: Self) -> float: ...\n```\n\n我们的协议规定，数据点应该有一个\
  \ `kind` 属性（或者用分类的术语说就是 `class`），一个用于从 CSV（逗号分隔值）文件行转换为类实例的 `from_string_data()`\
  \ 方法，以及一个用于查找相同类型数据点之间距离的 `distance()` 方法。我们将为本章使用的两个具体数据集创建 `DataPoint` 子类。\n\n\
  我们的主 KNN 实现是通过一个意料之之中名为 `KNN` 的类的：\n\n```\nclass KNN[DP: DataPoint]:\n    def __init__(self,\
  \ data_point_type: type[DP], file_path: str | Path,\n                 has_header:\
  \ bool = True) -> None:\n        self.data_point_type = data_point_type\n      \
  \  self.data_points = []\n        self._read_csv(file_path, has_header)\n\n    #\
  \ 读取 CSV 文件并返回数据点列表\n    def _read_csv(self, file_path: str | Path, has_header:\
  \ bool) -> None:\n        with open(file_path, 'r') as f:\n            reader =\
  \ csv.reader(f)\n            if has_header:\n                next(reader)\n    \
  \        for row in reader:\n                self.data_points.append(self.data_point_type.from_string_data(row))\n\
  ```\n\n`KNN[DP: DataPoint]` 类型提示表示 `DP` 必须是一个 `DataPoint`。`_read_csv` 方法使用 `file_path`\
  \ 和 `has_header` 来处理文件。`from_string_data` 方法用于创建实例。`data_points` 列表存储结果。要找到最近的邻居，我们可以对点进行排序：\n\
  \n```python\n    def nearest(self, k: int, data_point: DP) -> list[DP]:\n      \
  \  return sorted(self.data_points, key=lambda p: p.distance(data_point))[:k]\n```\n\
  \n这是寻找邻居最高效的方法吗？不是，排序的时间是 `O(n log n)`，其中 `n` 是数据点的数量。如果数据集很大，这将成为瓶颈。为了改进这一点，我们可能需要比未排序列表更复杂的数据结构。有多种方法通过对数据集进行预计算或采样来限制搜索。再次，我们稍后会讨论细节。对点进行分类：\n\
  \n```python\n    def classify(self, k: int, data_point: DP) -> str:\n        neighbors\
  \ = self.nearest(k, data_point)\n        return Counter(neighbor.kind for neighbor\
  \ in neighbors).most_common(1)[0][0]\n```\n\n首先，我们找到邻居。然后，我们使用 Python 内置的 `Counter`\
  \ 集合找到邻居中最常见的类型。`most_common(1)` 调用返回 Counter 中最常见的项，而 `[0][0]` 表示从集合中检索该第一个项并获取其键。Counter\
  \ 内部将结构化为键值对，形式类似于 `(\"amphibian\", 3), (\"reptile\", 4), (\"mammal\", 1)`。在那个示例中，该行将找到值最大的键值对\
  \ `(\"reptile\", 4)`，并仅返回其键 `\"reptile\"`。我们在这里没有以系统的方法处理平局——我们只是听凭 `Counter` 的安排。再次，请记住本部分的标题。\n\
  \n### 分类鱼类\n\n假设你为一家为钓鱼爱好者制作鱼鱼设备的公司担任程序员。该设备由安装在杆末的摄像头组成，可以在船下方移动。它内置了图像识别功能，因此当鱼经过水下摄像头时，它可以自动拍照并识别照片中包含鱼的矩形。它还可以估计照片中鱼的尺寸。你的任务是在这个图像识别系统之上编写层软件，告诉钓鱼爱好者它是什么种鱼。毕竟，并不是所有的鱼都是合法捕捞的。\n\
  \n\n\n幸运的是，我们有一个公共领域的数据集可以帮助我们完成这项鱼类分类任务。它最初源于 Pekka Brofeldt 在 1917 年的一篇芬兰论文，英文名为《对危险湖泊鱼类资源知识的贡献》。它包含了来自某个湖泊的\
  \ 159 条鱼的尺寸和重量，并按物种分类（因此我们的程序可能只适用于那个湖泊）。[图 7-2] 显示了我们数据集中的鱼，仅使用了两个维度：高度和宽度。\n\n\
  ![图 7-2: 按物种分类并沿高度和宽度维度绘制的鱼](img/Figure_7-2.jpg)\n\n图 7-2: 按物种分类并沿高度和宽度维度绘制的鱼\n\n\
  正如你所预期的那样，从高度和宽的角度来看，相似物种的鱼往往聚集在一起。这表明 `KNN` 可能是解决该问题的有效算法的一个指标。\n\n让我们看看原始数据长什么样。这里是\
  \ `fish.csv` 前几行的示例：\n\n```\nSpecies,Weight,Length1,Length2,Length3,Height,Width\n\
  Bream,242,23.2,25.4,30,11.52,4.02\nBream,290,24,26.3,31.2,12.48,4.3056\nBream,340,23.9,26.5,31.1,12.3778,4.6961\n\
  Bream,363,26.3,29,33.5,12.73,4.4555\n```\n\n第一行是描述每列的表头。三个长度维度代表每条鱼从鼻子到各个不同身体部位的距离，单位是厘米，重量单位是克。关于高度和宽度的单位，来源存在一些歧义。然而，只要样本之间的单位是一致的，数据仍然有用，即使我们不知道它是厘米、某种百分比还是其他。\n\
  \n### Fish 类 (The Fish Class)\n\n为了实现我们的鱼类分类器，我们需要构建 `DataPoint` 的子类来表示鱼：\n\n```python\n\
  ### KNN/fish.py\nfrom dataclasses import dataclass\nfrom KNN.knn import DataPoint\n\
  from typing import Self\n\n@dataclass\nclass Fish(DataPoint):\n    kind: str\n \
  \   weight: float\n    length1: float\n    length2: float\n    length3: float\n\
  \    height: float\n    width: float\n\n    @classmethod\n    def from_string_data(cls,\
  \ data: list[str]) -> Self:\n        return cls(kind=data[0], weight=float(data[1]),\
  \ length1=float(data[2]),\n                   length2=float(data[3]), length3=float(data[4]),\n\
  \                   height=float(data[5]), width=float(data[6]))\n\n    def distance(self,\
  \ other: Self) -> float:\n        return ((self.length1 - other.length1) ** 2 +\n\
  \                (self.length2 - other.length2) ** 2 +\n                (self.length3\
  \ - other.length3) ** 2 +\n                (self.height - other.height) ** 2 +\n\
  \                (self.width - other.width) ** 2) ** 0.5\n```\n\n从技术上讲，为了满足 Python\
  \ 类型提示中的协议规范，我们不需要显式地让 `Fish` 成为 `DataPoint` 的子类。通过满足 `DataPoint` 协议的所有要求，`Fish`\
  \ 可以替代 `DataPoint` 而无需继承。尽管如此，我们仍将 `Fish` 为 `DataPoint` 的子类，因为这为读者提供了清晰度并有助于类型检查。CSV\
  \ 的每一行都由数据提供。\n\n\n\n\n```python\nfrom dataclasses import dataclass\nfrom KNN.knn\
  \ import DataPoint\nfrom typing import Self\nimport numpy as np\n\n@dataclass\n\
  class Digit(DataPoint):\n    kind: str\n    pixels: np.ndarray\n\n    @classmethod\n\
  \    def from_string_data(cls, data: list[str]) -> Self:\n        return cls(kind=data[64],\n\
  \                   pixels=np.array(data[:64], dtype=np.uint32))\n\n    def distance(self,\
  \ other: Self) -> float:\n        tmp = self.pixels - other.pixels\n        return\
  \ np.sqrt(np.dot(tmp.T, tmp))\n```\n\n我们将像素数据存储为 `NumPy` 数组。这非常方便，因为在下一章中，我们将使用\
  \ `Pygame` 来处理我们自己手写的数字涂鸦，而 `Pygame` 可以直接与 `NumPy` 数组交互。由于 `distance()` 方法是在 `NumPy`\
  \ 数组上进行计算，我们使用内置的 `NumPy` 函数来实现一种欧几里得距离。\n\n## 单元测试\n\n该数据集分为包含 3,823 个数字图像的训练集和包含\
  \ 1,797 个数字图像的测试集。我们将训练集作为我们的 `KNN` 实现预测的基础的数据集，并测试测试集中有多少个数字可以被正确识别。让我们在 `test_knn.py`\
  \ 中为此定义另一个测试用例，放在 Fish 测试用例之后，但在 `if __name__ == \"__main__\":` 行之前：\n\n`tests/test_knn.py`\n\
  \n```python\nclass DigitsTestCase(unittest.TestCase):\n    def setUp(self) -> None:\n\
  \        self.data_file = (Path(__file__).resolve().parent.parent\n            \
  \              / \"KNN\" / \"datasets\" / \"digits\" / \"digits.csv\")\n       \
  \ self.test_file = (Path(__file__).resolve().parent.parent\n                   \
  \       / \"KNN\" / \"datasets\" / \"digits\" / \"digits_test.csv\")\n\n    def\
  \ test_digits_test_set(self):\n        k: int = 1\n        digits_knn = KNN(Digit,\
  \ self.data_file, has_header=False)\n        test_data_points: list[Digit] = []\n\
  \        with open(self.test_file, 'r') as f:\n            reader = csv.reader(f)\n\
  \            for row in reader:\n                test_data_points.append(Digit.from_string_data(row))\n\
  \        correct_classifications = 0\n        for test_data_point in test_data_points:\n\
  \            predicted_digit: str = digits_knn.classify(k, test_data_point)\n  \
  \          if predicted_digit == test_data_point.kind:\n                correct_classifications\
  \ += 1\n        correct_percentage = (correct_classifications\n                \
  \              / len(test_data_points) * 100)\n        print(f\"Correct Classifications:\
  \ \"\n              f\"{correct_classifications} of {len(test_data_points)} \"\n\
  \              f\"or {correct_percentage}%\")\n        self.assertGreater(correct_percentage,\
  \ 97.0)\n```\n\n此测试将训练数据集（`digits.csv`）加载到 `KNN` 类的实例中。然后它打开测试集（`digits_test.csv`）并将\
  \ CSV 数据转换为点列表 `test_data_points`。接着，它尝试逐个对每个数据点进行分类，并记录正确的次数。最后，它报告该百分比，如果准确率低于\
  \ 97% 则失败。让我们运行所有测试来查看结果如何。结合鱼和 OCR 测试，这需要一些时间。在我的笔记本电脑上，分类这些 1,797 张数字图像大约需要 11\
  \ 秒：\n\n```\n% python3 -m tests.test_knn\nCorrect Classifications: 1761 out of 1797\
  \ or 97.9966108364%\n--------------------------------------\nRan 4 tests in 10.82s\n\
  ```\n\n从随附 OCR 的文档（见 `KNN/datasets/readme.txt` 底部），我们知道作者使用不同 `k` 值的 `KNN` 测试了数据集的准确性。他们发现当\
  \ `k` 设置为 1 时，准确率最高达到 98%。我们的分类器的测试输出与之匹配。这意味着它是有效的！\n\n## 现实世界应用\n\n`KNN` 在现实世界中广泛应用，涵盖了从光学识别到推荐系统，从文本分类到金融建模的方方面。它的简单性和广泛的适用性使其在机器学习中被通用教学。\n\
  \n然而，在实践中利用 `KNN` 时，必须克服本章已暗示的几个问题。第一个是找到正确的 `k` 值。这通常通过使用测试数据集进行交叉验证完成。使用过小的值可能导致`过拟合`，即模型过于接近某个特定的数据集。同时，过大的值可能导致`欠拟合`，即模型距离测试数据的引导太远。\n\
  \n下一个挑战是基础算法处理高维大型数据集时的性能影响。正如本章前面提到的，解决此问题的方法有两种：为存储数据集设计更好的数据结构，或者使用近似搜索。加速查找邻居速度最流行的结构之一是\
  \ `k-d tree`。然而，这是一个相当复杂的数据结构，只有在性能至关重要时才值得费脑筋。\n\n选择正确的距离函数也至关重要。`Euclidean distance`\
  \ 适用于许多应用，`Hamming distance` 适用于布尔维度，其他距离函数在文献中也有深入研究。距离函数取决于具体的应用；没有万能的。通常，你还需要对数据进行归一化以消除单位差异。我们在本章的鱼示例中没有进行归一化，而\
  \ OCR 示例的数据单位相同，因此不需要归一化。\n\n虽然我们看到从零实现 `KNN` 有难度，但许多流行的机器学习库都提供了高度优化的内置 `KNN` 函数。例如，`scikit-learn`\
  \ 的实现非常广泛。\n\n## 练习\n\n1. 寻找另一个感兴趣且我们的 `KNN` 实现可以准确分类的数据集。\n2. 尝试改进 `Digit` 类的 `distance()`\
  \ 方法来加速单元测试，同时保持 98% 的准确率。你可以自由放弃使用 `NumPy` 数组。你甚至可以放弃使用纯 `Euclidean distance` ？\n\
  3. 使用 `scikit-learn` 库重新实现我们的分类器。将我们的分类器性能与 `scikit-learn` 构建的 `KNN` 分类器进行比较。\n\n\
