  PIXEL_HEIGHT = 8\nP_TO_D = 16 / 255 # 像素到数字的缩放因子\nD_TO_P = 255 / 16 # 数字到像素的缩放因子\n\
  K = 9\nWHITE = (255, 255, 255)\n```\n\n`PIXEL_WIDTH` 和 `PIXEL_HEIGHT` 常数是单个图像的大小。`P_TO_D`\
  \ 常量在我们处理的像素表示的 255 种灰阶和源数据集中的 16 种灰阶之间进行转换；`D_TO_P` 是它的反数。我们将 KNN 将考虑的邻居数量 `K`\
