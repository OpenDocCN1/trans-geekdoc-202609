  \ program_data)\n        # 栈 - 在实际硬件中，这通常限制为\n        # 12 或 16 个跳转 PC 地址，但由于我们在现代硬件上，\n\
  \        # 我们的栈可以是无限的，并根据需要扩展/缩小\n        self.stack = []\n        # 屏幕缓冲区 - 64\
