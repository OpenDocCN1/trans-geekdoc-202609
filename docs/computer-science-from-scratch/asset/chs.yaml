  \n### 指说明\n\n接下来，我们需要声明所有让 6502 指令运行起来的方法。正如所讨论的，我们有 56 个独特的方法需要实现，按字母顺序从 `ADC`\
  \ 到 `TYA`，处理算术、控制流等任务。\n\n与 CHIP-8 项目一样，这里是一个适合你停下来的地方，在查看这里的实现之前，尝试自己动手编写一些方法。为了做到这一点，你需要一份良好的\
  \ 6502 指令参考资料。网上有很多此类资源，上述的 [`https://nesdev.org`](https://nesdev.org) 链接了其中几个。一份好的参考应该包含以下内容：\n\
  \n* 指令名称，包括其常用的助记符\n* 各种形式指令的操作码\n* 它支持的内存模式\n* 指令会影响哪些标志位（如果有的话）\n* 指令所需的周期数\n\
  * 它在哪些寄存器上进行操作\n* 一个功能示例\n\n如果你选择自己实现指令，首先会想查看 `CPU` 类的其余部分，看看可以使用哪些辅助方法。有修改堆栈、从内存读取以及写入内存的方法，还有其他几个实用方法。请参阅第\
  \ 170 页的内存访问” 和第 175 页的辅助方法”。\n\n你会发现许多指令都非常简单。例如，`AND` 正好是你预期的逻辑与与操作。我们获取累加器（`self.A`），对它与从内存中读取的任何内容进行按位与操作，然后将结果存回累加器：\n\
  \n```python\ndef AND(self, instruction: Instruction, data: int):\n    src = self.read_memory(data,\
  \ instruction.mode)\n    self.A = self.A & src\n    self.setZN(self.A)\n```\n\n\
  注意这里是如何抽象掉两个内容的。从内存读取是由另一个方法 `self.read_memory()` 完成的，并传入了指令的内存模式。我们稍后会回到该方法的实现。其次，许多不同的指令会影响标志位，因此我们有像\
  \ `self.setZN()` 这样的方法来处理标志位的变化。这就是经典的不要重复自己（DRY）原则。\n\n以下是所有需要的 56 个方法的实现。我们用 Python\
  \ 编写 6502 在硬件中将要的操作，这并不是什么高深的科学。Python 提供了完成大多数任务的运算符。对这类工作帮助最大的其他技能储备是对按位运算符的深刻理解，因为在某些地方指令明确要求使用这些运算符，或者我们需要截断结果以确保它仍然是\
  \ 8 位，以便适应寄存器。我们在附录中涵盖了这些按位运算符的工作原理。\n\n\n\n\n\n### 累加器加进位加内存数据\n```python\ndef\
  \ ADC(self, instruction: Instruction, data: int):\n    src = self.read_memory(data,\
  \ instruction.mode)\n    signed_result = src + self.A + self.C\n    self.V = bool(~(self.A\
  \ ^ src) & (self.A ^ signed_result) & 0x80)\n    self.A = (self.A + src + self.C)\
  \ % 256\n    self.C = signed_result > 0xFF\n    self.setZN(self.A)\n```\n\n### 累加器按位与\n\
  ```python\ndef AND(self, instruction: Instruction, data: int):\n    src = self.read_memory(data,\
  \ instruction.mode)\n    self.A = self.A & src\n    self.setZN(self.A)\n```\n\n\
  ### 算术左移\n```python\ndef ASL(self, instruction: Instruction, data: int):\n    src\
  \ = self.A if instruction.mode == MemMode.ACCUMULATOR else (\n        self.read_memory(data,\
  \ instruction.mode))\n    self.C = bool(src >> 7) # 进位置为第 7 位\n    src = (src <<\
  \ 1) & 0xFF\n    self.setZN(src)\n    if instruction.mode == MemMode.ACCUMULATOR:\n\
  \        self.A = src\n    else:\n        self.write_memory(data, instruction.mode,\
  \ src)\n```\n\n### 进位清除时跳转\n```python\ndef BCC(self, instruction: Instruction, data:\
  \ int):\n    if not self.C:\n        self.PC = self.address_for_mode(data, instruction.mode)\n\
  \        self.jumped = True\n```\n\n### 进位设置时跳转\n```python\ndef BCS(self, instruction:\
  \ Instruction, data: int):\n    if self.C:\n        self.PC = self.address_for_mode(data,\
  \ instruction.mode)\n        self.jumped = True\n```\n\n### 结果为零时跳转\n```python\n\
  def BEQ(self, instruction: Instruction, data: int):\n    if self.Z:\n        self.PC\
  \ = self.address_for_mode(data, instruction.mode)\n        self.jumped = True\n\
  ```\n\n### 累加器按位测试内存位\n```python\ndef BIT(self, instruction: Instruction, data:\
  \ int):\n    src = self.read_memory(data, instruction.mode)\n    self.V = bool((src\
  \ >> 6) & 1)\n    self.Z = ((src & self.A) == 0)\n    self.N = ((src >> 7) == 1)\n\
  ```\n\n### 结果为负时跳转\n```python\ndef BMI(self, instruction: Instruction, data: int):\n\
  \    if self.N:\n        self.PC = self.address_for_mode(data, instruction.mode)\n\
  \        self.jumped = True\n```\n\n### 结果为非零时跳转\n```python\ndef BNE(self, instruction:\
  \ Instruction, data: int):\n    if not self.Z:\n        self.PC = self.address_for_mode(data,\
  \ instruction.mode)\n        self.jumped = True\n```\n\n### 结果为正时跳转\n```python\n\
  def BPL(self, instruction: Instruction, data: int):\n    if not self.N:\n      \
  \  self.PC = self.address_for_mode(data, instruction.mode)\n        self.jumped\
  \ = True\n```\n\n### 强制中断\n```python\ndef BRK(self, instruction: Instruction, data:\
  \ int):\n    self.PC += 2\n    # 将 PC 压入栈\n    self.stack_push((self.PC >> 8) &\
  \ 0xFF)\n    self.stack_push(self.PC & 0xFF)\n    # 将状态推入栈\n    self.B = True\n\
  \    self.stack_push(self.status)\n    self.B = False\n    self.I = True\n    #\
  \ 将 PC 设置为重置向量\n    self.PC = (self.read_memory(IRQ_BRK_VECTOR, MemMode.ABSOLUTE))\
  \ | \\\n              (self.read_memory(IRQ_BRK_VECTOR + 1, MemMode.ABSOLUTE) <<\
  \ 8)\n    self.jumped = True\n```\n\n### 溢出清除时跳转\n```python\ndef BVC(self, instruction:\
  \ Instruction, data: int):\n    if not self.V:\n        self.PC = self.address_for_mode(data,\
  \ instruction.mode)\n        self.jumped = True\n```\n\n### 溢出设置时跳转\n```python\n\
  def BVS(self, instruction: Instruction, data: int):\n    if self.V:\n        self.PC\
  \ = self.address_for_mode(data, instruction.mode)\n        self.jumped = True\n\
  ```\n\n### 清除进位\n```python\ndef CLC(self, instruction: Instruction, data: int):\n\
  \    self.C = False\n```\n\n### 清除进制模式\n```python\ndef CLD(self, instruction: Instruction,\
  \ data: int):\n    self.D = False\n```\n\n### 清除中断\n```python\ndef CLI(self, instruction:\
  \ Instruction, data: int):\n    self.I = False\n```\n\n### 清除溢出\n```python\ndef\
  \ CLV(self, instruction: Instruction, data: int):\n    self.V = False\n```\n\n###\
  \ 比较累加器\n```python\ndef CMP(self, instruction: Instruction, data: int):\n    src\
  \ = self.read_memory(data, instruction.mode)\n    self.C = self.A >= src\n    self.setZN(self.A\
  \ - src)\n```\n\n### 比较 X 寄存器\n```python\ndef CPX(self, instruction: Instruction,\
  \ data: int):\n    src = self.read_memory(data, instruction.mode)\n    self.C =\
  \ self.X >= src\n    self.setZN(self.X - src)\n```\n\n### 比较 Y 寄存器\n```python\n\
  def CPY(self, instruction: Instruction, data: int):\n    src = self.read_memory(data,\
  \ instruction.mode)\n    self.C = self.Y >= src\n    self.setZN(self.Y - src)\n\
  ```\n\n### 递减内存\n```python\ndef DEC(self, instruction: Instruction, data: int):\n\
  \    src = self.read_memory(data, instruction.mode)\n    src = (src - 1) & 0xFF\n\
  \    self.write_memory(data, instruction.mode, src)\n    self.setZN(src)\n```\n\n\
  ### 递减 X 寄存器\n```python\ndef DEX(self, instruction: Instruction, data: int):\n \
  \   self.X = (self.X - 1) & 0xFF\n    self.setZN(self.X)\n```\n\n### 递减 Y 寄存器\n\
  ```python\ndef DEY(self, instruction: Instruction, data: int):\n    self.Y = (self.Y\
  \ - 1) & 0xFF\n    self.setZN(self.Y)\n```\n\n### 累加器异或\n```python\ndef EOR(self,\
  \ instruction: Instruction, data: int):\n    self.A ^= self.read_memory(data, instruction.mode)\n\
  \    self.setZN(self.A)\n```\n\n### 增内存\n```python\ndef INC(self, instruction: Instruction,\
  \ data: int):\n    src = self.read_memory(data, instruction.mode)\n    src = (src\
  \ + 1) & 0xFF\n    self.write_memory(data, instruction.mode, src)\n    self.setZN(src)\n\
  ```\n\n### 增 X 寄存器\n```python\ndef INX(self, instruction: Instruction, data: int):\n\
  \    self.X = (self.X + 1) & 0xFF\n    self.setZN(self.X)\n```\n\n### 增 Y 寄存器\n\
  ```python\ndef INY(self, instruction: Instruction, data: int):\n    self.Y = (self.Y\
  \ + 1) & 0xFF\n    self.setZN(self.Y)\n```\n\n### 跳转\n```python\ndef JMP(self, instruction:\
  \ Instruction, data: int):\n    self.PC = self.address_for_mode(data, instruction.mode)\n\
  ```\n\n### 跳转到子程序\n```python\ndef JSR(self, instruction: Instruction, data: int):\n\
  \    self.PC += 2\n    # 将 PC 压入栈\n    self.stack_push((self.PC >> 8) & 0xFF)\n\
  \    self.stack_push(self.PC & 0xFF)\n    # 跳转到子程序\n    self.PC = self.address_for_mode(data,\
  \ instruction.mode)\n    self.jumped = True\n```\n\n### 内存加载到累加器\n```python\ndef\
  \ LDA(self, instruction: Instruction, data: int):\n    self.A = self.read_memory(data,\
  \ instruction.mode)\n    self.setZN(self.A)\n```\n\n### 内存加载到 X 寄存器\n```python\n\
  def LDX(self, instruction: Instruction, data: int):\n    self.X = self.read_memory(data,\
  \ instruction.mode)\n    self.setZN(self.X)\n```\n\n### 内存加载到 Y 寄存器\n```python\n\
  def LDY(self, instruction: Instruction, data: int):\n    self.Y = self.read_memory(data,\
  \ instruction.mode)\n    self.setZN(self.Y)\n```\n\n### 逻辑右移\n```python\ndef LSR(self,\
  \ instruction: Instruction, data: int):\n    src = self.A if instruction.mode ==\
  \ MemMode.ACCUMULATOR else (\n        self.read_memory(data, instruction.mode))\n\
  \    self.C = bool(src & 1) # 进位置为第 0 位\n    src >>= 1\n    self.setZN(src)\n  \
  \  if instruction.mode == MemMode.ACCUMULATOR:\n        self.A = src\n    else:\n\
  \        self.write_memory(data, instruction.mode, src)\n```\n\n### 无操作\n```python\n\
  def NOP(self, instruction: Instruction, data: int):\n    pass\n```\n\n# 内存与累加器或\n\
  ```python\ndef ORA(self, instruction: Instruction, data: int):\n    self.A |= self.read_memory(data,\
  \ instruction.mode)\n    self.setZN(self.A)\n```\n\n# 累加累推入栈\n```python\ndef PHA(self,\
  \ instruction: Instruction, data: int):\n    self.stack_push(self.A)\n```\n\n###\
  \ 状态推入栈\n```python\ndef PHP(self, instruction: Instruction, data: int):\n    self.B\
  \ = True\n    self.stack_push(self.status)\n    self.B = False\n```\n\n# 累加器从栈弹出\n\
  ```python\ndef PLA(self, instruction: Instruction, data: int):\n    self.A = self.stack_pop()\n\
  \    self.setZN(self.A)\n```\n\n# 状态从栈弹出\n```python\ndef PLP(self, instruction:\
  \ Instruction, data: int):\n    self.stack_pop()\n```\n\n### 左循环位\n```python\ndef\
  \ ROL(self, instruction: Instruction, data: int):\n    src = self.A if instruction.mode\
  \ == MemMode.ACCUMULATOR else (\n        self.read_memory(data, instruction.mode))\n\
  \    old_c = self.C\n    self.C = bool(src >> 7) # 进位置为第 7 位\n    src = (src <<\
  \ 1) & 0xFF\n    if old_c:\n        src |= 0x01\n    self.setZN(src)\n    if instruction.mode\
  \ == MemMode.ACCUMULATOR:\n        self.A = src\n    else:\n        self.write_memory(data,\
  \ instruction.mode, src)\n```\n\n### 右循环位\n```python\ndef ROR(self, instruction:\
  \ Instruction, data: int):\n    src = self.A if instruction.mode == MemMode.ACCUMULATOR\
  \ else (\n        self.read_memory(data, instruction.mode))\n    old_c = self.C\n\
  \    self.C = bool(src & 1) # 进位置为第 0 位\n    src = (src >> 1) & 0xFF\n    if old_c:\n\
  \        src |= 0x80\n    self.setZN(src)\n    if instruction.mode == MemMode.ACCUMULATOR:\n\
  \        self.A = src\n    else:\n        self.write_memory(data, instruction.mode,\
  \ src)\n```\n\n# 减法加进位\n```python\ndef SBC(self, instruction: Instruction, data:\
  \ int):\n    src = self.read_memory(data, instruction.mode)\n    signed_result =\
  \ src - self.A - self.C\n    self.V = bool(~(self.A ^ src) & (self.A ^ signed_result)\
  \ & 0x80)\n    self.A = (self.A + src + self.C) % 256\n    self.C = signed_result\
  \ > 0xFF\n    self.setZN(self.A)\n```\n\n\n\n\n\n虽然大多数指令都非常简单，但我发现带进位的加（`ADC`）和带进位的减（`SBC`）有点棘手。6502\
  \ 的主寄存器只有 8 位，因此进位会发生频繁，并且你需要正确处理标志位。但我们有一个技巧：Python 的 `int` 类型并不局限于 8 位。因此，我们可以像处理普通的\
  \ `int` 值一样进行算术运算，然后对任何超过 255 的部分取模即可。\n\n### step() 方法\n\n在完成所有指令的实现后，我们就可以逐步执行实际\
  \ 6502 机器码了。`step()` 方法读取 `PC` 处的下一个操作码，并从跳转表中提取指令。以下是方法的开头：\n\n```python\ndef step(self):\n\
  \    if self.stall > 0:\n        self.stall -= 1\n        self.cpu_ticks += 1\n\
  \        return\n\n    opcode = self.read_memory(self.PC, MemMode.ABSOLUTE)\n  \
  \  self.page_crossed = False\n    self.jumped = False\n    instruction = self.instructions[opcode]\n\
  \    data = 0\n    for i in range(1, instruction.length):\n        data |= (self.read_memory(self.PC\
  \ + i,\n                              MemMode.ABSOLUTE) << ((i - 1) * 8))\n```\n\
  \n大多数 6502 指令还带有一些数据，字节数可能有所不同。例如，`TAY` 指令（将 `A` 传输到 `Y`）不需要数据，所以只占 1 字节；但任何从内存读取的指令都需要额外的数据来指定内存地址。读取的数据量由\
  \ `instruction.length` 决定。\n\n`step()` 方法继续如下：\n\n```python\n    instruction.method(instruction,\
  \ data)\n\n    if not self.jumped:\n        self.PC += instruction.length\n    elif\
  \ instruction.type in {InstructionType.BCC, InstructionType.BCS,\n             \
  \                 InstructionType.BEQ, InstructionType.BMI,\n                  \
  \            InstructionType.BNE, InstructionType.BPL,\n                       \
  \       InstructionType.BVC, InstructionType.BVS}:\n        # 分支指令如果成功，则额外 +1 个\
  \ tick\n        self.cpu_ticks += 1\n        self.cpu_ticks += instruction.ticks\n\
  \        if self.page_crossed:\n            self.cpu_ticks += instruction.page_ticks\n\
  ```\n\n我们调用指令的实际方法来执行指令，然后根据需要增加程序计数器。最后我们完成关于 tick（CPU 周期）的一些计数记录工作。\n\n### 内存访问\n\
  \n接下来我们要写的几个方法将帮助读写内存。内存访问是 6502 复杂的领域之一，因为它有十多种不同的内存访问模式。`address_for_mode()` 方法负责根据指令的模式（`MemMode`）将指令关联的数据转换为特定的内存地址：\n\
  \n```python\ndef address_for_mode(self, data: int, mode: MemMode) -> int:\n    def\
  \ different_pages(address1: int, address2: int) -> bool:\n        return (address1\
  \ & 0xFF00) != (address2 & 0xFF00)\n\n    address = 0\n    match mode:\n       \
  \ case MemMode.ABSOLUTE:\n            address = data\n        case MemMode.ABSOLUTE_X:\n\
  \            address = (data + self.X) & 0xFFFF\n            self.page_crossed =\
  \ different_pages(address, address - self.X)\n        case MemMode.ABSOLUTE_Y:\n\
  \            address = (data + self.Y) & 0xFFFF\n            self.page_crossed =\
  \ different_pages(address, address - self.Y)\n        case MemMode.INDEXED_INDIRECT:\n\
  \            # 下面两行处理零页绕回 0xFF\n            ls = self.ram[(data + self.X) & 0xFF]\n\
  \            ms = self.ram[(data + self.X + 1) & 0xFF]\n            address = (ms\
  \ << 8) | ls\n        case MemMode.INDIRECT:\n            ls = self.ram[data]\n\
  \            ms = self.ram[data + 1]\n            if (data & 0xFF) == 0xFF:\n  \
  \              ms = self.ram[data & 0xFF00]\n            address = (ms << 8) | ls\n\
  \        case MemMode.INDIRECT_INDEXED:\n            # 下面两行处理零页绕回 0xFF\n       \
  \     ls = self.ram[data & 0xFF]\n            ms = self.ram[(data + 1) & 0xFF]\n\
  \            address = (ms << 8) | ls\n            address = (address + self.Y)\
  \ & 0xFFFF\n            self.page_crossed = different_pages(address, address - self.Y)\n\
  \        case MemMode.RELATIVE:\n            address = (self.PC + 2 + data) & 0xFFFF\
  \ if (data < 0x80) \\\n                else (self.PC + 2 + (data - 256)) & 0xFFFF\
  \ # 有符号数\n        case MemMode.ZEROPAGE:\n            address = data\n        case\
  \ MemMode.ZEROPAGE_X:\n            address = (data + self.X) & 0xFF\n        case\
  \ MemMode.ZEROPAGE_Y:\n            address = (data + self.Y) & 0xFF\n    return\
  \ address\n```\n\n\n\n\n\n表 6-4 显示了我们的模拟器所看到的 NES CPU 内存映射。它包含了区域和单个内存映射地址。我们的模拟器忽略或未实现的区域和地址将不会显示。该表还指示了某个区域或地址是可读、可写还是两者兼有。最后，它还提到了是否存在镜像（mirroring）。\n\
  \n在表 6-4 中缺失了许多地址和细节。例如，我们的简单模拟器没有 APU，但真实的 NES 在 `0x4000` 范围内具有用于 APU 和其他 I/O 设备（如第二个手柄）的内存映射地址。我们也没有指明\
  \ `0x2000` 到 `0x2007` 之间的单个 PPU 寄存器，我们将在实现 PPU 时再回到这些地方。卡带内存空间可能会根据映射器（mapper）而有很大差异。这超出了本节的范围；我们已经在第\
  \ 148 页的“模拟卡带”中讨论了卡带内存的一些具体细节。最后，CPU 寥量的 2KB RAM 实际上有两个重要的子区域：已经讨论过的从 `0x0000` 到\
  \ `0x00FF` 的快速零页区域，以及通常用于堆栈的 `0x0100` 到 `0x01FF` 空间。\n\n### 表 6-4: 简化的 NES 内存映射\n\
  \n| 地址或区域 | 长度 | 描述 | 读/写 | 镜像？ |\n| --- | --- | --- | --- | --- |\n| `0x0000–0x1FFF`\
  \ | `0x800` | 主 2KB CPU 内存 | RW | 是，前 `0x800` 镜像到 `0x2000` |\n| `0x2000–0x3FFF`\
  \ | `0x8` | 8 个 PPU 寄存器 | 视异 | `0x2000` 到 `0x2007` 每 8 字节镜像一次 |\n| `0x4014` | `0x1`\
  \ | 精灵数据的 DMA 传输 | W |  |\n| `0x4016` | `0x1` | 手柄 1 状态 | RW |否 |\n| `0x6000–xFFFF`\
  \ | 随卡带而异 | 卡带内存 | 视异 | 视异 |\n\n现在我们已经对内存如何划分有了若干了解，可以查看读写内存的方法了。我们将从 `read_memory()`\
  \ 方法开始。它接收一个读取位置和一个内存模式，并从该位置返回一个字节（在 Python 中表示为 int）：\n\n```python\ndef read_memory(self,\
  \ location: int, mode: MemMode) -> int:\n    if mode == MemMode.IMMEDIATE:\n   \
  \     return location # 在这种情况下 location 实际上数据\n    address = self.address_for_mode(location,\
  \ mode)\n\n    # 内存映射位于 https://wiki.nesdev.org/w/index.php/CPU_memory_map\n   \
  \ if address < 0x2000: # 主 RAM 2KB 直到 0x800\n        return self.ram[address % 0x800]\
  \ # 为后续 6KB 镜像\n    elif address < 0x4000: # 2000-2007 是 PPU，每 8 字节镜像一次\n      \
  \  temp = ((address % 8) | 0x2000) # 从 PPU 寄存器获取数据\n        return self.ppu.read_register(temp)\n\
  \    elif address == 0x4016: # 手柄 1 状态\n        if self.joypad1.strobe:\n      \
  \      return self.joypad1.a\n        self.joypad1.read_count += 1\n        match\
  \ self.joypad1.read_count:\n            case 1:\n                return 0x40 | self.joypad1.a\n\
  \            case 2:\n                return 0x40 | self.joypad1.b\n           \
  \ case 3:\n                return 0x40 | self.joypad1.select\n            case 4:\n\
  \                return 0x40 | self.joypad1.start\n            case 5:\n       \
  \         return 0x40 | self.joypad1.up\n            case 6:\n                return\
  \ 0x40 | self.joypad1.down\n            case 7:\n                return 0x40 | self.joypad1.left\n\
  \            case 8:\n                return 0x40 | self.joypad1.right\n       \
  \     case _:\n                return 0x41\n    elif address < 0x6000:\n       \
  \ return 0 # 未实现的其他类型 IO\n    else: # 0x6000 到 0xFFFF 的地址来自卡带\n        return self.rom.read_cartridge(address)\n\
  ```\n\n如果内存模式为 `IMMEDIATE`，这意味着与指令关联的实际数据就是所谓的“读取”内容。请记住，我们的代码已经抽象到了这种程度，使得单个指令的方法应该适用于任何内存模式。在\
  \ `IMMEDIATE` 模式的情况下，我们不需要进行任何实际查找，因此只需返回与指令关联的数据。（`location` 这个名字有点奇怪）。在获取状态后，让我们看看写入内存：\n\
  \n```python\ndef write_memory(self, location: int, mode: MemMode, value: int):\n\
  \    if mode == MemMode.IMMEDIATE:\n        # 与指令关联的状态\n        return\n\n    address\
  \ = self.address_for_mode(location, mode)\n\n    # 内存映射位于 https://wiki.nesdev.org/w/index.php/CPU_memory_map\n\
  \    if address < 0x2000: # 主 RAM 2KB 直到 0x800\n        self.ram[address % 0x800]\
  \ = value # 为后续 6KB 镜像\n    elif address < 0x4000: # 2000-2007 是 PPU，每 8 字节镜像一次\n\
  \        temp = ((address % 8) | 0x2000) # 从 PPU 寄存器\n        self.ppu.write_register(temp,\
  \ value)\n    elif address == 0x4016: # 手柄 1\n        if not self.joypad1.strobe:\n\
  \            self.joypad1.read_count += 1\n            if self.joypad1.read_count\
  \ > 8:\n                self.joypad1.read_count = 1\n    elif address < 0x6000:\n\
  \        pass # 未实现的其他类型 IO\n    else: # 0x6000 到 0xFFFF 的地址来自卡带\n        self.rom.write_cartridge(address,\
  \ value)\n```\n\n\n\n\n\n```python\n@property\ndef status(self) -> int:\n    return\
  \ (self.C | self.Z << 1 | self.I << 2 | self.D << 3 |\n            self.B << 4 |\
  \ 1 << 5 | self.V << 6 | self.N << 7)\n\ndef set_status(self, temp: int):\n    self.C\
  \ = bool(temp & 0b00000001)\n    self.Z = bool(temp & 0b00000010)\n    self.I =\
  \ bool(temp & 0b00000100)\n    self.D = bool(temp & 0b00001000)\n    # https://nesdev.org/the%20’B’%20flag%20&%20BRK%20instruction.txt\n\
  \    self.B = False\n    self.V = bool(temp & 0b01000000)\n    self.N = bool(temp\
  \ & 0b10000000)\n```\n\n最后，我们有一个方法来处理 NMI 触发时的逻辑，以及一个用于调试的 `log()` 方法：\n\n```python\n\
  def trigger_NMI(self):\n    self.stack_push((self.PC >> 8) & 0xFF)\n    self.stack_push(self.PC\
  \ & 0xFF)\n    # https://nesdev.org/the%20’B’%20flag%20&%20BRK%20instruction.txt\n\
  \    self.B = True\n    self.stack_push(self.status)\n    self.B = False\n    self.I\
  \ = True\n    # 将 PC 指向 NMI \n    self.PC = (self.read_memory(NMI_VECTOR, MemMode.ABSOLUTE))\
  \ | \\\n              (self.read_memory(NMI_VECTOR + 1, MemMode.ABSOLUTE) << 8)\n\
  \ndef log(self) -> str:\n    opcode = self.read_memory(self.PC, MemMode.ABSOLUTE)\n\
  \    instruction = self.instructions[opcode]\n    data1 = \" \" if instruction.length\
  \ < 2 else f\"{self.read_memory(self.PC + 1,\n                                 \
  \                                   MemMode.ABSOLUTE):02X}\"\n    data2 = \" \"\
  \ if instruction.length < 3 else f\"{self.read_memory(self.PC + 2,\n           \
  \                                                         MemMode.ABSOLUTE):02X}\"\
  \n    return f\"{self.PC:04X} {opcode:02X} {data1} {data2} {instruction.type.name}{29\
  \ * ' '}\" \\\n           f\"A:{self.A:02X} X:{self.X:02X} Y:{self.Y:02X} P:{self.status:02X}\
  \ SP:{self.SP:02X}\"\n```\n\nNMI 会将执行发送到 `NMI_VECTOR` 指定地址的代码块。当 NMI 触发时，类似于 `BRK`\
  \ 和 `JSR` 指令，我们需要放置一个书签，以便在 NMI 将我们带离之前回到原来的。这就是将 `PC` 和 `status` 推入栈的目的。\n\n实现\
  \ CPU 涉及到根据一份规范编写大量代码——这份规范虽然长，但由许多较小且相对容易消化的片段组成。我们需要实现的模拟器最后一部分是 PPU，它的感觉会非常不同。仍然有一个包含大量细节的规范，但这些细节组合在一起本质上只做两件大事：绘制背景瓦块和绘制精灵（sprites）。\n\
  \n### 理解 PPU\n\n实现 PPU 是 NES 模拟项目中最复杂的部分。PPU 负责在屏幕上绘制图形。对于我们这个简单的模拟器，我们可以将图形设为两个方面：背景和精灵。\n\
  \n背景是图形的后层层，其中的单个部分通常完全不动，或者只作为一个整体一起滚动。NES 硬件使用 `tiles`（瓦块）来绘制背景。例如，在平台跳跃游戏中，一个瓦块可能是平台的一部分、艺术背景的一部分（也许是山）、梯子或门。这些元素通常不能独立移动。\n\
  \n相比之下，`sprites`（精灵）是可以在屏幕上独立移动的单个游戏对象。想想平台游戏中的玩家和敌人。NES 有专门的硬件来同时处理屏幕上多达 64 个 8×8\
  \ 或 8×16（像素）的精灵。\n\n实现 PPU 有许多不同的方法。最准确的是模拟真实 PPU 的工作方式：一次生成屏幕的每一个像素。如果这种实现做得得当，任何为\
  \ NES 编写的游戏都应该能够正常运行。这种方法的性能消耗也最高。另一种流行的替代方案是每次实现一个扫描行（scanline）的图形。不是对每个像素进行更新，而是在每行扫描行处理完成后进行更新。\n\
  \n我们不会采用这两种方法之一。正如之前讨论的，我们将使用更简单的方法——即一次一帧地更新整个屏幕来实现 PPU。这是准确性最低的技术，因为如果游戏在像素之间或扫描行之间更改了图形，这些更新将不会显示。兼容性仍然会很好，但不会扩展到所有游戏。\n\
  \n### CHR ROM\n\n背景和精灵的数据最初位于卡带中一个被称为 `CHR ROM` 的区域。早期的游戏通常有 8KB 的 `CHR ROM`，但带有映射器（mappers）的后期游戏可能有几百\
  \ KB。某些游戏用 `CHR RAM` 替换了 `CHR ROM`，后者在游戏运行期间是可以修改的。然而，大多数游戏拥有固定的 `CHR ROM`。如果游戏带有\
  \ `CHR RAM`，则游戏必须将图形加载到 PRG ROM 中。\n\n### 模式表与瓦块\n\n在任何时刻，PPU 都可以“连接”到 `CHR ROM`\
  \ 的两个 4KB 部分之一。这些部分被称为 `pattern tables`（模式表）。NES 从选定的模式表中提取给定帧的所有图形数据。请注意，某些文档将整个\
  \ 8KB 的可寻址 `CHR ROM` 视为单个模式表，而不是将每个 4KB 区域称为模式表。\n\n每个模式表被分为 256 个 16 字节的瓦块，每个瓦块定义了屏幕\
  \ 8×8 像素区域的潜在图形。模式表中的预定义瓦块共同代表了游戏中可能看到的所有不同内容。例如，图 6-1](#chapter6.xhtml#fig6-1)\
  \ 显示了 Aleff Correa 的开源游戏 *BrickBreaker* 的模式表，我们将在本章的后半部分在模拟器中运行它。\n\n\n\n\n如所述，模式表（pattern\
  \ table）中的每个磁块（tile）均为 16 字节。16 字节定义了 8 × 8 = 64 个像素，这意味着每个像素仅剩 2 位，而 2 位只能表示四种不同的值（00,\
  \ 01, 10, 11）。因此，PPU 在给磁块内仅支持四种颜色。事实上，这些颜色中有一种始终是预设的背景色或透明色（00），因此特定磁块中本质上只有三种程序员选择的颜色。这种调色板一次针对四个磁块的区域进行设置，并由内存中与模式表本身不同的独立部分进行控制。这就是为什么所有磁块在图\
  \ 6-1 中都显示为灰度；每个磁块的调色板并不是由模式表决定的。我们稍后会回到如何选择颜色。\n\n遗憾的是，磁块变得稍微复杂了一些：定义每个像素的 2 位值并不是顺序排列的。相反，每个像素的第\
  \ 0 位排列在磁块的前 8 字节中，而每个像素的第 1 位则排列在磁块的后 8 字节中。每 8 字节形成一个`位平面`（bit plane），这两个平面每次两个位结合，以确定每个像素的颜色。\n\
  \n让我换一种方式表述：磁块的前 8 字节（第一个位平面）可以认为是 8×8 磁块中 64 个像素颜色值的 64 半部分。它们是顺序排列的。第二个 8 字节位平面定义了相同\
  \ 64 个像素颜色值的另外 64 半部分。它们也是顺序排列的。需要组合这两个平面来获得 64 个最终的颜色值。例如，考虑以下 16 字节的磁块数据：^(6)\n\
  \n```\n   Bit Plane 1\nByte 1  01000001\nByte 2  11000010\nByte 3  01000100\nByte\
  \ 4  01001000     Pixel Pattern\nByte 5  00010000\nByte 6  00100000\nByte 7  01000000\n\
  Byte 8  10000000 ===== 01000300\n   Bit Plane 2         0100300\nByte 9  00000001\
  \ ===== 0003020\nByte 10 00000010       0030002\nByte 11 00000100       0300020\n\
  Byte 12 00001000       3000022\nByte 13 00010110\nByte 14 00100001\nByte 15 01000010\n\
  Byte 16 10000111\n```\n\n两个位平面中的匹配位结合在一起，形成列表所示和图 6-2 中所示的像素图案：一个分数 1/2 的图像。\n\n\
  ![图 6-2: 磁块如何从两个位平面组合而成](img/Figure_6-2.jpg)\n\n图 6-2: 磁块如何从两个位平面组合而成\n\n当第一个位平面为\
  \ 1 而第二个位平面为 0 时，这些位组合形成 01，即颜色方案中的颜色 1。同样，第一个位平面的 0 和第二个位平面的 1 形成 10，即颜色 2，而两个位平面均为\
  \ 1 则产生 11，即颜色 3。\n\n### 命名表 (Nametables)\n\n命名表是布局屏幕实际磁块的地方。屏幕背景看起来是什么样子的？它由哪些磁块组成，每个磁块使用了哪些颜色？这就是命名表及其随附属性表（attribute\
  \ table）的工作。每个命名表代表游戏的一个屏幕，宽度为 32 个磁块，高度为 30 个磁块。命名表中的每个磁块由单个字节指定——该磁块在模式表中的索引。通过这种方式，模式表磁块被直接映射到命名表中，因此你可以将命名表看作模式表中磁块的一种特定排序。\n\
  \n命名表有多大？嗯，32 × 30 = 960，所以命名表中有 960 个位置。表中的每个位置由一个 1 字节的索引占用，因此命名表为 960 字节。\n\n\
  现在我们有足够的信息来理解为什么 NES 具有 256×240 的分辨率。每个磁块宽 8 像素，高 8 像素。如果命名表代表屏幕背景且宽度为 32 个磁块，那么可以推导出\
  \ 8 × 32 = 256。屏幕的像素高度则通过 8 × 30 = 240 得到。\n\nPPU 只有 2KB 内存，仅足够容两个命名表（以及它们的属性表）。这两个命名表可以进行镜像（mirrored），因此总共有四个逻辑命名表。图\
  \ 6-3 显示了用于磁块的命名表数据。\n\n![图 6-3: Breakaker 屏幕的命名表](img/Figure_6-3.jpg)\n\n图 6-3:\
  \ Breakaker 屏幕的命名表\n\n当第一个位平面为 1 而第二个位平面为 0 时，这些位组合形成 01，即颜色方案中的颜色 1。同样，第一个位平面的\
  \ 0 和第二个位平面的 1 形成 10，即颜色 2，而两个位平面均为 1 则产生 11，即颜色 3。\n\n### 调色板与属性表 (Color Palettes\
  \ and Attribute Tables)\n\nPPU 具有四种不同的背景调色板内存。从“模式表与磁块](#chapter6.xhtml#sec17)第\
  \ 178 页可知，每个磁块由四种颜色中的一种像素组成，其中一种是背景色或透明色。这意味着特定磁块中实际上只有三种颜色。PPU 调色板内存中的每种调色板因此定义了一组颜色。（我们将在下一节进一步讨论面板内存。）\n\
  \n为了指定哪种调色板适用于哪个磁块，每个命名表后面跟着一个属性表。属性表为 8×8，其每个条目仅为 1 字节。为什么有 960 个磁块却只有 64 个 1 字节的属性表条目？每个条目实际上为\
  \ 2×2 的区域定义颜色，而这些区域区域代表 2×2 的磁块网格。因此，属性表中的每个 1 字节条目实际上覆盖了 16 个磁块。这是如何工作的？\n\n该 1\
  \ 字节条目中的每 2 位对应一个区域，2 位可以表示多多四个值。每个 2 位值都是四种不同背景调色板之间的选择器。因此，屏幕上的每个 2×2 磁块区域可以使用四种背景调色板中的一种。这意味着每个区域内的四个磁块必须使用相同的颜色（以及背景色/透明）。\n\
  \n这并非易事。为 NES 图形创作的艺术家必须使用非背景颜色绘制屏幕上的显著区域（四磁块区域）。\n\n图 6-4、6-5 和 6-6 为 `https://nesdev.org`\
  \ (https://nesdev.org) 创建，展示了属性表的实际应用。（如果你通过纸质版读本书，请查看辅助仓库的图片目录。）首先，图 6-4 显示了一个游戏（由\
  \ Damian Yerrick 创作的 `Thwaite`）的背景被分为属性表选择颜色的区域。\n\n\n\nPPU 的调色板内存可以容四个背景调色板和四个精灵调色板。正如我们讨论过的，一个调色板由三种颜色（加上背景/透明色）组成。它可以用于绘制屏幕上四个瓷格的背景区域（见前节关于属性表的章节）或绘制精灵。换句话说，背景的每个四瓷格区域可以使用四个调色板中的一种进行上色，每个精灵可以使用四个调色板中的一种进行上色。\n\
  \n调色板使用 3 个字节定义。每个字节指定调色板中三种颜色之一，尽管每个字节仅有 6 位实际上被用于选择颜色。由于 6 位可以从 64 个值中进行选择，这告诉我们\
  \ NES 艺术家只有 64 种颜色可用。在实践中，这 64 种可能的颜色中有 10 种本质上是黑色，因此 NES 实际上只有 54 种颜色。图 6-7 显示了\
  \ NTSC NES 的这些颜色。PAL NES 机器的颜色略有不同。（不同国家使用不同的视频标准——例如北美使用 NTSC，而欧洲大部分和亚洲使用 PAL——这会影响\
  \ NES PPU 的运行方式。）\n\n![Figure 6-7：NTSC NES 可用的颜色](img/Figure_6-7.jpg)\n\n图 6-7：NTSC\
  \ NES 可用的颜色\n\n例如，假设你的背景区域使用背景调色板 1 绘制，而背景调色板 1 指定了颜色 `0x11`、`0x0A` 和 `0x3D`。这意味着你可以使用蓝色、绿色、灰色的色调以及背景色来绘制该区域。\n\
  \n### 对象属性内存 (OAM)\n\nOAM 存储关于屏幕上精灵的信息。精灵本质上是游戏中的移动物体——例如玩家、敌人和投射物。NES 一时支持 64 个精灵，并使用\
  \ 4 个字节描述每一个精灵，因此 OAM 有 256 个字节。\n\n精灵的图像来自卡带上与背景瓷格相同的 CHR ROM——即模式表。然而，与背景不同，精灵并不限于瓷格位置；它们可以绘制在屏幕上的任何位置。每个精灵还可以进行水平或垂直翻转，放置在背景之前或之后，并使用四个调色板中的任何一个上色。每个精灵的\
  \ 4 个字节及其作用在表 6-5 中进行了简要描述。\n\n#### 表 6-5：OAM 中的精灵规格\n\n| 字节数 | 说明 |\n| --- | ---\
  \ |\n| 0 | 精灵的 y 轴位置 |\n| --- | --- |\n| 1 | 模式表索引，精灵的图形数据所在 |\n| 2 | 精灵属性，包括调色板（位\
  \ 0–1）、在前在后（位 5）、水平翻转（位 6）和垂直翻转（位 7） |\n| 3 | 精灵的 x 轴位置 |\n\n为什么 y 轴位置字节和 x 轴位置字节不相邻，这是我想向\
  \ NES 创建者提出的问题。也许这与 PPU 中线路的物理布线有关。\n\n### 帧创建与时序\n\n真实 NES 中的 PPU 从左上角到右下角逐像素地绘制屏幕。这反映了\
  \ NES 连接的 CRT 电视机中的“电子枪束”。NTSC NES 每秒绘制整个屏幕 60 次（每秒 60 帧，或 60 FPS）。PAL NES 以较慢的\
  \ 50 FPS 绘制。一个 `frame` 是电子枪完成穿越整个屏幕的过程。正如本章前面提到的，电子枪有时在 `hblank`（行间隙）和 `vblank`（帧间隙）期间会暂时离开屏幕。因此，这些是最安全的时刻。\n\
  \n由于 NES 分辨率是 256×240，我们知道每行有 256 个点，总共 240 行。其中第一行是预渲染行（prerenderline），我们称之为 0\
  \ 行。随后，1 到 240 行是显示区域。241 到 261 行是 `vblank` 期间。本章之前提到的 `NMI` 因此在第 241 行处触发，告诉程序此时修改内存是安全的。0\
  \ 到 255 点是行的可见部分。256 到 340 点是 `hblank` 期间的“静默”点。\n\n每个点代表一个 `PPU cycle`。如果你计算一下，每行\
  \ 341 个点乘以 262 行，意味着绘制每一帧需要 89342 个 `PPU cycles`。记住有 3 个 `CPU cycle`。如果你将 `PPU cycles`\
  \ 除以 3 并四舍五入，得到每帧 29781 个 `CPU cycles`。NES 的 CPU 频率约为 1.79 MHz，即每秒 1790000 次。如果你将\
  \ 1790000 除以 29781，得到接近 60。那就是每秒 60 帧！\n\n要创建一个周期精确的 NES 模拟器，理解 PPU 如何逐像素确定绘制颜色是非常重要的。由于我们使用的是较简单的逐帧绘制方法，我们可以认为每\
  \ 89342 个 `PPU cycles` 的某一点处绘制整个帧。对我来说，那个逻辑时间是可见行绘制完毕。在稍后的代码中，你将看到所有背景和精灵都在第 240\
  \ 行、256 点（最后可见行的最后一个点）一次性被绘制。我们的简化渲染器除了每帧一次的 `PPU cycle` 外不进行任何绘制。\n\n### 实现 PPU\n\
  \n实现我们的 PPU 从一些重要的开始，包括各种内存大小、屏幕分辨率以及完整的可用调色板：\n\n`NESEmulator/ppu.py`\n\n```python\n\
  from array import array\nfrom NESEmulator.rom import ROM\nimport numpy as np\n\n\
  SPR_RAM_SIZE = 256\nNAMETABLE_SIZE = 2048\nPALETTE_SIZE = 32\nNES_WIDTH = 256\n\
  NES_HEIGHT = 240\nNES_PALETTE = [0x7C7C7C, 0x0000FC, 0x0000BC, 0x4428BC, 0x940084,\
  \ 0xA80020,\n               0xA81000, 0x881400, 0x503000, 0x007800, 0x006800, 0x005800,\n\
  \               0x004058, 0x000000, 0x000000, 0x000000, 0xBCBCBC, 0x0078F8,\n  \
  \             0x0058F8, 0x6844FC, 0xD800CC]\n```\n\n\n\n\n```python\n    # 寄存器\n\
  \    self.addr = 0 # 主 PPU 地址寄存器\n    self.addr_write_latch = False\n    self.status\
  \ = 0\n    self.spr_address = 0\n    # 由 PPU 控制寄存器控制的变量\n    self.nametable_address\
  \ = 0\n    self.address_increment = 1\n    self.spr_pattern_table_address = 0\n\
  \    self.background_pattern_table_address = 0\n    self.generate_nmi = False\n\
  \    self.show_background = False\n    self.show_sprites = False\n    self.left_8_sprite_show\
  \ = False\n    self.left_8_background_show = False\n    # 内部辅助变量\n    self.buffer2007\
  \ = 0\n    self.scanline = 0\n    self.cycle = 0\n    # 屏幕像素\n    self.display_buffer\
  \ = np.zeros((NES_WIDTH, NES_HEIGHT), dtype=np.uint32)\n```\n\n接下来，我们来看渲染方法 `step()`：\n\
  \n```python\ndef step(self):\n    # 我们简化的 PPU 每帧只绘制一次\n    if (self.scanline ==\
  \ 240) and (self.cycle == 256):\n        if self.show_background:\n            self.draw_background()\n\
  \        if self.show_sprites:\n            self.draw_sprites(False)\n    if (self.scanline\
  \ == 241) and (self.cycle == 1):\n        self.status |= 0b10000000 # 设置垂直同步标志 (vblank)\n\
  \    if (self.scanline == 261) and (self.cycle == 1):\n        # 垂直同步结束，清除精灵点零，清除精灵点溢出\n\
  \        self.status |= 0b00011111\n\n    self.cycle += 1\n    if self.cycle > 340:\n\
  \        self.cycle = 0\n        self.scanline += 1\n        if self.scanline >\
  \ 261:\n            self.scanline = 0\n```\n\n从模拟器主循环对 `step()` 的每次调用代表一个 PPU 周期。由于我们的策略是每帧绘制一次内容，而不是追求像素级或扫描行的精确性，因此\
  \ `step()` 非常简单。它只是在每一帧的可视部分结束时一次性绘制背景和精灵。它还会在垂直同步（vblank）开始和结束时设置状态寄存器，以便 CPU 与\
  \ PPU 配合。最后，它会进行一些记账工作，以跟踪当前的扫描行以及每行扫描上的当前周期。\n\n重头工作由 `draw_background()` 和 `draw_sprites()`\
  \ 方法完成，这些方法由 `step()` 调用。接下来我们将查看这些方法。\n\n## 绘制背景\n\n我们在开始 `draw_background()` 背景绘制方法时，首先计算属性表的地址：\n\
  \n```python\ndef draw_background(self):\n    attribute_table_address = self.nametable_address\
  \ + 960\n```\n\n属性表始终跟在命名表（nametable）之后，回想本章之前提到的命名表的大小为 960 字节。我在本章前面的部分也提到过，命名表由\
  \ 960 字节组成，因为它使用 1 字节来表示每个 960 个瓦片的索引。屏幕宽为 32 个瓦片，高为 30 个瓦片，每个瓦片代表 8×8 像素区域。我们从屏幕的左上到右下，一行一行、从左到右地绘制这些瓦片：\n\
  \n```python\n    for y in range(30):\n        for x in range(32):\n            tile_address\
  \ = self.nametable_address + y * 32 + x\n            nametable_entry = self.read_memory(tile_address)\n\
  ```\n\n`tile_address` 是通过将基础 `nametable_address` 与当前瓦片的偏移量计算出的。由于每行有 32 个瓦片，我们将行\
  \ (`y`) 乘以 32 并加上 `x` 组件（可以被视为列）。为了获取实际索引 (`nametable_entry`)，我们在 `tile_address`\
  \ 处读取一个字节。在方法的稍后，我们将使用 `nametable_entry` 从模式表中检索瓦片的像素。接下来，我们获取与命名表项对应的属性项：\n\n```python\n\
  \        attrx = x // 4\n        attry = y // 4\n        attribute_address = attribute_table_address\
  \ + attry * 8 + attrx\n        nametable_entry = self.read_memory(attribute_address)\n\
  ```\n\n由于 8×8 属性表中的每个项对应 16 个瓦片，我们将 `x` 和 `y` 都除以 4，以获取到瓦片的属性项（参见第 181 页的调色板与属性表）。由于每个\
  \ `attribute_entry` 代表四个 2×2 的瓦片区域（总共 16 个瓦片），我们需要深入到特定的瓦片区域：\n\n```python\n   \
  \     block = (y & 0x02) | ((x & 0x02) >> 1)\n        attribute_bits = 0\n     \
  \   if block == 0:\n            attribute_bits = (attribute_entry & 0b00000011)\
  \ << 2\n        elif block == 1:\n            attribute_bits = (attribute_entry\
  \ & 0b00001100)\n        elif block == 2:\n            attribute_bits = (attribute_entry\
  \ & 0b00110000) >> 2\n        elif block == 3:\n            attribute_bits = (attribute_entry\
  \ & 0b11000000) >> 4\n        else:\n            print(\"Invalid block\")\n```\n\
  \n`attribute_entry` 是 1 字节，每 2 位对应一个瓦片区域。变量 `block` 代表当前瓦片的瓦片区域；它可以是 0、1、2 或 3。根据\
  \ `block` 的值，我们使用相应的位操作从 `attribute_entry` 中检索该区域的两个位，并将它们存储在 `attribute_bits` 中。\n\
  \n现在我们需要从模式表中检索每个瓦片的独立像素：\n\n```python\n        for fine_y in range(8):\n      \
  \      low_order = self.read_memory(self.background_pattern_table_address +\n  \
  \                                       nametable_entry * 16 + fine_y)\n       \
  \     high_order = self.read_memory(self.background_pattern_table_address +\n  \
  \                                        nametable_entry * 16 + 8 + fine_y)\n  \
  \          for fine_x in range(8):\n                pixel = ((low_order >> (7 -\
  \ fine_x)) & 1) |\n                            ((high_order >> (7 - fine_x)) & 1)\
  \ << 1) | attribute_bits\n```\n\n回想第 178 页的模式表与瓦片，每个模式表由 16 字节的瓦片组成。因此，为了计算瓦片的地址，我们需要将其索引\
  \ (`nametable_entry`) 乘以 16 加入 `background_pattern_table_address`。此外，模式表瓦片被分为两个位平面，每个颜色占\
  \ 2 位，这 2 位在不同的平面中相隔 8 字节（见图 6-2）。我们的策略是读取 2 个字节，一个用于 `low_order` 平，另一个用于 `high_order`\
  \ 平。每个字节持有瓦片一行的一半像素项。我们使用 `fine_y` 来代表瓦片的每一行，然后使用代表每一列的 `fine_x` 将独立位置零。每个平面的位与\
  \ `attribute_bits` 结合产生调色板内存中的地址，其中存储了当前像素的颜色。\n\n最后，我们使用 `NES_PALETTE` 中预定义的颜色，在相应的屏幕位置逐个绘制瓦片的每个像素：\n\
  \n```python\n    x_screen_loc = x * 8 + fine_x\n    y_screen_loc = y * 8 + fine_y\n\
  \    transparent = ((pixel & 3) == 0)\n    # 如果背景是透明，使用调色板中的第一个颜色\n    color = self.palette[0]\
  \ if transparent else self.palette[pixel]\n    self.display_buffer[x_screen_loc,\
  \ y_screen_loc] = NES_PALETTE[color]\n```\n\n为屏幕设置像素意味着在 `display_buffer` 中赋值，它是一个\
  \ NumPy 数组，因为这是 Pygame 接受。\n\n## 绘制精灵\n\n绘制精灵与绘制背景瓦片有些相似。然而，我们不是从命名表读取，而是从 OAM (`self.spr`)\
  \ 读取。内存中每个精灵的条目占 4 字节，代表精灵的 y 位置、模式表索引、属性和 x 位置（见表 6-5）。OAM 中可以容最多 64 个精灵条目。如果 y\
  \ 位置为 `0xFF`，则该条目未被使用。我们通过每次移动 4 字节遍历 OAM 来启动 `draw_sprites()` 以找到所有有效的条目：\n\n```python\n\
  def draw_sprites(self, background_transparent: bool):\n    for i in range(SPR_RAM_SIZE\
  \ - 4, -4, -4):\n        y_position = self.spr[i]\n        if y_position == 0xFF:\
  \ # 0xFF 是没有精灵数据的标记\n            continue\n        background_sprite = bool((self.spr[i\
  \ + 2] >> 5) & 1)\n        x_position = self.spr[i + 3]\n```\n\n\n\n\n我们获取每个有效精灵（sprite）的\
  \ y 坐标和 x 坐标。我们还会查看其属性的第 5 位以判断它是否为背景精灵。只有当背景透明时，才会绘制背景精灵。注意，我们是反向遍历精灵内存的，因为正如我们在节末尾将看到的，第\
  \ 0 号精灵具有特殊的意义。\n\n就像我们逐像素像素地绘制背景瓦片一样，我们对精灵也采取相同的做法：\n\n```python\n    for x in\
  \ range(x_position, x_position + 8):\n        if x >= NES_WIDTH:\n            break\n\
  \        for y in range(y_position, y_position + 8):\n            if y >= NES_HEIGHT:\n\
  \                break\n```\n\n在这里，`x` 和 `y` 比于 `draw_background()` 中的 `fine_x`\
  \ 和 `fine_y`。我们非常小心，不绘制任何超出屏幕的像素。\n\n精灵可以拥有的另一个属性是垂直翻转能力（`flip_y`），这由精灵属性字节中的第 7\
  \ 位决定：\n\n```python\n            flip_y = bool((self.spr[i + 2] >> 7) & 1)\n   \
  \         sprite_line = y - y_position\n            if flip_y:\n               \
  \ sprite_line = 7 - sprite_line\n```\n\n如果精灵被垂直翻转，我们就会按反向垂直顺序读取其像素。我们使用魔数字 `7` 是因为每个精灵都是\
  \ 8×8 像素。\n\n根据模式表索引从模式表中读取实际像素位，与 `draw_background()` 中执行的工作非常相似：\n\n```python\n\
  \            index = self.spr[i + 1]\n            bit0s_address = self.spr_pattern_table_address\
  \ + (index * 16) + sprite_line\n            bit1s_address = self.spr_pattern_table_address\
  \ + (index * 16) + sprite_line + 8\n            bit0s = self.read_memory(bit0s_address)\n\
  \            bit1s = self.read_memory(bit1s_address)\n            bit3and2 = ((self.spr[i\
  \ + 2]) & 3) << 2\n```\n\n我在这里使用了一些不同的术语（使用 `bit0s_address` 和 `bit1s_address` 代替\
  \ `low_order` 和 `high_order`），因为我认为不同的命名可能会引起不同读者的共鸣。属性颜色位是精灵属性字节中的第 `0` 和第 `1`\
  \ 位，它们存储在 `bit3and2` 中用于最终颜色。\n\n精灵还可以根据属性字节中的第 6 位进行水平翻转：\n\n```python\n      \
  \      flip_x = bool((self.spr[i + 2] >> 6) & 1)\n            x_loc = x - x_position\
  \ # 精灵内的位置\n            if not flip_x:\n                x_loc = 7 - x_loc\n```\n\
  \n我们将两个位平面合并在一起，并跳过绘制透明的像素：\n\n```python\n            bit1and0 = (((bit1s >> x_loc)\
  \ & 1) << 1) | (\n                    ((bit0s >> x_loc) & 1) << 0)\n           \
  \ if bit1and0 == 0: # 透明像素... 跳过\n                continue\n```\n\nPPU 会跟踪第 0 号精灵（OAM\
  \ 中的第一个条目）是否与任何非透明背景像素碰撞。这被称为 `sprite-zero hit`（精灵零位命中）。我们在这里实现了这种简单形式的碰撞检测：\n\n\
  ```python\n    # 这不是透明的。那么它是一个精灵零位命中吗？\n    # 检查左侧 8 像素裁剪未开启。\n    if (i == 0) and\
  \ (not background_transparent) and (not (x < 8 and (\n            not self.left_8_sprite_show\
  \ or not self.left_8_background_show))\n                and self.show_background\
  \ and self.show_sprites):\n        self.status |= 0b01000000\n    # 需要在精灵零位检查后执行此操作，以便我们仍然会将\n\
  \    # 背景精灵计入精灵零位检查中\n    if background_sprite and not background_transparent:\n\
  \        continue # 背景精灵不应绘制在不透明的像素上\n```\n\n当发生精灵零位命中时，我们在状态寄存器中标记它。在这段代码中，如果背景不透明，我们还会跳过绘制背景精灵。PPU\
  \ 中可以设置标志位来裁剪背景。最后，我们获取颜色：\n\n```python\n            color = bit3and2 | bit1s\n\
  ```\n\n### 访问寄存器\n\nPPU 有几个寄存器，在读写时存在一些技术细节。在 `write_register()` 中，我们首先处理 `0x2000`：\n\
  \n```python\ndef write_register(self, address: int, value: int):\n    if address\
  \ == 0x2000: # 控制 1\n        self.nametable_address = (value & 0b00000111) * 0x40\n\
  \        self.spr_pattern_table_address = ((value & 0b00001000) >> 3) * 0x1000\n\
  \        self.background_pattern_table_address = ((value & 0b00010000) >> 4) * 0x1000\n\
  \        self.generate_nmi = bool(value & 0b10000000)\n    elif address == 0x2001:\
  \ # 控制 2\n        self.show_background = bool(value & 0b00001000)\n        self.show_sprites\
  \ = bool(value & 0b00010000)\n        self.left_8_background_show = bool(value &\
  \ 0b00000010)\n        self.left_8_sprite_show = bool(value & 0b00000100)\n```\n\
  \n接下来，我们处理寄存器 `0x2003` 到 `0x2007`：\n\n```python\n    elif address == 0x2003:\n \
  \       self.spr_address = value\n    elif address == 0x2004:\n        self.spr[self.spr_address]\
  \ = value\n        self.spr_address += 1\n    elif address == 0x2005: # 滚动\n   \
  \     pass\n    elif address == 0x2006:\n        # 参考 https://wiki.nesdev.org/w/index.php/PPU_scrolling\n\
  \        if not self.addr_write_latch: # 第一次写入\n            self.addr = (self.addr\
  \ & 0x00FF) | ((value & 0xFF) << 8)\n        else: # 第二次写入\n            self.addr\
  \ = (self.addr & 0xFF00) | (value & 0xFF)\n        self.addr_write_latch = not self.addr_write_latch\n\
  \    elif address == 0x2007:\n        self.write_memory(self.addr, value)\n    \
  \    self.addr += self.address_increment\n    else:\n        raise LookupError(f\"\
  Error: 未识别的 PPU 写入 {address:X}\")\n```\n\n\n\n寄存器 `0x2003` 设置 `self.spr_address`。寄存器\
  \ `0x2004` 设置 `self.spr_address` 处的值，然后将 `self.spr_address` 增 1。寄存器 `0x2005` 是滚动寄存器；我们在这个简单的\
  \ PPU 中没有实现它，但一个完整的实现需要它。目前，我们的模拟器无法运行需要滚动的游戏。寄存器 `0x2006` 用于修改 `self.addr`。这就是\
  \ `self.addr_write_latch` 派上用场的地方：我们需要锁存器是因为 `self.addr` 是 16 位的（2 字节），但每次只能写入 1\
  \ 字节。最后，`0x2007` 用于写入 `self.addr`。\n\n## 访问内存\n\n我们的 PPU 实现基本上已经完成，但我们需要一些辅助方法来读取和写入\
  \ PPU 内存。这些 `read_memory()` 和 `write_memory()` 方法与它们在 CPU 中的对应方法非常相似：\n\n```python\n\
  def read_memory(self, address: int) -> int:\n    address = address % 0x4000 # mirror\
  \ >0x4000\n    if address < 0x2000: # pattern tables\n        return self.rom.read_cartridge(address)\n\
  \    elif address < 0x3F00: # nametables\n        address = (address - 0x2000) %\
  \ 0x1000 # 3000-3EFF is a mirror\n        if self.rom.vertical_mirroring:\n    \
  \        address = address % 0x0800\n        else: # horizontal mirroring\n    \
  \        if (address >= 0x400) and (address < 0xC00):\n                address =\
  \ address - 0x400\n            elif address >= 0xC00:\n                address =\
  \ address - 0x800\n        return self.nametables[address]\n    elif address < 0x4000:\
  \ # palette memory\n        address = (address - 0x3F00) % 0x20\n        if (address\
  \ > 0x0F) and ((address % 0x04) == 0):\n            address = address - 0x10\n \
  \       return self.palette[address]\n    else:\n        raise LookupError(f\"Error:\
  \ Unrecognized PPU read at {address:X}\")\n\ndef write_memory(self, address: int,\
  \ value: int):\n    address = address % 0x4000 # mirror >0x4000\n    if address\
  \ < 0x2000: # pattern tables\n        return self.rom.write_cartridge(address, value)\n\
  \    elif address < 0x3F00: # nametables\n        address = (address - 0x2000) %\
  \ 0x1000 # 3000-3EFF is a mirror\n        if self.rom.vertical_mirroring:\n    \
  \        address = address % 0x0800\n        else: # horizontal mirroring\n    \
  \        if (address >= 0x400) and (address < 0xC00):\n                address =\
  \ address - 0x400\n            elif address >= 0xC00:\n                address =\
  \ address - 0x800\n        self.nametables[address] = value\n    elif address <\
  \ 0x4000: # palette memory\n        address = (address - 0x3F00) % 0x20\n      \
  \  if (address > 0x0F) and ((address % 0x04) == 0):\n            address = address\
  \ - 0x10\n        self.palette[address] = value\n    else:\n        raise LookupError(f\"\
  Error: Unrecognized PPU write at {address:X}\")\n```\n\n在这些方法中，不同的内存区域被映射到相应的区域——图案表（实际上在卡带上）、命名表等。唯一的复杂之处在于命名表和调色板内存可能是镜像的。我们像在\
  \ CPU 中一样使用模运算符（`%`）来处理这个问题。\n\n## 测试模拟器\n\n开发 NES 模拟器的人创建了许多测试 ROM。其中一些包含本书的仓库中。这些可以测试\
