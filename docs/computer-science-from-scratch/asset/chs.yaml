  \ | 如果提供的数字大于 0，将创建一个每帧指定毫秒间隔的动画 GIF，显示图像逐个形状地构建过程 |\n\n我们的主文件只是表 4-1 的代码实现。所有选项都将传递给\
  \ `Impressionist` 类的构造函数，我们稍后会回到这个类。\n\n```\n### Impressionist/__main__.py\nfrom\
