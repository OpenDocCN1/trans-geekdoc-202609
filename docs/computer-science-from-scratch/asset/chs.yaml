  \n**修正后的译文：**\n\n[content]\nIn the preceding chapter, we correctly classified 98\
  \ percent of a test set of images of handwritten digits against a training set of\
  \ the same kind of 8×8 pixel images using KNN. In this final KNN example, we’ll\
  \ classify an 8×8 digit that the user draws and even predict what the rest of the\
  \ pixels of the image could look like. Instead of implementing this as another set\
  \ of unit tests, we’ll create a fun interactive program using Pygame that allows\
  \ the user to draw in a window housing an 8×8 grid.\n\nHere’s a preview of what\
  \ we’re building. Figure 8-2 shows the drawing window with a squiggly 7 that I tried\
  \ to draw. I pressed the `C` key and the program correctly classified it as a 7\
  \ (that shows in the terminal, not pictured).\n\n![Figure 8-2: Drawing a 7 in the\
  \ digit recognizer program](img/Figure_8-2.jpg)\n\nFigure 8-2: Drawing a 7 in the\
  \ digit recognizer program\n\nFigure 8-3 shows the window after pressing the `P`\
  \ key, which triggers a prediction of what the rest of the digit’s pixels may look\
  \ like based on the average of the pixels of the nine nearest neighbors.\n\n![Figure\
  \ 8-3: The predicted digit’s pixels based on the nearest neighbors’ pixels](img/Figure_8-3.jpg)\n\
  \nFigure 8-3: The predicted digit’s pixels based on the nearest neighbors’ pixels\n\
  \nIn our simple program, we can only draw with white. The prediction yields a better-looking\
  \ 7 since it can use more levels of gray. We start our program with some imports\
  \ and constants:\n\n`KNN/__main__.py`\n\n```python\nfrom KNN.knn import KNN\nfrom\
  \ KNN.digit import Digit\nfrom pathlib import Path\nimport sys\nimport pygame\n\
  import numpy as np\n\nPIXEL_WIDTH = 8\nPIXEL_HEIGHT = 8\nP_TO_D = 16 / 255 # pixel\
  \ to digit scale factor\nD_TO_P = 255 / 16 # digit to pixel scale factor\nK = 9\n\
  WHITE = (255, 255, 255)\n```\n\nThe `PIXEL_WIDTH` and `PIXEL_HEIGHT` constants are\
  \ the size of one image. The `P_TO_D` constant converts between the 255 shades of\
  \ gray in the pixel representation we’ll work with and the 16 shades of gray in\
  \ the source dataset; `D_TO_P` is its inverse. We set `K`, the number of neighbors\
  \ KNN will consider, to 9, and `WHITE` is a constant for the white color in the\
  \ RGB pixel format.\n\nThis is a short program. We have just one central `run()`\
  \ function that spends as much time handling the user interface as it does running\
  \ KNN. Here’s the start of the function:\n\n```python\ndef run():\n    # Create\
  \ a 2D array of pixels to represent the digit\n    digit_pixels = np.zeros((PIXEL_HEIGHT,\
  \ PIXEL_WIDTH, 3),\n                            dtype=np.uint32)\n    # Load the\
  \ training data\n    digits_file = (Path(__file__).resolve().parent\n          \
  \         / \"datasets\" / \"digits\" / \"digits.csv\")\n    digits_knn = KNN(Digit,\
  \ digits_file, has_header=False)\n    # Start up Pygame, create the window\n   \
  \ pygame.init()\n    screen = pygame.display.set_mode(size=(PIXEL_WIDTH, PIXEL_HEIGHT),\n\
  \                                     flags=pygame.SCALED | pygame.RESIZABLE)\n\
  \    pygame.display.set_caption(\"Digit Recognizer\")\n```\n\nIn these first few\
