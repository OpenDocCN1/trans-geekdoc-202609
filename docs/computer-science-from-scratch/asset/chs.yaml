  \nNES 中的中央处理单元（`CPU`）是 `MOS Technology 6502` 微处理器的克隆，由 `Ricoh` 制造，运行频率略低于 2 MHz。`6502`\
  \ 与当时流行的家用电脑（如 `Apple II` 和 `Commodore 64`）使用的是相同的微处理器。`6502` 由约 3500 个晶体管组成，是一个特别简单的微处理器；例如，它缺乏乘法和除法的指令.^(2)\
  \ 这些算术操作必须在软件中实现。\n\n（注：由于原文文本中存在大量段落重复，根据指令“一定不要重复输出原文”的原则，此处译文应根据原文逻辑进行翻译，但由于提供的原文内容本身存在严重的复制粘贴重复，翻译时已严格遵循原文的逻辑结构。为了确保可读性，以下为针对原文中非重复逻辑部分的翻译内容。）\n\
  \n……（此处省略重复段落）……`6502` 由约 3500 个晶体管组成，是一个特别简单的微处理器；例如，它缺乏乘法和除法的指令.^(2) 这些算术操作必须在软件中实现。\n\
  \n（由于您提供的原文文本中从 \"The Hardware\" 之后开始出现了大量的段落重复，为了符合“不要重复输出原文”的要求，上述译文已仅保留了核心逻辑部分的翻译。如果需要针对特定重复部分进行特殊处理，请告知。）\n\
  \n\n\n\n\nNES 没有任何 `BIOS` 或操作系统。NES 裸机本身不带任何软件。所有软件都由游戏卡带提供。游戏卡带上的程序直接控制 `CPU`、`PPU`\
  \ 和 `APU`，它们与硬件之间没有任何抽象层。\n\nNES 游戏通常用 `6502` 汇编语言编写。听起来可能很硬核，但在那个时代这是常态；直到 20 世纪\
  \ 90 年代初，大多数个人电脑或游戏机上需要高性能的程序都是用汇编编程的。除了汇编器，开发工具通常是内部构建的。当时并没有可以下载的 `NES Game Maker`。\n\
  \n事实上，这是一个下载功能完全不存在的时代。NES 在任何类型的网络连接出现之前已经好几个主机世代了。第一台内置调制调器的主流游戏机是 `Sega Dreamcast`，它于\
  \ 20 世纪 90 年代后期推出。NES 卡带发行的是游戏的最终版本；不会有更新。如果有 Bug，那就只有 Bug，所以游戏在 `1.0` 版本就必须近乎完美。相比之下，你今天购买的典型游戏，开发者往往在游戏发布之前就在编写第一个大补丁了。那时，对细节的关注需要完全不同的水平，但另一方面，游戏也比现在复杂得多。\n\
  \n想象一下在这样一个原始的环境中，竟然开发了一些历史上最具影响力和定义流派的游戏，这令人惊叹。团队中程序员所需的技术能力与当今游戏开发者所处的领域非常不同。今天的大多数游戏是使用预封装的框架或引擎（如\
  \ `Unreal` 或 `Unity`）构建的。开发者可以将大部分时间花在编写特定的游戏机制上。NES 开发者必须用汇编编写自己的引擎。他们必须直接管理 `APU`\
  \ 来播放每种声音，直接管理 `PPU` 来显示每幅图形，并且必须榨干 `CPU` 的每一个周期来完成任何工作。大型公司会构建自己的内部框架和工具，这些工具可以在不同作品之间复用，但程序员仍然在相对较低的层面上工作。\n\
  \n### 构建模拟器\n\n是时候写些代码了。不过在此之前，先说明关于方向和预期管理的注意事项：我们正在编写的模拟器在每个角落都进行了简化。正如前面提到的，由于非常简化的\
  \ `PPU`，它将无法兼容许多游戏。由于我们没有实现 `APU`，它也不会有任何声音。它的运行速度也不会快到能以预期速度玩游戏。然而，它可以运行真实的游戏，而且它们是可玩的。我们在这里的工作也将为如果你愿意的话后续进行改进和添加更多功能提供坚实的基础。\n\
  \n### 规划结构\n\n模拟器执行的总体计划与第 5 章中的 `CHIP-8 VM` 相似。像 `CHIP-8` 一样，我们将从 `ROM` 文件中一次读取一条指令并解释它。像\
  \ `CHIP-8` 一样，我们将使用 `Pygame` 显示图形并处理用户输入。像 `CHIP-8` 一样，我们将有一个大循环来获取每条指令并响应每个事件。然而，代码结构将更加复杂。特别是，我们将模拟器分为三个类，每个类代表硬件的一个物理组件。我们将为\
  \ `CPU`、`PPU` 和 `cartridge`（卡带）创建类。以下我们要写的每个文件及其用途：\n\n*   `__main__.py`: 处理命令行参数并实现模拟器主循环，该循环分发指令、显示图形并响应用户输入。\n\
  *   `rom.py`: 读取 `ROM` 文件并伪装成卡带。\n*   `cpu.py`: 维护 `CPU` 状态，解释指令并处理主内存访问。\n*   `ppu.py`:\
  \ 管理 `PPU` 状态并绘制背景和精灵。\n\n我们将按照列出的顺序处理这些文件。\n\n### 创建主循环\n\n我们的主文件（`__main__.py`）是系统各个组件（`CPU`、`PPU`、`cartridge`）汇总的地方。它的“运行循环”通过保持一切向前移动并协调不同组件，赋予模拟器生命，并在需要时委托\
  \ `Pygame` 来显示图形和读取用户输入。`run()` 函数接收一个 `ROM` 对象和 `ROM` 文件名作为参数。在我们的第一个代码段中，我们初始化\
  \ `Pygame`，在屏幕上获取一个窗口并创建 `CPU` 和 `PPU` 对象：\n\n`NESEmulator/__main__.py`\n\n```python\n\
  import sys\nfrom argparse import ArgumentParser\nfrom NESEmulator.rom import ROM\n\
  from NESEmulator.ppu import PPU, NES_WIDTH, NES_HEIGHT\nfrom NESEmulator.cpu import\
  \ CPU\nimport pygame\nfrom timeit import default_timer as timer\nimport os\n\ndef\
  \ run(rom: ROM, name: str):\n    pygame.init()\n    screen = pygame.display.set_mode((NES_WIDTH,\
  \ NES_HEIGHT), 0, 24)\n    pygame.display.set_caption(f\"NES Emulator - {os.path.basename(name)}\"\
  )\n    ppu = PPU(rom)\n    cpu = CPU(ppu, rom)\n    ticks = 0\n    start = None\n\
  ```\n\n正如对它们的构造函数的调用所示，`PPU` 和 `CPU` 都需要访问 `ROM`。`CPU` 需要读取程序指令，`PPU` 需要读取图形数据。由于某些内存地址被读写，`CPU`\
  \ 也需要访问 `PPU`。\n\n`ticks` 变量跟踪 `CPU` 运行了多少周期。对于每个 CPU 周期，`PPU` 恰好运行三次。换句话说，`PPU`\
  \ 的速度比 `CPU` 快三倍，当 `CPU` 为 `1.8 MHz` 时，`PPU` 为 `5.4 MHz`。我们的代码需要模拟这一点，因此在下一个代码段（即主循环）中，我们跟踪每条\
  \ CPU 指令所需的周期（不同指令需要的周期数不同），然后运行 `PPU` 三倍的周期：\n\n```python\nwhile True:\n    cpu.step()\n\
  \    new_ticks = cpu.cpu_ticks - ticks\n    # 每个 CPU 周期运行 3 次 PPU \n    for _ in\
  \ range(new_ticks * 3):\n        ppu.step()\n        # 每帧绘制一次内容到屏幕上\n        if\
  \ (ppu.scanline == 240) and (ppu.cycle == 257): # ❶\n            pygame.surfarray.blit_array(screen,\
  \ ppu.display_buffer)\n            pygame.display.flip()\n            end = timer()\n\
  \            if start is not None:\n                print(end - start)\n       \
  \     start = timer\n        if (ppu.scanline == 241) and (ppu.cycle == 2) and ppu.generate_nmi:\n\
  \            cpu.trigger_NMI() # ❷\n    ticks += new_ticks\n```\n\n\n\n\n\n高精度的\
  \ NES 模拟器通过模拟 `PPU` 在每个周期内应该执行的操作来模拟真实硬件的行为：即确定下一个像素点的颜色。而我们使用了一种简单得多的技术，即每帧只需在正确的位置绘制所有正确的磁块（tiles）和精灵（sprites）。换句话说，我们不是每个周期都考虑一个像素点，而是每帧只考虑整个屏幕应该什么样。虽然这种技术速度更快，且不需要我们模拟许多关于\
  \ `PPU` 内部运行的细节，但它并不适用于所有游戏。更高级的 NES 游戏会在帧正在绘制到屏幕的过程中对图形进行更改（即在扫描行之间，甚至在像素点之间）。\n\
  \n请注意，`PPU` 实际上在扫描行之间会进行额外的处理。这段时期被称为 `hblank`。更重要的是，`PPU` 还有额外的离屏扫描行（它一直延伸到第 261\
  \ 行扫描行，将第一行计为第 0 行）。处理这些额外的非渲染扫描行期间的时间被称为 `vblank`。在 `vblank` 期间，`CPU` 修改 `PPU`\
  \ 的任何内存都是安全的，因为此时 `PPU` 内存并没有被活动访问以渲染可见的扫描行。为了实现这一目的，`PPU` 在 `vblank` 开始（完成所有可见扫描行后）会向\
  \ `CPU` 发送信号。该信号是一种`非掩蔽中断 (NMI)`。\n\n将 `NMI` 想象为一种无法停止的程序中断。换句话说，它是一个向微处理器发送的信号：“立即停止你正在做的事，因为我们现在要处理另一件事。”在\
  \ NES 的情况下，另一件事就是更新游戏的图形显示。每个 NES 游戏都有一个 `NMI` 处理器，用于在 `vblank` 期间更新游戏图形。\n\n循环的其余部分仅处理事件：\n\
  \n```python\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
  \            sys.exit()\n        # 将键盘事件视为手柄变化\n        if event.type not in {pygame.KEYDOWN,\
  \ pygame.KEYUP}:\n            continue\n        is_keydown = event.type == pygame.KEYDOWN\n\
  \        match event.key:\n            case pygame.K_LEFT:\n                cpu.joypad1.left\
  \ = is_keydown\n            case pygame.K_RIGHT:\n                cpu.joypad1.right\
  \ = is_keydown\n            case pygame.K_UP:\n                cpu.joypad1.up =\
  \ is_keydown\n            case pygame.K_DOWN:\n                cpu.joypad1.down\
  \ = is_keydown\n            case pygame.K_x:\n                cpu.joypad1.a = is_keydown\n\
  \            case pygame.K_z:\n                cpu.joypad1.b = is_keydown\n    \
  \        case pygame.K_s:\n                cpu.joypad1.start = is_keydown\n    \
  \        case pygame.K_a:\n                cpu.joypad1.select = is_keydown\n\nif\
  \ __name__ == \"__main__\":\n    # 解析文件参数\n    file_parser = ArgumentParser(\"NESEmulator\"\
  )\n    file_parser.add_argument(\"rom_file\",\n                             help=\"\
  一个 iNES 格式的 NES 游戏文件.\")\n    arguments = file_parser.parse_args()\n    game = NESEmulator(arguments.rom_file)\n\
  \    game.run()\n```\n\n\n\n\n\n```python\nfrom pathlib import Path\nfrom struct\
  \ import unpack\nfrom collections import namedtuple\nfrom array import array\n\n\
  Header = namedtuple(\"Header\", \"signature prg_rom_size chr_rom_size \"\n     \
  \                         \"flags6 flags7 flags8 flags9 flags10 unused\")\nHEADER_SIZE\
  \ = 16\nTRAINER_SIZE = 512\nPRG_ROM_BASE_UNIT_SIZE = 16384\nCHR_ROM_BASE_UNIT_SIZE\
  \ = 8192\nPRG_RAM_SIZE = 8192\n```\n\n`ROM` 类的构造函数首先利用 `struct` 标准库模块中的 `unpack()`\
  \ 函数从 ROM 文件中读取头，并根据格式字符串将其分配到适当大小的字段中：\n\n```python\nclass ROM:\n    def __init__(self,\
  \ file_name: str | Path):\n    with open(file_name, \"rb\") as file:\n        #\
  \ 读取头信息并检查签名 \"NES\"\n        self.header = Header._make(unpack(\"!LBBBBBBB5s\"\
  ,\n                                              file.read(HEADER_SIZE)))\n```\n\
  \n`namedtuple` 上的 `_make()` 类方法可以从可迭代对象（例如从 `unpack()` 返回的结果）构造该 `namedtuple` 的实例。`unpack()`\
  \ 格式字符串中的特定项目类型列在 表 6-2 中。格式字符串中的每个项目对应于 表 6-1 中的一个头元素。有关格式字符串的更多细节，请参阅 `struct`\
  \ 模块的文档：[`https://docs.python.org/3/library/struct.html#struct-format-strings`](https://docs.python.org/3/library/struct.html#struct-format-strings)。\n\
  \n表 6-2：`struct` 模块的格式字符串字符\n\n| 项目 | 字节数 | C 类型 | Python 类型 |\n| --- | --- | ---\
  \ | --- |\n| `!` | N/A | 表示后续内容为大端格式 | N/A |\n| --- | --- | --- | --- |\n| `L` |\
  \ 4 | unsigned long | int |\n| `B` | 1 | unsigned char | int |\n| `5s` | 5 | char[]\
  \ | bytes |\n\n经过这些处理后，`self.header` 包含了在良好标记段中的 iNES 头的正确部分。接下来，我们检查头中的几条信息：\n\n\
  ```python\n        if self.header.signature != 0x4E45531A:\n            print(\"\
  Invalid ROM Header Signature\")\n        else:\n            print(\"Valid ROM Header\
  \ Signature\")\n        # 解析 Mapper - flags6 中的一个半字节和 flags7 中的一个半字节\n        self.mapper\
  \ = (self.header.flags7 & 0xF0) | (\n                (self.header.flags6 & 0xF0)\
  \ >> 4)\n        print(f\"Mapper {self.mapper}\")\n        if self.mapper != 0:\n\
  \            print(\"Invalid Mapper: Only Mapper 0 is Implemented\")\n```\n\n每个\
  \ iNES 头都应该以相同的 4 字节签名开头。同时，mapper 数字由 `flags 7` 和 `8` 的部分内容构造。我们的模拟器仅支持使用 mapper\
  \ 0 的游戏。\n\n这里是构造函数的其余部分：\n\n```python\n        self.read_cartridge = self.read_mapper0\n\
  \        self.write_cartridge = self.write_mapper0\n        # 检查是否存在 trainer (flags6\
  \ 第 4 位) 并读取它\n        self.has_trainer = bool(self.header.flags6 & 4)\n       \
  \ if self.has_trainer:\n            self.trainer_data = file.read(TRAINER_SIZE)\n\
  \        # 根据 flags6 位 0 检查镜像\n        self.vertical_mirroring = bool(self.header.flags6\
  \ & 1)\n        print(f\"Has vertical mirroring {self.vertical_mirroring}\")\n \
  \       # 读取 PRG_ROM 和 CHR_ROM，分别为 16K 和 8K 的倍数\n        self.prg_rom = file.read(PRG_ROM_BASE_UNIT_SIZE\
  \ *\n                                  self.header.prg_rom_size)\n        self.chr_rom\
  \ = file.read(CHR_ROM_BASE_UNIT_SIZE *\n                                  self.header.chr_rom_size)\n\
  \        self.prg_ram = array('B', [0] * PRG_RAM_SIZE)\n```\n\n\n\n\n\n```python\n\
  from __future__ import annotations\nfrom enum import Enum\nfrom dataclasses import\
  \ dataclass\nfrom array import array\nfrom typing import Callable\nfrom NESEmulator.ppu\
  \ import PPU, SPR_RAM_SIZE\nfrom NESEmulator.rom import ROM\n\nMemMode = Enum(\"\
  MemMode\", \"DUMMY ABSOLUTE ABSOLUTE_X ABSOLUTE_Y ACCUMULATOR \"\n             \
  \             \"IMMEDIATE IMPLIED INDEXED_INDIRECT INDIRECT \"\n               \
  \           \"INDIRECT_INDEXED RELATIVE ZEROPAGE ZEROPAGE_X \"\n               \
  \           \"ZEROPAGE_Y\")\n\nInstructionType = Enum(\"InstructionType\", \"ADC\
  \ AHX ALR ANC AND ARR ASL AXS \"\n                                          \"BCC\
  \ BCS BEQ BIT BMI BNE BPL BRK \"\n                                          \"BVC\
  \ BVS CLC CLD CLI CLV CMP CPX \"\n                                          \"CPY\
  \ DCP DEC DEX DEY EOR INC INX \"\n                                          \"INY\
  \ ISC JMP JSR KIL LAS LAX LDA \"\n                                          \"LDX\
  \ LDY LSR NOP ORA PHA PHP PLA \"\n                                          \"PLP\
  \ RLA ROL ROR RRA RTI RTS SAX \"\n                                          \"SBC\
  \ SEC SED SEI SHX SHY SLO SRE \"\n                                          \"STA\
  \ STX STY TAS TAX TAY TSX TXA \"\n                                          \"TXS\
  \ TYA XAA\")\n\n@dataclass(frozen=True)\nclass Instruction:\n    type: InstructionType\n\
  \    method: Callable[[Instruction, int], None]\n    mode: MemMode\n    length:\
  \ int\n    ticks: int\n    page_ticks: int\n\n@dataclass\nclass Joypad:\n    strobe:\
  \ bool = False\n    read_count: int = 0\n    a: bool = False\n    b: bool = False\n\
  \    select: bool = False\n    start: bool = False\n    up: bool = False\n    down:\
  \ bool = False\n    left: bool = False\n    right: bool = False\n\nSTACK_POINTER_RESET\
  \ = 0xFD\nSTACK_START = 0x100\nRESET_VECTOR = 0xFFFC\nNMI_VECTOR = 0xFFFA\nIRQ_BRK_VECTOR\
  \ = 0xFFFE\nMEM_SIZE = 2048\n```\n\n`MemMode` 枚举列出了 6502 中所有不同的内存访问方案。在某些基础级微处理器上，从内存中检索字节只需指定一个地址并返回存储在该处的字节即可非常简单。例如，如果我说“读取\
  \ 0x1940”，我就会返回内存地址 `0x1940` 处存储的任何字节。6502 可以通过其 `ABSOLUTE` 内存模式实现这一点，但它还有其他在某些情况下非常有用的内存模式。其中一些模式访问的是动态计算的内存地址，而不是字面指定的地址。例如，`ABSOLUTE_X`\
  \ 模式会将 `X` 寄存器的值加到提供的地址上，并访问生成的内存位置。在这种模式下，如果我们在增加 X 的值后再次执行相同的指令，我们将自动读取内存中的下一个字节。在进行低级编程时，这是一种非常方便的特性，如果硬件对某些访问模式进行了优化，甚至可以提高性能。我们将在章节的稍后部分详细讨论\
  \ NES 的内存模式——幸运的是，其中许多模式彼此非常相似。\n\n`InstructionType` 枚举列出了 6502 可以处理的所有不同类型的指令。其中某些指令类型用于\
  \ BCD（二进制编码进制）操作，正如前面提到的，NES 版本的 6502 并不具备这种功能。还有一些“非官方”指令类型，它们实际上并没有被记录为 6502 的文档一部分，但通过试错发现它们存在。极少数游戏使用它们。剩余的\
  \ 56 个是我们将实际实现的指令类型。我们在此枚举中列出了所有可能的指令类型——即使是未实现的——因为我们将使用一个自动生成的、包含所有 256 种可能的 6502\
  \ 操作码（opcodes）的表格，我们希望表格中的每个条目都有一个有效的指令类型值。\n\n`Instruction` 指 6502 可能理解的 256 种操作码之一。每条指令都包含关于其类型（`type`）、我们程序中处理它的关联函数（`method`）、内存访问模式（`mode`）、预期字节数（`length`）、运行所需的\
  \ CPU 周期数（`ticks`）以及在执行过程中跨越内存页时所需的额外周期数（`page_ticks`）。*内存页*是 RAM 的一部分，内存控制器可以快速地从该部分的任何部分访问另一个部分。在\
  \ 6502 中，内存页为 256 字节。如果一条指令跨越了这些 256 字节的边界，执行时间可能会更长。\n\n每条指令都有一个关联的函数来处理，这暗示我们将使用的设计与\
  \ CHIP-8 项目完全不同。对于 CHIP-8 虚拟机，我们使用一个巨大的 `match` 语句来处理每条指令，但对于 6502 及其稍微复杂的指令集，我们将利用一种更简洁的设计。我们不会对每条指令进行切换，而是根据其操作码在数组中查找，然后执行关联的函数。这种设计是常用模式*跳转表*（jump\
  \ table）的一种变变体。本质上，我们通过操作码对指令数组进行索引，以找到要跳转到哪个函数。\n\n`Joypad` 类代表程序执行期间手柄的状态。CPU\
  \ 可以直接轮询手柄。`CPU` 类代表处理器的状态。接下来，让我们看看 CPU 类的开头，它设置了内存、寄存器和可配置变量：\n\n```python\nclass\
  \ CPU:\n    def __init__(self, ppu: PPU, rom: ROM):\n        # 与其它部分的连接\n      \
  \  self.ppu: PPU = ppu\n        self.rom: ROM = rom\n        # CPU 上的内存\n      \
  \  self.ram = array('B', [0] * MEM_SIZE)\n        # 寄存器\n        self.A: int = 0\n\
  \        self.X: int = 0\n        self.Y: int = 0\n        self.SP: int = STACK_POINTER_RESET\n\
  \        self.PC: int = self.read_memory(RESET_VECTOR, MemMode.ABSOLUTE) | \\\n\
  \                    (self.read_memory(RESET_VECTOR + 1,\n                     \
  \                 MemMode.ABSOLUTE) << 8)\n        # 标志位\n        self.C: bool =\
  \ False # 进位\n        self.Z: bool = False # 零\n        self.I: bool = True # 中断禁用\n\
  \        self.D: bool = False # 进制模式\n        self.B: bool = False # 中断\n      \
  \  self.V: bool = False # 溢出\n        self.N: bool = False # 负数\n        # 其他状态\n\
  \        self.jumped: bool = False\n        self.page_crossed: bool = False\n  \
  \      self.cpu_ticks: int = 0\n        self.stall: int = 0 # 停顿周期数\n        self.joypad1\
  \ = Joypad()\n```\n\n为了更好地理解这段设置代码，让我们深入研究 6502 的寄存器。表 6-3 列出了所有寄存器。\n\n表 6-3：6502\
  \ 寄存器\n\n| 名称 | 大小（字节） | 用途 |\n| --- | --- | --- |\n| A | 1 | 用于算运算的主寄存。有时被称为累加器。\
  \ |\n| X | 1 | 索引寄存器，通常用循环计数器。 |\n| Y | 1 | 与 X 相同。 |\n\n\n\n\n\n| Register | Size\
  \ | Description |\n| :--- | :--- | :--- |\n| PC | 2 | 程序计数器，用于跟踪下一条执行指令在内存中的位置。它是\
  \ 2 字节，是因为 6502 可以寻址高达 64KB 的内存（不使用分页切换）。 |\n| SP | 1 | 栈指针，用于跟踪程序当前在栈上的位置。由于它只有\
  \ 1 字节，栈最多可以存储 256 字节。 |\n| P | 1 | 状态或标志寄存器。其各个位表示不同的含义，例如有关算术运算的信息（例如结果是否为零？），或者是否发生了中断或是否启用了中断\
  \ (IRQ)。 |\n\n由于 Python 对所有大小的整数仅使用一种类型，因此我们将除标志位以外的所有寄存器都用 `int` 类型表示。我们没有去处理状态寄存器中每个标志位的各个比特位，而是使用\
  \ 6502 文档中字母命名法将它们划分为独立的 `Booleans`。这些是成员变量 `C`、`Z`、`I`、`D`、`B`、`V` 和 `N`。它们大多数是算术运算的结果设置的，`I`\
  \ 在程序不希望被 `IRQ` 信号中断时设置，`B` 在断点（break）指令后将标志推入栈中时设置。用于 BCD 代码的 `D` 标志对 NES 而言无关，因为\
  \ NES 没有 BCD 指令。\n\n`jump` 变量用于跟踪跳转指令是否更改了 `PC` 寄存器，而 `page_crossed` 用于跨内存页访问内存时的簿记，正如所讨论的，跨页访问内存比访问相邻内存的开销更大。NES\
  \ CPU 可能需要等待若干周期以完成某些任务。这就是 `stall` 的目的。在我们的模拟器中，它仅在发生直接内存访问 (`DMA`) 传输以从主内存发送大量数据到对象属性内存\
  \ (`OAM`) 时使用，PPU 在那里存储有关精灵的信息。\n\n### 跳转表\n\n接下来，我们将声明跳转表，包含 6502 可以处理的所有潜在指令的列表。由于\
  \ 6502 使用 1 字节的操作码，且一个字节有 256 种可能的值，因此潜在上存在 256 条不同的指令。稍后在我们的 `step()` 方法中，我们将通过此列表进行索引，为我们解码的给定操作码获取特定指令及其对应的函数。我们不会实际上实现每条指令（有些是\
  \ BCD 或非官方指令），因此某些指令被关联到 `self.unimplemented()` 方法。\n\n为了完整起见，跳转表的全部 256 行包含在此处：\n\
