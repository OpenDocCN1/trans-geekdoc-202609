  \        if not jumped:\n            self.pc += 2 # 程序计数器自增\n```\n\n### 测试虚拟机\n\n\
  \n\n\n\n测试虚拟机（VM）最细粒度的方法是为每条指令编写我们自己的单元测试。对于每项测试，我们都将尝试运行一条指令，然后验证虚拟机随之其后的内部状态是否正确。虽然这是最理想的，但考虑到时间和空间，我们将采用一种更类似于集成测试的方法：看看我们的虚拟机在运行真实的\
  \ CHIP-8 程序时表现如何。它们运行得正确吗？\n\n恰巧的是，甚至有一些测试 ROM 可以为测试 CHIP-8 虚拟机提供一种“一站式”服务。这两个测试\
  \ ROM 包含在本书源码仓库的 `Chip8/Tests` 子目录下。这两个测试 ROM 都是由其开发者以开源许可发布的，这些许可也包含在子目录下。让我们从仓库的根目录运行第一个测试\
  \ ROM：\n\n```\n%python3 -m Chip8 Chip8/Tests/chip8-test-rom/test_opcode.ch8\n```\n\
  \n如果虚拟机工作正常，你应该能看到满屏幕的 OK，如图 5-2 所示。\n\n![Figure 5-2: 运行第一个测试 ROM](img/Figure_5-2.jpg)\n\
  \n图 5-2：运行第一个测试 ROM\n\n现在让我们用第二个测试 ROM 检查我们的工作：\n\n```\n%python3 -m Chip8 Chip8/Tests/chip8-test-rom-2/chip8-test-rom.ch8\n\
  ```\n\n这一个会在左上角显示一次 OK（请阅图 5-3）。\n\n![Figure 5-3: 运行第二个测试 ROM](img/Figure_5-3.jpg)\n\
  \n图 5-3：运行第二个测试 ROM\n\n这些测试并不是详尽的，但它们是一个很好的起点。现在是时候进行终极集成测试了：我们的虚拟机能准确地运行游戏吗？\n\n\
