  \n\n\n\n通常，在 DDF 概念背景下，`DDF 站 #3：模型设计` 在数据管理和模型覆盖方面最具理论性。考虑到我们的业务挑战和业务策略，我们在这一站的任务是在理论基础上设计设计一个“防弹”的建模框架。简而言之，我们负责构建“顶尖”的模型特征和能力。在这里，我们设计模型输出、测试以及我们自己的库，这些最终将在\
  \ `DDF 站 #4：实现` 中转换为交付给业务的生产级产品。具体而言，我们的目标是设计一个从新闻中提取情感的模型。首先，我们查看预定义和预训练模型，然后探索使用之前\
  \ `第 7 章` 中涵盖的 `LSTM` 模型框架从零开始构建自己的模型。\n\n### VADER\n\n`VADER (情感感知字典和情感推理器)` 是一种基于规则的情感分析工具，专门设计用于分析社交媒体文本（基本上是通用开放语言上下文）。`VADER`\
  \ 是一个预训练的情感分析模型，可为给定文本提供情感得分[8.3]。`VADER` 使用词汇字典和规则来确定文本的情感。它为每个单词使用效性评分（valence\
  \ score）来确定其正面或负面。效性评分范围从 `-4` 到 `+4`，其中 `-4` 为最负，`+4` 为最正。`VADER` 还考虑了情感的强度，这可以通过大写和标点符号来确定。为了使用该模型，我们需要在\
  \ `Python` 中利用 `NLTK` 库[8.4]。\n\n> `NLTK` 是用于构建 Python 程序以处理人类语言数据的领先平台。它为 50 多个语料库和词汇资源（如\
  \ `WordNet`）提供了易于使用的接口，以及一套用于分类、分词、词干、标记、解析和语义推理的文本处理库，以及工业级 NLP 库的封装。\n\n#### 单词\n\
  \n为了继续进行，我们引入了一些处理文本数据格式的技术。我们从词汇极性分析开始。我们在`“第 3 章: 数据可视化””`中强调了 `TensorFlow` 工具。在这里，我们关注极性如何在情感分析中使用。\n\
  \n273.\n\n```\n# 加载亚马逊评论数据集\ndf = pd.read_csv('https://raw.githubusercontent.com/pycaret/pycaret/master/datasets/amazon.csv')\n\
  \ \n# 创建 preprocess_text 函数\ndef preprocess_text(text):\n    # 文本分词\n    tokens\
  \ = word_tokenize(text.lower())\n    # 去停用用\n    filtered_tokens = [token for token\
  \ in tokens if token not in stopwords.words('english')]\n    # 词性还原标记\n    lemmatizer\
  \ = WordNetLemmatizer()\n    lemmatized_tokens = [lemmatizer.lemmatize(token) for\
  \ token in filtered_tokens]\n    # 将标记重新连接回字符串\n    processed_text = ' '.join(lemmatized_tokens)\n\
  \    return processed_text\n \n# 将函数应用于 df\ndf['reviewText'] = df['reviewText'].progress_apply(preprocess_text)\n\
  \ \n# 统计整个 'reviewText' 列中最常见的单词\ndef basic_preprocess_text(text):\n    tokens =\
  \ text.split()\n    return tokens\n```\n\n#### 语句\n\n如前所述，我们探索了 `VADER` 模型，特别是 `8.4`\
  \ 所示的 `sentiment()` 函数。\n\n```\ndef analyze_sentiment(text):\n    \"\"\"使用 VADER\
  \ 分析情感\"\"\"\n    analyzer = SentimentIntensityAnalyzer()\n    scores = analyzer.polarity_scores(text)\n\
  \    return scores\n\ndef classify_sentiment(compound_score):\n    \"\"\"根据复合得分分类情感\"\
  \"\"\n    if compound_score >= 0.05:\n        return 'Positive'\n    elif compound_score\
  \ <= -0.05:\n        return 'Negative'\n    else:\n        return 'Neutral'\n```\n\
  \n274.\n\n```\ndef process_sentiment_analysis(json_path):\n    \"\"\"处理情感的主函数\"\"\
  \"\n \n    # 加载数据\n    data = load_json_data(json_path)\n    if data is None:\n\
  \        return\n \n    # 初始化 VADER 分析器\n    analyzer = SentimentIntensityAnalyzer()\n\
  \ \n    # 处理每篇文章\n    results = []\n \n    for article in data:\n        article_id\
  \ = article.get('id', 'Unknown')\n        title = article.get('title', 'No Title')\n\
  \        body = article.get('body', '')\n        source = article.get('source',\
  \ 'Unknown')\n        categories = article.get('categories', '')\n \n        # 分析文本的情感\n\
  \        sentiment_scores = analyzer.polarity_scores(body)\n \n        # 创建结果\n\
  \        result = {\n            'id': article_id,\n            'title': title[:100]\
  \ + '…' if len(title) > 100 else title, # 截断长标题\n            'source': source,\n\
  \            'categories': categories,\n            'body_length': len(body),\n\
  \            'negative': sentiment_scores['neg'],\n            'neutral': sentiment_scores['neu'],\n\
  \            'positive': sentiment_scores['pos'],\n            'compound': sentiment_scores['compound'],\n\
  \            'sentiment_label': classify_sentiment(sentiment_scores['compound'])\n\
  \        }\n \n        results.append(result)\n \n    # 转换为 DataFrame 以便于分析\n  \
  \  return pd.DataFrame(results)\n```\n\n275.\n\n```python\n# 加载亚马逊评论数据集\ndf = pd.read_csv('https://raw.githubusercontent.com/pycaret/pycaret/master/datasets/amazon.csv')\n\
  \ \n# 创建 preprocess_text 函数\ndef preprocess_text(text):\n    # 文本分词\n    tokens\
  \ = word_tokenize(text.lower())\n    # 去停用用\n    filtered_tokens = [token for token\
  \ in tokens if token not in stopwords.words('english')]\n    # 词性还原标记\n    lemmatizer\
  \ = WordNetLemmatizer()\n    lemmatized_tokens = [lemmatizer.lemmatize(token) for\
  \ token in filtered_tokens]\n    # 将标记重新连接回字符串\n    processed_text = ' '.join(lemmatized_tokens)\n\
  \    return processed_text\n \n# 将函数应用于 df\ndf['reviewText'] = df['reviewText'].progress_apply(preprocess_text)\n\
  \ \n# 统计整个 'reviewText' 列中最常见的单词\ndef basic_preprocess_text(text):\n    tokens =\
  \ text.split()\n    return tokens\n```\n\n\n\n从图 8.6 可以明显看出，在从加密货币领域提取的 50 篇文章中，有\
