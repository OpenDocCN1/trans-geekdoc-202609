  \n## 绘图\nplt.figure(figsize=(12, 6))\n\n### 子图 1：词云\nplt.subplot(1, 2, 1)\nplt.imshow(wordcloud,\
  \ interpolation='bilinear')\nplt.axis('off')\nplt.title('文本词云')\n\n### 子图 2：情感趋势\n\
  plt.subplot(1, 2, 2)\nplt.plot(sentiments, marker='o', linestyle='-', color='blue')\n\
  plt.axhline(0, color='red', linestyle='--', linewidth=1)\nplt.title('情感分析趋势')\n\
  plt.xlabel('句子索引')\nplt.ylabel('情感得分')\nplt.tight_layout()\nplt.show()\n\n### 打印常用词\n\
