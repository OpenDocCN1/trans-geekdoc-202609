  \ 返回文本。⏎\n\n# 第 12 章 金融科技中的数据前沿\n\nDOI: [10.4324/9781003477747-15](https://doi.org/10.4324/9781003477747-15)\n\
  \n## 12.1 引言\n\n在最后一个章节，我们将向读者介绍金融科技的前沿。\n\n首先，我们讨论了金融和银领域中语音和视频等替代数据结构的概念。本书的重点是之前章节第\
  \ 368 页所涵盖的文本数据结构。然而，正如本章强调的，有更大的空间去探索其他数据格式以提取最新的信息。这些数据形式源于客户服务电话、视频互动和社交媒体，提供了传统数据往往会错过的丰富见解。例如，在金融科技领域，公司正利用语音分析来评估客户情绪，这反过来影响了信用评分和风险评估模型。这种对数据的创新利用有助于创建更准确、更个性化的金融产品。此外，视频数据正被通过人脸识别增强安全措施，并通过视频\
  \ KYC（了解您的客户）程序简化客户入驻流程。然而，这些技术的整合并非没有挑战。数据隐私问题、对复杂 AI 算法的需求以及数据解释中的潜在偏差都是需要解决的重大障碍。\n\
  \n然后，我们讨论了 AI 代理体（AI Agents），这是一种通过将机器学习和 AI 技术整合为更具凝聚力的“思考”代理体来提供无监督决策和解决方案的新方法。AI\
  \ 代理体被视为使用 AI 模型理解目标、生成任务并智能完成任务的软件工具。银行领域 AI 的一个显著例子是机器人投顾的使用，如第 9 章所示。这些由 AI 驱动的平台提供个性化的财务建议和投资组合管理服务，使投资策略对更广泛的受众可用。通过机器学习，这些顾问可以不断学习并适应市场变化，提供符合个人财务目标的定制化建议。金融领域中扩展且独立的\
  \ AI 代理体的益处多方面的。它们通过提供更快、更准确的服务增强了运营效率，降低了成本并提高了客户满意度。此外，AI 分析大型数据集的能力使银行能够对客户行为获得更深入的见解，从而实现更有针对性和更有效的营销策略。\n\
  \n最后，我们讨论了量子计算。在本节中我们专注于非技术性的解释。量子计算机可以解密我们今天进行的每一次加密金融交易。与使用比特处理信息的经典计算机不同，量子计算机利用量子比特，允许指数级加速的数据处理和问题解决。想象这样一个世界：目前需要几天甚至几周的复杂金融模型和风险评估可以在几秒钟内完成。这就是量子计算的变革潜力。\n\
  \n### 学习成果\n\n* 概述金融科技的前沿领域\n* 解释 AI 代理体\n* 理解量子计算\n* 概述视频和语音能力\n* 探索相关的挑战与机遇\n\n\
  ## 12.2 数据结构\n\n在书中，我们关注数值和文本数据结构。如今，这已经不够了。正如之前的章节所述，非结构化来源产生了今天 80–90% 的新数据。这些替代数据流涵盖了社交媒体对话、卫星图像、客户音频和视频日志以及文本文档。传统的分析方法往往会错过这些宝贵的信息源。此外，AI\
  \ 工具产生了不断增加的数据输入到 AI 驱动的决策工具中，并产生数据输出。确定真理来源可能变得至关重要。除了文本数据流外，其他非结构化数据变体（语音、视频、静态图片）将被金融科技解决方案消费和利用。\n\
  \n传统的金融数据形式是投资决策的基础。然而，在今天瞬息万变的市场中，这些数据并不适用，因为情况每分钟都在变化而不是每季度。过时的数据使投资者错过机会并面临更大的投资风险。如何处理并根据最新数据采取行动已成为投资成功的关键。\n\
  \n### 季度收益滞后\n\n实际业务表现与投资者已知信息之间的差距在季度报告期间变得非常大。市场状况在等待期间可能会发生剧烈变化。投资者使用每天日益过时的信息做出选择。这种报告制度产生了另一个问题——公司面临巨大的压力，无论如何都要达到其短期收益目标。\n\
  \n研究显示了这种季度压力带来的令人担忧的风险。加州的一项研究显示，最可能错过季度收益目标的公司向 OSHA 报告的工伤率高出 5% 到 15%。这意味着在收益压力最大的公司中，每\
  \ 24 名员工中就有 1 人受伤，而其他公司为每 27 人中 1 人 [12.1]。\n\n\n\n\n\n控制季度数字的压力迫使公司做出损害其长期价值的选择。公司可能通过达到季度目标来避免短期股价下跌。但这些权宜之计会在未来产生问题，因为它们会影响到公司的运营方式和其职场文化。\n\
  \n这些问题确实存在，但关于公司应该多久报告一次的辩论仍然复杂。澳大利亚和许多欧盟国家允许公司每年报告两次，而美国公司必须每季度报告。有些人认为，降低报告频率可以减少短期思维和成本。尽管如此，来自沃顿学院和乔治敦大学的专家指出，半年报告存在重大问题：\n\
  \n1. 公司可能会更加努力掩盖自己的错误\n2. 随着秘密被隐藏的时间更长，可能会发生更多内幕交易\n3. 透明度降低可能导致投资者失去信任\n\n唐纳德·兰格沃沃特（Donald\
  \ Langevoort）教授解释道：“这种减慢周期并[不再频繁要求]正式披露的想法，意味着越来越多的秘密将在公司内部浮存更长时间，这将引发大量的内幕交易活动。”\n\
  \n370。\n\n## 公开披露中的信息不对称\n\n传统的财务数据面临的不仅仅是时间问题。它还遭受着信息不对称的影响——即一组人比其他人了解更多。这在交易中创造了不公平的，在极端情况下可能导致市场问题，甚至导致市场完全失败。\n\
  \n财务研究人员和金融科技从业者特别关注经理与外部投资者之间的信息差距。这些差距导致了当优质项目无法获得资金时投资过少，或者当错误的借款人获得资金时投资过剩。这就是为什么拥有优质项目的经理试图通过不同方法证明自己的价值，例如提供抵押、承担短期债务或设定较低的\
  \ IPO 价格。\n\n定期的财务披露文件不能很好地弥补这种信息差距。研究显示，每 10 个人中只有 1 人真的仔细阅读过这些文件，大多数人则跳过了大部分。人们给出了两个主要原因：\n\
  \n* 文件太难理解了——它们冗长、复杂且充满了技术术语\n* 信息没有用处——它们没有为个人情况提供实用的见解\n\n财务术语在这些披露中流传，使得普通人很难弄懂。这违背了披露的主要目的：帮助人们做出明智的决策。\n\
  \n### 替代性数据流\n\n为了解决之前提到的收益缺口和信息不对称问题，并考虑到现在更容易获取视频或语音格式的替代性数据流，金融科技运营者现在关注传统报表之外，使用替代数据源来做出决策。这代表了财务决策方法的根本性变化。非结构化的语音和视频内容是金融市场上最有价值但未被充分利用的替代数据类型。传统指标可以很容易分类和分析结构化数据。然而，语音和音频信息需要先进的分析才能获取在常规指标出现之前指示市场波动的有用信息。\n\
  \n### 用于客户情绪的呼叫中心录音\n\n呼叫中心产生了大量的未使用数据，显示了客户情绪趋势、常见问题和行为变化。AI 驱动的呼叫中心情绪分析可以识别客户对话中隐藏的情绪，将其标记为积极、消极或中性。这项技术利用自然语言处理和机器学习，跨语音通道、聊天和反馈识别客户的语气、意图和情绪。\n\
  \n自动情绪分析提供了关于用户对产品和服务真实感受的详细图景，这远比仅仅逐一听听电话或开展焦点小组。系统首先使用自动语音识别（`ASR`）将通话录音转换为文本。然后文本经过分词（`tokenization`）——将其分解为单词或短语等较小的单元——以理解上下文和关系。\n\
  \n371。这些变化带来了重大的业务成果。使用情绪分析的呼叫中心可以：\n\n* 立即发现负面情绪并干预\n* 看到整体客户情绪并改进运营\n* 根据检测结果更好地分配资源\n\
  \n### 财报会议音频与 CEO 语气分析\n\n研究显示，CEO 在财报会议期间的语音模式包含了除文字之外的有价值信息。这种分析技术非常先进。研究人员在某项研究在使用根据许多警方审讯开发的软件，用以检测人们何时撒谎、兴奋或隐藏信息。这项研究显示，财务分析师擅长发现\
  \ CEO 的积极情绪，但往往会错失认知失调或高管隐藏信息的迹象。\n\n语音分析产生了可衡量的市场影响。与仅使用语言模型相比，将语音加入基于文本的情绪模型可以提高组合表现。研究还显示，CEO\
  \ 的演讲可以通过分析师建议的变化、意外收益和累计异常收益来预测公司的未来表现[[12.2]]。\n\n### 投资者演示视频文本\n\n投资者演示是另一个丰富的非结构化替代数据来源。视频录像不仅捕捉了说出的内容，还捕捉了视觉线、肢体语言和观众反应，这些可能预示着信心水平或公告的接收情况。像\
  \ EQ 这样的公司正在开发平台，分析如唤醒度（arousal）、情感（valence）和主导性（dominance）等情绪出现在语音中的关键指标。他们的技术利用\
  \ 20 年的数据集跟踪演讲者的节奏、分析师覆盖范围和全球趋势。这让 AI 能够检测演示中有意义的语气变化。\n\n财报会议和演示的问答环节提供了比准备好的陈述更多的信息。研究显示音频比文字记录告诉我们更多信息。音频中的情感信息与分析师的行为密切相关——管理层在声明部分的积极信息会让分析师更有可能发布报告。\n\
  \n## 使用语音和视频替代数据的挑战\n\n总而言之，作为替代数据的语音和视频内容重塑了金融市场分析。季度报告的滞后和信息差距使得传统的财务数据不再那么有用。投资者现在转向语音和视频替代数据以获取实时见解。客户情绪趋势在影响季度结果之前就已经出现在呼叫中心录音中。CEO\
  \ 在财报会议期间的语音模式可以准确预测股价波动。\n\n\n\n\n这些能力的存在得于先进的技术。机器学习和人工智能通过语音转文本模型、命名实体识别 372.\
  \ 以及情感提取，将非结构化的语音数据转化为实用的洞察。前前的道路充满了挑战。GDPR 和其他隐私规则对个人信息的处理制定了严格限制。语音和视频数据需要巨大的存储空间以及如\
  \ 256 位 AES 加密等韧性安全措施。金融术语的复杂性增加了分析的难度，因此模型需要针对这些领域进行特定训练。简而言之，传统的财务指标仍然重要，但这些替代性视角揭示了人类交流中隐藏的信号。金融科技的前沿可以定义为微妙的语调、情感暗示和语言模式，这些因素往往在常规指标出现之前就能预测市场波动，从而提供了机会。\n\
  \n## 12.3 AI 智能体\n\n在讨论金融科技的前沿时，如果不提到 AI 智能体将是不智的。AI 智能体是使用 AI 模型理解目标、生成并智能完成任务的软件工具。与传统程序不同，AI\
  \ 智能体同时处理包括文本、语音、视频、音频和代码在内的多模态信息。这些系统可以独立做出决策、解决问题并与外部环境交互。该领域显示出重大进展，特别是在软件方面，随着新的\
  \ AI 模型和智能体框架变得越来越可靠。AI 智能体正成为 AI 驱动世界的新型应用。它们通过增加自主性、任务自动化以及如何通过各种工具与现实世界交互，增强了语言模型的能力\
  \ [12.3]。\n\nAI 智能体远比其简单定义要复杂。这些自主软件实体观察其环境，在没有人工监督的情况下做出决策并采取特定目标采取。它们可能代表了我们与人工智能系统工作方式的革命性变化。AI\
  \ 智能体颖而出是因为它们在获得第一个提示（prompt）或目标后就能独立工作。传统软件遵循严格的规则。AI 智能体可以评估目标，将任务拆分为更小的部分，并创建自己的方法来实现特定结果。这种独立性帮助它们处理跨不同平台和服务的复杂流程。\n\
  \n决策制定是 AI 智能体工作的核心。这些智能体将金融科技输入（数据、感知信息、先验知识）转化为金融科技输出（行动、预测、建议）。它们使用多种方法进行决策：\n\
  \n*   **基于规则的系统**：使用预定义的 `if-then` 规则进行结构化决策\n*   **机器学习算法**：从数据中学习以识别模式，进行更灵活的决策\n\
  *   **强化学习**：通过与环境交互并获取反馈做出决策\n*   **深度学习**：使用神经网络进行复杂的模式识别\n*   **概率推理**：处理不确定或歧义的情况\n\
  \nAI 智能体具有不同程度的独立性。高级智能体可以切换它们的推理，就像汽车的前远光灯。这种对资源的智能利用使得它们能够高效地处理复杂任务。\n\n## 比较：AI\
  \ 智能体 vs AI 助手 vs 机器人\n\nAI 智能体、助手和机器人各有一个不同的用途，尽管人们经常将它们混淆：\n\n373.\n\n| 特性 | AI\
  \ 智能体 | AI 助手 | 传统机器人 |\n| :--- | :--- | :--- | :--- |\n| 自主性 | 高 – 初始提示后独立运行 |\
  \ 中 – 需要用户的持续输入 | 低 – 遵循僵化的脚本 |\n| 决策能力 | 复杂，可以设计自己的工作流 | 建议性，等待用户批准 | 极小，遵循预定义路径\
  \ |\n| 学习 | 持续学习，存储之前的操作 | 根据交互进行某些适应 | 有限或不学习 |\n| 任务复杂度 | 处理多步骤、复杂的任务 | 协助完成特定任务\
  \ | 简单、例行的任务 |\n| | 工具使用 | 可以决定使用哪些工具 | 在人类指导下有限地使用 | 预定义的工具集成 |\n\nAI 智能体显示出几种独特能力：\n\
  \n1. 它们将复杂的工作流拆分为可操作的步骤，并识别任务之间的联系\n2. 它们的持久性记忆有助于它们记住过去的交互，以提供更好的响应\n3. 它们会成为特定领域的专家，并与其他智能体协作解决复杂问题\n\
  4. 它们了解其所在环境，并能够在条件变化时改变策略\n\n仅仅因为大语言模型 `LLM` 可以使用工具并不意味着它是一个智能体。真正的 AI 智能体独立运行并选择使用哪些工具。基于基础模型构建的智能体不仅仅是聊天。它们会解决问题并规划下一步。\n\
  \n# 基于能力的 AI 智能体类型\n\nAI 智能体从简单的反应式系统到复杂的学习实体不等。它们的分类取决于决策能力和内部架构，这构成了一个智能系统的层级。\n\
  \n### 简单反射智能体及其局限性\n\n简单反射智能体是 AI 代理基本的形式。它们仅根据当前感知使用条件动作规则工作。这些智能体使用直接的 `if-then`\
  \ 逻辑，不跟踪历史或未来状态。温度器就像简单的反射智能体——当温度低于阈值时开启加热，达到理想水平时关闭。其设计保持简单——传感器检测变化，条件动作规则决定响应，执行器执行这些操作。这些智能体在所有信息都可见的环境中表现最好。尽管如此，简单反射智能体具有\
  \ 374. 主要限制。它们无法记住过去状态，这导致它们在部分观测环境中容易陷入死循环。\n\n### 具有内部状态的模型反射智能体\n\n基于模型的反射智能体通过维护一个世界的内部图像，解决了其简单对应物的主要问题。这些智能体跟踪它们无法直接看到的环境部分。这种内部状态有两个重要作用：它帮助智能体理解世界如何发生变化；它还监控智能体的行动如何影响周围。能够绘制地图并记住已清理区域的扫地机器人展示了这种能力。即使障碍物不在传感器范围内，它也能引导自己。这些智能体总是用新信息和过去的知识更新它们的内部模型。\n\
  \n### 目标型和效用型智能体\n\n\n\n\n基于目标的智能体通过思考行动的潜在风险迈出了重要的一步。与其仅仅响应触发器，这些智能体会根据目标的达成来评估行动。基于效用的智能体通过为不同状态添加“快乐”分数进一步推进了进展。在仅仅达到目标时，基于效用的智能体会尝试计算最可能的输出。自动驾驶汽车展示了这种能力，它们同时优化安全性和舒适度。智能体之间的区别至关重要。基于目标的智能体判断行动的完成，而基于效用的智能体则比较质量。\n\
  \n### 带有反馈循环的学习体\n\n学习体是最先进的类别。它们通过经验变得更好。这些智能体具有四个核心部分：一个选择行动的元素、一个改进决策的元素、一个提供反馈的批评者以及一个建议新经验的问题生成器。反馈循环驱动着学习体，这种机制检测错误并将修正后的数据反馈输入。如果没有反馈，这些智能体将在可能性中游荡。通常情况下，智能体会不断更新其内存系统以保持上下文并使未来的交互更好。有效的内存管理带来了挑战，因为简单的添加对话会遇到限制。高级内存系统区分两种类型：\n\
  \n- **短期记忆**：像滚动缓冲区一样工作，持有最近的交换和输入\n- **长期记忆**：在多个会话中保留信息，以实现定制体验和知识留存\n\n内存结构根据重要性、时性和相关性对信息进行分类。这种方法平衡了完整内存与高效计算。智能体通过结合规划、工具集成和智能内存，在实时环境中适应变化的情况。\n\
  \n### 部署智能体的挑战与风险\n\n这些自主系统可以被设计来做出决策，但随着其权限增长，潜在的故障模式变得更加复杂和危险。\n\n#### 无限反馈循环与工具故障\n\
  \n组织在部署智能体时面临许多运营障碍。这些系统可能会陷入无限循环并重复相似的行动而不走向目标。通过设置停止点并改进推理能力，团队可以防止系统瘫痪。当参数传递错误或输出被误读时，工具调用也会损害生产环境中的可靠性。\n\
  \n#### 安全漏洞与数据隐私\n\n智能体面临多种安全威胁。提示注入是最危险的之一，它可以泄露敏感数据或改变智能体的行为。配置不当的工具产生了更多攻击方式，而不安全的代码让系统受到随机执行的影响。连接到多个系统的智能体可能会暴露未经授权的数据，误处理受保护的信息并意外传输资产。\n\
  \n#### 高风险领域的伦理考量\n\n医学、法律和金融等高风险领域没有针对智能体的正式许可框架，这导致了监管问题。当智能体做出有害决策时，确定谁负责变得非常困难——责任可能落在开发者、组织或用户身上。人们对\
  \ AI 期待完美却接受人类错误，这让情况变得糟糕。AI 系统可能会以违背人类价值观的方式完成任务。清晰的伦理指南变得至关重要，特别是对于处理敏感数据或做出重要决策的系统。\n\
  \n## 12.4 量子计算\n\n量子计算机可以破解我们今天进行的每一次加密金融交易。这不是科幻。全球金融机构都在准备应对这种威胁。量子安全加密是保护全球万亿财富的关键盾。随着量子计算机的加速，网络安全世界面临着根本性的变化。传统的加密方法无法抵抗量子计算的力量。国立标准与技术研究院（NIST）已开始标准化抗量子解决方案。金融科技从业者现在应该过渡到抗量子安全系统，而不是等到量子计算机到来。\n\
  \n本节解释了量子安全加密的工作原理，以及为什么保护财富如此重要。读者将了解到金融机构、财务顾问和财富经理为准备量子时代需要采取的实际步骤。\n\n### 理解量子计算威胁\n\
  \n量子计算对我们的金融安全系统带来了前所未有的挑战。研究显示，95%的组织认为量子计算将显著影响当前的加密安全系统[12.4]。这从根本上改变了保护财富的方式。\n\
  \n经典计算机使用二进制位（0 和 1）处理信息。量子计算机通过量子比特利用量子力学实现了前所未有的计算能力。量子计算的工作方式与传统系统不同：\n\n| 维度\
  \ | 经典计算 | 量子计算 |\n| --- | --- | --- |\n| 处理单元 | 比特 (0,1) | 量子比特 (叠加态) |\n| 计算速度\
  \ | 线性 | 指数级 |\n| 问题解决 | 顺序执行 | 并行处理 |\n\n经典计算机依赖比特作为简单的信息单元，比特只存在两种状态：0 或 1。量子计算机通过量子比特（`qubits`）工作，利用量子力学现象来实现实质不同的能力。量子比特可以处于叠加态，并同时代表\
  \ 0 和 1。这一独特属性允许单个量子比特同时处理多种可能性。纠缠（`Entanglement`）增加了另一个迷人的维度，无论量子比特之间的距离多远，它们都会相互连接。一个纠缠量子比特的状态会瞬间影响另一个。拥有\
  \ $n$ 个量子比特的量子计算机理论上可以通过纠缠同时表示 $2^n$ 个状态，而 $n$ 个经典比特仅代表一个状态。\n\n经典计算机按顺序顺序执行操作。量子计算机利用量子并行性，通过叠加态探索许多计算路径。这种并行处理能力解释了为什么量子系统解决某些问题的速度比经典系统快得多。\n\
  \n\n\n尽管目前的量子系统拥有强大的计算能力，但面临着巨大的能量挑战。研究显示，处理简单问题时，量子计算机消耗的能量是经典计算机的 155,308 倍。对于经典系统无法执行的复杂计算，这种能量成本变得值得投入。新的理论框架表明，对于特定问题，量子计算可以比经典计算实现指数级的能耗优势。随着量子技术的发展，能效差距可能会缩小，使得量子方法在风险建模和投资组合优化等资源密集型金融应用中更具可行性。\n\
  \n377. 谷歌的量子计算机显示其能够在 200 秒内完成一项特定任务。世界上最快的超级计算机完成相同任务则需要 10,000 年 [12.5]。\n\n目前的加密方法面临着严峻影响。这些关键漏洞存在：\n\
  \n* `公钥基础设施 (PKI)`：量子计算机可以破解大多数保护银行交易和业务数据的加密工具\n* `数字签名`：身份验证系统变得易受到量子驱动的伪造攻击\n\
  * `密钥交换协议`：目前的安全通信方法将失效\n* `数据存储`：长期数据安全受到损害\n\n完全的量子优越性尚未到来，但进展十分迅速。中国科学技术大学利用其光量子计算机“九章”实现了量子优越性。他们的计算机在\
  \ 200 秒内完成的计算，经典系统需要 25 亿年 [12.6]。\n\n威胁现在已经存在，通过“现在收集，后解密”攻击。攻击者窃取加密文件并等待量子能力出现后进行解密\
  \ [12.5]。只有 25% 的公司在其风险管理策略中应对这一威胁。\n\n金融科技从业者必须立即行动。米歇·莫斯卡（Michele Mosca）博士的定理表明，数据安全寿命\
  \ (`X`) 加密系统升级时间 (`Y`) 必须超过量子计算机破解当前加密所需 (`Z`)。这产生了实现抗量子解决方案的迫切需求。\n\n### 后量子加密基础\n\
  \n量子安全加密领域通过 NIST 的详细标准化过程达到了一个重要里程碑。这一倡议应对了量子威胁，并建立了韧性标准，以保护量子时代的金融资产。NIST 于 2016\
  \ 年启动的后量子加密项目引发了加密开发领域前所未有的全球合作。该过程评估了来自 25 个国家的 82 算法，并确定了前 15 个候选算法。全球密码学家参与了开放、透明的评估过程，通过多轮测试提供了全景\
  \ [12.6]。\n\n标准化的抗量子算法已经出现并被选用于特定的加密需求：\n\n| 算法类型 | 选标准 | 主要用途 |\n| --- | --- |\
  \ --- |\n| 通用加密 | `CRYSTALS-Kyber (ML-KEM)` | 密钥交换与加密 |\n| 数字签名 | `CRYSTALS-Dilithium\
  \ (ML-DSA)` | 主要签名算法 |\n| 备用签名 | `SPH+ (SLH-DSA)` | 基于哈希的替代方案 |\n\n这些算法作为我们的第一道防御层。挑战经典计算机和量子计算机的数学问题是这些解决方案的基础。数学家彼特·山（Peter\
  \ Shor）1994 年的算法对 RSA 加密构成了严重威胁，RSA 是现代金融安全的基础。经典计算机对大数进行分解需要极不实际的时间。量子计算机可以使用 `Shor’s\
  \ Algorithm` 极大 378 倍地完成此任务。这一突破可能会破解 RSA 以及其他保护银行交易、财务记录和客户数据的加密方法。一旦量子计算机达到合适的规模，这些加密系统可能会在几分钟或几小时内失效。其影响不仅限于\
  \ RSA，还影响了保护目前大多数数字金融通信的 Diffie-Hellman 密钥交换和椭圆曲线加密 (`ECC`)。在实施这些新标准方面存在几个主要障碍：\n\
  \n* `性能限制`：分析显示，沉重的计算需求对处理能力有限的设备构成了挑战\n* `集成复杂性`：抗量子算法与经典加密的混合需要精细化管理\n* `认证要求`：不同地区具有严格的认证流程，包括\
  \ `CC`、`FIPS` 和 `ETSI` 标准\n\n这种过渡需要详细的计划，因为抗量子原语带来了新的漏洞和复杂性。金融系统既需要速度也需要安全，因此平衡韧性安全与实际性能需求仍然是首要目标\
  \ [12.7]。\n\n## 12.5 总结\n\n在最后一章中，我们向读者介绍了了科技领域的前沿发展。首先，我们探索了金融和银行业中`替代数据结构 (alternative\
  \ data-structures)`，包括语音和视频。虽然之前的章节主要关注文本数据结构，但本章强调了多样化数据格式在提取实时洞察方面的巨大潜力。这种向多样化数据格式的转变正为金融领域的创新和效率开辟新途径。\n\
  \n接下来，我们研究了`AI 代理 (AI Agents)`，这是一种将机器学习和人工智能技术集成到更全面的、能够自主决策并提供解决方案的“认知”代理中的创新实现方法。\n\
  \n最后，我们研究了`量子计算 (Quantum Computing)`，对这项革命性技术进行了非技术概述。量子计算机具有解码所有当前加密金融交易的潜力，带来了机遇和挑战。尽管这项技术仍处于婴儿阶段，但它对网络安全和数据加密的影响是深远的。\n\
  \n总之，我们在本章中探讨的金融科技进展仅仅是一个开始。替代数据结构、AI 代理和量子计算的整合将改变金融行业。通过强调网络安全、区块链、数字支付、代币化和机器人投顾等领域，我们突出了金融科技动态不断演变的本质。\n\
  \n## 12.6 概念问答\n\n* Q1：量子计算与经典计算在性能上有何区别？\n  A1：量子计算机利用量子比特、叠加和纠缠同时处理多种可能性，使其在处理某些任务时比经典计算机快得多\
  \ 379.。这使得量子计算在复杂的金融建模和优化问题中非常有价值。\n\n* Q2：量子计算在金融领域有哪些实际应用？\n  A2：量子计算应用于金融多个领域，包括投资组合优化、衍生品定价、欺诈检测和实时风险建模。这些应用允许金融机构更有效地处理海量数据，做出更准确的预测并对市场状况做出快速反应。\n\
  \n* Q3：量子计算对金融安全有什么影响？\n  A3：量子计算在提供巨大收益的同时，也对金融系统中使用的现有加密方法构成了威胁。像山尔算法这样的量子算法可能会破解广泛使用的加密标准，因此需要开发抗量子加密来保护金融数据和交易。\n\
  \n* Q4：金融机构目前正在使用量子计算吗？\n\n\n\n\n\n## A4: 是的，许多主要的金融机构已经在尝试并实施量子计算解决方案。他们主要使用混合量子经典系统来获得增量收益，同时为未来更先进的量子能力做准备。\n\
  \n## Q5: 金融机构应如何为量子计算时代做准备？\n\nA5: 金融机构可以通过对员工投资量子素养培训计划、实验混合量子经典系统、实施后量子加密标准，以及与监管机构合作构建量子安全金融系统来准备。现在建立专业知识并测试应用程序，将使机构能够在未来量子驱动的金融生态系统中蓬勃发展。\n\
  \n## Q6: AI 智能体（AI agents）有哪些真实案例？\n\nA6: AI 智能体正被各个行业。例如，在金融领域，摩根大通的 `COiN`平台利用\
  \ AI 审查法律文件，与人工律师相比，显著缩短了时间并提高了准确性。在客户服务领域，`Zendesk` 等公司已经实施了可以自主处理高达 80% 客户交互的\
  \ AI 智能体。\n\n## Q7: 使 AI 智能体有效运行的关键组件有哪些？\n\nA7: AI 智能体依赖于几个核心组件来有效运行。这些包括用于维护上下文的短期和长期记忆系统、用于访问外部资源的工具使用和\
  \ `API` 集成、用于拆解复杂目标的规划和任务分解能力，以及用于迭代决策和适应的推理循环。\n\n## Q8: 部署 AI 智能体面临的主要挑战是什么？\n\
  \nA8: 部署 AI 智能体面临着若干挑战。这些包括无限反馈循环的风险（即智能体重复执行相同操作而无进展）、如提示词注入（prompt injection attacks）之类的安全漏洞、数据隐私担忧和伦理问题，特别是在医疗和金融等高风险领域。此外，当\
  \ AI 智能体做出有害决策时，确定责任归也面临挑战。\n\n## Q9: 什么是替代数据？它为什么在金融领域如此重要？\n\n380. A9: 替代数据是指用于金融分析的非传统信息源，例如社交媒体帖子、卫星图像和信用卡交易。它之所以重要，是因为它提供了独特的见解，可以改进投资决策和风险管理策略。\n\
  \n## Q10: 多模态 AI 如何增强替代数据分析？\n\nA10: 多模态 AI 结合了不同类型的数据（文本、图像、音频）来创建一个统一的理解。这种方法通过分析各种数据格式之间的关系，允许获得更全面的见解，模拟了人类处理信息的方式。\n\
  \n## Q11: 在金融决策中使用替代数据的优势是什么？\n\nA11: 替代数据提供了传统金融数据往往缺乏的实时见解。它使投资者能够更快地识别新兴机会和风险，从而做出更科学的市场决策并获得潜在的竞争优势。\n\
  \n## Q12: 语音和视频分析如何贡献市场预测？\n\nA12: 语音和视频分析可以提取有价值的信息，例如财报会议期间 CEO 的语气，或来自支持互中的客户情绪。这些见解已被证明与未来的股票表现和客户流失相关，为市场波动提供了独特的预测能力。\n\
  \n## Q13: 金融机构在实施语音和视频替代数据时面临哪些挑战？\n\nA13: 关键挑战包括数据隐私和合规性问题、高存储和处理需求，以及特定领域金融语言的复杂性。克服这些障碍需要复杂的技术以及数据科学家与金融分析师之间的紧密合作。\n\
  \n## Q14: 自然语言处理（NLP）技术是如何应用的？\n\nA14: `NLP` 技术被用于语音转文本、实体识别和情感提取。\n\n## Q15: 为什么数据科学家之间的协作很重要？\n\
  \nA15: 数据科学家与金融分析师之间的协作确保了 `NLP` 输出与投资目标保持一致。\n\n\n\n\n\n*   `AdviceTech` 293–294,\
