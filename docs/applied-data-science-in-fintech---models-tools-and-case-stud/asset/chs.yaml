  \ #2` 中，我们为进一步处理准备特征。在这里我们手动选择相关特征，而不是使用算法，并分析基础统计数据，绘制出传递到我们模型设计和实现的最终特征。我们强调了正态性的重要性，即数据符合正态分布。原因有很多；但对于我们的案例中，考虑到来自\
  \ `DDF Station #1` 的数据，我们继续进行特征提取。\n\n```python\ndef calculate_returns(df):\n  \
  \  \"\"\"计算各种类型的收益\"\"\"\n    # 简单收益\n    df['Simple_Return'] = df['Price'].pct_change()\n\
  \    # 对数收益\n    df['Log_Return'] = np.log(df['Price'] / df['Price'].shift(1))\n\
  \    # 移除 NaN 值\n    df = df.dropna()\n    return df\n```\n\n结果得到如下序列摘要，包含 148 个每日观测值：\n\
