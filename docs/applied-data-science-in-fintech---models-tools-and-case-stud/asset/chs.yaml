  \n![图 9.7 相关性矩阵 返回文本。⏎](img/fig9_7.jpg)\n\n**图 9.7** 相关性矩阵 返回文本。⏎\n\n## 9.5 模型设计\n\
  \n在*本节*中我们查看用于预测性能的模型。\n\n### 现代组合理论\n\n现代组合理论（MPT）是一种用于优化风险与收益投资组合的数学框架。哈里·马科维茨在\
  \ 20 世纪 50 年代提出的理论改变了投资者对风险和多元化的思考方式。其核心原理是，通过精细选择运动不完全相关的资产组合，可以在不牺牲收益的情况下降低风险。这通过“有效前沿”的概念形式化。\n\
  \n资产配置的基本理论假设我们采取多头寸，这意味着财富分配在可用资产中，且头寸总和为 100%。该理论假设投资者是理性的且厌恶风险，即在相同风险水平下追求更高收益，或在相同收益下追求更低风险。理论还假设市场是有效的，且资产收益遵循正态分布。这在加密市场中并不成立。\n\
  \n\n\n\n\n```python\nimport pandas as pd\nimport numpy as np\nnp.random.seed(42)\n\
  # number of assets\nnoa = 5\ndata = {\n  'Risky' : 50*np.exp((-0.01-0.5*0.78**2)*1+0.78*np.sqrt(1)*np.random.standard_normal(365)),\n\
  \  'Flat' : 10*np.exp((-0.01-0.5*0.01**2)*1+0.01*np.sqrt(1)*np.random.standard_normal(365)),\n\
  \  'SmallCap' : 10*np.exp((-0.01-0.5*0.5**2)*1+0.5*np.sqrt(1)*np.random.standard_normal(365)),\n\
  \  'LargeCap' : 100*np.exp((-0.01-0.5*0.1**2)*1+0.1*np.sqrt(1)*np.random.standard_normal(365)),\n\
  \  'Gold' : 1000*np.exp((-0.01-0.5*0.05**2)*1+0.05*np.sqrt(1)*np.random.standard_normal(365))\n\
  }\n \n#Now lets place \"a\" into Pandas DataFrames and name our columns\ndf = pd.DataFrame(data)\n\
  \ \n#Add some dates into the DataFrame index\ndates = pd.date_range('2019-1-1',\
  \ periods=365, freq='D')\ndf.index = dates\n \n#Calculate returns and covariance\
  \ matrix\nrets = np.log(df / df.shift(1))\nprint(rets.mean() * 252)\nprint(rets.cov()\
  \ * 252)\n \n#Setup random portfolio weights\nweights = np.random.random(noa)\n\
  weights /= np.sum(weights)\n \n#Derive Portfolio Returns & simulate various 2500x\
  \ combinations\nprint(np.sum(rets.mean() * weights) * 252)\nprint(np.dot(weights.T,\
  \ np.dot(rets.cov() * 252, weights)))\n \nprets = []\npvols = []\nfor p in range\
  \ (2500):\n  weights = np.random.random(noa)\n  weights /= np.sum(weights)\n  prets.append(np.sum(rets.mean()\
  \ * weights) * 252)\n  pvols.append(np.sqrt(np.dot(weights.T,\n                \
  \              np.dot(rets.cov() * 252, weights))))\n \nprets = np.array(prets)\n\
  pvols = np.array(pvols)\n```\n\n根据之前的代码，我们生成了五种随机证券动态和组合权重，然后计算了整体的**预期组合收益**和预期组合方差。然后，我们模拟了\
  \ 2500 种组合组合，其中夏普率（SR）的计算公式如下：\n\n`SR`  = (`μ`[`p`]−`r`[`f`])/*`σ`[`p`]\n\n308.\
  \ 如图图 9.8 所示的视化解释，最低 SR 比率正好位于市场线之上。图表将 SR 结果插入到预期收益与预期波动率的图中：这为我们开始建模具有可行风险配置的投资组合提供了基础，而不是某些在风险/收益权衡方面不“高效”的组合。在这里我们观察模型设计阶段。两种证券之间的**协方差**定义为\n\
  \n`σ`[`i`, `j`]  = `σ`[`j`, `i`]  `E`[`i`]−`μ`[`j`])\n\n那么证券自身的方差是与其自身协方差的特殊情况，定义为\n\
  \n`σ`[`i`]²  = `E`[`i`]−`μ`[`i`])\n\n因此，对于证券组合，矩阵形状定义为\n\n$$\\sum = \\begin{bmatrix}\
  \ \\sigma_{1}^{2} & \\sigma_{12} & \\ldots & \\sigma_{1I} \\\\ \\sigma_{21} & \\\
  sigma_{2}^{2} & \\ldots & \\sigma_{2I} \\\\ \\ldots & \\ldots & \\ldots \\\\ \\\
  sigma_{I1} & \\sigma_{I2} & \\ldots & \\sigma_{I}^{2} \\end{bmatrix}$$\n\n一旦我们推导出**组合协方差矩阵**，就可以计算预期组合方差：\n\
  \n$$\\sigma_{p}^{2} = E((r - \\mu)^{2}) = \\sum_{i\\in I}\\sum_{j\\in J}w_{i}w_{j}\\\
  sigma_{ij} = w^{T}\\sum w$$\n\n309. 然后，组合的标准差或波动率计算如下：\n\n在我们利用 Python 库 `from scipy.optimize\
  \ import minimize` 的理论示例中，通过 `min_func_variance()` 函数优化权重以最小化结果组合的方差。\n\n$$\\sigma_{p}\
  \ = \\sqrt{\\sigma_{p}^{2}}$$\n\n`statistics()` 定义了组合的数学解释：\n\n```python\ndef statistics(weights):\n\
  \    weights = np.array(weights)\n    pret = np.sum(rets.mean() * weights) * 365\n\
  \    pvol = np.sqrt(np.dot(weights.T, np.dot(rets.cov() * 365, weights)))\n    return\
  \ np.array([pret, pvol])\n\ndef min_func_variance(weights):\n    return statistics(weights)[1]\
  \ ** 2\n\n# 定义求解问题的条件\ncons = {'type': 'eq', 'fun': lambda x: np.sum(x) - 1}\nbnds\
  \ = tuple((0, 1) for x in range(noa))\noptv = minimize(min_func_variance, noa *\
  \ [1. / noa], method='SLSQP', bounds=bnds, constraints=cons)\n\nprint(optv)\nprint(optv['x'].round(3))\n\
  print(statistics(optv['x']).round(3))\n```\n\n模拟得到的预期收益为 -0.002%，组合标准差为 2.3%。\n\n\
  ```text\nRisky       0.104452\nFlat       -0.002611\nSmallCap    0.185814\nLargeCap\
  \    0.052193\nGold        0.010631\ndtype: float64\n```\n\n模型分配旨在最小化整个组合的方差，自然地返回了具有最高组合分配的资产：\n\
  \n```text\n[ Risky = 0\n Flat = 0.956\n SmallCap = 0\n LargeCap = 0\n Gold = 0.043]\n\
  ```\n\n基本上，模型建议将资金的 95.6% 投入资产（在加密货币领域可以是 USDT），4.3% 投入黄金。\n\n![图 9.8 预期收益与波动率](img/fig_8.jpg)\n\
  \n**图 9.8** 预期收益与波动率返回\n\n### 加密资产：最小方差\n\n310. 我们使用标准组合理论设计了模型，并提取了加密数据和模型所需的特征。现在我们使用实际数据执行此模型。\n\
  \n首先，我们初始化组合收益和波动率计算：\n\n```python\ndef portfolio_variance(weights, cov_matrix):\n\
  \    \"\"\"给定权重和协方差矩阵计算组合方差\"\"\"\n    return np.dot(weights, np.dot(cov_matrix,\
  \ weights))\n\ndef portfolio_return(weights, mean_returns):\n    \"\"\"计算预期组合收益\"\
  \"\"\n    return np.sum(mean_returns * weights)\n```\n\n第二步是使用之前的 `Scipy` 优化器设计优化函数，并制定最小化组合方差的目标。简而言之，我们的是仅投资于为组合收益提供最低风险的资产。\n\
  \n```python\ndef minimize_variance_portfolio(mean_returns, cov_matrix):\n    \"\"\
  \"寻找最小方差组合权重\"\"\"\n    n_assets = len(mean_returns)\n\n    # 目标函数：最小化组合方差\n   \
  \ def objective(weights):\n        return portfolio_variance(weights, cov_matrix)\n\
  \n    def negative_sharpe_ratio(weights):\n          \"\"\"最小化目标函数（负夏普率）\"\"\"\n\
  \        _, _, sharpe = portfolio_stats(weights)\n        return -sharpe\n\n   \
  \ # 约束：权重和为 1\n    constraints = {'type': 'eq', 'fun': lambda x: np.sum(x) - 1}\n\
  \n    # 边界：权重在 0 和 1 之间（仅多组合）\n    bounds = tuple((0, 1) for _ in range(n_assets))\n\
  \n    # 初始猜测：等权重\n    initial_guess = np.array([1/n_assets] * n_assets)\n\n    #\
  \ 优化\n    result = minimize(objective, initial_guess, method='SLSQP',\n        \
  \              bounds=bounds, constraints=constraints)\n    return result.x if result.success\
  \ else None\n```\n\n注意，这里我们定义了目标函数以及任何约束。\n\n结果见图 9.9，显示了为了最小化组合方差而在市场上执行的单个资产权重：\n\
  \n```text\nOptimal Weights:\nADA: 0.0000 (0.00%)\nBNB: 0.1832 (18.32%)\nBTC: 0.1816\
  \ (18.16%)\nDOGE: 0.0000 (0.00%)\nETH: 0.0000 (0.00%)\n```\n\n```text\nSOL: 0.0000\
  \ (0.00%)\nSUI: 0.0000 (0.00%)\nTRX: 0.0000 (0.00%)\nUSDT: 0.6351 (63.51%)\nXRP:\
  \ 0.0000 (0.00%)\n \nPortfolio Metrics:\nExpected Daily Return: 0.0006 (0.06%)\n\
  Expected Annual Return: 0.2126 (21.26%)\nDaily Volatility: 0.0088 (0.88%)\nAnnual\
  \ Volatility: 0.1672 (16.72%)\nSharpe Ratio: 1.2714\n```\n\n\n\n\n\n![图 9.9 投资组合配置：最小方差收益返回到文本。⏎](img/fig9_9.jpg)\n\
  \n**图 9.9** 投资组合配置：最小方差 返回到文本。⏎\n\n在我们的案例中，我们遵循现代投资组合理论（MPT）模型的样本内应用，不包含任何额外功能。简而言之，我们假设所有权重之和为\
  \ 1，对于将所有资本分配到此风险敞口的多头仅投资组合。我们使用等权重初始化优化器。\n\n### 加密资产：最大化夏普比率\n\n在节一节中，我们涵盖了一个简单的投资组合配置示例，旨在最小化最终预期组合表现的方差。根据定义，我们可能会看到在资产类别选择中分配到方差最低的资产。显而易的问题是，是否存在另一种资产配置方法，可以在假设更高风险承受能力的情况下，旨在提供更高的预期收益。\n\
  \n基于你之前的代码序列，在这里我们通过利用最小化 `Scipy` 函数来优化，以最大化夏普比率，因此 `negative_sharpe_ratio()` 函数带有一个负号。\n\
  \n312.\n\n```\ndef negative_sharpe_ratio(weights, returns, cov_matrix, risk_free_rate):\n\
  \    \"\"\"用于最小化的目标函数（负夏普比率）\"\"\"\n    _, _, sharpe = portfolio_stats(weights,\
  \ returns, cov_matrix, risk_free_rate)\n    return -sharpe\n \ndef optimize_portfolio(returns,\
  \ cov_matrix, risk_free_rate):\n    \"\"\"优化投资组合以最大化夏普比率\"\"\"\n    n_assets = len(returns.columns)\n\
  \ \n    # 约束\n    constraints = ({'type': 'eq', 'fun': lambda x: np.sum(x) - 1})\
  \  # 权重之和为 1\n \n    # 边界（每个权重 0 到 1 - 不卖空）\n    bounds = tuple((0, 1) for _ in\
  \ range(n_assets))\n \n    # 初始估计值（等权重）\n    initial_guess = np.array([1/n_assets]\
  \ * n_assets)\n \n    # 优化\n    result = minimize(negative_sharpe_ratio,\n     \
  \                 initial_guess,\n                      args=(returns, cov_matrix,\
  \ risk_free_rate),\n                      method='SLSQP',\n                    \
  \  bounds=bounds,\n                      constraints=constraints)\n    return result.x\n\
  ```\n\n从图 9.10 可以观察到等权重分配将交付 1.5 的夏普比率，而最优权重交付的夏普比率在 2.44 附近。\n\n![图 9.10 最大化夏普比率收益返回到文本。⏎](img/fig9_10.jpg)\n\
  \n**图 9.10** 最大化夏普比率 返回到文本。⏎\n\n313. 优投资组合的结果：\n\n```\n=== 优投资组合（最大夏普比率） ===\n无风险利率:\
  \ 2.00%\nADA: 0.00%\nBNB: 0.00%\nBTC: 0.00%\nDOGE: 0.00%\nETH: 0.00%\nSOL: 0.00%\n\
