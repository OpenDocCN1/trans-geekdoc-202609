  \  {'area':7352.0,'perimeter':3869.32,'shape':0.117063, 'permeability':6.3},\n \
  \ {'area':7943.0,'perimeter':3948.54,'shape':0.122417, 'permeability':17.1},\n])\n\
  \ \nprint(df)\n```\n\n大多数可以应用于 `Series` 对象的的操作也可以应用到 `DataFrame` 对象上——结果是从一维到二维维的自然泛化。\n\
  \n```\nimport pandas as pd\n \ndf = pd.DataFrame([\n  {'area':4990.0,'perimeter':2791.9,\
  \ 'shape':0.0903296,'permeability':6.3},\n  {'area':7002.0,'perimeter':3892.6, 'shape':0.148622,\
