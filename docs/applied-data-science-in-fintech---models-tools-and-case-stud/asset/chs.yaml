  \            # 时间戳转换为 datetime\n            df['datetime'] = pd.to_datetime(df['time'],\
  \ unit='s')\n            df['date'] = df['datetime'].dt.date\n \n            # 添加符号列\n\
  \            df['symbol'] = symbol\n \n            # 调整列顺序\n            columns\
  \ = ['symbol', 'date', 'datetime', 'open', 'high', 'low', 'close', 'volumefrom',\
  \ 'volumeto']\n            df = df[columns]\n            # 按日期排序\n            df\
  \ = df.sort_values('date')\n \n            return df\n \n        except requests.exceptions.RequestException\
  \ as e:\n            print(f\"Request error for {symbol}: {e}\")\n            return\
  \ None\n        except Exception as e:\n            print(f\"Unexpected error for\
  \ {symbol}: {e}\")\n            return None\n```\n\n注意，我们提取了每日“收盘”价格，并对小时频率执行了类似的代码序列。这是\
  \ CryptoCompare 预定义的快照价格，因为加密货币是 24/7 交易的。我们依赖此阶段的数据质量。\n\n下一步是为每个货币对设计数据提取调用 API。这对于我们的目的足够，但在生产环境中由于效率和速度问题，将会增强。\n\
  \n300。\n\n```python\n    def extract_multiple_coins(self, symbols, days=365, interval='daily',\
  \ output_dir='crypto_data'):\n        \"\"\"\n \n        提取多个加密货币的价格历史\n \n    \
