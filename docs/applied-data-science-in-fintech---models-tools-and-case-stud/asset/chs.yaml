  \n53.\n\n## 3.1 引言\n\n本章的目的是扩展和丰富我们之前对数据结构、算法以及数字数据工厂（`DDF`）概念的介绍，并进入数据可视化领域。在节奏飞快的银行业行业中，`数据可视化`已成为一种强大的工具，将原始数字转化为可操作的洞察。这种创新技术允许金融机构对复杂的数据集`描绘出一幅生动的蓝图`，让专家和初学者都能轻松理解。从跟踪市场趋势到分析客户行为，数据可视化为金融信息注入了生命，使专业人士能够一眼看出模式和异常。对于银行高管或金融科技（FinTech）专业人士，它提供了组织绩效的`全局视角`，而数据分析师则可以通过交互式图表和图形深入细粒度细节。即使是普通大众也能受益，因为友好的可视化消除了个人财务的神秘感，赋予个人对自己的金钱做出明智决策的能力。在一个时间就是金的行业里，数据可视化正在重塑我们理解和与金融数据交互的方式。\n\
  \n数据可视化已成为`游戏改变者`，这场革命的核心在于利用`结构化`和`非结构化`数据的能力。结构化数据整齐地组织在传统数据库中，为财务报告提供了支撑。然而，是非结构化数据——从社交媒体情绪到新闻文章——增加了金融分析的深度，例如，通过复杂且动态的仪表板提供了市场趋势的`360\
  \ 度全景`。然而，仪表板只是冰山一角。金融领域的`视觉产品`已经进化到包括复杂的的热力图、网络图甚至增强现实显示。这些工具不仅仅是展示数据；这些工具的设计目的是为了讲述故事，让所有利益相关者都能理解复杂的金融概念。这些视觉工具对决策的影响是不言而喻的。这些工具的建立旨在缩短对市场变化的反应时间，改进风险评估并实现金融洞察的民主化。\n\
  \n首先，我们介绍了数据结构的示意化方法和数据处理流程图。然后，我们利用最先进的编程库展示了结构化和非结构化数据结构的可视。我们使用加密货币和相关的文本数据流（如加密货币相关的新闻）进行这一阐述。最后，我们深入探讨\
  \ `Streamlit` 和 `Figma`，向金融科技专业人士介绍这些工具，以增强和构建高度动态且引人注目的视觉驱动型产品。我们以行业案例研究作为结束。本章建立在第\
  \ 1 章的基础上。\n\n### 学习成果\n\n在本书章结束时，读者将能够：\n\n* 理解数据可视化在银行业重要性\n* 熟悉 `Streamlit` 和\
  \ `Figma`\n* 介绍结构化和非结构化数据结构的可视化\n\n## 3.2 数据处理\n\n数据处理流程图对于概述这一旅程中采取的逻辑和顺序步骤至关重要。在此，我们使用\
