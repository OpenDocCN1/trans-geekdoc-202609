  \n**图 2.4** 核心数据架构概念 返回正文。⏎\n\n## 2.4 云计算在金融中的应用\n\n云计算应用的出现彻底改变了金融科技的世界。云基础设施使金融科技公司能够利用灵活性、扩展性和成本效益的优势。它还实现了更快的软件实施，允许公司快速适应不断变化的市场趋势和客户偏好。\n\
  \n金融科技公司面临的主要问题之一是数据安全，而云计算在这方面改变了游戏规则。云提供商在安全措施上投入了大量，例如加密、访问控制和监控，以确保敏感客户数据得到保护。这让金融科技公司有了在云端存储和处理数据的信心，从脱了维护自身基础设施和安全协议的负担。然而，随着云计算在金融科技中使用的增加，对监管的关注也越来越多。监管机构在确保保护方面的要求变得日益严格。\n\
