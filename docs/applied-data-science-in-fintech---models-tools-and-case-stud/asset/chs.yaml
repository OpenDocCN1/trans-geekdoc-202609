  \ CSV\n    `df2.to_csv(export_path)`\n    `return df2`\n\n## 提示词选择\n\n提示词工程（或者我们说的提示词选择）已成为一个关键环节，特别是在处理表格数据的特征选择时。通过利用\
  \ LLM 提示、特征重要性、降维和相关性分析等高级技术，数据科学家和 AI 研究人员可以显著增强他们的分析能力。\n\n- **提示** 涉及利用大语言模型生成相关的提示词来引导特征选择。这种技术可以发现传统方法可能会忽略的模式和洞察。\n\
  - **特征重要性**是另一种关键技术，它根据预测能力对特征进行排序，使分析人员能够关注最重要的变量。\n- **降维**技术（例如 `PCA`，主成分分析）有助于通过减少变量数量来简化复杂数据集，这不仅提高了计算效率，还增强了分析的清晰度。\n\
  - **相关性分析**用于识别并量化不同特征之间的关系，确保冗余或高度相关的特征得到适当处理，正如站点 #1 中所示。\n\n通过整合这些技术，金融科技运营人员、数据科学家和业务分析师可以实现更准确高效的特征选择，从而获得更好的模型性能和更可靠的洞察。提示词选择并不是一门科学，它取决于练习的各个方面以及所使用的\
  \ LLM 模型。提示词选择的演变性质促使我们建议在提示设计中使用伪代码序列，以缩小 LLM Co-pilot 返回的工具范围。\n\n\n\n\n\n在这种案例中，我们来看一下\
