  \n## 第 3  金融科技应用\n\n# 第 9 章 金融科技应用\nDOI: 10.4324/97810034774712\n\n## 9.1 引言\n\n\
  在本章中，我们将连接书中涵盖第 1 节和第 2 节的内容。本章从 AdviceTech 的用例概述开始。我们向读者介绍了该领域从业者面临的问题，并通过在 DDF\
  \ 概念范围内分步骤实施用例，提供了潜在的解决方案，交付一个利用`现代投资组合理论`的金融科技解决方案的核心大纲。在模拟中，读者假设自己是加密机器人顾问（crypto\
  \ roboAdvisor）中的金融从业人员，并负责解决预定义的问题并交付技术驱动的解决方案。\n\n现代投资组合理论的核心思想来自理解风险与收益的权衡——这是一个将高风险与高回报联系起来的交易原则。MPT\
  \ 假设投资者回避风险，因此当两个投资组合提供相似预期收益时，他们自然会选择风险较低的选项。这一假设揭示了重要的一点：只有在获得更高预期收益的情况下，投资者才会承担更多风险。想要更高预期收益的人必须接受更多风险。MPT\
  \ 认为，当存在另一个风险收益特征更好的选项时，理性的投资者不应选择某个投资组合。\n\n首先，我们定义了 Crypto AdviceTech 用例。机器人顾问是一种自动化的数字投资管理平台，使用\
  \ ML/AI 算法提供最少人工干预的金融投资和交易服务。我们让读者接触加密市场的世界。其次，我们应用了`金融科技数字数据工厂`概念。在每个 DDF 站中，我们概述了新技术并展示了新工具。从\
  \ `DDF 站 #1: ETL` 到 `DDF 站 #4: Implementation` 存在内在的数据流。我们通过构建一个简单的金融科技产品原型来结束本章。\n\
  \n### 学习成果\n\n在本章结束，读者将能够：\n* 理解加密市场结构\n* 概述现代投资组合理论背后的理论概念\n* 重新定义 DDF 概念并应用于实际设置\n\
  * 理解 DDF 站的数据流\n* 使用 `Streamlit` 库绘制金融科技解决方案原型图\n* 领会加密交易中的边界与机遇\n\n### 9.2 金融科技用例\
  \ – Crypto AdviceTech\n\nAdviceTech 是金融科技的一个细分领域，专门专注于设计用于支持财务顾问和咨询业务的技术解决方案。机器人顾问是一种自动化的数字投资管理平台，利用算法和软件在最少人工干预的情况下提供财务规划服务。这些平台通常通过让用户完成有关其财务目标、风险承受能力、投资期限和当前财务状况的在线问卷来工作。然后机器人顾问利用这些信息创建并管理多元化的投资组合，通常由低成本的交易基金（ETF）或指数基金组成。平台会自动平衡投资组合以维持目标资产配置。在本章中，我们将使用与加密市场相关的假设用例逐一关注每个金融科技`数字数据工厂站`。\n\
  \n> 市场分析平台（如 altFINS）在提供最新的加密市场信息方面发挥着关键作用。\n\n\n\n\n\n通常，全球市场结构包括资本市场、债券交易、外汇市场、货币交易、股票市场、股票交易、商品市场、商品交易以及加密市场、加密货币交易。我们在“第\
  \ 5 章:比特币与代币化”中区分了加密货币和资产代币化。像 Robinhood 这样的金融科技平台正在研究代币化方法，可能会将所有这些市场结合[9.2]。\n\
  \n加密市场是指买卖和交易加密货币或其他山寨币的数字市场，如图 9.1 所示。这些市场在全球范围内 24/7 运行。加密市场是去中心化的金融生态系统，比特币、以太坊数千种其他加密货币等数字资产在此交换。与传统的股票市场不同，它们持续运行没有休息时间，且全球可访问。\n\
  \n![图 9.1 altFINS 加密货币筛选器 返回文本。⏎](img/fig9_1.jpg)\n\n**图 9.1** altFINS 加密货币筛选器 返回文本。⏎\n\
  \n加密市场的关键特征：\n\n* 高波动性：价格在短时间内可能会发生剧烈波动\n* 24/7 交易：与传统交易所不同，市场永不关闭\n* 全球可访问性：任何可以使用互联网的人都可以参与\n\
  * 去中心化本质：在某些情况下没有单一机构控制整个市场，但并非总是如此\n* 流动性因而异：比特币等主流加密货币具有高流动性，而较小的“山寨币”交易量可能有限\n\
  * 易受客攻击：在区块链内部架构之外存在许多安全漏洞（数量众多）\n* 缺乏监管：几乎不存在全球性的控制和法规\n\n此外，市场参与者与其他市场结构也有所不同。参与者包括寻求风险的个人零售投资者、机构投资者和量化交易员、提供流动性的加密货币交易所、做市商，以及维护网络安全的矿工和验证者。交易在现货市场、期货市场和衍生品市场、ETF（在股票市场交易的上市工具）、去中心化金融（DeFi）协议和点对交易中进行。总体而言，有几个流行的交易所交易平台，如\
  \ Coinbase、Binance（安币）或 Kraken。\n\n296.\n\n### 工作坊\n\n在这个工作坊中，我们假设你已经担任了在加密市场运行的市场参与者，并在一家全球性投资银行或对冲基金的交易和对冲交易台工作。你的任务是在预测算法中实现先进技术，并为投资组合选择挑战设计合适的方法，并设计一种在加密货币交易中提供投资组合策略的\
  \ AdviceTech 产品，遵循图 9.2 中列出的步骤。\n\n![图 9.2 金融科技数字数据工厂 (DDF) 概念 返回文本。⏎](img/fig9_2.jpg)\n\
  \n**图 9.2** 金融科技数字数据工厂 (DDF) 概念 返回文本。⏎\n\n继“第 2 章:金融科技数据管理”之后，我们将依次探索每个数据工厂站点，并对每个站点的技术和工具提供详细说明，以便交付最终的金融科技产品。\n\
  \n## 9.3 数据湖\n\n### 加密市场\n\n`CryptoCompare API`是一项全面的加密货币数据服务，为数字资产提供实时市场信息。CryptoCompare\
  \ 提供了广泛的市场数据，包括数千种加密货币的当前价格、交易量和市值。`API`涵盖了数百家交易所的现货和衍生品市场。`价格数据端点`提供从分钟到每日不同时间间隔的当前和历史`OHLCV`（开盘价、最高价、收盘价、成交量）信息。`社交和新闻端点`聚合情绪数据、社交媒体指标和加密货币相关新闻。`交易所数据端点`提供交易对、交易所量和订单簿数据[9.3]。\n\
  \nCryptoCompare 聚合来自多个交易所的数据，并应用专利算法计算成交量加权平均价格（VWAP）和其他复合指标。它们实施数据验证和清洗过程，以确保准确性并过滤掉可能被操纵或错误的数据。CryptoCompare\
  \ 的核心组件：\n\n* 价格数据：数千种加密货币的实时和历史价格数据。提供法币和其他加密货币的数据。\n* 市场数据：交易量、市值和流动性的信息。来自多个交易所和交易对的数据。\n\
  * 交易数据：聚合数据和单个交易所数据。买卖价、订单簿数据和交易数据。\n* 社交数据：来自社交媒体平台和论坛的洞察和指标。社交媒体活动的趋势分析。\n* 区块链数据：区块链指标信息，如区块高度、区块时间和交易数据。有关挖掘难度、算力和网络活动的数据。\n\
  * 新闻和分析：来自各种来源的精选新闻文章和更新。对市场趋势和事件的分析和评论。\n* 交易所数据：加密货币交易所的详细信息，包括交易费用、支持的交易对和交易量。用于更细粒度分析的特定交易所数据。\n\
  * 指数数据：追踪市场特定板块表现的加密货币指数。基于用户定义的自定义指数。\n\n本章我们关注的是`数据数据和分析`。然而，书中介绍的技术可以扩展到涵盖之前的数据源。\n\
  \n297.\n\n### ETL\n\n首先，我们设置并处理公共 API 调用，以提取所选市值加密货币对的历史价格。这一步在设计上与我们之前提取“加密货币新闻”的练习相似。\n\
  \n```python\n# 定义要提取的加密货币符号\ncrypto_symbols = ['BTC', 'ETH', 'USDT', 'XRP', 'BNB',\
  \ 'SOL', 'TRX', 'DOGE', 'ADA', 'SUI']\n```\n\n\n\n\n\n```python\n    def get_daily_prices(self,\
  \ symbol, days=365, to_symbol='USD'):\n        \"\"\"\n \n        获取加密货币的每日价格历史\n\
