  \n此外，Juraj 还是兼职讲师和课程协调员，在银行、金融和金融科技领域教学，研究方向涵盖应用人工智能、金融数学、投资组合管理、资产定价、代币化、量化交易与投资以及行为金融学。\n\
  \n\nxiv.\n\n**循环神经网络 (RNNs)**：包含循环的人工神经网络，适用于处理序列。\n\n**卷积神经网络 (CNNs)**：灵感来源于大脑结构的人工神经网络。\n\
  \n**生成对抗网络 (GANs)**：通常使用两个在零和博弈中相互竞争的神经网络。\n\n**监督学习**：给定一组输入/预测 `x` 和输出/目标 `y`，目标是学习一个逼近\
  \ `y` 的函数 `f(x)`。\n\n**无监督学习**：给定多个对象/样本/交易 `x`，目标是学习一个隐藏映射 `h(x)`。\n\n**强化学习**：给定由多个状态\
  \ `s1`, `s2` ... `sn` 组成的环境、一个智能体和一个奖励函数，目标是学习一种指导智能体采取 `a1`, `a2` ... `ak` 的策略\
  \ `π`。\n\n**深度学习**：深度学习算法通过使用多个层对数据进行高层抽象。因此，我们试图学习的映射函数可以分解为若干复合操作 `f(x) = f1 ∘\
  \ f2 ∘ f3 ...∘ fn(x)`。\n\n**对抗学习**：对抗机器学习是机器学习领域的一种技术，旨在通过恶意输入“欺骗”模型。更正式地说，假设给定输入\
  \ `x` 关联标签 `c` 和机器学习模型 `f`，使得 `f(x) = c`，即 `f` 能够完美分类 `x`。如果 `x*` 与 `x` 无法区分且 `f(x*)\
  \ ≠ c`，我们认为 `x*` 是对抗样本。\n\n**迁移学习/元学习**：这两种学习范式紧密相关，因为它们的主要目标是封装从多个任务中学到的知识并将其迁移到新的未知任务中。\n\
  \nxv. **“大数据”**：通过计算分析的海量数据集，揭示模式、趋势和关联，特别是与人类行为和交互相关的。\n\n**金融、经济和社会媒体来源**：计算机程序从在线源抓取数据，或从另一个程序的人类可读输出中提取数据。公司文件、圣路易斯储备银行、Twitter\
  \ 和 Instagram 都是示例。\n\n**替代数据源**：从传统金融和经济来源收集的数据。替代数据金融通常指用于获取投资过程洞察的数据。\n\n**多数据源**：涉及整合来自多个不同信息源和存储的数据，为用户提供这些数据的统一视图。\n\
  \n\n\n\n\n- 情感分析：指通过计算方法识别和分类文本中表达的观点的过程，特别是为了确定作者对特定主题、产品等的态度是积极的、消面的还是中性的。\n\n\
  - **行为分析**\n：数据分析的一个领域，侧重于对人类行为提供洞察，通常涉及在线购买、互动或社交行为。\n\n- **预测性分析**\n：从现有数据集中提取信息以确定模式并预测未来结果和趋势的实践；例如犯罪预测。\n\
  \n- **ABI**\n：智能合约的应用二进制接口（Application Binary Interface）是一种与合约函数和数据进行交互的标准方法，本质上充当了可读代码（如\
  \ `Solidity`）与以太坊虚拟机（`EVM`）上的可执行字节码之间的桥梁。\n\n- **Ethereum**\n：以太坊是一个去中心化的区块链平台，允许开发者构建和部署智能合约以及去中心化应用（`dApps`）。\n\
  \n- **Bitcoin**\n：比特币是一种去中心化的数字，在没有政府或银行等中央机构的情况下运行。\n\n- **LSTM**\n：长短期记忆网络（Long-Short\
  \ Term Memory）是一种循环神经网络（`RNN`），旨在缓解传统 RNN 经常遇到的梯度消失问题。\n\n- **现代投资组合理论**\n：由诺贝尔奖得主哈里·马科维茨（Harry\
  \ Markowitz）在 20 世纪 50 年代开发，是一个构建最优投资组合的框架。\n\n- **量子计算**\n：一种新型计算类型，利用量子力学原理解决经典计算机无法处理的复杂问题。\n\
  \n- **AI Agent**\n：代表用户或其他系统执行任务的软件程序，利用 AI 进行决策、规划行动并适应其环境。\n\n- **GenAI**\n：使用复杂的算法将大型、复杂的数据集组织成有意义的信息聚类，以响应查询或提示并创建新内容，包括文本、图像和音频。\n\
  \n- **算法**\n：在计算或其他问题解决操作中需要遵循的过程或规则集，特别是由计算机执行的过程。\n\n- **前向传播**\n：输入数据通过正向馈神经网络以生成输出。数据被隐藏层接收并根据激活函数进行处理，然后移动到下一层。\n\
  \n- **反向传播**\n- 通过计算网络预测输出与实际输出之间的误差来工作，然后将此误差反向传播整个网络，以调整权重从而使整体误差最小化。\n\n- **VADER**\n\
  ：情感推理情感感知词典（Valence Aware Dictionary for sEntiment Reasoning）。一种用于社交媒体文本、产品评论和其他短文本的预构建情感分析模型。\n\
  \n# 前言\n\nxvii.\n\n金融科技（FinTech）的核心在于处理金融服务行业中不同类型的数据。学习各种类型的数据结构、建模框架和可用工具箱，以及它们的优缺点至关重要。在生成式人工智能时代，处理预测性分析和数据没有一劳永逸的解决方案。本书将帮助读者根据数据的特征（可以是定量或定性的、结构化或非结构化的）了解应该使用哪些数据结构、预测模型和数据库。完成本书后，读者预计将数据管理技能，并能够处理现实情况下可能许多不同的数据问题。\n\
  \n这是一本实用的且注重实践的书。本书的目标如下：\n- 开发银行业和金融背景下的数据处理技能\n- 接触最先进的数据建模和分析入门\n- 熟悉 `GenAI`\
  \ 技术\n- 熟悉 `FinTech` 产品设计\n- 熟悉 `Python` 库\n\n因此，本书旨在为希望理解金融、银行与技术之间联系的读者设计和开发。在书中，我们以应用的形式介绍了各种数据处理、分析和计算方法。它分为三个部分，涵盖了不同的方面，包括：\n\
  - 时间序列分析\n- 聚类\n- 现代投资组合理论\n- 预测性分析\n    - 自回归移动平均 (`ARIMA`)\n    - 循环神经网络 (`RNN`)\n\
  \    - 长短期记忆循环神经网络 (`LSTM`)\n    - 自然语言处理 (`NLP`)\n    - 大语言模型 (`LLM`)\n\n\n如果你是一名分析师、数据科学家或是了解金融和资本市场并对探索应用\
  \ AI 和数据科学技术有浓厚的毕业生，你会发现这本书非常相关。如果你是一个希望在领域内领先并弥合金融概念理论与实际应用之间差距的投资专业人士，也会发现这本书很有启发。通过将科学概念与实际应用相结合，本书提供了可以改变你对金融理解和方法的宝贵见解。\n\
  \n另一方面，如果你的背景是计算机科学、软件工程或机器学习（`ML`）和人工智能（`AI`），你可以跳过该领域的一些介绍性材料。本书最后一部分涵盖了金融和银行的应用技术，并将其分为具体的应用用例。为此，我们包含了大量的学术引用，并链接了\
  \ `GitHub` 仓库中的额外资源。\n\n\n第一部分涵盖了数据基础和数字数据工厂概念的核心方面。这是一个基础，是一块敲脚石，让读者接触数据素养的世界。它关注驱动贯本书讨论的\
  \ `ML` 和 `AI` 算法及策略的数据和数据处理过程。\n\n\n\n\n\n本章从介绍数据素养开始。我们将向读者介绍这项技能在金融和银行业专业领域的应用。随后，我们将继续讨论算法，以及为什么我们认为算法是任何金融科技解决方案的核心。在此阶段，我们向读者介绍了一个新的编程概念——`pseudocoding`（伪代码）。在书的其余部分中，我们将利用伪代码序列与\
  \ `AI copilots`（AI 辅助驾驶）和其他聊天机器人进行交互。最后，我们将深入探讨数据治理，涵盖了数据 AI 伦理、数据完整性和数据安全等重要概念。\n\
  \n在本章中，我们将从`数字数据工厂 (DDF)` 概念的角度研究数据管理的复杂性。从数字数据工厂视角来看，数据管理涉及数据湖的创建、提示词与特征工程、模型设计以及实施阶段或工作站，正如我们定义的这些术语的那样。这些过程对于帮助企业优化运营、改善客户体验以及驱动增长至关重要。\n\
  \n首先，我们介绍数据结构的示意化方法和数据处理流程图。然后，我们将利用最先进的编程库展示结构化和非结构化数据结构的可视化。我们将通过加密货币和相关的文本流（如加密货币相关新闻）进行阐述。最后，我们将深入研究\
  \ `Streamlit` 和 `Figma`，向金融科技专业人士介绍这些工具，以增强和构建高度动态化且引人入胜的视觉驱动型金融科技产品。\n# 第 4 章 (#Ch04.xhtml)，金融科技中的数据建模\n\
  在本章中，我们将数据建模与实现`数字数据工厂 (DDF)` 的尖端 AI 技术相结合。考虑到金融科技应用和服务的内在复杂性，聊天机器人、Co-Pilot 和 AI\
  \ Agent（AI 代理）等 AI 工具尚无法交付整个金融科技解决方案或整个产品。因此，我们引入了逻辑步骤序列（“工作站”）的概念，将数据建模和应用开发过程拆解为这些“相似任务口袋”，并缩小了使用\
  \ AI Agent 的目的。结果，我们遵循 DDF 数据流的概念，向读者介绍了在此语境下使用 AI 工具的新型尖端技术。\n\n第二节介绍了基础的监督和无监督学习算法，这些算法可以在金融和银行业应用中增加价值。在\
  \ DDF 概念的背景下，本节关注 `DDF Model Selection`（DDF 模型选择）阶段。本节介绍了先进的 Token 化方法，以及各种无监督学习技术，用于从关键替代数据源（书中限于文本数据格式）中提取高质量的信号和信息。\n\
  \n本章从介绍加密货币（即 `bitcoin`）开始。随后，我们将讨论去中心化金融 (`DeFi) 框架内的代币化概念。此时，我们引入 `blockchain`（区块链）作为一种在金融和银行用例中具有潜在用途的技术。最后，我们将向读者展示从编程角度利用智能合约的实际示例。我们使用\
