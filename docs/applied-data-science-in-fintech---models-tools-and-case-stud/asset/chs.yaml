  \ 脚本序列构建智能合约应用。本章的重点是资产代币化过程，以便为本书后续阶段的应用建立基础理解。最后，我们提供了一些相关的反方论点，从从业者的角度揭示了需要注意的区块链技术局限性。\n\
  \n### 学习成果\n\n* 介绍区块链技术\n* 概述去中心化背后的概念\n* 解释 CeFi 和 DeFi\n* 理解智能合约如何与金融科技解决方案中\n\
  * 概述替代资产和代币化\n* 探索相关的法律后果和困境\n\n## 5.2 区块链\n\n区块链是一种共享数据库或数字账本，用于在计算机网络中记录信息。系统不将数据存储在一个地方。相反，它与多个被称为“节点”的参与者共享该账本的副本。“区块链”这一名称源于其数据结构——信息通过加密技术被分组为“区块”，并通过“链”连接在一起。每个新区块都包含前一个区块的加密哈希（一个唯一的数字和字母字符串）[5.1]。这创建了一个如图\
  \ 5.1 所示的连续且连接的序列。区块链的革命性意义在于其运行方式。网络计算机必须通过共识来验证并批准任何新信息。经过验证的数据通过三个核心特征变得永久化，且几乎无法更改：\n\
  \n1. **去中心化** – 没有单一机构控制整个系统\n2. **分布式** – 计算机网络中存在多个副本\n3. **不可篡改性** – 一旦记录，信息几乎无法更改\n\
  \n这种设置创建了一个参与者信任数据而无需信任彼此的系统。该系统使得双方在没有银行或政府等中介验证交换的情况下，进行安全交易成为。\n\n![图 5.1 哈希指针](img/fig5_1.jpg)\n\
  \n**图 5.1** 哈希指针返回顶部\n\n区块链与传统数据库的主要区别在于它们的结构和控制方法。传统数据库有一个中心权威（通常是管理员）来管理、更新和保护所有信息。两家企业很少共享同一个数据库，因为会引发信任问题——数据库的控制者可以在另一方不知情的情况下更改记录。区块链完全改变了这种设置。每个参与者都保留一份完整记录历史的副本。当有人尝试更改信息时，网络会自动发现并修复任何不一致。以下是关键架构差异：\n\
  \n* **控制** – 传统数据库使用中心化的客户端/服务器模型，由一个实体完全控制。区块链使用点对点网络，将控制权分配给所有参与者。\n* **数据结构**\
  \ – 数据库以行和列表格的形式组织信息。区块链通过加密哈希连接按时间顺序的区块排列数据。\n* **安全性** – 传统数据库可以添加加密，但这是可选的。区块链从开始就内置了加密，使其天然更安全。\n\
  * **修改能力** – 授权的数据库用户可以编辑或删除现有数据。区块链只允许添加新信息，之前的记录保持不变，创建了永久的历史。\n\n区块链通过技术而非机构建立信任。使用区块链的公司不需要彼此信任；他们信任系统本身。如果一方尝试更改记录，区块链会立即显示谁尝试进行未经授权的更改。这种不可更改且透明的本质使得区块链对于需要高安全性、可验证的历史或可能不完全信任的双方之间的协调的应用具有价值。\n\
  \n### 区块链如何工作\n\n从 DDF 的角度来看，对于金融科技从业者来说，理解这种设计背后的细节是非常重要的。在第一阶段`DDF Extract, Transfer\
  \ and Load`中，我们处理初始的数据采集、数据处理和数据存储。这是真理来源。区块链是另一种处理数据结构并交付附加功能的形式，最终交付最终金融科技产品。从这个意义上说，区块链是一个分为四个步骤的数字记录：\n\
  \n1. **将交易记录为区块。** 区块链交易在广播到网络中所有计算机（节点）时开始。这些交易包含关键信息，发送者身份、数字签名、公钥和传输的数据量。交易不会直接进入区块链。它们停在一个称为内存池或“内存池”（mempool）的临时空间中。随着时间的推移，系统将这些交易分组为我们所谓的区块。区块可以容纳约\
  \ 4MB 的交易，一旦填满了经过验证的交易，就会被密封并进入下一步。\n\n\n\n\n\n## 2. 使用密码学链接区块。系统在区块填充数据后，会为每个区块创建一个唯一的标识符。这是通过一种加密哈希函数实现的，该函数将区块的内容转换为固定长度的字符字符串——哈希值。区块链设计的精妙之处体现在区块连接上。每个新区块的头部中都携带了前一个区块的哈希值。这形成了一个不可破解的链。区块内容的任何更改都会改变其哈希值，并与下一个区块的引用发生冲突。简而言之，如果有人篡改了第\
  \ 30 号区块的数据，它的哈希值就会改变。因此，持有第 30 号区块哈希值的第 31 号区块会立刻发现这种不匹配。这种加密链接使得区块链具有极高的抗篡改性，并构成了其性的基础。\n\
  \n## 3. 通过网络验证实现共识。区块链网络需要对有效交易和要添加的下一个区块达成一致。这种一致的过程被称为共识，它是区块链运行的核心。区块链网络使用共识算法在没有中心控制的情况下达成一致。该系统的工作原理如下：矿工（特殊的超级计算机）竞争求解一个复杂的数学难题。他们通过调整一个“nonce”（随机数）数字来搜索特定的哈希值。第一个找到低于目标值的解决方案的矿工将获得添加区块的权利。\n\
  \n## 4. 其他节点检查解决方案是否有效。这一过程确保每个人都对同一个区块链版本达成共识，从而防止欺诈和双重花费。此外，某些区块链使用不同的方法，例如权益证明证明（PoS），其中验证者是根据其持有的代币数量被选出的。\n\
  \n## 5. 确定并分发账本。在所有人达成一致并验证后，新区块将永久加入区块链。在此阶段会发生几件事：获胜的矿工或验证者将获得加密货币作为奖励——这在许多区块链系统中创建了新硬币。然后，更新后的区块链会发送到所有网络节点，以便每个人都拥有相同的账本副本。交易结束，但网络通常会等待更多的区块作为额外证明。比特币交易在完全结算之前，通常需要六次确认（大约一小时）。一旦记录，没有任何可以更改交易。他们必须控制网络超过\
  \ 51%的计算力才能进行尝试。\n\n## 5.3 比特币\n\n比特币的旅程始于 2008 年 8 月 18 日，当时有人注册了`bitcoin.org`域名。真正的故事始于\
  \ 2008 年 10 月 31 日。一位名为 Satoshi Nakamoto 的神秘人物写了一篇改变规则的白皮书《比特币：点对点的电子现金系统》。这份九页的文件展示了如何在没有银行的情况下创建数字货币[]。比特币的运行框架基于区块链技术。这个公共账本记录了所有已确认的交易。比特币与传统金融系统不同，因为它运行在一个去中心化的网络上，矿工在上面竞争求解复杂的数学难题。167。\n\
  \n### 比特币如何工作\n\n根据我们之前对区块链机制的讨论，比特币挖矿充当分布式共识系统，用于验证待处理交易并将其添加到区块链。矿工使用专用硬件通过`SHA-256`哈希算法求解加密谜题，如图\
  \ 5.2 所示。该过程需要计算资源，截至 2024 年 5 月，比特币网络目前的秒哈希率约为 569.29 亿哈希（exahashes）。\n\n![图 5.2\
  \ 哈希生成器 返回文本。⏎](img/fig5_2.jpg)\n\n**图 5.2** 哈希生成器 返回文本。⏎ < target\n```\n\n比特币通过这种精妙的加密谜题和经济激励系统，在没有中央权威的情况下维持安全性、去中心化和不可篡改性。比特币的\
  \ 168.价值来自于供应有限（永远只有 2100 万个币）以及有多少人想购买它。比特币本身并没有固有的内在价值。与普通货币不同，没有政府支持比特币——随着越来越多的人使用并发现它有用，它才变得有价值。专业投资者现在将其视为一种分散风险和防止通胀的方式。比特币是对传统银业的挑战。支持它的人将其视为“数字黄金”，将金融权力还给普通人而不是中央银行。\n\
  \n比特币无疑会改变，特别是当矿工接近 2140 年左右最后一批硬币时。无论比特币最终成为数字黄金、支付系统还是一个革命性的思想，它都改变了我们对当今数字世界金钱的认知。\n\
  \n## 5.4 去中心化\n\n去中心化的概念是区块链技术的核心。传统系统将数据存储在一个地方，由一个权威控制。区块链的操作方式不同——它将账本的副本分散在网络中的许多计算机上。这使得系统很难被篡改。网络计算机代替中央权威验证新交易。这种过程被称为共识，让大家不需要银行或政府等中间人对账本内容达成一致。\n\
  \n去中心化金融（DeFi）代表了一种使用区块链和加密货币的新点对点金融系统。用户可以在没有传统中间机构的情况下直接交易。DeFi 创建了一个构建在公共区块链软件上的上的开放金融部门，其中以太坊为领先。\n\
  \n定义 DeFi 的核心原则包括：\n\n- **去中心化** —— 系统运行无需中心控制。网络参与者共享权力，促进了安全和民主决策。\n- **透明性**\
  \ —— 区块链使所有交易和智能合约代码公开。任何人都可以验证和审计交易。\n- **许可访问** —— 只要有互联网连接和兼容的钱包即可参与，无论你的所在地或传统银行状况如何。\n\
  - **无须交易** —— 区块链技术保证了安全性，使双方无需相互信任即可进行交易。\n\n\n\n\n智能合约是 DeFi 的基础。这些自动执行的代码实现了财务安排的自动化，并在无需中间人的情况下执行协议条款。这种自动化在开放、去中心化的空间内重构了传统的金融工具。\n\
  \n## DeFi 与传统金融的区别\n\n传统金融依赖于银行等中心化机构作为看门人。DeFi 则通过点对点网络运行，消除了这些中间人。因此，在传统系统中需要数天的交易，现在只需几分钟内即可完成。\n\
  \n传统金融要求用户将资金和交易信任给机构。而 DeFi 则让用户通过智能合约对资产拥有直接控制权。这种变化实现了完全的金融自主，并帮助解决了传统银行无法很好处理的问题。\n\
  \n169. DeFi 通过消除障碍让更多人能够获得金融服务。传统银行可能会根据各种因素拒绝服务，而 DeFi 平台在不受限制的情况下运行，任何可以访问互联网的人都可以使用。\n\
  \nDeFi 消除了银行和其他金融机构通常收取的费用。此外，它允许各方直接协商利率，并通过 DeFi 网络借出加密货币。\n\n根据 Auer 等人（2023）的论文，DeFi\
  \ 可以定义如下：\n\n> 定义 1 去中心化金融（DeFi）是一个基于技术构建的竞争性、可争议性、可组合性和非托管的金融生态系统，该技术不需要中央组织运行，且没有安全网。它由金融协议组成——以“智能合约”的形式实现——运行在计算机网络上自动管理金融交易。它构建在分布式账本技术（DLT）之上，不需要银行或其他传统的中心化中介。其底层生态系统具有竞争性，因为新的中介人——矿工或验证者——竞争处理和结算交易。用户可以从不同的金融协议中进行选择；这些协议是可争议的，因为任何人都可以成为中间人或部署协议，甚至启动新的账本；它们是可组合的，因为复杂的服务可以从基础协议组合而成；它们是非托管的，因为用户在访问金融服务时可以保持对资产的直接托管。DeFi\
  \ 不带任何任何安全网，因为它缺乏对犯罪行为或投资者欺诈的保护，且错误的交易无法撤销。\n\n根据作者的观点，DeFi 代表了金融服务的变革性转变，利用分布式账本技术提供借贷、投资和加密资产交换等功能——且完全不需要传统的中心化中介。这些服务通过各种\
  \ DeFi 协议执行，这些协议作为 `smart contracts` 的集合运行——即复制传统金融逻辑的自动化软件程序 [5.5]。\n\n用户并不是与交易对手直接接触，而是与这些\
  \ `smart contracts` 交互，这些合约聚合了多个参与者的资源，同时允许个人保留对其资金的控制。\n\n## 去中心化金融对比中心化金融\n\n\
  中心化金融（CeFi）包括由中央机构管理的传统银行、股票市场、债券市场和类似机构。DeFi 将信任从机构转移到代码和基础技术。\n\nCeFi 通过政府监管和法律框架建立信任。DeFi\
  \ 通过透明的区块链技术和永久的交易记录建立信任。CeFi 使用中介的私有记录。DeFi 则在公共区块链上记录所有合约和交易。\n\nCeFi 机构必须遵守严格的身份验证（KYC）规定。DeFi\
  \ 则允许相对匿名。尽管如此，即使没有个人姓名，DeFi 交易仍然是可追溯的。CeFi 通过控制金融活动的受信第三方运行。DeFi 利用 `smart contracts`\
  \ 和区块链来实现流程自动化。这种根本区别创建了一个用户信任代码而非机构的系统。\n\n170.\n\n## DeFi 加密钱包与用户访问\n\n用户需要特殊的加密钱包来使用\
  \ DeFi 应用。与持有你资金的银行不同，DeFi 钱包让你直接控制资金。\n\nDeFi 钱包主要有两种类型：\n\n1. **自托管钱包 (Self-custody\
  \ wallets)**：你通过私钥或助记词控制一切，并直接连接到 DeFi 协议。\n2. **托管钱包 (Custodial wallets)**：交易所管理这些钱包并保留对私钥的控制权。\n\
  \n你在加密货币领域探索 DeFi 的之旅从自托管钱包开始。这些非托管钱包开启了 DeFi 生态系统的大门，让你：\n\n* 通过浏览器扩展或移动应用链接到 dApps\n\
  * 从你的钱包确认交易\n* 使用私钥保持对资产的完全控制\n* 使用恢复短语在不同设备上使用你的资金\n\n用户通过去中心化应用程序（dApps）与 DeFi\
  \ 交互。你不需要像传统银行应用程序那样创建账户——只需连接你的钱包。在快速批准后，你就可以开始使用借贷平台、去中心化交易所或收益耕矿协议。你的钱包既是你的 DeFi\
  \ 身份也是你的安全系统。你不需要用户名或密码，但你的资产依然安全。在本章中，我们不再深入探讨 DeFi 协议。在使用实用的代码示例或代币化过程之前，先介绍稳定币是有建设性的。\n\
  \n## 稳定币\n\n根据 Ma 等人（2023）的研究，作者探讨了法币支持稳定币的经济设计和风险，特别关注了 `USDT (Tether)` 和 `USDC\
  \ (Circle)`。尽管通过套利维持价格稳定，稳定币仍然容易发生挤兑，特别是当用户对兑换失去信心时。像 ETF 一样，大多数投资者在二级市场交易稳定币，只有少数套利者可以直接向发行方兑现\
  \ [5.6]。\n\n* **价格稳定与挤兑风险的权衡**：更有效的套利缩小了价格波动，但增加了投资者恐慌兑现的可能性。\n* **套利集中程度各异**：USDT\
  \ 拥有较少且规模较大的套利者，会导致价格偏差；USDC 的结构更具竞争性且波动较低。\n* **储备质量至关重要**：流动性较的储备（例如企业债券）在压力事件期间会增加兑现风险。\n\
  * **监管分类限制**：稳定币不支付分红以避免被归类为证券，但这样做可以降低挤兑风险并增强价格稳定性。\n\n作者开发了一个模型，证明恐慌引发的挤兑是可能的，且套利效率和分红政策等设计选择会严重影响稳定性。171.\
  \ 实证数据证实 USDT 和 USDC 存在非平凡的挤兑概率，尽管这些风险随着时间的推移已有所下降。\n\n法币支持的稳定币目前主导着数字世界。它们占所有流通稳定币的\
  \ 87%。这些数字代币通过与美元等传统货币进行 1:1 挂钩来维持其价值。该系统的工作原理是为每发行的稳定币在储备中存放一个美元。\n\n\n\n\nTether\
  \ (USDT) 的市值超过 948 亿美元，位居首位。其支撑来自美元储备 (83.89%)、担保贷款 (5.36%)、贵金属 (3.95%)、比特币 (3.81%)\
  \ 以及其他投资 (2.97%) \\[5.7]]。USD Coin (USDC) 是第二大稳定币，通过美元资产与其价值挂钩，并由德勤发布详细的月度审计。TrueUSD\
  \ (TUSD) 则更进一步，通过每日证明来证实其储备与流通中的代币匹配。\n\n人们广泛采用法币支持的稳定币，是因为它们：\n\n*   长期运行可靠\n*\
  \   在跨平台提供高流动性\n*   运行机制简单\n*   遵循监管合规和审计\n\n#### 加密货币支持：DAI 和 Wrapped BTC\n\n加密货币支持的稳定币通过区块链智能合约使用其他加密货币作为抵押。与法币支持的同事不同，这些稳定币需要额外的抵押品来应对市场波动。\n\
  \n来自 `MakerDAO` 的 `DAI` 展示了去中心化稳定币如何保持接近美元的价值。`DAI` 并不依赖于单一加密货币。它使用多种类型的抵押品，包括 `Ethereum`、`Bitcoin`\
  \ 等等。被称为 `Maker collateral vaults` 的智能合约锁定了这些资产，并确保抵押品价值高于发行的 `DAI`。\n\nWrapped\
  \ Bitcoin (`WBTC`) 提供了另一种加密货币支持稳定币的方法。它在 `Ethereum` 区块链上精确匹配 `Bitcoin` 的价值。这使得 `Bitcoin`\
  \ 能够在基于 `Ethereum` 的应用程序中运行，同时保持 `Bitcoin` 的价格。\n\n#### 商品支持：挂钩黄金的代币\n\n商品支持的稳定币其价值源于实体资产，通常是黄金。每个代币让您拥有特定数量的商品，这些商品存储在经过定期审计的储金库中。\n\
  \nPax Gold (`PAXG`) 领先于这一类别。一个代币等于存储在 `伦敦金银市场协会` 金库中的一盎司黄金。他们发布月度报告，审计师会检查储备。Tether\
  \ Gold (`XAUT`) 的工作原理类似，允许持有者将代币兑换为实金。他们目前有约 246,524.33 盎司精炼黄金支撑其代币。\n\n172。\n\n\
  #### 算法稳定：TerraUSD 和 USDD\n\n算法稳定币通过智能合约维持价值，而不是使用资产作为支撑。它们使用计算机程序根据需求控制供应，类似于中央银行。\n\
  \nTerraUSD (`UST`) 成为该领域的一个警示故事。它曾是第三大稳定币，依赖其伙伴代币 `LUNA` 来保持 1 美元的价值。2022 年 5 月，`UST`\
  \ 从 1 美元跌至 10 美分。`LUNA` 从 182.73 美元跌到几乎无几，688 亿美元的市值消失。`Tron` 的算法稳定币 `USDD` 也面临着类似的问题。它在\
  \ 2022 年 6 月 13 日失去了美元挂钩，显示了这些自动稳定系统所携带的风险。\n\n## 5.5 智能合约\n\n从代币化的角度来看，我们的重点是智能合约。智能合约与普通的数字文档不同。它们作为自执行程序运行，当区块链网络上满足特定条件时会自动采取行动。一旦部署，它们在没有人工干预的情况下运行，并创建一个双方不需要相互认识的信任环境。简而言之，智能合约是运行在区块链上并根据区块链执行预定义操作的计算机程序。\n\
  \n### 以太坊\n\n比特币在 2008 年让区块链变为现实，但智能合约直到 2015 年以太坊推出才变得实用。以太坊的创始人 Vitalik Buterin\
  \ 认为比特币协议是智能合约愿景的“弱版本”。他通过使用 `Solidity` 构建了一个更强大的版本作为回应。\n\n以太坊通过创建一个专注于智能合约功能的平台与比特币区分来。比特币的脚本能力有限，而以太坊提供了图灵完备的环境。智能合约成为了去中心化应用\
  \ (dApps)、去中心化自治组织 (DAO) 以及整个去中心化金融 (DeFi) 生态的核心。\n\n智能合约的技术之旅从比特币简单的脚本到以太坊复杂的 `Solidity`。比特币通过其\
  \ `Script` 语言增加了基础编程能力，但为了安全特意对其了限制。其简单的设计旨在阻止安全攻击并保护比特币的核心安全原则。\n\n`Solidity` 的图灵完备性允许开发者编写操纵和更改数据的程序。这些程序运行在一个名为\
  \ `Ethereum Virtual Machine` (`EVM`) 的全球去中心化计算机上 \\[5.10]。\n\n比特币脚本和以太坊智能合约在几个关键方面有所不同：\n\
  \n1. 比特脚本不维护状态，并将所有信息保留在锁定和解锁脚本中，而以太坊智能合约具有持久的合约存储。\n2. 比特脚本仅对特定事务有效并可能在修剪期间消失，但以太坊智能合约代码一直留在区块链上，直到有人销毁它。\n\
  3. 以太坊的图灵完备允许循环和递归，这实现了更复杂的应用程序。\n\n这种进展促使开发者创建代币标准，如用于*同质化代币*的 **ERC-20** 和用于*非同质化代币*的\
  \ **ERC-721**。这些标准现在构成了当今繁荣区块链生态系统的基础。\n\n### 带有数字签名的智能法律合约\n\n\n\n\n\n智能法律合约将传统的法律协议与区块链技术相结合。这些合约通过数字签名在双方之间建立具有法律约束力的关系，并在满足条件时自动执行。它们与仅运行代码的普通智能合约不同，因为它们具有法律效力，且不合规会带来严重的风险。\n\
  \n174. 这些合约的真正价值在于它们在保持法律执行力的同时能够自动执行。例如，家得宝（Home Depot）与供应商一起使用智能法律合约来跟踪货物和收货。该系统实现了“每笔交易都进行结算，而不是在六个月、九个月或\
  \ 12 个月后进行等待”。\n\n智能法律合约最大的问题在于其不可更改的本质——一旦部署，它们`cannot be altered`。这一特性与允许双方在签署后更改协议的传统合同法相冲突。尽管如此，它们在区块链上的公开可见性意味着在部署后任何人都能看到它们，这引发了金融机构对隐私的担忧。\n\
  \n这些合约继续在制造业、加密货币和房地产行业中传播。它们简化了过去涉及大量文书工作的流程。\n\n## 去中心化自治组织 (DAOs)\n\nDAOs 提供了一种由智能合约驱动的革命性集体治理方式。这些组织在没有中央领导的情况下运行。拥有特定代币的社区成员获得治理组织的投票权。\n\
  \nDAOs 的核心特征包括：\n\n* 通过社区驱动的决策实现`去中心化治理`\n* `基于代币的投票系统`，提案需要大多数人的批准\n* 具有`开源透明性`，规则和操作记录在区块链上\n\
  * 通过智能合约自动化实现决策的`自执行`\n\nDAOs 作为区块链治理的实体运行，拥有社区控制的共同目标。嵌入在合约代码中的区块链规则控制着组织的运作和资金支出，而不是由执行官或总裁决定。\n\
  \nVitaDAO 展示了这一概念的应用。它无需资助申请或专利注册即可资助寿命研究。每个 VitaDAO 项目都会获得一个知识产权非质化代币 (`IP-NFT`)。该系统允许\
  \ DAO 成员处理研究提交、分配资金并寻找研究患者。\n\nDAOs 面临网络攻击的风险，因为它们的开源代码使其容易受到逆向工程的影响。\n\n## 用于物联网和\
  \ API 的应用逻辑合约\n\n应用逻辑合约 (`ALC`) 超越了人类协议，帮助设备和系统进行通信。这些合约使用与其它区块链合约保持同步的应用程序级代码。\n\
  \nALCs 与物联网 (`IoT`) 设备协同工作，连接互联网与物理世界，并证明设备之间共享的信息。智能 ATM 机机使用传感器向操作人员告知所需的维护。智能手表实现了直接与银行通信的`无接触数字支付`。\n\
  \nBeam Technologies 的智能牙刷展示了这一理念。牙刷与他们的牙科保险公司连接。它收集口腔卫生数据并发送给 Beam Dental。用户可能会根据刷牙的频率和持续时间获得较低的保费率。\n\
  \nALCs 在触发响应的自动化数据传输方面表现优异。它们利用区块链作为设备和系统之间交换数据的安全方式。\n\n175. 目前，ALCs 大部分在单一管理程序下运行，这些程序仅通过同一个区块链服务器进行通信。这限制了设备的连接性。许多领域在使用这种可追溯数据方法方面仍有空间。\n\
  \n## 数字数据工厂 (DDF)\n\n在我们的 `DDF` 平台背景下，接下来我们将从编程角度分解说明一个演示以太坊智能合约能力的 Python 脚本。在这一阐述中，我们设置了一个“简单”的智能合约，包含基本功能：\n\
  \n1. 数值的存储\n2. 所有者跟踪\n3. 设置、获取和递增函数\n4. 状态变化的事件发布\n\n要完整运行此脚本，读者需要安装依赖项 `pip install\
  \ web3`，启动类似 `Ganache` 的本地区块链或连接到 `testnet`。要操作以太坊，需要高级的编程技能，如 Solidity 语言。176\n\
  \n```python\n#!/usr/bin/env python3\n\"\"\"\n使用 Web3 演示部署和与简单智能合约进行交互\n\"\"\"\n\
  from web3 import Web3\nimport json\nfrom eth_account import Account\nimport os\n\
  \n## 简单合约（供参考）\nCONTRACT_SOURCE = '''pragma solidity ⁰.8;\ncontract SimpleStorage\
  \ {\n    uint256 private storedData;\n    address public owner;\n    event DataStored(uint256\
  \ indexed value, address indexed);\n    constructor() {\n        owner = msg.sender;\n\
  \    }\n    function set(uint256 x) public {\n        storedData = x;\n        emit\
  \ DataStored(x, msg.sender);\n    }\n    function get() public returns (uint256)\
  \ {\n        return storedData;\n    }\n    function increment() public {\n    \
  \    storedData += 1;\n        emit DataStored(storedData, msg.sender);\n    }\n\
  }'''\n\n# 预编译字节码（通常用 solc 编译）\nCONTRACT_BYTECODE = \"0x608060405234801561001057600080fd5b503591905056fea2646970667358221220a8c65b3f6c45a5c8b3e7b8a4d8e7f1234567890abcdef1234567890abcdef123464736f6c63430008120033\"\
  \n\nCONTRACT_ABI = [\n    {\n        \"inputs\": [],\n        \"stateMutability\"\
  : \"nonpayable\",\n        \"type\": \"constructor\"\n    },\n    {\n        \"\
  anonymous\": false,\n        \"inputs\": [\n            {\"indexed\": true, \"internalType\"\
  : \"uint256\", \"name\": \"value\", \"type\": \"uint256\"},\n            {\"indexed\"\
  : true, \"internalType\": \"address\", \"name\": \"by\", \"type\": \"address\"}\n\
  \        ],\n        \"name\": \"DataStored\",\n        \"type\": \"event\"\n  \
  \  },\n    {\n        \"inputs\": [],\n        \"name\": \"get\",\n        \"outputs\"\
  : [{\"internalType\": \"uint256\", \"name\": \"\", \"type\": \"uint256\"}],\n  \
  \      \"stateMutability\": \"view\",\n        \"type\": \"function\"\n    },\n\
  \    {\n        \"inputs\": [],\n        \"name\": \"increment\",\n        \"outputs\"\
  : [],\n        \"stateMutability\": \"nonpayable\",\n        \"type\": \"function\"\
  \n    },\n    {\n        \"inputs\": [],\n        \"name\": \"owner\",\n       \
  \ \"outputs\": [{\"internalType\": \"address\", \"name\": \"\", \"type\": \"address\"\
  }],\n        \"stateMutability\": \"view\",\n        \"type\": \"function\"\n  \
  \  },\n    {\n        \"inputs\": [{\"internalType\": \"uint256\", \"name\": \"\
  x\", \"type\": \"uint256\"}],\n        \"name\": \"set\",\n        \"outputs\":\
  \ [],\n        \"stateMutability\": \"nonpayable\",\n        \"type\": \"function\"\
  \n    }\n]\n```\n\n\n\n\n\n# 图 5.3 应用于区块链场景的 DDF 概念 返回文本\n\n数据湖包含连接和账户管理，等同于标准的云端功能。特性体现在事务管理功能中。模型设计由合约交互驱动，设计定义在合约部署和事件处理中。因此，DDF\
  \ 工厂在以太坊生态系统中表示。\n\n## 数据湖\n\n在第一阶段，我们初始化与以太坊节点的连接（或从你的测试环境开始）。账户和连接管理是此阶段的核心功能。这一步在我们新的类\
  \ `EthereumContractDemo` 中得以。。强烈建议使用安全的、可能离线的存储方式来跟踪如 `private_key` 等私有登录详情。\n\n\
  ```python\nclass EthereumContractDemo:\n    def __init__(self, rpc_url=\"http://127.0.0.1:8545\"\
  ):\n        \"\"\"初始化与以太坊节点的连接\"\"\"\n        self.w3 = Web3(Web3.HTTPProvider(rpc_url))\n\
  \        self.account = None\n        self.contract = None\n \n        # 检查连接\n\
