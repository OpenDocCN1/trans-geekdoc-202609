  \n#### 相关性分析\n\n相关性分析如图 9.17，是一种用于衡量和描述两个或多个变量之间线性关系强度和方向的统计技术。它有助于确定变量是否以可预测的模式共同移动。\n\
  \n\n\n\n\n上一节讨论的图 9.18 所示的数字数据工厂概念驱动了开发速度。\n\n![图 9.18 应用于加密货币投资组合优化器的 DDF 返回正文。⏎](img/fig9_18.jpg)\n\
  \n**图** **9.18** 应用于加密货币投资组合优化器的 DDF 返回正文。⏎\n\n从实践角度来看，我们在这一阐述中使用了许多简化处理。我们完全依赖\
  \ CryptoCompare 的数据质量和数据交付。使用的模型 `MPT` 假设收益遵循正态分布，但金融市场表现出肥尾、偏度和极端事件的频率远高于正态分布所预测的水平。标准投资组合理论假设收益遵循正态分布。真实的金融市场显示出“肥尾”——这意味着极端结果发生的频率比钟形曲线预测的要高。这产生了一种风险状况，即灾难性事件发生的频率比数学模型建议的要频繁。\n\
  \n该理论假设资产之间的相关性随时间保持不变，但在市场压力时期，恰恰是最需要多元化的时候，相关性往往会增加。这种“相关性崩溃”破坏了 `MPT` 所承诺的根本多元化收益。此外，`MPT`\
  \ 是为单期优化设计的，但投资者通常具有多期视野，其目标、风险承受能力和市场状况随时间推发生变化。预期收益估计的微小变化可能导致截然不同的最优组合，使得该方法对本质上不确定的输入假设非常敏感。\n\
  \n此外，`MPT` 假设投资者是理性的且市场是有效的，但行为金融学记录了许多认知偏见和市场失灵，这些影响了真实的投资决策，特别是在加密货币市场中。`MPT`\
  \ 没有考虑到市场 322. 在不同状态（牛市、熊市、高波动期）之间切换，而这需要不同的策略方法。\n\n这些局限性导致了各种扩展和替代方案，包括 Black-Litterman\
  \ 模型、风险均等策略、基于因子的投资和行为投资组合理论，每种方案都试图在保持组合构建数学严谨性的同时，解决 `MPT` 的特定缺陷。在 DDF 的背景下，这可以被视为本书的进一步扩展。\n\
  \n## 9.7 总结\n\n本章通过展示一个全面的 AdviceTech 用例，连接了本书的第 1 节和第 2 节。该场景将读者设定为加密货币机器人投顾公司内的金融从业人员，他们必须解决特定挑战并开发技术驱动的解决方案。\n\
  \n现代投资组合理论提供了理论基础，核心是基本的风险-收益关系——这种将更高的潜在收益与更大的风险暴露联系起来的投资原则。`MPT` 的运行前提是投资者是风险厌恶的，当面对相似预期收益的组合时，他们自然地倾向于低风险的替代方案。这种行为假设揭示了一个关键见解：只有在获得更高收益的预期作为补偿时，投资者才会接受额外风险。因此，寻求更高收益的人必须接受相应的风险增加。`MPT`\
  \ 认为，当存在优的风险-收益替代方案时，理性的投资者应该拒绝任何组合。\n\n我们首先通过用例建立了 Crypto AdviceTech 框架。机器人投顾代表了一个自动化的数字投资管理平台，利用机器学习和人工智能算法以最少的人为干预提供金融投资和交易服务。这一引言让读者沉浸在加密货币市场的动态中。\n\
  \n接下来，我们实施了我们的 FinTech 数字数据工厂方法论。每个 DDF 站引入了新的技术和工具，创建了从 `DDF Station 1` 到 `DDF\
  \ Station 4` 的无缝数据推进。\n\n## 9.8 问答\n\n- **Q1: 现代投资组合理论的主要批判是什么？**\n  A1: 现代投资组合理论被批评为关注总方差而非下行风险，并依赖正态分布等不符合实际的假设。\n\
  - **Q2: 根据 MPT，多元化是如何降低风险的？**\n  A2: 多元化通过将投资分散到相关性不同的资产类别中降低风险，最终降低整体波动性。\n- **Q3:\
  \ 现代投资组合理论中的有效边界是什么？**\n  A3: 有效边界是在给定风险水平下提供最高预期收益的组合图形表示。它帮助投资者根据偏好和风险承受能力选择组合。\n\
  - **Q4: 为什么过度依赖历史数据有问题？**\n  A4: 过度依赖历史数据可能是误导性的，因为过去的表现不代表未来。市场不断演变，结构性变化会使历史关系失效。\n\
  - **Q5: 后现代投资组合理论 (PMPT) 与传统 MPT 有何区别？**\n  A5: 后现代投资组合理论通过关注下行风险解决了 `MPT` 的某些局限性。它使用下行标准差和索提比率代替标准差。`PMPT`\
  \ 还结合了非对称收益分布，更适合复杂的投资策略。\n\n## 9.9 练习\n\n- E1: 按照文中运行 DDF，根据市值选择加密货币。分析你的组合。你会根据模型投资吗？\n\
