  \ 10.6** WHEAT 价格预测 – 最终 AgTech 产品 返回正文。⏎\n\n340。\n\n### 局限性\n\n`LSTM` 模型在应用于时间序列预测时面临着若干重大挑战。在本节中，我们运行了一个带有预定义超参数的简单模型设置。我们没有在大量的时间序列数据集上训练该模型，也没有保存预训练和校准的版本。在任何模型迭代中，我们的结果都会有所不同。\n\
  \n尽管 `LSTMs` 的设计目的是为了解决这个问题，但梯度消失问题仍然存在。（等等，查看原文……）-> 梯度消失问题仍然存在。长序列仍然会导致梯度衰减，使得难以有效地学习长期依赖关系。通过多个时间步的梯度流可能会变得不稳定，导致收敛效果差。此外，计算复杂度很高，因为\
  \ `LSTMs` 需要无法在时间步之间轻易进行并行化的顺序处理。这使得训练速度较慢，特别是对于长序列，并且与基于 transformer 的方法相比限制了可扩展性\
  \ [10.4]。\n\n超参数敏感性是一个问题，因为 `LSTMs` 需要对学习率、隐藏层大小、丢弃率和序列长度进行仔细调。这些参数的微小变化会极大影响性能，使得模型难以可靠地优化。\n\
  \n对季节模式的处理可能不足，因为如果没有精细的特征工程，`LSTMs` 可能无法有效捕捉复杂的季节模式、多季节性或不规则的季节变化。此外，当时间序列随时间呈现变化的统计属性时，平稳假设会导致问题。`LSTMs`\
  \ 难以应对概念漂移（concept drift），即底层模式逐渐变化，导致在新数据上的性能下降。\n\n过拟合倾向很常见，特别是在训练数据有限的情况下（正如我们在案例中观察到的那样）。模型可能会记忆训练序列而不是学习泛泛化的模式，导致样本外预测效果差。\n\
  \n总之，这些局限性导致许多金融和金融科技从业者探索替代方法，例如基于 transformer 的模型、注意力机制或将 `LSTMs` 与其他技术相结合以解决特定弱点的混合架构，这些都是进一步研究的相关主题。\n\
