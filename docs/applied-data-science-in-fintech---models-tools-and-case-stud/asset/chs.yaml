  \ 返回文本。⏎\n\n# 第 8 章 用于情感分析的机器人\n\nDOI: [10.4324/9781003477747-10](https://doi.org/10.4324/9781003477747-10)\n\
  \n## 8.1 引言\n\n本章的目的是讨论金融和金融科技背景下的情感分析。本书的主题之一是非结构化数据技术的阐述。金融领域的非结构化数据是指不符合传统数据库格式或预定义数据模型的信息。与结构化数据（像电子表格或数据库那样按行和列组织）不同，非结构化数据根据定义缺乏一致的、预定义的结构。非结构化数据的挑战在于，它需要先进的分析、机器学习和人工智能技术来处理并提取可操作的见解。然而，它的价值日益凸显，因为它可以通过情感分析、早期趋势检测和更全面的风险评估来提供竞争优势。\n\
  \n金融情感分析是指使用计算方法来分析和量化金融通信和媒体中表达的情感基调、观点和态度的过程。这涉及从文本、语音或其他数据源中提取主观信息，以衡量市场情绪并预测潜在的价格波动或投资行为。`Natural\
  \ language processing (NLP)` 算法、机器学习模型和基于词典的方法可以识别积极、消极或中性的情感。高级技术包括可以理解上下文、讽刺和细微语言的深度学习模型。例如，投资公司使用情感分析\
  \ 266. 来指导交易策略、风险管理和投资组合配置。它有助于在市场趋势完全体现在价格波动中之前识别出来，评估公众对公司或行业的感知，并确定市场入场或退出的时机（如果这可能的话）。情感分析在语境解释、金融术语处理以及通过情感进行市场操纵方面面临挑战。\n\
  \n## 8.2 金融中的非结构化数据\n\n金融领域的非结构化数据是不遵循标准数据模型的信息。银行和金融机构很难在常规数据库中存储和管理此类数据。虽然它有自己的内部结构，但它不遵循任何易于分类和研究的设定格式。正如本书在各个部分讨论的那样，银行和金融公司创建了许多类型的非结构化数据。文本是最常见的，出现在各种需要每日处理的格式中。以下是通常可用数据的列表：\n\
  \n* 267. 通信记录：电子邮件、呼叫中心转录、、聊天日志和支持互动\n* 金融文档：收益报告、监管文件、合同和审计文档\n* 客户反馈：社交媒体帖子、评论、调查问回复和情感数据\n\
  * 多媒体内容：图像、音频录音、视频文件和演示文稿\n* 机器生成数据：网站、服务器、网络和应用程序的日志文件，特别是来自移动平台的数据\n\n在本书中，我们关注于文本。自然的扩展是利用可用于视频、图片或语音识别的工具来丰富这段旅程，但这超出了本书的范范围。\n\
  \n## 8.3 情感\n\n情感分析关注文本中的情感和观点。这有助于企业了解公众认知、预测市场趋势并做出明智的决策。股市情绪显示了投资者对证券群体的感受。这些感受通常在基本面数据赶上之前驱动价格波动。了解看涨的市场情绪揭示了乐观的前景，这种观点推高了市场。疲软的市场情绪指向了潜在的低迷，精明的交易者可以借此做好准备。\n\
  \n观点情感分析识别并分类文本数据中的观点。这种方法将观点分为积极、消极和中性类别。观点挖掘显示了投资者如何根据广泛的情绪做出决策。证券分析师充当关键信息中介，利用观点情感分析减少市场参与者之间的信息差距。研究显示，分析师的目标价格修订会影响机构投资者的买卖股票，从而在股票之间移动大量资金。这种关系是双向的——分析师的行为根据他们看到的情绪而改变，这在市场动态中形成了一个反馈循环\
  \ [8.1]。\n\n### 学习成果\n\n在本章结束，读者将能够：\n\n* 理解非结构化数据在金融和金融科技的重要性\n* 概述语言背后的理论概念\n\
  * 解释用于语言分析的基础技术\n* 理解分词（tokenization）的工作原理\n* 理解 VADER 的应用\n* 理解 FinBERT 的应用和实现\n\
  \n\n\n\n为了分析情感，我们需要提高技能并为我们的金融科技工具包（FinTech Toolkit）添加新技术。从 API 调用开始。从“第 2 章: 数据管理`”和“[第\
  \ 3 章: 数据可视化`”中获得的知识现在将非常有用。《纽约纽约时报》（New York Times）为读者和开发者提供了 API 访问。我们通过在其网站上创建用户配置并使用分配的\
  \ API 密钥程序化的方式“拨入”来利用这种设置：\n\n268.\n\n```python\nimport pandas as pd\nfrom pynytimes\
  \ import NYTAPI\n \n'''\n \nReference: https://developer.nytimes.com/\nReference:\
  \ https://pypi.org/project/pynytimes/\nThe possible sections are: arts, automobiles,\
  \ books, business, fashion, food,\nhealth, home, insider, magazine, movies, national,\
  \ nyregion, obituaries, opinion,\npolitics, realestate, science, sports, sundayreview,\
  \ technology, theater, tmagazine,\ntravel, upshot, and world\n'''\n \n# Input Parameters\n\
  sections = 'business'\nnyt = NYTAPI(\"API-XXXXX\")\nfileDB = 'C:/Temp/Datalake/'\n\
  top_stories = nyt.top_stories()\n \n# Mechanics\ndef readNYtimes(sections):\n  \
  \  top_stories = nyt.top_stories(section = sections)\n    df = pd.DataFrame(top_stories)\n\
  \    df.to_json(fileDB + sections + '_dump.json')\n    return df\n \ndef loadNYtimes():\n\
  \    # TODO: Create load json function\n    df = pd.read_json(fileDB + sections\
  \ + '_dump.json')\n    return df\n# Execution Control Function\ndef main():\n  \
  \  # Dump recent news per selected section\n    newsDump = readNYtimes(sections)\n\
  \    print(newsDump.to_json())\n    print(newsDump['abstract'])\n    print(newsDump['abstract'][2])\n\
  \    # TODO: Load and parse selected section news\n    load = loadNYtimes()\n  \
  \  print(load['abstract'][5])\n \nif __name__ == '__main__':\n    main()\n```\n\n\
  根据代码段，从官方 NY Times API `[8.2]` 提取的定义为 `business` 板块“热门新闻”的数据如 `图 8.1` 所示。我们使用的格式是\
  \ `.json`，具有预定义的结构，例如“标题”、“摘要”以及所有相关日期和其他重要信息。在这一阶段，我们利用文章摘要（提供核心新闻/信息）来避免文章标题中可能存在的噪声（标题用于吸引点击量）。\n\
