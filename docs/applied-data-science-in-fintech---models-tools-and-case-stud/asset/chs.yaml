  \ loss')\nplt.plot(epochs, val_loss, 'b', label='Validation loss')\nplt.title('Training\
  \ and validation loss')\nplt.xlabel('Epochs')\nplt.ylabel('Loss')\nplt.legend()\n\
  plt.show()\n```\n```\n\n## 从 IMDb 评论中准备并加载数据库\n\n使用 IMDb 评论进行情感分析方法。定义 `embedding_layer\
