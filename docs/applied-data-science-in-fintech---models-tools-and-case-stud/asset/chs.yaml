  \ 0.1679\nEpoch [30/50], 平均损失: 0.1608\nEpoch [40/50], 平均损失: 0.1556\nEpoch [50/50],\
  \ 平均损失: 0.1519\n训练完成!\n```\n\n这是模型的“大脑”。我们初始化模型，定义损失函数和优化器并执行训练序列以跟踪结果。\n\n257.\n\
  \n```python\n    def generate_text(self, seed_text, num_words=100, temperature=0.8):\n\
  \      \"\"\"生成文本\"\"\"\n      if self.model is None:\n        raise ValueError(\"\
  模型尚未训练。请先调用 train_model()\")\n\n      self.model.eval()\n      words = seed_text.lower().split()\n\
  \      \n      # 将种子转换为索引\n      indices = []\n      for word in words:\n      \
  \  if word in self.word_to_idx:\n          indices.append(self.word_to_idx[word])\n\
  \        else:\n          indices.append(self.word_to_idx['<UNK>'])\n      \n  \
  \    # 如果短于序列长度则填充\n      if len(indices) < self.sequence_length:\n        indices\
  \ = [self.word_to_idx['<START>']] * (self.sequence_length - len(indices)) + indices\n\
  \      \n      # 取最后的 sequence_length 个\n      indices = indices[-self.sequence_length:]\n\
  \      generated = list(indices)\n      \n      with torch.no_grad():\n        hidden\
  \ = self.model.init_hidden(1, self.device)\n        \n        for _ in range(num_words):\n\
  \          # 输入\n          input_seq = torch.tensor([indices], dtype=torch.long).to(self.device)\n\
  \          \n          # 前向传播\n          output, hidden = self.model(input_seq,\
  \ hidden)\n          \n          # 获取最后一个输出\n          output = output[0, -1, :]\
  \ / temperature\n          \n          # 应用 softmax 获取概率\n          probabilities\
  \ = torch.softmax(output, dim=0).cpu().numpy()\n          \n          # 从分布中采样\n\
  \          next_idx = np.random.choice(len(probabilities), p=probabilities)\n  \
  \        \n          generated.append(next_idx)\n          \n          # 更新下次迭代的索引\n\
  \          indices = indices[1:] + [next_idx]\n      \n      # 将索引转换回单词\n      generated_words\
  \ = [self.idx_to_word[idx] for idx in generated]\n      \n      # 找到种子结束和新生成开始的地方\n\
  \      generated_text = ' '.join(generated_words[-num_words:])\n      \n      return\
  \ generated_text\n```\n\n\n\n\n\n`generate_text()` 将 `seed_text`（等同于提示）作为输入，将此语句转换为索引，触发预训练模型的概率，生成相关的响应（最高概率），并将此响应转换为实际文本，即新生成的、预测文本。注意，超参数变量名为\
  \ `temperature`。低值（0.5–0.7）生成的文本更保守、连贯；而高值（0.8–1.0）则更具创造性，能生成更多多样化的文本内容。\n\n## Application\n\
  \n最后，我们已经准备好运行并执行脚本，利用经过训练的 `LSTM` 模型生成新的语句序列。\n\n提供种子测试提示，例如 `“Our Investment &\
  \ Corporate Banking business provides”`，并接收与上下文相关的文本后续。\n\n258。\n\n```\n# Example\
  \ usage\nif __name__ == \"__main__\":\n    # Initialize the text generator\n   \
  \ generator = JPMorganTextGenerator(\n        sequence_length=30,\n        embedding_dim=256,\n\
  \        hidden_dim=512,\n        num_layers=2\n    )\n \n    # Train the model\n\
  \    print(\"Training LSTM model on JP Morgan annual report…\")\n    generator.train_model(epochs=50,\
  \ batch_size=16, learning_rate=0.001)\n \n    # Example 1: Banking continuation\n\
