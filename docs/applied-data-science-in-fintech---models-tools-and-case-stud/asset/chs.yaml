  \ 6.4 所示。这是 ML/AI 模型实现中的关键组件。我们在选定的数据（例如总数据分布的 80%）上训练模型，然后使用测试集（例如总数据分布的 20%）应用训练好的模型。这样做是为了衡量准确性，并确保训练数据是稳定的且没有显示过拟合。此外，我们对\
  \ `X` 矩阵进行了标准化处理（我们的示例包含单个数据数组）。\n\n```python\n# 准备数据\nX = data[['RM']].values \
