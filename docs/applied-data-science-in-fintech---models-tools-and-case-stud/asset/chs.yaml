  \ 数据结构 `df`。\n\n## 4.5 站 2：提示工程与特征工程\n\n在这一站中，我们扩展了清洗后的数据流，并开始构建和准备模型特征。在这里，你需要详细了解业务用例。`提示工程`（Prompt\
  \ engineering）和`特征工程 engineeringfeature engineering）是两种关键技术，可以显著增强数据科学中机器学习模型的性能。`提示工程`涉及编写有效的输入提示以引导\
  \ AI 模型（特别是大语言模型）生成所需的输出。这种技术对于优化模型响应和提高特定任务性能至关重要。另一方面，`特征工程`侧重于从原始数据中选择、转换和创建相关特征，以提高模型的准确性和效率。通过仔细提取和处理数据属性，数据科学家可以发现算法可能会错过的隐藏模式和关系。由于提示工程和特征工程都需要创造力、领域知识和迭代实验来获得最佳结果，使其对于旨在开发稳健且高性能机器学习解决方案的数据科学家来说是不可或缺的技能。\n\
  \n136。\n\n### 特征选择\n\n本站的目标是过滤、选择和/或生成和创建相关特征，以便进一步处理并传递给 `站 3. 模型设计`。具体关注：\n\n\
  *   聚合\n*   `站 3. 模型设计`\n*   聚合\n*   `站 3. 模型设计`\n\n137。\n\n```python\nFUNCTION\
  \ Station2_featureEngineering(file_path, export_path, freq=\"D\"):\n    # 阶段 2：特征工程\n\
  \    # 目的：处理数据并提取相关特征用于建模\n    \n    # 加载数据\n    LOAD data FROM CSV file located\
  \ at file_path INTO df\n    \n    # 聚合并清洗列\n    CREATE new column 'Furnace' BY summing\
  \ 'Furnace 1' and 'Furnace 2'\n    CREATE new column 'Kitchen' BY summing 'Kitchen\
  \ 12', 'Kitchen 14', and 'Kitchen 38'\n    DROP columns ['Furnace 1', 'Furnace 2',\
  \ 'Kitchen 12', 'Kitchen 14', 'Kitchen 38', 'icon', 'summary']\n    \n    # 设置能量核心特征\n\
  \    RENAME 'use' AS 'use_House'\n    RENAME 'gen' AS 'gen_Sol'\n    DROP columns\
  \ ['use', 'House', 'gen', 'apparentTemperature']\n    SET 'time' AS index\n    \n\
  \    # 计算滚动统计数据\n    CALCULATE 24-hour rolling standard deviation, skew, and kurtosis\
  \ FOR 'use_House'\n    STORE results AS new columns ['use_House_vol', 'use_House_skw',\
  \ 'use_House_kur']\n    \n    # 根据指定的频率 (freq) 进行重采样\n    IF freq IS \"D\":\n  \
  \      RESAMPLE df2 DAILY AND CALCULATE mean\n        CALCULATE energy usage shocks\
  \ relative to rolling mean OVER 3, 7, and 14 days\n        DROP rows WITH NaN values\n\
  \    ELSE IF freq IS \"h\":\n        RESAMPLE df2 HOURLY AND CALCULATE mean\n  \
  \      CALCULATE energy usage shocks relative to rolling mean OVER 3, 7, and 14\
  \ days (in hours)\n        DROP rows WITH NaN values\n    \n    # 导出处理数据\n    EXPORT\
  \ df2 TO CSV file located at export_path\n    \n    RETURN df2\nEND FUNCTION\n```\n\
  \n用 Python 表示：\n\n138。\n\n\n\n\n\n```python\nimport pandas as pd\n \ndef Station2_featureEngineering(file_path,\
