  \n金融领域中的结构化数据是现代金融分析的基石，将原始数字转化为可操作的洞察。想象海量的金融信息，整齐地排列成行和列，准备揭示其秘密。这种结构化方法允许分析师轻松地筛选复杂数据集，发现其他可能被隐藏的模式和趋势。将这些数据可视化使其充满活力，例如交互式热图可以阐明市场相关性，平滑的折线图随时间跟踪股票性能。想象\
  \ K 线图，每一根柱子都在讲述一个市场情绪的故事，或者一张迷人的树图展示了多元投资组合的构成。这些图形表示不仅展示了数据，还赋予了数据生命，使金融专家能够发现异常、预测市场波动并自信地做出决策。通过利用结构化数据和引人入胜的可视化力量，金融人士可以以前所未有的清晰度和处理复杂的市场投资世界。在本节中，我们将介绍一些金融科技人士使用的\
  \ Python 库。\n\n#### MatplotLib\n\n\n\n\n\n`Matplotlib` 是一个绘图库，允许我们从数据快速生成图表 [3.4]。它的灵感源于\
  \ Matlab，其 API 中的许多对象命名也相似。`pyplot` 是 `matplotlib` 的一个方便使用的接口，包含了对许多常见图表类型的支持。`pyplot`\
  \ 设计用于交互式使用，即在 Python 命令行或 Jupyter notebook 中运行，因此其 API 包含许多隐式元素。这意味着，`pyplot` 是一个一次只跟踪单个“图表”的对象（尽管该图表可能包含许多组件）。在编写直接调用\
  \ `pyplot` 的函数时，请记住这一点，因为 `pyplot` 会保留它的状态。要使用 `pyplot`，你必须导入它。注意 `pyplot` 是 `matplotlib`\
  \ 库的一部分，但由于我们只使用了 `matplotlib` 的这部分，因此我们可以使用更具针对性的导入。我们将为 `pyplot` 对象使用别名 `plt`。这个多功能型库是科学家、工程师和数据爱好者的必不可少的工具。凭借其直观的界面和丰富的特性集，matplotlib\
  \ 赋予了用户创建从简单的折线图到复杂的 3D 可视化的能力。无论你是在绘制实验结果、分析趋势还是展示复杂数据集，matplotlib 的灵活性都能展现得完致。它与\
  \ NumPy 和其他科学 Python 库无缝集成，使其成为 Python 生态系统中不可或缺的一部分。从出版质量的图形到交互式图表，matplotlib 为你的数据驱动洞察沟通开启了无限可能。\n\
  \n```python\nimport matplotlib.pyplot as plt\n```\n\n让我们来看一个简单的散点图：\n\n```python\n\
  import matplotlib.pyplot as plt\n \nx = [1,2,3,4,5,6,7]\ny = [7,6,5,4,3,2,1]\n \n\
  plt.scatter(x, y)\nplt.savefig('plot.jpg')\n```\n\n`plt.scatter` 会自动在后台创建一个图表。当我们调用\
  \ `plt.savefig` 时，它会被保存到文件中。`pyplot` 的 `savefig` 方法会将当前图表保存到图像文件中。我们可以为此图表添加轴和标题：\n\
  \n```python\nimport matplotlib.pyplot as plt\n \nx = [1,2,3,4,5,6,7]\ny = [7,6,5,4,3,2,1]\n\
  \ \nplt.scatter(x, y)\nplt.title('Chart title')\nplt.xlabel('X')\nplt.ylabel('Y')\n\
  \ \nplt.savefig('plot.png')\n```\n\n注意，我们调用的函数 `title`、`xlabel` 和 `ylabel` 会隐式地影响由\
  \ `pyplot` 创建的图表对象，如图 3.4 所示。我们可以通过 `plt.gca()` 和 `plt.gcf()` 直接访问 `pyplot` 隐式创建的对象。这会分别获取当前的轴和图形对象。图形对象管理图表的部分，例如图例；然而，最重要的功能位于轴对象中，它控制\
  \ x 轴和 y 轴、标题以及图表的实际内容。\n\n![Figure 3.4 Simple Plot Function Return to text.⏎](img/fig3_4.jpg)\n\
  \n**Figure 3.4** Simple Plot Function Return to text.⏎](#Ch03.xhtml#bck_fig3_4)\
  \ `pyplot` 图表的许多视觉方面都是可以自定义的，包括以下内容：\n\n* 使用的颜色：例如 `color='red'`。对于大多数图表，这适用于作为一个整体绘制的每个序列，但对于散点图，每个数据点可以有自己的颜色。\n\
  * 数据点的形状：例如 `marker='x'`（其他还包括 `+`、`o`、`.`、`v`、`<`、`>`、`s`、`d`、`p`、`h`）。\n* 线型（在折线图中）：例如\
  \ `linestyle=':'`（其他包括 `-`、`--`）。\n\n```python\nimport matplotlib.pyplot as plt\n\
  \ \nx = [1,2,3,4,5,6,7]\ny = [7,6,5,4,3,2,1]\n\nplt.scatter(x, y) # 默认：蓝色（第一个序列）\n\
  plt.scatter(x, marker='x', color='red') # 第二个序列为红色交叉\nplt.plot(x, linestyle='-.',\
  \ color='green') # 带有绿色标记的点划线\n```散点图有两个额外的参数，可以用于显示关于数据的更多信息：\n\n* `c`，例如 `c=<数值序列>`。根据指定的颜色为数据添加一个维度。\n\
  * 可以通过 `cmap` 设置 matplotlib 使用的颜色比例。matplotlib 提供了颜色映射（colormaps）。\n* 通过调用 `pyplot`\
  \ 的 `colorbar()` 方法显示颜色比例。\n* `s`，例如 `s=<数值序列>`。根据指定的大小为数据添加一个维度。\n\n```python\n\
  import matplotlib.pyplot as plt\nx = [1,2,3,4,5,6,7]\ny = [7,6,5,4,3,2,1]\nzz =\
  \ [110,80,50,70,50,80,110]\n\nplt.scatter(x, y, c=z, cmap='plasma')\nplt.colorbar()\n\
  plt.savefig('plot.png')\n```如图 3.5 所示，图表属性也是可自定义的：`xlabel()`、`ylabel()`、`title()`\
  \ 接收字符串并允许设置 x 轴标签、y 轴标签和图表标题。`legend()` 函数在调用时会自动生成图例。\n\n![Figure 3.5 Cmap Schema\
  \ Return to text.⏎](img/fig3_5.jpg)\n\n**Figure 3.5** Cmap Schema Return to text.⏎](#Ch03.xhtml#bck_fig3_5)\n\
