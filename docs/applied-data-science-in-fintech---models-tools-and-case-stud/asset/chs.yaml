  \ 在金融数据以及更广泛的银行业和金融领域，观察跨类别的簇是很自然现象。因此，在对数据集进一步使用更深层次分析模型之前，从类聚类的视角理解数据是非常重要的。\n\
  \n![图 3.9a 聚类收益 回到文本。⏎](img/fig3_9a.jpg)\n\n**图 3.9a** 聚类 返回文本。⏎\n\n![图 3.9b 聚类示例\
  \ 回到文本。⏎](img/fig3_9b.jpg)\n\n**图 3.9b** 聚类示例 返回文本。⏎\n\n聚类主要有两种类型：\n\n* 76. 划分式聚类（Partitional）：这种技术对对象进行单层划分。\n\
  * 层次聚类（Hierarchical）：这种技术产生一个嵌套序列，顶部有一个单一的全包含聚类。\n\n`KMeans` 尝试将数据 `X` 的样本（行）划分为预定义数量的聚类\
  \ `K`。我们在结构化和非结构化数据流中使用这种形式的聚类分析。\n\n1. 初始化一组随机的 `K` 个质心：`(*u*[k])[*k* − 1,ↆ…,K*]`\n\
  2. 将每个样本 `Xn` 分配给一个类，使得类内方差最小：`$$\\left. \\sum\\limits\\_{n = 1}^{N}min\\_{k}\\\
  lbrack \\middle| X_{n} - u\\_{k} \\middle| {}\\_{2}\\rbrack \\right.$$`\n3. 根据 (2)\
  \ 中的类更新 `u`。\n4. 重复步骤 (2) 和 (3) 直到收敛。\n\n```python\nimport matplotlib.pyplot as\
  \ mpl,matplotlib.cm as cm\nfrom sklearn import datasets\nfrom sklearn.cluster import\
  \ KMeans\n \nX,_=datasets.make_blobs(n_samples=10000,n_features=2,centers=3,random_state=0)\n\
  \ \nclusterer=KMeans(n_clusters=3).fit(X)\ncolors=cm.nipy_spectral(clusterer.labels_.astype(float)/3)\n\
  mpl.scatter(X[:,0],X[:,1],marker='.',s=30,lw=0,alpha=.5,c=colors,edgecolor='k')\n\
  mpl.savefig('kmeans.png',dpi=300)\n```\n\n在时间序列数据设置中理解聚类收益，或在替代文本数据设置中聚类单词，对于任何金融科技应用都至关重要。上一个示例\
  \ 图 3.10 展示了使用标准 `sklearn` Python 库的简单 `KMeans`序列。\n\n![图 3.10 高级聚类 回到文本。⏎](img/fig3_10.jpg)\n\
  \n**图 3.10** 高级聚类 返回文本。⏎\n\n### Seaborn\n\nPandas 提供了一个 `plot()` 函数，它为 `matplotlib.pyplot`\
