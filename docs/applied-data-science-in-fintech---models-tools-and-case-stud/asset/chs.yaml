  \ ETL` 的任务。在这里交付的数据传递到下游的 `Station #2: 特征工程`。\n\n## 9.4 特征工程\n\n在 `Station #2` 中，我们以相当简单的方式研究特征工程。在处理加密市场时，我们使用结构化数据和时间序列。对于正态分布，我们开始查看从\
  \ `Station #1` 提取并清洗的数据是否符合这一假设。\n\n### 正态性检验\n\n这里是金融领域中我们查看正态分布的几个例子：\n\n####\
  \ 投资组合理论\n\n当我们定义资产遵循正态分布时，可以通过均值和标准差以及资产之间的协方差来描述资产动态。\n\n301。\n\n#### 资本资产定价模型\n\
  \n当资产价格遵循正态分布时，我们可以相对于大盘来描述单个股票的价格，其衡量标准为 `beta` 系。\n\n#### 有效市场假设 (EMH)\n\n`EMH`\
  \ 认为当前资产价格反映了所有公开信息。如果是这样，那么股票价格随机波动，收益呈正态分布，因此作为市场参与者的你无法预测未来的价格波动。\n\n#### 期权定价理论\n\
  \n布朗运动是随机价格建模的标准基准模型。`Black-Scholes-Merton 期权定价模型` 使用布朗运动来研究导致正态分布收益的权权资产。\n\n###\
  \ 收益\n\n预期收益是组合中每个资产可能收益的加权平均，使用历史数据或预测得出。我们理解正态分布在金融中的重要性。让我们现在看看此案例的 Python 表示。对于正态分布收益，我们定义为：\n\
  \n`log(Return) = log(S[t]) - log(S[t-1])`\n\n其中 `S` 是时间 `0 < s < t` 的资产价格。\n\n简而言之，我们选择的最关键特征是从价格时间序列计算出的收益。我们需要检查正态性，并确保理解这些偏差在金融建模和底层理论背景下的实际含义。\n\
  \n我们从数据中提取的第一特征是每日收益：\n\n```python\ndef load_and_prepare_data(file_path):\n    \"\
  \"\"加载并准备加密货币数据\"\"\"\n    df = pd.read_csv(file_path)\n    df['date'] = pd.to_datetime(df['date'],\
  \ format='%d/%m/%Y')\n    df = df.sort_values(['symbol', 'date'])\n    return df\n\
  \ \ndef calculate_returns(df):\n    \"\"\"计算每个符号的每日收益\"\"\"\n    returns_df = df.pivot(index='date',\
  \ columns='symbol', values='close')\n    returns_df = returns_df.pct_change().dropna()\n\
  \    return returns_df\n```\n\n图 9.3 显示了我们选择的加密货币的累计收益。\n\n\n\n\n\n![图 9.3 10 倍加密货币累计收益率\
  \ 返回文本。⏎](img/fig9_3.jpg)\n\n**图 9.3** 10 倍加密货币累计收益率 返回文本。⏎\n\n图 9.4 展示了我们所选资产的收益分布，强调了这些时间序列偏离正态分布标准的事实。\n\
  \n302。\n\n所得年化收益率：\n\n```\nANNUALIZED RETURNS:\nADA: 110.46%\nBNB: 39.85%\nBTC:\
  \ 76.81%\nDOGE: 93.05%\nETH: 10.33%\nSOL: 46.55%\nSUI: 220.00%\nTRX: 123.64%\nUSDT:\
