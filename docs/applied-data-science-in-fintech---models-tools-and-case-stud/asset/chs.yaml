  \ Std: 9.188\n```\n\n\n\n\n```python\n# Create comprehensive visualization\nfig,\
  \ ((ax1, ax2), (ax3, ax4)) = plt.subplots(2, 2, figsize=(15, 12))\n\n# 1. Scatter\
