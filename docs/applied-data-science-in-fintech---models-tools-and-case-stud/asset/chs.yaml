  \n### 学习目标\n\n在本章结束时，读者将能够：\n\n*   理解要求\n*   概述特征\n*   解释\n*   理解\n\n### 普通最小二乘法回归\n\
  \n普通最小二乘法（Ordinary Least Squares, OLS）是统计建模和数据分析中的基本概念。它是一种用于估计线性回归模型参数的方法，确保对观测数据的最佳拟合。OLS\
  \ 的关键假设包括线性、独立性、同方差性和误差的正态性。这些假设确保了模型的有效性和可靠性。违反这些假设可能会导致估计偏差或效率低下，因此在应用 OLS 之前检查这些条件至关重要。\n\
  \nOLS 的估计方法涉及最小化观测值与预测值之间的平方和。该方法提供了系数的最佳线性无偏估计（BLUE），使其成为许多分析场景下的首选。\n\nOLS 的应用广泛涉及经济、金融、社会科学和工程等多个领域。例如，在经济学中，OLS\
  \ 用于估计消费支出与收入之间的关系，而在金融领域，它有助于对资产回报建模。\n\n\n\n然而，OLS 并不是没有局限性的。它对离群值敏感，并受到预测变量之间多重共线的显著影响。此外，如果违反了\
  \ OLS 的假设，估计值可能不可靠。可能需要高级技术或稳健方法来解决这些问题。从实践角度来看，金融科技运营者倾向于将 OLS 技术作为最坏情况的模型选择。简而言之，在大多数现实情况下，OLS\
  \ 假设并不成立，因此 OLS 的结果、系数和预测是不准确且不可信的 [6.2]。\n\n## 线性回归模型\n\n根据房间数（RM）预测房价值（MV），我们使用线性模型：\n\
  \nY = β[0] + β[1]X + ε\n\n其中：\n\n* Y = 房价值 (MV) – 因变量\n* X = 房间数 (RM) – 自变量\n* β[0]\
  \ = y 截距（当房间数为 0 时的房价值）\n* β[1] = 斜率（每额外增加一个房间，房价值的变化）\n* ε = 误差项（残差）\n\n### 参数估计\n\
  \nOLS 方法使残差平方和最小：\n\nSSE = Σ(y[i]-yhat[i])² = Σ(y[i]-β[0]-β[1]x[i])²\n\n192.\n\n\
  ### 解析解\n\n**斜率 (β[1]):**\n\n$$\\beta_{1} = \\Sigma\\left( {\\\\text{x}\\_{\\text{i}}\
  \ - \\overline{\\text{x}}} \\right)\\left( {\\\\text{y}\\_{\\text{i}} - \\overline{\\\
  text{y}}} \\right)/\\Sigma\\left( {\\\\text{x}\\_{\\text{i}} - \\overline{\\text{x}}}\
  \ \\right)^{2} = \\left\\\\lbrack {\\\\text{n} \\cdot \\Sigma\\left( {\\\\text{x}\\\
  _{\\text{i}}\\\\text{y}\\_{\\text{i}}} \\right) - \\Sigma\\left( \\text{x}\\_{\\\
  text{i}} \\right) \\cdot \\Sigma\\left( \\text{y}\\_{\\text{i}} \\right)} \\right\\\
  \\rbrack/\\left\\\\lbrack {\\\\text{n} \\cdot \\Sigma\\left( {\\\\text{x}\\_{\\\
  text{i}}}^{2} \\right) - \\left( {\\\\Sigma\\left( \\text{x}\\_{\\text{i}} \\right)}\
  \ \\right)^{2}} \\right\\\\rbrack$$\n\n**截距 (β[0]):**\n\n$$\\beta_{0} = \\overline{\\\
  text{y}} - \\beta_{1} \\cdot \\overline{\\text{x}}$$\n\n其中 $\\overline{x}$ 和 $\\\
  overline{y}$ 是样本均值。\n\n### 模型评估指标\n\n1. **R-squared（决定系数）：**\n\n   $$\\text{R}^{2}\
  \ = 1 - \\text{SSE}/\\text{SST} = 1 - \\Sigma\\left( {\\\\text{y}\\_{\\text{i}}\
  \ - \\hat{\\text{y}}} \\right)^{2}/\\Sigma\\left( {\\\\text{y}\\_{\\text{i}} - \\\
  overline{\\text{y}}} \\right)^{2}$$\n\n2. **均方误差 (MSE):**\n\n   $$\\text{MSE} =\
  \ \\text{SSE} / (n - 2) = \\Sigma\\left( {\\\\text{y}\\_{\\text{i}} - \\hat{\\text{y}}}\
  \ \\right)^{2}/(n - 2)$$\n\n3. **估计标准误差：**\n\n   $$\\text{SE} = \\sqrt{\\text{MSE}}\
  \ = \\sqrt{\\Sigma\\left( {\\\\text{y}\\_{\\text{i}} - \\hat{\\text{y}}} \\right)^{2}/(n\
  \ - 2)}$$\n\n总的来说，`β[0]`、`β[1]` 是核心系数，`MSE` 是模型的准确性衡量。这些输出参数独立地定义了当前模型。在后续操作中，我们将这些参数与其他模型进行比较以做出选择决策。MSE\
  \ 值越低，预测越准确。\n\n#### Python 实现\n\n现在让我们继续进行全面的 Python 实现：193。\n\n```python\nimport\
  \ numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.linear_model\
  \ import LinearRegression\nfrom sklearn.metrics import r2_score, mean_squared_error\n\
  import seaborn as sns\n\n# 加载数据\ndata = pd.read_csv('boston.csv')\nX = data['RM'].values\
  \  # 房间数\ny = data['MV'].values  # 房价值\n\nprint(\"Boston Data Analysis\")\nprint(\"\
  ==================================\")\nprint(f\"Dataset size: {len(X)} observations\"\
  )\nprint(f\"RM (rooms) - Mean: {X.mean():.3f}, Std: {X.std():.3f}\")\nprint(f\"\
  MV (value) - Mean: {y.mean():.3f}, Std: {y.std():.3f}\")\n```\n\n首先，我们加载相关的库并加载我们的数据样本\
  \ `Boston.csv`。接下来我们隔离变量 `RM` 和 `MV`。查看每个基础数组 `mean()` 和 `std()`。为了继续模型设计过程，我们按照如下方式构建手动的\
  \ OLS 实现：\n\n```python\n# 手动计算回归系数\nn = len(X)\nx_mean = np.mean(X)\ny_mean = np.mean(y)\n\
  \n# 计算斜率 (β1) 和截距 (β0)\nnumerator = np.sum((X - x_mean) * (y - y_mean))\ndenominator\
  \ = np.sum((X - x_mean) ** 2)\nbeta_1 = numerator / denominator\nbeta_0 = y_mean\
  \ - beta_1 * x_mean\n\nprint(f\"\\nManual OLS Calculations:\")\nprint(f\"β1 (slope):\
  \ {beta_1:.4f}\")\nprint(f\"β0 (intercept): {beta_0:.4f}\")\n\n# 使用手动系数预测\ny_pred_manual\
  \ = beta_0 + beta_1 * X\nprint(f\"Equation: MV = {beta_0:.4f} + {beta_1:.4f} × RM\"\
  )\n\n# 手动计算 R-squared\nss_res = np.sum((y - y_pred_manual)**2)\nss_tot = np.sum((y\
  \ - y_mean)**2)\nr_squared = 1 - ss_res / ss_tot\n\n# 计算其他指标\nmse_manual = ss_res\
  \ / (n - 2)\nrmse_manual = np.sqrt(mse_manual)\n\nprint(f\"\\nManual Evaluation:\"\
  )\nprint(f\"R2: {r_squared:.4f}\")\nprint(f\"MSE: {mse_manual:.4f}\")\nprint(f\"\
  RMSE: {rmse_manual:.4f}\")\n```\n\n此处，我们通过解析解和模型评估指标来测试数据集。194.\n\n```python\n#\
  \ 使用 scikit-learn 验证\nX_sklearn = X.reshape(-1, 1)  # sklearn 期望 2D 数组\nmodel =\
