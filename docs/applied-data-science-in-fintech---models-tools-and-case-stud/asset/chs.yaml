  \n```python\nfrom scipy import stats\nfrom scipy.stats import jarque_bera, shapiro,\
  \ normaltest\n```\n\n这些测试的数学解释不是在本章的范围之内。\n\n```python\ndef test_normality(returns,\
  \ return_type=\"Returns\"):\n    \"\"\"执行正态性检验\"\"\"\n    print(f\"\\n{'='50}\"\
  )\n    print(f\"NORMALITY FOR {return_type.upper()}\")\n    print(f\"{'='50}\")\n\
  \    # 基础统计\n    print(f\"Descriptive Statistics:\")\n    print(f\"Mean: {returns.mean():.6f}\"\
  )\n    print(f\"Std Dev: {returns.std():.6f}\")\n    print(f\"Skewness: {returns.skew():.6f}\"\
  )\n    print(f\"Kurtosis: {returns.kurtosis():.6f}\")\n    print(f\"Excess Kurtosis:\
  \ {stats.kurtosis(returns):.6f}\")\n\n    # 移除无穷或 NaN 值\n    clean_returns = returns[np.isfinite(returns)]\n\
  \    print(f\"\\nNormality Tests (p-values):\")\n    print(f\"H0: Data is normally\
  \ distributed\")\n    print(f\"H1: Data is not normally distributed\")\n    print(f\"\
  Reject H0 if p-value < 0.05\")\n    print(\"-\" * 40)\n\n    # Shapiro-Wilk 检验 (对小样本最有效)\n\
  \    try:\n        shapiro_stat, shapiro_p = shapiro(clean_returns)\n        print(f\"\
  Shapiro-Wilk Test: p-value = {shapiro_p:.6f}\")\n        print(f\"  Result: {'Reject\
  \ H0 (Not Normal)' if shapiro_p < 0.05 else 'Fail to Reject H0 (Normal)'}\")\n \
  \   except Exception as e:\n        print(f\"Shapiro-Wilk Test: {e}\")\n\n    #\
  \ Jarque-Bera 检验\n    try:\n        jb_stat, jb_p = jarque_bera(clean_returns)\n\
  \        print(f\"Jarque-Bera Test: p-value = {jb_p:.6f}\")\n        print(f\" \
  \ Result: {'Reject H0 (Not Normal)' if jb_p < 0.05 else 'Fail to Reject H0 (Normal)'}\"\
  )\n    except Exception as e:\n        print(f\"Jarque-Bera Test: {e}\")\n\n   \
  \ # D'Agostino-Pearson 检验\n    try:\n        dp_stat, dp_p = normaltest(clean_returns)\n\
  \        print(f\"D'Agostino-Pearson Test: p-value = {dp_p:.6f}\")\n        print(f\"\
  \  Result: {'Reject H0 (Not Normal)' if dp_p < 0.05 else 'Fail to Reject H0 (Normal)'}\"\
  )\n    except Exception as e:\n        print(f\"D'Agostino-Pearson Test: {e}\")\n\
  \n    # Anderson-Darling 检验\n    try:\n        ad_result = anderson(clean_returns,\
  \ dist='norm')\n        print(f\"Anderson-Darling Test: Statistic = {ad_result.statistic:.4f}\"\
  )\n        print(f\"  Critical values: {ad_result.critical_values}\")\n        print(f\"\
  \  Significance levels: {ad_result.significance_level}\")\n\n        # 检查统计量是否超过临界值\n\
  \        for i, (cv, sl) in enumerate(zip(ad_result.critical_values, ad_result.significance_level)):\n\
  \            if ad_result.statistic > cv:\n                print(f\"  At {sl}% significance\
  \ level: Reject H0 (Not Normal)\")\n            else:\n                print(f\"\
  \  At {sl}% significance level: Fail to Reject H0 (Normal)\")\n                break\n\
  \    except Exception as e:\n        print(f\"Anderson-Darling Test: {e}\")\n\n\
  \    return clean_returns\n```\n\n表格形式的小麦时间序列显示出非正态分布特征。\n\n\n\n\n\n```\n==================================================\n\
