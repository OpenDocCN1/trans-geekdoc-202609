  \n## 7.1 引言\n\n通过利用 `machine learning applications`，语言分析可以发现并非显而易见的隐藏语言模式。这些应用使用复杂的算法处理海量数据，以分析文本和语音。例如，机器学习模型可以识别社交媒体对话中的趋势，预测客户情绪并协助语言翻译服务。其中涉及的数据处理技术极其先进，利用自然语言处理（NLP）来高效地分解和解释语言数据。\n\
  \n本章的目的是向读者介绍一种将添加到金融与金融科技工具包中的特定高级工具：`长短期记忆递归网络 (Long Short Term Memory Recurrent\
  \ Network (LSTM))`。我们继续担任 DDF 站 #3 模型选择参与者的角色。根据我们之前在“第 2 章, 金融科技的数据管理”中对 DDF 模型设计工作站的描述，在这一阶段，我们正在构建和创建能够准确预测未来结果的模型。这些模型的成功取决于结果的清晰度和简洁性。清晰简洁的模型设计可以帮助企业做出明智的决策并保持竞争领先。模型设计工作站利用神经网络和聊天机器人等先进技术来创建既高效又有效的模型。\n\
  \n首先，我们让读者接触 LSTM 模型架构，概述其关键模型特征和程序实现。这些网络设计用于识别和预测随时间变化的模式，使其特别适合处理涉及顺序数据的任务。通过利用\
  \ `LSTM RNNs`，研究人员和开发者可以有效处理和分析复杂的语言模式，从而带来更准确的自然语言处理应用。`LSTM RNNs` 的关键方面是由于其独特的内存单元结构，它们能够在长时间内保持信息。这一特征允许它们捕获数据中的长期依赖关系。\n\
  \n其次，我们将设计的 LSTM 应用于结构化数据，特别是加密货币价格。这展示了该模型的顺序能力，并强调了 LSTM 模型适用于数值和文本输入。最后，我们将 `LSTM`\
  \ 应用于专业报告，构建模型根据给定文本生成后续内容的能力。最后，我们使用了相同的 `LSTM` 架构，但现在我们是在莎士比亚的*罗密欧与朱丽叶*上对模型进行训练。这一观察适用于所有的语言框架。`LSTM\
  \ RNNs` 在推进语言分析方面具有巨大潜力。处理顺序数据的能力使其成为开发更智能金融和金融科技应用的关键。\n\n### 学习目标\n\n在本章结束，读者将能够：\n\
  \n* 理解长短期记忆 (`LSTM`) 的实现要求\n* 熟悉 `PyTorch`\n* 理解数值和文本数据之间的区别\n* 意识到数据质量的重要性\n* 能够针对结构化和非结构化数据实现\
  \ `LSTM`\n\n## 7.2 长短期记忆 (LSTM) 神经网络\n\n长短期记忆 (`LSTM`) 模型在时间序列预测中起着关重要的作用，因为它们知道如何捕捉随时间变化的模式。LSTM\
  \ 架构在预测金融市场、天气模式和能源消耗趋势等顺序数据方面表现出色。这些模型能够捕捉到基础模型可能会错过的复杂时间关系。因此，为了 DDF 模型选择过程，我们在本章中关注这种特定的模型架构。\n\
  \n\n\n\n\n在我们继续之前，让我们总结一下在 RNN 架构中发现的问题。首先，梯度消失问题是训练深度 RNN 最大的障碍之一。该问题发生在反向传播过程中，梯度随着时间步的向回传播而变得越来越小。在通过时间反向传播（BPTT）时，梯度在层层之间向回传播时反复相乘，当这些相乘值小于\
  \ 1.0 时，梯度就会收缩得更快；网络越深，早期层接收到的梯度信号就越少。这种影响是深远的，因为 RNN 能够识别相邻和紧密序列元素之间的模式，但无法连接跨越许多时间步的信息\
  \ [7.4]。\n\n其次，虽然某些梯度会消失，但另一些梯度可能会爆炸。梯度爆炸问题发生在反向传播过程中梯度值增长过快时 [7.5]。尽管这比梯度消失不常见，但梯度爆炸同样会严重地破坏学习过程。训练期间较大的梯度值会导致剧烈的权重更新，从而使网络不稳定。在极端情况下，权重可能会大到溢出，产生\
  \ `NaN`（非数字）值，导致学习完全停止。当你发现损失值在更新之间剧烈波动、模型权重增长极快，且误差梯度值保持在 1.0 以上时，就可以发现梯度爆炸。\n\n\
  详细展示 RNN 单元的设计是有建设性的。在下一节中，我们将重点介绍 LSTM 单元及其解决上述 RNN 单元问题的差异。请参考“第 5 章，金融与金融科技机器学习”中提供的之前的程序化分析。237\
  \ 页。\n\n根据图 7.1，如上一节所示，基础 RNN 单元接受 `x^(t)`（当前输入）和 `h^(t−1)`（包含过去信息的上隐藏状态）作为输入，并输出\
  \ `h^(t)`。该输出传递给下一个 RNN 单元并用于预测 `yhat^(t)`。\n\n![图 7.1 RNN 单元设计 返回文本。⏎](img/fig7_1.jpg)\n\
  \n**图 7.1** RNN 单元设计 返回文本。⏎\n\n### LSTM 架构\n\n此实现提供了 LSTM 网络的概念和数学演示 [7.6]。在本节中，我们使用对公式和核心关系的程序化解释，来跟踪\
  \ Python 代码段中的数据流。在下一节中，我们将逐步介绍 LSTM 模型预测加密货币汇率的实际应用。LSTM 架构包含几个新元素：\n\n*   单元状态\
  \ (`C_t`)：流经整个网络的“记忆高速公路”，允许信息在保持不变的情况下传递。\n*   隐藏状态 (`h_t`)：传递到下一个时间步并用于预测的输出状态。\n\
  *   遗忘门：决定从单元状态 `C_{t-1}` 中丢弃哪些信息。\n*   输入/更新门：决定将哪些新信息存储在单元状态 `C_t` 中。\n*   输出门：决定将单元状态的哪些部分作为隐藏状态\
  \ `C_t` 输出。\n\n图 7.2 显示了之前描述的基本 LSTM 单元，它接受 `x^(t)`（当前输入）、`h^(t−1)`（包含过去信息的上隐藏状态）和\
  \ `c^(t−1)`（上单元状态）作为输入，并输出 `h^(t)` 和 `c^(t)`，这些输出传递给下一个 LSTM 单元并用于预测 `yhat^(t)`。\n\
  \n![图 7.2 LSTM 单元设计 返回文本。⏎](img/fig7_2.jpg)\n\n**图 7.2** LSTM 单元设计 返回文本。⏎\n\n###\
  \ 数学公式\n\n流程从输入参数开始，首先进入遗忘门，然后通过输入/更新门并带有候选值更新进行处理，最后进入输出门，交付如前所示的两个输出。代码中实现的 LSTM\
  \ 方程拆解如下：238 页。\n\n`f_t = σ*(W_f⋅x_t + U_f⋅h_{t-1} + b_f)` 遗忘门\n\n`i_t = σ*(W_i⋅x_t+U_i⋅h_{t−1}+b_i)`\
  \ 输入门\n\n$$\\widetilde{\\text{C}}t = tanh\\left( {W\\_{-}c \\cdot x\\_{-}t + U\\\
  _{-}c \\cdot h\\left\\{ {\\\\text{t} - 1} \\right\\} + \\text{b}\\_{-}c} \\right)\\\
  #\\text{候选值}$$\n\n$$\\text{C}\\\\\\\\\\text{t}\\ = \\\\ \\text{f}\\\\\\\\\\text{t}\
  \ \\odot \\text{C}\\\\\\\\\\left\\{ \\text{t-1\\\\}}\\ + \\\\ \\text{i}\\\\\\\\\\\
  text{t} \\\\odot \\widetilde{\\text{C}}\\\\\\\\\\text{t}\\#\\\\text{单元状态更新} \\\\\
  right.$$\n\n`o_t = σ*(W_o⋅x_t + U_o⋅h_{t-1} + b_o)` 输出门\n\n`h_t = o_t ⊙ t` 隐藏状态更新\n\
  \n`⊙` 表示元素相乘。我们在随后的 Python 代码序列中保持此符号。在后续代码中初始化所有门的权重和偏置。每个门都有输入 (W) 和隐藏状态 (U)。\n\
  \n```LSTMCell:\n    \"\"\"\n    长短期记忆 (LSTM) 单元实现\n    LSTM 通过以下方式解决传统 RNN 的梯度消失问题：\n\
  \    1. 单元状态 (C_t)：长期记忆\n    2. 隐藏状态 (h_t)：短期记忆\n    3. 三个门：遗忘、输入、输出\n    \"\"\"\
  \n\n    def __init__(self, input_size: int, hidden_size: int):\n        self.input_size\
  \ = input_size\n        self.hidden_size = hidden_size\n\n        # 初始化所有门的权重和偏置\n\
  \        # 每个门都有输入 (W) 和隐藏状态 (U)，以及偏置 (b)\n        # 遗忘门：决定从单元状态中丢弃哪些信息\n      \
  \  self.Wf = np.random.randn(hidden_size, input_size) * 0.1\n        self.Uf = np.random.randn(hidden_size,\
  \ hidden_size) * 0.1\n        self.bf = np.zeros((hidden_size, 1))\n\n        #\
  \ 输入门：决定将哪些新信息存储在单元状态中\n        self.Wi = np.random.randn(hidden_size, input_size)\
  \ * 0.1\n        self.Ui = np.random.randn(hidden_size, hidden_size) * 0.1\n   \
  \     self.bi = np.zeros((hidden_size, 1))\n\n        # 候选值：单元状态的新候选值\n        self.Wc\
  \ = np.random.randn(hidden_size, input_size) * 0.1\n        self.Uc = np.random.randn(hidden_size,\
  \ hidden_size) * 0.1\n        self.bc = np.zeros((hidden_size, 1))\n\n        #\
  \ 输出门：决定输出单元状态的哪些部分\n        self.Wo = np.random.randn(hidden_size, input_size)\
  \ * 0.1\n        self.Uo = np.random.randn(hidden_size, hidden_size) * 0.1\n   \
  \     self.bo = np.zeros((hidden_size, 1))\n```\n\n在同一个 *class LSTMCell* 中，我们定义\
  \ *sigmoid()* 和 *tanh()* 函数，并继续执行 *forward()* 函数中定义的正向传播步骤。\n\n\n\n\n\n```python\n\
  \    def forward(self, x_t, h_prev, c_prev):\n        \"\"\"\n \n        LSTM 单元的前向传播\n\
  \ \n        数学公式：\n        f_t = σ(W_f @ x_t + U_f @ h_{t-1} + b_f)  # 遗忘门\n   \
  \     i_t = σ(W_i @ x_t + U_i @ h_{t-1} + b_i)  # 输入门\n        C̃_t = tanh(W_c @\
  \ x_t + U_c @ h_{t-1} + b_c)  # 候选值\n        C_t = f_t ⊙ C_{t-1} + i_t ⊙ C̃_t  \
  \         # 细胞状态更新\n        o_t = σ(W_o @ x_t + U_o @ h_{t-1} + b_o)  # 输出门\n  \
  \      h_t = o_t ⊙ tanh(C_t)                     # 隐藏状态更新\n        其中 ⊙ 表示元素级乘法\n\
  \        \"\"\"\n \n        # 将输入重塑为列向量\n        x_t = x_t.reshape(-1, 1) if x_t.ndim\
  \ == 1 else x_t\n        h_prev = h_prev.reshape(-1, 1) if h_prev.ndim == 1 else\
  \ h_prev\n        c_prev = c_prev.reshape(-1, 1) if c_prev.ndim == 1 else c_prev\n\
  \ \n        # 遗忘门：从上一个细胞状态中遗忘什么\n        f_t = self.sigmoid(self.Wf @ x_t + self.Uf\
  \ @ h_prev + self.bf)\n \n        # 输入门：存储哪些新信息\n        i_t = self.sigmoid(self.Wi\
  \ @ x_t + self.Ui @ h_prev + self.bi)\n \n        # 候选值：新的候选值\n        c_tilde_t\
  \ = self.tanh(self.Wc @ x_t + self.Uc @ h_prev + self.bc)\n \n        # 更新细胞状态：结合遗忘的信息和新的信息\n\
  \        c_t = f_t * c_prev + i_t * c_tilde_t\n \n        # 输出门：根据细胞状态输出什么\n   \
  \     o_t = self.sigmoid(self.Wo @ x_t + self.Uo @ h_prev + self.bo)\n \n      \
  \  # 更新隐藏状态\n        h_t = o_t * self.tanh(c_t)\n \n        # 存储中间值用于反向传播\n    \
  \    self.cache = {\n            'x_t': x_t, 'h_prev': h_prev, 'c_prev': c_prev,\n\
  \            'f_t': f_t, 'i_t': i_t, 'c_tilde_t': c_tilde_t,\n            'c_t':\
  \ c_t, 'o_t': o_t, 'h_t': h_t\n        }\n \n        return h_t, c_t\n```\n\n注意，在此阶段，我们返回了\
  \ `h_t` 和 `c_t`，并包含了所有中间计算的缓存值。顺带提一下，这就是为什么我们运行 LSTM 模型需要额外的计算资源和缓存空间的原因之一。反向传播以及\
  \ LSTM 模型的进一步变体和扩展不在本章的范围内。建议读者参阅“延伸阅读”部分以及进一步的高阅读 [7.7]。$\n\n遗忘门过滤网络的记忆，并决定从上一个细胞状态中保留哪些信息。遗忘门方程给我们一个向量\
  \ `f_t`，其中细胞状态中的每个数值介于 0 和 1 之间。接近 1 的值意味着“保留此信息”，而接近 0 的值意味着“完全丢弃此信息”。\n\n输入门选择哪些新信息应该存储在细胞状态中。它与候选细胞状态协作更新内存。输入门产生一个介于\
  \ 0 和 1 之间的向量，充当过滤器。该过滤器决定候选值的哪些部分应该加入细胞状态。`tanh` 函数产生介于 -1 和 1 之间的候选值（C̃_t），可能会更新细胞状态。这些计算让\
  \ LSTM 递归神经网络能够精确地添加新信息同时过滤掉噪声。\n\n输出门管理更新后的细胞状态中哪些信息成为隐藏状态输出。它充当细胞内部内存与外部网络之间的过滤器。与其他门一样，输出门使用\
  \ `sigmoid` 函数产生介于 0 和 1 之间的值。这些值选择细胞状态的哪些部分应该贡献于当前输出并传递到下一个时间步。\n\n最后，我们处理的是细胞状态和隐藏状态的计算。细胞状态作为\
  \ LSTM 神经网络的长期记忆，像一条传送带一样在序列处理过程中携带信息。更新方程混合了旧信息和新信息。元素级乘法（`*`）让每个细胞状态组件独立工作。这种机制帮助\
  \ LSTM 短记忆 神经网络能够在长序列中维持有用信息。然后，隐藏状态显示 LSTM 模型在每个时间步的输出，并馈入下一个层。隐藏状态包含了细胞状态的过滤版本，只显示输出门认为预测预测的部分。\n\
  \n上述所有组件都是 LSTM 架构的基础。它们通过创建梯度跨越时间步流动的清晰路径解决了梯度消失问题。细胞状态的线性交互有助于梯度跨越时间步流动。\n\n\n\
  \n\n\n在上一节中，我们实现了一个完整的 LSTM Cell，它通过合适的权重矩阵和偏置实现了所有门控。此外，我们将实现进行了拆分，以支持多层结构。在这种情况下，我们可以将多个\
  \ LSTM 层堆叠在一起。让我们继续使用这个新构建的 LSTM 网络并使用上一章相同的示例——预测正弦波模式。\n\n243。\n\n```python\n\
  \    # Parameters\n    seq_length = 20\n    input_size = 1\n    hidden_size = 10\n\
  \    output_size = 1\n    num_sequences = 5\n \n    # Create LSTM\n    lstm = LSTM(input_size,\
  \ hidden_size, output_size)\n \n    # Generate training data\n    X_train, y_train\
  \ = create_sine_wave_data(seq_length, num_sequences) #使用与第 5 章相同的函数，生成训练数据 (20,\
  \ 5)，跨越 5 个数据序列的包含 20 个观测值\n \n    print(f\"Training LSTM on {num_sequences} sine\
  \ wave sequences\")\n    print(f\"Sequence length: {seq_length}\")\n    print(f\"\
  Hidden size: {hidden_size}\")\n    print()\n \n    # Demonstrate forward pass on\
  \ one sequence\n    print(\"Forward pass example:\")\n    lstm.reset_states()\n\
  \    outputs, hidden_states = lstm.forward_sequence(X_train[0].squeeze())\n    print(f\"\
  Input shape: {X_train[0].shape}\")\n    print(f\"Output shape: {outputs.shape}\"\
  )\n    print(f\"Number of hidden state layers per timestep: {len(hidden_states[0])}\"\
  )\n    print()\n```\n\n得到以下 LSTM 的分析结果：\n\n```\nTraining LSTM on 5 sine wave sequences\n\
  Sequence length: 20\nHidden size: 10\n \nForward pass example:\nInput shape: (20,\
  \ 1)\nOutput shape: (20, 1)\nNumber of hidden state layers per timestep: 1\n```\n\
  \n图 7.3 显示了门控激活、隐藏状态和记忆演变。我们可以观察到单元状态为梯度跨时间反向传播提供了一条不中断的路径。门控允许网络选择性地记忆、遗忘和输出信息。最后，长距离依赖可以在数百个时间步中保持信息。\n\
  \n![Figure 7.3 LSTM 可视化返回文本。⏎](img/fig7_3.jpg)\n\n图 7.3 LSTM 可视化 返回文本。⏎\n\n在下一节中，我们将从\
  \ `PyTorch` 库内部应用 LSTM 模型。我们首先使用数值数据数据集预测加密货币的价格水平，然后扩展到文本序列 [7.9]。重点是训练数据的质量和训练文本的变化。\n\
  \n## 7.3 结构化数据\n\n金融领域的结构化数据是指高度组织且易于搜索的信息，通常存储在数据库中。这种数据类型包括财务报告、交易记录和市场数据，对于准确的财务分析和决策至关重要。结构化数据后的科学概念在于它可以被算法处理，实现自动化和实时分析。金融资产（如加密货币）的每日收盘价是结构化数据序列的一个典型示例。\n\
  \n244。\n\n### 加密货币量化交易\n\n对于金融和金融科技从业者来说，在数值领域操作是自然而然的，因此在我们进入语言空间之前，先在加密货币量化交易模拟中实现\
  \ LSTM 模型。之后，我们在文本延续示例中使用精确的 LSTM 模型架构。\n\n在这种情况下，我们从 `CryptoCompare API` 提取 1 年的比特币每日价格，遵循类似于“第\
  \ 3 章，数据可视化”中所示的 API 步骤。我们的目标是演示使用 PyTorch 实现的 LSTM 模型。我们预测后续期间的比特币价格——向前预测一天和向前预测七天。图\
  \ 7.4 和 7.5 分别显示了比特币价值的当前水平和过去 1 年的历史观测值。\n\n![Figure 7.4 [Reference altFINS: https://altfins.com/crypto-screener]\
  \ 返回文本。⏎](Images/fig7_4.jpg)\n\n图 7.4 [Reference altFINS: [`altfins.com/crypto-screener`](https://altfins.com/crypto-screener)]\
  \ 返回文本。⏎\n\n![Figure 7.5 [Reference altFINS: https://altfins.com/crypto-screener]\
  \ 返回文本。⏎](Images/fig7_5.jpg)\n\n图 7.5 [Reference altFINS: [`altfins.com/crypto-screener`](https://altfins.com/crypto-screener)]\
  \ 返回文本。⏎\n\n245。\n\n### 数据准备\n\n在此 LSTM 实现中，核心输入数据流是比特币每日价格序列。为了实现任何神经网络，我们需要 (i)\
  \ 创建向量化数据解释以及 (ii) 缩放相关数据流。\n\n```python\nclass BitcoinDataset(Dataset):\n    def\
  \ __init__(self, data, seq_length):\n        self.data = data\n        self.seq_length\
  \ = seq_length\n \n    def __len__(self):\n        return len(self.data) - self.seq_length\n\
  \ \n    def __getitem__(self, idx):\n        x = self.data[idx:idx + self.seq_length]\n\
  \        y = self.data[idx + self.seq_length]\n        return torch.FloatTensor(x),\
  \ torch.FloatTensor([y])\n```\n\nPyTorch Tensor 是多维数组，是 PyTorch 库中的基础构建模块，广泛用于深度学习和科学计算。这些张量类似于\
  \ NumPy 数组，但具有额外的功能，使其适用于 GPU 加速，从而实现高效计算。它们与 CUDA 无缝集成的能力加速了计算速度，这对于高级分析和实时数据处理至关重要。\n\
  \n此时，我们准备了缩放后的 (0, 1) 训练数据序列 (80%) 和测试数据序列 (20%)。\n\n246。\n\n```python\ndef prepare_data(df,\
  \ seq_length=30, train_split=0.8):\n    \"\"\"\n \n    为 LSTM 训练准备数据\n    \"\"\"\
  \n \n    print(\"正在准备 LSTM 数据...\")\n \n    # 提取价格列\n    prices = df['price'].values.reshape(-1,\
  \ 1)\n \n    # 归一化数据\n    scaler = MinMaxScaler(feature_range=(0, 1))\n    scaled_prices\
  \ = scaler.fit_transform(prices)\n \n    # 划分训练集和测试集\n    train_size = int(len(scaled_prices)\
  \ * train_split)\n    train_data = scaled_prices[:train_size]\n    test_data = scaled_prices[train_size:]\n\
  \ \n    # 创建数据集\n    train_dataset = BitcoinDataset(train_data.flatten(), seq_length)\n\
  \    test_dataset = BitcoinDataset(test_data.flatten(), seq_length)\n \n    return\
  \ train_dataset, test_dataset, scaler, train_size\n```\n\n现在，我们可以提取所需的时间序列了。我们利用了第\
  \ 2 章之前的代码序列。我们依赖 CryptoCompare 的功能将比特币（连续）“价格”聚合为每日频率。\n\n\n\n\n\n```python\ndef\
  \ fetch_bitcoin_data(days=365):\n    \"\"\"\n \n    从 CryptoCompare API 获取比特币价格数据\n\
  \    \"\"\"\n \n    print(\"Fetching Bitcoin price data…\")\n \n    # CryptoCompare\
  \ 用于每日历史数据的 API 端\n    url = \"https://min-api.cryptocompare.com/data/v2/histoday\"\
  \n \n    params = {\n        'fsym': 'BTC',      # 源符号（比特币）\n        'tsym': 'USD',\
  \      # 目标符号（美元）\n        'limit': days,      # 天数\n        'aggregate': 1    \
  \  # 每日聚合\n    }\n \n    try:\n        response = requests.get(url, params=params)\n\
  \        response.raise_for_status()\n        data = response.json()\n        if\
  \ data['Response'] == 'Success':\n            price_data = data['Data']['Data']\n\
  \n            # 转换为 DataFrame\n            df = pd.DataFrame(price_data)\n     \
  \       df['date'] = pd.to_datetime(df['time'], unit='s')\n            df = df[['date',\
  \ 'close']].rename(columns={'close': 'price'})\n            df = df.sort_values('date').reset_index(drop=True)\n\
  \n            print(f\"Successfully fetched {len(df)} days of Bitcoin price data\"\
  )\n            return df\n        else:\n            raise Exception(f\"API Error:\
  \ {data.get('Message', 'Unknown error')}\")\n\n    except Exception as e:\n    \
  \    print(f\"Error fetching data: {e}\")\n        return None\n```\n\n生成的以下时间序列数据摘要\n\
  \n```\nFetching Bitcoin price data…\nSuccessfully fetched 366 days of Bitcoin price\
  \ data\nPrice range: $53954.33 - $111722.11\nDate range: 2024-06-29 00:00:00 to\
  \ 2025-06-29 00:00:00\n```\n\n247。\n\n### 设计\n\n从模型设计的角度来看，我们可以使用 `PyTorch` 库中预构建的\
  \ LSTM 模型。\n\n```python\nclass BitcoinLSTM(nn.Module):\n    def __init__(self, input_size=1,\
  \ hidden_size=50, num_layers=2, output_size=1, dropout=0.2):\n        super(BitcoinLSTM,\
  \ self).__init__()\n        self.hidden_size = hidden_size\n        self.num_layers\
  \ = num_layers\n\n        self.lstm = nn.LSTM(input_size, hidden_size, num_layers,\n\
  \                            batch_first=True, dropout=dropout)\n        self.dropout\
  \ = nn.Dropout(dropout)\n        self.linear = nn.Linear(hidden_size, output_size)\n\
  \n    def forward(self, x):\n        # 初始化隐藏状态和细胞状态\n        h0 = torch.zeros(self.num_layers,\
  \ x.size(0), self.hidden_size)\n        c0 = torch.zeros(self.num_layers, x.size(0),\
  \ self.hidden_size)\n\n        # 前向传播 LSTM\n        out, _ = self.lstm(x, (h0, c0))\n\
  \n        # 应用 dropout\n        out = self.dropout(out[:, -1, :])  # 取最后一个输出\n\n\
  \        # 应用线性层\n        out = self.linear(out)\n        return out\n```\n\n在类\
  \ `BitcoinLSTM` 类中，我们预定义了一个带有 dropout（正则化）的 2 层 LSTM，并使用默认的 Adam 优化器。\n\n### 训练\n\
  \n在此演示中，我们预先指定了模型超参数：轮数（epoch）设置为 100，批大小（batch size）设置为每批 32，学习率设置为 0.001，隐藏层大小设置为\
  \ 50 个 LSTM 单元。此外，模型使用最后 30 天的价格数据来预测后续价格。所有模型参数都是可调整的，是模型设计阶段的关键部分。\n\n248。\n\n\
  ```python\ndef train_model(train_dataset, test_dataset, seq_length=30, epochs=100,\
  \ batch_size=32, lr=0.001):\n    \"\"\"\n\n    训练 LSTM 模型\n    \"\"\"\n\n    print(\"\
  Training LSTM model…\")\n\n    # 创建数据加载\n    train_loader = DataLoader(train_dataset,\
  \ batch_size=batch_size, shuffle=True)\n    test_loader = DataLoader(test_dataset,\
  \ batch_size=batch_size, shuffle=False)\n\n    # 初始化模型\n    model = BitcoinLSTM(input_size=1,\
  \ hidden_size=50, num_layers=2)\n    criterion = nn.MSELoss()\n    optimizer = torch.optim.Adam(model.parameters(),\
  \ lr=lr)\n    scheduler = torch.optim.lr_scheduler.ReduceROnPlateau(optimizer, patience=10,\
  \ factor=0.5)\n\n    # 训练循环\n    train_losses = []\n    val_losses = []\n\n    for\
  \ epoch in range(epochs):\n        # 训练阶段\n        model.train()\n        train_loss\
  \ = 0\n        for batch_x, batch_y in train_loader:\n            batch_x = batch_x.unsqueeze(-1)\
  \  # 添加特征维度\n\n            optimizer.zero_grad()\n            outputs = model(batch_x)\n\
  \            loss = criterion(outputs, batch_y)\n            loss.backward()\n \
  \           optimizer.step()\n            train_loss += loss.item()\n\n        #\
  \ 验证阶段\n        model.eval()\n        val_loss = 0\n        with torch.no_grad():\n\
  \            for batch_x, batch_y in test_loader:\n                batch_x = batch_x.unsqueeze(-1)\n\
  \                outputs = model(batch_x)\n                loss = criterion(outputs,\
  \ batch_y)\n                val_loss += loss.item()\n\n        train_loss /= len(train_loader)\n\
  \        val_loss /= len(test_loader)\n        train_losses.append(train_loss)\n\
  \        val_losses.append(val_loss)\n        scheduler.step(val_loss)\n\n     \
  \   if (epoch + 1) % 10 == 0:\n            print(f\"Epoch {epoch+1}/{epochs}, Train\
  \ Loss: {train_loss:.4f}, Val Loss: {val_loss:.4f}\")\n\n    return model, train_losses,\
  \ val_losses\n```\n\n生成的以下时间序列数据摘要\n\n```\nFetching Bitcoin price data…\nSuccessfully\
  \ fetched 366 days of Bitcoin price data\nPrice range: $53954.33 - $111722.11\n\
  Date range: 2024-06-29 00:00:00 to 2025-06-29 00:00:00\n```\n\n247。\n\n### 设计\n\n\
  从模型设计的角度来看，我们可以使用 `PyTorch` 库中预构建的 LSTM 模型。\n\n```python\nclass BitcoinLSTM(nn.Module):\n\
  \    def __init__(self, input_size=1, hidden_size=50, num_layers=2, output_size=1,\
  \ dropout=0.2):\n        super(BitcoinLSTM, self).__init__()\n        self.hidden_size\
  \ = hidden_size\n        self.num_layers = num_layers\n\n        self.lstm = nn.LSTM(input_size,\
  \ hidden_size, num_layers,\n                            batch_first=True, dropout=dropout)\n\
  \        self.dropout = nn.Dropout(dropout)\n        self.linear = nn.Linear(hidden_size,\
  \ output_size)\n\n    def forward(self, x):\n        # 初始化隐藏状态和细胞状态\n        h0\
  \ = torch.zeros(self.num_layers, x.size(0), self.hidden_size)\n        c0 = torch.zeros(self.num_layers,\
  \ x.size(0), self.hidden_size)\n\n        # 前向传播 LSTM\n        out, _ = self.lstm(x,\
  \ (h0, c0))\n\n        # 应用 dropout\n        out = self.dropout(out[:, -1, :]) \
  \ # 取最后一个输出\n\n        # 应用线性层\n        out = self.linear(out)\n        return out\n\
  ```\n\n在类 `BitcoinLSTM` 类中，我们预定义了一个带有 dropout（正则化）的 2 层 LSTM，并使用默认的 Adam 优化器。\n\n\
  ### 训练\n\n在此演示中，我们预先指定了模型超参数：轮数（epoch）设置为 100，批大小（batch size）设置为每批 32，学习率设置为 0.001，隐藏层大小设置为\
  \ 50 个 LSTM 单元。此外，模型使用最后 30 天的价格数据来预测次日价格。所有模型参数都是可调整的，是模型设计阶段的关键部分。\n\n248。\n\n\
  ```python\ndef train_model(train_dataset, test_dataset, seq_length=30, epochs=100,\
  \ batch_size=32, lr=0.001):\n    \"\"\"\n\n    训练 LSTM 模型\n    \"\"\"\n\n    print(\"\
  Training LSTM model…\")\n\n    # 创建数据加载\n    train_loader = DataLoader(train_dataset,\
  \ batch_size=batch_size, shuffle=True)\n    test_loader = DataLoader(test_dataset,\
  \ batch_size=batch_size, shuffle=False)\n\n    # 初始化模型\n    model = BitcoinLSTM(input_size=1,\
  \ hidden_size=50, num_layers=2)\n    criterion = nn.MSELoss()\n    optimizer = torch.optim.Adam(model.parameters(),\
  \ lr=lr)\n    scheduler = torch.optim.lr_scheduler.ReduceROnPlateau(optimizer, patience=10,\
  \ factor=0.5)\n\n    # 训练循环\n    train_losses = []\n    val_losses = []\n\n    for\
  \ epoch in range(epochs):\n        # 训练阶段\n        model.train()\n        train_loss\
  \ = 0\n        for batch_x, batch_y in train_loader:\n            batch_x = batch_x.unsqueeze(-1)\
  \  # 添加特征维度\n\n            optimizer.zero_grad()\n            outputs = model(batch_x)\n\
  \            loss = criterion(outputs, batch_y)\n            loss.backward()\n \
  \           optimizer.step()\n            train_loss += loss.item()\n\n        #\
  \ 验证阶段\n        model.eval()\n        val_loss = 0\n        with torch.no_grad():\n\
  \            for batch_x, batch_y in test_loader:\n                batch_x = batch_x.unsqueeze(-1)\n\
  \                outputs = model(batch_x)\n                loss = criterion(outputs,\
  \ batch_y)\n                val_loss += loss.item()\n\n        train_loss /= len(train_loader)\n\
  \        val_loss /= len(test_loader)\n        train_losses.append(train_loss)\n\
  \        val_losses.append(val_loss)\n        scheduler.step(val_loss)\n\n     \
  \   if (epoch + 1) % 10 == 0:\n            print(f\"Epoch {epoch+1}/{epochs}, Train\
  \ Loss: {train_loss:.4f}, Val Loss: {val_loss:.4f}\")\n\n    return model, train_losses,\
  \ val_losses\n```\n\n\n\n\n金融领域的非结构化数据是指无法整齐放入传统行行列数据库中的信息。这包括电子邮件、社交媒体帖子和财经新闻文章，这些信息都富有见解，但分析起来具有挑战性。对非结构化数据的分析涉及自然语言处理（`NLP`）和机器学习算法等复杂技术，以提取价值的模式和趋势。然而，主要的挑战在于非结构化数据的海量和多样性，这对于传统数据处理系统来说可能是难以承受的。因此，在本章中使用\
  \ `LSTM` 模型。\n\n251.\n\n# 文本续接\n\n通常情况下，`ML` 和 `AI` 中的文本续接或文本生成代表了一个复杂的科学概念。这项技术使\
  \ `AI` 系统能够根据上文内容预测并生成下一段文本，模拟人类的写作方式。然而，通往完美文本续接的道路充满了挑战。一个重大障碍是确保长文本的连贯性和上下文保留。`AI`\
  \ 模型在维持逻辑进展方面往往很吃力，导致内容脱节或无关。此外，训练数据中存在的偏见可能会无意中影响 `AI` 的输出，引发伦理考量。鉴于我们在之前的章节中引入了\
  \ `LSTM` 模型，现在我们应用该架构并向模型输入文本，而不是数字序列。结果不是数字或数字序列的预测，而是文本续接或生成。\n\n如前所述，`LSTM` 模型的设计是由门控机制驱动的。这些门控帮助\
  \ `LSTMs` 在信息通过网络时选择记忆什么。假设我们正在生成一个关于天气的句子——即使在处理了许多其他单词后，模型仍跟踪主语（`rain`）。细胞状态像一条信息公路，贯穿整个序列且干扰极小。这意味着\
  \ `LSTMs` 可以携带早期步骤的重要上下文，而不会丢失或改变。当你生成文本时，较长段落中存在一致的主题、主体叙事流。`LSTM` 文本生成遵循自回归方法——它基本上是一个下一个词预测的链条。\n\
  \n基本上，模型从海量文本数据集中学习。在训练期间，它找出词汇在特定语文中出现的概率。它查看输入序列，并根据之前的所有内容猜测下一个词。你从一个提示（prompt）或种子序列开始，模型处理该提示并计算每个可能的下一个词的概率，然后根据这些概率进行挑选和选择。词汇被选中并连接成序列。这个过程随着每次新的预测而重复。类似于自回归过程，我们在演示中使用的\
  \ `PyTorch LSTM` 实现通过循环来处理这种自回归特性。每一轮将上一次的输出作为下一次预测的输入。模型的隐藏状态传递了之前所有词的上下文，这有助于在多个句子中创建出对任何读者来说都有意义的连贯的文本。\n\
  \n# 数据准备\n\n在本次演示中，我们利用之前的 `LSTM` 模型处理文本，并为文本生成提供框架。具体而言，我们使用了 `.pdf` `[7.10]` 中的\
  \ `2023 摩根通年度报告`。\n\n```python\nclass TextDataset(Dataset):\n    def __init__(self,\
  \ sequences, targets):\n        self.sequences = sequences\n        self.targets\
