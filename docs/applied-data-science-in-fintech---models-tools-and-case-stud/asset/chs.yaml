  \ x`。\n\n### LASSO 回归\n\nLASSO 正则化（也称为 L1 正则化）是线性回归中一种技术，用于通过将某些系数压缩为零来防止过拟合并增强解释性。这是通过在损失函数中添加惩罚项实现的，该惩罚基于系数的绝对值。\n\
  \n#### LASSO 目标函数\n\nLASSO 添加了 L1 惩罚项：\n\n`||y - Xβ||² + λ||β||₁`\n\n其中：\n- `λ ≥\
  \ 0`: 控制收缩强度的正则化参数\n- `||β||₁`: L1 范数（绝对值之和）\n\n#### 关键属性\n\n1. **收缩**：随着 `λ` 的增加，系数向向零收缩。\n\
  2. **稀疏性**：L1 惩罚可以将系数精确地置为零。\n3. **变量选择**：自动选择相关特征。\n4. **偏差-方差权衡**：引入偏差以减少方差。\n\
  \n#### 优化\n\nLASSO 优化是一个凸问题，但由于 L1 惩罚的存在，它是不可微的。常用算法包括：\n\n- **坐标下降法 (Coordinate\
  \ Descent)**：每次迭代优化一个系数\n- **LARS (最小角度回归)**：高效的路径算法\n- **近端梯度法 (Proximal Gradient\
  \ Methods)**：处理非平滑惩罚\n\n##### 用于选择 λ 的交叉验证\n\n通常使用 k 折交叉验证选择最优 λ：\n\n`CV(λ) = (1/k)\
  \ * Σ MSEᵢ(λ)`\n\n其中 MSEᵢ(λ) 是第 i 折折上的均方误差。\n\n#### Python 实现\n\n与之前的 OLS 回归章节一样，我们加载相关数据、我们的\
  \ `Boston.csv` 样本并扩展了基础描述性统计。\n\n\n\n\n\n```python\n# 创建可视化\nfig, axes = plt.subplots(2,\
