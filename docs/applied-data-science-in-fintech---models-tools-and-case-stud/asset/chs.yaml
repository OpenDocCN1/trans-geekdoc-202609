  \ 提示](img/fig4_7i.jpg)\n\n图 4.7(i) LLM 提示\n\n![图 4.7(ii) LLM 提示结果](img/fig4_7ii.jpg)\n\
  \n图 4.7(ii) LLM 提示结果\n\n### 自回归整合移动平均 (ARIMA)\n\n自回归整合移动平均 (ARIMA) 模型是处理时间序列数据流时最常用的建模方法之一。这种多功能模型结合了三个关键组件：`自回归`\
  \ (AR)，使用过去值预测未来值；`整合` (I)，通过对数据进行差分使其平稳；以及`移动平均` (MA)，结合了观测值与过去观测残差误差之间的依赖关系。ARIMA\
  \ 在捕捉数据中的复杂模式方面特别有效，在经济、金融和天气预报等领域具有极高价值。它处理季节性和非季节数据集的能力使其与简单的预测方法区分开来。通过调整每个组件的参数，分析师可以微调模型以适应从股票价格到销售数据的各种时间序列数据。这种灵活性和准确性奠定了\
  \ ARIMA 作为现代时间序列分析和预测建模基石的地位。\n\nARIMA 属于用于时间序列分析和预测的标准统计模型组：\n\n*   自回归 (AR) 使用过去或滞后观测值定义模型变量\n\
  *   整合 (I) 定义时间序列的差分以使时间序列平稳\n*   移动平均 (MA) 定义观测值与模型残差误差之间的依赖关系\n*   `y^′[t] = c\
  \ + φ[1]y^′[t−1] + ... + φ[p]y^′[t−p] + θ[1]ϵ[t−1] + ... + θ[q]ϵ[t−q] + ϵ[t]`\n\n\
  其中 `y^′[t]` 是差分后的时间序列，`c` 是截距，`φ[1]y^′[t−1] + ... + φ[p]y^′[t−p]` 是滞后值，`θ[1]ϵ[t−1]\
  \ + ... + θ[q]ϵ[t−q] + ϵ[t]` 是滞后误差。这里是几个例子：\n\n*   `ARIMA(2,0,1) = y[t] = a[1]y[t−1]\
  \ + a[2]y[t−2] + b[1]ϵ[t−1]`\n*   `ARIMA(3,0,1) = y[t] = a[1]y[t−1] + a[2]y[t−2]\
  \ + a[3]y[t−3] + b[1]ϵ[t−1]` （注：根据文本模式进行了一致性调整）\n\n\n\n\n\n```python\n# ****** 图表（基础）\
  \ ******\n# 让我们来研究时间序列图 #\n## 设置 seaborn 样式\nsns.set(style='whitegrid', context='notebook')\n\
  # 温度随时间的变化 #\nplt.figure(figsize=(12, 6))\nplt.title(\"Temperature Over Time\",\
  \ fontsize=16)\nsns.lineplot(x='time', y='temperature', data=df, label=\"Temperature\"\
  )\nplt.xlabel('Date', fontsize=16)\nplt.ylabel('Temperature in Fahrenheit', fontsize=16)\n\
  plt.legend(loc=\"upper right\", fontsize=14)\nplt.xticks(fontsize=16)\nplt.yticks(fontsize=16)\n\
  plt.grid(True)\n\n## 保存/显示图表\n# plt.savefig(os.path.join(export_path, 'temperature.png'))\n\
  plt.show()\n\n# 能源消耗随时间的变化 #\nplt.figure(figsize=(12, 6))\nplt.title(\"Energy Usage\
  \ [kW] Over Time\", fontsize=16)\nsns.lineplot(x='time', y='use_House', data=df,\
  \ label='Energy Usage [kW]')\nplt.xlabel('Date', fontsize=16)\nplt.ylabel('Energy\
  \ Usage [kW]', fontsize=16)\nplt.legend(loc=\"upper right\", fontsize=14)\nplt.xticks(fontsize=16)\n\
  plt.yticks(fontsize=16)\nplt.grid(True)\n\n## 保存/显示图表\n# plt.savefig(os.path.join(export_path,\
  \ 'energy_usage.png'))\nplt.show()\n```\n\n鉴于这两个特征之间存在明显的模式，如图 4.8 和 4.9 所示，我们运行了一个添加了多项式项的简单回归。`多项式普通最小二法回归`在数据科学领域起着至关重要的作用，为变量之间的复杂关系建模提供了强大的工具。这种高级技术通过允许存在`曲线关系`扩展了简单线性回归的能力，对于分析不遵循严格线性模式的现实世界现象具有极高的价值。在数据科学应用中，多项式回归在处理呈现非线性趋势的数据集时表现优异，使分析师能够`捕捉复杂的模式`并做出更准确的预测。它的重要性在于能够平衡模型复杂度与可解释性，提供关于不同因素在不同尺度下相互作用的见解。通过使用多项式项，数据科学家可以揭示数据中隐藏的关系，从而获得更稳健的模型和对底层过程更深层的理解。这种多功能性使多项式普通最小二法回归成为数据科学家工具箱中的`本质工具`，适用于从经济到环境科学的各个领域，在这些领域中，理解细微的关系是驱动明智决策和创新的关键。\n\
  \n146.\n\n```python\n# ****** 图表（高级）    ******\n# ****** 散点图           ******\n\
  # ****** 带 OLS 回归线          ******\n\nfrom sklearn.linear_model import LinearRegression\n\
  from sklearn.preprocessing import PolynomialFeatures\n\n## 定义数据\nX = df[['temperature']].values\n\
  y = df[['use_House']].values\n\n## 执行并绘制线性或多项式回归的函数\ndef lin_regplot(X, y, degree=1,\
  \ save_path=None):\n    plt.figure(figsize=(10, 6))\n\n    # 如果次数 > 1，则创建多项式特征\n\
  \    if degree > 1:\n        poly = PolynomialFeatures(degree)\n        X_poly =\
  \ poly.fit_transform(X)\n    else:\n        X_poly = X\n\n    # 拟合模型\n    slr =\
  \ LinearRegression()\n    slr.fit(X_poly, y)\n    y_pred = slr.predict(X_poly)\n\
  \n    # 打印参数\n    if degree == 1:\n        print('Slope: %.3f' % slr.coef_[0])\n\
  \        print('Intercept: %.3f' % slr.intercept_[0])\n    else:\n        print(f'Polynomial\
  \ Coefficients: {slr.coef_}')\n        print(f'Intercept: {slr.intercept_[0]})\n\
  \n    # 绘图\n    sns.scatterplot(x=X.flatten(), y=y.flatten(), s=50, label='Actual\
  \ Data')\n    # 为了平滑线条对值进行排序\n    sorted_idx = np.argsort(X.flatten())\n    X_sorted\
  \ = X.flatten()[sorted_idx]\n\n    y_pred_sorted = y_pred.flatten()[sorted_idx]\n\
  \n    plt.plot(X_sorted, y_pred_sorted, color='red', linewidth=2, label=f'{degree}-degree\
  \ Regression Line')\n    plt.title('Temperature vs. Energy Use', fontsize=16)\n\
  \    plt.xlabel('Temperature (F)', fontsize=14)\n    plt.ylabel('Energy Use (kW)',\
  \ fontsize=14)\n    plt.legend()\n    plt.grid(True)\n    plt.tight_layout()\n\n\
  \    # 如果提供了 save_path，则保存图表\n    if save_path:\n        plt.savefig(os.path.join(save_path,\
  \ 'ols_regression.png'))\n\n    # 显示图表\n    plt.show()\n```\n\n从图 4.10 所示的视觉数据解释可以看出，能源消耗与外部温度之间的关系是复杂的，任何预测模型框架都需要引入额外的特征和技术来解释“缺失”的解释力。\n\
