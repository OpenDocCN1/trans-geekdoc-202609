  在每一轮迭代（epoch）中，我们都会收集模型历史以进行进一步评估。因此，下一个逻辑步骤是模型评估。\n\n336.  \n\n```python\n    def\
  \ evaluate_model(self):\n        \"\"\"Evaluate model performance\"\"\"\n      \
  \  # Make predictions on test set\n        test_predictions = self.model.predict(self.X_test)\n\
  \        # Inverse transform to get actual prices\n        test_predictions = self.scaler.inverse_transform(test_predictions)\n\
  \        y_test_actual = self.scaler.inverse_transform(self.y_test.reshape(-1, 1))\n\
  \ \n        # Calculate metrics\n        mse = mean_squared_error(y_test_actual,\
  \ test_predictions)\n        mae = mean_absolute_error(y_test_actual, test_predictions)\n\
  \        rmse = np.sqrt(mse)\n        print(f\"\\nModel Performance:\")\n      \
  \  print(f\"RMSE: ${rmse:.2f}\")\n        print(f\"MAE: ${mae:.2f}\")\n        print(f\"\
  MSE: ${mse:.2f}\")\n \n        return {\n            'rmse': rmse,\n           \
  \ 'mae': mae,\n            'mse': mse,\n            'predictions': test_predictions,\n\
  \            'actual': y_test_actual\n        }\n```\n\n该函数手动对之前缩放的数据进行逆逆变换，以便将预测值与实际观测值进行比较，并提供关键的准确性指标，如\
  \ `MSE`、`MAE` 和 `RMSE`。我们再次返回这些指标并在每次迭代中进行捕捉。最后的关键模型设计组件是实际预测。\n\n```python\n  \
  \  def predict_future(self, days_ahead):\n  \"\"\"Predict future prices\"\"\"\n\
  \  # Get the last sequence from the data\n  last_sequence = self.scaler.transform(\n\
  \    self.original_data['Price'].tail(self.sequence_length).values.reshape(-1, 1)\n\
  \  )\n \n  predictions = []\n  current_sequence = last_sequence.flatten()\n \n \
  \ for _ in range(days_ahead):\n    # Reshape for prediction\n    X_pred = current_sequence.reshape(1,\
  \ self.sequence_length, 1)\n \n    # Make prediction\n    next_pred = self.model.predict(X_pred,\
  \ verbose=0)[0, 0]\n    predictions.append(next_pred)\n \n    # Update sequence\
  \ for next prediction\n    current_sequence = np.append(current_sequence[1:], next_pred)\n\
  \ \n  # Inverse transform predictions\n  predictions = self.scaler.inverse_transform(np.array(predictions).reshape(-1,\
  \ 1))\n \n  return predictions.flatten()\n```\n\n此函数触发针对给定时间前瞻期的模型预测，在我们的案例中，我们使用了\
  \ 1 天、7 天和 30 天的前瞻。现在，我们可以将模型设计应用于我们的农业科技（AgTech）业务案例中。\n\n### 估值\n\n为了叙述简便，本章仅包含了核心\
