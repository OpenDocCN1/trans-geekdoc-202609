  \  def __getitem__(self, idx):\n        return torch.tensor(self.sequences[idx],\
  \ dtype=long), torch.tensor(self.targets[idx], dtype=long)\n```\n\n在语言中，`embedding`（嵌入）是至关重要的。我们将文本转换为数值表示：\n\
  \n```python\n    def preprocess_text(self, text):\n        \"\"\"清洗并分词化文本\"\"\"\n\
