  \ \nprint(df + 50) # 给 DataFrame 中的每个元素加 50\n```\n\n### 提取、转换、加载 (ETL)\n\n在本站中，我们旨在利用\
  \ `pandas` 和 `NumPy` 库来演示结构化数据处理和数据控制。特别关注以下内容：\n\n*   数据加载\n*   数据清洗与格式化\n    *\
  \   列格式化\n    *   日期格式化\n    *   清洗/重复控制\n    *   以 `df` 格式交付给站点 2\n\n128. 数据可以从\
  \ Kaggle 下载 [4.2]。由于我们提供了 `.csv` 格式的提取 (E) 和转换 (T) 数据流，我们的首要任务是将数据集加载 (L) 到计算环境中。在访问和下载数据后的第一步，我们将文件设置为只读。基本上，这是为了确保原始数据源被视为唯一事实来源（source\
  \ of truth）。\n\n```\nFUNCTION Station1_loadData(etl_path, export_path):\n    # 阶段\
  \ 1: 提取、转换、加载 (ETL)\n    # 目的：加载、清洗并为下一阶段准备数据\n\n    # 变体 #1：从内部文件加载 CSV 数据\n  \
  \  LOAD data FROM CSV file located at etl_path INTO df\n\n    # 显示关于数据的信息\n    CALCULATE\
  \ number of rows (nRow) and columns (nCol) IN df\n    PRINT number of rows and columns\n\
  \    PRINT first 5 rows, last 5 rows\n    PRINT column information and data types\n\
  \n    # 清洗：为站点 2 准备数据\n    # 包含错误的最后一行\n    REMOVE last row FROM df\n\n    # 处理缺失或无效值\n\
  \    REPLACE infinities (positive/negative) WITH NaN IN df\n    DROP rows containing\
  \ NaN values\n\n    # 清洗列名\n    RENAME columns BY REMOVING '[kW]' FROM their names\n\
  \n    # 转换并处理时间列\n    CONVERT 'time' column TO datetime format USING Unix timestamp\n\
  \    SET datetime index BASED on starting date '2016-01-01 05:00' WITH minute frequency\n\
  \n    # 添加星期信息\n    ADD new column 'day_of_week' BASED on day name FROM 'time' column\n\
  \n    # 设置 'time' 为索引并去重\n    SET 'time' column AS index IN df\n    REMOVE duplicate\
  \ timestamps, KEEPING last occurrence\n\n    # 处理 'cloudCover' 列中的错误\n    CONVERT\
  \ 'cloudCover' column TO numeric, REPLACING errors WITH NaN\n    BACKFILL missing\
  \ values IN 'cloudCover'\n\n    # 分析分类列\n    DISPLAY head of 'icon' and 'summary'\
  \ columns\n    CALCULATE value counts and percentage distributions FOR 'icon' column\n\
  \n    # 相关性分析\n    FILTER numeric columns FROM df INTO numeric_df\n    COMPUTE correlation\
  \ matrix FOR numeric_df\n    PLOT heatmap of correlation matrix\n\n    # 数据聚合与可视化\n\
  \    PLOT daily and weekly resampled mean of 'use' column\n    PLOT bar charts FOR\
  \ energy usage grouped BY 'summary' and 'icon'\n\n    # 导出清洗后的数据\n    EXPORT df\
  \ TO CSV file located at export_path\n\n    RETURN df\nEND FUNCTION\n```\n\n129.\
  \ 数据可以从 Kaggle 下载 [4.2]。由于我们提供了 `.csv` 格式的提取 (E) 和转换 (T) 数据流，我们的首要任务是将数据集加载 (L)\
  \ 到计算环境中。在访问和下载数据后的第一步，我们将文件设置为只读。基本上，这是为了确保原始数据源被视为唯一事实来源（source of truth）。\n\n\
  130. 131.\n\n\n\n\n```python\nimport pandas as pd\nimport numpy as np\nfrom datetime\
  \ import datetime\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport\
  \ kagglehub\n\n## 下载最新版本\n# path = kagglehub.dataset_download(\"taranvee/smart-home-dataset-with-weather-information\"\
  )\n\netl_path = r'HomeC.csv'\nexport_path = r'DDF_Station_1.csv'\ndef Station1_loadData(etl_path,\
  \ export_path):\n    \"\"\"\n    阶段 1: 提取、转换、加载 (ETL)\n    处理提取和传输阶段后的数据加载\n   \
  \ :return: 清洗后的数据集\n    \"\"\"\n\n    ## 加载变体 #1: 直接从内部文件系统读取文件\n    # 此文件是只读的，且不能更改，因为它是原始的事实来源\n\
  \    # 将 CSV 文件加载到 DataFrame 中\n    df = pd.read_csv(etl_path, delimiter=',', low_memory=False)\n\
  \n    # 显示 DataFrame 的基本信息\n    nRow, nCol = df.shape\n    print(f'There are {nRow}\
  \ rows and {nCol} columns')\n    print(df.head(5))\n    print(df.tail(5))\n    print(df.info())\n\
  \    # 检查列\n    print(df.columns)\n    # 数据类型 #\n    print(df.dtypes)\n\n    ##\
  \ 清洗：清洗数据集以准备移交给工作站 #2\n    # 删除最后一行，因为它包含一个 \"/\" 错误\n    df = df.iloc[:-1]\n\n\
  \    # 检查 NaN / Infs 等\n    df = df.replace([np.Inf, -np.Inf], np.NaN)\n    df =\
  \ df.dropna()\n\n    # 通过移除 '[kW]' 来重命名列\n    df.columns = [col.replace(' [kW]',\
  \ '') for col in df.columns]\n\n    # 将 'time' 列转换为日期格式\n    df['time'] = pd.to_datetime(df['time'].astype(int),\
  \ unit='s')\n    df['time'] = pd.DatetimeIndex(pd.date_range('2016-01-01 05:00',\
  \ periods=len(df),  freq='min'))\n\n    # 设置星期\n    df['day_of_week'] = df.reset_index()['time'].dt.day_name()\n\
  \n    # 设置索引\n    df = df.set_index(['time'])\n\n    # 去除重复的时间戳并保留最后一个值\n    df\
  \ = df[~df.index.duplicated(keep='last')]\n\n    # 修复 'cloudCover' 列中的错误\n    df['cloudCover']\
  \ = pd.to_numeric(df['cloudCover'], errors='coerce')\n    df['cloudCover'] = df['cloudCover'].bfill()\n\
  \n    # 检查为“对象”的 icon 和 summary\n    df['icon'].head()\n    df['summary'].head()\n\
  \n    # 值计数\n    df['icon'].value_counts()\n    df['icon'].value_counts(normalize\
  \ = True) * 100\n\n    # 检查相关性\n    numeric_df = df.select_dtypes(include=['float64',\
  \ 'int64'])\n    correlation_matrix = numeric_df.corr()\n\n    # 绘制相关性矩阵\n    plt.figure(figsize=(10,\
  \ 8))\n    sns.set(font_scale=1.2)\n    sns.heatmap(correlation_matrix, annot=False,\
  \ cmap='coolwarm', fmt=\".2f\", linewidths=0.5)\n    plt.title('Correlation Matrix')\n\
  \    plt.xticks(rotation=90)\n    plt.yticks(rotation=0)\n    plt.tight_layout()\n\
  \    plt.show()\n\n    # 重采样为每日\n    df['use'].resample('D').mean().plot(title=\"\
  Daily kW Usage\", legend=True)\n    plt.show()\n    df['use'].resample('W').mean().plot(title=\"\
  Weekly kW Usage\", legend=True)\n    plt.show()\n\n    # 按天气总结绘制用耗图\n    df.groupby('summary')['Living\
  \ room'].mean().sort_values().plot(kind='bar', title=\"Living Room Usage by Weather\"\
  , legend=True)\n    plt.show()\n    df.groupby('summary')['House overall'].mean().sort_values().plot(kind='bar',\
  \ title=\"House Usage by Weather\", legend=True)\n    plt.show()\n\n    # 按图标绘制用耗图\n\
  \    df.groupby('icon')['Living room'].mean().sort_values().plot(kind='bar', title=\"\
  Living Room Usage by Icon\", legend=True)\n    plt.show()\n    df.groupby('icon')['House\
  \ overall'].mean().sort_values().plot(kind='bar', title=\"House Usage by Icon\"\
  , legend=True)\n    plt.show()\n\n    # 将清洗后的数据导出为 CSV 文件\n    # 阶段 1 完成\n    df.to_csv(export_path)\n\
  \n    return df\n```\n\n传递给 Python 函数 `Station1_loadData(etl_path, export_path)`\
  \ 的输入参数涉及事实来源、从源提取的数据，以及在清洗和传输后以 `.csv` 文件形式存储的数据。该函数的输出以 pandas DataFrames `df`\
  \ 的形式存在，将向下传递到“工作站 2. 提示词与特征工程”。该工作站包含两个部分：(i) 数据加载和 (ii) 数据清洗。我们从数据加载和数据可视化开始，如下：\n\
