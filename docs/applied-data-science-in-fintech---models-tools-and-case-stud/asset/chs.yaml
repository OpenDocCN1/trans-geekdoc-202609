  \n\n\n\nA6: 季节性是指在固定周期（日、周、月或年）内重复的规律且可预测的模式。例如夏季冰淇淋销量的增加或假期期间零售额的增长。季节性模式可以通过季节性分解、季节性\
  \ ARIMA 模型或在回归模型中使用季节性虚拟变量来处理。\n\n* Q7: 长期预测面临的关键挑战是什么？\n\n* A7: 长期预测面临若干挑战：结构性断点（底层关系发生变化时）、随时间增加的不确定性、对历史模式将持续的假设以及误差的复合效应。\n\
  \n* Q8: 人工智能如何用于预测农产品价格？\n\n* A8: AI 系统分析包括天气模式、卫星图像、土壤状况、全球供应链和经济指标在内的海量数据集来预测商品价格。机器学习算法可以识别传统模型可能会错过的复杂模式和相关性。\n\
  \n* Q9: 使用农业科技（AgTech）进行商品价格预测的主要挑战是什么？\n\n* A9: 关键挑战包括不同来源之间的数据质量和标准化、全球供应链的复杂性、不可预测的天气事件以及难以量化的地缘政治因素。\n\
  \n* 348. Q10: 什么是正态检验？它为什么在统计学中很重要？\n\n* A10: 正态检验是一种用于确定数据集是否遵循正态分布（高斯分布）的统计程序。这些检验至关重要，因为包括\
  \ t 检验、ANOVA 分析和线性回归在内的许多统计方法都假设数据呈正态分布。如果违反了这一假设，这些检验的结果可能不可靠或无效。常见的正态检验包括 Shapiro-Wilk\
  \ 检验、Kolmogorov-Smirnov 检验和 Anderson-Darling 检验。\n\n## 10.9 练习\n\n* E1: 使用 `CORN`\
  \ 作为你的主要商品，并按照文中概述详细执行工作讨坊。交付 Python 代码并在 Streamlit 中呈现生成的 AgTech 应用。你能将 `WHEAT`\
  \ 和 `CORN` 合并为一个视图吗？\n\n* E2: 按照我们的工作讨坊使用 `WHEAT`，并添加 `WHEAT` 相关的新闻提取（可能来自 [yahoo.com](http://yahoo.com)），除了预测组件外，增加正向/负面新闻可视化的情感分析。你将如何将这一新功能添加到最终的\
  \ AgTech 产品中。\n\n* E3: （进级）使用 `WHEAT` 价格和 `WHEAT` 新闻每日情感指数（计算为每天的正向新闻数 / 负面新闻数）作为\
  \ `LSTM` 模型的输入。除了价格特征，你还向模型加入了情感指数特征。你能观察到预测准确性的提高吗？为什么或为什么不？\n\n## 10.10 延伸阅读\n\
