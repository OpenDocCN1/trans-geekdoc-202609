  \ 是一个强大的平台，可以帮助企业在当今快速瞬息万变的业务环境中取得成功。\n\n![图 2.7 AWS 云环境返回文本。⏎](img/fig2_7.jpg)\n\
  \n**图 2.7** AWS 云环境 返回文本。⏎\n\n## 2.5 核心数据结构\n\n数据世界在不断演变，随之而来的是需要高效的数据结构来处理每天产生的海量信息。数据可以大致分为两类：结构化数据和非结构化数据。结构化数据是指组织良好并遵循特定格式的信息，便于存储和访问。另一方面，非结构化数据是指不遵循特定格式的复杂信息，难以存储和访问。\n\
  \n结构化数据仅占生成数据的 20%，而其余 80% 是非结构化数据。结构化数据通常存储在数据库中，并使用预定义的架构（schema）进行组织，该架构概述了数据的结构和关系。这使得存储、访问以及快速高效检索信息变得简单。结构化数据通常用于客户关系管理（CRM）、企业资源计划（ERP）和财务系统等应用。\n\
  \n另一方面，非结构化数据在存储和访问方面更为复杂且具有挑战性。这类数据包括社交媒体帖子、图像、视频和音频文件等。非结构化数据不遵循特定格式，数据元素之间的关系往往不明确。因此，存储和访问非结构化数据需要更复杂的存储和访问机制。非结构化数据通常用于内容管理、社交媒体分析和数据挖掘等应用。\n\
  \n提到存储，结构化数据通常存储在关系型数据库中，而非结构化数据通常存储在 NoSQL 数据库或对象存储服务中。结构化数据可以很容易地查询和索引，从而简单地快速检索特定信息。而非结构化数据需要更复杂的搜索算法和索引机制来访问特定的数据。随着每天产生的数据量不断增长，深入这些这些结构对于有效管理和分析数据至关重要。\n\
  \n在图 2.8 中，我们查看了数据结构的变体 [2.5]。\n\n![图 2.8 结构化 vs 非结构化数据返回文本。⏎](img/fig2_8.jpg)\n\
  \n**图 2.8** 结构化 vs 非结构化数据 返回文本。⏎\n\n根据上述陈述，根据 Gartner 的一个显而易见的观察是：\n\n> 大约 20% 的企业数据是结构化格式，而大约\
  \ 80% 的企业数据是非结构化格式。\n\n有趣的是，通常来说，我们在学校和大学阶段的数据素养主要集中在构建那 20% 结构化数据格式的技能和能力，包括统计和计量经济学方法。\n\
  \n在本书中，我们将介绍**结构化数据**（易于提取、存储并遵循简单的数据格式结构，如行/列/表）以及**非结构化数据**（易于提取，但不易存储或遵循复杂的数据格式结构，如文本、json、字符串、语音、视频）。此外，让我们假设我们作为一个团队驻留在**虚拟数字工厂车间**——更准确地说是数据工厂车间——它由四个不同的部分组成。\n\
  \n### 数据业务类型\n\n数字数据工厂是企业增强对核心业务数据类型理解的重要工具。它提供了一个中心化的平台，用于存储和分析各种数据，包括基础数据、市场数据、生成数据和替代数据。基础数据是指对公司运营至关重要的财务和经济数据，如收入、收益和现金流。市场数据包括股票价格、交易量和市场趋势的数据。生成数据是由业务运营产生的数据，例如网站流量、客户行为和销售数据。替代数据是指非传统数据源，例如社交媒体情绪和卫星图像。\n\
  \n数字数据工厂使企业能够结合并分析这些不同类型的数据，使其对运营有更深入的洞察，并做出更明智的业务决策。例如，通过将市场数据与生成数据相结合，企业可以更好地理解消费者行为和市场趋势，从而相应地调整营销策略。此外，数字数据工厂允许企业通过交互式仪表板和报告轻松地可视化并分析数据。这不仅增强了他们对数据的理解，还为向利益相关者传递见解提供了更高效的方法。\n\
  \n在我们数字数据工厂的所有工作站中，我们增强了对核心数据组件的理解：\n\n*   数据业务类型\n*   数据结构\n*   数据架构 (Schema)\n\
  \n在本节中，我们介绍了广泛的业务数据类型。以下所有数据类型均以结构化和非结构化的格式提供。这是从数据生成者的角度出发。\n\n#### 基础数据\n\n* \
  \  政府\n    *   基础宏观和微观经济指标\n    *   政府财政政策\n    *   税收\n    *   监管政策\n*   公司：\n\
  \    *   公司、部门和行业级数据\n    *   年度报告\n    *   监管文件\n    *   通用市场新闻\n\n#### 市场数据\n\n\
  *   政府：\n    *   央行货币政策\n    *   利率\n    *   财务新闻\n    *   公告\n    *   外汇 (FX)\n\
  *   交易所：\n    *   股票价格、成交量、流动性\n    *   商品价格、成交量、流动性\n    *   资本市场数据流\n\n#### 生成数据\n\
  \n*   分析师预测和报告\n*   卖方和买方报告\n*   金融机构的审查、报告和分析\n*   AI 生成的新闻\n*   AI 生成的报告和分析\n\n\
  #### 替代数据\n\n*   通过爬虫交付的 Web 信息\n*   天气模式\n*   供应链流量\n*   你：你的数据足迹\n    *   社交媒体个人资料\n\
  \    *   网页浏览\n    *   个人银行\n    *   消费模式\n    *   GPS 位置\n\n通过结合和分析基础数据、市场数据、生成数据和替代数据的能力，企业可以保持领先地位，并做出推动增长和成功的数据驱动决策。\n\
  \n### 数据结构\n\n在上一节中，我们查看了数据类型以及这些数据流的生成者。现在，我们将深入探讨数据捕获在数据结构方面的技术。接下来的关于数据框（dataframes）的课程将提供使用\
  \ Python 的进一步讨论。\n\n数据结构是任何编程语言的要素组成部分。它们提供了一种组织和存储数据的方法，以便方便地访问和操作。在结构化和非结构化格式的背景下，数据结构是基础和高级数据存储与检索的基石。\n\
  \n\n\n\n\n列表是最基础的数据结构之一。列表是一个有序的项集合，可以通过其索引进行访问。列表通常用于以线性格式存储数据，例如名称或数字列表。另一种常见的数据结构是字典。字典是键值对的集合，可以通过键进行访问。字典通常用于以非线性格式存储数据，例如特定条目的属性列表。在结构化格式方面，两种常见的文件类型是\
  \ CSV 和 JSON。CSV 代表逗号分隔值，是一种以表格形式存储数据的文件格式，其中每行代表一条记录，每列代表一个字段。相比之下，JSON 是一种轻量级的数据交换格式，用于在不同系统之间存储和交换数据。JSON\
  \ 数据以键值对的形式存储，并表示复杂的数据结构。\n\n非结构化格式（如视频、语音和图片）需要更复杂的数据结构来进行存储和检索。这些格式需要能够处理大量数据的特殊数据结构，例如二叉树或哈希表。输入/输出（I/O）操作对于管理这些类型的数据结构也至关重要，因为它们允许高效地读取和写入数据。无论是处理\
  \ CSV 或 JSON 文件，还是处理视频和语音等更复杂的格式，数据结构都是有效数据管理的基石。\n\n## 基础数据结构\n\n根据 `Toolkit for\
  \ FinTech` 中提供的详细说明，在此背景下的基础数据结构或格式在金融科技业务中被广泛使用，核心格式所示：\n\n*   数字\n*   列表\n*  \
  \ 字符串\n*   元组\n*   字典\n*   数组\n*   矩阵\n*   图片\n*   视频\n*   语音录音\n\n## 高级数据结构\n\n\
  ### 输入/输出操作\n\n通常情况下，银行和金融领域的大部分数据都存储在硬盘驱动器 (HDD)、固态硬盘 (SSD) 或其混合形式中，无论是在本地服务器场还是在\
  \ Amazon AWS、Microsoft Azure 或 Google Cloud 等云解决方案提供商中。将数据从你的硬盘或存储位置移动到桌面电脑或笔记本电脑内部轻量且快速的随机存存储器（`RAM`）有一个复杂的过程。因此，在处理海量数据并尝试充分利用计算能力（`CPU`）或\
  \ `GPU` 级别时，I/O 操作非常重要。\n\n坦率地说，大数据只是为了吸引注意的术语，银行和金融领域大多数真实的分析操作一次性就能处理约 100GB 的输入/输出。对于\
  \ Python 以及我们在这里涵盖的内置 I/O 工具来说，这是一个好消息（与 Hadoop/MapReduce、Mongo DB 等解决方案相比）。Python\
  \ 包含了强大的内置函数，用于在磁盘上序列化和存储任何对象，并将其读回 `RAM`，利用 SQL 风格的这种方式。这种形式非常适合我们课程中所理解的结构化数据。\n\
  \n### 使用 Pandas 进行 I/O\n\n在这里我们将接触到目前业界使用的更高级的技术，查看重要的数据变格式：\n\n*   `CVS`（逗号分隔值）\n\
  *   `SQL`（结构化查询语言）\n*   `XLS/XLSX`（Microsoft Excel）\n*   `JSON`（JavaScript 对象表示）\n\
  *   `HTML`（超文本标记语言）\n\n### 基础 I/O\n\nPython 可以轻松地操作 `SQL` 以及基于 SQL 的数据库。内置包的一个良好示例是\
  \ `SQLite3`。它在实践中的用法如下：\n\n```\nimport sqlite3\n\nclass MySum:\n    def __init__(self):\n\
  \        self.count = 0\n\n    def step(self, value):\n        self.count += value\n\
  \n    def finalize(self):\n        return self.count\n\ncon = sqlite3.connect(\"\
  :memory:\")\ncon.create_aggregate(\"mysum\", 1, MySum)\ncur = con.cursor()\ncur.execute(\"\
  create table test(i)\")\ncur.execute(\"insert into test(i) values (1)\")\ncur.execute(\"\
  insert into test(i) values (2)\")\ncur.execute(\"select mysum(i) from test\")\n\
  print(cur.fetchone()[0])\n```\n\n上一个示例展示了直接在 `RAM`内存中生成和创建 `SQL` 表是多么简单，而不是在物理磁盘位置。在这里我们创建了一个两行一列（`i`）的简单表，然后要求\
  \ `SQL` 语言返回和。\n\n\n\n\n\n```python\nimport pandas.io.sql as pds\nimport sqlite3\n\
  import numpy as np\nimport json\n \ncon = sqlite3.connect(\":memory:\")\ncur = con.cursor()\n\
  cur.execute(\"create table tester (name, value1)\")\n \n## Generate random numbers\
  \ in a matrix 10 rows by 2 columns rounded to 2 decimals\ndata = 100+10*np.random.standard_normal((10,2)).round(2)\n\
  \ \nfor row in data:\n    # This is the qmark style:\n    cur.execute(\"insert into\
  \ tester values (?, ?)\", ('stock1', row[1]))\n \ndf = pds.read_sql(\"select * from\
  \ tester\", con)\nprint(df.head())\n \ndf_JSON_format = df.to_json()\nprint(df_JSON_format)\n\
  ```\n\n## 数据模式 (Data Schema)\n\n数据库模式架构是任何数据库管理系统（DBMS）的核心组件。它是数据库的结构，为其中存储的数据提供正式描述。模式定义了可以存储的数据类型、这些数据之间的关系，以及访问和操作数据的规则。设计良好的数据库模式的一个关键优势是它允许高效的数据检索和处理。通过以逻辑且组织的方式对数据进行建模，DBMS\
  \ 可以快速定位并检索执行查询和其他操作所需的数据。\n\n近年来，使用如 `FIBO`（金融行业业务本体）等结构化数据格式来描述数据库模式的趋势日益增。。`FIBO`\
  \ 是一种标准本体论，为描述金融概念和关系提供了共同语言。通过利用像 `FIBO` 这样的标准化格式，企业可以确保其数据库模式具有一致性，并与其他系统兼容。然而，并非所有数据都是以易于使用正式模式描述结构化的。企业和其他机构产生的非结构化数据也日益增加。这可能包括社交媒体帖子、电子邮件以及其他无法整齐归入预定义类别的内容。为了应对这一挑战，许多组织正在转向数据工厂和其他工具，以帮助他们从非结构化数据中提取含义。这些工具使用高级算法和机器学习技术来识别数据中的模式和关系，使企业能够获得价值见解并做出更明智的决策。\n\
