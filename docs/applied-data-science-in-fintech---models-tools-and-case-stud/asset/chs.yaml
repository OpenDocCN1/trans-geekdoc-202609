  \ `DDF Model selection`（DDF 模型选择）章节，并介绍机器学习和 AI 技术在金融和银行领域的最新进展。我们从一个简单的 `ordinary\
  \ least square (OLS)`（普通最小二法）模型开始，从数学和编程的角度介绍 `recurrent neural network (RNN)`（循环神经网络）架构。接下来，我们将深入研究\
  \ `long-short term memory recurrent neural network (LSTM RNN)`（长短期记忆神经网络）的复杂性，为读者提供情感分析以及在\
  \ 第 7 章 中 `large language model (LLM)`（大语言模型）阐述所需的各种数学和概念公式。\n\n本章从定义非结构化数据开始。在书中，我们仅使用文本格式向读者介绍机器学习和\
  \ AI 技术。随后，我们将深入探讨这些技术在金融和银行业高度监管应用中的复杂性。\n\n本章整合了前两个章节，并展示了如何构建 `AI Agent`——一个用于从各种数据分析情感的专用聊天机器人。我们关注公司文件和其他基础数据集，通过在加密市场构建情感指数，将量化的价格流与定性的文本流连接起来。这一切都在\
  \ `DDF Model Selection` 阶段的背景下。\n\n第三节介绍了金融和银行业的实际和实操用例。它关注实际环境中的 DDF 阐述和方法。\n\n\
  在本章中，我们将连接书中之前的第一节和第二节的内容。本章从 AdviceTech 的用例开始。我们将向读者介绍该领域面临的问题，并在 DDF 概念的范围内通过实施分步骤的用例提供潜在解决方案，利用\
