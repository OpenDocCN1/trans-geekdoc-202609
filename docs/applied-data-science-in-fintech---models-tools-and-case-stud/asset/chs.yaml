  BEGIN\n    // Step 1: 输入参数\n    API_KEY ← \"your_api_key_here\"   // 可选，如果 CryptoCompare\
  \ 需要 API key\n    BASE_URL ← \"https://min-api.cryptocompare.com/data/price\"\n\
  \    CRYPTO_SYMBOL ← \"BTC\"\n    FIAT_SYMBOL ← \"USD\"\n \n    // Step 2:准备 API\
  \ 调用\n    API_URL ← BASE_URL + \"?fsym=\" + CRYPTO_SYMBOL + \"&tsyms=\" + FIAT_SYMBOL\n\
  \    IF API_KEY is required THEN\n        API_URL ← API_URL + \"&api_key=\" + API_KEY\n\
  \    END IF\n \n    // Step 3: 发送 HTTP 请求\n    RESPONSE ← Send GET Request to API_URL\n\
  \ \n    // Step 4: 接收 API 响应\n    IF RESPONSE.status_code = 200 THEN\n        //\
  \ Step 5: 解析 JSON 数据\n        JSON_DATA ← Parse RESPONSE.body as JSON\n        BTC_PRICE\
  \ ← JSON_DATA[FIAT_SYMBOL]\n \n        // Step 6: 存储或显示数据\n        PRINT \"Bitcoin\
  \ price in USD: \" + BTC_PRICE\n        STORE BTC_PRICE in database or file\n  \
  \  ELSE\n        // 处理错误\n        PRINT \"Error: Unable to fetch data. Status Code:\
  \ \" + RESPONSE.status_code\n        PRINT \"Response Message: \" + RESPONSE.body\n\
  \    END IF\nEND\n```\n\n#### 60. Python\n\n在对相关数据流进行视觉化评估并准备好伪代码之后，我们现在处于可以使用 Python\
  \ 编码解决方案的位置。Python 是一种多功能且强大的编程语言，它彻底改变了科学计算和数据分析。Python 诞生于对简单和可读性的追求，已成为各学科研究人员和科学家的首选工具。它优雅的语法以及内置或外部集成库（如\
  \ `NumPy` 和 `SciPy`）的庞大生态系统，使用户能够轻松应对复杂问题。想象一下量化分析师或交易员争争时间对全球数字资产价格和估值趋势进行建模。正如我们在后续章节中提到的，通过\
  \ Python 的数据可视化能力，他们可以将复杂的数据转换为具有吸引力的视觉叙述，使利益相关者更容易理解他们的发现。这种计算能力与用户友好性的无缝融合将 Python\
  \ 推向了科学创新的沿，这也是我们在整本书中使用 Python 的原因之一。\n\n在下一节中，Python 代码段展示了一个封装函数 `fetch_btc_price()`，它从\
  \ CryptoCompare API 调用交付 JSON 格式的数据，允许进行适当的错误处理。在此函数中，我们的目标是在获得适当 `API_KEY` 后，从\
  \ CryptoCompare 发布的 `BASE_URL` API 地址中提取 `FIAT_SYMBOL` “USD” 对应的 `CRYPTO_SYMBOL`\
  \ “BTC”。该函数将在控制台/屏幕上打印以 USD 计的比特币价格 `BTC`，并处理适当的错误。\n\n#### 61.\n\n```python\nimport\
  \ requests\n\ndef fetch_btc_price():\n  # Step 1: 输入参数\n  API_KEY = \"your_api_key_here\"\
  \  # 如果需要替换为你的 CryptoCompare API key\n  BASE_URL = \"https://min-api.cryptocompare.com/data/price\"\
  \n  CRYPTO_SYMBOL = \"BTC\"\n  FIAT_SYMBOL = \"USD\"\n \n  # Step 2: 准备 API 调用\n\
  \  params = {\n    \"fsym\": CRYPTO_SYMBOL,\n    \"tsyms\": FIAT_SYMBOL\n  }\n \n\
  \  if API_KEY:  # 如果需要 API key\n    params[\"api_key\"] = API_KEY\n \n  # Step 3:\
  \ 发送 HTTP 请求\n  try:\n    response = requests.get(BASE_URL, params=params)\n \n\
  \    # Step 4: 接收 API 响应\n    if response.status_code == 200:\n      # Step 5: 解析\
  \ JSON 数据\n      data = response.json()\n      btc_price = data.get(FIAT_SYMBOL)\n\
  \      \n      # Step 6: 存储或显示数据\n      if btc_price is not None:\n        print(f\"\
  Bitcoin price in USD: ${btc_price}\")\n        # 可选：存储价格到数据库或文件\n      else:\n \
  \       print(\"Error: BTC price not found.\")\n    else:\n      # 处理错误\n      print(f\"\
  Error: Unable to fetch data. Status Code: {response.status_code}\")\n      print(f\"\
  Response Message: {response.text}\")\n  except requests.RequestException as e:\n\
  \    print(f\"Exception occurred: {e}\")\n\n## 调用函数\nfetch_btc_price()\n```\n\n\
  在接下来的两个章节中，我们将扩展对 API 的使用，涵盖时间序列驱动数据以及非结构化数据流的内容。\n\n## 3.3 结构化数据\n\n结构化数据在组织和分析复杂金融信息方面起着至关重要的作用。通过表格格式展示数据，金融分析师可以高效地分类、排序和处理大型数据集，以发现隐藏在非结构化数据中的趋势、模式和异常。像\
  \ `pandas` 这样的强大库改变了处理金融数据的方式，结构化数据的性质允许进行快速计算和可视化。随着金融数据量的指数级增长，有效利用结构化数据已成为现代金融专业人士获取竞争优势的不可或的技能。\n\
  \n#### Pandas DataFrame\n\n`pandas DataFrame` 是一个强大的工具，改变了我们处理和分析表格数据的方式。作为一种二维标记数据，它提供了一种直观且高效的方法来处理结构化数据。跨学科的研究人员利用\
  \ `pandas` DataFrames 轻松地处理复杂数据集并从中提取洞察。其丰富的内置函数使用研究人员执行高级统计分析、数据清洗和可视化任务。`pandas\
  \ DataFrame` 的核心优势之一在于它能够无缝处理异构数据类型，这对于科学应用是无价的。\n\n考虑以下数据集：\n\n#### 62.\n\n| id\
