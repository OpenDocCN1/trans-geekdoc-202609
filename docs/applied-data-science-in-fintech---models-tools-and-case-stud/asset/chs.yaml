  \ API 的章节与 `pandas` DataFrame 构建连接起来，并对下载的加密货币对提供表格化表示形式。在下一个 Python 代码段中，我们从 `CryptoCompare`\
  \ 调用“GET”API 并以表格格式交付 `pandas` DataFrames：\n\n 63.\n\n```python\nimport requests\n\
  import pandas as pd\nimport numpy as np\n \ndef fetch_crypto_prices(SYMBOL, API_KEY,\
  \ LIMIT=2000):\n    # Define CONSTANTS and VARIABLES\n    if API_KEY.strip():  #\
  \ Check if api_key is not empty or just whitespace\n        headers = {'Apikey':\
  \ API_KEY}  # The header with your API key\n    else:\n        headers = {}  # Empty\
  \ headers if api_key is empty\n    BASE_URL = f'https://min-api.cryptocompare.com/data/v2/histoday?fsym={SYMBOL}&tsym=USD&limit={LIMIT}'\n\
  \ \n    # Send HTTP Request\n    try:\n        response = requests.get(BASE_URL,\
  \ headers=headers)\n        if response.status_code == 200:\n            data =\
  \ response.json()\n        else:\n            # Handle Errors\n            print(f\"\
  Error: Unable to fetch data. Status Code: {response.status_code}\")\n          \
  \  print(f\"Response Message: {response.text}\")\n    except requests.RequestException\
  \ as e:\n        print(f\"Exception occurred: {e}\")\n    return data['Data']['Data']\n\
  \ \ndef main(LIMIT = 2000,API_KEY=''):\n    # Define a list of cryptocurrency pairs\
  \ all in terms of USD\n    crypto_pairs = ['BTC', 'ETH']\n    # Create an empty\
  \ DataFrame to store the data\n    df = pd.DataFrame()\n    # GET historical data\
  \ for each pair\n    for SYMBOL in crypto_pairs:\n        print(f\"GET data for\
  \ {SYMBOL}…\")\n        data = pd.DataFrame( fetch_crypto_prices(SYMBOL,\n     \
  \                                          API_KEY=API_KEY,\n                  \
  \                             LIMIT=LIMIT) ) # Limiting to 30 days\n \n        data\
  \ ['date'] = pd.to_datetime(data ['time'], unit='s')\n        data['sym'] = SYMBOL\n\
  \        df = pd.concat([df,data], axis = 0)\n    return df\n```\n\n在这个示例中，我们对历史性的比特币“BTC”和以太坊“ETH”数字资产价格感兴趣（我们可以指定任何加密货币对）。为此，我们选择了由\
  \ `CryptoCompare` 终端提供的指定的“histoday” API。生成的数据以 JSON 格式交付；然而，我们按数字资产处理数据，并在数据提取点处将\
  \ JSON 文件存储并转换为 `DataFrames`。此外，我们将 UNIX 时间戳转换为人类可读的格式，并添加了名为 `sym` 的新列来指示每个数字资产。这种方法允许我们根据数字资产符号和日期将数据集“堆叠”在一起。\n\
