  \n\n\n\n基于之前对 OLS 和 LASSO 的讨论，我们得出结论：`MSE` 衡量标准是判断哪个模型“更好”最合适的方法，换句话说，就是判断哪个模型更准确。既然我们使用了\
  \ `MSE`，逻辑上的延伸是询问是否存在一个基于 `MSE` 衡量的模型可以使用。来自 `sklearn.tree import DecisionTreeRegressor`\
  \ 的决策树是一种层次化模型，它通过从 204 个特征数据中学习简单的决策规则来做出预测。对于回归任务（预测房价等连续值），该树将数据划分为不同的区域，并预测每个区域内的平均值\
  \ [6.4]。\n\n### 纯度量\n\n对于回归树，我们使用均方误差 (`MSE`）作为纯度量：\n\n$$\\text{MSE} = (1/n) \\\
  times \\Sigma{(yi - \\hat{y})}^{2}$$\n\n其中\n\n* n = 节点中的样本数\n* `yi` = 样本 `i` 的实际值\n\
  * $\\hat{y}$ = 预测值（节点内所有样本的平均值）\n\n### 信息增益\n\n通过最大化纯度的减少量来选择最佳划分：\n\n信息增益 = `MSE_parent`\
  \ - $\\Sigma(ni/n \\times MSE\\_child\\_i)$\n\n其中\n\n* `MSE_parent` = 父节点的纯度\n*\
  \ `ni` = 子节点 `i` 中的样本数\n* `n` = 父节点中的总样本数\n\n205.\n\n### 划分选择\n\n对于像 `RM`（房间数）这样的连续特征，我们评估如下形式的划分：\n\
  \n* 左子节点：`RM ≤ threshold`\n* 右子节点：`RM > threshold`\n\n算法测试所有可能的 `threshold` 并选择信息增益最大的一个。树结构中的每个内部节点包含：\n\
  \n* 特征：基于哪个变量进行划分（例如 `RM`）\n* 阈值：划分值（例如 `RM ≤ 6.5`）\n* 左/右子节点：生成的分支\n\n每个叶子节点包含：\n\
  \n* 预测：该区域样本的平均目标值\n* 样本计数：训练样本的数量\n\n#### Python 实现\n\n在我们的案例中，决策树算法是通过在特征 `RM`\
  \ 内搜索最低 `MSE` 来驱动的。每次划分都通过贪心方法将数据划分为更同质的组来减少总 `MSE`，在考虑任何未来划分的情况下，在每个节点选择最佳划分。更深的树具有较低的偏差较高的方差，会导致潜在的过拟合。在极端情况下，决策树可以通过将训练数据序列划分为极小的组来解释并预测\
  \ 100% 的数据差。然而，这种严重过拟合的模型在使用测试数据集上运行时会失败。我们按照上一节中 LASSO 示例将数据划分为训练集和测试集。\n\n206.\n\
  \n```\n# 创建并训练不同深度的决策树模型\ndepths = [2, 3, 5, 10]\nmodels = {}\nresults = {}\n \n\
  for depth in depths:\n    # 创建模型\n    dt = DecisionTreeRegressor(\n        max_depth=depth,\n\
  \        random_state=42,\n        min_samples_split=5,\n        min_samples_leaf=2\n\
  \    )\n \n    # 训练模型\n    dt.fit(X_train, y_train)\n \n    # 进行预测\n    y_pred_train\
  \ = dt.predict(X_train)\n    y_pred_test = dt.predict(X_test)\n \n    # 计算指标\n \
  \   train_mse = mean_squared_error(y_train, y_pred_train)\n    test_mse = mean_squared_error(y_test,\
  \ y_pred_test)\n    train_r2 = r2_score(y_train, y_pred_train)\n    test_r2 = r2_score(y_test,\
  \ y_pred_test)\n \n    models[depth] = dt\n    results[depth] = {\n        'train_mse':\
  \ train_mse,\n        'test_mse': test_mse,\n        'train_r2': train_r2,\n   \
  \     'test_r2': test_r2\n    }\n \n    print(f\"\\nDepth {depth}:\")\n    print(f\"\
  \  Train MSE: {train_mse:.3f}\")\n    print(f\"  Test MSE: {test_mse:.3f}\")\n \
  \   print(f\"  Train R2: {train_r2:.3f}\")\n    print(f\"  Test R2: {test_r2:.3f}\"\
  )\n```\n\n在这种案例中，深度为 3 的决策树是选择，因为我们实现了最低的 `test MSE` 衡量。与 OLS 和 LASSO 相比，这是目前“最佳”的模型选择。\n\
  \n```\nTraining set size: 404\nTest set size: 102\n \nDepth 2:\n  Train MSE: 35.023\n\
  \  Test MSE: 37.568\n  Train R2: 0.597\n  Test R2: 0.488\n \nDepth 3:\n  Train MSE:\
  \ 32.624\n  Test MSE: 35.842\n  Train R2: 0.624\n  Test R2: 0.511\n \nDepth 5:\n\
  \  Train MSE: 29.165\n  Test MSE: 38.746\n  Train R2: 0.664\n  Test R2: 0.472\n\
  \ \nDepth 10:\n  Train MSE: 19.435\n  Test MSE: 44.834\n  Train R2: 0.776\n  Test\
  \ R2: 0.389\n```\n\n在这种案例中，深度为 3 的决策树是选择，因为我们实现了最低的 `test MSE` 衡量。与 OLS 和 LASSO\
  \ 相比，这是目前“最佳”的模型选择。\n\n\n\n\n\n#### Python 实现\n\n以下代码段展示了 `SimpleRandomForest` 类中决策决策树调用的自助（bootstrap）机制，这导致了随机森林的计算开销。\n\
  \n```python\n# Random Forest Implementation\nclass SimpleRandomForest:\n \n    def\
  \ __init__(self, n_estimators=100, max_depth=3, min_samples_split=2, random_state=42):\n\
  \ \n        self.n_estimators = n_estimators\n        self.max_depth = max_depth\n\
  \        self.min_samples_split = min_samples_split\n        self.random_state =\
  \ random_state\n        self.trees = []\n        self.feature_indices = []\n \n\
  \    def _bootstrap_sample(self, X, y, random_state):\n        \"\"\"创建自助样本\"\"\"\
  \n        np.random.seed(random_state)\n        n_samples = X.shape[0]\n       \
  \ indices = np.random.choice(n_samples, n_samples, replace=True)\n        return\
  \ X[indices], y[indices]\n \n    def fit(self, X, y):\n        \"\"\"训练随机森林\"\"\"\
  \n        np.random.seed(self.random_state)\n \n        for i in range(self.n_estimators):\n\
  \            # 自助采样\n            X_bootstrap, y_bootstrap = self._bootstrap_sample(X,\
  \ y, i)\n \n            # 训练单树\n            tree = SimpleDecisionTree(\n       \
  \         max_depth=self.max_depth,\n                min_samples_split=self.min_samples_split\n\
  \            )\n            tree.fit(X_bootstrap, y_bootstrap)\n \n            self.trees.append(tree)\n\
  \ \n    def predict(self, X):\n        \"\"\"使用所有树进行预测\"\"\"\n        predictions\
  \ = np.array([tree.predict(X) for tree in self.trees])\n        return np.mean(predictions,\
  \ axis=0)\n```\n\n在我们的数据集上运行时，我们得到了以下结果，`MSE` = 34.84：\n\n```\n正在加载波士顿房价数据……\n训练集大小:\
  \ 404\n测试集大小: 102\n \n1. 单决策树:\n   MSE: 35.84\n   R2: 0.511\n \n2. 简单随机森林 (自定义实现):\n\
  \   MSE: 34.68\n   R2: 0.527\n \n3. Scikit-learn 随机森林:\n   MSE: 34.29\n   R2: 0.532\n\
  ```\n\n如图 6.9 所示的可视化解释：\n\n![Figure 6.9 随机森林可视化返回文本。⏎](img/fig6_9.jpg)\n\n图 6.9\
  \ 随机森林可视化 返回文本。⏎\n\n总结一下，在本节中，我们向读者介绍了金融科技从业者使用的四种核心基础机器学习模型，即：i) OLS、(ii) LASSO、(iii)\
  \ 决策树和 (iv) 随机森林。我们证明了利用训练集与测试集划分，以及针对某一特定指标 `MSE` 严格实施相关模型的关键性。根据我们的结果，并在我们的受控假设示例驱动下，通过\
  \ RM 和 MV 变量，我们得出结论：随机森林应该是首选模型，结果如下：\n\n| 模型 || MSE |\n| --- | --- |\n| LASSO ||\
  \ 45.97 |\n| --- | --- |\n| 决策树 || 35.84 |\n| 随机森林 || 34.68 |\n\nOLS 的 MSE 是整个数据集驱动的，因此我们排除了这一指标。之前的结果基于测试数据的实现，因此我们在训练数据上训练了模型，然后在测试数据上执行。\n\
  \n6.3 为什么金融领域的机器学习与众不同\n\n正如金融科学中所述，金融领域的机器学习面临着与其它领域不同的挑战。\n\n\n\n\n\n机器学习的应用几乎涵盖了每一个行业。在医疗保健领域，它协助医学图像分析和药物研发。在技术领域，它驱动着搜索引擎、推荐系统和虚拟助手。交通领域受益于自动驾驶车辆和路径优化。金融领域利用其进行反欺诈检测和算法交易。娱乐平台则采用它进行内容推荐和个性化服务。\n\
  \n如前文所述，金融和银领域涉及额外的非直接观测属性层级或不断变化的条件。因此，尽管我们选择了 `random forest` 作为我们金融科技（FinTech）解决方案的主要模型，但这可能不是一个静态的选择，模型条件可能会演变。\n\
  \n## 6.5 深度学习\n\n学习过程通常涉及将大量数据输入数学模型中，这些模型通过调整内部参数来最小化预测误差。这些模型跨度从简单的线性回归到具有数百万个参数的复杂神经网络。深度学习作为机器学习的一个子集，使用具有多个层的人工神经网络来学习数据的分层表示，这在涉及图像、语音和自然语言的任务中被证明特别有效。\n\
  \n### 人工神经网络\n\n人工智能是计算机科学的一个领域，专注于创建能够执行通常需要人类智能才能完成的系统。这些系统旨在感知环境、处理信息、推理问题、从经验中学习并做出决策以实现特定目标。该领域包含几个核心研究和应用领域。机器学习代表了一个主要分支，系统通过数据经验来提高其性能。自然语言处理使计算机理解、解释和生成人类语言。计算机视觉允许机器解释和分析来自图像和视频的视觉信息。机器人技术将人工智能与物理系统相结合，创建可以与物理世界交互并操的机器。\n\
  \nAI 系统沿着能力光谱运行。狭义人工智能或弱人工智能专注于特定的、定义良好的任务，例如下棋、人脸识别或语言翻译。这些系统在特定领域表现出色，但无法将其智能转移到其他领域。通用人工智能或强人工智能代表了创建在所有认知任务中都具有人类水平智能的机器的理论目标，尽管这在很大程度上尚未实现。\n\
  \n人工神经网络（ANN）可以被视为一组复杂的算法，试图复制我们人类脑的功能，特别是神经网络结构。ANN 可以学习任何函数格式 `y = f(x)` 的近似值。这种方法在（例如）模式识别、数据分类、图像识别、语音识别或时间序列建模等用途中非常有用。\n\
  \n#### 网络层\n\n从简单的角度来看，最常见的人工神经网络由三组（或三层）单元组成，如图 6.10 所示。“输入”单元层连接到“隐藏”单元层，而隐藏层又连接到“输出”单元层。\n\
  \n*   **输入单元：** 输入单元的活动代表馈入网络的原始信息。这也被称为输入层。\n*   **隐藏单元：** 每个隐藏单元的活动由输入单元的活动以及输入单元与隐藏单元之间连接的权重决定。这也被称为隐藏层。\n\
  *   **输出单元：** 输出单元的行为取决于隐藏单元的活动以及隐藏层与输出单元之间的权重。这也被称为输出层。\n\n与标准的回归分析不同，在这里你具有通过应用递归模式和适用于各种隐藏层的权重，来“学习”输入数据中隐藏动态的能力。在深入研究循环神经网络设计之前，让我们先定义一些关键概念。\n\
  \n![图 6.10 网络层 返回文本。⏎](img/fig6_10.jpg)\n\n**图 6.10** 网络层 返回正文。⏎\n\n现在，我们查看神经网络（NN），该网络“学习”从数据推导出的真实动态的方式是通过隐藏层。一旦进入每个隐藏层，网络通过首先计算线性变换，然后应用非线性函数（该函数将被定义为下一层的输入）来学习新的特征空间。因此，我们将神经网络视为一个过程，信息流像过程一样，通过隐藏层流向最终输出层，如图\
  \ 6.11 所示。\n\n![图 6.11 网络层流 返回文本。⏎](img/fig6_11.jpg)\n\n**图 6.11** 网络层流 返回文本。⏎\n\
  \n假设对于三层神经网络，其函数格式看起来会像 `f(x) = f3(f2(f1(x)))`。作为一个例子，每一层我们都学习呈现数据的不同表示，例如，一张图片，我们可以从识别边缘开始，然后是轮廓，最后深入研究该图片更复杂的特征，最终导致物体的识别。\n\
  \n#### 单神经元\n\n从计算的角度来看，一个核心单元被称为神经元、节点或单元（等效术）。基本上，想象一个节点接收某些输入，处理这些输入然后交付输出。每个输入都有一个关联的\
  \ `weight (w)`，该权重根据其与其他输入的相对重要性分配 [6.6]。节点对其输入的加权和应用函数 `f`（在下一节中定义）：\n\n图 6.12\
  \ 中所示的前述网络接收数值输入 `X1` 和 `X2`，并具有与输入相关的权重 `w1` 和 `w2`。此外，另一个权重为 `b` 的输入 `1`（称为`偏置`\
  \ Bias）。如之前所示，神经网络的另一个关键组件被称为“激活函数”。\n\n![图 6.12 单神经元 返回文本。⏎](img/fig6_12.jpg)\n\
  \n**图 6.12** 单神经元 返回文本。⏎\n\n#### 激活函数\n\n激活函数充当数学门控，决定了神经网络中神经元是否以及以多大的强度被激活。它们将输入的加权和转换为输出信号，引入了非线性，使得神经网络能够建模复杂模式并解决复杂问题。\n\
  \n如果没有激活函数，神经网络无论深度如何都将仅仅执行线性变换，本质上简化为线性回归。激活函数的非线性特性允许网络近似任何连续函数，捕捉数据中复杂的关系并学习区分不同类别或预测连续值的复杂决策边界。\n\
  \n激活函数为结果变量 `Y` 引入了非线性。有几种激活函数形式，例如图 6.13 所示：\n\n![图 6.13 激活函数 返回文本。⏎](img/fig6_13.jpg)\n\
  \n**图 6.13** 激活函数 返回文本。⏎\n\n##### Sigmoid\n\nSigmoid 函数在历史上非常流行，使用公式 `1/(1+e^∧(−x))`\
  \ 将输入映射到 0 到 1 之间的值。这创建了一个平滑的 S 型曲线，自然地表示了概率。然而，sigmoid 函数在深度网络中会受到梯度消失问题的影响，即梯度在反传播过程中变得非常小，使得难以有效地训练深层。\n\
  \n\n\n\n\n此函数接收一个值作为输入，并将输出设置在 0 到 1 之间，主要用于描述概率结果，如图 6.14 所示：\n\n215. 216。\n\n\
  ```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n \n# 定义函数格式\ndef\
  \ sigmoid(Z):\n    A = 1 / (1 + np.exp(-Z))\n    return A, Z\n \n# 绘制激活函数\nz = np.linspace(-10,\
  \ 10, 100)\n \n# 计算激活后结果\nA_sigmoid, z= sigmoid(z)\n \n# 绘制 sigmoid\nplt.plot(z,\
  \ A_sigmoid, label=\"Function\")\nplt.plot(z, A_sigmoid * (1 - A_sigmoid))\nplt.xlabel(\"\
  z\")\nplt.ylabel(r\"$\\frac{1}{1 + e^{-z}}$\")\nplt.title(\"Sigmoid Function\",\
  \ fontsize=16)\nplt.savefig(\"plot.png\")\n```\n\n上一节的另一种变体是 Softmax 版本，它考虑了在 0\
  \ 到 1 之间的概率水平下的各种分类水平。这与将对象分类到不同类别的问题有关，而不是具有真或假的二元解。\n\n![图 6.14 Sigmoid 函数返回到文本。⏎](img/fig6_14.jpg)\n\
  \n**图 6.14** Sigmoid 函数 返回到文本。⏎\n\n##### Tanh\n\n双曲正切函数（`tanh`）通过将输入映射到 -1 到 1 之间的值解决了\
  \ sigmoid 的某些局限性，提供了零为中心的输出，有助于训练期间的收敛。与 sigmoid 一样，它在非常深的网络中仍然面临梯度消失问题，但在隐藏层中的表现通常比\
  \ sigmoid 好。\n\n双曲正切函数在这里用作替代激活函数，定义为输出在 -1 和 1 之间，如图 6.15 所示。\n\n217。\n\n```python\n\
  import numpy as np\nimport matplotlib.pyplot as plt\ndef tanh(Z):\n    A = np.tanh(Z)\n\
  \    return A, Z\n \n# 绘制激活函数\nz = np.linspace(-10, 10, 100)\n# 计算激活后输出 \nA_tanh,\
  \ z = tanh(z)\n \n# 绘制 tanh\nplt.plot(z, A_tanh, 'b', label = \"Function\")\nplt.plot(z,\
  \ 1 - np.square(A_tanh))\nplt.xlabel(\"z\")\nplt.ylabel(r\"$\\frac{e^z - e^{-z}}{e^z\
  \ + e^{-z}}$\")\nplt.title(\"Hyperbolic Tangent Function\", fontsize=16)\nplt.savefig(\"\
  plot.png\")\n```\n\n我们通过 Python 观察的最后一个激活函数是 `ReLU`，即修正线性单元。`ReLU` 构成了所有神经网络的基础，因为它通常用作大多数应用程序的默认激活函数。\n\
  \n![图 6.15 Tanh 函数返回到文本。⏎](img/fig6_15.jpg)\n\n**图 6.15** Tanh 函数 返回到文本。⏎\n\n#####\
  \ ReLU\n\n修正线性单元（`ReLU`）由于其简单性和有效性已成为最广泛使用的激活函数。`ReLU` 在输入为正时直接输出，否则输出零（`max(0,x)`）。该函数通过避免正输入时的梯度消失来加速训练，提供了计算效率，并通过将负值置零引入了稀疏性。然而，`ReLU`\
  \ 可能会遭受“死亡 ReLU”问题，导致神经元永久失活跃。\n\n`ReLU` 函数定义如下，并在图 6.16 中所示：\n\n```python\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\ndef relu(Z):\n    A = np.maximum(0,\
  \ Z)\n    return A, Z\n \n# 绘制激活函数\nz = np.linspace(-10, 10, 100)\n# 计算激活后输出\nA_relu,\
  \ z = relu(z)\n \n# 绘制 relu\nplt.plot(z, A_relu, 'g')\nplt.xlabel(\"z\")\nplt.ylabel(r\"\
  $max\\{0, z\\}$\")\nplt.title(\"ReLU Function\", fontsize=16)\nplt.savefig(\"plot.png\"\
  )\n```\n\n激活函数的选择极大影响网络性能、训练速度和学习模式的能力。隐藏层通常使用 `ReLU` 或其变体以提高效率，而输出层使用与任务的函数——二分类使用\
  \ sigmoid，多分类使用 softmax，回归任务使用线性激活。\n\n![图 6.16 ReLU 函数返回到文本。⏎](img/fig6_16.jpg)\n\
  \n**图 6.16** ReLU 函数 返回到文本。⏎\n\n为了完成神经网络机制的基础，我们需要理解正向传播的重要性。这与通过优化寻找简单回归模型的解不同。然而，在理解正向和反向传播的影响之前，让我们看看逻辑回归的理论方法。\n\
  \n#### 逻辑回归\n\n逻辑回归是金融领域的一项基础技术。以下是它在各个领域的应用示例。我们有一个输入变量 `X`，例如一张图片，我们想知道该图片属于类别\
  \ 1（例如汽车）的概率。对于给定的 `X`，输出将是实值形式：\n\n`y = w^TX + b`\n\n然而，因为我们正在寻找定义在 0 到 1 范围内的概率，因此我们对输出应用\
  \ sigmoid 函数：\n\n`yŷ = σ(w^TX + b)`\n\n其中：\n\n$\\sigma(z) = \\frac{1}{1 + e^{-z}}$\n\
  \n因此，如果 `z` 很大，那么 $e^{-z}$ 将接近 0，从而输出为 1。相反，如果 `z` 很小，$e^{-z}$ 将很大，因此输出为 0。\n\n\
  ##### 逻辑回归代价函数\n\n为了训练逻辑回归的参数 `w` 和 `b`，我们需要某种代价函数来定义参数 `w` 和 `b`，使得至少一个训练集的 `y`\
  \ 预测输出会接近实际值。在这里我们将此函数定义为：\n\n$\\vartheta(\\hat{y},y) = \\frac{1}{2}(\\hat{y} -\
  \ y)²$\n\n\n\n\n\n这里的问题在于非凸性，因此对于梯度下降，我们重新定义了逻辑回归的函数函数以创建凸性，如下：\n\n$\\vartheta(\\\
  hat{y},y) = -(y\\log\\hat{y}+(1-y)\\log(1-\\hat{y}))$  \n\n在这里，损失函数是针对单个训练样本定义的。然而，我们需要查看整个训练样本来定义逻辑回归的代价函数：\n\
  \n$$J\\left( {w,b} \\right) = \\frac{1}{m}\\sum\\limits_{i - 1}^{m}\\vartheta\\\
  left( {{\\hat{y}}^{i},y^{i}} \\right)$$  \n\n220. 简而言之，在这里我们需要确保代价函数尽可能小。为了实现这一点，我们需要优化参数\
  \ `w` 和 `b`。\n\n### 梯度下降\n\n梯度下降是一种通过优化给定函数来学习参数 `w` 和 `b` 的技术，如前所述。该函数是凸的，因此我们期望有一个全局最小值，这也是选择之前的函数格式的核心原因。让我们研究一下运行梯度下降需要什么：\n\
  \n1. 初始化 `w` 和 `b` – 我们可以将这些向量设置为 0\n2. 向最陡峭的山坡方向迈一步\n3. 重复步骤 2 直到达到全局最优，全局最优定义为导数为零\n\
  \n那么梯度下降的新的、更新的方程将是：\n\n$$w \\cong w - \\alpha\\frac{\\delta J\\left( {w,b} \\right)}{\\\
  delta w}$$  \n\n$$b \\cong b - \\alpha\\frac{\\delta J\\left( {w,b} \\right)}{\\\
  delta b}$$  \n\n在这里，`alpha` 是学习率，你之后会听到，它控制了每次迭代后我们想要迈多大的步。\n\n总而言之，让我们现在过一遍逻辑回归梯度下降。公式如下：\n\
  \n$z = w^{(T)}X + b$  \n\n$\\hat{y} = a = \\sigma(z)$  \n\n$\\vartheta(a,y) = -(y\\\
  log(a)+(1-y)\\log(1-a))$  \n\n现在，假设对于两个特征 `x1` 和 `x2`，计算损失的计算图将在图 6.17 中定义如下：\n\n\
  ![Figure 6.17 Loss Function Computation Return to text.⏎](img/fig6_17.jpg)\n\n**图\
  \ 6.17** 损失函数计算 返回文本。⏎\n\n这就是我们说的**正向传播**，用于计算损失函数的第一次迭代 `L(a,y)`。这类似于你的标准回归方法。然而，这不足以找到优化的\
  \ `w1`、`w1` 和 `b` 参数。因此我们现在需要找到这些参数相对于整个函数的导数，并在每次迭代中更新它们的参数以便找到“最优”结果。这就是所谓的**反向传播**，因为我们回到过去以获取“新的”参数集，然后再次开始向前移动。221.\n\
  \n基本上，我们需要遵循以下步骤：\n\n1. 计算 `da`，定义为 `da = dL/da = (-y/a) + (1-y)/(1-a)`\n2. 计算 `dz`，定义为\
  \ `dz = (dL/da)(da/dz) = [(-y/a)+(1-y)/(1-a)]*[a*(1-a)] = a - y`\n3. 计算 `dw1`，定义为\
  \ `dw = [(dL/da)(da/dz)]*dz/dw1 = (a-y)*dz/dw1`\n4. 类似于 `w1` 和 `b`\n\n最后，在对单个训练集的第一次迭代后，权重的更新如下：\n\
  \n$w[1] = w[1] - alpha*dw[1]$  \n\n$w[2] = w[2] - alpha*dw[2]$  \n\n$b = b - alpha*db$\n\
  \n由于我们处理的是多个训练集，我们确实需要查看在这种情况下如何计算上一个集合，因此：\n\n$$J\\left( {w,b} \\right) = \\frac{1}{m}\\\
  sum\\limits_{i - 1}^{m}\\vartheta\\left( {{\\hat{y}}^{i},y^{i}} \\right)$$  \n\n\
  $\\hat{y} = a = \\sigma(z)$  \n\n$\\vartheta(a,y) = -(y\\log(a)+(1-y)\\log(1-a))$\n\
  \n\n\n\n\n为了建立对神经网络的概念性理解，让我们先来看一个使用预定义且良好的 `math.sin()` 函数的简单示例。我们应该能够构建一个模型，以相对较高的准确率预测下一个步骤/结果。与分析各种特征之间的关系不同，我们关注的是序列，即预测下一个观测值。\n\
  \n作为开始，我们生成了 100 个随机初始的正弦波序列，为我们的 RNN 架构准备训练数据集，如图图 6.20 所示。\n\n![Figure 6.20 Sine\
  \ Wave Return to text.⏎](img/fig6_20.jpg)\n\n**图 6.20** 正弦波 返回正文。⏎\n\n224.\n\n```\n\
  # Example: Sine wave prediction\ndef generate_sine_data(seq_length=10, num_sequences=100):\n\
  \    \"\"\"生成用于训练的正弦波序列\"\"\"\n    X, y = [], []\n \n    for _ in range(num_sequences):\n\
  \        # 随机起始点\n        start = np.random.uniform(0, 4*np.pi)\n        # 生成序列\n\
  \        t = np.linspace(start, start + seq_length*0.1, seq_length + 1)\n      \
  \  sine_wave = np.sin(t)\n \n        # 输入：前 seq_length 个点\n        # 目标：每个输入点的下一个点\n\
  \        X.append([np.array([x]) for x in sine_wave[:-1]])\n        y.append([np.array([x])\
  \ for x in sine_wave[1:]])\n \n    return X, y\n```\n\n### 初始化简单的 RNN 架构\n\n基本的\
  \ RNN 方程 `h_t = tanh(W_xh * x_t + W_hh * h_{t-1} + b_h)` 的隐藏状态和输出层定义在下一个代码片段中。我们使用了带有梯度裁剪的时间随反向传播（BPTT）。在此，我们根据此代码片段随机初始化权重\
  \ `W_xh, W_hh, W_hy`，并将偏置设为零向量：\n\n```python\nclass SimpleRNN:\n    def __init__(self,\
  \ input_size, hidden_size, output_size, learning_rate=0.01):\n```\n\n225.\n\n```python\n\
  \        \"\"\"\n        从零实现的简单 RNN\n \n        Args:\n            input_size:\
  \ 输入特征的数量\n            hidden_size: 隐藏单元的数量\n            output_size: 输出特征的数量\n\
  \            learning_rate: 训练的学习率\n        \"\"\"\n        self.input_size = input_size\n\
  \        self.hidden_size = hidden_size\n        self.output_size = output_size\n\
  \        self.learning_rate = learning_rate\n \n        # 随机初始化权重\n        self.Wxh\
  \ = np.random.randn(hidden_size, input_size) * 0.1  # 输入到隐藏\n        self.Whh =\
  \ np.random.randn(hidden_size, hidden_size) * 0.1  # 隐藏到隐藏\n        self.Why = np.random.randn(output_size,\
  \ hidden_size) * 0.1  # 隐藏到输出\n \n        # 初始化偏置\n        self.bh = np.zeros((hidden_size,\
  \ 1))\n        self.by = np.zeros((output_size, 1))\n```\n\n### 前向传播\n\n前向传播是通过信息从网络从一个时间步顺序传递到下一个来计算输出的过程，其中每个步骤都同时使用当前输入和来自前一个时间步的信息。\n\
  \n在标准 RNN 中，前向传播涉及维护一个在每个时间步更新的隐藏状态。对于输入序列 `x[1]`、`x[2]` … `x[t]`，该过程如下：\n\n在每个时间步\
  \ `t:`，使用当前输入 `x[t]` 和上一个隐藏状态 `h[t-1]` 计算隐藏状态 `h[t]`。\n\n*   计算通常遵循于：`h[t] = tanh(W[hh]\
  \ * h[t-1] + W[xh] * x[t] + b[h])`\n*   可以从隐藏状态生成输出 `h[t]`：`y[t] = W[hy] * h[t]\
  \ + b[y]`\n\n其中 `W` 代表权重矩阵，`b` 代表偏置向量。\n\n与同时处理所有输入的前馈网络不同，RNN 逐个顺序处理输入，通过隐藏状态保持记忆。每个时间步都使用相同的权重矩阵，这允许网络处理不同长度的序列并减少参数的总数。隐藏状态充当了网络的内存，理论上允许它在处理后来的输入时记住序列中较早阶段的信息。\n\
  \n前向传播跨跨时间步上创建了一个展开的计算图。对于长度为 `T` 的序列，你本质上拥有 `T` 个顺序连接的 RNN 单元，每个单元都接收一个输入。\n\n\
  ```python\n    def forward(self, inputs):\n        \"\"\"\n        通过 RNN 的前向传播\n\
  \ \n        Args:\n            inputs: 输入向量列表（序列）\n \n        Returns:\n       \
  \     outputs: 输出向量列表\n            hidden_states: 隐藏状态列表\n        \"\"\"\n     \
  \   h = np.zeros((self.hidden_size, 1))  # 初始隐藏状态\n        hidden_states = [h.copy()]\n\
  \        outputs = []\n \n        for x in inputs:\n            # 将输入重塑为列向量\n  \
  \          x = x.reshape(-1, 1)\n            \n            # RNN 前向步：h_t = tanh(W_xh\
  \ * x_t + W_hh * h_{t-1} + b_h)\n            h = np.tanh(np.dot(self.Wxh, x) + np.dot(self.Whh,\
  \ h) + self.bh)\n            \n            # 输出：y_t = W_hy * h_t + b_y\n       \
  \     y = np.dot(self.Why, h) + self.by\n            \n            hidden_states.append(h.copy())\n\
  \            outputs.append(y.copy())\n \n        return outputs, hidden_states\n\
  ```\n\n`forward()` 函数定义了前向传播。\n\n### 反向传播\n\n反向传播是在训练期间计算梯度以更新网络参数的过程。与前馈网络不同，RNN\
  \ 具有时间依赖，使得反向传播变得复杂。RNN 的标准方法是时间随反向传播（BPTT）。由于 RNN 处理序列并维护依赖之前时间步的隐藏状态，网络在概念上跨时间步“展开”，以形成用于梯度计算的结构。\n\
  \n基本上，RNN 逐步处理输入序列，并在每个时间步计算隐藏状态和输出。每个隐藏状态依赖于当前输入和上一个隐藏状态。然后，梯度随时间反向流动，从最后一个时间步开始向开头移动。在每个时间步，相对于以下内容计算梯度：\n\
  \n*   该时间步的输出\n*   隐藏状态\n*   输入到隐藏和隐藏到隐藏的权重矩阵\n\n227. 由于梯度必须跨越多个时间步，它们可能会消失（指数级减小）或爆炸（指数级增大）。这对于长序列来说特别是一个问题。展开的网络对于长序列会变得非常深，导致计算开销大且耗内存。每个时间步的梯度都依赖于所有的未来时间步，创建了必须仔细管理的复杂相互依赖关系。\n\
  \n\n\n\n\n```python\n    def backward(self, inputs, targets, outputs, hidden_states):\n\
  \        \"\"\"\n        反向传播（随时间反传播）\n \n        Args:\n            inputs: 输入序列\n\
  \            targets: 目标序列\n            outputs: 预测输出\n            hidden_states:\
  \ 前向传播的隐藏状态\n        \"\"\"\n        # 初始化梯度\n        dWxh = np.zeros_like(self.Wxh)\n\
  \        dWhh = np.zeros_like(self.Whh)\n        dWhy = np.zeros_like(self.Why)\n\
  \        dbh = np.zeros_like(self.bh)\n        dby = np.zeros_like(self.by)\n \n\
  \        dh_next = np.zeros_like(hidden_states[0])\n \n        # 时间反传播\n       \
  \ for t in reversed(range(len(inputs))):\n            # 输出层梯度\n            dy =\
  \ outputs[t] - targets[t].reshape(-1, 1)\n            dWhy += np.dot(dy, hidden_states[t+1].T)\n\
  \            dby += dy\n \n            # 隐藏层梯度\n            dh = np.dot(self.Why.T,\
  \ dy) + dh_next\n            dh_raw = (1 - hidden_states[t+1] ** 2) * dh  # tanh\
  \ 数\n \n            # 权重梯度\n            dbh += dh_raw\n            dWxh += np.dot(dh_raw,\
  \ inputs[t].reshape(1, -1))\n            dWhh += np.dot(dh_raw, hidden_states[t].T)\n\
  \ \n            dh_next = np.dot(self.Whh.T, dh_raw)\n \n        # 裁剪梯度防止梯度爆炸\n\
  \        for dparam in [dWxh, dWhh, dWhy, dbh, dby]:\n            np.clip(dparam,\
  \ -5, 5, out=dparam)\n \n        # 更新权重\n        self.Wxh -= self.learning_rate\
  \ * dWxh\n        self.Whh -= self.learning_rate * dWhh\n        self.Why -= self.learning_rate\
  \ * dWhy\n        self.bh -= self.learning_rate * dbh\n        self.by -= self.learning_rate\
  \ * dby\n```\n\n请注意在更新权重时使用的 `learning rate`（学习率），这是我们在 RMM 实现中需要管理的另一个超参数。学习率参数将影响收敛速度以及\
  \ RRN 结果的潜在准确性。\n\n### 训练\n\n循环神经网络（RNN）中的训练是指学习参数（权重和偏置）的过程，通过在跨时间步上维护和更新隐藏状态，使网络能够有效处理序列化数据。损失函数取决于任务类型。对于序列到序列任务，损失在每个输出时间步上计算并进行求和或平均（在我们的案例中是取平均）。对于序列分类，损失通常仅在最后一个时间步使用最终隐藏状态计算。\n\
  \n此示例训练 RNN 来预测正弦波值。网络学习将正弦波序列作为输入，利用其隐藏状态记住之前的模式，从而预测序列中的下一个值。\n\n229.\n\n```python\n\
  \    def train(self, X, y, epochs=100):\n        \"\"\"\n        训练 RNN\n      \
  \  Args:\n            X: 输入序列\n            y: 目标序列\n            epochs: 迭代次数\n \
  \       \"\"\"\n        losses = []\n\n        for epoch in range(epochs):\n   \
  \         total_loss = 0\n\n            for i in range(len(X)):\n              \
  \  # 前向传播\n                outputs, hidden_states = self.forward(X[i])\n\n     \
  \           # 计算损失（均方误差）\n                loss = 0\n                for j in range(len(outputs)):\n\
  \                    loss += np.mean((outputs[j] - y[i]) ** 2)\n               \
  \ total_loss += loss\n\n                # 反向传播\n                self.backward(X[i],\
  \ y[i], outputs, hidden_states)\n\n            losses.append(total_loss / len(X))\n\
  \n            if epoch % 100 == 0:\n                print(f\"Epoch {epoch}, Loss:\
  \ {losses[-1]:.6f}\")\n\n        return losses\n\n    def predict(self, sequence):\n\
  \        \"\"\"\n        对序列进行预测\n        Args:\n            sequence: 输入序列\n\n\
  \        Returns:\n            predictions: 预测输出\n        \"\"\"\n        outputs,\
  \ _ = self.forward(sequence)\n        return [output.flatten() for output in outputs]\n\
  ```\n\n### 预测\n\n在 DDF 设计阶段，要实现 RNN，首先初始化所有变量并向网络输入数据。下一步是训练网络。训练完成后，模型就可以预测新的时间序列。\n\
  \n```python\n# 生成训练数据\nX_train, y_train = generate_sine_data(seq_length=80, num_sequences=100)\n\
  \n# 创建并训练 RNN\nrnn = SimpleRNN(input_size=1, hidden_size=10, output_size=1, learning_rate=0.01)\n\
  \nprint(\"Training RNN...\")\nlosses = rnn.train(X_train, y_train, epochs=500)\n\
  \n# 测试训练好的 RNN\nprint(\"\\nTesting RNN...\")\n\n# 生成测试序列\ntest_start = np.random.uniform(0,\
  \ 4*np.pi)\ntest_t = np.linspace(test_start, test_start + 1.0, 15)\ntest_sine =\
  \ np.sin(test_t)\n\n# 使用前 30 个点预测剩余部分\ninput_seq = [np.array([x]) for x in test_sine[:30]]\n\
  predictions = rnn.predict(input_seq)\n```\n\n## 6.6 总结\n\n在本章中，我们向读者介绍了一些金融和金融科技领域常用的基础机器学习工具。在章节的第一部分，我们从概念、数学以及编程的角度剖析了普通最小二乘法（OLS）模型。我们对\
  \ LASSO 回归、决策树和随机森林模型也遵循了同样的方法。核心目的是让读者进入假设的 DDF 模型选择第 3 阶段，并为模型选择提供一个框架。我们使用模型准确性衡量模拟了一种为当前任务选择“最佳”模型的方法。这部分处理的是标准的机器学习模型。\n\
  \n\n\n\n接下来，在第二部分，我们将重点强调这样一个观点：由于金融市场和数据的若干独特特性，金融领域的机器学习应用与其他领域有显著不同。金融市场本质上具有非平稳性，这意味着统计特性会随时间而变化。与图像识别中猫仍然是猫不同，由于状态切换、经济周期或结构性转变，昨天仍然有效的市场模式明天可能不再有效。这要求模型能够快速适应，或者检测出关系何时发生失效。与计算机视觉或自然语言处理等领域相比，金融数据的信噪比通常极低。此外，市场波动受到无数因素的影响，其中许多因素是不可预测或不可衡量的，这使得提取有意义的模式变得困难得多。更重要的是，金融运行在一个对抗性环境中，在这种环境中，模型的成功实际上可能会降低其未来的有效性。如果一个盈利的交易策略变得广为人知，市场就会产生适应，优势随之消失。这与医学诊断或语音识别不同，后者的模型性能不会因为其他人使用了类似的方法而退化。此外，金融机器学习必须在严格的监管框架和风险管理要求内运行。模型需要具有可解释性以满足合规性、处理头寸限制、考虑交易成本并在市场压力期间保持稳定性——这些约束在其他领域很少见。\n\
  \n最后，鉴于这种环境，我们将向读者介绍机器学习的核心工具之一——循环神经网络（RNN）。主要目的是以易于理解且清晰可解释的方式解释 RNN 的架构、训练过程和模型应用。我们讨论了正向传播和反向传播，并展示了一个简单的正弦波预测示例。本章是进入后续章节的基石，后续章节将探索\
  \ `LSTM RNN` 的复杂性，并为读者提供情感分析和 `LLMs` 利用所需的数学和概念公式。\n\n## 6.7 概念问答\n\n*   Q1: `OLS`\
  \ 回归为了提供无偏估计需要满足哪些假设？\n\n    A1: `OLS` 回归依赖于几个关键假设：线性性（自变量与因变量之间的关系是线性的）、误差独立性（残差不相关）、同方差性（在自变量的所有水平上误差的方差是恒定的）、残差正态性（误差遵循正态分布）以及无多重共线性（自变量之间互不高度相关）。当这些假设被违反时，估计可能会变得偏或低效。\n\
  \n*   Q2: 决定系数（`R²`）与 `OLS` 回归中的解释方差有什么关系？\n\n    A2: `R²` 代表模型中自变量解释的因变量方差的比例。它的范围从\
  \ 0 到 1，其中 0 表示没有解释能力，1 表示完美解释。数学上，`R² = 1 - (SSR/SST)`，其中 `SSR` 是残差平方和，`SST` 是总平方和。然而，`R²`\
  \ 可能会产生误导，因为它会随着变量的增加而增加，这就是为什么在模型比较时通常优选择调整 `R²`。\n\n*   Q3: 决策树中的偏差-方差权衡是什么？树深如何影响它？\n\
  \n    A3: 决策树在深时（过拟合）表现出高方差和低偏差，在浅时（欠拟合）表现出高偏差和低方差。深树可以通过创建复杂的决策边界来完美拟合训练数据，但由于高方差，它们对新数据的泛化能力差。浅树对数据结构做出了强假设（高偏差），但在不同数据之间更稳定。\n\
  \n*   Q4: 随机森林中的特征重要性是如何工作的？它的局限性是什么？\n\n    A4: 随机森林通过衡量当特征用于分裂时，纯度（Gini 或熵）的平均下降量来计算重要性。然而，这种方法具有局限性：它倾向于具有更多层次的特征。\n\
  \n*   Q5: `RNNs` 中的梯度消失问题是什么？`LSTM` 和 `GRU` 如何解决它？\n\n    A5: 梯度消失问题发生在梯度在 `RNN`\
  \ 中随时间反向传播时呈指数级减小，使得难以学习长期依赖关系。`LSTM` 通过门控机制解决了此问题；`GRU` 通过重置门和更新门简化了这一点。## 6.8\
