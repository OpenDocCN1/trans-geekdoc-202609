  如图 3.6 所示，反复调用 `plt.plot()` 将将图表绘制在一起。对于散点图或折线图等图表这不是问题，但对于柱状图可能会出现问题：\n\n```python\n\
  import matplotlib.pyplot as plt\n\nindices = ['A', 'B', 'C', 'D', 'E', 'F', 'G']\n\
  x = [1,2,3,4,5,6,7]\ny = [7,6,5,4,3,2,1]\n\nplt.bar(indices, x)\nplt.bar(indices,\
  \ y)\nplt.savefig('bar.png')\n```\n\n因此，你可以使用 `plt.subplot` 在同一张图上绘制多个图表：\n\n```python\n\
  import matplotlib.pyplot as plt\nimport math\n\nx = [2*math.pi*n/100 for n in range(0,100)\
  \ ]\ny = [math.sin(n) for n in x ]\nz = [math.cos(n) for n in x ]\nw = [math.tan(n)\
  \ for n in x ]\nv = [ n * math.sin(n) for n in x ]\n## 创建 2x2 子图\n### 选择第 1 个子图\n\
  plt.subplot(2, 2, 1)\nplt.plot(x, y, label='sin(x)')\nplt.legend()\n\n### 2x2 子图中的\n\
  ### 选择第二个图\nplt.subplot(2, 2, 2)\nplt.plot(x, z, label='cos(x)')\nplt.legend()\n\
  plt.savefig('plot.png')\n\n### 2x2 子图中的\n### 选择第三个图\nplt.subplot(2, 2, 3)\nplt.plot(x,\
