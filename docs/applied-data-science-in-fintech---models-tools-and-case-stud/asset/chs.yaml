  FinBERT\n\nFinBERT 是 BERT 的特殊版本，针对金融文本任务进行了微调。\n\n\n\n\nFinBERT 将 BERT 的基础架构作为其核心基础。它使用了多层双向\
  \ Transformer 编码器，配有自注意力机制和前馈神经网络。主要的区别在于 FinBERT 如何适应金融领域。BERT 是从维基百科和 BookCorpus（33\
  \ 亿个标记）等通用文本中学习的。而 FinBERT 则从更多金融文本中学习，以更好地理解金融语言 [8.9]。研究表明，在原始 BERT 模型的基础上进行构建的效果优于从头开始构建金融模型。\n\
  \n281.FinBERT 模型的输出层为情感类别（负面、中性、正面）创建概率分布。它使用了交叉熵损失函数和 AdamW 优化器。这种结构有助于 FinBERT\
  \ 捕捉标记之间的双向上下文关系。这些关系对于准确的 FinBERT 情感分析至关重要。\n\nFinBERT 从 BERT 的预训练目标开始。掩码语言模型（MLM）任务随机隐藏\
  \ 15% 的输入标记。模型学习根据上下文预测这些标记。这种方法允许真正的双向学习，因为模型在做出预测时会同时查看之前的和之后的文本。下一句预测（NSP）教会模型识别连续的文本段。模型在训练期间看到成对的句子。其中一半是真实的连续句子，另一半是随机对。NSP\
  \ 有助于理解句子之间的关系。由于最近的研究对其益处产生怀疑，某些 FinBERT 版本跳过了此任务。\n\n高级 FinBERT 版本增加了除 MLM 和 NSP\
  \ 之外的更多预训练任务：\n\n*   句子重排序：以学习句子之间的关系\n*   问答任务：以掌握语义相关\n*   关键词识别：以理解主题\n\n这些多种学习方法帮助\
  \ FinBERT 更好地掌握语言知识和含义，特别是在金融背景下。\n\nFinBERT 模型的成功得益于其大量的金融训练数据。这些数据包含三类主要文档：\n\n\
  *   公司文件：来自 1994–2019 年间 Russell 3000 的 60,490 份 10-K（年度）报告和 142,622 份 10-Q（季度）报告，来自\
  \ SEC EDGAR 数据库\n*   分析师报告：来自 2003–2012 年间 Thomson Investext 数据库的关于标普 500 公司的约 476,633\
  \ 份报告\n*   收益电话纪要：来自 2004–2019 年间 SeekingAlpha 的 7,740 家上市公司的 136,578 份纪要\n\n该语料库拥有\
  \ 49 亿个标记——比 BERT 的原始训练数据多 50%。如此巨大的金融数据集有助于 FinBERT 理解专业的金融术语和交流模式。选择这些文本是因为人员经常使用它们。它们包含了核心团队（如经理和分析师）的输入。文本还让模型接触到各种类型的金融话题和交流风格。\n\
  \nFinBERT 模型在特定领域的金融文本上进行预训练后，需要微调才能在情感分析等特定任务中表现出色。这一关键步骤通过对标记的 280 份金融文本数据集进行针对性训练，将预训练模型转换为专门的金融情感分类器。两个关键数据集为训练情感分类提供了标记示例：\n\
  \n*   金融短句库（Financial PhraseBank）：Malo 等人（2014）利用 LexisNexis 数据库中来自金融新闻的 4,845 英语句子创建了此数据集。这些句子由\
  \ 16 位具有金融和商业背景的人员进行了仔细标注。这些专家根据句子对公司股价的潜在影响对每个句子进行分类。数据集中的某些句子在标注者之间达到了完全共识 [8.10]。\n\
  *   分析师报告：某些 FinBERT 情感分析版本使用了来自分析师报告的 10,000 个手动标注句子，以提高在真实金融文档上的性能。这些专业标注是获取捕捉分析语言细微差别的领域示例的极佳方法。\n\
  \n这两个数据集都能帮助模型识别不同类型金融交流中的情感模式。这创建了一个更具通用性的分类器，可以处理各种金融文本。\n\n##  Analytics\n\n\
  与之前的 VADER 模型介绍一致，在本节中，我们调查了利用 FinBERT 架构的语言分析。我们正处于 DDF 站 #3 模型设计阶段，我们的角色是设计建模框架，以从文本数据序列中评估情感。这可以被业务部门用于告知或将结果链接到另一个预测模型，例如作为资产交易算法的输入。\n\
  \n首先，我们加载相关库，即 `transformers` 和 `torch`，以适应 `model_name = “ProsusAI/finbert` 的预训练模型。在这种情况下，我们不是模型构建者。我们是模型用户：\n\
  \n```python\nimport json\nimport pandas as pd\nfrom transformers import AutoTokenizer,\
  \ AutoModelForSequenceClassification\nfrom transformers import pipeline\nimport\
  \ torch\nimport re\nimport warnings\nwarnings.filterwarnings('ignore')\n \ndef load_finbert_model():\n\
  \    \"\"\"\n \n    加载用于金融情感分析的 FinBERT 模型\n    \"\"\"\n \n    model_name = \"ProsusAI/finbert\"\
  \n    tokenizer = AutoTokenizer.from_pretrained(model_name)\n    model = AutoModelForSequenceClassification.from_pretrained(model_name)\n\
  \ \n    # 创建情感分析流水线\n    sentiment_pipeline = pipeline(\n        \"sentiment-analysis\"\
  ,\n        model=model,\n        tokenizer=tokenizer,\n        device=0 if torch.cuda.is_available()\
  \ else -1\n    )\n \n    return sentiment_pipeline\n```\n\n281.接下来，正如我们注意到的，文本 DataFrame\
  \ 在预处理和分词步骤方面需要额外的关注。我们运行此清理练习：\n\n```python\ndef preprocess_text(text):\n  \"\"\
  \"\n  清理并预处理文本用于情感分析\n  \"\"\"\n \n  if not isinstance(text, str):\n    return \"\
  \"\n \n  # 移除 HTML 标签\n  text = re.sub(r'<[^>>', '', text)\n \n  # 移除 URL\n  text\
  \ = re.sub(r'http[s]?://(?:[a-zA-Z0-9]|[$-@.&+]|[!*()]))+', '', text)\n  # 移除多余空格\n\
  \  text = re.sub(r'\\s+', ' ', text).strip()\n \n  # 截断以避免标记限制（FinBERT 有 512 个标记限制）\n\
  \  if len(text) > 2000: # 为了低于标记限制字符限制\n    text = text[:2000]\n \n  return text\n\
  ```\n\n一旦我们认为内容干净，就可以概述模型结果并将数值分数转换为人类可理解的类别。这用于最后阶段，触发模型、收集模型分数并将此代码序列收集到最终结果模型中。在这个阶段如此严谨的原因是最终能够以可视化和表格形式将情感语言分析交付给结果的消费者。\n\
  \n282.\n\n```python\ndef calculate_sentiment_scores(text, sentiment_pipeline):\n\
  \    \"\"\"\n    使用 FinBERT 计算情感得分\n    返回情感标签和置信分数\n    \"\"\"\n \n    try:\n \
  \       # 获取预测\n        result = sentiment_pipeline(text)\n \n        # FinBERT\
  \ 返回：positive, negative, neutral\n        label = result[0]['label'].lower()\n \
  \       score = result[0]['score']\n \n        # 转换为数值情感索引\n        if label ==\
  \ 'positive':\n            sentiment_index = score\n        elif label == 'negative':\n\
  \            sentiment_index = -score\n        else:  #中性\n            sentiment_index\
  \ = 0\n \n        return {\n            'sentiment_label': label,\n            'confidence_score':\
  \ score,\n            'sentiment_index': sentiment_index\n        }\n \n    except\
  \ Exception as e:\n        print(f\"处理文本出错: {str(e)[:100]}…\")\n        return {\n\
  \            'sentiment_label': 'neutral',\n            'confidence_score': 0.0,\n\
  \            'sentiment_index': 0.0\n        }\n```\n\n\n\n\n最后，以下代码序列交付了最终的语言分析结果：\n\
  \n23.\n\n```python\ndef analyze_json_sentiment(json_file_path):\n    \"\"\"\n  \
  \  分析 JSON 文件的情感\n    \"\"\"\n    print(\"加载 FinBERT 模型...\")\n    sentiment_pipeline\
  \ = load_finbert_model()\n    print(\"模型加载成功!\")\n\n    # 加载 JSON 数据\n    with open(json_file_path,\
  \ 'r', encoding='utf-8') as file:\n        data = json.load(file)\n\n    print(f\"\
  正在处理 {len(data)} 篇文章...\")\n\n    results = []\n\n    for idx, article in enumerate(data):\n\
  \        print(f\"正在处理文章 {idx + 1}/{len(data)}: {article.get('title', '无标题')[:50]}...\"\
  )\n\n        # 提取并预处理文本\n        body_text = preprocess_text(article.get('body',\
  \ ''))\n\n        if not body_text:\n            print(f\"警告：文章 {idx + 1} 正文为空\"\
  )\n            continue\n\n        # 计算情感\n        sentiment_result = calculate_sentiment(body_text,\
  \ sentiment_pipeline)\n\n        # 准备结果\n        result = {\n            'id': article.get('id',\
  \ ''),\n            'title': article.get('title', ''),\n            'source': article.get('source',\
  \ ''),\n            'published_date': article.get('published_date', ''),\n     \
  \       'categories': article.get('categories', ''),\n            'tags': article.get('tags',\
  \ ''),\n            'url': article.get('url', ''),\n            'body_length': len(body_text),\n\
  \            'sentiment_label': sentiment_result['sentiment_label'],\n         \
  \   'confidence_score': round(sentiment_result['confidence_score'], 4),\n      \
  \      'sentiment_index': round(sentiment_result['sentiment_index'], 4)\n      \
  \  }\n\n        results.append(result)\n        print(f\"  情感: {sentiment_result['sentiment_label']}\
  \ ({sentiment_result['sentiment_index']:.4f})\")\n\n    return results\n```\n\n\
  可见，我们初始化模型，加载了 `.json` 文件（在本例中为 50 条加密货币新闻），并执行了每篇文章 `body` 的情感分析。注意，根据预定义的序列收集结果的重要性。此步骤的重要性将在后续章节中变得显而易见。8.11].\n\
