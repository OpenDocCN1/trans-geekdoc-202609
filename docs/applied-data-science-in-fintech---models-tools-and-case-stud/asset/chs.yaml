  )\n \n        # 检查余额\n        balance = self.w3.eth.get_balance(self.account.address)\n\
  \        balance_eth = self.w3.from_wei(balance, 'ether')\n        print(f\"   Balance:\
  \ {balance_eth} ETH\")\n \n        if balance_eth < 0.01:\n            print(\"\
  \   ⚠     余额不足 - 你可能需要测试 ETH 来部署合约\")\n```\n\n## 特性\n\n在我们简单的假设示例中，我们在公共以太坊网络上以智能合约的形式录入并增加一个金额，特性由事务管理步骤组成。\n\
  \n```python\n    def send_transaction(self, contract_function):\n        \"\"\"\
  发送合约事务的辅助函数\"\"\"\n        try:\n            transaction = contract_function.build_transaction({\n\
  \                'from': self.account.address,\n                'nonce': self.w3.eth.get_transaction_count(),\n\
  \            })\n            signed_txn = self.w3.eth.accounts.sign_transaction(transaction,\
  \ self.account.key)\n            tx_hash = self.w3.eth.send_raw_transaction(signed_txn.rawTransaction)\n\
  \            return tx_hash\n        except Exception as e:\n            print(f\"\
  ❌ 事务错误: {e}\")\n            return None\n\n    def wait_for_transaction(self, tx_hash):\n\
  \        \"\"\"等待事务确认\"\"\"\n        try:\n            receipt = self.w3.eth.wait_for_transaction_receipt(tx_hash)\n\
  \            if receipt.status == 1:\n                print(f\"   ✅ 事务确认: {tx_hash}\"\
  )\n                return receipt\n            else:\n                print(f\"\
  \   ❌ 事务失败: {tx_hash}\")\n                return None\n        except Exception\
  \ as e:\n            print(f\"❌ 等待错误: {e}\")\n            return None\n```## 模型\n\
  \n这里的特性具有操作性。例如房地产代币化，特性包含各种形式的处理。此阶段定义了价值创建，在我们的示例中为递增功能。以下函数演示了各种合约交互，即智能合约的大脑。\n\
  \n```python\n    def interact_with_contract(self):\n        \"\"\"演示各种合约交互\"\"\"\
  \n        if not self.contract:\n            print(\"❌ 未部署合约\")\n            return\n\
  \ \n        print(\"\\n\U0001F504 正在与智能合约交互...\")\n \n        try:\n           \
  \ # 读取所有者\n            owner = self.contract.functions.owner().call()\n        \
  \    print(f\"   合约所有者: {owner}\")\n \n            # 读取初始存储值\n            initial_value\
  \ = self.contract.functions.get().call()\n            print(f\"   初始存储值: {initial_value}\"\
  )\n \n            # 设置新值\n            print(\"   正在设置为 42…\") \n            tx_hash\
  \ = self.send_transaction(self.contract.functions.set(42))\n            if tx_hash:\n\
  \                self.wait_for_transaction(tx_hash)\n                \n        \
  \        # 读取更新值\n                new_value = self.contract.functions.get().call()\n\
  \                print(f\"   新存储值: {new_value}\")\n            \n            # 增加值\n\
  \            print(\"   正在增加值…\")\n            tx_hash = self.send_transaction(self.contract.functions.increment())\n\
  \            if tx_hash:\n                self.wait_for_transaction(tx_hash)\n \
  \               \n                # 读取最终值\n                final_value = self.contract.functions.get().call()\n\
  \                print(f\"   最终存储值: {final_value}\")\n \n        except Exception\
  \ as e:\n            print(f\"❌ 交互错误: {e}\")\n```\n\n## 设计\n\n为了将整个流程缝合，最后一个阶段“设计”涉及智能合约的部署和事件处理。在实现阶段，我们创建合约实例、构建相关事务、签名并发送事务，最后确认最终部署，如下代码片段所示：\n\
  \n\n\n\n\n```python\n    def deploy_contract(self):\n        \"\"\"Deploy the smart\
  \ contract\"\"\"\n        if not self.w3.is_connected() or not self.account:\n \
  \           print(\"❌ Cannot deploy: No connection or account\")\n            return\
  \ False\n\n        print(\"\\n\U0001F4DD Deploying Smart Contract…\")\n\n      \
  \  try:\n            # Create contract instance\n            contract = self.w3.eth.contract(abi=CONTRACT_ABI,\
  \ bytecode=CONTRACT_BYTECODE)\n\n            # Build transaction\n            transaction\
  \ = contract.constructor().build_transaction({\n                'from': self.account.address,\n\
  \                'nonce':\nself.w3.eth.get_transaction_count(self.account.address),\n\
  \                'gas': 2000000,\n                'gasPrice': self.w3.eth.gas_price,\n\
  \            })\n            # Sign and send transaction\n            signed_txn\
  \ = self.w3.eth.account.sign_transaction(transaction, self.account.key)\n      \
  \      tx_hash = self.w3.eth.send_raw_transaction(signed_txn.rawTransaction)\n \
  \           print(f\"Transaction hash: {tx_hash.hex()}\")\n            print(\"\
  Waiting for confirmation...\")\n            # Wait for transaction receipt\n   \
  \         tx_receipt = self.w3.eth.wait_for_transaction_receipt(tx_hash)\n\n   \
  \         if tx_receipt.status == 1:\n                contract = self.w3.eth.contract(\n\
  \                    address=tx_receipt.address,\n                    abi=CONTRACT_ABI\n\
