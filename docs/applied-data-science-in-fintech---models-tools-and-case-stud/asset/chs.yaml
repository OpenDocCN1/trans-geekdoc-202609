  \ (int): 获取的历史天数\n            to_symbol (str): 目标货币符号（默认: 'USD'）\n \n        Returns:\n\
  \            pd.DataFrame: 价格历史的 DataFrame\n        \"\"\"\n \n        url = f\"\
  {self.base_url}/v2/histoday\"\n        params = {\n            'fsym': symbol,\n\
  \            'tsym': to_symbol,\n            'limit': days,\n            'toTs':\
  \ int(time.time())\n        }\n \n        try:\n            response = requests.get(url,\
