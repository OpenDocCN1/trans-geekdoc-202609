  \n**图 9.4** 每日收益分布 返回文本。⏎\n\n303。\n\n### 波动率\n\n波动率是指某些价格、价值或比率随时间变化的程度或波动情况。在金融领域，波动率通常使用标准差等统计方法进行衡量，它是期权定价模型中的关键组件。它既被视为风险衡量标准（波动率越高\
  \ =风险越高），也是机会衡量标准（价格波动越大，盈利空间越大）。\n\n根据收益，我们在相同的收益数据频率（本例中为每日）下计算年化波动率：\n\n```python\n\
  # 计算波动率（年化）\ndef calculate_volatility(returns_df, trading_days=252):\n  \"\"\"计算每个符号的年化波动率\"\
  \"\"\n  volatility = returns_df.std() * np.sqrt(trading_days)\n  return volatility\n\
  ```\n\n我们倾向于通过波动率对年化收益率进行缩放，以提取`夏普比率`（Sharp Ratio），基本上是根据图 9.5 衡量每单位风险的资产收益。\n\n\
  ![图 9.5 滚动夏普比率 返回文本。⏎](img/fig9_5.jpg)\n\n**图 9.5** 滚动夏普比率 返回文本。⏎\n\n```python\n\
  # 计算夏普比率\ndef calculate_sharpe_ratio(returns_df, risk_free_rate=0.02, trading_days=365):\n\
  \    \"\"\"计算每个符号的夏普比率\"\"\"\n    # 年化收益\n    annualized_returns = returns_df.mean()\
  \ * trading_days\n \n    # 年化波动率\n    annualized_volatility = calculate_volatility(returns_df,\
  \ trading_days)\n \n    # 夏普比率\n    sharpe_ratios = (annualized_returns - risk_free_rate)\
  \ / annualized_volatility\n \n    return sharpe_ratios\n```\n\n另一个有趣的角度是根据图 9.6\
  \ 从收益的角度来看风险。该图显示了每个硬币的相对风险分配。正如预期的，USDT 在刻度上很低。\n\n![图 9.6 风险收益分析 返回文本。⏎](img/fig9_6.jpg)\n\
  \n**图 9.6** 风险收益分析 返回文本。⏎\n\n304。\n\n所得年化波动率衡量值：\n\n```\nANNUALIZED VOLATILITY:\n\
  ADA: 117.62%\nBNB: 49.62%\nBTC: 49.25%\nDOGE: 100.13%\nETH: 74.30%\nSOL: 86.63%\n\
  SUI: 120.38%\nTRX: 109.14%\nUSDT: 0.93%\nXRP: 99.01%\n```\n\n### 相关性\n\n相关性定义为不同资产相互运动的程度。低相关性或负相关性的资产提供更好的多元化益处。\n\
