- "# 金融科技应用数据科学：模型、工具与案例研究\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n xiii.\
  \ \n\n# 关于作者\n\n**Juraj Hric** 是 Zyanza Technologies 的联合创始人兼首席执行官。该公司是一个 AI PaaS\
