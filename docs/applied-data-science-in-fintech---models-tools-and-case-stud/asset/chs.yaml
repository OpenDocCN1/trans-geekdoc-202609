  ![图 4.10](img/fig4_10.jpg)\n图 4.10 外部温度\n\n#### 第一部分：异常检测\n\n从业务角度来看，我们通过将异常技术应用于总体能源消耗，试图检测任何时候过度使用能源的潜在违规。这适用于任何家居设备或\
  \ IoT 传感器。数据科学中的异常检测是一个关键过程，用于识别偏离预期模式的数据点、事件或观测值。这种强大的技术在许多领域都起着至关重要的作用，从金融服务的欺诈检测到工业系统的故障诊断。数据科学家采用多种方法来发现异常，包括统计方法、机器学习算法和深度学习模型。147.\
  \ 这些工具可以发现点异常（单个实例）和上下文异常（在特定背景下异常的实例）。通过标记异常模式，异常检测有助于组织预先解决潜在问题、优化过程并从数据中获得价值的见解。随着数据量和复杂性的不断增长，稳健的异常检测技术在提取有意义的信息和确保数据质量方面的重要性不言而喻。\n\
  \n\n\n\n\n```python\n    @staticmethod\n    def mean_absolute_percentage_error(y_true,\
  \ y_pred):\n        \"\"\"计算平均绝对百分误差\"\"\"\n        return np.mean(np.abs((y_true\
  \ - y_pred) / y_true)) * 100\n \n    @staticmethod\n    def plotMovingAverage(series,\
  \ window, plot_intervals=False, scale=1.96, plot_anomalies=False, filepath=None):\n\
  \        \"\"\"\n        绘制移动平均线，可选置信区间和异常值\n \n        :param series: 包含序列数据的 dataframe\n\
  \        :param window: 滚动窗口大小\n        :param plot_intervals: 显示置信区间\n        :param\
  \ scale: 置信间的缩放\n        :param plot_anomalies: 显示异常值\n        :param filepath:\
  \ 将图保存为文件的路径\n        \"\"\"\n \n        rolling_mean = series.rolling(window=window).mean()\n\
  \ \n        plt.figure(figsize=(12, 6))\n        plt.title(f\"Moving average with\
  \ window size = {window}\", fontsize=16)\n        plt.plot(rolling_mean, \"g\",\
  \ label=\"Rolling mean trend\")\n \n        # 为平滑值绘制置信区间\n        if plot_intervals:\n\
  \            mae = mean_absolute_error(series[window:], rolling_mean[window:])\n\
  \            deviation = np.std(series[window:] - rolling_mean[window:])\n     \
  \       lower_bond = rolling_mean - (mae + scale * deviation)\n            upper_bond\
  \ = rolling_mean + (mae + scale * deviation)\n            plt.plot(upper_bond, \"\
  r--\", label=\"Upper Bond / Lower Bond\")\n            plt.plot(lower_bond, \"r--\"\
  )\n \n            # 有了区间后，寻找异常值\n            if plot_anomalies:\n              \
  \  anomalies = series[(series < lower_bond) | (series > upper_bond)]\n         \
  \       plt.plot(anomalies, \"ro\", markersize=10)\n \n        plt.plot(series[window:],\
  \ label=\"Actual values\")\n        plt.xlabel('Date', fontsize=16)\n        plt.ylabel('Energy\
  \ Usage [kW]', fontsize=16)\n        plt.legend(loc=\"upper right\", fontsize=14)\n\
  \        plt.xticks(fontsize=16, rotation=45)\n        plt.yticks(fontsize=16)\n\
  \        plt.grid(True)\n        # 调整布局为旋转的 x 轴标签留空间\n        plt.tight_layout()\n\
  \        plt.subplots_adjust(bottom=0.2)\n \n        # 如果提供了 filepath，则保存图\n   \
  \     if filepath:\n            plt.savefig(filepath)\n \n        plt.show()\n```\n\
  \n```python\n    @staticmethod\n    def ARIMAts(data, tt_ratio, idx, filepath=None,\
  \ plot_all=False):\n        \"\"\"\n        应用 ARIMA 模型进行时间序列预测\n \n        :param\
  \ data: 包含时间序列数据的 dataframe\n        :param tt_ratio: 训练-测试划分比例\n        :param\
  \ idx: 时间序列数据的索引\n        :param filepath: 将图保存为文件的路径\n        :param plot_all:\
  \ 绘制带有训练-测试划分指示的完整数据\n        :return: 包含实际值和预测值的 dataframe\n        \"\"\"\n  \
  \      X = data.iloc[:, 0].values\n        size = int(len(X) * tt_ratio)\n     \
  \   train, test = X[:size], X[size:]\n        history = list(train)\n        predictions\
  \ = []\n        for t in range(len(test)):\n            model = ARIMA(history, order=(1,\
  \ 0, 1))\n            model_fit = model.fit()\n            yhat = model_fit.forecast()[0]\n\
  \            predictions.append(yhat)\n            history.append(test[t])\n   \
  \         print(f'progress: {round(100 * (t / len(test)))}%\\t predicted={yhat:.6f},\
  \ expected={test[t]:.6f}', end=\"\\r\")\n \n        error = mean_squared_error(test,\
  \ predictions)\n        print(f'\\n Test MSE: {error:.3f}')\n \n        # 处理输出\n\
  \        dfpred = pd.DataFrame(predictions, index=idx[size:], columns=['Prediction'])\n\
  \        dfact = pd.DataFrame(X, index=idx, columns=['Actual'])\n        dfout =\
  \ dfact.merge(dfpred, how=\"left\", left_index=True, right_index=True)\n       \
  \ dfp = dfout if plot_all else dfout.dropna()\n \n        # 绘图\n        plt.figure(figsize=(12,\
  \ 6))\n        plt.title(\"ARIMA Model Predictions\", fontsize=16)\n        plt.plot(dfp.index,\
  \ dfp['Actual'], color='blue', linewidth=2, label=\"Original Data\")\n        plt.plot(dfp.index,\
  \ dfp['Prediction'], color='green', linewidth=3, label=\"Predicted Data\")\n   \
  \     if plot_all:\n            plt.axvline(x=dfact.index[size - 1], linewidth=5,\
  \ color='red')\n        plt.xlabel('Date', fontsize=16)\n        plt.ylabel('Energy\
  \ Usage [kW]', fontsize=16)\n        plt.legend(loc=\"upper right\", fontsize=14)\n\
  \        plt.xticks(fontsize=16, rotation=45)\n        plt.yticks(fontsize=16)\n\
  \        plt.grid(True)\n        # 调整布局为旋转的 x 轴标签留空间\n        plt.tight_layout()\n\
  \        plt.subplots_adjust(bottom=0.2)\n```\n\n\n\n\n```python\n    @staticmethod\n\
  \    def LSTM_RNN_Advanced(x_train, x_test, y_train, y_test, index, filepath=None):\n\
  \        \"\"\"\n        构建并训练带有批归一化和正则化的高级 LSTM 模型\n \n        :param x_train:\
  \ 训练数据特征\n        :param x_test: 测试数据特征\n        :param y_train: 训练数据标签\n      \
  \  :param y_test: 测试数据标签\n        :param index: 测试数据的索引\n        :param filepath:\
  \ 保存图表的文件的路径\n        :return: 包含实际值和预测值的 dataframe\n        \"\"\"\n        model\
  \ = Sequential()\n        model.add(LSTM(units=32, return_sequences=True, input_shape=(x_train.shape[1],\
  \ 1)))\n        model.add(BatchNormalization())\n        model.add(LSTM(units=16))\n\
  \        model.add(BatchNormalization())\n        model.add(Dense(units=1, kernel_regularizer=l1_l2(l1=0.01,\
  \ l2=0.01))) \n## 添加 L1L2 正则化\n        model.compile(optimizer='adam', loss='mean_squared_error')\n\
  \        model.summary()\n        model.fit(x_train, y_train, epochs=64, batch_size=128)\n\
  \ \n        predictions = model.predict(x_test)\n        df = pd.DataFrame(predictions,\
  \ index=index, columns=['LSTM Predicted Usage'])\n        df['Actual Usage'] = y_test\n\
  \ \n        # 绘图\n        plt.figure(figsize=(12, 6))\n        plt.title(\"LSTM\
  \ Model Predictions -- Advanced\", fontsize=16)\n        plt.plot(df['Actual Usage'],\
  \ color='blue', label='Original Usage')\n        plt.plot(df['LSTM Predicted Usage'],\
  \ color='red', label='Predicted Usage')\n        plt.xlabel('Date', fontsize=16)\n\
  \        plt.ylabel('Energy Usage [kW]', fontsize=16)\n        plt.legend(loc=\"\
  upper right\", fontsize=14)\n        plt.xticks(fontsize=16, rotation=45)\n    \
  \    plt.yticks(fontsize=16)\n        plt.grid(True)\n        # 调整布局为旋转的 x 轴标签留出\n\
  \        plt.tight_layout()\n        plt.subplots_adjust(bottom=0.2)\n \n      \
  \  # 如果提供了 filepath，则保存图表\n        if filepath:\n            plt.savefig(filepath)\n\
  \ \n        plt.show()\n \n        return df\n```\n\n我们在后续章节中将从理论角度讨论 `LSTM`。在此情况下，我们简要地使用了\
