  \ 3.6 案例研究：Simply Wall St\n\n为了丰富我们的数据可视化之旅，我们将从 `API` 开始，进入用于处理结构化和非结构化数据流的基础 Python\
  \ 库，分析股票数据流（而非加密货币数据），目的是使我们的讨论与 DDF 概念保持，并逐步介绍金融科技产品 [3.11]。这里的产品本质是视觉化的。Simply\
  \ Wall St 的金融科技产品将复杂的批发信息转换为适用于零售的基础。该公司提供视觉化工具和信息图，帮助理解公司的基本面。因此，整个产品由设计和对复杂数据流的可视化解释驱动。这一创新平台改变了人们处理金融数据的方式。投资决策现在比以前更容易获得和触及。\n\
  \n### Snowflake 分析\n\nSimply Wall St 以其在金融数据可视化领域的突破性方法重塑了格局。该平台承担了通过帮助人们遵循长期投资原则来改变投资方式的任务。他们的突破性概念强调公司数据可视化——使用\
  \ Snowflake 可视化系统——而不是用传统的文本格式显示。Snowflake 可视化系统代表了通过五个标准分析公司的新方法：\n\n*   估值\n*\
  \   未来增长\n*   过去表现\n*   财务状况\n*   股息表现\n\n该系统的优势源于其评分方法。每个标准都经过六项单独检查，成功的检查可获得 1\
  \ 分。Snowflake 的形状和颜色为用户提供了关于公司现状的快速视觉总结。\n\n\n\n\n在 DDF 的背景下，Simply Wall St 从多种来源收集财务数据，例如\
  \ `S&P Global Market Intelligence`，包括官方公司公告、新闻流和市场数据流。然后，它利用算法和机器学习对数据进行分析和可视化，提供详细报告、股票分析和投资组合管理工具。实施工具包括雪花分析、投资组合分析和内部交易数据信息。\n\
  \n### 第 1 阶段：ETL（提取、转换、加载）\n\nSimply Wall St 从公司公告、交易所、财经新闻和市场数据提供商等来源获取并`extracts`\
  \ 复杂的机构数据流。随后，会进行完整性检查以确保准确性，并将数据进行清洗并`transformed` 为标准化格式。识别并提取如收益、营收、市盈率（P/E ratios）和内部交易活动等相关数据点。清洗和转换后的数据被`loaded`\
  \ 到 Simply Wall St 的云端安全数据库中，为进一步的分析和可视化做好准备。\n\n### 第 2 阶段：特征工程\n\nSimply Wall\
  \ St 识别与股票分析相关的关键数据特征，如收益、营收、市盈率、股息和内部交易活动。从第 1 阶段获得的原始数据中创建新变量。例如，从基础财务数据推导出增长率、估值指标和风险因素。所选和工程化的特征与业务目标对齐，并推导出\
  \ `Snowflake Analytics`，确保数据对于生成准确且有深见的股票分析具有相关性。\n\n### 第 3 阶段：模型设计\n\nSimply Wall\
