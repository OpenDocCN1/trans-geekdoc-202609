  \nprint(f\"\\nScikit-learn Verification:\")\nprint(f\"β1 (slope): {model.coef_[0]:.4f}\"\
  )\nprint(f\"β0 (intercept): {model.intercept_:.4f}\")\nprint(f\"R2: {r2_score(y,\
  \ y_pred_sklearn):.4f}\")\nprint(f\"MSE: {mean_squared_error(y, y_pred_sklearn):.4f}\"\
  )\n```\n\n除了上述步骤，我们还需要探索任何模型假设并测试模型的稳健性。\n\n```python\n# 统计分析\ncorrelation = np.corrcoef(X,\
  \ y)[0, 1]\nprint(f\"\\nStatistical Insights:\")\nprint(f\"Correlation coefficient:\
  \ {correlation:.4f}\")\nprint(f\"每额外增加一个房间，房价值增加 ${beta_1*100:.0f}\")\nprint(f\"\
  模型解释了 {r_squared*100:.1f}% 的方差\")\n\n# 残差分析\nresiduals = y - y_pred_manual\nprint(f\"\
  \\nResidual Analysis:\")\nprint(f\"Mean residual: {np.mean(residuals):.6f} (应接近\
