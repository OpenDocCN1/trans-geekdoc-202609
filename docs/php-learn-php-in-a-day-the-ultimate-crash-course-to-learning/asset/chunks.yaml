    \ “\\=\\>” operator. The precedence of this operator is the same as the precedence\
    \ of all assignment operators.\n\nIn addition to the basic assignment operator,\
    \ there are a number of “combined operators” that come in handy when we want to\
    \ use shorthand for binary arithmetic operations. Let’s say we have a variable$aequal\
    \ to some value. In a later part of the code we want to set$ato be the previous\
    \ value of$a plus some other value. To do that, we can write:\n\n![](images/00036.jpeg)\n\
    \nA simpler way of doing the above would be to use the combined operator for addition:\n\
    \n![](images/00037.jpeg)These combined operators work for all arithmetic operations\
    \ as well as for string concatenation. Here are a few examples:\n\n![](images/00038.jpeg)\n\
    \n#### Comparison Operators\n\nComparison operators allow us to compare two values.\
    \ Let’s take a look at a list of comparison operators.\n\n| Example || Name ||\
    \ Result |\n\n| --- | --- | --- |\n\n| $var == $var2 || Equal || Returns TRUE\
    \ if the two variables are equal. Type juggling will be implemented if necessary.\
    \ |\n\n| $var === $var2 || Identical || Returns TRUE if the two variables are\
    \ equal and of the same type. |\n\n| $var != $var2 || Not equal || Returns TRUE\
    \ if the two variables are not equal after type juggling. |\n\n| $var <> $var2\
    \ || Not equal || Returns TRUE if the two variables are not equal after type juggling.\
    \ |\n\n| $var!=\\= $var2 || Not identical || Returns TRUE if the two variables\
    \ are not equal or they are not of the same type. |\n\n| $var< $var2 || Less than\
    \ || Returns TRUE if the first variable is strictly less than the second. |\n\n\
    | $var> $var2 || Greater than || Returns TRUE if the first variable is strictly\
    \ greater than the second. |\n\n| $var<\\= $var2 || Less than or equal to || Returns\
    \ TRUE if the first variable is less than or equal to the second. |\n\n| $var\\\
    >\\= $var2 || Greater than or equal to || Returns TRUE if the first variable is\
    \ greater than or equal to the second. |\n\nIf you are comparing a string with\
    \ a number or the comparison is between numerical strings, the strings are converted\
    \ to numbers and the comparison is performed numerically.The type conversion is\
    \ not done when using\\==\\=or!=\\= as these operators check for type as well\
    \ as value.\n\n![](images/00039.jpeg)\n\nAnother conditional operator to be aware\
    \ of is the ternary operator. The ternary operator is essentially a short hand\
    \ for the if/else control structure (more on that later). The ternary operator\
    \ has the form(some conditional expression) ? {do this if true} : {do this if\
    \ false}. (The curly brackets are not used, they just there for clarity). Here\
    \ is an example of a ternary operator as you would use it in an application and\
    \ the corresponding if/else statement that it represents: \n\n![](images/00040.jpeg)\n\
    \nYou can see that using the ternary operator is a lot shorter than writing out\
    \ the entire if/else statement.\n\nThis concludes our overview of comparison operators.\
    \ We have not extensively covered the comparison between variables of different\
    \ types, but such information can be found in the PHP documentation available\
    \ online so we have decided not to include it. \n\n#### Error Control Operators\n\
    \nThe error control operator is something that should be used cautiously. In PHP,\
    \ the error control operator is the at sign (@). When an expression is prepended\
    \ with the error control operator, any error messages associated with that expression\
    \ that would normally be generated will be ignored.\n\nUsing this operator has\
    \ it’s downsides because if you prepend it to an expression that generates an\
    \ error that causes script termination, the script will stop without telling you\
    \ why, which is bad for debugging. \n\nWe will not go into examples of using the\
    \ error control operator, as you would rarely have to use it and should try to\
    \ form your code so that you do not rely on it.\n\n#### Incrementing and Decrementing\
    \ Operators\n\nThe incrementing and decrementing operators are the ones you would\
    \ see in C-style languages. These operators affect numbers and strings but not\
    \ arrays and objects. Decrementing NULL values has no effect, but incrementing\
    \ a NULL value results in 1.\n\nHere is a list of the incrementing and decrementing\
    \ operators.\n\n| Example || Name || Result |\n\n| --- | --- | --- |\n\n| ++$var\
    \ || Pre-increment || Increments the variable by one, then returns the value.\
    \ |\n\n| $var++ || Post-increment || Returns the value of the variable, then increments\
