- raw: "You can use theecho command to output strings to the screen. In fact,echo\
    \ can be used with any of the variable types to output their contents other than\
    \ thearrayandobject types. This is very useful tool for debugging and you should\
    \ often use it when you need to check something quickly or to find errors in your\
    \ code.\n\nOK, now imagine you want to input a string that contains a single quotation\
    \ mark. What do you think the output is going to be?\n\n![](images/00019.jpeg)\n\
    \nYou can probably tell even from the syntax highlighting that this is not going\
    \ to work. Every time PHP encounters a single quotation mark, it will either start\
    \ or end a string variable. In order to store a single quotation mark, we need\
    \ to escape it. In PHP, this is done using the backslash. The same thing will\
    \ happen if we want to include a backslash. We have to escape it with another\
    \ backslash:\n\n![](images/00020.jpeg)\n\nUseecho to see the results above. Keep\
    \ in mind that a backslash is used for escaping.(This means that\\\\n will not\
    \ render as a newline)\n\nAnother thing that cannot be used inside single quotation\
    \ marks is variables. For examples, the following will not expand inside of single\
    \ quotation marks.\n\n![](images/00021.jpeg)\n\nThis will not display “Her name\
    \ is Katherine” as you would expect.\n\nIn order to make the above example work,\
    \ we need to concatenate the variable and the string. In PHP we would do the following:\
    \ \n\n![](images/00022.jpeg)\n\nTest out the above code and confirm that it works.If\
    \ you want to continue the string after the variable, you just concatenate the\
    \ next string to the variable. In other words you use$str.’your string here’.\
    \ This works as long as the variable can be cast into a string (PHP does that\
    \ automatically for you in this case).\n\n#### Double quotes\n\nThis is the more\
    \ complex way of defining strings in PHP, but it gives you a lot more control\
    \ and flexibility. In the previous examples, we saw that \\\\n, \\\\t, \\\\r and\
    \ similar will not work in single quotes. This is not the case with double quotes.\
    \ Double quotes allow you to use those special symbols. \n\nThe most useful thing\
    \ about double quotes, however, is their ability to parse variables. There are\
    \ two ways to parse variables inside of double quotation marks.\n\n#####              \
    \ Simple variable parsing\n\nThe simple way to parse variables is by just using\
    \ the dollar sign inside of your string:\n\n![](images/00023.jpeg)\n\nYou can\
    \ use this same concept if you want to reference elements of an array. (You should\
    \ probably come back to this section after reading about the next variable type).\n\
    \n![](images/00024.jpeg)\n\n#####               Complex variable parsing\n\nThis\
    \ is called complex because it allows you to create more complex expressions,\
    \ not because the method itself is complex. This method requires you to use curly\
    \ braces around your variables.\n\n![](images/00025.jpeg)\n\nYou can expand this\
    \ and test it out on things such as arrays, objects and functions once you learn\
    \ about those.\n\n#### String casting\n\nAs with all other variables, we can cast\
    \ variables to strings. To do this you use the(string) function.  PHP will automatically\
    \ convert variables to strings depending on the scope of the expression and if\
    \ a string is required. For example, if you useecho on a variable, it will first\
    \ convert it to a string.Numbers will be converted to their textual representation.\
    \ This means that10will become“10”. Arrays and objects behave a bit differently,\
    \ though. If you useechoon anarray, you will get the string“Array”. Similarly,\
    \ if you use echo on an object, you will get the string“Object”.\n\n### Array\n\
    \nAn array is a type of ordered map. What this means is that arrays will associate\
    \ values to specific keys. Arrays in PHP can be used to represent dictionaries,\
    \ vectors, lists, stacks, queues, trees and multidimensional arrays (arrays of\
    \ arrays).\n\nArrays are created in the following way:\n\n![](images/00026.jpeg)\n\
    \nNote how we have used indentation for the sake of clarity. The extra whitespace\
    \ is ignored by PHP, but it makes our code easier to read and manage. \n\nEach\
    \ line of the array represents a key-value pair. Each line ends with a comma to\
    \ indicate the next key-value pair in the array. The last entry of the array does\
    \ not need to have a comma at the end of it, but most people like to include it.\
    \ This convention is adopted by many people dealing with content management systems\
    \ such as WordPress, Drupal and others. (The idea of leaving the comma is that\
    \ you can take the entire line of key-value pairs and move it around in the array\
    \ without having to worry about including a comma).\n\nThe keys of an array can\
    \ be either integers or strings. If you use something else for the array key,\
    \ it will automatically be cast into either of these types. (NOTE: arrays and\
    \ objects cannot be used as array keys as this will result in an error).\n\nAlternatively,\
    \ you do not need always need to supply the key. You can do the following:\n\n\
    ![](images/00027.jpeg)\n\nThis will create keys for you automatically by incrementing\
    \ each key, starting from 0. We can check the contents of the array:\n\n![](images/00028.jpeg)\n\
    \nYou can see that the first entry of the array starts from key 0. It is important\
    \ that you remember that the first value in an array with default keys is always\
    \ going to be stored under key 0.\n\nYou can reference elements of an array using\
    \ the square brackets.\n\n![](images/00029.jpeg)\n\nPlay around with this syntax\
    \ and try to create arrays of arrays (multidimensional arrays). In other words,\
    \ try to have an array as the value of some key. This looks like: \n\n![](images/00030.jpeg)\n\
    \nYou will get a chance to practice this in one of the exercises.\n\nIf you want\
    \ to create new elements to an existing array, or to modify elements of an existing\
    \ array you use the square bracket syntax:\n\n![](images/00031.jpeg)\n\nThe above\
    \ outputs:\n\n![](images/00032.jpeg)\n\n### Objects\n\nObjects will be an object\
    \ of discussion in Chapter 10 and we shall leave them for now.\n\n### NULL\n\n\
    The NULL value is special and it represents a variable with no value. The only\
    \ possible way of that happening is if the variable is assigned the constant NULL,\
    \ the variable has not been assigned a value yet, or if the variable has been\
    \ unset (remember the last example from the array section when we unset the value\
    \ of the 2nd entry).\n\n## Conclusion\n\nThis is the end of this chapter! You\
    \ learned a lot about PHP and how it works. You’ve taken your first steps, steps\
    \ that you will use over and over again when writing code. This chapter may have\
    \ been a little boring in some bits, but it is important you learn these basics\
    \ well so you can apply them without having to think about it later on. Here are\
    \ some exercises to get your gears going and get you thinking about using what\
    \ you’ve learned.\n\n#### Exercise 1\n\nYou are given the following array of user\
    \ data. Perform the specified manipulations to it:\n\n![](images/00033.jpeg)\n\
    \n1.  Create a string that consists of the first and last name of the user by\
    \ concatenating the values from the array. \n\n2.  Suppose that this array will\
    \ be stored into a database of other users. We want to make sure that all values\
    \ will be of the correct type. \n\n1.  Cast the user ID to a type of integer;\n\
    \n2.  Cast the admin field to a type of Boolean;\n\n4.  Add a new field with a\
    \ key of‘email’ and set it to the value of: ‘john.doe@example.com’. \n\n#### Exercise\
    \ 2"
