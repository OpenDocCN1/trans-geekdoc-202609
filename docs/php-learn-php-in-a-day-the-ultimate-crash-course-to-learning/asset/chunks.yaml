    # PHP 5 Destructors


    PHP 5 introduces a destructor concept similar to that of other object-oriented
    languages, such as C++. The destructor method will be called as soon as there
    are no other references to a particular object, or in any order during the shutdown
    sequence.


    ![](images/00138.jpeg)


    Like constructors, parent destructors will not be called implicitly by the engine.
    In order to run a parent destructor, one would have to explicitly call `parent::__destruct()`
    in the destructor body. Also like constructors, a child class may inherit the
    parent''s destructor if it does not implement one itself.


    The destructor will be called even if script execution is stopped using `exit()`.
    Calling `exit()` in a destructor will prevent the remaining shutdown routines
    from executing.


    ## Object Inheritance


    Inheritance is a well-established programming principle, and PHP makes use of
    this principle in its object model. This principle will affect the way many classes
    and objects relate to one another.


    For example, when you extend a class, the subclass inherits all of the public
    and protected methods from the parent class. Unless a class overrides those methods,
    they will retain their original functionality.


    This is useful for defining and abstracting functionality, and permits the implementation
    of additional functionality in similar objects without the need to reimplement
    all of the shared functionality.


    ![](images/00139.jpeg)

    ![](images/00140.jpeg)


    ## Scope Resolution Operator (::)


    The Scope Resolution Operator (also called Paamayim Nekudotayim) or, in simpler
    terms, the double colon, is a token that allows access to static, constant, and
    overridden properties or methods of a class.


    When referencing these items from outside the class definition, use the name of
    the class.


    As of PHP 5.3.0, it''s possible to reference the class using a variable. The variable''s
    value cannot be a keyword (e.g. `self`, `parent` and `static`).


    ![](images/00141.jpeg)


    Three special keywords `self`, `parent` and `static` are used to access properties
    or methods from inside the class definition.


    ![](images/00142.jpeg)


    When an extending class overrides the parent''s definition of a method, PHP will
    not call the parent''s method. It''s up to the extended class whether or not the
    parent''s method is called. This also applies to Constructors and Destructors,
    Overloading, and Magic method definitions.


    ![](images/00143.jpeg)


    ## Conclusion


    Let’s look at a few exercises for Classes and Objects before we close this book.


    ### Exercise 1


    In this PHP exercise, you will build the beginnings of a user registration form.
    To do this, you will create a class for making the select field, then use an object
    derived from the class in the form.


    First of all, write an array that includes browser types: Firefox, Chrome, Internet
    Explorer, Safari, Opera, Other.


    Then begin to write the class `Select`. You will need two properties, `$name`
    for the name of the select field, and `$value`, an array to provide the option
    values. You will also need four methods in addition to the two methods you will
    adapt: `setName`, `getName`, `setValue`, `getValue`. Checking to be sure the value
    is an array belongs in the `setValue` method, so write that here, and delete it
    from `makeSelect`.


    Now we come to the two functions you wrote to generate the select field. Change
    the `makeOptions` function to iterate over the array argument''s values rather
    than keys. This will be your fifth method. Then revise the `makeSelect` function
    to be the sixth method in your class.


    Next comes the HTML. Write a user registration form asking for name, username,
    email, browser. Use text fields to collect the user data for the first three,
    then instantiate an object based on your class for the select field. When the
    user clicks the submit button, return the data as confirmation.


    If you were creating a registration form to use on the Web, you would want to
    collect the data in a database. However, using PHP with mySQL or other databases
    is beyond the scope of this website.


    ### Exercise 2


    In the last PHP exercise, the `Select` class may have seemed like an awful lot
    of code to write for a simple select field. The real value of classes and objects
    doesn''t become apparent until you have reason to reuse the code. So this time,
    you will expand your user registration form to use several select fields.


    Assume that you have good reason to need data about your users'' browsing capabilities.
    Either you want to tune your site, the content of your site concerns these issues,
    or something similar. Using your select class, you can reuse the class code as
    often as you like to create select fields.


    To build this new version of the registration form, start with the script you
    wrote for Classes Ex. #1. Add the value of None as the first value in the `$browsers`
    array. Write two more arrays: `$speeds`, including values Unknown, DSL, T1, Cable,
    Dialup, Other; and `$os`, including Windows, Linux, Macintosh, Other. (Of course,
    these could be screen resolution or flash version or any other relevant capability.)


    You want data for how the user browses both at home and work. Above the browser
    select field, add the subheading Work Access, and rename the browser label Primary
    Browser. (We all know that many people use more than one.) Below that, add labels
    and select field objects for Connection Speed and Operating System. Next, add
    the subheading Home Access, with three new select fields corresponding to the
    ones you created for Work Access.


    Since you are using so many objects in this script, it''s a good idea to destroy
    each one after it has done its work. This will free up the memory the object occupied.


    When the user hits the submit button, return the user''s select field choices
    in two bulleted lists under the same headings (Work Access, Home Access).


    ### Exercise 3


    If you completed PHP Classes Ex. #1 and #2, you have now written a working user
    registration form. Time to tweak it and make it better.


    First of all, it would be preferable to have the message `--Select one--` at the
    top of each select field. Add a line to the `makeSelect()` method to accomplish
    this. The value should be `No response`. You won''t need the "None" value at the
    top of the `$browsers` array, so delete that. With this change to class `Select`,
    you can see how using a class can simplify your work. One line of code, and all
    the select fields update.


    Your user responses won''t be very useful without some basic information, so the
    next task is to make three of the fields required. Above the form, add `* Indicates
    required field`. Then add an asterisk to the Name, Username, and Email fields.


    Next, add code to validate the data in those three fields. This code will appear
    in the second half of the script, after you have retrieved data from the `$_POST[]`
    variable. The function `empty()` will let you know if there is data in the field.
    To help the user supply missing information, include a back button with the error
    message. (If you completed Forms Ex. #3, you have already written one of those.)


    The email field is a special case. Not only can you check for the presence of
    data, you can check for an `@` (at symbol), which would be included in any valid
    email address. So here the data must satisfy two conditions to be acceptable.
    You can use the `strpos()` function to confirm the presence of the `@` character.


    Congratulations! You did it. This was the last chapter in our PHP course. You
    should now be able to create your own applications and tackle all sorts of projects.
    We hope you enjoyed this book as much as we did writing it. Hopefully you found
    it useful and you took away some useful concepts and techniques.


    # Answers to Exercises


    These are the answers to exercises after each chapter. Keep in mind that many
    of these exercises can be solved in different ways, so your code does not need
    to be exactly like the one provided below to work properly. In many cases the
    code provided is just the general template from which you can develop your own
    code for the exercise.

    '
