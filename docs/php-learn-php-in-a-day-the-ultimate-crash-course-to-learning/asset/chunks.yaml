  trans: "\n\n# 前言\n\n## 1. 课程简介\n\n欢迎来到这门 PHP 入门课程。在整个课程中，您将学习在自己的项目中使用 PHP 的基础知识。您将接触到一些最常用的函数和方法，以及\
    \ PHP 的最佳实践。本课程将主要通过示例教学，强调“演示而非单纯讲述”的方法。我们将引导您了解不同的 PHP 应用真实案例，并解释过程中的每一步，以便您不仅理解我们*如何*编写应用程序，还理解*为什么*要以这种方式编写。\n\
    \n课程围绕不同的章节构建，每个章节侧重于 PHP 编程的一个特定方面。在每章结束时，都会有一个章节总结和一个章节练习，它们将测试您在该章迄今为止学到的所有技能，并建立在先前知识的基础之上。\n\
    \n您将在每一步都看到代码。代码很容易识别，因为它将与其余文本分开并采用不同的格式。以下是一个代码块的示例：\n\n![](img/00001.jpeg)\n\
    \n话不多说，让我们开始课程吧！\n\n# 第一章 – 简介、环境搭建与 “Hello World”\n\n## PHP 简介\n\nPHP 代表 **PHP:\
    \ Hypertext Preprocessor**（最初代表 Personal Home Page），是使用最广泛的 Web 编程语言之一（安装在超过 2.5\
    \ 亿个网站上）。它类似于 C 等语言。但让我们不要在历史参考上花费太多时间，直接开始工作吧！\n\n## 搭建我们的工作环境\n\n为了在本地计算机上开始使用\
    \ PHP，您需要安装一个开发环境。为什么要这样做？PHP 是一种服务端语言；因此，本质上您需要在计算机上安装一个“本地服务器”才能运行 PHP 代码。有许多提供\
    \ PHP 包的解决方案，但最常见的形式称为 LAMP 包。有许多适合不同操作系统的 LAMP 包。最常见的有：\n\n*   **XAMPP** – 一个包含\
    \ PHP、MySQL 和 Perl 的 Apache 发行版。支持 Windows、Linux 和 Mac；\n*   **WAMP** – 专为 Windows\
    \ 设计；\n*   **MAMP** – 专为 Mac 设计；\n\n挑选一个，在 Google 中输入名称，按照下载链接和说明操作，您就可以准备就绪了。\n\
    \n此外，您还需要某种文本编辑器。您可以找到许多免费和付费的程序。本课程使用的是 **Notepad++**。\n\n## 我们的第一个 PHP 文件\n\n\
    安装好 LAMP 包后，您无疑想创建您的第一个 PHP 文件。如果您还没有这样做，请确保 Apache 和 MySQL 处于激活状态。要检查这一点，请转到您的\
    \ LAMP 设置的控制面板，您应该会看到类似这样的内容：\n\n![](img/00002.jpeg)\n\n导航到您的 LAMP 包的安装目录。在我的例子中，它看起来像：`C:\\\
    xampp\\htdocs`。`htdocs` 是包含您所有网站的目录。通常，为了清晰起见，我喜欢在 `htdocs` 内部创建一个 `websites`\
    \ 目录并从那里工作。无论哪种情况，为您的网站创建一个新文件夹并给它命名。请尽量避免使用空格（改用 `_`）。在该文件夹内，创建一个 `index.php`\
    \ 文件。在文本编辑器中打开该文件并输入以下代码行：\n\n![](img/00003.jpeg)\n\n所有 PHP 代码都包裹在 PHP 标签（`<?php\
    \ ?>`）内。请注意，我们说的是所有 PHP *代码*，而不是所有 PHP *文件*。也就是说，您可以在 `.php` 文件中包含 HTML 等内容。更多相关内容将在另一章介绍。\n\
    \n在语法方面，还有一些规则需要牢记：\n\n*   在 PHP 中，每个语句都以分号结尾。\n*   **注释：**\n\n    PHP 中的注释可以是单行或多行。单行注释以两个反斜杠（`//`）开头。放在这些斜杠之后的任何内容都被视为注释，不会被编译器执行。多行注释以正斜杠和星号开头，以星号和正斜杠结尾（`/*\
    \ 注释内容 */`）。同样，编译器将忽略放在这些符号内的任何内容。\n\n    以下是代码中注释的示例：\n\n    ![](img/00004.jpeg)\n\
    \n    多行注释通常用于较长的代码块描述，而单行注释则用于（如上例所示）描述某一特定代码行的作用。多行注释对于调试也很有用。例如，如果您有一段代码无法按预期工作，您可以使用多行注释将其“注释掉”，并逐块测试以查看究竟哪里出了错。\n\
    \n    PHP 中没有强制规定您是否必须使用注释，但使用注释被认为是良好的实践。如果您打算与他人共享代码，您绝对应该（所谓绝对，是指*始终*！）使用注释。对您显而易见的事情，对另一位编码者可能并不明显。此外，即使您不打算共享代码，只是为自己编写某个文件，您仍然应该使用注释（即使注释不如共享时那样详尽）。您经常会发现自己需要重温旧代码，当那一刻到来时，您会希望能快速回忆起自己在做什么以及为什么这么做。虽然注释不给代码增加功能，但它们与您编写的代码同样重要，所以请不要忽视它们！\n\
    \n好了，扯远了，让我们回到第一个 PHP 文件。打开您选择的 Web 浏览器并输入以下 URL：`localhost/websites/your_folder_name_here/index.php`，如果您的新网站直接在\
    \ `htdocs` 文件夹中，则去掉 `websites`。\n\n您应该会在网页顶部看到显示的 “Hello World!” 字样。\n\n万岁！我们的第一个\
    \ PHP 文件完成了！但这不是很有趣，对吧？让我们继续第二章，在那里我们将学习 PHP 中不同类型的变量，并开始玩得更开心些！\n\n# 第二章 – 变量\n\
    \n## 变量简介\n\n### 基础\n\n在 PHP 中，变量使用美元符号（`$`）声明：\n\n![](img/00005.jpeg)\n\n这声明（或创建）了该变量。重要的是要注意，在创建变量之前，它被视为未设置。它不存在。这很直观，但正如我们稍后将看到的，这有时会导致一些意想不到的错误。\n\
    \n这里我们创建了一个字符串变量（注意我们不声明类型）。我们将在本章稍后查看不同的变量类型。\n\n### 规则\n\n在 PHP 中创建变量时，有一些规则需要牢记。我们将列出所有规则，之后再看展示这些规则的代码。以下是基本规则：\n\
    \n*   变量名必须以字母或下划线开头；\n*   变量名不能以数字开头；\n*   变量名可以包含任意数量的字母、下划线或数字；\n*   有效字母为\
    \ ASCII 十六进制 00 到 FF 之间的所有字母；\n\n让我们看一个声明变量的代码示例：\n\n![](img/00006.jpeg)\n\n如果我们测试该文件，将得到以下错误消息：\n\
    \n![](img/00007.jpeg)\n\n这告诉我们在声明变量时出现了错误。\n\n## 变量类型与类型转换\n\n"
