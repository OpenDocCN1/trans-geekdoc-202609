    # 第八章 – 会话与 Cookie


    ## 简介


    PHP 中的会话支持包含一种在后续访问中保留特定数据的方法。这使您能够构建更定制化的应用程序并增加您网站的吸引力。


    Cookie 常用于识别用户。Cookie 是服务器嵌入在用户计算机上的一个小文件。每当同一台计算机通过浏览器请求页面时，它也会发送该 Cookie。使用
    PHP，您可以创建和检索 Cookie 值。


    ## 会话


    会话是一种针对唯一会话 ID 为单个用户存储数据的简单方法。这可用于在页面请求之间持久化状态信息。会话 ID 通常通过会话 Cookie 发送给浏览器，并用于检索现有的会话数据。如果没有
    ID 或会话 Cookie，PHP 就会知道要创建一个新会话，并生成一个新的会话 ID。


    会话遵循一个简单的工作流程。当会话启动时，PHP 要么使用传递的 ID（通常来自会话 Cookie）检索现有会话，要么如果没有传递会话则创建一个新会话。会话启动后，PHP
    会用任何会话数据填充 `$_SESSION` 超全局变量。当 PHP 关闭时，它会自动获取 `$_SESSION` 超全局变量的内容，将其序列化，并使用会话保存处理器将其发送进行存储。


    默认情况下，PHP 使用由 `session.save_handler` 设置的内部 files 保存处理器。这会在 `session.save_path`
    配置指令指定的位置将会话数据保存在服务器上。


    可以使用 `session_start()` 函数手动启动会话。如果 `session.auto_start` 指令设置为 1，会话将在请求启动时自动开始。


    当 PHP 完成脚本执行时，会话通常会自动关闭，但也可以使用 `session_write_close()` 函数手动关闭。


    ![](img/00112.jpeg)


    ![](img/00113.jpeg)


    > **警告**

    >

    > 请勿使用 `unset($_SESSION)` 取消设置整个 `$_SESSION`，因为这将禁用通过 `$_SESSION` 超全局变量注册会话变量。


    ### 传递会话 ID


    有两种方法来传播会话 ID：


    *   Cookie

    *   URL 参数


    会话模块支持这两种方法。Cookie 是最佳选择，但因为它们并不总是可用，所以我们也提供了一种替代方式。第二种方法将会话 ID 直接嵌入到 URL 中。


    PHP 能够透明地转换链接。除非您使用的是 `PHP 4.2.0` 或更高版本，否则在构建 PHP 时需要手动启用它。在 Unix 下，向 configure
    传递 `--enable-trans-sid`。如果启用了此构建选项和运行时选项 `session.use_trans_sid`，相对 URI 将自动更改为包含会话
    ID。


    或者，您可以使用常量 `SID`，如果会话已启动则会定义该常量。如果客户端未发送适当的会话 Cookie，它的形式为 `session_name=session_id`。否则，它将展开为空字符串。因此，您可以无条件地将其嵌入到
    URL 中。


    以下示例演示了如何注册一个变量，以及如何使用 `SID` 正确链接到另一个页面。


    ![](img/00114.jpeg)


    ### 自定义会话处理器


    要实现数据库存储或任何其他存储方法，您需要使用 `session_set_save_handler()` 创建一组用户级存储函数。自 PHP 5.4.0 起，您可以使用
    `SessionHandlerInterface` 创建会话处理器，或通过继承 `SessionHandler` 来扩展内部 PHP 处理器。


    `session_set_save_handler()` 中指定的回调是在会话生命周期期间由 PHP 调用的方法：`open`、`read`、`write`
    和 `close`，以及用于维护任务的：用于删除会话的 `destroy` 和用于定期垃圾回收的 `gc`。


    因此，PHP 总是需要会话保存处理器。默认通常是内部的 ''files'' 保存处理器。可以使用 `session_set_save_handler()`
    设置自定义保存处理器。PHP 扩展也提供了替代的内部保存处理器，例如 `sqlite`、`memcache` 和 `memcached`，可以通过 `session.save_handler`
    进行设置。


    当会话启动时，PHP 将在内部调用 `open` 处理器，随后是 `read` 回调，后者应准确返回最初为存储而传递的编码字符串。一旦 `read` 回调返回编码字符串，PHP
    将对其解码，然后将生成的数组填充到 `$_SESSION` 超全局变量中。


    当 PHP 关闭时（或调用 `session_write_close()` 时），PHP 将在内部对 `$_SESSION` 超全局变量进行编码，并将其连同会话
    ID 一起传递给 `write` 回调。`write` 回调完成后，PHP 将在内部调用 `close` 回调处理器。


    当会话被专门销毁时，PHP 将使用会话 ID 调用 `destroy` 处理器。


    PHP 会不时调用 `gc` 回调，根据会话设置的最大生存期来过期任何会话记录。此例程应删除所有持久存储中最后访问时间超过 `$lifetime` 的记录。


    ## Cookie


    PHP 透明地支持 HTTP Cookie。Cookie 是一种在远程浏览器中存储数据的机制，从而用于跟踪或识别回头用户。您可以使用 `setcookie()`
    或 `setrawcookie()` 函数设置 Cookie。Cookie 是 HTTP 头部的一部分，因此 `setcookie()` 必须在任何输出发送到浏览器之前调用。这与
    `header()` 具有相同的限制。您可以使用输出缓冲函数来延迟脚本输出，直到您决定是否设置任何 Cookie 或发送任何头部。


    ## 练习


    ### 练习 1


    在下一个 PHP 练习中，您将请求用户输入，然后将用户的响应从一个文件移动到另一个文件并对其进行处理。


    创建两个单独的文件。第一个文件将包含一个表单，其中有一个输入字段询问用户最喜欢的城市。对表单使用 `post` 方法。虽然此文件不包含 PHP 代码，但在我的本地主机上，它需要
    `.php` 扩展名才能成功调用第二个文件。


    第二个文件将包含处理用户响应的 PHP 代码。（在这种情况下，处理非常简单。）用户单击提交按钮后，回显 `Your favorite city is $city.`，其中
    `$city` 是来自表单的输入。


    > **提示：** 包含用户输入的变量是一个数组。数组将在未来的练习中讲解，但这个特定的数组需要在这里发挥作用。该数组变量是 `$_POST[''name'']`，其中
    `''name''` 是您的输入字段的名称。


    ### 练习 2


    使用 PHP 可以做的一件非常有用的事情是，使用条件语句告诉 PHP 显示哪一个，将用户输入请求和响应包含在同一个文件中。对于这个 PHP 练习，使用 `if-else`
    条件语句将上一个练习的两个文件重写为一个文件。


    > **提示：** 您需要某种方法来判断表单是否已提交。用于确定变量是否已设置且不为 null 的函数是 `isset()`。


    ### 练习 3


    对于这个 PHP 练习，您将使用与上一个练习相同的格式，通过 PHP `if-else` 语句的魔力，在第一部分请求输入，在第二部分进行响应。在第一部分，给用户一个输入字段并要求他们输入一周中的某一天。


    对于第二部分，您将需要以下诗歌：


    > 周一笑，笑出危险。

    >

    > 周二笑，亲吻陌生人。

    >

    > 周三笑，笑出信件。

    >

    > 周四笑，会有更好事。

    >

    > 周五笑，笑出悲伤。

    >

    > 周六笑，明天快乐。


    使用 `else-elseif-else` 结构，根据用户输入的日期设置每行作为响应输出，对于诗歌中没有的任何输入给出通用响应。


