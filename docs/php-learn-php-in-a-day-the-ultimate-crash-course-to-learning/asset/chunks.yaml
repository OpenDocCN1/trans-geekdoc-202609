    You picked: {name of meal here (in bold)}.


    This meal is made from: {list ingredients here (comma-separated list)}.


    The nutritional information for this meal is: {list nutritional information here
    (comma-separated list)}.


    Do not use loops! Use the aforementioned string functions to do this.


    #### Exercise 2


    This PHP exercise has two parts. For the first, you will create a function to
    accept two arguments, perform a calculation using them, then return a sentence
    with the result to the browser. The function will calculate the area of a rectangle,
    with the two arguments being width and height. (Reminder: area = width \* height.)
    The sentence to be returned is "A rectangle of length $l and width $w has an area
    of $area.", where $l and $w are the arguments and $area is the result.


    #### Exercise 3


    For this PHP exercise, first create an array called `$months`. Use the names of
    the months as keys, and the number of days for each month as values. For February,
    use the following for your value: "28 days, if leap year 29".


    Next, write a function to create an option element for a form''s select field.
    Make sure each option will be upper case. Both the array and the function should
    precede the HTML for the page.


    Once again, you will be requesting user input. Create a form for the user with
    the request, "Please choose a month." Next, provide a select field with the months
    as options, looping through the array you created and using the function to create
    the option elements.


    When the user clicks the submit button, return the statement "The month of $month
    has $number days.", where $month is the name of the month the user chose, and
    $number is the number of days. Be sure to include a different response for February.


    # Chapter Six – Databases


    ## Introduction


    In this chapter we will begin our discussion of using databases inside of our
    PHP applications. For this we will be using the MySQL database engine and the
    PHPMyAdmin interface that comes with your LAMP package of choice. We assume you
    have those installed and activated and are ready to continue.


    To be able to manipulate databases, we will be using the `mysqli` API provided
    with PHP version 5 and later as well as the `PDO` abstraction layer. Let’s start
    by looking into what APIs are. Some of the following content is referenced directly
    from the PHP Manual.


    ## What is an API?


    An API (Application Programming Interface) defines the classes, methods, functions
    and variables that your application will need to call in order to carry out a
    desired task. In the case of PHP applications that need to communicate with databases
    the necessary APIs are usually exposed via PHP extensions.


    APIs can be procedural or object-oriented. With a procedural API you call functions
    to carry out tasks, with the object-oriented API you instantiate classes and then
    call methods on the resulting objects. Of the two the latter is usually the preferred
    interface, as it is more modern and leads to better organized code.


    We have not yet covered OOP (object-oriented programming) in PHP, so if you are
    not familiar with the concept, you can skip to chapter 10 of this book and then
    return to this chapter after you have gotten a hang of OOP!


    There are several APIs available that will allow you to connect to the MySQL server.
    We will have a discussion of the options and which to choose depending on your
    application.


    ### Connectors


    MySQL provides documentation that explains all its terms. The term connector refers
    to a piece of software that allows your application to connect to the MySQL database
    server. MySQL has a variety of connectors depending on your language, including
    connectors for PHP.


    When your application requires a database, you need to write your code to perform
    activities such as connecting to the database server, querying the database, updating
    the database, removing entries and other database-related functions. Software
    is required to provide the API that your PHP application will use, and also handle
    the communication between your application and the database server, possibly using
    other intermediate libraries where necessary. This software is known generically
    as a connector, as it allows your application to connect to a database server.


    ### Drivers


    A driver is a piece of software designed to communicate with a specific type of
    database server. The driver may also call a library, such as the MySQL Client
    Library or the MySQL Native Driver. These libraries implement the low-level protocol
    used to communicate with the MySQL database server.


    By way of an example, the PHP Data Objects (PDO) database abstraction layer may
    use one of several database-specific drivers. One of the drivers it has available
    is the PDO MYSQL driver, which allows it to interface with the MySQL server.

