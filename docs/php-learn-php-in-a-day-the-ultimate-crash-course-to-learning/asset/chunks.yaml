    在这种情况下，变量 `$var` 可以被包含在 `functions.php` 内部的任何代码使用。然而，当我们创建自己的函数时，变量的上下文会发生变化。


    在用户定义的函数中，引入了局部函数作用域。默认情况下，函数内部使用的任何变量都被限制在局部函数作用域内。例如：


    ![](img/00074.jpeg)


    此脚本不会产生任何输出，因为 `echo` 语句引用的是 `$a` 变量的局部版本，且在此作用域内未被赋值。你可能会注意到，这与 C 语言略有不同，在 C
    语言中，全局变量自动对函数可用，除非被局部定义特意覆盖。这可能会导致一些问题，即人们可能会无意中更改全局变量。在 PHP 中，如果全局变量将在函数中使用，则必须在函数内部声明为
    global。


    让我们看看如何将变量声明为全局变量。


    ![](img/00075.jpeg)


    ## 预定义函数


    PHP 内置了许多预定义函数，这正是 PHP 高效且实用的原因。我们不可能检查所有的 PHP 函数，因为那本身就需要另一本书（目前，PHP 文档列出了 9457
    个内置函数）。让我们从可以在 PHP 内部使用的最基本函数开始。


    ### Echo、Print、exit、die


    #### Echo


    `Echo` 是 PHP 中允许我们输出字符串数据的语言结构。PHP 会自动将数值变量转换为字符串。我们已经在本书前面的示例中使用过 `echo`，所以你现在应该已经熟悉这个函数了。


    #### Print


    `Print` 是另一个执行与 `echo` 相同操作的语言结构，但它更古老且稍慢一些。因此，通常最好使用 `echo`。


    一个与 print 不完全相关但名称足够相似以至于我们将其放在此处的函数是 `print_r()` 函数。此函数允许我们将数组的内容打印到屏幕上。


    #### Exit 和 Die


    这些函数允许你向屏幕打印一条消息并终止脚本。这两个函数是等效的，你可以使用其中任意一个。两者的语法均为：


    ![](img/00076.jpeg)


    ### 字符串函数


    PHP 附带了大量用于字符串操作的函数。


    #### 单词计数


    PHP 自带一个预建函数，可为你计算字符串中的单词数量。其形式如下：


    ![](img/00077.jpeg)


    该函数的第二个参数是可选的，可接受 3 个值。以下是支持的值及各自返回的结果：


    *   **0** - 返回找到的单词数量

    *   **1** - 返回一个包含在 `string` 中找到的所有单词的数组

    *   **2** - 返回一个关联数组，其中键是单词在 `string` 内的数字位置，值是单词本身


    该函数还接受一个我们在此未指定的第三个可选参数。第三个参数是一个字符列表，指定你希望被视为单词的额外字符。你只需将符号紧挨着放在一个字符串中，无需其他格式。


    #### 字符串打乱


    此函数允许你随机打乱字符串内部的字符。如果你想为文件创建伪唯一名称或类似用途，这非常方便。


    ![](img/00078.jpeg)


    #### 替换字符串的部分


    PHP 有许多不同的函数可以帮助你完成此任务。最简单的是 `str_replace()` 函数。其形式为：


    ![](img/00079.jpeg)


    参数可以是字符串或数组。如果 `needle` 和 `replacement` 都是数组，则 `str_replace()` 从每个数组中取一个值，并用它们在
    `haystack` 中进行搜索和替换。如果 `replacement` 的值少于 `needle`，则其余替换值使用空字符串。如果 `needle` 是数组而
    `replacement` 是字符串，则此替换字符串用于 `haystack` 的每个值。反之则讲不通。


    可以传递一个可选的第四个参数，它将被设置为执行的替换次数。


    `str_replace` 函数有一个变体，可不区分大小写地进行替换。换句话说，它将执行不区分大小写的替换。此函数称为 `str_ireplace`，接受相同的参数。


    #### 字符串长度


    PHP 中有许多函数可返回字符串的长度。最简单易用的是以下函数：


    ![](img/00080.jpeg)


    另一个可用于此目的的函数是 `mb_strlen()`；


    ![](img/00081.jpeg)


    此函数有一个可选参数，即字符串的编码。例如，如果你想将编码设置为 UTF-8，只需提供字符串 `''UTF-8''`。PHP 支持多种编码类型，你可以通过访问
    PHP 官方手册轻松找到它们。


    计算字符数量的另一种方法是使用 `iconv_strlen()` 函数。它的工作方式与 `mb_strlen()` 函数非常相似，接受相同的参数，只不过在处理字符串中的错误序列时要严格得多。


    之所以有不同的函数，是因为它们实际上计算的东西不同。`strlen()` 计算字符串内的字节数。通常一个字符等于一个字节，但并非总是如此。这就是其他函数存在的原因。


    有时你会发现字符串末尾有不需要的空白字符。要去除字符串两侧的空白字符，可以使用 `trim()` 函数。`trim()` 函数的一个有用特性是，它不仅可以修剪空白字符，还可以修剪你指定的任何额外字符。或者，如果你只想从左侧或右侧修剪，可以使用
    `ltrim()` 和 `rtrim()` 函数。


    ![](img/00082.jpeg)


    #### 在字符串中查找子字符串


    返回字符串一部分的最简单方法是使用 `substr()` 函数。此函数接受两个必需参数和一个可选参数。第一个参数是你要引用的字符串。第二个参数是字符串部分的起始位置。此参数可以是正数或负数。如果为正数，返回的字符串将从主字符串内的指定位置开始。如果为负数，返回的字符串将从主字符串的末尾开始。第三个参数是可选的，即你想要返回的字符串长度。它也可以是正数或负数。如果为正数，返回的字符串将最多包含该数量的字符。如果值为负数，该值指定从主字符串中省略多少个字符。以下是示例：


    ![](img/00083.jpeg)


    如果你想查找一个字符串在另一个字符串中出现的次数，可以使用 `substr_count()` 函数。此函数接受两个必需参数和两个可选参数。以下是该函数的语法以及一些在你自己的代码中使用它的示例：


    ![](img/00084.jpeg)


    第一个参数是要检查的字符串。第二个参数是要搜索的字符串。第三个参数指定在字符串的何处开始搜索。第三个参数指定搜索的长度。


    ![](img/00085.jpeg)


    另一个在较大字符串中查找子字符串的函数是 `strpos()` 函数。此函数查找一个字符串在另一个字符串中首次出现的位置。让我们看看该函数的语法以及几个不同的示例来理解它：


    ![](img/00086.jpeg)


    第一个参数是要检查的字符串。第二个参数是要搜索的字符串。第三个参数指定在字符串的何处开始搜索。


    ![](img/00087.jpeg)

