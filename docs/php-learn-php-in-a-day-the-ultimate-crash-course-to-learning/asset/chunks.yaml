    # 第六章 – 数据库


    ## 简介


    在本章中，我们将开始讨论在 PHP 应用程序中使用数据库。为此，我们将使用 MySQL 数据库引擎以及你所选 LAMP 包附带的 PHPMyAdmin 界面。我们假设你已安装并激活了它们，准备继续学习。


    为了能够操作数据库，我们将使用 PHP 5 及更高版本提供的 `mysqli` API 以及 `PDO` 抽象层。让我们首先了解什么是 API。以下部分内容直接引用自
    PHP 手册。


    ## 什么是 API？


    API（应用程序编程接口）定义了你的应用程序为了执行期望任务而需要调用的类、方法、函数和变量。在需要与数据库通信的 PHP 应用程序中，必要的 API 通常通过
    PHP 扩展暴露。


    API 可以是过程式的，也可以是面向对象的。使用过程式 API 时，你调用函数来执行任务；使用面向对象 API 时，你实例化类，然后在生成的对象上调用方法。两者中，后者通常是首选接口，因为它更现代，且能带来更有条理的代码。


    我们尚未在本书中介绍 PHP 的 OOP（面向对象编程），因此如果你不熟悉该概念，可以跳到第 10 章，掌握 OOP 后再返回本章！


    有多种可用的 API 允许你连接到 MySQL 服务器。我们将讨论这些选项，以及如何根据你的应用程序进行选择。


    ### 连接器


    MySQL 提供了解释其所有术语的文档。术语“连接器”指允许你的应用程序连接到 MySQL 数据库服务器的软件。MySQL 根据你的语言提供多种连接器，包括用于
    PHP 的连接器。


    当你的应用程序需要数据库时，你需要编写代码来执行诸如连接数据库服务器、查询数据库、更新数据库、删除条目和其他数据库相关功能等活动。需要软件来提供你的 PHP
    应用程序将使用的 API，并处理你的应用程序与数据库服务器之间的通信，在必要时可能使用其他中间库。这种软件通用地称为连接器，因为它允许你的应用程序连接到数据库服务器。


    ### 驱动程序


    驱动程序是一种设计用于与特定类型的数据库服务器通信的软件。驱动程序也可能调用一个库，例如 MySQL 客户端库或 MySQL 原生驱动程序。这些库实现了用于与
    MySQL 数据库服务器通信的低级协议。


    举个例子，PHP 数据对象 (PDO) 数据库抽象层可能会使用几种特定于数据库的驱动程序之一。它可用的驱动程序之一是 PDO MYSQL 驱动程序，它允许
    PDO 与 MySQL 服务器进行交互。

