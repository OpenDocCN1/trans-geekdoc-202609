    The `fclose()` function is used to close an open file.


    The `fclose()` requires the name of the file (or a variable that holds the filename)
    we want to close:


    > **Tip!**

    >

    > It''s a good programming practice to close all files after you have finished
    with them. You don''t want an open file running around on your server taking up
    resources!


    ### PHP Create File


    The `fopen()` function is also used to create a file. Maybe a little confusing,
    but in PHP, a file is created using the same function used to open files.


    If you use `fopen()` on a file that does not exist, it will create it, given that
