    # Chapter Nine – File Handling


    ## Introduction


    File handling is an important part of all web applications. You will sometimes
    find it necessary to open and process a file or files for different reasons and
    tasks. With that being said, we must issue a word of caution. When you are manipulating
    files you must be very careful. You can do a lot of damage if you do something
    wrong. Common errors are: editing the wrong file, filling a hard-drive with garbage
    data, and deleting the content of a file by accident.


    ## File Handling


    ### Reading Files


    The `readfile()` function reads a file and writes it to the output buffer.


    Assume we have a text file called "webdictionary.txt", stored on the server, that
    looks like this:


    ![](images/00120.jpeg)


    The PHP code to read the file and write it to the output buffer is as follows
    (the `readfile()` function returns the number of bytes read on success):


    ![](images/00121.jpeg)


    ### Opening files


    A better method to open files is with the `fopen()` function. This function gives
    you more options than the `readfile()` function.


    We will use the text file, "webdictionary.txt", during the lessons:


    The first parameter of `fopen()` contains the name of the file to be opened and
    the second parameter specifies in which mode the file should be opened. The following
    example also generates a message if the `fopen()` function is unable to open the
    specified file:


    ![](images/00122.jpeg)


    | Modes | Description |

    | --- | --- |

    | r | Open a file for read only. File pointer starts at the beginning of the file
    |

    | w | Open a file for write only. Erases the contents of the file or creates a
    new file if it doesn''t exist. File pointer starts at the beginning of the file
    |

    | a | Open a file for write only. The existing data in file is preserved. File
    pointer starts at the end of the file. Creates a new file if the file doesn''t
    exist |

    | x | Creates a new file for write only. Returns FALSE and an error if file already
    exists |

    | r+ | Open a file for read/write. File pointer starts at the beginning of the
    file |

    | w+ | Open a file for read/write. Erases the contents of the file or creates
    a new file if it doesn''t exist. File pointer starts at the beginning of the file
    |

    | a+ | Open a file for read/write. The existing data in file is preserved. File
    pointer starts at the end of the file. Creates a new file if the file doesn''t
    exist |

    | x+ | Creates a new file for read/write. Returns FALSE and an error if file already
    exists |


