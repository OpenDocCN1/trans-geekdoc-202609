- raw: "Write a script using one variable “$whatsit” to print the following to the\
    \ browser. Your echo statements may include no words except “Value is”. In other\
    \ words, use the function that will output the variable type to get the requested\
    \ text. Use simple HTML to print each statement on its own line and add a relevant\
    \ title to your page. Include line breaks in your code to produce clean, readable\
    \ HTML.\n\nValue is string.\n\nValue is double.\n\nValue is boolean.\n\nValue\
    \ is integer.\n\nValue is NULL.\n\n# Chapter Four – Control Structures\n\n## Introduction\n\
    \nPHP scripts are built out of a series of statements. A statement can be an assignment,\
    \ a function call, a loop, a conditional statement or even empty statements. Statements\
    \ can be grouped into statement groups by encapsulating them with curly braces.\
    \ A statement group is considered a statement itself.\n\nIn this chapter we will\
    \ observe the behavior of different types of statements.\n\n## If statements\n\
    \n### If Statements\n\nThe “if” statement is one of the most important structures\
    \ inside any language.This control structure allows you to have conditional execution\
    \ of code fragments. PHP’s “if” structure is similar to that of C. That is, each\
    \ if statement at its most basic looks likeif (expression) statement. The expression\
    \ is evaluated to its Boolean value. If the expression is TRUE, PHP will execute\
    \ the statement. If it is FALSE, it will not execute it. A simple example is:\n\
    \n![](images/00045.jpeg)\n\nVery often you would need to execute more than one\
    \ statement if a certain condition is true. You don’t need to wrap each statement\
    \ in its own if clause. Instead, you can use curly braces to wrap the code you\
    \ want to be executed conditionally. \n\n![](images/00046.jpeg)\n\nYou can even\
    \ take it one step further and nest if statements inside of other if statements.\n\
    \n### If Else Statements\n\nIn some cases you want to execute a piece of code\
    \ when a condition is met and a different piece of code if that condition is not\
    \ met.  In that case, you would have to use andif-elsestatement.else extends an\
    \ if statement to execute an expression if the statement evaluates to FALSE. Here\
    \ is an example that extends the one above:\n\n![](images/00047.jpeg)\n\n### If-else\
    \ if-else statement\n\nThis is yet another modification to theifstatement and\
    \ it presents the most generalized form of an if statement. It includes andifstatement\
    \ that executes a block of code if the statement if TRUE. After thisifstatement,\
    \ you have a number ofelseif statements. Each else if statement has a condition\
    \ associated with it and a block of code to be executed if true. The block of\
    \ code is executed only if the condition evaluates to true. After all of theelseifstatements\
    \ there is a closingelsestatement. You can think of this as a kind of default\
    \ case. If none of the conditions evaluate to true, theelse statement will be\
    \ executed. Here is an example: \n\n![](images/00048.jpeg)\n\nKeep in mind that\
    \ as soon as a condition is evaluated to TRUE, the script executes the associated\
    \ block of code and breaks out of the if-elseif-else structure and will not go\
    \ down to any of the other conditions. That is, only one condition will be executed\
    \ when using an if-elseif-else.A structure that is related to the if-elseif-else\
    \ structure is theswitch statement which is the subject of discussion next.\n\n\
    ## Switch\n\nThe switch statement is similar to a bunch ofif statements operating\
    \ on the same variable. Imagine you have some variable that can take some values.\
    \ In your code, you want to compare if that variable corresponds to some specific\
    \ values. For each value, there is a code segment that has to be executed. Also,\
    \ if the variable does not meet any of those cases, you want to execute some default\
    \ piece of code. You could do this using a long if-elseif-else structure, but\
    \ you could also do it using aswitch statement.\n\nA switch statement does the\
    \ same thing as an if-else-if structure, but saves you some typing. The syntax\
    \ for a switch statement is:\n\n![](images/00049.jpeg)\n\nYou can have as many\
    \ cases as you need for your code. An important thing to keep in mind is the presence\
    \ of thebreakstatement. Thebreakcommand breaks you out of the current structure\
    \ or loop you are in. If you did not have the break command inside each case,\
    \ PHP would go through each case. That is, PHP checks the variable against each\
    \ case and executes the specified code within if the comparison returns TRUE.\
    \ If PHP does not encounter abreak command, it continues to the next case and\
    \ executes the specific code if the comparison of that case returns TRUE.This\
    \ is one of the differences between using anif-elseif-elsestructure and aswitch\
    \ statement.\n\nLet’s take a look at an example comparison between theif-elseif-elsestructure\
    \ and theswitch statement:\n\n![](images/00050.jpeg)\n\nThat’s pretty much all\
    \ there is to switch statements. Learn how to utilize them and you will make your\
    \ life faster than having to write out all of the if-else statements.\n\n## Alternate\
    \ syntax to control structures\n\nBefore going on to each of the other control\
    \ structures, let’s take a moment to go to over the alternate syntax that PHP\
    \ offers us for control structures. PHP offers us an alternative syntax for some\
    \ of the control structures. These are:if,while,for,foreachandswtich. In each\
    \ case, the basic form of the alternate syntax is to change the opening brace\
    \ to a colon and the closing brace to anendif;,endwhile;,endfor;,endforeach;,\
    \ orendswitch;, respectively (basically end with the name of the control structure\
    \ appended.). What this allows us to do is break out of PHP in order to include\
    \ for HTML, for example. \n\nWe haven’t really talked much about including HTML\
    \ inside of your PHP scripts, but it is actually a really easy concept. One way\
    \ to include the HTML is to save the HTML string to a variable and thenechoorprint\
    \ that variable. In fact, this is a method that you are going to find yourself\
    \ using quite often. This method, however, has its shortcomings. For example,\
    \ imagine you want to create a table that is not dynamically generated (that is,\
    \ you are not using PHP to generate the table rows for you). The table has a specific\
    \ layout and you want to include the value of some PHP variable inside one of\
    \ the cells for example. If you try to write that inside a variable, you will\
    \ find that it is very tedious and not efficient. (Unless for some reason you\
    \ need to store that HTML in a variable, in that case you are stuck using the\
    \ HTML to variable method). You can break out of PHP and then break back into\
