    在处理数组时，使用 `=>` 运算符将值赋给命名键。该运算符的优先级与所有赋值运算符的优先级相同。


    除了基本赋值运算符外，还有一些“组合运算符”，当我们想对二元算术运算使用简写时，它们非常方便。假设我们有一个变量 `$a` 等于某个值。在代码的后续部分，我们想将
    `$a` 设为 `$a` 之前的值加上另一个值。为此，我们可以编写：


    ![](img/00036.jpeg)


    一种更简单的方法是使用加法的组合运算符：


    ![](img/00037.jpeg)


    这些组合运算符适用于所有算术运算以及字符串连接。以下是一些示例：


    ![](img/00038.jpeg)


    ### 比较运算符


    比较运算符允许我们比较两个值。让我们看一下比较运算符列表。


    | 示例 | 名称 | 结果 |

    | --- | --- | --- |

    | `$var == $var2` | 相等 | 如果两个变量相等，返回 TRUE。如有必要将进行类型转换。 |

    | `$var === $var2` | 全等 | 如果两个变量相等且类型相同，返回 TRUE。 |

    | `$var != $var2` | 不相等 | 如果两个变量在类型转换后不相等，返回 TRUE。 |

    | `$var <> $var2` | 不相等 | 如果两个变量在类型转换后不相等，返回 TRUE。 |

    | `$var !== $var2` | 不全等 | 如果两个变量不相等或类型不同，返回 TRUE。 |

    | `$var < $var2` | 小于 | 如果第一个变量严格小于第二个，返回 TRUE。 |

    | `$var > $var2` | 大于 | 如果第一个变量严格大于第二个，返回 TRUE。 |

    | `$var <= $var2` | 小于或等于 | 如果第一个变量小于或等于第二个，返回 TRUE。 |

    | `$var >= $var2` | 大于或等于 | 如果第一个变量大于或等于第二个，返回 TRUE。 |


    如果您将字符串与数字进行比较，或者比较涉及数字字符串，则字符串会被转换为数字，并按数值进行比较。使用 `===` 或 `!==` 时不会进行类型转换，因为这些运算符同时检查类型和值。


    ![](img/00039.jpeg)


    另一个需要注意的条件运算符是三元运算符。三元运算符本质上是 `if/else` 控制结构的简写形式（稍后详述）。三元运算符的形式为 `(某个条件表达式) ?
    {为真时执行此操作} : {为假时执行此操作}`。（花括号并不使用，只是为了清晰起见）。以下是三元运算符在应用中的使用示例及其所代表的相应 `if/else`
    语句：


    ![](img/00040.jpeg)


    您可以看到，使用三元运算符比写出完整的 `if/else` 语句要短得多。


    这结束了我们对比较运算符的概述。我们没有广泛涵盖不同类型变量之间的比较，但此类信息可在网上的 PHP 文档中找到，因此我们决定不将其包含在内。


    ### 错误控制运算符


    错误控制运算符应谨慎使用。在 PHP 中，错误控制运算符是 at 符号（`@`）。当表达式前面加上错误控制运算符时，该表达式通常会产生的任何错误消息都将被忽略。


    使用此运算符有其缺点，因为如果您将其加在一个导致脚本终止的错误表达式前，脚本将在不告诉您原因的情况下停止，这不利于调试。


    我们将不介绍错误控制运算符的使用示例，因为您很少需要使用它，并且应尽量编写代码以避免依赖它。


    ### 自增和自减运算符


    自增和自减运算符是您在 C 风格语言中会看到的运算符。这些运算符影响数字和字符串，但不影响数组和对象。自减 `NULL` 值无效果，但自增 `NULL` 值结果为
    1。


    以下是自增和自减运算符列表。


    | 示例 | 名称 | 结果 |

    | --- | --- | --- |

    | `++$var` | 前置自增 | 将变量加一，然后返回值。 |

    | `$var++` | 后置自增 | 返回变量的值，然后将变量加一。 |

    | `--$var` | 前置自减 | 将变量减一，然后返回值。 |

    | `$var--` | 后置自减 | 返回变量的值，然后将变量减一。 |


    让我们看几个示例来说明它们如何工作：


    ![](img/00041.jpeg)


    我们也可以自增字符。但不能自减字符。


    ![](img/00042.jpeg)


    ### 逻辑运算符


    PHP 支持逻辑运算符，允许我们评估逻辑语句。以下是逻辑运算符列表：


    | 示例 | 名称 | 结果 |

    | --- | --- | --- |

    | `$a and $b` | 逻辑与 | 如果两个变量都为 true，返回 TRUE。 |

    | `$a or $b` | 逻辑或 | 如果两个变量中任意一个为 true，返回 TRUE。 |

    | `$a xor $b` | 逻辑异或 | 如果两个变量中任意一个为 true，但不同时为 true，返回 TRUE。 |

    | `!$a` | 逻辑非 | 如果变量不为 TRUE，返回 TRUE。 |

    | `$a && $b` | 逻辑与 | 如果两个变量都为 true，返回 TRUE。 |

    | `$a || $b` | 逻辑或 | 如果两个变量中任意一个为 true，返回 TRUE。 |


    之所以有两个“逻辑与”和“逻辑或”运算符，是因为它们的优先级顺序不同。逻辑运算符最常见的用法是在 `if/else` 语句中，或在三元运算符的第一个表达式中。让我们看一些逻辑运算符的示例及其用法。


    ![](img/00043.jpeg)


    ### 字符串运算符


    只有两种字符串运算符，我们已经见过两者。第一个运算符是点运算符（`.`），用于连接两个字符串。第二个运算符是组合连接赋值运算符（`.=`），它将右侧参数追加到左侧参数。您将非常频繁地使用这两者。


    ![](img/00044.jpeg)


    ## 结论


    这结束了我们对 PHP 中不同类型运算符和表达式的概述。您离编写第一个真正的 PHP 应用程序越来越近了！您还需要两个基本构建块，将在接下来的两章中介绍，随后您就能着手编写中级和高级应用程序了！


    ### 练习 1


    算术赋值运算符在赋新值的同时对变量执行算术运算。对于此 PHP 练习，编写一个脚本以复现下面的输出。仅操作一个变量，不使用简单算术运算符，以生成语句中给出的值。


