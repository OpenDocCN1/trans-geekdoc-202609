    ### PHP 创建文件


    `fopen()` 函数也用于创建文件。这可能有点令人困惑，但在 PHP 中，创建文件使用的是与打开文件相同的函数。


    如果对一个不存在的文件使用 `fopen()`，它将创建该文件，前提是文件以写入 (`w`) 或追加 (`a`) 模式打开。


