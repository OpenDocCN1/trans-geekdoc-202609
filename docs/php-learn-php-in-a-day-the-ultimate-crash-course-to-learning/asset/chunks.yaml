    # 第四章 – 控制结构


    ## 简介


    PHP 脚本由一系列语句构成。语句可以是赋值、函数调用、循环、条件语句，甚至是空语句。通过用花括号封装语句，可以将它们分组为语句组。语句组本身被视为一条语句。


    在本章中，我们将观察不同类型语句的行为。


    ## If 语句


    ### If 语句


    “if” 语句是任何语言中最重要的结构之一。此控制结构允许你有条件地执行代码片段。PHP 的 “if” 结构类似于 C 语言。也就是说，每个 if 语句在其最基本的形式下看起来像
    `if (expression) statement`。表达式会被求值为其布尔值。如果表达式为 `TRUE`，PHP 将执行该语句。如果为 `FALSE`，则不会执行。一个简单的例子是：


    ![](img/00045.jpeg)


    很多时候，如果某个条件为真，你需要执行不止一条语句。你不需要将每条语句都包裹在自己的 if 子句中。相反，你可以使用花括号将想要有条件执行的代码包裹起来。


    ![](img/00046.jpeg)


    你甚至可以更进一步，在其他 if 语句内部嵌套 if 语句。


    ### If Else 语句


    在某些情况下，你想在条件满足时执行一段代码，而在条件不满足时执行另一段不同的代码。在这种情况下，你必须使用 `if-else` 语句。`else` 扩展了
    if 语句，以便在语句求值为 `FALSE` 时执行一个表达式。这里有一个扩展上述示例的例子：


    ![](img/00047.jpeg)


    ### If-else if-else 语句


    这是对 `if` 语句的另一种修改，它呈现了 if 语句最通用的形式。它包含一个 `if` 语句，如果语句为 `TRUE` 则执行一块代码。在此 `if`
    语句之后，有若干个 `elseif` 语句。每个 else if 语句都有一个关联的条件和一块待执行的代码（如果为真）。代码块仅在条件求值为 true 时执行。在所有的
    `elseif` 语句之后，有一个结束的 `else` 语句。你可以将其视为一种默认情况。如果没有条件求值为 true，则执行 `else` 语句。这是一个例子：


    ![](img/00048.jpeg)


    请记住，一旦某个条件求值为 `TRUE`，脚本就会执行关联的代码块并跳出 if-elseif-else 结构，不会继续检查其他条件。也就是说，使用 if-elseif-else
    时只会执行一个条件。与 if-elseif-else 结构相关的一种结构是 `switch` 语句，这是接下来要讨论的主题。


    ## Switch


    switch 语句类似于在同一个变量上操作的一堆 `if` 语句。想象一下，你有一个可以取某些值的变量。在代码中，你想比较该变量是否对应某些特定值。对于每个值，都有一段必须执行的代码。此外，如果变量不满足任何这些情况，你想执行一些默认代码。你可以使用一个冗长的
    if-elseif-else 结构来实现，但也可以使用 `switch` 语句。


    switch 语句的作用与 if-else-if 结构相同，但能节省一些输入。switch 语句的语法是：


    ![](img/00049.jpeg)


    你可以根据代码需要拥有任意数量的 case。一个需要牢记的重要事项是 `break` 语句的存在。`break` 命令会跳出你当前所在的结构或循环。如果每个
    case 内部没有 break 命令，PHP 会遍历每一个 case。也就是说，PHP 会将变量与每个 case 进行比较，如果比较返回 `TRUE`，则执行该
    case 中指定的代码。如果 PHP 没有遇到 `break` 命令，它会继续执行下一个 case，如果该 case 的比较返回 `TRUE`，则执行其特定代码。这是使用
    if-elseif-else 结构和 switch 语句的区别之一。


    让我们看一个 if-elseif-else 结构与 switch 语句对比的例子：


    ![](img/00050.jpeg)


    关于 switch 语句就这些了。学会如何利用它们，你会比写出所有 if-else 语句更高效。


    ## 控制结构的替代语法


    在继续讲解其他控制结构之前，让我们花点时间了解一下 PHP 为控制结构提供的替代语法。PHP 为某些控制结构提供了替代语法。这些结构包括：`if`、`while`、`for`、`foreach`
    和 `switch`。在每种情况下，替代语法的基本形式是将左花括号改为冒号，将右花括号分别改为 `endif;`、`endwhile;`、`endfor;`、`endforeach;`
    或 `endswitch;`（基本上是以控制结构的名称加上“end”作为后缀）。这使我们能够跳出 PHP 模式以包含 HTML，例如。


    我们还没有真正讨论过在 PHP 脚本中包含 HTML，但这实际上是一个非常简单的概念。包含 HTML 的一种方法是将 HTML 字符串保存到变量中，然后 `echo`
    或 `print` 该变量。事实上，这是一种你会经常发现自己在使用的方法。然而，这种方法有其缺点。例如，假设你想创建一个不是动态生成的表格（即你不使用 PHP
    为你生成表格行）。该表格有特定的布局，你想在其中一个单元格中包含某个 PHP 变量的值。如果你尝试将其写入变量，你会发现这非常繁琐且低效。（除非出于某种原因你需要将
    HTML 存储在变量中，那种情况下你只能使用 HTML 转变量的方法）。你可以跳出 PHP，然后再跳回 PHP，在中间包含必要的 HTML。这是一个简单的例子：


    ![](img/00051.jpeg)


    好了，在题外话之后，让我们看看 if 语句的替代语法：


    ![](img/00052.jpeg)


    这看起来与上面的代码完全一样，并且会完全按照你的预期工作。


    **实用技巧！**


    每当你创建的控制结构需要用花括号封装时，请务必先写出完整的控制结构骨架，然后再填充内容。也就是说，如果你要创建一个 if 语句，你应该写出：


    ![](img/00053.jpeg)


    请务必始终这样做！如果你这样做，就永远不需要跟踪左/右括号和/或圆括号。事实上，你应该把这作为自己的铁律。每当你打开一个括号或圆括号时，在编写**任何**其他代码之前先将其关闭。然后回去填充所需的代码。这将防止你犯低级错误，并节省宝贵的调试时间，让你有时间编写出色的应用程序。


    编写替代语法的另一种方法是保留花括号并像往常一样跳出 PHP。以下两条语句是等效的：


    ![](img/00054.jpeg)


