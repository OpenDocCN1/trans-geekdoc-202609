- raw: "              Unlike many other languages, PHP does not require you to explicitly\
    \ declare the variable type, rather, it determines it from the context. In other\
    \ words, you don’t have to explicitly tell PHP whether you want a variable to\
    \ be a double precision number or a string.  To help you imagine this, you can\
    \ think of variables as boxes. Imagine a row of lockers (like the kind you would\
    \ see at an airport or a train station). Each locker represents a variable. Each\
    \ locker has its own unique number, which differentiates it from all of the other\
    \ lockers. If someone tells you to open locker number 42, you would be able to\
    \ find it without a problem and you wouldn’t confuse it with any other locker\
    \ (for example 24). In a similar way, PHP variable names are unique and each PHP\
    \ variable is unique. Now, you open locker number 42, and you see that it is empty.\
    \ You move on to locker 43 and see that there is a package inside it. You take\
    \ the package from 43 and place it in 42. Before opening the lockers you didn’t\
    \ know what was in the lockers. After checking, you know what is contained inside\
    \ that locker and you can manipulate it as desired. In a similar fashion, variables\
    \ in PHP can contain anything you place in them. Essentially, when you are checking\
    \ the type of a variable, you are checking the type of the content inside of the\
    \ variable.\n\n              That explanation may be a bit confusing, but you’ll\
    \ get used to it very quickly and you will not have problems dealing with variables\
    \ in PHP. Let’s take a look at some of the variables inside of PHP:\n\n### Boolean\n\
    \n              Booleans are the simplest type of variables that exist in PHP.\
    \ Booleans are used for logical statements and to express a truth value. Booleans\
    \ are binary, meaning that they take one of two values:TRUEorFALSE. Having said\
    \ that, let’s look at an example of a Boolean variable:\n\n![](images/00008.jpeg)\n\
    \n              Like many other languages, PHP is flexible in its use and interpretation\
    \ of Boolean variables. In other words, we can create Booleans without explicitly\
    \ defining them as either being TRUE or FALSE. IN fact, here is the list of rules\
    \ that determines which values are considered to be FALSE by PHP:\n\n*   The BooleanFALSE;\n\
    \n*   The integer0;\n\n*   The float0.0;\n\n*   The empty string and the string“0”;\n\
    \n*   An array with zero elements;\n\n*   The special typeNULL;\n\n*   ASimpleXML\
    \ object created from empty tags;\n\nEverything else will returntrue;\n\nThis\
    \ means that if we can write the following code and it will be valid:\n\n![](images/00009.jpeg)\n\
    \nEven though we still haven’t covered if statements, you can pretty much figure\
    \ out what will happen here. The implicit Boolean variable is defined inside the\
    \ parenthesis (). Once the logical operation executes it will return either a\
    \ TRUE or a FALSE. \n\nA couple of important things to note about the above example:\n\
    \nPHP considers the integer 1 to be the same as TRUE. That means, if we have defined\
    \ the variable ‘var’ to be TRUE, and we check it against the integer one, the\
    \ logical statement will return TRUE:\n\n![](images/00010.jpeg)\n\nThe second\
    \ thing to note:\n\nWe are using a double equals sign to check whether one value\
    \ is equal to another. Don’t make the mistake of using a single equal sign.\n\n\
    After all of that, we should introduce typecasting. Typecasting is when we take\
    \ the value a variable and we convert it from one type to another. For example,\
    \ we can have a variable with a value of 42 and we want to cast it to a Boolean.\
    \ Another example is if we have a variable with the value of 42 and we want to\
    \ cast it to a string (more on that later). For Booleans, type casting is for\
    \ the most part unnecessary (i.e. you will almost never ever do it). This is because\
    \ values will automatically be converted to Booleans if an operator, function\
    \ or control structure requires a Boolean as argument. However, for the sake of\
    \ consistency with the other type casts, this is how to cast a variable to a Boolean:\n\
    \n![](images/00011.jpeg)\n\n### Number\n\n###  \n\nNumbers in PHP, and most programming\
    \ languages, come in different flavors. The two subtypes of numbers in PHP are\
    \ Integers and Floating point numbers. Let’s take a look at each one.\n\n####\
    \ Integers\n\nBy definition,  integers are all numbers in the set:\n\n![](images/00012.jpeg)\n\
    \nIn other words, integers are all whole, real numbers (both positive, negative\
    \ and zero). PHP allows us to define integers in a number of ways. You can define\
    \ integers in base 10, base 8 (octal), base 16 (hexadecimal) or binary (base 2).In\
    \ order to use octal notation for an integer, you need to precede the number with\
    \ a0. To use hexadecimal notation for an integer, you precede the number with\
    \ an0x. Lastly, if you want to use binary notation, you precede the number with0b.\
    \ Here is an example:\n\n![](images/00013.jpeg)\n\nTake note of the last function\
    \ we use (don’t worry if you don’t know what functions are).\n\nHelpful Tip!\n\
    \nYou can check the type and contents of a variable by usingvar\\_dump(). The\
    \ function takes one input as an argument (again, don’t worry if you don’t fully\
    \ understand. This means that you should only put one thing inside the parenthesis).\
    \ The function will print the type of the variable and the contents to the screen.\
    \ In the above example, the output to the screen will look like:\n\n![](images/00014.jpeg)Now\
    \ try to usevar\\_dump on the other variables. Do you notice anything interesting?\
    \ Do you see the value that is being printed to the screen for each variable?\
    \ What base is it in?\n\nThe largest number that can be stored on a 32-bit system\
    \ as an integer is of magnitude 21474783647. Anything larger than that will automatically\
    \ be converted to a type offloat. For a 64-bit system the number is of magnitude\
    \ 9223372036854775807. Anything larger than that will automatically be converted\
    \ to a type offloat.\n\nIf you want to convert a variable to an integer, in other\
    \ words cast it as an integer, you would do the following:\n\n![](images/00015.jpeg)\n\
    \nThis type of casting is useful in a number of situations, but the most common\
    \ usage is for security. One of the exercises at the end of the chapter will show\
    \ you a particular usage of integer casting for security purposes.\n\n#### Floating\
    \ Point Numbers\n\n              Integers was the set of real and whole numbers,\
    \ so logically, floating point numbers (also referred to as “floats”, “doubles”\
    \ or “real numbers”) will include everything else. That is, the numbers that in\
    \ between integers. Thus, we get the set of all real numbers. With that being\
    \ said, it is crucial to note that all computers have a limitation as to the precision\
    \ with which they display numbers (this is known as a machine epsilon). Furthermore,\
    \ there are some weird discrepancies that may occur when dealing with floats.\
    \ We won’t go too much into that since it is beyond the scope of this book, but\
    \ if you find any non-intuitive results when dealing with floats, think about\
    \ the precision with which PHP handles floats.\n\nFloats can be represented in\
    \ the following ways in PHP: \n\n![](images/00016.jpeg)\n\n### String\n\nStings\
    \ in PHP are series of characters. You use these to store pieces of text and words.\
    \ PHP handles each character as a byte. With that being said, we should note that\
    \ the largest string that PHP can support is of size 2GB. The fun bits come when\
    \ defining strings. \n\n#### Single quotes\n\nThe easiest way to define a string\
    \ in PHP is to use single quotes.\n\n![](images/00017.jpeg)\n\nWhat happens if\
    \ we want to incorporate new lines in our string?\n\n![](images/00018.jpeg)\n\n\
    This is valid syntax inside of PHP, but the newline break will not be incorporated\
    \ into the final output. Not the use of theecho function. What does the above\
    \ code output?\n\nHelpful Tip!"
