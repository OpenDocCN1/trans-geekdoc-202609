    # Break


    `break` 结束当前 `for`、`foreach`、`while`、`do-while` 或 `switch` 结构的执行。


    `break` 接受一个可选的数字参数，该参数指定了要跳出多少层嵌套的外层结构。


    下面是一个 `break` 命令配合可选参数工作原理的示例：


    ![](img/00066.jpeg)


    # Continue


    `continue` 命令类似于 `break` 命令，但它不会跳出循环。相反，它继续执行循环的下一次迭代。此命令也可用在 `switch` 语句中，但其结果与使用
    `break` 相同。你可以这样理解：


    `continue` 将执行流程带到你的结构最后一个右大括号之前。如果是循环，你将进入循环的下一次迭代。对于 `switch` 语句，当执行流程被带到右大括号之前时，实际上是被带到了
    `switch` 语句的末尾。


    相比之下，`break` 将执行流程带到你的代码最后一个右大括号之外。对于循环，这意味着你已经跳出了循环。对于 `switch` 语句，这意味着你跳出了 `switch`
    语句，不再执行任何 case 分支。


    与 `break` 语句一样，`continue` 接受一个可选参数，告诉 PHP 应该跳过多少层嵌套循环。


    # Return


    `return` 命令将程序控制权返回给调用模块。执行将在调用模块的调用语句之后的语句处恢复。


    如果你在函数内部使用 `return`，`return` 语句会立即结束当前函数的执行，并将 `return` 的参数作为函数调用的值返回。


    尽量避免在被另一个文件包含的文件中使用 `return`，因为这是不良实践。


    # Include


    文件包含基于给定的文件路径，如果未给定路径，则基于指定的 `include_path`。如果在 `include_path` 中未找到文件，`include`
    最后会在调用脚本自己的目录和当前工作目录中查找，然后才会失败。如果 `include` 结构找不到文件，会发出一条警告；这与 `require` 不同，后者会发出致命错误。


    如果定义了路径——无论是绝对路径（在 Windows 上以盘符或 `\` 开头，在 Unix/Linux 系统上以 `/` 开头）还是相对于当前目录的相对路径（以
    `.` 或 `..` 开头）——`include_path` 将完全被忽略。例如，如果文件名以 `../` 开头，解析器将在父目录中查找请求的文件。


    有关 PHP 如何处理文件包含和包含路径的更多信息，请参阅 `include_path` 的文档。


    当一个文件被包含时，其中包含的代码将继承 `include` 所在行的变量作用域。调用文件中该行可用的任何变量，从该点开始在被调用文件中都将可用。然而，被包含文件中定义的所有函数和类都具有全局作用域。


    # Require


    `require` 与 `include` 相同，不同之处在于失败时它会产生一个错误并停止脚本的执行。


    # Require_once


    这与 `require` 类似，不同之处在于 `require_once` 会检查该文件到此为止是否已经被包含过。如果已经包含过，则不会再次包含。因此，它确保文件只被包含一次。


    # Include_once


    工作方式与 `require_once` 完全相同，不同之处在于它不会产生错误。


    # 结论


    这可能是本书中最重要的章节之一。通过本章学到的概念和技巧，你应该能够充分利用你的 PHP 技能来创建令人惊叹的应用程序。本章介绍的控制结构是你将要编写和遇到的每个
    PHP 脚本的基础。将这些与接下来关于函数和数据库连接及使用的章节相结合，你将顺利踏上创建高级复杂 Web 应用程序的道路。


