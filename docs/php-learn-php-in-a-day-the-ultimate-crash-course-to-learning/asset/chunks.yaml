- raw: "That does it for the alternate syntax for control structures. You will often\
    \ find yourself these alternate syntaxes in your code when you are juggling between\
    \ PHP and HTML. In the next subchapter we will begin out discussion of the different\
    \ types of looping structures in PHP. Keep in mind that the alternate syntax we\
    \ discussed in this structure is applicable to some of the next structures as\
    \ well.\n\n## While\n\nThis is the first type of loop that we will be talking\
    \ about and it is also the simplest. The form of a while statement is: \n\n![](images/00055.jpeg)\n\
    \nThe meaning of the while loop is also simple to understand. While loops tell\
    \ PHP to execute the nested statement (does not need to be a single statement,\
    \ it could be a block of code and in most cases it will be) as long as the while\
    \ expression evaluates to TRUE. The expression is evaluated once at the beginning\
    \ of the loop so even if the value of the expression is to change during the execution\
    \ of the loop, the execution of the loop does not terminate (unless told otherwise)\
    \ until the beginning of the next iteration. It is important to note that if the\
    \ expression is FALSE the first time PHP checks it, the statement will not be\
    \ executed. \n\nAs we mentioned, the statement could be a number of statements\
    \ wrapped inside of curly braces. As with the if statement, we can use the alternate\
    \ syntax to form our while loop. This is the general form of a while loop using\
    \ alternate syntax for control structures: \n\n![](images/00056.jpeg)\n\nLet’s\
    \ run a simple example of this loop to count from 1 to 10.\n\n![](images/00057.jpeg)\n\
    \nWhile loops are very commonly used, especially when you are extracting information\
    \ from a database (we’ll look at that in a later chapter).\n\nOne potential pitfall\
    \ to lookout for is creating infinite loops, that is, loops that will never terminate\
    \ (the while condition will always evaluate to TRUE). There are cases in which\
    \ you would want to create an infinite loop and terminate it on a certain condition,\
    \ but other times this behavior is not desired. Imagine the following examples.\n\
    \nYou want to set up an application that will check the status of something and\
    \ send an email to a user. Say, you are monitoring the status of a server and\
    \ you want to know if something is going wrong. You want a script that will be\
    \ running indefinitely and checking the server status at defined intervals. This\
    \ can be achieved using an infinite loop that pauses for some defined amount of\
    \ time before it resumes operation. Another example is if you are setting up a\
    \ simple game using PHP to test your skills. You want to set up a main loop (you\
    \ can refer to it as a “game loop” if you wish) that will run once each frame\
    \ and do the operations that are associated with the game. Another example is\
    \ if you are waiting for user-defined input. In that case you would set up an\
    \ infinite loop that takes the user input and operates on it.\n\nAt the start\
    \ infinite loops can be tricky and can cause you some problems, so try to avoid\
    \ them until you are comfortable with the concept of looping and know what you\
    \ are doing.\n\nThe easiest way to set up an infinite loop is:\n\n![](images/00058.jpeg)\n\
    \nThe while condition will always evaluate to TRUE (in essence, the loop reads:while\
    \ TRUE, execute {statement}).\n\n## Do-while\n\nThe do-while loop is similar to\
    \ the loop we saw in the previous subchapter, with a minor difference. Do-while\
    \ loops have the following structure:\n\n![](images/00059.jpeg)\n\nThis means\
    \ that PHP will execute everything that is inside the do clause first, and then\
    \ it will check the condition. If it evaluates to TRUE, PHP will loop back. What\
    \ you will notice is that you evaluate the condition at the end of the loop instead\
    \ of the beginning. This means that the code inside the do statement is guaranteed\
    \ to run at least once. For example: \n\n![](images/00060.jpeg)\n\nThis code will\
    \ execute exactly one time before terminating because the truth expression evaluates\
    \ to FALSE.\n\nThe only major difference between a do-while and a while loop is\
    \ that the do-while will run the code at least once, whereas the while loop will\
    \ not. With that being said, it should be noted that the while loop is the loop\
    \ that you will be using most commonly in practice, but don’t forget that the\
    \ do-while loop exists!\n\n## For\n\nFor loops are more complex than while and\
    \ do-while loops, but you should become really comfortable with them because you\
    \ will be using them all the time! Here is the basic syntax of a for loop:\n\n\
    ![](images/00061.jpeg)\n\nThe first expression is evaluated (executed) once at\
    \ the beginning of the loop.\n\nThe second expression is evaluated at the beginning\
    \ of each iteration. If it evaluates to the TRUE, the loop will continue, and\
    \ the nested statement(s) are executed. If it evaluates to FALSE, the execution\
    \ of the loop terminates. At the end of each iteration, the third expression is\
    \ evaluated (executed).\n\nEach of the expression can be empty or it can contain\
    \ multiple expressions separated by commas. If the second expression is empty,\
    \ PHP assumes it to be TRUE. Essentially this will create an infinite FOR loop.\
    \ Let’s look at the following examples:\n\n![](images/00062.jpeg)\n\nAs with the\
    \ while and if statements, for loops support the alternate colon syntax for control\
    \ structures:\n\n![](images/00063.jpeg)\n\nVery often, people will loop through\
    \ arrays using for loops. While it is not wrong to do this, it is more convenient\
    \ to use foreach loops for arrays or objects, because that control structure is\
    \ specifically setup for arrays and provides you with more control.\n\nNow that\
    \ we’ve introduced the two types of looping in PHP, you may be asking yourself:\
    \ What is the difference between a while and a for loop and when should you use\
    \ each one? Here is the general rules of thumb that will guide you through the\
    \ proper usage of for and while loops in your PHP applications.\n\nFor loops are\
    \ for when you know how many iterations of the loop you need. For example, if\
    \ you want to operate on each element of an array, you use a for loop that loops\
    \ from the first to the last value of the array. The easiest way is if you have\
    \ an array where each key is an incremental number. You initialize the counter\
    \ variable to 0 (this is usually going to be the first value of the array. Remember,\
    \ PHP counts from 0). After that, you check whether you have reached the last\
    \ element of the array. To do that you check whether the counter variable is smaller\
    \ than or equal to the length of the array (you can use thecount() function to\
    \ find the number of elements in the array.) The last expression will be incrementing\
    \ the counter variable.\n\nWhile loops on the other hand, are to be used when\
    \ you don’t know how many iterations your loop will take until the truth condition\
    \ evaluates to FALSE.\n\nA closing word about for loops:\n\nFor loops can be used\
    \ on string characters as well. Can you set up a for loop that will print out\
    \ the letters of the alphabet?\n\n## Foreach\n\nThe foreach construct provides\
    \ an easy way to iterate over arrays and objects, but it will only work on arrays\
    \ and objects and will give you an error if you try to use a foreach on a different\
    \ kind of variable type. There are two syntaxes to the foreach loop:\n\n![](images/00064.jpeg)\n\
    \nThe first syntax loops over an array (array\\_expression)and takes the value\
    \ of each element and assigns it to$value. In the second syntax, you reference\
    \ both the key and the value of each element of the array. Let’s look at an example:\n\
    \n![](images/00065.jpeg)\n\nNote that the reference to$value remains after the\
    \ foreach loop, so you should unset it (destroy it) after the loop to prevent\
    \ any issues with your code.\n\nForeach loops and while loops are very commonly\
    \ used in tandem when working with database information, but we shall see that\
    \ in the chapter concerning databases.\n\n## Break              \n\nSo far we\
    \ have seen the use of thebreak command to break out of loops, but we have not\
    \ defined it explicitly until now."
  fmt: "\n本章到此结束了关于控制结构替代语法的介绍。当你在 PHP 和 HTML 之间切换时，经常会在代码中发现这些替代语法。在下一小节中，我们将开始讨论\
    \ PHP 中不同类型的循环结构。请记住，本节讨论的替代语法也适用于接下来的一些结构。\n\n## While\n\n这是我们将要讨论的第一种循环类型，也是最简单的一种。`while`\
    \ 语句的形式如下：\n\n```\nwhile (expr) statement\n```\n\n`while` 循环的含义也很容易理解。`while`\
    \ 循环告诉 PHP 只要 `while` 表达式的值为 `TRUE`，就执行嵌套语句（不必是单条语句，可以是一个代码块，在大多数情况下也是如此）。表达式在循环开始时只计算一次，因此即使表达式的值在循环执行过程中发生变化，循环也不会终止（除非另有指示），直到下一次迭代开始。值得注意的是，如果表达式在\
    \ PHP 第一次检查时为 `FALSE`，则该语句不会被执行。\n\n正如我们提到的，该语句可以是包裹在花括号内的多条语句。与 `if` 语句一样，我们可以使用替代语法来构建\
    \ `while` 循环。使用控制结构替代语法的 `while` 循环的一般形式如下：\n\n```\nwhile (expr):\n    statement\n\
    \    ...\nendwhile;\n```\n\n让我们运行一个简单的例子，使用该循环从 1 计数到 10。\n\n```\n$i = 1;\nwhile\
    \ ($i <= 10):\n    echo $i++;\nendwhile;\n```\n\n`while` 循环非常常用，特别是在从数据库提取信息时（我们将在后面的章节中介绍）。\n\
    \n一个需要注意的潜在陷阱是创建无限循环，即永远不会终止的循环（`while` 条件将始终评估为 `TRUE`）。有时你想创建一个无限循环并在特定条件下终止它，但有时这种行为是不希望的。想象以下示例。\n\
    \n你想设置一个应用程序来检查某事物的状态并向用户发送电子邮件。例如，你正在监控服务器的状态，想知道是否出现故障。你需要一个脚本无限期运行，并在定义的时间间隔内检查服务器状态。这可以通过一个无限循环实现，该循环在恢复操作前暂停一段定义的时间。另一个例子是，如果你使用\
    \ PHP 设置一个简单的游戏来测试技能。你想设置一个主循环（如果愿意，可以称之为“游戏循环”），每帧运行一次并执行与游戏相关的操作。还有一个例子是等待用户定义的输入。在这种情况下，你会设置一个无限循环来获取用户输入并对其进行操作。\n\
    \n起初无限循环可能比较棘手，并可能给你带来一些问题，所以在你熟悉循环概念并知道自己在做什么之前，尽量避免使用它们。\n\n设置无限循环最简单的方法是：\n\
    \n```\nwhile (true) {\n    statement\n}\n```\n\n`while` 条件将始终评估为 `TRUE`（本质上，循环读作：while\
    \ TRUE，执行 {statement}）。\n\n## Do-while\n\n`do-while` 循环与上一小节看到的循环类似，但有一个细微的差别。`do-while`\
    \ 循环具有以下结构：\n\n```\ndo\n    statement\nwhile (expr);\n```\n\n这意味着 PHP 会先执行 `do`\
    \ 子句内的所有内容，然后检查条件。如果评估为 `TRUE`，PHP 将循环回去。你会注意到条件是在循环结束时评估的，而不是在开始时。这意味着 `do` 语句内的代码**保证至少运行一次**。例如：\n\
    \n```\n$i = 0;\ndo {\n    echo $i;\n} while ($i > 0);\n```\n\n这段代码将在终止前恰好执行一次，因为真值表达式评估为\
    \ `FALSE`。\n\n`do-while` 和 `while` 循环的唯一主要区别在于 `do-while` 将至少运行一次代码，而 `while`\
    \ 循环则不会。话虽如此，值得注意的是 `while` 循环是在实践中最常用的循环，但不要忘记 `do-while` 循环的存在！\n\n## For\n\n\
    `for` 循环比 `while` 和 `do-while` 循环更复杂，但你应该非常熟悉它们，因为你会一直用到它们！以下是 `for` 循环的基本语法：\n\
    \n```\nfor (expr1; expr2; expr3)\n    statement\n```\n\n第一个表达式在循环开始时计算（执行）一次。\n\
    \n第二个表达式在每次迭代开始时计算。如果评估为 `TRUE`，循环将继续，并执行嵌套语句。如果评估为 `FALSE`，循环执行终止。在每次迭代结束时，计算（执行）第三个表达式。\n\
    \n每个表达式都可以为空，或者包含由逗号分隔的多个表达式。如果第二个表达式为空，PHP 假定其为 `TRUE`。本质上这将创建一个无限的 `for` 循环。让我们看看以下示例：\n\
    \n```\nfor ($i = 1; $i <= 10; $i++) {\n    echo $i;\n}\n```\n\n与 `while` 和 `if`\
    \ 语句一样，`for` 循环支持控制结构的替代冒号语法：\n\n```\nfor (expr1; expr2; expr3):\n    statement\n\
    \    ...\nendfor;\n```\n\n人们经常使用 `for` 循环遍历数组。虽然这样做并不错误，但使用 `foreach` 循环遍历数组或对象更方便，因为该控制结构专门为数组设计，并提供了更多控制。\n\
    \n现在我们已经介绍了 PHP 中的两种循环类型，你可能会问自己：`while` 和 `for` 循环有什么区别，何时应该使用每一个？以下是指导你在 PHP\
    \ 应用程序中正确使用 `for` 和 `while` 循环的一般经验法则。\n\n`for` 循环用于你知道需要多少次循环迭代的情况。例如，如果你想操作数组的每个元素，可以使用一个从数组的第一个值循环到最后一个值的\
    \ `for` 循环。最简单的方法是拥有一个每个键都是增量数字的数组。将计数器变量初始化为 0（这通常是数组的第一个值。记住，PHP 从 0 开始计数）。之后，检查是否已到达数组的最后一个元素。为此，检查计数器变量是否小于或等于数组的长度（可以使用\
    \ `count()` 函数查找数组中的元素数量）。最后一个表达式将是增加计数器变量。\n\n另一方面，`while` 循环用于在真值条件评估为 `FALSE`\
    \ 之前，你不知道循环将进行多少次迭代的情况。\n\n关于 `for` 循环的结束语：\n\n`for` 循环也可以用于字符串字符。你能设置一个 `for`\
    \ 循环来打印出字母表中的字母吗？\n\n## Foreach\n\n`foreach` 结构提供了一种简单的方法来遍历数组和对象，但它**只能**用于数组和对象，如果你尝试在其他类型的变量上使用\
    \ `foreach`，将会报错。`foreach` 循环有两种语法：\n\n```\nforeach (array_expression as $value)\
    \ statement\nforeach (array_expression as $key => $value) statement\n```\n\n第一种语法遍历数组（`array_expression`），并将每个元素的值赋给\
    \ `$value`。在第二种语法中，你引用数组中每个元素的键和值。让我们看一个例子：\n\n```\n$arr = [1, 2, 3, 4];\nforeach\
    \ ($arr as $value) {\n    echo $value;\n}\n```\n\n注意，对 `$value` 的引用在 `foreach`\
    \ 循环后仍然存在，因此你应该在循环后 `unset` 它（销毁它），以防止代码出现任何问题。\n\n`foreach` 循环和 `while` 循环在处理数据库信息时经常一起使用，但我们将在涉及数据库的章节中看到这一点。\n\
    \n## Break\n\n到目前为止，我们已经看到了使用 `break` 命令跳出循环，但直到现在我们还没有显式地定义它。\n"
