    # PHP 5 析构函数


    PHP 5 引入了析构函数的概念，这类似于其他面向对象语言（如 C++）中的析构函数。只要某个特定对象不再有任何引用，或者在关闭序列期间按任意顺序，析构函数方法就会被调用。


    ![](img/00138.jpeg)


    与构造函数一样，引擎不会隐式调用父类的析构函数。为了运行父类的析构函数，必须在析构函数体内显式调用 `parent::__destruct()`。同样与构造函数一样，如果子类本身没有实现析构函数，则可以继承父类的析构函数。


    即使使用 `exit()` 停止脚本执行，析构函数仍会被调用。在析构函数中调用 `exit()` 将阻止剩余的关闭例程执行。


    ## 对象继承


    继承是一项成熟的编程原则，PHP 在其对象模型中使用了这一原则。该原则将影响许多类和对象相互关联的方式。


    例如，当你扩展一个类时，子类将继承父类所有的公有和受保护方法。除非子类覆盖了这些方法，否则它们将保留原有的功能。


    这对于定义和抽象功能很有用，并且允许在相似对象中实现额外功能，而无需重新实现所有共享的功能。


    ![](img/00139.jpeg)

    ![](img/00140.jpeg)


    ## 作用域解析操作符 (::)


    作用域解析操作符（也称为 Paamayim Nekudotayim），简单来说就是双冒号，是一个允许访问类的静态、常量以及被覆盖的属性或方法的标记。


    当从类定义外部引用这些项目时，使用类的名称。


    自 PHP 5.3.0 起，可以使用变量来引用类。变量的值不能是关键字（例如 `self`、`parent` 和 `static`）。


    ![](img/00141.jpeg)


    三个特殊关键字 `self`、`parent` 和 `static` 用于在类定义内部访问属性或方法。


    ![](img/00142.jpeg)


    当扩展类覆盖了父类的方法定义时，PHP 不会调用父类的方法。是否调用父类的方法取决于扩展类。这也适用于构造函数和析构函数、重载以及魔术方法定义。


    ![](img/00143.jpeg)


    ## 结语


    在结束本书之前，让我们看几个关于类和对象的练习。


    ### 练习 1


    在本 PHP 练习中，你将构建用户注册表单的开端。为此，你将创建一个用于生成选择字段的类，然后在表单中使用该类派生的对象。


    首先，编写一个包含浏览器类型的数组：Firefox、Chrome、Internet Explorer、Safari、Opera、Other。


    然后开始编写 `Select` 类。你需要两个属性：用于选择字段名称的 `$name`，以及用于提供选项值的数组 `$value`。除了你将要改造的两个方法外，还需要四个方法：`setName`、`getName`、`setValue`、`getValue`。检查值是否为数组应放在
    `setValue` 方法中，所以在这里编写它，并从 `makeSelect` 中删除它。


    接下来是你编写的用于生成选择字段的两个函数。更改 `makeOptions` 函数，使其遍历数组参数的值而非键。这将是你的第五个方法。然后修改 `makeSelect`
    函数，使其成为类中的第六个方法。


    接下来是 HTML 部分。编写一个用户注册表单，询问姓名、用户名、邮箱、浏览器。前三项使用文本字段收集用户数据，然后基于你的类实例化一个对象用于选择字段。当用户点击提交按钮时，返回数据作为确认。


    如果你要创建一个用于 Web 的注册表单，你会希望将数据收集到数据库中。然而，将 PHP 与 mySQL 或其他数据库结合使用超出了本网站的范围。


    ### 练习 2


    在上一个 PHP 练习中，`Select` 类可能看起来代码量很大，只是为了一个简单的选择字段。类和对象的真正价值直到你有理由重用代码时才会显现。因此，这一次，你将扩展用户注册表单以使用多个选择字段。


    假设你有充分理由需要获取用户浏览能力的数据。可能是你想优化你的网站，或者你的网站内容涉及这些问题，又或是其他类似原因。使用你的选择类，你可以随意重用类代码来创建选择字段。


    要构建这个新版本的注册表单，从你为类练习 #1 编写的脚本开始。在 `$browsers` 数组中将 None 的值作为第一个值添加进去。编写两个更多的数组：`$speeds`，包含
    Unknown、DSL、T1、Cable、Dialup、Other；`$os`，包含 Windows、Linux、Macintosh、Other。（当然，这些也可以是屏幕分辨率、Flash
    版本或任何其他相关能力。）


    你想获取用户在家和工作场所的浏览数据。在浏览器选择字段上方，添加副标题 Work Access，并将浏览器标签重命名为 Primary Browser。（我们都知道很多人不止使用一种浏览器。）在此下方，为
    Connection Speed 和 Operating System 添加标签和选择字段对象。接下来，添加副标题 Home Access，并创建三个对应
    Work Access 字段的新选择字段。


    由于脚本中使用了这么多对象，在每个对象完成工作后销毁它是个好主意。这将释放对象占用的内存。


    当用户点击提交按钮时，在相同标题（Work Access、Home Access）下，以两个项目符号列表的形式返回用户的选择字段选项。


    ### 练习 3


    如果你完成了 PHP 类练习 #1 和 #2，你现在已经编写了一个可用的用户注册表单。是时候调整它，使其更完善了。


    首先，最好在每个选择字段的顶部显示消息 `--Select one--`。在 `makeSelect()` 方法中添加一行代码来实现这一点。其值应为 `No
    response`。你不再需要 `$browsers` 数组顶部的 "None" 值，所以删除它。通过对 `Select` 类的这一更改，你可以看到使用类如何简化你的工作。只需一行代码，所有选择字段即可更新。


    如果没有一些基本信息，用户的响应就不会很有用，所以下一个任务是使三个字段成为必填项。在表单上方添加 `* Indicates required field`。然后在
    Name、Username 和 Email 字段添加星号。


    接下来，添加代码验证这三个字段中的数据。这段代码将出现在脚本的后半部分，即从 `$_POST[]` 变量检索数据之后。函数 `empty()` 可以让你知道字段中是否有数据。为了帮助用户提供缺失信息，请在错误消息中包含一个返回按钮。（如果你完成了表单练习
    #3，你已经写过其中一个了。）


    Email 字段是特殊情况。你不仅可以检查数据是否存在，还可以检查是否包含 `@`（at 符号），任何有效的邮箱地址都会包含它。因此，这里的数据必须满足两个条件才算可接受。你可以使用
    `strpos()` 函数来确认 `@` 字符的存在。


    恭喜！你做到了。这是我们 PHP 课程的最后一章。你现在应该能够创建自己的应用程序并应对各种项目。希望你喜欢这本书，就像我们享受写作的过程一样。希望你觉得它有用，并带走了一些有用的概念和技术。


    # 练习答案


    这些是每章后练习的答案。请记住，许多练习可以用不同的方式解决，因此你的代码不需要与下面提供的代码完全一致也能正常工作。在许多情况下，提供的代码只是一个通用模板，你可以以此为基础开发适合该练习的自己的代码。


