    # MySQL Connectors, Drivers, and PHP Extensions


    Sometimes people use the terms connector and driver interchangeably, this can
    be confusing. In the MySQL-related documentation the term "driver" is reserved
    for software that provides the database-specific part of a connector package.


    ## Extensions


    In the PHP documentation you will come across another term - extension. The PHP
    code consists of a core, with optional extensions to the core functionality. PHP''s
    MySQL-related extensions, such as the `mysqli` extension, and the `mysql` extension,
    are implemented using the PHP extension framework.


    An extension typically exposes an API to the PHP programmer, to allow its facilities
    to be used programmatically. However, some extensions which use the PHP extension
    framework do not expose an API to the PHP programmer.


    The `PDO MySQL driver` extension, for example, does not expose an API to the PHP
    programmer, but provides an interface to the PDO layer above it.


    The terms API and extension should not be taken to mean the same thing, as an
    extension may not necessarily expose an API to the programmer.


    ## PHP MySQL APIs


    PHP offers three main API options to connect to a MySQL server. One of those options,
    however, is deprecated and we will not include it in our discussion. Here are
    the three API options:


    *   **MySQL Extension**; This is deprecated in newer version of PHP;

    *   **MySQLi Extension**;

    *   **PHP Data Objects (PDO)**;


    Each has its own advantages and disadvantages. The following discussion aims to
    give a brief introduction to the key aspects of each API.


    ## mysqli Extension


    The `mysqli` extension, or as it is sometimes known, the MySQL improved extension,
    was developed to take advantage of new features found in MySQL systems versions
    4.1.3 and newer. The `mysqli` extension is included with PHP versions 5 and later.


    The `mysqli` extension has a number of benefits, the key enhancements over the
    `mysql` extension being:


    *   Object-oriented interface

    *   Support for Prepared Statements

    *   Support for Multiple Statements

    *   Support for Transactions

    *   Enhanced debugging capabilities

    *   Embedded server support


    ## PDO Extension


    PHP Data Objects, or PDO, is a database abstraction layer specifically for PHP
    applications. PDO provides a consistent API for your PHP application regardless
    of the type of database server your application will connect to. In theory, if
    you are using the PDO API, you could switch the database server you used, from
    say Firebird to MySQL, and only need to make minor changes to your PHP code.


    Other examples of database abstraction layers include JDBC for Java applications
    and DBI for Perl.


    While PDO has its advantages, such as a clean, simple, portable API, its main
    disadvantage is that it doesn''t allow you to use all of the advanced features
    that are available in the latest versions of MySQL server. For example, PDO does
    not allow you to use MySQL''s support for Multiple Statements.


    # PHPMyAdmin and Getting Familiar with MySQL


    Let''s start by discussing MySQL and the PHPMyAdmin graphical user interface.
    We presume that you would prefer to use this more intuitive option to the command
    line version of MySQL (unless you really want to have more control, in which case,
    go for it!).


    ## Basics


    MySQL is a database server that allows you to create and store multiple databases
    for use. A database is a place where you store all of the data for a given application.
    A database consists of multiple tables with entries. Each row of a table represents
    a database entry and each column of that table represents some particular information.
    Below is a picture of the PHPMyAdmin interface with a database open showing three
    tables inside:


    ![](images/00094.jpeg)


    Below is a picture of a single table showing multiple rows and columns:


    ![](images/00095.jpeg)


    # MySQLi


    ## Dual interface


    The `mysqli` extension features a dual interface. It supports the procedural and
    object-oriented programming paradigm.


    Users migrating from the old `mysql` extension may prefer the procedural interface.
    The procedural interface is similar to that of the old `mysql` extension. In many
    cases, the function names differ only by prefix. Some `mysqli` functions take
    a connection handle as their first argument, whereas matching functions in the
    old `mysql` interface take it as an optional last argument.


    ![](images/00096.jpeg)


    In addition to the classical procedural interface, users can choose to use the
    object-oriented interface. The documentation is organized using the object-oriented
    interface. The object-oriented interface shows functions grouped by their purpose,
    making it easier to get started. The reference section gives examples for both
    syntax variants.


    There are no significant performance differences between the two interfaces. Users
    can base their choice on personal preference.


    ![](images/00097.jpeg)


    ## Connections


    The MySQL server supports the use of different transport layers for connections.
    Connections use TCP/IP, Unix domain sockets or Windows named pipes.


    The hostname `localhost` has a special meaning. It is bound to the use of Unix
    domain sockets. It is not possible to open a TCP/IP connection using the hostname
    `localhost` you must use `127.0.0.1` instead.


    ![](images/00098.jpeg)


    ![](images/00099.jpeg)


    Depending on the connection function used, assorted parameters can be omitted.
    If a parameter is not provided, then the extension attempts to use the default
    values that are set in the PHP configuration file.


    ![](images/00100.jpeg)


    The resulting parameter values are then passed to the client library that is used
    by the extension. If the client library detects empty or unset parameters, then
    it may default to the library built-in values.


    ### Built-in connection library defaults


    If the host value is unset or empty, then the client library will default to a
    Unix socket connection on `localhost`. If socket is unset or empty, and a Unix
    socket connection is requested, then a connection to the default socket on `/tmp/mysql.sock`
    is attempted.


    On Windows systems, the host name `.` is interpreted by the client library as
    an attempt to open a Windows named pipe based connection. In this case the socket
    parameter is interpreted as the pipe name. If not given or empty, then the socket
    (pipe name) defaults to `\\.\pipe\MySQL`.


    If neither a Unix domain socket based not a Windows named pipe based connection
    is to be established and the port parameter value is unset, the library will default
    to port `3306`.


    The `mysqlnd` library and the MySQL Client Library (`libmysqlclient`) implement
    the same logic for determining defaults.


    ### Connection options


    Connection options are available to, for example, set init commands which are
    executed upon connect, or for requesting use of a certain charset. Connection
    options must be set before a network connection is established.


    For setting a connection option, the connect operation has to be performed in
    three steps: creating a connection handle with `mysqli_init()`, setting the requested
    options using `mysqli_options()`, and establishing the network connection with
    `mysqli_real_connect()`.


    ## Executing statements


    Statements can be executed with the `mysqli_query()`, `mysqli_real_query()` and
    `mysqli_multi_query()` functions. The `mysqli_query()` function is the most common,
    and combines the executing statement with a buffered fetch of its result set,
    if any, in one call. Calling `mysqli_query()` is identical to calling `mysqli_real_query()`
    followed by `mysqli_store_result()`.


    ![](images/00101.jpeg)


    After statement execution results can be retrieved at once to be buffered by the
    client or by read row by row. Client-side result set buffering allows the server
    to free resources associated with the statement results as early as possible.
    Generally speaking, clients are slow consuming result sets. Therefore, it is recommended
    to use buffered result sets. `mysqli_query()` combines statement execution and
    result set buffering.

    '
