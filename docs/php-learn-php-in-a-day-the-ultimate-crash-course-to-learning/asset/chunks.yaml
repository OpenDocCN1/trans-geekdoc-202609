    ## Conclusion


    With that we conclude our discussion of PHP File Handling. You would find file
    handling to be useful if you want to store information on your server, but you
    don’t need a construct like a database because you are storing a small amount
    of information that will not change frequently, for example. There are many other
    examples for when File Handling would be useful, but we shall not go into analyzing
    those.


    # Chapter Ten – Object Oriented Programming


    ## Introduction


    Starting with PHP 5, the object model was rewritten to allow for better performance
    and more features. This was a major change from PHP 4. PHP 5 has a full object
    model.


    Among the features in PHP 5 are the inclusions of visibility, abstract and final
    classes and methods, additional magic methods, interfaces, cloning and typehinting.


    Object-oriented programming is a style of coding that allows developers to group
    similar tasks into classes. This helps keep code following the tenet "don''t repeat
    yourself" (DRY) and easy-to-maintain.


    One of the major benefits of DRY programming is that, if a piece of information
    changes in your program, usually only one change is required to update the code.
    One of the biggest nightmares for developers is maintaining code where data is
    declared over and over again, meaning any changes to the program become an infinitely
    more frustrating game of “Where''s Waldo?” as they hunt for duplicated data and
    functionality.

