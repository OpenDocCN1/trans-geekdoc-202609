    # Chapter Eight – Sessions and Cookies


    ## Introduction


    Session support in PHP consists of a way to preserve certain data across subsequent
    accesses. This enables you to build more customized applications and increase
    the appeal of your web site.


    A cookie is often used to identify a user. A cookie is a small file that the server
    embeds on the user''s computer. Each time the same computer requests a page with
    a browser, it will send the cookie too. With PHP, you can both create and retrieve
    cookie values.


    ## Sessions


    Sessions are a simple way to store data for individual users against a unique
    session ID. This can be used to persist state information between page requests.
    Session IDs are normally sent to the browser via session cookies and the ID is
    used to retrieve existing session data. The absence of an ID or session cookie
    lets PHP know to create a new session, and generate a new session ID.


    Sessions follow a simple workflow. When a session is started, PHP will either
    retrieve an existing session using the ID passed (usually from a session cookie)
    or if no session is passed it will create a new session. PHP will populate the
    `$_SESSION` superglobal with any session data after the session has started. When
    PHP shuts down, it will automatically take the contents of the `$_SESSION` superglobal,
    serialize it, and send it for storage using the session save handler.


    By default, PHP uses the internal files save handler which is set by `session.save_handler`.
    This saves session data on the server at the location specified by the `session.save_path`
    configuration directive.


    Sessions can be started manually using the `session_start()` function. If the
    `session.auto_start` directive is set to 1, a session will automatically start
    on request startup.


    Sessions normally shutdown automatically when PHP is finished executing a script,
    but can be manually shutdown using the `session_write_close()` function.


    ![](images/00112.jpeg)


    ![](images/00113.jpeg)


    > **Caution**

    >

    > Do NOT unset the whole `$_SESSION` with `unset($_SESSION)` as this will disable
    the registering of session variables through the `$_SESSION` superglobal.


    ### Passing the Session ID


    There are two methods to propagate a session id:


    *   Cookies

    *   URL parameter


    The session module supports both methods. Cookies are optimal, but because they
    are not always available, we also provide an alternative way. The second method
    embeds the session id directly into URLs.


    PHP is capable of transforming links transparently. Unless you are using `PHP
    4.2.0` or later, you need to enable it manually when building PHP. Under Unix,
    pass `--enable-trans-sid` to configure. If this build option and the run-time
    option `session.use_trans_sid` are enabled, relative URIs will be changed to contain
    the session id automatically.


    Alternatively, you can use the constant `SID` which is defined if the session
    started. If the client did not send an appropriate session cookie, it has the
    form `session_name=session_id`. Otherwise, it expands to an empty string. Thus,
    you can embed it unconditionally into URLs.


    The following example demonstrates how to register a variable, and how to link
    correctly to another page using `SID`.


    ![](images/00114.jpeg)


    ### Custom Session Handlers


    To implement database storage, or any other storage method, you will need to use
    `session_set_save_handler()` to create a set of user-level storage functions.
    As of PHP 5.4.0 you may create session handlers using the `SessionHandlerInterface`
    or extend internal PHP handlers by inheriting from `SessionHandler`.


    The callbacks specified in `session_set_save_handler()` are methods called by
    PHP during the life-cycle of a session: `open`, `read`, `write` and `close` and
    for the housekeeping tasks: `destroy` for deleting a session and `gc` for periodic
    garbage collection.


    Therefore, PHP always requires session save handlers. The default is usually the
    internal ''files'' save handler. A custom save handler can be set using `session_set_save_handler()`.
    Alternative internal save handlers are also provided by PHP extensions, such as
    `sqlite`, `memcache` and `memcached` and can be set with `session.save_handler`.


    When the session starts, PHP will internally call the `open` handler followed
    by the `read` callback which should return an encoded string exactly as it was
    originally passed for storage. Once the `read` callback returns the encoded string,
    PHP will decode it and then populate the resulting array into the `$_SESSION`
    superglobal.


    When PHP shuts down (or when `session_write_close()` is called), PHP will internally
    encode the `$_SESSION` superglobal and pass this along with the session ID to
    the `write` callback. After the `write` callback has finished, PHP will internally
    invoke the `close` callback handler.


    When a session is specifically destroyed, PHP will call the `destroy` handler
    with the session ID.


    PHP will call the `gc` callback from time to time to expire any session records
    according to the set max lifetime of a session. This routine should delete all
    records from persistent storage which were last accessed longer than the `$lifetime`.


    ## Cookies


    PHP transparently supports HTTP cookies. Cookies are a mechanism for storing data
    in the remote browser and thus tracking or identifying return users. You can set
    cookies using the `setcookie()` or `setrawcookie()` function. Cookies are part
    of the HTTP header, so `setcookie()` must be called before any output is sent
    to the browser. This is the same limitation that `header()` has. You can use the
    output buffering functions to delay the script output until you have decided whether
    or not to set any cookies or send any headers.


    ## Exercises


    ### Exercise 1


    In the next PHP exercise, you will request input from the user, then move the
    user''s response from one file to another and do something with it.


    Create two separate files. The first will contain a form with one input field
    asking for the user''s favorite city. Use the `post` method for the form. Although
    this file contains no PHP code, on my localhost, it needs the `.php` extension
    to successfully call the second file.


    The second file will contain PHP code to process the user''s response. (In this
    case, something very simple.) After the user clicks the submit button, echo back
    `Your favorite city is $city.`, where `$city` is the input from the form.


    > **Hint:** The variable that contains the user''s input is an array. Arrays will
    be addressed in future exercises, but this particular array needs to come into
    play here. The array variable is `$_POST[''name'']`, where `''name''` is the name
    of your input field.


    ### Exercise 2


    One very useful thing you can do with PHP is include the request for user input
    and the response in the same file, using conditional statements to tell PHP which
    one to show. For this PHP exercise, rewrite the two files of the previous exercise
    into one file using an `if-else` conditional statement.


    > **Hint:** You''ll need some way to tell if the form has been submitted. The
    function to determine if a variable has been set and is not null is `isset()`.


    ### Exercise 3


    For this PHP exercise, you will use the same format as the previous exercise,
    requesting input in the first part, and responding in the second, through the
    magic of PHP''s `if-else` statement. In the first section, give the user an input
    field and request that they enter a day of the week.


    For the second section, you''ll need the following poem:


    > Laugh on Monday, laugh for danger.

    >

    > Laugh on Tuesday, kiss a stranger.

    >

    > Laugh on Wednesday, laugh for a letter.

    >

    > Laugh on Thursday, something better.

    >

    > Laugh on Friday, laugh for sorrow.

    >

    > Laugh on Saturday, joy tomorrow.


    Using the `else-elseif-else` construction, set each line to output in response
    to the day the user inputs, with a general response for any input that is not
    in the poem.

    '
