    # OOP is intimidating to a lot of developers because it introduces new syntax
    and, at a glance, appears to be far more complex than simple procedural, or inline,
    code. However, upon closer inspection, OOP is actually a very straightforward
    and ultimately simpler approach to programming.


    ## Basics


    Before you can get too deep into the finer points of OOP, a basic understanding
    of the differences between objects and classes is necessary. This section will
    go over the building blocks of classes, their different capabilities, and some
    of their uses.


    Right off the bat, there''s confusion in OOP: seasoned developers start talking
    about objects and classes, and they appear to be interchangeable terms. This is
    not the case, however, though the difference can be tough to wrap your head around
    at first.


    A class, for example, is like a blueprint for a house. It defines the shape of
    the house on paper, with relationships between the different parts of the house
    clearly defined and planned out, even though the house doesn''t exist.


    An object, then, is like the actual house built according to that blueprint. The
    data stored in the object is like the wood, wires, and concrete that compose the
    house: without being assembled according to the blueprint, it''s just a pile of
    stuff. However, when it all comes together, it becomes an organized, useful house.


    Classes form the structure of data and actions and use that information to build
    objects. More than one object can be built from the same class at the same time,
    each one independent of the others. Continuing with our construction analogy,
    it''s similar to the way an entire subdivision can be built from the same blueprint:
    150 different houses that all look the same but have different families and decorations
    inside.


    ### Class


    Basic class definitions begin with the keyword `class`, followed by a class name,
    followed by a pair of curly braces which enclose the definitions of the properties
    and methods belonging to the class.


    The class name can be any valid label, provided it is not a PHP reserved word.
    A valid class name starts with a letter or underscore, followed by any number
    of letters, numbers, or underscores. As a regular expression, it would be expressed
    thus: `^[a-zA-Z_\x7f-\xff][a-zA-Z0-9_\x7f-\xff]*$`.


    A class may contain its own constants, variables (called "properties"), and functions
    (called "methods").


    ![](images/00128.jpeg)


    The pseudo-variable `$this` is available when a method is called from within an
    object context. `$this` is a reference to the calling object (usually the object
    to which the method belongs, but possibly another object, if the method is called
    statically from the context of a secondary object).


    ![](images/00129.jpeg)


    ![](images/00130.jpeg)


    ### New


    To create an instance of a class, the `new` keyword must be used. An object will
    always be created unless the object has a constructor defined that throws an exception
    on error. Classes should be defined before instantiation (and in some cases this
    is a requirement).


    If a string containing the name of a class is used with `new`, a new instance
    of that class will be created. If the class is in a namespace, its fully qualified
    name must be used when doing this.


    ![](images/00131.jpeg)


    In the class context, it is possible to create a new object by `new self` and
    `new parent`.


    When assigning an already created instance of a class to a new variable, the new
    variable will access the same instance as the object that was assigned. This behaviour
    is the same when passing instances to a function. A copy of an already created
    object can be made by cloning it.


    ![](images/00132.jpeg)


    ### Extends


    A class can inherit the methods and properties of another class by using the keyword
    `extends` in the class declaration. It is not possible to extend multiple classes;
    a class can only inherit from one base class.


    The inherited methods and properties can be overridden by redeclaring them with
    the same name defined in the parent class. However, if the parent class has defined
    a method as `final`, that method may not be overridden. It is possible to access
    the overridden methods or static properties by referencing them with `parent::`.


    When overriding methods, the parameter signature should remain the same or PHP
    will generate an `E_STRICT` level error. This does not apply to the constructor,
    which allows overriding with different parameters.


    ![](images/00133.jpeg)


    ### Properties


    Class member variables are called "properties". You may also see them referred
    to using other terms such as "attributes" or "fields", but for the purposes of
    this reference we will use "properties". They are defined by using one of the
    keywords `public`, `protected`, or `private`, followed by a normal variable declaration.
    This declaration may include an initialization, but this initialization must be
    a constant value--that is, it must be able to be evaluated at compile time and
    must not depend on run-time information in order to be evaluated.


    Within class methods non-static properties may be accessed by using `->` (Object
    Operator): `$this->property` (where `property` is the name of the property). Static
    properties are accessed by using the `::` (Double Colon): `self::$property`.


    The pseudo-variable `$this` is available inside any class method when that method
    is called from within an object context. `$this` is a reference to the calling
    object (usually the object to which the method belongs, but possibly another object,
    if the method is called statically from the context of a secondary object).


    ![](images/00134.jpeg)


    ### Constants


    It is possible to define constant values on a per-class basis remaining the same
    and unchangeable. Constants differ from normal variables in that you don''t use
    the `$` symbol to declare or use them.


    The value must be a constant expression, not (for example) a variable, a property,
    a result of a mathematical operation, or a function call.


    As of PHP 5.3.0, it''s possible to reference the class using a variable. The variable''s
    value cannot be a keyword (e.g. `self`, `parent` and `static`). Let''s look at
    some examples:


    ![](images/00135.jpeg)


    ### Autoloading Classes


    Many developers writing object-oriented applications create one PHP source file
    per class definition. One of the biggest annoyances is having to write a long
    list of needed includes at the beginning of each script (one for each class).


    A good way to avoid having to write multiple includes is to use the `spl_autoload_register()`
    function. Here is an example:


    ![](images/00136.jpeg)


    In the example, above, "MyClass" is the name of the class that you are trying
    to instantiate, PHP passes this name as a string to `spl_autoload_register()`,
    which allows you to pick up the variable and use it to "include" the appropriate
    class/file. As a result, you don''t specifically need to include that class via
    an include/require statement...


    Just simply call the class you want to instantiate like in the example above,
    and since you registered a function (via `spl_autoload_register()`) of your own
    that will figure out where all your class are located, PHP will use that function.


    ### Constructors and destructors


    PHP 5 allows developers to declare constructor methods for classes. Classes which
    have a constructor method call this method on each newly-created object, so it
    is suitable for any initialization that the object may need before it is used.


    **Important!**


    Parent constructors are not called implicitly if the child class defines a constructor.
    In order to run a parent constructor, a call to `parent::__construct()` within
    the child constructor is required. If the child does not define a constructor
    then it may be inherited from the parent class just like a normal class method
    (if it was not declared as private).


    ![](images/00137.jpeg)

    '
