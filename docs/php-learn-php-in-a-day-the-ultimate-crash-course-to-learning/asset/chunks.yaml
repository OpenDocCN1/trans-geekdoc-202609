    # MySQL 连接器、驱动程序和 PHP 扩展


    有时人们会混用连接器和驱动程序这两个术语，这可能会造成困惑。在 MySQL 相关文档中，“驱动程序”一词专门用于指代提供连接器包中特定于数据库部分的软件。


    ## 扩展


    在 PHP 文档中，你会遇到另一个术语——扩展。PHP 代码由核心以及用于核心功能的可选扩展组成。PHP 的 MySQL 相关扩展，例如 `mysqli`
    扩展和 `mysql` 扩展，都是使用 PHP 扩展框架实现的。


    扩展通常会向 PHP 程序员暴露 API，以便以编程方式使用其功能。然而，一些使用 PHP 扩展框架的扩展并不向 PHP 程序员暴露 API。


    例如，`PDO MySQL driver` 扩展并不向 PHP 程序员暴露 API，而是为其上层的 PDO 层提供接口。


    API 和扩展这两个术语不应被视为同义词，因为扩展不一定会向程序员暴露 API。


    ## PHP MySQL API


    PHP 提供了三种连接到 MySQL 服务器的主要 API 选项。然而，其中一个选项已被弃用，我们将不在讨论范围内包含它。以下是三种 API 选项：


    *   **MySQL 扩展**；此扩展在较新版本的 PHP 中已被弃用；

    *   **MySQLi 扩展**；

    *   **PHP 数据对象 (PDO)**；


    每种都有其自身的优缺点。以下讨论旨在简要介绍每种 API 的关键方面。


    ## mysqli 扩展


    `mysqli` 扩展，有时也称为 MySQL 增强扩展，是为了利用 MySQL 4.1.3 及更新版本中发现的新特性而开发的。`mysqli` 扩展包含在
    PHP 5 及更高版本中。


    `mysqli` 扩展具有许多优势，相较于 `mysql` 扩展的关键增强包括：


    *   面向对象接口

    *   支持预处理语句

    *   支持多语句

    *   支持事务

    *   增强的调试能力

    *   嵌入式服务器支持


    ## PDO 扩展


    PHP 数据对象，即 PDO，是专门为 PHP 应用程序设计的数据库抽象层。无论应用程序将连接到哪种类型的数据库服务器，PDO 都为 PHP 应用程序提供了一致的
    API。理论上，如果你使用 PDO API，可以将使用的数据库服务器从 Firebird 切换到 MySQL，而只需对 PHP 代码进行微小的更改。


    数据库抽象层的其他示例包括用于 Java 应用程序的 JDBC 和用于 Perl 的 DBI。


    虽然 PDO 有其优势，例如简洁、简单、可移植的 API，但其主要缺点是无法让你使用最新版本 MySQL 服务器中可用的所有高级功能。例如，PDO 不允许你使用
    MySQL 对多语句的支持。


    # PHPMyAdmin 和熟悉 MySQL


    让我们首先讨论 MySQL 和 PHPMyAdmin 图形用户界面。我们假设你更倾向于使用这个更直观的选项，而不是 MySQL 的命令行版本（除非你真的想要更多控制权，那请随意！）。


    ## 基础知识


    MySQL 是一个数据库服务器，允许你创建和存储多个数据库以供使用。数据库是存储给定应用程序所有数据的地方。数据库由包含条目的多个表组成。表的每一行代表一个数据库条目，该表的每一列代表某些特定信息。下图展示了打开一个数据库并显示其中三个表的
    PHPMyAdmin 界面：


    ![](img/00094.jpeg)


    下图展示了一个包含多行多列的单个表：


    ![](img/00095.jpeg)


    # MySQLi


    ## 双重接口


    `mysqli` 扩展具有双重接口。它支持过程式和面向对象编程范式。


    从旧的 `mysql` 扩展迁移的用户可能更倾向于过程式接口。过程式接口类似于旧的 `mysql` 扩展。在许多情况下，函数名称仅前缀不同。一些 `mysqli`
    函数将连接句柄作为其第一个参数，而旧 `mysql` 接口中的匹配函数则将其作为可选的最后一个参数。


    ![](img/00096.jpeg)


    除了经典的过程式接口，用户还可以选择使用面向对象接口。文档是按照面向对象接口组织的。面向对象接口按功能对函数进行分组，使入门更加容易。参考部分提供了两种语法变体的示例。


    两种接口之间没有显著的性能差异。用户可以根据个人喜好进行选择。


    ![](img/00097.jpeg)


    ## 连接


    MySQL 服务器支持对连接使用不同的传输层。连接使用 TCP/IP、Unix 域套接字或 Windows 命名管道。


    主机名 `localhost` 具有特殊含义。它绑定到 Unix 域套接字的使用。无法使用主机名 `localhost` 打开 TCP/IP 连接，必须改用
    `127.0.0.1`。


    ![](img/00098.jpeg)


    ![](img/00099.jpeg)


    根据所使用的连接函数，各种参数可以省略。如果未提供参数，则扩展会尝试使用 PHP 配置文件中设置的默认值。


    ![](img/00100.jpeg)


    生成的参数值随后被传递给扩展所使用的客户端库。如果客户端库检测到空或未设置的参数，则可能会默认使用库内置的值。


    ### 内置连接库默认值


    如果主机值未设置或为空，则客户端库将默认在 `localhost` 上建立 Unix 套接字连接。如果套接字未设置或为空，且请求的是 Unix 套接字连接，则会尝试连接到
    `/tmp/mysql.sock` 上的默认套接字。


    在 Windows 系统上，主机名 `.` 会被客户端库解释为尝试打开基于 Windows 命名管道的连接。在这种情况下，套接字参数被解释为管道名称。如果未给出或为空，则套接字（管道名称）默认为
    `\\.\pipe\MySQL`。


    如果既不建立基于 Unix 域套接字的连接，也不建立基于 Windows 命名管道的连接，且端口参数值未设置，则库将默认使用端口 `3306`。


    `mysqlnd` 库和 MySQL 客户端库 (`libmysqlclient`) 实现了相同的默认值确定逻辑。


    ### 连接选项


    连接选项可用于例如设置连接时执行的初始化命令，或请求使用特定字符集。连接选项必须在建立网络连接之前设置。


    要设置连接选项，连接操作必须分三步执行：使用 `mysqli_init()` 创建连接句柄，使用 `mysqli_options()` 设置请求的选项，以及使用
    `mysqli_real_connect()` 建立网络连接。


    ## 执行语句


    语句可以使用 `mysqli_query()`、`mysqli_real_query()` 和 `mysqli_multi_query()` 函数执行。`mysqli_query()`
    函数最常用，它将语句执行与其结果集的缓冲获取（如果有）结合在一次调用中。调用 `mysqli_query()` 等同于调用 `mysqli_real_query()`
    后跟 `mysqli_store_result()`。


    ![](img/00101.jpeg)


    语句执行后，结果可以一次性检索以由客户端缓冲，也可以逐行读取。客户端结果集缓冲允许服务器尽早释放与语句结果关联的资源。一般来说，客户端消费结果集的速度较慢。因此，建议使用缓冲结果集。`mysqli_query()`
    结合了语句执行和结果集缓冲。

    '
