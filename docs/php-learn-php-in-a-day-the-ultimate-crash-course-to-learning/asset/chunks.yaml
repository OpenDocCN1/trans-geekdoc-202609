    # 为餐厅创建菜单


    为此，你必须使用多维数组。你的菜单必须包含三个主要子类别（将你的数组命名为 `menu`，该数组内的键将作为你的主要子类别）。每个子类别将包含 4 道菜品/食物。对于每道菜品/食物，你需要包含一份配料清单和一份营养信息清单（碳水化合物、糖、蛋白质等）。你必须想出在
    PHP 中实现这一点的最高效方法。（提示：考虑一下你想如何为每道菜创建和组织信息。你是想让键成为菜名，还是想让键自动递增并将菜名包含在数组内部？哪种方式对你来说最合理？哪种方式造成的困惑最少？如果需要，可以在纸上草拟一下）。


    ## 练习 3


    假设你正在为一家餐厅创建一个在线应用程序，你的任务是创建外卖部分。使用上一个练习中的数组为菜单提供数据。创建一个变量来代表三个主要子类别中的一个（它应该具有完全相同的名称）。现在创建一个对应你制作的某一种食物的变量。假设这些变量代表用户选择餐点时做出的选择。


    创建一个字符串，作为显示给用户的消息，包含关于其订单的重要信息。它应该如下所示：


    You picked: {此处为菜名}。


    This meal is made from: {此处为配料清单}。


    The nutritional information for this meal is: {此处为营养信息清单}。


    请考虑字符串连接、单引号与双引号的区别、数组引用。


    # 第三章 – 逻辑、数学及其他表达式和运算


    ## 表达式和运算符简介


    ### 表达式


    PHP 的核心在于表达式。表达式是语言的基本构建块，你编写的几乎任何东西都被视为表达式。表达式更正式的定义是“任何具有值的东西”。


    在其最基本的形式中，表达式是常量和变量。例如，如果你想写 `$var = 42`，你本质上是将 `42` 的值赋给 `$var`。如果在代码的后续部分你写
    `$var2 = $var`，你期望 `$var2` 的值与 `$var` 的值相同，即 `42`。更进一步说，函数（我们尚未涉及）也被视为表达式。函数是一个表达式，其值为该函数返回的任何值。（即使你不熟悉
    PHP 内部的函数，你也应该对数学函数有一些经验。你可以用 `y = f(x)` 的形式来想象这一切，从而了解我们在讨论什么。）


    在 PHP 中很容易混淆运算符与表达式，但为了给你一个两者的大致对比，你可以这样理解：运算符用在表达式内部。有比较表达式和比较运算符。运算符是你使用的符号（即
    `>`、`<`、`==`），而表达式是比较运算的结果（即它评估为 `TRUE` 还是 `FALSE`）。


    我们不会在此深入探讨表达式的更多细节，因为我们希望本书更多地关注实际应用而非理论。


    ### 运算符


    PHP 中运算符的技术定义是“接受一个或多个值（或用编程术语说是表达式）并产生另一个值（因此该结构本身成为一个表达式）的东西”。


    运算符的分组取决于运算符作用的值的数量。有一元运算符，例如逻辑非运算符或递增/递减运算符（分别为 `!`、`++`、`--`）。二元运算符接受两个值。这些是我们熟知的数学运算符（`+`、`-`
    等）。还有一个三元运算符，我们将在讨论逻辑运算符时详细介绍。


    让我们开始分析运算符的类型。


    #### 运算符优先级


    运算符优先级用于确定一个运算符将两个表达式绑定的紧密程度。当不使用括号来强制优先级时，运算符优先级用于确定诸如 `1 + 2 * 4` 这样的表达式的结果。


    当运算符具有相同优先级时，它们的结合性决定了运算符如何分组。例如，如果我们写 `1 - 2 - 4`，结果将是 `-5`，因为减号（`-`）是左结合的。


    就像日常数学一样，你可以在 PHP 中使用括号来强制运算符的优先级。通常建议即使你编写表达式的方式不需要括号，也要使用它们。使用括号是一种最佳实践，能使代码更具可读性，更易于理解。


    以下是所有运算符优先级的综合列表：


    | 结合性 | 运算符 | 更多信息 |

    | --- | --- | --- |

    | 非结合 | `clone` `new` | 分别用于创建对象的克隆或对象的新实例 |

    | 左 | `[]` | 用于读取/写入数组元素。 |

    | 右 | `**` | 用于 PHP 中的指数运算 |

    | 右 | `++` `--` `(int)` `(float)` `(string)` `(array)` `(object)` `(bool)` `@`
    | 这些是递增和递减运算符、类型转换运算符以及错误控制运算符（稍后详述） |

    | 右 | `!` | 逻辑非运算符 |

    | 左 | `*` `/` `%` | 用于乘法、除法和取模（余数）的算术运算符。 |

    | 左 | `+` `-` `.` | 用于加法和减法以及字符串连接的算术运算符。 |

    | 非结合 | `==` `!=` `===` `!==` `<` `>` | 比较运算符 |

    | 左 | `&&` | 逻辑与运算符 |

    | 左 | `||` | 逻辑或运算符 |

    | 左 | `?:` | 三元运算符 |

    | 右 | `=` `+=` `-=` `*=` `**=` `/=` `.=` `%=` `&=` `|=` `^=` `<<=` `>>=` | 赋值运算符
    |

    | 左 | `and` | 逻辑运算符 |

    | 左 | `or` | 逻辑运算符 |


    至此，我们结束关于运算符优先级的讨论。


    #### 算术运算符


    算术运算符的工作方式就像普通数学中的基本算术运算符一样。让我们先看看所有算术运算符的列表，然后再看几个例子。


    | 示例 | 名称 | 结果 |

    | --- | --- | --- |

    | `-$var` | 取反 | 变量的相反数（负数）。 |

    | `$var + $var2` | 加法 | 两个变量的和。 |

    | `$var - $var2` | 减法 | 两个变量的差。 |

    | `$var * $var2` | 乘法 | 两个变量的积。 |

    | `$var / $var2` | 除法 | 两个变量的商。 |

    | `$var % $var2` | 取模 | 第一个变量除以第二个变量的余数。 |

    | `$var ** $var2` | 幂运算 | 将第一个变量提升到第二个变量对应的幂次所得的结果。 |


    使用除法运算符时，请记住，除非两个操作数都是能被整除的整数，否则结果将为浮点数。如果两个操作数是不能被整除的整数，返回值将为浮点数类型。


    取模运算符的操作数在处理前会被转换为整数。数值的小数部分会被去除，剩余的整数部分被使用。


    取模运算符的结果取其符号自被除数。


    让我们看几个例子。


    ```

    ![](img/00034.jpeg)

    ```


    #### 赋值运算符


    最基本的赋值运算符是 `=`。你可能会倾向于认为这是“等于”，但那将是一个错误。该运算符实际上意味着左操作数获取右侧表达式的值。所以本质上你可以把它理解为“被设置为”。有了这个知识，我们可以做一些巧妙且有趣的事情。


    ```

    ![](img/00035.jpeg)

    ```

