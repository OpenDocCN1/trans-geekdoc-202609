    Functions in PHP, like in many other languages, give you the power to create extremely
    versatile and reusable code. Imagine the following situations. You are writing
    a script and you want to perform a certain set of actions. Later on, you need
    to perform the same set of actions, but you have to change a variable to another
    variable, for example. Wouldn’t it be convenient to be able to separate those
    actions out, and just replace the variable as needed? This is where functions
    come in.


    In PHP, functions are broken up into user defined functions and pre-defined functions.
    User defined functions are custom functions that you create inside of your code.
    Pre-defined functions are the functions that PHP comes with.


