    When dealing with arrays, assigning a value to a named key is done using the `=>`
    operator. The precedence of this operator is the same as the precedence of all
    assignment operators.


    In addition to the basic assignment operator, there are a number of "combined
    operators" that come in handy when we want to use shorthand for binary arithmetic
    operations. Let''s say we have a variable `$a` equal to some value. In a later
    part of the code we want to set `$a` to be the previous value of `$a` plus some
    other value. To do that, we can write:


    ![](images/00036.jpeg)


    A simpler way of doing the above would be to use the combined operator for addition:


    ![](images/00037.jpeg)


    These combined operators work for all arithmetic operations as well as for string
    concatenation. Here are a few examples:


    ![](images/00038.jpeg)


    ### Comparison Operators


    Comparison operators allow us to compare two values. Let''s take a look at a list
    of comparison operators.


    | Example | Name | Result |

    | --- | --- | --- |

    | `$var == $var2` | Equal | Returns TRUE if the two variables are equal. Type
    juggling will be implemented if necessary. |

    | `$var === $var2` | Identical | Returns TRUE if the two variables are equal and
    of the same type. |

    | `$var != $var2` | Not equal | Returns TRUE if the two variables are not equal
    after type juggling. |

    | `$var <> $var2` | Not equal | Returns TRUE if the two variables are not equal
    after type juggling. |

    | `$var !== $var2` | Not identical | Returns TRUE if the two variables are not
    equal or they are not of the same type. |

    | `$var < $var2` | Less than | Returns TRUE if the first variable is strictly
    less than the second. |

    | `$var > $var2` | Greater than | Returns TRUE if the first variable is strictly
    greater than the second. |

    | `$var <= $var2` | Less than or equal to | Returns TRUE if the first variable
    is less than or equal to the second. |

    | `$var >= $var2` | Greater than or equal to | Returns TRUE if the first variable
    is greater than or equal to the second. |


    If you are comparing a string with a number or the comparison is between numerical
    strings, the strings are converted to numbers and the comparison is performed
    numerically. The type conversion is not done when using `===` or `!==` as these
    operators check for type as well as value.


    ![](images/00039.jpeg)


    Another conditional operator to be aware of is the ternary operator. The ternary
    operator is essentially a short hand for the `if/else` control structure (more
    on that later). The ternary operator has the form `(some conditional expression)
    ? {do this if true} : {do this if false}`. (The curly brackets are not used, they
    are just there for clarity). Here is an example of a ternary operator as you would
    use it in an application and the corresponding `if/else` statement that it represents:


    ![](images/00040.jpeg)


    You can see that using the ternary operator is a lot shorter than writing out
    the entire `if/else` statement.


    This concludes our overview of comparison operators. We have not extensively covered
    the comparison between variables of different types, but such information can
    be found in the PHP documentation available online so we have decided not to include
    it.


    ### Error Control Operators


    The error control operator is something that should be used cautiously. In PHP,
    the error control operator is the at sign (`@`). When an expression is prepended
    with the error control operator, any error messages associated with that expression
    that would normally be generated will be ignored.


    Using this operator has its downsides because if you prepend it to an expression
    that generates an error that causes script termination, the script will stop without
    telling you why, which is bad for debugging.


    We will not go into examples of using the error control operator, as you would
    rarely have to use it and should try to form your code so that you do not rely
    on it.


    ### Incrementing and Decrementing Operators


    The incrementing and decrementing operators are the ones you would see in C-style
    languages. These operators affect numbers and strings but not arrays and objects.
    Decrementing `NULL` values has no effect, but incrementing a `NULL` value results
    in 1.


    Here is a list of the incrementing and decrementing operators.


    | Example | Name | Result |

    | --- | --- | --- |

    | `++$var` | Pre-increment | Increments the variable by one, then returns the
    value. |

    | `$var++` | Post-increment | Returns the value of the variable, then increments
    the variable by one. |

    | `--$var` | Pre-decrement | Decrements the variable by one, then returns the
    value. |

    | `$var--` | Post-decrement | Returns the value of the variable, then decrements
    the variable by one. |


    Let''s look at a few examples of how these work:


    ![](images/00041.jpeg)


    We can also increment characters. We cannot decrement characters.


    ![](images/00042.jpeg)


    ### Logical Operators


    PHP supports logical operators that allow us to evaluate logical statements. Here
    is a list of logical operators:


    | Example | Name | Result |

    | --- | --- | --- |

    | `$a and $b` | And | Returns TRUE if both variables are true. |

    | `$a or $b` | Or | Returns TRUE if either one of the two variables is true. |

    | `$a xor $b` | Xor (either) | Returns TRUE if either one of the variables is
    true, but not both. |

    | `!$a` | Not | Returns TRUE if the variable is not TRUE. |

    | `$a && $b` | And | Returns TRUE if both variables are true. |

    | `$a || $b` | Or | Returns TRUE if either one of the two variables is true. |


    There are two logical operators for "AND" and for "OR" because they have a different
    order of precedence. The most common usage of logical operators is within an `if/else`
    statement or within the first expression of a ternary operator. Let''s look at
    some examples of logical operators and how they are used.


    ![](images/00043.jpeg)


    ### String Operators


    There are only two types of string operators and we have already seen both of
    them. The first operator is the dot operator (`.`) which concatenates two strings.
    The second operator is the combined concatenating assignment operator (`.=`) which
    appends the argument on the right side to the argument on the left side. You will
    use both very frequently.


    ![](images/00044.jpeg)


    ## Conclusion


    This concludes our overview of the different types of operators and expressions
    inside of PHP. You are getting closer and closer to writing your first real PHP
    applications! You need two more basic building blocks, covered in the next two
    chapters and you will be on your way to coding intermediate and advanced applications!


    ### Exercise 1


    Arithmetic-assignment operators perform an arithmetic operation on the variable
    at the same time as assigning a new value. For this PHP exercise, write a script
    to reproduce the output below. Manipulate only one variable using no simple arithmetic
    operators to produce the values given in the statements.


    Hint: In the script each statement ends with "Value is now $variable."


    Value is now 8.


    Add 2. Value is now 10.


    Subtract 4. Value is now 6.


    Multiply by 5. Value is now 30.


    Divide by 3. Value is now 10.


    Increment value by one. Value is now 11.


    Decrement value by one. Value is now 10.


    ### Exercise 2


    For this PHP exercise, write a script using the following variable:


    `$around = "around";`


    Single quotes and double quotes don''t work the same way in PHP. Using single
    quotes (`'' ''`) and the concatenation operator, echo the following to the browser,
    using the variable you created:


    What goes around comes around.


    ### Exercise 3


    PHP allows several different types of variables. For this PHP exercise, you will
    create one variable and assign it different values, then test its type for each
    value.

