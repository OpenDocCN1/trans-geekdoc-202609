  trans: "\n你可以使用 `echo` 命令将字符串输出到屏幕上。事实上，除了 `array` 和 `object` 类型外，`echo` 可以与任何变量类型一起使用以输出其内容。这是一个非常有用的调试工具，当你需要快速检查某些内容或查找代码中的错误时，应该经常使用它。\n\
    \n好的，现在想象一下，你想要输入一个包含单引号的字符串。你认为输出会是什么？\n\n![](img/00019.jpeg)\n\n你可能仅从语法高亮就能看出这行不通。每当\
    \ PHP 遇到单引号时，它要么开始要么结束一个字符串变量。为了存储单引号，我们需要对其进行转义。在 PHP 中，这是通过反斜杠完成的。如果我们想包含一个反斜杠，也会发生同样的情况。我们必须用另一个反斜杠对其进行转义：\n\
    \n![](img/00020.jpeg)\n\n使用 `echo` 查看上述结果。请记住，反斜杠用于转义。（这意味着 `\\\\n` 不会渲染为换行符）\n\
    \n另一个不能在单引号内使用的东西是变量。例如，以下内容不会在单引号内展开。\n\n![](img/00021.jpeg)\n\n这将不会像你期望的那样显示“Her\
    \ name is Katherine”。\n\n为了使上述示例生效，我们需要将变量和字符串连接起来。在 PHP 中，我们将执行以下操作：\n\n![](img/00022.jpeg)\n\
    \n测试上述代码并确认其有效。如果你想在变量后继续字符串，只需将下一个字符串连接到变量上。换句话说，你使用 `$str . 'your string here'`。只要变量可以转换为字符串，这就会生效（在这种情况下\
    \ PHP 会自动为你完成转换）。\n\n#### 双引号\n\n这是在 PHP 中定义字符串更复杂的方式，但它给你提供了更多的控制和灵活性。在前面的示例中，我们看到\
    \ `\\\\n`、`\\\\t`、`\\\\r` 等在单引号中不起作用。双引号的情况并非如此。双引号允许你使用那些特殊符号。\n\n然而，双引号最有用的地方在于它们解析变量的能力。在双引号内解析变量有两种方法。\n\
    \n##### 简单变量解析\n\n解析变量的简单方法是在字符串内直接使用美元符号：\n\n![](img/00023.jpeg)\n\n如果你想引用数组的元素，可以使用同样的概念。（在阅读下一种变量类型后，你最好回到这一节）。\n\
    \n![](img/00024.jpeg)\n\n##### 复杂变量解析\n\n这被称为复杂解析，是因为它允许你创建更复杂的表达式，而不是因为该方法本身复杂。此方法要求你在变量周围使用花括号。\n\
    \n![](img/00025.jpeg)\n\n一旦你了解了数组、对象和函数，就可以扩展此功能并在它们身上进行测试。\n\n#### 字符串转换\n\n\
    与所有其他变量一样，我们可以将变量转换为字符串。为此，你使用 `(string)` 函数。根据表达式的作用域以及是否需要字符串，PHP 会自动将变量转换为字符串。例如，如果你对变量使用\
    \ `echo`，它会首先将其转换为字符串。数字将被转换为其文本表示形式。这意味着 `10` 将变为 `\"10\"`。不过，数组和对象的表现略有不同。如果你对\
    \ `array` 使用 `echo`，你将得到字符串 `\"Array\"`。同样，如果你对 `object` 使用 `echo`，你将得到字符串 `\"\
    Object\"`。\n\n### 数组\n\n数组是一种有序映射类型。这意味着数组将值关联到特定的键。PHP 中的数组可用于表示字典、向量、列表、栈、队列、树和多维数组（数组的数组）。\n\
    \n数组的创建方式如下：\n\n![](img/00026.jpeg)\n\n注意我们如何为了清晰起见使用了缩进。额外的空白会被 PHP 忽略，但它使我们的代码更易于阅读和管理。\n\
    \n数组的每一行代表一个键值对。每行以逗号结尾，以指示数组中的下一个键值对。数组的最后一个条目不需要在末尾加逗号，但大多数人喜欢加上。许多使用内容管理系统（如\
    \ WordPress、Drupal 等）的人都采用了这一惯例。（保留逗号的想法是，你可以获取整行键值对并在数组中移动它，而无需担心包含逗号的问题）。\n\n\
    数组的键可以是整数或字符串。如果你将其他东西用作数组键，它将自动转换为这两种类型之一。（注意：数组和对象不能用作数组键，因为这会导致错误）。\n\n或者，你并不总是需要提供键。你可以执行以下操作：\n\
    \n![](img/00027.jpeg)\n\n这将通过递增每个键（从 0 开始）自动为你创建键。我们可以检查数组的内容：\n\n![](img/00028.jpeg)\n\
    \n你可以看到数组的第一个条目从键 0 开始。重要的是要记住，对于使用默认键的数组，第一个值总是存储在键 0 下。\n\n你可以使用方括号引用数组的元素。\n\
    \n![](img/00029.jpeg)\n\n尝试使用这种语法并尝试创建数组的数组（多维数组）。换句话说，尝试让一个数组作为某个键的值。这看起来像：\n\
    \n![](img/00030.jpeg)\n\n你将在其中一个练习中有机会练习这一点。\n\n如果你想向现有数组添加新元素，或修改现有数组的元素，请使用方括号语法：\n\
    \n![](img/00031.jpeg)\n\n上述代码输出：\n\n![](img/00032.jpeg)\n\n### 对象\n\n对象将在第 10\
    \ 章中讨论，我们暂时先不谈。\n\n### NULL\n\n`NULL` 值很特殊，它表示一个没有值的变量。发生这种情况的唯一可能方式是：变量被赋值为常量\
    \ `NULL`、变量尚未被赋值，或者变量已被 `unset`（还记得数组部分的最后一个示例吗，我们取消设置了第 2 个条目的值）。\n\n## 结论\n\n\
    本章到此结束！你学到了很多关于 PHP 及其工作原理的知识。你迈出了第一步，这些步骤将在你编写代码时反复用到。本章某些部分可能有点枯燥，但彻底掌握这些基础知识很重要，这样你以后应用时就无需再思考。这里有一些练习来让你动起来，思考如何运用所学知识。\n\
    \n#### 练习 1\n\n给定以下用户数据数组。对其执行指定的操作：\n\n![](img/00033.jpeg)\n\n1. 通过连接数组中的值，创建一个由用户名和姓氏组成的字符串。\n\
    \n2. 假设此数组将存储到其他用户的数据库中。我们要确保所有值均为正确的类型。\n\n   1. 将用户 ID 转换为整数类型；\n   2. 将 admin\
    \ 字段转换为布尔类型；\n\n3. 添加一个键为 `'email'` 的新字段，并将其值设为：`'john.doe@example.com'`。\n\n\
    #### 练习 2\n"
