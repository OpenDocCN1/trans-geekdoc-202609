    # PHP 缓冲结果集与预处理语句


    ## 缓冲结果集


    PHP 应用程序可以在缓冲结果集中自由导航。导航速度很快，因为结果集保存在客户端内存中。请记住，通常扩展客户端比扩展服务器更容易。


    ![](img/00102.jpeg)


    上述示例将输出：


    ![](img/00103.jpeg)


    ## 预处理语句


    MySQL 数据库支持预处理语句。预处理语句或参数化语句用于高效地重复执行同一条语句。


    ### 基本工作流程


    预处理语句的执行分为两个阶段：准备和执行。在准备阶段，语句模板被发送到数据库服务器。服务器执行语法检查并初始化服务器内部资源以供后续使用。


    MySQL 服务器支持使用匿名的、位置占位符 `?`。


    ![](img/00104.jpeg)


    准备阶段之后是执行阶段。在执行期间，客户端绑定参数值并将它们发送到服务器。服务器根据语句模板和绑定的值创建语句，并使用之前创建的内部资源来执行它。


    ![](img/00105.jpeg)


    预处理语句可以重复执行。每次执行时，绑定变量的当前值会被求值并发送到服务器。语句不会被再次解析。语句模板也不会再次传输到服务器。


    ![](img/00106.jpeg)


    上述示例将输出：


    ![](img/00107.jpeg)


    每个预处理语句都会占用服务器资源。语句应在使用后显式立即关闭。如果没有显式关闭，当 PHP 释放语句句柄时，语句将被关闭。


    使用预处理语句并不总是执行语句的最高效方式。仅执行一次的预处理语句比非预处理语句导致更多的客户端-服务器往返通信。这就是为什么上面的 `SELECT` 没有作为预处理语句运行的原因。


    ## 总结


    在本章中，我们介绍了一些与使用 PHP 中的 `MySQLi` API 创建数据库和处理数据库连接相关的概念。你现在应该能够使用 PHPMyAdmin 界面创建自己的数据库，并使用
    PHP 连接到它们。


    # 第七章 – 表单数据


    ## 简介


    PHP 最强大的功能之一就是它处理 HTML 表单的方式。需要理解的基本概念是，任何表单元素都将自动对你的 PHP 脚本可用。


    为了能在 PHP 中使用表单数据，你需要熟悉 HTML 表单。我们不会花太多时间回顾 HTML 表单。这是一个 HTML 表单示例：


    ![](img/00108.jpeg)


    这个表单没有什么特别之处。它是一个纯 HTML 表单，没有任何特殊标签。当用户填写此表单并点击提交按钮时，将调用 `action.php` 页面。或者，你也可以留空
    action 参数，这样该页面的信息将被发送到你当前所在的同一个页面。（本质上，它将刷新页面并使表单数据对你可用）。


    ## 发送表单数据的方法


    发送表单数据有两种方法 – `POST` 和 `GET`。


    `GET` 是一种发送信息更受限且安全性较低的方法（尽管有方法，如使用唯一令牌，可以使 `GET` 稍微安全一些）。`GET` 将表单数据发送到页面的 URL。任何时候你看到一个
    URL 以类似以下内容结尾：`？key=value&key=value&key=value`，你就知道你正在处理 `GET` 数据。


    `POST` 稍微安全一些，因为用户实际上看不到正在发送的信息，而且它允许你发送更多信息。


    这两种方法都可以通过 `$_GET` 和 `$_POST` 超全局数组在 PHP 中使用。


    ### 引用表单中的信息


    你会注意到 HTML 表单的每个输入元素都有自己的名称。此名称对应于相应超全局数组中的一个键。表单的“method”参数标识你是使用 `POST` 还是 `GET`。


    一旦我们提交了表单数据，我们就可以引用数组中相应的元素。例如，如果我们想显示数组中的所有信息，可以这样做：


    ![](img/00109.jpeg)


    我们将获得该数组内所有的键值对。


    ## 安全性


    **重要！！**


    任何时候你处理用户提交的数据，都必须假设使用你网站的用户怀有恶意。始终假设你正在编写一个有人试图入侵的网站。永远不要相信你的用户不会利用你网站中的漏洞。过度安全总比不安全要好。


    涉及到表单数据时，你必须时刻保持谨慎。这样想：当你给用户一个字段让他们输入姓名时，谁能保证他们会在那个字段里输入姓名？如果他们输入一些 PHP 代码怎么办？或者一个
    SQL 查询？又或者一些 JavaScript？你必须是那个确保防止 XSS（跨站脚本攻击）和 SQL 注入的人。这是最常见的两种“网络黑客攻击”类型，如果你不提前考虑，它们会给你带来巨大的麻烦。


    想一下前面示例中的表单。当用户填写此表单并点击提交按钮时，将调用 `action.php` 页面。在这个文件中，你会写类似这样的代码：


    ![](img/00110.jpeg)


    输出将是：


    ![](img/00111.jpeg)


    除了 `htmlspecialchars()` 和 `(int)` 部分，其余部分应该很容易理解。`htmlspecialchars()` 确保任何在 HTML
    中具有特殊含义的字符都被正确编码，这样人们就无法将 HTML 标签或 Javascript 注入到你的页面中。对于年龄字段，既然我们知道它是一个数字，我们可以直接将其转换为整数，这将自动去除任何多余的字符。你也可以通过使用
    filter 扩展让 PHP 自动为你完成此操作。`$_POST[''name'']` 和 `$_POST[''age'']` 变量由 PHP 自动为你设置。上面我们刚介绍了包含所有
    `POST` 数据的 `$_POST` 超全局变量。注意我们表单的 method 是 `POST`。如果我们使用 `GET` 方法，那么我们的表单信息将存在于
    `$_GET` 超全局变量中。


    表单验证是一个广泛的话题，我们将不会在本书中涵盖，但希望这个例子能给你一个关于该做什么的概念。通常，作为你表单处理页面的页面，你会有一系列的 if 语句来检查许多事情。以下是验证表单时你应该做的事情的一般大纲：


    - 如果一个字段很重要，意味着它必须有一个值（例如，用户注册你网站时的密码字段），你必须检查该值是否已设置。例如，使用类似这样的代码：`if(!isset($_POST[''password'']))
    {do sth here};`

    - 通常创建一个错误数组是个好主意。该数组将包含表单发生的所有错误。当你验证且某字段验证失败时，你添加一个错误。最后，你将这些错误显示在页面上，这样用户就知道他们哪里做错了并可以修正他们的输入；

    - 每当你向数据库发送信息时，**始终**使用 `htmlspecialchars()` 函数以确保不会将 HTML/JS/PHP 代码注入到你的代码中。之后你应该使用
    `mysqli_real_escape_string()` 函数。这将转义任何 SQL 字符（如单引号），以防止 SQL 注入。

    - 如果你知道某字段必须是整数或其他数字，将其转换为数字。这样就可以防止任何字符串输入；

    - 始终使用不同类型的输入测试和调试你的表单。把自己当成黑客。你会尝试在表单字段中输入什么来让网站崩溃？


    ## 总结


    '
