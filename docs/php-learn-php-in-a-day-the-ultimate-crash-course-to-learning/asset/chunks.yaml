    # PHP Buffered Results and Prepared Statements


    ## Buffered Results


    PHP applications can navigate freely through buffered results. Navigation is fast
    because the result sets are held in client memory. Please, keep in mind that it
    is often easier to scale by client than it is to scale the server.


    ![](images/00102.jpeg)


    The above example will output:


    ![](images/00103.jpeg)


    ## Prepared Statements


    The MySQL database supports prepared statements. A prepared statement or a parameterized
    statement is used to execute the same statement repeatedly with high efficiency.


    ### Basic Workflow


    The prepared statement execution consists of two stages: prepare and execute.
    At the prepare stage a statement template is sent to the database server. The
    server performs a syntax check and initializes server internal resources for later
    use.


    The MySQL server supports using anonymous, positional placeholder with `?`.


    ![](images/00104.jpeg)


    Prepare is followed by execute. During execute the client binds parameter values
    and sends them to the server. The server creates a statement from the statement
    template and the bound values to execute it using the previously created internal
    resources.


    ![](images/00105.jpeg)


    A prepared statement can be executed repeatedly. Upon every execution the current
    value of the bound variable is evaluated and sent to the server. The statement
    is not parsed again. The statement template is not transferred to the server again.


    ![](images/00106.jpeg)


    The above example will output:


    ![](images/00107.jpeg)


    Every prepared statement occupies server resources. Statements should be closed
    explicitly immediately after use. If not done explicitly, the statement will be
    closed when the statement handle is freed by PHP.


    Using a prepared statement is not always the most efficient way of executing a
    statement. A prepared statement executed only once causes more client-server round-trips
    than a non-prepared statement. This is why the `SELECT` is not run as a prepared
    statement above.


    ## Conclusion


    In this chapter we introduced some concepts related to creating databases and
    handling database connections using the `MySQLi` API in PHP. You should now be
    able to create your own databases using the PHPMyAdmin interface and connect to
    them with PHP.


    # Chapter Seven – Form Data


    ## Introduction


    One of the most powerful features of PHP is the way it handles HTML forms. The
    basic concept that is important to understand is that any form element will automatically
    be available to your PHP scripts.


    In order to be able to use form data inside of PHP, you need to be familiar with
    HTML forms. We won’t spend too much time on reviewing HTML forms. Here is an example
    HTML form:


    ![](images/00108.jpeg)


    There is nothing special about this form. It is a straight HTML form with no special
    tags of any kind. When the user fills in this form and hits the submit button,
    the `action.php` page is called. Alternatively, you could leave the action parameter
    empty and the information from the page will be sent to the same page you are
    on. (Essentially, it will refresh the page and make the form data available to
    you).


    ## Methods for Sending Form Data


    There are two methods for sending form data – `POST` and `GET`.


    `GET` is a more limited and less secure method of sending information (although
    there are ways, such as using unique tokens, to make `GET` a bit more secure).
    `GET` sends the form data to the URL of the page. Anytime you see a URL that ends
    with something that looks something like the following: `?key=value&key=value&key=value`,
    you know that you are dealing with `GET` data.


    `POST` is a bit more secure as users don’t actually get to see the information
    being sent and it allows you to send more information.


    Both of these methods are available to PHP through the `$_GET` and `$_POST` superglobal
    arrays.


    ### Referencing Information from Forms


    You will notice that each input element of the HTML form has its own name. This
    name corresponds to a key in the corresponding superglobal array. The “method”
    parameter of the form identifies whether you are using `POST` or `GET`.


    Once we have the form data submitted we can just reference the corresponding elements
    of the array. For example, if we want to display all the information from the
    array we can do:


    ![](images/00109.jpeg)


    We will get all of the key-value pairs inside of that array.


    ## Security


    **Important!!**


    Anytime you are dealing with user submitted data, you must assume that the user
    using your site has bad intentions. Always assume that you are writing a site
    that someone is trying to hack. Never trust that your users are not going to exploit
    a vulnerability in your site. It’s better to be overly secure than to not be secure.


    When it comes to form data, you have to always be cautious. Think of it this way.
    When you give a user a field for them to type their name, who will guarantee that
    they will type their name in that field? What happens if they type some PHP code?
    Or maybe an SQL query? Or maybe some JavaScript? You have to be the one that makes
    sure you prevent XSS (cross-site scripting) attacks and SQL injection. Those are
    the two most common types of “web hacking” and will cause you intense headaches
    if you don’t think ahead of time.


    Think of the form from the previous example. When the user fills in this form
    and hits the submit button, the `action.php` page is called. In this file you
    would write something like this:


    ![](images/00110.jpeg)


    The output will be:


    ![](images/00111.jpeg)


    Apart from the `htmlspecialchars()` and `(int)` parts, it should be obvious what
    this does. `htmlspecialchars()` makes sure any characters that are special in
    html are properly encoded so people can''t inject HTML tags or Javascript into
    your page. For the age field, since we know it is a number, we can just convert
    it to an integer which will automatically get rid of any stray characters. You
    can also have PHP do this for you automatically by using the filter extension.
    The `$_POST[''name'']` and `$_POST[''age'']` variables are automatically set for
    you by PHP. Above we just introduced the `$_POST` superglobal which contains all
    `POST` data. Notice how the method of our form is `POST`. If we used the method
    `GET` then our form information would live in the `$_GET` superglobal instead.


    Form validation is a wide topic that we will not cover in this book, but hopefully
    this example gives you an idea of what to do. Generally the page that is your
    form processing page, you will have a number of if statements that check a number
    of things. Here is a general outline of what you should do when validating a form:


    - If a field is important, meaning that it must have a value (e.g. a password
    field for a user registering to your site) you have to check whether that value
    is set. For example, use something like: `if(!isset($_POST[''password''])) {do
    sth here};`

    - Generally it is a good idea to create an errors array. This array will contain
    all of the errors that occur with the form. When you validate and a validation
    of a field fails, you add an error. At the end, you display these errors to your
    page so the user knows what they did wrong and can fix their input;

    - Whenever you are sending information to a database, **ALWAYS** use the `htmlspecialchars()`
    function to make sure you don’t get HTML/JS/PHP code injected into your code.
    After that you should use a `mysqli_real_escape_string()` function. This will
    escape any SQL characters (such as the apostrophes) so that you don’t get SQL
    injection.

    - If you know a field has to be an integer, or some other number, cast it to a
    number. That way any string inputs will be prevented;

    - Always test and debug your form with different types of input. Think of yourself
    as a hacker. What would you try putting in the form field to make the site break?


    ## Conclusion

