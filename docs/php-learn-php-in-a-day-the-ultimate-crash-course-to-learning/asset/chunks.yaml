    ### 打开文件


    打开文件的更好方法是使用 `fopen()` 函数。该函数提供的选项比 `readfile()` 函数更多。


    在课程中我们将使用文本文件 "webdictionary.txt"：


    `fopen()` 的第一个参数包含要打开的文件名，第二个参数指定文件应以何种模式打开。如果 `fopen()` 函数无法打开指定文件，以下示例还会生成一条消息：


    ![](img/00122.jpeg)


    | 模式 | 说明 |

    | --- | --- |

    | r | 以只读方式打开文件。文件指针指向文件开头 |

    | w | 以只写方式打开文件。清空文件内容；如果文件不存在则创建新文件。文件指针指向文件开头 |

    | a | 以只写方式打开文件。保留文件现有数据。文件指针指向文件末尾。如果文件不存在则创建新文件 |

    | x | 创建新文件并以只写方式打开。如果文件已存在则返回 FALSE 和错误 |

    | r+ | 以读写方式打开文件。文件指针指向文件开头 |

    | w+ | 以读写方式打开文件。清空文件内容；如果文件不存在则创建新文件。文件指针指向文件开头 |

    | a+ | 以读写方式打开文件。保留文件现有数据。文件指针指向文件末尾。如果文件不存在则创建新文件 |

    | x+ | 创建新文件并以读写方式打开。如果文件已存在则返回 FALSE 和错误 |


    ### PHP 读取文件


    `fread()` 函数从打开的文件中读取数据。


    `fread()` 的第一个参数包含要读取的文件名，第二个参数指定要读取的最大字节数。


