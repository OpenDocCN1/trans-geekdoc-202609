    \ abstraction layer. Let’s start by looking into what APIs are. Some of the following\
    \ content is referenced directly from the PHP Manual.\n\n## What is an API?\n\n\
    An API (Application Programming Interface) defines the classes, methods, functions\
    \ and variables that your application will need to call in order to carry out\
    \ a desired task. In the case of PHP applications that need to communicate with\
    \ databases the necessary APIs are usually exposed via PHP extensions.\n\nAPIs\
    \ can be procedural or object-oriented. With a procedural API you call functions\
    \ to carry out tasks, with the object-oriented API you instantiate classes and\
    \ then call methods on the resulting objects. Of the two the latter is usually\
    \ the preferred interface, as it is more modern and leads to better organized\
    \ code.\n\nWe have not yet covered OOP (object-oriented programming) in PHP, so\
    \ if you are not familiar with the concept, you can skip to chapter 10 of this\
    \ book and then return to this chapter after you have gotten a hang of OOP!\n\n\
    There are several APIs available that will allow you to connect to the MySQL server.\
    \ We will have a discussion of the options and which to choose depending on your\
    \ application.\n\n### Connectors\n\nMySQL provides documentation that explains\
    \ all its terms. The term connector refers to a piece of software that allows\
    \ your application to connect to the MySQL database server. MySQL has a variety\
    \ of connectors depending on your language, including connectors for PHP.\n\n\
    When your application requires a database, you need to write your code to perform\
    \ activities such as connecting to the database server, querying the database,\
    \ updating the database, removing entries and other database-related functions.\
    \  Software is required to provide the API that your PHP application will use,\
    \ and also handle the communication between your application and the database\
    \ server, possibly using other intermediate libraries where necessary. This software\
    \ is known generically as a connector, as it allows your application to connect to\
    \ a database server. \n\n### Drivers\n\nA driver is a piece of software designed\
    \ to communicate with a specific type of database server. The driver may also\
    \ call a library, such as the MySQL Client Library or the MySQL Native Driver.\
    \ These libraries implement the low-level protocol used to communicate with the\
    \ MySQL database server.\n\nBy way of an example, the PHP Data Objects (PDO) database\
    \ abstraction layer may use one of several database-specific drivers. One of the\
    \ drivers it has available is the PDO MYSQL driver, which allows it to interface\
    \ with the MySQL server."
