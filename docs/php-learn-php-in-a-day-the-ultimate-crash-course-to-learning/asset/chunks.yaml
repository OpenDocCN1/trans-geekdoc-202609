- raw: "Create a menu for a restaurant. To do this, you have to use a multidimensional\
    \ array. Your menu has to include three main subcategories (name your arraymenu\
    \ and the keys inside this array will be your main subcategories). Each subcategory\
    \ will include 4 meals/foods. For each meal/food you need to include a list of\
    \ ingredients and a list of nutritional information (carbs, sugars, protein, etc.).\
    \ You have to figure out the most efficient way to do this inside of PHP. (Hint:\
    \ Think about how you want to create and organize the information for each meal.\
    \ Do you want to make the key the name of the meal, or do you want to set the\
    \ key to be automatically incremented and include the name of the meal inside\
    \ the array? Which makes the most sense to you? Which causes the least confusion?\
    \ Sketch it out on paper if need be).\n\n#### Exercise 3\n\nImagine you are creating\
    \ an online application for a restaurant and you are tasked with creating the\
    \ section for deliveries. Use the array from the previous exercise to provide\
    \ yourself with the data for the menu. Create a variable that represents one of\
    \ the three main subcategories (it should have the same exact name). Now create\
    \ a variable that corresponds to one of the foods you made. Suppose that these\
    \ variables represent the choice made by a user when selecting their meal.\n\n\
    Create a string that would be a message displayed to the user with important information\
    \ about their order. It should look like this:\n\nYou picked: {name of meal here}.\n\
    \nThis meal is made from: {list ingredients here}.\n\nThe nutritional information\
    \ for this meal is: {list nutritional information here}.\n\nThink about concatenation,\
    \ single vs. double quotations, array referencing.\n\n# Chapter Three – Logical,\
    \ Math and other Expressions and Operations\n\n## Introduction to Expressions\
    \ and Operators\n\n### Expressions\n\nPHP revolves around expressions. Expressions\
    \ are the basic building blocks of the language and pretty much anything you write\
    \ is considered an expression. A more formal definition of an expression is “anything\
    \ that has a value”.\n\nIn their most basic forms, expressions are constants and\
    \ variables.So for example, if you want to write$var = 42, you are essentially\
    \ assigning the value of42into$var.If in some later part of your code you write$var2\
    \ = $var, you expect the value of$var2to be the same as the value of$var,42.Taking\
    \ this one step further, functions (which we haven’t covered yet), are also considered\
    \ expressions. A function is an expression with the value of whatever value that\
    \ function returns. (Even if you are not familiar with functions inside of PHP,\
    \ you should have some experience with mathematical functions. You can imagine\
    \ all of this in terms ofy=f(x) and you will get an idea of what we are talking\
    \ about.)\n\nIt’s easy to confuse operators with expressions in PHP, but to give\
    \ you a general comparison between the two you can think of them like this. Operators\
    \ are used inside of expressions. There are comparison expressions and comparison\
    \ operators. The operators are the symbol that you use (i.e. >, <, ==), while\
    \ the expression is what the comparison evaluates to (i.e. whether it evaluates\
    \ to TRUE or FALSE).\n\nWe won’t go into more details about expressions here,\
    \ as we want to keep this book more about real life applications instead of theory.\n\
    \n### Operators\n\nThe technical definition of an operator in PHP is “something\
    \ that takes one or more values (or expressions, in programming jargon) and yields\
    \ another value (so that the construction itself becomes an expression)”.\n\n\
    Grouping of operators happens according to the number of values that the operator\
