    # Create a Menu for a Restaurant


    To do this, you have to use a multidimensional array. Your menu has to include
    three main subcategories (name your array `menu` and the keys inside this array
    will be your main subcategories). Each subcategory will include 4 meals/foods.
    For each meal/food you need to include a list of ingredients and a list of nutritional
    information (carbs, sugars, protein, etc.). You have to figure out the most efficient
    way to do this inside of PHP. (Hint: Think about how you want to create and organize
    the information for each meal. Do you want to make the key the name of the meal,
    or do you want to set the key to be automatically incremented and include the
    name of the meal inside the array? Which makes the most sense to you? Which causes
    the least confusion? Sketch it out on paper if need be).


    ## Exercise 3


    Imagine you are creating an online application for a restaurant and you are tasked
    with creating the section for deliveries. Use the array from the previous exercise
    to provide yourself with the data for the menu. Create a variable that represents
    one of the three main subcategories (it should have the same exact name). Now
    create a variable that corresponds to one of the foods you made. Suppose that
    these variables represent the choice made by a user when selecting their meal.


    Create a string that would be a message displayed to the user with important information
    about their order. It should look like this:


    You picked: {name of meal here}.


    This meal is made from: {list ingredients here}.


    The nutritional information for this meal is: {list nutritional information here}.


    Think about concatenation, single vs. double quotations, array referencing.


    # Chapter Three – Logical, Math and other Expressions and Operations


    ## Introduction to Expressions and Operators


    ### Expressions


    PHP revolves around expressions. Expressions are the basic building blocks of
    the language and pretty much anything you write is considered an expression. A
    more formal definition of an expression is “anything that has a value”.


    In their most basic forms, expressions are constants and variables. So for example,
    if you want to write `$var = 42`, you are essentially assigning the value of `42`
    into `$var`. If in some later part of your code you write `$var2 = $var`, you
    expect the value of `$var2` to be the same as the value of `$var`, `42`. Taking
    this one step further, functions (which we haven’t covered yet), are also considered
    expressions. A function is an expression with the value of whatever value that
    function returns. (Even if you are not familiar with functions inside of PHP,
    you should have some experience with mathematical functions. You can imagine all
    of this in terms of `y = f(x)` and you will get an idea of what we are talking
    about.)


    It’s easy to confuse operators with expressions in PHP, but to give you a general
    comparison between the two you can think of them like this. Operators are used
    inside of expressions. There are comparison expressions and comparison operators.
    The operators are the symbol that you use (i.e. `>`, `<`, `==`), while the expression
    is what the comparison evaluates to (i.e. whether it evaluates to `TRUE` or `FALSE`).


    We won’t go into more details about expressions here, as we want to keep this
    book more about real life applications instead of theory.


    ### Operators


    The technical definition of an operator in PHP is “something that takes one or
    more values (or expressions, in programming jargon) and yields another value (so
    that the construction itself becomes an expression)”.


    Grouping of operators happens according to the number of values that the operator
    acts upon. There are unary operators, such as the logical NOT operator or the
    increments operators (`!`, `++`, `--` respectively). Binary operators take two
    values. These are the familiar math operators that we all know (`+`, `-`, etc.).
    There is also a single ternary operator that we will go into more detail when
    discussing logical operators.


    Let’s go into analyzing the types of operators.


    #### Operator Precedence


    Operator precedence is used to determine how tightly an operator binds two expressions
    to one another. Operator precedence is used in cases when you want to determine
    the result of an expression such as `1 + 2 * 4` where parentheses are not used
    to force precedence.


    When operators have equal precedence, their associativity decides how the operators
    are to be grouped. For example, if we write `1 - 2 - 4` this will give us `-5`
    because the minus sign (`-`) is left-associative.


    Like in regular everyday math, you can use parentheses in PHP to force the precedence
    of an operator. It is generally advised to use parentheses even if you have written
    your expression in a way so you don’t need them. Using parenthesis is a best practice
    that makes code more human readable and easier to understand.


    Here is a comprehensive list of all operator precedence:


    | Associativity | Operators | More Information |

    | --- | --- | --- |

    | Non-associative | `clone` `new` | Used to create a clone of an object or a new
    instance of an object respectively |

    | Left | `[]` | Used when reading/writing to elements of an array. |

    | Right | `**` | Used for exponentiation in PHP |

    | Right | `++` `--` `(int)` `(float)` `(string)` `(array)` `(object)` `(bool)`
    `@` | These are the increment and decrement operators and the type casting operators
    and the error control operator (more info about these later) |

    | Right | `!` | Logical negation operator |

    | Left | `*` `/` `%` | Arithmetic operators for multiplication, division and modulo
    (remainder). |

    | Left | `+` `-` `.` | Arithmetic operators for addition and subtraction as well
    as string concatenation. |

    | Non-associative | `==` `!=` `===` `!==` `<` `>` | Comparison operators |

    | Left | `&&` | Logical AND operator |

    | Left | `||` | Logical OR operator |

    | Left | `?:` | Ternary operator |

    | Right | `=` `+=` `-=` `*=` `**=` `/=` `.=` `%=` `&=` `|=` `^=` `<<=` `>>=` |
    Assignment operators |

    | Left | `and` | Logical operator |

    | Left | `or` | Logical operator |


    With that we close our discussion of operator precedence.


    #### Arithmetic Operators


    Arithmetic operators work just like the basic arithmetic operators in regular
    math. Let’s begin by taking a look at a list of all the arithmetic operators and
    then we will look at a few examples.


    | Example | Name | Result |

    | --- | --- | --- |

    | `-$var` | Negation | Opposite (negative) of the variable. |

    | `$var + $var2` | Addition | The sum of the two variables. |

    | `$var - $var2` | Subtraction | The difference of the two variables. |

    | `$var * $var2` | Multiplication | The product of the two variables. |

    | `$var / $var2` | Division | The quotient of the two variables |

    | `$var % $var2` | Modulus | The remainder the first variable divided by the second.
    |

    | `$var ** $var2` | Exponentiation | The result obtained by raising the first
    variable to the power corresponding to the second variable. |


    When using the division operator, it is good to keep in mind that the result will
    be a float unless the two operands are integers that are evenly divisible. If
    the two operands are integers that are not evenly divisible, the returned value
    will be of type float.


    The operands of the modulus operator are converted to integers before processing.
    The decimal part of the value is stripped and the remaining integer is used.


    The result of the modulus operator takes its sign from the dividend.


    Let’s take a look at a couple of examples.


    ```

    ![](images/00034.jpeg)

    ```


    #### Assignment Operators


    The most basic assignment operator is `=`. You might be tempted to think of this
    as an “equals to”, but that would be a mistake. This operator actually means that
    the left operand gets the value of the expression on the right. So essentially
    you can think of this as “gets sets to”. With this knowledge, we can do some tricky
    and interesting things.


    ```

    ![](images/00035.jpeg)

    ```

