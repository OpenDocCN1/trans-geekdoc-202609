    与许多其他语言不同，PHP 不要求你显式声明变量类型，而是根据上下文确定类型。换句话说，你不必显式地告诉 PHP 你想要一个双精度数字还是一个字符串。为了帮助你理解这一点，你可以把变量想象成盒子。想象一排储物柜（就像你在机场或火车站看到的那种）。每个储物柜代表一个变量。每个储物柜都有自己唯一的编号，将其与其他所有储物柜区分开来。如果有人让你打开
    42 号储物柜，你能毫不费力地找到它，也不会将其与其他储物柜混淆（例如 24 号）。同样，PHP 变量名是唯一的，每个 PHP 变量也是唯一的。现在，你打开
    42 号储物柜，发现它是空的。你走到 43 号储物柜，发现里面有一个包裹。你从 43 号取出包裹放入 42 号。在打开储物柜之前，你不知道里面装着什么。检查后，你知道该储物柜里装着什么，并可以按需操作。同样，PHP
    中的变量可以包含你放入的任何内容。本质上，当你检查变量类型时，你是在检查变量内部内容的类型。


    这个解释可能有点令人困惑，但你会很快习惯，并且在处理 PHP 变量时不会有问题。让我们看看 PHP 中的一些变量：


    ### Boolean


    Boolean 是 PHP 中存在的最简单的变量类型。Boolean 用于逻辑语句和表达真值。Boolean 是二元的，意味着它们只取两个值之一：`TRUE`
    或 `FALSE`。话虽如此，让我们看一个 Boolean 变量的示例：


    ![](images/00008.jpeg)


    与许多其他语言一样，PHP 在 Boolean 变量的使用和解释上很灵活。换句话说，我们可以在不明确将它们定义为 `TRUE` 或 `FALSE` 的情况下创建
    Boolean。事实上，以下是 PHP 判定哪些值被视为 `FALSE` 的规则列表：


    *   Boolean 值 `FALSE`；

    *   整数 `0`；

    *   浮点数 `0.0`；

    *   空字符串和字符串 `"0"`；

    *   零个元素的数组；

    *   特殊类型 `NULL`；

    *   由空标签创建的 `SimpleXML` 对象；


    其他所有值都将返回 `true`。


    这意味着我们可以编写以下代码，它将是有效的：


    ![](images/00009.jpeg)


    即使我们还没有介绍 `if` 语句，你也大致能推断出这里会发生什么。隐式 Boolean 变量定义在括号 `()` 内。一旦逻辑操作执行，它将返回 `TRUE`
    或 `FALSE`。


    关于上述示例有几点重要的注意事项：


    PHP 认为整数 `1` 与 `TRUE` 相同。这意味着，如果我们将变量 `var` 定义为 `TRUE`，并将其与整数 `1` 进行比较，逻辑语句将返回
    `TRUE`：


    ![](images/00010.jpeg)


    第二点注意事项：


    我们使用双等号（`==`）来检查一个值是否等于另一个值。不要犯使用单等号（`=`）的错误。


    说了这么多，我们应该介绍类型转换。类型转换是指我们获取一个变量的值并将其从一种类型转换为另一种类型。例如，我们可以有一个值为 `42` 的变量，并想将其转换为
    Boolean。另一个例子是如果我们有一个值为 `42` 的变量，并想将其转换为字符串（稍后详述）。对于 Boolean，类型转换在大多数情况下是不必要的（即你几乎永远不会这样做）。这是因为如果运算符、函数或控制结构需要
    Boolean 作为参数，值会自动转换为 Boolean。然而，为了与其他类型转换保持一致，这是将变量转换为 Boolean 的方法：


    ![](images/00011.jpeg)


    ### Number


    PHP 和大多数编程语言中的数字有不同的“口味”。PHP 中数字的两个子类型是 Integers（整数）和 Floating point numbers（浮点数）。让我们分别看看。


    #### Integers


    根据定义，整数是集合中所有的数字：


    ![](images/00012.jpeg)


    换句话说，整数是所有完整的实数（包括正数、负数和零）。PHP 允许我们以多种方式定义整数。你可以用十进制（基数 10）、八进制（基数 8）、十六进制（基数
    16）或二进制（基数 2）定义整数。要使用八进制表示法表示整数，需要在数字前加上 `0`。要使用十六进制表示法，在数字前加上 `0x`。最后，如果要使用二进制表示法，在数字前加上
    `0b`。这是一个示例：


    ![](images/00013.jpeg)


    请注意我们使用的最后一个函数（如果你不知道什么是函数也不用担心）。


    **Helpful Tip!**


    你可以使用 `var_dump()` 检查变量的类型和内容。该函数接受一个输入作为参数（同样，如果你不完全理解也没关系。这意味着你应该在括号内只放一件东西）。该函数将变量的类型和内容打印到屏幕上。在上面的示例中，屏幕上的输出将如下所示：


    ![](images/00014.jpeg)


    现在尝试在其他变量上使用 `var_dump()`。你注意到什么有趣的东西了吗？你看到每个变量打印到屏幕上的值了吗？它是什么进制的？


    在 32 位系统上，作为整数存储的最大数字的量级为 `21474783647`。任何大于该值的数字将自动转换为 `float` 类型。对于 64 位系统，该数字的量级为
    `9223372036854775807`。任何大于该值的数字将自动转换为 `float` 类型。


    如果你想将变量转换为整数，换句话说将其转换为整数类型，你可以执行以下操作：


    ![](images/00015.jpeg)


    这种类型的转换在许多情况下很有用，但最常见的用途是安全性。本章末尾的练习之一将向你展示整数转换用于安全目的的特定用法。


    #### Floating Point Numbers


    整数是实数和整数的集合，因此逻辑上，浮点数（也称为“floats”、“doubles”或“real numbers”）将包含其他所有内容。即位于整数之间的数字。因此，我们得到了所有实数的集合。话虽如此，必须注意所有计算机在显示数字的精度方面都有限制（这被称为机器
    epsilon）。此外，处理浮点数时可能会出现一些奇怪的差异。我们不会深入探讨，因为这超出了本书的范围，但如果你在处理浮点数时发现任何非直观的结果，请考虑
    PHP 处理浮点数的精度。


    浮点数在 PHP 中可以用以下方式表示：


    ![](images/00016.jpeg)


    ### String


    PHP 中的字符串是一系列字符。你可以用它们来存储文本片段和单词。PHP 将每个字符作为一个字节处理。话虽如此，我们应该注意 PHP 支持的最大字符串大小为
    2GB。有趣的部分在于定义字符串。


    #### Single quotes


    在 PHP 中定义字符串最简单的方法是使用单引号。


    ![](images/00017.jpeg)


    如果我们想在字符串中加入新行会怎样？


    ![](images/00018.jpeg)


    这是 PHP 中有效的语法，但换行符不会被包含在最终输出中。注意 `echo` 函数的使用。上面的代码输出什么？


    **Helpful Tip!**

    '
