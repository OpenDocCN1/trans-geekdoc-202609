- raw: "break ends execution of the current for, foreach, while, do-while or switch structure.\n\
    \nbreak accepts an optional numeric argument which tells it how many nested enclosing\
    \ structures are to be broken out of.\n\nHere is an example of how thebreak command\
    \ works with the optional argument: \n\n![](images/00066.jpeg)\n\n##  \n\n## Continue\n\
    \nThe continue command is similar to the break command, but it does not break\
    \ out of the loop. Instead it continues to the next iteration of the loop. This\
    \ command can be used inside of switch statements as well, but the results of\
    \ that would be the same using a break. You can think of it this way:\n\nContinue\
    \ takes you to just before the last closing curly bracket of your structure. If\
    \ it is a loop, you will go to the next iteration of the loop. For a switch statement,\
    \ when the execution is taken to just before the closing curly bracket, you are\
    \ essentially being taken to the end of the switch statement. \n\nIn contrast,\
    \ break will take you to just outside the last closing curly bracket of your code.\
    \ For a loop that means that you have broken out of the loop. For a switch statement,\
    \ that means that you break out of the switch statement and do not go through\
    \ any of the cases.\n\nAs with the break statement, continue takes an optional\
    \ argument that tells PHP how many levels of enclosing loops it should skip.\n\
    \n## Return \n\nThe return command returns program control to the calling module.\
    \ Execution resumes at the statement following the called module’s invocation.\n\
    \nIf you use return from within a function, the return statement immediately ends\
    \ execution of the current function, and returns the argument of the return as\
    \ the value of the function call.\n\nTry to abstain from using return inside of\
    \ a file that is included in another file as this is bad practice.\n\n## Include\n\
    \nFiles are included based on the file path given or, if none is given, the include\\\
    _path specified. If the file isn't found in the include\\_path, include will finally\
    \ check in the calling script's own directory and the current working directory\
    \ before failing. The include construct will emit a warning if it cannot find\
    \ a file; this is different behavior from require, which will emit a fatal error.\n\
    \nIf a path is defined — whether absolute (starting with a drive letter or \\\\\
    \ on Windows, or / on Unix/Linux systems) or relative to the current directory\
    \ (starting with . or ..) — the include\\_path will be ignored altogether. For\
    \ example, if a filename begins with ../, the parser will look in the parent directory\
    \ to find the requested file.\n\nFor more information on how PHP handles including\
    \ files and the include path, see the documentation for include\\_path.\n\nWhen\
    \ a file is included, the code it contains inherits the variable scope of the\
    \ line on which the include occurs. Any variables available at that line in the\
    \ calling file will be available within the called file, from that point forward.\
    \ However, all functions and classes defined in the included file have the global\
    \ scope.\n\n## Require\n\nRequire is identical to include, except that upon failure,\
    \ it will return an error and execution of the script will stop.\n\n## Require\\\
    _once\n\nThis is similar to require, except require\\_once will check whether\
    \ the file has been included up to that point. If it has, it will not include\
    \ it again. Hence, it will require the file to be included only once.\n\n## Include\\\
    _once\n\nWorks exactly like require\\_once, except it will not produce an error.\n\
    \n## Conclusion\n\nThis is probably one of the most important chapters in the\
    \ book. With the concepts and techniques you learned in this chapter you should\
    \ be able to fully utilize your PHP skills to create amazing applications. The\
    \ control structures introduced here are the basis of each PHP script you will\
    \ write and encounter. Combine these with the next chapters about functions and\
    \ database connections and usage and you will be well on your way to creating\
    \ advanced and complicated web applications. \n\n#### Exercise 1\n\nIn this PHP\
    \ exercise, you will use a conditional statement to determine what gets printed\
    \ to the browser. Write a script that gets the current month and prints one of\
    \ the following responses, depending on whether it's August or not:\n\nIt's August,\
    \ so it's really hot.\n\nNot August, so at least not in the peak of the heat.\n\
    \nHint: the function to get the current month is 'date('F', time())' for the month's\
    \ full name.\n\n#### Exercise 2\n\nIn this PHP exercise, you will put all the\
    \ loops through their paces. Write a script that will print the following to the\
    \ browser:\n\nabc abc abc abc abc abc abc abc abc\n\nxyz xyz xyz xyz xyz xyz xyz\
    \ xyz xyz\n\n1 2 3 4 5 6 7 8 9\n\n1.  Item A\n\n2.  Item B\n\n3.  Item C\n\n4.\
    \  Item D\n\n5.  Item E\n\n6.  Item F\n\nCreate the 'abc' row with a while loop,\
    \ the 'xyz' row with a do-while loop, and the last two sections with for loops.\
    \ Remember to include HTML and source code line breaks in your output. No arrays\
    \ allowed in this solution.\n\n#### Exercise 3\n\nLoops are very useful in creating\
    \ lists and tables. In this PHP exercise, you will use a loop to create a list\
    \ of equations for squares.\n\nUsing a for loop, write a script that will send\
    \ to the browser a list of squares for the numbers 1-12.\n\nUse the format, \"\
    1 \\* 1 = 1\", and be sure to include code to print each formula on a different\
    \ line.\n\n# Chapter Five – Functions\n\n## Introduction\n\nFunctions in PHP,\
    \ like in many other languages, give you the power to create extremely versatile\
    \ and reusable code. Imagine the following situations. You are writing a script\
    \ and you want to perform a certain set of actions. Later on, you need to perform\
