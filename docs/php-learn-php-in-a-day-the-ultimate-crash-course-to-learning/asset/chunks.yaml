    # Conclusion


    This book has found you because you have the ultimate potential.


    It may be easy to think and feel that you are limited but the truth is you are
    more than what you have assumed you are. We have been there. We have been in such
    a situation: when giving up or settling with what is comfortable feels like the
    best choice. Luckily, the heart which is the dwelling place for passion has told
    us otherwise.


    It was in 2014 when our team was created. Our compass was this – the dream of
    coming up with books that can spread knowledge and education about programming.
    The goal was to reach as many people across the world. For them to learn how to
    program and in the process, find solutions, perform mathematical calculations,
    show graphics and images, process and store data and much more. Our whole journey
    to make such dream come true has been very pivotal in our individual lives. We
    believe that a dream shared becomes a reality.


    We want you to be part of this journey, of this wonderful reality. We want to
    make learning programming easy and fun for you. In addition, we want to open your
    eyes to the truth that programming can be a start-off point for more beautiful
    things in your life.


    Programming may have this usual stereotype of being too geeky and too stressful.
    We would like to tell you that nowadays, we enjoy this lifestyle: surf-program-read-write-eat.
    How amazing is that? If you enjoy this kind of life, we assure you that nothing
    is impossible and that like us, you can also make programming a stepping stone
    to unlock your potential to solve problems, maximize solutions, and enjoy the
    life that you truly deserve.


    This book has found you because you are at the brink of everything fantastic!


    Thanks for reading!


