- raw: "Another advantage of developing \"SciPy\" on Python is the accessibility of\
    \ a strong programming language in the development of advanced programs and specific\
    \ apps. Scientific apps using SciPy benefit from developers around the globe,\
    \ developing extra modules in countless software landscape niches. Everything\
    \ produced has been made accessible to the Python programmer, from database subroutines\
    \ and classes as well as \"parallel programming to the web.\" These powerful tools\
    \ are provided along with the \"SciPy\" mathematical libraries.\n\nIPython (Enhanced\
    \ interactive console)\n\n“IPython (Interactive Python)” is an interface or command\
    \ shell for interactive computing using a variety of programming languages. “IPython”\
    \ was initially created exclusively for Python, which supports introspection,\
    \ rich media, shell syntax, tab completion, and history. Some of the functionalities\
    \ provided by IPython include: “interactive shells (terminal and Qt-based); browser-based\
    \ notebook interface with code, text, math, inline plots, and other media support;\
    \ support for interactive data visualization and use of GUI tool kits; flexible\
    \ interpreters that can be embedded to load into your own projects; tools for\
    \ parallel computing”. The architecture of \"IPython\" offers \"parallel and distributed\
    \ computing.\" IPython\" allows the development, execution, debugging, and interactive\
    \ monitoring of parallel applications, thus the \"I (Interactive) in IPython.\"\
    \ The underlying architecture can easily separate parallelism, allowing \"IPython\"\
    \ to assist with multiple parallelism styles including: \"Single program, various\
    \ information (SPMD) parallelism,\" \"Multiple programs, various data (MIMD) parallelism,\"\
    \ \"Message passing using MPI,\" \"Task parallelism,\" \"Data parallelism,\" combinations\
    \ of these methods and even customized user-defined strategies. \n\nThe parallel\
    \ computing functionality has been rendered optional under the \"ipyparallel python\
    \ package,\" with the implementation of \"IPython 4.0\".\n\n“IPython\" often derives\
    \ from \"SciPy stack libraries\" such as \"NumPy\" and \"SciPy,\" frequently installed\
    \ in combination with one of the various “Scientific Python distributions.\" IPython\"\
    \ can also be integrated with select \"SciPy stack libraries,\" primarily \"matplotlib,\"\
    \ which produces inline charts upon use with the \"Jupyter notebook.\" For customization\
    \ of rich object display, Python libraries can be implemented with \"IPython-specific\
    \ hooks.\" For instance, if used in the context of \"IPython,\" \"SymPy\" can implement\
    \ \"rendering of mathematical expressions as rendered LaTeX.\"\n\nSymPy (Symbolic\
    \ mathematics)\n\nDeveloped by Ondřej Čertík and Aaron Meurer, SymPy is \"an open-source\
    \ Python library for symbolic computation.\" It offers algebra computing abilities\
    \ to other apps as a stand-alone app and/or as a library as well as live on the\
    \ internet applications with “SymPy Live” or “SymPy Gamma.” “SymPy” is easy to\
    \ install and test, owing to the fact that it is completely developed in Python\
    \ boasting limited dependencies. SymPy involves characteristics ranging from calculus,\
    \ algebra, discrete mathematics, and quantum physics to fundamental symbolic arithmetic.\
    \ The outcome of the computations can be formatted as the \"LaTeX\" code. In combination\
    \ with a straightforward, expandable codebase in a widespread programming language,\
    \ the ease of access provided by SymPy makes it a computer algebra system with\
    \ a comparatively low entry barrier.\n\nPandas (Data structures and analysis)\n\
    \nPandas provide highly intuitive and user-friendly high-level data structures.\
    \ \"Pandas\" has achieved popularity in the machine learning algorithm developer\
    \ community, with built-in techniques for data aggregation, grouping, and filtering\
    \ as well as results of time series analysis. The Pandas library has two primary\
    \ structures: one-dimensional \"Series\" and two-dimensional \"Data Frames.\"\
    \ \n\nSome of the key features provided by “Pandas” are listed below:\n\n*   A\
    \ quick and effective \"Data Frame object\" with embedded indexing to be used\
    \ in data manipulation activities.\n\n*   Tools to read and write data between internal\
    \ memory data structures and multiple file formats, such as \"CSV\" and text,\
    \ \"Microsoft Excel,\" \"SQL databases,\" and quick \"HDF5 format\".\n\n*   Intelligent\
    \ data alignment and integrated management of incomplete data by achieving automatic label\
    \ driven computational alignment and readily manipulating unorganized data into an\
    \ orderly manner.\n\n*   Flexible reconstructing and pivoting of datasets.\n\n\
    *   Smart label-based slicing and indexing of big data sets, as well as the creation\
    \ of data subsets.\n\n*   Columns can be added to and removed from data structures\
    \ to achieve the desired size of the database.\n\n*   Aggregation or transformation\
    \ of data using a sophisticated \"Group By\" system enabling execution of the\
    \ \"split-apply-combine\" technique on the data.\n\n*   Highly efficient merge and join\
    \ functions of the data set.\n\n*   \"Hierarchical axis indexing\" offers a simple way\
    \ to work in a low dimensional data structure even with high dimensional data.\n\
    \n*   Time-series functionalities, including \"date range generation and frequency\
    \ conversion, moving window statistics, moving window linear regressions, date\
    \ shifting, and lagging.\" Also, the creation of \"domain-specific time offsets\"\
    \ and the capability of joining time series with no data loss.\n\n*   Having most\
    \ of the underlying code in \"Cython\" or \"C,\" Pandas boasts high performance\
    \ and efficiency.\n\n*   Python, in combination with Pandas is being used in a\
    \ broad range of academic and industrial sectors, including Financial Services,\
    \ Statistics, Neurobiology, Economics, Marketing and Advertising, Online Data\
    \ Analytics, among others.\n\nThe two types of Data Structures offered by Pandas\
    \ are: “Pandas DataFrame” and “Pandas Series.”\n\nPandas DataFrame \n\nIt is defined\
    \ as “2-D labeled data structure with columns of a potentially different type”.\
    \ It has a high resemblance to the Excel spreadsheet, as shown in the picture\
    \ below, with multiple similar features for analysis, modification, and extraction\
    \ of valuable insights from the data. You can create a “Pandas DataFrame” by entering\
    \ datasets from “Excel,” “CSV,” and “MySQL database,” among others. \n\n![](images/00003.jpeg)\n\
    \nFor instance, in the picture above, assume “Keys” are represented by the name\
    \ of the columns, and “Values” are represented by the list of items in that column.\
    \ A “Python dictionary” can be used to represent this as shown in the code below:\n\
    \n\"my\\_dict = { \n\n     'name' : \\[\"a\", \"b\", \"c\", \"d\", \"e\",\"f\"\
    , \"g\"\\],\n\n     'age' : \\[20,27, 35, 55, 18, 21, 35\\],\n\n     'designation':\
    \ \\[\"VP\", \"CEO\", \"CFO\", \"VP\", \"VP\", \"CEO\", \"MD\"\\]}\"\n\nThe “Pandas\
    \ DataFrame” can be created from this dictionary by using the code below:\n\n\"\
    import Pandas as PD\n\ndf = pd.DataFrame(my\\_dict)\"\n\nThe resulting “DataFrame”\
    \ is shown in the picture below which resembles the excel spreadsheet:\n\n![](images/00004.jpeg)\n\
    \nIf you would like to define index values for the rows, you will have to add\
    \ the “index” parameter in the “DataFrame ( )” clause as shown below:\n\n\"df\
    \ = pd.DataFrame(my\\_dict, index=\\[1,2,3,4,5,6,7\\])\"\n\nTo obtain “string”\
    \ indexes for the data instead of numeric, use the code below:\n\n\"df = pd.DataFrame(\n\
    \n     my\\_dict, \n\n     index=\\[\"First\", \"Second\", \"Third\", \"Fourth\"\
    , \"Fifth\", \"Sixth\", \"Seventh\"\\])\"\n\nNow, as these index values are uniform,\
    \ you could execute the code below to utilize the “NumPy arrays” as index values:\n\
    \n\"np\\_arr = np.array(\\[10,20,30,40,50,60,70\\])\n\ndf = pd.DataFrame(my\\\
    _dict, index=np\\_arr)\"\n\nSimilar to “NumPy”, the columns of “DataFrame” are\
    \ also homogeneous. You can use dictionary like syntax or add the column name\
    \ with “DataFrame” to view the data type of the column as shown in the code below:\n\
    \n\"df\\['age'\\].dtype    # Dict Like Syntax\n\ndf.age.dtype       # DataFrame.ColumnName\n\
    \ndf.name.dtype      # DataFrame.ColumnName\""
