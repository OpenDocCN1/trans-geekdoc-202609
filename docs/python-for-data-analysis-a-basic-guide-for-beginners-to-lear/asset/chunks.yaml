    Python 是一种非常实用的软件编程语言，正迅速成为大数据分析的标准。它是免费的开源代码，并在多个操作系统上完全标准化，包括 `Windows`、`MacOS`
    和 `Linux`。Python 被誉为一种极其多才多艺、简单易用易学的编程语言，非常适合软件编程初学者。在 1980 年代，Python 由 Guido
    van Rossum 在 `Center Wiskunde & Informatica (CWI), Netherlands` 开发，作为 `ABC language`
    的继任者，并具备管理和与 `Amoeba operating system` 交互的能力。它于 1989 年年底发布。在 2000 年底，Python v2.0
    引入了多种增强功能，例如 `cycle-detecting garbage collector` 和对 `Unicode` 的支持。2008 年 12 月，Python
    v3.0 发布了。我，这导致了 Python 的彻底修订，使其更具向后兼容性。Python v3.0 的几个主要特性已被恢复到版本 `2.6.x` 和 `2.7.x`。


    基于 Python 的软件程序可读性极强，并且往往比用其他编程语言如 `C` 或 `Fortran` 编写的类似程序更简洁。此外，Python 可无缝集成常规模块，这些模块为诸如
    `parsing text data, manipulating and finding disk files, reading and writing compressed
    files, and downloading data from web servers` 等任务提供广泛的功能和算法。Python 配备了所有复杂方法的能力，包括面向对象，这是高级程序员的先决条件。


    Python 与 `C`、`C++` 或 `Fortran` 相当不同，后者要求源代码在执行前先编译成可执行格式。另一方面，Python 没有编译阶段，源代码是逐行处理的。这意味着
    Python 会像脚本一样执行源代码。解释型语言的显著好处是它往往极其灵活；变量无需提前声明，程序可以轻松即时适应。然而，也存在一个缺点，即基于 Python
    的统计丰富程序与基于编译语言的类似程序相比报告更高的执行时间。为了解决这个问题并使 Python 成为数据分析的更优选择，耗时的子程序可以在 `C` 和 `Fortran`
    中编译并以类似 Python 特性的方式导入到 Python 中。


    ## Data Analysis or Machine Learning Libraries


    数据分析或机器学习库


    数据分析库是使用任何给定语言编写的敏感例程和函数。软件开发人员需要一套强大的库来执行复杂任务，而无需重写多行代码。机器学习在很大程度上基于数学优化、概率和统计。


    Python 是数据分析和机器学习领域首选的语言，这归功于持续的开发时间和灵活性。它非常适合开发复杂的模型和生产引擎，这些模型和引擎可以直接插入生产系统。其最大资产之一是拥有大量库，可以帮助开发知识不足的研究人员轻松执行数据分析和机器学习。


    ## Django


    根据 Django 软件基金会，`Django is a free and open-source, high-level Python Web framework
    that encourages rapid development and clean, pragmatic design. Built by experienced
    developers, it takes care of much of the hassle of Web development, so you can
    focus on writing your app without needing to reinvent the wheel`。Django 的主要目标是促进由数据库驱动的复杂网站的开发。其名称归功于著名吉他手
    `Django Reinhardt`，并于 2003 年底由 `Lawrence Journal World` 报纸的计算机科学家 Adrian Holovaty
    和 Simon Willison 开发。2005 年 7 月，`Django` 在 `BSD license` 下发布，并在 2008 年 6 月移交给了
    `Django Software Foundation` 的管理。


    该框架促进了可重用性和组件的易于即插即用、代码更少、连接有限、开发更快以及无重复原则。`Django` 大量使用 Python 来开发配置文档和数据模型。`Django`
    可以配备可选的管理界面，该界面通过内省和模型管理配置动态开发，以允许按需创建、读取、更新和删除文件。许多广为人知的网站都基于 `Django`，例如 `Public
    Broadcasting Service`、`Instagram`、`Mozilla`、`Washington Times`、`Disqus`、`Bitbucket`
    和 `Nextdoor`。


    尽管 `Django` 的基本框架有其命名约定，例如命名可以调用并用于生成 `HTTP responses` 的 `views` 的对象，但它仍可被视为 `model-template-view
    (MTV)` 架构模式。它包含一个 `object-relational mapper (ORM)`，充当数据模型（`Python classes`）和关系数据库（`Model`）之间的中介，一个使用
    `web template system` 或 `View` 处理 `HTTP requests` 的系统，以及一个标准表达式驱动的 `URL dispatcher`
    或 `Controller`。


    底层框架还包含以下列出的功能：


    * 一个 `standalone and lightweight webserver` 用于开发和测试网站。

    * 一个用于序列化和验证 HTML 表单的系统，该系统能够在适当的数据库存储值和这些表单之间进行转换。

    * 一个使用 `object-oriented programming` 中所发现的继承原则的模板系统。

    * 一个 `caching framework`，能够使用多种缓存技术。

    * 对中间件类的支持，该类能够在请求处理的各个阶段介入并执行自定义任务。

    * 一个 `internal dispatcher system`，允许应用程序组件通过预定义的信号相互传递事件。

    * 一个国际化系统，其中包括 `Django` 的各个组件翻译成多种语言。

    * 一个序列化系统，能够生成和读取 `Django` 模型实例的 `XML and/or JSON representations`

    * 一个允许扩展模板引擎功能的系统。

    * 对 `Python` 的集成单元测试框架的接口。

    * `Django REST Framework` 构成了一个强大且灵活的 `Web API construction` 工具包。


    ## Scikit-Learn


    `Scikit-Learn` 已发展成为使用 Python 进行机器学习的黄金标准，提供各种各样的 `supervised and unsupervised
    machine learning algorithms`。它被誉为迄今为止最用户友好和最简洁的机器学习库之一。例如，决策树、聚类、线性和逻辑回归以及 K-means。Scikit-learn
    使用几个基本的 Python 库：`NumPy` 和 `SciPy`，并添加了一组用于数据挖掘任务的算法，包括分类、回归和聚类。它还能够在几行代码内实现诸如特征选择、数据转换和集成方法等任务。


    '
