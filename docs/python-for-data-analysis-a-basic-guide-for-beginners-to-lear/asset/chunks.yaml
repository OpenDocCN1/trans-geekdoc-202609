    “Big data is high-volume, high-velocity, and/or high-variety information assets
    that demand cost-effective, innovative forms of information processing that enable
    enhanced insight, decision-making, and process automation.”


    - Gartner


    ## Analyzing the data


    Depending on the insight that is expected to be achieved by the completion of
    the analysis, any of the following four different types of big data analytics
    approach can be adopted:


    ### Predictive analysis

    This type of analysis is done to generate forecasts and predictions for future
    plans of the company. By the completion of a predictive analysis of the company''s
    big data, the future state of the company can be more precisely predicted and
    derived from the current state of the company. The business executives are keenly
    interested in this analysis to make sure the company day-to-day operations are
    in line with the future vision of the company.


    For example, to deploy advanced analytical tools and applications in the sales
    division of a company, the first step is to analyze the leading source of data.
    Once it believes source analysis has been completed, the type and number of communication
    channels for the sales team must be analyzed. This is followed by the use of machine
    learning algorithms on customer data to gain insight into how the existing customer
    base is interacting with the company''s products or services. This predictive
    analysis will conclude with the deployment of artificial intelligence-based tools
    to skyrocket the company''s sales.


    ### Prescriptive analysis

    Analysis that is carried out by primarily focusing on the business rules and recommendations
    to generate a selective analytical path as prescribed by the industry standards
    to boost company performance. The goal of this analysis is to understand the intricacies
    of various departments of the organization and what measures should be taken by
    the company to be able to gain insights from its customer data by using a prescribed
    analytical pathway. This allows the company to embrace domain specificity and
    conciseness by providing a sharp focus on its existing and future big data analytics
    process.


    ### Descriptive analysis

    All the incoming data received and stored by the company can be analyzed to produce
    insightful descriptions on the basis of the results obtained. The goal of this
    analysis is to identify data patterns and current market trends that can be adopted
    by the company to grow its business. For example, credit card companies often
    require risk assessment results on all prospective customers to be able to make
    predictions on the likelihood of the customer failing to make their credit payments
    and make a decision whether the customer should be approved for the credit or
    not. This risk assessment is primarily based on the customer''s credit history
    but also takes into account other influencing factors, including remarks from
    other financial institutions that the customer had approached for credit, customer
    income, and financial performance as well as their digital footprint and social
    media profile.


    ### Diagnostic analysis

    As the name suggests, this type of analysis is done to "diagnose" or understand
    why a certain event unfolded and how that event can be prevented from occurring
    in the future or replicated if needed. For example, web marketing strategies and
    campaigns often employ social media platforms to get publicity and increase their
    goodwill. Not all campaigns are as successful as expected; therefore, learning
    from failed campaigns is just as important, if not more. Companies can run diagnostic
    analysis on their campaign by collecting data pertaining to the "social media
    mentions" of the campaign, number of campaign page views, the average amount of
    time spent on the campaign page by an individual, number of social media fans
    and followers of the campaign, online reviews and other related metrics to understand
    why the campaign failed, and how future campaigns can be made more effective.


    The big data analysis can be conducted using one or more of the tools listed below:


    * `Hadoop` – Open source data framework.

    * `Python` – Programming language widely used for machine learning.

    * `SAS` – Advanced analytical tool used primarily for big data analysis.

    * `Tableau` – Artificial intelligence-based tool used primarily for data visualization.

    * `SQL` – the Programming language used to extract data from relational databases.

    * `Splunk` – Analytical tool used to categorize machine-generated data

    * `R-programming` – the Programming language used primarily for statistical computing.


    ## Big Data Analysis vs. Data Visualization


    In the wider data community, data analysis and data visualization are increasingly
    being used synonymously. Professional data analysts are expected to be able to
    skillfully represent data using visual tools and formats. On the other hand, new
    professional job positions called "Data visualization expert" and "data artist"
    have hit the market. But companies stool need professionals to analyze their data
    and extract valuable insights from it. As you have learned by now, Data analysis
    or big data analysis is an "exploratory process" with defined goals and specific
    questions that need to be answered from a given set of big data. Data visualization
    pertains to the visual representation of data, using tools as simple as an Excel
    spreadsheet or as advanced as dashboards created using Tableau. Business executives
    are always short on time and need to capture a whole lot of details; therefore,
    the data analyst is required to use effective visualizations that can significantly
    lower the amount of time needed to understand the presented data and gather valuable
    insights from the data.


    By developing a variety of visual presentations from the data, an analyst can
    view the data from different perspectives and identify potential data trends,
    outliers, gaps, and anything that stands out and warrants further analysis. This
    process is referred to as "visual analytics." Some of the widely used visual representations
    of the data are "dashboard reports," "infographics," and "data story." These visual
    representations are considered as the final deliverable from the big data analysis
    process, but in reality, they frequently serve as a starting point for future
    political activities. The two completely different activities of data visualization
    and big data analysis are inherently related and loop into each other by serving
    as a starting point as well as the endpoint of the other activity. The concept
    of data visualization will be explained in detail in chapter 3 of this book.


    ## Data Mining


    Data mining can be defined as “the process of exploring and analyzing large volumes
    of data to gather meaningful patterns and rules.” Data mining falls under the
    umbrella of data science and is heavily used to build artificial intelligence-based
    machine learning models, for example, search engine algorithms. Although the process
    of “digging through data” to uncover hidden patterns and predict future events
    has been around for a long time and referred to as “knowledge discovery in databases,”
    the term “Data mining” was coined as recently as the 1990s.


    Data mining consists of three foundational and highly intertwined disciplines
    of science, namely, "statistics" (the mathematical study of data relationships),
    "machine learning algorithms" (algorithms that can be trained with an inherent
    capability to learn), and "artificial intelligence" (machines that can display
    human-like intelligence). With the advent of big data, Data mining technology
    has been evolved to keep up with the "limitless potential of big data" and affordable
    computing power. The once considered tedious, labor-intensive, and time-consuming
    activities have been automated using advance processing speed and power of the
    modern computing systems.

    '
