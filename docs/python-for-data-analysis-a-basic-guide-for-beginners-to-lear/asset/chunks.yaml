    ## Seaborn (data visualization)


    Seaborn 源自 Matplotlib 库，是一款极受欢迎的可视化库。它是一个高级库，可以生成特定类型的图表，包括热力图、时间序列和箱形图。


    ## TensorFlow


    TensorFlow 可以被定义为一个机器学习平台，提供端到端服务，拥有各种免费和开源资源。它具有多层节点系统，允许快速构建、训练和部署具有大型数据集的人工神经网络。它被誉为“一种简单灵活的架构，可以快速将新想法从概念到代码再到最先进的模型并发表”。例如，Google
    在其图像识别和语音识别工具和技术中使用 TensorFlow 库。


    更高级别的 API 如 `tf.estimator` 可用于指定预定义架构，例如 `linear regressors` 或 `neural networks.`
    下图显示了 TensorFlow 工具包现有的层级结构：


    ![](img/00005.jpeg)


    下图所示的图片提供了不同层级的用途：


    ![](img/00006.jpeg)


    TensorFlow 的两个基本组件是：


    1. 一个 `graph protocol buffer`

    2. 一个 `runtime` 可以执行图


    上面提到的两个组件类似于 `Python` 代码和 `Python interpreter.` 就像 `Python interpreter` 可以在多个硬件系统上运行
    Python 代码一样，TensorFlow 可以在各种硬件系统上运行，如 CPU、GPU 和 TPU。


    为了决定应使用哪种 API(s)，你必须考虑提供最高抽象级别来解决目标问题的 API。更易于使用，但（按设计）灵活性较低的是更高的抽象级别。建议首先从最高级别的
    API 开始，让一切正常工作。如果对于某些独特的建模问题，你需要额外的灵活性，则向下移动一个级别。请注意，每个级别都是建立在较低级别的 API 之上。因此，降低层级应该非常简单。


    对于大多数机器学习模型的发展，我们将使用 `tf.estimator` API，这大大减少了开发所需的代码行数。此外，`tf.estimator` 与 Scikit-Learn
    API 兼容。


