    Companies often run into a situation where data sources required to generate a
    labeled and classified training data set are unavailable. In these situations,
    the use of unsupervised machine learning algorithms is ideal. Unsupervised machine
    learning algorithms are used to identify ways in which machines can create "inferred
    functions" to elucidate a hidden structure from the pile of the unlabeled and
    unclassified data set. These algorithms are capable of exploring the data to identify
    a structure within the mass of information.


    Unlike the supervised machine learning algorithms, the unsupervised algorithms
    fail out to identify the correct output, although they are just as efficient at
    exploring the input data and drawing inferences as the supervised learning algorithms.
    These algorithms can be used for identification of data outliers, generation of
    customized and personalized product recommendations, and classification of text
    topics using techniques like `self-organizing maps`, `singular value decomposition`,
    and `k-means clustering`. For example, the identification of customers with shared
    shopping attributes that can be segmented into specific groups and targeted with
    similar marketing strategies and campaigns. As a result, the unsupervised learning
    algorithms are extremely popular in the online marketing space.


    ## Semi-Supervised Machine Learning Algorithms


    The semi-supervised machine learning algorithms are highly versatile and capable
    of utilizing labeled as well as unlabeled data set to learn from and train themselves.
    These algorithms are a “hybrid” of supervised and unsupervised learning algorithms.
    Typically, the training data set is composed of predominantly unlabeled data with
    a small amount of label data. The use of analytical methods including `prediction`,
    `regression`, and `classification` in combination with semi-supervised learning
    algorithms allows the Machine to significantly improve its learning accuracy and
    training abilities.


    These algorithms are widely used in cases where generating labeled training data
    set from raw data highly resource-intensive and less cost-effective for the company.
    So to avoid additional personnel and equipment cost, companies use semi-supervised
    learning algorithms on their systems. For example, the facial recognition application
    requires a large volume of facial data spread across multiple input sources. The
    preprocessing, processing, classification, and labeling of the raw data obtained
    from sources like web cameras, requires a lot of manpower, and thousands of hours
    of work in order to be used as a training data set.


    ## Reinforcement Machine Learning Algorithms


    The reinforcement machine learning algorithms are much more unique in that it
    learns from the environment. These algorithms perform actions and diligently record
    the results of each action that would have either been a failure resulting in
    an error or reward for successful execution. The two main characteristics that
    distinguish the reinforcement learning algorithms are `trial and error` research
    method and `delayed reward`. The machine repeatedly analyzes input data by using
    a variety of calculations and sending a reinforcement signal for every correct
    or expected output, to eventually optimize the end result. Simple action and reward
    feedback loop are developed by the system to assess, record, and learn which actions
    were successful and led to accurate results in a shorter period of time. The use
    of these algorithms allows the automatic determination of ideal behaviors within
    the constraints of a specific context by the system to, and hence, its capabilities
    and maximize its performance. As a result, the reinforcement machine learning
    algorithms are heavily used in the gaming industry, robotics engineering as well
    as in navigation systems.


    ## Big Data Analytics vs. Machine Learning


    `Machine learning`, `Big Data`, as well as `Big Data Analytics` fall under the
    umbrella of `Artificial Intelligence` technology, which rolls up into the field
    of `Data Science`. Here are some key differences between machine learning and
    big data or big data analytics:


    ### Applications


    Machine learning is used in the development of advanced recommendation engines
    and models that can predict and forecast future events by analyzing and existing
    data. For example, `Google` is using advanced machine learning algorithms and
    the development of their self-driving cars. Virtual personal and home assistance
    devices such as `Amazon Alexa`, `Google Home`, and `Apple HomePod` are all driven
    by advanced machine learning algorithms, working in close collaboration with artificial
    intelligence technology.


    Big data has much wider applicability and can be used for general research purposes
    to gather information regarding specific business queries such as collecting sales
    data, building consumer profiles, and financial research, among other applications
    across industrial domains.


    ### Learning capability


    Machine learning algorithms are self-sufficient and capable of learning from a
    training data set as well as new input data without human assistance. They are
    powerful enough to create the foundation required for the system to learn and
    improve upon itself. Big data analytics is capable of gathering existing data
    and analyzing it for the identification of emerging patterns that can be used
    in its decision-making process. It is always powered by human-controlled analytical
    tools and technologies with no scope of self-learning.


    ### Pattern recognition


    Big data analytics utilizes statistical methods like regression, clustering, and
    classification, to recognize data patterns that can be analyzed to produce logical
    information.


    Machine learning can not only recognize emerging data patterns but apply advanced
    algorithms on these patterns to learn from the data patterns and maximize the
    system performance with every successive iteration.


    ### Data volume and Data type


    Big data pertains to the humongous amount of unstructured, semi-structured, and
    structured data. Advanced analytical tools and technologies are required to process
    these large data sets with a majority of unstructured data to gather valuable
    information.


    Machine learning utilizes relatively smaller data sets that are classified and
    labeled to serve as guiding instructions for the algorithms to learn and improve
    upon itself.


    ### Fundamental Purpose


    The main goal of machine learning is self-improvement solely on the basis of input
    data with little to no human assistance. The promising use of these algorithms
    and the development of smart machines could someday assist in providing answers
    to daunting challenges facing humanity, such as global warming.


    Big data is designed to collect and store the skyrocketing data generated by our
    evolving digital lives. The big data analytics uses pattern recognition technology
    to uncover hidden patterns and insight that can be easily lost in this mass of
    information.


    ## Customer Analytics


    According to SAS, customer analytics can be defined as “processes and technologies
    bad gives organizations the customer insight necessary to deliver offers that
    are anticipated, relevant and timely.” Customer analytics is at the heart of all
    marketing activities and is an umbrella term used for techniques such as `predictive
    modeling`, `data visualization`, `information management`, and `segmentation`.


    ### Importance of Customer Analytics

