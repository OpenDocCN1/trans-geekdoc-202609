    as a successor to the `ABC language` and with the capability of managing and interacting
    with the `Amoeba operating system`. It was launched at the end of the year 1989.
    In late 2000, Python v2.0 was introduced with a variety of enhancements such as
    `cycle-detecting garbage collector` and support for `Unicode`. In December 2008,
    Python v3.0 was released. I, which resulted in a complete revision of Python making
    it more backward-compatible. Several of the main characteristics of Python v3.0
    have been reverted to versions `2.6.x` and `2.7.x`.


    Python-based software programs are extremely readable and tend to be more succinct
    than similar programs written in other programming languages such as `C` or `Fortran`.
    In addition, Python integrates seamlessly with conventional modules that provide
    a wide range of features and algorithms for tasks such as `parsing text data,
    manipulating and finding disk files, reading and writing compressed files, and
    downloading data from web servers`. Python is equipped with capabilities of all
    the sophisticated methods including object-orientation that are prerequisites
    for advanced programmers.


    Python is rather distinct from `C`, `C++`, or `Fortran`, which require that the
    source code is first compiled into an executable format prior to the execution.
    On the other hand, there is no compilation phase in Python, and the source code
    is processed on a line-by-line basis. This means Python will execute the source
    code as though it is written as a script. The significant benefit of an interpreted
    language is that it tends to be extremely versatile; the variables are not required
    to be indicated in advance, and the program can easily adapt on the fly. However,
    there is also a drawback, in that statistically-rich programs based on Python
    report higher execution time in comparison to similar programs based on compiled
    languages. To address this issue and make Python a preferable option for data
    analysis, time-consuming subroutines could be compiled in `C` and `Fortran` and
    imported into Python in a way that resembles Python features.


    ## Data Analysis or Machine Learning Libraries


    Data Analysis libraries are sensitive routines and functions that are written
    in any given language. Software developers require a robust set of libraries to
    perform complex tasks without needing to rewrite multiple lines of code. Machine
    learning is largely based on mathematical optimization, probability, and statistics.


    Python is the language of choice in the field of data analysis and machine learning
    credited to consistent development time and flexibility. It is well-suited to
    develop sophisticated models and production engines that can be directly plugged
    into production systems. One of its greatest assets being an extensive set of
    libraries that can help researchers who are less equipped with developer knowledge
    to easily execute data analysis and machine learning.


    ## Django


    According to the Django Software Foundation, `Django is a free and open-source,
    high-level Python Web framework that encourages rapid development and clean, pragmatic
    design. Built by experienced developers, it takes care of much of the hassle of
    Web development, so you can focus on writing your app without needing to reinvent
    the wheel`. The main objective of Django is to facilitate the development of sophisticated
    websites that are driven by databases. Its name is credited to the famous guitarist
    `Django Reinhardt` and was developed in late 2003 by computer scientists at the
    `Lawrence Journal World` newspaper, Adrian Holovaty and Simon Willison. In July
    2005, `Django` was launched under a `BSD license` and was rolled up to the management
    of the `Django Software Foundation` in June 2008.


    This framework promotes reusability and easy plugging in of the component, fewer
    codes, limited connection, faster development, and the no repetition principle.
    `Django` extensively uses Python for the development of configuration documents
    and data models. `Django` can be equipped with an optional administrative interface,
    which is dynamically developed by introspection and administrative model configurations
    to allow creating, reading, updating, and deleting files as needed. Several of
    the widely renowned websites are based on `Django`, such as `Public Broadcasting
    Service`, `Instagram`, `Mozilla`, `Washington Times`, `Disqus`, `Bitbucket`, and
    `Nextdoor`.


    Although the fundamental framework of `Django` has its naming conventions, like
    naming the objects that can be called and used to generate `views` of the `HTTP
    responses`, it could still be considered a `model-template-view (MTV)` architectural
    pattern. It comprises of an `object-relational mapper (ORM)` that acts as a mediator
    between data models (`Python classes`) and a relational database (`Model`), a
    system to process `HTTP requests` using a `web template system` or `View`, and
    a standard expression driven `URL dispatcher` or `Controller`.


    The underlying framework also contains the features listed below:


    * A `standalone and lightweight webserver` to develop and test the websites.

    * A system to serialize and validate HTML forms, which is capable of translating
    between appropriate database storage values and these forms.

    * A template system using the principle of inheritance as found in the `object-oriented
    programming`.

    * A `caching framework`, which is capable of using a variety of caching techniques.

    * Support for middleware classes, which are capable of intervening and performing
    custom tasks at different phases of request processing.

    * An `internal dispatcher system` allowing application components to relay occurrences
    to one another, through pre-defined signals.

    * An internationalization system, which includes translations of various components
    of `Django` into a multitude of languages.

    * A serialization system, which is capable of producing and reading `XML and/or
    JSON representations` of the `Django` model instances

    * A system that allows extension of the template engine functionality.

    * An interface to the integrated unit test framework of `Python`.

    * `Django REST Framework` constitutes a strong and adaptable `Web API construction`
    toolkit.


    ## Scikit-Learn


    `Scikit-Learn` has evolved as the gold standard for machine learning using Python,
    offering a wide variety of `supervised and unsupervised machine learning algorithms`.
    It is touted as one of the most user-friendly and cleanest machine learning libraries
    to date. For example, decision trees, clustering, linear and logistics regressions,
    and K-means. Scikit-learn uses a couple of basic Python libraries: `NumPy` and
    `SciPy` and adds a set of algorithms for data mining tasks, including classification,
    regression, and clustering. It is also capable of implementing tasks like feature
    selection, transforming data and ensemble methods in only a few lines.

    '
