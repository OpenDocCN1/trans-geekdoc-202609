  trans: '


    人工智能驱动的图像识别和分析技术的飞速发展带来了令人惊叹的视觉搜索功能。随着 Google Lens 等技术的推出以及 Pinterest 等平台的出现，人们现在可以使用视觉搜索功能找到彼此在视觉上相似的结果。视觉搜索的工作方式与传统的基于文本的搜索相同，后者会显示相似主题的结果。主要零售商和营销公司越来越多地使用视觉搜索来提供增强且更具吸引力的客户体验。视觉搜索可用于改进商品陈列，并根据产品的风格而不是消费者的过去行为或购买记录提供产品推荐。


    Target 和 Asos 在其电子商务网站的视觉搜索技术开发方面投入了大量资金。2017 年，Target 宣布与 interest 合作，允许将 Pinterest
    的视觉搜索应用 “Pinterest lens” 集成到 Target 的移动应用程序中。因此，购物者可以在外出时拍摄他们想要购买的产品的照片，并在 Target
    的电子商务网站上找到类似商品。同样，由 Asos 推出的视觉搜索应用 “Asos’ Style Match” 允许购物者在 Asos 网站或应用程序上拍照或上传图像，并在其产品目录中搜索类似商品。这些工具通过帮助购物者即使不知道产品名称也能为理想产品购物，吸引购物者前往零售商购买他们可能在杂志上或外出时遇到的商品。


    图像识别极大地帮助营销公司在社交媒体上占据优势，使其能够找到其品牌标志和产品在跟上视觉趋势方面的各种用途。这种现象也被称为“视觉社交聆听”，使公司能够识别和了解客户在何处以及如何与他们的品牌、标志和产品互动，即使公司没有直接被其名称提及。


    ## 医疗行业


    随着医疗数据的日益普及，大数据分析给医疗保健带来了范式转变。医疗行业大数据分析的主要重点是对患者结果与所使用的治疗或预防技术之间的关系进行分析。由大数据分析驱动的人工智能程序已成功开发用于患者诊断、治疗方案生成、药物开发以及患者监测和护理。强大的
    AI 技术可以筛选海量的临床数据，并帮助解锁临床相关信息以协助决策。


    一些大数据分析为基础的 AI 研究和应用日益增多的医学专业是：


    * 放射学 – AI 解读影像结果的能力补充了临床医生检测图像中肉眼容易遗漏的变化的能力。斯坦福大学最近创建的一项 AI 算法可以检测肺炎患者的肺部特定部位。

    * 电子健康记录 – 为了优化信息的传播和访问，对数字健康记录的需求需要快速、准确地记录所有与健康相关的数据到系统中。人类容易出错，且可能受到认知过载和倦怠的影响。该过程已成功由
    AI 自动化。电子健康记录数据上的预测模型的使用使得能够以 70-72% 的准确率在基线预测个体化治疗反应。

    * 影像学 – 正在进行的人工智能研究正在帮助医生评估矫正性颌骨手术的结果以及评估腭裂治疗以预测面部吸引力。


    ## 娱乐行业


    大数据分析与人工智能的协调日益在娱乐来源的后台运行，从电子游戏到电影，并为我们提供更丰富、更吸引人、更逼真的体验。Netflix 和 Hulu 等娱乐提供商正在使用大数据分析，根据个人用户的历史活动和行为为用户提供个性化推荐。计算机图形和数字媒体内容制作商一直在使用基于大数据分析的工具来提高其制作流程的速度和效率。电影公司越来越多地在电影预告片和广告的开发以及制作前和制作后流程中使用机器学习算法。例如，大数据分析和人工智能驱动的工具
    “RivetAI” 使制片人能够自动化并出色地读取电影剧本分解、分镜、预算、排期和镜头清单生成等流程。使用人工智能可以轻松自动化电影后期制作期间进行的某些耗时任务，例如电影片段的同步和组装。


    ## 营销和广告


    作为大数据分析结果开发的机器学习算法可以轻松地使用文本、静止图像和视频片段作为数据源进行训练。然后它可以从这些来源中提取对象和概念，并推荐高效的营销和广告解决方案。例如，阿里巴巴开发的名为
    “Luban” 的工具可以以比人类设计师快得多的速度创建横幅。在 2016 年，中国网络购物狂欢节“双十一”期间，Luban 以每秒 8000 个横幅设计的速度生成了一亿一千七百万个横幅设计。


    “20th Century Fox” 与 IBM 合作使用其 AI 系统 “Watson” 来制作其恐怖电影 “Morgan” 的预告片。为了学习应出现在标准恐怖电影预告片中的适当“时刻”或片段，Watson
    被训练来对来自超过一百部恐怖电影的音频视觉和其他构成元素输入的“时刻”进行分类和分析。这种训练导致 Watson 在短短 24 小时内制作出一个六分钟的电影预告片，而这本需要人类专业人士花费数周时间制作。


    通过使用机器学习、计算机视觉技术、自然语言处理和预测分析，营销流程可以通过 AI 营销平台呈指数级加速。例如，由 Albert Intelligence Marketing
    开发的人工智能营销平台能够生成自主的活动管理策略、创建定制解决方案并执行受众定位。该公司报告称，其客户交易率提高了 183%，对话效率提高了 600% 以上，这归功于其基于
    AI 的平台的使用。


    2016 年 3 月，由 McCann Erickson Japan 推出的基于人工智能的创意总监 “AI-CD ß” 作为有史以来开发的第一个机器人创意总监而推出。“AI-CD
    ß” 在各种电视节目的精选元素以及过去 10 年全日本广播电视 CM 节的获奖作品上接受了培训。利用数据挖掘能力，“AI-CD ß” 可以提取满足每个客户个人活动需求的想法和主题。


    ## 用户体验个性化


