    ## Velocity

    数据能够被收集并采取行动的速度是大数据速度的首要因素。公司越来越多地使用本地和基于云的服务器的组合来提高数据收集的速度。现代的“智能产品和设备”需要实时访问消费者数据，以便能够为他们提供更具吸引力和增强的用户体验。


    ## Variety

    传统上，数据集主要包含结构化数据，而非结构化和半结构化数据量很低，但大数据的出现催生了新的非结构化数据类型，如视频、文本和音频，这些数据类型需要复杂的工具和技术来清理和处理，以便从中提取有意义的见解。


    ## Veracity

    另一个必须考虑的大数据分析的“V”是真实性。这指的是数据的“可信度或质量”。例如，像“Facebook”和“Twitter”这样的社交媒体平台，以及包含 hashtag、缩写和各种打字错误的博客和帖子，会显著降低数据集的可靠性和准确性。


    ## Value

    数据已演变为一种具有内在价值的自身货币。就像传统货币一样，大数据的最终价值与从中获得的洞察力成正比。


    ## History of Big Data

    大量数据的起源可以追溯到 1960 年代和 1970 年代，当时第三次工业革命刚刚开始启动，关系数据库的开发也随之开始，同时数据中心的建设也在进行。但大数据的概念最近才成为焦点，主要是由于像
    Google 和 Yahoo 这样的免费搜索引擎、像 YouTube 这样的免费在线娱乐服务以及像 Facebook 这样的社交媒体平台的出现。2005 年，企业开始认识到通过这些平台和服务产生的大量用户数据，并在同一年，一个名为
    `Hadoop` 的开源框架被开发出来，用于收集和分析公司可用的这些大型数据倾倒。在同一时期，一种非关系型或分布式数据库 `NoSQL` 开始流行起来，因为它能够存储和提取非结构化数据。`Hadoop`
    使公司能够以较高的便利性和相对较低的成本处理大数据。


    如今，随着尖端技术的兴起，不仅人类，而且机器也在产生数据。智能设备技术如 `Internet of things` (`IoT`) 和 `Internet
    of systems` (`IoS`) 使大数据的量急剧增加。我们的日常家用物品和智能设备都连接到互联网，能够跟踪和记录我们的使用模式以及我们与这些产品和服务的互动，并将所有这些数据直接输入大数据。机器学习技术的出现进一步增加了每天产生的数据量。据估计，到
    2020 年，每人每秒将产生 `1.7 MB` 的数据。随着大数据将继续增长，其可用性仍有许多需要跨越的界限。


    ## Importance of Big Data

    要从数据集中获得可靠和可信的信息，拥有一个完整的数据集非常重要，而这正是大数据技术所实现的。我们拥有的数据越多，就能从中提取越多的信息和细节。为了获得问题的
    360 度全景及其潜在解决方案，大数据的未来非常光明。以下是大数据使用的一些示例：


    **Product development** – 大型和小型电子商务企业越来越多地依赖大数据来了解客户需求和期望。公司可以通过使用其过去和现有产品和服务的主要特征来开发预测模型，以推出新产品和服务，并生成描述这些特征与这些产品和服务商业成功之间关系的模型。例如，一家领先的快速制造商业用品公司
    `Procter & Gamble` 在新产品发布准备期间广泛使用从社交媒体网站、测试市场和焦点小组收集的大数据。


    **Predictive maintenance** – 为了避免项目潜在的机械和设备故障，必须分析大量非结构化数据，例如错误消息、日志条目和机器的正常温度，以及可用的结构化数据，例如设备的品牌和型号以及制造年份。通过使用所需的分析工具分析这一大数据集，公司可以通过提前准备计划性维护并预测潜在机械故障的未来发生来延长设备的使用寿命。


    **Customer experience** – 精明的客户了解所有技术进步，并且只忠于最具吸引力和增强的用户体验。这在公司之间引发了一场竞争，以通过分析从客户与公司产品和服务互动中收集的数据来提供独特的客户体验。提供个性化推荐和优惠以降低客户流失率并有效地将潜在客户转化为付费客户。


    **Fraud and compliance** – 大数据有助于识别数据模式并评估先前欺诈交易的歷史趋势，从而有效检测和防止潜在的欺诈交易。银行、金融机构和在线支付服务如
    `PayPal` 不断监控和收集客户交易数据，以努力防止欺诈。


    **Operational efficiency** – 在大数据预测分析的帮助下。公司可以通过分析生产能力、客户反馈以及关于畅销商品和产品退货的数据来学习和预测未来需求和产品趋势，从而改善决策并生产符合当前市场趋势的产品。


    **Machine learning** – 为了使机器能够自行学习和训练，它需要庞大的数据量，即大数据。包含结构化、半结构化和非结构化数据的坚实训练集将帮助机器对现实世界及其被设计解决的问题形成多维视角。


    **Drive innovation** – 通过研究和理解人类与其电子设备以及这些设备的制造商之间的关系，公司可以通过检查当前产品趋势并满足客户期望来开发改进和创新的产品。


    “大数据的重要性并不在于你有多少数据，而在于你用它做什么。你可以从任何来源获取数据并分析它，以找到答案，从而实现 1) 成本降低，2) 时间缩短，3) 新产品开发和优化产品，以及
    4) 智能决策。”- `SAS`


    ## The Functioning of Big Data

    从大数据中获得洞察需要三个重要行动：


    **Integration** – 传统的 `ETL` (`Extract, Transform, Load`) 等数据集成方法无法从大数据核心的各种不相关来源和应用程序中汇集数据。需要先进的工具和技术来分析比传统数据集大得多的指数级大数据集。通过从这些不同的来源集成大数据，公司能够分析和提取有价值的见解来发展和维护其业务。


