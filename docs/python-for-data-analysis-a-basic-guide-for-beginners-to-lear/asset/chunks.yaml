    # Customer analytics has evolved as the backbone of the marketing industry


    This is a direct result of the advent of "smart consumer" who is more aware and
    connected to one another than ever before and willing to take their business elsewhere
    at a moment''s notice. The smart customer has seamless access to a variety of
    information including the best products and services available in the market and
    where can they find the best deals to make the most of their money. Therefore,
    companies are required to be proactive and be able to predict consumer behavior
    when interacting with their products and to be in a position to take the required
    action to convert the prospective customer into a paying client. To generate more
    accurate forecasts and predictions of customer behavior, companies must have a
    solid understanding of their customers'' buying habits and lifestyle choices.
    These near accurate predictions will provide the company with an edge over the
    competition and help achieve higher conversion rates in their sales and marketing
    funnel.


    ## One of the best customer analytics solution in the market today


    One of the best customer analytics solution in the market today is “SAS Customer
    Intelligence,” which claims to have the following applications:


    * Achieve higher customer loyalty and response rates.

    * Generate personalized customer offers and messages to reach the right customer
    at the right time.

    * Identify prospective customers with similar attributes and a high likelihood
    of conversion so the company can reduce costs on their targeted marketing strategies
    and campaigns.

    * Reduce customer attrition by generating accurate predictions on customers that
    are more likely to take their business somewhere else and developing proactive
    marketing campaigns to retain them.


    “The insights derived from our new analytics capabilities are allowing us to find
    the sweet spots that will continue to drive loyalty, profitability, and sustainable
    growth.”


    \- Carrie Gray, Executive Director for Medium Business Marketing, Verizon


    ## Predictive Analytics Marketing


    According to SAS, predictive analytics is the “use of data, statistical algorithms,
    and machine learning techniques to identify the likelihood of future outcomes
    based on historical data. The goal is to go beyond knowing what has happened to
    provide the best assessment of what will happen in the future". Today, companies
    are digging through their past with an eye on the future, and this is where artificial
    intelligence for marketing comes into play, with the application of predictive
    analytics technology. The success of predictive analytics is directly proportional
    to the quality of big data collected by the company.


    Here are some of the widely used predictive analytics applications for marketing:


    ### Predictive Analysis for Customer Behavior


    For the industrial giants like "Amazon," "Apple," and "Netflix," analyzing customer
    activities and behavior is fundamental to their day-to-day operations. Smaller
    businesses are increasingly following in their footsteps to implement predictive
    analysis in their business model. The development of a customized suite of predictive
    models for a company is not only capital-intensive but also requires extensive
    manpower and time. Marketing companies like "AgilOne” offer relatively simple
    predictive model types with wide applicability across industrial domains. They
    have identified three main types of predictive models to analyze customer behavior,
    which are:


    “`Propensity models`” – These models are used to generate “true or accurate” predictions
    for customer behavior. Some of the most common propensity models include: “predictive
    lifetime value,” “propensity to buy,” “propensity to turn,” “propensity to convert,”
    “likelihood of engagement,” and “propensity to unsubscribe.”


    “`Cluster models`” – These models are used to separate and group customers based
    on shared attributes such as gender, age, purchase history, and demographics.
    Some of the most common cluster models include "product-based or category base
    clustering," "behavioral customs clustering," and "brand based clustering."


    “`Collaborative filtering`” – These models are used to generate products and services
    and recommendations as well as to recommended advertisements based on prior customer
    activities and behaviors. Some of the most common collaborative filtering models
    include "upsell," "cross-sell," and "next sell" recommendations.


    The most significant tool used by companies to execute predictive analytics on
    customer behavior is "`regression analysis`," which allows the company to establish
    correlations between the sale of a particular product and the specific attributes
    displayed by the purchasing customer. This is achieved by employing "`regression
    coefficients`," which are numeric values depicting the degree to which the customer
    behavior is affected by different variables and developing a "`likelihood score`"
    for the future sale of the product.


    ### Predictive Data Analysis using Scikit-Learn library


    To understand how `Scikit-Learn` library is used in the development of the “Predictive
    Data Analysis” or machine learning model, let us use the “`Sales_Win_Loss` data
    set from IBM’s Watson repository” containing data obtained from sales campaign
    of a wholesale supplier of automotive parts. We will build a machine learning
    model to predict which sales campaign will be a winner and which will incur a
    loss.


    The data set can be imported using `Pandas` and explored using `Pandas` techniques
    such as “`head()`”, “`tail()`”, and “`dtypes()`.” The plotting techniques from
    “`Seaborn`” will be used to visualize the data. To process the data `Scikit-Learn`’s
    “`preprocessing.LabelEncoder()`” will be used and “`train_test_split()`” to divide
    the data set into a training subset and testing subset.


    To generate predictions from our data set, three different algorithms will be
    used, namely, “`Linear Support Vector Classification` and `K-nearest neighbor
    classifier`.” To compare the performances of these algorithms, `Scikit-Learn`
    library technique, “`accuracy_score`,” will be used. The performance score of
    the models can be visualized using “`Yellowbrick`” visualization and `Scikit-Learn`.


    #### Installing Scikit-Learn


    The latest version of `Scikit-Learn` can be found on “`Scikit-Learn.org`” and
    requires “`Python` (version >= 3.5); `NumPy` (version >= 1.11.0); `SciPy` (version
    >= 0.17.0); `joblib` (version >= 0.11)”. The plotting capabilities or functions
    of Scikit-learn start with “`plot_`” and require “`Matplotlib` (version >= 1.5.1)”.
    Certain `Scikit-Learn` examples may need additional applications: “`Scikit-Image`
    (version >= 0.12.3), `Pandas` (version >= 0.18.0)”.


    With the prior installation of "`NumPy`" and "`SciPy`,” the best method of installing
    `Scikit-Learn` is using “`pip`: `pip install -U scikit-learn`” or “`conda`: `conda
    install scikit-learn`.”


    One must make sure that “`binary wheels`” are utilized when using `pip` and that
    “`NumPy`” and “`SciPy`” have not been recompiled from source, which may occur
    with the use of specific OS and hardware settings (for example, “`Linux on a Raspberry
    Pi`”). Developing “`NumPy`” and “`SciPy`” from source tends to be complicated
    (particularly on Windows); therefore, they need to be set up carefully, making
    sure the optimized execution of linear algebra routines is achievable.


    #### Importing the Data Set


    To import the “`Sales_Win_Loss` data set from IBM’s Watson repository," the first
    step is importing the "`Pandas`" module using "`import pandas as pd`.”


    Then, we leverage a variable `URL` as “`https://community.watsonanalytics.com/wp
    content/uploads/2015/04/WA_Fn-UseC_-Sales-Win-Loss.csv`” so that the data set
    can be stored and downloaded on the URL.


    Now, “`read_csv()` as `sales_data = pd.read_csv(url)`” technique will be used
    to read the above "`CSV or comma-separated values`" file, which is supplied by
    the `Pandas` module. The CSV file will then be converted into a `Pandas` data
    framework with the return variable as "`sales_data`,” where the framework will
    be stored.

    '
  trans: '


    # 客户分析已发展成为营销行业的支柱


    这是“智慧消费者”出现的直接结果，该消费者比以往任何时候都更具意识、更互联，并且愿意在瞬间将业务转移到别处。智慧客户可以无缝访问各种信息，包括市场上最好的产品和服务，以及他们可以在哪里找到最好的交易来最大化他们的资金。因此，公司需要主动，能够在与产品互动时预测消费者行为，并处于能够采取必要行动将潜在客户转化为付费客户的位置。为了生成更准确的客户行为预测和预测，公司必须对其客户的购买习惯和生活方式选择有充分的了解。这些接近准确的预测将为公司提供竞争优势，并有助于在销售和营销漏斗中实现更高的转化率。


    ## 当今市场上最好的客户分析解决方案之一


    当今市场上最好的客户分析解决方案之一是“SAS Customer Intelligence”，其声称具有以下应用：


    * 实现更高的客户忠诚度和响应率。

    * 生成个性化的客户优惠和信息，以便在正确的时间触达正确的客户。

    * 识别具有相似属性且转化可能性高的潜在客户，以便公司可以降低其有针对性的营销策略和活动的成本。

    * 通过对更有可能将业务转移他处的客户进行准确预测来减少客户流失，并制定主动的营销活动以留住他们。


    “我们从新的分析能力中获得的洞察力使我们能够找到将继续推动忠诚度、盈利能力和可持续增长的甜蜜点。”


    \- Carrie Gray，Verizon 中小企业营销执行总监


    ## 预测性分析营销


    根据 SAS，预测分析是“使用数据、统计算法和机器学习技术来识别基于历史数据的未来结果的可能性。目标是超越了解已经发生的事情，为未来将会发生的事情提供最佳评估”。今天，公司正在以面向未来的眼光挖掘过去，而这正是人工智能在营销中发挥作用的地方，通过应用预测分析技术。预测分析的成功与公司收集的大数据的质量成正比。


    以下是营销中广泛使用的预测分析应用：


    ### 客户行为预测分析


    对于“Amazon”、“Apple”和“Netflix”等工业巨头而言，分析客户活动和行为是其日常运营的基础。规模较小的企业越来越多地效仿他们，在其业务模式中实施预测分析。为公司开发一套定制的预测模型不仅资本密集，而且需要大量的人力和时间。像“AgilOne”这样的营销公司提供相对简单的预测模型类型，可广泛应用于各工业领域。他们已确定三种主要类型的预测模型来分析客户行为，即：


    “`Propensity models`” – 这些模型用于生成客户行为的“真实或准确”预测。一些最常见的倾向模型包括：“predictive lifetime
    value”、“propensity to buy”、“propensity to turn”、“propensity to convert”、“likelihood
    of engagement”和“propensity to unsubscribe”。


    “`Cluster models`” – 这些模型用于根据性别、年龄、购买历史和人口统计等共同属性对客户进行分离和分组。一些最常见的聚类模型包括 "product-based
    or category base clustering"、"behavioral customs clustering" 和 "brand based clustering"。


    “`Collaborative filtering`” – 这些模型用于根据先前的客户活动和行为生成产品和服务推荐以及推荐广告。一些最常见的协同过滤模型包括
    "upsell"、"cross-sell" 和 "next sell" 推荐。


    公司用于执行客户行为预测分析的最重要工具是 "`regression analysis`" ，它允许公司在特定产品的销售与购买客户所显示的特定属性之间建立相关性。这是通过采用
    "`regression coefficients`" 实现的，这些系数是描述客户行为受不同变量影响程度的数值，并为产品的未来销售开发 "`likelihood
    score`"。


    ### 使用 Scikit-Learn 库进行预测数据分析


    为了了解 `Scikit-Learn` 库在“预测数据分析”或机器学习模型开发中的使用方式，让我们使用来自 IBM Watson 仓库的“`Sales_Win_Loss`
    数据集”，其中包含一家汽车零部件批发供应商销售活动获得的数据。我们将构建一个机器学习模型来预测哪个销售活动会获胜，哪个会造成损失。


    数据集可以使用 `Pandas` 导入，并使用 `Pandas` 技术如“`head()`”、“`tail()`”和“`dtypes()`”进行探索。来自“`Seaborn`”的绘图技术将用于可视化数据。为了处理数据，将使用
    `Scikit-Learn` 的“`preprocessing.LabelEncoder()`”以及“`train_test_split()`”将数据集划分为训练子集和测试子集。


    为了从我们的数据集生成预测，将使用三种不同的算法，即“`Linear Support Vector Classification` 和 `K-nearest
    neighbor classifier`。”为了比较这些算法的性能，将使用 `Scikit-Learn` 库技术“`accuracy_score`”。模型性能得分可以使用“`Yellowbrick`”可视化和
    `Scikit-Learn` 进行可视化。


    #### 安装 Scikit-Learn


    `Scikit-Learn` 的最新版本可以在“`Scikit-Learn.org`”上找到，并需要“`Python`（版本 >= 3.5）；`NumPy`（版本
    >= 1.11.0）；`SciPy`（版本 >= 0.17.0）；`joblib`（版本 >= 0.11）”。Scikit-learn 的绘图功能或函数以“`plot_`”开头，并需要“`Matplotlib`（版本
    >= 1.5.1）”。某些 `Scikit-Learn` 示例可能需要额外的应用程序：“`Scikit-Image`（版本 >= 0.12.3），`Pandas`（版本
    >= 0.18.0）”。


    在事先安装了 "`NumPy`" 和 "`SciPy`" 的情况下，安装 `Scikit-Learn` 的最佳方法是使用“`pip`: `pip install
    -U scikit-learn`”或“`conda`: `conda install scikit-learn`。”


    必须确保在使用 `pip` 时利用了“`binary wheels`”，并且“`NumPy`”和“`SciPy`”未从源代码重新编译，这可能在使用特定操作系统和硬件设置时发生（例如“`Linux
    on a Raspberry Pi`”）。从源代码开发“`NumPy`”和“`SciPy`”往往很复杂（特别是在 Windows 上）；因此，它们需要仔细设置，确保线性代数例程的优化执行是可实现的。


    #### 导入数据集


    要导入来自 IBM Watson 仓库的“`Sales_Win_Loss` 数据集”，第一步是使用 "`import pandas as pd`" 导入 "`Pandas`"
    模块。


    然后，我们利用变量 `URL` 作为“`https://community.watsonanalytics.com/wp content/uploads/2015/04/WA_Fn-UseC_-Sales-Win-Loss.csv`”，以便数据集可以存储并下载到该
    URL。


    现在，将使用“`read_csv()` as `sales_data = pd.read_csv(url)`”技术来读取上述由 `Pandas` 模块提供的
    "`CSV or comma-separated values`" 文件。CSV 文件随后将被转换为 `Pandas` 数据框架，返回变量为 "`sales_data`"
    ，框架将存储在其中。


    '
