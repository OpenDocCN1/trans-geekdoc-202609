    \ influence the target variable, a collection of information must be learned by\
    \ a machine learning algorithm. We need to split the complete data set into two\
    \ subsets to accomplish this. One subset will serve as the training data set,\
    \ which will be used to train our algorithm to construct machine learning models.\
    \ The other subset will serve as the test data set, which will be used to test\
    \ the accuracy of the predictions generate by the machine learning model.\n\n\
    The first phase in this stage is the separation of feature and target variables\
    \ using the steps below:\n\nStep 1 – To select data excluding select columns,\
    \ use command “select columns other than 'Opportunity Number', 'Opportunity Result'cols\
    \ = \\[col for col in sales\\_data.columns if col not in \\['Opportunity Number','Opportunity\
    \ Result'\\]\\]”.\n\nStep 2 – To drop these select columns, use the command “dropping\
    \ the 'Opportunity Number’ and 'Opportunity Result' columns\n\ndata = sales\\\
    _data\\[cols\\]”.\n\nStep 3 – To assign the Opportunity Result column as “target”,\
    \ use command “target = sales\\_data\\['Opportunity Result'\\]\n\ndata.head(n=2)”.\n\
    \nThe “Opportunity Number” column was removed since it just acts as a unique identifier\
    \ for each record. The “Opportunity Result” contains the predictions we want to\
    \ generate, so it becomes our “target” variable and can be removed from the data\
    \ set for this phase. The first line of the above code will select all the columns\
    \ except “Opportunity Number” & “Opportunity Result” in. These columns are then\
    \ assigned to the “cols” variable. Then using the columns in the “cols” variable,\
    \ a new data framework was developed. This is going to be the “feature set.” Next,\
    \ the column “Opportunity Result” from the “sales\\_data” data frame was used\
    \ to develop a new data framework called “target.”\n\nThe second phase in this\
    \ stage is to separate the date frameworks into training and testing subsets using\
    \ the steps below. Depending on the data set and desired predictions, it needs\
    \ to be split into training and testing subset accordingly. For this exercise,\
    \ we will use 75% of the data as a training subset, and the rest 25% will be used\
    \ for the testing subset. We will leverage the “train\\_test\\_split()” technique\
    \ in “Scikit-Learn” in order to separate the information using steps and code\
    \ as below:\n\nStep 1 – To import the required module, use the command “from sklearn.model\\\
    _selection import train\\_test\\_split”.\n\nStep 2 – To separate the data set,\
    \ use command “split data set into train and test setsdata\\_train, data\\_test,\
    \ target\\_train, target\\_test = train\\_test\\_split(data, target, test\\_size\
    \ = 0.30, random\\_state = 10)”.\n\nWith the code above, the “train\\_test\\_split”\
    \ module was first imported, followed by the use of “train\\_test\\_split()” technique\
    \ to generate “training subset (data\\_train, target\\_train)” and “testing subset\
    \ (data\\_test, data\\_train).” The “train\\_test\\_split()” technique’s first\
    \ argument pertains to the features that were divided in the preceding stage,\
    \ the next argument relates to the (“Opportunity Result”) target. We are using\
    \ 30% for this example, although it can be any amount. The fourth 'random state'\
    \ argument is used to make sure that the results can be reproduced every time.\n\
    \nBuilding the Machine Learning Model\n\nThe “machine\\_learning\\_map” provided\
    \ by Scikit-Learn is widely used to choose the most appropriate ML algorithm for\
    \ the data set. For this exercise, we will be using “Linear Support Vector Classification”\
    \ and “K-nearest neighbors’ classifier” algorithms.\n\nLinear Support Vector Classification\
