    # Management

    Big data management can be defined as “the organization, administration, and governance
    of large volumes of both structured and unstructured data.” Big data requires
    efficient and cheap storage, which can be accomplished using servers that are
    on-premises, cloud-based, or a combination of both. Companies are able to seamlessly
    access required data from anywhere across the world and then processing this is
    a data using required processing engines on an as-needed basis. The goal is to
    make sure the quality of the data is high-level and can be accessed easily by
    the required tools and applications. Big data are gathered from all kinds of Dale
    sources including social media platforms, search engines, history and call logs.
    The big data usually contain large sets of unstructured data and the semi-structured
    data which are stored in a variety of formats. To be able to process and store
    this complicated data, companies require more powerful and advanced data management
    software beyond the traditional relational databases and data warehouse platforms.


    New platforms are available in the market that is capable of combining big data
    with the traditional data warehouse systems in a "logical data warehousing architecture."
    As part of this effort, companies are required to make decisions on what data
    must be secured for regulatory purposes and compliance, what data must be kept
    for future analytical purposes, and what data has no future use and can be disposed
    of. This process is called "data classification," which allows a rapid and efficient
    analysis of a subset of data to be included in the immediate decision-making process
    of the company.


    # Analysis

    Once the big data has been collected and is easily accessible, it can be analyzed
    using advanced analytical tools and technologies. This analysis will provide valuable
    insight and actionable information. Big data can be explored to make discoveries
    and develop data models using artificial intelligence and machine learning algorithms.


    # Types of Data

    Now that you understand the concept of big data let us look at different types
    of data so you can choose the most appropriate analytical tools and algorithms
    based on the type of data that needs to be processed. Data types can be divided
    into two at a very high level: qualitative and quantitative.


    ## Qualitative data

    Any data that cannot be measured and only observed subjectively by adding a qualitative
    feature to the object it''s called as "qualitative data." Classification of an
    object using unmeasurable features results in the creation of qualitative data.
    For example, attributes like color, smell, texture, and taste. There are three
    types of qualitative data:

    * “Binary or binomial data” – Data values that signal mutually exclusive events
    where only one of the two categories or options is correct and applicable. For
    example, true or false, yes or no, positive or negative. Consider a box of assorted
    tea bags. You try all the different flavors and group the ones that you like as
    "good" and the ones you don''t as "bad." In this case, "good or bad" would be
    categorized as the binomial data type. This type of data is widely used in the
    development of statistical models for predictive analysis.

    * “Nominal or unordered data” – Data characteristics that lack an "implicit or
    natural value" can be referred to as nominal data. Consider a box of M&Ms. You
    can record the color of each M&M in the box in a worksheet, and that would serve
    as nominal data. This kind of data is widely used to assess statistical differences
    in the data set, using techniques like "Chi-Square analysis," which could tell
    you "statistically significant differences" in the amount of each color of M&M
    in a box.

    * “Ordered or ordinal data” – The characteristics of this Data type do have certain
    "implicit or natural of value" such as small, medium, or large. For example, online
    reviews on sites like "Yelp," "Amazon," and "Trip Advisor" have a rating scale
    from 1 to 5, implying a 5-star rating is better than 4, which is better than 3
    and so on.


    ## Quantitative data

    Any characteristics of the data that can be measured objectively are called as
    "quantitative data." Classification of an object in using measurable features
    and giving it a numerical value results and creation of quantitative data. For
    example, product prices, temperature, dimensions like length, etc. There are two
    types of quantitative data:

    * “Continuous Data” – Data values that can be defined to a further lower level,
    such as units of measurement like kilometers, meters, centimeters, and on and
    on, are called the continuous data type. For example, you can purchase a bag of
    almonds by weight like 500g or 8 ounces. This accounts for the continuous data
    type, which is primarily used to test and verify different kinds of hypotheses
    such as assessing the accuracy of the weight printed on the bag of almonds.

    * “Discrete Data” – numerical data value that cannot be divided and reduced to
    a higher level of precision, such as the number of cars owned by a person which
    can only be accounted for as indivisible numbers (you cannot have 1.5 or 2.3 cars),
    is called as discrete data types. For example, you can purchase another bag of
    ice cream bars by the number of ice cream bars inside the package, like four or
    six. This accounts for the discrete data type, which can be used in combination
    with a continuous data type to perform a regression analysis to verify if the
    total weight of the ice cream box (continuous data) is correlated with the number
    of ice cream bars (discrete data) inside.


    # Big Data Analytics

    The terms of big data and big data analytics are often used interchangeably owing
    to the fact that the inherent purpose of big data is to be analyzed. "Big data
    analytics" can be defined as a set of qualitative and quantitative methods that
    can be employed to examine a large amount of unstructured, structured, and semi-structured
    data to discover data patterns and valuable hidden insights. Big data analytics
    is the science of analyzing big data to collect metrics, key performance indicators,
    and Data trends that can be easily lost in the flood of raw data, by using machine
    learning algorithms and automated analytical techniques. The different steps involved
    in "big data analysis" are:


    ### Gathering Data Requirements

    It is important to understand what information or data needs to be gathered to
    meet the business objective and goals. Data organization is also very critical
    for efficient and accurate data analysis. Some of the categories in which the
    data can be organized are gender, age, demographics, location, ethnicity, and
    income. A decision must also be made on the required data types (qualitative and
    quantitative) and data values (can be numerical or alphanumerical) to be used
    for the analysis.


    ### Gathering Data

    Raw data can be collected from disparate sources such as social media platforms,
    computers, cameras, other software applications, company websites, and even third-party
    data providers. The big data analysis inherently requires large volumes of data,
    the majority of which is unstructured with a limited amount of structured and
    semi-structured data.


    ### Data organization and categorization

    Depending on the company''s infrastructure, Data organization could be done on
    a simple Excel spreadsheet or using many tools and applications that are capable
    of processing statistical data. Data must be organized and categorized based on
    data requirements collected in step one of the big data analysis process.


    ### Cleaning the data

    to perform the big data analysis sufficiently and rapidly, it is very important
    to make sure the data set is void of any redundancy and errors. Only a complete
    data set fulfilling the Data requirements must have proceeded to the final analysis
    step. Preprocessing of data is required to make sure the only high-quality data
    is being analyzed, and company resources are being put to good use.

    '
  trans: '


    # 管理

    大数据管理可以被定义为“对大量结构化和非结构化数据的组织、管理和治理”。大数据需要高效且廉价的存储，这可以通过本地服务器、云端服务器或两者结合来实现。公司能够无缝地从世界各地访问所需数据，然后根据需要使用所需的处理引擎对这些数据进行处理。目标是确保数据的质量处于高水平，并且可以被所需的工具和应用程序轻松访问。大数据来自各种各样的
    Dale 来源，包括社交媒体平台、搜索引擎、历史记录和通话记录。大数据通常包含大量非结构化数据和半结构化数据，这些数据以多种格式存储。为了能够处理和存储这种复杂的数据，公司需要比传统关系数据库和数据仓库平台更强大、更先进的数据管理软件。


    市场上出现了新的平台，能够将大数据与传统数据仓库系统结合起来，形成“逻辑数据仓库架构”。作为这项工作的一部分，公司需要决定哪些数据必须为监管目的和合规性而安全存储，哪些数据必须保留以供未来分析使用，以及哪些数据没有未来用途可以处置。这一过程被称为“数据分类”，它允许快速高效地分析数据子集，以便纳入公司的即时决策过程。


    # 分析

    一旦大数据被收集并易于访问，就可以使用先进的分析工具和技术对其进行分析。这种分析将提供有价值的见解和可操作的信息。大数据可以被探索以做出发现并使用人工智能和机器学习算法开发数据模型。


    # 数据类型

    现在你已经了解了大数据的概念，让我们来看一下不同类型的数据，以便你能够根据需要处理的数据类型选择最合适的分析工具和算法。数据类型的最高层面可以分为两类：定性和定量。


    ## 定性数据

    任何无法测量只能通过为对象添加定性特征而主观观察的数据称为“定性数据”。使用不可测量的特征对对象进行分类会产生定性数据。例如，属性如颜色、气味、质地和味道。定性数据有三种类型：

    * “二元或二项数据” – 数据值表示互斥事件，其中只有两个类别或选项中的一个是正确且适用的。例如，真或假，是或否，正或负。考虑一个装有混合茶包的盒子。你尝试所有不同的口味，并将你喜欢的归为“好”，不喜欢的归为“坏”。在这种情况下，“好或坏”将被归类为二项数据类型。这种数据类型广泛用于开发用于预测分析的统计模型。

    * “名义或无序数据” – 缺乏“隐含或自然价值”的数据特征可称为名义数据。考虑一盒 M&M 糖。你可以在工作表中记录盒中每个 M&M 的颜色，这将作为名义数据。这种数据广泛用于评估数据集中使用“卡方分析”等技术的统计差异，这可以告诉你盒中每种颜色
    M&M 数量的“统计显著差异”。

    * “有序或顺序数据” – 这种数据类型的特征确实具有一定的“隐含或自然价值”，例如小、中或大。例如，像“Yelp”、“Amazon”和“Trip Advisor”这样的网站上的在线评论具有
    1 到 5 的评分等级，意味着 5 星评分优于 4 星，优于 3 星，依此类推。


    ## 定量数据

    数据的任何可以客观测量的特征称为“定量数据”。使用可测量的特征对对象进行分类并赋予其数值会产生定量数据。例如，产品价格、温度、尺寸如长度等。定量数据有两种类型：

    * “连续数据” – 可以定义到更低级别的数据值，例如公里、米、厘米等测量单位，称为连续数据类型。例如，你可以按重量购买一袋杏仁，如 500g 或 8 盎司。这属于连续数据类型，主要用于测试和验证不同类型的假设，例如评估杏仁袋上打印的重量准确性。

    * “离散数据” – 无法被分割和降低到更高精度水平的数值数据值，例如一个人拥有的汽车数量只能以不可分割的数字计算（你不能拥有 1.5 或 2.3 辆车），称为离散数据类型。例如，你可以按包装内冰淇淋棒的数量购买另一袋冰淇淋棒，如四根或六根。这属于离散数据类型，可以与连续数据类型结合使用来执行回归分析，以验证冰淇淋盒的总重量（连续数据）是否与包装内的冰淇淋棒数量（离散数据）相关。


    # 大数据分析

    由于大数据的固有目的是被分析，因此大数据和大数据分析这两个术语经常被互换使用。“大数据分析”可以被定义为一套定性和定量方法，可用于检查大量非结构化、结构化和半结构化数据，以发现数据模式和有价值的隐藏洞察。大数据分析是通过使用机器学习算法和自动化分析技术来分析大数据以收集指标、关键绩效指标和数据趋势的科学，这些指标和趋势很容易在原始数据的洪流中丢失。“大数据分析”涉及的不同步骤是：


    ### 收集数据需求

    了解需要收集哪些信息或数据以满足业务目标和目标非常重要。数据组织对于高效准确的数据分析也至关重要。数据可以组织的类别包括性别、年龄、人口统计、位置、种族和收入。还必须决定用于分析的所需数据类型（定性和定量）以及数据值（可以是数字或字母数字）。


    ### 收集数据

    原始数据可以从不同的来源收集，例如社交媒体平台、计算机、摄像机、其他软件应用程序、公司网站，甚至第三方数据提供商。大数据分析本质上需要大量数据，其中大部分是非结构化数据，只有少量结构化和半结构化数据。


    ### 数据组织和分类

    根据公司的基础设施，数据组织可以在简单的 Excel 电子表格上完成，也可以使用能够处理统计数据的许多工具和应用程序。数据必须根据大数据分析过程第一步收集的数据需求进行组织和分类。


    ### 清理数据

    为了充分、快速地执行大数据分析，确保数据集没有任何冗余和错误非常重要。只有满足数据需求的完整数据集才应进入最终分析步骤。数据预处理是必需的，以确保只有高质量的数据被分析，公司资源得到充分利用。


    '
