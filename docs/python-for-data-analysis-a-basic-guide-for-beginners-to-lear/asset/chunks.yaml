    the picture below depicts a fictional set of height and weight measures for children.
    Each "dot" in the plot is used to represent an individual with measures of their
    height along the "x-axis" and weight along the "y-axis."


    ![](images/00015.jpeg)


    “Scatter plots" are highly useful when you are interested in representing the
    relationship that exists between two distinct variables. “Scatter plots" are often
    referred to as "plots of correlation," given the fact that they demonstrate how
    two distinct variables are related to each other. In the "scatter plot" above,
    the chart depicts much more than a simple log of the height and weight of children.
    It also offers a visual of the relationship between the two measures, denoting
    that as the height increases, the child''s weight is also increasing. Now, you
    can easily conclude that this height and weight relationship isn''t ideal, as
    some taller kids can weigh less than some shorter kids, but the overall trend
    is fairly satisfactory, and it can be observed that there is a direct relationship
    between the height and weight of children.


    It is important to remember that not all relationships can be linear. For instance,
    the chart in the picture below indicates an "average of daily high temperature"
    measured over 7 years, demonstrating a familiar parabolic relationship between
    these variables as the daily high temperature tends to peak during summer.


    ![](images/00016.jpeg)


    Scatter plots often contain a trend-line to clarify the relationship between the
    variable, as shown in the picture below.


    ![](images/00017.jpeg)


    Moreover, the shape, size, and color of the "dot" can be considered and utilized
    as additional data variables. For instance, the plot below represents the data
    on the height and weight of the children, but by adding the color of the "dot"
    to depict the gender of the child, we have acquired a third variable for our analysis.


    ![](images/00018.jpeg)


    ![](images/00019.jpeg)


    # Chapter 4: Applications of Big Data Analysis


    ## Industrial Applications


    The applications of Big data and Big Data Analytics are benefiting, both small
    and big companies across various industrial domains. Some of the widely used industrial
    applications are:


    ### eCommerce


    Over 2.6 billion and counting active social media users include customers and
    potential customers for every company out there. The race is on to create more
    effective marketing and social media strategies, powered by machine learning,
    aimed at providing enhanced customer experience to turn prospective customers
    into raving fans. The process of sifting through and analyzing a massive amount
    of data has not only become feasible, but it''s easy now. The ability to bridge
    the gap between execution and big data analysis has been supplemented by artificial
    intelligence marketing solutions.


    Artificial Intelligence (AI) marketing can be defined as a method of you using
    artificial intelligence consonants like machine learning on available customer
    data to anticipate customer''s needs and expectations while significantly improving
    the customer''s journey. Marketers are able to boost their campaign performance
    and return on investment read a little to no extra effort in the light of big
    data insights provided by artificial intelligence marketing solutions. The key
    elements that make AI marketing as powerful are:


    * Big data - A marketing company''s ability to aggregate and segment a huge dump
    of data with minimal manual work is referred to as Big Data. The marketer can
    then leverage the desired medium to ensure the appropriate message is being delivered
    to the target audience at the right time.

    * Machine learning - Machine learning platforms enable marketers to identify trends
    or common occurrences and gather effective insights and responses, thereby deciphering
    the root cause and probability of recurring events.

    * Intuitive platform – Super fast and easy to operate applications are integral
    to AI marketing. Artificial intelligence technology is capable of interpreting
    emotions and communicating like a human, allowing AI-based platforms to understand
    open form content like email responses and social media.


    ### Predictive Analysis


    All artificial intelligence technology-based solutions are capable of extracting
    information from data assets to predict future trends. AI technology has made
    it possible to model trends that could previously be determined only retroactively.
    These predictive analysis models can be reliably used in decision-making and to
    analyze customers'' purchase behavior. The model can successfully determine when
    the consumer is more likely to purchase something new or reorder an old purchase.
    The marketing companies are now able to reverse engineer customer''s experiences
    and actions to create more lucrative marketing strategies. For example, FedEx
    and Sprint are using predictive analytics to identify customers who are at potential
    risk of deflecting to the competitor.


    ### Smart searches


    Only a decade ago, if you type in "women''s flip flops" on Nike.com, the probability
    of you finding what you were looking for would be next to zero. But today''s search
    engines are not only accurate but also much faster. This upgrade has largely been
    brought on by innovations like "semantic search" and "natural language processing"
    that enable search engines to identify links between products and provide relevant
    search results, recommend similar items, and auto-correct typing errors. The artificial
    intelligence technology and big data solutions are able to rapidly analyze user
    search patterns and identify key areas that the marketing companies should focus
    on.


    In 2015, Google introduced the first Artificial Intelligence-based search algorithm
    called “RankBrain.” Following Google’s lead, other major e-commerce websites,
    including Amazon has incorporated big data analysis and artificial intelligence
    into their search engines to offer smart search experience for their customers,
    who are able to find desired products even when they don’t know exactly what they’re
    looking for. Even small e-commerce stores have access to Smart search technologies
    like “Elasticsearch.” The data-as-a-service companies like “Indix" allow companies
    to learn from other larger data sources to train their product search models.


    ### Recommendation Engines


    Recommendation engines have quickly evolved into fan favorites and are loved by
    the customers just as much as the marketing companies. "Apple Music" already knows
    your taste in music better than your partner, and Amazon always presents you with
    a list of products that you might be interested in buying. This kind of discovery
    aide that is able to sift through millions of available options and hone in on
    an individual''s needs are proving indispensable for large companies with huge
    physical and digital inventories.

