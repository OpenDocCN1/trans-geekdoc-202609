    ## Pandas Series


    It can be defined as a "one-dimensional labeled array capable of holding data
    of any type (integer, string, float, python objects)." Simply put, it is like
    a column in an excel spreadsheet. To generate a “Pandas Series” from an array,
    a “NumPy” module must be imported and used with “array ()” function as shown in
    the code below:


    ```

    # import pandas as pd

    import pandas as pd

    ```


    ```

    # import numpy as np

    import numpy as np

    ```


    ```

    # simple array

    data = np.array ([''m'',''a'',''c'',''h'',''I'',''n'',''e''])

    ```


    ```

    ser = pd.Series(data)

    print(ser)

    ```


    ## Seaborn (data visualization)


    Seaborn is derived from the Matplotlib Library and an extremely popular visualization
    library. It is a high-level library that can generate specific kinds of graph
    including heat maps, time series, and violin plots.


    ## TensorFlow


    TensorFlow can be defined as a Machine Learning platform providing end-to-end
    service with a variety of free and open sources. It has a system of multilayered
    nodes that allow for quick building, training, and deployment of artificial neural
    networks with large data sets. It is touted as a “simple and flexible architecture
    to take new ideas from concept to code to state-of-the-art models and to publication
    at a rapid pace.” For example, Google uses TensorFlow libraries in its image recognition
    and speech recognition tools and technologies.


    Higher-level APIs such as `tf.estimator` can be used for specifying predefined
    architectures, such as `linear regressors` or `neural networks.` The picture below
    shows the existing hierarchy of the TensorFlow tool kit:


    ![](images/00005.jpeg)


    The picture shown below provides the purposes of the different layers:


    ![](images/00006.jpeg)


    The two fundamental components of TensorFlow are:


    1. A `graph protocol buffer`

    2. A `runtime` that can execute the graph


    The two-component mentioned above are similar to the `Python` code and the `Python
    interpreter.` Just as the `Python interpreter` can run Python code on several
    hardware systems, TensorFlow can be operated on various hardware systems, like
    CPU, GPU, and TPU.


    To make a decision regarding which API(s) should be used, you must consider the
    API offering the highest abstraction level to solve the target problem. Easier
    to use, but (by design) less flexible, are the greater abstract levels. It is
    recommended to first begin with the highest-level API and make everything work.
    If for certain unique modeling issues, you need extra flexibility, move one level
    down. Notice that each level is constructed on the lower-level APIs. It should
    thus be quite simple to decrease the hierarchy.


    For the development of the majority of Machine Learning models, we will use `tf.estimator`
    API, which significantly lowers the number of code lines needed for development.
    Also, `tf.estimator` is compatible with Scikit-Learn API.


    ![](images/00007.jpeg)


    # Chapter 3: Predictive Modeling, Data Visualization and Creation of Training
    Data Set


    ## Machine Learning


    Artificial intelligence is the manifestation of the idea that machines are capable
    of human-like intelligence and can mimic human thought processing and learning
    capabilities to adapt to new inputs and perform tasks without requiring human
    assistance. Machine learning is integral to the concept of artificial intelligence.
    Machine learning can be defined as a concept of artificial intelligence technology
    that focuses primarily on the engineered capability of machines to learn and self-train,
    by identifying data patterns to improve upon the underlying algorithm and make
    independent decisions. Machine learning hypothesizes that modern-day computers
    have an ability to be trained using a training data set that can be easily customized
    to meet desired functionalities. Machine learning is driven by the pattern recognition
    technique wherein the machine records and revisit past interactions and results
    that are deemed in alignment with its current situation. Given the fact that machines
    are required to process the endless amount of data, with new data always pouring
    in, they must be equipped to adapt to the new data without needing to be programmed
    by a human speaks to the iterative aspect of machine learning.


    Machines are capable of learning from and self-training by utilizing previous
    computations and underlying algorithms to produce high-quality decisions and results
    that are easily reproducible. The concept of machine learning has been around
    for decades, but recent advancements in machine learning algorithms have made
    it possible for the machines to process and analyze big data. This is accomplished
    by the application of advanced and complex mathematical calculations using automation
    at high speed and frequency.


    Advanced computing machines of today are capable of rapidly analyzing the humongous
    amount of data and delivering faster and more accurate results. Companies that
    are employing machine learning algorithms have enhanced flexibility to modify
    the training data set to meet their business requirements and train the machines
    accordingly. These customized machine learning algorithms allow businesses to
    identify potential risks as well as growth opportunities. Machine learning algorithms
    are typically used in collaboration with artificial intelligence technology and
    cognitive technologies to make the machines highly effective and efficient in
    processing large volumes of data or big data and produce highly accurate results.


    Given the intrinsic link between artificial intelligence and machine learning,
    going forward to make this book easier to understand, we will be using the terms
    “machine learning” and “artificial intelligence” interchangeably.


    There are four types of machine learning algorithms available today:


    ### Supervised Machine Learning Algorithms


    These algorithms are widely used in predictive big data analysis, owing to its
    capability of assessing and applying the lessons learned from previous iterations
    and interactions to new input data set. These algorithms can label all their ongoing
    runs based on the instructions provided to successfully predict and forecast future
    events. For example, humans can program the machine to label its data points as
    "R" (Run), "N" (Negative), or "P" (Positive). The machine learning algorithm will
    then label the input data as programmed and receive data inputs with corresponding
    correct outputs. The algorithm will run a comparison of its own generated output
    against the "expected or correct" output, to identify potential improvements that
    can be made and errors that can be fixed to make the model more accurate and smarter.


    By applying methods like "regression," "prediction," "classification," and "ingredient
    boosting" to well train the machine learning algorithms, any new input data can
    be fed into the machine as "target" data set to orchestrate the learning program
    as desired. This "known training data set" jump-starts the analytical process,
    which is followed by the learning algorithm to produce and "inferred function"
    that can be used to generate forecasts and predictions for future events based
    on the output values. For example, financial institutions and banks are heavily
    dependent on supervised machine learning algorithms to detect fraudulent credit
    card transactions and predict the likelihood of a potential credit card customer
    failing to make their credit payments on time.


    ### Unsupervised Machine Learning Algorithms

