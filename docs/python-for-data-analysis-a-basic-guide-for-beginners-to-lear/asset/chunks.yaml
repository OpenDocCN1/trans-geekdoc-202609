    公司经常遇到需要生成标记和分类的训练数据集的数据源不可用的情况。在这些情况下，使用无监督机器学习算法是理想的。无监督机器学习算法用于识别机器如何创建“推断函数”以从未标记和未分类的数据堆中阐明隐藏结构的方法。这些算法能够探索数据以在信息量中识别结构。


    与监督机器学习算法不同，无监督算法在识别正确输出方面失败，尽管它们在探索输入数据和进行推断方面与监督学习算法一样高效。这些算法可用于识别数据异常值、生成定制和个性化产品推荐，以及使用诸如
    `self-organizing maps`、`singular value decomposition` 和 `k-means clustering` 等技术对文本主题进行分类。例如，识别具有共同购物属性的客户，可将其细分为特定群体，并针对其实施相似的营销策略和活动。因此，无监督学习算法在在线营销领域极受欢迎。


    ## 半监督机器学习算法


    半监督机器学习算法具有高度的通用性，能够利用标记和未标记数据集进行学习和自我训练。这些算法是监督学习和无监督学习算法的“混合”。通常，训练数据集主要由未标记数据组成，并包含少量标记数据。分析方法包括
    `prediction`、`regression` 和 `classification` 与半监督学习算法相结合使用，可使机器显著提高其学习准确性和训练能力。


    这些算法广泛用于从原始数据生成标记训练数据集高度资源密集且对公司而言成本效益较低的情况。因此，为了避免额外的人力和设备成本，公司在其系统中使用半监督学习算法。例如，人脸识别应用程序需要大量分散在多个输入源中的人脸数据。从网络摄像头等来源获取的原始数据的预处理、处理、分类和标记需要大量人力，以及数千小时的工作才能用作训练数据集。


    ## 强化机器学习算法


    强化机器学习算法的独特性在于它从环境中学习。这些算法执行操作并勤勉地记录每次操作的结果，该结果要么是失败导致错误，要么是成功执行后的奖励。区分强化学习算法的两个主要特征是
    `trial and error` 研究方法和 `delayed reward`。机器通过使用各种计算反复分析输入数据，并为每次正确或预期的输出发送强化信号，最终优化最终结果。系统开发了简单的动作和奖励反馈循环，以评估、记录和学习哪些操作是成功的并在更短时间内导致准确结果。这些算法的使用使系统能够在特定上下文的约束条件下自动确定理想行为，从而提高其能力和最大化其性能。因此，强化机器学习算法在游戏行业、机器人工程以及导航系统中被广泛使用。


    ## 大数据分析 vs. 机器学习


    `Machine learning`、`Big Data` 以及 `Big Data Analytics` 都属于 `Artificial Intelligence`
    技术范畴，而后者归入 `Data Science` 领域。以下是机器学习与大数据或大数据分析之间的一些关键区别：


    ### 应用


    机器学习用于开发先进的推荐引擎和模型，这些模型可以通过分析和现有数据来预测和预测未来事件。例如，`Google` 正在使用先进的机器学习算法开发其自动驾驶汽车。虚拟个人和家庭助手设备，如
    `Amazon Alexa`、`Google Home` 和 `Apple HomePod` 都由先进的机器学习算法驱动，与人工智能技术密切协作。


    大数据具有更广泛的适用性，可用于一般研究目的，以收集有关特定业务查询的信息，例如收集销售数据、构建消费者画像和金融研究，以及工业领域其他应用。


    ### 学习能力


    机器学习算法是自给自足的，能够在没有人工协助的情况下从训练数据集以及新输入数据中学习。它们足够强大，可以为系统学习和自我改进奠定基础。大数据分析能够收集现有数据并分析其以识别可用于其决策过程的新兴模式。它始终由人工控制的分析工具和技术驱动，没有自我学习的能力。


    ### 模式识别


    大数据分析利用回归、聚类和分类等统计方法来识别可分析以产生逻辑信息的数据模式。


    机器学习不仅可以识别新兴数据模式，还可以对这些模式应用高级算法，从数据模式中学习，并随着每次迭代最大化系统性能。


    ### 数据量和数据类型


    大数据涉及海量的非结构化、半结构化和结构化数据。需要先进的分析工具和技术来处理这些大型数据集，其中大部分是非结构化数据，以获取有价值的信息。


    机器学习利用相对较小的数据集，这些数据集经过分类和标记，可作为算法学习和自我改进的指导说明。


    ### 基本目的


    机器学习的主要目标是在几乎没有人工协助的情况下，仅基于输入数据实现自我改进。这些算法的有前景的应用和智能机器的开发，有朝一日可能有助于解决人类面临的严峻挑战，例如全球变暖。


    大数据旨在收集我们不断发展的数字生活所产生的激增数据。大数据分析使用模式识别技术来揭示可能在这堆信息中轻易丢失的隐藏模式和洞察。


    ## 客户分析


    根据 SAS 的定义，客户分析可以定义为“流程和技术 bad 使组织获得必要的客户洞察力，以便提供预期、相关且及时的优惠。”客户分析是所有营销活动的核心，是
    `predictive modeling`、`data visualization`、`information management` 和 `segmentation`
    等技术的总称。


    ### 客户分析的重要性


