    # Data Mining Overview


    “Data mining is the process of finding anomalies, patterns, and correlations within
    large data sets to predict outcomes. Using a broad range of techniques, you can
    use this information to increase revenues, cut costs, improve customer relationships,
    reduce risks, and more.”


    – SAS


    According to SAS, "unstructured data alone makes up 90% of the digital universe".
    This avalanche of big data does not necessarily guarantee more knowledge. The
    application of data mining technology allows the filtering of all the redundant
    and unnecessary data noise to garner the understanding of relevant information
    that can be used in the immediate decision-making process.


    ## The Data Mining Process


    Most widely used data mining processes can be broken down into six steps as listed
    below:


    ### 1. Business understanding


    It is very critical to understand the project goals and what is it that you''re
    trying to achieve through the data mining process. Companies always start with
    the establishment of a defined goal and a project plan that includes details such
    as individual team member roles and responsibility, project milestones, project
    timelines, and key performance indicators and metrics.


    ### 2. Data understanding


    Data is available from a wide variety of input sources and in different formats.
    With the use of data visualization tools, the data properties, and features can
    be assessed to ensure the existing data set is able to meet the established business
    requirements and project goals.


    ### 3. Data preparation


    The preprocessing of data collected in multiple formats is very important. The
    data set must be scrubbed to remove data redundancies and identify gaps before
    it is deemed appropriate for mining. Considering the amount of data to be analyzed,
    the data pre-processing and processing steps can take a long time. To enhance
    the speed of the data mining process, instead of using a single system company,
    prefer using distributed systems as part of their "database management systems."
    The distributed systems also provide enhanced security measures by segregating
    the data into multiple devices rather than a single data warehouse. At this stage,
    it is also very crucial to account for backup options and failsafe measures in
    the event of data loss during the data manipulation stage.


    ### 4. Data modeling


    Applicable mathematical models and analytical tools are applied to the data set
    to identify patterns.


    ### 5. Evaluation


    The modeling results and data patterns are evaluated against the project goal
    and objectives to determine if the data findings can be released for use across
    the organization.


    ### 6. Deployment


    Once the insights gathered from the data have been evaluated as applicable to
    the functioning and operations of the organization, these insights can be shared
    across the company to be included in its day-to-day operations. With the use of
    a Business Intelligence tool, the data findings can be stored at a centralized
    location and accessed using the BI tool as needed.


    ## Pros of Data Mining


    ### Automated decision-making


    With the use of data mining technology, businesses can seamlessly automate tedious
    manual tasks and analyze large volumes of data to gather insights for the routine
    and critical decision-making process. For example, financial lending institutions,
    banks, and online payment services use data mining technology to detect potentially
    fraudulent transactions, verify user identity, and ensure data privacy to protect
    their customers against identity theft. When the company''s operational algorithms
    are working in coordination with the data mining models, the company can independently
    gather, analyze, and take actions on data to improve and streamline their operational
    decision-making process.


    ### Accurate prediction and forecasting


    Project planning is fundamental to the success of any company. Managers and executives
    can leverage data mining technology to gather reliable forecasts and predictions
    on future market trends and include in their future planning process. For example,
    one of the leading retail company "Macy''s" has implemented demand forecasting
    models to generate reliable demand forecasts for Mary is clothing categories at
    individual stores in order to increase the efficiency of their supply chain by
    routing the forecasted inventory to each store and cater to the needs of the market
    more efficiently.


    ### Cost reduction


    With the help of data mining, technology companies can maximize the use of their
    resources by smarty allocating them across the business model. The use of data
    mining technology in planning, as well as an automated decision-making process,
    results in accurate forecasts leading to significant cost reductions. For example,
    a major airline company "Delta" implemented RFID chips inside their passengers
    checked-in baggage and gathered baggage handling data that was analyzed using
    data mining techniques to identify improvement opportunities in their process
    and minimizing the number of mishandled baggage. This not only resulted in a cost-saving
    on the search and rerouting process of the lost baggage but also translated into
    higher customer satisfaction.


    ### Customer insights


    Companies across different industrial sectors have deployed Data mining models
    to gather valuable insights from existing customer data, which can be used to
    segment and target customers with similar shopping attributes using similar marketing
    strategies and campaigns. Customer personas can be created using data mining techniques
    to provide a more engaging and personalized user experience to the customer. For
    example, "Disney" has recently invested over a billion dollars in developing and
    deploying "Magic bands," offering the convenience and enhanced the experience
    of Disney resorts. At the same time, these bands can be used to collect data on
    patron activities and interactions with different "Disney" products and services
    at the park to further enhance the "Disney experience."


    “When \[data mining and\] predictive analytics are done right, the analyses aren''t
    a means to a predictive end; rather, the desired predictions become a means to
    analytical insight and discovery. We do a better job of analyzing what we need
    to analyze and predicting what we want to predict.”


    – Harvard Business Review Insight Center Report


    ## Challenges of data mining


    ### 1. Big data


    Our digital life has inundated companies with large volumes of data, which is
    estimated to reach 1.7 MB per second per person by 2020. This exponential increase
    in volume and complexity of big data has presented challenges for the data mining
    technology. Companies are looking to expedite their decision-making process by
    swiftly and efficiently extracting and analyzing data to gain valuable insights
    from their data treasure trove. The ultimate goal of data mining technology is
    to overcome these challenges and unlock the true potential of data value. The
    "4Vs" of big data namely velocity, variety, volume, and veracity, represent the
    four major challenges facing the data mining technology.


    The skyrocketing "velocity" or speed at which new data is being generated poses
    a challenge of increasing storage requirements. The "variety" or different data
    types collected and stored require advance data mining capabilities to be able
    to simultaneously process a multitude of data formats. Data mining tools that
    are not equipped to process such highly variable big data provide low value due
    to their inefficiency and analyzing unstructured and structured data together.

    '
