    The large volume of big data is not only challenging for storage, but it’s even
    more challenging to identify correct data in a timely manner, owing to a massive
    reduction in the speed of the data mining tools and algorithms. To add on to this
    challenge, the data “veracity” denoting that all of the collected data is not
    accurate and can be incomplete or even biased. The data mining tools are struggling
    to deliver high-quality results in a timely manner by analyzing high quantity
    or big data.


    ## 2. Overloading models


    Data models that describe the natural errors of the data set instead of the underlying
    patterns are often “over-fitted” or overloaded. These models tend to be highly
    complex and require a large number of independent media values to precisely predict
    a future event. Data volume and variety further increase the risk of overloading.
    A high number of variables tend to restrict the data model within the confines
    of the known sample data. On the other hand, an insufficient number of variables
    can compromise the relevance of the model. To obtain the required number of variables
    for the data mining models, to be able to strike a balance between the accuracy
    of the results and the prediction capabilities is one of the major challenges
    facing the data mining technology today.


    ## 3. Data privacy and security


    To cater to the large volume of big data generated on a daily basis, companies
    are investing in cloud-based storage servers along with their on-premise servers.
    The cloud computing technology is relatively new in the market, and the inherent
    nature of this service poses multiple security and privacy concerns. Data privacy
    and security is one of the biggest concerns of Smart consumers who are willing
    to take their business to the company that can promise them the security of their
    personal information and data. This requires organizations to evaluate their customer
    relationships and prioritize customer privacy over the development of policies
    that can potentially compromise customer data security.


    ## 4. Scaling costs


    With the increasing speed of data generation leading to a high volume of complex
    data, organizations are required to expand their data mining models and deploy
    them across the organization. To unlock the full potential of data mining tools,
    companies are required to heavily invest in computing infrastructure and processing
    power to efficiently run the data mining models. Big-ticket item purchase-including
    data servers, software, and advanced computers must be made to scale the analytical
    capabilities of the organization.


    # Data Mining Trends


    ## Increased Computing Speed


    With the increasing volume and complexity of big data, Data mining tools need
    more powerful and faster computers to efficiently analyze data. The existing statistical
    techniques like `clustering` art equipment to process only thousands of input
    data with a limited number of variables. However, companies are gathering over
    millions of new data observations with hundreds of variables making the analysis
    too complicated for the computing system to process. The big data is going to
    continue to explode, demanding supercomputers that are powerful enough to rapidly
    and efficiently analyze the growing big data.


    ## Language Standardization


    The data science community is actively looking to standardize a language for the
    data mining process. This ongoing effort will allow the analyst to conveniently
    work with a variety of data mining platforms by mastering one standard Data mining
    language.


    ## Scientific Mining


    The success of data mining technology in the industrial world has caught the eye
    of the scientific and academic research community. For example, psychologists
    are using `association analysis` to capture her and identify human behavioral
    patterns for research purposes. Economists are using protective analysis algorithms
    to forecast future market trends by analyzing current market variables.


    ## Web mining


    Web mining can be defined as “the process of discovering hidden data patterns
    and chains using similar techniques of data mining and applying them directly
    on the Internet.” The three main types of web mining are: `content mining`, `usage
    mining`, and `structure mining`. For example, `Amazon` uses web mining to gain
    an understanding of customer interactions with their website and mobile application,
    to provide more engaging and enhanced user experience to their customers.


    # Data mining tools


    Some of the most widely used data mining tools are:


    ### Orange


    `Orange` is `open-source component-based software written in Python`. It is most
    frequently used for basic data mining analysis and offers top-of-the-line data
    pre-processing features.


    ### RapidMiner


    `RapidMiner` is an `open-source component-based software written in Java`. It
    is most frequently used for `predictive analysis` and offers integrated environments
    for `machine learning`, `deep learning`, and `text mining`.


    ### Mahout


    `Mahout` is an open-source platform primarily used for unsupervised learning process
    and developed by `Apache`. It is most frequently used to develop `machine learning
    algorithms for clustering, classification, and collaborative filtering`. This
    software requires advanced knowledge and expertise to be able to leverage the
    full capabilities of the platform.


    ### MicroStrategy


    `MicroStrategy` is a `business intelligence and data analytics software that can
    complement all data mining models`. This platform offers a variety of drivers
    and gateways to seamlessly connect with any enterprise resource and analyze complex
    big data by transforming it into accessible visualizations that can be easily
    shared across the organization.


    # Data Analysis Strategies


    Data science is mainly used in decision-making by making precise predictions with
    the use of `predictive causal analytics`, `prescriptive analytics`, and machine
    learning.


    ### Predictive causal analytics


    It can be applied to develop a model that can accurately predict and forecast
    the likelihood of a particular event occurring in the future. For example, financial
    institutions use predictive causal analytics-based tools to assess the likelihood
    of a customer defaulting on their credit card payments by generating a model that
    can analyze the payment history of the customer with all of their borrowing institutions.


    ### Prescriptive analytics


    The `prescriptive analytics` are widely used in the development of `intelligent
    tools and applications` that are capable of modifying and learning with dynamic
    parameters and make their own `decisions`. The tool not only predicts the occurrence
    of a future event but is also capable of providing recommendations on a variety
    of actions and its resulting outcomes. For example, the self-driving cars gather
    driving-related data with every driving experience and use it to train themselves
    to make better driving and maneuvering decisions.


    ### Machine learning to make predictions


    To develop models that can determine future trends based on the transactional
    data acquired by the company, machine learning algorithms are a necessity. This
    is considered `supervised machine learning`, which we will elaborate on later
    in this book. For example, fraud detection systems use machine learning algorithms
    on the historical data pertaining to fraudulent purchases to detect if a transaction
    is fraudulent.


    ### Machine learning for pattern discovery


    To be able to develop models that are capable of identifying hidden data patterns
    but lack required parameters to make future predictions, the `unsupervised machine
    learning algorithms`, such as `Clustering`, need to be employed. For example,
    telecom companies often use the `clustering` technology to expand their network
    by identifying network tower locations with optimal signal strength in the targeted
    region.


    ![](images/00002.jpeg)


    # Chapter 2: Fundamentals of Python and Data Analysis Libraries


    ## Python

