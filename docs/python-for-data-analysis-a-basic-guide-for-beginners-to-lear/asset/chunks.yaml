    通过这一步，你已成功存储了数据集的副本并将其转换为"Pandas"框架！


    现在，使用 `head() as Sales_data.head()` 技术，可以显示数据框架中的记录，如下所示，以“感受”数据集中包含的信息。


    ![](img/00009.jpeg)


    ## Data Exploration


    我们可以快速探索数据以了解可以从中获取什么信息，并据此规划行动方案。


    在任何机器学习项目中，数据探索往往是一个非常关键的阶段。即使是快速的数据集探索也可以为我们提供重要的信息，否则这些信息很容易被遗漏，而这些信息可以提出重要的问题，我们然后可以尝试使用我们的项目来回答。


    这里将使用一些第三方 Python 库来帮助我们处理数据，以便我们可以有效地使用这些数据与 Scikit-Learn 的强大算法。前面部分中用于查看导入数据集的一些初始记录的相同的
    `head()` 技术也可以在这里使用。事实上，`head` 实际上能够做的不止是显示数据记录，并且可以自定义 `head()` 技术以仅显示选定的记录，使用诸如
    `sales_data.head(n=2)` 的命令。此命令将有选择地显示数据集的前 2 条记录。乍一看，很明显字符串数据包含在诸如 `Supplies Group`
    和 `Region,` 的列中，而诸如 `Opportunity Resultthe` `Opportunity Number,` 等列则由整数值组成。还可以看到在''
    Opportunity Number'' 列中为每条记录提供了唯一标识符。


    同样，要从表格底部显示选定的记录，可以使用 `tail() as sales_data.tail()`。


    要查看数据集中可用的不同数据类型，可以使用 Pandas 技术 `dtypes() as sales_data.dtypes`。有了这些信息，可以列出数据框架中可用的数据列及其各自的数据类型。例如，我们可以确定
    `object` 数据类型在 `Supplies Subgroup` 列中，而 `integer data type` 在 `Client Size By
    Revenue.` 列中。因此，我们了解了包含整数值或字符串数据的列。


    ## Data Visualization


    在这一点上，我们已经完成了基本的数据探索步骤，所以我们将不尝试构建一些有吸引力的绘图来直观地描绘信息并从我们的数据集中发现其他隐藏的叙述。


    在所有提供数据可视化功能的可用 Python 库中；`Seaborn` 是最好的可用选项之一，因此我们将使用它。确保由 `Seaborn` 提供的 python
    绘图模块已安装在你的系统上并准备好使用。现在，按照以下步骤为数据集生成所需的绘图：


    Step 1 – 使用命令 `import seaborn as sns.` 导入模块 `Seaborn`。


    Step 2 – 使用命令 `import matplotlib.pyplot as plt.` 导入模块 `Matplotlib`。


    Step 3 - 在设置中使用命令 `sns.set(style="whitegrid", color_codes=True)` 将绘图的 `background
