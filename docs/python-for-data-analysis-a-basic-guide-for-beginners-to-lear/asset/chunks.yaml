    # Introduction


    Congratulations on purchasing Python for Data Analysis: A Basic Guide for Beginners
    to Learn the Language of Python Programming Codes Applied to Data Analysis with
    Libraries Software Pandas, Numpy, and IPython and thank you for doing so.


    The following chapters will discuss the fundamental concepts of Data Analysis
    in light of the Python-based data libraries. You will start with a deep dive into
    the definition of "Big Data," along with its history and importance in the contemporary
    world. To further your understanding of this term, you will learn about different
    types of data. In the same chapter, you will learn all about Big Data Analytics
    and the steps involved in analyzing such large volumes of data. The topic of Data
    Analysis is incomplete without an understanding of the process of data mining,
    which can be defined as "the process of exploring and analyzing large volumes
    of data to gather meaningful patterns and rules." You will not only learn the
    end-to-end process of data mining but also be informed about its advantages and
    challenges. The first chapter of the book will conclude with an overview of select
    Data Analysis strategies.


    In the chapter 2 of this book titled, "Fundamentals of Python and Data Analysis
    Libraries", you will be introduced to the concept of the "Python" programming
    language followed by a variety of Data Analysis libraries including "Django",
    "Scikit-Learn", "NumPy", "Matplotlib", "Pandas", "IPython", and "TensorFlow" among
    others. The majority of the Data Analysis and machine learning models are developed
    in Python, as it is well suited to develop sophisticated models and production
    engines that can be directly plugged into production systems. One of the greatest
    assets of Python is its extensive set of libraries that can help researchers who
    are less equipped with developer knowledge to easily execute data analysis and
    machine learning activities.


    In chapter 3 of this book titled, "Predictive Modeling, Data Visualization, and
    Creation of Training Data Set," you will start by getting a brief overview of
    machine learning and various machine learning algorithms to help you understand
    the difference between "Big Data Analytics" and machine learning. We will then
    explore the concept of predictive analysis of data in the context of real-world
    customer behavior analysis, as practiced by most eCommerce business including
    "Amazon" and "Netflix." Machine learning models are used to generate predictions
    and forecasts for the growth of the business. A variety of data libraries that
    you will learn about in chapter 2 of this book will be used with the "Scikit-Learn"
    platform to give you a step-by-step walkthrough of how you can create your own
    predictive data analysis model starting with data exploration and data visualization.
    Once you have a good understanding of the raw data available for your analysis,
    you will be able to learn how to process raw data set and generating high-quality
    training and test data set for your model. This chapter will conclude a brief
    overview of scatter plots that can be used to visualize the data.


    In the final chapter of the book titled "Applications of Big Data Analysis," you
    will learn how big data and big data analytics are being leveraged by businesses
    across the industrial spectrum, with a focus on eCommerce, healthcare, and entertainment
    industry.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible; please enjoy!


    ![](images/00001.jpeg)


    # Chapter 1: Introduction to Big Data and Big Data Analysis


    ## Big Data


    In 2001, Gartner defined Big data as "Data that contains greater variety arriving
    in increasing volumes and with ever-higher velocity." This led to the formulation
    of the "three V''s." Big data refers to an avalanche of structured and unstructured
    data that is endlessly flooding and from a variety of endless data sources. These
    data sets are too large to be analyzed with traditional analytical tools and technologies
    but have a plethora of valuable insights hiding underneath.


    ## The “Vs” of Big data


    Volume – To be classified as big data, the volume of the given data set must be
    substantially larger than traditional data sets. These data sets are primarily
    composed of unstructured data with limited structured and semi-structured data.
    The unstructured data or the data with unknown value can be collected from input
    sources such as webpages, search history, mobile applications, and social media
    platforms. The size and customer base of the company is usually proportional to
    the volume of the data acquired by the company.

