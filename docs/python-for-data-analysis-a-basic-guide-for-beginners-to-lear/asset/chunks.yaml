  trans: '


    要了解不同特征之间的交互作用以及这些特征如何影响目标变量，机器学习算法必须学习一组信息。为此，我们需要将完整的数据集拆分为两个子集。一个子集将作为训练数据集，用于训练我们的算法以构建机器学习模型。另一个子集将作为测试数据集，用于测试机器学习模型生成的预测的准确性。


    ### 第一阶段

    本阶段的第一阶段是使用以下步骤分离特征变量和目标变量：


    步骤 1 – 要选择排除特定列的数据，请使用命令 `select columns other than ''Opportunity Number'', ''Opportunity
    Result''cols = [col for col in sales_data.columns if col not in [''Opportunity
    Number'',''Opportunity Result'']]` 。


    步骤 2 – 要删除这些特定列，请使用命令 `dropping the ''Opportunity Number'' and ''Opportunity Result''
    columns data = sales_data[cols]` 。


    步骤 3 – 要将 Opportunity Result 列分配为 `target`，请使用命令 `target = sales_data[''Opportunity
    Result''] data.head(n=2)` 。


    `Opportunity Number` 列被删除，因为它只是作为每个记录的唯一标识符。`Opportunity Result` 包含我们想要生成的预测，因此它成为我们的
    `target` 变量，并且可以从此阶段的数据集中移除。上述代码的第一行将选择除 `Opportunity Number` & `Opportunity Result`
    之外的所有列。这些列随后被分配给 `cols` 变量。然后使用 `cols` 变量中的列，开发了一个新的数据框架。这将成为 `feature set.` 接下来，使用
    `sales_data` 数据框架中的 `Opportunity Result` 列开发了一个名为 `target` 的新数据框架。


    ### 第二阶段

    本阶段的第二阶段是使用以下步骤将日期框架分离为训练和测试子集。根据数据集和所需的预测，需要相应地将其拆分为训练和测试子集。对于本次练习，我们将使用 75%
    的数据作为训练子集，其余 25% 将用于测试子集。我们将利用 `Scikit-Learn` 中的 `train_test_split()` 技术，使用以下步骤和代码来分离信息：


    步骤 1 – 要导入所需的模块，请使用命令 `from sklearn.model_selection import train_test_split`。


    步骤 2 – 要分离数据集，请使用命令 `split data set into train and test setsdata_train, data_test,
    target_train, target_test = train_test_split(data, target, test_size = 0.30, random_state
    = 10)`。


    通过上面的代码，首先导入了 `train_test_split` 模块，然后使用 `train_test_split()` 技术生成 `training subset
    (data_train, target_train)` 和 `testing subset (data_test, data_train).` `train_test_split()`
    技术的第一个参数涉及前一阶段中划分的特征，下一个参数与 `Opportunity Result` 目标相关。我们在此示例中使用 30%，但可以是任意数量。第四个
    ''random state'' 参数用于确保结果每次都可以重现。


    ## 构建机器学习模型


    `Scikit-Learn` 提供的 `machine_learning_map` 被广泛用于为数据集选择最合适的 ML 算法。对于本次练习，我们将使用 `Linear
    Support Vector Classification` 和 `K-nearest neighbors'' classifier` 算法。


    ### 线性支持向量分类

    `Linear Support Vector Classification` 或 `Linear SVC` 是 `Support Vector Machine
    (SVM)` 算法的子类，我们已在本书记载的第 2 章 `Machine Learning Algorithms` 中对其进行了回顾。使用 Linear SVC，数据可以划分为不同的平面，以便算法可以识别所有数据类的最佳组结构。


    以下是构建我们第一个 ML 模型的该算法的步骤和代码：


    步骤 1 – 要导入所需的模块，请使用命令 `from sklearn.svm import LinearSVC` 和 `from sklearn.metrics
    import accuracy_score`。


    步骤 2 – 要开发 LinearSVC 对象类型，请使用命令 `svc_model = LinearSVC(random_state=0)`。


    步骤 3 – 在训练算法并从测试数据生成预测时，请使用命令 `pred = svc_model.fit(data_train, target_train).predict(data_test)`。


    步骤 4 – 要显示模型准确率分数，请使用命令 `print (''LinearSVC accuracy:'', accuracy_score(target_test,
    pred, normalize = True))`。


    通过上面的代码，第一步导入了所需的模块。然后我们使用 `svc_model` 对象和 `random_state` 为 `0` 开发了一种类型的 Linear
    SVC。在步骤 3 中，`Linear SVC` 算法在训练数据集上进行训练，随后用于为测试数据中的目标生成预测。最后使用 `accuracy_score()`
    技术来验证模型的 `accuracy score`，例如可以显示为 `LinearSVC accuracy: 0.777811004785`。


    ### K-最近邻分类器

    `k-nearest neighbors (k-NN)` 算法被称为 `用于模式识别中分类和回归的非参数方法。` 在分类和回归的情况下，`输入由特征空间中最接近的
    k 个训练示例组成。` K-NN 是一种 `基于实例的学习` 或 `惰性学习` 形式，其中函数仅在本地估计，并且所有计算都推迟到分类为止。输出由以下事实驱动，即是否使用
    `k-NN` 的分类或回归方法：


    * `k-nearest neighbors classification` - `output` 是类的成员。`object` 通过其邻居的多数投票进行分类，将对象分配给其最近的
    `k-neighbors` 中最常见的类，其中 `k` 表示一个小的正整数。如果 k= 1，则 `object` 只是分配给最近邻居的类。

    * `k-nearest neighbors regression` - 输出是对象的属性值，该值计算为 k 个最近邻居值的平均值。


    一种对分类和回归都有帮助的方法是为邻居的贡献分配权重，以允许更近的邻居在平均值中做出更大的贡献，而远处的邻居则贡献较少。例如，一个已知的 `weighting
    scheme` 是为每个邻居分配权重 `1/d`，其中 `d` 表示与邻居的距离。邻居是从一组对象中选择的，这些对象的 `class`（对于 `k-NN classification`）或对象的特征值（对于
    `k-NN regression`）是已知的。


    以下是构建我们下一个 ML 模型的该算法的步骤和代码：


    步骤 1 – 要导入所需模块，请使用命令 `from sklearn. neighbors import KNeighborsClassifier` 和 `from
    sklearn.metrics import accuracy_score`。


    步骤 2 – 在创建分类器的对象时，请使用命令 `neigh = KNeighborsClassifier(n_neighbors=3)`。


    步骤 3 – 在训练算法时，请使用命令 `neigh.fit(data_train, target_train).`。


    步骤 4 – 要生成预测，请使用命令 `pred = neigh.predict(data_test)`。


    步骤 5 – 要评估准确率，请使用命令 `print (''KNeighbors accuracy score:,'' accuracy_score(target_test,
    pred)).`


    现在我们已经介绍了首选算法，可以轻松选择准确率分数最高的模型。在 Scikit-Learn 中，可以使用 `Yellowbrick library`，它提供技术来直观地描绘各种评分技术。


    ## 使用散点图进行数据可视化


    '
