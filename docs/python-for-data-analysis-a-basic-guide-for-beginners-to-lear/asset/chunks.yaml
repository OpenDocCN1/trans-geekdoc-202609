    ![](img/00011.gif)


    然后使用命令 `sns.set(rc={''figure.figsize'':(11.7,8.27)})` 定义绘图大小，该命令将绘图的大小定义为 `11.7px
    and 8.27px`。


    接下来，使用命令 `sns.countplot(''Route To Market'',data= sales data, hue=''Opportunity
    Result'')` 生成绘图。`countplot()` 技术使创建计数图成为可能，该计数图可以公开多个参数以根据我们的要求自定义计数图。作为第一个 `countplot()`
    参数，X 轴被定义为来自数据集的 `Route To Market` 列。下一个问题涉及数据集的来源，这将是我们之前导入的 `sales_data` 数据框架。第三个参数是条形图的颜色，定义为
    `blue` 代表 `won` 列和 `green` 代表 `loss` 列。


    ## Data Pre-processing


    到现在为止，你应该对数据集中有哪些信息有清晰的了解。为了将数据集中的分类标签如 `won` 和 `loss` 转换为数值，我们将使用 `LabelEncoder()`
    技术。


    让我们看看下面的图片，了解我们试图用 `LabelEncoder()` 技术实现什么。第一张图片包含 `color` 列，其中有 3 条记录，分别是 `Red,`
    `Green,` 和 `Blue.` 使用 `LabelEncoder()` 技术，同一 `color` 列中的记录可以转换为数值，如第二张图片所示。


    ![](img/00012.gif)                                     ![](img/00013.gif)


    让我们现在开始真正的转换过程。使用 `LabelEncoder()` 提供的 `fit transform()` 技术，可以对分类列的标签如 `Route
    To Market` 进行编码并转换为与上面图表中类似的数值标签。`fit transform()` 函数需要用户标识的输入标签，并因此返回编码后的标签。


    为了了解编码是如何完成的，让我们快速看一个例子。下面的代码实例构成了以城市列表形式存在的字符串数据，例如 `["Paris," "Paris," "Tokyo,"
    "Amsterdam"]`，它将被编码为类似于 `[ 2, 2, 1,3]` 的内容。


    Step 1 - 要导入所需的模块，请使用命令 `from sklearn import preprocessing.`。


    Step 2 – 要创建标签编码器对象，请使用命令 `le = preprocessing.LabelEncoder()`。


    Step 3 – 要将分类列转换为数值，请使用命令：


    ![](img/00014.gif)


    我们刚刚将字符串数据的标签转换为了数值。第一步是导入提供 `LabelEncoder()` 技术的预处理模块。随后创建了代表 `LabelEncoder()`
    类型的对象。然后，使用对象的 `fit_transform()` 函数来区分列表的不同类别 `[ "Paris," "Paris," "Tokyo," "Amsterdam,"]`
    并输出编码值 `[ 1 1 20]`。


    `LabelEncoder()` 技术根据类别的初始字母按字母顺序为类别分配数值，例如 `(A)msterdam` 被分配代码 `0`，`(P)aris`
    被分配代码 `1`，`(T)okyo` 被分配代码 `2`。


    ## Creating Training and Test subsets


