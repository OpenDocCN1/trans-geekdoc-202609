    对于新的‘Pandas’用户来说，上面代码中提到的 `pd.read_csv()` 技术会生成一个名为“data framework”的表格数据结构，其中每一行的索引包含在第一列中，而每一列的标签/名称在第一行中取自位于初始列中的数据集的名称。在上面的代码片段中，`sales
    data` 变量导致一个如下面图片所示的表格。


    ![](img/00008.jpeg)


