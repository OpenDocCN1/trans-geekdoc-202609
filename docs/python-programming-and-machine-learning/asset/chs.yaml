  \ 机器学习的核心库\n- 第十章 人工神经网络\n- 第十一章 数据科学\n- 第十二章 深度学习速览\n- 结论\n\n## 引言\n\n提到开发者和编程通常会让很多人的思想转向更广泛的计算机科学研究。计算机科学是一个广泛的研究领域。在机器学习中，计算机在算法的帮助下从经验中学习。为了实现目标，它们必须使用具有特定特征和属性的数据。这就是它们如何识别可以帮助我们做出重要决策的模式。在机器学习中，任务被归分为不同的类别，例如预测模型和聚类模型。机器学习背后的概念是为相关问题提供解决方案，而不一定等待直接的人类交互。\n\
  \n人类以从经验中学习而称。考虑你正在学习阅读或说一种新语言的情况。随着时间的推移，你会看到进步。机器学习借鉴了人类表现出的学习概念。当计算机系统反复接触到相同的情况时，它们会随着时间的推移，在应对该情况的方式上表现出改进。机器学习通常依赖数据。它涉及设计和开发计算机系统，这些系统可以提取数据集中各种变量之间的模式、趋势和关系。这些知识随后可以用来预测未来会发生什么。\n\
  \n阅读愉快！\n\n## 第一章 什么是机器学习\n\n我们在指南中第一个需要查看的主题是机器学习。这基本上是一个过程，你试图教计算机或其他机器如何利用它们与特定用户的经验以及过去看到的某些事情，来帮助它们在未来表现得更好。有很多关于这种如何工作的例子，例如语音识别设备，甚至是搜索引擎。\n\
  \n在我们阅读本指南的过程中，你会发现在使用机器学习时，可以使用许多不同的方法和算法来让机器学习，但你选择的方法实际上取决于你想得到什么的结果以及你决定处理的项目。\n\
  \n\n\n\n由于现在层出不穷的新计算技术，我们今天所熟知的机器学习与过去看到的机器学习已经大不相同。它诞生于对模式的形状识别，以及关于计算机如何在没有程序员干预确保其执行特定任务的情况下，能够实现实际学习的想法。对人工智能所实现的某些功能感兴趣的研究人员，也想看看他们的机器是否能够从输入的数据中进行学习。\n\
  \n这种机器学习伴随的迭代特性应该被视为一种重要的编程工具，因为当我们把通过这种学习创建的任何模型暴露给新数据时，模型能够自主且独立地进行适应。机器将能够学习过去发生过的事情以及提供给它的示例，以便在未来做出准确且可靠的预测。\n\
  \n近年来，由于几个不同因素的影响，人们对机器学习的兴趣再次复燃。特别是，像贝叶斯分析和数据挖掘等某些领域也变得越来越流行，在这个过程中，机器学习的使用将比以往任何时候都更加频繁。\n\
  \n所有这些点都意味着，现在通过机器学习自动生成模型变得更加容易、更快速。这些模型现在能够分析更大、更复杂的数据，同时提供更快、更准确的结果，即使是在在大规模执行时也是如此。由于所有这些要素能够汇聚并构建出更精确的模型，组织将能够比以前更好地识别盈利机会，同时预先规避更多未知的风险。这一切共同帮助公司在市场中变得更具竞争力。\n\
  \n为了确保你在机器学习中使用的系统确实是好的，需要几项要素共同作用。其中一些将包括：\n\n1. 集成建模\n2. 可扩展性\n3. 迭代和自动化流程\n4.\
  \ 算法，基础与高级算法的良好结合\n5. 数据准备能力\n\n使用机器学习的一个奇妙之处在于，几乎每个行业都能使用它。在技术领域，它仍然相对新颖，因此即使到目前为止取得的惊人成就也只是开始，人们相信这种技术在过程中能够完成更多事情。\n\
  \n随着时间的推移，机器学习可能会大幅增长。目前，许多公司正在使用它来弄明收到的数据告诉了他们什么，弄明如何随时间推移做出更好的业务决策，而不是自己做决定，并发现数据中隐藏的、人类无法遍历的模式。\n\
  \n但这仅仅是我们在机器学习方面所能做到的开始。还有大量的其他应用，我们现在能做的事情仅仅是开始。随着越来越多的人和开发者开始接触机器学习，并在其中加入一些 `Python`\
  \ 语言，可能会有越来越多的应用程序出现。\n\n大多数已经在处理海量数据的行业都能够识别出使用机器学习技术所带来的价值。通过能够实际处理这些数据并从中洞察一些良好的见解，并能够近乎实时地这样做，公司就能以更高效的方式工作，从而在同行业中获得巨大的竞争优势。\n\
  \n这就是使用机器学习的美之处。在机器学习的帮助下，我们能够做一些过去看似不可能的事情现在是可能的。处理的数据比以往任何时候更多的企业正在发现机器学习的价值，可以帮助他们完成工作。他们处理这些信息的速度比人工查看快得多，并能带给他们竞争竞争优势。\n\
  \n许多不同的公司将从运行在机器学习上的程序中受益。已经在使用这种技术的某些行业包括金融服务、政府、医疗保健、零售、石油天然气、运输等。\n\n机器学习类似于人工智能，它允许计算机进行学习，就像我们在人类大脑中看到的那样。在人类的极少监督下，机器能够自动化许多任务，找到你想要的信息，并获得一些你可能无法通过其他方法自行找到见解和预测。本指南将花费一些时间研究你如何借助\
  \ `Python` 编程语言进行这类机器学习，以便你能够迅速启动自己的项目。\n\n## 第 2 章 机器学习的应用\n\n机器学习帮助改变了当今世界企业工作和运作的方式。通过机器学习，可以提取大量数据，使用户户更容易从数据集中得出某些预测。\n\
  \n如果任务包括对大量数据的分析，那么一个人无法在规定的时间内完成许多手动任务。机器学习是此类问题的解决办法。在现代世界中，我们被海量的数据和信息淹没，人类无法处理这些信息。因此，需要此类流程自动化，而机器学习为此提供了帮助。\n\
  \n当任何分析或发现被完全自动化后，将从该分析中获取必要信息将变得更容易。这将有助于工程师自动化未来的任何流程。业务分析、数据科学和大数据的世界需要机器学习和深度学习。商业智能和预测性学习不再局限于大型企业，小公司和小企业也可以使用。这使得小企业能够有效利用其收集的信息。本节涵盖了机器学习在现实世界中的一些应用。\n\
  \n### 虚拟助理\n\n虚拟助理的一些示例包括 Allo、Google Now、Siri 和 Alexa。这些工具帮助用户通过语音命令访问信息。你只需要激活助手，就可以向机器提任何你想问的问题。\n\
  \n你的个人助手将根据你的问题寻找必要信息，然后为你提供答案。你还可以使用这个助手执行常规任务，如设置提醒或闹钟。机器学习是该工具的重要组成部分，因为它帮助系统收集答案所需的必要信息。\n\
  \n### 密度估计\n\n### 隐变量\n\n\n\n当你处理潜变量时，机器会尝试识别这些变量是否与数据集中的其他数据点和变量相关联。当你使用一个难以识别不同变量之间关系的数据集时，这是一个非常有用的方法。有时，你无法识别某个变量发生变化的原因。如果工程师能够查看数据集中的不同潜变量，他们就能更好地理解数据。\n\
  \n## 维度削减\n\n用于训练机器预测任何问题结果的数据集都会包含某些维度（维度）和变量。如果数据集中的维度超过三个，人类的大脑将无法对这些数据进行可视化或理解。在这些情况下，最好使用机器学习模型将数据量减少为更易于管理的较小分段。这将帮助用户识别数据集内部存在的关系。\n\
  \n每个机器学习模型都会确保机器从为其提供的数据中进行学习。然后，可以使用该机器来对数据进行分类，或为特定问题预测结果或结果。它还可以被应用于诸如自动驾驶汽车等许多应用中。机器学习模型有助于提高智能手机识别用户脸部的能力，或者帮助\
  \ Google Home 或 Alexa 识别你的口音和声音，而且如果它们学习的时间更长，机器的准确性就会提高。\n\n## 构建机器学习系统的步骤\n\n\
  无论你试图构建的是哪种模型或试图解决的是什么问题，在构建机器学习算法时，你都将遵循本节提到的步骤。\n\n### 定义目标\n第一步与你执行的任何其他任务一样，是定义你通过你的系统想要实现的目的或目标。这是一个重要的步骤，因为你将收集的数据、使用的算法以及许多其他因素都取决于这个目标。\n\
  \n### 收集数据\n一旦你确定了目标，就应该收集所需的数据。这是一个耗时的过程，但你必须完成的下一个重要步骤。你应该收集相关数据，并确保它们对于你试图解决的问题是正确的数据。\n\
  \n### 准备数据\n这是另一个重要步骤，但工程师往往忽视它。如果你忽视了这一步，你就会犯错。只有当输入数据是干净且相关的，你才能获得准确的结果或预测。\n\n\
  ### 选择算法\n可以使用许多算法来解决问题，包括支持向量机（SVM）、k-近邻、朴素贝叶斯（Naive-Bayes）和 Apriori 等等。你必须选择最适合目标的算法。\n\
  \n### 训练模型\n当你的数据集准备好后，你应该将其输入系统，并帮助机器使用所选算法进行学习。\n\n### 测试模型\n当你的模型训练完成，并且认为它已经提供了相关结果时，你可以使用测试数据集来测试模型的准确性。\n\
  \n### 预测\n模型将对训练数据集和测试数据集进行多次迭代。你可以查看预测结果并向模型提供反馈，帮助它改进所做出的预测。\n\n### 部署\n一旦你测试了模型并对它的工作方式表示满意，就可以对该模型进行消毒并集成到任何你想使用的应用程序中。这意味着你开发的模型现在可以部署了。\n\
  \n所遵循的步骤将取决于你所使用的应用程序类型和算法。你可以选择使用监督学习或非监督机器学习算法。本节中提到的步骤通常是大多数工程师在开发机器学习算法时遵循的步骤。有许多工具和函数可以用来构建机器学习模型。此书将帮助你更多地了解如何使用\
  \ `Python` 设计机器学习模型。\n\n## 第 3 章：大数据与机器学习\n\n为了学习某些东西，能够进行机器学习的系统需要接触大量数据。回溯几十年年前，与今天能够访问的数据相比，计算机无法获取那么多数据。当时的计算机运行缓慢，而且非常笨拙。那时大部分数据都存储在纸上，因此计算机系统无法直接访问。数据量也要少得多。当然，公司、大型企业以及政府一直在尽可能多地收集数据，但当你没有那么多数据，且数据大部分以纸质记录的形式存在时，对于机器学习计算机系统来说，有用数据并不多。\n\
  \n第一个数据库诞生于 20 世纪 60 年代后期。考虑数据与机器学习之间的关系时，数据库并不是我们想象的那种东西，尽管在某些情况下可能是。数据库收集非常有组织的信息。为了理解这种区别，请想一组\
  \ Facebook 帖子集合，对比某人注册入学大学的记录。Facebook 帖子的集合将是杂乱且混乱的。它将包含不同类型的数据，如照片、视频、链接和文本。它将是完全未分类的，可能只标记了发布者和日期。\n\
  \n此相反，当你提到数据库时，你应该考虑到完全组织且受限的数据。数据库由单条记录组成，每条记录包含相同的数据字段。在大学里，学生入学时可能会输入他们的姓名、社会安全号或\
  \ ID 号、地址等。\n\n所有这些记录都以相同的格式存储在同一个一个大文件中。然后可以对该文件进行“查询”，以返回我们请求的记录。例如，我们可以让它返回大一所有学生的记录。\n\
  \n关系型数据库允许你交叉引用信息并在查询中将其整合在一起。遵循我们的示例，你可以有一个独立的数据库，其中包含每个学生修读的课程。这可以存储在与学生基本信息独立的数据库中，但可以使用学生\
  \ ID 字段进行交叉引用。\n\n开发了一些工具来帮助从不同的数据库汇总数据。IBM 一直在计算机科学的许多发展中起着重要作用的公司，开发了第一种结构化查询语言\
  \ `SQL`，它可以用于执行此类任务。一旦数据被汇总在一起，就可以对其进行分析，或用于为人类操作员打印报告。\n\n\n\n\n随着计算能力的增长，这种数据收集在现实世界中也在增加。例如，杂货商店开始提供所谓的折扣和会员卡，这些卡片真的可以追踪人们的购买情况，以便公司能够为客户提供定制化优惠，并调整他们的营销计划等。\n\
  \n互联网还将将云计算的概念推向了前沿。它不再仅仅是在办公室里拥有一台计算机或一个计算机网络，而是提供了利用互联连接的多台计算机算力的可能，将其用于信息处理、计算以及简单的数据存储。\n\
  \n第三项进展是计算机系统存储组件成本的持续下降以及容量的增加，这在该领域产生了巨大影响。很快，收集的数据越来越多。像 `Google` 以及最终的 `Facebook`\
  \ 这样的大公司也开始收集关于人们行为的大量数据。\n\n这就是机器学习大显身手的地方。第一次，机器学习系统执行现实世界任务（而不仅仅是执行如下国际象棋之类任务）所需的海量数据变得可能。机器学习系统在数据集上进行训练，而现在企业（以及政府）拥有各种类型的数据来训练机器学习系统以执行许多不同的任务。\n\
  \n## 机器学习的目标与应用\n\n只要在任何大型数据集中存在有用的模式，机器学习就可以投入。在许多情况下，在数据被输入机器学习系统之前，人们并不知道存在哪些模式。这是因为人类无法看到大型数据集中的底层模式，但计算机非常擅长发现这些模式。模式的类型没有任何任何限制。例如，机器学习系统可以用于检测针对计算机网络的黑客攻击尝试。通过向系统输入包含以往黑客攻击的历史数据，可以对其进行网络安全训练。\n\
  \n![00002.jpeg](img/image00274.jpeg)\n\n在另一个案例中，机器学习系统可以用于开发脸部识别技术。给系统提供大量包含脸部的照片，以便它可以学习识别脸部，并将特定的脸部与特定的个人联系起来。\n\
  \n现在让我们考虑机器学习的另一个应用，它与我们目前观察过的其他两个完全不同。机器学习可以用于批准或拒绝贷款申请。在训练阶段，系统将接触到大量的之前的贷款申请及其最终结果。换句话说，借款人是提前还清了贷款，还是违约了？在接触所有数据的过程中，系统将学习哪些特征或特征组合最能预测给定的申请人是否会违约。这一切都是在没有人工干预的情况下完成的，因此机器可能会在数据中发现人类观察者错过且从未怀疑过存在的模式。事实是，人类的大脑并不擅长分析大型数据集，有些人可能会认为我们根本无法做到这一点。\n\
  \n机器学习最早的应用之一是电子垃圾邮件检测。这是一个非常值得研究的例子，因为它说明了机器学习系统擅长解决的一种特定问题。判断一封邮件是否为垃圾邮件可以被建模为一个分类问题。换句话说，你对每封邮件进行检查，并将其分类为垃圾邮件或非垃圾邮件。这不是绝对的，而且检测所有垃圾信息可能是复杂的。\n\
  \n信用卡和借记卡的欺诈检测是机器学习的另一个应用。通过研究过去的数据，系统可以学习检测使用中的模式，这些模式表明卡片正被用于欺诈活动。在许多情况下，检测到的模式是人类观察者完全没有意识到的，或者即使他们知道这些模式的存在也不会将其与欺诈检测联系起来。\n\
  \n因此，我们看到机器学习几乎可以应用于任何有大量数据且数据中存在可用于检测或预测模式的情况。机器学习具有很强的通用性，能够学习任何内容，从下国际象棋到发现诸像\
  \ `Southwest` 这样的航空公司的燃料浪费。这并不是 20 世纪 60 年代或 70 年代科幻作家曾经想象的人工智能，但它具有许多人类学习的特征。第一是它是非常通用的。第二是它接触的数据越多，它的表现就越好。\n\
  \n现在让我们考虑机器学习的目标。机器学习的核心目标是开发通用的算法，利用智能和学习来解决问题。\n\n显然，机器学习的一个重要目标是提高生产力。无论系统的用户是企业、军事部门还是政府机构，这一点都是成立的。\n\
  \n第二个目标是用更好的机器劳动取代人类劳动。当然，自工业革命开始以来这一直一直是技术的目标，并且今天仍然是一个重要目标。然而，在机器学习的情况下，这种实现方式有点不同。第一点是使用机器学习执行人类无法提供的注意力和专注力的任务。即使人类是能够提供最大专注力的优秀工作者，人类也会受到许多缺陷的影响，如疲劳和分心。此外，人类观察者在任何时刻能够关注的信息量是非常有限的。考虑机器学习系统——专注从不是问题。计算机系统能够以人类永远无法的方式产生激光般的专注。其次，它能够分析和采样远得多的数据集，而且它永远不会受到疲劳的影响，也不需要上厕所或吃午餐。\n\
  \n从广义上说，今天许多业务正在使用的一个应用是使用机器学习来发现浪费。几家大型公司已经从中取得了巨大的成功。我们已经提到一个，`Southwest` 曾利用机器学习分析航空公司在停机位的活动，他们发现了时间方面的巨大浪费，飞机在停机时浪费了燃料。`UPS`\
  \ 也利用机器学习来识别浪费路线，这些路线浪费了公司的金钱，并导致数千辆卡车浪费了大量的燃料。机器学习还可以应用于员工在做什么以及他们如何更好地利用时间。\n\n\
  ### 机器学习的好处\n\n对于使用机器学习的企业来说，有很多好处。我们在这里总结其中一些：\n\n- 机器学习可以轻松发现任何底层数据集中的模式。\n- 基于机器学习的系统会随着经验变得更好。看到的数据越多，它们就越好。\n\
  - 机器学习具有很强的通用性，适用于几乎任何应用，从检测计算机网络的黑客攻击到挑选盈利股票。\n- 机器学习系统可以处理人类观察者无法应付的多维问题。\n- 一旦系统过了学习阶段，就不再需要人工干预。这是一个真正的自动化系统。\n\
  \n\n\n\n\n## 机器学习是如何工作的\n\n机器学习的起点是数据科学家形式形式的人类指导。必须先确定一个可以使用机器学习算法来解决的问题。为了使该过程能够运行，在系统部署到现实世界之前，必须有大量的数据可用于训练系统。机器学习进展有两种基本方式，它们被称为监督学习和无监督学习。\n\
  \n在训练阶段，数据科学家将选择合适的训练数据，并让系统接触到这些数据。随着系统接触到数据，它将修改自身以变得更加准确。这一阶段是系统开发中的关键部分，数据科学家必须为手头的问题选择正确的数据集。换句话说，人类完全没有参与其中的观点是完全错误的。人类参与了问题的选择和框架构建，以及正确训练数据的选择。人类还参与了系统性能的评估过程。正如我们所看到的，必须进行某些权衡，这些权衡对系统的可行性具有巨大影响。如果处理问题的的数据科学家在解释系统产生的结果时不够仔细，且未能尽全力做到准确，那么可能会部署一个功能故障的系统，该系统在尝试执行任务时会出错。\n\
  \n训练阶段可能会进行多次迭代，取决于结果如何。\n\n一旦系统部署，它将将在或多程度上以自主的方式运行，但参与这项工作的数据科学家应该持续评估系统的性能。在某些情况下，如果系统没有产生可接受的结果，它可能需要更换或需要接受更多训练。\n\
  \n## 机器学习的步骤\n\n数据科学家必须遵循特定的程序来实现机器学习。我们将学习在“训练”系统时使用的两种不同方法。机器学习涉及人工智能，因此任何拥有人工智能的系统都就像人类一样，即系统在进入现实世界之前需要学习其技能。提供系统所需的训练是数据科学家的责任。\n\
  \n定义 定义问题\n\n机器学习范式中的每一步都是至关重要的。如果你在早期犯了错误，整个项目将会失败。当你提到人工智能时，虽然你可能会觉得有一台无所不能的计算机，比如《2001\
  \ 漫游》中的 `HAL 9000` 系统，但现实要接地气得多。\n\n确实，并没有由人类工程师用代码编写的特定的、逐行的指令集来告诉计算机做什么，而且一旦机器学习系统被部署，人们可能并不真正理解它是如何工作的。尽管如此，在这一过程中有大量直接的人类参与。鉴于我们容易犯错的倾向，在路径的每一步保持谨慎是非常重要的。将自己想象成一名老师，引导孩子学习新技能。\n\
  \n第一步是对你所面临的问题有明确的定义。必须将最终目标牢心中，所以你必须知道期望机器学习系统在运行时做什么。\n\n收集并准备数据\n\n第二步是收集训练系统所需的数据。如果你定义了问题，但很少或没有数据可以用于训练，那么这个程序将无法运行。机器学习必须拥有足够的数据，以便系统能够确定数据中的模式和关系，使其能够在现实世界中进行预测和分类。\n\
  \n假设已经收集了足够正确类型的数据。但仅拥有数据是不够的。如果你只是向系统输入原始数据，可能会出于许多原因引发问题。因此，你必须查看数据并进行人类判断。将数据认为由大量的字段或属性组成。所有的属性都与手的问题相关吗？\n\
  \n很多情况下，机器学习系统将发现不同属性之间具有预测价值的关系，而人类会忽略这些——因此在减少数据与移除可能非常重要的内容之间需要进行平衡，尽管这些内容对人类操作员来说并不相关。\n\
  \n尽管如此，你不希望数据集中包含过多的信息导致无法学习。因此，如果可能，你可能需要丢弃一些数据以降低问题的复杂性。\n\n选择学习风格\n\n这些将基于问题的性质和你拥有的数据类型。这是过程中简单的一步，因为这将决定所使用的学习风格。学习的主要类型有：监督学习、无监督学习、半监督学习和表示学习。我们将学习每种学习适用于什么类型的问题，以及输入数据的结构何不同。\n\
  \n选择最合适的算法\n\n一旦你确定了数据和你要解决的问题最适合监督学习还是无监督学习，你就需要决定使用哪种算法。某些情况可能会决定一种算法是否比另一种更好。选择正确的算法可能会对你在结果中看到的错误类型产生影响。\n\
  \n这意味着对于使用机器学习的人来说，理解算法的主要类型是非常重要的。\n\n训练与测试\n\n现在此时，一切都已准备就绪。第一步是让系统接触训练数据以便学习。然后你对系统进行测试和评估。\n\
  \n改进\n\n当你使用训练和测试数据评估系统性能时，误差需要被量化。如果误差不可接受，可能需要进行调整。在某些情况下，你可能需要放弃系统并重新开始，但机器学习的优点之一是系统是自适应的。看到的数据越多，学得越好。因此，通过简单让系统接触更多的训练数据来实现改进是可能的。\n\
  \n部署\n\n一旦系统达到可接受的误差水平，就可以部署了。\n\n## 第 4 章：机器学习的类型\n\n![00002.jpeg](img/image00275.jpeg)\n\
  \n在一个沉浸在人工智能的世界里，深入理解机器学习很有趣。这个概念允许算法在不依赖任何明确指令的情况下执行特定任务。相反，机器依靠推理和模式，使用户将数据喂给通用算法，而不是编写代码。作为回应，机器根据输入数据构建逻辑。通常，会评估算法所做预测的准确性，并且只有当精度可接受时算法才会被部署。\n\
  \n机器学习有三大类。我们将在下文中详细讨论每一种。\n\n1. 监督学习\n\n\n\n\n\n这种范式恰是最流行的，可能因为它易于理解和执行。在这里，算法从带标签的数据集中创建一个数学概念，即一个同时包含输入和输出参数的数据集。该数据集充当模型的训练器。作为一个例如，我们可能决定使用该算法来判断某个特定图像是否包含某个物体。在这种情况下，数据集将包含包含和不包含输入（该物体）的图像，每张图像都有一个输出，指明其是否包含该特定物体。算法可能会预测任何答案，无论正确或错误。然而，在几次尝试后，它学会了只选择包含所述物体的图像。一旦它完全训练完成，即使在输入新数据时，算法也会开始做出正确的预测。监督学习模型的一个完美例子是支持向量机。在下图中所示，支持向量机将数据划分为由线性边界隔开的区域。你会发现该边界将白色圆圈与黑色隔离开。\n\
  \n![C:\\Users\\USER\\Desktop\\support vector machine.png](img/image00276.jpeg) \n\
  \n## 监督学习的类型\n\n### 分类\n这些算法用于输出仅限于离散值的情况。例如，在过滤邮件的情况下，一封传入的邮件会被归类为输入，而输出则是文件夹名称。\n\
  \n### 回归\n这种算法的输出具有连续值，这意味着它们可以选取给定范围内的任何值。完美的例子包括：温度、风速、商品价格等。\n\n![C:\\Users\\\
  USER\\Downloads\\IMG\\_20190916\\_141540.jpg](img/image00277.jpeg) \n\n监督式机器学习体现在许多常见应用中，其中一些我们已经在下文中讨论过。\n\
  \n- **广告状态**：你在浏览互联网时遇到的大多数广告之所以定位在该处，是因为有一个监督学习算法为它们的点击率和人气提供了背书。\n- **人脸识别**：这在\
  \ Facebook 上非常常见。它很可能出现在 Facebook 上。\n- **垃圾邮件分类**：这是一个非常常见的应用，我们已经在下文中讨论过。\n- **分类任务**：这是监督学习的一个完美示例。参考下图。\n\
  \n![C:\\Users\\USER\\Desktop\\classification.jpg](img/image00278.jpeg)\n\n\n\n\n\
  \n| 特性 | 监督学习 | 无监督学习 |\n| :--- | :--- | :--- |\n| 数据使用 | 利用训练数据来研究输入与输出之间的关系。 |\
  \ 不使用输出数据。 |\n| 结果准确性 | 高且可靠。 | 准确性较低，因此不可信。 |\n| 输入数据 | 在训练算法中使用带标签的数据。 | 针对未标记的数据使用算法。\
  \ |\n| 类别数量 | 类别数量已知。 | 类别数量未知。 |\n| 主要缺点 | 大分类。 | 由于使用了标记和未知数据，无法获得关于输出和数据排序的精确信息。\
  \ |\n| 实时学习 | 学习离线进行。 | 学习实时发生。 |\n| 过程 | 同时给出输入和输出变量。 | 仅给出输入数据。 |\n| 计算复杂度 | 相对简单；复杂度较低。\
  \ | 计算上较为复杂。 |\n\n选择采用监督还是无监督机器学习算法，传统上取决于你的数据量和结构。本质上，一个良好的数据科学计划会同时使用这两种算法来构建预测数据模型。现在，这些模型更加先进，可以帮助利益相关者在各种业务支持中做出决策。\n\
  \n### 3. 强化学习\n\n这是一种神经网络学习技术，训练机器学习概念如何做出一系列决策。代理（Agent）被训练如何在一个不确定的、可能复杂的环境中实现目标。在这种技术中，人工智能进入一种类似游戏的情况，计算机尝试使用试错法来解决问题。为了让程序员机器执行他们想要的操作，人工智能会对所执行的行为进行惩罚或奖励。其核心思想是充分利用总奖励。\n\
  \n通常有一个以游戏规则形式存在的奖励策略，但设计者不会提供关于模型应如何解决谜题的提示。模型从完全随机的尝试开始，进步到复杂的方法甚至是超人的技巧。在这个过程中，这种技术利用了搜索的全部力量，因此在提示机器创造力方面是最有效的。与人类不同，只要在足够强大的计算机基础设施上运行，人工智能就可以利用强化算法从成千上万次并行游戏中收集经验。\n\
  \n让我们来看一个具体的例子，它将完美地说明强化学习技术。在此之前，我们需要理解在插图中将使用的一些术语。\n\n*   **代理 (Agent)**：这是一个隐性实体，通过在环境中执行动作来寻求奖励。\n\
  *   **环境 (Environment (e))**：代理必须面对的情况。\n*   **奖励 (Reward (R))**：在执行特定动作时给予代理的即时响应。\n\
  *   **状态 (State (s))**：环境返回的当前场景。\n*   **策略 (Policy (π))**：代理根据当前状态确定下一个动作的方法。\n\
  *   **价值 (Value (V))**：预测的长期回报，与短期奖励相比经过折扣。\n*   **价值函数 (Value Function)**：规定总奖励，即状态价值。\n\
  *   **基于模型的方法 (Model based methods)**：处理应用基于模型技术的强化学习问题。\n*   **环境模型 (Model of the\
  \ environment)**：模拟环境的行为，帮助你对环境行为得出结论。\n*   **动作值 / Q 值 (Action value / Q value\
  \ (Q))**：这与价值没有太大。实际上，唯一的区别是它多了一个当前动作作为参数。\n\n### 插解\n\n想象尝试教你的狗一些新花样。这只狗不懂人类语言，所以你需要制定一个策略来帮助你实现目标。你会开启一个情况并观察狗的各种反应。如果狗以想要的方式做出，你就给它一些牛肉。你会发现，每当你让狗处于类似的情况下时，它们往往会以更大的热情做出反应，希望能获得奖励（牛肉）。这意味着积极经历激发了你的狗给出的反应。同样，还有负面经历，教导狗什么不该做什么，因为如果它们做了，就一定会错过那份牛肉。\n\
  \n在给定的范式中，你的狗是暴露在环境中的代理。你可能设定你的情况是当你说出一个特定的词时，坐着的狗必须行走。该代理通过执行动作做出响应，从一个状态过渡到另一个状态，例如从坐着过渡到行走。在这种情况下，`policy`\
  \ 是在给定状态下选择动作的过程，以期望获得更好的结果。过渡之后，代理可能会得到惩罚或奖励。\n\n### 强化学习算法\n\n强化学习算法的实现有三种技术。\n\
  \n1.  **基于价值的 (Value-based)**：在这里，代理预测策略下当前状态的长期回报，因此你必须最大化`value function`。\n2.\
  \  **基于策略的 (Policy-based)**：在这种强化学习方案下，你试图找到一个`policy`，使得在每个状态下执行的动作都能带来未来最大的奖励。\n\
  \    *   基于策略的方法进一步分为确定性的（其中`policy`对任何状态产生相同的动作）和随机性的（每个动作都有由随机策略确定的确定概率）。随机策略为`n(a|s)\
  \ = P(A=a|S=s)`。\n3.  **基于模型的 (Model-based)**：在这种情况下，你被要求为每个环境生成一个虚拟模型，代理在该环境中学习如何在该环境中表现。\n\
  \n### 强化学习的类型\n\n#### 正强化 (Positive)\n这是由特定行为触发的事件。它正向影响代理所采取的动作。通过增强行为的频率和强度来实现。这种方法有助于你维持更长时间的变化。尽管如此，你必须小心，因为过度强化可能会导致状态过度优化并影响结果。\n\
  \n#### 负强化 (Negative)\n它涉及强化由负面条件引发的行为，这种条件本应被避开或停止。虽然它有助于定义最低底限，但这种方法仅能满足最低行为，这是一个缺点。\n\
  \n### 强化学习在现实生活中的应用\n*   数据处理和机器学习。\n*   业务策略规划。\n*   工业自动化的机器人技术。\n*   飞机和机器人运动管理。\n\
  *   帮助为学生创建定制化培训系统。\n\n### 总结\n*   无监督学习中的数据是有标记的且未知的，因此你的准确性较低且不可信。\n*   从一张图像移动到另一图像时，会有各种信息，因为类的光谱属性也可能随时间变化。\n\
  *   无监督机器学习定位数据中所有未知的未识别模式。\n*   用户必须花时间来标记和解释遵循特定分类的类别。\n*   无监督学习的主要缺点是无法获得关于数据排序的准确信息。\n\
  *   强化学习是一种具有三种算法的机器学习方法；1) `value-based`，2) `policy-based` 和 3) `model based`。\n\
  *   强化学习有两种类型：1) `positive` 和 2) `negative`。\n*   如果有充足时，不应使用 RL 来解决问题。\n*   主要的\
  \ RL 方法缺点是学习速度可能会受到参数的影响。\n\n\n\n\n\n在涉及到机器学习和 Python 语言的工作时，没有比处理数据更好的方法了。你收集和清洗的数据越多，处理伴随这一过程而来的某些算法就越越容易。你会发现\
  \ Python 将为我们提供许多算法，但我们首先需要能够对数据进行组织，并将其准备好，以通过算法进行训练和测试，从而看到我们想要的结果。\n\n考虑到这一点，我们需要花一些时间来探索我们能够使用的不同类型的数据。我们必须查看非结构化数据和结构化数据之间的一些差异，以及何时使用每一种，以及我们如何使用这些类型的数据来帮助我们训练和测试某些\
  \ Python 机器学习算法。\n\n## 结构化数据集\n\n我们需要花时间处理的第一类数据是结构化数据。传统上，我们过去就有这种数据，它们获取起来较困难，但很容易处理。公司会寻找他们需要的某些结构化数据，然后做出为了向前推进所需的业务决策等更多内容。\n\
  \n这类数据是指任何经过良好组织并随后放入格式化存储库供我们使用的数据。通常，这些数据是存储在数据库中的，以便这些元素可以被用于更有效的处理和分析。\n\n当我们通过其他数据库来帮助获取信息，或者当我们获得调查结果时，我们可能会找到这类数据。这种数据要容易处理得多，因为已经被组织好了，而且它会符合你想要处理的算法，而你不需要担心缺失值、重复值、离群值或任何其他此类。这也是一种更昂贵的数据处理方法，也可能让整体处理变得更加困难。\n\
  \n这就是为什么许多公司必须在想要处理的多少结构化数据和多少非结构化数据之间进行平衡。结构化数据可以让工作变得简单，并确保算法运行得更好，但它收集起来更困难；非结构化数据虽然更容易收集，但它可能会让算法的运行和工作变得更复杂。\n\
  \n## 非结构化数据\n\n我们需要处理的第二类数据是非结构化数据。（注：此处原文未提供具体正文，仅根据标题延续了翻译逻辑）\n\n\n\n\n现在，在某些情况下，离群值也是重要的。如果你在观察一些离群值，发现有很多离群值聚类某一个簇或组中，那么这可能意味着我们需要开始关注并利用这些离群值。如果你看到这一组中有大量的离群值，而仅仅是一两个随机的离群值，那么这可能是一个良好的信号，表明在接触客户、营销以及你想要发布的新产品等方面有了新的处理方案。查看这些离群值并无坏处，但在很多情况下，你可能想要删除它们。\n\
  \n此外，我们需要关注重复项。很多时候，我们需要检查并删除重复项，以免答案最终对我们的结果产生任何问题影响。如果你在数据集中有十个相同的人，且所有信息都相同，这将偏曲你的结果。\n\
  \n如果这种情况发生几次，整体问题会变得更糟糕。大多数情况下，我们希望删除足够的重复项，直到最后没有重复项，或者只剩下极少量的。\n\n## 分割你的数据\n\n\
  处理数据时，我们需要工作的一之一是确定如何将其拆分。在将需要的数据添加到想要使用的算法之前，我们必须对某些部分数据进行一些处理。例如，我们需要通过训练和测试算法的过程，来确保它们按照我们想要的方式运行。这意味着我们需要将现有数据拆分为训练数据和测试数据。\n\
  \n这两组数据对于确保我们的算法正常工作至关重要。正确设置并以适当的方式使用这些集合，将帮助我们在处理机器学习时获得最佳结果。不过，这方面的规则非常简单，因此你将能够在过程中毫无问题地开始。\n\
  \n例如，我们需要确保正在使用的数据从开始就是高质量的。如果你没有足够的数据，或者数据质量不高，那么你的算法将得到不当训练，不会按照你想要的方式运行。在这个过程中，请务必注意你正在使用的数据类型。\n\
  \n接下来，我们需要确保正确地分割数据。我们应该有一个测试组和一个训练组。你的训练集应该大得多，以确保你正在正确地训练已有的数据，并让算法能够充分接触到你所提供的示例以及你希望它执行的任务。\n\
  \n## 训练和测试你的数据\n\n在我们处理数据和这些算法的过程中，我们必须确保先训练并测试所有的算法。你不能只写几行代码然后输入数据，寄希望弹出一个良好的预测。你需要花时间通过该算法对数据进行训练和测试，以确保准确性，并确保算法已准备好供你使用。\n\
  \n第一步是对你的数据进行训练。你必须确保花费大量时间训练数据，以便它知道正确的行为方式。在我们之前进行的数据拆分中，你希望大约 75% 到 85% 的数据位于训练集中。这确保了你有足够的数据来帮助你真正训练算法，并让它在此过程中有充足的时间学习。\n\
  \n然后你可以将所有这些训练数据输入算法，让它有一段时间时间形成那些连接并学习它应该做什么。从那里开始，你还需要测试你正在处理的数据。这将是你处理的剩余数据。你可以将它们输入算法，并观察返回多少准确率。\n\
  \n请记住，大多数时候，这些算法能够通过经验进行学习。这意味着虽然它们最初的准确率可能没有你希望的高，但它们会变得更好。事实上，你可能需要进行几次训练和测试阶段，以提高准确率直到可以使用该算法进行预测的程度。\n\
  \n你想让准确率尽可能高。然而，如果你发现准确率往往较低，并且低于 50%，或者在进行训练和测试阶段的迭代时没有提高，那么这是一个坏信号。它向我们表明，要么是你训练中使用的数据不足以让算法正确学习，要么是你使用了让算法产生困惑的坏数据。\n\
  \n这就是我们进行训练和测试阶段的原因。它帮助我们捕获数据中可能发生的一些问题，并允许我们在公司未来依赖训练不当的算法之前，对数据和算法进行必要的更改。我们可以进行调整并重新运行这些阶段，直到准确率上升，我们知道可以再次依靠这些数据。\n\
  \n处理数据将成为我们想要处理的机器学习项目中非常重要的一部分，我们需要学会如何区分不同类型的数据、如何处理缺失数据和离群值，以及如何分割数据，以便我们能够正确地训练和测试我们想要的算法。当我们能够处理好这些时，我们将通过机器学习获得一些极佳的结果，然后就可以利用这些预测和见解来帮助改进我们的业务。\n\
  \n![00006.jpeg](img/image0280.jpeg)\n\n## 第 5 章：机器学习与人工智能对比\n\n在继续下去之前，我们需要花一些时间研究并理解人工智能与机器学习之间的区别。当我们观察数据科学领域时，机器学习将执行许多不同的任务，它同时也属于人工智能的范畴。但我们必须理解，数据科学是一个非常广泛的术语，有很多概念符合它。数据科学大伞下的概念之一是机器学习，但我们还会看到其他术语，包括大数据、数据挖掘和人工智能。数据科学是一个较新的领域，随着人们发现更多计算机的用途并更频繁地使用，它正在不断增长。\n\
  \n当你引入数据科学时，你可以关注的另一个领域是统计学，它在机器学习中经常结合在一起。即使你在高水平上，也可以专注于经典统计学，这样数据集在整个过程中始终保持一致。当然，你用于实现这一点的不同方法将取决于输入的数据类型，以及你所使用的信息的复杂程度。\n\
  \n这引出了关于机器学习和人工智能之间所出现的差异以及为什么它们不是同一事物的问题。这两个选项之间有很多相似之处，但主要区别是区分它们的关键，任何想从事机器学习的程序员都必须理解出现的一些差异。让我们花点时间探索人工智能和机器学习的不同部分，以便我们看到它们的相同和不同之处。\n\
  \n### 什么是人工智能？\n\n\n\n\n\n## 人工智能\n\n我们首先要来看的是人工智能，简称 `AI`。这个术语是由计算机科学家约翰·麦卡锡（John\
  \ McCarthy）在 20 世纪 50 年代首次提出的。`AI` 最初被描述为一种用于制造设备的方法，使其学习在心理任务上模仿人类的能力。\n\n然而，这个术语在现代发生了一些变化，但你会发现其基本理念是相同的。当你实现\
  \ `AI` 时，你是在让机器（如计算机）像人类大脑一样运行和思考。这种优势意味着这些 AI 设备在完成某些任务时比人类大脑更高效。\n\n初看之下，这可能看起来\
  \ `AI` 与机器学习相同，但它们并不完全一样。一些不理解这两个术语如何运作的人可能会认为它们是同一个，但你在编程中使用它们的方式会有很大区别。\n\n##\
  \ 机器学习有何不同？\n\n现在我们已经对人工智能有了有了概念，是时候了解一下机器学习，以及它与人工智能的相似之处和不同之处了。当我们观察机器学习时，会发现它实际上比数据科学中的其他一些选项要新，因为它只有大约\
  \ 20 年的历史了。尽管到目前为止已经存在了几十年，但直到过去几年，我们的技术和拥有的机器才终于能够跟上，机器学习也因此得到了更广泛的使用。\n\n机器学习之所以独特，是因为它是数据科学的一部分，能够专注于让程序从输入以及用户提供的数据中进行学习。这是非常有用的，因为算法能够获取这些信息并对未来做出良好的预测。让我们来看一个使用搜索引擎的例子。为了使其工作，你只需要在搜索查询中输入一个词，然后搜索引擎就能查找现有信息，查看哪些与之匹配，并返回一些结果。\n\
  \n当你第一次执行这些搜索查询时，结果可能会包含你感兴趣的内容，但你可能需要向下滚动页面才能找到你想要的信息。但当你继续这样做时，计算机会获取这些信息并从中学习，以便在未来为你提供更好的选择。起初，你可能会点击第六个结果，但随着时间的推移，你可能会点击第一个或第二个结果，因为计算机已经学会了你认为有价值的内容。\n\
  \n在传统编程中，这不是计算机可以独立完成的任务。每个人的搜索方式都不同，而且有数百万个页面需要筛选。此外，每个在线进行搜索的人对他们想要显示的内容都有自己的偏好。当你尝试执行这类任务时，传统编程会遇到问题，因为变量太多了。然而，机器学习具备实现这一点的能力。\n\
  \n当然，这只是你使用机器学习的一个例子。事实上，机器学习可以帮助你解决一些你想让计算机处理的复杂问题。有时你可以用人类大脑解决这些问题，但你通常会发现机器学习比人类大脑能做的更高效、更快速。\n\
  \n当然，也可以让人手动为你筛选并完成这些工作，但你可以想象这将花费太多时间，并且是一项巨大的工程。信息量太大了，在筛选这些信息时，他们可能不知道从何处开始，信息可能会困扰他们，等他们处理完所有内容，时间已经过去了太久，这些信息以及由此产生的预测对公司来说已经完全不再相关了。\n\
  \n机器学习改变了游戏，因为它可以跟上节奏。你通过它使用的算法能够处理所有工作，同时几乎实时地获取你所需的结果。这是企业发现它是帮助他们做出明智、可靠决策，帮助他们预测未来的最佳选择大原因之一，也是他们业务模式中非常欢迎的补充。\n\
  \n## 第 6 章 Python 实战\n\n### 安装 Python (Windows)\n\n学习 Python 的一部分工作是在你的 Windows\
  \ 上安装 Python。在安装的第一步中，你需要从下面的链接下载你偏好版本的安装包：`https://www.python.org/downloads/`\n\
  \n访问该链接，你将被引导到一个页面。在该页面上，你需要在 Python 2 和 3 的两个最新版本之间选择：`Python 3.8.1` 和 `Python\
  \ 2.7.17`。\n\n相反，如果你在寻找特定的版本，可以浏览该页面寻找早期版本的下载链接。通常情况下，你会选择下载最新版本 `Python 3.8.1`（它于\
  \ 2019 年 10 月 14 日发布），或者下载 Python 2 的最新版本 `2.7.17`。然而，你下载哪个版本取决于你想做的项目类型、兼容性以及对更新的支持。\n\
  \n下载完成后，你可以点击下载的 `.exe` 文件继续安装。标准安装必须包含 `pip`、`IDLE` 和核心文档。\n\n### 安装 Python (Mac)\n\
  \n如果你使用的是 Mac，可以从此链接下载安装包：\n`https://www.python.org/downloads/mac-osx/`\n\n学习的进阶正在深入到\
  \ Python 编程语言。实际上，Python 是一种灵活而强大的语言，可以从多个视角进行使用。这意味着当需要在逐行测试代码或声明，或者当在研究它的特性时，可以智能地使用\
  \ Python。令人惊叹的是，Python 可以在内容模式下使用，特别是当你想解析整个声明文档或应用程序时。\n\n尽管如此，与 Python 一起工作需要极其谨慎——尤其是当你汇入或与之连接时。为了智能地汇入\
  \ Python，可以使用命令行（Command Line）或 `IDLE` 开发环境。\n\n无论你是在学习大规模编程还是使用 Python，都会会有一些关于你如何连接并与\
  \ Python 编程语言协作的介绍。以下是快速与 Python 协作的一些活动要点：\n\n### 命令行交互\n\n对于初学者来说，与命令行关联是操作 Python\
  \ 最简单的方法。可以将 Python 简单理解为通过对 `>>>` 提示符后输入的每个完成的指令做出反应来工作的。命令行可能不是 Python 最喜爱的交互方式，但多年来，它证明是研究\
  \ Python 如何运行的最简单方法。\n\n### 使用命令行启动 Python\n\n如果你使用 macOS、GNU/Linux 和 UNIX 框架，你应该运行终端（Terminal）工具来进入命令行。同样，如果你使用的是\
  \ Windows，可以通过右键点击开始菜单并启动 `Windows PowerShell` 来进入 Python 命令行。\n\n由于编程需要指令的贡献，当你需要\
  \ Python 为你做某些事情时，你将通过输入它了解的类似指令来训练它。指令的微调可能会产生理想的结果；请谨慎。\n\n\n\n\n\n通过此，Python\
  \ 将把这些指令解释为你的电脑或设备可以理解并执行的指南。\n\n让我们来看某些指令，以感知 Python 是如何运行的。注意，你可以使用 `print` 命令来打印整个程序。\
  \ \n\n\"Heydays, Savants!\" \n\n1. 首先，打开 Python 的命令行。 \n\n2. 此时，在 `>>>` 提示符处，输入随后的内容（在\
  \ `print` 和括号部分之间不要留空格）：`print (\"Heydays, Savants!\")` \n\n3. 现在，你应该按下回车键，以告知 Python\
  \ 你已完成指令。命令行窗口会迅速显示出 `Heydays, Savants!`。在此期间，Python 已经根据在编写的安排中所被告知的内容做出了类似的反应。同样，为了观察当你使用错误的语言结构请求\
  \ print 指令打印类似的字符串时它将如何做出错误反应，请在 Python 命令行提示符上输入并回车相应的指令：`Print(\"Heydays, Savants!\"\
  )` \n\n结果将是：`Syntax error: invalid language structure` \n\n这就是当你使用无效或破碎的解释时得到的情况。注意\
  \ Python 是一种对大小写敏感的编程语言，所以无论在何时误解了信息，都可能是你将 `print` 写成了大写字母。显然，`print` 指令是有选择的，你可以简单地在如下语句中输入你的公告：`\"\
  Primes, Savants!\"`。注意，公告是你在给出指令后希望显示的单词；然而，可以放入其中的单词并不限于此处给出的模型。 \n\n### 退出 Python\
  \ 命令行的最有效方法\n\n要退出 Python，你可以输入以下任何命令：`quit()` 或 `exit()`。随后，按住 `Control-Z` 然后按\
  \ `Enter`；Python 应该退出。\n\n你与 Python 编程的接触应该变得有趣了；仍然还有部分需要学习，耐心将会回报。\n\n### IDLE\
  \ 区域：Python 的集成开发环境 (IDE)\n\nPython 优秀部分之一是 `IDLE`（集成开发与学习环境）工具。尽管这个特定设备集成在 Python\
  \ 的安装包中，你也可以下载日益先进的外部 IDE。`IDLE` 工具为你提供了一个日益强大的平台来编写代码并与 Python 进行交互式工作。要进入 `IDLE`，你可以在找到命令行符号的地方或在开始菜单中（正如你通过命令行协作获得的那样）体验类似的组织。当你点击\
  \ `IDLE` 图标时，你将被引导到 `Python Shell` 窗口。这将我们进入与 `Python Shell Window` 协作的部分。\n\n####\
  \ 连接 Python Shell 窗口\n\n当你处于 `Python Shell Window` 时，你会看到一个下拉菜单和一个类似于你在命令行窗口（上提到的主要连接）中看到的\
  \ `>>>` 提示符。有一个特定的 `IDLE` 功能可以更改绘图内容。现在，你将使用类似的 `IDLE` 更改菜单来查看过去的指令、剪切、复制和粘贴过去的语句，并一起进行任何类型的编辑。显然，`IDLE`\
  \ 越来越类似于命令行关联的跳转。令人惊讶的是，在 `Python Shell window` 的下拉菜单中有以下菜单项：`File`、`Windows`、`Help`、`Shell`、`Options`、`Edit`\
  \ 和 `Debug`。每一个菜单都有各种功能。`Shell` 和 `Debug` 菜单在创建较大的项目时使用，因为它们为过程提供了突出显示。无论如何，虽然 `Shell`\
  \ 菜单为你提供了重启 shell 或查看 shell 日志以最新重置的机会，但 `Debug` 菜单对于跟踪异常源文件和显示自己的行有许多有用的东西。通过 `Debugger`\
  \ 选项，你最可能会引入一个智能调试器窗口，它允许你单步并查看 Python 上运行的项目。窗口的 `Options` 菜单允许你编辑并设置 `IDLE` 以适应自己的\
  \ Python 工作喜好。\n\n此外，在 `Help` 菜单处，你可以打开 `Python Help` 和文档的选项。\n\n使用 `File Window`\
  \ 菜单，你可能会创建另一个文档、打开一个模块、打开一个旧记录，并通过进入此菜单时自然创建的基本要素来保存你的会话。通过 `'New File'` 选项，你几乎会创建一个你只需点击即可编写的代码。当你完成后，你将被带到另一个窗口，那里有一个简单且标准的文本处理器，你可以在其中输入或更改你的代码。你会看到记录是\
  \ `'untitled'`，不要担心，这是文档的底层名称，当你保存代码时它会更改。`File window menu` 的一个棒点是它不会同时包含 `'Shell'`\
  \ 和 `Menu choices`，所以工具栏随 `Shell Window` 发生细微变化。发生的情况是在 `Shell Window` 中出现了两个新菜单，具体来说是\
  \ `Run` 和 `Format` 菜单。当你需要运行在记录窗口上编写的代码时，输出将单独在 `Shell Window` 中给出。\n\n在该区域的开始，你被告知\
  \ Python 可以在脚本模式（Script Mode）下使用。你如何做到这一点？获取结果的方法目前非常独特。在内容模式下工作时，你得到的输出不会像你在连接或关联模式下工作那样被编程。你应该从你的代码中调用它们。为了在这种模式下获得你的输出，请运行内容或通过代码中的\
  \ `print()` 函数调用它。\n\n\n\n\n我们需要探索的 Python 编程语言第一个方面是注释。在编写代码的过程中，总会有某些时刻，你想停下来，并向他人以及你自己解释代码中发生了什么。这可以确保任何看到代码的人都知道从某一个点到另一个点在发生什么。在项目中使用注释是你在项目中展示这些内容的方式，并可以让其他人更容易知道该部分的名称，或者理解你之所以选择做某件事而不是另一件事的原因。\n\
  \n当你想要在代码中添加一些注释时，你需要在所选单词前面加上一个特殊的字符。这个特殊字符将帮助你告诉程序，它应该跳过这些单词的读取，转而处理代码的下一个部分。为此使用的特殊字符就是你所写注释开前的\
  \ `#` 号。当编译器看到它时，它就知道你完全不想执行那部分代码。它将等待到下一行再开始重新读取代码。你可能会在代码看到的注释示例包括：\n\n```\n#this\
  \ is a new comment. Please do not execute in the code.\n```\n\n当你写完这里需要的注释并完成后，你就可以按回车键或回车键，以便编写更多编译器可以执行的代码。你可以根据代码的需要，自由地编写任何长度的注释。你也可以编写任意数量的此类注释。通常情况下，将注释保持在需要的范围内被认为是一个更好的选择。否则，这会让代码整体看起来有点杂乱。从技术上讲，你可以在代码中添加任何数量数量的此类注释。\n\
  \n## 语句 (The Statements)\n\n我们需要关注的代码下一个部分是语句。每当你开始编写新代码时，无论你使用的是 Python 还是过程中的其他编程语言，都必须在代码中添加这些语句。这允许编译器知道你想让内部发生什么。语句是你想要发送给解释器的一个代码单元。从那里开始，解释器将查看该语句并根据你添加的命令来执行它。\n\
  \n每当你决定编写代码时，你都可以选择需要多少语句来让代码为你运行。有时，你需要在一个代码块中使用一条语句，而在其他时候，你可能想要有多个。只要你记住语句应该保持在代码的括号内，你可以随意将语句写得多长，并包含你想要的任何数量的语句。\n\
  \n当你准备好编写代码并在代码中添加至少一条语句时，你就需要将其发送出去，以便解释器处理所有内容。只要解释器能够理解你尝试编写的语句，它就会执行你的命令。该语句的结果将显示在屏幕上。如果你发现编写代码后某些内容没有以正确的方式显示，那么你需要回过头检查它们是否写得正确。\n\
  \n现在，这些听起来可能有很多信息，但有一种方法可以减少困惑并确保它们对你更有意义。让我们来看看这些内容是如何运行的示例。\n\n```\nx = 56\nName\
  \ = John Doe\nz = 10\nprint(x)\nprint(Name)\nprint(z)\n```\n\n当你将其发送给解释器时，屏幕上应该显示的结果是：\n\
  \n```\n56\nJohn Doe\n10\n```\n\n就是这么。打开 Python，尝试一下看看让几个结果显示在你的解释器中有多简单。\n\n## 变量\
  \ (The Variables)\n\n我们在 Python 代码中考虑的下一个内容是变量。学习这些变量很重要，因为它们是将你的代码存储在正确的位置，以便你以后可以调用它们。这意味着如果你以正确的方式执行这个过程，变量位于计算机内存的正确位置。代码中的数据将帮助确定这些点存储在内存的哪些位置，这让你在需要运行代码时更容易找到信息。\n\
  \n我们在这里需要关注的第一点是确保变量被分配了一个值。如果变量没有值，那么变量就没有任何东西可以保存和存储。如果变量从开始被赋予一个良好的值，那么当你执行程序时，它将以你预期的方式运行。\n\
  \n对于你的 Python 代码，有三种变量供你选择。它们都很重要，并有它们的工作位置。但你必须根据想要附加到该变量上的值来选择正确的一个。Python 中提供的主要变量包括：\n\
  \n1. **浮点数 (Float)**：这是一个包含如 `3.14` 等数字的整数变量。\n2. **字符串 (String)**：这是你编写的语句之一。你可以在其中添加任何你喜欢的短语。\n\
  3. **整数 (Whole number)**：这是你想要使用的任何其他数字，即不包含小数的数字。\n\n当你尝试在程序中使用变量时，你不需要通过声明来确保内存空间可用。这是\
  \ Python 在为变量分配值时可以自动为你完成的事情。如果你想确保这在你的代码中发生，并避免过程中的某些惊喜，你需要双检等号（赋予变量值的符号）是否在正确的位置。编写代码时这种形式的绝佳示例如下：\n\
  \n```\nx = 12#this is an example of an integer assignment\npi = 3.14#this is an\
  \ example of a floating point assignment\ncustomer name = John Doe #this is an example\
  \ of a string assignment\n```\n\n在某些情况下，你可能需要一个变量附加两个或更多值。在某些时刻，你无法避免这种情况并需要它发生。好消息是，你可以按照上述的相同程序来实现，你只需要确保每个部分都有等号，以便编译器知道如何分配一切。所以，当你想要这样做时，你会编写类似\
  \ `a = b = c = 1` 的内容。\n\n## 关键字 (The Keywords)\n\n当你使用 Python 语言时（就像在其他编程语言中一样），你会遇到在代码中被保留为命令的单词，这些被称为关键字。你需要小心使用这些词，因为它们是为了告诉程序某些命令，以及你希望它如何运行。你不想在特定命令之外的任何地方引入并使用它们。\n\
  \n如果你误用了这些关键字，将导致代码内部产生一些困惑。解释器将不知道做什么，计算机可能会在它需要执行的任务上停止。随着我们继续阅读本指南并开发一些机器学习的\
  \ Python 代码，我们将开始识别一些需要注意的常见关键字。\n\n## 命名你的标识符 (Naming Your Identifiers)\n\n\n\n\
  \n\n# 我们接下来需要关注的重点是如何命名所有的标识符。你需要以一种合理的方式进行命名，并且不会在此过程中困扰计算机。每当你在 `Python` 中编写特定的代码时，至少会有几个标识符出现。这些标识符中最常见的包括类（classes）、实体（entities）、变量和函数。\n\
  \n在某个时刻，你将需要命名标识符，以便它们更有可能按照预期方式工作，并在执行代码时让编译器更容易提取出它们。无论你使用这四种标识符中的哪一种，命名规则都是相同的，这可以让你在开始时更加容易。在命名标识符时你应该记住的一些规则包括：\n\
  \n- 任何时候你使用字母，可以使用大写或小写，两者组合也可以。你还可以在名称中添加数字、符号和下划线。这些元素的任何组合都是接受的，但请确保名称字符之间没有空格。\n\
  - 永远不要用数字开头标识符。这意味着编写 `4babies` 这个名称将导致你的计算机报错。然而，如果你愿意，将标识符命名为 `fourbabies` 是可以的。\n\
  - 标识符绝不应该是 `Python` 的关键字之一，且名称中不应出现该关键字。\n\n现在，如果你在在此过程中尝试编写一些代码，但没有遵循上述所有规则，你就会困扰编译器，它会向你发送错误消息让你知道出了问题。随后错误将出现在你的计算机上，程序将关闭，因为并不知道如何继续操作。这是你不希望发生的事情，所以在在命名这些标识符时要小心。\n\
  \n关于这些标识符及其命名的另一点需要记住的是，你要确保选择的名称是你容易记忆的。选择易于理解和阅读的名称，如果另一个程序员进来尝试查看代码，将会让事情变得更容易。\n\
  \n## 关于 Python 编程语言我还需要了解什么？\n\n`Python` 编程语言通常被专家们认为是最好的编程语言之一，如果你是一个从未接触过编程的人，事实更是如此。这种语言非常简单，功能强大，并且有许多工具和资源来帮助你完成项目，即使该项目涉及机器学习。虽然在机器学习中可以使用其他选项，但那些选项通常处理起来更困难一些，而\
  \ `Python` 通常是更好的选择。\n\n当你刚开始学习 `Python` 语言时，你会喜欢的一点是，它是基于英语的。这意味着你能够识别这些单词及其含义，而不是尝试去猜。尽管它对于从未工作过编程的初学者来说是一种非常棒的语言，但它足以足够处理机器学习以及你喜欢的任何主题。\n\
  \n作为一个准备好学习并开始使用 `Python` 语言的人，你会发现它有一个非常棒大的库可以在你编写代码时利用。这个库将包含你所需的工具和资源，让初学者和专家都能更容易写出他们需要的任何代码。\n\
  \n## 第 8 章：机器学习算法\n\n现在你已经理解了机器学习的概念并集齐了所有的工具，是时候开始探索强大的算法了。请记住，虽然你会单独学习每种算法和技术，但在现实场景中，它们很少以这种方式使用。在处理复杂数据集时，你通常会将监督机器学习技术与无监督机器学习技术以及许多其他过程结合起来使用。\n\
  \n在本章中，我们将关注一些在处理理想数据集时单独运行良好，并且在结合使用时能够获得更高准确性和效率的算法。我们将包含的一些算法有线性回归、决策树和支持向量机。\n\
  \n### 线性回归\n\n许多机器学习问题（如预测分析）都是使用线性回归处理的。只要训练数据有价值且不包含太多噪声，这种技术在以高准确度预测结果方面非常强大。请记住，这就是为什么你需要进行数据预处理，以清除一些可能影响结果的噪声和离群值。\n\
  \n线性回归的一个特征是基于独立变量计算预测值。换句话说，当你需要计算多个变量之间的联系时，你就应该选择这种算法。然而请注意，线性回归只能处理回归问题，而不能处理分类问题。有其他算法专门用于此类。\n\
  \n现在让我们来看如何使用 `Scikit-learn` 和开源数据集应用线性回归的示例。我们将使用 `Scikit` 库，因为它包含了许多针对机器学习的算法以及某些公共数据集。其中一个数据集是波士顿房价市场数据集，它的文档完备且数据干净。为了高效地使用线性回归，我们将整个集合划分为训练集（80%）和测试集（20%）。让我们开始工作吧：\n\
  \n```python\nfrom sklearn.datasets import load_boston\n\nboston = load_boston()\n\
  \nfrom sklearn.cross_validation import train_test_split\n\nX_train, X_test, Y_train,\
  \ Y_test = train_test_split(boston.data, boston.target, test_size=0.2, random_state=0)\n\
  ```\n\n正如你看到的，`Python` 代码非常易读，不需要太多解释就能理解。我们导入了数据集并进行了划分以获取训练集和测试集。`train_test_split`\
  \ 函数是 `Scikit-learn` 库包含工具的完美示例。你会注意到我们通过指定目标测试数据集值为 `0.2` 来声明百分比。这意味着它包含数据的 20%。还有一个\
  \ `random_state` 参数，用于定义在划分过程中生成随机数的值。基本上，它随机选择被分类为训练数据或测试的数据。\n\n在下一阶段，我们需要应用回归器以便我们的线性回归算法做出准确预测。一旦实现，我们需要做的就是衡量结果以查看它的表现。请记住，有很多因素会影响准确性，例如随机误差、标记错误、离群值、噪声等。这就是为什么你进行的预处理通常是不够的，你必须应用其他算法来改进结果。这是你以后自己练习时需要记住的。现在让我们看看我们的回归器以及获得的结果：\n\
  \n```python\nfrom sklearn.linear_model import LinearRegression\n\nregression = LinearRegression()\n\
  \nregression.fit(X_train, Y_train)\n\nY_pred = regression.predict(X_test)\n\nfrom\
  \ sklearn.metrics import mean_absolute_error\n\nprint (\"MAE\", mean_absolute_error(Y_test,\
  \ Y_pred))\n```\n\n输出: `MAE 3.9318708224346`\n\n\n\n\n就是这样！如你所见，只要你使用 `Scikit-learn`\
  \ 来减轻负担，线性回归很容易实现。然而，我们获得的结果并不完美，但也算不上糟糕。它表明，即使当我们拥有相当整洁的数据时，其他算法和技术仍然有改进空间。此外，每当你必须在机器学习算法之间做出选择时，你实际上是在预测准确率和速度之间进行平衡。本质上说，这归结为这两个因素。每当你选择其中一个，另一个就会被牺牲。随着时间的推移和经验，你将学会如何根据你处理的数据类型以及你需要获得的结果来平衡它们。\n\
  \n现在，让我们来看看另一种算法，即支持向量机。\n\n## 支持向量机\n\n如果你需要一个可以为你处理几乎所有事务的通用算法，那么支持向量机正是你寻找的。线性回归算法只用于回归问题，而支持向量机可以同时处理回归、分类，甚至是离群值检测。这项技术是每位机器学习学习者都需要研究并学习如何实现的基础算法之一。\n\
  \n支持向量机之所以流行，是因为它们强大且不会消耗大量资源。通常，你对准确性的追求越高，数据处理速度就越慢，因为这对你的计算机系统要求越高。然而，支持向量机在不影响预测准确率的情况下，所需的功率要少得多。此外，你还可以使用该算法清理数据集中的大部分噪声，从而减少你在预处理阶段需要执行的步骤（尽管仍然建议执行所有步骤）。\n\
  \n那么，为什么支持向量机如此重要？它们被用在哪里？因为它们的强大和多功能性，它们被应用于多个领域。例如，它们被用于人脸识别软件、文本分类、手写识别，以及医疗行业中的基因分类。该算法还有许多用途，因为它能够以极高的效率分离数据集中的数据点，这使得结果足够准确，以至于可以在复杂的应用程序中使用。\n\
  \n我们将通过一个示例来查看支持向量机是如何实现的，以及它是如何工作的。请记住，你仍然需要利用 `Scikit-learn` 库来缩短实现算法的时间。如你所见，无论你对机器学习、数据科学还是甚至是数据挖掘感兴趣，这个工具都是不可替代的。尽管如此，我们将使用支持向量机来预测钞票的有效性。这意味着涉及到图像分类，而该算法非常适合这个过程。算法的实现将非常简单，因为分类是二元的。我们只需要确定钞票是真是假，即真或假。\n\
  \n注意，我们将有一若干描述钞票的属性。此外，我们需要建立两个维度之间的分离线，以避免任何分类错误。虽然其他分类算法也可以执行相同的过程，但支持向量机有一种独特的方法。这项技术通过计算某些与每个类别都接近的数据点之间的最大距离来确定决策边界。决策边界必须是最优的，因此我们不能随机选择。这些最优数据点被称为\
  \ `support vectors`（支持向量），这也是我们算法命名的由来。请记住，它们是一个数学概念，我们不会深入探讨它们是如何计算的等。在这个阶段，你不需要了解位于相当复杂代数中的核心细节。\n\
  \n现在，让我们来看一个实际示例，展示如何应用我们讨论的所有支持向量机。为了这次演示，你需要使用几个库和包。以下是代码：\n\n```python\nimport\
