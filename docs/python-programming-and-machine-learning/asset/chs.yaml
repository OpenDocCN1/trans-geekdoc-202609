  \       0.00      0.99      0.99      161\n       1.00      0.99      0.99     \
  \ 114\n\n    avg       0.99      0.99      0.99      275\n```\n\n\n\n\n决策树和支持向量机一样，功能极其强大，因为它们既可以执行回归也可以执行分类操作。这意味着在处理大型数据集时非常有用，你应该熟悉一下它们。此外，决策树是另一类机器学习算法——集成方法（ensemble\
  \ method）的基础，特别是被称为随机森林的算法。这都非常符合逻辑。如果你有很多棵决策树，它们就形成了一片森林，对吧？\n\n顾其名，决策树被用于对决策进行建模，包括确定任何类型的后果以及整个过程所需的系统资源。此外，所有内容都以图表的形式可视化。换句话说，你将得到一个包含你执行的每一个测试的流程图。例如，假设你投掷了若干次硬币。每次的结果都会被记录，你将拥有代表这些结果的树分支，以及代表类别标签的叶节点。\n\
  \n这种监督学习算法被认为是最强大的算法之一，因为它在不牺牲过多效率或不消耗系统过量资源的情况下，能够提供准确的结果。此外，图表系统允许你轻松地解释数据，并根据需要进行调整，而无需经历另一个能够实现相同效果但工作量得多的繁琐过程。如此，让我们讨论一下决策树提供的其他优点：\n\
  \n1. **用户友好**：与许多其他算法或技术不同，决策树对于那些没有大量机器学习或数学知识经验的人来说也是逻辑严谨的。你不需要成为数据科学家就可以开始使用它们。它们遵循简单的、类编程的结构，类似于\
  \ Python 的条件操作。决策树遵循“如果……，那么执行……，否则执行……””的逻辑。此外，结果非常清晰，即使没有基础统计学知识也能解释。这就是内置图表能够清晰解释你正在分析的数据的好处。\n\
  \n2. **数据清洁**：干净的数据产生准确的结果。因此，无论你使用哪种算法，都必须通过某些方法和技术尽可能消除噪声和离群值。然而，使用决策树的优势在于它们几乎不受因素的影响。离群值和噪声只会造成轻微的不便，你通常可以完全忽略它们并获得准确的结果。\n\
  \n3. **多功能**：如你所知，某些机器学习算法设计为仅适用于特定的数据类型。某些只能应用于分类数据，而另一些则专门用于数值数据。通常由于这个原因，在处理包含两种类型信息的复杂数据集时，需要将它们结合。然而，决策树可以处理这两种数据类型的训练过程，从而显著减少了你的工作量。\n\
  \n4. **探索数据**：数据探索是一个非常有价值的步骤，因为它可能耗时，因为你需要识别最有价值的数据点并在它们之间建立联系。然而，决策树在探索性分析方面表现出色，你会花费更少的时间执行这一步骤。此外，你能够更高效地创建新特征，以进一步提高预测准确性。探索数据可能会精疲力竭，因为在现实世界中你通常要处理成千上万个变量，如果没有合适的工具，找到最重要的变量是非常困难的。\n\
  \n现在你已经了解决策树以及为什么它们是机器学习学习者的首选算法，你还应该学习它们带来的缺点。请记住，没有完美的算法，让我们看看在处理决策树时将面临什么种困难：\n\
  \n1. **过拟合**：这可能是你面临的最大问题。决策树倾向于放大并构建过度复杂的决策树，这些树在通用数据上无法准确运行。然而，过拟合问题不仅出现在这种情况下，许多算法都必须处理它。限制过拟合风险的最简单方法是应用参数限制。\n\
  \n2. **分类**：当你的数据集包含大量连续数值变量时，决策树在对其进行分类时会遇到困难。信息在此过程中往往会丢失。请注意，连续变量被认为是在特定最小值和最大值之间有定义的数值。例如，假设我们有一些数据规定只有\
  \ 21 到 45 岁之间的人可以参军。`age` 被认为是连续的，因为我们设置了限制。\n\n3. **挑剔算法**：算法并不总是从你得出结论的决策树中选择最准确、高效的一个。这只是该技术的本质。但解决方案很简单。你只需要训练多棵树，以随机采样较多的特征并找到最准确的解决方案。\n\
  \n你在本节的之前了解到，决策树用于执行回归任务和分类任务。然而，这并不意味着你对这两个任务使用相同的方法。你需要将决策树分为两个不同的类别，即回归树和分类树。这两类算法的基础仍然相同，但有许多你应该注意的区别：\n\
  \n1. **回归树**专门应用于涉及连续因变量的任务。同时，在处理分类因变量时，需要分类树。\n\n2. 我们从训练数据中提取的结果值对于每类决策树的确定方式不同。在分类树的情况下，该值计算为总观测值的众数（mode\
  \ value）。这意味着如果我们有一个未知的数据观测，我们可以通过众数的帮助进行预测。请记住，众数是在给定值集中出现频率最高的值。另一方面，回归树以总观测值平均值的形式从训练数据中提取值。这个平均值随后被用于计算任何缺失的数据观测值。\n\
  \n3. 回归树和分类树依赖于二分法（binary splitting）。这一概念涉及从树的顶部到底。这意味着当我们在树的一个区域有观测值时，下方会有若干个被划分的分支。划分发生在预测空间内。这个概念通常也被称为贪婪的”（greedy），因为算法寻找的是当前分析的拆分所需的变量。该操作没有考虑任何未来的拆分，这就是为什么有时我们无法得到最准确的结果。需要考虑这个问题，以便通过各种方法抵消其影响并创建更好的决策树。\n\
  \n\n\n现在让我们进一步讨论一下“分裂”（splitting）的概念，并看看它出现在哪里。分裂直接影响决策树的准确性。这意味着，如果我们在决策树上应用许多算法，它们都将影响数据节点被划分为若干子节点的方式。此时，你应该记住两类决策树之间的区别。分裂产生的子节点将保持某种形式的均匀性。此外，节点划分是在每个变量上进行的，但只选择最均匀的子节点。这个过程涉及一些数学知识，我们我们不会深入探讨细节。为了开始构建决策树，理解该过程背后的理论就足够了。话虽如此，让我们看看如何在应用程序中使用它们。\n\
  \n## 实践中的决策树\n\n为了创建决策树，你必须从根节点开始。一旦访问了该数据，你就可以选择某个属性，然后对其进行逻辑测试。结果，你将能够根据结果分支到任何数据子集，从而从子节点中获得理想的结果。你将需要对这些子节点进行递归划分，以清理叶子节点并只保留近乎完美的节点。这些叶子将代表来自同一类的数据样本。此外，你可能考虑对树进行剪枝，以消除那些对提高准确性没有帮助的冗余子部分。这就是分裂过程的目的之一。一旦完成，你就可以选择最优的划分和最有用的特征。\n\
  \n现在让我们最后结束理论阶段，开始观察实际应用。我们将创建一个决策树。为了演示，我们需要再次使用 Scikit-learn，因为我们将使用另一个名为 `Iris`（鸢）的公共数据集。让我们从导入所需的内容开始。\n\
  \n```python\n%matplotlib inline\n\nimport pandas as pd\nimport numpy as np\nimport\
  \ seaborn as sns\nimport matplotlib.pyplot as plt\n\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.tree import DecisionTreeClassifier\n\ndf\
  \ = pd.read_csv('Iris.csv')\n\ndf.isnull().any()\n```\n\n导入所有内容后，我们还通过最后一行进行了空值检查。一旦我们确定没有缺失值，就可以开始检查信息。一如既常，第一步是通过阅读数据集的摘要分析来了解变量和值。一旦你知道你面对的是什么，就可以开始查看列之间的连接。为了进行这项检查，我们导入了\
  \ `seaborn` 模块，因为它为我们提供了一个名为 `pairplot` 的工具。这个工具实际上是一个绘制连接图的函数，它让我们更容易进行可视化。\n\n\
  此时，你可以为每列使用特定的颜色。例如，你可以操作物种部分的 `hue`（颜色），以寻找该类别中的任何离群值。以下是如何使用 Python 代码实现：\n\n\
  ```python\nsns.pairplot(df, hue = ‘Species’)\n```\n\n如果你决定使用这个特定的数据集，你会发现我们确实有很多离群值，但它们并不占主导。它们可能是未知异常或某些混入错误数据的结果。请注意，与真实世界的数据相比，你处理这些数据集非常干净。大多数数据包含大量的噪声和离群值，你必须彻底清理它们。目前，我们可以忽略这些离群值，因为它们并不常见到会显著干扰我们的结果。\n\
  \n下一步是使用之前相同的方法将数据集划分为训练集和测试集。然而，由于我们现在使用的是决策树，我们将划分比例从通常的 80/20 更改为 70/30。让我们来看代码：\n\
  \n```python\nall_inputs = df[['SepalLengthCm’, ‘SepalWidthCm’, ‘PetalLengthCm’,\
  \ ‘PetalWidthCm’]].values\nall_classes = df['Species’].values\n(train_inputs, test_inputs,\
  \ train_classes, test_classes) = train_test_split(all_inputs, all_classes, train_size\
  \ = 0.7, random_state = 1)\n```\n\n你会注意到 `random_state` 参数不再设置为 0，以保证随机分布。这次，我们希望确保无论执行多少次，划分都是完全相同的。这样，在需要时，我们始终能够重建数据集。现在，让我们应用决策树分类器：\n\
  \n```python\ndtc = DecisionTreeClassifier()\ndtc.fit(train_inputs, train_classes)\n\
  dtc.score(test_inputs, test_classes)\n```\n\n结果应该像这样：\n\n```\n0.95555555\n```\n\n\
  我们成功获得了 95% 的准确率，考虑到我们没有进行任何清理并且决定忽略了离群值，这是一个非常优秀的结果。这就是为什么决策树如此强大，因此在训练各种模型时非常受欢迎的原因。你可以在不执行过多的操作的情况下获得高准确率。\n\
  \n## 第 9 章 Python 机器学习的核心库\n\n如今许多开发者更倾向于在数据分析中使用 Python。Python 不仅应用于数据分析，还应用于统计技术。科学家，特别是处理数据的科学家，也偏于在数据集成中使用\
  \ Python。即 Web 应用程序和其他环境产的集成。\n\nPython 的特性帮助科学家们将其用于机器学习。这些特性的优点包括语法一致、灵活，甚至由于开发周期更短。它还可以开发复杂的模型，并拥有可以帮助预测的引擎。\n\
  \n结果是，Python 拥有一系列非常广泛的库。请记住，库指的是使用不同语言的一系列例程和函数。因此，健壮的库可以处理更复杂的任务。然而，这在不需要重新编写几行代码的情况下就可以实现。值得注意的是，机器学习主要依赖于数学。即数学优化、概率元素以及统计数据。因此，Python\
  \ 提供了丰富的知识，可以在不进行过多参与的情况下执行复杂任务。\n\n以下是目前使用的一些核心库的示例。\n\n### Scikit – Learn\n\n\
  Scikit-learn 是机器学习领域最好、最流行的库之一。它能够支持学习算法，特别是无监督和有监督学习。\n\nScikit-learn 的示例包括：\n\n\
  * k-均值 (k-means)\n* 决策树\n* 线性和逻辑回归\n* 聚类\n\n这种库包含了来自 `NumPy` 和 `SciPy` 的主要组件。Scikit-learn\
  \ 拥有许多适用于机器学习以及数据挖掘任务的算法集。即，它有助于分类、聚类甚至回归分析。该库还有其他可以高效交付的任务。其中一个很好的例子包括集成方法、特征选择，以及数据转换。值得注意的是，如果需要，先驱或专家可以轻松应用它来实现复杂的算法部分。\n\
  \n### TensorFlow\n\n它是一种涉及深度学习的算法形式。它们并不是总是必要的，但它们的一个优点是，只要方法得当，就能给出正确的结果。它还允许你在\
  \ `CPU` 或 `GPU` 上运行数据。即，你可以在 Python 程序中编写数据，编译然后在中央处理器上运行。因此，这让你的分析工作变得轻松。再次，不需要将这些信息使用\
  \ `C++` 或或是使用 `CUDA` 等其他级别进行编写。\n\n\n\n\n### TensorFlow\nTensorFlow 使用节点，特别是多层节点。这些节点在系统内部执行多个任务，包括使用人工神经网络、训练，甚至建立大量数据集。诸如\
  \ Google 等多个搜索引擎都依赖于这种库。它的其中一个主要应用是目标识别。同样，它也有助于处理语音识别的不同应用程序。\n\n## Theano\nTheano\
  \ 也是 Python 库的重要组成部分。它在这里的关键任务是帮助任何与数值计算相关的内容。我们也可以将其与 `NumPy` 联系起来。它扮演着其他角色，例如：\n\
  \n* 数学表达式的定义\n* 辅助优化数学计算\n* 促进与数值分析相关的表达式的评估\n\nTheano 的主要目标是提供高效的结果。它是一个更快的 Python\
  \ 库，因为它对密集数据的计算可以快 100 倍。因此，值得注意的是，与计算机的 CPU 相比，Theano 在 GPU 上运行效果最好。在大多数行业中，CEO\
  \ 和其他人员使用 Theano 进行深度学习。此外，他们还用它来计算复杂的任务。这一切都得益于它的处理速度。随着对数据计算技术需求巨大的行业不断扩张，许多人正在选择该库的最新版本。记住，最新版本在几年前进入了视野。Theano\
  \ 的新版本，即 `1.0.0` 版本，具有若干改进、接口变化并由新功能组成。\n\n### Pandas\nPandas 是一个非常流行的库，有助于提供高级且高质量的数据结构。这里提供的数据简单且易用。此外，它非常直观。它由各种复杂的内置方法组成，使其能够执行分组和时序分析等任务。另一个功能是它有助于数据合并并提供过滤选项。Pandas\
  \ 可以从 Excel、CSV 甚至 SQL 数据库等其他源收集数据。它还可以处理收集的数据，以在行业中承担其操作角色。Pandas 由两个结构组成，使其能够正确执行其功能：即单维的\
  \ `Series` 和具有二维的 `data frames`。长期以来，Pandas 被认为是最强大、最有效的 Python 库。它的主要功能是帮助进行数据操作。此外，它还有导出或导入广泛数据的能力。它适用于各个领域，例如数据科学领域。\n\
  \nPandas 在以下领域非常有效：\n\n* 数据拆分\n* 合并两种或多种类型的数据\n* 数据聚合\n* 选择或子集化数据\n* 数据重塑\n* 图表解释\n\
  \n### Series 维度\n| A | 7 |\n| --- | --- |\n| B | 8 |\n| C | 9 |\n| D | 3 |\n| E\
  \ | 6 |\n| F | 9 |\n\n### Data Frames 维度\n| | A | B | C | D |\n| --- | --- | ---\
  \ | --- | --- |\n| *0 | 0 | 0 | 0 | 0 |\n| *1 | 7 | 8 | 9 | 3 |\n| *2 | 14 | 16\
  \ | 18 | 6 |\n| *3 | 21 | 24 | 27 | 9 |\n| *4 | 28 | 32 | 36 | 12 |\n| *5 | 35 |\
  \ 40 | 45 | 15 |\n\nPandas 在现实情况中的应用将使能够执行以下操作：\n\n* 你可以快速删除某些列，甚至添加 DataFrame 中发现的文本\n\
  * 它将帮助你进行数据转换\n* Pandas 可以确保你获得错位或缺失的数据\n* 它具有强大的能力，特别是根据其功能对其他程序进行分组\n\n### Matplotlib\n\
  这是另一种复杂且实用的数据分析技术，有助于数据可视化。它的主要目标是根据各种输入为行业提供所处的位置。当你无法与不同的利益相关者分享你的生产目标时，你会发现你的生产目标是没有意义的。为了实现这一点，Matplotlib\
  \ 在所需的计算分析类型方面非常有用。因此，它是每一位科学家（特别是处理数据的科学家）都偏好的唯一 Python 库。这种库在图形和图像方面看起来很好。而且，许多人喜欢使用它来创建各种图表进行数据分析。然而，随着新的先进库涌入行业，技术世界已经完全改变。\n\
  \n它也非常灵活，由于由于，你能够创建可能需要的多个图表。这只需要几个命令即可完成。\n\n在这个 Python 库中，你可以创建各种不同的图表、各种图表、多个直方图甚至散点图。你也可以使用相同的原理制作非笛卡尔图表。\n\
