  \ 文件。见下图：\n\n![描述: 00023.jpeg](img/image00245.jpeg)\n\n此框将会出现。\n\n![描述: 0024.jpeg](img/image00246.jpeg)\n\
  \n如果你想更深入地了解程序、文件设置和类似信息，可以完整阅读内容。这是一段长数据，告知你如何导航和使用 Python。此外，Python 欢迎进一步开发的新贡献。你可以将框中的内容复制粘贴到\
  \ Windows 文档中以获得更好的展示。如果你不想了解关于 Python 的所有其他信息并准备好开始，可以遵循以下步骤。\n\n### 步骤 #2–开始使用\
