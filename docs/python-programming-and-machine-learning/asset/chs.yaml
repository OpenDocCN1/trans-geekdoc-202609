  \ `Python` 编程初学者来说，`Keras` 提供了一条条通往最终理解的可靠途径。他们将能够设计网络甚至构建它。其快速原型设计的能力使其成为学习者眼中最好的\
  \ `Python` 库。\n\n### PyTorch\n\n这是另一个易用且开源的 `Python` 库。由于其名称，它在工具方面拥有广泛的选择。它也适用于我们计算机视觉领域。计算机视觉和视觉显示在多种类型的研究中起着至关重要的作用。此外，它还有助于处理自然语言。此外，`PyTorch`\
  \ 可以承担一些针对开发者的技术任务，即使用计算进行海量计算和数据分析。它还可以帮助创建主要用于计算目的图。由于它是开源的 `Python` 库，它可以在 `Tensors`\
  \ 等库上工作或执行任务。与 `Tensors GPU` 结合，其加速将会提升。\n\n### Scrapy\n\n`Scrapy` 是另一个用于创建爬虫程序的库。例如爬虫机器人等。爬虫机器人经常有助于数据检索，并适用于网络上\
  \ URL 的形成。从从开始，它的目的是协助数据抓取。然而，这已经经历了多次演变，导致了其通用用途的扩展。因此，如今 `scrapy` 库的主要任务是作为通用的爬虫。该库促进了通用化使用、通用代码的应用等。\n\
  \n### Statsmodels\n\n`Statsmodels` 是一个旨在使用多种统计计算方法和数据验证进行数据探索的库。它具有许多功能，如结果统计甚至特征特征。在各种模型（如线性回归、多重估计和涉及时间序列的分析，甚至使用更多线性模型）的帮助下，它可以承担这一角色。此外，其他模型（如离散选择）也适用于此处。\n\
  \n## 在机器学习编程中使用 Python 的优势\n\n对于机器学习算法，我们有一种清晰且易于大部分数据研究人员和科学家理解的语言。一种拥有对不同类型工作以及特别是特定矩阵数学有用的库的语言将是更理想的。此外，使用拥有大量活跃开发者的语言具有很大的优势。这些特性使得\
  \ Python 成为最佳选择。Python 的主要优势可以总结为以下几点：\n\n1. 它的语法清晰。\n2. 易于处理文本。\n3. 它被大量的人和社区使用。\n\
  4. 可以以不同的风格进行编程：面向对象、过程化、函数式等。\n5. 是处理非数值数据的理想选择。\n6. 有从 HTML 中提取数据的能力。\n7. 在科学和金融社区中都很常见。因此，这两个领域之间存在无缝联系，特别是在机器学习领域，因为金融领域是数据集的主要来源之一。\n\
  8. 包含了有用的库，如 `SciPy` 和 `NumPy`，使我们能够对向量和矩阵进行操作。\n\n## 第 10 章 人工神经网络\n\n随着时间的推移，人类大脑作为进化过程的一部分不断适应和发展。它在修改了许多适用且实用的特征后变得更加强大。增强大脑的一些特质包括学习能力、容错性、适应性、大规模并行、低能耗、分布式表示和计算、泛化能力以及对信息的先天上下文处理。\n\
  \n开发人工神经网络的目标是希望系统能够拥有这些特征之一。人类非常擅长解决复杂的感知问题，例如仅通过一眼就能几乎瞬间地在拥挤区域识别出某个人。\n\n另一方面，计算机系统以数值方式计算并以超快速度处理相关符号。这种差异显示了生物和人工信息处理的差异，人可以同时研究这两个系统，以学习如何最好改进人工神经网络。\n\
  \n这些网络寻求应用人类大脑使用的一些组织元素，例如学习能力和泛化技能等。因此，人们对神经生理学和认知科学具有一些理解也是必要的。这有助于他们理解旨在模拟大脑工作方式以有效运行的人工神经网络。\n\
  \n在这里，我们有了关于人工神经网络的类型、层以及优缺点的信息。继续阅读以了解人工神经网络在机器学习过程中是如何运行的。\n\n## 人工神经网络引论\n\n\
  人工神经网络是人在机器学习中使用的重要工具之一。它们指的是能够获取、存储和使用实验知识的细胞系统或计算算法。这些系统显示了人工神经网络的功能模式与人类信息处理系统之间的相似性。\n\
  \n\n\n生物神经网络启发了人工神经系统的设计与开发。人们利用人工神经网络来解决预测、关联记忆、优化、识别和控制等多个问题。因此，神经系统由大量连接的处理单元组成，这些单元共同工作处理信息并产生显著的结果。\n\
  \n人脑由数百万个神经元组成，通过化学和电信号来处理并发送信号。突触是连接神经元的特定结构，允许信息在它们之间传递。神经网络形成了大量的模拟神经元。同样，人工神经系统也有一系列相互连接的神经元，它们从输入中计算值。\n\
  \n它们使用大量的连接处理单元（充当神经元）来完成信息处理。许多单元组在计算算法中形成了神经网络。这些网络包括输入层、输出层以及隐藏层，隐藏层可以将输入转换为输出层可以利用的形式。\n\
  \n人工神经网络是识别模式的完美工具，这些模式对于人类来说过于复杂无法检索，且可以教会计算机进行识别。在程序员进行仔细训练后，它还可以对大量数据进行分类。在这种情况下，深度学习神经网络提供分类。随后，程序员使用\
  \ `backpropagation`（反向传播）来纠正分类过程中发生的错误。\n\n`backpropagation` 是个人用于计算梯度失败或损失函数的方法。深度学习网络提供了多层系统，可以从输入中识别并提取某些相关元素，并将它们结合产生最终的显著输出。它利用复杂的特征检测来根据用户需要识别并分类数据。训练网络的程序员在执行\
  \ `backpropagation` 之前会对输出进行标记。\n\n因此，人工神经网络是以生物中枢神经系统为蓝图和灵感的计算模型。理解神经网络使人能够发现并理解存在的相似之处。它还让他们注意到人工智能与生物智能系统之间的差异。他们还知道如何应用合适的特性来改进和优化信息及功能。\n\
  \n## 人工神经网络的类型\n\n人工神经网络是从人类大脑中汲取灵感的计算算法。某些类型的网络利用数学过程和一组参数来建立输出。不同种类的神经网络有：\n\n\
  ### 柯霍南自组织神经网络\n\n这种类型的系统使用 `Kohonen's self-organizing neural map`（柯霍南自组织神经映射）来可视化和分类高维数据。神经网络形成从\
  \ `N` 维空间到神经元（即单元位置）的布局。在这种情况下，`N` 维空间是任意的。该地图维持了随机维度范围的拓扑连接。`U-matrix` 方法可以将 `N`\
  \ 维空间中的设计或系统可视化。它还能识别该网络提供的布局中的不规则。\n\n程序员训练网络产生的映射，使其能够形成训练或教学数据的排列。在训练过程中，值决定了神经元在保持不变的情况下权重如何变化。自组织过程的第一阶段由输入向量和小权重初始化每个神经元的值。第二阶段包括胜出神经元，即距离某点最近的神经元。与这些胜者连接的其他神经元也向该点移动。`Euclidean\
  \ distance`（欧式距离）计算神经元与点之间的距离，最小距离产生胜者。循环导致位置的聚类，每个神经元代表每一类型的类。\n\n人们可以将数据进行聚类，因为它可以识别数据各个子组之间的界限。人们使用关联来对新输入进行分类。这种神经系统还允许用户获取知识并分析探索性数据。人们用它识别数据并将聚类数据准确分析为各种分类。\n\
  \n### 前馈神经网络 – 人工神经元\n\n这种类型是最容易获取的神经网络形式，因为数据沿单方向移动。数据通过输入节点并从输出节点出来。前馈神经网络类型没有\
  \ `backpropagation`，只具有前向传播。因此，它可能包含或不包含隐藏层。它通常还使用激活函数用于分类。\n\n系统计算权重和输入的乘积总和，并将该和输入输出。产生的输出被激活或去激活，取决于阈值值。这个边界通常为零，如果值等于或高于一，神经元就会释放一个激活输出。另一方面，如果乘积小于零，神经元就不会释放它，而是由网络发送去激活的值。\n\
  \n`Feedforward Neural Network`（前馈神经网络）对噪声输入有反应且易于维持。它存在于计算机的语音和视觉识别特征中，因为它可以分类复杂的目标类别。\n\
  \n### 径基函数神经网络\n\n这种神经系统观察点相对于中心的距离，由两层组成。特征最初与内层存在的 `Radial Basis Function`（径基函数）结合。系统在后续步骤（即内存）处理相同产品时，会考虑相关元素产生的输出。人们可以使用\
  \ `Euclidean method`（欧式法）测量感兴趣的距离。\n\n该神经网络根据圆的半径或最高范围将点分类为不同的组。点越接近环形范围，系统越可能将该新点归类为特定类别。`beta\
  \ function`（Beta 函数）控制从一个区域切换到另一个区域时有时发生的转换。\n\n`Radial Function Neural Network`（径基神经网络）最显著的应用是\
  \ `Power Restoration Systems`（电力恢复系统），这些系统巨大且复杂。网络以有序的方式恢复电力，医院等紧急客户首先获得电力，其次是大多数，最后是少数。恢复遵循电力线和轨道半径内客户的安排。第一条线路将解决紧急客户的停电，第二条将修复大多数人的电力，最后一条将处理剩余的少数。\n\
  \n### 循环神经网络 – 长短期记忆\n\n`Recurrent neural network`（循环神经网络）使用一种方法，即它保存层的输出并将其馈回输入。它寻求协助提供关于层结果或结果的预测。这种类型的神经网络出现在某些模型中，例如文本转语音原型。在这种情况下，系统首先将文本转换为音素。\n\
  \n\n\n循环神经网络中的神经元在执行计算时类似于记忆单元。每个神经元都会记住它在上一个时间步中拥有的某些细节或数据。因此，从一个神经元传递到下一个神经元的信息越多，神经元回想的知识就越多。该系统通过前向传播工作，并回想起未来使用所需的哪些知识。\n\
  \n如果网络做出的预测错误的，人员会使用反向传播。他们纠正错误并利用学习率产生微小的修改。这些更改将引导系统做出正确的预测。此外，必须注意的是，特征和权重之和产生了输出，这构成了循环神经网络的第一层。\n\
  \n## 卷积神经网络\n\n这种神经网络类型可以接收输入图像，并对表示中的不同特征或条目分配重要性。之后，它能够区分不同的图形。与其他用于分类的算法相比，卷积神经网络需要的较少的预处理。不同的不同的方法需要利用由程序员手动设计的滤波器。相比之下，这种类型神经网络的深度学习算法具有学习必要滤波器或特质的能力。\n\
  \n卷积神经网络的结构灵感源于大脑中视觉皮层的形成和结构。它的组织方式类似于人类脑中神经元连接的模式。单个神经元仅对光区域内一个被称为“感受野”的受限区域做出反应。这一组感受野通过重叠覆盖了整个视觉区域。\n\
  \n因此，这种神经网络类型使用相关的滤波器来更好地拟合图像数据集，从而更多地理解图像的复杂性。屏幕指的是系统分批接收输入特征，这有助于它分段回想图像并进行计算处理。系统执行适当的筛选，减少了相关的框架数量，并允许权重的重用。结果，卷积神经网络类型可以有效地获取时间和空间依赖关系。\n\
  \n这种神经系统在神经元中具有偏置和可学习权重，使人员能够将其用于计算机视觉领域的信号和图像处理。计算过程包括将图像从 HIS 或 RGB 标度转换为灰度。这种转换改变了像素值，反过来有助于识别边缘。然后它能够将图像分类到各种类别。计算机视觉技术大量利用了这种神经网络，因为它可以处理信号并提供准确的图像分类。\n\
  \n## 模块化神经网络\n\n这种神经系统类型有一组不同的网络，它们独立工作以提供输出。它们在执行必要任务时不会相互之间传输信号。每个神经系统都包含一组属于相关网络的专用输入。因此，这些结构在创建和执行分配的子职责时，不会以任何方式相互作用。它们通过将过程分解为子任务来降低过程的复杂性。这导致网络在互不相互作用的情况下运行，因为过程之间的链接数量减少了。\n\
  \n结果，完成子任务的效率导致了计算过程速度加快。然而，完成过程的时间取决于神经元的数量以及它们参与结果计算的程度。\n\n## 人工神经网络层\n\n人工神经网络由三层组成。这些层是输入层、隐藏层和输出层。许多互连的节点构成了这些层中的每一个，且节点具有激活函数，激活函数是特定输入的输出。\n\
  \n### 输入层\n\n该层接收每个观测值的描述性特征值。它为系统提供模式，并与隐藏层通信。该层中的节点不修改数据，因为它们是被动的。它复制接收到的每个值并将它们发送到隐藏节点。此外，描述性变量的数量与该层中节点数量相同。\n\
  \n### 隐藏层\n\n该层利用加权链接结构来处理值。它将进入层的值与权重相乘，然后将加权输入相加得到单个数字。在这种情况下，加权是指程序存储的一组预设数字。隐藏层实现特定的转换。\n\
  \n### 输出层\n\n该层从输入层或隐藏层获取连接，并提供匹配预测的输出。这种层导致产生输出。在该层中，活动节点合并并修改数据。\n\n总之，输入层包含了向隐藏层传递信息的神经元。隐藏层将数据传递到输出层。神经网络中的突触是参数化框架或边界。因此，神经网络中的每个神经元都包含输入、激活函数和输出。权重代表突触，而激活函数建立了输入。\n\
  \n## 神经网络的优点和缺点\n\n使用人工神经网络有一些优缺点。了解它们使能够更好地理解涉及的操作和缺陷。\n\n### 人工神经网络的优点\n\n以下是人工神经网络的优点，有助于人员学习使用神经系统的优势。\n\
  \na) 机器学习能力——人工系统学习情况和事件，并进行判断。\n\nb) 处理不完整知识的能力——适当的训练使网络在信息不足或不完整的情况下输出。\n\nc)\
  \ 分布式内存——信息存储在整个网络中，而不是数据库中。程序员使用示例来训练神经网络并获得期望的输出。通过尽可能利用细节来训练神经系统。示例包含了确保网络将学习的所有信息和部分。这种训练为系统提供了不同的相关细节，允许产生适当的输出。训练过程中的示例越好，神经网络提供错误输出的可能性就越低。\n\
  \nd) 并行处理能力——由于数值优势，网络可以同时执行多个任务。它们同时以高速度处理多个数值。\n\ne) 信息存储在整个网络——系统将信息存储在整个网络中，使其即使在部分丢失某些信息细节的情况下继续运行。\n\
  \nf) 容错性——网络具有容错性，即使在一个或多个细胞衰化的情况下也能继续输出。\n\ng) 逐渐腐变——网络的退化不会突然和立即发生。它在一段时间内缓慢和逐步地发生，这使得人们尽管存在腐变仍可以使用系统。\n\
  \n### 人工神经网络的缺点\n\n\n\n\n\n以下是与人工神经网络相关的几个困难。它们表明了个人在使用该系统时的缺点。\n\na) **向网络展示问题的困难性**\
  \ – 这种神经系统只处理以数值形式的信息。因此，用户必须将问题转换为数值以利用该网络。用户可能会发现根据需要转换显示机制具有挑战性。\n\nb) **对硬件的依赖**\
  \ – 神经网络依赖于具有并行处理能力的硬件，没有这些硬件它们就无法运行。\n\nc) **网络的持续时间不确定** – 当网络在示例上的误差下降到特定的误差值时，系统会发出训练完成的信号。这种估算并不代表最优结果。\n\
  \nd) **网络不可解释的行为** —— 由于网络在提供解决方案时没有附带解释，人们对该网络的信任度会降低。\n\ne) **确定合适的网络结构** – 相关的神经系统是通过实验和经验形成的。建立适当的网络结构没有固定的规则。\n\
  \n结论，人工神经网络是人工智能和机器学习中的关键工具。人员需要理解神经系统的含义以及它是如何运作的。网络的类型指示了网络在不同情况下的运行方式，而层级结构展示了数据在这个神经系统中是如何移动的。优点和缺点也能让用户了解网络的优劣。上述信息提供了人们可以用来学习人工神经网络的重要知识。随后，他们可以将将其应用于系统的实际开发中。\n\
  \n## 第 11 章 数据科学\n\n![数据科学图像结果](img/image00285.jpeg)\n\n我们花费大量时间研究机器学习以及我们利用 Python\
  \ 能够做到的事情，主要原因之一是我们希望利用它来帮助我们处理数据科学。许多公司正在深入研究数据科学的想法以及这种方法能为他们做的一切，无论你的业务是寻求扩展到新领域，还是想触及更多客户或发布新产品，数据科学都能为你提供帮助。\n\
  \n现在，数据科学会带来几个不同的步骤，以确保它尽可能地成功。但总的来说，它将由许多机器学习和 Python 算法组成，这些算法将帮助我们对准备好的数据进行组织，以便我们以后使用。但通过数据科学的帮助，我们确实做更多事情，我们现在将花一点时间探索。在本章中，我们将观察这一过程中的几个重要步骤，包括数据科学的基础、深度学习是如何介入的，以及数据准备如何成为我们所需的工具。\n\
  \n## 什么是数据科学？\n\n我们在这里要花时间讨论的第一个话题是关于数据科学的。简单来说，数据科学就是一种非常详细的研究，它向我们展示了公司收集和获取的大量数据中的信息流，并希望从中学习一些东西。在我们的现代世界中，无论我们转向何方，处处信息。公司可以使用这些数据，通过通过在社交媒体上开设账户或其他方法，他们可以从客户那里收集大量数据，并以许多不同的方式使用它们。\n\
  \n虽然收集所有这些不同的信息很重要，并且看起来似乎是公司需要做的唯一事情，但当我们试图弄清楚所有这些数据应该采取的步骤时，问题就会真正显现。如果我们对能用这些信息做什么主意，或者对在这些数据中能发现什么完全没有头绪，仅仅保留这些信息对我们没有很大好处。而且由于数据非常多（通常在我们开始时远比我们想象的要多），我们很难简单地分配一个人甚至一个团队来查阅这些数据，并高效快速地找到这组数据中的模式和洞察。\n\
  \n数据科学的出现就是为了处理这类问题。它将介入帮助我们确定信息中发现了什么，甚至是如何存储这些信息。通过人工智能和机器学习的帮助（我们稍后会进行讨论），我们会发现数据科学能够处理信息并发现其中的趋势，特别是那些隐藏的趋势。\n\
  \n提到数据科学时，我们能够从原始和非结构化数据中获得有意义的洞察，然后通过业务、编程和分析技能进行处理。让我们进一步了解更多关于数据科学的内涵、它为什么重要，以及数据科学循环的不同部分。\n\
  \n现在，我们每天会看到产生 25 万亿字节的数据供公司使用，随着物联网（IoT）的持续增长，这一速度将更快的速度增长。这是数据量的惊人增长，对于许多公司了解其客户、确定下一个发布的最佳产品，以及与他们希望提供的客户服务进行良好合作非常有用。所有这些数据将来自各种来源，包括：\n\
  \n1. 商场内安装了传感器以收集个人购物者的信息。\n2. 各种社交媒体平台上的帖子可以向公司反馈信息。\n3. 我们手机中的视频和数字照片摄入的数据比以往任何时候都要。\n\
  4. 公司在查看人们在线购物时的购买交易时甚至可以获得一些有用信息。\n\n想一下这会产生多少数据。但无论数据来自哪里，它都被被称为大数据。正如我们在这里想象的，来自所有不同的数据源，公司将面临数据洪没，并且处理着超出他们真正掌握范围的数据。而且个人去独立完成这项工作是不可能的。这就是为什么我们学习最佳方法来处理数据并使其符合我们的需求非常重要。当这种情况发生时，我们能够更好地利用这些数据和内部的所有信息来做出我们的业务决策。\n\
  \n在这一部分，我们看到数据科学的想法在画面中越来越多地出现。数据科学将汇聚在商业世界取得成功所需的各种技能，包括业务领域知识、统计学和数学。所有这些对于我们的过程都是至关重要的，因为它们将从许多方面帮助组织。我们可能还不知道这些方法在未来将以哪些方式帮助业务，但公司现在和以后使用这些数据的一些方式包括：\n\
  \n1. 帮助公司学习每天可以降低成本的新方法。\n2. 它可以帮助公司确定进入对他们有利的新市场的最佳方法。\n3. 这可以帮助公司了解各种人口统计特征以及如何切入。\n\
  4. 它可以帮助公司查看他们发出的营销活动，然后判断该营销活动是否有效。\n5. 它可以使公司更容易成功地推出新的服务产品。\n\n\n\n\n我们已经花了一些时间观察数据科学的生命周期，但为了帮助我们更多地了解它并进行回顾，让我们过一遍这些步骤。我们需要确定想要解决的核心业务问题，然后开始收集我们想要使用的数据。由于这些数据将分布在许多不同的位置，我们将能够对其进行格式化、清理，并确保离群值、重复值和缺失值得到处理。\n\
  \n从那里开始，我们能够通过算法处理数据。得益于 `Python` 编程语言及其提供的所有功能，我们看到有大量的算法非常适用于这个过程。我们可以选择需要的算法，然后提前对信息进行一些训练和测试，以确保它们已准备好进行预测。然后，我们可以通过一些可视化来完成整个过程，这有助于更容易地看到我们数据内部发生的一些复杂关系和相关性。\n\
  \n从那里开始，我们需要转向数据科学项目中将会出现的一些组件。有许多组件需要汇聚并协同工作，以确保我们实际上能够从所从事的任何数据科学项目中获得最大收益。\n\n\
  ### 数据类型\n我们需要花时间关注的第一个组件是我们正在处理的数据类型。我们拥有的原始数据非常重要，因为它们将成为在这个过程中所做的所有其他工作的基础。尽管如此，在这个过程中你能够找到两种主要数据类型是：结构化数据，即我们在某些表格形式或数据集中找到的数据；然后我们还有一种被称为非结构化的数据类型，包括图像、视频、电子邮件和\
  \ PDF 文件等。\n\n### 编程\n当我们观察数据科学时，发现的第二个组件是编程。你必须编写一些程序来创建我们之前讨论的数学模型，并让它们真正地筛选信息并做出预测。所有的数据分析和管理将由计算机编程来完成。数据科学中最常用的两种流行语言包括\
  \ `R` 和 `Python`，因此学习其中之一是有帮助的。\n\n### 概率与统计\n列表上的下一个是概率和统计。数据将以某种方式被处理，以便从这些数据中提取信息和趋势。概率和统计将是把这一切整合在一起的数学基础。如果对这两个主题没有良好的理解和大量的知识，你可能会误读数据，并得出不正确的结论。这就是为什么概率和统计对数据科学领域如此重要的大原因之一。\n\
  \n### 机器学习\n当我们研究数据科学时，还必须关注机器学习的概念。当有人处理所有这些大数据以及其中包含的所有内容时，他们也会使用许多随而的算法。这可以同时包括分类和回归方法。\n\
  \n### 大数据\n我们在这里需要花时间关注的最后一个关键组件是大数据的概念。在我们今天生活的世界里，原始数据如此重要，但我们需要能够获取它们并将其转化为实际上能够使用的东西。这些数据中有很多好信息，但如果它们只是停在那里，而我们无法从中提取所需的所有信息，那么它们对我们来说就是毫无价值的。\n\
  \n这就是 `Python` 算法真正发挥作用的地方。你会发现，当我们挑选并使用正确的算法时，我们可以将所有这些原始数据——那些可能是混乱、无组织且难以处理的数据——并实际上将其转变为我们整体上能够使用和欣赏的东西。\n\
  \n在处理数据科学时，我们将能够处理许多不同的事物。不过，数据科学伴随着许多部分。我们必须确保了解数据科学全过程的所有不同部分。\n\n## 第 12 章：深度学习速览\n\
  \n人工智能是一个多年来在许多对话中反复出现的研究领域。几年前，这还是一个在电影和漫画书中传播的未来主义概念。通过多年的开发和研究，我们目前正在经历着人工智能的黄金时代。事实上，人们广泛预计\
  \ AI 将帮助我们开启计算的新前沿。\n\n人工智能可能与机器学习和深度学习有一些相似之处，但它们并不是同一种东西。许多人交替使用这些术语，而不考虑其假设的后果。深度学习和机器学习是人工智能的知识分支。虽然过去使用过不同的定义来解释人工智能，但基本的约定是，这是一个构建计算机程序的过程，这些程序具有像正常人类大脑一样进行操作和运行功能的能力。\n\
  \nAI 的概念是训练计算机以像人类大脑一样思考和运行的方式进行思考。在人类大脑方面，我们尚未完全掌握我们大脑的真实潜力。专家认为，即使是世界上最才华横溢的人也无法完全耗尽大脑容量。\n\
  \n因此，这产生了一个难题，因为如果我们还没有完全理解和测试大脑的局限性，我们又如何构建出可以复制人类大脑的计算系统呢？如果计算机学习了像人类一样互动和操作，并到在我们学会使用自己的大脑之前充分利用它们的脑力，会发生什么？\n\
  \n理想情况下，AI 背后的力量或其思考能力尚未确定。然而，该领域的研究人员和其他专家多年来取得了巨大的进展。体现这些价值的 AI 例子之一是 `Sophia`。Sophia\
  \ 目前可能是世界上最先进的 AI 模型。可能由于我们无法充分推及大脑的局限，我们可能永远无法将 AI 的局限推到可以完全取代人类的地步。\n\n机器学习和深度学习是人工智能的两个分支，年来一直显著的研究和增长。对这些框架的关注特别来自于世界上许多领先科技公司已无缝地将它们实施到自己的产品中，并将其整合到人类生存中。你在日常生活中一直在与这些模型互动。\n\
  \n\n\n\n\n在我们开始之前，请你提醒自己这两个学科的基本定义或解释是非常重要的。机器学习是人工智能的一个分支，它使用算法来教机器如何学习。除了算法之外，机器学习模型还需要输入和输出数据，它们通过与不同用户的交互来从中学习。\n\
  \n在构建此类模型时，始终建议确保你构建的是一个可扩展的项目，该项目在适用时可以接收新数据，并利用它来持续训练模型以提高其效率。一个高效的机器学习模型应该能够自我修改，而不一定需要你的输入，并且仍然提供正确的输出。它从现有的结构化数据中学习并不断更新自己。\n\
  \n深度学习是机器学习的一类，它使用了与机器学习相同的算法和函数。然而，深度学习引入了超越算法力量的层级计算。深度学习中的算法是以层的形式使用的，每一层都以不同的方式解释数据。深度学习中使用的算法网络被称为人工神经网络。\n\
  \n“人工神经网络”这个名称为我们提供了与深度学习框架中发生的情况最接近的迭代描述。这里的目标是通过关注神经网络，尝试模拟人类大脑的功能方式。深度学习科学领域的专家多年来研究并引用了关于人类大脑的不同研究，这帮助了该领域的研究先驱。\n\
  \n## 问题解决方法\n\n让我们考虑一个例子来解释深度学习和机器学习之间的区别。\n\n假设你有一个包含卡车和自行车照片的数据库。你如何使用机器学习和深度学习来理解这些数据呢？从乍看之下，你看到的是一组卡车和自行车。如果你需要使用这两个框架分别识别自行车和卡车的照片，情况会如何？\n\
  \n为了帮助你的机器学习算法根据请求的类别识别卡车和自行车照片，你必须首先教它这些照片是关于什么的。机器学习算法是如何找出区别的？毕竟，它们看起来几乎完全一样。\n\
  \n解决方案在于结构化数据方法。首先，你将对自行车和卡车的照片进行标记，定义定义某类物品所特有的不同特征。这对于你的机器学习算法进行学习来说已经足够的数据了。根据输入标签，随着遇到更多数据，它将不断学习并完善其对卡车和自行车之间差异的理解。从这个简单的插图中可以看出，它将继续在它能够访问的数百万其他数据中搜索，以区分卡车和自行车的区别。\n\
  \n### 我们如何在深度学习中解决这个问题？\n\n深度学习的方法与我们在机器学习中所做的做法不同。这里的益处是，在深度学习中，你不需要任何标记或结构化数据来帮助模型从自行车中识别卡车。\n\
  \n人工神经网络将通过网络中不同的算法层识别图像数据。每一层都将识别并定义照片中的特定特征。这与我们大脑在尝试解决某些问题时使用的方法相同。\n\n通常，大脑会考虑很多可能性，在确定正确答案之前排除所有错误的选项。深度学习模型将通过几个层级过程传递查询以找到解决方案。在每个识别级别，深度神经网络都会识别出一些有助于区分自行车和卡车的标识符。\n\
  \n这是理解这两个系统如何运作的最简单方法。然而，深度学习和机器学习并不一定都是区分这些照片的适用方法。当你学习这两个领域之间的差异时，你必须记住，在选择实施解决问题的最佳方法之前，你必须正确地定义问题。你将在机器学习旅程的稍后阶段学习如何选择正确的方法，这在系列系列的进阶书籍中已经涵盖了。\n\
  \n从上面说明的例子中，我们可以看到机器学习算法需要结构化数据来帮助它们区分卡车和自行车的区别。基于这些信息，它们在识别出分类器后，便可以产生正确的输出。\n\n\
  然而，在深度学习中，你的模型可以通过通过其框架中的几个数据处理层传递信息来识别卡车和自行车的图像。不需要结构化数据。为了做出正确的预测，深度学习框架取决于每个数据处理层提供的输出。这些信息随后会累积并呈现最终结果。在这种情况下，它排除了所有可能性，只留下唯一可靠的解决方案。\n\
  \n从我们上面的插图中，我们学习了一些重要的事实，这些事实将帮助你在多年后的学习中区分深度学习和机器学习。我们可以将其总结为以下几点：\n\n-   **数据呈现**：机器学习和深度学习之间的主要区别在于我们向各自模型引入数据的方式。。对于机器学习模型，你几乎总是需要使用结构化数据。然而，在深度学习中，网络依赖人工神经网络层来识别有助于识别数据的独特特征。\n\
  \n-   **算法和人工干预**：机器学习的重点是从与不同的输入交互并使用模式。通过这种交互，机器学习模型学习得越久、接收到的交互越多，产生的输出就越好。为了实现这一点，你还必须尝试提供尽可能的新数据。\n\
  \n当你意识到呈现的输出不是你需要的，你必须重新训练机器学习模型以交付更好的输出。因此，对于一个应该在没有人工干预的情况下运行的系统，你仍然需要不时地出现。\n\
  \n在深度学习中，不需要你的参与。神经网络中的所有嵌套层都在不同级别处理数据。但在过程中，模型可能会遇到错误并从中学习。\n\n这与人类大脑的工作方式相同。随着你长大，你通过试错学习了许多重要的生活技能。通过犯错，你的大脑学会了正反馈和负反馈之间的区别，并努力尽可能获得积极的结果。\n\
  \n公平地说，即使在深度学习中，仍然需要你的输入。你不能很有地假设输出将是完美的。这在你的输入数据对于满足你对模型要求的输出时特别适用。\n\n这里的底层因素是，机器学习和深度学习都必须使用数据。你拥有的数据将对你从这些模型获得的结果产生持久的影响。提到数据，你不能直接使用遇到的任何数据。为了有效使用这任何一个模型，你必须学会检查数据，并确保你正在使用你偏好的模型的正确格式。\n\
  \n\n\n\n\n在我们那个用于识别卡车和自行车的示例中，我们尝试在一个理论概念中解决一个非常简单的问题。然而，在现实世界中，深度学习模型被应用于更复杂的模型中。如果你思考其中涉及的过程，从概念到分层数据处理，以及数据必须通过的不同层数，那么使用深度学习模型来解决简单问题将是对资源的浪费。\n\
  \n虽然所有此类别的 AI 都需要数据来帮助实现我们所需的智能，但深度学习模型对数据的访问需求远大于机器学习算法。这一点非常重要，因为深度学习算法在传递输出结果之前，必须在排除合理怀疑的情况下证明其输出是完美的。\n\
  \n只有当神经网络接触过数百万个数据点时，深度学习模型才能能够轻松地识别出数据处理层中的差异和概念。这有助于排除所有其他可能性。然而，在机器学习中，模型可以通过已经预定义的标准进行学习。\n\
  \n##不同的应用场景\n\n在了解了机器学习和深度学习之间的区别后，这两者在现实世界中可以应用于哪里？当你处理海量数据时，深度学习是一个可靠的解决方案。在这种情况下，你需要从这些数据中进行解释并做出决策，因此你需要一个适合你资源分配的模型。\n\
  \n在处理使用机器学习算法无法解决的复杂问题时，也推荐使用深度学习模型。除此之外，重要的是要意识到深度学习模型通常具有极高的资源需求。因此，当你拥有足够的资金实力和资源分配来获取相关程序和硬件时，你应该考虑深度学习模型。\n\
  \n在处理可用于训练不同机器学习算法的结构化数据时，机器学习是一个可行的解决方案。在算法执行请求的任务之前，涉及到大量的学习过程。\n\n你也可以使用机器学习来享受人工智能的益处，而不一定实现全规模的人工智能模型。\n\
  \n机器学习算法经常用于帮助或加速业务和工业流程中的自动化过程。机器学习模型的常用示例包括广告、身份验证器、信息处理和营销。这些应该帮助你的业务在市场中面对竞争时获得更好的定位。\n\
  \n##结论\n\n现在我们已经读到了书的最后，我希望你已经对机器学习是什么以及如何使用 `Python` 构建机器学习模型有了基础性的理解。构建机器学习模型的最好方法之一是练习书中的代码，并尝试编写类似的代码来解决其他问题。重要的是记住，练习得越多，表现得越好。此事的最佳方法是开始处理简单的问题陈述，并使用不同的算法来解决它们。你也可以尝试通过识别解决问题的新方法来解决这些问题。一旦你掌握了基础问题，就可以尝试使用一些高级方法来解决这些问题。\n\
