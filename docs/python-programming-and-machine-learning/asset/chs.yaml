  \ as 是借自 Matplotlib 的。由于其层次更高，它能够生成各种图表，例如热图的制作、小提琴图的处理以及帮助生成时间序列图。\n\n* 图表插图 ![00010.jpeg](img/image00283.jpeg)\n\
