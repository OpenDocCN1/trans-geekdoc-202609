  \ Python 壳。\n\n你现在可以使用上面的外壳开始开始输入 Python 函数了。\n\n你可能已经注意到，你打开的每个文件内容都有各种条目。随着你不断学习\
  \ Python 编程，你可以点击并打开所有的它们。\n\nPython 是一门学生已经学习了几天或几个月的编程语言。因此，本书中介绍的内容是初学者的基础知识。\n\
  \n后续的插图将假设你正在 Windows 环境下运行 Python 程序。\n\n1. 启动 IDLE\n2. 进入 `File` 菜单并点击 `New Window`\n\
  3. 输入以下内容：`print (“Hello World!\")`\n4. 在 `file` 菜单上点击 `Save`。输入名称 `myProgram1.py`\n\
  5. 进入 `Run` 并点击 `Run Module` 来运行程序。\n\n我们编写的第一个程序被称为“Hello World!”，它不仅用于对新的计算机编码语言提供介绍，还用于测试\
  \ IDE 的基本配置。程序的输出是“Hello World!”。这里是发生的情况：`Print()` 是一个内置函数，它是为你预写并预加载的，只要 `()`\
  \ 中的内容位于双引号之间，它就用于显示其中的任何内容。计算机将显示双引号内写的任何内容。\n\n**练习题：** 现在编写并运行以下 Python 程序：\n\
  \n- `print(“I am now a Python Language Coder!\")`\n- `print(“This is my second simple\
  \ program!\")`\n- `print(“I love the simplicity of Python”)`\n- `print(“I will display\
  \ whatever is here in quotes such as owyhen2589gdbnz082”)`\n\n现在我们需要编写一个带有数字的程序，但在编写此类程序之前，我们需要学习一些关于变量和类型（Types）的知识。\n\
  \n记住 Python 是面向对象的，它不是静态类型的，这意味着我们不需要在使用变量之前声明它们，也不需要指定它们的类型。让我们解释一下这句话：面向对象的语言简单意味着该语言支持将现实世界的场景视为带有子小组的组，这些小组可以被链接和共享，模拟事物的自然顺序和相互作用。并不是所有的编程语言都是面向对象的，例如\
  \ Visual C 编程语言就不是对象。在编程中，声明变量意味着我们显式地说明变量的性质。变量可以声明为整数、长整数、短整数、浮点整数、字符串或字符，包括它是在局部还是全局范围内可的。变量是一个根据条件改变值的存储位置。\n\
  \n例如，`number1` 可以接受从 0 到无穷的任何数字。然而，如果我们显式地指定 `int number1`，那么意味着存储位置将只接受整数而不接受分数（例如）。幸运的是还是不幸的是，Python\
  \ 不要求我们显式地说明存储位置的性质（声明变量），因为那是留给 Python 语言本身去判断的。\n\n在处理变量类型和变量规则之前，让我们运行一个简单的程序来理解在编写\
  \ Python 程序时变量是什么。\n\n- 启动 IDLE\n- 进入 `File` 菜单并点击 `New Window`\n- 输入以下内容：\n```python\n\
  num1=4\nnum2=5\nsum=num1+num2\nprint(sum)\n```\n- 在 `file` 菜单上点击 `Save`。输入名称 `myProgram2.py`\n\
  - 进入 `Run` 并点击 `Run Module` 来运行程序。\n\n该程序的预期输出应该是不带双引号的“9”。\n\n## 讨论\n\n此时，你可能急于了解刚刚发生了什么，以及为什么\
  \ `print(sum)` 没有像我们写的第一个程序那样带有双引号。这里是解释。\n\n第一行 `num1=4` 意味着变量 `num1`（我们对 `number1`\
  \ 即第一个数字的简写）在程序运行之前已被赋值为 4。\n\n第二行 `num2=5` 意味着变量 `num2`（我们对 `number2` 的简写）在程序运行之前已被赋值为\
  \ 5。\n\n第三行 `sum=num1+num2` 告诉计算机相加 `num1` 和 `num2`并将结果赋值给 `sum`。\n\n第四行 `print(sum)`\
  \ 显示 `sum` 的值。\n\n该程序的预期输出应该是不带双引号的“9”。\n\n\n我们使用了 `num1`、`num2` 和 `sum`，变量名并不是随机的，它们必须遵循某些规则和约定。\n\
  \n\n1. 变量名应始终以字母或下划线开头，即：\n2. 变量名的剩余部分可以由数字、字母和下划线组成，即：\n3. 变量名区分大小写，这意味着大写字母和小写字母被视为不同的。\n\
  \n**练习题：** 为以下编写/建议五个变量：\n- 医院科室\n- 银行\n- 媒体机构\n\n给定 `scri=75`, `scr4=9`, `scr2=13`,\
  \ `Scr=18`。上面的变量名应该代表学生的成绩。重写这些变量以符合 Python 变量规则和约定。\n\n\n正如前面所示，约定（conventions）本身并不是规则，而是既定的传统，它们为我们在\
  \ Python 中命名变量的方式增加了价值和可读性。\n\n- **维护可读性：** 你的变量应该给出它们正在处理内容的提示，因为程序是为了给编写者以外的其他的人阅读的。与\
  \ `n1` 相比，`number1` 很容易阅读。同样，与 `firstname` 或 `firstName` 或 `fn` 相比，`first_name`\
  \ 很容易阅读。这些的意思都是，它们在 Python 中都是有效/接受的变量，但约定迫使我们以易于阅读的形式编写它们。\n- **使用描述性名称：** ...与\
  \ `yale` 或 `mything` 相比。换句话说，我们可以写 `yale` 来获取 `number1` 的值，但该名称没有直接暗示我们正在做什么。\n\n\
  \n\n\n\n由于容易混淆，请避免使用大字母 ‘O’、小写字母 ‘l’ 和大写字母 ‘I’，因为它们可能与数字数字。换句话说，使用这些字母并没有违反变量命名规则，但将它们作为变量名会引起混乱。\n\
  \n### 练习题 1\n重写以下变量名，使其 (1) 成为有效的变量名并符合 (2) 变量命名规范。\n\n- `23doctor`\n- `line1`\n\
  - `Option3`\n- `Mydesk`\n- `#cup3`\n\n### 练习题 2\n编写/建议 (1) 有效且 (2) 符合规范的变量名。\n\n\
  - 你想对三个数字求和。\n- 你想存储四个学生的名字。\n- 你想存储医院里五位医生的名字。\n\n\n到这里，你可能在疑惑为什么必须以那种方式使用 `print`\
