  trans: '

    这是一个非常广泛使用的 `Python` 库。它的特性使其能够进行多维数组处理。同时，它对矩阵处理也有帮助。然而，这些功能的实现只有在大量数学函数的帮助下才能完成。值得注意的是，这个
    `Python` 库在解决科学领域最重要的计算任务时非常有用。此外，`NumPy` 也适用于线性代数、工业中使用的随机数能力推导，尤其是傅里叶变换等领域。`NumPy`
    还被其他高级 `Python` 库（如 `TensorFlow`）用于 `Tensors` 的操作。简而言之，`NumPy` 主要用于计算和数据存储。你也可以向
    `Python` 导出或加载数据，因为它具备了执行这些功能的特性。值得注意的是，这个 `Python` 库也被称为数值型 Python（numerical
    Python）。


    # SciPy


    这是我们当今工业领域使用的最流行的库之一。它的特点是包含了不同的模块，这些模块适用于数据分析的优化领域。它在积分、线性代数以及其他形式的数学统计中也起着重要作用。


    在许多情况下，它在图像处理中起着至关重要的作用。图像处理是一个日常活动中广泛适用的过程。`Photoshops` 等许多案例都是 `SciPy` 的应用。此外，许多组织在图像处理时更倾向于使用
    `SciPy`，特别是用于演示的。例如，野生学会可以对猫进行描述，然后使用不同的颜色对其进行处理以适应他们的项目。下面的示例可以帮助你更直观地理解这一点。图片已经过处理：


    ![00013.jpeg](img/image00284.jpeg)


    原始输入图像是野生学会拍摄的一只猫。在根据我们的喜好对其进行处理和调整大小后，我们得到了一只经过调色的猫。


    # Keras


    这也是 `Python` 库不可或缺的一部分，特别是在机器学习领域。它属于高层神经网络组。值得注意的是，`Keras` 具有在其他库（特别是 `TensorFlow`
    甚至 `Theano`）上运行的能力。此外，它可以持续运行而不发生机械故障。此外，它在 `GPU` 和 `CPU` 上运行似乎都更好。对于大多数 `Python`
    编程初学者来说，`Keras` 提供了一条条通往最终理解的可靠途径。他们将能够设计网络甚至构建它。其快速原型设计的能力使其成为学习者眼中最好的 `Python`
    库。


    # PyTorch


    这是另一个易用且开源的 `Python` 库。由于其名称，它在工具方面拥有广泛的选择。它也适用于我们计算机视觉领域。计算机视觉和视觉显示在多种类型的研究中起着至关重要的作用。此外，它还有助于处理自然语言。此外，`PyTorch`
    可以承担一些针对开发者的技术任务，即使用计算进行海量计算和数据分析。它还可以帮助创建主要用于计算目的图。由于它是开源的 `Python` 库，它可以在 `Tensors`
    等库上工作或执行任务。与 `Tensors GPU` 结合，其加速将会提升。


    # Scrapy


    `Scrapy` 是另一个用于创建爬虫程序的库。例如爬虫机器人等。爬虫机器人经常有助于数据检索，并适用于网络上 URL 的形成。从从开始，它的目的是协助数据抓取。然而，这已经经历了多次演变，导致了其通用用途的扩展。因此，如今
    `scrapy` 库的主要任务是作为通用的爬虫。该库促进了通用化使用、通用代码的应用等。


    # Statsmodels


    `Statsmodels` 是一个旨在使用多种统计计算方法和数据验证进行数据探索的库。它具有许多功能，如结果统计甚至特征特征。在各种模型（如线性回归、多重估计和涉及时间序列的分析，甚至使用更多线性模型）的帮助下，它可以承担这一角色。此外，其他模型（如离散选择）也适用于此处。


    ## 在机器学习编程中使用 Python 的优势


    对于机器学习算法，我们有一种清晰且易于大部分数据研究人员和科学家理解的语言。一种拥有对不同类型工作以及特别是特定矩阵数学有用的库的语言将是更理想的。此外，使用拥有大量活跃开发者的语言具有很大的优势。这些特性使得
    Python 成为最佳选择。Python 的主要优势可以总结为以下几点：


    1. 它的语法清晰。

    2. 易于处理文本。

    3. 它被大量的人和社区使用。

    4. 可以以不同的风格进行编程：面向对象、过程化、函数式等。

    5. 是处理非数值数据的理想选择。

    6. 有从 HTML 中提取数据的能力。

    7. 在科学和金融社区中都很常见。因此，这两个领域之间存在无缝联系，特别是在机器学习领域，因为金融领域是数据集的主要来源之一。

    8. 包含了有用的库，如 `SciPy` 和 `NumPy`，使我们能够对向量和矩阵进行操作。


    # 第 10 章 人工神经网络


    随着时间的推移，人类大脑作为进化过程的一部分不断适应和发展。它在修改了许多适用且实用的特征后变得更加强大。增强大脑的一些特质包括学习能力、容错性、适应性、大规模并行、低能耗、分布式表示和计算、泛化能力以及对信息的先天上下文处理。


    开发人工神经网络的目标是希望系统能够拥有这些特征之一。人类非常擅长解决复杂的感知问题，例如仅通过一眼就能几乎瞬间地在拥挤区域识别出某个人。


    另一方面，计算机系统以数值方式计算并以超快速度处理相关符号。这种差异显示了生物和人工信息处理的差异，人可以同时研究这两个系统，以学习如何最好改进人工神经网络。


    这些网络寻求应用人类大脑使用的一些组织元素，例如学习能力和泛化技能等。因此，人们对神经生理学和认知科学具有一些理解也是必要的。这有助于他们理解旨在模拟大脑工作方式以有效运行的人工神经网络。


    在这里，我们有了关于人工神经网络的类型、层以及优缺点的信息。继续阅读以了解人工神经网络在机器学习过程中是如何运行的。


    ## 人工神经网络引论


    人工神经网络是人在机器学习中使用的重要工具之一。它们指的是能够获取、存储和使用实验知识的细胞系统或计算算法。这些系统显示了人工神经网络的功能模式与人类信息处理系统之间的相似性。

    '
