    # How Machine Learning Works


    Machine learning begins with a human guide in the form of a data scientist. A
    problem has to be identified that a machine learning algorithm can be used to
    solve it. In order for the process to work, there must be a significant amount
    of data that can be used to train the system before it is deployed in the real
    world. There are two basic ways that machine learning can proceed. They are called
    supervised and unsupervised learning.


    In the training phase, the data scientist will select appropriate training data,
    and expose the system to the data. As the system is exposed to data, it will modify
    itself in order to become more accurate. This phase is a crucial part of a development
    with the system, and the data scientist must choose the right data set for the
    problem at hand. In other words, the impression that human beings are not involved
    at all is completely false. Human beings are involved in choosing and framing
    the problem, and in choosing the right training data. The human being is also
    involved in the process of evaluating the performance of the system. As we will
    see, there are tradeoffs that must be made that have large implications for the
    viability of the system. If the data scientists that are working on the problem
    are not careful and correct, to the best of their abilities, in interpreting the
    results produced by the system, a dysfunctional system can be deployed that will
    err when attempting to do its job.


    The training phase may have several iterations, depending on how the results turn
    out.


    Once the system is deployed, it will more or less operate in an autonomous fashion,
    but data scientists that are involved in this work should be continually evaluating
    the performance of the system. At some point, the system may need to be replaced
    or it may need to be subjected to more training, if it is not producing the kinds
    of results that are accepted.


    ## Steps in Machine Learning


    The data scientist must follow a certain procedure in order to implement machine
    learning. We will learn the two different approaches that are used in "training"
    the system. Machine learning involves artificial intelligence, and so any system
    that has artificial intelligence is just like a human being, in that the system
    needs to learn it’s skill before it goes out into the real world. It is up to
    the data scientist to provide the training that the system needs.


    ### Define the Problem


    Each step in the machine learning paradigm is critical. If you make a mistake
    early on, this is going to make the entire enterprise fall flat. When you say
    artificial intelligence, while you get the impression that there is an all-powerful
    computer, like the `HAL 9000` system from 2001, the reality is a little more down
    to earth.


    It is true that there is not a specific, line by line set of instructions written
    in code by human engineers that tell the computer what to do, and once a machine
    learning system is deployed people might not really understand how it’s working.
    Nonetheless, there is a lot of direct human involvement in the process. And given
    our propensity to make mistakes, it’s important to be careful at each step along
    the way. Think of yourself as a teacher guiding a child so that they learn a new
    skill.


    The first step is having a clear definition of the problem that you are facing.
    The end goal must be in mind, so you must know what you expect the machine learning
    system to do when it is up and running.


    ### Gather and Prepare Data


    The second step is to gather the data that is necessary to use in order to train
    the system. If you define the problem but there is little or no data that can
    be used to train it, then this procedure is not going to work. Machine learning
    must have enough data so that the system can determine patterns and relationships
    in the data that will allow it to make predictions and classifications in the
    real world.


    The assumption is going to be that enough data of the right type has been collected.
    But simply having the data is not enough. If you simply feed the system raw data,
    this can create problems for a number of reasons. So you will have to look at
    the data and apply some human judgment to it. Think of data as consisting of a
    large number of fields or properties. Are all of the properties relevant to the
    problem at hand?


    In many cases, a machine learning system is going to find relationships among
    different properties that do have a predictive value that humans will miss–so
    there is a balancing act between cutting down the data versus removing something
    that might be very important, even though it doesn’t seem relevant to the human
    operator.


    Nonetheless, you don’t want to have too much information in the data set that
    can make it impossible to learn. So, you might have to discard some data to reduce
    the complexity of the problem, if this is possible.


    ### Choose the Style of Learning


    These are going to be based on the nature of the problem and the type of data
    that you have. This is an easy step in the process, since that will dictate the
    style of learning used. The main types of learning are supervised learning, unsupervised
    learning, semi-supervised learning, and representational learning. We will learn
    what types of problems each type of learning is suitable for and how the structure
    of the input data differs.


    ### Select the Most Appropriate Algorithm


    Once you have settled on whether or not the data and the problem you are solving
    is best suited for supervised or unsupervised learning, then you need to decide
    which algorithm to use. Certain situations might dictate whether one algorithm
    is better than another algorithm. Choosing the right algorithm might have an influence
    on the types of errors that you see in the results.


    This means that as someone who is using machine learning, understanding the main
    types of algorithms is going to be important.


    ### Train and Test


    Now at this point, everything is ready to go. The first step is to expose the
    system to the training data so that it can learn. Then you will test the system
    and evaluate.


    ### Improve


    When you evaluate the performance of the system with training and test data, the
    error will need to be quantified. If the error is not acceptable, adjustments
    may have to be made. In some cases, you might have to scrap the system and start
    over, but one of the benefits of machine learning is that the system is adaptive.
    The more data it sees the better it learns. So, improvement may be possible by
    simply exposing the system to more training data.


    ### Deploy


    Once the system is working to the degree that has an acceptable level of error,
    then it is ready to be deployed.


    ## Chapter 4: Types Of Machine Learning


    ![00002.jpeg](Images/image00275.jpeg)


    In a world soaked in artificial intelligence, it is interesting to understand
    machine learning in depth. This is a concept that allows an algorithm to perform
    specific tasks without relying on any explicit instructions. Instead, the machine
    relies on inference and patterns such that the user feeds data to a generic algorithm
    rather than writing the code. In response, the machine constructs the logic based
    on the input data. Usually, the accuracy of the prediction made by the algorithm
    is evaluated and the algorithm only gets deployed when the precision is acceptable.


    There are three broad categories of machine learning. We will discuss each of
    them in detail below.


    1. Supervised Learning

    '
  trans: '


    # 机器学习是如何工作的


    机器学习的起点是数据科学家形式形式的人类指导。必须先确定一个可以使用机器学习算法来解决的问题。为了使该过程能够运行，在系统部署到现实世界之前，必须有大量的数据可用于训练系统。机器学习进展有两种基本方式，它们被称为监督学习和无监督学习。


    在训练阶段，数据科学家将选择合适的训练数据，并让系统接触到这些数据。随着系统接触到数据，它将修改自身以变得更加准确。这一阶段是系统开发中的关键部分，数据科学家必须为手头的问题选择正确的数据集。换句话说，人类完全没有参与其中的观点是完全错误的。人类参与了问题的选择和框架构建，以及正确训练数据的选择。人类还参与了系统性能的评估过程。正如我们所看到的，必须进行某些权衡，这些权衡对系统的可行性具有巨大影响。如果处理问题的的数据科学家在解释系统产生的结果时不够仔细，且未能尽全力做到准确，那么可能会部署一个功能故障的系统，该系统在尝试执行任务时会出错。


    训练阶段可能会进行多次迭代，取决于结果如何。


    一旦系统部署，它将将在或多程度上以自主的方式运行，但参与这项工作的数据科学家应该持续评估系统的性能。在某些情况下，如果系统没有产生可接受的结果，它可能需要更换或需要接受更多训练。


    ## 机器学习的步骤


    数据科学家必须遵循特定的程序来实现机器学习。我们将学习在“训练”系统时使用的两种不同方法。机器学习涉及人工智能，因此任何拥有人工智能的系统都就像人类一样，即系统在进入现实世界之前需要学习其技能。提供系统所需的训练是数据科学家的责任。


    定义 定义问题


    机器学习范式中的每一步都是至关重要的。如果你在早期犯了错误，整个项目将会失败。当你提到人工智能时，虽然你可能会觉得有一台无所不能的计算机，比如《2001 漫游》中的
    `HAL 9000` 系统，但现实要接地气得多。


    确实，并没有由人类工程师用代码编写的特定的、逐行的指令集来告诉计算机做什么，而且一旦机器学习系统被部署，人们可能并不真正理解它是如何工作的。尽管如此，在这一过程中有大量直接的人类参与。鉴于我们容易犯错的倾向，在路径的每一步保持谨慎是非常重要的。将自己想象成一名老师，引导孩子学习新技能。


    第一步是对你所面临的问题有明确的定义。必须将最终目标牢心中，所以你必须知道期望机器学习系统在运行时做什么。


    收集并准备数据


    第二步是收集训练系统所需的数据。如果你定义了问题，但很少或没有数据可以用于训练，那么这个程序将无法运行。机器学习必须拥有足够的数据，以便系统能够确定数据中的模式和关系，使其能够在现实世界中进行预测和分类。


    假设已经收集了足够正确类型的数据。但仅拥有数据是不够的。如果你只是向系统输入原始数据，可能会出于许多原因引发问题。因此，你必须查看数据并进行人类判断。将数据认为由大量的字段或属性组成。所有的属性都与手的问题相关吗？


    很多情况下，机器学习系统将发现不同属性之间具有预测价值的关系，而人类会忽略这些——因此在减少数据与移除可能非常重要的内容之间需要进行平衡，尽管这些内容对人类操作员来说并不相关。


    尽管如此，你不希望数据集中包含过多的信息导致无法学习。因此，如果可能，你可能需要丢弃一些数据以降低问题的复杂性。


    选择学习风格


    这些将基于问题的性质和你拥有的数据类型。这是过程中简单的一步，因为这将决定所使用的学习风格。学习的主要类型有：监督学习、无监督学习、半监督学习和表示学习。我们将学习每种学习适用于什么类型的问题，以及输入数据的结构何不同。


    选择最合适的算法


    一旦你确定了数据和你要解决的问题最适合监督学习还是无监督学习，你就需要决定使用哪种算法。某些情况可能会决定一种算法是否比另一种更好。选择正确的算法可能会对你在结果中看到的错误类型产生影响。


    这意味着对于使用机器学习的人来说，理解算法的主要类型是非常重要的。


    训练与测试


    现在此时，一切都已准备就绪。第一步是让系统接触训练数据以便学习。然后你对系统进行测试和评估。


    改进


    当你使用训练和测试数据评估系统性能时，误差需要被量化。如果误差不可接受，可能需要进行调整。在某些情况下，你可能需要放弃系统并重新开始，但机器学习的优点之一是系统是自适应的。看到的数据越多，学得越好。因此，通过简单让系统接触更多的训练数据来实现改进是可能的。


    部署


    一旦系统达到可接受的误差水平，就可以部署了。


    ## 第 4 章：机器学习的类型


    ![00002.jpeg](img/image00275.jpeg)


    在一个沉浸在人工智能的世界里，深入理解机器学习很有趣。这个概念允许算法在不依赖任何明确指令的情况下执行特定任务。相反，机器依靠推理和模式，使用户将数据喂给通用算法，而不是编写代码。作为回应，机器根据输入数据构建逻辑。通常，会评估算法所做预测的准确性，并且只有当精度可接受时算法才会被部署。


    机器学习有三大类。我们将在下文中详细讨论每一种。


    1. 监督学习


    '
