  trans: "\n就是这样！如你所见，只要你使用 `Scikit-learn` 来减轻负担，线性回归很容易实现。然而，我们获得的结果并不完美，但也算不上糟糕。它表明，即使当我们拥有相当整洁的数据时，其他算法和技术仍然有改进空间。此外，每当你必须在机器学习算法之间做出选择时，你实际上是在预测准确率和速度之间进行平衡。本质上说，这归结为这两个因素。每当你选择其中一个，另一个就会被牺牲。随着时间的推移和经验，你将学会如何根据你处理的数据类型以及你需要获得的结果来平衡它们。\n\
    \n现在，让我们来看看另一种算法，即支持向量机。\n\n## 支持向量机\n\n如果你需要一个可以为你处理几乎所有事务的通用算法，那么支持向量机正是你寻找的。线性回归算法只用于回归问题，而支持向量机可以同时处理回归、分类，甚至是离群值检测。这项技术是每位机器学习学习者都需要研究并学习如何实现的基础算法之一。\n\
    \n支持向量机之所以流行，是因为它们强大且不会消耗大量资源。通常，你对准确性的追求越高，数据处理速度就越慢，因为这对你的计算机系统要求越高。然而，支持向量机在不影响预测准确率的情况下，所需的功率要少得多。此外，你还可以使用该算法清理数据集中的大部分噪声，从而减少你在预处理阶段需要执行的步骤（尽管仍然建议执行所有步骤）。\n\
    \n那么，为什么支持向量机如此重要？它们被用在哪里？因为它们的强大和多功能性，它们被应用于多个领域。例如，它们被用于人脸识别软件、文本分类、手写识别，以及医疗行业中的基因分类。该算法还有许多用途，因为它能够以极高的效率分离数据集中的数据点，这使得结果足够准确，以至于可以在复杂的应用程序中使用。\n\
    \n我们将通过一个示例来查看支持向量机是如何实现的，以及它是如何工作的。请记住，你仍然需要利用 `Scikit-learn` 库来缩短实现算法的时间。如你所见，无论你对机器学习、数据科学还是甚至是数据挖掘感兴趣，这个工具都是不可替代的。尽管如此，我们将使用支持向量机来预测钞票的有效性。这意味着涉及到图像分类，而该算法非常适合这个过程。算法的实现将非常简单，因为分类是二元的。我们只需要确定钞票是真是假，即真或假。\n\
    \n注意，我们将有一若干描述钞票的属性。此外，我们需要建立两个维度之间的分离线，以避免任何分类错误。虽然其他分类算法也可以执行相同的过程，但支持向量机有一种独特的方法。这项技术通过计算某些与每个类别都接近的数据点之间的最大距离来确定决策边界。决策边界必须是最优的，因此我们不能随机选择。这些最优数据点被称为\
    \ `support vectors`（支持向量），这也是我们算法命名的由来。请记住，它们是一个数学概念，我们不会深入探讨它们是如何计算的等。在这个阶段，你不需要了解位于相当复杂代数中的核心细节。\n\
    \n现在，让我们来看一个实际示例，展示如何应用我们讨论的所有支持向量机。为了这次演示，你需要使用几个库和包。以下是代码：\n\n```python\nimport\
    \ numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\ndataset\
    \ = pd.read_csv(\"bank_note.csv\")\n\nprint(dataset.shape)\n```\n\n`shape` 函数用于提取有关数据集的一些信息。具体来说，它告诉我们有多少行和多少列。为了这次练习，我们只对前\
    \ 5 行感兴趣（总共超过 1,300 行）。\n\n现在，输入以下行查看结果：\n\n```python\nprint(dataset.head())\n\
    ```\n\nVarianceSkewnessCurtosisEntropyClass\n03.621608.6661-2.8073-0.446990\n\
    14.4545908.1674-2.4586-1.462100\n23.86600-2.63831.92420.106450\n33.456609.5228-4.0112-3.594400\n\
    40.32924-4.45524.5718-0.988800\n\n列代表属性，例如方差、偏度等。现在我们可以开始处理这些信息，以便开始构建我们的训练集和测试集。但，我们需要标签：\n\
    \n```python\nx = dataset.drop('Class', axis=1)\ny = dataset['Class']\n```\n\n\
    第一条命令指示系统将每一列存储到变量中。唯一的例外是类别列，这就是为什么我们使用 `drop` 函数来删除它。我们之所以这样做是因为我们想将其单独存储在另一个变量中，这就是我们第二条命令所做的。现在我们在\
    \ `x` 中拥有数据集属性，在 `y` 中拥有标签。这是第一个处理步骤，将属性与标签分离。\n\n下一阶段涉及数据分离，以创建我们的训练集和测试集。只需使用你之前线性回归使用的函数，即\
    \ `train_test_split`。\n\n接下来，我们将训练支持向量机，但我们需要从 `Scikit-learn` 导入它，否则我们无法使用该算法及其任何组件。来看代码：\n\
    \n```python\nfrom sklearn.svm import SVC\nsvc_classifier = SVC(kernel='linear')\n\
    svc_classifier.fit(x_train, y_train)\n```\n\n现在借助测试数据查看预测结果：\n\n```python\npred_y\
    \ = svc_classifier.predict(x_test)\n```\n\n我们快完成了。现在我们需要做的是查看预测的准确性。在支持向量机的情况下，我们需要应用被称为\
    \ `confusion matrix`（混淆矩阵）的东西，它包含了许多指标。虽然混淆矩阵的名字听起来可能令人混乱，但你应该知道它是一个关于数据处理性能的基本表格。它将列出正例和负例，以及假正例和假负例。这些指标被用于建立最终的准确率结果。所有代码形式如下：\n\
    \n```python\nfrom sklearn.metric import confusion_matrix\nprint(confusion_matrix(y_test,\
    \ pred_y))\n```\n\n结果将如下：\n\n```\n[[1601 0]\n [0 1113]]\n```\n\n准确率：0.99\n\n让我们也查看详细报告：\n\
    \n```python\nfrom sklearn.metrics import classification_report\nprint(classification_report(y_test,\
    \ y_pred))\n```\n\n这些是最终结果：\n\n```\nprecision    recall  f1-score   support\n\n\
    \       0.00      0.99      0.99      161\n       1.00      0.99      0.99   \
    \   114\n\n    avg       0.99      0.99      0.99      275\n```\n"
