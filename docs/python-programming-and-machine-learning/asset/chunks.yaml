    # Chapter 11 Data Science


    ![Image result for data science](Images/image00285.jpeg)


    One of the main reasons that we have spent so much of our time taking a look at
    machine learning and what we are able to do with it along with Python is that
    we want to be able to use this to help us out with data science. Many companies
    are diving into the idea of data science and all that this method is able to do
    for them, and whether your business is looking to expand to a new area or you
    would like to reach more customers or release a new product, data science will
    be able to help you out.


    Now, there are going to be a few different steps that come with data science in
    order to make sure that it is as successful as possible. But overall, it is going
    to consist of many machine learning and Python algorithms that will help us to
    take our prepared data, and organize it in a way that we are able to use later
    on. But there is definitely a lot more that we are able to do with the help of
    data science, and we are going to spend a bit of time exploring that now. In this
    chapter, we are going to look at a few important steps in this process including
    the basics of what data science is all about, how deep learning comes into play,
    and how data preparation can be the tool we need as well.


    ## What is Data Science?


    The first topic that we are going to spend some time on here is all about data
    science. Data science, to keep things simple, is just a very detailed study that
    shows us the flow of information from a large amount of data that a company has
    gathered and collected in the hopes of learning something from. In our modern
    world, there is information no matter which way we turn. Companies are able to
    use this data, and simply by setting up their accounts on social media or using
    other methods, they can collect a lot of data from their customers, and use this
    in many different manners.


    While gathering up all of this different information is important, and may seem
    like the only thing a company needs to do, the problem is going to really show
    up when we try to figure out the steps that we should take with all of that data.
    It doesn’t do us a lot of good to just hold onto that information without an idea
    of what we are able to do with it, or even any ideas on what we will be able to
    find inside of that data. And because there is a lot of data, usually more than
    we realize when we get started, it is hard for us to simply assign a person, or
    even a team, to look through that data, and efficiently and quickly find the patterns
    and insights that are in that set of data.


    Data science is here in order to handle this kind of problem. It is going to step
    in to help us figure out what is found in the information, and even how to store
    the information. And with the help of artificial intelligence and machine learning,
    which we will talk about a bit later, we will find that data science will be able
    to go through the information and find what trends are there, especially the ones
    that are hidden.


    When it comes to data science, we are going to be able to obtain some meaningful
    insights from raw and unstructured data, which is then going to be processed through
    skills that are business, programming, and analytical. Let’s take a look at more
    about what this data science is all about, why it is important, and some of the
    different parts of the data science cycle.


    Right now, each day we are going to see 25 quintillion bytes of data generated
    for companies to use, and it is going to grow at an even faster rate as IoT continues
    to grow this is an extraordinary amount of growth in data, which can be useful
    for a lot of companies to learn about their customers, figure out the best products
    to release next, and work the best with the customer service they would like to
    provide. All of this data is going to come from a variety of sources that will
    include:


    1. Sensors are set up in shopping malls in order to gather up the information
    of the individual shopper.

    2. Posts on the various platforms of social media can send back information to
    the company.

    3. Videos that are found on our phones and digital pictures are taking in more
    data than ever before.

    4. Companies are able to even get some good information when they look at some
    the purchase transactions that come when people shop online.


    Think about how much data this can end producing. No matter where the data comes
    from though, it is going to be known as big data. As we can imagine here, from
    all of the different sources of data, companies are going to be flooded and dealing
    with more data than they really know to handle. And it is impossible for an individual
    to go through and do this work on their own. That is why it is going to be important
    for us to learn the best methods to use in order to handle the data and make it
    work for our needs. When this happens, we are better able to use that data and
    all of the information inside to make some business decisions to lead us on.


    It is at this part where we see the idea of data science showing up more and more
    in the picture. Data science is going to bring together a variety of skills that
    are necessary for success in the world of business, including business domain
    knowledge, statistics, and mathematics. All of these are going to be important
    to our process because they are going to help an organization out in many ways.
    It is likely that we are yet to know all of the ways that these are going to help
    out a business in the future, but some of the ways that companies are able to
    use this data right here and now will include:


    1. Helping the company learn new ways where they can reduce costs each day.

    2. It can help the company figure out the best method to take to get into a new
    market that will be profitable for them.

    3. This can help the company learn about a variety of demographics and how to
    tap into.

    4. It can help the company to take a look at the marketing campaign that they
    sent out there and then figure out if the marketing campaign was actually effective.

    5. It can make it easier for the company to successfully launch a new service
    product.

