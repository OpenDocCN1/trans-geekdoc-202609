    The first aspect of the Python coding language that we need to explore is that
    of comments. There is going to be some point when you are writing out a code where
    you would like to take a break and explain to others and yourself what took place
    in the code. This is going to ensure that anyone who sees the code knows what
    is going on at one point to another. Working with a comment is the way that you
    would showcase this in your project, and can make it easier for others to know
    the name of that part, or why you are doing one thing compared to another.


    When you would like to add in some comments to the code, you are going to have
    a unique character that goes in front of your chosen words. This unique code is
    going to be there to help you tell the computer program that it should skip reading
    those words and move on to the next part of the code instead. The unique character
    that you are going to use for this one is the `#` sign in front of the comments
    you are writing. When the compiler sees this, it is going to know that you don’t
    want that part of the code to execute at all. It will wait until the next line
    before it gets started with rereading the code. An example of a comment that you
    may see in your code would include:


    ```

    #this is a new comment. Please do not execute in the code.

    ```


    After you have written out the comment that you want here, and you are done with
    it, you are then able to hit the return button or enter so that you can write
    more code that the compiler can execute. You can have the freedom to comment as
    long or as short as you would like based on what you would need in the code. And
    you can write in as many of these comments as you would like. It is usually seen
    as a better option if you keep the comments down to what you need. Otherwise,
    it makes the code start to look a little bit messy overall. But you can technically
    add in as many of these comments to your code as you would like.


    ## The Statements


    The next part of the code that we need to focus on is the statements. Any time
    that you are starting with your new code, whether you are working with Python
    or with some other coding language along the way, you must add these statements
    inside of the code. This allows the compiler to know what you would like to happen
    inside. A statement is going to be a unit of code that you would like to send
    to your interpreter. From there, the interpreter is going to look over the statement
    and execute it based on the command that you added in.


    Any time you decide to write out the code, you can choose how many statements
    are needed to get the code to work for you. Sometimes, you need to work with one
    statement in a block of code, and other times, you will want to have more than
    one. As long as you can remember that the statements should be kept in the brackets
    of your code, it is fine to make the statement as long as you would like, and
    include as many statements as you would like.


    When you are ready to write your code and add in at least one statement to your
    code, you would then need to send it over so that the interpreter can handle it
    all. As long as the interpreter can understand the statements that you are trying
    to write out, it is going to execute your command. The results of that statement
    are going to show up on the screen. If you notice that you write out your code
    and something doesn’t seem to show up in it the right way, then you need to go
    back through the code and check whether they are written the right way or not.


    Now, this all may sound like a lot of information, but there is a way to minimize
    the confusion and ensure that it can make more sense to you. Let’s take a look
    at some examples of how this is all going to work for you.


    ```

    x = 56

    Name = John Doe

    z = 10

    print(x)

    print(Name)

    print(z)

    ```


    When you send this over to the interpreter, the results that should show up on
    the screen are:


    ```

    56

    John Doe

    10

    ```


    It is as simple as that. Open up Python, and give it a try to see how easy it
    is to get a few things to show up in your interpreter.


    ## The Variables


    The next things we consider inside our Python codes are the variables. These variables
    are important to learn about because they the part that will store your code in
    the right places so you can pull them up later on. This means that if you do this
    process in the right way, the variables are going to be found inside the right
    spot of the memory in the computer. The data in the code will help determine which
    spots of the memory these points will be stored on, but this makes it easier for
    you to find the information when it is time to run the code.


    The first thing that we need to focus on here is to make sure that the variable
    has a value assigned to it. If there is a variable without a value, then the variable
    won’t have anything to save and store. If the variable is given a good value from
    the start, then it will behave the way you are expecting when you execute the
    program.


    When it comes to your Python code, there are going to be three types of variables
    that you can choose from. They are all important and will have their place to
    work. But you have to choose the right one based on the value that you would like
    to attach to that variable. The main variables that are available for you with
    Python are going to include:


    1. **Float**: This is going to be an integer variable that includes numbers like
    `3.14`

    2. **String**: This is going to be one of those statements that you would write
    out. You can add in any phrase that you would like to this one.

    3. **Whole number**: This is going to be any of the other numbers that you would
    want to use, ones that are not going to contain a decimal.


    When you are trying to work with the variables in your program, you won’t have
    to go through and make a declaration to make sure the memory space is available.
    This is something that Python can do for you automatically, as soon as a value
    is assigned to a variable. If you would like to make sure that this is happening
    in your code and avoid some of the surprises along the way, you need to double
    check that the equal sign, the sign of giving a variable value is in the right
    place. An excellent example of how this is going to look when you write out a
    code includes the following


    ```

    x = 12#this is an example of an integer assignment

    pi = 3.14#this is an example of a floating point assignment

    customer name = John Doe #this is an example of a string assignment

    ```


    In some instances, you may need to have one variable with two or more values attached
    to it. There are certain times when you won’t be able to avoid this and need to
    make it happen. The good news is that you can work with the same procedure discussed
    above to make this happen, you need to make sure that there is an equal sign to
    each part so that the compiler knows how to assign everything. So, when you want
    to do this, you would want to write out something like `a = b = c = 1`.


    ## The Keywords


    Any time that you are using the Python language, like what we find in other coding
    languages as well, you are going to come across some words that are reserved as
    commands in the code, and these are going to be known as keywords. You need to
    be careful about the way you use these because they are there to tell the program
    some commands, and how you would like it to behave. You don’t want to bring these
    and use them in any other place outside of a particular command.


    If you do misuse these keywords, it is going to cause some confusion inside the
    code. The interpreter isn’t going to know what to do, and the computer may get
    stalled in what it needs to do. As we go through this guidebook some more and
    develop a few Python codes for machine learning, we will start to recognize some
    of the most common keywords that you need to watch out for.


