  trans: "\n\n从程序员的视角来看，静默失败是指 `parser`、`runtime development environment` 或 `compiler`\
    \ 未能产生错误或异常，而是继续运行程序的状态。这通常会导致意料之外的结果。\n\n当程序员忽略异常或跳过异常时，也可能诱发静默失败。或者，他可能会公然地掩盖掉这些异常，并创建变通方案，以便在发生错误时程序也能按预期方式运行。他这样做可能是出于多种原因，例如该错误不会导致程序崩溃，或者用户不需要知道该错误。\n\
    \n# 处理文件未找到异常错误\n\n你有时会遇到 `FileNotFoundError`。处理此类错误取决于你打开该文件的意图或目的。以下是导致你遇到此错误的常见原因：\n\
    \n*   你没有以字符串的形式传递目录和文件名。\n*   你拼写错误了目录和文件名。\n*   你没有指定目录。\n*   你没有包含正确的文件扩展名。\n\
    *   文件不存在。\n\n处理 `FileNotFoundError` 异常的第一种方法是确保所有常见原因都不会导致该错误的发生。一旦做到了这一点，你就需要选择处理错误的最佳方式，这完全取决于你最初打开文件的原因。\n\
    \n## 检查文件是否存在\n\n同样，处理异常始终有两种方法：预防性和反应性。预防性方法是先检查文件是否存在。\n\n要做到这一点，你需要使用 Python\
    \ 安装时自带的 `os` (`os.py`) 模块。然后，你可以使用它中 `path` 模块的 `isfile()` 函数。`path` 模块的文件名取决于操作系统（UNIX\
    \ 使用 `posixpath`，Windows 使用 `ntpath`，旧版 MacOS 使用 `macpath`）。例如：\n\n```python\n\
    from os import path\n\npath.isfile(\"random.txt\")\nFalse\n\npath.isfile(\"sampleFile.txt\"\
    )\nTrue\n```\n\n### Try and Except\n\n你也可以通过 `try`、`except` 和 `else` 块用这种比较麻烦的方法来实现。\n\
    \n```python\ndef openFile(filename):\n    try:\n        x = open(filename, \"\
    r\")\n    except FileNotFoundError:\n        print(\"The file '\" + filename +\
    \ \"' does not exist.\")\n    except FileNotFound:\n        print(\"The file '\"\
    \ + filename + \"' does exist.\")\n\nopenFile(\"random.txt\")\nThe file 'random.txt'\
    \ does not exist.\n\nopenFile(\"sampleFile.txt\")\nThe file 'sampleFile.txt' does\
    \ exist.\n```\n\n## 创建新文件\n\n如果文件不存在，且你的目标是要覆盖任何现有文件，那么使用 `\"w\"` 或 `\"w+\"` 访问模式对你来说是。访问模式会创建一个新文件。例如：\n\
    \n```python\nx = open(\"new.txt\", \"w\")\nx.tell()\n```\n\n```python\nx = open(\"\
    new.txt\", \"w+\")\n```\n\n"
