    Decision trees, just like support vector machines, are incredibly versatile because
    they can perform both regression and classification operations. This means they
    are extremely useful when working with large datasets and you should get acquainted
    with them. Furthermore, decision trees form the basis of another type of machine
    learning algorithm known as an ensemble method, particularly the one known as
    a random forest. It’s all fairly logical. If you have a lot of decision trees
    they form a forest, right?


    As the name suggests, decision trees are used to model decisions, including the
    determination of any kind of consequences and system resources needed for the
    entire process. In addition, everything is presented visually in a graph. In other
    words, as a result you will have a flowchart that contains every test you perform.
    For instance, let’s say you flip a coin a certain number of times. Every time
    the results will be recorded and you will have a number of tree branches that
    represent them, together with the leaves that represent class labels.


    This supervised machine learning algorithm is considered to be one of the most
    powerful ones because it offers accurate results without sacrificing too much
    efficiency or requiring too many resources from your system. Furthermore, the
    graph system allows you to easily interpret the data and therefore make adjustments
    as needed instead of going through another tedious process that would achieve
    the same thing but with a lot more work. With that being said, let’s discuss all
    the other advantages provided by decision trees:


    1. **User-friendly**: Unlike many other algorithms or techniques, decision trees
    are logical even to those without significant machine learning or mathematical
    knowledge and experiences. You don’t need to be a data scientist to start working
    with them. They follow a simple, programming-like structure, similar to Python’s
    conditional operations. A decision tree follows the “if this, then do that, else
    do this” logic. Furthermore, the results are clear and do not require even a fundamental
    knowledge of statistics in order to interpret them. That is the benefit of having
    an inbuilt graph that clearly explains the data you are analyzing.


    2. **Clean data**: Clean data yields accurate results. Therefore, no matter which
    algorithm you use you always have to eliminate as much noise and as many outliers
    as you can by using certain methods and techniques. However, the benefit of using
    decision trees is that they are barely affected by these factors. Outliers and
    noise will only be a minor inconvenience and you will often be able to ignore
    them completely and still achieve an accurate result.


    3. **Versatile**: As you already know, certain machine learning algorithms are
    designed to work only with certain data types. Some of them can only be applied
    to categorical data, while others are specifically used on numerical data. Often
    for this reason they need to be combined when working with complex datasets that
    contain both types of information. However, decision trees can handle the training
    process for both data type, therefore significantly reducing your workload.


    4. **Exploring data**: Data exploration is a valuable step that can be time consuming
    because you need to identify the most valuable data points and then establish
    a connection between them. Decision trees, however, excel at exploratory analysis
    and you will spend a lot less time performing this step. In addition, you will
    be able to create new features a lot more efficiently in order to boost the accuracy
    of the predictions even further. Exploring data can be exhausting because in the
    real world you will often deal with thousands of variables and finding the most
    important ones can be difficult without the appropriate tool.


    Now that you have an idea about decision trees and why they are a preferred algorithm
    amongst machine learners, you should also learn which disadvantages they bring.
    Keep in mind there is no such thing as the perfect algorithm, so let’s see what
    kind of difficulties you will be facing when working with decision trees:


    1. **Overfitting**: This is probably the biggest problem you will face. Decision
    trees tend to exaggerate and build overly complex decision trees that can’t perform
    accurately on general data. However, the issue of overfitting isn’t only found
    in this case. Many algorithms have to deal with it. The easiest solution you can
    deploy to limit the risk of overfitting is the application of parameter limitations.


    2. **Categorization**: When your data set has a large number of continuous numerical
    variables, decision trees will encounter difficulty when it comes to categorizing
    them. Information is often lost during this process. Take note that continuous
    variables are considered to be anything with a value that is specifically defined
    between a certain minimum and maximum. For instance, let’s say that we have some
    data which specifies that only people between 21 and 45 can join the military.
    The `age` variable is considered to be continuous because we have set limits.


    3. **Picky algorithms**: The algorithm doesn’t always choose the most accurate
    and efficient decision tree from which you draw your conclusion. This is simply
    the nature of the technique. However, the solution is simple. All you need to
    do is train multiple trees in order to sample a larger number of features randomly
    and find the most accurate solution.


    You learned earlier in this section that decision trees are used to perform regression
    tasks, as well as classification tasks. However, this doesn’t mean that you use
    the identical method for both tasks. You need to split the decision trees into
    two different categories, namely the regression trees and classification trees.
    The basics are still the same for both categories, however, there are a number
    of differences you should be aware of:


    1. **Regression trees** are specifically applied for tasks that involve continuous
    dependent variables. At the same time classification trees are needed when dealing
    with categorical dependent variables.


    2. The values that we extract as the result from the training data are determined
    differently for each category of decision trees. In the case of classification
    trees the value is calculated as the mode value of the total observation. This
    means that if we have an unknown data observation, we can predict with the help
    of the mode value. Keep in mind that mode values are the values that we find the
    most frequently in a given set of values. On the other hand, regression trees
    extract the value from the training data in the form of the mean of the total
    observations. This mean value is then used to calculate any missing data observations.


    3. Regression and classification trees rely on binary splitting. This concept
    involves going from the top of the tree to the bottom. This means that when we
    have observations in one region of the tree, there are a number of branches below
    it that are divided. The division happens within the predictor space. This concept
    is also often referred to as greedy because the algorithm seeks the variable that
    is needed for the current split that is being analyzed. The operation does not
    take any future splits in consideration and that is why sometimes we don’t have
    the most accurate results. This issue needs to be taken into consideration in
    order to counteract its effects with various methods and create a better decision
    tree.

