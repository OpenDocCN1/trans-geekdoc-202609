    # Python 编程与机器学习


    面向初者的学习 Python 以及掌握 ML+ 工具与技巧的终极指南。


    **JOHN S. CODE**


    © Copyright 2019 - 版权所有。


    未经作者或出版者的直接书面许可，本书中所包含的内容不得复制、复隆或传输。


    在任何情况下，对于因书中包含的信息而导致的任何损害、赔偿或金损失，出版者或作者均不承担任何责任或法律责任。无论是直接还是间接。


    ## 法律声明

    本书受版权保护。本书仅供个人使用。未经作者或出版者的同意，您无权修改、分发、销售、使用、引用或转述本书的任何部分或内容。


    ## 免责声明

    请注意，本文档中包含的信息仅供教育和娱乐目的。我们已尽一切努力提供准确、最新、可靠且完整的信息。不声明亦不暗示任何形式的保证。读者承认，作者并未在提供法律、财务、医疗或专业建议。书中的内容源自多种来源。在尝试书中概述的任何技术之前，请咨询执业的专业人士。


    通过阅读本文，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失均不负责，包括但不限于——错误、遗漏或不准确。


    ## 目录

    1. 初学者 Python 编程： 一本面向学者快速学习 Python 编程、编码语言、使用工具和技巧进行数据分析的实用上手指南。John S. Code。

    2. Python 机器学习： 理解神经网络、人工智能、深度学习以及通过 Python 掌握机器学习基础的绝对初学者级指南。John S. Code。


    * 引言

    * 第 1 章 数学概念

    * 第 2 章 什么是 Python

    * 第 3 章 编写第一个 Python 程序

    * 第 4 章 Python 运算符

    * 第 5 章 Python 中的基本数据类型

    * 第 6 章 使用 Python 进行数据分析

    * 第 7 章 条件语句

    * 第 8 章 循环——永不停歇的循环

    * 第 9 章 文件处理

    * 第 10 章 异常处理

    * 第 11 章 成功的技巧与窍

    * 结论


    ## 引言

    出于几个原因，Python 是机器学习领域一个极佳的决策。最重要的一点是，它看起来是一门基础语言。无论你是否熟悉 Python，只要你曾用过某种具有类 C
    语法的其他语言，就能快速上手。


    其次，Python 拥有极其强大的网络，这带来了卓越的文档以及 Stack Overflow（核心地纽）上友好且详尽的解答。


    第三，得益于庞大的网络，Python 有许多非常有价值的库（既有“内置”的外部的），它们可以处理你可能遇到的几乎任何问题（包括机器学习）。


    ### Python 历史

    Python 诞生于 20 世纪 80 年后期。创始人 Guido van Rossum 于 1989 年 12 月开始使用这种语言。他是 Python 已知的唯一创建者，他在该语言增长和发展中不可或缺的角色让他赢得了“终身仁独裁者”的称号。它的创建是为了作为
    `ABC` 语言的继任者。


    下一个发布的版本是 Python `2.0`，于 2000 年 10 月发布，它具有重大的升级和新特性，包括垃圾回收的循环区分以及对 Unicode 的支持。幸运的是，这个特定版本对语言所做的巨大改进程序变得更加简单且得到了网络社区的支持。


    Python `3.0` 最初作为 `Py3K` 存在。该版本在经过严格测试期后，于 2008 年 12 月发布。这个版本很难回滚到之前的版本，这是最令人遗憾的。然而，它的许多核心特性已回退到
    `2.6` 或 `2.7` (Python) 版本，并且 Python `3` 的发布利用了两个到三个工具，有助于自动化对 Python 脚本的解释。


    Python `2.7` 的过期日期原定于 2015 年，但由于未知原因，它被推迟到了 2020 年。众所周知，人们非常担心数据无法回滚而是“向前”迁移到新版本
    Python `3`。2017 年，Google 宣布将对 Python `2.7` 进行工作，以提高在并发任务下的执行效率。


    ### Python 的基本特性

    Python 是一门独特且极其强大的编程语言，基于面向对象，与 `Ruby`、`Perl` 和 `Java` 非常相似。Python 的一些显著特性：


    *   `Python` 使用丰富的结构、影响和项目组合，使得分析变得更加简单。

    *   它附带了一个巨大的标准库，支持许多简单的编程命令，例如无缝的网络服务器连接、文件的处理和操作，以及使用常用的表达式和命令搜索文本。

    *   `Python` 易于使用的交互界面使得测试短代码变得简单。它还附带了 `IDLE`，这是一个“开发环境”。


