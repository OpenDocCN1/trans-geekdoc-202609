- raw: "This paradigm happens to be the most popular, probably because it is easy\
    \ to comprehend and execute. Here, the algorithm creates a mathematical concept\
    \ from a labeled dataset, i.e a dataset containing both the input and output parameters.\
    \ This dataset acts as a trainer to the model. Taking an example, we may decide\
    \ to use the algorithm to determine whether a particular image contains a certain\
    \ object. In this case, the dataset would comprise images with and without the\
    \ input (that object), with every image having the output designating whether\
    \ or not it contains the particular object. The algorithm is likely to predict\
    \ any answer; whether right or wrong. However, after several attempts it gets\
    \ trained on picking only the images containing the said object. Once it gets\
    \ totally trained, the algorithm starts making right predictions even when new\
    \ data is input. A perfect example of a supervised learning model is a support\
    \ vector machine. On the diagram below, the support vector machine divides data\
    \ into sections separated by a linear boundary. You realize the boundary separates\
    \ the white circles from the black.  \n\n![C:\\\\Users\\\\USER\\\\Desktop\\\\\
    support vector machine.png](Images/image00276.jpeg) \n\nTypes of Supervised Learning\
    \  \n\nClassification: These algorithms are used in instances where the outputs\
    \ are limited to discrete values. In the case of filtering emails for example,\
    \ an incoming mail would be classified as the input, whereas the output would\
    \ be the folder name.  \n\nRegression: This is the algorithm under which the output\
    \ has a continuous value, which means they many pick on any value within a given\
    \ range. Perfect examples include; temperature, wind speed, price of a commodity\
    \ etc.  \n\n![C:\\\\Users\\\\USER\\\\Downloads\\\\IMG\\_20190916\\_141540.jpg](Images/image00277.jpeg)\
    \ \n\nSupervised machine learning is exhibited in many common applications, some\
    \ of which we have discussed below. \n\n       Advertisement Status: Most of\
    \ the ads that you encounter when browsing the internet are positioned there because\
    \ a supervised learning algorithm vouched for their clickability and popularity. \
    \ \n\n       Face Recognition: This one is quite common on Facebook. It is very\
    \ likely that your face has been used in a supervised algorithm that is trained\
    \ to recognize it. When Facebook is suggesting a tag you must have noted that\
    \ the system guesses the persons on the photo, which is a supervised process. \
    \ \n\n       Spam Classification: The spam filter that you find on your modern\
    \ email system is a supervised learning concept. Apart from preemptively filtering\
    \ spiteful emails, the system also allows the user to provide new labels and express\
    \ their preference. See the illustration on the figure below. \n\n![C:\\\\Users\\\
    \\USER\\\\Desktop\\\\spam classification.jpg](Images/image00278.jpeg) \n\n2. \
    \ Unsupervised Learning \n\nAs the name suggests, unsupervised machine learning\
    \ is the exact opposite of supervised learning. The model finds structures in\
    \ the data and also learns through observation. When given a dataset, the model\
    \ automatically finds relationships and patterns by creating clusters in the dataset.\
    \ The paradigm cannot add labels to the created cluster, but it does the creation\
    \ perfectly. This means that if we have a set of apples and oranges, the model\
    \ will separate the apples from the oranges, but will not say that this is a set\
    \ of oranges or apples.  \n\nNow, suppose we had more than two sets, say we present\
    \ images of grapes, oranges, and apples. As explained above, the model, based\
    \ on some relationships and patterns, will create clusters and separate the datasets\
    \ into those clusters. Whenever new data is input, the model adds it to one of\
    \ the already built clusters as shown in the figure below. You realize the output\
    \ is grouped perfectly even without addition of labels.  \n\n![C:\\\\Users\\\\\
    USER\\\\Downloads\\\\IMG\\_20190916\\_094317.jpg](Images/image00279.jpeg) \n\n\
    Let us take another classical example for better understanding. Think of a little\
    \ baby and his family dog. He very well identifies its features. When a family\
    \ friend brings along another dog to try play with the baby, the baby will identify\
    \ that as a dog even without anyone telling them. They will easily classify it\
    \ because it has the features like two eyes, ears, walks on four, among other\
    \ details. This falls under unsupervised learning because you classify the input\
    \ data without being taught. If it were supervised learning, the family friend\
    \ would have to tell the baby that it’s a dog. \n\nTypes of Unsupervised Learning\
    \  \n\nClustering: This concept identifies a pattern in an assortment of unclassified\
    \ data. Clustering algorithms categorize any existing natural groups in the data.\
    \ The user is also at liberty to adjust the number of cluster they want their\
    \ algorithms to identify. Under clustering there are more types that you can utilize;\
    \ \n\n       Exclusive (partitioning) \n\nUnder this type, classification of\
    \ data is done such that one data can only belong to a single only. K-means serves\
    \ as a perfect example.  \n\n       Agglomerative \n\nThis is the technique where\
    \ every data is in itself a group. The number of clusters is reduced by the iterative\
    \ mergers between the two closest groups. An example is the hierarchical clustering. \
    \ \n\n       Overlapping \n\nUnder this technique, data is associated with a\
    \ suitable association value. Fuzzy sets are used in grouping data and each point\
    \ could fit into two or more groups with different membership degrees. Fuzzy C-Means\
    \ is a suitable example under this type.  \n\n       Probabilistic \n\nThis concept\
    \ creates clusters using probability distribution. See the example below given\
    \ some keywords; \n\n*   “Men’s pants” \n\n*   “Ladies’ pants” \n\n*   “Men’s\
    \ wallets” \n\n*   “Ladies’ wallets” \n\nThe given keywords could be grouped into\
    \ two; “pants” and “wallets” or “Men” and “Ladies”.  \n\nAssociation  \n\nThe\
    \ rules under association allow the user to institute associations in the midst\
    \ of data objects inside big databases. As the name suggests, the technique seeks\
    \ to discover unique relations between variables contained in large databases.\
    \ For instance, shoppers could be grouped based on their search and purchase histories.\
    \ \n\nApplications of Unsupervised Machine Learning \n\nUnsupervised ML is based\
    \ on data and its attributes, and Therefore, we can conclude that it is data-driven.\
    \ The results from a task are controlled by the nature in which the data is formatted.\
    \ Some of the common areas that rely on unsupervised learning include but are\
    \ not limited to; \n\n       Buying Habits: It is not surprising to find your\
    \ purchasing habits stored in a database somewhere. The information could be used\
    \ by marketers to group clients into similar shopping segments so that they can\
    \ reach out to them easily. The clustering is easy to do under unsupervised learning\
    \ algorithms.  \n\n       Recommender Systems: If you are a Netflix or YouTube\
    \ user you might have encountered a video recommendation severally. Often times\
    \ these systems are contained in the unsupervised domain. The system knows the\
    \ watch history of its users. The model uses the history to identify relationships\
    \ between users who enjoy watching videos of certain genres, length, etc, and\
    \ prompt them with a suggestion of related videos that they may not have watched. \
    \ \n\n       Identification of Fraudulent transactions: Anomaly detection is\
    \ the technique used in discovery of abnormal data points. The algorithm picks\
    \ out any unusual points within the data set, hence sending an alarm.  \n\nSupervised\
    \ Vs. Unsupervised ML Techniques  \n\nData specialists employ an array of machine\
    \ algorithms in their discovery operations. Below are some insights on the classification\
    \ of supervised and unsupervised learning techniques, which will help you to judge\
    \ when to use either of the techniques. \n\n| Parameters  || Supervised machine\
    \ learning  || Unsupervised machine learning   |\n\n| --- | --- | --- |"
