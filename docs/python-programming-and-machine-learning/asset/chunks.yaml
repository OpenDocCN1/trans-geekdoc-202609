    4. Any other kinds of sets of data that are statistical and observational.\n\n\
    Working with the `Pandas` library is one of the best ways to handle some of the\
    \ `Python` codings that you want to do with the help of data analysis. As a company,\
    \ it is so important to be able to go through and not just collect data, but also\
    \ to be able to read through that information and learn some of the trends and\
    \ the information that is available there. being able to do this can provide your\
    \ company with some of the insights that it needs to do better, and really grow\
    \ while providing customer service.\n\nThere are a lot of different methods that\
    \ you can use when it comes to performing data analysis. And some of them are\
    \ going to work in a different way than we may see with `Python` or with the `Pandas`\
    \ library. But when it comes to efficiently and quickly working through a lot\
    \ of data, and having a multitude of algorithms and more that can sort through\
    \ all of this information, working with the `Python Pandas` is the best option.\n\
    \n# Conditional Statements\n\n## If Statements \n\nMore often than not, you’re\
    \ faced with a situation where you have to decide something and then, a few things\
    \ happen in response to your decision.\n\nSimilarly, programming languages also\
    \ allow you to write conditional tests, with which, you can check a condition\
    \ and make responses according to it. Let’s take a real-life example, and then\
    \ code it. If the stove is on, then close it. If it is not on, then do nothing.\n\
    \nIf you take a look, we use the keyword `if` when we’re trying to put forth a\
    \ condition. If this, then that. Likewise, `Python` uses the `if` statement to\
    \ allow you to make a decision based on something. That ‘something’ in our example\
    \ was, whether or not the stove was on. Let’s code it.\n\n1. `# Whether or not\
    \ the stove is on.`\n2. `stoveOn = True`\n3. `# Is the stove on?`\n4. `if stoveOn\
    \ == True:`\n5. `print(\"The stove is on! Close it.\")`\n\nFirstly, we declared\
    \ our variable `stoveOn` and said, yes, the stove is on. Now, using the `if` statement,\
    \ we see, if the value of our variable when compared to the Boolean value, `True`,\
    \ yields a `True`, i.e. the stove is actually on and both of their values are\
    \ the same.\n\nNow to the syntactical part. Using `if` statement is simple. You\
    \ can either write your condition after the `if` keyword or you could wrap it\
    \ in a pair of parentheses. Like this:\n\n```python\nif(stoveOn == True):\n```\n\
    \nYou can put in as many conditions as you want and use logical operators (`and`,\
    \ `or`) to separate them and make a decision based on their values. Thirdly, after\
    \ the condition, we use the `:` symbol to continue. Next, we tell what should\
    \ our program do, if, the result of our conditional test is `True`. If not, it\
    \ will completely ignore the code which follows this test. But, is it going to\
    \ be the first following line only? Let’s see.\n\nSince in our case, it is `True`,\
    \ we simply print a statement to close it right away. But, here’s something odd.\
    \ Do you see an indentation on the next line?\n\nThis indentation is how we recognize\
    \ the part of the code which follows our `if` statement. In this case, there’s\
    \ only one statement. But, here’s an example with multiple lines of code and quite\
    \ a few conditions to test:\n\n```python\n# Whether or not the stove is on.\n\
    stoveOn = True\nlightsOn = False\n# Is the light on? Just check the stove.\nif(lightsOn\
    \ == True):\n    if(stoveOn == True):\n        print(\"The lights are on, just\
    \ close the stove.\")\n# Is the light off? Open it, then, check the stove.\nif(lightsOn\
    \ == False):\n    print(\"First, open the lights!\")\n    if(stoveOn == True):\n\
    \        print(\"Close the stove!\")\n```\n\nNow, we test a few conditions and\
    \ then make our decision. We added another variable which helps us make a decision.\n\
    \nFirstly, check if the lights are on. If their values are correct, I indented\
    \ the code in the next line, which means, lines 7-8 are to be executed only if\
    \ the statement on line 6 is `True`.\n\nIf not, all that code is neglected. If,\
    \ however, line 6 yields a `True` but line 7 returns a `False`. You see, I indented\
    \ the code on line 8 again. Which means, this is now, a part of the `if` statement\
    \ on line 7 and will not be executed.\n\nSo, the indentation in `Python` is important\
    \ and must be well taken of. If you don’t indent your code properly, either your\
    \ conditions won’t output a result, or you will get an error.\n\n## If-else Statements\
    \ \n\nNow, what was our example again? Here’s that sentence. If the stove is on,\
    \ then close it. If it is not on, then do nothing.\n\nYou see, we catered the\
    \ part where it says, if the stove is on, do this. But, what about the part where\
    \ it isn’t? Let’s take a look at this code. We expand on our first example.\n\n\
    ```python\n# Whether or not the stove is on.\nstoveOn = False\n# Is the stove\
    \ on?\nif stoveOn == True:\n    print(\"The stove is on! Close it.\")\nelse:\n\
    \    print(\"The stove is off!\")\n```\n\nNow, we put a `False` in our variable\
    \ and continued our tests. If the stove is on (`True` output from the `if` condition),\
    \ just print that it is on. If it is not, we use the `else` clause, to say, do\
    \ this instead.\n\nLike our real-life situations. Do this, else do that. So, what\
    \ happens here? When the result from the `if` statement on line 5 is `False`,\
    \ it neglects all indented code (which was to follow if if statement was `True`)\
    \ and executes the `else` clause.\n\nNow, logically, it states, If the `stoveOn`\
    \ is `False`, do this. And, we simply print, that the stove is already off!\n\n\
    ![00041.gif](Images/image00256.gif)\n\n## if-elif-else Statements \n\nUsually,\
    \ when asked to write multiple conditions, you might write them in a similar fashion:\
    \ If this, then do this. Else if this, then do that. Else (none of these), do\
    \ something completely different.\n"
  trans: "\n\n有许多不同的特征使 `Pandas` 与其他一些库脱颖而出。你将享受到的一些益处包括：\n\n1. 与你可以使用的其他数据结构相比，这里的一些数据帧或数据结构是高级的。\n\
    2. 将有一套精简流程来处理表格数据，而且对于你想要处理的时间序列，还有非常丰富的功能。\n3. 将获得数据对齐、缺失值友型统计、`merge`、`join`\
    \ 和 `groupby` 方法等优势，这些可以帮助你处理所拥有的数据。\n4. 你可以在 `Pandas` 中使用各种数据结构，并能够自由调用 `SciPy`\
    \ 和 `NumPy` 中存在的函数，以确保操作和其他工作能够以你想要的方式进行。\n\n在继续之前，我们还需要很好地了解 `Pandas` 中某些数据类型是什么。`Pandas`\
    \ 非常适合处理大量数据，并能够帮助你筛选几乎你喜欢的任何类型的数据。最适合用 `Python` 的 `Pandas` 库处理的数据类型包括：\n\n1.\
    \ 任何具有异构类型列的表格化数据。\n2. 具有行列标签的任意矩阵数据。\n3. 无序和有序的时间序列数据。\n4. 其他任何类型的统计和观察性数据集。\n\
    \n使用 `Pandas` 库是通过数据分析完成你想要做的某些 `Python` 代码的最佳方式之一。对于一家公司来说，不仅能够收集数据，能够阅读这些信息并学习其中包含的趋势和信息也是至关重要的。做到这一点可以为公司提供变得所需的见解，并在提供客户服务的同时实现真正的增长。\n\
    \n在执行数据分析时，你可以使用许多不同的方法。其中一些方法的工作方式可能与我们在 `Python` 或 `Pandas` 库中看到的不同。但在高效、快速地处理大量数据，并拥有大量算法及更多功能来筛选所有信息时，使用\
    \ `Python Pandas` 是最佳选择。\n\n# 条件语句\n\n## If 语句\n\n通常情况下，你面临面临必须做出某种决定的情况，然后会根据你的决定发生一些事情。\n\
    \n同样，编程语言也允许你编写条件测试，通过测试，你可以检查一个条件并根据其做出响应。让我们来看一个生活中的例子，然后对其进行编码。如果炉子开着，就关掉它。如果没有开，就什么都不做。\n\
    \n如果你看，当我们尝试提出一个条件时，我们使用关键字 `if`。如果这样，那么那样。同样，`Python` 使用 `if` 语句允许你根据某些情况做出决定。在我们例子中，那个“某些情况”就是炉子是否开启。让我们来编写代码。\n\
    \n1. `# 炉子是否开着。`\n2. `stoveOn = True`\n3. `# 炉子开了吗？`\n4. `if stoveOn == True:`\n\
    5. `print(\"The stove is on! Close it.\")`\n\n首先，我们声明了变量 `stoveOn` 并说，是的，炉子开着。现在，使用\
    \ `if` 语句可以看到，如果我们的变量值与布尔值 `True` 比较时产生 `True` ，即炉子确实开着，且两者的值相同。\n\n现在来看语法部分。使用\
    \ `if` 语句非常简单。你可以在 `if` 关键字后编写你的条件，也可以将其封装在一对括号中。如下：\n\n```python\nif(stoveOn\
    \ == True):\n```\n\n你可以放入任意数量的条件，并使用逻辑运算符（`and`、`or`）将它们分开，并根据它们的值做出决定。第三，在条件之后，我们使用\
    \ `:` 符号继续。接下来，我们告诉程序，如果我们的条件测试结果为 `True`，程序应该做什么。如果不是，它将完全忽略跟随该测试的代码。但是，它只会忽略随后的第一行吗？让我们看看。\n\
    \n由于在我们的案例中，它是 `True`，我们只需打印一条语句立即将其关掉。但是，这里有一个奇怪的地方。你看到下一行有缩进吗？\n\n这种缩进是我们如何识别跟随我们\
    \ `if` 语句的代码部分的标识。在这种情况下，只有一个语句。但这里有一个包含多行代码和相当多个待测试条件的示例：\n\n```python\n# 炉子是否开着。\n\
    stoveOn = True\nlightsOn = False\n# 灯开着吗？只检查炉子。\nif(lightsOn == True):\n    if(stoveOn\
    \ == True):\n        print(\"The lights are on, just close the stove.\")\n# 灯关着吗？打开它（灯），然后检查炉子。\n\
    if(lightsOn == False):\n    print(\"First, open the lights!\")\n    if(stoveOn\
    \ == True):\n        print(\"Close the stove!\")\n```\n\n现在，我们测试几个条件然后做出决定。我们添加了另一个变量来帮助我们做决定。\n\
    \n首先，检查灯是否开着。如果它们的值是正确的，我缩进了下一行的代码，这意味着第 7-8 行仅在第 6 行的语句为 `True` 时才会执行。\n\n如果不是，所有这些代码都会被忽略。然而，如果第\
    \ 6 行产生了 `True` 但第 7 行返回了 `False`。你看，我再次对第 8 行的代码进行了缩进。这意味着，现在它是第 7 行 `if` 语句的一部分，将不会被执行。\n\
    \n所以，缩进在 `Python` 中是重要的，必须处理好。如果你不正确缩进代码，你的条件将不会输出结果，或者会报错。\n\n## If-else 语句\n\
    \n现在，我们的例子是什么？这里是那个句子。如果炉子开着，就关掉它。如果没有开，就什么都不做。\n\n你看到，我们考虑了这种部分，即如果炉子开着，这样做。但是，没开的情况呢？让我们看看这段代码。我们扩展了第一个例子。\n\
    \n```python\n# 炉子是否开着。\nstoveOn = False\n# 炉子开了吗？\nif stoveOn == True:\n    print(\"\
    The stove is on! Close it.\")\nelse:\n    print(\"The stove is off!\")\n```\n\n\
    现在，我们在变量中放入了 `False` 并继续我们的测试。如果炉子开着（`if` 条件输出为 `True`），就打印它开着。如果没有开，我们使用 `else`\
    \ 子句来说，否则这样做。\n\n就像我们生活中的情况一样。这样做，否则做那样。所以，这里发生了什么？当第 5 行 `if` 语句的结果为 `False`\
    \ 时，它忽略所有缩进的代码（即在 if 语句为 `True` 时要执行的代码），并执行 `else` 子句。\n\n现在，逻辑上，它是说，如果 `stoveOn`\
    \ 为 `False`，这样做。并且，我们只需打印炉子已经关了！\n\n![00041.gif](img/image00256.gif)\n\n## if-elif-else\
    \ 语句\n\n通常在编写多个条件时，可能会以类似的方式编写它们：如果这样，就这样做。否则如果那样，就做那样。否则（如果都不是），做一件完全不同的事情。\n\
    \n"
