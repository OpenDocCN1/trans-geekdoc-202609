    things it has seen in the past, to help it perform even better in the future.
    There are a lot of examples of how this can work, such as voice recognition devices,
    and even with search engines.


    As we go through this guidebook, you will find that there are a lot of different
    methods and algorithms that you can use with machine learning in order to get
    the machine to learn, but the one you choose really depends on the kind of results
    you want to get and the project that you decide to work with.

