    But, outliers can also indicate a system malfunction. It is always better to investigate
    the outliers instead of discarding them straightaway.


    ## Average


    Finding the center of a data sample is crucial in statistical analysis because
    it reveals a lot of system characteristics. There are different types of averages,
    each signifying something important.


    ### Mean


    Mean is the most common average. All the data values are added and divided by
    the number of data values added together. For example, you sell shopping bags
    to a well-renowned grocery store and they want to know how much each shopping
    bag can carry. You completely fill 5 shopping bags with random grocery items and
    weigh them. Here are the readings in pounds.


    `5.5, 6.0, 4.95, 7.1, 5.0`


    You calculate the mean as `(5.5 + 6 + 4.95 + 7.1 + 5) / 5 = 5.71`. You can tell
    the grocery store your grocery bags hold `5.71 lbs` on average.


    ### Median

    Median is the center value with respect to the position of data in a sample data
    when it’s sorted in ascending order. If sample data has odd members, the median
    is the value with an equal number of values on both flanks. If sample data has
    an even number of values, the median is calculated by finding the mean of two
    values in the middle with equal number of items on both sides.


    ### Mode

    Mode is the most recurring value in a dataset. If there is no recurring value
    in the sample data, there is no mode.


    ### Variance

    To find how much each data value in a sample data changes with respect to the
    average of the sample data, we calculate the variance. Here is a general formula
    to calculate variance.


    `sum of (each data point - mean of sample points )2 / number of data points in
    the sample.`


    If the variance is low in a sample data, it means there are no outliers in the
    data.


    ### Standard Deviation

    We take the square root of variance to find standard deviation. This relates the
    mean of sample data to the whole of sample data.


    ### Probability

    No one can accurately tell what will happen in the future. We can only predict
    what is going to happen with some degree of certainty. The probability of an event
    is written mathematically as,


    `Probability = number of possible ways an event can happen / total number of possibilities`


    A few points:

    1. Probability can never be negative.

    2. Probability ranges between one and zero.

    3. To calculate probability, we assume that the set of events we are working with
    occur independently without any interference.


    Finding the probability of an event can change the probability of something happening
    in a subsequent event. It depends upon how we are interacting with the system
    to find event probabilities.


    ### Distribution

    There are many types of distributions. In this book, whenever we talk about distribution,
    we refer to probability distribution unless explicitly stated otherwise. Let’s
    take an example of flipping coins and see what is the distribution of such events.


    `H H H`

    `H H T`

    `H T H`

    `T T T`

    `T H H`

    `H T T`

    `T H T`

    `T T H`


    This is a very simple event with only a handful of possible outcomes. We can easily
    determine the probability of different outcomes. But, this is almost impossible
    in complex systems with thousands or millions of possible outcomes. Distributions
    work much better in such cases by visually representing the probability curve.
    It makes more sense than looking at a huge table of fractions or small decimal
    numbers.


    We call a probability distribution discrete if we know all the possible outcomes
    beforehand.


    ## What Is Python


    Python is going to be a programming language that is known as interpreted, general-purpose,
    high-level, and multiparadigm. Python is going to allow the programmers who use
    it some different styles of programming in order to create simple or even some
    complex programs, get quicker results than before, and write out code almost as
    if they are speaking in a human language, rather than like they are talking to
    a computer.


    This language is so popular that you will find a lot of major companies that are
    already using it for their systems, including Google App Engine, Google Search,
    YouTube, iRobot machines and more. And as the knowledge about this language continues
    to increase, it is likely that we are going to see even more of the applications
    and sites that we rely on each day working with this language as well.


    The initial development of Python was started by Guido van Rossum in the late
    1980s. Today, it is going to be developed and run by the Python Software Foundation.
    Because of the features behind this language, programmers of Python can accomplish
    their tasks with many different styles of programming. Python can be used for
    a variety of things as well including serial port access, game development, numeric
    programming, and web development to name a few.


    There are going to be a few different attributes that we can look at that show
    us why the development time in Python is faster:


    1. Python is an interpreted language. This means that there is no need for us
    to compile the code before we try to execute it. It is also a high-level language
    that will abstract many sophisticated details, even for those who are just started.

    2. Python codes are often shorter than in similar languages. Although it does
    offer fast development times, keep in mind that the execution time is going to
    lag a little bit. Compared to some other languages such as `C` and `C++`, Python
    is going to execute at a slower rate. Of course, with the processing speeds that
    we see in most computers today, the differences are not really going to be noticed
    by the people who are using it.


    By spending time focusing on this language, some of the basics that we are able
    to do will help prepare us for some of the more complex things that we are able
    to do, such as data science and machine learning which we can discuss later.


    ## Why to Learn Python


    Learning the ABCs of anything in this world is a must. Knowing the essentials
    is winning half the battle before you get started.


    In the same manner, before you embark on the other aspects of Python let us level
    off the basic elements first. You need to learn and understand the basics of Python
    as a foundation for advancing to more complicated components.


    Familiarize yourself with the Python Official Website `https://www.python.org/`.
    Knowing well the website of Python would give you the leverage in acquiring more
    information and scaling up your knowledge about Python. Also, you can get the
    needed links for your work.


    Learn from Python collections. Locate Python collections such as records, books,
    papers, files, documentations and archives and learn from them. You can pick up
    a number of lessons from these and expand your knowledge about Python.

