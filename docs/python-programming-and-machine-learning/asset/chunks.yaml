  trans: '


    与 `read()` 方法类似，`readline()` 的语法非常相似：


    ![00079.jpeg](img/image00262.jpeg)


    一旦我们打开了文件，就可以获取许多类型的信息（属性），通过这些属性可以了解更多关于我们文件的信息。这些属性是：


    - `File.name`: 这是一个返回文件名的属性。

    - `File.mode`: 这是一个返回我们打开文件时所访问模式的属性。

    - `file.closed`: 这是一个属性，如果我们正在处理的文件已关闭，它将返回 "True"；如果处理的文件仍然打开，它将返回 "False"。


    ### `Close()` 函数


    `close` 函数是消除程序内存中已写入任何类型信息的方法，以便继续关闭文件。但这不是关闭文件的唯一方法；当我们把对象从一个文件重新赋值到另一个文件时，也可以执行操作。


    `close` 函数的语法如下：


    ![00080.jpeg](img/image00263.jpeg)


    ### 什么是缓冲区（buffer）？


    我们可以将缓冲区定义为在 内存中被临时使用的文件；它将包含构成操作系统中文件序列的数据片段。当我们处理一个未知存储大小的文件时，经常会使用缓冲区。


    记住，如果文件大小超过了我们设备拥有的内存大小，其处理单元将无法执行程序并正常工作。


    缓冲区的大小是做什么的？缓冲区的大小将指示我们在使用文件时可用的存储空间。通过函数 `io.DEFAULT_BUFFER_SIZE`，程序将以预定的方式向我们显示平台上文件的大小。


    我们可以通过更清晰的方式观察到这一点：


    ![00081.jpeg](img/image00264.jpeg)


    ### 错误（Errors）


    在我们的文件中，我们将找到一个字符串（可选类型），用于指定我们处理程序中编码错误的方式。


    错误只能在 txt 模式的文件中使用。


    这些是对应的：


    | `Ignore_errors()` | 这将避免格式错误或未的注释 |

    | --- | --- |

    | `Strict_errors()` | 如果我们的代码文件中出现任何错误或失败，它将生成 `UnicodeError` 的子类 |


    ### 编码（Encoding）


    字符串编码在处理数据存储时经常被使用，这无非是字符编码的表示，其系统基于位和字节作为相同字符的表示。


    其表达式如下：


    ![00082.jpeg](img/image00265.jpeg)


    ### 换行（Newline）


    换行模式是控制换行功能的模式，它可以是 `\r`、`" "`、无、`\n` 和 `\r\n`。


    换行是通用的，可以视为解释我们代码文本序列的方式。


    1. Windows 中的行尾句子：`"\r\n"`。

    2. Max Os 中的行尾句子：`"\r"`。

    3. UNIX 中的行尾句子：`"\n"`。


    在输入时：如果换行是 `None` 类型，则会自动激活通用换行模式。


    输入行可以以 `\r`、`\n` 或 `\r\n` 结束，并在我们的程序返回之前自动翻译为 `\n`。如果满足编码时满足其相应的合法参数，则行的输入将仅以相同的给定字符串结束，且其最后一行在返回时不会被翻译。


    在输出时：如果换行是 `None` 类型，任何写入的任何类型的字符 `\n` 将被翻译为我们称为 `"os.linesep"` 的行分隔符。


    如果换行是 `" "` 类型，则不会进行任何类型的翻译，并且当换行符合任何被认为代码合法的值时，它们将自动翻译为字符串。


    `" "` 的换行读取示例。


    ![00083.jpeg](img/image00266.jpeg)


    none 的换行读取示例：


    ![00084.jpeg](img/image00267.jpeg)


    ### 通过 "os" 模块管理文件


    `os` 模块允许我们执行某些操作，这些操作取决于操作系统（操作如启动进程、列出文件夹中的文件、结束进程等）。


    `os` 模块有多种方法允许我们管理文件，这些是：


    | `os.makedirs()` | 该“os”模块的此方法创建一个新文件 |

    | --- | --- |

    | `os.path.getsize()` | 该“os”模块的此方法将显示以字节为单位的文件大小 |

    | `os.remove(file_name)` | 该“os”模块的此方法将删除文件或程序 |

    | `os.getcwd()` | 该“os”模块的此方法将向我们显示我们工作的实际目录 |

    | `os.listdir()` | 该“os”模块的此方法将列出任何文件夹的内容 |

    | `os.rename(current_new)` | 该“os”模块的此方法将重命名文件 |

    | `os.path.isdir()` | 该“os”模块的此方法将检查路径是否为目录 |

    | `os.chdir()` | 该“os”模块的此方法将更改目录 |

    | `os.path.isfile()` | 该“os”模块的此方法将检查路径是否为文件 |


    ### xlsx 文件


    xlsx 文件是用于处理电子表格的文件，它们是什么呢？这无非就是操作 Excel。例如，如果我们有 Windows 操作系统。在本章中，我们将学习这种类型文件的基本功能，包括创建、打开和修改文件。


    为了开始，我们首先必须安装必要的库；我们通过执行命令来实现：


    `pip3 install openxl`


    执行此命令后，将在 Python 文件中下载并安装 openxl 模块，我们也可以查看该模块的文档。


    #### 创建 xlsx 文件


    要使用此模块创建一个文件，让我们使用 `openxl()` `Workbook()` 函数。


    ![00085.jpeg](img/image00268.jpeg)


    这是我们管理文件的第一步，我们可以看到我们首先通过导入 `openxl` 模块的 `Workbook` 函数创建了文件；随后为变量 `wb` 分配了 `Workbook()`
    函数，通过此我们了我们要工作的文档。完成后，激活对象并最后保存文件。


    #### 使用此模块向文件添加信息


    为了向我们的文件添加信息，我们需要使用该对象自带的其他类型函数，其中之一是 `append()` 函数。


    ![00086.jpeg](img/image00269.jpeg)


    我们可以观察到这与上一个创建文档的示例相似，对于它我们执行了相同的步骤：在函数 `xlsx()` 中创建了对象 `wb`，激活了对象并在那里添加了信息。在这个新空间中，我们需要知道写入的具体位置，在这种情况下，我们将写入第二行的第四个格子
    `"B4"`，这些将与显示为 `"goodnight"` 的字符串匹配。最后的步骤与上一个示例完全相同，因此我们将放置名称并使用 save 命令保存。


    有一种更简单的方法来写入和输入数据，我们可以通过 `append()` 函数来实现。


    '
