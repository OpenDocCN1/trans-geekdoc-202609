  trans: '

    现在，在某些情况下，离群值也是重要的。如果你在观察一些离群值，发现有很多离群值聚类某一个簇或组中，那么这可能意味着我们需要开始关注并利用这些离群值。如果你看到这一组中有大量的离群值，而仅仅是一两个随机的离群值，那么这可能是一个良好的信号，表明在接触客户、营销以及你想要发布的新产品等方面有了新的处理方案。查看这些离群值并无坏处，但在很多情况下，你可能想要删除它们。


    此外，我们需要关注重复项。很多时候，我们需要检查并删除重复项，以免答案最终对我们的结果产生任何问题影响。如果你在数据集中有十个相同的人，且所有信息都相同，这将偏曲你的结果。


    如果这种情况发生几次，整体问题会变得更糟糕。大多数情况下，我们希望删除足够的重复项，直到最后没有重复项，或者只剩下极少量的。


    ## 分割你的数据


    处理数据时，我们需要工作的一之一是确定如何将其拆分。在将需要的数据添加到想要使用的算法之前，我们必须对某些部分数据进行一些处理。例如，我们需要通过训练和测试算法的过程，来确保它们按照我们想要的方式运行。这意味着我们需要将现有数据拆分为训练数据和测试数据。


    这两组数据对于确保我们的算法正常工作至关重要。正确设置并以适当的方式使用这些集合，将帮助我们在处理机器学习时获得最佳结果。不过，这方面的规则非常简单，因此你将能够在过程中毫无问题地开始。


    例如，我们需要确保正在使用的数据从开始就是高质量的。如果你没有足够的数据，或者数据质量不高，那么你的算法将得到不当训练，不会按照你想要的方式运行。在这个过程中，请务必注意你正在使用的数据类型。


    接下来，我们需要确保正确地分割数据。我们应该有一个测试组和一个训练组。你的训练集应该大得多，以确保你正在正确地训练已有的数据，并让算法能够充分接触到你所提供的示例以及你希望它执行的任务。


    ## 训练和测试你的数据


    在我们处理数据和这些算法的过程中，我们必须确保先训练并测试所有的算法。你不能只写几行代码然后输入数据，寄希望弹出一个良好的预测。你需要花时间通过该算法对数据进行训练和测试，以确保准确性，并确保算法已准备好供你使用。


    第一步是对你的数据进行训练。你必须确保花费大量时间训练数据，以便它知道正确的行为方式。在我们之前进行的数据拆分中，你希望大约 75% 到 85% 的数据位于训练集中。这确保了你有足够的数据来帮助你真正训练算法，并让它在此过程中有充足的时间学习。


    然后你可以将所有这些训练数据输入算法，让它有一段时间时间形成那些连接并学习它应该做什么。从那里开始，你还需要测试你正在处理的数据。这将是你处理的剩余数据。你可以将它们输入算法，并观察返回多少准确率。


    请记住，大多数时候，这些算法能够通过经验进行学习。这意味着虽然它们最初的准确率可能没有你希望的高，但它们会变得更好。事实上，你可能需要进行几次训练和测试阶段，以提高准确率直到可以使用该算法进行预测的程度。


    你想让准确率尽可能高。然而，如果你发现准确率往往较低，并且低于 50%，或者在进行训练和测试阶段的迭代时没有提高，那么这是一个坏信号。它向我们表明，要么是你训练中使用的数据不足以让算法正确学习，要么是你使用了让算法产生困惑的坏数据。


    这就是我们进行训练和测试阶段的原因。它帮助我们捕获数据中可能发生的一些问题，并允许我们在公司未来依赖训练不当的算法之前，对数据和算法进行必要的更改。我们可以进行调整并重新运行这些阶段，直到准确率上升，我们知道可以再次依靠这些数据。


    处理数据将成为我们想要处理的机器学习项目中非常重要的一部分，我们需要学会如何区分不同类型的数据、如何处理缺失数据和离群值，以及如何分割数据，以便我们能够正确地训练和测试我们想要的算法。当我们能够处理好这些时，我们将通过机器学习获得一些极佳的结果，然后就可以利用这些预测和见解来帮助改进我们的业务。


    ![00006.jpeg](img/image0280.jpeg)


    ## 第 5 章：机器学习与人工智能对比


    在继续下去之前，我们需要花一些时间研究并理解人工智能与机器学习之间的区别。当我们观察数据科学领域时，机器学习将执行许多不同的任务，它同时也属于人工智能的范畴。但我们必须理解，数据科学是一个非常广泛的术语，有很多概念符合它。数据科学大伞下的概念之一是机器学习，但我们还会看到其他术语，包括大数据、数据挖掘和人工智能。数据科学是一个较新的领域，随着人们发现更多计算机的用途并更频繁地使用，它正在不断增长。


    当你引入数据科学时，你可以关注的另一个领域是统计学，它在机器学习中经常结合在一起。即使你在高水平上，也可以专注于经典统计学，这样数据集在整个过程中始终保持一致。当然，你用于实现这一点的不同方法将取决于输入的数据类型，以及你所使用的信息的复杂程度。


    这引出了关于机器学习和人工智能之间所出现的差异以及为什么它们不是同一事物的问题。这两个选项之间有很多相似之处，但主要区别是区分它们的关键，任何想从事机器学习的程序员都必须理解出现的一些差异。让我们花点时间探索人工智能和机器学习的不同部分，以便我们看到它们的相同和不同之处。


    ### 什么是人工智能？


    '
