    以下是与人工神经网络相关的几个困难。它们表明了个人在使用该系统时的缺点。


    a) **向网络展示问题的困难性** – 这种神经系统只处理以数值形式的信息。因此，用户必须将问题转换为数值以利用该网络。用户可能会发现根据需要转换显示机制具有挑战性。


    b) **对硬件的依赖** – 神经网络依赖于具有并行处理能力的硬件，没有这些硬件它们就无法运行。


    c) **网络的持续时间不确定** – 当网络在示例上的误差下降到特定的误差值时，系统会发出训练完成的信号。这种估算并不代表最优结果。


    d) **网络不可解释的行为** —— 由于网络在提供解决方案时没有附带解释，人们对该网络的信任度会降低。


    e) **确定合适的网络结构** – 相关的神经系统是通过实验和经验形成的。建立适当的网络结构没有固定的规则。


    结论，人工神经网络是人工智能和机器学习中的关键工具。人员需要理解神经系统的含义以及它是如何运作的。网络的类型指示了网络在不同情况下的运行方式，而层级结构展示了数据在这个神经系统中是如何移动的。优点和缺点也能让用户了解网络的优劣。上述信息提供了人们可以用来学习人工神经网络的重要知识。随后，他们可以将将其应用于系统的实际开发中。


    # 第 11 章 数据科学


    ![数据科学图像结果](img/image00285.jpeg)


    我们花费大量时间研究机器学习以及我们利用 Python 能够做到的事情，主要原因之一是我们希望利用它来帮助我们处理数据科学。许多公司正在深入研究数据科学的想法以及这种方法能为他们做的一切，无论你的业务是寻求扩展到新领域，还是想触及更多客户或发布新产品，数据科学都能为你提供帮助。


    现在，数据科学会带来几个不同的步骤，以确保它尽可能地成功。但总的来说，它将由许多机器学习和 Python 算法组成，这些算法将帮助我们对准备好的数据进行组织，以便我们以后使用。但通过数据科学的帮助，我们确实做更多事情，我们现在将花一点时间探索。在本章中，我们将观察这一过程中的几个重要步骤，包括数据科学的基础、深度学习是如何介入的，以及数据准备如何成为我们所需的工具。


    ## 什么是数据科学？


    我们在这里要花时间讨论的第一个话题是关于数据科学的。简单来说，数据科学就是一种非常详细的研究，它向我们展示了公司收集和获取的大量数据中的信息流，并希望从中学习一些东西。在我们的现代世界中，无论我们转向何方，处处信息。公司可以使用这些数据，通过通过在社交媒体上开设账户或其他方法，他们可以从客户那里收集大量数据，并以许多不同的方式使用它们。


    虽然收集所有这些不同的信息很重要，并且看起来似乎是公司需要做的唯一事情，但当我们试图弄清楚所有这些数据应该采取的步骤时，问题就会真正显现。如果我们对能用这些信息做什么主意，或者对在这些数据中能发现什么完全没有头绪，仅仅保留这些信息对我们没有很大好处。而且由于数据非常多（通常在我们开始时远比我们想象的要多），我们很难简单地分配一个人甚至一个团队来查阅这些数据，并高效快速地找到这组数据中的模式和洞察。


    数据科学的出现就是为了处理这类问题。它将介入帮助我们确定信息中发现了什么，甚至是如何存储这些信息。通过人工智能和机器学习的帮助（我们稍后会进行讨论），我们会发现数据科学能够处理信息并发现其中的趋势，特别是那些隐藏的趋势。


    提到数据科学时，我们能够从原始和非结构化数据中获得有意义的洞察，然后通过业务、编程和分析技能进行处理。让我们进一步了解更多关于数据科学的内涵、它为什么重要，以及数据科学循环的不同部分。


    现在，我们每天会看到产生 25 万亿字节的数据供公司使用，随着物联网（IoT）的持续增长，这一速度将更快的速度增长。这是数据量的惊人增长，对于许多公司了解其客户、确定下一个发布的最佳产品，以及与他们希望提供的客户服务进行良好合作非常有用。所有这些数据将来自各种来源，包括：


    1. 商场内安装了传感器以收集个人购物者的信息。

    2. 各种社交媒体平台上的帖子可以向公司反馈信息。

    3. 我们手机中的视频和数字照片摄入的数据比以往任何时候都要。

    4. 公司在查看人们在线购物时的购买交易时甚至可以获得一些有用信息。


    想一下这会产生多少数据。但无论数据来自哪里，它都被被称为大数据。正如我们在这里想象的，来自所有不同的数据源，公司将面临数据洪没，并且处理着超出他们真正掌握范围的数据。而且个人去独立完成这项工作是不可能的。这就是为什么我们学习最佳方法来处理数据并使其符合我们的需求非常重要。当这种情况发生时，我们能够更好地利用这些数据和内部的所有信息来做出我们的业务决策。


    在这一部分，我们看到数据科学的想法在画面中越来越多地出现。数据科学将汇聚在商业世界取得成功所需的各种技能，包括业务领域知识、统计学和数学。所有这些对于我们的过程都是至关重要的，因为它们将从许多方面帮助组织。我们可能还不知道这些方法在未来将以哪些方式帮助业务，但公司现在和以后使用这些数据的一些方式包括：


    1. 帮助公司学习每天可以降低成本的新方法。

    2. 它可以帮助公司确定进入对他们有利的新市场的最佳方法。

    3. 这可以帮助公司了解各种人口统计特征以及如何切入。

    4. 它可以帮助公司查看他们发出的营销活动，然后判断该营销活动是否有效。

    5. 它可以使公司更容易成功地推出新的服务产品。


