    There are a few stages that are going to come with this data life cycle, and we
    are going to start out with some of the basics to discuss each one to help us
    see what we are able to do with the data available to us.


    ### 1. Data Capture

    First, we work with data capture. The first experience that an individual or a
    company should have with a data item is to have it pass through the firewalls
    of the enterprise. This is going to be known as the Data Capture, which is basically
    going to be the act of creating values of data that do not exist yet and have
    never actually existed in that enterprise either. There are three ways that you
    can capture the data including:


    * **Data acquisition**: This is going to be the ingestion of data that is already
    existing that was produced by the organization but outside of the chosen enterprise.

    * **Data entry**: This is when we are dealing with the creation of new data values
    to help with the enterprise and it is done by devices or human operators that
    can help to generate the data needed.

    * **Signal reception**: This is where we are going to capture the data that a
    device has created with us, typically in the control system, but can be found
    in the Internet of Things if we would like.


    ### Data Maintenance

    The next part is going to be known as Data Maintenance. This is going to be where
    you supply the data to points at which data synthesis and data usage can occur
    in the next few steps. And it is best if you are able to work out the points so
    that they are going to be ready to go in this kind of phase.


    What we will see during the data maintenance is that we are working to process
    the data, without really working to derive any value out of it yet. This is going
    to include integration changed data, cleansing, and making sure that the data
    is in the right format and as complete as possible before we get started. This
    ensures that no matter what method or algorithm you choose to work with here,
    you are going to be able to have the data ready to go.


    ### Data Synthesis

    Once you have been able to maintain the data and get it all cleaned up, it is
    time to work on the part known as data synthesis. This is a newer phase in the
    cycle and there are some places where you may not see this happen. This is going
    to be where we create some of the values of data through inductive logic, and
    using some of the data that we have from somewhere else as the input. The data
    synthesis is going to be the arena of analytics that is going to use modeling
    of some kind to help you get the right results in the end.


    ### Data Usage

    Data usage comes next. This data usage is going to be the part of the process
    where we are going to apply the data as information to tasks that the enterprise
    needs to run and then handle the management on its own. This would be a task that
    normally falls outside of your life cycle for the data. However, data is becoming
    such a central part of the model for most businesses and having this part done
    can make a big difference.


    For example, the data itself can be a service or a product, or at least part of
    this service or product. This would then make it a part of the data usage as well.
    The usage of the data is going to have some special challenges when it comes to
    data governance. One of these is whether it is legal to use the data in the ways
    that most people in business would like. There could be some issues like contractual
    or regulatory constraints on how we can use this data and it is important that
    these are maintained as much as possible.


    ### Data Publication

    Once we have figured out the data usage, it is time to move on to data publication
    implying that that has been sent outside of the firm or enterprise.


    ### Data Archival

    Next on the list is the data archival. We will see that the single data value
    that we are working with can sometimes experience a lot of different rounds of
    usage and then publication, but eventually, it is going to reach the very end
    of its life. The first part of this means that we need to be able to take the
    value of the data and archive it. When we work on the process of Data Archival,
    it is going to mean that we are copying the data to an environment where it is
    stored in case we need it again, in an active production environment, and then
    we will remove the data from all of those active environments as well.


    This kind of archive for the data is simply going to be a place where the data
    is stored, but where no publication, usage, or maintenance is going to happen.
    If necessary, it is possible to take any of the data that is in the archive and
    bring it back out to use again.


    ### Data Purging

    And finally, we reach the part of data purging. This is going to be the end that
    comes with our single data value and the life cycle that it has gone through.
    Data purging is going to be when we remove every copy of data from the enterprise.
    If possible, you will reach this information through the archive. If there is
    a challenge from Data Governance at this point, it is just there to prove that
    the information and the data have gone through the proper purging procedure at
    that time.


    ### 2. Working with data analysis and why it is important

    With this in mind, we need to pay attention to why we would want to work on data
    analysis to start with? Do we really need to be able to look through all of this
    information to find the trends, or is there another method? Let’s look at an example
    of what can happen when we do this data analysis and why you would want to use
    it.


    Let’s consider that we are looking at a set of data that includes information
    about the weather that occurred across the globe between the years 2015 to 2018.
    We are also going to have information that is base on the country between these
    years as well. So, there is going to be a percentage of ran within that country
    and we are going to have some data that concerns this in our set of data as well.


    Now, what if you would like to go through all of that data, but you would like
    to only take a look at the data that comes with one specific country. Let’s say
    that you would like to look at America and you want to see what percentage of
    rain it received between 2016 and 2017. Now, how are you going to get this information
    in a quick and efficient manner?


    What we would need to do to make sure that we were able to get ahold of this particular
    set of data is to work with the data analysis. There are several algorithms, especially
    those that come from machine learning, that would help you to figure out the percentage
    of rain that America gets between 2016 to 2017. And this whole process is going
    to be known as what data analysis is really all about.


    ### 3. The Python Panda Library

    When it comes to doing some data analysis in Python, the best extension that you
    can use is `Pandas`. This is an open-sourced library that works well with Python
    and it is going to provide you with a high level of performance, data structures
    that are easy for even a beginner to use, and tools to make data analysis easy
    with Python. There are a lot of things to enjoy about this language, and if you
    want to be able to sort through all of the great information that you have available
    with the help of Python, then this is the library that you need to work with.


    There are a lot of things that you can enjoy when it comes to working on the Python
    library. First off, this is one of the most popular and easy to use libraries
    when it comes to data science and it is going to work on top of the `NumPy` library.
    The one thing that a lot of coders are going to like about working with `Pandas`
    is that it is able to take a lot of the data that you need, including a `SQL`
    database or a `TSV` and `CSV` file, and will use it to create an object in Python.
    This object is going to have columns as well as rows called the data frame, something
    that looks very similar to what we see with a table in statistical software including
    Excel.

