    所有你可以在整数上执行的操作，也可以在浮点数上执行。如果你对浮点数运行 `type` 函数，你将得到类型 `float`。


    这里是一个展示对浮点数进行操作的程序：


    ```

    w = 1.2 * 0.3

    print(w)

    x = 10.4 + 1.6

    print(x)

    y = 10.555 + 22.224

    print(y)

    z = 0.004 + 0.006

    print(z)

    ```


    以下是四个 `print` 语句的输出：


    0.36

    12.0

    32.778999999999996

    0.01


    ## 类型转换：什么是类型转换？


    关于 Python 的另一个事实是它是一种动态类型语言。


    弱类型或动态类型语言不会在你编写代码时将数据类型与变量关联。相反，类型是在运行时与变量关联的。不清楚吗？让我们来看一个例子。


    ```

    x = 10

    x = "I am just a phrase"

    x = 10.444

    x = True

    ```


    当你运行这段代码时，它会正确执行预期的操作。让我们看看变量 `x` 发生了什么。我们写了四条语句并为 `x` 赋值了不同的值。


    在运行时（当你解释或运行程序时），第 1 行，`x` 是一个整数。第 2 行，它是一个字符串。第 3 行，它是一个浮点数，最后，它是一个布尔值。


    然而，通过类型转换，我们可以手动更改每个变量的类型。我们将为此目的将使用的函数是 `str()`、`int()` 和 `float()`。


    让我们扩展同样的例子：


    ```

    x = 10

    x = float(x)

    print(type(x))

    x = "I am just a phrase"

    print("x: " + x)

    print(type(x))

    x = 10.444

    x = int(x)

    print(type(x))

    x = False

    x = int(x)

    print(x)

    ```


    在这个程序中，我们使用了过去几节中涵盖的所有内容。所有的数据类型并使用我们新学到的函数对它们进行了转换。


    在第一种情况下，`x` 被转换为浮点数，`type` 函数为我们验证了这一点。其次，字符串仍然是字符串，因为它无法转换为数字、`int` 或 `float`。第三，我们将浮点数转换为整数。


    作为一个额外的练习，如果你打印第三种情况下新更改的值，你会发现 `x` 的值为：`10`。这是因为类型现在已经改变了，且小数点后的数值被丢弃了。


    在第四种情况下，我们打印了 `x` 的值，即 `False`。然后，我们将将其转换为整数。这里出现了另一个情况。输出是什么？`0`。


    因为在 Python 中，`True` 的值通常是任何非零数字（通常为 1），而 `False` 是 0。所以，它们的整数转换分别为 `True` 和 `False`
    产生 1 和 0。


    ## 注释


    注释是放在代码中的文本短语，目的是让其他编码员、读者和程序员能够理解并易读。


    ### 为什么注释很重要？


    注释非常重要，尤其是当你与其他程序员合作时，他们迟早会审查你的代码。通过注释，你可以为代码写一段简短描述并告诉他们它是做什么的。


    此外，如果你有与其他代码相关的或其他或个人信息，你可以把它们放在那里，因为解释器不会捕获它们。


    ### 如何编写注释？


    在 Python 中，有两种编写注释的方法，我们将探索这两种方法。对于第一种方法，你可以在想要注释的行前面使用 `#` 符号。来看这段代码：


    ```

    # 这一行是注释

    # count 是一个简单的变量

    count = 15

    print(count)

    ```


    如果你运行这段代码，输出将是 `15`。这是因为注释行（以 `#` 开头）完全不会被执行。


    现在，如果你的注释行较少（即没有跨越多行），这种方法是可以的。但如果它们跨越了多行，给所有它们都加井号将浪费时间。对于第二种注释，我们将用三个单引号（`''''''`）包含注释行，并同样用三个引号结束。这里有一个例子：


    ```

    ''''''

    2. 这条注释跨越

    3. 多行。

    ''''''

    ''''''

    count = 15

    print(count)

    ```


    注意，与单行注释不同，我们必须关闭我们的多行注释。


    ## 使用 Python 进行数据分析


    我们在这里需要探索的另一个主题是 Python 及其随带的一些库如何处理数据分析过程。对于任何企业来说这都是一个重要的过程，因为它允许他们利用收集已久的数据和信息，一旦他们理解了信息中传达的内容，就可以将其大显用场。对于个人来说，遍历所有信息并找出其中内容可能是困难的，但对于能够使用
    Python 完成这一过程的数据分析师来说，找到所需的信息和趋势是非常容易。


    但我们首先需要查看的是什么是数据分析。数据分析是公司用来以系统方法从他们收集的数据中提取有用、相关甚至有意义的信息的过程。这确保了他们从一切事物中获取完整信息并在过程中获得良好的结果。公司选择自己进行数据分析有很多原因，包括：


    1. 参数估计，帮助他们推断所正在处理的一些未知数。

    2. 模型开发和预测。这将涉及大量的预测。

    3. 特征提取，这意味着我们将识别出其中的一些模式。

    4. 假设检验。这允许我们验证发现的信息和趋势。

    5. 故障检测。这是对你正在工作的过程进行监控，以确保没有发生任何偏差。


    我们需要确保注意的一点是我们所拥有的信息中的偏差问题。如果你带着“某事应该以某种方式呈现”的想法进入数据分析，或者你打算操纵数据以符合你的观点，将会出现问题。你总是可以更改数据来说出你想说的话，但这并不意味着你获得了随之而来的真实趋势。


    这就是为什么许多数据分析师在开始时完全不带任何假设。这允许他们看到随之而来的实际趋势，然后看信息将你带向何处，而对信息没有任何任何偏见。这可以让生活变得更容易，并确保你实际上能够看到信息中真实的内容，而不是你想在那些信息中看到的内容。


    现在，你可以处理几种不同类型的数据。首先是确定性的（deterministic）。这也称为非随机数据分析。然后是随机性的（stochastic），基本上是指任何不属于确定性类别的类别。


    ### 数据生命周期


    在我们学习这些信息时，理解数据生命周期的不同阶段是重要的。每一个阶段共同作用，确保我们能够理解呈现给我们的信息，并能够以最有效、最好的方式使用所有数据。


    '
