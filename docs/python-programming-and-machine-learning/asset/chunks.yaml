- raw: "Like the read() method and readline() its syntax are very similar: \n\n![00079.jpeg](Images/image00262.jpeg)\
    \ \n\nOnce we have opened a file, there are many types of information (attributes)\
    \ we could get to know more about our files. These attributes are:  \n\nFile.name:\
    \ This is an attribute that will return the name of the file. \n\nFile.mode: This\
    \ is an attribute that will return the accesses with which we have opened a file.  \
    \ \n\nfile.closed: This is an attribute that will return a \"True\" if the file\
    \ we were working with is closed and if the file we were working with is still\
    \ open, it will return a \"False\". \n\nClose() function \n\nThe close function\
    \ is the method by which any type of information that has been written in the\
    \ memory of our program is eliminated, in order to proceed to close the file.\
    \ But that is not the only way to close a file; we can also do it when we reassign\
    \ an object from one file to another file. \n\nThe syntax of the close function\
    \ is as follows: \n\n![00080.jpeg](Images/image00263.jpeg) \n\nWhat's a buffer?\
    \ \n\nWe can define the buffer as a file which is given a temporary use in the\
    \ ram memory; this will contain a fragment of data that composes the sequence\
    \ of files in our operating system. We use buffers very often when we work with\
    \ a file which we do not know the storage size. \n\nIt is important to keep in\
    \ mind that, if the size of the file were to exceed the ram memory that our equipment\
    \ has, its processing unit will not be able to execute the program and work correctly.\
    \ \n\nWhat is the size of a buffer for? The size of a buffer is the one that will\
    \ indicate the available storage space while we use the file. Through the function:\
    \ io.DEFAULT\\_BUFFER\\_SIZE the program will show us the size of our file in\
    \ the platform in a predetermined way.  \n\nWe can observe this in a clearer way:\
    \ \n\n![00081.jpeg](Images/image00264.jpeg) \n\nErrors \n\nIn our files, we are\
    \ going to find a string (of the optional type) which is going to specify the\
    \ way in which we could handle the coding errors in our program.  \n\nErrors can\
    \ only be used in txt mode files. \n\nThese are the following:\n\n| Ignore\\_errors()\
    \  || This will avoid the comments with a wrong or unknown format  |\n\n| ---\
    \ | --- |\n\n| Strict\\_errors()  || This is going to generate a subclass or UnicodeError\
    \ in case that any mistake or fail comes out in our code file  |\n\nEncoding \n\
    \nThe string encoding is frequently used when we work with data storage and this\
    \ is nothing more than the representation of the encoding of characters, whose\
    \ system is based on bits and bytes as a representation of the same character.\
    \ \n\nThis is expressed as follows: \n\n![00082.jpeg](Images/image00265.jpeg)\
    \ \n\nNewline \n\nThe Newline mode is the one that is going to control the functionalities\
    \ of the new lines, which can be '\\\\r', \" \", none, '\\\\n', and '\\\\r\\\\\
    n'. \n\nThe newlines are universal and can be seen as a way of interpreting the\
    \ text sequences of our code. \n\n1.The end-of-line sentence in Windows: \"\\\\\
    r\\\\n\".  \n\n2.The end-of-line sentence in Max Os: \"\\\\r\".  \n\n3.The end-of-line\
    \ sentence in UNIX: \"\\\\n\" \n\n On input: If the newline is of the None type,\
    \ the universal newline mode is automatically activated.  \n\nInput lines can\
    \ end in \"\\\\r\", \"\\\\n\" or \"\\\\r\\\\n\" and are automatically translated\
    \ to \"\\\\n\" before being returned by our program. If their respective legal\
    \ parameters when coding are met, the entry of the lines will end only by the\
    \ same given string and their final line will not be translated at the time of\
    \ return. \n\nOn output: If the newline is of the None type, any type of character\
    \ \"\\\\n\" that has been written, will be translated to a line separator which\
    \ we call \"os.linesep\". \n\nIf the newline is of the type \" \" no type of translator\
    \ is going to be made, and in case the newline meets any value of which are considered\
    \ the legal for the code, they will be automatically translated to the string.\
    \ \n\nExample of newline reading for \"  \". \n\n![00083.jpeg](Images/image00266.jpeg)\
    \ \n\nExample of newline reading for none: \n\n![00084.jpeg](Images/image00267.jpeg)\
    \ \n\nManage files through the \"os\" module \n\nThe \"os\" module allows us to\
    \ perform certain operations, these will depend on an operating system (actions\
    \ such as starting a process, listing files in a folder, end process and others).\
    \ \n\nThere are a variety of methods with the \"os\" module which allow us to\
    \ manage files, these are: \n\n| os.makedirs()  || This method of the “os” module\
    \ will create a new file  |\n\n| --- | --- |\n\n| os.path.getsize()  || This method\
    \ of the “os” module will show the size of a file in bytes.  |\n\n| os.remove(file\\\
    _name)  || This method of the “os” module will delete a file or the program  |\n\
    \n| os.getcwd ()  || This method of the “os” module will show us the actual directory\
    \ from where we will be working  |\n\n| os.listdir()  || This method of the “os”\
    \ module will list all the content of any folder of our file  |\n\n| os.rename\
    \ (current\\_new)  || This method of the “os” module will rename a file  |\n\n\
    | os.path.isdir()  || This method of the “os” module will transfer the parameters\
    \ of the program to a folder  |\n\n| os.chdir()  || This method of the “os” module\
    \ will change or update the direction of any folder or directory  |\n\n| os.path.isfile()\
    \  || This method of the “os” module will transform a parameter into a file. \
    \ |\n\nXlsx files: xlsx files are those files in which you work with spreadsheets,\
    \ how is this? Well, this is nothing more than working with programs like Excel.\
    \ For example, if we have the windows operating system on our computer, we have\
    \ the advantage that when working with this type of files, the weight of it will\
    \ be much lighter than other types of files. \n\n The xlsx type files are very\
    \ useful when working with databases, statistics, calculations, numerical type\
    \ data, graphics and even certain types of basic automation.  \n\nIn this chapter\
    \ we are going to learn to work the basic functionalities of this type of files,\
    \ this includes creating files, opening files and modifying files. \n\nTo start\
    \ this, first we will have to install the necessary library; we do this by executing\
    \ the command \"pip3 install openpyxl\" in our Python terminal. \n\nOnce executed\
    \ this command it is going to download and install the openpyxl module in our\
    \ Python files, we can also look for documentation to get the necessary information\
    \ about this module. \n\nCreate an xlsx file: To create a file with this module,\
    \ let's use the openpyxl() Workbook() function. \n\n![00085.jpeg](Images/image00268.jpeg)\
    \ \n\nThis is the first step that we will do to manage the files of the type xlsx,\
    \ we can see that first we have created the file importing the function Workbook\
    \ of the module openpyxl; followed by this to the variable wb we have assigned\
    \ the function Workbook() with this we declare that this will be the document\
    \ with which we are going to work (we create the object in the form of a worksheet\
    \ in this format). Once this is done, we activate the object whose name is wb\
    \ in order to assign it a name and finally save the file. \n\nAdd information\
    \ to the file with this module: In order to add information to our file, we will\
    \ need to use another type of functions that come included with the object, one\
    \ of them is the append function. \n\n![00086.jpeg](Images/image00269.jpeg) \n\
    \nWe can observe that this is similar to the last example that we needed to create\
    \ a document, for it we did the usual steps: we created in the function xlsxdoc()\
    \ the object wb, we activated the object and there we added the information. In\
    \ this new space we will need to know the specific position in which we are going\
