  trans: '


    # TensorFlow

    TensorFlow 使用节点，特别是多层节点。这些节点在系统内部执行多个任务，包括使用人工神经网络、训练，甚至建立大量数据集。诸如 Google 等多个搜索引擎都依赖于这种库。它的其中一个主要应用是目标识别。同样，它也有助于处理语音识别的不同应用程序。


    # Theano

    Theano 也是 Python 库的重要组成部分。它在这里的关键任务是帮助任何与数值计算相关的内容。我们也可以将其与 `NumPy` 联系起来。它扮演着其他角色，例如：


    * 数学表达式的定义

    * 辅助优化数学计算

    * 促进与数值分析相关的表达式的评估


    Theano 的主要目标是提供高效的结果。它是一个更快的 Python 库，因为它对密集数据的计算可以快 100 倍。因此，值得注意的是，与计算机的 CPU
    相比，Theano 在 GPU 上运行效果最好。在大多数行业中，CEO 和其他人员使用 Theano 进行深度学习。此外，他们还用它来计算复杂的任务。这一切都得益于它的处理速度。随着对数据计算技术需求巨大的行业不断扩张，许多人正在选择该库的最新版本。记住，最新版本在几年前进入了视野。Theano
    的新版本，即 `1.0.0` 版本，具有若干改进、接口变化并由新功能组成。


    # Pandas

    Pandas 是一个非常流行的库，有助于提供高级且高质量的数据结构。这里提供的数据简单且易用。此外，它非常直观。它由各种复杂的内置方法组成，使其能够执行分组和时序分析等任务。另一个功能是它有助于数据合并并提供过滤选项。Pandas
    可以从 Excel、CSV 甚至 SQL 数据库等其他源收集数据。它还可以处理收集的数据，以在行业中承担其操作角色。Pandas 由两个结构组成，使其能够正确执行其功能：即单维的
    `Series` 和具有二维的 `data frames`。长期以来，Pandas 被认为是最强大、最有效的 Python 库。它的主要功能是帮助进行数据操作。此外，它还有导出或导入广泛数据的能力。它适用于各个领域，例如数据科学领域。


    Pandas 在以下领域非常有效：


    * 数据拆分

    * 合并两种或多种类型的数据

    * 数据聚合

    * 选择或子集化数据

    * 数据重塑

    * 图表解释


    ## Series 维度

    | A | 7 |

    | --- | --- |

    | B | 8 |

    | C | 9 |

    | D | 3 |

    | E | 6 |

    | F | 9 |


    ## Data Frames 维度

    | | A | B | C | D |

    | --- | --- | --- | --- | --- |

    | *0 | 0 | 0 | 0 | 0 |

    | *1 | 7 | 8 | 9 | 3 |

    | *2 | 14 | 16 | 18 | 6 |

    | *3 | 21 | 24 | 27 | 9 |

    | *4 | 28 | 32 | 36 | 12 |

    | *5 | 35 | 40 | 45 | 15 |


    Pandas 在现实情况中的应用将使能够执行以下操作：


    * 你可以快速删除某些列，甚至添加 DataFrame 中发现的文本

    * 它将帮助你进行数据转换

    * Pandas 可以确保你获得错位或缺失的数据

    * 它具有强大的能力，特别是根据其功能对其他程序进行分组


    # Matplotlib

    这是另一种复杂且实用的数据分析技术，有助于数据可视化。它的主要目标是根据各种输入为行业提供所处的位置。当你无法与不同的利益相关者分享你的生产目标时，你会发现你的生产目标是没有意义的。为了实现这一点，Matplotlib
    在所需的计算分析类型方面非常有用。因此，它是每一位科学家（特别是处理数据的科学家）都偏好的唯一 Python 库。这种库在图形和图像方面看起来很好。而且，许多人喜欢使用它来创建各种图表进行数据分析。然而，随着新的先进库涌入行业，技术世界已经完全改变。


    它也非常灵活，由于由于，你能够创建可能需要的多个图表。这只需要几个命令即可完成。


    在这个 Python 库中，你可以创建各种不同的图表、各种图表、多个直方图甚至散点图。你也可以使用相同的原理制作非笛卡尔图表。


    * 图表解释


    ![00009.jpeg](img/image00282.jpeg)


    上面的图表突显了公司在三年内的总产量。它专门演示了 Matplotlib 在数据分析中的用法。通过观察图表，你会发现与另外两年相比，产量很高。同样，公司在水果生产方面表现优异，因为它在第
    1 年和第 2 年处于领先地位，并在第 3 年持平。从图中你可以意识到，由于使用了这个库，你的演示、表示甚至分析工作变得更简单了。这个 Python 库最终将使你能够创作出良好的图像、准确的数据等更多。通过这个
    Python 库的帮助，你将能够记录下产量高的年份，从而处于维持高生产季节的位置。


    值得注意的是，该库可以导出图形并将其转换为 `PDF`、`GIF` 等。总之，可以轻松地完成以下任务。它们包括：


    * 折线图

    * 散点图

    * 创建精美的条形图和构建直方图

    * 在行业内应用各种饼图

    * 制定数据分析和计算的方案

    * 能够遵循等高线图

    * 使用频谱图

    * 创建矢量图


    # Seaborn

    Seaborn 也是 Python 类别中流行的库之一。它在这里的主要目标是帮助可视化。重要的是，这个库的 as 是借自 Matplotlib 的。由于其层次更高，它能够生成各种图表，例如热图的制作、小提琴图的处理以及帮助生成时间序列图。


    * 图表插图 ![00010.jpeg](img/image00283.jpeg)


    上面的折线图清楚地显示了公司使用的不同机器的性能。根据上面的图表，你最终可以推断并结论公司继续使用哪些机器以获得最大产量。大多数情况下，通过 Seaborn
    库的这种评估方法将让你能够预测你不同输入的准确能力。


    # NumPy


