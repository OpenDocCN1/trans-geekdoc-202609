    # Possess the SEO Basics


    Acquire some education on Search Engine Optimization so you can interact with
    experts in the field and improve your `python` level of knowledge. That being
    said, here are the basic elements of Python.


    ## DIFFERENT VERSIONS OF PYTHON


    With Guido van Rossum at the helm of affairs, Python has witness three versions
    over the years since its conception in the ''80s. These versions represent the
    growth, development, and evolution of the scripting language over time, and cannot
    be done without telling the history of Python.


    The Versions of Python Include The Following;


    ### Python 0.9.0


    The first-ever version of Python released following its implementation and in-house
    releases at the Centrum Wiskunde and Informatica (CWI) between the years 1989
    and 1990, was tagged version `0.9.0`. This early version which was released on
    alt. sources had features such as exception handling, functions, and classes with
    inheritance, as well as the core data types of `list`, `str`, `dict`, among others
    in its development. The first release came with a module system obtained from
    `Module-3`, which Van Rossum defined as one of the central programming units used
    in the development of Python.


    Another similarity the first release bore with `Module-3` is found in the exception
    model which comes with an added `else` clause. With the public release of this
    early version came a flurry of users which culminated in the formation of a primary
    discussion forum for Python in 1994. The group was named `comp. lang. python`
    and served as a milestone for the growing popularity of Python users.


    Following the release of the first version in the 29th of February, 1991, there
    were seven other updates made to the early version `0.9.0`. These updates took
    varying tags under the `0.9.0` version and were spread out over nearly three years
    (1991 to 1993). The first version update came in the form of Python `0.9.1`, which
    was released in the same month of February 1991 as its predecessor. The next update
    came in the autumn period of the release year, under the label Python `0.9.2`.
    By Christmas Eve of the same year (1991) `python` published its third update to
    the earliest version under the label Python `0.9.4`. By January of the succeeding
    year, the 2nd precisely, a gift update under the label Python `0.9.5` was released.
    By the 6th of April, 1992, a sixth update followed named, Python `0.9.6`. It wasn''t
    until the next year, 1993, that a seventh update was released under the tag Python
    `0.9.8`. The eighth and final update to the earliest version came five months
    after the seventh, on the 29th of July, 1993, and was dubbed `python 0.9.9`.


    These updates marked the first generation of `python` development before it transcended
    into the next version label.


    ### Python 1.0


    After the last update to Python `0.9.0`, a new version, Python `1.0`, was released
    in January of the following year. 1994 marked the addition of key new features
    to the Python programming language. Functional programming tools such as `map`,
    `reduce`, `filter`, and `lambda` were part of the new features of the version
    1 release. Van Rossum mentioned that the obtainment of `map`, `lambda`, `reduce`
    and `filter` was made possible by a LISP hacker who missed them and submitted
    patches that worked. Van Rossum''s contract with CWI came to an end with the release
    of the first update version `1.2` on the 10th of April, 1995. In the same year,
    Van Rossum went on to join CNRI (Corporation for National Research Initiatives)
    in Reston, Virginia, United States, where he continued to work on Python and published
    different version updates.


    Nearly six months following the first version update, version `1.3` was released
    on the 12th of October, 1995. The third update, version `1.4`, came almost a year
    later in October of 1996. By then, Python had developed numerous added features.
    Some of the typical new features included an inbuilt support system for complex
    numbers and keyword arguments which, although inspired by `Modula-3`, shared a
    bit of a likeness to the keyword arguments of Common Lisp. Another included feature
    was a simple form hiding data through name mangling, although it could be easily
    bypassed.


    It was during his days at CNRI that Van Rossum began the CP4E (Computer Programming
    for Everybody) program which was aimed at making more people get easy access to
    programming by engaging in simple literacy of programming languages. Python was
    a pivotal element to van Rossum''s campaign, and owing to its concentration on
    clean forms of syntax; Python was an already suitable programming language. Also,
    since the goals of ABC and CP4E were quite similar, there was no hassle putting
    Python to use. The program was pitched to and funded by DARPA, although it did
    become inactive in 2007 after running for eight years. However, Python still tries
    to be relatively easy to learn by not being too arcane in its semantics and syntax,
    although no priority is made of reaching out to non-programmers again.


    The year 2000 marked another significant step in the development of Python when
    the `python` core development team switched to a new platform — BeOpen where a
    new group, BeOpen PythonLabs team was formed. At the request of CNRI, a new version
    update `1.6` was released on the 5th of September, succeeding the fourth version
    update (Python `1.5`) on the December of 1997. This update marked the complete
    cycle of development for CNRI because the development team left shortly afterward.
    This change affected the timelines of release for the new version `2.0` and the
    version `1.6` update; causing them to clash. It was only a question of time before
    Van Rossum, and his crew of PythonLabs developers switched to Digital Creations,
    with Python `2.0` as the only version ever released by BeOpen.


    With the version `1.6` release caught between a switch of platforms, it didn''t
    take long for CNRI to include a license in the version `1.6`. The license contained
    in the release was quite more prolonged than the previously used CWI license,
    and it featured a clause mentioning that the license was under the protection
    of the laws applicable to the State of Virginia. This intervention sparked a legal
    feud which led The Free Software Foundation into a debate regarding the "choice-of-law"
    clause being incongruous with that if the GNU General Public License. At this
    point, there was a call to negotiations between FSF, CNRI, and Open regarding
    changing to Python''s free software license which would serve to make it compatible
    with GPL. The negotiation process resulted in the release of another version update
    under the name of Python `1.6.1`. This new version was no different from its predecessor
    in any way asides a few new bug fixes and the newly added GPL-compatible license.


    ### Python 2.0


    After the many legal dramas surrounding the release of the second-generation Python
    1.0 which corroborated into the release of an unplanned update (version `1.6.1`),
    Python was keen to put all behind and forge ahead. So, in October of 2000, Python
    `2.0` was released. The new release featured new additions such as list comprehensions
    which were obtained from other functional programming languages Haskell and SETL.
    The syntax of this latest version was akin to that found in Haskell, but different
    in that Haskell used punctuation characters while Python stuck to alphabetic keywords.

