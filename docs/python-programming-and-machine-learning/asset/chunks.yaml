    \ floating point numbers. If you run the type function on floats, you’ ll get\
    \ a type ‘float’.  \n\nHere’s a program to show some operations on floats: \n\n\
    w = 1.2 \\* 0.3 \n\nprint(w) \n\nx = 10.4 + 1.6 \n\nprint(x) \n\ny = 10.555 +\
