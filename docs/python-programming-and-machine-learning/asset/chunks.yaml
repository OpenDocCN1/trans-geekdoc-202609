- raw: "![Description: 00030.jpeg](Images/image00252.jpeg)  \n\nStep #4–Click on idle\
    \ to show the Python shell. \n\nWhen you click on any of the ‘idle’ displayed\
    \ on the menu, the ‘white’ shell will be displayed, as shown below: \n\n![Description:\
    \ 00031.jpeg](Images/image00253.jpeg)  \n\nThe differences between the three ‘idle’\
    \ menu, is that the first two ‘idle’ commands have the black box (shell) too,\
    \ while the last ‘idle’ has only the ‘white’ box (shell). I prefer the third ‘idle’\
    \ because it’ s easy to use. \n\nStep #5–Start using your Python shell. \n\nYou\
    \ can now start typing Python functions, using the shell above. \n\nYou may have\
    \ noticed that there are various entries to the contents of each of the files\
    \ that you have opened. You can click and open all of them, as you progress in\
    \ learning more about your Python programming.  \n\nPython is a programming language\
    \ that has been studied by students for several days or months. Thus, what’ s\
    \ presented in this book are the basics for beginners. \n\nThe rest of illustrations\
    \ will assume you are running the python programs in a Windows environment. \n\
    \n1.  Start IDLE \n\n2.  Navigate to the File menu and click New Window \n\n3.\
    \   Type the following: print (“Hello World!”) \n\n4.  On the file, menu click\
    \ Save. Type the name of myProgram1.py \n\n5.  Navigate to Run and click Run Module\
    \ to run the program. \n\nThe first program that we have written is known as the\
    \ “Hello World!” and is used to not only provide an introduction to a new computer\
    \ coding language but also test the basic configuration of the IDE. The output\
    \ of the program is “Hello World!” Here is what has happened, the Print() is an\
    \ inbuilt function, it is prewritten and preloaded for you, is used to display\
    \ whatever is contained in the () as long as it is between the double quotes.\
    \ The computer will display anything written within the double quotes. \n\nPractice\
    \ Exercise: Now write and run the following python programs: \n\n       print(“I\
    \ am now a Python Language Coder!”) \n\n        print(“This is my second simple\
    \ program!”) \n\n       print(“I love the simplicity of Python”) \n\n      \
    \ print(“I will display whatever is here in quotes such as owyhen2589gdbnz082”)\
    \ \n\nNow we need to write a program with numbers but before writing such a program\
    \ we need to learn something about Variables and Types. \n\nRemember python is\
    \ object-oriented and it is not statically typed which means we do not need to\
    \ declare variables before using them or specify their type. Let us explain this\
    \ statement, an object-oriented language simply means that the language supports\
    \ viewing and manipulating real-life scenarios as groups with subgroups that can\
    \ be linked and shared mimicking the natural order and interaction of things.\
    \ Not all programming languages are object oriented, for instance, Visual C programming\
    \ language is not object-oriented. In programming, declaring variables means that\
    \ we explicitly state the nature of the variable. The variable can be declared\
    \ as an integer, long integer, short integer, floating integer, a string, or as\
    \ a character including if it is accessible locally or globally. A variable is\
    \ a storage location that changes values depending on conditions. \n\nFor instance,\
    \ number1 can take any number from 0 to infinity. However, if we specify explicitly\
    \ that int number1 it then means that the storage location will only accept integers\
    \ and not fractions for instance. Fortunately or unfortunately, python does not\
    \ require us to explicitly state the nature of the storage location (declare variables)\
    \ as that is left to the python language itself to figure out that. \n\nBefore\
    \ tackling types of variables and rules of writing variables, let us run a simple\
    \ program to understand what variables when coding a python program are. \n\n\
           Start IDLE \n\n        Navigate to the File menu and click New Window\
    \ \n\n       Type the following: \n\n            num1=4 \n\n            num2=5\
    \ \n\n            sum=num1+num2 \n\n            print(sum) \n\n       On the\
    \ file, menu click Save. Type the name of myProgram2.py \n\n       Navigate to\
    \ Run and click Run Module to run the program. \n\nThe expected output of this\
    \ program should be “9” without the double quotes. \n\nDiscussion \n\nAt this\
    \ point, you are eager to understand what has just happened and why the print(sum)\
    \ does not have double quotes like the first programs we wrote. Here is the explanation.\
    \ \n\nThe first line num1=4 means that variable num1(our shortened way of writing\
    \ number1, first number) has been assigned 4 before the program runs. \n\nThe\
    \ second line num2=5 means that variable num2(our shortened way of writing number2,\
    \ second number) has been assigned 5 before the program runs. \n\nThe computer\
    \ interprets these instructions and stores the numbers given \n\nThe third line\
    \ sum=num1+num2 tells the computer that takes whatever num1 has been given and\
    \ add to whatever num2 has been given. In other terms, sum the values of num1\
    \ and num2. \n\nThe fourth line print(sum) means that display whatever sum has.\
    \ If we put double quotes to sum, the computer will simply display the word sum\
    \ and not the sum of the two numbers! Remember that cliché that computers are\
    \ garbage in and garbage out. They follow what you give them! \n\nNote: + is an\
    \ operator for summing variables and has other uses. \n\nNow let us try out three\
    \ exercises involving numbers before we explain types of variables and rules of\
    \ writing variables so that you get more freedom to play with variables. Remember\
    \ variables values vary for instance num1 can take 3, 8, 1562, 1. \n\nFollow the\
    \ steps of opening Python IDE and do the following: \n\n       The output should\
    \ be 54 \n\nnum1=43 \n\nnum2=11 \n\nsum=num1+num2 \n\nprint(sum) \n\n       The\
    \ output should be 167 \n\nnum1=101 \n\nnum2=66 \n\nsum=num1+num2 \n\nprint(sum)\
    \ \n\n       The output should be 28 \n\nnum1=9 \n\nnum2=19 \n\nsum=num1+num2\
    \ \n\nprint(sum) \n\n1.  Variables \n\nWe have used num1, num2, and sum and the\
    \ variable names were not just random, they must follow certain rules and conventions.\
    \ Rules are what we cannot violate while conventions are much like the recommended\
    \ way. Let us start with the rules: \n\nThe Rules of When Naming Variables in\
    \ Python \n\n1.  Variable names should always start with a letter or an underscore,\
    \ i.e. \n\nnum1 \n\n\\_num1 \n\n2.  The remaining part of the variable name may\
    \ consist of numbers, letters, and underscores, i.e. \n\nnumber1 \n\nnum\\_be\\\
    _r \n\n3.  Variable names are case sensitive meaning that capital letters and\
    \ non-capital letters are treated differently. \n\nNum1 will be treated differently\
    \ with num1. \n\nPractice Exercise \n\nWrite/suggest five variables for: \n\n\
           Hospital department. \n\n       Bank. \n\n       Media House.  \n\n\
    Given scri=75, scr4=9, sscr2=13, Scr=18 \n\n       The variable names in above\
    \ are supposed to represents scores of students. Rewrite the variables to satisfy\
    \ Python variable rules and conventions. \n\n2.  Conventions When Naming Variables\
    \ in Python \n\nAs earlier indicated, conventions are not rules per se are the\
    \ established traditions that add value and readability to the way we name variables\
    \ in Python. \n\n       Uphold readability. Your variables should give a hint\
    \ of what they are handling because programs are meant to be read by other people\
    \ other than the person writing them. \n\nnumber1 is easy to read compared to\
    \ n1. Similarly, first\\_name is easy to read compared to firstname or firstName\
    \ or fn. The implication of all these is that both are valid/acceptable variables\
    \ in python but the convention is forcing us to write them in an easy to read\
    \ form. \n\n       Use descriptive names when writing your variables. For instance,\
    \ number1 as a variable name is descriptive compared yale or mything. In other\
    \ words, we can write yale to capture values for number1 but the name does not\
    \ outrightly hint what we are doing. Remember when writing programs; assume another\
    \ person will maintain them. The person should be able to quickly figure out what\
    \ the program is all about before running it. "
