    ## 4. 注释和语句


    ### Python 中的语句

    Python 中的语句是指 Python 解释器可以处理/执行的指令。例如 `str=''I am a Programmer''` 和 `number1=3`。带有等号（=`）的语句被称为赋值语句。还有其他类型的语句，如
    `if`、`while` 和 `for`，它们将在稍后处理。


    ### 练习题

    - 编写一个 Python 语句，将第一个数字赋值为 18。

    - 编写一个编程语句，将第二个数字赋值为 21。

    - 上述的 `a.` 和 `b.` 是什么类型的语句？


    ## 5. 多行 Python 语句

    可以将一个语句跨越多行。这种语句被称为多行语句。编程语句的结束由换行符表示。为了将一个语句跨越几行，在 Python 中，我们使用反斜杠（`\`），它被称为续行符。多行语句的一个示例是：


    ```python

    sum=3+6+7+\

    9+1+3+\

    11+4+8

    ```


    上面的示例也被称为显式续行。在 Python 中，方括号（`[]`）表示续行，类似于圆括号/小括号（`()`），最后是大括号（`{}`）。


    上面的示例可以重写为：


    ```python

    sum=(3+6+7+

    9+1+3+

    11+4+8)

    ```


    注意：当我们使用圆括号时，去掉了被称为续行符的反斜杠（`\`），因为圆括号已经在完成续行符 `\` 完成的工作。


    问题：你认为为什么多行语句是必要的，我们直接写在一行且程序语句也能运行良好吗？


    答案：多行语句有助于提高整个程序的格式/可读性。记住，在编写程序时，始终假设是其他人将使用和维护它，而没有你的参与。


    ### 练习题：

    使用多行运算符（如 `\`、`[]`、`()` 或 `{}`）重写以下程序语句，以提高程序语句的可读性。


    - `total=2+9+3+6+8+2+5+1+14+5+21+26+4+7+13+31+24`

    - `count=13+1+56+3+7+9+5+12+54+4+7+45+71+4+8+5`


    分号也用于在单行中创建多个语句。假设我们要在 Python 程序中分配并显示四名员工的年龄。程序可以写成：


    `employee1=25; employee2=45; employee3=32; employee4=43.`


    ## 6. Python 中的缩进

    Python 中的缩进用于将程序行分类到一个块中。Python 中的缩进量完全取决于程序员。然而，确保一致性很重要。按照惯例，使用四个空格作为缩进而不是制表符。例如：


    注意：我们稍后会解释这是什么样的程序。


    Python 中的缩进也有助于让程序看起来整洁。缩进创建了一致性。然而，在执行续行时，可以忽略缩进。错误的缩进。


    ## 7. Python 中的注释

    在编写 Python 程序以及实际上任何语言时，注释都非常重要。注释用于描述程序内部发生的情况。这使得其他人查看程序时变得更容易。


    ### 示例

    -  IDLE

    - 导航到 File（文件）菜单并点击 New Window（新建窗口）

    - 输入以下内容：


    ```python

    #这是我的第一条注释

    #程序将打印

    print(''Hello World'') #这是一个用于显示的内置函数

    ```


    在 File 菜单中点击 Save（保存）。输入名称 `myProgram.py`

    导航到 Run（运行）并点击 Module（模块）来运行程序


