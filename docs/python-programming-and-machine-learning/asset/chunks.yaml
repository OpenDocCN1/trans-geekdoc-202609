    Next, we need to make sure that we are splitting up the data properly. We should
    have a group for testing and a group for training. Your training set should be
    much larger to ensure that you are properly training the data that you have and
    that the algorithm will get a good dose of the examples that you present and what
    you want it to do.


    ## Training and Testing Your Data


    As we go through some of the processes with working on our data and these algorithms,
    we have to make sure that we are training and testing all of the algorithms first.
    You can’t just write a few lines of code and then put in your data, hoping to
    get a good prediction to pop out. You need to take the time to train and test
    the data through that algorithm, to ensure that the accuracy is there, and to
    make sure that the algorithm is going to be ready for you to work with.


    The first step to this is going to be the training of your data. You have to make
    sure that you are spending a good deal of time training your data so that it knows
    the right way to behave. Out of the splitting of the data that we did before;
    you want to have about 75 to 85 percent of your data be in the training set. This
    ensures that you have enough data there that will help you to really train the
