    但是，离群值也可能意味着系统故障。调查离群值总是比直接丢弃它们要好。


    ## 平均值


    在统计分析中，找到数据样本的中心至关重要，因为它揭示了许多系统特征。平均值有很多类型，每种都代表着某些重要的意义。


    ### 平均数


    平均数是最常见的平均值类型。将所有数据值相加，然后除以数据值的总个数。例如，你向一家著名的杂货店出售购物袋，他们想知道每个购物袋能装多少东西。你用随机杂货完全填满了
    5 个购物袋并对其进行了重量。以下是以磅为单位的读数


    `5.5, 6.0, 4.95, 7.1, 5.0`


    你计算出的平均数为 `(5.5 + 6 + 4.95 + 7.1 + 5) / 5 = 5.71`。你可以告诉杂货店，你的购物袋平均装载 `5.71 lbs`。


    ### 中位数中位数是指样本数据按升序排列后，相对于数据位置的中心值。如果样本数据包含奇数个成员，则中位数是两侧数值个数相等的值。如果样本数据包含偶数个数值，则中位数通过找到两个两侧项目相等的中间数值的平均值计算得出。


    ### 众数


    众数是数据集中出现频率最高的值。如果样本数据中没有重复的值，则没有众数。


    ### 方差


    为了找到样本数据中每个数据值相对于样本数据平均值的变化程度，我们计算方差。这里有一个计算方差的通用公式。


    `sum of (each data point - mean of sample points )2 / number of data points in
    the sample.`


    如果数据的方差较低，意味着数据中没有离群值。


    ### 标准差


    我们对方差开平方根得到标准差。这把样本数据的平均值与整个样本数据联系起来。


    ### 概率没有人能准确预测未来会发生什么。我们只能以某种确定性预测即将发生的事情。事件发生的概率在数学上写为：


    `Probability = 事件发生的可能次数 / 总可能性`


    几点说明：

    1. 概率永远不会为负数。

    2. 概率范围在 0 到 1 之间。

    3. 为了计算概率，我们假设我们正在处理的事件集是独立发生的，不受任何干扰。


    找到一个事件的概率可能会改变后续事件某某发生的概率。这取决于我们如何与系统交互以寻找事件概率。


    ### 分布


    分布有很多类型。在书中，每当我们谈到分布时，除非明确说明，否则我们指的是概率分布。让我们以抛硬币为例，看看此类事件的分布情况。


    `H H H`

    `H H T`

    `H T H`

    `T T T`

    `T H H`

    `H T T`

    `T H T`

    `T T H`


    这是一个非常简单的事件，只有少数可能的结果。我们可以很容易确定不同结果的概率。但在具有数千或数百万可能结果的复杂系统中，这几乎是不可能的。在这些情况下，分布通过视觉化概率曲线的效果好得多。这比看一个巨大的分数或小小数表格更有意义。


    如果我们预先知道所有可能的结果，我们将这种概率分布称为离散分布。


    ## 什么是 Python


    Python 是一种被认为是解释型、通用型、高级和多范式的编程语言。Python 将允许使用它的程序员采用不同的编程风格来创建简单甚至某些复杂的程序，获得比以前更快的结果，并且编写代码几乎就像在用人类语言说话，而不是在和计算机交谈。


    这种语言非常流行，以至于你会发现许多主要公司已经将其用于它们的系统，包括 Google App Engine、Google Search、YouTube、iRobot
    机器人等。随着对这种语言的了解不断增加，我们可能会看到更多每天依赖的使用这种语言开发的应用程序和网站。


    Python 的最初开发由 Guido van Rossum 在 20 世纪 80 年代后期开始。今天，它由 Python 软件基金开发和运行。由于这种语言背后的特性，Python
    程序员可以使用许多不同的编程风格完成任务。Python 还可以用于许多用途，包括串口访问、游戏开发、数值编程和 Web 开发等。


    有几个不同的属性可以我们观察，它们展示了为什么 Python 的开发速度更快：


    1. Python 是一种解释型语言。这意味着在我们尝试执行代码之前不需要编译代码。它也是一种高级语言，会抽象掉许多复杂的细节，即使对于初学者也是如此。

    2. Python 代码通常比相似语言的代码更短。虽然它提供了更快的开发时间，但请注意执行时间会稍显滞后。与 `C` 和 `C++` 等其他语言相比，Python
    的执行速度会慢一些。


