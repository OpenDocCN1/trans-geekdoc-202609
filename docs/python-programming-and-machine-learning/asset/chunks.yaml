    \ \"sheet\" is created which is going to represent the sheet that we are going\
    \ to use.\n\nOnce all this is done, we are going to request the information of\
    \ the specific boxes \"C1\", \"C2\", \"C3\" next to the function value, to validate\
    \ that the information that we acquire is real, we print all the information requested.\n\
    \n# Handling PDF files\n\nIt is known that the initials of this type of file are:\
    \ \"Portable Document Format\", which have grown significantly over the years,\
    \ are mostly used in business and education. This is due to the fact that they\
    \ provide a great amount of benefits in which its security is highlighted, allowing\
    \ to add access keys to control who can edit the document and even add a watermark\
    \ to it to avoid plagiarism of information.\n\nOther outstanding data is that\
    \ these documents can be seen from any device since it is not necessary to have\
    \ a specific program; in addition, the weight of the files is much lower since\
    \ these texts are compressed, unlike Word documents.\n\nA disadvantage of PDF\
    \ files could be that they are not easy to edit once they have been created.\n\
    \nIn this chapter, we will only learn how to create PDF files.\n\nTo create a\
    \ PDF file the first thing we will have to do is to download the library through\
    \ the command `Pip3 install fpdf`, followed by this we can proceed to create our\
    \ document:\n\n![00089.jpeg](Images/image00272.jpeg)\n\nThis is a simple level\
    \ example, but at the same time, it is much more difficult than other types of\
    \ files. To start a document you need a lot of commands, for it we will import\
    \ the `FPDF` class from the `fpdf` library, followed by this we create the `pdfdoc`\
    \ object and this will be the pdf document. Once created this document, we will\
    \ have to customize the formats, size, and style of the letters we are going to\
    \ use. To do this we use the command `set_font`.\n\nIn this case, the type of\
    \ Font that we are going to use is going to be Times New Roman, with bold style\
    \ and a size of 12. Followed by this we will add a page through the command `add_page()`,\
    \ since we will need a page on which to write and `fpdf` does not create a blank\
    \ page by default. Then, we're going to insert information with `cell()` function\
    \ which contains a set of important arguments. The `cell` function will contain\
    \ width and height that the cell will occupy, it must include the message that\
    \ will be written in string format, in case it is required that the edges come\
    \ with some detail we must add 1 since 0 is by default and does not allow anything.\
    \ If you want to add a cell below or located to the right, you place 0 and otherwise\
    \ is placed 1, if you want the text to be centered to the right, up or down a\
    \ string will be placed and if you want it to be centered you write C. Finally\
    \ we will have to save the document through the command `output()`, and the arguments\
    \ that will go with them will be the name of the file (with \".pdf\") and then\
    \ string \"F\".\n\n# Managing BIN\n\nAs we saw earlier, not all files are necessarily\
    \ text files. These same ones can be processed by lines and even exist certain\
    \ files that when being processed, each byte contains a particular meaning for\
    \ the program; for that reason, they need to be manipulated in their specific\
    \ format. A clear example of this are the Binary files, to work with this type\
    \ of files is adding `b` in the space mode.\n\n![00090.jpeg](Images/image0273.jpeg)\n\
    \nWhen handle a binary file, it is very important to know the current position\
    \ of the data we need in order to modify it. If you don't know the current position,\
    \ the `tell()` function will indicate the number of bytes that have elapsed since\
    \ we started the file. In case you want to modify the current position in the\
    \ file, we use the function `file.seek()` which will allow us to move a certain\
    \ amount of bytes from start to finish.\n\n# Exception Handling\n\nException handling\
    \ is error management. It has three purposes:\n1. It allows you to debug your\
    \ program.\n2. It allows your program to continue running despite an error or\
    \ exception.\n3. It allows you to create your customized errors that can help\
    \ you debug, remove some of Python’s nuances, and make your program as you want\
    \ it to.\n\n## Handling the Zero Division Exception\n\nException handling can\
    \ be an easy or difficult task depending on how you want your program to flow\
    \ and your creativity. You might have scratched your head because of the word\
    \ creativity. Programming is all about logic, right? No. The core purpose of programming\
    \ is to solve problems. A solution to a problem does not require logic. It also\
    \ requires creativity. Have you ever heard of the phrase “Think outside of the\
    \ box?” Program exceptions can be a pain and they are often called bugs. The solution\
    \ to such problems is often elusive. You need to find a workaround or risk rewriting\
    \ your program from scratch.\n\nFor example, you have a calculator program with\
    \ this snippet of code when you divide:\n\n```\ndef div(dividend, divisor):\n\
    \    print(dividend / divisor)\n\ndiv(5, 0)\nTraceback (most recent call last):\n\
    \  File \"<stdin>\", line 1, in <module>\n  File \"<stdin>\", line 2, in div\n\
    ZeroDivisionError: division by zero\n```\n\nOf course, division by zero is an\
    \ impossible operation. Because of that, Python stops the program since it does\
    \ not know what you want to do when this is encountered. It does not know any\
    \ valid answer or response. That being said, the problem here is that the error\
    \ stops your program entirely. To manage this exception, you have two options.\
    \ First, you can make sure to prevent such operation from happening in your program.\
    \ Second, you can let the operation and errors happen, but tell Python to continue\
    \ your program.\n\nHere is what the first solution looks like:\n\n```\ndef div(dividend,\
    \ divisor):\n    if (divisor != 0):\n        print(dividend / divisor)\n    else:\n\
    \        print(\"Cannot Divide by Zero.\")\n\ndiv(5, 0)\nCannot Divide by Zero.\n\
    ```\n\nHere is what the second solution looks like:\n\n```\ndef div(dividend,\
    \ divisor):\n    try:\n        print(dividend / divisor)\n    except:\n      \
    \  print(\"Cannot Divide by Zero.\")\n\ndiv(5, 0)\nCannot Divide by Zero.\n```\n\
    \nRemember the two core solutions to errors and exceptions. One, prevent the error\
    \ from happening. Two, manage the aftermath of the error.\n"
  trans: "\n我们可以观察到，我们按照之前过的步骤创建了文档“test.xlsx”，我们可以观察到我们创建了一个名为 `messages` 的元组，该元组包含三个项目：“Hello”、“goodmorning”\
    \ 和“goodnight”。\n\n一旦创建了元组，我们就使用 `append` 函数，它允许我们附加元组 `messages` 中包含的所有信息，并通过\
    \ `save` 函数保存文档。\n\n`append()` 函数只接受可迭代数据，这意味着什么呢？这指的是数组类型的数据，如列表、元组，因为如果不以这种方式输入，我们的程序将返回错误。\n\
    \n# 读取 xlsx 文档\n\n![00088.jpeg](img/image00271.jpeg)\n\n让我们回到第一个示例来从 xlsx 文件中获取信息，我们可以看到，为了这一点，我们导入了\
    \ `load_workbook` 类。我们首先需要知道的是想要打开的文件名，为了这一点，我们创建了同名的变量。\n\n文件必须位于存储程序相同的文件夹中，这一点很重要，否则程序将向我们抛出错误。在\
    \ `xlsdoc()` 函数内部，我们将创建一个对象 `wb`，我们将用它来工作，接着创建一个对象 \"sheet\"，它将代表我们将使用的工作表。\n\n\
    完成所有这些后，我们将请求函数值旁边特定单元格“C1”、“C2”、“C3”的信息，以验证我们获取的信息是真实的，我们打印所有请求的信息。\n\n# 处理 PDF\
    \ 文件\n\n众周知，这种文件的缩写是：“便携文档格式”（Portable Document Format），它们在多年里显著增长，主要用于商业和教育领域。这是因为它们提供了许多益处，其中安全性尤为突出，允许添加访问密钥来控制谁可以编辑文档，甚至可以添加水印以避免信息抄袭。\n\
    \n其他突出的数据是，这些文档可以从任何设备查看，因为不需要特定的程序；此外，文件权重低得多，因为这些文本经过了压缩，不像 Word 文档。\n\nPDF\
    \ 文件的一个缺点可能是它们一旦创建就不易于编辑。\n\n在本章中，我们将只学习如何创建 PDF 文件。\n\n要创建一个 PDF 文件，我们要做的第一件事是通过命令\
    \ `Pip3 install fpdf` 下载库，接着我们可以继续创建我们的文档：\n\n![00089.jpeg](img/image00272.jpeg)\n\
    \n这是一个简单层级的示例，但同时，它比其他类型的文件要困难得多。启动一个文档需要很多命令，为此此，我们将从 `fpdf` 库中导入 `FPDF` 类，接着我们创建\
    \ `pdfdoc` 对象，这将是 pdf 文档。一旦创建了这个文档，我们必须自定义将使用的字体格式、大小和样式。为了做到这一点，我们使用 `set_font`\
    \ 命令。\n\n在这种情况下，我们将使用的字体类型将是 Times New Roman，加粗样式，大小为 12。接着我们通过 `add_page()` 命令添加页面，因为我们需要一个页面来写字，而\
    \ `fpdf` 默认不会创建空白。然后，我们将使用 `cell()` 函数插入信息，该函数包含一组重要的参数。`cell` 函数将包含单元格占据的宽度和高度，它必须包含以字符串格式写入的消息，如果需要边缘带有某些细节，我们必须加\
    \ 1，因为 0 是默认值且不允许任何设置。如果你想在下方或右侧添加单元格，放置 0，否则放置 1；如果你想让文本向右、向上或向下居中，将放置一个字符串，如果你想让它居中，则写\
    \ C。最后，我们将通过 `output()` 命令保存文档，随之而来的参数将是文件名（带有 \".pdf\"）以及字符串 \"F\"。\n\n# 管理 BIN\n\
    \n正如我们之前看到的，并不是所有文件都是文本文件。这些相同的文件可以按行处理，甚至存在某些文件，当被处理时，每个字节对程序都有特定的意义；因此，它们需要在其特定的格式中进行操作。这的一个清晰的例子是二进制文件（Binary），与这类文件工作的方法是在空间模式中添加\
    \ `b`。\n\n![00090.jpeg](img/image0273.jpeg)\n\n处理二进制文件时，非常重要的是知道我们需要的数据当前位置以便对其进行修改。如果你不知道当前位置，`tell()`\
    \ 函数将指示自我们开始文件以来已通过的字节数。如果你想修改文件中的当前位置，我们使用 `file.seek()` 函数，它允许我们从开始到结束移动数量的字节。\n\
    \n# 异常处理\n\n异常处理是错误管理。它有三个目的：\n1. 它允许你调试程序。\n2. 它允许你的程序在出现错误或异常的情况下继续运行。\n3. 它允许你创建自定义错误，可以帮助你调试，移除\
    \ Python 的一些细微差别，并让你的程序如你所愿。\n\n## 处理除零异常\n\n异常处理可能是一项简单任务，也可能是一项艰巨任务，取决于你如何让你的程序运行。你可能会因为“创造性”这个词而抓耳挠腮。编程全是逻辑，对吗？不。编程的核心目的是解决问题。问题的解决方案并不需要逻辑。它还需要创造性。你听过“跳出框架思考”这句话吗？程序异常可能是痛苦的，它们通常被称为\
    \ Bug。此类问题的解决方案往往难以捉摸。你需要找到一种解决方法，或者冒从头重写程序。\n\n例如，你有一个计算器程序，当你除法时有这段代码：\n\n```\n\
    def div(dividend, divisor):\n    print(dividend / divisor)\n\ndiv(5, 0)\nTraceback\
    \ (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n  File \"\
    <stdin>\", line 2, in div\nZeroDivisionError: division by zero\n```\n\n当然，除零是不可能的的操作。正因如此，Python\
    \ 会停止程序，因为它在遇到这种情况时不知道你想做什么。它不知道任何有效的答案或响应。尽管如此，问题在于这个错误完全停止了你的程序。为了管理这个异常，你有两个选择。首先，你可以确保防止这种操作在程序中发生。其次，你可以让操作和错误发生，但告诉\
    \ Python 继续你的程序。\n\n这是第一种解决方案的样式：\n\n```\ndef div(dividend, divisor):\n    if\
    \ (divisor != 0):\n        print(dividend / divisor)\n    else:\n        print(\"\
    Cannot Divide by Zero.\")\n\ndiv(5, 0)\nCannot Divide by Zero.\n```\n\n这是第二种解决方案的样式：\n\
    \n```\ndef div(dividend, divisor):\n    try:\n        print(dividend / divisor)\n\
    \    except:\n        print(\"Cannot Divide by Zero.\")\n\ndiv(5, 0)\nCannot Divide\
    \ by Zero.\n```\n\n记住处理错误和异常的两个核心解决方案。之一，防止错误发生。之二，管理错误发生后的后果。\n"
