    ## 3. Python 编程语言中的关键字和标识符


    到这里，你可能在疑惑为什么必须以那种方式使用 `print` 和 `str`，而没有自由或知道为什么这些单词必须那样写。`print` 和 `str` 构成了一类特殊的单词，这些单词必须始终那样写。每种编程语言都有自己的一套关键字。在大多数情况下，某些关键字出现在多种编程语言中。关键字在
    Python 中是大小敏感的，这意味着我们必须始终以小写形式输入。关键字不能用于命名函数（我们稍后会解释什么是函数）或变量。


    Python 中有 33 个关键字，除了 `None`、`False` 和 `True` 之外，全部都是小写的。它们必须始终按照所示的形式书写：


    注意：`print()` 和 `str` 是函数，但它们是 Python 中的内置/预载函数。函数是一组在调用时起作用的规则和方法。例如，`print` 函数在激活/触发/调用时将显示输出。到此时，你还没有遇到所有的关键字，但你将逐渐遇到它们。花些时间扫读、阅读并尝试尽可能多地记住它们。


