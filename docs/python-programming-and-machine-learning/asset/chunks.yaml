    \ directory and filename.\n*   You did not specify the directory.\n*   You did\
    \ not include the correct file extension.\n*   The file does not exist.\n\nThe\
    \ first method to handle the `FileNotFoundError` exception is to make sure that\
    \ all the common reasons do not cause it. Once you do, then you will need to choose\
    \ the best way to handle the error, which is completely dependent on the reason\
    \ you are opening a file in the first place.\n\n## Checking If File Exists\n\n\
    Again, there are always two ways to handle an exception: preventive and reactive.\
    \ The preventive method is to check if the file exists in the first place.\n\n\
    To do that, you will need to use the `os` (`os.py`) module that comes with your\
