    我们需要探索的 Python 编程语言第一个方面是注释。在编写代码的过程中，总会有某些时刻，你想停下来，并向他人以及你自己解释代码中发生了什么。这可以确保任何看到代码的人都知道从某一个点到另一个点在发生什么。在项目中使用注释是你在项目中展示这些内容的方式，并可以让其他人更容易知道该部分的名称，或者理解你之所以选择做某件事而不是另一件事的原因。


    当你想要在代码中添加一些注释时，你需要在所选单词前面加上一个特殊的字符。这个特殊字符将帮助你告诉程序，它应该跳过这些单词的读取，转而处理代码的下一个部分。为此使用的特殊字符就是你所写注释开前的
    `#` 号。当编译器看到它时，它就知道你完全不想执行那部分代码。它将等待到下一行再开始重新读取代码。你可能会在代码看到的注释示例包括：


    ```

    #this is a new comment. Please do not execute in the code.

    ```


    当你写完这里需要的注释并完成后，你就可以按回车键或回车键，以便编写更多编译器可以执行的代码。你可以根据代码的需要，自由地编写任何长度的注释。你也可以编写任意数量的此类注释。通常情况下，将注释保持在需要的范围内被认为是一个更好的选择。否则，这会让代码整体看起来有点杂乱。从技术上讲，你可以在代码中添加任何数量数量的此类注释。


    ## 语句 (The Statements)


    我们需要关注的代码下一个部分是语句。每当你开始编写新代码时，无论你使用的是 Python 还是过程中的其他编程语言，都必须在代码中添加这些语句。这允许编译器知道你想让内部发生什么。语句是你想要发送给解释器的一个代码单元。从那里开始，解释器将查看该语句并根据你添加的命令来执行它。


    每当你决定编写代码时，你都可以选择需要多少语句来让代码为你运行。有时，你需要在一个代码块中使用一条语句，而在其他时候，你可能想要有多个。只要你记住语句应该保持在代码的括号内，你可以随意将语句写得多长，并包含你想要的任何数量的语句。


    当你准备好编写代码并在代码中添加至少一条语句时，你就需要将其发送出去，以便解释器处理所有内容。只要解释器能够理解你尝试编写的语句，它就会执行你的命令。该语句的结果将显示在屏幕上。如果你发现编写代码后某些内容没有以正确的方式显示，那么你需要回过头检查它们是否写得正确。


    现在，这些听起来可能有很多信息，但有一种方法可以减少困惑并确保它们对你更有意义。让我们来看看这些内容是如何运行的示例。


    ```

    x = 56

    Name = John Doe

    z = 10

    print(x)

    print(Name)

    print(z)

    ```


    当你将其发送给解释器时，屏幕上应该显示的结果是：


    ```

    56

    John Doe

    10

    ```


    就是这么。打开 Python，尝试一下看看让几个结果显示在你的解释器中有多简单。


    ## 变量 (The Variables)


    我们在 Python 代码中考虑的下一个内容是变量。学习这些变量很重要，因为它们是将你的代码存储在正确的位置，以便你以后可以调用它们。这意味着如果你以正确的方式执行这个过程，变量位于计算机内存的正确位置。代码中的数据将帮助确定这些点存储在内存的哪些位置，这让你在需要运行代码时更容易找到信息。


    我们在这里需要关注的第一点是确保变量被分配了一个值。如果变量没有值，那么变量就没有任何东西可以保存和存储。如果变量从开始被赋予一个良好的值，那么当你执行程序时，它将以你预期的方式运行。


    对于你的 Python 代码，有三种变量供你选择。它们都很重要，并有它们的工作位置。但你必须根据想要附加到该变量上的值来选择正确的一个。Python 中提供的主要变量包括：


    1. **浮点数 (Float)**：这是一个包含如 `3.14` 等数字的整数变量。

    2. **字符串 (String)**：这是你编写的语句之一。你可以在其中添加任何你喜欢的短语。

    3. **整数 (Whole number)**：这是你想要使用的任何其他数字，即不包含小数的数字。


    当你尝试在程序中使用变量时，你不需要通过声明来确保内存空间可用。这是 Python 在为变量分配值时可以自动为你完成的事情。如果你想确保这在你的代码中发生，并避免过程中的某些惊喜，你需要双检等号（赋予变量值的符号）是否在正确的位置。编写代码时这种形式的绝佳示例如下：


    ```

    x = 12#this is an example of an integer assignment

    pi = 3.14#this is an example of a floating point assignment

    customer name = John Doe #this is an example of a string assignment

    ```


    在某些情况下，你可能需要一个变量附加两个或更多值。在某些时刻，你无法避免这种情况并需要它发生。好消息是，你可以按照上述的相同程序来实现，你只需要确保每个部分都有等号，以便编译器知道如何分配一切。所以，当你想要这样做时，你会编写类似
    `a = b = c = 1` 的内容。


    ## 关键字 (The Keywords)


    当你使用 Python 语言时（就像在其他编程语言中一样），你会遇到在代码中被保留为命令的单词，这些被称为关键字。你需要小心使用这些词，因为它们是为了告诉程序某些命令，以及你希望它如何运行。你不想在特定命令之外的任何地方引入并使用它们。


    如果你误用了这些关键字，将导致代码内部产生一些困惑。解释器将不知道做什么，计算机可能会在它需要执行的任务上停止。随着我们继续阅读本指南并开发一些机器学习的
    Python 代码，我们将开始识别一些需要注意的常见关键字。


    ## 命名你的标识符 (Naming Your Identifiers)


