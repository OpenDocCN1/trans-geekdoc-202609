- raw: "The first aspect of the Python coding language that we need to explore is\
    \ that of comments. There is going to be some point when you are writing out a\
    \ code where you would like to take a break and explain to others and yourself\
    \ what took place in the code. This is going to ensure that anyone who sees the\
    \ code knows what is going on at one point to another. Working with a comment\
    \ is the way that you would showcase this in your project, and can make it easier\
    \ for others to know the name of that part, or why you are doing one thing compared\
    \ to another. \n\nWhen you would like to add in some comments to the code, you\
    \ are going to have a unique character that goes in front of your chosen words.\
    \ This unique code is going to be there to help you tell the computer program\
    \ that it should skip reading those words and move on to the next part of the\
    \ code instead. The unique character that you are going to use for this one is\
    \ the # sign in front of the comments you are writing. When the compiler sees\
    \ this, it is going to know that you don’t want that part of the code to execute\
    \ at all. It will wait until the next line before it gets started with rereading\
    \ the code. An example of a comment that you may see in your code would include:\n\
    \n#this is a new comment. Please do not execute in the code. \n\nAfter you have\
    \ written out the comment that you want here, and you are done with it, you are\
    \ then able to hit the return button or enter so that you can write more code\
    \ that the compiler can execute. You can have the freedom to comment as long or\
    \ as short as you would like based on what you would need in the code. And you\
    \ can write in as many of these comments as you would like. It is usually seen\
    \ as a better option if you keep the comments down to what you need. Otherwise,\
    \ it makes the code start to look a little bit messy overall. But you can technically\
    \ add in as many of these comments to your code as you would like. \n\nThe Statements\
    \ \n\nThe next part of the code that we need to focus on is the statements. Any\
    \ time that you are starting with your new code, whether you are working with\
    \ Python or with some other coding language along the way, you must add these\
    \ statements inside of the code. This allows the compiler to know what you would\
    \ like to happen inside. A statement is going to be a unit of code that you would\
    \ like to send to your interpreter. From there, the interpreter is going to look\
    \ over the statement and execute it based on the command that you added in. \n\
    \nAny time you decide to write out the code, you can choose how many statements\
    \ are needed to get the code to work for you. Sometimes, you need to work with\
    \ one statement in a block of code, and other times, you will want to have more\
    \ than one. As long as you can remember that the statements should be kept in\
    \ the brackets of your code, it is fine to make the statement as long as you would\
    \ like, and include as many statements as you would like. \n\nWhen you are ready\
    \ to write your code and add in at least one statement to your code, you would\
    \ then need to send it over so that the interpreter can handle it all. As long\
    \ as the interpreter can understand the statements that you are trying to write\
    \ out, it is going to execute your command. The results of that statement are\
    \ going to show up on the screen. If you notice that you write out your code and\
    \ something doesn’t seem to show up in it the right way, then you need to go back\
    \ through the code and check whether they are written the right way or not. \n\
    \nNow, this all may sound like a lot of information, but there is a way to minimize\
    \ the confusion and ensure that it can make more sense to you. Let’s take a look\
    \ at some examples of how this is all going to work for you. \n\nx = 56 \n\nName\
    \ = John Doe \n\nz = 10 \n\nprint(x) \n\nprint(Name) \n\nprint(z) \n\nWhen you\
    \ send this over to the interpreter, the results that should show up on the screen\
    \ are: \n\n56 \n\nJohn Doe \n\n10 \n\nIt is as simple as that. Open up Python,\
