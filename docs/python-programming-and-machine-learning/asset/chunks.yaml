    ## Define Objective

    The first step, as it is with any other task that you perform, is to define the
    purpose or the objective you want to accomplish using your system. This is an
    important step since the data you will collect, the algorithm you use, and many
    other factors depend on this objective.


    ## Collect Data

    Once you have your objective in mind, you should collect the required data. It
    is a time-consuming process, but it is the next important step that you must achieve.
    You should collect the relevant data and ensure that it is the right data for
    the problem you are trying to solve.


    ## Prepare Data

    This is another important step, but engineers often overlook it. If you do overlook
    this step, you will be making a mistake. It is only when the input data is clean
    and relevant that you will obtain an accurate result or prediction.


    ## Select Algorithm

    Numerous algorithms can be used to solve a problem, including Structured Vector
    Machine (SVM), k-nearest, Naive-Bayes and Apriori, etc. You must choose the algorithm
    that best suits the objective.


    ## Train Model

    When your data set is ready, you should feed it into the system and help the machine
    learn using the chosen algorithm.


    ## Test Model

    When your model is trained, and you believe that it has provided the relevant
    results, you can test the accuracy of the model using a test data set.


    ## Predict

    The model will perform numerous iterations with the training data set and the
    test data set. You can look at the predictions and provide feedback to the model
    to help it improve the predictions that it makes.


    ## Deploy

    Once you have tested the model and are happy with how it works, you can sterilize
    that model and integrate it into any application that you want to use. This means
    that the model that you have developed can now be deployed.


    The steps followed will vary depending on the type of application and algorithm
    that you are using. You can choose to use a supervised or unsupervised machine
    learning algorithm. The steps mentioned in this section are often the steps followed
    by most engineers when they are developing a machine learning algorithm. There
    are numerous tools and functions that you can use to build a machine learning
    model. This book will help you with understanding more about how you can design
    a machine learning model using `Python`.


    # Chapter 3: Big Data and Machine Learning


    In order to learn something, a system that is capable of machine learning needs
    to be exposed to a lot of data. Going back several decades, computers didn’t have
    access to all that much data, in comparison to what they can access today. Computers
    were slow and quite awkward. Most data at that time was stored on paper, and so
    it was not readily accessed by computer systems. There was also far less of it.
    Of course, companies and large businesses, along with governments have always
    collected as much data as they could, but when you don’t have that much data and
    it’s mostly in the form of paper records, then you don’t have much data that is
    useful to a machine learning computer system.


    The first databases were invented in the late 1960s. A database is not really
    what we think of when considering the relationship between data and machine learning,
    although it could be in some circumstances. Databases collect very organized information.
    To understand the difference, think about a collection of Facebook posts, versus
    a record of someone registering to enroll at a university. The collection of Facebook
    posts is going to be disorganized and messy. It is going to have data of different
    types, such as photos, videos, links, and text. It’s going to be pretty well unclassified,
    maybe only marked by who posted it and the date.


    In contrast, when you say database you should think completely organized and restricted
    data. A database is composed of individual records, each record containing the
    same data fields. At a university, students when enrolled might enter their name,
    social security or ID number, address, and so on.


    All of these records are stored in the same format, together in one big file.
    The file can then be “queried” to return records that we ask for. For example,
    we could have it return records for everyone in the Freshman class.


    Relational databases allow you to cross reference information and bring it together
    in a query. Following our example, you could have a separate database that had
    the courses each student was taking. This could be stored in a separate database
    from the basic information of each student, but it could be cross referenced using
    a field as a student ID.


    Tools were developed to help bring data together from different databases. IBM,
    a company that always seems to figure large in many developments in computer science,
    developed the first structured query language or `SQL`, that could be used to
    do tasks like this. Once data could be pulled together, it could be analyzed or
    used to do things like print out reports for human operators.


    As computers became more ubiquitous, companies and government agencies began collecting
    more and more data. But it wasn’t until the late 1990s that the amount of data
    and types of data began to explode. There were two developments that led to these
    changes. The first was the invention of the internet. The second was the development
    of ever improving and lower cost computer storage capacity.


    The development and commercialization of the internet meant that over a very short
    time period, nearly everyone was getting “online”. Businesses moved fast to get
    online with websites. Those that didn’t fall behind, and many ended up going out
    of business. But that isn’t what’s important for our purposes. The key here is
    that once people got online, they were leaving data trails all over the place.

