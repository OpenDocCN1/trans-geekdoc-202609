    这个数据生命周期将包含几个阶段，我们将从一些基础知识开始，讨论每一个阶段，以帮助我们了解可用数据能做些什么。


    ### 1. 数据采集 (Data Capture)

    首先，我们处理数据采集。个人或公司与某个数据项的首次接触，应该是让它通过企业的防火墙。这被称为“数据采集”（Data Capture），它基本上是创建在该企业中尚不存在且从未在该企业中存在过的数据值的行为。你可以通过三种方式来采集数据，包括：


    *   **数据获取 (Data acquisition)**：这是指摄入已由组织产生但在所选企业之外的现有数据。

    *   **数据录入 (Data entry)**：这是我们处理创建新的数据值以帮助企业的过程，由设备或人工操作员完成，可以帮助生成所需的数据。

    *   **信号接收 (Signal reception)**：这是我们捕获设备创建的数据，通常在控制系统中，但如果我们愿意，也可以在物联网中找到。


    ### 数据维护 (Data Maintenance)

    下一部分被称为“数据维护”（Data Maintenance）。在这里你将数据提供到某些点，以便在接下来的步骤中进行数据合成和数据使用。如果你能够理清这些点并使它们在这一阶段准备就绪，那是最好的。


    在数据维护期间，我们将看到正致力于处理数据，但尚未尚未真正努力从中推导出任何价值。这包括整合已更改的数据、清洗，以及在开始之前确保数据处于正确的格式并尽可能完整。这确保了无论你在这里选择什么种方法或算法，你都能让数据准备好就绪。


    ### 数据合成 (Data Synthesis)

    一旦你能够维护数据并完成所有清理，就是时候处理被称为“数据合成”（Data Synthesis）的部分了。这是该周期中一个较新的阶段，在某些地方你可能看不到它的发生。在这里，我们通过归纳逻辑创建一些数据值，并使用我们从其他地方获得的某些数据作为输入。数据合成是分析的领域，它将使用某种建模来帮助你最终获得正确的结果。


    ### 数据使用 (Data Usage)

    接下来是数据使用。数据使用是流程中的某部分，我们将数据作为信息应用于企业运行所需的任务中，然后由其自行处理管理。这通常属于你数据生命周期之外的任务。然而，数据正成为大多数业务模型中的核心部分，完成这部分工作可以产生巨大的影响。


    例如，数据本身可以是一种服务或产品，或者至少是该服务或产品的一部分。这样它也就成为数据使用的一部分。在数据治理方面，数据的使用将面临一些特殊挑战。其中之一是，以大多数业务人士希望的方式使用数据是否是合法的。可能会存在一些合同或监管限制，限制了我们如何使用这些数据，尽可能维护这些限制是非常重要的。


    ### 数据发布 (Data Publication)

    一旦我们确定了数据使用方法，就是时候转向数据发布了，这意味着数据已发送到公司或企业之外。


    ### 数据归档 (Data Archival)

    列表上的下一项是数据归档。我们将看到，我们处理的单个数据值有时会经历很多轮使用和发布，但最终它将到达其生命的终点。第一部分意味着我们需要能够获取数据值并将其归档。当我们处理数据归档过程时，意味着我们将数据复制到存储在某个环境中，以防我们在活跃的生产环境中再次需要它，然后我们从所有这些活跃环境中移除该数据。


    这种类型的数据归档仅仅是一个存储数据的地方，在那里不会发生任何发布、使用或维护。如果有必要，可以将归档中的任何数据提取并取出来再次使用。


    ### 数据清除 (Data Purging)

    最后，我们到达数据清除部分。这是我们的单个数据值及其经历过的生命周期的终点。数据清除是指我们从企业中删除数据的每一个副本。如果可能，你将通过归档获取这些信息。如果在此处面临来自数据治理的挑战，那仅仅是为了证明信息和数据在当时已经经过了正确的清除程序。


    ### 2. 使用数据分析以及为什么它很重要 (Working with data analysis and why it is important)

    考虑到这些，我们需要注意最初我们为什么要想进行数据分析？我们真的需要通过查看所有信息来寻找趋势吗，还是有其他方法？让我们看看当我们进行这种数据分析时会发生什么，以及为什么你想要使用它。


    让我们考虑我们正在查看一组数据，其中 2015 年至 2018 年间全球发生的天气信息。我们还将会有这些年份基于国家的信息。因此，将会有一个该国家降雨的百分比，我们也将会有关于此方面的数据。


    现在，如果你想查看所有数据，但只想查看特定国家的数据呢？假设你想查看美国，并想它在 2016 年到 2017 年之间接收的降水百分比。现在，你将如何以快速高效的方式获取这些信息？


    为了确保我们能够获得这组数据，我们需要做的是进行数据分析。有几种算法，特别是来自机器学习的算法，可以帮助你算出美国 2016 年到 2017 年的降水百分比。这整个过程被称为数据分析的本质。


    ### 3. Python Pandas 库 (The Python Pandas Library)

    在 Python 中进行数据分析时，你可以使用的扩展是 `Pandas`。这是一个与 Python 良好工作的开源库，它将为你提供高级别的性能、初学者也易于使用的数据结构，以及使用
    Python 简化数据分析的工具。这种语言有很多值得享受的地方，如果你想通过 Python 的帮助筛选你所拥有的所有优秀信息，那么这个库就是你需要的。


    在处理 Python 库时，有很多可以享受的地方。首先，它是数据科学领域最流行且易于使用的库之一，它运行在 `NumPy` 库之上。


    '
