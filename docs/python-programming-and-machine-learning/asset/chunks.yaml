  trans: '

    生物神经网络启发了人工神经系统的设计与开发。人们利用人工神经网络来解决预测、关联记忆、优化、识别和控制等多个问题。因此，神经系统由大量连接的处理单元组成，这些单元共同工作处理信息并产生显著的结果。


    人脑由数百万个神经元组成，通过化学和电信号来处理并发送信号。突触是连接神经元的特定结构，允许信息在它们之间传递。神经网络形成了大量的模拟神经元。同样，人工神经系统也有一系列相互连接的神经元，它们从输入中计算值。


    它们使用大量的连接处理单元（充当神经元）来完成信息处理。许多单元组在计算算法中形成了神经网络。这些网络包括输入层、输出层以及隐藏层，隐藏层可以将输入转换为输出层可以利用的形式。


    人工神经网络是识别模式的完美工具，这些模式对于人类来说过于复杂无法检索，且可以教会计算机进行识别。在程序员进行仔细训练后，它还可以对大量数据进行分类。在这种情况下，深度学习神经网络提供分类。随后，程序员使用
    `backpropagation`（反向传播）来纠正分类过程中发生的错误。


    `backpropagation` 是个人用于计算梯度失败或损失函数的方法。深度学习网络提供了多层系统，可以从输入中识别并提取某些相关元素，并将它们结合产生最终的显著输出。它利用复杂的特征检测来根据用户需要识别并分类数据。训练网络的程序员在执行
    `backpropagation` 之前会对输出进行标记。


    因此，人工神经网络是以生物中枢神经系统为蓝图和灵感的计算模型。理解神经网络使人能够发现并理解存在的相似之处。它还让他们注意到人工智能与生物智能系统之间的差异。他们还知道如何应用合适的特性来改进和优化信息及功能。


    ## 人工神经网络的类型


    人工神经网络是从人类大脑中汲取灵感的计算算法。某些类型的网络利用数学过程和一组参数来建立输出。不同种类的神经网络有：


    ### 柯霍南自组织神经网络


    这种类型的系统使用 `Kohonen''s self-organizing neural map`（柯霍南自组织神经映射）来可视化和分类高维数据。神经网络形成从
    `N` 维空间到神经元（即单元位置）的布局。在这种情况下，`N` 维空间是任意的。该地图维持了随机维度范围的拓扑连接。`U-matrix` 方法可以将 `N`
    维空间中的设计或系统可视化。它还能识别该网络提供的布局中的不规则。


    程序员训练网络产生的映射，使其能够形成训练或教学数据的排列。在训练过程中，值决定了神经元在保持不变的情况下权重如何变化。自组织过程的第一阶段由输入向量和小权重初始化每个神经元的值。第二阶段包括胜出神经元，即距离某点最近的神经元。与这些胜者连接的其他神经元也向该点移动。`Euclidean
    distance`（欧式距离）计算神经元与点之间的距离，最小距离产生胜者。循环导致位置的聚类，每个神经元代表每一类型的类。


    人们可以将数据进行聚类，因为它可以识别数据各个子组之间的界限。人们使用关联来对新输入进行分类。这种神经系统还允许用户获取知识并分析探索性数据。人们用它识别数据并将聚类数据准确分析为各种分类。


    ### 前馈神经网络 – 人工神经元


    这种类型是最容易获取的神经网络形式，因为数据沿单方向移动。数据通过输入节点并从输出节点出来。前馈神经网络类型没有 `backpropagation`，只具有前向传播。因此，它可能包含或不包含隐藏层。它通常还使用激活函数用于分类。


    系统计算权重和输入的乘积总和，并将该和输入输出。产生的输出被激活或去激活，取决于阈值值。这个边界通常为零，如果值等于或高于一，神经元就会释放一个激活输出。另一方面，如果乘积小于零，神经元就不会释放它，而是由网络发送去激活的值。


    `Feedforward Neural Network`（前馈神经网络）对噪声输入有反应且易于维持。它存在于计算机的语音和视觉识别特征中，因为它可以分类复杂的目标类别。


    ### 径基函数神经网络


    这种神经系统观察点相对于中心的距离，由两层组成。特征最初与内层存在的 `Radial Basis Function`（径基函数）结合。系统在后续步骤（即内存）处理相同产品时，会考虑相关元素产生的输出。人们可以使用
    `Euclidean method`（欧式法）测量感兴趣的距离。


    该神经网络根据圆的半径或最高范围将点分类为不同的组。点越接近环形范围，系统越可能将该新点归类为特定类别。`beta function`（Beta 函数）控制从一个区域切换到另一个区域时有时发生的转换。


    `Radial Function Neural Network`（径基神经网络）最显著的应用是 `Power Restoration Systems`（电力恢复系统），这些系统巨大且复杂。网络以有序的方式恢复电力，医院等紧急客户首先获得电力，其次是大多数，最后是少数。恢复遵循电力线和轨道半径内客户的安排。第一条线路将解决紧急客户的停电，第二条将修复大多数人的电力，最后一条将处理剩余的少数。


    ### 循环神经网络 – 长短期记忆


    `Recurrent neural network`（循环神经网络）使用一种方法，即它保存层的输出并将其馈回输入。它寻求协助提供关于层结果或结果的预测。这种类型的神经网络出现在某些模型中，例如文本转语音原型。在这种情况下，系统首先将文本转换为音素。

    '
