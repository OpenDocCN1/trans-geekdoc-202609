    Now let’s discuss more about the concept of splitting and see where it occurs.
    Splitting directly affects the accuracy of the decision trees. This means that
    if we are applying a number of algorithms on a decision tree, they will all affect
    the way a data node is divided into a number of subnodes. At this time you should
    keep in mind the differences between the two decision tree categories. The subnodes
    that are created as a result of splitting will maintain some form of uniformity.
    In addition, the node splitting is performed on every variable, however only the
    most uniform subnodes are selected. This process involves some mathematics and
    we will not dig deeper into the details. It’s enough to understand the theory
    behind the process in order to start building the decision trees. With that being
    said, let’s see how to work with them in an application.


    ## Decision Trees in Practice


    In order to create the decision trees you need to start from the root node. Once
    you access that data you can select a certain attribute and then perform a logical
    test on it. As a result you will be able to branch out from the outcome to any
    subsets of data that lead to a desirable result from a child node. You will need
    to perform recursive splitting on these child nodes in order to clean up the leaves
    and keep only the near-perfect ones. These leaves will represent the data samples
    that come from the same class. In addition, you might consider pruning the trees
    in order to eliminate the excess sub-sections of the trees which do not lead to
    any boosts in accuracy. This is one of the purposes of the splitting process.
    Once it is complete you can choose the most optimal split and the most useful
    feature.


    Now let’s finally stop with the theory and start looking at the practical application.
    We are going to create a decision tree. For the purpose of this demonstration
    we will need Scikit-learn once again because we will be using another public dataset
    called `Iris`. Let’s start by importing everything you need.


    ```python

    %matplotlib inline


    import pandas as pd

    import numpy as np

    import seaborn as sns

    import matplotlib.pyplot as plt


    from sklearn.model_selection import train_test_split

    from sklearn.tree import DecisionTreeClassifier


    df = pd.read_csv(''Iris.csv'')


    df.isnull().any()

    ```


    After importing everything we have also performed a null value check with the
    help of the last line. Once we determine that no values are absent we can start
    examining the information. As always, the first step is learning about the variables
    and values by reading a summary analysis of the dataset. Once you know what you’re
    up against we can start looking at the connections between the columns. To do
    this check we have imported the `seaborn` module because it provides us with a
    tool called `pairplot`. This tool is in fact a function that plots the connections
    and makes it much easier for us to visualise them. At this point you can use a
    certain color for each column. For instance, you can manipulate the `hue` for
    the species section in order to find any outliers in that category. Here’s how
    you can do this with Python code:


    ```python

    sns.pairplot(df, hue = ‘Species’)

    ```


    If you decided to use this particular dataset, you will notice that we do have
    a number of outliers, but they aren’t dominating. They may be the result of unknown
    anomalies or some faulty data that snuck in. Take note that these datasets you
    are working with are extremely clean when compared to real-world data. Most data
    contains a great deal of noise and outliers and you have to thoroughly clean them.
    For now, we can ignore the outliers because they aren’t prevalent enough to disturb
    our results significantly.


    The next step is to divide the dataset into a training and a test set with the
    same method we used before. However, now that we’re working with decision trees
    we will change the split to a 70 to 30 ratio instead of the usual 80 to 20. Let’s
    examine the code:


    ```python

    all_inputs = df[[''SepalLengthCm’, ‘SepalWidthCm’, ‘PetalLengthCm’, ‘PetalWidthCm’]].values

    all_classes = df[''Species’].values

    (train_inputs, test_inputs, train_classes, test_classes) = train_test_split(all_inputs,
    all_classes, train_size = 0.7, random_state = 1)

    ```


    You will notice that the `random_state` parameter is no longer set to 0 in order
    to guarantee a random distribution. This time we want to make sure the split is
    performed identically no matter how many times we perform it. This way we will
    always be able to recreate the dataset if needed. Now let’s apply the decision
    tree classifier:


    ```python

    dtc = DecisionTreeClassifier()

    dtc.fit(train_inputs, train_classes)

    dtc.score(test_inputs, test_classes)

    ```


    The result should look something like this:


    ```

    0.95555555

    ```


    We have managed to obtain 95% accuracy, which is quite an excellent result considering
    that we haven’t performed any cleaning and we decided to ignore the outliers.
    This is why decision trees are so powerful and therefore popular in training various
    models. You can achieve high accuracy without performing too many operations.


    ## Chapter 9 Essential Libraries for Machine Learning in Python


    Many developers nowadays prefer the usage of Python in their data analysis. Python
    is not only applied in data analysis but also statistical techniques. Scientists,
    especially the ones dealing with data, also prefer using Python in data integration.
    That''s the integration of Webb apps and other environment productions.


    The features of Python have helped scientists to use it in Machine Learning. Examples
    of these qualities include consistent syntax, being flexible and even having a
    shorter time in development. It also can develop sophisticated models and has
    engines that could help in predictions.


    As a result, Python boasts of having a series or set of very extensive libraries.
    Remember, libraries refer to a series of routines and sorts of functions with
    different languages. Therefore, a robust library can lead to tackling more complex
    tasks. However, this is possible without writing several code lines again. It
    is good to note that Machine Learning relies majorly on mathematics. That''s mathematical
    optimization, elements of probability and also statistical data. Therefore, Python
    comes in with a rich knowledge of performing complex tasks without much involvement.


    The following are examples of essential libraries being used in our present.


    ### Scikit – Learn


    Scikit learn is one of the best and a trendy library in Machine Learning. It has
    the ability to supporting learning algorithms, especially unsupervised and supervised
    ones.


    Examples of Scikit learn include the following:


    * k-means

    * decision trees

    * linear and logistic regression

    * clustering


    This kind of library has major components from `NumPy` and `SciPy`. Scikit learn
    has the power to add algorithms sets that are useful in Machine Learning and also
    tasks related to data mining. That''s, it helps in classification, clustering,
    and even regression analysis. There are also other tasks that this library can
    efficiently deliver. A good example includes ensemble methods, feature selection,
    and more so, data transformation. It is good to understand that the pioneers or
    experts can easily apply this if at all, they can be able to implement the complex
    and sophisticated parts of the algorithms.


    ### TensorFlow


    It is a form of algorithm which involves deep learning. They are not always necessary,
    but one good thing about them is their ability to give out correct results when
    done right. It will also enable you to run your data in a `CPU` or `GPU`. That''s,
    you can write data in the Python program, compile it then run it on your central
    processing unit. Therefore, this gives you an easy time in performing your analysis.
    Again, there is no need for having these pieces of information written at `C++`
    or instead of other levels such as `CUDA`.

