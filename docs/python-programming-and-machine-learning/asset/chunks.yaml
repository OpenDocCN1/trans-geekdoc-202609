    随着计算能力的增长，这种数据收集在现实世界中也在增加。例如，杂货商店开始提供所谓的折扣和会员卡，这些卡片真的可以追踪人们的购买情况，以便公司能够为客户提供定制化优惠，并调整他们的营销计划等。


    互联网还将将云计算的概念推向了前沿。它不再仅仅是在办公室里拥有一台计算机或一个计算机网络，而是提供了利用互联连接的多台计算机算力的可能，将其用于信息处理、计算以及简单的数据存储。


    第三项进展是计算机系统存储组件成本的持续下降以及容量的增加，这在该领域产生了巨大影响。很快，收集的数据越来越多。像 `Google` 以及最终的 `Facebook`
    这样的大公司也开始收集关于人们行为的大量数据。


    这就是机器学习大显身手的地方。第一次，机器学习系统执行现实世界任务（而不仅仅是执行如下国际象棋之类任务）所需的海量数据变得可能。机器学习系统在数据集上进行训练，而现在企业（以及政府）拥有各种类型的数据来训练机器学习系统以执行许多不同的任务。


    # 机器学习的目标与应用


    只要在任何大型数据集中存在有用的模式，机器学习就可以投入。在许多情况下，在数据被输入机器学习系统之前，人们并不知道存在哪些模式。这是因为人类无法看到大型数据集中的底层模式，但计算机非常擅长发现这些模式。模式的类型没有任何任何限制。例如，机器学习系统可以用于检测针对计算机网络的黑客攻击尝试。通过向系统输入包含以往黑客攻击的历史数据，可以对其进行网络安全训练。


    ![00002.jpeg](img/image00274.jpeg)


    在另一个案例中，机器学习系统可以用于开发脸部识别技术。给系统提供大量包含脸部的照片，以便它可以学习识别脸部，并将特定的脸部与特定的个人联系起来。


    现在让我们考虑机器学习的另一个应用，它与我们目前观察过的其他两个完全不同。机器学习可以用于批准或拒绝贷款申请。在训练阶段，系统将接触到大量的之前的贷款申请及其最终结果。换句话说，借款人是提前还清了贷款，还是违约了？在接触所有数据的过程中，系统将学习哪些特征或特征组合最能预测给定的申请人是否会违约。这一切都是在没有人工干预的情况下完成的，因此机器可能会在数据中发现人类观察者错过且从未怀疑过存在的模式。事实是，人类的大脑并不擅长分析大型数据集，有些人可能会认为我们根本无法做到这一点。


    机器学习最早的应用之一是电子垃圾邮件检测。这是一个非常值得研究的例子，因为它说明了机器学习系统擅长解决的一种特定问题。判断一封邮件是否为垃圾邮件可以被建模为一个分类问题。换句话说，你对每封邮件进行检查，并将其分类为垃圾邮件或非垃圾邮件。这不是绝对的，而且检测所有垃圾信息可能是复杂的。


    信用卡和借记卡的欺诈检测是机器学习的另一个应用。通过研究过去的数据，系统可以学习检测使用中的模式，这些模式表明卡片正被用于欺诈活动。在许多情况下，检测到的模式是人类观察者完全没有意识到的，或者即使他们知道这些模式的存在也不会将其与欺诈检测联系起来。


    因此，我们看到机器学习几乎可以应用于任何有大量数据且数据中存在可用于检测或预测模式的情况。机器学习具有很强的通用性，能够学习任何内容，从下国际象棋到发现诸像
    `Southwest` 这样的航空公司的燃料浪费。这并不是 20 世纪 60 年代或 70 年代科幻作家曾经想象的人工智能，但它具有许多人类学习的特征。第一是它是非常通用的。第二是它接触的数据越多，它的表现就越好。


    现在让我们考虑机器学习的目标。机器学习的核心目标是开发通用的算法，利用智能和学习来解决问题。


    显然，机器学习的一个重要目标是提高生产力。无论系统的用户是企业、军事部门还是政府机构，这一点都是成立的。


    第二个目标是用更好的机器劳动取代人类劳动。当然，自工业革命开始以来这一直一直是技术的目标，并且今天仍然是一个重要目标。然而，在机器学习的情况下，这种实现方式有点不同。第一点是使用机器学习执行人类无法提供的注意力和专注力的任务。即使人类是能够提供最大专注力的优秀工作者，人类也会受到许多缺陷的影响，如疲劳和分心。此外，人类观察者在任何时刻能够关注的信息量是非常有限的。考虑机器学习系统——专注从不是问题。计算机系统能够以人类永远无法的方式产生激光般的专注。其次，它能够分析和采样远得多的数据集，而且它永远不会受到疲劳的影响，也不需要上厕所或吃午餐。


    从广义上说，今天许多业务正在使用的一个应用是使用机器学习来发现浪费。几家大型公司已经从中取得了巨大的成功。我们已经提到一个，`Southwest` 曾利用机器学习分析航空公司在停机位的活动，他们发现了时间方面的巨大浪费，飞机在停机时浪费了燃料。`UPS`
    也利用机器学习来识别浪费路线，这些路线浪费了公司的金钱，并导致数千辆卡车浪费了大量的燃料。机器学习还可以应用于员工在做什么以及他们如何更好地利用时间。


    ## 机器学习的好处


    对于使用机器学习的企业来说，有很多好处。我们在这里总结其中一些：


    - 机器学习可以轻松发现任何底层数据集中的模式。

    - 基于机器学习的系统会随着经验变得更好。看到的数据越多，它们就越好。

    - 机器学习具有很强的通用性，适用于几乎任何应用，从检测计算机网络的黑客攻击到挑选盈利股票。

    - 机器学习系统可以处理人类观察者无法应付的多维问题。

    - 一旦系统过了学习阶段，就不再需要人工干预。这是一个真正的自动化系统。


    '
