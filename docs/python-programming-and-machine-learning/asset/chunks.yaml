    循环神经网络中的神经元在执行计算时类似于记忆单元。每个神经元都会记住它在上一个时间步中拥有的某些细节或数据。因此，从一个神经元传递到下一个神经元的信息越多，神经元回想的知识就越多。该系统通过前向传播工作，并回想起未来使用所需的哪些知识。


    如果网络做出的预测错误的，人员会使用反向传播。他们纠正错误并利用学习率产生微小的修改。这些更改将引导系统做出正确的预测。此外，必须注意的是，特征和权重之和产生了输出，这构成了循环神经网络的第一层。


    ## 卷积神经网络


    这种神经网络类型可以接收输入图像，并对表示中的不同特征或条目分配重要性。之后，它能够区分不同的图形。与其他用于分类的算法相比，卷积神经网络需要的较少的预处理。不同的不同的方法需要利用由程序员手动设计的滤波器。相比之下，这种类型神经网络的深度学习算法具有学习必要滤波器或特质的能力。


    卷积神经网络的结构灵感源于大脑中视觉皮层的形成和结构。它的组织方式类似于人类脑中神经元连接的模式。单个神经元仅对光区域内一个被称为“感受野”的受限区域做出反应。这一组感受野通过重叠覆盖了整个视觉区域。


    因此，这种神经网络类型使用相关的滤波器来更好地拟合图像数据集，从而更多地理解图像的复杂性。屏幕指的是系统分批接收输入特征，这有助于它分段回想图像并进行计算处理。系统执行适当的筛选，减少了相关的框架数量，并允许权重的重用。结果，卷积神经网络类型可以有效地获取时间和空间依赖关系。


    这种神经系统在神经元中具有偏置和可学习权重，使人员能够将其用于计算机视觉领域的信号和图像处理。计算过程包括将图像从 HIS 或 RGB 标度转换为灰度。这种转换改变了像素值，反过来有助于识别边缘。然后它能够将图像分类到各种类别。计算机视觉技术大量利用了这种神经网络，因为它可以处理信号并提供准确的图像分类。


    ## 模块化神经网络


    这种神经系统类型有一组不同的网络，它们独立工作以提供输出。它们在执行必要任务时不会相互之间传输信号。每个神经系统都包含一组属于相关网络的专用输入。因此，这些结构在创建和执行分配的子职责时，不会以任何方式相互作用。它们通过将过程分解为子任务来降低过程的复杂性。这导致网络在互不相互作用的情况下运行，因为过程之间的链接数量减少了。


    结果，完成子任务的效率导致了计算过程速度加快。然而，完成过程的时间取决于神经元的数量以及它们参与结果计算的程度。


    ## 人工神经网络层


    人工神经网络由三层组成。这些层是输入层、隐藏层和输出层。许多互连的节点构成了这些层中的每一个，且节点具有激活函数，激活函数是特定输入的输出。


    ### 输入层


    该层接收每个观测值的描述性特征值。它为系统提供模式，并与隐藏层通信。该层中的节点不修改数据，因为它们是被动的。它复制接收到的每个值并将它们发送到隐藏节点。此外，描述性变量的数量与该层中节点数量相同。


    ### 隐藏层


    该层利用加权链接结构来处理值。它将进入层的值与权重相乘，然后将加权输入相加得到单个数字。在这种情况下，加权是指程序存储的一组预设数字。隐藏层实现特定的转换。


    ### 输出层


    该层从输入层或隐藏层获取连接，并提供匹配预测的输出。这种层导致产生输出。在该层中，活动节点合并并修改数据。


    总之，输入层包含了向隐藏层传递信息的神经元。隐藏层将数据传递到输出层。神经网络中的突触是参数化框架或边界。因此，神经网络中的每个神经元都包含输入、激活函数和输出。权重代表突触，而激活函数建立了输入。


    ## 神经网络的优点和缺点


    使用人工神经网络有一些优缺点。了解它们使能够更好地理解涉及的操作和缺陷。


    ### 人工神经网络的优点


    以下是人工神经网络的优点，有助于人员学习使用神经系统的优势。


    a) 机器学习能力——人工系统学习情况和事件，并进行判断。


    b) 处理不完整知识的能力——适当的训练使网络在信息不足或不完整的情况下输出。


    c) 分布式内存——信息存储在整个网络中，而不是数据库中。程序员使用示例来训练神经网络并获得期望的输出。通过尽可能利用细节来训练神经系统。示例包含了确保网络将学习的所有信息和部分。这种训练为系统提供了不同的相关细节，允许产生适当的输出。训练过程中的示例越好，神经网络提供错误输出的可能性就越低。


    d) 并行处理能力——由于数值优势，网络可以同时执行多个任务。它们同时以高速度处理多个数值。


    e) 信息存储在整个网络——系统将信息存储在整个网络中，使其即使在部分丢失某些信息细节的情况下继续运行。


    f) 容错性——网络具有容错性，即使在一个或多个细胞衰化的情况下也能继续输出。


    g) 逐渐腐变——网络的退化不会突然和立即发生。它在一段时间内缓慢和逐步地发生，这使得人们尽管存在腐变仍可以使用系统。


    ### 人工神经网络的缺点


