  trans: "\n\n通过此，Python 将把这些指令解释为你的电脑或设备可以理解并执行的指南。\n\n让我们来看某些指令，以感知 Python 是如何运行的。注意，你可以使用\
    \ `print` 命令来打印整个程序。 \n\n\"Heydays, Savants!\" \n\n1. 首先，打开 Python 的命令行。 \n\n\
    2. 此时，在 `>>>` 提示符处，输入随后的内容（在 `print` 和括号部分之间不要留空格）：`print (\"Heydays, Savants!\"\
    )` \n\n3. 现在，你应该按下回车键，以告知 Python 你已完成指令。命令行窗口会迅速显示出 `Heydays, Savants!`。在此期间，Python\
    \ 已经根据在编写的安排中所被告知的内容做出了类似的反应。同样，为了观察当你使用错误的语言结构请求 print 指令打印类似的字符串时它将如何做出错误反应，请在\
    \ Python 命令行提示符上输入并回车相应的指令：`Print(\"Heydays, Savants!\")` \n\n结果将是：`Syntax error:\
    \ invalid language structure` \n\n这就是当你使用无效或破碎的解释时得到的情况。注意 Python 是一种对大小写敏感的编程语言，所以无论在何时误解了信息，都可能是你将\
    \ `print` 写成了大写字母。显然，`print` 指令是有选择的，你可以简单地在如下语句中输入你的公告：`\"Primes, Savants!\"\
    `。注意，公告是你在给出指令后希望显示的单词；然而，可以放入其中的单词并不限于此处给出的模型。 \n\n### 退出 Python 命令行的最有效方法\n\n\
    要退出 Python，你可以输入以下任何命令：`quit()` 或 `exit()`。随后，按住 `Control-Z` 然后按 `Enter`；Python\
    \ 应该退出。\n\n你与 Python 编程的接触应该变得有趣了；仍然还有部分需要学习，耐心将会回报。\n\n### IDLE 区域：Python 的集成开发环境\
    \ (IDE)\n\nPython 优秀部分之一是 `IDLE`（集成开发与学习环境）工具。尽管这个特定设备集成在 Python 的安装包中，你也可以下载日益先进的外部\
    \ IDE。`IDLE` 工具为你提供了一个日益强大的平台来编写代码并与 Python 进行交互式工作。要进入 `IDLE`，你可以在找到命令行符号的地方或在开始菜单中（正如你通过命令行协作获得的那样）体验类似的组织。当你点击\
    \ `IDLE` 图标时，你将被引导到 `Python Shell` 窗口。这将我们进入与 `Python Shell Window` 协作的部分。\n\n\
    #### 连接 Python Shell 窗口\n\n当你处于 `Python Shell Window` 时，你会看到一个下拉菜单和一个类似于你在命令行窗口（上提到的主要连接）中看到的\
    \ `>>>` 提示符。有一个特定的 `IDLE` 功能可以更改绘图内容。现在，你将使用类似的 `IDLE` 更改菜单来查看过去的指令、剪切、复制和粘贴过去的语句，并一起进行任何类型的编辑。显然，`IDLE`\
    \ 越来越类似于命令行关联的跳转。令人惊讶的是，在 `Python Shell window` 的下拉菜单中有以下菜单项：`File`、`Windows`、`Help`、`Shell`、`Options`、`Edit`\
    \ 和 `Debug`。每一个菜单都有各种功能。`Shell` 和 `Debug` 菜单在创建较大的项目时使用，因为它们为过程提供了突出显示。无论如何，虽然\
    \ `Shell` 菜单为你提供了重启 shell 或查看 shell 日志以最新重置的机会，但 `Debug` 菜单对于跟踪异常源文件和显示自己的行有许多有用的东西。通过\
    \ `Debugger` 选项，你最可能会引入一个智能调试器窗口，它允许你单步并查看 Python 上运行的项目。窗口的 `Options` 菜单允许你编辑并设置\
    \ `IDLE` 以适应自己的 Python 工作喜好。\n\n此外，在 `Help` 菜单处，你可以打开 `Python Help` 和文档的选项。\n\n\
    使用 `File Window` 菜单，你可能会创建另一个文档、打开一个模块、打开一个旧记录，并通过进入此菜单时自然创建的基本要素来保存你的会话。通过 `'New\
    \ File'` 选项，你几乎会创建一个你只需点击即可编写的代码。当你完成后，你将被带到另一个窗口，那里有一个简单且标准的文本处理器，你可以在其中输入或更改你的代码。你会看到记录是\
    \ `'untitled'`，不要担心，这是文档的底层名称，当你保存代码时它会更改。`File window menu` 的一个棒点是它不会同时包含 `'Shell'`\
    \ 和 `Menu choices`，所以工具栏随 `Shell Window` 发生细微变化。发生的情况是在 `Shell Window` 中出现了两个新菜单，具体来说是\
    \ `Run` 和 `Format` 菜单。当你需要运行在记录窗口上编写的代码时，输出将单独在 `Shell Window` 中给出。\n\n在该区域的开始，你被告知\
    \ Python 可以在脚本模式（Script Mode）下使用。你如何做到这一点？获取结果的方法目前非常独特。在内容模式下工作时，你得到的输出不会像你在连接或关联模式下工作那样被编程。你应该从你的代码中调用它们。为了在这种模式下获得你的输出，请运行内容或通过代码中的\
    \ `print()` 函数调用它。\n\n"
