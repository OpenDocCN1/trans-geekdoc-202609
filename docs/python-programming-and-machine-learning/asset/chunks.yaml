- raw: "| Data usage   || Employs training data to study the link between the input\
    \ and output.  || Does not use output data.  |\n\n| Accuracy of the outcome  ||\
    \ Highly accurate reliable.  || Less accurate and Therefore, not trustworthy \
    \ |\n\n| Input data  || Labeled data is used in training the algorithms.  || Algorithms\
    \ are used against unlabeled data.   |\n\n| Number of classes  || Known number\
    \ of classes.  || Unknown number of classes.   |\n\n| Major drawback  || Classification\
    \ of big data.  || Failure to get precise information concerning output and data\
    \ sorting due to use of labeled and unknown data.   |\n\n| Real time learning\
    \  || Learning takes place offline.   || Learning happens in real time.   |\n\n\
    | Process  || Both input and output variables are given.   || Only the input data\
    \ is given.  |\n\n| Computational complexity   || Relatively simple; less complex.\
    \  || Complex in terms of computation.  |\n\nDeciding to employ a supervised or\
    \ unsupervised machine learning algorithm classically depends on your data volume\
    \ and structure. Essentially, a well-formed data science plan will employ both\
    \ algorithm types to come up with predictive data models. Now, these models are\
    \ more advanced and help the stakeholders in decision-making across a variety\
    \ of business hold ups.  \n\n3.  Reinforcement Learning  \n\nThis is a neural\
    \ network learning technique that trains machine learning concepts how to make\
    \ a progression of decisions. The agent is trained how to attain their objective\
    \ in an indecisive, potentially complex environment. In this technique, an artificial\
    \ intelligence engages into a game-like situation and the computer tries to solve\
    \ the problem using trial and error method. For the programmer to get the machine\
    \ to do what they want, the artificial intelligence gets penalized or rewarded\
    \ for the actions performed. The idea is to fully exploit the total reward.  \n\
    \nUsually there is a reward policy in form of game rules, but the designer does\
    \ not give any hints on how the model should solve the puzzle. The model starts\
    \ from completely random trials and advances to sophisticated approaches and even\
    \ superhuman skills. In the process, this technique leverages the full power of\
    \ search, hence qualifying to be the most effectual in hinting machine’s creativity.\
    \ As opposed to humans, artificial intelligence can employ a reinforcement algorithm\
    \ to collect experience from thousands parallel gameplays as long as it is run\
    \ on an adequately powerful computer infrastructure.  \n\nLet us look at a practical\
    \ example that will perfectly illustrate the reinforcement learning technique.\
    \ However, before then we need to understand some terms that we will use in the\
    \ illustration.  \n\nAgent: This is an implicit entity that seeks to gain a reward\
    \ by performing actions in an environment.  \n\nEnvironment (e): A situation that\
    \ an agent must face. \n\nReward (R): An instant response given to an agent on\
    \ performing a specific action. \n\nState (s): The current scenario returned by\
    \ the environment.  \n\nPolicy (π): An approach employed by the agent to determine\
    \ their next action based on the prevailing state.  \n\nValue (V): The projected\
    \ long-term return, which is discounted comparing with the short-lived reward. \
    \ \n\nValue Function: This one stipulates the total reward, i.e, the value of\
    \ a state.  \n\nModel based methods: Handles the reinforcement learning-based\
    \ problems that apply model-based techniques.  \n\nModel of the environment: It\
    \ imitates the behavior of the environment, helping you draw conclusions regarding\
    \ environment behavior.  \n\nAction value / Q value (Q): This is not very different\
    \ from value. In fact, the only variation is that this one takes an extra parameter\
    \ as a current action.  \n\nIllustration  \n\nThink of trying to teach your dog\
    \ some new tricks. This dog does not understand human language so you need to\
    \ devise a strategy that will help you achieve your goal. You will initiate a\
    \ situation and observe the various reactions by your dog. If the dog responds\
    \ in the desired way, you give him some beef. You will realize that every time\
    \ you expose the dog to a similar condition, they will tend to respond with greater\
    \ enthusiasm hoping to get a reward (the beef). It means that the positive experiences\
    \ inspire the responses your dog gives. As well, there are the negative experiences\
    \ that teach the dog what not to do because should they do it, then they will\
    \ certainly miss their share of beef.  \n\nIn the given paradigm, your dog is\
    \ an agent exposed to the environment. You may decide to have your situation as\
    \ requiring your sitting dog to walk when you utter a particular word. This agent\
    \ responds by performing an action where they transition from one state to another,\
    \ like transitioning from sitting to walking. In this case, the policy is a process\
    \ of choosing an action given a state with the expectation of better results.\
    \ After transitioning, the agent may get a penalty or a reward in response.  \n\
    \nReinforcement Learning Algorithms  \n\nThere are three techniques in implementation\
    \ of a reinforcement learning algorithm.  \n\nValue-based: here, the agent is\
    \ anticipating a long-term return of the prevailing states under policy and so\
    \ you ought to maximize the value function.  \n\nPolicy-based: under this RL scheme\
    \ you endeavor to find a policy such that the action executed in each state leads\
    \ to maximal reward in the future.  \n\nPolicy-based method is further classified\
    \ into deterministic, where the policy produces the same action for any state,\
    \ and stochastic, where every action has a definite probability determined by\
    \ the stochastic policy. The stochastic policy is n{a\\\\s) = P\\\\A, = a\\\\\
    S, =S\\] \n\nModel-based: in this case you are expected to generate a virtual\
    \ model for every environment, where the agent learns how to perform in that very\
    \ environment.  \n\nTypes of Reinforcement Learning  \n\nPositive \n\nThis is\
    \ an event triggered by specific behavior. It positively influences the action\
    \ taken by the agent. This happens through enhancing the frequency and strength\
    \ of the behavior. This method helps you to capitalize on performance and sustain\
    \ change for a longer period. Even so, you have to be careful as over-reinforcement\
    \ may cause state over-optimization and impinge on the results.  \n\nNegative \
    \ \n\nIt involves strengthening behavior prompted by a negative condition which\
    \ should have been dodged or stopped. Although it helps define the least stand\
    \ performance, this method provides adequate to meet up the minimum behavior,\
    \ which is a drawback.  \n\nApplications of RL in Real Life  \n\n       Data\
    \ processing and machine learning. \n\n       Planning of business strategy. \
    \ \n\n       Robotics for industrial computerization.  \n\n       Aircraft and\
    \ robot motion management.  \n\n       Helps in creation of customized training\
    \ systems for students.  \n\nSummary  \n\n*   Data used in unsupervised learning\
    \ is labeled and unknown, and Therefore, you cannot get accurate information concerning\
    \ data sorting. \n\n*   When moving from image to image you will have varied information\
    \ because the spectral properties of classes are also likely to change over time.\
    \ \n\n*   Unsupervised machine learning locates all unknown types of unidentified\
    \ patterns in the data.  \n\n*   The user has to dedicate time to label and interpret\
    \ the classes which follow a particular classification. \n\n*   The major downside\
    \ of unsupervised learning is the failure to get accurate information in regard\
    \ to data sorting. \n\n*   Reinforcement learning is a machine learning method\
    \ with three algorithms; 1) value-based, 2) policy-based and 3) model based. \n\
    \n*   The two types of reinforcement learning are 1) positive and 2) negative.\
    \ \n\n*   RL should not be used for problem-solving when you have adequate data.\
    \ \n\n*   The major RL method drawback is that learning speed may be affected\
    \ by parameters.  \n\nLearning the Data sets of Python  "
  fmt: "\n| Feature | Supervised Learning | Unsupervised Learning |\n| :--- | :---\
    \ | :--- |\n| Data usage | Employs training data to study the link between the\
    \ input and output. | Does not use output data. |\n| Accuracy of the outcome |\
    \ Highly accurate reliable. | Less accurate and Therefore, not trustworthy |\n\
    | Input data | Labeled data is used in training the algorithms. | Algorithms are\
    \ used against unlabeled data. |\n| Number of classes | Known number of classes.\
    \ | Unknown number of classes. |\n| Major drawback | Classification of big data.\
    \ | Failure to get precise information concerning output and data sorting due\
    \ to use of labeled and unknown data. |\n| Real time learning | Learning takes\
    \ place offline. | Learning happens in real time. |\n| Process | Both input and\
    \ output variables are given. | Only the input data is given. |\n| Computational\
    \ complexity | Relatively simple; less complex. | Complex in terms of computation.\
    \ |\n\nDeciding to employ a supervised or unsupervised machine learning algorithm\
    \ classically depends on your data volume and structure. Essentially, a well-formed\
    \ data science plan will employ both algorithm types to come up with predictive\
    \ data models. Now, these models are more advanced and help the stakeholders in\
    \ decision-making across a variety of business hold ups.\n\n### 3. Reinforcement\
    \ Learning\n\nThis is a neural network learning technique that trains machine\
    \ learning concepts how to make a progression of decisions. The agent is trained\
    \ how to attain their objective in an indecisive, potentially complex environment.\
    \ In this technique, an artificial intelligence engages into a game-like situation\
    \ and the computer tries to solve the problem using trial and error method. For\
    \ the programmer to get the machine to do what they want, the artificial intelligence\
    \ gets penalized or rewarded for the actions performed. The idea is to fully exploit\
    \ the total reward.\n\nUsually there is a reward policy in form of game rules,\
    \ but the designer does not give any hints on how the model should solve the puzzle.\
    \ The model starts from completely random trials and advances to sophisticated\
    \ approaches and even superhuman skills. In the process, this technique leverages\
    \ the full power of search, hence qualifying to be the most effectual in hinting\
    \ machine’s creativity. As opposed to humans, artificial intelligence can employ\
    \ a reinforcement algorithm to collect experience from thousands parallel gameplays\
    \ as long as it is run on an adequately powerful computer infrastructure.\n\n\
    Let us look at a practical example that will perfectly illustrate the reinforcement\
    \ learning technique. However, before then we need to understand some terms that\
    \ we will use in the illustration.\n\n*   **Agent**: This is an implicit entity\
    \ that seeks to gain a reward by performing actions in an environment.\n*   **Environment\
    \ (e)**: A situation that an agent must face.\n*   **Reward (R)**: An instant\
    \ response given to an agent on performing a specific action.\n*   **State (s)**:\
    \ The current scenario returned by the environment.\n*   **Policy (π)**: An approach\
    \ employed by the agent to determine their next action based on the prevailing\
    \ state.\n*   **Value (V)**: The projected long-term return, which is discounted\
    \ comparing with the short-lived reward.\n*   **Value Function**: This one stipulates\
    \ the total reward, i.e, the value of a state.\n*   **Model based methods**: Handles\
    \ the reinforcement learning-based problems that apply model-based techniques.\n\
    *   **Model of the environment**: It imates the behavior of the environment, helping\
    \ you draw conclusions regarding environment behavior.\n*   **Action value / Q\
    \ value (Q)**: This is not very different from value. In fact, the only variation\
    \ is that this one takes an extra parameter as a current action.\n\n### Illustration\n\
    \nThink of trying to teach your dog some new tricks. This dog does not understand\
    \ human language so you need to devise a strategy that will help you achieve your\
    \ goal. You will initiate a situation and observe the various reactions by your\
    \ dog. If the dog responds in the desired way, you give him some beef. You will\
    \ realize that every time you expose the dog to a similar condition, they will\
    \ tend to respond with greater enthusiasm hoping to get a reward (the beef). It\
    \ means that the positive experiences inspire the responses your dog gives. As\
    \ well, there are the negative experiences that teach the dog what not to do because\
    \ should they do it, then they will certainly miss their share of beef.\n\nIn\
    \ the given paradigm, your dog is an agent exposed to the environment. You may\
    \ decide to have your situation as requiring your sitting dog to walk when you\
    \ utter a particular word. This agent responds by performing an action where they\
    \ transition from one state to another, like transitioning from sitting to walking.\
    \ In this case, the `policy` is a process of choosing an action given a state\
    \ with the expectation of better results. After transitioning, the agent may get\
    \ a penalty or a reward in response.\n\n### Reinforcement Learning Algorithms\n\
    \nThere are three techniques in implementation of a reinforcement learning algorithm.\n\
    \n1.  **Value-based**: here, the agent is anticipating a long-term return of the\
    \ prevailing states under policy and so you ought to maximize the `value function`.\n\
    2.  **Policy-based**: under this RL scheme you endeavor to find a `policy` such\
    \ that the action executed in each state leads to maximal reward in the future.\n\
    \    *   Policy-based method is further classified into deterministic, where the\
    \ `policy` produces the same action for any state, and stochastic, where every\
    \ action has a definite probability determined by the stochastic policy. The stochastic\
    \ policy is `n(a|s) = P(A=a|S=s)`.\n3.  **Model-based**: in this case you are\
    \ expected to generate a virtual model for every environment, where the agent\
    \ learns how to perform in that very environment.\n\n### Types of Reinforcement\
    \ Learning\n\n#### Positive\nThis is an event triggered by specific behavior.\
    \ It positively influences the action taken by the agent. This happens through\
    \ enhancing the frequency and strength of the behavior. This method helps you\
    \ sustain change for a longer period. Even so, you have to be careful as over-reinforcement\
    \ may cause state over-optimization and impinge on the results.\n\n#### Negative\n\
    It involves strengthening behavior prompted by a negative condition which should\
    \ have been dodged or stopped. Although it helps define the least stand, this\
    \ method provides adequate to meet the minimum behavior, which is a drawback.\n\
    \n### Applications of RL in Real Life\n*   Data processing and machine learning.\n\
    *   Planning of business strategy.\n*   Robotics for industrial computerization.\n\
    *   Aircraft and robot motion management.\n*   Helps in creation of customized\
    \ training systems for students.\n\n### Summary\n*   Data used in unsupervised\
    \ learning is labeled and unknown, and therefore, you less accurate and not trustworthy.\n\
    *   When moving from image to image you will have varied information because the\
    \ spectral properties of classes are also likely to change over time.\n*   Unsupervised\
    \ machine learning locates all unknown types of unidentified patterns in the data.\n\
    *   The user has to dedicate time to label and interpret the classes which follow\
    \ a particular classification.\n*   The major downside of unsupervised learning\
    \ is the failure to get accurate information in regard to data sorting.\n*   Reinforcement\
    \ learning is a machine learning method with three algorithms; 1) `value-based`,\
    \ 2) `policy-based` and 3) `model based`.\n*   The two types of reinforcement\
    \ learning are 1) `positive` and 2) `negative`.\n*   RL should not be used for\
    \ problem-solving when you have adequate data.\n*   The major RL method drawback\
    \ is that learning speed may be affected by parameters.\n"
  trans: "\n\n| 特性 | 监督学习 | 无监督学习 |\n| :--- | :--- | :--- |\n| 数据使用 | 利用训练数据来研究输入与输出之间的关系。\
    \ | 不使用输出数据。 |\n| 结果准确性 | 高且可靠。 | 准确性较低，因此不可信。 |\n| 输入数据 | 在训练算法中使用带标签的数据。 | 针对未标记的数据使用算法。\
    \ |\n| 类别数量 | 类别数量已知。 | 类别数量未知。 |\n| 主要缺点 | 大分类。 | 由于使用了标记和未知数据，无法获得关于输出和数据排序的精确信息。\
    \ |\n| 实时学习 | 学习离线进行。 | 学习实时发生。 |\n| 过程 | 同时给出输入和输出变量。 | 仅给出输入数据。 |\n| 计算复杂度 |\
    \ 相对简单；复杂度较低。 | 计算上较为复杂。 |\n\n选择采用监督还是无监督机器学习算法，传统上取决于你的数据量和结构。本质上，一个良好的数据科学计划会同时使用这两种算法来构建预测数据模型。现在，这些模型更加先进，可以帮助利益相关者在各种业务支持中做出决策。\n\
    \n### 3. 强化学习\n\n这是一种神经网络学习技术，训练机器学习概念如何做出一系列决策。代理（Agent）被训练如何在一个不确定的、可能复杂的环境中实现目标。在这种技术中，人工智能进入一种类似游戏的情况，计算机尝试使用试错法来解决问题。为了让程序员机器执行他们想要的操作，人工智能会对所执行的行为进行惩罚或奖励。其核心思想是充分利用总奖励。\n\
    \n通常有一个以游戏规则形式存在的奖励策略，但设计者不会提供关于模型应如何解决谜题的提示。模型从完全随机的尝试开始，进步到复杂的方法甚至是超人的技巧。在这个过程中，这种技术利用了搜索的全部力量，因此在提示机器创造力方面是最有效的。与人类不同，只要在足够强大的计算机基础设施上运行，人工智能就可以利用强化算法从成千上万次并行游戏中收集经验。\n\
    \n让我们来看一个具体的例子，它将完美地说明强化学习技术。在此之前，我们需要理解在插图中将使用的一些术语。\n\n*   **代理 (Agent)**：这是一个隐性实体，通过在环境中执行动作来寻求奖励。\n\
    *   **环境 (Environment (e))**：代理必须面对的情况。\n*   **奖励 (Reward (R))**：在执行特定动作时给予代理的即时响应。\n\
    *   **状态 (State (s))**：环境返回的当前场景。\n*   **策略 (Policy (π))**：代理根据当前状态确定下一个动作的方法。\n\
    *   **价值 (Value (V))**：预测的长期回报，与短期奖励相比经过折扣。\n*   **价值函数 (Value Function)**：规定总奖励，即状态价值。\n\
    *   **基于模型的方法 (Model based methods)**：处理应用基于模型技术的强化学习问题。\n*   **环境模型 (Model of\
    \ the environment)**：模拟环境的行为，帮助你对环境行为得出结论。\n*   **动作值 / Q 值 (Action value / Q\
    \ value (Q))**：这与价值没有太大。实际上，唯一的区别是它多了一个当前动作作为参数。\n\n### 插解\n\n想象尝试教你的狗一些新花样。这只狗不懂人类语言，所以你需要制定一个策略来帮助你实现目标。你会开启一个情况并观察狗的各种反应。如果狗以想要的方式做出，你就给它一些牛肉。你会发现，每当你让狗处于类似的情况下时，它们往往会以更大的热情做出反应，希望能获得奖励（牛肉）。这意味着积极经历激发了你的狗给出的反应。同样，还有负面经历，教导狗什么不该做什么，因为如果它们做了，就一定会错过那份牛肉。\n\
    \n在给定的范式中，你的狗是暴露在环境中的代理。你可能设定你的情况是当你说出一个特定的词时，坐着的狗必须行走。该代理通过执行动作做出响应，从一个状态过渡到另一个状态，例如从坐着过渡到行走。在这种情况下，`policy`\
    \ 是在给定状态下选择动作的过程，以期望获得更好的结果。过渡之后，代理可能会得到惩罚或奖励。\n\n### 强化学习算法\n\n强化学习算法的实现有三种技术。\n\
    \n1.  **基于价值的 (Value-based)**：在这里，代理预测策略下当前状态的长期回报，因此你必须最大化`value function`。\n\
    2.  **基于策略的 (Policy-based)**：在这种强化学习方案下，你试图找到一个`policy`，使得在每个状态下执行的动作都能带来未来最大的奖励。\n\
    \    *   基于策略的方法进一步分为确定性的（其中`policy`对任何状态产生相同的动作）和随机性的（每个动作都有由随机策略确定的确定概率）。随机策略为`n(a|s)\
    \ = P(A=a|S=s)`。\n3.  **基于模型的 (Model-based)**：在这种情况下，你被要求为每个环境生成一个虚拟模型，代理在该环境中学习如何在该环境中表现。\n\
    \n### 强化学习的类型\n\n#### 正强化 (Positive)\n这是由特定行为触发的事件。它正向影响代理所采取的动作。通过增强行为的频率和强度来实现。这种方法有助于你维持更长时间的变化。尽管如此，你必须小心，因为过度强化可能会导致状态过度优化并影响结果。\n\
    \n#### 负强化 (Negative)\n它涉及强化由负面条件引发的行为，这种条件本应被避开或停止。虽然它有助于定义最低底限，但这种方法仅能满足最低行为，这是一个缺点。\n\
    \n### 强化学习在现实生活中的应用\n*   数据处理和机器学习。\n*   业务策略规划。\n*   工业自动化的机器人技术。\n*   飞机和机器人运动管理。\n\
    *   帮助为学生创建定制化培训系统。\n\n### 总结\n*   无监督学习中的数据是有标记的且未知的，因此你的准确性较低且不可信。\n*   从一张图像移动到另一图像时，会有各种信息，因为类的光谱属性也可能随时间变化。\n\
    *   无监督机器学习定位数据中所有未知的未识别模式。\n*   用户必须花时间来标记和解释遵循特定分类的类别。\n*   无监督学习的主要缺点是无法获得关于数据排序的准确信息。\n\
    *   强化学习是一种具有三种算法的机器学习方法；1) `value-based`，2) `policy-based` 和 3) `model based`。\n\
    *   强化学习有两种类型：1) `positive` 和 2) `negative`。\n*   如果有充足时，不应使用 RL 来解决问题。\n*   主要的\
    \ RL 方法缺点是学习速度可能会受到参数的影响。\n\n"
