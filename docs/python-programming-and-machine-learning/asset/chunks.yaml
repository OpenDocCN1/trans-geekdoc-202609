    # Introduction


    The mention of developers and programming usually has a lot of people directing
    their thoughts to the wider study of computer science. Computer science is a wide
    area of study. In machine learning, computers learn from experience, aided by
    algorithms. To aid their cause, they must use data with specific features and
    attributes. This is how they identify patterns that we can use to help in making
    important decisions. In machine learning, assignments are grouped under different
    categories, such as predictive modeling and clustering models. The concept behind
    machine learning is to provide solutions to pertinent problems without necessarily
    waiting for direct human interaction.


    Human beings are known to learn from their experiences. Consider a situation in
    which you are learning to read or speak a new language. You will show an improvement
    with time. Machine learning was borrowed from the concept of learning exhibited
    by human beings. When computer systems are exposed to the same situation repeatedly,
    they can show an improvement in the way they respond to that situation with time.
    Machine learning typically relies on data. It involves the design and development
    of computer systems that can extract patterns, trends, and relationships between
    various variables in a dataset. Such knowledge can then be used to predict what
    will happen in the future.


    Enjoy reading!


