  trans: "\n\n这种范式恰是最流行的，可能因为它易于理解和执行。在这里，算法从带标签的数据集中创建一个数学概念，即一个同时包含输入和输出参数的数据集。该数据集充当模型的训练器。作为一个例如，我们可能决定使用该算法来判断某个特定图像是否包含某个物体。在这种情况下，数据集将包含包含和不包含输入（该物体）的图像，每张图像都有一个输出，指明其是否包含该特定物体。算法可能会预测任何答案，无论正确或错误。然而，在几次尝试后，它学会了只选择包含所述物体的图像。一旦它完全训练完成，即使在输入新数据时，算法也会开始做出正确的预测。监督学习模型的一个完美例子是支持向量机。在下图中所示，支持向量机将数据划分为由线性边界隔开的区域。你会发现该边界将白色圆圈与黑色隔离开。\n\
    \n![C:\\Users\\USER\\Desktop\\support vector machine.png](img/image00276.jpeg)\
    \ \n\n## 监督学习的类型\n\n### 分类\n这些算法用于输出仅限于离散值的情况。例如，在过滤邮件的情况下，一封传入的邮件会被归类为输入，而输出则是文件夹名称。\n\
    \n### 回归\n这种算法的输出具有连续值，这意味着它们可以选取给定范围内的任何值。完美的例子包括：温度、风速、商品价格等。\n\n![C:\\Users\\\
    USER\\Downloads\\IMG\\_20190916\\_141540.jpg](img/image00277.jpeg) \n\n监督式机器学习体现在许多常见应用中，其中一些我们已经在下文中讨论过。\n\
    \n- **广告状态**：你在浏览互联网时遇到的大多数广告之所以定位在该处，是因为有一个监督学习算法为它们的点击率和人气提供了背书。\n- **人脸识别**：这在\
    \ Facebook 上非常常见。它很可能出现在 Facebook 上。\n- **垃圾邮件分类**：这是一个非常常见的应用，我们已经在下文中讨论过。\n\
    - **分类任务**：这是监督学习的一个完美示例。参考下图。\n\n![C:\\Users\\USER\\Desktop\\classification.jpg](img/image00278.jpeg)\n\
    \n"
