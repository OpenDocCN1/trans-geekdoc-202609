    # 人工智能


    我们首先要来看的是人工智能，简称 `AI`。这个术语是由计算机科学家约翰·麦卡锡（John McCarthy）在 20 世纪 50 年代首次提出的。`AI`
    最初被描述为一种用于制造设备的方法，使其学习在心理任务上模仿人类的能力。


    然而，这个术语在现代发生了一些变化，但你会发现其基本理念是相同的。当你实现 `AI` 时，你是在让机器（如计算机）像人类大脑一样运行和思考。这种优势意味着这些
    AI 设备在完成某些任务时比人类大脑更高效。


    初看之下，这可能看起来 `AI` 与机器学习相同，但它们并不完全一样。一些不理解这两个术语如何运作的人可能会认为它们是同一个，但你在编程中使用它们的方式会有很大区别。


    ## 机器学习有何不同？


    现在我们已经对人工智能有了有了概念，是时候了解一下机器学习，以及它与人工智能的相似之处和不同之处了。当我们观察机器学习时，会发现它实际上比数据科学中的其他一些选项要新，因为它只有大约
    20 年的历史了。尽管到目前为止已经存在了几十年，但直到过去几年，我们的技术和拥有的机器才终于能够跟上，机器学习也因此得到了更广泛的使用。


    机器学习之所以独特，是因为它是数据科学的一部分，能够专注于让程序从输入以及用户提供的数据中进行学习。这是非常有用的，因为算法能够获取这些信息并对未来做出良好的预测。让我们来看一个使用搜索引擎的例子。为了使其工作，你只需要在搜索查询中输入一个词，然后搜索引擎就能查找现有信息，查看哪些与之匹配，并返回一些结果。


    当你第一次执行这些搜索查询时，结果可能会包含你感兴趣的内容，但你可能需要向下滚动页面才能找到你想要的信息。但当你继续这样做时，计算机会获取这些信息并从中学习，以便在未来为你提供更好的选择。起初，你可能会点击第六个结果，但随着时间的推移，你可能会点击第一个或第二个结果，因为计算机已经学会了你认为有价值的内容。


    在传统编程中，这不是计算机可以独立完成的任务。每个人的搜索方式都不同，而且有数百万个页面需要筛选。此外，每个在线进行搜索的人对他们想要显示的内容都有自己的偏好。当你尝试执行这类任务时，传统编程会遇到问题，因为变量太多了。然而，机器学习具备实现这一点的能力。


    当然，这只是你使用机器学习的一个例子。事实上，机器学习可以帮助你解决一些你想让计算机处理的复杂问题。有时你可以用人类大脑解决这些问题，但你通常会发现机器学习比人类大脑能做的更高效、更快速。


    当然，也可以让人手动为你筛选并完成这些工作，但你可以想象这将花费太多时间，并且是一项巨大的工程。信息量太大了，在筛选这些信息时，他们可能不知道从何处开始，信息可能会困扰他们，等他们处理完所有内容，时间已经过去了太久，这些信息以及由此产生的预测对公司来说已经完全不再相关了。


    机器学习改变了游戏，因为它可以跟上节奏。你通过它使用的算法能够处理所有工作，同时几乎实时地获取你所需的结果。这是企业发现它是帮助他们做出明智、可靠决策，帮助他们预测未来的最佳选择大原因之一，也是他们业务模式中非常欢迎的补充。


    # 第 6 章 Python 实战


    ## 安装 Python (Windows)


    学习 Python 的一部分工作是在你的 Windows 上安装 Python。在安装的第一步中，你需要从下面的链接下载你偏好版本的安装包：`https://www.python.org/downloads/`


    访问该链接，你将被引导到一个页面。在该页面上，你需要在 Python 2 和 3 的两个最新版本之间选择：`Python 3.8.1` 和 `Python
    2.7.17`。


    相反，如果你在寻找特定的版本，可以浏览该页面寻找早期版本的下载链接。通常情况下，你会选择下载最新版本 `Python 3.8.1`（它于 2019 年 10
    月 14 日发布），或者下载 Python 2 的最新版本 `2.7.17`。然而，你下载哪个版本取决于你想做的项目类型、兼容性以及对更新的支持。


    下载完成后，你可以点击下载的 `.exe` 文件继续安装。标准安装必须包含 `pip`、`IDLE` 和核心文档。


    ## 安装 Python (Mac)


    如果你使用的是 Mac，可以从此链接下载安装包：

    `https://www.python.org/downloads/mac-osx/`


    学习的进阶正在深入到 Python 编程语言。实际上，Python 是一种灵活而强大的语言，可以从多个视角进行使用。这意味着当需要在逐行测试代码或声明，或者当在研究它的特性时，可以智能地使用
    Python。令人惊叹的是，Python 可以在内容模式下使用，特别是当你想解析整个声明文档或应用程序时。


    尽管如此，与 Python 一起工作需要极其谨慎——尤其是当你汇入或与之连接时。为了智能地汇入 Python，可以使用命令行（Command Line）或
    `IDLE` 开发环境。


    无论你是在学习大规模编程还是使用 Python，都会会有一些关于你如何连接并与 Python 编程语言协作的介绍。以下是快速与 Python 协作的一些活动要点：


    ### 命令行交互


    对于初学者来说，与命令行关联是操作 Python 最简单的方法。可以将 Python 简单理解为通过对 `>>>` 提示符后输入的每个完成的指令做出反应来工作的。命令行可能不是
    Python 最喜爱的交互方式，但多年来，它证明是研究 Python 如何运行的最简单方法。


    ### 使用命令行启动 Python


    如果你使用 macOS、GNU/Linux 和 UNIX 框架，你应该运行终端（Terminal）工具来进入命令行。同样，如果你使用的是 Windows，可以通过右键点击开始菜单并启动
    `Windows PowerShell` 来进入 Python 命令行。


    由于编程需要指令的贡献，当你需要 Python 为你做某些事情时，你将通过输入它了解的类似指令来训练它。指令的微调可能会产生理想的结果；请谨慎。


