- raw: "In the world of programming, using Python language is found to be easier and\
    \ programmer-friendly, thus, the universal use.  \n\nDiscussed below are information\
    \ on how to download python for MS Windows. In this particular demo, we have chosen\
    \ windows because it’s the most common worldwide – even in not so progressive\
    \ countries. We want to cater to the programming needs of everyone all over the\
    \ globe. \n\nPython 2.7.17 version was selected because this version bridges the\
    \ gap between the old version 2 and the new version 3.  \n\nSome of the updated\
    \ functions/applications of version 3 are still not compatible with some devices,\
    \ so 2.7.17 is a smart choice. \n\nSteps in downloading Python 2.7.17, and installing\
    \ it on Windows   \n\n1.  Type python on your browser and press the Search button\
    \ to display the search results. \n\nScroll down to find the item you are interested\
    \ in. In this instance, you are looking for python. click “python releases for\
    \ windows”, and a new page opens. See image below: \n\n![A screenshot of a cell\
    \ phone Description automatically generated](Images/image00238.jpeg)  \n\n2. \
    \ Select the Python version, python 2.7.17, and click, or you can select the version\
    \ that is compatible to your device or OS.  \n\n![A screenshot of a social media\
    \ post Description automatically generated](Images/image00239.jpeg)  \n\n3.  The\
    \ new page contains the various python types. Scroll down and select an option:\
    \ in this instance, select Windows x86 MSI installer and click. \n\n![Description:\
    \ 00004.jpeg](Images/image00240.jpeg)  \n\n4.  Press the Python box at the bottom\
    \ of your screen. \n\nClick the “Run” button, and wait for the new window to appear.\
    \ \n\n5.  Select the user options that you require and press “NEXT”. \n\nYour\
    \ screen will display the hard drive where your python will be located.  \n\n\
    ![Description: 00006.jpeg](Images/image00241.jpeg)  \n\n6.  Press the “NEXT” button.\
    \ \n\n7.  Press yes, and wait for a few minutes. Sometimes it can take longer\
    \ for the application to download, depending on the speed of your internet.  \n\
    \n8.  After that, click the FINISHED button to signify that the installation has\
    \ been completed \n\n![Description: 00007.jpeg](Images/image00242.jpeg)  \n\n\
    Your python has been installed in your computer and is now ready to use. Find\
    \ it in drive C, or wherever you have saved it. \n\nThere can be glitches along\
    \ the way, but there are options which are presented in this article. If you follow\
    \ it well, there is no reason that you cannot perform this task.  \n\nIt’s important\
    \ to note that there’s no need to compile programs. Python is an interpretive\
    \ language and can execute quickly your commands. \n\nYou can also download directly\
    \ from the Python website, by selecting any of these versions – 3.8.1 or 2.7.17.\
    \ and clicking ‘download.’ \n\nSee image below: \n\n![](Images/image00243.gif)\
    \  \n\nFollow the step by step instructions prompted by the program itself. Save\
    \ and run the program in your computer. \n\nFor Mac \n\nTo download Python on\
    \ Mac, you can follow a similar procedure, but this time, you will have to access\
    \ the “Python.mpkg” file, to run the installer.  \n\n![](Images/image00244.jpeg)\n\
    \nFor Linux \n\nFor Linux, Python 2 and 3 may have been installed by default.\
    \ Hence, check first your operating system. You can check if your device has already\
    \ a Python program, by accessing your command prompt and entering this: python—version,\
    \ or python3—version. \n\nIf Python is not installed in your Linux, the result\
    \ “command not found” will be displayed. You may want to download both Python\
    \ 2.7.17 and any of the versions of Python 3 for your Linux. This is due to the\
    \ fact that Linux can have more compatibility with Python 3. \n\nFor windows users,\
    \ now that you have downloaded the program, you’re ready to start. \n\nAnd yes,\
    \ congratulations! You can now begin working and having fun with your Python programming\
    \ system.\n\nWriting The First Python Program \n\nBeginners may find it difficult\
    \ to start using Python. It’s a given and nothing’s wrong about that. However,\
    \ your desire to learn will make it easier for you to gradually become familiar\
    \ with the language.  \n\nHere are the specific steps you can follow to start\
    \ using Python. \n\nSteps in using Python \n\nStep #1–Read all about Python. \n\
    \nPython has included a README information in your downloaded version. It’s advisable\
    \ to read it first, so you will learn more about the program.  \n\nYou can start\
    \ using your Python through the command box (black box), or you can go to your\
    \ saved file and read first the README file by clicking it.  \n\nSee image below:\
    \ \n\n![Description: 00023.jpeg](Images/image00245.jpeg)  \n\nThis box will appear.\
    \  \n\n![Description: 00024.jpeg](Images/image00246.jpeg)  \n\nYou can read the\
    \ content completely, if you want to understand more what the program is all about,\
    \ the file-setup, and similar information.  \n\nThis is a long data that informs\
    \ you of how to navigate and use Python. Also, Python welcomes new contributions\
    \ for its further development. \n\nYou can copy paste the content of the box into\
    \ a Window document for better presentation.  \n\nIf you don’t want to know all\
    \ the other information about Python and you’re raring to go, you can follow these\
    \ next steps. \n\nStep #2–Start using Python. \n\nFirst open the Python file you\
    \ have saved in your computer. Click on Python as show below. In some versions,\
    \ you just click ‘python’for the shell to appear. \n\nSee image below: \n\n![Description:\
    \ 00025.jpeg](Images/image00247.jpeg)  \n\nYou can start using Python by utilizing\
    \ the simplest function, which is ‘print’. It’ s the simplest statement or directive\
    \ of python. It prints a line or string that you specify.  \n\nFor Python 2, print\
    \ command may or may not be enclosed in parenthesis or brackets, while in Python\
    \ 3 you have to enclose print with brackets.  \n\nExample for Python 2:  \n\n\
    print “Welcome to My Corner.” \n\nExample for Python 3: \n\n              print \
    \ (“Welcome to My Corner”) \n\nThe image below shows what appears when you press\
    \ ‘enter’. \n\n![Description: 00026.jpeg](Images/image00248.jpeg)  \n\nYou may\
    \ opt to use a Python shell through idle. If you do, this is how it would appear:\
    \ \n\n![Description: 00027.jpeg](Images/image00249.jpeg)  \n\nIn the Python 3.5.2\
    \ version, the text colors are: function (purple), string (green) and the result\
    \ (blue). (The string is composed of the words inside the bracket (“Welcome to\
    \ My Corner”), while the function is the command word outside the bracket (print). \
    \ \n\nTake note that the image above is from the Python 2.7.12 version.  \n\n\
    You have to use indentation for your Python statements/codes. The standard Python\
    \ code uses four spaces. The indentations are used in place of braces or blocks. \
    \ \n\nIn some programming languages, you usually use semi-colons at the end of\
    \ the commands–in python, you don’t need to add semi-colons at the end of the\
    \ whole statement. \n\nIn Python, semi-colons are used in separating variables\
