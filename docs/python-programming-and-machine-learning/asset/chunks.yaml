    \ D |\n| 1110 | E |\n| 1111 | F |\n\nFrom the table, we can see `( 1001 )2` is\
    \ `( 9 )16` and `( 0110 )2`, the MSB group, is `( 6 )16`. \n\nTherefore, `( 1101001\
    \ )2 = ( 01101001 )2`.\n\n### Hexadecimal to Binary\n\nWe can use the above table\
    \ to quickly convert hexadecimal to binary. \n```\n( 4 )16 = 0100 )2\n( E )16\
    \ = 1110 )2\n( 9 )16 = 1001 )2\n( 6 )16 = 0110 )2\n```\n\n### Decimal to Hexadecimal\n\
    \nYou can say decimal supports decimal point. Let’s convert to hexadecimal. But,\
    \ first, we have to remember: \n\n### Fractions (Floating Points)\n\nBinary system\
    \ supports decimal point to represent fractional values. \n\n![00005.jpeg](Images/image0236.jpeg)\n\
    \n### Negatives\n\nIn binary system we use MSB as sign bit, which means if the\
    \ MSB is 1, the number is negative and if the MSB is 0, it is positive. Determining\
    \ if a hexadecimal number is negative or positive is a bit tricky. \n"
  trans: "\n\n这也被称为印度-阿拉伯数字系统。十进制对人类来说更有意义，并被应用于日常生活中。原因有两个： \n\n*   从基数符号创建大数字遵循一致的模式。\n\
    *   与其他系统相比，在十进制系统中进行算术运算更容易。\n\n## 六进制系统\n\n六进制系统是唯一使用字母作为符号的系统。它包含了十进制的 10 个符号加上六个字母\
    \ `A`、`B`、`C`、`D`、`E` 和 `F`。这也是一种十六进制位制。\n\n六进制系统广泛用于汇编语言中的指令编码。\n\n## 数字进制转换\n\
    \n我们可以将数字从一种系统转换为另一种系统。有很多在线工具可以实现此操作。Python 也提供了数字转换，但最好学习如何手动进行。\n\n### 二进制转十进制\n\
    \n有一个二进制数 `01101001`，让我们将其转换为十进制数。\n\n```\n( 01101001 )2 = 0 x 27 + 1 x 26 + 1\
    \ x 25 + 0 x 24 + 1 x 23 + 0 x 22 + 0 x 21 + 1 x 20 \n( 01101001 )2 = 0 + 64 +\
    \ 32 + 0 + 8 + 0 + 0 + 1 \n( 01101001 )2 = ( 105 )10\n```\n\n### 十进制转二进制\n\n要将十进制数转换为二进制，我们反复将数字除以二，直到商变为一。记录每次除法步骤产生的余数，就得到了十进制数的二进制等效值。\n\
    \n![00004.jpeg](img/image00235.jpeg)\n\n这里值得注意的一点是，`( 01101001 )2` 和 `( 1101001\
    \ )2` 表示相同的十进制数 `( 105 )10`。这意味着就像十进制系统一样，二进制系统中的前导零是可以忽略的。\n\n### 二进制转六进制\n\n\
    可以使用两种方法将二进制转换为六进制等效值：\n\n1. 将二进制数转换为十进制，然后将十进制转换为六进制数。\n2. 将二进制数每四位分组，并将每组转换为相应的六进制等效值，保持这些组在原始二进制数中的位置不变。\n\
    \n让我们使用第二种方法将 `( 1101001 )2` 转换为六进制数。第一步是将二进制数分成若干组，每组四。如果最高位（MSB）组少于四位，则通过添加前导零将其补齐为四位。分组从最低位（LSB）开始。因此，`(\
    \ 1101001 )2` 将带我们得到 `( 1001 )2` 和 `( 0110 )2`。现在，记住它们在原始二进制数中的位置，我们将把每组转换为六进制等效值。\n\
    \n以下是四位二进制数的六进制等效值表。\n\n| 二进制 | 六进制 |\n| --- | --- |\n| 0000 | 0 |\n| 0001 | 1\
    \ |\n| 0010 | 2 |\n| 0011 | 3 |\n| 0100 | 4 |\n| 0101 | 5 |\n| 0110 | 6 |\n| 0111\
    \ | 7 |\n| 1000 | 8 |\n| 1001 | 9 |\n| 1010 | A |\n| 1011 | B |\n| 1100 | C |\n\
    | 1101 | D |\n| 1110 | E |\n| 1111 | F |\n\n从表中，我们可以看到 `( 1001 )2` 是 `( 9 )16`，而\
    \ `( 0110 )2`（最高位组）是 `( 6 )16`。\n\n因此，`( 1101001 )2 = ( 01101001 )2`。\n\n### 六进制转二进制\n\
    \n我们可以上表快速将六进制转换为二进制。\n\n```\n( 4 )16 = 0100 )2\n( E )16 = 1110 )2\n( 9 )16 =\
    \ 1001 )2\n( 6 )16 = 0110 )2\n```\n\n### 十进制转六进制\n\n你可以说十进制支持小数点。让我们将其转换为六进制。但是，首先我们需要记住：\n\
    \n### 小数（浮点数）\n\n二进制系统支持小数点来表示小数值。\n\n![00005.jpeg](img/image0236.jpeg)\n\n###\
    \ 负数\n\n在二进制系统中我们使用最高位（MSB）作为符号位，这意味着如果 MSB 为 1，则数字为负数；如果 MSB 为 0，则是正数。判断一个六进制数是正是负有点棘手。\n\
    \n"
