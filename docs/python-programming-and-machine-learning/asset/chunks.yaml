    This kind of data collection was increasing in the offline world as well, as computing
    power started to grow. For example, grocery-stores started offering supposed discount
    and membership cards, that really functioned to track what people were buying,
    so that the companies could make customized offers to customers, and so they could
    adjust their marketing plans and so forth.


    The internet also brought the concept of cloud computing to the forefront. Rather
    than having a single computer, or a network of computers in one office, the internet
    offered the possibility of harnessing the power of multiple computers linked together
    both for information processing and doing calculations and also for simple data
    storage.


    A third development, the continual decline in the costs of storage components
    of computer systems along with increased capacity had a large impact in this area.
    Soon, more and more data was being collected. Large companies like `Google`, and
    eventually `Facebook`, also started collecting large amounts of data on people’s
    behavior.


    This is where machine learning hits the road. For the first time, the amounts
    of data that machine learning systems needed to be able to perform real world
    tasks, not just do things like playing checkers, became possible. Machine learning
    systems are trained on data sets, and now businesses (and governments) had data
    of all kinds to train machine learning systems to do many different tasks.


    # Goals and Applications of Machine Learning


    Machine learning is something that can be applied whenever there is a useful pattern
    in any large data set. In many cases, it is not known what patterns exist before
    the data has been fed to a machine learning system. This is because human beings
    are not able to see the underlying pattern in large data sets, but computers are
    well suited to finding them. The types of patterns are not limited in any way.
    For example, a machine learning system can be used to detect hacking attempts
    on a computer network. It can be trained for network security by feeding the system
    past data that includes previous hacking attempts.


    ![00002.jpeg](Images/image00274.jpeg)


    In another case, a machine learning system can be used to develop facial recognition
    technology. The system can be presented with large numbers of photographs that
    contain faces, so that it can learn to spot faces, and to associate a given face
    with a particular individual.


    Now let’s consider another application of machine learning, which is completely
    different from the other two we’ve looked at so far. Machine learning can be used
    to approve or disapprove a loan application. During the training phase, the system
    will be exposed to a large number of previous loan applications and the ultimate
    results. In other words, did the borrower pay the loan off early or default on
    the loan? During the exposure to all the data, the system will learn what characteristics
    or combinations of characteristics best predict whether or not a given applicant
    is going to default on a loan. This is all done without human input, and so the
    machine may find patterns in the data that human observers missed and never suspected
    were there. The fact is that human minds are not very good at being able to analyze
    large data sets, and some would probably argue that we can’t do it at all.


    One of the earliest applications of machine learning was in the detection of email
    spam. This is a good example to look at, because it illustrates a particular type
    of problem that machine learning systems are good at solving. Determining whether
    or not an email is spam or not is something that can be framed as a classification
    problem. In other words, you take each email, examine it, and classify it as spam
    or not spam. This is not something that can be taken to be absolute, and detecting
    all spam messages can be tricky.


    Fraud detection with credit and debit cards is yet another application of machine
    learning. By studying past data, the system can learn to detect patterns in usage
    that indicate that the card is being used in a fraudulent manner. In many cases,
    the patterns that are detected are going to be things that human observers are
    completely unaware of, or wouldn’t associate with fraud detection even if they
    knew the patterns existed.


    So, we see that machine learning can be applied in virtually any situation where
    there is a large amount of data available, and there are patterns in the data
    that can be used for the purposes of detection or prediction. Machine learning
    is quite general, able to learn anything from playing chess to spotting fuel waste
    for an airline like `Southwest`. This is not the artificial intelligence that
    was once imagined by science fiction writers in the 1960s or 1970s, but it does
    have many characteristics of human learning. The first is that it’s quite general.
    The second is that it will perform better, the more data that it is exposed to.


    Now let’s consider the goals of machine learning. The central goal of machine
    learning is to develop general purpose algorithms that can solve problems using
    intelligence and learning.


    Obviously one important goal of machine learning is to increase productivity.
    This is true whether or not the user of the system is a business, a military branch,
    or a government agency.


    The second goal is to replace human labor with better machine labor. Of course,
    this has been a goal of technology ever since the industrial revolution started,
    and it continues to be an important goal today. However, the way that this is
    being done in the case of machine learning is a little bit different. The first
    thing is using machine learning to perform tasks that require a level of attention
    and focus that human beings are not able to provide. Even when humans are excellent
    workers who will provide maximum focus, a human suffers from many flaws, like
    fatigue, and the ability to be distracted. Also, the amount of information that
    a human observer can pay attention to at any given time is very limited. Consider
    a machine learning system instead–focus is never an issue. A computer system is
    able to generate laser-like focus in a way that a human being never could. Second,
    it is able to analyze and sample a far larger data set, and of course it will
    never be subject to fatigue and it’s not need restroom breaks or lunch.


    One application–in a general sense–that is being used in many businesses today
    is using machine learning to spot waste. Several large corporations have already
    had great success with this. We’ve already mentioned one, `Southwest` famously
    used machine learning to analyze the activity of airlines on the tarmac, and they
    found a great deal of waste in terms of time and fuel was spent by planes idling
    on the tarmac. `UPS` has also used machine learning to spot wasteful driving routes
    that cost the company time and money, at the expense of having thousands of trucks
    waste gallons of fuel. Machine learning can also be applied to find out what employees
    are doing and how they can better use their time.


    ## Benefits of Machine Learning


    There are a large number of benefits for businesses that use machine learning.
    We can summarize a few of them here:


    * Machine learning can easily find patterns in any underlying data set.

    * Systems based on machine learning get better with experience. The more data
    they see, the better they are going to get.

    * Machine learning is quite general, and can be applied to nearly any application,
    from detecting hacking attempts on a computer network to picking winning stocks.

    * Machine learning systems can handle multidimensional problems that would overwhelm
    human observers.

    * Once a system has gone through the learning phase, further human intervention
    is not required. This is a true system that uses automation.

    * Machine learning can be applied across a broad spectrum, and it can be used
    to solve nearly any problem that a business may encounter.

