    We have already spent some time taking a look at the lifecycle that comes with
    data science, but to help us learn more about it, and to have a review, let’s
    go over the steps. We will need to come up with the main business problem that
    we would like to solve and then begin collecting the data that we want to use.
    Since this data is going to be found in a lot of different locations, we will
    be able to format it, clean it off, and make sure that the outliers, duplicates,
    and missing values are taken care of.


    From there, we are able to deal with the data through an algorithm. With the help
    of the `Python` coding language and all of the features that it is able to provide,
    we will see that there are a ton of algorithms that work well for this process.
    We can choose the one that we need, and then do some training and testing of the
    information ahead of time to make sure it is ready for making predictions. We
    can then finish off the whole thing with some visualizations that make it easier
    to see some of the complex relationships and correlations that happen inside of
    our data.


    From there, we need to move on to some of the components that will show up in
    our data science project. There are a lot of components that need to come together
    and need to work together to ensure we are actually able to get the most out of
    any data science project we are working with.


    ### Types of Data

    The first component that we need to spend some time on is to pay attention to
    the types of data that we are working with. The raw data that we have is so important
    because it is going to be the foundation for all of the other things that we do
    through this process. The two main types of data that you are going to be able
    to find through this process though will be the structured data, which is the
    kind we find in some tabular forms or a data set. And then we can also have a
    type of data that is known as unstructured which will include images, videos,
    emails, and PDF files to name a few.


    ### Programming

    The second components that we are going to find when we look at data science are
    programming. You have to come up with some programming in order to make those
    mathematical models that we talked about earlier and to get them to really sort
    through the information and make predictions. All of the analysis and management
    of the data is going to be done by computer programming. The two most popular
    languages that are used in data science will include `R` and `Python` so learning
    one of these can be helpful.


    ### Probability and Statistics

    Next on the list is going to be probability and statistics. Data is going to be
    manipulated in a manner that it is able to extract information and trends out
    of that data. Probability and statistics are going to be the mathematical foundation
    that brings it all together. Without having a good idea and a lot of knowledge
    about these two topics, it is possible that you will misinterpret the data, and
    will come up with conclusions that are not correct. This is a big reason why probability
    and statistics are going to be so important to the world of data science.


    ### Machine Learning

    We also have to take a look at the idea of machine learning when we are looking
    at data science. When someone is working through all of that big data and everything
    is contained inside of it, they are also going to use a lot of the algorithms
    that come with machine learning. This can include the methods of classification
    and regression at the same time.


    ### Big Data

    And the final key component that we need to spend some time on here is the idea
    of big data. In the world we live in today, raw data is so important, but we need
    to be able to take it and turn it into something that we are actually able to
    use. There is a lot of good information in all of that data, but if it is just
    sitting there, and we are not able to get all of that information out of it that
    we need, then it is going to be worthless to us.


    This is where the `Python` algorithms are really going to come into play. You
    will find that when we pick out the algorithms and use the right ones, we can
    take all of this raw data, the data that may be a mess, unorganized, and hard
    to work with, and can actually turn it into something that we are able to use
    and appreciate overall.


    There are a lot of different things that we will be able to work with when it
    comes to working with data science. There are a lot of parts that come with data
    science though. We have to make sure that we know all of the different parts of
    the data science process.


    # Chapter 12: A Quick Look at Deep Learning


    Artificial intelligence is a field of study that has come up in many conversations
    for years. A few years ago, this was a futuristic concept that was propagated
    in movies and comic books. Through years of development and research, we are currently
    experiencing the best of artificial intelligence. In fact, it is widely expected
    that AI will help us usher in the new frontier in computing.


    Artificial intelligence might share some similarities with machine learning and
    deep learning, but they are not the same thing. Many people use these terms interchangeably
    without considering the ramifications of their assumptions. Deep learning and
    machine learning are knowledge branches of artificial intelligence. While there
    are different definitions that have been used in the past to explain artificial
    intelligence, the basic convention is that this is a process where computer programs
    are built with the capacity to operate and function like a normal human brain
    would.


    The concept of AI is to train a computer to think the same way a human brain thinks
    and functions. In as far as the human brain is concerned, we are yet to fully
    grasp the real potential of our brains. Experts believe that even the most brilliant
    individuals in the world are unable to fully exhaust their brain capacity.


    This, therefore, creates a conundrum, because if we are yet to fully understand
    and test the limits of our brains, how can we then build computing systems that
    can replicate the human brain? What happens if computers learn how to interact
    and operate like humans to the point where they can fully use their brainpower
    before we learn how to use ours?


    Ideally, the power behind AI or the limits of its thinking capacity is yet to
    be established. However, researchers and other experts in the field have made
    great strides over the years. One of the closest examples of AI that espouses
    these values is `Sophia`. Sophia is probably the most advanced AI model in the
    world right now. Perhaps given our inability to fully push the limits of our brains,
    we might never fully manage to push the limits of AI to a point where they can
    completely replace humans.


    Machine learning and deep learning are two branches of artificial intelligence
    that have enjoyed significant research and growth over the years. The attention
    towards these frameworks especially comes from the fact that many of the leading
    tech companies in the world have seamlessly implemented them in their products,
    and integrated them into human existence. You interact with these models all the
    time on a daily basis.


    Machine learning and deep learning do share a number of features, but they are
    not the same. Just as is the case with comparing these two with artificial intelligence.
    In your capacity as a beginner, it is important to learn the difference between
    these studies, so that you can seek and find amazing opportunities that you can
    exploit and use to further your skills in the industry. In a world that is continually
    spiraling towards increased machine dependency, there are many job openings in
    machine learning and deep learning at the moment. There will be so much more in
    the near future too, as people rush to adapt and integrate these systems into
    their daily operations and lives.


    ## Deep Learning vs Machine Learning

