    由于现在层出不穷的新计算技术，我们今天所熟知的机器学习与过去看到的机器学习已经大不相同。它诞生于对模式的形状识别，以及关于计算机如何在没有程序员干预确保其执行特定任务的情况下，能够实现实际学习的想法。对人工智能所实现的某些功能感兴趣的研究人员，也想看看他们的机器是否能够从输入的数据中进行学习。


    这种机器学习伴随的迭代特性应该被视为一种重要的编程工具，因为当我们把通过这种学习创建的任何模型暴露给新数据时，模型能够自主且独立地进行适应。机器将能够学习过去发生过的事情以及提供给它的示例，以便在未来做出准确且可靠的预测。


    近年来，由于几个不同因素的影响，人们对机器学习的兴趣再次复燃。特别是，像贝叶斯分析和数据挖掘等某些领域也变得越来越流行，在这个过程中，机器学习的使用将比以往任何时候都更加频繁。


    所有这些点都意味着，现在通过机器学习自动生成模型变得更加容易、更快速。这些模型现在能够分析更大、更复杂的数据，同时提供更快、更准确的结果，即使是在在大规模执行时也是如此。由于所有这些要素能够汇聚并构建出更精确的模型，组织将能够比以前更好地识别盈利机会，同时预先规避更多未知的风险。这一切共同帮助公司在市场中变得更具竞争力。


    为了确保你在机器学习中使用的系统确实是好的，需要几项要素共同作用。其中一些将包括：


    1. 集成建模

    2. 可扩展性

    3. 迭代和自动化流程

    4. 算法，基础与高级算法的良好结合

    5. 数据准备能力


    使用机器学习的一个奇妙之处在于，几乎每个行业都能使用它。在技术领域，它仍然相对新颖，因此即使到目前为止取得的惊人成就也只是开始，人们相信这种技术在过程中能够完成更多事情。


    随着时间的推移，机器学习可能会大幅增长。目前，许多公司正在使用它来弄明收到的数据告诉了他们什么，弄明如何随时间推移做出更好的业务决策，而不是自己做决定，并发现数据中隐藏的、人类无法遍历的模式。


    但这仅仅是我们在机器学习方面所能做到的开始。还有大量的其他应用，我们现在能做的事情仅仅是开始。随着越来越多的人和开发者开始接触机器学习，并在其中加入一些 `Python`
    语言，可能会有越来越多的应用程序出现。


    大多数已经在处理海量数据的行业都能够识别出使用机器学习技术所带来的价值。通过能够实际处理这些数据并从中洞察一些良好的见解，并能够近乎实时地这样做，公司就能以更高效的方式工作，从而在同行业中获得巨大的竞争优势。


    这就是使用机器学习的美之处。在机器学习的帮助下，我们能够做一些过去看似不可能的事情现在是可能的。处理的数据比以往任何时候更多的企业正在发现机器学习的价值，可以帮助他们完成工作。他们处理这些信息的速度比人工查看快得多，并能带给他们竞争竞争优势。


    许多不同的公司将从运行在机器学习上的程序中受益。已经在使用这种技术的某些行业包括金融服务、政府、医疗保健、零售、石油天然气、运输等。


    机器学习类似于人工智能，它允许计算机进行学习，就像我们在人类大脑中看到的那样。在人类的极少监督下，机器能够自动化许多任务，找到你想要的信息，并获得一些你可能无法通过其他方法自行找到见解和预测。本指南将花费一些时间研究你如何借助
    `Python` 编程语言进行这类机器学习，以便你能够迅速启动自己的项目。


    # 第 2 章 机器学习的应用


    机器学习帮助改变了当今世界企业工作和运作的方式。通过机器学习，可以提取大量数据，使用户户更容易从数据集中得出某些预测。


    如果任务包括对大量数据的分析，那么一个人无法在规定的时间内完成许多手动任务。机器学习是此类问题的解决办法。在现代世界中，我们被海量的数据和信息淹没，人类无法处理这些信息。因此，需要此类流程自动化，而机器学习为此提供了帮助。


    当任何分析或发现被完全自动化后，将从该分析中获取必要信息将变得更容易。这将有助于工程师自动化未来的任何流程。业务分析、数据科学和大数据的世界需要机器学习和深度学习。商业智能和预测性学习不再局限于大型企业，小公司和小企业也可以使用。这使得小企业能够有效利用其收集的信息。本节涵盖了机器学习在现实世界中的一些应用。


    ## 虚拟助理


    虚拟助理的一些示例包括 Allo、Google Now、Siri 和 Alexa。这些工具帮助用户通过语音命令访问信息。你只需要激活助手，就可以向机器提任何你想问的问题。


    你的个人助手将根据你的问题寻找必要信息，然后为你提供答案。你还可以使用这个助手执行常规任务，如设置提醒或闹钟。机器学习是该工具的重要组成部分，因为它帮助系统收集答案所需的必要信息。


