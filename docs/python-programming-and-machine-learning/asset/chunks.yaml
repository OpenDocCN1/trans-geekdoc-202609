    \ Structured Data Sets\n\nThe first type of data that we need to spend time working\
    \ with is structured data. Traditionally we would just have this kind of data\
    \ in the past, which was harder to get but was easy to work with. Companies would\
    \ look for some of the structured data that they need, and then make some of the\
    \ business decisions and more that they need to move forward. \n\nThis kind of\
    \ data is going to be any data that has been organized well and is then going\
    \ to fit into a formatted repository for us to use. Usually, this is going to\
    \ be data that is stored in a database so that the elements can be used for more\
    \ effective processing and analysis. \n\nWe may be able to find this kind of data\
    \ when we are going through other databases to help with the information, or when\
    \ we get the results of a survey. This one is much easier to work with because\
    \ it is already organized, and it is going to fit into the algorithm that you\
    \ want to work with without you have to worry about missing values, duplicates,\
    \ outliers, or anything else like this. It is also a much more expensive method\
    \ of working with data, which can make it harder to work with overall as well.\
    \ \n\nThis is why many companies have to make a balancing act over how much-structured\
    \ data and how much-unstructured data they want to work with. The structured data\
    \ can make the work easier and will ensure that the algorithm is going to work\
    \ better, but it is harder to collect, there is less of it, and it is more expensive.\
    \ The unstructured data is sometimes hard to work with and takes time to clean\
    \ and organize, but there are endless amounts of it, it can still be used to handle\
    \ your machine learning algorithms, and it is a lot less expensive to gather up\
    \ and use.\n\n## Unstructured Data Sets\n\nThe second type of data that we need\
    \ to take a look at is the unstructured data. This is basically going to represent\
    \ any of the data that doesn’t provide us with a recognizable structure to it.\
    \ It is going to be raw and unorganized, and there may not be any rhyme or reason\
    \ to what you are seeing. Unstructured data is often going to be called loosely\
    \ structured data in some cases, where the sources of data may have some kind\
    \ of structure, but not all of the data in that set will end up following the\
    \ same structure, so you will still have some work to handle to make them work\
    \ for your needs. \n\nFor those businesses that are going to center around the\
    \ customer, the data that is found in this kind of form can be examined and there\
    \ is so much that we are able to get out of it, such as using it to enhance the\
    \ relationship marketing and the customer relationship management that happens\
    \ as well. The development of unstructured data, as time goes on, is likely to\
    \ keep growing because more and more businesses are looking to gather this information,\
    \ and it can be gathered and created in no time at all. \n\nUnstructured data\
    \ is going to refer to any data that is able to follow a form that is less ordered\
    \ than items like a database, table, spreadsheets, and other ordered sets of data.\
    \ In fact, the term data set is going to be a good way to look at this because\
    \ it is going to be associated with data that is neat and doesn’t have any extra\
    \ content. We are basically working with a lot of data that is not necessarily\
    \ organized and can be hard to work with without some help organizing. \n\nThere\
    \ are a ton of instances where we are going to see this kind of data. We may see\
    \ it in documents, social media posts, medical records, books, collaboration software,\
    \ instant messages, presentations, and Word documents, to name a few. We are able\
    \ to work with some non-textual unstructured data, and we will see that this can\
    \ include video files, `JPEG` images and even some `MP3` audio files as well.\
    \ \n\nMost of the data that you are going to work with over time will rely on\
    \ the idea of unstructured data. There is so much of this kind of data out there\
    \ to work with, and it is often easier to find and less expensive compared to\
    \ some of the structured data that we talked about above. Being prepared to handle\
    \ some of this unstructured data and make sure that it is prepared and ready to\
    \ go with some of your machine learning algorithms.\n\n## How to Manage the Missing\
    \ Data\n\nWe also need to spend some time working with the missing data that comes\
    \ in. When we are gathering all of that data from all of those different sources,\
    \ it is likely that at least some of that data is going to come in missing. Whether\
    \ this is just one part of the data, or there are a lot of values that are missing\
    \ for entry, we need to know how we can manage these missing data points. \n\n\
    If we tried to push some of these missing data points through the chosen algorithm,\
    \ it would not end up going all that well. The algorithm may or may not be able\
    \ to handle some of the issues with the missing data and even if the algorithm\
    \ is able to handle the missing values, there could be issues with it skewing\
    \ the results. This is why it is important to choose which method you would like\
    \ to use when it is time to manage missing data. \n\nThe method you choose will\
    \ depend on the type and amount of missing data. If you just have a few points\
    \ that are missing, then it is probably fine to erase those points and not worry\
    \ about them at all. This can be the easiest method to work with because you will\
    \ be able to get them gone in no time. However, for the most part, it is important\
    \ to keep all of the data that you have, and filling them in is a better way to\
    \ manage the data.\n\nThere are a few ways that you are able to fill in the missing\
    \ data. Usually, going with the average or the mean of the rest of the data, is\
    \ going to be a good way to start. This ensures that you are still able to use\
    \ the data that is missing, while not losing out on some of the important parts\
    \ that you need with that entry as well. Find the standard that you want to use,\
    \ and then fill in those missing parts so that the data can work better with the\
    \ algorithm that we are using.\n\nIn addition to the missing data, we need to\
    \ spend some time learning how to manage the outliers and duplicate content. Both\
    \ of these, if they are not taken care of, is going to skew the results that you\
    \ get. It is important to figure out the best way to handle both of these before\
    \ you move on. \n\nTo start, we have the outliers. If you have big outliers that\
    \ are random but really high or really low compared to the rest of the values,\
    \ you will find that it is going to mess with your results, and those results\
    \ are not going to be as accurate as you would like. If this is what happens with\
    \ your data, then it is probably best to just delete the outlier. It is just something\
    \ that is not that important, and removing it will ensure that you are able to\
    \ handle the data in an accurate manner.\n"
