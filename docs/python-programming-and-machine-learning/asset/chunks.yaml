    # 我们接下来需要关注的重点是如何命名所有的标识符。你需要以一种合理的方式进行命名，并且不会在此过程中困扰计算机。每当你在 `Python` 中编写特定的代码时，至少会有几个标识符出现。这些标识符中最常见的包括类（classes）、实体（entities）、变量和函数。


    在某个时刻，你将需要命名标识符，以便它们更有可能按照预期方式工作，并在执行代码时让编译器更容易提取出它们。无论你使用这四种标识符中的哪一种，命名规则都是相同的，这可以让你在开始时更加容易。在命名标识符时你应该记住的一些规则包括：


    - 任何时候你使用字母，可以使用大写或小写，两者组合也可以。你还可以在名称中添加数字、符号和下划线。这些元素的任何组合都是接受的，但请确保名称字符之间没有空格。

    - 永远不要用数字开头标识符。这意味着编写 `4babies` 这个名称将导致你的计算机报错。然而，如果你愿意，将标识符命名为 `fourbabies` 是可以的。

    - 标识符绝不应该是 `Python` 的关键字之一，且名称中不应出现该关键字。


    现在，如果你在在此过程中尝试编写一些代码，但没有遵循上述所有规则，你就会困扰编译器，它会向你发送错误消息让你知道出了问题。随后错误将出现在你的计算机上，程序将关闭，因为并不知道如何继续操作。这是你不希望发生的事情，所以在在命名这些标识符时要小心。


    关于这些标识符及其命名的另一点需要记住的是，你要确保选择的名称是你容易记忆的。选择易于理解和阅读的名称，如果另一个程序员进来尝试查看代码，将会让事情变得更容易。


    ## 关于 Python 编程语言我还需要了解什么？


    `Python` 编程语言通常被专家们认为是最好的编程语言之一，如果你是一个从未接触过编程的人，事实更是如此。这种语言非常简单，功能强大，并且有许多工具和资源来帮助你完成项目，即使该项目涉及机器学习。虽然在机器学习中可以使用其他选项，但那些选项通常处理起来更困难一些，而
    `Python` 通常是更好的选择。


    当你刚开始学习 `Python` 语言时，你会喜欢的一点是，它是基于英语的。这意味着你能够识别这些单词及其含义，而不是尝试去猜。尽管它对于从未工作过编程的初学者来说是一种非常棒的语言，但它足以足够处理机器学习以及你喜欢的任何主题。


    作为一个准备好学习并开始使用 `Python` 语言的人，你会发现它有一个非常棒大的库可以在你编写代码时利用。这个库将包含你所需的工具和资源，让初学者和专家都能更容易写出他们需要的任何代码。


    ## 第 8 章：机器学习算法


    现在你已经理解了机器学习的概念并集齐了所有的工具，是时候开始探索强大的算法了。请记住，虽然你会单独学习每种算法和技术，但在现实场景中，它们很少以这种方式使用。在处理复杂数据集时，你通常会将监督机器学习技术与无监督机器学习技术以及许多其他过程结合起来使用。


    在本章中，我们将关注一些在处理理想数据集时单独运行良好，并且在结合使用时能够获得更高准确性和效率的算法。我们将包含的一些算法有线性回归、决策树和支持向量机。


    ### 线性回归


    许多机器学习问题（如预测分析）都是使用线性回归处理的。只要训练数据有价值且不包含太多噪声，这种技术在以高准确度预测结果方面非常强大。请记住，这就是为什么你需要进行数据预处理，以清除一些可能影响结果的噪声和离群值。


    线性回归的一个特征是基于独立变量计算预测值。换句话说，当你需要计算多个变量之间的联系时，你就应该选择这种算法。然而请注意，线性回归只能处理回归问题，而不能处理分类问题。有其他算法专门用于此类。


    现在让我们来看如何使用 `Scikit-learn` 和开源数据集应用线性回归的示例。我们将使用 `Scikit` 库，因为它包含了许多针对机器学习的算法以及某些公共数据集。其中一个数据集是波士顿房价市场数据集，它的文档完备且数据干净。为了高效地使用线性回归，我们将整个集合划分为训练集（80%）和测试集（20%）。让我们开始工作吧：


    ```python

    from sklearn.datasets import load_boston


    boston = load_boston()


    from sklearn.cross_validation import train_test_split


    X_train, X_test, Y_train, Y_test = train_test_split(boston.data, boston.target,
    test_size=0.2, random_state=0)

    ```


    正如你看到的，`Python` 代码非常易读，不需要太多解释就能理解。我们导入了数据集并进行了划分以获取训练集和测试集。`train_test_split`
    函数是 `Scikit-learn` 库包含工具的完美示例。你会注意到我们通过指定目标测试数据集值为 `0.2` 来声明百分比。这意味着它包含数据的 20%。还有一个
    `random_state` 参数，用于定义在划分过程中生成随机数的值。基本上，它随机选择被分类为训练数据或测试的数据。


    在下一阶段，我们需要应用回归器以便我们的线性回归算法做出准确预测。一旦实现，我们需要做的就是衡量结果以查看它的表现。请记住，有很多因素会影响准确性，例如随机误差、标记错误、离群值、噪声等。这就是为什么你进行的预处理通常是不够的，你必须应用其他算法来改进结果。这是你以后自己练习时需要记住的。现在让我们看看我们的回归器以及获得的结果：


    ```python

    from sklearn.linear_model import LinearRegression


    regression = LinearRegression()


    regression.fit(X_train, Y_train)


    Y_pred = regression.predict(X_test)


    from sklearn.metrics import mean_absolute_error


    print ("MAE", mean_absolute_error(Y_test, Y_pred))

    ```


    输出: `MAE 3.9318708224346`


