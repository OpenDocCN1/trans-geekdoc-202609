  fmt: '

    In the world of programming, using `Python` language is found to be easier and
    programmer-friendly, thus, the universal use.


    Discussed below are information on how to download python for MS Windows. In this
    particular demo, we have chosen windows because it’s the most common worldwide
    – even in not so progressive countries. We want to cater to the programming needs
    of everyone all over the globe.


    Python `2.7.17` version was selected because this version bridges the gap between
    the old version `2` and the new version `3`. Some of the updated functions/applications
    of version `3` are still not compatible with some devices, so `2.7.17` is a smart
    choice.


    # Steps in downloading Python 2.7.17, and installing it on Windows


    1. Type `python` on your browser and press the Search button to display the search
    results.

    Scroll down to find the item you are interested in. In this instance, you are
    looking for `python`. click “python releases for windows”, and a new page opens.
    See image below:


    ![A screenshot of a cell phone Description automatically generated](Images/image00238.jpeg)


    2. Select the Python version, `python 2.7.17`, and click, or you can select the
    version that is compatible to your device or OS.


    ![A screenshot of a social media post Description automatically generated](Images/image00239.jpeg)


    3. The new page contains the various python types. Scroll down and select an option:
    in this instance, select Windows x86 MSI installer and click.


    ![Description: 00004.jpeg](Images/image00240.jpeg)


    4. Press the Python box at the bottom of your screen.

    Click the “Run” button, and wait for the new window to appear.


    5. Select the user options that you require and press “NEXT”.

    Your screen will display the hard drive where your python will be located.


    ![Description: 00006.jpeg](Images/image00241.jpeg)


    6. Press the “NEXT” button.


    7. Press yes, and wait for a few minutes. Sometimes it can take longer for the
    application to download, depending on the speed of your internet.


    8. After that, click the FINISHED button to signify that the installation has
    been completed.


    ![Description: 00007.jpeg](Images/image00242.jpeg)


    Your python has been installed in your computer and is now ready to use. Find
    it in drive C, or wherever you have saved it.


    There can be glitches along the way, but there are options which are presented
    in this article. If you follow it well, there is no reason that you cannot perform
    this task.


    It’s important to note that there’s no need to compile programs. Python is an
    interpretive language and can execute quickly your commands.


    You can also download directly from the Python website, by selecting any of these
    versions – `3.8.1` or `2.7.17.` and clicking ‘download.’


    See image below:


    ![](Images/image00243.gif)


    Follow the step by step instructions prompted by the program. Save and run the
    program in your computer.


    # For Mac

    To download Python on Mac, you can follow a similar procedure, but this time you
    will have to access the `Python.mpkg` file, to run the installer.


    ![](Images/image00244.jpeg)


    # For Linux

    For Linux, Python `2` and `3` may have been installed by default. Hence, check
    first your operating system. You can check if your device has already a Python
    program, by accessing your command prompt and entering this: `python—version`,
    or `python3—version`.


    If Python is not installed in your Linux, the result “command not found” will
    be displayed. You may want to download both Python `2.7.17` and any of the versions
    of Python `3`. This is due to the fact that Linux can have more compatibility
    with Python `3`. For windows users, now that you have downloaded the program,
    you’re ready to start. And yes, congratulations! You can now begin working and
    having fun with Python programming.


    # Writing The First Python Program

    Beginners may find it difficult to start using Python. It’s given and nothing’s
    wrong about that. However, your desire to learn will make it easier for you to
    gradually become familiar with the language.


    ## Steps you can follow to start using Python


    ### Step #1–Read all about Python.

    Python has included `README` information in your downloaded version. It’s advisable
    to read it first, so you will learn more about the program. You can start using
    your Python through the command box (black box), or you can go to your saved file
    and read first the `README` file by clicking it. See image below:


    ![Description: 00023.jpeg](Images/image00245.jpeg)


    This box will appear.


    ![Description: 0024.jpeg](Images/image00246.jpeg)


    You can read the content completely if you want to understand more what the program
    is all about, the file-setup, and similar information. This is a long data that
    informs you of how to navigate and use Python. Also, Python welcomes new contributions
    for further development. You can copy paste the content of the box into Window
    document for better presentation. If you don’t want to know all the other information
    about Python and you’re ready to go, you can follow these steps.


    ### Step #2–Start using Python.

    First open the Python file you have saved in your computer. Click on Python as
    show below. In some versions, you just click `python` for the shell to appear.
    See image below:


    ![Description: 00025.jpeg](Images/image00247.jpeg)


    You can start using Python by utilizing the simplest function, which is `print`.
    It’s the simplest statement or directive of python. It prints a line or string
    that you specify. For Python `2`, `print` command may or may not be enclosed in
    parenthesis or brackets, while in Python `3` you have to enclose `print` with
    brackets.


    Example for Python 2:

    `print “Welcome to My Corner.”`


    Example for Python 3:

    `print (“Welcome to My Corner”)`


    The image below shows what appears when you press ‘enter’.


    ![Description: 00026.jpeg](Images/image00248.jpeg)


    You may opt to use a Python shell through `idle`. If you do, this is how it would
    appear:


    ![Description: 0027.jpeg](Images/image00249.jpeg)


    In the Python `3.5.2` version, the text colors are: function (purple), string
    (green) and the result (blue). The string is composed of the words inside the
    bracket (`Welcome to My Corner`), while the function is the command word outside
    the bracket (`print`).


    Take note that the image above is from the Python `2.7.12` version.


    You have to use indentation for your Python statements/codes. The standard Python
    code uses four spaces. The indentations are used in place of braces or blocks.
    In some programming languages, you usually use semi-colons at the end of the commands–in
    python, you don’t need to add semi-colons at the end of the whole statement. In
    Python, semi-colons are used in separating variables inside the brackets.


    For version `3`, click on your downloaded Python program and save the file in
    your computer. Then Click on `IDLE` (Integrated DeveLopment Environment), your
    shell will appear. You can now start using your Python. It’s preferable to use
    `idle`, so that your codes can be interpreted directly by idle.


    # Alternative method to open a shell (for some versions).

    An alternative method to use your Python is to open a shell through the following
    steps:


    ### Step #1– Open your menu.

    After downloading and saving your Python program in your computer, open your menu
    and find your saved Python file. You may find it in the downloaded files of your
    computer or in the files where you saved it.


    ### Step #2–Access your Python file.

    Open your saved Python file (`Python 27`) by double clicking it. The contents
    of Python `27` will appear. Instead of clicking on Python directly (as shown above),
    click on `Lib` instead. See image below.


    ![Description: 00028.jpeg](Images/image00250.jpeg)


    This will appear:


    ![Description: 00029.jpeg](Images/image00251.jpeg)


    ### Step #3–Click on ‘idlelib’.

    Clicking the ‘idlelib’ will show this content:

