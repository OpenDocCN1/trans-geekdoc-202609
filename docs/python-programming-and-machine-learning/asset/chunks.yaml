- raw: "In a programmer’s perspective, silent failure is a state wherein the parser,\
    \ runtime development environment, or compiler fails to produce an error or exception\
    \ and proceed with the program. This often leads to unintended results. \n\nA\
    \ programmer can also induce silent failures when he either ignores exceptions\
    \ or bypasses them. Alternatively, he blatantly hides them and creates workarounds\
    \ to make the program operate as expected even if an error happened. He might\
    \ do that because of multiple reasons such as the error is not program breaking\
    \ or the user does not need to know about the error. \n\nHandling the File Not\
    \ Found Exception Error \n\nThere will be times when you will encounter the FileNotFoundError.\
    \ Handling such error depends on your intent or purpose with regards to opening\
    \ the file. Here are common reasons you will encounter this error: \n\n*   You\
    \ did not pass the directory and filename as a string. \n\n*   You misspelled\
    \ the directory and filename. \n\n*   You did not specify the directory. \n\n\
    *   You did not include the correct file extension. \n\n*   The file does not\
    \ exist. \n\nThe first method to handle the FileNotFoundError exception is to\
    \ make sure that all the common reasons do not cause it. Once you do, then you\
    \ will need to choose the best way to handle the error, which is completely dependent\
    \ on the reason you are opening a file in the first place. \n\nChecking If File\
    \ Exists \n\nAgain, there are always two ways to handle an exception: preventive\
    \ and reactive. The preventive method is to check if the file exists in the first\
    \ place. \n\nTo do that, you will need to use the os (os.py) module that comes\
    \ with your Python installation. Then, you can use its path module’s isfile()\
    \ function. The path module’s file name depends on the operating system (posixpath\
    \ for UNIX, ntpath for Windows, macpath for old MacOS). For example: \n\n\\>>>\
    \ from os import path \n\n\\>>> path.isfile(\"random.txt\") \n\nFalse \n\n\\>>>\
    \ path.isfile(\"sampleFile.txt\") \n\nTrue \n\n\\>>> \\_ \n\nTry and Except \n\
    \nYou can also do it the hard way by using try, except, and else blocks. \n\n\\\
    >>> def openFile(filename): \n\n        try: \n\n            x = open(filename,\
    \ \"r\") \n\n        except FileNotFoundError: \n\n            print(\"The file\
    \ '\" + filename + \"' does not exist.\" \n\n        except FileNotFound: \n\n\
                print(\"The file '\" + filename + \"' does exist.\" \n\n\\>>> openFile(\"\
    random.txt\") \n\nThe file 'random.txt' does not exist. \n\n\\>>> openFile(\"\
    sampleFile.txt\") \n\nThe file 'sampleFile.txt' does exist. \n\n\\>>> \\_ \n\n\
    Creating a New File \n\nIf the file does not exist, and your goal is to overwrite\
    \ any existing file anyway, then it will be best for you to use the \"w\" or \"\
    w+\" access mode. The access mode creates a new file for you if it does not exist. \
    \ For example: \n\n\\>>> x = open(\"new.txt\", \"w\") \n\n\\>>> x.tell() \n\n\
    0 \n\n\\>>> \\_ \n\nIf you are going to read and write, use \"w+\" access mode\
    \ instead. \n\nPractice Exercise \n\nTry to break your Python by discovering at\
    \ least ten different exceptions.  \n\nAfter that, create a loop. \n\nIn the loop,\
    \ create ten statements that will create each of the ten different exceptions\
    \ that you find inside one try block. \n\nEach time the loop loops, the next statement\
    \ after the one that triggered an exception should trigger another and so on. \
    \ \n\nProvide a specific except block for each one of the errors. \n\nSummary\
    \ \n\nException handling skills are a must learn for beginners. It teaches you\
    \ how to predict, prevent, and manage exceptions. It allows you to test and debug\
    \ your program and generate compromises with your skill, program, and system’s\
    \ limits. \n\nThat being said, you have made great strides to get this far and\
    \ I commend you! \n\nTips and Tricks for Success  \n\nWe’ve reached the end of\
    \ this book. You’ve been introduced to Python’s main topics and written some programs.\
    \ What’s next? How do you keep improving and mastering the Python language? Here\
    \ are some tips for success that keep you on the right path:    \n\nCode everyday\
    \  \n\nPractice makes perfect. When learning a new language like Chinese or Spanish,\
    \ experts recommend you use it every day in the form of speaking and going through\
    \ an exercise or so. It’s no different with a programming language. The more you\
    \ practice, the more the basic syntax will become second nature to you, and you’ll\
    \ instinctively know when to use concepts like conditionals and loops. There are\
    \ lots of resources (which you find in the appendix) that provide exercises and\
    \ sample programs you can work on right away.   \n\nWrite by hand  \n\nWhen you’re\
    \ taking notes (and you should take notes), write them out by hand. Studies show\
    \ that the process of taking physical pen to physical paper facilitates the best\
    \ long-term memory retention. Writing by hand includes writing code by hand, and\
    \ then checking it on your computer, so you know for sure if it’s accurate. Outlining\
    \ code and ideas this way can help you stay organized, as well, before starting\
    \ to actually build a program.  \n\nFind other beginners  \n\nLearning to code\
    \ by yourself can get boring and frustrating. One of the best ways to learn and\
    \ improve is to find others who are in the same phase as you. You can bounce ideas\
    \ off each other, help out on projects, and more. If you don’t know anyone in\
    \ your immediate circle, you can check out groups online and/or find local events\
    \ through Meetups and Facebook. Always exercise caution and employ safe practices\
    \ when first meeting people you only know online. Stick to public places during\
    \ daylight hours, and don’t go anywhere alone with someone you don’t know well\
    \ until you feel comfortable.   \n\nTry explaining Python out loud  \n\nSometimes\
    \ explaining something you just learned to someone is the best way to really cement\
    \ it into your mind. It allows you to reframe concepts into your own words. You\
    \ don’t even have to talk to a real person; it can be an inanimate object. This\
    \ is such a common practice among programmers that it’s known as “rubber duck\
    \ debugging,” which references talking to a rubber duck about bugs in a program.\
    \ Pick a topic in Python like conditionals or variables, and see if you can explain\
    \ it. If you have trouble or realize there’s a gap in your knowledge, it’s time\
    \ to go back and keep learning.   \n\nCheck out other languages  \n\nThis book\
    \ is about Python, so obviously we believe that should be your priority, but getting\
    \ to know a little bit about other languages can be very helpful, too. It will\
    \ definitely make you a better programmer in the future. Checking out other languages\
    \ can help you discover what common architecture is built into every language\
    \ as well as the differences between them and Python. Even if you just read about\
    \ other languages and never write much code in anything besides Python, you’ll\
    \ be improving your knowledge and skill.   \n\nHave a plan for when you get stuck \
    \  \n\nWhen you get stuck while coding, take a step back. What are you trying\
    \ to get the code to do? What have you tried? And what’s happening? Write the\
    \ answers down and be as specific and detailed as possible. Then, you can go to\
    \ someone else for help, and you won’t have to spend a ton of time trying to explain\
    \ the problem. The answers are also really useful just for your own thought process.\
    \ Take a close look at any error messages you’re getting. Work your way backward\
    \ to try and spot any mistakes.   \n\nAnother response to getting stuck is to\
    \ just start over. If your code is really long, it can be discouraging to start\
    \ from scratch, but that means you don’t have to go through the whole thing, picking\
    \ it apart and wearing out your eyes. Starting over may actually be easier.  \
    \ \n\nTake a break  "
