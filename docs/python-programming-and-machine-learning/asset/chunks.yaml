    \ 3, in div\nTypeError: unsupported operand type(s) for /: 'int' and 'str'\n```\n\
    \n现在，已经指定了将处理的错误。当程序遇到指定的错误时，它将执行写在捕获该错误的 `except` 块中的语句。如果没有设置 `except` 块来捕获其他错误，Python\
    \ 将介入、停止程序并给你一个异常。\n\n但为什么会发生这种情况？当示例没有指定错误时，它处理了所有情况。这是正确的。当 `except` 块没有任何指定的要关注的错误时，它将捕获任何错误。例如：\n\
    \n```python\n>>> def div(dividend, divisor):\n    try:\n        print(dividend\
    \ / divisor)\n    except:\n        print(\"An error happened.\")\n\n>>> div(5,\
    \ 0)\nAn error happened.\n\n>>> div(5, \"a\")\nAn error happened.\n```\n\n如果你不确定具体可能会遇到什么错误，这是使用\
    \ `except` 块的更好方法。\n\n## 读取异常回溯 (Trace Back)\n\n错误处理中最重要的部分是知道如何阅读回溯。这相当容易。回溯的结构如下：\n\
    \n`<Traceback Header>`\n`<File Name>, <Line Number>, <Function/Module>`\n`<Exception>:\
