    \ the program, and give you an exception.\n\nBut why did that happen? When the\
    \ example did not specify the error, it handled everything. That is correct. When\
    \ the `except` block does not have any specified error to look out for, it will\
    \ capture any error instead. For example:\n\n```python\n>>> def div(dividend,\
    \ divisor):\n    try:\n        print(dividend / divisor)\n    except:\n      \
    \  print(\"An error happened.\")\n\n>>> div(5, 0)\nAn error happened.\n\n>>> div(5,\
    \ \"a\")\nAn error happened.\n```\n\nThat is a better way of using the `except`\
    \ block if you do not know exactly the error you might encounter.\n\n## Reading\
    \ an Exception Trace Back\n\nThe most important part in error handling is to know\
    \ how to read trace back. It is fairly easy to do. The trace back is structured\
    \ like this:\n\n`<Traceback Header>`\n`<File Name>, <Line Number>, <Function/Module>`\n\
    `<Exception>: <Description>`\n\nHere are things you need to remember:\n- The trace\
    \ back header informs you that an error occurred.\n- The file name tells you the\
    \ name of the file where the fault is located. Since examples in the interpreter,\
    \ it always indicated the file name is `<stdin>`.\n- The line number tells the\
    \ exact number in the file that caused the error. Since examples are tested in\
    \ the interpreter, it will always say `1`. However, if the error is found in a\
    \ code block it will return the line number relative to the code block.\n- The\
    \ `function/module` part tells what function or module owns the statement. If\
    \ the code block does not have an identifier or the statement is declared outside\
    \ blocks, it will default to `<module>`.\n- The `exception` tells you what kind\
    \ of error happened. Some of them are built-in classes (e.g., `ZeroDivisionError`,\
    \ `TypeError`) while some are just errors (e.g., `SyntaxError`). You can use them\
    \ on your `except` blocks.\n- The `exception description` gives you more details\
    \ with regards to how the error occurred. The description may vary from error\
    \ to error.\n\n## Using exceptions to prevent crashes\n\nAnyway, to know the exceptions\
    \ you can use, all you need to do is to generate the error. For example, using\
    \ `TypeError` found in the previous example, you can capture that error too and\
    \ provide the correct statements.\n\n```python\n>>> def div(dividend, divisor):\n\
    \    try:\n        print(dividend / divisor)\n    except ZeroDivisionError:\n\
    \        print(\"Cannot Divide by Zero.\")\n    except TypeError:\n        print(\"\
    Cannot Divide by Anything Than a Number.\")\n    except:\n        print(\"An unknown\
    \ error has been detected.\")\n\n>>> div(5, 0)\nCannot Divide by Zero.\n\n>>>\
    \ div(5, \"a\")\nCannot Divide by Anything Than a Number.\n\n>>> div(undeclaredVariable\
    \ / 20)\nAn unknown error has been detected.\n```\n\nHowever, catching errors\
    \ this way can still be problematic. It does allow you to prevent a crash or stop,\
    \ but you have no idea about what happened. To know the unknown error, you can\
    \ use the `as` keyword to pass the `Exception` details to a variable. Convention\
    \ wise, the variable `detail` is often used for this purpose.\n\n```python\n>>>\
    \ def div(dividend, divisor):\n    try:\n        print(dividend / divisor)\n \
    \   except Exception as detail:\n        print(\"An error has been detected.\"\
    )\n        print(detail)\n        print(\"Continuing with the program.\")\n\n\
    >>> div(5, 0)\nAn error has been detected.\ndivision by zero\nContinuing with\
    \ the program.\n\n>>> div(5, \"a\")\nAn error has been detected.\nunsupported\
    \ operand type(s) for /: 'int' and 'str'\nContinuing with the program.\n```\n\n\
    ## The Else Block\n\nThere are times that an error happens in the middle of your\
    \ code block. You can catch that error with `try` and `except`. However, you might\
    \ not want to execute any statement in that code block if an error happens. For\
    \ example:\n\n```python\n>>> def div(dividend, divisor):\n    try:\n        quotient\
    \ = dividend / divisor\n    except Exception as detail:\n        print(\"An error\
    \ has been detected.\")\n        print(detail)\n        print(\"Continuing with\
    \ the program.\")\n    print(str(dividend) + \" divided by \" + str(divisor) +\
    \ \" is:\")\n    else:\n        print(quotient)\n\n>>> div(4, 2)\n4 divided 2\
    \ is:\n2.0\n\n>>> div(5, 0)\nAn error has been detected.\ndivision by zero\nContinuing\
    \ with the program.\n5 divided by 0 is:\nTraceback (most recent call last):\n\
    \  File \"<stdin>\", line 1, <module>\n  File \"<stdin>\", line 8, in div\n  \
    \  print(quotient)\nUnboundLocalError: local variable 'quotient' referenced before\
    \ assignment\n```\n\nAs you can see, the next statements after the initial fault\
    \ are dependent on it thus they are also affected. In this example, the `quotient`\
    \ returned an error when used because its supposed value was not assigned. In\
    \ this case, you would want to drop the remaining statements that are dependent\
    \ on the contents of the `try` clause. To do that, you must use the `else` block.\n\
    \n## Failing Silently\n\nSilent fails or failing silently is a programming term\
    \ often used during error and exception handling. \n\nIn a user’s perspective,\
    \ silent failure is a state wherein a program fails at a certain point but never\
    \ informs a user.\n"
  trans: "\n\n# 使用 Try-Except 块\n\n在之前的示例中，使用了 `try except` 块来管理错误。然而，你或你的用户仍然可以通过某些操作来破坏你的解决方案。例如：\n\
