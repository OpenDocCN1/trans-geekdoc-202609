    lower case, and a combination of both is fine as well. You can also add in numbers,
    symbols, and an underscore to the name. Any combination of these are acceptable,
    make sure that there are no spaces between the characters of the name.

    - Never start the name of one of your identifiers with a number. This means that
    writing out the name of `4babies` would result in an error on your computer. However,
    it is acceptable to name an identifier `fourbabies` if you would like.

    - The identifier should never be one of the `Python` keywords, and the keyword
    should not appear in the name at all.


    Now, if you are trying to go through and write out a few of your codes along the
    way, and you don’t follow all of the rules that are above, you will confuse the
    compiler, and it will send you an error message to let you know something is wrong.
    The error will then be on your computer, and the program will close out because
    it doesn’t know how to proceed. This is something that you don’t want to happen,
    so be careful when naming these identifiers.


    Another thing to remember with these identifiers and naming them is that you want
    to make sure that you are picking out names that are ready for you to remember.
    And picking out names that are easy to understand and read will make it easier
    if another programmer comes in, and is trying to look through the code as well.


    ## What Else Do I Need to Know About the Python Coding Language?


    The `Python` coding language is often considered to be one of the best languages
    for programming by the experts, and this is even truer if you are someone who
    has never worked with coding in the past. This language is simple, it has plenty
    of power, and there are a lot of the tools and the resources that are needed to
    help you work on your project, even if that project has to do with machine learning.
    While there are other options that you can use with machine learning, those are
    often a bit more difficult to work with, and `Python` is often the better choice.


    One thing you will like when you first start working with the `Python` language
    is that the whole thing is based on the English language. What this means is that
    you will recognize the words and what they mean, rather than trying to guess.
    And even though it is a language that is great for beginners who have never worked
    with coding before, it is going to be strong enough to work with machine learning
    and any other topic that you would like.


    As someone ready to learn and get started with the `Python` language, you will
    notice that it has a nice big library available that you can utilize when you
    are coding. And this library is going to have the tools and the resources that
    you need, making it easier for beginners and experts alike to write out any code
    that they need.


    ## Chapter 8: Machine Learning Algorithms


    Now that you understand the concept of machine learning and you’ve assembled all
    of your tools, it’s time to start exploring the most powerful algorithms. Keep
    in mind that while you will learn about each algorithm and technique individually,
    they are rarely used like this in a real world scenario. When dealing with complex
    datasets you will often combine supervised machine learning techniques with unsupervised
    machine learning techniques, as well as a number of other processes.


    In this chapter we are going to focus on a number of algorithms that work well
    separately when working with ideal data sets, and even better when combined to
    achieve high accuracy and efficiency. Some of the algorithms we’ll include linear
    regression, decision trees, and support vector machines.


    ### Linear Regression


    Many machine learning problems, such as prediction analysis, are handled using
    linear regression. This technique is powerful in predicting an outcome with high
    accuracy as long as the training data is valuable and doesn’t contain too much
    noise. Keep in mind that this is why you need to perform data pre-processing,
    to clear out some of the noise and outliers that can affect the results.


    One of the characteristics of linear regression is calculating the prediction
    value based on independent variables. In other words, you should opt for this
    algorithm whenever you have to calculate the link between a number of variables.
    However, take note that linear regression can only handle regression problems,
    and not classification problems. There are other algorithms for that.


    Now let’s see an example on how to apply linear regression using `Scikit-learn`
    and an open source dataset. We will use the `Scikit` library because it contains
    a number of machine learning specific algorithms, as well as certain public datasets.
    One such dataset is the Boston housing market dataset, which is well-documented
    and clean. In order to use linear regression efficiently, we will divide the whole
    set into a training set (80%) and a testing set (20%). Let’s get to work:


    ```python

    from sklearn.datasets import load_boston


    boston = load_boston()


    from sklearn.cross_validation import train_test_split


    X_train, X_test, Y_train, Y_test = train_test_split(boston.data, boston.target,
    test_size=0.2, random_state=0)

    ```


    As you can see, the `Python` code is easy to read and quite understandable without
    much explanation. We have imported our dataset and have performed a split in order
    to obtain a training set and a test set. The `train_test_split` function is a
    perfect example of the tools that the `Scikit-learn` library contains. You will
    notice that we have declared the percentages by stating the target test dataset
    should have a value of `0.2`. This means that it will contain 20% of the data.
    Furthermore, we have a `random_state` parameter which is needed to define the
    value which will handle the random number generating during the split. Basically,
    it randomly selects the data that will be categorized as training data or testing
    data.


    In the next phase, we need to apply a regressor in order for our linear regression
    algorithm to make an accurate prediction. Once’s implemented all we need to do
    is measure the results to see how it performed. Keep in mind that there are many
    factors that can influence the accuracy, such as random errors, mislabeled data,
    outliers, noise, and so on. That is why the pre-processing you perform is rarely
    enough, and you will have to apply other algorithms to improve the result. This
    is something you need to keep in mind for the near future when you practice on
    your own. Now let’s see our regressor and the results we obtain:


    ```python

    from sklearn.linear_model import LinearRegression


    regression = LinearRegression()


    regression.fit(X_train, Y_train)


    Y_pred = regression.predict(X_test)


    from sklearn.metrics import mean_absolute_error


    print ("MAE", mean_absolute_error(Y_test, Y_pred))

    ```


    Out: `MAE 3.9318708224346`

