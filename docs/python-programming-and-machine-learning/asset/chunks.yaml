    \ it would end the execution of the program by displaying “You guessed the right\
    \ number!”\n\nWe use loops to address such situations. Loops are when an entire\
    \ block of code continues to run over and over again, until the condition set\
    \ is no longer valid. If you forget to set a condition, or if a condition is not\
    \ properly defined, you may start an endless loop that will never cease, causing\
    \ the program to crash completely.\n\nDo not worry, your system will not crash.\
    \ You can end the program by using the red/pink stop button that always magically\
    \ appears after you hit the green run button.\n\nThere are essentially two types\
    \ of loops we use in Python. The first one is the `while` loop, and the second\
    \ one is the `for` loop.\n\n### The ‘While’ Loop\n\nThis type of loop runs a specific\
    \ block of code for as long as the given condition remains true. Once the given\
    \ condition is no longer valid, or turns to false, the block of code will end\
    \ right away.\n\nThis is quite a useful feature as there may be codes which you\
    \ may need to rely on to process information quickly. To give you an idea, suppose,\
    \ you are to guess a number. You have three tries. You want the prompt to ask\
    \ the user to guess the number. Once the user guesses the wrong number, it will\
    \ reduce the maximum number of tries from three to two, inform the user that the\
    \ number is wrong and then ask to guess another time. This will continue until\
    \ either the user guesses the right number or the set number of guesses are utilized\
    \ and the user fails to identify the number.\n\nImagine just how many times you\
    \ would have to write the code over and over again. Now, thanks to Python, we\
    \ just type it once underneath the `while` loop and the rest is done for us.\n\
    \nHere’s how the syntax for the `while` loop looks like:\n\n```python\nwhile condition:\n\
    \    code\n    code\n    ...\n```\n\nYou begin by typing in the word `while` followed\
    \ by the condition. We then add a colon, just like we did for the `if` statement.\
    \ This means, whatever will follow next, it will be indented to show that the\
    \ same is working underneath the loop or the statement.\n\nLet us create a simple\
    \ example from this. We start by creating a variable. Let’s give this variable\
    \ a name and a value like so:\n\n`x = 0`\n\nNothing fun here, so let us add something\
