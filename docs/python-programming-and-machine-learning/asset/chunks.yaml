  fmt: "\nSee, how all these `if-elseif-else` clauses are linked to one single conditional\
    \ statement? This is where the `elif` or `Else` block comes in. If your variable,\
    \ the one you wish to use for your conditional test, has many values, and needs\
    \ to output differently for those values, you can put them in an `if-elif-else`\
    \ block. This way, on the first true, no other condition gets executed. Or, `elif`\
    \ gets executed, or the `else` clause.\n\nWe did just the same. We said, If the\
    \ lights and stove are on, you just close the stove. Else if (`elif` in Python),\
    \ the lights are closed but the stove is on, turn the lights, close the stove.\
