    在我们那个用于识别卡车和自行车的示例中，我们尝试在一个理论概念中解决一个非常简单的问题。然而，在现实世界中，深度学习模型被应用于更复杂的模型中。如果你思考其中涉及的过程，从概念到分层数据处理，以及数据必须通过的不同层数，那么使用深度学习模型来解决简单问题将是对资源的浪费。


    虽然所有此类别的 AI 都需要数据来帮助实现我们所需的智能，但深度学习模型对数据的访问需求远大于机器学习算法。这一点非常重要，因为深度学习算法在传递输出结果之前，必须在排除合理怀疑的情况下证明其输出是完美的。


    只有当神经网络接触过数百万个数据点时，深度学习模型才能能够轻松地识别出数据处理层中的差异和概念。这有助于排除所有其他可能性。然而，在机器学习中，模型可以通过已经预定义的标准进行学习。


    ##不同的应用场景


    在了解了机器学习和深度学习之间的区别后，这两者在现实世界中可以应用于哪里？当你处理海量数据时，深度学习是一个可靠的解决方案。在这种情况下，你需要从这些数据中进行解释并做出决策，因此你需要一个适合你资源分配的模型。


    在处理使用机器学习算法无法解决的复杂问题时，也推荐使用深度学习模型。除此之外，重要的是要意识到深度学习模型通常具有极高的资源需求。因此，当你拥有足够的资金实力和资源分配来获取相关程序和硬件时，你应该考虑深度学习模型。


    在处理可用于训练不同机器学习算法的结构化数据时，机器学习是一个可行的解决方案。在算法执行请求的任务之前，涉及到大量的学习过程。


    你也可以使用机器学习来享受人工智能的益处，而不一定实现全规模的人工智能模型。


    机器学习算法经常用于帮助或加速业务和工业流程中的自动化过程。机器学习模型的常用示例包括广告、身份验证器、信息处理和营销。这些应该帮助你的业务在市场中面对竞争时获得更好的定位。


    ##结论


    现在我们已经读到了书的最后，我希望你已经对机器学习是什么以及如何使用 `Python` 构建机器学习模型有了基础性的理解。构建机器学习模型的最好方法之一是练习书中的代码，并尝试编写类似的代码来解决其他问题。重要的是记住，练习得越多，表现得越好。此事的最佳方法是开始处理简单的问题陈述，并使用不同的算法来解决它们。你也可以尝试通过识别解决问题的新方法来解决这些问题。一旦你掌握了基础问题，就可以尝试使用一些高级方法来解决这些问题。


    感谢读到最后！


