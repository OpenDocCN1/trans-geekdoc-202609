    \ Coding is as old as humans. Before the number systems we use today, there were\
    \ other systems to represent values. An example of coding from ancient times is\
    \ the Egyptian hieroglyphs.\n\n![00003.jpeg](Images/00234.jpeg)\n\nNumber systems\
    \ are also examples of coding because values are represented using symbols. There\
    \ are different types of number systems, and we are going to discuss a few ones.\n\
    \n### Binary System\n\nA binary system has only two symbols, `1` and `0` which\
    \ are referred to as bits. All the numbers are represented by combining these\
    \ two symbols. Binary systems are ideal for electronic devices because they also\
