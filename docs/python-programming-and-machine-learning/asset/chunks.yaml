    我们已经花了一些时间观察数据科学的生命周期，但为了帮助我们更多地了解它并进行回顾，让我们过一遍这些步骤。我们需要确定想要解决的核心业务问题，然后开始收集我们想要使用的数据。由于这些数据将分布在许多不同的位置，我们将能够对其进行格式化、清理，并确保离群值、重复值和缺失值得到处理。


    从那里开始，我们能够通过算法处理数据。得益于 `Python` 编程语言及其提供的所有功能，我们看到有大量的算法非常适用于这个过程。我们可以选择需要的算法，然后提前对信息进行一些训练和测试，以确保它们已准备好进行预测。然后，我们可以通过一些可视化来完成整个过程，这有助于更容易地看到我们数据内部发生的一些复杂关系和相关性。


    从那里开始，我们需要转向数据科学项目中将会出现的一些组件。有许多组件需要汇聚并协同工作，以确保我们实际上能够从所从事的任何数据科学项目中获得最大收益。


    ### 数据类型

    我们需要花时间关注的第一个组件是我们正在处理的数据类型。我们拥有的原始数据非常重要，因为它们将成为在这个过程中所做的所有其他工作的基础。尽管如此，在这个过程中你能够找到两种主要数据类型是：结构化数据，即我们在某些表格形式或数据集中找到的数据；然后我们还有一种被称为非结构化的数据类型，包括图像、视频、电子邮件和
    PDF 文件等。


    ### 编程

    当我们观察数据科学时，发现的第二个组件是编程。你必须编写一些程序来创建我们之前讨论的数学模型，并让它们真正地筛选信息并做出预测。所有的数据分析和管理将由计算机编程来完成。数据科学中最常用的两种流行语言包括
    `R` 和 `Python`，因此学习其中之一是有帮助的。


    ### 概率与统计

    列表上的下一个是概率和统计。数据将以某种方式被处理，以便从这些数据中提取信息和趋势。概率和统计将是把这一切整合在一起的数学基础。如果对这两个主题没有良好的理解和大量的知识，你可能会误读数据，并得出不正确的结论。这就是为什么概率和统计对数据科学领域如此重要的大原因之一。


    ### 机器学习

    当我们研究数据科学时，还必须关注机器学习的概念。当有人处理所有这些大数据以及其中包含的所有内容时，他们也会使用许多随而的算法。这可以同时包括分类和回归方法。


    ### 大数据

    我们在这里需要花时间关注的最后一个关键组件是大数据的概念。在我们今天生活的世界里，原始数据如此重要，但我们需要能够获取它们并将其转化为实际上能够使用的东西。这些数据中有很多好信息，但如果它们只是停在那里，而我们无法从中提取所需的所有信息，那么它们对我们来说就是毫无价值的。


    这就是 `Python` 算法真正发挥作用的地方。你会发现，当我们挑选并使用正确的算法时，我们可以将所有这些原始数据——那些可能是混乱、无组织且难以处理的数据——并实际上将其转变为我们整体上能够使用和欣赏的东西。


    在处理数据科学时，我们将能够处理许多不同的事物。不过，数据科学伴随着许多部分。我们必须确保了解数据科学全过程的所有不同部分。


    # 第 12 章：深度学习速览


    人工智能是一个多年来在许多对话中反复出现的研究领域。几年前，这还是一个在电影和漫画书中传播的未来主义概念。通过多年的开发和研究，我们目前正在经历着人工智能的黄金时代。事实上，人们广泛预计
    AI 将帮助我们开启计算的新前沿。


    人工智能可能与机器学习和深度学习有一些相似之处，但它们并不是同一种东西。许多人交替使用这些术语，而不考虑其假设的后果。深度学习和机器学习是人工智能的知识分支。虽然过去使用过不同的定义来解释人工智能，但基本的约定是，这是一个构建计算机程序的过程，这些程序具有像正常人类大脑一样进行操作和运行功能的能力。


    AI 的概念是训练计算机以像人类大脑一样思考和运行的方式进行思考。在人类大脑方面，我们尚未完全掌握我们大脑的真实潜力。专家认为，即使是世界上最才华横溢的人也无法完全耗尽大脑容量。


    因此，这产生了一个难题，因为如果我们还没有完全理解和测试大脑的局限性，我们又如何构建出可以复制人类大脑的计算系统呢？如果计算机学习了像人类一样互动和操作，并到在我们学会使用自己的大脑之前充分利用它们的脑力，会发生什么？


    理想情况下，AI 背后的力量或其思考能力尚未确定。然而，该领域的研究人员和其他专家多年来取得了巨大的进展。体现这些价值的 AI 例子之一是 `Sophia`。Sophia
    目前可能是世界上最先进的 AI 模型。可能由于我们无法充分推及大脑的局限，我们可能永远无法将 AI 的局限推到可以完全取代人类的地步。


    机器学习和深度学习是人工智能的两个分支，年来一直显著的研究和增长。对这些框架的关注特别来自于世界上许多领先科技公司已无缝地将它们实施到自己的产品中，并将其整合到人类生存中。你在日常生活中一直在与这些模型互动。


    '
