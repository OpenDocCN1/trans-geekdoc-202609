- raw: "Using Try-Except Blocks \n\nIn the previous example, the try except blocks\
    \ was used to manage the error. However, you or your user can still do something\
    \ to screw your solution up. For example: \n\n\\>>> def div(dividend, divisor):\
    \ \n\n        try: \n\n            print(dividend / divisor) \n\n        except:\
    \ \n\n            print(\"Cannot Divide by Zero.\") \n\n\\>>> div(5, \"a\") \n\
    \nCannot Divide by Zero. \n\n\\>>> \\_ \n\nThe statement prepared for the “except”\
    \ block is not enough to justify the error that was created by the input. Dividing\
    \ a number by a string does not actually warrant a “Cannot Divide by Zero.” message.\
    \ \n\nFor this to work, you need to know more about how to use except block properly.\
    \ First of all, you can specify the error that it will capture and respond to\
    \ by indicating the exact exception. For example: \n\n\\>>> def div(dividend,\
    \ divisor): \n\n        try: \n\n            print(dividend / divisor) \n\n  \
    \      except ZeroDivisionError: \n\n            print(\"Cannot Divide by Zero.\"\
    ) \n\n\\>>> div(5, 0) \n\nCannot Divide by Zero. \n\n\\>>> div(5, \"a\") \n\n\
    Traceback (most recent call last): \n\n  File \"<stdin>\", line 1, <module> \n\
    \n  File \"<stdin>\", line 3, in div \n\nTypeError: unsupported operand type(s)\
    \ for /: 'int' and 'str' \n\n\\>>> \\_ \n\nNow, the error that will be handled\
    \ has been specified. When the program encounters the specified error, it will\
    \ execute the statements written on the “except” block that captured it. If no\
    \ except block is set to capture other errors, Python will then step in, stop\
    \ the program, and give you an exception. \n\nBut why did that happen? When the\
    \ example did not specify the error, it handled everything. That is correct. When\
    \ the “except” block does not have any specified error to look out for, it will\
    \ capture any error instead. For example: \n\n\\>>> def div(dividend, divisor):\
    \ \n\n        try: \n\n            print(dividend / divisor) \n\n        except:\
    \ \n\n            print(\"An error happened.\") \n\n\\>>> div(5, 0) \n\nAn error\
    \ happened. \n\n\\>>> div(5, \"a\") \n\nAn error happened. \n\n\\>>> \\_ \n\n\
    That is a better way of using the “except” block if you do not know exactly the\
    \ error that you might encounter. \n\nReading an Exception Error Trace Back \n\
    \nThe most important part in error handling is to know how to read the trace back\
    \ message. It is fairly easy to do. The trace back message is structured like\
    \ this: \n\n<Traceback Stack Header> \n\n  <File Name>, <Line Number>, <Function/Module>\
    \ \n\n<Exception>: <Exception Description> \n\nHere are things you need to remember:\
    \ \n\n*   The trace back stack header informs you that an error occurred. \n\n\
    *   The file name tells you the name of the file where the fault is located. Since\
    \ the examples in the book are coded using the interpreter, it always indicated\
    \ that the file name is \"<stdin>\" or standard input. \n\n*   The line number\
    \ tells the exact line number in the file that caused the error. Since the examples\
    \ are tested in the interpreter, it will always say line 1. However, if the error\
    \ is found in a code block or module it will return the line number of the statement\
    \ relative to the code block or module. \n\n*   The function/module part tells\
    \ what function or module owns the statement. If the code block does not have\
    \ an identifier or the statement is declared outside code blocks, it will default\
    \ to <module>. \n\n*   The exception tells you what kind of error happened. Some\
    \ of them are built-in classes (e.g., ZeroDivisionError, TypeError, and etcetera)\
    \ while some are just errors (e.g., SyntaxError). You can use them on your except\
    \ blocks. \n\n*   The exception description gives you more details with regards\
    \ to how the error occurred. The description format may vary from error to error.\
    \ \n\n*   Using exceptions to prevent crashes \n\nAnyway, to know the exceptions\
    \ that you can use, all you need to do is to generate the error. For example,\
    \ using the TypeError found in the previous example, you can capture that error\
    \ too and provide the correct statements in response. \n\n\\>>> def div(dividend,\
    \ divisor): \n\n        try: \n\n            print(dividend / divisor) \n\n  \
    \      except ZeroDivisionError: \n\n            print(\"Cannot Divide by Zero.\"\
    ) \n\n        except TypeError: \n\n            print(\"Cannot Divide by Anything\
    \ Other Than a Number.\") \n\n        except: \n\n            print(\"An unknown\
    \ error has been detected.\") \n\n\\>>> div(5, 0) \n\nCannot Divide by Zero. \n\
    \n\\>>> div(5, \"a\") \n\nCannot Divide by Anything Other Than a Number. \n\n\\\
    >>> div(undeclaredVariable / 20) \n\nAn unknown error has been detected. \n\n\\\
    >>> \\_ \n\nHowever, catching errors this way can still be problematic. It does\
    \ allow you to prevent a crash or stop, but you have no idea about what exactly\
    \ happened. To know the unknown error, you can use the as keyword to pass the\
    \ Exception details to a variable. Convention wise, the variable detail is often\
    \ used for this purpose. \n\nFor example: \n\n\\>>> def div(dividend, divisor):\
    \ \n\n        try: \n\n            print(dividend / divisor) \n\n        except\
    \ Exception as detail: \n\n            print(\"An error has been detected.\")\
    \ \n\n            print(detail) \n\n            print(\"Continuing with the program.\"\
    ) \n\n\\>>> div(5, 0) \n\nAn error has been detected. \n\ndivision by zero \n\n\
    Continuing with the program. \n\n\\>>> div(5, \"a\") \n\nAn error has been detected.\
    \ \n\nunsupported operand type(s) for /: 'int' and 'str' \n\nContinuing with the\
    \ program. \n\n\\>>> \\_ \n\nThe Else Block \n\nThere are times that an error\
    \ happens in the middle of your code block. You can catch that error with try\
    \ and except. However, you might not want to execute any statement in that code\
    \ block if an error happens. For example: \n\n\\>>> def div(dividend, divisor):\
    \ \n\n        try: \n\n            quotient = dividend / divisor \n\n        except\
    \ Exception as detail: \n\n            print(\"An error has been detected.\")\
    \ \n\n            print(detail) \n\n            print(\"Continuing with the program.\"\
    ) \n\n        print(str(dividend) + \" divided by \" + str(divisor) + \" is:\"\
    ) \n\n        print(quotient) \n\n\\>>> div(4, 2) \n\n4 divided by 2 is: \n\n\
    2.0 \n\n\\>>> div(5, 0) \n\nAn error has been detected. \n\ndivision by zero \n\
    \nContinuing with the program. \n\n5 divided by 0 is: \n\nTraceback (most recent\
    \ call last): \n\n  File \"<stdin>\", line 1, in <module> \n\n  File \"<stdin>\"\
    , line 8, in div \n\n    Print(quotient) \n\nUnboundLocalError: local variable\
    \ 'quotient' referenced before assignment \n\n\\>>> \\_ \n\nAs you can see, the\
    \ next statements after the initial fault are dependent on it thus they are also\
    \ affected. In this example, the variable quotient returned an error when used\
    \ after the try and except block since its supposed value was not assigned because\
    \ the expression assigned to it was impossible to evaluate. \n\nIn this case,\
    \ you would want to drop the remaining statements that are dependent on the contents\
    \ of the try clause. To do that, you must use the else block. For example: \n\n\
    \\>>> def div(dividend, divisor): \n\n        try: \n\n            quotient =\
    \ dividend / divisor \n\n        except Exception as detail: \n\n            print(\"\
    An error has been detected.\") \n\n            print(detail) \n\n            print(\"\
    Continuing with the program.\") \n\n        else: \n\n            print(str(dividend)\
    \ + \" divided by \" + str(divisor) + \" is:\") \n\n            print(quotient)\
    \ \n\n\\>>> div(4, 2) \n\n4 divided by 2 is: \n\n2 \n\n\\>>> div(5, 0) \n\nAn\
    \ error has been detected. \n\ndivision by zero \n\nContinuing with the program.\
    \ \n\n\\>>> \\_ \n\nThe first attempt on using the function with proper arguments\
    \ went well.  \n\nOn the second attempt, the program did not execute the last\
    \ two statements under the else block because it returned an error. \n\nThe else\
    \ block always follows except blocks. The function of the else block is to let\
    \ Python execute the statements under it when the try block did not return and\
    \ let Python ignore them if an exception happens. \n\nFailing Silently \n\nSilent\
    \ fails or failing silently is a programming term often used during error and\
    \ exception handling.  \n\nIn a user’s perspective, silent failure is a state\
    \ wherein a program fails at a certain point but never informs a user. "
