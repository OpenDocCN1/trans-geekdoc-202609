    当你处理潜变量时，机器会尝试识别这些变量是否与数据集中的其他数据点和变量相关联。当你使用一个难以识别不同变量之间关系的数据集时，这是一个非常有用的方法。有时，你无法识别某个变量发生变化的原因。如果工程师能够查看数据集中的不同潜变量，他们就能更好地理解数据。


    # 维度削减


    用于训练机器预测任何问题结果的数据集都会包含某些维度（维度）和变量。如果数据集中的维度超过三个，人类的大脑将无法对这些数据进行可视化或理解。在这些情况下，最好使用机器学习模型将数据量减少为更易于管理的较小分段。这将帮助用户识别数据集内部存在的关系。


    每个机器学习模型都会确保机器从为其提供的数据中进行学习。然后，可以使用该机器来对数据进行分类，或为特定问题预测结果或结果。它还可以被应用于诸如自动驾驶汽车等许多应用中。机器学习模型有助于提高智能手机识别用户脸部的能力，或者帮助
    Google Home 或 Alexa 识别你的口音和声音，而且如果它们学习的时间更长，机器的准确性就会提高。


    # 构建机器学习系统的步骤


    无论你试图构建的是哪种模型或试图解决的是什么问题，在构建机器学习算法时，你都将遵循本节提到的步骤。


    ## 定义目标

    第一步与你执行的任何其他任务一样，是定义你通过你的系统想要实现的目的或目标。这是一个重要的步骤，因为你将收集的数据、使用的算法以及许多其他因素都取决于这个目标。


    ## 收集数据

    一旦你确定了目标，就应该收集所需的数据。这是一个耗时的过程，但你必须完成的下一个重要步骤。你应该收集相关数据，并确保它们对于你试图解决的问题是正确的数据。


    ## 准备数据

    这是另一个重要步骤，但工程师往往忽视它。如果你忽视了这一步，你就会犯错。只有当输入数据是干净且相关的，你才能获得准确的结果或预测。


    ## 选择算法

    可以使用许多算法来解决问题，包括支持向量机（SVM）、k-近邻、朴素贝叶斯（Naive-Bayes）和 Apriori 等等。你必须选择最适合目标的算法。


    ## 训练模型

    当你的数据集准备好后，你应该将其输入系统，并帮助机器使用所选算法进行学习。


    ## 测试模型

    当你的模型训练完成，并且认为它已经提供了相关结果时，你可以使用测试数据集来测试模型的准确性。


    ## 预测

    模型将对训练数据集和测试数据集进行多次迭代。你可以查看预测结果并向模型提供反馈，帮助它改进所做出的预测。


    ## 部署

    一旦你测试了模型并对它的工作方式表示满意，就可以对该模型进行消毒并集成到任何你想使用的应用程序中。这意味着你开发的模型现在可以部署了。


    所遵循的步骤将取决于你所使用的应用程序类型和算法。你可以选择使用监督学习或非监督机器学习算法。本节中提到的步骤通常是大多数工程师在开发机器学习算法时遵循的步骤。有许多工具和函数可以用来构建机器学习模型。此书将帮助你更多地了解如何使用
    `Python` 设计机器学习模型。


    # 第 3 章：大数据与机器学习


    为了学习某些东西，能够进行机器学习的系统需要接触大量数据。回溯几十年年前，与今天能够访问的数据相比，计算机无法获取那么多数据。当时的计算机运行缓慢，而且非常笨拙。那时大部分数据都存储在纸上，因此计算机系统无法直接访问。数据量也要少得多。当然，公司、大型企业以及政府一直在尽可能多地收集数据，但当你没有那么多数据，且数据大部分以纸质记录的形式存在时，对于机器学习计算机系统来说，有用数据并不多。


    第一个数据库诞生于 20 世纪 60 年代后期。考虑数据与机器学习之间的关系时，数据库并不是我们想象的那种东西，尽管在某些情况下可能是。数据库收集非常有组织的信息。为了理解这种区别，请想一组
    Facebook 帖子集合，对比某人注册入学大学的记录。Facebook 帖子的集合将是杂乱且混乱的。它将包含不同类型的数据，如照片、视频、链接和文本。它将是完全未分类的，可能只标记了发布者和日期。


    此相反，当你提到数据库时，你应该考虑到完全组织且受限的数据。数据库由单条记录组成，每条记录包含相同的数据字段。在大学里，学生入学时可能会输入他们的姓名、社会安全号或
    ID 号、地址等。


    所有这些记录都以相同的格式存储在同一个一个大文件中。然后可以对该文件进行“查询”，以返回我们请求的记录。例如，我们可以让它返回大一所有学生的记录。


    关系型数据库允许你交叉引用信息并在查询中将其整合在一起。遵循我们的示例，你可以有一个独立的数据库，其中包含每个学生修读的课程。这可以存储在与学生基本信息独立的数据库中，但可以使用学生
    ID 字段进行交叉引用。


    开发了一些工具来帮助从不同的数据库汇总数据。IBM 一直在计算机科学的许多发展中起着重要作用的公司，开发了第一种结构化查询语言 `SQL`，它可以用于执行此类任务。一旦数据被汇总在一起，就可以对其进行分析，或用于为人类操作员打印报告。

