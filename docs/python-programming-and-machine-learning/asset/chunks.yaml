- raw: "Python 2.0 also featured a garbage collection system which was able to collect\
    \ close reference cycles. A version update (Python 2.1) quickly followed the release\
    \ of Python 2.0, as did Python 1.6.1. However, due to the legal issue over licensing,\
    \ Python renamed the license on the new release to Python Software Foundation\
    \ License. As such, every new specification, code or documentation added from\
    \ the release of version update 2.1 was owned and protected by the PSF (Python\
    \ Software Foundation) which was a nonprofit organization created in the year\
    \ 2001. The organization was designed similarly to the Apache Software Foundation.\
    \ The release of version 2.1 came with changes made to the language specifications,\
    \ allowing support of nested scopes such as other statically scoped languages.\
    \ However, this feature was, by default, not in use and unrequired until the release\
    \ of the next update, version 2.2 on the 21st of December, 2001.  \n\nPython 2.2\
    \ came with a significant innovation of its own in the form of a unification of\
    \ all Python's types and classes. The unification process merged the types coded\
    \ in C and the classes coded in Python into a single hierarchy. The unification\
    \ process caused Python's object model to remain totally and continuously object-oriented.\
    \ Another significant innovation was the addition of generators as inspired by\
    \ Icon. Two years after the release of version 2.2, version 2.3 was published\
    \ in July of 2003. It was nearly another two years before version 2.4 was released\
    \ on the 30th of November in 2004. Version 2.5 came less than a year after Python\
    \ 2.4, in September of 2006. This version introduced a \"with\" statement containing\
    \ a code block in a context manager; as in obtaining a lock before running the\
    \ code block and releasing the lock after that or opening and closing a file.\
    \ The block of code made for behavior similar to RAII (Resource Acquisition Is\
    \ Initialization) and swapped the typical \"try\" or \"finally\" idiom.   \n\n\
    The release of version 2.6 on the 1st of October, 2008 was strategically scheduled\
    \ such that it coincided with the release of Python 3.0. Asides the proximity\
    \ in release date, version 2.6 also had some new features like the \"warnings\"\
    \ mode which outlined the use of elements which had been omitted from Python 3.0.\
    \ Subsequently, in July of 2010, another update to Python 2.0 was released in\
    \ the version of python 2.7. The new version updates shared features and coincided\
    \ in release with version 3.1 — the first version update of python 3. At this\
    \ time, Python drew an end to the release of Parallel 2.x and 3.x, making python\
    \ 2.7 the last version update of the 2.x series. Python went public in 2014, November\
    \ precisely, to announce to its username that the availability of python 2.7 would\
    \ stretch until 2020. However, users were advised to switch to python 3 in their\
    \ earliest convenience.  \n\n•       Python 3.0:  \n\nThe fourth generation of\
    \ Python, Python 3.0, otherwise known as Py3K and python 3000, was published on\
    \ the 3rd of December 2008. This version was designed to fix the fundamental flaws\
    \ in the design system of the scripting language. A new version number had to\
    \ be made to implement the required changes which could not be run while keeping\
    \ the stock compatibility of the 2.x series that was by this time redundant. The\
    \ guiding rule for the creation of python 3 was to limit the duplication of features\
    \ by taking out old formats of processing stuff. Otherwise, Python three still\
    \ followed the philosophy with which the previous versions were made. Albeit,\
    \ as Python had evolved to accumulate new but redundant ways of programming alike\
    \ tasks, python 3.0 was emphatically targeted at quelling duplicative modules\
    \ and constructs in keeping with the philosophy of making one \"and  \n\npreferably\
    \ only one\" apparent way of doing things. Regardless of these changes, though,\
    \ version 3.0 maintained a multi-paradigm language, even though it didn't share\
    \ compatibility with its predecessor.  \n\nThe lack of compatibility meant Python\
    \ 2.0 codes were unable to be run on python 3.0 without proper modifications.\
    \ The dynamic typing used in Python as well as the intention to change the semantics\
    \ of specific methods of dictionaries, for instance, made a perfect mechanical\
    \ conversion from the 2.x series to version 3.0 very challenging. A tool, name\
    \ of 2to3, was created to handle the parts of translation which could be automatically\
    \ done. It carried out its tasks quite successfully, even though an early review\
    \ stated that the tool was incapable of handling certain aspects of the conversion\
    \ process. Proceeding the release of version 3.0, projects that required compatible\
    \ with both the 2.x and 3.x series were advised to be given a singular base for\
    \ the 2.x series. The 3.x series platform, on the other hand, was to produce releases\
    \ via the 2to3 tool.  \n\nFor a long time, editing the Python 3.0 codes were forbidden\
    \ because they required being run on the 2.x series. However, now, it is no longer\
    \ necessary. The reason being that in 2012, the recommended method was to create\
    \ a single code base which could run under the 2.x and 3.x series through compatibility\
    \ modules. Between the December of 2008 and July 2019, 8 version updates have\
    \ been published under the python 3.x series. The current version as at the 8th\
    \ of July 2019 is the Python 3.7.4. Within this timeframe, many updates have been\
    \ made to the programming language, involving the addition of new features mentioned\
    \ below:  \n\n1.  Print which used to be a statement was changed to an inbuilt\
    \ function, making it relatively easier to swap out a module in utilizing different\
    \ print functions as well as regularizing the syntax. In the late versions of\
    \ the 2.x series, (python 2.6 and 2.7), print is introduced as inbuilt, but is\
    \ concealed by a syntax of the print statement which is capable of being disabled\
    \ by entering the following line of code into the top of the file: from\\_\\_future\\\
    _\\_import print\\_function  \n\n2.  The \\[input\\] function in the Python 2.x\
    \ series was removed, and the \\[raw\\_input\\] function to \\[input\\] was renamed.\
    \ The change was such that the \\[input\\] function of Python 3 behaves similarly\
    \ to the \\[raw\\_input\\] function of the python 2.x series; meaning input is\
    \ typically outputted in the form of strings instead of being evaluated as a single\
    \ expression.  \n\n3.  \\[reduce\\] was removed with the exemption of \\[map\\\
    ] and \\[filter\\] from the in-built namespace into \\[functools\\]. The reason\
    \ behind this change is that operations involving \\[reduce\\] are better expressed\
    \ with the use of an accumulation loop.  \n\n4.  Added support was provided for\
    \ optional function annotations which could be used in informal type declarations\
    \ as well as other purposes.  \n\n5.  The \\[str\\]/\\[unicode\\] types were unified,\
    \ texts represented, and immutable bytes type were introduced separately as well\
    \ as a mutable \\[bytearray\\] type which was mostly corresponding; both of which\
    \ indicate several arrays of bytes.  \n\n6.  Taking out the backward-compatibility\
    \ features such as implicit relative imports, old-style classes, and string exceptions. \
    \ \n\n7.  Changing the mode of integer division functionality. For instance, in\
    \ the Python 2.x series, 5/2 equals 2. Note that in the 3.x series, 5/2 equals\
    \ 2.5. From the recent versions of the 2.x series beginning from version 2.2 up\
    \ until python 3: 5//2 equals 2.  \n\nIn contemporary times, version releases\
    \ in the version 3.x series have all been equipped with added, substantial new\
    \ features; and every ongoing development on Python is being done in line with\
    \ the 3.x series.  \n\nC. HOW TO DOWNLOAD AND INSTALL PYTHON \n\nIn this time\
    \ and age, being techy is a demand of the times, and the lack of knowledge, classifies\
