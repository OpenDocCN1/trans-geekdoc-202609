  trans: '


    决策树和支持向量机一样，功能极其强大，因为它们既可以执行回归也可以执行分类操作。这意味着在处理大型数据集时非常有用，你应该熟悉一下它们。此外，决策树是另一类机器学习算法——集成方法（ensemble
    method）的基础，特别是被称为随机森林的算法。这都非常符合逻辑。如果你有很多棵决策树，它们就形成了一片森林，对吧？


    顾其名，决策树被用于对决策进行建模，包括确定任何类型的后果以及整个过程所需的系统资源。此外，所有内容都以图表的形式可视化。换句话说，你将得到一个包含你执行的每一个测试的流程图。例如，假设你投掷了若干次硬币。每次的结果都会被记录，你将拥有代表这些结果的树分支，以及代表类别标签的叶节点。


    这种监督学习算法被认为是最强大的算法之一，因为它在不牺牲过多效率或不消耗系统过量资源的情况下，能够提供准确的结果。此外，图表系统允许你轻松地解释数据，并根据需要进行调整，而无需经历另一个能够实现相同效果但工作量得多的繁琐过程。如此，让我们讨论一下决策树提供的其他优点：


    1. **用户友好**：与许多其他算法或技术不同，决策树对于那些没有大量机器学习或数学知识经验的人来说也是逻辑严谨的。你不需要成为数据科学家就可以开始使用它们。它们遵循简单的、类编程的结构，类似于
    Python 的条件操作。决策树遵循“如果……，那么执行……，否则执行……””的逻辑。此外，结果非常清晰，即使没有基础统计学知识也能解释。这就是内置图表能够清晰解释你正在分析的数据的好处。


    2. **数据清洁**：干净的数据产生准确的结果。因此，无论你使用哪种算法，都必须通过某些方法和技术尽可能消除噪声和离群值。然而，使用决策树的优势在于它们几乎不受因素的影响。离群值和噪声只会造成轻微的不便，你通常可以完全忽略它们并获得准确的结果。


    3. **多功能**：如你所知，某些机器学习算法设计为仅适用于特定的数据类型。某些只能应用于分类数据，而另一些则专门用于数值数据。通常由于这个原因，在处理包含两种类型信息的复杂数据集时，需要将它们结合。然而，决策树可以处理这两种数据类型的训练过程，从而显著减少了你的工作量。


    4. **探索数据**：数据探索是一个非常有价值的步骤，因为它可能耗时，因为你需要识别最有价值的数据点并在它们之间建立联系。然而，决策树在探索性分析方面表现出色，你会花费更少的时间执行这一步骤。此外，你能够更高效地创建新特征，以进一步提高预测准确性。探索数据可能会精疲力竭，因为在现实世界中你通常要处理成千上万个变量，如果没有合适的工具，找到最重要的变量是非常困难的。


    现在你已经了解决策树以及为什么它们是机器学习学习者的首选算法，你还应该学习它们带来的缺点。请记住，没有完美的算法，让我们看看在处理决策树时将面临什么种困难：


    1. **过拟合**：这可能是你面临的最大问题。决策树倾向于放大并构建过度复杂的决策树，这些树在通用数据上无法准确运行。然而，过拟合问题不仅出现在这种情况下，许多算法都必须处理它。限制过拟合风险的最简单方法是应用参数限制。


    2. **分类**：当你的数据集包含大量连续数值变量时，决策树在对其进行分类时会遇到困难。信息在此过程中往往会丢失。请注意，连续变量被认为是在特定最小值和最大值之间有定义的数值。例如，假设我们有一些数据规定只有
    21 到 45 岁之间的人可以参军。`age` 被认为是连续的，因为我们设置了限制。


    3. **挑剔算法**：算法并不总是从你得出结论的决策树中选择最准确、高效的一个。这只是该技术的本质。但解决方案很简单。你只需要训练多棵树，以随机采样较多的特征并找到最准确的解决方案。


    你在本节的之前了解到，决策树用于执行回归任务和分类任务。然而，这并不意味着你对这两个任务使用相同的方法。你需要将决策树分为两个不同的类别，即回归树和分类树。这两类算法的基础仍然相同，但有许多你应该注意的区别：


    1. **回归树**专门应用于涉及连续因变量的任务。同时，在处理分类因变量时，需要分类树。


    2. 我们从训练数据中提取的结果值对于每类决策树的确定方式不同。在分类树的情况下，该值计算为总观测值的众数（mode value）。这意味着如果我们有一个未知的数据观测，我们可以通过众数的帮助进行预测。请记住，众数是在给定值集中出现频率最高的值。另一方面，回归树以总观测值平均值的形式从训练数据中提取值。这个平均值随后被用于计算任何缺失的数据观测值。


    3. 回归树和分类树依赖于二分法（binary splitting）。这一概念涉及从树的顶部到底。这意味着当我们在树的一个区域有观测值时，下方会有若干个被划分的分支。划分发生在预测空间内。这个概念通常也被称为贪婪的”（greedy），因为算法寻找的是当前分析的拆分所需的变量。该操作没有考虑任何未来的拆分，这就是为什么有时我们无法得到最准确的结果。需要考虑这个问题，以便通过各种方法抵消其影响并创建更好的决策树。

    '
