    - 编写一个程序显示两个员工的名字，其中第一个员工是“Daisy”，第二位是“Richard”。在每行代码中包含单行注释。

    - 编写一个程序显示学生注册号，学生姓名及其注册号分别为 `Yvonne=235`、`Ian=782`、`James=1235`、`Juliet=568`。


    ### 多行注释

    就像多行程序语句一样，我们也有多行注释。编写多行注释有几种方法。第一方法是在注释行的开头输入井号（`#`）。


    示例

    - Start IDLE

    - 导航到 File（文件）菜单并点击 New Window（新建窗口）

    - 输入以下内容：


    ```python

    #我将写一条很长的注释

    #注释将溢出到这一行

    #并在这里结束。

    ```


    编写多行注释的第二方法涉及使用三单引号或双引号：`''''''` 或 `"""`。在 Python 的多行字符串和多行注释中，我们使用三引号。注意：当用于文档字符串（docstrings）时它们会生成额外的代码，但我们现在不需要担心这个问题。


