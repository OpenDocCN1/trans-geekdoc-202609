    在涉及到机器学习和 Python 语言的工作时，没有比处理数据更好的方法了。你收集和清洗的数据越多，处理伴随这一过程而来的某些算法就越越容易。你会发现 Python
    将为我们提供许多算法，但我们首先需要能够对数据进行组织，并将其准备好，以通过算法进行训练和测试，从而看到我们想要的结果。


    考虑到这一点，我们需要花一些时间来探索我们能够使用的不同类型的数据。我们必须查看非结构化数据和结构化数据之间的一些差异，以及何时使用每一种，以及我们如何使用这些类型的数据来帮助我们训练和测试某些
    Python 机器学习算法。


    ## 结构化数据集


    我们需要花时间处理的第一类数据是结构化数据。传统上，我们过去就有这种数据，它们获取起来较困难，但很容易处理。公司会寻找他们需要的某些结构化数据，然后做出为了向前推进所需的业务决策等更多内容。


    这类数据是指任何经过良好组织并随后放入格式化存储库供我们使用的数据。通常，这些数据是存储在数据库中的，以便这些元素可以被用于更有效的处理和分析。


    当我们通过其他数据库来帮助获取信息，或者当我们获得调查结果时，我们可能会找到这类数据。这种数据要容易处理得多，因为已经被组织好了，而且它会符合你想要处理的算法，而你不需要担心缺失值、重复值、离群值或任何其他此类。这也是一种更昂贵的数据处理方法，也可能让整体处理变得更加困难。


    这就是为什么许多公司必须在想要处理的多少结构化数据和多少非结构化数据之间进行平衡。结构化数据可以让工作变得简单，并确保算法运行得更好，但它收集起来更困难；非结构化数据虽然更容易收集，但它可能会让算法的运行和工作变得更复杂。


    ## 非结构化数据


    我们需要处理的第二类数据是非结构化数据。（注：此处原文未提供具体正文，仅根据标题延续了翻译逻辑）


    '
