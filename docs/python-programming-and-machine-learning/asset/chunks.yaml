    现在让我们进一步讨论一下“分裂”（splitting）的概念，并看看它出现在哪里。分裂直接影响决策树的准确性。这意味着，如果我们在决策树上应用许多算法，它们都将影响数据节点被划分为若干子节点的方式。此时，你应该记住两类决策树之间的区别。分裂产生的子节点将保持某种形式的均匀性。此外，节点划分是在每个变量上进行的，但只选择最均匀的子节点。这个过程涉及一些数学知识，我们我们不会深入探讨细节。为了开始构建决策树，理解该过程背后的理论就足够了。话虽如此，让我们看看如何在应用程序中使用它们。


    ## 实践中的决策树


    为了创建决策树，你必须从根节点开始。一旦访问了该数据，你就可以选择某个属性，然后对其进行逻辑测试。结果，你将能够根据结果分支到任何数据子集，从而从子节点中获得理想的结果。你将需要对这些子节点进行递归划分，以清理叶子节点并只保留近乎完美的节点。这些叶子将代表来自同一类的数据样本。此外，你可能考虑对树进行剪枝，以消除那些对提高准确性没有帮助的冗余子部分。这就是分裂过程的目的之一。一旦完成，你就可以选择最优的划分和最有用的特征。


    现在让我们最后结束理论阶段，开始观察实际应用。我们将创建一个决策树。为了演示，我们需要再次使用 Scikit-learn，因为我们将使用另一个名为 `Iris`（鸢）的公共数据集。让我们从导入所需的内容开始。


    ```python

    %matplotlib inline


    import pandas as pd

    import numpy as np

    import seaborn as sns

    import matplotlib.pyplot as plt


    from sklearn.model_selection import train_test_split

    from sklearn.tree import DecisionTreeClassifier


    df = pd.read_csv(''Iris.csv'')


    df.isnull().any()

    ```


    导入所有内容后，我们还通过最后一行进行了空值检查。一旦我们确定没有缺失值，就可以开始检查信息。一如既常，第一步是通过阅读数据集的摘要分析来了解变量和值。一旦你知道你面对的是什么，就可以开始查看列之间的连接。为了进行这项检查，我们导入了
    `seaborn` 模块，因为它为我们提供了一个名为 `pairplot` 的工具。这个工具实际上是一个绘制连接图的函数，它让我们更容易进行可视化。


    此时，你可以为每列使用特定的颜色。例如，你可以操作物种部分的 `hue`（颜色），以寻找该类别中的任何离群值。以下是如何使用 Python 代码实现：


    ```python

    sns.pairplot(df, hue = ‘Species’)

    ```


    如果你决定使用这个特定的数据集，你会发现我们确实有很多离群值，但它们并不占主导。它们可能是未知异常或某些混入错误数据的结果。请注意，与真实世界的数据相比，你处理这些数据集非常干净。大多数数据包含大量的噪声和离群值，你必须彻底清理它们。目前，我们可以忽略这些离群值，因为它们并不常见到会显著干扰我们的结果。


    下一步是使用之前相同的方法将数据集划分为训练集和测试集。然而，由于我们现在使用的是决策树，我们将划分比例从通常的 80/20 更改为 70/30。让我们来看代码：


    ```python

    all_inputs = df[[''SepalLengthCm’, ‘SepalWidthCm’, ‘PetalLengthCm’, ‘PetalWidthCm’]].values

    all_classes = df[''Species’].values

    (train_inputs, test_inputs, train_classes, test_classes) = train_test_split(all_inputs,
    all_classes, train_size = 0.7, random_state = 1)

    ```


    你会注意到 `random_state` 参数不再设置为 0，以保证随机分布。这次，我们希望确保无论执行多少次，划分都是完全相同的。这样，在需要时，我们始终能够重建数据集。现在，让我们应用决策树分类器：


    ```python

    dtc = DecisionTreeClassifier()

    dtc.fit(train_inputs, train_classes)

    dtc.score(test_inputs, test_classes)

    ```


    结果应该像这样：


    ```

    0.95555555

    ```


    我们成功获得了 95% 的准确率，考虑到我们没有进行任何清理并且决定忽略了离群值，这是一个非常优秀的结果。这就是为什么决策树如此强大，因此在训练各种模型时非常受欢迎的原因。你可以在不执行过多的操作的情况下获得高准确率。


    ## 第 9 章 Python 机器学习的核心库


    如今许多开发者更倾向于在数据分析中使用 Python。Python 不仅应用于数据分析，还应用于统计技术。科学家，特别是处理数据的科学家，也偏于在数据集成中使用
    Python。即 Web 应用程序和其他环境产的集成。


    Python 的特性帮助科学家们将其用于机器学习。这些特性的优点包括语法一致、灵活，甚至由于开发周期更短。它还可以开发复杂的模型，并拥有可以帮助预测的引擎。


    结果是，Python 拥有一系列非常广泛的库。请记住，库指的是使用不同语言的一系列例程和函数。因此，健壮的库可以处理更复杂的任务。然而，这在不需要重新编写几行代码的情况下就可以实现。值得注意的是，机器学习主要依赖于数学。即数学优化、概率元素以及统计数据。因此，Python
    提供了丰富的知识，可以在不进行过多参与的情况下执行复杂任务。


    以下是目前使用的一些核心库的示例。


    ### Scikit – Learn


    Scikit-learn 是机器学习领域最好、最流行的库之一。它能够支持学习算法，特别是无监督和有监督学习。


    Scikit-learn 的示例包括：


    * k-均值 (k-means)

    * 决策树

    * 线性和逻辑回归

    * 聚类


    这种库包含了来自 `NumPy` 和 `SciPy` 的主要组件。Scikit-learn 拥有许多适用于机器学习以及数据挖掘任务的算法集。即，它有助于分类、聚类甚至回归分析。该库还有其他可以高效交付的任务。其中一个很好的例子包括集成方法、特征选择，以及数据转换。值得注意的是，如果需要，先驱或专家可以轻松应用它来实现复杂的算法部分。


    ### TensorFlow


    它是一种涉及深度学习的算法形式。它们并不是总是必要的，但它们的一个优点是，只要方法得当，就能给出正确的结果。它还允许你在 `CPU` 或 `GPU` 上运行数据。即，你可以在
    Python 程序中编写数据，编译然后在中央处理器上运行。因此，这让你的分析工作变得轻松。再次，不需要将这些信息使用 `C++` 或或是使用 `CUDA`
    等其他级别进行编写。

