    \ `<stdin>`。\n- 行号告诉你在文件中引起错误的确切行数。由于示例是在解释器中测试的，它始终会显示 `1`。然而，如果错误是在代码块中找到的，它将返回相对于代码块的行号。\n\
    - `function/module` 部分告诉哪个函数或模块拥有该语句。如果代码块没有标识符，或者语句在块之外声明，它将默认为 `<module>`。\n\
    - `exception`（异常）告诉你发生了什么种错误。其中一些是内置类（例如，`ZeroDivisionError`、`TypeError`），而另一些仅仅是错误（例如，`SyntaxError`）。你可以在\
    \ `except` 块中使用它们。\n- `exception description`（异常描述）提供了更多关于错误如何发生的详细信息。描述可能随错误而异。\n\
    \n## 使用异常防止崩溃\n\n无论如何，要知道你可以使用哪些异常，你需要做的就是生成错误。例如，使用上一个示例中找到 `TypeError`，你也可以捕获该错误并提供正确的语句。\n\
    \n```python\n>>> def div(dividend, divisor):\n    try:\n        print(dividend\
    \ / divisor)\n    except ZeroDivisionError:\n        print(\"Cannot Divide by\
    \ Zero.\")\n    except TypeError:\n        print(\"Cannot Divide by Anything Than\
    \ a Number.\")\n    except:\n        print(\"An unknown error has been detected.\"\
    )\n\n>>> div(5, 0)\nCannot Divide by Zero.\n\n>>> div(5, \"a\")\nCannot Divide\
    \ by Anything Than a Number.\n\n>>> div(undeclaredVariable / 20)\nAn unknown error\
    \ has been detected.\n```\n\n然而，这种方式捕获错误仍然可能问题。它确实允许你防止崩溃或停止，但你并不知道发生了什么。为了了解未知错误，你可以使用\
    \ `as` 关键字将 `Exception` 细节传递给变量。按照惯，变量 `detail` 经常用于此目的。\n\n```python\n>>> def\
    \ div(dividend, divisor):\n    try:\n        print(dividend / divisor)\n    except\
    \ Exception as detail:\n        print(\"An error has been detected.\")\n     \
    \   print(detail)\n        print(\"Continuing with the program.\")\n\n>>> div(5,\
    \ 0)\nAn error has been detected.\ndivision by zero\nContinuing with the program.\n\
    \n>>> div(5, \"a\")\nAn error has been detected.\nunsupported operand type(s)\
    \ for /: 'int' and 'str'\nContinuing with the program.\n```\n\n## Else 块\n\n有时错误会在你的代码块中间发生。你可以使用\
    \ `try` 和 `except` 捕获该错误。但是，如果发生了错误，你可能不想执行该代码块中的任何语句。\n\n```python\n>>> def div(dividend,\
    \ divisor):\n    try:\n        quotient = dividend / divisor\n    except Exception\
    \ as detail:\n        print(\"An error has been detected.\")\n        print(detail)\n\
    \        print(\"Continuing with the program.\")\n    print(str(dividend) + \"\
    \ divided by \" + str(divisor) + \" is:\")\n    else:\n        print(quotient)\n\
    \n>>> div(4, 2)\n4 divided 2 is:\n2.0\n\n>>> div(5, 0)\nAn error has been detected.\n\
    division by zero\nContinuing with the program.\n5 divided by 0 is:\nTraceback\
    \ (most recent call last):\n  File \"<stdin>\", line 1, <module>\n  File \"<stdin>\"\
    , line 8, in div\n    print(quotient)\nUnboundLocalError: local variable 'quotient'\
    \ referenced before assignment\n```\n\n如你所见，初始故障之后的语句依赖于它，因此它们也受到了影响。在这个示例中，`quotient`\
    \ 在使用时返回了错误，因为它预期的值没有被赋值。在这种情况下，你希望放弃依赖于 `try` 子句内容的剩余语句。为了实现这一点，你需要使用 `else`\
    \ 块。\n\n## 静默失败\n\n这是错误处理期间常用的编程术语。\n\n从用户的角度来看，静默失败是指程序在某处失败但从不通知用户的状态。\n\n"
