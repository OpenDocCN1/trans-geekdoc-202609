  trans: "\n\n看，所有这些 `if-elseif-else` 子句是如何链接到同一个条件语句的？这就是 `elif` 或 `Else` 块大显用场。如果你的变量（即你想用于条件测试的变量）有多个值，并且需要根据这些值输出不同的内容，你可以将它们放在\
    \ `if-elif-else` 块中。这样一来，一旦第一个条件为真，其他条件就不会被执行。或者，执行 `elif`，或者执行 `else` 子句。\n\n\
    我们正是这样做的。我们说：如果灯亮且炉灶开着，你就关掉炉灶。否则（在 Python 中用 `elif`），如果灯关着但炉灶开着，打开灯，关掉炉灶。此外，继续使用\
    \ `else` 语句。\n\n1. # 炉灶是否开启。\n2. `stoveOn = True`\n3. `lightsOn = False`\n4. #\
    \ 灯亮着吗？只需检查炉灶。\n```python\nif(lightsOn == True and stoveOn == True):\n    print(\"\
    The lights are on, just close the stove.\")\nelif (lightsOn == False and stoveOn\
    \ == True):\n    print(\"Turn the ligts on, close the stove!\")\nelse:\n    print(\"\
    Both the lights and the stove is on.\")\n```\n\n![00042.jpeg](img/image00257.jpeg)\n\
    \n示例还展示了如何在 `if-elif-else` 语句中运行多个条件，并基于所有这些条件进行输出。\n\n## 循环：无尽的循环\n\n想象你正在编写一个程序，要求用户猜一个数字。理想情况下，代码应该运行三次，然后让用户知道他们耗尽了三次机会并失败了。同样，程序应该足够聪明，能够判断用户是否猜中了数字，如果是的话，它将通过显示“你猜对了数字！”来结束程序的执行。\n\
    \n我们使用循环来处理此类情况。循环是指整个代码块反复运行，直到设定的条件不再有效。如果你忘记设置条件，或者条件定义不当，你可能会启动一个永远不会停止的死循环，导致程序完全崩溃。\n\
    \n别担心，你的系统不会崩溃。你可以通过点击绿色运行按钮后总是神奇出现的红色/粉色停止按钮来结束程序。\n\n在 Python 中我们使用的循环基本上有两种类型。第一种是\
    \ `while` 循环，第二种是 `for` 循环。\n\n### ‘While’ 循环\n\n这种循环只要给定的条件保持为，就会一直运行特定的代码块。一旦给定的条件不再有效或变为假，代码块将立即结束。\n\
    \n这是一个非常实用的功能，因为你可能需要依赖某些代码来快速处理信息。为了让你有一个直观的感受，假设你正在猜一个数字。你有三次机会。你希望提示框要求用户猜数字。一旦用户猜错了数字，它会将最大尝试次数从三次减少到两次，告知用户数字错误，然后要求再猜一次。这将持续进行，直到用户猜中正确的数字，或者用完了设定的猜测次数且用户未能识别出数字。\n\
    \n想象一下你需要重复编写多少次代码。现在，多亏 Python，我们只需要在 `while` 循环下面写一次，剩下的就由我们完成了。\n\n以下是 `while`\
    \ 循环的语法格式：\n\n```python\nwhile condition:\n    code\n    code\n    ...\n```\n\n\
    你首先输入单词 `while`，后面跟着条件。然后我们像写 `if` 语句一样添加一个冒号。这意味着，接下来的任何内容都将缩进，以显示它们是在循环或语句下方运行的。\n\
    \n让我们根据此创建一个简单的示例。我们首先创建一个变量。给这个变量起个名字并赋值，如下所示：\n\n`x = 0`\n\n这里没什么好玩的，所以让我们加点东西让它变得更有趣。现在，我们将为\
    \ `while` 循环创建一个条件。该条件将规定：只要 `x` 等于或小于 10，提示框就会继续打印 `x` 的值。你可以这样做：\n\n```python\n\
    x = 0\nwhile x <= 10:\n    print(x)\n```\n\n现在尝试运行它看看会发生什么！\n\n你的控制台现在被一个无尽的零循环淹没了。为什么会发生这种情况？如果你仔细观察代码，我们只给变量赋值了一个值。没有代码来改变这个值或将其增加一或二，或者任何类似的操作。\n\
    \n为了让变量在打印初始值后继续变化，我们需要在代码中再添加一行。称之为增量代码，在打印出一个值后，`x` 将增加 1。循环将重启，这次带有一个更高的值，打印该值然后再加\
    \ 1。循环将持续持续直到 `x` 等于 10。一旦它达到 11 这个值，解释器就会知道条件不再真实或有效，因此我们将跳出循环。\n\n```python\n\
    x = 0\nwhile x <= 10:\n    print(x)\n    x += 1\n```\n\n结果看起来如下：\n\n1. # 炉灶是否开启。\n\
    2. `stoveOn = True`\n3. `lightsOn = False`\n4. # 灯亮着吗？只需检查炉灶。\n```python\nif(lightsOn\
    \ == True and stoveOn == True):\n    print(\"The lights are on, just close the\
    \ stove.\")\nelif (lightsOn == False and stoveOn == True):\n    print(\"Turn the\
    \ ligts on, close the stove!\")\nelse:\n    print(\"Both the lights and the stove\
    \ is on.\")\n```\n\n"
