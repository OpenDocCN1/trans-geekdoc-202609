    \n这是命令的输出： \n\nI love these weathers: \n\nSummer \n\nWinter \n\n## 移除或去除空格\n\n\
    对你来说，‘code’ 和 ‘code’ 看起来是一样的对吧？但对计算机来说，它们是两个非常不同的字符串。它将这个额外的空格视为字符串的一部分。\n\n如果你认为你的字符串右侧有额外空格，使用\
    \ `rstrip()` 方法。这里有一个示例显示： \n\n```python\nusername2 = 'John Doe'\nprint(username.upper())\n\
    print(username.lower())\n```\n\n如果你认为你的字符串左侧有额外空格，使用 `lstrip()` 方法。这里有一个示例显示：\
    \ \n\n```python\nusername2 = 'John Doe'\nprint(username.upper())\nprint(username.lower())\n\
    ```\n\n如果你想移除两端的空格，使用 `strip()` 方法。这里有一个示例： \n\n```python\nmessage = \"  It's\
    \ so cold in London  \"\nprint(message)\nmessage = message.strip()\nprint(message)\n\
    ```\n\n"
