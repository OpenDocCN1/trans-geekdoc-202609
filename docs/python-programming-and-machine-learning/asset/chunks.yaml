    \ to all four print statements: \n\n0.36 \n\n12.0 \n\n32.778999999999996 \n\n\
    0.01 \n\nType Casting: What Is It?  \n\nAnother fact about Python is that it is\
    \ a dynamically-typed language.  \n\nA weakly-typed or dynamically-typed language\
    \ doesn’t associate a data type with your variable at the time you are typing\
    \ your code. Rather, the type is associated with the variable at run-time Not\
    \ clear? Let’s see an example. \n\nx = 10 \n\nx = \"I am just a phrase\" \n\n\
    x = 10.444 \n\nx = True \n\nWhen you run this code, it’ll perform its desired\
    \ actions correctly. Let’s see what happens with the variable ‘x’ though. We’ve\
    \ written four statements and assigned different values to ‘x’.  \n\nOn run-time\
    \ (when you interpret or run your program), on line 1, ‘x’ is an integer. On line\
    \ 2, it’s a string. On line 3, it’s a float, and finally, it’s a Boolean value.\
    \   \n\nHowever, through typecasting, we can manually change the types of each\
    \ variable. The functions we’ll be using for that purpose are str(), int(), and\
    \ float(). \n\nLet’s expand the same example:  \n\nx = 10 \n\nx = float(x) \n\n\
    print(type(x)) \n\nx = \"I am just a phrase\" \n\nprint(\"x: \" + x) \n\nprint(type(x))\
    \ \n\nx = 10.444 \n\nx = int(x) \n\nprint(type(x)) \n\nx = False \n\nx = int(x)\
    \ \n\nprint(x) \n\nIn this program, we’ve used everything covered in the last\
    \ few lessons. All data types and converted them using our newly learned function.\
    \ \n\nIn the first case, x is converted into a float and the type function does\
    \ verify that for us. Secondly, the string is still a string since it can’t be\
    \ converted into numbers, int or float. Thirdly, we convert the float into an\
    \ integer.  \n\nAs an added exercise, if you print the newly changed value of\
    \ the third case, you’ll see that the value of x is: 10\\. This is because the\
    \ type is now changed and the values after the decimal point are discarded. \n\
    \nIn the fourth case, we print the value of x which is False. Then, we change\
    \ its value to an integer. Here, something else comes up. The output? 0. \n\n\
    It’s because, in Python, the value of True is usually any non-zero number (typically\
    \ 1) and for False, it’s 0. So, their integer conversions yield 1 and 0 for True\
    \ and False respectively. \n\nComments \n\nComments are text phrases that are\
    \ put in the code to make it understandable and readable for other coders, readers,\
    \ and programmers. \n\nWhy Are Comments Important? \n\nComments are very important,\
    \ especially when you’re working with other programmers and they’ll be reviewing\
    \ your code sooner or later. Through comments, you can write a small description\
    \ of the code and tell them what it does. \n\nAlso, if you have other details\
    \ or personal messages which are relevant to the code, you can put them there,\
    \ since the interpreter doesn’t catch them. \n\nHow to Write Comments?  \n\nIn\
    \ python, there are two ways to write comments, and we’ll be exploring both of\
    \ them. For our first method, you can use the “#” symbol in front of the line\
    \ you wish to comment. Here, take a look at this code: \n\n\\# This line is a\
    \ comment \n\n\\# Count is a simple variable \n\ncount = 15 \n\nprint(count) \n\
    \nIf you run this code, the output will be 15\\. This is because the comments\
    \ lines (starting with #) are not run at all. \n\nNow, this method is fine if\
    \ your commented lines are less i.e. do not span over multiple lines. But, if\
    \ they do, hashing all of them is a waste of time. For our second comment, we’ll\
    \ enclose our commented lines is three single quotation marks (‘’’) and close\
    \ it with three quotation marks as well. Here’s an example: \n\n1.  ''' \n\n2.\
    \    This comment spans \n\n3.    on multiple lines.  \n\n4.  ''' \n\n5.  count\
    \ = 15 \n\n6.  print(count) \n\nNotice, we have to close our multi-line comment,\
    \ unlike the single line comment.  \n\nData Analysis with Python  \n\nAnother\
    \ topic that we need to explore a bit here is how Python, and some of the libraries\
    \ that come with it, can work with the process of data analysis. This is an important\
    \ process for any businesses because it allows them to take all of the data and\
    \ information they have been collecting for a long time, and then can put it to\
    \ good use once they understand what has been said within the information. It\
    \ can be hard for a person to go through all of this information and figure out\
    \ what is there, but for a data analyst who is able to use Python to complete\
    \ the process, it is easy to find the information and the trends that you need.  \
    \ \n\nThe first thing that we need to look at here though is what data analysis\
    \ is all about. Data analysis is going to be the process that companies can use\
    \ in order to extract out useful, relevant, and even meaningful information from\
    \ the data they collect, in a manner that is systematic. This ensures that they\
    \ are able to get the full information out of everything and see some great results\
    \ in the process. There are a number of reasons that a company would choose to\
    \ work on their own data analysis, and this can include:  \n\n1.  Parameter estimation,\
    \ which helps them to infer some of the unknowns that they are dealing with.  \
    \ \n\n2.  Model development and prediction. This is going to be a lot of forecasting\
    \ in the mix.   \n\n3.  Feature extraction which means that we are going to identify\
    \ some of the patterns that are there.   \n\n4.  Hypothesis testing. This is going\
    \ to allow us to verify the information and trends that we have found.   \n\n\
    5.  Fault detection. This is going to be the monitoring of the process that you\
    \ are working on to make sure that there aren’t any biases that happen in the\
    \ information.   \n\nOne thing that we need to make sure that we are watching\
    \ out for is the idea of bias in the information that we have. If you go into\
    \ the data analysis with the idea that something should turn out a certain way,\
    \ or that you are going to manipulate the data so it fits the ideas that you have,\
    \ there are going to be some problems. You can always change the data to say what\
    \ you would like, but this doesn’t mean that you are getting the true trends that\
    \ come with this information, and you may be missing out on some of the things\
    \ that you actually need to know about.   \n\nThis is why a lot of data analysts\
    \ will start this without any kind of hypothesis at all. This allows them to see\
    \ the actual trends that come with this, and then see where the information is\
    \ going to take you, without any kind of slant with the information that you have.\
    \ This can make life easier and ensures that you are actually able to see what\
    \ is truly in the information, rather than what you would like to see in that\
    \ information.   \n\nNow, there are going to be a few different types of data\
    \ that you can work with. First, there is going to be the deterministic. This\
    \ is going to also be known as the data analysis that is non-random. And then\
    \ there is going to be the stochastic, which is pretty much any kind that is not\
    \ going to fit into the category of deterministic.   \n\n1.  The Data Life Cycle\
    \  \n\nAs we go through this information, it is important to understand some of\
    \ the different phases that come with the data life cycle. Each of these comes\
    \ together to ensure that we are able to understand the information that is presented\
    \ to us and that we are able to use all of the data in the most efficient and\
    \ best way possible.   "
