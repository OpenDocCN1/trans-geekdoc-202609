    \ is out of the way, let us focus on operators. Those pesky little signs that\
    \ keep on changing every now and then remember? We will be looking into these\
    \ to see how they work for us.\n\n## File handling\n\nThe Python programming language\
    \ allows us to work on two different levels when we refer to file systems and\
    \ directories. One of them is through the module `os`, which facilitates us to\
    \ work with the whole system of files and directories, at the level of the operating\
    \ system itself.\n\nThe second level is the one that allows us to work with files,\
    \ this is done by manipulating their reading and writing at the application level,\
    \ and treating each file as an object.\n\nIn python as well as in any other language,\
    \ the files are manipulated in three steps: first they are opened, then they are\
    \ operated on or edited and finally they are closed.\n\n### What is a file?\n\n\
    A python file is a set of bytes, which are composed of a structure, and within\
    \ this we find in the header, where all the data of the file is handled such as,\
    \ for example, the name, size and type of file we are working with; the data is\
    \ part of the body of the file, where the written content is handled by the editor\
    \ and finally the end of the file, where we notify the code through this sentence\
    \ that we reach the end of the file. In this way, we can describe the structure\
    \ of a file.\n\nThe structure of the files is composed in the following way:\n\
    \n- **File header**: These are the data that the file will contain (name, size,\
    \ type)\n- **File Data**: This will be the body of the file and will have some\
    \ content written by the programmer.\n- **End of the file**: we notify the code\
    \ through this sentence that we reach the end of the file.\n\nIn Python, there\
    \ are two types of files: Text files and plain files. It is very important to\
    \ specify in which format the file will be opened to avoid any error in our code.\n\
