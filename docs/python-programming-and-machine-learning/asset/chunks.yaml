- raw: "We can observe that we have created the document \"test.xlsx\" with the steps\
    \ that we explained previously, we can observe that we have created a tuple called\
    \ messages, this tuple has three items that are: \n\n\"Hello\", \"goodmorning\"\
    , \"goodnight\". \n\nOnce the tuple is created, we use the append function, which\
    \ will allow us to attach all the information contained in the tuple messages\
    \ and finally save the document with the save function. \n\nThe append() function\
    \ only admits iterable data, what does this mean? This refers to the data of type\
    \ arrangements, tuples since, if they are not entered in this way, our program\
    \ will return an error. \n\nRead documents in xlsx \n\n![00088.jpeg](Images/image00271.jpeg)\
    \ \n\nLet's go back to our first example to get information from xlsx files, we\
    \ could see that, for this, we imported the load\\_workbook class. The first thing\
    \ we need to know is the name of the file we want to open and for this, we created\
    \ the variable with the name. \n\nIt is important that the files are located in\
    \ the same folder in which the program is stored, because otherwise the program\
    \ will throw us an error. Inside the function xlsdoc() we will create the object\
    \ wb that will be with which we are going to work, followed by this the object\
    \ \"sheet\" is created which is going to represent the sheet that we are going\
    \ to use.  \n\nOnce all this is done, we are going to request the information\
    \ of the specific boxes \"C1\", \"C2\", \"C3\" next to the function value, to\
    \ validate that the information that we acquire is real, we print all the information\
    \ requested. \n\nHandling PDF files  \n\nIt is known that the initials of this\
    \ type of file are: \"Portable Document Format\", which have grown significantly\
    \ over the years, are mostly used in business and education. This is due to the\
    \ fact that they provide a great amount of benefits in which its security is highlighted,\
    \ allowing to add access keys to control who can edit the document and even add\
    \ a watermark to it to avoid plagiarism of information.  \n\nOther outstanding\
    \ data is that these documents can be seen from any device since it is not necessary\
    \ to have a specific program; in addition, the weight of the files is much lower\
    \ since these texts are compressed, unlike Word documents. \n\nA disadvantage\
    \ of PDF files could be that they are not easy to edit once they have been created.\
    \ \n\nIn this chapter, we will only learn how to create PDF files. \n\nTo create\
    \ a PDF file the first thing we will have to do is to download the library through\
    \ the command \"Pip3 install fpdf\", followed by this we can proceed to create\
    \ our document: \n\n![00089.jpeg](Images/image00272.jpeg) \n\nThis is a simple\
    \ level example, but at the same time, it is much more difficult than other types\
    \ of files. To start a document you need a lot of commands, for it we will import\
    \ the FPDF class from the fpdf library, followed by this we create the pdfdoc\
    \ object and this will be the pdf document. Once created this document, we will\
    \ have to customize the formats, size, and style of the letters we are going to\
    \ use. To do this we use the command set\\_font. \n\nIn this case, the type of\
    \ Font that we are going to use is going to be Times New Roman, with bold style\
    \ and a size of 12. \n\nFollowed by this we will add a page through the command\
    \ add\\_page(), since we will need a page on which to write and the function fpdf\
    \ does not create a blank page by default. Then, we're going to insert information\
    \ with the cell() function which contains a set of very important arguments. \n\
    \nThe cell function will contain the width and height that the cell will occupy,\
    \ it must include the message that will be written in string format, in case it\
    \ is required that the edges to come with some detail included we must add 1 since\
    \ the 0 is by default and does not allow anything to be inserted.  \n\nIf you\
    \ want to add a cell below or located to the right, you place a 0 and otherwise\
    \ is placed 1, if you want the text to be centered to the right, left, up or down\
    \ a string will be placed and if you want in it to be centered you write C \n\n\
    Finally, we will have to save the document through the command output(), and the\
    \ arguments that will go with them will be the name of the file (with the \".pdf\"\
    \ included since we want a file in pdf) and then a string \"F\". \n\nManaging\
    \ BIN files \n\nAs we saw earlier, not all files are necessarily text files. These\
    \ same ones can be processed by lines and even there exist certain files that\
    \ when being processed, each byte contains a particular meaning for the program;\
    \ for that reason, they need to be manipulated in their specific format. \n\n\
    A clear example of this are the files in Binary, to work with this type of files\
    \ is no more than adding a b in the space of the parameter mode.  \n\nFor example: \
    \ \n\n![00090.jpeg](Images/image00273.jpeg) \n\nWhen we handle a binary file,\
    \ it is very important to know the current position of the data we need in order\
    \ to modify it. If you don't know the current position, the file.tell() function\
    \ will indicate the number of bytes that have elapsed since we started the file.\
    \ \n\nIn case you want to modify the current position in the file, we use the\
    \ function file.seek(star, from) which will allow us to move a certain amount\
    \ of bytes from start to finish. \n\nException Handling \n\nWhat Is Exception\
    \ Handling \n\nException handling is error management. It has three purposes. \
    \ \n\n1.  It allows you to debug your program. \n\n2.  It allows your program\
    \ to continue running despite encountering an error or exception.  \n\n3.  It\
    \ allows you to create your customized errors that can help you debug, remove\
    \ and control some of Python’s nuances, and make your program function as you\
    \ want it to. \n\nHandling the Zero Division Error Exception \n\nException handling\
    \ can be an easy or difficult task depending on how you want your program to flow\
    \ and your creativity. You might have scratched your head because of the word\
    \ creativity. Programming is all about logic, right? No. \n\nThe core purpose\
    \ of programming is to solve problems. A solution to a problem does not only require\
    \ logic.  It also requires creativity. Have you ever heard of the phrase, “Think\
    \ outside of the box?”  \n\nProgram breaking exceptions can be a pain and they\
    \ are often called bugs. The solution to such problems is often elusive. And you\
    \ need to find a workaround or risk rewriting your program from scratch. \n\n\
    For example, you have a calculator program with this snippet of code when you\
    \ divide: \n\n\\>>> def div(dividend, divisor): \n\n         print(dividend /\
    \ divisor) \n\n\\>>> div(5, 0) \n\nTraceback (most recent call last): \n\n  File\
    \ \"<stdin>\", line 1, in <module> \n\n  File \"<stdin>\", line 2, in div \n\n\
    ZeroDivisionError: division by zero \n\n\\>>> \\_ \n\nOf course, division by zero\
    \ is an impossible operation. Because of that, Python stops the program since\
    \ it does not know what you want to do when this is encountered. It does not know\
    \ any valid answer or response. \n\nThat being said, the problem here is that\
    \ the error stops your program entirely. To manage this exception, you have two\
    \ options. First, you can make sure to prevent such operation from happening in\
    \ your program. Second, you can let the operation and errors happen, but tell\
    \ Python to continue your program. \n\nHere is what the first solution looks like:\
    \ \n\n\\>>> def div(dividend, divisor): \n\n        if (divisor != 0): \n\n  \
    \          print(dividend / divisor) \n\n        else: \n\n            print(\"\
    Cannot Divide by Zero.\") \n\n\\>>> div(5, 0) \n\nCannot Divide by Zero. \n\n\\\
    >>> \\_ \n\nHere is what the second solution looks like: \n\n\\>>> def div(dividend,\
    \ divisor): \n\n        try: \n\n            print(dividend / divisor) \n\n  \
    \      except: \n\n            print(\"Cannot Divide by Zero.\") \n\n\\>>> div(5,\
    \ 0) \n\nCannot Divide by Zero. \n\n\\>>> \\_ \n\nRemember the two core solutions\
    \ to errors and exceptions. One, prevent the error from happening. Two, manage\
    \ the aftermath of the error.               \n\nCongratulations! \n\nThe eight\
    \ character of the password required to unlock the answer booklet is letter t. "
