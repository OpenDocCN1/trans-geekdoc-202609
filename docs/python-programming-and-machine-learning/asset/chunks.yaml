    else:\n    print(\"Both the lights and the stove is on.\")\n```\n\n![00042.jpeg](Images/image00257.jpeg)\n\
    \nThe example also shows how you can run multiple conditions in an `if-elif-else`\
    \ statement and base the output on all those.\n\n## Loops The Never-Ending Cycle\n\
    \nImagine you are creating a program which asks the user to guess a number. The\
