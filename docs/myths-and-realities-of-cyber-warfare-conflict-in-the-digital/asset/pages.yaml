    The common threads among APTs fundamentally differ with strategic issues. Different
    countries will define strategic priorities—both their threats and their opportunities—differently.
    This accounts for the potentially broad range of targets that can be found in
    the crosshairs of different APTs working at the behest of various governments.
    Because these entities focus on strategic areas, they are likely to be well-resourced,
    with regard to skilled personnel and sophisticated equipment and techniques. It
    is important to remember that strategic priorities seldom change overnight. As
    a result, when priority areas are identified, powerful entities are likely to
    work in a way that borrows the old Medici slogan: “Make haste, slowly.” This describes
    the modus operandi of this type of sophisticated threat, and the relentlessness
    and systematic approach taken by APTs. It illustrates how some of the most important
