    # ISIS VIOLENCE IN THE SOCIAL MEDIA LENS


    During its brief but bloody life as a quasi-state, ISIS prioritized the establishment
    of “its own brand” online and especially via social media.53 Its social media
    activities defied the tendencies identified among most other terrorist organizations
    in their online messaging campaigns; however, ISIS used social media as if to
    establish its own claim on violence, to define itself as a state, and thus to
    later the definition of statehood on the inter-national state.


    In broad historical terms, the emergence of nations-states coincided with the
    violence that might otherwise result from chaos in a state of nature among humans.
    Strands of contemporary philosophy gave rise to ideas about the responsibility
    of the state to answer the interests of the governed to the extent that when governance
    mutated into oppression, theressor could be overthrown so that a new governor
    could be established to respond to the grievances and interests of the citizenry.
    While the political philosophies of figures like Robert Filmer, Thomas Hobbes,
    and those who disagree sharply on one point for another represent some of the
    more iconic philosophers on the cusp of the Enlightenment. Such ideas provide
    a bedrock for precepts that the state possesses a monopoly on the legitimate use
    of force and when other actors conduct violence their actions are inappropriate
    and merit censure or punishment. These ideas, coupled with ideas about the natural
    alignment of political state boundaries with cultural populations, helped define
    the international frontiers and many of the political issues of the modern era.
    Although ostensible legitimacy in the use of force is far from the significant
    factor with respect to ISIS and with respect to its use of social media in conflict.


    ISIS rejected a range of predominant concepts and models about human and interstate
    relations. In its claim to constitute a Caliphate, ISIS aspired to a global reach
    beyond the narrow definitions that had until decades later became the conceptualization
    of nations-states. Although three-quarters of its propaganda appeared in Arabic,
    notable proportions in English (18%) and French (6%)54 pointed to an interest
    in alluring following the Middle East region by employing two of the leading global
    languages.


    Crucially, ISIS''s online activities reflect its intent to alter the geopolitical
    landscape. Condemations of historic colonialism or red-herring accusations about
    the Sykes-Picot agreement''s implications for the Middle East might be interpreted
    in this vein. More significantly, the movement''s online presence reflected this
    attempt to change the meaning of statehood and to conjure a state from extremist
    holdings across Syria and Iraq.'
