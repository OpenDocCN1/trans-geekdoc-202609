  md: '# About the Author


    NICHOLAS MICHAEL SAMBALUK, PhD, is an associate professor specializing in military
    history topics dealing with technology and innovation. His first book, The Other
    Space Race: Eisenhower and the Quest for Aerospace Security, was named “Best Air
    Power History Book of 2016” by the Air Force Historical Foundation. He is also
    editor of Paths of Innovation in Warfare: From the Twelfth Century to the Present
    (2018) and Conflict in the 21st Century: The Impact of Cyber Warfare, Social Media,
    and Technology (2019), and author of several articles appearing in Cyber Defense
    Review, Cold War History, and elsewhere. He has taught at the United States Military
    Academy at West Point, at Purdue University, and at the Air War College and eSchool
    of Graduate Professional Military Education; he continues to teach and serves
    on the editorial board of Strategic Studies Quarterly.'
