  md: 'The conflict made use of all these advances in technology, World War I is often
    considered to be a culmination of these technological trends, frequently sharing
    the stage with factors like globalization or imperialism. Singer and Friend, noting
    a parallel with the dynamics on the eve of World War I, have observed that “new
    technologies didn''t actually give the offense the advantage” a century ago and
    they assert that the best defense is a good defense,” in contrast to notions that
    stronger offense could be decisive and could deter an offensive by other power.
    Others who have cast a wary eye on the guns of August have also hastened to clarify
    that these parallels do not spell a fate.65 Contingency matters and people can
    do choose to avert crises that they are able to perceive and appreciate.


    Furthermore, contingency was as true in the past as it is today. Events were not
    cemented by fate but by decisions people took, including those taken to skirt
    the dangers that those decision makers were able to identify and conceptualize.
    This explains why scholars as David Sulek and Ned Moran have observed “no single
    analogy will suffice in considering the complex challenges of cyberspace.”66 No
    set of circumstances ever exactly another, and awareness and prioritization of
    earlier examples help mindsets and the context within which people understand
    their own circumstances.


    To can be further added the examples from cyber domain struggles that have become
    a part of recent history. Healey, a long-standing advocate of institutional learning
    from and about cyber conflict, noted that “when people feel that they are the
    first generation” encountering a problem, “and it turns out they’re the fifth
    to so, they’re going to make terrible mistakes that [they] don’t have to.”67 Even
    conflicts such as the NATO operations against Serbia in 1999, occurring in the
    youth of cyberspace and internet appearing as part of the information operations
    landscape, can teach lessons about the danger of preserving that information superiority
    translates to complete knowledge.68


    Some general conclusions can be extended to the conflict in cyberspace. Analysis
    dating to the time of the Kosovo noted that “technology will not complicate the
    task facing those who melt it into operational art.”69 Modern military history
    graphically displays the validity of this point. The technologies of 1914, applied
    to war, presented challenges that were workably addressed only with the advent
    of modern arms warfare, refined through bloody processes across much of the 20th
    century. Even when technology has appeared to simplify operational art, as for
    example with developments in fortifications from the Renaissance through the Enlightenment,
    it has in fact added to aspects like logistics that underlie military activities,
    including at the operational level. “Technology itself is not necessarily the'
