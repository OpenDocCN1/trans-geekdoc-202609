    # INSTANTANEOUS SPEED


    Perhaps the most important of the temporal mythologies regarding cyberwar deals
    with time itself. The actions targeting Georgia in 2008, coinciding with the kinetic
    combat between that country and Russian military units, was for example dubbed
    by some as “the internet of blitzkrieg.\¹ This in itself is a significant characterization.
    “Blitzkrieg,” the infamous use of “lighting war” by Nazi forces against Allied
    powers, evokes such visceral imagery that it has become almost a cliché. In a
    sense, this illustrates the nature of mythologies. What journalists from neutral
    nations saw in 1939 and 1940 and called “blitzkrieg” was, for the actual practitioners,
    something different. Certainly, it was a “quick and lively” approach to campaigning
    that sought to leverage speed in order to sow confusion within the enemy and facilitate
    an attacker’s exploitation of opportunities² The instantaneous speed of German
    advances in World War II was itself an impression,—a methodology.


    Figures who toil to alert the public or decision makers opportunities or dangers
    frequently come to feel that their exertions go insufficiently rewarded. These
    figures can respond by raising their cry still and louder in more extreme tones.
    “Cyber war happens at the speed of light,” former cyber-czar Richard Clark declared.
    Since “photons of the attack packets stream down fiber-optic cable, between the
    launch of an attack and its effect is barely measurable,” bringing “risks for
    crisis.³ Others have posited that electronic interconnectivity has crucially altered
    counterterrorism, since “time and distance have shortened while the speed of operations
    has increased dramatically in the Cyber Age.\⁴ Conflicts in the first decades
    of the 21st century have already frequently'
