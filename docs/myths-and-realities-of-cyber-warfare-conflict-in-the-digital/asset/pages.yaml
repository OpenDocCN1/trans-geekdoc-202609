- pgno: 179
  md: '# A Postmodern or a Premodern Future?


    variable leading to change” because organizational, doctrinal, and other factors
    in dialog with technology “provide the medium by which technological change translates
    into wider social change.”⁷⁰⁰


    Predictions that the LikeWars of tomorrow will be fought by highly intelligent,
    inscrutable algorithms spewing convincing propaganda and that autonomous systems
    “become cyber fighters on the future battlefield”⁷¹ rely on contingency for their
    realization. Rather than beuiled by apparently inexorable tendencies, it is vital
    to keep in mind that decisions—made in the context of contemporary circumstances
    and the ways that they are understood—will exert a powerful impact on whether
    and how the predictions about tomorrow’s wars will become realized.


    This book has examined several of the key clichés and mythologies about cyber
    warfare, including notions about cyberweapons instantaneous speed, having a reach
    that reduces to irrelevance, inherently cheap and widely available, being limited
    to a single user, exerting only reversible effects, or representing an offensive
    superiority. Like generalizations, mythologies often stem from elements of fact.
    The contradictory aspects of various mythologies, including certainly about cyber
    conflict, illustrates how complex issues can suffer from over-reduction.


    This book also sought to consider how social media has been refashioned for weaponized
    uses, as well as certain forms have been effectively commandeered for other functions.
    The human need for connection, by means that promise to help fill that need, creates
    an environment teeming with potentially valuable data that can be piled, aggregated,
    and leveraged for monetization. The leveraging of data stands at the core of how
    such networking services could be provided without overt frees. The flow of data
    defines the internet, and the model of many internet giants embodies the leveraging
    of data. It should come as little surprise that lucrative resources also hold
    potential strategic uses as well.


    Martin Libicki’s advice that “it pays to be serious but not desperate”⁷² holds
    true struggling in the cyber domain. Although the domain is largely defined by
    its technologies, challenges and dynamics in cyberdomain security are not confined
    to technical aspects. This is why “security will be ‘solved’ in the foreseeable
    future”⁷³—or indeed lie beyond that. Assertions that “how we prepare for enemies
    might help to invent them” carries a degree of truth, in the sense that the actions
    shape the subsequent context and impact others’ perceptions and how they prioritize
    their alternative options. Actions within conflict similarly affect ideas defining
    the appropriate and the acceptable.⁷⁴


    War remains a competition among intelligent antagonists against imposing their
    will and their policy priorities on the shape of the future'
