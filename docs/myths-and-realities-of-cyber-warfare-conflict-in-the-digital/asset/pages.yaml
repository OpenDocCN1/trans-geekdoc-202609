  md: '# A Postmodern or a Premodern Future?


    fealties—particularly where institutions governing and commercial traits can become
    acute. With the social credit system now being introduced in China, political
    reliability is determined through extensive monitoring; the resulting conclusions
    derived from that data are thought to extend into the service available to customers
    at stores and the matches in the leading matchmaking site. The services of today
    could become transformed into a cat''s cradle of overlapping yet conflicting obligations
    to institutions including transnational companies that have partnered with various
    states. The complete implications of a cybered conflict are not fully clear, but
    reason indicates that the topic is worth further and more detailed analysis in
    the future.


    # TEA LEAVES IN DARKNESS


    Historians are not in the business of predicting the future but examining and
    explaining the past. A critical factor to remember when thinking about future
    events is contingency. Seingly trends are in fact shaped by decisions. Patterns
    and currents can be identified and can craft the ways in which people interpret
    the choices available to them. Their interpretations matter because these impact
    the decisions they make, and those decisions shape events.


    Speaking about legion security vulnerabilities present in an IoT environment,
    Schneider argues that "connecting everything is our future. I don''t think we
    can bow our way out of it, [we] have to forward our way out of it." However compelling
    this assertion may seem, it implicitly (and probably inadvertently) reduces the
    aparente alternatives to either a forlorn retreat and a careful advance. The method
    for "forwarding" out of IoT security dangers is a concept liable to be interpreted
    in several alternatives.


    History offers value, in the relatively new cyber domain. Among other things,
    history can offer grounds for sooner. "we are reaching a point where moving is
    faster than policy or conceptual models, and we''ve never lived in state of before"
    sounds less unprecedented when historical examples are introduced for consideration,
    e.g., the technological advances in the last decades of the 19th century and the
    first decades of the 20th. The rapid introduction of telephones and radio for
    communication, of iron and steel for ship construction, of oil to replace coal
    as a fuel, technologies allowing heavier-than-air flight, and chemistry advances
    enabling rapid-fire weapons representing some of the most noticeable technological
    changes occurring in the thirty-eight-year span between the 1876 and the 1914.
    A similar span would reach from the publication of this book back to the early
    expansion of ARPANET. The expansion and maturation of the internet is staggering,
    but it is not quite as entirely unprecedented as might imagine.'
