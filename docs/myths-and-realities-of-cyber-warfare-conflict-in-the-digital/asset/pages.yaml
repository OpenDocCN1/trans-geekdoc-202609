  md: '# CHAPTER 8


    # A Postmodern or

    a Premodern Future?


    POSTMODERN DICTATORSHIP


    Russia’s Vladimir Putin represents the prototype “postmodern dictator” in the
    eyes of journalist David Patrikarakos because of Putin’s ardent usage of the internet
    to promote the apparent interest of his country’s regime. Pertinent literature
    points to a conclusion that this “postmodern” embrace of electronic technology-enabled
    connectedness is a reaction to regime fears the decentralizing tendencies otherwise
    inherent in the internet. It seems ironic that Vladimir Putin was quoted as complaining
    in 2016 “that the Internet makes it easy to hide, be rude, insult others, [and]
    take extreme positions.” In a real sense, however, the features that are described
    as postmodern dictatorship respond to the dangers that autocrats perceive in the
    way connectivity reshapes the landscapes they continue to dominate. Thus, the
    “distance, decentralization, and interaction,” for which had had such hopes over
    nonviolent subversion overturning despotism, provides for a more complicated and
    contested environment.


    Russian authors Andrey Soldatov and Irina Borogan have documented centralized
    responses to these trends during Putin’s time in office. The telecommunications
    monitoring project known as SORM, initiated in 1994, quickly grew to include the
    internet. A government-directed “school of bloggers” was opened in mid-2009, and
    the Russian Internet Agency began posting Russian-language tweets before the end
