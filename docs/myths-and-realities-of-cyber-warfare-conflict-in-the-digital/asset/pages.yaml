    # SOCIAL MEDIA''S IMPACT ON THE STATE MONOPOLY ON VIOLENCE


    Social media can be leveraged in very different ways in connection with violence.
    Some nonstate actors directly use social media to sharpen the effect of their
    attacks. The jihadist attacks in Mumbai in November 2008 were launched with a
    considerable degree of coordination that made both of electronic communications
    and the leveraging of social media. The gunmen were linked by cell phone to a
    control room in Karachi, Pakistan (550 miles away). Indian bystanders near the
    attacks would witness their emergency responders'' actions and tweet what was
    happening, and see fellow Indians who worried loved ones'' caught in the attack
    were not the only people watching these posts; personnel in the control room gleaned
