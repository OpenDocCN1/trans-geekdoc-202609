  md: '# SOCIAL MEDIA''S IMPACT ON THE INSTITUTIONAL ADVANTAGE IN SPEECH


    The seeming paradox about the internet''s long-term effect on information and
    speech becomes a lot more obvious when one recalls that technologies do not choose
    their users and tools that are regularly repurposed in order to gain or retain
    relevance. Thus, although internet technologies can facilitate communication between
    citizens and decentralize power, the same technologies can also be employed to
    shape perceptions through information campaigns and to filter and squash disfavored
    ideas.34


    This is not to say that the internet does not regularly decentralizing trends
    toward. If Joseph Nye had not intended this by his comment that “civil users”
    of technologies, including the internet, “will comply effective national security
    strategies,”35 the point remains valid. Social media networking has facilitated
    countless protest movements in their organization phase, and defending regimes
    have been left with unviable alternatives such as allowing them to prevent, proceed
    to seek organization with their own messaging, tracking organizers or filtering
    communications, or simply pulling offline in hopes that efforts are not sufficiently
    prepared to occur in any case. Sometimes, very popular protest brands (such as
    #IranianRevolution) have even come to attract commercial interests to participate
    or facilitate activities as part of their business.36


    The ability to control the internet''s democratizing tendencies seems paradoxical,
    in part, because of assumptions that are genuine users. When manufactured entities
    partake in open discourse, the result is not a conversation, and this manufacturing
    of participants is the starting point from which one should consider an institution’s
    attempts to shape opinion. Chapter 4 noted the free added muscle that patriotic
    hackers can to society or nation-state. Their activities will be impartial and
    may be raucous, but patriotic hackers are genuine participants in cyberspace in
    some ways that are inconvenient or even problematic for their handlers. Their
    hacking engages interests and passions but by primary motivation is a state-centered
    focus of allegiance in their activism. Patriotic hackers require support that
    cannot be provided as compensation for their hacking without affecting the definition
