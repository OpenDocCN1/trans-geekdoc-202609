    # THE PURPOSE OF THE BOOK


    This book aims to examine several of the notable clichés—even mythologies—which
    have taken hold regarding the cyber conflict. Excellent works on war and technology,
    as Martin van Creveld''s classic *Technology and War*, have explained that "the
    idea that the war is neither self-evident, not necessarily correct, nor ever very
    old," his suggestion that the concept gained ground in the mid-twentieth century
    because of World War II.⁸ Other scholars speaking specifically to a conflict waged
    through the cyber domain contributed significant points to the conversation. Martin
    Libicki''s description of "cybersecurity and system compromise" as "games of competitive
    learning" harken to classical interpretations of military struggle as a contest
    between actively interacting forces. Other scholars have pointed out that Clausewitzian
    concepts about war remain valid, that an overly narrow definition of violence
    can obscure a deeper understanding of cyber conflict'
