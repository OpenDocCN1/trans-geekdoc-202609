  md: '# Myths and Realities of Cyber Warfare


    Contrasting statements have noted that the complexity of computerized supervisory
    control and data acquisition (SCADA) systems reduces the likelihood of anti-SCADA
    malware being something eligible for rapid development or early leverage against
    a large number of targets. This does not alter others’ concern about long-term
    exploration and potentially seeding complex systems with malware, to be triggered
    at a moment of the adversary’s choice.76


    Still, other predictions argue that “clearly, future cyber attacks will target
    systems in a more sophisticated manner than Stuxnet.”77 Pronouncements such as
    this carry a palpable air of certainty—and an element of a subconscious presumption
    that sophisticated weapons are more-weapons “modern” and more effective. While
    the development and use of cyberweapons may possibly reveal a trend toward increasingly
    complex and sophisticated forms of malware, there is no deterministic set of forces
    forcing them to do so. Cyberweapons are technologies—and technologies are made,
    adopted, and adapted, to address perceived needs in acceptable ways. Trends in
    the development and use of cyberweapons will be contoured by ideas about policy
    goals and also by decisions about strategic, operational, and tactical approaches
    that will support the pursuit of those objectives. Understanding that fact facilitates
    a meaningful understanding of warfare. Studying conflict in cyberspace means questioning
    commonplace wisdom about cyberweapons and examining operations through cyberspace
    more deeply.'
