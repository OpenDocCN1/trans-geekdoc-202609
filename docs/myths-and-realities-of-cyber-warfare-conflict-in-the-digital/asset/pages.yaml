  md: '# Temporal Mythologies of Cyberwar


    In recent years, researchers in the European Union have pointed to signs of APTs
    gaining long-standing access to a range of networks across various key industries
    and in several countries, and cybersecurity advocates have reportedly pondered
    whether such access might allow long-scale reconnaissance but also preparation
    of latent threats to infrastructure.95


    The vulnerability studies at Idaho National Laboratory known as the Aurora vulnerability
    constituted an ever more explicit wake-up call. While some writers declared that
    the test ''lends credence to the suggestion that the manipulation of computer
    code can be just as effective in destroying critical infrastructure as a missile
    would,'' and others argued that the vulnerability ''extends'' to several sectors
    in SCADA systems operate.96 The validity of the last point may stand or fall to
    some degree based on the extent to which the standardization trend identified
    by Rid is adopted across different sectors. Thus, although experts know that tailored
    attacks against complicated and obscure systems require time reconnaissance of
    the target and preparation and testing of attack tools, an awareness that SCADA
    as a class of potential target has existed for the quarter century since Eligible
    Receiver 97, and it has heightened by Aurora more than a decade ago, in addition
    to the actual examples of attacks that have taken place.


    Forensics studies show dramatically different degrees of sophistication and technical
    surprise with respect to cyberattacks, including those that have been deployed
    against SCADA systems. At the high end, the Stuxnet malware with its four discrete
    zero-day exploits, a decade after its discovery, continues to represent the apparent
    high-water mark of sophistication in a known anti-SCADA malware. The repeated
    attacks against Ukrainian electrical power infrastructure embody the other extreme
    in terms of technical surprise. The 2015 attack leveraged a vulnerability that
    had actually identified a dozen years earlier. But the inherent criticality of
    critical infrastructure precludes practices such as patching or updating devices
    over SCADA systems. As a result, the factors that Singer and Friedman have long
    noted the patching of known vulnerabilities on many personal computers worldwide
    are still more extreme for systems that must be ''on'' continually.


    In short, interrogating the temporal mythologies of cyberwar invites the conclusion
    that cyberattacks (broadly defined) are diverse enough to resist generalizations
    about the speed of cyberwar, about the supposed irrelevance of distance or geography,
    about their cost-effectiveness, and about their potential shelf-life as single-use
    weapons.'
