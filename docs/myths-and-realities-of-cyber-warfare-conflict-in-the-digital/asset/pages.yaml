  md: '# Myths and Realities of Cyber Warfare


    A realistic appraisal of the myth that cyberattacks possess instantaneous speed,
    therefore, demands an examination of some of the different kinds of hostile activities.
    While many other forms of attacks exist, further consideration of distributed
    denial of service (DoS) attacks and of advanced persistent threats (APT) attacks
    can help shed light on the issue of the presumably instantaneous speed of cyberattacks.


    # DISTRIBUTED DENIAL OF SERVICE


    Denial of service (DoS) attacks represent possibly the most common of an easily
    established, swiftly striking cyberattack. Different approaches exist, but the
    essence of a DoS attack is that attacking devices flood with either deliberately
    incomplete or spoofed signals. The target is overwhelmed in the first case because
    it first interprets and reacts to the attack as if it were a series of legitimate
    incoming encountering some technical hurdle, or it is overwhelmed in the second
    kind of DoS by the deluge of spoofed signals.¹⁴ Attacks can be distributed (thus
    DDoS), although they are commonly launched to enumerate political statement, the
    threat of DoS attacks has also been used by criminals to exert money.¹⁵ This points
    to a recurring theme, that intersections between crime, espionage, and conflict
    in the cyber domain are frequent and the distinctions can be either obscure or
    dubious.


    Although MafiaBoy''s DoS attacks against Yahoo and other websites were the early
    politicized uses of DDoS occurred in Estonia in 2007, when the small electronically
    connected Baltic country moved to rid the capital of one of the Soviet-era landmarks
