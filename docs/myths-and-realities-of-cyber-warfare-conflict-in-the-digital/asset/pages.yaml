  md: '# CHAPTER 1


    # War’s Character and Nature,

    and the Stuxnet Trap


    THE CHARACTER OF WARS AND THE NATURE OF WARFARE


    War, the policy-oriented use of force against a clearly antagonist, is an enduring
    but unpleasant element in human affairs. Evidence of warfare dates at least as
    far back as 10,000 BCE. Carl von Clausewitz’s On War justifiably remains a landmark
    work two centuries after its writing, since among other things it explains force
    and violence as expressions and instruments of policy goals.¹ Uncertainty, struggle
    between human antagonists responding to one another, and the application of force
    in pursuit of policy goals continue to describe the fundamental nature of warfare.
    Military history shows antagonists seeking to gain advantage in conflict, and
    frequently this involves the use of different methods or tactics, the use of different
    technologies, and often changes in both tactics and technology in order to make
    more effective use of the two in concert with one another.


    Combinations of attacks and technologies include the development of the rectangular
    17th-century tercio formation equipped with long pikes and harqueuses and able
    to advance or retreat with relatively equal fel, oblique order attacks by 18th-century
    infantry moving in close order and equipped with bayonet-mounted fused muskets,
    and the 20th-century emergence of combined arms warfare in which infantry might
    advance in concert with friendly armed forces and air components directing firepower
    against the enemy. The character of combat in these three examples are clearly
    distinct: the tercio moves at walking pace and possesses limited organic firepower
    but can rapidly change direction; whereas the close-order infantry launching an
    oblique attack move at the same pace with greater force but less flexibility,
    while wielding greater firepower; combined arms units can move more swiftly and
    in concert deliver devastatingly larger amounts of'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Myths and Realities of Cyber Warfare


    firepower, while having different logistical requirements for their sustain as
    an organization and for their use in battle. Each example shows a different expression
    of merging tactics and technology to address challenges to conflicts of their
    respective eras. Despite the important impact each would have on the character
    of an individual war, none of the three alters the nature of war. The pike-carrying
    infantryman the tercio, the 18th-century musketeer, the tank commander, and any
    of their comrades, participate in the use of force to support a policy goal of
    their respective society or state. The nature of war endures, and the introduction
    of new tactics or technologies does not change the nature of war.


    With new technologies, new domains of combat alter the character of wars, but
    they do not change the fundamental nature of war. However, whereas new domains
    frequently appear on battlefields, new domains for fighting emerge only rarely.
    This can lure people into imagining that the emergence of new fighting domains—could
    somehow be of revolutionary warfare. Moreover, most of the new domains for exploitation
    have emerged recently, lending a false sense of validity to the idea that new
    domains change the core of warfare. Whereas land combat dates to at 10,000 BCE,
    the first fighting at sea is believed to have taken place around 1200 BCE, after
    a lag of ninety centuries. In contrast, introduction of the other domains has
    occurred with breathtaking succession from a historical standpoint: heavier-than-air
    flight inaugurated the air domain in 1903, successful strategic intelligence exploitation
    of the space domain began in 1960, and research into the networking of computers
    starting in the 1960s led to the development of the World Wide Web and the internet.
    Thus, it is possible that a person born shortly before the Wright Brothers flight
    could have personally lived to see the air, space, and cyber domains radically
    change the character of security affairs and conflict.


    An array of authors, scholars, and other influencers has grappled with the impact
    of the cyber domain on the kinds of political struggle that are remarkable Examining
    the impact of social media on 21st-century conflicts, journalist David Patarakaras
    argues that we are in need of a new conceptual framework that takes into account
    how social media has transformed the way that wars are covered, and consumed in
    order to ‘understand the twenty-first century war’ because ‘Clausewitzian war
    is displaced by what [Emile] Simpson calls ‘coercive communication.’ Law professors
