  md: '# Myths and Realities of Cyber Warfare


    provide them. Rosenberg notes that the “cloud is really a name for a variety of
    services.” Among them all, the “consumer does not manage or control the underlying
    cloud infrastructure” ranging from servers to storage, but instead “has access
    to data or applications on an as-needed basis from the cloud service provider.”—57
    This is a dynamic that has been easily visible the popularity of various walled-in
    electronic entertainment platforms (offering products such as music or sophisticated
    games). Users can discard a service only by abandoning their time or monetary
    investment in the “as-service” product as being a sunk cost.


    Considering the “as-service” model in combination with the apparent trend toward
    IoT invites coalitions that parallel some of Schneier’s predictions. “Companies
    are analogous to feudal lords, and we are their vassals, peasants, and—on a day-serfs.”—58
    Other internet models have inspired others to afford as serf. The early and eclipsed
    internet giant America Online (AOL), aimed to moderate internet materials by offering
    users a discount in exchange for dozens of hours of weekly effort in content creation.
    “AOL’s serfs” eventually launched a series of lawsuits arguing that they have
    been led into a ‘cyber-sweatshop.’59 Although the for-discounts model fell out
    of vogue and was replaced by subcontracting moderators that had arguably been
    a more voluntary arrangement than the type produced through as-service models.
    Noting that social media giants dominate communication alternatives, Schneier
    suggests “it’s becoming increasingly difficult to not pledge allegiance to at
    least one of them.”—60


    Schneier’s allusion to feudalism may ring even truer than he has realized. One
    of the features of feudalism arguably stemmed from the military and political
    implications it fostered. Kinship influenced decisions about whom a vassal should
    align and affinity. The vast majority of the population were serfs, lacking rights
    and serving as base vassals to their local lord. Feudalism resembled a pyramid
    in its structure, and among lords, an individual was almost guaranteed to be a
    vassal to a higher lord while also being the lord to vassals in the hierarchy.
    Political jockeying meant that the bonds of ostensible fidelity could be disturbed
    or reversed. The feudal imagery can be extended beyond the simple idea of consumers
    serving in serdom to corporate masters. Consumers, as clients of various as-service
    products, can be understood existing in simultaneous and overlapping vassalhood
    relative to various institutions. These institutions, focused on global connection
    and the revenue it enables, are necessarily transnational in character. If these
    take on greater responsibilities sometimes demanded of them, their role will expand
    increasingly into one resembling governance.


    Deibert described the internet as “less a pure commons and more a mixed-pooled
    resource.”—61 Where products are framed as services, clients can resemble vassals,
    and the prospect of overlapping'
