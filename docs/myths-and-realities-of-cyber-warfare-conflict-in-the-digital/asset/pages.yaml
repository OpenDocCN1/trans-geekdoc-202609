    # ADVANCED PERSISTENT THREATS ESPIONAGE


    The ramifications of long-standing espionage activities cause enduring problems
    after a DDoS has ceased interrupting access to one or another website. Pernicious
    espionage efforts by advanced persistent threats, or APTs, so-called because of
    their technical sophistication and the longevity of their efforts, cast a long
    strategic shadow—and yet the fact that such espionage has emerged in favor of
    necessarily treating such activities as “attacks,” per se.


    Spying is understood as something generally by countries rather than something
    unique to particular states or political philosophies. Indeed, cybersecurity writer
    Brian Mazan observed that ‘the preventent cyber actors [have] more to gain in
    engaging in cyber warfare than significantly restricting it’ and if such is the
    case with cyberfare, it is all the truer until regarding espionage.


    Rather than following a haphazard approach to confirm whether common vulnerabilities
    leave a target undefended before continuing on forward screening of another potential
    target, APTs carefully select targets that are suspected to possess some data
    of value, economic or otherwise. A reconnaissance team may prepare for months
    by watching for patterns in a target’s communication habits, in order to eventually
    launch a phishing attack against a target and frame a message plausibly as possible
    to appear legitimate and trustworthy. Successful attempts deploy malware against
    a target by means of bogus links that a targeted user follow or malware-laden
    attachments that a targeted user trusts.28 From this point, the espionage team
    reinforces and expands its ability to access and navigate a system. This can include
    ensuring new backdoor routes through which the APT can regain entry if the target
    were to recognize and see the intrusion. The risk of the target’s realization
    is minimized, however, by the APT obtrusively elevating the access privileges
    of users it has compromised, or else by compromising further users within a system.


    One eerie and infamous espionage tool is to activate the microphones and webcams
    that have been almost ubiquitous on computers and phones for more than a decade.29
    Another reported tool is a keystroke logger that'
