    As is typically the case for clichés, facts are extrapolated and contorted to
    the point of requiring study and clarification. This work is meant to contribute
    an important analysis of some of the concepts that have gained traction among
    the politically-oriented struggle in and through the cyber domain.


    # DEFINING “WAR” BROADLY


    Definitions matter, and answering questions about what constitutes “cyberattack”
    or “cyberwar” strongly impacts about how serious a hostile activity in the cyber
    domain is and what can be done in response to one. Perspectives abound in relation
    to these questions, however; lasting and consensus elusive at national and international
    levels. Scholarship and action seem to have cumulatively fallen into three broad
    categories of thought: interpreting cyberattack and cyberbroad, interpreting them
    narrowly, and categorizing events on a case-by-case basis with more reference
    to situational context than to ironclad tenets.


    Broad-definition advocates argue that the political orientation of aggressive
    activity in the domain indicate more an act being an “attack” or part of a “war”
    than any benchmark in terms of damage or lethality.¹17 Some authors provide very
    broad definitions, as “cyberwarfare is the use of information systems against
    the virtual personas of individuals or groups.” The U.S. National Institute of
    Standards and Technology (NIST) declared “any kind of malicious activity that
    attempts to collect, disrupt, deny, degrade, or destroy information system resources
    or the information itself” to constitute an attack in cyberspace.¹18 If an attack’s
    effectiveness matters less than the attacker’s motivation, then even failed attacks
    should, so the argument goes, be recognized for what they were meant to be.


    Ambiguity can be interpreted to support this perspective. Technical cyberattacks
    resemble cyber espionage in a way that kinetic attacks by a military force do
    not resemble in the physical domains. When a military unit seeks to infiltrate
    an enemy’s defensive positions, the weapons, equipment, and even clothing worn
    by the infiltrators may likely correspond to those of combatants. The digital
    intruder who aims to research a targeted system for information cannot be well-distinguished
    from the intruder who wo plans to mete out the kinds of disruption, denial, degradation,
    or destruction identified by NIST as an attack. This similarity comes because
    the prerequisite steps before causing such injury involve understanding how a
    targeted system works'
