  md: '# Foreword


    As I write this in July 2019, the news has been full of stories relating to computer
    issues caused by organized (often, nation-state) groups. This has included accounts
    of Russian influence on social media to disrupt elections in the European Union
    and the United States; accounts of ransomware deployed city governments and health
    care; extensive theft of intellectual property by Chinese espionage actors; attacks
    against Iranian command-and-control systems by the United States in retaliation
    for the downing of a drone; warnings of surreptitious Iranian and Russian penetration
    of electrical system infrastructure; and warnings of potential financial system
    attacks by North Korean hackers—all within a two-week span!


    As context for my remarks, consider that I have been working in what is now called
    cybersecurity, and national security, for nearly forty years. I learned to program
    using punch cards and plugboards. I helped run some of the earliest social media
    (Usenet). I founded one of the largest cybersecurity centers in the world (CERIAS
    at Purdue University). In all that time, I have seen the tempo of computer incidents
    increase steadily, and the damages continue to grow. Yes, defenses have also been
    developed, but they are unevenly applied. Moreover, as the population has grown,
    so too the value of finding ways to circumvent those controls to steal items of
    value, manipulate perception, and damage functionality. The threats now are the
    most severe I have seen and continue to grow... as the losses.


    How we describe these losses and actors makes a difference in how we respond to
    them. Are the perpetrators merely criminals or something'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'more? When hostile acts are carried out by nation-state actors are those more
    belligerent posturing, they are “legitimate” espionage, are they terrorism, or
    are they acts of war? If they are acts of war, why do we not respond with all
    our forces? Why do we seem to have ineffectual responses to so many of these incidents?
    They are semantic issues with underlying policy questions that many people have
    tried to address in the last few years. In particular, the term “cyberwar” was
    used more frequently in some circles, but not everyone is comfortable with that:
    if it is genuinely war, why is there no full-scale declaration and response (other
    than the horror and devastation that war would bring)? If it is not, then what
    is it?


    Professor Sambaluk on these questions, and, more, in this book. He brings the
    perspective of a meticulous military historian with technical expertise to a problem
    set often addressed only by those with narrower domain expertise. He explains
    the questions posed by our increasing reliance on cyber technologies, along with
    the answers put forward by those working in the realm, backed by extensive references.


    In Sambaluk’s book, you will find extensive coverage of the questions of how cyberwar
    might be defined, of how influence operations in social media are aware the difficulties
    associated with attack attribution, the role of data as a “battles,” and several
    other difficult topics. This coverage both illustrates misconceptions about these
    items and exposes some of the thorny disagreements about nomenclature and importance
    that occur over these topics.


    As already noted, I have been working in the field for forty years and reading
    this book both reminded me of some critical incidents that had occurred over that
    span and also exposed me to some significant items I had not seen before—which
    I attribute to his careful research and exposition. What is more, I appreciate
    that the book does not promote a particular interpretatretion of the prior work
    and instead exposes many of the essential facets of the issues. As a reader, I
    am presented with a wealth of information that may be considered, and to enable
    formulation of my own considered set of conclusions.


    Students and colleagues often ask me about “cyberwar” and what that mean. I am
    well aware of the complexities and differences of opinion on the topic, and thus
    I usually respond with the unsatisfactory (but concise) response “It’s complicated.”
    Now I’ll be able to respond, “It’s complicated, read Nick Sambaluk’s book to understand
    why.” That is still concise but gives me the satisfaction of providing a useful
    answer.


    This book is going on my shelf of primary references; I suspect other scholars
    of the field will similarly value it, as will anyone trying to better understand
    the complexities of the topic.


    Eugene H. Spafford

    July 2019'
