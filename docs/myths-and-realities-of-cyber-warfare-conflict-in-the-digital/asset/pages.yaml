    may be true, although the record shows many cyberattacks have been successfully
    employed ever (sometimes many years after) their first use would theoretically
    initiated the countdown on their relevance in cyber conflict. It does not address
    the point (outlined by Libicki) that given adequate testing facilities an attacker
    can examine effects as part of modifying and developing a cyberattack tool that
    becomes visible only upon deployment.³³ This means that although an attack may
    indeed have a shorter half-life than is the case with a defense, the clock begins
    running for the defense when it is released, and the clock on the attack is started
    only with the launching of an attack.


    Seeking to dispel excessive notions of the power of the offensive in cyber, Libicki
