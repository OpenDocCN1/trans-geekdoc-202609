    # A MORALITY OF REVERSIBLE CYBERATTACK?


    The conclusion that cyberattacks exert only temporary effects give rise to a discussion
    among ethicists. This volume is not a work on warfare ethics, but the literature
    over cyber conflict includes advocacy of cyberattack on grounds that are founded
    on the premise that cyberattack effects are less extensive and more persistent
    than those of conventional weapons of kinetic war.


    Jeremy Rabkin and John Yoo openly argue that “the most attractive aspect of cyber
    operations from a tactical standpoint is that they can be customized,”⁴ for the
    reason that “cyber weapons have far more value as a more precisely tuned means
    of coercion between nations, rather than as a weapon of destruction.”¹⁰ Both co-authors
    are law professors, and Yoo also served controversially as deputy attorney general
    from 2001 to 2003; while their argument extends beyond cyberattacks to unmanned
    vehicles and robotics, a recurring message is that precise getting militarized
    forms of high technology can increase the opportunity to wield legitimate coercion
    against rogues on the international stage and (implicitly) rare. Reversibility
    of cyberattacks would fit neatly into this line of argumentation.


    But the idea that weaponizing high technology will be used only by good guys for
    the purpose of coercing rogue entities and preserving peace is appingly simplistic.
    If such an approach proved itself to be an effective tool for maximizing a favorable
    peace, adversaries would quickly seek to redress the new balance. This might entail
    the deployment of the same kinds of technologies in order to pursue very different
    kinds of objectives. Alternatively, it might involve the deployment of strategies
    that minimize the utility of the new-tech weapons. The assumption that cyberweapons
    (and other high-tech tools) can be weaponized but in a controlled way rejects
    historical precedent and rationality—not to mention running aoul of Rabkin and
    Yoo''s own characterizations of how international law has been used to assist
    rogue actors. Their justifiable objections to the artificial and selective deployment
    of international law illustrate how a deliberately constructed tool can nonetheless
    be repurposed for very different ends. Deep flows are embedded within their argumentation,'
