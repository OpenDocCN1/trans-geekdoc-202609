    Hijacking involves selecting a popular trend and posting so many tweets about
    a particular topic (unrelated to the trend) that the original (topical) traffic
    is washed out. Hijacking requires much more effort than distribution, but successfully
    hijacking can provoke wider attention. Creation involves launching a new and pertinent
    hashtag and elevating it to the prominence of a trend through a massive volume
    of traffic rivaling the size of existing popular trending topics of discussion.
