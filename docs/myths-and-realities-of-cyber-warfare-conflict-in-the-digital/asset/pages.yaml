    Still, journalists reporting on the Christchurch massacre commented on the task
    involved in automated identification of questionable images and content. One CNN
    report cited a scholar specializing in digital forensics although “20% of the
    work is to get you to 90% accuracy, four times as much is involved in closing
    the gap between 90% accuracy and 99.9%,”⁷²


    Cyber and national security analyst Paul Rosenweig noted in 2013 that “our hierarchical
    decision-making strategies remain dominant and operate too slowly to catch up
    with the pace of cyber activity,” and policy-making is unequal to the uses of
    social media often seem to reinforce the apparent validity of novel concepts.
    It is worth noting, that policy lies at the top of the levels of conflict, above,
    strategy, and tactics in descending order. Strategies do not turn smoothly on
    a dime, and policies should not be expected to do so, either. Policies and strategies
    need to be robust enough to bear the myriad moment-to-moment changes that inevitably
    occur in a conflict. Tactics and often operations respond to these dynamic changes.
    One must consider whether the challenges involved in closing the aforementioned
    automated accuracy gap from 90% to 99.9% certainty constitutes more of a policy
    issue or a tactical one. A tactical issue is important in the moment, and it may
    be important in recurring cases. A policy issue carries infinitely more implications
    and lasts far longer shadow.


    If delivering reliability to automated monitoring is a policy issue, it does not
    guarantee that it can be achieved quickly—and it ensures that other questions
    will arise. The technology that increases the anticipatory powers of automated
    moderation will find themselves in the hands of others, and those will be employed
    for other purposes. Policy questions and the espoused answers—about data and prediction
    will exert massive impact for decades to come.'
