    of wars, but technologies do not change the nature of warfare. The introduction
    of new fighting domains will be especially apt to change the character of conflicts
    and certainly, the introduction of new domains presents the need for conceptualization.
    Into this gulf, many partly or conditionally accurate concepts have gained conventional
    acceptance—and this needs to be counterbalanced by analysis and reflection. Even
    the establishment of additional domains of warfare will not alter its enduring
    nature.
