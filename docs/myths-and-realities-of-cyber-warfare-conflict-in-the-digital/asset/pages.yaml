    # ZERO-DAYS


    Most unfamiliar activities in cyberspace use old tricks rather than created malware.
    The old tricks are tried in a pattern reminiscent of a chain letter: most chain
    letters may be thrown away, but a handful will be sent forward, and thus scaling
    the number sent out will increase the chances that some will succeed. Defenses
    like anti-virus suit for previously identified malware and block these attacks.
    For an attacker to increase the chances of a particular target falling to an attack,
