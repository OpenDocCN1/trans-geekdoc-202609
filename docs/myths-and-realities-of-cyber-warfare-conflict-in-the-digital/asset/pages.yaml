    The term "advanced persistent threat" (APT) reportedly dates to 2006, when the
    U.S. Air Force was trying to describe at the unclassified level the patient and
    persistent espionage originating in China. A few years later, engineers at Google
    noticed signs of the kind of sophisticated, well-sourced espionage that would
    come to define APTs. In order to gain authority to operate in China, Google had
    already agreed by 2005 to structures that would not offend the regime, whose interest
    in "social harmony" encompassed elimination of inquiry and discussion deemed controversial
    ranging from pornography to the regime''s handling of the Tiananmen Squares in
    June 1989. Google also learned that its mapping services were running all of the
    regime''s preferences.


    Operation Aora was a turning point, however. By January 2010, forensics showed
    that hackers had been aggressively covering a range of information from Google.
    One notable target was the source code for Google''s search engine, something
    of clear economic value to any cyber thief. Other targets, such as the Google
    accounts of human rights activists, supporters of the Dalai Lama, and Google''s
    records about what court orders had been delivered to the company regarding potential
    foreign agents, pointed to the People''s Republic of China as the operation''s
    instigator. Google chairman Erik Schmidt reflected to a nationalist later that
    "the Aurora attacks had pretty much ended the debate inside the company about
    what our future was on the mainland" of Asia. After uncovering the operation,
    Google threatened to stop cooperating with its earlier agreements to restrict
    Chinese online searches, and within months Google was leaving China.


    Simultaneously, other intricate espionage projects were occurring against a range
    of other targets. Espionage traced to IP addresses in China is reported to have
    operated from 2007 to 2009 and to have targeted defense contractors developing
    the F-35, the stealthy fifth-generation jet multiple fighter undertaken by the
    United States. Some have alluded to a connection between these activities and
