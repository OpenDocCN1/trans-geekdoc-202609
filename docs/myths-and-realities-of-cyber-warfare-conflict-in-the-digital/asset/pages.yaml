    discourse takes various forms, known as trend distribution, trend hijacking, and
    trend creation. Trend distribution refers to inserting messages into existing
    lines of discourse in the hope that they will attract attention; an example would
    be tweeting a flurry of plentiful statements or images, each tweet carrying a
    hashtag selected for its popularity rather than its pertinence. Trend distribution
    could be thought of as the Twitter counterpart of earlier social media phenomenon
