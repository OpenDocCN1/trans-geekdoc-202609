    # Mythologies of

    Cyberwar Effects


    REVERSIBILITY OF EFFECTS


    A number of widespread ascriptions about cyberattacks concern their

    effects on a target. These include the common but not universal idea that

    attacks produce only temporary and reversible effects, arguments

    that the victim of a cyberattack essentially deserves the blame for its occur-

    rence, the predominant interpretation that attack is superior to defense in

    the cyber domain, and assertions that indicate expectations that cyber hos-

    tilities may come to eclipse or displace fighting in the physical domains.

    The idea of reversible attacks may be the most useful starting point in an

    effort to unpack and consider these conceptions.'
