  md: '# War''s Character and Nature, and the Stuxnet Trap


    Stuxnet stands as both the sole example of a kinetic-effect cyberweapon and as
    an exception to many of the ruling patterns regarding weaponry, the urge to extrapolate
    from its example carries uncertainty. This has prevented comment about the future
    of cyberwar, based on the experiences and interpretations of Stuxnet.


    Important aspects remain unclear a decade after the malware''s discovery in the
    spring of 2010. Different sources disagree about the spread of the malware''s
    final version. Some analysts have described Stuxnet as “a well-designed cyber
    weapon,” and others used it as evidence that “a cyberweapon could be on a short
    leash.”72 In contrast, one New York Times article in the months after the malware''s
    discovery declared that “Stuxnet was splattered on thousands of computer systems
    around the world, and much of its impact has been on those systems.” Symantec
    reported that the initial infections to reach a total of 100,000 devices located
    in more than 100 different countries. An executive at Microsoft reflected in 2018
    that “we essentially had to end defending over a billion customers in a response
    to what was ultimately meant to be a highly targeted, highly precise action.”73
    Of course, different vantage points can shape diverging views of what constitutes
    the impact of an attack. Whether it is an insert piece of code half the size of
    a single camera phone image, on one hand, or the shadow of a cyberweapon, on the
    other, depends in part on perspective.


    Libicki seems to conclude that uncertainty may prove to form a pattern with cyberattacks;
    in contrast to the tools for battle damage assessment leaving a kinetic strike,
    cyberweapons “may leave even the victim scratching his head about what the damage
    was.” Rid noted that the slow and erratic trend of eroding system efficiency helped
    preserve the malware’s secret, as the malware was believed to have run for two
    years before its discovery. Other researchers have suggested that its belated
    discovery was retarded by the same secretive and hermetic approach to security-related
    issues that had made the enrichment technologies such an otherwise inaccessible
    target in the first place.”74


    Despite important and lingering ambiguities, Stuxnet has inspired some notable
    predictions about the future of struggle in the cyber domain. Keto identified
    “doctrinal quandaries” about making the malware, including issues of “tactical
    viability,” the potential of the technology to be adopted and repurposed by other
    entities, and “anxieties over the dangerous precedent that the operation would
    work.”75 Other experts predicted that a mere six months would elapse before copycat
    attacks were conducted by criminal groups eager to leverage sophisticated code.”76
    Credible accounts of such an occurrence with respect to this code had not appeared
    in ten years, although analogous allegations have been made regarding repurposed
    weaponization of other leaked software.'
