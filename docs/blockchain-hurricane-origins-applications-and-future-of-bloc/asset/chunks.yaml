    会计师和审计师对区块链持谨慎态度，这是因为存在原始分录挑战，我们在第 4 章中探讨过这一问题。区块链是基于密码学的可验证的交易真实性记录，而非绝对真理的记录。审计师对于在缺乏原始材料监督的情况下信任账本感到非常警惕，这就是为什么我的
    CPA 同事们在培训期间需要爬上脚架去检查储罐是否装满，而我作为制造业的管理会计师，则要手动清数数千个螺栓和螺丝钉来验证库存水平。审计信心衡量非常复杂，正如迈耶斯所说，区块链尚未完全适应这些标准。他认为认为，审计方法的标准化对行业构成了感知威胁。谨慎态度既保护了工作，也保护了咨询收入，而这些收入是基于对日益严苛的法规的解读。然而，鉴于近期四大审计机构在涉及重大商业丑闻时面临的批评，内部很可能会发生变化。监管机构可能会试图打破市场领导者的垄断，并恢复
    20 世纪 80 年代以前存在的咨询与审计公司之间的划分——当时普华华道（后来的 `PwC`）收购了管理咨询公司 Urwick Orr and Partners。


    当这种变化到来时，迈耶斯的同事将准备就绪。Auditchain 是 `DCARPE Alliance` 的创始成员，这是一个日益扩大的早期采用者网络，他们协作证明有一种更好的方法可以为实现实时财务报告的企业提供保证。去中心化持续审计与报告协议生态系统将审计的系统、控制和数据元素分配给较小的公司，从而产生了一个适当去中心化的审计师群体，而非单一公司。区块链记录了根据规范会计实践的《国际财务报告准则》由审计师提供的证明。这种方法的早期客户是那些已经在区块链和加密货币领域运营的企业，他们对新想法持开放态度，并需要为自己的业务提供坚实的财务背景。这是一个非常值得关注的领域，并代表了区块链为不断增长的问题提供合适解决方案真正机遇。


    ## 商业信用证


    尽管区块链在银行跨境结算中占据了一席之地，并在北方信托（Northern Trust）开创的私募股权管理中得到了应用，但其他金融服务也可以从不可篡改的记录、分布式验证和智能合约中受益。一个例子是现有的信用证系统，它降低了进出口的商业风险。


    与没有信任关系的人支付货款在面对面操作时很简单，但一旦交易不再是瞬时的，情况就会变得复杂。为此此，我们依赖于与中间人建立信任。在消费者层面，`eBay` 是一个中心化系统的良好例子，它帮助人们管理与付款后等待收货相关的风险。它让买家有信心向未知卖家发送资金，并设有了机制以在出现问题时进行退款。它通过通过评价系统让买家的意见透明化，并在违约时实施制裁来要求卖方负责，同时通过在交货前提示安全付款来最大限度地保护卖方。


    商业信用证，也称为单据信用证，是银行开具的保证，旨在向卖方保证在发货前资金充足的，并且在收到货物后将进行付款。然而，在商业规模上，该系统既复杂又昂贵。跨境货运的价值和货物跨越全球的时间是典型消费者购买的许多倍。供应商的承诺（特别是在按需制造或种植货物时）是重大的。买家也可能需要存现金供银行开具担保，导致营运资金被占用数周或数月。


    如果能够大规模实施可靠的解决方案，这是一个极待被颠覆的过程。`HSBC` 在 2019 年在 `Voltron` 平台上试点了基于区块链的信用证，其中包括一笔人民币计价的交易，耗时
    24 小时完成，而标准为十天^(9)。这是银行向商业模型迈出的重要一步，具有更低的成本和更快的处理速度，也是向更广泛的分布式推动的重要组成部分。


    ## 变化的社会


    区块链和其他新兴技术正在迅速改变我们社会的运作方式。对于大多数人来说，未来充满了令人兴奋的变化，但也有担心少数人无法跟上。即使在拥有普及机会的国家，仍有相当比例的人口不具备数字能力。在美国，2019
    年的报告显示 10% 的美国人没有上网；在英国，类似的研究显示近五分之一的英国人不使用互联网^(10)。在这两个国家，这包含了老年人，以及受教育程度和家庭收入较低的人群。我们已经看到在银行化经济中没有银行账户的公民处于劣势，但如果这一群体无法接入我们这个新世界的去中心化在线社区，他们将被遗留。变化的社会必须包含教育和支持以利用机遇。


    ## 回报创作者


    区块链最珍视的目标之一是收益的民主化。这可以追溯到《加密无政府宣言》^(11)，该宣言预见到“为任何可以转化为文字和图片的材料建立一个流动性市场”。区块链为生产者和创作者提供了金融包容性机制，而正在进行的商品溯源和供应链中的商品追溯工作使此类物品的来源变得透明。在第
    5 章中，我们还探讨了区块链（特别是非同质化标记）在音乐行业和供应链中的作用，以及在管理复杂的无国界版税系统方面取得进展的工作。


    确保实体生产者获得合理的报酬，在区块链出现很久就已经由公平贸易基金会（`Fair-Trade Foundation`）和全球类似的组织所倡导。区块链在这里的作用不是颠覆，而是提供一种帮助现有系统的工具。区块链可能帮助减少向生产者的信贷成本，并管理“最后一公里”的现金。确保付款到达正确的人手中，并最大限度地减少跨境结算中的损失，可能是加密货币的角色。公平贸易也意识到了区块链在信息去中心化和民主化方面的潜力^(12)。他们的希望是这“支持农民了解他们的作物经历的历程——可能帮助他们更好地管理客户关系和风险——并最终变得更有韧性”。


