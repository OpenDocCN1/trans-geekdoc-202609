    In West Virginia, the Secretary of State’s office identified that for active service
    personnel the existing postal and electronic ballot systems were not accessible.
    The state ran a pilot program enabling 150 overseas voters to participate in the
    November 2018 midterm election using the `Voatz` mobile blockchain application.
    The city of Denver also tested `Voatz` in its May 2019 municipal election for
    4,000 eligible active-duty military and overseas voters. In both cases election
    officials reported an increased turnout in the small sample. It is important to
    note that `Voatz` is a private company, not a government or academic-led initiative.
    The system is likely to be tallying votes rather than offering individual verifiability,
    but there has been criticism of a lack of independent scrutiny. Such reticence
    is unusual in the blockchain world, where the spirit of collaboration and open
    source development generally reflects the transparency of the technology. It does
    however demonstrate one of the challenges facing businesses working to advance
    applications of blockchain technology: protection of intellectual property.


    # Challenges for Blockchain Development


    This book is intended for business decision makers who want to understand the
    landscape of blockchain and cryptocurrency, not for the developers who are likely
    to be following this fast-moving world of software through online communities
    and collaborative projects. However, executives must be aware of the underlying
    implications for system design and security in any new development in order to
    ask the right questions of their technical delivery team.


    Automation of processes can be fraught with problems. One only has to look at
    the delays and complaints surrounding the launch of any public service software
    platform to realize the complexity and the iterative nature of automation. Changes
    to centralized systems of record can be managed by the data owners, but what about
    decentralized systems of ledger? When a process is automated and immutable, the
    `smart contract` that executes each transaction must be watertight from the outset.
    In `Chapter 2` we addressed the problems that can arise through errors in deploying
    smart contracts. Code that controls transactions on the blockchain must be subject
    to much more rigorous testing and auditing than centralized software. Day-to-day
    considerations including the management of intellectual property and the protection
    of data must also be taken into account when solving wicked business problems
    and delivering smart user tools.


    # Branding and Intellectual Property


    Who owns your website? The tangle of intellectual property, copyright, and open
    source materials that make up the average internet site is extraordinary. Taking
    a simple `WordPress` site, the code beneath `WordPress` is open source, with a
    large community of contributors and an open source license whose requirements
    must be considered when using or adapting the software. The icons and design of
    `WordPress` assets, such as the brand logo, belong to that company and there is
    likely to be a trademark registration in one or more countries. Your own logo
    may be similarly protected. The theme, which lies on top of the site and gives
    it its look and feel, could be an open source skin, or may have been designed
    by a third party who licenses its use to you, although they have no rights over
    your brand colors and logo. The words that you write for each page are likely
    to be your copyright. The images that you put on the page may be available on
    a creative commons license, or a paid license from an agency, or taken by you.
    If the picture is of an artwork, the copyright lies with the artist, not the photographer.
    So, who owns your website again? Where does the intellectual capital lie?


    Professor Tonya Evans, Associate Dean of Academic Affairs and Director of Blockchain
    Law Online Certificate Program at UNH School of Law, says that intellectual capital
    is the most important asset of a business, but likely the least understood. Enterprises
    must take account of copyright in words, images or code, patents and trademarks,
    and trade secrets, and balance the business value with the wider needs of the
    market and consumers. The `Cryptokitties` team, in developing the `Nifty` license
    described in `Chapter 5`, retained their clear ownership of the cartoon style
    of their cats, while granting the use of each unique kitty design to the relevant
    token holder. This maximizes the intellectual capital for the creators, who need
    something to show for their work, and takes a sensible approach to the habits
    of online appropriation of images.


    Open source collaboration in the development of blockchain is a major feature
    of the rapid innovation we have seen in the sector. Evans reminds us that there
    are always restrictions around an open source license. When code is adapted from
    open sources, there could be some intellectual capital to claim on those adaptations.
    However, as criticism of `Voatz` (aforementioned) has shown, holding your cards
    too close to your chest can backfire in public perception. Retaining trade secrets
    must add value to the business. If secrecy detracts from the perception of the
    enterprise, it could be more damaging.


    The other side of the coin is the value of blockchain to your brand. It is unsurprising
    that many businesses have sprung up with “blockchain” in their names, as this
    appears to differentiate them from the competition. It is equally unfortunate
    that a good proportion have not lived up to the hype. Now that the market is settling
    and hollow projects are falling away, it is time to leverage the good things about
    blockchain. Speaking at SXSW in Austin in March 2019, Shontavia Johnson, Associate
    Vice President for Academic Partnerships and Innovation at Clemson University,
    considered the features of blockchain that can be used to build a brand: customer
    trust, efficiency, and the ability to use apps to bring communities and influencers
    together around your brand. Leveraging a buzzword may give short-term gains but
    aligning your brand with the values and principles around the appropriate use
    of blockchain and backing it with action has long term value. Removing the jargon
    and demonstrating transparency, authenticity, credibility, community, and efficiency
    is a worthwhile business strategy.


    # Data Protection

