    北方信托（Northern Trust）的创新仍在持续。Stevens 及其团队将注意力转向私募股权业务中一些管理上的棘手问题，探讨区块链是否能为他们的某些特定挑战提供可行的解决方案。


    ### 经济实质条例（Economic Substance Regulations）


    第一项与针对在根西岛（Guernsey）注册的企业的新版经济实质条例有关。在位于法国离岸的英国王属殖民地注册，对某些金融机构具有诸多优势。经济实质条例于 2019
    年 1 月推出，旨在确保在该岛上运营基金的公司能够向当地监管机构证明，它们是根据当地规则管理基金的，提供了流程透明度，并确保企业在岛上注册的利润反映了“经济活动和实质性的经济存在”。这种对经济实质的证明还要求董事在对董事会和法定事项进行投票时，必须证明其身体位于该岛，以此作为业务在管辖范围内得到妥善指导和管理的证据。


    与 Mike Smith 教授在面对斯堪的纳维亚监管机构查询客户数据时采取的方法类似，北方信托开发了一个移动投票应用程序，并从董事设备中收集 GPS 数据，对位置和投票进行哈希处理和时间戳，以满足当地监管规则的要求。在非常常见的情况下，如果董事因休假或更有可能是因大雾导致机场关闭而确实无法到达该岛投票，则将使用航班预订和取消记录等意图证明来代替
    GPS 数据，以便在进行基金审查时提供所需的证明。


    ### 法律协议与智能合约


    团队随后注意力转向了管理私募股权基金的法律协议。不同基金的要求可能复杂，因为必须考虑伦理投资或个人信仰等方面的选择。围绕基金的法律协议必须确定在个人案例中适用的任何排除项。例如，一组投资者文件可能规定不投资酒精、军备或在特定国家注册的公司。这些必须被翻译成适当的法律术语，并在基金管理中执行。


    北方信托与科技初创公司 Avvoka 合作（该公司是 Allen and Overy 律师事务所内部一个加速器计划的一部分），开发了直接从数字法律协议将法律条款部署为智能合约的能力。`Avvoka`
    引擎持有法律协议的模板，该模板可以根据代表客户的律师事务所的偏好进行适当解析。排除要求通过从智能合约库中简单的拖拽来选择，并以律师要求的语言整合到法律协议中。这避免了将标准的排除措辞强加于复杂的文档，同时保留了智能合约的底层一致性。一旦批准并签署，协议将记录在链上，并直接从该文档生成智能合约。这种工作流通过转换流程并从开发人员的需求开始，避免了编码法律协议细节的挑战。


    用于排除目的智能合约开发正在进行中：随着条款变得越来越复杂，自动化必须随之而来。例如，对从酒精获利的的公司投资排除是否仅适用于饮料公司，还是适用于收入中仅小部分来自该行业的集团？还存在在智能合约整合到区块链后对其进行更改的问题，北方信托在该领域一直领先，并拥有多项解决该过程的专利。例如，重新任命审计师是数字董事会会议的一个议程，投票结果会自动触发相关智能合约的延长或更换，并根据需要更改任何权限。


    通过专注于特定细分领域的需求，这项工作成功证明了区块链可以成功应用于审计流程。我们将在 `第 7 章` 中更深入地探讨会计和审计更广泛领域的挑战。北方信托的工作还交付了在供应链管理中非常有价值的工具。


    ### 无信任经济中的协作


    区块链在关键方之间存在联系且需要提高效率、透明度和真实性的业务社区中正受到关注。它还在影响那些层级结构中同级双方之间没有信任关系，但所有人都向一个中心点提供相关输入的领域。他们可能不愿与同级的竞争对手共享信息，但必须向其上级保持透明。区块链技术在为机密数据存储库叠加加密层方面可以发挥作用，并允许只有拥有正确密钥的伙伴进行访问。


    医疗记录立即让人想到这一问题仍然存在的领域。电子健康记录传统上存储在提供者层面，导致不同数据库之间出现碎片化和不连续性。这在像美国这样的私人医疗系统中是如此（数据由一系列提供者单独持有），在像英国国家医疗服务体系（NHS）这样的公共系统中也是如此（数据在地理区域
    NHS 信托内部被孤立）。解决患者记录复杂性的最早试点之一是由 MIT 的 `MedRec` 项目团队于 2016 年在 Beth Israel Deaconess
    医学中心启动的。该白皮书提出的“使用区块链替代中心化中间环节的分布式访问和验证系统”。`MedRec` 系统具有将个人注册 ID 链接到系统（`Registrar
    Contract`）、将患者链接到他们使用过的每位提供者（`Patient Provider Contract`）以及为患者形成回溯路径（`Summary
    Contract`）的机制，该路径连接回他们的提供者，并作为允许他们随时访问或下载历史的备份。2016 年 `MedRec 1.0` 的概念验证是成功的，为了将系统扩展到原始试点范围之外并增加医疗记录的安全性，为
    `MedRec 2.0` 提出了一种新架构，该架构正在建设中。


    ### 案例研究：Gospel Tech


    医疗保健涉及数据的个人敏感性意味着 `MedRec` 项目的进展比某些类似原理的商业应用要慢。位于伦敦的 `Gospel Tech` 采取类似的方法为航空行业的客户解决了敏感数据共享和协作问题。他们解释了导致他们采用基于区块链解决方案的数据悖论：


    传统的基础设施意味着关键数据汇集在孤岛中，受到日益复杂的安全层保护，而当员工为了协作而绕过安全规程时，这些保护最终会退化。讽刺的是，这种对防止数据移动的关注使企业更容易受到泄露或失去数据的控制，同时也限制了数据对业务的真实价值。


