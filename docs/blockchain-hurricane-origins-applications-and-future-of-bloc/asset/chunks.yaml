    splitting payments into several separate amounts, disguising a genuine transaction
    in a list of decoys, and permissioned views. In effect, these coins replicate
    our day-to-day cash transactions: no transparent, public record can be interrogated
    to prove who passed a dollar bill to their friend.


    Stablecoins


    One of the greatest challenges for cryptocurrency is the volatility of Bitcoin,
    Ether, and their peers. Quite apart from bubbles such as 2017’s tenfold rise in
    value and 2018’s corresponding fall, the day-to-day fluctuations in cryptocurrency
    compared to large fiat currencies cause friction and challenges with adoption.
    While the crypto ecosystem is still small, there are too few transactions for
    value exchange (in other words, purchase of goods and services) compared to the
    volume of speculative trades, which drive dips and spikes in price. Even where
    there are flourishing areas of cryptocurrency use or popular applications, the
    exchange risk involved in moving back and forth to fiat is high. This friction
    at the edge is a substantial barrier to entry and tars perfectly sound distributed
    ledger applications with the brush of unpredictability.


    Enter the stablecoin. This is a specific class of cryptocurrency whose value is
    not driven by the vagaries of the emerging cryptocurrency market but by the movements
    of real-world assets. There are several advantages to stablecoins, reducing friction
    at the edge of the crypto ecosystem by acting as a form of value airlock. For
    investors in cryptocurrency they represent a lifebelt within the crypto world,
    a safe haven in the event of extreme volatility. For existing users of public
    blockchain applications, they are becoming a link to the real world: in California,
    for example, it is now possible to pay state taxes from cannabis-related businesses
    in stablecoin. Finally, applications which use a stablecoin as their core cryptocurrency
    remove a large part of the perceived risk for new adopters, enabling people to
    benefit from blockchain-enabled applications without worries over volatility and
    liquidity.


    The earliest and most widely adopted of a clutch of stablecoins, Tether is aligned
    to the value of the U.S. dollar and collateralized by its matching fiat currency
    reserves. Tether has suffered from bad press in the past, notably due to a lack
    of independent verification of its reserves. It also gained notoriety thanks to
    third party manipulative trading of Bitcoin to and from Tether, which may have
    artificially inflated the value of Bitcoin during the bull run of 2017.'
