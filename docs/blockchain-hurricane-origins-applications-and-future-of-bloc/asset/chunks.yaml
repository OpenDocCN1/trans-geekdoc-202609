- fmt: '

    Ethereum is not prone to as much infighting as Bitcoin, possibly because the developer
    community includes founder Vitalik Buterin rather than being distracted, as Bitcoin
    is, by speculation over the identity of Satoshi. This does not mean that contentious
    forks don’t happen, and the forking of the Ethereum blockchain to create a second
    currency, Ethereum Classic, came about following an attack on an application known
    as `The DAO`. This hack in June 2016 was the daddy of all smart contract disasters.


    In his original 2013 white paper, Vitalik Buterin noted in relation to smart contracts
    that, “[[the] logical extension … is decentralized autonomous organizations (DAOs)—long-term
    smart contracts that contain the assets and encode the bylaws of an entire organization.”
    In 2016, a team of developers launched `The DAO`, an investor-directed venture
    capital fund whose structure was a realization of Buterin’s original idea. Funds
    contributed by investors would be distributed automatically to ventures selected
    by the system and approved by consensus, and the returns would be shared among
    the members, with all the transactions governed by smart contracts and untouched
    by human (centralized) hand. A successful ICO was launched, and the team sat back
    and watched the money roll in from more than 18,000 investors. Sadly, there were
    underlying flaws in the smart contracts governing the approval of suitable ventures
    and the distribution of investment funds. A hacker succeeded in manipulating the
    contracts to send around $50 million of the funds, a third of the total, to themselves.
    The horrified DAO team could only watch as their own smart contract carefully
    executed immutable transactions in favor of the hacker and the money rolled straight
    back out again. They could do nothing to stop the code running, and the transactions
    were irreversible.


    In this case, the Ethereum community controversially reached a consensus to roll
    back the blockchain to a point before the ICO. Later entries on the Ethereum distributed
    ledger ceased to be valid, and the next transactions to be processed were recorded
    in a new block referencing as its previous neighbor a block prior to the hack.
    Not all of the community was comfortable with this action. It went against the
    principle of immutability to change anything that had gone before. The dissenting
    minority did not implement the fork and thereby created a second blockchain, Ethereum
    Classic: This chain still incorporates the DAO transactions.


    The whole DAO affair was the final straw for the U.S. Securities and Exchange
    Commission (SEC). Their report on the hack determined that the tokens offered
    for sale were securities under the Securities Act of 1933 and therefore should
    be regulated as such. This started the process for development of strict regulation
    for the conduct of ICOs and the protection of investors, and arguably slowed down
    blockchain innovation in the United States as entrepreneurs sought more sympathetic
    jurisdictions for ICO fundraising.


    ## Challenges of Expanding to Enterprise


    The underlying technology of blockchain caught the attention of enterprise very
    quickly, and it became clear that there was potential to use distributed ledger
    technology to good effect in multiple industry sectors. However, the volatility
    of cryptocurrencies, the public nature of the existing blockchains, and the SEC
    movement toward securities regulation after `The DAO` was not an ideal environment
    for the development of commercially sensitive technology. Enterprises needed some
    way to harness blockchain. The rewards to be reaped from a trustless commercial
    network, for instance in the context of a supply chain, could be to reduce the
    administrative burden of repeated checks as raw materials move through iterations
    of processing, or products pass through borders, or to provide verifiable proof
    of compliance with regulation through an immutable record. This functionality
    could be achieved with an application built on top of Ethereum, but the transparency
    that characterizes blockchain is not something always welcomed by businesses.
    How could a network of mutually suspicious organizations keep their distributed
    ledger out of the public domain and thereby protect commercially sensitive information?


    ## Permissioned Blockchains


    To solve the problems of privacy and verification, a variant of distributed ledger
    technology has emerged: the permissioned blockchain. These are intended to replicate
    all the benefits of blockchain as a transparent, immutable record, but eliminate
    the anonymity of users and open viewing of transactions and smart contracts, which
    are features of public blockchains. A permissioned blockchain restricts participation
    to those parties who have the credentials to access the data on the ledger. These
    permissions may even be granular within the platform, allowing some parties to
    submit transactions, and others to view a limited part of the whole record on
    a need-to-know basis. Many of the case studies later in this book involved permissioned
    systems.


    It is possible to create a private Ethereum blockchain. These are most often used
    as a testing environment for applications that will eventually move into the public
    arena, but there are some notable private Ethereum innovations running at scale.
    These include the World Food Programme’s Building Blocks project, which uses a
    version of Ethereum developed by Parity Technologies.


    ## The Hyperledger Project


    Work on permissioned frameworks has been pushed forward by the Hyperledger Project.
    This started out as a collaboration between the Linux Foundation’s open source
    community and commercial giants including IBM, Hitachi, Intel, Soramitsu, and
    Huawei, and in 2019 Microsoft, Salesforce, and Consensys joined the consortium.
    Hyperledger’s growing suite of open source tools includes several frameworks with
    specific use cases and a number of auxiliary software modules. Frameworks released
    to date include: Iroha (with Hitachi) for infrastructure projects; Sawtooth Lake
    (with Intel) for supply chain and provenance, particularly using sensors as a
    source of prime entry; Fabric (the foundation of the IBM Blockchain platform)
    for supply chain featuring channels for private and commercially sensitive transactions;
    and Indy (with Sovrin Foundation), purpose-built for distributed identity.


    ## Distributed Ledger Frameworks


    The requirements of specific industries have given rise to several distributed
    ledger frameworks, which have diverged from the traditional blockchain structure.
    These include the `R3 Corda` framework, which is commonly adopted in financial
    services. Here we could also include `IOTA`’s Tangle`, which is designed to handle
    the ever-widening landscape of the Internet of Things and specialist cross-border
    payment systems such as `Ripple` and `Stellar Lumens`, although these differ from
    other permissioned systems in that they make use of a native cryptocurrency.


    The large `R3 Corda` consortium includes banks from across the world and has developed
    a number of private, notarized frameworks in-house and with partners for applications
    including interbank settlements, trade finance, letters of credit, and securities.
    `Corda`’s structure is interesting as it requires a centralized notary function
    as the glue that holds together the decentralized community of participating enterprises.
    This role is examined in more detail in the Insurwave case study in Chapter 4.


    ## Reaching Consensus Without Coins

