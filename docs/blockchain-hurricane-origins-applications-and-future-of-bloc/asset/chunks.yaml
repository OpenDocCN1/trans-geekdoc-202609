    数据泄露丑闻、个人信息滥用以及日益复杂的监管，使得这一议题成为个人、企业、监管机构和政府关注的焦点。数据的安全管理关乎每一个人，随着区块链技术的普及，各方都面临着需要应对的机遇与威胁。机遇广泛存在于零知识证明领域、多个不相关方之间的透明度以及流程效率上。它为个人提供了去中心化数据并掌握自己个人信息所有权的方法，同时也是中心化组织实施“设计安全”策略的有用工具。相应的威胁则体现在瞬息万变的监管环境中，以及开发者自身在部署准确代码和构建知识产权方面需要极度谨慎。区块链（不同于加密货币和代币，后者的监管环境已在第
    3 章中讨论过）在监管背景下需要审慎考虑。对于开发者和创新者来说，面临着巨大的挑战，他们必须穿越多个州不同隐私法律的“雷区”，同时管理自身的商业利益和知识产权。


    本章探讨了通往拥有数据的历程、区块链在政府领域的应用，以及任何采用分布式账技术的组织所面临的法律考量。


    ## 重视你的数据


    我们已经习惯了将个人生活信息以数字化方式且往往是公开存储。邮政编码查询器、电话簿和选民名单是互联网上首批公共数据库。这些包含的信息与我们曾经在当地图书馆通过微胶片和纸质检索的信息大相相同，但它们面向庞大的新受众，而这些用户使用数据的动机可能并不单纯。随着隐私意识的增强，这些列表从公众视线中消失了。社交媒体在
    21 世纪 0 年代初迅速发展，我们开始自愿分享数据，发布从婴儿 B 超到假期计划的一切内容供朋友和家人看。在线服务的兴起和物联网（IoT）连接设备的增加引发了第三波无意识的数据共享。正如
    Avast 安全大使、前世界国际象棋冠军加里·卡斯帕罗夫（Garry Kasparov）所说：“苏联有间谍设备：现在我们只需要付钱给亚马逊来交付我们的数据。”


    ## 隐私与监视


    我们生活在一个个人隐私与从服务中获得的实用性相权衡的世界。我们被建议在数据共享上做出意识到的决定，但如果我们想获取基本服务，有时是否共享数据的选择就成了学术问题（无实际意义）。更复杂的是，根据艾兰·韦斯汀（Alan
    Westin）在其 1967 年的著作《隐私与自由》（`Privacy and Freedom`）中的定义，个人对隐私的四个不同元素的忍度不同：`孤独、匿名、含蓄和亲密`。这些行为在社交媒体上随处可见，一些用户分享他们生活的每一个细节，不在乎或不知道这样做可能面临的风险。其他人则更加谨慎，小心分享，并且更加渴望绝对的匿名，躲在假名后面，并根据参与所需的详细程度选择平台。隐私与监视之间也存在着历史性的且有据可查的冲突。爱华·斯诺登（Edward
    Snowden）于 2013 年举报美国国家安全局（NSA）监视计划以及`PRISM`和`Upstream`计划，其影响是深远的，损害了涉及隐私的跨大关系，并将安全机构的活动推向了风口浪尖。另一方面，据报道，英国的`GCHQ`在
    2018 年每周拦截了约 2000 个恶意域名^(1)，其对互联网活动的监视有助于减少恐怖主义威胁和犯罪团体的活动。我们不能兼得。。作为一个社会成员，我们有责任保护弱势群体，即使是以牺牲绝对隐私为代价。


    为什么这个问题会变得如此复杂？1999 年，大卫·布林（David Brin）在他的著作《透明社会》（`The Transparent Society`）中应对这一日益增长的问题并提出了一个解决方案，^(2)，这与随后分布式账本的发展产生了共鸣。他解释说，在我们集体沉浸于万事数字化之前，交易依赖于个人信任和社区透明度。你知道村庄、城镇或市场区域中谁是可靠的人，并相应地调整你的隐私设置。同样，不实行为在声誉和特权方面付出了代价。随着交易范围扩大到区域和国家社区以及未知参与者，加密形式的秘密取代了自然的信任秩序。然而，盲目依赖数据收集者使用的加密是危险的。由于创新的黑客攻击、社会工程和网络钓鱼，破解我们数据的安全层变得越来越容易，而且在许多情况下，人为错误或完全的疏忽导致了数据在没有应用适当加密的情况下被收集和存储——令人担忧的是，根本没有任何加密。随着我们的信息价值超过了成本，数据盗窃是一个日益增长的问题，尽管立法者在抑制不必要的数据获取和商业化方面付出了努力。随着存储数据的增长，我们必须寻找保护解决方案。比特币、区块链以及对安全和监管的讨论所提出的，是对在线透明度和信任的重构。


    ## 数字身份


    根据许多观察者的观点，数字身份是技术的圣杯`ID2020`联盟进一步指出，这应该符合可移植性、持久性、隐私和用户控制的核心原则。开发可靠数字身份的工作在区块链出现很久就已经进行了，但分布式账本为其中增加了去中心化的认证层。爱沙尼亚政府是第一个使用加密和分布式记录保护所有公民信息的政府。2003
    年，密码学家阿托·布尔达（Ahto Buldas）和马特·萨雷佩（Märt Saarepera）开发了数字身份的形式的安全证明^(3)，并与迈克·高尔（Mike
    Gault）和伊藤直一（Joichi Ito）一起，在 2007 年“电子爱沙尼亚”计划正式开始时创立了`Guardtime`公司。研究人员的目标是消除管理身份时对信任第三方的需求，他们发现了一种与中本聪明的比特币白皮书中相同的通过数字签名、哈希和时间戳进行加密验证的系统。方法上的相似性，以及布尔达、萨雷佩和高尔工作在时间上的看似巧合，导致人们推测这群开发者可能是匿名的中本聪明的真实身份的候选人，但他们并未引起关注，高尔在被问及时否认了参与。Guardtime
    已成为区块链创新的跨国领导者，并参与了第 4 章中讨论的`Insurwave`开发。从数字身份开始，爱沙尼亚政府和 Guardtime 转向了医疗、居住、税务、投票和治理的数字化管理，在适当的地方引入了区块链技术。


    '
- fmt: '

    The United Nations is not far behind Estonia in its work toward the identity aspect
    of its Sustainable Development goals, to “provide legal identity to all, including
    birth registration, by `2030`.” They formed the `ID2020 Alliance` in partnership
    with some of the largest digital providers on the planet including `Microsoft`,
    `Accenture`, `Cisco`, and others. `ID2020` aims to provide digital identities
    for some of the 1.1 billion unregistered people in the world using biometrics
    and blockchain, and is an extension of the existing biometric identity management
    system developed by `Accenture` and used by the UN High Commissioner for Refugees.
    In 2018, pilot projects were run in Thailand in collaboration with the International
    Rescue Committee (IRC) for refugees accessing health care and building records
    of their education and professional skills, and in Indonesia with the National
    Team for the Acceleration of Poverty Reduction to improve access to energy subsidies
    for economically disadvantaged individuals.


    In a separate initiative the `World Food Programme` implemented a private blockchain
    to overcome two administrative headaches in an existing food aid distribution
    system in a Jordanian refugee camp. Their goal was to protect the full identity
    of refugees by making this data a step removed from day-to-day authentication
    processes, and to streamline the complex administration of the retailer accounts
    and refugee aid allowances. They succeeded in protecting the details of 100,000
    refugees by enabling iris scans as their means of identity and holding only that
    metadata on chain. As a bonus, the proof of concept implementation saved `$40,000`
    a month in bank transaction fees, administration costs and the prevention of fraud.


    Of course, identity is a concern for enterprise as well as government: in financial
    services, the need to Know Your Customer (`KYC`) is moving toward authentication
    from immutable, trusted records. In July `2019`, a number of banks in the United
    Arab Emirates formed a blockchain KYC consortium for corporate identities and
    in France in `2018` a pilot project run by 26 firms and five banks demonstrated
    that repetitive, duplicative KYC processes could be streamlined through access
    to a common blockchain for authentication. If this nut can be cracked, `KYC` is
    the use case that will drive the adoption of digital identity in our comfortable
    first world.


    # Protecting Ourselves


    Beyond identity verification, blockchain is a tool that can be and is being used
    to record, verify, and keep safe many other aspects of personal data. We can construct
    an audit trail of the essentials in our daily lives through the simple mechanism
    of timestamping, rendering the details we choose to record both verifiable and
    unquestionable when it matters. Just because we can, however, doesn’t always mean
    that we should. We have gotten ourselves into enough trouble recording our lives
    on social media, so what benefit is there to having some of that information available
    for all time?


    The answer, of course, is that if a problem arises which appears unsurmountable,
    it’s worth looking at blockchain as part of a range of available emerging technologies
    to see where the right solution lies. Several entrepreneurs are working on solving
    very specific problems around the verification of personal data.


    Anne Ahola Ward watched the surge in blockchain projects which focused on tools
    for the blockchain itself, solutions where there were no real problems, and lofty
    ideas that failed to deliver the nuanced detail promised in long white papers.
    Very little that she saw emerging was designed to help people or had been made
    easily accessible for mainstream users. The lightbulb moment for Ward, in the
    aftermath of family tragedy, was realizing that there is a point where it actually
    makes sense for your assets to be digital and owned: upon death.


    Most people of Anne’s and my generation have dealt with the estates of family
    members. There are challenges on all sides. Disputes arise over the most trivial
    of assets and the will of the deceased may be out of date by decades. Where there
    are active social media accounts there is no consistency of approach. On some
    platforms including `Facebook`, the option exists to memorialize a loved one’s
    profile, but others hang in the ether, subject to the vagaries of changing terms
    and conditions, or may be lost permanently when a service shuts down. One of the
    most simple but overwhelming losses is the wealth of oral history which passes
    down the generations. Ward’s vision is to use blockchain to protect a timestamped
    legacy, and the `Veritoken Legacy Locket`, launched in June `2019`, starts with
    the upload of pictures, quotes, and memories, and is designed to record personal
    data choices and preferences. The new role of technical executor is a response
    to the new needs of those who remain. In the long term, keeping a legal will up
    to date may fall to the blockchain rather than to will attorneys. “We’re not going
    to live forever,” says Ward, “but our information can, so we should have power
    over that.”


    Another initiative focusing on a specific life challenge is the `Loly` dating
    app. Speaking to founder `Adryenn Ashley`, this app written by women, for women,
    addresses a number of problems that have not been solved by other platforms and
    for which blockchain offers a solution. It introduces trusted user identities
    supported by a mechanism for building reputation through community verification
    and reports of good dating behavior. It meets the need for clear recorded consent
    or refusal during dates that can be authenticated after the fact. Ashley also
    reports that the roadmap includes a safe word for activating emergency calling
    and recording functions.


    The blockchain layer in these applications is not obvious to users, which is important
    for adoption of such tools on their merits, not for their technology. We may be
    moving to a world where we can own our data and manage our privacy and our identity,
    but the experience must be seamless and the technology usable by all.


    # Governing and Governance


    Government and blockchain has been described as a match made in heaven. The gradual
    digitization of our public services has steadily transformed our lives and, despite
    the challenges of deploying complex software at scale, the process has been relatively
    painless for most people. Blockchain has emerged as one of several useful tools
    in the work to streamline public services, manage registries, and protect identity.
    In Estonia, the use of cryptography in digital identity predates Satoshi by several
    years, and the introduction of distributed ledgers has been a natural evolution.
    In Wyoming, legislators were quick to recognize the potential of the technology
    and the need for good practice around it. They have started to build blockchain
    solutions into several areas of government and business and also drafted and passed
    a series of bills that have been adopted by other states. In the United Arab Emirates,
    Dubai has incorporated blockchain into its long-term Smart Dubai project, aiming
    for a paperless administration. Let’s look in more detail at the work underway
    in regulating for blockchain, managing registries, managing cities and citizens,
    and securing the democratic process.


    Wyoming: the Blockchain State

