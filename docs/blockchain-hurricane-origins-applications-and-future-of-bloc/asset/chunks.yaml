    碰杯碰撞的声音穿透了房间里朋友和新相识交谈的嘈杂声。服务生流畅地穿过人群，为聚集在一起的宾客端上寿司托盘。看着提供的各种寿司饭团，一位女子拿起手机扫描了托盘上的条形码。几秒钟内，App
    向她展示了这款寿司中金枪鱼是从哪里捕捞的，并确认了其具有可持续且受监管的来源。她笑了，拿起一块放进嘴里。“真好吃。”


    是事实还是虚构？在 2018 年 11 月于纽约举行的 ConsenSys Ethereal 会议上，为客人提供的寿司金枪鱼来源是通过以太坊应用程序进行验证的。金枪鱼场景是一个被经常引用的案例，说明了分布式供应链账本如何提供超越传统技术所实现的价值。在完全实现的未来，通过不可篡改的独立来源进行独立验证的透明记录将赋予监管机构信心。来自不断扩大的物联网中传感器的原始录入将减少人为错误，并降低故意伪造记录的风险，确保原材料源自受监管的来源，并且货物在正确的条件下运输。哈希身份和资质记录将允许对每个阶段的人员当前的许可进行安全可靠的验证。这是一个关于区块链未来价值的迷人愿景，而其基石现在已经到位。


    ## 分布式账本的业务采用


    数字货币实现的历程并非在真空中发生。软件工具、流程自动化和万维网的演变，以及在开发强密码学和使其脱离控制方面的进步，对业务产生了巨大影响。加密货币出现之前就有了点对点网络，企业一直必须处理相互怀疑的群体，并维护商业敏感和个人隐私信息的安全性，但区块链增加了一个新的维度。比特币白皮书的发布不仅启发了加密货币狂热者，还启发了那些认为底层结构是解决其某些业务问题解决方案的创新者。


    迈克·史密（Mike Smith）教授就是这样的创新者之一。在我们的广泛讨论中，史密斯告诉我，在 2011 年阅读白皮书后，他发现这个概念与他产生了共鸣。他曾短暂尝试过挖矿，并幸运地避开了
    2014 年 Mt Gox 加密交易所的崩溃，但一个业务挑战让他看清了区块链的真实价值。一家斯堪的纳维的数据保护机构向他的一个客户提出了一份非正式投诉，称该业务收集的心理健康评估数据在收集后被更改了。事实并非如此，尽管数据平滑在多个行业中是常见做法。平滑处理用于揭示可能存在噪声或充满极端值的数据集中的趋势和关键指标。然而，史密斯的重点始终在于以原始形式保留原始数据，既为了其基础完整性，也为了信息的未来可用性。


    挑战在于向投诉者证明数据是完全按照收集时存储的。史密斯已经测试了 256 位哈希可以从任何数据生成唯一字符串的原理，因此他从合并单日内收集的所有带时间戳的数据集并生成哈希值开始。第二天数据的哈希随后与前一天的字符串进行递归哈希处理，使每一天在链中具有位置完整性：一个带时间戳的区块链。最后，哈希值被广播在三个不同的网站上，因为“数据的多次传输能让人保持诚实”。监管机构能够证实数据未被更改，投诉也被悄悄搁置了。


    这种简单的应用反映在区块链最成功的用法中：它是以最合适的方式解决问题的极佳范。分布式账本技术声誉面临的最大威胁，是企业默认将区块链视为万灵药，操纵解决方案以适应自己的需求，并在过程中忽视了原始问题。


    ## 你真的需要区块链吗？


    那句保证让负责任的软件开发者内心陷入绝望的口号是“我们需要区块链”。当一个组织看到问题从地平线向它走来时，直觉反应往往是寻求最新技术作为解决方案。一个经典的例子是英国政府时任财政大臣菲利普·汉德（Philip
    Hammond）在 2018 年 10 月关于英国建议退出欧盟（脱欧）长期谈判期间的反应。面对在爱尔兰岛上确保英国和欧盟之间建立无摩擦陆地边界这一几乎不可逾越的挑战，他抓住新兴技术这根救命稻草，作为维持现有移动自由并避免在历史上困难的地点实施边境控制的方法。“技术正在出现，”他说，“我不称自己是这方面的专家，但显而易见的技术是区块链。”他在认为“新问题必须由新技术解决”这一错误假设上并不孤单。区块链作为广泛潜在解决方案工具包中有效选项的声誉，一直受到对其本质和局限性根本性误解的影响。


    City Web Consultants 是一家软件开发公司，拥有部署各种传统和新兴技术以满足客户需求的经验。创始人亚当·克莱里（Adam Clarey）多年来目睹了一系列新概念和想法从过度炒作的兴奋到承诺未实现时的幻灭。偶尔，会有只想着在不给自己带来多大风险的情况下赚取“魔法币”的人找上门。有些提议没有任何可言的业务模式，驱动力仅仅是使用这项技术并在没有问题需要解决的地方呈现“解决方案”。另一些则具有真正的业务主张，但它们只是追逐了一个热词，而不是通过识别交付所需最合适技术的逻辑过程。区块链不太可能是解决方案：在大多数情况下，真正的挑战更清楚地定义客户的流程。克莱里对炒作通常持怀疑态度。“我还没有遇到任何真正受益于区块链优于任何传统技术的现实项目，”他说。


    席卷区块链的兴奋与当代技术不同，很大程度上源于 ICO 热潮中的融资机会。克莱里反思了那个时期的疯狂：


    ```

    在 2017 年的期间，大量的蠢钱被注入区块链/加密项目，导致人们的贪婪战胜了理智。那些“投资者”忽视了这些项目内部基本的业务模型和/或底层技术，因为[ICO]被视为一种获得巨额回报的方式……我数不清听过多少次“区块链将是下一个互联网”。蠢兔子。自从泡沫破裂人们遭受了损失后，投资者和企业现在变得更加谨慎和具有批判性。只有在技术可能存在真实用例的地方，资金才会流动。

    ```


