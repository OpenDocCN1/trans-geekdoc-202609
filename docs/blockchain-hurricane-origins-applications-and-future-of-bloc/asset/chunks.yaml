- fmt: '

    The Paxos protocol has been the foundation of much of the development of consensus
    mechanisms, but the landscape is diverging and evolving. Hyperledger and Intel’s
    Sawtooth Lake framework uses `Proof of Elapsed Time (PoET)`. This is a lottery
    consensus where the network pings the Intel chips in every active node to see
    which has the shortest wait time for processing (stochastic selection). This node
    is elected the leader and creates the next block in the chain. Other Hyperledger
    frameworks have turned to voting, for example, `Yet Another Consensus (YAC)`,
    ordering services such as `Kafka`, or to a `Simplified Byzantine Fault Tolerance
    (SBFT)` model thanks to the fact that in a private distributed ledger the peers
    are all known. The `Raft` consensus mechanism, rolled out to Hyperledger users
    in 2019, was developed in an effort to produce an understandable consensus mechanism,
    separating the key elements of consensus and providing a good foundation for system
    building and education.


    As more public and private blockchains are developed, adoption increases, and
    understanding of cryptography improves further we can expect to see more specialized
    consensus mechanisms and common standards emerging.


    The explosion of cryptocurrency and the development of blockchain applications
    excited entrepreneurs and put regulators on high alert. Let’s see how this complex
    relationship plays out in Chapter 3.


    # CHAPTER 3


    ## Magic Internet Money


    Money doesn’t grow on trees, but the `Initial Coin Offering (ICO)` crowdfunding
    method inspired by J.R. Willett resulted in cryptocurrencies sprouting everywhere.
    This new way of raising money attracted attention from well-intentioned entrepreneurs
    and snake oil salesmen alike. Here was a pot of unregulated, magic money created
    from thin air by the issuance of tokens native to the application, some floating
    on top of `Ethereum` and others generated in completely new blockchains. A growing
    interest in cryptocurrency from the wider community meant that crowdfunding in
    this way for blockchain projects caught the imagination of people with money to
    spend in pursuit of the next big tech success.


    Some of these projects have been genuinely innovative, based on good business
    sense and responding to a real-world problem by proposing an appropriate solution.
    Certain among them knuckled down to developing the technology stacks that would
    enable use of distributed ledger in the long term, putting in place the protocols
    and tools for future development. Others went straight for consumer adoption with
    varying degrees of success. Notable early ICOs that continue to deliver on their
    original vision included `Ethereum`, `IOTA`, `NXT`, and `Augur`. Three of these
    deal with the infrastructure that is needed for wider use and easy adoption of
    blockchain: `Ethereum` with its smart contracts and `Virtual Machine`, `IOTA`
    with its evolving cryptography and scalable Internet of Things transactions through
    the `Tangle` verification mechanism, and `NXT` publishing an open-source blockchain
    for financial and public services, using `Proof of Stake` consensus. The `Augur`
    project is user-facing: a peer-to-peer oracle and prediction market protocol where
    users are financially rewarded for correctly forecasting the outcomes of future
    events.


    Some excellent concepts and innovations have emerged around blockchain’s new way
    of solving old problems. As venture capitalists Alyse Killeen, Gil Beyda, and
    Jimmy Song explained at Austin’s SXSW festival in March 2019, people are revisiting
    business models that did not work on earlier technology, and as long as the problem
    to be solved is clear before jumping into developing a solution (a common trap
    in software) there are serious propositions that are attracting traditional support
    from reputable investors alongside ICO funding.


    ## Gold Rush Scams and Broken Business


    Unfortunately, most projects that proliferated at the early stage were not such
    good business prospects. Research by `Statis Group` determined that almost 80
    percent of the ICOs launched in 2017 were scams, according to findings based primarily
    on projects failing and founders disappearing once funds were raised. Poor quality
    white papers behind glossy websites, and fraudulent claims of association with
    high-profile advisors, drew in the unwary in search of a quick buck. The wider
    market homed in on blockchain startups with an unerring instinct for shaky high
    potential ideas, and investors looking for a chance to get rich quick jumped in.
    Reassuringly, it seems that the Pareto principle applies to investment in ICOs
    as it does in so many areas of business. `Statis` noted that “over 70 percent
    of ICO funding (by $ volume) to-date went to higher quality projects.” The discerning
    investor triumphs, but there have been casualties along the way. Not everyone
    subscribes to the adage that if it looks too good to be true, it probably is,
    and legislation to protect the unwary has been running to keep up. The new gold
    rush gave Bitcoin and blockchain a bad name. The question is, did cryptocurrency
    break the system, or was the system broken before?


    According to journalist and author Dan Lyons, there are some dubious practices
    that have their roots far back in management science. His 2018 book `Lab Rats`
    tells a century-long tale of organizational priorities shifting from the benefit
    of workers to the benefit of shareholders, normally the founders and principal
    funding providers. Companies became more focused on delivering returns to their
    investors, and pressure to perform meant that these returns were not necessarily
    related to profitable and sustainable business models. Pension funds were raided
    to prop up share prices in long-established enterprises. Disruption of the workplace,
    sacrificing long-term employment for the sake of short-term productivity, increased
    staff turnover. We are now moving inexorably toward what is positively described
    as the “gig economy,” a benefit for shareholders but not for those workers whose
    income is gradually being eroded and employment rights compromised. In the end,
    says Lyons, many investors in Silicon Valley and beyond settled on a profitable
    business model of “grow fast, lose money, go public, cash out,” taking quick returns
    at exit and jumping the traditional, messy, long-winded stage of building a working,
    profitable business. Speaking to Lyons, he points out that this has all the hallmarks
    of a classic Ponzi scheme, with public investors paying out the early round shareholders
    and more often than not watching the share price decline thereafter.


    If investors rewarded loss-making enterprises by putting up several rounds of
    funding in the search for the next Facebook, how did this change the behavior
    of entrepreneurs? An expectation grew that a good idea was enough to justify financial
    support. The system was already broken: throwing cryptocurrency into the mix made
    a lethal cocktail.


    ## When Lambo, When Moon?

