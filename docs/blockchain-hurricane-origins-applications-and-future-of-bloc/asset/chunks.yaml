    同样重要的是，对于哪些应用适用于区块链要有明智的判断。如果一个系统使用中心化数据库运行得非常完美，如果不需要第三方来验证记录，如果只有一个组织在向数据库写入数据，那么没有理由为了用新技术而跳到新技术上。企业必须有效且合伦理地使用新兴技术，无论这涉及人工智能、智能设备、自动驾驶车辆还是区块链应用的开发。在许多节点上加载本可以易地存储在单个节点上的数据是对资源的浪费，而且能从中获得的益处也微乎其微。正如我们在第
    4 章中所看到的，区块链在在解决问题时才是有效的。如果没有问题需要解决，那么仅仅因为“你可以这样做”就将解决方案强行塞进运行良好的业务模型中，是没有任何价值的。然而，区块链具有改变生活的潜力。世界经济论坛^(6)
    估计，这项技术可以为欠发达国家和小型企业刺激数万亿美元的贸易额。正在为改进区块链和加密货币的可持续性所做的工作，对于确保这些利益不以加速气候变化为代价至关重要。


    虽然比特币将始终保留其`工作量证明`Proof of Work）共识机制，但有大量工作正在进行，旨在为这种优雅、有效但耗能的共识机制寻找行为上健全且能拜占庭错误的替代方案。在第
    2 章中，我们详细研究了不同的共识机制，并确定通过采用`权益`Stake）和`权威`Authority）机制来降低区块链的能量消耗，可能需要对相关加密货币独立于中心权威进行永久性的权衡。这是一个不断演变的领域，对于一个开放、中立、无边界、去中心化的加密货币来说，最优的节能共识机制可能还需要几年时间才能实现。


    ## 对区块链完整性的威胁


    ### 不可变性的副作用


    你是否习惯你的数据被永久性且不可更改地记录？我们这些出生在 1980 年以前的人已经松了一口气，因为我们的青少年时代和青年时期不是在社交媒体上度过的。我们年轻时的错误不仅可能是公开的，而且不可磨灭，这种想法是令人担忧的。我们回到了第
    6 章中讨论的隐私概念：虽然寻求匿名性或更大自由的人可能习惯基于区块链的社交网络，但这对于大多数人来说是不正确的。此外，法律规定（如欧洲的《通用数据保护条例》和“被遗忘权”）要求数据被仔细收集、安全存储并在请求时被删除。


    还存在着非常真实的存档挑战。随着每个区块被添加到链中，维护这些日益庞大的分布式账本所需的数据存储量将不断增长。你会在哪一点，或者你是否可以关闭链的末端？我们被要求保留长达七年的税务记录，但一份雇主责任的保险证书必须持有几十年。从设计开始的长期资本项目的细节需要在其整个使用寿命内以及退役时进行验证，但我们现有的某些基础设施已经有数百年的历史了。在这项新技术的黎明中，人们急于将一切都置于区块链上：请考虑未来并明智地选择你的不可变记录。


    ### 渐进式中心化


    加密货币的创始原则是去中心化：一个完美的点对点交易和随机验证系统。比特币仍然遵循这一愿景，以太坊在创始团队放开缰子后也迅速变得去中心化，但其他领先的加密货币可以说远没有那么传统，且更加中心化。专门的区块链，如拥有
    21 个验证节点的`EOS`，或大多数代币仍由中心化持有的`Ripple XRP`，都是在中心化边缘游荡的模型。从发布`Libra`白皮书开始，所谓“公司加密货币（corpocurrency）”的兴起是另一个担忧来源。根据该白皮书，^(7)，“Libra
    协会的一个重要目标随着时间的推移增加去中心化程度。”它表明这种将在启动后“五年内”开始，但并没有清晰的去中心化过程机制。


    在区块链中，企业也倾向于选择许可链和私有链，将他们的商业底牌紧握在手中。`Hyperledger`项目、`IBM blockchain`、`R3 Corda`以及金融后台专门的`Ripple`和`Stellar`系统的框架都是为一组已知的参与者设计的。很可能是，随着其社区的增长，这些系统将变得越来越开放、去中心化化，目前正在识别无需加密货币的验证机制，但前景阴云密布。


    随着区块链的增长，我们如何管理追溯到 5 年、10 年、20 年或 50 年前源头的区块区块链？我们的区块链结构永久保留哈希数据。在身份记录方面，我们可能在一个世纪后仍需要访问以验证信息，更不用说长生命周期项目、环境数据、版权证明和其他应用的需求。截断链将是一个任意的过程，几乎肯定会给用户带来不便，并可能使整个链暴露于攻击，因为它损害了系统的完整性。坏心者完全可以传输链历史的虚假版本，而验证者将一无所知。


    如果我们接受截断不是一个可行方案，那么我们该如何减少对所有产生数据所需的存储容量呢？估计显示，在未来五年内，地球上七十人中有一半的人将在区块链上至少存储一条记录。这个问题不会消失的。


    目前提出的解决方案之一是创建不同类型的节点。目前，所有区块链都有可以执行交易的节点和参与验证及区块创建过程的全节点。建议是创建`微节点`（mini-nodes），设计用于持有最后几千个（或更多）区块，并定期与全节点持有的全链进行检查。这种观点类似于传统的公司审计流程：只要数据结构、系统和任何控制功能运行正常，数据就可以追溯到创世区块。这与截断不同，因为整个链始终可用，而虚假历史攻击的风险通过与原始链的定期检查得到了缓解。但是——总有一个“但是”——随着链的增长，能够托管完整记录的节点数量减少，存在数据集中在少数几个微节点完全依赖的全节点手中的风险。


    ## 量子威胁？


    区块链记录的持续扩张和中心化运营数字货币的兴起将影响加密无政府主义的去中心化理想。然而，在公众认知中，它并不是一个显见的威胁，不像区块上的最新热词：`量子`。


    量子，宝贝！


