    The clink of glasses cuts through the cacophony of friends and new acquaintances
    chattering around the room. Waiters move smoothly through the crowd offering trays
    of sushi to the assembled guests. Looking at the selection of rice parcels on
    offer, a woman picks up her phone and scans a barcode on the tray. Within seconds,
    the app shows her where the tuna on this sushi has been fished, and confirms its
    sustainable, regulated source. She smiles, picks up a piece and pops in in her
    mouth. “Delicious.”


    Fact or fiction? At the ConsenSys Ethereal conference in New York in November
    2018, the provenance of the tuna on the sushi served for guests was authenticated
    through an Ethereum application. The tuna scenario is a commonly cited exemplar
    of how a distributed supply chain ledger can deliver value over and above that
    already achieved with traditional technology. In the fully realized future, transparent
    records which can be independently authenticated via an immutable, independent
    source will give regulators confidence. Prime entry from sensors in the widening
    Internet of Things will mitigate human error and reduce the risk of deliberate
    falsification of records, ensuring that raw materials originate from a regulated
    source and that goods are transported under the right conditions. Hashed identity
    and qualification records will allow secure and reliable verification of current
    permits for people at every stage. It is a compelling vision of the future value
    of blockchain, and the building blocks are already in place in the present.


    ## Business Adoption of Distributed Ledgers


    The journey toward realization of a digital currency did not happen in a vacuum.
    The evolution of software tools, process automation and the World Wide Web, and
    the strides both in developing strong cryptography and bringing it out of government
    control, have had enormous relevance to business. Peer-to-peer networks developed
    before cryptocurrencies, and enterprise has always had to deal with mutually suspicious
    groups and maintaining the security of commercially sensitive and personally confidential
    information, but blockchain adds a new dimension. The publication of the Bitcoin
    white paper inspired not only cryptocurrency enthusiasts but also innovators who
    identified the underlying structure as a solution to some of their business problems.


    Professor Mike Smith was one such innovator. During our wide-ranging discussion,
    Smith told me that after reading the Satoshi whitepaper in 2011 he found that
    the concept resonated with him. He dabbled briefly in mining and narrowly avoided
    the 2014 collapse of the Mt Gox cryptocurrency exchange, but a business challenge
    crystallized for him the real value of blockchain. A Scandinavian data protectorate
    approached one of his clients with an informal complaint that data the business
    collected for mental health assessments was being altered after collection. This
    was not the case, although data smoothing is common practice in multiple industries.
    Smoothing is used to expose trends and key indicators in data sets that may be
    noisy or peppered with extremes. Smith’s focus, however, has always been on retaining
    raw data in its original form, both for its base integrity and the future usefulness
    of the information.


    The challenge was to prove to the complainants that the data was stored exactly
    as collected. Smith had already tested the principle that 256-bit hashing produces
    a unique string from any data, and therefore started out by concatenating all
    the timestamped data sets collected in a single day and generating a hash. The
    hash of the second day’s data was then recursively hashed with the previous day’s
    string to give each day positional integrity in a chain: a timestamped blockchain.
    Finally, the hashes were broadcast on three different websites, because “multiple
    transmissions of data keep people honest.” The regulators were able to verify
    that the data was unchanged, and the complaint was quietly shelved.


    This simple application is reflected in the most successful uses of blockchain:
    it is a great example of a problem being solved in the most appropriate way. The
    greatest threat to the reputation of distributed ledger technology is enterprise
    defaulting to blockchain as a silver bullet, manipulating the solution to fit,
    and losing sight of the original problem in the process.


    ## Do You Really Need a Blockchain?


    The cry that is guaranteed to strike despair into the heart of a responsible software
    developer is “we need a blockchain.” When an organization sees a problem cantering
    toward it from the horizon, a knee-jerk reaction is often to look to the newest
    technologies for a solution. A classic example of this is the reaction of the
    Philip Hammond, then Chancellor of the Exchequer in the British government, during
    the protracted negotiations around the United Kingdom’s proposed exit from the
    European Union (Brexit) in October 2018. Faced with the almost insurmountable
    challenge of securing a frictionless land border between the UK and European Union
    on the island of Ireland, he clutched at the straws of emerging technology as
    a way to maintain the existing freedom of movement and avoid imposing border controls
    in a historically difficult location. “There is technology becoming available,”
    he said. “I don’t claim to be an expert on it, but the most obvious technology
    is blockchain.” He is not alone in making the erroneous assumption that a new
    problem has to be solved by new technology. The reputation of blockchain as a
    valid option in a broad toolkit of potential solutions has suffered from fundamental
    misunderstandings as to its nature and its limitations.


    City Web Consultants is a software development company with experience in deploying
    a range of traditional and emerging technologies to meet client requirements.
    Its founder Adam Clarey has over the years watched a string of new concepts and
    ideas move from a state of overhyped excitement to disillusionment when the promise
    is not realized. Occasionally the business is approached by people who just have
    their eyes on making magic internet money at little risk to themselves. Some proposals
    have no business model to speak of, driven by a desire simply to use the technology
    and present a “solution” where there is no problem to solve. Others have a genuine
    business proposition but have jumped at a buzzword rather than working through
    the logical process of identifying the most appropriate technology to deliver
    what they need. Blockchain is unlikely to be the solution: in most cases, the
    real challenge is to define the client’s processes more clearly. Clarey is generally
    skeptical of the hype. “I have yet to come across any real-world project that
    truly benefits from using blockchain over any traditional technology,” he says.


    The excitement that overtook blockchain, as distinct from contemporary technologies,
    was largely due to the fundraising opportunities in the ICO gold rush. Clarey
    reflects on the madness of that period:


    ```

    During the boom of 2017 so much silly money was being pumped into blockchain /
    crypto projects that people’s greed got the better of them. Those “investors”
    overlooked the basic business models and/or underlying technology within these
    projects as [an ICO] was seen as a way to make large returns on their investment…
    I lost count of how many times I heard “blockchain will be the next internet.”
    Silly rabbits. Since the bubble burst and people got burned, investors and businesses
    are now far more cautious and critical. Money is only flowing where there might
    be a genuine use-case for the technology.

    ```

