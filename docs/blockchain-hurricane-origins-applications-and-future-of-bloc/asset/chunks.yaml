    Land registries may be moving online, but what about our homes? This logical step
    in public administration also offers benefits to the real estate industry. The
    commercial incentive to reduce costs and improve efficiency has driven development
    in the private sector. California-based real estate platform `Propy` executed
    the first proof of concept property purchase on the `Ethereum` blockchain in October
    2017, an apartment in Kiev, Ukraine, and has moved quickly to commercialize its
    offering. The first transaction recorded in California took place in July 2018,^([11](#08_Reference.xhtml#c6.11))
    and in Europe a few months later.^([12](#08_Reference.xhtml#c6.12)) By the middle
    of 2019, `Propy` had over 60,000 properties listed and had managed sales in `Bitcoin`,
    `Ether`, and fiat currency in the United States, Europe, and Asia. The smart contract
    governing each transaction is triggered by an independent notary verifying the
    seller’s signature, a much simpler interaction than the traditional exchange of
    documents. `Propy` is also trialing a deed registry and a title registry to manage
    the sale process from end to end. This weaves into the public registry by adding
    the hash information to the publicly held deed at the relevant Recording Office.
    The building blocks are in place for public and private sector collaboration.


    Transactions don’t stop with land and property. In 1999 the city of Dubai launched
    its ICT strategy with the aim of making the lives of its citizens happy and their
    interactions with government and regulators seamless. In 2016, a new element was
    added to the strategy: `blockchain`.^([13](#08_Reference.xhtml#c6.13)) Sustaining
    a consistent long-term vision at state level and executing it over more than two
    decades is rare in the west, and the rapid progress of `Smart Dubai` demonstrates
    the value of planning outside party politics. The Dubai government took the view
    that “Blockchain will do for transactions what the internet did for information”
    and set to identifying the transactions that could be made frictionless in their
    citizen journeys. Their practical approach was not to use `blockchain` regardless,
    but to solve specific pain points with the appropriate technology. The strategy
    addresses three pillars: government efficiency, industry creation, and international
    leadership. Speaking at the Business Blockchain Summit during London Tech Week
    2019, Dr Sohail Munir, adviser on emerging technologies and digital transformation
    to the `Smart Dubai Government`, explained that the goal is for the city to become
    paperless by December 12, 2021(there is a celebration already planned). The city
    envisages the elimination of 9.57 million pieces of paper, and cost savings annually
    of AED 1.15 billion (approximately $0.3 billion). This is an ambitious plan impacting
    multiple areas of a citizen’s daily life, and it is on track to be delivered.
    At the time of writing, payment reconciliations and the city’s property registry
    are already deployed, with proof of concept systems in place for aspects of licensing,
    wills, vehicle management, and education.


    The government machine in most countries has a need for increased accountability
    and transparency, which could be delivered by appropriate application of `blockchain`.
    The long-term project for the digitization of Dubai’s government and administration
    is one example. In the United Kingdom, `blockchain` as a tool for process improvement
    is being reviewed by the Department of Work and Pensions, the Intellectual Property
    Office, and the `G-Cloud` procurement system among others. The Canadian government
    published their `Policy on Service and Digital` in August 2019^([14](#08_Reference.xhtml#c6.14))
    with a specific commitment to “innovate and experiment with new technologies and
    solutions, like Artificial Intelligence and Blockchain.” Advances in `blockchain`
    technology rely upon support at the highest levels, and government interest in
    developing the use of distributed ledger technology can only speed up adoption.


    # Trust in Elections


    `blockchain` technology is an essential tool in the development of internet voting
    and the elimination of electoral fraud. As our lives move inexorably online, maintaining
    an engaged electorate becomes essential to democracy. If voting is too burdensome,
    relying on paper and ancient machines, then citizens will be disenfranchised.
    However, electronic voting is fraught with risk and is far more complex than might
    be evident to the voter.


    Professor Steve Schneider, director of the University of Surrey’s cybersecurity
    center, explained to me that while tallying votes transparently is reasonably
    simple, transparency of individual votes is a different matter. A robust and verifiable
    voting system needs to deal with the eligibility and the anonymity of voters,
    maintain secrecy in the ballot, and demonstrate integrity. It is a considerable
    challenge in terms both of cryptography and cybersecurity. Writing for the `New
    Statesman` in May 2019,^([15](#08_Reference.xhtml#c6.15)) Schneider outlined potential
    threats to both the electorate and electoral bodies including spoof voting sites,
    malware on devices used to cast a vote, and system penetration or internal bad
    actors, particularly as an electronic system is likely to be managed by a single
    central administration.


    Academics have been working on electronic voting systems since before the advent
    of `blockchain`, developing ways for individuals to verify independently that
    their vote has indeed been counted as intended, and for the public to check that
    the votes have been tallied correctly. Pilots such as the `Verifiable Classroom
    Voting (VCV)` system^([16](#08_Reference.xhtml#c6.16)) developed by Professor
    Feng Hao of Warwick University, and Schneider’s own past work, originally relied
    on posting results to a bulletin board, but as Schneider told me, `blockchain`
    delivered the technology to make this public record immutable and fully distributed.
    There are caveats. The `blockchain` needs to be permissioned rather than public,
    as electoral authorities have to run the election according to the laws of the
    country involved. There is a need for a two-stage consensus to ensure that voters
    get an immediate confirmation that their vote has been cast and recorded correctly:
    waiting for a `Proof of Work` consensus on a public `blockchain` would simply
    take too long to be practical. Trials of the Surrey team’s `Verify My Vote (VMV)`
    system^([17](#08_Reference.xhtml#c6.17)) took place in summer 2019, and while
    this work is a giant step toward a transparent and verifiable electronic voting
    system, it is likely to be some years before this is mature enough for a political
    or statutory election. Schneider suggests, though, that we are getting closer
    to using it for less high consequence elections where the voter list is under
    tighter control (e.g., organizational elections, union elections etc.) and the
    risk/benefit calculation is different.


    There are elements of internet voting systems in place already around the world.
    Digital identities are used in Estonia to ensure that all those eligible to vote
    can do so while maintaining anonymity in relation to the votes cast. In turn the
    votes themselves can be recorded in an immutable form. Estonia’s electoral commission
    monitors the centralized system closely for tampering, but there is no independent
    verifiability in place as yet. A voting system which mimics Estonia’s approach
    was implemented internally by a Danish political party in 2014, and there is a
    project in progress through the `Bitcoin Foundation` to develop a blockchain-based
    voting system.^([18](#08_Reference.xhtml#c6.18))

