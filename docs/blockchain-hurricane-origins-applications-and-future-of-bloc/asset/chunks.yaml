- fmt: '

    It seems logical that the principles behind the Nifty License and the ability
    to encode the metadata of a unique asset into an NFT could be applied to sectors
    outside gaming. In music, artist Imogen Heap has developed `Mycelia for Music`,
    a research and development hub for music makers. Part of the `Mycelia` mission
    is to ensure that all artists are “paid and acknowledged fully” for their part
    in any work. This is especially relevant to the music industry where tracks are
    commonly sampled and incorporated into other works. Most such activity is above
    board, but lawsuits for music plagiarism have been part of the landscape for decades.
    The `Mycelia Creative Passport` was launched in 2019, and the Grammys blog^([13](#08_Reference.xhtml#c5.13))
    reported on Imogen Heap’s plan to protect music makers by giving them “proper
    credit, digitally.” However, researchers from the University of Ulster, in a report
    commissioned by the UK’s Intellectual Property Office, sound a note of caution.^([14](#08_Reference.xhtml#c5.14))
    They acknowledge that “blockchain looks like a partial solution to ease the strictures
    of the royalty framework” but recognize the complexities of the industry and the
    wide range of activities in the music value chain. The report identifies a number
    of projects at varying stages of development and adoption who are all tackling
    different aspects of the industry’s challenges. These include include the aforementioned
    `Mycelia`; the `Ujo` project from `ConsenSys`; the `Musicoin`^([15](#08_Reference.xhtml#c5.15))
    streaming platform; `dotBlockchain`, a partner of `Intel`, whose mission is to
    eradicate losses from rightsholder information as file types change; and `Custos`,
    whose copyright protection system and Interplanetary File System (`IPFS`) are
    attracting considerable interest for musical content tracking and attribution.
    As in our global commercial supply chains, there are many pieces of the jigsaw
    coming together.


    In those supply chains, too, there are plenty of uses for an NFT. The Durian fruit
    producers we met in [Chapter 4](#04_Chapter_4.xhtml) are identifying each unique
    fruit and encoding its metadata in an NFT for tracking all the way to the consumer.
    California-based `Centrifuge` are addressing a different problem in the supply
    chain using the same methodology, allowing financial business documents to be
    created as NFTs. Ultimately, the technology that arrived in the mainstream as
    a digital cat is now representing a wide range of assets across the world.


    ## Scaling the Blockchain


    In every game there are clear rules governing each move that a player makes. Consider
    straightforward board games such as `Othello`, or `checkers`, or `Connect4`, before
    even thinking of the variations in `chess` or `go`. Every move involves knowing
    the way that pieces are permitted to act and thinking ahead and calculating the
    potential outcomes. When you consider the complexity of the reasoning involved,
    you see why games have been the training ground of artificial intelligence from
    `Deep Blue` to `Deep Mind`.


    Once a move has been made, by human or AI, we can write this action to a blockchain
    so that it can be authenticated by other parties. But could we go further? It
    has already been established that smart contracts on a distributed ledger enable
    the execution of transactions. Coins are transferred from one wallet to another,
    registry entries are created for shares and property, life events are written
    to identity records, and a `Cryptokitty` with a unique ancestry-derived genetic
    code can be created. Surely a move in a game is a simple smart contract? It seems
    logical that blockchain can become the referee, checking that the move made is
    legal and the outcome correct.


    Of course, there is a catch. Take a simple game like `Connect4`. There is only
    one possible move: a colored disk is dropped into the frame as two players attempt
    to make an unbroken line of four in any direction. What is required to confirm
    that the move is valid and to check whether a player has won on that move? The
    smart contract would need to establish:


    1. Is there exactly one more disk in the game than at the end of the previous
    move?

    2. In the additional disk of a different color to the one previously played?

    3. Has a line of four been formed horizontally, and / or:

    4. Has a line of four been formed vertically, and / or:

    5. Has a line of four been formed diagonally?


    To verify this simple move there are several functions, each with a cost. As the
    complexity of a game grows, the `gas fees` for smart contract processing would
    be eye-watering, to say nothing of the energy burden of data processing, the wait
    for validation, and the overwhelming noise of all these entries rendered immutably
    on the blockchain.


    Addressing the challenge of scaling is critical in both gaming and wider enterprise
    blockchain and essential for bringing the speed and throughput of cryptocurrency
    transactions to the standard of existing centralized payment processors. There
    are numerous solutions emerging across many different protocols, all at varying
    stages of development. These complement wider work in both technology and software
    design, which is needed to bring blockchain and cryptocurrency into the mainstream
    at large scale.


    ## Scalability and Speed


    When blockchain was first introduced as the technology underpinning digital cash,
    the ultimate vision was of a global decentralized payment system. Thanks to the
    development of electronic payment processing by banks, the `Visa` system, and
    private mechanisms such as `PayPal`, the first thing most people think of when
    they consider the processing of a high volume of transactions are the twin metrics
    of speed and throughput. How fast does the blockchain propagate, that is, how
    quickly is each new block created, and how many transactions are processed on
    each block? One measure of this is how many transactions per second (`TPS`) can
    be achieved.


    In terms of throughput, global mainstream processor `Visa` reports that in 2018
    it processed 124.3 billion transactions on its networks for 3.3 billion card carrying
    consumers.^([16](#08_Reference.xhtml#c5.16)) This is approaching 4,000 `TPS`.
    `PayPal`, whose 267 million active users made 10 billion transactions in the same
    period,^([17](#08_Reference.xhtml#c5.17)), comes out at 317 `TPS`. By contrast,
    `Bitcoin` trundles along a sedentary seven. Successive cryptocurrencies have bettered
    this, and although a few have reported throughput close to `Visa` levels this
    has not been tested at the scale and vast capacity of established systems. `Ethereum`
    reportedly reaches up to 30 `TPS` and `Litecoin` closer to 50 `TPS`. The fastest
    established crypto payment processor is `Ripple` with around 1,500 `TPS` for the
    `XRP` coin, although as this is achieved through the `Ripple protocol consensus
    algorithm` and not on a public blockchain it may not be a valid comparison. The
    all-time high for `EOS`, according to the `EOS Network monitor`, is 3996 `TPS`,
    but day-to-day live transactions run at a fraction of this figure, showing under
    100 `TPS` when accessed in August 2019. `EOS` has been designed for high scalability
    in a deliberate effort to stand shoulder to shoulder with `Visa`, but the structure
    of the `EOS blockchain` and its `delegated Proof of Stake consensus mechanism`
    result in a more centralized structure than traditional cryptocurrencies.


    How can transactions per second be increased? In basic terms, this involves either
    increasing the number of transactions that can be completed each time a new block
    is generated, or the speed with which the blocks propagate, or both. Of course,
    it is not so simple. In [Chapter 2](#02_Chapter_2.xhtml) we addressed the introduction
    of `Segregated Witness (SegWit)` to the `Bitcoin blockchain`, which changed the
    structure of the block contents, and the disputes over block size, which led to
    successive forks of the chain into `Bitcoin Cash` and its derivatives.

    '
