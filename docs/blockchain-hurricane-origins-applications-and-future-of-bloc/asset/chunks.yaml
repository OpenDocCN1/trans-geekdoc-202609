  trans: '

    维护区块链所需的能量是惊人的。根据“比特币能源指数”（Bitcoin Energy Index），仅比特币区块链的耗电量每年就翻一倍，在 2019 年其年耗电量已超过
    730 亿瓦时。这与整个奥利利的能源需求相当，而且还没有考虑到以太坊网络或其他任何依赖工作证明（Proof of Work）计算进行验证的公共区块链的负载。区块链是否消耗了太多能量？安德烈斯·M·安东波利斯（Andreas
    M. Antonopoulos）在 2019 年 6 月于爱丁堡举行的一个苏格兰区块链活动上表现得很明确：作为一种稀缺资源，比特币使用的能量正符合市场所言。然而，在这一气候变化加速的时代，比特币社区的行为是否是负责任的？


    ## 可持续的工作证明


    对于任何工作证明类加密货币的矿工来说，财务激励对于维护链的完整性至关重要。回顾一下这一过程：为了随机确认一个交易区块并开启下一个区块，比特币区块链上的全节点竞争求解一个复杂的方程。第一个确定随机数值
    `x` 的人赢得比赛，该值将生成一个包含包含随机数在内的区块内容且具有 `n` 个前导零的哈希值，并获得交易费和新造的比特币。这是一个高难度的复杂计算，但对于矿工来说参与它是值得的，这正是该结构的第一个救性特征。矿工不仅有动力维护区块链，而且为了自己的商业利益尽可能高效地进行维护。正如哈拉德·弗兰肯肯（Harald
    Vranken）在他 2017 年的论文中出的，“比特币矿工最初使用通用计算机，但他们很快转向了更专业的硬件，这些硬件提供了更高的性能……以及更低的成本。”处理器的效率继续快速提升，而相对成本在下降。这并不仅仅是因为区块链对高处理能力的需求，尽管某些供应商已经定制了显卡来解决比特币算法（专用集成电路）。处理速度的加快也与机器学习和人工智能领域对详细、海量数据分析的巨大需求有关。


    这些处理器使用的能量来源是区块链可持续性的主要考虑因素。根据 Coinshares 网络于 2019 年 6 月发表的研究，四分之三的矿活动由绿色能源驱动。作者表示：“我们对支持比特币挖矿网络的能源结构中可再生能源渗透率的保守估计为
    74.1%，这使得比特币挖矿比世界上几乎任何其他大规模行业都受可再生能源驱动。”这一数字与 2018 年 11 月的分析相比略有下降：使用再生能源是降低成本和减轻气候影响的成熟方法，而且矿工结构随时间推移而变化。挖矿活动在全球范围内使用太阳能风能，并被发现聚集在“有强流经过的人口相对稀少的丘陵或山区地区”，以利用廉价的水电。一些矿工和开发者还在全球范围内选择位置，以尽量地减少服务器冷却的能耗。在靠近北圈的国家，矿工正利用当地自然的凉爽气候使服务器保持在工作温度，大幅减少了全夜全功率运行空调的需求。


    向可再生能源迈进并不总是受欢迎的策略。现有的可再生能源发电公司正在反击涌向廉价能源热点的矿工，例如尼加拉瀑布周边的城市已禁止矿工运营。然而，Coinshares
    的研究得出结论，更广泛的经济影响实际上是有益的。“比特币挖矿充当了全球最后的电力买家，因此往往聚集在利用率较低的可再生能源基础设施周围。这有助于让亏损的可再生能源项目盈利，并随着时间——随着行业成熟并在公众眼中成为常态——它可能成为此前不具效益的地区新可再生能源开发的动力。”


    这并非普遍观点。普华道彼得·德弗里斯（Peter de Vries）的研究深入探讨了关于比特币可持续性的说法。尽管可再生能源的使用程度尚无可争议，但德弗里斯强调了一个事实：矿机处理器从开启到衰减到足以运行无利为止，对能量有着恒久的需求。这种持续的能量需求与可再生能源供应的波动性相矛盾，给其他来源带来了压力，例如中国矿业密集的四川省的燃煤发电厂。他甚至暗示，这种能源需求可能需要在该地区建设新的发电厂。德弗里斯说，工作证明处理器效率的提高也是令人担忧的。用于解决单一算法的处理器在过时后无法重用，会导致大量的电子垃圾。


    利用可再生能源、提高处理器效率以及管理其回收和再利用的倡议仍然至关重要，必须同时解决德弗里斯提出的问题。实现比特币和其他工作证明币的可持续性是一个巨大的挑战，随着加密货币的扩展，这一挑战只会变得更加艰巨，而区块链技术在加密领域之外的使用进一步增加了其复杂性。


    ## 区块总是需要的吗？


    工作证明并不是地平线上唯一的耗能大户。分布式账本的本质就是……分布式的。账本的每个参与方都在本地存储了一个副本。在中心化系统中，数据库出于安全考虑存储在几个位置，用户通过
    `API` 链接到相关的软件接口读取数据。在去中心化系统中，同一份数据可能有数百、数千甚至百万份副本，需要更多的存储空间和处理能力来更新每个节点的账本状态。


    无论是加密还是商业用途的区块链都在逐步精简，以减少链上存储的数据量。这种动力是为了通过加快交易确认来改善用户体验，但减少区块链在处理和存储数据方面的压力也有助于该技术整体的可持续性。例如，比特币在
    2015 年开始开发`闪电网络`（Lightning Network），社区持续对其进行完善。`闪电网络`增加了一层个人对点的通道层，微交易可以在这些通道中处理，只有通道的最终余额会被不可篡改地时间标记在区块链上。这些倡议正在为长期来看更高效、更可持续的处理做出贡献。

    '
- fmt: '

    Equally important is the use of sound judgment on what applications are suited
    to a blockchain. If a system is working perfectly well using a centralized database,
    if there are no requirements for a third party to authenticate records, if only
    a single organization is writing to the database, then there is no reason to jump
    to a new technology for the sake of it. Enterprises must use emerging technology
    effectively and ethically, whether this involves development of artificial intelligence,
    smart devices, autonomous vehicles, or blockchain applications. Loading many nodes
    with data that could be as easily held on one is wasteful of resources, and very
    little benefit can be derived. As we saw in [Chapter 4](#04_Chapter_4.xhtml),
    blockchain is effective when it solves a problem. If there is no problem to solve,
    then there is no value in shoehorning a solution into a working business model
    just because you can. However, blockchain has the potential to change lives. The
    World Economic Forum^([6](#08_Reference.xhtml#c7.6)) has estimated that the technology
    could stimulate a trillion dollars of trade from underdeveloped countries and
    small businesses. The work being done to improve blockchain and cryptocurrency
    sustainability is vital to ensure that these benefits do not come at the cost
    of accelerated climate change.


    While Bitcoin will always retain its `Proof of Work` consensus, there is a lot
    of work underway to find behaviorally sound and Byzantine Fault Tolerant substitutes
    for this elegant, effective, power-hungry consensus mechanism. In [Chapter 2](#02_Chapter_2.xhtml)
    we looked at both different consensus mechanisms in detail and established that
    reducing energy consumption on a blockchain through adoption of `Stake` and `Authority`
    mechanisms may require a permanent trade-off against the relevant cryptocurrency’s
    independence from a central authority. This is an area that is constantly evolving,
    and the optimal energy-efficient consensus mechanism for an open, neutral, borderless,
    decentralized cryptocurrency may still be some years away.


    ## Threats to Blockchain Integrity


    ### The Downside of Immutability


    Are you comfortable with your data being recorded unchangeably in perpetuity?
    Those of us born before 1980 have already breathed a sigh of relief that our teenage
    years and young adulthood were not spent on social media. The idea that our youthful
    mistakes could be not only public but indelible is worrying. We return to the
    notions of privacy addressed in [Chapter 6](#06_Chapter_6.xhtml): while people
    seeking anonymity or greater freedoms may be comfortable with a blockchain-based
    social network, it is not right for the majority. Furthermore, legal provisions
    such as Europe’s General Data Protection Regulations and the Right to be Forgotten
    require data to be carefully collected, securely stored, and deleted on request.


    There is also the very real challenge of archiving. As each block is added to
    its chain, the volume of data storage required to maintain these increasingly
    huge distributed ledgers will grow. At what point would you, or could you, close
    off the tail of the chain? We are asked to keep tax records for up to seven years,
    but an insurance certificate for employer liability has to be held for decades.
    The details of a long-term capital project from design onward will need to be
    authenticated throughout its useful life and at decommissioning, but some of our
    existing infrastructure is already hundreds of years old. In the fresh dawn of
    this new technology, there is a rush to put everything on the blockchain: consider
    the future and choose your immutable records wisely.


    ### Creeping Centralization


    The founding principle of cryptocurrency is decentralization: a perfect system
    of peer-to-peer transactions and randomized validation. Bitcoin still adheres
    to this vision and Ethereum became rapidly decentralized after the founding team
    loosened the reins, but other leading cryptocurrencies are arguably much less
    traditional and more centralized. Specialized blockchains such as `EOS` with its
    21 validating nodes, or `Ripple XRP` with most tokens still held centrally, are
    models that skate along the edge of centralization. The rise of what has been
    dubbed “corpocurrency,” starting with the release of the `Libra` whitepaper, is
    another source of concern. According to the paper,^([7](#08_Reference.xhtml#c7.7))
    “An important objective of the Libra Association is to move toward increasing
    decentralization over time.” It suggests that this transition will begin “within
    five years” from launch, but there is no clear mechanism for the decentralization
    process.


    In blockchain, too, enterprises have tended to opt for permissioned and private
    blockchains, keeping their commercial cards close to their chests. The frameworks
    of the `Hyperledger` project, `IBM blockchain`, `R3 Corda`, and specialized `Ripple`
    and `Stellar` systems within the financial back office are designed to work for
    a known group of participants. The likelihood is that these systems will become
    more and more open and less centralized as their communities grow, and work is
    ongoing to identify mechanisms for validation without cryptocurrency, but there
    is a cloud on the horizon.


    As blockchains grow, how do we manage unwieldy trails of blocks going back to
    genesis 5, 10, 20, or 50 years earlier? Our blockchain structure retains hashed
    data in perpetuity. Where identity records are concerned, we may still need access
    to verify information a century on, not to mention the requirements of long lifecycle
    projects, environmental data, copyright proof, and other applications. Truncating
    a chain would be an arbitrary process that would almost certainly inconvenience
    users and could open the whole chain to an attack because it compromises the integrity
    of the system. A bad actor could conceivably transmit a false version of the history
    of the chain, and validators would be none the wiser.


    If we accept that truncation is not a viable option, then how can we reduce the
    storage capacity required for all the data that we generate? Estimates suggest
    that within the next five years, half of the seven billion people on the planet
    will have at least one record stored on a blockchain. The problem is not going
    to go away.


    One of the solutions that is being proposed is to create a different class of
    node. At present, all blockchains have nodes that can execute transactions and
    full nodes that participate in the process of validation and block creation. The
    suggestion is for the creation of `mini-nodes`, designed to hold the last few
    thousand (or more) blocks, and periodically sense-checked against the full chain
    held by full nodes. The argument is similar to the logic around conventional corporate
    audit processes: as long as the data structure, the system, and any control functions
    are working, then the data can be trusted back to the genesis block. This differs
    from truncation as the whole chain is always available, and the risk of a false
    history attack is mitigated by regular checks against the original chain. But—and
    there is always a but—as the chain grows, and the number of nodes able to host
    the full record falls, there is a danger that the data becomes centralized in
    the hands of just a few participating full nodes upon which the mini-nodes and
    transacting nodes rely fully.


    ## Quantum Threat?


    The continued expansion of blockchain records and the rise of centrally operated
    digital cash will impact on the crypto-anarchist ideal of decentralization. It
    is not, however, an obvious threat in public perception, unlike the latest buzzword
    on the block: `Quantum`.


    Quantum, Baby!

    '
