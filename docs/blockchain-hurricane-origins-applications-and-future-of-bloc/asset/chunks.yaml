    ### 关于作者


    Kate Baucherel 是一位业务开发和战略顾问，专注于新兴技术，特别是区块链和分布式账本技术。她在多个领域担任技术和财务职务，引导企业经历了初创和增长阶段。Kate
    的第一份工作是在丹佛的 IBM，当时 `AS/400` 还是非常酷的硬件，她经历了通令人叹为观止的历程。她拥有空道二段，并有两个孩子。Kate 的写作涵盖了纪实与虚构。她的书籍包括非虚构类和未来小说。


