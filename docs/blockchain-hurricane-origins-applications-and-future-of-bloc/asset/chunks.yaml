    得益于务实的问题解决能力、寻求下一个大风口的人才进入该领域，以及底层框架的发展（包括 `Hyperledger` 套件、`IBM Blockchain`、`Ripple`
    在金融科技领域的早期创新以及源自 `Ethereum` 的衍生项目），分布式账本在私营部门的采用进展得相当快。


    私营部门周围的商业迫切需求驱动开发主要转向许可链区块链。这种碎片化现象被比作企业采用互联网和万维网的阶段：在采用更开放的系统之前，企业先采用了私有内网和公告板；而随着基础设施安全性的提高和信心的增强，本地托管服务器现在正逐渐被云存储取代。人们对私有链的长期扩展性存在担忧，其中显而易见的问题是：在一个没有原生加密货币的区块链中，一旦网络扩展到已知参与方之外，适当的信任机制是什么？这个问题以及其他问题已经由分布式账本演进前线的开发者们着手，未来十年将变得特别有趣。


    在一个不受商业敏感性限制的世界里，区块链技术可以实现什么？让我们转向源自不同领域的的进展：游戏世界。


    ## 第 5 章


    ### 数字猫将改变世界


    在万维网诞生 30 周年，提姆·伯纳斯-李（Tim Berners-Lee）证实了我们所有人私里相信的。记者萨米拉·艾哈迈德（Samira Ahmed）问：“你觉得网上会有这么多猫吗？”伯纳斯-李回答道：“一直计划如此，用猫视频填充互联网。”开玩笑之，互联网的社交属性在技术开始进入我们的家庭时并没有被预见到。万维网的早期用途反映了我们当时的习惯和活动，使它们变得更高效、更易获取，但从根本上没有改变。我们发送电子邮件或建立网页，而不是写信（对我以及对许多人来说，坦率地说，这些确实包含了相当数量的猫图片）。我们逐渐信任互联网商店存储我们的信用卡信息并确保其安全，将购物转向线上。猫视频的兴起源于
    `MySpace`、`Facebook`、`Twitter` 等新的社交构建以及现在环绕我们的平台爆炸，并源于点对支付之前的点对文件共享。我们的行为因为技术而改变，如果没有技术，这些就不会发生。


    ### 创新游戏


    企业主导的创新的危险之一在于，它存在维持成功业务模式的基础需求。遵循“如果没坏就不要修它”的原则，即使是最有创意的公司也会发现自己仅仅在为了降低成本进行迭代，或者为了更快地完成本质上未变的现有流程。行为的激进改变带来的风险，对于那些渴望在短时间内实现回报的投资者来说有时太大了。当技术出现时，投资回报率可能很难量化。项目评估人员将难以为传统的收益率或净现值计算提供长期现金流入的估计。另一方面，正如我们所看到的，创新本身也具有同样的风险。如果在明确定义问题之前就开发出解决方案，一些出色的想法就会被遗弃。如果对不愿意配合的主体强加新的工作方式，职场转型将是极其失败的。如果行业的一端受限于规避风险，而另一端是不考虑相关性而过度热情地采用新技术，那么真正新的概念何能在何处生根发芽呢？


    有一个行业的伟大强大之处在于其想象力。区块链领域最令人兴奋的创新正来自游戏行业。这并不意外：游戏一直是我们在技术领域已经经历过的其他重大转变的根源。触摸屏以及虚拟、增强和混合现实等用户界面在进入企业主流市场之前就已经在游戏领域被采用。作为互联网和万维网开发的垫脚石之一，伊利诺伊大学
    `PLATO` 系统上的多玩家游戏 `Empire` 仍被尤金·贾雷茨基（Eugene Jarecki）怀念地提起，他在 20 世纪 70 年代小时候玩过它。21
    世纪人工智能的爆发很大程度上归功于玩家对更快的玩法和更详细画面的需求。硬件跟进以跟上这一丰利行业的需求，而为游戏生产的新一代图形处理器（`GPUs`）也使人工智能核心的复杂数据分析和算法学习成为。


    游戏激发了某些如果没有区块链就无法实现的概念，新的行为正在涌现，这些行为将影响我们日常生活，无论在家还是工作中。资产所有权通过使用非同质化代币（`NFTs`）及其独特、不可分割的属性来代表单个物品，已经拥有了自己的生命。当行业一直在探索
    `NFTs` 在资产孪生中的应用时，游戏行业已经掌握了这一概念并付诸行动，引入了去中心化的所有权，并为全新的、充满活力的经济奠定了基础。同时，开发者必须应对游戏处理的交易量与区块链上可以物理记录的数据量之间的容量挑战。当你拆解规则时会发现游戏是非常复杂的。我们很少有人意识到在决定下一步行动时，内部执行了多少处理。为了实现有效的自动化游戏，必须对每笔交易的价值以及是否有必要将所有内容记录在链上做出艰难决定，而且管理每一步操作的
    `smart contracts` 必须高度高效，为玩家节省尽可能少的交易手续费，并用最短的时间完成验证。


    游戏创新正在快速发展，对未来的业务模式和商业行为具有影响。让我们详细详细观察它们。


    ### 游戏心态


    游戏中的所有权是欺骗性的。当你走了几英里去捕捉或孵化一只稀有的 `Pokémon`，赢得或支付了大量资金为《愤怒的小鸟》到《堡垒之地》等任何游戏中的角色购买特殊服装，或者开采材料建造你的钻石城堡时，你会感觉自己真的拥有了某些东西。你可以和朋友比较
    `Minecraft` 世界，并在多玩家环境中自豪地炫耀，但实际上，“你的”资产仍然稳固地留在游戏公司的服务器上，或者静态地存在于你许可的游戏副本中。正如
    Deckbound 的 Gareth Jenkins 在 2018 年区块链游戏峰会上解释的那样，玩家们已经为区块链做好了准备：这符合他们的心态。他们对在游戏过程中创造和赢得资产拥有所有权持有预期，包括买卖物品的能力。许多角色扮演游戏（`RPGs`）中已经存在用于交换物品的市场平台，但资产本身并不属于交易它们的玩家。转变为具有个人所有权的状态感觉是自然的一步，并为玩家开启了新的大门。区块链提供了实现这一点的媒介。


