    数据保护立法是隐私法的现代延伸，这些隐私法在过去的 150 年里在多个司法管辖区的演变路径迥然不同。在美国，隐私法是通过普通法的自然演变发展的，其背景是宪法和第一条修正案所载载的言论自由和新闻自由权。虽然普通法中的“侵犯隐私”侵权赋予了个人“人身和财产的完全保护”，但在历史实践中，它是通过个案具体决决来实现的。随着社会和技术的发展，立法试图跟上隐私的新语境。1890
    年，立法的目标是新兴的摄影技术，这种技术导致了一些过度激进的新闻报道。沃伦（Warren）和布兰迪斯（Brandeis）在《哈佛法学评论》发表的《隐私权》是一篇具有影响力的文本，其中提出的担忧在我们的现代社会中依然清晰可见。自沃伦和布兰迪斯以来演变的现代侵权法保护个人免受“侵入孤独、公开公共事实、虚假光环和挪用”的影响。联邦法对政府侵入设定了限制，而各州则零散地增加了其他保护。这种立法的复杂性导致了法律法规的碎片化，它们有时会相互重叠或矛盾。例如，在数字领域，《2018
    年加州消费者隐私法》（CCPA）和伊利诺伊州的《2008 年生物识别信息隐私法》是独立且不相关的法律，解决隐私中非常具体的元素。开发者面临着挑战，必须确保其系统旨在采集和保留的数据能够通过各种不同法律的检验。


    软件的跨国采用使情况更加复杂。区块链引发了一个连接的、去中心化世界的愿景，但这要求符合不同司法管辖区的规定。四个字母让所有科技公司心惊胆战：GDPR。这项于
    2018 年在全欧洲范围内生效的《通用数据保护条例》是严苛的，并且对分布式账本中的不可变记录具有特定影响。


    ### 欧洲立法是如何这样发展的？


    在欧洲，除非另有说明，否则一切都是私有的；而在美国，隐私是一种不可剥夺的权利，但对这种隐私的侵犯是按部门和按案例来定义的。这种差异可以追溯到一个重大历史事件及其遗产：第二次世界大战。战后，欧洲理事成立，1949
    年开始着制定《欧洲人权公约》（ECHR），这是一份支持民主、自由和个人权利的强有力宣言。2009 年，《欧盟基本权利宪章》将《人权公约》和不同国家的个人法律合并为一份宪章，它对欧盟所有成员国具有法律约束力。个人隐私权是明确规定的。这种全毯式的保护是欧洲监管的起点，随后的判例允许对个人数据进行有限访问。《通用数据保护条例》诞生于此背景，它限制了个人数据的实际收集，除非是出于特定原因，或者在未获得“知情同意”的情况下进行收集，而这是一个复杂的雷区。


    ### 案例研究：SDQ


    迈克·史密斯（Mike Smith）教授常驻欧洲，他运营的长处与困难问卷（SDQ）正在全球范围内。心理健康评估（特别是针对儿童）是非常敏感的领域，史密斯的经验为开发者在数据采集和保留方面应采取的提供了见解。他解释说，他一直避免收集任何人口统计学数据。为了完整性，采集年龄和性别是重要的，这些在评估中是相关的，但这些数据在包含多个记录的数据集中不会导致个人身份识别。然而，并不收集受访者的准确出生日期，因为根据有关样本的其他上下文信息，这很容易就能追溯到特定个人。


    尽管 SDQ 不愿收集个人细节，但这些细节在医疗环境中至关重要，因为临床医生无法承担将数据关联错误患者的风险。这个问题的解决方案需要区块链，并且在 GDPR
    下是允许的，因为它是“设计安全”的范例。这是一种强大的数据保护机制。


    数据通过强加密和令牌化进行掩盖，使得存储的信息变得无法理解，恶意者需要花费数年才能重构。这些数据的唯一 ID 可以在临床端与患者信息绑定（由医疗专业人员本地控制），该
    ID 的存储信息只能由密钥持有者解密。每次数据传输都有时间戳，为唯一 ID 提供了访问审计轨迹，但无法获知内容。这通过跟踪不透明的“数据块”来保护 SDQ，证明信息仍然被存储且没有丢失或被恶意删除。尽管这种结构防止了拥有部分信息的恶意者访问存储的数据，但围绕私钥的托管仍存在考虑因素：如果密钥丢失，宝贵的数据也将随之丢失且无法检索。解决这一挑战再次落到了开发者身上，要确保数据安全不会因为保护解密工具的措施而受到。


    ### 展望未来


    虽然企业可以快速行动应对挑战，游戏开发者遵循想象力打破障碍，但政府和治理的创新路径必然是较慢的。管理我们的个人数据、生活以及国家并非一项简单任务，但公共部门正在迎接挑战，采用新技术的速度比我们过去任何时候都要快。区块链技术可以实现我们生活方式的一些根本性变化，看到一个传统上缓慢的领域出现如此多的创新是令人目一新的。虽然许多应用尚未进行大规模部署，但它们已经上线并正在接受测试和审查的事实对于未来的采用是一个良好的预兆。


    在最后一章中，让我们转向区块链周围尚未实现的机遇，以及面临的威胁。


