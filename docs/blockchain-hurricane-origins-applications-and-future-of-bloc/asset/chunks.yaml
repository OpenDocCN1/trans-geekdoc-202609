    that every single person on earth will have an ID and get access to education,
    health, and other social services.


    This is a powerful vision of the kind of future that many advocates believe can
    be facilitated by evolving blockchain technology.


    ## Legitimacy of Cryptocurrency


    The positive outlook of the United Nations is a far cry from the murky reputation
    that has haunted cryptocurrency in the past as a tool for criminal activity and
    malpractice. For anyone whose computers have been infected by ransomware which
    locks their data down and demands payment in `Bitcoin`, crypto is synonymous with
    criminality. This was reinforced in the public perception by its extensive use
    on Silk Road, the dark net marketplace, which was active between 2011 and 2014.
    Over 9 million `Bitcoin` transactions were recorded on Silk Road during that time,
    and toward the end of its operations its escrow accounts were hacked, although
    much of the lost `Bitcoin` was recovered. Ironically, `Bitcoin` itself is an innocent
    party here. The `Bitcoin` blockchain is entirely transparent and pseudonymous,
    not anonymous: every wallet could, in theory and in practice, be linked to a real-world
    identity, making `Bitcoin` considerably more traceable than cash.^([7](#08_Reference.xhtml#c1.7))
    In the case of the 2017 WannaCry ransomware attack, for example, all the ransom
    payments are visible on the `Bitcoin` block explorer for anyone to see.


    The blockchain tells a story, too. For a high-profile worldwide attack, the fact
    that only 338 victims in total paid the `WannaCry` ransom underlines the sterling
    work of the cybersecurity professionals who stopped the virus in its tracks (thanks
    in part to quick action by malware researcher Marcus Hutchins^([8](#08_Reference.xhtml#c1.8)))
    and helped users to repair the damage done by the ransomware without making any
    payment. Examining the records of one of the three wallets that were used to collect
    the ransoms, you can see 133 receipts of `Bitcoin`, which at the time each equated
    to $300, and the withdrawal of the whole amount in two transactions several months
    later.^([9](#08_Reference.xhtml#c1.9)) The funds were transferred to a wallet
    in a privacy currency, `Monero`, where real transaction details are protected
    by obfuscating the data: six false records are attached to every real transaction,
    making it harder to follow a trail. This kind of anonymous cryptocurrency is much
    harder to police, being the digital equivalent of used bank notes. Tarring every
    digital coin with the same brush is unfair.


    Another accusation leveled at cryptocurrency, especially during the rapid price
    rises of 2017, is that it is a Ponzi scheme, a pyramid, a scam to defraud innocent
    investors by paying out returns for early adopters from the investments of those
    late to the party. As the prices have settled back to realistic levels and both
    volume and regulation have improved there is much less talk of fraudulent practice
    and a greater understanding of the reliability of mainstream digital currencies.
    At the time, however, this inaccurate impression was so prevalent that a joke
    currency `PonziCoin` was created in 2018 by a California developer. The white
    paper for `PonziCoin` laid out in clear, unequivocal language that the `smart
    contracts` would pay out the first investors from the proceeds of later investments
    until the money ran out. To the amazement and horror of the team behind the prank,
    people actually started putting cash into the scheme. They quickly disabled the
    ability to invest and allowed the `smart contracts` to run their course. In a
    statement on their website, the developers gave a warning to people caught up
    in the hype:^([10](#08_Reference.xhtml#c1.10))


    We hope everyone had a good laugh :) But we have to shut down. This was a parody
    art performance/joke. I did not “run off” with the money, I never sold any of
    my `PonziCoins`, and the contract was drained from other users withdrawing. Please
    be careful when investing in shady cryptocurrencies, especially ones that look
    like pyramid schemes—it’s a zero-sum game and money doesn’t appear out of thin
    air.


    This is a salient lesson for investors in early stage blockchain projects, where
    tokens can be purchased with such ease. There is a reason why in most jurisdictions
    investing is regulated to some degree, and if the return from an investment looks
    too good to be true, then it probably is.


    Ultimately, however, cryptocurrency is simply a form of money. Author Yuval Noah
    Harari writes:^([11](#08_Reference.xhtml#c1.11))


    Money is the only trust system created by humans that can bridge almost any cultural
    gap, and that does not discriminate on the basis of religion, gender, race, age,
    or sexual orientation. Thanks to money, even people who don’t know each other
    and don’t trust each other can nevertheless cooperate effectively.


    Cryptocurrency is the natural evolution of the most universal system of mutual
    trust ever devised. Its decentralized structure and integral trust mechanisms
    ensure its legitimate place in society.


    ## Spending Digital Cash in the Real World


    Can you spend cryptocurrency? Of course. The physical wallet in my pocket currently
    contains a visa card, which links directly to a cryptocurrency account. I can
    indirectly pay for coffee and sandwiches with my crypto holdings. The transaction
    involves an automated conversion to the local fiat currency, as do the cryptocurrency
    ATMs that already exist to allow withdrawals from crypto accounts to local cash,
    but it is the frictionless nature of the exchange that is interesting. One state,
    the tiny Pacific state of the Marshall Islands, has introduced its own local cryptocurrency
    as legal tender, the Marshall Islands Sovereign. In Venezuela, payment for goods
    and services from coffee to clothing is increasingly made in `Bitcoin`, while
    the government has started insisting on tax dues being settled in their own cryptocurrency,
    the `Petro` (you can read more about this in [Chapter 3](#03_Chapter_3.xhtml)).


    Online, I can buy all kinds of goods and services with cryptocurrency. There are
    several mainstream cryptocurrency checkout tools available, including a standard
    `Blockonomics` plugin, which takes payment in `Bitcoin` on my own WordPress website
    and deposits the proceeds directly to my crypto wallet without conversion. Blockchain
    games such as `Cryptokitties`, `Axie Infinity`, `Neon District`, `Decaland`, `Epic
    Dragons`, `EOS Knights`, `Gods Unchained`, and many others can be played with
    cryptocurrency.


    As the volume of users and transactions increase, the volatility of cryptocurrencies
    is likely to settle, reducing the current risk and uncertainty that surrounds
    them. The rise of `stablecoins`, a class of cryptocurrency pegged to the value
    of a real-world asset or currency, may contribute to more rapid adoption as a
    large part of the risk associated with digital currency is eliminated. In California,
    lawmakers introduced a bill in February 2019 to “remit any cannabis excise tax
    or cannabis cultivation tax amounts due by payment using stablecoins.”^([12](#08_Reference.xhtml#c1.12))
    Facebook’s proposed `Libra` coin introduces another mechanism for adoption. Commentators
    including Caitlin Long, co-founder of the Wyoming Blockchain Coalition,^([13](#08_Reference.xhtml#c1.13)),
    believe the reach of this powerful global social network will provide citizens
    of developing nations with access to a store-of-value that is more reliable than
    their government-backed currencies. The question is not whether we can use cryptocurrency
    in our daily lives, but how close we are to mainstream adoption.


    ## What’s Actually in the Blockchain?

