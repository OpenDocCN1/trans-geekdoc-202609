    and early speculative internet developments fell by the wayside. Even at that
    time we could not have imagined the likes of Twitter and its social media peers,
    nor our eventual reliance on the internet to deliver information to us through
    video, audio, and community forums. Some science fiction writers over the years
    came close, including David Brin in his 1990 novel Earth,^([3](#08_Reference.xhtml#c1.3))
    which featured a dynamic global web of information, citizen surveillance, and
