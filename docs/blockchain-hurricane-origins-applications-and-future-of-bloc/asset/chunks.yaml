- fmt: '

    Loom’s software development kit (`SDK`) was designed to help non-blockchain developers
    to build the blockchain element of their systems in a straightforward fashion.
    Loom’s team is also behind `Crypto Zombies`, the definitive smart contract coding
    tutorial for those who want to dig deeper into development skills. The `SDK` allows
    the construction of a “DAppChain” sitting as a `Layer 2` on top of a number of
    existing blockchain protocols in the same way that the `Lightning Network` is
    a `Layer 2` on `Bitcoin`. The team behind Loom are aiming for it to become the
    universal `Layer 2` connecting all major current and future blockchains. This
    is a significant step toward the seamless collaboration and interoperability that
    we have enjoyed for decades with the mature internet, and Loom integrations are
    in place for `Ethereum`, `EOS`, `Tron`, and `Cosmos` among others.


    Increasingly popular with developers of games, Loom is also used for social networks
    and other applications that require speed and high levels of user interaction.
    The default `SDK` uses `Delegated Proof of Stake` consensus for all the individual
    side chains, although developers could choose other mechanisms, and this means
    that transactions on the side chain incur no gas fees and have the fast confirmation
    time that a `Proof of Work` blockchain lacks. Compare this with applications native
    to `Ethereum`, such as `Cryptokitties`, which incur fees for every transaction
    and take time to validate. Launching a game on a side chain enables the use of
    highly complex smart contracts for gameplay. The first DAppChain went live in
    March 2018 and Loom is used by several growing games including `Axie Infinity`,
    `Battle Racers`, and `Neon District`.


    Loom has adopted `Plasma` as a method for users to transfer `ERC20` and `ERC721`
    tokens onto sidechains with the knowledge that should there be any problems with
    the sidechain, such as a hack or fraudulent activity, that their assets are still
    recorded on the main `Ethereum` blockchain. This bolsters the security of side
    chains and makes them a realistic and reliable platform for scalable development.


    ## Practical Considerations for Scaling Blockchain Projects


    Speed is not by any means the only measure of a successful system. There are plenty
    of other factors to consider, not least a loaded question asked by Blockchain
    Game Alliance’s Alex Amsel: Do you need to scale if you don’t have users? As we
    have seen before, having the “best” technology does not guarantee that that market
    will follow. Competitors on slower frameworks could easily win greater market
    share, and there is nothing to be gained by future proofing an application which
    has no users.


    If the system features any type of interoperability, it should remain in the same
    blockchain ecosystem as its collaborators: this is one of the strengths of Loom
    in widening collaboration networks. Software development kits (`SDKs`) vary in
    their thoroughness across frameworks, and the more support that is available for
    technical teams the greater the integrity of the eventual platform. Anyone seeking
    a new, faster option needs to look carefully at the team behind the development,
    doing the due diligence that is required with any early stage business.


    ## Add Just a Pinch of Blockchain


    Software developers using blockchain can meet all these scalability efforts halfway
    by reducing on-chain processing. Amsel takes the view that if something does not
    have value (whether monetary, commercial, or personal) then it does not need to
    be on a blockchain. This is a good rule of thumb to follow in developing sustainable
    applications.


    Take an objective look at the processes that are being automated. Be honest about
    what elements of the user journey really require an immutable, distributed record
    to be created. There will be considerations beyond simple functionality and authentication.
    Businesses often rely upon valuable data as a commodity, therefore broadcasting
    even metadata to a network can compromise the business model. An example of the
    way blockchain has been used to good effect for this type of business is the Gospel
    Data Platform discussed in [Chapter 4](#04_Chapter_4.xhtml): the introduction
    of a distributed ledger has been carefully managed to solve a problem while protecting
    the data which participating businesses hold and value. If there is a genuine
    business reason to incorporate complex smart contracts into the software, then
    the next step is to consider the needs of both the users and the developers.


    ## Focus on the User


    It is all too easy as a software developer to lose sight of the user and focus
    instead on the technology, pushing to have the cleanest processing, the fastest
    validation, the best experience from the very particular point of view of a developer.
    Users are not generally concerned what is running under the hood. They want the
    software to execute the functions for which it is designed through a straightforward
    user interface with suitable security and resilience. In the past, when running
    a growing software business, I learned to spot the innocent statement “just refactoring
    something…” This normally flagged up a developer falling too far down the rabbit
    hole into a wonderland of new tools, and future proofing far beyond the roadmapped
    scope or needs of the product. Designing for the expected growth in users according
    to a realistic business model is important; chasing the fastest blockchain experience
    at the expense of a good user experience and proven resilience is foolhardy.


    Marguerite deCourcelle, CEO of Blockade Games, is clear that blockchain developers
    need the complementary expertise of application developers to achieve good user
    experience. She points out that, “when Epic Games made Fortnite, they simultaneously
    developed the `Unreal Engine` to power it. They made development choices in real
    time based on the requirements for the gaming application.” It is the high-quality
    user experience that drives adoption and access to a mainstream user base. Blockade,
    the company behind `Neon District`, released their blockchain game developer platform
    in September 2019 as a tool for the industry to achieve this collaboration. It
    turns the process on its head: established game developers can use the platform
    to build in blockchain features which will enhance their application. The goal
    is to make it so that players don’t realize they are playing a blockchain game.
    This frictionless adoption is something that every industry should strive to achieve.


    ## CHAPTER 6: Government, Governance, Data, and You


    Where is your data, exactly? Do you know how it has been folded, sorted, sold,
    and abused since you signed up for that useful free internet tool? How much of
    your private life has slipped into the public domain through innocent games and
    chat online? They say that McDonalds may not have the best burgers in the world,
    but their real estate portfolio is second to none. The business of the company
    you subscribe to is not based on providing you with a free service, but on selling
    your details directly or indirectly to a hungry market. If the product is free,
    then you are the product.

    '
