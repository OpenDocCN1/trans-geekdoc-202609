- fmt: '

    The issue of trust and confidence is one which Cameron and Tyler Winklevoss of
    the Gemini exchange are addressing head on. The Gemini Dollar is the world’s first
    regulated, audited stablecoin. The Winklevoss twins have a clear agenda of building
    trust through oversight, avoiding the very human problems that have plagued custodians
    in the cryptocurrency world. Speaking at the SXSW conference in Austin, Texas,
    in March 2019 they explained that “the most healthy markets are the best regulated”
    and reiterated that the key to success is “not the tech, it’s the trust.”


    While `Tether`, `Gemini`, and other collateralized stablecoins have the onerous
    requirement to maintain matching reserves, `DAI` from `MakerDAO` (`Maker`) has
    overcome the need to hold physical reserves through automatic pricing systems
    built into the token’s smart contracts. These mechanisms are continually readjusting
    the price of `DAI` as the market fluctuates, ensuring that it remains pegged one-to-one
    with the U.S. dollar. Since its launch in 2017, it has demonstrated good stability
    despite major volatility in the market.


    It is becoming more and more common for applications to be developed using a stablecoin
    as their principle currency, says Martin Bartlam of `DLA Piper`. Established apps
    are also turning to stablecoin. Tom Kysar of the `Augur Project`, which was one
    of the earliest Ethereum applications to be developed, explained that a need for
    lower volatility led version 2.0 of their peer-to-peer prediction market to move
    to trading in `DAI`. The mitigation of cryptocurrency risk has become a vital
    step toward greater blockchain adoption. However, there is a caveat: for all that
    this approach reassures new users whose concept of money is informed by fiat behavior,
    stablecoins are in danger of abandoning the systematic stability of traditional
    cryptocurrency in a quest for price stability.


    ### Specialized Cryptocurrencies


    In the world of financial technology (FinTech), the concept of a distributed ledger
    was quick to be explored. After all, financial systems are built on the checks
    and balances of ledgers and the industry both understood the new technology and
    realized that it may one day supplant traditional banking. Considerable work has
    been done in all areas of FinTech and banking to explore automation, decentralization,
    and the role of blockchain in managing trust between mutually suspicious parties.


    So where are the FinTech coins? The largest of these is `XRP`, the native currency
    of the `Ripple` cross-border payment platform. `Ripple` has been adopted by banks
    worldwide and is a popular blockchain application aiming to reduce friction in
    international transfers. The fact that `XRP` is fundamental to the niche `Ripple`
    application has led to controversy and argument that `XRP` is not a decentralized
    cryptocurrency and should not be traded as such. Legal action around whether the
    sale of `XRP` on the open market was legitimate in the first place has been rumbling
    in the background. Despite this, `XRP` grew to be one of the more popular traded
    cryptos thanks to the widening adoption of `Ripple`. A spinoff from an `XRP` form,
    `XLM` is also gaining traction in the payment processing space.


    Another coin with a niche application is `IOTA`, the native cryptocurrency of
    the eponymous blockchain, which focuses on the security of the Internet of Things
    and enabling machine-to-machine communication. `IOTA`’s framework departs from
    Satoshi’s blockchain structure, introducing a concept called `Tangle`. Transactions
    are written to the ledger and attached to others by an edge, rather than a linear
    chain. A transaction can only be entered if the node doing so validates two adjoining
    transactions. This results in a random consensus where, as more transactions are
    entered, more validations are completed, so in theory the system runs faster the
    more.


    ### Crypto for the Masses


    Adoption of cryptocurrency has, unsurprisingly, been a worldwide phenomenon. According
    to 2019 Statista Global Consumer Survey, Turkish citizens led the way with 20
    percent having owned or used cryptocurrency; `Brazil`, `Colombia`, `Argentina`,
    and `South Africa` also reported usage above 16 percent. This contrasts with much
    lower levels of adoption in Western Europe and North America (6 percent in the
    United Kingdom, 5 percent in the United States). Cryptocurrency is gaining ground
    where there is volatility, or a large proportion of the population without access
    to facilities. This is not to say that adoption in such economies has been easy.
    Authorities have attempted to regulate and even ban cryptocurrency mining in a
    number of countries with varying degrees of success. Venezuela has been held up
    by some cryptocurrency evangelists as a pioneer thanks to the creation of a national
    cryptocurrency, the `Petro`, but the real picture is far more complex and sinister.
    There is a clear distinction between what Andreas M. Antonopoulos describes as
    “money of the people,” that is open, borderless, neutral, censorship-resistant
    cryptocurrency, and “money of the government” under centralized control. Because
    no-one trusts the `Petro`, use of `Bitcoin` has flourished defiantly.


    #### Adoption Through Need: Case Study: Venezuela


    My colleague Patricia O’Callaghan left Venezuela in 2017 in the face of mounting
    inflation, crumbling infrastructure, and dismal prospects for the future. The
    inflation rate at the time was reported by the International Monetary Fund to
    have reached 1,000,000 percent, with predictions that this would rise to an estimated
    10 million percent in the following 12 months. Patricia and her friends, now scattered
    across the world, told me about the challenges of the environment they left behind
    and the importance of `Bitcoin` in Venezuelan society.


    Cryptocurrency is viewed in countries with a stable banking and political system
    as a volatile, risky venture. In Venezuela, where people are facing rapid devaluation
    of the local currency, `Bitcoin` plays the role of a stablecoin. Individuals receiving
    payments in the local currency, the Bolivar, cannot convert to fiat currencies.
    Holding dollars is illegal, to the extent that Patricia recalls being stopped
    by the police and having the few dollars in her wallet confiscated. Conversion
    to `Bitcoin` became a way to preserve value, transfer money between citizens and
    across borders, and store savings safely.

    '
  raw: 'The issue of trust and confidence is one which Cameron and Tyler Winklevoss
    of the Gemini exchange are addressing head on. The Gemini Dollar is the world’s
    first regulated, audited stablecoin. The Winklevoss twins have a clear agenda
    of building trust through oversight, avoiding the very human problems that have
    plagued custodians in the cryptocurrency world. Speaking at the SXSW conference
    in Austin, Texas, in March 2019 they explained that “the most healthy markets
    are the best regulated” and reiterated that the key to success is “not the tech,
    it’s the trust.”


    While Tether, Gemini, and other collateralized stablecoins have the onerous requirement
    to maintain matching reserves, DAI from MakerDAO (Maker) has overcome the need
    to hold physical reserves through automatic pricing systems built into the token’s
    smart contracts. These mechanisms are continually readjusting the price of DAI
    as the market fluctuates, ensuring that it remains pegged one-to-one with the
    U.S. dollar. Since its launch in 2017, it has demonstrated good stability despite
    major volatility in the market.


    It is becoming more and more common for applications to be developed using a stablecoin
    as their principle currency, says Martin Bartlam of DLA Piper. Established apps
    are also turning to stablecoin. Tom Kysar of the Augur Project, which was one
    of the earliest Ethereum applications to be developed, explained that a need for
    lower volatility led version 2.0 of their peer-to-peer prediction market to move
    to trading in DAI. The mitigation of cryptocurrency risk has become a vital step
    toward greater blockchain adoption. However, there is a caveat: for all that this
    approach reassures new users whose concept of money is informed by fiat behavior,
    stablecoins are in danger of abandoning the systematic stability of traditional
    cryptocurrency in a quest for price stability.


    Specialized Cryptocurrencies


    In the world of financial technology (FinTech), the concept of a distributed ledger
    was quick to be explored. After all, financial systems are built on the checks
    and balances of ledgers and the industry both understood the new technology and
    realized that it may one day supplant traditional banking. Considerable work has
    been done in all areas of FinTech and banking to explore automation, decentralization,
    and the role of blockchain in managing trust between mutually suspicious parties.


    So where are the FinTech coins? The largest of these is XRP, the native currency
    of the Ripple cross-border payment platform. Ripple has been adopted by banks
    worldwide and is a popular blockchain application aiming to reduce friction in
    international transfers. The fact that XRP is fundamental to the niche Ripple
    application has led to controversy and argument that XRP is not a decentralized
    cryptocurrency and should not be traded as such. Legal action around whether the
    sale of XRP on the open market was legitimate in the first place has been rumbling
    in the background. Despite this, XRP grew to be one of the more popular traded
    cryptos thanks to the widening adoption of Ripple. A spinoff from an XRP form,
    XLM is also gaining traction in the payment processing space.


    Another coin with a niche application is IOTA, the native cryptocurrency of the
    eponymous blockchain, which focuses on the security of the Internet of Things
    and enabling machine-to-machine communication. IOTA’s framework departs from Satoshi’s
    blockchain structure, introducing a concept called Tangle. Transactions are written
    to the ledger and attached to others by an edge, rather than a linear chain. A
    transaction can only be entered if the node doing so validates two adjoining transactions.
    This results in a random consensus where, as more transactions are entered, more
    validations are completed, so in theory the system runs faster the more data is
    recorded. The validations use the same Hashcash basis as the Bitcoin blockchain
    but with a much lower level of complexity, which means that nodes can validate
    with limited processing power on smartphones or within sensors. The IOTA coin
    (more accurately mIOTA) is the means of payment for any machine-to-machine transactions
    which happen within the network. IOTA has still to be proven at scale, but it
    occupies an increasingly important niche in the world of blockchain and cryptocurrency.


    Crypto for the Masses


    Adoption of cryptocurrency has, unsurprisingly, been a worldwide phenomenon. According
    to the 2019 Statista Global Consumer Survey,^([16](#08_Reference.xhtml#c3.16))
    Turkish citizens led the way with 20 percent of those surveyed having owned or
    used cryptocurrency; Brazil, Columbia, Argentina, and South Africa also reported
    usage rates above 16 percent. This contrasts with much lower levels of adoption
    in Western Europe and North America (6 percent in the United Kingdom, 5 percent
    in the United States). Cryptocurrency is gaining ground as a genuine alternative
    medium for exchange of value in countries where there is volatility, heavily controlled
    currencies, or a large proportion of the population without access to banking
    facilities. This is not to say that adoption in such economies has been easy.
    Authorities have attempted to regulate and even ban cryptocurrency mining and
    use in a number of countries with varying degrees of success. In cultures where
    there is strong government control and censorship, exchanges which are permitted
    may be heavily regulated. Venezuela has been held up by some cryptocurrency evangelists
    as a pioneer thanks to the creation of a national cryptocurrency, the Petro, but
    the real picture is far more complex and sinister. There is a clear distinction
    between what Andreas M. Antonopoulos describes as “money of the people,” that
    is open, borderless, neutral, censorship-resistant cryptocurrency, and “money
    of the government” under centralized control. Because no-one trusts the Petro,
    use of Bitcoin has flourished defiantly.


    Cryptocurrency is gaining traction where it has utility for users: this is only
    to be expected. However, any enterprise introducing an application that incorporates
    the use of cryptocurrency must consider the mechanism by which they expand their
    user base beyond the crypto space.


    Adoption Through Need


    Case Study: Venezuela


    My colleague Patricia O’Callaghan left Venezuela in 2017 in the face of mounting
    inflation, crumbling infrastructure, and dismal prospects for the future. The
    inflation rate at the time was reported by the International Monetary Fund to
    have reached 1,000,000 percent, with predictions that this would rise to an estimated
    10 million percent in the following 12 months. Patricia and her friends, now scattered
    across the world, told me about the challenges of the environment they left behind
    and the importance of Bitcoin in Venezuelan society.


    Cryptocurrency is viewed in countries with a stable banking and political system
    as a volatile, risky venture. In Venezuela, where people are facing rapid devaluation
    of the local currency, Bitcoin plays the role of a stablecoin. Individuals receiving
    payments in the local currency, the Bolivar, cannot convert to fiat currencies.
    Holding dollars is illegal, to the extent that Patricia recalls being stopped
    by the police and having the few dollars in her wallet confiscated. Conversion
    to Bitcoin became a way to preserve value, transfer money between citizens and
    across borders, and store savings safely: “Bitcoin is much safer than dollars,”
    she explains.'
