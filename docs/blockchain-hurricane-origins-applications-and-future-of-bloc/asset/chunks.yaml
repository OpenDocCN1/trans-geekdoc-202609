    ## Abstract


    The hype around blockchain technology is matched only by the innovation it inspires
    and the skepticism it provokes. This book gives business decision makers and students
    a clear overview of the history, current applications, and future potential of
    distributed ledgers and cryptocurrency. It explores strengths and weaknesses,
    emerging opportunities, and perceived threats. Technical frameworks are presented
    in a business context to help strategists understand the risks and rewards of
    different approaches to blockchain implementation, and the decision factors in
    determining whether this is a viable solution to the problem at hand.


    Keywords: blockchain; cryptocurrency; distributed ledger; bitcoin, ethereum; hyperledger;
    permissioned; private


