- fmt: '

    The adoption of distributed ledgers in the private sector has moved reasonably
    quickly thanks to a combination of realistic problem-solving, talent coming into
    the sector in search of the next big thing, and development of underlying frameworks
    including the `Hyperledger` suite, `IBM Blockchain`, `Ripple`’s early innovations
    in the fintech space, and spinouts from `Ethereum`.


    The commercial imperatives surrounding the private sector have driven development
    predominantly toward permissioned blockchains. This fragmentation has been compared
    to stages in the adoption of the internet and World Wide Web by business: private
    intranets and bulletin boards were adopted before more open systems, and locally
    hosted servers are now gradually being superseded by cloud storage as infrastructure
    security improves and confidence increases. There are concerns around the long-term
    scalability of private blockchains, of which the most obvious is that in a blockchain
    without a native cryptocurrency, what are the appropriate mechanisms for trust
    once the network scales beyond known parties? This and other questions are already
    being addressed by developers at the coal face of distributed ledger evolution,
    and the next decade will be particularly interesting.


    What could be achieved with blockchain technology in a world unconstrained by
    commercial sensitivities? Let’s turn to developments which are emerging from a
    different source: the world of gaming.


    ## Chapter 5


    ### Digital Cats Will Change the World


    On the 30th birthday of the World Wide Web, Tim Berners-Lee confirmed what we
    all secretly believed. Asked by journalist Samira Ahmed, “Did you think there
    would be so many cats on the web?” Berners-Lee replied, “That was the plan all
    along, to fill the web with cat videos.” Joking aside, the social aspect of the
    internet is something that was not immediately foreseen when the technology started
    to infiltrate our homes. The earliest use of the World Wide Web reflected our
    habits and activities at the time, making them arguably more efficient and accessible,
    but fundamentally unchanged. We sent e-mails or set up web pages instead of sending
    letters (in my case and for many others these did, in fairness, feature a reasonable
    volume of cat pictures). We gradually came to trust stores on the internet to
    take our credit card details and keep them safe and secure, moving shopping online.
    The rise of the cat video came from the new social constructs of `MySpace`, `Facebook`,
    `Twitter`, and the explosion of platforms that now surround us, and from the peer-to-peer
    file sharing which preceded peer-to-peer payments. Our behaviors changed because
    of the technology and would not have done so without it.


    ### The Innovation Game


    One of the dangers of enterprise-led innovation is an underlying requirement to
    maintain the successful business model. Following the principle of “if it ain’t
    broke, don’t fix it,” even the most inventive companies can find themselves simply
    iterating for lower costs, or for the faster completion of existing processes
    which remain fundamentally unchanged. The risk associated with radical changes
    in behavior is sometimes too much for investors who are keen to realize a return
    in a short timescale. Return on investment can be difficult to quantify when technology
    is emerging. Project assessors will struggle to prove estimates of long-term cash
    inflows for traditional rate of return or net present value calculations. On the
    other hand, as we have seen, there is equal risk in innovation for its own sake.
    Some excellent ideas fall by the wayside when solutions are developed before clearly
    defining the problem. Workplace transformation is notoriously unsuccessful if
    it imposes new ways of working on unwilling subjects. If one end of the industry
    is hampered by risk aversion, and the other by overenthusiastic adoption of new
    technology regardless of its relevance, where can genuinely new concepts take
    hold and flourish?


    There is one sector whose great strength is its imagination. Some of the most
    exciting innovation in the blockchain space is coming from the gaming industry.
    This is hardly a surprise: gaming has been at the root of other major shifts we
    have already experienced in the technological landscape. User interfaces such
    as touch screens and virtual, augmented and mixed reality were adopted in gaming
    before getting a foothold in the mainstream of enterprise. As one of the steppingstones
    leading to the development of the internet and World Wide Web, the multiplayer
    `Empire` game on the University of Illinois `PLATO` system is recalled fondly
    by Eugene Jarecki who played it as a child growing up in the 1970s. The explosion
    of artificial intelligence in the 21st century owes much to gamers’ demands for
    faster gameplay and more detailed graphics. Hardware stepped up to keep pace with
    the needs of a lucrative industry, and the new generation of graphics processing
    units (`GPUs`) produced for gaming also enabled the complex data analysis and
    algorithmic learning at the heart of artificial intelligence.


    Gaming has inspired the development of concepts that could not have been otherwise
    realized without blockchain, and new behaviors are emerging which will have an
    impact upon the future of our everyday lives, at home and at work. Asset ownership
    has taken on a life of its own by using nonfungible tokens (`NFTs`) and their
    unique, indivisible properties to represent individual items. Where industry has
    been exploring the use of `NFTs` in asset twinning, gaming has taken the concept
    and run with it to introduce decentralized ownership and lay the foundations of
    a new and vibrant economy. At the same time, developers have had to address the
    challenge of capacity for the volume of transactions processed in a game and the
    amount of data that can be physically recorded on a blockchain. Games are remarkably
    complex when you break down the rules. Few of us realize how much processing we
    carry out internally when deciding on our next move. For effective automated gameplay
    there are hard decisions to be made about the value of each transaction and whether
    it is necessary to record everything on-chain, and the `smart contracts` governing
    each move must be highly efficient, costing gamers as little as possible in transaction
    fees and taking the minimum time to verify.


    Gaming innovations are moving rapidly and have implications for business models
    and commercial behavior in the future. Let’s look at them in more detail.


    ### A Gaming Mindset


    Ownership in a game is deceptive. When you have walked miles to catch or hatch
    a rare `Pokémon`, earned or paid good money to buy special outfits for characters
    in anything from `Angry Birds` to `Fortnite`, or mined the materials to construct
    your diamond castle, it feels as if you own something. You can compare `Minecraft`
    worlds with your friends and strut with pride in a multiplayer environment, but
    in reality ‘your’ assets remain firmly on the servers of the gaming company, or
    static in your licensed copy of the game. As Deckbound’s Gareth Jenkins explained
    at the 2018 Blockchain Game Summit, gamers are ready for blockchain: it fits their
    mindset. They have an expectation of ownership of the assets they create and win
    during gameplay, including the ability to buy and sell items. Marketplaces already
    exist for the exchange of items in many role-playing games (`RPGs`), but the assets
    themselves do not belong to the players who are trading them. Shifting to a state
    where there is individual ownership feels like a natural step and opens new doors
    for gamers. Blockchain provides the medium in which this can be achieved.

