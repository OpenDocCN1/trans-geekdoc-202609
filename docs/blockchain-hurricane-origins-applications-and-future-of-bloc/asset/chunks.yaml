    美国立法的层级结构以及伴随成文宪法的成法传统，在历史上导致了州和联邦层面法律错综复杂的局面，而这些法律之间可能相互冲突。围绕区块链和加密货币的早期立法也无例外。该领域的领导者是
    `Wyoming` 州，该州机构在 2019 年初已通过了 13 项新法律，支持并为区块链和加密货币创新营造了欢迎的环境。正如华尔街老兵、怀俄明州区块链任务组成员
    `Caitlin Long` 所解释的那样，这“使得创新和创造力……为怀俄明州带来了资本、就业和收入。”`Wyoming` 的法律涵盖了数字资产所有权、使加密货币业务符合联邦立法的托管，以及对金融科技创新者的支持等关键方面，并逐渐被其他州采用。它们注意到了美国将代币归类为证券而非实用工具的倾向，并据此制定了立法，以便在处理原生区块链证券时与对待任何传统证券的方式保持一致。


    2019 年 4 月，`SEC` 发布了其《数字资产“投资合约”分析框架》。该声明由 `Bill Hinman` 和数字资产与创新高级顾问 `Valerie
    Szczepanik` 签署，其目的是“一种帮助市场参与者评估联邦证券法是否适用于特定数字资产的报价、销售或转售的分析工具”，大部分数字资产销售可能被视为证券。紧随这一指导，`SEC`
    向新初创公司 `Turnkey Jet` 发出了其第一封“不采取信”（No Action Letter），针对其发行实用代币。`Turnkey Jet` 的代币销售被附加了如钢缆般的种种限制，包括要求资金不能用于开发软件平台的任何部分，且代币必须在应用程序内具有即时实用性。对`SEC
    框架`和`不采取信`的反应不不一，许多观察者对这种被视为持续的过度限制性立场感到失望。`Linklaters LLP` 美国金融科技负责人兼区块链与数字资产负责人
    `Joshua Ashley Klayman` 拥有一种哲学态度。在`框架`发布时，她在接受 `Modern Consensus` 采访时表示：


    > `SEC` 长期以来一直在说，几乎每一次数字资产销售都将是证券销售。我不知道为什么人们继续从他们那里期待不同的答案。我认为，如果我们想要不同的结果，我们需要看向立法者。


    立法者们已经准备就绪。在 `SEC` 的《代币指南》墨迹未干之前，美国联邦立法者就引入了两个支持区块链产业的法案：《2019 年代币分类法案》和《数字分类法案》。`Klayman`
    在《福布斯》上写道，“为非证券代币销售获得广泛的跨派支持是多么了不起和强大。”正如在 `Wyoming` 一，这些法案的主要驱动力似乎是对缺乏监管透明度的担忧，国会认为这阻碍了创新，并使企业流向更具欢迎性的司法管辖区。这些法案是根据区块链行业的反馈起草的，但仍然存在担忧，包括来自
    `Wyoming` 本身的担忧，`Caitlin Long` 指出《代币分类法案》与其他州已经颁布的一些法律之间存在冲突。美国继续努力在州和联邦层面一致地将区块链和加密货币立法成法，以消除歧义，但满足所有方的要求将是一个挑战。


    ## 英国


    英国金融行为监管（`FCA`）的任务相对简单，因为它在一个完全不同的法律框架内运作。英国法律并没有过度成法化。它依赖于原则和先例，并且没有将区块链和加密货币监管复杂化的意愿。`FCA`
    的指南根据加密资产的结构和设计用途对其分类。交易所代币（如 `Ether`、`Bitcoin`、`IOTA` 和 `XRP` 等对去中心化平台运行至关重要的其他加密货币）不在
    `FCA` 的监管范围之内，提供去中心化平台产品或服务的实用代币也是如此。如果证券代币与现实世界的证券共享特征（例如赋予持有者的权利或对回报的预期），则被识别为证券并受到监管。募集资金的实际用途与代币的界定没有关系：过山车票是实用工具，无论其销售募集的现金是否支付了施工费用。


    根据 `DLA Piper` 国际金融与项目小组负责人兼金融科技全球小组主席 `Martin Bartlam` 的说法，这种灵活性以及监管机构对原则和特征而非严格规则的依赖，为英国新兴的区块链和加密货币格局提供了一套独特的平衡指南。他对某些初创公司跳槽到司法管辖区的热情感到困惑，他们在
    `Gibraltar`、`Switzerland`、`Malta` 或 `Singapore` 建立业务，以获取他们认为更适合自己需求的不同框架，尽管他们的客户群在其他地方。这对“魔法互联网货币”思维是一种悲哀控诉，即首要任务有时不是为客户解决问题，而是为企业家避免问题。但对于大多数人来说，英国的监管方法支持真正的创新和可行的商业模式，并且脚踏实地。


    `Bartlam` 还观察到，甚至在加密泡沫在 2017 年底达到顶之前，通过该公司的 `ICOs` 数量已经显著下降。由于市场波动，现在寻求 `ICO`
    资金的更可行业务倾向于销售稳定币代币，这些代币挂钩于现实世界的法币储备或黄金。这是一个复杂的过程，但被认为比暴露于加密货币价值波动更好的行动方案。


    英格兰银行也做出了一些对加密货币产生积极影响的改变。行长 `Mark Carney` 在 2019 年 6 月宣布，非银行可以在那里开设账户，这最初影响了如
    `Worldpay` 等支付公司，并对几天前发布的具有“系统重要性”的 `Libra` 白皮书表示谨慎欢迎。`Carney` 多次表示他对通用的加密货币的支持。在
    2019 年 8 月于 `Wyoming` 举行的央行行长会议上，他建议全球数字货币可以成为世界储备，使全球经济免受美国波动的影响。


    ## 法国


    2019 年 9 月，在法国里昂（`Lyon`）举行的区块链游戏峰会上（Blockchain Game Summit），曾担任法国创新部长数字经济高级顾问的律师
    `Jean-Baptiste Soufron` 概述了法国对 `ICOs` 的方法。他解释说，资助开发新平台的代币销售可以比作为农场的牛群购买一头小牛。这种动物对于商业模式至关重要，并且从一开始就被视为实用工具。它可能需要时间才能成熟到足以产奶，并且可能会产生价值，但这些一个特征都不应排除其作为实用工具而非证券的考虑。


