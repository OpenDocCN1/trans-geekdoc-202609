    the void to unimagined functionality.


    Blockchain is in the same position now. Ten years after the inception of Bitcoin,
    the first boom-and-bust cycle of cryptocurrency mirrored the dot com journey.
    Speculative applications all but disappeared from the landscape as the ready money
    of the early days dried up, leaving the way clear for serious business models
    with longer term potential. There are still barriers to access and adoption although
    these are falling rapidly as organizations, notably cryptocurrency exchanges and
    blockchain game developers, innovate for ease of onboarding and develop applications
    with a seamless user experience. The main players in the space, I believe, have
    not yet emerged. And like the pioneers of the internet or the engineers behind
    the first railways we simply cannot foresee some of the societal and behavioral
    changes that await us.


    The Blockchain Journey


    Our journey begins with the launch of the first decentralized digital currency
    in 2009, something that researchers had been creeping toward for many years. The
    encryption techniques and the linking chain structure which underpin the Bitcoin
    blockchain were innovations standing on the shoulders of giants, but the eventual
    breakthrough published in Satoshi Nakamoto’s white paper delivered a new way of
    working. For the first time, Bitcoin demonstrated the creation and maintenance
    of a ledger in which transactions could be processed and recorded without the
    involvement of a central processing agency. It established a system where everyone
    has a copy of the ledger, everyone agrees that the transactions have been recorded
    accurately, and no-one can change the records.


    Where will this decentralized, transparent, trustless, immutable technology take
    us, with its complex consensus mechanisms and carefully constructed smart contracts?
    Blockchain has spawned champions and detractors in equal measure since developers
    took the first tentative steps beyond decentralized currency. In the years between
    the publication of the original Bitcoin whitepaper by the pseudonymous Satoshi
    Nakamoto in 2008, and the launch by Vitalik Buterin’s team of the Ethereum Virtual
    Machine in 2015, blockchain was essentially the preserve of cryptocurrency evangelists
    and developers. In 2017 this changed as cryptocurrency prices began to rise and
    mainstream media picked up on the story. The subsequent bull and bear markets
    attracted attention for their get-rich-quick potential and the schadenfreude of
    paper losses. Blockchain and crypto have exploded into the public consciousness,
    but perception varies wildly.


    In the minds of some commentators, it is the silver bullet that will come to the
    rescue when there seems no other way to solve difficult political and business
    challenges. Others are less convinced. In October 2018, British and American politicians
    were exposed to both ends of a polarized spectrum. At the British Conservative
    Party conference, the then Chancellor of the Exchequer, Philip Hammond, was asked
    about possible solutions for a frictionless land border between the United Kingdom
    and European Union on the island of Ireland in the event of Brexit.^([4](#08_Reference.xhtml#c1.4))
    “There is technology becoming available,” he replied. “I don’t claim to be an
    expert on it, but the most obvious technology is blockchain.” At the same time
    on the other side of the Atlantic, Professor Nouriel Roubini of Stern Business
    School testified to the U.S. Senate Committee on Banking, Housing, and Community
    Affairs: “Crypto is the mother of all scams and (now busted) bubbles, while blockchain
    is the most over-hyped technology ever, no better than a spreadsheet/database.”^([5](#08_Reference.xhtml#c1.5))


    Of course, the truth lies somewhere between the two. Roubini’s scorn for the scams
    and bad practice which characterized the early rush for unregulated investment
    in blockchain projects was valid, but his complete dismissal of cryptocurrency
    and blockchain ignored the widening adoption of crypto as a valid means of exchange,
    and the introduction of effective distributed ledger applications to solve genuine
    problems in multiple sectors worldwide. Hammond’s hope for a fast solution to
    a political impasse came at a time when blockchain was more about unrealized potential,
    possible use cases, pilot projects and proof of concept than effective, scaled
    applications. With a tight political deadline looming and an electorate to impress
    his statement smacked more of desperation than practicality, and according to
    the BBC’s Rory Cellan-Jones, it did not reflect the more practical opinions in
    the corridors of Whitehall. Blockchain is on course to help with smoothing the
    passage of goods around the world, but not in the short term, and not in isolation.


    Behind the Crypto Headlines


    Many people follow the stories about volatile cryptocurrency trading without any
    appreciation of the hive of activity that surrounds the technology beneath. The
    rise and fall of cryptocurrency prices and associated scams and snake-oil salesmen
    make for more lurid headlines. What often goes unreported is that this gold-rush
    fundraising with new cryptocurrencies (altcoins) and tokens was largely responsible
    for oiling the wheels of rapid, global, and largely collaborative development.
    A lot of good work has been going on under the radar to refine and expand upon
    Bitcoin’s original mechanism for decentralized, trustless, transparent transactions.
    Beneath the hype, there are highly respected professionals developing new ways
    of working, and a growing number of distributed ledger applications are ticking
    quietly away under the hood of regular software platforms. Multinational enterprises
    are putting the structure in place to revolutionize financial technology, supply
    chain management, utilities, and health care. Individual states, federal bodies,
    and sovereign nations are establishing legal frameworks for the protection of
    investors and the use of blockchain in asset registries, identity, and credentialing.
    The United Nations has a blockchain for social good agenda centered around its
    multi-UN agency platform,^([6](#08_Reference.xhtml#c1.6)) where it invites you
    to imagine:


    that 2.5 billion unbanked people will be included in the global financial system;
    that foreign workers will not lose $50 billion collectively per year when sending
    money to their home across the border;


    that people will know about the life story of a product when they buy it; people
    who created the product, the places that were involved, the material used etc.;


    that people will live without fear that their land might be appropriated by someone
    who comes to the door with a gun in their hands;


    that artists will gain autonomy over their copyrighted material and build direct
    relationships with fans;


    that patients will have control over their personal medical records;


    that foreign aid will reach its intended beneficiaries without losing 30 percent
    of its entirety.'
