    # 量子计算会摧毁支撑区块链的加密技术吗？


    在几乎每一个学习这项技术的论坛上，这个问题都会以某种形式被提出来。简短的答案是，量子计算更有可能加强加密，而非破解它。正如创新者、企业家、2018 年艾森豪威尔研究员以及前高盛执行董事总经理威廉·霍尔利（William
    Hurley，众所周知的`Whurley`）所说的：要深受灵感，而不是恐惧。


    这并不意味着未来的道路将一帆风顺。虽然由`工作量证明（Proof of Work）`保护的区块链结构和不可篡改性极不可能被破坏，但人们对以哈希形式存储在链上的数据安全性存在担忧。目前，量子计算机由物理学家编写，存在于超低温的`+0.5
    Kelvin`环境中，并执行特定的且极其复杂的函数，这需要的是量子比特（`Qubits`）处理能力而非比特（bits）。构成所有当前主流加密（包括支撑区块链和加密货币的加密）骨干的`256
    位`加密，对于量子计算机来说仅仅是破解的玩具。


    量子计算不太可能像战坦克对抗长矛那样被释放出来破解加密。量子计算将实现更强大的加密，而区块链、加密货币以及所有其他加密用户都会采用它。一个简单的类比是观察我们对密码的使用随时间的变化。破解
    20 世纪 90 年代的密码很容易，它们是短单词，也许是一个数字，很可能基于你第一只宠物的名字。我们现在理解到，长串无关的单词是最安全的选择，我们已经顺应时代进步了。


    继续这个类比可以说明人们对量子计算影响最担忧的领域。只要所使用的加密技术能跟上计算能力的演进，区块链的结构就是安全的。对量子计算潜在影响的研究承认，目前使用的某些`ASIC`（特定算法）矿机处理器已经接近现有量子计算机的速度。`Aggarwal
    等人^(8)`在`2017 年`的一篇论文中得出结论，量子计算机即使发展也不会获得优势。像`工作量证明`这样的共识机制的强度在于，它需要比可用更多的计算能力来更改早期的区块，并以比新区块添加更快的速度重新计算每个后续区块的算法。哈算力的逐渐增加不会影响链的完整性。真正的危险在于：首先，早期区块中加密的数据可能被破译；其次，量子处理可能破解签名周围的加密，足够快地破解私钥，以修改或阻止正在进行的交易。


    开发者和企业必须为保护遗留数据制定计划，并尽可能减少链上存储的信息量，但这与本就应该进行的归档管理和区块链高效利用活动是一致的。目前有几个计划正在开发更稳健的区块链框架，例如`量子抗性账本（QRL）`开源社区。通过这条路线开发的技术旨在设计能够抵抗未来量子能力的更安全的签名系统。最终，量子计算不会破坏区块链，但它将使其演进和改进。


    ## 令人向往的机遇


    区块链的一些潜在应用初看非常简单，非常适合这项技术，但它们要么具有隐藏的复杂性，要么是时代未到的想法。金融部门在改进审计功能方面蕴含着巨大的巨大潜力。


    ## 审计与会计


    会计的核心在于通过双式记法记录交易，因此区块链是一项非常相关的技术。它镜像了会计的审计轨迹，对于该行业的任何人士来说都是熟悉的领域。这项技术如果实施得当，具有提高记录真实性和可靠性的潜力。


    尽管`北信信（Northern Trust）`在私募股权交易方面与审计机构`普华永（PwC）`和毕马威（KPMG）`合作成功，但更广泛的审计领域要复杂。位于纽约的`Auditchain`一直在探索区块链在防止会计丑闻中的作用，而这些丑闻经常出现在头条新闻中。`2001
    年``安然（Enron）`公司的破产及其随后的“审计五强”之一`安达森（Arthur Andersen）`的倒闭导致了《萨班斯-奥克斯利法案（Sarbanes-Oxley
    Act）》的广泛监管，但问题依然存在。仅`2018 年`就发生了对`通用电气（GE）`的调查，以及其在 122 年后从道道琼斯指数中退市；英国几家知名公司的倒闭（包括建筑巨头`Carillion`、咖啡连锁店`Patisserie
    Valerie`和零售连锁`BHS`），以及南非 Gupta 商业帝国的解散。审计师遭到了严厉批评。作为`GE`一个多世纪的审计师，`毕马威（KPMG）`没有采取任何措施来抑制证券交易委员会（SEC）描述的
    GE“激进会计”行为。在英国，他们还受到财务报告委员会（FRC）的指责，指责他们“盖章”了未能代表`Carillion`业务真实状况的数字，并且在为客户提供丰厚咨询工作时存在利益冲突。他们在南非也面临批评，一名来自
    Gupta 团队的前`毕马威`审计师被指控行为不当和逃税。`财务报告局（FR）`就`BHS`倒闭对`普华永（PwC）`及个人员工进行了斥责并罚款，并批评`德勤天锐（Grant
    Thornton）`在签署`Patisserie Valerie`账户时没有发现其现金余额中显而易见的致命漏洞。


    `Auditchain`正试图在一个监管变得越来越严格的行业中取得进展，但这可能不是解决问题的正确方案。创始人`Jason Meyers`概述了支撑`Auditchain`方法论的核心信念：系统和控制目标的合规是审计中最重要的部分。如果系统运行正常，那么数据结构就是正确的，并且可以追溯到期初余额。如果我们将其放在`区块链`的背景下，那么如果对最近的几百个区块进行采样并发现是正确的，数据就可以一直信任到第一个（创区块），因为系统运行正常。在如此合规的情况下下，欺诈的成本将变得高不可企。


