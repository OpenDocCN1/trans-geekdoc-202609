    这是老牌游戏巨头 Atari 寻求创建代币的动力之一。在与 Atari Token 创始人 Daniel Doll-Steinberg 交流时，我们讨论了支撑这一及区块链其他发展的虚拟世界理论。现实世界的价值是通过出售你的技能、时间或资产创造的，如果游戏具备了执行相同经济和货币原则的机制，虚拟世界也可以创造类似的价值。通过在控制台上花费数小时磨练的技能开始在最高水平提供可迁移的现实世界价值。我们正见证电竞的崛起，例如英语电子足球赛
    `ePremier League` (`ePL`)；而在新生一代一级方程式赛车手手中，19 岁的兰多·诺里斯（Lando Norris）将其部分成功以及在赛道上判断其他车手的能力归功于多年的模拟赛经验以及参加
    `McLaren Shadow Esports` 赛的经历。甚至是《堡垒之夜》进入了竞技场，其 2019 年在纽约举办的世界决赛向数百百万粉丝直播。然而，直接在游戏平台内通过技能、时间或投资获取价值（而非通过离散的比赛），是一个完全全新的机会。如果能被利用——而区块链提供了实现这一点的途径——随后的价值创造将开启一个可持续的、民主化的全球经济。这就是游戏的颠覆性愿景，它驱动了小型敏捷公司的发展，而
    Atari 也意识到了这一点。


    ### Atari Token 的开发


    Atari 代币的开发过程比其他更知名的区块链游戏项目缓慢得多，且公开程度较低。作为一家纳斯达克上市公司，Atari 无法像小型企业和初创公司那样敏捷地投入
    ICO 领域，但他们的愿景引导他们在复杂的纳斯达克监管规定下规划代币销售。Doll-Steinberg 反思了为项目开发结构面临的压力，既要让创始人在创新环境中感到舒适，又要满足监管要求。他记得目睁睁看着一些几乎或没有业务经验的团队筹资并迅速失败，而
    Atari Token 的高技能创始人们却在走一条漫长的路。更敏捷的独立公司在计划的公开信息方面很大大方，但 Atari 受限于上市公司的，不能发布任何可能影响其股价或违反严格内幕交易法的信息。得益于
    2018 年 2 月巴黎证券交易所强制报告中的几行文字，媒体关注了这个故事，但此时 2017 年的牛市已经崩溃，ICO 黄金热正在迅速消退。ICO 计划在
    2018 年夏天被放弃，但 Atari 持续进行内部投资。


    ### 区块链游戏市场趋势


    区块链游戏的大部分开发集中在小型公司身上。这是我们在颠覆性创新中预期的。当互联网开始获得关注时，现有的市场领导者未能跟上浪潮，从车库出发的 Google 和从宿舍出发的
    Facebook 超过了他们。在游戏领域，大公司还没有动力改变策略。它们的业务模式是盈利且可持续的，它们与所有行业的大型企业处境相同，尚未准备好或无法实验并承担影响底线的的风险。然而，当转折点到来时，Atari
    至少准备好了做出反应。


    目前不受监管要求限制的创新者正在产生什么样的颠覆？从数字资产所有权中创造价值是第一个被实现的来源，而投入的时间和开发的技能的回报也远在不了。现在让我们关注数字猫，看看它们将如何改变世界。


    ### 加密猫与非同质化代币


    如果说猫视频是现代全球维网的标志，那么数字猫就是区块链和加密货币的旗手。当首个高著名的区块链游戏 `Cryptokitties` 在 2017 年 11 月推出时，它立即吸引了区块链社区的注意力。`Cryptokitties`
    市场在发布后的前几天内进行的交易量巨大，以至于 `Ethereum` 网络难以应对这种负载。这种兴奋并不完全是因为终于为你的加密货币提供了一个有趣的突破口。敏锐的开发者在阅读源码后意识到，一旦你购买了你的卡通猫，你就拥有了这只可爱猫科资产的绝对所有权。进一步的检查确认了当你将两只猫配对时，你拥有后代，而且每只猫都有从父母遗传并由执行育种交易的
    `smart contract` 定义的特征组合。每只猫的基因代码都作为非同质化代币 (`NFT`) 记录为独立的数字资产。我们在第二章中提到过编程货币：让我们回顾一下。


    ### ERC 20、ERC 721 和 ERC 1155 代币


    代币不仅仅是专利货币，它可以是价值的衡量、非货币资产或社区中的影响力。大多数基于 `Ethereum Virtual Machine` 并包含其原生货币的商业应用都在使用所谓的
    `ERC20` 代币。`ERC` 代表 `Ethereum Request for Comment`（以太坊意见请求），指的是开源社区中相关的讨论，这些讨论导致了每种代币的发展。从编号可以明显看出，有很多提议被讨论，但只有少数是可行的并被开发者社区采用。`ERC20`
    是数字现金：这些代币通常被称为山寨币（alt coins），它们的行为像钱。所有代币都是相同的且可分割的，就像美元钞一样。数千个 `ERC20` 代币被创建出来。许多已通过
    `ICO` 用于商业众筹，其中一些随着相关应用的获得关注而保留并增加价值，另一些则一文不值。此类代币通常被称为“垃圾币”（shitcoins），而无价值的持有物在投资者中被称为“尘埃”（dust）。大多数基于区块链的游戏直接使用
    `Ether` (`ETH`) 进行游戏内购买和操作，尽管少数游戏在奖励和留存机制中内置了自己的 `ERC20` 货币。


    游戏利用了另外两种具有特殊属性的 `ERC` 代币。`Cryptokitties` 游戏及类似游戏采用了 `ERC721` 作为其选择的代币。`ERC721`
    是独一无二的代币。它们仍然可以自由交换，但每个代币的个体相对价值将根据其特定特征、唯一性和稀有性而异。在技术术语中，这意味着代币不是同质的。同质性（fungibility）是货币的一个属性，例如，任何美元钞都可以用来购买价值一美元或更低的饮料，差额构成了稳定的交换价值。相比之下，非同质化代币
    (`NFT`) 代表独特的、离散的物品，一种收藏品，根据自身的属性和买家的感知拥有自己的价值。


    在 `Cryptokitties` 的背景下想象 `NFT` 非常简单。尽管所有的猫都有基本的卡通轮廓，但由于赋予了它们的基因特征，每只猫都略有不同。某些人发现某些特征具有吸引力，并对紫爪猫或另一只驾驶卡丁车的猫赋予主观价值。它们也是不可分割的：你不能把它们切开，那是残忍的。


