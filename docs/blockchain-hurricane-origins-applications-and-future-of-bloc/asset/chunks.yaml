    outside the world of online gaming. What assets in the real world are unique and
    could be represented accurately and immutably in the parallel digital world? This
    is something that is being investigated by both the private and public sectors
    and will drive changes in provenance, investment, property ownership, asset twinning,
    and other applications.


    The ERC1155 standard, finalized in June 2019, combines both fungible and nonfungible
    token types under a single banner. Championed by developers Enjin and supported
    by the wider Ethereum developer community, the token allows a single smart contract
    to manage different classes of asset within a game. As Enjin’s Witek Radomski
    explains, in a fantasy role-playing game the fungible type is “useful for stackable
    items that don’t need to be differentiated, like a bundle of arrows for a bow”
    whereas “a pet dragon… could be an NFT and have a unique name of its own, a power
    level, and a rich history in the game.”^([8](#08_Reference.xhtml#c5.8))


    Now that assets of all types can be owned, we start to see value creation from
    investment. Mechanisms in a wide variety of games allow collectors to enhance
    their kitties and improve their resale value, train their pet dragons for higher
    value and greater game success, or even rent out virtual land to other players.
    The value that players ascribe to assets is another aspect of the unique gaming
    mindset: investment in the game.


    Paying for Play


    It is immediately striking that gamers in the blockchain space are willing to
    pay to play. Every token must be purchased, or transaction fees paid to generate
    new tokens within game play (for example, when breeding new Cryptokitties). In
    a world where we have become used to getting things for free, this may seem a
    counterintuitive development, but the free model is not sustainable for economic
    success in the long term, as many platforms and publishing houses are belatedly
    discovering. Bringing a monetary culture back into the mainstream has positive
    implications both for rewarding creators and for the sustainability of an alternative
    economy. Crucially, it shifts the focus from spending purely for gaming enjoyment
    (paying for upgrades in a standard game, for instance) to potentially earning
    a return on the investment of time and money made in playing.


    Cryptogames entrepreneur Gabby Dizon of Altitude Games defined three characteristics
    of gamers in the blockchain space when we spoke in May 2019.


    Collectors are most interested in buying and holding some of the rarer NFTs in
    a game. They are the equivalent of real-world hobbyists, enjoying their collection
    and adding and divesting assets for pleasure as time goes on. They may well profit
    from their activity in the long term, but making money is not their primary motive.


    Investors have a return firmly in mind. They want to make a profit from the portfolio
    of assets that they buy, or at the very least make enough to break even on their
    investment and then play without any further risk as fiat to crypto exchange values
    fluctuate. The return could come from straightforward buying and selling or equally
    from mechanisms in the game which generate income from the assets held. In Cryptokitties,
    owners can hire out their kitties for breeding and earn siring fees. In Axie Infinity,
    land parcels can be rented out, and there are similar gameplay constructs in most
    emerging blockchain games.


    Players will include people in both of these other groups but cover a much wider
    spectrum, from high-school kids through to seasoned gamers who simply play for
    the fun of it. Any earnings from their investment in the game come as a bonus.
    These are the people who are more likely to start creating value through their
    gaming skillset and the time they spend on a platform. As e-sports have started
    gaining traction and value, so we can expect the top players of fantasy games
    and RPGs to have an opportunity to develop online careers. The implications for
    the future of work are staggering.


    It is vital to the emerging game economy that there is a balance between these
    different types of users. When a game launches, the investors and collectors are
    the first to engage, but it is the regular play and volume of activity among the
    community of gamers that determines the success of the platform and the returns
    to be made.


    Cryptokitties, as the first game to hit the headlines, is fundamentally a collecting
    game. The smart contracts that govern the genetic code in generation after generation
    of cats reveal rare traits and incentivize owners to continue breeding and buying
    to increase the value of their portfolio. The game suits the collectors and investors
    who seek long- and short-term returns on their ETH purchases—and there is money
    to be made. Shortly after launch, one kitty sold for 253 ETH, and in September
    2018 another was purchased for 600 ETH,^([9](#08_Reference.xhtml#c5.9)) although
    these figures are unusually high.


    The static collectables format is unlikely to hold the attention of hardened gamers
    in the long term. Hard on the heels of simple structures like Cryptokitties and
    Gods Unchained we start to see games coming through which combine the ownership
    of NFTs with active gameplay, for example Axie Infinity, which features collectable
    characters, battles between teams, breeding of new Axies, and land ownership and
    management, or the groundbreaking Neon District. Bringing such complexity onto
    the blockchain requires and inspires even greater innovation in terms of ease
    of access, scaling, transaction processing, and overall user experience. We will
    address these challenges later in this chapter: for now, let’s look at the final
    piece of the jigsaw for successful game development.


    The Importance of Community


    Social media started to change our communication habits from around 2008 onward,
    and enterprises in multiple sectors have homed in on community engagement as a
    key marketing tool. Community management is a new but important discipline for
    holding the attention and loyalty of consumers. Advertising practice has shifted
    over the decades along a continuum from “telling”—one-way communication on billboards,
    in print and on broadcast media—through interaction between the enterprise and
    the customer, to “listening,” which encompasses everything from review sites to
    semantic and sentiment analysis of social media posts. Good community practice
    takes this one step further, creating a networked structure with layers of engagement,
    which holds the interest of consumers or employees and makes them feel a valued
    part of the whole. Achieving a truly mature community made up of diverse individuals
    is often difficult. The Community Roundtable’s maturity model^([10](#08_Reference.xhtml#c5.10))
    defines the expected development stages of a successful community and is based
    on a large body of research on engagement and management strategies stretching
    back to the earliest days of corporate intranets.'
