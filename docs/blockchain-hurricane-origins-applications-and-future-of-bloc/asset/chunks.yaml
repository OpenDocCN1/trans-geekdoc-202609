    英国国家档案馆（National Archives）与萨里大学以及开放数据研究所（Open Data Institute）合作，开展了一项特别的人工智能与区块链结合试点。`ARCHANGEL`
    项目于 2019 年发表了关于利用区块链强调档案真实性的工作，这不仅展示了一种解决存档挑战的方案，可能对其他媒体的身份验证产生更大的影响。英国国家档案馆的马克·贝尔尔（Mark
    Bell）向我详细介绍了这项为期两年的项目。团队最初开始尝试在归档中使用区块链用例。档案馆提出的挑战之一是，如何管理用于录制和存储视频片段的介质的快速变化。作为消费者，在我们的一生中，我们见证了家庭活动的摄像录像机磁带被转换为
    VHS，然后是 DVD，最后是 MP4。我们如何确保在 MP4 上看到的童年影像与 20 世纪 70 年代那个夏天拍摄的磁带是一样的呢？


    通过比较哈希值（hashes）来验证记录的身份已经非常成熟，并已应用于原生数字记录。任何此类文件在发送时都会进行哈希处理，并在作为中心化流程的一部分在部门间传输时于接收时进行验证。团队解决的区块链挑战之一，是研究将相同的技术应用于在出版多年后对大学原始研究数据进行独立、去中心化的验证。视频记录呈现了一个得得的问题。当你从一种格式转换到另一种格式，或者从高分辨率降到低分辨率时，如何验证内容呢？即使内容相同，VHS
    视频的哈希值与相同且未受损的 MP4 文件的哈希值也会不同，因为格式数据会导致记录发生变化。这正是人工智能介入并增强解决方案的地方。


    `ARCHANGEL` 团队引入了内容感知深度学习，以剥离记录中特定格式的数据并分离出底层的视频片段。视频记录的每个版本都有与原始文件相关的哈希值，而共同内容是贯穿档案的可追溯哈希值。当记录的透明度需要一条不可变的公共证据链时，区块链就发挥了作用。这是两项互补技术发挥各自优势的绝佳案例。这种区块链的实现还存在英国国家档案馆特有的细节。他们持有的记录根据英国法律可能会封锁几十年：例如，人口普查数据在收集整一百年后才会发布。在这种情况下，即使是文件名也是敏感的。这需要一种许可结构，而
    `ARCHANGEL` 目前正在使用 `Ethereum`，采用开放和关闭记录以及权威证明（Proof of Authority）共识机制。


    团队还与国际档案馆进行了试运行，包括美国国家档案馆和记录管理局（NARA）、爱沙尼亚、挪威、澳大利亚的机构以及苏格兰国家记录局。这项工作的重要部分捕捉了存档文档的标准哈希值，并证明了区块链本质上的协作性质。


    贝尔指出，当项目在 2016 年启动时，目标仅仅是为档案馆的视频记录开发可靠的身份验证。在过去的几年里，深度伪造（deep fake）视频丑闻浮出，真实性问题被推向了公众视野。对于研究团队来说，这是一个显然的下一步，他们验证受控视频片段的解决方案可以转向识别欺诈内容的任务。发现一个引发新兴技术解决方案的兴起问题，令人耳目一新。


    ## 来源与真实性


    我们已经看到了身份验证领域正在开展的工作。稀缺且高价值的商品是伪造的磁石，而区块链正在帮助应对这种现象。获得可靠的真实性证明是一个问题，而改进的验证则提供了解决方案。


    通过追踪组件、成分和材料的来源，购买者可以确信商品符合所有相关的质量标准，并且是正品。减少伪造和提高标准的潜力是巨大的。将简单的来源链与 `smart contracts`（智能合约）相结合，可以平滑参与者的现金流，即使是跨国也是如此。这种区块链技术的应用可能是最先进的，有多个系统正在开发中，一些已处于客户就绪阶段。


    ## 从生产到消费


    ### 金枪鱼、芒果及更多


    供应链经常被引用为分布式账本技术的完美用例。对制造品源头日益严格的审查、对我们用物品对环境影响的担忧，以及全球范围内不同的健康与安全、质量或就业惯例标准，都可以通过提高透明度和可追溯性来解决。潜在地，从原材料到成品的每一步都可以通过区块链进行记录和验证。


