- fmt: '

    David Chaum is still active in cryptography: he founded the International Association
    for Cryptologic Research, the cryptography group at the Center for Mathematics
    and Computer Science in Amsterdam, the Voting Systems Institute, and the Perspectiva
    Fund. He is also working on a new cryptocurrency structure, Elixxir, revisiting
    his original Blind Payment principles.


    # Cypherpunks and B-money


    The 1990s saw the emergence of the Cypherpunk movement. Timothy C. May wrote “The
    Crypto Anarchist Manifesto” in 1988,^([4](#08_Reference.xhtml#c2.4)) an eerie
    predictor of the “social and economic revolution” that the subsequent development
    of cryptography and the internet enabled. A community emerged from the Cypherpunk
    group’s mailing list as concerns grew around state control of strong encryption.
    In the United States, encryption was classed as a munition thanks to its vital
    role in securing communications during wartime. With the advent of personal computing
    the technology became commercially necessary, but government restrictions meant
    that exported software could only use 40-bit encryption to secure its user licenses,
    something that could be cracked in a matter of days by the average user. The Cypherpunk
    movement stood up to National Security Agency (NSA) attempts to stifle research
    and classify patents and succeeded in bringing strong encryption into the public
    domain. This battle is well documented in Stephen Levy’s 2001 book, `Crypto: How
    the Code Rebels Beat the Government Saving Privacy in the Digital Age`^([5](#08_Reference.xhtml#c2.5))


    On May’s 1992 e-mail to the group,^([6](#08_Reference.xhtml#c2.6)) reproducing
    the original manifesto for a new audience, his signature includes word tags that
    were obscure at the time but are familiar to us today: encryption, digital money,
    anonymous networks, digital pseudonyms, zero knowledge, reputations, information
    markets, black markets—and collapse of governments, anticipated in the anarchist
    vision as a result of the adoption of these technologies and behaviors. It is
    interesting to reflect that scandals broken through WikiLeaks have had a de-stabilizing
    influence in just this fashion: Julian Assange, the WikiLeaks founder who also
    authored the 2012 book `Cypherpunks: Freedom and the Future of the Internet`^([7](#08_Reference.xhtml#c2.7))
    was a member of the group.


    The Cypherpunk community grew throughout the decade and become a major influence
    on the development of the cryptocurrencies we know today. The group featured extremely
    high-quality technical discussions alongside the social niceties, distractions,
    and trolling that arise in every community. The first recipient of a bitcoin transaction,
    Hal Finney, was a participant, and it is extremely likely that the person or persons
    unknown behind the `Satoshi Nakamoto` pseudonym were also Cypherpunks.


    Another Cypherpunk community member, computer engineer Wei Dai, published a post
    in 1998 reflecting on the need for “a medium of exchange (money) and a way to
    enforce contracts” should centralized governments become obsolete.^([8](#08_Reference.xhtml#c2.8))
    He suggested solutions for the transfer of money using a distributed ledger; the
    creation of digital “b-money”; and a process for the effecting of contracts. Wei
    Dai suggested that transparent transactions should be announced to the whole network
    to avoid duplication. He described the minting of new coins through the mining
    process and defined the need and possible structure of smart contracts. These
    were some of the key missing pieces.


    During this period the internet went from strength to strength. The emergence
    of native cash displayed by the likes of `Napster` (1999) `PayPal` (2001). Twenty-five
    years after the first steps were taken on the long road to decentralization.


    # Satoshi Nakamoto Versus the Banking Establishment


    They say that necessity is the mother of invention, and it took the mother of
    all disasters to trigger the creation of the first cryptocurrency, Bitcoin.


    On August 9, 2007, BNP Paribas froze three of its funds, revealing that it was
    unable to value the collateralized debt obligations (`CDOs`), bundles of subprime
    loans. The debts in question had been individually classified according to their
    level of nonpayment risk, but then bundled together as collective assets, traded,
    shuffled, and cut like decks of cards, and bought and sold within the global banking
    ecosystem. Every transaction further obfuscated the nature of the debts until
    it became apparent it was impossible to place a reliable value on the bundles.
    The valuations upon which the banks had built their castles were not rock, but
    sand. Just five weeks later, Northern Rock, a British bank that specialized in
    high loan-to-value mortgage lending, found itself unable to offload its subprime
    bundles to the market. Its request to the UK government for support triggered
    a run on the bank as savers queued around the block at every branch to withdraw
    their cash. This was the first high-profile casualty of the torrid 18 months that
    followed. A year later, the U.S. government bailed out mortgage lenders Fannie
    Mae and Freddie Mac, but Lehman Brothers, Washington Mutual, and Wachovia filed
    for bankruptcy. Iceland’s three largest commercial banks collapsed, taking the
    savings of offshore customers with them. The economics editor of the Guardian
    newspaper, Larry Elliott, said with hindsight:^([9](#08_Reference.xhtml#c2.9))
    “As far as the financial markets are concerned, August 9, 2007 has all the resonance
    of August 4, 1914. It marks the cut-off point between ‘an Edwardian summer’ of
    prosperity and tranquility and the trench warfare of the credit crunch—the failed
    banks, the petrified markets, the property markets blown to pieces by a shortage
    of credit.” The collapse exposed the high levels of risk in the practices of centralized
    institutions and our misplaced trust in the banks which played fast and loose
    with our cash without any transparency. On October 31, 2008 a paper was published
    under the pseudonym `Satoshi Nakamoto`. It was entitled “Bitcoin: A Peer-to-Peer
    Electronic Cash System.”


    ## An Elegant Solution

