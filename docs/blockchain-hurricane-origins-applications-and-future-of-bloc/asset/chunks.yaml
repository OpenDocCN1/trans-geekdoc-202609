  raw: 'Transaction speed, or latency, is a different side of the scalability equation.
    According to the Kraken cryptocurrency exchange, the actual time taken to move
    a coin from one wallet to another varies across a broad range from the near-instant
    Ripple and Stellar to a full hour for a Bitcoin payment. A significant part of
    the speed equation is the consensus mechanism used by each blockchain. Proof of
    Work is pure but slow. Any attempt to speed this up, for instance by making the
    mining algorithm easier, compromises the security of the blockchain. The Ripple
    protocol consensus algorithm, the EOS delegated Proof of Stake consensus, and
    Stellar’s federated Byzantine agreement system (FBA) are all examples of effective,
    fast mechanisms, but there are concerns over centralization where validator numbers
    are limited. This suggests that there is a trade-off between true decentralization
    and transaction throughput.


    How will the speed and volume of processing grow? New blockchains are being developed
    with speed and scalability in mind. There are plenty of teams waiting in the wings
    and reporting test processing at hundreds of thousands of transactions per second.
    The market is skeptical of many of these claims simply because showing fast processing
    on a test net and a limited network of servers is very different to transactions
    in the real world. However, there are some exciting projects underway. Among these
    is Algorand, launched in July 2019, which has attracted a lot of attention with
    its platform claiming a throughput of 1000 TPS and a five-second latency at a
    test volume of half a million transactions. It uses a new Byzantine Agreement
    protocol for consensus by committee with verifiable random functions to select
    the user who will propagate the next block as the chain grows.^([18](#08_Reference.xhtml#c5.18))


    Sharding


    The Ethereum network is considering a concept known as sharding. This is used
    in traditional database management where large data repositories can be partitioned
    for faster processing. It is used for huge databases where users would otherwise
    be waiting a long time to retrieve their information from one source: multiple
    data shards speed up the process. Search engines, large e-commerce sites, and
    CRM systems all use sharding techniques. The parallels with the needs of blockchain
    are clear. The Ethereum sharding project aims to split validation workloads among
    different groups of miners, breaking the whole blockchain into shards or microchains
    carrying only a fraction of the transaction data. Since the nodes would no longer
    need to process each and every transaction, this can theoretically increase the
    speed and throughput of the network. There are complexities to be addressed with
    sharding, not least in security, ensuring that a particular shard cannot be compromised.
    However, randomizing the allocation of each shard and changing nodes regularly
    is one solution.


    Ethereum is not the only protocol looking at sharding. It is also of interest
    to Hyperledger, and some new blockchain projects are adopting sharding structures
    from the outset. As the concept has been proven in centralized databases, it is
    only a matter of time before the additional considerations for implementation
    in a decentralized setting are resolved. However, for the existing blockchain
    ecosystem, simple linear scaling is not going to put Bitcoin on a par with Visa,
    and sharding may not be the answer to every question.


    Let the Side Chain Take the Strain


    Bitcoin, Ethereum, and other truly decentralized blockchains run on what is known
    as a “gossip” protocol. This means that every transaction is broadcast to every
    node. This is one of the great strengths of the technology but as transaction
    volume grows, there are no easy economies of scale to be found. Developers are
    working on solutions that sit alongside the established system without compromising
    its structure. One of the most straightforward approaches to scaling has been
    the development of side chains as a second layer on the established protocols.


    Side chains were first proposed in a 2014 paper by Back et al.,^([19](#08_Reference.xhtml#c5.19))
    which introduced the concept of “pegged sidechains.” It suggests the “transfer
    \[of\] an asset from the (original) parent chain to a sidechain, possibly onward
    to another sidechain, and eventually back to the parent chain, preserving the
    original asset.” These side chains, the authors continue, would be independent
    blockchains and as such could host innovative development and experimentation.
    It is a concept that has been adopted and taken forward successfully by several
    developer groups. Let’s look at the innovations around the Lightning Network on
    Bitcoin and the gamer’s favorite, the Loom Network.


    Lightning Network


    The first generation of live side chain projects began with the Lightning Network
    on the Bitcoin protocol. In their 2016 paper,^([20](#08_Reference.xhtml#c5.20))
    authors Joseph Poon and Thaddeus Dryja proposed “scalable off-chain instant payments”
    for the Bitcoin blockchain. The authors recognized that as every change in state
    of the Bitcoin ledger is broadcast across the network, this could never be scaled
    to compete with the centralized payment systems currently servicing the world’s
    commerce. They proposed that transactions could be processed in separate channels
    with only the final change of state being broadcast. This decongests the network
    and reduces the costs to the user as fees are only payable to miners when the
    change of state transaction is processed on the main blockchain.


    A good example of how this works in real life is simple day-to-day micropayments.
    Want to buy your coffee in Bitcoin? Waiting for validation and confirmation from
    the network means a long line and cold coffee. Instead, such micropayments can
    be managed through a Lightning Network app. You set up a small balance in Bitcoin,
    much like a prepay debit card, and buy your coffee using this balance. At any
    point, either when you no longer need this one-to-one link to your vendor, or
    at a point in time such as the end of a month, the change of state, not the individual
    transactions which led to it, can be written back to the blockchain. In accounting
    terms, which are a good analogy, the side chain holds individual journal entries
    for each coffee purchase in a ledger account, and the Bitcoin blockchain shows
    only the opening and closing balances of that account at a point in time.


    Lighting Network developers have addressed a number of security concerns, including
    how to manage disputes about the account balance on a side chain without compromising
    the main blockchain record. Lightning has inspired a wave of side chain innovation.


    Plasma


    Plasma is a development layer on Ethereum with a similar goal to sharding, but
    a structure not dissimilar to that of Lightning. It enables the creation of “child”
    chains with their own distinct properties, which use the main Ethereum blockchain
    as the trusted source. Special smart contracts on Ethereum known as “root contracts”
    contain the rules that govern the behavior of each child chain. Plasma is still
    in development as a standalone solution, but it has been adopted to reinforce
    asset security in the Loom Network.


    Loom Network


    How do you deliver a decentralized gaming experience without slowing to a crawl?
    The answer, according to the Loom Network, is to develop application-specific
    side chains.'
