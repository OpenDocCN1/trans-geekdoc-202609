    Gaining access to a store of value and payment mechanism is attractive for those
    who are disadvantaged by being unbanked, and for cash economies such as the emerging
    cannabis industry. Cryptocurrency fills a vacuum where banks cannot or will not
    step in, whether this is a result of external regulation or their internal business
    model. This is a problem close to home. According to Federal Deposit Insurance
    Corporation research,^([19](#08_Reference.xhtml#c3.19)) 6.5 percent of U.S. households
    are unbanked, and a further 18.7 percent underbanked, representing 32.6 million
    households in the largest economy on the planet. If these households were able
    to use cryptocurrencies as easily as bank customers use fiat currencies, this
    would reduce economic exclusion.


    ## Case Study: Abstrakt


    Companies such as Austin-based Abstrakt are already working toward this goal,
    aiming to make cryptocurrency use uncomplicated and secure. Speaking to founder
    Corey Segall, he reinforces the need for a straightforward user experience to
    help adoption while ensuring that the individual has ownership of their assets
    and data. Banking clients and users of payment mechanisms such as `PayPal` have
    access to good mobile applications, which enable quick and easy transactions:
    why should this be any different with cryptocurrency? The challenge, of course,
    is that where a user holds the keys to the safe, they have full responsibility
    for the security of the assets. If mistakes are made in banking, or on any platform
    where there is good custodianship, there is recourse to a centralized ledger.
    If individual users make mistakes in the management of crypto assets, for instance
    sending funds to the wrong wallet, or worse, losing the private keys which are
    the sole means of access to your assets, then there is no way back.


    Abstrakt’s proprietary technology is available publicly as the `VaultWallet` mobile
    app but is more usually found under the hood of a number of fintech and blockchain
    applications. It addresses these two worst case scenarios of cryptocurrency use
    with outwardly simple transactions (from whom, to whom, and how much) backed up
    by innovative sharded key management strategies and automatic server-side fraud
    detection mechanisms. The focus is on delivering a high level of security for
    the user from several angles. The system is protected against direct attacks by
    its distributed nature, against fraud through confirmatory signing if the transaction
    is clean, and against user error with a series of backup options, which are carefully
    designed to avoid any custodian relationship. Ultimately, says Segall, for day-to-day
    transactions users should experience the same ease of use with cryptocurrency
    as they have with their credit card or checking account.


    ## Libra: A New Pathway?


    In June 2019, the publication of the Libra white paper by Facebook opened a new
    channel for cryptocurrency adoption, and according to Andreas M. Antonopoulos,^([20](#08_Reference.xhtml#c3.20))
    brought into being a third construct: “money of the corporation.” It had long
    been speculated that at least one of the Silicon Valley giants would bring out
    its own cryptocurrency, with work going on not only at Facebook but at Amazon,
    `Apple`, and `Google`; this whitepaper was the first shot across the bows of traditional
    banking. The launch of `Libra` was originally planned for mid-2020, subject to
    production and regulatory hiccups, but the project suffered early setbacks with
    the withdrawal of major founding members including `PayPal`, `Visa`, `Mastercard`
    and `Stripe`. Despite this, the publication of the Libra whitepaper was significant
    for several reasons.. First, it changed the dynamic between cryptocurrency and
    banking overnight, making a worldwide user base of two billion and a wider public
    aware of an alternative to “money of the government” backed by a recognized brand.
    It represented more of a threat to banks than to established decentralized currencies,
    which regulators were not slow to recognize. Second, it was designed to be a seamlessly
    accessible medium for peer-to-peer payment. Once ease of use of a corporate currency
    is established across a large population, the world of traditional cryptocurrencies
    opens up to users who are more discerning about privacy, neutrality, and value
    conferred by the community rather than by a basket of fiat currencies.


    Widespread cryptocurrency adoption will be influenced by corporate cryptocurrencies,
    but there are many more factors at play, along with considerations for the protection
    of individual users and the practicality of using digital cash in the real world.
    Let’s look more closely at the custodians of cryptocurrency and ways of reducing
    friction at the edges of the crypto ecosystem.


    ## The Contradiction of Custodianship


    From cryptocurrency’s anarchic beginnings, the intention was that `Bitcoin` and
    those coins that followed should be money of the people, decentralized and unfettered
    by agency or authority. The people had other ideas. As the equipment required
    to mine cryptocurrencies became prohibitively expensive and enthusiasts sought
    to invest in this new asset, exchanges sprang up to meet the need of buyers and
    sellers. Of course, once coins could be purchased through a digital intermediary
    the temptation for new investors was to leave their coins on the exchange. This
    was the curse of the familiar: exchanges began to be de facto banks. It is ironic
    that while the Bitcoin white paper was published in the wake of 2007 to 2008 banking
    crash and offered a decentralized alternative, the increasing numbers of Bitcoin
    holders turned toward what looked like traditional structures to manage their
    accounts.


    ### Risks of Individual Control


    Cryptocurrency holders are encouraged by the community to move their assets from
    exchange wallets to private storage, and on January 3,2019 the first `Proof of
    Keys` event took place. This date, the tenth anniversary of the Bitcoin Genesis
    Block, was chosen as a reminder for holders to be sure they had private keys for
    all of their assets and to move long-term investment coins into more secure private
    storage. For newer entrants, this felt like jumping out of the frying pan and
    into the fire, a step out of the familiarity of bank-like exchanges to a new world
    of holding your money in what amounts to a digital personal safe. But even if
    you have control of all your assets, are they really as secure as they can possibly
    be?


    Even the most careful cryptocurrency investors have fallen foul of manipulation
    and theft from their private wallets, to say nothing of the Bitcoins which have
    been lost down the back of the virtual sofa over the years thanks to misplaced
    keys, destruction of records, or accidentally junked hardware. Cryptocurrency
    theft is a growing phenomenon, particularly where hackers exploit the security
    around individually held assets to gain entry. In November 2018 a group of investors
    sued both `AT&T` and `T-Mobile` for negligence in allowing the SIM cards on their
    accounts to be replaced in response to verbal requests from hackers.^([21](#08_Reference.xhtml#c3.21))
    The replacement SIM cards were then used to pass two-factor authentication controls
    and access wallets: one victim reportedly lost 3 million unspecified coins, while
    another quantified the loss at the time at $621,000.


    Investors are caught between the risk of trusting a centralized exchange with
    their decentralized assets, and the risk of disaster in their own hands for which
    there is little or no recourse. Cryptocurrency cannot scale effectively with this
    degree of risk associated. How can we move forward?


    ## Watching the Watchmen

