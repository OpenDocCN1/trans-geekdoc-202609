    Paxos 协议一直是许多共识机制开发的基石，但目前的格局正在发生分化和演变。Hyperledger 和 Intel 的 Sawtooth Lake 框架使用了
    `Proof of Elapsed Time (PoET)`。这是一种抽票共识机制，网络会轮询每个活动节点中的 Intel 芯片，以查看哪一个的等待等待时间最短（随机选择）。该节点被选为领导者并创建链中的下一个区块。其他
    Hyperledger 框架则转向了投票机制，例如 `Yet Another Consensus (YAC)`、如 `Kafka` 等排序服务，或者转向了`简化拜尔庭容错
    (SBFT)` 模型，这是因为在私有分布式账本中，所有节点都是已知的。`Raft` 共识机制于 2019 年推给 Hyperledger 用户，其开发目的是产生一种易于理解的共识机制，分离了共识的关键要素，为系统构建和教育奠定了良好的基础。


    随着更多公有和私有区块链的发展、采用率的提高以及对密码学理解的进一步加强，我们可以预计看到更多专门的共识机制和通用标准的出现。


    加密货币的爆发和区块链应用的发展让创业者感到兴奋，也让监管机构高度警惕。让我们在第 3 章看看这种复杂的关系是如何发展的。


    # 第 3 章


    ## 魔法互联网货币


    钱不是树上来的，但受 J.R. Willett 启发的`代币发行 (ICO)` 众筹方法导致加密货币到处萌发。这种新的筹款方式吸引了善意创业者和骗子的共同关注。这是一个通过发行应用程序原生代币凭空产生的不受监管的“魔法钱”，一些运行在
    `Ethereum` 之上，另一些在全新的区块链上生成。广大社区对加密货币日益增长的兴趣，意味着这种区块链项目的众筹吸引了那些追求下一个重大科技成功的资金。


    其中一些项目具有真正的创新性，基于良好的商业直觉，并通过提出合适的解决方案来解决现实问题。某些项目致力于开发能够长期支持分布式账本的技术栈，为未来的开发制定了协议和工具。另一些则直接追求消费者采用，成功程度不一。著名的且持续实现其原始愿景的早期
    ICO 包括 `Ethereum`、`IOTA`、`NXT` 和 `Augur`。其中三个涉及区块链更广泛使用和易于采用的基础设施：`Ethereum` 及其智能合约和
    `Virtual Machine`；`IOTA` 及其不断演进的加密以及通过 `Tangle` 验证机制实现的可扩展物联网交易；以及 `NXT`，发布了一个用于金融和公共服务的开源区块链，并使用
    `Proof of Stake`（权益证明）共识。`Augur` 项目则是面向用户的：一种点对点的预言机和预测市场协议，用户因正确预测未来事件的结果而获得财务奖励。


    围绕区块链解决旧问题的新方式，出现了一许多优秀的概念和创新。正如风险投资人 Alyse Killeen、Gil Beyda 和 Jimmy Song 在 2019
    年 3 月的奥斯汀 SXSW 节上所解释的那样，人们正在重新审视在早期技术上行不通的模式；只要在投入开发解决方案之前明确要解决的问题（这是软件开发中的常见陷阱），就有严肃的提议除了
    ICO 资金外还吸引了声誉良好的投资者的传统支持。


    ## 淘金骗局与破产业务


    遗憾的是，早期阶段出现的大项目并没有那么好的商业前景。`Statis Group` 的研究发现，根据对项目在募集资金后失败且创始人消失的调查结果，2017
    年发行的 ICO 中几乎 80% 是骗局。精美网站背后是低质量的白皮书，以及与高知名顾问关联的虚假声明，吸引了寻求赚快钱的疏加防备的人。大市场以敏锐的直觉锁定了那些想法不稳定但高潜力的区块链初创公司，而寻找快速致富机会的投资者也加入了其中。令人欣慰的是，帕累托法则在
    ICO 投资中就像在许多业务领域一样适用。`Statis` 指出，“目前，超过 70% 的 ICO 资金（按金额计算）流向了质量更高的项目。”明明的投资者获胜了，但过程中也出现了牺牲品。并不是所有人认同“如果一件事看起来好得不可谱，那么它可能就是假的”这句格言，保护弱者的法律一直在追赶。新的淘金热给比特币和区块链带来了坏名。问题在于，究竟是加密货币破坏了系统，还是系统原本就是坏的？


    根据记者兼作家 Dan Lyons 的说法，一些可疑的做法可以追溯到很久以前的管理科学。他 2018 年的书《Lab Rats》讲述了一个跨越世纪的故事，讲述组织的优先事项从工人利益转向了股东利益（通常是创始人和主要资金提供者）。公司变得更加关注向投资者提供回报，而表现的压力意味着这些回报并不一定与盈利且可持续的业务模式相关。养老金被挪用以支撑长期老牌企业的股价。职场受到动荡，为了短期生产力而牺牲长期就业，导致了员工流失率增加。我们现在正不可避免地向被积极描述为“零工经济”的方向迈进，这对股东来说是福利，但对于那些收入逐渐被侵蚀、就业权利受损的工人来说却不是。Lyons
    认为，硅谷及其他地区的许多投资者最终确定了一种“快速增长、亏损、上市、套现”的盈利性业务模式，在退出时获得快速回报，并跳过了传统的、混乱且冗长的构建一个运作良好且有盈利能力的业务的阶段。在与
    Lyons 对话时，他指出这完全具有经典庞氏骗局的特征，公共投资者支付了早期轮股东的资金，并且在大多数情况下眼睁睁看着股价此后下跌。


    如果投资者通过投入几轮资金来寻找下一个 Facebook 从而奖励亏损企业，这又是如何改变创业者的行为的？一种预期增长了：一个好主意足以证明财务支持。系统已经坏了：将加密货币加入其中变成了一种致命的鸡尾酒。


    ## 什么时候买 Lambo，什么时候上月？


    '
- fmt: '

    As cryptocurrency prices rose rapidly in the latter half of 2017 the craze for
    the Next Big Thing reached its peak. At the time, many crypto enthusiasts were
    confident that the market was adjusting to put Bitcoin in its rightful place,
    sweeping all other coins and tokens along for the ride. “To the moon!” was the
    cry, or if not moon, then would crypto deliver a Lamborghini? Many early adopters
    of Bitcoin took sizable profits from the bull market, and it is good to see that
    they continue to champion cryptocurrency and blockchain development by investing
    their coins in new enterprises, notably in the gaming sector, which is examined
    in greater detail in [Chapter 5](#05_Chapter_5.xhtml). There is a significant
    downside, though: not everyone was a winner. Newcomers who bought in at the peak
    of the 2017 bubble, before prices dropped back down to a more sustainable level,
    were disillusioned and angry. Accusations flew that this was the real Ponzi scheme,
    sucking in new investors to reward the existing crypto holders and leaving late
    arrivals with worthless assets. Price volatility and suspicions of manipulation
    through repeated Tether exchange transactions^([6](#08_Reference.xhtml#c3.6))
    (buying and selling Bitcoin through a cryptocurrency pegged to the U.S. dollar
    to drive price and volume) added fuel to the fire of opponents and skeptics. Warren
    Buffett called Bitcoin “a delusion” in an interview with CNBC in 2019,^([7](#08_Reference.xhtml#c3.7))
    although the veteran investor apparently has a more positive view of the underlying
    distributed ledger technology. In October 2018, Professor Nouriel Roubini of Stern
    Business School testified to the U.S. Senate Committee on Banking, Housing, and
    Community Affairs.^([8](#08_Reference.xhtml#c3.8)) He titled his talk “Crypto
    is the mother of all scams and (now busted) bubbles, while blockchain is the most
    overhyped technology ever, no better than a spreadsheet/database.”


    The backlash against this period of extreme volatility was understandable. Crypto
    and blockchain supporters doubled down, and HODL became the watchword (this stemmed
    from an overexcited and misspelled tweet, which had intended to urge people to
    hold their cryptocurrency). The Lambos seemed far away, the moon doubly so. But
    every cloud has a silver lining, and this turbulent time was no exception. Not
    only did it clean out many of the speculative and foundationless projects, which
    only had their eyes on magic internet money, but it accelerated legislation in
    multiple jurisdictions to protect investors and put blockchain project crowdfunding
    on a firm footing.


    ## Taming the Wild West of Token Fundraising


    New ideas are proposed daily by entrepreneurs who are attempting to raise funding
    through the mechanism of token sales to the community. The best of these are transformational,
    the worst unfeasible or fraudulent, but the rapid development of blockchain applications
    owes much to the easy availability of capital. Where the proposals are sound,
    and the project is backed by a competent and effective team this advances our
    understanding of the technology and its potential. However, if a new enterprise
    is not sufficiently robust to attract the attention of traditional investors such
    as venture capitalists and banks, or to succeed in mainstream crowdfunding, this
    is a signal to be wary. A token sale can collect significant investment without
    the project having been rigorously or independently reviewed. There are good reasons
    for the existing share issue legislation around the world, which protects uneducated
    investors from putting their money into something they do not understand. It is
    inevitable that all jurisdictions are seeking to extend existing regulation and
    implement new rules for token fundraising to protect investors from themselves.


    ## Utility Versus Security


    An important distinction has emerged around the function of the token being offered
    for sale. In many jurisdictions the regulations imposed depend upon whether the
    token has a utility in the blockchain project under scrutiny. If there is no utility,
    then the offer for sale of tokens is likely to involve the investor taking on
    board a degree of risk and certain rights and obligations that are comparable
    with the purchase of shares and securities. Of course, the issuance of debt and
    equity for business funding is heavily regulated in all jurisdictions, and the
    idea of circumventing the paperwork by simply shoehorning a token into the business
    plan is strangely attractive to some founders. I work with businesses who are
    considering or are already using emerging technologies, and unfortunately this
    is a common theme. Can we put this “on the blockchain” and build in a token? In
    the vast majority of cases the answer is no, and some approaches have bordered
    on the downright irresponsible, aiming to pass the whole burden of risk on to
    speculative token holders like a digital lottery ticket.


    ### What is a utility token?


    As tokens are programmable, they can have a specific role in the operation of
    the application. You could consider a presold token as a gift card: buy it now,
    use it when the system is built. In the case of Ethereum, for example, the native
    token Ether (ETH) has utility in the settlement of transaction fees and payment
    of rewards to miners in the Proof of Work consensus mechanism. The Ethereum blockchain
    could not function without it because the network itself is decentralized, and
    users must have ETH in order to transact. This utility status from the point of
    view of U.S. legislators was confirmed by Bill Hinman, Director of Division of
    Corporation Finance at the Securities and Exchange Commission, in June 2018^([9](#08_Reference.xhtml#c3.9))
    when he said:


    ```

    based on my understanding of the present state of Ether, the Ethereum network
    and its decentralized structure, current offers and sales of Ether are not securities
    transactions. And, as with Bitcoin, applying the disclosure regime of the federal
    securities laws to current transactions in Ether would seem to add little value.

    ```


    Another common analogy that may be easier to envision is a business selling advance
    tickets for the rollercoaster at a discount, with the proceeds of sale invested
    in building the theme park. Is this ticket a utility, because it allows you to
    ride the rollercoaster, or a security, because you have helped to fund the capital
    expenditure on the construction of the park and have an expectation of a return?
    In this case it is a utility, because the return is not participation in the success
    of the park but the opportunity to use it. If the park doesn’t get built for any
    reason, then the token holders have no benefit. If the enterprise that raised
    the funds has not, for example, held funds in escrow pending investment in the
    development, then there is no recourse. This is why investors in tokens must exercise
    caution and ensure that they have all the detail with which to make an informed
    decision.


    The position of different jurisdictions on the utility versus security spectrum
    differs considerably: as a rule of thumb the United States is heavily risk-averse
    while mainland Europe is considerably more relaxed. The United Kingdom sits neatly
    between these extremes, and territories including Malta, Gibraltar, and the Swiss
    canton of Zug have developed legislation that is attractive to enterprises in
    the field of blockchain and cryptocurrency. Regardless, the sentiment that utility
    and security are important distinctions is shared. The difference of approach
    is more reflective of the existing structure of legal systems and constitutions,
    the state’s treatment of similar real-world assets and structures, and the degree
    to which each legal system is codified. These all vary enormously. Note that,
    although the specific legislation referred to in the following paragraphs will
    be superseded in time, the underlying approach of each country is probably too
    deep rooted to change markedly.


    ### United States

