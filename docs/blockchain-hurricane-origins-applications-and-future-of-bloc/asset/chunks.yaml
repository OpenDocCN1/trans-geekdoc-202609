    This was part of the impetus behind long established gaming giant Atari’s quest
    to create a token. Speaking to Atari Token cofounder Daniel Doll-Steinberg, we
    discussed the virtual world theory underpinning this and other developments in
    blockchain. Value in the real world is created through selling your skills, your
    time or your assets, and similar value could be created in the virtual world if
    games have the mechanisms in place to exercise the same economic and monetary
    principles. The skills honed through hours on a console are starting to deliver
    transferable real-world value at the highest level. We are seeing the rise of
    e-sports with the English e-soccer competition, the `ePremier League` (`ePL`),
    and among the new generation of Formula 1 racing drivers, 19 year old Lando Norris
    ascribed some of his success and his ability to read other drivers on the track
    to his years of sim racing and participation in the `McLaren Shadow Esports` competition.
    Even Fortnite has stepped into the arena with its 2019 World Cup Finals in New
    York streamed to millions of fans. However, deriving value directly within a gaming
    platform from skills, time or investment, rather than in a discrete competition,
    is an entirely new opportunity. If this can be harnessed—and blockchain offers
    the means to achieve it—the subsequent creation of value will kick-start a sustainable,
    democratized, worldwide economy. This is the disruptive vision of gaming which
    drives development in small, agile companies and which Atari has recognized.


    ### The Development of the Atari Token


    The development of the Atari token has been a much slower and less public process
    than other more well-known blockchain game projects. As a NASDAQ listed company,
    Atari could not jump into the ICO space with the same agility as smaller enterprises
    and start-up companies, but their vision led them to plan for a token sale under
    complex NASDAQ regulations. Doll-Steinberg reflected on the pressures of developing
    a structure for the project where the founders were comfortable with the innovation
    environment while also meeting regulatory requirements. He recalls the frustration
    of watching some teams with little or no business experience raising money and
    failing fast while Atari Token’s highly skilled founders were taking the long
    road. The more agile independent companies were liberal with public information
    about their plans, but Atari was bound by listed company restrictions on releasing
    anything which could affect their share price or breach stringent insider trading
    laws. The press picked up on the story thanks to a few lines in a mandatory report
    for the Paris Bourse in February 2018, but by this time the 2017 bull market had
    collapsed and the ICO gold rush was declining rapidly. Plans for an ICO were abandoned
    in the summer of 2018 but Atari have continued to invest internally.


    ### Market Trends in Blockchain Gaming


    The bulk of development in blockchain gaming has been focused on small companies.
    This is what we have come to expect with disruptive innovation. As the internet
    started to gain traction, existing market leaders failed to catch the wave, and
    Google from the garage and Facebook from the dorm overtook them. In gaming, the
    larger companies don’t yet have an incentive to change their strategy. Their business
    models are profitable and sustainable, and they are in the same position as large
    enterprises across all sectors who are not ready or able to experiment and risk
    affecting their bottom line. When the tipping point comes, though, Atari at least
    will be ready to react.


    What disruption is emerging right now from innovators unfettered by regulatory
    requirements? Value creation from ownership of digital assets has been the first
    source to be realized, and rewards for time invested and skills developed are
    not far behind. Let’s now turn our attention to digital cats and see why they
    are going to change the world.


    ### Cryptokitties and Nonfungible Tokens


    If cat videos are the emblem of the modern World Wide Web, then digital cats are
    the flagbearers for the future of blockchain and cryptocurrency. When `Cryptokitties`,
    the first high-profile blockchain game, launched in November 2017 it immediately
    grabbed the attention of the blockchain community. Such a large volume of transactions
    was carried out on the `Cryptokitties` marketplace in the first few days after
    launch that the `Ethereum` network struggled to cope with the load. This excitement
    was not entirely due to the fact that, at last, here was a fun outlet for your
    cryptocurrency. Sharp eyed developers reading the open source code realized that
    once you purchased your cartoon kitty, you had absolute ownership of this cute
    feline asset. Closer inspection confirmed that when you breed two kitties together
    you own the offspring, and that every kitty has a unique combination of traits
    inherited from its parents and defined by the `smart contract` that executes the
    breeding transaction. Every kitty’s genetic code is recorded as a discrete digital
    asset using a nonfungible token (`NFT`). We touched on programmable money in Chapter
    2: let’s recap.


    ### ERC 20, ERC 721, and ERC 1155 Tokens


    A token is not simply proprietary cash but can be a measurement of value, a nonmonetary
    asset, or a degree of influence in a community. Most commercial applications based
    on the `Ethereum Virtual Machine` and incorporating their own native currency
    are using what is known as an `ERC20` token. `ERC` stands for `Ethereum Request
    for Comment` and refers to the relevant discussion in the open source community
    which led to the development of each type of token. It is clear from the numbering
    that many proposals are discussed, but only a handful are viable and go on to
    be adopted by the developer community. `ERC20` is digital cash: these tokens are
    often known as alt coins and they behave like money. All the tokens are the same
    and are divisible, much like a dollar bill. Thousands of `ERC20` tokens have been
    created. Many have been used commercially for crowdfunding through `ICO`s, some
    retaining and gaining value as their related applications gain traction, and others
    worthless. Such tokens are often referred to as `shitcoins`, and a valueless holding
    is known among investors as `dust`. The majority of blockchain based games use
    `Ether` (`ETH`) directly for in-game purchases and actions, although a few have
    their own `ERC20` currency built into reward and player retention mechanisms.


    Gaming has harnessed two other `ERC` tokens with special properties. The `Cryptokitties`
    game and others like it have adopted `ERC721` as their token of choice. `ERC721`
    is a one of a kind” token. They are still freely exchangeable, but each token’s
    individual relative value will vary according to its specific characteristics,
    its uniqueness and rareness. In technical terminology, this means that the token
    is not fungible. Fungibility is a property of currency whereby, for instance,
    any dollar bill can be used to buy a drink worth one dollar or less, with change
    making up the consistent exchange value. By contrast a nonfungible token (`NFT`)
    represents a unique, discrete item, a collectible which has its own value based
    on its own properties and the perception of the buyer.


    It is quite simple to visualize an `NFT` in the context of `Cryptokitties`. Although
    all the cats have the same basic cartoon outline, every cat is slightly different
    thanks to the genetic traits ascribed to them. Some people find certain traits
    attractive and will assign subjective values to a cat with purple paws, or another
    driving a go-kart. They are also indivisible: you can’t slice them up, as that
    would be cruel.

