    By removing the role of a central agency, parties can transact directly, even
    settling their commitments using the platform’s native currency. However, there
    are good reasons to be cautious about disintermediation. If there is an error
    in a smart contract on which you rely for accurate transaction processing, there
    is nowhere to go if there is no centralized complaints department. Although a
    smart contract is not a legally binding contract in itself, there are legal implications
    to consider. Disintermediated transactions that can be executed across different
    countries and jurisdictions not only remove the middleman but can also obfuscate
    the legal and fiscal position of the parties. Although a smart contract is a transactional
    process and not designed to be contractually watertight, execution may result
    in the formation of a legally binding contract, either intentionally or inadvertently.
    Even if a legal contract is the intention of the developer, it may not turn out
    to be enforceable, and the route to recourse is not clear for the parties under
    law if there is a dispute. In the case where a legally binding contract is created,
    and the existence and content of the completed transaction can be authenticated
    by reference to the immutably stored data, questions arise over what jurisdiction
    applies, and in the case of borderless cryptocurrency, under what tax system earnings
    should be declared. This is further complicated by the extraordinary range and
    diversity of conflicting privacy laws that are in force across the world: which
    law applies to cross-border interactions and how does the transparency of transactions
    on a public blockchain play out in different legal systems?


