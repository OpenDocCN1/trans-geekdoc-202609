    Gas 价格，换句话说就是每单位 gas 需要支付的 ETH 数量，根据处理的交易量而变化。它以 ETH 的小单位 Gwei 形式表示（`10^(\-9)`
    ETH）。每单位 gas 的典型价格可能是 20 Gwei，或 `0.00000002` ETH。在 Cryptokitties 狂热时期，gas 价格也随之高涨。当时，使用
    `Metamask`（允许玩家访问 Cryptokitties 和其他游戏的知名用户界面）需要了解 gas 规则。用户被要求输入他们愿意为 gas 支付的金额，系统会提供一系列建议值范围。这既是采用的障碍，也是一个学习的机会，但较新版本的
    `Metamask` 和新的钱包界面（如 `Dapper`）通过自动选择 gas 价格，或者在 `Dapper` 的情况下完全吸收费用，降低了用户的复杂性。


    供需关系意味着，在过度饱和的网络中，只有那些为 gas 高出价的用户交易才能通过验证，但关重要的是，无论交易是否成功，都会产生费用，因为处理过程始终进行。我曾尝试以过低的
    gas 价格培育 Cryptokitties，结果花费了少部分 ETH 却一无所获。这是一次微不足道的损失，但你不希望你的用户或投资者经历这种事。


    ## 犯错误的代价


    迄为止最臭名昭著的交易费用灾难发生在 2017 年 10 月 `AirSwap` ICO 期间，一位过度热衷的投资者遭遇了智能合约错误。该投资者试图购买价值
    `1,700` ETH 的代币，将交易 gas 价格设置得极其离谱，达到每单位 gas `400,000` Gwei（`0.0004` ETH），可能是为了确保他们的交易在验证具有最高优先级。不幸的是，智能合约在销售窗口设置上存在漏洞。交易到达网络时，合约无法将代币转移给买家，导致错误自动导致尝试的购买失效。投资的
    ETH 未被转移，但被收取了近 `237` ETH 的交易费用，这在当时相当于超过 `$70,000` 美。在正常 gas 价格下，这 `592,379`
    单位 gas 应该为转账者花费约 `$3.50` 美。


    这个教训应该提醒开发者在发布时万无一失，但智能合约开发问题仍然存在。这些不仅涉及正确构建合约的关注，还涉及确保它们在网络威胁面前保持安全。区块链和智能合约安全专家
    `Hosho Group` 的联合创始人 Hartej Sawhney 为我清晰地描勒了目前的局面。


    “行业中编写的智能合约质量正在缓慢但坚定地提高，”他说道。在 2017 年和 2018 年，在智能合约内部发现“无限生成代币”等严重漏洞并不常见。当时，许多公司会自豪地复制和粘贴其他公司智能合约的大段代码，并祈代码能够编译并实现它们预期的功能。


    `InfoSec` 领域的人才一直缺乏学习 `Solidity` 等区块链语言并在该领域提供安全服务的动力。在美国金融行业中常见的标准安全惯例对区块链行业将大有益处。大多数公司缺乏确保安全置于首要位置[以及]进行定期渗透测试和审计的专业性。


    这是一个现实的关注点，对于像 `Hosho` 这样的公司来说也是一个机会。开发者有伦理责任协作并相互支持，在整个区块链应用程序部署有效且安全的智能合约，而业务领袖必须意识到保护用户和业务本身必须维护的标准。


    ## 攻击、分叉与内斗


    加密货币并非没有争议。原始比特币区块链代码根据开源许可发布以供所有人使用，多年来产生了许多克隆版本和竞争者。虽然模仿可能是最诚诚的赞美形式，但一些新货币的历史则更加阴暗，其根源在于错误、攻击和激进的意见分歧。对公共区块链代码进行更改是正常的。开源社区负责维护和更新链，随着对交易记录的需求增长和相关技术的改进，不断提高安全性、速度和容量。当社区通过共识达成了某项更改时，这将导致相关区块链的分叉（fork），在向前推进之前暂停活动并实施新代码，希望更加高效，但从本质上讲保持不变。如果新代码与现有代码后兼容，则导致软分叉（soft
    fork）。在旧代码具有破坏性的情况下，我们就会硬分叉（hard fork）。


    ### 改变方向：比特币现金


    2017 年，比特币开发者花费了大量时间解决原始协议的缺陷，这些缺陷是在近十年的技术进步中暴露出来的。随着链变得越来越长，每个 `1 Mb` 块中记录的交易吞吐量变慢，导致了挫败感并增加了成本。社区提出了几种解决方案，旨在减少记录的数据和或增加区块的大小。名为
    `SegWit` 的提案更改了区块确认的处理顺序，分离交易元素以减少记录的数据量，从而加速处理。隔离见证的第二阶段（`SegWit2x`）旨在将区块大小从
    `1 Mb` 增加到 `8 Mb`。最终，比特币区块链仅通过软分叉采纳了 `SegWit` 的第一阶段。大多数社区放弃了创建更大区块的硬分叉，但少数反对者决定继续进行并创建一个比特币区块链的新分叉，称为
    `Bitcoin Cash`（比特币现金）。它于 `2017` 年 8 月 1 日诞生。其他为了创建具有不同挖矿结构的货币的分叉，特别是 `Bitcoin
    Gold`（比特币黄金）和 `Bitcoin Diamond`（比特币钻石），也发生在 `2017` 年。


    比特币现金的故事并未止于此。新货币获得了关注，而核心比特币区块链继续其 `1 Mb` 块的方式运行。比特币现金被广泛宣传为比特币本应有的加密货币，并制定了其开发路线图。然而，一年后，比特币现金的两个关键开发者
    `Roger Ver` 和 `Craig Wright` 对货币所采取的方向产生了分歧。比特币现金在 `2018` 年 11 月进行了计划中的软分叉，在 `Ver`
    的领导下推进了路线图。`Wright` 和他的团队选择了不同的路径并进行了硬分叉创建一个新链，他们声称这恢复了 `2009` 年的原始比特币协议，即 `Bitcoin
    Cash: Satoshi’s Vision`（比特币现金：中本的愿景）。


    感到困惑吗？这是正常的。比特币开发者在追求完美的点对点电子现金系统时产生的哲学分歧可能会困扰我们多年。


    ## 计算机说是：DAO


