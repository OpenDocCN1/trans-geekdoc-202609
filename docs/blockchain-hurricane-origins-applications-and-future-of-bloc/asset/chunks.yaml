- fmt: '

    The energy required to maintain blockchains is phenomenal. According to the Bitcoin
    Energy Index, electricity consumption for the Bitcoin blockchain alone has doubled
    year on year, and in 2019 its annual consumption stood at over 73 Terawatt Hours.
    This is around the same energy requirement as the whole of Austria and takes no
    account of the load from the Ethereum network or any other public blockchain that
    relies upon Proof of Work number-crunching for its validation. Does the blockchain
    use too much energy? Andreas M. Antonopoulos, speaking at a Scottish Blockchain
    event in Edinburgh in June 2019, was clear: as a scarce resource, Bitcoin is using
    exactly as much energy as the market says it should. However, in this era of accelerating
    climate change, is the Bitcoin community acting responsibly?


    ## Sustainable Proof of Work


    The financial incentive for miners of any Proof of Work cryptocurrency is vital
    to maintaining the integrity of the chain. As a reminder of the process, in order
    to randomly confirm one block of transactions and open the next, full nodes on
    the Bitcoin blockchain compete to solve a complex equation. The first to determine
    the nonce value `x`, which will generate a hash value with `n` leading zeros for
    the block contents including the nonce, wins the race and is rewarded with the
    transaction fees and minted Bitcoin. This is a complex calculation with a high
    degree of difficulty, but it is worthwhile for miners to participate, and herein
    lies the first redeeming feature of the structure. Miners are not only incentivized
    to maintain the blockchain but to do so as efficiently as possible for their own
    commercial interests. As Harald Vranken points out in his 2017 paper “Bitcoin
    miners initially used general-purpose computers, but they quickly switched to
    more dedicated hardware that offered higher performance … at lower energy costs.”
    The efficiency of processors has continued to rise rapidly while the relative
    cost falls. This is not due solely to the need for high processing capacity in
    blockchain, although some suppliers have tailored their cards to solve the Bitcoin
    algorithm (Application Specific Integrated Circuits). Faster processing is related
    to the much greater demand for detailed, high volume data analysis in the world
    of machine learning and artificial intelligence.


    The source of the energy used by these processors is a major consideration for
    the sustainability of blockchain. According to research published by the Coinshares
    network in June 2019, three quarters of mining activity is powered by green energy.
    “We calculate a conservative estimate of the renewables penetration in the energy
    mix powering the Bitcoin mining network at 74.1%, making Bitcoin mining more renewables-driven
    than almost every other large-scale industry in the world,” say the authors. This
    figure represents a slight reduction from the November 2018 analysis: use of renewables
    is an established method of reducing cost and mitigating climate impact, and the
    mix of miners shifts over time. Mining activity uses solar and wind power across
    the globe and has been seen to cluster near “relatively sparsely populated, hilly
    or mountainous regions traversed by powerful rivers” to take advantage of cheap
    hydroelectric power. Some miners and developers are also choosing their locations
    around the globe to minimize energy consumption in server cooling. In countries
    close to the Arctic circle, miners are using the naturally cool local climate
    to keep their servers at operational temperatures and substantially reduce the
    need for air conditioning units to run at full power day and night.


    The march toward renewables is not always a welcome strategy. Existing renewable
    generation companies are fighting back against miners flocking to cheap energy
    hotspots such as the cities around Niagara Falls which have since banned miners
    from operating. However, the Coinshares research concludes that the wider economic
    impact is in fact beneficial. “Bitcoin mining is acting as a global electricity
    buyer of last resort and therefore tends to cluster around comparatively under-utilized
    renewables infrastructure. This could help turn loss making renewables projects
    profitable and in time—as the industry matures and settles as permanent in the
    public eye—could act as a driver of new renewables developments in locations that
    were previously uneconomical.”


    This is not a universal opinion. Research undertaken by Peter de Vries of PwC
    dives deeper into claims of Bitcoin’s sustainability Although the degree to which
    renewables are used is undisputed, de Vries highlights the fact that a mining
    processor has a constant demand for energy from the moment it is switched on to
    the point at which it degrades sufficiently for its operation to be unprofitable.
    This consistent demand for energy is at odds with the variable nature of renewable
    energy supplies, placing pressure on other sources including, for example, coal-fired
    power stations in the mining-heavy Sichuan province of China. He goes as far as
    to suggest that the energy requirement is such that it may require the construction
    of new power stations in the region. The advances in Proof of Work processor efficiency
    are also a concern, says de Vries. Processors wired to solve a single algorithm
    cannot be repurposed at obsolescence, resulting in substantial electronic waste.


    Initiatives to harness renewable energy, increase the efficiency of processors,
    and manage their recycling and reuse are still essential and the concerns raised
    by de Vries must be addressed alongside these strategies. Achieving sustainability
    for Bitcoin and other Proof of Work coins is a huge challenge, which can only
    become more onerous as cryptocurrency scales, and is further complicated by the
    use of blockchain technology beyond crypto.


    ## Is There Always a Need for Blockchain?


    Proof of Work is not the only energy guzzler on the horizon. It is the nature
    of a distributed ledger to be, well, distributed. Every party to the ledger has
    a copy stored locally. In a centralized system, the database is held in several
    locations for security and users read the data through `API` links to the relevant
    software interface. In a decentralized system, there could be hundreds, thousands,
    or even millions of copies of the same data requiring more storage and more processing
    power to keep the ledger state up to date on each node.


    Blockchains for both crypto and commercial purposes are being gradually streamlined
    to reduce the amount of data held on-chain. The impetus for this is improvement
    of the user experience by making transactions confirm more quickly, but the reduced
    pressure on the blockchain in terms of processing and storage of data contributes
    to the overall sustainability of the technology. Bitcoin, for example, started
    work on its `Lightning Network` in 2015 and the community continues to refine
    it. `Lightning` adds a layer of individual peer-to-peer channels where microtransactions
    can be processed with only the final balance of a channel being immutably timestamped
    in the blockchain. These initiatives are contributing to more efficient and therefore
    more sustainable processing in the long term.

    '
  raw: 'The energy required to maintain blockchains is phenomenal. According to the
    Bitcoin Energy Index,^([1](#08_Reference.xhtml#c7.1)) electricity consumption
    for the Bitcoin blockchain alone has doubled year on year, and in 2019 its annual
    consumption stood at over 73 Terawatt Hours. This is around the same energy requirement
    as the whole of Austria and takes no account of the load from the Ethereum network
    or any other public blockchain that relies upon Proof of Work number-crunching
    for its validation. Does the blockchain use too much energy? Andreas M. Antonopoulos,
    speaking at a Scottish Blockchain event in Edinburgh in June 2019, was clear:
    as a scarce resource, Bitcoin is using exactly as much energy as the market says
    it should. However, in this era of accelerating climate change, is the Bitcoin
    community acting responsibly?


    Sustainable Proof of Work


    The financial incentive for miners of any Proof of Work cryptocurrency is vital
    to maintaining the integrity of the chain. As a reminder of the process, in order
    to randomly confirm one block of transactions and open the next, full nodes on
    the Bitcoin blockchain compete to solve a complex equation. The first to determine
    the nonce value x, which will generate a hash value with n leading zeros for the
    block contents including the nonce, wins the race and is rewarded with the transaction
    fees and minted Bitcoin. This is a complex calculation with a high degree of difficulty,
    but it is worthwhile for miners to participate, and herein lies the first redeeming
    feature of the structure. Miners are not only incentivized to maintain the blockchain
    but to do so as efficiently as possible for their own commercial interests. As
    Harald Vranken points out in his 2017 paper^([2](#08_Reference.xhtml#c7.2)) “Bitcoin
    miners initially used general-purpose computers, but they quickly switched to
    more dedicated hardware that offered higher performance … at lower energy costs.”
    The efficiency of processors has continued to rise rapidly while the relative
    cost falls. This is not due solely to the need for high processing capacity in
    blockchain, although some suppliers have tailored their cards to solve the Bitcoin
    algorithm (Application Specific Integrated Circuits). Faster processing is related
    to the much greater demand for detailed, high volume data analysis in the world
    of machine learning and artificial intelligence.


