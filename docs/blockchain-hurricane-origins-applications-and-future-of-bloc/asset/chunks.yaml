    地球上的每一个人都将拥有身份，并获得教育、健康和其他社交服务。


    这是一个强有力的愿景，许多倡导者认为这种未来可以通过不断进化的区块链技术来实现。


    ## 加密货币的合法性


    联合国的乐观展望，与过去加密货币作为犯罪活动和违规行为工具而蒙受的阴暗声誉相比相差地远。对于任何电脑被勒索软件感染、数据被锁定并要求用 `Bitcoin`
    支付赎金的人来说，加密货币等同于犯罪。它在 2011 年至 2014 年间活跃的暗网市场“丝绸之路”上的广泛使用，在公众认知中得到了强化。在此期间，丝绸之路记录了超过
    900 万笔 `Bitcoin` 交易，在其运营结束时，其托管账户遭到黑客攻击，尽管大部分的 `Bitcoin` 已找回。讽刺的是，`Bitcoin` 本身在这里是无辜的。`Bitcoin`
    区块链完全透明且伪匿名的，而非匿名：在理论和实践中，每个钱包都可以与现实身份联系起来，使得 `Bitcoin` 比现金更具可追溯性。^(7)例如在 2017
    年 WannaCry 勒索软件攻击中，所有的赎金支付在 `Bitcoin` 区块浏览器上对任何人可见。


    区块链也讲述了一个故事。对于一次全球性的攻击，总共只有 338 名受害者支付了 `WannaCry` 赎金，这一事实强调了网络安全专业人员阻止病毒扩散的卓越工作（部分归功于恶意软件研究人员
    Marcus Hutchins 的快速行动^(8)），并帮助用户在不支付任何费用的情况下修复勒索软件造成的损害。检查用于收集赎金的三个钱包之一的记录，你可以看到
    133 笔 `Bitcoin`Receipt，当时每笔等值 300 美元，并在几个月后通过两笔交易提取了全部金额。^(9)资金被转入一个隐私货币 `Monero`
    钱包中，在那里，真实的交易细节通过混淆数据受到保护：每笔真实交易都会附带六条虚假记录，使得追踪轨迹变得更加困难。这种匿名加密货币更难监管，它们等同于数字旧银行钞票。给所有数字硬币都贴上同样的标签是不公平的。


    针对加密货币的另一项指控（特别是在 2017 年价格快速上涨期间）是它是一个庞氏骗局、金字塔、一个通过用后期入场者的投资支付早期参与者的回报，从而欺骗无辜投资者的骗局。随着价格回落到现实水平，成交量和监管都在提高，关于欺诈行为的讨论少了很多，对主流数字货币可靠性的理解也增加了。然而，当时这种不准确的印象如此普遍，以至于一个加利福尼亚开发人员在
    2018 年创建了一个玩笑货币 `PonziCoin`。`PonziCoin` 的白皮书用清晰、明确的语言说明，`smart contracts` 将从后期投资的收益中支付第一批投资者，直到资金耗尽。令恶作剧背后的团队惊讶和恐惧的是，人们竟然开始向该计划中投入现金。他们迅速禁用了投资功能，让
    `smart contracts` 按照程序运行。在他们网站的一份声明中，开发者对陷入热潮的人发出了警告：^(10)


    我们希望大家笑得开心 :) 但我们必须关闭它。这是一次恶搞艺术表演/玩笑。我没有“卷走”钱，我从未卖过我的任何 `PonziCoins`，资金是因为其他用户提现而耗尽的。在投资阴暗的加密货币时要小心，特别是那些看起来像金字塔骗局的货币——这是一个零和游戏，钱不会凭空出现。


    对于早期区块链项目的投资者来说，这是一个深刻的教训，因为在那里购买代币如此容易。在大多数司法管辖区，投资在某种程度上受到监管是有原因的，如果回报看起来好得不可置信，那么它可能确实如此。


    但最终，加密货币只是货币的形式。作者尤瓦尔·诺亚·哈拉里写道：^(11)


    钱是人类创造的唯一能够跨越任何文化差异的信任体系，它不根据宗教、性别、种族、年龄或性取向产生歧视。得益于钱，即使是互不认识、互不信任的人也可以进行有效的合作。


    加密货币是人类发明以来最通用的相互信任系统的自然演变。它的去中心化结构和核心信任机制确保了它在社会中的合法地位。


    ## 在现实世界中使用数字现金


    你可以花费加密货币吗？当然可以。我口袋里的物理钱包目前有一张 Visa 卡，它直接连接到加密货币账户。可以用我的加密资产间接支付咖啡和三明治。交易涉及自动转换为当地法货币，已经存在的加密货币
    ATM（允许从加密账户提取当地现金）也是如此，但有趣的是这种交换的无摩擦性质。一个国家，太平洋小国马尔尔尔岛，引入了自己的当地加密货币作为法定货币，马尔尔尔岛主币。在委内瑞拉，从咖啡到衣服的商品和服务越来越多地使用
    `Bitcoin` 支付，而政府已开始坚持用自己的加密货币 `Petro` 缴纳税款（你可以在第三章中阅读更多信息）。


    在线，我可以用加密货币购买各种商品和服务。有几种主流加密货币结算工具可用，包括标准的 `Blockonomics` 插件，它可以在我的 WordPress
    网站上接收 `Bitcoin` 支付，并将收益直接存入我的加密钱包，无需转换。区块链游戏如 `Cryptokitties`、`Axie Infinity`、`Neon
    District`、`Decaland`、`Epic Dragons`、`EOS Knights`、`Gods Unchained` 等许多游戏都可以使用加密货币进行。


