    One particularly interesting combination of artificial intelligence and blockchain
    has been piloted by the UK’s National Archives in association with the University
    of Surrey and the Open Data Institute. The work of the `ARCHANGEL` project on
    underscoring archival authenticity with blockchain, published in 2019, has not
    only demonstrated a solution to an archiving challenge but may have greater impact
    on authentication of other media. Mark Bell of the National Archives told me more
    about this two-year project. The team started out experimenting with blockchain
    use cases in archiving. One of the challenges laid down by the Archives was how
    to manage the rapid change in media used for the recording and storage of video
    footage. Even as consumers, in our lifetimes we have seen camcorder tapes of family
    events converted to VHS, then DVD, then MP4. How can we be sure that the childhood
    footage we view on MP4 is the same as the tape made in the heady days of a 1970s
    summer?


    The authentication of a record by comparing hashes is well established and already
    in use for born-digital records. Any such files are hashed on sending and verified
    on receipt as they move through departments, as part of a centralized process.
    One of the blockchain challenges addressed by the team looked at applying the
    same technique for independent, decentralized verification of original university
    research data years after publication. Video records present a far more complex
    problem. How do you verify content when you move from format to format, or from
    high to low resolution? The hash of a VHS video will be different to the hash
    of an identical, uncompromised MP4 even when the content is the same, because
    the formatting data causes a variation in the record. This is where artificial
    intelligence comes in to enhance the solution.


    The `ARCHANGEL` team introduced content-aware deep learning to strip away the
    format-specific data within a record and isolate the footage beneath. Every version
    of the video record has a hash related to the original, and the common content
    is the traceable hash which runs through the archive. Blockchain comes into play
    when the transparency of records requires an immutable public chain of evidence.
    This is an excellent example of two complementary technologies playing to their
    strengths. There are also nuances to this implementation of blockchain which are
    specific to the National Archives. Some of the records they hold are embargoed
    for decades under British law: Census data, for instance, is released a full century
    after collection. In this context, even file names can be sensitive. This requires
    a permissioned structure, and `ARCHANGEL` is currently using `Ethereum`, with
    open and closed records and a Proof of Authority consensus.


    The team also ran a trial with international archives, including the National
    Archives and Records Administration (NARA) in the United States, agencies in Estonia,
    Norway, Australia, and the National Records of Scotland. This substantial element
    of the work captured standard hashes of archived documents and demonstrated the
    necessarily collaborative nature of blockchain.


    Bell points out that when work started on the project in 2016 the aim was simply
    to develop reliable authentication for the Archives’ video records. Over the intervening
    years, the scandal of deep fake video has emerged, and the question of authenticity
    has been thrust into the public eye. This is an obvious next step for the research
    team, whose solutions for verifying footage under their control can be turned
    to the task of identifying fraudulent content. It is refreshing to find an emerging
    problem which invites an emerging technology solution.


    ## Provenance and Authenticity


    We have already seen the work being done in authentication. Goods that are scarce
    and highly valued are a magnet for counterfeiting, and blockchain is helping to
    fight this. Achieving reliable proof of authenticity is the problem, and improved
    verification delivers a solution.


    By tracking the provenance of components, ingredients, and materials, the purchaser
    can be confident that goods meet every relevant quality standard and that they
    are the genuine article. The potential to reduce counterfeiting and raise standards
    is significant. Combining a straightforward provenance chain with `smart contracts`
    smooths the cashflow of the participants, even across borders. This application
    of blockchain technology is possibly the furthest advanced, with multiple systems
    in active development and some at a stage of client readiness.


    ## Creation to Consumption


    ### Tuna, Mangos and More


    The supply chain is frequently cited as a perfect use-case for distributed ledger
    technology. Increased scrutiny of the origins of manufactured items, concerns
    for the environmental impact of the things that we use, and differing standards
    of health and safety, quality, or employment practices across the world, can be
    resolved by improved transparency and traceability. Potentially, every step of
    the way from raw material to finished product could be recorded and authenticated
    through blockchain.

