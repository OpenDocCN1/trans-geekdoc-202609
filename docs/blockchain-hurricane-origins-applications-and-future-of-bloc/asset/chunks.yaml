    As no irrefutable proof of identity has been brought into the public domain by
    any of the likely candidates (access to the Satoshi wallet being the most compelling)
    the crypto community is still divided as to the real identities behind Satoshi
    Nakamoto. Is this a bad thing? Aside from satisfying our natural human curiosity,
    most commentators agree it is entirely in the spirit of Cypherpunks and the Crypto
    Anarchist movement that Satoshi’s identity remains unknown. By fading into the
    background, and therefore not providing a figurehead, the creator(s) of Bitcoin
    have ensured that the solution remains truly decentralized.


    ## Building on Bitcoin


    What kind of transactions can you record in a block? Bitcoin itself works on a
    form of triple entry bookkeeping where the double entry of sending and receiving
    a payment is confirmed by a third entry: a digitally signed, cryptographically
    sealed receipt from the network. Each transaction on the Bitcoin blockchain is
    processed using a model known as `UTXO`, or `Unspent Transaction Output`. Accessing
    your “wallet” using its public and private keys is actually the process of unlocking
    the coins to which you are associated. If the keys are mislaid, you cannot open
    the lock. When initiating a payment, you are unlocking a `UTXO` and telling the
    network to take the amount of coins you specify from the total available. The
    balance, in other words the unspent amount, is sent back to you by the network
    as a new `UTXO`, which will be unlocked for the next transaction. It may sound
    complex, but a user’s wallet is really a list of the `UTXO` records associated
    with that user, totaled to give an account balance. Every full node on the Bitcoin
    blockchain holds a copy of all the unspent Bitcoin transactions.


    Why should a distributed ledger approach be restricted to financial transactions?
    The idea of decentralizing processes other than cryptocurrency transactions quickly
    caught the imagination of developers and enterprises. If you could cut out the
    middlemen in day-to-day banking, what other agencies could be rendered unnecessary?
    `UTXO` is not really a practical methodology for anything other than an exchange
    of identical digital assets: the idea of writing a second protocol layer on top
    of the Bitcoin blockchain is credited to J. R. Willett who, in 2012, published
    “The Second Bitcoin Whitepaper.” Crucially for the future of this industry, he
    also suggested securing development funds to do this from within the crypto community.
    The original document is no longer accessible, but at the 2013 San Jose Bitcoin
    conference, Willett explained the idea to his panel’s audience.^([16](#08_Reference.xhtml#c2.16))
    Laura Shin, writing for Forbes in 2017, describes the breakthrough.^^([17](#08_Reference.xhtml#c2.17))
    “He dreamed up something like contracts on top of Bitcoin,” she explains, “the
    way e-mail is layered on top of TCP/IP, but wondered how he could pay for its
    development. [He realized] he could float a coin on top of Bitcoin that buyers
    would automatically own if they sent bitcoin to fund its development.”


    Willett succeeded in funding his Mastercoin project through what became known
    as an Initial Coin Offering (ICO), but the project was not launched on Bitcoin.
    The Bitcoin blockchain is a robust creature, and by this time its tried and tested
    structure had been replicated and refined by other blockchains including decentralized
    name registration database Namecoin (2010), Litecoin, the silver to Bitcoin’s
    gold (2011), and enduring and much-loved joke currency Dogecoin (2013). However,
    it is not sophisticated enough for the needs of enterprise. Something more tailored
    was needed to handle additional protocol layers and complex, multistage smart
    contracts.


    ## Ethereum and the Virtual Machine


    In December 2013, Vitalik Buterin published a whitepaper entitled “Ethereum: The
    Ultimate Smart Contract and Decentralized Application Platform.” The Ethereum
    software itself is open source therefore the whitepaper is a constantly evolving
    document on `GitHub`,^([18](#08_Reference.xhtml#c2.18)) but the original^([19](#08_Reference.xhtml#c2.19))
    can be accessed in online archives. Ethereum was the first blockchain infrastructure
    purpose-built for distributed computing, that is, with the ability to hold multiple
    protocols above the base cryptocurrency layer. Buterin’s vision of smart contracts
    running autonomous rules to govern the movement of any digital asset went far
    beyond Bitcoin, and although Ethereum relies on Bitcoin’s “credible decentralization”
    and in particular the timestamping for first-to-file transactions, it reduced
    blocktime significantly from 10 minutes to around 15 seconds.


    The Ethereum Virtual Machine (`EVM`) enables code to be run within individual
    nodes, a significant innovation for the development of distributed applications
    (dApps). Buterin also suggested a logical extension toward “decentralized autonomous
    organizations (DAOs)—long-term smart contracts that contain the assets and encode
    the bylaws of an entire organization.” The launch of Ethereum was itself part
    financed by an ICO, which raised the approximate equivalent of $18 million of
    development funds through the sale of its native currency, `Ether` (`ETH`). This
    opened the floodgates for hundreds of ideas that entrepreneurs believed, rightly
    or wrongly, would benefit from the unique properties of blockchain.


    What are the potential applications of Ethereum? Founder Vitalik Buterin listed
    his top picks in response to a query from Elon Musk on Twitter in April 2019.
    The thread included:


    *   A globally accessible financial system, including payments, store of value,
    also more advanced stuff like insurance; Identity: “sign in with Facebook” ->
    “sign in with an Ethereum account, no intermediaries”. Also, web of trust...

    *   All sorts of registries should publish on chain for security and easy verifiability;
    Experimenting with new forms of human organizational structure; All sorts of micropayment
    use cases via payment channels; Markets for personal data for privacy preserving
    machine learning (you pay me `X`, I let you homomorphically execute function `Y`
    on my data that’s been attested to by `Z` ...);

    *   Cryptoeconomics for spam prevention in social networks; Prediction markets
    for content creation DAOs; Cryptoeconomics / micropayment schemes to reward publishers
    of good content; Testing ground for new market designs, e.g. frequent batch auctions,
    combinatorial auctions, automated market makers;

    *   “Peer-to-peer (p2p) marketplace for internet connections / incentivized mesh
    networks; Identity, reputation and credit systems for those that currently have
    few resources (e.g., refugees); Decentralized DNS alternatives e.g. Ethereum name
    service domains.”


    Some of these applications have already been realized and will be examined in
    more detail later in this book. Others are tantalingly out of reach but visible
    on the horizon of blockchain development. Over time, where the Bitcoin blockchain’s
    native currency began to find its niche as a store of value based upon its programmed
    scarcity, Ethereum has become the ICO machine. The `EVM` allows applications built
    on top of the Ethereum blockchain to operate separately from the host. The decentralized
    ecosystem that has grown up around this mechanism has developed genuinely new
    concepts, with open source collaboration yielding new types of token with unique
    behaviors and properties beyond simple digital cash. The gaming sector in particular
    has pushed this work forward with ownership of nonmonetary digital assets, of
    which more in [Chapter 5](#05_Chapter_5.xhtml).


    ## Not-So-Smart Contracts and Cautionary Tales

