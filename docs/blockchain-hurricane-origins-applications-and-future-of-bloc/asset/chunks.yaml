- fmt: '

    According to the Community Roundtable’s annual research, members of a community
    range from a minority of eager contributors to a silent majority of listeners
    and lurkers. On average, one in 10 members of a community will actually be engaged
    in the day-to-day discussions, and the holy grail of community management is that
    the activity of the network holds the attention of the core while drawing the
    lurkers into the discussion. It’s a tough job in the noisy world we inhabit with
    so many different platforms and social groups competing for our attention. My
    own daily round includes Facebook feeds and groups, Twitter, LinkedIn, and Instagram,
    multiple Slack channels, WhatsApp chats, Telegram groups, and Discord, and I cannot
    follow all the discussions. Asking people to engage in yet another medium can
    be met with everything from disinterest to hostility. The bottom line, though,
    is that communities form most naturally around a common interest and a need. Gaming
    has a head start on enterprise, with mutually supportive groups clustering around
    games from the earliest days of standing together in arcades through to the Steem,
    Reddit, and Discord groups that exist online today.


    Community is an essential aspect of blockchain and cryptocurrency adoption. Where
    an enterprise chooses to use `ICO` crowdfunding, the first community that must
    be built is that of investors and collectors who have the wherewithal to support
    fundraising for development. They must have ready money, trust, and patience.
    Once the funding round is complete, the established community needs to evolve
    in order to attract and engage potential users who will generate anticipation
    and excitement for the launch. This is true for all enterprises regardless of
    sector: the engagement effort does not stand still once funding is in place. Once
    launched, new users of any decentralized application will find themselves in a
    new and potentially complex environment where there is no central authority to
    pick up the pieces in case of a mistake, and the support of their peers is vital.
    When this need for community support is combined with the gaming culture of cooperation
    around the interpretation of complex rules, there is a great resource for gaming
    companies to listen, react, and refine their offering.


    Gabby Dizon reinforces the impact this has. “Creating a game economy from scratch
    needs a strong player community,” he told me. Not only is community important
    within the context of a single game, but also for building engagement with the
    players of other games. Nothing develops in a vacuum, and interoperability and
    collaboration are vital in building interest, excitement, and ultimately engagement
    with each new game as it launches. Dizon and other leaders in blockchain gaming
    have a vision of meta-events across platforms, leveraging the power of community
    to enhance, not compete. This is something which is enabled for the first time
    by sovereign ownership of assets through the mechanism of `NFTs`.


    ## Nifty Moves


    Outright ownership of game assets using nonfungible tokens is a groundbreaking
    concept because it represents something that could not be done without blockchain
    technology. At first sight it seems to be a simple nice-to-have feature which
    can take buying and selling activity outside the game platform, but what else
    could you do with your `NFTs`? Gamers may wish to take the asset and use it in
    another game: to be fair, a cute cat in a two-dimensional cartoon may not be useful
    on a Call of Duty battlefield, but how about a fully tooled-up Overwatch character?


    The way an `NFT` is represented across applications differs according to the environment,
    but ownership is undisputed. A token could be listed in an inventory application,
    used as a basis for bonuses and rewards, or even act as collateral for borrowing.
    Coming back to the economic and monetary principles of the virtual world, here
    we have the mechanism for value creation from skills, time, and assets. Tokens
    can be programmed in a way that physical assets cannot, and managing interoperability
    opens more doors. `NFTs` have some very nifty moves.


    ## Interoperability of Nonfungible Tokens


    Cryptokitties creators Dapper Labs took the first step into the unknown through
    their 2019 partnership with a different game, `Gods Unchained`. Each `Cryptokitty`
    token generated a limited-edition card pack in `Gods Unchained`, and fancy `Gods
    Unchained` cats appeared in `Cryptokitties`. The interoperability of tokens in
    a collaborative ecosystem is yet another feature peculiar to blockchain technology.
    These cartoon cats are leading the way toward trustless co-ordination and cooperation
    between proprietary systems across multiple sectors, not simply in gaming. Rather
    than using `APIs` to bring assets in from different sources, `NFTs` could move
    between systems independently, subject to formalities such as intellectual property
    rights on design elements. What other assets could be represented, recorded, exchanged,
    or licensed in a decentralized structure? We have already seen in Chapter 4 that
    work is underway toward establishing a persistent identity for assets and equipment
    in capital projects, and some companies are exploring the use of tokens to represent
    each unit, unique by serial number or physical characteristics. The aspect of
    using digital assets as a financial security also merits closer scrutiny: they
    have intrinsic value and ownership is clear. This is a new way of thinking and
    may represent a behavioral shift to come.


    ## Intellectual Property and Asset Ownership


    One of the considerations for enterprises using `NFTs` in their application is
    protecting their intellectual property. Cryptokitties founders spent time working
    through the pros and cons of `NFT` ownership, and eventually published the `Nifty
    License`. This recognizes the company’s ownership of the generic cartoon style
    of the `cryptokitties` but grants to the owner of each token broad rights to use
    the cartoon with that token’s unique markings and features. The `Nifty License`
    is a way of linking the physical and the virtual: when challenged, the owner of
    the digital asset can authenticate their rights to use the related imagery. Released
    for use by any developer, this license is a blueprint for collaborative creators
    who don’t want to lock down their work but still need to retain some control and
    set up a path to monetization.

