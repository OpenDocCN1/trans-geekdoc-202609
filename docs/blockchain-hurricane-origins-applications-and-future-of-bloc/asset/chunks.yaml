- fmt: '

    So, what of digital assets? These lend themselves immediately to management through
    a distributed ledger, using the same mechanism as provenance applications examined
    in [Chapter 4](#04_Chapter_4.xhtml). The difference here is that authenticating
    ownership is not enough on its own. Provenance records move forward as goods change
    hands, and to reward the creator money must flow backward to source. The management
    of owned assets seems an obvious use case for a ledger, and as we saw in [Chapter
    6](#06_Chapter_6.xhtml) registries are gradually moving toward distributed systems
    for everything from parcels of land to life records. The pattern of ownership
    of any asset can be complex, and subdivision and shared ownership are common.
    These are not only a matter of record but also lend themselves to tokenization.


    Representing financial instruments and both virtual and physical investment assets
    as tokens opens up possibilities for new commercial activities. While managing
    the provenance and traceability of tangible assets such as diamonds, artwork,
    and luxury goods is commercially established, extending the principle to shares
    and securities or even investment properties is in the very early stages of realization.
    Exploring this type of tokenization indicates potential to increase liquidity
    for trading and offers opportunities for crowdfunding and equity release. Representing
    assets with tokens could move us toward peer-to-peer nonmonetary asset exchange.


    ## Data and Identity


    When did you last buy a service using your data as currency? Was it the airport
    wi-fi, or the one in the hotel, coffee shop, or train? I’m sure you read all the
    terms and conditions as you entered your name and e-mail address and exposed your
    data to an unknown network. Or perhaps it was the latest game on Facebook. Concerns
    are regularly raised around the data retained by viral apps and by Facebook themselves^([13](#08_Reference.xhtml#c7.13))
    who require “a non-exclusive, transferable, sub-licensable, royalty-free, and
    worldwide license to host, use, distribute, modify, run, copy, publicly perform
    or display, translate, and create derivative works of your content.” The big tech
    giants see the continuum from privacy to personalization as a consumer choice.
    Speaking at SXSW in 2016, Microsoft’s Mike Hintze and Google’s Keith Enright talked
    of empowering users, engineering for trust, and managing the sensitivities of
    individuals to start to personalize the privacy experience. Ethics in the digital
    world are under the spotlight. Google and Apple, among others, have reportedly
    hired in-house philosophers.^([14](#08_Reference.xhtml#c7.14)) The Center for
    Digital Ethics and Policy at Loyola University Chicago develops best practice
    and guidelines regarding ethical behavior in online and digital environments,
    hosts an annual International Symposium on Digital Ethics, and publishes essays
    on the ethics of everything from artificial intelligence and ownership of personal
    data^([15](#08_Reference.xhtml#c7.15)) to self-driving cars.


    If we do not give up some personal data, how are we to be identified? Proving
    personal identity effectively has been a challenge for generations. Partial solutions
    for the physical confirmation of identity are applied piecemeal across the world.
    Crossing national borders generally requires an identity card or passport, some
    but not all of which may detail the holder’s home address alongside their name,
    nationality, and birth details. Screening could also involve providing (in the
    author’s recent personal experience) some, all, or none of: thumb prints, index
    fingerprints, full sets of prints, retinal scans, facial recognition scans, and
    full contact details and travel plans while in the country. Within individual
    countries, identity cards may be either ubiquitous or absent, and the recording
    of births might be immediate and precise, or informal to the point that official
    documents routinely record birth dates as January 1, in the absence of any detail
    other than the year of birth.


    Digitally, there are multiple pseudo-identity systems allowing us to move seamlessly
    between software produced by individual providers, and often used to verify our
    identity with third party software. In 2016, Apple confirmed they had one billion
    active devices, all attached to an `Apple ID`. Facebook’s two billion users can
    “log in with Facebook” to multiple applications. Microsoft accounts control access
    to the whole suite of tools produced by the company. The landscape is messy, and
    the accounts themselves are effectively anonymous, because users self-certify
    as real humans. Fake accounts proliferate. The technology to link accounts with
    services is good, but in situations where verification of account holder identity
    is genuinely required, for example in accessing taxation services or banking software,
    the process reverts to physical proofs.


    It’s a confusing picture, and one where control is centralized, and reams of personal
    data are vulnerable to hacking and theft. Blockchain technology has the potential
    to deliver a single proof of identity with distributed verification. An individual’s
    identity blockchain could begin with the registration of their birth, and incorporate
    life events such as vaccinations, qualifications, voter registration, and location
    changes as they occur. The records are immutable, data sources distributed, and
    there is no centralized control. In terms of security, although individual blocks
    may be accessed, the whole chain of information would not be visible. Currently,
    if an ID document is presented for proof of age it may also reveal place of birth
    and current address. Under principles of data protection and privacy, being able
    to reveal only the birth date block in a reliable record is preferable. Although
    there are significant innovations around digital identity from Estonia to ID2020
    to the World Food Programme, achieving a joined up, global system of both identity
    records and acceptance is many years away.


    ## Save the Tooth Fairy


    Possibly the most difficult question I asked of the many people who generously
    gave their time to assist in researching this book was: what will the Tooth Fairy
    put under the pillow if we move to a cashless world?


    DLA Piper’s Martin Bartlam speculated that even now, children do not appreciate
    the value of money until long after the Tooth Fairy has stopped visiting. They
    see their parents ordering goods online and using contactless cards to make payments
    in store; cash is a rarity. Is the Tooth Fairy tradition one that will fade with
    us, the last generation to appreciate cash? Our attachment to the medium is increasingly
    sentimental. “How else will you play ha’penny or decide important yes/no questions
    in your life?” asked author Mark Hayes. “Tossing a barcode is never going to work.”
    The ubiquitous smart devices that already hold our children’s attention may be
    the answer, said FinTech speaker Liz Lumley. Will the Tooth Fairy send a text
    message, “Your account has been updated,” or a cartoon tale of tooth collection
    and appropriate remuneration for younger readers? Anne Ahola Ward of Veriton suggested
    a simple and oddly comforting message: “Your tooth is in the cloud.” Whatever
    happens, our world is going to change in ways we cannot imagine.


