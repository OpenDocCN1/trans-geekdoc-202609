    The tuna supply chain scenario envisages the involvement of multiple mutually
    suspicious parties from fishing to regulators to transport to processors to wholesale
    and finally to the consumer. The current state of supply chains involves trust
    relationships and regular verification of data. Businesses are always looking
    for a competitive edge, and this could be achieved in several ways. They might
    expand the supply chain beyond trusted parties, reduce the costs and the administrative
    burden of verification and regulation, or appeal to the consumer with greater
    transparency around sustainability, source, and authenticity. Blockchain is one
    tool that can facilitate these business model changes.


    The first step in establishing a reliable digital record is to trace the physical
    asset and capture its movements in a way that can be relied upon. Supply chains
    already have the workflow in place to trace goods, and regulators rely upon the
    records kept and their own inspections to ensure that our clothes are not being
    made in factories that breach health and safety laws, or that tuna is being fished
    from the right waters by registered fleets. The difference that blockchain makes
    is locking the records into a distributed ledger and enabling them to be quickly
    authenticated by actors in the chain who do not have a direct relationship with
    either the organization or the individual who posted the data.


    Distributed ledger supply chains are being developed and tested around the globe,
    and in October 2018 the `IBM Food Trust` blockchain went live as a commercial
    product. During the proof of concept phase, IBM worked with Walmart who challenged
    them to trace two mangos from farm to store. Using existing systems this process
    took almost a week to run, while the blockchain-based system completed the task
    in 2.2 seconds. Since then, `IBM Food Trust` systems have been adopted by other
    North American store chains, notably `Albertson’s`, and organizations including
    the `National Fisheries Institute`. In Thailand, exporters of the legendary durian
    fruit are working with `DiMuto`, a Singapore-based startup, to transform fresh
    durians into traceable digital assets, tracking each individual fruit along the
    supply chain.


    It’s early days in such a complex area and there are many issues to overcome,
    not least that, as we already know, a blockchain is only as good at the data that
    is fed into it. This is already being addressed by organizations in the sector,
    from the largest players to businesses like London-based startup `AgriLedger`,
    whose holistic approach to the value chain begins with Haitian farmers. When reliable
    inputs are overlaid with transparency and trust, this has implications for proof
    of ethical sourcing, distribution of wealth through the mechanism of smart contracts,
    and a reduction of opportunities for fraud and corruption.


    ## Fighting Fake Pharmaceuticals


    The provenance of commodities in the health supply chain is particularly sensitive
    as counterfeiting and human error in producing pharmaceuticals can have a direct
    impact on patient safety. The industry was quick to recognize the potential of
    blockchain to tackle the problem of compromised and fake medicines. According
    to Clauson et al. in a 2018 paper published in `Blockchain in Healthcare Today`,
    not only the supply chain but the security of medical devices had the potential
    to be improved with blockchain applications, but at the time most initiatives
    were still in a proof of concept or pilot phase. This is still largely the case,
    but with increasingly substantial commercial and regulatory backing. Legislation
    has made drug traceability a strategic priority for pharmaceutical companies,
    including the 2013 enactment of the U.S. Drug Supply Chain Security Act (`DSCSA`).
    The 2023 deadline for compliance has pushed forward the development of new processes,
    and blockchain is at the heart of pilot projects with `IBM`, `KPMG`, `Merck`,
    and `Walmart`, according to Rachel Wolfson writing in `Forbes` in June 2019. Walmart,
    whose Health and Wellness sales accounted for $35 billion of their U.S. revenues
    in 2018, is a staunch supporter of blockchain technology and has also stepped
    in to join the `MediLedger` consortium, another group focused on pharmaceutical
    tracking.


    Why is blockchain a suitable solution to this problem? The fragmented nature of
    the U.S. medical industry, reported Wolfson, makes a decentralized system the
    most appropriate structure, ensuring transparency and trust for multiple parties
    from manufacturers to consumers. Blockchain satisfies the needs of mutually suspicious
    parties who want trusted information presented on a transparent (albeit permissioned)
    platform.


    ## Crossing Oceans, Crossing Borders


    Any implementation of new technology in an enterprise must confer a benefit, and
    the introduction of `Insurwave`, a blockchain-based system for shipping insurance,
    is a case in point. Freight giants `A.P. Moller–Maersk` faced a challenge in managing
    the complex ecosystem of the purchasing and administration of their highly transactional
    insurance process. Vessels can change hands frequently, thereby changing the insurance
    premiums as vessels are added and removed from the insurance coverage and requiring
    the annual reconciliation of their asset register for overall insurance risk exposure
    purposes. The first step was to digitize the vessel data, understanding both the
    current data and new data points that would be enabled by blockchain. In May 2018
    a consortium including `Ernst and Young`, `Microsoft`, network security experts
    `Guardtime`, and insurers `XL Catlin` (now `AXA XL`, a division of `AXA`), `MS
    Amlin`, and `Willis Towers Watson` launched this blockchain solution based on
    the `R3 Corda` framework, merging the existing digital data capture and transactions
    through smart contracts. At the time I spoke to `XL Catlin`’s Digital Leader `Hélène
    Stanway`, and `Ghanshyam Patil`, Digital Lead for Blockchain, who explained more
    about the `Insurwave` project.


    Patil told me that `Corda` was technically suitable because of the maturity of
    its smart contracts and validation processes and its capacity to scale the volume
    of stakeholders as the systems roll out. The `Corda` framework is popular in financial
    services as a semitrusted network, and this suited the purposes of the consortium.
    Although insurers and brokers needed full transparency to keep their underwriting
    accurate, other parties had to be controlled by permissions. In a commercial market,
    it would be impractical to make insurance deals and premiums transparent, as each
    insurance decision takes account of multiple risk factors which would not be clear
    to third parties, and may result in disputes. The notary function, handled by
    `Ernst and Young`, provides the glue to keep the system churning. Stanway explained
    that the global asset register is held by the notary and smart contracts manage
    the insurance transactions when vessels are bought and sold. The system makes
    use of the `IoT` for prime entry to the ledger, and the sensors are delivering
    additional benefit by collecting more data points than could be captured or processed
    by the original system.


    The proof of concept ran successfully during 2017 and `Insurwave` rolled out in
    May 2018. It has since widened its scope to include not just the hulls but each
    vessel’s machinery and added a further piece to the jigsaw thanks to a partnership
    in May 2019 with China’s `Zhuhai` port. There are also developments around interoperability
    with other blockchains: the vision of a global, joined up supply chain system
    cannot be achieved with siloed systems.

