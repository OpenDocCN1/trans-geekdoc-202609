    indivisible properties to represent individual items. Where industry has been
    exploring the use of NFTs in asset twinning, gaming has taken the concept and
    run with it to introduce decentralized ownership and lay the foundations of a
    new and vibrant economy. At the same time, developers have had to address the
    challenge of capacity for the volume of transactions processed in a game and the
    amount of data that can be physically recorded on a blockchain. Games are remarkably
    complex when you break down the rules. Few of us realize how much processing we
