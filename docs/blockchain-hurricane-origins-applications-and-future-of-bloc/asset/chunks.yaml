    逻辑上，Nifty 许可背后的原理以及将独特资产的元数据编码到 NFT 中的能力似乎可以应用于游戏之外的领域。在音乐领域，艺术家伊莫根·希尔普（Imogen
    Heap）开发了 `Mycelia for Music`，这是一个为音乐制作人提供的研发中心。`Mycelia` 任务之一是确保所有艺术家在任何作品中的贡献都能获得“充分的报酬和认可”。这对于音乐行业尤为重要，因为曲目经常被采样并整合到其他作品中。此类活动大多是合法的，但音乐抄权诉讼已成为该行业几十年来的景观。`Mycelia
    Creative Passport` 于 2019 年发布，格莱奖博客^(13) 报道了伊莫根·希尔普通过给予“数字化的适当信誉”来保护音乐制作人的计划。然而，来自阿尔斯特大学的研究人员在受英国知识产权局委托编写的一份报告中发出了警示。^(14)
    他们承认“区块链看起来是缓解严格的版税框架限制的部分解决方案”，但同时也意识到该行业的复杂性以及音乐价值链中广泛的活动。该报告确定了处于不同开发和采用阶段的多个项目，它们都在解决行业挑战的不同方面。这些包括上述的
    `Mycelia`；来自 `ConsenSys` 的 `Ujo` 项目；`Musicoin`^(15) 流媒体平台；`Intel` 的合作伙伴 `dotBlockchain`，其使命是消除因文件类型变化而导致权利者信息丢失的损失；以及
    `Custos`，其版权保护系统和星际文件系统（`IPFS`）因音乐内容追踪和归属而正吸引大量关注。正如我们的全球商业供应链一样，许多拼图碎片正在汇聚在一起。


    在这些供应链中，NFT 也有许多用处。我们在第 4 章中遇到的榴莲生产者正在识别每一颗独特的水果，并将其元数据编码到 NFT 中，以便一直追踪到消费者。位于加利福州的
    `Centrifuge` 正在使用相同的方法解决供应链中的另一个问题，允许将金融业务文件创建为 NFT。最终，这种以“数字猫”进入主流的技术，现在代表了全球范围内广泛的资产。


    ## 区块链扩展


    在每个游戏中，都有明确的规则规定玩家的每一步操作。先考虑一些简单的棋类，如`黑白棋`（Othello）、`跳棋`（checkers）或`连棋`（Connect4），然后再去考虑`象棋`或`围棋`的变体。每一步都涉及了解棋子被允许行动的方式，并提前思考和计算潜在结果。当你考虑到推理推理的复杂性时，你就会为什么游戏一直是从`深蓝`（Deep
    Blue）到`深蓝`（Deep Mind）人工智能的训练场。


    一旦由人类或 AI 做出移动，我们就可以将此操作写入区块链，以便其他方进行验证。但我们能更进一步吗？已经证实，分布式账本上的智能合约能够执行交易。代币从一个钱包转移到另一个钱包，为股份和财产创建注册条目，生命事件被写入身份记录，并且可以创建一个具有独特祖先衍生遗传代码的
    `Cryptokitty`。游戏中的某一步难道不是简单的智能合约吗？逻辑上，区块链可以成为裁判，检查所做的移动是否合法以及结果是否正确。


    当然，这有一个陷阱。以简单的 `Connect4` 游戏为例。只有一种可能的移动：一个彩色的圆盘掉入框架，两名玩家试图在任何方向上形成四条不连续的直线。确认移动有效并检查玩家是否在该移动中获胜需要什么？智能合约需要建立：


    1. 游戏中的盘子是否比上一步移动结束时恰好多一个？

    2. 水平方向是否形成了四连线？

    3. 垂直方向是否形成了四连线？

    4. 对角线方向是否形成了四连线？


    为了验证移动的有效性，智能合约需要建立这些功能。随着游戏复杂性的增加，`gas fees`（燃料费）将变得触目惊心。解决扩展性问题至关重要，无论是在游戏还是领域。


    ## 可扩展性与速度


    当区块链首次作为数字货币引入时，其愿景是去中心化的支付系统。在吞吐量方面，全球主流处理器 `Visa` 报告其在 2018 年处理了 1243 亿笔交易^(16)，这接近
    4000 TPS。`PayPal` 拥有 2.67 亿活跃用户，同一时期处理了 100 亿笔交易^(17)，其结果为 317 TPS。相比之下，`比特币`的运行非常缓慢。后续的加密货币改进了这一点，尽管少数项目的吞吐量接近
    `Visa` 水平，但这尚未在大规模范围内经过测试。`Ethereum` 报告可达到 30 TPS，而 `Litecoin` 接近 50 TPS。最快的加密货币支付处理器是
    `Ripple`，其 `XRP` 币约为 1500 TPS，尽管这是通过 `Ripple 协议共识算法`而非在公共区块链上实现的，这可能不是有效的比较。根据
    `EOS 网络监控`，`EOS` 的历史最高值为 3996 TPS，但日常实时交易仅为此数字的分之一，在 2019 年 8 月访问时低于 100 TPS。`EOS`
    的设计是为了高可扩展性，旨在与 `Visa` 并肩，但 `EOS 区块链` 的结构和其`代理权益证明共识机制`导致了比传统加密货币更中心化的结构。


    '
- fmt: '

    Transaction speed, or latency, is a different side of the scalability equation.
    According to the `Kraken` cryptocurrency exchange, the actual time taken to move
    a coin from one wallet to another varies across a broad range from the near-instant
    `Ripple` and `Stellar` to a full hour for a `Bitcoin` payment. A significant part
    of the speed equation is the consensus mechanism used by each blockchain. `Proof
    of Work` is pure but slow. Any attempt to speed this up, for instance by making
    the mining algorithm easier, compromises the security of the blockchain. The `Ripple`
    protocol consensus algorithm, the `EOS` delegated Proof of Stake consensus, and
    `Stellar`s federated Byzantine agreement system (`FBA`) are all examples of effective,
    fast mechanisms, but there are concerns over centralization where validator numbers
    are limited. This suggests that there is a trade-off between true decentralization
    and transaction throughput.


    How will the speed and volume of processing grow? New blockchains are being developed
    with speed and scalability in mind. There are plenty of teams waiting in the wings
    and reporting test processing at hundreds of thousands of transactions per second.
    The market is skeptical of many of these claims simply because showing fast processing
    on a test net and a limited network of servers is very different to transactions
    in the real world. However, there are some exciting projects underway. Among this
    is `Algorand`, launched in July 2019, which has attracted a lot of attention with
    its platform claiming a throughput of `1000 TPS` and a five-second latency at
    a test volume of half a million transactions. It uses a new Byzantine Agreement
    protocol for consensus by committee with verifiable random functions to select
    the user who will propagate the next block as the chain grows.


    ## Sharding


    The `Ethereum` network is considering a concept known as `sharding`. This is used
    in traditional database management where large data repositories can be partitioned
    for faster processing. It is used for huge databases where users would otherwise
    be waiting a long time to retrieve their information from one source: multiple
    data shards speed up the process. Search engines, large e-commerce sites, and
    `CRM` systems all use `sharding` techniques. The parallels with the needs of blockchain
    are clear. The `Ethereum` sharding project aims to split validation workloads
    among different groups of miners, breaking the whole blockchain into shards or
    microchains carrying only a fraction of the transaction data. Since the nodes
    would no longer need to process each and every transaction, this can theoretically
    increase the speed and throughput of the network. There are complexities to be
    addressed with `sharding`, not least in security, ensuring that a particular shard
    cannot be compromised. However, randomizing the allocation of each shard and changing
    nodes regularly is one solution.


    `Ethereum` is not the only protocol looking at `sharding`. It is also of interest
    to `Hyperledger`, and some new blockchain projects are adopting `sharding` structures
    from the outset. As the concept has been proven in centralized databases, it is
    only a matter of time before the additional considerations for implementation
    in a decentralized setting are resolved. However, for the existing blockchain
    ecosystem, simple linear scaling is not going to put `Bitcoin` on a par with `Visa`,
    and `sharding` may not be the answer to every question.


    ## Let the Side Chain Take the Strain


    `Bitcoin`, `Ethereum`, and other truly decentralized blockchains run on what is
    known as a “gossip” protocol. This means that every transaction is broadcast to
    every node. This is one of the great strengths of the technology but as transaction
    volume grows, there are no easy economies of scale to be found. Developers are
    working on solutions that sit alongside the established system without compromising
    its structure. One of the most straightforward approaches to scaling has been
    the development of side chains as a second layer on the established protocols.


    Side chains were first proposed in a 2014 paper by `Back et al.`, which introduced
    the concept of “peged sidechains.” It suggests the “transfer [of] an asset from
    the (original) parent chain to a sidechain, possibly onward to another sidechain,
    and eventually back to the parent chain, preserving the original asset.” These
    side chains, the authors continue, would be independent blockchains and as such
    could host innovative development and experimentation. It is a concept that has
    been adopted and taken forward successfully by several developer groups. Let’s
    look at the innovations around the `Lightning Network` on `Bitcoin` and the gamer’s
    favorite, the `Loom Network`.


    ## Lightning Network


    The first generation of live side chain projects began with the `Lightning Network`
    on the `Bitcoin` protocol. In their 2016 paper, authors `Joseph Poon` and `Thaddeus
    Dryja` proposed “scalable off-chain instant payments” for the `Bitcoin` blockchain.
    The authors recognized that as every change in state of the `Bitcoin` ledger is
    broadcast across the network, this could never be scaled to compete with the centralized
    payment systems currently servicing the world’s commerce. They proposed that transactions
    could be processed in separate channels with only the final change of state being
    broadcast. This decongests the network and reduces the costs to the user as fees
    are only payable to miners when the change of state transaction is processed on
    the main blockchain.


    A good example of how this works in real life is simple day-to-day micropayments.
    Want to buy your coffee in `Bitcoin`? Waiting for validation and confirmation
    from the network means a long line and cold coffee. Instead, such micropayments
    can be managed through a `Lightning Network` app. You set up a small balance in
    `Bitcoin`, much like a prepay debit card, and buy your coffee using this balance.
    At any point, either when you no longer need this one-to-one link to your vendor,
    or at a point in time such as the end of a month, the change of state, not the
    individual transactions which led to it, can be written back to the blockchain.
    In accounting terms, which are a good analogy, the side chain holds individual
    journal entries for each coffee purchase in a ledger account, and the `Bitcoin`
    blockchain shows only the opening and closing balances of that account at a point
    in time.


    `Lightning Network` developers have addressed a number of security concerns, including
    how to manage disputes about the account balance on a side chain without compromising
    the main blockchain record. `Lightning` has inspired a wave of side chain innovation.


    ## Plasma


    `Plasma` is a development layer on `Ethereum` with a similar goal to `sharding`,
    but a structure not dissimilar to that of `Lightning`. It enables the creation
    of “child” chains with their own distinct properties, which use the main `Ethereum`
    blockchain as the trusted source. Special smart contracts on `Ethereum` known
    as `root contracts` contain the rules that govern the behavior of each child chain.
    `Plasma` is still in development as a standalone solution, but it has been adopted
    to reinforce asset security in the `Loom Network`.


    ## Loom Network


    How do you deliver a decentralized gaming experience without slowing to a crawl?
    The answer, according to the `Loom Network`, is to develop application-specific
    side chains.

