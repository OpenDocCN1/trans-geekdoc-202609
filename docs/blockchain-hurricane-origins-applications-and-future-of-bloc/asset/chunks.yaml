    ## 第一章：炒作与希望


    区块链为我们做过什么？它的第一个十年是动荡的、迷人的、充满希望、充满危险、充斥欺诈，并最终具有启发性。


    ### 解密术语


    任何新兴技术的挑战之一都是发展出一套解释其特征的新词汇。区块链和加密货币周围的术语也不例外。


