    Accountants and auditors are wary of blockchain because of the prime entry challenge,
    which we examined in [Chapter 4](#04_Chapter_4.xhtml). Blockchain is a cryptographically
    verifiable record of transactional truths, not a record of absolute truth. Auditors
    are wary of trusting a ledger without oversight of the source material, which
    is why my CPA colleagues spent their training years climbing gantries to check
    that storage tanks were full, and I as a management accountant in manufacturing
    counted thousands of bolts and screws by hand to verify stock levels. Audit confidence
    measures are complex, and as Meyers says, blockchain doesn’t fit them yet. He
    also believes there is a perceived threat to the profession from standardization
    of the audit approach. Wariness preserves both jobs and the consulting revenues,
    which are based on interpreting ever more onerous regulation. However, given the
    recent criticism of the Big Four audit firms in light of high-profile business
    scandals, there may well be changes coming from within. It is likely that regulators
    will seek to break the stranglehold of the market leaders and to reinstate the
    division between consultancy and audit firms which existed until the early 1980s,
    when Price Waterhouse (later `PwC`) bought management consultants Urwick Orr and
    Partners.


    When this change comes, Meyers and his colleagues will be ready. Auditchain is
    the founding member of the `DCARPE Alliance`, a growing network of early adopters
    collaborating to prove that there is a better way to perform assurance on an enterprise
    that enables real-time financial reporting. The Decentralized Continuous Audit
    and Reporting Protocol Ecosystem divides the systems, control, and data elements
    of an audit between smaller firms, resulting in an appropriately decentralized
    cohort of auditors rather than a single firm. The blockchain reports attestations
    from the auditors under the International Financial Reporting Standards which
    govern accounting practice. The earliest clients for this approach are businesses
    already working in the blockchain and cryptocurrency space who are receptive to
    new ideas and need a solid financial context for their business. This is going
    to be a fascinating sector to watch and represents a real opportunity for blockchain
    to offer an appropriate solution to an ever-growing problem.


    ## Commercial Letters of Credit


    Although blockchain has claimed its place in cross-border settlements in banking,
    and in the management of private equity as pioneered by Northern Trust, other
    financial services could benefit from immutable records, distributed verification,
    and smart contracts. One example is the existing system of Letters of Credit that
    reduces commercial risk in import and export.


    Paying for goods from people with whom you have no trust relationship is straightforward
    face-to-face but becomes more complex as soon as the transaction is no longer
    instantaneous. For this, we rely on establishing trust with intermediaries. At
    a consumer level, `eBay` is a good example of a centralized system which helps
    people to manage the risk associated with making payment and then waiting for
    goods. It gives buyers confidence to send their money to an unknown seller and
    has mechanisms in place for a refund in case of problems. It holds sellers to
    account by making the opinion of buyers transparent through a review system and
    imposing sanctions in case of default, and protects them as far as possible through
    prompts to secure payment before delivering goods.


    Commercial Letters of Credit, also known as Documentary Credits, are guarantees
    issued by banks to reassure the seller that funds are available before shipping
    and that payment will be made as soon as the goods are received. However, at commercial
    scale, this system is complex and costly. The value of cross-border shipments
    and the length of time for a cargo to cross the world are many times that of a
    typical consumer purchase. The commitment by the supplier, particularly when manufacturing
    or growing goods to order, is significant. The buyer, too, may have to put cash
    on deposit for the bank to issue its guarantee, tying up working capital for weeks
    or months.


    This is a process that is ripe for disruption if a reliable solution can be implemented
    at scale. `HSBC` piloted blockchain-based Letters of Credit on the `Voltron` platform
    during 2019, including a yuan-denominated transaction which took 24 hours to complete
    against the standard ten days^([9](#08_Reference.xhtml#c7.9)). This was a major
    step toward a commercial model for banks, with lower costs and faster processing,
    and an important part of the wider push toward a distributed, holistic international
    supply chain.


    ## Changing societies


    Blockchain and other emerging technologies are rapidly changing the way our society
    operates. There are exciting changes ahead for the majority but concerns that
    a significant minority are not keeping up. Even in countries with universal access
    to learning there is a remarkably high proportion of the population who are not
    digitally literate. In the United States, it was reported in 2019 that 10 percent
    of Americans did not go online, and in the United Kingdom a similar study identified
    that almost a fifth of Britons did not use the internet.^([10](#08_Reference.xhtml#c7.10))
    In both countries this included older citizens and also, significantly, demographics
    with lower educational attainment and household income. We have already seen how
    unbanked citizens in a banked economy are disadvantaged, but if this group cannot
    access the decentralized online communities which characterize our brave new world
    they will be left behind. A changing society must include education and support
    to harness opportunities.


    ## Rewarding the Creator


    One of the most prized goals for blockchain is the democratization of earnings.
    This goes right back to the `Crypto Anarchist Manifesto`,^([11](#08_Reference.xhtml#c7.11))
    which envisioned “a liquid market for any and all material which can be put into
    words and pictures.” Blockchain offers a mechanism for financial inclusion for
    producers and creators, and the work already ongoing in the provenance of goods
    and the traceability of commodities through the supply chain makes the source
    of such items transparent. In [Chapter 5](#05_Chapter_5.xhtml) we also looked
    at the role of blockchain, particularly nonfungible tokens, in the music industry
    and supply chain, and the ongoing work which is gaining traction in managing a
    complex, borderless royalties system.


    Ensuring that there are appropriate rewards for producers of the physical is something
    that has already been championed by the `Fair-Trade Foundation` and similar organizations
    throughout the world long before the advent of blockchain. The role of blockchain
    here is not to disrupt but to offer a tool to help the established systems. Blockchain
    may help to reduce the cost of credit to producers and manage the “last mile”
    of cash. Ensuring that payment reaches the right people, and that any losses in
    cross-border settlement are minimized, may be a role for cryptocurrency. Fair
    Trade also recognize the potential of blockchain in the decentralization and democratization
    of information.^([12](#08_Reference.xhtml#c7.12)) Their hope is that it “could
    support farmers to understand the journeys their crops take—potentially helping
    them to better manage their customer relationships and risks—and ultimately become
    more resilient.”

