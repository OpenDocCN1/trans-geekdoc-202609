    Complex engineered assets such as offshore platforms, power stations, and process
    plants have a clearly defined lifecycle from design intent through construction,
    commissioning, and operation to decommissioning and recycling. The challenge of
    disposal is particularly critical because of the knowledge that is lost through
    the decades. How could this knowledge be preserved reliably throughout the asset
    lifecycle?


    In 2003 four obsolete U.S. Reserve Fleet hulls, dubbed the “ghost ships,” arrived
    on the British coast to be dismantled by expert reclamation operators. After a
    five-year delay due to environmental protests, the Able UK Environmental Reclamation
    and Recycling Centre in Hartlepool finally started work to break up the vessels,
    dealing with pollutants and recycling what they could of the materials. The Able
    UK yard, which lies at the mouth of the river Tees, is still humming with activity.
    It was responsible for breaking up the legendary French aircraft carrier, the
    Clemenceau, and has regular business dismantling oil and gas drilling platforms
    just a few miles from the docks where new rigs are being built. Even though oil
    rigs return to the Tees like spawning salmon to the river of their birth, there
    is a knowledge gap. Local legend tells of a 36” pipe on one such platform whose
    purpose was lost in the mists of time and memory. What ran through that pipe?
    What pollutant should the breakers account for? Is it safe to recycle the metal,
    or is it scrap? Without a ledger of record valuable resources are being lost,
    as disposal becomes the least risky option in the absence of certainty.


    Teesside-based Kraken IM (Information Management) took on the challenge of this
    complex supply chain, and now work with global oil and gas giants to turn the
    existing system of record to a true ledger of record. Their initial focus is on
    ensuring that all relevant information from individual manufacturers and contractors
    is available during construction and is sufficient for commissioning and operation
    of a vessel, platform, power station, or other major capital asset. This is a
    complex task: records must cover everything from the supply of 10,000 fire extinguishers
    to the construction of process plant and must be of comparable quality across
    the diverse range of pieces which make up the whole. As CEO Ian Cornwell explained,
    a multibillion-dollar project may involve over a million individual items of equipment,
    and the data on each piece must include the design intent, its function, materials,
    and operational information such as maintenance manuals. There are a lot of competing
    systems of record and teams that run them who hold this wealth of data, and as
    a result there is often a need for a systems integrator to make sense of the patchwork.
    This builds additional layers of cost and complexity and into already highly complicated
    projects. Furthermore, data can be transferred across different systems during
    the decades of operation of a capital asset, with all the additional costs and
    field matching challenges and failures that such transfers always involve. It’s
    a recipe for confusion and waste.


    Kraken’s vision is to move the industry from systems of record to a ledger of
    record, changing a document-centric industry to a data-centric culture. Cornwell
    gives the example of an aspect of a project where the design intent is “I need
    a pump just here.” There will be engineering requirements, standards, and local
    regulatory constraints that impact on the specification against which suppliers
    will be asked to tender. A supplier may propose a slightly different material
    which in their experience will be more effective in the setting. Even before the
    pump is fitted, changes may have been made against the design intent. Recording
    the individual stages of approval ensures that at commissioning it is quite clear
    to the operator what has been supplied. This is a step toward greater clarity
    at the end of the lifecycle, where the asset can be dismantled based on the reality
    of what has been supplied, not the initial design documents. A full ledger of
    record for Architecture, Engineering, Construction, and Operation (AECO) would
    give a transparent asset history sufficient to maximize the recycling effort,
    creating a genuine circular economy for engineering equipment.


    The Halcyon information management platform developed by Kraken initially focuses
    on approval milestones in the project lifecycle between supply and commissioning.
    The audit trail shows when an item was supplied, who supplied it, what it is,
    how it compares to the original design intent, and decisions affecting it through
    construction. This growing data corpus not only supports the asset lifecycle but
    gives greater scope for analysis and decision making than standalone documentary
    systems. There was one barrier to adoption that Kraken had to surmount: persuading
    engineers to let go of their documents, and to trust in the data instead. As Cornwell
    explained, “The only thing we cared about was the provenance. We already had an
    approval workflow but proving when something was signed off and what exactly it
    was opens doors to other functions.”


    Blockchain’s transparent and immutable characteristics provided the solution.
    By anchoring the date, time, and approval details to a transaction on the Tierion
    Chainpoint network, they now had provenance for signoffs. They also achieved transparency
    for information that is not as static as a system of record might suggest. Decisions
    and planning throughout the project rely upon easily available data. For example,
    being able to define the weight of a unit made from many components is essential
    when planning the logistics of construction, such as hiring the right crane for
    the job.


    One of the things that interested me was Kraken’s experience of reliable prime
    entry to the ledger. Blockchain gives us trust in transactions but is not a repository
    of absolute truth. How could users be sure that the milestone was recorded accurately?
    According to Cornwell, the action of making the transaction visible to all parties
    has resulted in people being more conscientious about the entry itself. This is
    pleasingly reflective of the original concept of public announcement of a digital
    asset transaction, as outlined by Wei Dai in 1998 and adopted by Satoshi in the
    2008 Bitcoin white paper: Visibility is an arbiter of trust. In addition, Kraken’s
    clients have observed that the actual approval process has become more rigorous
    because of the immutable record that is generated. The engineering world is naturally
    risk-averse, especially when dealing with hazards such as oil, gas, and nuclear
    power. As accountability becomes more onerous, for example following the Hackitt
    Report on London’s 2017 Grenfell Tower disaster, parties who know they may have
    to stand by their decisions in an enquiry are very careful to do things right.


    The Hackitt Report called for digital by default product specification and persistent
    identity for components, which is the ultimate goal for the AECO supply chain,
    and proposals went to public consultation in June 2019, which, if passed, will
    see persistent identity and traceability become law in the UK. Full equipment
    traceability has wide implications not only for safety but also to enable a decision-making
    shift from lowest initial capital expenditure to lowest total expenditure over
    an asset’s lifecycle. This holistic approach to the capital asset lifecycle may
    lie some way in the future, but the building blocks are in place.


    ## Enterprise Blockchain at Scale

