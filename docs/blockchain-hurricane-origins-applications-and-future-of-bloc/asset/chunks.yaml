    [CHAPTER 1](#contents.xhtml#c1)


    [The Hype and the Hope](#contents.xhtml#c1)


    What has blockchain ever done for us? Its first decade has been turbulent, fascinating,
    full of promise, fraught with danger, riddled with duplicity, and ultimately inspiring.
    Its inextricable link to Bitcoin has generated a high degree of skepticism over
    the contribution blockchain can make to our world, matched only by the fervor
    of advocates who believe that blockchain and cryptocurrency can drive fundamental
    changes in working practices and meet societal challenges.


    This book seeks to inform, not to evangelize. We will look at the evolution of
    cryptocurrency from its origins in cryptography to its birth in the fires of a
    global financial crisis, and through the first decade of digital cash. We will
    examine the niches where blockchain, the technology that underpins cryptocurrency,
    can be an effective solution to other problems, where it is already being employed,
    and how to decide whether it is an appropriate path to take in resolving challenges
    in your business and industry. We’ll reflect on the mistakes that have been made
    in rushing to adopt blockchain where hype overtakes practicality, in the hope
    that we can learn from a checkered history. We’ll also explore the real innovations
    that are happening, the things that could not be achieved without blockchain and
    cryptocurrency, and the future impact that experts foresee.


    Decrypting the Jargon


    One of the challenges of any emerging technology is the new vocabulary that develops
    to explain its features. The jargon surrounding blockchain and cryptocurrency
    is no exception.'
