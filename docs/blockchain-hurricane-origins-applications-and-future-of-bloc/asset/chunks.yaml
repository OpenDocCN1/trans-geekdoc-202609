- fmt: '

    This is the most flexible interpretation we have seen and comes from a jurisdiction
    which is largely supportive of ICOs. France has taken time to consult with the
    industry and define the practicalities around token sales. The `PACTE` law, an
    action plan for the growth and transformation of business (plan d’action pour
    la croissance et la transformation des entreprises) was enacted in April 2019
    and includes specific regulation surrounding `ICOs` (Offres de jetons virtuels).
    It recognizes that `ICOs` have become a key fundraising vehicle for innovative
    projects, and that it is important to distinguish the genuine offers from the
    fraudulent. Its guidelines include the use of a traditional escrow mechanism for
    the token sale process, proof of robust internal systems and insurances for the
    company, and a requirement for clear and accurate white papers, all intended to
    mitigate risk to investors.


    ## Malta, Gibraltar, Singapore, and Zug


    Several smaller states accelerated past more complex jurisdictions in the early
    days of this industry to establish themselves as champions of blockchain and cryptocurrency.
    They attracted attention from fundraisers seeking legislative endorsement and
    credibility for their `ICOs` in the gold rush years 2015 to 2017 and proposed
    early examples of specific regulations, which are gradually being passed into
    local law.


    In its quest to become the capital of blockchain and cryptocurrency in Europe,
    Malta, the self-styled Blockchain Island, passed three bills in November 2018
    around technology, tokens, and cryptocurrency. According to Forbes writer Rachel
    Wolfson, the Malta model takes a technology first approach and has developed a
    clear regulatory framework, recognizing the importance of legal certainty for
    businesses in the sector. The bills include certification for exchanges, which
    was a major factor in the relocation of leading exchange `Binance` to the island,
    a regulatory regime for `ICOs`, and a requirement for internal governance in distributed
    ledger technology to promote credibility.


    From Crypto Island to Crypto Valley, the Swiss canton of `Zug` was an early haven
    for blockchain businesses and a welcoming jurisdiction for `ICO` fundraising when
    other countries were still developing their guidelines. More than 50 blockchain
    companies are now established in the region.


    Gibraltar also pitched for the “blockchain island” crown, developing the first
    regulatory framework for distributed ledger technology, and establishing a series
    of nine principles to which `DLT` businesses on the peninsula are expected to
    subscribe.


    Singapore’s `Securities and Futures Act` governs utility and security tokens,
    while its `Payment Services Act` regulates what the British `FCA` would describe
    as Exchange Tokens.


    Gibraltar, Malta, and Singapore historically inherited the British legal framework,
    for a variety of reasons, and the flexibility of their regulations has much in
    common with the balance that seems to have been achieved by the UK’s `FCA`. After
    a torrid few years, the Gold Rush seems to be fading, and we are moving toward
    a more stable ecosystem with sustainable business models.


    ## A Coin for Every Occasion


    The United Nations recognizes 180 currencies as legal tender in the real world.
    By contrast, `Cryptoslate` lists over 2,100 cryptocurrencies. The proliferation
    of coins in the digital world comes down to their nature: cryptocurrencies are
    programmable money. They can and do have specialist functions according to their
    place in the digital ecosystem. Many coins grease the wheels of their own distributed
    ledger, while others are tokens within `Ethereum`.


    Tokens are a particularly interesting aspect of distributed ledger technology.
    A token is not just digital cash: it is programmable money. Tokens with different
    properties are commonly referred to by the reference number of the relevant Ethereum
    Request for Comment (`ERC`), which led to their development by the open-source
    community. The most common are `ERC20` tokens, which act as native currency for
    applications built on the `Ethereum` blockchain. Other tokens have specialized
    roles: `ERC721` and `ERC1155` have been widely adopted to perform specific functions
    in gaming and are spilling over into the world of business, as we will see in
    Chapter 5. A token can be a measurement of value, a nonmonetary unique or generic
    asset, or a degree of influence in a community.


    Let’s have a look at some of the types of cryptocurrencies in circulation and
    their individual functions.


    ### Anonymity and Privacy


    `Bitcoin`, `Ether`, and other cryptocurrencies appear to the casual eye to be
    anonymous, with a user’s wallet address rendered as a string of letters and numbers.
    This is not the case. They are not anonymous, but pseudonymous. It is entirely
    possible to trace transactions out to the real world. There are other coins, however,
    whose structure enables anonymity and privacy for users. The most prominent of
    these are `Monero`, `Dash`, and `Zcash`.


    While any transaction on the `Bitcoin` blockchain identifies the sender, receiver,
    and amount for all to see, transactions involving privacy coins are obfuscated
    in a variety of ways. Mechanisms include hiding details of the transacting wallets,
    splitting payments into several separate amounts, disguising a genuine transaction
    in a list of decoys, and permissioned views. In effect, these coins replicate
    our day-to-day cash transactions: no transparent, public record can be interrogated
    to prove who passed a dollar bill to their friend.


    ### Stablecoins


    One of the greatest challenges for cryptocurrency is the volatility of `Bitcoin`,
    `Ether`, and their peers. Quite apart from bubbles such as 2017’s tenfold rise
    in value and 2018’s corresponding fall, the day-to-day fluctuations in cryptocurrency
    compared to large fiat currencies cause friction and challenges with adoption.
    While the crypto ecosystem is still small, there are too few transactions for
    value exchange (in other words, purchase of goods and services) compared to the
    volume of speculative trades, which drive dips and spikes in price. Even where
    there are flourishing areas of cryptocurrency use or popular applications, the
    exchange risk involved in moving back and forth to fiat is high. This friction
    at the edge is a substantial barrier to entry and tars perfectly sound distributed
    ledger applications with the brush of unpredictability.


    Enter the stablecoin. This is a specific class of cryptocurrency whose value is
    not driven by the vagaries of the emerging cryptocurrency market but by the movements
    of real-world assets. There are several advantages to stablecoins, reducing friction
    at the edge of the crypto ecosystem by acting as a form of value airlock. For
    investors in cryptocurrency they represent a lifebelt within the crypto world,
    a safe haven in the event of extreme volatility. For existing users of public
    blockchain applications, they are becoming a link to the real world: in California,
    for example, it is now possible to pay state taxes from cannabis-related businesses
    in stablecoin. Finally, applications which use a stablecoin as their core cryptocurrency
    remove a large part of the perceived risk for new adopters, enabling people to
    benefit from blockchain-enabled applications without worries over volatility and
    liquidity.


    The earliest and most widely adopted of a clutch of stablecoins, `Tether` is aligned
    to the value of the U.S. dollar and collateralized by its matching fiat currency
    reserves. `Tether` has suffered from bad press in the past, notably due to a lack
    of independent verification of its reserves. It also gained notoriety thanks to
    third party manipulative trading of `Bitcoin` to and from `Tether`, which may
    have artificially inflated the value of `Bitcoin` during the bull run of 2017.

    '
