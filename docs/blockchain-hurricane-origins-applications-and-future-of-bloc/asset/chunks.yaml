- fmt: '

    Exchanges may have been free of centralized government regulation, but they have
    been historically equally free of any exacting or enforceable standards to protect
    the consumer. For many people the risks involved in remaining on an exchange are
    outweighed by fear of the complexity and precision required to move funds to wallets
    under their sole control. Exchanges have been trusted to watch over significant
    holdings of cryptocurrency on behalf of individuals, resurrecting an age-old question.
    A little short of two thousand years ago, Roman poet Juvenal coined the phrase
    “Quis custodiet ipsos custodes?”: Who watches the watchmen? This is a legitimate
    concern. In February 2014 the highest volume exchange of the time, `Mt Gox`, suffered
    a record theft which ultimately brought down the organization as thousands of
    holdings were compromised and a staggering 850,000 Bitcoin were stolen, although
    some were later recovered. Despite efforts by exchanges to build trust and establish
    self-regulation, a second scandal emerged almost five years later. Canadian company
    `Quadriga Fintech Solutions` originally hit the headlines in 2015 as potentially
    the world’s first publicly traded Bitcoin exchange. The plans to list were shelved
    soon after this announcement, but coming as it did in the wake of `Mt Gox`, the
    publicity helped `Quadriga`’s reputation as a business that expressed a wish to
    be regulated. In January 2019 following some financial challenges, it was reported
    that founder `Gerald Cotten` had died suddenly without leaving instructions for
    access to the cold (offline) wallets holding all the funds deposited on the exchange.
    Suspicions raised at the time about the circumstance of the loss and the certification
    of `Cotten`’s passing in India were vindicated when auditors discovered that the
    wallets had been emptied some weeks prior to the founder’s disappearance. During
    the long court investigation which followed, `Ernst and Young` observed that the
    “operating structure was significantly flawed from a financial reporting and operational
    control perspective.” If self-regulation falls at the first hurdle, what trust
    can be placed in custodians?


    ## Case Study: Gemini


    Cameron and Tyler Winklevoss, founders of the `Gem` exchange, sit firmly in the
    camp of externally regulated custodianship. As seasoned crypto investors they
    watched the development of the space including the high-profile exchange disasters
    and increasingly frequent reports of theft from both exchanges and individuals.
    This prompted them to act. In most of these cases, they observed at their `SXSW
    2019` keynote, the weak link has been human: the trust placed in the guardians
    of crypto assets has been misplaced.


    Who watches the watchmen? they asked the audience. In the absence of caped heroes,
    the Winklevoss twins assert that regulatory oversight is currently our only hope.
    They argue that the healthiest financial markets are those with the best regulation,
    and that regardless of the currency involved, the future of money requires trust.
    They started work on their `Gemini` exchange in the aftermath of the `Mt Gox`
    collapse and acquired their banking license before launching. `Gemini`’s founders
    have their eyes on long term security for investors and long-term success for
    the business, once again comparing the development of the cryptocurrency space
    with the historic rise of the internet. They reminded the audience about early
    legal wrangles between `Microsoft` and `Netscape`, which held those 1990s giants
    back from dominance on the internet, allowing `Google` to overtake. The Winklevoss
    twins are in the exchange business for the long haul, ready to take the opportunity
    that being a trusted custodian should convey.


    ## Defining Stability


    Critics have said in the past that “you can’t buy your coffee with Bitcoin.” As
    we have seen, this is no longer the case in Tokyo, Caracas, Bangkok, and hundreds
    of cities around the world, but the trope illustrates a fundamental challenge
    for cryptocurrency: its volatility when compared to fiat currency. We are generally
    used to a $3 coffee today being a $3 coffee tomorrow. We take home our regular
    pay, and budget for the month accordingly. Surely it’s unreasonable to adopt a
    system where coffee is $3 today, $6 tomorrow, and $1 the day after? In some places,
    this is the norm. Friends who lived in Zimbabwe during its prolonged periods of
    economic instability recall walking into the store and not knowing whether the
    bread would be 20 cents or $5 that day. Patricia O’Callaghan’s father still works
    in banking in Venezuela: I have seen video of thousands of notes being fed into
    the bank shredder, replaced by a new issue after only two years as legal tender.
