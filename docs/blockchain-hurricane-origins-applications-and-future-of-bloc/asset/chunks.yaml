- fmt: '

    One of the greatest misconceptions about blockchain is that it is a database holding
    large volumes of immediately legible information, which cannot be tampered with.
    In reality, it is a database holding strings of encrypted information, and the
    only reason it cannot be tampered with is that each block has a fixed position
    in the chain. Changing the data in one block means changing the data in all the
    blocks that follow it, and that takes more effort to achieve than the benefit
    that would accrue, if it is possible at all. Each block is remarkably small, and
    the transaction data that is held on chain is rendered down to a single cryptographic
    hash, or checksum, of the text, images, or journal entries concerned.


    Talk of putting processes “on the blockchain” glosses over these inner workings,
    but this is entirely normal. How often do people dig under the hood and into the
    code that delivers the software they use day to day? When you connect to the internet
    do you think about the functions, protocols, browser technology, and search algorithms,
    which display your Google results? Do you consider the structure and workings
    of the World Wide Web, which deliver your seamless communication experience? It’s
    rare. Normally the only question that exercises us is the reliability of our internet
    connection and the speed with which we can upload pictures of cats. At this early
    stage of distributed ledger adoption, however, it seems important to review the
    basic structure of the blockchain. Understanding this can help in decision making
    when you are judging the suitability of a distributed ledger to solve the problem
    in hand.


    ## Merkle Trees and Hashed Records


    Let’s take a Bitcoin blockchain block at random. Block number `575171` was mined
    on May 8, 2019. Searching for this block reference through `blockexplorer.com`
    reveals that there are 2,568 transactions in the block, which holds only 908,496
    bytes of data: just under a single megabyte. This compact record is made possible
    by cryptographic hashing.


    A cryptographic hashing algorithm is used to convert an entry of any length into
    a regular string of letters (upper and lower case) and numbers (0–9). Commonly
    the algorithm used is a Secure Hash Algorithm 2` (`SHA-2`) function such as `SHA-256`
    (quite simply, an algorithm that produces a 256-bit, or 32-byte, hash) or `SHA-512`
    (512 bits, or 64 bytes), but there are many other options to produce the unique
    string required for the confidentiality and integrity of data. The importance
    of this string is that if the same entry (a document, image, or transaction) is
    hashed again using the same algorithm, the string will be identical, and the entry’s
    integrity is verified. However, if there has been any change at all, however small,
    the strings will not match. Even removing a comma from a sentence in this book
    will generate a different string when the manuscript is processed. A simple application
    of this comparison might be to prove that a piece of intellectual property has
    been recorded on the blockchain on a specific date. Hashing the disputed document
    and verifying that hash against the blockchain can prove that it is, or is not,
    identical to the original. The first example of blockchain evidence presented
    in a case in China in June 2018 used precisely this technique to prove that an
    article had been reproduced without permission by the defendants.


    In our blockchain, a second round of hashing converts a pair of strings into yet
    another unique hash, and this process is repeated pair by pair until all the entries
    have been consolidated into one single string. This hierarchy of hashed strings
    is a `Merkle Tree`, and the final string, the `Merkle Tree Root`, appears in the
    block. (These are named for Ralph Merkle whose 1979 thesis addressed cryptography
    in public key systems.) When transactions are verified, as in the Chinese copyright
    case, it is actually this root that is the subject of comparison. It is quicker
    to check one root than thousands of strings, and if one change occurs within the
    strings then the `Merkle root` would itself change. With me so far? Good.


    ## Closing the Block


    We have now compacted all our records down to a single string of letters and numbers.
    This string sits in a child block at the very end of the blockchain. On the blockchain
    explorer you can see the reference to its parent, block `575170`. Out in the blockchain
    network computer power is being fired continuously as participating nodes compete
    to run a new cryptographic hash with a twist. To complete the block, the hash
    of the contents including an unknown variable must result in a string with a predefined
    number of leading zeros: The `Block Hash`. The computer that is first to find
    a possible variable value to deliver a valid `Block Hash` is entitled to close
    the block and open the next one. The calculated variable is the `nonce`, and it
    is recorded in the block header along with the timestamp of the solution. This
    process is known as mining: on the Bitcoin blockchain a predefined reward is paid
    to the successful miner, along with fees for each of the 2,568 transactions in
    the block.


    ## Immutability


    Why do we insist that the blockchain cannot be changed? The answer lies in the
    structure of the chain, the contents of the block, and the distributed ledger.
    Our block number `575171` contains a reference to `575170`. It will include the
    `Block Hash` of `575170` in the calculation of the `Block Hash` of `575171`. If
    a single party was to attempt to change any transaction within `575170`, its `Block
    Hash` and that of all the subsequent blocks would then no longer match the original
    details held on multiple copies of the ledger on all the nodes of the blockchain.
    It is simply too onerous to recalculate the hash of all the subsequent blocks
    to cover up a change, and someone attempting to do this would never catch up with
    the progression of the valid chain. The math involved is difficult and time-consuming,
    even for the increasingly powerful computer processors used for the purpose. There
    are valid concerns that the emergence of quantum computing would enable processing
    powers sufficient to recalculate `Block Hashes` at a very high speed, but the
    overarching rule of blockchain security still applies: the cost of tampering with
    the records is greater than the benefit that would accrue to any bad actor.


    Knowing the structure of a simple blockchain enables you to assess the suitability
    of the technology for your business challenge more effectively. Where verifiable,
    timestamped, unchangeable records will streamline processes, cut out costs, improve
    lives, or reduce risk, then there is a case to consider the use of blockchain.
    As with every new technology on the horizon, it is not appropriate for speculative
    re-factoring of existing systems unless there is a genuine requirement for the
    features it introduces. Industry will not have time, at the current speed of development,
    to devote resource to the replication of current systems for the sake of it. When
    word processors replaced typewriters, it took decades to deliver the extra functionality
    we now take for granted. With the speed at which technology now evolves, we must
    focus on enhancement.


    ## Where Is Blockchain Taking Us?


    Changes wrought by blockchain will be dramatic and disruptive. To take one example,
    the disintermediation of processes will be a particular challenge for agencies.
    We have already seen the impact of online booking on travel agents whose business
    models have moved away from brokerage and toward delivering added value. As decentralized
    structures move users toward peer-to-peer behavior, agents in more complex sectors
    such as property sales may find themselves in the same position.

