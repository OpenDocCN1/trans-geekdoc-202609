    复杂的工程资产（如离岸平台、发电站和工艺工厂）具有明确的生命周期，从设计意图到建设、调试、运行，直到报废和回收。处置阶段的挑战尤为关键，因为这些知识在数十年的时间里会流失。如何在整个资产生命周期内可靠地保留这些知识呢？


    2003 年，四艘被称为“幽灵船”的过时美国储备舰队船体抵达英国海岸，由专家级回收作业人员进行拆解。在因环保抗议延迟了五年后，位于哈特尔普尔（Hartlepool）的
    Able UK 环境回收与循环中心终于开始拆解这些船只，处理污染物并尽可能回收材料。位于提斯河河口的 Able UK 船厂依然忙碌。它曾负责拆解传奇的法国航空母舰“克莱门梭号”（Clemenceau），并就在距离新建钻井的码头几英里处定期拆解油气钻井平台。尽管油井平台像产卵鲑鱼一样回到出生地的提斯河，但仍存在知识断层。当地传说说，其中一个平台上有一根
    36 英寸的管道，其用途在时间的迷雾和记忆中消失了。那根管道里流的是什么？拆解者应该考虑哪些污染物？金属回收是否安全，还是属于废料？在没有记录账（ledger
    of record）的情况下，由于处置变成了风险最低的选择，宝贵的资源正在流失。


    位于泰斯赛德（Teesside）的 Kraken IM（信息管理）承担了这一复杂供应链的挑战，现在正与全球油气巨头合作，将现有的“记录系统”转变为真正的“记录账”。他们的初期重点是确保在建设期间能够获得来自各个制造商和承包商的所有相关信息，并确保这些信息足以船舶、平台、发电站或其他大型资本资产的调试和运行。这是一项复杂的任务：记录必须涵盖从提供
    10,000 个灭火器到建造工艺工厂的方方面内容，并且在构成整体的各种部件中具有相当的质量。正如首席执行官 Ian Cornwell 所解释的，一个耗资数十的项目可能涉及超过百万件单件设备，每件设备的数据必须包括设计意图、功能、材料以及维护手册等运行信息。目前有许多竞争性的记录系统以及运行这些系统的团队持有这些丰富的数据，因此，通常需要系统集成器来理解这些补丁般的信息。这为本已高度复杂的项目增加了额外的成本和复杂性。此外，在资本资产数十年的运行期间，数据可能会在不同系统之间传输，并伴随着此类传输总是涉及的所有额外成本、现场匹配挑战及失败。这是混乱和浪费的根源。


    Kraken 的愿景是推动行业从“记录系统”转向“记录账”，将一个以文档为中心的行业转变为以数据为中心的文化。Cornwell 举了项目某个方面的例子，其设计意图是“我恰这里需要一个泵”。这会有工程要求、标准和当地法规限制，这些因素会影响要求供应商投标的规格。供应商可能会提出略有不同的材料，根据他们的经验，这种材料在特定环境下更有效。甚至在泵安装之前，针对设计意图可能已经发生了更改。记录每一个审批阶段可以确保在调试时，操作人员能够清楚地知道供应了什么。这是向生命周期末端更高清晰度的一步，届时资产可以根据供应的实际情况而非初始设计文件进行拆解。针对建筑、工程、施工和运营（AECO）的完整记录账将提供透明的资产历史，足以最大限度地提高回收努力，为工程设备创造真正的循环经济。


    Kraken 开发的 Halcyon 信息管理平台最初关注项目生命周期中供应与调试之间的审批里程碑。审计追踪显示了某物品何时供应、由谁供应、它是什么、它与原始设计意图相比如何，以及在建设过程中影响它的决策。这一不断增长的数据库不仅支持资产生命周期，而且比孤立的文档系统提供了更大的分析和决策空间。Kraken
    必须克服一个采纳方面的障碍：说服工程师放弃他们的文档，转而信任数据。正如 Cornwell 所解释的，“我们唯一关心的是来源（provenance）。我们已经有一套审批工作流，但证明某物何时签署的以及它具体是什么，为其他功能开启了大门。”


    区块链的透明性和不可篡改性提供了解决方案。通过将日期、时间和审批细节锚定到 Tierion Chainpoint 网络上的交易中，他们现在拥有了签署的来源证明。他们还实现了那些不像记录系统暗示那样静态信息的透明化。整个项目过程中的决策和规划依赖于易于获取的数据。例如，在规划建设物流（如为作业租赁合适的起重机）时，能够定义由许多组件制成的单元重量至关重要。


    我感兴趣的事情之一是 Kraken 在记录账可靠主入口（prime entry）方面的经验。区块链给了我们对交易的信任，但它并不是绝对真理库。用户如何确保里程碑记录得准确？根据
    Cornwell 的说法，让交易对所有人可见的操作使得人们对录入本身更加严谨。这令人欣慰地反映了数字资产交易公开公告的原始概念，正如大卫（Wei Dai）在
    1998 年概述并在 Satoshi 在 2008 年比特币白皮书中采用的：可见性是信任的仲裁。此外，Kraken 的客户观察到，由于产生了不可篡改的记录，实际的审批过程变得更加严格。工程世界天生规避风险，特别是在处理石油、天然气和核能等危害时。随着责任变得越来越沉重（例如在伦敦
    2017 年格伦菲尔塔灾难的 Hackitt 报告发布后），知晓可能需要在调查中对决策负责的方会非常谨慎地确保办事正确。


    Hackitt 报告要求默认数字化的产品规格和组件的持久身份，这是 AECO 供应链的最终目标，相关建议已于 2019 年 6 月进入公众咨询，如果通过，持久身份和可追溯性将成为英国法律。全设备可追溯性不仅对安全具有深远影响，还能使决策从“初始资本支出最低”转向“资产生命周期内总支出最低”。这种对资本资产生命周期的整体方法可能在未来的某，但基石已经就绪。


    ## 大规模企业区块链


