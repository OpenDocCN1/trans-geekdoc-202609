    to build in blockchain features which will enhance their application. The goal
    is to make it so that players don’t realize they are playing a blockchain game.
    This frictionless adoption is something that every industry should strive to achieve.


    [CHAPTER 6](#contents.xhtml#c6)


    [Government, Governance, Data, and You](#contents.xhtml#c6)


    Where is your data, exactly? Do you know how it has been folded, sorted, sold,
    and abused since you signed up for that useful free internet tool? How much of
    your private life has slipped into the public domain through innocent games and
    chat online? They say that McDonalds may not have the best burgers in the world,
    but their real estate portfolio is second to none. The business of the company
    you subscribe to is not based on providing you with a free service, but on selling
    your details directly or indirectly to a hungry market. If the product is free,
    then you are the product.'
