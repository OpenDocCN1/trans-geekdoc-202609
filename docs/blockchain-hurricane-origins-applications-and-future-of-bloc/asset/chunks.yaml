    Mutual, and Wachovia filed for bankruptcy. Iceland’s three largest commercial
    banks collapsed, taking the savings of offshore customers with them. The economics
    editor of the Guardian newspaper, Larry Elliott, said with hindsight:^([9](#08_Reference.xhtml#c2.9))
    “As far as the financial markets are concerned, August 9, 2007 has all the resonance
    of August 4, 1914. It marks the cut-off point between ‘an Edwardian summer’ of
    prosperity and tranquility and the trench warfare of the credit crunch—the failed
    banks, the petrified markets, the property markets blown to pieces by a shortage
    of credit.” The collapse exposed the high levels of risk in the practices of centralized
    institutions and our misplaced trust in the banks which played fast and loose
    with our cash without any transparency. This turbulence provided the perfect conditions
    for realization of a part of the Cypherpunk vision: circumventing financial institutions
    when transferring money. As governments worldwide scrambled to plug financial
    holes, on October 31, 2008 a paper was published under the pseudonym Satoshi Nakamoto.
    It was entitled “Bitcoin: A Peer-to-Peer Electronic Cash System.”^([10](#08_Reference.xhtml#c2.10))


    An Elegant Solution'
