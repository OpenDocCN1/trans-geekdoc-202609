- fmt: '

    The different layers of legislature in the United States and the tradition of
    codification, which accompanies a written constitution, have historically contributed
    to a patchwork of laws at state and federal level that can conflict with each
    other. The nascent legislation around blockchain and cryptocurrency is no different.
    Leading the field is the state of `Wyoming`, whose legislature had passed 13 new
    laws by early 2019 supporting and framing a welcoming environment for blockchain
    and cryptocurrency innovation. As Wall Street veteran and Wyoming Blockchain Task
    Force member `Caitlin Long` explains, this “[enables] innovation and creativity
    … to bring capital, jobs and revenue into Wyoming.” Covering key aspects of digital
    asset ownership, custodianship to bring crypto businesses in line with federal
    legislation, and support for fintech innovators, the `Wyoming` laws are gradually
    being adopted by other states. They have paid attention to the U.S. tendency to
    class tokens as securities rather than utilities and modeled their legislation
    accordingly to deal with native blockchain securities in line with the treatment
    of any traditional security.


    In April 2019, the `SEC` issued its `Framework for “Investment Contract” Analysis
    of Digital Assets`. Intended as “an analytical tool to help market participants
    assess whether the federal securities laws apply to the offer, sale, or resale
    of a particular digital asset,” the statement, signed by `Bill Hinman` and `Valerie
    Szczepanik`, senior advisor for Digital Assets and Innovation, clarified that
    the majority of digital asset sales are likely to be treated as securities. Hard
    on the heels of this guidance, the `SEC` sent its first `No Action Letter` to
    new venture `Turnkey Jet` for issuance of utility tokens. There were strings like
    steel hawsers attached to `Turnkey Jet`’s token sale, including requirements that
    the funds could not be used to develop any part of the software platform, and
    that the token must have immediate usefulness within the application. Reaction
    to the `SEC Framework` and `No Action Letter` was mixed, and many observers were
    disappointed in what is seen as a continued overly restrictive stance. `Joshua
    Ashley Klayman`, U.S. Head of FinTech and Head of Blockchain and Digital Assets
    at `Linklaters LLP`, was philosophical. Speaking to `Modern Consensus` when the
    `Framework` was released, she said:


    > The `SEC` has been saying for a long time that nearly every sale of digital
    assets is going to be the sale of a security. Why people keep expecting a different
    answer from them, I don’t know. I think if we want a different result, we need
    to look to lawmakers.


    The lawmakers were ready. Before the ink had dried on the `SEC`’s `Token Guidance`,
    U.S. federal legislators introduced two bills supporting the blockchain industry:
    The `Token Taxonomy Act of 2019` and the `Digital Taxonomy Act`. Writing in `Forbes`,
    `Klayman` reflects “how remarkable and powerful it is to have broad bi-partisan
    support for non-security token sales.” As in `Wyoming` the primary driver for
    these bills seems to be concern over a lack of regulatory clarity, which Congress
    believes has stifled innovation and sent businesses overseas to more welcoming
    jurisdiction. The bills have been drafted with feedback from the blockchain industry,
    but there are still concerns, including from `Wyoming` itself where `Caitlin Long`
    notes that there are conflicts between the `Token Taxonomy Act` and some of the
    legislation that has already been enacted over several states. U.S. efforts continue
    to codify blockchain and cryptocurrency legislation consistently at state and
    federal level in a way that eliminates ambiguity, but satisfying all parties is
    going to be a challenge.


    ## United Kingdom


    The Financial Conduct Authority (`FCA`) in the United Kingdom has a simpler task
    because it is working within a very different legal framework. UK law is not excessively
    codified. It relies upon principles and precedent, and there is no desire to overcomplicate
    blockchain and cryptocurrency regulation. The `FCA`’s guidance categorizes cryptoassets
    according to their structure and their designed use. Exchange tokens, in other
    cryptocurrencies that are essential to the operation of a decentralized platform
    such as `Ether`, `Bitcoin`, `IOTA`, and `XRP`, are outside the scope of `FCA`
    regulation, as are utility tokens, which provide access to a product or service
    on a decentralized platform. Security tokens are identified as such if they share
    characteristics with real-world securities, such as rights conferred on the holder
    or expectation of a return, and are regulated. The actual use of the funds raised
    has no bearing on the designation of the token: rollercoaster tickets are utilities,
    regardless of whether or not the cash raised from their sale pays for construction
    work.


    This flexibility and the reliance by regulators on principles and characteristics
    rather than strict rules give the UK a uniquely balanced set of guidelines for
    the emerging blockchain and cryptocurrency landscape, according to `Martin Bartlam`,
    International Group Head of Finance and Projects and FinTech Global Group Chair
    at `DLA Piper`. He is bemused by the enthusiasm of some startups to hop jurisdictions,
    setting up their business in `Gibraltar`, `Switzerland`, `Malta`, or `Singapore`
    to access different frameworks that they see as more suited to their needs despite
    their customer base being elsewhere. It is a sad indictment of the `Magic Internet
    Money` mindset that the priority is sometimes not solving a problem for the customer
    but avoiding problems for the entrepreneur. For most, though, the UK’s approach
    to regulation is supportive of genuine innovation and viable business models and
    has its feet firmly in the real world.


    `Bartlam` also observed that the volume of `ICOs` coming through the firm dropped
    off markedly even before the crypto bubble hit its peak at the end of 2017. As
    a result of market volatility, there is a trend now for the more viable businesses
    seeking `ICO` funds to offer stablecoin tokens for sale, which are tethered to
    real-world reserves of fiat currency or gold. This is a complicated process but
    is perceived as a better course of action than exposure to fluctuations in crypto
    valuations.


    The `Bank of England` has also made changes that will have positive implications
    for cryptocurrency. Governor `Mark Carney` announced in June 2019 that nonbanks
    can hold an account with them, which initially impacts payment companies such
    as `Worldpay`, and was cautiously welcoming of the “systematically important”
    `Libra` whitepaper, which had been published a few days earlier. Launching accounts
    for nonbanks opens the door for stablecoins to store supporting reserves with
    the `Bank of England`, a positive signal for the integration of cryptocurrencies
    with mainstream finance. `Carney` has indicated more than once that he is supportive
    of cryptocurrencies in general. Speaking at a meeting of central bankers in `Wyoming`
    in August 2019, he suggested that a global digital currency could become the world’s
    reserve, releasing `U.S.` dollar funds from the role and insulating world economies
    from volatility in the United States.


    ## France


    Speaking at the `Blockchain Game Summit` in `Lyon`, France, in September 2019,
    lawyer `Jean-Baptiste Soufron`, former senior advisor on digital economy to the
    French Minister of Innovation, outlined the French approach to `ICOs`. A token
    sale to fund the development of a new platform, he explained, can be compared
    to buying a calf for a farmer’s herd. The animal is essential to the business
    model and is viewed as a utility from the outset. It may take time to mature sufficiently
    to produce milk, and it may accrue value, but neither of these features should
    disqualify its consideration as a utility rather than a security.

