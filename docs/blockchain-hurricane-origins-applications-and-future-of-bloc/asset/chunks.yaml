    仅仅十多年后，2000 年 3 月见证了“互联网泡沫”的破灭，早期投机性的互联网发展随之沉寂。即使在当时，我们也无法想象会有 `Twitter` 及其社交媒体同类产品，更无法想象我们最终依赖互联网通过视频、音频和社区论坛向我们传递信息。多年来，一些科幻作家曾接近这一点，包括大卫·布林（David
    Brin）在他 1990 年的小说`Earth,^(3)`中，书中描述了动态的全球信息网络、公民监控以及与可穿戴技术的无线连接等内容。我们最初使用互联网是为了简化与熟人之间的双向通信，并阅读复制印刷文字的宣传册网站。我们习惯于做的事情在在线上可以更快地完成，并且可以节省成本。创新起初是一个线性过程，随后跨越了鸿沟，实现了无法想象的功能。


    `Blockchain` 现在正处于类似的境地。在 `Bitcoin` 诞生年后，加密货币的首个繁荣与衰退周期反映了互联网的历程。随着早期闲散资金的枯竭，投机性应用几乎从版图中消失，为具有长期潜力的严肃业务模型扫清了道路。尽管在准入和采用方面仍然存在障碍，但随着机构（特别是加密货币交易所和区块链游戏开发者）为了简化上手流程而进行创新，并开发具有无缝用户体验的应用，这些障碍正在迅速消除。我相信，该领域的主要玩家尚未出现。就像互联网的先驱或第一条铁路背后的工程师一样，我们根本无法预见等待着我们的某些和社会行为变化。


    ## 区块链之旅


    我们的旅程始于 2009 年首个去中心化数字货币的发布，这是研究人员多年来一直在努力的目标。支撑 `Bitcoin` 区块链的加密技术和链式结构是站在巨巨人肩膀上的创新，但最终在
    `Satoshi Nakamoto` 白皮书中发表的突破提供了一种全新的工作方式。`Bitcoin` 首次演示了账本的创建和维护，且在不涉及中央处理机构的情况下，即可对交易进行处理和记录。它建立了一个系统，每个人都有一份账本副本，每个人认可交易已准确记录，并且没有人可以更改记录。


    这种具有复杂的共识机制和精心构建的智能合约的去中心化、透明、无需信任且不可变的技术将带我们走向何方？自从开发者在去中心化货币之外迈出尝试性一步以来，`Blockchain`产生了等量的支持者和反对者。在匿名用户
    `Satoshi Nakamoto` 于 2008 年发表原始 `Bitcoin` 白皮书到 `Vitalik Buterin` 团队于 2015 年发布
    `Ethereum Virtual Machine`之间，区块链基本上是加密货币传教士和开发者的领地。2017 年情况发生了变化，加密货币价格开始上涨，主流媒体也关注这一故事。随后的牛市和熊市因其快速致富的潜力和纸面损失的痛苦而受到关注。`Blockchain`
    和加密货币已进入公众意识，但认知差异巨大。


    在某些评论者眼中，它是当没有其他方法解决复杂的政治和商业挑战时的救星银弹。其他人则没那么确信。2018 年 10 月，英美政治家暴露了极化光谱的两端。在英国保守党会议上，时任财政大臣菲利普·汉蒙德（Philip
    Hammond）被问及关于……


    汉蒙德对快速解决方案的希望正值区块链更多是关于概念的尚未实现的潜力时期。由于紧迫的政治期限迫在眉睫，他的声明更像是绝望而非务实，根据 BBC 罗里·塞兰-琼斯（Rory
    Cellan-Jones）的说法，这并没有反映白厅走廊内更务实的意见。`Blockchain` 正在帮助全球货物运输，但短期内并非如此，也不是孤立。


    当然，事实位于两者之间。`Roubini` 对加密货币以及早期采用热潮特征的糟糕行为表示蔑视,,,,44.................的过度……。^(5)，在那里它邀请你想象：


    那 25 亿没有银行账户的人将纳入全球金融体系；外国工人在跨国向家汇款时，每年将不再损失 500 亿美元；人们在购买产品时将了解该产品的生命故事；创造产品的人、涉及的地点、使用的材料等；人们在生活时将不必担心自己的土地可能被拿着枪上门的人占据；艺术家将获得对其版权作品的自主权，并与粉丝建立直接联系；患者将拥有对自己的个人医疗记录的控制权；外国援助将到达预期的受益者手中，而不会损失总额的
    30%。


