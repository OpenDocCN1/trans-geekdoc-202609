    鉴于报道的采用率，使用比特币并不像我们想象的那么简单。可靠基础设施的缺乏导致了经常停电，或者更准确地说，电力供应在一个城镇和另一个城镇之间随机中断。互联网访问断断续续或不存在。比特币挖掘曾得益于国家石油收入资助的几乎免费的电力而非常获利，但现在是非法的。任何发现的设备都会被没收，但这仅仅是将矿机转移到了政府的控制之下。尽管如此，比特币依然蓬勃发展。2018
    年 11 月，通过短信使用比特币支付日常商品开始在杂货店、餐厅、咖啡馆甚至买衣服时变得普遍。对于这样一个国家来说，这是一个巨大的文化转变，因为此前那里很少有人知道加密货币，而且只有一小部分人口可以使用互联网。对政治和经济局势的回应是全面采纳“人民的货币”。


    那么“政府的货币”呢？佩罗（Petro）正日益被强加给一个在技术上无法应对的人群。养老金以佩罗支付，一段在网络上广泛流传的视频显示，一名税务收员要求企业主用佩罗支付税款^(17)。那个年轻人无法照从，解释说所有的客户都用玻利瓦尔付钱，并因其抗议被关押。许多委内瑞拉的专业人士离开了国家，包括我的开发者同事和她的丈夫（一名医生）。对于那些离开的人，至少可以通过比特币将资金转出境外。在哥伦比亚边境（步行即可轻松到达），那里设有比特币
    ATM 机，准备供新抵达者提取他们的储蓄。独立报告还表明，哥伦日益增长的 Athena 比特币 ATM 网络的主要用户是将其现金汇回的委内瑞拉人^(18)。


    任何新技术有效的采用方式都是由需求驱动的，而真正的加密货币从“加密无政府主义”理念中脱颖而出，完美适合满足委内瑞拉公民以及世界上其他处于类似境地的人的需求。那么，在一个对“人民的货币”没有明显需求的社会中，激励措施又何在呢？


    ## 以用户为先


    ### 无缝的用户体验

    通过熟悉的事物引入用户要容易得多。由于拥有资产托管权的中心化结构，人们可能根本没有意识到自己在使用加密货币。区块链和加密货币创新者 Adryenn Ashley
    通过近期历史勾勒了技术的采用模式。VHS 与 Betamax 视频格式之争是一场由健壮性较差但更熟悉的 VHS 赢得的战斗：毕竟，对于理性的消费者来说，这只是一个大磁带。CD
    盘在音频领域成为主流，尽管激光光片在技术上更优越，但它为 DVD 作为一种新的视频媒介的出现铺平了道路。Ashley 说，加密货币的采用依赖于这种对熟悉感的追求。如果语言太陌生，或者访问方式太复杂，那么主流消费者就没有路径可循。


    ### 通过游戏进行采用

    游戏是加密货币可以在不破坏用户体验的情况下增加新功能的领域之一。多达 2.5 亿《堡垒之夜》玩家使用游戏中的 `VBucks` 支付游戏费用，而《魔兽世界》的
    `WoW Gold` 和平台外资产交易已非常成熟。通过游戏引入新的加密货币用户让用户获得了拥有自己的硬币和资产的机会，但为什么用户的体验应该被破坏呢？游戏行业资
    veteran Alex Amsel 与我讨论了这一挑战。他也看到了在不损害游戏社区已习惯的现有功能的情况下，引入加密货币益处的巨大挑战。稳定币提供了消除波动的途径，但没有理由游戏不以法币定价，而且这正日益成为人们采取的路线。


    ## 通过知情选择进行采用


    ### 加密货币主义

    加密货币主义主义者主倡一种未来，人们有意识地选择对自己的资产拥有绝对的去中心化控制，遵循密码客和加密无政府主义愿景的足迹。这可能包括那些没有银行服务的账户或不愿将信任交给政府的用户，但积极采纳加密货币意味着对加密格局和语言具有一定程度知识和理解。扩展这种方式需要用户教育，并投入大量工作来改善公众对加密货币的认知。在加密货币被直接采纳的情况下（例如在委内瑞拉公民群体中），这是由需求驱动的，但仍需要理解。教育是赋予用户使用加密货币选择的重要部分。理解控制加密资产的优缺点可以提高安全、可靠的使用，并有助于在加密货币满足需求时促进适当的采用。


    ### 教育亚洲

    在监管、审查和反加密货币宣传的面前，与潜在用户群的直接互动以及积极的教育和引导正逐渐推动亚洲的采用。`Liquid.com` 的营销与增长负责人 Emily
    Rose Dallara 曾在整个亚洲工作，现常驻越南西贡。她观察到，东京和曼谷可能是采用方面最先进的，Roger Ver、Akane Yokoo 和他们的团队已鼓励大量小微企业在线和线下接受比特币现金（`BCH`）。现在，在东京中心区域的六木座和涩谷的咖啡馆和餐厅进行微额购买已成为可能，而在线商户接受
    `BCH` 也变得变得越来越简单。


    Dallara 在越南交易者中看到的这种采用现象，更有可能是由加密货币持有者鼓励他人使用以便他们花钱所驱动的。接受加密货币也可能给商人带来问题，因为在越南用越南盾（`VND`）以外的任何货币要求付款或列出价格都是非法的，而且全亚洲有这么多电子货币应用，加密货币只是另一种支付选择。然而，加密货币在某领域满足了需求，尽管这种需求可能不会受到当局的青睐。越南与许多其他更集权的共产主义国家一样，不鼓励向外转移
    `VND`。Dallara 的经验是，在当地交易所将 `VND` 转换为 `BCH` 更容易、更便宜，并使用加密货币管理跨境汇款。在西贡，人们也关注 `DAI`
    稳定币，人们开始在线接受加密货币并转换为 `DAI` 或 `USD`。这种渐进的采用在亚洲共产主义国家的政治背景下如何发展将有趣的。


    ## 为没有银行服务的人提供服务

    西方有时忽视的一个文化方面是，在亚洲没有银行账户既不寻常也不不利。我们的经济预期人们能够获得传统银行服务，并排除了那些没有的人，例如，为可以通过银行直接扣款的人提供更具竞争力的公用事业定价。我们在西方文化中可能预期从没有银行服务的人身上获得的优势并不会推动亚洲的采用。

