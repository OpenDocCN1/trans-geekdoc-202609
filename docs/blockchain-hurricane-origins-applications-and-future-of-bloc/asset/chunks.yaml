- fmt: '

    The gas price, in other words the amount of ETH payable per unit of gas, varies
    according to the volume of transactions being processed. It is expressed in small
    denominations of ETH known as Gwei (`10^(\-9)` ETH). A typical price per unit
    of gas might be 20 Gwei, or `0.00000002` ETH. When Cryptokitties mania was at
    its height, the gas price was correspondingly high. At the time, using `Metamask`,
    the most well-known user interface that allows players to access Cryptokitties
    and other games, required knowledge of the gas rules. Users were asked what price
    they would pay for gas, and a range of appropriate values suggested. This was
    both a barrier to adoption and a learning opportunity, but more recent versions
    of `Metamask` and newer wallet interfaces such as `Dapper` have reduced the complexity
    for users by automating gas price selection or, in the case of `Dapper`, absorbing
    the costs entirely.


    The rules of demand and supply meant that in an oversaturated network only those
    users bidding high for gas had their transactions successfully validated, but
    crucially, costs are incurred whether or not a transaction succeeds, because processing
    takes place regardless. Some of my own attempts to breed Cryptokitties at too
    low a gas price cost me a fraction of an ETH with nothing to show for it. That’s
    a trivial loss, but something you don’t want your users or your investors to experience.


    ## The Cost of Getting Things Wrong


    The most notorious transaction fee disaster to date occurred when an overeager
    investor fell afoul of a smart contract error during the ICO for `AirSwap` in
    October 2017. Attempting to buy `1,700` ETH worth of tokens, the investor set
    the transaction gas price ridiculously high at `400,000` Gwei (`0.0004` ETH) per
    unit of gas, possibly to ensure that their transaction had top priority for validation.
    Unfortunately, the smart contract had been set up with a gap in the sale window.
    The transaction arrived on the network at a time when the contract was unable
    to transfer tokens to the buyer and the resulting error automatically invalidated
    the attempted purchase. The investment ETH was not transferred, but just short
    of `237` ETH in transaction fees were charged, the equivalent of over `$70,000`
    at the time. At normal gas prices, the `592,379` units of gas should have cost
    the transferor around `$3.50`.


    This cautionary tale should prompt developers to get things right at launch, but
    smart contract development issues prevail. These are not only a concern in structuring
    contracts correctly, but also ensuring that they are secure in the face of cyber
    threats. Hartej Sawhney, cofounder of blockchain and smart contract security specialists
    `Hosho Group`, gave me a clear picture of the current state of play.


    “The quality of smart contracts being written in the industry is slowly but surely
    improving,” he said. In 2017 and 2018, it was not uncommon to discover critical
    vulnerabilities such as “infinite token generation” inside smart contracts. Companies
    were proudly copying and pasting large chunks of other companies’ smart contracts
    and praying that the code would compile and do what functions they intended.


    There has been a lack of incentive for talented individuals in `InfoSec` to learn
    blockchain languages such as `Solidity` and to provide security services in the
    space. Standard practices for security such as those found in the United States
    financial industry could do much good to the Blockchain industry. Most companies
    lack the sophistication to ensure security is given priority [and] that regular
    penetration testing and auditing is conducted.


    This is a real concern, and also an opportunity for companies like `Hosho`. Developers
    have an ethical responsibility to collaborate and support each other to deploy
    effective and secure smart contracts throughout blockchain applications, and business
    leaders must be aware of the standards that must be upheld to protect users and
    the business itself.


    ## Hacks, Forks, and Infighting


    Cryptocurrency has not been without controversy. The original Bitcoin blockchain’s
    code, released under an open source license for the use of all, has spawned clones
    and competitors over the years. While imitation may be the sincerest form of flattery,
    some of the new currencies have a murkier history rooted in errors, attacks, and
    bitter differences of opinion. It is normal for changes to be made to public blockchain
    code. The open source community takes responsibility for maintaining and updating
    chains, improving security, speed, and capacity as demand for transaction recording
    grows and relevant technology improves. When a change is agreed by community consensus,
    this results in a fork of the blockchain in question, pausing activity and implementing
    new code before moving forward, hopefully more efficient but to all intents and
    purposes unchanged. If the new code is backward compatible with the existing code,
    this results in a soft fork. In cases where the new code is disruptive, we have
    a hard fork.


    ### Changing Direction: Bitcoin Cash


    In 2017, Bitcoin developers spent considerable time addressing the shortcomings
    of the original protocol that had been exposed through almost a decade of advancing
    technology. As the chain grew longer the throughput of transactions recorded in
    each `1 Mb` block slowed, causing frustration and increasing costs. There were
    several solutions proposed by the community with the aims of reducing the data
    recorded and or increasing the size of the block. One proposal known as `SegWit`
    changed the order of processing for block confirmation, segregating elements of
    a transaction to reduce the volume of recorded data and thereby speed up processing.
    A second phase of Segregated Witness (`SegWit2x`) aimed to increase the block
    size from `1 Mb` to `8 Mb`. In the end, the Bitcoin blockchain only adopted the
    first phase of `SegWit` through a soft fork. Most of the community backed down
    from making a hard fork of larger block sizes, but a minority of objectors decided
    to go ahead and create a new fork of the Bitcoin blockchain, called `Bitcoin Cash`.
    This came into being on August 1, `2017`. Other forks to create different currencies
    with different mining structures, notably `Bitcoin Gold` and `Bitcoin Diamond`,
    also occurred in `2017`.


    The Bitcoin Cash story does not stop here. The new currency gained traction, while
    the core Bitcoin blockchain continued on its way with `1 Mb` blocks. `Bitcoin
    Cash` was widely promoted as the cryptocurrency that Bitcoin should be, and a
    roadmap for its development was laid out. However, a year later the two key developers
    involved in Bitcoin Cash, `Roger Ver` and `Craig Wright`, disagreed over the direction
    that the currency was taking. A planned soft fork of Bitcoin Cash took place in
    November `2018`, moving the roadmap forward under the leadership of `Ver`. `Wright`
    and his team took a different path and hard forked to create a new chain, which
    they claim reinstated the original Bitcoin protocols from `2009`, known as `Bitcoin
    Cash: Satoshi’s Vision`.


    Confused? This is normal. The philosophical differences that arise between Bitcoin
    developers in a quest to achieve the perfect peer-to-peer system of electronic
    cash may haunt us for years to come.


    ## Computer Says Yes: The DAO

