    Scandals over data breaches, misuse of our personal information, and increasingly
    complex regulation have brought the topic into sharp focus for individuals, corporations,
    regulators, and governments. The safe management of data concerns everyone, and
    as blockchain technology gains traction there are opportunities and threats to
    address on all sides. The opportunities lie broadly in the arena of authentication
    without knowledge, transparency for multiple unrelated parties, and process efficiency.
    It offers individuals a way to decentralize their data and to take ownership of
    their personal information and is also a useful tool for security by design in
    centralized organizations. The corresponding threats appear in the shifting sands
    of regulation and a need for developers themselves to be extremely diligent in
    deploying accurate code and building up intellectual property. Blockchain (as
    distinct from cryptocurrencies and tokens, whose regulatory environment was discussed
    in [Chapter 3](#03_Chapter_3.xhtml)) requires careful consideration in the context
    of regulation. There are significant challenges for developers and innovators
    who must navigate the minefield of differing privacy laws across multiple states
    and simultaneously manage the protection of their own commercial interests and
    intellectual property.


    This chapter addresses the journey toward owning our data, the implementation
    of blockchain in areas of government, and legal considerations for any organization
    adopting distributed ledger technology.


    ## Value Your Data


    We have become accustomed to having information about our personal lives stored
    digitally and often publicly. Zip code finders, telephone directories, and electoral
    rolls were among the first public repositories of data on the internet. These
    held much the same information that we once could have retrieved on microfiche
    and paper from our local libraries but made it available to a vast new audience
    whose motives for its use may not have been straightforward. As privacy awareness
    grew, these lists were hidden from public view. Social media gathered pace in
    the early 2000s and we began to share our data voluntarily, posting everything
    from baby scans to holiday plans for our friends and family to see. The rise of
    online services and connected devices through the IoT has triggered a third wave
    of unconscious data sharing. As Avast security ambassador and former world chess
    champion Garry Kasparov says, “The Soviets had spy devices: now we just pay Amazon
    to deliver our data.”


    ## Privacy Versus Surveillance


    We are living in a world where our personal privacy is traded off against the
    utility we derive from services. We are advised to make conscious decisions on
    data sharing, but sometimes the choice of whether or not to share data is academic
    if we want to access essential services. To complicate matters, every individual
    has a different level of tolerance across four different elements of privacy as
    defined by Alan Westin in his 1967 book `Privacy and Freedom`: solitude, anonymity,
    reserve, and intimacy`. These behaviors are easy to see on social media, where
    some users share every detail of their lives, uncaring or unknowing of the risks
    they run in doing so. Others are more reserved, sharing cautiously, and still
    more crave absolute anonymity, hiding behind pseudonyms and choosing their platforms
    according to the level of detail that is required to participate. There is also
    a historical and well-documented conflict between privacy and surveillance. The
    fallout from Edward Snowden’s 2013 whistleblowing over NSA surveillance programs
    and the `PRISM` and `Upstream` initiatives were far-reaching, damaging trans-Atlantic
    relations over privacy and throwing the activity of the security services into
    the spotlight. On the other hand, the United Kingdom’s `GCHQ` reportedly blocked
    around 2,000 malicious domains a week in 2018^([1](#08_Reference.xhtml#c6.1))
    and its surveillance of internet activity has helped to reduce terrorist threats
    and the activities of offender communities. We cannot have it both ways. As a
    society, we have a duty to protect the vulnerable, at the cost of absolute privacy.


    Why has this become such a complex issue? In 1999 David Brin addressed the growing
    problem and proposed a solution in his book `The Transparent Society`,^([2](#08_Reference.xhtml#c6.2))
    which resonates with the subsequent development of distributed ledgers. He explains
    that prior to our collective submersion in all things digital, transactions relied
    upon personal trust and community transparency. You knew who the reliable characters
    were in your village, town, or market sector and adjusted your personal privacy
    settings accordingly. Equally, bad actors were controlled by the knowledge that
    dishonesty had a cost in terms of reputation and privilege in a small community.
    As the scope of transactions widened to include unknown participants in regional
    and national communities and across borders, secrecy in the form of encryption
    replaced the natural order of trust. However, our blind reliance on encryption
    being used effectively by a centralized data collector is dangerous. It is becoming
    increasingly easy to crack the layers of security around our data thanks to inventive
    hacking, social engineering, and phishing, and there are too many instances where
    human error or downright carelessness has resulted in data being collected and
    stored without appropriate encryption being applied—or, more worryingly, any encryption
    at all. Data theft is a growing problem as the information held on us becomes
    more valuable than the costs of stealing it, despite considerable efforts on the
    part of lawmakers to curb the wilder excesses of unnecessary data capture and
    commercialization of our personal information. As the volume of stored data grows,
    we must look to other solutions for protection. What Bitcoin, blockchain, and
    discussions of security and regulation have brought to the fore is a reimagining
    of transparency and trust online.


    ## Digital Identity


    According to many observers, the holy grail of technology is digital identity.
    The `ID2020` Alliance further states that this should adhere to the core principles
    of portability, persistence, privacy, and user control. Work toward developing
    a reliable digital identity has been going on since long before the advent of
    blockchain, but the distributed ledger has added a decentralized authentication
    layer to the mix. The Estonian government was the first to use cryptography and
    distributed records to protect the details of all their citizens. In 2003 cryptographers
    Ahto Buldas and Märt Saarepera developed a formal security proof for digital identity^([3](#08_Reference.xhtml#c6.3))
    and along with Mike Gault and Joichi Ito formed the `Guardtime` company when work
    on the `e-Estonia` program began in earnest around 2007. The goal of the researchers
    was to remove the need for a trusted third party in the management of identity,
    and they fell upon the same system of cryptographic verification via digital signature,
    hashing, and timestamping that also featured in Satoshi Nakamoto’s Bitcoin whitepaper.
    The similarity of approach and the apparently coincidental timing of Buldas, Saarepera,
    and Gault’s work has led to speculation that this group of developers could be
    candidates for the real identities behind the pseudonymous Satoshi, but they have
    not invited attention and Gault has denied any involvement when questioned. Guardtime
    has grown to be a multinational leader in blockchain innovation and was also involved
    in the `Insurwave` development discussed in [Chapter 4](#04_Chapter_4.xhtml).
    From digital identity, the Estonian government and Guardtime have moved on to
    the digital management of health care, residency, taxes, voting, and governance,
    incorporating blockchain technology where appropriate.

