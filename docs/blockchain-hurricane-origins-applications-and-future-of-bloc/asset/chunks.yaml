    # Will quantum computing wreck the cryptography that underpins blockchain?


    At almost every forum where people are learning about this technology the question
    is posed in one form or another. The short answer is that quantum computing is
    more likely to strengthen encryption than to break it, and as innovator, entrepreneur,
    2018 Eisenhower Fellow and former Managing Director of Goldman Sachs William Hurley,
    known to all as `Whurley`, says: be inspired, not afraid.


    This is not to say that the journey ahead will be plain sailing. While the structure
    and immutability of a blockchain secured by `Proof of Work` is very unlikely to
    be compromised, there are concerns over the security of the data which is held
    in a hashed form on-chain. Quantum computers in their current state are programmed
    by physicists, exist in a supercooled `+0.5 Kelvin` environment, and perform specific
    and extraordinarily complex functions that require `Qubits` of processing power,
    not bits. The `256-bit` encryption that forms the backbone of all current mainstream
    cryptography, including that which underpins blockchain and cryptocurrency, would
    be a plaything for a quantum computer to crack.


    It is extremely unlikely that quantum computing will be let loose on breaking
    encryption in the manner of a battle tank against spears. Quantum computing will
    enable stronger encryption, and blockchain, cryptocurrency, and all other users
    of cryptography will adopt it. A simple parallel is to look at how our use of
    passwords has changed over time. It’s easy to crack a 1990s password. They were
    short words, perhaps a number, probably based on the name of your first pet. We
    now understand that long strings of unrelated words are the most secure option,
    and we have moved with the times.


    Continuing this analogy demonstrates the area of greatest concern around the effect
    of quantum computing. The structure of a blockchain is secure as long as the encryption
    used keeps up with the evolution of computing power. Research into the potential
    impact of quantum computing recognizes that some of the `ASIC` (algorithm-specific)
    mining processors in use today come very close to the speed of existing quantum
    computers. A `2017` paper from `Aggarwal et al.^([8](#08_Reference.xhtml#c7.8))`
    concludes that quantum computers would gain no advantage even as they develop.
    The strength of a consensus mechanism like `Proof of Work` is that it would take
    more computing power than is available to change an earlier block and recalculate
    the algorithm for each subsequent block faster than new blocks are added. Gradual
    increases in hash power will not affect the integrity of the chain. The real danger
    is that first, the data that was encrypted in earlier blocks could be deciphered,
    and second, that quantum processing may be able to compromise the encryption around
    signatures, deciphering a private key quickly enough to amend or thwart an ongoing
    transaction.


    Developers and enterprises must plan for securing legacy data and minimizing the
    amount of information that is held on-chain, but this is in line with activity
    that should already be ongoing for management of archiving and efficient use of
    a blockchain. There are several initiatives working on more robust blockchain
    frameworks such as the `Quantum Resistant Ledger (QRL)`` open source community.
    Technology developed through this route addresses more secure signature systems
    designed to stand up to future quantum capabilities. Ultimately quantum computing
    will not break blockchain, but it will cause it to evolve and improve.


    ## Tantalizing Opportunities


    There are several potential applications of blockchain that seem at first sight
    to be straightforward, a good fit for the technology, but which either have hidden
    complexities or are ideas whose time is yet to come. The financial sector is particularly
    rich in unrealized potential around improvements to the audit function.


    ## Audit and Accountancy


    Accounting at its very heart is the recording of transactions with double entry,
    so blockchain is a very relevant technology. It mirrors the audit trail of accounting,
    making it familiar territory for anyone in the profession. Here is a technology
    which, if properly implemented, has the potential to improve the authenticity
    and reliability of records.


    Although `Northern Trust` have been working successfully with auditors `PwC` and
    `KPMG` in respect of private equity transactions, the wider audit landscape is
    a much complex arena. New York-based `Auditchain` have been exploring the role
    of blockchain in preventing accounting scandals, which hit the headlines on an
    too regular basis. The `2001` bankruptcy of the `Enron` corporation and the subsequent
    collapse of its “Big Five” auditor, `Arthur Andersen`, led to the sweeping regulations
    of the `Sarbanes-Oxley Act`, yet the problems continued. The year `2018` alone
    saw the investigation of `General Electric (GE)` and its de-listing from the `Dow
    Jones` index after 122 years, the collapse of several high-profile firms in the
    United Kingdom including construction giant `Carillion`, café chain `Patisserie
    Valerie`, and retail chain `BHS`, and the dissolution of the Gupta business empire
    in South Africa. Auditors came in for severe criticism. `KPMG`, auditors of `GE`
    for over a century, had done nothing to curb what the `Securities and Exchange
    Commission (SEC)` described as GE’s “aggressive accounting” practices. In the
    UK they also came under fire from the `Financial Reporting Council (FRC)` for
    “rubber-stamping” figures which did not represent the real position of `Carillion’s`
    business and for a conflict of interest in their lucrative consulting work for
    the client. They also faced criticism in South Africa where an ex-KPMG auditor
    from the Gupta team was charged with inappropriate conduct and tax evasion. The
    `FR` reprimanded and fined `PwC` and individual staff members over the `BHS` collapse,
    and criticized `Grant Thornton` for signing off `Patisserie Valerie’s` accounts
    without discovering a glaring and fatal hole in its cash balances.


    `Auditchain` is trying to make headway in an industry where regulation is becoming
    ever tighter but may not be the right solution to the problem. Founder `Jason
    Meyers` outlined the core belief that underpins the `Auditchain` methodology,
    that system and control objective compliance is the most important part of an
    audit. If systems are functioning correctly, then the data structure is proper
    and can be relied upon back to the opening balance. If we put this in the context
    of a `blockchain`, then if the most recent few hundred blocks are sampled and
    found to be correct, the data can be trusted all the way back to the first (genesis)
    block because the system is functioning correctly. With this degree of compliance,
    the cost of fraud should become prohibitive.

