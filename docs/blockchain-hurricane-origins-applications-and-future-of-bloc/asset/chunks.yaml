    Just over a decade later, March 2000 saw the bursting of the “dot com bubble”
    and early speculative internet developments fell by the wayside. Even at that
    time we could not have imagined the likes of `Twitter` and its social media peers,
    nor our eventual reliance on the internet to deliver information to us through
    video, audio, and community forums. Some science fiction writers over the years
    came close, including David Brin in his 1990 novel `Earth,^([3](#08_Reference.xhtml#c1.3))`
    which featured a dynamic global web of information, citizen surveillance, and
    wireless connections to wearable technology, among other things. We originally
    used the internet to streamline two-way communication with people we knew and
    to read brochure websites that replicated the printed word. The things we were
    accustomed to doing could be achieved more quickly online and there were cost
    savings to be made. Innovation started out as a linear process before leaping
    the void to unimagined functionality.


    `Blockchain` is in the same position now. Ten years after the inception of `Bitcoin`,
    the first boom-and-bust cycle of cryptocurrency mirrored the dot com journey.
    Speculative applications all but disappeared from the landscape as the ready money
    of the early days dried up, leaving the way clear for serious business models
    with longer term potential. There are still barriers to access and adoption although
    these are falling rapidly as organizations, notably cryptocurrency exchanges and
    blockchain game developers, innovate for ease of onboarding and develop applications
    with a seamless user experience. The main players in the space, I believe, have
    not yet emerged. And like the pioneers of the internet or the engineers behind
    the first railways we simply cannot foresee some of the societal and behavioral
    changes that await us.


    ## The Blockchain Journey


    Our journey begins with the launch of the first decentralized digital currency
    in 2009, something that researchers had been creeping toward for many years. The
    encryption techniques and the linking chain structure which underpin the `Bitcoin`
    blockchain were innovations standing on the shoulders of giants, but the eventual
    breakthrough published in `Satoshi Nakamoto`’s white paper delivered a new way
    of working. For the first time, `Bitcoin` demonstrated the creation and maintenance
    of a ledger in which transactions could be processed and recorded without the
    involvement of a central processing agency. It established a system where everyone
    has a copy of the ledger, everyone agrees that the transactions have been recorded
    accurately, and no-one can change the records.


    Where will this decentralized, transparent, trustless, immutable technology take
    us, with its complex consensus mechanisms and carefully constructed smart contracts?
    `Blockchain` has spawned champions and detractors in equal measure since developers
    took the first tentative steps beyond decentralized currency. In the years between
    the publication of the original `Bitcoin` whitepaper by the pseudonymous `Satoshi
    Nakamoto` in 2008, and the launch by `Vitalik Buterin`’s team of the `Ethereum
    Virtual Machine` in 2015, blockchain was essentially the preserve of cryptocurrency
    evangelists and developers. In 2017 this changed as cryptocurrency prices began
    to rise and mainstream media picked up on the story. The subsequent bull and bear
    markets attracted attention for their get-rich-quick potential and the schadenfreude
    of paper losses. `Blockchain` and crypto have exploded into the public consciousness,
    but perception varies wildly.


    In the minds of some commentators, it is the silver bullet that will come to the
    rescue when there seems no other way to solve difficult political and business
    challenges. Others are less convinced. In October 2018, British and American politicians
    were exposed to both ends of a polarized spectrum. At the British Conservative
    Party conference, the then Chancellor of the Exchequer, Philip Hammond, was asked
    about the...


    ...Hammond’s hope for a fast solution came at a time when blockchain was more
    about unrealized potential of concept. With a tight political deadline looming
    his statement smacked more of desperation than practicality, and according to
    the BBC’s Rory Cellan-Jones, it did not reflect more practical opinions in the
    corridors of Whitehall. `Blockchain` is on course to help with the passage of
    goods around the world, but not in the short term, and not in isolation.


    Of course, the truth lies somewhere between the two. `Roubini`’s scorn for cryptocurrency
    and bad practice which characterized the early rush of adoption,,,,44.................
    the over... of. `^([5](#08_Reference.xhtml#c1.5


    ## Behind the Crypto Headlines


    Many people follow the stories about volatile cryptocurrency trading without any
    appreciation of the hive of activity that surrounds the technology. The rise and
    fall of cryptocurrency prices and associated scams and snake-oil salesmen make
    for lurid headlines. What often goes unreported is that this gold-rush fundraising
    with new cryptocurrencies (`altcoins`) and tokens was largely responsible for
    oiling the wheels of rapid, and largely collaborative development. A lot of good
    work has been going on under the radar to refine and expand upon `Bitcoin`’s original
    mechanism for decentralized, trustless, transparent transactions. Beneath the
    hype, there are highly respected professionals developing new ways of working,
    and a growing number of distributed ledger applications are ticking quietly away
    under the hood of regular software platforms. Multinational enterprises are putting
    the structure in place to revolutionize financial technology, supply chain management,
    utilities, and healthcare. Individual states, federal bodies, and sovereign nations
    are establishing legal frameworks for the protection of investors and the use
    of `blockchain` in asset registries, identity, and credentialing. The United Nations
    has a blockchain for social good agenda centered around its multi-UN agency platform,^([6](#08_Reference.xhtml#c1.6))
    where it invites you to imagine:


    that 2.5 billion unbanked people will be included in the global financial system;
    that foreign workers will not lose $50 billion collectively per year when sending
    money to their home across the border; that people will know about the life story
    of a product when they buy it; people who created the product, the places that
    were involved, the material used etc.; that people will live without fear that
    their land might be appropriated by someone who comes to the door with a gun in
    their hands; that artists will gain autonomy over their copyrighted material and
    build direct relationships with fans; that patients will have control over their
    personal medical records; that foreign aid will reach its intended beneficiaries
    without losing 30 percent of its entirety.

