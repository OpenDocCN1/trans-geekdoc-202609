    The innovation at Northern Trust has continued. Stevens and his team turned their
    attention to some of the administrative headaches around their private equity
    business to see whether blockchain might provide a viable solution to some of
    their specific challenges.


    ### Economic Substance Regulations


    The first of these related to the new Economic Substance regulations governing
    businesses domiciled on Guernsey. Registration in this British Crown Dependency,
    located just off the coast of France, has a number of of benefits for certain
    financial organizations. The substance regulations were introduced in January
    2019 to ensure that firms running funds on the island could prove to the local
    regulators that they were managing the funds in line with the local rules, provide
    transparency into the processes, and ensure that profits registered by businesses
    on the island reflected “economic activities and a substantial economic presence.”
    This proof of economic substance included a requirement for directors to prove
    they were physically located on the island when voting on board and statutory
    matters, as evidence that a business was being properly directed and managed within
    the jurisdiction.


    In a similar vein to Professor Mike Smith’s solution when faced with Scandinavian
    regulators querying his client’s data, Northern Trust developed a mobile voting
    app and collected GPS data from the directors’ devices, hashing and timestamping
    both the location and the vote to the satisfaction of the local regulatory rules.
    In the all too common event that a director was genuinely unable to reach the
    island to vote, due to vacation or, more likely, a fog-bound airport, then proof
    of intent such as flight reservation and cancellation records were used in place
    of GPS data, so providing the required proof in case of a fund review.


    ### Legal Agreements and Smart Contracts


    The team then turned their attention to the legal agreements governing the management
    of private equity funds. Requirements for different funds can be complex because
    options around ethical investing or personal beliefs must be taken into account.
    The legal agreements surrounding the funds must identify any exclusions to be
    applied in individual cases. For example, one set of investor documentation may
    specify that there is no investment to be made in alcohol, or armaments, or companies
    domiciled in particular countries. This must be translated to the appropriate
    legalese and enforced in the management of the fund.


    Working in partnership with tech startup Avvoka, part of an accelerator program
    within law firm Allen and Overy, Northern Trust developed the capability to deploy
    legal clauses as smart contracts directly from a digital legal agreement. The
    `Avvoka` engine holds the template of a legal agreement, which can be parsed appropriately
    for the preferences of whichever law firm is acting for the client. The exclusion
    requirements are selected by a simple drag-and-drop from the smart contract library
    and incorporated in the legal agreement in the language required by the lawyers.
    This avoids forcing standard exclusion wording into complex documentation while
    retaining the underlying consistency of the smart contract. Once approved and
    signed, the agreement is recorded on-chain and the smart contract is generated
    direct from this document. This workflow avoids the challenge of encoding the
    detail of a legal agreement by turning the process around and starting from the
    needs of the developer.


    The development of smart contracts for exclusionary purposes is ongoing: as clauses
    become more complex, automation must follow. For example, does the exclusion of
    investment into companies generating profits from alcohol apply purely to drinks
    companies, or to groups where just a small percentage of the revenue comes from
    this industry? There is also the question of making changes to smart contracts
    once they are incorporated in the blockchain, and here Northern Trust have been
    leading with field with a number of patents addressing this process. For example,
    the reappointment of auditors is an agenda point in a digital board meeting, and
    the result of the vote automatically triggers the extension or replacement of
    the appropriate smart contract and changes any permissions as required.


    By focusing on the needs of a specific niche, this work has succeeded in demonstrating
    that blockchain can be applied successfully in audit processes. We will look more
    closely at challenges in the wider world of accounting and audit in `Chapter 7`.
    Northern Trust’s work has also delivered tools that will be valuable in supply
    chain administration.


    ### Collaboration in a Trustless Economy


    Blockchain is gaining traction in business communities where there are links between
    key parties and a need to improve efficiency, transparency, and authenticity.
    It is also making an impact in fields where there is no trust relationship between
    parties at the same level of a hierarchy, but all of them have relevant inputs
    into a central point. They may be reluctant to share their information with competitors
    at the same level but must make it transparent to the party above. Blockchain
    technology has a role to play in overlaying confidential data repositories with
    a layer of encryption and enabling access for only those parties with the right
    key.


    Medical records immediately come to mind as an area where this problem persists.
    Electronic health records are traditionally stored at provider level, which results
    in fragmentation and discontinuity across different databases. This is as true
    in a private health system such as the United States, where data is held separately
    by a range of providers, as in a public system such as the UK’s National Health
    Service, where data is siloed within geographical NHS trusts. One of the earliest
    pilots addressing the complexity of patient records was launched at Beth Israel
    Deaconess Medical Centre in 2016 by MIT’s `MedRec` project team. The white paper
    proposed “a distributed access and validation system using the blockchain to replace
    centralized intermediaries.” The `MedRec` system featured several mechanisms to
    link individual registry IDs to the system (the `Registrar Contract`), to link
    patients to each provider they had used (the `Patient Provider Contract`), and
    to form a breadcrumb trail for patients (the `Summary Contract`) linking back
    to their providers and serving as a backup allowing them to access or download
    their history at any time. The 2016 proof of concept for `MedRec 1.0` was a success,
    and in order to scale the system beyond the original pilot and increase the security
    around medical records a new architecture was proposed for `MedRec 2.0`, which
    is under construction.


    ### Case Study: Gospel Tech


    The personal sensitivity of the data involved in health care means that the `MedRec`
    project is moving more slowly than some commercial applications of similar principles.
    London-based `Gospel Tech` has taken a comparable approach to solving a sensitive
    data sharing and collaboration problem for clients in the aviation industry. They
    explain the data paradox that led them to a blockchain-based solution:


    Traditional infrastructure means key data becomes centralized in silos, protected
    under more and more complex layers of security, which eventually degrade as employees
    circumvent protocols in order to collaborate. Ironically, this focus on preventing
    data from moving leaves enterprises more vulnerable to breach or loss of control
    of their data, whilst also restricting the true value of the data to the business.

