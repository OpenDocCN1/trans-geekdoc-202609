- fmt: '

    The Gospel Data Platform helps companies and their supply chains to share sensitive
    data securely and confidently without exposing too much or the wrong information.
    Under the hood is a private permissioned blockchain using a Byzantine Fault Tolerance
    consensus mechanism (`pBFT`), which manages granular, authorized access to the
    information that’s needed without compromising confidentiality. As Gospel explains,
    before their system was implemented one of their clients was managing parts traceability
    for aircraft across a wide supply chain by holding regular meetings to compare
    versions of spreadsheets. Now, all the relevant parties participate in a network
    of `Gospel` nodes with access to a single source of truth. The blockchain sits
    across a variety of supplier systems as an extension to each node’s existing infrastructure,
    allowing users to sign in seamlessly and securely using their local credentials.
    The delay in parts traceability has fallen to minutes, improving overall efficiency
    and reducing costs.


    Gospel’s platform is also being used in the field of human resources and payroll
    processing to manage complex data flows between disparate systems. Speaking to
    Computer Weekly in April 2019, the Chief Technology Officer of `NGA HR`, Stuart
    Curley, highlighted not only the simplicity and security of using the `Gospel`
    blockchain layer but also the importance of keeping immutable records of any changes
    made to the data. This theme of authentication, verification, and transparency
    runs through every successful blockchain implementation.


    ## Managing the World Around Us


    Widening the focus from the supply chain and back office functions, management
    of the infrastructure which surrounds us can also benefit from using blockchain
    and distributed ledgers. There are two areas where development is moving forwards
    rapidly: one the management of energy distribution, and the other addressing the
    full lifecycle of large capital projects.


    ### Decentralized Energy


    The supply of utilities to homes and businesses is complex and almost without
    exception centralized. This reflects the historical structure of provision of
    the resources that we consume. Energy is a case in point: for more than a century
    we have relied upon huge centralized power plants using fossil fuels, nuclear
    energy, hydroelectric dams, waste, and renewable sources. However, technology
    is advancing rapidly, and the generation of power is no longer truly centralized.
    Solar panels are appearing on rooftops across the globe. Factories are powered
    by their own forests of wind turbines. Why should the provision of electricity
    not become as decentralized as its production?


    There is a real incentive for change in the energy market. Dale Geach, technology
    and innovation manager for `Siemens Digital Grid`, told me that the market is
    under pressure to meet the energy needs of society in a sustainable, efficient,
    and resilient manner. This is the Energy Trilemma, and the solution lies in the
    transformational trends of digitalization of energy management and the move toward
    distributed systems.


    As far back as 2016, a survey conducted by the German Energy Agency revealed that
    almost three quarters of the decision makers who responded were aware of the potential
    impact of blockchain, 39 percent were planning implementations and 13 percent
    were already trialing innovations in the areas of peer-to-peer trading, charging
    of electric vehicles, and using blockchain for payment processes. In a 2019 paper
    reviewing the challenges and opportunities around blockchain in the energy sector,
    researchers from Durham and Heriot-Watt universities working with `Siemens Energy
    Management` identified several areas where blockchain could improve current processes.
    These include consumer administration in billing, identity management, and even
    smart contract-driven provider switching mechanisms; smart grids, decentralized
    networks and data transfer; and disruption of wholesale energy markets. Within
    these, microgrids and consumer-centered marketplaces appear to be the closest
    to realization at scale.


    ### Microgrids and the Rise of the Prosumer


    As domestic renewable energy generation becomes commonplace, many households are
    simultaneously consumers and producers. These “prosumers” are distinct from commercial
    producers and passive consumers and are an essential node in the new breed of
    microgrid.


    Microgrids have been in use for years: they do not by definition involve either
    renewable energy generation or decentralized administration. `Engie` describes
    a microgrid as “an energy supply network built around local power and heat generation
    facilities. It is designed to operate autonomously or in synchronization with
    a national grid within a clearly defined area.” The efficiency of a microgrid
    in remote locations has been established and tested over a long period of time,
    for example, the Hartley Bay microgrid in Canada was originally set up in 2008,
    predating both the `Satoshi` white paper and the mainstream adoption of renewables
    at a local or domestic scale.


    The aim of the Hartley Bay project was to demonstrate advance metering and demand
    response, one of the three significant developments in technology which are now
    enabling the evolution of microgrids around the world. As smart grids and smart
    metering roll out across existing the utility infrastructure, data collected on
    energy consumption becomes more granular and plentiful. This facilitates machine
    learning for prediction of consumption, aiding microgrid planning and design.
    Operationally, smart metering also enables accurate billing to be incorporated
    as an automatic function in the administration of a microgrid. The second key
    development is the increased efficiency of renewable energy technologies that
    put electricity generation within reach of homeowners, landlords, and businesses.
    Finally, the emergence of blockchain technology has provided the glue to connect
    the multiple independent participants in a microgrid network, and the transparency
    to discourage bad actors.


    While established microgrids in remote communities rely on a centralized source
    of energy, a decentralized microgrid can draw energy from many unrelated sources
    for local distribution. A distributed ledger enables a microgrid to operate as
    a decentralized network, reducing costs and the administrative burden for both
    producers and consumers, and improving transparency and accountability. A fully
    functioning, decentralized microgrid will ultimately maintain the ledgers of individual
    generators, processing micropayments for kilowatts contributed to the overall
    grid.


    As the 2050 deadline for a net zero carbon footprint is closer in capital project
    terms than we might think, the imperative for change is driving development. Energy
    innovators `LO3` are behind a number of projects including the Brooklyn Microgrid
    (`BMG`) in New York, `Enexa` transactive energy in Australia, and the Allgau community
    energy project in Germany. Their original peer-to-peer energy trial in Brooklyn
    in 2016 involved five prosumers and five consumers and processed the first ever
    live energy transaction on a blockchain between a prosumer’s smart meter wallet
    and the end consumer. The second phase scaled to include more than 300 homes and
    small businesses, and in 2019 `BMG` reached out to the wider community to launch
    its local renewable energy marketplace. The project is working to educate potential
    users in order to ensure smooth and informed adoption of the microgrid structure
    as it rolls out.


    Let’s now move from microgrids to macro scale and examine how major capital projects
    can benefit from the application of blockchain.


    ## A Holistic Approach to the Capital Asset Lifecycle

