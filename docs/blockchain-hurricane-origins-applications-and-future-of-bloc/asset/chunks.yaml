    简易 ICO 融资的衰落使得优秀项目脱颖而出，在这些项目中，透明度和不可篡改性可以带来真正的利益，而使用分布式账本是解决正确问题的有效方案。对于那些互不认识且没有中介的双方，需要一种机制来信任记录的数据，区块链尤为相关。这种需求可能源于治理系统的失效，也可能是因为供应链外的消费者想要确认原材料的来源，或者是由于在没有直接业务关系的商业组织之间需要信任。它还可能涉及数字资产的所有权、托管和交换、奖励机制，以及任何需要去中心化的自动化。与传统软件相比，使用区块链实现了更高的流程效率，特别是在资产追踪、简单供应链以及涉及多个参与方的行政任务中。过去甚至提出过某些从未实现的商业模式，而现在通过分布式账本技术的应用已经可以实现这些。随着区块链在技术版图中占据了自己的位置，人们正经历着从从幻灭到实际应用的转变。


    # 区块链在现实世界中的应用


    从产品的加工、开采、收获或制造，到终端消费者的使用，区块链应用正在最出意想不到的角落涌现。虽然一个跨越全球的透明账本无缝网络仍是未来主义小说的专利，但目前已有一些商业系统用于食品供应链的认证、奢侈品的溯源以及运输等多个环节。在幕后，得益于这项技术，行政功能正在被重构，它实现了相互猜疑的群体之间的透明度和协作。特别是金融服务行业，迅速识别了机器人流程自动化中可以从去中心化受益的方面，以及与法律行业等其他行业的关系，在这些行业中，信任是系统顺畅运行的因素。银行和审计部门正在开发各种区块链应用，范围从小型概念验证到已部署并扩展的系统。


    在大型资本项目领域（无论是公有还是私有），区块链模型正在改进复杂供应链的记录工作，以及从设计意图到建设和运营的决策审批记录。基础设施项目具有长期性，可能持续几十年甚至几个世纪，这意味着依赖公司知识和个人记忆是不可靠的，而且资产在其生命周期内可能会经过多只手手。在资本资产的整个生命周期中，信息的认证是至关重要的。


    让我们更详细地看看区块链技术在所有这些领域中开启的一些新商业实践，并研究成功实施区块链的要求。


    # 真相


    对区块链本质最大的误解之一是它是绝对真理的仓库。是的，区块链中存储记录的不可篡改性确保了交易受到 Joseph Lubin（原始 `Ethereum` 团队成员和
    `ConsenSys` 创始人）描述的“军事级防篡”的保护。你可以确信参考区块链记录认证的交易或文档是原始且未被更改的。但交易的主体是什么？在加密货币的情况下，硬币是从内部生成的，记录的交易涉及来源确定的资产。一旦你跨出虚拟世界并开始将物理实体以数字形式表示，你如何确保通过这些去中心化账本进行不可篡改传输的资产是正确的呢？


    ## 可靠的初始输入：垃圾进，垃圾出


    你不能信任计算机告诉你的一切。几十年来，程序员们一直遵循 `GIGO` 原则：如果任何系统的输入是垃圾，那么无论中间的处理有多好，你得到的结果也将是垃圾。自封的数字破坏者特伦斯·艾登（Terence
    Eden）在参加一个艺术认证和验证平台团队的早期演讲时应用了这一原则。他想，如果被区块链追踪的艺术品不是昂贵的原作，而是刻意认证的伪品怎么办？他的博客描述了他在公司演示期间对这一概念的即兴测试，访问了该平台的早期演示版本^(2)。“简而言之，”他解释道，“我说服他们我画了蒙娜丽莎。为了这个‘证明’，我提供了……一个电子邮件地址[以及]来自维基百科的蒙娜丽莎照片。”


    重要的是，`Verisart` 正在努力实现可靠的物理和数字来源验证，该平台现在已应用于艺术和收藏市场，但艾登的恶剧清楚而简单地表明，如果没有可靠的初始输入，区块链记录就不值它们所占的数据位。区块链保证的是交易的真实性，而非绝对真理。对于在物理世界运行的企业来说，需要减少或消除数据输入点产生的人为错误和故意干预风险，大部分工作将依赖于行为改变和激励，以确保交易准确性上更加严谨，这在某些区块链实施中已经被观察到（例如，参见本章稍后的
    `Kraken IM` 案例研究）。为了收紧我们的区块链记录，我们可以寻求其他技术的帮助。


    # 与物联网和人工智能的交叉


    物联网（`IoT`）为日常物理物品引入了连接，从智能水壶到智能建筑。网络安全提供商 `Avast` 的首席技术官兼总裁 Ondrej Vlcek 估计，到
    2025 年，将有高达 500 亿消费设备在线，更不用说随着数据连接性的提高（特别是主要经济体引入 5G 网络后），正在快速部署的数十亿商业传感器、工具、车辆和机器。


    这些传感器提供了两点。首先，它们收集的大量数据提供了对世界及其其中人类行为的深度洞察。这告知并训练了人工智能（`AI`）来识别异常；`AI` 已用于欺诈检测，减少了不准确数据进入集中或去中心化账本的风险。其次，从传感器到账本的直接通信完全消除了人为界面。这是之前章节讨论的
    `IOTA` 区块链的关键要素，也是许多企业区块链可靠运行的保障。


    研究人员已经提出了许多与区块链集成的 `IoT` 场景。Huckle、Bhattacharya、White 和 Beloff 的一个著名案例^(3) 描述了一个通勤行程，连接的车辆自主安排路线加油（或充电），同时区块链应用确认驾驶员的身份，触发汽车为该个人设置偏好的驾驶位置，并允许在无人干预的情况下使用智能合约支付燃料费用。


    ## 案例研究：国家档案馆

