    and of nation states is not a straightforward task but the public sector is rising
    to the challenge and adopting new technologies more rapidly than we have seen
    in the past. Blockchain technology can enable some fundamental changes to the
    way we live, and it is refreshing to see so much innovation emerging from a traditionally
    slow sector. While many of the applications are not yet deployed at scale, the
    fact that they are live and being trialed and scrutinized bodes well for future
    adoption.


    In our final chapter, let’s turn to some of the as yet unrealized opportunities
    around blockchain, and the threats that lie ahead.


    [CHAPTER 7](#contents.xhtml#c7)


    [Looking to the Future](#contents.xhtml#c7)


    The impact of blockchain and cryptocurrency on our futures will be disruptive
    in ways we cannot yet imagine, and distributed ledgers will be disrupted in turn
    by other technologies. We can expect our workplaces and family lives to change,
    influenced by a whole range of emerging sectors from artificial intelligence to
    mixed realities and a connected world alongside decentralized applications. There
    are areas where we can already see the opportunity for blockchain to disrupt systems
    and change lives, but the challenges of implementation have pushed the dream a
    few years into the future. There are also threats on the horizon that developers
    are already addressing: one of the timeliest questions is around the sustainability
    of the technology.


    Is Bitcoin Killing the Planet?'
