    在西弗吉尼亚州，州务卿办公室发现，对于现役人员而言，现有的邮件和电子投票系统无法使用。该州开展了一项试点计划，允许 150 名海外选民使用 `Voatz`
    移动区块链应用程序参加 2018 年 11 月的中期选举。丹佛市也在 2019 年 5 月的市政中测试了 `Voatz`，面向 4000 名符合条件的现役军人及海外选民。在这两种情况下，选举官员都报告称小样本的投票率有所提高。需要注意的是，`Voatz`
    是一家私人公司，而非政府或学术机构主导的计划。该系统可能是在进行票数统计，而不是提供个人验证性，但对其存在缺乏独立审查的批评。这种谨慎在区块链世界中是不寻常的，那里协作精神和开源开发理念通常反映了技术的透明度。然而，这确实证明了致力于推进区块链技术应用的企业所面临的挑战之一：知识产权保护。


    # 区块链开发的挑战


    本书旨在希望了解区块链和加密货币格局的业务决策者，而不是面向那些可能通过在线社区和协作项目关注这一快速发展的软件世界的开发者。然而，高管们必须意识到任何新开发在系统设计和安全方面的潜在影响，以便向其技术交付团队提出正确的问题。


    流程的自动化可能充满问题。人们只需看看任何公共服务软件平台发布期间的延迟和投诉，就能意识到自动化的复杂性和迭代本质。中心化记录系统的变更可以由数据所有者管理，但去中心化的账本系统又如何？当一个过程是自动化且不可篡改时，执行每笔交易的`smart
    contract` 从开始就必须是滴水不漏的。在`第 2 章`中，我们讨论了通过部署智能合约错误可能产生的问题。控制区块链上交易的代码必须比中心化软件经过更严格的测试和审计。在解决棘手的业务问题和交付智能用户工具时，必须考虑包括知识产权管理和数据保护在内的日常事项。


    # 品牌与知识产权


    谁拥有你的网站？构成普通互联网网站的知识产权、版权和开源材料错综复杂，异乎寻常。以一个简单的 `WordPress` 网站为例，`WordPress` 底的代码是开源的，拥有庞大的贡献者社区和开源许可证，在使用或适配该软件时必须考虑其要求。`WordPress`
    资产的图标和设计（如品牌标志）属于该公司，并且可能在一个或多个国家拥有了商标注册。你自己的标志也可能受到类似的保护。位于网站之上并赋予其外观和感官的主题，可能是一个开源皮肤，也可能是由第三方设计并授权你使用的，尽管他们对你的品牌颜色和标志没有权利。你为每个页面编写的文字可能属于你的版权。你放在页面上的图像可能是通过知识产权共享（Creative
    Commons）许可提供的，可能是来自机构的付费许可，也可能是你拍摄的。如果照片是一件艺术品，版权属于艺术家而非摄影师。那么，到底是谁拥有你的网站呢？知识资本又在何？


    新罕布什尔大学（UNH）法学院学术事务副院长、区块链法在线认证证书项目主任托尼亚·埃文斯（Tonya Evans）教授表示，知识资本是企业最重要的资产，但可能是最不被理解的。企业必须考虑到文字、图像或代码的版权、专利商标以及商业秘密，并在业务价值与市场及消费者的广泛需求之间取得平衡。`Cryptokitties`
    团队在开发`第 5 章`中描述的 `Nifty` 许可证时，保留了对猫卡通风格的明确所有权，同时将每个独特猫设计的使用权授予相关的代币持有者。这为创作者最大化了知识资本（他们需要一些成果来展示自己的工作），并对网络图像占用的习惯采取了明智的方法。


    区块链开发中的开源协作是该领域我们看到的快速创新的主要特征。埃文斯提醒我们，开源许可证周围总是存在限制。当代码从开源资源中适配时，对这些适配可能会产生一些可以主张的知识资本。然而，正如上述对
    `Voatz` 的批评所显示的那样，将底牌捂得太紧在公众认知中可能会适得其反。保留商业秘密必须为业务增加价值。如果保密损害了人们对企业的认知，可能会造成更大的破坏。


    硬币的另一面是区块链对你品牌的价值。许多名字中带有“区块链”的企业涌现出来并不意外，因为这似乎将他们与竞争对手区分开来。同样不幸的是，很大比例的企业并没有达到预期。现在市场正趋于稳定，空壳项目正在出局，是时候利用区块链的优点了。克莱姆森大学学术伙伴与创新事务副总裁肖塔维亚·约翰逊（Shontavia
    Johnson）在 2019 年 3 月于奥斯汀的 SXSW 演讲时，考虑了用于构建品牌的区块链特征：客户信任、效率以及通过应用程序将社区和影响者聚集在你品牌周围的能力。利用流行词可能会带来短期收益，但将你的品牌与正确使用区块链的价值观和原则对齐并以行动支持它，具有长期价值。消除术语并展示透明度、真实性、信誉、社区和效率是一项值得的业务策略。


    # 数据保护


    '
- fmt: '

    Data protection legislation is a modern extension of the privacy laws that have
    evolved very differently across multiple jurisdictions in the last 150 years.
    In the United States, privacy laws developed through the natural evolution of
    common law, against the background of the right to free speech and freedom of
    the press, as enshrined in the Constitution and the First Amendment. While the
    common law tort of Invasion of Privacy grants the individual “full protection
    in person and in property,” it has been applied through history on a case-by-case
    basis, and as both society and technology have developed the legislation has been
    trying to keep up with new contexts of privacy. In 1890, the target was the emerging
    technology of photography, which had resulted in some instances of overaggressive
    journalism. “The Right to Privacy” by Warren and Brandeis, published in the Harvard
    Law Review, remains an influential text, and the concerns raised are recognizable
    in our modern society. Modern tort law, evolving since Warren and Brandeis, protects
    from “intrusion of solitude, public disclosure of public facts, false light, and
    appropriation.” Federal law places limits on government intrusion, while individual
    states have added other protection piecemeal. This complexity of legislation has
    resulted in a patchwork of laws and regulations that can sometimes overlap or
    contradict one another. In the digital arena, for example, the California Consumer
    Privacy Act 2018 (CCPA) and the Biometric Information Privacy Act 2008 in Illinois
    are independent and unrelated pieces of legislation addressing very specific elements
    of privacy. Developers have a challenge to ensure that the data their systems
    are designed to capture and retain will pass muster under a variety of different
    laws.


    The situation is further complicated by the cross-border adoption of software.
    Blockchain inspires a vision of a connected, decentralized world, but this requires
    conforming operations in different jurisdictions. Four letters strike fear into
    the heart of all tech firms: GDPR. The General Data Protection Regulations, which
    took effect across Europe in 2018, are onerous and have specific implications
    for immutable records in distributed ledgers.


    ### How did European legislation develop in this way?


    In Europe, something is private unless declared otherwise, while in the U.S. privacy
    is an inalienable right, but invasion of such privacy is defined sector by sector
    and case by case. The difference can be traced to one major historical event and
    its legacy: The Second World War. After the war, the Council of Europe was formed,
    and in 1949 work began to develop the European Convention on Human Rights (ECHR),
    a very strong declaration in favor of democracy, freedom, and the rights of the
    individual. In 2009, the European Charter of Fundamental Rights combined the ECHR
    and individual pieces of legislation from different states into one Charter, which
    is legally binding on all states in the European Union. The right to personal
    privacy is explicit. This blanket protection is the starting point for regulation
    in Europe, with subsequent case law allowing limited access to personal data.
    The General Data Protection Regulations emerged from this background, restricting
    the actual collection of personal data unless this is done for a specific reason
    or, failing that, is collected with “informed consent,” which is a complex minefield.


    ### Case Study: SDQ


    Professor Mike Smith is based in Europe and the Strengths and Difficulties Questionnaire
    (SDQ) he operates is being used worldwide. Mental health assessment, particularly
    with children, is a very sensitive area, and Smith’s experience offers insights
    into the care developers should be taking over data capture and retention. He
    explains that he has always avoided collecting any demographic data. For completeness
    it is important to capture age and gender, which are relevant in the assessment,
    but these will not result in personal identification in a data set of multiple
    records. However, the precise date of birth of a subject is not collected because
    this could very easily be traced to one individual given other contextual information
    about the sample.


    Although SDQ is unwilling to collect personal details, these are essential in
    a medical setting because clinicians cannot risk attaching data to the wrong patient.
    The solution to this problem requires blockchain and is permissible under GDPR
    because it is an example of security by design. It is a powerful mechanism for
    data protection.


    Data is concealed by strong encryption and tokenization, rendering the stored
    information unintelligible in a manner that would take years for a bad actor to
    reconstruct. The unique ID of this data can be bound to patient information at
    the clinical side, local to the medical professional, and the stored information
    for that ID can only be decrypted by the keyholder. Each transmission of data
    is timestamped, providing an access audit trail for the unique ID but without
    knowledge of the contents. This protects SDQ by keeping track of the opaque “blobs”
    of data, proving that the information is still stored and has not been lost or
    maliciously deleted. Although this structure prevents a bad actor with partial
    information from accessing the stored data, there are considerations around custodianship
    of private keys: if a key is lost then valuable data is lost with it and cannot
    be retrieved. Solving this challenge once again falls to developers, to ensure
    that the security of data is not compromised by measures to protect decryption
    tools.


    ### Looking to the Future


    While enterprises can move quickly to meet challenges, and game developers follow
    their imaginations to break barriers, the path of innovation for government and
    governance is necessarily slower. The management of our personal data, our lives,
    and of nation states is not a straightforward task but the public sector is rising
    to the challenge and adopting new technologies more rapidly than we have seen
    in the past. Blockchain technology can enable some fundamental changes to the
    way we live, and it is refreshing to see so much innovation emerging from a traditionally
    slow sector. While many of the applications are not yet deployed at scale, the
    fact that they are live and being trialed and scrutinized bodes well for future
    adoption.


    In our final chapter, let’s turn to some of the as yet unrealized opportunities
    around blockchain, and the threats that lie ahead.

    '
