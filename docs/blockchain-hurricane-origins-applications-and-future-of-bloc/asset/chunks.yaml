- fmt: '

    Using Bitcoin is not as simple as we might expect given the reported uptake. A
    lack of reliable infrastructure results in regular power cuts, or more accurately
    a sporadic supply of electricity to one town, then another. Internet access is
    patchy or nonexistent. Bitcoin mining, once lucrative thanks to virtually free
    electricity funded by the country’s oil revenues, is illegal. Any equipment found
    is confiscated, although this simply moves the mining rigs into the control of
    the government. But still Bitcoin flourishes. Payment for regular commodities
    in Bitcoin via SMS started to become common in November 2018, in grocery stores,
    restaurants, coffee shops, and even for buying clothes. This is a huge cultural
    shift in a country where very few people were previously aware of cryptocurrency
    and only a small population had access to the internet. The response to the political
    and economic situation has been a wholesale adoption of “money of the people.”


    What of the “money of the government”? The Petro is increasingly being imposed
    on a population who are not technologically able to cope with it. Pensions are
    paid in Petro, and a video, which circulated widely online, shows a tax collector
    demanding payment in Petro from a business owner.^([17](#08_Reference.xhtml#c3.17))
    The young man was unable to oblige, explaining that all his customers paid him
    in Bolivars, and was jailed for his protest. Many of the Venezuelan professional
    classes have left the country, including my developer colleague and her husband,
    a doctor. For those who leave, at least they can transfer their money out of the
    country in Bitcoin. On the Columbian border, easily reached on foot, there are
    Bitcoin ATMs in place ready for new arrivals to access their savings. Independent
    reports also suggest that the main users of Columbia’s growing Athena Bitcoin
    ATM network are Venezuelans transferring cash back home.^([18](#08_Reference.xhtml#c3.18))


    The most effective adoption of any new technology is that driven by need, and
    true cryptocurrencies, emerging as they have from the Crypto Anarchist ethos,
    are perfectly suited to meet a need such as that of Venezuelan citizens and others
    around the world in a similar position. What, then, are the incentives in a society
    without an obvious need for a “money of the people”?


    ## Putting the User First


    ### A Seamless User Experience

    It is much easier to bring users on board through the familiar. People may not
    realize that they are using cryptocurrency at all thanks to centralized structures
    that have custodianship of assets. Blockchain and cryptocurrency innovator Adryenn
    Ashley outlines the pattern of technology adoption through recent history. The
    VHS versus Betamax video formats was a battle won by the less robust but more
    familiar VHS: after all, reasoned consumers, this was just a big cassette tape.
    CDs became mainstream for audio, smoothing the path for DVDs as a new medium for
    video despite the technical superiority of laser discs. Cryptocurrency adoption
    relies upon this appeal to familiarity, says Ashley. If the language is too alien,
    or the methods of access too complex, then there is no path for the mainstream
    consumer to follow.


    ### Adoption Through Play

    Gaming is one area where cryptocurrency can add new functionality without disrupting
    the user experience. As many as 250 million Fortnite players pay to play using
    `VBucks` in the game, and World of Warcraft’s `WoW Gold` and off-platform asset
    trading is well established. Onboarding new cryptocurrency users through play
    gives users the chance to own their coins and assets, but why should the user’s
    experience be disrupted? Gaming industry veteran Alex Amsel discussed this challenge
    with me. He also sees the challenge of introducing the benefits of cryptocurrency
    without compromising the existing features to which the gaming community are accustomed.
    Stablecoins provide a route to eliminating volatility, but there is no reason
    why games should not be denominated in fiat currency, and this is increasingly
    the route being taken.


    ## Adoption by Informed Choice


    ### Crypto-Maximalism

    Crypto-maximalists advocate for a future where people consciously opt to have
    absolute decentralized control of their own assets, following in the footsteps
    of the Cypherpunks and the crypto-anarchist vision. These may include users who
    are otherwise unbanked or do not wish to place their trust in government, but
    to actively adopt cryptocurrency implies a degree of knowledge and understanding
    of the crypto landscape and language. To expand this way requires user education
    and a considerable amount of work to improve the public perception of cryptocurrency.
    In those cases where cryptocurrency has been directly adopted, for example among
    groups of Venezuelan citizens, this is driven by need but still requires understanding.


    Education is an important part of giving users the choice to use cryptocurrency.
    Understanding the pros and cons of controlling crypto assets improves safe and
    secure use and helps to promote appropriate adoption where cryptocurrency meets
    a need.


    ### Educating Asia

    Direct interaction with a potential user base and proactive education and onboarding
    are gradually driving adoption in Asia in the face of regulation, censorship,
    and anti-crypto propaganda. Emily Rose Dallara, Head of Marketing and Growth of
    `Liquid.com`, has worked throughout Asia and is based in Saigon, Vietnam. She
    observes that Tokyo, along with Bangkok, is probably the most advanced in adoption,
    where Roger Ver, Akane Yokoo, and their team have encouraged a large volume of
    small businesses to take Bitcoin Cash (`BCH`) both in person and online. It’s
    now possible to make micropurchases in coffee shops and restaurants across the
    Tokyo central districts of Roppongi and Shibuya, and it is becoming increasingly
    straightforward for an online merchant to accept `BCH`.


    The adoption that Dallara sees among Vietnamese traders is more likely to be driven
    by holders of cryptocurrency encouraging others to use it so they can spend their
    money. Accepting crypto can also present problems for merchants as it is illegal
    to ask for payment or list prices in any currency other than the Vietnamese Dong
    (`VND`), and across Asia there are so many e-money applications in use that crypto
    is just another payment option. However, there is one area where cryptocurrencies
    are meeting a need, albeit one that will not find favor with the authorities.
    Vietnam, in common with many other more centralized, communist countries, discourages
    the transfer of `VND` out of the country. Dallara’s experience is that it is easier
    and cheaper to convert `VND` to `BCH` on a local exchange and manage cross-border
    transfers in cryptocurrency. In Saigon there is also a big focus on the `DAI`
    stablecoin, and people have started accepting cryptocurrencies online and converting
    to `DAI` or `USD`. How this gradual adoption plays out against the political backdrop
    of Asia’s communist countries will be interesting.


    ## Banking the Unbanked

    One cultural aspect that sometimes escapes Western eyes is that being unbanked
    in Asia is neither unusual nor a disadvantage. Our economy expects people to have
    access to traditional banking and excludes those who do not, for instance, by
    offering more competitive utility pricing to those who can pay by direct debit
    from their bank. The advantage we might expect to accrue to the unbanked in Western
    culture is not going to drive adoption in the East.

    '
