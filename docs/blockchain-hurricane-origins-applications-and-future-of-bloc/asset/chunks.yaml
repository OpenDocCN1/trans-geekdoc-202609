  trans: '

    联合国在实现可持续发展目标身份方面的工作正紧随爱沙尼亚之后，其目标是在 `2030` 年前“为所有人（包括出生登记在内）提供法律身份”。他们与全球最大的数字服务提供商包括
    `Microsoft`、`Accenture`、`Cisco` 等合作，建立了 `ID2020 联盟`。`ID2020` 旨在通过生物识别和区块链技术，为全球
    11 亿未注册身份的人口提供数字身份，它是 `Accenture` 开发并被联合国难民高级专员处使用的现有生物识别身份管理系统的扩展。2018 年，他们与国际救援委员会（IRC）合作，在泰国开展了试点项目，帮助难民获得医疗服务，并建立其教育和职业技能的记录；同时，在印度尼西亚，他们与国家减贫加速小组合作，旨在改善经济困难个体的获取能源补贴的途径。


    在另一项独立计划中，`世界粮食计划`实施了一个私有区块链，以解决约旦某难民营现有食品援助系统中的两个管理难题。他们的目标是通过让这些数据与日常身份验证流程隔离开，来保护难民的完整身份，并简化零售商账户和难民援助津的复杂管理。他们通过启用虹膜扫描作为身份识别手段并在链上仅保留此类元数据，成功保护了
    10 万难民的详细信息。作为额外，该概念验证的实施每月在银行交易费、管理成本和防欺诈方面节省了 `$40,000`。


    当然，身份不仅是政府的问题也是企业的问题：在金融服务领域，了解你的客户（`KYC`）的需求正转向基于不可篡改、可信记录的认证。`2019` 年 7 月，阿拉伯联合酋的一些银行组成了一个针对企业身份的区块链
    KYC 联盟；而在法国，`2018` 年由 26 家公司和 5 家银行运行的一个试点项目证明，通过访问共同区块链进行验证，可以简化重复冗的 KYC 流程。如果这个硬骨头能被攻克，`KYC`
    将成为驱动数字身份在我们舒适的第一世界被采用的用例。


    # 保护我们自己


    除了身份验证之外，区块链是一种可以且正被用于记录、验证和保护许多其他个人数据方面的工具。我们可以通过时间戳的简单机制构建日常生活中基本要素的审计追踪，使我们选择记录的细节在关键时刻既可验证又不可质疑。然而，仅仅因为我们*能*这样做并不并不意味着我们*应该*这样做。我们在社交媒体上记录生活已经给自己增添了足够的麻烦，那么让其中某些信息永久可用又有什么好处呢？


    答案当然是，如果出现看似无法逾越的问题，那么将区块链视为一系列可用新兴技术的一部分，看看正确的解决方案在哪里是值得的。一些企业家正在致力于解决个人数据验证领域非常特定的问题。


    Anne Ahola Ward 目睹了区块链项目的激增，但这些项目大多关注于区块链本身的工具、在没有实际问题的解决方案，以及未能交付长白皮书中所承诺的细致细节的宏大想法。在她所看到的这些事物中，很少是为了帮助人们而设计的，或者能够让主流用户轻松获取的。Ward
    在经历家庭悲剧后，灵光一现的时刻是意识到，资产变成数字化并归个人所有其实是有意义的：在去世之后。


    Anne 和我这一代的大多数人都处理过家庭成员的遗产。各方面都面临挑战。对于最微小资产的争议不断发生，而死者的遗嘱可能已经过时了几十年。在有活跃社交媒体账户的地方，其处理方法并不一致。在包括
    `Facebook` 在内的某些平台上，存在纪念亲人资料的选项，但其他平台则悬而未决，受条款条件变化的无常影响，或者在服务关闭时永久丢失。最简单但最令人无所措的损失之一是代代相传的口述历史财富。Ward
    的愿景是使用区块链来保护带有时间戳的遗产，而 `2019` 年 6 月推出的 `Veritoken Legacy Locket` 则从上传照片、引言和记忆开始，旨在记录个人数据的选择和偏好。技术执行人的新角色是对留存者新需求的回应。从长期来看，保持法律遗嘱的更新可能将由区块链负责，而不是遗嘱律师。“我们不会永远活着，”Ward
    说，“但我们的信息可以，所以我们应该对这些拥有控制权。”


    另一项关注特定生活挑战的倡议是 `Loly` 约会应用。在与创始人 `Adryenn Ashley` 交谈时，这款由女性编写、为女性服务的应用解决了许多其他平台未解决、且区块链提供了解决方案的问题。它引入了受信的用户身份，并支持通过社区验证和良好约会行为报告建立声誉的机制。它满足了约会期间对清晰记录同意或拒绝的需求，这些记录可以在事后进行验证。Ashley
    还报告说，路线图包含用于激活紧急通话和记录功能的安全词。


    这些应用程序中的区块链层对用户来说并不是显而易见的，这对于工具根据自身价值而非技术被采用至关重要。我们可能正在进入一个我们可以拥有数据并管理隐私和身份的世界，但这种体验必须是无缝的，技术必须是所有人都能使用的。


    # 治理与监管


    政府与区块链被描述为天作之合。我们公共服务的逐步数字化稳定地改变了我们的生活，尽管在大规模部署复杂软件面临挑战，但对大多数人来说，这个过程相对并不痛苦。区块链已成为简化公共服务、管理登记和保护身份工作中的多种有用工具之一。在爱沙尼亚，加密在数字身份中的应用比中丰早了几几年，分布式账本的引入是一个自然的演进。在怀俄明州，立法者很快意识到这项技术的潜力以及围绕其良好实践的性。他们开始在政府和业务的几个领域构建区块链解决方案，并起草通过了一系列被其他州采用的法案。在阿拉伯联合酋国，迪拜已将区块链整合到其长期智慧迪拜计划中，目标是无纸化行政。让我们更详细地查看在监管区块链、管理登记、管理城市和公民以及保障民主进程正在进行的工作。


    怀俄明州：区块链州


    '
- fmt: '

    The State of Wyoming is a trailblazer in blockchain regulation. Concerted efforts
    by the Wyoming Blockchain Coalition, including legislator Tyler Lindholm and Wall
    Street veteran Caitlin Long, enabled Wyoming to become the first U.S. state to
    provide a comprehensive legal framework for blockchain technology to flourish
    and benefit both individuals and companies. Several states have since adopted
    the same legislation. Within this suite of bills, enacted in 2018, Wyoming introduced
    a legal framework for digital assets. It ensures that the state recognizes direct
    property rights for owners of assets of all types, classifying them within existing
    laws and frameworks as intangible personal property (whether money, securities,
    or other assets). Land, property, shares, and securities all have their registries,
    and with the rise of digital assets it is logical to expect these to also benefit
    from formal registry structures.


    # Land on the Blockchain


    The traditional management of asset registries has been fundamentally unchanged
    for generations. Where once the register was written in ink and copperplate, it
    has moved to computerized databases and through different software platforms,
    coding languages, physical storage media, and prime entry sources. Registries
    are on one hand a ledger of transactions, and on the other hand a specialized
    archive with the same authentication and verification challenges as the National
    Archives detailed in the case study in Chapter 4. Transfers of ownership from
    one party to another, or from one party to multiple owners, must be reflected
    accurately.


    ## Why is blockchain relevant to these long-standing systems?


    Until recently, improving efficiency and reducing both costs and the opportunity
    for human error in the management of the archive and the ledger could have be
    achieved with internal robotic process automation (RPA). The registries are generally
    held by a single party, so decentralization may not appear to be an immediate
    advantage. However, the process of monitoring, updating, and validating registries
    is increasingly decentralized. Changes of ownership, background checks, and interrogation
    of the register are more likely to be processed by third parties. As a public
    record, there are multiple parties involved in updating the details held on the
    register and any individual referring to the records must have confidence in the
    accuracy of the inputs. Blockchain not only provides a route to achieving greater
    efficiency at lower cost, but also improves the update process for transactions
    originating with third parties such as lawyers and makes the information more
    accessible and trustworthy.


    Land registries across the world rushed to test the concept of blockchain as soon
    as the potential benefits became apparent. There have been land registry pilots
    and proofs of concept running on every continent in countries including (but not
    limited to) the Republic of Georgia, Sweden, the United Kingdom, New South Wales
    in Australia, the state of Wyoming, Honduras, Ghana, Haryana in India (as part
    of a United Nations initiative), and Dubai. A handful among these have made the
    leap to live deployment, although others are still testing their platforms or
    have stalled altogether.


    ## Economic Incentives and Case Studies


    The economic incentives for the development of efficient and accurate land registries
    are clear: “Land rights are essential to promote economic growth, address economic
    inequalities, alleviate conflict management, and support local governance processes,”
    say Benbunan-Fich and Castellanos in their 2018 paper presented to the Thirty
    Ninth International Conference on Information Systems. Their contrasting case
    studies of the projects in Honduras and the Republic of Georgia demonstrate one
    of the real challenges of blockchain implementation. The technology is complex,
    and while the use case may be ideal and the solution theoretically viable, the
    information systems readiness in a public organization can be the difference between
    success and failure. Honduras was an early adopter, starting its digitalization
    pilot in 2015 in partnership with Factom, an experienced blockchain developer
    headquartered in Austin, Texas. Despite this promising start the project stalled
    within a year, unable to move at private sector pace and coinciding with the start
    of a politically charged election season.


    At the opposite extreme, Georgia, independent since 1991, had already put firm
    processes in place for the management of their registries and embraced the world
    of blockchain through benefits for bitcoin miners and partnerships with BitFury.
    When it came to digitization, their National Agency of Public Registry (NAPR)
    was “information systems ready”. The Republic of Georgia’s blockchain registry
    was the first in the world to be deployed live and at scale. Mariam Turashvili,
    head of project management at the NAPR, confirmed to me that as at July 2019 they
    had “more than 2 million extracts from the public registry (hashes of ownership
    certificates) stored on blockchain” and were actively working on the smart contracts
    for processing transfers of ownership and other transactions, and the legislative
    amendments required to implement them.


    ## Sweden’s Lantmäteriet


    Sweden’s Lantmäteriet was one of the first public authorities in the world to
    move its land registry from paper to digital records, as far back as the 1970s,
    but technology has moved on since this time. The authority realized that the delay
    between any change of status or ownership and the entry on the register was compromising
    the transparency and trust placed in it. The delays were directly due to a heavy
    (and costly) manual system of signed documents, and the lack of transparency resulted
    from firewalls and security systems designed to protect the data but simultaneously
    blocking access to anyone without high level to write to the database. The advent
    of blockchain appeared to offer a solution to both challenges, and a two-year
    proof of concept exercise was completed in March 2018. This is not the only example
    of emerging technology being use in problem solving at Lantmäteriet. Natural language
    processing, handwritten text analysis, and artificial intelligence have been developed
    to improve their response to citizen requests for existing records. Blockchain
    is just one of many tools being used by a historically forward-thinking authority
    to improve its services.


    ## Emerging Developments


    Some of the most interesting early stage development is emerging in Africa. Bitland
    in Ghana, a Swiss partnership in Rwanda, and Land LayBy in Kenya are responding
    to endemic problems of fake title deeds and lack of consistent documentation.
    Although these are a long way from delivering a live and adopted system, they
    demonstrate a local response to the problem that is likely to be far more suitable
    and sustainable than anything imposed from outside Africa.


    Although registries have been held out as one of the most obvious applications
    for blockchain technology, their development at scale is a slow process. The public
    sector is naturally cautious about the deployment of any IT system because people
    do not have a choice whether to use it, while the private sector races ahead,
    secure in the knowledge that competition in the market weeds out the weaker propositions.
    Land registries may have suffered from a period of hype, but the steady progress
    of landmark projects is likely to deliver real benefits worldwide in the next
    few years.


    Smart Cities, Smart Lives

