    由于任何可能的候选人都没有在公开领域提供不可反驳的身份证明（访问中本钱包是最具说服力的证据），加密社区对于中本·聪聪（Satoshi Nakamoto）背后的真实身份仍存在分歧。这是一件坏事吗？除了满足人类人类的好奇心外，大多数评论者认为，中本的身份保持未知完全符合密码朋克（Cypherpunks）精神和加密无政府主义运动。通过隐入背景且不提供领军人物，比特币的创建者（们）确保了该解决方案保持了真正的去中心化。


    ## 在比特币之上


    你可以在区块中记录什么类型的交易？比特币本身运行在一种三式记账模式的基础上，其中发送和接收付款的双重记账由第三笔条目确认：来自网络的一份经过数字签名、加密密封的收据。比特币区块链上的每笔交易都是使用一种名为
    `UTXO`（或“未花费交易输出”）的模型进行处理的。使用公钥和私钥访问你的“钱包”，实际上是解锁与你关联的硬币的过程。如果丢失了密钥，你就无法打开锁。在发起付款时，你正在解锁一个
    `UTXO` 并告诉网络从可用总额中扣除你指定的金额。换句话说，余额（即未花费的金额）由网络作为新的 `UTXO` 发回给你，并在下次交易时被解锁。这听起来很复杂，但用户的钱包实际上是一个与用户关联的
    `UTXO` 记录列表，通过总和得出账户余额。比特币区块链上的每个全节点都持有所有未花费比特币交易的副本。


    为什么分布式账本方法应该仅限于金融交易呢？将加密货币交易以外的其他流程去中心化的想法迅速吸引了开发者和企业的想象力。如果你可以在日常银行服务中省略中间人，还有哪些机构可以变得不再必要？`UTXO`
    对于除相同数字资产交换之外的其实并不是一种实用的方法论：在比特币区块链之上编写第二层协议的想法归功于 J. R. Willett，他在 2012 年发表了《第二份比特币白皮书》。对于该行业的未来至关重要的是，他还建议从加密社区内部募集开发资金来实现此目标。原始文档已无法访问，但在
    2013 年圣何塞比特币会议上，Willett 向他的小组小组观众解释了这个想法。^(16) Laura Shin 在 2017 年为《福布斯》写作时描述了这一突破。^^(17)
    “他构思了在比特币之上的类似于合同的东西，”她解释道，“就像电子邮件分层在 TCP/IP 之上一样，但他想知道如何为开发支付费用。[他意识到]他可以在比特币之上发行一种币，如果买家发送比特币来资助其开发，他们就能自动拥有这种币。”


    Willett 成功地通过被称为初始代币发行（ICO）的方式为他的 Mastercoin 项目筹得了资金，但该项目并未在比特币上启动。比特币区块链是一个强健的生物，到此时，它经过反复测试的结构已被其他区块链复制并完善，包括去中心化域名注册数据库
    Namecoin（2010）、莱特币（Litecoin，比特币黄金的银，2011）以及持久且深受喜爱的幽默货币狗狗币（Dogecoin，2013）。然而，它还不能满足企业的需求。需要更具定制化的方案来处理额外的协议层和复杂的多阶段智能合约。


    ## 以太坊与虚拟机


    2013 年 12 月，维塔既·布特林（Vitalik Buterin）发布了一名为《以太坊：终极智能合约和去中心化应用平台》的白皮书。以太坊软件本身是开源的，因此白皮书是
    `GitHub` 上不断演变的文档，^(18)，但原始^(19)可以通过在线存档访问。以太坊是第一个为分布式计算定制的区块链基础设施，也就是说能够在基础加密货币层之上持有多个协议。布特林关于智能合约运行自主规则管理任何数字资产移动的愿景远超比特币，尽管以太坊依赖比特币的“可信的去中心化”，特别是针对先到得交易的时间标记，但它将区块时间从
    10 分钟显著缩短到大约 15 秒。


    以太坊虚拟机（`EVM`）允许代码在单个节点内运行，这是分布式应用（dApps）开发领域的一项重大创新。布特林还建议向“去中心化自治组织（DAOs）进行逻辑扩展——即包含资产并编码整个组织章程的长期智能合约”。以太坊的启动本身部分通过
    ICO 资助，通过出售其原生货币 `Ether`（`ETH`）筹集了约相当于 1800 万美元的开发资金。这为数百个想法打开了大门，创业者认为或错认为这些想法将受益于区块链的独特属性。


    以太坊的潜在应用有哪些？创始人维塔既·布特林在 2019 年 4 月在 Twitter 上回复埃隆·马斯克（Elon Musk）的查询列出了他的首选。该线程包括：


    *   一个全球可访问的金融系统，包括支付、价值存储，以及更先进的内容，如保险；身份：“使用 Facebook 登录” -> “使用以太坊账户登录，无需中间商”。还有信任网……

    *   各种注册表都应该发布在链上以确保安全和易于验证；尝试新形式的人类组织结构；通过支付通道进行各种微支付用例；用于隐私机器学习的个人数据市场（你付给我
    `X`，我让你在我的数据上同态执行函数 `Y`，该数据已通过 `Z` 证实……）；

    *   用于社交网络防止垃圾信息的加密经济学；内容创作 DAO 的预测市场；奖励内容发布者的加密经济学/微支付方案；新市场设计的测试场，例如频繁批量拍卖、组合拍卖、自动做市者；

    *   “用于网络连接的点对点（p2p）市场 / 激励网状网络；针对资源稀少的人的身份、声誉和信用系统（例如难民）；去中心化 DNS 替代方案，例如以太坊域名服务。”


    这些应用中的一些已经实现，将在本书后半部分进行详细讨论。另一些虽然遥不可及，但在区块链开发的地平线上清晰可见。


    ## 并不智能的合约与警示故事


    '
- fmt: '

    Decentralized contracts were the third feature of Wei Dai’s suggestions for b-money.
    Although the transfer of an asset from `A` to `B` is reasonably straightforward,
    transactions in the wider world can be significantly more complex. Of course,
    blockchain wasn’t the first piece of software to encode business rules, but the
    need to manage such complex transactions in blockchain applications gave rise
    to smart contracts. This is a terrible name for a piece of code that is neither
    a contract, nor particularly smart, and causes all kinds of confusion among the
    uninitiated. Even Vitalik Buterin said in 2018 that he wished he’d called them
    something quite different. However, smart contracts they became.


    The smart contracts that characterize Ethereum’s protocol are the rules for a
    transaction laid out in the ledger’s code. There is no contract formed in the
    legal sense of the word (although the code may be reflective of binding contract
    conditions), and there is no learning or refinement involved. Our not-so-smart
    smart contracts have more in common with robotic process automation (`RPA`) than
    intelligent machines; they are `RPA` for mutually suspicious groups.


    These snippets of chain code define very clearly a repetitive process to be applied.
    Movement of cryptocurrency on an account balance basis, rather than the `UTXO`
    model, was the starting point, ensuring that transfers from one wallet to another
    run smoothly without any central intervention. The transaction for a payment is
    reasonably simple: First, check the details: Is the balance in the originating
    wallet enough to make the transfer? Is it going to a valid address? What is the
    appropriate transaction fee? Then the relevant variables are inserted (here they
    would be originator wallet address, destination wallet address, amount sent, and
    the fee due) and the resulting transaction reads “send x coins from wallet a to
    wallet b and send transaction fee y from wallet a to the miner’s block reward
    pot c.” This statement is `hashed` for inclusion in the next available block while
    the transaction executes and is written to the ledger. If your own record of this
    exact transaction is checked against the immutable record in the future, the hashed
    strings will match, and you have verification of its authenticity and the accuracy
    of your own ledger.


    Smart contracts enable transactions to be completed without establishing a relationship
    with the processor. Instead of putting trust in your bank to process a payment,
    for instance, you rely on the smart contract in the blockchain of your chosen
    cryptocurrency to execute the transfer of coin.


    Let’s think through the kinds of transaction that happen in the real world. In
    a supply chain, an invoice issued by a supplier must be recorded as a debt in
    the ledger of the customer but will not be settled until certain conditions are
    fulfilled. Smart contracts can be used to line up the different elements of authorization
    such as receipt of goods and confirmation of quality certification among the mutually
    suspicious groups along the chain, before effecting a transfer of funds from customer
    to supplier. The similarity to robotic process automation is clear. A smart contract
    is simply an automated process in a decentralized system. Another example that
    is commonly quoted as a potential smart contract application is a discharge from
    hospital treatment, which triggers the creation of a follow-up appointment. This
    is certainly possible through a distributed ledger, but as it is likely that all
    the parties to this transaction are known and trusted, then automation within
    a centralized system is a more appropriate solution.


    The significance of smart contracts is their ability to disintermediate any transaction.
    By removing the role of a central agency, parties can transact directly, even
    settling their commitments using the platform’s native currency. However, there
    are good reasons to be cautious about disintermediation. If there is no central
    agency, there is no recourse if something goes wrong. If there is no central authority,
    there is no one to appeal to if there is a dispute. This is the risk of disintermediation.


    ### The Price of Gas


    Cryptokitties, the first high-profile blockchain game, is a great example of a
    set of smart contracts managing digital asset transactions (plus, the kitties
    are cute). The buying and selling of kitties are simple transactions, while breeding
    kitties involves more complex rules, taking account of the genetic traits of the
    parents and determining the final makeup of the offspring. The game was an instant
    hit with the crypto community, so much so that it put considerable pressure on
    the functioning of the Ethereum blockchain. In so doing, it not only tested the
    robustness and scalability of the network, exposing concerns that led to greater
    innovation, but it also opened the eyes of users to the transaction costs beneath
    smart contracts.


    Every smart contract on a public blockchain comes with a cost. This is an inherent
    part of the `Proof of Work` consensus mechanism: there must be a reward to miners
    that makes it worth their while to maintain the blockchain. The reward is made
    up of coins issued from a reserve, and fees for the execution of each transaction.
    The transaction fee on the Ethereum blockchain is dependent on the functions in
    the smart contract and the price of `gas`. `Gas` is a measure of how much work
    a particular function takes to perform; it is named for its role as the cryptofuel
    which drives the motion of smart contracts. Every function has a fee expressed
    as a number of units of `gas`, and these are set out in Appendix G of the Ethereum
    white paper. For example, calculating a single cryptographic `hash` costs `30`
    units of `gas`; an `ADD` function to find the sum of two integers costs `3` units
    of `gas`; a `COPY` operation in a smart contract is charged at `3` units of `gas`
    per word. These add up. A payment in `ETH`, moving the asset from one wallet to
    another, will cost the transferor in total `21,000` units of `gas`. When developers
    are writing smart contracts, there is a new consideration: how `gas`-efficient
    is the code? Has the transaction price been minimized for users?

