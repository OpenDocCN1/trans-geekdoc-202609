- fmt: '

    A permissioned distributed ledger such as Hyperledger or Corda takes from Bitcoin
    and Ethereum the highly effective and stable first-to-file timestamping of transactions
    and the ability to create smart contracts to govern business processes but has
    no cryptocurrency element. At a fundamental and practical level, how can a private
    distributed ledger run as a trusted record keeping vault without a Proof of Work
    system, a native cryptocurrency paying miners to maintain the blockchain and act
    as a mechanism to randomize confirmations? If there are no monetary incentives
    for participants to compute the `nonce` value required to close one block and
    open a new one, how can the integrity of the blockchain and the records secured
    within it be guaranteed? Let’s look in more detail at the cryptoeconomics within
    blockchain and the mechanisms that maintain the integrity of the ledger.


    # Consensus Mechanisms and Cryptoeconomics


    Research into the development of new Proofs, or consensus mechanisms, is not only
    important for the operation of distributed ledgers without cryptocurrency, but
    for the wider operation of blockchain going forward. As concerns grow over the
    environmental impact of all the computing power deployed in maintaining these
    decentralized networks, there is a need to investigate all possible avenues. The
    environmental and sustainability aspect is covered in greater detail in [Chapter
    7](#07_Chapter_7.xhtml); for now, let’s review the operation of consensus mechanisms
    and the different ways in which they are implemented for public and permissioned
    blockchains.


    Transaction details for inclusion in a block are recursively hashed to a single
    string of letters and numbers, the Merkle Tree root of all the data. This string
    sits in a child block at the very end of the blockchain, along with a reference
    to the previous block. Closing the block and opening the next one is an essential
    operation, which, for the integrity of the chain, cannot be centralized or left
    to specific nodes, and must be sufficiently robust that the nodes of the chain
    agree, in other words reach a consensus, that the operation is valid and complete.
    This ensures that data is consistent across nodes and prevents malicious manipulation.


    ## The Role of a Consensus Mechanism


    The problem that a consensus mechanism tries to solve is this: In a network of
    mutually suspicious parties there should be a way to agree on the current state
    of the ledger. Work on consensus fault tolerance in software goes back to the
    late 1970s, and a paper describing “The Byzantine Generals Problem” was published
    in 1982.([21](#08_Reference.xhtml#c2.21)) This describes the challenge for fictional
    army generals reaching consensus on the optimal joint attack strategy without
    direct communication or established trust. Achieving Practical Byzantine Fault
    Tolerance (PBFT), a complex mathematical construct, is the aim of the algorithms
    that underpin the various consensus mechanisms in use. There are broadly three
    ways to approach the problem: by lottery, voting, or work.


    ## Proof of Work


    The original Bitcoin blockchain consensus mechanism is Proof of Work (PoW), the
    work being the computational effort of the miners. It is not simply a consensus
    mechanism but is intrinsic to the cryptoeconomics of the currency: it is the method
    by which new coins are brought into circulation. This competitive proof derives
    from an earlier concept called `HashCash`.([22](#08_Reference.xhtml#c2.22)) The
    computation for each block is hard to solve, taking considerable processing power,
    but easy to verify once completed. The miners are calculating possible `nonce`
    values for a given value of `N` in the equation `hash(blockcontents + nonce) =
    a string with N leading zeros`. You can see the winning `nonce` value and the
    resulting hash of the block with its leading zeros on every block via a block
    explorer. The first miner to solve the equation earns all the transaction fees
    and a reward from the diminishing reserve of Bitcoin. This is a proof that has
    stood the test of time and has been implemented in around three quarters of cryptocurrencies
    by market capitalization, according to figures tracked by Cryptoslate.([23](#08_Reference.xhtml#c2.23))


    ## Proof of Stake


    In Proof of Stake (PoS), the miner’s investment is in their stake in the system,
    not in computation power. Miners earn fees for the transactions that they validate,
    and then nodes must majority vote to commit the operation and close the block.
    The higher your stake, the more transactions you will validate. There are some
    concerns that bad actors could achieve domination of the consensus through building
    their stake or a consortium of stakes beyond 51 percent, giving them majority
    control and the ability to validate and commit fraudulent or duplicate transactions.
    A variant of Proof of Stake, Delegated PoS (DPoS) uses real-time voting combined
    with a measure of the voter’s reputation. Token holders nominate a delegate to
    vote on their behalf, and these delegates earn fees from the transactions in the
    blocks they sign.


    PoS requires miners to stake their coins for the chance to commit (forge) the
    next block in the chain, and the system chooses one of the participating nodes
    either at random or by selecting the node that has the longest interval since
    last forging a block (coin age randomization). In case of cheating, for example,
    validating a fraudulent transaction, the stake is forfeit, which incentivizes
    honesty. The costs of participation are lower, as there is no algorithm processing
    to consume energy, and this encourages greater participation in the consensus,
    which contributes to effective decentralization. It sounds simple but there are
    many challenges to overcome to maintain the integrity of a single unbroken chain.
    In particular, developers recognize that there is an opportunity for competing
    chains to occur by accident or design, or for early participating nodes to seize
    control and invalidate later transactions. The technical detail behind this is
    complex; for further reading, there are a number of excellent articles online
    that explain this in more detail. Different chains have developed different methods
    of ensuring that miners maintain the right chain at all times, but none have quite
    succeeded in replicating the incentive in Proof of Work, whereby the cost of equipment
    and energy that would be expended in attempting to divert the chain are simply
    too great for miners to attempt such a coup.


    NXT is one of several blockchains that uses a PoS consensus, and Ethereum’s community
    has invested a lot of work in developing its Casper update in anticipation of
    an eventual move from Proof of Work to Proof of Stake.


    There are several variations on the Proof of Stake consensus, which, again, require
    no energy to be consumed in computational intensity. Principal among these are
    Delegated Proof of Stake (DPoS) and Proof of Authority (PoA). DPoS is equally
    energy efficient and relies upon a network of witnesses delegating validation
    duties to a small community of nodes. Notable DPoS blockchains include EOS, BitShares,
    Steem, and Lisk. Proponents argue that this is a more democratic system than PoS,
    but the small number of delegated nodes causes concern over centralization: for
    example, EOS has only 21 delegated nodes, although there are tens of thousands
    of witnesses. PoA has a similar structure, with a small number of preapproved
    validators who are staking their reputation on maintenance of the chain. As time
    goes on, this may prove to be the more powerful incentive. PoA has been cautiously
    adopted by some of the more centralized blockchains including Ripple.


    # Lottery and Voting


    For an enterprise blockchain, nodes are invited to the network. There is no public
    aspect, no cryptocurrency, therefore no monetary incentive in the form of transaction
    fees or mining rewards. It is impractical to use a Proof of Work model, so developers
    must turn to lottery or voting mechanisms instead.

    '
