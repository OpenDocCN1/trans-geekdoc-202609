    ### About the Author


    Kate Baucherel is a business development and strategy consultant specializing
    in the application of emerging tech, particularly blockchain and distributed ledger
    technology. She has held technical and financial roles across multiple sectors,
    leading enterprises through their startup and growth phases. Kate’s first job
    was with IBM partner in Denver, when `AS/400` was a really cool piece of hardware
    and the World Wide Web didn’t exist, she has enjoyed the journey to today’s awe-inspiring
    landscape. She holds 2nd Dan black belt in karate and has two children. Kate’s
    writing encompasses the factual and the fictional. Her books include nonfiction
    and futurist thrillers.


