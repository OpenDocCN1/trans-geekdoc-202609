    The decline in easy ICO fundraising has brought good projects to the fore, where
    transparency and immutability can deliver real benefits and using a distributed
    ledger is an effective solution to the right problem. Blockchain is especially
    relevant where parties who do not know each other and have no intermediary need
    a mechanism to trust the recorded data. This need could arise because of a failure
    of systems of governance, or where consumers outside a supply chain want to confirm
    the source of a raw material, or where there is a need for trust between commercial
    organizations without any direct business relationship. It may also involve digital
    asset ownership, custodianship and exchange, reward mechanisms, and any automation
    that requires decentralization. Process efficiencies are being achieved using
    blockchain over traditional software, most notably in asset tracking, simple supply
    chains, and administrative tasks involving multiple parties. There are even some
    business models that have been proposed in the past but never realized and can
    now be achieved with the application of distributed ledger technology. There is
    a shift occurring from disillusionment to practical applications as blockchain
    claims its place in the technology landscape.


    # Blockchain Applications in the Real World


    From processing, mining, harvesting, or manufacturing of products through to their
    consumption by the end consumer, blockchain applications are springing up in the
    most unexpected corners. While a seamless network of transparent ledgers spanning
    the globe is still the preserve of futurist fiction, there are commercial systems
    in place for authentication in the food supply chain, for provenance of luxury
    goods, and for elements of transportation, among others. Behind the scenes, administrative
    functions are being overhauled thanks to this technology, which enables transparency
    and collaboration between mutually suspicious groups. In particular, the financial
    services sector has been quick to identify those aspects of robotic process automation
    which would benefit from decentralization, and relationships with other industries
    such as the legal profession where trust is a factor in the smooth running of
    systems. Banking and auditing functions are working on a variety of blockchain
    applications, which range from small proofs of concept to deployed and scaling
    systems.


    In the world of large capital projects, both public and private, blockchain models
    are improving the record keeping for complex supply chains and for decision approvals
    from design intent through construction and operation. The long-term nature of
    infrastructure projects, which may endure for decades, if not centuries, means
    that reliance on corporate knowledge and individual memory is unreliable, and
    assets may pass through several hands over their lifetime. Authentication of information
    is essential across the whole lifecycle of a capital asset.


    Let’s look in more detail at some of the new business practices that have been
    enabled by blockchain technology across all these sectors and examine the requirements
    for a successful blockchain implementation.


    # Getting to the Truth


    One of the greatest misunderstandings of the nature of blockchain is that it is
    a repository of absolute truth. Yes, the immutability of the records held within
    the blockchain ensures that transactions are protected by what Joseph Lubin, part
    of the original `Ethereum` team and founder of `ConsenSys`, describes as “military-grade
    tamper resistance.” You can be confident that a transaction or document authenticated
    by reference to a blockchain record is original and unchanged. But what is the
    subject of the transaction? In the case of cryptocurrency, coins are generated
    from within the construct and the transactions recorded relate to assets whose
    provenance is certain. As soon as you step outside the virtual world and start
    to represent the physical in digital form, how can you be sure that the asset
    making its immutable way through these decentralized ledgers is the right one?


    ## Reliable Prime Entry: Garbage In, Garbage Out


    You cannot trust everything that a computer tells you. For decades programmers
    have lived by the `GIGO` principle: if the inputs into any system are garbage,
    then what you get out, however good the processing in between, will also be garbage.
    Self-styled digital troublemaker Terence Eden applied the principle when attending
    an early talk by the team behind an art certification and verification platform.
    What if, he wondered, artwork being tracked by the blockchain was not the valuable
    original but a deliberately authenticated fake? His blog describes his spur-of-the-moment
    test of this concept during the company’s presentation, accessing an early demonstration
    version of the platform.^([2](#08_Reference.xhtml#c4.2)) “Long story short,” he
    explains, “I convinced them that I painted the Mona Lisa. For this ‘proof’ I provided
    ... An e-mail address [and] a photo of the Mona Lisa from Wikipedia.”


    It is important to recognize that `Verisart` is working toward reliable physical
    and digital verification of provenance and that the platform is now being used
    commercially in the art and collectibles market, but Eden’s prank highlighted
    clearly and simply that without trustworthy prime entry, blockchain records are
    not worth the data bits they occupy. The blockchain guarantees the truth of transactions,
    not absolute truth. For businesses that operate in the physical world there is
    a need to minimize or eliminate the risk of human error and deliberate interference
    at the point of data entry, much of the work to be done will rely on behavioral
    change and incentives to be more rigorous in ensuring the accuracy of transactions,
    and this is already being observed in some blockchain implementations (for an
    example, see the `Kraken IM` case study later in this chapter). To tighten up
    our blockchain records, we can turn for help to other technologies.


    # Intersection with the Internet of Things and Artificial Intelligence


    The Internet of Things (`IoT`) introduces connectivity into everyday physical
    items, from smart kettles to intelligent buildings. Ondrej Vlcek, CTO and president
    of cybersecurity provider `Avast`, estimates that there will be up to 50 billion
    consumer devices online by 2025, to say nothing of the billions of commercial
    sensors, tools, vehicles, and machines that are rolling out rapidly as data connectivity
    improves, particularly with the introduction of 5G networks in major economies.


    These sensors offer two things. First, the wealth of data that they collect gives
    deep insights into the behavior of the world and people within it. This informs
    and trains artificial intelligence (`AI`) to identify anomalies; `AI` is already
    being used in fraud detection, reducing the risk of inaccurate data making its
    way into centralized or decentralized ledgers. Second, direct communication from
    sensors to the ledger removes the human interface entirely. This is a key element
    of the `IOTA` blockchain discussed in previous chapters and is essential to the
    reliable operation of many enterprise blockchains.


    Plenty of blockchain-integrated `IoT` scenarios have been suggested by researchers.
    One notable example from Huckle, Bhattacharya, White, and Beloff ^([3](#08_Reference.xhtml#c4.3))
    follows a commuter journey, with a connected vehicle autonomously arranging its
    routing to refuel (or recharge), while the blockchain application confirms the
    identity of the driver, triggers the car to set up the preferred driving position
    for that individual, and enables payment for fuel using a smart contract without
    human intervention.


    ## Case Study: National Archive

