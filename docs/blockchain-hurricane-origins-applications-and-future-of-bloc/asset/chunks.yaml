    Another consideration is that if sensors are tracking the location of the hulls,
    then you could track the containers within them, and ultimately goods throughout
    their transit. Kuehne & Nagel’s existing Verified Gross Mass (VGM) portal already
    tracked the weight of loaded cargo to fulfill regulatory requirements, and in
    2018, they incorporated a blockchain element for data verification and to provide
    transparency of shipment information. As data sets and records are combined over
    time, the picture of the cargos that cross our oceans will become clearer.


    ## The Way We Work


    Automation of back office services is not a new phenomenon. The humble spreadsheet
    was, until the arrival of `VisiCalc` in 1978, a time-consuming job with paper,
    pencil, and eraser. This “first killer app” of the computer era changed finance
    roles forever, replacing a repetitive task with code and moving the focus of the
    accounting function from calculation to analysis and forecasting. There remains
    very little that is not in some way automated, with the possible exception of
    the manual sampling and checking processes of a traditional audit.


    Finance and related functions may shun the limelight, but they are trailblazers
    in the use of emerging technology, pushing to make processes more secure, less
    prone to human error, and more reliable. We are seeing the use of artificial intelligence
    in fraud detection, data gathering from the connected devices and sensors of the
    IoT, forecasting based on smart data, and authentication of transactions through
    blockchain technology. The concepts of distributed ledgers and triple-entry bookkeeping
    come naturally to accountants, and finance and administration professionals have
    been quick to exploit this natural advantage in decentralizing processes. Significant
    advances have been made in the world of financial technology (fintech) around
    banking, escrow, securities administration, and audit transparency.


    ## Decentralizing Finance


    The traditional centralized banking system seems at first sight to be working
    perfectly well without a blockchain. Public perception of bank payments, particularly
    in a world where a tap of your smartphone to a sensor is becoming commonplace
    as a payment method, is one of simplicity and speed. Behind the scenes, however,
    it is a story of complex reconciliation of multiple accounts, administratively
    burdensome and entirely ledger based. If a payment is moving from one bank to
    another, there are immediately multiple parties involved in the transaction, and
    the cumbersome structure is a prime candidate for reworking in a distributed ledger.
    There is no reason why fiat currency could not be managed using a permissioned
    blockchain approach. There is no requirement to create cash, therefore no mining
    to be done, but the transfer of money and all related transactions can still be
    immutably recorded and confirmed by the distributed parties, that is the banks
    and the account holders.


    A blockchain-based system powered by smart contracts can deliver greater transparency,
    confidence in the integrity of the records, and long-term cost savings into the
    bargain. Financial services and banking consultant Kapil Dhar told me that there
    is a huge amount of collaborative distributed ledger development going on under
    the radar across banking and financial services. Applications are being trialed
    at proof of concept scale in several areas as banks assess the decentralization
    use cases within their back-office functions. The expected benefits include potentially
    significant economies of scale and scope. The most mature projects have addressed
    cross-border payment applications, and adoption of the `Ripple` distributed ledger
    across banking in several countries worldwide is accelerating development. `Ripple`
    (using its `XRP` coin to effect transfers) and more recent competitor `Stellar`
    (using `XLM`), are fintech-specific technologies designed to manage cross-border
    payments. Some systems are live, including Santander’s `One Pay FX` app, which
    was the first blockchain-powered foreign exchange system to launch to consumers,
    released in the UK and several other countries in April 2018. In the securities
    market, ownership transfers are already being made using distributed ledgers.
    The first such transfer took place in March 2018 between Credit Suisse and ING,
    and in April 2019 the Moroccan and Kuwaiti central securities depositories successfully
    piloted a cross-border securities settlement. The other priority for banking is
    work on digital identities to improve the Know Your Customer (KYC) process and
    combat money laundering operations.


    Practical blockchain applications are emerging across several areas of financial
    services, and one institution, Northern Trust, has advanced blockchain technology
    with a series of U.S. patents.


    ## Case Study: Northern Trust


    In March 2018, Northern Trust deployed for its Guernsey-based private equity operation
    a set of new enhancements to its January 2017 release of its Private Equity Blockchain
    product, including a system whereby their auditors `PwC`, as well as `KPMG`, can
    directly access fund transactions, permitting real-time audit for private equity
    lifecycle events. Anthony Stevens, Global Head of Product Innovation at Northern
    Trust, explained that the work began with onboarding clients and streamlining
    private equity lifecycle events, for example a capital call event using functionality
    developed using more “traditional” technologies. The blockchain aspect of the
    product development became important when interacting with firms who needed access
    to raw data that was a true golden copy of the fund’s events, regulators and audit
    firms being good examples. The external parties can access nodes on the system
    and have developed technology that will provide alerts when specific data points
    are added to the node, enabling them to extract data as required. As a result
    of this simple innovation, the auditors reported a significant operational reduction
    for their work on the private equity accounts involved in the first rollout.


    The underlying blockchain for private equity servicing took time to settle. The
    initial stack was built on `Ethereum`, moving to an IBM supported `Hyperledger`
    on the IBM cloud and eventually to `Hyperledger`’s open source `Fabric` framework
    on the Azure cloud. The first live capital call was processed on the blockchain
    in 2017 with the fund managers including Emerald Technology Ventures processing
    multiple calls via the application from mid-2018 onward. The system reached a
    significant landmark for scalability in June 2019 when Northern Trust announced
    its transfer to `Broadidge Financial Solutions`. The initial rollout expanded
    the platform’s reach to the state of Delaware, where `Broadidge` are continuing
    to develop the system’s functionality at scale. The aim of the transfer to `Broadidge`
    is to allow the full ecosystem to be developed at a much quicker pace, and for
    all parties involved in the Private Equity asset class to access the groundbreaking
    technology developed by Northern Trust.

