- fmt: '

    Distributed ledger technology and cryptocurrencies are here to stay. This book
    will look in detail at cryptocurrencies and the regulation that surrounds them
    ([Chapter 3](#03_Chapter_3.xhtml)), business applications of blockchain ([Chapter
    4](#04_Chapter_4.xhtml)), innovations coming from the gaming sector into the mainstream
    ([Chapter 5](#05_Chapter_5.xhtml)), and public sector and government adoption
    of distributed ledgers, including the question of digital identity and ownership
    of our own data. First, though, let’s look back the at the origins of blockchain
    and the rise of the first decentralized currency, `Bitcoin`.


    # [CHAPTER 2](#contents.xhtml#c2)


    ## [The Long Road to Decentralization](#contents.xhtml#c2)


    ### The Challenge of a Digital Currency


    The weary traveler hoisted a heavy bag over one shoulder and slouched down the
    ramp into the spaceport. A barrage of unfamiliar sounds and smells assailed their
    senses, interrupted by the hiss of a disinfectant curtain and the regular sterile
    tang of `CL2`. Shaking out a mess of wet feathers in disgust, they looked around
    for the nearest bar. A new planet? That called for a cocktail.


    For decades writers have dropped their characters into alien lands, both on earth
    and around endless fictional universes, assuming blithely that they have the means
    and method to settle their bar tab wherever they may be. The fiscal realities
    of multiple currencies and foreign exchange are rarely essential plot twists.
    The reader is simply invited to assume that the coins in the traveler’s pocket
    are either legal tender or made of instantly recognizable precious metals, and
    that galactic credits are accepted everywhere without question. Is there a single
    overblown interplanetary bank issuing notes and coins of a common currency to
    the tentacled and furred alike, or is it more attractive to imagine a digital,
    decentralized currency? Over the many years that galactic heroes have been hanging
    around in disreputable bars, researchers and cryptographers have been working
    toward this vision.


    Why was it so tricky to achieve? The classic challenges of creating a decentralized
    currency are the prevention of double spending, the security of funds and the
    parties involved, and having reliable proof that a transaction has happened. They
    are closely related. Let’s examine a simple movement of money between two individuals.
    If one person has a dollar bill and hands it to their friend, the original holder
    can no longer spend that dollar. A physical transfer has taken place. If instead
    the holder makes a transfer or payment direct from their bank account, the centralized
    banking system makes an entry in one part of the ledger to indicate money has
    been withdrawn from the original holder’s account, and an equal and opposite entry
    debits the balance to the recipient’s account. The databases held by each of the
    participating banks show that the transaction has taken place and ownership of
    the money has changed.


    We accept that there is no way to duplicate the physical note at the time of exchange:
    there is, of course, a constant battle against counterfeit notes and coins that
    circulate in the real world, but what we are concerned with here is that an exchange
    of perceived value has taken place. We trust the digital transfer of money because
    this is subject to the checks and balances of banking, and we can verify transactions
    on our bank statements. However, if we want to make a transaction using a currency
    that is not part of a traditional banking system and has no physical form, how
    is it possible to confirm that the transaction has been completed correctly? Can
    we be sure that the item of value really has moved out of the first account and
    into another? After all, it’s not a physical note. A digital currency must be
    neutral, censorship-resistant, and secure. `Bitcoin` was the first to meet these
    challenges, but the journey was long.


    ### Cryptography Leads the Way


    The concept and workings of digital cash were first suggested in 1982 by `David
    Chaum` in his PhD in Computer Science at `UC Berkeley`. The title of his thesis,^([1](#08_Reference.xhtml#c2.1))
    “Computer Systems Established, Maintained and Trusted by Mutually Suspicious Groups,”
    immediately invokes the trustless multiparty structure of modern ledgers. He also
    explains, in what is a very-written and readable paper, that cryptographic techniques
    will allow data of any nature and volume to be protected while only a single cryptographic
    mechanism needs to be secured. This distinction between protection and security
    is important. Chaum calls the secured element a vault: we know it now as a block
    in our chain, holding the `Merkle root`. Furthermore, he notes that multiple copies
    of encrypted data would not compromise security but would enhance survivability.
    The fundamental concepts of the blockchain are all here, but we are still a long
    way from the eventual solution.


    In a contemporary proposal for blind signatures for untraceable payments,^([2](#08_Reference.xhtml/c2.2))
    `Chaum` further addressed the confidentiality of transaction information, proof
    of payment, verification of parties to the transaction, and protection of any
    stolen payment media (we would think here of credit cards, which were at the time
    uncommon). He defined the functions, protocol, properties, and auditability of
    a cryptographically secured blind signature system. Over the following few years,
    he published multiple papers exploring the mathematical underpinning of virtual
    currency, and in 1989 founded `DigiCash`. Thought to be the world’s first electronic
    money system, its `Cyberbucks` moved between users using the `Blind Signature`
    methodology (now commonly known as `Chaumian blinding`) and the cash was protected
    in line with all of `Chaum’s cryptography principles`. This digital currency was
    ahead of its time, launching at the same time as the nascent World Wide Web but
    well before the internet became established as a consumer tool. There was significant
    interest in centralized digital money at the time from banks worldwide and from
    the likes of `Microsoft`, as this 1994 `Wired` article explains.^([3](#08_Reference.xhtml/c2.3))
    “The next great leap of the digital age is, quite literally, going to hit you
    in the wallet.” Centralized banking grasped the concept, to the point that most
    of our transactions in fiat currency are now effortlessly digital, but `DigiCash`
    itself faded away.

