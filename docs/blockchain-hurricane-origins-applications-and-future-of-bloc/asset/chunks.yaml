  raw: 'The State of Wyoming is a trailblazer in blockchain regulation. Concerted
    efforts by the Wyoming Blockchain Coalition, including legislator Tyler Lindholm
    and Wall Street veteran Caitlin Long, enabled Wyoming to become the first U.S.
    state to provide a comprehensive legal framework for blockchain technology to
    flourish and benefit both individuals and companies. Several states have since
    adopted the same legislation. Within this suite of bills, enacted in 2018, Wyoming
    introduced a legal framework for digital assets. It ensures that the state recognizes
    direct property rights for owners of assets of all types,^([9](#08_Reference.xhtml#c6.9))
    classifying them within existing laws and frameworks as intangible personal property
    (whether money, securities, or other assets). Land, property, shares, and securities
    all have their registries, and with the rise of digital assets it is logical to
    expect these to also benefit from formal registry structures.


