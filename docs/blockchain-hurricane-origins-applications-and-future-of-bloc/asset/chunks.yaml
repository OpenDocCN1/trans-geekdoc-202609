    key to the encryption, in the same way that end-to-end encryption in communication
    apps such as WhatsApp and secure e-mail systems ensures that only the sender and
    the recipient can read the content. If you have a record that purports to be identical
    to the original, then comparing the hash of the information you hold against the
    hash held in the blockchain provides irrefutable proof that the record you hold
    is, or is not, genuine.


    Here are some of the common terms used to describe the aspects and functions of
    blockchain and the world of cryptocurrency.


    *   Records are decentralized and administrative functions are disintermediated:
    there is no central agency, for example a bank, making entries into a database
    under its sole control.


    *   Transactions posted to the ledger are immutable: once they have been validated,
    you cannot go back and make changes. This is essential to maintain trust in the
    records.


    *   The transactions held in the ledger have positional integrity. Each block
    is timestamped and linked to the blocks before and after it.


    *   The various methods of agreeing transactions to the satisfaction of the whole
    community are consensus mechanisms, of which there are many, some more effective
    than others.


    *   Using a consensus mechanism renders the blockchain trustless. That doesn’t
    mean that the records cannot be trusted, rather that there is no need to place
    your trust in any third party.


    *   A blockchain may be public, private, or permissioned depending on its structure
    and degree of decentralization.


    *   The code within the blockchain that executes transactions is known as a smart
    contract, which is ironic as it is neither a contract, nor particularly smart.


    *   The ledger is transparent: participants can see all the transactions that
    have been posted. Anyone can access public blockchain records, for instance the
    Ethereum blockchain can be viewed on Etherscan.io. It is also possible to see
    the smart contracts that govern transaction behavior. This is important to maintain
    confidence in the integrity of the recorded transactions but comes with its disadvantages,
    most notably in the context of commercial confidentiality, which might be compromised
    by public access. In a permissioned or private blockchain, of course, only those
    participants to whom access is granted can access the records.


    *   Participants in a blockchain are nodes. They may be full nodes, which hold
    a copy of the entire distributed ledger, or light client nodes, which transact
    but do not hold all the records.


    *   Cryptocurrency is the blanket term for digital cash, and noncrypto currencies
    are known as fiat currencies. Strictly speaking, this term refers to those currencies
    whose value is set by their issuing government (rather than being backed by reserves),
    but it has become generic in this context.


    *   Public blockchains and cryptocurrencies should adhere to five core principles:
    to be open, public, neutral, censorship-resistant, and borderless.


    As the picture unfolds other concepts will emerge, but for now, let’s start at
    the very beginning.


    Changing Worlds


    This is not the first time that a new technology has generated a polarized opinion.
    In 1995, Newsweek published an article about another emerging movement that was
    taking the world by storm. Writing on “Why the Web Won’t Be Nirvana,”^([1](#08_Reference.xhtml#c1.1))
    Clifford Stoll said: “I’m uneasy about this most trendy and oversold community.
    …\[it\] beckons brightly, seductively flashing an icon of knowledge-as-power...”
    He discounted the “internet hucksters” and their predictions that we would one
    day be reading books and newspapers over the internet, educating our kids, catalogue
    shopping online with a point and a click, ordering airline tickets, making restaurant
    reservations. Could you, quarter of a century ago, have conceived of the ease
    with which we have come to read, browse, and transact online? Now try to visualize
    a near future where creators receive enough automatic micropayments for the use
    of their work to make a good living, where gamers have a viable career as digital
    asset managers, where you have control of your personal data and can choose who
    uses it and for what purpose, where you share electricity you generate among your
    neighbors, and where the provenance of the food you consume and cosmetics you
    use can be determined with the click of an app on your phone. This is what excites
    the pioneers in the blockchain and cryptocurrency space and inspires innovators
    to explore and harness new technologies.


    Similar excitement gripped industrialists and investors in the early days of rail
    travel. The world’s first steam railway ran from Stockton on Tees to Darlington
    in northeast England. Financed by a consortium of industrialists who raised £120,000
    for its construction—the equivalent of over $2.5 million today—it opened in 1825
    and at full speed ran at a dizzying 15 miles per hour. The steam engine Locomotion
    took two hours to draw 36 wagons of freight and passengers along the eight miles
    of track. The investors of the 19th century had a vision, but could not have conceived
    of the rapid change wrought by the expansion of the railways across North America,
    and today’s bullet trains, maglev, hyperloop, or the Channel Tunnel between England
    and France.


    Blockchain is often compared to the internet, not in function but in its potential
    to disrupt, to deliver unexpected change. In 1989 a very small community of people
    were using the nascent World Wide Web. Academics and employees in geographically
    diverse organizations had for many years used bulletin boards and message systems,
    often embedded within early ERP software platforms, as a direct alternative to
    physical, written mail, or telephone calls. It was a difficult medium for the
    layman to access, something we have forgotten in these heady days of one-click
    connection, and in this there are direct parallels with blockchain. Mikko Hyponnen
    of cybersecurity specialists, F-Secure, recalls the complex instructions they
    had to give to enable people to access their website, carefully explaining the
    need for internet access (most often achieved by dialing a provider through a
    modem), a TCP/IP stack, and a browser.^([2](#08_Reference.xhtml#c1.2)) Netscape,
    one of the earliest applications that we would recognize as a modern browser,
    did not exist and Windows did not have Transmission Control or Internet Protocols
    built into its software, but for early adopters the new experience was worth the
    inconvenience.'
