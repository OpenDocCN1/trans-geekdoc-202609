- fmt: '

    The emergence of Bitcoin was a watershed moment. Satoshi Nakamoto’s blockchain
    proof of concept realized a decades-old vision by finally putting in place a working
    decentralized mechanism for the prevention of double spending. The jigsaw was
    complete and a key element, as originally suggested in a 2005 paper by Nick Szabo
    proposing a concept called “BitGold,”^([11](#08_Reference.xhtml#c2.11)) was the
    inclusion of a timestamp for each transaction. The logic behind this is that if
    there are attempts to process multiple identical transactions, whether intentionally
    or coincidentally, then only the first to be timestamped would succeed and be
    written to the ledger.


    The blockchain structure underpinning Bitcoin enabled security and transparency
    of transactions and incorporates the minting and distribution of coins as each
    block is created. Some, but not all, of the familiar concepts from the work of
    cryptographers and Cypherpunks are present in the Bitcoin solution. Wei Dai’s
    suggestion that transactions should be announced to the network for full transparency
    was adopted. The peer-to-peer network ensures distributed responsibility for the
    accuracy of the records. The blockchain is a distributed ledger with copies held
    by multiple nodes, ensuring that no single entity either controls the records
    or unilaterally confirms the legitimacy of the recorded transactions. The data
    that is secured in each block is the Merkle tree root, reflecting Chaum’s vault,
    although this was not referenced in the Bitcoin white paper. Digital signatures
    are an essential part of the solution, but not, in this case, blind signatures.
    This means that the Bitcoin blockchain is pseudonymous (users could be traced
    to the real world) rather than anonymous.


    Payments of minted rewards and transaction fees are made to the nodes of the blockchain
    (the cryptocurrency miners) as each block is closed and new one opened. This is
    the incentive to maintain the system, rather than to defraud it. This cryptoeconomic
    mechanism is essential to the proper functioning of Bitcoin: it ensures that value
    derives from resource scarcity, rather than being backed by a scarce physical
    asset or commodity. As the white paper explains, “The steady addition of a constant
    of amount of new coins is analogous to gold miners expending resources to add
    gold to circulation. In our case, it is CPU time and electricity that is expended.”
    When the Bitcoin blockchain was encoded, it included a reserve of 21 million Bitcoin
    from which rewards are drawn. The early miners claimed 50 Bitcoins for each validation,
    but the reward halves with every 210,000 blocks. As Bitcoin blocks are timed for
    creation every ten minutes (although this interval varies in practice), this means
    that the halving occurs at approximately four-year intervals. To maintain the
    incentive as rewards fall, miners’ earnings will be balanced by increasing transaction
    fees as the volume of transactions increases. The third halving in 2020 takes
    the coins in issue to 18,375,000 BTC, although many have already disappeared down
    the back of the virtual sofa with the inadvertent loss of wallets and hard drives.
    It will take many more years to distribute the remaining almost three million
    coins thanks to this system of diminishing rewards.


    The 21 million coins created cannot be copied or added to, which allows Bitcoin
    to function as a store of value. Bitcoin is a genuinely rare commodity in the
    cryptocurrency space, and as we see other currencies emerging on separate blockchain
    platforms it becomes clear that each has their own separate function. Bitcoin
    is the reserve currency for a new class of digital assets and is now frequently
    listed alongside the dollar and the yen in currency tables. Bitcoin is perhaps
    closer to the much-vaunted gold standard than fiat currencies: there is no quantitative
    easing in the world of digital currency.


    Far from being an artificial currency, Satoshi Nakamoto ensured Bitcoin could
    be authentically sustained in the long term. There is constant development and
    maintenance from the Bitcoin community, and while the currency has certainly evolved,
    it has functioned reliably for more than a decade.


    The first transfer of Bitcoin between two parties took place on January 12, 2009,
    from Satoshi Nakamoto to Hal Finney. This was almost the last that the community
    heard of the pseudonymous creator, and the wallet containing mined Bitcoins from
    the earliest days remains untouched.


    ## Notoriety and Anonymity


    ### Who is Satoshi Nakamoto?


    There is considerable speculation on the identity of the creator of Bitcoin.^([12](#08_Reference.xhtml#c2.12))
    The wording of the white paper seems to indicate that “Satoshi Nakamoto” was more
    than one person, and the influence of the Cypherpunk movement in the construction
    of the solution suggests that at least one of those people would have been a member
    of the Cypherpunk mailing list. There has been plenty of effort made to solve
    the mystery, but most names on the short list of possible candidates have strenuously
    denied involvement. There is circumstantial evidence that Satoshi was based in
    Britain or Western Europe. The language of the paper itself is more British or
    Commonwealth than American, and analysts have determined that no posts were made
    to the Cypherpunk community by the user between midnight and 6 a.m. GMT. In addition,
    the curious message hidden in the timestamp code in the first Bitcoin block mined,
    which reads: “The Times 03/Jan/2009 Chancellor on brink of second bailout for
    banks,” shows the date in British format and references the London newspaper.^([([13](#08_Reference.xhtml#c2.13))


    Hal Finney, as the recipient of the first Bitcoin transfer, is an unlikely candidate
    unless it was a deliberately sneaky move to send money to himself. The appropriately
    named Dorian Prentice Satoshi Nakamoto has been held up by some media outlets
    as a possible author, but although he lived only a few blocks from Hal Finney
    in California, there is nothing to link him to either Finney or the Bitcoin project.


    Another strong possibility was Nick Szabo, who worked with David Chaum at DigiCash
    and who, three years prior to the Bitcoin white paper in 2005, wrote about a very
    similar concept, `BitGold`. Again, despite circumstantial evidence of similarities
    between the two, he has denied any involvement.


    In Estonia, cryptographers Ahto Buldas, Märt Saarepera, and Mike Gault explored
    the same system of digital signatures, hashing and timestamping while working
    on digital identity in 2007. The timing of their work and its similarity with
    the Bitcoin solution attracted speculation, but they have not invited attention
    and like Szabo have denied any involvement.


    By contrast, Australian Dr Craig Wright, who worked in partnership with the late
    David Kleiman in the very early days of Bitcoin, has put himself forward as a
    pretender to the Satoshi crown. Whether Kleiman or Wright were involved in writing
    the white paper and developing the initial code, however, is still unclear. In
    an interesting twist, Wright applied for and was granted U.S. copyright on both
    the Bitcoin white paper and the Bitcoin code in May 2019, claiming authorship
    under the famous pseudonym. As the Copyright Office explained in a press release
    following these registrations,^([14](#08_Reference.xhtml#c2.14)) it does not investigate
    whether there is a provable connection between the claimant and the pseudonymous
    author, relying only on the applicant’s statement. A complex series of court cases
    in the summer of 2019, which involved a dispute with Kleiman’s estate and, separately,
    action against people who claimed Wright was not Satoshi, also failed to unearth
    any evidence supporting Wright’s authorship of the paper.^([15](#08_Reference.xhtml#c2.15))

