- "# 区块链风暴：起源、应用与未来\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 推荐语\n\n“这是一部极其出色的读物。文字优美，具有真实性、清晰性和概念优雅。解释清晰且引人入胜，对于希望增加或加强对基础理解的人来说，这是一个不可或缺且易于理解的资源；对发展起源进行了详尽且慷慨的阐述；对未来开发者和采用者的挑战既令人向往又毫不留情。我以前曾尝试阅读过这个主题，但从未遇到过如此易读、条理清晰、信息丰富、客观且引人入胜的论述。卓越。”\n\
  *Alison Shaw 教授，纽卡斯大学*\n\n“毫无疑问，区块链是一项将颠覆许多行业的技术，包括保险业。它的颠覆性不仅是因为这项技术本质上是突破性的，还因为它将过去处于竞争或某种冲突中的各方聚集在一起，以实现透明度和简化，并最终为客户提供尽可能好的结果。这本书在解释为什么以及将如何变成这样方面做得非常好。”\n\
  *Hélène Stanway，AXA XL 数字领袖*\n\n## 摘要\n\n对区块链技术的炒作，与其激发的创新和所引发的怀疑不相上下。本书为商业决策者和学生提供了关于分布式账本和加密货币的历史、当前应用和未来潜力的清晰概述。它探索了其优缺点、新兴机会和感知威胁。书中在商业背景下介绍了技术框架，以帮助战略人士理解不同区块链实施方法的风险与回报，以及确定这是否为解决当前问题的可行方案的因素。\n\
  \n关键词：区块链；加密货币；分布式账本；比特币；以太坊；Hyperledger；许可；私有\n\n\n\n## 致谢\n\n写这本书非常有趣。我非常感谢所有向我讲述故事、回答问题并开辟新途径的人。特别感谢\
  \ `Alison Shaw`、`Paul Sitoh`、`Steve Blanks`、`David Morton` 和 `Joanne Rout` 的校对以及对修改、增加和澄清提出的建议。在此过程中，我也得到了许多来自朋友、同事以及\
  \ `Hélène Stanway`、`Ghanshyam Patil`、`Mike Smith`、`Ant Stevens`、`Adryenn Ashley`、`Hartej\
  \ Sawhney`、`Mariam Turashvili`、`Steve Schneider`、`Anne Ahola Ward`、`Daniel Doll-Steinberg`、`Tonya\
  \ Evans`、`Corey Segall`、`Shontavia Johnson`、`Graham Richter`、`Helen Disney`、`Genevieve\
  \ Leveille`、`Terence Eden`、`Rich Julien`、`Jeff Hasselman`、`Kapil Dhar`、`Aad van\
  \ Moorsel`、`Holly Burgess`、`Josh Edwards`、`Thomas Power`、`Jonny Fry`、`Andreas Antonopolous`、`Marguerite\
  \ deCourcelle`、`Emily Rose Dallara` 和 `Akane Yokoo` 的鼓励。感谢 `Gabby Dizon`、`Patricia\
  \ O’Callaghan`、`Rachel Wolfson`、`Dylan Jones`、`Tyler lindholm`、`Ian Cornwell`、`Mark\
  \ Bell`、`Martin Bartlam`、`Kim Cope` 和 `Jeremy Gardner` 的耐心与支持。向 `Business Expert\
  \ Press` 团队致谢并爱，当然我的家人：`Xavier`、`Gaelle` 和 `Loïc`。\n\n# 第一章：炒作与希望\n\n区块链为我们做过什么？它的第一个十年是动荡的、迷人的、充满希望、充满危险、充斥欺诈，并最终具有启发性。\n\
  \n### 解密术语\n\n任何新兴技术的挑战之一都是发展出一套解释其特征的新词汇。区块链和加密货币周围的术语也不例外。\n\n\n\n\n区块链在技术上是分布式账本技术（DLT）的一个子集，但这个术语已无处不在。由于公众对区块链和加密货币存在常见的误解且缺乏信任，在业务环境中展示软件解决方案时，DLT\
  \ 通常具有更积极的内涵，但这两个术语经常互换使用，本书也会同时使用这两个词。简单来说，分布式账本是一种交易记录（类似于会计账），它同时存储在多个地方。这与多个用户访问单个数据库不同：分布式账本的优势在于它有许多相同的副本，并且在交易发生时都会根据相同的交易进行更新。这意味着任何一方都可以向账本输入交易，如果所有副本持有者都同意该交易是有效的（严格来说是达成共识），该交易将被整合到账本的每一个实例中。\n\
  \n账目输入依赖于密码学，使交易细节对普通观察者保持保密，并允许授权用户检查其所持记录的完整性。记录在账本上的任何信息都会经过处理以生成一个 `hash`，这是一个代表原始内容的唯一字母和数字字符串。没有加密密钥的人无法对其密，这就像\
  \ `WhatsApp` 等通信应用中的端到端加密以及安全的电子邮件系统确保只有发送者和接收者可以阅读内容一样。如果你有一个声称与原始版本相同的记录，那么将你所持信息的\
  \ `hash` 与区块链中持有的 `hash` 进行比较，就能为你所持记录的真伪提供不可否驳的证明。\n\n以下是一些用于描述区块链和加密货币世界的方面和功能的常用术语。\n\
  \n*   记录是去中心化的，管理功能是去介化的：例如，没有中央机构（如银行）在其单独控制的数据库中输入条目。\n*   发布到账本上的交易是不可篡改的：一旦经过验证，你就无法返回进行更改。这对于维护对记录的信任至关重要。\n\
  *   账本中持有的交易具有位置完整性。每个区块都有时间戳，并与其前后的区块相链。\n*   各种让整个社区满意的交易确认方法被称为共识机制，共识机制有很多种，其中某些机制比其他的更有效。\n\
  *   使用共识机制使区块链变得“无需信任（trustless）”。这并不意味着记录不可信，而是说不需要对任何第三方产生信任。\n*   根据其结构和去中心化程度，区块链可以是公共的、私有的或许可的。\n\
  *   区块链中执行交易的代码被称为“智能合约”，这很讽刺，因为它既不是合同，也不特别智能。\n*   账本是透明的：参与者可以查看所有已发布的交易。任何人都可以访问公共区块链记录，例如，以太坊区块链可以在\
  \ `Etherscan.io` 上查看。还可以查看管理交易行为的智能合约。这对于维护对所记录交易完整性的信心非常重要，但也带来了缺点，特别是在商业机密性方面，公共访问可能会损害机密性。当然，在许可链或私有区块链中，只有获得访问权限的参与者才能访问记录。\n\
  *   区块链的参与者是节点。他们可以是全节点（持有整个分布式账本的副本），也可以是轻量级节点（进行交易但不持有所有记录）。\n*   加密货币是数字现金的统称，非加密货币被称为法币。严格来说，这个术语指的是价值由其发行政府设定（而非由储备支持）的货币，但在这种语境下，它已成为一个通用术语。\n\
  *   公共区块链和加密货币应遵循五个核心原则：开放、公开、中立、抗审查和无国界。\n\n随着图景的展开，其他概念将会出现，但现在，让我们从最开始。\n\n#\
  \ 改变世界\n\n这已经不是第一次新技术产生极分化的观点了。1995 年，《周刊》（Newsweek）发表了一篇关于另一场席卷世界的其他新兴运动的文章。在《为什么网络不会成为天堂》，^(1)\
  \ 中，克里福德·斯托尔（Clifford Stoll）写道：“我对这个流行且过度销售的社区感到不安……[它]明亮地召唤，诱人地闪烁着‘知识即力量’的图标……”他贬低了那些“互联网骗子”以及他们的预测，即我们有一天将在互联网上阅读书籍和报纸、教育孩子、通过点和点击进行在线目录购物、预订机票、预订餐厅。在四分之世纪以前，你能想象到我们现在在线阅读、浏览和交易是如此容易吗？现在，试着想象一个近期的未来：创作者因作品被使用而获得足够的自动微支付以维持生计，游戏玩家拥有数字资产经理的可行职业，你控制自己的个人数据并可以选择谁使用它以及出于什么目的，你将产生的电力分享给邻居，通过手机上应用程序的点击即可确定你消费的食品和使用的化妆品的来源。这就是让区块链和加密货币领域的先驱者感到兴奋，并激励创新者去探索和利用新技术的原因。\n\
  \n类似的兴奋在铁路旅行早期也吸引了工业家和投资者。世界上第一条蒸汽铁路从英格兰东北部的斯托克顿顿昂蒂斯到达尔林顿。它由一个工业家组成的财团筹集了 12,000\
  \ 英镑用于建设——相当于今天的 250 万万美元——它于 1825 年开放，并以令人眩晕的每小时 15 英里的速度运行。蒸汽机 `Locomotion` 花两个小时沿着\
  \ 8 英里的轨道拖动 36 辆货车和乘客。19 世纪的投资者拥有愿景，但他们无法想象跨越美国的铁路扩张带来的快速变化，以及今天的子列车、磁悬浮、超高铁或连接英法的英吉海隧道。\n\
  \n区块链经常被与互联网相比较，不是在功能上，而是在其颠覆和带来意想不到变化的潜力上。1989 年，一小部分人正在使用初生的万维网。地理位置分散的组织的学者和员工多年来一直使用公告板和消息系统（通常嵌入在早期的\
  \ ERP 软件平台中），作为物理书面邮件或电话的直接替代方案。对于门外汉来说，这是一种难以访问的媒体，在如今这种一键连接的兴奋时代我们已经忘记了这一点，而在这一点与区块链有直接的相似之处。F-Secure\
  \ 的网络安全专家米科·海波宁（Mikko Hyponnen）回忆道，为了让人们访问他们的网站，他们必须提供复杂的指令，仔细解释访问互联网的需求（通常通过调制调器拨号提供商来实现）、`TCP/IP`\
  \ 栈和浏览器。^(2) `Netscape`，作为我们现在认为是现代浏览器的早期应用程序之一，当时并不存在，Windows 也没有内置`传输控制或互联网协议`，但对于早期采用者来说，这种新体验是值得付出的不便的。\n\
  \n\n\n\n\n仅仅十多年后，2000 年 3 月见证了“互联网泡沫”的破灭，早期投机性的互联网发展随之沉寂。即使在当时，我们也无法想象会有 `Twitter`\
  \ 及其社交媒体同类产品，更无法想象我们最终依赖互联网通过视频、音频和社区论坛向我们传递信息。多年来，一些科幻作家曾接近这一点，包括大卫·布林（David Brin）在他\
  \ 1990 年的小说`Earth,^(3)`中，书中描述了动态的全球信息网络、公民监控以及与可穿戴技术的无线连接等内容。我们最初使用互联网是为了简化与熟人之间的双向通信，并阅读复制印刷文字的宣传册网站。我们习惯于做的事情在在线上可以更快地完成，并且可以节省成本。创新起初是一个线性过程，随后跨越了鸿沟，实现了无法想象的功能。\n\
  \n`Blockchain` 现在正处于类似的境地。在 `Bitcoin` 诞生年后，加密货币的首个繁荣与衰退周期反映了互联网的历程。随着早期闲散资金的枯竭，投机性应用几乎从版图中消失，为具有长期潜力的严肃业务模型扫清了道路。尽管在准入和采用方面仍然存在障碍，但随着机构（特别是加密货币交易所和区块链游戏开发者）为了简化上手流程而进行创新，并开发具有无缝用户体验的应用，这些障碍正在迅速消除。我相信，该领域的主要玩家尚未出现。就像互联网的先驱或第一条铁路背后的工程师一样，我们根本无法预见等待着我们的某些和社会行为变化。\n\
  \n## 区块链之旅\n\n我们的旅程始于 2009 年首个去中心化数字货币的发布，这是研究人员多年来一直在努力的目标。支撑 `Bitcoin` 区块链的加密技术和链式结构是站在巨巨人肩膀上的创新，但最终在\
  \ `Satoshi Nakamoto` 白皮书中发表的突破提供了一种全新的工作方式。`Bitcoin` 首次演示了账本的创建和维护，且在不涉及中央处理机构的情况下，即可对交易进行处理和记录。它建立了一个系统，每个人都有一份账本副本，每个人认可交易已准确记录，并且没有人可以更改记录。\n\
  \n这种具有复杂的共识机制和精心构建的智能合约的去中心化、透明、无需信任且不可变的技术将带我们走向何方？自从开发者在去中心化货币之外迈出尝试性一步以来，`Blockchain`产生了等量的支持者和反对者。在匿名用户\
  \ `Satoshi Nakamoto` 于 2008 年发表原始 `Bitcoin` 白皮书到 `Vitalik Buterin` 团队于 2015 年发布\
  \ `Ethereum Virtual Machine`之间，区块链基本上是加密货币传教士和开发者的领地。2017 年情况发生了变化，加密货币价格开始上涨，主流媒体也关注这一故事。随后的牛市和熊市因其快速致富的潜力和纸面损失的痛苦而受到关注。`Blockchain`\
  \ 和加密货币已进入公众意识，但认知差异巨大。\n\n在某些评论者眼中，它是当没有其他方法解决复杂的政治和商业挑战时的救星银弹。其他人则没那么确信。2018 年\
  \ 10 月，英美政治家暴露了极化光谱的两端。在英国保守党会议上，时任财政大臣菲利普·汉蒙德（Philip Hammond）被问及关于……\n\n汉蒙德对快速解决方案的希望正值区块链更多是关于概念的尚未实现的潜力时期。由于紧迫的政治期限迫在眉睫，他的声明更像是绝望而非务实，根据\
  \ BBC 罗里·塞兰-琼斯（Rory Cellan-Jones）的说法，这并没有反映白厅走廊内更务实的意见。`Blockchain` 正在帮助全球货物运输，但短期内并非如此，也不是孤立。\n\
  \n当然，事实位于两者之间。`Roubini` 对加密货币以及早期采用热潮特征的糟糕行为表示蔑视,,,,44.................的过度……。^(5)，在那里它邀请你想象：\n\
  \n那 25 亿没有银行账户的人将纳入全球金融体系；外国工人在跨国向家汇款时，每年将不再损失 500 亿美元；人们在购买产品时将了解该产品的生命故事；创造产品的人、涉及的地点、使用的材料等；人们在生活时将不必担心自己的土地可能被拿着枪上门的人占据；艺术家将获得对其版权作品的自主权，并与粉丝建立直接联系；患者将拥有对自己的个人医疗记录的控制权；外国援助将到达预期的受益者手中，而不会损失总额的\
  \ 30%。\n\n\n\n\n地球上的每一个人都将拥有身份，并获得教育、健康和其他社交服务。\n\n这是一个强有力的愿景，许多倡导者认为这种未来可以通过不断进化的区块链技术来实现。\n\
  \n## 加密货币的合法性\n\n联合国的乐观展望，与过去加密货币作为犯罪活动和违规行为工具而蒙受的阴暗声誉相比相差地远。对于任何电脑被勒索软件感染、数据被锁定并要求用\
  \ `Bitcoin` 支付赎金的人来说，加密货币等同于犯罪。它在 2011 年至 2014 年间活跃的暗网市场“丝绸之路”上的广泛使用，在公众认知中得到了强化。在此期间，丝绸之路记录了超过\
  \ 900 万笔 `Bitcoin` 交易，在其运营结束时，其托管账户遭到黑客攻击，尽管大部分的 `Bitcoin` 已找回。讽刺的是，`Bitcoin` 本身在这里是无辜的。`Bitcoin`\
  \ 区块链完全透明且伪匿名的，而非匿名：在理论和实践中，每个钱包都可以与现实身份联系起来，使得 `Bitcoin` 比现金更具可追溯性。^(7)例如在 2017\
  \ 年 WannaCry 勒索软件攻击中，所有的赎金支付在 `Bitcoin` 区块浏览器上对任何人可见。\n\n区块链也讲述了一个故事。对于一次全球性的攻击，总共只有\
  \ 338 名受害者支付了 `WannaCry` 赎金，这一事实强调了网络安全专业人员阻止病毒扩散的卓越工作（部分归功于恶意软件研究人员 Marcus Hutchins\
  \ 的快速行动^(8)），并帮助用户在不支付任何费用的情况下修复勒索软件造成的损害。检查用于收集赎金的三个钱包之一的记录，你可以看到 133 笔 `Bitcoin`Receipt，当时每笔等值\
  \ 300 美元，并在几个月后通过两笔交易提取了全部金额。^(9)资金被转入一个隐私货币 `Monero` 钱包中，在那里，真实的交易细节通过混淆数据受到保护：每笔真实交易都会附带六条虚假记录，使得追踪轨迹变得更加困难。这种匿名加密货币更难监管，它们等同于数字旧银行钞票。给所有数字硬币都贴上同样的标签是不公平的。\n\
  \n针对加密货币的另一项指控（特别是在 2017 年价格快速上涨期间）是它是一个庞氏骗局、金字塔、一个通过用后期入场者的投资支付早期参与者的回报，从而欺骗无辜投资者的骗局。随着价格回落到现实水平，成交量和监管都在提高，关于欺诈行为的讨论少了很多，对主流数字货币可靠性的理解也增加了。然而，当时这种不准确的印象如此普遍，以至于一个加利福尼亚开发人员在\
  \ 2018 年创建了一个玩笑货币 `PonziCoin`。`PonziCoin` 的白皮书用清晰、明确的语言说明，`smart contracts` 将从后期投资的收益中支付第一批投资者，直到资金耗尽。令恶作剧背后的团队惊讶和恐惧的是，人们竟然开始向该计划中投入现金。他们迅速禁用了投资功能，让\
  \ `smart contracts` 按照程序运行。在他们网站的一份声明中，开发者对陷入热潮的人发出了警告：^(10)\n\n我们希望大家笑得开心 :) 但我们必须关闭它。这是一次恶搞艺术表演/玩笑。我没有“卷走”钱，我从未卖过我的任何\
  \ `PonziCoins`，资金是因为其他用户提现而耗尽的。在投资阴暗的加密货币时要小心，特别是那些看起来像金字塔骗局的货币——这是一个零和游戏，钱不会凭空出现。\n\
  \n对于早期区块链项目的投资者来说，这是一个深刻的教训，因为在那里购买代币如此容易。在大多数司法管辖区，投资在某种程度上受到监管是有原因的，如果回报看起来好得不可置信，那么它可能确实如此。\n\
  \n但最终，加密货币只是货币的形式。作者尤瓦尔·诺亚·哈拉里写道：^(11)\n\n钱是人类创造的唯一能够跨越任何文化差异的信任体系，它不根据宗教、性别、种族、年龄或性取向产生歧视。得益于钱，即使是互不认识、互不信任的人也可以进行有效的合作。\n\
  \n加密货币是人类发明以来最通用的相互信任系统的自然演变。它的去中心化结构和核心信任机制确保了它在社会中的合法地位。\n\n## 在现实世界中使用数字现金\n\n\
  你可以花费加密货币吗？当然可以。我口袋里的物理钱包目前有一张 Visa 卡，它直接连接到加密货币账户。可以用我的加密资产间接支付咖啡和三明治。交易涉及自动转换为当地法货币，已经存在的加密货币\
  \ ATM（允许从加密账户提取当地现金）也是如此，但有趣的是这种交换的无摩擦性质。一个国家，太平洋小国马尔尔尔岛，引入了自己的当地加密货币作为法定货币，马尔尔尔岛主币。在委内瑞拉，从咖啡到衣服的商品和服务越来越多地使用\
  \ `Bitcoin` 支付，而政府已开始坚持用自己的加密货币 `Petro` 缴纳税款（你可以在第三章中阅读更多信息）。\n\n在线，我可以用加密货币购买各种商品和服务。有几种主流加密货币结算工具可用，包括标准的\
  \ `Blockonomics` 插件，它可以在我的 WordPress 网站上接收 `Bitcoin` 支付，并将收益直接存入我的加密钱包，无需转换。区块链游戏如\
  \ `Cryptokitties`、`Axie Infinity`、`Neon District`、`Decaland`、`Epic Dragons`、`EOS\
  \ Knights`、`Gods Unchained` 等许多游戏都可以使用加密货币进行。\n\n\n\n\n\n关于区块链最大的误解之一是，它是一个存储大量即时可读信息且不可篡改的数据库。实际上，它是一个存储加密信息字符串的数据库，之所以无法被篡改的唯一原因是每个区块在链中都有固定的位置。更改一个区块中的数据意味着更改其后所有区块的数据，而要实现这一点所付出的精力远大于其可能带来的收益（如果这是可能的的话）。每个区块都非常细小，存储在链上的交易数据被简化为相关文本、图像或日记条目的单个加密哈希值（或校验和）。\n\
  \n谈论将流程“放在区块链上”这种说法掩盖了这些内部运作机制，但这完全是正常现象。人们有多频繁会深入研究他们每天使用的软件的底层和代码呢？当你连接到互联网时，你会考虑那些显示你的\
  \ Google 搜索结果的函数、协议、浏览器技术和搜索算法吗？你会考虑提供你无缝通信体验的万维网结构和工作原理吗？这很少见。通常，唯一困扰我们的问题就是网络连接的可靠性以及我们上传猫照片的速度。然而，在分布式账本采用的这一早期阶段，回顾区块链的基本结构似乎非常重要。理解这些可以帮助你在判断分布式账本是否适用于解决当前问题时做出决策。\n\
  \n## 默克尔树与哈希记录\n\n让我们随机取一个比特币区块链区块。区块号 `575171` 于 2019 年 5 月 8 日挖掘。通过 `blockexplorer.com`\
  \ 搜索该区块引用可以发现，该区块中有 2,568 笔交易，仅包含 908,496 字节的数据：略低于 1 兆字节。这种紧凑的记录是通过加密哈希实现的。\n\n\
  加密哈希算法用于将任何长度的条目转换为规则的字母（大小写）和数字（0–9）。通常使用的算法是安全哈希算法 2（`SHA-2`）函数，例如 `SHA-256`（简单来说，就是一种产生\
  \ 256 位或 32 字节哈希的算法）或 `SHA-512`（512 位或 64 字节），但还有许多其他选项可以产生对于数据机密性和完整性所需的唯一字符串。该字符串的重要性在于，如果使用相同的算法对相同的条目（文档、图像或交易）再次哈希，字符串将是相同的，从而验证了条目的完整性。然而，如果发生了任何变化，无论多么微小，字符串将不会匹配。即使是删除本书书中某个句子中的一个逗号，在处理稿件时也会生成不同的字符串。这种比较的简单应用可能是证明某项知识产权已在特定日期记录在区块链上。对争议文档进行哈希并与区块链核对该哈希，就可以证明它与原始文件是否相同。2018\
  \ 年 6 月在中国一起案件中提出的首个区块链证据就恰恰使用了这种技术，证明了被告未经许可复制了某某文章。\n\n在我们的区块链中，第二轮哈希将一对字符串转换为另一个唯一哈希，这个过程成对地重复，直到所有条目都合并成一个单一字符串。这种哈希字符串的层级结构就是`默克尔树`（`Merkle\
  \ Tree`），最终字符串`默克尔树根`（`Merkle Tree Root`）出现在区块中。（这些以 Ralph Merkle 命名，他的 1979 年论文讨论了公钥系统中的密码学）。当交易通过验证时（如中国的版权案例所示），实际上这个根节点才是比较的对象。检查一个根比检查数千个字符串要快得多，如果字符串内部发生一个变化，那么`默克尔根`本身就会改变。到目前听懂了吗？很好。\n\
  \n## 关闭区块\n\n现在我们已经将所有记录压缩成由字母和数字组成的单一字符串。这个字符串位于区块链最末尾的子区块中。在区块链浏览器上，你可以看到对其父区块\
  \ `575170` 的引用。在区块链网络中，计算能力正在不断输出，参与节点正在竞争运行一种带有变体的新加密哈希。为了完成区块，包括未知变量在内的内容哈希必须产生一个具有预定义数量前导零的字符串：即`区块哈希`（`Block\
  \ Hash`）。第一个找到可能的变量值以交付有效`区块哈希`的计算机将有权关闭该区块并开启下一个。计算出的变量是`非随机数`（`nonce`），它连同解决方案的时间戳一起记录在区块头中。这个过程被称为挖掘：在比特币区块链上，成功的矿工将获得一份预定义的奖励，以及区块中\
  \ 2,568 笔交易的每笔手续费。\n\n## 不可篡改性\n\n我们为什么坚持区块链不能被更改？答案在于链的结构、区块的内容以及分布式账本。我们的区块号 `575171`\
  \ 包含了对 `575170` 的引用。在计算 `575171` 的`区块哈希`时，将包含 `575170` 的`区块哈希`。如果某一方试图更改 `575170`\
  \ 中的任何交易，它的`区块哈希`以及所有后续区块的哈希将不再与区块链所有节点上多个账本副本中的原始细节匹配。重新计算所有后续区块的哈希以掩盖更改是太困难了，试图这样做的人永远无法追上有效链的进展。涉及的数学计算非常困难且耗时，即使对于用于此目的的日益强大的计算机处理器也是如此。人们有合理的担心，量子计算的出现将能够以极快的速度重新计算`区块哈希`的计算能力，但区块链安全的核心规则仍然适用：篡改记录的成本大于任何坏法者可能获得的收益。\n\
  \n了解简单区块链的结构可以帮助你更好地评估该技术对你业务挑战的适用性。在可验证、带时间戳且不可更改的记录能够简化流程、降低成本、改善生活或降低风险的地方，就有考虑使用区块链的理由。正如地平线上每一项新技术一样，除非对其引入的功能有真正的需求，否则对现有系统进行投机性的重构是不恰的。在目前的发展速度下，行业没有时间投入资源仅仅为了\
  \ sake 而复制现有系统。当文字处理器取代打字机时，花费了几十年才交付我们现在理所当然的额外功能。以现在技术的发展速度，我们必须专注于增强。\n\n## 区块链将我们带向何方\n\
  \n区块链带来的变化是巨大且具有破坏性的。举一个例子，流程去中间化将是一个特别挑战。我们已经看到了在线预订对旅行社的影响，他们的业务模式已从经纪转向提供附加值。随着去中心化结构引导用户转向对点行为，房产销售等更复杂领域的代理人可能会面临同样的处地。\n\
  \n\n\n\n分布式账本技术和加密货币已成为常态。本书将详细探讨加密货币以及围绕它们的监管（第 3 章）、区块链的业务应用（第 4 章）、从游戏领域走向主流的创新（第\
  \ 5 章），以及公共部门和政府对分布式账本的采用，包括数字身份和我们自身数据所有权的问题。首先，让我们回顾区块链的起源以及第一种去中心化货币——`Bitcoin`的兴起。\n\
  \n# 第 2 章\n\n## 去中心化的漫漫之路\n\n### 数字货币的挑战\n\n疲惫的旅行者将沉重的包背在单肩上，拖着身体走下坡道进入太空港。一阵不熟悉的声音和气味冲击着他们的感官，期间被消毒帘的嘶嘶声和`CL2`\
  \ 定期产生的无菌气味所打破。他们厌恶地抖了抖一身湿的羽毛，环顾寻找最近的酒吧。新星球？那需要来杯鸡尾酒。\n\n几十年来，作家们一直将角色带到异星世界（无论是地球上还是无尽的虚构宇宙），乐观地假设他们无论在何处都有能力和方法支付酒吧单。多种货币和外汇的财政现实很少是情节的关键转折点。读者只需受并假设旅行者口袋里的硬币要么是法定货币，要么是由一眼就能识别的贵金属制成的，而银河信用在任何地方都被毫无疑问地接受。是否存在一个被夸大的星际银行，为触手生物和毛皮生物发行通用货币的纸币和硬币？还是想象一种数字、去中心化的货币更具吸引力？在银河英雄在名声不佳的酒吧徘徊的多年里，研究人员和密码学家一直朝着这一愿景努力。\n\
  \n为什么实现它如此困难？创建去中心化货币的经典挑战在于防止双重花费、资金及参与方的安全性，以及拥有交易已发生的可靠证明。这些是紧密相关的。让我们观察两个人之间简单的资金移动。如果一个人有一张美元并将其递给朋友，原始持有者就无法再花费这笔钱。物理转移已经发生。反之，如果持有者直接从银行账户进行转账或支付，中心化银行系统会在账本的一个部分做一个条目，指示资金已从原始持有者的账户中取出，同时一个相等且相反的条目扣除收款账户的余额。每家参与银行持有的数据库显示交易已经发生，资金所有权已发生变化。\n\
  \n我们接受在交换时无法复制物理纸币：当然，我们一直在与现实世界流行的伪造钞票和硬币进行持续斗争，但我们在这里关注的是感知价值的交换是否已经发生。我们信任资金的数字转账是因为它受到银行检查和平衡的约束，我们可以在银行对单上验证交易。然而，如果我们想使用一种不属于传统银行系统且没有物理形式的货币进行交易，如何可能确认交易已正确完成呢？我们能确定该价值物品真的已经从第一个账户移动到另一个账户吗？毕竟，它不是物理纸币。数字货币必须是中性的、抗审查的且安全的。`Bitcoin`是第一个面对这些挑战的，但这段旅程很长。\n\
  \n### 密码学引领道路\n\n数字现金的概念和运作最早由 `David Chaum` 在 1982 年于`加伯利大学`（UC Berkeley）攻读计算机科学博士学位时提出。他的论文标题^(1)“由相互怀疑的小组建立、维护和信任的计算机系统”立即引发了现代账本那种无需信任的多方结构。他在一篇写得非常好且易读的论文中解释道，加密技术将允许保护任何性质和规模的数据，而只需要保护单一加密机制。这种“保护”与“安全”之间的区别是重要的。Chaum\
  \ 将受保护元素称为保险库：我们现在将其称为我们链中的一个区块，持有着`Merkle root`。此外，他注意到，加密数据的多个副本不会损害安全性，反而会增强生存能力。区块链的基本概念都在这里，但我们离最终的解决方案还有很长的距离。\n\
  \n在一种用于不可追踪支付的盲签名的现代提案中，^(2) `Chaum` 进一步处理了交易信息的机密性、支付证明、交易双方验证以及对任何被盗支付介质的保护（我们在这里指的是信用卡，这在当时并不常见）。他定义了加密安全盲签名系统的功能、协议、属性和可审计性。在随后的几年里，他发表了多篇探索虚拟货币数学基础的论文，并在\
  \ 1989 年创立了`DigiCash`。它被认为是世界上第一个电子货币系统，其`Cyberbucks` 使用`Blind Signature`方法（现在通称为`Chaumian\
  \ blinding`）在用户之间移动，且资金的保护符合所有`Chaum 的密码学原则`。这种数字货币在当时是领先的，它与初期的世界维网同时发布，远在互联网成为消费工具之前就已经出现了。当时，全球银行和`微软`之类的机构对中心化数字货币有极大兴趣，正如这篇\
  \ 1994 年的《连线》文章所解释的那样.^(3)“数字时代的下一次伟大飞跃，从字面上来说将击中你的钱包。”中心化银行掌握了这一概念，以至于我们大多数法货币交易现在都是轻松的数字交易，但\
  \ `DigiCash` 本身消失了。\n\n\n\n\nDavid Chaum 依然活跃在密码学领域：他创立了国际密码学研究协会、阿姆斯特丹数学与计算机科学中心的密码学小组、投票系统研究所以及\
  \ Perspectiva 基金。他还在致力于开发一种新的加密货币结构 Elixxir，重新审了他最初的盲支付（Blind Payment）原则。\n\n# 密码朋克与\
  \ B-money\n\n20 世纪 90 年代见证了密码朋客（Cypherpunk）运动的兴起。Timothy C. May 在 1988 年写了《密码无政府主义宣言》^(4)，这对随后由密码学和互联网的发展所实现的“社会和经济革命”是一个诡异的预言。随着人们对国家控制强加密的担忧日益增加，一个社区从密码朋客的邮件列表中诞生了。在美国，得益于加密在战保障通信中的关键作用，加密被归类为军火。随着个人电脑的出现，这项技术变成了商业上的必需品，但政府的限制意味着出口软件只能使用\
  \ 40 位加密来保护其用户许可，而普通用户在几天内就能破解这种加密。密码朋克运动反抗了国家安全局（NSA）压制研究和分类专利的尝试，并成功地将强加密引入公共领域。这场战斗在斯蒂芬·列维（Stephen\
  \ Levy）2001 年的书籍 `Crypto: How the Code Rebels Beat the Government Saving Privacy\
  \ in the Digital Age`^(5)中有详尽记录。\n\n在 May 于 1992 年发给小组的邮件中^(6)，他为新读者转载了原始宣言，他的签名包含了当时很晦涩但今天我们很熟悉的词汇标签：加密、数字货币、匿名网络、数字假名、零知识、声誉、信息市场、黑市——以及在无政府主义愿景中预见的、由于采用了这些技术和行为将导致的政府崩溃。有趣的是，通过\
  \ WikiLeaks 泄露的丑闻也产生了类似的去动性影响：WikiLeaks 创始人朱利安·阿桑格（Julian Assange）也是该小组的成员，他还是《密码朋克：自由与互联网的未来》^(7)一书的作者。\n\
  \n密码朋克社区在整个十年中不断成长，并对我们今天所知的加密货币的发展产生了重大影响。该小组不仅有极高质量的技术讨论，还有每个社区都会出现的社交礼仪、分心话题和吐槽。第一位比特币交易的接收者哈尔·芬尼（Hal\
  \ Finney）就是其中的参与者，而 `Satoshi Nakamoto` 匿名背后的那个人或几个人极可能也是密码朋克。\n\n另一位密码朋克社区成员、计算机工程师戴卫（Wei\
  \ Dai）在 1998 年发表了一篇文章，反思了如果集权政府变得过时，需要“一种交换媒介（货币）和一种执行合同的方法”^(8)。他建议了使用分布式账本进行资金转账的解决方案；创建数字“b-money”；以及一个执行合同的过程。戴卫建议透明交易应该向整个网络公布以避免重复。他描述了通过挖矿过程铸造新币，并定义了智能合约的需求和可能的结构。这些都是一些关键的缺失部分。\n\
  \n在此期间，互联网蒸蒸日上。诸如 `Napster` (1999) `PayPal` (2001) 等平台展示了原生现金。这是通往去中心化长路上迈出第一步后的二十五年。\n\
  \n# 中本聪 vs. 银行体系\n\n人们说需要是发明之母，而是一场大灾难之母触发了第一种加密货币——比特币的诞生。\n\n2007 年 8 月 9 日，法国巴黎兴银行（BNP\
  \ Paribas）冻结了其三笔资金，显示其无法对担保债务凭证（`CDOs`）即次级贷款包进行定价。涉及的债务根据其违约风险水平被单独分类，但随后作为集体资产打包在一起，像牌牌一样被交易、洗牌、切割，并在全球银行生态系统中进行买卖。每笔交易都进一步模糊了债务的性质，直到人们发现对这些包给出一个可靠的价值是不可能的。银行在估值基础上建立的城堡并非岩石，而是沙子。仅仅五周后，专门从事高贷款价值比抵押贷款的英国银行北方岩（Northern\
  \ Rock）发现自己无法向市场抛售次级贷款包。它向英国政府寻求支持的要求引发了银行挤兑，储户在每个分行外排起长队提取现金。这是随后激烈 18 个月中的首个引起关注的牺牲。一年后，美国政府救援了抵押贷款贷款人房美美（Fannie\
  \ Mae）和房利美麦（Freddie Mac），但莱曼兄弟（Lehman Brothers）、华盛银行（Washington Mutual）和威信申请了破产。冰岛三大最大的商业银行倒闭，带走了海外客户的储蓄。《卫报》的经济编辑拉里·埃利奥特（Larry\
  \ Elliott）事后评价道：^(9)“从金融市场而言，2007 年 8 月 9 日具有 1914 年 8 月 4 日的所有共鸣。它标志着‘爱德华时代夏天’的繁荣与与与信贷紧缩的壕战之间的分水点——失败的银行、僵化的市场、以及因信贷短缺而崩塌的房产市场。”这场崩溃暴露了集权化机构实践中的高水平风险，以及我们对银行的错误信任，它们在没有任何透明度的情况下随意玩弄我们的资金。2008\
  \ 年 10 月 31 日，一篇论文以 `Satoshi Nakamoto` 的名义发表，题为《比特币：点对点电子现金系统》。\n\n## 优雅的解决方案\n\n\
  \n\n\n\n比特币的出现是一个分水岭时刻。中本聪（Satoshi Nakamoto）的区块链概念证明通过最终建立一种运行的去中心化防双花费机制，实现了一个延续数十年的愿景。拼图完成了，其中一个关键要素——正如尼克·萨博（Nick\
  \ Szabo）在 2005 年的一篇论文中提出的“比特金”（BitGold）概念最初建议的那样，^(11)——是每笔交易的时间戳。其逻辑在于，如果尝试处理多个相同的交易（无论是故意还是无意），只有第一个标记时间戳的交易会成功并写入账本。\n\
  \n支撑比特币的区块链结构确保了交易的安全性和透明度，并在每个区块创建时包含硬币的铸造和发行。加密学家和密码朋克者（Cypherpunks）工作中的某些（但不是全部）概念出现在比特币解决方案中。戴卫（Wei\
  \ Dai）关于交易应向网络公告以实现完全透明的建议被采纳了。点点网络确保了记录准确性的分布式责任。区块链是一个分布式账本，多个节点持有副本，确保没有单一实体可以控制记录或单方面确认所记录交易的合法性。每个区块中保护的数据是梅克尔树根，反映了查姆（Chaum）的保险库，尽管这在比特币白皮书中并未提及。数字签名是解决方案不可或缺的一部分，但在这种情况下不是盲签名。这意味着比特币区块链是伪匿的（用户可以追溯到现实世界），而不是匿名的。\n\
  \n当每个区块关闭且新区块开启时，铸造奖励和交易费用会支付给区块链节点（加密货币矿工）。这是维护系统的激励，而不是为了欺骗它。这种加密经济机制对于比特币的正常运行至关重要：它确保价值源于资源的稀缺性，而不是由稀缺的物理资产或商品支撑。正如白皮书解释的那样，“新币数量的恒定增加类似于金矿消耗资源向流通中增加黄金。在我们的案例，消耗的是\
  \ CPU 时间和电力。”当比特币区块链被编码时，它包含了 2100 万个比特币的储备，奖励从中提取。早期矿工声称每次验证获得 50 个比特币，但奖励每隔 210,000\
  \ 个区块减半。由于比特币区块被设定为每十分钟创建一次（尽管这一间隔在实践中会有变化），这意味着减半大约每四年发生一次。为了在奖励下降时维持激励，随着交易量的增加，矿工的收益将通过增加交易费来平衡。2020\
  \ 年的第三次减半使流通中的代币降至 18,375,000 BTC，尽管许多硬币已经由于钱包和硬盘的无意丢失而消失在虚拟沙发背后的。得益于这种奖励递减的系统，剩余近三万个硬币还需要多年才能分配完毕。\n\
  \n创建的 2100 万个币无法被复制或增加，这使得比特币能够作为价值存储媒介。比特币是加密货币领域一种真正的稀缺商品，当我们看到其他货币在独立的区块链平台上出现时，很明显，每种货币都有其独立的功能。比特币是新一类数字资产的储备货币，现在经常在货币表中与美元和日元并列。比特币可能比法币更接近备受推崇的金本：在数字货币世界中不存在量化宽松。\n\
  \n比特币并非一种人为货币，中本聪确保了比特币能够长期真实维持。比特币社区有着持续的开发和维护，虽然这种货币确实已经演变，但它已经可靠地运行了十多年。\n\n\
  双方之间的第一笔比特币转移发生在 2009 年 1 月 12 日，由中本聪发送给哈尔·芬尼（Hal Finney）。这几乎是社区听到的关于伪匿名创造者的最后消息，而那个包含早期开采比特币的钱包至今未被触动。\n\
  \n## 名声与匿名\n\n### 谁是中本聪？\n\n关于比特币创造者的身份存在大量的推测。^(12)白皮书的措辞似乎表明“中本聪”不仅仅是一个人，而且密码朋克运动在构建解决方案中的影响表明，这些人中至少有一个人是密码朋克邮件列表的成员。人们为解决这个谜团付出了巨大努力，但候选人名单上的大多数名字都坚决否认参与其中。有间接证据表明中本聪居住在英国或西欧。论文本身的语言比起美式英语更像英式或英联邦英语，分析人员确定，该用户在格林治时间午夜到凌晨\
  \ 6 点之间没有向密码朋克社区发布过帖子。此外，在第一个开采的比特币区块的时间戳代码中隐藏的一条奇特信息是：“泰晤报，2009 年 1 月 3 日首相正处于第二次救援银行的边缘”，它显示了英制日期格式并引用了这家伦敦报纸。^(([13)\n\
  \n哈尔·芬尼作为第一笔比特币转的接收者，不太可能是候选人，除非这是一个故意给自己汇钱的狡猾手段。名字恰当的多里安·普伦西·萨托希·中本聪（Dorian Prentice\
  \ Satoshi Nakamoto）被一些媒体机构视为可能的作者，尽管他住在加利福尼亚州离哈尔·芬尼只有几个街之遥，但没有任何证据能将他与芬尼或比特币项目联系起来。\n\
  \n另一个大可能是尼克·萨博，他曾在 DigiCash 与大卫·查姆（David Chaum）一起工作，并在比特币白皮书发布三年前的 2005 年，写过一个非常相似的概念——`BitGold`。同样，尽管两者之间存在相似性的间接证据，但他否认了任何参与行为。\n\
  \n在爱沙尼亚，加密学家阿托·布尔达斯（Ahto Buldas）、马特·萨雷佩拉（Märt Saarepera）和迈克·高尔特（Mike Gault）在 2007\
  \ 年研究数字身份时探索了相同的数字签名、哈希和时间戳系统。他们工作的时间与比特币解决方案的相似性吸引了推测，但他们并没有关注，并像萨博一样否认了任何参与。\n\
  \n相比之下，澳大利亚的克雷格·莱特博士（Craig Wright）在比特币极早期与已故的大卫·克莱曼（David Kleiman）合作，他已自荐为中本聪王座的竞争者。然而，克莱曼或莱特是否参与了白皮书的编写和初始代码的开发尚不清楚。一个有趣的转折是，莱特在\
  \ 2019 年 5 月申请并获得了比特币白皮书和比特币代码的美国版权，声称在该著名的伪匿名名下拥有署权。正如版权局在这些注册后的新闻稿中所解释的那样，^(14)它并不调查申请人与伪匿名作者之间是否存在可证明的联系，仅依赖申请人的陈述。2019\
  \ 年夏天的一系列复杂的诉讼（涉及与克莱曼遗产的纠纷，以及独立地对声称莱特不是中本聪的人采取诉讼）也未能挖掘出任何支持莱特编写该论文的证据。^(15)\n\n\n\
  \n\n\n由于任何可能的候选人都没有在公开领域提供不可反驳的身份证明（访问中本钱包是最具说服力的证据），加密社区对于中本·聪聪（Satoshi Nakamoto）背后的真实身份仍存在分歧。这是一件坏事吗？除了满足人类人类的好奇心外，大多数评论者认为，中本的身份保持未知完全符合密码朋克（Cypherpunks）精神和加密无政府主义运动。通过隐入背景且不提供领军人物，比特币的创建者（们）确保了该解决方案保持了真正的去中心化。\n\
  \n## 在比特币之上\n\n你可以在区块中记录什么类型的交易？比特币本身运行在一种三式记账模式的基础上，其中发送和接收付款的双重记账由第三笔条目确认：来自网络的一份经过数字签名、加密密封的收据。比特币区块链上的每笔交易都是使用一种名为\
  \ `UTXO`（或“未花费交易输出”）的模型进行处理的。使用公钥和私钥访问你的“钱包”，实际上是解锁与你关联的硬币的过程。如果丢失了密钥，你就无法打开锁。在发起付款时，你正在解锁一个\
  \ `UTXO` 并告诉网络从可用总额中扣除你指定的金额。换句话说，余额（即未花费的金额）由网络作为新的 `UTXO` 发回给你，并在下次交易时被解锁。这听起来很复杂，但用户的钱包实际上是一个与用户关联的\
  \ `UTXO` 记录列表，通过总和得出账户余额。比特币区块链上的每个全节点都持有所有未花费比特币交易的副本。\n\n为什么分布式账本方法应该仅限于金融交易呢？将加密货币交易以外的其他流程去中心化的想法迅速吸引了开发者和企业的想象力。如果你可以在日常银行服务中省略中间人，还有哪些机构可以变得不再必要？`UTXO`\
  \ 对于除相同数字资产交换之外的其实并不是一种实用的方法论：在比特币区块链之上编写第二层协议的想法归功于 J. R. Willett，他在 2012 年发表了《第二份比特币白皮书》。对于该行业的未来至关重要的是，他还建议从加密社区内部募集开发资金来实现此目标。原始文档已无法访问，但在\
  \ 2013 年圣何塞比特币会议上，Willett 向他的小组小组观众解释了这个想法。^(16) Laura Shin 在 2017 年为《福布斯》写作时描述了这一突破。^^(17)\
  \ “他构思了在比特币之上的类似于合同的东西，”她解释道，“就像电子邮件分层在 TCP/IP 之上一样，但他想知道如何为开发支付费用。[他意识到]他可以在比特币之上发行一种币，如果买家发送比特币来资助其开发，他们就能自动拥有这种币。”\n\
  \nWillett 成功地通过被称为初始代币发行（ICO）的方式为他的 Mastercoin 项目筹得了资金，但该项目并未在比特币上启动。比特币区块链是一个强健的生物，到此时，它经过反复测试的结构已被其他区块链复制并完善，包括去中心化域名注册数据库\
  \ Namecoin（2010）、莱特币（Litecoin，比特币黄金的银，2011）以及持久且深受喜爱的幽默货币狗狗币（Dogecoin，2013）。然而，它还不能满足企业的需求。需要更具定制化的方案来处理额外的协议层和复杂的多阶段智能合约。\n\
  \n## 以太坊与虚拟机\n\n2013 年 12 月，维塔既·布特林（Vitalik Buterin）发布了一名为《以太坊：终极智能合约和去中心化应用平台》的白皮书。以太坊软件本身是开源的，因此白皮书是\
  \ `GitHub` 上不断演变的文档，^(18)，但原始^(19)可以通过在线存档访问。以太坊是第一个为分布式计算定制的区块链基础设施，也就是说能够在基础加密货币层之上持有多个协议。布特林关于智能合约运行自主规则管理任何数字资产移动的愿景远超比特币，尽管以太坊依赖比特币的“可信的去中心化”，特别是针对先到得交易的时间标记，但它将区块时间从\
  \ 10 分钟显著缩短到大约 15 秒。\n\n以太坊虚拟机（`EVM`）允许代码在单个节点内运行，这是分布式应用（dApps）开发领域的一项重大创新。布特林还建议向“去中心化自治组织（DAOs）进行逻辑扩展——即包含资产并编码整个组织章程的长期智能合约”。以太坊的启动本身部分通过\
  \ ICO 资助，通过出售其原生货币 `Ether`（`ETH`）筹集了约相当于 1800 万美元的开发资金。这为数百个想法打开了大门，创业者认为或错认为这些想法将受益于区块链的独特属性。\n\
  \n以太坊的潜在应用有哪些？创始人维塔既·布特林在 2019 年 4 月在 Twitter 上回复埃隆·马斯克（Elon Musk）的查询列出了他的首选。该线程包括：\n\
  \n*   一个全球可访问的金融系统，包括支付、价值存储，以及更先进的内容，如保险；身份：“使用 Facebook 登录” -> “使用以太坊账户登录，无需中间商”。还有信任网……\n\
  *   各种注册表都应该发布在链上以确保安全和易于验证；尝试新形式的人类组织结构；通过支付通道进行各种微支付用例；用于隐私机器学习的个人数据市场（你付给我 `X`，我让你在我的数据上同态执行函数\
  \ `Y`，该数据已通过 `Z` 证实……）；\n*   用于社交网络防止垃圾信息的加密经济学；内容创作 DAO 的预测市场；奖励内容发布者的加密经济学/微支付方案；新市场设计的测试场，例如频繁批量拍卖、组合拍卖、自动做市者；\n\
  *   “用于网络连接的点对点（p2p）市场 / 激励网状网络；针对资源稀少的人的身份、声誉和信用系统（例如难民）；去中心化 DNS 替代方案，例如以太坊域名服务。”\n\
  \n这些应用中的一些已经实现，将在本书后半部分进行详细讨论。另一些虽然遥不可及，但在区块链开发的地平线上清晰可见。\n\n## 并不智能的合约与警示故事\n\n\
  \n\n\n\n去中心化合约是戴文（Wei Dai）对 b-money 建议的第三个特性。虽然资产从 `A` 转移到 `B` 相对直接，但更广泛世界中的交易可能要复杂得多。当然，区块链并不是第一个编码业务规则的软件，但区块链应用中管理此类复杂交易的需求促使了智能合约的诞生。对于一段代码来说，这是一个非常糟糕的名字，因为它既不是合同，也不特别智能，还给初学者带来了各种困惑。甚至维塔利克·布特林（Vitalik\
  \ Buterin）在 2018 年也表示，他希望自己当初给它们起一个完全不同的名字。然而，它们最终还是被称为智能合约。\n\n以太坊协议为特征的智能合约，是列在账本代码中的交易规则。这里并没有形成法律意义上的合同（尽管代码可能反映了具有约束力的合同条件），也不涉及任何学习或完善。我们这些“并不智能”的智能合约与其说是机器，不如与机器人自动化（`RPA`）更相似；它们是针对相互猜疑群的\
  \ `RPA`。\n\n这些链代码片段非常清晰地定义了要执行的重复过程。基于账户余额而非 `UTXO` 模型的加密货币移动是一个起点，确保了从一个钱包到另一个钱包的转移能够顺利运行，无需任何中心干预。支付交易相当简单：首先，检查细节：源钱包中的余额是否足够进行转账？是否发往有效地址？适当的交易费用是多少？然后插入相关变量（此处为发送者钱包地址、目的地钱包地址、发送金额和应付费用），生成的交易读取为“从钱包\
  \ a 向钱包 b 发送 x 个币，并从钱包 a 发送交易费用 y 到矿工区块奖励池 c”。该语句被哈希（`hashed`）以包含在下一个可用区块中，同时交易开始执行并写入账本。如果将来你对这笔完全相同的交易的记录与不可篡改的记录进行比对，哈希字符串将彼此匹配，你就可以验证其真实性以及你自己的账本的准确性。\n\
  \n智能合约使得交易可以在不与处理器建立关系的情况下完成。例如，你不再信任你的银行来处理支付，而是依靠你所选加密货币区块链上的智能合约来执行代币转移。\n\n\
  让我们思考现实世界中发生的交易类型。在供应链中，供应商开具的发票必须在客户的账本中记录为债务，但在满足某些条件之前不会进行结算。智能合约可以用于安排链上相互猜疑群体之间的不同授权元素，例如收货和质量认证确认，然后再执行从客户到供应商的资金转账。这与机器人自动化的相似性显而易见。智能合约仅仅是去中心化系统中的自动化过程。另一个经常被提到的潜在智能合约应用例子是出院证明，它会触发后续预约的创建。这通过分布式账本无疑是可能的，但由于此类交易的所有方都是已知且可信的，那么中心化系统内的自动化是一个更合适的解决方案。\n\
  \n智能合约的意义在于它们能够消除任何交易的中间环节。通过移除中心机构的角色，双方可以直接进行交易，甚至使用平台的原生货币结算他们的承诺。然而，对去中间化保持谨慎态度有充分理由。如果没有中心机构，一旦出现问题就无处可寻。如果没有中心权威，一旦发生纠纷就无人可以申诉。这就是去中间化的风险。\n\
  \n### Gas 的价格\n\n加密猫（Cryptokitties）作为首个备受关注的区块链游戏，是一组智能合约管理数字资产交易的绝佳示例（而且猫咪很可爱）。猫的买卖是简单的交易，而繁育猫则涉及更复杂的规则，需要考虑父母的遗传特征并确定后代的最终组成。该游戏在加密社区一走红，以至于对以太坊区块链的运行造成了巨大的压力。在此过程中，它不仅测试了网络的健性和可扩展性，暴露了导致更多创新的担忧），还让用户意识到了智能合约背后的交易成本。\n\
  \n公共区块链上的每一份智能合约都伴随着成本。这是工作量证明（`Proof of Work`）共识机制的内在部分：必须给矿工提供奖励，使维护区块链变得值得。这种奖励由从储备中发行的代币以及执行每笔交易的费用组成。以太坊区块链上的交易费用取决于智能合约中的函数和\
  \ `gas` 的价格。`Gas` 是衡量特定函数执行所需工作量的单位；它因其作为驱动智能合约运行的“加密燃料”的角色而命名。每个函数都有一个以 `gas` 单位表示的费用，这些列在以太坊白皮书的附录\
  \ G 中。例如，计算单个加密哈希（`hash`）需要 `30` 个 `gas` 单位；用于寻找两个整数之和的 `ADD` 函数需要 `3` 个 `gas` 单位；智能合约中的\
  \ `COPY` 操作按字收取 `3` 个 `gas` 单位。这些费用会累积。一笔使用 `ETH` 的支付（将资产从一个钱包移动到另一个钱包）总共将花费转移者\
  \ `21,000` 个 `gas` 单位。当开发者编写智能合约时，有一个新的考量：代码的 `gas` 效率如何？是否已为用户交易价格降至最低？\n\n\n\n\
  \n\nGas 价格，换句话说就是每单位 gas 需要支付的 ETH 数量，根据处理的交易量而变化。它以 ETH 的小单位 Gwei 形式表示（`10^(\\\
  -9)` ETH）。每单位 gas 的典型价格可能是 20 Gwei，或 `0.00000002` ETH。在 Cryptokitties 狂热时期，gas 价格也随之高涨。当时，使用\
  \ `Metamask`（允许玩家访问 Cryptokitties 和其他游戏的知名用户界面）需要了解 gas 规则。用户被要求输入他们愿意为 gas 支付的金额，系统会提供一系列建议值范围。这既是采用的障碍，也是一个学习的机会，但较新版本的\
  \ `Metamask` 和新的钱包界面（如 `Dapper`）通过自动选择 gas 价格，或者在 `Dapper` 的情况下完全吸收费用，降低了用户的复杂性。\n\
  \n供需关系意味着，在过度饱和的网络中，只有那些为 gas 高出价的用户交易才能通过验证，但关重要的是，无论交易是否成功，都会产生费用，因为处理过程始终进行。我曾尝试以过低的\
  \ gas 价格培育 Cryptokitties，结果花费了少部分 ETH 却一无所获。这是一次微不足道的损失，但你不希望你的用户或投资者经历这种事。\n\n\
  ## 犯错误的代价\n\n迄为止最臭名昭著的交易费用灾难发生在 2017 年 10 月 `AirSwap` ICO 期间，一位过度热衷的投资者遭遇了智能合约错误。该投资者试图购买价值\
  \ `1,700` ETH 的代币，将交易 gas 价格设置得极其离谱，达到每单位 gas `400,000` Gwei（`0.0004` ETH），可能是为了确保他们的交易在验证具有最高优先级。不幸的是，智能合约在销售窗口设置上存在漏洞。交易到达网络时，合约无法将代币转移给买家，导致错误自动导致尝试的购买失效。投资的\
  \ ETH 未被转移，但被收取了近 `237` ETH 的交易费用，这在当时相当于超过 `$70,000` 美。在正常 gas 价格下，这 `592,379`\
  \ 单位 gas 应该为转账者花费约 `$3.50` 美。\n\n这个教训应该提醒开发者在发布时万无一失，但智能合约开发问题仍然存在。这些不仅涉及正确构建合约的关注，还涉及确保它们在网络威胁面前保持安全。区块链和智能合约安全专家\
  \ `Hosho Group` 的联合创始人 Hartej Sawhney 为我清晰地描勒了目前的局面。\n\n“行业中编写的智能合约质量正在缓慢但坚定地提高，”他说道。在\
  \ 2017 年和 2018 年，在智能合约内部发现“无限生成代币”等严重漏洞并不常见。当时，许多公司会自豪地复制和粘贴其他公司智能合约的大段代码，并祈代码能够编译并实现它们预期的功能。\n\
  \n`InfoSec` 领域的人才一直缺乏学习 `Solidity` 等区块链语言并在该领域提供安全服务的动力。在美国金融行业中常见的标准安全惯例对区块链行业将大有益处。大多数公司缺乏确保安全置于首要位置[以及]进行定期渗透测试和审计的专业性。\n\
  \n这是一个现实的关注点，对于像 `Hosho` 这样的公司来说也是一个机会。开发者有伦理责任协作并相互支持，在整个区块链应用程序部署有效且安全的智能合约，而业务领袖必须意识到保护用户和业务本身必须维护的标准。\n\
  \n## 攻击、分叉与内斗\n\n加密货币并非没有争议。原始比特币区块链代码根据开源许可发布以供所有人使用，多年来产生了许多克隆版本和竞争者。虽然模仿可能是最诚诚的赞美形式，但一些新货币的历史则更加阴暗，其根源在于错误、攻击和激进的意见分歧。对公共区块链代码进行更改是正常的。开源社区负责维护和更新链，随着对交易记录的需求增长和相关技术的改进，不断提高安全性、速度和容量。当社区通过共识达成了某项更改时，这将导致相关区块链的分叉（fork），在向前推进之前暂停活动并实施新代码，希望更加高效，但从本质上讲保持不变。如果新代码与现有代码后兼容，则导致软分叉（soft\
  \ fork）。在旧代码具有破坏性的情况下，我们就会硬分叉（hard fork）。\n\n### 改变方向：比特币现金\n\n2017 年，比特币开发者花费了大量时间解决原始协议的缺陷，这些缺陷是在近十年的技术进步中暴露出来的。随着链变得越来越长，每个\
  \ `1 Mb` 块中记录的交易吞吐量变慢，导致了挫败感并增加了成本。社区提出了几种解决方案，旨在减少记录的数据和或增加区块的大小。名为 `SegWit` 的提案更改了区块确认的处理顺序，分离交易元素以减少记录的数据量，从而加速处理。隔离见证的第二阶段（`SegWit2x`）旨在将区块大小从\
  \ `1 Mb` 增加到 `8 Mb`。最终，比特币区块链仅通过软分叉采纳了 `SegWit` 的第一阶段。大多数社区放弃了创建更大区块的硬分叉，但少数反对者决定继续进行并创建一个比特币区块链的新分叉，称为\
  \ `Bitcoin Cash`（比特币现金）。它于 `2017` 年 8 月 1 日诞生。其他为了创建具有不同挖矿结构的货币的分叉，特别是 `Bitcoin\
  \ Gold`（比特币黄金）和 `Bitcoin Diamond`（比特币钻石），也发生在 `2017` 年。\n\n比特币现金的故事并未止于此。新货币获得了关注，而核心比特币区块链继续其\
  \ `1 Mb` 块的方式运行。比特币现金被广泛宣传为比特币本应有的加密货币，并制定了其开发路线图。然而，一年后，比特币现金的两个关键开发者 `Roger Ver`\
  \ 和 `Craig Wright` 对货币所采取的方向产生了分歧。比特币现金在 `2018` 年 11 月进行了计划中的软分叉，在 `Ver` 的领导下推进了路线图。`Wright`\
  \ 和他的团队选择了不同的路径并进行了硬分叉创建一个新链，他们声称这恢复了 `2009` 年的原始比特币协议，即 `Bitcoin Cash: Satoshi’s\
  \ Vision`（比特币现金：中本的愿景）。\n\n感到困惑吗？这是正常的。比特币开发者在追求完美的点对点电子现金系统时产生的哲学分歧可能会困扰我们多年。\n\
  \n## 计算机说是：DAO\n\n（此处为后续待翻译内容）\n\n\n\n\n以太坊不像像比特币那样容易发生内斗，这可能是因为其开发者社区包含了创始人 Vitalik\
  \ Buterin，而不是像比特币那样被关于中本身份的投机活动所分散了注意力。这并不意味着不会发生争议性的分叉，而以太坊区块链的分叉以创建第二种货币——以太坊经典（Ethereum\
  \ Classic），是在针对名为 `The DAO` 的应用程序遭受攻击后发生的。2016 年 6 月的这次黑客攻击是所有智能合约灾难的根源。\n\n在他 2013\
  \ 年的原始白书中，Vitalik Buterin 在提到智能合约时指出：“[[the]逻辑扩展……是去中心化自治组织（DAOs）——包含资产并编码了整个组织章程的长期智能合约。”2016\
  \ 年，一个开发者团队启动了 `The DAO`，这是一个以投资者为导向的风险投资基金，其结构是 Buterin 原始想法的实现。投资者投入的资金将自动分配给系统选择并经共识批准的风险项目，收益将在成员之间共享，所有交易都由智能合约治理，不受人类（中心化）之手的干预。一次成功的\
  \ ICO 启动了，团队坐在一旁看着来自 18,000 多名投资者的资金流入。遗憾的是，管理合适项目批准和投资资金分配的智能合约存在底层缺陷。一名黑客成功操纵了合约，将约\
  \ 5000 万美元（总额的三分之一）的资金发送到了自己那里。震惊的 DAO 团队只能眼睁睁看着自己的智能合约为黑客仔细执行了不可篡改的交易，资金直接再次流出。他们无法阻止代码运行，且交易是不可逆转的。\n\
  \n在这种情况下，以太坊社区在争议中达成了共识，将区块链回滚到 ICO 之前的点。随后，以太坊分布式账本上的后续条目失效，下一个处理的交易被记录在一个新的区块中，该区块将其前驱区块引用为攻击之前的区块。并非所有社区成员对这一行动感到满意。改变已经发生的事情违背了不可篡改原则。持有不同意见的少数派没有实施分叉，从而创建了第二个区块链——以太坊经典：这条链仍然包含\
  \ DAO 交易。\n\n整个 DAO 事件是美国证券交易委员会（SEC）的压死骆驼。他们对黑客攻击的报告认定，出售的代币是 1933 年证券法案下的证券，因此应据此进行监管。这启动了对\
  \ ICO 行为进行严格监管和保护投资者的开发进程，并可能减慢了美国的区块链创新，因为创业者开始寻求更具同情的管辖区来进行 ICO 融资。\n\n## 扩展到企业的挑战\n\
  \n区块链的底层技术很快引起了企业的关注，显而易见，分布式账本技术在多个行业领域具有良好的应用潜力。然而，加密货币的波动性、现有区块链的公开性，以及在 `The\
  \ DAO` 事件之后 SEC 向证券监管的转变，对于商业敏感技术的发展来说并不是理想环境。企业需要某种方法来利用区块链。例如，从无信任的商业网络（如在供应链背景下）中获得的回报可能是减少原材料在经过多次加工处理或产品跨国流动时重复检查的行政负担，或者通过不可篡改的记录提供符合监管要求的合验证证明。这种功能可以通过构建在以太坊之上的应用程序来实现，但区块链的特征——透明性并非总是受到企业的欢迎。一个相互猜疑的组织网络如何让其分布式账本脱离公共领域，从而保护商业敏感信息呢？\n\
  \n## 许可链区块链\n\n为了解决隐私和验证问题，分布式账本技术的变体出现了：许可链区块链。这些链旨在复制区块链作为透明、不可篡改记录的所有优点，但消除了用户匿名性和交易及智能合约的公开查看，这些是公共区块链的特征。许可链将参与限制在拥有访问账本数据凭据的方。这些权限在平台内部可以是细粒度的，允许某些方提交交易，而另一些方根据知情原则查看整个记录的有限部分。本书后后的许多案例研究都涉及许可系统。\n\
  \n可以创建一个私有的以太坊区块链。这些通常被用作最终将进入公共领域的应用程序的测试环境，但也有一些大规模运行的显著私有以太坊创新。这包括世界粮食计划的 Building\
  \ Blocks 项目，它使用了由 Parity Technologies 开发的以太坊版本。\n\n## Hyperledger 项目\n\nHyperledger\
  \ 项目推动了许可框架的进展。它始于 Linux Foundation 开源社区与包括 IBM、日立、英特、Soramitsu 和华为在内的商业巨头之间的合作，2019\
  \ 年微软、Salesforce 和 Consensys 加入了该财团。Hyperledger 日益增长的开源工具包包含几个具有特定用例的框架和许多辅助软件模块。迄为止发布的框架包括：Iroha（与日立合作）用于基础设施项目；Sawtooth\
  \ Lake（与英特尔合作）用于供应链和溯源，特别是使用传感器作为主录数据源；Fabric（IBM Blockchain 平台的基础）用于具有私有和商业敏感交易通道的供应链；以及\
  \ Indy（与 Sovrin 基金会合作），专为分布式身份而构建。\n\n## 分布式账本框架\n\n特定行业的需求催生了若干分布式账本框架，它们偏离了传统的区块链结构。这些包括通常在金融服务中被采用的\
  \ `R3 Corda` 框架。在这里我们也可以包括 `IOTA` 的 `Tangle`，它旨在处理不断扩大的物联网格局以及专业的跨境支付系统，如 `Ripple`\
  \ 和 `Stellar Lumens`，尽管这些与其他许可系统的不同之处在于它们使用了原生加密货币。\n\n## 无需代币即可达成共识\n\n\n\n\n允许许可的分布式账本（如\
  \ Hyperledger 或 Corda）继承了比特币和以太坊的高度有效且稳定的交易先到先得时间戳机制，以及创建智能合约来管理业务流程的能力，但它们不包含加密货币元素。从基础和实践层面来看，私有分布式账本如何在没有工作量证明（Proof\
  \ of Work）系统、没有支付给矿工维护区块链并作为随机化确认机制的原生加密货币的情况下，作为一个受信任的记录存储库来运行呢？如果参与者计算关闭一个区块并开启一个新区块所需的\
  \ `nonce` 值没有金钱激励，如何保证区块链及其内部存储记录的完整性？让我们详细地查看区块链内部的加密经济学以及维护账本完整性的机制。\n\n# 共识机制与加密经济学\n\
  \n研究新型证明（Proofs）或共识机制的发展，不仅对于没有加密货币的分布式账本的运行至关重要，对于未来区块链的广泛应用也同样。随着人们对维护这些去中心化网络所部署的所有算力对环境的影响担忧日益增加，需要调查所有可能的途径。环境和可持续性方面将在第\
  \ 7 章中进行更详细的介绍；目前，让我们回顾共识机制的操作以及它们在公共区块链和许可区块链中实现的不同方式。\n\n包含在区块中的交易细节被递归哈希为单个字母和数字字符串，即所有数据的梅克尔树根（Merkle\
  \ Tree root）。该字符串位于区块链末端的子区块中，并带有上一个区块的引用。关闭区块并开启下一个区块是一项基本操作，为了链的完整性，这种操作不能中心化或交给特定节点，而必须足够稳健，以确保链上的节点能够一致（即达成共识），认为该操作是有效且完整的。这确保了数据在各个节点之间的一致性，并防止了恶意操纵。\n\
  \n## 共识机制的作用\n\n共识机制试图解决的问题是：在一个相互猜疑的双方的网络中，应该有一种方法达成账本的当前状态。软件中共识容错的研究可以追溯到 20\
  \ 世纪 70 年代后期，1982 年发表了一篇描述“拜占庭将军问题”的论文（(21)）。这描述了虚构军队将领在没有直接通信或建立信任的情况下，就最佳联合攻击策略达成共识的挑战。实现实用拜占庭容错（PBFT）——这是一个复杂的数学结构——是支持各种可用共识机制的算法目标。解决这个问题大致有三种方法：抽票、投票或工作。\n\
  \n## 工作量证明\n\n原始比特币区块链共识机制是工作量证明（Proof of Work, PoW），其“工作”是指矿工的计算努力。它不仅仅是一个共识机制，而是货币加密经济学的内在属性：它是新币进入流通的方法。这种竞争性证明源于早期的名为\
  \ `HashCash` 的概念（(22)）。每个区块的计算很难解决，需要大量的处理能力，但一旦完成就很容易验证。矿工正在为方程 `hash(blockcontents\
  \ + nonce) = 带有 N 个前导零的字符串` 中给定的 `N` 值计算可能的 `nonce` 值。你可以通过区块浏览器在每个区块上看到获胜的 `nonce`\
  \ 值以及该区块带有其前导零的生成结果哈希值。第一个解决方程的矿工将获得所有的交易手续费以及从不断减少的比特币储备中获得的奖励。根据 Cryptoslate 追踪的数据，这是一种经受住了时间的证明，并按市值发现在约四之三的加密货币中（(23)）。\n\
  \n## 权益证明\n\n在权益证明（Proof of Stake, PoS）中，矿工投入的是他们在系统中的权益，而不是计算能力。矿工通过他们验证的交易获得手续费，然后节点必须通过多数投票来提交操作并关闭区块。你的权益越高，你验证的交易就越多。一些人担心，坏人可能通过增加质押或建立超过\
  \ 51%的权益联盟来获得对共识的主导地位，从而赋予他们多数控制权以及验证和提交欺诈或重复交易的能力。权益证明的一种变体——委托权益证明（DPoS）结合了实时投票和对投票者声誉的衡量。代币持有者提名一个代表来代他们投票，这些代表从他们签署的区块中的交易中赚取手续费。\n\
  \nPoS 要求矿工质押他们的代币，以获得提交（铸造）链中下一个区块的机会，系统会随机选择参与节点之一，或者选择自上次铸造区块以来间隔最长的节点（硬币年龄随机化）。在作弊的情况下（例如验证欺诈交易），质押将被没收，这激励了诚实性。参与成本更低，因为没有消耗能量的算法处理，这鼓励了更多人参与共识，有助于实现有效的去中心化。这听起来很简单，但要维护单一不中断链的完整性，仍有许多需要克服的挑战。特别是，开发者意识到可能会意外或设计产生竞争链，或者早期参与的节点夺取控制权并使后续交易无效。背后的技术细节非常复杂；为了进一步阅读，网上有很多优秀的文章可以更详细地解释这一点。不同的链开发了不同的方法来确保矿工始终维护正确的链，但没有一种能够完全复制工作量证明中的激励机制——在工作量证明中，试图偏离链所需花费的设备和能量成本太巨大，至于矿工无法尝试此类政变。\n\
  \nNXT 是几个使用 PoS 共识的区块链之一，以太坊社区投入了大量工作开发其 Casper 更新，以期待最终从工作量证明转向权益证明。\n\n权益证明共识有几种变体，这些变体同样不需要在计算强度上消耗能量。其中主要是委托权益证明（DPoS）和权威证明（PoA）。DPoS\
  \ 同样具有能效，依赖于证人网络将验证职责委托给一个小小的节点社区。著名的 DPoS 区块链包括 EOS、BitShares、Steem 和 Lisk。支持者认为这是一个比\
  \ PoS 更民主的系统，但委托节点较少引起了对中心化的担忧：例如，EOS 只有 21 个委托节点，尽管有数万个证人。PoA 具有类似的结构，由少数几个预先批准的验证者组成，他们质押自己的声誉来维护链。随着时间的推移，这可能证明是更有力的激励。PoA\
  \ 已被一些更中心化的区块链（包括 Ripple）谨慎采用。\n\n# 抽票与投票\n\n对于企业区块链，节点被邀请加入网络。没有公共属性，没有加密货币，因此没有形式为交易手续费或矿工奖励的金钱激励。使用工作量证明模型是不现实的，因此开发者必须转向抽票或投票机制。\n\
  \n\n\n\nPaxos 协议一直是许多共识机制开发的基石，但目前的格局正在发生分化和演变。Hyperledger 和 Intel 的 Sawtooth Lake\
  \ 框架使用了 `Proof of Elapsed Time (PoET)`。这是一种抽票共识机制，网络会轮询每个活动节点中的 Intel 芯片，以查看哪一个的等待等待时间最短（随机选择）。该节点被选为领导者并创建链中的下一个区块。其他\
  \ Hyperledger 框架则转向了投票机制，例如 `Yet Another Consensus (YAC)`、如 `Kafka` 等排序服务，或者转向了`简化拜尔庭容错\
  \ (SBFT)` 模型，这是因为在私有分布式账本中，所有节点都是已知的。`Raft` 共识机制于 2019 年推给 Hyperledger 用户，其开发目的是产生一种易于理解的共识机制，分离了共识的关键要素，为系统构建和教育奠定了良好的基础。\n\
  \n随着更多公有和私有区块链的发展、采用率的提高以及对密码学理解的进一步加强，我们可以预计看到更多专门的共识机制和通用标准的出现。\n\n加密货币的爆发和区块链应用的发展让创业者感到兴奋，也让监管机构高度警惕。让我们在第\
  \ 3 章看看这种复杂的关系是如何发展的。\n\n# 第 3 章\n\n## 魔法互联网货币\n\n钱不是树上来的，但受 J.R. Willett 启发的`代币发行\
  \ (ICO)` 众筹方法导致加密货币到处萌发。这种新的筹款方式吸引了善意创业者和骗子的共同关注。这是一个通过发行应用程序原生代币凭空产生的不受监管的“魔法钱”，一些运行在\
  \ `Ethereum` 之上，另一些在全新的区块链上生成。广大社区对加密货币日益增长的兴趣，意味着这种区块链项目的众筹吸引了那些追求下一个重大科技成功的资金。\n\
  \n其中一些项目具有真正的创新性，基于良好的商业直觉，并通过提出合适的解决方案来解决现实问题。某些项目致力于开发能够长期支持分布式账本的技术栈，为未来的开发制定了协议和工具。另一些则直接追求消费者采用，成功程度不一。著名的且持续实现其原始愿景的早期\
  \ ICO 包括 `Ethereum`、`IOTA`、`NXT` 和 `Augur`。其中三个涉及区块链更广泛使用和易于采用的基础设施：`Ethereum` 及其智能合约和\
  \ `Virtual Machine`；`IOTA` 及其不断演进的加密以及通过 `Tangle` 验证机制实现的可扩展物联网交易；以及 `NXT`，发布了一个用于金融和公共服务的开源区块链，并使用\
  \ `Proof of Stake`（权益证明）共识。`Augur` 项目则是面向用户的：一种点对点的预言机和预测市场协议，用户因正确预测未来事件的结果而获得财务奖励。\n\
  \n围绕区块链解决旧问题的新方式，出现了一许多优秀的概念和创新。正如风险投资人 Alyse Killeen、Gil Beyda 和 Jimmy Song 在 2019\
  \ 年 3 月的奥斯汀 SXSW 节上所解释的那样，人们正在重新审视在早期技术上行不通的模式；只要在投入开发解决方案之前明确要解决的问题（这是软件开发中的常见陷阱），就有严肃的提议除了\
  \ ICO 资金外还吸引了声誉良好的投资者的传统支持。\n\n## 淘金骗局与破产业务\n\n遗憾的是，早期阶段出现的大项目并没有那么好的商业前景。`Statis\
  \ Group` 的研究发现，根据对项目在募集资金后失败且创始人消失的调查结果，2017 年发行的 ICO 中几乎 80% 是骗局。精美网站背后是低质量的白皮书，以及与高知名顾问关联的虚假声明，吸引了寻求赚快钱的疏加防备的人。大市场以敏锐的直觉锁定了那些想法不稳定但高潜力的区块链初创公司，而寻找快速致富机会的投资者也加入了其中。令人欣慰的是，帕累托法则在\
  \ ICO 投资中就像在许多业务领域一样适用。`Statis` 指出，“目前，超过 70% 的 ICO 资金（按金额计算）流向了质量更高的项目。”明明的投资者获胜了，但过程中也出现了牺牲品。并不是所有人认同“如果一件事看起来好得不可谱，那么它可能就是假的”这句格言，保护弱者的法律一直在追赶。新的淘金热给比特币和区块链带来了坏名。问题在于，究竟是加密货币破坏了系统，还是系统原本就是坏的？\n\
  \n根据记者兼作家 Dan Lyons 的说法，一些可疑的做法可以追溯到很久以前的管理科学。他 2018 年的书《Lab Rats》讲述了一个跨越世纪的故事，讲述组织的优先事项从工人利益转向了股东利益（通常是创始人和主要资金提供者）。公司变得更加关注向投资者提供回报，而表现的压力意味着这些回报并不一定与盈利且可持续的业务模式相关。养老金被挪用以支撑长期老牌企业的股价。职场受到动荡，为了短期生产力而牺牲长期就业，导致了员工流失率增加。我们现在正不可避免地向被积极描述为“零工经济”的方向迈进，这对股东来说是福利，但对于那些收入逐渐被侵蚀、就业权利受损的工人来说却不是。Lyons\
  \ 认为，硅谷及其他地区的许多投资者最终确定了一种“快速增长、亏损、上市、套现”的盈利性业务模式，在退出时获得快速回报，并跳过了传统的、混乱且冗长的构建一个运作良好且有盈利能力的业务的阶段。在与\
  \ Lyons 对话时，他指出这完全具有经典庞氏骗局的特征，公共投资者支付了早期轮股东的资金，并且在大多数情况下眼睁睁看着股价此后下跌。\n\n如果投资者通过投入几轮资金来寻找下一个\
  \ Facebook 从而奖励亏损企业，这又是如何改变创业者的行为的？一种预期增长了：一个好主意足以证明财务支持。系统已经坏了：将加密货币加入其中变成了一种致命的鸡尾酒。\n\
  \n## 什么时候买 Lambo，什么时候上月？\n\n\n\n\n随着加密货币价格在 2017 年下半年急剧上涨，对“下一个大趋势”的狂热达到了顶点。当时，许多加密爱好者坚信市场正在进行调整，让比特币回归其应的位置，并让所有其他货币和代币随之波动。“冲向月球！”是当时的口号，如果不是月球，那么加密货币能否带来一辆兰博尼？许多比特币的早期采用者在牛市中获得了丰厚的利润，看到他们通过将代币投资于新企业来继续支持加密货币和区块链的发展是好事，特别是在游戏领域，我们将在第五章)（通过挂钩美元的加密货币买卖比特币以驱动价格和成交量）的操纵嫌疑，为反对者和怀疑者火上浇油。沃伦·巴菲特在\
  \ 2019 年接受 CNBC 采访时称比特币为“幻觉”，^(7)，尽管这位资深投资者对底层的分布式账本技术显然有更积极的看法。2018 年 10 月，斯特恩商学院的诺埃尔·鲁宾尼教授向美国参议院银行、住房和社区事务委员会作了证.^(8)。他的演讲题目为“加密货币是所有骗局和（已破灭的）泡沫之母，而区块链是史上最被过度炒的技术，并不比电子表格/数据库更好。”\n\
  \n对这一时期极端波动的反弹是可以理解的。加密货币和区块链的支持者加倍了投入，“HODL”成了一个口号（这源于一条过度兴奋且拼写错误的推文，其本意是敦促人们持有自己的加密货币）。兰博尼基看起来很遥远，月球更是如此。但阴云背后总有光明，这段动荡的时期并非例外。它不仅清理了许多只盯着“魔法货币”的投机且缺乏基础的项目，还加速了多个司法管辖区的立法，以保护投资者并为区块链项目的众筹奠定坚实的基础。\n\
  \n## 驯服代币融资的狂野西部\n\n企业家每天都会提出尝试通过代币销售机制向社区筹集资金的新想法。其中最好的具有变革性，最糟糕的不可行或属于欺诈，但区块链应用的快速发展在很大程度上归功于资本的易获得。当提案合理且项目由胜任高效的团队支持时，这将促进我们对该技术及其潜力的理解。然而，如果一家新企业不够稳健以吸引风险投资家和银行等传统投资者的关注，或在主流众筹中成功，这是一个需要警惕的信号。代币销售可以在项目未经过严谨或独立审查的情况下收集大量投资。全球现行的股票发行立法有充分理由，它保护未受过教育的投资者不将资金投入到他们不懂的东西中。所有司法管辖区不可寻求扩大现有监管并实施代币融资的新规则以保护投资者免受其自身的伤害，是不可避免的。\n\
  \n## 实用与证券\n\n关于待售代币的功能，出现了一个重要的区别。在许多司法管辖区，实施的监管取决于该代币在受审查的区块链项目中是否有实用性（utility）。如果没有实用性，那么代币的出售可能涉及投资者承担程度的风险以及某些与购买股票和证券相当的权利和义务。当然，为了业务融资而发行的债务和股权在所有司法管辖区都受到严格监管，而通过简单地将代币硬塞进商业计划来规避文书工作的想法，对某些创始人来说具有奇特的吸引力。我与一些正在考虑或已经在使用新兴技术的企业合作，不幸的是，这是一个共同主题。我们可以把这个“放在区块链上”并构建一个代币吗？在绝大多数情况下，答案是否定的，而且某些方法已经接近于完全不负责任，旨在将整个风险转嫁给像数字彩票那样的投机代币持有者。\n\
  \n### 什么是实用代币？\n\n由于代币是可编程的，它们可以在应用程序运行中发挥特定作用。你可以将预售代币视为礼品卡：现在购买，等系统建成后使用。以以太坊为例，原生代币\
  \ Ether（ETH）在工作量证明共识机制中的费用结算和向矿工支付奖励具有实用性。以太坊区块链没有它无法运行，因为网络本身是非中心化的，用户必须持有 ETH\
  \ 才能进行交易。从美国立法者的角度来看，这种实用状态由证券交易委员会公司金融部局长比尔·希因曼（Bill Hinman）在 2018 年 6 月确认^(9)，他说：\n\
  \n```\n基于我对以太坊现状、以太坊网络及其去中心化结构的理解，目前的太坊报价和销售并非证券交易。而且，与比特币一样，将联邦证券法的披露制度应用于以太坊目前的交易似乎几乎没有增加什么价值。\n\
  ```\n\n另一个更容易想象的常见比喻是，一家公司以折扣价出售过山车的预售门票，销售收益投入在建设主题公园中。这张票是实用性的（utility），因为它让你能够乘坐过山车；还是证券（security），因为你帮助资助了公园建设的资本支出并预期获得回报？在这种情况下它是实用性的，因为回报不是参与公园的成功，而是使用它的机会。如果公园由于任何原因没有建成，那么代币持有者没有任何处。如果筹集资金的企业没有（例如）在投资开发前将资金存放在托管，那么就没有救济措施。这就是为什么代币投资者必须谨慎，并确保他们拥有足够的细节来做出明智的决策。\n\
  \n不同司法管辖区在“实用与证券”光谱上的立场差异巨大：作为经验之谈，美国极度规避风险，而欧洲大陆则要宽松得多。英国恰好处于这两个极端情况之间，而包括马尔特、直布罗特和瑞士楚格州（Zug）在内的地区已经制定了对区块链和加密货币领域企业具有吸引力的法律。无论如何，实用性和证券是重要区别的观点是共识的。方法的差异更多地反映了现有法律体系和宪法的结构，国家对类似的现实世界资产和结构的处理，以及每个法律体系的成文化程度。这些都差异巨大。请注意，尽管下段落中提到的特定法律会随时间取代，但每个国家的根本方法可能根深蒂固，不会发生显著变化。\n\
  \n### 美国\n\n\n\n\n\n美国立法的层级结构以及伴随成文宪法的成法传统，在历史上导致了州和联邦层面法律错综复杂的局面，而这些法律之间可能相互冲突。围绕区块链和加密货币的早期立法也无例外。该领域的领导者是\
  \ `Wyoming` 州，该州机构在 2019 年初已通过了 13 项新法律，支持并为区块链和加密货币创新营造了欢迎的环境。正如华尔街老兵、怀俄明州区块链任务组成员\
  \ `Caitlin Long` 所解释的那样，这“使得创新和创造力……为怀俄明州带来了资本、就业和收入。”`Wyoming` 的法律涵盖了数字资产所有权、使加密货币业务符合联邦立法的托管，以及对金融科技创新者的支持等关键方面，并逐渐被其他州采用。它们注意到了美国将代币归类为证券而非实用工具的倾向，并据此制定了立法，以便在处理原生区块链证券时与对待任何传统证券的方式保持一致。\n\
  \n2019 年 4 月，`SEC` 发布了其《数字资产“投资合约”分析框架》。该声明由 `Bill Hinman` 和数字资产与创新高级顾问 `Valerie\
  \ Szczepanik` 签署，其目的是“一种帮助市场参与者评估联邦证券法是否适用于特定数字资产的报价、销售或转售的分析工具”，大部分数字资产销售可能被视为证券。紧随这一指导，`SEC`\
  \ 向新初创公司 `Turnkey Jet` 发出了其第一封“不采取信”（No Action Letter），针对其发行实用代币。`Turnkey Jet` 的代币销售被附加了如钢缆般的种种限制，包括要求资金不能用于开发软件平台的任何部分，且代币必须在应用程序内具有即时实用性。对`SEC\
  \ 框架`和`不采取信`的反应不不一，许多观察者对这种被视为持续的过度限制性立场感到失望。`Linklaters LLP` 美国金融科技负责人兼区块链与数字资产负责人\
  \ `Joshua Ashley Klayman` 拥有一种哲学态度。在`框架`发布时，她在接受 `Modern Consensus` 采访时表示：\n\n>\
  \ `SEC` 长期以来一直在说，几乎每一次数字资产销售都将是证券销售。我不知道为什么人们继续从他们那里期待不同的答案。我认为，如果我们想要不同的结果，我们需要看向立法者。\n\
  \n立法者们已经准备就绪。在 `SEC` 的《代币指南》墨迹未干之前，美国联邦立法者就引入了两个支持区块链产业的法案：《2019 年代币分类法案》和《数字分类法案》。`Klayman`\
  \ 在《福布斯》上写道，“为非证券代币销售获得广泛的跨派支持是多么了不起和强大。”正如在 `Wyoming` 一，这些法案的主要驱动力似乎是对缺乏监管透明度的担忧，国会认为这阻碍了创新，并使企业流向更具欢迎性的司法管辖区。这些法案是根据区块链行业的反馈起草的，但仍然存在担忧，包括来自\
  \ `Wyoming` 本身的担忧，`Caitlin Long` 指出《代币分类法案》与其他州已经颁布的一些法律之间存在冲突。美国继续努力在州和联邦层面一致地将区块链和加密货币立法成法，以消除歧义，但满足所有方的要求将是一个挑战。\n\
  \n## 英国\n\n英国金融行为监管（`FCA`）的任务相对简单，因为它在一个完全不同的法律框架内运作。英国法律并没有过度成法化。它依赖于原则和先例，并且没有将区块链和加密货币监管复杂化的意愿。`FCA`\
  \ 的指南根据加密资产的结构和设计用途对其分类。交易所代币（如 `Ether`、`Bitcoin`、`IOTA` 和 `XRP` 等对去中心化平台运行至关重要的其他加密货币）不在\
  \ `FCA` 的监管范围之内，提供去中心化平台产品或服务的实用代币也是如此。如果证券代币与现实世界的证券共享特征（例如赋予持有者的权利或对回报的预期），则被识别为证券并受到监管。募集资金的实际用途与代币的界定没有关系：过山车票是实用工具，无论其销售募集的现金是否支付了施工费用。\n\
  \n根据 `DLA Piper` 国际金融与项目小组负责人兼金融科技全球小组主席 `Martin Bartlam` 的说法，这种灵活性以及监管机构对原则和特征而非严格规则的依赖，为英国新兴的区块链和加密货币格局提供了一套独特的平衡指南。他对某些初创公司跳槽到司法管辖区的热情感到困惑，他们在\
  \ `Gibraltar`、`Switzerland`、`Malta` 或 `Singapore` 建立业务，以获取他们认为更适合自己需求的不同框架，尽管他们的客户群在其他地方。这对“魔法互联网货币”思维是一种悲哀控诉，即首要任务有时不是为客户解决问题，而是为企业家避免问题。但对于大多数人来说，英国的监管方法支持真正的创新和可行的商业模式，并且脚踏实地。\n\
  \n`Bartlam` 还观察到，甚至在加密泡沫在 2017 年底达到顶之前，通过该公司的 `ICOs` 数量已经显著下降。由于市场波动，现在寻求 `ICO`\
  \ 资金的更可行业务倾向于销售稳定币代币，这些代币挂钩于现实世界的法币储备或黄金。这是一个复杂的过程，但被认为比暴露于加密货币价值波动更好的行动方案。\n\n\
  英格兰银行也做出了一些对加密货币产生积极影响的改变。行长 `Mark Carney` 在 2019 年 6 月宣布，非银行可以在那里开设账户，这最初影响了如 `Worldpay`\
  \ 等支付公司，并对几天前发布的具有“系统重要性”的 `Libra` 白皮书表示谨慎欢迎。`Carney` 多次表示他对通用的加密货币的支持。在 2019 年\
  \ 8 月于 `Wyoming` 举行的央行行长会议上，他建议全球数字货币可以成为世界储备，使全球经济免受美国波动的影响。\n\n## 法国\n\n2019 年\
  \ 9 月，在法国里昂（`Lyon`）举行的区块链游戏峰会上（Blockchain Game Summit），曾担任法国创新部长数字经济高级顾问的律师 `Jean-Baptiste\
  \ Soufron` 概述了法国对 `ICOs` 的方法。他解释说，资助开发新平台的代币销售可以比作为农场的牛群购买一头小牛。这种动物对于商业模式至关重要，并且从一开始就被视为实用工具。它可能需要时间才能成熟到足以产奶，并且可能会产生价值，但这些一个特征都不应排除其作为实用工具而非证券的考虑。\n\
  \n\n\n\n这是我们见过的最灵活的解释，来自于很大程度上支持 ICO 的司法管辖区。法国花时间与行业进行咨询，并定义了代币销售的实际操作方案。`PACTE`\
  \ 法——企业增长与转型行动计划（plan d’action pour la croissance et la transformation des entreprises）于\
  \ 2019 年 4 月通过，包含了围绕 `ICOs`（虚拟代币发行，Offres de jetons virtuels）的特定监管规定。它承认 ICO 已成为创新项目主要的融资工具，并且区分真实发议与欺诈发议至关重要。其指南包括在代币销售过程中使用传统的托管机制、证明公司拥有稳健的内部系统和保险，以及要求提供清晰准确的白皮书，这些旨在降低投资者的风险。\n\
  \n## 马尔特、直布罗林、新加坡和苏格\n\n在行业发展的早期，一些较小的国家通过加速发展超越了复杂的司法管辖区，将自己确立为区块链和加密货币的领导者。在 2015\
  \ 年到 2017 年淘金热期间，它们吸引了寻求立法支持和为其 `ICOs` 建立信誉的融资者的关注，并提出了特定规定的早期示例，这些规定正在逐步转化为当地法律。\n\
  \n为了成为欧洲区块链和加密货币的之都，自封为“区块链岛”的马尔特在 2018 年 11 月通过了三项关于技术、代币和加密货币的法案。根据福布斯记者 Rachel\
  \ Wolfson 的说法，马尔特模型采取技术优先的方法，并开发了清晰的监管框架，承认法律确定性对该行业企业的重要性。法案包括对交易所的认证（这是领先交易所 `Binance`\
  \ 迁往该岛的主要因素）、`ICOs` 的监管制度，以及对分布式账本技术内部治理的要求，以促进信誉。\n\n从“加密岛”到“加密谷”，瑞士的 `Zug` 州是区块链业务的早期避风港，在其他国家仍在制定指南时，它是\
  \ ICO 融资的欢迎欢迎司法管辖区。现在该地区已建立了 50 多家区块链公司。\n\n直布罗林也竞逐“区块链岛”的称号，开发了首个分布式账本技术的监管框架，并建立了一系列九项原则，预计半岛的\
  \ `DLT` 企业将遵循这些原则。\n\n新加坡的《证券和期货法》监管实用型代币和证券型代币，而其《支付服务法》则监管英国 `FCA` 所描述的交易所代币。\n\
  \n直布罗林、马尔特和新加坡在历史上出于各种原因继承了英国的法律框架，其监管政策的灵活性与英国 `FCA` 所实现的平衡有许多共同点。在经历了剧烈的几年后，淘金热似乎正在消退，我们正在转向一个具有可持续业务模式的更稳定的生态系统。\n\
  \n## 每种场合都有币\n\n联合国承认现实世界中有 180 种货币为法定。相比之下，`Cryptoslate` 列出了 2100 多种加密货币。数字世界中币的泛滥归于它们的本质：加密货币是可编程的货币。它们根据在数字生态系统中的位置可以并且具有专门的功能。许多币为自己的分布式账本运行，而另一些则是\
  \ `Ethereum` 内的代币。\n\n代币是分布式账本技术一个特别特别的方面。代币不仅仅是数字现金：它是可编程的货币。具有不同属性的代币通常通过相关的以太坊意见请求（`ERC`）编号来引用，这导致了开源社区对它们的开发。最常见的是\
  \ `ERC20` 代币，作为构建在 `Ethereum` 区块链上的应用的原生货币。其他代币具有专门：`ERC721` 和 `ERC1155` 被广泛用于在游戏中执行特定功能，并正渗透到业务领域，正如我们在第五章中看到的。代币可以是价值的衡量标准、非货币的独特或通用资产，或者是社区中的影响力程度。\n\
  \n让我们来看流通的一些加密货币类型及其各自的功能。\n\n### 匿名性与隐私\n\n`Bitcoin`、`Ether` 和其他加密货币在普通人看来是匿名的，用户的钱包地址被呈现为字母和数字字符串。事实并非如此。它们不是匿名的，而是伪名的。追踪交易到现实世界是完全可能的。然而，还有其他币的结构允许用户获得匿名性和隐私。其中最著名的是\
  \ `Monero`、`Dash` 和 `Zcash`。\n\n虽然 `Bitcoin` 区块链上的任何交易都会识别发送者、接收者和金额，但涉及隐私币的交易以多种方式进行模糊处理。机制包括隐藏交易钱包的细节、将付款拆分为几个独立的金额、在诱饵列表中伪装真实交易以及许可性视图。实际上，这些币复制了我们的日常现金交易：没有透明的公共记录可以被查询以证明谁给朋友递了一张美元钞。\n\
  \n### 稳定币\n\n加密货币面临的最大挑战之一是 `Bitcoin`、`Ether` 及其同类产品的波动性。除了 2017 年价值增长十倍和 2018 年相应的下跌等泡沫之外，加密货币与主要法币相比的日常波动导致了采用方面的摩擦和挑战。虽然加密生态系统仍然很小，但与投机性交易量相比，价值交换交易（即购买和服务）太少，而这驱动了价格的下跌和波动。即使在加密货币使用繁荣或应用程序流行的地区，在法币之间转换涉及的汇率风险也很高。这种边缘的摩擦是进入的巨大障碍，让完美的分布式账本应用染上了不可预测的阴影。\n\
  \n稳定币出现了。这是一类特定的加密货币，其价值不是由新兴加密货币市场的波动驱动，而是由现实世界资产的移动驱动。稳定币具有几个优势，通过作为价值气闸减少了加密生态系统边缘的摩擦。对于加密货币投资者来说，它们代表了加密世界中的救生圈，在极端波动情况下是避风港。对于公共区块链应用的现有用户，它们正成为通往现实世界的链接：例如，在加州，现在可以使用稳定币支付大麻相关业务的州税。最后，使用稳定币作为核心加密货币的应用消除了新用户感知的大部分风险，使人们无需担心波动和流动性即可受益区块链应用。\n\
  \n在一系列稳定币中最早且被广泛采用的 `Tether` 与美元价值挂钩，并由其匹配的法币储备支撑。`Tether` 过去遭受过负面报道，特别是由于对对其储备缺乏独立验证。它还因为第三方在\
  \ `Bitcoin` 和 `Tether` 之间进行操纵性交易而臭名昭彰，这可能在 2017 年牛市期间人为推高了 `Bitcoin` 的价值。\n\n\n\n\
  \n\n信任与信心的问题是 Gemini 交易所的 Cameron 和 Tyler Winklevoss 正在正面解决的。Gemini 元（Gemini Dollar）是世界上第一种受监管、经过审计的稳定币。Winklevoss\
  \ 兄弟有一个明确的议程，即通过监管来建立信任，避免一直困扰加密货币世界托管人的的人性问题。他们在 2019 年 3 月于德克萨斯州奥斯汀举行的 SXSW 大会上演讲时解释说，“最健康的市场是监管最好的”，并重申成功的关键“不在于技术，在于信任”。\n\
  \n虽然 `Tether`、`Gemini` 以及其他抵押稳定币负有维持匹配储备金的沉重负担，但来自 `MakerDAO`（`Maker`）的 `DAI` 通过内置代币智能合约的自动定价系统，克服了持有实物储备的需求。这些机制随着市场的波动不断调整\
  \ `DAI` 的价格，确保其与美元保持一一挂钩。自 2017 年发布以来，尽管市场经历了剧烈波动，它仍表现出了良好的稳定性。\n\n`DLA Piper` 的\
  \ Martin Bartlam 表示，使用稳定币作为主要货币开发应用程序正变得越来越常见。成熟的应用程序也在转向稳定币。最早开发的以太坊应用之一 `Augur\
  \ Project` 的 Tom Kysar 解释说，对低波动性的需求导致他们的点对预测市场版本 2.0 转向 `DAI` 进行交易。降低加密货币风险已成为推动区块链普及的关键一步。然而，也有一个警告：尽管这种方法让货币观念受法币行为影响的新用户感到放心，但稳定币在追求价格稳定性的过程中，正面临着放弃传统加密货币系统性稳定性的危险。\n\
  \n### 特种加密货币\n\n在金融科技（FinTech）领域，分布式账本的概念很快得到了探索。毕竟，金融系统是建立在账本的制衡基础之上的，该行业既理解这项新技术，也意识到它终有一天可能取代传统银行。在金融科技和银的所有领域，人们在探索自动化、去中心化以及区块链在管理相互猜疑双方之间信任中的角色方面做了大量工作。\n\
  \n那么，金融科技币在哪里呢？其中最大的是 `XRP`，它是 `Ripple` 跨境支付平台的原生货币。`Ripple` 已被全球银行采用，是一种旨在减少国际转账摩擦的流行区块链应用。`XRP`\
  \ 对这一小众 `Ripple` 应用至关重要这一事实导致了争议和争论，认为 `XRP` 不是去中心化的加密货币，不应以此方式进行交易。关于公开市场销售 `XRP`\
  \ 是否合法的法律行动一直在背景中持续。尽管如此，得益于 `Ripple` 采用的扩大，`XRP` 已成为最受欢迎的交易加密货币之一。作为 `XRP` 形式的衍生，`XLM`\
  \ 也在支付处理领域获得关注。\n\n另一个具有小众应用的代币是 `IOTA`，它是同名区块链的原生加密货币，专注于物联网的安全和实现机器之间的通信。`IOTA`\
  \ 的框架偏离了中本的区块链结构，引入了一种名为 `Tangle`（缠结）的概念。交易被写入账本并通过边缘与其他交易连接，而不是通过线性链。只有当执行节点验证了两个相邻交易时，才能进入交易。这导致了一种随机共识，随着更多交易的输入，完成的验证就越多，因此从理论上讲，交易越多，系统运行得越快。\n\
  \n### 大众加密货币\n\n加密货币的采用意乎所料地是一种全球现象。根据 2019 年 Statista 全球消费者调查，土耳其公民领先，20% 的人曾拥有或使用过加密货币；`巴西`、`哥伦比亚`、`阿根廷`和`南非`的使用率也超过\
  \ 16%。这与西欧和北美极低的采用率（英国为 6%，美国为 5%）形成对比。在波动较大或大部分人口无法获得设施的地方，加密货币正在取得进展。这并不是说在这些经济体中采用是很容易的。当局已尝试在多个国家监管甚至禁止加密货币挖矿，成功程度不一。委内瑞拉因创建了国家加密货币\
  \ `Petro` 而被一些加密货币传教士视为先驱，但真实情况要复杂和阴险得多。Andreas M. Antonopoulos 描述的“人民的货币”（即开放、无国界、中立、抗审查的加密货币）与中央集化控制下的“政府的货币”之间有明确的区别。由于没有人信任\
  \ `Petro`，`Bitcoin` 的使用反抗性地蓬勃发展。\n\n#### 需求驱动的采用：案例研究：委内瑞拉\n\n我的同事 Patricia O’Callaghan\
  \ 在 2017 年面对通货膨胀加剧、基础设施崩溃和未来前景黯淡离开了委内瑞拉。国际货币基金报告称，当时的通货膨胀率已达到 1,000,000%，并预计未来 12\
  \ 个月将升至估计 1000 万%。Patricia 和她的朋友现在遍布全球，他们告诉我他们离开的环境所面临的挑战，以及 `Bitcoin` 在委内瑞拉社会中的重要性。\n\
  \n在银行和政治体系稳定的国家，加密货币被视为一种波动、高风险的投资。在委内瑞拉，人们面临当地货币的快速贬值，`Bitcoin` 扮演了稳定币的角色。以当地货币玻利瓦（Bolivar）接收付款的人无法转换为法币。Patricia\
  \ 回记得她被警察拦下并没收了钱包里的几美元。转换为 `Bitcoin` 成为了一种保护价值、在公民之间以及跨境转账资金并安全存储储蓄的方式。\n\n\n\n\n\
  鉴于报道的采用率，使用比特币并不像我们想象的那么简单。可靠基础设施的缺乏导致了经常停电，或者更准确地说，电力供应在一个城镇和另一个城镇之间随机中断。互联网访问断断续续或不存在。比特币挖掘曾得益于国家石油收入资助的几乎免费的电力而非常获利，但现在是非法的。任何发现的设备都会被没收，但这仅仅是将矿机转移到了政府的控制之下。尽管如此，比特币依然蓬勃发展。2018\
  \ 年 11 月，通过短信使用比特币支付日常商品开始在杂货店、餐厅、咖啡馆甚至买衣服时变得普遍。对于这样一个国家来说，这是一个巨大的文化转变，因为此前那里很少有人知道加密货币，而且只有一小部分人口可以使用互联网。对政治和经济局势的回应是全面采纳“人民的货币”。\n\
  \n那么“政府的货币”呢？佩罗（Petro）正日益被强加给一个在技术上无法应对的人群。养老金以佩罗支付，一段在网络上广泛流传的视频显示，一名税务收员要求企业主用佩罗支付税款^(17)。那个年轻人无法照从，解释说所有的客户都用玻利瓦尔付钱，并因其抗议被关押。许多委内瑞拉的专业人士离开了国家，包括我的开发者同事和她的丈夫（一名医生）。对于那些离开的人，至少可以通过比特币将资金转出境外。在哥伦比亚边境（步行即可轻松到达），那里设有比特币\
  \ ATM 机，准备供新抵达者提取他们的储蓄。独立报告还表明，哥伦日益增长的 Athena 比特币 ATM 网络的主要用户是将其现金汇回的委内瑞拉人^(18)。\n\
  \n任何新技术有效的采用方式都是由需求驱动的，而真正的加密货币从“加密无政府主义”理念中脱颖而出，完美适合满足委内瑞拉公民以及世界上其他处于类似境地的人的需求。那么，在一个对“人民的货币”没有明显需求的社会中，激励措施又何在呢？\n\
  \n## 以用户为先\n\n### 无缝的用户体验\n通过熟悉的事物引入用户要容易得多。由于拥有资产托管权的中心化结构，人们可能根本没有意识到自己在使用加密货币。区块链和加密货币创新者\
  \ Adryenn Ashley 通过近期历史勾勒了技术的采用模式。VHS 与 Betamax 视频格式之争是一场由健壮性较差但更熟悉的 VHS 赢得的战斗：毕竟，对于理性的消费者来说，这只是一个大磁带。CD\
  \ 盘在音频领域成为主流，尽管激光光片在技术上更优越，但它为 DVD 作为一种新的视频媒介的出现铺平了道路。Ashley 说，加密货币的采用依赖于这种对熟悉感的追求。如果语言太陌生，或者访问方式太复杂，那么主流消费者就没有路径可循。\n\
  \n### 通过游戏进行采用\n游戏是加密货币可以在不破坏用户体验的情况下增加新功能的领域之一。多达 2.5 亿《堡垒之夜》玩家使用游戏中的 `VBucks`\
  \ 支付游戏费用，而《魔兽世界》的 `WoW Gold` 和平台外资产交易已非常成熟。通过游戏引入新的加密货币用户让用户获得了拥有自己的硬币和资产的机会，但为什么用户的体验应该被破坏呢？游戏行业资\
  \ veteran Alex Amsel 与我讨论了这一挑战。他也看到了在不损害游戏社区已习惯的现有功能的情况下，引入加密货币益处的巨大挑战。稳定币提供了消除波动的途径，但没有理由游戏不以法币定价，而且这正日益成为人们采取的路线。\n\
  \n## 通过知情选择进行采用\n\n### 加密货币主义\n加密货币主义主义者主倡一种未来，人们有意识地选择对自己的资产拥有绝对的去中心化控制，遵循密码客和加密无政府主义愿景的足迹。这可能包括那些没有银行服务的账户或不愿将信任交给政府的用户，但积极采纳加密货币意味着对加密格局和语言具有一定程度知识和理解。扩展这种方式需要用户教育，并投入大量工作来改善公众对加密货币的认知。在加密货币被直接采纳的情况下（例如在委内瑞拉公民群体中），这是由需求驱动的，但仍需要理解。教育是赋予用户使用加密货币选择的重要部分。理解控制加密资产的优缺点可以提高安全、可靠的使用，并有助于在加密货币满足需求时促进适当的采用。\n\
  \n### 教育亚洲\n在监管、审查和反加密货币宣传的面前，与潜在用户群的直接互动以及积极的教育和引导正逐渐推动亚洲的采用。`Liquid.com` 的营销与增长负责人\
  \ Emily Rose Dallara 曾在整个亚洲工作，现常驻越南西贡。她观察到，东京和曼谷可能是采用方面最先进的，Roger Ver、Akane Yokoo\
  \ 和他们的团队已鼓励大量小微企业在线和线下接受比特币现金（`BCH`）。现在，在东京中心区域的六木座和涩谷的咖啡馆和餐厅进行微额购买已成为可能，而在线商户接受\
  \ `BCH` 也变得变得越来越简单。\n\nDallara 在越南交易者中看到的这种采用现象，更有可能是由加密货币持有者鼓励他人使用以便他们花钱所驱动的。接受加密货币也可能给商人带来问题，因为在越南用越南盾（`VND`）以外的任何货币要求付款或列出价格都是非法的，而且全亚洲有这么多电子货币应用，加密货币只是另一种支付选择。然而，加密货币在某领域满足了需求，尽管这种需求可能不会受到当局的青睐。越南与许多其他更集权的共产主义国家一样，不鼓励向外转移\
  \ `VND`。Dallara 的经验是，在当地交易所将 `VND` 转换为 `BCH` 更容易、更便宜，并使用加密货币管理跨境汇款。在西贡，人们也关注 `DAI`\
  \ 稳定币，人们开始在线接受加密货币并转换为 `DAI` 或 `USD`。这种渐进的采用在亚洲共产主义国家的政治背景下如何发展将有趣的。\n\n## 为没有银行服务的人提供服务\n\
  西方有时忽视的一个文化方面是，在亚洲没有银行账户既不寻常也不不利。我们的经济预期人们能够获得传统银行服务，并排除了那些没有的人，例如，为可以通过银行直接扣款的人提供更具竞争力的公用事业定价。我们在西方文化中可能预期从没有银行服务的人身上获得的优势并不会推动亚洲的采用。\n\
  \n\n\n对于那些缺乏银行服务的弱势群体，以及像新兴大麻类产业这样的现金经济体来说，获得价值存储和支付机制的访问是极具吸引力的。加密货币填补了银行无法或不愿介入的真空，无论这是由于外部监管还是由于其内部业务模式的结果。这是一个与我们生活息息相关的问题。根据联邦存款保险公司的研究，^(19)\
  \ 美国 6.5% 的家庭没有银行账户，另有 18.7% 的家庭银行服务不足，这在地球上最大的经济体中代表了 3260 万家庭。如果这些家庭能够像银行客户使用法币一样方便地使用加密货币，将减少经济排斥。\n\
  \n## 案例研究：Abstrakt\n\n像位于奥斯汀的 Abstrakt 等公司已经在朝着这一目标努力，旨在让加密货币的使用变得简单且安全。在接受创始人 Corey\
  \ Segall 采访时，他强调需要直观的用户体验来帮助普及，同时确保个人对其资产和数据的所有权。银行客户和 `PayPal` 等支付机制的用户可以使用良好的移动应用程序，实现快速方便的交易：为什么加密货币在这方面应该有所不同呢？当然，挑战在于，当用户自己持有保险箱钥匙时，他们对资产的安全负有全部责任。如果在银行或任何具有良好托管服务的平台上出现差错，可以通过中心化账本寻求救济。如果个人用户在管理加密资产时犯了错，例如将资金发送到错误的钱包，或者更糟糕，丢失了作为访问资产唯一手段的私钥，那么就无可回了。\n\
  \nAbstrakt 的专利技术以 `VaultWallet` 移动应用程序的形式公开，但通常更多见于许多金融科技和区块链应用的底层。它通过外表简单的交易（从谁处、到给谁以及多少），并以创新的分片密钥管理策略和自动服务器端欺诈检测机制，解决了加密货币使用的这两种最坏情况。其重点是从多个角度为用户提供高水平的安全保障。该系统通过其分布式特性防止直接攻击，通过在交易清洁时进行确认签名防止欺诈，并通过一系列备份选项防止用户错误，这些备份选项经过仔细设计，以避免任何托管关系。Segall\
  \ 最后表示，对于日常交易，用户在使用加密货币时应该体验到与使用信用卡或支票账户相同的便利性。\n\n## Libra：一条新路径？\n\n2019 年 6 月，Facebook\
  \ 发布 Libra 白皮书开启了加密货币采用的新通道，根据 Andreas M. Antonopoulos 的观点，^(20) 这产生了第三种构建物：“公司货币”。人们一直推测硅谷巨头中至少有一个会推出自己的加密货币，工作不仅在\
  \ Facebook 进行，在 Amazon、`Apple` 和 `Google` 也进行；这份白皮书是向传统银行出的第一声警告。`Libra` 的发布原计划于\
  \ 2020 年年中期，受生产和监管故障的影响，但该项目在包括 `PayPal`、`Visa`、`Mastercard` 和 `Stripe` 在内的主要创始退出后遭遇了早期挫折。尽管如此，Libra\
  \ 白皮书的发布出于几个原因而具有重要意义。首先，它一夜改变了加密货币与银行之间的动态，让全球十亿用户和更广泛的公众意识到由知名品牌支持的“政府货币”的替代方案。它对银行构成的威胁大于对已建立的去中心化货币的威胁，监管机构也很快意识到了这一点。其次，它被设计为无缝访问的点对点支付媒介。一旦公司货币的易用性在大众中确立，传统加密货币的世界将对隐私、中立性以及社区而非一篮法币所赋予的价值更为敏感的用户开放大门。\n\
  \n加密货币的广泛采用将受到公司货币的影响，但还有许多因素在起作用，以及对保护个人用户的考虑以及在现实世界中使用数字现金的实用性。让我们更仔细地观察加密货币的托管以及减少加密生态系统边缘摩擦的方法。\n\
  \n## 托管的矛盾\n\n从加密货币的无政府状态开始，初意是 `Bitcoin` 以及随后的硬币应该是人民的货币，去中心化且不受机构或权威的束缚。人们有自己的想法。随着开挖加密货币所需的设备变得昂贵得令人无法负担，爱好者寻求投资这种新资产时，交易所应而生以满足买卖双方的需求。当然，一旦可以通过数字中介购买硬币，新投资者的诱惑就是将硬币留在交易所。这是熟悉性的诅咒：交易所开始事实上成为银行。讽刺的是，虽然比特币白皮书是在\
  \ 2007 年至 2008 年银行危机后发布的，并提供了一种去中心化的替代方案，但日益增加的比特币者转向了看起来像传统的结构来管理他们的账户。\n\n###\
  \ 个人控制的风险\n\n社区鼓励加密货币持有将其资产从交易所钱包转移到私有存储，2019 年 1 月 3 日发生了第一场 `Proof of Keys` 事件。这一天是比特币创世区块十周年，被选作提醒持有者确保他们拥有所有资产的私钥，并将长期投资的硬币移动到更安全的私有存储中。对于新入者来说，这感觉就像是“跳入火坑”，从类银行交易所的熟悉领域进入了一个通过在等同于数字个人保险箱的地方存放资金的新世界。但即使你控制了所有资产，它们真的像可能的那样安全吗？\n\
  \n即使是最小心的加密货币投资者也曾遭受私有钱包的操纵和盗窃，更不用说多年由于密钥丢失、记录销毁或意外丢弃硬件而掉进虚拟沙发后的比特币。加密货币被盗是一个日益增长的现象，特别是当黑客利用个人持有资产周围的安全漏洞入侵时。2018\
  \ 年 11 月，一组投资者诉了 `AT&T` 和 `T-Mobile` 疏忽，因为它们在响应黑客口头请求时更换了他们账户的 SIM 卡.^(21) 更换后的\
  \ SIM 卡随后用于通过双身份验证控制并访问钱包：一名受害者据报道损失了 300 万枚未指定的币，另一名受害者当时估计损失为 62.1 万美元。\n\n投资者陷入了信任中心化交易所管理去中心化资产的风险，与在自己手中发生几乎没有救济的灾难性风险之间的境地。由于存在这种程度的风险，加密货币无法有效扩展。我们该如何前进？\n\
  \n## 监视看守者\n\n\n\n\n\n交易所可能不受中心化政府的监管，但历史上看，它们同样缺乏任何保护消费者的、严格且可强制执行的标准。对于许多人来说，留在交易所面临的风险还抵不上他们对将资金转移到自己完全控制的钱包时所要求的复杂性和精确性的恐惧。交易所被信任能够代表个人看管大量的加密货币持仓，这重新引发了一个古老的问题。大约在两千年前，罗马诗人朱尔文纳尔（Juvenal）创造了“Quis\
  \ custodiet ipsos custodes?”这一说法：谁来监视守门人？这是一个合理的担忧。2014 年 2 月，当时交易量最大的交易所 `Mt Gox`\
  \ 遭遇了一场创纪录盗窃案，这最终导致了该组织的倒闭，因为数千万的持仓被攻破，高达震惊的 85 万枚比特币被盗，尽管其中部分资金随后被追回。尽管交易所努力建立信任并实施自我监管，但在几乎五五年后，又爆发了第二起丑闻。加拿大公司\
  \ `Quadriga Fintech Solutions` 最初在 2015 年登上头条，据报道可能是全球首家上市的比特币交易所。在该公告发布后，上市计划很快被搁置，但由于其发生在\
  \ `Mt Gox` 事件之后，这种宣传反而有助于了 `Quadriga` 作为一个渴望接受监管的企业的声誉。2019 年 1 月，在面临一些财务挑战后，据报道创始人\
  \ `Gerald Cotten` 突然去世，没有留下访问存储交易所所有存款的冷钱包（离线钱包）的指令。当时对损失情况以及 `Cotten` 在印度去世证明的怀疑在审计师发现钱包后得到了证实——审计师发现这些钱包在创始人失踪前几周就被清空了。在随后的漫长法庭调查中，安永道（`Ernst\
  \ and Young`）观察到，“从财务报告和运营控制的角度来看，运营结构存在严重缺陷。”如果自我监管在第一道关卡就失败了，那么托管机构还有什么可信？\n\n\
  ## 案例研究： Gemini\n\n`Gem` 交易所的创始人 Cameron 和 Tyler Winklevoss 坚定地站在了外部监管托管的一营。作为经验丰富的加密货币投资者，他们见证了该领域的发展，包括臭名昭著的交易所灾难以及日益频繁的交易所和个人被盗窃的报告。这促使他们采取行动。在大多数此类案例中，他们在\
  \ `SXSW 2019` 的主演讲中指出，薄弱环节一直是人：对加密资产守护者的信任被放错了地方。\n\n“谁来监视守门人？”他们问观众。在缺乏斗篷英雄的情况下，Winklevoss\
  \ 兄弟坚称，监管目前是我们唯一的希望。他们认为，最健康的金融市场是那些监管最好的市场，而且无论涉及什么货币，货币的未来都需要信任。他们在 `Mt Gox` 崩溃后开始运营他们的\
  \ `Gemini` 交易所，并在启动前获得了银行执照。`Gemini` 的创始人关注投资者的长期安全和业务的长期成功，他们再次将加密货币领域的发展与互联网的历史性崛起相提比。他们提醒观众微软（`Microsoft`）和网景（`Netscape`）早期的法律纠纷，这些纠纷阻碍了这些\
  \ 20 世纪 90 年代的巨头在互联网上的统治地位，让谷歌（`Google`）得以反超。Winklevoss 兄弟将深耕交易所业务，准备好抓住受信赖托管人所应带来的机会。\n\
  \n## 定义稳定性\n\n批评人士过去曾说“你不能用比特币买咖啡”。正如我们所看到的，这种情况在东京、加拉加斯、曼谷以及全球数百个城市已不再如此，但这一陈调阐明了加密货币面临的一个根本性挑战：它与法币相比的波动性。我们通常习惯于今天的\
  \ 3 美元咖啡在明天还是 3 美元的咖啡。我们领取固定的工资，并据此制定月度预算。如果采用一个今天咖啡 3 美元，明天 6 美元，后天 1 美元的系统，显然是不合理的吧？在某些地方，这是常态。在津巴布韦长期经济动荡期间住在那里的朋友回忆道，走进商店时不知道那天的面包是\
  \ 20 美分还是 5 美元。Patricia OCallaghan 的父亲仍在委内瑞拉经营银行：我见过成堆钞票被送进碎纸机，直到两年后才发行新货币（注：此处为原文逻辑替换）。正如我们所看到的，这种情况在东京、加拉加斯、曼谷以及全球数百个城市已不再如此（重复译文）。政府货币并不是系统性稳定的，它依赖财政政策赋予价格稳定性。加密货币是政府货币的对立面。正如华街老深人士\
  \ `Caitlin Long` 在 2019 年 6 月价格波动后解释的那样，`Bitcoin` 的设计是为了系统稳定性，而不是价格稳定性，而这两个概念可能是互斥的。货币的需求本身是不稳定的，受到从自然灾害到人口增长以及季节性变化的因素的影响。基本的经济学理论认为，在需求时期，稀缺商品的价格应该上涨，但正如\
  \ Long 所说，“央行通过干预市场来制造法币的价格稳定性。”\n\n系统稳定性完全不同。随着 `Bitcoin` 需求的增加，无法通过增加供应来匹配需求并维持价格，因为其数量是固定的。相反，系统的安全性随着挖矿难度的自动增加而变化。为了价格稳定和抑制市场波动，政府货币如何维持系统稳定性？Long\
  \ 观察到，干预只会导致不稳定。自 80 年代以来，她观察到，“传统金融市场一直在在危机/稳定/危机的循环中反复波动。”日常，我们可能会享受政府货币提供的价格稳定性，但加密货币提供了一种另一种系统稳定的路线，这种路线在危机时期将大有用场。\n\
  \n\n\n\n\n碰杯碰撞的声音穿透了房间里朋友和新相识交谈的嘈杂声。服务生流畅地穿过人群，为聚集在一起的宾客端上寿司托盘。看着提供的各种寿司饭团，一位女子拿起手机扫描了托盘上的条形码。几秒钟内，App\
  \ 向她展示了这款寿司中金枪鱼是从哪里捕捞的，并确认了其具有可持续且受监管的来源。她笑了，拿起一块放进嘴里。“真好吃。”\n\n是事实还是虚构？在 2018 年\
  \ 11 月于纽约举行的 ConsenSys Ethereal 会议上，为客人提供的寿司金枪鱼来源是通过以太坊应用程序进行验证的。金枪鱼场景是一个被经常引用的案例，说明了分布式供应链账本如何提供超越传统技术所实现的价值。在完全实现的未来，通过不可篡改的独立来源进行独立验证的透明记录将赋予监管机构信心。来自不断扩大的物联网中传感器的原始录入将减少人为错误，并降低故意伪造记录的风险，确保原材料源自受监管的来源，并且货物在正确的条件下运输。哈希身份和资质记录将允许对每个阶段的人员当前的许可进行安全可靠的验证。这是一个关于区块链未来价值的迷人愿景，而其基石现在已经到位。\n\
  \n## 分布式账本的业务采用\n\n数字货币实现的历程并非在真空中发生。软件工具、流程自动化和万维网的演变，以及在开发强密码学和使其脱离控制方面的进步，对业务产生了巨大影响。加密货币出现之前就有了点对点网络，企业一直必须处理相互怀疑的群体，并维护商业敏感和个人隐私信息的安全性，但区块链增加了一个新的维度。比特币白皮书的发布不仅启发了加密货币狂热者，还启发了那些认为底层结构是解决其某些业务问题解决方案的创新者。\n\
  \n迈克·史密（Mike Smith）教授就是这样的创新者之一。在我们的广泛讨论中，史密斯告诉我，在 2011 年阅读白皮书后，他发现这个概念与他产生了共鸣。他曾短暂尝试过挖矿，并幸运地避开了\
  \ 2014 年 Mt Gox 加密交易所的崩溃，但一个业务挑战让他看清了区块链的真实价值。一家斯堪的纳维的数据保护机构向他的一个客户提出了一份非正式投诉，称该业务收集的心理健康评估数据在收集后被更改了。事实并非如此，尽管数据平滑在多个行业中是常见做法。平滑处理用于揭示可能存在噪声或充满极端值的数据集中的趋势和关键指标。然而，史密斯的重点始终在于以原始形式保留原始数据，既为了其基础完整性，也为了信息的未来可用性。\n\
  \n挑战在于向投诉者证明数据是完全按照收集时存储的。史密斯已经测试了 256 位哈希可以从任何数据生成唯一字符串的原理，因此他从合并单日内收集的所有带时间戳的数据集并生成哈希值开始。第二天数据的哈希随后与前一天的字符串进行递归哈希处理，使每一天在链中具有位置完整性：一个带时间戳的区块链。最后，哈希值被广播在三个不同的网站上，因为“数据的多次传输能让人保持诚实”。监管机构能够证实数据未被更改，投诉也被悄悄搁置了。\n\
  \n这种简单的应用反映在区块链最成功的用法中：它是以最合适的方式解决问题的极佳范。分布式账本技术声誉面临的最大威胁，是企业默认将区块链视为万灵药，操纵解决方案以适应自己的需求，并在过程中忽视了原始问题。\n\
  \n## 你真的需要区块链吗？\n\n那句保证让负责任的软件开发者内心陷入绝望的口号是“我们需要区块链”。当一个组织看到问题从地平线向它走来时，直觉反应往往是寻求最新技术作为解决方案。一个经典的例子是英国政府时任财政大臣菲利普·汉德（Philip\
  \ Hammond）在 2018 年 10 月关于英国建议退出欧盟（脱欧）长期谈判期间的反应。面对在爱尔兰岛上确保英国和欧盟之间建立无摩擦陆地边界这一几乎不可逾越的挑战，他抓住新兴技术这根救命稻草，作为维持现有移动自由并避免在历史上困难的地点实施边境控制的方法。“技术正在出现，”他说，“我不称自己是这方面的专家，但显而易见的技术是区块链。”他在认为“新问题必须由新技术解决”这一错误假设上并不孤单。区块链作为广泛潜在解决方案工具包中有效选项的声誉，一直受到对其本质和局限性根本性误解的影响。\n\
  \nCity Web Consultants 是一家软件开发公司，拥有部署各种传统和新兴技术以满足客户需求的经验。创始人亚当·克莱里（Adam Clarey）多年来目睹了一系列新概念和想法从过度炒作的兴奋到承诺未实现时的幻灭。偶尔，会有只想着在不给自己带来多大风险的情况下赚取“魔法币”的人找上门。有些提议没有任何可言的业务模式，驱动力仅仅是使用这项技术并在没有问题需要解决的地方呈现“解决方案”。另一些则具有真正的业务主张，但它们只是追逐了一个热词，而不是通过识别交付所需最合适技术的逻辑过程。区块链不太可能是解决方案：在大多数情况下，真正的挑战更清楚地定义客户的流程。克莱里对炒作通常持怀疑态度。“我还没有遇到任何真正受益于区块链优于任何传统技术的现实项目，”他说。\n\
  \n席卷区块链的兴奋与当代技术不同，很大程度上源于 ICO 热潮中的融资机会。克莱里反思了那个时期的疯狂：\n\n```\n在 2017 年的期间，大量的蠢钱被注入区块链/加密项目，导致人们的贪婪战胜了理智。那些“投资者”忽视了这些项目内部基本的业务模型和/或底层技术，因为[ICO]被视为一种获得巨额回报的方式……我数不清听过多少次“区块链将是下一个互联网”。蠢兔子。自从泡沫破裂人们遭受了损失后，投资者和企业现在变得更加谨慎和具有批判性。只有在技术可能存在真实用例的地方，资金才会流动。\n\
  ```\n\n\n\n\n简易 ICO 融资的衰落使得优秀项目脱颖而出，在这些项目中，透明度和不可篡改性可以带来真正的利益，而使用分布式账本是解决正确问题的有效方案。对于那些互不认识且没有中介的双方，需要一种机制来信任记录的数据，区块链尤为相关。这种需求可能源于治理系统的失效，也可能是因为供应链外的消费者想要确认原材料的来源，或者是由于在没有直接业务关系的商业组织之间需要信任。它还可能涉及数字资产的所有权、托管和交换、奖励机制，以及任何需要去中心化的自动化。与传统软件相比，使用区块链实现了更高的流程效率，特别是在资产追踪、简单供应链以及涉及多个参与方的行政任务中。过去甚至提出过某些从未实现的商业模式，而现在通过分布式账本技术的应用已经可以实现这些。随着区块链在技术版图中占据了自己的位置，人们正经历着从从幻灭到实际应用的转变。\n\
  \n# 区块链在现实世界中的应用\n\n从产品的加工、开采、收获或制造，到终端消费者的使用，区块链应用正在最出意想不到的角落涌现。虽然一个跨越全球的透明账本无缝网络仍是未来主义小说的专利，但目前已有一些商业系统用于食品供应链的认证、奢侈品的溯源以及运输等多个环节。在幕后，得益于这项技术，行政功能正在被重构，它实现了相互猜疑的群体之间的透明度和协作。特别是金融服务行业，迅速识别了机器人流程自动化中可以从去中心化受益的方面，以及与法律行业等其他行业的关系，在这些行业中，信任是系统顺畅运行的因素。银行和审计部门正在开发各种区块链应用，范围从小型概念验证到已部署并扩展的系统。\n\
  \n在大型资本项目领域（无论是公有还是私有），区块链模型正在改进复杂供应链的记录工作，以及从设计意图到建设和运营的决策审批记录。基础设施项目具有长期性，可能持续几十年甚至几个世纪，这意味着依赖公司知识和个人记忆是不可靠的，而且资产在其生命周期内可能会经过多只手手。在资本资产的整个生命周期中，信息的认证是至关重要的。\n\
  \n让我们更详细地看看区块链技术在所有这些领域中开启的一些新商业实践，并研究成功实施区块链的要求。\n\n# 真相\n\n对区块链本质最大的误解之一是它是绝对真理的仓库。是的，区块链中存储记录的不可篡改性确保了交易受到\
  \ Joseph Lubin（原始 `Ethereum` 团队成员和 `ConsenSys` 创始人）描述的“军事级防篡”的保护。你可以确信参考区块链记录认证的交易或文档是原始且未被更改的。但交易的主体是什么？在加密货币的情况下，硬币是从内部生成的，记录的交易涉及来源确定的资产。一旦你跨出虚拟世界并开始将物理实体以数字形式表示，你如何确保通过这些去中心化账本进行不可篡改传输的资产是正确的呢？\n\
  \n## 可靠的初始输入：垃圾进，垃圾出\n\n你不能信任计算机告诉你的一切。几十年来，程序员们一直遵循 `GIGO` 原则：如果任何系统的输入是垃圾，那么无论中间的处理有多好，你得到的结果也将是垃圾。自封的数字破坏者特伦斯·艾登（Terence\
  \ Eden）在参加一个艺术认证和验证平台团队的早期演讲时应用了这一原则。他想，如果被区块链追踪的艺术品不是昂贵的原作，而是刻意认证的伪品怎么办？他的博客描述了他在公司演示期间对这一概念的即兴测试，访问了该平台的早期演示版本^(2)。“简而言之，”他解释道，“我说服他们我画了蒙娜丽莎。为了这个‘证明’，我提供了……一个电子邮件地址[以及]来自维基百科的蒙娜丽莎照片。”\n\
  \n重要的是，`Verisart` 正在努力实现可靠的物理和数字来源验证，该平台现在已应用于艺术和收藏市场，但艾登的恶剧清楚而简单地表明，如果没有可靠的初始输入，区块链记录就不值它们所占的数据位。区块链保证的是交易的真实性，而非绝对真理。对于在物理世界运行的企业来说，需要减少或消除数据输入点产生的人为错误和故意干预风险，大部分工作将依赖于行为改变和激励，以确保交易准确性上更加严谨，这在某些区块链实施中已经被观察到（例如，参见本章稍后的\
  \ `Kraken IM` 案例研究）。为了收紧我们的区块链记录，我们可以寻求其他技术的帮助。\n\n# 与物联网和人工智能的交叉\n\n物联网（`IoT`）为日常物理物品引入了连接，从智能水壶到智能建筑。网络安全提供商\
  \ `Avast` 的首席技术官兼总裁 Ondrej Vlcek 估计，到 2025 年，将有高达 500 亿消费设备在线，更不用说随着数据连接性的提高（特别是主要经济体引入\
  \ 5G 网络后），正在快速部署的数十亿商业传感器、工具、车辆和机器。\n\n这些传感器提供了两点。首先，它们收集的大量数据提供了对世界及其其中人类行为的深度洞察。这告知并训练了人工智能（`AI`）来识别异常；`AI`\
  \ 已用于欺诈检测，减少了不准确数据进入集中或去中心化账本的风险。其次，从传感器到账本的直接通信完全消除了人为界面。这是之前章节讨论的 `IOTA` 区块链的关键要素，也是许多企业区块链可靠运行的保障。\n\
  \n研究人员已经提出了许多与区块链集成的 `IoT` 场景。Huckle、Bhattacharya、White 和 Beloff 的一个著名案例^(3) 描述了一个通勤行程，连接的车辆自主安排路线加油（或充电），同时区块链应用确认驾驶员的身份，触发汽车为该个人设置偏好的驾驶位置，并允许在无人干预的情况下使用智能合约支付燃料费用。\n\
  \n## 案例研究：国家档案馆\n\n\n\n\n英国国家档案馆（National Archives）与萨里大学以及开放数据研究所（Open Data Institute）合作，开展了一项特别的人工智能与区块链结合试点。`ARCHANGEL`\
  \ 项目于 2019 年发表了关于利用区块链强调档案真实性的工作，这不仅展示了一种解决存档挑战的方案，可能对其他媒体的身份验证产生更大的影响。英国国家档案馆的马克·贝尔尔（Mark\
  \ Bell）向我详细介绍了这项为期两年的项目。团队最初开始尝试在归档中使用区块链用例。档案馆提出的挑战之一是，如何管理用于录制和存储视频片段的介质的快速变化。作为消费者，在我们的一生中，我们见证了家庭活动的摄像录像机磁带被转换为\
  \ VHS，然后是 DVD，最后是 MP4。我们如何确保在 MP4 上看到的童年影像与 20 世纪 70 年代那个夏天拍摄的磁带是一样的呢？\n\n通过比较哈希值（hashes）来验证记录的身份已经非常成熟，并已应用于原生数字记录。任何此类文件在发送时都会进行哈希处理，并在作为中心化流程的一部分在部门间传输时于接收时进行验证。团队解决的区块链挑战之一，是研究将相同的技术应用于在出版多年后对大学原始研究数据进行独立、去中心化的验证。视频记录呈现了一个得得的问题。当你从一种格式转换到另一种格式，或者从高分辨率降到低分辨率时，如何验证内容呢？即使内容相同，VHS\
  \ 视频的哈希值与相同且未受损的 MP4 文件的哈希值也会不同，因为格式数据会导致记录发生变化。这正是人工智能介入并增强解决方案的地方。\n\n`ARCHANGEL`\
  \ 团队引入了内容感知深度学习，以剥离记录中特定格式的数据并分离出底层的视频片段。视频记录的每个版本都有与原始文件相关的哈希值，而共同内容是贯穿档案的可追溯哈希值。当记录的透明度需要一条不可变的公共证据链时，区块链就发挥了作用。这是两项互补技术发挥各自优势的绝佳案例。这种区块链的实现还存在英国国家档案馆特有的细节。他们持有的记录根据英国法律可能会封锁几十年：例如，人口普查数据在收集整一百年后才会发布。在这种情况下，即使是文件名也是敏感的。这需要一种许可结构，而\
  \ `ARCHANGEL` 目前正在使用 `Ethereum`，采用开放和关闭记录以及权威证明（Proof of Authority）共识机制。\n\n团队还与国际档案馆进行了试运行，包括美国国家档案馆和记录管理局（NARA）、爱沙尼亚、挪威、澳大利亚的机构以及苏格兰国家记录局。这项工作的重要部分捕捉了存档文档的标准哈希值，并证明了区块链本质上的协作性质。\n\
  \n贝尔指出，当项目在 2016 年启动时，目标仅仅是为档案馆的视频记录开发可靠的身份验证。在过去的几年里，深度伪造（deep fake）视频丑闻浮出，真实性问题被推向了公众视野。对于研究团队来说，这是一个显然的下一步，他们验证受控视频片段的解决方案可以转向识别欺诈内容的任务。发现一个引发新兴技术解决方案的兴起问题，令人耳目一新。\n\
  \n## 来源与真实性\n\n我们已经看到了身份验证领域正在开展的工作。稀缺且高价值的商品是伪造的磁石，而区块链正在帮助应对这种现象。获得可靠的真实性证明是一个问题，而改进的验证则提供了解决方案。\n\
  \n通过追踪组件、成分和材料的来源，购买者可以确信商品符合所有相关的质量标准，并且是正品。减少伪造和提高标准的潜力是巨大的。将简单的来源链与 `smart contracts`（智能合约）相结合，可以平滑参与者的现金流，即使是跨国也是如此。这种区块链技术的应用可能是最先进的，有多个系统正在开发中，一些已处于客户就绪阶段。\n\
  \n## 从生产到消费\n\n### 金枪鱼、芒果及更多\n\n供应链经常被引用为分布式账本技术的完美用例。对制造品源头日益严格的审查、对我们用物品对环境影响的担忧，以及全球范围内不同的健康与安全、质量或就业惯例标准，都可以通过提高透明度和可追溯性来解决。潜在地，从原材料到成品的每一步都可以通过区块链进行记录和验证。\n\
  \n\n\n\n\n金枪鱼供应链场景设想了从捕鱼、监管机构到运输、加工、批发，并最终到达消费者的多个互不信任的参与方参与其中。目前的供应链状态涉及信任关系和对数据的定期验证。企业始终在寻找竞争优势，这可以通过多种方式实现。它们可能会将供应链扩展到信任伙伴之外，减少验证和监管的成本以及行政负担，或者通过在可持续性、溯源和真实性方面提供更高的透明度来吸引消费者。区块链是能够促进这些业务模式变革的工具之一。\n\
  \n建立可靠数字记录的第一步是追踪物理资产，并以可以信赖的方式记录其移动。供应链已经具备了追踪货物的工作流，监管机构依赖于所保留的记录和自身的检查来确保我们的衣服不是在违反健康安全法的工厂制造的，或者确保金枪鱼是由注册船队在正确的水域捕捞的。区块链带来的区别在于将记录锁定在分布式账本中，并允许链中那些与发布数据的组织或个人没有直接关系的参与者对数据进行快速验证。\n\
  \n分布式账本供应链正在全球范围内开发和测试，2018 年 10 月，`IBM Food Trust`区块链作为商业产品上线。在概念验证阶段，IBM 与沃尔玛合作，沃尔玛挑战他们追踪从农场到商店的两个芒果。使用现有系统，这个过程几乎需要一周时间才能运行，而基于区块链的系统在\
  \ 2.2 秒内完成了任务。从那时起，`IBM Food Trust`已被其他北美零售连锁店采用，特别是`Albertson’s`，以及包括`国家渔业协会`(National\
  \ Fisheries Institute）在内的机构。在泰国，传奇榴莲的出口商正与总部位于新加坡的初创公司`DiMuto`合作，将新鲜榴莲转化为可追溯的数字资产，在整个供应链中追踪每一颗水果。\n\
  \n在这样一个复杂的领域还处于早期阶段，有许多问题需要克服，其中尤其是正如我们所知，区块链的优坏取决于输入其中的数据质量。该行业内的机构已经在解决这个问题，从最大的参与者到像总部位于伦敦的初创公司`AgriLedger`这样的企业，后者对价值链的整体方法始于海地农民。当可靠的输入数据与透明度和信任相结合时，这对于伦理溯源的证明、通过智能合约机制进行财富分配，以及减少欺诈和腐败的机会具有深远意义。\n\
  \n## 打击假药\n\n健康供应链中商品来源的真实为敏感，因为药品生产过程中的伪造和人为错误会直接影响患者安全。该行业迅速认识到区块链在解决受损和假药问题方面的潜力。根据\
  \ Clauson 等人在 2018 年发表在`Blockchain in Healthcare Today`上的一篇论文指出，区块链应用不仅可以改进供应链，医疗设备的安全性也具有提升潜力，但当时大多数倡议仍处于概念验证或试点阶段。目前在很大程度上仍然如此，但已获得了日益实质的商业和监管支持。立法已使药品追溯性成为制药公司的战略优先事项，包括\
  \ 2013 年美国《药品供应链安全法》(`DSCSA`）的通过。根据 Rachel Wolfson 在 2019 年 6 月撰写的《财富》(Forbes)的文章，2023\
  \ 年的合规截止日期推动了新流程的发展，而区块链是与`IBM`、`KPMG`、`Merck`和`Walmart`合作的试点项目的核心。沃尔玛的健康保健销售额在\
  \ 2018 年占其美国收入的 350 亿美元，它是区块链技术的坚定支持者，并已加入`MediLedger`财团，这是另一个专注于药品追踪的团体。\n\n为什么区块链是解决这一问题的合适方案？Wolfson\
  \ 报告说，美国医疗行业的碎片化使得去中心化系统成为最合适的结构，确保从制造商到消费者的多方之间的透明度和信任。区块链满足了互不信任的参与者的需求，他们希望在一个透明（尽管是许可制的）平台上呈现可信赖的信息。\n\
  \n## 跨越重洋，跨越边界\n\n企业中任何新技术的实施都必须带来利益，基于区块链的运输保险系统`Insurwave`的引入就是一个很好的例子。货运巨头马士基`A.P.\
  \ Moller–Maersk`在管理其高交易量保险流程的购买和管理复杂生态系统方面面临挑战。船舶频繁易手，因此随着船舶加入或移出保险范围，保费也会随之变化，并为了整体保险风险敞口需要对其资产登记册进行年度核对。第一步是使船舶数据数字化，同时理解现有数据和区块链将启用的新数据点。2018\
  \ 年 5 月，一个包括`安永信`(Ernst and Young)、`微软`(Microsoft)、网络安全专家`Guardtime`以及保险公司`XL Catlin`现为`AXA\
  \ XL`，即 AXA 的分公司）、`MS Amlin`和`Willis Towers Watson`在内的财团推出了基于`R3 Corda`框架的区块链解决方案，通过智能合约合并了现有的数字数据采集和交易。当时采访了`XL\
  \ Catlin`的数字主管`Hélène Stanway`和区块链数字负责人`Ghanshyam Patil`，他们更详细介绍了`Insurwave`项目。\n\
  \nPatil 告诉我，`Corda`在技术上是合适的，因为它的智能合约和验证流程已经非常成熟，并且在系统推出时具有扩展利益者规模的能力。`Corda`框架在金融服务中作为一种半信任网络很受欢迎，这符合财团的需求。尽管保险公司和经纪人需要完全的透明度来保持承保准确性，但其他方必须通过权限进行控制。在商业市场中，使保险交易和保费透明是不现实的，因为每项保险决策都考虑了多个风险因素，这些因素对第三方来说是不透明的并可能导致争议。由`安永信`处理的公证功能提供了保持系统运转的胶水。Stanway\
  \ 解释说，全球资产登记册由公证处持有，智能合约负责在船舶买卖时管理保险交易。该系统利用`IoT`作为账本的主数据录入，传感器通过收集比原始系统能够捕获或处理更多的数据点提供了额外益处。\n\
  \n概念验证在 2017 年成功运行，`Insurwave`于 2018 年 5 月上线。此以后，它扩大了范围，不仅包括船体，还包括每艘船舶的机械设备，并得益于\
  \ 2019 年 5 月与中国珠海港的合作，为拼图增加了另一块碎片。与其他区块链的互操作性也有进展：全球化、整合的供应链系统愿景无法通过孤立的系统来实现。\n\n\
  \n\n\n\n另一个考虑是，如果传感器正在追踪船体的位置，那么你就可以追踪它们内部的集装箱，最终追踪整个运输过程中的货物。Kuehne & Nagel 现核实总质量（VGM）门户已经追踪了装载货物的重量以满足监管要求，并在\
  \ 2018 年，他们引入了区块链元素进行数据验证，并提供运输信息的透明度。随着数据集和记录随时间的推合并，跨越我们海洋的货物图像将变得更加清晰。\n\n##\
  \ 我们的工作方式\n\n后台服务的自动化并不是一种新现象。在 1978 年`VisiCalc`出现之前，简陋的电子表格还是一项需要纸张、铅笔和橡皮的耗时工作。这项计算机时代的“第一款杀手级应用”从根本上改变了财务角色，用代码取代了重复性任务，并将会计职能的重点从计算转向分析和预测。现在几乎没有什么是不是以某种方式实现自动化的，传统审计中的人人工抽样和检查流程除外。\n\
  \n财务及相关职能可能避开风头，但它们在使用新兴技术方面是先驱，推动使流程更加安全、更不容易出现人为错误且更加可靠。我们正在看到人工智能在欺诈检测中的应用、从物联网连接设备和传感器中收集数据、基于智能数据的预测，以及通过区块链技术进行交易认证。分布式账本和三式记账的概念对会计师来说是自然而然的，财务和行政人员也迅速利用了这种在流程去中心化方面的天然优势。金融科技（fintech）领域在银行、托管、证券管理和审计透明度方面已取得了重大进展。\n\
  \n## 金融去中心化\n\n传统的中央化银行系统初看似乎在没有区块链的情况下运行得完美。公众对银行支付的感知（特别是在手机触碰传感器正成为常见支付方式的世界里）是趋于简单和快速的。然而，在背后，这是一个涉及多个账户复杂对账的故事，行政负担重且完全基于账本。如果一笔付款从一家银行转移到另一家银行，交易中会有多个立即参与，这种繁琐的结构是分布式账本中进行重构的理想人选。没有理由不使用许可区块链方法来管理法货币。这不需要创建现金，因此不需要进行挖掘，但资金转账和所有相关交易仍可以由分布式双方（即银行和账户持有人）进行不可篡改的记录和确认。\n\
  \n由智能合约驱动的区块链系统可以提供更高的透明度、对记录完整性的信心以及长期的成本节省。金融服务和银行顾问 Kapil Dhar 告诉我，在银行和金融服务领域，正中中进行大量的协作分布式账本开发。随着银行评估其后台职能中的去中心化用例，多个领域正在以概念验证的规模进行试点。预期的收益包括潜在的重大的规模经济效益和范围经济效益。最成熟的项目已经解决了跨境支付应用，而且全球范围内多个国家银行业界对\
  \ `Ripple` 分布式账本的使用正在加速发展。`Ripple`（使用其 `XRP` 代币进行转账）和最近的竞争对手 `Stellar`（使用 `XLM`）是专为管理跨境支付设计的金融科技技术。某些系统已经上线，包括桑德银行（Santander）的`One\
  \ Pay FX` 应用程序，它是首个向消费者推出的区块链驱动的外汇系统，于 2018 年 4 月在英国及其他几个国家发布。在证券市场，所有权转移已经在使用分布式账本进行。首次此类转移发生在\
  \ 2018 年 3 月瑞士信信（Credit Suisse）和 ING 之间，2019 年 4 月，摩洛哥和科威特的中央证券结算机构成功试点了跨境证券结算。银行业的另一个重点是数字身份识别工作，以改进“了解您的客户”（KYC）流程并打击洗钱活动。\n\
  \n实用的区块链应用正出现在多个金融服务领域，一家名为北信信（Northern Trust）的机构通过一系列美国专利推进了区块链技术。\n\n## 案例研究：北信信\n\
  \n2018 年 3 月，北信信为其位于根西岛的私募股权业务部署了针对其 2017 年 1 月发布的私募股权区块链产品的一系列新增强，其中一个系统可以使他们的审计机构`PwC`（道永）以及`KPMG`可以直接访问基金交易，允许对私募股权生命周期事件进行实时审计。北信信全球产品创新主管\
  \ Anthony Stevens 解释说，这项工作始于客户入驻和简化私募股权生命周期事件，例如使用更“传统”技术开发的功能进行催资事件。当与需要访问基金事件真实“黄金副本”（golden\
  \ copy）数据的公司交互时（监管机构和审计公司就是良好的例子），产品开发的区块链方面变得非常重要。外部方可以访问系统上的节点，并开发了技术，当特定数据点被添加到节点时发出警报，使他们能够按提取数据。由于这项简单的创新，审计师报告说，他们在首次推出中涉及的私募股权账户工作上，运营量显著减少。\n\
  \n用于私募股权服务的底层区块链需要时间来稳定。初始栈构建在`Ethereum`之上，随后移动到 IBM 云上支持的 `Hyperledger`，最后移动到 Azure\
  \ 云上`Hyperledger`的开源 `Fabric` 框架。首次实线催资是在 2017 年通过区块链上处理的，包括 Emerald Technology\
  \ Ventures 在内的基金经理从 2018 年中期开始通过该应用程序处理多次催资。该系统在 2019 年 6 月，当北信信宣布将其业务转交给 `Broadidge\
  \ Financial Solutions` 时，该系统在可扩展性方面达到了一个重大的里程碑。初始部署将平台范围扩大到特拉华州，`Broadidge` 在那里继续大规模开发系统功能。将业务转交给\
  \ `Broadidge` 的目的是让整个生态系统以快得多的速度开发，并让参与私募资产类别的所有方都能访问北信信开发的突破性技术。\n\n\n\n\n\n北方信托（Northern\
  \ Trust）的创新仍在持续。Stevens 及其团队将注意力转向私募股权业务中一些管理上的棘手问题，探讨区块链是否能为他们的某些特定挑战提供可行的解决方案。\n\
  \n### 经济实质条例（Economic Substance Regulations）\n\n第一项与针对在根西岛（Guernsey）注册的企业的新版经济实质条例有关。在位于法国离岸的英国王属殖民地注册，对某些金融机构具有诸多优势。经济实质条例于\
  \ 2019 年 1 月推出，旨在确保在该岛上运营基金的公司能够向当地监管机构证明，它们是根据当地规则管理基金的，提供了流程透明度，并确保企业在岛上注册的利润反映了“经济活动和实质性的经济存在”。这种对经济实质的证明还要求董事在对董事会和法定事项进行投票时，必须证明其身体位于该岛，以此作为业务在管辖范围内得到妥善指导和管理的证据。\n\
  \n与 Mike Smith 教授在面对斯堪的纳维亚监管机构查询客户数据时采取的方法类似，北方信托开发了一个移动投票应用程序，并从董事设备中收集 GPS 数据，对位置和投票进行哈希处理和时间戳，以满足当地监管规则的要求。在非常常见的情况下，如果董事因休假或更有可能是因大雾导致机场关闭而确实无法到达该岛投票，则将使用航班预订和取消记录等意图证明来代替\
  \ GPS 数据，以便在进行基金审查时提供所需的证明。\n\n### 法律协议与智能合约\n\n团队随后注意力转向了管理私募股权基金的法律协议。不同基金的要求可能复杂，因为必须考虑伦理投资或个人信仰等方面的选择。围绕基金的法律协议必须确定在个人案例中适用的任何排除项。例如，一组投资者文件可能规定不投资酒精、军备或在特定国家注册的公司。这些必须被翻译成适当的法律术语，并在基金管理中执行。\n\
  \n北方信托与科技初创公司 Avvoka 合作（该公司是 Allen and Overy 律师事务所内部一个加速器计划的一部分），开发了直接从数字法律协议将法律条款部署为智能合约的能力。`Avvoka`\
  \ 引擎持有法律协议的模板，该模板可以根据代表客户的律师事务所的偏好进行适当解析。排除要求通过从智能合约库中简单的拖拽来选择，并以律师要求的语言整合到法律协议中。这避免了将标准的排除措辞强加于复杂的文档，同时保留了智能合约的底层一致性。一旦批准并签署，协议将记录在链上，并直接从该文档生成智能合约。这种工作流通过转换流程并从开发人员的需求开始，避免了编码法律协议细节的挑战。\n\
  \n用于排除目的智能合约开发正在进行中：随着条款变得越来越复杂，自动化必须随之而来。例如，对从酒精获利的的公司投资排除是否仅适用于饮料公司，还是适用于收入中仅小部分来自该行业的集团？还存在在智能合约整合到区块链后对其进行更改的问题，北方信托在该领域一直领先，并拥有多项解决该过程的专利。例如，重新任命审计师是数字董事会会议的一个议程，投票结果会自动触发相关智能合约的延长或更换，并根据需要更改任何权限。\n\
  \n通过专注于特定细分领域的需求，这项工作成功证明了区块链可以成功应用于审计流程。我们将在 `第 7 章` 中更深入地探讨会计和审计更广泛领域的挑战。北方信托的工作还交付了在供应链管理中非常有价值的工具。\n\
  \n### 无信任经济中的协作\n\n区块链在关键方之间存在联系且需要提高效率、透明度和真实性的业务社区中正受到关注。它还在影响那些层级结构中同级双方之间没有信任关系，但所有人都向一个中心点提供相关输入的领域。他们可能不愿与同级的竞争对手共享信息，但必须向其上级保持透明。区块链技术在为机密数据存储库叠加加密层方面可以发挥作用，并允许只有拥有正确密钥的伙伴进行访问。\n\
  \n医疗记录立即让人想到这一问题仍然存在的领域。电子健康记录传统上存储在提供者层面，导致不同数据库之间出现碎片化和不连续性。这在像美国这样的私人医疗系统中是如此（数据由一系列提供者单独持有），在像英国国家医疗服务体系（NHS）这样的公共系统中也是如此（数据在地理区域\
  \ NHS 信托内部被孤立）。解决患者记录复杂性的最早试点之一是由 MIT 的 `MedRec` 项目团队于 2016 年在 Beth Israel Deaconess\
  \ 医学中心启动的。该白皮书提出的“使用区块链替代中心化中间环节的分布式访问和验证系统”。`MedRec` 系统具有将个人注册 ID 链接到系统（`Registrar\
  \ Contract`）、将患者链接到他们使用过的每位提供者（`Patient Provider Contract`）以及为患者形成回溯路径（`Summary\
  \ Contract`）的机制，该路径连接回他们的提供者，并作为允许他们随时访问或下载历史的备份。2016 年 `MedRec 1.0` 的概念验证是成功的，为了将系统扩展到原始试点范围之外并增加医疗记录的安全性，为\
  \ `MedRec 2.0` 提出了一种新架构，该架构正在建设中。\n\n### 案例研究：Gospel Tech\n\n医疗保健涉及数据的个人敏感性意味着 `MedRec`\
  \ 项目的进展比某些类似原理的商业应用要慢。位于伦敦的 `Gospel Tech` 采取类似的方法为航空行业的客户解决了敏感数据共享和协作问题。他们解释了导致他们采用基于区块链解决方案的数据悖论：\n\
  \n传统的基础设施意味着关键数据汇集在孤岛中，受到日益复杂的安全层保护，而当员工为了协作而绕过安全规程时，这些保护最终会退化。讽刺的是，这种对防止数据移动的关注使企业更容易受到泄露或失去数据的控制，同时也限制了数据对业务的真实价值。\n\
  \n\n\n\n\nGospel 数据平台帮助公司及其供应链在安全、放信的情况下共享敏感数据，而不会暴露过多或错误的信息。其底层是一个使用拜占庭故障容错共识机制（`pBFT`）的私有许可链区块链，该机制在不损害机密性的前提下，对所需信息进行细粒度、授权的访问。正如\
  \ Gospel 所解释的，在他们的系统实施之前，其中一个客户通过定期召开会议比较电子表格的版本，来管理跨越整个供应链的飞机零件追溯。而现在，所有相关方都参与到了一个\
  \ `Gospel` 节点网络，并访问“单一事实来源”。区块链作为每个节点现有基础设施的扩展，横跨各种不同的供应商系统，允许用户使用其本地凭据进行无缝且安全的登录。零件追溯的延迟已缩短至几分钟，显著提高了整体效率并降低了成本。\n\
  \nGospel 平台还被应用于人力资源和薪资处理领域，用于管理异构系统之间复杂的数据流。在 2019 年 4 月接受《计算机周刊》采访时，`NGA HR` 技术官\
  \ Stuart Curley 不仅强调了使用 `Gospel` 区块链层的简单性和安全性，还强调了对数据所做的任何更改保持不可变记录的重要性。这种身份认证、验证和透明性的主题贯穿于每一个成功的区块链实施案例。\n\
  \n## 管理我们周围的世界\n\n将焦点从供应链和后台职能扩大后，对我们周围基础设施的管理也可以受益于区块链和分布式账本的使用。目前有两个领域的发展正在飞速进展：一个是能源分配的管理，另一个是解决大型资本项目的全生命周期周转问题。\n\
  \n### 去中心化能源\n\n向家庭和企业提供公用事业供应是复杂的，且几乎无例外地是中心化的。这反映了我们所消耗资源的历史性供应结构。能源就是一个典型的例子：一个多世纪以来，我们一直依赖于使用化石燃料、核能、水电大坝、废弃物和可再生能源的大型集中化发电厂。然而，技术正在飞速发展，发电不再是真正的中心化。太阳能电池板正出现在世界各地的屋顶。工厂由其自己的风力发电机森林提供动力。为什么电力的供应不能像它的生产一样变得去中心化呢？\n\
  \n能源市场存在着真正的变革动力。西门子数字电网（`Siemens Digital Grid`）技术与创新经理 Dale Geach 告诉我，市场面临着压力，需要以可持续、高效且韧性的方式满足社会的能源需求。这就是“能源三难问题”，而解决方案在于能源管理数字化的转型趋势以及向分布式系统的迁移。\n\
  \n早早在 2016 年，德国能源署进行的一项调查显示，在受访的决策者中，有近四之三意识到区块链的潜在影响，39% 的人已经在规划区块链的应用，13% 的人已经在测试点对点交易、电动汽车充电以及使用区块链进行支付。研究人员发现，区块链可以改进的领域包括电网账单管理、身份管理、智能合约驱动的机制、去中心化网络和数据传输以及批发能源市场的变革。在这些领域中，以消费者为中心的去中心化市场正趋于实现。\n\
  \n### 微电网与产销者的兴起\n\n随着家庭可再生能源发电变得常态，许多家庭既是消费者又是生产者。这些“产销者”是微电网的核心组成部分。根据定义，微电网已经使用了多年：它们涉及局部生产者和消费者。`Engie`\
  \ 将微电网描述为“围绕局部发电设施建立的能源供应网络。它设计为自主运行或与国家电网同步。”在偏远地区的微电网效率已经建立并测试了很长时间，例如加拿大的哈特里湾微电网最初建立于\
  \ 2008 年，其时间早于 `Satoshi` 白皮书和可再生能源的大规模采用。\n\n哈特里湾项目的目标是展示智能计量和需求响应，这是全球范围内微电网演进的三大重大进展之一。随着智能电网和智能电表在现有基础设施中部署，收集到的消耗数据变得更加详细和丰富。这有助于机器学习进行预测，辅助微电网的规划和设计。在操作层，智能电表还将准确账单功能纳入微电网的管理。第二个关键进展是可再生能源技术的效率提高，使发电进入房主、房东和企业。最后，区块链技术的出现为微电网网络中的多个独立参与者提供了纽带，并通过透明化来了恶意行为。\n\
  \n虽然现有社区的微电网依赖中心化的能源，但去中心化的微电网可以从多个不相关的来源获取能量进行局部分配。分布式账本使微电网能够作为去中心化网络运行，降低生产者和消费者的成本，并提高透明度和问责制。一个完善的去中心化微电网最终将维护单个发电器的账本，处理贡献给电网的千瓦支付。\n\
  \n随着 2050 年净零排放截止日期在资本项目方面比我们想象的更近，变革的紧迫性推动着发展。能源创新者 `LO3` 是多个项目的幕后推动者，包括纽约的布鲁克林微电网（`BMG`）、澳大利亚的\
  \ `Enexa` 交易能源以及德国的 Allgau 社区能源项目。\n\n\n\n\n复杂的工程资产（如离岸平台、发电站和工艺工厂）具有明确的生命周期，从设计意图到建设、调试、运行，直到报废和回收。处置阶段的挑战尤为关键，因为这些知识在数十年的时间里会流失。如何在整个资产生命周期内可靠地保留这些知识呢？\n\
  \n2003 年，四艘被称为“幽灵船”的过时美国储备舰队船体抵达英国海岸，由专家级回收作业人员进行拆解。在因环保抗议延迟了五年后，位于哈特尔普尔（Hartlepool）的\
  \ Able UK 环境回收与循环中心终于开始拆解这些船只，处理污染物并尽可能回收材料。位于提斯河河口的 Able UK 船厂依然忙碌。它曾负责拆解传奇的法国航空母舰“克莱门梭号”（Clemenceau），并就在距离新建钻井的码头几英里处定期拆解油气钻井平台。尽管油井平台像产卵鲑鱼一样回到出生地的提斯河，但仍存在知识断层。当地传说说，其中一个平台上有一根\
  \ 36 英寸的管道，其用途在时间的迷雾和记忆中消失了。那根管道里流的是什么？拆解者应该考虑哪些污染物？金属回收是否安全，还是属于废料？在没有记录账（ledger\
  \ of record）的情况下，由于处置变成了风险最低的选择，宝贵的资源正在流失。\n\n位于泰斯赛德（Teesside）的 Kraken IM（信息管理）承担了这一复杂供应链的挑战，现在正与全球油气巨头合作，将现有的“记录系统”转变为真正的“记录账”。他们的初期重点是确保在建设期间能够获得来自各个制造商和承包商的所有相关信息，并确保这些信息足以船舶、平台、发电站或其他大型资本资产的调试和运行。这是一项复杂的任务：记录必须涵盖从提供\
  \ 10,000 个灭火器到建造工艺工厂的方方面内容，并且在构成整体的各种部件中具有相当的质量。正如首席执行官 Ian Cornwell 所解释的，一个耗资数十的项目可能涉及超过百万件单件设备，每件设备的数据必须包括设计意图、功能、材料以及维护手册等运行信息。目前有许多竞争性的记录系统以及运行这些系统的团队持有这些丰富的数据，因此，通常需要系统集成器来理解这些补丁般的信息。这为本已高度复杂的项目增加了额外的成本和复杂性。此外，在资本资产数十年的运行期间，数据可能会在不同系统之间传输，并伴随着此类传输总是涉及的所有额外成本、现场匹配挑战及失败。这是混乱和浪费的根源。\n\
  \nKraken 的愿景是推动行业从“记录系统”转向“记录账”，将一个以文档为中心的行业转变为以数据为中心的文化。Cornwell 举了项目某个方面的例子，其设计意图是“我恰这里需要一个泵”。这会有工程要求、标准和当地法规限制，这些因素会影响要求供应商投标的规格。供应商可能会提出略有不同的材料，根据他们的经验，这种材料在特定环境下更有效。甚至在泵安装之前，针对设计意图可能已经发生了更改。记录每一个审批阶段可以确保在调试时，操作人员能够清楚地知道供应了什么。这是向生命周期末端更高清晰度的一步，届时资产可以根据供应的实际情况而非初始设计文件进行拆解。针对建筑、工程、施工和运营（AECO）的完整记录账将提供透明的资产历史，足以最大限度地提高回收努力，为工程设备创造真正的循环经济。\n\
  \nKraken 开发的 Halcyon 信息管理平台最初关注项目生命周期中供应与调试之间的审批里程碑。审计追踪显示了某物品何时供应、由谁供应、它是什么、它与原始设计意图相比如何，以及在建设过程中影响它的决策。这一不断增长的数据库不仅支持资产生命周期，而且比孤立的文档系统提供了更大的分析和决策空间。Kraken\
  \ 必须克服一个采纳方面的障碍：说服工程师放弃他们的文档，转而信任数据。正如 Cornwell 所解释的，“我们唯一关心的是来源（provenance）。我们已经有一套审批工作流，但证明某物何时签署的以及它具体是什么，为其他功能开启了大门。”\n\
  \n区块链的透明性和不可篡改性提供了解决方案。通过将日期、时间和审批细节锚定到 Tierion Chainpoint 网络上的交易中，他们现在拥有了签署的来源证明。他们还实现了那些不像记录系统暗示那样静态信息的透明化。整个项目过程中的决策和规划依赖于易于获取的数据。例如，在规划建设物流（如为作业租赁合适的起重机）时，能够定义由许多组件制成的单元重量至关重要。\n\
  \n我感兴趣的事情之一是 Kraken 在记录账可靠主入口（prime entry）方面的经验。区块链给了我们对交易的信任，但它并不是绝对真理库。用户如何确保里程碑记录得准确？根据\
  \ Cornwell 的说法，让交易对所有人可见的操作使得人们对录入本身更加严谨。这令人欣慰地反映了数字资产交易公开公告的原始概念，正如大卫（Wei Dai）在\
  \ 1998 年概述并在 Satoshi 在 2008 年比特币白皮书中采用的：可见性是信任的仲裁。此外，Kraken 的客户观察到，由于产生了不可篡改的记录，实际的审批过程变得更加严格。工程世界天生规避风险，特别是在处理石油、天然气和核能等危害时。随着责任变得越来越沉重（例如在伦敦\
  \ 2017 年格伦菲尔塔灾难的 Hackitt 报告发布后），知晓可能需要在调查中对决策负责的方会非常谨慎地确保办事正确。\n\nHackitt 报告要求默认数字化的产品规格和组件的持久身份，这是\
  \ AECO 供应链的最终目标，相关建议已于 2019 年 6 月进入公众咨询，如果通过，持久身份和可追溯性将成为英国法律。全设备可追溯性不仅对安全具有深远影响，还能使决策从“初始资本支出最低”转向“资产生命周期内总支出最低”。这种对资本资产生命周期的整体方法可能在未来的某，但基石已经就绪。\n\
  \n## 大规模企业区块链\n\n\n\n\n\n得益于务实的问题解决能力、寻求下一个大风口的人才进入该领域，以及底层框架的发展（包括 `Hyperledger`\
  \ 套件、`IBM Blockchain`、`Ripple` 在金融科技领域的早期创新以及源自 `Ethereum` 的衍生项目），分布式账本在私营部门的采用进展得相当快。\n\
  \n私营部门周围的商业迫切需求驱动开发主要转向许可链区块链。这种碎片化现象被比作企业采用互联网和万维网的阶段：在采用更开放的系统之前，企业先采用了私有内网和公告板；而随着基础设施安全性的提高和信心的增强，本地托管服务器现在正逐渐被云存储取代。人们对私有链的长期扩展性存在担忧，其中显而易见的问题是：在一个没有原生加密货币的区块链中，一旦网络扩展到已知参与方之外，适当的信任机制是什么？这个问题以及其他问题已经由分布式账本演进前线的开发者们着手，未来十年将变得特别有趣。\n\
  \n在一个不受商业敏感性限制的世界里，区块链技术可以实现什么？让我们转向源自不同领域的的进展：游戏世界。\n\n# 第 5 章\n\n### 数字猫将改变世界\n\
  \n在万维网诞生 30 周年，提姆·伯纳斯-李（Tim Berners-Lee）证实了我们所有人私里相信的。记者萨米拉·艾哈迈德（Samira Ahmed）问：“你觉得网上会有这么多猫吗？”伯纳斯-李回答道：“一直计划如此，用猫视频填充互联网。”开玩笑之，互联网的社交属性在技术开始进入我们的家庭时并没有被预见到。万维网的早期用途反映了我们当时的习惯和活动，使它们变得更高效、更易获取，但从根本上没有改变。我们发送电子邮件或建立网页，而不是写信（对我以及对许多人来说，坦率地说，这些确实包含了相当数量的猫图片）。我们逐渐信任互联网商店存储我们的信用卡信息并确保其安全，将购物转向线上。猫视频的兴起源于\
  \ `MySpace`、`Facebook`、`Twitter` 等新的社交构建以及现在环绕我们的平台爆炸，并源于点对支付之前的点对文件共享。我们的行为因为技术而改变，如果没有技术，这些就不会发生。\n\
  \n### 创新游戏\n\n企业主导的创新的危险之一在于，它存在维持成功业务模式的基础需求。遵循“如果没坏就不要修它”的原则，即使是最有创意的公司也会发现自己仅仅在为了降低成本进行迭代，或者为了更快地完成本质上未变的现有流程。行为的激进改变带来的风险，对于那些渴望在短时间内实现回报的投资者来说有时太大了。当技术出现时，投资回报率可能很难量化。项目评估人员将难以为传统的收益率或净现值计算提供长期现金流入的估计。另一方面，正如我们所看到的，创新本身也具有同样的风险。如果在明确定义问题之前就开发出解决方案，一些出色的想法就会被遗弃。如果对不愿意配合的主体强加新的工作方式，职场转型将是极其失败的。如果行业的一端受限于规避风险，而另一端是不考虑相关性而过度热情地采用新技术，那么真正新的概念何能在何处生根发芽呢？\n\
  \n有一个行业的伟大强大之处在于其想象力。区块链领域最令人兴奋的创新正来自游戏行业。这并不意外：游戏一直是我们在技术领域已经经历过的其他重大转变的根源。触摸屏以及虚拟、增强和混合现实等用户界面在进入企业主流市场之前就已经在游戏领域被采用。作为互联网和万维网开发的垫脚石之一，伊利诺伊大学\
  \ `PLATO` 系统上的多玩家游戏 `Empire` 仍被尤金·贾雷茨基（Eugene Jarecki）怀念地提起，他在 20 世纪 70 年代小时候玩过它。21\
  \ 世纪人工智能的爆发很大程度上归功于玩家对更快的玩法和更详细画面的需求。硬件跟进以跟上这一丰利行业的需求，而为游戏生产的新一代图形处理器（`GPUs`）也使人工智能核心的复杂数据分析和算法学习成为。\n\
  \n游戏激发了某些如果没有区块链就无法实现的概念，新的行为正在涌现，这些行为将影响我们日常生活，无论在家还是工作中。资产所有权通过使用非同质化代币（`NFTs`）及其独特、不可分割的属性来代表单个物品，已经拥有了自己的生命。当行业一直在探索\
  \ `NFTs` 在资产孪生中的应用时，游戏行业已经掌握了这一概念并付诸行动，引入了去中心化的所有权，并为全新的、充满活力的经济奠定了基础。同时，开发者必须应对游戏处理的交易量与区块链上可以物理记录的数据量之间的容量挑战。当你拆解规则时会发现游戏是非常复杂的。我们很少有人意识到在决定下一步行动时，内部执行了多少处理。为了实现有效的自动化游戏，必须对每笔交易的价值以及是否有必要将所有内容记录在链上做出艰难决定，而且管理每一步操作的\
  \ `smart contracts` 必须高度高效，为玩家节省尽可能少的交易手续费，并用最短的时间完成验证。\n\n游戏创新正在快速发展，对未来的业务模式和商业行为具有影响。让我们详细详细观察它们。\n\
  \n### 游戏心态\n\n游戏中的所有权是欺骗性的。当你走了几英里去捕捉或孵化一只稀有的 `Pokémon`，赢得或支付了大量资金为《愤怒的小鸟》到《堡垒之地》等任何游戏中的角色购买特殊服装，或者开采材料建造你的钻石城堡时，你会感觉自己真的拥有了某些东西。你可以和朋友比较\
  \ `Minecraft` 世界，并在多玩家环境中自豪地炫耀，但实际上，“你的”资产仍然稳固地留在游戏公司的服务器上，或者静态地存在于你许可的游戏副本中。正如\
  \ Deckbound 的 Gareth Jenkins 在 2018 年区块链游戏峰会上解释的那样，玩家们已经为区块链做好了准备：这符合他们的心态。他们对在游戏过程中创造和赢得资产拥有所有权持有预期，包括买卖物品的能力。许多角色扮演游戏（`RPGs`）中已经存在用于交换物品的市场平台，但资产本身并不属于交易它们的玩家。转变为具有个人所有权的状态感觉是自然的一步，并为玩家开启了新的大门。区块链提供了实现这一点的媒介。\n\
  \n\n\n\n\n这是老牌游戏巨头 Atari 寻求创建代币的动力之一。在与 Atari Token 创始人 Daniel Doll-Steinberg 交流时，我们讨论了支撑这一及区块链其他发展的虚拟世界理论。现实世界的价值是通过出售你的技能、时间或资产创造的，如果游戏具备了执行相同经济和货币原则的机制，虚拟世界也可以创造类似的价值。通过在控制台上花费数小时磨练的技能开始在最高水平提供可迁移的现实世界价值。我们正见证电竞的崛起，例如英语电子足球赛\
  \ `ePremier League` (`ePL`)；而在新生一代一级方程式赛车手手中，19 岁的兰多·诺里斯（Lando Norris）将其部分成功以及在赛道上判断其他车手的能力归功于多年的模拟赛经验以及参加\
  \ `McLaren Shadow Esports` 赛的经历。甚至是《堡垒之夜》进入了竞技场，其 2019 年在纽约举办的世界决赛向数百百万粉丝直播。然而，直接在游戏平台内通过技能、时间或投资获取价值（而非通过离散的比赛），是一个完全全新的机会。如果能被利用——而区块链提供了实现这一点的途径——随后的价值创造将开启一个可持续的、民主化的全球经济。这就是游戏的颠覆性愿景，它驱动了小型敏捷公司的发展，而\
  \ Atari 也意识到了这一点。\n\n### Atari Token 的开发\n\nAtari 代币的开发过程比其他更知名的区块链游戏项目缓慢得多，且公开程度较低。作为一家纳斯达克上市公司，Atari\
  \ 无法像小型企业和初创公司那样敏捷地投入 ICO 领域，但他们的愿景引导他们在复杂的纳斯达克监管规定下规划代币销售。Doll-Steinberg 反思了为项目开发结构面临的压力，既要让创始人在创新环境中感到舒适，又要满足监管要求。他记得目睁睁看着一些几乎或没有业务经验的团队筹资并迅速失败，而\
  \ Atari Token 的高技能创始人们却在走一条漫长的路。更敏捷的独立公司在计划的公开信息方面很大大方，但 Atari 受限于上市公司的，不能发布任何可能影响其股价或违反严格内幕交易法的信息。得益于\
  \ 2018 年 2 月巴黎证券交易所强制报告中的几行文字，媒体关注了这个故事，但此时 2017 年的牛市已经崩溃，ICO 黄金热正在迅速消退。ICO 计划在\
  \ 2018 年夏天被放弃，但 Atari 持续进行内部投资。\n\n### 区块链游戏市场趋势\n\n区块链游戏的大部分开发集中在小型公司身上。这是我们在颠覆性创新中预期的。当互联网开始获得关注时，现有的市场领导者未能跟上浪潮，从车库出发的\
  \ Google 和从宿舍出发的 Facebook 超过了他们。在游戏领域，大公司还没有动力改变策略。它们的业务模式是盈利且可持续的，它们与所有行业的大型企业处境相同，尚未准备好或无法实验并承担影响底线的的风险。然而，当转折点到来时，Atari\
  \ 至少准备好了做出反应。\n\n目前不受监管要求限制的创新者正在产生什么样的颠覆？从数字资产所有权中创造价值是第一个被实现的来源，而投入的时间和开发的技能的回报也远在不了。现在让我们关注数字猫，看看它们将如何改变世界。\n\
  \n### 加密猫与非同质化代币\n\n如果说猫视频是现代全球维网的标志，那么数字猫就是区块链和加密货币的旗手。当首个高著名的区块链游戏 `Cryptokitties`\
  \ 在 2017 年 11 月推出时，它立即吸引了区块链社区的注意力。`Cryptokitties` 市场在发布后的前几天内进行的交易量巨大，以至于 `Ethereum`\
  \ 网络难以应对这种负载。这种兴奋并不完全是因为终于为你的加密货币提供了一个有趣的突破口。敏锐的开发者在阅读源码后意识到，一旦你购买了你的卡通猫，你就拥有了这只可爱猫科资产的绝对所有权。进一步的检查确认了当你将两只猫配对时，你拥有后代，而且每只猫都有从父母遗传并由执行育种交易的\
  \ `smart contract` 定义的特征组合。每只猫的基因代码都作为非同质化代币 (`NFT`) 记录为独立的数字资产。我们在第二章中提到过编程货币：让我们回顾一下。\n\
  \n### ERC 20、ERC 721 和 ERC 1155 代币\n\n代币不仅仅是专利货币，它可以是价值的衡量、非货币资产或社区中的影响力。大多数基于 `Ethereum\
  \ Virtual Machine` 并包含其原生货币的商业应用都在使用所谓的 `ERC20` 代币。`ERC` 代表 `Ethereum Request for\
  \ Comment`（以太坊意见请求），指的是开源社区中相关的讨论，这些讨论导致了每种代币的发展。从编号可以明显看出，有很多提议被讨论，但只有少数是可行的并被开发者社区采用。`ERC20`\
  \ 是数字现金：这些代币通常被称为山寨币（alt coins），它们的行为像钱。所有代币都是相同的且可分割的，就像美元钞一样。数千个 `ERC20` 代币被创建出来。许多已通过\
  \ `ICO` 用于商业众筹，其中一些随着相关应用的获得关注而保留并增加价值，另一些则一文不值。此类代币通常被称为“垃圾币”（shitcoins），而无价值的持有物在投资者中被称为“尘埃”（dust）。大多数基于区块链的游戏直接使用\
  \ `Ether` (`ETH`) 进行游戏内购买和操作，尽管少数游戏在奖励和留存机制中内置了自己的 `ERC20` 货币。\n\n游戏利用了另外两种具有特殊属性的\
  \ `ERC` 代币。`Cryptokitties` 游戏及类似游戏采用了 `ERC721` 作为其选择的代币。`ERC721` 是独一无二的代币。它们仍然可以自由交换，但每个代币的个体相对价值将根据其特定特征、唯一性和稀有性而异。在技术术语中，这意味着代币不是同质的。同质性（fungibility）是货币的一个属性，例如，任何美元钞都可以用来购买价值一美元或更低的饮料，差额构成了稳定的交换价值。相比之下，非同质化代币\
  \ (`NFT`) 代表独特的、离散的物品，一种收藏品，根据自身的属性和买家的感知拥有自己的价值。\n\n在 `Cryptokitties` 的背景下想象 `NFT`\
  \ 非常简单。尽管所有的猫都有基本的卡通轮廓，但由于赋予了它们的基因特征，每只猫都略有不同。某些人发现某些特征具有吸引力，并对紫爪猫或另一只驾驶卡丁车的猫赋予主观价值。它们也是不可分割的：你不能把它们切开，那是残忍的。\n\
  \n\n\n\nNFT 代表了一个突破性的概念，它正向在线游戏世界之外的其他领域转移。现实世界中哪些资产是独特的，并且能够在并行数字世界中准确且不可篡改地表示？这是私营和公营部门正在研究的问题，并将推动出处、投资、财产所有权、资产孪生及其他应用的变革。\n\
  \n`ERC1155` 标准于 2019 年 6 月定型，将同质化代币和非同质化代币类型统一在一起。该代币由开发者 Enjin 推动并受到广泛的以太坊开发者社区的支持，允许单个智能合约管理游戏内不同类型的资产。正如\
  \ Enjin 的 Witek Radomski 所解释的，在幻想角色扮演游戏中，同质化类型“适用于不需要区分的堆叠物品，例如用于弓的一束箭矢”，而“一只宠物龙……可以是一个\
  \ NFT，并拥有自己独特的名称、力量等级以及在游戏中的丰富历史。”\n\n现在，由于所有类型的资产都可以被拥有，我们开始看到从投资中产生的价值创造。各种游戏中的机制允许收藏者增强他们的猫咪并提高其转售价值，训练他们的宠物龙以获得更高的价值和更大的游戏成功，甚至将虚拟土地租给其他玩家。玩家赋予资产的价值是独特游戏心态的另一个方面：对游戏的投资。\n\
  \n## 付费游戏\n\n令人立足观察的是，区块链领域的游戏玩家愿意付费玩游戏。每种代币都必须购买，或者支付交易费以在游戏过程中生成新代币（例如，在繁殖新的 `Cryptokitties`\
  \ 时）。在我们已经习惯于免费获得东西的世界里，这看起来可能是一个违背直觉的发展，但正如许多平台和出版机构后才发现的那样，免费模式在长期来看对于经济上的成功是不可持续的。将货币文化带回主流对于奖励创作者和替代经济的可持续性都具有积极意义。至关重要的是，它将焦点从纯粹为了游戏乐趣而消费（例如在标准游戏中为升级付费）转移到可能对玩游戏所投入的时间和金钱获得回报。\n\
  \nAltitude Games 的加密游戏企业家 Gabby Dizon 在我们 2019 年 5 月交谈时定义了区块链领域玩家的三个特征：\n\n1. **收藏者**：他们对购买和持有游戏中某些较稀有的\
  \ NFT 最感兴趣。他们等同于现实世界中的爱好者，享受他们的收藏，并随着时间的推移通过增加和出售资产来获得乐趣。从长期来看，他们可能从中活动获利，但赚钱并不是他们的首要动机。\n\
  2. **投资者**：他们心中有明确的回报。他们希望从购买的资产组合中获利，或者至少赚到足够的钱收回投资成本，然后在法币与加密货币交换价值波动时不带任何额外风险地玩游戏。回报可能来自直接的买卖，也可能来自游戏中通过持有资产产生收入的机制。在\
  \ `Cryptokitties` 中，所有者可以租出他们的猫咪进行繁殖并赚取繁殖费。在 `Axie Infinity` 中，土地区块可以被租出去，大多数新兴的区块链游戏都有类似的游戏机制。\n\
  3. **玩家**：将包括上述两个小组中的这些人，但涵盖了更广泛的范围，从中学生到仅仅为了好玩而玩的资深玩家。他们对游戏投资的任何收益都是一种额外奖励。这些人是更有可能通过他们的游戏技巧和在平台上花费的时间来开始创造价值。随着电子竞技开始获得关注和价值，我们可以预见幻想游戏和\
  \ RPG 的顶尖玩家将有机会发展在线职业。这对未来工作的影响是惊人的。\n\n对于新兴的游戏经济而言，这些不同类型用户之间存在平衡至关重要。当一个游戏发布时，投资者和收藏者首先参与，但玩家社区的常规游戏和活动量决定了平台的成功以及可以获得的回报。\n\
  \n`Cryptokitties` 作为第一个登上头条的游戏，本质上是一个收集游戏。管理代代猫遗传代码的智能合约揭了稀有特征，并激励所有者继续繁殖和购买以增加其资产组合的价值。该游戏适合寻求\
  \ `ETH` 购买长期和短期回报的收藏者和投资者——而且确实有钱可赚。发布后不久，一只猫以 253 `ETH` 售出，在 2018 年 9 月另一只猫以 600\
  \ `ETH` 购买，尽管这些数字异常高。\n\n静态收藏格式不太可能在长期内吸引硬核玩家的注意力。在 `Cryptokitties` 和 `Gods Unchained`\
  \ 这种简单结构之后，我们开始看到将 NFT 所有权与活跃游戏性相结合的游戏，例如 `Axie Infinity`，它具有可收集的角色、团队战斗、新 `Axies`\
  \ 的繁殖以及土地所有权和管理，或者是开创性的 `Neon District`。将这种复杂性带入区块链需要并激励在访问便利性、扩展性、交易处理和整体用户体验方面更大的创新。我们将在本章后面解决这些挑战：现在，让我们看看成功游戏开发的最后一块拼图。\n\
  \n## 社区的重要性\n\n社交媒体从 2008 年左右开始改变我们的沟通习惯，多个行业的企业已将社区参与视为一种关键的营销工具。社区管理是留住消费者注意力和忠诚度的一个新但重要的学科。在过去的十年里，广告实践沿着连续体移动：从“告知”（在告示牌、印刷品和广播媒体上的单向通信）到企业与客户之间的互动，再到“倾听”，涵盖了从评论网站到社交媒体帖的语义和情感分析的一切。良好的社区实践更进一步，建立了一个具有层次参与的网结构，这保持了消费者或员工的兴趣，让他们觉得自己是整体中有价值的一部分。实现一个由多元个人组成的真正成熟的社区是非常困难的。社区委员会（Community\
  \ Roundtable）的成熟模型定义了成功社区的预期发展阶段，并基于从企业内部网早期开始关于参与和管理策略的大量研究。\n\n\n\n\n\n根据社区圆桌（Community\
  \ Roundtable）的年度研究，社区成员的范围从少数热情的贡献者到大多数沉默的听者和潜水者。平均而言，社区每 10 个成员中只有一个会真正参与日常讨论，而社区管理的圣杯是让网络活动在吸引核心用户关注的同时，将潜水者也引入讨论中。在我们居住的这个嘈杂世界里，有许多不同的平台和社会群体竞争我们的注意力，这是一项艰巨的工作。我每天的行程包括\
  \ Facebook 动态和群组、Twitter、LinkedIn 和 Instagram、多个 Slack 频道、WhatsApp 聊天、Telegram 群组以及\
  \ Discord，我无法关注所有的讨论。要求人们参与另一个媒介可能会遇到从冷淡到敌意的任何反应。然而，底线是，社区围绕共同兴趣和需求形成得最为自然。游戏在企业领域具有先发优势，从早期的街机厅并肩作战起，到如今在线的\
  \ Steem、Reddit 和 Discord 群组，相互支持的小群体一直围绕着游戏聚集。\n\n社区是区块链和加密货币采用的一个重要方面。当企业选择使用 `ICO`\
  \ 众筹时，必须建立的首个社区是投资者和收藏者社区，他们有能力支持开发资金的募集。他们必须拥有资金、信任和耐心。一旦融资轮完成，已建立的社区就需要演变，以吸引并互动潜在用户，这些用户将为发布产生期待和兴奋。对于所有行业的企业都是如此：一旦资金到位，互动工作的努力就不会停止。一旦发布，任何去中心化应用的新用户都会发现自己处于一个全新的且可能复杂的环境中，那里没有中央权威在出错时收拾残局，因此同伴的支持至关重要。当这种对社区支持的需求与游戏中围绕复杂规则解释的合作文化相结合时，游戏公司就有了一个巨大的资源，可以倾听、反应并完善他们的产品。\n\
  \nGabby Dizon 强化了这种影响。他告诉我：“从零创建一个游戏经济需要一个强大的玩家社区。”在单个游戏的语境下，社区很重要，而且对于与其他游戏的玩家建立互动也同样重要。没有任何东西是在真空中发展的，互互操作性和协作对于建立对每个新游戏发布时的兴趣、兴奋以及最终的参与度至关重要。Dizon\
  \ 和区块链游戏领域的其他领导者拥有跨平台元事件的愿景，利用社区的力量来增强而非竞争。这种愿景通过 `NFTs` 机制实现的资产主权所有首次得以实现。\n\n\
  ## 巧妙的操作\n\n使用非同质化代币对游戏资产进行完全所有是一个开创性的概念，因为它代表了没有区块链技术就无法实现的事情。初看之下，这似乎是一个简单的、“有之更好”的功能，可以将买卖活动扩展到游戏平台之外，但你的\
  \ `NFTs` 还能用来做什么呢？玩家可能希望获取资产并将其用于另一个游戏：公平地说，二维卡通中的一只可爱猫在《使命召唤》的战场上可能没用处，但一个装备精良的《守望先锋》角色呢？\n\
  \n`NFT` 在不同应用程序中的表示方式随环境而异，但所有权是不争议的。代币可以在清单应用程序中列出，作为奖励和优惠的基础，甚至可以作为贷款的抵押品。回到虚拟世界的经济和货币原则，这里有了通过技能、时间和资产创造价值的机制。代币的编程方式是物理资产无法实现的，而管理互操作性开启了更多的大门。`NFTs`\
  \ 有一些非常巧妙的操作。\n\n## 非同质化代币的互操作性\n\nCryptokitties 的创建者 Dapper Labs 通过 2019 年与另一个游戏\
  \ `Gods Unchained` 的合作迈向未知的第一步。每个 `Cryptokitty` 代币都会在 `Gods Unchained` 中生成一个限量卡包，而华丽的\
  \ `Gods Unchained` 猫则出现在 `Cryptokitties` 中。协作生态系统中代币的互操作性是区块链技术的另一个独特特征。这些卡通猫正引领跨多个领域的私有系统之间去信任的协调与合作，而不仅仅是在游戏领域。与其使用\
  \ `APIs` 从不同来源引入资产，`NFTs` 就可以独立地在系统之间移动，受限于设计元素的知识产权等正式要求。在去中心化结构中，还有哪些资产可以被表示、记录、交换或授权？我们在第\
  \ 4 章中已经看到，人们正努力为资本项目中的资产和设备建立持久性身份，一些公司正在探索使用代币来代表每个单元，这些单元通过序列号或物理特征具有独特性。将数字资产作为金融证券的方面也值得密切关注：它们具有内在价值，且所有权明确。这是一种新的思考方式，可能代表了将来的行为转变。\n\
  \n## 知识产权与资产所有权\n\n企业在应用中使用 `NFTs` 的考虑因素之一是保护他们的知识产权。Cryptokitties 的创始人花费时间研究了 `NFT`\
  \ 所有权的优缺点，并最终发布了《Nifty License》。这承认了公司对 `cryptokitties` 通用卡通风格的所有权，但授予每个代币所有者广泛的权利来使用带有该代币独特标记和特征的卡通。《Nifty\
  \ License》是连接物理与虚拟的一种：当受到挑战时，数字资产所有者可以证明其使用相关图像的权利。该许可发布供任何开发者使用，它是那些不想锁定自己作品但仍需要保留某些控制权并建立变现路径的协作创作者的蓝图。\n\
  \n\n\n\n\n逻辑上，Nifty 许可背后的原理以及将独特资产的元数据编码到 NFT 中的能力似乎可以应用于游戏之外的领域。在音乐领域，艺术家伊莫根·希尔普（Imogen\
  \ Heap）开发了 `Mycelia for Music`，这是一个为音乐制作人提供的研发中心。`Mycelia` 任务之一是确保所有艺术家在任何作品中的贡献都能获得“充分的报酬和认可”。这对于音乐行业尤为重要，因为曲目经常被采样并整合到其他作品中。此类活动大多是合法的，但音乐抄权诉讼已成为该行业几十年来的景观。`Mycelia\
  \ Creative Passport` 于 2019 年发布，格莱奖博客^(13) 报道了伊莫根·希尔普通过给予“数字化的适当信誉”来保护音乐制作人的计划。然而，来自阿尔斯特大学的研究人员在受英国知识产权局委托编写的一份报告中发出了警示。^(14)\
  \ 他们承认“区块链看起来是缓解严格的版税框架限制的部分解决方案”，但同时也意识到该行业的复杂性以及音乐价值链中广泛的活动。该报告确定了处于不同开发和采用阶段的多个项目，它们都在解决行业挑战的不同方面。这些包括上述的\
  \ `Mycelia`；来自 `ConsenSys` 的 `Ujo` 项目；`Musicoin`^(15) 流媒体平台；`Intel` 的合作伙伴 `dotBlockchain`，其使命是消除因文件类型变化而导致权利者信息丢失的损失；以及\
  \ `Custos`，其版权保护系统和星际文件系统（`IPFS`）因音乐内容追踪和归属而正吸引大量关注。正如我们的全球商业供应链一样，许多拼图碎片正在汇聚在一起。\n\
  \n在这些供应链中，NFT 也有许多用处。我们在第 4 章中遇到的榴莲生产者正在识别每一颗独特的水果，并将其元数据编码到 NFT 中，以便一直追踪到消费者。位于加利福州的\
  \ `Centrifuge` 正在使用相同的方法解决供应链中的另一个问题，允许将金融业务文件创建为 NFT。最终，这种以“数字猫”进入主流的技术，现在代表了全球范围内广泛的资产。\n\
  \n## 区块链扩展\n\n在每个游戏中，都有明确的规则规定玩家的每一步操作。先考虑一些简单的棋类，如`黑白棋`（Othello）、`跳棋`（checkers）或`连棋`（Connect4），然后再去考虑`象棋`或`围棋`的变体。每一步都涉及了解棋子被允许行动的方式，并提前思考和计算潜在结果。当你考虑到推理推理的复杂性时，你就会为什么游戏一直是从`深蓝`（Deep\
  \ Blue）到`深蓝`（Deep Mind）人工智能的训练场。\n\n一旦由人类或 AI 做出移动，我们就可以将此操作写入区块链，以便其他方进行验证。但我们能更进一步吗？已经证实，分布式账本上的智能合约能够执行交易。代币从一个钱包转移到另一个钱包，为股份和财产创建注册条目，生命事件被写入身份记录，并且可以创建一个具有独特祖先衍生遗传代码的\
  \ `Cryptokitty`。游戏中的某一步难道不是简单的智能合约吗？逻辑上，区块链可以成为裁判，检查所做的移动是否合法以及结果是否正确。\n\n当然，这有一个陷阱。以简单的\
  \ `Connect4` 游戏为例。只有一种可能的移动：一个彩色的圆盘掉入框架，两名玩家试图在任何方向上形成四条不连续的直线。确认移动有效并检查玩家是否在该移动中获胜需要什么？智能合约需要建立：\n\
  \n1. 游戏中的盘子是否比上一步移动结束时恰好多一个？\n2. 水平方向是否形成了四连线？\n3. 垂直方向是否形成了四连线？\n4. 对角线方向是否形成了四连线？\n\
  \n为了验证移动的有效性，智能合约需要建立这些功能。随着游戏复杂性的增加，`gas fees`（燃料费）将变得触目惊心。解决扩展性问题至关重要，无论是在游戏还是领域。\n\
  \n## 可扩展性与速度\n\n当区块链首次作为数字货币引入时，其愿景是去中心化的支付系统。在吞吐量方面，全球主流处理器 `Visa` 报告其在 2018 年处理了\
  \ 1243 亿笔交易^(16)，这接近 4000 TPS。`PayPal` 拥有 2.67 亿活跃用户，同一时期处理了 100 亿笔交易^(17)，其结果为\
  \ 317 TPS。相比之下，`比特币`的运行非常缓慢。后续的加密货币改进了这一点，尽管少数项目的吞吐量接近 `Visa` 水平，但这尚未在大规模范围内经过测试。`Ethereum`\
  \ 报告可达到 30 TPS，而 `Litecoin` 接近 50 TPS。最快的加密货币支付处理器是 `Ripple`，其 `XRP` 币约为 1500 TPS，尽管这是通过\
  \ `Ripple 协议共识算法`而非在公共区块链上实现的，这可能不是有效的比较。根据 `EOS 网络监控`，`EOS` 的历史最高值为 3996 TPS，但日常实时交易仅为此数字的分之一，在\
  \ 2019 年 8 月访问时低于 100 TPS。`EOS` 的设计是为了高可扩展性，旨在与 `Visa` 并肩，但 `EOS 区块链` 的结构和其`代理权益证明共识机制`导致了比传统加密货币更中心化的结构。\n\
  \n\n\n\n交易速度，或称延迟，是扩展性方程的另一个维度。根据 `Kraken` 加密货币交易所的说法，将货币从一个钱包转移到另一个钱包所需的实际时间差异巨大，从几乎瞬时的\
  \ `Ripple` 和 `Stellar` 到 `Bitcoin` 所需的整整一小时不等。速度方程的很大一部分是每个区块链所使用的共识机制。`Proof of\
  \ Work` 是纯粹但缓慢的。任何加速这一过程的尝试（例如通过使挖掘算法变得简单）都会损害区块链的安全性。`Ripple` 协议共识算法、`EOS` 委托权益证明共识以及\
  \ `Stellar` 的联邦拜占庭容协议系统（`FBA`）都是有效且快速机制的示例，但对于验证者数量有限的情况，也存在对中心化的担忧。这表明在真正的去中心化和交易吞吐量之间存在权衡。\n\
  \n处理速度和容量将如何增长？新的区块链在开发时已经考虑了速度和扩展性。有许多团队在后方待命，并报告测试处理速度达到每秒数十万次。市场对这些说法中的许多持怀疑态度，仅仅因为在测试网和有限的服务器网络上展示快速处理与现实世界中的交易是完全不同的。然而，一些令人兴奋的项目正在进行中。其中包括\
  \ 2019 年 7 月启动的 `Algorand`，它的平台声称吞吐量为 `1000 TPS`，在五十万次交易的测试量下延迟为五，引起了广泛关注。它使用新的拜占庭协议协议进行委员会共识，并利用可验证随机函数在链增长时选择传播下一个区块的用户。\n\
  \n## 分片化 (Sharding)\n\n`Ethereum` 网络正在考虑一种被称为 `sharding` 的概念。这被用于传统的数据库管理，其中大型数据存储库可以分区以进行更快速的处理。它被用于巨大的数据库，如果不是这样，用户将等待很长时间才能从一个源检索其信息：多个数据分片可以加速这一过程。搜索引擎、大型电子商务网站和\
  \ `CRM` 系统都使用了 `sharding` 技术。其与区块链需求之间的相似性显而易见。`Ethereum` 分片项目旨在将验证工作负载分配给不同的矿工小组，将整个区块链拆分为分片或微链，仅携带一部分交易数据。由于节点不再需要处理每一笔交易，这在理论上可以增加网络的速度和吞吐量。`sharding`\
  \ 存在需要解决的复杂性，特别是安全性方面，必须确保特定的分片不会被破坏。然而，随机分配每个分片并定期更换节点是一种解决方案。\n\n`Ethereum` 并不是唯一关注\
  \ `sharding` 的协议。它对 `Hyperledger` 也有吸引力，一些新的区块链项目从从开始就采用了 `sharding` 结构。由于该概念在中心化数据库中已得到证明，解决在去中心化环境中实施的额外考虑因素只是时间问题。然而，对于现有的区块链生态系统，简单的线性扩展将无法让\
  \ `Bitcoin` 与 `Visa` 并肩齐论，而 `sharding` 可能不是所有问题的答案。\n\n## 让侧链承担压力\n\n`Bitcoin`、`Ethereum`\
  \ 以及其他真正的去中心化区块链运行在所谓的“泛洪协议”（gossip protocol）上。这意味着每笔交易都会广播给每个节点。这是技术的巨大优势之一，但随着交易量的增长，无法找到简单的规模经济。开发者们正在在不损害现有系统结构的前提下，开发与既有系统并行的解决方案。扩展最直接的方法之一是开发侧链作为既有协议的第二层。\n\
  \n侧链最早由 `Back et al.` 在 2014 年的一篇论文中提出，引入了“锚定侧链”的概念。它建议“将资产从（原始）父链转移到侧链，可能进一步到另一个侧链，最终返回父链，保留原始资产”。作者继续写，这些侧链将是独立的区块链，因此可以承载创新的开发。这种概念已被多个开发者小组成功采纳。让我们看看\
  \ `Bitcoin` 上的 `Lightning Network` 及其创新。\n\n## 闪电网络 (Lightning Network)\n\n第一代现场侧链项目始于\
  \ `Bitcoin` 上的 `Lightning Network`。在 2016 年的论文中，作者 `Joseph Poon` 和 `Thaddeus Dryja`\
  \ 为 `Bitcoin` 提出了“可的链外支付”。作者意识到，由于 `Bitcoin` 账本的每次状态更改都在网络中广播，这永远无法扩展与中心化支付系统竞争。他们建议交易可以在单独通道中处理，只有最终的状态更改才会广播。这缓解了网络拥堵并降低了用户成本，因为只有在主区块链上处理状态更改交易时才需要向矿工支付费用。\n\
  \n这种在现实生活中运作的一个良好例子是简单的日常微支付。想用 `Bitcoin` 买咖啡？等待网络的验证和确认意味着长队和咖啡变冷。相反，此类微支付可以通过\
  \ `Lightning Network` 应用进行管理。你在 `Bitcoin` 中设置一小笔余额，类似于预付借记卡并使用该余额购买咖啡。在任何时候，当你不再需要与供应商的一一对一链接时，或者在月底这样的时刻，状态更改（而不是产生它的单独交易）可以写回区块链。从会计术语来说（这是一个很好的类比），侧链持有账户中每笔咖啡购买的单独记账，而\
  \ `Bitcoin` 区块链仅显示该账户在特定时间的开闭余额。\n\n`Lightning Network` 开发者已经解决了许多安全担忧，包括如何在不损害主区块链记录的情况下管理侧链上的余额争议。`Lightning`\
  \ 启发了侧链创新的浪潮。\n\n## Plasma\n\n`Plasma` 是 `Ethereum` 的一个开发层，目标与 `sharding` ，但结构与\
  \ `Lightning` 不相似。它允许创建具有独特属性的“子”链，这些链使用主 `Ethereum` 区块链作为可信源。`Ethereum` 上的名为 `root\
  \ contracts` 的特殊智能包含了包含了每个子链行为的规则。`Plasma` 仍在作为一种独立解决方案进行开发，但它已被采用于加强 `Loom Network`\
  \ 的资产安全性。\n\n## Loom Network\n\n如何在不减速缓慢的情况下提供去中心化的游戏体验？根据 `Loom Network` 的说法，答案是开发特定应用程序的侧链。\n\
  \n\n\n\n\nLoom 的软件开发包（`SDK`）旨在帮助非区块链开发者以简单的方式构建其系统的区块链元素。Loom 团队还是 `Crypto Zombies`\
  \ 的幕后团队，这是为想要深入研究开发技能的人士提供的权威智能合约编码教程。`SDK` 允许构建“DAppChain”，它以 `Layer 2` 的形式构建在许多现有区块链协议之上，正如同\
  \ `Lightning Network` 是 `Bitcoin` 之上的 `Layer 2` 一样。Loom 团队的目标是使其成为连接所有主流当前及未来区块链的通用\
  \ `Layer 2`。这是迈向我们在成熟互联网中几十年来所享有的无缝协作和互操作性迈出的重要一步，且 Loom 已经实现了对 `Ethereum`、`EOS`、`Tron`\
  \ 和 `Cosmos` 等平台的集成。\n\nLoom 在游戏开发者中越来越受欢迎，它也被用于社交网络以及需要速度和高水平用户交互的应用。默认 `SDK` 对所有单个侧链都使用委托权益证明证明（`Delegated\
  \ Proof of Stake`）共识机制，尽管开发者可以选择其他机制，这意味着侧链上的交易不需要支付 Gas 费用，并且具有`工作量证明`（`Proof of\
  \ Work`）区块链所缺乏的快速确认时间。与 `Ethereum` 的原生应用（如 `Cryptokitties`）相比，后者每次交易都会产生费用并需要时间验证。在侧链上启动游戏可以使用高度复杂的智能合约来实现游戏。第一个\
  \ DAppChain 于 2018 年 3 月上线，Loom 已用于 `Axie Infinity`、`Battle Racers` 和 `Neon District`\
  \ 在内的多个增长游戏。\n\nLoom 采用 `Plasma` 作为用户将 `ERC20` 和 `ERC721` 代币转移到侧链的方法，即使侧链出现任何问题（如黑客或欺诈活动），资产仍然记录在\
  \ `Ethereum` 主链上。这增强了侧链的安全性，使其成为可扩展开发的现实且可靠的平台。\n\n## 扩展区块链项目的实际考虑\n\n速度绝不是衡量成功系统的唯一标准。还有许多需要考虑的因素，尤其是区块链游戏联盟\
  \ Alex Amsel 提出的一个棘手问题：如果你没有用户，你还需要扩展吗？正如我们之前看到的，拥有“最佳”技术并不能保证市场随之而来。在较慢框架上的竞争对手可以轻松获得更大的市场份额，而对一个没有用户的应用程序进行前瞻性规划是毫无收益的。\n\
  \n如果系统具有任何类型的互操作性，它应该保持与其合作者处于同一个区块链生态系统中：这是 Loom 在扩大协作网络方面的优势之一。软件开发包（`SDKs`）在不同框架中的完备程度各不相同，技术团队获得的支持越多，最终平台的完整性就越高。任何寻求新的、更快选项的人，都需要仔细查看开发背后的团队，对任何早期阶段业务进行必要的尽职调查。\n\
  \n## 只要添加一点区块链\n\n使用区块链的软件开发者可以通过减少链上处理来在这些方面完成这些扩展努力。Amsel 认为，如果某事物没有价值（无论是金钱、商业还是个人价值），那么它就不需要放在区块链上。这是开发可持续应用时遵循的一个良好准则。\n\
  \n客观地审视正在自动化的流程。诚实面对用户旅程中的哪些元素确实需要创建不可篡改的分布式记录。除了简单的功能和身份验证外，还会有其他考虑。企业通常将宝贵数据作为商品，因此即使是将元数据广播到网络中也可能损害业务模式。区块链在此类业务中取得成效的一个例子是第\
  \ 4 章中讨论的福音数据平台：分布式账本的引入经过仔细管理，在解决问题的同时保护了参与企业所持有和看重的数据。如果有真正的业务理由将复杂的智能合约纳入软件中，那么下一步就是考虑用户和开发者的需求。\n\
  \n## 关注用户\n\n作为软件开发者，极很容易忽视用户而转而关注技术，从开发者非常特定的视角出发，追求最纯净的处理、最快的验证和最好的体验。用户通常不关心底层运行着什么。他们希望软件能够通过直观的用户界面以及适当的安全性和韧性来执行其设计的功能。在过去，在经营一家不断增长的软件业务时，我学会了识别出那句无害的陈述“只是重构一些东西……”。这通常标志着一个开发者掉进了新工具世界的兔子洞太深，其前瞻性规划远超产品的路线图范围或需求。根据现实的业务模型对预期的用户增长进行设计是重要的；以牺牲良好的用户体验和证明的韧性为代价来追求极区块链体验是愚的。\n\
  \nBlockade Games 首席执行官 Marguerite deCourcelle 明确表示，区块链开发者需要应用开发者的补充知识才能获得良好的用户体验。她指出，“当\
  \ Epic Games 制作《堡垒之夜》时，他们同时开发了驱动它的虚幻引擎（`Unreal Engine`）。他们根据游戏应用的需求实时做出开发选择。”正是高质量的用户体验驱动了采用和主流用户群的进入。`Neon\
  \ District` 背后的公司 Blockade 于 2019 年 9 月发布了他们的区块链游戏开发者平台，作为行业实现这种协作的工具。它颠转了这一过程：成熟的游戏开发者可以使用该平台构建增强其应用程序的区块链功能。目标是让玩家意识不到自己正在玩区块链游戏。这种无缝的接纳是每个行业都努力实现的目标。”\n\
  \n\n\n\n\n数据泄露丑闻、个人信息滥用以及日益复杂的监管，使得这一议题成为个人、企业、监管机构和政府关注的焦点。数据的安全管理关乎每一个人，随着区块链技术的普及，各方都面临着需要应对的机遇与威胁。机遇广泛存在于零知识证明领域、多个不相关方之间的透明度以及流程效率上。它为个人提供了去中心化数据并掌握自己个人信息所有权的方法，同时也是中心化组织实施“设计安全”策略的有用工具。相应的威胁则体现在瞬息万变的监管环境中，以及开发者自身在部署准确代码和构建知识产权方面需要极度谨慎。区块链（不同于加密货币和代币，后者的监管环境已在第\
  \ 3 章中讨论过）在监管背景下需要审慎考虑。对于开发者和创新者来说，面临着巨大的挑战，他们必须穿越多个州不同隐私法律的“雷区”，同时管理自身的商业利益和知识产权。\n\
  \n本章探讨了通往拥有数据的历程、区块链在政府领域的应用，以及任何采用分布式账技术的组织所面临的法律考量。\n\n## 重视你的数据\n\n我们已经习惯了将个人生活信息以数字化方式且往往是公开存储。邮政编码查询器、电话簿和选民名单是互联网上首批公共数据库。这些包含的信息与我们曾经在当地图书馆通过微胶片和纸质检索的信息大相相同，但它们面向庞大的新受众，而这些用户使用数据的动机可能并不单纯。随着隐私意识的增强，这些列表从公众视线中消失了。社交媒体在\
  \ 21 世纪 0 年代初迅速发展，我们开始自愿分享数据，发布从婴儿 B 超到假期计划的一切内容供朋友和家人看。在线服务的兴起和物联网（IoT）连接设备的增加引发了第三波无意识的数据共享。正如\
  \ Avast 安全大使、前世界国际象棋冠军加里·卡斯帕罗夫（Garry Kasparov）所说：“苏联有间谍设备：现在我们只需要付钱给亚马逊来交付我们的数据。”\n\
  \n## 隐私与监视\n\n我们生活在一个个人隐私与从服务中获得的实用性相权衡的世界。我们被建议在数据共享上做出意识到的决定，但如果我们想获取基本服务，有时是否共享数据的选择就成了学术问题（无实际意义）。更复杂的是，根据艾兰·韦斯汀（Alan\
  \ Westin）在其 1967 年的著作《隐私与自由》（`Privacy and Freedom`）中的定义，个人对隐私的四个不同元素的忍度不同：`孤独、匿名、含蓄和亲密`。这些行为在社交媒体上随处可见，一些用户分享他们生活的每一个细节，不在乎或不知道这样做可能面临的风险。其他人则更加谨慎，小心分享，并且更加渴望绝对的匿名，躲在假名后面，并根据参与所需的详细程度选择平台。隐私与监视之间也存在着历史性的且有据可查的冲突。爱华·斯诺登（Edward\
  \ Snowden）于 2013 年举报美国国家安全局（NSA）监视计划以及`PRISM`和`Upstream`计划，其影响是深远的，损害了涉及隐私的跨大关系，并将安全机构的活动推向了风口浪尖。另一方面，据报道，英国的`GCHQ`在\
  \ 2018 年每周拦截了约 2000 个恶意域名^(1)，其对互联网活动的监视有助于减少恐怖主义威胁和犯罪团体的活动。我们不能兼得。。作为一个社会成员，我们有责任保护弱势群体，即使是以牺牲绝对隐私为代价。\n\
  \n为什么这个问题会变得如此复杂？1999 年，大卫·布林（David Brin）在他的著作《透明社会》（`The Transparent Society`）中应对这一日益增长的问题并提出了一个解决方案，^(2)，这与随后分布式账本的发展产生了共鸣。他解释说，在我们集体沉浸于万事数字化之前，交易依赖于个人信任和社区透明度。你知道村庄、城镇或市场区域中谁是可靠的人，并相应地调整你的隐私设置。同样，不实行为在声誉和特权方面付出了代价。随着交易范围扩大到区域和国家社区以及未知参与者，加密形式的秘密取代了自然的信任秩序。然而，盲目依赖数据收集者使用的加密是危险的。由于创新的黑客攻击、社会工程和网络钓鱼，破解我们数据的安全层变得越来越容易，而且在许多情况下，人为错误或完全的疏忽导致了数据在没有应用适当加密的情况下被收集和存储——令人担忧的是，根本没有任何加密。随着我们的信息价值超过了成本，数据盗窃是一个日益增长的问题，尽管立法者在抑制不必要的数据获取和商业化方面付出了努力。随着存储数据的增长，我们必须寻找保护解决方案。比特币、区块链以及对安全和监管的讨论所提出的，是对在线透明度和信任的重构。\n\
  \n## 数字身份\n\n根据许多观察者的观点，数字身份是技术的圣杯`ID2020`联盟进一步指出，这应该符合可移植性、持久性、隐私和用户控制的核心原则。开发可靠数字身份的工作在区块链出现很久就已经进行了，但分布式账本为其中增加了去中心化的认证层。爱沙尼亚政府是第一个使用加密和分布式记录保护所有公民信息的政府。2003\
  \ 年，密码学家阿托·布尔达（Ahto Buldas）和马特·萨雷佩（Märt Saarepera）开发了数字身份的形式的安全证明^(3)，并与迈克·高尔（Mike\
  \ Gault）和伊藤直一（Joichi Ito）一起，在 2007 年“电子爱沙尼亚”计划正式开始时创立了`Guardtime`公司。研究人员的目标是消除管理身份时对信任第三方的需求，他们发现了一种与中本聪明的比特币白皮书中相同的通过数字签名、哈希和时间戳进行加密验证的系统。方法上的相似性，以及布尔达、萨雷佩和高尔工作在时间上的看似巧合，导致人们推测这群开发者可能是匿名的中本聪明的真实身份的候选人，但他们并未引起关注，高尔在被问及时否认了参与。Guardtime\
  \ 已成为区块链创新的跨国领导者，并参与了第 4 章中讨论的`Insurwave`开发。从数字身份开始，爱沙尼亚政府和 Guardtime 转向了医疗、居住、税务、投票和治理的数字化管理，在适当的地方引入了区块链技术。\n\
  \n\n\n\n联合国在实现可持续发展目标身份方面的工作正紧随爱沙尼亚之后，其目标是在 `2030` 年前“为所有人（包括出生登记在内）提供法律身份”。他们与全球最大的数字服务提供商包括\
  \ `Microsoft`、`Accenture`、`Cisco` 等合作，建立了 `ID2020 联盟`。`ID2020` 旨在通过生物识别和区块链技术，为全球\
  \ 11 亿未注册身份的人口提供数字身份，它是 `Accenture` 开发并被联合国难民高级专员处使用的现有生物识别身份管理系统的扩展。2018 年，他们与国际救援委员会（IRC）合作，在泰国开展了试点项目，帮助难民获得医疗服务，并建立其教育和职业技能的记录；同时，在印度尼西亚，他们与国家减贫加速小组合作，旨在改善经济困难个体的获取能源补贴的途径。\n\
  \n在另一项独立计划中，`世界粮食计划`实施了一个私有区块链，以解决约旦某难民营现有食品援助系统中的两个管理难题。他们的目标是通过让这些数据与日常身份验证流程隔离开，来保护难民的完整身份，并简化零售商账户和难民援助津的复杂管理。他们通过启用虹膜扫描作为身份识别手段并在链上仅保留此类元数据，成功保护了\
  \ 10 万难民的详细信息。作为额外，该概念验证的实施每月在银行交易费、管理成本和防欺诈方面节省了 `$40,000`。\n\n当然，身份不仅是政府的问题也是企业的问题：在金融服务领域，了解你的客户（`KYC`）的需求正转向基于不可篡改、可信记录的认证。`2019`\
  \ 年 7 月，阿拉伯联合酋的一些银行组成了一个针对企业身份的区块链 KYC 联盟；而在法国，`2018` 年由 26 家公司和 5 家银行运行的一个试点项目证明，通过访问共同区块链进行验证，可以简化重复冗的\
  \ KYC 流程。如果这个硬骨头能被攻克，`KYC` 将成为驱动数字身份在我们舒适的第一世界被采用的用例。\n\n# 保护我们自己\n\n除了身份验证之外，区块链是一种可以且正被用于记录、验证和保护许多其他个人数据方面的工具。我们可以通过时间戳的简单机制构建日常生活中基本要素的审计追踪，使我们选择记录的细节在关键时刻既可验证又不可质疑。然而，仅仅因为我们*能*这样做并不并不意味着我们*应该*这样做。我们在社交媒体上记录生活已经给自己增添了足够的麻烦，那么让其中某些信息永久可用又有什么好处呢？\n\
  \n答案当然是，如果出现看似无法逾越的问题，那么将区块链视为一系列可用新兴技术的一部分，看看正确的解决方案在哪里是值得的。一些企业家正在致力于解决个人数据验证领域非常特定的问题。\n\
  \nAnne Ahola Ward 目睹了区块链项目的激增，但这些项目大多关注于区块链本身的工具、在没有实际问题的解决方案，以及未能交付长白皮书中所承诺的细致细节的宏大想法。在她所看到的这些事物中，很少是为了帮助人们而设计的，或者能够让主流用户轻松获取的。Ward\
  \ 在经历家庭悲剧后，灵光一现的时刻是意识到，资产变成数字化并归个人所有其实是有意义的：在去世之后。\n\nAnne 和我这一代的大多数人都处理过家庭成员的遗产。各方面都面临挑战。对于最微小资产的争议不断发生，而死者的遗嘱可能已经过时了几十年。在有活跃社交媒体账户的地方，其处理方法并不一致。在包括\
  \ `Facebook` 在内的某些平台上，存在纪念亲人资料的选项，但其他平台则悬而未决，受条款条件变化的无常影响，或者在服务关闭时永久丢失。最简单但最令人无所措的损失之一是代代相传的口述历史财富。Ward\
  \ 的愿景是使用区块链来保护带有时间戳的遗产，而 `2019` 年 6 月推出的 `Veritoken Legacy Locket` 则从上传照片、引言和记忆开始，旨在记录个人数据的选择和偏好。技术执行人的新角色是对留存者新需求的回应。从长期来看，保持法律遗嘱的更新可能将由区块链负责，而不是遗嘱律师。“我们不会永远活着，”Ward\
  \ 说，“但我们的信息可以，所以我们应该对这些拥有控制权。”\n\n另一项关注特定生活挑战的倡议是 `Loly` 约会应用。在与创始人 `Adryenn Ashley`\
  \ 交谈时，这款由女性编写、为女性服务的应用解决了许多其他平台未解决、且区块链提供了解决方案的问题。它引入了受信的用户身份，并支持通过社区验证和良好约会行为报告建立声誉的机制。它满足了约会期间对清晰记录同意或拒绝的需求，这些记录可以在事后进行验证。Ashley\
  \ 还报告说，路线图包含用于激活紧急通话和记录功能的安全词。\n\n这些应用程序中的区块链层对用户来说并不是显而易见的，这对于工具根据自身价值而非技术被采用至关重要。我们可能正在进入一个我们可以拥有数据并管理隐私和身份的世界，但这种体验必须是无缝的，技术必须是所有人都能使用的。\n\
  \n# 治理与监管\n\n政府与区块链被描述为天作之合。我们公共服务的逐步数字化稳定地改变了我们的生活，尽管在大规模部署复杂软件面临挑战，但对大多数人来说，这个过程相对并不痛苦。区块链已成为简化公共服务、管理登记和保护身份工作中的多种有用工具之一。在爱沙尼亚，加密在数字身份中的应用比中丰早了几几年，分布式账本的引入是一个自然的演进。在怀俄明州，立法者很快意识到这项技术的潜力以及围绕其良好实践的性。他们开始在政府和业务的几个领域构建区块链解决方案，并起草通过了一系列被其他州采用的法案。在阿拉伯联合酋国，迪拜已将区块链整合到其长期智慧迪拜计划中，目标是无纸化行政。让我们更详细地查看在监管区块链、管理登记、管理城市和公民以及保障民主进程正在进行的工作。\n\
  \n怀俄明州：区块链州\n\n\n\n\n\n怀俄明州是区块链监管领域的先驱。在怀俄州区块链联盟的共同努力（包括立法者 Tyler Lindholm 和华尔街资深人士\
  \ Caitlin Long），怀俄州成为美国首个为区块链技术提供全面法律框架的州，使其能够蓬发展并造及个人和公司。此后，多个州也采纳了同样的立法。在 2018\
  \ 年通过的这一系列法案中，怀俄州引入了数字资产法律框架。它确保该州承认所有类型资产所有者的直接财产权，并在现有的法律框架内将其归类为无形个人财产（无论是货币、证券或其他资产）。土地、物业、股份和证券都有其登记机构，随着数字资产的兴起，预计这些机构也能从正式的登记结构中受益是合理的。\n\
  \n# 区块链上的土地\n\n资产登记的传统管理几代以来基本没有发生变化。曾经，登记簿是用墨水和铜版书写的，现在已转移到计算机数据库，并通过不同的软件平台、编码语言、物理存储介质和原始数据源进行。登记机构一方面是交易账本，另一方面是专门的档案，面临着第\
  \ 4 章案例研究中国家档案详细描述的相同认证和验证挑战。所有权从一方到另一方的转移，或从一方到多个所有者的转移，必须得到准确反映。\n\n## 为什么区块链与这些长期系统有关？\n\
  \n直到最近，通过内部的机器人流程自动化（RPA）就可以提高档案和账本管理的效率，并降低成本和人为错误的几率。登记机构通常由单一方持有，因此去中心化可能似乎不是一种即时优势。然而，监控、更新和验证登记信息的过程正日益去中心化。所有权的变更、背景检查和对登记簿的查询更有可能由第三方处理。作为公共记录，有多个方参与更新登记簿中的细节，任何引用记录的个人都必须对输入内容的准确性充满信心。区块链不仅提供了一种以较低成本实现更高效率的途径，还改进了源自律师等第三方交易的更新过程，并使信息更易获取、更可信。\n\
  \n一旦区块链的潜在收益显而易见，世界各地的土地登记机构急于测试这一概念。在每个大陆的国家，包括（但不限于）格鲁吉亚共和国、瑞典、英国、澳大利亚新南威尔士州、怀俄明州、洪都拉斯、加纳、印度哈里亚纳（作为联合国倡议的一部分）和迪拜，都运行着土地登记试点和概念验证。其中少数几个已经跃到了实时部署，而另一些仍在测试其平台或已完全停滞。\n\
  \n## 经济激励与案例研究\n\n开发高效准确的土地登记机构的经济激励是显而易见的：“土地对于促进经济增长、解决经济不平等、缓解冲突管理以及支持地方治理至关重要，”Benbunan-Fich\
  \ 和 Castellanos 在 2018 年向第三十九 届国际信息系统会议提交的论文中说道。他们对洪都拉斯和格鲁吉亚共和国项目的对比研究展示了区块链实施面临的真实挑战之一。这项技术是复杂的，虽然用例可能是理想的，解决方案在理论上是行的，但公共机构的信息系统准备程度可能是成败的关键。洪都拉斯是早期采用者，于\
  \ 2015 年与总部位于德克萨斯州奥斯汀的经验区块链开发者 Factom 合作启动数字化试点。尽管有一个良好的开始，该项目在一年内就停滞了，无法按照私营部门的速度运行，并恰逢了政治色彩浓厚的选举季的开始。\n\
  \n在另一个极端，自 1991 年独立的格鲁吉亚已经为其登记管理建立了稳固的流程，并通过为比特币矿工提供利益以及与 BitFury 的合作拥抱了区块链世界。涉及到数字化时，他们的公共登记管理局（NAPR）已经“信息系统就绪”。格鲁吉亚共和国的区块链登记是世界上首个投入运行并大规模部署的。NAPR\
  \ 项目管理负责人 Mariam Turashvili 向我确认，截至 2019 年 7 月，他们已在区块链上存储了“超过 200 万份公共登记提取（所有权证书哈希）”，并正致力于处理所有权转移和其他交易的智能合约，以及实施这些合约所需的法律修正。\n\
  \n## 瑞典的土地测量（Lantmäteriet）\n\n瑞典的 Lantmäteriet 是全球最早将土地登记从纸质转向数字记录的公共机构之一，早在 20\
  \ 世纪 70 年代，但技术在此之后进步。该机构意识到，状态或所有权变更与登记簿记录之间的延迟正在损害人们的透明度和信任。这些延迟直接源于沉重的（且昂贵的）手工签名文件系统，而透明度的缺乏则是源于保护数据的防火墙和安全系统，这些系统同时也阻止了没有高权限的人访问写入数据库。区块链的出现似乎为这两个挑战提供了解决方案，一项为期两年的概念验证已于\
  \ 2018 年 3 月完成。这并不是 Lantmäteriet 使用新兴技术解决问题的唯一案例。自然语言处理、手写文本分析和人工智能已被开发出来，用以提高他们对公民现有记录请求的响应。区块链只是一个具有历史前瞻性的机构用于改进其服务的众多工具之一。\n\
  \n## 新兴发展\n\n一些最有趣的早期发展正出现在非洲。加纳的 Bitland、卢旺达的瑞士合作伙伴以及肯尼亚的 Land LayBy 正在应对虚假地契和缺乏一致文件等根性问题。虽然这些项目距离交付运行并被采纳的系统还有很长的路，但它们展示了问题的本土反应，这种反应可能比外部强加的任何东西都具适用性和可持续性。\n\
  \n尽管登记机构被认为是区块链技术最明显的应用之一，但其大规模的开发是一个缓慢的过程。公共部门对任何 IT 系统的部署自然非常谨慎，因为人们没有选择权不用，而私营部门则在飞速前进，因为他们相信市场竞争会淘汰掉较弱的方案。土地登记可能经历过一段炒作时期，但里程碑式项目的稳定进展可能会在未来几年内在全球范围内带来真正的利益。\n\
  \n智慧城市，智慧生活\n\n\n\n\n\n土地登记处可能正在向线上转型，但我们的家又呢？公共行政管理中的这一逻辑化步骤也为房地产行业带来了利益。降低成本和提高效率的商业动力驱动了私营部门的发展。总部位于加利福尼亚州的房地产平台\
  \ `Propy` 在 2017 年 10 月在`Ethereum`区块链上执行了首个概念验证的房产购买——目标是乌克兰基辅的一套公寓，并迅速向着其业务的商业化迈进。加利福尼亚州记录的第一笔交易发生在\
  \ 2018 年 7 月，^(11)，几个月后在欧洲也发生了此类交易。^(12) 直到 2019 年中，`Propy` 已列出超过 60,000 处房产，并在美国、欧洲和亚洲管理了`Bitcoin`、`Ether`和法币的销售。管理每笔交易的智能合约由独立的公证员在验证卖方签名后触发，这比传统的文档交换要简单得多。`Propy`\
  \ 还在测试契据登记和所有权登记，以管理从端到端的销售过程。这通过将哈希信息添加到相关记录办公室的公开持有契据中，织入了公共登记系统中。公营部门和私营部门协作的基础设施已经就绪。\n\
  \n交易不仅限于土地和房产。1999 年，迪拜启动了其 ICT 战略，旨在让公民的生活更加快乐，并与政府及监管机构的互动变得无缝。2016 年，该战略中增加了一个新元素：`blockchain`。^(13)\
  \ 在国家层面保持持续的长期愿景并执行二十多年之久，在西方是罕见的，`Smart Dubai`的快速进展证明了在政党之外进行规划的价值。迪拜政府认为“区块链对交易所做的，就像互联网对信息所做的一样”，并识别公民旅程中可以实现无摩擦的交易。他们的务方法并非盲目使用`blockchain`，而是用适当的技术解决特定的痛点。该战略涵盖了三个支柱：政府效率、产业创造和国际领导力。在\
  \ 2019 年伦敦科技周的商业区块链峰会期间，`Smart Dubai Government`的新兴技术和数字化转型顾问 Sohail Munir 博士解释说，目标是让该城市在\
  \ 2021 年 12 月 12 日之前实现无纸化（已经计划了庆祝活动）。该市预计将消除 957 万张纸，每年节省 11.5 亿迪拜哈尔姆（约 3 亿美元）。这是一个影响公民日常生活多个领域的雄心勃勃的计划，而且正按计划进行。在撰写本文时，支付对账的对账和该市的房产登记已经部署，在许可、遗嘱、车辆管理和教育等方面已配备了概念验证系统。\n\
  \n大多数国家的政府机构都需要增加问责制和透明度，这可以通过恰当应用`blockchain`来实现。迪拜政府和行政数字化的长期项目就是一个例子。在英国，工作与养老金部部、知识产权局以及`G-Cloud`采购系统等部门正在审查`blockchain`作为流程改进工具的性。加拿大政府于\
  \ 2019 年 8 月发布了他们的《服务与数字政策》^(14)，特别承诺要“对新技术和解决方案，如人工智能和区块链进行创新和实验”。`blockchain`技术的进步依赖于最高层的支持，而政府对开发分布式账本技术使用的兴趣只会加速其采纳。\n\
  \n# 选举中的信任\n\n`blockchain`技术是开发网络投票和消除选举欺诈的重要工具。随着我们的生活不可逆转地向线上移动，保持选民的参与度对于民主来说至关重要。如果投票过于负担，依赖纸张和古老的机器，那么公民将面临剥夺权利的。然而，电子投票充满了风险，其复杂性远比选民可能看到的要高。\n\
  \n Surrey 大学网络安全中心主任 Steve Schneider 教授向我解释道，虽然透明计票相对简单，但个人选票的透明度则是另一回事。一个稳健且可验证的投票系统需要处理选民的资格和匿名性，保持选票机密，并证明完整性。这在密码学和网络安全方面都是巨大的挑战。Schneider\
  \ 在 2019 年 5 月为《新卫报》撰文时，^(15)概述了对选民和选举机构的潜在威胁，包括伪造投票网站、用于投票的设备上的恶意软件，以及系统渗透或内部坏人，特别是因为电子系统可能由单一中央行政机构管理。\n\
  \n在`blockchain`出现之前，学者们就在研究电子投票系统，开发让个人能够独立验证其选票确实已按意图计入，并让公众检查选票是否正确计票的方法。例如华威大学冯浩（Feng\
  \ Hao）教授开发的`Verifiable Classroom Voting (VCV)`系统^(16)以及 Schneider 以前的工作，最初依赖于将结果发布在公告板上，但正如\
  \ Schneider 告诉我的那样，`blockchain`提供了技术，使得这种公共记录变得不可篡改且完全分布式。这也有局限。`blockchain`需要是许可性的而非公开的，因为选举当局必须根据相关国家的法律进行选举。需要两阶段的共识来确保选民获得选票已投出并正确记录的即时确认：在公共`blockchain`上等待`Proof\
  \ of Work`共识将太长而无法实用。Surrey 团队的`Verify My Vote (VMV)`系统^(17)的试验于 2019 年夏季进行，虽然这项工作是迈向透明和可验证电子投票系统的一大步，但在成熟到能够政治或法定选举之前，可能还需要若干年。然而，Schneider\
  \ 认为，我们正越来越接近将其用于后果较低的选举（例如组织选举、工会选举等），这些选举的选民名单受到更严格的控制，且风险收益计算也不同。\n\n世界上已经有了网络投票系统的元素。爱沙尼亚使用数字身份来确保所有有投票资格的人都能投票，同时保持与所投选票相关的匿名性。反，选票本身也可以以不可篡改的形式记录。爱沙尼亚选举委员会密切监控中心系统以防篡改，但目前还没有独立的验证机制。一种模仿爱沙尼亚方法的投票系统在\
  \ 2014 年由一个丹麦政党内部实施，目前通过`Bitcoin Foundation`正在进行一个开发基于区块链的投票系统。^(18)\n\n\n\n\n\n\
  在西弗吉尼亚州，州务卿办公室发现，对于现役人员而言，现有的邮件和电子投票系统无法使用。该州开展了一项试点计划，允许 150 名海外选民使用 `Voatz` 移动区块链应用程序参加\
  \ 2018 年 11 月的中期选举。丹佛市也在 2019 年 5 月的市政中测试了 `Voatz`，面向 4000 名符合条件的现役军人及海外选民。在这两种情况下，选举官员都报告称小样本的投票率有所提高。需要注意的是，`Voatz`\
  \ 是一家私人公司，而非政府或学术机构主导的计划。该系统可能是在进行票数统计，而不是提供个人验证性，但对其存在缺乏独立审查的批评。这种谨慎在区块链世界中是不寻常的，那里协作精神和开源开发理念通常反映了技术的透明度。然而，这确实证明了致力于推进区块链技术应用的企业所面临的挑战之一：知识产权保护。\n\
  \n# 区块链开发的挑战\n\n本书旨在希望了解区块链和加密货币格局的业务决策者，而不是面向那些可能通过在线社区和协作项目关注这一快速发展的软件世界的开发者。然而，高管们必须意识到任何新开发在系统设计和安全方面的潜在影响，以便向其技术交付团队提出正确的问题。\n\
  \n流程的自动化可能充满问题。人们只需看看任何公共服务软件平台发布期间的延迟和投诉，就能意识到自动化的复杂性和迭代本质。中心化记录系统的变更可以由数据所有者管理，但去中心化的账本系统又如何？当一个过程是自动化且不可篡改时，执行每笔交易的`smart\
  \ contract` 从开始就必须是滴水不漏的。在`第 2 章`中，我们讨论了通过部署智能合约错误可能产生的问题。控制区块链上交易的代码必须比中心化软件经过更严格的测试和审计。在解决棘手的业务问题和交付智能用户工具时，必须考虑包括知识产权管理和数据保护在内的日常事项。\n\
  \n# 品牌与知识产权\n\n谁拥有你的网站？构成普通互联网网站的知识产权、版权和开源材料错综复杂，异乎寻常。以一个简单的 `WordPress` 网站为例，`WordPress`\
  \ 底的代码是开源的，拥有庞大的贡献者社区和开源许可证，在使用或适配该软件时必须考虑其要求。`WordPress` 资产的图标和设计（如品牌标志）属于该公司，并且可能在一个或多个国家拥有了商标注册。你自己的标志也可能受到类似的保护。位于网站之上并赋予其外观和感官的主题，可能是一个开源皮肤，也可能是由第三方设计并授权你使用的，尽管他们对你的品牌颜色和标志没有权利。你为每个页面编写的文字可能属于你的版权。你放在页面上的图像可能是通过知识产权共享（Creative\
  \ Commons）许可提供的，可能是来自机构的付费许可，也可能是你拍摄的。如果照片是一件艺术品，版权属于艺术家而非摄影师。那么，到底是谁拥有你的网站呢？知识资本又在何？\n\
  \n新罕布什尔大学（UNH）法学院学术事务副院长、区块链法在线认证证书项目主任托尼亚·埃文斯（Tonya Evans）教授表示，知识资本是企业最重要的资产，但可能是最不被理解的。企业必须考虑到文字、图像或代码的版权、专利商标以及商业秘密，并在业务价值与市场及消费者的广泛需求之间取得平衡。`Cryptokitties`\
  \ 团队在开发`第 5 章`中描述的 `Nifty` 许可证时，保留了对猫卡通风格的明确所有权，同时将每个独特猫设计的使用权授予相关的代币持有者。这为创作者最大化了知识资本（他们需要一些成果来展示自己的工作），并对网络图像占用的习惯采取了明智的方法。\n\
  \n区块链开发中的开源协作是该领域我们看到的快速创新的主要特征。埃文斯提醒我们，开源许可证周围总是存在限制。当代码从开源资源中适配时，对这些适配可能会产生一些可以主张的知识资本。然而，正如上述对\
  \ `Voatz` 的批评所显示的那样，将底牌捂得太紧在公众认知中可能会适得其反。保留商业秘密必须为业务增加价值。如果保密损害了人们对企业的认知，可能会造成更大的破坏。\n\
  \n硬币的另一面是区块链对你品牌的价值。许多名字中带有“区块链”的企业涌现出来并不意外，因为这似乎将他们与竞争对手区分开来。同样不幸的是，很大比例的企业并没有达到预期。现在市场正趋于稳定，空壳项目正在出局，是时候利用区块链的优点了。克莱姆森大学学术伙伴与创新事务副总裁肖塔维亚·约翰逊（Shontavia\
  \ Johnson）在 2019 年 3 月于奥斯汀的 SXSW 演讲时，考虑了用于构建品牌的区块链特征：客户信任、效率以及通过应用程序将社区和影响者聚集在你品牌周围的能力。利用流行词可能会带来短期收益，但将你的品牌与正确使用区块链的价值观和原则对齐并以行动支持它，具有长期价值。消除术语并展示透明度、真实性、信誉、社区和效率是一项值得的业务策略。\n\
  \n# 数据保护\n\n\n\n\n\n数据保护立法是隐私法的现代延伸，这些隐私法在过去的 150 年里在多个司法管辖区的演变路径迥然不同。在美国，隐私法是通过普通法的自然演变发展的，其背景是宪法和第一条修正案所载载的言论自由和新闻自由权。虽然普通法中的“侵犯隐私”侵权赋予了个人“人身和财产的完全保护”，但在历史实践中，它是通过个案具体决决来实现的。随着社会和技术的发展，立法试图跟上隐私的新语境。1890\
  \ 年，立法的目标是新兴的摄影技术，这种技术导致了一些过度激进的新闻报道。沃伦（Warren）和布兰迪斯（Brandeis）在《哈佛法学评论》发表的《隐私权》是一篇具有影响力的文本，其中提出的担忧在我们的现代社会中依然清晰可见。自沃伦和布兰迪斯以来演变的现代侵权法保护个人免受“侵入孤独、公开公共事实、虚假光环和挪用”的影响。联邦法对政府侵入设定了限制，而各州则零散地增加了其他保护。这种立法的复杂性导致了法律法规的碎片化，它们有时会相互重叠或矛盾。例如，在数字领域，《2018\
  \ 年加州消费者隐私法》（CCPA）和伊利诺伊州的《2008 年生物识别信息隐私法》是独立且不相关的法律，解决隐私中非常具体的元素。开发者面临着挑战，必须确保其系统旨在采集和保留的数据能够通过各种不同法律的检验。\n\
  \n软件的跨国采用使情况更加复杂。区块链引发了一个连接的、去中心化世界的愿景，但这要求符合不同司法管辖区的规定。四个字母让所有科技公司心惊胆战：GDPR。这项于\
  \ 2018 年在全欧洲范围内生效的《通用数据保护条例》是严苛的，并且对分布式账本中的不可变记录具有特定影响。\n\n### 欧洲立法是如何这样发展的？\n\n\
  在欧洲，除非另有说明，否则一切都是私有的；而在美国，隐私是一种不可剥夺的权利，但对这种隐私的侵犯是按部门和按案例来定义的。这种差异可以追溯到一个重大历史事件及其遗产：第二次世界大战。战后，欧洲理事成立，1949\
  \ 年开始着制定《欧洲人权公约》（ECHR），这是一份支持民主、自由和个人权利的强有力宣言。2009 年，《欧盟基本权利宪章》将《人权公约》和不同国家的个人法律合并为一份宪章，它对欧盟所有成员国具有法律约束力。个人隐私权是明确规定的。这种全毯式的保护是欧洲监管的起点，随后的判例允许对个人数据进行有限访问。《通用数据保护条例》诞生于此背景，它限制了个人数据的实际收集，除非是出于特定原因，或者在未获得“知情同意”的情况下进行收集，而这是一个复杂的雷区。\n\
  \n### 案例研究：SDQ\n\n迈克·史密斯（Mike Smith）教授常驻欧洲，他运营的长处与困难问卷（SDQ）正在全球范围内。心理健康评估（特别是针对儿童）是非常敏感的领域，史密斯的经验为开发者在数据采集和保留方面应采取的提供了见解。他解释说，他一直避免收集任何人口统计学数据。为了完整性，采集年龄和性别是重要的，这些在评估中是相关的，但这些数据在包含多个记录的数据集中不会导致个人身份识别。然而，并不收集受访者的准确出生日期，因为根据有关样本的其他上下文信息，这很容易就能追溯到特定个人。\n\
  \n尽管 SDQ 不愿收集个人细节，但这些细节在医疗环境中至关重要，因为临床医生无法承担将数据关联错误患者的风险。这个问题的解决方案需要区块链，并且在 GDPR\
  \ 下是允许的，因为它是“设计安全”的范例。这是一种强大的数据保护机制。\n\n数据通过强加密和令牌化进行掩盖，使得存储的信息变得无法理解，恶意者需要花费数年才能重构。这些数据的唯一\
  \ ID 可以在临床端与患者信息绑定（由医疗专业人员本地控制），该 ID 的存储信息只能由密钥持有者解密。每次数据传输都有时间戳，为唯一 ID 提供了访问审计轨迹，但无法获知内容。这通过跟踪不透明的“数据块”来保护\
  \ SDQ，证明信息仍然被存储且没有丢失或被恶意删除。尽管这种结构防止了拥有部分信息的恶意者访问存储的数据，但围绕私钥的托管仍存在考虑因素：如果密钥丢失，宝贵的数据也将随之丢失且无法检索。解决这一挑战再次落到了开发者身上，要确保数据安全不会因为保护解密工具的措施而受到。\n\
  \n### 展望未来\n\n虽然企业可以快速行动应对挑战，游戏开发者遵循想象力打破障碍，但政府和治理的创新路径必然是较慢的。管理我们的个人数据、生活以及国家并非一项简单任务，但公共部门正在迎接挑战，采用新技术的速度比我们过去任何时候都要快。区块链技术可以实现我们生活方式的一些根本性变化，看到一个传统上缓慢的领域出现如此多的创新是令人目一新的。虽然许多应用尚未进行大规模部署，但它们已经上线并正在接受测试和审查的事实对于未来的采用是一个良好的预兆。\n\
  \n在最后一章中，让我们转向区块链周围尚未实现的机遇，以及面临的威胁。\n\n\n\n\n维护区块链所需的能量是惊人的。根据“比特币能源指数”（Bitcoin\
  \ Energy Index），仅比特币区块链的耗电量每年就翻一倍，在 2019 年其年耗电量已超过 730 亿瓦时。这与整个奥利利的能源需求相当，而且还没有考虑到以太坊网络或其他任何依赖工作证明（Proof\
  \ of Work）计算进行验证的公共区块链的负载。区块链是否消耗了太多能量？安德烈斯·M·安东波利斯（Andreas M. Antonopoulos）在 2019\
  \ 年 6 月于爱丁堡举行的一个苏格兰区块链活动上表现得很明确：作为一种稀缺资源，比特币使用的能量正符合市场所言。然而，在这一气候变化加速的时代，比特币社区的行为是否是负责任的？\n\
  \n## 可持续的工作证明\n\n对于任何工作证明类加密货币的矿工来说，财务激励对于维护链的完整性至关重要。回顾一下这一过程：为了随机确认一个交易区块并开启下一个区块，比特币区块链上的全节点竞争求解一个复杂的方程。第一个确定随机数值\
  \ `x` 的人赢得比赛，该值将生成一个包含包含随机数在内的区块内容且具有 `n` 个前导零的哈希值，并获得交易费和新造的比特币。这是一个高难度的复杂计算，但对于矿工来说参与它是值得的，这正是该结构的第一个救性特征。矿工不仅有动力维护区块链，而且为了自己的商业利益尽可能高效地进行维护。正如哈拉德·弗兰肯肯（Harald\
  \ Vranken）在他 2017 年的论文中出的，“比特币矿工最初使用通用计算机，但他们很快转向了更专业的硬件，这些硬件提供了更高的性能……以及更低的成本。”处理器的效率继续快速提升，而相对成本在下降。这并不仅仅是因为区块链对高处理能力的需求，尽管某些供应商已经定制了显卡来解决比特币算法（专用集成电路）。处理速度的加快也与机器学习和人工智能领域对详细、海量数据分析的巨大需求有关。\n\
  \n这些处理器使用的能量来源是区块链可持续性的主要考虑因素。根据 Coinshares 网络于 2019 年 6 月发表的研究，四分之三的矿活动由绿色能源驱动。作者表示：“我们对支持比特币挖矿网络的能源结构中可再生能源渗透率的保守估计为\
  \ 74.1%，这使得比特币挖矿比世界上几乎任何其他大规模行业都受可再生能源驱动。”这一数字与 2018 年 11 月的分析相比略有下降：使用再生能源是降低成本和减轻气候影响的成熟方法，而且矿工结构随时间推移而变化。挖矿活动在全球范围内使用太阳能风能，并被发现聚集在“有强流经过的人口相对稀少的丘陵或山区地区”，以利用廉价的水电。一些矿工和开发者还在全球范围内选择位置，以尽量地减少服务器冷却的能耗。在靠近北圈的国家，矿工正利用当地自然的凉爽气候使服务器保持在工作温度，大幅减少了全夜全功率运行空调的需求。\n\
  \n向可再生能源迈进并不总是受欢迎的策略。现有的可再生能源发电公司正在反击涌向廉价能源热点的矿工，例如尼加拉瀑布周边的城市已禁止矿工运营。然而，Coinshares\
  \ 的研究得出结论，更广泛的经济影响实际上是有益的。“比特币挖矿充当了全球最后的电力买家，因此往往聚集在利用率较低的可再生能源基础设施周围。这有助于让亏损的可再生能源项目盈利，并随着时间——随着行业成熟并在公众眼中成为常态——它可能成为此前不具效益的地区新可再生能源开发的动力。”\n\
  \n这并非普遍观点。普华道彼得·德弗里斯（Peter de Vries）的研究深入探讨了关于比特币可持续性的说法。尽管可再生能源的使用程度尚无可争议，但德弗里斯强调了一个事实：矿机处理器从开启到衰减到足以运行无利为止，对能量有着恒久的需求。这种持续的能量需求与可再生能源供应的波动性相矛盾，给其他来源带来了压力，例如中国矿业密集的四川省的燃煤发电厂。他甚至暗示，这种能源需求可能需要在该地区建设新的发电厂。德弗里斯说，工作证明处理器效率的提高也是令人担忧的。用于解决单一算法的处理器在过时后无法重用，会导致大量的电子垃圾。\n\
  \n利用可再生能源、提高处理器效率以及管理其回收和再利用的倡议仍然至关重要，必须同时解决德弗里斯提出的问题。实现比特币和其他工作证明币的可持续性是一个巨大的挑战，随着加密货币的扩展，这一挑战只会变得更加艰巨，而区块链技术在加密领域之外的使用进一步增加了其复杂性。\n\
  \n## 区块总是需要的吗？\n\n工作证明并不是地平线上唯一的耗能大户。分布式账本的本质就是……分布式的。账本的每个参与方都在本地存储了一个副本。在中心化系统中，数据库出于安全考虑存储在几个位置，用户通过\
  \ `API` 链接到相关的软件接口读取数据。在去中心化系统中，同一份数据可能有数百、数千甚至百万份副本，需要更多的存储空间和处理能力来更新每个节点的账本状态。\n\
  \n无论是加密还是商业用途的区块链都在逐步精简，以减少链上存储的数据量。这种动力是为了通过加快交易确认来改善用户体验，但减少区块链在处理和存储数据方面的压力也有助于该技术整体的可持续性。例如，比特币在\
  \ 2015 年开始开发`闪电网络`（Lightning Network），社区持续对其进行完善。`闪电网络`增加了一层个人对点的通道层，微交易可以在这些通道中处理，只有通道的最终余额会被不可篡改地时间标记在区块链上。这些倡议正在为长期来看更高效、更可持续的处理做出贡献。\n\
  \n\n\n\n同样重要的是，对于哪些应用适用于区块链要有明智的判断。如果一个系统使用中心化数据库运行得非常完美，如果不需要第三方来验证记录，如果只有一个组织在向数据库写入数据，那么没有理由为了用新技术而跳到新技术上。企业必须有效且合伦理地使用新兴技术，无论这涉及人工智能、智能设备、自动驾驶车辆还是区块链应用的开发。在许多节点上加载本可以易地存储在单个节点上的数据是对资源的浪费，而且能从中获得的益处也微乎其微。正如我们在第\
  \ 4 章中所看到的，区块链在在解决问题时才是有效的。如果没有问题需要解决，那么仅仅因为“你可以这样做”就将解决方案强行塞进运行良好的业务模型中，是没有任何价值的。然而，区块链具有改变生活的潜力。世界经济论坛^(6)\
  \ 估计，这项技术可以为欠发达国家和小型企业刺激数万亿美元的贸易额。正在为改进区块链和加密货币的可持续性所做的工作，对于确保这些利益不以加速气候变化为代价至关重要。\n\
  \n虽然比特币将始终保留其`工作量证明`Proof of Work）共识机制，但有大量工作正在进行，旨在为这种优雅、有效但耗能的共识机制寻找行为上健全且能拜占庭错误的替代方案。在第\
  \ 2 章中，我们详细研究了不同的共识机制，并确定通过采用`权益`Stake）和`权威`Authority）机制来降低区块链的能量消耗，可能需要对相关加密货币独立于中心权威进行永久性的权衡。这是一个不断演变的领域，对于一个开放、中立、无边界、去中心化的加密货币来说，最优的节能共识机制可能还需要几年时间才能实现。\n\
  \n## 对区块链完整性的威胁\n\n### 不可变性的副作用\n\n你是否习惯你的数据被永久性且不可更改地记录？我们这些出生在 1980 年以前的人已经松了一口气，因为我们的青少年时代和青年时期不是在社交媒体上度过的。我们年轻时的错误不仅可能是公开的，而且不可磨灭，这种想法是令人担忧的。我们回到了第\
  \ 6 章中讨论的隐私概念：虽然寻求匿名性或更大自由的人可能习惯基于区块链的社交网络，但这对于大多数人来说是不正确的。此外，法律规定（如欧洲的《通用数据保护条例》和“被遗忘权”）要求数据被仔细收集、安全存储并在请求时被删除。\n\
  \n还存在着非常真实的存档挑战。随着每个区块被添加到链中，维护这些日益庞大的分布式账本所需的数据存储量将不断增长。你会在哪一点，或者你是否可以关闭链的末端？我们被要求保留长达七年的税务记录，但一份雇主责任的保险证书必须持有几十年。从设计开始的长期资本项目的细节需要在其整个使用寿命内以及退役时进行验证，但我们现有的某些基础设施已经有数百年的历史了。在这项新技术的黎明中，人们急于将一切都置于区块链上：请考虑未来并明智地选择你的不可变记录。\n\
  \n### 渐进式中心化\n\n加密货币的创始原则是去中心化：一个完美的点对点交易和随机验证系统。比特币仍然遵循这一愿景，以太坊在创始团队放开缰子后也迅速变得去中心化，但其他领先的加密货币可以说远没有那么传统，且更加中心化。专门的区块链，如拥有\
  \ 21 个验证节点的`EOS`，或大多数代币仍由中心化持有的`Ripple XRP`，都是在中心化边缘游荡的模型。从发布`Libra`白皮书开始，所谓“公司加密货币（corpocurrency）”的兴起是另一个担忧来源。根据该白皮书，^(7)，“Libra\
  \ 协会的一个重要目标随着时间的推移增加去中心化程度。”它表明这种将在启动后“五年内”开始，但并没有清晰的去中心化过程机制。\n\n在区块链中，企业也倾向于选择许可链和私有链，将他们的商业底牌紧握在手中。`Hyperledger`项目、`IBM\
  \ blockchain`、`R3 Corda`以及金融后台专门的`Ripple`和`Stellar`系统的框架都是为一组已知的参与者设计的。很可能是，随着其社区的增长，这些系统将变得越来越开放、去中心化化，目前正在识别无需加密货币的验证机制，但前景阴云密布。\n\
  \n随着区块链的增长，我们如何管理追溯到 5 年、10 年、20 年或 50 年前源头的区块区块链？我们的区块链结构永久保留哈希数据。在身份记录方面，我们可能在一个世纪后仍需要访问以验证信息，更不用说长生命周期项目、环境数据、版权证明和其他应用的需求。截断链将是一个任意的过程，几乎肯定会给用户带来不便，并可能使整个链暴露于攻击，因为它损害了系统的完整性。坏心者完全可以传输链历史的虚假版本，而验证者将一无所知。\n\
  \n如果我们接受截断不是一个可行方案，那么我们该如何减少对所有产生数据所需的存储容量呢？估计显示，在未来五年内，地球上七十人中有一半的人将在区块链上至少存储一条记录。这个问题不会消失的。\n\
  \n目前提出的解决方案之一是创建不同类型的节点。目前，所有区块链都有可以执行交易的节点和参与验证及区块创建过程的全节点。建议是创建`微节点`（mini-nodes），设计用于持有最后几千个（或更多）区块，并定期与全节点持有的全链进行检查。这种观点类似于传统的公司审计流程：只要数据结构、系统和任何控制功能运行正常，数据就可以追溯到创世区块。这与截断不同，因为整个链始终可用，而虚假历史攻击的风险通过与原始链的定期检查得到了缓解。但是——总有一个“但是”——随着链的增长，能够托管完整记录的节点数量减少，存在数据集中在少数几个微节点完全依赖的全节点手中的风险。\n\
  \n## 量子威胁？\n\n区块链记录的持续扩张和中心化运营数字货币的兴起将影响加密无政府主义的去中心化理想。然而，在公众认知中，它并不是一个显见的威胁，不像区块上的最新热词：`量子`。\n\
  \n量子，宝贝！\n\n\n\n\n\n# 量子计算会摧毁支撑区块链的加密技术吗？\n\n在几乎每一个学习这项技术的论坛上，这个问题都会以某种形式被提出来。简短的答案是，量子计算更有可能加强加密，而非破解它。正如创新者、企业家、2018\
  \ 年艾森豪威尔研究员以及前高盛执行董事总经理威廉·霍尔利（William Hurley，众所周知的`Whurley`）所说的：要深受灵感，而不是恐惧。\n\n\
  这并不意味着未来的道路将一帆风顺。虽然由`工作量证明（Proof of Work）`保护的区块链结构和不可篡改性极不可能被破坏，但人们对以哈希形式存储在链上的数据安全性存在担忧。目前，量子计算机由物理学家编写，存在于超低温的`+0.5\
  \ Kelvin`环境中，并执行特定的且极其复杂的函数，这需要的是量子比特（`Qubits`）处理能力而非比特（bits）。构成所有当前主流加密（包括支撑区块链和加密货币的加密）骨干的`256\
  \ 位`加密，对于量子计算机来说仅仅是破解的玩具。\n\n量子计算不太可能像战坦克对抗长矛那样被释放出来破解加密。量子计算将实现更强大的加密，而区块链、加密货币以及所有其他加密用户都会采用它。一个简单的类比是观察我们对密码的使用随时间的变化。破解\
  \ 20 世纪 90 年代的密码很容易，它们是短单词，也许是一个数字，很可能基于你第一只宠物的名字。我们现在理解到，长串无关的单词是最安全的选择，我们已经顺应时代进步了。\n\
  \n继续这个类比可以说明人们对量子计算影响最担忧的领域。只要所使用的加密技术能跟上计算能力的演进，区块链的结构就是安全的。对量子计算潜在影响的研究承认，目前使用的某些`ASIC`（特定算法）矿机处理器已经接近现有量子计算机的速度。`Aggarwal\
  \ 等人^(8)`在`2017 年`的一篇论文中得出结论，量子计算机即使发展也不会获得优势。像`工作量证明`这样的共识机制的强度在于，它需要比可用更多的计算能力来更改早期的区块，并以比新区块添加更快的速度重新计算每个后续区块的算法。哈算力的逐渐增加不会影响链的完整性。真正的危险在于：首先，早期区块中加密的数据可能被破译；其次，量子处理可能破解签名周围的加密，足够快地破解私钥，以修改或阻止正在进行的交易。\n\
  \n开发者和企业必须为保护遗留数据制定计划，并尽可能减少链上存储的信息量，但这与本就应该进行的归档管理和区块链高效利用活动是一致的。目前有几个计划正在开发更稳健的区块链框架，例如`量子抗性账本（QRL）`开源社区。通过这条路线开发的技术旨在设计能够抵抗未来量子能力的更安全的签名系统。最终，量子计算不会破坏区块链，但它将使其演进和改进。\n\
  \n## 令人向往的机遇\n\n区块链的一些潜在应用初看非常简单，非常适合这项技术，但它们要么具有隐藏的复杂性，要么是时代未到的想法。金融部门在改进审计功能方面蕴含着巨大的巨大潜力。\n\
  \n## 审计与会计\n\n会计的核心在于通过双式记法记录交易，因此区块链是一项非常相关的技术。它镜像了会计的审计轨迹，对于该行业的任何人士来说都是熟悉的领域。这项技术如果实施得当，具有提高记录真实性和可靠性的潜力。\n\
  \n尽管`北信信（Northern Trust）`在私募股权交易方面与审计机构`普华永（PwC）`和毕马威（KPMG）`合作成功，但更广泛的审计领域要复杂。位于纽约的`Auditchain`一直在探索区块链在防止会计丑闻中的作用，而这些丑闻经常出现在头条新闻中。`2001\
  \ 年``安然（Enron）`公司的破产及其随后的“审计五强”之一`安达森（Arthur Andersen）`的倒闭导致了《萨班斯-奥克斯利法案（Sarbanes-Oxley\
  \ Act）》的广泛监管，但问题依然存在。仅`2018 年`就发生了对`通用电气（GE）`的调查，以及其在 122 年后从道道琼斯指数中退市；英国几家知名公司的倒闭（包括建筑巨头`Carillion`、咖啡连锁店`Patisserie\
  \ Valerie`和零售连锁`BHS`），以及南非 Gupta 商业帝国的解散。审计师遭到了严厉批评。作为`GE`一个多世纪的审计师，`毕马威（KPMG）`没有采取任何措施来抑制证券交易委员会（SEC）描述的\
  \ GE“激进会计”行为。在英国，他们还受到财务报告委员会（FRC）的指责，指责他们“盖章”了未能代表`Carillion`业务真实状况的数字，并且在为客户提供丰厚咨询工作时存在利益冲突。他们在南非也面临批评，一名来自\
  \ Gupta 团队的前`毕马威`审计师被指控行为不当和逃税。`财务报告局（FR）`就`BHS`倒闭对`普华永（PwC）`及个人员工进行了斥责并罚款，并批评`德勤天锐（Grant\
  \ Thornton）`在签署`Patisserie Valerie`账户时没有发现其现金余额中显而易见的致命漏洞。\n\n`Auditchain`正试图在一个监管变得越来越严格的行业中取得进展，但这可能不是解决问题的正确方案。创始人`Jason\
  \ Meyers`概述了支撑`Auditchain`方法论的核心信念：系统和控制目标的合规是审计中最重要的部分。如果系统运行正常，那么数据结构就是正确的，并且可以追溯到期初余额。如果我们将其放在`区块链`的背景下，那么如果对最近的几百个区块进行采样并发现是正确的，数据就可以一直信任到第一个（创区块），因为系统运行正常。在如此合规的情况下下，欺诈的成本将变得高不可企。\n\
  \n\n\n\n\n会计师和审计师对区块链持谨慎态度，这是因为存在原始分录挑战，我们在第 4 章中探讨过这一问题。区块链是基于密码学的可验证的交易真实性记录，而非绝对真理的记录。审计师对于在缺乏原始材料监督的情况下信任账本感到非常警惕，这就是为什么我的\
  \ CPA 同事们在培训期间需要爬上脚架去检查储罐是否装满，而我作为制造业的管理会计师，则要手动清数数千个螺栓和螺丝钉来验证库存水平。审计信心衡量非常复杂，正如迈耶斯所说，区块链尚未完全适应这些标准。他认为认为，审计方法的标准化对行业构成了感知威胁。谨慎态度既保护了工作，也保护了咨询收入，而这些收入是基于对日益严苛的法规的解读。然而，鉴于近期四大审计机构在涉及重大商业丑闻时面临的批评，内部很可能会发生变化。监管机构可能会试图打破市场领导者的垄断，并恢复\
  \ 20 世纪 80 年代以前存在的咨询与审计公司之间的划分——当时普华华道（后来的 `PwC`）收购了管理咨询公司 Urwick Orr and Partners。\n\
  \n当这种变化到来时，迈耶斯的同事将准备就绪。Auditchain 是 `DCARPE Alliance` 的创始成员，这是一个日益扩大的早期采用者网络，他们协作证明有一种更好的方法可以为实现实时财务报告的企业提供保证。去中心化持续审计与报告协议生态系统将审计的系统、控制和数据元素分配给较小的公司，从而产生了一个适当去中心化的审计师群体，而非单一公司。区块链记录了根据规范会计实践的《国际财务报告准则》由审计师提供的证明。这种方法的早期客户是那些已经在区块链和加密货币领域运营的企业，他们对新想法持开放态度，并需要为自己的业务提供坚实的财务背景。这是一个非常值得关注的领域，并代表了区块链为不断增长的问题提供合适解决方案真正机遇。\n\
  \n## 商业信用证\n\n尽管区块链在银行跨境结算中占据了一席之地，并在北方信托（Northern Trust）开创的私募股权管理中得到了应用，但其他金融服务也可以从不可篡改的记录、分布式验证和智能合约中受益。一个例子是现有的信用证系统，它降低了进出口的商业风险。\n\
  \n与没有信任关系的人支付货款在面对面操作时很简单，但一旦交易不再是瞬时的，情况就会变得复杂。为此此，我们依赖于与中间人建立信任。在消费者层面，`eBay` 是一个中心化系统的良好例子，它帮助人们管理与付款后等待收货相关的风险。它让买家有信心向未知卖家发送资金，并设有了机制以在出现问题时进行退款。它通过通过评价系统让买家的意见透明化，并在违约时实施制裁来要求卖方负责，同时通过在交货前提示安全付款来最大限度地保护卖方。\n\
  \n商业信用证，也称为单据信用证，是银行开具的保证，旨在向卖方保证在发货前资金充足的，并且在收到货物后将进行付款。然而，在商业规模上，该系统既复杂又昂贵。跨境货运的价值和货物跨越全球的时间是典型消费者购买的许多倍。供应商的承诺（特别是在按需制造或种植货物时）是重大的。买家也可能需要存现金供银行开具担保，导致营运资金被占用数周或数月。\n\
  \n如果能够大规模实施可靠的解决方案，这是一个极待被颠覆的过程。`HSBC` 在 2019 年在 `Voltron` 平台上试点了基于区块链的信用证，其中包括一笔人民币计价的交易，耗时\
  \ 24 小时完成，而标准为十天^(9)。这是银行向商业模型迈出的重要一步，具有更低的成本和更快的处理速度，也是向更广泛的分布式推动的重要组成部分。\n\n##\
  \ 变化的社会\n\n区块链和其他新兴技术正在迅速改变我们社会的运作方式。对于大多数人来说，未来充满了令人兴奋的变化，但也有担心少数人无法跟上。即使在拥有普及机会的国家，仍有相当比例的人口不具备数字能力。在美国，2019\
  \ 年的报告显示 10% 的美国人没有上网；在英国，类似的研究显示近五分之一的英国人不使用互联网^(10)。在这两个国家，这包含了老年人，以及受教育程度和家庭收入较低的人群。我们已经看到在银行化经济中没有银行账户的公民处于劣势，但如果这一群体无法接入我们这个新世界的去中心化在线社区，他们将被遗留。变化的社会必须包含教育和支持以利用机遇。\n\
  \n## 回报创作者\n\n区块链最珍视的目标之一是收益的民主化。这可以追溯到《加密无政府宣言》^(11)，该宣言预见到“为任何可以转化为文字和图片的材料建立一个流动性市场”。区块链为生产者和创作者提供了金融包容性机制，而正在进行的商品溯源和供应链中的商品追溯工作使此类物品的来源变得透明。在第\
  \ 5 章中，我们还探讨了区块链（特别是非同质化标记）在音乐行业和供应链中的作用，以及在管理复杂的无国界版税系统方面取得进展的工作。\n\n确保实体生产者获得合理的报酬，在区块链出现很久就已经由公平贸易基金会（`Fair-Trade\
  \ Foundation`）和全球类似的组织所倡导。区块链在这里的作用不是颠覆，而是提供一种帮助现有系统的工具。区块链可能帮助减少向生产者的信贷成本，并管理“最后一公里”的现金。确保付款到达正确的人手中，并最大限度地减少跨境结算中的损失，可能是加密货币的角色。公平贸易也意识到了区块链在信息去中心化和民主化方面的潜力^(12)。他们的希望是这“支持农民了解他们的作物经历的历程——可能帮助他们更好地管理客户关系和风险——并最终变得更有韧性”。\n\
  \n\n\n\n那么，数字资产呢？这些资产非常适合分布式账本进行管理，其使用的机制与第 4 章中探讨的溯源应用相同。这里的区别在于，仅仅验证所有权是不够的。溯源记录随着货物的易手而向前移动，为了奖励创造者，资金必须回流到源头。所有资产的管理似乎是账本的一个显而易见的用例，正如我们在第\
  \ 6 章中所看到的，从土地地块到生命记录，各项事务的注册机构都在逐渐向分布式系统转型。任何资产的所有权模式可能非常复杂，划分和共同所有也屡见不常。这不仅是记录的问题，也适用于代币化（tokenization）。\n\
  \n将金融工具以及虚拟和实体投资资产表示为代币，为新的商业活动开启了可能性。虽然管理钻石、艺术品和奢侈品等实体资产的溯源和可追溯性在商业上已经成熟，但将这一原则扩展到股票、证券甚至投资房产仍处于实现的非常早期阶段。探索这种代币化表明了增加交易流动性的潜力，并为众筹和股权变现提供了机会。用代币表示资产可能会引导我们走向点对点的非货币资产交换。\n\
  \n## 数据与身份\n\n你上一次使用你的数据作为货币购买服务是什么时候？是机场的 Wi-Fi，还是酒店、咖啡店或火车上的？我确信在你输入姓名和电子邮箱地址并将数据暴露给未知网络时，你阅读了所有的条款和条件。或者，可能是\
  \ Facebook 上的最新游戏。人们经常对病毒式应用留存的数据以及 Facebook 本身留存的数据表示关切^(13)，他们要求“非排他性的、可传输的、可子许可的、免版税的全球范围许可，用于托管、使用、分发、修改、运行、复制、公开表演或展示、翻译以及创作你内容的衍生作品。”大型科技巨头将从隐私到个性化的连续体视为一种消费者的选择。在\
  \ 2016 年 SXSW 大会上，微软的 Mike Hintze 和谷歌的 Keith Enright 谈到了赋能用户、构建信任工程，以及管理个人对隐私体验的敏感性以开始个性化。数字世界的伦理正处于聚光灯下。据报道，谷歌和苹果等公司已聘请内部哲学家.^(14)芝加哥洛伊拉大学的数字伦理与政策中心制定了有关在线和数字环境中伦理行为的最佳实践和指南，每年举办数字伦理国际研讨会，并发表关于人工智能、个人数据所有权^(15)到自动驾驶汽车等领域的伦理论文。\n\
  \n如果我们放弃一些个人数据，我们该如何被识别？有效证明个人身份几代以来一直是一个挑战。物理确认身份的部分解决方案在世界范围内零散应用。跨越国界通常需要身份证或护照，其中某些但并非所有的证都会列出持有者的家庭地址以及姓名、国籍和出生信息。筛选还可能涉及（根据作者最近的个人经历）提供部分、全部或无：指纹、指纹、全指纹、视网膜扫描、人脸识别扫描，以及入境期间的完整联系方式和旅行计划。在各个国家内部，身份证可能无处不在也可能缺失，出生记录可能是即时且精确的，也可能是非正式的，以至于在没有任何出生年份细节的情况下，官方文件通常将出生日期记录为\
  \ 1 月 1 日。\n\n在数字领域，存在多个伪身份系统，允许我们在个人供应商提供的软件之间无缝移动，并通常用于通过第三方软件验证我们的身份。2016 年，苹果确认其拥有十亿活跃设备，全部连接到\
  \ `Apple ID`。Facebook 的二十亿用户可以“使用 Facebook 登录”多个应用程序。微软账户控制着对公司生产的全套工具的访问。格局很混乱，而且账户本身实际上是匿名的，因为用户自证为真实人类。假账号泛滥。将账户与服务关联的技术虽然很好，但在确实需要验证账户持有人身份的情况下（例如访问税务服务或银行软件时），该过程又回到了物理证明上。\n\
  \n这是一个令人困惑的局面，控制是集中的，大量的个人数据容易受到黑客攻击和盗窃。区块链技术具有通过分布式验证提供单一身份证明的潜力。身份区块链可以从出生注册开始，并在其发生时纳入接种、资质、选民注册和位置变更等生命事件。记录是不可篡改的，数据源是分布式的，且没有中心化的控制。在安全性方面，虽然单个区块可能被访问，但整个信息链将不可见。目前，如果出示身份证证明年龄，它可能暴露出生地和当前地址。根据数据保护和隐私原则，在可靠的记录中仅显示出生日期块是有优的。尽管从爱斯尼亚到\
  \ ID2020 再到世界粮食计划，在数字身份方面存在重大创新，但要实现一个全球性的身份记录与认可系统仍有许多年路要走。\n\n## 牙牙仙\n\n在我向许多慷慨投入时间协助研究这本书的人所提出的问题中，最难的一个可能是：如果我们进入一个无现金世界，牙牙仙会在枕头下放什么？\n\
  \nDLA Piper 的 Martin Bartlam 推测，即使是现在，孩子们在牙牙仙停止访问很久之后才会意识到钱的价值。他们看到父母在线订购商品并使用接触式卡在店里支付；现金已是稀奇。牙牙仙的传统会随着我们这最后懂得金钱的一代而消失吗？我们对媒介的依恋日益感性化。“我们还如何玩硬币或做出生活中重大的是否决定？”作者\
  \ Mark Hayes 问道，“扫描条码永远行不通。”早已占据孩子注意力的智能设备可能是答案，”金融科技演讲者 Liz Lumley 说。牙牙仙会发一条短信，“你的账户已更新”，还是给小读者一个关于收集牙齿和相应回报的童话？Anneola\
  \ Ward 提出了一个简单而奇地安慰的信息：“你的牙齿在云端。”无论发生什么，我们的世界将以我们无法想象的方式发生变化。\n\n\n\n\n## 4. Cellan-Jones,\
