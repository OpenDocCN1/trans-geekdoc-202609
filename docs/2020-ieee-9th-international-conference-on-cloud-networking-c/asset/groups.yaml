    # (2) Data preprocessing


    Time series usually contains a certain amount of discrepancies, in large-scale
    and high-dimensional data sets (such as found in this study). We perform preprocessing
    for common discrepancies (such as outliers) to ensure the quality of the prediction
    model. Three network event datasets (NSL-KDD, UNW-NB15, and Palo Alto Alto traffic
    log) are used to develop our system. Besides fixing the data discrepancy issue,
    our procedure also includes many related preprocessing functions, such as normalization.


    For low standard deviation related features, we normalize them by the max, as
    in (2)


    ```

    $$\hat{a} = \frac{a}{a_{max}}$ (2)

    ```


    : where is the original raw value


    # (3) Deep Reinforcement Learning (DRL) Model


    The core of our ANIDS is the reinforcement-learning anomaly detection engine.
    It is designed to achieve self-detection of attack to automatically learn network
    traffic behavior, especially for types of attack. Unlike the other IDS that are
    mainly based on the simulated dataset, our proposed model is designed for real-time
    operation in the network. Thus, our system converts network traffic data into
    environment variables in RL, the RL agent is equal to the intrusion detection
    engine, and the reward is determined by whether the recognition is correct. Fig.
    3 shows the process. In order to enhance the self-update function, reinforcement
    learning has two modes: learning and detection mode. The flow of these two modes
    is organized as follows:


    # Learning Mode:


    +   1. The RL agent state the variables, which is converted from network traffic
    data, and gives an action.


    +   2. The reward function calculates the reward based on action and label, feedback
    by the RL agent.


    +   3. The RL agent updates its policy (intrusion detection model) based on the
    reward and statistics.


    +   4. Back to step 1.


    # Detection mode:


