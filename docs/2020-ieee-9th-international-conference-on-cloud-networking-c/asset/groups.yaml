    It is evident from Figure 5 that our proposed DRL method outperforms others with
    high accuracy of 91.4% and a recall of 90% to classify the tasks. The three classes
    from our study (RF, SVM, and MLP) have similar classification pattern. All of
    these obtain high precision because they have a lower false-positive rate; however,
    they all show a lower recall (around 65% to 71%), which may be due to their high
    number of false-negative incorrectly classifying traffic as normal. In this case,
    it decreases system stability and increases the risk of network intrusion. Experimental
    results show that our approach achieves a balance of about 92% across all metrics
    of accuracy, precision, and recall. Unlike other recent related models, self-taught
    learning [15] and RBM [16], both have an accuracy and precision less than 90%.
    For the recall, RBA has a rate of 78.8%, which is higher than the other related
    models but lower than the best model of our proposed DRL method (92.4%). The recall
    from self-taught learning (96%) is significantly higher than our proposed model
    (90.2%), but both its accuracy and precision are lower than ours. Based on the
    comparison, we can conclude that our proposed method is promising in this use.


