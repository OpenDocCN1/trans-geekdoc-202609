    ## VI. 结论


    NIDS 网络流量通过检测异常活动或网络攻击，以确保通信的安全与可靠性。在本文中，我们提出了一种基于深度强化学习（DRL）的异常检测系统。我们的方法包括在不同环境下的数据收集和处理步骤。强化学习方法可以在两种模式运行：学习模式旨在适应模型，以便在持续处理网络流量时保持高准确性，而检测模式则保持高处理速度模式。为了证明我们方法的可行性，我们进一步将模型应用于从校园网络环境中获取的亿节点
    Alto 系统。我们将提出的 DRL 与三种不同的机器学习模型进行了比较。我们提出的方法均显示出最高的检测准确率、处理速度性能以及持续模型更新的有效性。


