    # 一种深度强化学习的异常入侵检测系统


    Ying-Feng Hu, Morito Matsuoka


    大阪大学网络媒体中心，日本，大阪

    邮箱: {yf.hu, matsuoka}@cmc.osaka-u.ac


    **摘要**— 入侵检测系统（IDS）对于组织确保通信的安全与防护至关重要。在本文中，我们提出了一种基于深度强化学习（DRL）的异常入侵检测系统。我们的系统具有适应新类型网络流量行为的能力。我们通过两个著名的基准数据集：NSL-KDD、UNSW-NB15
    和校园网络日志研究了我们工作的有效性。为了证明我们方法的行性，我们将我们的方法与其他三种方法以及两个已发表的结果进行了比较。第三，我们的系统能够实时处理大规模的网络流量。


    在本文中，我们提出了一种基于深度强化学习（DRL）的异常入侵检测系统（AIDS）。我们的 DRL 异常引擎有两个模式，即检测模式和学习模式，可以自由切换。在检测模式优于阈值时的任何时候，系统都可以学习新的网络流量模式。我们在广泛使用的网络入侵模拟数据集
    NSL-KDD 和 UNSW-NB15 上评估了我们的方法。此外，我们还将该方法应用于校园网络环境，该环境包含约 3 亿条日流量记录，规模是合成数据集的 100
    倍左右。为了进一步评估所提工作的性能，我们包含了三种经典方法并比较了结果。


    **关键词**— 入侵检测系统；IDS；深度强化学习；深度学习；随机森林；支持向量机


    # I. 引言


    据估计，全球 IP 流量在 2017 年每月约为 120  EB（指数字节），到 2022 年将达到每月 400  EB。由于网络攻击的规模和复杂性增加，需要有效的技术和工具来处理敏感信息泄露、中断和匿名等威胁。网络入侵检测系统（IDS）已成为许多组织必不可少的工具。此类系统通过监控网络流量是否存在恶意活动或循环，来确保其通信和信息的安全与防护。


    通常，IDS 分为两类：NDS（基于特征的网络入侵检测系统）和 AIDS（基于异常的网络入侵检测系统）。如今，主流防护依赖于特征，它使用模式匹配算法，通过将预测攻击与入侵日志内部的特征数据库进行对比，从网络中识别并检测威胁。NDS
    对已知攻击的检测能力可以避免误报。然而，基于特征的系统无法检测未知的流量模式。对于具有流量保护功能的 NDS，需要频繁的维护和例行更新。相比之下，AIDS
    侧重于流量模式的偏差，并使用这些技术评估接入流量，即使是未知攻击。


    本文的其余部分组织如下：在第二节中，我们调查了基于强化学习的网络入侵检测系统相关方法；在第三节中，我们讨论了所提工作的背景并描述了方法；在第四节中，我们描述了所提工作的系统架构和性能，并在第五节中提供了全面的评估。我们在第六节中总结了本文并讨论了未来的研究方向。


    # II. 相关工作


    各种机器学习检测或分类技术已获得某种程度的关注，如 [2]、[3] 和 [4]。由于基于强化学习方法的方法较少，我们在本节中对相关工作进行了详的总结。该工作侧重于结合学习、强化学习和关联规则方法进行网络入侵检测。结果显示，强化学习通过激励奖励活动有助于检测攻击。提出了一种基于上下文的方法，使用分布在网络中的深度强化学习智能体。所提工作通过
    NSL-KDD、UNSW-NB15 和 AWID 数据集进行了评估，证明了其实现高准确度和优于其他先进解决方案的能力。一种对抗强化学习方法 [4] 通过其
    AWID 和 NSL-KDD 数据集的实验结果结合了环境学习过程，该方法通过调整学习率（LR）解决监督的 IDS 分类问题，具有加权准确率（>0.8）和 F1
    指标（>0.7）。定义可靠函数对于基于强化学习的 IDS 来说最具挑战性。正如 [5] 所述，该方法通过用网络函数替换 CTRL 深度行检测。另一项工作 [6]
    提出了一种使用 Q-learning 算法优化数据属性切分值的算法。所提算法能够在无预测的情况下实现 98% 的高分类准确率。此外，多项工作为网络基础设施提出了强化学习检测系统（IDS-RL）。例如，[7]
    使用了带有简单探索策略的强化学习。每个网络智能体学习本地状态并发送到中心。通过收集来自本地的所有信号，中心智能体学习入侵告警。同样，[8] 提出了 IDS-RL
    IDS 引擎来分析和监控网络流量。我们使用对比测试将 IDS-RL 与自适应机器学习型 IDS（AML-IDS）和聚类混合 IDS（ASCH-IDS）进行比较。实验结果显示，IDS-RL
    优于其他方法。


    # III. 背景


    在本研究中，我们使用了两个三个基准数据集：NSL-KDD 和 UNSW-NB15。此外，我们还将该方法应用于校园网络环境，该环境包含约 3 亿条日流量记录，规模是合成数据集的
    100 倍左右。所提工作的可行性通过三个网络入侵检测系统进行了评估。


