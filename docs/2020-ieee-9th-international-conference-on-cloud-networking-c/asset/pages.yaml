    # B. Evaluation of NS-KDD


    It is evident from Figure 5 that our proposed DRL method outperforms others with
    high accuracy of 91.4% and a recall of 90% to classify the tasks. The three classes
    from our study (RF, SVM, and MLP) have similar classification pattern. All of
    these obtain high precision because they have a lower false-positive rate; however,
    they all show a lower recall (around 65% to 71%), which may be due to their high
    number of false-negative incorrectly classifying traffic as normal. In this case,
    it decreases system stability and increases the risk of network intrusion. Experimental
    results show that our approach achieves a balance of about 92% across all metrics
    of accuracy, precision, and recall. Unlike other recent related models, self-taught
    learning [15] and RBM [16], both have an accuracy and precision less than 90%.
    For the recall, RBA has a rate of 78.8%, which is higher than the other related
    models but lower than the best model of our proposed DRL method (92.4%). The recall
    from self-taught learning (96%) is significantly higher than our proposed model
    (90.2%), but both its accuracy and precision are lower than ours. Based on the
    comparison, we can conclude that our proposed method is promising in this use.


    ![](img/30ce015e48fec37b37fbb2080a8b94f7_4_0.png)


    # C. Evaluation of NS-WB15


    Figure 6 demonstrates our results from the NS-WB15 dataset. Similar to the NS-KDD
    test result, our proposed DRL achieves a balance of about 92% across the metrics
    of accuracy, precision, and recall compared to our three classical methods and
    other related models, self-taught learning [15] and cascade ANN [17]. Those models
    have the detection of higher recall (around 97%), lower accuracy (around 83% to
    87%), and lower


    precision (around 78% to 82%) that our proposed models have a higher false-positive
    rate, which tends to treat normal traffic as an anomaly. Users may find it highly
    problematic if system administrators the prediction fails to detect normal traffic.
    In addition, our proposed method obtains the high accuracy (91.8%) and precision
    (93.2%) among all the models that were compared. Based on the evaluation, we conclude
    that the proposed DRL method also provides promising results in the UNS-WB15 use
    case.


    ![](img/30ce015e48fec37b37fbb2080a8b94f7_4_1.png)


    # D. Evaluation of real-time network traffic


    The log dataset is collected and abstracted from 14 classes'' days network traffic
    log and sorted in time. The first from 10 days are used as the training data,
    and the last 4 days are used for the testing data. The training dataset consists
    of normal traffic while the testing dataset consists of 613,333 records. In experiment,
    we provide the baseline comparison from three classical methods. All show very
    high recall, which makes the false-positive rate very few in these models. The
    accuracy and precision are lower than that of DRL method. For recall, all models
    show a similar score of 90%. This demonstrates the effectiveness of classification.
    Overall, good results in this test show that our campus network log is a real
    network traffic; the normal and attack traffic do not have many patterns in a
    short period. Even, continuously using the proposed method still shows its effects.


