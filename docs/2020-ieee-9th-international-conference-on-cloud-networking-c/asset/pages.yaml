    A. The NSL-KDD dataset


    The NSL-KDD [9] dataset was originally taken from the Kdd99 dataset for data science
    competition. While the dataset consists of 125,973 TCP connection records, the
    testing dataset consists of 22,544 records. There are 91 features including individual
    TCP features, 6 content features, consecutive temporal features over a two-second
    window, and 10 network traffic statistics features. In the training, there are
    normal types and 22 attack types, but in the testing dataset, there are 37 attack
    types (15 types not in the training dataset); this model is designed to handle
    unknown attacks.


