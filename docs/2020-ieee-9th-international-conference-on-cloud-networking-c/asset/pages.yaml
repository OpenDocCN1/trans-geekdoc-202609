  md: '# # A Deep Reinforcement Learning Approach for Anomaly Intrusion Detection
    System


    Ying-Feng Hu, Morito Matsuoka


    Cybermedia Center, Osaka University, Osaka, Japan

    Email: {yf.hu, matsuoka}@cmc.osaka-u.ac


    **Abstract**— Intrusion detection systems (NDS) are essential for organizations
    to ensure the safety and security of their communication. In this paper, we propose
    a deep reinforcement learning (DRL) for anomaly intrusion detection system. Our
    system has the ability of adapting to new types of network traffic behavior. We
    study the effectiveness of our work through two well-known benchmark datasets:
    NSL-KDD and UNSW-NB15 and campus network log. To show the feasibility of our approach,
    we compared our method with three other methods and two published results. Third,
    our system is capable of processing scale of network traffic on a real-time base.


    In this paper, we propose an anomaly intrusion detection system (AIDS) based on
    deep reinforcement learning (DRL). Our DRL anomaly engine has two modes, i.e.,
    detection mode and learning mode, that can be freely switched. At any time when
    the detection mode preferred the threshold, the system can learn to new network
    traffic patterns. We evaluated our approach on widely network intrusion intrusion
    simulations NSL-KDD and UNSW-NB15. In addition, we also applied our method to
    campus network environment, which consists of about 300 million daily traffic
    records and is about 100 times larger than those of synthetic datasets. To further
    evaluate the performance of our proposed work, we include three classical methods
    and compare results.


    **Keywords**—intrusion detection system; NDS; deep reinforcement learning; deep
    learning; random forest; support vector machine


    # I. INTRODUCTION


    The total worldwide IP traffic is estimated to be about 120 exabytes per month
    in 2017 and to 400 exabytes per month in 2022. Due to the increases in volume
    and sophistication of network-based attacks, effective techniques and tools are
    required to handle the threats of disclosure of sensitive information, disruption,
    and anonymity. Network intrusion detection systems (IDS) has become essential
    for many organizations. Such monitor network traffic for malicious activities
    or cycles to ensure the safety and security of their communication and information.


    Typically IDS are classified into two categories: NDS (signature-based network
    intrusion detection system) and AIDS (anomaly-based network intrusion detection
    system). Nowadays, the mainstream protection relies on signature, which uses a
    pattern-matching algorithm to identify and detect threats from the network by
    comparing a predicted attack against signature database inside intrusion log.
    NDS detection capabilities for known attacks can avoid false alarms. However,
    it is a signature-based system is not capable of detecting unknown traffic patterns.
    For NDS with network traffic protection, frequent maintenance and routine updates
    are are required. In contrast, AIDS focuses on deviations of the traffic pattern
    and use these techniques to evaluate incoming traffic and even when with unknown
    attacks.


    The rest of this paper is organized as follows: In Section II we survey related
    approaches for network intrusion detection systems for the reinforcement learning-based
    approach. In Section III, we discuss the background of the proposed work and describe
    our methodology; In Section IV, we describe the system architecture and performance
    of the proposed work, we provide a comprehensive evaluation in Section V. We conclude
    this paper and discuss future research directions in Section VI.


