  \ Limitations And Possible Attacks2019110010.1109/ICICT46008.2019.899344\n\n# 工业革命：区块链作为工业\
  \ 4.0 和物联网的浪\n\nSukriti Goyal^(1), Nikhil Sharma^(1, **)), Ila Kaushik^(2), Bharat\
  \ Bhushan^(3)\n\n¹ HMR Institute of Technology & Management, Delhi, India\n\n² Krishna\
  \ Institute of Engineering & Technology, Ghaziabad, U.P\n\n³ School of Engineering\
  \ and Technology, Sharda University, Greater Noida\n\n## 摘要\n\n在古代，人类更倾向于使用手工工具来完成任何工作。在过去的几年里，生产相关业务一直在不断扩大。人们开始依靠工具、机器和智能设备来处理工作，因为这些工具有助于他们在规定的时间内实现目标。技术的增长已经引发了多次工业革命。出现了一种名为区块链的新技术。区块链可能是现代数字经济中最破坏性的技术。区块链的能力已经在许多研究工作、媒体，特别是在金融领域得到了很好的描述。一项现有研究正处于组织阶段，它实现了网络安全和不可篡改性。工业\
  \ 4.0 和物联网涉及了其日益增长的应用。因此，本文介绍了区块链在物联网和工业 4.0 设置中的当前应用、现有开放问题、现代应用领域、物联网面临的挑战及其解决方案。\n\
  \n**关键词:** 农业、区块链、教育、食品供应链、医疗保健、工业革命、工业 4.0、物联网 (IoT)、隐私、安全、可扩展性。\n\n* * *\n\n(*)\
  \ **通讯作者 Nikhil Sharma:** 印度德里 HMR 技术与管理学院； 电子邮箱：nikhilsharma1694@gmail.com\n\n\
  ## 1. 引言\n\n\n\n\n毫无疑问，区块链技术是一项实不起虚发明。区块链通过允许数字信息传播而非复制，构建了现代互联网的骨干。事实上，这项技术最初是为了数字货币（*即*比特币）而发明的，现在技术领域已经发现了该技术的其他高效用途[1]。因此，简单来说，区块链是一个带有时间戳的不可转换的信息序列，它由计算机网络处理，而非任何个人实体所有[2]。这些数字块中的每一个都通过使用公共数据库（*即*，链）来相互保护和限制[3]。在网络中，区块链技术通过密码学原理确保数据共享的安全，为所有人提供了一个去中心化的数据库或数字账本[4]。基本上，这个网络是一系列计算机系统，在经过身份验证和存储之前必须允许共享。区块链有许多核心元素，但只描述了三个最基本的元素。\n\
  \n第一个元素是区块，每条链都包含几个区块，每个区块都有三个基本组成部分，其中存储在区块中的数据是第一个部分[5]。一个 32 位的整数被称为 `nonce`（随机数）。在第二个部分中，当一个区块生成时，它会被随机创建，进而产生一个区块头哈希[6]。第三个，一个\
  \ 256 位的 `hash`（哈希值）与 `nonce` 结合。它必须以大量的 0 开头，也就是说，它的值非常小[7]。在链的第一个区块生成后，`nonce`\
  \ 会创建密码哈希。区块中的数据被视为已签名，并在被挖掘之前永久与 `nonce` 以及 `hash` 链接[8]。\n\n第二个元素是矿工。通过被称为挖掘的程序，矿工在链上产生新的区块。在区块链中，每个区块都有自己不可重复的\
  \ `hash` 和 `nonce`，同时，它引用了链中前一个区块的 `hash`[9]。因此，挖掘一个区块并不简单，特别是在巨大的链上。为了解决寻找产生可接受\
  \ `hash` 的 `nonce` 的复杂数学问题，矿工使用特殊软件，因为 `nonce` 只有 32 位，而 `hash` 有 256 位。在搜索正确答案之前，必须挖掘大约\
  \ 40 亿种可能的 `nonce-hash` 组合[10]。当这种情况发生时，矿工必须找到“黄金随机数”，他们的数据就会包含在数据库中。网络的所有节点都会接受任何形式的修改，矿工在成功挖掘一个区块后将获得奖励[11]。\n\
  \n第三个元素是节点。去中心化是区块链技术中最重要的主题之一。链不能被某个计算机系统或公司所有[12]。相反，它是一个传播的账本，节点通过它连接到链。节点（任何形式的电子设备）管理区块链的副本并维护网络运行。区块链技术的主要应用是通过受保护的共享记录财务信息。人们已经在努力将区块链技术的用途扩展到金融领域之外的其他领域……（此处原文存在大量重复文本，已按语意整合）。\n\
  \n节点（任何形式的电子设备）管理区块链的副本并维护网络运行。区块链技术的主要应用是通过受保护的共享记录财务信息。人们已经在努力将区块链技术的用途扩展到金融领域之外的其他领域……[13]。*即*，金融及其他领域，智能家居，智能城市[14]。\n\
  \n## 2. 背景\n\n本节讨论了工业 4.0 以及 IIoT 与 IoT 之间的比较。\n\n### 2.1. 工业 4.0\n\n在人类生活的每天，技术都起着重要作用。它让数据访问变得更快。商业氛围正参与这种快速增长。针对\
  \ 2020 年，“工业 4.0”于 2011 年在德国汉诺威展提出。在工业革命中，工业 4.0 意味着一个关注互联性、机器学习（ML）、实时数据和自动化的现代阶段[16]。它也有时被称为\
  \ IIIoT 或智能生产。在深入研究之前，了解生产自 1800 年以来是如何演变的是有益的。正如（图 1](#9781681088624-C6.html#c6f1)）所示，世界上面临着四种不同的工业革命[17]。\n\
  \n![Images/9781681088624-C6_F1.jpg](img/**图 (1))))**\n\n工业革命的阶段。\n\n#### 2.1.1.\
  \ 第一次工业革命\n\n在 18 世纪末到 19 世纪初之间，发生了第一次工业革命。在此期间，生产从依靠人类和动物的体力劳动演变而来。它得到了人们通过水力和、蒸汽机以及其他机械武器所进行的更高效的体力劳动的支持[18]。\n\
  \n#### 2.1.2. 第二次工业革命\n\n世界在 20 世纪初通过钢铁的引入和电力在工厂中的应用引入了第二次工业革命。为了优化并创建移动设备等工厂设备，电力制造商被引入了工厂。而且，在此期间，流水线等大规模生产概念被提出作为一种提高生产力的方法。\n\
  \n\n\n20 世纪 50 年代后期，随着制造商开始将计算机技术整合到他们的工厂中，第三次工业革命开始缓慢兴起。在那期间，他们开始经历一种变化，这种变化对机械和模拟技术的依赖减少了，而转向了包括自动化软件在内的数字技术。\n\
  \n## 2.1.4. 第四次工业革命或工业 4.0\n\n在过去的十年里，第四次工业革命兴起，被称为“工业 4.0”。它主要关注从当前 10 年到数字技术，在物联网（IoT）互联关联性的支持下，迈向一个完全的现代阶段。工业\
  \ 4.0 为生产提供了一种更具连接性、更广泛且整体的策略 [19]。它将物理与数字技术连接起来，允许在部门、产品和人员之间进行更好的优化和访问。此外，工业 4.0\
  \ 赋予了企业所有者监控和理解其执行各个方面的能力，并允许他们利用即时信息来增强制造业、促进运营并提高增长。\n\n## 2.2. IIoT\n\nIIoT（工业物联网）意味着物联网在工业领域和应用中的扩展与使用。通过对大数据、机器学习和\
  \ M2M（机器间通信）的高度关注，IIoT 使企业和工厂在执行过程中拥有更好的优化、能力和稳定性。此外，它还涵盖了工业应用，包括医疗保健设备、软件定义制造流程以及机器人技术\
  \ [20]。通常，IIoT 是使用智能执行器和传感器来提升生产和工业流程。有时，它也被视为“工业 4.0”或“工业互联网”。IIoT 背后的核心概念是，智能机器在实时评估数据方面比人类更好，在处理与业务相关的重大信息时也更受青，以便更快、更准确地做出有效决策\
  \ [21]。\n\n### 2.2.1. IIoT 对比 IoT\n\n基本上，IIoT 和 IoT 都拥有许多常用技术，如 M2M *即* 机器间通信、传感器和执行器、关联性、云平台以及可用于不同目标的数据分析。IoT\
  \ 的应用是连接多个部门的设备，即医疗、企业、农业、汽车、客户和公用事业，还包括政府和城市。IoT 设备包括智能设备、健身手带以及许多其他在出现问题时通常不会产生紧急情况的应用程序。而另一方面，IIoT\
  \ 连接了设备和机器，这进一步有助于生产和公用事业。IIoT 部署中的系统故障和停机可能会产生高风险案例甚至威胁生命的情况。与 IoT 应用以用户为中心的性质相反，IIoT\
  \ 的应用更侧重于增强能力和提高健康或安全性 [22]。\n\n## 3. 主要应用\n\nIIoT 在当今世界中发挥着重要作用。IoT 与工业的结合使其与其他技术相比更受欢迎。它涉及了医疗健康行业、农业等许多领域。IIoT\
  \ 的主要应用说明如下：\n\n### 3.1. 医疗保健行业\n\n在医疗保健行业，通过应用区块链技术，可以高效地共享患者的敏感信息，从而有效促进医疗服务的分配。例如，通过降低不同患者之间的效率差异，并减少患者护理期间发生的错误数量\
  \ [23]。为了便于疾病的控制和管理，区块链驱动的物联网已应用于医疗部门。区块链赋能的物联网的一些示例包括可穿戴设备、智能药物和增强的质量控制 [24]。它们还允许在评估期间对临床药物进行追踪，通过测试其影响及其副作用。\n\
  \n以下是区块链技术在医疗保健行业的一些主要应用：\n\n#### 3.1.1. 患者记录管理\n\n在处理患者记录时遇到的主要问题之一是，患者的医疗相关信息分散在多个医疗服务供应商处。EHR（电子健康记录）的组成部分难以处理，且不能分散在多个工业设置中。此外，多个医疗机构与服务供应商之间存在的问题为胜利信息的成功交换制造了更多障碍\
  \ [25]。这种缺乏调整的数据管理和信息共享的缺陷意味着，这些数据不是统一的，而是片段化的。\n\n\n\n\n1. **MedRec**: 这是一个著名的医疗保健区块链设计，用于有效且专业地记录电子健康记录（EHR）。`MedRec`\
  \ 的原型允许患者能够一站式访问其在多个供应商处的医疗历史，这就像以太坊区块链上的智能合约将数据指针汇聚到“患者-医疗提供者关系”中一样。`MedRec` 还通过高效且易用的用户界面，促进了新记录的审查、共享和发布\
  \ [28]]。该界面还包含一个通知系统，当有新数据代表用户上传或与其共享时，会提醒用户或患者。在这一区块链的实现中，EHR 还具有一种新兴的区块链 PHR（*i.e.*\
  \ 患者健康记录）能力，允许用户和多个服务提供者创建包含每个患者全生命医疗状况的纵向医疗数据。\n\n2. **Medicalchain**: 这是一个用于 EHR（*i.e.*\
  \ 健康记录）的区块链，允许多个医疗提供者（即医院、外科医生、专业人士、药剂师以及保险公司）请求访问并与医疗数据进行通信。每条通信都是安全、可审计且透明的，并作为交易存储在\
  \ `Medicalchain` 的分发账本上 [29]]。\n\n### 3.1.4. 挑战\n\n以下是医疗行业的采纳在将区块链应用于系统时可能会遇到的一些复杂问题。\n\
  \n1. **医疗保健是分散的**：医疗服务提供者在数据管理方面并非统一的。如果没有这样的系统，要让他们应用区块链技术将是一项复杂的工作。此外，如果系统中的任何参与者对这些修改产生抵触，那么整个系统的实用性就会降低。\n\
  \n2. **缺乏认可的可靠性**：医疗保健是一个如此敏感且分散的行业，无法在一夜之间完成改进。因此，在区块链技术成功实施之前，很难发现这种技术的接受是否可行\
  \ [30]]。\n\n3. **其他挑战**：区块链技术的实现需要最好的架构和互联性，这是初创公司无法简单负担的。此外，技术障碍也不允许区块链技术完全应用于医疗领域。在某些企业中，由于区块链环境中的指令匮乏，互联设备的系统系统被中断了。\n\
  \n### 3.2. 制造业\n\n制造业是全球 GDP 的重要参与者，一直受到效率低下和数据安全等各种挑战的困扰。尽管如此，与许多行业一样，制造业的表面健康状况并不能预示未来的成功。区块链能够通过提供每个制造资产的可可见性，从根本上改变它\
  \ [31]]。下面讨论了区块链在制造业中的一些用用例。\n\n#### 3.2.1. 增强数据保护\n\n在任何供应链中，联系方式和发票详情等交互信息使用传统程序处理时可能会非常危险。这正是区块链通过最佳加密方法帮助保持细节的地方\
  \ [32]]。因为在区块链中，信息块无非与前一个区块连接的有序记录的文档副本，这消除了数据受到攻击的可能性。\n\n#### 3.2.2. 制造工厂\n\n\
  对于计划性维护，一些制造工厂已经使用了物联网和机器学习技术。与机器零件生命周期相关的细节可以收集并存储在区块链网络中，智能机械可以订购备件并按计划支付。此外，生产者可以在区块链网络中记录其数据，并将其应用于将其\
  \ ERP 系统与其供应商系统连接起来 [33]]。\n\n#### 3.2.3. 改进的追踪与可追溯性\n\n可以实现支持物联网的系统来追踪制造零件的来源。它提高了价值链中每个人的透明度以及可追溯性。从物联网传感器收集的数据可以记录在区块链网络中，允许共享视图，并确保货物在随供应链移动时管理上没有空隙\
  \ [34]]。许多过程（包括文档记录、获取认证等）也可以通过该技术的执行得到显著增强。\n\n#### 3.2.4. 交付的信誉\n\n生产者极大依赖于他们购买的交付质量。信誉良好的供应商日益地希望他们的品牌被存储和普及。这一需求通过区块链的支持得到了应对，生产者可以获得与其供应商相关的数据，以便他们确认获得的是所声称的物品，且这些交付尺寸正确、没有任何损坏\
  \ [35]]。此外，智能合约的执行确保了知识产权和支付的安全。\n\n#### 3.2.5. 高效库存管理\n\n网络中的任何人都可以访问记录，因为区块链技术允许参与者与供应链中的每个利益相关者连接，包括供应商、分销商或零售商。这意味着每个人都持有一个记录副本，从而避免了供应链过程中产生的混乱。这有助于更好地设计和处理库存。\n\
  \n#### 3.2.6. 挑战\n\n区块链能够增强制造业的各个方面，使其更具信誉、更具成本效益且速度更快。在具有许多优势的同时，各行业在将区块链技术应用于其制造业务时也面临着几个问题。所有者需要分析其业务的可扩展性，并理解获取区块链技术是否对他们有利。此外，要在制造业中从区块链中获益，将涉及链中每个参与者的广泛增强。每个生产者可能是多个区块链的一个部分，因此处理所有这些链的设置是挑战性的。因此，这些区块链的各种执行必须标准化并具有互操作性，以实现这些区块链的合并统一。由于各种企业正在生成自有区块链，互操作性将是实现的一个大问题\
  \ [36]]。\n\n### 3.3. 农业工业\n\n\n\n\n农业业务依赖于多个外部组件（如温度、气候、湿度、收获完善程度等），以及复杂的交付链，这些链条可以通过执行区块链来实现环境的透明化。这项技术允许端到端的交易以透明的方式进行，而不需要农业领域的中间人或银行等中间介。通过消除对中心机构的需求，区块链改变了信任的授予方式——不再依赖银行机构。信任建立在密码学以及端到端基础设施之上。它还有助于恢复生产者和客户之间的信任，从而降低农业市场的交易成本。区块链提供了一种用于追踪匿名参与者之间交易的可靠技术\
  \ [37]。区块链在所有参与社区之间提供了透明度，促进了可信信息的形成，并为客户、组织和政府高度关注的食品质量和安全相关问题提供了解决方案。\n\n以下描述了区块链技术在农业领域的一些一些用例。\n\
  \n### 3.3.1. 农作物和食品的生产\n\n从农户到生产者再到零售商，区块链技术结合物联网重塑了食品生产市场。区块链通过实施简化的技术 [38]，利用包含劳动力、水和肥料的农业资源，使农业成为一项可持续的职业。\n\
  \n### 3.3.2. 防止天气灾害\n\n在生产不同种作物时，农民通常必须面对不可预测的天气状况。因此，预报和监控天气状况对于作物生产是必要的。美国（US）生产的许多作物因强期间的春雨而无法存活。此外，近期食品链生态系统缺乏透明度可能导致价格不明且巨大的价格飙升。客户并不知道作物何时遭遇了恶劣天气状况，以及是什么导致了成本增加。农民、生产者和其他利益相关者能够直观地理解食品分销市场的价格差异。通过区块链账本，经过认证的机构可以追踪天气状况，这样农民可以通过智能合约快速获得农作物保险理赔。\n\
  \n### 3.3.3. 食品供应链\n\n追踪食品供应链对于追溯食品生产源头是一项细致的工作。有必要确保交付的食品是安全的。但在操作上，食品供应链成为食品源头商和零售商验证产品来源的问题。随着区块链技术的整合，在食品交付链环境中引入信任和透明度已变得可行，确保每个人的食品安全。\n\
  \n### 3.3.4. 处理农业金融\n\n在正式金融会议与小农户之间发生的无数问题中，一些是透明度、信用历史以及合同执行问题。无法获得金融服务会对农业价值链的绩效产生不利影响，导致生产者无法增加产量，购买者面临问题\
  \ [39]。区块链通过透明度和共享控制访问权限，在农业金融过程中产生了公平性。\n\n### 3.3.5. 挑战\n\n进入区块链的信息被认为是透明且公开的，要说服并鼓励小型消费者接受区块链技术概念可能是一个问题。大多数现有解决方案基于通过物联网传感器收集的这些数据。因此，除了支付区块链订阅费用外，相关机构还必须补偿物联网的实施。其次，收集上传到区块链平台的信息可能非常贵，这将成为农业行业接受区块链的障碍。第三，区块链无法直接无缝地与当前的遗留系统结合，构建应用区块链技术的结构通常是非常耗时的。因此，区块链中存在的复杂性将成为在该领域实施基于此类技术的解决方案的阻碍。\n\
  \n## 4. 开放问题与现代应用领域\n\n在本章的这一部分，将讨论工业物联网技术中获取区块链的一些近期主要问题，以及工业物联网或工业 4.0 中的现代应用领域，在这些领域正执行区块链技术以寻找可行的解决方案。\n\
  \n## 4.1. 与 IIoT 中采用区块链技术相关的开放挑战\n\n与 IIoT 中采用区块链技术相关的开放挑战解释如下：\n\n### 4.1.1. 能量和成本效率\n\
  \n随着区块链规模的增大，必须任命更强大的矿工来实施如 `Proof-of-Work`（工作量证明）之类的共识机制。某些节能型共识协议可以只记录区块链上最的交易数据，而不是记录区块链的完整数据。然而，能量和资源受限的工业物联网设备仍然被产生大量的商业信息所淹没\
  \ [40]。因此，更高效的共识算法结构仍然是一个主要问题。\n\n### 4.1.2. 监管\n\n由于区块链技术是以去中心化的方式实施的，不依赖于任何第三方，必须执行中心机构、商业标准以及政府法规。\n\
  \n### 4.1.3. 资源限制 \n\n现有的区块链运行需要持续的网络连接，而工业物联网设备并不总是能确保持久的网络连接。因此，在这种情况下，区块链的执行是一个问题。此外，区块链产生了高网络开销，这对于整合到工业物联网再次是一个问题\
  \ [41]。由于物联网设备和网络的资源限制，现有区块链技术与物联网网络结合的去中心化程度有限 [42]。\n\n### 4.1.4. 安全性与机密性\n\n\
  物联网网络已经受到多种保护攻击，即窃听攻击和重放攻击。除了这些威胁，区块链还带来了安全风险。该技术中常见的安全威胁包括消息劫持、机密泄露、智能合约程序风险等。\n\
  \n### 4.1.5. 可扩展性\n\n在区块链中，可扩展性问题是广泛应用的主要障碍。在现有区块链技术的执行中，每个完全参与的节点都需要持有区块链的副本。与传统数据库相比，这导致了巨大的存储开销\
  \ [43]。特别是在工业物联网的情况下，传感器节点的数量和产生的信息量不断增加，因此问题变得更加严剧。\n\n## 4.2. 工业物联网中实施区块链的现代应用领域\n\
  \n在工业物联网中，有多个实施区块链的各种领域，如下所示。\n\n### 4.2.1. 出租车行业\n\n\n\n\n像 Uber、Ola 等现有的共享出行服务采用集中式结构运营，通过其调度中心实施算法来监控其出租车队。区块链技术可以为当前的模式提供一种去中心化且传播的技术，让出租车司机和乘客产生一个更以消费者为驱动的客户定位。为了在更大的规模上运行，通过信任和更好的覆盖，司机也可以合作。他们还可以形成一个稳定的客户名单，并依靠其获得日常收入，而消费者也将拥有可以信赖的来源。\n\
  \n## 4.2.2. 音乐行业\n\n受版权保护完整性由智能合约提供保障。这些智能合约描述并自动化了产品利益相关者之间的通信与连接。此外，它有助于确保消费者购买的产品是经过授权的，而非仅仅是精仿品。在音乐领域，音乐版权管理是智能合约的一个高效用例\
  \ [44]。由于过去 10-15 年互联网的进步以及众多在线音乐流媒体功能，音乐行业经历着一场变革。音乐行业中的版税评估程序一直是一项复杂的工作。然而，随着互联网服务的发展，这种方法变得更加复杂\
  \ [45]。区块链可以通过处理一个精确且广泛的去中心化数据库（以传播式账本的方式记录音乐所有权的完整数据），帮助使版税支付程序变得安全且透明。\n\n## 4.2.3.\
  \ 教育行业\n\n基于网络的远程学习的效能有助于对教育数据和学生成绩单进行自力性且透明检查的需求。对于教育文件，基于区块链技术的平台可以充当书记，为学术机构和所有者提供一种获取安全成绩单以及所有记录数据的表单。就业的功能性特征表明，随着职业路径跨越机构和学科的分歧，需要更专门的领域\
  \ [46]。现在，在这种情况下，区块链可以成为学术证明的基础，为所有者提供所需的信息，以发现申请人的简历是否准确。\n\n## 4.2.4. 无人机行业\n\n\
  无人机行业是区块链技术正被尝试和测试的现代行业。无人机（也称为 UAV *i.e.* 无人飞行器）正被大规模用于民用目的，偏离了它们在军事领域的传统用途。UAV\
  \ 网络的安全是一个重要领域，该领域有大量的研究工作。在一项研究 [47] 中，提出将区块链技术与 UAV 网络相结合，其中网络中的每架无人飞行器将作为区块链的节点运行。这一建议被认为可以保护网络免受入侵行为，即入侵者试图拦截交互和控制命令，以接管网络中的每一个节点\
  \ [48]。\n\n## 5. 实施挑战\n\n物理世界正在转化为计算机化。智能设备和现代技术的爆发使人类能够随时随地与彼此进行频繁互动。海量信息正通过数据度量技术进行处理和评估。在现代及趋势的技术中，其中一项是工业物联网（IIoT），也被称为工业\
  \ 4.0 或工业互联网。该技术可以引入惊叹的设备、增强的分析以及投入工作的人员。通过在工业中将 M2M 交互与大数据分析相结合，工业物联网可以运行卓越的优化、生产性和产出阶段。几乎所有公司都转向物联网增强机构，以实现技术统一整合到它们的工作中。随着\
  \ IIoT 的进步，它在处理商业领域的实时数据分析动态方面已显而易见。然而，仍有一些阻碍着工业物联网的实施。工业近期面临的主要挑战如图（图 2 **图 (2))**\n\
  \n与 IIoT 实施相关的挑战。\n\n### 5.1. 数据存储\n\n数据存储是企业面临的主要挑战之一。在当今世界，所有假设的活动很大程度上取决于过去保存的数据。没有哪个机构在使用过时的传统程序来解析数据通常会被评估为高频的信息，然后将其丢弃\
  \ [49]。IIoT 有助于收集大量对企业未来资产具有敏感性的数据（OT 网络之外）。因此，对于任何企业来说，在长期通过工业物联网之前，预安排信息的安全存储是一个要求\
  \ [50]。\n\n### 5.2. 分析挑战\n\n在这一挑战中，如果在业务中执行物联网解决方案，其原始 ROI 值将通过从收集的 IoT 内容中蕴含的可操作洞察来确定。这只有在高性能分析平台的支持下能够管理解决方案中所包含的海量信息的情况下才可行。数据分析团队在执行\
  \ IoT 架构时，必须包含数据的处理、清洗和表示。这确保为扩展性组件留出足够的空间，以便将实时或预测分析简单地连接到 IoT 解决方案中 [51]。\n\n\
  ### 5.3. 连接中断挑战\n\n如果一个机构考虑引入工业物联网，那么对不间断的连接有稳定的需求。即使使用互联网连接，其 100% 的存在几乎是不可能的。在某一时刻，连接会因为维护或其他目的而丢失\
  \ [52]。因此，如果一个机构考虑将 IIoT 技术引入其系统，那么关键要求就是具备不间断的连接。\n\n### 5.4. 为客户交付价值\n\n执行工业物联网解决方案的设计从长期来看可以极大影响能力、消费者满意度和生产力。拥有工业物联网是一件大事，整个过程需要深入的理解。企业通常为现代技术设计，以弥补理解消费者问题陈述的空间。因此，物联网顾问非常有必要发现主要的性能指标，通过物联网解决方案进行衡量和增强\
  \ [53]。\n\n### 5.5. 安全\n\n\n\n\n\n在历史上，已经记录了多起网络犯罪案件。因此，保护敏感信息免受网络犯罪的侵害，比处理通用的 IT\
  \ 网络更为必要。因此，这直一直是工业物联网在实施和技术方面面临的最大挑战，因为普通的风险就会摧毁业务 [54]。如果企业预先通过工业物联网来减少此类问题 [55]，这意味着要为网络引入新的保护工具，这会意味着成本的增加和沉重的维护工作。因此，许多企业在准备好稳固的安全或保护安排之前，通常会避开工业物联网的概念\
  \ [56]。\n\n# 6. 工业物联网实施挑战的解决方案\n\n为了应对工业物联网实施中的挑战，有多种解决方案，如图 3 所示，企业、组织或公司可以在其系统中应用。\n\
  \n![](img/9781681088624-C6_F3.jpg) **图 (3)**\n\n处理 IIoT 实施挑战的解决方案。\n\n### 6.1. 物联网网关聚类\n\
  \n物联网网关分组确保了 IT 系统的统一，即 ERP 系统和 CRM 应用与 SCADA 和 MES 系统等 OT 系统的统一。同时，它确保了云端交互的一性和异常信息的记录，解决了\
  \ OT 与 IT 融合的问题 [57]。\n\n### 6.2. TTM, TPM 和 TNM\n\n为了减少安全问题，商业单元可以运行可终端模块（`i.e.`\
  \ `TTM`）、可信感知模块（`i.e.` `TPM`）和可信网络模块（`i.e.` `TNM`）。此外，还有许多数据集中保护解决方案可以确保数据在传输状态或静态状态下的加密安全，这些包括安全\
  \ Web 网关、Web 应用防火墙以及应用传输控制器。\n\n### 6.3. IIoT 网关\n\n工业物联网网关可以支持当前的设备架构，安全地连接到任何商业架构。例如，物联网网关可以使用工业协议（即\
  \ `OPC`、无线技术、`MODBUS`、`ISA100` 和 `PROFIBUS`）将分布式控制系统直接连接到云平台。这为设备间的交互问题提供了一种解决方案\
  \ [58]。\n\n### 6.4. 边缘计算\n\n边缘计算技术允许仅传输合理的数据进行进一步分析，而不是在云平台上传输一组数据。在边缘计算技术中，数量具有不同操作的网关相互连接，形成一个网关簇，这个簇导致了分布式的边缘计算\
  \ [59]。在此过程中，分布式边缘节点允许在数据传输到云端之前在靠近边缘或靠近源的地方进行处理，从而减少了输出的延迟 [60]。之后，所有过滤后的信息可以直接传输到雾节点，而雾节点的结合允许了分布式的雾计算。这将有助于快速数据共享、实时数据评估，并允许更快的缺陷响应时间。\n\
  \n## 7. 结论\n\n随着即将到来的第四次工业革命（也称为工业 4.0），现代有害技术被认为正渗透到商业环境中。这些解决方案之一是“区块链技术”，其目标是统一异构系统并处理工业交易。虽然区块链技术发挥着重要作用，但对于工业物联网或工业\
  \ 4.0 的整体增强来说仍然非常微妙。IIoT 致力于现代社会更大程度的自动化。根据专家介绍，工业物联网或工业 4.0 技术将随着时间的推移进一步发展。认为工业物联网最终将成为创新的驱动力。在本章中，我们详细讨论了区块链在\
  \ IIoT 中的应用，以及工业 4.0 以及应对这些问题的解决方案。\n\n## 出版许可\n\n不适用。\n\n## 利益冲突\n\n作者声明无利益冲突。\n\
