  \ |\n\n# 大数据管理的区块链解决方案\n\nDeepak Kumar Sharma(1, **]), Saakshi Bhargava(2), Aashna\
  \ Jha(3), Sudhir K. Sharma(4)\n\n¹ 信息技术学院，Netaji Subhas 技术大学, Dwarka, Delhi 110078,\
  \ India\n² 物理科学与工程系，Banasthali Vidyapith, Tonk, Rajasthan, India\n³ 电子与通信系，Netaji\
  \ Subhas 技术大学, Dwarka, Delhi 110078, India\n⁴ 计算机科学系，信息技术与管理学院, New Del-hi, India\n\
  \n## 摘要\n\n在不断增长的世界中，管理前所未的数据增长是一项重要任务。由于世界正面临着消费者和技术所产生的数字数据在数量和多样性方面的发展，处理这些海量数据并找到存储、处理和组织它们的最佳方式是必要的。这正是区块链发挥作用之处，作为私有数据的去中心化系统，它提供了重要的输入。无疑，许多行业专家正在考虑区块链及其对许多领域改进的效益。大数据是生态系统中飞速增长的领域，因为每个行业都希望了解客户的习惯安排，而大数据指的是通过先进的统计表示法和数据挖掘来揭示基本轮廓的海量数据集。产生的数据量达到拍字节级，当我们处理如此大规模的数据集时，相关问题也随之产生，此时人们不仅关注数据收集，还额外强调了安全措施，并对产生的数据进行妥善维护，以防止恶意行为发生。\n\
  \n**关键词：** 大数据、物联网、比特币、区块链、共识算法、加密货币、密码学、数据挖掘、去中心化、分布式账本、电子健康记录、不可变网络、物联网、对等网络、私有链、权益证明、工作量证明、公链、公钥、智能合约。\n\
  \n* 通讯作者 Deepak Kumar Sharma：信息技术学院，Netaji Subhas 技术大学, Dwarka, Delhi 110078, India；电话：9868861080；电子邮箱：dk.sharma1982@yahoo.com\n\
  \n## 1. 引言\n\n区块链和大数据是两种以惊人速度持续扩展的技术。两者都是独立开发的，并在很大程度上独立应用于各个行业。区块链应用主要专注于加密货币和比特币，其分布式账本技术（`DLT`）吸引了这一新领域的技术爱好者和潜在投资者。它进一步扩展到银行和供应链管理等其他领域，应用于生活的各个方面。区块链技术通过其去中心化的结构和消除第三方，确实可以改变目前的全球经济体系。大数据近年来成为一个热词，数据正以前以前未有的速度倍倍增长。它的应用不能局限于单一领域，因为数据在处处被利用和生成。从传感器到社交媒体网站，大数据无处不在。在涉及到利用和分析时，挑战随之而生，因为它掌握着关键信息的钥匙。这些信息被证明对企业和政府都是有价值的，用于研究其产品和服务的性能。\n\
  \n后续章节的主要贡献将重点介绍：\n\n*   连接区块链和大数据这两项强大的技术。\n*   关注区块链技术如何改变我们处理大数据的方式，并使其成为一个更高效的过程。\n\
  *   强调各种益处，例如确保数据安全和执行数据分析——区块链的出现及其与大数据的整合可以为各种行业服务。\n\n本文的结构如下：引言包括机制、区块链的最新进展以及它必须面临的挑战，还包含了大数据的基础知识、其类型和特征，这些将集中在第二部分。第二部分介绍了大数据和区块链如何共同产生影响。最后两个部分致力于进一步进展和结论。\n\
  \n## 2. 区块链简介\n\n区块链技术（1）以不止一种方式改变了世界。可以说，它涵盖了从经济（2）到医疗保健的多个领域。区块链产生的历史可以归功于中本，他概述了该技术的工作原理，从那时起一直在为各种应用进行开发。以太坊更进了一，开发了智能合约的概念。区块链通常被称为分布式账本技术（`DLT`）。观察它的简单方法是参考\
  \ Google 文档或维基百科。在这里，我们的文档分布在许多地方，每个人都可以实时更改，任何更新对所有人可见。由于区块链基于 `DLT` 且每个人都可以访问账本，信息是透明的从而增加了问责制（3）。\n\
  \n与现有系统相比，区块链（4）的主要优势是不涉及交易费用。维护系统的基础设施成本是存在的，但任何进行交易的用户都不会面临额外费用。这是因为区块链通过其去中心化系统消除了任何第三方。这对未来的经济体系将产生严重影响，因为许多企业目前通过作为连接消费者与产品的第三方来获利。例如，任何杂志的年度订阅将不再流行，因为用户只需为每篇文章支付很小金额即可，考虑到不会收取额外的交易费用。\n\
  \n区块链顾名其实义的——由`区块`组成的链。在这里，`区块`是存储在公共数据库中的数字信息片段。尽管它在当今世界上日益重要，但区块链并不是一项新技术。事实上，它是三种经过证明的现有技术（5）的结合体，如图（1）所示。\n\
  \n![](img/9781681088624-C11_F1.jpg)图 (1))\n\n3 种技术。\n\n\n\n\n\n点对网络（Peer to Peer\
  \ Network）是区块链技术的核心特征。该网络无非是一个相互连接和互通的节点系统。每个节点都是一个计算机网络，可以接收任何输入或执行功能并发送输出。不同节点之间没有层级结构，具有统一的拓扑结构，工作被平均分配。\n\
  \n公钥加密（Public Key Cryptography）使用了两个密钥的概念：公钥和私钥。顾名思，公钥是公开的并在成员之间传播，而私钥由少数人持有。公钥可以加密消息，使得持有私钥的人才能读取。持有私钥的人可以创建数字签名，任何拥有相关公钥的人都可以验证该信息。\n\
  \n程序指的是协议，它本质上是一组治理账本 p2p 特性的规则。它涵盖了验证、交易以及列出区块链运行机制等方面。协议由数字资产驱动，这种资产产生了一种自利元素以维持区块链的运行。这些数字资产本质上是作为用于挖矿的算力的回报。根据场景的不同，它们可以是代币或代币。\n\
  \n### 2.1. 机制\n\n正如三项技术构成了区块链技术一样，三根支柱支撑着区块链机制。这三根支柱是不可篡改性、去中心化和透明性。不可篡改性是指区块链由于其哈希函数的特性。去中心化加速了交易过程，并提供了更好的安全问责制。透明性是去中心化系统的必然结果。虽然它保护了用户的隐私信息，但交易仍然是的，使其成为一个非常安全的系统。区块链运行的基本机制可以分解为三个步骤：\n\
  \n1. 一旦有人请求交易，该请求就会被记录。此区块存储了如时间戳、交易细节以及各方的数字签名等信息。\n2. 交易被验证。这项工作由计算机网络（称为 `nodes`）完成。\n\
  3. 交易以区块的形式存储在许多其他相似交易中。每个区块都有一个名为 `hash` 的唯一代码。尽管任何两个交易都很相似，但每个区块都有唯一的 `hash`。每个区块还赋予了上一个区块的哈希值，从而形成了区块链。\n\
  \n所有步骤如图图 ([2]) 所示，使得每一步都清晰可见：\n\n![](img/9781681088624-C11_F2.jpg) **图 (2)** 区块链形成。\n\
  \n由于区块链是完全去中心化的，信任变成了一个问题。区块链对所有人开放，每个 `node` 保持匿名，这使得验证传递的信息变得困难。因此，开发了共识模型以确保新去中心化节点系统中的信任。共识模型有两种类型：\n\
  \n### 2.1.1. 工作量证明 (Proof of Work)\n\n要在链中添加任何区块，`nodes` 必须执行挖矿以验证信息并记录交易。这涉及解决消耗大量能量的计算难题。作为回报，他们会获得代币或硬币等奖励。\n\
  \n### 2.1.2. 权益证明 (Proof of Stake)\n\n这是作为工作量证明模型的替代方案。它提供了更高的安全更低的风险。根据这一概念，用户可以购买允许他们挖矿或验证交易的代币。更多的硬币或代币意味着更大的算力。\n\
  \n### 2.2. 类型\n\n区块链运行的分布式账本技术 (`DLT`) 是现代世界的福音。它增加了安全性，改进了问责制，并带来了更高的透明度。它甚至减少了对第三方的需求，从而降低了交易成本。它也有某些局限性。`DLT`\
  \ 需要根据用户的需求进行定制和处理，这导致了对不同类型区块链分类的需求。根据对分布式账本技术 (`DLT`) 的使用，区块链分为四种类型：\n\n### 2.2.1.\
  \ 公有区块链\n\n这些区块链是非限制性的且无需许可的。任何人都可以作为用户或矿工成为区块链的一部分，交易是完全透明的。从完全开放的基础公有区块链开始。公有区块链允许每个用户参与系统。这些区块链的目的是为了使其在本质上是完全去中心化的，没有任何用户/矿工有权控制所形成链中记录的数据。它具有抗审查性，因为无论人们身处何地、想要接入的网络是什么，每个人都被允许加入系统，因此统治阶级极难将其封锁。\n\
  \n### 2.2.2. 私有区块链\n\n这些区块链在性质上是限制性的，也被称为许可链区块链。加入网络需要许可，且交易仅对区块链的成员可见。它们在本质上是中心化的，访问控制控制由一个组织处理。加入网络需要经过验证的许可，只有与网络相关的参与者才能访问数据。这种类型被广泛用于数据对组织是敏感问题的情况。系统中可能涉及代币，这将有助于实体的易管理。\n\
  \n### 2.2.3. 联盟链\n\n这些具有半去中心化系统，其中不是由单一实体，而是由一组组织来治理区块链。它与私有区块链的方法类似，可以被视为后者的子类型。\n\
  \n### 2.2.4. 混合区块链\n\n混合区块链结合了私有区块链和公有区块链的特征。用户被赋予决定哪些数据上传到公共平台、哪些数据保持私密的选项。交易可以在网络内部或公共网络上进行验证，这增加了用于哈希的\
  \ `nodes` 数量，从而提高了系统的安全性。混合系统的特征提供了大量的的可追踪性，并有助于与区块链系统中存在的协议进行轻松连接。它被有效地应用于关注安全灵活性的各种业务领域。\n\
  \n### 2.3. 区块链的当代进展\n\n随着区块链技术的不断绽放和增长，它在应用和实现方面持续增长和扩张。区块链已成为科技领域的热词，所有爱好者都某种程度上以某种方式参与其中。在看到自\
  \ 2018 年以来增长了 40% 以上后，区块链的未来看起来更加光明。统计数据非常令人鼓舞，LinkedIn 上的职位机会从 2017 年到 2018 年增长了三倍。加密货币市场规模约为\
  \ 6000 亿美元，2018 年全球区块链解决方案的支出估计约为 21 亿美元。自 2016 年以来，全球对区块链的兴趣剧增，显示出通过提高意识实现进一步增长的巨大潜力。\n\
  \n\n\n\n虽然科技领域的大多数玩家已经接触了区块链技术，但它并非没有风险。由于这是一项新型且在很大程度上未经测试的技术，将其引入到已经运行的系统中可能会导致漏洞和安全问题。拥有庞且稳定客户群的云服务提供商似乎是将区块链技术\
  \ [13]16] 纳入其业务模型的前沿。`Microsoft Azure` 是整合该技术的领先者之一，其重点关注如 `Ethereum` 和 `Hyperledger\
  \ Fabric` 方法等服务。它还构建了 `Azure Blockchain Service` 和 `Workbench`。`Amazon Web Services`\
  \ 也向公众发布了 `Managed Blockchain`。`IBM Cloud` 和 `Oracle` 区块平台也基于 `Hyperledger Fabrics`\
  \ 构建了它们的解决方案，如图 (3) 所示。\n\n![](img/9781681088624-C11_F3.jpg) 图 (3)\n\n通过区块链在各领域取得的进展。\n\
  \n当代区块链技术的进展正发生在四个主要领域 [17]。平台进展包括在组件故障时维持操作的能力、用于存储加密数据的支持系统，以及在两种共识机制之间平滑切换。接口开发包含许多变化，例如开发使用已建立的身份提供者进行验证的机制，以及用于交易的隐私和权限功能。需要开发一种支持跨网络互操作的基础设施以及一个能够处理许多节点的网络。正如预期的那样，大多数现代区块链技术的进展仍然目标于提高安全性和执行平滑的分析。\n\
  \n## 2.4. 挑战\n\n尽管 2.3 节中列出了无数益处，但区块链技术并非没有挑战。虽然拥有去中心化系统和数据安全 [18] 等当务之急的功能，但实现这些功能是一项艰巨的任务。由于它仍然是一项新开发的技术，为了开发出适用于所有领域的技术，需要克服一些缺点。在将区块链集成到各种应用程序之前，应对现有的性能问题、改进隐私和开发易于使用的平台等步骤至关重要。主要有四个问题困扰着区块链开发\
  \ [19]：\n\n### 2.4.1. 性能提升的限制\n\n虽然区块链在执行交易方面确实具有优势，但它仍然无法与现有系统竞争。关键方面在于速度，通常每秒仅有\
  \ 5-7 次交易，而现有系统每秒处理数万次交易。这排除了区块链在大规模模型中的适用性 [20]。为了解决隐私问题，开发了共识模型，这再次增加了交易持续时间。\n\
  \n### 2.4.2. 互操作性\n\n互操作性可能是需要解决的最重要问题。不同的区块链平台需要翻译才能相互通信 [21]，这证明是一项非常繁琐的任务。需要开发一套标准化系统以改进互连性并促进通信。\n\
  \n### 2.4.3. 高成本与复杂性\n\n区块链技术面临的另一个挑战是其对密集计算的需求。它消耗大量的电力，导致高成本。`Elite Fixtures`\
  \ 最近发布的一项研究计算出在韩国开挖一个比特币的成本约为 26000 美元。此外，区块链还面临维护服务器的成本。\n\n### 2.4.4. 缺乏监管\n\n\
  缺乏支持性的监管是一个问题。随着加密货币价格飙升以及如代币发行（ICO）等现象的出现，缺乏监管确实是一个问题，这阻碍了开发者和用户。\n\n## 3. 大数据的简介\n\
  \n大数据已成为当今科技的热词，它在科技领域席卷云来，这不仅是由于其应用，更是因为其巨大的增长。首先，理解什么是数据至关重要。数据本质上是字符、符号或数量的集合，可以对这些数据进行操作。大数据本质上是随时间指数级增长的巨量数据集。这使得对正常操作变得非常困难。\n\
  \n数据在各行业中的性不可忽视。大数据的利用有助于形成有效的业务计划，从而为公司带来竞争优势。它还有助于获得客户活动的有效见解，从而进行高效的营销活动。这提供了更好的客户服务，改进了产品并带来了更高的转化率。这些数据可以来自各种来源，如社交网络网站、实时数据传感器、医疗记录等。这包括原始数据，可以使用数据挖掘等工具对其进行操作，使其更具分析价值。\n\
  \n### 3.1. 大数据的类型\n\n由于大数据是一个涵盖许多操作的广泛领域，有各种要处理的数据集也并不意外。通常，我们可以将其大部分分为三类 [23]：\n\
  \n### 3.1.1. 结构化数据\n\n这指的是以固定和特定格式存储、检索和处理的数据。此类数据存储在易读的格式中，便于对其进行操作并从中获取信息。它是高度组织化的，使得存储和搜索等基本操作成为一项易任务。随着数据的指数级增长，将数据转换为这种形式证明是一项艰巨的任务。此类数据集的一个例子是公司中的员工表，具有预定义且组织良好的行和列，描述了各种属性，如姓名、年龄、职位等\
  \ [24]。\n\n### 3.1.2. 非结构化数据\n\n\n\n\n\n非结构化数据是指缺乏特定形式的数据。它是原始数据，由于其规模庞大且格式非结构化，处理起来非常困难。尽管大多数公司都能轻松获取这些数据，但从中推导信息、进行处理以及执行基本操作仍然是一项艰巨的任务。电子邮件就是此类数据集的一个示例。\n\
  \n### 3.1.3. 半结构化\n这类类型的数据包含来自结构化和非结构化数据的组件。尽管它没有归类到特定的存储库，但它具有某些标签来区分不同的元素。`XML`\
  \ 文件表示的数据就是其中的一个例子。\n\n### 3.2. 大数据的特征\n考虑到大数据在现代的流行，有必要具备某些特定的定义特征。这些特征有助于根据用户需求识别并分类数据集。2001\
  \ 年，高德的分析师道格·兰尼（Doug Laney）确定了大数据的 3 V，即量（volume）、多样性（variety）和速度（velocity），其中量是关键的特征要素。进一步的研究和发现列出了另外三个\
  \ V，即可变性（variability）、真实性（veracity）和价值（value）[25]，如图图（`4`）所示。\n\n### 3.2.1. 量\n\
  数据量是任何数据被分类为大数据的标准。海量的数据意味着该数据集是大数据。这些海量数据可以来自任何源，如业务、机器、人类以及无数其他来源。\n\n### 3.2.2.\
  \ 多样性\n多样性指的是来源性以及所处理数据的类型。这可以是结构化、非结构化或半结构化数据。早期的数据通常以整洁的表格和数据库形式存在，但现在数据以多种形式提取，如\
  \ `PDFs`、电子邮件、照片等。这对此类数据进行分析、挖掘、清洗和其他操作成为了一项繁琐的任务。\n\n![](img/9781681088624-C11_F4.jpg)\
  \ **图 (4)**\n\n大数据的 6 V。\n\n### 3.2.3. 速度\n速度是告诉我们数据实时生成速度快慢的特征。它包含了数据变化的速率以及链接不同数据集的连接。这种速度根据数据的处理速度，标志着数据的真实能力。\n\
  \n除了描述的三个主要 V 之外，我们最近又列出了三个 V。真实性决定了数据的可靠程度。价值无非数据的数据的业务价值，而可变性决定了数据格式化的不同方式。\n\n\
  ## 4. 区块链在大数据中的应用\n区块链 [26] 技术在过去的几十年中一直占据主导地位，但在比特币引入世界后变得越来越重要。区块链完全关注分布式账本系统，这种去中心化的网络拓扑优先考虑更高层安全系统。通过消费者进行的每笔交易都存储在单个区块中。这些区块用于存储信息，每当有新交易产生时，就会缓慢形成一个新的区块，这导致了区块链，因此该技术被命名为\
  \ `BLOCKCHAIN`。存储在区块中的交易相关信息每次必须由用户进行验证，以维持正确的网络并实现高效运行。不仅是交易相关的信息，时间戳记录也是以防篡的方式进行的。数据中的任何细微变化都会被带有相应的时间戳记录，随后便无法篡改，从而增加了系统的透明度。这就是为什么区块链是一个安全系统，有助于妥善保护数据的真实性。智能合约\
  \ [27, 28] 是区块链技术的特性，这一功能对于网络自自发发非常重要。\n\n开发者专注于通过编码细节来更新每个区块的信息，例如钱包中的付款、银行账户信息以及所有其他细节。一旦交易执行，可以由连接到网络的用户进行验证。\n\
  \n大数据是大数据集的集合，从不同设备收集的每条数据都可能来自传感器、网络等。汇总的数据极其巨大且多层次，其处理方式与传统数据不同。提取的数据用于估计市场遵循的模式和趋势。大数据遵循的机制在当今需求很大，这是因为该技术在底层涵盖了现实世界的应用。每当发生交易时，它会以账本的形式存储，同时云服务也用于记录和存储目的，但对于组织和公司来说，涉及云服务的处理成本有点高。分析并计算市场反应以便对未来市场做出预测，这是大数据的主要作用之一，而区块链\
  \ [29] 在此提供了巨大的支持并起到辅助。\n\n区块链是业务数据存储的一种有效方法。不仅如此，它创建的网络（即去中心化网络）在允许准入方面非常高效。多个操作操作员通常在不同的账本中积累交易信息。参与交易的多个方可以安排在一个单一网络上工作，该网络是运行的，并可以由用户轻松进行验证。\n\
  \n\n\n\n\n区块链和大数据同时使用的实际世界案例是在日本的银行业。约有 50 家银行 \\[26, 30\\]组成了一个协会，并与“`Ripple`”签署了一项协议\
  \ \\[31]。在这里，`Ripple`是一个基于区块链技术构建的开放追踪网络。在国际范围内，`Ripple`的市场市值位居第三。该联盟致力于通过结合`blockchain`与`big\
  \ data`来实现无威胁且低成本的交易。通过重构过时的银行模式，这种使其变得充满前景。\n\n## 区块链驱动的银行模式演变\n\n传统的模式涉及多个参与方，并具有进一步的风险特征。为了引入威胁和欺诈控制主题，银行不得不支付额外成本来承担代价。由此产生的成本可以通过使用`blockchain`网络来节省。银行之间的伙伴关系还负责大幅缩短交易时间。\n\
  \n如果在一个`blockchain`网络上执行`Big Data`，它可以获得额外的安全保护。主要的安全层可以寄托在`blockchain`的网络构建上。与过时的方法不同，网络中的材料或内容受到保护且不会被复制。此外，通过使用`Blockchain`，`Big\
  \ Data`可以被加密保护，信息可以被轻松组织和珍藏。数据的执行和分析将变得更高效、更简单。`Blockchain`技术也被用于欺诈识别。\n\n### 4.1.\
  \ 在大数据中使用区块链的动机\n\n`blockchain`和`big data`等技术是协调技术，通过引入更好的存储和数据探索可以完全改变该技术。`Blockchain`是近年的主流技术，它是一种简化数据库管理并对维护的每条记录提供透明度的数据库。`Blockchain`是一种高度安全的数据库技术，数据库中创建的每条记录被称为`block`，每个`block`都包含用户完成的交易细节*即*。这种去中心化网络有助于有效管理和分析数据。创建的记录包括交易日期和与上一个`block`相关的链接。\n\
  \n`blockchain`技术的去中心化是其主要优势，因为没有人有权控制输入的数据，从而维护了系统的完整性。当系统在任何网络上时，会进行持续检查。网络上的每台机器都有相同的数据，损坏的数据无法进入构建的链中。例如，让我们假设医疗行业，其中医院维护患者的数据，并确保收集的数据是安全的；不仅如此，医疗行业还必须更新与每个客户相关的数据，以免遗漏关于患者健康状况的任何细节。\n\
  \n现在，如果将医疗数据库放置在`blockchain`网络上，任何员工都可以轻松访问网络并更新有关患者的信息，同时还确保数据源保持不可更改。由于医疗行业对数据的监管监管不力，风险增加了，因为这可能导致对患者的处置不当或诊断错误；如果对与患者相关的细节未进行妥善跟踪，与测试相关的信息可能会丢失。在`blockchain`和数据的帮助下，可以很容易避免各种风险。（**5**）所示。\n\
  \n## 区块链与大数据的益处\n\n使用`blockchain`和`big data`的真实动机源于以下原因：\n\n1. **更好的分析**：`Big data`分析涵盖了领域\
  \ \\[27\\]，因为`blockchain` \\[32\\]可以提供实时帮助。2017 年的实时数据 \\[33\\]出现在该协会 \\[31\\]中，因为`blockchain`为该协会提供了帮助。\n\
  2. **更好的安全性**：`Big data`受到`blockchain` \\[15\\] \\[16\\]保护。`Blockchain`实时存储并对系统有帮助。\n\
  3. **满足隐私顾虑**：`Blockchain`实现了数据的透明化。如果数据输入未通过验证，系统将拒绝它。这项技术以数据的透明性而闻名。\n\n### 4.2.\
  \ 区块链架构\n\n在最简单的形式，`blockchain`技术是一系列时间戳 \\[22, 31\\]，创建出不可争议的注册表，然后随后由网络中不同用户拥有的计算机进行复制。创建的每个区块都受到保护，并强制维护加密\
  \ \\[35\\]理念。区块链流行的主要原因是：\n\n*   单一实体不拥有区块链内存储的数据\n*   进行了加密数据存储\n*   创建的区块链是不可争议的，因此完全不允许任何干扰\n\
  *   系统的透明度得到了良好维护\n\n`Blockchain`的建立是为了在整个网络中高效地操纵和分发数据。公链是最著名的类型，`Bitcoin`是公有链的一部分。现在在执行或实施`bitcoin`时，需要遵循以下三点：\n\
  \n*   谁在发起交易？从哪里发起？\n*   交易发送给谁？\n*   资金信息\n\n`blockchain`的区块-1 被称为`genesis block`（创世区块），其`previous\
  \ hash`区块的值为 0。图 6 详细阐述了数据区块的样子。\n\n```\n![](img/9781681088624-C11_F6.jpg)\n```\n\
  \n\n\n\n每当发生交易或需要进行数据存储时，就会创建一个区块。随着数据的不断增加，与其相关的区块数量也随之增加，因此在在这种情况下需要一个区块头（Block\
  \ header）。随着数据的不断增加，链就此形成，而为了创建该链并链接每个区块，非常需要区块头。这些区块头有助于识别每个数据块的顺序，而且每个区块都包含前一个区块的哈希值，以便能够地完成每个区块的链接。在系统中引入哈希值的优势是提供了不可变性，`i.e`，一旦区块被创建，它无法被更改。下图展示了系统中的数据块是如何相互链接的。每个区块都包含数据，随后是哈希值和区块号。哈希值是下一个区块的地址，用于维护系统中每个区块的链接，图（**7**）通过图表进行了解释。\n\
  \n![](img/9781681088624-C11_F7.jpg) **图 (7)** \n\n产生区块链的数据块。\n\n现在，区块头是包含数据块所需的所有重要信息的载。每当发生交易或存储数据时，都需要进行正确的时间标记，因此区块头的第一个元素是“时间戳”（time-stamp）。接下来，区块头必须包含关于“版本”（version）的信息，这是头部中包含的第二个重要内容。第三个元素或信息是关于“Merkle\
  \ 根”（mekle root），它包含了发生的所有交易历史。然后是随机数（nonce）、难度目标（difficulty target）和上一个哈希值，如图（**8**）所示。\n\
  \n![](img/9781681088624-C11_F8.jpg) **图 (8)** \n\n区块头部和 Merkel 架构。\n\n为了让这个系统高效运行，需要类似于“工作量证明”（PROOF\
  \ OF WORK）的概念，难度目标和随机数术语是该概念的一部分。尽管区块链以其不可变性特征而闻名，但如果非常需要从链中添加或删减数据或区块怎么办？为了更改数据，需要更改区块的哈希地址。如果任何区块的数据被更改，它将影响下一个区块的数据，依此类推，形成的链将受到破坏。因此，必须对每个区块重新生成哈希值，这将产生问题。但由于系统的设计使得所有内容都通过网络连接，而且我们生活在超级计算机时代，因此这并非可能的，那么这个系统现在是如何变得安全的？因此，每当区块链发生变化时，“工作量证明”的概念就会发挥作用。现在关注“工作量证明”的概念，每当必须添加区块时，都需要进行一些处理，该概念包含了以下点：\n\
  \n* 在进行更改之前，必须验证区块\n* 在区块链链中添加区块，每个区块至少需要 10 分钟\n* 区块链必须存储在多个机器上\n\n区块链网络中的每台机器都有一个区块链的副本。“共识算法”（Consensus\
  \ Algorithm）也用于在区块链必须添加数据时进行更改。为了在区块链中进行更改，我们需要像超级计算机和区块链 50% 的网络，这是可能的，因为第 2.1\
  \ 节中讨论的“工作量证明”概念需要大量的 CPU 和 GPU，而负担所有这一切完全是不可能的。因此，由于这些原因，区块链保持了安全。这就是区块链架构如何支持更大规模的数据管理的方式。\n\
  \n### 4.3. 比较研究\n\n大数据运行基于三个 V：量（volume）、速度（velocity）和多样性（variety），这意味着收集的数据必须用以下术语进行衡量。数据大小必须被定义，它包含在“量”这一术语中。数据变化的速度在“速度”下定义，收集或发送数据的来源由数据的“多样性”术语定义。像\
  \ Amazon、Flipkart、`etc.` 等大公司每分钟获取数百万百万的数据，因此处理如此频繁变化的海量数据是一个巨大的挑战，大数据通过各种平台处理这一挑战。每天，这项被称为大数据的技术都在达到新的高度并变得流行，它是对当前数据进行有效分析的重要工具。处理数据对于大集团和公司来说一直一直是挑战性的，因此根据它们的应用，它们开发了不同的数据平台，例如\
  \ yahoo 开发了 Zookeeper，Cassandra 是由 Facebook 开发的，还有许多类似的开发。存储大数据是一个挑战，因此存储和访问数据导致了几个问题：\n\
  \n* 当存在多份数据副本时，如何找到哪份数据是经过验证的？\n* 如果数据崩溃了该怎么办？\n* 如何对数据进行变现，如何了解我们想要共享数据的第三方？\n\n\
  带着所有这些问题，重点是在不损害安全性的情况下有效地操纵和分发数据，这就是区块链出现的时候，区块链为我们提供了一个平台，可以在该平台上创建一个安全的数据库，该数据库在本质上是不可变的。创建的数据块是按顺序排列的，数据库的维护方式使得没有人可以更改现有数据。多份副本的问题可以通过这项技术轻松解决，因为一种类型的数据只分配一个区块，数据没有丢失的可能性，因为哈希值严格遵循数据块，且区块头有助于每次交易发生时的处理进行系统安排。\n\
  \n在注意到后来的区块链技术 #13]#16 后，研究人员考虑将两者结合起来以构建更好的系统，这项新技术被命名为“BigDB”。这种技术的优势是基础设施可以很容易扩展到不同的位置，数据库的属性（如完整性和一致性）也得到了维护。\n\
  \n区块链数据库运行在数据流水线上，包含了从数据收集到数据管理的每一个步骤。步骤如下：\n\n* 通过 IOT 传感器收集数据\n* kinesis/event\
  \ hub\n* 流式分析\n* HFDS 存储\n* Spark 数据清洗\n* Spark 归一化\n* MongoDB 存储\n* Tableau 分析\n\
  \n在数据流水线步骤之前，对输入数据进行时间标记，如下：\n\n* 创建交易（数据和元数据的哈希）\n* 对交易进行加密签名\n* 将交易写入区块链，这将自动为交易标记时间戳。\n\
  \nBigchainDB #36]#37 具有去中心化、不可变性、低延迟、可定制、功能丰富等特点。\n\n区块链和大数据结合基于三个关键部分：\n\n* 计算机网络\n\
  * 网络协议\n* 共识机制\n\n系统中的每台计算机都复制账本，并在算法中进行单一更改以确保所做的更改是有效的。任何通过的内容都会添加到链数据中。\n\n###\
  \ 4.4. 挑战与解决方案\n\n\n\n\n正如标题所示，主要目标是寻找区块链如何帮助高效管理大数据，而大数据是目前增长最快的领域。在每一个业务模型中，收集准确的洞察都是最重要的一点，即收集洞察并根据客户需求分析其使用模式。在谈到大数据时，数据集变得互补。大数据是一项处理海量数据集的技术，通过渐进的统计表示和数据挖掘对这些数据进行分析并揭示相应的模式。但同时，这项技术在运行中也面临着一些挑战，讨论如下：\n\
  \n#### 4.4.1 数据管理\n由于每个可能的领域每分钟都会产生海量数据，数据管理是公司面临的最大挑战。由于存在海量数据，他们发现很难管理这些巨大的数据，而且妥善地组织这些数据并最终从组织后的数据中得出结论是一项繁琐的任务。不仅要关注数据管理，保留获取的数据也是必要的。收集的数据在性质上具有高度多样性，它既可以是非结构化数据也可以是结构化数据，因此对每种类型进行分类并得出结论将允许企业从市场需求中收集洞察，并对对各自的产品进行有效调整。因此，克服这一挑战至关重要，对此可以使用区块链，因为区块链提供了定义良好的区块，这些不仅可以保留数据，而且每条输入数据都带有时间戳且完全不可篡改。\n\
  \n#### 4.4.2 风险\n当公司有大量数据需要分析时，万一他们误读了获取的数据，可能会给不同层级带来风险，因为错误的结果可能导致巨大的损失，从而影响公司和市场。因此，高效地理解数据非常重要。为了构建更佳的预测模型，公司必须理解数据以及数据如何与系统遵循复杂的关系。区块链也可以帮助降低风险因素，因为它是一项专注于如何轻松分析数据并存储在系统中的系统化技术，因此区块链解决方案与大数据结合时可以提高效能。\n\
  \n#### 4.4.3 数据安全\n数据窃取是一个日益增加的不当行为领域，根据最近的调查显示，系统拥有的数据越多，黑客攻击的概率就越大。由于每家公司都与其客户打道并必须为共享的信息提供安全，此类威胁应该被完全防止。对于数据保护，可以使用区块链，作为一个去中心化的网络，它允许数据流入但又是高度安全且不可篡改的，从而保护数据免受各种威胁的侵害并确保数据隐私。\n\
  \n## 5 应用\n本节讨论了各种应用。\n\n### 5.1 医疗保健\n在讨论区块链及其应用时，大多数人倾向于考虑比特币和其他金融应用。奇怪的是，区块链一些最有前景的未来应用出现在两个以上的领域。医疗保健就是这样的领域之一，呈现了多样且实用的区块链应用，这些可能会改变该领域。应用范围广泛，从救济工作到跟踪药物试验，但区块链的去中心化和民主原则仍然是这些工作的关键，正如图\
  \ (9) 所示。医疗领域有十项主要的区块链应用。\n\n尽管在医疗领域提供了许多改进空间，但最有前景的应用可能是电子健康记录/电子病历 (EMR)。EMR 是由医疗提供者维护的医疗记录，包含诊断、预后和实验室检查结果等信息。在维护患者隐私的同时，维护这些数据的完整性至关重要。区块链利用其分布式账本技术提供了一个优雅的解决方案。使用区块链将在增强安全性的同时，提供对医疗记录的便捷访问。\n\
  \n### 5.2 教育\n区块链具有通过其技术系统性变革教育系统的潜力。其应用非常广泛，从基础设施改进到智能合约。考虑到该部门处理各种格式的大数据，教育机构使用的区块链不容忽视。区块链技术还可以成功地将验证者、教育者、学生和雇主全部连接到一个系统中，从而使所有操作变得无缝且更高效。验证成绩单和其他重要文件通常是一项涉及大量文档的劳动密集型任务。随着区块链技术的出现，对这些成绩单的验证可以变成点击完成的过程。该技术还可以用于存储学生目录，考虑到其分布式账本技术，这将提供许多额外收益。通过雇用如“Arcade\
  \ City”等基于区块链的初创公司也可以解决交通问题。云存储也是利用技术的一个潜在改进领域。\n\n![](img/9781681088624-C11_F9.jpg)\
  \ **图 (9)**\n\n医疗保健中的区块链应用。\n\n智能合约可以彻底改变世界上许多行业，包括教育。一旦满足某些条件，它就可以通过减少文档和执行协议来影响教育机构并使其更高效。如果实施智能合约，奖学金和资金交易将变得无忧无虑。只有在完成所需课程的情况下，学生才能获得助学金。\n\
  \n### 5.3 金融\n\n\n\n\n金融行业可能是市场上规模最大、数据最密集的行业。它规模庞大，处理海量数据，并且在所有交易中对速度都有强制要求。在谈到大数据、区块链时，AI\
  \ 是金融行业最早的采用者和实验者之一。效率是一个至关的问题，而区块链为这些资金范围范围内的提供了可能。账改变了金融行业——这就是该领域采用区块链的原因之一。消费者预期正在改变，他们想要更好的体验，希望需求得到匹配，这时\
  \ AI 也被使用了。这有助于提供更好的服务，并且可以更快速地完成。金融行业每秒产生的交易产生大量的数据。许多因素涉及到金融行业。数字化转型的加速正在改变我们的金融生活，以客户和数据为驱动的金融服务是区块链和大数据转型金融服务的关键。当客户的集成身份信息与数字身份注册时，它随后在整个区块链上传播，为各种服务提供便捷且安全的用户验证。使用基于区块链的数字积分，用户可以进行应用间的支付，实时跨境传输这些积分，并通过\
  \ ATM 收集这些积分，因为所有这些交易都通过区块链实现，并提高了限额和安全性。分散的客户财务信息（如支出、投资和资产）现在可以在应用中显示，用于分析的财务信息经过去标识化处理，并通过区块链安全地管理。它还有\
  \ AI 虚拟助手，可以推荐虚拟产品，客户可以立即注册推荐的产品。此外，金融的数字化也改变了金融环境，AI 虚拟助手允许金融机构提供更快的客户服务。它还让客户提交文件变得容易，在申请理赔时客户可以轻松验证身份，数据通过区块链直接从一个地方传输到另一个地方。\n\
  \n## 5.4 IoT\n\n当我们进入连接和网络的世界时，技术的新特性被引入。工业时代存在的技术是机械化的，当时的人们试图将手引入机械系统，以便环境信息能够被高效记录，逐步转向如何高效管理机器之间的每一个连接。现在，几乎每个设备都通过网络连接。\n\
  \n重点是 `IoT` 和 `blockchain` 的协作并将其融合形成一种名为 `BioT` 的新技术。这项技术将通过提供一个与 `IoT` 协作的去中心化网络来帮助客户，并通过采用\
  \ `peer to peer network` 来解决问题。大量数据在设备之间生成并共享，降低了成本并在跨多个地区分配计算和存储需求，从而防止网络故障。\n\n\
  当 `peer to peer network` 成为常态时，引入了与系统安全相关的挑战，`IoT` 在关注安全性方面时，不仅关注保护敏感数据，还包含了许多其他内容。当\
  \ `blockchain` 和 `IoT` 结合时，它们带来了一个可以轻松维护网络隐私的解决方案，这是通过每次个人访问数据时要求验证来实现的，处理每笔交易必须通过协议，这有助于避免欺骗和抢劫。\n\
  \n## CONCLUSION\n\n区块链正处于新兴阶段，并在极短时间内引起了热热。随着技术的进一步发展，可以认知并发现更多具体的用例，并且在区块链的参与下，大数据管理将变得更加容易。大量的数据和海量数据集必须被妥善处理，因为这些数据的存储、操作和分布是处理此类大量数据的主要挑战。所有与大数据相关的问题都可以使用区块链来解决。\n\
