  \ Kowshiki\n\n¹ 计算机科学与工程系，Sri Chandrasekharendra Saraswathi Viswa Mahavidyalaya\
  \ (SCSVMV), Tamil Nadu 631561, 印度\n\n² 信息技术系，Sri Vishnu Engineering College for\
  \ Women, Bhima-varam, Andhra Pradesh 534202, 印度\n\n## 摘要\n\n技术正成为我们生活中不可或缺的一部分。它在健康、银行和教育领域发挥着重要作用。机构已开始采用这些技术发展来满足客户需求。越端传输（OTT）数字平台的兴起创造了一个经济平台，其中数字内容、服务和产品由中间机构提供，并改变了交互方式。区块链作为一种通过在中间机构之间建立信任来创建数字平台的手段。为了在竞争的环境中成功，机构应该实施创新的技术实践。本章节探讨了区块链平台之间的差距以及数字化转型过程的作用。从而为研究人员提供了一个研究区块链对\
  \ OTT 平台影响整体方法。\n\n**关键词：** 区块链技术，数字技术，越端传输（OTT）。\n\n***\n\n(*) 通讯作者 J.S. Shyam\
  \ Mohan：计算机科学与工程系，Sri Chandrasekharendra Saraswathi Viswa Mahavidyalaya (SCSVMV),\
  \ Tamil Nadu 631561, 印度；电话： ?????;\n\n电子邮箱：jsshyammohan@kanchiuniv.ac.in\n\n## 1.\
  \ 引言\n\n越端传输（OTT）是媒体行业中的术语，指通过物理连接和机盒使用电视进入个人家庭，并通过网络在这些连接和机盒之上传输先进内容。OTT 有两种产品：内容和观众或订阅者。从不同地点收集的数据通过大数据分析进行处理，以增强和改进客户的观看体验。与传统电视的持续竞争相比，全球\
  \ OTT 平台的未来看起来一片光明。传统电视已开始通过适应新技术来触达更广泛的受众。在过去的十年里，传统电视开始将 OTT 平台作为向消费者提供的服务的一部分。AIB\
  \ 研究指出，全球视频市场将随着 OTT 的发展以快速速度持续增长。到 2022 年，OTT 市场将产生 514 亿美元的巨额收入，复合年增长率（CGAR）飙升\
  \ 10%。如果订阅，用户将享受 OTT 的大部分利益。在北美和欧洲等国家，电视频道正在为其客户提供 OTT 服务。以相对便宜的价格向所有人提供虚拟多频道视频节目（vMVPD）。在全球范围内，当传统电视人数下降时，选择\
  \ OTT 的订阅人数正在增加。付费频道的人均收入（ARPU）预计将下降四倍，可能在 2022 年达到。因此，毫无疑问，OTT 玩家正通过增加订阅人数迈向增加收入。Amazon、Apple、DAZN、Facebook、Google\
  \ 和 Netflix 已经开始投资建立自己的制作公司。广播机构拥有的 OTT 平台对内容有巨大需求，导致广播机构与 OTT 提供商之间达成交易。表 1 显示了\
  \ FICCI-E&Y 2020 年的行业报告。\n\n表 1 **2020 年 FICCI-E&Y 媒体娱乐行业报告。**\n\n| **客户群体** | **特定年份的用户数（百万）**\
  \ | | |\n| --- | --- | --- | --- |\n| | **2018** | **2019** | **2022** |\n| 数字内容（用户仅在数字平台消费内容，不使用电视）\
  \ | 2.5 | 8 | 14 |\n| 战术数字（消费付费电视和至少一种付费 OTT 服务） | 12 | 34 | 91 |\n| 捆绑数字（消费电信捆绑的付费电视）\
  \ | 218 | 262 | 363 |\n| 大消费者（消费付费电视并偶尔消费部分免费 OTT 内容） | 426 | 316 | 176 |\n| 免费消费者（不为内容付费）\
  \ | 180 | 190 | 220 |\n\n\n\n\n\nOTT 市场的全球收入预计将从 2018 年的 6200 万美元增长到 2024 年的 14.97\
  \ 亿美元，复合年增长率（CAGR）增长了 15.8% [[4]]。印度用户更倾向于免费内容而非订阅平台。考虑到这一点，OTT 玩家已经出了一种按月或按年计的按用户付费模式，即基于订阅的点播视频（SVOD）业务模式。同时，许多\
  \ OTT 玩家正尝试推广基于点播视频的广告（AVOD），而另一些 OTT 玩家则坚持免费业务模式，并计划将其转化为付费用户。\n\n区块链描述了一个不断增长的共享、维护的、由多个参与者验证的数字记录集。区块链的种类繁多，但这个定义适用于大多数场景\
  \ [[5, 6]]。区块链中的每组数字记录按顺序分组为相互依赖的块。这意味着尝试修改任何块中的交易通常需要修改其后的所有块，这是一项计算密集型任务，但在设计上这种任务在经济上是可行的，考虑到新块会在几分钟内添加。这一过程使得数据更加可靠，并且随着时间的推移，添加的块越来越多。由于这种独特的记录集在多个处持续维护或呈分布式，因此它具有极高的容错性；没有中心机构可以进行攻击、关闭、胁迫或（在许多情况下）起诉\
  \ [[7]]。这种去中心化对于完成这项工作至关重要；由单一实体 100% 拥有的区块链几乎无法提供增量收益。\n\n区块链技术的起源源于比特币加密货币。为了在没有信任的中央机构（如银行、电子支付提供商或政府）参与的情况下确保围绕永久数字账本的共识，需要创建“数字货币”\
  \ [[8, 9]]。如果没有权威方来维护注册表，你就必须设计一种真正创新的东西，以便人们无法复制并粘贴他们花费数字货币的方式两次。区块链技术的这种特性，或拥有独特且真正拥有的数字资源的能力，对于品牌和营销人员来说是一个至关重要的特征。区块链技术的“数字稀缺性”不仅支持了比特币的价值，还为品牌在有限物理世界与数字无限世界之间提供了一座真实的桥梁。许多公司将区块链视为一个开放平台\
  \ [[10]]。开放区块链（如支持比特币加密货币和以太坊网络的）依赖于新模型来弥补缺乏信任经纪人的缺陷。另一方面，通过对封闭或“许可性”区块链的探索，金融机构正争相采用这种原本由匿名个人或团体发明、旨在用于\
  \ 2008 年危机后帮助使这些机构变得无用的技术。即使在这样的数字无菌的实现中，银行也可以通过继承开放区块链的一些特性（如不可篡改性和去中心化）来享受到快速结算时间和更更快速达成的贸易金融条款等优势。\n\
  \n近年来，不列颠哥伦比亚省（BC）在行业中颖而出，并逐渐被认为是服务业、金融和制造业等许多行业的规则改变者 [[11]]。由于其具有隐私、安全、智能合约、可扩展性以及解决文件双重支付问题等特定特性，使供应链管理（SCM）更加高效变得至关重要。BC\
  \ 的实现改进了两个或多个双方之间在智能合约的机密性、监控、透明和执行力方面的交易。长期使用 BC 技术使得智能合约（SC）系统更加节能、负担得起并倾向于高性能。BC\
  \ 技术的应用可用于提高效率和资源的高效利用，这项最新技术有助于建立供应链安全（CSS）。不列颠哥伦比亚是一项新兴技术，研究人员和行业专业人士寻求在 SC 领域实施\
  \ BC。该技术仍处于早期阶段，目前为止的工作非常有限。以下是 BC 地区主要的差距，特别是在供应链安全合约（SSC）方面 [[12]]。我们的社会应该向 2030\
  \ 年演进，成为一个更加数字化、数据驱动和受智能解决方案启发的社会，这需要近乎即时的无线连接。因此，几项提供此类交互和集成的新颖应用注定将在十年内出现。例如，近期可能出现的一些关键趋势包括：虚拟和增强现实、8K\
  \ 视频流媒体、全息图、远程手术、工业 4.0、智能家居、雾计算、集成人工智能服务、无人机和自动驾驶汽车等。这些反过来将对移动网络在可靠性、延迟更高数据速率方面提出比\
  \ 5G 高得多的需求 [[13]]。对于提供视频流，越顶业务（OTT）服务与体验质量（QoE）和服务质量（QoS）等补充解决方案重叠。大多数 OTT 供应商拥有专有软件，并利用服务器、网络和智能软件的组合来确定服务质量\
  \ [[14]]。消费者要求在自己的设备上方便的时间观看个性化视频。OTT 平台已经发生了变革以满足消费者需求。在 OTT 平台上观看的视频将成为一种盈利模式。人均\
  \ GDP 的增长随着智能手机用户数量的增加，最终使 OTT 市场增加收入。OTT 面临一些需要克服的挑战，如版权保护、审查和网速等。\n\n本章关注以下方面，但不限于：\n\
  \n*   深入理解 OTT 应用及其在区块链技术中的实现。\n*   提出区块链技术提供了一种在没有第三方参与的情况下向版权所有者支付版税的有效方法。\n*\
  \   描述印度 OTT 应用的兴起及其使用统计，并提出实施区块链以确保安全和隐私。\n\n本文其余部分的结构如下：第 2 节概述印度 OTT 内容的兴起；第\
  \ 3 节定义区块链和智能合约；第 4 节介绍建议的区块链业务模型、优势和挑战；第 5 节从理论视角强调区块链技术转型 OTT 数字平台业务；第 6 节提到区块链作为规则改变者对\
  \ OTT 平台业务的颠覆及其实时应用。第 7 节探讨机器学习（ML）在区块链（BC）中的应用——研究问题与挑战，最后是结论。\n\n\n\n\n多年来，全球\
  \ OTT 平台的订阅数量增长了 285%。`Netflix` 是 2016 年至 2019 年期间年度消费者评价中评分最高的应用程序。`Disney+` 的推出也为该市场带来了额外的收入。与其他国家相比，`India`\
  \ 使用 OTT 平台的用户数最多。在 2018-2019 年期间，OTT 平台在 `India` 发挥了至关重要的作用。过去一年，电视内容是利用最大的分类。直到今天，电视观看还没有出现负面发展；因此，跟上潮流可能是\
  \ OTT 贡献最可靠的保障。直播流在板球赛季期间吸引了许多消费者，甚至吸引了如《权力的游戏》等节目。电视广播机构已经推出了新武器，在它们自己的 OTT 平台上直播直播内容。内容的直播化吸引了许多消费者。选举和恐怖袭击等场合在\
  \ OTT 平台上产生了巨大需求。OTT 平台上的视频内容消费产生了对更多直播和基于内容方面的需求。然而，OTT 平台上的视频没有审查委员会，像某些特别节目、`etc.`\
  \ 包含暴力和低俗内容，这些内容可以在 OTT 上播放，但不能在电视上播播。`ALTBalaji` 等印度平台吸引了许多消费者。除了 `ALTBalaji`，`Netflix`\
  \ 和 `Amazon` 也吸引了许多印度观众。OTT 平台的另一个重要方面是，平台正试图根据在电视上播出的现有库来加强其视频内容。`India` 有许多频道，持续地提供无数长期的视频内容。内容在一个阶段证明了其价值，然后被同步到另一个阶段，因此重复内容仍然受到追捧。内容在所有阶段流传输，客户不断探索他们选择的所有可用平台。对新添加的视频有需求。原创制作的视频内容将定义特定\
  \ OTT 的增长。随着互联网接入变得廉价，越来越多的人对 OTT 平台表现出兴趣；特别是半城市和农村地区可以接触内容。这些消费者中的大多数是 OTT 的订阅者。在今天的情况下，即使是农村和非城市观众也对\
  \ OTT 表现感兴趣。区域内容的结合将为本地市场提供 AVOD 平台保障。如果任何 OTT 供应商提供区域内容，那么他们将成为印度市场 OTT 平台的游戏改变者。OTT\
  \ 阶段的内容环境从 2018 年开始发展，这与公共支持的内容、免费内容、影棚制作的内容、电影内容和电视内容的同步。印度市场提供了更多入场者来提供更多类似于电视的内容。全球\
  \ OTT 平台上的大多数消费者是印度消费者。`FM Radio` 几十年来一直在提供音乐并提供移动音乐。新兴的 OTT 平台已开始通过其高消费吸引年轻消费者的参与。内容市场正面临着重大变化。许多\
  \ OTT 平台致力于交付分成剧集的特辑，试图吸引更多订阅者。游戏和直播内容流正在发展；未来，OTT 内容作者将探索如非线性内容、直观账户、不同阶段故事和生动内容等技术驱动内容的兴起。在全球范围内，所有\
  \ OTT 参与者都试图根据观众的选择提供精选内容。因此，主要者已开始投资建立内容流水线。`Netflix` 的投资是 `Amazon` 和 `Hulu` 投资的\
  \ 3 倍（BCG 2018 年 12 月）。OTT 平台内容的正常现金支出高于 `India` 的电视市场。在 `Australia`、`India`、`Indonesia`、`South\
  \ Korea` 和 `Thailand` 等国家，2018 年全球视频流媒体应用的时间比 2016 年增加了 140%（App Annie，2019 年移动状况）。表\
