  \n\n传感器节点的特性取决于其存储容量、有限的处理能力和有限的能量。根据节点的性质，无线传感器网络被分为两类，即同质传感器网络和异质传感器网络。所有传感器节点在通信、内存、能量和可靠性方面具有相似属性的网络被称为同质网络\
  \ [2]。由于无线网络传输的特性，安全已成为一个关键问题。不仅是安全领域人员，无线传感器网络的设计者也必须关注与数据可靠性、数据聚合和故障检测相关的问题。由于传感器节点既可以在自组织网络（ad\
  \ hoc networks）中运行也可以在普通网络运行，安全目标可以分为两类：主要安全目标和次要安全目标。\n\n机器学习为系统模型提供了低复杂度的估计，因此被部署在无线传感网络的复杂环境中。无线传感器网络的设计者正专注于机器学习算法，以获得关于无法到达区域的新见解和知识。可见，无线传感器网络正在采用机器学习来增加通信信道的安全性，因为机器学习能够处理无线传感网络的动态行为。\n\
  \n本文从网络数据集中识别了不同的特征选择方法。特征选择方法非常重要，因为它们可以加速机器学习模型的训练，同时降低模型的复杂度，从而提供更易解释的结论。我们确定了最佳特征选择策略，并将其与几种机器学习分类器进行评估，以识别在检测安全违规方面性能优化的算法。\n\
  \n第 2 节描述了无线传感器网络（WSNs）中的安全问题，第 3 节随后描述了机器学习。第 4 节描述了机器学习如何解决不同的安全问题，第 5 节描述了为应对这些问题而开发的方法。第\
  \ 6 节描述了提出的方法。第 7 节描述了整个工作的结论。\n\n# 2. 无线传感器网络中的安全问题\n\n制造业和无线通信网络领域的演进促进了无线传感器网络（WSNs）的增长。它们由高能量消耗的廉成本传感器节点组成。若干特性使\
  \ WSN 容易受到安全攻击，包括传感器节点的资源受限特性和节点的自组织部署。WSN 生存的基本需求包括可靠性、可用性和能量效率。拒绝服务攻击（DoS）和窃听攻击针对网络传输数据的机密性和完整性，而泛洪（Flooding）和干扰（Jamming）攻击与网络功耗有关\
  \ [3-4]。因此，可以说存在多种针对 WSN 敏感位点的安全攻击，例如 WSN 的带宽、功率和路由机制，从而为入侵者开启了新的门径。WSN 更容易受到中间人安全攻击，因为它们对网络传输的信息提供了完全的控制。攻击者的目标是数据的机密性和完整性。\n\
  \n### 2.1. 窃听攻击\n\n窃听攻击构成了其他攻击的基础，是对无线传感器网络的一种严重安全威胁。无线传感器网络中有两类窃听攻击：被动窃听，即恶意节点通过收听无线广播介质中的消息传输来检测信息；主动窃听，即恶意节点通过向发射器发送查询来伪装成授权节点并获取信息。\n\
  \n### 2.2. 干扰攻击\n\n干扰被认为是一种特殊的拒绝服务（DoS）攻击。在干扰攻击中，发射高频无线电信号来干扰发射器的工作。干扰器可以是一个简单的发射器，也可以是配备特殊设备的整个干扰站。\n\
  \n### 2.3. 篡改\n\n在这种攻击中，原始节点被虚假节点替换，入侵者可以获取加密密钥等敏感信息。此类攻击通常发生在物理层。\n\n### 2.4. 耗尽与碰撞攻击\n\
  \n在这种攻击中，恶意节点通过在信道上传输阻碍 MAC（介质访问控制）协议，导致其他节点失去对信道的访问权限。时分复用被用作此类攻击的防御措施 [5]。当两个节点尝试以同一频率传输数据包时，就会发生碰撞攻击。\n\
  \n### 2.5. Sybil 攻击\n\nWSN 容易受到 Sybil 攻击。在这里，一个恶意节点创建了多个相同的节点。基于身份的伪造，Sybil 攻击可以在\
  \ WSN 中以多种方式发起。相同的节点可以轻松地从正常节点获取访问，并在单跳通信中获取信息。这种向未授权节点的通信导致了数据丢失。Sybil 攻击导致数据完整性、安全性和资源利用的下降。Sybil\
  \ 攻击分为两类：\n\n**身份被盗取攻击与伪造攻击：** 从合法节点创建新的恶意节点。例如；一个受授权传感节点的 16 位 ID 可以被用于创建一个具有相同\
  \ 16 位 ID 的伪造节点。\n\n**直接攻击与间接攻击：** Sybil 节点与真实节点之间的通信直接进行，而在间接攻击中，则通过恶意节点进行 [6]。\n\
  \n### 2.6. 黑洞攻击\n\n在这种攻击中，数据流量被吸引到恶意节点。该恶意节点伪装成最短路径以吸收数据包。一旦节点被捕获，它们就会被重新编程，使其无法将数据包传输到目的地。重新编程的节点被称为“黑洞节点”。\n\
  \n### 2.7. 虫洞攻击\n\n入侵者对从网络一部分接收的消息建立隧道，并通过低延迟链路的重放将其传输到网络的另一部分。虫洞攻击以“隐藏（hidden）”和“暴露（exposed）”两种模式存在。虫洞攻击是一种拒绝服务攻击，它可以在不考虑已实施的加密技术的情况下影响网络，从而使检测变得困难\
  \ [7]。\n\n### 2.8. 灰洞攻击\n\n在这种攻击中，恶意节点充当网络中的正常节点，丢弃在网络中传输的数据包，从而隐藏需要发送到目的节点的信息 [8]。无线传感器网络中的灰洞可以根据\
  \ WSN 中的节点数量和丢包分为两类。\n\n### 2.9. 汇洞攻击\n\n这是一种内部攻击，入侵者首先将一个正常节点转换为受损节点，然后根据所用路由协议的路由量将所有流量吸引到该受损节点\
  \ [9-10]。无线传感器网络的通信模式使得检测汇洞攻击面临巨大挑战。\n\n### 2.10. Hello 泛洪攻击\n\n\n\n\n无线传感器网络中的一些节点会广播“hello”消息来向所有邻居节点标记它们的存在。Hello\
  \ 洪水攻击（Hello flood attack）可能由此类节点引起，导致它们被网络中大量节点选为父节点。在这种攻击中，入侵者控制一个节点，并通过发送 Hello\
  \ 消息宣称自己是其他节点的邻居。当节点接收到此消息时，它认为该节点在范围内范围内并开始与被捕获节点进行传输。\n\n## 3. 机器学习作为无线传感器网络（WSNs）的保障\n\
  \n机器学习（Machine Learning, ML）这一术语出现于第一个神经网络设计时。机器学习可以描述为“设计一种具有自动学习能力并能随着经验不断改进，而不需要显式编程的系统”。在无线传感器网络中，机器学习不仅能够提高性能，还将帮助访问传感器采集的大量数据。使用\
  \ ML 技术可以轻松预测覆盖目标区域所需的传感器节点数量。现有机器学习算法的分类是基于模型结构和学习能力的。图（(1)）描述了 ML 模型工作背后的基本过程。\n\
  \n![](img/9781681088624-C2_F1.jpg) **图 (1)**\n\n机器学习模型的设计。\n\n在网络安全领域，机器学习通过对以往场景进行分析并预测强制防御措施，正展现出进展性的成果。在某些场景下，该技术超越了传统的安全措施。\n\
  \n1. 机器学习提供了关键实时事件的识别。\n2. 算法能够通过分析网络流量和过去的安全违规模式，揭示先进的防御机制。\n3. 机器学习可以检测网络基础设施的内部威胁和违反策略的行为。\n\
  4. 通过机器学习方法设计了先进的入侵检测系统（IDS）。\n5. 机器学习为无线传感器网络提供了同步和拥塞控制。\n\n对于无线传感器网络，机器学习在某些方面提供了先进的分析解决方案。\n\
  \n**定位（Localization）：** 有时，在 WSN 部署后，识别基础设施中的传感器节点成为了一项关键任务，需要进行重新配置。机器学习算法为网络中的未知节点和锚点节点提供了分类便利。此外，簇节点经过训练以寻找传感器网络中的特定节点。\n\
  \n**WSN 覆盖（Coverage in WSN）：** 传感器节点负责覆盖网络中的感兴趣区域。机器学习将让你知道为网络提供完整覆盖所需的最小传感器节点数量。\n\
  \n**异常检测（Detection of Anomaly）：** 数据持续从环境中积累，并以持续的速度传输到基站。因此，保护这些传感数据是一个关注点；机器学习正在实施混合检测策略，以识别网络上的恶意数据流量。\n\
  \n**数据聚合与聚类（Data Aggregation and Clustering）：** 在分布式大规模传感器网络中高效地传输数据是一项挑战。机器学习通过提取相似和异的的函数在簇头执行数据压缩。\n\
  \n**查询处理与事件检测（Query processing and Event detection）：** 机器学习算法有助于在系统要求有限的情况下开发先进的检测策略。\n\
  \n机器学习见证了传感器网络学习过程的改进，并减少了端到端的传输延迟。它还通过在传感器节点上应用降维算法显著降低了通信开销。算法不断推进节点同步，并进行自我调整以适应无线网络动态变化的环境，以便轻松实现重新配置。\n\
  \n## 4. 监督学习\n\n这些系统对带标记的输入和输出数据进行分类以形成学习的基础。基于监督学习的模型用于表示系统参数与输入输出之间的学习关系。对于无线传感器网络，路由、定位、故障检测和同步问题是通过机器学习技术解决的。\n\
  \n### 4.1. 线性回归与逻辑回归\n\n这是一种简单的监督学习方法，根据独立变量（`x`）预测因变量（`y`）。回归可以是线性回归或逻辑回归，并且可以具有连续或定量变量。线性回归的数学符号如下方的公式\
  \ 1 所示。\n\n| ![](img/9781681088624-C2_equ1.jpg) || (1) |\n| --- | --- |\n\n逻辑回归指出只存在两种可能的类别来描述因变量或目标变量的性质。因变量定义为\
  \ `0` 和 `1` 的形式。\n\n除了这两种之外，另一种回归是贝叶斯回归（Bayesian Regression），它使用概率估计来制定线性回归。结果变量定义为\
  \ `y`，它由高斯分布生成。贝叶斯回归有助于确定后验概率，侧重点并非寻找最佳解决方案。\n\n支持向量回归（Support Vector Regression）用于实值估计，属于监督学习方法。它基于核（kernels）的使用，用于训练对称函数。支持向量机（SVMs）通过将二分类问题表述为凸优化问题来解决这些问题。\n\
  \n### 4.2. 人工神经网络（ANN）\n\n这是一种基于生物神经网络运行的监督学习模型。ANN 由大量称为神经元的处理单元组成，并在三层上运行，即输入层、隐藏层和输出层。在无线传感器网络中，ANN\
  \ 用于提高路由、拥塞控制和数据聚合的效率。人工神经网络可以一次性记忆多个输出和决策边界，因此认为适用于解决网络挑战，并且提供了成本效益的解决方案。\n\n###\
  \ 4.3. 决策树\n\n决策树基于如果-那么规则，由两种节点组成，即决策节点和叶节点。它是一种监督学习算法，根据不同的条件划分数据集。决策树的叶节点代表类别标签，属性由树的内部节点表示。根节点的属性通过使用吉尼指数（Gini\
  \ Index）或信息增（Information Gain）方法进行选择。在无线传感器网络中，决策树用于处理异常检测、移动汇聚路径选择等问题。它们有助于识别损坏率和丢包率等特征。\n\
  \n### 4.4. 随机森林\n\n\n\n\n随机森林算法基于集成学习，由许多决策树组成。随机森林算法分两个阶段进行操作：首先是创建随机森林分类器，其次是预测结果。随机森林可用于分类或回归问题。在随机森林算法中，认为“树的数量越多，预测结果的准确性越高”，因此与其他机器学习技术相比，它降低了敏感性水平。使用该算法，不会出现过拟合问题，而且也有助于特征工程。与介质访问控制（MAC）的问题已通过随机森林算法解决。\n\
  \n### 4.5. 贝叶斯学习\n\n贝叶斯学习是一种监督学习，它将统计模型参数视为随机变量，并使用后验分布得出结果。贝叶斯推理通常考虑较少的训练样本，并遵循等式\
  \ 2 给出的贝叶斯规则。\n\n| ![](img/9781681088624-C2_equ2.jpg) || (2) |\n| --- | --- |\n\n\
  ### 4.6. 支持向量机 (SVM)\n\nSVM 是一种监督学习方法，其中每个数据项被绘制为 n 维空间中的一个点，每个特征的值为特定坐标的值。因此，我们可以说\
  \ SVM 是一种为数据分类提供最优超平面的分类器，在二维空间中，该超平面被视为线。在无线传感器网络中，SVM 可用于检测节点的恶意行为和连接问题。当数据以非结构化或半结构化形式存在时，SVM\
  \ 效果良好。SVM 模型的复杂度不受训练数据中特征数量的影响。\n\n### 4.7. K 近邻算法 (K-NN)\n\nK-NN 是一种基于实例的监督学习方法，用于处理分类和回归问题。欧几里得距离、曼哈顿距离和闵可夫斯距离是\
  \ KNN 方法使用的距离函数。输入数据集的大小是决定 KNN 复杂性的参数之一。\n\n## 5. 无监督学习\n\n这是一种学习方法，使用未经过训练或分类的信息来训练算法。系统根据它们之间的相似性和差异将信息分为若干类。与监督学习方法相比，无监督学习系统能够执行更复杂的任务。在无线传感器网络中，无监督学习用于节点聚类以及解决连接和路由问题。\n\
  \n### 5.1. K 均值聚类\n\nK 均值聚类将 n 个对象分为 k 个簇，其中对象属于具有最近均值的簇。K 均值聚类的主要目标是最小化簇内方差。该算法首先考虑\
  \ `K` 数量的随机位置并与数据点形成簇。一旦簇形成，就会从每个簇中重新计算新的质心。该过程一直持续到所有簇的质心值不再变化。这种聚类方法有助于为无线传感器网络中的路由选择最优簇头。\n\
  \n### 5.2. 模糊 C 均值聚类\n\n模糊 C 均值聚类由 Dunn 于 1973 年首次，后由 Bezdek 在 1981 年改进，用于模式识别。在这里，每个数据点都被分配一个与每个簇中心对应的隶属度函数。隶属度根据中心簇与数据点之间的距离分配。对于叠数据集，与\
  \ K 均值聚类相比，模糊 C 均值聚类提供了更好的聚类效果。\n\n## 6. 半监督学习\n\n基于半监督学习的算法包含标记和未标记数据集，因此可以说半监督学习是监督学习和无监督学习的结合。半监督学习的最终目标是使用某些标记信息对未标记数据进行分类。半监督学习的应用领域包括语音分析、蛋白质序列分类、网页内容分类和垃圾邮件过滤。半监督学习已用于无线传感器网络以解决定位问题。\n\
  \n## 7. 强化学习\n\n强化学习被描述为在特定环境中采取适当行动以实现奖励最大化。这是一种允许代理（可以是无线传感器网络中的传感器节点）通过与环境交互来学习的学习方法。Q\
  \ 学习是强化学习的流行技术之一。Q 学习让代理知道在特定情况下需要执行哪些操作，并可以处理随机转移问题。通过 Q 学习技术，无线传感器网络中的路由问题在很大程度上得到了缓解。\n\
  \n## 8. 机器学习解决 WSN 问题\n\n### 8.1. 机器学习解决安全问题\n\n保护无线传感器网络免受不同攻击（如上节所述）是一项挑战性任务。然而，机器学习已成为防御这些攻击的保障，研究人员已经提出了多种使用机器学习算法来检测和防止针对无线传感器网络攻击的技术。入侵检测系统\
  \ (IDS) 在检测无线传感器中的恶意节点方面起着重要作用。Parras *等人* 设计了一种基于马尔可夫决策过程的框架，利用强化学习来处理自组织防御和最优性问题。该方法在无线传感器网络中的频谱感知攻击中经过了测试。\n\
  \n为了提高融合分类，Javaid *等人* 提出了四种分类技术，即增强 K 近邻 (EKNN)、增强极端学习机 (EELM)、增强支持向量机 (ESVM) 和增强循环极端学习机\
  \ (ERELM)。共准备了二十个数据集并使用 `MATLAB` 进行了仿真。这些提出的技术比现有技术具有更高的准确性和检测率。\n\n这些研究人员设计了方法，并针对数据集的几个子集对其进行了测试。他们在性能指标的整体分析中（包括检测率准确率和其他标准性能指标）显示了显著的改进。Tan\
  \ *等人* 应用了合成少数类过采样技术 (`SMOTE`) 来平衡数据集，并应用随机森林算法检测无线传感器网络中的入侵。`SMOTE` 是一种用于解决非启发式过采样导致的类别不平衡和过拟合问题的技术。研究使用了\
  \ `KDD-99` 数据集，该数据集包含 41 个属性，随后被分为五类攻击。这项研究工作得出结论：随机森林结合 `SMOTE` 实现了 92.57% 的准确率。使用\
  \ `AVISPA` 工具和 `HLPSL` 语言对协议进行了验证。`AVISPA` 代表 Internet 安全协议和应用程序的自动验证，已被 Chandre\
  \ *等人* 用于验证涉及身份验证和拒绝服务攻击的协议。\n\n\n\n\n\n设计了一种用于无线传感器网络（WSN）中黑洞攻击和汇洞攻击检测的混合框架。该框架基于`比例重叠评分\
  \ (POS)` 和 `Minkowski K means` 来降低复杂度并提高检测准确性。数据集中的特征被精简，并使用 `POS` 将数据转换为预处理形式。`Minkowski\
  \ K means` 算法被用于训练和分类。该框架实现了高检测率和低丢包率。它还最小化了网络中的通信开销，并使用网络仿真仿真器 2 对结果进行了仿真。`Minkowski\
  \ K means` 的检测准确率为 85.93%。Kumar *et al.* [15] 提出了一种检测框架，能够捕获汇洞和黑洞攻击，从而通过告警消息激活正常传感器节点。\n\
  \n入侵检测系统用于检测网络中节点的恶意行为。用于检测的 IDS 使用了基于二逻辑回归的统计工具。该系统将节点恶意行为的参数作为输入。这种 m-ID 在各种网络拓扑结构中实时部署。Ioannou\
  \ *et al.* [16] 为每种网络拓扑结构和攻击提出了二十四种恶意场景。随后，开发了一种用于无线传感器网络欺骗攻击检测的机器学习技术。将两种机器学习分类器混合，以处理和分析信号样本以检测攻击。该技术使用的机器学习算法是\
  \ `K means` 算法和 `K-NN` 算法。De *et al.* [17] 提出了一种优化算法，适用于攻击节点和合法节点处于相同距离或距离非常的场景。这种方法与现有技术之一相比，准确率提高了\
  \ 10%。\n\nQu *et al.* [18] 设计了一种基于知识的入侵检测策略（`KBIDS`），以弥补检测率与误报率之间的差距。`Mean Shift\
  \ Clustering Algorithm` 用于从网络流量中区分异常模式，支持向量机用于最小化分类误差。`QUAL Net` 被用网络仿真器，在每个区域随机部署了\
  \ 100 个传感器节点。与现有六种不同模型相比，`KBIDS` 提供了最高的检测率。\n\n离群检测是无线传感器网络安全关注的重要组成部分。了一项关于使用机器学习技术进行离群检测的调查，Dwivedi\
  \ *et al.* [19] 观察到贝叶斯分类已成为检测的最佳方法。设计了一种基于支持新的入侵入侵检测方法。在这里，遗传算法被用于特征选择。使用网络仿真器对无线网络进行仿真，并考虑了数据包交付等参数。Vijayanand\
  \ *et al.* [20] 提出了一种特征选择技术，并观察到所提出的基于遗传算法的特征选择技术提供了更高的精度、更低的开销和计算复杂度。\n\n`Random\
  \ Forest` 算法已用于无线传感器网络中的 DOS 检测。Park *et al.* [21] 提出的算法与基于 `Artificial Neural Network`\
  \ 模型进行了比较，观察到所提出的随机森林算法在黑洞攻击中显示出 99% 的准确率，在泛洪攻击中为 96%，在正常和调度攻击中为 96%。随后，提出了一种用于无线传感器网络虫洞攻击检测的算法，降低了丢包率。虫洞攻击节点的检测考虑了动态阈值值，随后通过聚类技术选择乐观的通信路径。使用\
  \ `MATLAB` 对 WSN 的代码组织进行了仿真，从而 Harpal *et al.* [22] 减少了整体丢包率并提升了 WSN 的性能。\n\n还有一类拒绝服务攻击被称为吸血攻击（Vampire\
  \ attacks）。这些攻击旨在耗尽节点电池的电量，由于它们符合协议，因此难以检测。之后，Tanguturi *et al.* [23] 提出了一种基于神经网络的检测算法，用于检测吸血攻击中的受损节点。数据被分为三类：训练、验证和测试。使用均方节点作为性能指标对设计的检测节点进行性能评估。该方法提供了低误差和高检测率。\n\
  \n研究人员使用 `Logistic Regression`、`Naïve Bayes`、`Support Vector Machine` 和 `Random\
  \ forest` 设计了一种分类和预测模型。这些机器学习算法在 KDD 数据集上进行了测试。观察到与其它算法相比，`Random forest` 实现了最高的真阳性率（`TPR`），并提供了\
  \ 99% 的准确率 [24]。\n\n[翻译的文本]\n\n该研究工作专注于一个特殊数据集，该数据集提供了对无线传感器网络四种攻击的检测和分类，即黑洞、灰洞、泛洪和调度攻击。使用\
  \ `LEACH` 分级协议进行路由。处理了 23 个特征并使用网络仿真器 2 进行仿真。`Artificial Neural Network` 用于数据集的训练、检测和\
  \ DOS 攻击的分类。Almonani *et al.* [25] 得出结论：黑洞攻击检测准确率为 92.8%，泛洪攻击为 99.4%，调度攻击为 92.2%，灰洞攻击为\
  \ 99.8%。\n\n提出了一种基于 `KMeans Clustering` 的虫洞和黑洞攻击混合异常检测方案。Wazid *et al.* [26] 使用\
  \ `OPNET modeler` 创建了 WSN 数据集并将传感器网络划类。使用 `OPNET simulator` 在正常流量和攻击场景下对无线传感器网络进行仿真。他们得出结论，这种混合方法提供了\
  \ 98.6% 的检测率，误报率为 1.2%。\n\n### 8.2. 机器学习解决无线传感器网络中的路由问题\n\n海量视频流的需求扩张为负载均衡的有效传输提供了环境。设计了一种基于\
  \ `Principal Analysis` 的路由负载均衡框架，并在 `Neural Network` 上进行了训练。Yao *et al.* [27] 提出的框架提供了更好的吞吐量和延迟。研究人员认为物联网\
  \ WSN 需要智能路由，因此他们开发了一种使用神经模糊规则聚类的方法。Thangamarya *et al.* [28] 的这种路由算法根据能量利用和数据包利用提供了更好的网络性能。随后提出了一种基于强化学习的路由算法用于优化。它使用模糊链路进行成本估计。Singh\
  \ *et al.* [29] 提出的算法为动态环境提供了显著改进。设计了一种基于和谐路由的节能算法以解决传感器节点的能量消耗问题。Zeng *et al.*\
  \ [30] 开发了局部策略，以提高算法准确性的性能衡量。\n\n### 8.3. 机器学习在 WSN 中的数据聚合\n\n除了这些，无线传感器网络中还有许多其他问题可以通过机器学习方法解决。表\
  \ 1 展示了通过机器学习策略在无线传感器网络领域完成的其他工作。\n\n表 1 **机器学习在 WSN 中的应用。**\n\n| **算法** || **在\
  \ WSN 中的应用** |\n\n\n\n\n\n| 随机森林 | |\n| --- | --- |\n| • 入侵检测 | • 安全攻击检测<br>• 故障检测\
  \ |\n| 支持向量机 | • 故障检测<br>• 能源效率<br>• 路由 |\n| K 近邻 | • 定位<br>• 节点估计 |\n| 贝叶斯网络 |\
  \ • 能源管理<br>• 传感器管理<br>• 移动管理 |\n\n到为止，机器学习已成功处理并缓解了与无线传感器网络相关的威胁。算法的范围不仅限于缓解安全违规，还处理了节点定位、路由、传感器管理等其他许多问题。谈到网络安全相关点，有多个公开的数据集，如\
  \ `KDD99`、`NSL- KDD`、`DARPA` 和 `UNSWNB15` 数据集。这些数据集通过若干已识别的网络属性（称为特征）来描述网络的行为。通过对最优特征集的选择策略可以提高分类器的性能指标，并有助于从给定的完整数据集中识别最佳特征。\n\
  \n因此，我们在公开的数据集上确定了三种特征选择方法，并观察了机器学习分类器在每个特征集上的性能，以便从数据集中预测最佳特征集。\n\n## 9. 提的特征选择方法与机器学习算法的对比分析\n\
  \n在讨论了安全问题以及在无线传感器网络中缓解这些影响的现有方法后，我们描述了特征选择策略，并在公开的数据集上对机器学习算法进行了评估分析。所提模型的工作原理如图所示（2）。\n\
  \n![](img/9781681088624-C2_F2.jpg) **图 (2)**\n\n方法论流程图。\n\n## 采用方法的概述\n\n1. 收集了合适的数据集，并执行了数据清洗和数据预处理阶段。因此，准备好了一个最终的干净数据集用于处理。\n\
  2. 应用了若干种特征选择策略，并识别出最佳特征集。\n3. 对每个特征集上的机器学习算法进行了评估分析，并从性能指标方面进行了比较，以识别最佳特征集和算法。\n\
  \n### 9.1. 数据集收集\n\n评估过程使用了 `KDD99` 数据集。该数据集包含了若干安全攻击的实例，这些实例被分为四类基本安全攻击。KDD 99\
  \ 数据集由二十二种不同的攻击组成，称为拒绝服务攻击、用户到根攻击、远程到本地攻击和探测攻击。\n\n### 9.2. 特征选择方法论\n\n特征选择是数据预处理阶段的一个重要步骤，因为它有助于减少维度并消除无关特征。\n\
  \n### 9.2.1. 基于相关性的特征\n\n该策略包含两种方法：首先从类中选择兼容的特征并进行识别，其次是从数据集中消除冗余特征。\n\n相关系数对于线性相关的特征，取值为\
  \ `+- 1`，如果它们相互不相关，则标记值为 `0`。\n\n### 9.2.2. 信息增益法\n\n这是一种基于熵和特征为文本提供的信息量的评估方法。熵在决策树中非常重要，因为它决定了数据的划分方式，并影响了使用方程\
  \ 3 绘制决策树边界的方式。\n\n| ![](img/9781681088624-C2_equ3.jpg) | | (3) |\n| --- | --- |\n\
  \n考虑数据集 `(D)` 和变量 `(v)`，信息增益的计算如方程 4 所示：\n\n| ![](img/9781681088624-C2_equ4.jpg)\
  \ | | (4) |\n| --- | --- |\n\n其中 `IG(D, v)` 表示数据集 `(D)` 对于变量 `(v)` 的信息，`H(S)` 表示变化前数据的熵，`H\
  \ (D/V)` 表示给定变量 `(v)` 数据集的条件熵。\n\n### 9.2.3. CFS 子集评估\n\n使用每个特征的预测能力和冗余程度来评估属性的价值。优先选择具有内部相关的特征子集，这些特征具有高度相关。\n\
  \n## 10. 实验结果与分析\n\n在对数据清洗并删除数据集中的重复项后，应用了上述特征选择策略。随后在所有三个派生的子集上评估了机器学习分类器，并记录了每个分类器在每个子集上的性能指标。\n\
  \n**算法 1：随机树**\n\n* 输入：具有 41 个属性的数据集 `(D)`\n* 通过信息增益属性选择将特征减少到 14 个\n* 过程\n* 步骤\
  \ 1：初始化分类方案\n* 步骤 2：选择基础分类器\n* 步骤 3：如果\n* (基础分类器 = 随机树)\n* 步骤 4：声明最大深度为 `m`\n* 步骤\
  \ 5：对于 `(m=0; m<=5; m++)`\n* 步骤 6：初始化批量大小\n* 步骤 7：为每个特征向量编码\n* 输出：最终模型 E\n\n**算法\
  \ 2：朴素贝叶斯**\n\n* 输入：具有 41 个属性的数据集 `(D)`\n* 通过属性选择将 41 个特征减少到 14 个特征\n* 过程\n* 步骤\
  \ 1：读取数据集 `(D)`\n* 步骤 2：将预测变量初始化为 `v`\n* 步骤 3：计算平均值和标准差\n* 步骤 4：估计概率\n* 步骤 5：计算似然性\n\
  \n**算法 3：ADA BOOST**\n\n* 输入：具有 41 个属性的数据集 `(D)`\n* 通过特征选择减少特征\n* 过程\n* 步骤 1：初始化权重\n\
  * 步骤 2：设置弱分类循环\n* 步骤 3：返回弱分类器\n* 步骤 4：设置归一化\n* 步骤 5：更新权重\n\n为了避免偏差和过拟合，使用 10 折交叉验证评估每个分类器。这有助于减少偏差并提供良好的方差。表\
  \ 2 描述了在针对子集进行评估时的检测准确率。\n\n表 2 **分类器的性能指标。**\n\n| **算法** | **CFS 特征选择** | **信息增益特征选择**\
  \ | **相关性特征选择** |\n| --- | --- | --- | --- |\n| 随机树 | 94.55 | 99.81 | 90.57 |\n\
  | 朴素贝叶斯 | 92.03 | 94.87 | 90.13 |\n| ADAboost | 93.17 | 95.84 | 93.32 |\n| Lib SVM\
  \ | 89.02 | 91.14 | 89.02 |\n| MLP | 90.09 | 91.23 | 91.23 |\n\n记录性能指标后，记录了每个分类器在子集上的训练和测试时间并进行了绘图。观察到，在针对信息增益方法获得的特征集进行评估时，随机树表现出更高的准确率指标。图\
  \ (3)–(5 描述了分类器在每种特征选择方法上的性能。\n\n每个算法在所有特征子集上还观察了如受试者工作特征曲线以及精确率和召回率等性能指标。因此，我们绘制了\
  \ ROC 面积，精确率和召回率的值见图 (6)。精确率描述了结果的衡量，而召回率描述了分类器展示的总相关结果。这里，TP 和 FP 表示真阳性例和假阳性例，而\
  \ FN 和 FP 表示假阴性例和假阳性例。\n\n\n\n\n\n相关性集的图表表示。![](img/9781681088624-C2_F4.jpg) **图\
  \ (4))**\n\n信息增益方法的图表表示![](img/9781681088624-C2_F5.jpg) **图 (5))**\n\nCFS 子集方法的图表表示![](img/9781681088624-C2_F6.jpg)\
  \ **图 (6))**\n\n其他性能指标的图表表示。\n\n## 结论与未来工作\n\n因此，我们在公开数据集上评估了三种特征选择方法，并观察到通过`Info\
  \ Gain Method`（信息增益法）识别出的特征集为分类器提供了更好的准确率衡量。特征的选择取决于所用数据集的类型，且在使用的数据集上，`Random tree`（随机树）是该方法最好的机器学习算法。使用`Info\
  \ gain` 的特征集的训练和测试时间也得到了缩短。\n\n机器学习正在保护无线传感器网络免受各种拒绝服务安全攻击。研究人员提到，需要开发一种主动防御系统来检测无线传感器网络中的入侵。基于机器学习的框架保护无线传感器网络免受这些安全破坏，这些框架提供了高效的检测和准确性。机器学习设计了一个能够在降低计算复杂性的同时提供高水平安全性的框架。未来的研究人员可以专注于设计针对无线传感器网络安全攻击的最优解决方案，并减少内存开销。\n\
  \n机器学习正成为无线传感器网络未来的一项很有前景的技术，因为它们能够处理传感器网络中与容量和设计相关的问题。`ML`（机器学习）算法采用的从以往经验中训练模型的策略使得传感器网络更加优化。`ML`\
  \ 算法在动态环境中工作的能力使无线传感器网络更加精密。未来的工作应侧于使用机器学习算法设计优化解决方案以增加网络寿命，模型还必须关注节点聚类和汇节点的移动。\n\
