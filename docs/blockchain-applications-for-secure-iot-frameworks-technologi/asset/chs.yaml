  *   **应用层：** 最后一层被称为应用层或 API 管理层。它充当第三方应用程序与基础设施之间的接口。\n*   **设备层：** 设备层是核心组件，其中有相互连接的各种设备。例如，通过手机\
  \ `via` 连接的蓝牙以及通过 Zigbee 网关连接的 Zigbee。其他设备包括通过 wi-fi `via` 连接到以太网的树莓派。这直接连接到第二层部分的通信层。\n\
  *   **通信层：** 通信层或网关层具有 rest 协议和其他应用层协议。这两层紧密耦合并产生海量数据。\n*   **第三层：** 第三层是基于云的。它被称为处理引擎或事件处理层。它拥有大量的算法和数据处理元素，并最终显示在仪表板上，此层处理从传感器层获取的数据。\n\
  *   **应用层：** 最后一层被称为应用层或 API 管理层。它充当第三方应用程序与基础设施之间的接口。\n\n（注：原文中存在大量重复段落，译文已根据要求进行去重处理，保留核心逻辑结构）\n\
  \n## 4. 物联网的基础知识\n\n既然我们已经理解了物联网的作用，让我们来看看它是如何工作的。\n\n（注：原文中存在重复的 \"Now that we've\
  \ understood...\" 句子已翻译为 既然我们已经理解了物联网的作用，让我们来看看它是如何工作的。）\n\n### 4.1. 物联网设备架构\n\n\
  设备架构分为四层 \\[24\\]。\n\n*   基础层由物联网设备组成，并包括所有组件，例如具有感知、计算和连接其他设备能力的传感器。\n*   第二层，即物联网网关或聚合层，它显著地聚合了来自各种传感器的数据。\n\
  *   第三层是基于云的。它被称为处理引擎或事件处理层。它拥有大量的算法和数据处理元素，并最终显示在仪表板上，此层处理从传感器层获取的数据 \\[25\\]。\n\
  *   最后一层被称为应用层或 API 管理层。它充当第三方应用程序与基础设施之间的接口。\n\n整个架构由设备管理器和身份访问管理器提供支持，它们对于架构的安全性非常有帮助。\n\
  \n### 4.2. 物联网参考架构\n\n物联网参考架构中存在多个层 \\[26\\]：\n\n*   **设备层：** 设备层是核心组件，其中有相互连接的各种设备，如传感器。例如，通过手机\
  \ `via` 连接的蓝牙以及通过 Zigbee 网关连接的 Zigbee。其他设备包括通过 wi-fi `via` 连接到以太网的树莓派。这直接连接到第二层部分的通信层。\n\
  *   **通信层：** 通信层或网关层具有 rest 协议和其他应用层协议。这两层紧密耦合并产生海量数据。\n*   **第三层：** 第三层是基于云的。它被称为处理引擎或事件处理层。它拥有大量的算法和数据处理元素，并最终显示在仪表板上，此层处理从传感器层获取的数据。\n\
  *   **应用层：** 最后一层被称为应用层或 API 管理层。它充当第三方应用程序与基础设施之间的接口。\n\n### 4.3. 物联网标准化与设计考虑\n\
  \n有几个标准正在演进。一些关键标准包括 \\[29\\]：\n\n*   **M2M：** 一种连接设备的机器间服务。\n*   **Contiki：** 一种用于低功耗微器的开源操作系统。\n\
  *   **Light OS：** 用于无线传感器网络的类 Unix 操作系统。\n*   **随机相位多接入：** 一种连接物联网对象的私有标准。\n*  \
  \ **Sig Fox：** 一种用于物联网和 M2M 的私有低功耗、低吞吐技术。\n\n### 4.4. 物联网互操作性挑战\n\n物联网的成熟带来了许多挑战，特别是关于互操作性和接口的挑战\
  \ \\[30\\]。\n\n\n\n\n物联网（IoT）架构的第一阶段由网络化的事物组成，通常是无线传感器和执行器。第二阶段拥有互联网网关和数据采集，这包含了传感器数据聚合系统和模拟量数字转换。第三阶段边缘\
  \ IT 系统在数据移动到数据中心或云端之前对其预处理。第四阶段数据中心和云端是在传统的后端数据中心系统上对数据进行分析、管理和存储。从根本上说，我们需要一个功能、可扩展且可维护的架构。如果无法支持这些特性，那么架构就是毫无用处的。\n\
  \n现在，让我们来看物联网的三个架构领域：\n\n- 一、客户端 IoT 设备层\n- 二、服务器端 IoT 网关层上的运营商\n- 三、用于连接客户端和运营商的路径，即\
  \ IoT 平台层。\n\n这三层在数据同步方面进行相互作用。该路径将从各种应用程序产生更多数据。这些层的可行性取决于它们的应用场景。\n\n### 4.6.\
  \ 中心化与去中心化 IoT 架构\n\n中心化架构是一个枢纽并从单点进行管理，而去中心化架构则基于用例；它们对工业物联网解决方案没有帮助。中心化架构与云架构相关，其中中央枢纽为智能设备提供一系列后端服务。在去中心化架构中，许多场景要求\
  \ IoT 拓扑中的智能设备之间持续通信，而不需要核心枢纽。中心化系统有助于事件处理，而去中心化系统运行更多的点对点消息传递。去中心化审计是去中心化架构的一个基本特征\
  \ [32]。\n\n## 5. 挑战\n\n### 5.1. 安全\n\n安全问题一直是物联网系统大规模部署的障碍。通常，由于安全漏洞，IoT 设备更容易受到分布式拒绝服务（DDoS）攻击。在这些攻击中，中央服务器会通过多个被攻破的计算机同时遭受海量数据请求，导致服务失败。近年来的几次\
  \ DDoS 攻击扰乱了许多组织和个人。不安全的 IoT 设备为网络犯罪分子提供了容易攻击的目标，他们利用薄弱的安全防护对其进行黑入并发动 DDoS 攻击。Arora\
  \ *等* 描述的针对不同层级的一些攻击概述见图 1。\n\n![](img/9781681088624-C3_F1.jpg) **图 (1)**\n\n物联网网络上的攻击类型。\n\
  \n### 5.2. 客户隐私\n\n传感器和摄像头现在变得越来越常见，从我们的家庭到公共空间都是如此。此外，我们消费者对被收集的信息了解越来越少，而且无办法避免。\n\
  \n企业对个人数据的使用已成为家常便饭，令某些人人不悦的是，公司正在通过出售我们的数据赚取数百万美元。从习惯、喜好到行踪，我们现在所做的几乎每件事都有记录。根据\
  \ CISCO 在 2019 年的一项调查，84% 的人表示他们关心自己以及社会其他成员的隐私，80% 的人愿意采取行动保护隐私 [33]。\n\n物联网中主要有三个隐私关注点：\n\
  \n- 设备隐私：这意味着在用户端，传感器或摄像头等记录信息的设备对用户隐私构成了威胁，因为它们记录的信息可能会被泄露和滥用。解决这一问题的方法之一是让这些设备由遵循严格安全和隐私标准的可靠来源制造。\n\
  - 通信隐私：同样，在网络上传输或传递数据时，数据的机密性是一个关注点。人们有许多方法接入这些通信通道并在未经授权的情况下提取信息。为安全通信设计的协议将有助于解决这个问题。\n\
  - 存储隐私：显而易见，通过传感器、摄像头或其他设备收集的所有数据都存储在中央存储服务器或云端，这使其成为盗取大量用户隐私数据的容易目标。解决这一问题的方法之一是在存储数据时使用高度安全的加密算法。\n\
  \n到目前，隐私一直是一个非黑即白的问题。公司摆出一种姿态，让用户同意他们的隐私政策。事实上，我们极少有人会读那些我们点击“同意”的隐私政策，即使有人读了，通常也写得非常晦涩，让人难以理解我们正被利用。这些事情在很大程度上推动了关于隐私的讨论。\n\
  \n### 5.3. 可扩展性\n\n设备数量的增长造成了瓶颈，因为现在的物联网是一个中心化系统，在大量设备的情况下，身份验证、授权与不同节点连接等过程注会导致问题。解决这一问题的方法之一是加大投资，建立具有更高计算能力的强大服务器。然而，如果该服务器面临某些问题，整个系统就会崩溃。\n\
  \nIoT 设备的数量正在稳定增长。国际数据公司（IDC）的一项新预测估计，2025 年将有 416 亿个 IoT 设备（或“事物”）产生 79.4 十字节（ZB）的数据\
  \ [34]。CISCO 估计，IoT 设备每天将产生 5 万亿字节的数据 [35]。有了如此惊人的数字，人们很容易说物联网将是我们未来生活中不可或缺的一部分，这使得上述担忧变得更加严峻。\n\
  \n网络安全研究人员和专家撰写的报告表达了他们对物联网系统安全漏洞的担忧，揭示了互联设备的漏洞，这些漏洞可以被黑客利用来制造破坏。联邦贸易委员会也在认真对待此事，试图理解保护这些新型互联设备隐私的方法，并确保在未来的设备中制定并遵循适当的新法规和协议。例如，随着无人驾驶汽车或自动驾驶汽车*等*的出现，它们被劫持或其\
  \ Wi-Fi 或其他连接服务被接入是汽车行业必须解决的现实问题。在创建连接事物到物联网的新方法时，不能忽视安全风险，因为每种新方法都伴随着自身的风险和漏洞。\n\
  \n## 6. 未来\n\n物联网可以被视作一种潜力无限的技术，并可以与人们能想象到的几乎所有领域中的任何可能的技术融合。如今，由于许多行业希望从中获益，对基于\
  \ AI 的物联网公司和设备的投资不断上升。无数公司现在都想探索 AI 和物联网，从起草战略到评估新项目或改进现有项目。\n\n市场出现这一重大转变有几个指标：\n\
  \n- 基于 AI 的物联网初创企业的资本资金正在快速增长。从统计数据可以看出，在 2017 年的前八个月，这些初创公司筹集了 7.5 亿美元 [36]。\n\
  - 收购 AI 物联网初创企业正在增加。从数据可以看出，2015 年为 11 个，2016 年为 24 个，而仅 2017 年前八个月就有 21 个 [37]。\n\
  \n\n\n\n*   Amazon `[38]`、GE `[39]`、IBM `[40]`、Microsoft `[41]` 等现有 IoT 平台供应商正在整合\
  \ AI 能力。\n*   大型机构已经开始利用 AI 与 IoT 的潜力来更高效地运营，从而提供更好的产品 `[42, 43]`。\n*   全球研究和咨询公司\
  \ Gartner 预测，到 2022 年，超过 80% 的 IoT 项目将包含 AI 组件 `[44]`。\n\nIoT 与 AI、ML（机器学习）和区块链结合有助于我们理解市场趋势，以及\
  \ SHELL `[45]`、WALMART `[46]` 等大公司的发展方向。我们今天看到的只是全貌的一小角。这种潜力随着时间的推移才能实现。谈到安全性，在拥有数千名员工的组织中，AI\
  \ 用于确定常规访问模式和不同员工的角色，为未来的工作布局提供洞察，并可能检测可疑活动。人脸识别技术在过去的几年里就取得了飞跃。由于现在几乎每台电脑都配备了摄像头，且手机处不在，从消费者对产品和营销的反应中获取信息变得以前所未有的简单。我们可以以\
  \ Facebook 的自动标记功能为例，大多数人对此都很熟悉。\n\n在未来，几乎不可能找到不利用 AI 服务的 IoT 系统。AI 将支持“全有效”的 IoT\
  \ 努力，如果没有 AI，部署产生的数据将具有“有限价值”。我们可以看到，截至今天这种情况已近乎成真。许多 IoT 供应商正在提供至少基础的 AI 支持。全球主要行业的公司已经从其\
  \ IoT 部署中的 AI 中受益。预计未来这些支持 AI 的 IoT 设备将我们的生活变得如此方便，以至于自动化将成为现实，诸如自动家居清洁、AI 驱动的智能锁、自动驾驶汽车、增强和虚拟现实、智能城市、区块链生成的加密货币以及所有其他当今科幻技术的益实用实例将成为新常态。\n\
  \n## 7. 结论\n\n从上述讨论可以明显，物联网在当前的场景下也是一项无处不在的技术，并将继续指数级增长。到目前为止，该技术的优点远大于缺点，但将将其整合到日常生活中以使\
  \ IoT 成为日常用品和基本服务的基础尚未完全显现。目前有若干限制阻碍了这些设备的最佳性能。尽管 IoT 设备现在非常常见，但正如我们所见，这项技术潜力的充分利用尚未实现。这有许多原因，从来自敌者的攻击等安全担忧，到数据泄露或滥用数据的隐私担忧（甚至是那些收集这些数据的公司），再到可扩展性问题（因为需要更大规模的\
  \ IoT 实现才能使行业和企业盈利）。然而，目前的技术存在若干限制。人工智能和分布式账本等多种技术正在被用于解决这些问题。我们每天都能看到新的进展产生和里程碑的达成，以进一步增强\
  \ IoT 的使用和利用。还有很多工作要做完成，需要大量的投资和努力来克服这些障碍。然而，如果我们考虑到 IoT 带来的巨大益处，从改善生活水平到丰富与设备及环境的交互体验，这一切都是值得的。它通过智能城市、智能农业和其他服务在可持续发展中也发挥了作用。希望通过阅读上述章节和讨论，读者现在对\
  \ IoT 的出现及其基础知识（如架构、框架等）有了清晰的理解，对该技术面临的挑战以及可能的解决方案和前景有了概述。这让读者有潜力扩展他们感兴趣的 IoT 方面的知识，并在改进技术和我们生活的社会不断向前。\n\
