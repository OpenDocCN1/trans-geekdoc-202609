  \ M. Rafi^(2), Mohammad Sufian Badar^(3, 4, \\*)\n\n¹ 计算机科学系，Jamia Millia Islamia，新德里，印度\n\
  ² 院长，Mewat Engineering College, Palla, Nuh 县，哈里亚纳邦，印度\n³ 生物工程系，加州大学河滨分校，美国州\n⁴ Salfia\
  \ Paramedical Institute Darbhanga, SPI Darbhanga, 比哈邦 846001，印度\n\n## 摘要\n\n物联网（IoT）是一项革命性技术，旨在使我们与之交互或使用的万物都具备通过互联网共享和接收信息的能力。我们所说的“万物”是指所有可能的物体，从厨房里的冰箱、洗衣机，到农场的土壤湿度传感器和体育场地的喷淋器。它在每一个领域都有无限的应用，包括但不限于医疗、工业/制造、安全等。这些众多的应用使得物联网成为一个难以理解的概念。为了解决这个问题，我们提出的这项工作旨在通过相关的示例和比通常更少的专业术语，全面地定义这一边界松散的物联网概念。随后，我们将通过讨论无线传感器网络（WSNs，物联网的一个子集）、分布式账本技术（或区块链，另一项正在与物联网融合以产生更安全、更稳健应用的革命性技术）来深入探讨技术方面和现实应用。然后，我们将讨论第三支柱人工智能（AI），当它与上述系统结合时，为我们每天交互的设备注入灵魂。最后，我们将衡量该领域的挑战与前景。\n\
  \n**关键词：** AI、人工智能、区块链、分布式账本技术、物联网架构、物联网、IoT、物联网安全、机器学习、ML。\n\n***\n\n(*) 通讯作者 Mohammad\
  \ Sufian Badar:** 生物工程系，加州大学河滨分校，美国州；电话：+1318 2783 121；电子邮箱：[msbadar@engr.ucr.edu],\
  \ [director_academic@salfiainstitute.edu.in]\n\n## 1. 引言\n\n本章节旨在解释`Internet of\
  \ Things`（物联网）意味着。我们人类一直努力让生活变得更简单，从简单的`IoT`1]到各种`IoT`2]等。虽然人们可以对其有一定的理解，但尚未涵盖其深度。维基百科将`IoT`定义为`“物联网（IoT）是一个相互关联设备系统，能够在不需要人与人交互的情况下传输数据。”`3]。麦肯锡给出的定义虽然简洁，但似乎更有逻辑，`“嵌入物理物体中的传感器和执行器通过有线和无线方式连接。”`4]\n\
  \n如前所述，定义本身是可以接受的，但它们缺乏多样性。在本章节中，我们将讨论与物联网并存的技术。人工智能，缩写`AI`，是一门使机器智能的计算机科学和工程领域\
  \ 5]。支持人工智能的设备可以自动执行通常需要人类协助的任务。Andrew Moore 给出的定义简单明了：`“人工智能是让计算机以直到我们认为需要人类才能的方式运行的科学和工程。”`\n\
  \n这种智能主要通过机器学习或`ML`实现，使程序和软件能够学习并获得人类智能。正如 Tom M. Mitchell 所说：`机器学习是研究计算机程序如何通过经验进行改进。”`\n\
  \n接下来是另一种近年来流行的技术——分布式账本技术，广为人知的`区块链`，它是维护记录的一种。从技术上讲，`区块链`是一个分布式的、去中心化的、公共 6]。在最基础的层面上，区块链只是区块的链，但并不是这些词的传统意义。当我们在这个背景下说`区块`和`链`时，我们说的是存储在相互连接的公共数据库中的数字信息（区块）（链）。这两项技术（即`AI`和`区块链`）都在为更强大、更有益且更安全的`物联网系统`铺平道路\
  \ 7, 8]。\n\n本章节讨论了`物联网`的历史，然后通过各种示例和场景描述了`物联网`的含义。在理清`物联网`这一巨大且模糊的概念后，讨论了该技术的基础原理、架构和框架。从那里开始，探讨了该领域面临的挑战，如可扩展性和安全性\
  \ 9]以及如何解决这些问题。最后，本章节为读者提供了关于物联网未来可能是什么以及在启示。\n\n\n\n本章旨在对物联网（IoT）建立清晰的理解。它为读者提供了一个关于物联网兴起的视角，介绍了它是如何变成如今这样的，然后讨论了现实世界中的物联网，以便人们更清楚地理解这些嵌入了网络的设备的无处不在性。通过讨论基础知识、架构、`etc.`\
  \ 等，让读者熟悉涉及物联网的技术细节，以及在开发物联网解决方案时需要注意的要求和考量。随后，它将向读者介绍该领域目前面临的挑战，使他们理解我们所欠乏的。最后，结合物联网扩展的前景，如果读者想在物联网领域追求职业，我们必须为他们提供一些可以思考和努力的方向。\n\
  \n## 2. 物联网的历史\n\n在科技领域，人们可能会认为物联网是某种老旧的东西。机器之间相互通信的想法或愿景，可以在尼古拉·特斯拉（Nikola Tesla）1926\
  \ 年接受《科利尔杂志》杂志采访 [10] 以及 19 世纪初的文学作品中找到。从某种意义上，自从 19 世纪中叶第一台电报出现以来，机器就可以说是在接触状态了。1900\
  \ 年，首次无线电语音传输（无线电报），随后在通信和电子领域出现了许多其他发明和创新，为物联网奠定了基础。在所有快速进步中，计算机的发展始于 20 世纪 50\
  \ 年代。\n\n互联网作为物联网的重要组成部分，始于 1962 年名为 `DARPA` 的军事防御项目的一部分，并在 1969 年演变为 `ARPANET`。商业服务供应商于\
  \ 20 世纪 80 年代开始支持公众使用 `ARPANET`，这使得现代互联网得以诞生。互联网和通信技术对于物联网的发展至关重要。`IPV6` 增加地址空间的决定是开发功能性物联网的另一个重要因素。\n\
  \n### 2.1. 概念的实现\n\n“物联网”这一术是由 `Kevin Ashton` 在 1999 年提出的，但这项技术在当时就已经存在了。最早的例子之一是\
  \ 20 世纪 80 年代初位于卡内基梅梅隆大学的口口可乐自动售卖机 [11]。那里的程序员将冰箱连接到传感器并接入到互联网，这样他们就可以监控里面的饮料，防止人们白跑一趟去自动售卖机。接着是\
  \ John Romkey 在 1990 年 Interop 展会上展示的烤面包机 [12]。那是一个连接到互联网的烤面包机，可以通过计算机进行开启和关闭。虽然有一些证据表明\
  \ 1979 年就存在可以进行无线控制的电梯 [13]，但这并不十分明确，因此口口乐售卖机被认为是第一个物联网的实现。\n\n企业对物联网的首次关注源于 `LG`，他们于\
  \ 2000 年宣布了第一台联网冰箱。从那里开始，物联网迅速发展，并于 2003 年左右开始出现在《卫报》[14]、《科学美国人》、`etc.` 等主流媒体上。联合国国际电信联盟（`ITU`）在\
  \ 2005 年发布了关于该主题的首份报告：“信息通信技术（ICTs）的世界增加了一个新维度：从任何时间、任何地点为任何人提供连接，现在我们将实现任何物的连接。连接将倍增，并创建一个完全全新的动态网络网络——物联网。”从那时起，物联网的认知和潜力不断提升。\n\
  \n到 2013 年，物联网演变成了一个涉及许多不同技术的系统，如无线通信、微机电系统（MEMS）和嵌入式系统。如今物联网的支持存在于从家庭到工业的几乎所有自动化领域、现代传感器网络、控制系统、`etc.`\
  \ 中。\n\n## 3. 物联网\n\n### 3.1. IoT 的含义\n\n让我们想想现在的手机。它们能做什么？它们可以通话、发短信、播放歌曲、电影、书籍、`etc.`。它们是如何执行这些任务的？当然是通过使用互联网。没有互联网，它们的能力就有限。为设备配备互联网功能具有许多益处。这在手机、笔记本电脑和平板电脑等我们设备中可以清楚地看到。连接互联网后潜力的同样增长也适用于其他事物，从你拥有的家电到周围的电气设备，或者你的其他资产，字面上的一切一样。物联网的核心思想或概念很简单，`i.e.`\
  \ 就是取万物并将其连接到互联网 [15]。关于物联网的所有混乱基本上是因为它的定义和想法如此宽泛且关联松散，以至于产生了无数可能性和例子，使得物联网的概念难以捉。为了进一步理解这一点，我们将看看为什么将事物连接到互联网很重要。\n\
  \n### 3.2. 物联网的重要性\n\n连接到互联网的设备或事物获得了接收或发送信息的能力，在某些情况下，两者兼备。这带来了“智能”的头衔，例如智能手机、智能电视、智能家居、`etc.`。通过将它们连接到互联网，这些设备在能力、功能和体验方面超越了它们的限制。让我们再次考虑手机。现在我们可以在手机上听任何我们喜欢的歌曲，并不是因为我们把所有歌曲都存储在手机里，因为我们不可能在手机里存储所有的歌曲。这是互联网发挥关键作用的部分。它是如何工作的？世界上每首歌都存储在某个设备上，当我们的手机等设备请求时，该设备就可以发送信息（在这种情况下就是一首歌）。它利用互联网提供的信息，因此我们可以听我们选择的歌曲。这种信息的交换是互联网为我们提供的能力。这使得即使是手机这样的小设备也能通过触控访问并使用高存储容量设备，甚至使用超级计算机。这就是将我们的设备连接到互联网带来的力量。所有连接到互联网的设备可以大致分为三类，它们共同工作以提供超出单一设备范围的潜力。这些类别是：\n\
  \n*   收集并发送信息的物体\n*   接收信息并执行操作的物体\n*   兼者的物体\n\n### 3.2.1. 收集并发送信息的物体\n\n就像我们拥有感官可以感知热量、触摸、运动、气味、声音、光线、`etc.`，并将这些信息发送到大脑进行处理一样，也有可以从环境中收集信息的设备，被称为传感器。它们收集环境的数据，如光线、风、速度、温度、`etc.`。如果它们连接到某些处理单元，就可以将其发送那里进行利用。为传感器提供通过互联网交换信息的能力使其成为更强大的工具，因为以前只能在设备局部获取的数据现在可以随时随地被访问，并由强大的计算设备进行处理以得出有用的结论。\n\
  \n### 3.2.2. 接收信息并执行操作的物体\n\n\n\n\n我们都使用过那些在我们发出信号后开始工作或执行特定任务的设备或电器。例如，为了改变冰箱的温度，我们通常会旋转旋钮或按下按钮。这些命令可以简单如一个开关按钮，也可以复杂如通过扬声器播放的莫扎特旋律。现在，当你将这些物品连接到互联网时会发生什么呢？设备功能或操作的可访问性将飞速提升。你现在可以在坐在客厅沙发上看电视时改变冰箱的温度，可以从另一个房间甚至在家里外关闭另一个房间的灯。这种可访问性和体验的扩展是万物互联带来的另一个强大工具。\n\
  \n### 3.2.3. 兼具两种能力的设备\n\n这些设备是所有物联网（IoT）设备中最为强大的，因为它们同时为你提供了实用性和可访问性。它们可以收集信息，将其发送给需要的设备，并接收信息并采取行动。这正是物联网真正潜力绽放的地方。让我们现在通过一个例子逐个考虑前两点，稍后我们可以将它们合并起来，以理解兼具发送和接收能力的设备如何丰富我们的生活并让生活变得更加简单。\n\
  \n在这个例子中，假设一位农夫在他的农场安装了能够检测土壤水分百分比的物联网传感器，这些传感器将数据直接发送到他的家用电脑或手机，告知他土壤的水分百分比。现在，农夫可以准时灌溉农田。这防止了他过度灌溉或灌溉不足，从而节省了资金。接下来，他在农场上安装了一套自动灌溉系统。如果他将其连接到互联网，他就可以随时为作物灌溉。第一个是收集数据并发送数据的物品示例，而第二个是接收输入数据并采取行动的物品示例。现在，进一步，他可以将水分传感器和灌溉系统都连接到互联网，让它们相互通信。要做到这一点，他只需要设置水分百分比的阈值。如果土壤水分水平低于给定的阈值，传感器会自动向他发送数据，同时信号自动灌溉系统开始灌溉。这样，即使在晚上或农夫忙碌时，只要水分百分比降到某个水平，他就不必担心灌溉农田，因为系统会在需要时自动完成。农夫还可以利用天气预报更进一步。他只需要检查有关降雨的天气预报。一旦传感器检测到低水分百分比，它会首先查询天气预报。如果未来几小时内有降雨概率，它将直接等待降雨。如果预测失败，灌溉系统将在几小时后启动。这样，农夫将节省灌溉成本、电力和精力。在这里，水分传感器、自动灌溉系统以及与天气预报算法连接的整个系统构成了一个既能发送又能接收信息、收集数据并采取行动的设备网络，从而使我们的工作比以前更加容易\
  \ [16]。\n\n## 3.3. 物联网的范围：应用与示例\n\n物联网能够帮助每一个组织，无论它们处于哪个工作领域。它有能力和工具为组织的工作增加价值，并以一种以前无法想象的方式进行扩展。如果我们继续将以前已有的设备和物品连接到互联网，并添加具有为物联网定制能力的新设备，那么某些结果或输出将看起来就像魔法一样。我们在日常生活中也能看到物联网的运行。例如，我们都曾用过或认识有人使用智能手表或智能家居设备（如智能灯泡或风扇）。这些智能手表让我们深入洞察日常活动和健康状况，它们通过收集我们步行量、心率等物理数据来实现。我们也可以在不在家里时控制智能电器，只要它们连接到互联网。这增强了体验并极大地提高了设备的可访问性。例如，在我们进入家门之前通过手机开启空调，或者在洗澡前从沙发上开启热水器。只要连接到网络，一旦传感器检测到低水分百分比，它会首先查看天气预报。等。随着时间的推移（通过\
  \ `ML` 学习），这些设备可以开始执行任务，这样你就不必等待。在谈论物联网的优势时，我们应该记住它们实现了以下某几点：提高效率、改善健康安全以及增强体验。\n\
  \n### 3.3.1. 提高效率\n\n效率的提高意味着用更少的工作获得相同的结果，或者用同样的工作获得更好的结果。尽管个人层面的效率有时会被忽视，但对于组织或行业来说，提高效率至关重要。因为这直接影响投资和收入，提高效率变得非常重要\
  \ [17]。例如：\n\n- 在工厂中，通过在设备中嵌入传感器可以识别工作流中的瓶颈。解决这些瓶颈有助于增加产出，从而提高效率。\n- 与计划性维护不同，行业可以为设备嵌入传感器或分析设备，以预测精确的维护周期\
  \ [18]。通过这样，设备的寿命得到了延长。避免了不必要的维修，从而降低了支出。实时监控通过防止故障减少了事故。\n\n### 3.3.2. 改善健康与安全\n\
  \n这一方面影响人类社会的所有层面，从个人到组织甚至政府 [19]。先进的传感器设备和实时监控在这里起着重要作用。例如：\n\n- 持续监测患者生理状况的细微变化，在出现异常时实时通知医生。通过良好的算法，可以在感知到任何症状或疼痛之前检测到心脏病发作\
  \ [20]。\n- 通过物联网传感器和连接的分析设备，可以预测旋风或海啸等自然灾害，这些设备可以监测并破解环境的细微变化（压力、湿度、风速等 `etc.`）\
  \ [21]。这确保了人员和财产损失的显著减少，因为这样可以提前发布预警以便疏散和救援。\n\n### 3.3.3. 增强体验\n\n\n\n\n到目前为止，我们的大多数设备（并非全部）都是在被动输入的基础上工作的。随着物联网（IoT）以及机器学习的出现，这种现状正在改变。我们对设备的使用比以往任何时候都更加频繁，而且我们的设备不仅仅是在响应，而是在与我们交互，有时甚至会进一步提出建议或自主执行任务。这增强了用户体验，让我们在与其他设备交互时感到更加舒适。知道设备可以在未经许可的情况下采取行动可能会让我们有些不安，但现实情况是，它们会随着时间的推移，通过观察我们的活动、偏好或使用时间等\
  \ `etc`，从中学习我们的习惯 \\[22, 23\\]。例如，配备了智能空调或恒温器的智能家居可以根据我们通常在夜、白天或特定时间的设置习惯来改变房间温度。此外，它还可以根据室外的天气调整温度。这有助于降低能源消耗。\n\
  \n考虑到这一切，我们可以说，机器学习（ML）和物联网（IoT）都是各自强大的技术，它们的联盟为我们增长、提升生活质量以及增强与技术的互动开启了一系列新机会。\n\
  \n## 4. 物联网的基础知识\n\n既然我们已经理解了物联网的作用，让我们来看看它是如何工作的。\n\n### 4.1. 物联网设备架构\n\n设备架构分为四层\
  \ \\[24\\]。\n\n*   基础层由物联网设备组成，并包括所有组件，例如具有感知、计算和连接其他设备能力的传感器。\n*   第二层，即物联网网关或聚合层，它显著地聚合了来自各种传感器的数据。\n\
  *   第三层是基于云的。它被称为处理引擎或事件处理层。它拥有大量的算法和数据处理元素，并最终显示在仪表板上，此层处理从传感器层获取的数据 \\[25\\]。\n\
  *   最后一层被称为应用层或 API 管理层。它充当第三方应用程序与基础设施之间的接口。\n\n整个架构由设备管理器和身份访问管理器提供支持，它们对于架构的安全性非常有帮助。\n\
