  \n\n\n\n\n# 针对物联网与大数据的区块链解决方案\n\nH. Abhijith, Deepti Gupta, Shilpi Sharma\n¹ 印度北方邦拉什邦，诺伊达，阿米提大学工程与技术学院\n\
  \n## 摘要\n塑造未来的技术——物联网（IoT）和大数据，是计算机科学部门领先的研究课题。像这样的每一个领域都容易受到黑客和敌对的攻击，因此需要适当的安全实施措施。目前的物联网本质上使用中心化服务器进行数据收集和分析，这引入了许多安全隐患。同样，大数据涉及每天处理和分析的海量数据。区块链网络可以填补这种对更好安全解决方案的需求。尽管由于具有去中心化、持久性、匿名性和审计性等特征，它仍处于起步阶段，但它能够加强各种物联网和大数据应用的安全性。本文讨论了上述技术所使用的现有基础基础设施中的安全缺陷，并提出了解决这些缺陷的安全解决方案。\n\
  \n**关键词：** 大数据，区块链，物联网，安全解决方案。\n\n通讯作者 H. Abhijith：印度北方邦拉什邦，诺伊达，阿米提大学工程与技术学院；邮箱：`abhijithrajihari@gmail.com`\n\
  \n## 1 引言\n物联网（IoT）是一系列互连的设备、机械和数字计算机、物体或唯一标识符（`UIDs`），这些设备可以在不需要人机交互的情况下通过网络从一个人传输信息。然而，它也带来了许多与\
  \ IT 安全相似的安全性问题。目前的许多物联网网络依赖于中心化网络模式连接到服务器或云服务进行数据处理和存储。人们担心服务器将成为瓶颈和网络攻击的新目标，并成为导致整个网络中断和损害测试一致性的故障点。因此，创建一个完全可靠且互联的生态系统来支持此类用于数据传输的嵌入式设备和计算资源仍然是复杂的。\n\
  \n大数据是一个描述定期大量涌入企业的海量数据的概念，包括结构化和非结构化数据。然而，重要的不是信息量，而是组织如何利用这些关键信息。某些用户利用这些信息获取私利、进行自我挖矿或与公司共享隐私信息。因此，为了克服物联网和数据的这些问题，引入了区块链。\n\
  \n区块链是一个去中心化的系统，它消除了交易中的第三方，从而建立了点对点的连接。它基于加密、去中心化、不可变性和透明性等功能。存储在区块链中的所有数据像数据库一样耦合在区块中。所有交易都与节点连接。当新交易出现时，发送者通过点对点网络将其告知所有不同节点。在交易被验证期间，它们被存储在交易池中。当交易在池中进行验证时，矿工创建一个新区块并在随后存储所有交易，然后区块区块。\n\
  \n本文讨论了与物联网和大数据相关的安全缺陷。它介绍了在实施区块链时可能出现的安全问题。本文对这些问题提供了一些可能的解决方案。文中通过各种示例详细阐述了实施的想法及其各种结果。我们回顾了其他论文提供的替代方案，例如用于数据收集的云系统和公平访问（Fair\
  \ Access）。本文重点关注为物联网网络设计的基于区块链的安全解决方案。这些方法包括物联网计算机的安全维护、安全的固件升级、可信计算基础的信任验证、物联网设备身份认证以及控制信息系统的安全数据存储访问。本文还关注了智能家居中基于区块链的物联网设备安全架构，该架构由三层组成，即本地智能家居网络、覆盖网络和云存储。实体在每个阶段都使用区块链传输进行相互之间的协调。本文通过分析与物联网组件交互期间未来的数据中断和安全问题，反思了物联网区块链平台。这些安全问题包括数据机密性、设计实践缺乏资源、关于升级和维护信息的不足。\n\
  \n本文的结构如下：\n- 第二节介绍了与该主题相关的文献。\n- 第三节分析并讨论了物联网和大数据面临的各种安全问题，随后对所提议和实施的区块链安全解决方案进行了回顾。\n\
  - 第四节讨论了前节所述安全问题的增长以及为什么需要区块链解决方案。\n- 第五节总结了相关工作。\n- 第六节总结全文，并列出开放问题和未来工作。\n\n##\
