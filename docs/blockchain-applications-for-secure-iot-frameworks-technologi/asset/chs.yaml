  \ |\n| 14 | `Tata Sky` | 2006 | HaritNagpal |\n\n## 3 解决 OTT 挑战的技术创新\n\nOTT 面临的挑战可以通过以下技术创新来解决\
  \ [15]:\n\n1. 区块链技术\n2. 5G / 6G 服务\n3. 本地 CDN 网络\n\n## 4 定义区块链\n\n`Blockchain` 是一种分布在许多参与者网络中的数据存储，基于交易的有效性达成共识。在\
  \ `blockchain` 中，交易无法被更改，因为 `blockchain` 是一个去中心化的、分布式公共账本系统。`blockchain` 由匿名用户管理。每个用户可以使用共识算法检查或丢弃数据\
  \ [16]。为了确保交易的安全、透明和不可篡，加密货币使用了区块链技术，而 `IoT` 中的数据安全也通过区块链技术成功处理 [17, 18]。区块链的工作原理如图\
  \ (1) 所示。所有的交易都是通过 `blockchain` 中的智能合约进行的（见 3.1 节）。区块链的工作原理及其属性、应用可以在 [19] 中找到。区块链涉及的步骤如下：\n\
  \n![](img/9781681088624-C9_F1.jpg)**图 (1))**\n\n区块链的工作原理。**\n\n1. 买家在线购买产品并进行交易。\n\
  2. `blockchain` 中的交易表示为块。\n3. 块中的所有交易都在点对点网络中广播。\n4. `blockchain` 网络检查买家身份，并在验证后通过。\n\
  5. 所有通过验证的交易将作为记录添加并添加到 `blockchain` 中。\n6. 最后，随着付款转移给卖家，交易完成。\n\n\n\n\nCOVID-19\
  \ 吸引了许多用户依赖 OTT 平台。2018 年和 2019 年 OTT 应用（apps.）各国家的增长情况如图（2）所示，而 2018-19 年印度 OTT\
  \ 用户的百分比如图（3）所示。事实上上，这激励了我们研究 OTT 平台及其在区块链中的实现。我们提出的工作提供了大量的 OTT 应用、其在区块链技术上的实现以及实时的用例场景。区块链技术为娱乐业提供了许多优势，并有助于防止盗版。为了方便后续理解，我们在第\
  \ 5 节和第 6 节提供了区块链技术在娱乐业中的应用。第 4 节强调了采用区块链技术的优势。\n\n图 (2) 显示了 2018 年到 2019 年 OTT\
  \ 应用各国的增长情况。图表显示，在此期间印度 OTT 内容的用户或订阅者最多。\n\n![](img/9781681088624-C9_F2.jpg) **图\
  \ (2)**\n\n2018-19 年 OTT 应用各国的增长情况。![](img/9781681088624-C9_F3.jpg) **图 (3)**\n\n\
  2018-19 年印度 OTT 用户的百分比。\n\n图 (3) 显示了 2018-2019 年印度 OTT 用户的百分比（按应用使用情况）。\n\n### 4.1.\
  \ 智能合约\n\n智能合约是双方之间签署的用于进行交易的协议。一旦智能合约签署，它就无法撤销 [20]。传统的纸质合同由 TTS 管理和验证。传统合同的问题如下：\n\
  \n1. 传统合同在本质上是被动的。\n2. 双方可能没有相同的数据或信息。\n3. 它们需要经常进行人工干预。\n4. 它们的成本高昂。\n\n## 5. 建议的区块链业务模式、优势与挑战\n\
  \n业务模式试图建立一个可以带来利润的模型。公司在广告上花费更多费用。每个组织都会制定符合其业务需求的行动计划。为了确保交易的安全、透明和不可篡改，加密货币使用了区块链技术。BC\
  \ 是一种安全的分布式账本，它与每个参与节点共享账本的副本 [21]。区块链行动计划有助于改进组织并使终端客户受益。\n\n一个良好的行动计划必须专注于财务专家而非业务愿景家。区块链业务理念必须能够在大规模和小规模水平上成功运行，从而使两类工作者和终端客户都受益。例如，`BloHosT`（区块链驱动的智能旅游和酒店管理）允许游客通过与加密货币服务器链接的单一钱包标识符与各种利益相关者进行交互以启动支付。`BloHosT`\
  \ 使用不可篡改的账本，在旅行期间不需要证明，这种方式为游客提供了无忧的体验。旅游驱动的深度学习（`TeDL`）框架作为 `BloHosT` 框架的一部分，它是根据以前访问过的旅行者的经验进行训练的。它为潜在游客提供有关之前旅行者最近访问地点的评分分数\
  \ [22, 23]。后续章节提供了有关建议的业务模式、优势及其挑战的信息。下面说明了一个示例场景。\n\n制造商的主要作用是从零开始或从任何其他自然来源创建产品。产品甚至可以通过制造许多组件来创建，例如在汽车行业中。制造业遵循两种模式之一：直接向消费者销售产品的企业对消费者（business–to–consumer）模式。在企业对企业（或\
  \ `B2B`）模式中，产品产品被外包给另一公司 [24]。之后，批发商从生产商处购买物品，然后卖给客户或零售商。批发商在制造商和零售店之间充当中间人。零售商直接从制造商或通过分销商获取产品。零售商可以在全国范围内运营，也可以独立运营。他们让客户购买选择的产品变得容易。特许经营是以上所有业务模式的结合。特许经营包含了所有的业务程序协议。区块链业务模式如下。\n\
  \n### 5.1. 区块链即服务 (BaaS)\n\n最流行的业务模式是 `BaaS` 模式。它帮助业务系统管理其区块链系统。该模型允许公司进行研究和测试等过程。`BaaS`\
  \ 模型允许公司专注于其业务开发周期。比特币和以太坊服务如 `EBaaS`（以太坊服务）为此模型提供支持。Amazon Web Services、IBM BlueMix\
  \ 和 Microsoft Azure。\n\n### 5.2. 代币经济- 实用业务模式\n\n效用是指从消费商品中获得的总满意度。实用业务模式基于 `Stellar`\
  \ 和 `Ripple` 等代币。资金通过 `XRP`（Ripple）或 `XLM`（Stellar）进行传输。\n\n### 5.3. 基于区块链的软件产品\n\
  \n预期利润的公司购买区块链解决方案并将其集成到系统中。区块链在支付和其他方面支持公司。例如，Spotify 购买了 `MediaChain` 来解决版税问题。\n\
  \n### 5.4. P2P 业务模式\n\n点对点业务模式帮助用户直接交互。这种业务模式使用 `BaaS`、代币等。`P2P` 的示例包括用于存储和共享的 `Filecoin`\
  \ 和 `IPFS`。\n\n### 5.5. 区块链专业服务\n\n为初创公司和其他公司提供服务以了解并采用区块链的使用。例如，如果公司有组建业务企业的计划，可以与\
  \ IBM、Deloitte 等公司合作来完成任务。\n\n## 6. 区块链技术的革命性优势\n\n区块链技术具有许多优势的分布式账本技术。某些优势包括：\n\
  \n1. 提供更快的交易\n2. 效益\n3. 防破解\n4. 透明性\n5. 可追溯性\n6. 数据不可篡改\n7. 实时数据管理\n8. 安全记录\n9.\
  \ 于审计\n10. 自动化及更多。\n\n## 7. 区块链可以解决媒体和广播行业面临的挑战\n\n区块链解决了媒体和广播行业面临的问题，甚至是 3.1 节提到的\
  \ OTT 面临的问题。表（4）显示了媒体和广播行业面临的挑战以及为了解决这些挑战而采取的区块链措施 [25]。\n\n表 4 行业挑战及区块链尝试解决的步骤\n\
  \n| **挑战** | **区块链实施解决方案** |\n| --- | --- |\n| 盗版 | 制止内容聚合者；提供所有者的不可篡改版权。向版权所有者支付版税。\
  \ |\n| 广告使用效率低下 | 了解内容使用情况、消费类型，AI 代理可以仅针对相关客户。 |\n| 跨地域按需付费 | 在区块链上跟踪每个用户的支付，并根据智能合约处理特定用户的支付。\
  \ |\n\n\n\n\n\n| 点对点实体变现 | 区块链通过自动化实时过程对每次共享进行变现 |\n| 版权和知识产权问题 | 区块链提供微支付、加密货币，使用户只需为他们选择的服务付费。\
  \ |\n| 分红分配中的问题 | 使用智能合约和微支付，交易变得透明化。 |\n| 音乐流媒体与版税支付 | 区块链使用与原始身份关联的数字文件 `Hash`。利用区块链结合\
  \ AI 可确保版权所有者获得其版税收益。 |\n\n## 8. 利用区块链技术转型 OTT 数字化平台业务\n\n区块链技术在许多方面为 OTT 数字化平台业务提供了优势。以下列出了区块链用于\
  \ OTT 数字化平台业务的一些关键特征：\n\n### 8.1. 为音视频提供代币\n\n随着区块链的采用，人们可以使用加密货币买卖资产，版权内容也是如此。\n\
  \n### 8.2. 为新艺术家和新入场者提供空间\n\n区块链在 OTT 平台中创造了新的艺术家和粉丝。它建立了客户与艺术家之间的直接通信。\n\n### 8.3.\
  \ 定向广告与营销\n\n区块链通过研究当前市场状况并轻松地向目标客户提供广告来帮助营销。它提供了营销和广告的透明度。\n\n### 8.4. 版税支付与智能合约\n\
  \n随着区块链的采用，艺术家的版税支付将变得透明且无忧。图（[`[4]](#9781681088624-C9.html#c9f4)`）显示了通过区块链进行的版税支付。\n\
  \n### 8.5. 内容交付的去中心化模型\n\n区块链消除了交易的中心化权威模式，使得点对点更容易直接验证交易。\n\n### 8.6. 降低制作成本\n\n\
  区块链有助于低成本地电影制作视觉特效和渲染效果，从而降低总制作成本。\n\n### 8.7. 微支付\n\n区块链促进了数字货币的使用。通过使用加密货币钱包，用户可以追踪每月支出。版税支付可以直接支付给版权所有者。\n\
  \n![](img/9781681088624-C9_F4.jpg) **图 (4))**\n\n通过区块链进行的版税支付。\n\n### 8.8. 许可与变现\n\
  \n区块链可以为无法负担大型制作厂高额收费的中小型内容创作者提供许可。它仅允许授权用户追踪他们的版税支付。\n\n### 8.9. 版税追踪与支付\n\n区块链确保所有参与者都能获得其产生收益的版税支付。区块链提供了数字水印以防止内容的盗用和未经授权的使用。区块链通过去中心化分布式网络提供高效交易，并允许点对网络参与者验证他们的交易。\n\
  \n### 8.10. 区块链驱动的云空间\n\n区块链可以作为去中心化系统，为去中心化应用提供空间。用户可以探索并使用该空间进行点对点云存储和数据交付网络。视频广告是区块链应用的特殊领域。利用区块链识别潜在客户将为广告业带来巨大利益。\n\
  \n## 9. 区块链技术 - 作为 OTT 平台业务规则的颠覆者以及数字广告中的实时应用\n\n区块链改变了音乐和娱乐行业的阶段。近期报告显示，根据复合年增长率\
  \ (CAGR) (`[`[26]](#9781681088624-C9.html#c9r26)`)，电信和媒体市场的区块链预计将从 2018 年的 4660\
  \ 万美元增长到 2023 年的 9938 万美元。区块链技术的一些颠覆性包括：\n\n### 9.1. 新艺术家的机会\n\n基于区块链的流媒体平台可能会为现场、体育、科幻和新闻创造新的渠道。\n\
  \n### 9.2. 广告与免费内容\n\n任何娱乐（M&E）业务计划都容易受到干扰。受区块链驱动的视频项目可能会被交换，以确保加密货币合法地记入内容创作者。\n\
  \n## 10. 区块链技术在数字广告和 OTT 平台业务中的实时应用\n\n数字广告领域的区块链应用受到了广泛关注。领先的 OTT 平台 Premion 和\
  \ Comcast 多频道视频分销商就是例子。在交易方面，Premion 与 MadHive 和 AdLedger 合作进行了概念验证 (`POC`)。\n\n\
  ### 10.1. 视觉内容与媒体\n\n基于以太坊 FilmChain 收集、指定分解电影、电视和其他数字媒体的收入。FilmChain 鼓励分发过程透明化。它还探索了全球资金的方法并促进接触全球观众。StreambedMedia\
  \ 是一家位于多伦多的公司，正在开发内容溯源机制，允许创作者追踪 YouTube、Instagram `etc.` 等社交网络网站上的内容。\n\n### 10.2.\
  \ BlockGraph TM\n\n以前名为 FreeWheel 的 BlockGraphTM 在数字和线性电视中部署了带有优质内容的区块链。使用 BlockGraphTM，广告商可以与开发人员、管理员和其他业务相关人员秘密地协调他们的数据集，以便在任何设备上定位或分析买家，而无需放弃敏感的客户数据\
  \ (`[`[27]](#9781681088624-C9.html#c9r27)`）。\n\n### 10.3. 音乐\n\n由 Sony 和 BMG 支持的\
  \ Vezt 是一家持有音乐版权的公司。粉丝可以分享歌曲的版税。Vezt 试图通过向专家、词作家和创作者提供来自粉丝的赞助来源超越音乐行业。另一个参与者 Verifi\
  \ 处理音乐创作者的权利。Verifi 提供跨公司的同步所有权。受 Lightspeed Ventures、General Catalyst 和 Kleiner\
  \ Perkins 支持的 Audius 旨在成为 Soundcloud 的区块链竞争对手。Audius 为其艺术家提供免费鼓励，将 90% 的薪水回给制作人，并确保顶级权限的广泛可发现性和粉丝责任\
  \ (`[`[28]](#9781681088624-C9.html#c9r28)`)。\n\n### 10.4. 观众互动\n\n在与 Ripple 的 XSpring、Scooter\
  \ Braun 和华纳音乐集团合作后，Audigent 在娱乐、体育和生活方式领域的广告商融资方面广受欢迎。YellowHeart 是第一个基于区块链的票务平台。它允许活动组织者预订音乐会场并设置票务管理规则。\n\
  \n### 10.5. 现状与未来\n\n\n\n\n\n为了转型数字广告供应链，个体消费者也应该参与其中。身份管理是区块链技术的核心元素；因此，消费者将在采用数字钱包的使用方面发挥重要作用。在\
  \ 2020 年当前的全球大疫情期间，许多 OTT 平台开始了直接数字化的发行；OTT 平台已开始投资即将上映的电影。在新冠肺炎期间，许多数字首映通过 Amazon\
  \ Prime Video 进行流媒体传输。2020 年 6 月，Disney+Hotstar 宣布在其平台上数字化发行七部价值 100 亿卢比比的电影。OTT\
  \ 平台通过关注直接数字化的发行来盈利。新订阅者是 OTT 平台的潜力所在。为了夺取印度市场，许多 OTT 平台开始投入巨额资金提供数字内容。Amazon Prime\
  \ Video、Disney+Hotstar 和 Netflix 是在印度内容投入方面非常激进的一些 OTT 参与者。Netflix 在 2019 年 12 月为原创内容投入了\
  \ 3000 亿卢比比。由于收视人数在两年内增长了六倍，Amazon Prime 的投资也翻了一番。Disney+Hotstar 获得了其母公司 Star India\
  \ 的更多投资。2020 年 4 月，Disney+Hotstar 完成了第二笔 1113 亿卢比的大投资。Star India 和 Star US 部门在 2020\
  \ 年 3 月为第 13 届印度超级超级联赛（IPL）的 OTT 平台投入了 1066 亿卢比比[29]]。例如，myNK 是 MinersINC 的旗舰产品，它是印度首个基于区块链的娱乐生态系统，通过安全网络直接将内容创作者与消费者连接起来[30]]。\n\
  \n# 11. 区块链（BC）中机器学习（ML）的应用——研究问题与挑战\n\n机器学习（ML）和区块链（BC）存在许多有待解决的研究挑战和问题。机器学习在区块链中应用的开放性问题和挑战如图所示（图\
  \ 5)）。\n\n### 11.1. 适用性\n\n在分布式环境中，对于不可信源，区块链是一个可可行的解决方案。如果性能是主要的考虑因素，那么简单的数据库是更好的选择。因此，在部署任何应用之前，必须清晰理解区块链的可用性和架构。\n\
  \n### 11.2. 基础设施\n\n对于基于区块链的应用，专门设计的硬件和网络基础设施旨在提高性能。然而，关于大型公司如何在其应用中采用区块链的大规模用途的研究仍在进行中。\n\
  \n### 11.3. 隐私\n\n隐私是区块链的关键问题，因为存储在区块链中的数据对网络中的所有节点可见。私有链通过受控的访问和加密来保护数据。然而，机器学习模型对这些有限数据的应用为预测和分析设置了障碍。\n\
  \n![](img/9781681088624-C9_F5.jpg) **图 (5)**\n\n区块链中的机器学习应用——研究挑战与开放性问题。\n\n###\
  \ 11.4. 内存\n\n数据的大小和新区块不断被添加到区块链网络中。因此，区块链的性能受到链长度增加的影响。区块链是不可篡改的，数据存储是大多数实现中的主要关注点。\n\
  \n### 11.5. 实现 \n\n对于较大的应用，实现区块链需要高带宽互联网连接以处理大量交易。因此，需要对区块和交易的添加进行控制。\n\n### 11.6.\
  \ 安全性\n\n在去中心化网络中，区块链容易受到安全问题，因此共识协议可能会被破坏（在公链中）。在私有链中，每个节点都是经过标识的，并配备了适当的共识协议。\n\
  \n### 11.7. 量子抗性\n\n用于区块链的哈希计算可能会被破解。幸运的是，量子计算为区块链提供了支持。量子加密可以增强区块链的安全性[31]33]。#\
  \ 结论\n\n本文讨论了 OTT 平台及其业务。越过传输（OTT）改变了电视、电缆和卫星。对于 OTT 平台最新进展感兴趣的读者，区块链技术通过智能合约安全地支付并防止第三方攻击。分布式账本技术保护了所有者的版权。区块链技术将在未来几年内彻底改变数字市场的格局。\n\
