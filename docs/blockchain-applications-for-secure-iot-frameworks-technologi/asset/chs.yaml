  \ | 低 | 比特币、莱币、以太坊（2018 年以前） |\n\n\n\n\n| PoS | 开放 | 中等 | <51% 的质股 | 都 | 高 | 以太坊（自\
  \ 2018 年起） |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| DPoS | 开放 |\
  \ 低 | <51% 的验证者 | 都 | 中等 | Lisk, Bitshares, Waykichain, Steem |\n| PBFT | 许可制 |\
  \ 高 | <33.3% 的故障副本 | 许可制 | 高 | Hyperledger Fabric |\n| PoA | 开放 | 高 | <25% 的计算力\
  \ | 许可制 | 中等 | Microsoft Azure, Decred |\n| PoC | 开放 | 中等 | <25% 的计算力 | 无许可制 | 中等\
  \ | SpaceMint, BurstCoin, Chia |\n| Tendermint | 许可制 | 高 | <33.3% 的拜占庭投票权 | 许可制\
  \ | 高 | Tendermint |\n| Ripple | 开放 | 高 | <20% 的故障节点 | 都 | 高 | Ripple |\n| PoB |\
  \ 开放 | 高 | <51% 的质股 | 无许可制 | 中等 | SlimCoin |\n| PoET | 开放 | 低 | <25% 的计算力 | 都 |\
  \ 中等 | Hyperledger Sawtooth |\n\n### 4.8. 智能合约\n\n众所周知，合约是双方之间的法律纽带。智能合约是指存储在区块链网络上的部分代码，当满足特定条件时会自动执行。通俗地说，它们是自执行的脚本，在区块链中编码设定的协议，以数字方式验证并实施参与者之间达成的合约，并最终帮助数字资产的传输\
  \ [10]。智能合约最早由以太坊引入，并使用 `Solidity` 编程语言编写。编写智能合约有很多可用工具，但在所有工具中，基于 Web 的 `Remix`\
  \ 最方便。\n\n让我们通过在以太坊测试网上创建并部署智能合约来快速进行一项有趣的活动。为此，我们首先需要下载 `MetaMask` 的浏览器扩展。`MetaMask`\
  \ 是一个既作为以太坊浏览器又作为钱包的浏览器插件。下载完成后，我们需要创建一个钱包。可以使用任何可用的测试网络来在钱包中获取一些虚拟以太币（Dummy Ethers），因为智能合约的部署无法免费完成（Ether\
  \ 是以太坊的加密货币）。为此，我们需要如图所示选择一个可用的测试网络（见 **4**）（）（我使用了 Goerli 测试网络，因为在该网络上更容易获得测试以太币，但你可以选择任何一个）并打开该网络的测试网水龙头浏览器（Testnet\
  \ Faucet）。通过提供我们的账户地址，我们可以请求他们给我们提供测试以太币。\n\n完成这些后，我们将打开 `remix.ethereum.org` 网页并使用\
  \ `solidity` 语言创建我们的合约。让我们为电费单创建一个智能合约。为此，我们将创建一个 `.sol` 后缀的新文件，并遵循图（**5**）和 **6**）所示的步骤。\n\
  \n![](img/9781681088624-C5_F4.jpg)**图 (4))**\n\n使用测试网水龙头在 MetaMask 钱包中获取测试以太币的步骤。![](img/9781681088624-C5_F5.jpg)**图\
  \ (5))**\n\n在 Remix IDE 上部署测试智能合约的遵循步骤。\n\n## 5. 特性\n\n### 5.1. 分布式\n\n这是一种分布式技术，它允许数据/交易在链上的所有实体之间同步和共享，而不是进行复制或传输。这里需要理解的是，由于缺乏单一的数据存储库且交易分布在所有实体之间，记录/资金永远不会被黑客或或窃。这通过在网络上的许多计算机之间分配计算力，防止了单个服务器的负载。优点如下：\n\
  \n*   由于分布式计算能力，可以获得更好、更高效的结果\n*   确保了所有成员的所有权，因为他们积极参与所有交易。\n*   由于每个交易的副本都存储在所有节点上，篡改数据是不可能的，因为任何欺诈活动都能被轻易检测到。\n\
  \n![](img/9781681088624-C5_F6.jpg)**图 (6))**\n\nEtherscan 网络中的交易详情。\n\n### 5.2.\
  \ 去中心化\n\n这意味着不需要管理机构或第三方来管理数据和交易。这意味着是一种开放式账本技术，并确保了所有区块链组成成员之间的完全完整性，因为链中的每个实体拥有相同的账本副本。通过这一特性，用户对于发生的所有交易保持高度活跃、警惕并随时更新\
  \ [11]。列出这些特性的若干优点：\n\n*   不需要第三方极大提高了交易速度\n*   数据永远不会丢失，因为每个用户都有副本\n*   成本较低\n\n\
  注意：上述两个术语可能看起来相似，但实际上非常不同。去中心化涉及控制水平，而分布式网络指的是用户的位置。在去中心化网络中，决策由所有节点做出。如前，如果至少 51%\
  \ 的参与者投票赞成某事，该操作就会执行，否则将被拒绝。但在分布式系统中，处理是在所有节点之间共享的，它可能允许仅由中央机构做出决策。区块链结合了这两个特性。\n\
  \n### 5.3. 不变性\n\n一旦添加到区块中的数据永远无法更改，因为它们永久地存储在区块链网络上。这意味着在比特币网络创建时首次添加的数据仍然安全可靠，并且可以轻松访问。在这一特性上与数据库的区别在于，数据库允许我们在创建和添加之外还可以更新和删除数据。然而，区块链并非如此。虽然它允许我们创建和添加数据，但无法进行删除。这增加了它的安全性，因为从第一天起的交易记录都按原样存储，任何篡改数据的尝试都是徒劳的。发送方接收方都可以放心数据永远不会受到干扰。\n\
  \n### 5.4. 透明性\n\n任何两人之间添加的单个区块或交易都会反映在所有区块上。因此，对任何人都没有隐藏，且更改是公开可见的。这是一个有利的特性。让我们了解它是如何做到的。想象一个欺诈参与者非法访问网络并假冒他人。他将无法进行任何交易，因为首先，它需要所有人的验证；其次也是最重要的一点，私钥是一个唯一的密钥，几乎不可能正确猜测；如果一个人尝试几个密钥，所有这些尝试都会反映在所有区块上，他可以被轻易追踪到。\n\
  \n### 5.5. 点对点网络\n\n区块链允许交易在双方之间安全地发生，而不需要任何第三方。每笔交易都使用某种加密算法进行数字签名。这使得只有真正的接收方能在知道发送方公钥和自己的私钥的情况下解密代码。用于签名生成的哈希算法具有极其意义，因为它们像陷门一样，使得网络犯罪分子在实践中破解是不可能的。\n\
  \n## 6. 类型与平台\n\n这项技术可以分为 3 类 [12]。\n\n### 6.1. 公有区块链\n\n\n\n\n如其名所示，这种类型向公众开放，不属于任何单一机构。任何人都可以参与决策的共识方法。所有参与者都拥有平等的权限，通过遵循\
  \ 51% 规则来决定账本的命运，根据该规则，如果 51% 的参与者赞成某项决定（例如创建区块），该区块就会被创建；否则，建议将被丢弃。每个用户都积极参与交易验证过程。用户可能会可能不会因为参与而获得奖励。为了清楚地理解这一点，请想象你是公共区块链网络的一部分。你的屏幕上弹出了某人的新交易的请求。为了验证它，你必须解决一些数学问题，如果你是第一个给出正确答案的人，你将获得某些基于区块链的在线货币作为奖励。其他参与者提供的答案对于决策同样重要，但他们并不总是能获得奖励。这种区块链可以用于选举期间的投票，或用于维护加密货币。\n\
  \n### 6.2. 私有区块链\n\n私有区块链顾如其名，是私有的。访问和交易被限制在链成员。成员可能包括在之间共享个人数据的组织或某些个人。数据管理的权限受到严格的监控和控制。这种类型的区块链可能用于某些私人银行或特定公司来维护其业务记录，或用于大学维护其学生、员工、官方文件等记录。公众无法访问。平台包括\
  \ `R3 Corda`、`Ripple`。\n\n## 6.3. 联盟链区块链\n\n它也被称为半私有或混合区块链，结合了公共和私有区块链网络。它可以被视为一个半去中心化的网络。它可以托管在私有网络上，少数节点可以形成一个公共区块链，以整合其在稳定性、安全验证方面的最佳特性。这种区块链可能用于存储移动公司的数据，例如，向公众授予只读权限，但向少数选定的员工提供读写权限。一些著名的平台有\
  \ `Hyperledger`、`MultiChain` 等。\n\n下表 `3` 简要比较了三种类型的区块链：\n\n表 3 **三种区块链类型的比较。**\n\
  \n| **属性** | **公共区块链** | **私有区块链** | **联盟链区块链** |\n| --- | --- | --- | --- |\n|\
  \ *访问权限* | 开放 | 限制成员 | 部分开放 |\n| *透明度* | 完全透明 | 仅对用户透明 | 取决于设定规则 |\n| *去中心化* | 是\
  \ | 否 | 部分 |\n| *奖励* | 参与者因维护链获得奖励 | 无已知激励 | 可能奖励也可能不奖励参与者（取决于设定规则） |\n| *速度* |\
  \ 较慢 | 较快 |介于之间 |\n| *效率* | 低 | 高 | 高 |\n| *共识确定* | 所有矿工 | 选定的节点 | 单一机构 |\n| *用例*\
  \ | 几乎所有行业，如加密货币、供应链管理、股票市场等 | 适用于需要保持数据私或执行个人任务的组织 | 适用于希望充分利用公共区块链特性但希望保持信息完全私密的组织\
  \ |\n| *平台* | 比特币、以太坊 | Corda、Ripple | Hyperledger |\n\n## 7. 它是如何工作的？\n\n学习了区块链的基本元素后，我们现在知道账本中的所有记录都存储在由加密函数数字签名保护的区块中。区块是无形且不可更改的。只有当旧区块内存耗尽时，才会创建新区块。在公共区块链中，当收到向区块链添加新数据的请求时，该请求会反映在网络中的所有节点上。如果交易遵循共识规则获得批准，将通过添加时间戳进行验证，并通过链接上一个区块将其添加到区块链网络。关于哪些节点将附加区块的决定至关重要，因为网络犯罪分子可能准备就且足够幸运地引发\
  \ 51% 攻击。因此，所使用的共识算法机制也变得极其重要。交易通过加密算法确保安全。区块链交易获得批准/执行的主要步骤列在下方：\n\n*   步骤 1: 交易请求反映在网络中的所有节点上。\n\
  *   步骤 2: 遵循共识机制进行批准/拒绝。\n*   步骤 3: 交易获得批准并验证。\n*   步骤 4: 区块添加到链中并执行交易。\n\n## 8.\
  \ 应用、优势与挑战\n\n### 8.1. 应用\n\n凭借其特性和在短时间内执行交易的能力，区块链是这种与几乎所有现有技术融合的技术之一 `[13]`。它正在影响许多不同领域，从而使他们的任务更高效、更安全。以下列了一些应用：\n\
  \n1.  **基于区块链的加密货币**：最著名的例子是比特币，其他加密货币如 Litecoin 和 Ether 也在开发中。这归功于该技术的分布式、去中心化、不可变性和透明特性。中国银行于\
  \ 2020 年 8 月 29 日推出了 DCEP，通过提供无需银行账户的匿名数字钱包来开发电子现金基础设施 `[14]`。\n2.  **医疗数据的安全共享**：医疗保健是一个需要可靠活动追踪且需要完美记录的领域。在该领域引入区块链技术将充分利用其潜力并极大改善医疗设施\
  \ `[15](\\-)18]`。\n3.  **供应链管理**：这里需要区块链提供安全完整的信息，并在需要定期更新产品信息的成员之间维护良好的诚信 `[19]`。\n\
  4.  **业务应用**：它有助于节省时间和金，并确保对每个进度步骤良好的管理和安全监控 `[20]`。\n5.  **选举**：在通过选举领导人的民主国家，区块链可用于进行公平选举，所有记录易于维护且不会暴露选民的个人身份\
  \ `[21]`。\n6.  **存储个人文档的政府应用**：政府可以使用区块链平台存储和交换人们的个人文档。这些文档的安全存储，特别是在易发生年度灾害的地方非常有帮助，因为文档被安全地存储且永远无法篡改。\n\
  \n### 8.2. 优势\n\n在本章第 5 节中讨论过的区块链技术特性也可以被视为其优势。那里已经提到了一些优势。然而，如果你坐下来思考，你会发现这项重塑金融世界的的技术还有许多优势。下面列了一些其他优势：\n\
  \n1.  最大的优势是它通过加密哈希函数解决了用户的隐私和安全担忧。\n\n\n\n\n## 2. 真实交易\n一旦输入的数据无法被删除或篡改，而且每个区块都包含交易的永久时间戳。这使得整个过程与其他任何过程一样真实，并增强了安全性和隐私特性。\n\
  \n## 3. 更快的速度和更高的效率\n由于整个系统是去中心化和分布式的，不依赖于某些中央机构进行交易或数据存储，业务处理速度大幅提高，效率也得到了提升。这意味着单笔交易所需的时间缩短了，考虑到近期对时间的严格限制，这是一个巨大的优势。\n\
  \n## 4. 易于使用\n我们简要接触了网络中智能合约的部署，并看到在这个平台上操作是多么简单。我们可以随时随地安全地执行交易，而不像那些有时间限制的金融机构。\n\
  \n## 5. 改进的记录和更好的可追溯性\n由于每个区块都包含元数据，包括`Block` 版本、`timestamp`（时间戳）、`Merkle Tree Root\
  \ Hash`（默克尔树根哈希）、父区块哈希、位以及`Nonce`（一次性数字），即使是 10 年前生成的记录，追踪它们也变得非常简单毫不费力。从第一天起创建的`Blocks`都包含时间戳且始终完好，永远无法删除或篡改，这一事实表明所有记录都是按时间顺序维护的。这一优势可以最好地应用于医疗领域，那里需要存储患者病史的准确记录。\n\
  \n## 6. 共识协议\n由于只有在通过共识协议对输入进行最大信任验证过程后，交易才会被添加到区块中，这消除了可能导致双重支付的双重记账等风险。\n\n##\
  \ 8.3. 挑战\n科技界对区块链技术仍然充满兴奋，而且这种兴奋感每天都在增长。这项技术无疑是`21st`世纪最具影响力且最令人振奋的技术，我们已经了解了该技术的许多应用和优势。然而，由于其带来的一些挑战，这项技术仍处于开发阶段，其中一些挑战下列所示：\n\
  \n1. **可扩展性**：这是最大的挑战之一，特别是在公区块链中，需要尽快解决。存储需求已成为一个问题。让我们通过`Bitcoin`的例子来理解。在`Bitcoin`中，一个区块的大小被限制在`1\
  \ MB`，而且通常每`10 min` 就会挖出一个区块。此外，`Bitcoin`网络有每秒`7 次交易`的限制，无法处理高频交易。此外，更大的区块需要更多的存储空间和更慢的传播速度。这可能会导致向能够维持巨大交易链的中心化网络转移。这导致了安全性区块大小之间的权衡，是一个主要关注的问题。\n\
  \n2. **有限供应以增加需求**：未来可用的`Bitcoins`总数为`2100 万`。据预测，最后一个比特币将在大约`2140`年挖出，到目前我们已经挖出了`1700\
  \ 万比特币`。\n\n3. **能耗**：这项技术使用`Proof-of-Work`（工作量证明）机制对交易进行适当验证并最终添加到网络。这个过程消耗大量的计算能力来在每个节点上反映交易、解决处理所需的复杂数学问题以及验证交易。\n\
  \n4. **互操作性**：大多数区块链网络处于孤立状态，无法与不属于其自身的其他区块链网络交换信息。这可以推测是大多数机构尚未向这项技术转型的主要原因之一。尽管已尝试解决这个问题，但帮助并不大，该问题的大部分仍需待解决。\n\
  \n5. **缺乏经过培训的专业人员**：这是另一个挑战，但随着对该主题意识的提高，正在逐渐得到解决。\n\n## 9. 未来前景\n尽管这项技术的先驱实施者是金融领域，但预计它将逐渐被许多其他部门采用。挑战需要解决，预计它将为该领域的科学家和研究人员开辟新机会。预计这项技术与`Internet\
  \ of Things`（物联网）、`Artificial Intelligence`（人工智能）和`Machine Learning`（机器学习）等技术的整合将为全球带来巨大的变化。此外，在区块链机制方面没有标准，市场上有很多不同的区块链平台。因此，如果一家公司想将这项技术引入工作场所，它们首先需要找到最适合其需求的平台。这可以通过`Blockchain\
  \ Testing`来实现，即对要执行的功能进行重点参数测试，以检查平台是否如开发人员所言。\n\n## 结论\n区块链技术被视为一种分布式去中心化账本技术，它是透明且不可篡改的并将并将存储在时间戳区块中。它允许用户在不需要任何中央机构的情况下快速进行和验证交易。尽管这项技术仍处于婴儿阶段，其最初的应用是从开发`Bitcoin`开始并限于金融领域，但它正在缓慢渗透到所有领域，并具有转型传统行业的潜力。当它与`Internet\
  \ of Things`、`Artificial Intelligence`和`Machine Learning`等技术相结合时，将为全球带来惊人的的变化。\n\
