  \n# 基于区块链技术的敏感数据传输安全型 IoT 模型\n\nVejendla Lakshman Narayana, R.S.M. Lakshmi Patibandla,\
  \ Arepalli Peda Gopi\n\n¹ Vignan’s Nirula Institute of Technology & Science for\
  \ Women, Peda Palakaluru, Guntur-522009, Andhra Pradesh, India\n\n² Department of\
  \ IT, Vignan’s Foundation for Science, Technology and Research, Andhra Pradesh,\
  \ India\n\n## 摘要\n\n全球技术领域的进步涉及了物理对象的智能化，这些物体能够通信并为我们解决智能物种面临的问题。“万物网络”或物联网（IoT）这一迷人的世界无疑是感知和满足我们需求的安全场所。机器间（M2M）通信技术实现了设备之间无需人工干预的自主联网。这种自主控制对于一系列物联网（IoT）的实施至关重要，包括智能制造应用、医疗保健系统和家庭自动化等。物联网因其追踪和影响环境的能力吸引了几乎每个人的关注。任何物联网系统的关键特征之一都是与其他设备连接并交换数据的能力。特别是物联网设备正利用无线网络与其他设备通信。在本次测试中，它告诉我们物联网技术如何与我们的生活交流。所提方法使用基于区块链技术的高效数据传输安全物联网模型（SIoTM-EDTB）在传输期间为数据提供安全。将所提模型与传统方法进行比较，结果表明所提模型具有更好的性能。\n\
  \n**关键词：** 攻击、区块链、数据丢失、数据传输、安全模型。\n\n* 通讯作者 Vejendla Lakshman Narayana: Vignan’s\
  \ Nirula Institute of Technology & Science for Women, Peda Palakaluru, Guntur-522009,\
  \ Andhra Pradesh, India; E-mail: lakshmanv58@vignannirula.org\n\n## 1. 引言\n\n物联网是一种新的计算范式，旨在将普通的日常物品变为智能。物联网被描述为当今变革性创新之一，它将改变我们对周围环境变化的视觉、解释和反应。无处不在且广泛的计算、集成设备、通信、传感器网络以及基于互联网的协议的进步，为普通设备中物联网的开发和实现提供了基础\
  \ [1]。因此，这些技术通常被称为赋能物联网的技术 [2]。作者研究了物联网设备中广泛使用的不同无线通信技术，并特别关注它们的特性、能力、优势和问题。\n\n\
  物联网范式并不是一种新技术，而是结合了 20 个国家的方法，这些方法受益于半导体、网络和信息处理的研究进展 [3]。如果你能够获取数据中心，你就可以使用物联网产生以环境为中心的数据，并将其传输到另一个设备或云端，在云端对其进行处理和挖掘以提取秘密知识\
  \ [4]。如果你能够接受数据中心，你可以使用物联网创建新设备以及新的物理对象。这将实现新技术和应用的创建。在促进物联网设备与门户之间的无线共享，然后通过互联网连接到远程存储库的过程中，机器间（M2M）通信技术发挥着至关重要的作用。\n\
  \n物联网因其追踪和影响环境的能力吸引了几乎每个人的关注。任何物联网系统的关键特征之一都是与其他设备连接并交换数据的能力。特别是物联网设备正利用无线网络与其他设备通信。在本次测试中，它告诉我们物联网技术如何与我们的生活交流。所提方法使用基于区块链技术的高效数据传输安全物联网模型（SIoTM-EDTB）在传输期间为数据提供安全。将所提模型与传统方法进行比较，结果表明所提模型具有更好的性能。\n\
  \n物联网是互联网的扩展。互联网仍然是核心概念。与互联网不同，不仅有电脑和服务器，甚至内置传感器也可以被视为单元。区块是主要原理。每个新区块都包含对上一次交易的引用。区块在计算上难以构建，需要多个专用处理器和大量时间。\n\
  \n所提模型引入了基于区块链的高效数据传输安全物联网模型。在所提模型中，由于使用了区块链技术来锁定数据，数据传输是安全的，同时节点的行为也得到了监控。\n\n\
  ## 2. 文献综述\n\nBedogni 等人提出了一种用于绿色智慧城市的新无线通信系统 [6]。由于物联网设备被用于规划、制造信息以及监控家庭的能源供给，物联网在他们的规划中起着关键作用。尽管其主要目标不是为了分析物联网中使用的通信系统，但由于这些系统在最终实施中起了主要作用，因此对它们进行了评估。该工作中进行的评估相当表面，重点不在于接触，而是无线功率的传输。\n\
  \n该研究检查了蜂窝网络、短距离多跳技术和低功率广域网（LPWA）技术等系统，以便用于智慧城市实施。这些通信技术的主要缺点是在受限领域无法大规模应用 [16]。研究还建议，可以通过各种网络优化方法解决这些限制，包括小区缩放、异构网络（HetNets）实施和感知感知内容交付。\n\
  \n\n\n\n\n该调查与我们的研究相似，尽管其主题有很大不同，因为它主要基于细胞技术，并详细研究了 5G 的尖端标准；相比之下，我们的工作为 M2M（机器机器）场景提供了一种更通用的分类（例如从短距离\
  \ 110 和毛细管技术的角度）。数据传感器管理和信息提取在第二组 `[20][22]` 中非常重要。\n\n业界一直在仔细研究和分类工业环境感知技术及应用，范围涵盖从本地化产品到制造和医疗健康\
  \ `[23][25] \\ `。众感知技术正在物联网（IoT）、环境感知计算和移动设备的融合领域中进行探索。\n\n## 3. 提出的模型\n\n区块链——一种去中心化的分发账——是一种能够解决物联网安全挑战的突破性技术。基于区块链的物联网方法将解决当前模型面临的许多问题并提高安全性。\n\
  \n作为对抗物联网网络威胁的重要工具，区块链具有以下特征。\n\n### 3.1. 去中心化\n\n数据存储在区块链账本的全球各个节点上，防止了单点故障。每个节点在向网络添加任何数据之前都必须接受并验证它。因此，在没有所有网络参与者普遍批准的情况下不允许任何更改。这种方法被称为点对通信，旨在确保区块链交易不被恶意方破坏。如果黑客记录数据并从服务器发送到计算机，由于没有单一服务器，因此不存在个人执行中间人攻击的风险。\n\
  \n### 3.2. 媒体连接\n\n区块链是公开的，并对网络上的所有人开放。存储的区块和交易的共同历史可以被所有网络参与者看到，但访问需要私钥。这在维护数据安全的同时，提供了对所有活动的完全访问权限。如果一条信息存储在区块链中，它无法被更改。\n\
  \n### 3.3. 安全信息\n\n为了保护数据，区块链私有地使用了先进的加密算法。这样做主要是为了确保财务活动没有风险。物联网设备可以像金融交易那样发送和接收信息，利用区块链模型实现连接对象之间的数据通信。\n\
  \n物联网的安全性是一个重大的隐私问题。数据的自由互联网访问允许用户在未经其同意的情况下，被监控机构收集和监控。物联网的近期增长很容易通过数据收集活动导致不理想的情况。一种可行的解决方案是让用户能够控制自己的数据并确保机密性。这松地定义了这些程序为了正常运行或在所有情况下需要多少数据，实际上是由客户同意的。另一方面，在我们的环境中，物联网设备经常通过未经用户许可就收集信息来滥用这一概念。\n\
  \n因此，需要对隐私进行更大的保护以维护物联网用户个人信息的隐私。一种限制用户接触以共享所需最少信息的新解决方案是“委托方法”。让消费者在平台上找到最符合其偏好的人，而不是与其偏好对应。\n\
  \n为了向所有人揭示这一知识。另一个正在进行的概念是隐私教练，该概念的核心在于一个可以扫描和检索嵌入设备标签的系统。如果对象的隐私策略与用户的偏好不符，用户将拒绝使用该对象。在其他情况下，扫描项目会显式地传输其隐私策略并请求用户的同意。隐私教练将充当物理空间、恶意且非希望扫描的防御机制。\n\
  \n各种攻击形式基于 Cisco 模型，因为它是一个与 ISO / OSI 模型非常相似的通用模型。下提到的攻击可以实施，并对智能家居设备带来真正的挑战。\n\n\
  ### 3.4. 边缘节点攻击\n\n本节提供了针对参考模型第一层（包括节点在内）的不同攻击的深度概述。\n\n### 3.5. 拒绝服务\n\n拒绝服务攻击，简称为\
  \ `do-s`，通常是一种攻击，通常会泛洪流量驱动的服务器、设备或网络，导致受害者的资源过载并防止合法用户使用。在物联网世界中，DoS 可能是针对边缘计算节点的种不同攻击。\n\
  \n**耗电攻击**：物联网设备的尺寸限制导致了微小且容量有限的电池。耗电攻击已成为一种强大的工具，间接导致了如节点故障和功能失效等严重后果。例如，如果入侵者发现了耗尽智能\
  \ SMD 探测器电池的方法，整个火灾报警系统将被禁用。如果此类系统中没有电池可以更换或充电，攻击者可以导致网络中的节点被毁。这可以通过向节点发送大量任意流量并强制其执行控制操作（如身份验证和数据包校验和）来实现。\n\
  \n**剥夺睡眠**：是一种特定的 DoS 攻击，与针对节点电池的耗电攻击模糊相似。能量容量有限的电池供电设备容易受到这种攻击。攻击者及时发送有效数量的请求以避免睡眠或触发节点功能。电池驱动的攻击由于数据包是真实的，因此更难检测。外部攻击是停止边缘节点并强制停机最常见的\
  \ DoS 类型。它阻止机器正常运行，并在某些情况下完全关闭操作。这可能是由于意外的制造错误、上述电池攻击、未经授权的设备物理访问或代码注入。Stuxnet 插入了恶意代码，规避了伊朗在紧急状态下无法关闭的异常行为，这是一个失败攻击的已知示例。\n\
  \n### 3.6. 强节点管理\n\n物理访问网络是进一步攻击的开启。直接节点操纵攻击可以根据攻击节点的操作类型分为两类。每种攻击都可能造成严重损害，并通常导致网络性能大幅下降。节点复制是一种攻击类型，攻击者通过向现有节点集添加新节点来复制节点标识符。新添加的节点通常是恶意的，这使得攻击者很容易腐改或重定向复制数据包。这种攻击允许攻击者访问加密共享密钥，或者通过执行节点撤销协议重新定位对有效和授权节点的访问。\n\
  \n伪装攻击用于插入或打击被接受在边缘的节点。这种恶意节点在正常模式下运行，即识别为活跃的数据包会被接收、处理或返回。被动模式仅执行流量分析和数据收集。节点功能已被定义。节点损坏是一种未经授权访问底层节点网络的常见攻击。插入到网络中的恶意节点将获得访问其他节点的权限，从而让攻击者控制整个系统。恶意节点还可能被用于在设备中插入虚假数据或防止真实消息的传输。\n\
  \n\n\n\n路由过程中的攻击关注的是数据包如何路由到通信层。攻击者可以通过此类攻击伪造、重定向、误导或完全从网络中丢弃数据包。路由信息可以被简单修改以创建路由环路或错误消息。路由攻击可以进一步分为几个不同的类别。\n\
  \n灰洞攻击（Gray Hole Attack）被称为攻击的一种变体，节点选择性地丢弃某些包。虫洞攻击（Wormhole attacks）比黑洞和灰洞攻击危险得多，因为即使在具有真实性和秘密性的通信中，它们也可以执行。这种攻击的核心是接收包并将其隧道到网络中的另一个位置。基本上，虫洞节点在网络中创建了一种比原始路径的路径。因此，隧道必须是快速连接，以产生两个虫洞节点非常接近的幻象。\n\
  \n### 3.8. 物联网区块链解决方案\n\n需要注意的是，特别是当全球 P2P 框架跨越整个物联网生态系统发展时，上述机制（P2P 网络参与、对接受的 P2P\
  \ 协议的支持、节点功能背书、对共识算法的支持、`PoW` 以及其他相关机制）变得相当复杂。由于第 2 节中指出的物联网节点的传统局限性，在物联网通用框架内使用完整的区块链网络可能并不可行；然而，某些关键或机构级应用如智能电网、智能交通系统\
  \ ITS、电子健康、保险或智能合约环境可能有足够的容量支持所需的 P2P 功能。另一种方案是建立有限本地范围的 P2P 网络，而不是全局网络；这需要较少的集中带宽，并对所支持的消息——查找、交易查询、调用、同步和共识——在大网络中实现稳定分布提供深远的保障。\n\
  \n### 网关阶段：\n\n单个用户生成的数据并不总是受到完整性保护，但一旦数据进入网关，它将与其他用户的数据一起整合到区块链中。\n\n### 图像场景：\n\
  \n这是一个典型的案例。原因之一是单个终端节点没有计算能力来为（可能是大型）数据块生成哈希值。\n\n### 标准网站：\n\n在这种情况下，个人网站用户（例如地板上的传感器或机器人）产生的数据不会自动受到系统完整性的保护。然而，一旦数据进入本地焦点节点（例如二层交换机、Wi-Fi\
  \ 连接点、路由器、防火墙等），数据将与该网站其他用户的信息一起整合到区块链中。这种方法的原因之一是单个终端节点无法计算（可能是大型）数据块，但基于场地的边缘节点（NE）将能够计算。\n\
  \n### 3.9. 基于区块链技术的强效物联网保护\n\n为了物联网的稳定应用，应该考虑以下几点。\n\n### 3.9.1. 安全通信\n\n为了处理交易，物联网设备必须进行通信并将其保存在仓库中。账本也可用于存储加密密钥以确保传输安全。加密消息通过目标设备的公钥发送到物联网系统，然后保存在区块链网络上。发送者随后请求其节点从标题中获取接收者的公钥。然后传输器使用接收者的公钥加密消息，因此只有接收者可以使用其私钥解密消息。\n\
  \n#### 3.9.2. 消费者身份验证\n\n在发送给其他用户之前，发送者将对消息进行数字签名。为了验证接收到的信的数字签名，接收者将从账本获取公钥。以下是数字签名的工作：\n\
  \n* 发送者计算私钥加密消息的哈希。\n* 消息将同数字签名一起发送。\n* 接收者将通过存储在目录中的发送者公钥解密数字签名，以检索发送者的哈希值。\n*\
  \ 只有当哈希值与测量的消息哈希一致时，消息才是真实的。\n* 如果每个发送者的数字签名都存储在目录中，恢复的可靠性将增强。\n\n#### 3.9.3. 寻找广泛的合法物联网\n\
  \n一旦引入新的物联网系统，根服务器就会请求网络上的可信节点列表。然后该计算机在节点中注册，并开始信息交换。为了确保根服务器名称解析的安全，必须引入 `DNSSec`\
  \ 以防止伪造攻击。任何连接都必须经过有效的身份验证和加密。这可以基于以下几点：\n\n* 凭证在计算机配置期间已挂载。\n* 物联网设备所有者可以发布凭证。\n\
  \n#### 3.9.4. IoT 配置\n\n区块链技术极大有助于构建安全可靠的物联网设备设置。在这方面看似重要的方法包括：\n\n* 在账本上，你可以托管物联网特性，例如设置数据和经过验证的固件的最新版本。在启动期间，你的区块链节点必须从账本进行设置。设置需要在小册中加密，以确保公共账本中包含的信息不会发现物联网的拓扑结构或其属性。\n\
  * 每个设备的哈希值可以存储在最新配置文件的账本中。物联网设备可以在每个固定时间间隔使用云服务下载最新且最可信的配置文件。应用程序可以通过区块链节点 `API`\
  \ 检索并匹配存储在数据库中的哈希值。因此，管理员能够定期卸载错误的设置，并使用最新、最可信的设置重启网络上的所有物联网系统。\n* 使用区块链网络保护物联网是一个去中心化的系统，没有单一权威可以批准任何交易。不断增长的数据链副本将来自每台计算机。这意味着每当有人想要访问系统并进行交易时，所有网络成员都必须验证。交易被放入块中并在确认后转发到网络上的所有节点。这一切确保了未经授权的源不会违反安全性并使系统更安全。\n\
  \n## 4. 结果\n\n提出的模型使用 `NS2` 仿真器实现，创建用于安全数据传输的物联网节点。提出的模型引入了一种使用区块链技术进行高效数据传输的安全物联网模型。将该模型与传统模型进行比较，结果显示该模型在使用区块链技术传输数据方面表现出更好的安全性。在数据传输率、安全性、攻击识别水平、准确率水平和吞吐量方面，该模型与传统模型进行了比较。创建物联网仿真所使用的参数如表\
  \ 1 所示。\n\n表 1 **使用的参数。**\n\n| 节点数量 | 50,100..300 |\n| --- | --- |\n| 区域大小 | 500\
  \ X 500 |\n| MAC | 802.11 |\n| 仿真时间 | 200 sec |\n| 流量源 | CBR |\n| 包大小 | 512 |\n\
  | 发射功率 | 1.500w |\n| 接收功率 | 0.675w |\n| 传输范围 | 100m |\n| Sink 数量 | 5 |\n\n\n\n\n\
  [content]\n\n所提模型与传统可信节点传输方法（TTNTM）的数据传输率如图（1）所示）所示。与现有方法相比，所提模型的数据传输率较高。由于所提模型仅考虑授权节点，因此其数据传输率很高。所有节点都会将数据传输到其邻居节点，而不会导致任何数据丢失。所提模型使用区块链记录所有数据传输实例，然后通过分析生成的区块来识别恶意节点。\n\
  \n![](img/9781681088624-C8_F1.jpg) **图 (1)**\n\n数据传输率。\n\n所提模型使用区块链技术记录已完成的交易。由于使用了区块链，与现有方法相比，所提模型的安全性更高。当区块被创建时，交易就会被记录且具有不可篡改性。没有修改其内容的机会。所有生成的区块相互链联。所提方法与现有方法的安全性级别如图（2）所示。\n\
  \n![](img/9781681088624-C8_F2.jpg) **图 (2)**\n\n安全性级别。![](img/9781681088624-C8_F3.jpg)\
  \ **图 (3)**\n\n攻击识别级别。\n\n由于物联网（IoT）正经历多种攻击，区块链模型被用于高效识别攻击以及攻击发生的地点。所提模型的攻击识别级别高于所提模型。在所提模型中，每笔交易都会生成区块，并对其进行分析以识别节点行为。区块值显示了哪些节点正在导致数据丢失，恶意行为节点可以很容易被识别。攻击识别级别如图（3）所示。\n\
  \n![](img/9781681088624-C8_F4.jpg) **图 (4)**\n\n准确率级别。![](img/9781681088624-C8_F5.jpg)\
  \ **图 (5)**\n\n吞吐量。\n\n在每次数据传输成功后，区块链将记录每笔交易直到过程完成。所提模型的准确率级别如图（4）所示。所提模型的准确率高于现有方法。所提节点可以识别恶意节点，从而提高数据传输率。恶意节点不被允许参与传输。\n\
  \n所提模型的系统利用率也很高，因为所提模型使用了物联网节点，并利用区块链来记录交易。所提方法与现有方法的吞吐量级别如图（5）所示。所提模型利用生成的区块分析节点的数据接收和发送速率。所提模型移除了恶意节点，从而确保了高数据传输准确率。\n\
  \n## 结论\n\n物联网是人们采取的关键路径。一些大型公司已开始为我们的日常生活提供各种服务，例如智能家居、健康监测等，旨在通过物联网提高人类的生活质量。这对于整个计算机科学技术来说是向前的一大步。然而，它具有两面性。有几个我们需要引起关注的问题。众所周知，物联网是互联网的下一个版本，但它完全聚焦于互联网。保护方面的考量仍应是一个需要研究的重要点。电信技术也限制了电信的增长。此外，我们应该关注延迟、传输成本等问题。文章中列出了物联网应用的一个示例。它解释了简单的物联网可能已经对人们的生活产生了影响。然而，应该关注未来的工作。认知物联网方法更为复杂，但观察物联网如何实现物联网的终极目标更具意义。创建一个真实的认知物联网框架应该被视为未来的一项任务。在未来，可以分配一个中央头节点来分析剩余节点，以减少网络中的复杂性和拥塞。\n\
