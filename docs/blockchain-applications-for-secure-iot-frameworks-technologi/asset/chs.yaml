  \ (访问于 2020 年 9 月 10 日)..\n\n# 基于物联网的智能家居节能\n\nSomya Goyal^(1, *), Sudhir K. Sharma^(2)\n\
  \n¹ 贾浦尔马尼帕尔大学，拉贾斯坦邦，贾浦尔和古鲁·贾姆什瓦尔科学技术大学，希萨尔，印度\n\n² 信息技术与管理学院，Janakpuri，新德里，印度\n\n\
  ## 摘要\n\n智能家居是工业 4.0 最具吸引力的应用之一。本研究提出了一种利用无线传感器网络（WSNs）实现智能家居节能的智能系统。所提工作旨在减少家居中的无形电力消耗。家居配备了`Arduino`、传感器和连接的`WSN`。该模型观察房屋区域内的活动，并通过无线网络（WN）连接的控制中心控制电源切断。为了检测运动，部署了被式红外（PIR）传感器。当`PIR`传感器检测到房间内有运动时，灯会自动开启；随后，如果在阈值时间后没有观察到运动，灯将自动关闭。通过这种方式，可以控制电力的浪费。实验结果表明，与没有任何此类智能控制的情况相比，所提模型可以将能耗降低多达\
  \ 40%。所提模型的验证表明，该系统是可行、有效的，且实施成本并不高。\n\n**关键词：** 节能，被动红外传感器 (PIR)，智能家居，无线传感器网络 (WSNs)。\n\
  \n***\n\n通讯作者 Somya Goyal: 贾浦尔马尼帕尔大学，拉贾斯坦邦，贾浦尔和古鲁·贾姆什瓦尔科学技术大学，希萨尔，印度；电话：+91-8168361767；邮箱：[somyagoyal1988@gmail.com]\n\
  \n## 1. 引言\n\n智能家居是指配备了利用远程遥器（智能手机等）运行的电气和电子设备的家居。它通过在区域内引入不同的传感器来监测环境，并从外部控制电子设备。智能家居也被称为家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。\n\
  \n### 1.1. 背景\n\n智能家居自动化依赖于`WSN`。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功，并且很容易部署。\n\
  \n### 1.2. 动机\n\n智能家居是一个家居自动化系统。它被证明在节约能源方面非常成功。\n\n### 1.3. 章节结构\n\n本章结构如下：第 2\
  \ 节探讨了智能家居的优点。随后第 3 节介绍了利用智能家居技术进行节能。第 4 节描述了工程和系统。第 5 节结合了与`ZIGBEE`标准的使用以及其他实现。第\
  \ 6 节介绍了物联网在文化遗产的应用。第 7 节通过对未来研究的建议结束了本部分。\n\n## 2. 智能家居的优点\n\n智能家居技术的多个层次优点可以总结如下（如图(1)所示）：\n\
  \n```\n图 1: 智能家居技术的优点\n```\n\n1. 从一个地方远程管理家中的设备提供了便利性，并且让所有机器通过一个接口连接起来是技术水平提升和家庭关联的一项重大改进。\n\
  \n2. 这一开发过程对于新设备和机器具有相应的灵活性。随着新设备和其他技术的发展，智能家居结构具有极强的适应性。\n\n3. 它最大化了家居安全性。当安全和监控功能集成到你的智能家居连接中，你的家居安全性可以得到提高。家居自动化系统可以通过整个家居连接探测器、监控摄像头、智能门锁和其他出色的安全设备。\n\
  \n4. 智能家居提高了能源效率。通过明智地使用智能家居，可以使普通功能更加节能。例如，通过可编程的智能室内控制器或灯光更好地控制家居的供暖和冷却，可以在进入或离开房间时自动开关。\n\
  \n5. 这种运动还改善了设备的便利性。智能家居可以帮助你更好地运行设备。一台智能电视将帮助你找到更好的应用程序和频道来发现你最喜欢的节目。综合来看，家居生活变得变得更加充实！\n\
  \n## 3. 智能家居与节能\n\n\n\n\n\n精明家居改进的一个重要部分是减少家庭能源消耗并提高家庭能源效率。一个出色的家居能够监测其电力使用情况，并通过改变生活方式来节省能源。智能家居不仅为执行者提供了高效的能源管理优势，还提供了其他优势，例如提高生活质量、安全性和健康。智能电表、家电器和家用机器人设备是可用于改变家庭用电模式的众多技术之一。\n\
  \n与传统结构相比，智能家居和智能建筑更有效地利用能源。传输智能家居技术对于减少能源消耗非常重要。研究了远程传感器网络在智能家居技术中的成功应用。事实上，`-Fi`\
  \ 被证明更适合用于远程监控和控制。智能家居执行能够对自然边界和人类行为做出反应。\n\n其目的是响应家庭居住者的行为并让家变得更加舒适。这种自动化系统涉及收集能源使用信息的传感器。这些智能系统与处理单元集成（如与云端连接），随后它们分析收集的信息以发现模式。根据这些模式，用户可以实现自动化。这直观地有助于降低开支，并提高他们对日常舒适的预期。它涵盖了家用应用，还包括如\
  \ `e-Governance`（电子治理）、`Health Care`（医疗保健）等开放空间。几乎没有任何模型整合了治亚理工学院感知家居实验室。截至目前，智能家居技术已有效收集数据并支持动态管理，使人们的生活方式更加舒适、更安全，包括捕捉气候边界并识别异常情况（如果有）的监测系统，最终保护居住者免受盗窃、入室和灾难性事件的影响。\n\
  \n### 3.1 历程回顾\n\n智能家居系统的主要部分包括（HVAC）供暖、通风和空调、照明控制或监控系统（包括存在模拟、警报触发和医疗报警）。通信标准有\
  \ `X10`、`Insteon`、`Zigbee` 和 `Z-Wave`。迄“智能家居”历程的成就包括：\n\n* 1966 年，第一个“家庭计算机”被设计为一个探索性系统。\n\
  * 1975 年，创建了 `X10` 用于通过电线线路对可用设备进行远程通信。\n* 20 世纪 80 年代，智能房屋项目作为美国住宅建筑商协会（NAHB）国家研究中心的一项任务启动。\n\
  * 随后，介绍了 `GSM` 技术，允许通过 PDA 或互联网对家庭及其设备进行远程控制。`GSM` 技术在自动化和安全应用中非常有价值。\n* 结果是利用 `SMS`\
  \ 功能创建了三种警报系统，特别是带有短信系统的家庭安全系统、安全控制系统，以及通过 `SMS` 进行的远程和安全控制。\n* 依赖 `GSM` 技术的系统是一种远程安全系统，通过\
  \ `SMS` 实现家庭设备自动化。\n* 如今，建筑或房屋被设计为安装智能风扇，这些风扇使用传感器、`IoT`、`WSNs` 和 `AI` 进行自动控制。\n\
  * 智能汽车停车通过安装的 `CCTVs` 实现。通过 `AI` 对视频片段进行自动扫描允许自动找到停车位。\n* 此外，能够控制功率消耗的智能家居系统能够识别人体流量和非生物体。它允许减少高达\
  \ 40% 的消耗。\n* 智能城市由一个互联的基础组成，通过通信和从关联中的枢纽收集关键信息以更增强的方式运行。根据这一理念，新加坡的智慧国家计划（Smart\
  \ Singapore, 2015）包含了各种技术来减少全国范围内的能源消耗，同时监控并收集来自每个关联购买者的信息，例如企业结构和家庭（Housing and\
  \ Development Board, 2014; IDA, 2014）。\n\n该计划通过主动和智能地规划“智能城市社区”并营造舒适安全的环境，来提高能源效率。此类建筑被赋予了对太阳能、水循环利用、`LEDs`\
  \ 的自动化控制。通过传感器收集有关流量的信息，并用于实现设备自动化。\n\n### 3.2 示例：智能系统\n\n1. 医疗保健 - 老人警报系统\n2. 家庭能源管理系统\
  \ (HEMS)\n3. 智能电表系统 (SESAME)\n\n### 3.2.1 医疗保健 - 老人警报系统\n\n这是一个配备了计算机系统的智能家居，将其连接到互联网并提供医疗服务。准备好的绪系统使家庭能够利用传感器和运动检测器（如图\
  \ `[3]` 所示）来监测老人。\n\n### 3.2.2 家庭能源管理系统 (HEMS)\n\n这是一个创建的智能系统（如图 (**4**) 所示），旨在帮助贷款持有者跟踪能源消耗并控制设备。`EMA\
  \ Singapore` 显示 HEMS 减少了 20% 的能源消耗。\n\n### 3.2.3 智能电表系统 (SESAME)\n\n`SESAME` 方案直接集成到家庭网络中，允许框架如图\
  \ (**5**) 所示开启或关闭设备。该框架还准备好识别来自温度、湿度或不同传感器的信号，并根据确定的设计控制设备。\n\n\n\n\n\n这种集中化框架的核心是“中央智能管理系统”。该中央管理系统由两个子组件组成——中央控制单元\
  \ (CCU) 和中央专用软件 (CDS)。`CCU` 负责数据聚合和决策核心组件。它处理系统内部涉及的所有实体。它负责所有的实时信息处理并提供决策支持。它还执行算法来预测智能家居环境（SHEs）的能耗，并且在减少能耗方面起着关键作用。\n\
  \n该架构中各个组件之间的通信由特定的外围设备予以保障。例如——`CMS` 与家电（如冰箱）之间的通信。这种特定的外围设备被称为“智能插座”。之所以这样命名，是因为它为普通电器增加了智能功能并将其接入到连接网络（互联网）。智能插座还会在电器上运行能量控制任务。它可以在监测能源利用设计的同时监测机器的状态。额外的能量控制功能由“智能盒”（brilliant\
  \ box）强制执行。这些设备用于检查机器，同时控制设备装置的启动和取消。该工程包含一个名为“UI”的重要组件，允许通过定制的基于 Web 的应用程序以及额外的多功能应用程序与客户端连接。\n\
  \n### 4.1. SHE 智能家居 CMS 中的数据流与管理\n\n该工程集成了一组传感器来收集信息、精密的附件以及敏锐的盒子来运行复杂的逻辑。在这种情况下，流经框架的信息和数据量是巨大的，这需要适当的信息库和执行框架来充分利用可用数据和互操作性（如图\
  \ (**7**）所示）。\n\n之所以需要这些信息，是因为执行框架必须管理数据从信息收集、信息翻译到动态过程的演进。有效利用信息以帮助实现减少用能消耗和提高\
  \ SHEs 舒适度的目标，是通过来自控制板框架的数据来实现的。事实上，从用户的角度来看，这种管理框架也是极具吸引力的。\n\n`CMS` 是一个中间件网关，通过与智能盒、智能插座、传感器、执行器等的连接，从智能家居环境收集信息。信息收集后，它们被保存在信息库中。从该存储库中，信息被提取并处理，以决定设备的启动/停止、评估居住者的用能模式、侦测等。\n\
  \n控制板框架上的信息是整个设计的大脑，它存储了产生对智能家居整体认知的数据。测量模型对于预测能源需求同样重要，并因此自然地预订高效能的机器。\n\n![](img/9781681088624-C4_F7.jpg)**图\
  \ (7))**  \n\n流经框架的信息流。\n\n### 5. 使用 Zigbee 实现智能家居\n\n本部分介绍了 `SHE` 与 `Zigbee` 的应用。目标是轻松为智能家居中的执行器提供能量。它提供了对家庭电器的远程管理和控制。它有助于通过物联网（IoT）对远程区域的家庭进行持续稳定的监控，以减少消耗。它允许根据能源需求重新安排用户的工作时间。它包含一个\
  \ PIR 传感器，以自动实现灯光的启动/停止，从而节能。\n\n### 5.1. 智能家居控制系统\n\n框架包含 3 个重要模块：数据采集模块、通信模块和设备控制模块，如图\
  \ (**8**）所示。\n\n![](img/9781681088624-C4_F8.jpg)**图 (8))**\n\n\n\n\n\n# 文化遗产\n\n\
  文化遗产描绘了国家和地区的本土文化，这些文化通过艺术品、语言或建筑属性得以体现。`CH` 需要为后世留存，因为它因为它承载了代代相传的内在属性、价值、道德和特征。如果发生损坏，可能会导致无法修复的严重损失。`CH`\
  \ 是一项巨大的资源，因为它根据文物和本土文化吸引了游客。选择特定旅游目的地的动力是其艺术和文化遗产方面的内在属性，包括纪念碑、博物馆、展览、历史村庄等。这些艺术品的保护是一个需要特别关注的问题，因为时间会导致遗产的自然老化，而这正是需要对\
  \ `CH` 进行保护的原因。随着时间的推移，气候、人类、天气条件等外部因素以及材料等内部原因会对遗产产生负面影响并造成损坏。\n\n# IoT 实施目标\n\n\
  目标是实施 IoT 概念，通过在管理部门的完全控制下提供稳定的环境，以保护 `CH`。这种控制场景将通过智能家居概念来实现。它为保护遗产所在的环境提供持续的监测和规范化。\n\
  \n对于某些易氧化或对光敏感的建筑、纪念碑或文物来说，完全控制下的稳定大气环境是必要的。\n\n## 监测与控制系统\n\n通过对气候（包括温度和湿度）进行适当的监测和控制建立这样的控制环境。这种气候控制系统需要传感器记录气候状况的数据，并需要微控制器来控制文物周围的环境。这是通过\
  \ IoT 架构实现的，该架构有助于评估艺术品的损坏风险。这种网络安排有助于定期检查，累积的数据记录允许预测和处理事故。远程监测和在线控制能够保护和维护艺术品。它减少了蓄意破坏、盗窃或意外损坏的风险。\n\
  \n## 文化遗产中的 IoT\n\n处理 `CH` 的 IoT 将艺术品视为需要保护的“物体”。第一步是安装传感器节点以收集实时数据，并安装网关将数据传输到云端。整个设置允许对特定的\
  \ `CH` 进行在线、实时、持续的监测和监督。云端提供了方便访问收集和分析的数据的数据，提高了该艺术品的安全性。\n\n通过传感器收集的信息对于策展人和当局发现最危险的风险及其因素具有价值。在确定了风险最高的恶化情况后，可以制定战略计划并实施后续行动。UPV\
  \ 已经启动了一个使用 IoT 保护 `CH` 的多学科项目。该项目由来自艺术修复、气候监测、统计学、无线通信、云工程师等专家组成 [17]19]。\n\n#\
  \ 项目设计与需求\n\n对于特定项目，遵循保护特定 `CH` 的需求声明，第一步是设计用于数据传输的特定节点，这些节点必须能够以最低维护监测气候，如图（10）所示。在\
  \ IoT 实施中设计合适的节点是最关键的问题。它涵盖了通过考虑通信距离来最大限地减少功耗。\n\n![](img/9781681088624-C4_F10.jpg)\
  \ **图 (10)**\n\n带有传感器和网关的 IoT 设计。![](img/9781681088624-C4_F11.jpg) **图 (11)**\n\n\
  Sigfox 实施示例。\n\n到目前为止，尚未实现理想用法，但可以与有效实施的原则建立联系。通过与以前存在的安排建立联系，可以改进新的用法。这些领域两个著名的名称是——LoRa\
  \ [20] 和 Sigfox [21]。\n\n# 未来工作与实施\n\nLoRa [22] 和 Sigfox [23]，如图（10）所示。\n\n1. ![](img/9781681088624-C4_F12.jpg)\
