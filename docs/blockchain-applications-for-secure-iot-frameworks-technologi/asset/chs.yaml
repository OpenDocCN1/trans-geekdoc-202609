  # 基于区块链的增长理念培养：一种新的农学\n\nVishakha [1], Nikhil Sharma [2], Bharat Bhushan [3], Ila\
  \ Kaushik [4]\n\n¹ 印度德里 HMR 技术与管理学院\n² 印度大格拉诺伊谢尔达大学工程与技术学院\n³ 印度北方邦德特加齐亚巴德克里希纳工程与技术学院\n\
  ⁴ 印度勒克瑙积分分大学技术学院计算机科学与工程系\n\n## 摘要\n\n 营养与食物的发展是国家实现繁荣和福利的基本需求。农业是开发植物和牲畜的科学与专门。农业企业需要付出大量努力来维持并建立消费者对质量的信任。基于区块链的农业通过其获取透明的能力为农业企业提供了保障。低成本农业保险计划越来越多被视为为受洪水或旱灾影响的人提供社会保障的工具。在减轻影响方面，它们在这些事件发生时持续存在。因此，本章介绍了区块链技术概念、广泛的文献综述，包括对营养领域区块链发展的回顾。本章展示了各种机会以及区块链如何运行的理想架构。\n\
  \n**关键词：** 农业企业、农业、区块链、农业保险、食品安全、农产品物联网、物联网、营养供应链、智能农业、智能合约、供应链、追溯、交易成本、水下渔业。\n\n\
  ## 1. 引言\n\n除了加密货币，区块链展现了广泛的应用。区块链领域的创新无疑正在改变从银行到医疗以及房地产在内的许多行业。目前正在进行将其应用于农业领域的研究工作。随着物联网应用的发展，技术领域以及金融部门在评估水质、土壤和空气质量的生态监测应用方面获得了巨大增长。根据计算，2020\
  \ 年 4 月的全球人口为 78 亿。\n\n\n\n\n2014-15 年的研究显示，成人的热量欲望比 1975-76 年的成人高出 6.1%。对食物需求的增加对环境产生了显著影响，结果导致了许多物种的生存威胁。由于高食物需求对环境造成的破坏表现为森林砍伐、碳排放水平升高等形式。如果食品供链能够得到有效组织，就具有减少碳足迹和环境危害的潜力，从而将保障食品安全\
  \ [1]。在目前的食品供应链中，从生产到消费涉及多个多个利益相关者，这使得局面难以获取实际的步进式数据进行分析。报告显示，在农业耕作活动中，各个环节都会产生大量的碳。在美国，据估计在导致温室气体产生的所有因素中，只有食品运输对排放的贡献占\
  \ 11%。据观察，到 2050 年，食品产量必须翻倍才能满足每个个体的营养需求 [2]。\n\n由于食物摄入相关疾病病例的增加，现在消费者想要了解有关其食品及其他详细信息。人们对现有食品系统的依赖程度很低。区块链为这些问题提供了令人兴奋的解决方案。它为每个环节提供永久的证据，这些证据随后被排列成不同的区块，且无法对其进行任何更改。它还有助于取代那些物理追踪和监控实体，以防止传统供应链产生不准确的影响\
  \ [3]。供应链追踪是保护食品安全最重要的措施，能够确保食品免受恶意漏洞的影响并鼓励食品认证。\n\n`LetsFarm` 是一家利用人工智能进行计算机推理的初创公司，旨在为全球牧场主提供服务。它利用透明的工具和技术将农民联系起来，让他们可以在任何地方获取所需的数据。适当的数据可以帮助农民增加产量，并从他们开发的收获中获得更高的报酬。`LetsFarm`\
  \ 同样通过提供关键数据和增加农民家庭的收入来为农民提供额外薪水。毕竟，牧场主的整体增长就是整个国家的全面进步！荷兰农业、自然和食品质量部资助了主要的研究项目“农食品区块链”，该项目旨在研究区块链在农食品领域的建议。试点研究表明，区块链创新使得食品从农场到市场的追踪仅需几秒钟\
  \ [4]。区块链还协助监控底层物品，并减少非法采集和交付欺诈的发生。联合国发现，由于非法交易，食品造假每年给全球经济造成约 400 亿美元的损失。许多进步源于创业企业，农村部门也不例外。`Ripe.io`\
  \ 和 `Pavo Coin` 是两个在供应链中使用区块链的现有商业模式 [5]。\n\n\n\nRipe.io 是一家位于旧金山的新兴企业。Ripe.io 围绕农业展开，为客户提供更高水平的透明度。Ripo.io\
  \ 创建的框架可以区分物品的湿度、成熟度和温度。通过这种方式，农户可以获得有关物品状态的数据。\n\n区块链实现去中心化在本质上并非完全是技术，而是技术手段与智能工程激励的结合。它始于\
  \ 2008 年，中本聪（Satoshi Nakamoto，其真实身份至今无人为人知）发布了一份白皮书，引入了一种纯点对点形式的加密货币，名为 `bitcoin`。区块链有四类，分别称为私有链、公有链、联盟链以及最后一种——混合链。\n\
  \n在私有链中，访问权限受到控制，只有少数用户有权查看和验证交易。它被用于数据安全是首要考虑的服务 [6]。公链是对所有人开放的，尽管交易是匿的。对于拥有账本查看权限的人来说，交易是透明的。联盟链由一个小组或联盟运营，只有该小组的成员才有访问权限。混合链指的是使用公链但也托管私有链的系统。虽然数据存储在公有链上，但数据隐私不会被侵犯。\n\
  \n节点对于诚实行为会获得一种激励。`bitcoin` 中有两种激励机制，一种是区块奖励，另一种是交易支付。在区块链创建区块的服务过程中，最初，区块创建者会在区块中包含特殊代币交易的生成，然后选择该协议的接收者地址。只有当区块在长期共识分支上结束时，区块制作者才有获得奖励的机会。在区块链中，区块奖励的价值每四年减半一次。区块奖励是产生新\
  \ `bitcoins` 的方式，据估计它将在 2140 年耗尽。如果这一标准保持不变，将不会有新的 `bitcoins` 产生。在交易费用方面，交易创建者可以决定使代币的收益估计低于输入价值，剩余金额将作为交易费用支付给区块创建者并放在共识分支上\
  \ [7]。\n\n这些方法与许多问题相关，例如如何为每笔交易选择随机接点，或者如何防止每个节点运行 `bitcoin` 节点来收集奖励。为了改进这一点，现在\
  \ `bitcoins` 通过共识机制的过程产生，这包含了各种过程，如 `PoW`、`PoS`、`DPoS` 和 `PBFT`。在工作证明 (`PoW`) 过程中，先找到哈希值的\
  \ `bitcoin` 矿工将被允许向区块链包含另一个新的交换区块。在权益证明 (`PoS`) 机制中，利益者持有的代币越多，他们就越可能向区块链添加新的交换区块。在委托权益证明\
  \ (`DPOS`) 中，代币持有者可以使用他们的余额选择一组节点允许向区块链添加新交易区块。实用拜占庭容错 (`PBFT`) 依赖节点数量来确认信任。当获得足够的反馈（通常为\
  \ 51%）时，交易被声明为有效交易。\n\n区块链中主要有两个重要的术语，即共识机制和智能合约，在研究它们在农业领域的应用之前需要理解这些术语。\n\n###\
  \ 共识机制\n共识机制是一种保证对数据点达成共同一致的方法。系统网格中的每个顶点都有相似记录（账本）的副本。它本质上是安全的，是一种加密协议的经济框架。共识机制的目标包括寻求一致、协作、合作、包容性和参与。共识有三个基本步骤，第一步是背书，它决定是否接受交易。然后是排序，将所有交易在指定期间内排序成序列。最后是验证，即验证背书策略。\n\
  \n### 智能合约\n智能合约也称为自动执行合约，是一种计算机约定，它通过避免中间人交互以数字方式促进、检查或维护协议的呈现，并在存储区块链的所有对点的去中心化平台上对其进行验证。它被用于货币、股票等的交换。它本质上是自我验证、自动执行的并且对任何变化具有抵抗力。它将法律义务转化为自动化。由于不涉及第三方费用，它更便宜。它保证了更高程度的安全性。\n\
  \n章的其他章节安排如下：第 2 节介绍文献综述，第 3 节描述了区块链技术在农业领域的不同机会，第 4 节讨论了区块链在农业中的应用，第 5 节阐述了案例，第\
  \ 6 节解释了农业中基于区块链的架构及挑战，最后是第 7 节的结论。\n\n## 2. 文献综述\n\n在传统系统中，种子公司生产根据全球标准识别的种子并更新本地记录。农民购买种子，收获作物，并将其送到谷物升降机，那里将生产的作物储存在不同的仓库中。各种谷物加工商从仓库购买谷物并对其进行精制以做出成品。然后分销商拿这些成品并卖给零售商，零售商进一步以小可识别数量将产品卖给客户\
  \ [8]。印度农业可以分为几个阶段，如生产、供应链、加工和营销。图 (1) 表示了链中的各个阶段，这些阶段会导致信贷风险，并由于生产阶段的投入不足和过时的农业政策、供应阶段的高损耗和运输不便以及许多中间商而限制了信贷的流动。\n\
  \n```\n![](img/9781681088624-C10_F1.jpg```\n**图 (1)**\n\n供应链的阶段。\n\n买家需要知道食物的来源，他们甚至可以支付更多来获取有关食品的所有信息。他们可以看到食品认证，但正如目前的系统所示，常规确认可能会伪造。然而，区块链本质上的不可篡改性使得很难微妙地更改任何记录，如日期和成分。只需扫描二维码，购物即可获得有关食物的所有数据——例如生产使用了什么种种子、过程中使用了哪些农药、在商店放置了多久等。同样，它也可用于肉类用途，以了解准确的时间、它在什么环境下生存、患过什么疾病等。只需点击一下，所有必要信息将到达消费者\
  \ [9]。\n\n\n\n全球劳动力人口估计为 46%，其中仅农业部门占全球货币价值的 8.4%，其总产出值为 9,084,800 百万。区块链提供了安全的信息交易环境，并为这些报告和交付事件提供了一个精心设计的存储库，这将节省因数据误读而浪费的数十亿美元。马士基（Maersk）和国际机械（IBM）正在利用区块链技术构建一个全球性的精心设计框架，以实现交换工作流程的数字化并进行端到端追踪，消除包括昂贵的点对通信在内的繁琐环节\
  \ [10]。\n\n在农业领域，印度是世界上作为生产目的主要国家之一。在所有部门中，印度的第一产业对经济的贡献巨大，尽管由于工业和其他商业部门的不断演变，该比例已下降到\
  \ 15%。图（(2)）显示了印度可用地的划分。印度是全球最大的农产品生产国第二，估算的耕作产量为 3.147 亿吨。印度的园艺总产值估计为 385.4 亿美元\
  \ [11]。\n\n![](img/9781681088624-C10_F2.jpg) **图 (2)**\n\n印度的土地分布。\n\n在 2017-18\
  \ 产年度，粮食产量创了 2.8483 亿吨的纪录。印度政府正致力于在 2021 年实现 2.872 亿吨产量的目标。图（(3)）显示了印度某些州的作物分布，很明显，小麦、棉花、水稻、花生和芥末是一些主要作物。机器学习概念与区块链创新的结合将将在未来几年内推动经济增长\
  \ [12]。\n\n如图（(4)）所示，甘蔗作物是印度所有作物中产量最高的。特定作物的进口或出口主要取决于特定地区的种植过程和产量。由于中间件问题，农业实践中损失了大量资金，现在是时候将区块链技术与农业部门技术相结合了\
  \ [13]。\n\n![](img/9781681088624-C10_F3.jpg) **图 (3)**\n\n印度几个州的作物分布。![](img/9781681088624-C10_F4.jpg)\
  \ **图 (4)**\n\n印度的按作物产量。\n\n\n\n\n\n利用区块链创新来实现食品市场的多方面化管理是政府的关注点，通过安排食品展会的行政记录来展示交换数据。这可以有效解决食品管理流程中的问题。根据对重要政府部门的理解，食品生产网络对政府行政专家有几项需求。第一项是精确收集食品货链网络中所有环节的数据，然后恢复从种植（养殖）到整个使用过程中关于食品生产网络的社会活动和能力的信息。这些需求与区块链的机械特性相契合，区块链可以存储每次交易的数据。\n\
  \nTian 在 `[14]` 中研究了区块链和 `RFID` 在农业供应链追溯性方面的优缺点。Tian *et al.* `[15]` 提出了一种依赖关键节点风险检测和控制的食品生产网络，该网络利用了\
  \ `IoT` 和区块链。Caro *et al.* `[16]` 代表了 `Agri Block IoT`，这是一种基于区块链的可追溯性方案，整合了沿供应链中各种连接\
  \ `IoT` 设备的信息。他们建立了一个从农场到消费状态的农产品追溯应用用例，并通过 `Hyperledger` 和 `Ethereum` 展示了性能对比。Tse\
  \ *et al.* `[17]` 回顾了如何将区块链技术应用于食品货链网络，并在高层次面上对比了基于区块链的方案与传统供应方案。他还强调了关于完整性、安全性和信任的关键要素。Tripoli\
  \ 和 Schmidhuber *et al.* `[18]` 讨论了利用各种分布式账本技术和智能共识来提高效率，并为园艺业提供追溯性。他们既认识到了技术上的挑战，也认识到了接受方面的障碍，并认为分布式账本技术在实现可管理的改进目标方面具有巨大潜力。\n\
  \nMao 和 Dianhui *et al* `[19]` 通过加密合约提出了一种基于区块链的信用评估框架，以提高食品生产网络执行者的效率。Lin *et al.*\
  \ `[20]` 调查了用于 `Agri-ICT` 方案模型的区块链理念，并引入了一个实施区块链创新的农业 `ICT` 系统原型。Galves *et al.*\
  \ `[21]` 审计了区块链在保障食品货链中可识别性和真实性方面的挑战和未来应用。Mao *et al.* `[22]` 提出了一种关联的区块链方法来处理系统和食品交易框架。他们提出了一种改进的实用型拜占庭容错算法，称为\
  \ `iPBFT`，以增强食品货网络中买方的交易方案。Mao *et al.* `[23]` 利用应用于中国山东地区的上下文分析的联盟区块链，批准了他们建议的食品交易框架。\n\
  \nSchneider *et al.* `[24]` 构建了一个模型区块链框架，以提高农业部门的透明度和自运行形式。Lucena *et al.* `[25]`\
  \ 提出了一种利用区块链和智能合约进行谷物标准评估的方法。他们展示了一个真实案例的解决方案，该案例为巴西谷物货运商的转基因无油大豆贸易带来了 15% 的估值提升。Holmberg\
  \ 和 Aquist *et al.* `[26]` 分析了在杀菌行业中执行基于区块链的可追溯性方案的障碍。\n\n农业供应链中区块链试点应用的一些近期实例包括：通过\
  \ `Agri digital platform` 使用 `Ethereum` 区块链技术实现的澳大利亚小麦供应，以及沃尔通过 `IBM`（国际商业机器）`Hyperledger`\
  \ 发起的食品追溯计划 `[27]`。Chinaka *et al.* `[28]` 关注如何通过执行基于区块链的方案解释非洲农主的资产（例如可耕地、牲畜和小规模农业实现的产品）来促进价值转移。大型商品商路易·德富斯（Louis\
  \ Dreyfus）成功地完成了从美国到中国山东渤海工业的首次基于区块链的大豆货物交易 `[29]`。\n\n从这些相关工作中可以看出，采用区块链创新来实现透明化、增强数据安全、确认食品不同标准以及农业货链正呈现出日益增长的趋势。Zhao\
  \ *et al.* `[30]` 了一个了一个基于 `M2M` 远程传感器的园艺相关应用持续信息检查阶段。该框架考虑了用例范围范围内的数据收集、执行和获取。\n\
  \n## 3. 机会\n\n区块链技术在食品领域有许多机会 `[31], 32]`，例如采购追溯、作物和食品生产管理、农业金融和保险管理、提高透明度、经济监视以及绿色债券覆盖。\n\
  \n### 3.1. 采购追溯\n\n农业领域的主要障碍是跟踪运输的交付和支付。如今，该流程依赖于第三方来规划货物运输。传统供应系统中的供应商拥有一个操作者来确保货物安全送达，而买方则有专家来建议结算并审核运输。多个操作者的参与为框架增加了巨额成本，并使整个过程变得繁琐。借助区块链技术，整个过程可以改进为单一的分布式账本。\n\
  \n### 3.2. 土地登记\n\n在印度，联合国开发计划正与许多伙伴和朋友合作，使那里的土地账本更加稳固。在高级水平，该项目将通过物业提供来捕捉并不变地记录每一次交易。瑞典政府的土地所有权机构\
  \ Lantmäteriet 已将土地登记和物业交易引导到区块链上。他们认为这个项目提供了一种安全的数字化真实性方法，并可以为政府节省大量资金。格鲁吉亚共和国正在探索利用比特币系统来批准相关的政府交易。\n\
  \n### 3.3. 水下捕鱼业\n\n\n\n\n另一个用例存在水下捕鱼或钓鱼行业，区块链技术可以被用于追踪和停止非法、不受控和未注册的捕鱼，这些行为对海洋环境成了巨大威胁。在新西兰，世界自然基金会正在开展一项试点项目，旨在消除非法钓鱼以及太平洋岛屿鱼类行业中的人权虐待问题。\n\
  \n### 3.4. 作物与食品生产管理\n\n在智能栽培的帮助下，IoT 传感器可以带来水水位、土壤温度、堆肥和肥料详情等`etc.`等重要数据，并将其直接传输到区块链。这将支持提升耕作流程的以及农作物的质量。\n\
  \n### 3.5. 气候应急控制\n\n农民需要持续应对气候应急控制的问题，例如异常的气候状况。由于降雨过量，成熟作物难以忍受洪涝。买家往往无法得知作物何时遭遇了恶劣气候条件，以及市场价格高高上涨的原因是什么。由于区块链安排中的参与者可以检测到气候状况，农民可以通过智能合约快速申请并获得保险保障。\n\
  \n### 3.6. 农业金融与保险管理\n\n另一个用例在于农业金融和保险的管理。记录和信誉历史缺乏透明度在小农和金融机构之间构成了重大挑战。今天，预算管理不仅允许小农投入资源耕作，还帮助他们解决流动性限制。通过使用区块链，农业资金流程变得日益透明和合理，并赋能了共享控制的便利性。\n\
  \n### 3.7. 增加透明度\n\n机会正在不断扩大。农业的透明度也被认为是重要的用例之一。意大利面条和罗青酱制造商 Barilla 已与 IBM 合作，处理其青酱生产周期中的可追溯性和透明度。从开发阶段开始，经过处理、田间采集到运输、仓储、质量控制，直到生产并最终交付给消费者，所有的细节和特征都被追踪并记录在区块链框架上，以便客户可以通过扫描青酱的`QR\
  \ code`进行核实。\n\n### 3.8. 经济监测与绿色债券发行\n\n这包含了经济监测、检查和发行绿色债券，这些债券旨在为造益于生态系统的计划和项目提供资金。拥有可靠的追溯、可识别性和确认组件对于提高金融投资者对气候智能型活动的信任至关重要。碳信用及其交易可以从区块链带来的信任中获利。区块链技术在食品行业有许多机会，例如采购追踪、作物和食品生产管理、农业金融与保险管理、增加透明度、经济监测和发行绿色债券等`etc.`。\n\
  \n## 4. 应用\n\n本部分由农业和食品领域的四类应用组成，即智能栽培、农业保险、农产品交易和食品供应链。\n\n### 4.1. 智能农业\n\n农食品框架的基础是关于自然资源的底层信息和数据，它们有助于各种类型的栽培。不同的利益相关者和参与者根据其需求和限制产生并监控信息与数据。智能农业企业的特点是使用了`IoT`、`ICT`以及各种现代数据采集和分析技术，包括传感器、无人机和人工智能。建立智能栽培的关键问题是构建一个广泛的安全框架，以促进信息的利用和执行\
  \ [33]。区块链技术用于存储不同利益相关者和农民在交付农产品的整个增值过程中（从种子种植到交易）产生的信息和数据。它确保了信息和数据对于参与的利益相关者和农民来说是清晰明确的，每一条注册信息都是不可更改的。传统方式以中心化的方式控制信息，并且倾向于错误信息、信息篡改和滥用，如同数字化。例如，生态监测信息很大程度上由具有自身优势的中心化管理机构控制\
  \ [34]。他们可以控制有关信息的结论。许多智能栽培模型的提出和执行依赖于区块链和`IoT`技术的联合使用。Patil *et al.* 建议了一种“适用于智能温室农场的轻量化区块链依赖原型”，其中`IoT`传感器充当由所有者中央控制的私有区块链。\n\
  \n### 4.2. 食品供应链\n\n随着市场的不断发展和激烈竞争，食品供应链已比以往任何时候都更长、更复杂。食品供应链中存在一些常见问题，例如食品质量与安全、食品追溯、食品信任以及商店网络的低效，这对整个经济、社会和人类健康构成了额外风险。从生产者的角度来看，利用区块链技术可以与客户建立信任关系，并通过在区块链中清晰提供单品数据来提高其产品声誉\
  \ [35]。这将使得提供虚假和低质量产品的供应商难以在行业内生存，并迫使所有供应商在整个农业和食品部门提高其产品质量。这可以实现对其产品的估值，从而增加其市场竞争力。这有助于解决买家对食品质量、安全和生态可访问性的焦虑。区块链的使用使得生产者和买家能够相互联系，因为客户可以更轻松、更具特征地理解食品生产过程。目前食品零售网络中的区块链技术仍处于改进的早期阶段。因此，所有利益相关者，包括生产者、买家和政府管理机构都将从中受益\
  \ [36]。例如，家畜的 DNA、蔬菜的农药残留或谷物可以由任何参与产品供应链的利益相关者检查和确认。\n\n### 4.3. 农产品电子商务\n\n\n\n\
  \n电子商务和农村产品交易面临着一些关键问题亟待解释。运输过程中的现货支付以及管理行政是电子商务机构面临的最严峻困难，特别是在印度等发展中国家。但由于诸如 `Grofers`、`big\
  \ basket` 等电子商务公司的建立，这一困难已不再构成障碍。此外，电子商务零售商还需要处理包含各种多样化产品的小额订单，这需要更多时间，导致网络业务机构产生高昂的运营成本。印度湖北地区的一项名为“老农场商城”（`Old\
  \ Farmers' Shopping Mall`）的网络业务业务，可以追溯到源头，所有的生产数据对客户来说都是一项宝贵的资产。在产品进入商店之前，会记录种子播种、灌溉信息、准备和施肥等各种详细数据。他们还提供了关于生产者、运输协调员、储存天数和存放温度的基础信息\
  \ [37]。客户只需扫描产品上的 `QR code` 即可获取所有数据。这种策略可以成功地规避非法交易者和中间人的欺诈，并重建客户对电子商务及其供应商农产品的信任。区块链技术可能为这些问题的某些部分（如数据安全）提供相应的解决方案。它提供了私钥加密，这是一种提供验证所需的极大资产。因此，它能够安全且不可更改地连接农产品种植和采集的所有环节信息。区块链提供了零费率的自动化支付安排。此外，在农产品交易中使用数字货币将更显著地降低交易成本，减少农民的支出。许多农产品由家庭提供，但由于交易量小、范围有限，传统的电子商务不愿意为他们提供帮助，从而将这些成员排除在市场之外。区块链可以显著降低交易成本并将他们重新整合市场。\n\
  \n## 4.4 农业保险\n\n气候限制威胁着农业生产，使粮食安全面临危险（影响作物和牲畜生产），未来气候变化将进一步恶化天气状况。农业保险通常是一种预测和识别气候风险全面方法。在这里，农民在作物季节开始前支付保险费，如果他们的农田遭遇不幸，即可获得保险赔付。这样，保险提供商承担了所有受保护风险，农民可以应对气候带来的财务压力。此外，无免赔额的全额保险是可能的，并且在预计发生不利气候事件后，可以方便且自动地进行付款。赔付与农田损失之间可能发生错误，这被称为基准风险。三种基准风险来源可以命名为空间基础风险、时间基础风险和计划基础风险。空间基础风险是指通过空间分离技术表示的估计与农田气候之间的任何差异。时间或瞬时基础风险定义为为保险选择一个不确定的时间窗口，而不是计算整个生长季的降水过程。计划基础风险涵盖了其他所有剩余的单一来源，例如缺失的气因素或单方面的专业应用\
  \ [38]。\n\n耕作保险的区别在于如何评估损失，从而决定了如何触发赔付。赔付给农民的保险取决于专家在农田进行的损失评估，这些被称为基于赔付的保险。基于赔付的保险可以涵盖损失，但在某些情况下，它们倾向于解决由由数据偏离问题引起的问题。农民需要更好地了解不利选择和道德风险问题。总部位于瑞士的机构\
  \ `Etherisc` 提供基于区块链技术的去中心化作物保险，其根据去中心化保险协议代币机制作为当地货币，根据气候信息进行赔付。另一家保险供应商位于纽约市 `World\
  \ Cover`，它为加纳的小农户提供指数保险协议，模拟了基于 `Ethereum` 区块链智能合约的使用，赔付将以数字货币 `Ether` 进行。另一个出色的作物保险供应商是\
  \ `Arbol`，农民可以在那里建议一份包含优质付款、赔付金额以及触发赔付的气候事件的协议，然后由专家作为交易对手同意该提议的协议。\n\n付款可以非常方便并依赖于气候信息，正如智能合约中描述的那样触发赔付。其次，气候数据和其他信息源（如植物生长数据或农场设备收集的信息）可以通过智能预言机自然整合，从而提高基准风险的减少，使得记录的保险和赔付过程逐渐变得有效。在电子商务和农产品交易中使用区块链技术仍处于非常早期阶段，目前的情况并不乐观，因为如何确保信息传输到区块链过程的真实性仍然是一个问题，也是区块链开发者面临的问题。未来，一种潜在的替代方案可能是\
  \ `IoT` [39]。此外，区块链的可传输性、分布式、不可篡改性和可识别性等特性需要更广泛、更深入的研究，以提高农业生产和贸易的盈利效率和生产力。\n\n\
  ## 5 用例场景\n\n随着区块链领域各种前景的出现，各种应用已被并行研究和实施 [40]。农业的各种用例包括食品安全、供应链可追溯性、交易成本、开拓新市场和物流。\n\
  \n## 5.1 食品安全\n\n这无疑是目前工作最多的领域，因为生产者和消费者双方都有明确的个人利益。IBM 与沃尔玛等公司已开始在该领域领先。在食品供应链中增加透明或清晰度将允许我们识别并排除糟糕的经营者和不良流程。这确保了从农田到市场的完美状况，并在发生食品卫生事故时能够快速确定源头。\n\
  \n## 5.2 可追溯性\n\n## 5.3 交易成本\n\n\n\n在信任对方进行合作之前，既需要对对方有特定的了解，同时也又依赖于这种了解。像 `AgriDigital`\
  \ 这样的机构正在通过区块链创新，推动透明且高效的库存和供应链。他们正将这种创新合法地应用于谷物交易所，并计划进入其他农产品领域，例如棉花。\n\n### 5.4.\
  \ 开辟新市场\n\n这是该领域的另一个用例。在未来的数字记录场景中，`Agri Ledger` 正在利用区块链为发展中中国家的农民开辟新市场。原因在于，如果我们幸运地能够在广告参与者之间建立信任和责任，那么对每个个体的可靠性和执行能力进行单独评估的需求就会减少。这意味着以前无法以任何方式、形状或形式建立信任的广告参与者（因为他们地理位置不相近、没有针对发生故障情况的约俗机制、建立其他关系的机会无法使其价值合法化等等），他们现在可以进行合作，而无需有人在中间处理信任（从中从中利）。这还意味着受阻的市场成员可以通过这项技术获得某种“一席之之地”。\n\
  \n### 5.5. 物流\n\n任何在农产品供应链工作过的人都知道由于缺乏协调而面临的困难。在涉及数百万美元的情况下，管理大量且保质期短的物品是非常具有挑战性的。此外，供应网络可能是不稳定的。像\
  \ `UPS` 这样的组织正在加入“区块链运输联盟”，以便在未来基于区块链创新的精细化物联网协调系统中发挥主要作用。由于这已经在许多其他行业中出现，农业行业将成为该链条中的下一个。由于广泛的研究，许多应用已在该领域实施，并且正在持续进行更多研究以改进现有的局限性。该领域的许多初创公司如\
  \ `FARMS`、`Agri-Digital`、`Ag-Unity`、`TE-Foods`、`Hi Tractor`、`Agri-ledger`、`Shamba`等在该领域表现良好。`FARMS`\
  \ 代表“小农户财务与农业风险管理”。在提高农民经济素养的同时，它还教授了各种风险管理方法。\n\n`FARMS` 的理念由基于区块链的、结合卫星信息和灵活货币安排的虚拟现金平台支持，这确保了简单安全的交易以及资产“预留”、自动化支付和数据仪表板。农民处理被称为“旱季币”的虚拟货币，这些货币存储在他们自己的\
  \ `COIN22` 多功能钱包账户中。所有的交易现在只需点击一下，并可以通过 `SMS` 随时进行检查。`Agri-Digital` 是一个用于食品供应链的区块链。对于全球性行业，它提供了云端管理产品和解决方案。它通过单一平台建立了谷物生产者、购买者和融资者之间的联系，允许他们安全且逐步地签订合同、运输并进行支付。\n\
  \n在肯尼亚，`IBM` 与尼日利亚初创公司 `Hello Tractor` 合作了区块链农业应用。这是一个农村创新机构，通过 `物联网` 技术将拖机主与需要拖机服务的小农联系起来。他们的创新为拖机主和农民创造了双赢局面，因为拖机主可以有效地扩大他们的拖机业务，而农民可以方便地获得耕作拖机服务。\n\
  \n`AgUnity` 构建了一个基础设施，为世界贫困农民提供财务融合。这是一个基于区块链的平台，允许农民进行计划、存储和购买。`TE-FOOD` 是全球最大的从农场到餐桌平台。`Shamba`\
  \ 是一家位于肯尼亚的初创公司。它有一个利用人工智能等技术的区块链平台。它为用户提供许多功能。它提供数据相关货币。确保从物联网设备收集的已知数据相关信息是可靠的并遵循安全措施。数据相关货币。\n\
  \n## 6. 农业领域中基于区块链的架构与挑战\n\n智能合约在农业保障、可追溯性和绿色债券方面发挥着有效作用。实施农业活动的区块链架构可以从两个阶段进行研究。第一阶段显示数据的收集、清洗并将其存储在智能合约中。农业的各个阶段包括土壤和作物监测、存储和分销系统。需要收集大量数据来维持供应链质量并建立客户对区块链的信任。在土壤监测系统中，应存储如\
  \ `pH`、温度以及土壤其他矿物质含量等数据。需要存储使用的农药数量、肥料数量以及灌溉用水，这现在使用如 IoT 等传感器就可以实现。需要记录各种天气状况，如\
  \ `风速`、含水量、气压、降水量、紫外线辐射`等.`。在存储和分销实体方面，需要输入如质量控制标签、使用传感器的运输信息以及仓库检查期间食品安全相关的数据。在营销过程中，系统中应有包含根据已知标准税费在内的数据单。此时，在将信息保存到区块链之前，将对收集到的信息进行清洗和改进，以确保其组织且合理。带有\
  \ `时间戳`、人口统计数据和 `类型` 标识的数据将被添加到信息中，使其更有组织性。\n\n\n\n# 架构的第二阶段涉及各种算法的哈希和利用，以进一步识别区块链在农业中的应用，如图\
  \ 6 所示（6）。在将数据存储在智能合约中，它将被分为区块，以便对数据块进行哈希处理。现在，数据存储在具有各自哈希函数的各种区块中。这些数据现在变得不可篡改且安全，可以用于追踪供应链、计算用于生产目的的获得土地、减少洪涝和干旱等自然灾害造成的资源浪费等。它还将帮助金融系统和客户对记录的价格进行审计。想在农田上投资资金的人将从中受益，因为他们可以提前了解土壤质量和其他因素，并做出决策\
  \ [43]。从市场购买食品的客户可以提前充分确保质量和营养，如果食品存在缺陷，由于数据存在于区块链中且无法修改，可以在极短的时间内轻松地实现系统性的调查。\n\
  \n![](img/9781681088624-C10_F6.jpg) **图 (6))**\n\n## 农业中基于区块链架构的第二阶段\n\n区块链技术通过提前预测天气和其他气候条件的趋势，保护农民免受作物失败的影响。传感器与分布式账本的连接将导致记录的实时持续更新。这将提高效率并为农民提供一个公平的支付系统。在实施区块链后，农业部门也将变得透明，并能够检测欺诈以防止黑市交易的发生。它还将吸引投资者的关注。它还将导致农民之间的股票交易，并在未来在农业领域引入加密货币。\n\
  \n## 应用区块链创新的限制\n\n尽管有许多潜在的益处，但在耕作和滋养领域应用区块链创新仍面临一些关键限制 [44]。\n\n*   首先，需要大量的进一步研究来为区块链记录提供真实准确的数据。这对于小农户经营可能尤为重要。耕作过程中产生的数据是分散的，并由个体农主声称。区块链创新对农民的益处高度依赖于农田面积。\n\
  *   其次，在区块链上传输信息可能是昂贵的的，这将成为该地区采用区块链创新的障碍。区块链技术的引入应该循序渐进，从资源规划企业、仓储库管理和制造业开始。\n\
  *   第三，区块链没有直接整合现有的继承框架。为了有效实现，该创新应与当前的数据库和遗产框架连接。例如，行业资产规划和组装执行框架。\n*   建立一个用于区块链开发的开发机构通常是繁琐的。\n\
  *   围绕区块链的行政结构尚处于早期阶段，因此涉及高风险。各种区块链项目，特别是那些管理资金或跨境交易的项目，需要 `KYC/AML` 的一致性，在深入开展这些活动之前，理解国家结构至关重要。`bitcoin`\
  \ 价格经常波动以及有关数字货币被黑的新闻导致了各国加强了监管和准则，其中涉及某些国家禁止 `cryptocurrency`。\n*   其他缺点还包括高能量需求，因为数据大小可能达到\
  \ 100-200 GB 字节，这需要大量能量进行处理。交易速度慢也是一个主要缺点。\n\n## 结论与未来展望\n\n食品健康是立法者和行政专家的重大责任。因此，政府需要建立一个跨行业或跨部门的专家框架，以成功控制食品生产网络。基于区块链技术的食品供应链可以在一秒内从农场追踪到零售店或杂货店。区块链具有转型农业的巨大潜力，这是一个巨大的行业，尽管它看起来不像医疗保健领域或金融系统那样光鲜。在这工作中，我们概述了区块链技术的不同观点、利用区块链在农业部门的进展，并介绍了区块链在耕作部门如何运作的完美模型。调查了该领域的不同近期研究工作，这为农业区块链创新提供了巨大的机会。用例的一个显著部分研究了区块链在园艺供应链中的理论应用，但其在特定使用结构或方法方面尚未达到目标。尽管区块链技术具有优势，但在推进区块链创新以帮助政府追踪、筛选和审查食品链，以及帮助生产者真实、透明地记录交易方面，仍面临一些挑战。区块链和人工智能将在食品供应链行业继续发挥极其重要的作用，涵盖食品安全和扩展、国家以及技术专家。改进食品生产网络的管理准则、提高管理水平和效率、防止租赁追求和产生污染具有极重要性。在农业中实施区块链具有许多益处，因为它将确保供应链质量的提高。它增加了追溯性，因为消费者知道他们的食品生产的确切位置。`PavoCoin`\
  \ 是一个基于 `PavoCoin`框架（基于 `Ethereum`）的物联网软件平台，帮助牧场主的收获开发过程。此外，这种安排还可以收集有关社交活动、处理和分发的信息。由于使用了区块链技术，程序可以得到有效的检查且数据被存储。区块链技术为农业提供了许多创新解决方案。基于区块链的程序让农民改进常规流程并增加当前业务的收入。\n\
