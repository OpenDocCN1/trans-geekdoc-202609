    Accurate silico detection of CD8+ T cell epitopes would greatly enhance cell-based
    vaccine development, but current prediction models are not reliably successful.
    Here, motivated by recent successes using machine learning to complex biology,
    we curated a dataset of 61,237 unique leukocyte antigen class I (HLA-1) ligands
    and developed MUNIS, a deep learning model that identifies peptides presented
    by HLA-1 ligands MUNIS showed improved performance over existing models in predicting
    peptide presentation and CD8+ T epitope immunodominance hierarchies. Moreover,
    application of MUNIS to proteins from Epstein–Barr virus led to successful identification
    of both known and novel HLA-1 epitopes which were experimentally validated by
    vitro HLA-peptide stability and T immunogenicity assays. MUNIS performs comparably
    to an experimental assay in immun prediction, suggesting that deep learning can
    reduce experimental burden and accelerate detection of CD8+ T cell epitopes for
    rapid vaccine development.


    proteomes for range of HLA-I alleles would greatly create CD8+ T cell vaccine
    development.


    Although numerous methods exist to predict CD8+ T cell epitopes, their accuracy
    varies across HLA-I alleles. Moreover, to understand whether these models can
    identify immunogenic epitopes the lack of unbiased datasets is a major bottleneck.
    Frequently predicted peptides are of uncertain affinity or selected binding binders⁶⁷
