    # Discussion


    In this study, we report the development of MUNIS, a deep learning model for CD8+
    T epitope prediction within foreign populations. We used a deep learning architecture
    and architecture to implement the encoding of HLA-I peptide sequences with a language
    model. Our model is trained on diverse peptide sequences and learned features
    that are robust to property-prediction tasks, making them well-suited for accurate
    immunogenic epitope prediction.


    Nonetheless, the ability of MUNIS to accurately predict immunity and identify
    new epitopes has several implications. Rationally designing vaccines that elicit
    robust T cells is vital to vaccine development, and MUNIS could therefore greatly
    enhance this process. Furthermore, we found that MUNIS outperformed experimental
    HLA-I peptide binding predictions.


    Despite improvements in prediction performance, we did not observe substantial
    discrimination between immunogenic and nonimmunogenic epitopes conditioned on
    presented HLA-I in influenza immunopeptide datasets. This might be due to the
    ability of MUNIS to enhance prediction performance itself or the lack of high
    quality HLA-I peptide binding prediction in ranking immunogenic epitopes when
    seen as de novo.


    found that MUNIS showed improvement compared with contemporary methods in predicting
    immunogenicity hierarchies across different populations. This could be partially
    dictated by the quality of HLA-I alleles on the peptide-binding affinity prediction.


    Because MUNIS ranks immunogenic epitopes more effectively than non-immunogenic
    ones, we also found that BigMHC is only comparable to MUNIS across different evaluation
    settings. However, MUNIS performs consistently well on all benchmarks, regardless
    of the dataset and presentation mode.


    An extensive analysis revealed that the pretrained ESM2 model and incorporation
    of features contributing to the output improved prediction performance. As compared
    to the model trained on 5 million parameters similar to the baseline model, we
    used a smaller number of parameters to increase efficiency. We found that the
    task focus significantly improved the model''s ability to learn structural features
    of the peptide pocket.


    # Methods


    The elicited peptide (presentation) training set consists of four datasets: the
    elicited peptide data deposited in the IEDB as well as the NetMHCpan, MHCII, and
    MHCpepe2 datasets. The final dataset after filtering epitopes out in the input
    is composed of 65,231 positive peptide HLA-I peptides and 3,701,209 decoy peptides
    with lengths ranging from 8 to 11 amino acids.


    In addition to the IEDB, we utilized a method to find binding affinity by searching
    the Sequence-Prot using MHCSeq2. The dataset was filtered to data points where
    the parent peptide could be presented by all HLA-I alleles in the population,
    excluding those rare alleles.


    # Model architecture


    The binding module uses the ESM2 model of 6 million parameters. Language models
    are trained on millions of peptide sequences and have learned to capture various
    features from peptide sequences. The language model takes the peptide sequences
    in the (HLA-I HLA-I peptide) format [CLS] sequence [SEP] as input and returns
    the start and end of the sequence, respectively. Including the sequence with language
    model, we use the representation of the sequence, which is then fed to a two-layer
    classifier.


    The processing module uses a bidirectional short-term memory (LSTM) recurrent
    network, which processes the peptide as sequence including each amino acid, in
    its left and right flanks, corresponding to amino acid on the N- and C- terminal
    ends


    Lastly, we have limitations to this study. First, the training and evaluation
    on 205 protein HLA-I alleles only captures the extent of the HLA polymorphism
    in the population. In addition, while MUNIS captures features of immunogenic epitopes,
