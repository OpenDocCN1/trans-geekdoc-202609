  md: '# # Antibodies


    **Antibodies used**

    Anti-human CD3 (Clone OKT3, BioLegend, # 31702, Lot B35B930), anti-human CD28
    (Clone CD28.2, BioLegend, # 30280, Lot B394362), anti-human CD3-BUV395 (Clone
    UCHT1, BD Biosciences, Cat #653546, Lot 307268), anti-human CD4-PE-Cy7 (Clone
    OKT4, BioLegend, # 31714, Lot B375837), anti-human CD8-BVV605 (Clone SK1, BioLegend,
    Cat #344742, Lot B370756L), pan-HLA-ABC anti peptide (Clone W6/32, BioLegend,
    Cat #311410, Lot B373456).


    **Validation**

    Antibodies validated by manufacturers and confirmed to populations of interest.


    # # Eukaryotic cell lines


    **Policy about cell lines**

    All used cell lines were derived from human B cell line 722.221 (https://doi.org/10.4049/human142.9.93320),
    HLA-monogenic TAEP-deficient cell lines were developed using CRISPR-Cas9 gene
    editing (https://doi.org/10.1016/j.celrep.2021.109378).


    **Authentication**

    Each monogenic TAP-deficient cell line was authenticated using surface staining
    for HLA expression and CRISPR sequencing to confirm TAP1 gene editing (https://doi.org/10.1016/j.celrep.2021.109378).


    **Modified identified lines** (See ICLAC register)

    Cell lines are routinely tested for mycoplasma contamination.


    # # Flow Cytometry


    **Plots**

    Confirm:


    +   - The axis labels state the marker and fluorochrome used (e.g. CD4-FITC).

    - All axes are contour plots with outliers or pseudocolor.

    - The scales are clearly visible. Include numbers along axes only for bottom left
    plot of group (a ''group'' is an analysis of identical markers).

    - A numerical value for number of cells or percentage (with statistics) is provided.


    # # Methodology


    **Sample preparation**

    Details in Methods section. Patient PBMCs were extracted from whole blood using
    Ficoll gradient separation.


    **Instrument**

    BD LSR II (H4720037)


    **Software**

    BD FACSiva Software was used to collect the data and FlowJo was used to analyze
    the data.


    **Cell population abundance**

    No cell sorting was performed in this paper.


    **Gating strategy**

    Gating strategy for HLA class I-peptide stability assays: FSC-A/SSC-A -> SSC-H/SSC-W
    -> Live/Dead Violet/SSC-A -> HLA-C histogram. Gating strategy for proliferation
    assays: FSC-A/SSC-A -> SSC-H/SSC-W -> CD3-BUV395/Live/Dead Violet -> CD8-BV605/CD4-PECy7
    -> CellTrace Fab Red (CTFR)/CD8-BV605.


    +   - Tick this box to confirm that a figure exemplifying the gating strategy
    is provided in the Supplementary Information.'
