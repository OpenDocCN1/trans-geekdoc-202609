    # # Statistics


    For all statistical analyses, confirm that the following items are present in
    the figure legend, table legend, main text, or Methods section.


    +   - The exact sample size (n) for each experimental group/condition, given as
    a discrete number and unit of measurement

    - A statement on whether measurements were taken from distinct samples or whether
    the same sample was measured repeatedly

    - The statistical test(s) used AND whether they are one or two-sided

    - Only common tests should be described solely by name; describe more complex
    techniques in the Methods section

    - A description of all covariates

    A description of any exceptions or corrections, such as terms of normality and
    adjustment for multiple comparisons

    - A full description of the statistical parameters including centrality (e.g.
    mean) or other basic estimates (e.g. regression coefficient) AND variance (either
    standard deviation) or estimates of uncertainty (confidence intervals)

    - For null hypothesis testing, the test (E, f, t) with confidence intervals, effect
    sizes, degrees of freedom and P value noted as exact values whenever possible

    - For Bayesian analysis, information on the choice of priors and Markov Monte
    Carlo results

    - For hierarchical and complex designs, identification of the appropriate level
    for tests and full reporting of outcomes

    - Estimates of effect sizes (e.g. Cohen''s d, Pearson''s r), indicating how they
    were calculated


    Our collection on statistics for biologists contains articles on many of the points
    above.


    # # Software and code


    Policy information about availability of computer code


    | Data collection | No software was used for data collection. |

    | Data analysis | Data analysis was performed using standard python packages (pandas,
    matplotlib). Model training was done using machine learning frameworks (pytorch,
    pytorch-lighting). |


    For manuscripts using custom algorithms that are central to the research but not
    described in published literature, software must be made available to editors
    and reviewers. We encourage code deposition in a community repository (GitHub).
    See the Nature Portfolio guidelines for submitting code & software for further
    information.


    # # Data


