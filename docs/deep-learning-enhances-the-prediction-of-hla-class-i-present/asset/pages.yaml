    - Ecological, evolutionary & environmental sciences


    For reference copy of the document with all sections, see nature.com/documents/nr-reporting-summary-flat.pdf.


    # Life sciences study design


    All studies must disclose these points even when the disclosure is negative.


    | Sample size | A total of 30 HLA-typed participants were selected for analysis.
    Written informed consent was obtained from all participants. Sample size was not
    calculated due to the extensive degree of HLA polymorphism in the human population.
    We therefore selected individuals with HLA class i alleles matched those that
    were present in our HLA class i-peptide assessments and computational predictions.
    |

    | Data exclusions | No data were excluded. |

    | Replication | All experiments were performed in technical duplicates and all
    attempts at replication were successful. |

    | Randomization | No randomization was performed as participants were assigned
    to epitope immunogenicity assessments based on their HLA class haplotype. |

    | Blinding | No blinding was performed and sample names were labeled on their
    de-identified ID, sample collection date and time points. No blinding was done
    to avoid cross-contamination. |


