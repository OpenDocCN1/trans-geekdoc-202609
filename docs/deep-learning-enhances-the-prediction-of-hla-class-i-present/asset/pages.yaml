  md: '# Deep learning model for C8+ T cell epitope deidentification


    To develop a robust model of C8+ T cell epitope prediction, we constructed a dataset
    composed of mass spectrometry data from immunopeptide datasets including MHCPre2.2,
    MHCNet4.1, and MHCII2.0 training sets and from the ImmunePeptide Database (IEDB:
    ied.org?). We used these HLA-B binding peptides with non-binding peptides from
    SwisProt at a ratio of 1:1. Importantly, all peptides in model evaluation were
    independent of training sets of HLA-B restriction. This is a filter strategy to
    address data leakage in previous methods where overlapping HLA-B peptides were
    present between training and test sets. We show the results of these datasets
    (Fig. 1a, the peptide distribution and the frequencies at which HLA-B molecules
    were identified (Fig. 1b, c).


    The architecture of our model is composed of two modules (Fig. 2). The first module
    learns the binding affinity of the HLA-B molecule and learns a vector representation
    with respect to binding. The second module aggregates the binding features to
    produce a prediction score. By encoding the peptide and its N and C-terminal features
    from its root position, similar to MHCII2.0. Using this approach, we find that
    our model can predict the score of HLA-B peptides with ranges ranging from 0 to
    1000, with high accuracy in predicting the ability of a peptide to bind to a particular
    HLA-B allele.


    Previous work has highlighted the area under the receiver operating characteristic
    (AUC-ROC) and precision as important metrics for evaluating performance. However,
    the disadvantage of accuracy is that for a given threshold, the proportion of
    positives is devalued even with a low false-positive rate. We use the area under
    the precision-recall curve to evaluate model performance. This score ranges from
    0 to 1, with a value equal to the proportion of positives. For datasets of sufficient
    size, we also show the AUC-ROC.


    # UTILS performing better in classifying HLA-B alleles


    We evaluated the performance of our model on a published immunopeptide dataset
    containing 37,215 HLA-B peptides and 2065 randomly sampled copies across 24 HLA-A
    alleles. We calculated the average precision and ROC-AUC of classification for
    non-binding and on-binding alleles and compared with tools like MHCPre2.2, MHCNet4.1,
    MHCII2.0, and UTIS (including MHC-EL) and immunopeptidomics (BiMHC-IG). In contrast,
    our model achieved an average precision of 0.922, which corresponds to a 21% increase
    in comparison with tools, with MHCPre2.2 scoring 0.768, MHCNet4.1 scoring 0.795,
    MHCII2.0 scoring 0.862. The ROC-AUC of our model was 0.939, which corresponds
    to a 33% increase in comparison with MHCII2.0 at 0.971, MHCNet4.1 scoring 0.927,
    UTIS scoring 0.895, and MHCPre2.2 scoring 0.836.


    Evaluation of the model on the test sets using epitopes in the evaluation dataset
    showed promising results, excluding models where we have no overlap. For 22/24
    HLA-B alleles we detected high performance in precision (Fig. 2). This performance
    could be due to the model''s ability to encode peptide length. We further evaluated
    model performance across


    # MHC predicts epitope identity and immunodominance


    Given that only HLA-presented peptides are C8+ T cell epitopes, we measured the
    ability of MHC to predict immunopeptide identity. To avoid bias from using peptide
    sets for prediction, we selected a test set of immunopeptidomics data from viral
    viruses A and B that bind to HLA-B-A02:01, HLA-A11:01 and HLA-A*24:02. We de novo
    constructed a list of HLA-B-presented peptides identified via mass spectrometry
    that were subsequently evaluated for immunodominance using interferon gamma (IFN-γ)
    immunospot (ELISpot) assays, where 32 of the peptides were tested. We ranked them
    as positive (immunodominant) or negative in the viral proteome. When comparing
    the set of datasets, we only considered peptides with at least one immunodogenic
    peptide to prevent preventing bias by high levels of protein immunity.'
