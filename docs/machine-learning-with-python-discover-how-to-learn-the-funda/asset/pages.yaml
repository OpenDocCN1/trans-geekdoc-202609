    more important here is making sure that you are choosing the right kind of data
    to help you out.


    If you are studying with a harder or more complex problem like speech recognition
    or even something like computer vision, then that is one thing. But this field,
    despite what we may think when we get a bit lost in, that we are in a field that
    is data-driven. In most of the scenarios that we are going to find ourselves in,
    making some adjustments to the data that we put in rather than the algorithm is
