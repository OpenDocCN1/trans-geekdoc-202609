- pgno: 5
  md: '# 1.Jars of Machine Learning


    The following components encompass the process of getting input and offering output,
    and they are;


    +   - Learning

    - Loss

    - Task

    - Data

    - Evaluation

    - Model


    Learning

    The responsibility of minimizing the error is the function of this algorithm.
    The algorithm defines the manner the variables in the equation are given value,
    so the output computed is close to actual production. For example: In y = mx+c,
    the learning algorithm finds the values of m and c so that y computed) is close
    to y (actual).


    Loss

    The difference between the actual output value and the output value that our model
    predicts or the rate of the error is the function of the loss. Minimizing the
    function of loss is quite vital for us to solve a problem.


    Task

    The thing we must do with the given data is what the task specifies for us. Task
    depends on the questions one has to solve with the available information. For
    example, based on the data, you can design a task to measure the happiness level
    of the employee or the performance of the employee.


    Data

    The fuel of machine learning is data, and you must learn to provide a proper history
    of data on the output and input. For example, an HR needs to give provision of
    all the employee information to have a prediction on whether or not an employee
    stayed or left will leave the company.


    Evaluation

    We need to see the accuracy of the model to resolve the problem that we aim it
    to solve by identifying how well our model performs.'
  merge: -1
  img_proc: true
