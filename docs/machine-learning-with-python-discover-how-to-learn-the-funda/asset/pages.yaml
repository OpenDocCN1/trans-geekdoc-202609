  md: '# Introduction


    Machine learning originated from pattern recognition and the theory that computers
    are able to learn without the need for programming them to perform tasks. Researchers
    in the field of artificial intelligence wanted to determine whether computers
    are able to learn from data. Machine learning is an iterative approach, and this
    is why models are able to adapt as they are being exposed to new data. Models
    learn from their previous computations as to give repeatable, reliable results
    and decisions.


    Today, machine learning technology has given rise to sophisticated machines, which
    can study human behavior and activity in order to recognize fundamental patterns
    of human behavior and exactly predict what products and services consumer may
    be interested in. Under the side of their business model, businesses with an eye
    for the future gradually become technology firms with systems built upon machine
    learning algorithms. Consider some of the most innovative gadgets of this era
    such as “Amazon Alexa”, “Apple’s Siri”, what they all have common in their underlying
    machine learning capabilities.


    Because of the unique benefits of machine learning especially on the small devices,
    it is clearly becoming a favorite with businesses. From RPA functions to mobile
    automation it is all becoming a handheld reality bringing the future into the
    palm of your hands. Nowadays even smaller businesses can leverage ML like the
    bigger boys. It can be used in cost-effective ways. For example, some companies
    use AI for improving customer relations. It reduces the costs and at the same
    time provides customized assistance to their companies. It can also be used to
    train the workforce and to improve forecasting cost-effectively. For example,
    Udacity has enhanced their sales by 50% by introducing chatbots to their sales
    teams. The advancements in data, algorithms and infrastructure and the costs required
    for getting them has decreased their overall cost and nowadays smaller businesses
    can afford them.


    However, there are a host of questions raised about ethics in relation to machine
    learning. Systems that are trained on data sets with biases might lead to digitalization
    of cultural prejudices. For example, using data from a job'
