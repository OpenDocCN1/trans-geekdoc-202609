  md: '# # 13. Tips to Make Machine Learning Work For You


    Now that we have spent some time in this guidebook taking a look at machine learning
    and all of the great learning algorithms that fit into the mix, along with the
    different categories that come with supervised, unsupervised, and reinforcement
    learning, it is time to move on to actually putting these to use. There are so
    many different situations where you are able to utilize what you know from machine
    learning, and it is going to really make a difference if you are able to work
    on these algorithms.


    Once you have a good idea with these algorithms, you may be more curious about
    some of the tips and strategies that you are able to use in order to make sure
    that machine learning is going to work out the way that you would like. Some of
    the tips that you can follow when it comes to working with machine learning include:


    Remember the Logistics


    When you are working on machine learning, remember that success is not always
    just about picking the right kind of algorithm or tool. In fact, it takes a bit
    more for this. You need to find a fit and a good design for the specific kind
    of problem or project that you want to work with. Each project is going to be
    different and if you try to use the same things for each one, then there are going
    to be situations where machine learning will not be successful.


    For example, the machine learning that you use with a campaign for online marketing
    is going to be a lot different compared to working with an algorithm that helps
    guide an autonomous car. Expanding your resources for an incremental algorithm
    improvement is going to be really worth it when it comes to the car, but in most
    marketing cases, you would want to optimize the different logistics around you
    instead.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'This means that before you even started on the project that you would like
