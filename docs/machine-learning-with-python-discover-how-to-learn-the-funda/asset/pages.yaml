  md: '# 8.Data Pre-Processing and Creation of Training Data Set


    Data Preprocessing is a “data mining technique, which is used to transform raw
    data into a comprehensible and effective format”. Real-world data tend to lack
    certain behaviors or trends and is almost always incomplete, inconsistent and/or
    missing attribute values, flooded with errors or outliers. Preprocessing data
    is a proven way to solve such problems. Raw data or real data from the world cannot
    cannot be readily transmitted through a machine learning model. Therefore, before
    feeding real-data to a machine learning model, we need to clean and pre-process
    it.


    # Overview Data Preprocessing


    Data Cleaning

    Many meaningless and missing sections can be found in the data. "Data cleaning"
    is performed to manage these inadequacies and constitutes handling data set that
    is missing values and consists of noisy data.


    Missing Data

    In this scenario, certain significant information in the data set is missing.
    It can be dealt with in different respects such as:


    **Ignoring the tuples**: This strategy is appropriate only if the dataset is big
    and numerous values within a tuple are lacking.


    **Fill the missing values**: This assignment can be done in different ways such
    as: manually completing the missing values using the mean attribute or the most
    relevant value.


    Noisy Data

    “Noisy data” is useless data that machines or the machine learning model is unable
    to interpret. It can be generated as a result of defective data collection or
    mistakes in data entry, among others. It can be addressed using the methods below:


    **Binning Method**: This technique operates on sorted data to smoothen it out.
    The entire data set is split into equivalent size sections and then different
    techniques are used to finish the job. Each section is fixed individually. To
    fix the entire data set in ago, all data points in a section can be substituted'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'with its “mean” or most probable values.


    **Regression:** In this case, data can be smoothed out by fitting into a "regression
    function", which can be either “linear” (with one autonomous variable) or “multiple”
    (with various autonomous variables).


    **Clustering:** This technique is used to group comparable data points into a
    cluster. The outliers could be obtained with data points falling outside of the
    clusters or could not be detected.


    Data Transformation

    This technique is used to convert the data into a format which is suitable for
    the data mining method. This includes the following ways:


    **Normalization:** This technique is used to scale data values within a defined
    range, for example, “-1.0 to 1.0” or “0.0 to 1.0”.


    **Attribute Selection:** New data attributes can be generated from an existing
    data set of characteristics, using this technique to assist in the data mining
    process.


    **Discretization:** This technique is used to “replace raw values of numerical
    attributes with interval or conceptual levels”.


    **Generation of the concept of hierarchy:** This technique is used to transform
    lower-level data attributes to higher level in the hierarchical setup. For example,
    you can convert the attribute “city” to “country.”


    Data Reduction

    “Data mining” is a method used for analysis and extraction of insights from Big
    data. In such instances, analysis becomes more and more difficult to work with
    given the enormity of data. We use data reduction method to reduce the volume
    of data set to an optimal and manageable volume. With this method, the cost of
    data storage and analysis can be significantly lowered while improving the effectiveness
    of the data storage. It can be dealt with in different respects such as:


    **Data Cube Aggregation:** This technique is used to apply “aggregation operation”
    to data effectively build cubes.


    **Selection of attribute subset:** This technique is used to ensure that only
    necessary data attributes are used and the so relevant attributes can be discarded.
    To perform attribute selection, the "level of significance" and "p-value of the
    attribute" can be leveraged. The attribute with "p-value" higher than the "significance
    level" can be removed to obtain the optimal volume of the data set.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '**Numerosity Reduction:** This technique allows the data model to be stored
    instead of the whole data set or raw data collected from various input sources,
    for instance, “Regression Models”.

    **Dimensionality Reduction:** This technique uses encoding mechanisms to reduce
    the volume of the data set. If initial data set can be recovered after reconstruction
    from compressed data set, this reduction in dimensions of the data set is known
