    # The Concept of Truncation


    It represents all possible clusterings, from the finest clustering (one cluster
    individual) to the coarser one (a single cluster for all individuals). The next
    question may arise: at which level of aggregation should we "cut" the tree, that
    is, how to define the most relevant number of clusters? Quantitative responses
    can be made, based on the relative gain in inertia generated by moving from one
    partition to another, but remember that visual inspection of the dendogram gives
    very good answers. We can then rely on criteria such as:


    +   - The general shape of the tree: it reveals a "logical" cutting level indicated
    by significant jumps in the values of the level indices. If these jumps concern
    the k nodes of the tree, then a division into (k + 1) classes will be relevant

    - The number of clusters: avoid too many, in which case clustering loses its interest;

    - The ability to interpret clusters: no need to try to retain clusters for which
    we cannot give business sense; focus on clusters that make sense.


    Non-hierarchical clustering'
