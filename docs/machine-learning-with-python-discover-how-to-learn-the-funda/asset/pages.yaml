    12 Have you heard of the Bag-of-Words model?

    The Bag-of-Words model is a very common technique used in Information Retrieval
    and Natural Language Processing. It is also known as the Vector Space Model, which
    is described in detail in question 6 above. It uses the frequency of occurrence
    of the words in a document as the feature value.

    One of the limitations of this method is that it does not take into account the
    context of the words. For instance, if you take these sentences "Apple have become
    a trillion dollar company" and "You should eat apple every day", the Bag-of-Words
    model won''t be able to differentiate between Apple as a company and Apple as
    a fruit. To address this limitation, you can use N-gram model which stores the
    spatial information of the words. Bag-of-Words is a special case of N-gram method
    with n=1.'
