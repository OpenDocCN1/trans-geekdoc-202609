    # Algorithms Are Not Always Right


    We spent a lot of time in this guidebook taking a look at the various algorithms
    that you are able to focus on. These are great tools that are going to help you
    get the right results that you want, but they are not always right. If we start
    to look at them as magic bullets that are going to solve all of our problems instantly,
    this could be a bad thing.


    Implementations of machine learning are going to do their very best when there
    is a continual process of trial and error. No matter how good you may think the
    algorithms you use if the system is doing any kind of interaction with another
    person, or more than one people, then it is to have some adjustments done to it
    over time. Businesses need to always be measuring the effectiveness of their implementation
    and figure out if there are any variables and changes that are going to either
    make it better or make worse.


    This is going to sound like a lot of work and may seem a bit confusing when you
    are first getting into the field of machine learning. But it is something that
    you need to focus on. Very few businesses are doing this. Instead, they assume
    that their algorithm is perfect and that never needs to be changed. This is going
    to make things worse, and over time, the algorithm is going to be so far behind
    that it is not going to be able to give you accurate results.


    It is normal to want to deploy your system with an algorithm and then want it
    to do its job perfectly, without ever having to do any work to keep it that. While
    that would be the ideal world, is not a reality that any of us can count on. No
    algorithm or user interface design is going to be able to stick around for a long
    time to come. And there is no data collection method that is going to be superseded.'
