    there, you are able to co-opt a framework that is existing, and then use it for
    a new case.


    This is a great way for you to really make something new, without having to create
    the whole thing from the very beginning. You are able to use some of the techniques
    and frameworks that are already in existence, and then add some of the specifications
    and more that are present in it to get the results that you would like.


    This can take a bit of work. But think through some of the projects that you want
    to work with. Break it up into some smaller parts and figure out whether there
    are any existing platforms or frameworks that you are able to use to get things
    started. Once you have this, you will be able to go through and make the changes
    that are needed, perhaps using some of the algorithms that we already have in
    process and talked about above, to make this happen.


    This is a benefit in many ways. First, the frameworks that you are going to be
    using are free in most cases or at least not going to cost you all that much.
    This means that you will be able to use them and save money compared to recreating
    exactly what you want from scratch. It is always a good thing in business when
    you are able to save money. You still get to use the deep learning that is needed
    in the process, but you get the benefit of saving money on the parts that don''t
    necessarily need to be unique.


    Another benefit here is that you can save yourself some time. Many of the frameworks
    that you are going to use take a lot of time to create. And if you have to come
    up with a new one each time you start, it is going to take forever to get projects
    done. When you are able to use or purchase the one that you would like, you can
    end up saving a lot of time and it speeds along with the project that you want
    to get done.'
