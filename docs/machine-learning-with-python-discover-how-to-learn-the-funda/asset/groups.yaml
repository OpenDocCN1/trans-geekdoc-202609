    # 机器学习路线图


    学习和复习线性代数是正确的起点。你将对线性代数的所有核心概念有一个基础的介绍。请关注矩阵乘法、向量、特征值分解和行列式，因为所有这些内容共同构成了机器学习算法运行的齿轮。


    你的下一个重点应该是微积分。在这里，理解并学习如何利用导数进行优化以及它们的意义，必须是你的关注焦点。


    这些是机器学习的工具，没有了它们，你无法在机器学习领域取得任何进展。


    然后，下一步是编程。在利用 SciKit 中的预制模型之前，你必须学习用 Python 从零实现所有算法。这不仅让你了解它们是如何运作的，还能让你获得更深入、更好的知识。虽然你可以从任何地方开始，但对于你的算法，建议遵循以下顺序：


    - 线性回归 (Linear Regression)

    - 逻辑回归 (Logistic Regression)

    - 朴叶贝斯分类器 (Naive Bayes Classifier)

    - K-近邻 (KNN)

    - K-均值 (K-Means)

    - 支持向量机 (SVM)

    - 决策树 (Decision Trees)

    - 随机森林 (Random Forests)

    - 梯度提升 (Gradient Boosting)


    ## 线性回归

    线性回归通过将观测数据拟合到线性方程，其核心在于建立连接两个变量之间相关性的努力。对于单个变量来说，解释变量是考虑因素，而因变量则是另一个变量的考虑因素。例如，你可以使用线性回归模型将人的身高与体重联系起来。


    在初始阶段，在尝试将线性模型拟合到观测数据之前，你必须确定感兴趣变量之间是否存在联系。这并不意味着单个变量产生了另一个，例如，并不意味着两个较高的高三成绩不会导致更高的
    SAT 分数，除非这两个变量之间没有显著联系。为了确定两个变量之间的关系强度，散点图是一个很有用的工具。当因变量与预测描述变量之间没有联系时，在对数据拟合线性回归模型时可能无法提供任何有效的模型，此时散点图没有显示出任何下降或上升的趋势。相关系数是两个变量之间不可或缺的数值联系，使得两个变量实验数据的相关强度是一个介于
    -1 和 1 之间的值。其中 $Y$ 是因变量，$X$ 是解释变量，线性回归直线的方程为 $Y=A+BX$。其中截距（$X=0$ 时 $Y$ 的值）为 $A$，直线斜率为
    $B$。


    ## 逻辑回归

    作为线性回归模型用于分类问题的扩展，并且有两个可能的结果，逻辑回归模型对分类问题进行建模。逻辑回归是分类的解决方案。为了将线性方程的输出压缩在 0 到 1
    之间，逻辑回归模型使用的是逻辑函数而不是拟合超平面或直线。逻辑函数的定义如下：


    ```

    $logistic(\eta) = \frac{1}{1 + \exp(-\eta)}$

    ```


    因此，它以这种形式出现：


    ![](img/6998b8ee78c0efcd8b5f617f7d5ea786_11_0.png)


    逻辑函数。输出数字在 0 到 1 之间。它在输入为0时输出 0.5。


    从线性回归到逻辑回归是一个简单的步骤。在特征和结果之间，在线性回归模型中，我们用线性方程对它们进行了建模。


    ### $y(i)=\beta_0+\beta_1x(i)_1+\dots\beta_px(i)_p$


    对于分类，我们倾向于使用连接 0 和 1 的概率，并将等式的右侧封装在逻辑函数中。这样做将强制输出仅为连接 0 和 1 之间的值。


    ## 朴叶贝斯分类器

    朴叶贝斯是一种简单、常用且有效的机器学习分类器。通过在贝叶斯框架下使用极大后验决策规则，朴叶贝斯是一种进行分类的概率分类器。此外，它还通过使用基础贝叶斯网络进行表示。朴叶贝斯分类器是决策等问题的传统解决方案，在文本分类方面尤为著名。


    ## 模型

    有了特征 $x_0$ 到 $x_n$ 以及类别 $c_0$ 到 $c_k$，任何概率分类器的目标不仅是返回最可能的类型，而且还要确定特征在每个类别中发生的概率。因此，我们可能希望具有计算每个组的
    $P(c_i / x_0, \dots, x_n)$ 的能力。贝叶斯规则就是我们执行此操作的方法。贝叶斯规则具有以下特征：


    ```

    P(A|B) = \frac{P(B|A)P(A)}{P(B)}

    ```


    可能用类别 $c_i$ 替换 $A$，用 $x_0$ 作为我们在 $x_n$ 分类框架下特征的组合替换 $B$。由于 $P(B)$ 是分母，$P(x_0,
    \dots, x_n)$ 对我们可能很难计算，我们主要可以保持项 $P(c_i / x_0, \dots, x_n) \propto P(x_0, \dots,
    x_n / c_i) \cdot P(c_i)$ 而不是忽略它，在计算时，当 $\propto$ 意味着“正比”时，这非常容易。计算 $P(c_i)$ 可能更困难。$P(x_0,
    \dots, x_n / c_i)$ 项取决于你的特征遵循什么分布。当元素是词计数时，在文本分类中，特征可能遵循多项分布。在其他情况下，它们可能发展为高斯分布。


    ## K-近邻 (KNN)

    KNN 是一种简单的算法，它根据相同的相似度量来分类新案例或数据，并存储所有可用实例。根据其邻居的分类情况，它主要用于分类数据点。例如，含有杨皮素和芦藜醇等化学成分的葡萄酒。在投票流程的主流中，$k$
    是一个提交邻居数量的结构。此外，如果我们向数据集中添加了一杯新葡萄酒，最好知道这杯酒是白色的还是红的。


    在这种情况下，我们需要找出邻居是谁。我们假设 $k = 5$ 以实现这一点。新数据的分类方式是，如果五个邻居中大部分是红色的（例如四个），那么该点的分类就是红色。


    ## K-均值 (K-Means)

    在没有目标标签的情况下，K均值是一种无监督学习算法，能够识别数据内部相同的组或聚类。根据到质心的某种距离相似性度量进行聚类并将数据分成 K 个簇是 K均值面临的问题。现在，我们如何解决这个问题？如果我们概述涉及的步骤：


    1. 当我们初始化 K 个起始质心时，每个数据点被分配到最近的质心，这个过程我们可以随机进行。

    2. 在相应的簇中，通过数据点的平均值计算质心。

    3. 直到我们触发停止准则，重复第 1、2 步。


