    \ In its position, several new positions with highly skilled, medium skilled and\
    \ even low skilled range of people will be required.\n\n# 1. Jars of Machine Learning\n\
    \nThe following components encompass the process of getting input and offering\
    \ output, and they are;\n\n- Learning\n- Loss\n- Task\n- Data\n- Evaluation\n\
    - Model\n\nLearning\nThe responsibility of minimizing the error is the function\
    \ of this algorithm. The algorithm defines the manner the variables in the equation\
    \ are given value, so the output computed is close to actual production. For example:\
    \ In y = mx+c, the learning algorithm finds the values of m and c so that y computed)\
    \ is close to y (actual).\n\nLoss\nThe difference between the actual output value\
    \ and the output value that our model predicts or the rate of the error is the\
    \ function of the loss. Minimizing the function of loss is quite vital for us\
    \ to solve a problem.\n\nTask\nThe thing we must do with the given data is what\
