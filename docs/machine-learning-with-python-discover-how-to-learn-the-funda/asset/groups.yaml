    # Understanding the Architecture


    The topology of convolutional neural networks is similar to that of the multi-layer
    perceptron. It''s an acyclic graph constructed with layers that contain few nodes,
    and each layer communicates with the next.


    One of the most important differences worth mentioning here is that this type
    of neural net has identical neurons. In other words, we have identical parameter
    values, as well as weight values. This is something that makes CNNs extremely
    efficient, because there are fewer values that need computing. Another key difference
    is that the nodes have limited communication. That means the node inputs are connected
    locally, only to neighboring nodes.


    Layers

    Then we have a filter composed of 4 parameters that is applied to the layer in
    order to create the feature map. The four filter parameters are known as hyper-parameters
    and they represent size, depth, stride, and zero-padding. The size is determined
    by calculating that the filter''s surface area. Here we should keep in mind that
    the filter''s size has an impact on the output. This means we need to control
    the output precisely, so that we can have an efficient network. It''s also worth
    mentioning that sizeable filters often overlap, however this can be used to our
    benefit because it can lead to an improved accuracy rate.


    The filter depth is about how many nodes we have inside a layer, and how many
    of them connect in the same area around the input. Keep in mind that we are still
    discussing images, and when we''re talking about depth we''re referring to image
    content. If you worked with Photoshop or any other image editing or manipulating
    software, you probably already know about the color channels. They are needed
    to describe the content of the image, and neural network nodes are mapped for
    the purpose of perceiving the red, green, and blue color channels. This is why
    under many circumstances filter depth is set to 3. If we increase the filter parameter
    we can gain more data on the image and unmask other properties that are difficult
    to learn. However, if we set the depth to a low value, we gain weaker results.


    The third filter parameter is the stride, and its value determines the space between
    the neurons. If we have a stride equal to 1 and we are working with an image,
    we are going to set each pixel as the center of the filter. This causes outputs
    to increase and a great deal of layer overlap. What we can do'
  - '[PAGE 25]


    increase the stride value to reduce the overlap, however keep in mind that the
    outputs will also be reduced in size. The way fine tuning is done in this case
    is by simply making a judgment call based on balancing accuracy and size. Under
    most circumstances, however, it''s probably a good idea to stick to lower values.


    The fourth and final filter parameter allows us to reduce a layer''s output size.
    Zero-padding achieves this by setting the border values of the receptive fields
    to 0. In convolutional neural nets when we are talking about receptive fields,
    we refer to the input space that has an effect over any specific unit that is
    part of the network. As a word of warning, when you set the zero-padding, make
    sure that all the areas are still covered by the filter. Another big advantage
    of a proper zero-padding setup is the ability to adjust the inputs and outputs
    to have an identical size. Preparing the input and output layers to be equal in
    size is quite standard, because this enables us to efficiently adjust the depth
    and the stride parameters. If we didn''t have any zero-padding, we would require
    a lot of effort to set up the parameters properly and improve network performance.
    The borders of a filter might degrade if we didn''t have the padding.


    Now the question is, how we calibrate all of these parameters when we set the
    network? There''s a simple formula for this. Here''s what it looks like:


    O represents the layer''s output, W the image size, F the filter size, P the stride.
    Keep in mind when applying the formula that the layer''s output might not always
    be an integer value, and this can lead to various issues. Luckily, you can compensate
    by performing adjustments to the stride.


    Now that you understand more about the convolutional neural layers and their parameters,
    let''s discuss what convolution actually is. Simply put, it is a mathematical
    operator, just like multiplication, and it is mostly used to break complicated
    equations into a simpler form. In other words, the process results a third function
    after performing an operation on two sets. This results in a new function that
    is actually a derivative of the 2 original functions.


    When we are working with a convolutional neural network, we have the input as
    the first element. When we apply this process to an image, it is actually'
  - '[PAGE 26]


    assigned in the width and height of the image. Here we will have 3 pixel matrices,
    as you’re probably guessing, for each color channel. These matrix values will
    range from 0 to 255.


    The second component is the convolutional kernel, which consists of one matrix
    composed of floats. These numbers provide a filter to the input matrix, and the
    output is a feature map. This filter goes over the input and writes the feature
    map. This is where we find the main advantage of the convolution process. There
    is no need for feature engineering. For now, you should know that a feature engineering
    process is extremely challenging and demanding.

    Training


    You will notice that convolutional network learning is extremely similar to the
    previous processes. For instance, MLPs are pre-trained with convolutional nets,
    and backpropagation is needed to process the gradient during the pre-training
    phase.


    Now let’s briefly discuss the main steps that are performed during the training.
    First, we need to compute the feature maps. This is achieved by computing each
    one as a sum of them all convolved with the weight kernel that coincides. This
    step is called the forward pass. In the second phase, we calculate the gradients
    by convolving the exchanged weight kernels with the gradients. This is the backward
    pass. In the process we also need to calculate the loss of kernels in order to
    adjust their weights.


    Keep in mind that the training process is slow, and it will take some time even
    if you have high end hardware.'
