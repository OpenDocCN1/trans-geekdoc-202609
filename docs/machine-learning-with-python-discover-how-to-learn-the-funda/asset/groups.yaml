    # 3. Convolutional Neural Networks


    Convolutional Neural Networks are one of the most commonly used artificial neural
    networks due to their ability to process and classify images. These algorithms
    are used in a variety of fields where photo search and image recognition are required.
    They are also useful in digitizing text, language processing, and can also be
    used to graphically represent audio data. However, their main purpose is image
    recognition, and it''s worth noting that this is the ability that brought attention
    to deep learning. As a result, CNN algorithms are now being implemented in drones,
    AI-driven cars, robotics, medical science and much more. It''s safe to say that
    convolutional neural networks have taken science and tech to a new level.


    A CNN processes visual data as tensors. If you don''t already know, a tensor is
    a matrix of numbers with additional dimensions, and it is formed by an array nested
    inside an array and so on. When it comes to convolutional neural networks, we
    are working with 4D tensors. In order to make this explanation clearer, let''s
    imagine we are looking at a picture. We can understand and determine the height
    and width of it with ease, but what about depth? In the case of images, the depth
    refers to the encoded colors, in other words the red, green, and blue color channels
    (or layers). We use convolution to produce feature maps (maps of image details),
    and they exist in a 4 dimension. In this situation our picture is not a two-dimensional
    object, but a four-dimensional volume instead.


    But what is convolution? In math we are referring to the measuring of how much
    two functions overlap each other when they pass over each other. It''s also important
    to note that CNNs are registering different signals every time they pass a filter
    over an image. For instance, when we map the margins of the image, we can picture
    these filters as horizontal, vertical, and diagonal lines that pass over it.


    Keep in mind that convolutional networks don''t process and analyze images the
    same way restricted Boltzmann machine algorithms do. CNNs learn image data data
    bit by bit, in pieces, known as feature maps, while RBMs analyze whole images.


