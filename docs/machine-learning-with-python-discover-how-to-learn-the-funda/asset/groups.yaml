    The objective of non-hierarchical clustering is the same as hierarchical clustering,
    but this time, we know in advance how many clusters to build. For a given measurement
    of the distance of individuals and for a number of known classes, one can easily
    imagine a simple and optimal classification solution: enumerate all possible grouping
    possibilities and keep the best. However, this solution is not applicable in practice,
    because the number of combinations of possible groupings becomes very quickly
    huge. Approximate solutions can be obtained through heuristics, and several algorithms
    of this kind exist. Their fundamental principle is contained in the method of
    mobile centers.


    # Mobile centers


    Let''s talk about some of the most popular variants of mobile centers, designed
    to improve certain aspects.


    Some variants They are numerous, and we will limit ourselves to mentioning four:


    +   - The k-means method: it works exactly like the mobile centers, with one difference,
    which is the calculation of the centers. A refocusing is done as soon as an individual
    changes cluster. It is no longer expected that all individuals assigned to a cluster
    to calculate the centers of gravity, they are changed as and when reassignments;

    - The dynamic cloud method: it favors the search for stable clusters. It is a
    generalization of mobile centers whose idea is to associate with each cluster
    a representative different from its center of gravity. In the majority of cases,
    the center of gravity is replaced by a set of individuals, called "stallsions"
    and constituting a "core". This nucleus is supposed to have better descriptive
    power than point centers. Note that more exotic representatives can be used: a
    straight line, a law of probability, etc.;

    - The Isodata method: the principle of mobile centers is preserved, but constraints
    will make it possible to control the development of clustering. These constraints
    serve to prevent the formation of groups with too small a number or a large diameter;

    - The k-medoids method: it is similar to the k-means method, with'
  - '[PAGE 82]


    one difference. Indeed, it will no longer define a class by a mean value (the
    center of gravity, on centroid), but by its most central representative (the medoid).
    It is, therefore, an individual from the cluster who will represent the latter.
    This method has the advantage of being more robust to outliers;


    +   - Self-Organizing Maps: this algorithm differs from mobile centers by updating
    neighboring clusters, where clusters become activatable neurons. This nonlinear
    method allows in fine to preserve all the topology of the data, starting more
    often from a rectangular grid of neurons which will be deformed.


    Let''s stop the enumeration of methods with names that are strange! We recommend
    that you select a "basic" method, such as a moving center or dynamic cloud, and
    then move on to more elaborate methods if the results are not satisfactory.


    Mixed approaches


    By mixing the approaches, we can take advantage of the main advantages of the
    different methods, nameley:


    +   - The capacity to analyze a large number of individuals, a strong point of
    non-hierarchical methods (for a number of observations greater than 103, it becomes
    difficult to apply hierarchical methods directly);


    +   - The choice of an optimal number of classes, made possible by the hierarchical
    classification.


    # Introduction to decision trees


    In their simple form, they are very rarely used in machine learning. On the other
    hand, the understanding of their principles and their methods of construction
    is a prerequisite for the study of the random forest, the first chapter of the
    part presenting the tools of "heavy artillery" which are at the disposal of the
    data scientist.


    # Principle


    The general purpose of a decision tree is to explain a value from a series of
    discrete or continuous variables. We are thus in a very classical case of matrix
    X with m observations and n variables, associated with a vector Y to explain.
    The values Y can be of two kinds:'
  - '[PAGE 83]


    +   - Continuous: one speaks then of the tree of regression;

    - Or qualitative: we will speak of the classification tree.


    These inductive methods have many advantages: they are fairly powerful, non-parametric
    and nonlinear. In principle, they will partition individuals by producing groups
    of individuals that are as homogeneous as possible from the point of view of the
    variable to be predicted, taking into account a hierarchy of the predictive capacity
    of the variables considered. This hierarchy makes it possible to visualize the
    results in a tree and to constitute explanatory rules explicit, oriented business.


    The main rules definition principles are as follows (inspired by Tufféry, 2011).
    Several iterations are necessary: to each of them, we divide the individuals into
    k classes (usually k = 2), to explain the output variable. The first division
    is obtained by choosing the explanatory best separation of individuals. This division
    defines subpopulations, represented by the "nodes" of the tree. Each node is associated
    with a measure of proportion, which makes it possible to explain the membership
    of a class or the meaning of an output variable. The operation is repeated for
    each subpopulation until no further separation is possible. We then obtain terminal
    nodes, called "leaves" of the tree. Each leaf is characterized by a specific path
    through the tree called a rule. The set of rules for all sheets is the template.


    The interpretation of a rule is easy if one obtains pure sheets (for example,
    100% of variables to be explained are TRUE or FALSE for a given rule). Otherwise,
    it is necessary to rely on the empirical distribution of the variable to predict
    on each node of the tree.'
