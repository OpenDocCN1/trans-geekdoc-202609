    ## 支持向量机 (SVM)


    作为一种监督式机器学习算法，它们使用支持向量机进行回归或分类挑战。但它们主要在分类问题中使用它。在这一算法中，我们将每个数据的数据项设计为 $n$ 维空间中的一个点，其中你拥有的特征数量为
    $n$，单个坐标的值与每个特征的值相同。然后，通过获取一个能够很好地区分两个类别的超平面，我们执行分类。


    ## 2. RISE 算法


    其本质可以非常概括为：每个案例都是一个属性对的向量 - 属性 $j$ 以及该示例所属的类别规格；属性可以是符号的和/数值的。每个规则都是针对背景 $Y$ 的合取而形成的。每个前件都是单个属性的条件，并且对于每个属性都存在一个前件，也就是说，可能存在某些不构成规则背景格式的属性。符号属性的条件是剩余的形状
    $ji \ v \to =$，其中 $ito$ 是属性，$j$ 是你的值之一。数值属性的条件采用类似于离散属性的允许形式，即两个值 $jji \text{
    } vv \to$，其中 $onejev Y$ 和 $twoj$ 是该属性的两个合法值。如果一个示例满足了规则的所有项，则该规则覆盖该示例；适用于一个示例的规则是根据稍后描述的距离度量与该示例最近的规则。RISE
    寻找“良好的”规则，现在将 $ito$ 推广到通用，从 $n$ 个示例的合取开始训练第一组规则。对于每个规则 $Y$，找到靠近不匹配类别的示例，即该规则没有覆盖的示例（即距离规则为
    0 的距离），并尝试从形式上泛化该规则以覆盖该示例。新规则加入规则集并替换旧规则，如果这种变化的影响（将规则包含在集合）对全局准确率是有正面的，反之则不加入集合。这些泛化是论文《一种概念学习的统一
    p 方法》中展示的一种算法，该论文是 Pedro Morais Sundays 在加州大学欧尔湾分校 获得计算机科学博士学位时提交的，年份为 1997 年，摘要由作者在
    2004 年提交。


    如果规则对规则集的全局精确度没有产生影响，也可以接受。更重要的是，对于每个失败的泛化尝试，它都会回复你。在最坏的情况下，它不产生任何泛化，最终结果是将每个共同训练的示例都视为副本的邻近分类器。每个测试示例的分类是通过找到与示例最接近的规则，并分配给所述规则的类别来实现。精确率（英语中为
    accuracy）对于示例集上的规则集 $RS$，其准确率 $Acc(RS)$ 定义为规则集正确分类的 $m$ 轴轴示例的比例，即当距离示例最近的规则的类别与示例的类别相同时，该规则正确分类了该示例。由于示例集是保持隐含的训练集（也就是说，准确率将表示为
    $Acc(RS)$）。精确率的衡量使用“留一法”逻辑方法：当尝试分类一个 $m$ 轴时，有关示例的规则从规则集中移除，除非它已经被另一个示例覆盖。每个示例都记录了它到规则的距离以及分配给该规则的类别，当它泛化为了一个规则时，有必要将该规则与所有
