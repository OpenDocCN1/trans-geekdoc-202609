    ```python

    # 这将填充 vectorizer 的 vocabulary_ 字典。

    # 让我们看看这个词表的结果

    print(vectorizer.vocabulary_.keys())

    ```


    12. 你听过词袋模型（Bag-of-Words model）吗？

    词袋模型是一种在信息检索和自然语言处理中非常常用的技术。它也被称为向量空间模型，在上面的第 6 题进行了详细描述。它使用单词在文档中的频率作为特征值。

    该方法的一个局限性是它不考虑单词的上下文。例如，如果你取这些句子 "Apple have become a trillion dollar company"
    和 "You should eat apple every day"，词袋模型将无法区分作为公司的苹果和作为水果的苹果。为了解决这一局限性，你可以使用 N-gram
    模型，它存储单词的空间信息。词袋模型是 n=1 时 N-gram 方法的一个特例。

