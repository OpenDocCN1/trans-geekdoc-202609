    如果你在尝试后没有得到预期的感官或结果，那么是时候做出一些改变了。也许是你输入了过多的数据，或者数据类型错误，甚至是数据量不足。稍微调整一下并看看这对你的预测结果产生什么影响，可能正是你正在寻找的改变。


    ## 算法并不总是正确的


    在本指南中，我们花费了大量时间研究你可以关注的各种算法。这些都是帮助你获得理想结果的绝佳工具，但它们并不总是正确的。如果我们开始将它们视为能够瞬间解决我们所有问题的“灵丹妙药”，这可能会是一件坏事。


    机器学习的实现在不断的试错过程中才能发挥最佳作用。无论你认为所使用的算法有多好，只要系统与另外一个人或多人进行任何形式的互动，就必须随着时间的推移对其进行调整。企业需要不断衡量其实施的有效性，并找出是否存在任何变量和变化会使其变得更好或更差。


    这听起来工作量很大，而且当你刚进入机器学习领域时，可能会觉得有些困惑。但这是你需要关注的。很少有企业在这样做。相反，他们假设自己的算法是完美的，永远不需要更改。这会让情况恶化，随着时间的推移，算法会变得非常落后，至于无法为你提供准确的结果。


    想要用算法部署系统并希望它完美地工作，而无需投入任何工作来维持这种状态，这是很正常的。虽然那是理想世界，但并不是我们任何人都可以依靠的现实。没有任何算法或用户界面设计能够长期存在。也没有任何数据收集方法不会被取代。


    这意味着无论你决定使用哪种算法，随着时间的推移都需要进行一些调优和调整。如果你跟进并且不让它被闲置，那么这些调整可能很小，不需要你花费大量精力就能完成。最大的问题将出现在你开始忽略这一步时，随后问题就会相互累积。记住，任何算法，无论看起来多么完美，都是不完美的，你确实需要偶尔检查它。


    ### 选择多样化的工具集


    正如你从本指南以及你可能对机器学习进行的其他研究中想象的那样，这个领域有很多不同的工具可以使用，而且其中许多工具是免费提供的！这是一件好事，它让你能够接触到无数资源来帮助你起步。


    但考虑到这一点，不要让自己固着在某一种工具上。你可能有一个最喜欢的工具，并想一直使用它。但现实中，当你从事机器学习时，你真的需要出出几种工具才能成功。如果周围有人试图说服你某一个工具是唯一有效的，而你不需要其他任何工具，那么是时候远离他们并学习世界上真正存在的其他工具了。


    机器学习的奇之处在于，它正增长得惊人，有许多人对学习更多知识并将其用于自己的需求感兴趣。来说是个好消息，因为会有很多不同的工具可用。尝试几种，找出最适合你的那一个。并考虑这样一个事实：你将需要使用其中的几种工具来帮助完成工作。


    ## 尝试一些混合学习


    你可以尝试的另一个想法是混合学习（hybrid learning）。你可以将一些深度学习与廉成本学习（cheap learning）混合在一起，得出一个混合体。一个例子是，你可以获取计算机上已有的视觉模型，然后重构顶部的几层——即那些包含你想要做的决策的层。从那里开始，你可以借用现有的框架，并将其用于新案例。


    这是你真正创造新事物的一种极佳方法，无需从头创建整个东西。你可以使用已经存在的技术和框架，然后添加其中的一些规范和更多内容，以获得你想要的结果。


    这可能需要一些工作。但请仔细思考你想要处理的项目。将其拆分为一些较小的部分，并弄清楚是否有现有的平台或框架可以用来启动工作。一旦你有了这些，你就可以检查并进行必要的更改，也许可以使用我们已经在流程中并在上面讨论过的某些算法来实现这一目标。


    这在许多方面都是一种优势。首先，你将使用的框架在大多数情况下是免费的，或者至少不会花费你太多钱。这意味着与从零开始完全重新创建你想要相比，你可以使用它们并节省资金。在商业活动中，能够省钱总是一件好事。你仍然可以使用过程中所需的深度学习，但你获得了节省资金的益处。


    另一个优势是，你可以节省一些时间。你将使用的许多框架创建起来需要花费大量时间。如果你能够使用或购买你喜欢的某一个，最终可以节省大量时间。因为 AI 能够快速、高效且往往是独特地分析数据，机器学习工具


    ## 14. AI 的优势


    AI 的一个核心优势是，消费者和企业都将从人工智能技术的改进中获益。可以利用技术来改善客户成果并使提供者更高效，特别是在医疗保健领域。医疗保健的许多方面使该行业容易受到
    AI 进展的影响。


    例如，如果患者遭受了某种类型的中风，他们需要在特定的窗口内由提供者评估并在高级医疗中心接受治疗，以获得某些药物。AI 在这种情况下提高提供者护理能力的方法包括：在患者到达中心之前为医生和团队提供相关的患者信息，并通过对患者数据进行分析来协助提供者做出诊断。


    这种类型的 AI 能力属于深度学习，因为它需要 AI 代理使用训练数据来帮助它们学习如何区分一种类型的患者和另一种类型的患者。AI 使用无监督或半监督学习对数据进行分类的能力是
    AI 研究中的一个重要维度，因为它允许 AI 以类似于人类的方式（甚至更好）学习模式。目前这种学习方式的局限性在于，AI 并不总是能将其从以往经验中学到的知识应用于新经验，因此在医疗保健领域的此类应用需要医疗人员的监督，AI
    才能被相对独立地行动。


    在这些领域 AI 的进展可能会为企业节省数十亿美元并增加利润，因此对于商业领袖甚至普通人来说，可能是明智的


