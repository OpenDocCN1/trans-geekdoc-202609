    在使用符号属性值时，如果出现某个属性的多个 VA，在平局的情况下将产生较小距离比例的结果，他可能会随机选择属性值以实现最小化，而这个使距离最小的值，确实可以被视为该值集合的“平均值”。形式上，如文所述：一组值的介数他可以定义为值
    $m$（属性的一个值），它使得集合的方差最小，即：


    ```

    $$m = \min \quad (6)$$

    ```


    其中 $J$ 是符号属性的属性集合，$v$ 是集合 $J$ 中的一个值，$Jm$ 将作为集合 $J$ 中所有值的最佳方法，类似于对于数值值也是如此，$m$
    将被集合 $J$ 中的每个值替换，使方程最小的 $m$ 值将作为“符号值集合 $J$ 的平均值”。这个获得的作为“中值”的属性值 $m$，他可以用该属性的缺失值之一来替换，这是正常的，其效果等同于数值属性缺失值的情况。在获得一组“正常”训练集（无属性缺失）后，我们在上面布线了与数值属性缺失相同的概念，你将获得分类中最佳或相似的精度，他将与原始训练集一起使用。这种想法相反，为了计算
    $m$，他需要获取符号属性值对之间的距离，并且，确实，是计算 $(x_{ji} x,SVDM)$，其元素数量等于一组相同元素重复的变异数量，等同于该属性拥有的值数量，以便同时设置两个值。作为符号属性对
    $i$ 的不同值的数量，计算 $A_i^2$ 实例数量（即他可以形成的值对数量，其中每个对中每个元素占据的顺序是有重要的），并且对于条目集中的每个至少有一个缺失值的每个符号属性，都必须计算这些距离之和。这些
    $(x_{ji} x,SVDM)$ 是一个实例函数，其中 $0=x)d (x, Y)$，其目的是避免之前的计算（一个值到其自身的距离为零）$Y$ 的计算。对于他的符号属性
    $I$，他知道数量为 $A_i^2 - A_i$。也可以利用 $x)d(Y=Y)d (x)$ 这一事实并据此进一步减少计算量，但这会增加括号内表达式逻辑计算的复杂性。


    他对符号值中值计算的优化：在计算了每个符号值相对于其第一个值的距离总和后，对于第二个值，它在改变属性的其他值，并且-在累积距离总和的之后，如果它小于总和-或者所有人相对于第一个值的距离总和，是的，他们遍历了属性的所有值，在路径上，他知道某些距离，所有属性值相对于第二个值的距离是收到的总和，并且在情况下，并产生一个新的更小的距离总和
    $Y$。在这种情况下，他所获得的属性值将增加。


    相反，如果左侧累积距离之和小于总和，则更改属性的第三个值，而没有必要运行所有值，不知道最小和并开始计算所有值相对于第三个值的距离累积和，依此类推。通过这种方式，他大大减少了计算，达到了足以证明使用该提议来权衡算法复杂度增加之代价的水平，在最坏情况下，即“中值”是属性值的最后一个值时，它对于具有更多不同值的属性值数量是二次的，且该属性至少有一个缺失值。


    ARISE 的潜力


    1. 引入了一种处理缺失值属性的替代策略，并且-他得出了新生成策略的优势。

    2. 它采用了一种减少规则数量的策略，这种策略被发现是有效的且不会降低分类精度。他通过移除被其他规则吸收的规则来选择。当满足以下条件时，一个规则吸收或包含另一个规则，两个规则属于同一类别：


    - 如果是符号属性：它们的权重相等，或者在一个或多个规则中呈现了属性值。

    - 如果属性是数值的：条件的下限（INF）小于或等于另一个的，且上限（SUP）大于或等于另一个的。

    - 如果上述对于对于规则中出现的所有术语都满足，则说一个包含或包含另一个。例如：A Yes outlook sunny Y 69 <= temperature
    <= 75 Y 70 <= humidity <= 70 Then is


    3. 发现了导致分类不准确的原因：训练集中同一个用例存在多个实例，这是其生成器在网络上讨论的概念性错误，并将构成未来工作的对象。

    4. ARISE 对数据输入进行验证，并为分类案例的获取以及训练集的创建和编辑提供便利，适用于非专业用户

    5. 导出到多种语言有助于最终专家系统的创建。

