    # Connecting the Pieces


    Now it''s time to put everything together and learn what is the most efficient
    way of connecting all the elements together. To better illustrate the implementation
    of a convolutional net, we are going to take a real world example and pick it
    apart.

    One of the most well-known convolutional nets is called “LeNet”, which has been
    around since the 80s. It''s best known for its performance when working with images
    and handwritten digits, and that is what we are mainly interested in. This network
    relies on alternating convolution, pooling layers, and an MLP. In case you are
    not aware, pooling layers are often placed between convolutional layers because
    it reduces the number of parameters and computation needed inside the network.

    The layers are connected partially, but the MLP is entirely connected. Every layer
    is composed of channels that allow us to build powerful filters. The pooling layers
    are implemented for dimensionality reduction so that the output is equivalent
    to the input. We also have a connected layer to which all computations are communicated.
    Here''s a diagram of a LeNet layer to give you a better idea of the architecture:


    ![](img/6998b8ee78c0efcd8b5f617f7d5ea786_27_0.png)


    While this implementation is great for some applications, it is not an efficient
    solution for everything. In many cases, this architecture won''t perform well
    when it comes to more challenging scenarios. Likely there''s another architectural
    version of the LeNet network, and that is GoogleNet. Also known as Google’s Inception
    network, this architecture was developed to handle challenging image data. What
    do we refer to as challenging? You know all those terrible quality pictures and
    videos shot with a phone in low'
