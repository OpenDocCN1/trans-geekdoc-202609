    卷积神经网络的设计灵感源于大脑的视觉皮层。这赋予了人类处理和分析视觉图像的能力。视觉层中存在光光感受器，它们在重叠的层中捕捉光线。这部分是这些图像识别算法在人工智能和机器学习领域如此流行的原因之一。


    以下是卷积神经网络在现实世界中一些示例。有时理论太枯燥，无法让你直观地感受到这种神经网络在该领域的实际影响，但也许一些示例能更好地说明它的应用。


    广受欢迎的社交媒体平台 Facebook 可能是最著名的例子。Facebook 创建了 DeepFace，这是一种能够极高精度识别人脸的面部识别系统。某些来源甚至报道其准确率达到了
    97%。请记住，FBI 自己的面部识别系统据称准确率仅为 85%。另一个使用卷积神经网络的有趣程序是 DeepDream，由 Google 的一名工程师创建。在这个例子中，神经网络被通过赋予图像幻觉的外观来增强图像。通过算法空想性（algorithmic
    pareidolia）对图像进行过度处理。微软和 IBM 等其他大型科技公司也利用 CNN 开发了智能软件。


    # 理解架构


    卷积神经网络的拓扑结构类似于多层感知器。它是一个无环图，由包含少量节点的层组成，每层都与下一层进行通信。


    这里值得提及的最重要区别之一是，这种神经网络具有相同的神经元。换句话说，我们拥有相同的参数值以及权重值。这使得 CNN 极其高效，因为需要计算的值较少。另一个关键区别是节点通信是有限的。这意味着节点输入是本地连接的，仅连接相邻节点。


    ### 层


    然后我们有一个由 4 个参数组成的过滤器，它被顺序应用于层以创建特征图。这四个过滤器参数被称为超参数，它们代表尺寸、深度、步长（stride）和零填充（zero-padding）。尺寸通过计算该过滤器的表面积来确定。在这里我们应该记住，过滤器的大小对输出有影响。这意味着我们需要精确控制输出，以便获得高效的网络。值得提到的是，较大的过滤器通常会重叠，但这可以为我们所用，因为它可以提高准确率。


    过滤器深度大约是层内部有多少个节点，以及在输入周围的相同区域有多少个节点连接在一起的。请记住，我们仍然在讨论图像，当我们谈论深度时，我们指的是图像内容。如果你用过
    Photoshop 或任何其他图像编辑或处理软件，你可能已经知道颜色通道了。它们是描述图像内容所需要的，神经网络节点是为了感知红、绿、蓝颜色通道而映射的。这就是为什么在许多情况下过滤器深度被设置为
    3。如果我们增加过滤器参数，就可以获得更多关于图像的数据，并揭示其他难以学习的属性。然而，如果我们将深度设置为低值，得到的结果就会较弱。


    第三个过滤器参数是步长，它的值决定了神经元之间的间距。如果步长等于 1 且我们正在处理图像，我们将每个像素设为过滤器的中心。这会导致输出增加并产生大量的层重叠。我们可以通过增加步长值来减少重叠，但请记住输出的尺寸也会减小。在这种情况下，微调的方法是简单地根据准确率和尺寸之间的平衡做出判断。然而，在大多数情况下，坚持使用较低的值可能是一个好主意。


    第四个也是最后一个过滤器参数允许我们减少层的输出尺寸。零填充通过将感受野的边界值设置为 0 来实现这一点。在卷积神经网络中，当我们谈论感受野（receptive
    fields）时，指的是对网络中任何特定单元产生影响的输入空间。作为一个警告，当你设置零填充时，确保所有区域仍被过滤器覆盖。适当零填充设置的另一个大优势是能够调整输入和输出使其具有相同的尺寸。使输入和输出层的大小相等是非常标准的做法，因为这允许我们高效地调整深度和步长参数。如果没有任何零填充，我们需要花费大量精力来正确设置参数并提高网络性能。如果没有填充，过滤器的边缘可能会损坏。


    现在问题是，我们在设置网络时如何校准所有这些参数呢？这里有一个简单的公式。如下所示：


    O 代表层的输出，W 代表图像尺寸，F 代表过滤器尺寸，P 代表步长。在应用该公式时请记住，层的输出并不总是整数值，这可能会导致各种问题。幸运的是，你可以通过对步长进行调整来补偿。


    现在你对卷积层及其参数有了更多的了解，让我们讨论一下到底什么是卷积。简单来说，它是一个数学算子，就像乘法一样，主要用于将复杂的方程分解为更简单的形式。换句话说，该过程在对两组数据进行操作后会产生第三个函数。这产生了一个新函数，该函数实际上是两个原始函数的导数。


    当我们处理卷积神经网络时，将输入作为第一个元素。当我们对图像应用此过程时，实际上是图像的宽度和高度。第二个组件是卷积核，它由浮点数组成。这些数字的范围从 0
    到 255。这就是我们发现卷积的主要优势。


    实际上，每一层都由通道组成，这允许我们构建强大的过滤器。该过滤器遍历输入并写入特征图。不需要特征工程。


    # 连接组件


    现在是时候将所有元素整合在一起，学习连接所有元素的最有效方法了。为了更好地说明卷积网络的实现，我们将选取一个现实世界的示例并进行拆解。最著名的卷积网络之一被称为
    LeNet，它自 80 年代以来一直存在。它因处理图像和手写数字时的性能而闻名，这也是我们主要感兴趣的。该网络依赖于交替的卷积、池化层和 MLP。如果你不知道，池化层通常放置在卷积层之间，因为它允许降维，使输出与输入相等。我们还有一个连接层，所有计算都通信到那里。这里有一个
    LeNet 示意图，让你对架构有更好的直观认识：


    ![](img/6998b8ee78c0efcd8b5f617f7d5ea786_27_0.png)


    虽然这种实现在某些应用中很棒，但它并不是所有问题的有效解决方案。在许多情况下，这种架构在面对更具挑战性的场景时表现可能并不理想。LeNet 网络可能还有另一个架构版本，那就是
    GoogleNet。也称为 Google 的 Inception 网络，该架构是为了处理具有挑战性的图像数据而开发的。我们所指的挑战性是指什么？你知道那些用手机在低光照下拍摄的、质量糟糕的图片和视频。

    '
