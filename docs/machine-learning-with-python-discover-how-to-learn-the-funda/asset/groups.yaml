    # 4.Natural Language Processing


    Natural Language Processing (NLP) is a widely used field within Artificial Intelligence
    which mainly involves the interactions between the human language and the computer.
    You can find its applications in a large variety of areas as Sentiment analysis,
    Spam detecting, POS (Part-Of-Speech) Tagging, Text summarization, Language translation,
    Chatbots and so on.


    How would you explain NLP to a layman? Why is it difficult to implement?


    NLP stands for Natural Language Processing, the ability of a computer program
    to understand the human language. It is an extremely challenging field for obvious
    reasons. NLP requires a computer to understand what humans speak very often not
    precise. Humans use slang, pronounce the words differently and can have context
    in their sentences which is very hard for a computer to process correctly.


    What is the use of NLP in Machine Learning?


    At present, NLP is based on Deep Learning. Deep Learning algorithms are a subset
    of Machine Learning, which need a large amount of data to learn high-level features
    from data on their own. NLP also works on the same approach and uses deep learning
    techniques to learn human language and improve upon itself.


    What are the different steps in performing Text classification?


    Text classification is a NLP task used to classify the text documents into one
    or more categories. Classifying whether an email is spam or not, analyzing an


    person’s sentiments from his post, etc. are text classification problems.


    A Text classification pipeline involves following steps in order:


    +   Text cleaning

    - Text annotation to create the features

    - converting those features into actual predictors

    - using the predictors to train the model'
  - '[PAGE 30]


    fine-tune the model to improve its accuracy.


    4 What do you understand by Keyword Normalization? Why is it needed?

    Keyword normalization, also known as tense normalization, is a crucial step in
    NLP. It is used to transform the keyword into its canonical form, which makes
    it easier for later processing. It removes stop words such as punctuation marks,
    words like "a", "an", "the" because these words generally do not carry any weight.
    After that, it converts the keywords into their standard forms which improve text
    matching.

    For instance, reducing all tense to lower cases, converting all tenses to simple
    present tense. So, if you have "decoration" in one document and "Decorated" in
    the other, then both of them would be indexed as "decorate". Now, you can easily
    apply a text matching algorithm on these documents and a query containing a keyword
    "decorates" would match with both of the documents. Keyword normalization is a
    very good means of reducing the dimensionality.


    5 Tell me about Part-of-speech (POS) tagging.

    Part-of-speech tagging is a process of marking the words in a given text as a
    part of speech such as noun, preposition, adjective, verb etc. It is an extremely
    challenging task because of its complexity and owing to the fact that the same
    word could represent a different part of speech in different sentences.

    There are generally two techniques used to develop POS tagging algorithms. The
    first technique is stochastic, which assumes that each word is known and can have
    a finite set of tags which are learnt during training. And the second technique
    is rule-based tagging, which uses contextual information to tag each word.


    6 Have you heard of the Dependency Parsing algorithm?

    Dependency Parsing algorithm is a grammar-based text parsing technique which is
    used for detecting verb phrases, noun phrases, subject and object in'
  - '[PAGE 31]


    the text. "Dependency" implies the relations between the words in a sentence.
    There are various methods to parse a sentence and analyze its grammatical structure.
    Some of the common methods include Shift-Reduce and Maximum Spanning Tree.


    # 7 Explain Vector Space Model and its use.


    Vector Space Model is an algebraic model which is used to represent an object
    as a vector of identifiers. Each object (such as a text document) is written as
    a vector of terms (words) present in it with their weights. For instance, you
    have a document "d" with the text "This is an amazing word for the interview preparation.

    The corresponding vector for this document is:


    ```

    d = (W_{amazing}, W_{an}, W_{book}, W_{for}, W_{interview}, W_{is}, W_{preparation},
    W_{the}, W_{this})

    ```


    There exist many ways to calculate these weights W_i. They can be as simple as
    the frequency (count) of the words in a document. Similarly, any query is also
    written in the same fashion. And, the vector operations are used to compare the
    query with the documents to find the most relevant documents that satisfy the
    query.

    Vector Space Model is used extensively in the fields of Information Retrieval
    and Indexing. It provides a structure to the unstructured datasets, thereby making
    it easier to interpret and analyze them.


