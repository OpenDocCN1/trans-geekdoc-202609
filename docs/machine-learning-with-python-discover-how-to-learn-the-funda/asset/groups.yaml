    我们从掷骰子作为随机变量的例子开始。我们将观察的随机变量用 X 表示，它将取决于你掷骰子后得到的结果。这里自然产生的 X 的选择将把标记为 1 的结果映射到值
    $i$。


    这意味着，如果 X 等于 1，你就将骰子掷出 1 的事件映射到它。你可以将此映射到骰子上的任何数字，甚至可以更进一步，选择一些稍微奇异的映射关系。例如，你可以映射
    Y 使得结果为 0。执行这个过程可能很困难，我们不会在上面上花费太多时间，但它可以帮助你理解它是如何运作的。当我们准备好写出这个时，我们会有概率，显示为随机变量
    X 结果 1 的概率。它看起来如下：


    $P_X(i)$ 或 $(x=i)$


    ## 分布


    现在我们需要查看这里指的是什么，我们将查看该随机变量每个结果的概率是多少。或者简单来说，我们将看到掷骰子时得到特定数字（如 6 或 3）的概率有多大。


    开始，我们需要看一个例子。我们让 X（或随机变量）成为我们掷骰子后得到的结果。我们还假设骰子没有经过手脚，因此在每次掷骰子时，六个面出现的概率相同。掷骰子并得到特定数字的概率分布包括：


    $P_X(1) = P_X(2) = \dots = P_X(6) = 1/6$


    在这个例子中，它与我们对随机变量的操作是一样的，但它具有不同类型的含义。你的概率分布是关于可能发生的事件谱，而我们的随机变量示例完全是关于存在哪些变量。通过概率论，$P(X)$
    部分将注明我们正在处理随机变量 X 的概率分布。


    在查看这些示例时，你可以注意到你的分布有时会同时包含两个或多个变量。当这种情况发生时，我们称之为联合分布。如果存在多个变量，你的概率现在将由每个变量决定，并且涉及其中。


    为了看到这个过程是如何运作的，假设 X 是随机的，并由你掷骰子得到的结果定义，而 Y 是一个随机变量，将告诉你抛掷硬币时的结果。如果你最后得到正面，我们给这次抛硬币赋值
    1，如果是反面，则显示 0。这让我们在确定这两个变量的概率分布时变得更容易。


    ## 独立性


    在机器学习中，你可以处理的另一个变量是确定问题具有多大的独立性。当你处理随机变量时，你会发现只要在向方程引入新变量时变量分布不改变，它们就会与其他随机变量相互独立。


    当你已经了解独立性时，可以对机器学习中的数据做出一些假设以使问题变得简单。一个例如，“j 和 i”的训练样本将与任何底层空间独立，在这些空间中，“i”的标签不受特征“j”的影响。无论其中一个变量的结果如何如何。


