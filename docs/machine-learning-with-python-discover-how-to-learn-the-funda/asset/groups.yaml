    # 5.Logistic Regression


    Machine learning models usually boil down to predicting a quantitative outcome
    or a qualitative class. The former is commonly referred to as a regression problem,
    and in the case of linear regression this involves predicting a numeric outcome
    based on the input of continuous variables. In the case of predicting a qualitative
    outcome (class), the task is considered a classification problem. Examples of
    classification problems include predicting what product a user is likely to buy
    or predicting if a target user will click on an online advertisement (Yes/No).


    Not all algorithms, though, fit cleanly into this simple dichotomy and logistic
    regression is a clear example. Logistic regression is part of the regression family,
    because as linear regression, it involves predicting outcomes based on analyzing
    quantitative relationships between variables. Unlike linear regression, it accepts
    both continuous and discrete variables as input and its output is qualitative;
    it predicts a discrete class as Yes/No or Customer/Non-customer.


    Logistic regression analyzes relationships between variables and assigns probabilities
    to discrete outcomes using the Sigmoid function, which converts numerical results
    into an expression of probability between 0 and 1.0. A value of 0 represents no
    chance of occurring, whereas 1 represents a certain chance of occurring. For binary
    predictions, we can assign two discrete classes with a cut-off point at 0.5. Anything
    above 0.5 is classified as class A and anything below 0.5 is classified as class
    B.


    # A sigmoid function used to classify data points


    After assigning data points to a class using the Sigmoid function, a hyperplane
    is used as a decision boundary to split the two classes to the best of its ability.
    The decision boundary can then be used to predict the class of future data points.


    Logistic regression hyperplane is used to split the two classes


    Logistic regression can also be used to classify multiple outcomes but is generally
    used for binary classification (predicting one of two discrete classes). Other
    techniques, including the Naive Bayes classifier and support vector machines (SVM),
    are considered more effective at classifying multiple discrete outcomes.'
