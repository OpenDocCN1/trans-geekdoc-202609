    光照条件以及存在大量噪声？这正是卷积网络本应该处理的问题。互联网上发现的图像数据包含大量的杂质和噪声，因此使其看起来颗粒度极高且难以理解。


    # 4. 自然语言处理


    自然语言处理（NLP）是人工智能中一个广泛使用的领域，主要涉及人类语言与计算机之间的交互。你可以在许多领域发现它的应用，如情感分析、垃圾邮件检测、词性标记（POS
    tagging）、文本摘要、语言翻译、聊天机器人等。


    你会如何向外行解释 NLP？为什么实现起来很困难？


    NLP 代表自然语言处理（Natural Language Processing），计算机程序理解人类语言的能力。由于显而易见的原因，这是一个极具挑战性的领域。NLP
    要求计算机理解人类说的话，而这些话往往并不精确。人类会使用俚语、以不同的发单词，并且句子中可能包含上下文，这对于计算机正确处理起来非常困难。


    NLP 在机器学习中的作用是什么？


    目前，NLP 基于深度学习。深度学习算法是机器学习的一个子集，它们需要大量的数据来从数据自动学习高层特征。NLP 也采用相同的方法，利用深度学习技术来学习人类语言并不断改进自身。


    执行文本分类的各个步骤是什么？


    文本分类是一种 NLP 任务，用于将文本文档分为一类或多个类别。判断一封邮件是否为垃圾邮件、分析人的帖子的情绪等，都是文本分类问题。


    一个文本分类流水线顺序涉及以下步骤：


    - 文本清洗

    - 文本标注以创建特征

    - 将这些特征转换为实际预测器

    - 使用预测器训练模型

    - 微调模型以提高其准确性。


    4. 你如何理解关键词规范化（Keyword Normalization）？为什么需要它？

    关键词规范化，也称为时态规范化（tense normalization），是 NLP 中关键的一步。它用于将关键词转换为规范形式，以便于后续处理。它会移除停用词，例如标点符号以及
    "a"、"an"、"the"，因为这些词通常不带有任何权重。之后，它将关键词转换为标准形式，从而提高文本匹配。

    例如，将所有时态转为小写，将所有时态转换为一般现在时。因此，如果你在一份文档中有 "decoration"，在另一份文档中有 "Decorated"，那么它们都将被索引为
    "decorate"。现在，你可以轻松地对这些文档应用文本匹配算法，包含关键词 "decorates" 的查询将同时匹配这两个文档。关键词规范化是减少维度的一种非常有效的方法。


    5. 告诉我关于词性标记（POS tagging）的信息。

    词性标记是将给定文本中的单词标记为词性（如名词、介词、形容词、动词等）的过程。这是一项极具挑战性的任务，由于其复杂性，且同一个单词在不同的句子中可能代表不同的词性。

    通常有两种技术用于开发 POS 标记算法。第一种技术是随机的，它假设每个单词都是已知的，并且有一组在训练期间学习的有限标签。第二种技术是基于规则的标记，利用上下文信息来标记每个单词。


    6. 你听过依赖解析（Dependency Parsing）算法吗？

    依赖解析算法是一种基于语法的文本解析技术，用于检测文本中的动词短语、名词短语、主语和宾语。“依赖”意味着句子单词之间的关系。有多种方法解析句子并分析其语法结构。常见方法包括移位还原（Shift-Reduce）和最大生成树（Maximum
    Spanning Tree）。


    # 7. 解释向量空间模型（Vector Space Model）及其用途。


    向量空间模型是一种代数模型，用于将对象表示为标识符的向量。每个对象（如文本文档）被写为其中包含的词项（单词）及其权重的向量。例如，你有一份文档 "d"，文本内容为
    "This is an amazing word for the interview preparation."


    ```

    d = (W_{amazing}, W_{an}, W_{book}, W_{for}, W_{interview}, W_{is}, W_{preparation},
    W_{the}, W_{this})

    ```


    有许多方法可以计算这些权重 W_i。它们可以简单如文档中单词的频率（计数）。同样地，任何查询也以相同的方式编写。使用向量操作来比较查询与文档，以找到满足查询的最相关文档。

    向量空间模型广泛应用于信息检索和索引领域。它为非结构化数据集提供了一种结构，从而使其更容易被解释和分析。


    # 8. 你说的词频（Term Frequency）和逆文档频率（Inverse Document Frequency）是指？


    词频（tf）是一个术语在文档中出现的次数除以该文档中术语的总数。

    逆文档频率（idf）衡量该术语在所有文档中的相关性。在数学上，它是（文档总数除以包含该术语的文档数）的对数。


    # 9. 简单地解释余弦相似度（cosine similarity）。


    余弦相似度捕捉两个向量之间的相似性。正如向量空间模型中所述，每个文档和查询都被写为词项的向量。


    计算查询向量与每个文档之间的余弦值，即两个向量之间的归余弦。得到的余弦值代表文档的相似性。如果余弦值为 0，则完全没有相似性；如果为 1，则文档与查询相同。


    # 10. 解释 N-gram 方法。


    简单来说，N-gram 是文本中 n 个项的连续序列。N-gram 方法是一种概率模型，用于根据之前的 n-1 个项目预测序列中的某一项。你可以选择单词或短语作为项目，如果
    n 为 1，它被称为 1-gram；对于 n = 2，它是 big-ram，以此类推。N-gram 可用于近似匹配。由于它们将序列转换为 n-gram 集合，你可以通过测量共同
    n-gram 的百分比来比较两个序列。


    11. 从句子 "I love New York style pizza" 中可以生成多少 3-grams？


    将句子拆分为 3-grams，你得到：


    - I love New

    - love New York

    - New York style

    - York style pizza


    ```

    # 我们将使用 CountVectorizer 包来演示如何结合 Scikit-Learn 使用 N-Gram。

    ```


    ```python

    # CountVectorizer 将一组文本文档转换为标记计数矩阵。

    ```


    ```

    # 在我们的情况下，只有一个文档。

    ```


    ```python

    from sklearn.feature_extraction.text import CountVectorizer

    ```


    ```python

    # ngram_range 指定了提取的 N-gram 标记范围的上下边界。

    # 对于我们的示例，范围是从 3 到 3。

    # 我们必须指定标记模式，因为默认 CountVectorizer 将单字符单词视为停用词。

    ```


    ```python

    vectorizer = CountVectorizer(ngram_range=(3, 3),

    token_pattern=r"(?u)\b\w+\b",

    lowercase=False)

