    非层次聚类的目标与层次聚类相同，但不同的是，这次我们预先知道了要构建多少个簇。对于给定的个体间距离测量值以及已知的类别数量，人们很容易想象出一种简单且最优的分类方案：枚举所有可能的分组方案并保留最佳的一个。然而，这种方案在实践中是不可行的，因为可能分组的组合数量会迅速变得巨大。可以通过启发式方法获得近似解，并且存在几类此类算法。它们的根本原理包含在移动中心法中。


    # 移动中心 (Mobile centers)


    让我们讨论移动中心的一些最流行的变体，这些变体旨在改进某些方面。


    变体数不胜完，我们将仅限于提到四种：


    - k-means 方法：它的工作方式与移动中心完全相同，不同之处在于中心的计算。每当一个个体改变簇时，就会进行重新聚焦。它不再等待所有分配到某个簇的个体完成后再计算质心，而是在重新分配时立即进行更改；

    - 动态云方法：它侧重于寻找稳定簇。它是移动中心的一种推广，其核心思想是为每个簇关联一个不同于其质心的代表点。在大多数情况下，质心被一组个体取代，称为“种马”（stallsions），并构成一个“核心”。这个核心被认为比点中心具有更好的描述能力。注意，可以使用更奇特的代表点：直线、概率分布律等；

    - Isodata 方法：保留了移动中心的原理，但通过约束条件使得聚类的发展变得可能。这些约束有助于防止形成数量过少或直径过大的群体；

    - k-medoids 方法：它与 k-means 方法相似，但有一点不同。事实上，它不再通过平均值（基于质心的质心）来定义类别，而是通过其最中心的代表点（中位数点，medoid）来定义。因此，它是簇中的一个个体来代表该簇。这种方法的优点是对离群值更具鲁健性；

    - 自组织映射（Self-Organizing Maps）：该算法与移动中心的不同在于它会更新邻居簇，其中簇变成了可激活的神经元。这种非线性方法能够精细地保留数据的所有拓扑结构，通常从一个会发生变形的矩形神经元网格开始。


    让我们停止列举这些名字奇怪的方法吧！我们建议你先选择一种“基础”方法，如移动中心或动态云，如果结果不令人满意，再转向更复杂的方法。


    ## 混合方法


    通过混合这些方法，我们可以利用不同方法的主要优势，即：


    - 分析大量个体的能力，这是非层次方法的一个强点（对于观测值大于 $10^3$ 的情况，直接应用层次聚类方法变得困难）；

    - 选择最优的类别数量，这通过层次分类成为可能。


    # 决策树引论


    在简单形式下，它们在机器学习中很少使用。另一方面，理解它们的原理和构建方法是研究随机森林的前提，而随机森林是介绍数据科学家可以使用的“重型火器”工具部分的第一章。


    # 原理


    决策树的通用目的是通过一系列离散或连续变量来解释一个值。因此，我们处于一个非常经典的案例：具有 $m$ 个观测值和 $n$ 个变量的矩阵 $X$，关联一个待解释的向量
    $Y$。$Y$ 的值可以是两种：


    - 连续的：此时称为回归树；

    - 或定性的：我们称为分类树。


    这些归纳方法有许多优点：它们相当强大、是非参数且是非线性的。原则上，它们通过产生个体组来划分个体，这些组从待预测变量来看尽可能同质的，并考虑了所考虑变量预测能力的层次结构。这种层次结构使得能够以树的形式视觉化结果，并构成显式的、面向业务的解释性规则。


    主要规则定义的原理如下（受 Tufféry, 2011 启发）。需要多次迭代：在每次迭代中，我们将个体划分为 $k$ 类（通常 $k = 2$）以解释输出变量。第一次划分通过选择对个体的最优解释分离来获得。这种划分定义了子群体，由树的“节点”表示。每个节点与一个比例度相关，这使得解释类的身份或输出变量的意义成为可能。对每个子群体重复此操作，直到无法进一步分离。我们得到终端节点，称为树的“叶节点”。每个叶节点通过通过树的特定路径来描述，该路径称为规则。所有叶节点的规则集就是模板。


    如果能获得纯叶节点（例如，对于给定的规则，100% 的待解释变量均为 TRUE 或 FALSE），那么规则的解释就很简单。否则，则需要依赖变量的经验分布在树的每个节点上进行预测。


    # 13. 让机器学习为你服务的贴士


    现在，我们已经在本指南中花了一些时间审视了机器学习以及所有包含其中的优秀学习算法，以及监督学习、无监督学习和强化学习随附的不同类别，现在是时候真正将它们付诸实践了。在许多不同的情况下，你都可以利用从机器学习中学到的知识，如果你能做到，将会产生真正的影响。


    在工作时你可以遵循的一些贴士包括：


    记住逻辑


    当你从事机器学习时，请记住，成功并不总是仅仅是选择正确的算法或工具。事实上，它需要更多。每个项目都是不同的，如果你尝试对每个项目都使用相同的方法，将会出现机器学习失效的情况。

