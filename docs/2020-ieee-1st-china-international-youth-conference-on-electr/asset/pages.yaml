    # D. BP neural network


    BP neural network is a multi-layer feedforward network trained by error propagation
    algorithm. It is one of the most widely used network models. BP network uses various
    learning rules to adjust the weights and thresholds through back propagation.
    The parameters to be specified for BP neural network include the number of input,
    hidden and output layer, the transfer function of each layer and the learning
    rules. In order to avoid BP neural network falling into the local minimum value
    in the training process, we need to randomly initialize a weight and threshold
    value. The neural network training algorithm in [16] is used to train the neural
    network. The number of hidden neurons will be adjusted according to the performance
    and fault recognition accuracy. Some parameters of BP neural network are shown
    in the Table III.'
