    In MATLAB/Simulink, 23 kinds were failed in turn to obtain the three-phase current,
    and then the proposed method was implemented in accordance with the process. 80%
    of the fault data set is selected as the training set and 20% as the test set.
    After several trials of different number of neurons, the accuracy of BP neural
    network was determined as 4. The comparison of almost identical performance curves
    in Fig. 6 shows that the network had a good generalization ability.


    # V. CONCLUSION


    This paper presents an open-circuit fault diagnosis for photovoltaic-connected
    inverter based on statistical learning and machine learning. MATLAB/Simulink simulation
    shows that this method network topology is simple and the features are different.
    The application of machine learning and statistical learning to recover inverter
    faults is a good approach, which is useful in line with the trend development
    of internet of things in grid.


