  md: '# Fault Diagnosis for IGBTs Open-Circuit Faults in Photovoltaic Grid-Connected
    Inverters Based on Statistical Analysis and Machine Learning


    *Hongyu Lu, Mingyao Ma, Weisheng Guo, Fei Li, Xing Chang


    Abstract — A new diagnosis method for IGBTs open-circuit faults based on statistical
    analysis is proposed to improve the reliability of photovoltaic generation system.
    First, empirical mode decomposition (EMD) is used to reduce the reality effect
    of noise in the signal. Second, statistical analysis and genetic moment analysis
    are used to extract feature and dimension reduction. Then, a neural network is
    used for fault recognition. Finally, the effectiveness of the proposed method
    is verified by simulation experiments. At the same time, the proposed method is
    compared with the traditional feature extraction and component analysis (PCA)-based
    reduction method. The results show that the proposed method has high recognition
    accuracy and simple neural network topology.


    Index Terms—BP neural network, EMD noise reduction, GDA, open-circuit fault diagnosis


    # I. INTRODUCTION


    With the rapid development of photovoltaic industry, the fault system will not
    only cause economic losses, but also have huge impact on the power grid. Therefore,
    the safety and reliability of photovoltaic power generation system are essential.
    Insulated gate bipolar transistors (IGBTs) are used in various inverters to control
    high current. However, IGBT is very prone to failure due to the harsh environment
    and electrical and thermal stress of internal equipment. Research shows that semiconductor
    devices are sensitive to various of faults [1]. When IGBTs short-circuit faults
    occur, the electrical and thermal stress caused by current will lead to terminal
    breakdown of IGBTs. Therefore, short-circuit faults are usually removed by hardware
    circuits [2], and secondary protection can prevent overcurrent or overvoltage
    in a short time, but last for a long period without protection of the system.
    If IGBT open-circuit faults were not detected for a long time, the remaining current
    may flow through a circuit and cause damage. It is very important to identify
    IGBT open-circuit faults quickly and


    There are three methods of IGBTs open-circuit fault diagnosis: mathematical model
    methods, signal processing and artificial intelligence methods. The mathematical
    model method estimates the relationship between the input and output of the system
    by constructing an observer. When the result of the output of the state observer
    is greater than the threshold, the fault is considered to have occurred. However,
    it is sensitive to noise several times occurring, which is inconvenient for non-professional
    operation and personnel [3]. Signal processing can be subdivided into time-domain
    analysis, frequency analysis and time-frequency analysis. Each method is used
    in these phase, but fault analysis is sensitive to noise [5]. In example, empirical
    mode decomposition (EMD) is used to decompose-axis current to get features. However,
    this method is sensitive to handle changes. The current value is transformed by
    machine learning algorithm to realize fault identification. However, there is
    a problem that the dimension of features is too high [7], [8]. Moreover, fast
    Fourier transform (FFT) is widely used in inverter to detect output current of
    the inverter to extract characteristic values for fault diagnosis [9], [10]. In
    addition, the method is able to handle noise changes in the field of fault detection
    [11], [12]. The output is converted into two-dimensional images by numerical transformation,
    and the excellent image recognition of convolutional neural network is used for
    fault classification. For example, reference [14] uses the convolutional neural
    network to sense the reality representation of fault signals, and the effect is
    also very


    In this paper, the proposed method shown in Fig. 1 describes the main fault types
    in photovoltaic grid-connected inverter and analyzes the output of the inverter
    when open-circuit faults occur. Section III introduces the principles of the proposed
    method and simulation analysis is carried out in Section V gives the conclusions.


