    ```


    As the number of decomposition layers increases, the frequency of IMF decreases
    gradually, and the residual is pulsation with low frequency. The basic frequency
    of the inverter current is 50Hz, and the noise is usually high-frequency signal.
    Therefore, if the three-phase current is carried out, and the adaptive filtering
    is realized by removing the two IMFs and residuals of the 3-layer. Fig. 4 shows
    the IMFs and residuals of 2-layer EMD for A phase current when the open-circuit
    circuit fault occurs in VT1. Obviously, the residual is much smoother than the
    original signal. EMD completely eliminates noise from the original signal.


    # TABLE II


    TIME-DOMAIN STATISTICAL FEATURES


    | Statistical Features | Calculation Formula |

    |---||

    | mean | $mean = \frac{1}{N} \sum x_i$ |

    | minimum | $min = \min(x_i)_{i=1,N}$ |

    | maximum | $max = \max(x_i)_{i=1,N}$ |

    | P-value | $PP-max$ |

    | Variance | $\sigma^2 = \frac{1}{N-1} \sum (x_i-mean)^2$ |

    | Standard deviation | $\sigma = \sqrt{\frac{1}{N-1} \sum (x_i-mean)^2}$ |

    | Peak | $P = max \frac{\frac{1}{N}}{x_i}$ |

    | Pulse | $P_u = max \frac{\frac{1}{N}}{x_i}$ |

    | Margin | $M = max \frac{\frac{1}{N}}{x_i}$ |

    | Waveform | $W = \sqrt{\frac{\frac{1}{N}}{\sum x_i^2}}$ |

    | Kurtosis | $K = \frac{\frac{1}{N} \sum (x_i-mean)^4}{(\frac{1}{N} \sum (x_i-mean)^2)^{3/2}}$
    |

    | Skewness | $S = \frac{\frac{1}{N} \sum (x_i-mean)^3}{(\frac{1}{N} \sum (x_i-mean)^2)^{3/2}}
    |


