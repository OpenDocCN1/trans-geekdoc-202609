    GDA is also called Kernel-based linear dimensionalityanalysis(LDA). Different
    from PCA, GDA and LDA use supervised dimensionality reduction techniques. GDA
    and LDA sample categories to achieve supervised dimension reduction. This category-based
    supervised dimensionality reduction is widely used in face recognition, fault
    diagnosis, handwriting processing and other fields. GDA uses a kernel to map data
    from low- to high-dimensional. The input of the kernel functions is in the original
    space X, and the output is the inner product of the feature space H. Through this
    kernel, we need to obtain the product of high dimensional space in low dimensional
    space, which will greatly reduce the complexity and computation speed. In particular,
    kernel methods meet the requirements of finite positive semi-definite. Linear
    kernel, polynomials kernel and RBF kernel are commonly used in kernel functions.
    The formulas are as follows:


