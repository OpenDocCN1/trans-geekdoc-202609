    wavelet packet, FFT harmonic analysis and so on. The use of BP neural network
    for noise reduction has a good effect but increases the complexity of fault diagnosis
    system. Wavelet method and FFT harmonic components are not adaptive, as the wavelet
    and harmonic components must be defined manually. In this paper, EMD is used for
    adaptive decomposition from the local extreme of the signal, EMD decomposes the
    signal into intrinsic mode functions (IMFs) and a residual by solving the upper
    and lower envelope and the average signal of the IMF (2), where N is the number
    of components. EMD IMFs need to meet the following characteristics:


    +   - The extreme points and zero crossings should be the same, or more.

    - At any moment, the average value of the upper envelope formed by the maximum
    point and the lower envelope formed by the local minimum point is zero, that the
    upper and lower envelope are locally symmetric with respect to the time axis.


    # B Statistical Analysis Feature Extraction


    After removing the noise in the grid-connected current, the three-phase grid-connected
    current is processed according to the twelve-domain signal statistical features
    listed in Table II as [5]. A 440 by 30 open-circuit fault data will be obtained.


    ```

