    There are six IGBTs in the three-phase half-bridge inverter. Open-circuit faults
    in different positions will lead to different degrees of distortion of the grid-connected
    circuit. In general, there are three or more IGBTs fault simultaneously. Therefore
    this paper studies only IGBT open-circuit. A total of 21 open-circuit faults and
    normal condition are shown


