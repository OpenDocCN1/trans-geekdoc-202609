    With the rapid development of photovoltaic industry, the fault system will not
    only cause economic losses, but also have huge impact on the power grid. Therefore,
    the safety and reliability of photovoltaic power generation system are essential.
    Insulated gate bipolar transistors (IGBTs) are used in various inverters to control
    high current. However, IGBT is very prone to failure due to the harsh environment
    and electrical and thermal stress of internal equipment. Research shows that semiconductor
    devices are sensitive to various of faults [1]. When IGBTs short-circuit faults
    occur, the electrical and thermal stress caused by current will lead to terminal
    breakdown of IGBTs. Therefore, short-circuit faults are usually removed by hardware
    circuits [2], and secondary protection can prevent overcurrent or overvoltage
    in a short time, but last for a long period without protection of the system.
    If IGBT open-circuit faults were not detected for a long time, the remaining current
    may flow through a circuit and cause damage. It is very important to identify
    IGBT open-circuit faults quickly and


