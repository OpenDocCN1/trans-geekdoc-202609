    analysis, frequency analysis and time-frequency analysis. Each method is used
    in these phase, but fault analysis is sensitive to noise [5]. In example, empirical
    mode decomposition (EMD) is used to decompose-axis current to get features. However,
    this method is sensitive to handle changes. The current value is transformed by
    machine learning algorithm to realize fault identification. However, there is
    a problem that the dimension of features is too high [7], [8]. Moreover, fast
    Fourier transform (FFT) is widely used in inverter to detect output current of
