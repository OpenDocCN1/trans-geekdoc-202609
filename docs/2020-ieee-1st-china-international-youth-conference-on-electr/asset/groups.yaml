    2 维数据。图 5 显示，在 GDA 中，每个故障类特征在两个轴之间显著不同。特征差异越大，神经网络的分类准确率越高。


    ## 线性核


    ```

    $k(x,y) = \langle x,y\rangle+1, r \in \mathbb{R}^*$ (5)

    ```


    ## 多项式核


    ## RBF(高斯)核


    ```

    $k(x,y) = \exp(-\frac{\|x-y\|^2}{2\sigma^2})$ (7)

    ```


    GDA 希望找到一个变换矩阵 $P$，使得原始数据 $X$ 投影通过 $P$ 时，类间距离与类内距离之比最大化。类间距离定义为 $S_X^{GDA}$，类内距离定义为
    $S_Y^{GDA}$。


