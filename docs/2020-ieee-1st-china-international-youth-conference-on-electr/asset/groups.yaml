    # 基于统计分析与机器学习的光伏并网逆变器IGBT开路故障诊断


    Hongyu Lu, Mingyao Ma, Weisheng Guo, Fei Li, Xing Chang


    摘要 — 提出了一种基于统计分析的IGBT开路故障新型诊断方法，以提高光伏发电系统的可靠性。首先，利用经验模态分解（EMD）减少信号中噪声的真实影响。其次，利用统计分析和遗传矩分析进行特征提取和降维。然后使用神经网络进行故障识别。最后，通过仿真实验验证了该方法的有效性。同时，将该方法与传统的基于特征提取和主成分分析（PCA）的降维方法进行了比较。结果表明，该方法具有较高的识别精度和简单的神经网络拓扑结构。


    索引词—BP神经网络、EMD降噪、GDA、开路故障诊断


    # I. 引言


    随着光伏产业的快速发展，故障系统不仅会导致经济损失，还会对电网产生巨大影响。因此，光伏发电系统的安全性和可靠性至关重要。绝缘栅极双极晶体管（IGBT）被用于各种逆变器中控制大电流。然而，由于内部设备所处的恶劣环境以及电热应力，IGBT非常容易失效。研究表明，半导体器件对各种故障敏感
    [1]。当发生IGBT短路故障时，电流引起的电热应力会导致IGBT的末端击穿。因此，短路故障通常由硬件电路消除 [2]，二次保护可以在短时间内防止过流或过电压，但在没有系统保护的情况下会持续很长时间。如果长时间未检测到IGBT开路故障，剩余电流可能会流经电路导致损坏。在生产中快速识别IGBT开路故障具有重要意义。


    IGBT开路故障诊断有三种方法：数学模型法、信号处理法和人工智能方法。数学模型法通过构建观测器来估计系统输入与输出之间的关系。当状态观测器的输出结果大于阈值时，认为发生了故障。然而，它对多次发生的噪声非常敏感，不利于非专业人员操作
    [3]。信号处理可以细分为时域分析、频率分析和时频分析。这些方法分别应用于这些阶段，但故障分析对噪声敏感 [5]。例如，利用经验模态分解（EMD）分解轴电流以获取特征。然而，这种方法对处理变化较为敏感。通过机器学习算法对电流值进行变换以故障识别。但存在特征维度过高的问题
    [7], [8]。此外，快速傅叶变换（FFT）广泛应用于逆变器中检测逆变器的输出电流，以提取故障诊断的特征值 [9], [10]。此外，该方法能够处理故障检测领域的噪声变化
    [11], [12]。通过数值变换将输出转换为二维图像，利用卷积神经网络卓越的图像识别能力进行故障分类。例如，参考文献 [14] 使用卷积神经网络感知故障信号的真实表示，其效果对于快速识别故障也非常有效。


    在本文中，图1所示的方法描述了光伏并网逆变器的主要故障类型，并分析了发生开路故障时逆变器的输出。第三节介绍了所提方法的原理，第五节进行了仿真分析并给出结论。


    这项工作受国家自然科学基金（NSFC）资助，编号为21775107，以及河北大学可再生能源技术国家联合实验室的支持。（2537990102@qq.com,
    myyama@hdt.edu.cn, 23009, 60858401@qq, 415990803@qq.com; hgyi@jsut.edu.cn）


    因此，我们只采集故障发生后的基波电流。开关频率为5kHz。在一个基波内等等间隔采集100个点，在驱动信号闭合0.02s后逆变器与电网断开。


