    ..., \frac{I_c}{n_{c,n_c}}))$ (12)


    $L$ 是原始数据 $X$ 的类别数。$n_l$ 是第 $l$ 类中的样本数。$n$ 是 $X$ 的样本总数。$I_{n_l,n_l}$ 是一个 $n_l
    \times n_l$ 的全1 矩阵。


