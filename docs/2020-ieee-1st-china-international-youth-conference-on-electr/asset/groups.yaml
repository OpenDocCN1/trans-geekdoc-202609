    图1. 基于统计分析与机器学习的故障诊断流程图


    # II. IGBT开路故障分析


    三相半桥逆变器因其结构和灵活的控制模式被广泛应用于各种 [15]。因此，本文的研究对象是三相半桥并网逆变器。光伏逆变器的电路拓扑如图2所示。


    ![](img/cd71556ea4ab4b100c6a39f16e5e93cf_1_1.png)


    图2. 并网逆变器主电流。


    三相半桥逆变器中有六个IGBT。不同位置的开路故障会导致并网电路产生不同程度的失真。通常情况下，三个或多个IGBT同时发生故障。因此，本文仅研究IGBT开路。下方列了共21种开路故障和正常状态。


    当IGBT开路故障发生时，逆变器的电流会发生失真。本文展示了0.06s时VT1开路故障的三相电流波形。故障影响上半部分，B相和C相相位消失。还应注意的是，开路故障可能在任何时间发生。通过机器学习算法对电流值进行变换以实现故障识别。但存在特征维度过高的问题
    [7], [8]。


    ![](img/cd71556ea4ab4b100c6a39f16e5e93cf_1_2.png)


    图3. 开路故障的三相电流。


    当IGBT开路故障发生时，逆变器的电流会发生失真。本文展示了0.06s时VT1开路故障的三相电流波形。故障影响上半部分，B相和C相相位消失。还应注意的是，开路故障可能在任何时间发生。通过机器学习算法对电流值进行变换以实现故障识别。但存在特征维度过高的问题
    [7], [8]。


    # III. 针对IGBT开路故障的方法


    ### A. 降噪


    经验模态分解（EMD）用于减少信号中噪声的真实影响。为了确保最终方法的准确性，利用EMD将信号分解为若干固有模态函数（IMF）。随着IMF数量增加，残差逐渐减少。


    表 II：时域特征


    | 统计特征 | 计算公式 |

    |---|---|

    | 平均值 | $\frac{1}{N} \sum x_i$ |

    | 最小值 | $\min(x_i)$ |

    | 最大值 | $\max(x_i)$ |

    | 方差 | $\sigma^2 = \frac{1}{N-1} \sum (x_i-\mu)^2$ |

    | 标准差 | $\sigma = \sqrt{\frac{1}{N-1} \sum (x_i-\mu)^2}$ |

    | 峰值 | $P \frac{1}{N}$ |

    | 脉冲 | $P_u$ |

    | 裕度 | $M$ |

    | 波形 | $W = \sqrt{\frac{1}{N} \sum x_i^2} $ |

    | 峭度 | $K = \frac{\frac{1}{N} \sum (x_i-\mu)^4}{(\frac{1}{N} \sum (x_i-\mu)^2)^2}$
    |

    | 偏度 | $S = \frac{\frac{1}{N} \sum (x_i-\mu)^3}{(\frac{1}{N} \sum (x_i-\mu)^2)^{3/2}}$
    |


    ### B. 特征提取


    统计分析和遗传矩分析用于特征提取和降维。通过数值变换将输出转换为二维图像，利用卷积神经网络卓越的图像识别能力进行故障分类。


    ### C. 故障识别


    使用神经网络进行故障识别。例如，参考文献 [14] 使用卷积神经网络感知故障信号的真实表示，其效果对于快速识别故障也非常有效。


