    = 8` 的还是 `degree = 1` 的？


    让我们从对这三个模型进行一些观察开始。


    与其他两个模型相比，`degree = 1` 的模型在见过和未见过的数据上表现都很差。`degree = 8` 的模型在见过数据上的表现优于 `degree
