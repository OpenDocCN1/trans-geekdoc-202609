    building deep learning applications.

    7. Chapter [8](http://dx.doi.org/10.1007/978-1-4842-2766-4_8) introduces the reader
    to `Stochastic Gradient Descent` (`SGD`), which is the most common procedure used
    to train Neural Networks. This chapter also covers the shortcomings of `SGD` and
