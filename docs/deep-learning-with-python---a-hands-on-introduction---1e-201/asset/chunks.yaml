    \ activation functions with very little coding effort.\n\nLet us now look at the\
    \ constructs Keras provides to build the Convolution Neural Networks introduced\
    \ in Chapter [5](http://dx.doi.org/10.1007/978-1-4842-2766-5). The data set we\
    \ will be using is the MNIST data set, which is a commonly used benchmark set\
    \ for deep learning. The data set consists of handwritten digits (60,000 training\
    \ examples and 10,000 test examples). The task at hand is to predict the digit\
