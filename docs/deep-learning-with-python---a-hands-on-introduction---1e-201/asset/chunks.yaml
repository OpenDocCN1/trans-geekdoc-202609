    虽然这些进展对于深度学习来说是辅助性的，但它们在推动深度学习进步方面发挥了巨大作用。


    ## 前提条件


    阅读本书的关键前提是具备 `Python` 的基础知识，并学习过线性代数、微积分和概率论的课程。如果读者需要弥补这些前提条件，建议参考以下内容：


    1. Mark Pilgrim 写的用于 Python 的 `Dive Into Python`。

    2. Gilbert Strang 写的线性代数 `Linear Algebra`。

    3. Gilbert Strang 写的微积分 `Calculus`。

    4. Larry Wasserman 写的概率论 `All of Statistics`（第 1 部分，第 [1](http://dx.doi.org/10.1007/978-1-4842-2766-4_1)
    至第 [5](http://dx.doi.org/10.1007/978-1-4842-2766-4_5) 章）。


    # 第 1 章 深度学习简介


    ## 后续章节概述


    我们现在为读者提供后续章节的整体大纲。需要注意的是，每一章都涵盖了关于深度学习的理念或技能（在某些情况下两者兼有）。我们在下方重点介绍了这些内容，以便读者确保他们已经内化了这些概念和技能。强烈建议读者不仅要阅读章节，还要通过（纸笔）推导数学细节，并尝试每个章节中提供的源代码。


    1. 第 [2](http://dx.doi.org/10.1007/978-1-4842-2766-4_2) 章涵盖了`Machine Learning`（机器学习）的基础。本章的核心要点是对未见示例进行泛化的概念、训练数据的过拟合与欠拟合、模型容量以及正则化概念。

    2. 第 [3](http://dx.doi.org/10.1007/978-1-4842-2766-4_3) 章涵盖了`Feed Forward Neural
    Networks`（前馈神经网络），它是整本书的概念基础。如神经网络的整体结构、输入层、隐藏层和输出层、代价函数以及基于`Maximum Likelihood`（极大似然）原理的这些，都是本章的重要概念。

    3. 第 [4](http://dx.doi.org/10.1007/978-1-4842-2766-4_4) 章提供了 `Theano` 库的上手介绍。它涵盖了如何将网络定义为计算图、为复杂网络自动推导梯度以及训练神经网络。

    4. 第 [5](http://dx.doi.org/10.1007/978-1-4842-2766-4_5) 章涵盖了`Convolutional Neural
    Networks`（卷积神经网络），这可能是深度学习最成功的应用之一。

    5. 第 [6](http://dx.doi.org/10.1007/978-1-4842-2766-4_6) 章涵盖了`Recurrent Neural
    Networks`（循环神经网络）和`Long Short Term Memory`（`LSTM`长短期记忆）网络，这是深度学习另一个成功的应用。

    6. 第 [7](http://dx.doi.org/10.1007/978-1-4842-2766-4_7) 章提供了 `Keras` 库的上手介绍。`Keras`
    库提供了基于 `Theano` 的许多高级抽象，在构建深度学习应用时可能是理想工具。

    7. 第 [8](http://dx.doi.org/10.1007/978-1-4842-2766-4_8) 章向读者介绍了`Stochastic Gradient
    Descent`（`SGD`随机梯度下降），这是训练神经网络常用的程序。本章还涵盖了 `SGD` 的缺点以及解决这些缺点的若干 `SGD` 变体。

    8. 第 [9](http://dx.doi.org/10.1007/978-1-4842-2766-4_9) 章向读者介绍了`Automatic Differentiation`（自动微分，通常称为反向传播），这是用于为复杂网络推导梯度（`SGD`
    所需）的标准技术。

    9. 第 [10](http://dx.doi.org/10.1007/978-1-4842-2766-4_10) 章向读者介绍了`Graphical Processing
    Units`（`GPUs`图形处理器）和基于 `GPU` 的计算，它是学习的关键性技术。


    ## 第 2 章 机器学习基础


    深度学习是`Machine Learning`（机器学习）的一个分支，在本章中我们将涵盖 `Machine Learning` 的基础知识。虽然机器学习作为一个学科本质上是数学性的，但我们将数学保持在基础水平，以培养对该学科的直觉。本章涉及内容的前提是线性代数、微积分和基础概率论。


    ## 直觉


    作为人类，我们直观地感知到“学习”的概念：它简单意味着在一段时间内对某项任务做得更好。任务可以是物理的（如学习开车），也可以是智力的（如学习新语言）。机器学习的主题专注于开发能够像人类一样学习的算法；即它们随着时间的推移对任务处理得更好。


    要提出的第一个问题是，我们为什么对能随经验改进性能的算法开发感兴趣？毕竟，有很多被开发并实现以解决现实问题的算法，它们并不会随着时间改进。从银行到电子商务，从汽车导航系统到登月器着陆，算法无处不在，但大多数算法都不会随时间改进。这些算法只是执行它们被设计的任务，偶尔需要维护。为什么我们需要机器学习？


    这个问题的答案是，对于某些任务，开发一种能随经验改进性能的算法比手动开发算法要容易。虽然这在读者看来可能难以理解，但我们将在本章中建立这种直觉。


    ## 二分类


    为了进一步讨论当前的问题，我们需要对之前直观使用的一些术语（如任务、学习、经验和改进）给出精确定义。我们将从二分类任务开始。


    考虑一个抽象的问题领域，我们拥有如下形式的数据：


    ```

    D = {(x[1], y[1]), (x[2], y[2]), ..., (x[n], y[n])}

    ```


    其中 $x \in R^n$ 且 $y = \pm1$。我们无法访问此类此类，只能访问子集 $S \subset D$。利用 $S$，我们的任务是生成一个实现函数
    $f:x \to y$ 的计算程序，以便使用 $f$ 对未见数据 $(x[i],y[i]) \in S$ 进行正确的预测，即 $f(x[i]) = y[i]$。我们将
    $U \subset D$ 表示为未见数据的集合，即 $(x[i], y[i]) \notin S$ 且 $(x[i], y[i]) \in U$。我们通过未见数据上的误差来衡量这项任务的性能。


    '
- fmt: '

    We now have a precise definition of the task, which is to categorize data into
    one of two categories (`y = ±1`) based on some seen data `S` by generating `f`.
    We measure performance (and improvement in performance) using the error `E (f,
    D, U)` over unseen data `U`. The size of the seen data `|S|` is the conceptual
    equivalent of experience. In this context, we want to develop algorithms that
    generate such functions `f` (which are commonly referred to as a model). In general,
    the field of machine learning studies the development of such algorithms that
    produce models that make predictions over unseen data for such algorithms, and
    other formal tasks (we will be introducing multiple such tasks later in the chapter).
    Note that the `x` is commonly referred to as the input/input variable and `y`
    is referred to as the output/output variable.


    As with any other discipline in computer science, the computational characteristics
    of such algorithms is an important facet, but in addition to that we also would
    like to have a model `f` that achieves a lower error `E (f, D, U)` with as small
    a `|S|` as possible.


    Let us now relate this abstract but precise definition to a real world problem
    so that our abstractions are grounded. Let us say an e-commerce web site wants
    to customize the landing page for registered users to show them the products the
    users might be interested in buying. The web site has historical data on users
    and would like to implement this as a feature so as to increase sales. Let us
    now see how this real world problem maps onto the abstract problem of binary classification
    we described earlier.


    The first thing that one might notice is that given a particular user and a particular
    product, one wants to predict whether the user will buy the product. Since this
    is the value to be predicted, it maps onto `y = ±1`, where we will let the value
    of `y = +1` denote the prediction that the user will buy the product and we will
    denote `y = -1` as the prediction that the user does not buy the product. Note
    that there is no particular reason for picking these values; we could have swapped
    this (let `y = +1` denote the does not buy case and `y = -1` denote the buy case)
    and there would be no difference. We just use `y = ±1` to denote the two classes
    of interest to categorize data. Next, let us assume that we can somehow represent
    the attributes of the product and the user''s buying and browsing history as `x
    ∈ R`. This step is referred to as feature engineering in machine learning and
    we will cover it later in the chapter. For now, it suffices to say that we are
    able to generate such a mapping. Thus, we have historical data of what the users
    browsed and bought, attributes of a product and whether the user bought the product
    or not mapped onto `{(x[p] yj, (x[2],y[2]), ... (x[n],y[n])}`. Now, based on this
    data, we would like to generate a function or a model `f:x→y` which we can use
    to determine which products a particular user will buy and use this to populate
    the landing page for users. We can measure how well the model is doing on unseen
    data by populating the landing page for users and see whether they buy the products
    or not and evaluate the error `E (f, D, U)`.


    ## Regression


    Let us introduce another task, namely regression. Here, we have data of the form
    `D = {x[1], y[1]), (x[2],y[2])... (x[n],y[n])}` where `x ∈ R` and `y ∈ R` and
    our task is to generate a computational procedure that implements the function
    `f:x→y`. Note that instead of the prediction being a binary label `y = ±1` like
    binary classification, we have real valued prediction. We measure performance
    over this task as the root mean error (`RMSE`) over unseen data:


    ```

    E (f, D, U) = sqrt(1/n * Σ (y - f(x))^2)

    ```

    Note that `RMSE` is simply taking the difference between the predicted and actual
    value, squaring it to account for both positive and negative differences, taking
    the mean to aggregate over all the unseen data and finally, taking the square
    root to counterbalance the square operation. A real world problem that corresponds
    to the abstract task of regression is to predict the credit score for an individual
    based on their financial history, which can be used by a credit card company to
    extend the line of credit.


    ## Generalization


    Let us now cover what is the single most important intuition in machine learning,
    is that we want to develop models that have good performance over unseen data.
    In order to do that, let us introduce a toy dataset for a regression task first.
    We generate the toy dataset by generating 100 values between -1 and 1 as the input
    variable (`x`). We generate the output variable (`y`) based on `y = 2 + x² + e`
    where `e ~ N(0,0.1)` is noise (random variation) from a normal distribution with
    0 mean and 0.1 being the standard deviation. Code for this is presented in Listing
    2-1 and the data is plotted in Figure 2-1.


    ### Listing 2-1. Generalization vs. Overfitting


    ```python

    import pylab

    import numpy


    x = numpy.linspace(-1,1,100)

    signal = 2 + x * x

    noise = numpy.random.normal(0, 0.1, 100)

    y = signal + noise

    pylab.plot(signal,''b'')

    pylab.plot(y,''g'')

    pylab.plot(noise, ''r'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    pylab.legend(["Without Noise", "With Noise", "Noise"], loc=2)


    x_train = x[0:80]

    y_train = y[0:80]


    # Model with degree 1

    pylab.figure()

    degree = 2

    X_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])

    model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),X_train.transpose()),y_train)

    pylab.plot(x,y,''g'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    predicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])

    pylab.plot(x, predicted,''r'')

    pylab.legend(["Actual", "Predicted"], loc=2)

    train_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train
    -predicted[0:80])))

    test_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:], y[80:] -predicted[80:])))

    print("Train RMSE (Degree = 1)", train_rmse1)

    print("Test RMSE (Degree = 1)", test_rmse1)


    # Model with degree 2

    pylab.figure()

    degree = 3

    X_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])

    model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),
    X_train.transpose()),y_train)

    pylab.plot(x,y,''g'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    predicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])

    pylab.plot(x, predicted,''r'')

    pylab.legend(["Actual", "Predicted"], loc=2)

    train_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train
    - predicted[0:80])))

    test_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:], y[80:] -predicted[80:])))

    print("Train RMSE (Degree = 2)", train_rmse1)

    print("Test RMSE (Degree = 2)", test_rmse1)


    # Model with degree 8

    pylab.figure()

    degree = 9

    X_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])

    model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),
    X_train.transpose()),y_train)

    pylab.plot(x,y,''g'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    predicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])

    pylab.plot(x, predicted,''r'')

    pylab.legend(["Actual", "Predicted"], loc=3)

    train_rmse2 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train
    - predicted[0:80])))

    test_rmse2 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:], y[80:] -predicted[80:])))

    print("Train RMSE (Degree = 8)", train_rmse2)

    print("Test RMSE (Degree = 8)", test_rmse2)

    ```


    ### Output

    Train RMSE (Degree = 1) 3.50756834691 Test RMSE (Degree = 1) 7.69514326946

    Train RMSE (Degree = 2) 0.91896252959 Test RMSE (Degree = 2) 0.446173435392

    Train RMSE (Degree = 8) 0.897346255079 Test RMSE (Degree = 8) 14.1908525449

