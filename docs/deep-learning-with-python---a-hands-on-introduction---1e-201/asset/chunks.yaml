    ## About the Author


    ![](main-3.jpg)


    Nikhil Ketkar currently leads the Machine Learning Platform team at Flipkart.
    He received his PhD from Washington State University. Following that, he conducted
    postdoctoral research at University of North Carolina at Charlotte. More recently,
    he led the data mining team at Guavus, a startup doing e-commerce. His research
    interests include machine learning and graph theory.


    ## About the Technical Reviewer


    Jojo Moolayail is a data scientist and author of *Smarter Decisions: The Intersection
    of IoT*. He was born and raised in Pune, India and graduated from the University
    of Pune with a major in information technology engineering. He started his career
    with Mu Sigma, the world''s largest pure play analytics provider. One of the early
    enthusiasts to venture into IoT, he now focuses on solving decision science problems
    at General Electric. As a part of his role at GE, he also develops data science
    and platforms.


    ## Acknowledgments


    I would like to thank my colleagues at Flipkart and Indix, and the technical reviewers
    for their feedback and comments.


    # CHAPTER 1

    ## Introduction to Deep Learning


    ![](main-4.jpg)


    This chapter gives a broad overview and a historical context around the subject
    of deep learning. It also gives the reader a roadmap for navigating the book,
    the prerequisites, and further reading to dive deeper into the subject.


    ### Historical Context


    The field of Artificial Intelligence (AI), which can definitely be considered
    to be the parent field of deep learning, has a rich history going back to 1950.
    While we will not cover this history in much detail, we will go over some of the
    key turning points in the field, which will lead us to deep learning.


    Tasks that AI focused on in its early days were tasks that could be easily described
    formally, like the game of checkers or chess. This notion of being able to easily
    describe the task formally is at the heart of what can or not be done easily by
    a computer program. For instance, consider the game of chess. The formal description
    of the game of chess would be the representation of the board, a description of
    how each of the pieces move, the starting configuration, and a description of
    the configuration wherein the game terminates.


    With these notions formalized, it''s relatively easy to model a chess-playing
    AI program as a search and, given sufficient computational resources, it''s possible
    to produces a relatively good chess-playing AI.

