    4. Chapter [5](http://dx.doi.org/10.1007/978-1-4842-2766-4_5) covers `Convolutional
    Neural Networks`, which are perhaps the most successful application of deep learning.

    5. Chapter [6](http://dx.doi.org/10.1007/978-1-4842-2766-4_6) covers `Recurrent
    Neural Networks` and `Long Short Term Memory` (`LSTM`) networks, which are another
    successful application of deep learning.

