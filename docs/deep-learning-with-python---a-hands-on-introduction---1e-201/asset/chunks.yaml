    ## Batch, Stochastic (Single and Mini-batch) Descent


    So far, we were denoting our loss function as L(x). The training data (examples)
    were implicit in this notation. For the purpose of this discussion, we need to
    make them explicit. Let us denote our training data as D = {{,d.-,,...d[n]}. Our
    loss function should now be denoted as LD(x). This simply means that the loss
    function is being evaluated with parameters x and with respect to a set of data
    points D. Let T be a subset of examples in D; then L[T](x) denotes the loss function
    evaluated over the set of examples T. Similarly, V[x]L[D][(]x[)]and V[x]L[T] (x) denote
    the gradients of the loss function L(x) computed over the sets of training data
    D and T, respectively.


    ■ Note For now, we will stay away from the computation of gradients of loss functions
    over subsets of data. these can be generated using automatic differentiation (covered
    elsewhere in the book) quite easily (even for arbitrary complicated loss functions)
    and need not be derived manually.


    Armed with this notation, we can now discuss three variants of the steepest descent
    approach we discussed earlier.


    ### Batch


    In this approach, the entire dataset D is used in the update step. That is, x
    is updated as x = x - V[x] LD (x). Two things are apparent about this approach.
    First, that it is expensive as it requires a computation over the entire dataset.
    Second, the update direction is the most accurate one, given our entire dataset.


    ### Stochastic Single Example


    In this approach, only a single example from D is used in the update step. That
    is, x is updated as


    x = x - V [x] L[S] (x) where |S| = 1. Note that we use a different example in
    each iteration chosen randomly (hence the term stochastic, which simply means
    having a random nature). Two things are apparent about this approach, too. First,
    that it is quite cheap as it requires a computation of the gradient over only
    a single example. Second, the update direction is not as accurate as we are only
    using a very small fraction of the training dataset.


    ### Stochastic Mini-batch


    In this approach, only a small subset of examples from D is used in the update
    step. That is, x is updated as x = x - V[x] L[S] (x) where |S| < |\_D|. Note that
    we use a different set of examples in each iteration chosen randomly (hence the
    term stochastic).


    ### Batch vs. Stochastic


    In practice, stochastic approaches dominate over batch approaches and are much
    more commonly used. A seemingly nonintuitive fact about stochastic approaches
    is that not only is the gradient over few examples cheaper to compute, not getting
    the exact direction (using only a small number of examples) actually leads to
    better solutions. This is particularly true for large datasets with redundant
    information wherein the examples are not too different from each other. Another
    reason for stochastic approaches performing better is the presence of multiple
    local minima with different depths. In a sense, the noise in the direction allows for
    jumping across the trenches while a batch approach will converge in the trench
    it started with.


    ## Challenges with SGD


    Having covered the conceptual description of SGD, let us now consider the challenges
    of applying it to solving real world problems while build deep learning models.


    ### Local Minima


    Local minima are suboptimal solutions (refer to Figure [8-3](#main-9.xhtml#bookmark23))
    that trap any steepest descent approach and prevent the iterative procedure for
    making progress towards a better solution.


    ![](main-86.jpg)


    ### Saddle Points


    Saddle points are points (refer to Figure[ 8-4](#main-9.xhtml#bookmark26)) where
    the gradient evaluates to zero but the point is not a local minimum. Saddle points
    are any steepest descent approach and prevent the iterative procedure for making
    progress towards a better solution. There is good empirical evidence that saddle
    points are much more common than local minima when it comes to optimization problems
    in a high number of dimensions (which is always the case when it comes to building
    deep learning models).


    ![](main-87.jpg)


    ### Selecting the Learning Rate


    The a is the earlier discussion which represents the magnitude (scalar) of the
    step (in the direction u) is taken in each iteration so as to update x. This a
    is commonly referred to as the learning rate and it has a big impact on finding
    good solutions to the optimization problem (refer to Figure [8-5](#main-9.xhtml#bookmark29)).
    Too high a learning rate can cause the solution to bounce around and too low a
    learning rate means slow convergence (implying not getting to a good solution
    in a given number of iterations). When it comes to loss functions with many parameters
    trained on sparse datasets, a single global learning rate for all parameters makes
    the problem of choosing a learning rate even more challenging.


    Too High


    ![](main-88.jpg)


    Just Right


    ![](main-89.jpg)


    Too Low


    ![](main-90.jpg)


    Figure 8-5. Learning rate needs to be set properly


    ### Slow Progress in Narrow Valleys


    Another problem inherent to steepest descent is the slow progress in narrow valleys
    generated due to badly scaled datasets. Progress slows down drastically as we
    get closer to the solution (refer to Figure[ 8-6](#main-9.xhtml#bookmark32)).


    ![](main-91.jpg)


    Figure 8-6. Slow progress in narrow valleys


