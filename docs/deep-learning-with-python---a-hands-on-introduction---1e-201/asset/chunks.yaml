    ## Summary


    In this chapter we covered the basics of using Keras, using a number of small
    and simple examples. We encourage the reader to experiment with the examples.
    Keras has extensive documentation, which is recommended further reading.


    CHAPTER 8


    Stochastic Gradient Descent


    ![](main-83.png)


    An essential step in building a deep learning model is solving the underlying
    optimization problem, as defined by the loss function. This chapter covers Stochastic
    Gradient Descent (SGD), which is the most commonly used algorithm for solving
    such optimization problems. We also cover a breadth of algorithmic variations
    published in academic literature which improve on the performance of SGD, and
    present a bag of largely undocumented tricks which will allow the user to go an
    extra mile. Lastly, we cover some ground on parallel/distributed SGD and touch
    on Second Order Methods for completeness.


    Most of the examples presented in the accompanying code for this chapter are based
    on a Python package called downhill. Downhill implements SGD with many of its
    variations and is an excellent choice for experimenting.


    ## Optimization Problems


    Simply put, an optimization problem involves finding the parameters which minimize
    a mathematical function. For example, given the function f(x)= 2 x, finding the
    value of x which minimizes the function is an optimization problem (refer to Figure
    [8-1](#main-9.xhtml#bookmark5)).


    ![](main-84.jpg)


    Figure 8-1. An optimization problem involves finding the parameters that minimize
    a given function


    © Nikhil Ketkar 2017


    N. Ketkar, Deep Learning with Python, DOI 10.1007/978-1-4842-2766-4\_8


    While the functions we want to minimize while building deep learning models are
    way more complicated (involving multiple parameters which may be scalars, vectors,
    or matrices), conceptually it''s simply finding the parameters that minimize the
    function.


    The function one wants to optimize for while building a deep learning model is
    referred to as the loss function. The loss function may have a number of scalar/vector/matrix-valued
    parameters but always has a scalar output. This scalar output represents the goodness
    of the model. Goodness, typically, means a combination of how well the model predicts
    and how simple the model is.


    ■ Note For now, we will stay away from the statistical/machine learning aspects
    of a loss function (covered elsewhere in the book) and focus purely on solving
    such optimization problems. that is, we assume that we have been presented with
    a loss function L(x ) where x represents the parameters of the model and the job
    at hand is to find the values for x which minimize L(x ).


    ## Method of Steepest Descent'
