    The approximation errors for forward and backward differences are in the order
    of h, that is, O(h), while those for central difference and Richardson''s approximation
    are O(h²) and O(h⁴) respectively.


    The key problems with numerical differentiation are the computational cost, which
    grows with the number of parameters in the loss function, the truncation errors,
    and the round off errors. The truncation error is the inaccuracy we have in the
    computation off(x) due to h not being zero. The round off error is inherent to
    using floating point numbers and floating point arithmetic (as against using infinite
