    ## Gradient Explosion and Vanishing


    Training RNNs suffers from challenges of vanishing and explosion of gradients.
    Vanishing gradients means that, when computing the gradients on unrolled RNNs,
    the value of the gradients can drop to a very small value (close to zero). Similarly,
    the gradients can increase to a very high value which is referred to as exploding
    gradient problem. In both cases, training the RNN is a challenge.


    Let us look at the equations describing the RNN.


    ```

    h^(t) = tanh[Ux^(t) + Wh^(t-1) + b]

    y^(v) = softmax(h^(v) + c)

    ```


    Let us derive the expression for `dL` by applying the chain rule. This is illustrated
    in Figure 6-10.


    ```

    dL = [z_k<t || dh^(i)]

    ```


    Let us now focus on the part of the expression `dh^(i)` which involves a repeated
    matrix multiplication of `W` which contributes to both the vanishing and exploding
    gradient problems. Intuitively, this is similar to multiplying a real valued number
    over and again, which might lead to the product shrinking to zero or exploding
    to infinity.


    ## Gradient Clipping


    One simple technique to deal with exploding gradients is to rescale the norm of
    gradient whenever it goes over a user-defined threshold. Specifically, if the
    gradient denoted by `g` and `g > c` then we set `g = c`. This technique is both
    simple and computationally efficient but does introduce an extra hyperparameter.


    ![](main-75.jpg) Figure 6-10. Vanishing and Exploding Gradients


    ## Long Term Memory


    Let us now look at another variation on RNNs, namely the Long Short Term Memory
    (LSTM) Network. An LSTM can be described with the following set of equations.
    Note that the symbol `·` notes pointwise multiplication of two vectors (if `a
    = [1,1,2]` and `b = [0.5,0.5,0.5]`, then `ab = [0.5,0.5,1]`, the functions `c`,
    `g` and `h` are non-linear activation functions, all `W` and `R` are weight matrices,
    and all the `b` terms are bias terms).


    ```

    Z^(t) = g(z^(t) + R·y^(t) + bz)

    i^(t) = s(w[t]x^(t) + R[t]y^(t-1) + p[t]c^(t-1) + b[t])

    f^(t) = s(w[f]x^(t) + R[f]w^(t-1) + p[f]c^(t-1) + b[f])

    c^(t) = i^(t)·z^(t) + f^(t)·c^(t-1))

    o^(t) = s(x^(t) + R[o]y^(t-1) + p[o]c^(t) + b[o])

    y^(t) = o^(t)·h(t)

    ```


    The following points are to be noted:


    1. The most important element of the LSTM is the cell state denoted by `c^(t)
    = i^(t)·z^(t)+f^(t)·c^(t-1)`. The cell state is updated based on the block input
    `z^(t)` and the previous cell state `c^(t-1)`. The input gate `i^(t)` determines
    what fraction of the block input makes it into the cell state (hence called a
    gate). The forget gate `f^(t)` determines how much of the previous cell state
    to retain.


    2. The output `y^(t)` is determined based on the cell state `c^(t)` and the output
    gate `o^(t)`, which determines how much the cell state affects the output.


    3. The `z^(t)` term is the block input.


    4. The input gate `i^(t)` determines what fraction of the block input makes it
    into the cell state.


    5. The forget gate `f^(t)` determines how much of the previous cell state to retain.


    6. The computation of the cell state is affected by exploding gradients.


    ![](main-76.jpg) Figure 6-11. Long Term Memory


    ## Summary


    In this chapter we covered the basics of Recurrent Neural Networks (RNN). The
    key take-home points from this chapter are the hidden state, training RNNs via
    unrolling, the problem of vanishing and exploding gradients, and long term memory
    networks. It is important to internalize how RNNs contain internal states.


    # CHAPTER 7 Introduction to Keras


    ![](main-77.png)


    This chapter introduces the reader to Keras, which is a library that provides
    highly powerful and abstract building blocks to build deep learning networks.
    The building blocks Keras provides are built using Theano (covered earlier) as
    well as TensorFlow. Keras supports both CPU and GPU computation and is a great
    tool for quickly prototyping ideas.


    We will introduce a number of key building blocks Keras provides, and then build
    a CNN and LSTM using Keras.


    Let us start with a simple, single layer neural network. The following points
    are to be noted:


    1. A model is defined using the `Sequential` construct, which allows the user
    to add layers.


    2. Using this functionality, a user can add one or more layers and build the network.
    The `Dense` layer is basically a fully connected layer, which we have seen earlier.


    3. The input and output dimensionality needs to be specified when the first layer
    is defined.


    4. After this layer we add an activation function, in this case a sigmoid.


    5. The model once defined needs to be explicitly compiled and, at this time, we
    provide the loss function, the optimization algorithm, and other metrics we want
    to calculate.


    6. An appropriate loss function needs to be picked given the task at hand; in
    this case, given that we have a binary classification problem, we select binary
    cross-entropy.


    7. An appropriate optimization algorithm needs to be picked, which typically is
    a variant of Stochastic Gradient Descent (covered in later chapters).


    8. Once compiled we can fit the model by providing the data and evaluate the model.


