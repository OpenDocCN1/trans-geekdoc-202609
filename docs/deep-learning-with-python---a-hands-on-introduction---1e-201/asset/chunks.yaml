    This chapter introduces the reader to GPU (Graphics Processing Unit)-based computation,
    which has played and will continue to play a big role in the successful application
    of Deep Learning in a variety of application domains. Typically, a deep learning
    practitioner is working with high-level libraries like `Keras` or `Theano`, which
    automatically translates the computation to be performed seamlessly to `CPU` or
    `GPU`. While in a majority of the cases, a practitioner of deep learning is not
    required to understand the internal workings of the `GPU` (as many high-level
    libraries are available), it is essential to be aware of the basics.


    The essence of GPU-based computation is the notion of Single Instruction, Multiple
    Data (SIMD), wherein the same computation is being performed in parallel (over
    may cores) on multiple data points. This computational paradigm is very suitable
    for compute heavy linear algebra operations. As we have seen in earlier chapters,
    the core computation involved in training deep learning models is the computation
    of gradients and updating the parameters based on these gradients. At the heart
    of this lie basic linear algebraic operations (dot products, vector matrix multiplications,
    etc.) and this GPU-based computation is quite suitable for training (and making
    predictions) using the same.


    Let us start by describing the key elements of such a GPU-based computation. Figure
    [10-1](#main-11.xhtml#bookmark10) schematically illustrates these key elements.


    © Nikhil Ketkar 2017


    N. Ketkar, Deep Learning with Python, DOI 10.1007/978-1-4842-2766-4_10


    ![](main-131.jpg)


    #### Figure 10-1. GPU-based Computation


    The following points are to be noted:


    1. Deep learning-related computation involves some code to be executed sequentially
    and some compute-intensive code which can be parallelized.

    2. Typically, the sequential code involves loading the data from disk, etc., which
    is handled by the `CPU`.

    3. The computationally heavy code typically involves computing the gradients and
    updating the parameters. Data for this computation is first transferred to the
    `GPU` memory, and this computation then happens on the `GPU`.

    4. Next, the results are brought back to the main memory for further sequential
    processing.

    5. There might be multiple blocks of such computationally heavy code interlaced
    with sequential code.


    ■ Note there are two main ecosystems built around Gpus: one is `Cuda`, which is
    specific to nvidia, and `openCL`, which is vendor-neutral. We will be covering
    concepts around `Gpu` computation in the context of `openCL`.


    Let us start by looking at the overall programming model for GPU-based computation
    as described by `OpenCL`. `OpenCL` is a vendor neural framework for heterogeneous
    computation involving `CPUs`, `GPUs`, `DSPs` (Digital Signal Processors), and
    `FPGAs` (Field Programmable Gate Arrays), etc. Figure [10-2](#main-11.xhtml#bookmark11)
    illustrates the physical view of the system.


    ![](main-132.png)


    #### Figure 10-2. OpenCL System Physical View


    ![](main-133.png)


    The following points are to be noted:


    1. The overall system consists of the `Host` and a number of `OpenCL` devices.

    2. The `host` refers to the `CPU` running the `OS`, which can communicate with
    number of `OpenCL` devices.

    3. `OpenCL` devices are heterogeneous, as in. They might involving `CPUs`, `GPUs`,
    `DSPs` (Digital Signal Processors), and `FPGAs` (Field Programmable Gate Arrays),
    etc.

    4. `OpenCL` devices contain one or more compute units. Let''s now look at the
    logical view of an `OpenCL` system in Figure [10-3](#main-11.xhtml#bookmark12).


    ![](main-134.png)


    #### Figure 10-3. OpenCL System Logical View


    The following points are be noted:


    1. An `OpenCL` program runs on the `host`.

    2. The `OpenCL` program communicates with `OpenCL` devices using `queues`. Each
    `OpenCL` device has a separate `queue`.

    3. Each `OpenCL` device houses data in its memory, sent to it by the program running
    on the `host`.

    4. Each `OpenCL` device runs code sent to it by the program, referred to as `kernel`.

    5. The `host` program, the command `queues`, the data, and the `kernels` together
    constitute an `execution context`.

    6. The `execution context` is essentially the logical envelopment of heterogeneous
    computation. The `host` program orchestrates this computation by sending data
    and code to be executed to the `OpenCL` devices and getting the results.


    Let''s now take a look at the logical memory layout on an `OpenCL` device. Figure
    [10-4](#main-11.xhtml#bookmark13) illustrates the same.


    | Global |

    | :--- |

    | Constant |

    | Work Group |

    | Local Memory |

    | Private Memory |

    | Work Item |


    #### Figure 10-4. Device Memory


    The following points are to be noted:


    1. An `OpenCL` device has a `global memory`, which is accessible to the `host`
    program as well as all the running `kernels` on the device.

    2. An `OpenCL` device has a `constant memory`, which is just like `global memory`
    but it is read-only for an executing `kernel`.

    3. A `Work Item` is the logical unit of parallelism and it has its own `private
    memory`. Only the `kernel` code corresponding to this particular work item is
    aware of this memory.

    4. A `Work Group` is the logical unit of synchronization and it contains a number
    of `Work Items`. Note that any synchronization can only be done within a `Work
    Group`.

    5. A `Work group` has its own `Local Memory` that can only be accessed from within
    the `Work Group`.


    Let us now take a look at the programming model with respect to an `OpenCL Device`
    (Figure [10-5](#main-11.xhtml#bookmark14)).


    | Global Identifier | Count |

    | :--- | :--- |


    ![](main-135.png)


    #### Figure 10-5. Two-Dimensional NDRange Index Space


    | Workgroup | Local Identifier, Sy |

    | :--- | :--- |

