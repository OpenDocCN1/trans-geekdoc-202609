    ## Chapter 2 Machine Learning Fundamentals


    Deep Learning is a branch of `Machine Learning` and in this chapter we will cover
    the fundamentals of `Machine Learning`. While `machine learning` as a subject
    is inherently mathematical in nature, we will keep mathematics to the basic minimum
    to develop intuition about the subject. Prerequisites for the subject matter covered
    in this chapter would be linear algebra, multivariable calculus, and basic probability
    theory.


    ## Intuition


    As human beings we are intuitively aware of the concept of learning: it simply
    means to get better at a task over a period of time. The task could be physical
    (like learning to drive a car) or intellectual (like learning a new language).
    The subject of `machine learning` focuses on development of algorithms that can
    learn as humans do; that is, they get better at a task over a period over time,
    with experience.


    The first question to ask is why we would be interested in development of algorithms
    that improve their performance over time, with experience. After all, there are
    many algorithms that are developed and implemented to solve real world problems
    that don''t improve over time, they simply are developed by humans and implemented
    in software and they get the job done. From banking to e-commerce and from navigation
    systems in our cars to landing a spacecraft on the moon, algorithms are everywhere,
    and a majority of them do not improve over time. These algorithms simply perform
    the task they are intended to perform, with some maintenance required from time
    to time. Why do we need `machine learning`?


    The answer to this question is that for certain tasks it is easier to develop
    an algorithm that learns/improves its performance with experience than to develop
    an algorithm manually. While this might seem unintu to the reader at this point,
    we will build intuition for this during the course of this chapter.


    ## Binary Classification


    In order to further discuss the matter at hand, we need to be precise about some
    of the terms we have been intuitively using, like task, learning, experience,
    and improvement. We will start with the task of binary classification.


    Consider an abstract problem domain where we have data of the form:


    ```

    D = {(x[1], y[1]), (x[2], y[2]), ..., (x[n], y[n])}

    ```


    where $x \in R^n$ and $y = \pm1$. We do not have access to all such data but only
    a subset $S \subset D$. Using $S$, our task is to generate a computational procedure
    that implements the function $f:x \to y$ such that we can use $f$ to make predictions
    over unseen data $(x[i],y[i]) \in S$ that are correct, $f(x[i]) = y[i]$. Let us
    denote $U \subset D$ as the set of unseen data, that is, $(x[i], y[i]) \notin
    S$ and $(x[i], y[i]) \in U$. We measure performance over this task as the error
    over unseen data.

