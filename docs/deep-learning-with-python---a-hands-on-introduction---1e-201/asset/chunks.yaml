    ## Summary


    In this chapter we have introduced the reader to GPU-based computation, which
    is one of the key enabling technologies for Deep Learning.


    One key point to note is that, in this chapter, we have covered the basics of
    GPU computation using OpenCL, which is vendor-neutral. The concepts apply with
    minor variation to other vendor-specific GPU computation libraries like CUDA,
    which is both older and popular as compared to OpenCL. The reader is advised to
    try out the examples in the source code listings in the chapter following, while
    reading up on the documentation of CUDA, which would be much easier to follow
    given that the reader has internalized the foundations. Libraries like cuDNN,
    which is a CUDA-based library for deep learning, is recommended further reading.
    It must be noted, however, that in many cases, when it comes to applying deep
    learning to a real-world problem, it suffices to use high-level libraries like
    Theano and Keras, which generate GPU code.


    The second key point to note is the importance of GPU-based computation for Deep
    Learning. The single instruction, multiple data paradigm (SIMD) is ideal for deep
    learning, as most of computation with respect to deep learning boils down to stochastic
    gradient descent (SGD). At the heart of SGD we have the computation of gradients,
    which are essentially linear algebraic (vector/matrix) operations. As data sets
    and the sizes of the parameters grow, it becomes essential to perform SGD in a
    scalable way, and GPUs currently are the best suited computational paradigm.


