    Keras implements a number of activation functions, namely, tanh, sigmoid, hard\_sigmoid,
    linear, and relu (rectified linear unit). Activation functions and their appropriateness
    given a task (classification, multiclassification, regression, etc.) are covered
    in much detail in Chapter [3](http://dx.doi.org/10.1007/978-1-4842-2766-4_3).
