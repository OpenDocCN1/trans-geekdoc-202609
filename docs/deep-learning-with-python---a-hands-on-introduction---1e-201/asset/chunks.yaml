    ### Implementation of Automatic Differentiation


    Let us now take a look at how Automatic Differentiation is commonly implemented.
    The three key approaches are using source code transformation and operator overloading
    (explicit or implicit dual number implementation).


    #### Source Code Transformation


    The source code transformation approach involves the user implementing the loss
    function in a regular programming language and then using an automatic differentiation
    tool to generate the corresponding gradient function. These two can then be compiled
    by the standard build tool chain to be used as part of a larger application. Refer
    to Figure [9-8](#main-10.xhtml#bookmark40).


    ![](main-123.png)


    Figure 9-8. Source Code Transformation


    #### Operator Overloading


    The operator overloading approach basically is an explicit/implicit implementation
    of the dual number approach wherein the corresponding differentiation operation
    is implemented for every primitive operation of interest. Users implement their
    loss functions using the primitive operations and the computation of the gradients
    happen by the invocation of the overloaded method implementing the differentiation
    operation. Refer to Figure [9-9](#main-10.xhtml#bookmark43).


