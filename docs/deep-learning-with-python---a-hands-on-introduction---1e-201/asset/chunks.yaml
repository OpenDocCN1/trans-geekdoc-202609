    for lambda\_reg in lambda\_reg\_values:


    X\_train = numpy.column\_stack(\[numpy.power(x\_train,i) for i in xrange(0,degree)\])
    model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X\_train.transpose(),X\_train)
    + lambda\_reg \* numpy.identity(degree)),X\_train.transpose()),y\_train)


    predicted = numpy.dot(model, \[numpy.power(x,i) for i in xrange(0,degree)\]) train\_rmse.append(numpy.sqrt(numpy.sum(numpy.dot(y\[0:80\]
    - predicted\[0:80\], y\_train - predicted\[0:80\]))))


    test\_rmse.append(numpy.sqrt(numpy.sum(numpy.dot(y\[80:\] - predicted\[80:\],
    y\[80:\] - predicted\[80:\]))))'
