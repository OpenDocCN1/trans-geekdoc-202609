    ### Overall Structure of a Neural Network


    Neural Networks are constructed using the unit as a basic building block (introduced
    earlier); refer to Figure [3-2](#main-5.xhtml#bookmark12).


    ![](main-12.jpg)


    Figure 3-2. Structure of a Neural Network


    The following points are to be noted:


    1. Units are organized as layers, with every layer containing one or more units.

    2. The last layer is referred to as the output layer.

    3. All layers before the output layers are referred to as hidden layers.

    4. The number of units in a layer is referred to as the width of the layer.

    5. The width of each layer need not be the same, but the dimension should be aligned,
    as we shall see later in the chapter.

    6. The number of layers is referred to as the depth of the network. This is where
    the notion of deep (as in deep learning) comes from.

    7. Every layer takes as input the output produced by the previous layer, except
    for the first layer, which consumes the input.

    8. The output of the last layer is the output of the network and is the prediction
    generated based on the input.

    9. As we have seen earlier, a neural network can be seen as a function `f[q] :x->y`,
    which takes as input `x e R^` and produces as output `y e R^` and whose behavior
    is parameterized by `q e R^p`. We can now be more precise about `q`; it''s simply
    a collection of weights.

    10. Designing a neural network involves, amongst other things, defining the overall
    structure.


    ### Expressing the Neural Network in Vector Form


    Let us now look at the structure of a Neural Network in a more detail. Refer to
    Figure [3-3]; the following points should be noted:


    1. We can assume that our data has the form `D = {x[p] {(x[2],y[2])...(x[n],y[n])}}`
    where `x e R^` and `y e{0,1}`, which is the target of interest (currently this
    is binary, but it may be categorical or real valued depending on whether we are
    dealing with multi-class or regression problem, respectively).

    2. For a single data point we can compute the output of the Neural Network, which
    we denote as `y`.

    3. Now we need to compute how good the prediction of our Neural Network `y` is
    as compared to `y`. Here comes the notion of a loss function.

    4. A loss function measures the disagreement between `y` and `y` which we denote
    by:

    1. There are a number of loss functions appropriate for the task at hand: binary
    classification, multi-classification, or regression, which we shall cover later
    in the chapter (typically derived using Maximum Likelihood).

    5. A loss function typically computes the disagreement between `y` and `y` over
    a number of data points rather than a single data point.


    ### Evaluating the output of the Neural Network


    Now that we have looked at the structure of a Neural Network, let''s look at how
    the output of the neural network can be evaluated against labeled data. Refer
    to Figure [3-4].

