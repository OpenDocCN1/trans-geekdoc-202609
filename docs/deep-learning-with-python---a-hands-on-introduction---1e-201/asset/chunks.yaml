    CHAPTER 9


    Automatic Differentiation


    ![](main-102.png)


    In the chapter on Stochastic Gradient Descent, we treated the computation of gradients
    of the loss function V[x] L (x) as a black box. In this chapter we open this black
    box and cover the theory and practice of automatic differentiation. Automatic
    differentiation is a mature technology that allows for the effortless and efficient computation
    of gradients of arbitrarily complicated loss functions. This is critical when
    it comes to minimizing loss functions of interest; at the heart of building any
    deep learning model lies an optimization problem, which is invariably solved using
    stochastic gradient descent, which in turn requires one to compute gradients.


    Most of the applications in this chapter are based on the Python package Autograd,
    which provides a mature set of capabilities for automatic differentiation.


    Automatic differentiation is distinct from both numerical and symbolic differentiation,
    and we start by covering enough about both of these so that distinction becomes
    clear. For the purposes of illustration, assume that our function of interest
    is f: R ® R and we intend to find the derivative off denoted by f (x).


