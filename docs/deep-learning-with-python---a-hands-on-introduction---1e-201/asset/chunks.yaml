    \ = T.dmatrix(\"x\")\ny = T.dvector(\"y\")\nw = theano.shared(numpy.random.randn(features),\
    \ name=\"w\")\nb = theano.shared(0., name=\"b\")\np = 1 / (1 + T.exp(-T.dot(x,\
    \ w) - b))\nerror = squared_error(p,y)\nloss = error.mean() + 0.01 * l2(w)\ngw,\
    \ gb = T.grad(loss, [w, b])\n\ntrain = theano.function(inputs=[x,y],outputs=[p,\
    \ error], updates=((w, w - 0.1 * gw), (b, b - 0.1 * gb)))\npredict = theano.function(inputs=[x],\
    \ outputs=p)\n\nprint \"RMSE before training:\",sklearn.metrics.mean_squared_error(D[1],\
    \ predict(D[0]))\nfor i in range(training_steps):\n    prediction, error = train(D[0],\
    \ D[1])\n    print \"RMSE after training:\",sklearn.metrics.mean_squared_error(D[1],\
    \ predict(D[0]))\n\n# RMSE before training: 0.4707491496\n# RMSE after training:\
    \ 0.915701676631\n```\n\n![](main-33.jpg)\n\nFigure 4-11. Logistic Regression\n"
