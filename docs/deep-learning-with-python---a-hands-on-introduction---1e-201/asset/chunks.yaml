- fmt: "\n- 8. A shared variable allows a user to define a function with internal\
    \ state, which can be updated arbitrarily without needing to redefine the function\
    \ defined using the shared variable.\n\n### Listing 4-5. Shared Variables\n\n\
    ```python\nimport theano.tensor as T\nfrom theano import function\nfrom theano\
    \ import shared\nimport numpy\n\nx = T.dmatrix('x')\ny = shared(numpy.array([[4,\
    \ 5, 6]]))\nz = x + y\nf = function(inputs = [x], outputs = [z])\nprint \"Original\
    \ Shared Value:\", y.get_value() \nprint \"Original Function Evaluation:\", f([[1,\
    \ 2, 3]])\n\ny.set_value(numpy.array([[5, 6, 7]]))\nprint \"Original Shared Value:\"\
    , y.get_value() \nprint \"Original Function Evaluation:\", f([[1, 2, 3]])\n# Couldn't\
    \ import dot_parser, loading of dot files will not be possible.\n# Original Shared\
    \ Value: [[4 5 6]]\n# Original Function Evaluation: [array([[ 5., 7., 9.]]]]\n\
    # Original Shared Value: [[5 6 7]]\n# Original Function Evaluation: [array([[\
    \ 6., 8., 10.]]]]\n```\n\n![](main-26.jpg)\n\nFigure 4-5. Shared Variables\n\n\
    In our next example in Listing [4-6](#main-6.xhtml#bookmark36) (and the corresponding\
    \ computational graph in Figure [4-6](#main-6.xhtml#bookmark37)) we will define\
    \ a function and generate a function that computes its gradient. The reader should\
    \ note the following:\n\n1. A function needs to be defined using expressions before\
    \ the gradient of the function can be generated.\n2. The `grad` construct in Theano\
    \ allows the user to generate the gradient of a function (as an expression). Users\
    \ can then define a function over the expression, which gives them the gradient\
    \ function.\n3. 3. Gradients can be computed for any set of expressions/functions\
    \ as in the earlier examples. So, for instance, we could generate gradients for\
    \ functions with a shared state. As the shared state updates, so do the function\
    \ and the gradient function.\n\n### Listing 4-6. Gradients\n\n```python\nimport\
    \ theano.tensor as T \nfrom theano import function \nfrom theano import shared\n\
    import numpy\n\nx = T.dmatrix('x')\ny = shared(numpy.array([[4, 5, 6]]))\nz =\
    \ T.sum(((x * x) + y) * x)\nf = function(inputs = [x], outputs = [z])\ng = T.grad(z,[x])\
    \ \ng_f = function([x], g) \nprint \"Original:\", f([[1, 2, 3]])\nprint \"Original\
    \ Gradient:\", g_f([[1, 2, 3]]) \ny.set_value(numpy.array([[1, 1, 1]]))\nprint\
    \ \"Updated:\", f([[1, 2, 3]])\nprint \"Updated Gradient\", g_f([[1, 2, 3]])\n\
    # Original: [array(68.0)]\n# Original Gradient: [array([[ 7., 17., 33.]]]]\n#\
    \ Updated: [array(42.0)]\n# Updated Gradient [array([[ 4., 13., 28.]]]]\n```\n\
    \n![](main-27.jpg)\n\nFigure 4-6. Computing Gradients\n\nIn our next example in\
    \ Listing [4-7](#main-6.xhtml#bookmark38) (and the corresponding computational\
    \ graph in Figure [4-7 (a)](#main-6.xhtml#bookmark39) and Figure [4-7 (b)](#main-6.xhtml#bookmark40))\
    \ we will define a few loss functions using Theano. The `nnet` package in Theano\
    \ implements many standard loss functions.\n\n### Listing 4-7. Loss Functions\n\
    \n```python\nimport theano.tensor as T \nfrom theano import function\n\n# binary\
    \ cross entropy\na1 = T.dmatrix('a1') \na2 = T.dmatrix('a2') \nf_a = T.nnet.binary_crossentropy(a1,\
    \ a2).mean() \nf_sigmoid = function([a1, a2],[f_a]) \nprint \"Binary Cross Entropy\
    \ [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\", f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n\
    \n# categorical cross entropy\nb1 = T.dmatrix('b1')\nb2 = T.dmatrix('b2')\nf_b\
    \ = T.nnet.categorical_crossentropy(b1, b2) \nf_sigmoid = function([b1, b2],[f_b])\
    \ \nprint \"Categorical Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\"\
    , f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n\n# squared error \ndef squared_error(x,y):\n\
    \    return (x - y) ** 2\nc1 = T.dmatrix('b1')\nc2 = T.dmatrix('b2')\nf_c = squared_error(c1,\
    \ c2) \nf_squared_error = function([c1, c2],[f_c]) \nprint \"Squared Error [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\"\
    , f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n# Binary Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\
    \ array(3.05814650319446)\n# Categorical Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\
    \ array(9.1642887)\n# Squared Error [[0.01,0.01,0.01]],[0.99,0.99,0.01]]: array(9.1642887)\n\
    ```\n\n*(Note: The provided text contained some artifacts/interleaved characters\
    \ in the loss functions section which have been cleaned up for readability while\
    \ maintaining the logic.)*\n\n![](main-28.jpg)\n\nFigure 4-7 (b). Loss Functions\
    \ - Categorical Cross Entropy and Squared Error\n\n### Listing 4-8. Regularization\n\
    \n```python\nimport theano.tensor as T \nfrom theano import function\n\n# L1 Regularization\n\
    def l1(x):\n    return T.sum(abs(x))\n\n# L2 Regularization\ndef l2(x):\n    return\
    \ T.sum(x**2)\n\na = T.dmatrix('a') \nf_a = l1(a) \nf_l1 = function([a], f_a)\
    \ \nprint \"L1 Regularization:\", f_l1([[0,1,3]])\n\nb = T.dmatrix('b') \nf_b\
    \ = l2(b) \nf_l2 = function([b], f_b) \nprint \"L2 Regularization:\", f_l2([[0,1,3]])\n\
    # L1 Regularization: 4.0\n# L2 Regularization: 10.0\n```\n\n![](main-30.jpg)\n\
    \nFigure 4-8. Regularization\n\nIn our next example in Listing [4-9](#main-6.xhtml#bookmark43)\
    \ (and the corresponding computational graph in Figure [4-9](#main-6.xhtml#bookmark44))\
    \ we will define a function with a random variable. The reader should note the\
    \ following:\n\n1. There are cases/situations where we want to define functions\
    \ having a random variable (for instance introducing minor corruptions in inputs).\n\
    2. Such a random element in the function is different from having an internal\
    \ state, like in the case of shared variables.\n3. Basically, the desired outcome\
    \ in such cases/situations is that the user wants to define a function with a\
    \ random variable with a particular distribution.\n4. Theano provides a construct\
    \ called `RandomStreams`, which allows the user to define functions with a random\
    \ variable. `RandomStreams` is initialized with a `seed`.\n5. The user defines\
    \ a variable using `RandomStreams` and specifies a distribution by calling the\
    \ appropriate function (in our case, `normal`).\n6. Once defined, the random variable\
    \ can be used in the definition of expression or functions in a manner similar\
    \ to scalars and matrices.\n7. Every invocation of the function defined with a\
    \ random variable will internally draw a sample point from the set (in our case,\
    \ `normal`).\n\n### Listing 4-9. Random Streams\n\n```python\nimport theano.tensor\
    \ as T\nfrom theano import function\nfrom theano.tensor.shared_randomstreams import\
    \ RandomStreams\n import numpy\n\nrandom = RandomStreams(seed=42)\na = random.normal((1,3))\n\
    b = T.dmatrix('a')\nf1 = a * b\ng1 = function([b], f1)\nprint \"Invocation 1:\"\
    ,\nprint \"Invocation 2:\",\nprint \"Invocation 3:\",\ng1(numpy.ones((1,3)))\n\
    g1(numpy.ones((1,3)))\ng1(numpy.ones((1,3)))\n# Invocation 1:\n# Invocation 2:\n\
    # Invocation 3:\n# [[1.25614218, 0.66992188, 0.0724739], [-0.53793023, -0.70813926,\
    \ -0.66508406], [-0.10434045, 0.99601177, 0.93707751]]\n```\n\n![](main-31.jpg)\n\
    \nFigure 4-9. Random Streams\n"
