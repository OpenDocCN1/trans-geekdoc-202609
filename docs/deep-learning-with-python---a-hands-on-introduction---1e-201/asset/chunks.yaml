    V[X2]f(xi,X2) = x2~i\n\nSqrt\n\nI\\_\\_\\_\\_\\_\\_\\_\\_J\n\n输入\n\n«4 — 1\n\n\
    图 9-7. 反向模式自动微分的后向传播\n\n## 自动微分的实现\n\n现在让我们来看自动微分（Automatic Differentiation）通常是如何实现的。三种主要方法是使用源码转换和运算符重载（显式或隐式的双对数实现）。\n\
    \n### 源码转换\n\n源码转换方法涉及用户在正规编程语言中实现损失函数，然后使用自动微分工具生成相应的 `gradient function`（梯度函数）。这两个部分可以由标准构建工具链编译，作为大型应用程序的一部分使用。请参考图\
    \ 9-8。\n\n![](img/main-123.png)\n\n图 9-8. 源码转换\n\n### 运算符重载\n\n运算符重载方法基本上是双对数方法的显式/隐式实现，其中对于每个感兴趣的原始操作都实现了相应的微分操作。用户使用原始操作实现损失函数，而梯度的计算通过调用实现微分操作的重载方法来完成。请参考图\
    \ 9-9。\n\n2x\n\n![](img/main-124.png)\n\n调用梯度函数计算\n\n![](img/main-125.png)\n\n\
    运算符实现\n\n调用损失函数计算\n\nX.\n\n![](img/main-126.png)\n\n平方操作\n\n![](img/main-127.png)\n\
    \n图 9-9. 运算符重载\n\n■ 注意，运算符重载方法的一个关键实现细节是：涉及的运算符是已经在现有库/核心语言中实现的，还是由自动微分工具提供自己的运算符。`autograd`\
    \ 是自动微分工具的一个示例，它重载了已有的 `numpy` 库，而 `ano` 则提供了自己的运算符，并为这些实现了相应的微分操作。\n\n## 使用 Autograd\
    \ 动手实践自动微分\n\n现在我们将使用一个名为 `Autograd` 的 Python 包进行自动微分的动手练习。`Autograd` 实现反向模式自动微分，并可以为任意\
    \ Python 和 Numpy 代码计算导数。\n\n列表 9-1. 为 `f (, x[2])=( + x2)²` 寻找梯度\n\n```python\n\
    # 对 Numpy 进行封装\nimport autograd.numpy as numpy\n# 生成梯度的函数\nfrom autograd import\
    \ grad\n# 定义函数\ndef f(x1, x2): return numpy.sqrt(x1 * x1 + x2)\n# 计算关于输入变量 x1\
    \ 的梯度\ng1_f = grad(f,0)\n# 计算关于输入变量 x2 的梯度\ng2_f = grad(f,1)\n# 计算并打印 x1=1, x2=2\
    \ 处的函数值\nf(1,2) # 输出 2.2\n# 计算并打印 x1=1, x2=2 处关于 x1 的梯度\ng1_f(1,2) # 输出 0.44\n\
    # 计算并打印 x1=1, x2=2 处关于 x2 的梯度\ng2_f(1,2) # 输出 0.89\n```\n\n让我们通过对本章一直使用的函数 `f(x1],\
    \ x2)=( + x2)²` 求梯度开始。`Autograd` 让这变得非常简单。列表 9-1 说明了这一点。`Autograd` 提供了一个工具函数来检查计算梯度的正确性。列表\
    \ 9-2 说明了这一点，特别是当我们计算涉及复杂损失函数的梯度时，这种检查是一个好主意。列表 9-2. 检查 `f (x1], x2])=( + x2)²`\
    \ 的梯度\n\n```python\nfrom autograd.util import quick_grad\n# 定义函数\ndef f(x1, x2):\
    \ return numpy.sqrt(x1 + x2)\n# 计算并检查给定值的梯度\nquick_grad_check(f,1.0,extra_args=[2.0])\
    \ # 输出\n# 检查函数 f 在 x1=1.0 处的梯度\n# 数值梯度: 0.4472359409, 解析梯度: 0.447235955\n```\n\
    \n列表 9-3. 使用 Autograd 进行逻辑回归\n\n```python\nimport pylab\nimport sklearn.datasets\n\
    import autograd.numpy as np\nfrom autograd import grad\n# 生成数据\ntrain_X, train_y\
    \ = sklearn.datasets.make_moons(500, noise=0.1)\n# 定义逻辑回归的激活、预测和损失函数\ndef activation(x):\n\
    \    return 0.5*(np.tanh(x) + 1)\ndef predict(weights, inputs):\n    return activation(np.dot(inputs,\
    \ weights))\ndef loss(weights):\n    preds = predict(weights, train_X)\n    label_probabilities\
    \ = preds * train_y + (1 - preds) * (1 - train_y)\n    return -np.sum(np.log(label_probabilities))\n\
    # 计算损失函数的梯度\ngradient_loss = grad(loss)\n# 设置初始权重\nweights = np.array([1.0, 1.0])\n\
    # 梯度下降\nloss_values = []\nlearning_rate = 0.001\nfor i in range(100):\n    loss_values.append(loss(weights))\n\
    \    step = gradient_loss(weights)\n    weights -= step * learning_rate\n# 绘制决策边界\n\
    x_min, x_max = train_X[:, 0].min() - 0.5, train_X[:, 0].max() + 0.5\ny_min, y_max\
    \ = train_X[:, 1].min() - 0.5, train_X[:, 1].max() + 0.5\nx_mesh, y_mesh = np.meshgrid(np.arange(x_min,\
    \ x_max, 0.01), np.arange(y_min, y_max, 0.01))\nZ = predict(weights, np.c_[x_mesh.ravel(),\
    \ y_mesh.ravel()])\nZ = Z.reshape(x_mesh.shape)\ncs = pylab.contourf(x_mesh, y_mesh,\
    \ Z, cmap=pylab.cm.Spectral)\npylab.scatter(train_X[:, 0], train_X[:, 1], c=train_y,\
    \ cmap=pylab.cm.Spectral)\npylab.colorbar(cs)\n# 绘制每一步的损失\npylab.figure()\npylab.plot(loss_values)\n\
    pylab.xlabel(\"Steps\")\npylab.ylabel(\"Loss\")\npylab.show()\n```\n\n现在让我们为稍微复杂一点的逻辑回归损失函数计算梯度。我们还使用梯度下降来拟合模型。列表\
    \ 9-1 显示了相同的代码，图 9-10 和 9-11 显示了决策边界以及梯度下降步骤中的损失变化。\n\n![](img/main-128.jpg)\n\
    \n图 9-10. 逻辑回归的决策边界和训练数据\n\n![](img/main-129.jpg)\n\n图 9-11. 逻辑回归的损失\n\n## 总结\n\
    \n在本章中，我们涵盖了自动微分的基础，这在神经网络社区中通常被称为反向传播（backpropagation）。读者在本章中获得的关键点是：自动微分能够计算任意复杂损失函数的梯度，它是深度学习的关键性技术之一。读者还应该内化自动微分的概念，以及它与符号微分和数值微分的区别。\n\
    \n第 10 章\n\nGPU 简介\n\n![](img/main-130.png)\n\n"
