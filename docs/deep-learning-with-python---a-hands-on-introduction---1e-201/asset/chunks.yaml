    100. Basically, 1000 examples with 100 features.


    *   4\. We generate random target/output labels as zeros and ones.


    *   5\. We define the expressions for logistic regression involving the data (denoted by
    x), the outputs (denoted by y), the bias term (denoted by b), and the weight vector
    (denoted by w). The weight vector and the bias term are shared variables.


    *   6\. We compute the prediction, the error, and the loss using binary cross
    entropy as introduced in listing [4-7](#main-6.xhtml#bookmark38) earlier.


    *   7\. Having defined these expressions, we can now use the grad construct in
    Theano (introduced in listing ([4-6](#main-6.xhtml#bookmark36))) to compute the
    gradient.


    *   8\. We define a train function based on the gradient function. The train function defines
    the inputs, outputs, and how the internal state (shared variables) are to be updated.


    *   9\. The train function is invoked for 1000 steps; in each step the gradient
