    卷积神经网络（CNNs）本质上是采用卷积操作（而不是全连接层）作为其层之一的神经网络。CNN 是一项极其成功的技术，已应用于那些预测输入数据具有已知网格状拓扑结构的问题，例如时间序列（1-D
    网格）或图像（2-D 网格）。


    ## 卷积操作


    让我们开始建立对一维卷积操作的直观理解。给定输入 `I(t)` 和卷积核 `K(a)`，卷积操作定义为：


    ```

    s(f) = ^f (a) • K(t - a)

    ```


    考虑到卷积操作的交换性，该操作的等效形式如下：


    ```

    s(t) = ^I(t - a) • K(a)

    ```


    此外，可以将负号（翻转）替换以得到互相关，其定义如下：


    ```

    s(t) = ^I(t+a) • K(a)

    ```


    © Nikhil Ketkar 2017

    N. Ketkar, *Deep Learning with Python*, DOI 10.1007/978-1-4842-2766-4_5


    在深度学习文献和软件实现中，卷积和互相关是通用的。该操作的本质是，卷积核相对于输入是一组短得多的数据点，当输入与卷积核相似时，卷积操作的输出较高。图 5-1
    和 5-2 解释了这一核心思想。我们取任意输入和任意卷积核，执行卷积操作，当卷积核与输入的某部分相似时，将获得最大值。


    ![](img/main-40.jpg)

    图 5-1. 卷积操作 - 直观理解


    ![](img/main-41.jpg)

    图 5-2. 卷积操作 - 一维


    通过观察图 5-1 和 5-2 并注意以下几点，加强对卷积的直观理解：


    1. 输入是任意的大型数据集。

    2. 卷积核是数量少于输入的数据集。

    3. 从某种意义上说，卷积操作是将卷积核在输入上滑动，并计算卷积核与输入某部分的相似程度。

    4. 卷积操作在卷积核与输入某部分最相似产生最高值。


    卷积操作可以扩展到二维。给定输入 `I(m, n)` 和卷积核 `K(a, b)`，卷积操作定义为：


    ```

    s (t ) = -£^i (a ,b) • K(m - a, n - b)

    ```


    考虑到卷积操作的交换性，该操作的等效形式如下：


    ```

    s(t) = ££l(m - a,n - b) • K(a, b)

    ```


    此外，可以将负号（翻转）替换以得到互相关，其定义如下：


    ```

    s(t) = ££l(m + a,n+b) • K(a, b)

    ```


    图 5-3 展示了二维卷积操作。请注意，这仅仅是将卷积的概念扩展到二维。


    ![](img/main-42.jpg)


    在介绍卷积操作后，我们现在可以深入研究 CNN 的关键组成部分，即使用卷积层代替涉及矩阵乘法的全连接层。因此，全连接层可以描述为 `y = f (x ■ w)`，其中
    `x` 是输入向量，`y` 是输出向量，`w` 组权重，`f` 是激活函数。相应地，卷积层可以描述为 `y = f (s(x ■ w))`，其中 `s` 表示输入与权重之间的卷积操作。


    现在让我们对比全连接层和卷积层。图 5-4 展示了全连接层，图 5-5 示意地展示了卷积层。图 5-6 展示了卷积层中的参数共享以及全连接层中缺乏共享。应注意以下几点：


    1. 对于相同的输入和输出数量，全连接层的连接数和相应的权重要远多于卷积层。

    2. 与全连接层中的许多交互相比，卷积层中产生输出的输入交互较少。这被称为稀疏交互。

    3. 参数/权重在卷积层中是共享的，因为卷积核远小于输入，且卷积核在输入上滑动。因此，卷积层中的唯一参数/权重要少得多。


    ![](img/main-43.jpg)![](img/main-44.jpg)![](img/main-45.jpg)

    图 5-4. 全连接层中的密集交互


    ![](img/main-46.jpg)!(main-47.jpg)

    图 5-6. 参数共享与绑定权重


    ## 池化操作


    现在让我们看看 CNN 中几乎总是使用的池化操作。池化操作背后的直观原理是特征的精确位置并不重要。图 5-7 展示了二维输入的池化操作。注意以下几点：


    1. 池化在输入上操作，并应用函数 `f` 以产生输出。

    2. 函数 `f` 通常是最大值操作（最大池化），但其他变体如平均值或 `L2` 范数也可以。

    3. 对于二维输入，它是矩形的。

    4. 池化结果产生的输出在维度上比输入小得多。


    ![](img/main-48.jpg)


    现在让我们看看 CNN 中几乎总是结合卷积使用的池化操作。让我们看看之前涵盖的所有操作是如何协同工作的。参考图 5-8 和图 5-9。检测阶段简单来说是非线性激活。


    1. 卷积、检测和池化操作顺序执行，将输入转换为输出。输出被称为特征图。

    2. 输出通常传递到其他层（卷积或全连接）。

    3. 多个卷积-检测-池化块可以并行应用，消耗相同的输入并产生多个输出或特征图。


    ![](img/main-49.jpg)

    图 5-8. 卷积后的检测阶段和池化


    ![](img/main-50.jpg)

    图 5-9. 多个滤波器/卷积核产生多个特征图


    对于包含 3 个通道的图像输入，会对每个通道分别应用卷积操作，然后将卷积后的输出相加。这在图 5-10 中所示。


    ![](img/main-51.jpg)

    图 5-10. 多通道卷积


    在涵盖了 CNN 的组成元素后，我们现在可以从整体上查看图 5-11 所示的示例 CNN。该 CNN 由两个阶段的卷积-检测-池化块组成，每个阶段的多个滤波器/卷积核产生多个特征图。在这两个阶段之后，我们有一个全连接层产生输出。通常，CNN
    可能具有多个阶段的卷积-检测-池化块（采用多个滤波器），随后通常接一个全连接层。


    ![](img/main-52.jpg)


    '
- fmt: '

    Figure 5-11. A Complete Convolution Neural Network Architecture


    ## Convolution Variants


    We will now cover some variations of convolution, illustrated in Figure [5-12](#main-7.xhtml#bookmark22).
    Strided convolution is a variant of the standard convolution where the kernel
    slides over the input by moving at a predefined stride. An alternative way of
    looking at this is that the standard convolution operated at a stride size equal
    to one. Another variation is tiled convolution where there are actually multiple
    kernels that are convolved with the input alternately.


    ![](main-53.jpg)


    Figure 5-12. Convolution, variation on the theme


    Another variation on the theme is locally connected layers which basically employ
    sparsity of interactions but do not employ weight sharing. This is illustrated
    in Figure [13](#main-7.xhtml#bookmark23).


    Locally Connected Unique Weights![](main-54.jpg)[](main-55.jpg)[](main-56.jpg)[](main-57.jpg)


    Figure 13. Locally Connected Weights![](main-58.jpg)


    ## Intuition behind CNNs


    So far in this chapter we have covered the key constituent behind the CNN, namely
    the convolution operation, the pooling operation, and how they are used in conjunction.
    Let us now take a step back to internalize the intuition behind CNNs using these
    building blocks.


    The first idea to consider is the capacity of CNNs (refer to Chapter [2](http://dx.doi.org/10.1007/978-1842-2766_2)
    on the capacity of machine learning). CNNs, which replace at least one of the
    fully connected layers by the convolution operation have less capacity than a
    fully connected network. That is, there exist datasets that a fully connected
    network will be able to model that CNN will not. So the first point to note is
    that CNNs achieve more by limiting the capacity, hence making training efficient.


    The second idea to consider is that learning filters is, in a sense, representation
    learning. For instance the learned filters might learn to detect edges, shapes,
    etc. important point to consider here is that we are not manually describing features
    to be extracted from input but are describing an architecture that learns to engineer
    representations.


    The third idea to consider is location invariance introduced by the pooling operation.
    The pooling operation separates the location of the feature from the fact that
    it is detected. A filter detecting straight lines might detect this in any portion
    of the image, but the pooling operation picks the fact that the feature is detected
    (max pooling).


    The fourth idea is hierarchy. A CNN may have multiple convolution and pooling
    layers stacked up followed by a fully connected network. This allows the CNN to
    build a hierarchy of concepts wherein abstract concepts are based on simpler concepts
    (refer to Chapter [1](http://dx.doi.org/10.1007/978-1842-2766_1)).


    The fifth and last idea is the presence of a fully connected layer at the end
    of series convolution and pooling layers. The idea is that the series of convolution
    and pooling layers generates features and a standard neural network learns the
    final classification/regression function. It is important to distinguish this
    aspect of the CNN from traditional machine learning. In traditional machine learning,
    an expert would hand engineer features and feed them to a neural network. In the
    case of CNNs, these features/representations are being learned from data.


    ## Summary


    In this chapter we covered the basics of CNNs. The key takeaway points are the
    convolution operation, the pooling operation, how they are used in conjunction,
    and how features are not hand engineered but learned. CNNs are the most successful
    application of deep learning and embody the idea of learning features/representations
    rather than hand engineering them.


    # CHAPTER 6 Recurrent Neural Networks


    ![](main-59.png)


    Recurrent Neural Networks (RNNs) in essence are neural networks that employ recurrence,
    which is basically using information from a previous forward pass over the neural
    network. Essentially, all RNNs can be described as a recurrence relationship.
    RNNs are suited and have been incredibly successful when applied to problems wherein
    the input data on which the predictions are to be made is in the form of a sequence
    (series of entities where order is important).


    ## RNN Basics


    Let us start by describing the moving parts of a RNN. First we introduce some
    notation.


    1. We will assume that input consists of a sequence of entities `x(1), x2...,
    xT`.

    2. Corresponding to this input we either need to produce a sequence `y(1), y2,
    ..., yT` or just one output for the entire input sequence `y`.

    3. To distinguish between what the RNN produces and what it is ideally expected
    to produce we will denote by `y(1), y(2), y(t)` or `y` the output the RNN produces.


    Note that this is distinct from what the RNN should ideally produce, which is
    denoted by `y(1), y(2), y(T)` or `y`.


    RNNs either produce an output for every entity in the input sequence or produce
    a single output for the entire sequence. Let us consider the case where an RNN
    produces one output for every entity in the input. The RNN can be described using
    the following equations:


    ```

    h(t) = tanh(U*x(t) + W*h(t-1) + b)

    ```


    The following points about the RNN equations should be noted:


    1. The RNN computation involves first computing the hidden state for an entity
    in the sequence. This is denoted by `h(t)`.

    2. The computation of `h(t)` uses the corresponding input at entity `x(t)` and
    the previous hidden state `h(t-1)`.

    3. The output `y(t)` is computed using the hidden state `h(t)`.

    4. There are weights associated with the input and previous hidden state while
    computing the current hidden state. This is denoted by `U` and `W` respectively.
    There is also a bias term `b`.


    © Nikhil Ketkar 2017 DOI 10.1007/978-1842-2766_4


    5. There are weights associated with the hidden state while computing the output;
    this is denoted by `V`. There is also a bias term `c`.

    6. The `tanh` activation function (introduced in earlier chapters) is used in
    the computation of the hidden state.

    7. The `softmax` activation function is used in the computation of the output.

    8. The RNN as described by the equations can process an arbitrarily large sequence.

    9. The parameters of the RNN, namely `U`, `W`, `V`, `b`, `c`, etc. are shared
    across the computation of the hidden layer and output value (for each of the entities
    in the sequence).


    Figure [6-1](#main-7.xhtml#bookmark31) illustrates an RNN. Note how the illustration
    depicts the recurrence relation with the self-loop at the hidden state.


    ![](main-60.jpg)


    Figure 6-1. RNN (Recurrence using the previous hidden state)


    The figure also depicts a loss function associated with each output associated
    with each input. We will refer back to it when we cover how RNNs are trained.


    Presently, it''s essential to internalize how an RNN is different from all the
    feedforward neural networks (including convolution networks) we have seen earlier.
    The key difference is the hidden state, which represents a summary of the entities
    seen in the past (for the same sequence).


    Ignoring for the time being how RNNs are trained, it should be clear to the reader
    how a trained RNN could be used. For a given sequence of inputs, an RNN would
    produce an output for each entity in the input.


    Let us now consider a variation in the RNN wherein instead of the recurrence using
    the hidden state, we have recurrence using the output produced in the previous
    state (refer to Figure [6-2](#main-7.xhtml#bookmark32)).


    ![](main-61.jpg)


    Figure 6-2. RNN (Recurrence using the previous output)


