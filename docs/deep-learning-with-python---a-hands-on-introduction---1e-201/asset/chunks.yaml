- fmt: '

    While target values can be binary (0,1) in many cases, it is advisable to transform
    the target variable to values that lie within the range (not asymptotically, but
    practically) of the activation functions used to define the `loss function`. Not
    doing so leads to parameters being updated to higher and higher values without
    achieving any effect (on the output label). However, if the value of the target
    label is being used as a measure of `confidence`, then the labels which have been
    unnecessarily pushed to higher values are bad estimates of the `confidence`. While
    0 and 1 may be extreme values for the activation function, it is also important
    not to choose targets that lie in the linear region of the activation function.
    A recommended approach is to choose values that maximize the second derivative
    of the activation function, for instance, `±1` for `f (x) = 1.7159tanh| ²x`.


    ### Initializing Parameters

    It is a recommended practice to initialize parameters randomly (normal distribution,
    zero-mean, unit variance). Another recipe for neural networks where the activation
    function is `f (x) = 1.7159tanh 2 [x]` (and the data is standardized) is to set
    weights to `m ²` where `m` is the `fan-in` (the number of connections feeding
    into the node).


    ### Shuffling Data

    It is recommended practice to shuffle input data, as it may be in a particular
    order and hence might bias the `SGD`. A rare exception to this is `Curriculum
    Learning` wherein examples are presented in a meaningful order (increasing difficulty
    of prediction).


    ### Batch Normalization

    While our parameters are initialized in a way such that they are normalized (set
    randomly, normal distribution, zero-mean, and unit variance), they do not remain
    normalized over the update steps. Batch normalization renormalizes parameters
    after each batch (refer to `batch SGD`).


    ### Early Stopping

    Early stopping basically involves measuring the loss on an unseen (unused for
    SGD) subset of training data (called `validation data`) and stopping when there
    is no change observed in the loss. Typically, there are two hyper parameters:
    one which determines whether the change is significant (any change in loss less
    than this value is treated as not a change) and a `patience` parameter, which
    is the number of times a no change step can be taken before the iterative procedure
    terminates.


    ### Gradient Noise

    The gradient noise trick introduces a mean centered noise, `N(0,s)` in every update
    step. Here, `a` is a hyper parameter and the gradient is computed as `g[i] = g[i]
    + N (0,ct)`.


    ## Parallel and Distributed SGD

    We now cover two parallel and distributed approaches for `SGD`. `SGD` in its basic
    form is a sequential algorithm and convergence can be very slow on large data
    sets and models with a large number of parameters. Parallel and distributed approaches
    have a great impact when it comes to dealing with large volumes of training data
    (in the order of billions) and a large number of model parameters (in the order
    of millions).


    ### Hogwild

    Consider the update step of the `SGD` procedure. What makes the algorithm inherently
    sequential is update step `x = x\-a V[x]L(x)`. Let''s say that we want to employ
    multiple threads of computation to make the iteration faster. Since we want only
    one thread to do this (do the update one step at a time), we would place a `lock`
    around this step (to prevent a race condition). Once we do that, this essentially
    becomes a sequential algorithm; no matter how many cores and threads we devote
    to the process, only one thread is actually doing the work, while all others are
    waiting on a lock.


    The intuition behind `Hogwild` is that the race condition caused by not placing
    a lock on the update step does not lead to much inconsistency in updates when
    the optimization problem is sparse. This is simply because each update step touches
    only a few parameters. The authors of `Hogwild` provide strong theoretical and
    empirical evidence for this finding and the gains on large datasets are significant.
    `Hogwild` is easy to implement on multi-core CPUs and GPUs.


    ### Downpour

    Downpour is a distributed algorithm for `SGD` that consists of two key moving
    parts: `model replica` and `parameter server` (refer to Figure [8-9](#main-10.xhtml#bookmark6)).
    A `model replica` is a set of machines that operates on a subset of data, where
    every machine operates only on a subset of parameters. There are many such model
    replicas, each operating on a different subset of a large dataset. The `parameter
    server` is a set of machines that maintains a common global state of the model.
    `Model replicas` retrieve the global state from the `parameter server`, update
    the model based on the subset of data and update the global state. Note that the
    fetch and update of the global state does not happen at every iteration. There
    are two levels of distribution with `Downpour`. First, the model parameters (what
    we have been denoting as `x` so far) are split across multiple machines in each
    `model replica`. Second, the data is split amongst model replicas. So, essentially,
    each machine is doing the gradient update step on a subset of model parameters,
    using a subset of data. The global state is updated asynchronously. In spite of
    the apparent inconsistencies introduced by `Downpour`, it has been found to be
    very effective when it comes to training a large model with large amounts of data.


    ![](main-97.jpg)

    Figure 8-9. Downpour


    ## Hands-on SGD with Downhill

    We will now a hands-on exercise with `SGD` using a Python package called `Downhill`.
    `Downhill` implements `SGD` with many of its variants. It operates on loss functions
    defined in `Theano`, which makes it a very convenient tool to play with `SGD`
    variants on arbitrary loss functions defined in `Theano`.


    ### 1. Generating data

    ```python

    #Set Seed

    numpy.random.seed(0)


    #num of examples

    num_examples = len(train_X)


    #Our Neural Network

    nn_input_dim = 2

    nn_hdim = 1000

    nn_output_dim = 2


    #Specifiy the number of examples and the noise level

    train_X, train_y = sklearn.datasets.make_moons(5000, noise=0.1)


    #One hot encode the target values

    train_y_onehot = numpy.eye(2)[train_y]

    ```


    ### 2. Defining the loss function

    ```python

    #Regularization

    reg_lambda = numpy.float64(0.01)


    #Weights and bias terms

    W1_val = numpy.random.randn(nn_input_dim, nn_hdim)

    b1_val = numpy.zeros(nn_hdim)


    W2_val = numpy.random.randn(nn_hdim, nn_output_dim)

    b2_val = numpy.zeros(nn_output_dim)


    X = T.matrix(''X'')

    y = T.matrix(''y'')


    W1 = theano.shared(W1_val, name=''W1'')

    b1 = theano.shared(b1_val, name=''b1'')

    W2 = theano.shared(W2_val, name=''W2'')

    b2 = theano.shared(b2_val, name=''b2'')


    #Our Loss function

    z1 = X.dot(W1) + b1

    a1 = T.tanh(z1)

    z2 = a1.dot(W2) + b2

    y_hat = T.nnet.softmax(z2)


    loss_reg = 1./batch_size * reg_lambda/2 * (T.sum(T.sqr(W1)) + T.sum(T.sqr(W2)))

    loss = T.nnet.categorical_crossentropy(y_hat, y).mean() + loss_reg


    prediction = T.argmax(y_hat, axis=1)

    predict = theano.function([X], prediction)

    ```


    ### 3. SGD

    ```python

    #Store the training and vlidation loss

    train_loss = []

    validation_loss = []


    opt = downhill.build(''sgd'', loss=loss)

    ```

