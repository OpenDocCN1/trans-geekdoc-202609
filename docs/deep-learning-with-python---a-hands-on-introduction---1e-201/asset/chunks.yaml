    users to experiment with these activation functions with very little coding effort.


    Let us now look at the constructs Keras provides to build the Convolution Neural
    Networks introduced in Chapter [5](http://dx.doi.org/10.1007/978-1-4842-2766-4_5).
    The data set we will be using is the MNIST data set, which is a commonly used
    benchmark data set for deep learning. The data set consists of handwritten digits
    (60,000 training examples and 10,000 test examples). The task at hand is to predict
    the digit given the image, so this is a multiclassifcation problem with ten classes.


    Listing 7-7. CNN


    import numpy as np


    from keras.datasets import mnist


    from keras.models import Sequential


    from keras.layers import Dense, Dropout, Activation, Flatten from keras.layers
    import Convolution2D, MaxPooling2D from keras.utils import np\_utils


    from keras.utils.visualize\_util import plot


    \# Image Size


    img\_rows, img\_cols = 28, 28


    \# Filter


    nb\_filters = 32


    \# Pooling


    pool\_size = (2, 2)


    \# Kernel kernel\_size = (3, 3)


    \# Prepare dataset


    (X\_train, y\_train), (X\_test, y\_test) = mnist.load\_data()


    X\_train = X\_train.reshape(X\_train.shape\[0\], img\_rows, img\_cols, 1)


    X\_test = X\_test.reshape(X\_test.shape\[0\], img\_rows, img\_cols, 1)


    input\_shape = (img\_rows, img\_cols, 1)


    X\_train = X\_train.astype(''float32'')


    X\_test = X\_test.astype(''float32'')


    X\_train /= 255


    X\_test /= 255


    nb\_classes = 10


    Y\_train = np\_utils.to\_categorical(y\_train, nb\_classes)


    Y\_test = np\_utils.to\_categorical(y\_test, nb\_classes)


    \# CNN


    model = Sequential() model.add(Convolution2D(nb\_filters, kernel\_size\[0\], kernel\_size\[1\],
    border\_mode=''valid'', input\_shape=input\_shape))


    model.add(Activation(''relu'')) model.add(Convolution2D(nb\_filters, kernel\_size\[0\],
    kernel\_size\[1\])) model.add(Activation(''relu''))


    model.add(MaxPooling2D(pool\_size=pool\_size))


    model.add(Dropout(0.25)) model.add(Flatten()) model.add(Dense(128))


    model.add(Activation(''relu'')) model.add(Dropout(0.5)) model.add(Dense(nb\_classes)) model.add(Activation(''softmax''))


    \# Compilation model.compile(loss=''categorical\_crossentropy'', optimizer=''adadelta'',
    metrics=\[''accuracy''\])


    \# Training


    batch\_size = 128


    nb\_epoch = 1


    model.fit(X\_train, Y\_train, batch\_size=batch\_size, nb\_epoch=nb\_epoch, verbose=1,
    validation data=(X\_test, Y\_test))


    \# Evaluation


    score = model.evaluate(X\_test, Y\_test, verbose=0)


    print "Test Metrics:", zip(model.metrics\_names, score) plot(model, to\_file=''s7.png'',
    show\_shapes=True)


