    import numpy as np


    import pyopencl as cl


    import time


    matrix1 = np.random.random((500,500)).astype(np.float32)


    matrix2 = np.random.random((500,500)).astype(np.float32)


    cl\_context = cl.create\_some\_context()


    queue = cl.CommandQueue(cl\_context)


    mf = cl.mem\_flags


    matrix1\_in\_gpu = cl.Buffer(cl\_context, mf.READ\_ONLY | mf.COPY\_HOST\_PTR,
    hostbuf=matrix1)


    matrix2\_in\_gpu = cl.Buffer(cl\_context, mf.READ\_ONLY | mf.COPY\_HOST\_PTR,
    hostbuf=matrix2) result\_in\_gpu = cl.Buffer(cl\_context, mf.WRITE\_ONLY, matrix1.nbytes)


    cl\_program = cl.Program(cl\_context, """


    \_\_kernel void product(


    int size, \_\_global const float \*matrix1, \_\_global const float \*matrix2,
    \_\_global float \*result)


    {


    int i = get\_global\_id(0);


    int j = get\_global\_id(1); result\[i + size \* j\] = 0;


    for (int k = 0; k < size; k++)


    {


    result\[i + size \* j\] += matrix1\[k + size \* i\] \* matrix2\[j + size \* k\];


    }


    }


    """).build()


    t0 = time.time()


    cl\_program.product(queue, matrix1.shape, None, np.int32(len(matrix1)), matrix1\_in\_gpu,
    matrix2\_in\_gpu, result\_in\_gpu)


    t1 = time.time() gpu\_time = t1 - t0 print "GPU Time", gpu\_time


    result\_in\_numpy = np.empty\_like(matrix1) cl.enqueue\_copy(queue, result\_in\_numpy,
    result\_in\_gpu)


    t0 = time.time()


    cpu\_result = np.dot(matrix1, matrix2)


    t1 = time.time() cpu\_time = t1 - t0 print "CPU Time", cpu\_time


    print "Norm of Difference", np.linalg.norm(result\_in\_numpy - cpu\_result.T)


