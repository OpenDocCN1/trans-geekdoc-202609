    ## Training RNNs


    Let us now look at how RNNS are trained. To do this, we first need to look at
    how the RNN looks when we unroll the recurrence relation which is at the heart
    of the RNN.


    L


    ![](main-65.jpg)


    O^¹’ □«^((2>) n»^(<3)) c«^(<4)\>


    ![](main-66.jpg)![](main-67.jpg)![](main-68.jpg)![](main-69.jpg)


    Figure 6-4. Unrolling the RNN corresponding to Figure [6-1](#main-7.xhtml#bookmark31)


    Unrolling the recurrence relation corresponding to RNN is simply writing out the
    equations by recursively substituting the value on which recurrence relation is
    defined. In the case of the RNN in Figure [6-1](#main-7.xhtml#bookmark31), this is
    h^(^t^). That is, the value of h^(^t^) is defined in terms of h^(^t^(\-1)), which
    in turn is defined in terms of h^(^t ^(\-2)) and so on till h^((0)).


    ![](main-70.jpg)![](main-71.jpg)


    We will assume that h^((0)) is either predefined by the user, set to zero, or
    learned as another parameter/ weight (learned like W, V, or b). Unrolling simply
    means writing out the equations describing the RNN in terms of h^((0)). Of course,
    in order to do so, we need fix the length of the sequence, which is denoted by
    t. Figure [6-4](#main-7.xhtml#bookmark36) illustrates the unrolled RNN corresponding
    to the RNN in Figure [6-1](#main-7.xhtml#bookmark31) assuming an input sequence of
    size 4. Similarly, Figure [6-5](#main-7.xhtml#bookmark37) and [6-6](#main-7.xhtml#bookmark38)
    illustrate the unrolled RNNs corresponding to the RNNs in Figure [6-2](#main-7.xhtml#bookmark32) and
    [6-3](#main-7.xhtml#bookmark33) respectively. The following points are to be noted:


    *   1\.  The unrolling process operates on the assumption that the length of the
    input sequence is known beforehand and based on the recurrence is unrolled.


    *   2\.  Once unrolled, we essentially have a non-recurrent neural network.


    *   3\.  The parameters to be learned, namely, U,W,V,b,c, etc. (denoted in dark
    in the


    diagram) are shared across the computation of the hidden layer and output value.
    We have seen such parameter sharing earlier in the context of CNNs.


    *   4\.  Given an input and output of a given size, say t (assumed to be 4 in
    Figures[ 6-4](#main-7.xhtml#bookmark36),


    [6-5](#main-7.xhtml#bookmark37), [6-6](#main-7.xhtml#bookmark38)), we can unroll
    an RNN and compute gradients for the parameters to be learned with respect to
    a loss function (as we have seen in earlier chapters).


    *   5\.  Thus, training an RNN is simply unrolling the RNN for a given size of
    input (and, correspondingly, the expected output) and training the unrolled RNN
    via computing the gradients and using stochastic gradient descent.


    As mentioned earlier in the chapter, RNNs can deal with arbitrarily long inputs
    and correspondingly, they need to be trained on arbitrarily long inputs. Figure
    [6-7](#main-7.xhtml#bookmark39) illustrates how an RNN is unrolled for different sizes
    of inputs. Note that once the RNN is unrolled, the process of training the RNN
    is identical to training a regular neural network which we have covered in earlier
    chapters. In Figure [6-7](#main-7.xhtml#bookmark39) the RNN described in Figure
    [6-1](#main-7.xhtml#bookmark31) is unrolled for input sizes of 1,2,3 and 4.


    ![](main-72.jpg)


    Figure 6-7. Unrolling the RNN corresponding to Figure [6-1](#main-7.xhtml#bookmark31)
    for different sizes of inputs


    Given that the data set to be trained on consists of sequences of varying sizes,
    the input sequences are grouped so that the sequences of the same size fall in
    one group. Then for a group, we can unroll the RNN for the sequence length and
    train. Training for a different group will require the RNN to be unrolled for
    a different sequence length. Thus, it is possible to train the RNN on inputs of
    varying sizes by unrolling and training with the unrolling done based on the sequence
    length.


    ![](main-73.jpg)


    Figure 6-8. Teacher Forcing (Top - Training, Bottom - Prediction)


    It must be noted that training the unrolled RNN (illustrated in Figure [6-1](#main-7.xhtml#bookmark31))
    is essentially a sequential process, as the hidden states are dependent on each
    other. In the case of RNNs wherein the recurrence is over the output instead of
    the hidden state (Figure [6-2](#main-7.xhtml#bookmark32)), it is possible to use
    a technique called teacher forcing as illustrated in Figure [6-8](#main-7.xhtml#bookmark40).
    The key idea here is to use y^(^t^(\-1)) instead of y^((-1)) in the computation
    of h® while training. While making predictions (when the model is deployed for
    usage), however, y‘^(\-1)) is used.


    ## Bidirectional RNNs


    Let us now take a look at another variation on RNNs, namely, the bidirectional
    RNN. The key intuition behind a bidirectional RNN is to use the entities that
    lie further in the sequence to make a prediction for the current entity. For all
    the RNNs we have considered so far we have been using the previous entities (captured by
    the hidden state) and the current entity in the sequence to make the prediction.
    However, we have not been using information concerning the entities that lie further
    in the sequence to make predictions. A bidirectional RNN leverages this information
    and can give improved predictive accuracy in many cases.


    A bidirectional RNN can be described using the following equations:


    h^([f]^t^)\=tanh[(]U[f]x^(^t^)+W[f]h^(^t^(+1))+b[f] [)]


    h[b]^(^t^) =tanh[(]U[b]x^(^t^)+W[b]h^(^t^(\-1))+b[b] [)]


    y ^v^) = softmax ((^) + V[f]hf^) + c )


