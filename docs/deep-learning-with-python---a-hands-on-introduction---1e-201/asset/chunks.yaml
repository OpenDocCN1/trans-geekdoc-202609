- fmt: "\n### Linear Unit\nThe Linear unit is the simplest unit which transforms the\
    \ input as `y=w.x+b`. As the name indicates, the unit does not have a non-linear\
    \ behavior and is typically used to generate the mean of a conditional Gaussian\
    \ distribution. Linear units make gradient-based learning a fairly straightforward\
    \ task.\n\n### Sigmoid Unit\nThe Sigmoid unit transforms the input as follows:\n\
    \n`[y] = 1 ^y = 1 \\+ e`\n\nThe underlying activation function (refer to Figure\
    \ [3-6](#main-6.xhtml#bookmark6)) is given by\n\n```\nf(x)=\n```\n\nSigmoid units\
    \ can be used in the output layer in conjunction with binary cross entropy for\
    \ binary classification problems. The output of this unit can model a Bernoulli\
    \ distribution over the output `y` conditioned over `x`.\n\n![](main-16.jpg)\n\
    \n### Softmax Layer\nThe Softmax layer is typically used as an output layer for\
    \ multi-classification tasks in conjunction with the Cross Entropy loss function.\
    \ Refer to Figure [3-7](#main-6.xhtml#bookmark9). The Softmax layer normalizes\
    \ outputs of the previous layer so that they sum up to one. Typically, the units\
    \ of the previous layer model an un-normalized score of how the input is to belong\
    \ to a particular class. The softmax layer normalized this so that the output\
    \ represents the probability for every class.\n\n![](main-17.jpg)\n\n### Rectified\
    \ Linear Unit (ReLU)\nRectified Linear Unit used in conjunction with a linear\
    \ transformation transforms the input as\n\n```\nf(x)=max(0,wx +b).\n```\n\nThe\
    \ underlying activation function is `f(x)=max(0,x)`; refer to Figure [3-8](#main-6.xhtml#bookmark12).\
    \ The ReLU unit is more commonly used as a hidden unit in recent times. Results\
    \ show that ReLU units lead to large and consistent gradients, which helps gradient-based\
    \ learning.\n\n![](main-18.jpg)\n\n### Hyperbolic Tangent\nThe Hyperbolic Tangent\
    \ unit transforms the input (used in conjunction with a linear transformation)\
    \ as follows:\n\n```\ny = tanh(wx + b).\n```\n\nThe underlying activation function\
    \ (refer to Figure [3-9](#main-6.xhtml#bookmark15)) is given by\n\n```\nf(x)=\
    \ tanh(x ).\n```\n\nThe hyperbolic tangent unit is also commonly used as a hidden\
    \ unit.\n\n![](main-19.jpg)\n\nListing 3-1. A 2-Layer Neural Network for Regression\n\
    \n```python\nimport autograd.numpy as np\nimport autograd.numpy.random as npr\
    \ from autograd import grad import sklearn.metrics\nimport pylab\n\n# Generate\
    \ Dataset examples\nexamples = 1000\nfeatures = 100\nD = (npr.randn(examples,\
    \ features), npr.randn(examples))\n\n# Specify the network layer\nlayer1_units\
    \ = 10\nlayer2_units = 1\nw1 = npr.rand(features, layer1_units)\nb1 = npr.rand(layer1_units)\n\
    w2 = npr.rand(layer1_units, layer2_units)\nb2 = 0.0\ntheta = (w1, b1, w2, b2)\n\
    \n# Define the loss function\ndef squared_loss(y, y_hat):\n    return np.dot((y\
    \ - y_hat),(y - y_hat))\n\n# Output Layer\ndef binary_cross_entropy(y, y_hat):\n\
    \    return np.sum(-((y * np.log(y_hat)) + ((1-y) * np.log(1 - y_hat)))) # Wraper\
    \ around the Neural Network\ndef neural_network(x, theta):\n    w1, b1, w2, b2\
    \ = theta\n    return np.tanh(np.dot((np.dot(x,w1) + b1)), w2) + b2)\n\n# Wrapper\
    \ around the objective function to be optimised\ndef objective(theta, idx):\n\
    \    return squared_loss(D[1][idx], neural_network(D[0][idx], theta))\n\n# Update\n\
    def update_theta(theta, delta, alpha):\n    w1, b1, w2, b2 = theta\n    w1_delta,\
    \ b1_delta, w2_delta, b2_delta = delta\n    w1_new = w1 - alpha * w1_delta\n \
    \   b1_new = b1 - alpha * b1_delta\n    w2_new = w2 - alpha * w2_delta\n    b2_new\
    \ = b2 - alpha * b2_delta\n    new_theta = (w1_new,b1_new,w2_new,b2_new)\n   \
    \ return new_theta\n\n# Compute Gradient\ngrad_objective = grad(objective)\n\n\
    # Train the Neural Network\nepochs = 10\nprint \"RMSE before training:\", sklearn.metrics.mean_squared_error(D[1],neural_network(D[0],\
    \ theta))\nrmse = []\nfor i in xrange(0, epochs):\n    for j in xrange(0, examples):\n\
    \        delta = grad_objective(theta, j)\n        theta = update_theta(theta,delta,\
    \ 0.01)\n    rmse.append(sklearn.metrics.mean_squared_error(D[1],neural_network(D[0],\
    \ theta)))\nprint \"RMSE after training:\", sklearn.metrics.mean_squared_error(D[1],neural_network(D[0],\
    \ theta))\n```\n\nRMSE before training: 1.8821465439\nRMSE after training: 0.739508\n\
    \n![](main-20.jpg)\n\n## Neural Network Hands-on with Autograd\nWe will now build\
    \ a simple Neural Network from scratch. The only external library we will using\
    \ is `autograd`. Note autograd is covered in more detail in the chapter.\n\n##\
    \ Summary\nIn this chapter we covered feed forward neural networks, which will\
    \ serve as the conceptual foundation for the rest of the chapters. The key concepts\
    \ we covered were the overall structure of the network, the input, hidden and\
    \ output layers, cost functions. We encourage the reader to try out the example.\n\
    \n## Introduction to Theano\nIn this chapter we introduce the reader to Theano,\
    \ which is a library for defining mathematical functions (operating over vectors\
    \ and matrices), and computing the gradients of these functions. Theano is the\
    \ foundational layer on which many deep learning packages are based.\n\n### What\
    \ is Theano\nAs we have seen before, building deep learning models fundamentally\
    \ involves optimizing loss functions using stochastic gradient descent (SGD),\
    \ requiring the computation of the gradient of loss function. As loss functions\
    \ in deep learning are complicated, it is not convenient to manually derive such\
    \ gradients. This is where Theano comes in handy. Theano allows the user to define\
    \ mathematical expressions that, once these are defined, Theano allows the user\
    \ to compute the gradients of these expressions.\n\nA typical workflow for using\
    \ Theano is as follows:\n1. Write symbolic expressions in Python that implement\
    \ the loss function of the model to be built.\n2. Use the symbolic/automatic differentiation\
    \ capabilities in Theano to generate an expression that produces the gradient\
    \ of the loss function.\n3. Pass this gradient function as a parameter to a SGD\
    \ optimization routine to optimize the loss function.\n\nTheano allows a user\
    \ to focus on the model rather than on the mechanics of deriving the gradient.\
    \ The specific capabilities of Theano that make it a great toolbox for building\
    \ deep learning models are as follows:\n1. a very seamless integration with Numpy\
    \ that allows the user to use Numpy objects (vectors and matrices) in the definition\
    \ of loss functions\n2. Theano can generate optimized code for both CPU as well\
    \ as GPU under the hood without the user having to rewrite the code, which defines\
    \ the loss function.\n3. optimized automatic/symbolic differentiation\n4. numerical\
    \ stability for the generated code via automatic/symbolic differentiation\n"
