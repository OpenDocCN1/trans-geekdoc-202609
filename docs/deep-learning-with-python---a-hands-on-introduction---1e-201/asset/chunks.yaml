  trans: "\n\n## 4. 工作项标识符可以是 1 维、2 维或 3 维的 (`NDRange`）。这基本上使得我们很容易为 1 维（时间序列）、2 维（图像）和\
    \ 3 维（体积数据）数据集编写内核（kernels）。\n\n现在让我们介绍一些允许我们描述索引的符号。假设索引是 2 维的，但同样的原理也适用于 1 维或\
    \ 3 维数据。我们用 `(G[x], G[y])` 表示全局索引空间。现在来看这个全局索引空间是如何分解为工作组（work groups）和工作项（work\
    \ items）的。为了方便起见，我们定义了偏移量 `(F[x], F[y])`，用于定义未划分工作项和工作组的索引部分。让 `(S[x], S[y])`\
    \ 定义工作组的大小`(W[x], W[y])` 定义工作组的数量。类似地，让 `(g[x], g[y])` 表示全局标识符，`(s[x], s[y])`\
    \ 表示本地标识符，并让 `(w[x], w[y])` 表示工作组标识符。那么，本地和全局标识符之间的关系描述为 `(g, g) = (w * S + s\
    \ + F, w * S + s + F)`。\n\n为给定的计算编写内核基本上涉及利用这种标识符机制以及内核在工作项和工作组上的并行调用来完成当前任务。列表\
    \ 10-2 和 10-3 分别说明了向量加法和矩阵乘法的示例。列表 10-1 仅仅打印 OpenCL 系统的细节，读者可以使用这些细节来确定他们系统的详细信息。\n\
    \n### 列表 10-1. 获取 GPU 信息\n\n```python\nimport pyopencl as cl\n\nprint \"OpenCL\
    \ Platforms and Devices\" for platform in cl.get_platforms():\n    print \"Platform:\
    \ \", platform.name, \" Vendor: \", platform.vendor, \" Version: \", platform.version,\
    \ \" Profile: \", platform.profile\n    for device in platform.get_devices():\n\
    \        print(\"\\tDevice Name: \", device.name, \"\\tDevice Type: \", cl.device_type.to_string(device.type),\
    \ \"\\tMax Clock Speed: \", \"{0} Mhz\".format(device.max_clock_frequency), \"\
    \\tCompute Units: \", \"{0}\".format(device.max_compute_units), \"\\tLocal Memory:\
    \ \", \"{0:.0f} KB\".format(device.local_mem_size/1024.0), \"\\tConstant Memory:\
    \ \", \"{0:.0f} KB\".format(device.max_constant_buffer), \"\\tGlobal Memory: \"\
    , \"{0:.0f} GB\".format(device.global_mem_size/(1024*1024*1024.0))\n\n# OpenCL\
    \ Platforms and Devices\n# Platform Name: Apple, Vendor: Apple, Version: OpenCL\
    \ 1.2 (Nov 18 2015 20:45:47), Profile: FULL\n# Device Name: Intel(R) Core(TM)\
    \ i7-7700HQ @ 2.20GHz, Type: CPU, Max Clock Speed: 2200 Mhz, Compute Units: 8,\
    \ Local Memory: 32 KB, Constant Memory: 64 KB, Global Memory: 16 GB\n# Device\
    \ Name: Iris, Type: GPU, Max Clock Speed: 1200 Mhz, Compute Units: 40, Local Memory:\
    \ 64 KB, Constant Memory: 64 KB, Global Memory: 2 GB\n```\n\n### 列表 10-2. 向量加法\n\
    \n```python\nimport numpy as np\nimport pyopencl as cl\nimport time\n\nvector1\
    \ = np.random.random()\nvector2 = np.random.random()\n# ... (代码省略，保持逻辑一致)\n# \"\
    GPU Time\",\n_\n\n\n## of of\n...norm(result_norm - cpu_result)\n\n# GPU Time\
    \ 0.0020268108521\n# CPU Time 0.009539756749\n# Norm of Difference 0.0\n```\n\n\
    ### 列表 10-3. 矩阵乘法\n\n```python\nimport numpy as np\nimport pyopencl as cl\nimport\
    \ time\n\nmatrix1 = np.random.random((500,500)).astype(np.float32)\nmatrix2 =\
    \ np.random.random((500,500)).astype(np.float32)\ncl_context = cl.create_some_context()\n\
    queue = cl.CommandQueue(cl_context)\nmf = cl.mem_flags\nmatrix1_in_gpu = cl.Buffer(cl_context,\
    \ mf.READ_ONLY | mf.HOST_PTR, hostbuf=matrix1)\nmatrix2_in_gpu = cl.Buffer(cl_context,\
    \ mf.READ_ONLY | mf.HOST_PTR, hostbuf=matrix2)\nresult_in_gpu = cl.Buffer(cl_context,\
    \ mf.WRITE_ONLY, matrix1.nbytes)\ncl_program = cl.Program(cl_context, \"\"\"\n\
    __kernel void product(int size, __global const float *matrix1, __global const\
    \ float *matrix2, __global float *result)\n{\n    int i = get_global_id(0);\n\
    \    int j = get_global_id(1); \n    result[i + size * j] = 0;\n    for (int k\
    \ = 0; k < size; k++)\n    {\n        result[i + size * j] += matrix1[k + size\
    \ * i] * matrix2[j + size * k];\n    }\n}\n\"\"\").build()\n\nt0 = time.time()\n\
    cl_program.product(queue, matrix1.shape, None, np.int32(len(matrix1)), matrix1_in_gpu,\
    \ matrix2_in_gpu, result_in_gpu)\nt1 = time.time()\ngpu_time = t1 - t0\nprint\
    \ \"GPU Time\", gpu_time\n\nresult_in_numpy = np.empty_like(matrix1)\ncl.enqueue_copy(queue,\
    \ result_in_numpy, result_in_gpu)\nt0 = time.time()\ncpu_result = np.dot(matrix1,\
    \ matrix2.T)\nt1 = time.time()\ncpu_time = t1 - t0\nprint \"CPU Time\", cpu_time\n\
    print \"Norm of Difference\", np.linalg.norm(result_in_numpy)\n```\n\n\n\n## 总结\n\
    \n在本章中，我们向读者介绍了基于 GPU 的计算，这是深度学习的关键推动之一。\n\n一个需要注意的关键点是，在本章中，我们使用 OpenCL 介绍了 GPU\
    \ 计算的基础知识，它是厂商中立的。这些概念以微小的差异适用于其他特定厂商的库（如 CUDA）。建议读者在阅读 CUDA 文档的同时，尝试下一章节源代码列表中的示例。\n\
    \n"
