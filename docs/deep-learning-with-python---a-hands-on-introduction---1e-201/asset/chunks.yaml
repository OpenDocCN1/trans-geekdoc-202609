    我们现在对该任务有了精确的定义，即根据某些已见数据 `S` 生成 `f`，将数据分类为两个类别之一（`y = ±1`）。我们通过衡量在未见数据 `U` 上的误差
    `E (f, D, U)` 来评估性能（以及性能的提升）。已见数据的大小 `|S|` 在概念上等同于经验。在此背景下，我们希望开发出能够生成此类函数 `f`（通常称为模型）的算法。总来说，机器学习领域研究的是此类算法的发展，这些算法产生模型来对未见数据进行预测，以及其他正式任务（我们将在本章后面部分介绍多个此类任务）。注意，`x`
    通常称为输入/输入变量，`y` 称为输出/输出变量。


    现在，让我们将这个抽象但精确的定义与现实问题联系起来，以便我们的抽象有根可循。假设一个电子商务网站想要为注册用户定制着陆页，向他们展示用户可能感兴趣购买的产品。该网站拥有用户的历史数据，并希望将其实现为一项功能以增加销售。现在让我们来看看这个现实问题如何映射到我们之前描述的二分类抽象问题上。


    人们可能会注意到的第一点是，给定特定的用户和特定的产品，想要预测用户是否会购买该产品。由于这是要预测的值，它映射到 `y = ±1`，其中我们将 `y =
    +1` 的值表示预测用户将购买该产品，并将 `y = -1` 表示为用户不购买该产品的预测。注意，选择这些值并没有特殊理由；我们可以调换它们（让 `y =
    +1`表示不购买的情况，让 `y = -1`表示购买的情况），这没有区别。我们只是使用 `y = ±1` 来表示分类数据的两个感兴趣类别。接下来，假设我们可以以某种方式将产品的属性以及用户的购买和浏览历史表示为
    `x ∈ R`。这一步在机器学习中被称为特征工程，我们将在本章稍后部分介绍。目前，只需说明我们能够生成这样的映射即可。因此，我们有了用户浏览和购买过的历史数据、产品属性以及用户是否购买该产品的映射到
    `{(x[p] yj, (x[2],y[2]), ... (x[n],y[n])}`。现在，基于这些数据，我们希望生成一个函数或模型 `f:x→y`，可以用它来确定特定用户将购买哪些产品，并用此来填充用户的着陆页。我们可以通过为用户填充着陆页并观察他们是否购买产品来衡量模型在未见数据上的表现，并评估误差
    `E (f, D, U)`。


    ## 回归


    让我们引入另一个任务，即回归。在这里，我们拥有形式为 `D = {x[1], y[1]), (x[2],y[2])... (x[n],y[n])}` 的数据，其中
    `x ∈ R` 且 `y ∈ R`，我们的任务是生成实现函数 `f:x→y` 的计算过程。注意，预测不再像二分类那样的二进制标签 `y = ±1`，而是实值预测。我们通过未见数据上的均方根误差
    (`RMSE`) 来衡量此任务的性能：


    ```

    E (f, D, U) = sqrt(1/n * Σ (y - f(x)))

    ```

    注意，`RMSE` 仅仅是取预测值与实际值之间的差，平方以处理正负差，对所有未见数据取平均值，最后开平方以抵消平方操作。一个对应回归抽象任务的现实问题是根据财务历史预测信用分，这可以被信用卡公司使用。


    ## 泛化


    现在让我们涵盖机器学习中最重要的单一直觉，即我们希望开发出在未见数据上具有良好的模型。为了实现这一点，我们首先为回归任务引入一个玩具数据集。我们通过生成 -1
    到 1 之间的 100 个值作为输入变量 (`x`) 来生成玩具数据集。根据 `y = 2 + x² + e` 生成输出变量 (`y`)，其中 `e ~ N(0,0.1)`
    是均值为 0、标准差为 0.1 的正态分布噪声。此代码见列表 2-1，数据见图 2-1。


    ### 泛化 vs. 过拟合


    ```python

    import pylab

    import numpy


    x = numpy.linspace(-1,1,100)

    signal = 2 + x * x

    noise = numpy.random.normal(0, 0.1, 100)

    y = signal + noise

    pylab.plot(signal,''b'')

    pylab.plot(y,''g'')

    pylab.plot(noise, ''r'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    pylab.legend(["Without Noise", "With Noise", "Noise"], loc=2)


    x_train = x[0:80]

    y_train = y[0:80]


    # Model with degree 1

    pylab.figure()

    degree = 2

    X_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])

    model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),X_train.transpose()),y_train)

    pylab.plot(x,y,''g'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    predicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])

    pylab.plot(x, predicted,''r'')

    pylab.legend(["Actual", "Predicted"], loc=2)

    train_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train
    - predicted[0:80])))

    test_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:], y[80:] -predicted[80:]))

    print("Train RMSE (Degree = 1)", train_rmse1)

    print("Test RMSE (Degree = 1)", test_rmse1)


    # Model with degree 2

    pylab.figure()

    degree = 3

    X_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])

    model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),
    X_train.transpose()),y_train)

    pylab.plot(x,y,''g'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    predicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])

    pylab.plot(x, predicted,''r'')

    pylab.legend(["Actual", "Predicted"], loc=2)

    train_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train
    - predicted[0:80])))

    test_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:], y[80:] -predicted[80:]))

    print("Train RMSE (Degree = 2)", train_rmse1)

    print("Test RMSE (Degree = 2)", test_rmse1)


    # Model with degree 8

    pylab.figure()

    degree = 9

    X_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])

    model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),
    X_train.transpose()),y_train)

    pylab.plot(x,y,''g'')

    pylab.xlabel("x")

    pylab.ylabel("y")

    predicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])

    pylab.plot(x, predicted,''r'')

    pylab.legend(["Actual", "Predicted"], loc=3)

    train_rmse2 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train
    - predicted[0:80])))

    test_rmse2 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:], y[80:] -predicted[80:]))

    print("Train RMSE (Degree = 8)", train_rmse2)

    print("Test RMSE (Degree = 8)", test_rmse2)

    ```


