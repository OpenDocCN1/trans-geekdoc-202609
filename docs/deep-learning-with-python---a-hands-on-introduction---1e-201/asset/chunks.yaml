    ## Types of Units/Activation Functions/Layers


    We will now look at a number of Units/Activation Functions/Layers commonly used
    for Neural Networks. Let''s start by enumerating a few properties of interest
    for activation functions.


    *   1\.  In theory, when an activation function is non-linear, a two-layer Neural
    Network can approximate any function (given a sufficient number of units in the
    hidden layer). Thus, we do seek non-linear activation functions in general.


    *   2\.   A function that is continuously differentiable allows for gradients
    to be computed and gradient-based methods to be used for finding the parameters
    that minimize our loss function over the data. If a function is not continuously
    differentiable, gradient-based methods cannot make progress.


    *   3\.   A function whose range is finite (as against infinite) leads to a more
    stable performance w.r.t gradient-based methods.


    *   4\.  Smooth functions are preferred (empirical evidence) and Monolithic functions
    for a single layer lead to convex error surfaces (this is typically not a consideration
    w.r.t deep learning).


