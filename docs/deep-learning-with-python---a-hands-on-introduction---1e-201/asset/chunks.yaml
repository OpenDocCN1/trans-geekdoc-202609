    ## Neural Network Hands-on with AutoGrad


    We will now build a simple Neural Network from scratch (refer to Listing [3-1](#main-6.xhtml#bookmark16)).
    The only external library we will be using is Autograd. Autograd is an automatic
    differentiation library that will allow us to compute gradients for arbitrary
    functions written with Numpy.


    ■ Note autograd is covered in more detail in the chapter on automatic differentiation.


    ## Summary


    In this chapter we covered feed forward neural networks, which will serve as the
    conceptual foundation for the rest of the chapters. The key concepts we covered
    were the overall structure of the neural network, the input, hidden and output
    layers, cost functions, and their basis on the principle of Maximum Likelihood. We
    encourage the reader to try out the example in the source code listing; although
    it is a toy example, it will help reinforce the concepts. The next chapter will
    provide a hands-on introduction to the reader on Theano, which will enable the
    reader to implement full-fledged neural networks.


    CHAPTER 4


    Introduction to Theano


    ![](main-21.png)


    In this chapter we introduce the reader to Theano, which is a Python library for
    defining mathematical functions (operating over vectors and matrices), and computing
    the gradients of these functions. Theano is the foundational layer on which many
    deep learning packages like Keras are based.


    ## What is Theano


    As we have seen before, building deep learning models fundamentally involves optimizing
    loss functions using stochastic gradient descent (SGD), requiring the computation
    of the gradient of loss function. As loss functions in deep learning are complicated,
    it is not convenient to manually derive such gradients. This is where Theano comes
    in handy. Theano allows the user to define mathematical expressions that encode
    loss functions and, once these are defined, Theano allows the user to compute
    the gradients of these expressions.


    A typical workflow for using Theano is as follows:


    *   1\. Write symbolic expressions in Python that implement the loss function
    of the model to be built. This usually amounts to only a few lines of code because
    of the expressiveness of the Python language and a tight integration with Numpy that
    allows the user to quickly and elegantly define mathematical expressions involving
    vectors and matrices.


    *   2\. Use the symbolic/automatic differentiation capabilities in Theano to generate
    an expression that produces the gradient of the loss function.


    *   3\. Pass this gradient function as a parameter to a SGD optimization routine
    to optimize the loss function.


    Theano allows a user to focus on the model rather than on the mechanics of deriving
    the gradient. The specific capabilities of Theano that make it a great toolbox
    for building deep learning models are as follows:


    *   1\. a very seamless integration with Numpy that allows the user to use Numpy objects
    (vectors and matrices) in the definition of loss functions


    *   2\. Theano can generate optimized code for both CPU as well as GPU under the
    hood without the user having to rewrite the code, which defines the loss function.


    *   3\. optimized automatic/symbolic differentiation


    *   4\. numerical stability for the generated code via automatic/symbolic differentiation


