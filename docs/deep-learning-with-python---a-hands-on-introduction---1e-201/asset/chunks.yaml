    is whether the operators in question are those already implemented in established
    library/core language or if the automatic differentiation tool provides its own
    operators. autograd is an example an automatic differentiation tool that overloads
    the established numpy Library whereas theano provides its own operators for which
    corresponding differential operations are implemented.


