  trans: "\n\n在接下来的列表 4-10（以及图 4-10 中对应的计算图）中，我们将构建一个逻辑回归模型。读者应该注意以下几：\n\n* 1. 该示例生成了一些人工/玩具数据，拟合了一个逻辑回归模型，并计算训练前后的准确率。这是一个为了说明而设计的玩具数据集；由于数据是随机生成的，模型并没有进行泛化/学习。\n\
    * 2. 我们定义了一个函数来计算 L2 正则化，这在之前的列表 4-8 中介绍过。\n* 3. 我们生成了输入数据，由 1000 个维度为 100 的向量组成。基本上是\
    \ 1000 个具有 100 个特征的样本。\n* 4. 我们生成了随机的 0 和 1 目标/输出标签。\n* 5. 我们定义了涉及逻辑回归的表达式，涉及数据（表示为\
    \ `x`）、输出（表示为 `y`）、偏置项（表示为 `b`）和权重向量（表示为 `w`）。权重向量和偏置项是共享变量。\n* 6. 我们使用在列表 4-7\
    \ 中介绍的二分类交叉熵来计算预测、误差和损失。\n* 7. 定义这些表达式后，我们现在可以使用 Theano 中的 `grad` 结构（在列表 4-6 中引入）来计算梯度。\n\
    * 8. 我们根据梯度函数定义了一个 `train` 函数。`train` 函数定义了输入、输出以及内部状态（共享变量）如何更新。\n* 9. `train`\
    \ 函数被调用了 1000 步；在每一步中，都会在内部计算梯度并更新共享变量。\n* 10. 使用 `sklearn.metrics` 在训练步骤之前之后计算准确率。\n\
    \n### 列表 4-10. 逻辑回归\n\n```python\nimport numpy\nimport theano\nimport theano.tensor\
    \ as T\nimport sklearn.metrics\n\ndef l2(x):\n    return T.sum(x**2)\n\nexamples\
    \ = 1000\nfeatures = 100\nD = (numpy.random.randn(examples, features), numpy.random.randint(size=examples,\
    \ low=0, high=2))\ntraining_steps = 1000\n\nx = T.dmatrix(\"x\")\ny = T.dvector(\"\
    y\")\nw = theano.shared(numpy.random.randn(features), name=\"w\")\nb = theano.shared(0.,\
    \ name=\"b\")\np = 1 / (1 + T.exp(-T.dot(x, w) - b))\nerror = T.nnet.binary_crossentropy(p,y)\n\
    loss = error.mean() + 0.01 * l2(w)\nprediction = p > 0.5\ngw, gb = T.grad(loss,\
    \ [w, b])\n\ntrain = theano.function(inputs=[x,y],outputs=[p, error], updates=((w,\
    \ w - 0.1 * gw), (b, b - 0.1 * gb)))\npredict = theano.function(inputs=[x], outputs=prediction)\n\
    \nprint \"Accuracy before Training:\",sklearn.metrics.accuracy_score(D[1], predict(D[0]))\n\
    for i in range(training_steps):\n    prediction, error = train(D[0], D[1])\n \
    \   print \"Accuracy before Training:\",sklearn.metrics.accuracy_score(D[1], predict(D[0]))\n\
    \n# Accuracy before Training: 0.481\n# Accuracy before Training: 0.629\n```\n\n\
    ![](img/main-32.jpg)\n\n图 4-10. 逻辑回归\n\n| val=l .0 TensocType( float 64. scalar)\
    \ ||  || w ||  || va 1=0.0 TensorType(float64. scalar) ||  || b |\n| --- | ---\
    \ | --- | --- | --- | --- | --- | --- |\n\n在接下来的列表 4-11（以及图 4-11 中对应的计算图）中，我们将构建一个线性回归模型。读者应该注意以下几：\n\
    \n* 1. 该示例生成了一些人工/玩具数据，拟合了一个线性回归模型，并计算训练前后的准确率。这是一个为了说明而设计的玩具数据集，由于数据是随机生成的，模型并没有进行泛化/学习。\n\
    * 2. 我们定义了一个函数来计算 L2 正则化，这在之前的列表 4-8 中介绍过。\n* 3. 我们定义了一个平方误差的函数，这在列表 4-7 中介绍过。\n\
    * 4. 我们生成了输入数据，由 1000 个维度为 100 的向量组成。基本上是 1000 个具有 100 个特征的样本。\n* 5. 我们生成了 0 到\
    \ 1 之间的随机目标/输出标签。\n* 6. 我们定义了涉及线性回归的表达式，涉及数据（表示为 `x`）、输出（表示为 `y`）、偏置项（表示为 `b`）和权重向量（表示为\
    \ `w`）。权重向量和偏置项是共享变量。\n* 7. 我们使用介绍的平方误差来计算预测、误差和损失。\n* 8. 定义这些表达式后，我们现在可以使用 Theano\
    \ ( 4-6) 来计算梯度。\n* 9. 我们根据梯度函数定义了一个 `train` 函数。`train` 函数定义了输入、输出以及内部状态（共享变量）如何更新。\n\
    * 10. `train` 函数被调用了 1000 步；在每一步中，都会在内部计算梯度并更新共享变量。\n* 11. 使用 `sklearn.metrics`\
    \ 在训练步骤之前之后计算均方根误差 (RMSE)。\n\n### 列表 4-11. 线性回归\n\n```python\nimport numpy\nimport\
    \ theano\nimport theano.tensor as T\nimport sklearn.metrics\n\ndef l2(x):\n  \
    \  return T.sum(x**2)\n\ndef squared_error(x,y):\n    return (x - y)**2\n\nexamples\
    \ = 1000\nfeatures = 100\nD = (numpy.random.randn(examples, features), numpy.random.randint(size=examples))\n\
    training_steps = 1000\n\nx = T.dmatrix(\"x\")\ny = T.dvector(\"y\")\nw = theano.shared(numpy.random.randn(features),\
    \ name=\"w\")\nb = theano.shared(0., name=\"b\")\np = 1 / (1 + T.exp(-T.dot(x,\
    \ w) - b))\nerror = squared_error(p,y)\nloss = error.mean() + 0.01 * l2(w)\ngw,\
    \ gb = T.grad(loss, [w, b])\n\ntrain = theano.function(inputs=[x,y],outputs=[p,\
    \ error], updates=((w, w - 0.1 * gw), (b, b - 0.1 * gb)))\npredict = theano.function(inputs=[x],\
    \ outputs=p)\n\nprint \"RMSE before training:\",sklearn.metrics.mean_squared_error(D[1],\
    \ predict(D[0]))\nfor i in range(training_steps):\n    prediction, error = train(D[0],\
    \ D[1])\n    print \"RMSE after training:\",sklearn.metrics.mean_squared_error(D[1],\
    \ predict(D[0]))\n\n# RMSE before training: 0.4707491496\n# RMSE after training:\
    \ 0.915701676631\n```\n\n![](img/main-33.jpg)\n\n图 4-11. 逻辑回归\n\n"
