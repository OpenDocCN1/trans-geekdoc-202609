    ## Feed Forward Neural Networks


    ![](main-11.png)


    In this chapter we will cover some key concepts around feedforward neural networks.
    These concepts will serve as a foundation as we cover more technical topics in
    depth.


    At an abstract level, a Neural Network can be thought of as a function


    `f[q]: x -> y`, which takes an input `x e R^` and produces an output `y e R^`,
    and whose behavior is parameterized by `q e R^p`. So for instance, `f[q]` could
    be simply `y = f[q](x)=0-x`.


    We will start by looking at the structure of a neural network, followed by how
    they are trained and used for making predictions.


    ## Unit


    A unit is the basic building of a neural network; refer to Figure [3-1](#main-5.xhtml#bookmark9).
    The following points should be noted:


    1. A unit is a function that takes as input a vector `x e R^` and produces a scalar.

    2. A unit is parameterized by a weight vector `w e R^` and a bias term denoted
    by `b`.

    3. The output of the unit can be described as:

    `^f [E^xi '' ^w^+ ^b)`

    where `f :R->R` is referred to as an activation function.

    4. A variety of activation functions may be used, as we shall see later in the
    chapter; generally, it''s a non-linear function.


