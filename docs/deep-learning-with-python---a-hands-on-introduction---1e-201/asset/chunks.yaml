    # 第一章

    ## 深度学习简介


    ![](img/main-4.jpg)


    本章对深度学习主题进行了广泛概述和历史背景介绍。它还为读者提供了阅读本书的路线图、先备知识以及深入研究该主题的延伸阅读。


    ### 历史背景


    人工智能（AI）领域可以被认为是深度学习的父级领域，其丰富的历史可以追溯到 1950 年。虽然我们不会详细介绍这段历史，但我们将介绍该领域的一些关键转折点，这些转折点将引导我们走向深度学习。


    人工智能在早期关注的任务是那些可以容易形式化描述的任务，例如国际象棋或跳棋游戏。这种能够容易形式化描述任务的概念，是计算机程序能够或不能轻松完成任务的核心。例如，考虑国际象棋游戏。国际象棋游戏的形式化描述将是棋盘的表示、每个棋子的移动方式描述、起始配置以及游戏结束时的配置描述。


    在有了这些形式化概念后，将一个玩国际象棋的 AI 程序建模为搜索是相对容易的，在足够的计算资源的情况下，可以产生相当出色的国际象棋 AI。


    '
- fmt: '

    It must be noted that the formal definitions of such rules were done manually.
    However, such early AI systems were fairly general purpose task/problem solvers
    in the sense that any problem that could be described formally could be solved
    with the generic approach.


    The key limitation about such systems is that the game of chess is a relatively
    easy problem for AI simply because the problem setting is relatively simple and
    can be easily formalized. This is not the case with many of the problems human
    beings solve on a day-to-day basis (natural intelligence). For instance, consider
    diagnosing a disease (as a physician does) or transcribing human speech to text.
    These tasks, like most other tasks human beings master easily, are hard to describe
    formally and presented a challenge in the early days of AI.


    Human beings address such tasks by leveraging a large amount of knowledge about
    the task/problem domain. Given this observation, subsequent AI systems relied
    on a large knowledge base which captured the knowledge about the problem/task
    domain. One point to be noted is the term used here is knowledge, not information
    or data. By knowledge we simply mean data/information that a program/algorithm
    can reason about. An example of this could be a graph representation of a map
    with edges labeled with distances and about traffic (which is being constantly
    updated), which allows a program to reason about the shortest path between points.


    © Nikhil Ketkar 2017


    N. Ketkar, Deep Learning with Python, DOI 10.1007/978-1-4842-2766-2_1


    Chapter 1 ■ Introduction to Deep Learning


    Such knowledge-based systems wherein the knowledge was compiled by experts and
    represented in a way which allowed algorithms/programs to reason about it represent
    the second generation of AI. At the heart of such approaches were increasingly
    sophisticated approaches for representing and reasoning about knowledge to solve
    tasks/problems which required such knowledge. Examples of such sophistication
    include the use of first order logic to encode knowledge and probabilistic representations
    to capture and reason where uncertainty is inherent to the domain.


    One of the key challenges that such systems faced and addressed to some extent
    was the uncertainty inherent in many domains. Human beings are relatively good
    at reasoning in environments with unknowns and uncertainty. One key observation
    here is that even the knowledge we hold about a domain is not black or white but
    gray. A lot of progress was made in this era on representing and reasoning about
    unknowns and uncertainty. There were some limited successes in tasks like diagnosing
    a disease, which relied on leveraging and reasoning using a knowledge base in
    the presence of unknowns and uncertainty.


    The key limitation of such systems was the need to hand compile the knowledge
    about the domain from experts. Collecting, compiling, and maintaining such knowledge
    bases rendered such systems unpractical. In certain domains, it was extremely
    hard to even collect and compile such knowledge (for instance, transcribing speech
    to text or translating documents from one language to another). While human beings
    can easily learn to do such tasks, it''s extremely challenging to hand compile
    and encode the knowledge related to the tasks (for instance, the knowledge of
    the English language and grammar, accents, and subject matter).


    Human beings address such tasks by acquiring knowledge about a task/problem domain,
    a process which is referred to as learning. Given this observation, the focus
    of subsequent work in AI shifted over a decade or two to algorithms that improved
    their performance based on data provided to them. The focus of this subfield was
    to develop algorithms that acquired relevant knowledge for a task/problem domain
    given data. It is important to note that this knowledge acquisition relied on
    labeled data and a suitable representation of labeled data as defined by a human
    being.


    For instance, consider the problem of diagnosing a disease. For such a task, a
    human expert would collect a lot of cases where a patient had and did not have
    the disease in question. Then, the human expert would identify a number of features
    that would aid making the prediction like, say, the age of the patient, the gender,
    and results from a number of diagnostic tests like blood pressure, blood sugar,
    etc. The human expert would compile all this data and represent it in a suitable
    way like scaling/normalizing the data, etc. Once this data was prepared, a machine
    learning algorithm can learn how to infer whether the patient has the disease
    or not by generalizing from the labeled data. Note that the labeled data consisted
    of patients that both have and do not have the disease. So, in essence, the underlying
    ML algorithm is essentially doing the job of finding a mathematical function that
    can produce the right outcome (disease or no disease) given the inputs (features
    like age, gender, data from diagnostic tests, etc.). Finding the simplest mathematical
    function that predicts the outputs with required level of accuracy is at the heart
    of the field of ML. Specific questions like how many examples are required to
    learn a task or the time complexity of the algorithm, etc., are specific questions
    on which the field of ML has provided answers with theoretical justification.
    The field has matured to a point where, given enough data, computer resources,
    and human resources to engineer features, a large class of problems are solvable.


    The key limitation of mainstream ML algorithms is that applying them to a new
    problem domain requires a massive amount of feature engineering. For instance,
    consider the problem of recognizing objects in images. Using traditional ML techniques,
    such a problem will require a massive feature engineering effort wherein experts
    would identify and generate features which would be used by the ML algorithm.
    In a sense, the true intelligence is in the identification of features and what
    the ML algorithm is doing is simply learning how to combine these features to
    arrive at the correct answer. This identification of features or the representation
    of data which domain experts do before ML algorithms are applied is both a conceptual
    and practical bottleneck in AI.


    It''s a conceptual bottleneck because if features are being identified by domain
    experts, and the ML algorithm is simply learning to combine and draw conclusions
    from this, is this really AI? It''s a practical bottleneck because the process
    of building models via traditional ML is bottlenecked by the amount of feature
    engineering required; there are limits to how much human effort can be thrown
    at the problem.


    Human beings learn concepts starting from raw data. For instance, a child shown
    a few examples/ instances of a particular animal (like, say, cats) will soon learn
    to identify cats. The learning process does not involve a parent identifying features
    like does it have whiskers or does it have fur or does it have a tail. Human learning
    goes from raw data to a conclusion without the explicit step where features are
    identified and provided to the learner. In a sense, human beings learn the appropriate
    representation of data from the data itself. Furthermore, they organize concepts
    as a hierarchy where complicated concepts are expressed using primitive concepts.


    The field of deep learning has its primary focus on learning appropriate representations
    of data such that these could be used to draw conclusions. The word deep in deep
    learning refers to the idea of learning the hierarchy of concepts directly from
    raw data. A more technically appropriate term for deep learning would be representation
    learning, and a more practical term for the same would be automated feature engineering.


    ## Advances in Related Fields


    It is important to make a note of advances in other fields that have played a
    key role in the recent interest and success of deep learning. The following points
    are to be noted.

    '
  raw: 'It must be noted that the formal definitions of such rules were done manually.
    However, such early AI systems were fairly general purpose task/problem solvers
    in the sense that any problem that could be described formally could be solved
    with the generic approach.


    The key limitation about such systems is that the game of chess is a relatively
    easy problem for AI simply because the problem setting is relatively simple and
    can be easily formalized. This is not the case with many of the problems human
    beings solve on a day-to-day basis (natural intelligence). For instance, consider
    diagnosing a disease (as a physician does) or transcribing human speech to text.
    These tasks, like most other tasks human beings master easily, are hard to describe
    formally and presented a challenge in the early days of AI.


    Human beings address such tasks by leveraging a large amount of knowledge about
    the task/problem domain. Given this observation, subsequent AI systems relied
    on a large knowledge base which captured the knowledge about the problem/task
    domain. One point to be noted is the term used here is knowledge, not information
    or data. By knowledge we simply mean data/information that a program/algorithm
    can reason about. An example of this could be a graph representation of a map
    with edges labeled with distances and about traffic (which is being constantly
    updated), which allows a program to reason about the shortest path between points.


    © Nikhil Ketkar 2017


    N. Ketkar, Deep Learning with Python, DOI 10.1007/978-1-4842-2766-4\_1


    Chapter 1 ■ IntroduCtIon to deep LearnIng


    Such knowledge-based systems wherein the knowledge was compiled by experts and
    represented in a way which allowed algorithms/programs to reason about it represent
    the second generation of AI. At the heart of such approaches were increasingly
    sophisticated approaches for representing and reasoning about knowledge to solve
    tasks/problems which required such knowledge. Examples of such sophistication include
    the use of first order logic to encode knowledge and probabilistic representations
    to capture and reason where uncertainty is inherent to the domain.


    One of the key challenges that such systems faced and addressed to some extent
    was the uncertainty inherent in many domains. Human beings are relatively good
    at reasoning in environments with unknowns and uncertainty. One key observation
    here is that even the knowledge we hold about a domain is not black or white but
    gray. A lot of progress was made in this era on representing and reasoning about
    unknowns and uncertainty. There were some limited successes in tasks like diagnosing
    a disease, which relied on leveraging and reasoning using a knowledge base in
    the presence of unknowns and uncertainty.


    The key limitation of such systems was the need to hand compile the knowledge
    about the domain from experts. Collecting, compiling, and maintaining such knowledge
    bases rendered such systems unpractical. In certain domains, it was extremely
    hard to even collect and compile such knowledge (for instance, transcribing speech
    to text or translating documents from one language to another). While human beings can
    easily learn to do such tasks, it''s extremely challenging to hand compile and
    encode the knowledge related to the tasks (for instance, the knowledge of the
    English language and grammar, accents, and subject matter).


    Human beings address such tasks by acquiring knowledge about a task/problem domain,
    a process which is referred to as learning. Given this observation, the focus
    of subsequent work in AI shifted over a decade or two to algorithms that improved
    their performance based on data provided to them. The focus of this subfield was
    to develop algorithms that acquired relevant knowledge for a task/problem domain given
    data. It is important to note that this knowledge acquisition relied on labeled
    data and a suitable representation of labeled data as defined by a human being.


    For instance, consider the problem of diagnosing a disease. For such a task, a
    human expert would collect a lot of cases where a patient had and did not have
    the disease in question. Then, the human expert would identify a number of features
    that would aid making the prediction like, say, the age of the patient, the gender,
    and results from a number of diagnostic tests like blood pressure, blood sugar,
    etc. The human expert would compile all this data and represent it in a suitable
    way like scaling/normalizing the data, etc. Once this data was prepared, a machine
    learning algorithm can learn how to infer whether the patient has the disease
    or not by generalizing from the labeled data. Note that the labeled data consisted
    of patients that both have and do not have the disease. So, in essence, the underlying
    ML algorithm is essentially doing the job of finding a mathematical function that
    can produce the right outcome (disease or no disease) given the inputs (features
    like age, gender, data from diagnostic tests, etc.). Finding the simplest mathematical function
    that predicts the outputs with required level of accuracy is at the heart of the
    field of ML. Specific questions like how many examples are required to learn a
    task or the time complexity of the algorithm, etc., are specific questions on
    which the field of ML has provided answers with theoretical justification. The
    field has matured to a point where, given enough data, computer resources, and
    human resources to engineer features, a large class of problems are solvable.


    The key limitation of mainstream ML algorithms is that applying them to a new
    problem domain requires a massive amount of feature engineering. For instance,
    consider the problem of recognizing objects in images. Using traditional ML techniques,
    such a problem will require a massive feature engineering effort wherein experts
    would identify and generate features which would be used by the ML algorithm.
    In a sense, the true intelligence is in the identification of features and what
    the ML algorithm is doing is simply learning how to combine these features to
    arrive at the correct answer. This identification of features or the representation
    of data which domain experts do before ML algorithms are applied is both a conceptual
    and practical bottleneck in AI.


    It''s a conceptual bottleneck because if features are being identified by domain
    experts, and the ML algorithm is simply learning to combine and draw conclusions
    from this, is this really AI? It''s a practical bottleneck because the process
    of building models via traditional ML is bottlenecked by the amount of feature
    engineering required; there are limits to how much human effort can be thrown
    at the problem.


    Human beings learn concepts starting from raw data. For instance, a child shown
    a few examples/ instances of a particular animal (like, say, cats) will soon learn
    to identify cats. The learning process does not involve a parent identifying features
    like does it have whiskers or does it have fur or does it have a tail. Human learning
    goes from raw data to a conclusion without the explicit step where features are
    identified and provided to the learner. In a sense, human beings learn the appropriate
    representation of data from the data itself. Furthermore, they organize concepts
    as a hierarchy where complicated concepts are expressed using primitive concepts.


    The field of deep learning has its primary focus on learning appropriate representations
    of data such that these could be used to draw conclusions. The word deep in deep
    learning refers to the idea of learning the hierarchy of concepts directly from
    raw data. A more technically appropriate term for deep learning would be representation
    learning, and a more practical term for the same would be automated feature engineering.


    ## Advances in Related Fields


    It is important to make a note of advances in other fields that have played a
    key role in the recent interest and success of deep learning. The following points
    are to be noted.'
