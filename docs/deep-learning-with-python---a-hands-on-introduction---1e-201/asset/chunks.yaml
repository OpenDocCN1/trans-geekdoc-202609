- fmt: "\n## 4. A work item identifier can be 1-, 2-, or 3- dimensional (`NDRange`).\
    \ This basically makes it easy to write kernels for 1-D (time series), 2-D (images),\
    \ and 3-D (volumes) data sets.\n\nLet us now introduce some notation that will\
    \ allow us to describe the indexing. We will assume the indexing is 2-D, but the\
    \ same reasoning applies to 1-D or 3-D data. We denote by `(G[x], G[y])` the global\
    \ indexing space. Let us now look at how this global indexing space gets broken\
    \ into work groups and work items. For convenience, we define offsets `(F[x],\
    \ F[y])` which define the portion of the indexing that is not broken into work\
    \ items and work groups. Let `(S[x], S[y])` define the size of the work group\
    \ and `(W[x], W[y])` define the number of work groups. Along similar lines, let\
    \ `(g[x], g[y])` denote the global identifiers, `(s[x], s[y])` denote the local\
    \ identifiers, and let `(w[x], w[y])` denote the work group identifiers. Then,\
    \ the relationship between local and global identifiers is described as `(g, g)\
    \ = (w * S + s + F, w * S + s + F)`.\n\nWriting a kernel for a given computation\
    \ basically involves leveraging this identifier mechanism and the parallel invocations\
    \ of the kernels over work items and work groups to perform the task at hand.\
    \ Listings 10-2 and 10-3 illustrate this for vector addition and matrix multiplication,\
    \ respectively. Listing [10-1](#main-11.xhtml#bookmark15) simply prints out the\
    \ details of the OpenCL system that the reader can use to determine the details\
    \ of their system.\n\n### Listing 10-1. Getting Information on GPUs\n\n```python\n\
    import pyopencl as cl\n\nprint \"OpenCL Platforms and Devices\" for platform in\
    \ cl.get_platforms():\n    print \"Platform: \", platform.name, \" Vendor: \"\
    , platform.vendor, \" Version: \", platform.version, \" Profile: \", platform.profile\n\
    \    for device in platform.get_devices():\n        print(\"\\tDevice Name: \"\
    , device.name, \"\\tDevice Type: \", cl.device_type.to_string(device.type), \"\
    \\tMax Clock Speed: \", \"{0} Mhz\".format(device.max_clock_frequency), \"\\tCompute\
    \ Units: \", \"{0}\".format(device.max_compute_units), \"\\tLocal Memory: \",\
    \ \"{0:.0f} KB\".format(device.local_mem_size/1024.0), \"\\tConstant Memory: \"\
    , \"{0:.0f} KB\".format(device.max_constant_buffer), \"\\tGlobal Memory: \", \"\
    {0:.0f} GB\".format(device.global_mem_size/(1024*1024*1024.0))\n\n# OpenCL Platforms\
    \ and Devices\n# Platform Name: Apple, Vendor: Apple, Version: OpenCL 1.2 (Nov\
    \ 18 2015 20:45:47), Profile: FULL\n# Device Name: Intel(R) Core(TM) i7-7700HQ\
    \ @ 2.20GHz, Type: CPU, Max Clock Speed: 2200 Mhz, Compute Units: 8, Local Memory:\
    \ 32 KB, Constant Memory: 64 KB, Global Memory: 16 GB\n# Device Name: Iris Pro,\
    \ Type: GPU, Max Clock Speed: 1200 Mhz, Compute Units: 40, Local Memory: 64 KB,\
    \ Constant Memory: 64 KB, Global Memory: 2 GB\n```\n\n### Listing 10-2. Vector\
    \ Addition\n\n```python\nimport numpy as np\nimport pyopencl as cl\nimport time\n\
    \nvector1 = np.random.random(5000000).astype(np.float32)\nvector2 = np.random.random(5000000).astype(np.float32)\n\
    cl_context = cl.create_some_context()\nqueue = cl.CommandQueue(cl_context)\nmf\
    \ = cl.mem_flags\nvector1_in_gpu = cl.Buffer(cl_context, mf.READ_ONLY | mf.COPY_HOST_PTR,\
    \ hostbuf=vector1)\nvector2_in_gpu = cl.Buffer(cl_context, mf.READ_ONLY | mf.COPY_HOST_PTR,\
    \ hostbuf=vector2)\nresult_in_gpu = cl.Buffer(cl_context, mf.WRITE_ONLY, vector1.nbytes)\n\
    cl_program = cl.Program(cl_context, \"\"\"\n__kernel void sum(__global const float\
    \ *vector1, __global const float *vector2, __global float *result) {\n    int\
    \ i = get_global_id(0);\n    result[i] = vector1[i] + vector2[i];\n}\n\"\"\").build()\n\
    \nt0 = time.time()\ncl_program.sum(queue, vector1.shape, None, vector1_in_gpu,\
    \ vector2_in_gpu, result_in_gpu)\nt1 = time.time()\ngpu_time = t1 - t0\nprint\
    \ \"GPU Time\", gpu_time\n\nresult_in_numpy = np.empty_like(vector1)\ncl.enqueue_copy(queue,\
    \ result_in_numpy, result_in_gpu)\nt0 = time.time()\ncpu_result = vector1 + vector2\n\
    t1 = time.time()\ncpu_time = t1 - t0\nprint \"CPU Time\", cpu_time\nprint \"Norm\
    \ of Difference\", np.linalg.norm(result_in_numpy - cpu_result)\n\n# GPU Time\
    \ 0.00202608108521\n# CPU Time 0.00995397567749\n# Norm of Difference 0.0\n```\n\
    \n### Listing 10-3. Matrix Multiplication\n\n```python\nimport numpy as np\nimport\
    \ pyopencl as cl\nimport time\n\nmatrix1 = np.random.random((500,500)).astype(np.float32)\n\
    matrix2 = np.random.random((500,500)).astype(np.float32)\ncl_context = cl.create_some_context()\n\
    queue = cl.CommandQueue(cl_context)\nmf = cl.mem_flags\nmatrix1_in_gpu = cl.Buffer(cl_context,\
    \ mf.READ_ONLY | mf.COPY_HOST_PTR, hostbuf=matrix1)\nmatrix2_in_gpu = cl.Buffer(cl_context,\
    \ mf.READ_ONLY | mf.COPY_HOST_PTR, hostbuf=matrix2)\nresult_in_gpu = cl.Buffer(cl_context,\
    \ mf.WRITE_ONLY, matrix1.nbytes)\ncl_program = cl.Program(cl_context, \"\"\"\n\
    __kernel void product(int size, __global const float *matrix1, __global const\
    \ float *matrix2, __global float *result)\n{\n    int i = get_global_id(0);\n\
    \    int j = get_global_id(1); \n    result[i + size * j] = 0;\n    for (int k\
    \ = 0; k < size; k++)\n    {\n        result[i + size * j] += matrix1[k + size\
    \ * i] * matrix2[j + size * k];\n    }\n}\n\"\"\").build()\n\nt0 = time.time()\n\
    cl_program.product(queue, matrix1.shape, None, np.int32(len(matrix1)), matrix1_in_gpu,\
    \ matrix2_in_gpu, result_in_gpu)\nt1 = time.time()\ngpu_time = t1 - t0\n# (Remaining\
    \ logic follows similar pattern)\n```\n\n## Summary\n\nIn this chapter, we have\
    \ introduced the reader to GPU-based computation, which is one of the key enabling\
    \ for Deep Learning.\n\nOne key point to note is that, in this chapter, we have\
    \ covered the basics of GPU computation using OpenCL, which is vendor-neutral.\
    \ The concepts apply with minor variation to other vendor-specific libraries like\
    \ CUDA. The reader is advised to try out the examples in the source code listings\
    \ in the chapter following, while reading up on the documentation of CUDA.\n"
