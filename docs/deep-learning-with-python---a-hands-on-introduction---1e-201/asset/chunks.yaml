    ![](img/main-6.jpg)


    为了模拟已见过和未见过的数据，我们使用前 80 个数据点作为见过的数据，其余部分被视为未见过的数据。也就是说，我们仅使用前 80 个数据点构建模型，并使用剩余数据来评估模型。


    接下来，我们使用一种非常简单的算法来生成模型，通常称为最小二乘法（Least Squares）。给定形式为 `D = {{,{[1] ),(x[2],y[2])...(x[n],y[n]))`
    的数据集，其中 `x \in \mathbb{R}^` 且 `y \in \mathbb{R}`，最小二乘模型的形式为 `y = bx`，其中 `b` 是一个使得
    `||Xb -y||²` 最小的向量。这里 `X` 是一个矩阵，每一行都是一个 `x`，因此 `X \in \mathbb{R}^{m \times n}`，其中
    `m` 是示例的数量（在案例中为 80）。`b` 的值可以使用闭式解 `b=(X^TX)^{-1}X^Ty` 推导出。我们略过了最小二乘法的许多重要细节，但这些细节对于当前的讨论是次要的。更相关的细节是我们如何将输入变量转换为适当的形式。在第一个模型中，我们将
    `x` 转换为一个值向量 `[x⁰, x¹, x²]`。也就是说，如果 `x = 2`，它将被转换为 `[1, 2, 4]`。经过此转换后，我们可以使用上述公式生成最小二乘模型
    `b`。底层发生的情况是我们正在使用二阶多项式（`degree = 2`）方程来近似给定数据，而最小二乘算法仅仅是曲线拟合或为每个 `[x⁰, x¹, x²
    \]` 生成系数。


    我们可以使用 `RMSE` 指标在未见过的数据上对模型进行评估。我们在训练数据上计算 `RMSE` 指标。实际值和预测值绘制在图 2-2 中，列表 2-1
    显示生成模型的源代码。


    ![](img/main-7.jpg)


    接下来，我们使用最小二乘算法生成另一个模型，但我们将 `a` 转换为 `[a⁰, a¹, a² , a³, a⁴, a⁵, a⁶, a⁷, a⁸]`。也就是说，我们正在使用
    `degree = 8` 的多项式来近似给定数据。实际值和预测值绘制在图 2-3 中，列表 2-1 显示生成模型的源代码。最后一步，我们生成一个 `degree
