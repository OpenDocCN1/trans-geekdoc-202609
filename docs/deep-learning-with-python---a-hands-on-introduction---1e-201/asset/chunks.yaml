    \ \\[0.5,0.5,0.5\\], then aQb = \\[0.5,0.5,1\\], the functions c, g and h are\
    \ non-linear activation functions, all W and R are weight matrices, and all the\
    \ b terms are bias terms).\n\n^Z^)\\= g((^()+) ^Rz ^y' ^bz )\n\ni^w^) \\=s(w[t]x^)\
    \ + R[t] y^((t-1>) + p[t] Q c^(^t^(\\-1)) + b[t])\n\nf^w^) = s(w[f]x‘ + R[f] w[(]^(\\\
    -1)) + p[f] © c^(^t^(\\-1)) + b[f] )\n\nc^()= i^(^) © z^(^) + f ^(^) © c^((-1))\n\
    \n^) = s (x^(^t^) + R[o] y^(^t^(\\-1)) + p[o] © c^) + b[o])\n\ny^(^)\\= o^(^)\
    \ © h((^))\n\nThe following points are to be noted:\n\n*   1\\.  The most important\
    \ element of the LSTM is the cell state denoted by\n\nc^(^) = i^(^) ©z^(^t\\*+f^(^)\
    \ ©c^(^(\\-1)). The cell state is updated based on the block input z® and the\
    \ previous cell state c^(^t^(\\-1)). The input gate i^(^t^) determines what fraction\
    \ of the block input makes it into the cell state (hence called a gate). The forget\
    \ gate f ^(^t^() )determines how much of the previous cell state to retain.\n\n\
    *   2\\.   The output y^((t)^) is determined based on the cell state c^(^t^) and\
    \ the output gate o^(^t^), which determines how much the cell state affects the\
    \ output.\n\n*   3\\.   The z^(^t^) term is referred to as the block input and\
    \ it produces a value based on the current input and the previous output.\n\n\
    *   4\\.   The i^(^t^) term is referred to as the input gate. It determines how\
    \ much of the input to retain in the cell state c^(^t^).\n\n*   5\\.  All the\
    \ p terms are peephole connections, which allow for a faction of the cell state\
    \ to factor into the computation of the term in question.\n\n*   6\\.   The computation\
    \ of the cell state c^(^i^) does not encounter the issue of the vanishing gradient\
    \ (this is referred to as the constant error carousal). However, LSTMs are affected\
    \ by exploding gradients and gradient clipping is used while training.\n\n   \
    \ ![](main-76.jpg)\n\n    Figure 6-11. Long Short Term Memory\n\n## Summary\n\n\
    In this chapter we covered the basics of Recurrent Neural Networks (RNN). The\
    \ key take-home points from this chapter are the notion of the hidden state, training\
    \ RNNs via unrolling (backpropagation through time), the problem of vanishing\
    \ and exploding gradients, and long short term memory networks. It is important\
    \ to internalize how RNNs contain internal/hidden states that allow them to make\
    \ predictions on a sequence of inputs, an ability that goes beyond conventional\
    \ neural networks.\n\nCHAPTER 7\n\nIntroduction to Keras\n\n![](main-77.png)\n\
    \nThis chapter introduces the reader to Keras, which is a library that provides\
    \ highly powerful and abstract building blocks to build deep learning networks.\
    \ The building blocks Keras provides are built using Theano (covered earlier)\
    \ as well as TensorFlow (which is an alternative to Theano for building computational graphs,\
    \ automatically deriving gradients, etc.). Keras supports both CPU and GPU computation\
    \ and is a great tool for quickly prototyping ideas.\n\nWe will introduce a number\
    \ of key building blocks Keras provides, and then build a CNN and LSTM using Keras.\n\
    \nLet us start with a simple, single layer neural network. Listing [7-1](#main-8.xhtml#bookmark12)\
    \ provides the code and Figure [7-1](#main-8.xhtml#bookmark13) gives the computational\
    \ graph. The following points are to be noted:\n\n*   1\\. A model is defined\
    \ using the Sequential construct, which allows the user to add/configure layers.\n\
    \n*   2\\. Using this functionality, a user can add one or more layers and build\
    \ the network. The Dense layer is basically a fully connected layer (leading to\
    \ a vector-matrix or vector-vector product), which we have seen earlier.\n\n*\
    \   3\\. The input and output dimensionality needs to be specified when the first\
    \ layer is defined. In this case the model will take an input of dimensionality\
    \ 500 and produce an output of dimensionality 1.\n\n*   4\\. After this layer\
    \ we add an activation function, in this case a sigmoid.\n\n*   5\\. The model\
    \ once defined needs to be explicitly compiled and, at this time, we provide the\
    \ loss function, the optimization algorithm, and other metrics we want to calculate.\n\
    \n*   6\\. An appropriate loss function needs to be picked given the task at hand;\
    \ in this case, given that we have a binary classification problem, we select\
    \ binary cross-entropy.\n\n*   7\\. An appropriate optimization algorithm needs\
    \ to be picked, which typically is a variant of Stochastic Gradient Descent (coved\
    \ in later chapters).\n\n*   8\\. Once compiled we can fit the model by providing\
    \ the data and evaluate the model.\n\n© Nikhil Ketkar 2017"
