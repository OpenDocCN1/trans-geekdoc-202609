    import numpy as np


    import pyopencl as cl


    import time


    vector1 = np.random.random(5000000).astype(np.float32)


    vector2 = np.random.random(5000000).astype(np.float32)


    cl\_context = cl.create\_some\_context()


    queue = cl.CommandQueue(cl\_context)


    mf = cl.mem\_flags


    vector1\_in\_gpu = cl.Buffer(cl\_context, mf.READ\_ONLY | mf.COPY\_HOST\_PTR,
    hostbuf=vector1) vector2\_in\_gpu = cl.Buffer(cl\_context, mf.READ\_ONLY | mf.COPY\_HOST\_PTR,
    hostbuf=vector2) result\_in\_gpu = cl.Buffer(cl\_context, mf.WRITE\_ONLY, vector1.nbytes)


    cl\_program = cl.Program(cl\_context, """


    \_\_kernel void sum(


    \_\_global const float \*vector1, \_\_global const float \*vector2, \_\_global
    float \*result) {


    int i = get\_global\_id(0);


    result\[i\] = vector1\[i\] + vector2\[i\];


    }


    """).build()


    t0 = time.time()


    cl\_program.sum(queue, vector1.shape, None, vector1\_in\_gpu, vector2\_in\_gpu,
    result\_in\_gpu) t1 = time.time()


    gpu\_time = t1 - t0


    print "GPU Time", gpu\_time


    result\_in\_numpy = np.empty\_like(vector1)


    cl.enqueue\_copy(queue, result\_in\_numpy, result\_in\_gpu)


    t0 = time.time() cpu\_result = vector1 + vector2


    t1 = time.time()


    cpu\_time = t1 - t0 print "CPU Time", cpu\_time


    print "Norm of Difference", np.linalg.norm(result\_in\_numpy - cpu\_result)


