    \ labels between 0 and 1.\n* 6. We define the expressions for linear regression\
    \ involving the data (denoted by `x`), the outputs (denoted by `y`), the bias\
    \ term (denoted by `b`) and the weight vector (denoted by `w`). The weight vector\
    \ and the bias term are shared variables.\n* 7. We compute the prediction, the\
    \ error and the loss using squared error as introduced in.\n* 8. Having defined\
    \ these expressions, we can now use the `grad` construct in Theano ([4-6](#main-6.xhtml#bookmark36))\
    \ to compute the gradient.\n* 9. We define a `train` function based on the gradient\
    \ function. The `train` function defines the inputs, outputs and how the internal\
    \ state (shared variables) are to be updated.\n* 10. The `train` function is invoked\
    \ for 1000 steps; in each step the gradient is computed internally and the shared\
    \ variables are updated.\n* 11. Root mean squared error (RMSE) is computed before\
    \ and after the training steps using `sklearn.metrics`.\n\n### Listing 4-11. Linear\
    \ Regression\n\n```python\nimport numpy\nimport theano\nimport theano.tensor as\
    \ T\nimport sklearn.metrics\n\ndef l2(x):\n    return T.sum(x**2)\n\ndef squared_error(x,y):\n\
    \    return (x - y)**2\n\nexamples = 1000\nfeatures = 100\nD = (numpy.random.randn(examples,\
