    Figure 7-5. CNN


    Listing [7-7] presents the source code for the convolution neural network and
    Figure [7-5] illustrates the computation graph. The following points are to be
    noted:


    *1. The overall network consists of two convolution-detector blocks, followed
    by a max pooling layer which in turn is followed by a two layer fully connected
    network (refer to Chapter [5](http://dx.doi.org/10.1007/978-1-4842-2766-4_5)).


    *2. The size of the kernel is 3 x 3.


    *3. The pooling operation is done over sections of dimensionality 2 x 2.


    *4. There are a number of dropout layers, which are basically a form of regularization
    (refer to Chapter [1](http://dx.doi.org/10.1007/978-1-4842-2766-4_1)) and operate
    by randomly turning off a certain number of units. The parameter `0.25` indicates
    the faction of inputs that will be randomly dropped.


    *5. The flatten layers convert the input of any dimensionality to a dimensionality
    of 1 x n. So, for instance, an input of dimensionality 2 x 2 x 3 gets converted
    to a directionality of 1 x 12.


    *6. The output layer is softmax and the loss function is categorical entropy,
    as is appropriate for a multiclassification problem (refer to Chapter [3](http://dx.doi.org/10.1007/978-1-4842-2766-4_3)).


    *7. The model is fit using adadelta (refer to Chapter [8](http://dx.doi.org/10.1007/978-1-4842-2766-4_8))
    and, for the purposes of illustration, we set the epochs to 1 (ideally it''s set
    to much more than that).


    Listing 7-8. LSTM


    ```python

    import numpy as np


    from keras.preprocessing import sequence

    from keras.utils import np_utils

    from keras.models import Sequential

    from keras.layers import Dense, Dropout, Activation, Embedding

    from keras.layers import LSTM

    from keras.datasets import imdb


    from keras.utils.visualize_util import plot


    max_features = 20000

    maxlen = 80

    batch_size = 32


    # Prepare dataset (X_train, y_train), (X_test, y_test) = imdb.load_data(nb_words=max_features)

    X_train = sequence.pad_sequences(X_train, maxlen=maxlen)

    X_test = sequence.pad_sequences(X_test, maxlen=maxlen)


    # LSTM model

    model = Sequential()

    model.add(Embedding(max_features, maxlen))

    model.add(LSTM(128, dropout=0.2))

    model.add(Dense(1))

    model.add(Activation(''sigmoid''))


    # Compile

    model.compile(loss=''binary_crossentropy'', optimizer=''adam'', metrics=[''accuracy''])


    # Training

    model.fit(X_train, y_train, epochs=1, batch_size=batch_size, validation_data=(X_test,
    y_test))


    # Evaluation

    score = model.evaluate(X_test, y_test, batch_size=batch_size)

    print("Test score:", score)

