    ## Intuition behind CNNs


    So far in this chapter we have covered the key constituent concepts behind the
    CNN, namely the convolution operation, the pooling operation, and how they are
    used in conjunction. Let us now take a step back to internalize the intuition
    behind CNNs using these building blocks.


    The first idea to consider is the capacity of CNNs (refer to Chapter [2](http://dx.doi.org/10.1007/978-1-4842-2766-4_2)
    on the capacity of a machine learning model). CNNs, which replace at least one
    of the fully connected layers of a neural network by the convolution operation,
    have less capacity than a fully connected network. That is, there exist data sets
    that a fully connected network will be able to model that a CNN will not be. So,
    the first point to note is that CNNs achieve more by limiting the capacity, hence
    making the training efficient.


    The second idea to consider is that learning the filters driving the convolution
    operation is, in a sense, representation learning. For instance, the learned filters
    might learn to detect edges, shapes, etc. The important point to consider here
    is that we are not manually describing the features to be extracted from the input
    data, but are describing an architecture that learns to engineer the features/representations.


    The third idea to consider is the location invariance introduced by the pooling
    operation. The pooling operation separates the location of the feature from the
    fact that it is detected. A filter detecting straight lines might detect this
    filter in any portion of the image, but the pooling operation picks the fact that
    the feature is detected (max pooling).


    The fourth idea is that of hierarchy. A CNN may have multiple convolution and
    pooling layers stacked up followed by a fully connected network. This allows the
    CNN to build a hierarchy of concepts wherein more abstract concepts are based
    on simpler concepts (refer to Chapter [1](http://dx.doi.org/10.1007/978-1-4842-2766-4_1)).


    The fifth and last idea is the presence of a fully connected layer at the end
    of a series convolution and pooling layers. The idea is that the series of convolution
    and pooling layers generates the features and a standard neural network learns
    the final classification/regression function. It is important to distinguish this aspect
    of the CNN from traditional machine learning. In traditional machine learning,
    an expert would hand engineer features and feed them to a neural network. In the
    case of CNNs, these features/representations are being learned from data.


    ## Summary


    In this chapter we covered the basics of CNNs. The key takeaway points are the
    convolution operation, the pooling operation, how they are used in conjunction,
    and how features are not hand engineered but learned. CNNs are the most successful
    application of deep learning and embody the idea of learning features/ representations
    rather than hand engineering them.


