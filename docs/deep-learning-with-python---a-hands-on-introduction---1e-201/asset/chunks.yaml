    Convolution Neural Networks (CNNs) in essence are neural networks that employ
    the convolution operation (instead of a fully connected layer) as one of its layers.
    CNNs are an incredibly successful technology that has been applied to problems
    wherein the input data on which predictions are to be made has a known grid like
    topology like a time series (which is a 1-D grid) or an image (which is a 2-D
    grid).


    ## Convolution Operation


    Let us start developing intuition for the convolution operation in one dimension.
    Given an input `I(t)` and a kernel `K(a)` the convolution operation is given by:


    ```

    s(f) = ^f (a) • K(t - a)

    ```


    An equivalent form of this operation given commutativity of the convolution operation
    is as follows:


    ```

    s(t) = ^I(t - a) • K(a)

    ```


    Furthermore, the negative sign (flipping) can be replaced to get cross-correlation
    given as follows:


    ```

    s(t) = ^I(t+a) • K(a)

    ```


    © Nikhil Ketkar 2017

    N. Ketkar, Deep Learning with Python, DOI 10.1007/978-1-4842-2766-4_5


    In deep learning literature and software implementations, convolution and cross-correlation
    are used interchangeably. The essence of the operation is that the Kernel is a
    much shorter set of data points as compared to the input, and the output of the
    convolution operation is higher when the input is similar to the kernel. Figures
    [5-1](#main-7.xhtml#bookmark5) and [5-2](#main-7.xhtml#bookmark6) illustrate this
    key idea. We take an arbitrary input and an arbitrary kernel, perform the convolution
    operation, and the highest value is achieved when the kernel is similar to a particular
    portion of the input.


    ![](main-40.jpg)

    Figure 5-1. Convolution operation - Intuition


    ![](main-41.jpg)

    Figure 5-2. Convolution operation - One Dimension


    Let us strengthen our intuition about convolution by observing Figures [5-1](#main-7.xhtml#bookmark5)
    and [5-2](#main-7.xhtml#bookmark6) and noting the following points:


    1. The input is an arbitrary large set of data points.

    2. The Kernel is a set of data points smaller in number to the input.

    3. The convolution operation in a sense slides the kernel over the input and computes
    how similar the kernel is with the portion of the input.

    4. The convolution operation produces the highest value where the Kernel is most
    similar with a portion of the input.


    The convolution operation can be extended to two dimensions. Given an input `I(m,
    n)` and a kernel `K(a, b)` the convolution operation is given by:


    ```

    s (t ) = -£^i (a ,b) • K(m - a, n - b)

    ```


    An equivalent form of this operation given commutativity of the convolution operation
    is as follows:


    ```

    s(t) = ££l(m - a,n - b) • K(a, b)

    ```


    Furthermore, the negative sign (flipping) can be replaced to get cross-correlation
    given as follows:


    ```

    s(t) = ££l(m + a,n+b) • K(a, b)

    ```


    Figure [5-3](#main-7.xhtml#bookmark7) illustrates the convolution operation in
    two dimensions. Note that this is simply extending the idea of convolution to
    two dimensions.


    ![](main-42.jpg)


    Having introduced the convolution operation, we can now dive deeper into the key
    constituent parts of a CNN, were a convolution layer is used instead of a fully
    connected layer which involves a matrix multiplication. So, a fully connected
    layer can be described as `y = f (x ■ w)` where `x` is the input vector, `y` is
    the output vector, `w` is a set of weights, and `f` is the activation function.
    Correspondingly, a convolution layer can be described as `y = f (s(x ■ w))` where
    `s` denotes the convolution operation between the input and the weights.


    Let us now contrast the fully connected layer with the convolution layer. Figure
    [5-4](#main-7.xhtml#bookmark8) illustrates a fully connected layer and Figure
    [5-5](#main-7.xhtml#bookmark9) illustrates a convolution layer, schematically.
    Figure [5-6](#main-7.xhtml#bookmark10) illustrates parameter sharing in a convolution
    layer and the lack of it in a fully connected layer. The following points should
    be noted:


    1. For the same number of inputs and outputs, the fully connected layer has a
    lot more connections, and correspondingly weights that a convolution layer.

    2. The interactions amongst inputs to produce outputs are fewer in convolution
    layers as compared to many interactions in the case of a fully connected layer.
    This is referred to as sparse interactions.

    3. Parameters/weights are shared across the convolution layer, given that the
    kernel is much smaller than the input and the kernel slides across the input.
    Thus, there are a lot fewer unique parameters/weights in a convolution layer.


    ![](main-43.jpg)![](main-44.jpg)![](main-45.jpg)

    Figure 5-4. Dense Interactions in Fully Connected Layers


    ![](main-46.jpg)!(main-47.jpg)

    Figure 5-6. Parameter Sharing Tied Weights


    ## Pooling Operation


    Let us now look at the pooling operation which is almost always used in CNNs.
    The intuition behind the pooling operation is that the exact location of the feature
    is not. Figure [5-7](#main-7.xhtml#bookmark13) illustrates the pooling operation
    for a two-dimensional input. The following points are to noted:


    1. Pooling operates over a input and applies a function `f` over this to produce
    the output.

    2. The function `f` is commonly the max operation (leading to max pooling), but
    other variants such as average or `L2` norm can be used as an alternative.

    3. For a two-dimensional input, this is rectangular.

    4. The output produced as a result of pooling is much smaller in dimensionality
    compared to the input.


    ![](main-48.jpg)


    Let us now look at the pooling operation which is almost always used in CNNs conjunction
    with convolution. Let us now look at how all the operations we have covered earlier
    work in conjunction. Refer to Figure [5-8](#main-7.xhtml#bookmark16) and Figure
    [5-9](#main-7.xhtml#bookmark17). The detector stage is simply a non-linear activation.


    1. The convolution, detector, and pooling operations are applied in sequence to
    transform the input to the output. The output is referred to as a feature map.

    2. The output is typically passed on to other layers (convolution or fully connected).

    3. Multiple Convolution-Detector-Pooling blocks can be applied in parallel, consuming
    the same input and producing multiple outputs or feature maps.


    ![](main-49.jpg)

    Figure 5-8. Convolution followed by detector stage and pooling


    ![](main-50.jpg)

    Figure 5-9. Multiple Filters/Kernels giving Multiple Feature Maps


    In the case of image inputs, which consist of 3 channels, a separate convolution
    operation is applied to each channel and then outputs post the convolution are
    added up. This is illustrated in Figure [5-10](#main-7.xhtml#bookmark18).


    ![](main-51.jpg)

    Figure 5-10. Convolution with Multiple Channels


    Having covered all the constituent elements of CNNs, we can now look at an exemplar
    CNN in its entirety as illustrated in Figure [5-11](#main-7.xhtml#bookmark19).
    The CNN consists of two stages of convolution-detector-pooling blocks with multiple
    filters/kernels at each stage producing multiple feature maps. Post these two
    stages we have a fully connected layer which produces the output. In general,
    a CNN may have multiple stages of convolution-detector-pooling blocks (employing
    multiple filters) typically followed by a fully connected layer.


    ![](main-52.jpg)

