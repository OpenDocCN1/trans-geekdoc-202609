    y = T.scalar('y')\nz1 = hinge_a(x,y)\nz2 = hinge_b(x,y)\nz3 = hinge_c(x,y)\n\n\
    f1 = theano.function(inputs=[x,y], outputs=[z1])\nf2 = theano.function(inputs=[x,y],\
    \ outputs=[z2])\nf3 = theano.function(inputs=[x,y], outputs=[z3])\n\nprint f1(2,1)\n\
    print f2(2,1)\nprint f3(2,1)\n```\n\n"
