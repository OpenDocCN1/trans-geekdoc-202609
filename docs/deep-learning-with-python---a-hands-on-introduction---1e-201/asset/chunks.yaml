    \n### Theano 简介\n在本章中，我们向读者介绍 Theano，这是一个用于定义数学函数（基于向量和矩阵）并计算这些函数梯度的库。Theano 是许多深度学习包的基础层。\n\
    \n### 什么是 Theano\n正如之前看到的，构建深度学习模型本质上是通过随机梯度下降 (SGD) 优化损失函数，这需要计算损失函数的梯度。由于深度学习损失函数非常复杂，手动推导此类梯度并不方便。这就是\
    \ Theano 的用武之地。使用 Theano 的典型工作流如下：\n1. 使用 Python 编写模型的符号表达式。\n2. 使用 Theano 的符号微分功能生成产生梯度的表达式。\n\
    3. 将此梯度函数作为参数传递给 SGD 优化程序以优化损失函数。\n\nTheano 允许用户专注于模型本身而非推导梯度的机制。Theano 作为构建深度学习模型优秀工具箱的特定能力如下：\n\
    1. 与 Numpy 无缝集成，允许用户在损失函数定义中使用 Numpy 对象（向量和矩阵）\n2. Theano 可以在底层为 CPU 和 GPU 生成优化的代码，而用户无需重写定义损失函数的代码。\n\
    3. 优化的自动/符号微分\n4. 通过自动/符号微分确保生成代码的数值稳定性。\n\n"
- fmt: '

    Let us now start getting our hands dirty with Theano. We will start with simple
    examples, which will serve as conceptual building blocks for more complicated
    examples. It is recommended that the reader go over the source code listing and
    corresponding computational graph for each example and give careful consideration
    to how the source code translates to the computational graph.


    In our first example in Listing [4-1] (and the corresponding computational graph
    in Figure [4-1]) we will define a simple function with scalars. The reader should
    note the following:


    1. Scalars are defined before they can be used in a mathematical expression.

    2. Every scalar is given a unique name.

    3. Once defined, the scalar can be operated upon with operations like `+`, `-`,
    `*` and `/`.

    4. The function construct in Theano allows one to relate inputs and outputs. So,
    in the example from Listing [4-1], we have defined a function with the name `g`,
    which takes `a`, `b`, `c`, `d`, and `e` as input and produces `f` as the output.

    5. We can now compute the result of the function `g` given the input and check
    that it evaluates exactly as the non-Theano expression.

    6. While this seems like a trivial example, the non-trivial bit is that now we
    will be able to easily compute the gradient of such a function `g` quite easily
    using Theano, as we will see soon.


    Listing 4-1. Functions with Scalars

    ```python

    import theano.tensor as T

    from theano import function

    a = T.dscalar(''a'')

    b = T.dscalar(''b'')

    c = T.dscalar(''c'')

    d = T.dscalar(''d'')

    e = T.dscalar(''e'')


    f = ((a - b + c) * d )/e


    g = function([a, b, c, d, e], f)


    print "Expected: ((1 - 2 + 3) * 4)/5.0"

    print "Via Theano: ((1 - 2 + 3) * 4)/5.0 = ", g(1, 2, 3, 4, 5))

    # Expected: ((1 - 2 + 3) * 4)/5.0 = 1.6

    # Via Theano: ((1 - 2 + 3) * 4)/5.0 = 1.6

    ```

    Figure 4-1. Functions with scalars


    In our second example in Listing [4-2] (and the corresponding computational graph
    in Figure [4-2]) we will define a simple function with vectors. The reader should
    note the following:


    1. Vectors/Matrices are defined before they can be used in a mathematical expression.

    2. Every Vector/Matrix is given a unique name.

    3. The dimensions of the Vectors/Matrices are not specified.

    4. Once Vectors/Matrices are defined, the user can define operations like addition,
    subtraction, and multiplication. The user should take care that vector/matrix
    operations respect the intended dimensionality.

    5. As before, the user can define a function based on defined expressions. In
    this case we define a function `f` that takes `a`, `b`, and `c` as input and produces
    `e` as output.

    6. The use can pass Numpy arrays to the function and compute the output. The user
    should take care that vector/matrix inputs respect the intended dimensionality.


    Listing 4-2. Functions with Vectors

    ```python

    import numpy

    import theano.tensor as T

    from theano import function

    a = T.dmatrix(''a'')

    b = T.dmatrix(''b'')

    c = T.dmatrix(''c'')

    d = T.dmatrix(''d'')

    e = (a + b - c) * d

    f = function([a, b, c], e)

    a_data = numpy.array([[1,1]])

    b_data = numpy.array([[2,2]])

    c_data = numpy.array([[5,5]])

    d_data = numpy.array([[3,3]])

    print "Expected:", (a_data + b_data - c_data) * d_data

    print "Via Theano:", f(a_data, b_data, c_data)

    # Expected: [[-6, -6], [-6, -6]]

    # Via Theano: [[-6., -6.], [-6., -6.]]

    ```

    Figure 4-2. Functions with Vectors


    In our next example in Listing [4-3] (and the corresponding computational graph
    in Figure [4-3]) we will define a function with both scalars and vectors. The
    reader should note the following:


    1. Scalars and vectors/matrices can be used together in expressions.

    2. The user needs to take care that vector/matrices respect the dimensionality
    while defining the expressions as well as passing inputs to the expressions.


    Listing 4-3. Functions with Scalars and Vectors

    ```python

    import numpy

    import theano.tensor as T

    from theano import function

    a = T.dmatrix(''a'')

    b = T.dmatrix(''b'')

    c = T.dmatrix(''c'')

    d = T.dmatrix(''d'')

    p = T.dscalar(''p'')

    q = T.dscalar(''q'')

    r = T.dscalar(''r'')

    s = T.dscalar(''s'')

    u = T.dscalar(''u'')

    e = (((a * p) + (b - q) - (c + r )) / s) * u

    f = function([a, b, c, d, p, q, r, s, u], e)

    a_data = numpy.array([[1,1]])

    b_data = numpy.array([[2,2]])

    c_data = numpy.array([[5,5]])

    d_data = numpy.array([[3,3]])

    print "Expected:", (((a_data * 1.0) + (b_data - 2.0) - (c_data + 3.0 )) / d_data/4.0)
    * 5.0

    print "Via Theano:", f(a_data, b_data, c_data, d_data, 1,2,3,4,5)

    # Expected: [[-26.25, -26.25], [-26.25, -26.25]]

    # Via Theano: [[-26.25, -26.25], [-26.25, -26.25]]

    ```

    Figure 4-3. Functions with Scalars and Vectors


    Activation Functions


    In our next example in Listing [4-4] (and the corresponding computational graph
    in Figure [4-4]) we will define a few activation functions with Theano. The `nnet`
    package in Theano defines a number of common activation functions.


    Listing 4-4. Activiation Functions

    ```python

    import theano.tensor as T

    from theano import function

    # sigmoid

    a = T.dmatrix(''a'')

    f_a = T.nnet.sigmoid(a)

    f_sigmoid = function([a], [f_a])

    print "sigmoid:", f_sigmoid([[1,0,1]])


    # tanh

    b = T.dmatrix(''b'')

    f_b = T.tanh(b)

    f_tanh = function([b], [f_b])

    print "tanh:", f_tanh([[1,0,1]])


    # fast sigmoid

    c = T.dmatrix(''c'')

    f_c = T.nnet.ultra_fast_sigmoid(c)

    f_fast_sigmoid = function([c], [f_c])

    print "fast sigmoid:", f_fast_sigmoid([[1,0,1]])


    # softplus

    d = T.dmatrix(''d'')

    f_d = T.nnet.softplus(d)

    f_softplus = function([d], [f_d])

    print "soft plus:", f_softplus([[1,0,1]])


    # relu

    e = T.dmatrix(''e'')

    f_e = T.nnet.relu(e)

    f_relu = function([e], [f_e])

    print "relu:", f_relu([[1,0,1]])


    # softmax

    f = T.dmatrix(''f'')

    f_f = T.nnet.softmax(f)

    f_softmax = function([f], [f_f])

    print "soft max:", f_softmax([[1,0,1]])

    ```

