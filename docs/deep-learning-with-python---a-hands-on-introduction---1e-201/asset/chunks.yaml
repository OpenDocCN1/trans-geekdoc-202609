    简单来说，我们利用上一步更新的某部分用于当前的更新。这种思想被称为**动量**（momentum），因为它类似于球在山坡下滚动时获得的动量。一个获得动量的球会在途中从较小的凹槽（局部最小值）中反弹出来，并到达山底。即使山坡的坡度大大减小，它也能在某种程度上保持之前的下坡速度（因为它已经积累了动量）。动量项基本上导致新的步长方向受到上一步步长方向的影响（参见图
    8-7）。经验证明，使用动量可以减少震荡并加速收敛。


    ## 尼斯特洛夫加速梯度 (NAS)


    使用与之前相同的符号，尼斯特洛夫加速梯度基本上是通过以下公式更新 `x` 的：


    ```

    ^Us \= g^Us-1 ^+^a^V x^L (^(\-)g^Us-1).

    ```


    也就是说，我们更新 `x=x-u[s]`。


    这背后的直觉逻辑是“向前看一步”。也就是说，我们首先沿着累积梯度的方向迈出一步，然后进行调整。NAS 的背后直觉是前瞻和预测，从而获得更好的解决方案（参见图
    8-8）。


    ![](img/main-93.jpg)


    ## 退火与学习率调度


    当梯度下降接近最小值时，我们已经看到糟糕的学习率如何导致它在最小值附近震荡（参见图 8-5）。退火是指在在接近最小值时减小学习率。这可以通过手动完成（停止梯度下降并在相同点使用减小后的学习率重新开始），或者通过学习率调度来实现，后者引入了若干由用户控制的超参数，这些参数根据步数决定学习率的降低方式。然而，必须注意的是，我们对所有参数使用了相同的学习率，这可能并不合适；我们需要对每个参数进行学习率调整。


    ## Adagrad


    Adagrad 算法为每个参数调整学习率。到目前，我们一直将损失函数的参数标记为 `x`。注意，`x` 实际上是大量的参数，每个参数都以相同的学习率进行更新。让
    `x[i]` 表示其中一个参数，让 `g[i]^s` 表示 `x` 在第 `s` 步的梯度。对于步骤 `0,1,...,S\-1`，我们有一系列对应的梯度
    `g0,g0,^,g[t]^s`。


    设


    ```

    G = (gi )² + (g1 )² +...+((“ )

    ```


    这基本上是直到上一步为止每一步梯度的平方之和。Adagrad 的更新规则是：


    ```

    ^aS

    ^xi = ^xi -  1 gi.

    G²

