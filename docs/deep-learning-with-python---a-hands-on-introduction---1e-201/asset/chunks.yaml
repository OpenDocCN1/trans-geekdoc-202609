  trans: "\n\n- 8. 共享变量允许用户定义一个带有内部状态的函数，可以对其任意更新，而无需重新定义使用共享变量定义的函数。\n\n#### 列表 4-5.\
    \ 共享变量\n\n```python\nimport theano.tensor as T\nfrom theano import function\n\
    from theano import shared\nimport numpy\n\nx = T.dmatrix('x')\ny = shared(numpy.array([[4,\
    \ 5, 6]]))\nz = x + y\nf = function(inputs = [x], outputs = [z])\nprint \"Original\
    \ Shared Value:\", y.get_value() \nprint \"Original Function Evaluation:\", f([[1,\
    \ 2, 3]])\n\ny.set_value(numpy.array([[5, 6, 7]]))\nprint \"Original Shared Value:\"\
    , y.get_value() \nprint \"Original Function Evaluation:\", f([[1, 2, 3]])\n# Couldn't\
    \ import dot_parser, loading of dot files will not be possible.\n# Original Shared\
    \ Value: [[4 5 6]]\n# Original Function Evaluation: [array([[ 5., 7., 9.]]]]\n\
    # Original Shared Value: [[5 6 7]]\n# Original Function Evaluation: [array([[\
    \ 6., 8., 10.]]]]\n```\n\n![](img/main-26.jpg)\n\n图 4-5. 共享变量\n\n在下一个示例 列表 4-6（以及图\
    \ 4-6 中对应的计算图）中，我们将定义一个函数并生成一个计算其梯度的函数。读者应该注意以下几点：\n\n1. 在生成函数梯度之前，需要使用表达式定义一个函数。\n\
    2. Theano 中的 `grad` 结构允许用户生成函数的梯度（以表达式的形式）。用户随后可以在该表达式上定义一个函数，从而得到梯度函数。\n3. 3.\
    \ 可以像前面的示例一样，为任何一组表达式/函数计算梯度。例如，我们可以为带有共享状态的函数生成梯度。随着共享状态的更新，函数和梯度函数也会随之更新。\n\n\
    #### 列表 4-6. 梯度\n\n```python\nimport theano.tensor as T \nfrom theano import function\
    \ \nfrom theano import shared\nimport numpy\n\nx = T.dmatrix('x')\ny = shared(numpy.array([[4,\
    \ 5, 6]]))\nz = T.sum(((x * x) + y) * x)\nf = function(inputs = [x], outputs =\
    \ [z])\ng = T.grad(z,[x]) \ng_f = function([x], g) \nprint \"Original:\", f([[1,\
    \ 2, 3]])\nprint \"Original Gradient:\", g_f([[1, 2, 3]]) \ny.set_value(numpy.array([[1,\
    \ 1, 1]]))\nprint \"Updated:\", f([[1, 2, 3]])\nprint \"Updated Gradient\", g_f([[1,\
    \ 2, 3]])\n# Original: [array(68.0)]\n# Original Gradient: [array([[ 7., 17.,\
    \ 33.]]]]\n# Updated: [array(42.0)]\n# Updated Gradient [array([[ 4., 13., 28.]]]]\n\
    ```\n\n![](img/main-27.jpg)\n\n图 4-6. 计算梯度\n\n在下一个示例 列表 4-7（以及图 4-7 (a) 和图 4-7\
    \ (b) 中对应的计算图）中，我们将使用 Theano 定义几个损失函数。Theano 中的 `nnet` 包实现了许多标准损失函数。\n\n#### 列表\
    \ 4-7. 损失函数\n\n```python\nimport theano.tensor as T \nfrom theano import function\n\
    \n# 二元交叉熵\na1 = T.dmatrix('a1') \na2 = T.dmatrix('a2') \nf_a = T.nnet.binary_crossentropy(a1,\
    \ a2).mean() \nf_sigmoid = function([a1, a2],[f_a]) \nprint \"Binary Cross Entropy\
    \ [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\", f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n\
    \n# 分类交叉熵\nb1 = T.dmatrix('b1')\nb2 = T.dmatrix('b2')\nf_b = T.nnet.categorical_crossentropy(b1,\
    \ b2) \nf_sigmoid = function([b1, b2],[f_b]) \nprint \"Categorical Cross Entropy\
    \ [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\", f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n\
    \n# 平方误差 \ndef squared_error(x,y):\n    return (x - y) ** 2\nc1 = T.dmatrix('b1')\n\
    c2 = T.dmatrix('b2')\nf_c = squared_error(c1, c2) \nf_squared_error = function([c1,\
    \ c2],[f_c]) \nprint \"Squared Error [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\",\
    \ f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n# Binary Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\
    \ array(3.05814650319446)\n# Categorical Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\
    \ array(9.1642887)\n# Squared Error [[0.01,0.01,0.01]],[0.99,0.99,0.01]]: array(9.1642887)\n\
    ```\n\n（注：提供的文本在损失函数部分包含了一些伪影/交织字符，已清理）*\n\nmain-28.jpg)\n\n图 4-7 (b). 二元交叉熵 -\
    \ 平方误差\n\n#### 列表 4-8. 正则化\n\n```python\nimport theano.tensor as T \nfrom theano\
    \ import function\n\n# L1 正则化\ndef l1(x):\n    return T.sum(abs(x))\n\n# L2 正则化\n\
    def l2(x):\n    return T.sum(x**2)\n\na = T.dmatrix('a')\nf_a = l1(a)\nf_l1 =\
    \ function([a], f_a) \nprint \"L1 Regularization:\", f_l1([[0,1,3]])\n\nb = T.dmatrix('b')\n\
    f_b = l2(b)\nf_l2 = function([b], f_b) \nprint \"L2 Regularization:\", f_l2([[0,1,3]])\n\
    # L1 Regularization: 4.0\n# L2 Regularization: 10.0\n```\n\n![](img/main-30.jpg)\n\
    \n图 4-8. 正则化\n\n在下一个示例 列表 4-9（以及图 4-9）中，我们将定义一个带有随机变量的函数。读者应该注意以下几点：\n\n1. 有些情况我们希望定义带有随机变量函数（例如引入扰动）。\n\
    2. 这种随机元素与内部状态（如共享变量的情况）不同。\n3. 基本上，这种情况是为了用户想要定义一个具有特定分布的随机变量。\n4. Theano 提供了一个名为\
    \ `RandomStreams` 的结构，允许用户定义带有随机变量的函数。`RandomStreams` 使用 `seed` 初始化。\n5. 用户使用\
    \ `RandomStreams` 定义变量并通过调用相应的函数指定分布（在本例中为 `normal`）。\n6. 定义后，随机变量可以类似于标量和矩阵的方式在表达式或函数中使用。\n\
    7. 带有随机变量定义的调用都会内部从集合（在本例中为 `normal`）提取样本点。\n\n#### 列表 4-9. 随机流\n\n```python\n\
    import theano.tensor as T\nfrom theano import function\nfrom theano.tensor.shared_randomstreams\
    \ import RandomStreams\n import numpy\n\nrandom = RandomStreams(seed=42)\na =\
    \ random.normal((1,3))\nb = T.dmatrix('a')\nf1 = a * b\ng1 = function([b], f1)\n\
    print \"Invocation 1:\",\nprint \"Invocation 2:\",\nprint \"Invocation 3:\",\n\
    g1(numpy.ones((1,3)))\ng1(numpy.ones((1,3)))\ng1(numpy.ones((1,3)))\n# Invocation\
    \ 1:\n# Invocation 2:\n# Invocation 3:\n# [[1.25614218, 0.66992188, 0.0724739],\
    \ [-0.53793023, -0.70813926, -0.66508406], [-0.10434045, 0.99601177, 0.93707751]]\n\
    ```\n\n"
- fmt: "\nIn our next example in Listing [4-10](#main-6.xhtml#bookmark45) (and corresponding\
    \ computational graph in Figure [4-10](#main-6.xhtml#bookmark46)) we will build\
    \ a model for Logistic regression. The reader should note the following:\n\n*\
    \ 1. The example generates some artificial/toy data, fits a logistic regression\
    \ model and computes the accuracy before and after training. This is a toy dataset\
    \ for the purposes of illustration; the model is not generalizing/learning, as\
    \ the data is generated randomly.\n* 2. We define a function to compute L2 regularization\
    \ as covered in listing [4-8](#main-6.xhtml#bookmark41) earlier.\n* 3. We generate\
    \ input data, which consists of 1000 vectors of dimensionality 100. Basically,\
    \ 1000 examples with 100 features.\n* 4. We generate random target/output labels\
    \ as zeros and ones.\n* 5. We define the expressions for logistic regression involving\
    \ the data (denoted by `x`), the outputs (denoted by `y`), the bias term (denoted\
    \ by `b`), and the weight vector (denoted by `w`). The weight vector and the bias\
    \ term are shared variables.\n* 6. We compute the prediction, the error, and the\
    \ loss using binary cross entropy as introduced in listing [4-7](#main-6.xhtml#bookmark38)\
    \ earlier.\n* 7. Having defined these expressions, we can now use the `grad` construct\
    \ in Theano (introduced in listing ([4-6](#main-6.xhtml#bookmark36))) to compute\
    \ the gradient.\n* 8. We define a `train` function based on the gradient function.\
    \ The `train` function defines the inputs, outputs, and how the internal state\
    \ (shared variables) are to be updated.\n* 9. The `train` function is invoked\
    \ for 1000 steps; in each step the gradient is computed internally and the shared\
    \ variables are updated.\n* 10. Accuracy is computed before and after the training\
    \ steps using `sklearn.metrics`.\n\n### Listing 4-10. Logistic Regression\n\n\
    ```python\nimport numpy\nimport theano\nimport theano.tensor as T\nimport sklearn.metrics\n\
    \ndef l2(x):\n    return T.sum(x**2)\n\nexamples = 1000\nfeatures = 100\nD = (numpy.random.randn(examples,\
    \ features), numpy.random.randint(size=examples, low=0, high=2))\ntraining_steps\
    \ = 1000\n\nx = T.dmatrix(\"x\")\ny = T.dvector(\"y\")\nw = theano.shared(numpy.random.randn(features),\
    \ name=\"w\")\nb = theano.shared(0., name=\"b\")\np = 1 / (1 + T.exp(-T.dot(x,\
    \ w) - b))\nerror = T.nnet.binary_crossentropy(p,y)\nloss = error.mean() + 0.01\
    \ * l2(w)\nprediction = p > 0.5\ngw, gb = T.grad(loss, [w, b])\n\ntrain = theano.function(inputs=[x,y],outputs=[p,\
    \ error], updates=((w, w - 0.1 * gw), (b, b - 0.1 * gb)))\npredict = theano.function(inputs=[x],\
    \ outputs=prediction)\n\nprint \"Accuracy before Training:\",sklearn.metrics.accuracy_score(D[1],\
    \ predict(D[0]))\nfor i in range(training_steps):\n    prediction, error = train(D[0],\
    \ D[1])\n    print \"Accuracy before Training:\",sklearn.metrics.accuracy_score(D[1],\
    \ predict(D[0]))\n\n# Accuracy before Training: 0.481\n# Accuracy before Training:\
    \ 0.629\n```\n\n![](main-32.jpg)\n\nFigure 4-10. Logistic Regression\n\n| val=l\
    \ .0 TensocType( float 64. scalar) ||  || w ||  || va 1=0.0 TensorType(float64.\
    \ scalar) ||  || b |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\nIn\
    \ our next example in Listing [4-11](#main-6.xhtml#bookmark47) (and corresponding\
    \ computational graph in Figure [4-11](#main-6.xhtml#bookmark48)) we will build\
    \ a model for Linear regression. The reader should note the following:\n\n* 1.\
    \ The example generates some artificial/toy data, fits a linear regression model\
    \ and computes the accuracy before and after training. This is a toy dataset for\
    \ the purposes of illustration, the model is not generalizing/learning as the\
    \ data is generated randomly.\n* 2. We define a function to compute L2 regularization\
