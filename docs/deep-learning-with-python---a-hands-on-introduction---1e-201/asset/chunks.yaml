    # Chapter 1 Introduction to Deep Learning


    ## Overview of Subsequent Chapters


    We now provide an overall outline of the subsequent chapters for the reader. It
    is important to note that each of the chapters covers either the concepts or the
    skills (or in certain cases both) with respect to deep learning. We highlight
    these below so that the readers can ensure that they have internalized these concepts
    and skills. It is highly recommended that the readers not only read the chapters
    but also work out the mathematical details (using pen and paper) and play with
    the source code provided in each of the chapters.


    1. Chapter [2](http://dx.doi.org/10.1007/978-1-4842-2766-4_2) covers the basics
    of `Machine Learning`. The key take home point for this chapter is the concept
    of generalizing over unseen examples, the ideas of over-fitting and under-fitting
    the training data, the capacity of the model, and the notion of regularization.

    2. Chapter [3](http://dx.doi.org/10.1007/978-1-4842-2766-4_3) covers `Feed Forward
    Neural Networks` and serves as the conceptual foundation for the entire book.
    Concepts like the overall structure of the neural network, the input, hidden and
