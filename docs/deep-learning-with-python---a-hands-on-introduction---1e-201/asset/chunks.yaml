    建议对输入数据进行洗牌，因为数据可能是按照特定的顺序排列的，从而偏偏 `SGD`。一个罕见的例外是`Curriculum Learning`（课程学习），其中示例按照有意义的顺序（预测难度逐渐增加）呈现。


    ### 批量归一化

    虽然我们初始化参数的方式使其保持归一化（随机设置、正态分布、零均值和单位方差），但它们在更新步骤中并不会保持归一化状态。批量归一化在每个批次后对参数进行重新归一化（参考
    `batch SGD`）。


    ### 早停

    早停基本上涉及在未见过的（未用于 SGD 的）训练数据子集（称为`validation data`）上测量损失，并在观察到损失没有变化时停止。通常有两个超参数：一个决定变化是否显著（任何小于此值的损失变化都被视为没有变化），以及一个
    `patience`（耐心）参数，即在迭代过程终止之前可以采取无变化步进的次数。


    ### 梯度噪声

    梯度噪声技巧在每个更新步骤中引入一个均值为中心的噪声 `N(0,s)`。这里，`a` 是一个超参数，梯度计算方式为 `g[i] = g[i] + N (0,ct)`。


    ## 并行和分布式 SGD

    我们现在介绍 `SGD` 的两种并行和分布式方法。`SGD` 的基本形式是一种顺序算法，在大规模数据集和具有大量参数的模型上收敛速度可能非常慢。在处理海量训练数据（十亿级）和大量模型参数（百万级）时，并行和分布式方法具有巨大远影响。


    ### Hogwild

    考虑 `SGD` 过程的更新步骤。使算法在本质上成为顺序执行的是更新步骤 `x = x\-a V[x]L(x)`。假设我们想使用多个计算线程来加速迭代。由于我们只希望一个线程来执行此操作（一次执行一次更新），我们会在该步骤周围放置一个
    `lock`（锁）以防止竞态条件。一旦这样做，它本质上就变成了一个顺序执行算法；无论我们为该过程投入多少核心和线程，实际上只有一个线程在工作，而所有其他线程都在等待锁。


    `Hogwild` 的背后的直觉是，当优化问题是稀疏时，由于没有在更新步骤上放置锁导致的竞态条件不会导致更新产生大的不一致。这仅仅是因为每个更新步骤只触及少数参数。`Hogwild`
    的作者为这一发现提供了强力的理论和实证证据，在大数据集上的收益是显著的。`Hogwild` 在多核 CPU 和 GPU 上易于实现。


    ### Downpour

    Downpour 是一种 `SGD` 的分布式算法，由两个关键活动部分组成：`model replica`（模型副本）和 `parameter server`（参数服务器）（参考图
    8-9）。`model replica`是一组在数据子集上运行的机器，每台机器只操作参数子集。有很多这样的模型副本，每个副本操作大型数据集的不同子集。`parameter
    server` 是一组维护模型公共全局状态的机器。`Model replicas` 从 `parameter server` 获取全局状态，根据数据集更新模型并更新全局状态。注意，全局状态的获取和更新并不是每次迭代都会发生。`Downpour`
    具有两个级别的分布。首先，模型参数（我们目前一直表示为 `x` 的内容）被划分到每个 `model replica` 中的多个机器上。其次，数据在模型副本之间进行划分。因此，本质上每台机器都在使用数据子集对模型参数子集进行梯度更新。全局状态是异步更新的。尽管
    `Downpour` 引入了明显的不一致性，但已证明在训练带有大量数据的大模型时非常有效。


    ![](img/main-97.jpg)

    图 8-9. Downpour


    ## 使用 Downhill 动手上手 SGD

    我们现在将使用名为 `Downhill` 的 Python 包对 `SGD` 进行动手练习。`Downhill` 实现了 `SGD` 及其许多变体。它在 `Theano`
    中定义的损失函数上运行，这使其成为一个在 Theano 中定义的任意损失函数上玩转 `SGD` 变体的方便工具。


    ### 1. 生成数据

    ```python

    # 设置种子

    numpy.random.seed(0)


    # 示例数量

    num_examples = len(train_X)


    # 我们的神经网络

    nn_input_dim = 2

    nn_hdim = 1000

    nn_output_dim = 2


    # 指定示例数量和噪声水平

    train_X, train_y = sklearn.datasets.make_moons(5000, noise=0.1)


    # 对目标值进行独热编码

    train_y_onehot = numpy.eye(2)[train_y]

    ```


    ### 2. 定义损失函数

    ```python

    # 正则化

    reg_lambda = numpy.float64(0.01)


    # 权重和偏置

    W1_val = numpy.random.randn(nn_input_dim, nn_hdim)

    b1_val = numpy.zeros(nn_hdim)


    W2_val = numpy.random.randn(nn_hdim, nn_output_dim)

    b2_val = numpy.zeros(nn_output_dim)


    X = T.matrix(''X'')

    y = T.matrix(''y'')


    W1 = theano.shared(W1_val, name=''W1'')

    b1 = theano.shared(b1_val, name=''b1'')

    W2 = theano.shared(W2_val, name=''W2'')

    b2 = theano.shared(b2_val, name=''b2'')


    # 我们的损失函数

    z1 = X.dot(W1) + b1

    a1 = T.tanh(z1)

    z2 = a1.dot(W2) + b2

    y_hat = T.nnet.softmax(z2)


    loss_reg = 1./batch_size * reg_lambda/2 * (T.sum(T.sqr(W1)) + T.sum(T.sqr(W2)))

    loss = T.nnet.categorical_crossentropy(y_hat, y).mean() + loss_reg


    prediction = T.argmax(y_hat, axis=1)

    predict = theano.function([X], prediction)

    ```


    ### 3. SGD

    ```python

    # 存储训练和验证损失

    train_loss = []

    validation_loss = []


    opt = downhill.build(''sgd'', loss=loss)

    ```

    ■ **注意**：目前我们将避开使用 theano 定义损失函数的细节（书中其他地方有介绍）。


