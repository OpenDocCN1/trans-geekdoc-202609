  \ theano import function\nfrom theano.tensor.shared_randomstreams import RandomStreams\n\
  \ import numpy\n\nrandom = RandomStreams(seed=42)\na = random.normal((1,3))\nb =\
  \ T.dmatrix('a')\nf1 = a * b\ng1 = function([b], f1)\nprint \"Invocation 1:\",\n\
  print \"Invocation 2:\",\nprint \"Invocation 3:\",\ng1(numpy.ones((1,3)))\ng1(numpy.ones((1,3)))\n\
  g1(numpy.ones((1,3)))\n# Invocation 1:\n# Invocation 2:\n# Invocation 3:\n# [[1.25614218,\
