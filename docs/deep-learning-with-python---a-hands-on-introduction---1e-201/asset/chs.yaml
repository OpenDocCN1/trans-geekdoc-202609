- "# Python 深度学习：实用入门指南 - 第一版 (2017)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n## 关于作者\n\n\nNikhil Ketkar 目前领导 Flipkart 的机器学习平台团队。他在华盛顿州立大学获得博士学位。之后，他在北卡罗来纳大学夏洛特分校进行博士后研究。最近，他在电子商务初创公司\
  \ Guavus 数据挖掘团队。他的研究兴趣包括机器学习和图论。\n\n## 关于技术评审员\n\nJojo Moolayail 是一位数据科学家，《*Smarter\
  \ Decisions: The Intersection of IoT*》一书作者。他出生并成长于印度浦纳，毕业于浦纳大学，主修信息技术工程。他的职业生涯始于\
  \ Mu Sigma，全球最大的纯分析提供商。作为进入物联网（IoT）领域的早期爱好者者之一，他现在专注于在通用电气解决决策科学问题。作为 GE 工作的一部分，他还负责开发数据科学和平台。\n\
  \n## 致谢\n\n我要感谢我在 Flipkart 和 Indix 的同事，以及技术评审员提供的反馈和意见。\n\n# 第一章\n## 深度学习简介\n\n\n\
  本章对深度学习主题进行了广泛概述和历史背景介绍。它还为读者提供了阅读本书的路线图、先备知识以及深入研究该主题的延伸阅读。\n\n### 历史背景\n\n人工智能（AI）领域可以被认为是深度学习的父级领域，其丰富的历史可以追溯到\
  \ 1950 年。虽然我们不会详细介绍这段历史，但我们将介绍该领域的一些关键转折点，这些转折点将引导我们走向深度学习。\n\n人工智能在早期关注的任务是那些可以容易形式化描述的任务，例如国际象棋或跳棋游戏。这种能够容易形式化描述任务的概念，是计算机程序能够或不能轻松完成任务的核心。例如，考虑国际象棋游戏。国际象棋游戏的形式化描述将是棋盘的表示、每个棋子的移动方式描述、起始配置以及游戏结束时的配置描述。\n\
  \n在有了这些形式化概念后，将一个玩国际象棋的 AI 程序建模为搜索是相对容易的，在足够的计算资源的情况下，可以产生相当出色的国际象棋 AI。\n\n\n\n\n\
  必须注意的是，这些规则的正式定义是人工完成的。然而，这些早期的 AI 系统在某种意义是相当通用的任务/问题求解器，任何可以用形式化描述的问题都可以用通用方法解决。\n\
  \n这类系统的主要局限性在于，国际象棋对 AI 来说是一个相对容易的问题，仅仅因为其问题设定相对简单，并且很容易被形式化。但对于人类日常解决的许多问题（自然智能）来说情况并非如此。例如，考虑诊断疾病（像医生那样做）或将人类语音转为文本。这些任务与人类轻松掌握的大多数任务一样，很难进行形式化描述，在\
  \ AI 早期曾是一项挑战。\n\n人类通过利用关于任务/问题领域的大量知识来处理此类任务。基于这一观察，随后的 AI 系统依赖于大型知识库，该知识库捕捉了关于问题/任务领域的知识。需要注意的是，这里使用的术语是“知识”（knowledge），而不是信息（information）或数据（data）。我们所说的知识是指程序/算法可以推理的数据/信息。一个例子可以是地图的图表示法，边标记有距离和交通状况（不断更新），这允许程序推理点与点之间的最短路径。\n\
  \n\n\n第 1 章 ■ 深度学习简介\n\n这种知识由专家编译并以允许算法/程序对其进行推理的方式表示的知识系统，代表了 AI 的第二代。这类方法的核心是日益复杂的用于表示和推理知识的方法，以解决需要此类知识的任务/问题。这种复杂性的示例包括使用一阶逻辑来编码知识，以及使用概率表示来在不确定性是该领域固有属性的情况下进行捕捉和推理。\n\
  \n这类系统面临并在某种程度上解决的面对挑战之一，是许多领域中固有的不确定性。人类在充满未知和不确定性的环境中进行推理相对擅长。这里的一个关键观察是，即使是我们对某个领域的知识也不是非黑即白的，而是灰色的。在这个时代，在表示和推理未知和不确定性方面取得了巨大进展。在诊断疾病等任务中取得了一些有限成功，这些任务依赖于在未知和不确定性存在的情况下利用知识库并进行推理。\n\
  \n这类系统的主要局限性是需要从专家那里手工编译关于领域的知识。收集、编译和维护此类知识库使得这些系统变得不实用。在某些领域，甚至收集和编译此类知识都极其困难（例如将语音转换为文本或将文档从一种语言翻译成另一种）。虽然人类可以轻松学会执行此类任务，但手工编译和编码任务相关的知识是极具挑战性的（例如英语语言、语法、口音和主题内容的知识）。\n\
  \n人类通过获取关于任务/问题领域的知识来处理此类任务，这一过程被称为“学习”。基于这一观察，随后 AI 研究的重点在十到二十年间转移到了根据提供的数据改进其性能的算法上。该子领域的重点是开发在给定数据的情况下，为任务/问题领域获取相关知识的算法。需要注意的是，这种知识获取依赖于有标记数据以及由人类定义的对标记数据的恰当表示。\n\
  \n例如，考虑诊断疾病的问题。对于此类任务，人类专家会收集许多患者患有和未患有目标疾病的病例。然后，人类专家会识别出若干有助于预测的特征，例如患者的年龄、性别，以及多项诊断测试的结果（如血压、血糖等）。人类专家会编译所有这些数据，并以合适的方式（如数据缩放/归一化等）表示。一旦准备好这些数据，机器学习算法就可以学习如何推断患者是否患有该疾病。\n\
  \n\n\n\n1. 收集、存储和处理海量数据的能力在过去十年取得了巨大进步（例如 `Apache Hadoop Ecosystem`）。\n2. 随着众包服务（如\
  \ `Amazon Mechanical Turk`）的出现，生成监督训练数据（这基本上是带有标签的数据——一个例子是对图片中的物体进行标注的图片）的能力已经得到了很大提高。\n\
  3. 图形处理器（`Graphical Processor Units`）带来的计算算力的巨大提升。\n4. 自动微分在理论和软件实现方面的进展（如 `Theano`）。\n\
  \n虽然这些进展对于深度学习来说是辅助性的，但它们在推动深度学习进步方面发挥了巨大作用。\n\n## 前提条件\n\n阅读本书的关键前提是具备 `Python`\
  \ 的基础知识，并学习过线性代数、微积分和概率论的课程。如果读者需要弥补这些前提条件，建议参考以下内容：\n\n1. Mark Pilgrim 写的用于 Python\
  \ 的 `Dive Into Python`。\n2. Gilbert Strang 写的线性代数 `Linear Algebra`。\n3. Gilbert\
  \ Strang 写的微积分 `Calculus`。\n4. Larry Wasserman 写的概率论 `All of Statistics`（第 1 部分，第\
  \ [1](http://dx.doi.org/10.1007/978-1-4842-2766-4_1) 至第 [5](http://dx.doi.org/10.1007/978-1-4842-2766-4_5)\
  \ 章）。\n\n# 第 1 章 深度学习简介\n\n## 后续章节概述\n\n我们现在为读者提供后续章节的整体大纲。需要注意的是，每一章都涵盖了关于深度学习的理念或技能（在某些情况下两者兼有）。我们在下方重点介绍了这些内容，以便读者确保他们已经内化了这些概念和技能。强烈建议读者不仅要阅读章节，还要通过（纸笔）推导数学细节，并尝试每个章节中提供的源代码。\n\
  \n\n# 第 2 章 机器学习基础\n\n深度学习是`Machine Learning`（机器学习）的一个分支，在本章中我们将涵盖 `Machine Learning`\
  \ 的基础知识。虽然机器学习作为一个学科本质上是数学性的，但我们将数学保持在基础水平，以培养对该学科的直觉。本章涉及内容的前提是线性代数、微积分和基础概率论。\n\
  \n## 直觉\n\n作为人类，我们直观地感知到“学习”的概念：它简单意味着在一段时间内对某项任务做得更好。任务可以是物理的（如学习开车），也可以是智力的（如学习新语言）。机器学习的主题专注于开发能够像人类一样学习的算法；即它们随着时间的推移对任务处理得更好。\n\
  \n要提出的第一个问题是，我们为什么对能随经验改进性能的算法开发感兴趣？毕竟，有很多被开发并实现以解决现实问题的算法，它们并不会随着时间改进。从银行到电子商务，从汽车导航系统到登月器着陆，算法无处不在，但大多数算法都不会随时间改进。这些算法只是执行它们被设计的任务，偶尔需要维护。为什么我们需要机器学习？\n\
  \n这个问题的答案是，对于某些任务，开发一种能随经验改进性能的算法比手动开发算法要容易。虽然这在读者看来可能难以理解，但我们将在本章中建立这种直觉。\n\n##\
  \ 二分类\n\n为了进一步讨论当前的问题，我们需要对之前直观使用的一些术语（如任务、学习、经验和改进）给出精确定义。我们将从二分类任务开始。\n\n考虑一个抽象的问题领域，我们拥有如下形式的数据：\n\
  \n```\nD = {(x[1], y[1]), (x[2], y[2]), ..., (x[n], y[n])}\n```\n\n其中 $x \\in R^n$\
  \ 且 $y = \\pm1$。我们无法访问此类此类，只能访问子集 $S \\subset D$。利用 $S$，我们的任务是生成一个实现函数 $f:x \\to\
  \ y$ 的计算程序，以便使用 $f$ 对未见数据 $(x[i],y[i]) \\in S$ 进行正确的预测，即 $f(x[i]) = y[i]$。我们将 $U\
  \ \\subset D$ 表示为未见数据的集合，即 $(x[i], y[i]) \\notin S$ 且 $(x[i], y[i]) \\in U$。我们通过未见数据上的误差来衡量这项任务的性能。\n\
  \n\n\n\n我们现在对该任务有了精确的定义，即根据某些已见数据 `S` 生成 `f`，将数据分类为两个类别之一（`y = ±1`）。我们通过衡量在未见数据\
  \ `U` 上的误差 `E (f, D, U)` 来评估性能（以及性能的提升）。已见数据的大小 `|S|` 在概念上等同于经验。在此背景下，我们希望开发出能够生成此类函数\
  \ `f`（通常称为模型）的算法。总来说，机器学习领域研究的是此类算法的发展，这些算法产生模型来对未见数据进行预测，以及其他正式任务（我们将在本章后面部分介绍多个此类任务）。注意，`x`\
  \ 通常称为输入/输入变量，`y` 称为输出/输出变量。\n\n现在，让我们将这个抽象但精确的定义与现实问题联系起来，以便我们的抽象有根可循。假设一个电子商务网站想要为注册用户定制着陆页，向他们展示用户可能感兴趣购买的产品。该网站拥有用户的历史数据，并希望将其实现为一项功能以增加销售。现在让我们来看看这个现实问题如何映射到我们之前描述的二分类抽象问题上。\n\
  \n人们可能会注意到的第一点是，给定特定的用户和特定的产品，想要预测用户是否会购买该产品。由于这是要预测的值，它映射到 `y = ±1`，其中我们将 `y =\
  \ +1` 的值表示预测用户将购买该产品，并将 `y = -1` 表示为用户不购买该产品的预测。注意，选择这些值并没有特殊理由；我们可以调换它们（让 `y =\
  \ +1`表示不购买的情况，让 `y = -1`表示购买的情况），这没有区别。我们只是使用 `y = ±1` 来表示分类数据的两个感兴趣类别。接下来，假设我们可以以某种方式将产品的属性以及用户的购买和浏览历史表示为\
  \ `x ∈ R`。这一步在机器学习中被称为特征工程，我们将在本章稍后部分介绍。目前，只需说明我们能够生成这样的映射即可。因此，我们有了用户浏览和购买过的历史数据、产品属性以及用户是否购买该产品的映射到\
  \ `{(x[p] yj, (x[2],y[2]), ... (x[n],y[n])}`。现在，基于这些数据，我们希望生成一个函数或模型 `f:x→y`，可以用它来确定特定用户将购买哪些产品，并用此来填充用户的着陆页。我们可以通过为用户填充着陆页并观察他们是否购买产品来衡量模型在未见数据上的表现，并评估误差\
  \ `E (f, D, U)`。\n\n## 回归\n\n让我们引入另一个任务，即回归。在这里，我们拥有形式为 `D = {x[1], y[1]), (x[2],y[2])...\
  \ (x[n],y[n])}` 的数据，其中 `x ∈ R` 且 `y ∈ R`，我们的任务是生成实现函数 `f:x→y` 的计算过程。注意，预测不再像二分类那样的二进制标签\
  \ `y = ±1`，而是实值预测。我们通过未见数据上的均方根误差 (`RMSE`) 来衡量此任务的性能：\n\n```\nE (f, D, U) = sqrt(1/n\
  \ * Σ (y - f(x)))\n```\n注意，`RMSE` 仅仅是取预测值与实际值之间的差，平方以处理正负差，对所有未见数据取平均值，最后开平方以抵消平方操作。一个对应回归抽象任务的现实问题是根据财务历史预测信用分，这可以被信用卡公司使用。\n\
  \n## 泛化\n\n现在让我们涵盖机器学习中最重要的单一直觉，即我们希望开发出在未见数据上具有良好的模型。为了实现这一点，我们首先为回归任务引入一个玩具数据集。我们通过生成\
  \ -1 到 1 之间的 100 个值作为输入变量 (`x`) 来生成玩具数据集。根据 `y = 2 + x² + e` 生成输出变量 (`y`)，其中 `e\
  \ ~ N(0,0.1)` 是均值为 0、标准差为 0.1 的正态分布噪声。此代码见列表 2-1，数据见图 2-1。\n\n### 泛化 vs. 过拟合\n\n\
  ```python\nimport pylab\nimport numpy\n\nx = numpy.linspace(-1,1,100)\nsignal =\
  \ 2 + x * x\nnoise = numpy.random.normal(0, 0.1, 100)\ny = signal + noise\npylab.plot(signal,'b')\n\
  pylab.plot(y,'g')\npylab.plot(noise, 'r')\npylab.xlabel(\"x\")\npylab.ylabel(\"\
  y\")\npylab.legend([\"Without Noise\", \"With Noise\", \"Noise\"], loc=2)\n\nx_train\
  \ = x[0:80]\ny_train = y[0:80]\n\n## Model with degree 1\npylab.figure()\ndegree\
  \ = 2\nX_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])\n\
  model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),X_train.transpose()),y_train)\n\
  pylab.plot(x,y,'g')\npylab.xlabel(\"x\")\npylab.ylabel(\"y\")\npredicted = numpy.dot(model,\
  \ [numpy.power(x,i) for i in xrange(0,degree)])\npylab.plot(x, predicted,'r')\n\
  pylab.legend([\"Actual\", \"Predicted\"], loc=2)\ntrain_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80]\
  \ - predicted[0:80], y_train - predicted[0:80])))\ntest_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[80:]\
  \ - predicted[80:], y[80:] -predicted[80:]))\nprint(\"Train RMSE (Degree = 1)\"\
  , train_rmse1)\nprint(\"Test RMSE (Degree = 1)\", test_rmse1)\n\n## Model with degree\
  \ 2\npylab.figure()\ndegree = 3\nX_train = numpy.column_stack([numpy.power(x_train,i)\
  \ for i in xrange(0,degree)])\nmodel = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),\
  \ X_train.transpose()),y_train)\npylab.plot(x,y,'g')\npylab.xlabel(\"x\")\npylab.ylabel(\"\
  y\")\npredicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])\n\
  pylab.plot(x, predicted,'r')\npylab.legend([\"Actual\", \"Predicted\"], loc=2)\n\
  train_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train\
  \ - predicted[0:80])))\ntest_rmse1 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:],\
  \ y[80:] -predicted[80:]))\nprint(\"Train RMSE (Degree = 2)\", train_rmse1)\nprint(\"\
  Test RMSE (Degree = 2)\", test_rmse1)\n\n## Model with degree 8\npylab.figure()\n\
  degree = 9\nX_train = numpy.column_stack([numpy.power(x_train,i) for i in xrange(0,degree)])\n\
  model = numpy.dot(numpy.dot(numpy.linalg.inv(numpy.dot(X_train.transpose(),X_train)),\
  \ X_train.transpose()),y_train)\npylab.plot(x,y,'g')\npylab.xlabel(\"x\")\npylab.ylabel(\"\
  y\")\npredicted = numpy.dot(model, [numpy.power(x,i) for i in xrange(0,degree)])\n\
  pylab.plot(x, predicted,'r')\npylab.legend([\"Actual\", \"Predicted\"], loc=3)\n\
  train_rmse2 = numpy.sqrt(numpy.sum(numpy.dot(y[0:80] - predicted[0:80], y_train\
  \ - predicted[0:80])))\ntest_rmse2 = numpy.sqrt(numpy.sum(numpy.dot(y[80:] - predicted[80:],\
  \ y[80:] -predicted[80:]))\nprint(\"Train RMSE (Degree = 8)\", train_rmse2)\nprint(\"\
  Test RMSE (Degree = 8)\", test_rmse2)\n```\n\n### Output\nTrain RMSE (Degree = 1)\
  \ 3.50756834691 Test RMSE (Degree = 1) 7.69514326946\nTrain RMSE (Degree = 2) 0.91896252959\
  \ Test RMSE (Degree = 2) 0.446173435392\nTrain RMSE (Degree = 8) 0.897346255079\
  \ Test RMSE (Degree = 8) 14.1908525449\n\n\n\n\n\n\n为了模拟已见过和未见过的数据，我们使用前 80 个数据点作为见过的数据，其余部分被视为未见过的数据。也就是说，我们仅使用前\
  \ 80 个数据点构建模型，并使用剩余数据来评估模型。\n\n接下来，我们使用一种非常简单的算法来生成模型，通常称为最小二乘法（Least Squares）。给定形式为\
  \ `D = {{,{[1] ),(x[2],y[2])...(x[n],y[n]))` 的数据集，其中 `x \\in \\mathbb{R}^` 且 `y\
  \ \\in \\mathbb{R}`，最小二乘模型的形式为 `y = bx`，其中 `b` 是一个使得 `||Xb -y||²` 最小的向量。这里 `X` 是一个矩阵，每一行都是一个\
  \ `x`，因此 `X \\in \\mathbb{R}^{m \\times n}`，其中 `m` 是示例的数量（在案例中为 80）。`b` 的值可以使用闭式解\
  \ `b=(X^TX)^{-1}X^Ty` 推导出。我们略过了最小二乘法的许多重要细节，但这些细节对于当前的讨论是次要的。更相关的细节是我们如何将输入变量转换为适当的形式。在第一个模型中，我们将\
  \ `x` 转换为一个值向量 `[x⁰, x¹, x²]`。也就是说，如果 `x = 2`，它将被转换为 `[1, 2, 4]`。经过此转换后，我们可以使用上述公式生成最小二乘模型\
  \ `b`。底层发生的情况是我们正在使用二阶多项式（`degree = 2`）方程来近似给定数据，而最小二乘算法仅仅是曲线拟合或为每个 `[x⁰, x¹, x²\
  \ \\]` 生成系数。\n\n我们可以使用 `RMSE` 指标在未见过的数据上对模型进行评估。我们在训练数据上计算 `RMSE` 指标。实际值和预测值绘制在图\
  \ 2-2 中，列表 2-1 显示生成模型的源代码。\n\n\n接下来，我们使用最小二乘算法生成另一个模型，但我们将 `a` 转换为 `[a⁰, a¹, a²\
  \ , a³, a⁴, a⁵, a⁶, a⁷, a⁸]`。也就是说，我们正在使用 `degree = 8` 的多项式来近似给定数据。实际值和预测值绘制在图 2-3\
  \ 中，列表 2-1 显示生成模型的源代码。最后一步，我们生成一个 `degree = 1` 的模型。\n\n\n实际值和预测值绘制在图 2-4 中，列表 2-1\
  \  显示生成模型的源代码。\n\n\n图 2-4。`degree = 1` 模型的实际值和预测值\n\n我们现在已经有了所有的细节来讨论泛化（generalization）的核心概念。要问的关键问题是哪个模型更好？`degree\
  \ = 2` 的、`degree = 8` 的还是 `degree = 1` 的？\n\n让我们从对这三个模型进行一些观察开始。\n\n与其他两个模型相比，`degree\
  \ = 1` 的模型在见过和未见过的数据上表现都很差。`degree = 8` 的模型在见过数据上的表现优于 `degree = 2` 的模型。而 `degree\
  \ = 2` 的模型在未见过数据上的表现优于 `degree = 8` 的模型。表 2-1 以表格形式可视化了这一点，以便解释。\n\n表 2-1。3 种不同模型的性能对比\n\
  \n| 次数 | 1 | 2 | 8 |\n| --- | --- | --- | --- |\n| 见过数据 | 最差 | 最差 | 优 |\n| 未见过数据\
  \ | 最差 | 优 | 最差 |\n\n现在让我们来理解模型容量（model capacity）这一重要概念，它在例子中对应于多项式的次数。我们生成的数据使用了带有某些噪声的二阶多项式（`degree\
  \ = 2`）。然后，我们尝试使用三个次数分别为 1、2 和 8 的模型来近似这些数据。次数越高，模型的表达能力越强。也就是说，它可以容纳更多的变化。这种容纳变化的能力对应于容量的概念。也就是说，我们说\
  \ `degree = 8` 的模型的容量比 `degree = 2` 的模型高，而后者的容量又比 `degree = 1` 的模型高。容量越高总是好事吗？事实并非如此，当我们考虑到所有真实世界的数据集都包含某些噪声时，高容量模型最终会在拟合数据信号的同时也拟合噪声。这就是为什么我们观察到\
  \ `degree = 2` 的模型在未见过数据上的表现优于 `degree = 8` 的模型。在这个例子中，我们知道数据是如何生成的（带有某些噪声的二阶多项式（`degree\
  \ = 2`））；因此，这一观察是显而易见的。然而，在现实世界中，我们不知道生成数据的底层机制。这导致了机器学习中的一个根本性挑战：模型是否真的泛化？\n\n\
