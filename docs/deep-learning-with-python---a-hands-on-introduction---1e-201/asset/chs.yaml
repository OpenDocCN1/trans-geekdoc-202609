  \n# 第 9 章 自动微分\n\n![](img/main102.png)\n\n在随机梯度下降章节中，我们将损失函数 `L(x)` 梯度的计算视为黑箱。在本章中，我们打开这个黑箱，涵盖自动微分的理论和实践。自动微分是一项成熟的技术，允许轻松且高效地计算任意复杂损失函数的梯度。这对于最小化感兴趣的损失函数至关重要；构建任何深度学习模型的核心都是一个优化问题，通常使用随机梯度下降求解，而这又要求计算梯度。本章中的大多数应用都基于\
  \ Python 包 `Autograd`，它提供了一套成熟的自动微分功能。自动微分不同于数值微分和符号微分，我们首先对这两者进行足够的介绍，以便区别变得清晰。为了便于说明，假设我们感兴趣的函数是\
  \ `f: R -> R`，我们意图找到标记为 `f'(x)` 的导数。\n\n## 数值微分\n\n数值微分的基本形式遵循导数/梯度的定义。因此，假设我们可以向前差分法计算\
  \ `f(x)` 为 `f'(x) = (f(x+h) - f(x))/h`，设置一个足够小的 `h` 值。同样，我们可以使用后向差分法计算 `f(x)` 为\
  \ `f'(x) = (f(x) - f(x-h))/h`，再次设置一个足够小的 `h` 值。更具对称的形式是中心差分法，它计算 `f` 为 `f'(x) =\
  \ (f(x+h) - f(x-h))/(2h)`。\n\n![](img/main103.jpg)\n\n对这一思想的进一步发展是 Richardson 外推法\
  \ `f'(x) = (-f(x+h) - 8f(x+h/2) + f(x-h/2)) / (12h)`。向前和后向差分的近似误差是 `h` 的数量级，即 `O(h)`，而中心差分和\
  \ Richardson 似的的误差分别为 `O(h²)` 和 `O(h⁴)`。\n\n数值微分的主要问题是计算成本（它随损失函数中参数的数量而增加）、截断误差和舍入误差。截断误差由于\
  \ `h` 不为零导致我们在计算 `f(x)` 时产生的不准确性。舍入误差是使用浮点数和浮点算术所固有的（与使用无限精度数字相比）。因此，数值微分并不是构建深度学习模型时计算梯度的可行方法。数值微分唯一好用的地方是快速检查梯度是否计算正确。当你手动计算梯度或使用未知自动微分库时，强烈建议进行此类检查。理想情况下，应该在启动\
  \ `SGD` 之前加入这种检查/断言。\n\n数值微分实现在名为 `Scipy` 的 Python 包中。我们在这里不涵盖它，因为它与深度学习直接相关。\n\n\
  ## 符号微分\n\n符号微分的基本形式是一组应用于损失函数的符号重写规则，以得到导数/梯度。考虑以下两个简单规则：\n\n![](img/main104.jpg)\
  \ 和 ![](img/main105.jpg)\n\n现在，给定一个类似 `f(x)=2x³+x²` 的函数，我们可以连续应用符号重写规则，首先通过第一个规则得到\
  \ ![](img/main106.jpg)，然后通过第二个规则得到 `f'(x) = 6x² + 2x`。符号微分自动化了我们手动推导梯度时的工作。当然，此类规则的数量可能很大，可以利用更复杂的算法来使这种符号重写更高效。然而，从本质上说，符号微分仅仅是符号重写规则的应用。符号微分的主要优势在于它生成了一个可以理解和分析的导数/梯度的清晰表达式。符号微分的主要问题在于它局限于已定义的符号微分规则，这可能导致我们在尝试最小化复杂损失函数时遇到障碍。一个例子是当损失函数涉及\
  \ `if-else` 子句或 `for/while` 循环。在某种意义上，符号微分是对（闭式）数学表达式进行求微分；而不是对给定的计算过程进行求微分。\n\n\
  \n\n\n\n自动微分的另一个问题是，在某些情况下，符号重写规则的朴素应用会导致符号项的爆炸（表达式膨胀），并使得该过程在计算上是不可行的。通常，需要大量的计算工作来简化这些表达式，并产生导数的闭式表达式。\n\
  \n> **注意**：符号微分是在一个名为 `Sympy` 的 Python 软件包中实现的。我们在这里不进行介绍它，因为它与深度学习没有直接关系。\n\n##\
  \ 自动微分基础\n\n自动微分的第一个关键直觉是：所有感兴趣的函数（我们想要求导的函数）都可以表示为基本函数的复合，而这些基本函数的对应导函数是已知的。因此，复合函数可以通过应用链式法则来求导。这种直觉也是符号微分的基础。\n\
  \n自动微分的第二个关键直觉是：与其存储和处理原始函数导数的中间符号形式，不如简单地对它们进行求值（针对特定的输入值集合），从而解决表达式膨胀的问题。由于中间符号形式被求值，我们就不有简化表达式的负担。需要注意的是，这阻止了我们获得像符号微分那样的闭式数学表达式；我们通过自动微分得到的是给定值集的导数求值。\n\
  \n自动微分的第三个关键直觉是：由于我们是在对原始形式进行求值，我们可以处理任意的计算程序，而不仅仅是闭式数学表达式。也就是说，我们的函数可以包含 if-else\
  \ 语句、`for` 循环甚至递归。自动微分处理任何计算程序的方法是将程序的单次求值（针对给定的输入集）视为输入变量上基本函数求值的有限列表，以产生一个或多个输出变量。虽然可能控制流语句（if-else\
  \ 语句、`for` 循环等），但最终有一个特定的函数求值列表将给定输入转换为输出。这种列表/求值轨迹被称为 `Wengert list`。\n\n让我们通过引入一个简单的函数来为讨论自动微分做准备：\n\
  \n```\nf (Xj, x[2])=(Xj² + x[2]²)\n```\n\n图 9-1 显示了该函数的计算图。注意，为了方便，我们还引入了一些中间变量。\n\
