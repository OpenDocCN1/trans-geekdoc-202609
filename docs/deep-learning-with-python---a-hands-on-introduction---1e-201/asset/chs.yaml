  \n\n\n## 使用极大似然性推导代价函数\n\n现在我们将研究如何使用极大似然性推导损失函数。具体来说，我们将看到深度学习中常用的损失函数（如二分类交叉熵、交叉熵和平方误差）是如何通过极大似然原理推出来的。\n\
  \n### 二分类交叉熵\n\n与其从极大似然性的通用思想开始，让我们直接跳转到二分类问题。我们有一些数据，由 `D = {x[p]{{(x[2],y[2]),...(x[n],y[n]))}`\
  \ 组成，其中 `xe eR\"`  `y e{0,1}` 是感兴趣的目标（目前是二的，但取决于我们处理的是多分类问题还是回归问题，它可能是分类或实值的）。\n\
  \n假设我们通过某种方式生成了一个模型，在给定 `x` 的情况下预测 `y` 的概率。我们将此模型记为 `f (x, 9)`，其中 `9` 代表模型的参数。极大似然性的核心思想是找到一个最大化\
  \ `P (D |q)` 的 `9`。假设从伯努利分布且给定每个示例 `{(x[1], y[1]), (x[2], y[2]), . (x[n], y[n])}`\
