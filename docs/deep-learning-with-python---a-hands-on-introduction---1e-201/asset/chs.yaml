  \n![](img/main-96.jpg)\n\n## 弹性反向传播 (Resilient Backpropagation)\n\n弹性反向传播的直觉是，当学习率过高时，梯度的符号会在正负之间反复切换（参见图\
  \ [7](http://dx.doi.org/10.1007/978-1-4842-2766-4_5%23Fig8)）。核心思想是保留上一个梯度的符号并与当前梯度匹配。如果符号相同，使用较高的学习率；如果不同，则使用较低的学习率。注意这是针对每个参数进行的。\n\
  \n## 平衡 SGD\n\n平衡 SGD 旨在解决 SGD 遇到的鞍点问题。这里的核心思想是我们需要二阶信息（损失函数的二阶导数）来跳出鞍点陷阱。平衡 SGD\
  \ 的更新规则给出：\n\n```\nx[t] = x[t] —gi where D? = p D+(-p}(H[d])²\nii[S]\n```\n\n（指数加权平均）且\
  \ `H[d]` 是 `L(x)` 在 `x e N(0,1)` 处符号计算的海森矩阵的对角线元素。\n\n## 使用 SGD 的技巧与建议\n\n### 输入数据\n\
  \n数据的良好缩放对于便于优化至关重要（参见图 8-6）。一个很好的法则是通过减去均值并除以标准差来对数据进行标准化。因此，如果 `X = { [1], X[2]\
  \ ...X[n] }` 是一个输入变量，我们转换数据使得：\n\n```\nXi =     .\ns\n```\n\n对于稀疏数据的情况（大部分 `X[i]`\
  \ 等于 0），标准化过程会导致数据变得密集，此时可以使用最大绝对值缩放（max-abs scaling）：\n\n```\n[X]. = N .\n^i max\
  \ (X )\n```\n\n将特征缩放到单位范数是缩放数据的另一种方法。\n\n此外，良好的做法是使用主成分分析从输入数据消除消除变量之间的线性相关性。\n\n\
  ### 激活函数的选择\n\n激活函数的常见示例是标准逻辑函数 `f (x) =—¹—` 和\n\n```\n[1+] [e]^(\\-)^x\n```\n\n\
  双曲正切函数 `f (x )= tanh(x )`。推荐的方法是使用关于 0 对称的激活函数（而不是只有正或负），例如 `f (x ) \\= 1.7159tanh\
  \ 2 [x] 0`。还建议添加一个较小的线性项以防止平坦区域，`f(x)= tanh(x)+ax`。\n\n### 目标值\n\n\n\n\n在许多情况下目标值可以是二元的（0,1），但建议将目标变量转换为位于定义`loss\
  \ function`（损失函数）时使用的激活函数范围内（不是渐近地，而是实际上）的数值。这样做会导致参数更新为越来越大的值，而对（输出标签）没有产生任何效果。然而，如果目标标签的值被用作`confidence`（置信度）的衡量标准，那么那些被不必要地推向高值的标签就是`confidence`的糟糕估计。虽然\
  \ 0 和 1 可能是激活函数的极值，但确保不选择位于激活函数线性区域的目标也同样重要。推荐的方法是选择使激活函数二阶导数最大的值，例如对于 `f (x) =\
  \ 1.7159tanh| ²x`，选择`±1`。\n\n### 初始化参数\n随机初始化参数（正态分布、零均值、单位方差）是一项推荐的实践。对于激活函数为 `f\
  \ (x) = 1.7159tanh 2 [x]`（且数据已标准化）的神经网络，另一种配方是将权重设置为 `m ²`，其中 `m` 是 `fan-in`（馈入节点的连接数）。\n\
  \n### 数据洗牌\n建议对输入数据进行洗牌，因为数据可能是按照特定的顺序排列的，从而偏偏 `SGD`。一个罕见的例外是`Curriculum Learning`（课程学习），其中示例按照有意义的顺序（预测难度逐渐增加）呈现。\n\
  \n### 批量归一化\n虽然我们初始化参数的方式使其保持归一化（随机设置、正态分布、零均值和单位方差），但它们在更新步骤中并不会保持归一化状态。批量归一化在每个批次后对参数进行重新归一化（参考\
  \ `batch SGD`）。\n\n### 早停\n早停基本上涉及在未见过的（未用于 SGD 的）训练数据子集（称为`validation data`）上测量损失，并在观察到损失没有变化时停止。通常有两个超参数：一个决定变化是否显著（任何小于此值的损失变化都被视为没有变化），以及一个\
  \ `patience`（耐心）参数，即在迭代过程终止之前可以采取无变化步进的次数。\n\n### 梯度噪声\n梯度噪声技巧在每个更新步骤中引入一个均值为中心的噪声\
  \ `N(0,s)`。这里，`a` 是一个超参数，梯度计算方式为 `g[i] = g[i] + N (0,ct)`。\n\n## 并行和分布式 SGD\n我们现在介绍\
  \ `SGD` 的两种并行和分布式方法。`SGD` 的基本形式是一种顺序算法，在大规模数据集和具有大量参数的模型上收敛速度可能非常慢。在处理海量训练数据（十亿级）和大量模型参数（百万级）时，并行和分布式方法具有巨大远影响。\n\
  \n### Hogwild\n考虑 `SGD` 过程的更新步骤。使算法在本质上成为顺序执行的是更新步骤 `x = x\\-a V[x]L(x)`。假设我们想使用多个计算线程来加速迭代。由于我们只希望一个线程来执行此操作（一次执行一次更新），我们会在该步骤周围放置一个\
  \ `lock`（锁）以防止竞态条件。一旦这样做，它本质上就变成了一个顺序执行算法；无论我们为该过程投入多少核心和线程，实际上只有一个线程在工作，而所有其他线程都在等待锁。\n\
  \n`Hogwild` 的背后的直觉是，当优化问题是稀疏时，由于没有在更新步骤上放置锁导致的竞态条件不会导致更新产生大的不一致。这仅仅是因为每个更新步骤只触及少数参数。`Hogwild`\
  \ 的作者为这一发现提供了强力的理论和实证证据，在大数据集上的收益是显著的。`Hogwild` 在多核 CPU 和 GPU 上易于实现。\n\n### Downpour\n\
  Downpour 是一种 `SGD` 的分布式算法，由两个关键活动部分组成：`model replica`（模型副本）和 `parameter server`（参数服务器）（参考图\
  \ 8-9）。`model replica`是一组在数据子集上运行的机器，每台机器只操作参数子集。有很多这样的模型副本，每个副本操作大型数据集的不同子集。`parameter\
  \ server` 是一组维护模型公共全局状态的机器。`Model replicas` 从 `parameter server` 获取全局状态，根据数据集更新模型并更新全局状态。注意，全局状态的获取和更新并不是每次迭代都会发生。`Downpour`\
  \ 具有两个级别的分布。首先，模型参数（我们目前一直表示为 `x` 的内容）被划分到每个 `model replica` 中的多个机器上。其次，数据在模型副本之间进行划分。因此，本质上每台机器都在使用数据子集对模型参数子集进行梯度更新。全局状态是异步更新的。尽管\
  \ `Downpour` 引入了明显的不一致性，但已证明在训练带有大量数据的大模型时非常有效。\n\n![](img/main-97.jpg)\n图 8-9.\
