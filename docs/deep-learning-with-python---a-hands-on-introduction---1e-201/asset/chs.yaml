  \n## 自动微分的实现\n\n现在让我们来看自动微分（Automatic Differentiation）通常是如何实现的。三种主要方法是使用源码转换和运算符重载（显式或隐式的双对数实现）。\n\
  \n### 源码转换\n\n源码转换方法涉及用户在正规编程语言中实现损失函数，然后使用自动微分工具生成相应的 `gradient function`（梯度函数）。这两个部分可以由标准构建工具链编译，作为大型应用程序的一部分使用。请参考图\
  \ 9-8。\n\n![](img/main-123.png)\n\n图 9-8. 源码转换\n\n### 运算符重载\n\n运算符重载方法基本上是双对数方法的显式/隐式实现，其中对于每个感兴趣的原始操作都实现了相应的微分操作。用户使用原始操作实现损失函数，而梯度的计算通过调用实现微分操作的重载方法来完成。请参考图\
  \ 9-9。\n\n2x\n\n![](img/main-124.png)\n\n调用梯度函数计算\n\n![](img/main-125.png)\n\n运算符实现\n\
  \n调用损失函数计算\n\nX.\n\n![](img/main-126.png)\n\n平方操作\n\n![](img/main-127.png)\n\n图\
  \ 9-9. 运算符重载\n\n■ 注意，运算符重载方法的一个关键实现细节是：涉及的运算符是已经在现有库/核心语言中实现的，还是由自动微分工具提供自己的运算符。`autograd`\
  \ 是自动微分工具的一个示例，它重载了已有的 `numpy` 库，而 `ano` 则提供了自己的运算符，并为这些实现了相应的微分操作。\n\n## 使用 Autograd\
  \ 动手实践自动微分\n\n现在我们将使用一个名为 `Autograd` 的 Python 包进行自动微分的动手练习。`Autograd` 实现反向模式自动微分，并可以为任意\
  \ Python 和 Numpy 代码计算导数。\n\n列表 9-1. 为 `f (, x[2])=( + x2)²` 寻找梯度\n\n```python\n\
  # 对 Numpy 进行封装\nimport autograd.numpy as numpy\n# 生成梯度的函数\nfrom autograd import\
  \ grad\n# 定义函数\ndef f(x1, x2): return numpy.sqrt(x1 * x1 + x2)\n# 计算关于输入变量 x1 的梯度\n\
  g1_f = grad(f,0)\n# 计算关于输入变量 x2 的梯度\ng2_f = grad(f,1)\n# 计算并打印 x1=1, x2=2 处的函数值\n\
  f(1,2) # 输出 2.2\n# 计算并打印 x1=1, x2=2 处关于 x1 的梯度\ng1_f(1,2) # 输出 0.44\n# 计算并打印 x1=1,\
  \ x2=2 处关于 x2 的梯度\ng2_f(1,2) # 输出 0.89\n```\n\n让我们通过对本章一直使用的函数 `f(x1], x2)=( + x2)²`\
  \ 求梯度开始。`Autograd` 让这变得非常简单。列表 9-1 说明了这一点。`Autograd` 提供了一个工具函数来检查计算梯度的正确性。列表 9-2\
  \ 说明了这一点，特别是当我们计算涉及复杂损失函数的梯度时，这种检查是一个好主意。列表 9-2. 检查 `f (x1], x2])=( + x2)²` 的梯度\n\
  \n```python\nfrom autograd.util import quick_grad\n# 定义函数\ndef f(x1, x2): return\
  \ numpy.sqrt(x1 + x2)\n# 计算并检查给定值的梯度\nquick_grad_check(f,1.0,extra_args=[2.0]) #\
  \ 输出\n# 检查函数 f 在 x1=1.0 处的梯度\n# 数值梯度: 0.4472359409, 解析梯度: 0.447235955\n```\n\n列表\
  \ 9-3. 使用 Autograd 进行逻辑回归\n\n```python\nimport pylab\nimport sklearn.datasets\n\
  import autograd.numpy as np\nfrom autograd import grad\n# 生成数据\ntrain_X, train_y\
  \ = sklearn.datasets.make_moons(500, noise=0.1)\n# 定义逻辑回归的激活、预测和损失函数\ndef activation(x):\n\
  \    return 0.5*(np.tanh(x) + 1)\ndef predict(weights, inputs):\n    return activation(np.dot(inputs,\
  \ weights))\ndef loss(weights):\n    preds = predict(weights, train_X)\n    label_probabilities\
  \ = preds * train_y + (1 - preds) * (1 - train_y)\n    return -np.sum(np.log(label_probabilities))\n\
  # 计算损失函数的梯度\ngradient_loss = grad(loss)\n# 设置初始权重\nweights = np.array([1.0, 1.0])\n\
  # 梯度下降\nloss_values = []\nlearning_rate = 0.001\nfor i in range(100):\n    loss_values.append(loss(weights))\n\
  \    step = gradient_loss(weights)\n    weights -= step * learning_rate\n# 绘制决策边界\n\
  x_min, x_max = train_X[:, 0].min() - 0.5, train_X[:, 0].max() + 0.5\ny_min, y_max\
  \ = train_X[:, 1].min() - 0.5, train_X[:, 1].max() + 0.5\nx_mesh, y_mesh = np.meshgrid(np.arange(x_min,\
  \ x_max, 0.01), np.arange(y_min, y_max, 0.01))\nZ = predict(weights, np.c_[x_mesh.ravel(),\
  \ y_mesh.ravel()])\nZ = Z.reshape(x_mesh.shape)\ncs = pylab.contourf(x_mesh, y_mesh,\
  \ Z, cmap=pylab.cm.Spectral)\npylab.scatter(train_X[:, 0], train_X[:, 1], c=train_y,\
  \ cmap=pylab.cm.Spectral)\npylab.colorbar(cs)\n# 绘制每一步的损失\npylab.figure()\npylab.plot(loss_values)\n\
  pylab.xlabel(\"Steps\")\npylab.ylabel(\"Loss\")\npylab.show()\n```\n\n现在让我们为稍微复杂一点的逻辑回归损失函数计算梯度。我们还使用梯度下降来拟合模型。列表\
  \ 9-1 显示了相同的代码，图 9-10 和 9-11 显示了决策边界以及梯度下降步骤中的损失变化。\n\n![](img/main-128.jpg)\n\n\
  图 9-10. 逻辑回归的决策边界和训练数据\n\n![](img/main-129.jpg)\n\n图 9-11. 逻辑回归的损失\n\n## 总结\n\n\
  在本章中，我们涵盖了自动微分的基础，这在神经网络社区中通常被称为反向传播（backpropagation）。读者在本章中获得的关键点是：自动微分能够计算任意复杂损失函数的梯度，它是深度学习的关键性技术之一。读者还应该内化自动微分的概念，以及它与符号微分和数值微分的区别。\n\
  \n第 10 章\n\nGPU 简介\n\n![](img/main-130.png)\n\n\n\n\n\n本章将向读者介绍基于 GPU（图形处理器）的计算，这种计算在深度学习在各种应用领域的成功应用中发挥了并将继续发挥巨大作用。通常，深度学习从业者会使用如\
  \ `Keras` 或 `Theano` 等高级库，这些库会自动无缝地将要执行的计算翻译到 `CPU` 或 `GPU` 上。虽然在大多数情况下，深度学习从业者不需要理解\
  \ `GPU` 的内部工作原理（因为有很多高级库可用），但了解基础知识是至关重要的。\n\nGPU 计算的本质是单指令多数据流（SIMD）概念，即在多个数据点上（通过多个核心）并行执行相同的计算。这种计算范式非常适合密集型的线性代数运算。正如我们在前面的章节中看到的，训练深度学习模型的核心计算是梯度计算以及根据这些梯度更新参数。其核心是基础线性代数运算（点积、向量矩阵乘法等），而这种基于\
  \ GPU 的计算非常适合利用这些运算进行训练（和预测）。\n\n让我们从描述这种基于 GPU 计算的关键要素开始。图 10-1 示意性地插图了这些关键要素。\n\
  \n© Nikhil Ketkar 2017\n\nN. Ketkar, Deep Learning with Python, DOI 10.1007/978-1-4842-2766-4_10\n\
  \n![](img/main-131.jpg)\n\n#### 图 10-1. 基于 GPU 的计算\n\n需要注意以下几点：\n\n1. 与深度学习相关的计算涉及某些顺序执行的代码以及某些可以并行化的计算密集型代码。\n\
  2. 通常，顺序代码涉及从磁盘加载数据等，这些由 `CPU` 处理。\n3. 计算密集型代码通常涉及计算梯度和更新参数。用于此计算的数据首先被传输到 `GPU`\
  \ 内存中，然后在 `GPU` 上进行该计算。\n4. 接下来，结果被带回主内存以进行进一步的顺序处理。\n5. 可能会有多个此类计算密集型代码块与顺序代码交织在一起。\n\
  \n■ 注意，围绕 GPU 构建了两个主要的生态系统：一个是针对 NVIDIA 专用的 `Cuda`，另一个是厂商中性的 `openCL`。我们将在 `openCL`\
  \ 的背景下涵盖围绕 `Gpu` 计算的概念。\n\n让我们开始查看 `OpenCL` 描述的基于 GPU 计算的整体编程模型。`OpenCL` 是一个用于异构计算的厂商框架，涉及\
  \ `CPUs`、`GPUs`、`DSPs`（数字信号处理器）和 `FPGAs`（现场可编程门阵列）等。图 10-2 展示了系统的物理视图。\n\n![](img/main-132.png)\n\
  \n#### 图 10-2. OpenCL 系统物理视图\n\n![](img/main-133.png)\n\n需要注意以下几点：\n\n1. 整个系统由 `Host`（主机）和若干\
  \ `OpenCL` 设备组成。\n2. `host` 指运行 `OS` 的 `CPU`，它可以与多个 `OpenCL` 设备通信。\n3. `OpenCL`\
  \ 设备是异构的，例如，它们可能涉及 `CPUs`、`GPUs`、`DSPs`（数字信号处理器）和 `FPGAs`（现场可编程门阵列）等。\n4. `OpenCL`\
  \ 设备包含一个或多个计算单元。现在让我们查看图 10-3 中 `OpenCL` 系统的逻辑视图。\n\n![](img/main-134.png)\n\n####\
  \ 图 10-3. OpenCL 系统逻辑视图\n\n需要注意以下几点：\n\n1. 一个 `OpenCL` 程序运行在 `host` 上。\n2. `OpenCL`\
  \ 程序使用 `queues`（队列）与 `OpenCL` 设备通信。每个 `OpenCL` 设备都有一个独立的 `queue`。\n3. 每个 `OpenCL`\
  \ 设备在其内存中存放数据，这些数据是由运行在 `host` 上的程序发送给它的。\n4. 每个 `OpenCL` 设备运行由程序发送给它的代码，这些被称为 `kernel`（内核）。\n\
  5. `host` 程序、命令 `queues`、数据和 `kernels` 共同构成了一个 `execution context`（执行上下文）。\n6. `execution\
  \ context` 本质上是异构计算的逻辑封装。`host` 程序通过向 `OpenCL` 设备发送要执行的数据和代码，并获取结果来协调这种计算。\n\n现在让我们看一眼\
  \ `OpenCL` 设备上的逻辑内存布局。图 10-4 展示了这一点。\n\n| Global（全局内存） |\n| :--- |\n| Constant（常量内存）\
  \ |\n| Work Group（工作组） |\n| Local Memory（局部内存） |\n| Private Memory（私有内存） |\n| Work\
  \ Item（工作项） |\n\n#### 图 10-4. 设备内存\n\n需要注意以下几点：\n\n1. `OpenCL` 设备有一个 `global memory`（全局内存），`host`\
  \ 程序以及设备上所有运行的 `kernels` 都可以访问。\n2. `OpenCL` 设备有一个 `constant memory`（常量内存），它就像 `global\
  \ memory`，但对于执行中的 `kernel` 来说它是只读的。\n3. `Work Item`（工作项）是并的逻辑单元，它有自己的 `private memory`（私有内存）。只有对应此特定工作项的\
  \ `kernel` 代码感知此内存。\n4. `Work Group`（工作组）是同步的逻辑单元，它包含若干 `Work Items`。注意，任何同步操作只能在\
  \ `Work Group` 内部进行。\n5. 一个 `Work group` 有它自己的 `Local Memory`（局部内存），只能从 `Work Group`\
  \ 内部访问。\n\n现在让我们来看相对于 `OpenCL Device` 的编程模型（图 10-5）。\n\n| Global Identifier（全局索引）\
  \ | Count（计数） |\n| :--- | :--- |\n\n![](img/main-135.png)\n\n#### 图 10-5. 二维 NDRange\
  \ 索引空间\n\n| Workgroup（工作组） | Local Identifier, Sy（局部索引, Sy） |\n| :--- | :--- |\n\
  \n\n\n\n\n## 4. 工作项标识符可以是 1 维、2 维或 3 维的 (`NDRange`）。这基本上使得我们很容易为 1 维（时间序列）、2 维（图像）和\
  \ 3 维（体积数据）数据集编写内核（kernels）。\n\n现在让我们介绍一些允许我们描述索引的符号。假设索引是 2 维的，但同样的原理也适用于 1 维或\
  \ 3 维数据。我们用 `(G[x], G[y])` 表示全局索引空间。现在来看这个全局索引空间是如何分解为工作组（work groups）和工作项（work\
  \ items）的。为了方便起见，我们定义了偏移量 `(F[x], F[y])`，用于定义未划分工作项和工作组的索引部分。让 `(S[x], S[y])` 定义工作组的大小`(W[x],\
  \ W[y])` 定义工作组的数量。类似地，让 `(g[x], g[y])` 表示全局标识符，`(s[x], s[y])` 表示本地标识符，并让 `(w[x],\
  \ w[y])` 表示工作组标识符。那么，本地和全局标识符之间的关系描述为 `(g, g) = (w * S + s + F, w * S + s + F)`。\n\
  \n为给定的计算编写内核基本上涉及利用这种标识符机制以及内核在工作项和工作组上的并行调用来完成当前任务。列表 10-2 和 10-3 分别说明了向量加法和矩阵乘法的示例。列表\
  \ 10-1 仅仅打印 OpenCL 系统的细节，读者可以使用这些细节来确定他们系统的详细信息。\n\n### 列表 10-1. 获取 GPU 信息\n\n```python\n\
  import pyopencl as cl\n\nprint \"OpenCL Platforms and Devices\" for platform in\
  \ cl.get_platforms():\n    print \"Platform: \", platform.name, \" Vendor: \", platform.vendor,\
  \ \" Version: \", platform.version, \" Profile: \", platform.profile\n    for device\
  \ in platform.get_devices():\n        print(\"\\tDevice Name: \", device.name, \"\
  \\tDevice Type: \", cl.device_type.to_string(device.type), \"\\tMax Clock Speed:\
  \ \", \"{0} Mhz\".format(device.max_clock_frequency), \"\\tCompute Units: \", \"\
  {0}\".format(device.max_compute_units), \"\\tLocal Memory: \", \"{0:.0f} KB\".format(device.local_mem_size/1024.0),\
  \ \"\\tConstant Memory: \", \"{0:.0f} KB\".format(device.max_constant_buffer), \"\
  \\tGlobal Memory: \", \"{0:.0f} GB\".format(device.global_mem_size/(1024*1024*1024.0))\n\
  \n# OpenCL Platforms and Devices\n# Platform Name: Apple, Vendor: Apple, Version:\
  \ OpenCL 1.2 (Nov 18 2015 20:45:47), Profile: FULL\n# Device Name: Intel(R) Core(TM)\
  \ i7-7700HQ @ 2.20GHz, Type: CPU, Max Clock Speed: 2200 Mhz, Compute Units: 8, Local\
  \ Memory: 32 KB, Constant Memory: 64 KB, Global Memory: 16 GB\n# Device Name: Iris,\
  \ Type: GPU, Max Clock Speed: 1200 Mhz, Compute Units: 40, Local Memory: 64 KB,\
  \ Constant Memory: 64 KB, Global Memory: 2 GB\n```\n\n### 列表 10-2. 向量加法\n\n```python\n\
  import numpy as np\nimport pyopencl as cl\nimport time\n\nvector1 = np.random.random()\n\
  vector2 = np.random.random()\n# ... (代码省略，保持逻辑一致)\n# \"GPU Time\",\n_\n\n\n## of\
  \ of\n...norm(result_norm - cpu_result)\n\n# GPU Time 0.0020268108521\n# CPU Time\
  \ 0.009539756749\n# Norm of Difference 0.0\n```\n\n### 列表 10-3. 矩阵乘法\n\n```python\n\
  import numpy as np\nimport pyopencl as cl\nimport time\n\nmatrix1 = np.random.random((500,500)).astype(np.float32)\n\
  matrix2 = np.random.random((500,500)).astype(np.float32)\ncl_context = cl.create_some_context()\n\
  queue = cl.CommandQueue(cl_context)\nmf = cl.mem_flags\nmatrix1_in_gpu = cl.Buffer(cl_context,\
  \ mf.READ_ONLY | mf.HOST_PTR, hostbuf=matrix1)\nmatrix2_in_gpu = cl.Buffer(cl_context,\
  \ mf.READ_ONLY | mf.HOST_PTR, hostbuf=matrix2)\nresult_in_gpu = cl.Buffer(cl_context,\
  \ mf.WRITE_ONLY, matrix1.nbytes)\ncl_program = cl.Program(cl_context, \"\"\"\n__kernel\
  \ void product(int size, __global const float *matrix1, __global const float *matrix2,\
  \ __global float *result)\n{\n    int i = get_global_id(0);\n    int j = get_global_id(1);\
  \ \n    result[i + size * j] = 0;\n    for (int k = 0; k < size; k++)\n    {\n \
  \       result[i + size * j] += matrix1[k + size * i] * matrix2[j + size * k];\n\
  \    }\n}\n\"\"\").build()\n\nt0 = time.time()\ncl_program.product(queue, matrix1.shape,\
  \ None, np.int32(len(matrix1)), matrix1_in_gpu, matrix2_in_gpu, result_in_gpu)\n\
  t1 = time.time()\ngpu_time = t1 - t0\nprint \"GPU Time\", gpu_time\n\nresult_in_numpy\
  \ = np.empty_like(matrix1)\ncl.enqueue_copy(queue, result_in_numpy, result_in_gpu)\n\
  t0 = time.time()\ncpu_result = np.dot(matrix1, matrix2.T)\nt1 = time.time()\ncpu_time\
  \ = t1 - t0\nprint \"CPU Time\", cpu_time\nprint \"Norm of Difference\", np.linalg.norm(result_in_numpy)\n\
  ```\n\n\n\n## 总结\n\n在本章中，我们向读者介绍了基于 GPU 的计算，这是深度学习的关键推动之一。\n\n一个需要注意的关键点是，在本章中，我们使用\
  \ OpenCL 介绍了 GPU 计算的基础知识，它是厂商中立的。这些概念以微小的差异适用于其他特定厂商的库（如 CUDA）。建议读者在阅读 CUDA 文档的同时，尝试下一章节源代码列表中的示例。\n\
