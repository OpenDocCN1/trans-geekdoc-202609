  \ 0.99601177, 0.93707751]]\n```\n\n\n\n\n\n在接下来的列表 4-10（以及图 4-10 中对应的计算图）中，我们将构建一个逻辑回归模型。读者应该注意以下几：\n\
  \n* 1. 该示例生成了一些人工/玩具数据，拟合了一个逻辑回归模型，并计算训练前后的准确率。这是一个为了说明而设计的玩具数据集；由于数据是随机生成的，模型并没有进行泛化/学习。\n\
  * 2. 我们定义了一个函数来计算 L2 正则化，这在之前的列表 4-8 中介绍过。\n* 3. 我们生成了输入数据，由 1000 个维度为 100 的向量组成。基本上是\
  \ 1000 个具有 100 个特征的样本。\n* 4. 我们生成了随机的 0 和 1 目标/输出标签。\n* 5. 我们定义了涉及逻辑回归的表达式，涉及数据（表示为\
  \ `x`）、输出（表示为 `y`）、偏置项（表示为 `b`）和权重向量（表示为 `w`）。权重向量和偏置项是共享变量。\n* 6. 我们使用在列表 4-7 中介绍的二分类交叉熵来计算预测、误差和损失。\n\
  * 7. 定义这些表达式后，我们现在可以使用 Theano 中的 `grad` 结构（在列表 4-6 中引入）来计算梯度。\n* 8. 我们根据梯度函数定义了一个\
  \ `train` 函数。`train` 函数定义了输入、输出以及内部状态（共享变量）如何更新。\n* 9. `train` 函数被调用了 1000 步；在每一步中，都会在内部计算梯度并更新共享变量。\n\
  * 10. 使用 `sklearn.metrics` 在训练步骤之前之后计算准确率。\n\n### 列表 4-10. 逻辑回归\n\n```python\nimport\
  \ numpy\nimport theano\nimport theano.tensor as T\nimport sklearn.metrics\n\ndef\
  \ l2(x):\n    return T.sum(x**2)\n\nexamples = 1000\nD = (numpy.random.randn(examples,\
  \ features), numpy.random.randint(size=examples, low=0, high=2))\ntraining_steps\
  \ = 1000\n\nx = T.dmatrix(\"x\")\ny = T.dvector(\"y\")\nw = theano.shared(numpy.random.randn(features),\
  \ name=\"w\")\nb = theano.shared(0., name=\"b\")\np = 1 / (1 + T.exp(-T.dot(x, w)\
  \ - b))\nerror = T.nnet.binary_crossentropy(p,y)\nloss = error.mean() + 0.01 * l2(w)\n\
  prediction = p > 0.5\ngw, gb = T.grad(loss, [w, b])\n\ntrain = theano.function(inputs=[x,y],outputs=[p,\
  \ error], updates=((w, w - 0.1 * gw), (b, b - 0.1 * gb)))\npredict = theano.function(inputs=[x],\
  \ outputs=prediction)\n\nprint \"Accuracy before Training:\",sklearn.metrics.accuracy_score(D[1],\
  \ predict(D[0]))\nfor i in range(training_steps):\n    prediction, error = train(D[0],\
  \ D[1])\n    print \"Accuracy before Training:\",sklearn.metrics.accuracy_score(D[1],\
  \ predict(D[0]))\n\n# Accuracy before Training: 0.481\n# Accuracy before Training:\
  \ 0.629\n```\n\n\n\n| val=l .0 TensocType( float 64. scalar) ||  || w ||  || va\
  \ 1=0.0 TensorType(float64. scalar) ||  || b |\n| --- | --- | --- | --- | --- |\
  \ --- | --- | --- |\n\n在接下来的列表 4-11（以及图 4-11 中对应的计算图）中，我们将构建一个线性回归模型。读者应该注意以下几：\n\
  \n* 1. 该示例生成了一些人工/玩具数据，拟合了一个线性回归模型，并计算训练前后的准确率。这是一个为了说明而设计的玩具数据集，由于数据是随机生成的，模型并没有进行泛化/学习。\n\
  * 2. 我们定义了一个函数来计算 L2 正则化，这在之前的列表 4-8 中介绍过。\n* 3. 我们定义了一个平方误差的函数，这在列表 4-7 中介绍过。\n\
  * 4. 我们生成了输入数据，由 1000 个维度为 100 的向量组成。基本上是 1000 个具有 100 个特征的样本。\n* 5. 我们生成了 0 到 1\
  \ 之间的随机目标/输出标签。\n* 6. 我们定义了涉及线性回归的表达式，涉及数据（表示为 `x`）、输出（表示为 `y`）、偏置项（表示为 `b`）和权重向量（表示为\
  \ `w`）。权重向量和偏置项是共享变量。\n* 7. 我们使用介绍的平方误差来计算预测、误差和损失。\n* 8. 定义这些表达式后，我们现在可以使用 Theano\
  \ ( 4-6) 来计算梯度。\n* 9. 我们根据梯度函数定义了一个 `train` 函数。`train` 函数定义了输入、输出以及内部状态（共享变量）如何更新。\n\
  * 10. `train` 函数被调用了 1000 步；在每一步中，都会在内部计算梯度并更新共享变量。\n* 11. 使用 `sklearn.metrics`\
  \ 在训练步骤之前之后计算均方根误差 (RMSE)。\n\n\n```python\nimport numpy\nimport theano\nimport theano.tensor\
  \ as T\nimport sklearn.metrics\n\ndef l2(x):\n    return T.sum(x**2)\n\ndef squared_error(x,y):\n\
  \    return (x - y)**2\n\nexamples = 1000\nfeatures = 100\nD = (numpy.random.randn(examples,\
  \ features), numpy.random.randint(size=examples))\ntraining_steps = 1000\n\nx =\
  \ T.dmatrix(\"x\")\ny = T.dvector(\"y\")\nw = theano.shared(numpy.random.randn(features),\
  \ name=\"w\")\nb = theano.shared(0., name=\"b\")\np = 1 / (1 + T.exp(-T.dot(x, w)\
  \ - b))\nerror = squared_error(p,y)\nloss = error.mean() + 0.01 * l2(w)\ngw, gb\
  \ = T.grad(loss, [w, b])\n\ntrain = theano.function(inputs=[x,y],outputs=[p, error],\
  \ updates=((w, w - 0.1 * gw), (b, b - 0.1 * gb)))\npredict = theano.function(inputs=[x],\
  \ outputs=p)\n\nprint \"RMSE before training:\",sklearn.metrics.mean_squared_error(D[1],\
  \ predict(D[0]))\nfor i in range(training_steps):\n    prediction, error = train(D[0],\
  \ D[1])\n    print \"RMSE after training:\",sklearn.metrics.mean_squared_error(D[1],\
  \ predict(D[0]))\n\n# RMSE before training: 0.4707491496\n# RMSE after training:\
  \ 0.915701676631\n```\n\n![](img/main-33.jpg)\n\n图 4-11. 逻辑回归\n\n\n\n\n\n* 5. 我们定义了\
  \ 2 层神经网络的表达式，涉及数据（用 `x` 表示）、输出（用 `y` 表示）、第一层的偏置项（用 `b1` 表示）、第一层的权重向量（用 `w1` 表示）、第二层的偏置项（用\
  \ `b2` 表示）以及第二层的权重向量（用 `w2` 表示）。权重向量和偏置项是共享变量。\n* 6. 我们使用了代码列表 4-4 所示的 `tanh` 激活函数来对神经网络进行编码。\n\
  * 7. 我们使用了早些在代码列表 4-7 中介绍的二元交叉熵来来计算预测值、误差和损失。\n* 8. 在定义了这些表达式后，我们现在可以使用 Theano 中的\
  \ `grad` 结构（在代码列表 (4-6) 中引入）来计算梯度。\n* 9. 我们根据梯度函数定义了一个 `train` 函数。`train` 函数定义了输入、输出以及内部状态（共享变量）的更新方式。\n\
  * 10. `train` 函数被调用了 1000 次；在每一步中，内部都会计算梯度并更新共享变量。\n* 11. 准确率在训练步骤之前之后均使用 `sklearn.metrics`\
  \ 计算。\n\n### 代码列表 4-12. 神经网络\n\n```python\nimport numpy\nimport theano\nimport theano.tensor\
  \ as T\nimport sklearn.metrics\n\ndef l2(x):\n    return T.sum(x**2)\n\nexamples\
  \ = 1000\nfeatures = 100\nhidden = 10\nD = (numpy.random.randn(examples, features),\
  \ numpy.random.randint(size=examples, low=0, high=2))\ntraining_steps = 1000\n\n\
  x = T.dmatrix(\"x\")\ny = T.dvector(\"y\")\nw1 = theano.shared(numpy.random.randn(features,\
  \ hidden), name=\"w1\")\nb1 = theano.shared(numpy.zeros(hidden), name=\"b1\")\n\
  w2 = theano.shared(numpy.random.randn(hidden, name), name=\"w2\")\nb2 = theano.shared(0.,\
  \ name=\"b2\")\n\np1 = T.tanh(T.dot(x, w1) + b1)\np2 = T.tanh(T.dot(p1, w2) + b2)\n\
  prediction = p2 > 0.5\nerror = T.nnet.binary_crossentropy(p2,y)\nloss = error.mean()\
  \ + 0.01 * (l2(w1) + l2(w2))\ngw1, gb1, gw2, gb2 = T.grad(loss, [w1, b1, w2, b2])\n\
  \ntrain = theano.function(inputs=[x,y],outputs=[p2, error], updates=((w1, w1 - 0.1\
  \ * gw1), (b1, b1 - 0.1 * gb1), (w2, w2 - 0.1 * gw2), (b2, b2 - 0.1 * gb2)))\npredict\
  \ = theano.function(inputs=[x], outputs=[prediction])\n\nprint \"Accuracy before\
  \ Training:\", sklearn.metrics.accuracy_score(D[1], numpy.array(predict(D[0])).ravel())\n\
  \nfor i in range(training_steps):\n    prediction, error = train(D[0], D[1])\n \
  \   print \"Accuracy after Training:\", sklearn.metrics.accuracy_score(D[1], numpy.array(predict(D[0])).ravel())\n\
  # Accuracy before Training: 0.51\n# Accuracy after Training: 0.716\n```\n\n![](img/main-34.jpg)\n\
  图 4-12. 神经网络\n\n在接下来的示例代码列表 4-13（以及对应的图 4-13 (a)、4-13 (b) 和 4-13 (c)）中，我们将使用 `if-else`\
  \ 和 `switch` 结构定义一个函数。读者应该注意以下点：\n* 1. 某些函数在求值时需要 `if-else`（或 `switch`）子句。对于这些情况，Theano\
  \ 提供了 `if-else` 和 `switch` 结构。\n* 2. 使用 `if-else` 和 `switch` 结构定义表达式和函数，并像其他表达式/结构一样生成梯度。\n\
  * 3. 在示例中，我们演示了使用 `if-else` 和 `switch` 结构计算合页损失（hinge loss），并验证它与使用 `max` 定义的一致。\n\
  \n### 代码列表 4-13. Switch/If-Else\n\n```python\nimport numpy\nimport theano\nimport\
  \ theano.tensor as T\nfrom theano.ifelse import ifelse\n\ndef hinge_a(x,y): \n \
  \   return T.max([0 * x, 1-x*y])\n\ndef hinge_b(x,y):\n    return ifelse(T.lt(1-x*y,0),\
  \ 0 * x, 1-x*y)\n\ndef hinge_c(x,y):\n    return T.switch(T.lt(1-x*y,0), 0 * x,\
  \ 1-x*y)\n\nx = T.scalar('x')\ny = T.scalar('y')\nz1 = hinge_a(x,y)\nz2 = hinge_b(x,y)\n\
  z3 = hinge_c(x,y)\n\nf1 = theano.function(inputs=[x,y], outputs=[z1])\nf2 = theano.function(inputs=[x,y],\
  \ outputs=[z2])\nf3 = theano.function(inputs=[x,y], outputs=[z3])\n\nprint f1(2,1)\n\
  print f2(2,1)\nprint f3(2,1)\n```\n\n\n\n\n\n卷积神经网络（CNNs）本质上是采用卷积操作（而不是全连接层）作为其层之一的神经网络。CNN\
  \ 是一项极其成功的技术，已应用于那些预测输入数据具有已知网格状拓扑结构的问题，例如时间序列（1-D 网格）或图像（2-D 网格）。\n\n## 卷积操作\n\n\
  让我们开始建立对一维卷积操作的直观理解。给定输入 `I(t)` 和卷积核 `K(a)`，卷积操作定义为：\n\n```\ns(f) = ^f (a) • K(t\
  \ - a)\n```\n\n考虑到卷积操作的交换性，该操作的等效形式如下：\n\n```\ns(t) = ^I(t - a) • K(a)\n```\n\n\
  此外，可以将负号（翻转）替换以得到互相关，其定义如下：\n\n```\ns(t) = ^I(t+a) • K(a)\n```\n\n© Nikhil Ketkar\
  \ 2017\nN. Ketkar, *Deep Learning with Python*, DOI 10.1007/978-1-4842-2766-4_5\n\
  \n在深度学习文献和软件实现中，卷积和互相关是通用的。该操作的本质是，卷积核相对于输入是一组短得多的数据点，当输入与卷积核相似时，卷积操作的输出较高。图 5-1\
  \ 和 5-2 解释了这一核心思想。我们取任意输入和任意卷积核，执行卷积操作，当卷积核与输入的某部分相似时，将获得最大值。\n\n![](img/main-40.jpg)\n\
  图 5-1. 卷积操作 - 直观理解\n\n![](img/main-41.jpg)\n图 5-2. 卷积操作 - 一维\n\n通过观察图 5-1 和 5-2\
  \ 并注意以下几点，加强对卷积的直观理解：\n\n1. 输入是任意的大型数据集。\n2. 卷积核是数量少于输入的数据集。\n3. 从某种意义上说，卷积操作是将卷积核在输入上滑动，并计算卷积核与输入某部分的相似程度。\n\
  4. 卷积操作在卷积核与输入某部分最相似产生最高值。\n\n卷积操作可以扩展到二维。给定输入 `I(m, n)` 和卷积核 `K(a, b)`，卷积操作定义为：\n\
  \n```\ns (t ) = -£^i (a ,b) • K(m - a, n - b)\n```\n\n考虑到卷积操作的交换性，该操作的等效形式如下：\n\n\
  ```\ns(t) = ££l(m - a,n - b) • K(a, b)\n```\n\n此外，可以将负号（翻转）替换以得到互相关，其定义如下：\n\n```\n\
  s(t) = ££l(m + a,n+b) • K(a, b)\n```\n\n图 5-3 展示了二维卷积操作。请注意，这仅仅是将卷积的概念扩展到二维。\n\n\
  ![](img/main-42.jpg)\n\n在介绍卷积操作后，我们现在可以深入研究 CNN 的关键组成部分，即使用卷积层代替涉及矩阵乘法的全连接层。因此，全连接层可以描述为\
  \ `y = f (x ■ w)`，其中 `x` 是输入向量，`y` 是输出向量，`w` 组权重，`f` 是激活函数。相应地，卷积层可以描述为 `y = f (s(x\
  \ ■ w))`，其中 `s` 表示输入与权重之间的卷积操作。\n\n现在让我们对比全连接层和卷积层。图 5-4 展示了全连接层，图 5-5 示意地展示了卷积层。图\
  \ 5-6 展示了卷积层中的参数共享以及全连接层中缺乏共享。应注意以下几点：\n\n1. 对于相同的输入和输出数量，全连接层的连接数和相应的权重要远多于卷积层。\n\
  2. 与全连接层中的许多交互相比，卷积层中产生输出的输入交互较少。这被称为稀疏交互。\n3. 参数/权重在卷积层中是共享的，因为卷积核远小于输入，且卷积核在输入上滑动。因此，卷积层中的唯一参数/权重要少得多。\n\
  \n![](img/main-43.jpg)![](img/main-44.jpg)![](img/main-45.jpg)\n图 5-4. 全连接层中的密集交互\n\
  \n![](img/main-46.jpg)!(main-47.jpg)\n图 5-6. 参数共享与绑定权重\n\n## 池化操作\n\n现在让我们看看 CNN\
  \ 中几乎总是使用的池化操作。池化操作背后的直观原理是特征的精确位置并不重要。图 5-7 展示了二维输入的池化操作。注意以下几点：\n\n1. 池化在输入上操作，并应用函数\
  \ `f` 以产生输出。\n2. 函数 `f` 通常是最大值操作（最大池化），但其他变体如平均值或 `L2` 范数也可以。\n3. 对于二维输入，它是矩形的。\n\
  4. 池化结果产生的输出在维度上比输入小得多。\n\n![](img/main-48.jpg)\n\n现在让我们看看 CNN 中几乎总是结合卷积使用的池化操作。让我们看看之前涵盖的所有操作是如何协同工作的。参考图\
  \ 5-8 和图 5-9。检测阶段简单来说是非线性激活。\n\n1. 卷积、检测和池化操作顺序执行，将输入转换为输出。输出被称为特征图。\n2. 输出通常传递到其他层（卷积或全连接）。\n\
  3. 多个卷积-检测-池化块可以并行应用，消耗相同的输入并产生多个输出或特征图。\n\n![](img/main-49.jpg)\n图 5-8. 卷积后的检测阶段和池化\n\
  \n![](img/main-50.jpg)\n图 5-9. 多个滤波器/卷积核产生多个特征图\n\n对于包含 3 个通道的图像输入，会对每个通道分别应用卷积操作，然后将卷积后的输出相加。这在图\
  \ 5-10 中所示。\n\n![](img/main-51.jpg)\n图 5-10. 多通道卷积\n\n在涵盖了 CNN 的组成元素后，我们现在可以从整体上查看图\
  \ 5-11 所示的示例 CNN。该 CNN 由两个阶段的卷积-检测-池化块组成，每个阶段的多个滤波器/卷积核产生多个特征图。在这两个阶段之后，我们有一个全连接层产生输出。通常，CNN\
  \ 可能具有多个阶段的卷积-检测-池化块（采用多个滤波器），随后通常接一个全连接层。\n\n![](img/main-52.jpg)\n\n\n\n\n图 5-11.\
  \ 完整的卷积神经网络架构\n\n## 卷积变体\n\n我们现在介绍卷积的一些变体，如图 5-12 所示。步长卷积（Strided convolution）是标准卷积的一种变体，其内核通过定义的步长在输入上滑动。这种现象的另一种理解是：标准卷积的步长大小等于\
  \ 1。另一种变体是分块卷积（tiled convolution），即实际上有多个内核交替与输入进行卷积。\n\n![](img/main-53.jpg)\n\n\
  图 5-12. 卷积，主题的变体\n\n另一种变体是局部连接层（locally connected layers），它基本上利用了交互的稀疏性，但不采用权重共享。如图\
  \ 13 所示。\n\n局部连接唯一权重![](img/main-54.jpg)[](main-55.jpg)[](main-56.jpg)[](main-57.jpg)\n\
  \n图 13. 局部连接权重![](img/main-58.jpg)\n\n## CNN 背后的直觉\n\n到本章为止，我们已经涵盖了 CNN 背后的关键组成部分，即卷积操作、池化操作以及它们如何结合使用。现在，让我们后退一步，利用这些构建块来内化\
  \ CNN 背后的直觉。\n\n要考虑的第一个想法是 CNN 的能力（请参考第[2](http://dx.doi.org/10.1007/978-1842-2766_2)\
  \ 章关于机器学习能力的介绍）。CNN 用卷积操作替换了至少一个全连接层，其能力少于全连接网络。也就是说，某些数据集全连接网络能够建模而 CNN 无法建模。因此，需要注意的第一点是：CNN\
  \ 通过限制能力来实现更大的目标，从而使训练变得高效。\n\n第二个要考虑的想法是，学习滤波器在某种意义是表示学习。例如，学习到的滤波器可能会学会检测边缘、形状等。这里需要考虑的重要点是，我们并不是在手动描述要从输入中提取的特征，而是描述了一种学习如何构建表示的架构。\n\
  \n第三个要考虑的想法是池化操作引入的平不变性（location invariance）。池化操作将特征的位置与特征被检测到的事实分离开来。检测直线的滤波器可能会在图像的任何部分检测到它，但池化操作提取的是特征被检测到的这一事实（最大池化）。\n\
  \n第四个想法是层次结构。一个 CNN 可能包含多个堆叠的卷积和池化层，随后跟一个全连接网络。这允许 CNN 构建一个概念层次结构，其中抽象概念基于更简单的概念（请参考第[1](http://dx.doi.org/10.1007/978-1842-2766_1)\
  \ 章）。\n\n第五也是最后一个想法是在系列卷积和池化层末尾存在一个全连接层。其想法是：系列卷积和池化层生成特征，而标准的神经网络学习最终分类/回归函数。将\
  \ CNN 的这一方面与传统机器学习区分来来重要的。在传统机器学习中，专家会手动设计特征并将其输入神经网络。在 CNN 的情况下，这些特征/表示是从数据中学习的。\n\
  \n## 总结\n\n在本章中，我们涵盖了 CNN 的基础。核心要点是卷积操作、池化操作、它们如何结合使用，以及特征如何不是手动设计而是被学习的。CNN 是深度学习最成功的应用，体现了学习特征/表示而非手动设计的思想。\n\
  \n# 第 6 章 递归神经网络\n\n![](img/main-59.png)\n\n递归神经网络（RNNs）本质上是采用递归的神经网络，这基本上是使用来自神经网络上一次前向传播的信息。从本质上，所有\
  \ RNN 都可以描述为一种递归关系。当应用于预测输入数据为序列形式（顺序重要的实体序列）的问题时，RNN 是非常合适且已取得巨大成功的。\n\n## RNN\
  \ 基础\n\n让我们从描述 RNN 的组成部分开始。首先，我们引入一些符号。\n\n1. 我们假设输入由实体序列 `x(1), x2..., xT` 组成。\n\
  2. 对应于此输入，我们需要产生序列 `y(1), y2, ..., yT`，或者为整个输入序列产生一个输出 `y`。\n3. 为了区分 RNN 产生的内容和理想上预期的内容，我们将用\
  \ `y(1), y(2), y(t)` 或 `y` 表示 RNN 产生的输出。\n\n注意，这与 RNN 理想上应该产生的不同，后者由 `y(1), y(2),\
  \ y(T)` 或 `y` 表示。\n\nRNN 要么为输入序列中的每个实体产生一个输出，要么为整个序列产生一个单一输出。让我们考虑 RNN 为输入中的每个实体产生一个输出的情况。RNN\
  \ 可以以下方程描述：\n\n```\nh(t) = tanh(U*x(t) + W*h(t-1) + b)\n```\n\n关于 RNN 方程的以下几点应当注意：\n\
  \n1. RNN 的计算涉及首先计算序列中某个实体的隐藏状态。这表示为 `h(t)`。\n2. `h(t)` 的计算使用了实体 `x(t)` 处的对应输入和上一个隐藏状态\
  \ `h(t-1)`。\n3. 输出 `y(t)` 使用隐藏状态 `h(t)` 计算。\n4. 在计算当前隐藏状态时，与输入和之前的隐藏状态相关的权重。分别表示为\
  \ `U` 和 `W`。还有一个偏置项 `b`。© Nikhil Ketkar 2017 DOI 10.1007/978-1842-2766_4\n\n5. 在计算输出时，与隐藏状态相关的权重；这表示为\
  \ `V`。还有一个偏置项 `c`。\n6. 早期章节介绍的 `tanh` 激活函数用于计算隐藏状态。\n7. `softmax` 激活函数用于计算输出。\n\
  8. 方程描述的 RNN 可以处理任意长度的序列。\n9. RNN 的参数（即 `U`、`W`、`V`、`b`、`c` 等）在序列中每个实体的隐藏层和输出计算中共享。\n\
  \n图 6-1 展示了一个 RNN。注意图中如何描述带有状态自循环的递归关系。\n\n![](img/main-60.jpg)\n\n图 6-1. RNN（使用上一个隐藏状态的递归）\n\
  \n该图还描绘了与每个输出相关的损失函数。当我们涵盖如何训练 RNN 时，会回到它。\n\n目前，内化 RNN 如何与我们之前看到的前馈神经网络（包括卷积网络）不同至关重要。区别在于隐藏状态，它代表了过去看到的实体的总结（对于同一序列）。\n\
  \n暂时忽略如何训练 RNN，读者应该很清楚训练好的 RNN 如何使用。对于给定的输入序列，RNN 将为输入中的每个实体产生一个输出。\n\n现在让我们考虑 RNN\
  \ 的一种变体，即不再使用隐藏状态进行递归，而是使用上一个状态产生的输出进行递归（参见图 6-2）。\n\n![](img/main-61.jpg)\n\n图\
  \ 6-2. RNN（使用上一个输出的递归）\n\n描述此类 RNN 的方程如下：\n\n\n\n\n\n```\nh^((t) > \\= tanh (UX^((t)\\\
  > \\+ Wy^(G-1)) + b)\n```\n\n![](img/main-62.jpg)\n\n需要注意以下几：\n\n* 1. RNN 计算涉及首先计算序列中某个实体的隐藏状态。这表示为\
  \ `h^(^t^)`。\n* 2. `h^(^t^)` 的计算使用了实体 `x^(^t^)` 处的对应输入以及上一个输出 `y((-1))`。\n* 3. 输出\
  \ `y` 是使用隐藏状态 `h®` 计算的。\n* 4. 在计算当前隐藏状态时，有与输入和上一个输出相关的权重。它们分别表示为 `U` 和 `W`。还有一个表示为\
  \ `c` 的偏置项。\n* 5. 在计算输出时，有与隐藏状态相关的权重；这表示为 `V`。还有一个表示为 `c` 的偏置项。\n* 6. 隐藏状态的计算使用了\
  \ `tanh` 激活函数（在前面的章节介绍）。\n\n输出的计算使用了 `softmax` 激活函数。\n\n现在让我们考虑 RNN 的一种变化，即整个序列仅产生一个输出（参见图\
  \ 6-3）。这种 RNN 使用以下方程描述：\n\n```\nh^) \\= tanh(Ux^((()^) \\+ Wy'^(^,^(\\-1)) + b)\n\
  ```\n\n![](img/main-63.jpg)![](img/main-64.jpg)\n\n图 6-3. RNN（为整个输入序列产生单个输出）\n\n\
  需要注意以下几点：\n\n* 1. RNN 计算涉及计算序列中某个实体的隐藏状态。这表示为 `h^(^t^)`。\n* 2. `h^(^t^)` 的计算使用了实体\
  \ `x^(^t^)` 处的对应输入以及上一个隐藏状态 `h^(^t ^(\\-1))`。\n* 3. `h^(^t^)` 的计算针对输入序列 `xW x^((2))\
  \ ... X^T` 中的每个实体分别完成。\n* 4. 输出 `y` 仅使用最后一个隐藏状态计算。\n* 5. 在计算当前隐藏状态时，有与输入和上一个隐藏状态相关的权重。它们分别表示为\
  \ `U` 和 `W`。还有一个表示为 `b` 的偏置项。\n* 6. 在计算输出时，有与隐藏状态相关的权重；这表示为 `V`。还有一个表示为 `c` 的偏置项。\n\
  * 7. 隐藏状态的计算使用了 `tanh` 激活函数（在前面的章节介绍）。\n* 8. 输出的计算使用了 `softmax` 激活函数。\n\n## 训练 RNN\n\
  \n现在让我们 RNN 是如何训练的。为了这一点，我们首先需要查看展开 RNN 核心的递归关系后它看起来是什么样的。\n\n```\nL\n```\n\n![](img/main-65.jpg)\n\
  \n```\nO^¹’ □«^((2>) n»^(<3)) c«^(<4)\\>\n```\n\n![](img/main-66.jpg)![](img/main-67.jpg)![](img/main-68.jpg)![](img/main-69.jpg)\n\
  \n图 6-4. 对应于图 6-1 的 RNN 展开\n\n展开对应于 RNN 的递归关系只需通过递归替换递归关系定义的值来写出方程。对于图 6-1 中的 RNN，该值是\
  \ `h^(^t^)`。也就是说，`h^(^t^)` 的值根据 `h^(^t^(\\-1))` 定义，而后者又根据 `h^(^t ^(\\-2))` 定义，以此类推，直到\
  \ `h((0))`。\n\n![](img/main-70.jpg)![](img/main-71.jpg)\n\n我们假设 `h((0))` 要么由用户预定义、设置为零，或者作为另一个参数/权重被学习（类似于\
  \ `W`、`V` 或 `b` 的学习）。展开仅意味着用 `h((0))` 写出描述 RNN 的方程。当然，为了这样做，我们需要固定序列长度，表示为 `t`。图\
  \ 6-4 展示了对应于图 6-1 中 RNN 在假设输入序列大小为 4 时的展开 RNN。同样，图 6-5 和 6-6 分别展示了对应于图 6-2 和 6-3\
  \ 中 RNN 的展开 RNN。需要注意以下几点：\n\n* 1. 展开过程基于输入序列长度预先已知并根据递归展开的假设。\n* 2. 一旦展开，我们本质上就有一个非循环神经网络。\n\
  * 3. 需要学习的参数为 `U`、`V`、`b`、`c`。\n* 4. 给定大小为 4 的输入序列，图 6-4、6-5 和 6-6 展示了展开 RNN。\n\n\
  ## 双向 RNN\n\n现在让我们 RNN 的另一种变体，即双向 RNN。双向 RNN 的核心直觉是使用序列中后方的实体来对当前实体进行预测。\n\n双向 RNN\
  \ 可以使用以下方程描述：\n\n```\nh^([f]^t^)\\=tanh[(]U[f]x^(^t^)+W[f]h^(^t^(+1))+b[f] [)]\n\
  \nh[b]^(^t^) =tanh[(]U[b]x^(^t^)+W[b]h^(^t^(\\-1))+b[b] [)]\n\ny ^v^) = softmax\
  \ ((^) + V[f]hf^) + c )\n```\n\n\n\n\n\n1. RNN 的计算首先涉及计算序列中实体的正向隐藏状态和反向隐藏状态。它们分别表示为\
  \ `hf` 和 `hb`。\n\n2. `hf` 的计算使用了实体 `x^(t)` 处的对应输入以及上一个隐藏状态 `hf`。\n\n3. `hb` 的计算使用了实体\
  \ `x^(t)` 处的对应输入以及上一个隐藏状态 `hb`。\n\n4. 输出 `y^(t)` 使用隐藏状态 `h(t)` 和 `hb` 计算得出。\n\n\
  5. 在计算当前隐藏状态时，存在与输入和上一个隐藏状态相关的权重。它们分别表示为 `U[f]`、`W[f]`、`U[b]` 和 `W[b]`。还有一个表示为 `b[f]`\
  \ 和 `b[b]` 的偏置项。\n\n6. 在计算输出时，存在与隐藏状态相关的权重；表示为 `V[b]` 和 `V[f]`。还有一个表示为 `c` 的偏置项。\n\
  \n7. 隐藏状态的计算使用了（在前面的章节中介绍过的）`tanh` 激活函数。\n\n8. 输出的计算使用了 `softmax` 激活函数。\n\n9. 公式所示\
  \ RNN 可以处理任意长度的序列。\n\n10. RNN 的参数，即 `U[f]`、`U[b]`、`W[f]`、`W[b]`、`V[b]`、`V[f]`、`b[f]`、`b[b]`、`c`\
  \ 等在隐藏层和输出值的计算过程中是共享的（对于序列中的每个实体）。\n\n![](img/main-74.jpg) 图 6-9. 双向 RNN\n\n## 梯度爆炸与消失\n\
  \n训练 RNN 面临梯度消失和爆炸的挑战。梯度消失意味着，在对展开展开的 RNN 上计算梯度时，梯度的值可能会下降到一个非常小的值（接近于 0）。同样地，梯度可能会增加到一个非常大的值，这被称为梯度爆炸问题。在这两种情况下，训练\
  \ RNN 都是一项挑战。\n\n让我们来看描述 RNN 的公式。\n\n```\nh^(t) = tanh[Ux^(t) + Wh^(t-1) + b]\n\
  y^(v) = softmax(h^(v) + c)\n```\n\n让我们通过应用链式法则推导 `dL` 的表达式。这如图 6-10 所示。\n\n```\n\
  dL = [z_k<t || dh^(i)]\n```\n\n现在我们关注表达式中的 `dh^(i)` 部分，它涉及对 `W` 的重复矩阵乘法，这导致了梯度消失和梯度爆炸问题。直观上，这类似于反复相乘一个实数，可能会导致乘积缩小到零或爆炸到无穷大。\n\
  \n## 梯度裁剪\n\n处理梯度爆炸的一种简单技术是每当梯度的范数超过用户定义的阈值时，对其进行重新缩放。具体来说，如果梯度表示为 `g` 且 `g > c`，则我们设置\
  \ `g = c`。这种方法既简单又具有计算效率，但确实引入了一个额外的超参数。\n\n![](img/main-75.jpg) 图 6-10. 梯度消失与爆炸\n\
  \n## 长短期记忆\n\n现在让我们来看 RNN 的另一种变体，即长短期记忆（LSTM）网络。LSTM 可以用以下一组方程来描述。注意，符号 `·` 表示两个向量的点点相乘（如果\
  \ `a = [1,1,2]` 且 `b = [0.5,0.5,0.5]`，那么 `ab = [0.5,0.5,1]`），函数 `c`、`g` 和 `h` 是非线性激活函数，所有的\
  \ `W` 和 `R` 都是权重矩阵，所有的 `b` 项都是偏置项。\n\n```\nZ^(t) = g(z^(t) + R·y^(t) + bz)\ni^(t)\
  \ = s(w[t]x^(t) + R[t]y^(t-1) + p[t]c^(t-1) + b[t])\nf^(t) = s(w[f]x^(t) + R[f]w^(t-1)\
  \ + p[f]c^(t-1) + b[f])\nc^(t) = i^(t)·z^(t) + f^(t)·c^(t-1))\no^(t) = s(x^(t) +\
  \ R[o]y^(t-1) + p[o]c^(t) + b[o])\ny^(t) = o^(t)·h(t)\n```\n\n需要注意以下几点：\n\n1. LSTM\
  \ 最重要的元素是表示为 `c^(t)` 的单元状态 `c^(t) = i^(t)·z^(t) + f^(t)·c^(t-1))`\n2. `y^(t) = o^(t)·h(t)`\n\
  3. `z^(t)`\n4. `i^(t)`\n5. `f^(t)`\n6. `c^(t)`\n\n![](img/main-76.jpg) 图 6-11. 长记忆\n\
  \n## 总结\n\n在本章中，我们涵盖了循环神经网络（RNN）的基础知识。本章的核心要点是隐藏状态、通过展开训练 RNN、梯度消失和爆炸问题以及长期记忆网络。理解\
  \ RNN 如何包含状态是非常重要的。\n\n# 第 7 章 Keras 简介\n\n![](img/main-77.png)\n\n本章向读者介绍 Keras，它是一个为构建深度学习网络提供强大且抽象构建块的库。Keras\
  \ 提供的构建块是使用 Theano（前面介绍过）以及 TensorFlow 构建的。Keras 支持 CPU 和 GPU 计算，是快速原型设计的极佳工具。\n\
  \n我们将介绍 Keras 提供的一些关键构建块，然后使用 Keras 构建 CNN 和 LSTM。\n\n让我们从一个简单的单层神经网络开始。需要注意以下几点：\n\
  \n1. 模型使用 `Sequential` 构造定义，它允许用户添加层。\n2. 使用此功能，用户可以添加一个或多个层并构建网络。`Dense` 层基本上是全连接层，我们之前见过。\n\
  3. 在定义第一层时，需要指定输入和输出维度。\n4. 在此层之后，我们添加了激活函数，在这种情况下是 sigmoid。\n5. 模型定义后需要显式编译，此时我们提供损失函数、优化算法以及我们想要计算的其他指标。\n\
  6. 需要根据当前任务选择合适的损失函数；在这种情况下，由于我们面对的是二分类问题，我们选择了二分类交叉熵。\n7. 需要选择合适的优化算法，通常是随机梯度下降的变体（在随后的章节中介绍）。\n\
  8. 编译后，我们可以提供数据来拟合模型并评估模型。\n\n© Nikhil Ketkar 2017\n\n\n\n\nN. Ketkar, Deep Learning\
