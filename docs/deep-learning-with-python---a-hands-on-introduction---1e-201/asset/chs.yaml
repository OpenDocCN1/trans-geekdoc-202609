  \ (i^(\\-) ^f (^xi^(,q)) i\\=1`\n\n这引导我们得到下面的二分类交叉熵函数：\n\n`^(\\-)E yi ^(lo)g^f (^xi\
  \ ^,^q)^+(^(1 -) yi )^(lo)g (^(\\-) ^f (^xi^(,q)) i\\=1`\n\n极大似然性允许我们推导出二分类交叉熵函数，该函数可以在二分类背景下作为损失函数使用。\n\
  \n### 交叉熵\n\n在二分类交叉熵的基础上，我们现在考虑推导用于多分类背景的交叉熵损失函数。具体来说，我们将看到深度学习中常用的损失函数（如二分类交叉熵、交叉熵和平方误差）是如何通过极大似然原理推出来的。\n\
  \n\n\n\n### 线性单元 (Linear Unit)\n线性单元是最简单的单元，它将输入转换为 `y=w.x+b`。正如其名称所示，该单元没有非线性行为，通常用于生成条件高斯分布的均值。线性单元使得基于梯度的学习成为一项非常简单的任务。\n\
  \n### Sigmoid 单元 (Sigmoid Unit)\nSigmoid 单元按如下方式转换：\n\n`[y] = 1 ^y = 1 \\+ e`\n\n\
  底层的激活函数（参考图 3-6）给出：\n\n```\nf(x)=\n```\n\nSigmoid 单元可以结合二元交叉熵用于二分类问题。该单元的输出可以对对给定\
  \ `x` 的输出 `y` 的伯努利分布。\n\n\n### Softmax 层 (Softmax Layer)\nSoftmax 层通常与交叉熵损失函数一起用作多分类任务的输出层。参考图\
  \ 3-7。Softmax 层归一化上一层的输出，使其和为 1。通常情况下，上一层的单元建模了输入属于特定类的未归一化得分。Softmax 层对这些得分进行归一化，使得输出代表每个类的概率。\n\
  \n\n### 修正后的线性单元 (ReLU)\n修正后的线性单元结合线性变换，将输入转换为：\n\n```\nf(x)=max(0,wx +b).\n```\n\
  \n底层的激活函数是 `f(x)=max(0,x)`；参考图 3-8。在最近，ReLU 单元更多地用作隐藏单元。结果显示，ReLU 单元会导致大且一致的梯度，有助于基于梯度的学习。\n\
  \n\n### 双曲正切 (Hyperbolic Tangent)\n双曲正切单元（结合线性变换使用）按如下方式转换：\n\n```\ny = tanh(wx\
  \ + b).\n```\n\n底层的激活函数（参考图 3-9）给出：\n\n```\nf(x)= tanh(x ).\n```\n\n双曲正切单元也常用作隐藏单元。\n\
  \n\n列表 3-1. 用于回归的 2 层神经网络\n\n```python\nimport autograd.numpy as np\nimport autograd.numpy.random\
  \ as npr from autograd import grad import sklearn.metrics\nimport pylab\n\n## 生成数据集示例\n\
  examples = 1000\nfeatures = 100\nD = (npr.randn(examples, features), npr.randn(examples))\n\
  \n## 指定网络层\nlayer1_units = 10\nlayer2_units = 1\nw1 = npr.rand(features, layer1_units)\n\
  b1 = npr.rand(layer1_units)\nw2 = npr.rand(layer1_units, layer2_units)\nb2 = 0.0\n\
  theta = (w1, b1, w2, b2)\n\n## 定义损失函数\ndef squared_loss(y, y_hat):\n    return np.dot((y\
  \ - y_hat),(y - y_hat))\n\n## 输出层\ndef binary_cross_entropy(y, y_hat):\n    return\
  \ np.sum(-((y * np.log(y_hat)) + ((1-y) * np.log(1 - y_hat)))) # 神经网络的封装\ndef neural_network(x,\
  \ theta):\n    w1, b1, w2, b2 = theta\n    return np.tanh(np.dot((np.dot(x,w1) +\
  \ b1)), w2) + b2)\n\n## 待优化的目标函数的封装\ndef objective(theta, idx):\n    return squared_loss(D[1][idx],\
  \ neural_network(D[0][idx], theta))\n\n## 更新\ndef update_theta(theta, delta, alpha):\n\
  \    w1, b1, w2, b2 = theta\n    w1_delta, b1_delta, w2_delta, b2_delta = delta\n\
  \    w1_new = w1 - alpha * w1_delta\n    b1_new = b1 - alpha * b1_delta\n    w2_new\
  \ = w2 - alpha * w2_delta\n    b2_new = b2 - alpha * b2_delta\n    new_theta = (w1_new,b1_new,w2_new,b2_new)\n\
  \    return new_theta\n\n## 计算梯度\ngrad_objective = grad(objective)\n\n## 训练神经网络\n\
  epochs = 10\nprint \"RMSE before training:\", sklearn.metrics.mean_squared_error(D[1],neural_network(D[0],\
  \ theta))\nrmse = []\nfor i in xrange(0, epochs):\n    for j in xrange(0, examples):\n\
  \        delta = grad_objective(theta, j)\n        theta = update_theta(theta,delta,\
  \ 0.01)\n    rmse.append(sklearn.metrics.mean_squared_error(D[1],neural_network(D[0],\
  \ theta)))\nprint \"RMSE after training:\", sklearn.metrics.mean_squared_error(D[1],neural_network(D[0],\
  \ theta))\n```\n*(注：原文代码中存在部分语法错误如括号不匹配，已按要求要求保留不翻译)*\n\n\n### 使用 Autograd 实战神经网络\n\
  现在我们将从零构建一个简单的神经网络。我们将使用的唯一外部库是 `autograd`。注意 `autograd` 将在后续章节详细介绍。\n\n## 总结\n\
  在本章中，我们涵盖了前馈神经网络，这将作为后续章节的概念基础。我们涵盖的核心概念是网络的整体结构、输入、隐藏和输出层。鼓励读者尝试示例。\n\n### Theano\
  \ 简介\n在本章中，我们向读者介绍 Theano，这是一个用于定义数学函数（基于向量和矩阵）并计算这些函数梯度的库。Theano 是许多深度学习包的基础层。\n\
  \n### 什么是 Theano\n正如之前看到的，构建深度学习模型本质上是通过随机梯度下降 (SGD) 优化损失函数，这需要计算损失函数的梯度。由于深度学习损失函数非常复杂，手动推导此类梯度并不方便。这就是\
  \ Theano 的用武之地。使用 Theano 的典型工作流如下：\n1. 使用 Python 编写模型的符号表达式。\n2. 使用 Theano 的符号微分功能生成产生梯度的表达式。\n\
  3. 将此梯度函数作为参数传递给 SGD 优化程序以优化损失函数。\n\nTheano 允许用户专注于模型本身而非推导梯度的机制。Theano 作为构建深度学习模型优秀工具箱的特定能力如下：\n\
  1. 与 Numpy 无缝集成，允许用户在损失函数定义中使用 Numpy 对象（向量和矩阵）\n2. Theano 可以在底层为 CPU 和 GPU 生成优化的代码，而用户无需重写定义损失函数的代码。\n\
  3. 优化的自动/符号微分\n4. 通过自动/符号微分确保生成代码的数值稳定性。\n\n\n\n\n现在让我们开始上手操作 Theano 吧。我们将从简单的示例开始，这些示例将作为更复杂示例的性构建区块。建议读者查阅每个示例的源代码列表和相应的计算图，并仔细考虑源代码是如何转换为计算图的。\n\
  \n在代码列表 [4-1] 的第一个示例（以及图 [4-1] 中对应的计算图）中，我们将定义一个带有标量的简单函数。读者应该注意以下几点：\n\n1. 标量在用于数学表达式之前必须先定义。\n\
  2. 每个标量都有一个唯一的名称。\n3. 一旦定义，就可以使用 `+`、`-`、`*` 和 `/` 等操作对标量进行运算。\n4. Theano 中的函数结构允许人们关联输入和输出。因此，在列表\
  \ [4-1] 的示例中，我们定义了一个名为 `g` 的函数，它接受 `a`、`b`、`c`、`d` 和 `e` 作为输入并产生输出 `f`。\n5. 现在我们可以根据输入计算函数\
  \ `g` 的结果，并检查其是否与非 Theano 表达式完全一致。\n6. 虽然这看起来像是一个微不足道的示例，但其非凡之处在于，正如我们很快看到的，现在我们能够使用\
  \ Theano 非常容易地计算此类函数 `g` 的梯度。\n\n列表 4-1. 标量函数\n```python\nimport theano.tensor as\
  \ T\nfrom theano import function\na = T.dscalar('a')\nb = T.dscalar('b')\nc = T.dscalar('c')\n\
  d = T.dscalar('d')\ne = T.dscalar('e')\n\nf = ((a - b + c) * d )/e\n\ng = function([a,\
  \ b, c, d, e], f)\n\nprint \"Expected: ((1 - 2 + 3) * 4)/5.0\"\nprint \"Via Theano:\
  \ ((1 - 2 + 3) * 4)/5.0 = \", g(1, 2, 3, 4, 5))\n# Expected: ((1 - 2 + 3) * 4)/5.0\
  \ = 1.6\n# Via Theano: ((1 - 2 + 3) * 4)/5.0 = 1.6\n```\n\n在代码列表 [4-2] 的第二个示例（以及图\
  \ [4-2] 中对应的计算图）中，我们将定义一个带有向量的简单函数。读者应该注意以下几点：\n\n1. 向量/矩阵在用于数学表达式之前必须先定义。\n2. 每个向量/矩阵都有一个唯一的名称。\n\
  3. 向量/矩阵的维度没有指定。\n4. 一旦定义了向量/矩阵，用户就可以定义加、减、乘等操作。用户应确保向量/矩阵操作符合预期的维度。\n5. 与之前一样，用户可以基于定义的表达式定义函数。在这种情况下，我们定义了一个函数\
  \ `f`，它接受 `a`、`b` 和 `c` 作为输入并产生输出 `e`。\n6. 用户可以将 Numpy 数组传递给函数并计算输出。用户应确保向量/矩阵输入符合预期的维度。\n\
  \n列表 4-2. 向量函数\n```python\nimport numpy\nimport theano.tensor as T\nfrom theano\
  \ import function\na = T.dmatrix('a')\nb = T.dmatrix('b')\nc = T.dmatrix('c')\n\
  d = T.dmatrix('d')\ne = (a + b - c) * d\nf = function([a, b, c], e)\na_data = numpy.array([[1,1]])\n\
  b_data = numpy.array([[2,2]])\nc_data = numpy.array([[5,5]])\nd_data = numpy.array([[3,3]])\n\
  print \"Expected:\", (a_data + b_data - c_data) * d_data\nprint \"Via Theano:\"\
  , f(a_data, b_data, c_data)\n# Expected: [[-6, -6], [-6, -6]]\n# Via Theano: [[-6.,\
  \ -6.], [-6., -6.]]\n```\n\n在代码列表 [4-3] 的下一个示例（以及图 [4-3] 中对应的计算图）中，我们将定义一个同时包含标量和向量的函数。读者应该注意以下几点：\n\
  \n1. 标量和向量/矩阵可以在表达式中一起使用。\n2. 用户在定义表达式以及向表达式传递输入时，需要确保向量/矩阵符合维度。\n\n列表 4-3. 标量与向量函数\n\
  ```python\nimport numpy\nimport theano.tensor as T\nfrom theano import function\n\
  a = T.dmatrix('a')\nb = T.dmatrix('b')\nc = T.dmatrix('c')\nd = T.dmatrix('d')\n\
  p = T.dscalar('p')\nq = T.dscalar('q')\nr = T.dscalar('r')\ns = T.dscalar('s')\n\
  u = T.dscalar('u')\ne = (((a * p) + (b - q) - (c + r)) / s) * u\nf = function([a,\
  \ b, c, p, q, r, s, u], e)\na_data = numpy.array([[1,1]])\nb_data = numpy.array([[2,2]])\n\
  c_data = numpy.array([[5,5]])\nd_data = numpy.array([[3,3]])\nprint \"Expected:\"\
  , (((a_data * 1) + (b_data - 2) - (c_data + 3)) / 4) * 5\nprint \"Via Theano:\"\
  , f(a_data, b_data, c_data, 1, 2, 3, 4, 5)\n```\n图 4-3. 标量与向量函数\n\n激活函数\n\n在代码列表\
  \ [4-4] 的下一个示例（以及图 [4-4] 中对应的计算图）中，我们将使用 Theano 定义一些激活函数。Theano 中的 `nnet` 包定义了许多常见的激活函数。\n\
  \n列表 4-4. 激活函数\n```python\nimport theano.tensor as T\nfrom theano import function\n\
  ## sigmoid\na = T.dmatrix('a')\nf_a = T.nnet.sigmoid(a)\nf_sigmoid = function([a],\
  \ [f_a])\nprint \"sigmoid:\", f_sigmoid([[1,0,1]])\n\n## tanh\nb = T.dmatrix('b')\n\
  f_b = T.tanh(b)\nf_tanh = function([b], [f_b])\nprint \"tanh:\", f_tanh([[1,0,1]])\n\
  \n## fast sigmoid\nc = T.dmatrix('c')\nf_c = T.nnet.ultra_fast_sigmoid(c)\nf_fast_sigmoid\
  \ = function([c], [f_c])\nprint \"fast sigmoid:\", f_fast_sigmoid([[1,0,1]])\n\n\
  ## softplus\nd = T.dmatrix('d')\nf_d = T.nnet.softplus(d)\nf_softplus = function([d],\
  \ [f_d])\nprint \"soft plus:\", f_softplus([[1,0,1]])\n\n## relu\ne = T.dmatrix('e')\n\
  f_e = T.nnet.relu(e)\nf_relu = function([e], [f_e])\nprint \"relu:\", f_relu([[1,0,1]])\n\
  \n## softmax\nf = T.dmatrix('f')\nf_f = T.nnet.softmax(f)\nf_softmax = function([f],\
  \ [f_f])\nprint \"soft max:\", f_softmax([[1,0,1]])\n```\n\n\n\n\n- 8. 共享变量允许用户定义一个带有内部状态的函数，可以对其任意更新，而无需重新定义使用共享变量定义的函数。\n\
  \n### 列表 4-5. 共享变量\n\n```python\nimport theano.tensor as T\nfrom theano import function\n\
  from theano import shared\nimport numpy\n\nx = T.dmatrix('x')\ny = shared(numpy.array([[4,\
  \ 5, 6]]))\nz = x + y\nf = function(inputs = [x], outputs = [z])\nprint \"Original\
  \ Shared Value:\", y.get_value() \nprint \"Original Function Evaluation:\", f([[1,\
  \ 2, 3]])\n\ny.set_value(numpy.array([[5, 6, 7]]))\nprint \"Original Shared Value:\"\
  , y.get_value() \nprint \"Original Function Evaluation:\", f([[1, 2, 3]])\n# Couldn't\
  \ import dot_parser, loading of dot files will not be possible.\n# Original Shared\
  \ Value: [[4 5 6]]\n# Original Function Evaluation: [array([[ 5., 7., 9.]]]]\n#\
  \ Original Shared Value: [[5 6 7]]\n# Original Function Evaluation: [array([[ 6.,\
  \ 8., 10.]]]]\n```\n\n\n\n在下一个示例 列表 4-6（以及图 4-6 中对应的计算图）中，我们将定义一个函数并生成一个计算其梯度的函数。读者应该注意以下几点：\n\
  \n1. 在生成函数梯度之前，需要使用表达式定义一个函数。\n2. Theano 中的 `grad` 结构允许用户生成函数的梯度（以表达式的形式）。用户随后可以在该表达式上定义一个函数，从而得到梯度函数。\n\
  3. 3. 可以像前面的示例一样，为任何一组表达式/函数计算梯度。例如，我们可以为带有共享状态的函数生成梯度。随着共享状态的更新，函数和梯度函数也会随之更新。\n\
  \n### 列表 4-6. 梯度\n\n```python\nimport theano.tensor as T \nfrom theano import function\
  \ \nfrom theano import shared\nimport numpy\n\nx = T.dmatrix('x')\ny = shared(numpy.array([[4,\
  \ 5, 6]]))\nz = T.sum(((x * x) + y) * x)\nf = function(inputs = [x], outputs = [z])\n\
  g = T.grad(z,[x]) \ng_f = function([x], g) \nprint \"Original:\", f([[1, 2, 3]])\n\
  print \"Original Gradient:\", g_f([[1, 2, 3]]) \ny.set_value(numpy.array([[1, 1,\
  \ 1]]))\nprint \"Updated:\", f([[1, 2, 3]])\nprint \"Updated Gradient\", g_f([[1,\
  \ 2, 3]])\n# Original: [array(68.0)]\n# Original Gradient: [array([[ 7., 17., 33.]]]]\n\
  # Updated: [array(42.0)]\n# Updated Gradient [array([[ 4., 13., 28.]]]]\n```\n\n\
  \n图 4-6. 计算梯度\n\n在下一个示例 列表 4-7（以及图 4-7 (a) 和图 4-7 (b) 中对应的计算图）中，我们将使用 Theano 定义几个损失函数。Theano\
  \ 中的 `nnet` 包实现了许多标准损失函数。\n\n### 列表 4-7. 损失函数\n\n```python\nimport theano.tensor\
  \ as T \nfrom theano import function\n\n### 二元交叉熵\na1 = T.dmatrix('a1') \na2 = T.dmatrix('a2')\
  \ \nf_a = T.nnet.binary_crossentropy(a1, a2).mean() \nf_sigmoid = function([a1,\
  \ a2],[f_a]) \nprint \"Binary Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\"\
  , f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n\n### 分类交叉熵\nb1 = T.dmatrix('b1')\n\
  b2 = T.dmatrix('b2')\nf_b = T.nnet.categorical_crossentropy(b1, b2) \nf_sigmoid\
  \ = function([b1, b2],[f_b]) \nprint \"Categorical Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\"\
  , f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n\n### 平方误差 \ndef squared_error(x,y):\n\
  \    return (x - y) ** 2\nc1 = T.dmatrix('b1')\nc2 = T.dmatrix('b2')\nf_c = squared_error(c1,\
  \ c2) \nf_squared_error = function([c1, c2],[f_c]) \nprint \"Squared Error [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\"\
  , f_sigmoid([[0.01,0.01,0.01]],[[0.99,0.99,0.01]])\n# Binary Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\
  \ array(3.05814650319446)\n# Categorical Cross Entropy [[0.01,0.01,0.01]],[0.99,0.99,0.01]]:\
  \ array(9.1642887)\n# Squared Error [[0.01,0.01,0.01]],[0.99,0.99,0.01]]: array(9.1642887)\n\
  ```\n\n（注：提供的文本在损失函数部分包含了一些伪影/交织字符，已清理）*\n\n\n图 4-7 (b). 二元交叉熵 - 平方误差\n\n### 列表\
  \ 4-8. 正则化\n\n```python\nimport theano.tensor as T \nfrom theano import function\n\
  \n### L1 正则化\ndef l1(x):\n    return T.sum(abs(x))\n\n### L2 正则化\ndef l2(x):\n \
  \   return T.sum(x**2)\n\na = T.dmatrix('a')\nf_a = l1(a)\nf_l1 = function([a],\
  \ f_a) \nprint \"L1 Regularization:\", f_l1([[0,1,3]])\n\nb = T.dmatrix('b')\nf_b\
  \ = l2(b)\nf_l2 = function([b], f_b) \nprint \"L2 Regularization:\", f_l2([[0,1,3]])\n\
  # L1 Regularization: 4.0\n# L2 Regularization: 10.0\n```\n\n\n图 4-8. 正则化\n\n在下一个示例\
  \ 列表 4-9（以及图 4-9）中，我们将定义一个带有随机变量的函数。读者应该注意以下几点：\n\n1. 有些情况我们希望定义带有随机变量函数（例如引入扰动）。\n\
  2. 这种随机元素与内部状态（如共享变量的情况）不同。\n3. 基本上，这种情况是为了用户想要定义一个具有特定分布的随机变量。\n4. Theano 提供了一个名为\
  \ `RandomStreams` 的结构，允许用户定义带有随机变量的函数。`RandomStreams` 使用 `seed` 初始化。\n5. 用户使用 `RandomStreams`\
  \ 定义变量并通过调用相应的函数指定分布（在本例中为 `normal`）。\n6. 定义后，随机变量可以类似于标量和矩阵的方式在表达式或函数中使用。\n7. 带有随机变量定义的调用都会内部从集合（在本例中为\
