  print(\"Test score:\", score)\n```\n\n\n\n\n现在让我们来看一个简单的数学概念，它是 SGD 背后的直觉。为了简单起见，我们假设\
  \ `x` 只是一个向量。鉴于我们要最小化 `L(x)`，我们希望更改或更新 `x` 以使 `L(x)` 减少。让 `u` 代表 `x` 理想情况下改变的单位向量或方向，让\
  \ `a` 表示此步进的幅度（标量）。`a` 的值越大意味着在 `u` 方向上的步长越大，而这并不是我们希望的。这是因为 `u` 是根据 `x` 的当前值评估的，而对于不同的\
  \ `x`，它也会不同。\n\n因此，我们想要找到一个 `u`，使得\n\n`limL(x+au)`\n`a \\to 0`\n\n是最小的。由此可以得出\n\n\
  `limL(x+\\+u) = u^T V[x]L(x).`\n\n因此，我们基本上想要找到一个 `u`，使得\n\n`U V_x L(x)`\n\n是最小的。注意\
  \ `V[x] L (x)` 是 `L(x)` 的梯度。\n\n由于 `u^T` 和 `V[x]L(x)` 都是向量，可以得出\n\n`u^T V[x]L(x)\
  \ = |u|-|V[x]L(x)cos\\phi,`\n\n其中 `\\phi` 是两个向量之间的角（参见图 8-2）。\n\n![](img/main-85.jpg)\n\
  \n`cos \\theta` 的值会在 `\\theta = p` 处最小，也就是说两个向量指向相反的方向。因此，得出设置方向 `u = - V[x]L(x)`\
  \ 将实现我们的预期目标。这导致了如下的简单迭代算法：\n\n```\nInput: a, n\nInitialize x to a random value.\n\
  For n steps do:\n  Update x = x-aV[x] L (x)\nOutput: x\n```\n\n## 批量、随机（单样本和小批量）梯度下降\n\
  \n到此为止，我们将损失函数表示为 `L(x)`。训练数据（示例）在这个符号表示中是隐含的。为了讨论起见，我们需要将它们显式化。让我们将训练数据标记为 `D =\
  \ {{d1,d2,...dn}}`。我们的损失函数现在应该标记为 `L_D(x)`。这仅意味着损失函数是在使用参数 `x` 并相对于一组数据点 `D` 进行评估的。让\
  \ `T` 为 `D` 中示例的子集；那么 `LT` 表示在示例集 `T` 上评估的损失函数。同样，`V[x]LD` 和 `V[x]L[T] (x)` 分别表示在训练数据集\
  \ `D` 和 `T` 上计算的损失函数 `L(x)` 的梯度。\n\n> **注意**：目前，我们将避免对数据子集上损失函数梯度的计算。这些可以使用自动微分（在书中其他部分介绍）很容易地生成（即使对于任意复杂的损失函数也是如此），而不需要手动推导。\n\
  \n有了这些符号，我们现在可以讨论之前讨论的最速下降法的三种变体。\n\n### 批量 (Batch)\n\n在这种方法中，整个数据集 `D` 被用于更新步骤。也就是说，`x`\
  \ 的更新为 `x = x - V[x] L_D (x)`。关于这种方法有两点显而易见：第一，它是昂贵的，因为它需要对整个数据集进行计算。第二，在给定整个数据集的情况下，更新方向是最准确的。\n\
  \n### 随机单样本 (Stochastic Single Example)\n\n在这种方法中，更新步骤中仅使用 `D` 中的单个示例。也就是说，`x` 的更新为\
  \ `x = x - V [x] L_S (x)`，其中 `|S| = 1`。注意我们每次迭代都选择不同的示例（因此称为随机的）。关于这种方法也有两点：首先，它是非常廉价的，因为只需要计算单个示例。\n\
  \n### 随机小批量 (Stochastic Mini-batch)\n\n在这种方法中，更新步骤使用的是 `D` 中的一小部分子集。也就是说，`x` 的更新为\
  \ `x = x - V[x] L_S (x)`，其中 `|S| < |D|`。\n\n### 批量对比随机 (Batch vs. Stochastic)\n\n\
  在实践中，随机占优，因为方向中的噪声允许跳过鸿沟。\n\n## SGD 的挑战\n\n在涵盖了 SGD 的概念性描述后，让我们现在考虑将其应用于现实世界问题时的挑战。\n\
  \n### 局部最小值 (Local Minima)\n\n局部最小值（参见图 8-3）会困住任何最速下降法并阻止走向解决方案。\n\n![](img/main-86.jpg)\n\
  \n### 鞍点 (Saddle Points)\n\n鞍点（参见图 8-4）是梯度为零但不是局部最小值的点。良好的经验证据，在优化问题中，鞍点比局部最小值常见得多。\n\
  \n![](img/main-87.jpg)\n\n### 选择学习率 (Selecting the Learning Rate)\n\n之前讨论中代表步长标量的\
  \ `a` 在每次迭代中提取以更新 `x`。这个 `a` 通常被称为学习率，它对寻找解决方案有很大影响。学习率过高会导致解决方案跳动，而学习率过低意味着收敛缓慢。对于具有许多参数的损失函数，所有参数使用单一全局学习率使得选择学习率的问题更具挑战性。\n\
  \n![](img/main-88.jpg-90.jpg)\n\n### 狭谷中的缓慢进展 (Slow Progress in Narrow Valleys)\n\
  \n最速下降法的另一个固有问题是由于缩放不当的数据集导致的狭谷中进展缓慢。当我们接近解决方案时，进展会剧减（参见图 8-6）。\n\n![](img/main-91.jpg)\n\
  \n## SGD 的算法变体\n\n我们现在涵盖学术文献中提出的若干 SGD 算法变体以解决之前讨论的挑战。\n\n### 动量 (Momentum)\n\n\
  考虑之前描述的 SGD 更新步骤：\n\n`x = x-a V[x]L(x).`\n\n动量的直觉是将上一次更新的一部分用于当前更新。也就是说，让 `u[s]`\
  \ 表示第 `s` 步参数 `x` 的更新。同样，让 `u[s-1]` 表示上一步的更新。现在，让我们用以下公式更新 `x`：\n\n`u_s = \\gamma\
  \ u_{s-1} + a V_x L(x)`\n\n也就是说，我们更新 `x=x-u_s` 而不是 `x = x-a V[x]L(x).`\n\n![](img/main-92.jpg)\n\
  \n\n\n简单来说，我们利用上一步更新的某部分用于当前的更新。这种思想被称为**动量**（momentum），因为它类似于球在山坡下滚动时获得的动量。一个获得动量的球会在途中从较小的凹槽（局部最小值）中反弹出来，并到达山底。即使山坡的坡度大大减小，它也能在某种程度上保持之前的下坡速度（因为它已经积累了动量）。动量项基本上导致新的步长方向受到上一步步长方向的影响（参见图\
  \ 8-7）。经验证明，使用动量可以减少震荡并加速收敛。\n\n## 尼斯特洛夫加速梯度 (NAS)\n\n使用与之前相同的符号，尼斯特洛夫加速梯度基本上是通过以下公式更新\
  \ `x` 的：\n\n```\n^Us \\= g^Us-1 ^+^a^V x^L (^(\\-)g^Us-1).\n```\n\n也就是说，我们更新 `x=x-u[s]`。\n\
  \n这背后的直觉逻辑是“向前看一步”。也就是说，我们首先沿着累积梯度的方向迈出一步，然后进行调整。NAS 的背后直觉是前瞻和预测，从而获得更好的解决方案（参见图\
  \ 8-8）。\n\n![](img/main-93.jpg)\n\n## 退火与学习率调度\n\n当梯度下降接近最小值时，我们已经看到糟糕的学习率如何导致它在最小值附近震荡（参见图\
  \ 8-5）。退火是指在在接近最小值时减小学习率。这可以通过手动完成（停止梯度下降并在相同点使用减小后的学习率重新开始），或者通过学习率调度来实现，后者引入了若干由用户控制的超参数，这些参数根据步数决定学习率的降低方式。然而，必须注意的是，我们对所有参数使用了相同的学习率，这可能并不合适；我们需要对每个参数进行学习率调整。\n\
  \n## Adagrad\n\nAdagrad 算法为每个参数调整学习率。到目前，我们一直将损失函数的参数标记为 `x`。注意，`x` 实际上是大量的参数，每个参数都以相同的学习率进行更新。让\
  \ `x[i]` 表示其中一个参数，让 `g[i]^s` 表示 `x` 在第 `s` 步的梯度。对于步骤 `0,1,...,S\\-1`，我们有一系列对应的梯度\
  \ `g0,g0,^,g[t]^s`。\n\n设\n\n```\nG = (gi )² + (g1 )² +...+((“ )\n```\n\n这基本上是直到上一步为止每一步梯度的平方之和。Adagrad\
  \ 的更新规则是：\n\n```\n^aS\n^xi = ^xi -  1 gi.\nG²\n```\n\n``` 这里的 `a` 项是全局学习率，它会根据之前的梯度为每个参数进行适应。还必须注意的是，随着\
  \ `G` 的累积，每个参数的学习率会变慢，最终无法产生任何进展，这是 Adagrad 的弱点。\n\n## RMSProp\n\nRMSProp 算法改进了\
  \ Adagrad 算法在迭代一定次数后进展完全停止的缺点。这里的直觉是在每一步计算出的梯度上使用一个固定大小的窗口，而不是使用全量梯度。也就是说，仅对过去 `W`\
  \ 步的梯度进行计算 `G`。现在，在概念上，将以下计算：\n\n```\nG =----------------------\n[n]           \
  \      +^+((S^(\\-1))²\nW\n```\n\n视为梯度平方的指数衰减平均值的累积在计算上更便宜，而不是存储所有的 `g-, gr¹,.,\
  \ g\\-² g\\-¹` 值并在每一步计算 `G`。也就是说，我们计算：\n\n```\n^E \\[te^()2 \\]) =r^E \\[te^()2\
  \ \\] +^E \\[te^()2 \\] +()i^(\\-)r)^)g'i)\n```\n\n其中 `p` 是衰减率。\n\n现在注意，在 Adagrad\
  \ 中我们计算的更新为：\n\n```\n1\nx[t] = x[i] - i gf.\n```\n\n考虑 `G²` 的值。我们可以看到这仅仅是 `g` 的均方根，即\
  \ `G G RMS \\[&\\] = G² \\=\\\\ E \\[(&)² J.  `。\n\n因此，我们可以这样计算更新：\n\n```\n^aS\n\
  ^x\\=^x ^(\\-)     )^g.\n```\n\n## Adadelta\n\nAdadelta 背后的直觉是考虑参数的单位与参数更新的单位是否相同。Adadelta\
