- "# 机会性网络：移动模型、协议、安全与隐私\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n---\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n## 前言\nKhaleel Ahmad 博士目前任教于印度海德拉巴的纳·阿扎德国立乌尔语大学（Maulana Azad National\
  \ Urdu University）计算机科学与信息技术学院助理教授。在此之前，曾在声誉良好的大学和国家级机构工作。他拥有计算机科学与工程博士学位和信息安全硕士学位。他的研究领域是机会性网络、网络安全、密码学和云计算。他在经过评审的国内/国际期刊和会议（如\
  \ Elsevier, ACM, IEEE 和 Springer）上发表了 30 多篇论文，并在十本书籍章节（CRC Press/Taylor & Francis\
  \ Group, IGI Global 和新德里 IGNOU）中有所著。他还在哈里亚中央大学、特伦甘纳大学进行过专家讲座和客座，并在新德里举行的国际会议上发表演讲并担任会议主席。他还是多个国际/国内研究协会的会员，如\
  \ ISTE, CRSI, ISCA, IACSIT（新加坡）、IAENG（香港）、IAOE（奥地利）、ISOC（美国）等。此外，他还以编辑委员会成员和审稿人的身份与许多国际研究组织联系。\n\
  \n\n\n\n\nNur Izura Udzir 博士自 1998 年起担任马来西亚普特拉大学（UPM）计算机科学与信息学院的教职员工。她在普特拉大学获得了学士学位（1995\
  \ 年）和硕士学位（1998 年），并于英国约克大学获得计算机科学博士学位（2006 年）。她的专业领域包括访问控制、入侵检测系统、安全操作系统、协调模型与语言以及分布式系统。她目前担任该学院计算机科学系主任，以及信息安全小组成员（她曾于\
  \ 2008 年至 2013 年领导该小组）。她还是 IEEE 计算机学会、马来西亚密码学研究协会（MSCR）、数字信息与无线通信协会（SDIWC）的成员，并目前担任马来西亚信息安全专业人士协会（ISPA.my）的委员会成员。Udzir\
  \ 博士指导和共同指导了 30 多名博士生和 15 多名硕士（研究型）学生。她写过一本书`Pengenalan kepada Pengaturcaraan C++\
  \ (Introduction to C++ Programming)`（Prentice Hall, 2001 年），并在期刊和专著中发表了 60 多篇文章，在国际会议上发表了\
  \ 80 多篇论文，截至 2016 年 3 月，她在 Scopus 中的 H 指数为 8，引用 232 次（Google Scholar 中 H 指数为 14，引用\
  \ 718 次）。此外，她还因其学术和研究贡献获得了多项奖励，包括六次国际会议最佳论文奖以及因指导学生博士论文获得的 2015 年 MIMOS 杰誉奖。她还发表过主题演讲和专家报告，并作为受邀演讲参加多次国际会议。\n\
  \nGanesh Chandra Deka 博士是印度政府技能发展与创业部培训总局（原劳工与就业部 DGE&T）的副局长（培训）。他是 IEEE 和 IETE\
  \ 成员，印度工程师学会副会士，以及《计算、通信与网络国际期刊》的主编。他的研究兴趣包括农村发展中的信息与通信技术（ICT）、电子治理、云计算、数据挖掘、NoSQL\
  \ 数据库以及职业教育与培训。他编辑了三本关于云计算的书籍，并发表了 40 多篇研究论文。他在巴尔斯桥大学获得了计算机科学博士学位。\n\n## 前言\n\n\
  在过去的几十年里，网络已从静态的有线通信模型转向具有各种属性的新型动态环境，例如游牧计算、泛在计算、虚拟家庭环境以及移动通信的随时随地模型，在其中信息在无线设备之间进行交换并供移动用户使用。机会性网络提供了泛在网络支持，通过利用邻居之间的任何点对接触来识别通往目的地的下一跳。它允许移动用户在没有任何现有网络基础设施的情况下共享数据。机会性计算的关键观察是：（移动）用户周围的环境特征是，具有无线网络能力的固定和移动设备上的可用异构资源集持续增加。\n\
  \n《机会性网络：移动模型、协议、安全与隐私》一书旨在作为本科和研究生课程的教材。此外，本书的目标是为研究人员、科学家和网络工程师提供一份关于机会性网络的基本概念、移动模型、架构、协议、安全问题以及前沿研究进展的专家指南。本书以直观且易懂的方式编写，以便学生能够轻松掌握重要概念。\n\
  \n在书中，十六章中的每一章都详细涵盖了一个独特的话：\n1. 机会性网络基础\n2. 机会性资源利用网络\n3. 容延网络中的缓冲区管理\n4. 移动模型分类\n\
  5. 路由协议分类\n6. 机会性网络的拥塞感知自适应路由\n7. 车载自构网络 (VANETs)\n8. 机会性网络中的能量管理\n9. 网络编码方案\n10.\
  \ 机会性网络中的安全攻击分类\n11. 机会性资源利用网络中安全与隐私的泛在信任基础\n12. 受机会性网络启发的未来网络\n13. 机会性网络中模拟跨层反馈的时间与数据驱动触发\n\
  14. 容延网络（DTN）的应用\n15. 机会性网络中社交感知路由协议的性能评估\n16. 手手 ONE 模拟器\n\n## 贡献者\n\n**Musaeed\
