  #### 10.5.16 节点复制攻击\n## 10.5.17 不同步攻击\n## 10.6 结论\n## 参考文献\n\n## 10.1 引言\n\n尽管我们可以通过允许源和目的之间使用直接路由路径进行通信来描述传统计算机网络，但其他网络架构建议使用算法，使得节点即使在之间没有直接路径也能进行通信。机会性网络（Opportunistic\
  \ networks）属于无线网络的一类，它们利用各种技术进行消息传输，例如直接传输、泛洪、基于预测、基于上下文和基于位置的技术。\n\n通常，机会性网络的节点需要相互交换消息以获取其局部邻域的知识，并能够创建转发消息可能的路径。基于这些概念，某些攻击者可以创建新方法对网络造成损害或获取某些利益，例如生成虚假的邻居消息来破坏连接或不转发数据包等其他类型的攻击。\n\
  \n计算机网络一直受到安全攻击的威胁。在机会性网络的背景下，攻击者可能会滥用数据包转发方法从节点中获取重要信息，或者作为合法节点渗透网络。这些攻击会影响各种网络安全威胁，如身份验证、可用性、隐私性和数据完整性（`图\
  \ 10.1`）。\n\n![](img/fig10.1.jpg)\n\n图 10.1\n\n受攻击者读取内容影响的节点之间的通信。\n\n本章讨论了计算机网络中存在的几种安全攻击，这些攻击可能会直接或间接地影响各种机会性网络。我们根据对安全属性造成的损害对攻击类型进行分类。我们还展示了许多旨在保护和缓解这些安全问题的机制的研究工作。\n\
  \n本章的结构如下：第 10.2 节详细介绍了可能在机会性网络中充攻击者的实体分类以及我们的可能目标。第 10.3 节介绍了部署安全机会性网络所需的安全属性。第\
  \ 10.4 节展示了身份方案的分类，这有助于确保许多网络环境下的安全属性。第 10.5 节描述了若干安全攻击、它们的执行方式，以及学术界提出的现有缓解和保护方法。最后，第\
  \ 10.6 节总结了本章，给出了攻击及其安全属性的分类法。\n\n## 10.2 攻击者分类\n\n多个实体可能是机会性网络的潜在攻击者，例如协调小组、敌对公司、政府机构或任何具有特定利益的个人。攻击的原因可能是金钱利益、政治原因，甚至是智力挑战。\n\
  \n我们将产生安全攻击的实体视为攻击者节点。根据它们的行为和想要执行的攻击类型，我们对它们进行不同的分类。分类组织如下：\n\n## 10.2.1 内部攻击者与外部攻击者\n\
  \n内部攻击者是网络内部的攻击者节点，能够正常交换消息。我们认为这些节点的安全性非常危险。然而，外部攻击者没有适当的连接，它们的攻击性较小。\n\n## 10.2.2\
  \ 主动攻击者与被动攻击者\n\n主动攻击者在网络内执行操作，直接采取行动，例如发送虚假消息或不转发消息。相反，被动攻击者仅限于监听通信以获取某些信息。\n\n\
  ## 10.2.3 恶意攻击者与理性攻击者\n\n恶意攻击者旨在在没有任何任何个人利益的情况下破坏网络连接性。然而，理性攻击者在执行攻击之前已经设定了他们的目标。\n\
  \n# 10.3 机会性网络中的安全属性\n\n机会性网络为了提供安全具有重要的安全需求。以下项目展示了安全可靠网络的主要安全属性（Raya and Hubaux,\
  \ 2005）。\n\n### 10.3.1 身份验证\n\n网络内部的节点只能与另一个合法节点交换消息。节点的身份验证在网络安全中起着重要作用。在某些应用中，存在密钥管理基础设施来确保真实性。\n\
  \n## 10.3.2 不可否认\n\n不可否认是一种安全机制，意味着每当需要消息请求时，发送方和接收方不能否认。网络需要保证所有节点遵循这一属性。\n\n###\
  \ 10.3.3 可用性\n\n预留用于通信的带宽通道必须供所有节点使用，即使在受到某些安全攻击的情况下也是如此。新节点带有新的安全消息到达，通信通道必须准备好接收它们。在这种情况下，网络必须有一项操作策略，例如。\n\
  \n### 10.3.4 数据完整性\n\n数据完整性是在消息于网络整个生命周期内对数据准确性和一致性的保护和保证。这个术语范围很大，根据上下文的不同可以有广泛不同的含义。\n\
  \n### 10.3.5 隐私\n\n该属性与数据完整性相似。然而，问题在于其他节点是否访问了数据包敏感数据。网络必须防止未经授权的内容访问。网络可能对该属性应用一些加密方法，如公钥密码学。\n\
  \n# 10.4 机会性网络中的身份验证方案\n\n\n\n\n\n在本节中，我们介绍了用于各种类型计算机系统的认证方案类型，这些方案可以适应到机会性网络中。除了针对移动自组织网络（MANETs）和无线传感器网络（WSNs）中特定攻击的检测与防御已有许多提议外，还有一些认证方案能够同时提供对各种类型安全攻击的检测和防御，从而确保前文讨论的安全需求。Manvi\
  \ 和 Tangade (2017) 将某些认证方案分类如下。\n\n### 10.4.1 基于签名的方案\n\n在机会性网络中使用数字签名可以保证身份认证、数据完整性和不可否认性需求。然而，数字签名方案不能保证隐私属性。我们可以将这些方案分为单用户签名方案或群签名方案。\n\
  \n### 10.4.2 基于验证的方案\n\n验证对于与签名配合工作的方案来说是一个不可要素的元素。研究人员提出了协作验证消息认证码（MACs）的建议；句话说，属于网络的节点验证固定数量的消息，以减少计算所需的开销和时间。我们可以将这些方案分为批处理验证方案或协作消息认证方案。\n\
  \n### 10.4.3 基于密码学的方案\n\n公钥密码学作为一种广为人互联网通信协议，也可以用于机会性网络中的消息认证。然而，有必要考虑计算结果的成本。对称方法仅在两点之间由私钥组成，计算简单，但不能保证不可否认性，且如果有人发现了私钥，网络可能会变得不安全。这些方案可以分为非对称加密方案、公钥基础设施证书方案、椭圆曲线密码方案、非对称加密方案、MAC\
  \ 方案和哈希函数方案等。\n\n# 10.5 安全攻击\n\n在本节中，我们介绍了文献中存在的主要的安全威胁。这些攻击影响几乎所有之前讨论的安全属性。然而，机会性网络中的安全攻击不仅限于下面列出的那些。\n\
  \n#### 10.5.1 Sybil 攻击 (Sybil Attack)\n\nSybil 攻击发生在攻击者使用自己的设备通过另一个身份在周围模拟虚假节点，这些节点被称为\
  \ Sybil 节点。因此，Sybil 节点利用其身份执行另一种类型的安全攻击，而攻击者节点则表现正常。根据网络安全级别，这些身份可以是：\n\n-   **生成的\
  \ ID**：网络允许内部节点生成有效身份来交换消息，并且对谁使用这些身份没有严格控制。\n-   **被盗的 ID**：攻击者必须找到一种从其他节点获取真实身份，以便在网络中部署能够交换消息的\
  \ Sybil 节点。\n\n[图 10.2]显示了 Sybil 攻击期间的场景。攻击者节点 B 生成了两个 Sybil 节点 C 和 E，它们实际上可以与其他合法节点通信，并在不损害节点\
  \ B 的情况下执行其他安全攻击。\n\n```\n![](img/fig10.2.jpg\n```\n图 10.2 Sybil 攻击。\n\nGrover 等人\
  \ (2010) 提出的用于车载自组织网络（VANETs）的分布式方法利用每个路侧单元（RSU）在给定的观察期间计算并存储关于通过它们的节点的不同参数值。之后，算法结合了车辆与\
  \ RSU 之间的距离、信号强度以及节点与 RSU 之间角度的值。如果某些节点的参数具有相同的值，算法会将这些归类为 Sybil 节点。然而，由于涉及到车辆与\
  \ RSU 之间角度的计算，他们在没有弯道的直直道路上进行了仿真。\n\n在另一种方法中，Grover 等人 (2011) 建议每个节点定期交换其邻居节点组并对这些组进行交集。如果某些节点观察到自己在很一段时间内具有相似的邻居，算法会将这些相似邻居归类为\
  \ Sybil 节点。在这种情况下，他们在真实的交通场景下评估了所提方法。Kumar 和 Maheshwari (2014) 提出的方法使用了一种名为 `priority\
  \ batch verification algorithm (PBVA)` 的算法对从多个节点获取的请求进行分类，并对紧急节点进行立即响应以减少时间延迟。同时，系统还通过限制\
  \ RSU 提供的时间戳来防止 Sybil 攻击者。\n\n#### 10.5.2 黑洞攻击和选择性转发攻击\n\n黑洞攻击的特征是攻击者节点丢弃接收到的任何数据包。攻击者不断向其直接邻居广播转发数据包的最优路由，以改变路由使之指向该节点。然而，该节点立即丢弃所有数据包，损害了网络可用性。\n\
  \n这种安全攻击的执行有很多变体，分为三种主要策略：\n\n-   **黑洞攻击**：单个节点在网络中执行攻击，丢弃所有到达的数据包。\n-   **协作黑洞攻击**：多个节点同时执行攻击。这通常是最常用的策略。\n\
  -   **灰洞攻击**：多个节点同时也执行攻击。然而，攻击者策略性地选择哪些数据包被丢弃。\n\n[图 10.3]插了如果节点 B 和 E 以某种方式连接以切换到攻击模式，协作黑洞或灰洞的行为。它们后面的节点没有接收到消息，因为黑洞节点丢弃了它们。\n\
  \n```\n![](img/fig10.3.jpg\n```\n图 10.3 协作黑洞攻击。\n\nAlheeti 等人 (2015a) 提出的方法建议了一种入侵检测系统，使用人工神经网络（ANN）和模糊数据来检测网络上的黑洞攻击。他们的方法还利用从跟踪文件中提取的特征作为审计数据来检测攻击。\n\
  \n为了避免这种攻击，Almutairi 等人 (2014) 提出的方法建议在每个节点上使用信任表，以便在仿真的每个步骤评估邻居节点的可靠性。为了评估他们的方法，他们使用\
  \ `VANET Car Mobility Manager (VaCaMobil)` 进行仿真。然而，这种方法仅适用于单黑洞攻击。\n\n基于早期的方法，Alheeti\
  \ 等人 (2015b) 再次使用神经网络概念来检测现在表现为灰洞的节点。算法将神经网络的输出定义为两种结果：正常或异常。他们使用 `Network Simulator\
  \ 3 (NS-3)` 和 `Simulator of Urban MObility (SUMO)` 进行移动模型。使用这种神经网络获得非常有前景，错误率较低。\n\
  \n#### 10.5.3 汇洞攻击 (Sinkhole Attack)\n\n汇洞攻击的特征是根据路由算法伪造路由质量，以强制邻居将其数据包转发到该节点，从而控制某些网络区域的数据流。在实现预期的数据流控制后，攻击者节点可以启动其他类型的网络安全攻击，例如选择性转发（见\
  \ 10.5.2 节）或水母攻击（见 10.5.5 节）。\n\n\n\n\n\n在图 10.4 中，我们展示了一个使用优化链路状态路由协议（OLSR）作为路由算法的机会性网络示例。攻击者节点\
  \ `E` 发送 `HELLO` 消息，声称其路由质量为最大（255），正如此，它的邻居选择该攻击者作为新的多点中继（MPR）。\n\n![](img/fig10.4.jpg)\n\
  \n图 10.4  \n\n洞洞攻击（Sinkhole attack）。\n\n在基于位置的路由（PBR）的 VANET 中，Alsharif 等人（2011）提出了一种执行合理性检查的算法，即对行驶距离、当前速度和网络密度、通信范围以及当前地图位置进行检查，以验证车辆的任何异常行为。此外，还有针对消息内容和数据包时间戳的检查，并监听通信信道以验证请求节点是否确实转发了消息。该算法被称为\
  \ `PBR-PC`，可以完全消除高密度网络中的洞洞攻击。此外，他们还模拟了其他攻击方法，如路由环、智能洞洞和虫洞（第 10.5.4 节），并产生了类似的结果。\n\
  \n### 10.5.4 虫洞攻击](#chapter10.xhtml#re_ch-10-sec-20)\n\n虫洞攻击是洞洞攻击的一种变体，尽管它使用两个或多个攻击者创建数据包隧道以减少到达远程节点的跳数。这种行为导致邻居使用虫洞路径路由其数据包，允许攻击者控制网络特定区域的数据流。\n\
  \nHu 等人（2006）引入了一种名为 `TIK` 的新虫洞检测协议，该协议在网络上实施了“索”（leashes）。索是一系列确保网络完整性的时间规则。例如，时间索可以表征数据包比预期更早到达目的地。使用索信息，`TIK`\
  \ 协议能够验证节点之间的通信，同时检测虫洞。\n\n在图 10.5 中，节点 `B` 想要在一个采用按需矢量矢量矢量路由协议（AODV）作为路由算法的机会网络中与节点\
  \ `F` 通信。当节点 `B` 发送 `RREQ` 消息时，通过虫洞的消息首先到达节点 `F`，`RREP` 消息遵循相同的路径，导致新的数据包路径通过虫洞，攻击者控制了网络的部分区域。\n\
  \n![](img/fig10.5.jpg)\n\n图 10.5  \n\n虫洞攻击。\n\n### 10.5.5 水母鱼攻击](#chapter10.xhtml#re_ch-10-sec-21)\n\
  \n针对机会性网络的“水母鱼攻击”（Jellyfish attack）的特征是：一个或多个攻击者故意延迟和重排序数据包，导致网络服务质量下降，特别是在现有的安全服务方面。\n\
  \nChen 等人（2006）提出了一种吞吐量反馈路由（TUF）的方法。首先，算法估计并使用近似的吞吐量值作为阈值，以检测路由是否具有异常行为。即使存在误报检测，该算法通过为具有低吞吐量值的连接创建新路由来规避攻击者，从而缓解攻击影响。结果显示，除了缓解水母鱼攻击外，还避免了其他可用性攻击，如抢占攻击（第\
  \ 10.5.11 节）和拒绝服务（DoS）攻击（第 10.5.9 节）。\n\n在图 10.6 中，节点 `A` 发送一条关于网络状况的消息。收到消息后，攻击者节点\
  \ `D` 故意延迟转发 5 秒。这种延迟可能已经使消息内容失效，导致后面的节点无法收到有关网络状况的正确信息。\n\n![](img/fig10.6.jpg)\n\
  \n图 10.6  \n\n水母鱼攻击。\n\n### 10.5.6 GPS 欺骗攻击](#chapter10.xhtml#re_ch-10-sec-22)\n\
  \nGPS 欺骗通过虚假信号欺骗节点上的 GPS 接收器，其时间与实际物理位置和精确时间不符（Larcom and Liu, 2013）。欺骗可能是机会性网络中最危险的攻击之一，因为检测此类攻击的机制必须非常精确。\n\
  \n图 10.7 展示了网络上攻击者节点的行为。天线产生的强 GPS 信号与卫星信号重叠，允许攻击者节点 `E` 向合法节点发送错误位置。某些节点可能仍然接收到来自卫星的信号，但这会导致数据完整性问题，因为它们同时接收到了不一致的数据。\n\
  \n![](img/fig10.7.jpg)\n\n图 10.7  \n\nGPS 欺骗攻击。\n\nZhang 等人（2012）提出的方法表明，使用连接到单极子天线的第二个接收器的算法可以帮助检测\
  \ GPS 伪信号，并检测攻击的持续时间。结果显示与相关工作相比，其检测速度更快。\n\n通过使用配备多个天线的基站，Yan 等人（2015）提出的方法利用信道观测来识别同样配备多个天线的恶意节点，这些节点在其位置欺骗\
  \ GPS 信号。分析显示，随着基站与合法节点之间 Rician K 子的增加，位置欺骗检测系统的性能有所提高。\n\nTippenhauer 等人（2011）识别了攻击者需要从什么位置以及什么精度生成信号以成功欺骗接收器。他们还调查了卫星锁定接管的实际情况，即受害者节点在首次锁定后接收到欺骗信号。\n\
  \n### 10.5.7 冒充攻击](#chapter10.xhtml#re_ch-10-sec-23)\n\n当网络上的攻击者节点为了自身利益发布安全消息或窃取合法节点的\
  \ ID 时，这就是冒充攻击。网络中需要一个受信任的认证系统来避免这种攻击。\n\nChatwal 和 Sharma（2015）提出的 VANET 方案通过向网络泛洪信标包来发现邻节点的存在及其精确位置。他们通过\
  \ VANET 内容脆弱水印来管理认证方案，这是一种隐藏信息的技术，可以防止非法篡改。他们通过仿真评估了该方案，并分析了信标开销、路由扩展和节点负载。\n\n\
  Prathima 等人（2015）的方法使用 RSU 来负责检查消息完整性和验证用户身份，从而减轻了节点相互认证的负担。然而，该方法无法保证检测到使用其他身份的攻击者。他们使用\
  \ SUMO 模拟了各种场景。\n\nYing 和 Nayak（2014）提出了一种使用高效认证协议（EAF）的方法，该协议基于节点密码使用智能卡并使用动态登录；作者提供了认证的匿名性。图\
  \ 10.8 展示了攻击者节点 `B` 如何发起攻击。通过向其他节点发送消息，攻击者伪装成另一个节点以获取敏感信息。\n\n![](img/fig10.8.jpg)\n\
  \n图 10.8  \n\n冒充攻击。\n\n\n\n\n\n虚假信息攻击发生在攻击者在网络上广播多条消息，导致系统混乱或损坏其他网络节点时。最可行的解决方案是检查网络上传输的恶意数据的发生情况，以检测是哪个节点正在进行攻击。因此，许多方法建议使用附加在数据包上的\
  \ `MAC` 来验证其内容，从而确保攻击者在没有通过网络身份验证的情况下生成虚假数据。\n\n图 10.9 显示了攻击者节点 `E` 执行虚假信息攻击的行为。根据其选择，它可能会向其他节点发送特定消息以获取某些利益，或者仅仅是为了造成破坏。\n\
  \n![](img/fig10.9.jpg)\n\n图 10.9\n\n虚假信息攻击。\n\nGolle 等人（2014）提出的方法建议，网络中存在的每个节点必须根据可能存在恶意节点的这一事实，为其收集到的数据寻找可能的解释。然而，分析和表征数据包数据涉及成本，而且在访问数据包数据时会存在隐私问题。\n\
  \n### 10.5.9 分布式拒绝服务 (#chapter10.xhtml#re_ch-10-sec-25)\n\n分布式形式的 `DoS` 攻击与如今对网站的攻击非常相似，但在机会性网络中，受害者是一个接收到大量虚假数据的特定节点。\n\
  \nPathre 等人（2013）提出了一种与检测虚假信息攻击方法类似的方法。在 `RSUs` 的帮助下，验证网络节点是否收到了许多带有虚假信息的数据包。通过对攻击者进行有效检测，通过\
  \ `RSUs` 发送的广播消息将其标记为不再继续参与路由算法，从而失去所属网络的权限。\n\nBiswas 等人（2012）采用更接近实际应用的方法对分布式拒绝服务（`DDoS`）攻击对\
  \ `IEEE 802.11p` `MAC` 层的影响进行了更深入的分析（Han 等人，2012）。通过仿真，他们分析了由小组攻击者发起的基于同步的 `DDoS`\
  \ 攻击，并提出了不同的缓解技术来避免这种攻击。\n\nNaik（2012）的论文提出了一种用于检测、缓解和防止此类攻击的新进攻措施。它展示了一种使用 `SYN`\
  \ 和 `ACK` 消息的认证方案，根据节点之间的交换消息来检测 `DDoS` 攻击。该算法通过修改 `TCP` 连接期间 `SYN` 消息的特征来检测 `DoS`\
  \ 攻击，并分析 `SYN` 消息泛洪以及存储结构被填充的情况。为了进行仿真，他使用了 `OMNeT++` 进行网络仿真并使用 `SUMO` 进行流量仿真。\n\
  \n图 10.10 显示了一个 `DDoS` 攻击的示例。属于同一攻击者的多个节点联合对受害者节点 `E` 执行分布式攻击。在接收到大量安全消息后，受害者在处理这些消息时可能会做出错误的决策。\n\
  \n![](img/fig10.10.jpg)\n\n图 10.10\n\nDDoS 攻击。\n\n### 10.5.10 中间人攻击 (#chapter10.xhtml#re_ch-10-sec-26)\n\
  \n中间人攻击发生在攻击者能够更改通过的数据包中的数据而不损坏数据包时。凭借这种能力，攻击者可以在不暴露身份的情况下在网络内部创建虚假场景。通常，攻击者的目的并不是直接危害网络，而是试图从通信中获取某些利益。\n\
  \n图 10.11 显示了一个简单的攻击场景。攻击者节点 `E` 接收到一条关于网络状况的安全消息，但它通过发送错误信息更改了消息的内容。\n\n![](img/fig10.11.jpg)\n\
  \n图 10.11\n\n中间人攻击。\n\nRavi（2014）提出的方法建议，为了保护节点隐私并避免这种攻击，一种解决方案是使用伪名密钥隐藏节点身份，每当节点需要通信时，它就使用其伪名密钥与其他节点通信。他们使用了\
  \ `Network Simulator 2` (`NS-2`）对所提协议进行仿真。\n\nZhang 等人（2008）提出的用于车辆网络的方案基于这样一个前提：`RSUs`\
  \ 负责验证从车辆发送的消息的真实性，并向每个节点通知结果，同时通过防止攻击者在不被察觉的情况下拦截消息来保护用户身份。\n\nMejri 等人（2016）提出了一种车队之间安全通信的方法，使用预先与组成员共享的私密钥以及\
  \ `Diffie‑Hellman` 算法的变体来缓解中间人攻击。为了评估他们的方法，他们使用了 `NS-3` 结合 `SUMO`。仿真改变了所属组节点数量及其速度。\n\
  \n### 10.5.11 抢路攻击 (#chapter10.xhtml#re_ch-10-sec-27)\n\n在按需路由协议网络中，源节点必须泛洪附近的邻居以找到通往目的地的有效路由。攻击者可以利用这种行为并开始泛洪发现以为该连接获取有效路由，从而能够发起其他类型的攻击。\n\
  \n在图 10.12 中，节点 `A` 想要向节点 `G` 发送消息并开始寻找路径。当攻击者节点 `B` 接收到消息时，它启动泛洪并执行其他攻击。在接收到合法消息后，节点\
  \ `G` 丢弃了消息。\n\n![](img/fig10.12.jpg)\n\n图 10.12\n\n抢路攻击。\n\nZapata 和 Asokan（2002）提出的方法展示了\
  \ `SAODVs`，这是用于路由算法 `AODV` 消息交换的两种安全机制。第一个实现数字签名以验证消息的不可变字段，并使用哈希链处理跳数。这些哈希链确保网络中的每个节点都能验证攻击者是否更改了跳数。\n\
  \n抢路攻击防护（`RAP`）是 Hu 等人（2003）提出的防御方法，声称保护网络节点免受抢路攻击。该方法共同使用了了安全邻居检测、安全路由委托和随机“路由请求”转发。\n\
  \n邻居发现通过消息握手进行，以验证邻居节点是否在通信范围内。为了验证 `RAP`，他们通过改变采用的攻击模型进行仿真验证数据包递送率。\n\n\n\n\n在图\
  \ 10.13 中，节点 `A` 和 `G` 正在建立连接，但攻击者位于算法选择的路径中，可以对该连接进行修改并丢弃数据包。\n\n![](img/fig10.13.jpg)\n\
  \n图 10.13\n\n合谋误继攻击。\n\n### 10.5.13 链路欺骗攻击](#chapter10.xhtml#re_ch-10-sec-29)\n\n\
  在以 `OLSR` 作为路由算法的网络中，`HELLO` 和 `TC` 消息允许节点之间通信，向其邻近节点披露邻域状态信息。然而，攻击者可以生成带有虚数据的 `HELLO`\
  \ 和 `TC` 消息，创建一个不同的连接场景并干扰当前的通信，从而形成链路欺骗攻击。\n\n在图 10.14 中，攻击者节点 `F` 通过 `TC` 消息告知节点\
  \ `D`、`E` 和 `G` 节点 `A` 是一个活跃邻居，但这是错误信息，旨在破坏发往节点 `A` 的通信。\n\n![](img/fig10.14.jpg)\n\
  \n图 10.14\n\n链路欺骗攻击。\n\nJeon 等人 (2012) 提出的一种缓解链路欺骗攻击的方法是对 `OLSR` 算法进行某些修改。第一个修改是扩大\
  \ `HELLO` 消息的范围，允许其发送给两跳邻居。所有节点都有一有一个与其两跳邻居的信任表，用于管理这些节点之间的“信任标记”，以应对可能的新的 `MPRs`。通过这些机制，该方法能够缓解攻击，例如添加不存在的节点和删除节点邻居信息。\n\
  \n然而，我们还有另一种方法，不需要对 `OLSR` 算法进行修改，仅根据网络行为提供的节点日志进行工作。Alattar 等人 (2012) 为链路欺骗攻击创建了签名，以便生成的日志能够检测到它。文中提出了一种检测算法，包含了一系列检查规则，并使用了协作信任系统和置信度水平。他们通过网络仿真验证了结果，在仿真中攻击者开始发起链路欺骗攻击。在轮次结束时，攻击者获得了非常低的置信度值，算法能够检测到他们。\n\
  \n### 10.5.14 陷阱攻击](#chapter10.xhtml#re_ch-10-sec-30)\n\n陷阱攻击是一种非常特定的攻击，一组节点可能包含来自被认为对网络非常重要的节点（`VIN`）的重要信息。攻击者试图从该网络的任何节点获取安全信息，以成为内部人员并获取通往\
  \ `VIN` 的路由信息。\n\n为了对抗这种类型的攻击，Lin 等人 (2007) 提出了一种名为 `ASRPAKE` 的协议，为源节点和目的节点之间的路由提供匿名性，并为路由算法集成了密钥交换机制。此外，他们应用了\
  \ `DECOY` 机制来检测受损的节点，同时在网络运行期间 `VIN` 不受影响。对于匿名路由协议，他们使用了基于椭圆曲线密码系统（`ECC`）的环签名方案。\n\
  \n在这种方案中，任何成员都可以检查组中的某一个成员是否签署了给定的消息，但该方案对开销问题产生了严重影响。`DECOY` 引擎允许 `VIN` 选择若干节点作为诱饵，它们都与\
  \ `VIN` 共享一个加密密钥。每当 `VIN` 接收路由请求时，`VIN` 会随机选择一个诱饵来响应请求，保护节点免受可能的安全攻击。\n\n在图 10.15\
  \ 中，一个受损的节点 `A` 被攻击者用作内部人员。\n\n![](img/fig10.14.jpg)\n\n图 10.15\n\n陷阱攻击。\n\n###\
  \ 10.5.15 勒索攻击](#chapter10.xhtml#re_ch-10-sec-31)\n\n在实现信任表的网络中，一组攻击者可能会向其邻居通报某个节点是入侵者，从而破坏网络通信。这种安全攻击被称为勒索攻击。\n\
  \nPerrig 等人 (2002) 提出了一系列用于传感器的协议，包括 `NDEF` 广播、确定性组播和随机组播，以及 `µTESLA` 广播，提供了数据机密性、完整性和新鲜性保护。\n\
  \n在图 10.16 中，攻击者发送消息称受害者在黑名单中，这种行为导致了节点 `E` 服务中断。\n\n![](img/fig10.15.jpg)\n\n图\
  \ 10.16\n\n勒索攻击。\n\n### 10.5.16 节点复制攻击](#chapter10.xhtml#re_ch-10-sec-32)\n\n在认证的机会网络中，可能会出现节点受损导致加密密钥和身份等安全数据丢失。攻击者利用这些信息在网络中创建克隆节点，并可以正常通信。\n\
  \n在图 10.17 中，节点 `A` 遭到破坏且其安全数据泄露。\n\n![](img/fig10.16.jpg)\n\n图 10.17\n\n节点复制攻击。\n\
  \n由于这是 `WSNs` 中的一种常见攻击，许多工作已经实施了缓解方法。Parno 等人 (2005) 提出了一种集中式方案，由基站验证所有节点的位置以寻找克隆节点。之后，节点使用广播、确定性组播和随机组播等多种方法。\n\
  \n### 10.5.17 同步失效攻击](#chapter10.xhtml#re_ch-10-sec-33)\n\n在同步失效攻击中，攻击者位于节点间的通信路径上，对传输层进行修改，伪造包序列号并更改标志位。在尝试重传消息时，节点无法交换消息且连接被完全中断。\n\
  \n在图 10.18 中，节点 `B` 和 `G` 尝试在之间建立连接，尽管攻击者节点 `C` 不断修改序列号，干扰了通信。\n\n![](img/fig10.17.jpg)\n\
  \n图 10.18\n\n同步失效攻击。\n\n### 10.6 结论](#chapter10.xhtml#re_ch-10-sec-34)\n\n在本章中，我们对机会网络中的安全攻击进行了分类。我们介绍了安全属性，并还讨论了多种攻击及其防御方法。在表\
  \ 10.1 中，安全攻击根据受影响的安全属性进行了列举。\n\n关于该主题的研究正在不断增加。未来的工作可能引入环境上下文分析，以帮助推断和检测任何类型的攻击者，并在不同的场景下选择合适的感知上下文方法。\n\
