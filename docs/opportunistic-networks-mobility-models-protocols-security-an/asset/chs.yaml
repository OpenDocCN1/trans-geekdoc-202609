  \ 7.8.9 EAEP\n### 7.8.10 Ack-PBSM\n### 7.8.11 UV-CAST\n### 7.8.12 Streetcast\n##\
  \ 7.9 VANET 中广播协议的比较\n## 7.10 结论\n## 参考文献\n\n## 7.1 引言\n\n本章首先对车载自组接入网络（VANETs）进行概述。内容包括\
  \ VANET 的特性与相似性，以及 VANET 与移动自组接入网络（MANETs）之间的差异。本章讨论了 VANET 的多样化应用以及这些应用的需求。此外，本文还回顾了\
  \ VANET 标准、异构 VANET、针对不同广播方法的各种研究，以及与车载网络中的数据传播和车辆移动模型相关的问题。将根据文献对相关问题面临的挑战和解决方案进行讨论。\n\
  \n车载自组接入网络已成为一种潜在的候选方案，用于连接道路上行驶的其他车辆，并提供无处不在的通信。VANET 可以促进诸如互联网访问、多人游戏和内容分发等通用应用，以及一些新颖的、专门设计的应用。尽管\
  \ VANET 被认为是 MANET 的子类，但它具有一些独特的特征，这使得 VANET 和 MANET 之间有了明显的区别（Moustafa and Zhang,\
  \ 2009）。本节简要描述了这些特征，包括高移动性、动态拓扑、移动建模与预测、定位、大规模网络以及严格的延迟限制。\n\n车辆具有高速行驶的潜力，因此它们之间的通信周期可能非常短。由于车辆具有高移动性的特性，网络拓扑变化迅速且出意之外，导致无线链路频繁且不可预测地中断（Moustafa\
  \ and Zhang, 2009）。VANET 的另一个特征是网络拓扑高度动态化（Bako and Weber, 2011）。例如，在深夜或乡村道路上，交通密度非常低；另一方面，在巨大的高速公路或正中午，可以体验到非常密集的网络。因此，在通信范围内，邻近车辆的数量可能从零到数百个不等。\n\
  \nMANET 的移动性是随机的且不受特定控制，而在 VANET 中，节点在严格规则下跨整个网络移动。这种控制策略使得车辆的位置是可预测的。车载场景最重要的特征之一是传感器节点不允许在区域内自由移动，车辆必须完全遵守其他车辆的移动轨迹和道路布局。也就是说，车辆倾向于绕过形成的群组行驶，且\
  \ VANET 无线接口的无线覆盖范围通常小于群组之间的距离。此外，根据车辆通过的道路类型，交通模式各异。道路拓扑也对车辆的移动造成了严格的限制。换句话说，在移动过程中，节点必须遵守道路网络强加的那些移动模式。道路可分为三类：乡村道路、城市道路和高速公路。\n\
  \n由于其巨大的潜力，这一通信平台将成为智能交通系统（ITS）的重要组成。为专用短距离通信（DSRC）分配独特的频谱、`IEEE 802.11` 的广泛采用、全球定位系统（`GPS`）的普及以及当地监管机构（如欧洲电信标准标准协会（`ETSI`）、加拿大工业部（`IC`）和美国联邦通信委员会（`FCC`）的影响都是\
  \ VANET 快速发展的重大问题。\n\n对于大多数 VANET 应用而言，获取实时更新的位置信息至关重要（Barani and Fathy, 2008; Boukerche\
  \ et al., 2008）。与其他网络不同，在 VANET 中，位置信息很容易获取，因为它们可以应用于车辆中可以简单安装的 `GPS` 系统。通过应用 `GPS`，在\
  \ VANET 中确定车辆的位置是可能的。\n\n在 VANET 中，有数千个节点以每小时高达数十公里的速度行驶。这不是任何其他移动网络的特征，例如无线传感器网络（`WSNs`）或移动自组接入网络（Olarius\
  \ and Weige, 2009）。\n\nVANET 的主要目标是传递安全消息。这些消息必须具有最高优先级，并需要准时传送。由于大多数安全应用依赖广播机制，因此它们对延迟非常敏感。这些机制允许信息以最小延迟进行发布（Hafeez\
  \ et al., 2010）。因此，关键安全信息必须通过为此目的设计的广播机制进行快速转发（Chen et al., 2010a）。\n\n### 7.1.1\
  \ 专用短距离通信（DSRC）标准概述\n\n网络运营商是 VANET 的服务提供者。他们也可以通过政府部门的合作来实现。近期，美国联邦通信委员会（`FCC`）已将\
  \ `5.9GHz` 频率的 `75MHz` `DSRC` 频谱分配给 `V2I` 和 `V2V` 通信（Kenney, 2011）。`DSRC` 频谱被分为七个\
  \ `10 MHz` 的宽道。这种架构允许路侧设备与车辆之间以及近距离车辆之间进行通信（Intl, 2003）。这意味着没有基础设施的支持。另一种替代方案是基于基础设施的技术（`V2I`）。事实上，`V2V`\
  \ 架构包含在 `V2I` 架构中。`V2I` 的方法取决于基础设施，由于成本高昂，在 VANET 开发早期可能无法实现。在车联网联盟（`C2C-CC`）内部，为车载网络提出了参考架构，该参考架构有助于区分两个领域：基础设施域和车载自组域。`IEEE\
  \ P1609.1`、`P1609.2`、`P1609.3` 和 `P1609.4` 标准已由 `IEEE` 完成，用于车载自组网络的测试（Yin, 2004）。\n\
  \n`P1609.1` 标准用于车载环境无线接入的资源管理器（`WAVE`）（IEEE, 2010）。`IEEE 802.11` 标准主要为低移动性网络设计。然而，频繁断开和切换等重大问题已由\
  \ `IEEE 802.11p` 标准的工作组解决（Jiang and Delgrossi, 2008）。为了支持车载网络应用，`IEEE 802.11p` 标准定义了\
  \ `IEEE 802.11` 标准的替代方案。`IEEE802.11p` 使用 `CSMA/CA` 作为链路共享的基本介质接入方案。`IEEE 802.11s`\
  \ 协议利用多阶段请求/清除发送握手以及确认机制来确保单播包的交付。另一方面，广播消息无法使用 `RTS/CTS` 交换，因为这会导致网络冲突（Schmidt\
  \ et al., 2011）。\n\n\n\n\n\n在 VANET 应用的背景下，`DSRC` 已用于开发新类型的应用（Olarius and Weige,\
  \ 2009），这些应用受益于未来车辆将使用的各种硬件组件（输入和输出设备、CPU、导航系统、传感器和无线收发器）的结合。这些类别分为驾驶安全增强、非安全利用和商业意图。\n\
  \n### 7.2.1 安全应用\n\n安全应用旨在提高公共安全，并保护个人免受可能导致生命损失的事件。在安全应用中，安全数据需要传递给预期的接收者（例如正在向危险区域移动的车辆）。VANET\
  \ 应用中最重要的群体是主动安全应用，其目的是减少道路事故中的死亡或受伤人数。安全应用将有关风险位置和状况的信息（例如`道路危险警报通知 (RCHN)`或`碰撞后通知\
  \ (PCN)`）广播给能够从这些信息中获益的车辆，例如避开事故或任何意外事件。主动安全应用依赖于向特定地理区域内的信息广播（Yin et al., 2004）。主动安全应用高度依赖于特定感兴趣区域（RoI）的信息分布（Viriyasitavat\
  \ et al., 2011）。\n\n尽管此类应用发送的消息相对较少，但确保它们立即传递和分发至关重要（Elbatt et al., 2006）。这类应用的最低频率为`1\
  \ Hz`（Olariu and Weige, 2009）。\n\n### 7.2.2 非安全应用\n\n非安全应用提高了驾驶员的便利性和效率。与不处理大量数据的安全应用不同，非安全应用需要处理更高量的信息（Chen\
  \ et al., 2010b）。使用驾驶效率应用可以减少旅行时间。它们分发有关道路和交通状况的信息，使驾驶员能够避免交通密度高或拥堵的道路。如果驾驶员拥有通往目的地道路的信息，他们可以通过应用汽车导航系统选择交通最少的路线来节省时间。在许多情况下，如汇入交通流或寻找空车，舒适应用（如驾驶效率应用）可以帮助驾驶员。非安全应用定期交换信息。这些信息与车辆传感器从相邻车辆接收的信息汇总，并在经过所有处理阶段后，信息被分发给其他车辆。因此，与安全应用不同，舒适应用并不施加严格的时间限制。然而，它们也需要在其直接邻范围内定期交换信息和数据。\n\
  \n### 7.2.3 商业应用\n\n商业应用提供了一些服务，如广告、网络访问和娱乐。此外，这些应用还包括地图下载（用于导航系统）、视频流和远程车辆诊断等。与安全和非安全应用不同，商业应用严重依赖于单播通信（Schoch\
  \ and Kargl, 2010）。\n\n### 7.3 VANET 中的数据转发与传播\n\n监控依赖 VANET 的不同应用发现，许多应用需要建立单播通信。由于节点数量很多且网络拓扑变化迅速，发送者可以在不知道接收者的情况下发送消息，可以在改变网络拓扑的情况下发送消息。在许多情况下，可以定义接收者，例如位于发送者前方或后方的、或者能够提供特定服务的接收者。此外，某些应用依赖于本地广播，这可以被视为一种一对多的应用：紧急信号抢占、SOS\
  \ 服务和碰撞后警告（Olariu and Weige, 2009）。因此，VANET 中的通信分为三类：单播、多播和广播。\n\n### 7.4 同构与异构车载自组织网络\n\
  \n无线网络路由简化的假设是该领域大多数研究的基础。该假设认为所有车辆都具有相同的通信范围（同构，Homogeneous），且该范围由固定数字 `R` 表示。因此，网络中所有现有的链路（称为双向链路\
  \ `Bidirectional Links (BL)`）都有两个方向，并且它们可以在两个方向上完美运行。这意味着如果节点 `R` 能够一跳到达节点 `S`，那么节点\
  \ `S` 也可以一跳到达节点 `R`，这在[图 7.1]中已证实。然而在现实生活中，具有不同特征的车辆具有异构的通信范围。这可能是由于拓扑控制算法的差异、收发器硬件的异构性，或者车辆高度（如公交、卡车和汽车）的不同（Li\
  \ et al., 2004）。\n\n![](img/fig7.1.jpg)\n\n图 7.1\n双向链路。\n\n单向链路的另一个原因是干扰，干扰可能比另一个节点更靠近其中一个节点。这防止了附近的节点获取发送给它们的一些数据包。这种干扰产生可能是其他节点的传输，或者源来自其他设备（如工作在重叠频率上的`干扰器`）的传输。虽然这种干扰更有可能产生短暂的单向链路，但由不同无线范围设备组成的网络对于给定的节点位置也可能存在永久的单向链路（Zhang\
  \ et al., 2004）。\n\n如果节点 `R` 无法到达节点 `S`，但节点 `S` 能够到达节点 `R`，则这两个节点之间的链路就有一个方向（单向）。被认为是单向的网络由单向链路组成。由于发射功率差异导致的单向链路\
  \ `Unidirectional Link (UL)` 实例如图[图 7.2]所示。\n\n![](img/fig7.2.jpg)\n\n图 7.2\n单向链路。\n\
  \n### 7.4.1 单播通信\n\n\n\n\n单播（或点对点）通信协议基于地理位置[例如，用于移动性的距离路由效应算法 (DREAM) (Basagni\
  \ and Chlamtac, 1998) 和贪心边界无状态路由协议 (GPSR) (Karp and Kung, 2000)]，或基于拓扑结构[例如按需 ad\
  \ hoc 距离向量协议 (AODV) (Perkins and Royer, 1999) 和优化链路状态路由协议 (OLSR) (Clausen et al.,\
  \ 2004)]。在基于拓扑结构的路由协议中（如 `AODV` 和 `OLSR`），网络拓扑结构有助于消息的路由。在基于地理位置的协议中，对邻居节点位置的了解会影响转发决策。由于某些位置服务，邻居节点可以获取位置信息，这些服务通常依赖于一对多的通信机制。然而，当两辆车辆之间的通信持续较长时，可以采用点对点通信。尽管如此，在高度动态的网络（如\
  \ `VANETs`）中，这种两车之间的长通信并不常见。此外，`VANET` 应用中很少需要点对点通信（Tonguz et al., 2010）。\n\n###\
  \ 7.4.2 多组播通信\n\n在组播路由协议中，通过构建网格或树结构来连接发送者和接收者。某些车辆作为组播消息的“转发者”。尽管这些车辆对组播消息感兴趣，但它们充当了路由器。在基于树的多组播中[例如按需组播\
  \ ad hoc 距离向量协议 (MAODV) (Souza et al., 2013) 和 ad hoc 路由协议 (AMRoute) (Xie et al.,\
  \ 2002)]，发送者向 `VANET` 中的所有车辆泛洪消息，只有对接收消息感兴趣的车辆才会通过反向路径回复。为了解决基于树的多组播的鲁健性问题，人们提出了基于网格的多组播协议[例如按需组播路由协议\
  \ (ODMRP) (Zhao et al., 2003)、基于组头部的多组播 (GHM) (Hsieh and Wang, 2011)、拓扑多组播路由协议 (ToMuRo)\
  \ 和地理多组播路由协议 (GeMuRo) (Santos et al., 2007)]。它们使用替代路径来避免拓扑频繁变化引起的影响。\n\n### 7.4.3\
  \ 广播通信\n\n这类通信是 `VANET` 内信息分发最方便的方式。车辆接收到的消息会被重新传输给相邻车辆。这确保了消息尽可能被多的车辆接收。这种通信可以很好地应用于位置服务（Peng\
  \ and Cheng, 2007）。在对多的通信机制中，每辆车辆偶尔会发布关于自身的信息。消息一旦送达车辆，车辆会立即存储消息并转发。由于网络中存在大量信息和消息流，显然这种机制无法进行扩展，特别是在高流量密度的场景下。通过\
  \ `IEEE 802.11` 标准，Neves 等人（2010）提出。\n\n### 7.5 车载自组织网络中的广播\n\n为了实现舒适和安全的驾驶，车辆之间可以交换数据。已经开发了许多应用，这些应用依赖于远距离数据。路由是指数据包通过多跳步骤从源点到目标的远距离交付。然而，数据传播是指将数据发布到特定区域内的所有节点。\n\
  \n另一种观察 `VANETs` 中广播的方式是将其视为网络中的受控泛洪。假设存在一个高密度网络，且在该密度网络中车辆检测到了某个事件。然后车辆尝试通过向其他车辆广播数据来告知它们该事件。现在，当有大量候选者要转发和广播这些数据时，共享无线信道会出现过载。因此，必须有一个良好的转发策略，以防止无线信道拥塞。此外，安全消息具有广播性质，需要确保它们的准时可用性。因此，为了避免信道过载，需要通过采用的数据分发技术尽可能地减少不必要的重播。\n\
  \n基于网络密度假设的广播协议分类如图 7.3 所示。在此基础上，可以分为三个不同的类别：考虑良好连接网络的广播协议、考虑碎片化车载自组织网络的广播协议，以及同时考虑碎片化和连接网络的协议。通过使用特定的假设条件，每个类别对应相应的协议。\n\
  \n图 7.3  \n\n车载自组织网络中的广播协议分类。\n\n### 7.6 连接车载自组织网络的分发协议\n\n\n\n对于广播数据包，车载自组织网络（VANETs）中存在不同的协议。泛洪算法（Flooding）是最简单的技术。在泛洪技术中，每个节点在首次接收数据包时都会重播。在这里，广播总数等于\
  \ `N-1`，其中 `N` 代表车辆总数。尽管泛洪是一种简单的技术，但它可能会导致一些问题。首先，当节点尝试向邻居节点转发数据包，而它们预先接收了该数据包时，就会发生冗余重播，这将导致冗余传输。\n\
  \n其次，当邻居节点接收数据包并尝试重播该数据包时，在介质层会发生竞争。这将导致移动网络中的碰撞、冗余和竞争。这种现象被称为广播风暴问题。在此类问题中，协议的主要目标是限制重播次数，从而缓解广播风暴问题。基于拓扑结构和基于启发式的协议是本节中协议的两大类。\n\
  \n### 7.6.1 启发式\n\n启发式广播方法需要参数选择和阈值选择，这些方法通常与自组织网络（ad hoc networks）环境相关。这些方法的性能取决于启发式中的阈值以及所选参数（Williams\
  \ and Camp, 2002）。\n\n#### 7.6.1.1 基于概率的\n\n在基于概率的方法中，为了减少数据包的冗余并避免碰撞，消息的重播由车辆根据某种概率来决定。静态泛洪协议（Static\
  \ gossiping）是基于概率的方案之一，用于增强泛洪效果。为了转发消息，它应用了全局定义的概率（Haas et al., 2002）。如果预先已知且静态的网络特征，那么所有这些变体都能正常工作。否则，结果将是较低的交付率或产生大量的冗余消息。为了解决这些问题，研究人员开发了自适应泛洪方法。Haas\
  \ 等人（2002）提出了一种具有两个阈值的方案。对于静态泛洪，该方案是基于邻居节点数量的扩展。如果一个节点有 `n` 个邻居，则该节点将以 `P1` 的概率转发数据包。`n`\
  \ 是阈值，如果节点的邻居数量少于此阈值，则使用更高的概率 `P2` 来转发消息。这种改进的一个巨大优势是它防止了消息在连接稀疏的网络中消失，因为在这些网络中，转发概率大于密集网络中的转发概率。Haas\
  \ 等人（2002）还提出了第二种改进，可以防止消息的消亡。如果一个节点有 `n` 个邻居且概率为 `p`，那么每个消息从其邻居处被接收 `p.n` 次。\n\n\
  优化自适应概率广播（OAPB）（Alshaer and Horlait, 2005）是一种设计用于缓解广播风暴问题的基于概率的协议。在 OAPB 中，根据区域内车辆的密度为节点分配重播概率。为了这一目的，OAPB\
  \ 利用了双跳邻居信息。这些信息只能通过单跳邻居获取。\n\nAutoCast 协议（Wegener et al., 2007）的功能与 OAPB 类似。AutoCast\
  \ 和 OAPB 之间的区别在于使用了不同的方程。\n\n#### 7.6.1.2 基于计数器的\n\n在此类方法中，定义了一个计数器 `C`。当接收到消息时，计数器\
  \ `C` 增加。当 `C` 超过阈值时，数据包被丢弃。\n\nTseng 等人（2001）提出了一种基于计数器的方案。其机制是设置一个随机超时。当超时结束时，仅当计数器未超过某个值时才转发消息。\n\
  \n#### 7.6.1.3 基于延迟的\n\n在此类方法中，为了消除不必要的重播，使用了智能泛洪算法。为了最大化可达节点，选择一组中继节点而非所有节点。城市多跳广播（UMB）是一种基于延迟的\
  \ V2V 协议，包含两个阶段：交叉和定向。通信范围内的路段被分为等长长度。只有方向道路被划分。转发任务被分配给车辆。然而，在高密度场景下，最远端可能存在多个车辆。在这种情况下，最远端被分为更小的子段。然后，为了选择最远子段中的车辆，开始新的迭代。当车辆收到转发请求时，它们会计算到源节点的距离。根据距离，每个车辆在短帧间隙（SIFS）期间发送干扰信号（黑暴信号）。\n\
  \n传输范围自适应广播（TRAB）是另一种基于延迟的 VANET 广播算法（Wu et al., 2010）。该算法考虑了车辆的通信范围以及车间距。TRAB 算法计算等待时间，以决定符合邻居节点额外覆盖区域的中继车辆。这是为了减少转发紧急包的中继节点数量。此外，它采用了两种类型的机制来确保分发的可靠性。这些机制被自适应地称为显式确认和隐式确认。数据通过这些机制基于双向车道进行转发。\n\
  \n### 7.6.2 基于拓扑\n\n基于拓结构的广播可以分为两类：基于强制的方法和本地决策方法。在本地决策方法中（也称为接收者基于或响应的方法），每个节点的决策是独立的。节点自行决定是否广播或转发特定的消息。相比之下，在基于强制的方法（也称为发送者基于或主动的方法）中，则由其他节点来决定是否转发消息。这些其他节点可以是先的中继节点或簇头。\n\
  \n#### 7.6.2.1 本地决策\n\n\n\n\n这种方法根本基于这样一个观点：节点利用邻居连通性和消息已经访问过的节点的历史；通过这种方式，节点可以决定自己是否为转发节点。Wu\
  \ 等人（2010a）提出了一种通用方案。目前大多数基于本地决策的方法都被该方案所涵盖。访问节点的历史和邻居连通性是该方案的基础。每个节点的 `k-hop` 邻居包含某些信息，这些信息将通过与每个节点交换信息来建立。这些信息通过单跳邻居之间的周期性\
  \ hello 消息进行交换。节点的属性信息（如节点度、先前访问的节点列表和 `node ID`）被添加到广播消息中。根据这类信息，将决定是否应该转发消息。带有自剪枝的泛洪或邻居覆盖方案的泛洪是最直观的基于本地决策的方法（Chiang\
  \ 等人，2005）。发送者的单跳邻居列表由发送者自身进行寄载。这种寄载发生在每一个传输的广播消息中。如果接收者可以覆盖额外的节点，则消息会立即转发。这些额外节点是发送者节点之外的节点。可扩展广播算法（`SBA`）使用了一种转发策略，它类似于邻居覆盖方案（Khan\
  \ 等人，2008a）。然而，存在以下两点不同：首先，节点的单跳邻居列表没有插入数据消息中，而是插入 hello 数据包中。其次，消息不会被节点立即转发，而是由节点启动一个随机评估延迟（`RAD`）。在等待期间，节点会为每个邻居转发重新计算额外覆盖范围。当随机评估延迟过期时，如果重新计算的额外覆盖未达到零值，则该节点被视为转发节点。在\
  \ `SBA` 中，`RAD` 的自适应取决于节点的度。`SBA` 协议的一个变体是 `Scoped Flooding`。转发条件在 `RAD` 过期后发生变化。每个\
  \ `RAD` 都有一个固定的比例，如果未被覆盖的邻居多于这个固定比例，则由该节点转发消息。\n\nStojmenovic（2004）引入的算法只需要两跳邻居。如果存在两个互不连接的邻居，则主导集将包含该节点。唯一转发消息的节点是属于\
  \ `CDS` 的节点。为了检测邻居之间是否存在任何连接，单跳邻居的信息就足够了。但只有当节点本身知道节点的位置时，这些信息才是足够的（Stojmenovic,\
  \ 2004）。\n\n#### 7.6.2.2 强制决策\n\n在这些协议中，发送者的广播消息指定了哪些邻居必须执行重播。这类协议被称为确定性广播方法。确定性方法明确选择一个邻居子类作为转发节点。这些被选中的邻居可以到达预期目的地，这些目的地本应由所有节点共同到达。因此，中继节点需要至少知道其单跳邻居。由于寻找最小尺寸子集被认为是\
  \ `NP-hard`，因此使用了启发式方法。因此，可以处理风暴问题。\n\n文献中存在一些确定性方法的示例：\n-   基于类的方法（Lou and Wu,\
  \ 2004）\n-   全主导剪枝（Lou and Wu, 2003）\n-   多点继（`MPR`）（Qayyum 等人，2002）\n-   主导剪枝（Lim\
  \ and Kim, 2001）\n\n尽管确定性广播非常高效，但它也有一个明显的缺点。缺点是中继节点代表了单点故障。如果转发任务由于任何原因（如节点故障或超出范围）而失败，那么消息接收率可能会大幅下降。因此，它们不适用于动态环境。`MPR`\
  \ 背后的核心思想是消息转发的策略（Plesse 等人，2005）。在该策略中，发送者选择一个单跳邻居子集，以覆盖两跳邻居。在 `MPR` 中，节点将单跳邻居列表插入到它们的\
  \ hello 数据包中。结果是确保了对两跳邻居的感知。广播消息仅由此列表中的节点转发。与 `MPR` 类似，通过使用 hello 标兵，接收者选择了指定的转发者。此外，这种选择的另一个依据是对被发送者广播此前覆盖的邻居的了解。\n\
  \n双覆盖广播（`DCB`）是 Lou 和 Wu（2004）提出的一种广播方案，它包含一种特定的转发节点选择策略。在该策略中，首先覆盖发送者的两跳邻居，然后发送者的单跳邻居要么是非转发节点，或是转发节点，但无论如何，至少有两个转发邻居覆盖了它们。仿真结果表明，`DCB`\
  \ 在高传输错误率的广播操作环境中提供了良好的性能。\n\n### 7.7 针对分叉车载自组织网络的路由方法\n\n由于 VANETs 中经常出现分区现象，大多数节点对之间可能不存在车辆连接。在这种情况下，许多传统广播协议的失败是不可避免的。这部分研究将分配给分叉网络路由方案的审查。\n\
  \n\n\n\n在农村地区或深夜流量较小的情况下，车载自组织交通网络（VANETs）可能会出现分段现象。这些场景发生在距离最近的车辆之间距离很大，且该距离大于通信范围时。因此，对于某些节点来说，广播将会终止（Chen\
  \ 等，2010a）。在这样的网络场景中，作为一种可行的方案，人们提出了“存储-携带-转发”（store carry forward）方案。通过存储-携带-转发方案，节点接收到的数据包在运动期间会被存储并携带，并在遇到其他节点时将该数据包转发给它们。\n\
  \n### 7.7.1 流行病路由 (Epidemic) #chapter7.xhtml#re_ch-7-sec-22\n\n流行病路由协议用于在大多数时间断开连接且具有移动节点的网络中传输消息（Hayel\
  \ and Tembine, 2007）。每条消息都有一个 ID，每个节点都维护该 ID 的摘要向量。但每个节点只维护之前接收到的消息。当两个节点建立接触时，首次交换的是这些反熵（anti-entropy）会话中存在的摘要向量。在接触中，节点比较消息\
  \ ID，然后识别出尚未接收的消息，并确定是否需要从另一个节点获取这些消息。接触还有第二个阶段，在这一阶段，节点之间会进行消息交换。每条消息都有一个限制，该限制被称为存活时间（`TTL`）字段。消息可以经过的接触次数受该字段限制。当消息的\
  \ `TTL` 值为“1”时，该消息将仅转发到目的地。流行病路由的主要问题是由于需要到达目的地的消息会对整个网络造成泛洪（flooding）。这会导致对传输时间以及缓冲区空间的争用（Chigira\
  \ and Higaki, 2011）。\n\n### 7.7.2 VADD #chapter7.xhtml#re_ch-7-sec-23\n\n车辆辅助数据交付（`VADD`）是一种用于共享、存储和转发数据包信息的协议（Zhao\
  \ and Cao, 2008）。如果邻居节点不够可靠，它们会等待另一个更可靠且在通信范围内的节点。然而，它们的意图是尽早地转发消息。此外，数据包遵循哪条道路的决策是根据道路和车辆信息做出的，包括最大允许速度、下一个路口距离和当前速度。\n\
  \n车辆辅助数据交付的主要目标是选择数据包交付中延迟最小的路径。持有消息的节点有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由（straightway\
  \ routing）。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由，intersection routing）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。在上述两种情况下，持有消息的节点都有一个位置，这个位置会影响协议的行为。考虑的情况有两种：路由消息的节点位于道路中间，以及这些节点位于路口处。对于第一种情况，可选方案较少，也被称为直路路由。可选方案要么将数据包转发到上一个路口，要么转发到下一个路口。然而，第二种情况（也被称为路口路由）比直路要复杂得多。这种复杂性的原因是路口处需要考虑不同的道路，这导致了选项的数量增加。\n\
  \n### 7.7.3 喷洒等待 (Spray and Wait) #chapter7.xhtml#re_ch-7-sec-24\n\n流行病路由协议用于在大多数时间断开连接且具有移动节点的网络中传输消息（Hayel\
  \ and Tembine, 2007）。每条消息都有一个 ID，每个节点都维护该 ID 的摘要向量。但每个节点只维护之前接收到的消息。当两个节点建立接触时，首次交换的是这些反熵（anti-entropy）会话中存在的摘要向量。在接触中，节点比较消息\
  \ ID，然后识别出尚未接收的消息，并确定是否需要从另一个节点获取这些消息。接触还有第二个阶段，在这一阶段，节点之间会进行消息交换。每条消息都有一个限制，该限制被称为存活时间（`TTL`）字段。消息可以经过的接触次数受该字段限制。当消息的\
  \ `TTL` 值为“1”时，该消息将仅转发到目的地。流行病路由的主要问题是由于需要到达目的地的消息会对整个网络造成泛洪。这会导致对传输时间以及缓冲区空间的争用（Chigira\
  \ and Higaki, 2011）。\n\n### 7.7.4 移动空间 (MobySpace) #chapter7.xhtml#re_ch-7-sec-25\n\
  \n在 `MobySpace` 中，距离近的节点比距离遥远的节点更容易产生接触。转发算法在与距离更近的节点接触时，决定是否转发消息（Leguay et al.,\
  \ 2006）。消息通过 `MobySpace` 采取路径，以便更接近目的地。已经提出了几种用于衡量移动模式相似性的距离度函数。如果节点显示出稳定的移动模式，那么\
  \ `MobySpace` 的方法就是有效的。当当前节点与目的地具有相似的移动模式时，`MobySpace` 可能会失效。然而，由于轨迹同步的结果，很难与目的地直接接触（Leguay\
  \ et al., 2007）。\n\n### 7.8 适用于连接和分段车载自组织交通网络的广播协议 #chapter7.xhtml#re_ch-7-sec-26\n\
  \n仅开发了少数几种广播协议可以在连接和分段条件下条件下工作。本节将回顾这些协议。\n\n### 7.8.1 区域地理 (IVG) #chapter7.xhtml#re_ch-7-sec-27\n\
  \n\n\n\n\n车间地理广播（`IVG`）是一种基于计时器的车用自组织网络（VANETs）安全消息传输分发协议（Bachir and Benslimane,\
  \ 2003）。如果高速公路上发生任何事件或事故，所有车辆都会通过 `IVG` 获取信息。车辆的位置和方向是决定风险区域的因素。对于任何事件或事故，相关区域由该协议确定。受限制的广播组被称为多播组。行驶方向、速度和位置是动态定义多播组的参数。车辆收到的消息不会立即由其重播。在重播之前，必须有一个延迟时间。如果车辆在延迟时间过期后没有收到具有相同\
  \ `ID` 的消息，该车辆将自己任命为中继节点并开始重播该消息以通知其他车辆。公式 7.1 用于计算延迟时间。\n\n$$\n\\text{Defertime}\\\
  left( x \\right) = \\text{Maxdefertime}.\\left( \\frac{R^{\\varepsilon} - Dsx^{\\\
  varepsilon}}{R^{\\varepsilon}} \\right)\n$$\n(7.1)\n\n其中 `Dsx` 是节点 `s` 和 `x` 之间的距离，`R`\
  \ 是通信范围。`IVG` 的假设是所有车辆具有相同的通信范围。`IVG` 减少了不必要的安全消息数量。`IVG` 通过在每个行驶方向上动态维护一个中继节点来完成此任务。此外，`IVG`\
  \ 定期重播安全消息以解决网络分化问题。\n\n### 7.8.2 DRG\n\n分布式健壮地理广播（`DRG`）是一种完全分布的广播方法，它考虑了网络分化问题（Joshi\
  \ et al., 2007）。转发区域由 `DRG` 定义，感兴趣区域被该区域包围。转发区域被定义为车辆在转发地理广播消息时需要满足的一系列地理标准。`DRG`\
  \ 的基础是基于退避方案，用于中继节点的选择。此外，`DRG` 是一种完全分布的协议。\n\n在基于距离的退避时间之后，车辆在接收到安全消息时为每个节点调度一个传输时间。\n\
  \n$$\nBo_{d}\\left( {R_{tx},d} \\right) = MaxBo_{d}.S_{d}\\left( \\frac{R_{tx} -\
  \ d}{R_{tx}} \\right)\n$$\n(7.2)\n\n在公式 7.2 中，`S[d]` 是距离敏感因子，`BO[d]` 是退避时间，`maxBO[d]`\
  \ 是最大退避时间，`R[tx]` 是通信范围。为了处理网络的临时分化，`DRG` 应用了数据包周期重传。该任务一直持续到被新的中继节点传输为止。这实际上是对上一个中继节点的确认。当一个节点在时间\
  \ `t` 发送消息时，该节点将在时间 `t + maxBO[d]` 调度一次重传。\n\n### 7.8.3 DV-CAST\n\nDV-Cast 应用了三种类型的轻量级抑制技术：时隙\
  \ p-持久性、时隙 1-持久性和加权 p-持久性（Tonguz et al., 2010）。在这些技术中，为了计算转发概率和/或重播前的等待时间，使用了轻量级分布式算法，而不是阈值值。加权\
  \ p-持久性技术使用两辆车之间的相对距离来计算重播概率。转发概率 `P[ij]` 由公式 7.3 确定，其中 `D[ij]` 是车辆 `i` 和车辆 `j`\
  \ 之间的距离，`R` 是通信范围。\n\n$$\nP_{ij} = \\frac{D_{ij}}{R}\n$$\n(7.3)\n\n与基于泛洪方案或 p-持久性方案相比，加权\
  \ p-持久性为距离发送者更远的节点分配更高的概率。这种方法没有考虑到密度，因此当网络密度很高时，消息会被距离较远的节点重播。\n\n### 7.8.4 Mobicast\n\
  \n在高速公路的情况下，有一种名为 `mobicast` 的广播协议。该协议支持便利性和安全类应用（Chen et al., 2010b）。`mobicast`\
  \ 假设网络中为零基础设施。在时间 `t`，消息通过 `mobicast` 从某一特定车辆分发到特定区域内的所有车辆。`mobicast` 可以分为两种不同的机制：存储携带转发和多路转发。`mobicast`\
  \ 定义了两个不同的区域：转发区域 (`ZoF`) 和相关性区域 (`ZoR`)。转发区域指示哪些车辆必须携带数据包向前转发，而相关性区域则指示哪些车辆是消息接收候选者。\n\
  \n### 7.8.5 DECA\n\n车载自组织网络的密度感知可靠广播（`DECA`）专为城市和高速公路场景设计（Na Nakorn and Rojviboonchi,\
  \ 2010b）。通过利用周期性信标，该协议收集局部密度。`DECA` 有两个列表：广播列表和邻居列表。对于所有单跳邻居，标识位于邻居列表中。它还识别了它们的局部密度。广播消息的等待时间和广播消息本身由广播列表维护。`DECA`\
  \ 选择密度最高的车辆发送消息。如果选定的车辆是源车辆，则选择另一辆。每个节点的等待时间是一个随机数。\n\n### 7.8.6 POCA\n\n位置感知可靠广播协议（`POCA`）是一种解决\
  \ VANET 中广播风暴问题的广播协议（Na Nakorn and Rojviboonchi, 2010a）。此外，它设计用于间歇性网络。它利用自适应信标技术获取单跳邻居的速度和位置信息。`POCA`\
  \ 假设网络中所有车辆具有相同的通信范围。`POCA` 中的中继选择基于车辆与选定节点之间的距离。选定的节点立即重播数据包。如果选定的节点不重播数据包，将选择其他节点作为备选。`POCA`\
  \ 的等待时间根据先驱节点与车辆之间的距离计算。\n\n### 7.8.7 EDB\n\n高效定向广播协议（`EDB`）是一种用于车载自组织网络的基于方向和距离的广播协议，它应用了定向天线（Li\
  \ et al., 2007）。在 `EDB` 中，最远的接收者负责在消息到达反方向时传播。固定定向天线是 `EDB` 中每辆车辆的设备，这些天线的波束宽度约为\
  \ 30 度。这些天线有两个安装点，一个在后，一个在前。由于车载自组织网络具有高度动态性，`EDB` 通过接收器决策来向高速公路反方向转发数据包。`EDB` 根据公式\
  \ 7.4 计算等待时间。\n\n$$\n\\text{Waiting}\\\\,\\text{Time} = \\left( {1 - \\frac{D}{TR}}\
  \ \\right)*maxWT\n$$\n(7.4)\n\n最后一辆车辆发送确认信号以通知发送者。\n\n### 7.8.8 SRD\n\n\n\n\n\n\
  简单稳健传播（Simple and Robust Dissemination, SRD）是一种用于公路场景的广播协议（Schwartz 等人，2011）。简单稳健传播协议假设了车间通信。在\
  \ SRD 中，时隙分配是优化的时隙 1-持久久性算法。该技术的工作原理如下：当车辆 `j` 沿消息方向移动时，该车辆从车辆 `i` 处接收到一条消息。然后，根据公式\
  \ 7.5 计算 `PDij` 距离，即两个车辆之间的距离。SRD 假设车辆的通信范围相同。\n\n$$\n$$PD_{ij} = \\left\\lbrack\
  \ \\frac{min\\left( {D_{ij},R} \\right)}{R} \\right\\rbrack$$\n$$\n(7.5)\n\n其中 `R`\
  \ 是通信范围，`D [ij]` 是车辆 `i` 和 `j` 之间的距离。分配给车辆 `j` 的时隙数 `S[ij]` 通过公式 7.6 计算。\n\n$$\n\
  $$S[ij] = NS * (1-PD[ij])$$\n$$\n(7.6)\n\n其中 `NS` 是时隙的总数。SRD 将车辆分为两个不同的类别。尾部状态：与其它车辆无任何连接的车辆，以及位于消息方向上距离较远的车辆被称为簇尾部。非尾部状态：归类为此状态的车辆至少有一个邻居。归类为第二类的车辆有两种责任：当接收到消息时，如果接收车辆位于消息方向上，则该车辆重新广播该消息；相反，如果车辆不在消息方向上，则丢弃该消息。\n\
  \n### 边缘感知流行协议 (EAEP)\n\nEAEP (Nekovee, 2009) 为车载移动网络（VANETs）设计，旨在解决公路场景下的广播风暴问题。EAEP\
  \ 是一种假设车辆之间存在端端连接的流行协议。它通过省略信标包交换来减少开销。EAEP 利用 `GPS` 确定每个车辆的位置信息。每个节点在接收广播消息中的新数据包时将其地理位置附加其中以撤回\
  \ hello 包。每个节点被分配一个随机等待时间。该等待时间根据与源的距离指数级选择。该随机等待时间根据公式 7.7 从区间 `[0, T [max]]` 中选择。\n\
  \n$$\n$$T_{max} = \\min\\left\\{ \\begin{array}{l} {\\\\frac{T_{0}}{u}\\exp\\left(\
  \ \\frac{\\left| {x_{rec} - x_{sou}} \\right|}{L} \\right)} \\\\\\\\ {T_{min} =\
  \ \\frac{T_{0}}{2u}\\operatorname{}} \\\\ \\\\ \\end{array} \\right.$$\n$$\n(7.7)\n\
  \n在公式 7.7 中，`U` 用于表示数据包的“紧急程度”，`T [0]` 和 `L` 是与协议相关的参数。当分配的等待时间过期时，车辆计算来自前方和后方节点接收的数据包数量。然后，该车辆根据计数之间的差异决定是否重新广播该数据包。\n\
  \n### 无确认无广播 (Ack-PBSM)\n\nAck-PBSM (Ros 等人，2009) 是该协议在高度移动和静态场景（PBSM）中的扩展（Khan\
  \ 等人，2008b）。为了在连接良好的网络中进行广播，Ack-PBSM 使用了连通的主导集。它可以应用于城市和公路场景。广播数据包的确认由该协议处理。在周期性信标中，这些确认被附加其中。函数\
  \ `t [oev]` 在任何重传可能之前为每个车辆分配一个等待时间。`t [oev]` 的值可以通过公式 7.8 计算。\n\n$$\n$$t_{oev} =\
  \ \\frac{1}{\\left| N \\right|}$$\n$$\n(7.8)\n\n其中 `|N|` 是 `N` 中元素的数量，并指示节点是否在 `CDs`\
  \ 中。为了处理临时的网络分段，该协议采用了存储-携带-转发（store carry forward）的方法。\n\n### 城市车辆广播 (UV-CAST)\n\
  \nUV-CAST 是一种为城市场景设计的广播协议（Viriyasitavat 等人，2011）。该协议的假设是车间通信，且不涉及任何基础设施的支持。通信有两种传输范围：非视距和视距。在这一协议中，通信只能发生在处于相应通信范围内的两辆车辆之间。具有最短愈时间的节点被分配执行存储-携带-转发的任务。当第一次接收到消息时，节点为其所有邻居计算角度\
  \ `θ`。然后根据公式 7.9 和 7.10 计算最大 `θ^+` 角度和最小 `θ−` 角度。\n\n$$\n$$θ− = min(θ[i]),0$$\n\
  $$\n(7.9)\n\n$$\n$$θ^+ = max(θ[i]),0$$\n$$\n(7.10)\n\n$$\n$$If θ^+ + θ− < π then\
  \ A=SCF Task\n$$\n(7.11)\n\nUV-CAST 通过公式 7.11 根据 `θ^+` 和 `θ−` 角度选择边界车辆，以便将其分配给存储-携带-转发任务。这一过程给该协议带来了开销和高复杂性。在交通密度高和等的情况下，存储-携带-转发任务被分配给许多车辆。UV-CAST\
  \ 在接收新数据包时使用基于计时器的方法，车辆根据公式 7.12 计算等待时间。UV-CAST 为公路和交叉口使用了两个独立的公式。\n\n$$\n$$T_i\
  \ = \\left\\{ \\begin{array}{l} {\\\\frac{1}{2}\\left( {1 - \\frac{d_{ij}}{R}} \\\
  right)T_{max}}\\,\\text{如果 } i\\text{ 在交叉路口}} \\\\\\\\ {\\frac{1}{2}\\left( {2 -\
  \ \\frac{d_{ij}}{R}} \\right)T_{max}}\\,\\text{否则}} \\\\\\\\ \\end{array} \\right.$$\n\
  $$\n(7.12)\n\n其中 `T [max]` 是最大等待时间，设置为 `400ms`，`R` 是通信范围，`d [ij]` 是车辆 `j` 和车辆 `i`\
  \ 之间的距离。如果计时器过期且车辆 `i` 未接收到重复数据包，则执行重广播，否则丢弃该数据包。\n\n### Streetcast\n\n\n\n\nStreetcast\
  \ 是一种用于车载自组织网络（VANETs）的城市广播协议，旨在解决广播风暴问题，它假设车辆具有相同的通信范围（Yi 等，2010 年）。Streetcast\
  \ 的三个组成部分是自适应信标控制、多播请求发送（MRTS）握手以及中继节点选择。在中继节点选择方面，应用了单跳邻居信息和数字街地图信息。MRTS 机制用于保护消息的传输。邻居之间的信息交换利用了问信标（hello\
  \ beacons）。同时，提出了一种自适应信标控制启发式算法，用于动态调整传输信标的数量。为了减少冗余，采用了多点中继（MPR）作为广播策略以减少中继节点的数量。由于车辆沿街道分布，通过应用数字街地图可以简化\
  \ MPR 的选择。每个路侧单元（RSU）和车载单元（OBU）都维护着邻居表。对于每条路，RSU 维护一个邻居列表，而 OBU 则仅为前进和向后两个方向维护两个邻居列表。该研究假设每辆车辆配备了\
  \ GPS 以获取位置信息。VANET 中的每个节点都会定期广播“Hello”消息。该信标包含节点 ID、时间戳和位置。当节点收到“Hello”信标时，节点会检查数字街地图，然后在邻居列表中更新邻居信息。\n\
  \n## 7.9 VANETs 中广播协议的比较\n\n在上一节中，回顾了多种用于车载自组织网络中信息传播的广播协议。这些协议的分类如 [表 7.1] 所示。\n\
  \n所有讨论的协议都假设了相同的通信范围和双向链路。冗余广播的减少通过发送者与中继节点之间的距离来实现。尽管已经有了针对 VANET 的不同广播协议，但大多数只能在特定的网络场景下运行，例如高速公路或仅限城市区域。迫切需要一种对网络场景无假设的终极协议，能够在不同的道路拓扑（如高速公路和城市）中运行。\n\
  \n[表 7.2] 显示了这些广播协议在 VANET 中的优缺点。\n\n大多数广播协议根据与源的距离选择中继节点，因为可以获得最大的额外覆盖。这在异构车辆网络中并不总是成立，因为距离发送者较近但通信范围更大的车辆，其额外覆盖范围可能比距离发送者远但通信范围较小的车辆更多。虽然大多数协议考虑了到发送者的距离来选择中继节点，但在异构通信范围\
  \ VANETs 中，最远的车辆并不一定具有最大的覆盖区域。因此，除了距离外，选择下一跳的算法还需要通信半径，该半径将包含在信标中。例如，一旦车辆 A 广播数据包，车辆\
  \ B 和车辆 C 就会接收到。在这两个车辆中，如 [图 7.4] 所示，B 最远。选择车辆 B 作为中继进行告警可能并不明智，因为车辆 B 的通信范围可能非常短。位于源和\
  \ B 之间的车辆 C 的通信范围跨度比车辆 B 更远。\n\n此外，这些广播协议根据车辆位置和物理特性（如网络的车辆密度）调整等待延迟和重播概率。\n\n##\
  \ 7.10 结论\n\n在本章中，进行了广泛的文献综述。本章的主要部分包括 VANETs 和 DSRC 标准概述、VANETs 特性与应用及其需求。其他章节介绍了\
  \ VANETs 中通信范围的异构性。VANETs 广播协议目前的研究挑战集中在广播风暴问题和网络分段等问题上。讨论了 VANETs 的传播协议及其处理这些问题的方法、优点和缺点。\n\
