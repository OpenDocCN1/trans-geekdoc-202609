  \ Jul. 2010, Chengdu, China, pp. 106–109.\n\n# 容延网络中的缓冲区管理\n## Sweta Jain\n\n- 3.1\
  \ 引言\n- 3.2 与 DTN 路由相关的问题\n- 3.3 DTN 中的缓冲区管理\n    - 3.3.1 本地缓冲区管理策略\n    - 3.3.2\
  \ 基于模糊的缓冲区管理技术\n    - 3.3.3 基于社交的路由算法中的缓冲区管理\n    - 3.3.4 全局缓冲区管理策略\n    - 3.3.5\
  \ 容延网络流量差异化方案\n- 3.4 总结与讨论\n- 3.5 未来工作方向\n- 参考文献\n\n## 3.1 引言\n\n容延网络（`DTNs`）是一类新兴的无线网络，其中通往目的地路径上的下一个节点是先不可知的，并在接触机会出现时动态选择。因此，它们也被俗称为机会性网络。稀疏的网络密度和节点相遇之间的长时间延迟通常会导致节点连接的间歇性。即使在这些难以建立端到端路径的挑战性网络环境中，它们也能执行数据传输（Marano\
  \ & Socievole, 2012）。\n\n传统的自组织网络路由协议可能不适用于这种极端环境，因为这些协议要求在整个通信期间，通信节点之间存在连续的端到端路径，而在\
  \ `DTNs` 中，由于频繁的链路中断，情况并非如此。因此，这些网络采用了一种名为 `store-carry-forward`（存储-携带-转发）的策略（Cerf\
  \ Burleigh, Hooke, Torgerson, Durst, & Scott, 2007）的新路由机制来进行节点间的数据通信。由于下一跳节点可能无法立即可用，节点会将消息进行缓存并随身携带，直到遇到另一个节点。当新的接触机会出现时，它会转发消息，并重复这一消息转发过程，直到消息最终到达目的地。由于\
  \ `DTNs` 中节点相遇之间的延迟是不可预测的且可能非常长，`DTN` 节点必须具有足够的存储容量以便在缓冲区中长时间存储消息。因此，缓冲区管理问题引起了\
  \ `DTNs` 领域的特殊关注。\n\n在 `DTNs` 的挑战性网络环境中实现数据投送的两个主要问题包括（Kim & Shin, 2011）：一种决定在节点相遇时是否转发消息的路由策略；以及一种缓冲区管理策略，该策略包括在接触机会出现时关于待转发消息顺序的调度决策，以及当节点缓冲区溢出时选择丢弃消息的丢弃决策（Jain,\
  \ Chawla, Soares, & Rodrigues, 2014）。\n\n`DTNs` 中的路由协议倾向于创建并传播消息的多个副本以增加交付概率，尽管是以网络资源为代价的。长期存储结合消息复制会导致缓冲区溢出，并导致频繁的消息丢弃（Krifa,\
  \ 2008）。同时，由于接触机会持续时间短，限制了可以成功交换的消息数量。因此，缓冲区调度和丢弃策略有助于充分利用有限的网络资源，从而提高 `DTN` 路由协议的性能（Soares,\
  \ Farahmand, & Rodrigues, 2010; Tang, Chai, & Weng, 2012）。\n\nSun & Cao (2013) 的工作识别了移动自组织网络（`MANETs`）与\
  \ `DTNs`之间的一些主要区别。在 `MANETs` 中，路由协议试图在源节点（`A`）和目的节点（`C`）之间建立同步的端到端路径。这种路径在本质上是对称的，即从\
  \ `A` 到 `C` 的路径类似于从 `C` 到 `A` 的路径，如图 3.1\n\n图 3.1\n`MANETs` 中的路由。\n\n然而，`DTNs` 中的路由利用节点之间的接触机会，如图\
  \ 3.2\n\n图 3.2\n`DTNs` 中的存储-携带-转发路由。\n\n## 3.2 与 DTN 路由相关的问题\n\n与 `DTN` 路由相关的四个主要问题是（Gupta,\
  \ 2013）：\n\n1. **转发策略**：DTN 路由的首要问题是转发策略，节点根据此策略决定是否将其缓冲区中的存储消息转发给相遇的节点。可能会出现源节点或携带消息的中间节点一段时间内不会遇到目的地，但如果它能预测与目的地的下次会面时间，这将有助于做出更好的路由决策。如果当前节点遇到一个近期遇到目的地概率更高的节点，则可能会将消息转发给该特定节点。\n\
  \n2. **复制策略**：第二个重要问题是复制策略，即消息在网络中复制的次数。为了增加交付概率，消息的多个副本会在备用网络路径上传（Spyropoulos,\
  \ Turletti, & Obraczka, 2009）。主要关注的是向哪些节点复制消息，以及如何将消息副本分发到不同的相遇节点。创建过多的副本会导致中间节点的缓冲区溢出，并导致消息丢失。\n\
  \n3. **丢弃策略**：第三个问题与缓冲区丢弃策略有关。DTNs 使用存储-携带-转发路由范式，节点在将消息转发给其他节点后，仍会在缓冲区长时间携带这些消息供未来传播。长期存储结合消息复制策略可能会迅速填满节点的有限缓冲区。在缓冲区溢出时决定丢弃哪些消息是一个关键决策。\n\
  \n\n\n\n\n# 4. 调度策略\n\n第四个问题涉及缓冲区调度策略。由于节点之间的接触时间非常短，且网络带宽也有限，在节点会面期间只能交换有限量的数据（Makhlouta,\
  \ Harkous, Hutayt, & Artail, 2011）。估计接触能力并确定在给定接触机会中可以交换的消息数量，可能有助于更好地利用已经有限的带宽。在出现接触机会时确定消息发送的顺序是一个重要问题。\n\
  \n## 3.3 DTN 中的缓冲区管理\n\n由于使用了消息缓冲和复制策略，缓冲区管理是延迟容延网络（DTN）中的一个重要问题。如果没有缓冲区管理，由于频繁的丢被丢弃或有限的接触机会，大多数为\
  \ DTN 提出的路由方案可能无法生效。它涉及到两个必须仔细考虑的重大决策：(a) 在缓冲区溢出且新消息到达时丢弃哪些消息（s），以及 (b) 当出现接触机会时，调度哪些消息（s）进行传输。高效缓冲区管理策略的目标可以总结如下：\n\
  \n* 首要且必要的目标必须提高网络的递送率。\n* 然而，其次要目标是最小化资源消耗；因此，缓冲区管理策略还旨在减少开销，即最小化消息转发的中继节点数量。尽管最小化延迟是理想的，但以更高延迟为代价最大化递送率是可以接受的。\n\
  \n缓冲区管理策略可以根据使用的消息信息类型和数量进行分类（Jain, Chawla, Soares, & Rodrigues, 2014）。它们主要可以分类为：(a)\
  \ 本地策略，根据节点上可用消息的本地信息做出决策，例如它们的到达时间、年龄、存活时间 (`TTL`）、大小、跳数、消息的转发次数等；以及(b) 全局策略，尝试基于关于消息的完整全网信息寻找最优解决方案。第\
  \ 3.3.1 节介绍了基于本地信息的缓冲区丢弃和调度策略的最新综述，第 3.3.4 节讨论了全局缓冲区管理策略。\n\n### 3.3.1 本地缓冲区管理策略\n\
  \na. 关于缓冲区管理的最早工作由 Davis, Fagg, & Levine (2001) 提出，评估了四种缓冲区丢弃策略：\n\n* `Drop-Random`：该策略从缓冲区中随机选择消息并丢弃。这是一种盲目策略，没有考虑缓冲区内消息的状态。\n\
  * `Drop-Least-Recently-Received`：该策略移除位于节点缓冲区中所有消息中最早到达的那一个。原因是这种消息在过去的相遇中可能已经经历了很多转发机会。因此，可以安全地丢弃它，因为网络中已经创建了大量此类消息的，因此与缓冲区中的其他消息相比，它们的递送概率更高。\n\
  * `Drop-Oldest`：该策略丢弃在网络中存在时间最长的消息。该策略的逻辑与 `drop-least-recently-received` 相同。\n\
  * `Drop-Least-Encountered`：该策略丢弃当前节点与其目的地递送概率最低的消息。这种丢弃策略基于两个节点之间的相遇概率，该概率是根据它们过去的相遇情况估计的。对于每个时间步，节点\
  \ `A` 使用公式 3.1(a–c) 中提到的规则，相对于共同存在的节点 `B` 更新另一个节点 `C` 的相遇时间：\n\n```\n$$M_{t + 1}\\\
  left( {A,C} \\right) = \\begin{cases} {\\lambda M_{t}\\left( {A,C} \\right)} & {\\\
  text{if}\\,\\text{none}\\\\,\\text{co-located}} \\\\ {\\lambda M_{t}\\left( {A,C}\
  \ \\right)} & {\\text{if}\\\\, C = B} \\\\ {\\lambda M_{t}\\left( {A,C} \\right)\
  \ + \\alpha M_{t}\\left( {B,C} \\right)} & {\\text{for}\\,\\text{all}\\\\, C \\\
  neq B} \\\\ \\end{cases}$$\n```\n\n(3.1a–c)\n\n其中：\n* `M [t] (A,C)` 是时间 `t` 时的相遇值\n\
  * `α = 0.1` 是一个决定 `B` 的相遇值的多少部分被添加到 `A` 中的参数\n* `λ = 0.95` 是相遇值的衰减率\n\n对于所有节点对，`M\
  \ [t] (A,C)` 初始值为零。\n\n当两个节点 `A` 和 `B` 相遇时，它们根据两个节点将消息递送到目的地的相对能力对缓冲区中存储的消息进行排序，即根据\
  \ `M [t] (A,C) – M [t] (B,C)`，其中 `C` 是目的地。仿真结果显示，`drop-least-encountered` 的性能优于\
  \ `drop-oldest`，因为它在做出丢弃决策时考虑了节点的相遇概率。这确保了消息有更高的机会遇到目的地。\n\nb. 尽管 Davis, Fagg, &\
  \ Levine (2001) 仅将相遇概率用于决策，但 `MaxProp` (Burgess, Gallagher, Jensen, & Levine 2006)\
  \ 也使用相遇可能性的估计来进行决策。它基本上是为车载网络设计的。在 `MaxProp` 中，每个节点都会估计所有其他节点的相遇概率。在网络开始时，所有节点将此概率设置为\
  \ `1/(n+1)`，其中 `n` 是网络中的节点总数。在每次相遇中，相遇概率都会增加并对所有值进行归一化。节点与其相遇的节点交换相遇概率，这有助于确定网络中的路由。`MaxProp`\
  \ 使用两个参数——跳数和节点路径概率来决定节点缓冲区中存储消息的传输和丢弃优先级。路径概率如前所述使用相遇的历史数据进行计算和更新。\n\n如果仅使用递送概率指标，如\
  \ `drop-least-encountered` (Davis, Fagg, & Levine, 2001)，那么有高概率到达目的地的消息将获得转发机会，而那些遇到概率低的消息永远不会获得机会。然而，`MaxProp`\
  \ 通过给网络中较新的消息更多的转发机会来避免这种情况。为了实现这一点，它将节点缓冲区分为部分：一部分包含跳数小于预定义阈值 `t` 的数据包（按跳数排序），另一部分包含跳数大于\
  \ `t` 的数据包（按递送概率指标排序）。在缓冲区溢出的情况下，`MaxProp` 根据跳数丢弃数据包；因此，在网络中传播时间最长的先被丢弃。`MaxProp`\
  \ 还会删除已收到确认的消息；这为网络中的新消息释放了缓冲区空间。\n\n将跳数作为消息优先级参数的主要局限性在于，它只反映了消息在特定路径上转发的次数。因此，消息的跳数无法正确估计其在其他节点中的分布情况，这些节点可能拥有消息副本，但不在转发路径上。\n\
  \n\n\n\n\n# 基于相遇历史与传递性的概率性路由协议 (PRoPHET)\n\n(Lindgren, Doria, & Schelen, 2003) 是一种概率性路由协议，其工作假设是网络中的节点并非随机移动，而是遵循某些相遇模式。该协议利用节点的相遇历史和传递性概念来估计两个节点之间的交付概率。\n\
  \n每个节点将网络中每个其他节点 `B` 的递送预测性指标 `P(A, B)` 初始化为常数 `P[init]`。当两个节点 `A` 和 `B` 相遇时，它们按以下公式更新递送预测性指标：\n\
  \n```\nP(A,B)[new] = P(A,B)[old] + (1−P(A,B)[old]) * P[init]\n```\n(3.2a)\n\n如果长时间未相遇（例如\
  \ `K` 个时间单位），该递送预测性指标将通过某种衰减因子 `γ` 减小。\n\n```\nP(A,B)[new] = P(A,B)[old] * γ^K\n\
  ```\n(3.2b)\n\n传递性概念也用于更新递送预测性指标，即：如果节点 `A` 频繁相遇节点 `B`，且节点 `B` 频繁相遇另一个节点 `C`，那么节点\
  \ `B` 可能是节点 `A` 将消息传输到节点 `C` 的良好中继。\n\n```\nP(A,C)[new] = max(P(A,C)[old], P(B,C),\
  \ P(A,B)[new]β)\n```\n(3.2c)\n\n其中 `β` 是常数。\n\n因此，节点维护与其相遇的每个节点的递送预测性指标，并利用其在相遇机会做出转发决策。\n\
  \n#### 队列策略\n\nPhanse & Lindgren (2006) 使用不同的队列策略和调度策略组合评估了 PRoPHET 路由协议的性能。Phanse\
  \ & Lindgren 提出并评估了以下队列策略：\n\n- **最常转发 (MOFO)**：这种丢弃策略考虑了消息被节点复制的次数；它会丢弃转发次数最多的消息，因为该消息已经在网络中传播，具有很高的概率到达目的地。\n\
  - **最短寿命 (SHLI)**：这种丢弃策略丢弃剩余寿命（即剩余生存时间）最短的消息。这是基于这样观点：剩余 TTL (`RTTL`) 较低的消息没有足够的时间到达目的地，且很快就会过期，因此可以被轻易丢弃。该策略将防止即将过期的消息到达目的地，即使它们已经接近目的地。\n\
  - **最可能 (MOPR)**：这种丢弃策略基于递送预测性指标；它使用一个名为转发预测性 (`FP`) 的新计数器，其初始化为零；对于每次消息复制，`FP`\
  \ 都会根据接收节点对消息目的地的递送预测性指标 `P` 进行递增。该策略类似于 MOFO，但它丢弃的是 `FP` 值最大的消息。\n\n```\nFP = FP[old]\
  \ + P\n```\n(3.3)\n\n- **先入先出 (FIFO)**：该策略丢弃队列最前端的消息，即最早进入节点队列的消息。\n- **最不可能 (LEPR)**：该策略丢弃当前携带节点对该目的地递送预测性最低的消息。然而，如果源节点对消息目的地的交付概率很小，则该消息永远不会被转发，也不会在网络中传播，进一步降低其到达目的地的机会。\n\
  \n对这些策略的对比分析显示，MOFO 显示出最佳性能，而 LEPR 性能最，因为 LEPR 总是丢弃交付概率最低的消息。可能会出现源节点对某些目的地的交付概率较低，那么指向这些节点的消息可能在源处就被丢弃而不在网络中传播，导致整体交付率下降。因此，需要一种综合的缓冲区丢弃策略，将路由指标与消息参数相结合以做出适当的缓冲区管理决策，因为在这些丢弃的消息上可能已经消耗了一些资源。\n\
  \n## 调度策略\n\nPhanse 和 Lindgren (2006) 还提出了若干用于确定在节点相遇时消息调度顺序的调度策略。这些策略根据 Lindgren,\
  \ Doria, & Schelen (2003) 中定义的 PRoPHET 路由协议的递送预测性指标，对节点缓冲区存储的消息进行优先级排序。所有调度策略都对那些相遇节点递送预测性高于当前携带节点的消息赋予优先级。\n\
  \n- **GRTR**：这种调度策略类似于基础 PRoPHET 中使用的转发准则。消息的当前携带者节点 `A` 仅且仅当 `P(B, D) > P(A, D)`\
  \ 时，将目的地为 `D` 的消息 `M` 转发给相遇节点 `B`。\n- **GRTRSort**：这种调度策略按照两个节点递送预测性指标差值（即 `P(B,\
  \ D) - P(A, D)`）的降序对消息排序，并仅在 `P(B, D) > P(A, D)` 时转发消息。\n- **GRTRMax**：这种调度策略类似于\
  \ GRTRSort，但它首先转发节点 `B` 递送预测性最高的消息。\n- **COIN**：该策略未用于 PRoPHET，而是与流行病协议 (Epidemic)\
  \ 结合使用。与其像流行病协议那样简单转发消息，不如该方法执行 COIN 测试来决定是否转发消息。例如，只有当 `X > 0.5` 时才转发消息，其中 `X ε\
  \ U (0, 1)`。\n\n结果证实，GRTRSort 结合 MOFO 队列策略提供了最佳性能。\n\n## LPS 和 LRF 策略\n\n低概率喷洒 (LPS)\
  \ 和最近未转发 (LRF) 是两种新开发的混合缓冲区管理策略 (Naves, Moraes, & Albuquerque, 2012)。这些策略在两种传统的\
  \ DTN 路由协议：流行病和 PRoPHET 上进行了评估。LPS 是 LEPR 的增强；与 LEPR 类似，LPS 在拥塞时也选择递送概率最低的消息进行丢弃，但仅当其预定义的最小副本数量已在网络中传播时。为了估计消息的副本数量，它简单地使用附加消息头部的计数字段。每转发一次消息，该计数字段加\
  \ 1。这有助于克服 LEPR 中面临的交付概率较低的消息过早丢弃的问题 (Phanse & Lindgren, 2006)。由于 LPS 需要两个节点之间的接触概率指标来做出丢弃和调度决策，它只能用于使用此类指标的\
  \ DTN 路由协议。\n\n另一方面，LRF 在缓冲区溢出时丢弃最近未转发的消息，理由是：这样的消息在过去已经传输了几跳，而现在新消息应该获得转发机会。LRF\
  \ 可以用于任何 DTN 路由协议，因为它只需要节点对消息的最后转发时间。通过仿真结果，作者展示了 LPS 和 LRF 相比 FIFO、MOFO 和 LEPR\
  \ 等其他缓冲区丢弃策略的优越性能，体现在更高的交付率和更低的开销方面，其中 LRF 在所有比较方案中提供了最佳性能。\n\n\n\n\n\ne. Zhang\
  \ 等人研究了三种缓冲区管理策略对流行病路由（Epidemic routing protocol）的影响（Zhang, Neglia, Kurose, & Towsley,\
  \ 2007），即 `drop-tail`、`drop-head` 和 `source-prioritized drop-head`。在 `drop-tail`\
  \ 中，节点总是丢弃缓冲区末尾的消息。在 `drop-head` 中，节点丢弃缓冲区头部的消息。`source-prioritized drop-head` 与\
  \ `drop-head` 类似，不同在于它对节点自身作为源产生的消息赋予优先级。在缓冲区溢出时，节点首先丢弃其作为中继的消息，如果有必要，再丢弃源消息。\n\n\
  仿真结果表明，在三种丢弃策略中，`source-prioritized drop-head` 的性能最佳，且优先考虑源数据包是有益的。\n\nf. 优先流行病算法（PREP）（Ramanathan,\
  \ Hansen, & Basu, 2007）是流行病路由的改进版本，它由路由模块和数据包优先级模块组成。路由模块负责通过链路状态通告维护拓扑信息，并确定节点之间的最优路径。数据包优先级方案决定了存储在节点缓冲区中的消息丢弃和调度顺序。\n\
  \n每个节点为缓冲区占用率维护一个低水位和一个高水位。当节点的缓冲区占用率超过高水位时，节点开始丢弃数据包；当占用率达到低水位时，节点停止丢弃数据包。这种机制防止了频繁调用丢弃程序。跳数小于跳数阈值的数据包首先被选中丢弃，距离目的地最短路径成本最大的数据包优先丢弃。如果缓冲区水位高于低水位且没有此类数据包，则以随机方式选择并删除数据包。这保留了更多靠近其目的地的数据包副本，在发生资源危机时则删除距离目的地较远的副本。\n\
  \n当传输机会出现时，节点再次将其缓冲区分为若干部分：下游桶和上游桶。如果遇到的节点到数据包目的地的路径成本比当前携带消息的节点小，则将该数据包放在下游桶中；否则放在上游桶中。随后，这些每个桶都根据剩余存活时间（Time-to-live）属性和数据包的年龄使用\
  \ `Radix sort`（基数排序）进行排序。数据包传输从下游桶开始，然后是上游桶。\n\ng. N-drop 策略（Li, Zhao, Liu, & Liu,\
  \ 2009）根据消息转发的次数做出丢弃决策。当发生缓冲区溢出条件时，由节点转发了 `N` 次或超过 `N` 次的消息将被丢弃。如果没有没有消息的转发计数大于阈值\
  \ `N`，则根据 `FIFO`（先来先行）策略丢弃消息。`N` 的值根据节点的缓冲区状态选择。随着节点缓冲区大小的增加，阈值 `N` 也之增加，这意味着网络中可能会创建并分发更多消息副本。\n\
  \nh. Vasco 等人还评估并提出了若干缓冲区管理策略（Soares, Farahmand, & Rodrigues, 2010）。他们针对一种名为车载延时容忍网络（vehicular\
  \ delay-tolerant networks）的 DTN 应用进行了这项研究。消息的丢弃和调度顺序是基于多个因素考虑的：消息在队列中的位置、其剩余存活时间以及消息副本的数量。基于这些因素，比较了几种丢弃和调度策略，即：`FIFO`、`Random`（随机）、`Ascending\
  \ Remaining Lifetime`（剩余寿命升序）、`Descending Remaining Lifetime`（剩余寿命降序）、`Ascending\
  \ Replicated Copies`（副本数量升序）和 `Descending Replicated Copies`（副本数量降序）。作者分析的调度策略如下：\n\
  \n- 在 `FIFO` 调度中，消息根据其进入缓冲区的时间进行排序，即基于先来服务的原则。\n- 在 `Random` 调度中，当出现接接机会时，随机选择缓冲区中存储的消息进行传输。\n\
  - 在基于剩余寿命的（`RL-based`）的调度中，调度策略根据消息的 `TTL`（存活时间）对存储在节点缓冲区的消息进行排序。消息的 `TTL` 表示消息在网络中有效的时间；`TTL`\
  \ 过期后，消息将从网络中丢弃。评估了两种调度策略：在第一情况下，消息按 `TTL` 降序排序；在第二种情况下，消息按 `TTL` 升序排序。\n- 在基于副本数量（`RC-based`）的调度中，根据消息自产生以来在网络中被复制的次数进行排序。同样评估了两种变体：在一种调度策略中，消息按复制次数降序排序；在另一种策略中，消息按复制次数升序排序。\n\
  \n丢弃策略也基于相同的标准。\n\n- 在 `Drop-Head` 丢弃策略中，丢弃缓冲区头部的消息，即丢弃先进入节点缓冲区的消息。\n- 在 `Random`\
  \ 丢弃策略中，缓冲区溢出时，从节点缓冲区中随机选择一条消息并丢弃。\n- 在 `Remaining Lifetime`（剩余寿命）丢弃策略中，根据消息的剩余\
  \ `TTL` 丢弃消息。考虑了该策略的两种变：在第一种中，赋予剩余 `TTL` 最小的消息最高丢弃优先级（`RL Ascending`，简称 `RL ASC`）；在第二种中，赋予剩余\
  \ `TTL` 最大的消息最高丢弃优先级（`RL Descending`，简称 `RL DESC`）。\n- 在基于副本数量的丢弃策略中，消息的丢弃优先级根据其复制次数决定。同样评估了该策略的两种变体：缓冲区溢出时，要么首先丢弃复制次数最小的消息（`RL\
  \ Ascending Order`），要么首先丢弃复制次数最多的消息（`RL Descending Order`）。\n\n从仿真结果来看，作者观察到基于 `RL-DESC`\
  \ 的丢弃和调度策略（在调度时赋予具有较高 `TTL` 的消息更高优先级）与其他策略相比，平均降低了延迟。而 `RL ASC` 赋予具有较低 `TTL` 的消息更高优先级，试图在过期前交付会导致消息的平均延迟增加。尽管\
  \ `RC ASC` 策略传输数据包的时间比 `RL DESC` 策略稍长，但由于它为在网络中传播不佳的消息提供了更多转发机会，因此实现了更高的交付率。`FIFO`\
  \ 调度仅赋予缓冲区头部消息优先级，这限制了节点缓冲区中其他消息的传输机会，因此与所有其他策略相比，其交付率较低且平均延迟较大。因此，作者得出，基于副本数量升序的调度策略与基于副本数量降序的丢弃策略的组合，与其他组合相比表现最佳。这项研究强调了影响延时容忍网络丢弃和调度决策的各种因素，但正如以前所述，还需要一种考虑多个消息参数的更好方法。\n\
  \n\n\n\n\n# i. 研究了一种针对名为“Haggle”的 DTN 项目的多种丢弃策略（Bjurefors, Gunningberg, Rohner,\
  \ & Tavakoli, 2011）。Haggle 是一种以数据为中心的架构，移动节点利用任何可用的通信技术（如 Wi-Fi、蓝牙等）机会性地相互连接。Haggle\
  \ 架构中的每个节点都被假设有一个缓冲区管理系统，用于存储数据对象以及与之相关的元数据（如用户兴趣）。这项工作中提出的丢弃策略主要基于用户兴趣和副本计数。它们列举如下：\n\
  \n*   **最感兴趣 (Least Interested, LI)**：该策略丢弃节点中最少邻居感兴趣的数据对象。这种方案减少了内容的多样性，但也导致交付率的提高。\n\
  *   **最感兴趣 (Most Interested, MI)**：该策略丢弃节点大多数邻居感兴趣的数据对象。这种方案会对交付率产生负面影响，因为它移除了大多数节点都感兴趣的数据。\n\
  *   **最大副本 (Max Copies, MAX)**：该策略丢弃已复制预定义次数（`max`）的特定数据对象。\n*   **最转发 (Most Forwarded,\
  \ MF)**：该策略丢弃节点缓冲区中该节点创建副本最多的数据对象。\n*   **最少转发 (Least Forwarded, LF)**：该策略丢弃节点缓冲区中该节点创建副本最少的数据对象。\n\
  *   **随机 (Random)**：该策略从节点缓冲区中随机丢弃任何数据对象。\n\n还比较了两种极端情况：\n\n*   **无限缓冲区 (Infinite\
  \ Buffer)**：这是最佳情况，假设每个节点都有无限缓冲区，因此可以容纳无限数量的数据对象而不丢弃任何数据。\n*   **无缓冲区 (No Buffer)**：这是最坏情况，每个节点只存储自己感兴趣的数据对象，而不是别人的兴趣。\n\
  \n作者得出结论，`MF`策略在所有主要的网络性能参数（即交付率、延迟和开销）方面优于所有其他策略。\n\nJ. Rohner, Bjurefors, Gunningberg,\
  \ McNamara, & Nordstrom (2012) 指出并非所有数据项对网络中的所有节点都同样重要，这一认识可以使传播系统更公平地利用网络资源。主机可以通过将自己的兴趣与项目的元数据进行匹配，来确定数据项与其是否相关，然后根据匹配评分决定接受和存储哪些数据项。为了最有效地利用短暂的接触机会，作者提出了相关性驱动的数据传播概念。相关性评分用于决定选择哪些项目进行传输以及以什么顺序转发它们。假设每个数据项都有一组相关的属性\
  \ `D`（称为元数据），每个节点也包含一组与数据属性对应的兴趣 `I`。兴趣通过直接接触或通过第三方传播在网络中传输。如果 `R = D ∩ I` 非空集，则认为该数据项与该节点相关。评分值被用于衡量节点对某个数据项的兴趣强度。\n\
  \n$$\\text{Score} = \\frac{\\sum_{a \\in R}\\omega_{a}}{\\sum_{a \\in I}\\omega_{a}}$$\n\
  (3.4)\n\n其中 `ω` 是别对应 `D` 和 `I` 的权重。相关性评分用于决定选择哪些项目进行传输以及以什么顺序转发它们。利用这一概念，研究提出了五种策略：\n\
  \n*   **局部评分 (Score Local)**：根据其局部性对数据项进行排序。\n*   **全局评分 (Score Global)**：从全局角度对数据项进行排序。\n\
  *   **局部随机 (Random Local)**：仅针对局部相关的数据项。\n*   **随机 (Random)**：该策略忽略相关性选择数据项。\n*\
  \   **局部后进先出 (LIFO Local)**：对局部相关使用后进先出策略。\n\n# k. S. 提出了几种基于消息大小的丢弃策略。\n\n*   **丢弃最大\
  \ (Drop Largest, DLA)** (Ayub & Rashid, 2010) 建议在缓冲区溢出时丢弃最大的消息，直到为传入消息腾出空间。这防止了节点处不必要的消息丢弃并节省了带宽。在消息目标为节点本身的情况下，使用该策略。\n\
  *   **消息丢弃控制源 (Message Drop Control Source, MDC-SR)** (Rashid, Ayub, Soperi, & Abdullah,\
  \ 2013) 如名所示，通过对节点可以缓存的消息数设置上限阈值来尝试控制消息丢失的数量；如果超过此阈值，则丢弃传入的消息，消息目标为该节点的情况除外。\n*\
  \   **阈值丢弃 (Threshold Drop)** (Rashid & Ayub, 2010) 对消息大小定义了上限和下限，仅选择处于该阈值范围内的消息进行丢弃。\n\
  *   **等量丢弃 (Equal Drop)** (Rashid, Ayub, Soperi, & Abdullah, 2011) 如果消息到达节点且缓冲区满，则选择与传入消息大小相同的消息进行丢弃。\n\
  *   **均值丢弃 (Mean Drop)** (Rashid, Abdullah, Soperi, & Ayub, 2012) 缓冲区溢出时，仅选择大小大于或等于节点当前留存消息大小平均值的消息进行丢弃。\n\
  \n这些策略中的丢弃决策仅由单一消息参数（即消息大小）引导，而其他重要的消息参数（如副本数量、其剩余 TTL）被完全忽略了。然而，可能会出现被选择丢弃的消息在网络中较新，或者很有可能几跳内到达目的地。\n\
  \n# l. Tang, Chai, & Weng (2012) 的工作利用节点之间的平均接触频率 (ACF) 来做出缓冲区调度决策。这是基于一种观察：如果两个节点在最近过去相遇，那么它们在不久的未来再次相遇的可能性。ACF\
  \ `fij` 定义为在预定义时长 `T` 内节点 i 和节点 j 之间的遭遇次数；因此，ACF 计算公式为：\n\n$$\\text{ACF} = \\frac{N_{ij}}{T}$$\n\
  (3.5)\n\n在这里，`N_{ij}` 是 `i` 和 `j` 之间的接触次数。\n\n\n\n\n\n当两个节点 `A` 和 `B` 相遇时，对于 `A`\
  \ 缓冲区中所有目的地为 `D` 且 `B` 缓冲区中不存在的消息 `i`，`A` 将比较节点 `A` 和节点 `B` 的 `ACF` 表中相应的 `ACF`\
  \ 值 `ACF AD` 和 `ACF BD`，然后将所有 `B` 具有更高 `ACF` 的消息转发到该消息的目的地。这些消息将按照 `ACF BD` 的降序排列进行调度。当缓冲区溢出时，优先丢弃副本数量最多的消息。\n\
  \n### 增强型缓冲区管理策略 (EBMP)\n\nm. 在增强型缓冲区管理策略（EBMP）中（Kim & Shin, 2011），提出了两种基于消息效用的缓冲区丢弃策略。第一个效用函数记作\
  \ `EBMP^(delivery)`，它结合了消息的年龄（`AGE`）与其估计的总副本数（`ETR`），定义在公式 3.6 中。\n\n$$\n\\text{EBMP}\\\
  _{\\text{i}}^{\\text{delivery}}\\text{=}\\frac{\\text{1}}{\\text{ETR}\\_{\\text{i}}}\\\
  text{+}\\frac{\\text{1}}{\\text{log}\\left( \\text{AGE}\\_{\\text{i}} \\right)}\n\
  $$\n(3.6)\n\n消息的年龄计算为当前时间与消息创建时间之间的差值。赋予较旧消息更高的丢弃优先级，是因为它们在网络中停留了很长时间，且网络中已经创建了大量此类消息的副本，从而增加了它们递送到目的地的概率。这也为传输机会较少的较新消息留了更多机会。\n\
  \n第二个效用函数记作 `EBMP[delay]`，它结合了消息的估计副本数（`ETR[i]`）和剩余的存活时间（`RTTL[i]`），定义在公式 3.7 中：\n\
  \n$$\n\\text{EBMP}\\_{\\text{i}}^{\\text{delay}}\\text{=}\\frac{\\text{1}}{\\text{ETR}\\\
  _{\\text{i}}}\\text{+}\\log}\\left( \\text{RTTL}\\_{\\text{i}} \\right)\n$$\n(3.7)\n\
  \n由于消息属性的年龄以及剩余 TTL 以秒为单位计数且其值在数百到几千之间，因此对它们应用了 `log` 函数以限制其对效用函数的影响，并给消息的副本数属性赋予适当权重。\n\
  \n在两个效用函数中，都使用了副本计数。在额外考虑了 `1/log(age[i])` 的第一个效用函数中，消息的 `ETR` 起到的作用比第二个效用函数更具主导性（第二个效用函数是在\
  \ `1/ETR[i]` 的基础上加上 `log(RTTL[i])`）。因此，第一个效用函数旨在通过丢弃估计副本数值较大的消息来提高网络的递送率，而第二个效用函数则旨在通过丢弃\
  \ `RTTL` 值较低的消息来缩短网络中的平均递送延迟。\n\n### 副本数估计\n\n该工作还提出了一种估计网络中消息副本数的新机制。为此，网络中的每个节点对其缓冲区中持有的每条消息维护两个变量：估计副本（`ER`）计数和我的转发（`MF`）计数。`ER`\
  \ 用于存储消息的估计副本数，`MF` 用于存储由该节点本身创建的消息新副本数量。每当两个节点相遇时，它们通过交换相应消息的 `my_forward` 值来更新存储在缓冲区消息的\
  \ `ER` 值。\n\n令 `ERi` 表示节点 `A` 估计的消息 `i` 的总副本数，`MFi` 表示消息 `i` 的转发计数，即由节点 `A` 自己创建的消息副本数量。消息\
  \ `i` 的源节点 `A` 将 `ERi` 初始化为 1，将 `MFi` 初始化为 0。可能会出现两种情况：\n\n第一种，节点 `A` 遇到另一个没有消息\
  \ `i` 的节点 `B` 并其转发消息 `i`。在这种情况下，节点 `A` 将消息 `i` 的我的转发计数 `MFi` 和估计副本数 `ERi` 均加 1。然后节点\
  \ `B` 根据 `ERi` 推导出其对消息 `i` 的估计副本数 `ERi`，并将我的转发计数 `MFi` 设置为零。\n\n```\nERi = ERi +\
  \ 1\nERi = ERi\n```\n(3.8a)\n\n```\nMFi = MFi + 1\nMFi = 0\n```\n(3.8b)\n\n第二种，两个在缓冲区中具有共同消息\
  \ `i` 的节点 `A` 和 `B` 相遇。在这种情况下，两个节点交换它们对消息 `i` 的 `MF` 值并各自更新它们的 `ER` 值。\n\n```\n\
  ERi = ERi + MFi\n```\n(3.9a)\n\n```\nERi = ERi + MFi\n```\n(3.9b)\n\n但这种副本数估计方法在两个节点频繁相遇（由于位置相近）但自上次见面后未创建任何副本的情况下可能会导致错误更新。由于\
  \ `MF` 值的交换，`ER` 值增加错误的概率。作者通过仿真分析表明，基于本地消息属性的本地管理策略可以与全局管理策略产生相当的性能。\n\nn. Liu\
  \ 等人提出了一种名为消息传输状态管理（MTSBS）的缓冲区丢弃和调度方案。根据副本数的传播速度对消息进行优先级排序。传播速度表示消息在网络中的分布快慢，计算方法为跳数与其\
  \ `TTL` 的比例。首先，使用副本数对消息进行排序，在相等的情况下使用传播速度作为决胜因素。他们的缓冲区管理策略灵感源于著名的金融理论——效用递减规律，该理论认为“随着用户对某种产品的消费增加，其从每额外单位产品中获得的边际效用会下降”（Prodhan,\
  \ Das, Kabir & Shoja, 2011）。因此，在资源危机的情况下，为已经在网络中传播的消息创建额外的副本是不利的，因为这将限制其他消息的可用空间。因此，他们的缓冲区管理策略建议给予副本数较低且传播速度缓慢的消息传输机会。\n\
  \no. Rashid, Ayub, & Abdullah (2015) 的工作提出了一种基于 TTL 的路由协议（TBR），在 Spray and Wait\
  \ 路由协议中实现了缓冲区调度和丢弃。该协议根据公式 3.10(a) 中定义的优先级函数 `Pk` 对在接触机会中的消息进行排序，并根据公式 3.10(b) 中定义的优先级函数\
  \ `Pd` 在节点缓冲区溢出时丢弃消息。在这里，`s[k]` 表示消息的大小，`TTL` 表示存活时间，`h[k]` 表示跳数，`L[k]` 表示消息副本的数量。使用跳数作为消息副本数估计的缺点已经讨论过。\n\
  \n$$\nP_{fk} = \\frac{1}{h_{k} \\ast TTL_{k} \\ast s_{k}}\n$$\n(3.10a)\n\n$$\nP_{dk}\
  \ = \\frac{L_{k}}{s_{k}}\n$$\n(3.10b)\n\n\n\n\n\np. Rashid 等人提出了一种基于权重的缓冲区管理策略（称为\
  \ `WBD`）（Silva, Nunes, Miniy, & Loureiro, 2017），该策略根据消息的大小 (`MS`)、剩余生存时间 (`RTTL`)、在节点缓冲区中的停留时间\
  \ (`MSTQ`)、跳数值 (`HC`) 以及副本数量 (`RC`) 为消息分配权重。这五个消息参数使用公式 3.11 中提到的公式进行组合：\n\n$$\\\
  text{Weight} = \\frac{\\text{1}}{\\text{MS}_{\\text{i}}}}\\text{+}\\frac{\\text{1}}{\\\
  text{RTTL}_{\\text{i}}}}\\text{+}\\frac{\\text{1}}{\\text{MSTQ}_{\\text{i}}}}\\\
  text{+HC}_{\\text{i}}\\text{+RC}_{\\text{i}}\\text{L} \\quad \\text{(3.11)}$$\n\n\
  计算权重后，存储在节点缓冲区中的消息根据阈值分为两部分：高权重消息列表 (`HWML`) 和低权重消息列表 (`LWML`)。在缓冲区溢出时，仅选择 `HWML`\
  \ 中的消息按其权重值降序进行丢弃；而在消息传输机会出现时，`LWML` 中的消息按其权重值升序调度传输。该策略还使用确认机制来删除已从其他节点缓冲区递送到目的地的消息，并在节点相遇时更新此已交付消息列表。\n\
  \nq. `ST-Drop`（Chen, Yao, Zong, & Wang, 2017）是另一种本地缓冲区管理策略，它仅依赖本地可用信息来估计网络中消息的时间空间覆盖率。其基于这样观点：空间覆盖率大的消息更有可能被递送，因此可以优先丢弃。每条消息都关联两个变量：衡量消息在网络中空间覆盖率的空间系数\
  \ `S` 以及衡量消息在网络中时间覆盖率的时间系数 `T`。然后使用简单函数将这两个参数结合，以计算消息的时空覆盖率 `ST`。\n\n$$ST[c] = S[c]\
  \ \\times T[c] \\quad \\text{(3.12)}$$\n\n消息的空间覆盖率测量方法类似于 `MOFO` 方案 [16–19]，通过统计节点转发消息的次数。为了估计消息的时间覆盖率，它结合了\
  \ `FIFO` 和 `SHLI` 的概念。结合这两者的原因在于：仅使用 `FIFO` 可能会导致最近到达的消息被丢弃，而保留剩余 `TTL` 较短的消息（这些消息在一段时间后可能会因为\
  \ `TTL` 过期而被自动丢弃）；而仅使用 `SHLI`，消息即使递送概率很，也可能因为高 `TTL` 值而在节点缓冲区中不必要的长时间留。因此，`T` 计算为消息在节点缓冲区中的停留时间与其\
  \ `TTL` 的比值，从而惩罚 `TTL` 短的消息。因此，消息的时空覆盖率仅通过其本地信息计算。当缓冲区溢出时，`ST-Drop` 会丢弃 `ST` 值最高的消息。它不会丢弃\
  \ `ST` 值为零的消息，因为这些是网络中较新的消息，应该获得在网络中转发的机会。`ST-Drop` 已结合 `Epidemic`、`PRohet` 等三种路由协议进行了评估。\n\
  \nr. 在 Pan, Zhou, Liu & Song (2013) 中，作者提出了一种基于平均频率和持续的新指标。大多数缓冲区管理的工作集中在丢弃策略或调度策略上，忽略了\
  \ `TTL`。一种结合了消息状态的综合缓冲区管理技术（Mathur & Chakraborty, 2009）包含 4 个模块：\n\n#### 队列策略\n\
  当节点相遇时，它们共享关于消息的 `TTL` 状态、详情以及平均频率的信息。`CIM` 计算每条消息的优先级；如果消息在列表中，则将该消息加入队列。然后根据优先级对队列中的消息进行排序：\n\
  \n$$P_{i} = \\frac{1}{\\text{H}_{\\text{relay}} + \\text{N}_{\\text{forward}}} \\\
  quad \\text{(3.13)}$$\n\n其中：\n- `H` 是经过的跳数\n- `N` 是消息被转发的次数\n\n#### 缓冲区替换策略\n当缓冲区溢出时，节点需要丢弃某些消息以容纳新进入的消息。为此，每个节点通过其相对\
  \ `TTL`、大小和转发次数的加权组合，计算其缓冲区中每条消息的效用值：\n\n$$W_{ij} = \\alpha\\frac{\\text{TTL}_{\\\
  text{min}}}{\\text{TTL}_{\\text{o}}} + \\beta\\frac{BS_{j}}{S_{i}} + \\gamma\\frac{\\\
  text{count}_{\\text{avg}}} \\quad \\text{(3.14)}$$\n\n其中：\n- $\\alpha$, $\\beta$,\
  \ 和 $\\gamma$ 是三个参数的权重因子\n- `TTL_min` 是消息的剩余 `TTL`\n- `TTL_o` 是消息的初始 `TTL` 值\n-\
  \ `BS` 是节点 `j` 的缓冲区空间\n- `S` 是消息 `i` 的大小\n- `count_avg` 代表消息转发的平均次数\n\n节点 `j` 的整体缓冲区效用计算为：\n\
  \n$$U_{j} = \\frac{\\sum_{i=1}^{M_{j}}w_{ij}}{M_{j}} \\quad \\text{(3.15)}$$\n\n\
  其中：\n- $M_j$ 是节点缓冲区中携带的消息总数。\n\n如果拥塞节点 `j` 接收到新消息 `i`，它首先计算消息 `i` 在其缓冲区中的效用，然后与其整体缓冲区效用进行比较；如果\
  \ $W_{ij}$ 小于 $U_j$，则丢弃该消息，否则用新进入的消息替换效用值最小的消息。\n\n#### 拥塞控制\n该模块主要通过对消息的跳数和中继时间使用阈值，来尝试控制在网络中传播的消息副本数量。这有助于防止网络中出现不受控的消息泛洪，从而引起拥塞并浪费网络带宽。如果消息已经经过了预定义的跳数，或者其在网络中花费的时间超过了阈值中继时间，节点将停止转发该消息。这有助于为网络中更新的消息提供更多转发机会。\n\
  \n\n\n\n\n### 冗余删除\n\n简单来说，该模块防止了已到达目的地的消息进一步扩散，并将它们从节点缓冲区中删除，从而为网络中其他剩余消息留出更多的缓冲区空间。为了实现这一点，每个节点都维护一个\
  \ `ACKid` 列表，其中包含已知成功递送的节点 ID。在每个节点相遇时，该列表会在节点之间进行交换并更新以供进一步传播。\n\n作者们对比了 `CIM`\
  \ 与使用随机缓冲区管理的 `Epidemic` 路由、使用 `FIFO` 策略的 `Epidemic` 路由以及 `PRoPHET` 路由协议的性能。仿真结果显示，得益于改进的队列策略和缓冲区替换策略，`CIM`\
  \ 在递送率和消息递送延迟方面的性能都得到了提升。\n\n### 3.3.2 基于模糊逻辑的缓冲区管理技术\n\n一些研究工作，如 Senttawatcharawanit,\
  \ Yamada, & Haque (2013)、Makhlouta, Harkous, Hutayt, & Artail (2011) 以及 Jain, Chawla,\
  \ Soares, & Rodrigues (2014)，已经使用了模糊逻辑技术进行多消息参数聚合，并确定缓冲区中的消息优先级，随后用于做出调度或丢弃决策。\n\
  \na. 模糊喷洒 (Fuzzy-Spray)(Senttawatcharawanit, Yamada, & Haque, 2013) 是该领域的第一项工作，它使用模糊逻辑对存储在节点缓冲区的消息进行排序以确定调度顺序。模糊控制器的两个输入是消息的前向传输次数\
  \ (`FTC`) 和其大小。`FTC` 的确定非常简单，每当节点将消息复制到新节点时，`FTC` 加 1。然而，可能会出现两个拥有相同消息的节点具有不同的 `FTC`\
  \ 值。\n\nb. 自适应模糊喷洒与等待 (`AFSnW)(Makhlouta, Harkous, Hutayt, & Artail, 2011) 使用了与\
  \ Mathurapoj, Pornavalai, & Chakraborty (2009) 相同的缓冲区调度策略，但其调度策略应用于 `Spray and Wait`\
  \ 路由协议上，而不是 `Fuzzy-Spray` 中使用的 `Epidemic` 路由协议，这是因为 `Spray and Wait` 能够在降低开销率的同时实现相当的递送率。\n\
  \nc. 增强型基于模糊的喷洒与等待路由 (`EFSnWR`, Jain, Chawla, Soares, & Rodrigues, 2014) 通过在其中集成丢弃和调度策略增强了\
  \ `Spray and Wait` 路由协议的功能。消息排名使用模糊逻辑控制器 (`FLC`) 确定，该控制器以三个消息参数为输入，即消息的 `TTL`、大小和副本数量，并使用模糊逻辑进行处理。在设计模糊规则库时，副本数量参数被赋予最大权重，然后是\
  \ `TTL`，最后是大小。但 `EFSnWR` 的主要优势在于它使用了一种增强的方法来估计消息副本数量，这比 Kim & Shin (2011) 中提出的方法有所改进。每个节点在维护消息副本数的同时，还维护着一个向其转发过消息的节点列表。每当两个节点相遇时，对于它们包含的每个共同消息，该列表都会更新。这有助于在仅使用本地信息的情况下以分布式的方式妥善估计消息的副本数。\n\
  \n### 3.3.3 基于社交的路由算法中的缓冲区管理\n\n基于社交的路由是 DTN 路由范式中的一个新兴领域，其中路由决策基于节点的社交特征，例如其在网络中的重要性、所属的社区等。除了路由决策外，最近的一些工作（Shen,\
  \ 2013）（Souza, Mota, Galvao, Manzoni, & Cano, 2014）（Zhou, Lin, Zhou, & Liu, 2016）（Liu,\
  \ Wang, Guo, Lu, & Sun, 2017）也涉及了相关内容。Balasubanian (2007) 也使用了这些社交指标来做出丢弃决策。\n\n\
  a. Senttawatcharawanit 等人是该领域首批利用节点社交特征做出丢弃决策的研究，并基于此进行了调度 (Shen, 2013)。这种丢弃策略利用了社区结构和节点中心度。当缓冲区溢出时，节点首先选择目标属于其他社区的消息，并根据当前节点到消息目标节点的接近度进行排序。\n\
  \nb. 由 Li 和人提出的 Souza, Mota, Galvao, Manzoni, & Cano (2014) SEDUM 是一种基于社交效用的多副本路由协议。它利用节点之间的接触频率和持续时间来做出路由决策。除了开发路由协议外，作者们还根据消息的优先级和生存时间（TTL）属性使用了缓冲区调度。SEDUM\
  \ 的丢弃策略基于核心副本的概念，核心副本是由源创建的。SEDUM 的丢弃策略规定，缓冲区中的核心副本不能被非副本替换，进一步的非副本将根据其效用值被丢弃。\n\
  \nc. Liu 等人 (2017) 提出了一种基于社区的缓冲区管理方案，其中消息丢弃决策是基于社区属性的。当缓冲区溢出时，节点首先选择尚未进入目标社区的消息，并根据当前节点到目标节点的接近度进行排序；接近度最小的消息首先丢弃。作者们还定义了一种新指标，根据节点之间的平均相遇时间及其波动来计算接近度。\n\
  \nd. 社交感知拥塞控制算法 (`SACC`,2007) 提出了一种名为社交拥塞指标 (`SCM`) 的新指标，将节点的社交关系与其拥塞程度相结合，以决定其是否应该作为中继。这种新的社交指标随后用于转发决策；节点仅向与目标有强连接且拥塞程度较低的节点转发消息。在缓冲区溢出时，目标与当前节点社交关系最弱（因此递送概率最低）的消息被丢弃。他们的工作与\
  \ Zhou, Lin, Zhou & Liu (2016) 的工作非常相似。\n\n这些工作证明了将缓冲区策略与基于社交的路由协议相结合以增强网络性能的有效性。因此，可以验证缓冲区策略在增强基于社交网络的路由协议的网络性能方面同样有效。\n\
  \n### 3.3.4 全局缓冲区策略\n\n\n\n\n\n本地缓冲区管理策略虽然实现起来简单，但可能会导致次优决策，因为它们仅利用了关于消息的局部可用信息，而不是完整的网络全网信息（Krifa,\
  \ Barakat, & Spyropoulos, 2012）。为了做出最优的缓冲区管理决策，缓冲区管理策略需要关于网络中所有消息的充分信息。它们通过考虑接收者获得的局部收益与整个网络的全局收益之间的权衡，来决定是创建消息的额外副本还是删除消息的副本（Rohner,\
  \ Bjurefors, Gunningberg, McNamara, & Nordstrom, 2012）。全局缓冲区管理策略试图优化一个或多个网络性能指标（例如交付率或交付延迟），并基于关于消息的网络全网信息推导出消息效用函数。\n\
  \n### 意图 DTN 的资源分配协议 (RAPID)\n\n`RAPID` (Krifa, Barakat, & Spyropoulos, 2012) 是该方向的第一项工作。定义了两个效用函数：一个目标是最大化交付率，另一个是最小化平均交付延迟。在任何接触机会下，节点首先转发那些在本地能提供效用函数最大增量的消息。但为了有效实现这些效用指标，需要关于给定消息的所有副本的完整信息。然而，这种方案在\
  \ DTN 场景中难以实现，因为节点相遇之间的延迟可能是很长且随机的；因此，关于消息的信息可能会过时并导致次优决策。\n\n### 消息效用函数与 OBM 策略\n\
  \nKrifa 等人开发了两个消息效用函数，旨在优化两个特定的性能指标，即分别最大化交付率（DR`）和最小化平均交付延迟（DD`）（Krifa, 2008; Elwhishi,\
  \ Ho, Naik, & Shahida, 2013）。这些效用指标利用了网络中所有消息的完整状态，例如它们在当前网络中的副本总数、两个节点之间的相遇率等。旨在最大化平均\
  \ `DR` 的最优缓冲区管理（OBM`）策略会丢弃公式 3.16 中定义的效用函数值最小的消息 `i`：\n\n$$\n\\left( {1 - \\operatorname{}\\\
  frac{m_{i}\\left( T_{i} \\right)}{L - 1}} \\right)\\lambda R_{i}\\,\\text{exp}\\\
  left( {- \\lambda n_{i}\\left( T_{i} \\right)R_{i}} \\right)\n$$\n|| (3.16) |\n\n\
  此处，`K` 表示网络中的消息总数，`L` 是网络中的节点数，`T [i]` 表示自消息创建以来经过的时间，计算方法为当前时间与消息创建时间之差；`n [i]\
  \ (T [i])` 表示当前网络中存在的消息 `i` 的副本数量；`m [i] (T [i])` 表示见过过消息 `i` 的节点数量（它们可能没有携带该副本）；`λ`\
  \ 是相遇时间的平均值，假设其服从指数分布。\n\n同样，最小化平均 `DD` 的 `OBM` 策略会丢弃公式 3.17 中定义的效用函数值最小的消息 `i`：\n\
  \n$$\ni_{\\text{min}} = \\text{argmin}\\left\\lbrack {{\\frac{1}{\\lambda n_{i}\\\
  left( T_{i} \\right)^{2}}\\left( {1 - \\operatorname{}\\frac{m_{i}\\left( T_{i}\
  \ \\right)}{L - 1}} \\right)} \\right\\rbrack\n$$\n|| (3.17) |\n\n在 DTN 中实时获取所有消息的全局信息是不现实的。因此，还提出了一种基于历史的丢弃与调度（`HSBD`）方案，该方案基于\
  \ `n [i] (T [i])` 和 `m [i] (T [i])` 的估计使用消息效用函数。消息的复制水平在节点遇到期间更新。`HSBD` 中用于最大化交付率的单消息效用定义在公式\
  \ 3.18：\n\n$$\ni_{\\text{min}} = \\text{argmin}\\left\\lbrack {{\\frac{1}{n_{i}\\\
  left( T_{i} \\right)^{2}}\\left( {1 - \\operatorname{}\\frac{m_{i}\\left( T_{i}\
  \ \\right)}{L - 1}} \\right)} \\right\\rbrack\n$$\n|| (3.18) |\n\n此处，`m [i] (T)`\
  \ 和 `n [i] (T)` 应该是 `M(T)` 和 `N(T)`。当全局信息不可用时，`HSBD` 依赖于使用可能的 `M(T)` 和 `N(T)` 计算平均交付率的方法。`HSBD`\
  \ 的性能高度依赖于这些估计的准确性。\n\n### 基于 ODE 的调度\n\nElwhishi 等人（Wanga,2015）使用常微分方程（`ODE`）来确定最优丢弃和调度决策。每条消息都有与其相关的效用值，副本的创建或从节点中删除会影响网络的整体交付率。因此，为了研究这对网络的影响，作者使用流模型对消息传播建模，并设计了常方程来寻找消息效用。选择\
  \ `ODE` 模型而非 `Markov Chain` 模型是因为其具有扩展性，而链的计算复杂度随节点数量增加而变得非常高。`ODE` 解使用两个全局参数的估计来寻找消息效用，即：当前携带消息副本的节点数量以及见过消息副本的节点数量。每个节点计算缓冲区中每条消息的效用，然后分析丢弃或复制消息的影响，并丢弃效用最小且交付率增加最大的消息，反之亦然。\n\
  \n最大化平均交付率是丢弃满足以下条件的消息 `i`：`P [fi]` 是将消息 `i` 转发给每个遇到节点的概率，可以估计为 `P [fi] = n [i]\
  \ (t) m [i] (t)`。\n\n$$\ni_{\\text{min}} = \\text{argmin}\\left\\lbrack \\begin{array}{l}\
  \ {\\left( {1 - \\operatorname{}\\frac{m_{i}\\left( T_{i} \\right)}{N - 1}} \\right)^{2}}\\\
  left( {\\operatorname{}\\frac{N}{N - n_{i}\\left( T_{i} \\right) + n_{i}\\left(\
  \ T_{i} \\right)}.e^{\\beta NR_{i}P_{f}}}} \\right)^{m_{i}}{(T_{i})} + 1}} \\\\\
  \ \\left\\lbrack {e^{\\beta NR_{i}P_{f}}\\operatorname{}}\\left( {\\beta R_{i}n_{i}\\\
  left( T_{i} \\right) + \\frac{m_{i}\\left( T_{i} \\right)}{N}}\\operatorname{}}\
  \ \\right) - \\frac{m_{i}\\left( T_{i} \\right)}{N}} \\right\\rbrack \\\\ \\end{array}\
  \ \\right\\rbrack\n$$\n|| (3.19) |\n\n该缓冲区管理策略已在流行（Epidemic）和两跳转发（two-hop forwarding）两种流行的\
  \ DTN 路由协议上进行了评估和比较。\n\n\n\n\n\nd. Wanga, Yanga, & Wub (2015) 为 Spray and Wait 路由协议提出了一种消息调度和丢弃策略的非启发式解决方案。作者指出，`RTTL`\
  \ 和消息副本数是影响缓冲区管理决策的两个重要因素，以启发式的方法将两者结合并不总能产生最优解。由于存在节点缓冲区中的消息大小不一，缓冲区管理问题可以被视为具有不同效用值和大小的\
  \ 0/1 背包问题。这可以被作为一个优化问题来求解，其目标是最大化网络的整体投递率。随后，该优化问题通过动态规划技术进行求解。该工作针对其缓冲区管理策略提供了一种理论上的集中版本和一种实用的分布式版本，以考虑延迟容忍网络（DTN）动态变化的环境。\n\
  \n缓冲区管理决策通过计算丢弃或调度消息对投递率的影响来得出的。该方案相比于以往工作（如 Krifa, Barakat, & Spyropoulos (2012);\
  \ Elwhishi, Ho Naik, & Shahida (2013)）的主要优势在于，它在计算消息效用时，还考虑了消息在剩余 TTL 期间可能创建的消息副本数量。其次，他们还考虑了消息传输可能由于带宽限制而中断的情况。计算的消息效用函数如下：\n\
  \n$$\\\\begin{matrix} {U\\\\_{i} = \\\\operatorname{}\\\\left\\\\lbrack {N - m\\\
  \\_{i}\\\\left( T\\\\_{i} \\\\right)} \\\\right\\\\rbrack\\\\operatorname{}N^{\\\
  frac{1 - \\\\in\\\\_{i}}{\\\\in\\\\_{i}}}e^{- \\\\lambda NR\\\\_{i}\\\\operatorname{}}}\\\
  \\frac{1}{\\\\in\\\\_{i}}\\\\left( {1 - e^{- \\\\in \\\\lambda NR\\\\_{i}\\\\operatorname{}}}}\
  \ \\\\right)\\\\left\\\\lbrack {n\\\\_{i}\\\\left( T\\\\_{i} \\\\right) - n\\\\\
  _{i}\\\\left( T\\\\_{i} \\\\right)e^{- \\\\in \\\\lambda NR\\\\_{i}\\\\operatorname{}}}}\
  \ \\\\right.} \\\\\\\\ {\\\\,\\\\\\,\\left. {Ne^{- \\\\in \\\\lambda NR\\\\_{i}\\\
  \\operatorname{}}}} \\\\right\\\\rbrack^{\\frac{- 1 - \\\\in\\\\_{i}}{\\\\in\\\\\
  _{i}}}\\\\operatorname{}} \\\\\\\\ \\\\end{matrix}$$\n\n(3.20)\n\n该效用函数基于以下假设：节点之间的相遇时间遵循指数分布，据此确定消息成功投递的概率。消息根据其单位效用值（即\
  \ `U [i] /M [i]`）进行调度。这是为了考虑到在带宽限制的情况下，较大的消息需要更多的缓冲区空间和更多的传输时间。为了实现该缓冲区管理方案的分布式部署，使用了参数\
  \ `n [i] (T)` 和 `m [i] (T)` 的局部估计值。因此，每个节点都会收集并维护其过去见过的某些消息的历史信息。\n\ne. 有学者了一种联合中继选择和缓冲区管理方案（Le,\
  \ Kalantarian, & Gerla, 2016），其目标是最大化网络的投递率。该工作解决了在资源受限 DTN 中消息传递过程中面临的三个主要问题：中继节点选择、消息调度顺序以及缓冲区溢出时的消息丢弃顺序。\n\
  \n中继选择基于社会关系的概念，其中两个节点之间的社会关系通过它们的相遇频率和联系新鲜性来确定。节点 `i` 与节点 `j` 在任意时刻 `t [base]`\
  \ 的社会关系值（用 `Ri(j)` 表示）计算如下：\n\n$$R\\\\_{i}\\\\left( j \\\\right) = \\\\operatorname{}\\\
  \\sum\\\\limits\\\\_{k = 1}^{n}F\\\\left( {t\\\\_{\\text{base}} - t\\\\_{j\\\\_{k}}}\
  \ \\\\right)$$\n\n(3.21)\n\n其中 `t [base]` 表示当前时间，`t [jk]` 表示节点 `i` 和 `j` 之第 `k`\
  \ 次相遇的时间。这里，`F(x)` 是两个节点之间相遇时间的函数。\n\n如果一个节点与消息目的地的社会关系比消息的当前载体更高，则称该节点是消息的良好中继。然而，可能会出现相遇节点与目的地的社会关系值为零的情况。因此，作者建议使用另一种名为“社会投递潜力”（social\
  \ delivery potential）的指标，它仅仅是一个节点及其邻居社会关系值的集合聚合；因此，即使一个节点通过其邻居与目的地建立了高社会关系，它也是一个良好的中继。\n\
  \n现基于投递预测性或社会关系指标的路由方案倾向于选择网络中的热门节点，或选择与目的地具有高投递预测性或高社会关系强度的节点。这会导致这些节点出现拥塞，引发缓冲区溢出和频繁的消息丢弃，从而导致网络整体投递率下降。因此，作者建议在选择中继节点时同时使用社会关系强度节点队列长度。这有助于流量在网络中均匀分布，并防止高连接节点过载。选择队列长度的原因是因为反映了连接状况。因此，只有当节点对目的地具有高社会投递潜力且比当前载体不拥塞时，才会被选为中继节点。\n\
  \n接下来，为了优化消息调度和丢弃顺序，开发了一种考虑全局消息、节点和模式信息的效用函数。该效用函数是为异构节点移动设计的，即每对节点可能有不同的相遇速率和接触速率，这与以往大多数工作不同（Krifa,\
  \ Barakat, & Spyropoulos, 2012; Elwhishi, Ho, Naik, & Shahida, 2013; Wanga, Yanga,\
  \ & Wub, 2015）。假设节点相遇时间和接触持续遵循指数分布，分别为 `λ` 和 `θ`。节点通过直接接触或其他节点收集全局网络信息。每个节点记录关于其他节点的某些元数据，如与其他节点的接触统计、其缓冲区存储的消息列表以及最后更新时间等；每个节点还维护网络中所有消息的信息。基于这些全局信息，开发了用于最大化网络投递率的以下效用值：\n\
  \n$$Ui = - e^{- \\\\lambda iRi - \\\\theta iHi}{\\\\sum\\\\limits\\\\_{n = 1}^{\\\
  \\infty}\\\\left\\\\rbrack {\\\\left( {1 - e^{- \\\\theta iHi}} \\\\right)^{n -\
  \ 1}{\\\\sum\\\\limits\\\\_{k = 0}^{n - 1}\\\\frac{\\\\left( {\\\\lambda iRi} \\\
  \\right)^{k}}{k!}}} \\\\right\\\\rbrack}$$\n\n(3.22)\n\n其中：\n\n- `R [i]` 是消息 `i`\
  \ 的剩余 TTL，\n- `λ [i]` 是拥有消息 `i` 的节点与目的地之间的平均相遇速率，\n- `θ [i]` 是拥有消息 `i` 的节点与目的地之间的平均接触速率，\n\
  - `H [i]` 表示成功投递消息 `i` 所需接触时间。\n\n\n\n\n\n`f.` `Iranmanesh` (2016) 使用多目标效用函数进行缓冲区管理决策，该函数结合了最大化交付率的效用函数和最小化传输延迟的效用函数。最大化交付率和最小化传输延迟的效用函数采用\
  \ Elwhishi, Ho, Naik, & Shahida (2013) 方法，利用消息在剩余 TTL（生存时间）期间节点的相遇概率推导得出；然而，作者还考虑了交付率随消息\
  \ TTL 的变化以及消息副本数量的变化。作者将所提出的缓冲区管理方案与基于遭遇的路由协议相结合，这是一种基于配额的路由协议，利用节点间的相遇频率进行消息副本分配（Nelson,\
  \ Bakht, & Kravets, 2009）。\n\n```\nUF[i] = α * φ(Delivery_μ[i]) + β * φ(Delay_μ[i])\n\
  ```\n\n其中 `φ(Delivery_μ [i])` 和 `φ(Delay_μ [i])` 分别使用权重因子 `α` 和 `β` 结合交付效用和延迟效用，以结合交付率和传输延迟的影响。由于交付率效用和传输延迟效用的值处于不同的领域，在合并之前进行了归一化处理。\n\
  \n### 3.3.5 容延网络中的流量区分方案\n\n流量区分概念在互联网上被广泛用于，用于区分由不同应用源产生并在网络中具有不同服务质量（QoS）要求的不同流量。它允许网络根据优先级类对数据包进行区分，并优先处理高优先级类的消息。差异服务（DiffServ）和集成服务（IntServ）是互联网上两种常用的技术（维基百科）。DiffServ\
  \ 根据服务类别（CoS）对流量进行分类，对高优先级流量数据包给予优先处理以满足其 QoS 要求；而尽力为模型（best effort model）对网络中产生的所有类型应用数据赋予相等优先级，无法满足不同应用的\
  \ QoS 要求。\n\nDTN 也设计用于支持可能有不同性能要求的多个应用程序，但存储和带宽等网络资源是 DTN 中的限制（Jain and Chawla,\
  \ 2017）。DTN 架构中的数据包（bundles）定义了三种优先级类（Cerf, Burleigh, Hooke, Torgerson, Durst, &\
  \ Scott, 2007）：批量类（bulk class）用于低优先级流量，普通类（normal class）用于中优先级流量，加速类（expedited class）表示高优先级流量。这些优先级类的主要目的是定义存储在节点缓冲区消息的相对调度和丢弃顺序。优先级最高的加速消息应在任何接触机会处首先调度，随后是普通和批量消息。\n\
  \n第 3.3.1 节和 3.3.4 节中讨论的本地和全局缓冲区管理方案没有根据服务类别对消息进行优先级排序，因此无法保证服务质量。因此，考虑消息的流量类别同样重要，还需要考虑满足不同应用\
  \ QoS 要求所需的其他消息属性。\n\n#### a. ORWAR（基于窗口感知自适应复制的容延 DTN 路由）\n\nSandulescu 和 Tehrani\
  \ (2008) 针对 Spray and Wait 路由协议提出了一种基于消息优先级类的消息排序方案。在任何传输机会上，消息按照其效用/大小值的顺序进行传输，其中消息的效用由其优先级类决定。属于高优先级类的消息被分配了最高效用值。这种排序有助于优先考虑高优先级类消息。为了给高优先级类消息提供更多传输机会，该类消息分配了更多副本，即\
  \ `L+Δ`；而 Spray and Wait 路由协议中所有消息无论其效用值如何，都被分配固定数量的消息副本，即 `L`。相反，低优先级类消息分配的消息副本较少，即\
  \ `L−Δ`，这直接影响了它们的交付概率。为了避免部分传输消息导致带宽浪费，使用了接触时间的估计值来确定在遭遇机会期间可以传输的数据量。尽管 ORWAR 使用了消息的优先级类，但它忽略了一些重要参数，如当前副本数量、交付概率等。\n\
  \n#### b. PG 和 CST 调度\n\nSoares, Farahmand & Rodrigues (2011) 为车载容延网络（VDTNs）提出了两种非常流行的流量区分方案，即优先级贪婪（PG）和自定义服务时间（CST）。他们的工作基于\
  \ DTN 架构中定义的优先级 CoS（Cerf, Burleigh, Hooke, Torgerson, Durst, & Scott, 2007）。它假设消息的服务类别由源节点分配且不随时间改变。\n\
  \n在 PG 调度中，在任何接触机会上，首先调度加速类消息，然后是普通类消息，最后是批量类消息。在新消息到达且缓冲区溢出的情况下，节点总是丢弃低优先级类消息。这种方法的主要缺点是，由于时间和存储限制，它会严重影响批量和普通类消息的交付。\n\
  \n在 CST 调度方案中，首先估计节点间的接触时间，然后用它决定在该接触时间内可以传输的数据量。估计的接触时间在三个流量类之间共享，最大的服务时间分配给加速类，以此类推。除了带宽，节点的缓冲区存储也按照相同的比例划分到三个流量类队列中。在新消息到达时，节点将消息放入相应的流量类队列。如果相应队列满，则丢弃该特定流量类队列的消息。\n\
  \n这些方案仅根据剩余 TTL 调度特定流量类队列内的消息，而进一步的研究（Jain and Chawla, 2017; Shin and Kim, 2012;\
  \ Matzakos., Spyropoulos, & Bonnet, 2015）显示，在每个流量类队列中使用适当的消息排序机制可以提高每个流量类队列的交付率。\n\
  \n\n\n\n\nc. 在 Shin 和 Kim (2012) 中，基于服务的调度与丢弃策略（`CoSSD`）使用了三个额外的消息属性，即消息副本数量的估计（标记为\
  \ `ETR`）、已通过时间（标记为 `ET`）和剩余 TTL（标记为 `RT`），并结合消息优先级对消息进行排序。来自急用类（edited class，被视为最高流量类别）的消息优先调度，随后是普通类（normal）和批量类（bulk），在每个类别内部，使用\
  \ `ETR` 对消息进行排序。除了调度外，还结合使用了两种缓冲区丢弃策略，在缓冲区拥塞时决定丢弃哪些消息。前者将消息的优先级类别与消息效用函数结合，旨在优化交付率，这与\
  \ `OBM` (Krifa, 2008) 中的定义相似。后者丢弃策略将消息的 `ETR` 值与消息在网络中花费的时间（即 `ET`）结合。因此，在缓冲区溢出时，它会选择那些在网络中已有大量副本且相对较旧的消息，即使它们属于较高优先类别，因为它们到达目的地的概率相对较高。由于\
  \ `ETR` 是做出丢弃和调度决策的重要参数，准确估计其值对于这些方案的有效性非常重要。作者使用了他们之前提出的方法（Kim and Shin, 2011）来估计消息副本的数量，该方法在\
  \ 3.3.1(m) 中已讨论了其若干缺点。\n\nd. DTN 的消息优先级问题在 Matzakos, Spyropoulos, & Bonnet (2015)\
  \ 中被描述为一个受限优化问题，并提出了一种基于分布式梯度下降的解决方案。假设属于特定类的每个包（bundle）都关联有一个 `QoS` 约束，在这项工作中，该约束被视为最小接受交付概率。在求解受限优化问题时，基于梯度下降的算法可以使用每个违反约束的约束适当的惩罚函数。因此，如果一个包的预测交付概率低于其类别要求，则其效用值将增加一个与交付缺口成正比的项。这确保了不满足\
  \ `QoS` 约束的包的效用始终高于满足约束的包的效用，因此此类消息始终优于其他消息，从而收敛到可行解。为了实现这种分布式算法，存储在节点缓冲区中的包被分为两个动态组：第一组包含所有预测交付低于其\
  \ `QoS` 阈值的包；第二组由高于其阈值的包组成。第一组的包优先调度，随后是属于第二组的包。在每个组内部，消息根据其优先级类别进一步划分为子组，在每个子组内，使用\
  \ Krifa, Barakat, & Spyropoulos (2012) 定义效用函数 `U` [i] 对消息进行排序。这确保属于较高 `QoS` 类的子组优先级始终高于属于较低\
  \ `QoS` 类的子组。\n\ne. Jain 和 Chawla (2017) 提出了一种缓冲区管理方案，旨在支持 DTN 中的流量差异化（或优先级划分）。它支持优先级类别模型以提供资源的自定义分配，并采用模糊消息排名机制对每个流量类别队列中的消息进行排序。所提出的流量差异化方案灵感来自\
  \ `CST` 流量差异化的通用指南（Sandulescu and Tehrani, 2008）。它使用了相同的概念，将可用带宽和缓冲区空间资源分配在三个流量类别之间，以确保公平性的同时，对急用类消息提供优先待遇。但在每个流量类别队列中，除了\
  \ `RTTL` 之外，还使用了两个消息属性，即副本数量（即消息复制到遇到节点的次数）和大小，来做出丢弃和调度决策。基于模糊的消息排名算法基于作者之前的工作之一（Jain,\
  \ Chawla, Soares, & Rodrigues, 2014）。\n\n### 3.4 总结与讨论\n\n在任何接触机会对节点缓冲区中的消息进行调度，以及在缓冲区溢出时新消息到达时进行消息丢弃，是\
  \ DTN 消息交付过程中必须做出的两个重要决策。这些决策对在资源受限环境下工作的 DTN 路由协议的性能产生重大影响。人们提出了许多缓冲区管理技术，根据用于决策的信息量和类型而异。对这些技术进行全面研究揭示了在消息传输和缓冲区溢出时可能用于消息排序的不同消息参数（Jain,\
  \ Chawla, Soares, & Rodrigues, 2014; Lakkakorpi, Pitkanen, & Ott, 2011）：\n\n- 消息的\
  \ `RTTL`，即消息在网络中活跃的剩余时间，因为 `TTL` 过期后消息将从网络中删除。\n- 消息的 `Age`，即消息自创建以来在网络中花费的时间。\n\
  - 消息的 `Hop count` 或正向传输次数，即消息从源节点到当前节点传输的跳数。\n- 消息的 `Number of replicas`，即网络中拥有消息副本的节点数量。\n\
  - 消息的 `Last forwarding time`，即节点转发消息最后的时间戳。\n- 消息的 `Size`。\n- 到目的地的 `Distance`。\n\
  - 消息的 `Delivery cost`，例如节点遇到消息目的地的概率。\n- 节点间的 `Contact statistics`。\n\n大多数工作开发了基于本地知识的缓冲区管理策略，因为它们易于设计且所需信息很少；而全局缓冲区管理策略虽然能保证最优解，但由于需要所有消息或其估计值的网络信息，在实际实现上非常复杂。`Hop\
  \ count` 或正向传输次数以及 `replica count`：这些参数表示了消息在网络中传播的程度，是消息优先级排序最重要的参数；以分布式方式准确估计这些参数是一项关键任务。\n\
  \n\n\n\n另一个显著特征是缓冲区管理策略在进行决策时使用的消息参数数量。某些缓冲区管理策略单独使用其中一种或两种消息参数（Tang, Chai, & Weng,\
  \ 2012; Davis, Fagg, & Levine, 2001; Naves, Moraes, & Albuquerque, 2012; Ramanathan,\
  \ Hansen, & Basu, 2007; Li, Zhao, Liu, & Liu 2009; Soares, Farahmand, & Rodrigues,\
  \ 2010; Bjurefors, Gunningberg, Rohner, & Tavakoli, 2011; Rohner, Bjurefors, Gunningberg,\
  \ McNamara, & Nordstrom, 2012; Ayub and Rashid, 2010; Rashid, Ayub, Soperi, Zahid,\
  \ & Abdullah, 2011; Abdullah, Soperi, Zahid, & Ayub, 2012; Rashid, Ayub, Soperi,\
  \ Zahid, & Abdullah, 2013; 以及 Liu, Wang, Zhang, & Zhou, 2011），而其他策略则结合多个消息参数来决定消息优先级（Kim\
  \ & Shin, 2011; Jain, Chawla, Soares, & Rodrigues, 2014; Prodhan, Das, Kabir, &\
  \ Shoja, 2011; Rashid, Ayub, & Abdullah, 2015; Silva, Miniy, & Loureiro., 2017;\
  \ Chen, Yao, Zong, & Wang, 2017; Pan, Ruan, Zhou, Liu, & Songet, 2013; Mathurapoj,\
  \ Pornavalai, & Chakraborty, 2009; 以及 Senttawatcharawanit, Yamada, & Haque, 2013）。后者显示出更好的性能。消息参数聚合是另一个需要特别关注的研究领域，以便确保每个消息参数都能获得应有的权重。\n\
  \n## 3.5 未来工作方向\n\n大多数工作仅针对一 或两种路由协议对其方案进行了测试。需要对缓冲区管理方案在不同类路由协议（如基于泛洪的、基于复制的、基于控制复制的、基于历史的、基于社交等的）中的应用进行全面分析，以分析它们对各自的影响，并确定哪种类型的缓冲区管理方案最适合哪种路由协议。缓冲区管理和路由策略是容延节点网络（DTN）消息传递过程中两个互补的方面，它们应该协同工作，当合理结合时，可能会提高交付率、交付延迟和开销率的性能。\n\
  \n为了获得全局缓冲区管理方案以及某些局部缓冲区管理方案的最优，使用了不同的消息副本数量估计。这些缓冲区管理策略的性能高度依赖于这些估计的准确性。在 DTN 中很难实现，因为频繁的网络分区导致节点邻域是动态的。基于本地知识可靠估计消息副本数量是实现基于消息副本数量缓冲区管理策略的关键挑战之一。\n\
  \n拥塞控制机制的使用使得缓冲区调度和丢弃策略更加有效。在缓冲区溢出时不简单地丢弃消息，如果节点能够检测到网络区域的拥塞，就可以防止在该期间浪费资源。节点除了预测接触时间外，还可以交换空闲缓冲区空间，防止不必要的丢丢失并保存已在节点缓冲区中的消息。因此，缓冲区管理应该是拥塞控制的不可组成部分，而不是一个独立的方面。\n\
  \n需要一种自适应 DTN 设计所面临的挑战性网络环境的综合缓冲区管理技术。\n\n## 参考文献\n\nAyub , Q., & Rashid , S. (2010).\
