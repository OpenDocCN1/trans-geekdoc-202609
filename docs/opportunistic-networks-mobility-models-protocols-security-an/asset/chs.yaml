  - Ahmed Al-Gburi, Abduljaleel Al-Hasnawi, Raed Salih, and Leszek Lilien\n\n## 11.1\
  \ 引言\n## 11.2 Oppnets 背景信息\n    - 11.2.1 Oppnet 结构与运行\n    - 11.2.2 Oppnet 辅助节点及其分类\n\
  \    - 11.2.3 Oppnet 的安全与隐私挑战\n## 11.3 泛在信任基础 (PTF) 背景信息\n## 11.4 文献综述\n    - 11.4.1\
  \ 与 Oppnets 相关的概念\n    - 11.4.2 用于安全与隐私的泛在信任基础\n    - 11.4.3 其他相关工作\n## 11.5 提出的解决方案：基于\
  \ PTF 的 Oppnet 架构 (POA)\n    - 11.5.1 POA 结构\n    - 11.5.2 POA 运行\n## 11.6 结论\n\
  - 关键术语与定义\n- 参考文献\n- 高级/进阶阅读\n\n## 11.1 引言\n\n共存的异构计算系统往往无法进行协作，这浪费了利用率不足的系统的资源，同时让繁忙的系统遇到了资源限制。当一个负载过重的系统是利用率不足的系统的邻居，且后者无法“帮助”前者时，这种现象尤为明显。\n\
  \n为了应对这种情况，Lilien 等人（2006a）引入了机会性资源利用网络（`oppnets`）范式和技术。oppnets 的独特特征是使用“辅助节点”（helpers）来协助实现\
  \ oppnets 的目标。通过辅助节点，oppnets 以机会性和自组织的方式通过获取更多种所需的资源进行扩展；这些资源可能来自利用率不足的邻居等。\n\n\
  文献中提到的其他类型的机会性网络包括：\n1. 支持辅助节点实现 `oppnets` 目标。\n2. 对各种资源的机会性利用。\n3. 网络的自组织运行。\n\
  4. `oppnets` 的通用性。\n5. 缺乏第三方。\n\n由于其异构性，安全和隐私是 `oppnets` 面临的主要挑战。我们认为信任应该是所有安全和隐私解决方案的基础。\n\
  \n在本章中，我们为 `oppnets` 提出了一种新架构，名为 `POA`。`POA` 将 `PTF` 集成到 `oppnet` 的结构和运行中，称为 `DOC`。`PTF`\
  \ 确保了整个 `oppnet` 周期内的安全与隐私。\n\n本章结构如下：\n- 第 11.2 节提供了 `oppnets` 的背景信息，包括对安全隐私挑战的讨论。\n\
  - 第 11.3 节概述了 `PTF`。\n- 第 11.4 节讨论了相关工作和解决方案。\n- 第 11.5 节描述了 `POA` 的结构和运行。\n- 第\
  \ 11.6 节总结本章。\n\n## 11.2 Oppnets 背景信息\n\n机会性资源利用网络（`oppnets`）是一种特殊的网络范式，通过发现拥有所需资源的外部实体（不是当前\
  \ `oppnet` 部分的系统或设备）并将其作为辅助节点整合到 `oppnets` 中扩张（Lilien 等人，2006a, 2007）。这种通过自组织方式寻找辅助节点的扩张方式是\
  \ `oppnets` 最显著的特征。\n\n潜在的辅助节点是支持 `oppnet` 功能的外部实体，即具有足够的通信能力被 `oppnet` 联系到。一旦被\
  \ `oppnet` 邀请，它就可以作为（实际）辅助节点加入 `oppnet`，并由于拥有资源而帮助 `oppnet` 完成任务（Lilien 等人，2006a,\
  \ 2007）。\n\n### 11.2.1 Oppnet 结构与运行\n\n本节展示了基本的 `oppnet` 结构及其活动和操作。\n\nOppnet 结构：`oppnet`\
  \ 由三大类组件或节点组成（Lilien 等人，2007, 2010b; Kamal 等人，2008），所示图 11.1。\n\n![](img/fig11.1.jpg)\n\
  \n图 11.1\nOppnet 从 (a) 种子 oppnet 增长为 (b) 扩展后的 oppnet。（源自 Lilien, L., 等., Opportunistic\
  \ networks for emergency applications and their standard implementation framework,\
  \ in IEEE International Performance, Computing, and Communications Conference (IPCCC),\
  \ New Orleans, LA, 2007, 588–593。）\n\n1. 种子节点：构成种子 oppnet 的 `oppnet` 节点集合，在初始 `oppnet`\
  \ 部署时共同使用。它可能很小——极端情况下只有一个。\n\n2. 控制中心 (CC) 节点：`oppnet` 节点的一个子集，共同实现分布式的 `CC`，负责管理所有交互和处理，包括\
  \ `oppnet` 的增长和收缩（例如从 `oppnet` 中移除恶意节点）。\n\n\n\n\n### 3. 辅助节点\n最初是外部的但被整合到对抗网络（oppnet）中以协助其实现预期目标的节点。例如，图\
  \ 11.1b 中扩展的对抗网络接纳了以下辅助节点（从左下角逆时针方向）：(a) 连接到互联网的计算机网络；(b) 手机基础设施（由手机塔表示），通过对抗网络的手机外围设备连接；(c)\
  \ 一颗卫星，通过直接卫星链路连接；(d) 一个家庭局域网，通过具有无线连接的智能设备（如冰箱）连接；(e) 一个微波网络，通过微波中继站连接；以及 (f) 翻覆汽车内人员的人体局域网（`BANs`），通过\
  \ `OnStar` 连接（Lilien et al., 2007）。\n\n### 基础对抗网络操作\n`CC`（控制中心）管理种子对抗网络（图 11.1a）。该过程涉及寻找有用的外部实体并将其接纳以帮助实现对抗网络的目标。接受帮助邀请的实体将有义务在对抗网络需要时持续提供帮助，并成为一个辅助节点。当辅助节点完成其任务时，对抗网络会将其从义务中释放，它可以自由返回其原始职责（Lilien\
  \ et al., 2010b）。\n\n对抗网络操作的基本序列总结在图 11.2 中（Lilien et al., 2010b）。分布式的 `CC`（又称去中心化指挥中心）在整个对抗网络的生命周期内监督其对抗网络的操作。如果对抗网络需要更多资源来实现目标，则重复对抗网络增长的循环（包括发现、评估、接纳和整合候选辅助节点）。一旦实现了对抗网络的目标，对抗网络将协助辅助节点恢复到加入对抗网络之前的状态，并释放它们（Lilien\
  \ et al., 2006a, 2007, 2010b）。\n\n![](img/fig11.2.jpg)\n\n图 11.2\n\n基础对抗网络操作（参见\
  \ Lilien et al., 2010b）。\n\n### 11.2.2 对抗网络辅助节点及其分类\n一个能够下载并安装连接对抗网络所需的最小对抗网络中间件模块子集的实体即变为具备对抗网络能力（oppnet-enabled）。任何具备对抗网络能力的实体都是潜在的辅助节点（Lilien\
  \ et al., 2010b）。辅助节点可以拥有可能对对抗网络有用的多样化能力和“技能”，例如专门软件、通信、计算、存储、感知或执行能力。对抗网络辅助节点通常可以分为三大大类（Lilien\
  \ et al., 2010b; Alduailij and Lilien, 2015）：\n\n1. **潜在辅助节点**：对抗网络范围内的、具备对抗网络设备设备，它们可以作为未来的辅助节点为其提供服务。\n\
  2. **候选辅助节点**：潜在辅助节点中满足对抗网络任务需求的子集，它们被要求或命令加入对抗网络（分别在普通情况或紧急情况下）。\n3. **实际辅助节点**：由对抗网络选择并接纳的候选辅助节点子集。实际辅助节点（通常称为辅助节点）包括两个子类（Lilien\
  \ et al., 2006a, 2007; Alduailij and Lilien, 2015）：\n    a. **常规辅助节点**：可以发现、邀请和接纳其他辅助节点；它们为接纳它们的对抗网络提供大量资源。\n\
  \    b. **轻量级辅助节点**：资源受限（通常是受限于软硬件能力）。\n\n### 11.2.3 对抗网络安全与隐私挑战\n为对抗网络提供安全和隐私控制对于对抗网络、具备对抗网络能力的应用及其用户是至关重要的。事实上，Lilien\
  \ et al.（2006b, 2010b）甚至将安全和隐私挑战称为“制造或破坏”的问题。对抗网络可能会损害人类及其基础设施。\n\n对抗网络可以被视为自组织网络或系统的泛化，因此它们继承了自组织网络的所有安全和隐私挑战。Lilien\
  \ et al.（2006a）提出了六项必须确保对抗网络安全和隐私的挑战。这些挑战是：(1) 增加信任和安全路由；(2) 节点隐私和对抗网络隐私；(3) 数据隐私；(4)\
  \ 确保数据完整性；(5) 识别攻击并概述解决方案；(6) 入侵检测。\n\n我们关注对抗网络数据的安全和隐私。我们考虑各种威胁和攻击，包括来自网络外部的攻击和来自内部的攻击。攻击包括拒绝服务（`DoS`）、窃听、信息泄露、身份欺骗、中间人（`MITM`）攻击、黑洞和丢包（灰洞）攻击（Lilien\
  \ et al., 2006a, 2010b）。例如，当节点发送帮助请求时，恶意节点修改该信息就会发生中间人攻击。\n\n对抗网络还应防止恶意实体加入。此外，任何外部或内部实体都可能恶意或无意地暴露或破坏数据。由于无法确定攻击者的动机，即使是无意的泄露（例如并非恶意而是自私，Buttyan\
  \ and Hubaux, 2007）也必须被视为攻击。\n\n### 11.3 泛在信任基础（PTF）背景\nPTF 范式（Lilien et al., 2009,\
  \ 2010a）将信任作为计算系统安全隐私的基础。PTF 涉及两个主要原则。首先，信任应作为安全和隐私的基础（以及本章未考虑的其他服务，如协作或路由）。其次，信任在系统中应该是泛在的，必须在大型开放系统（如对抗网络）中显式考虑，或在小型封闭系统内隐式考虑。\n\
  \nPTF 模块处理其对抗网络的信任信息。`Entity O` 对 `Entity H` 当前的信任值决定了 `Entity O` 授权其执行的操作。`Entity\
  \ O` 根据其对 `Entity H` 的直接经验以及从其他实体获得的关于 `Entity H` 声誉信息（间接经验）来计算 `Entity H` 的信任值。\n\
  \n实体的信任水平必须以适当的频率重新评估，因为它随时间动态变化。\n\n## 11.4 文献综述\n本节讨论了对抗网络相关的概念、将信任视为安全隐私基础的工作以及其他相关工作。\n\
  \n### 11.4.1 对抗网络概念\n\n\n\n\n\nPelusi 等人 (2006) 和 Conti 等人 (2010) 将机会性网络视为移动自组织体系网络（`MANETs`）最有趣的演进之一，其特征是自组织网络化和“存储-携带-转发”范式。在机会性网络中，即使移动节点之间从没有存在过连接它们的路由，它们也能够彼此进行通信。具体而言，节点移动性被用作在网络不连通部分之间传输数据的机会。因此，路由是动态建立的。消息在发送者和目的地之间进行路由，只要任何潜在的中间节点可能将消息带到更近的地方，就可以被机会性地用作下一跳。作者指出，节点移动性起着至关重要的作用，因为它允许桥接断开的节点云，并最终在连接性较弱的情况下实现端到端通信。他们设想在下一代互联网中使用机会性网络。\n\
  \nAlajeely 等人 (2016) 将机会性网络（将其称为“OppNets”）定义为 `MANETs` 的演进，其中许多无线节点通过“存储-携带-转发”的方式进行机会性通信。可以使用多种无线技术来传输数据，包括\
  \ WiFi、WiMAX 和蓝牙。在发送消息之前，源节点和目的节点之间没有端到端连接；节点通常具有高移动性、低密度、有限功率和短无线范围。由于这些特征，`OppNets`\
  \ 面临严重的安全和隐私问题，例如节点认证和访问控制的挑战；数据机密性、完整性和可用性；以及路由、安全、隐私和信任管理。\n\n总体而言，我们认为如前文（Lilien\
  \ 等人，2006a）定义的 oppnets 与其他研究人员如 Pelusi 等人 (2006)、Conti 等人 (2010)、Alajeely 等人 (2016）定义的机会性网络有显著区别。最重要的是，oppnets\
  \ 不仅能够实现机会性通信，还能机会性地利用各种资源、服务或能力（包括硬件、软件和人类技能），这些资源恰好位于 oppnet 的触及范围内。另一个独特特征是，oppnet\
  \ 从一个较小的预定义网络（种子 oppnet）开始，并成长为扩展的 oppnet。\n\n## 11.4.2 用于安全和隐私的泛在信任基础\n\nBhargava\
  \ 等人 (2004) 引入了泛在信任的概念。他们意识到在计算系统中使用信任已经非常普遍。信任在人、组织、动物甚至人造物的许多交互中是存在且应该是泛在的。因此，在计算环境中也应该考虑泛在信任。作者认为信任可以支持安全和隐私，促进解决方案。\n\
  \nLilien 等人 (2009, 2010a) 针对包括未来互联网在内的代网络提出了 `PTF` 范式。他们声信任也可以用于许多其他功能，例如路由、数据聚合、时间同步，甚至刺激自主无线网络中的合作。作者声称：(1)\
  \ 没有信任的安全（不基于信任）比有信任的安全（基于信任）更难实现；(2) 将狭义定义的信任与广义定义的信任混淆，会导致否定对泛在信任基础的需求；(3) 没有信任的安全（不基于信任）比有信任的安全（基于信任）更难实现；(4)\
  \ 将狭义定义的信任与广义定义的信任混淆，会导致否定对泛在信任基础的需求。\n\n## 11.4.3 其他相关工作\n\n网络函数虚拟化（`NFV`）：`NFV`\
  \ 范式将软件功能与底层硬件分离。`NFV` 为越顶（OTT）服务开启了大门，这些服务可能与其基础设施有很大不同。例如，`NFV` 可提供安全和隐私保护服务。`NFV`\
  \ 可提供网络的安全、隐私和一致性。\n\n软件定义网络（`SDN`）：`SDN` 是一种将网络软件与底层硬件分离的网络范式。从控制逻辑与数据转发器的分离可以通过\
  \ `SDN` 实现。通过 `SDN`，交换机变成了简单的转发设备，控制逻辑由集中式控制器实现。此类接口的一个示例是 `OpenFlow`。我们认为 `SDN`\
  \ 可以像路由器、交换机或防火墙一样工作。\n\n## 11.5 提出的解决方案：基于 PTF 的 oppnet 架构\n\n提出的 oppnets 安全和隐私架构被称为基于\
  \ PTF 的 oppnet 架构（`POA`），基于单个 oppnet 辅助器的状态图（Al-Gburi, 2017），如图 11.3 所示。\n\n`POA`\
  \ 将 `PTF` 集成到 oppnet 的结构和操作中，将其置于 oppnet 监管者的控制下，此前称为去中心化的 `CC`，现在更名为去中心化 oppnet\
  \ 控制器（`DOC`）。`PTF` 在整个生命周期内是所有安全和隐私服务的基础。\n\n### 11.5.1 POA 结构\n\n种子 oppnet 和扩展\
  \ oppnet 的 `POA` 结构如图 11.4 所示。下面简要描述 `DOC` 和 `PTF`。\n\n\n\n\n\n基础 POA 结构：(a) 种子机会网络\
  \ (oppnet) 和 (b) 扩展后的机会网络。（参见 Al-Gburi, 2017）。\n\n### 去中心化机会网络控制器 (DOC)\n这是一种控制所有网络网络所有交互和活动的去中心化软件。`DOC`\
  \ 对机会网络具有以下有益的属性：\n\n1. 控制所有机会网络操作。\n2. 决定通过接纳其他新节点来扩展其机会网络，或通过释放或移除节点（驱逐恶意节点）来收缩其机会网络。\n\
  3. 监控协作处理。\n4. 监督并监控 PTF 处理。\n5. 根据来自协作和 PTF 处理的反馈，检测机会网络实体的可疑行为。`DOC` 成了检测内部攻击的第二道防线。\n\
  \n### 泛在信任基础 (PTF)\n`PTF` 实现用于机会网络安全和隐私的信任基础。它被构想为机会网络实体之间所有交互的基础。每当一个实体与其他实体进行交互时，信任被认为是显式的（在大规模或开放的机会网络应用中）或隐式的（在小规模和封闭的机会网络应用中）。\n\
  \n`PTF` 中的信任处理需要一种去中心化的方法，以处理大量异构机会网络或支持机会网络的实体的信任值计算、更新和存储。此外，`PTF` 为机会网络增加了以下益处：\n\
  \n1. 支持构成针对内部/外部攻击第一道防线的安全隐私服务。\n2. 支持执行辅助验证（包括身份验证、授权和检查是否有足够的信任水平）的安全隐私服务，以确保加入机会网络的辅助者不是恶意的。\n\
  3. 支持持续扩展期间机会网络实体之间的安全交互。\n4. 支持确保机会网络实体之间安全且保护隐私的数据传输的安全隐私服务。\n5. 为提升 `DOC` 性能提供支持。\n\
  \n#### 11.5.2 POA 操作\n基础 POA 操作如图 11.5 所示。实线箭头表示架构块之间的控制流，虚线箭头表示数据流。此外，大写字母（A–H）表示正在处理的助手的当前助手状态（如在图\
  \ 11.3 中标识的）。例如，在进入“发现候选辅助者”块之前，助手处于 `State A`（在图 11.3 中的潜在辅助者）；当助手离开此块时，它处于 `State\
  \ B`（已发现的辅助者）。\n\n```\n![](img/fig11.5.jpg)\n```\n图 11.5 基础 POA 操作。（来自 Al-Gburi,\
  \ A., Protecting interaction security and data privacy in oppnets using pervasive\
  \ trust foundation and active data bundles, PhD proposal, Department of Computer\
  \ Science, Western Michigan University, Kalamazoo, November 2017。）\n\n`DOC` 控制着图\
  \ 11.5 中的每一个块，但为了避免图中线条和箭头过于拥挤，未显示由 `DOC` 控制的交互。`DOC` 控制的四项主要活动是 (1) 机会网络增长、(2)\
  \ 协作处理、(3) PTF 处理和 (4) 终止机会网络工作。这些活动将如下。\n\n#### 机会网络增长\n当机会网络需要增长为更大的网络时，它启动机会网络增长过程，该过程通过仅在通过\
  \ `PTF` 支持的安全服务（例如身份验证）验证后才接纳辅助者来确保安全。\n\n增长过程（参见图 11.5 中的机会网络 Growth 块）包括以下主要步骤：\n\
  \n1. **发现候选辅助者**：此步骤执行两个主要功能。首先，它在其范围内扫描潜在辅助者。其次，它识别出想要邀请的潜在辅助者子集。这些辅助者成为候选辅助者。\n\
  2. **邀请候选辅助者**：机会网络邀请选定的候选辅助者加入机会网络（在某些情况下命令，例如生死时刻），以帮助其完成特定任务。被邀请的候选辅助者用 `Accept`\
  \ 或 `Reject` 回复邀请。回复 `Accept` 的候选辅助者表示，只要机会网络需要，就有义务继续帮助该网络。（被邀请的候选辅助者出于任何原因回复 `Reject`；被命令加入的辅助者有义务继续帮助邀请的机会网络，直到被其释放。）\n\
  3. **验证候选辅助者**：`DOC` 执行一系列安全和隐私验证。这些验证包括身份验证、授权、访问控制和完整性检查。在执行所有验证时，`DOC` 依赖于 `PTF`\
  \ 支持的安全隐私服务。通过所有验证的候选辅助者成为已验证的辅助者。\n4. **接受辅助者**：`DOC` 从已验证的辅助者集中选择对于机会网络赋予的任务具有最佳能力的者。被选中的验证辅助者成为已接受辅助者。\n\
  5. **有足够的评估辅助者吗？**：`DOC` 决定其机会网络是否有足够的辅助者数量（包括刚接受的辅助者和早期增长迭代中接受的辅助者）。请注意，在图 11.3\
  \ 中没有对应 `Enough Evaluated Helpers?` 块的状态。原因是该块与一组辅助者有关，而助手状态图是针对单个助者的。\n6. **接纳选定的辅助者**：所有接受的辅助者都被接纳进机会网络，成为接纳辅助者。\n\
  7. **为辅助者分配任务**：所有新接纳的辅助者接收其任务，以此帮助他们的机会网络（在将其资源与其他机会网络的资源整合的过程中）。它们成为忙碌辅助者。\n8.\
  \ **保持空闲辅助者**：完成任务的助手成为空闲辅助者。它可以被 `DOC` 释放，或者——如果执行任务需要——返回到持有新接纳辅助者的池。\n\n####\
  \ 协作处理\n所有接纳的辅助者以协作的方式执行其分配的任务。`DOC` 管理助者的状态，监控它们的行为，并向 `PTF` 提供关于它们的信任相关反馈。`DOC`\
  \ 决定释放给定的助手还是将其返回接纳辅助者池（以将其用于更多任务）。\n\n如果在机会网络执行期间任何机会网络节点表示需要邀请更多辅助者，`DOC` 将执行另一次机会网络增长程序。当机会网络完成整个工作时，`DOC`\
  \ 将释放所有辅助者。\n\n#### PTF 处理\n如图 11.5 所示，`PTF` 从协作处理获取关于接纳辅助者（忙碌和空闲）性能的反馈。它利用这些反馈计算每个助者的信任值。`PTF`\
  \ 由以下组件组成，如图 11.5 所示：\n\n1. **（初始）信任计算**：这里有两种子情况。首先，当没有直接或间接（声誉）证据可用于机会网络实体 E（例如，辅助者刚被接纳，没有任何机会网络实体拥有它的信任信息），`PTF`\
  \ 为实体 E 分配默认初始信任值。其次，当只有间接（声誉）证据可用于机会网络实体 E（例如，辅助者刚被接纳，但 DOC 恰好拥有它的声誉信息），`PTF` 根据间接证据为实体计算初始信任值。\n\
  2. **信任更新**：任何机会网络实体在与其他任何实体交互之前必须拥有信任值。如果没有，它将如上述所示获得初始信任值。随着其他机会网络实体与实体 E 交互期间收集的新证据，实体\
  \ E 的当前信任值（从初始开始）随时间演变。新证据（直接和间接）用于更新实体 E 的信任值。\n\n\n\n\n\n### 3. 信任数据库\n信任数据库存储了所有\
  \ oppnet 实体的所有信任值。它还为每个实体存储至少一个之前的信任值（如果对分析有用，它甚至可能存储整个信任变化的完整历史）。我们建议使用包含元组的关系型数据库，其的属性包括实体\
  \ ID、其信任值以及影响当前信任值的任务标识。\n\n### 终止 oppnet 任务\n当整个 oppnet 任务完成后，`DOC` 会释放所有辅助者。`DOC`\
  \ 不会从信任数据库中清除所有已释放辅助者的信息，而是可能会保留部分或全部信息以备未来之用（以防同一实体成为未来 oppnet 运行的潜在辅助者）。\n\n##\
  \ 11. 结论\n\n机会性资源利用网络面临着许多需要解决的安全和隐私挑战。在我们看来，提高 oppnet 安全性和隐私性的共同关键在于使用信任。\n\n我们利用了泛在信任基础（`PTF`）范式，在该范式中，信任是安全和隐私的基础。我们描述了一种新的\
  \ oppnet 架构，称为基于 PTF 的 oppnet 架构（`POA`），这是经过 `PTF` 增强的原始 oppnet 架构的扩展版本。`POA` 将\
  \ `PTF` 集成到 oppnet 的结构和操作中，因此 `PTF` 可以为整个 oppnet 生命周期内执行的所有安全和隐私服务为 oppnet 服务。\n\
  \n我们预计 `POA` 及其未来的扩展将显著减少 oppnet 中的安全和隐私风险。特别是，`POA` 可以显著降低与 oppnet 实体间交互以及 oppnet\
  \ 与潜在辅助者交互相关的安全和隐私风险。\n\n我们目前正在通过在 `Java` 和 `SimJava` 中实现的仿真实验对 `POA` 解决方案进行评估。\n\
  \n### 术语与定义\n\n**机会性资源利用网络 (oppnets):** `oppnets` 是自组织网络的泛化，通过发现并整合具有所需资源的外部设备或系统作为其辅助者来扩展。基本思想是辅助者可以改进或加速\
  \ oppnet 运行的应用。与辅助者相关的 oppnet 操作范围包括：扫描并发现候选辅助者、邀请候选辅助者、验证候选辅助者、接受经过验证的最佳辅助者、接纳选定的接受辅助者、为接纳的辅助者分配任务以及在不再需要时释放空闲辅助者。\n\
  \n**辅助者 (Helper):** 这是一个可以协助 oppnet 活动并接受帮助 oppnet 邀请的实体。在加入 oppnet 之前，未来的辅助者是候选辅助者；候选辅助者可能具有对\
  \ oppnet 潜在有用的能力和技能（如专门软件、通信、计算、存储、感知或执行能力）。从（可能是广泛范围的）候选辅助者中选取并集成到 oppnet 中的辅助者将成为实际辅助者（或者，使用更精确的分类，称为“接纳的辅助者”）。\n\
  \n**oppnet 安全与隐私:** oppnet 中的安全涉及确保 oppnet 实体之间的安全交互，这些实体通过通信来协作完成特定任务。这需要许多验证过程，例如身份验证、授权和完整性检查。oppnet\
  \ 中的隐私保护交互实体的敏感信息，并确保这些信息保持机密；即它们不会泄露给未经授权的方。\n\n**泛在信任基础 (Pervasive trust foundation):**\
  \ 一个涉及两个主要原则的范式。首先，信任应该作为安全和隐私（以及本章未考虑的许多其他服务，如协作或路由）的基础。其次，信任应该被认为是计算系统中无处不在的，并且必须在大型或开放系统（如\
  \ oppnets）中显式地考虑，或者在小型或封闭系统中隐式地考虑。\n\n### 注意事项\n\n1. 由于对于理解 `POA` 结构并非至关重要，图 11.4\
