  - 参考文献\n\n## 2.1 引言\n\n各种异构设备和系统（“实体”）共存，但往往无法协作。当一个低利用率的实体是一个非常繁忙系统的邻居，但由于软件不兼容等原因该实体无法帮助该系统时，这种现象尤为浪费。\n\
  \n我们针对这一问题提出了一种解决方案，即机会性资源利用网络或 `oppnets` (Lilien et al., 2006a, 2007, 2010; Kamal\
  \ et al., 2008)。`oppnets` 依靠其雇用的“助手”以机会性和临时的方式进行扩展。请注意，`oppnets` 是其他类型机会性网络（由其他研究人员定义）的超集，在这些网络中，机会性通常仅限于\
  \ `oppnet` 能力的子集（例如，仅限于机会性通信或机会性消息转发）。\n\n以下特征共同将 `oppnets` 与其他机会性系统区分开来：(1) 支持助手范式——将其作为自发寻找更多资源的基础；(2)\
  \ 对各种计算资源的机会性利用——不仅限于（例如）通信资源；(3) 在 `oppnet` 寿命的大部分时间内以自发方式运行（作为扩展后的 `oppnet`）；(4)\
  \ 助手节点的通用性——无论助手系统或设备的制造厂商或功能，也无论其通信媒介、协议等；以及(5) 缺乏第三方介者——因为启用 `oppnet` 的实体之间的交互在没有第三方参与的情况下发生。\n\
  \n我们的目标是确保任何启用 `oppnet` 的实体都能轻松与任何 `oppnet` 通信，成为它的助手，并通过向 `oppnet` 提供资源来帮助它。我们将从部署开始就具备\
  \ `oppnet` 能力的实体，与以自发方式获得 `oppnet` 能力的系统或设备进行对比。需要指出，`oppnet` 节点可以成为其他 `oppnets`\
  \ 的助手。\n\n另一个目标是提出一种标准中间件，以便于构建基于 `oppnet` 的系统，并将感知 `oppnet` 的实体修改为启用 `oppnet` 的实体。在后的情况下，实体之间的互操作（无论其制造地或通信手段）都是自发发生的。\n\
  \n在本章中，我们将机会性资源利用网络与其他机会性网络进行对比，并提供关键术语和定义。我们讨论了 `oppnets` 的结构和运行，包括 `oppnet` 助手的分类。我们介绍了使用\
  \ `Oppnet 虚拟机` (`OVM`) 对 `oppnets` 进行的设计和实现——包括 `OVM` 的动机、定义以及 `OVM` 原语的概述。我们描述了一个基于\
  \ `OVM` 的健康与健康监测应用，展示了其使用场景，并指示了 `OVM` 原语如何在应用中使用。最后，我们回顾了 `oppnet` 相关技术和之前的 `oppnet`\
  \ 工作。\n\n## 2.2 Oppnets 的结构与运行\n\n`oppnets` 是一种泛在计算范式和通用中间件，能够打破防止化实体协作的障碍。一个 `oppnet`\
  \ 从种子节点集合开始，这些节点构成了初始的预设（非自发）种子 `oppnet`；它可以小到一个节点，但必须包含一个控制器，该控制器由种子节点的子集组成。需要时，控制器可以通过请求外部实体加入网络来协助，从而决定扩展其\
  \ `oppnet`。通过这种方式，初始种子 `oppnet` 生长为扩展后的 `oppnet`（而扩展后的 `oppnet` 可以继续增长为更大的扩展后 `oppnet`）。接受协助\
  \ `oppnet` 邀请的实体有义务在 `oppnet` 需要期间持续提供帮助，并成为助手。助手的所有资源都将整合到 `oppnet` 中。当助手完成任务时，它由邀请其加入\
  \ `oppnet` 的节点释放义务，它可以自由地返回原始职责。\n\n根据能力（w.t.）），助手分为两类：(1) 普通助手——功能强大，能够执行所有 `oppnet`\
  \ 活动，包括邀请其他助手；(2) 轻量级助手（即 lites）——具有有限的 `oppnet` 能力，包括限制的通信能力（Lilien et al., 2007,\
  \ 2010）。\n\n根据拒绝权，助手分为两类：(1) 预备队助手——可以被命令协助请求帮助的 oppnet，并有义务遵守从（如果他们拒绝帮助，可能会受到适当的惩罚）；(2)\
  \ 志愿者助手（即临时助手）——必须被请求帮助，并且有权拒绝（除非在请求帮助的 `oppnet` 面临生死关头的情况下，这一点稍后详述）。\n\n在 `oppnet`\
  \ 扩展之前，它必须找到一组可用的预备队或志愿者助手。寻找预备队需要在预备队目录中查找。相比之下，寻找志愿者助手是真正的发现，涉及扫描频谱中的信号或信标，并收集足够的信息以联系发送者。\n\
  \n显而易见，任何助手候选都可以被要求加入任何情况。同样显而易见的是，任何人在生死关都可以被命令加入（这类似于法律要求公民提供财产——例如车辆——和劳动力来拯救生命或关键资源）。\n\
  \n使用预备队需要进一步说明。首先，我们根据声明的应用领域设想了不同的应用相关预备队类别。预备队注册一个或多个应用领域（或仅针对应用程序）。例如，“应急预备队”有义务协助并被命令协助任何部署用于紧急情况的\
  \ oppnet，而“娱乐预备队”有义务协助并被命令协助任何运行娱乐应用的 oppnet。\n\n一旦预备队注册，他们就会接受“现役”的“培训”。培训预备队需要为他们提供启用\
  \ `oppnet` 的设施，以协助 oppnet 进行发现并供 oppnet 使用助手。例如，在后续章节中讨论的标准 `OVM` 中间件将安装在预备队上。这种“培训”使预备队为履行其\
  \ oppnet 职责做好了充分准备。\n\n## 2.3 Oppnet 虚拟机 (OVM)的设计与实现\n\n\n\n\n\n我们将 `oppnets` 设计为一种中间件，它由一组\
  \ `OVM` 原语（模块）组成。一个 `oppnet` 从部署那一刻起就包含了 `OVM` 原语。相比之下，非 `oppnet` 实体可以通过下载并安装所需的且自定义的\
  \ `OVM` 原语子集来变为 `oppnet-enabled`；安装完成后，该实体即可准备成为任何 `oppnet` 的助手。\n\n任何 `oppnet`\
  \ 都是 `oppnet-enabled` 的（因为它包含了 `OVM`）。因此，`OVM` 确保了 `oppnets` 和 `oppnet-enabled`\
  \ 实体可以通信，并且 `oppnets` 可以以机会主义和临时的方式从其他基于 `oppnet` 的实体或 `oppnet-enabled` 实体获取资源。\n\
  \n我们努力寻找一组最优的 `OVM` 原语，即它们是一组不重叠（或至少是最小重叠）的最小模块集。针对四种不同的节点类型：控制中心节点、种子节点、普通助手和轻量级节点实现了最优的\
  \ `OVM` 原语集。例如，普通助手可以容纳 `OVM` 原语的大部分子集（甚至是全部），而轻量级节点只需要一小部分 `OVM` 原语。此外，同类别的节点可以选择不同的\
  \ `OVM` 原语子集，允许进一步的定制。通过这种方式，我们避免了“一刀切”的问题，包括安全级别降低和资源浪费。\n\n我们以模块化（非单体）的方式设计并开发了\
  \ `oppnet OVM` 中间件，并将其结构化为 `OVM` 原语；每个原语都是 `oppnet` 中间件的原子元素，实现了 oppnet 定义定义的活动（Alduailij\
  \ and Lilien, 2015）。表 2.1 中指示为 `H1`）为潜在助手。如果平板电脑 `T1` 提供允许其完成任何 `oppnet` 任务的服务，则手环将使用\
  \ `NODE_isMember`（参见表 2.1）检查平板电脑 `T1` 是否已经是其 `oppnet` 的成员。如果不是如此，手环将使用 `NODE_reqHelp`（参见表\
  \ 2.1）向其发送帮助请求。\n\n同时，平板电脑 `T1` 使用 `NODE_listen` 监听任何帮助请求。当它收到帮助请求时，使用 `NODE_processMsg`\
  \ 处理消息。然后，使用 `NODE_validate` 验证邀请节点的凭据并确定它是否能够帮助。加入 `oppnet` 的决策可能是两种情况的结果：(1) 平板电脑\
  \ `T1` 为空闲；或 (2) 平板电脑 `T1` 忙碌，但它知道 `oppnet` 要求它执行的任务重要得多（例如涉及生死存亡）。平板电脑 `T1` 决定加入，并使用\
  \ `NODE_joinOppnet` 执行；该原语等操作会向手环（邀请平板 `T1` 的节点）发送加入确认。\n\n手环使用 `NODE_evalAdmit`\
  \ 在能力、信任度等方面评估平板电脑 `T1`，并将 `T1` 作为助手 `H1` 纳入其 `oppnet`（因为在我们的场景中评估结果是正的）。手环使用 `NODE_addNode`\
  \ 将 `H1` 添加到其助手列表中，然后使用 `NODE_sendData` 向 `H1` 发送其期望 `H1` 完成的任务规范。\n\n收到消息后，助手 `H1`\
  \ 检查它是否可以执行从手环收到的列表中最紧急的任务，即拨打紧急电话 9-1-1。然而，由于缺少手机模块，`H1`（平板电脑）无法拨打电话。由路人持有的助手 `H1`\
  \ 利用其 AI 能力，主动在其平板电脑屏幕上以人类可读的形式显示帮助请求消息，希望所有者能看到该消息。这是通过运行 `NODE_selectTask` 和 `NODE_runApp`\
  \ 完成的。\n\n由于空间限制，从现在起不再指示 `oppnet` 实体使用的原语。\n\n由于助手 `H1` 无法执行最紧急的任务，从现在起不再指示 `oppnet`\
  \ 实体使用的原语。由于空间限制，从现在起不再指示 `oppnet` 实体使用的原语。由于空间限制，从现在起不再指示 `oppnet` 实体使用的原语。由于空间限制，从现在起不再指示\
  \ `oppnet` 实体使用的原语。\n\n\n\n\n\n本节讨论的与 oppnet 相关的技术被分为资源共享技术、基于连接的技术以及专用网络和其他其他网络。\n\
  \n### 2.5.1 资源共享技术\n\n本小节讨论了资源共享技术与 oppnet 中间件之间的差异，旨在体现基于 OVM 的 oppnet 中间件的创新性。\n\
  \n**点对点（P2P）系统**：P2P 系统允许在通过“适当的通信和信息通道”交互的设备或网络之间共享内容（例如文件）（Subramanian and Goodman,\
  \ 2005）。这种资源共享和应用层通信是通过“等节点”之间的直接共享实现的，而不依赖于中心化服务器（Kamal, 2008）。\n\n`FlashLinq`\
  \ (Scalable, 2015) 是一种为了补充传统小区服务而开发的 P2P 平台。该技术推进了一种名为近距离通信（proximal communication）的概念，使设备能够在没有中间基础设施的情况下相互发现并进行高速通信。`FlashLinq`\
  \ 可以创建一个“邻域网络”，固定和移动对等应用程序可以在其中直接交互。\n\n尽管基于 OVM 的 oppnet 中间件与 P2P 系统具有许多共同特征（例如资源的去中心化共享），我们的方法通过以下关键特征脱出来：(1)\
  \ 它允许设备协作以实现共同目标，而不是满足单个节点的需求；(2) 它的设计旨在允许获取各种资源——如通信、感知、存储、数据等——而不仅仅是通信或数据；(3)\
  \ 它区分了四种节点（即 `CC`、`seed`、`regular helpers` 和 `lites`），这些节点具有不同的能力和职责。\n\n**网格计算**：该术语指的是能够聚合分布式计算资源以实现共同目标的硬件和软件基础设施（Abbas,\
  \ 2004）。它可以使用一组开放标准和协议，通过应用层通信访问应用程序和数据，同时在互联网上共享处理能力、存储容量以及大量的其他计算资源（Siddiqui and\
  \ Fahringer, 2002）。\n\n`Globus Toolkit` (`GT`) (Foster, 2005) 是一种涵盖了应用程序和基础设施的面向服务的分布式计算工具包。`GT`\
  \ 处理的主要组件包括：安全性、资源访问、资源管理、数据移动和资源发现。这些组件实现了一个更广泛的“Globus 生态系统”，该工具和组件构建在核心 `GT`\
  \ 功能之上或与之互操作，以提供广泛的实用应用层功能。这些工具可以用于开发支持分布式应用程序的各种网格基础设施。\n\n尽管基于 OVM 的 oppnet 中间件与某些网格计算系统具有许多共同特征（例如通过加入来实现扩展的能力，以及对“外部”资源的使用），但我们的方法通过以下关键特征与网格计算系统区分来：(1)\
  \ 它设计用于处理广泛的应用领域，而网格计算系统侧重于计算密集型操作；(2) 它依赖于助手加入系统并保持其组成部分直到被释放，而网格允许站点根据自己的选择加入和离开（Kamal,\
  \ 2008）；(3) 它的实体在高度异构的环境中协作，而网格实体在更同质的环境中工作。\n\n**自发网络（SNs）**：SN 是一群人聚会时创建的自组织网络的子集。Rewadkar\
  \ way Karve (2014) 提出了一种基于自组织网络的 SN，使设备能够在无需预先配置（如 P2P 所示）的情况下进行通信。它们受空间和时间的限制。提出了\
  \ `Energy Efficient Secure Protocol` (`EESC`) 用于在没有互联网连接的情况下创建和管理 `SN`。\n\n\n\n\n\
  \n# 移动自接网络 (MANETs)\n\nMANETs 是由一组自主移动节点组成的去中心化网络，这些节点通过无线通信信道进行通信。`MANET` 拓扑结构会随时间快速变化，因为节点可以随时加入或离开网络（Singh\
  \ et al., 2012）。由于网络是去中心化的，`MANET` 的节点负责网络活动，如发现网络拓扑、自配置和路由。\n\nBeddernet (Gohs\
  \ et al., 2011)：是一种与平台无关的 `MANET` 框架。Beddernet 设计旨在与不同的网络协议协作。经测试，Beddernet 可以在\
  \ BT 自接网络或分群网（scatternets）中工作。Beddernet 中间件已在 Java 和 Android 设备上通过测试。\n\n`MANET`\
  \ 与 `oppnet` 中间件共享自配置功能，因为两者都是去中心化的。然而，`oppnet` 中间件节点能够实现比自配置和路由更具挑战性的任务，因为辅助节点负责共享其资源以协助\
  \ `oppnets` 实现其目标。另一个区别因素是，`oppnet` 中间件节点承诺持续协助直到 `oppnet` 任务完成，而在 `MANETs` 中，节点可以无限制地加入或离开网络。\n\
  \n# 网格网络 (Mesh networks)\n\n这些网络具有去中心化的拓扑结构，每个节点至少连接到另外两个节点（TeckTarget, 2015）。这种基础设施消除了单点故障（SPoF）导致的网络故障，因为即使某个节点故障，其他节点仍然可以通信。网格网络系统是有线或无线的，可以是全网格或部分网格。\n\
  \nVision Mesh (Zhang and Cai, 2010) 是一种用于水利工程的视频传感器网格网络平台。Vision Mesh 由大量的图像或视频传感器节点组成，从中获取多视图图像或视频。`OpenCV`\
  \ 机器视觉库集成到 Vision Mesh 中以实现视频和图像处理。\n\n尽管网格网络的拓扑提供了节点间通信的可靠性，但构建此类拓扑的成本可能过高。此外，网格网络系统中设备之间的交互是以确定性的方式预先配置的。另一方面，`oppnet`\
  \ 中间件邀请的节点不需要预先配置，而且加入的辅助节点被调用服务的方式并不具有确定性（Lilien et al., 2007）。\n\n# 机会性网络 (Opportunistic\
  \ Networks)\n\n机会性网络（例如，Pelusi et al., 2006; Wang et al., 2005）在我们看来是机会性资源利用网络（`oppnets`）的一个合理子集。它们可以被视为\
  \ `MANET` 范式的推广，其中放了数据发送者和接收者之间存在完整路径的假设。这使得站点能够在中断的环境中通信，在这些环境中，连接岛动态地出现、消失并重构（Lilien\
  \ et al., 2007）。\n\nSeto 等人（2010）提出了一种用于人体传感器联网的移动平台。它允许对数据进行本地处理并使用机会性感知策略，其中车载传感器和智能手机的能力可以被收集并与人体传感器数据融合。\n\
  \n基于 `OVM` 的 `oppnet` 中间件（参见 Lilien et al., 2006a, 2010）与使用机会性网络的系统（由他人定义，参见 Pelusi\
  \ et al., 2006; Wang et al., 2005）有显著不同。在后者中，机会主义仅限于设备在彼此范围内的通信。在“其他”机会性网络系统（例如，Pelusi\
  \ et al., 2006）中，没有利用网络中“外部”节点资源来执行网络任务的概念。相反，`oppnets` 允许通过任何通信技术（无论设备品牌或功能如何）机会性地使用各种资源、服务或能力（包括硬件、软件、人类技能等），只要这些资源恰好在\
  \ `oppnet` 的触及范围内（Lilien et al., 2006a）。另一个与众不同的的特征是，`oppnet` 从一个较小的网络（称为种子网络）开始，并不断增长成一个越来越大、不断扩张的\
  \ `oppnet`（Lilien et al., 2010）。\n\n已有一些尝试将更多资源（通信能力以外的资源）纳入机会性网络（例如，Seto et al.,\
  \ 2010; Lu et al., 2013; Bleda et al. 2014）。然而，所利用的资源仅限于少数类资源（如感知或计算），并且通过有限的通信技术类型进行。\n\
  \n# 容延网络 (DTNs)\n\nDTNs 可以被视为无线网络系统的超类。`DTNs` 的主要目标是在通信易于中断和干扰时，在本地/区域网络之间提供连接。通过采用“存储-转发”的消息交换机制，`DTN`\
  \ 可以克服导致大延迟的问题（Seligman et al., 2007）。\n\nHusni 和 Wibow (2012) 构建了一个基于 `DTN` 的电子邮件服务器，即使服务器没有持续连接到网络也能发送和接收电子邮件。所提出的电子邮件服务器利用了\
  \ `DTN` 克服极端环境、间歇性连接、大或可变延迟以及高比特错误率（这些是远程地区通信的共同特征）相关问题的能力。作者建议使用公共交通系统等设施和基础设施来构建基于\
  \ `DTN` 网络。选择火车系统作为使用 `Wi-Fi` 的 `DTN` 网络基础设施。经过村庄的火车系统可以为村庄带来外部邮件。\n\n`DTNs` 的主要目标是在最具挑战性的情况下提供连接。另一方面，基于\
  \ `OVM` 的 `oppnet` 中间件不仅包含 DTN 能力，还包含其独特能力，即从“外部”实体获取资源。\n\n# 自组织网络 (SON)\n\nSON\
  \ 自动化技术提供了移动网络的高成本部署、运行和维护（Jorgki et al., 2014）。SON 是第三代伙伴计划（3GPP）长期演进（LTE）标准的要求之一（UTRA,\
  \ 2015）。SON 功能可分类为：（1）自配置；（2）自优化；（3）自愈。\n\nTonguz 和 Viriyasitavat (2013) 了一种受生物启发的自组织网络系统，其中某些车辆作为路侧单元（RSU）。作为临时\
  \ `RSU` 的车辆通过偶尔停留作为其他网络的通信桥梁。作者认为使用车辆作为 `RSUs` 可以提高消息的可性和网络连接，同时避免部署固定 `RSUs` 的成本。\n\
  \n尽管 SON 与 `oppnet` 中间件共享在没有核心的情况下形成、组织和管理节点的能力（Prehofer and Bettstetter, 2005），但\
  \ SON 并不专注于通过辅助获取资源，这是 `oppnets` 的核心特征。\n\n与其他网络\n\n在本节中，我们将讨论 `oppnet` 中间件与一些专门网络之间的区别，即无线传感器网络（WSNs——一种监控和控制技术）以及环境网络（ANs——一种\
  \ 3G 蜂窝技术）。\n\n无线传感器网络（WSNs）：WSNs 是由自主受限设备组成的专门系统，这些设备嵌入了传感器、处理器和收发器，用于监控物理环境（Akyildiz\
  \ and Vuran, 2010）。WSN 节点通过无线通信技术进行通信，通常是基于 IEEE 802.15.4 标准的 2.4 GHz 电频。\n\n\n\n\
  \n\nCapella 等人 (2014) 开发并部署了一个无线传感器网络（WSN），用于对西班牙东部某河流的硝酸盐浓度进行连续线上监测。作者还实施了相关策略以改进整个系统的功能。这些改进包括优化测量执行的时间，并根据系统演化、用户偏好和应用特征调整采样频率。\n\
  \n基于 OVM 的 `oppnet` 中间与 WSN 之间的主要区别在于：(1) `oppnet` 中间允许集成异构设备，这些设备可以具有强大的计算能力（而不仅仅是资源受限的节点）；以及\
  \ (2) `oppnet` 中间允许节点通过多种通信信道进行通信（而不仅仅像典型 WSN 那样通过单一频率通道通信 (Lilien et al., 2007)）。我们必须注意，整个\
  \ WSN 或 WSN 节点的任何子集都可以作为辅助者加入 `oppnet`。\n\n### 环境网络 (ANs)\nANs 是一种用于 3G 移动系统之外的网络传输范式。ANs\
  \ 是作为欧盟第六次框架计划的一部分而开发的（欧盟委员会, 2015）。它们旨在通过任何接入技术和任何网络类型提供现有和新的服务。为了实现此类服务，ANs 允许异构网络之间进行按需且透明的协作，几乎不需要预配置或离线协议\
  \ (Belqasmi et al., 2008)。\n\nVodel 等人 (2010) 了一种通信概念，旨在创建一种轻量级的无线标准，结合不同通信技术（如认知无线电和\
  \ ANs）的优点，同时克服单一无线标准的设计限制。\n\nANs 在集成异构设备以提供各种服务方面类似于基于 OVM 的 `oppnet` 中间件。然而，`oppnets`\
  \ 和 ANs 之间存在两个主要区别：(1) ANs 是完全预设计的，其功能都是内置的，而 `oppnets` 的操作大部分是事时的（ad hoc），无需预先配置；(2)\
  \ ANs 是旨在取代互联网的全球网络，而基于 OVM 的 `oppnets` 旨在构建本地/广域网络以服务广泛的应用 (Lilien et al., 2007)。\n\
  \n### 2.6 之前的 Oppnet 工作\nLilien 等人 (2007) 和 Kamal 等人 (2008) 为 `oppnets` 提出了 `OVM`\
  \ 并定义了其基本原语。原始的 `OVM` 原语仅通过理论分析对完整性和一致性进行了评估，没有任何实际的模拟或实现 (Lilien et al., 2010)。\n\
  \n我们批判性地评估了原始的 `OVM` 原语，并决定进行以下修改：\n1. 消或修改了部分原始原语以避免冗余。\n2. 添加了一些新的原语，以提供更模块化且不重叠的功能。\n\
  3. 使用面向对象的原则（如模块化、多态和继承）重新设计了整个 `OVM` 原语集。\n\nKamal 等人 (Lilien et al., 2007; Kamal\
  \ et al., 2008) 将 `OVM` 作为 `oppnets` 的 API 框架，描述了名为 `MicroOppnet v.2` 的 `oppnet`\
  \ 测试平台的设计和实现。`MicroOppnet v.2` 是作为 `oppnets` 的概念验证开发的，而不是一个 `OVM` 平台。因此，尽管使用了 `OVM`\
  \ 概念，它仍然具有单体结构，代码没有被分为独立的 `OVM` 原语。此外，`MicroOppnet v.2` 在资源机会主义方面是初级的，因为感知是唯一利用的资源。\n\
  \n相比之下，在我们的工作中，我们模拟、仿真并实现了基于 `OVM` 的 `oppnet` 的不同组件。我们的代码不是单体的，而是模块化的，划分为我们开发的 `OVM`\
  \ 原语集。\n\n### 术语与定义\n控制器或控制中心 (`CC`)：它由一组任意的节点节点组成，负责控制并管理 `oppnet`（但任务可以委托给其他节点，如果需要的话）。\n\
  \n#### 表 2.1 Oppnet 的 OVM 原语列表\n\n| 序号 | 原语名称 | 原语功能 |\n| :--- | :--- | :--- |\n\
  | 1 | `NODE_add` | 为 `oppnet` 添加节点 |\n| 2 | `NODE_discover` | 发现服务 |\n| 3 | `NODE_Admit`\
  \ | 评估并允许设备加入 `oppnet` |\n| 4 | `NODE_isMember` | 检查设备是否已经是 `oppnet` 成员 |\n| 5 |\
  \ `NODE_join` | 加入 `oppnet` |\n| 6 | `NODE_listen` | 监听接入，接收并保存消息 |\n| 7 | `NODE_process`\
  \ | 处理缓冲区中的消息 |\n| 8 | `NODE_release` | 在需要时释放辅助 |\n| 9 | `NODE_rem` | 从 `oppnet`\
  \ 移除节点 |\n| 10 | `NODE_report` | 向 `oppnet` 报告信息 |\n| 11 | `NODE_reqHelp` | 请求辅助者的帮助\
  \ |\n| 12 | `NODE_reqRelease` | 请求释放邀请节点 |\n| 13 | `NODE_run` | 执行由 `oppnet` 种子或辅助节点指定的应用程序\
  \ |\n| 14 | `NODE_scan` | 扫描频谱以检测可能的辅助者设备 |\n| 15 | `NODE_select` | 从任务队列中选择任务执行\
  \ |\n| 16 | `NODE_sendData` | 向另一个 `oppnet` 设备发送数据（例如任务列表） |\n| 17 | `NODE_validate`\
  \ | 验证邀请节点的凭据并检查协助能力 |\n\n![](img/fig2.1.jpg)\n图 2.1 健康监测场景。\n\n辅助 (Helper)：这是一种通过接受邀请协助\
  \ `oppnet` 活动的实体。在加入 `oppnet` 之前，未来的辅助是候选辅助。候选辅助者可能具有对 `oppnet` 有用的各种能力和“技能”（如特定的软件或通信、存储、感知或执行能力）。从（大量的）候选辅助中选择并集成到\
  \ `oppnet` 中的辅助将成为真正的辅助者。\n\n基于 Oppnet 的实体 (Oppnet-based entities)：这些实体设计上包含 `OVM`\
  \ 原语，能够通过集成辅助者来扩展其 `oppnet`；`oppnet` 的增长从基于 oppnet 的实体寻找潜在辅助开始。\n\n启用 Oppnet 的实体\
  \ (Oppnet-enabled entities)：这些实体在事时方式下载并安装所需的 `OVM` 原语子集后，能够成为 `oppnet` 辅助，为基于 oppnet\
  \ 的实体提供资源。\n\nOppnet 虚拟机 (OVM)：这是一组用于应用级通信和资源获取的原语（模块或构建块）。任何基于 oppnet 的实体或启用 oppnet\
  \ 的实体都可以使用 `OVM` 原语子集，因为其中间件支持所有的 oppnet 活动。\n\n机会网络 (Opportunistic networks)：根据其他研究者的定义，这些是\
  \ `oppnets` 的真子集，因为它们的机会性通常限于 `oppnet` 能力的一个集，例如仅具有机会通信能力或机会消息转发能力。\n\n机会性资源利用网络或\
  \ oppnets (Opportunistic resource utilization networks or oppnets)：这是一种特种网络的新范式。`oppnets`\
  \ 的显著特征是利用“辅助者”以机会和事的方式进行扩展。\n\n\n\n\n\n# 种子 oppnet 与扩展 oppnet\n\noppnet 起于一个种子\
  \ oppnet（也称为种子，seed），它是一个预先设计的（而非临时构建的）节点集合，用于启动 oppnet 活动。种子可以小到仅有一个节点。种子 oppnet\
  \ 通过邀请、接纳和整合所谓的“帮助者（helpers）”成长为扩展 oppnet。反之，只要是有益的（能够获得更多资源来更快或更好地完成工作），扩展 oppnet\
  \ 就可以持续成长为更大规模的扩展 oppnet。\n\n## 参考文献\n\n- A. Abbas , *Grid Computing: A Practical\
