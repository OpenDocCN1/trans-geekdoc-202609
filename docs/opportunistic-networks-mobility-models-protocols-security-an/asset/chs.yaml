  ### 16.4 从零实现新协议\n### 16.5 结论\n\n## 参考文献\n\n### 16.1 引言\nONE（机会性网络环境）是一个用于研究机会性网络中容中断网络（DTNs）的模拟器。\n\
  \n### 16.2 ONE 基础\n模拟器的行为主要通过配置文件控制。这些文件定义了环境以及测试的协议。\n\n### 16.2.1 配置文件：default_settings.txt\n\
  `default_settings.txt` 是模拟的主配置文件。它包含了运行模拟的参数。\n\n#### 16.2.1.1 场景设置\n此部分定义了全局环境，例如场景名称和模拟持续时间。\n\
  \n```\nScenario.name = default_scenario\nScenario.simulateConnections = true\nScenario.updateInterval\
  \ = 0.1\nScenario.endTime = 43200\n```\n\n#### 16.2.1.2 所有组的通用设置\n除非被覆盖，否则这些设置适用于所有节点。\n\
  \n```\nGroup.movementModel = RandomWaypoint\nGroup.router = ProphetRouter\nGroup.bufferSize\
  \ = 10M\nGroup.waitTime = 0.120\nGroup.nrofInterfaces = 1\nGroup.interface1 = btInterface\n\
  Group.speed = 0.5,1.5\nGroup.msgTtl = 300\nGroup.nrofHosts = 58\n```\n\n#### 16.2.1.3\
  \ 特定组的设置\n可以将节点分组以赋予它们不同的特征（例如行人和车辆）。\n\n```\nGroup1.groupID = p\nGroup2.groupID\
  \ = c\nGroup2.okMaps = 1\nGroup2.speed = 2.7,13.9\n```\n\n#### 16.2.1.4 消息创建设置\n\
  （关于模拟如何生成和分发消息的细节）。\n\n#### 16.2.1.5 移动模型设置\n（关于节点如何在环境中移动的细节）。\n\n#### 16.2.1.6\
  \ 报告设置\n（关于模拟运行后输出和数据收集细节）。\n\n### 16.2.2 代码执行流\n理解 ONE 源代码的执行流对于想要修改模拟器的开发者至关重要。\n\
  \n### 16.3 现有的路由协议实现\nProphet 和 Epidemic 路由等协议已经在 ONE 框架中预实现，用于基准测试。\n\n### 16.4\
  \ 从零实现新协议\n要实现新协议，必须扩展基类路由器类并定义消息处理和转发的逻辑。\n\n### 16.5 结论\nONE 模拟器提供了一个稳健的平台，用于研究和测试机会性路由策略。\n\
  \n\n\n\n\n```markdown\nGroup3.groupID = w\n\n# 有电组\n\nGroup4.groupID = t\nGroup4.bufferSize\
  \ = 50M\nGroup4.movementModel = RandomWaypoint\nGroup4.routeFile = data/tram3.wkt\
  \ Group4.routeType = 1\nGroup4.waitTime = 10, 30\n```\n\n上述代码描述了仿真中不同组的个体属性。用户可以根据需要定义任意数量的组，并为每个组设置不同的参数和变量。\n\
  \n## 16.2.1.4 消息创建设置\n\n```\nEvents.nrof = 1\nEvents1.class = MessageEventGenerator\n\
  Events1.interval = 25,35\nEvents1.size = 500k,1M\nEvents1.prefix = M\n```\n\n上述代码处理消息生成。新消息生成的频率、消息大小和消息\
  \ ID 等参数在此处为 `MessageEventGenerator` 类设置。首先，定义参与仿真的事件数量，然后将要使用的类设置为 `MessageEventGenerator`。后续的所有设置都是针对\
  \ `MessageEventGenerator` 的。第一行设置了消息生成间隔。这意味着将在每 25 到 35 秒之间的随机间隔后发送消息。同样，消息的大小被设置在\
  \ 500 kB 到 1 MB 之间。\n\n## 16.2.1.5 运动模型设置\n\n```\nMovementModel.rngSeed = 1\nMovementModel.worldSize\
  \ = 4500, 3400\nMovementModel.warmup = 1000\nMapBasedMovement.nrofMapFiles = 4\n\
  MapBasedMovement.mapFile1 = data/roads.wkt\nMapBasedMovement.mapFile2 = data/main_roads.wkt\n\
  MapBasedMovement.mapFile3 = data/pedestrian_paths.wkt\nMapBasedMovement.mapFile4\
  \ = data/shops.wkt\n```\n\n基于地图的运动模型要求设置定义用于构建运动模型的文件。可以看到，使用的 4 个地图文件本质上定义了正在仿真的真实世界的路径和地点。读者可以以\
  \ wkt 格式定义自己的地图文件。这将在稍后进行详细介绍。用户还可以定义仿真所需的仿真区域以及预热时间（warm-up time），即在正式仿真开始之前，节点在定义的区域内移动的持续时间。\n\
  \n## 16.2.1.6 报告设置\n\n```\nReport.nrofReports = 1\nReport.warmup = 0\nReport.granularity\
  \ = 43000\nReport.reportDir = reports/\nReport.report1 = MessageStatsReport\n```\n\
  \n这些设置决定了仿真报告将存储在哪里以及如何保存。第一行指定了想要生成的报告数量。用户还可以更改报告保存的目录——默认情况下将存储在当前目录下的“reports”文件夹中。要生成的报告还需要设置报告类。默认情况下，报告类被设置为仅生成一种属于\
  \ `MessageStatsReport` 的类型报告。要生成其他类型的报告，请将 `Report.nrofReports` 设置为所需的值，并指定要生成的报告类型（例如，`EnergyLevelReport`）。\n\
  \n**问：** 在 `default_settings.txt` 文件中添加设置，以记录所有可能的节点组的所有能量级别，并将其保存为报告。\n\n**答：**\
  \ 为了在 `default_settings.txt` 文件中为所有节点指定能量设置需要在两个地方添加额外设置。首先，将添加设置以定义所有节点的不同能量级别。其次，将使用\
  \ `EnergyLevelReport` 报告类生成能量报告。\n\n以下行必须添加到包含所有组通用设置的文件：\n\n```\nGroup.initialEnergy\
  \ = 4800\nGroup.scanEnergy = 0.06\nGroup.scanResponseEnergy = 0.08\nGroup.transmitEnergy\
  \ = 0.08\nGroup.baseEnergy = 0.07\nGroup.charging_cofficient = 20\nGroup.threshold_energy\
  \ = 3000\n```\n\n对于报告生成，首先指定需要生成 2 个报告（`EnergyLevelReport` 同默认的 `MessageStatsReport`）：\n\
  \n```\nReport.nrofReports = 2\nReport.warmup = 0 # 无更改\nReport.granularity = 43000\
  \ # 无更改\nReport.reportDir = reports/ # 无更改\nReport.report1 = MessageStatsReport\n\
  Report.report2 = EnergyLevelReport\n```\n\n这种添加在依赖于能量级的协议实现中可能是需要的（Lu and Hui, 2010;\
  \ Ye et al., 2002; Chhabra et al., 2017a, b; 2018）。\n\n## 16.2.2 代码流程\n\n为了具备对 ONE\
  \ 进行开发和研究的技能，必须通过查看各种类和文件来理解 ONE 的工作原理。诸如 Prophet 路由（Lindgren et al., 2003）和 Epidemic\
