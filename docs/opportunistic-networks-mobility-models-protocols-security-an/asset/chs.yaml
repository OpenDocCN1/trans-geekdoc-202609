  \n\n\n\n\n#### 4.2.4.3 工作日移动模型\n## 4.2.4.4 基于最短路径地图的移动\n## 4.2.4.5 基于地图的移动性模型评估\n\
  ## 4.2.5 基于社交网络的移动性模型\n### 4.2.5.1 基于社区的移动模型\n#### 4.2.5.2 社会网络模型\n## 4.3 TRANSIMs\n\
  ## 4.4 测试工具\n## 4.5 移动性模型对机会性网络性能的影响\n## 4.6 移动建模的未来研究方向\n## 参考文献\n\n## 4.1 引言\n\
  \n随着信息技术的普及，我们现在进入了网络化世界。在这个世界中，智能手机、PDA、平板电脑等大量小型手持移动通信设备通过无基础设施的网络进行相互通信和数据共享；这导致了移动自接网络（MANETs）的发展。MANET\
  \ 是一种由移动设备的自治系统，具有自配置和分布式的路由网络环境。MANET 中的移动设备可以动态地形成网络，无需依赖任何现有的基础设施即可实现网络内的易于访问和有效通信。然而，由于频繁的拓扑变化和分区，网络必须保证端到端通信（即在路由数据包之前，必须在发送端之间建立路径），并应该预先拥有专用路径。但在现实中，情况并非如此；由于各种物理和环境因素（如短距离通信、节点的移动模式、建筑物、树木等物理障碍），通信可能会受到干扰。MANET\
  \ 中节点的移动行为和多样化的移动模式会影响无线网络的性能，如协议、通信流量模式、网络性能、节点连通性、发送端与无法到达的目的地丢包等，从而破坏通信。\n\n\
  因此，机会性网络（Opportunistic Networking）的概念运而生；它是 MANET 的扩展，完全构建在用户的设备上，通过间歇性连接移动设备根据其地理接近实现网络通信。机会性网络受到了学术界和研究社区的高度关注，已成为无线网络中的新通信范式，它存储并转发数据包而不是丢弃，直到通信链路建立。尽管存在频繁的路径中断、节点移动和重构，机会性移动无线网络通过利用用户的移动来增加网络容量，比\
  \ MANET 具有更高的容错性。机会性网络中的移动建模目前是研究社区的首要课题，旨在识别可以部署在复杂现实场景（如应急行动、搜索与救援行动、灾后恢复等）中的真实移动模型。\n\
  \n### 4.1.1 背景\n\n机会性网络（OppNets）的历史并不长；它始于 NASA、MITRE 等人提出的行星际互联网（IPN）提案，该计划由国防高级研究计划署（DAR-PA）资助。最初的\
  \ IPN 架构由 Vint Cerf 等人开发，目的是为了应对深空通信中显著的延迟和数据包损坏的必要性。随后，Kevin Fall（2002）使用了相同的概念设计了能够抵抗间歇性连接引起的长时间延迟的地面网络，并发明了“延迟容忍网络”（DTN）术语，也称为间歇连接网络或中断容忍网络，因为此类网络中的节点链路持续时间短。此外，DTN\
  \ 研究小组（DTNRG）于 2007 年开发了架构并发布了 `RFC 4838` 和 `RFC 5050`，为运行在中断网络上的软件定义了一个通用抽象。`RFC\
  \ 5050` 被称为数据包协议（Bundle Protocol），它将一系列连续数据块定义为一个数据包，每个数据包包含语义信息，允许应用程序在单个数据块无法运行时继续进行。当参与节点处于彼此通信范围内时，数据包以“存储-携带-转发”的方式在它们之间机会性地路由，通常被称为移动机会性网络。\n\
  \n机会性网络中的通信基于移动用户使用短距离移动设备（如智能手机和平板电脑）通过无线连接（如蓝牙或 Wi-Fi 技术）的接近性。机会性网络场景中的网络拓扑通常不足以维持端到端连通性，并被假设为高度动态。在设备上存储数据并将其转发给移动用户携带的其他设备的能力使得通信以点对点的方式进行。然而，考虑到文献，已经证明网络性能严重依赖于节点移动的行为。因此，部分研究应该致力于移动轨迹的研究和真实移动模型的制定，因为移动性是\
  \ OppNets 中的关键问题。许多研究人员正在寻找解决 OppNets 不同方面的方法（Zhang, 2006; Martinez et al., 2011,\
  \ Pereira et al., 2012），并分析了网络流量、移动性和连通性模型、节点特征和路由问题等因素。在传统的 MANET 中，网络协议通常使用随机移动模型进行评估，例如随机游走移动模型（RWM）（Einstein,\
  \ 1956）、随机路点移动模型（RWP）（Johnson and Maltz, 1996）、随机方向移动模型（RDM）（Royer et al., 2001）等。然而，用户的移动取决于用户的运动行为、他们的社交和个人特质以及环境因素（Aschenbruck\
  \ et al., 2011），因为在现实中，用户的运动极少是完全随机的（Yoon et al., 2003）；因此，传统的基于随机的常规移动模型无法准确评估\
  \ OppNets 中的网络协议。在文献中，有各种研究证明用户的社交和个人行为与用户的移动模式具有显著相关性。例如，在最近的研究和实验分析中，已经证明用户经常访问几个他们花费大部分时间的地方（Song\
  \ et al., 2010），并且与这些地方有着强烈的社交关系（Phithakkitnukoon et al., 2012）。此外，他们很少进行长途旅行，而经常进行短途旅行（Gonzalez\
  \ et al., 2008）。因此，根据下一节讨论的移动特性，有必要选择合适的移动轨迹和模型，以仿真人类和车辆的移动行为。\n\n### 4.1.2 移动模型特性\n\
  \n\n\n\n移动性模型用于表示无线自组网络（WANETs）中节点的移动模式，以及其位置、加速度和速度随时间的变化情况；这反过来又影响网络协议、应用程序和系统的性能。移动性模型能够准确展示机会性自组移动网络（OppNets）中移动用户的移动性行为，这对于评估特定类型移动场景下的协议评估至关重要。研究这些模型是为了预测网络拓扑的未来状态、控制路由重建、最小化中断、减少开销、消除控制包的传输并及时找到路径。\n\
  \n与用户移动性相关的多种特性/属性。根据行为模式，人类移动性可以分为三个层次：战略层、战术层和操作层（Hoogendoorn and Bovy, 2004）。战略层描述个体的日常移动模式，例如购物、上班或参加户外活动。战术层侧重于根据活动集合（即：通往目的地的最短或最快路径）以及取决于环境因素的时间可用（例如路径上的障碍或交通拥堵）进行活动调度和路线选择。操作层描述人类运动的物理过程（Hoogendoorn\
  \ and Bovy, 2004）。这一层考虑了步行或驾驶速度，以及由于避障和队列而与其他节点的交互。\n\n每个结构层次对机会性移动系统的性能都有特定影响。**间接触时间（Inter-contact\
  \ time）是大多数路由协议的关键参数，因为它直接决定了消息延迟和消息成功交付的概率。战略和战术层的决策影响节点接触时间，例如特定节点连续两次会面的时间分布。在操作层做的决策可能会影响节点连接性和接触时长，这决定了通过中继节点通信的远程用户之间多跳路径的存在。\n\
  \n移动性建模的大部分研究集中在战术层和战略层；操作层移动性建模（如 Jardosh et al., 2003; Helgason et al., 2010 所示）受的关注较少，但在规划应急和疏散策略时得到了充分研究，在这些场景中，捕捉个体运动的属性具有高度性。目前，流行的移动性模型表征了人类移动性的时空属性（Hsu\
  \ et al., 2007; Mei and Stefa, 2009; Lee et al., 2009）以及社交方面（Musolesi and Mascolo,\
  \ 2007; Boldrini and Passarella, 2010）。\n\n人们已经开发了许多模型，它们对人类运动的近似通常比网络中常用的模型更准确。存在许多参数，如间接触时间、接触时间、剩余间接触时间、返回时间等，它们决定了移动性的本质。通过研究这些参数，研究人员试图对现实世界的移动轨迹进行建模。还提出了许多基于人类社交社区和社会结构行为的移动性模型。移动性建模应该研究实际场景，以确定哪些移动性特性是必须捕捉的，哪些特性可以从模型中抽象掉以避免不必要的复杂。移动性模型有三种属性，在将在进行讨论（Sichitiu\
  \ et al., 2009）：\n\n1. **真实性（Realism）**：描述移动节点在真实场景中运行运动的准确程度。\n2. **多样性（Diversification）**：移动性模型在不同场景、环境和不同类型移动节点工作的能力。\n\
  3. **复杂性（Complexity）**：衡量产生仿真轨迹所需的计算资源。\n\n移动性特性包括通信网络中移动节点的速度、移动模式的可预测性以及均匀性。因此，移动性模型的特性和属性构成了移动性模型分类的基础。\n\
  \n### 4.1.3 移动性模型的分类\n\n移动性模型大致分为三类：基于轨迹的模型、合成模型和随机模型。真实的移动性模型对于可靠的性能评估和在现实场景中跟踪移动主机至关重要。由于无线自组网络中缺乏真实的运行系统，公共领域中真实的轨迹有限。它们与特定场景相关，很难泛化其有效性。\n\
  \n**合成模型**是通过通过施加约束（如障碍物、路径等）捕捉节点运动的数学模型；而**随机模型**是理想化的模型，主要依赖于节点的随机移动（不施加约束），例如随机游走、随机路点移动性模型等。通常情况下，合成模型更受青，因为它们不是轨迹驱动的，但它们通常无法准确评估协议，因此必须通过真实的轨迹对移动性模型进行验证。\n\
  \n此外，文献中提出了许多基于地图、路由和社交网络的移动性模型。基于地图和路由的移动性模型需要流量和用户移动模式，以便在评估和处理机会性网络中的网络问题，而基于社交网络的移动性模型遵循社交网络理论。对于指数，社交网络移动性模型捕捉了个人在灾害救援、战场等组内组间移动的本质，并依赖于个体之间关系的结构。机会性网络有大量的移动性模型。但到目前为止还没有可以用于所有应用场景的通用移动性模型；它们大多限于少数应用场景。有多种移动性模型可以帮助形成移动性模型的分类法（[图\
  \ 4.1]）。\n\n![](img/fig4.1.jpg)\n\n图 4.1 移动性模型的分类。\n\n### 4.2 移动性模型\n\n移动性是机会性网络的显著特征，因此考虑移动性特性；真实移动性模型的制定非常重要，因为不真实的模型在仿真期间会给出不真实的结果，并在评估系统性能时无法部署在现实世界中。通信流量模式和移动性模型是协议仿真的关键参数。因此，必须制定准确模拟预期现实场景的移动性模型。通过利用机会性网络真实用户的运动轨迹，重新考虑了许多用于移动自组连接网（MANETs）的移动性模型。\n\
  \n### 4.2.1 基于轨迹的模型\n\n\n\n\n基于轨迹的模型可以通过追踪真实世界场景中的移动主机，获得对实际移动模式的洞察。例如，剑桥大学和英特尔研究实验室曾在剑桥的学生和研究人员中进行了实验（Chaintreau\
  \ et al., 2005）。他们通过蓝牙设备收集人类移动数据，并研究了它们的共现模式。类似的项目也曾开展过，例如无线拓扑发现项目（McNett and Voelker,\
  \ 2005），该项目研究了加州大学圣地亚哥分校（UCSD）校园内无线 PDA 用户的移动特性和访问模式；达特茅斯学院校园最大的无线局域网（WLAN）移动性和地理测量项目（Kotz\
  \ and Henderson, 2005）；以及为移动网络社区收集真实轨迹的项目，这些项目也是在达特茅斯学院发起的（Kotz and Essien, 2005）。\n\
  \n获取轨迹有三种方法（Aschenbruck et al., 2011）。第一方法是通过特定工具监控追踪设备的位置。目前全球定位系统（GPS）被用于监控定位系统。第二种方法是利用通信系统监控通信设备。通信监控的准确性取决于通信设备所连接的接入点的密度。这种方法可能不够精确，但可以用于验证移动模型。第三种方法是使用蓝牙或\
  \ WLAN 通过监控移动设备之间的接触来获取接触轨迹。对于机会性网络，设备之间的接触比设备的实际位置更有意义，这有助于检查设备的移动情况。目前，重点是从接触轨迹中推导出基于位置的轨迹，以便这些特征可能有助于开发新模型并验证现有模型（Whitbeck\
  \ et al., 2010）。目前有几个包含真实轨迹的数据存储库，如 CRAWDAD（Kotz and Henderson, 2005）、[`crawdad.cs.dartmouth.edu/`](http://crawdad.cs.dartmouth.edu/)、UNC/FORTH、`www.ist-mome.org/database/MeasurementData/index4475.html?cmd=datadetail&id=3873`\
  \ 以及 MobiLib [`nile.cise.ufl.edu/MobiLib/`](http://nile.cise.ufl.edu/MobiLib/)。\n\
  \n### 4.2.1.1 基于轨迹的分析\n\n基于轨迹的模型涉及几个问题。在 WLAN 接入点之间可以观察到乒乓效应；例如，一栋建筑可能有多个接入点和用户，用户在没有移动的情况下会反复在接入点之间切换（Yoon\
  \ et al., 2006）。这个问题可以通过积累多个接入点的数据来解决。这种方法确实克服了乒乓效应，但是以牺牲位置准确性为代价的。轨迹分析的另一个挑战是时间变化，即蜂窝轨迹在周的不同日期之间存在差异（Verkasalo\
  \ et al., 2007）。为了解决这个问题，需要足够数量的轨迹。处理此问题的方法之一是分析校园轨迹。学生之间的友谊关系是非称的（Hsu and Helmy,\
  \ 2005）。\n\n为了生成类似于真实环境的新轨迹，对 WLAN 轨迹进行了分析并用于建模（Tuduce and Gross, 2005）。随机移动下的移动模型非常简单且相对容易研究，但与现实场景的相似性很小或没有。在过去的几年里，基于轨迹建模领域正在进行深入研究。由于\
  \ GPS 误差，数据预处理是强制性的（Lee et al., 2009）。从校园获取的 WLAN 轨迹显示其未能捕捉场景中的所有用户移动。有多种移动模型（Kim\
  \ et al., 2006; Walsh et al., 2008; Hsu et al., 2009）对校园场景进行建模并提供轨迹解决方案，但校园路点模型（McNett\
  \ and Voelker, 2005）和统计移动模型（Kotz and Essien, 2005）并没有考虑所有讨论的挑战（即乒乓效应和轨迹变化）。\n\n\
  数据轨迹匹配真实生活环境的各种特征，如来自公司办公大楼、大学校园和公共网络的移动轨迹（Kotz and Essien, 2005）。对于许多场景，例如战场、办公场景（Minder\
  \ et al., 2005; Rojas et al., 2005）和城市场景（Rojas et al., 2005），无法获取数据轨迹；因此，迫切需要各种类型应用场景的准确移动轨迹。\n\
  \n### 4.2.2 随机移动模型\n\n随机移动下的移动模型非常简单且相对容易研究，但与现实场景的相似性很小或没有。它们通常依赖于节点的随机移动。在本节中，我们将讨论不同的随机移动模型。\n\
  \n#### 4.2.2.1 基于随机的移动模型\n\n基于随机的移动模型中的移动节点在网络中不受限制地移动，具有随机选择的方向、速度和目的地。基于随机的移动模型非常容易实现；因此它们被用于不同类型的仿真研究。流行的基于随机的移动模型将在后续小节中描述，我们将在\
  \ 4.2.2.1.4 节中简要对基于随机的移动模型进行评估。\n\n##### 4.2.2.1.1 随机游游移动模型\n\n\n\n\n随机游走移动模型（Einstein,\
  \ 1956），也称为布朗运动，是一种非常流行的移动模型，由爱因斯坦于 1926 提出。在该模型中，节点独立地从一个位置移动到另一个位置，从预定义的范围 `[0,2*π*]`\
  \ 和 `[minspeed, maxspeed]` 中随机选择方向和速度，以恒定的移动距离 `d` 或恒定的时间间隔 `t` 进行。如果节点在移动过程中到达仿真边界，它将以入射角反弹，并沿着该方向继续移动，这种效应被称为边界效应（Bettstetter\
  \ and Wagner, 2002）。人们已经开发了许多随机移动模型的变体，包括 1D、2D、3D 和 `d-D` 游走，由于其简单且易于实现，它是使用最广泛的移动模型（Bar-Noy\
  \ et al., 1995; Decker, 1995; Rubin and Choi, 1997; Zonoozi and Dassanayake, 1997;\
  \ Garcia-Luna-Aceves and Madruga, 1999）。随机游走移动模型通过获取节点随机移动的平均小区停留时间 `E(S)` 来帮助研究不同的系统参数集（Rubin\
  \ and Choi, 1997）。它用于跟踪节点的随机移动，并根据移动节点的之前、当前和下一个运动方向将整个区域划分为若干区域，从而计算信道保持时间和切换次数（Zonoozi\
  \ and Dassanayake, 1997）。使用预设计的状态转移矩阵通过刻画在当前位置停留的平均时长以及选择移动路径的概率来给出移动节点的运动模式（Decker,\
  \ 1995）。随机游走模型是一种无记忆移动模型，它与之前的速度和方向无关，因此不被认为适用于无线场景，因为它会产生不符合现实的移动模式（Liang and Haas,\
  \ 1999）。\n\n### 随机路点移动模型\n\n随机路点（Random Waypoint）移动模型是一种用于评估无线网络中路由协议性能的非常流行且广泛使用的移动模型（Broch\
  \ et al., 1998; Chiang and Gerla, 1998; Garcia-Luna-Aceves and Spohn, 1999; Johansson\
  \ et al., 1999）。它由 Johnson 和 Maltz（1996）提出。随机路点模型通过在方向和/或速度变化之间引入暂停时间扩展了随机游走移动模型。在该移动模型中，如图\
  \ 4.2\n\n图 4.2 随机路点模型中的节点移动。\n\n一旦时间过期，它会在仿真区域内的预定义范围 `[minspeed, maxspeed]` 内随机选择一个目的地和速度。然后，移动节点以随机速度移动到随机选择的目的地，再次停留指定的暂停时间，并重复这一过程直到仿真结束。该模型与流体中悬浮粒的运动相似，因此也被称为布朗运动。RWP\
  \ 使用边界矩形，因此假设世界是一个环面，当节点到达目的地时，它们可以从边缘反弹。边界矩形的使用指数级分解了处于彼此无线范围内节点之间的时间（Cai and Eun,\
  \ 2007），并对 RWP 的真实性带来了挑战。然而，通过移除边界矩形，RWP 变为幂律分布，使得 RWP 更加真实。\n\n要想象 RWP 移动模型的现实场景非常困难。但由于其简单性，可以对几种场景进行建模；例如，在校园场景中，城市里的出租车只需改变速度和暂停时间间隔就可以很容易实现多样化，而且如果需要，还可以增大边界矩形的大小来建模大型校园。\n\
  \n### 随机方向移动模型\n\n随机方向模型中的移动节点如图 4.3\n\n图 4.3 随机方向模型中的节点移动。\n\n在该模型中，不再需要旅行到仿真边界来改变方向。移动节点可以在随机选择的方向上旅行，并在该方向的任何位置选择目的地。与\
  \ RWM 和 RWP 一样，RDM 模型也表现出速度和方向的突然变化；因此，它也是一种不真实的移动模型。为了避免突然变化、边缘效应和移动模型中的不真实行为，提出了一种速度逐渐变化的平滑移动（SM）模型（Haas,\
  \ 1997）。在平滑移动模型中，每个节点由速度和方向刻画。我们将在后面的章节中详细讨论这种移动模型。节点的位置 `(x, y)` 和其运动矢量 `(v, θ)`（其中\
  \ `v` 是节点速度，`θ` 是节点方向）每隔 `Δt` 秒更新一次，如下：\n\n```\nx(t+Δt) = x(t) + v(t)cos(θ(t)) \
  \ || (4.1)\ny(t+Δt) = y(t) + v(t)sin(θ(t))  || (4.2)\nv(t+Δt) = min[max(v(t)+Δv,0),\
  \ V[max]]  || (4.3)\nθ(t+Δt) = θ(t) + Δθ  || (4.4)\n```\n\n### 随机移动模型的评估\n\n随机移动模型以非常简单的方式制定用于模拟节点运动。它们因其简单性而被广泛接受，但无法模拟现实场景的大多数特征。以下是随机移动模型无法捕捉的一些现实场景特征：\n\
  \n1. **时间依赖性**：在许多现实场景中，加速度的突然变化、突然制动和急转等移动行为并不频繁发生；相反，它们是渐进的，方向变化平平滑。\n\n2. **空间依赖性**：大多数现实场景中的节点并非独立移动；相反，它们以相关的方式移动，例如在战场上、搜索救援行动期间以及博物馆导览期间。节点行为可能会受到周围节点的影响并以相关的方式工作，这在随机移动模型中是不可能的。\n\
  \n3. **地理依赖性**：随机移动模型可以在仿真区域内无限制地自由移动，但在现实场景中可能存在树木、建筑、街道等障碍物。随机移动模型没有考虑地理障碍，无法模拟真实的环境场景。\n\
  \n\n\n\n\n`Random Waypoint`（随机路点）移动模型是一种灵活的移动模型，用于评估自组网络的多组播协议，但由于它不会离开初始位置较远，因此仅限于覆盖仿真区域的一小部分。在该模型中，最初所有移动节点随机分布在仿真区域内，在对`Random\
  \ Waypoint`移动模型进行性能研究后发现，节点的速度和暂停时间之间存在复杂的相互关系。例如，一个速度快且暂停时间短的移动节点比一个速度慢且暂停时间长的节点在网络中提供更高的稳定性。`Random\
  \ Direction`（随机方向）移动模型是不符合实际的移动模型，例如，人们不太可能均匀地分布在仿真区域内，并在给定区域的边缘停留特定的暂停时间。改进后的随机方向模型允许节点停留在边缘；相反，它们可以改变方向，并在到达仿真边界之前进行暂停。`Random\
  \ Direction`模型中节点的运动模式与带有暂停时间的 `Random Walk`（随机游走）模型中的节点运动模式非常相似。\n\n随机模型无法对真实环境和机会性网络的许多移动行为进行建模。因此，人们提出了多种移动模型来对机会性网络（OppNets）中存在的移动行为进行建模。\n\
  \n#### 4.2.3 合成模型\n\n合成模型是数学模型，通过施加约束（如障碍物、路径等）来捕捉节点的运动。它们不依赖于节点的随机移动，而是以相关的方式移动，以真实地捕获节点的运动。在本节中，我们将讨论各种合成移动移动模型。\n\
  \n### 4.2.3.1 基于时间依赖的移动模型\n\n移动节点的物理约束会影响移动节点的速度，导致速度逐渐或突然变化。时间依赖属性描述了在两个时间点上彼此靠近的节点的速度，即节点的当前速度取决于其之前的速度。基于时间依赖的移动模型考虑了时间依赖属性，并在文献中被提出；这里，我们讨论了该类别下两种流行的移动模型。\n\
  \n#### 4.2.3.1.1 高斯-马尔可夫模型（Gauss–Markov Model）\n\n`Gauss–Markov`移动模型由 Liang 和 Haas（1999）提出，用于预测无线个人通信服务（PCS）网络的用户移动模式。该模型的创建目的是通过使用速度作为调节参数来改变运动模式中的随机程度，从而规避基于随机的移动模型的随机性局限性。\n\
  \n在该移动模型中，每个移动节点最初被分配一个当前速度和方向，每个节点的移动通过在固定时间间隔更新其速度和方向来实现。每个移动节点的速度和方向在时间上是相关的，并根据`Equations\
  \ 4.5` 和`4.6` 根据相应移动节点之前的速度和方向进行计算，并根据`Equation 4.7` 和`4.8` 根据节点在每个时间间隔的当前位置、速度和方向计算更新后的节点位置：\n\
  \n| | $$s\\_{t} = \\alpha s\\_{t - 1} + \\left( {1 - \\alpha} \\right)\\overline{s}\\\
  operatorname{} + \\operatorname{}\\sqrt{\\left( {1 - \\alpha^{2}} \\right)} \\cdot\
  \ s\\_{x\\_{t - 1}}}$$ | (4.5) |\n| --- | --- | --- |\n| | $$d\\_{t} = \\alpha d\\\
  _{t - 1} + \\left( {1 - \\alpha} \\right)\\overline{d} + \\operatorname{}\\sqrt{\\\
  left( {1 - \\alpha^{2}} \\right)} \\cdot s\\_{d\\_{t - 1}}}$$ | (4.6) |\n| --- |\
  \ --- | --- |\n| | $$x*[*t*] =  *x*[*t* − 1] +  *s*[*t* − 1]cos*d*[*t* − 1]}$$ |\
  \ (4.7) |\n| --- | --- | --- |\n| | $$y*[*t*] =  *y*[*t* − 1] +  *s*[*t* − 1]sin*d*[*t* − 1]}$$\
  \ | (4.8) |\n| --- | --- | --- |\n\n其中，`s[t]` 和 `d[t]` 是在时间间隔 `t` 处 mn 移动节点（MN）更新后的速度和方向。\n\
  \n`α = 0 ≤ α ≤ 1` 是用于改变随机性的调节参数。\n\n`s` 和 `d` 是代表 `t→∞` 时速度和方向平均值的常量，而 `s[x[[[*t−1]]]]`\
  \ 和 `s[d[t−1]]]` 是来自高斯分布的随机变量。\n\n`(x[t], y[t])` 和 `(x[t−1], y[t−1])` 分别是移动节点在第\
  \ n [th] 和 (n−1)[st] 时间间隔位置的 x 和 y 坐标，`s[t−1]` 和 `d[t−1]` 分别是移动节点在第 (n−1)[st] 时间间隔的速度和方向。\n\
  \n为了防止节点出现不良的边缘效应，当它们靠近仿真边界时，通过修改上述方程中的平均方向，强制它们远离仿真边界。\n\n#### 4.2.3.1.2 平滑随机移动模型（Smooth\
  \ Random Model）\n\n另一种基于时间依赖的移动模型是平滑随机移动模型。该移动模型由 Haas（1997）提出，以避免节点的不实际行为、边缘效应以及运动过程中速度的突然变化，这些在基于随机的模型中都是存在的（见图\
  \ 4.4）。\n\n![](img/fig4.jpg)\n\n图 4.4 平滑随机移动模型中的节点运动。\n\n在该移动模型中，移动节点的速度逐渐变化，而不是突然加速和急转。每个节点由运动矢量\
  \ `(v,θ)` 定义，`v` 和 `θ` 分别是速度和方向。在规律的时间间隔，根据以下方程更新移动节点的位置和运动矢量：\n\n| | $$v(t+Δt) = \\\
  [max(v(t)+Δv,0),v[max]\\]}$$ | (4.9) |\n| --- | --- | --- |\n| | $$θ(t+Δt) = θ(t) + Δθ}$$\
  \ | (4.10) |\n| --- | --- | --- |\n| | $$x(t+Δt) = x(t) + v(t)cos(θ(t))}$$ | (4.11)\
  \ |\n| --- | --- | --- |\n| | $$y(t+Δt) = y(t) + v(t)sin(θ(t))}$$ | (4.12) |\n|\
  \ --- | --- | --- |\n\n其中，`Δv` 和 `Δθ` 分别是速度和方向的变化，被选择为较小的随机变量，以实现节点的平滑轨迹；`x` 和 `y`\
  \ 是移动节点的位置，`v[max]` 是最大速度。\n\n### 4.2.3.2 基于空间依赖的移动模型\n\n\n\n\n\n参考点组移动模型（Reference\
  \ Point Group mobility model）是最流行的移动模型之一，由 Hong 等人（1999）提出。在参考点组移动模型中，组中的每个移动节点随机分布在预定义的参考点\
  \ $\\overset{\\\\rightarrow}{RP}$ 周围，这允许节点进行个体随机运动的同时组运动行为。每组节点都有一个逻辑中心，通过组运动向量\
  \ $\\overset{\\\\rightarrow}{GM}$ 定义整个组的运动。当参考点从 `t` 移动到 `t + 1` 时，根据组的逻辑中心更新单个参考点的位置。运动向量\
  \ $\\overset{\\\\rightarrow}{GM}$ 可以基于预定义的路径设计，也可以随机选择。一旦组运动向量到达检查点，它将再次计算下一个检查点并移动到该检查点。通过合理选择检查点，RPGM\
  \ 可以模拟各种真实的应用场景。RPGM 模型（Hong 等，1999）模拟了三种应用场景：\n\n1. **原地移动模型（In-place mobility\
  \ model）**：在该模型中，仿真区域内不同相邻位置的不同工作组以不同的运动模式进行工作。\n2. **重叠移动模型（Overlap mobility model）**：在该模型中，不同的工作组在同一个仿真区域内以不同的运动模式工作。\n\
  3. **常规移动模型（Convention mobility model）**：在该模型中，不同的工作组在各自的相邻位置工作，根据场景情况，一个工作组的某些节点可以移动到相邻位置的另一个工作组。\n\
  \nRPGM 可以模拟其他各种真实的应用场景，如军事、灾难救援、搜索救援等。\n\n## 4.2.3.2.2 列式移动模型（Column Mobility Model）\n\
  \n列式移动模型由 Sanchez（n.d.）提出，是一种空间依赖的组移动模型，适用于搜索和扫描目的。在这种移动模型中，一组移动节点通过形成一条线向特定方向均匀向前移动。例如，一群士兵以排队的形式向敌人行进。Sanchez（n.d.）描述了该移动模型的一种微改，将一组移动节点放置在单列中，并允许它们在初始位置附近相互跟随。节点的参考位置通过以下方程更新：\n\
  \n```\nnext_reference_position=prev_reference_position+advance_vector\n```\n\n其中，`prev_reference_position`\
  \ 是节点的初始位置，`advance_vector` 是移动参考网格的预定义偏移，它通过随机距离和 0 到 `π` 之间的随机角度计算。\n\n```\nnext_position=next_reference_position+random_vector\n\
  ```\n\n节点的下一个位置通过 `next_reference_position` 和 `random_vector` 之和来更新，后者是上述方程给出的随机偏移。\n\
  \n## 4.2.3.2.3 追逐移动模型（Pursue Mobility Model）\n\n追逐移动模型是另一种基于空间的移动模型（Sanchez, n.d.;\
  \ Bergamo 等，1996），其中移动节点试图跟踪特定的目标。它可以用于法律执法和信号源跟踪，因为模型中的节点试图捕获单个目标节点。这同样基于参考点组移动模型，且被追逐的节点在仿真区域内的移动遵循随机路点移动模型（见图\
  \ 4.5）。\n\n![](img/fig4.5.jpg)\n\n图 4.5 追逐移动模型中 4 个节点的移动。\n\n追逐移动模型中节点的位置通过以下方程更新：\n\
  \n```\n\\begin{matrix} \\text{Next\\_position} = \\text{Prev\\_position} + \\text{acceleration}\\\
  left( {\\left. \\text{target} - \\text{prev\\_position} \\right)} \\\\ + \\text{random\\\
  ,vector} \\end{matrix}\n```\n\n节点的下一个位置根据节点的当前位置以及随机向量计算，该向量是一个调优参数，用于保持随机性以有效跟踪被追逐的移动节点。目标是被追逐节点的预期位置。\n\
  \n## 4.2.3.2.4 游牧社区移动模型（Nomadic Community Mobility Model）\n\n游牧社区移动模型（Sanchez, n.d.;\
  \ Sanchez 和 Manzoni, 2001）是另一种相关移动模型，一组移动节点随机共同从一个位置移动到另一个位置。移动模型中的每个节点遵循个体移动模型（如随机移动模型）在参考点周围移动。当参考点改变时，整个组节点移动到由参考点定义的另一个位置，并开始在新变化的参考点周围移动。与列式移动模型相比，游牧社区模型共享参考网格，且节点的移动是分散的（见图\
  \ 4.6），而列式移动模型有自己的参考点，且节点的运动或多是恒定的。\n\n![](img/fig4.6.jpg)\n\n图 4.6 游牧社区移动模型中 4\
  \ 个节点的移动。\n\n组的整体运动决定了每个节点的参考点。节点的位置通过以下方程更新：\n\n```\nnext_position=Predefined_reference_position+random_vector\n\
  ```\n\n每个节点的预定义参考点可以通过 `random_vector` 进行偏移，以实现节点的随机运动。游牧社区移动模型可用于各种类型的场景，如军事场景、农业场景等。\n\
  \n## 4.2.3.3 基于地理限制的移动模型（Geographical-Restriction–Based Mobility Model）\n\n在随机移动模型中，移动节点可以在仿真区域内的任何地方自由移动，而不受任何地理限制（如路径、街道、建筑等环境障碍）。基于地理限制的移动模型是受环境限制限制的模型。该类别下提出了多种移动模型，并在后续简要讨论。\n\
  \n### 4.2.3.3.1 路径移动模型（Pathway Mobility Model）\n\n路径移动模型是一种基于地理限制的移动模型，该模型受路径限制。在该模型中，为仿真区域预定义了地图，并将地图建模为随机图，图中的顶点表示建筑，边表示路径（Tian\
  \ 等，2002）。移动节点的运动通过将节点放置在边（即路径）上开始。节点向随机选择的目标开始移动，并沿着边的最短路径到达目的地。到达目的地后，它在那里停留指定的暂停时间，然后再次向新的随机选择的目标移动。路径移动模型也表现出某种形式的随机性，但它受路径限制，与随机移动模型不同，它只能在仿真区域内的路径上移动。路径移动模型适用于各种场景，如校园、街道等。\n\
  \n### 4.2.3.3.2 障碍移动模型（Obstacle Mobility Model）\n\n障碍移动模型是另一种基于地理限制的移动模型，它试图考虑环境障碍来模拟节点的运动。环境障碍会影响节点的运动模式，因为当节点遇到障碍时必须改变路径。因此，障碍在建模节点移动方面起着重要作用。研究人员提出了多种移动模型来避免环境障碍。Johansson\
  \ 等（1999）开发了三种真实的场景来规避障碍。\n\n\n\n\n\n### 1. 事件覆盖场景\n在这种场景下，一群人员具有高移动性，并在场景内频繁变换位置。\n\
  \n### 2. 会议场景\n在会议室场景下有 50 个人；只有少数人在移动，移动性较低，大多数人是静止的。\n\n### 3. 灾难救援场景\n在灾难救援场景中，根据应用场景，某些节点具有高移动性，而某些节点的移动性较低。\n\
  \n在上述三个三个场景中，障碍物被以矩形框放置在仿真区域内，移动节点通过选择正确的移动轨迹来避开障碍物。Jardosh 等人（2003）试图研究障碍物对节点移动性的影响。他们将障碍物放置在仿真场中以模拟\
  \ UCSB 校园的建筑。作者发现，校园内的人遵循仿真区域内预定义的路径移动，而不是随机移动。因此，根据建筑的位置计算了用于构建路径的 `Voronoi graph`。一旦通过将建筑或障碍物的交点与\
  \ Voronoi 图连接构建出路径图，节点就会被限制在路径上，即它们允许在路径上移动，并由于校园场景可以进入和离开建筑。节点通过预定义的路径图沿最短距离移动到随机选择的目标。Voronoi\
  \ 图中的最短距离通过 `Dijikstras` 算法计算。\n\n预定义路径的限制限制了应用场景，并使应用场景在某种程度上变得是静态的；此外，在某些场景中，选择最短路径到达目的地是不可能的。为了解决这些问题，Huang（2005）提出了一种\
  \ Delaunay 模型，其中节点可以避开障碍物而不穿过它们。绕路路径通过避开障碍物与最短路径计算，并根据路径数量进行计算。但这种绕路方法似乎不可行，因为计算路径需要复杂的计算，且无法表示群体运动行为。Tan\
  \ 等人（2002）提出了一种基于个体复杂行为交互的真实人类运动群体行为模型。地理限制限制了节点的移动，反过来影响了网络节点的移动性。因此，研究人员正试图模拟能够真实捕获网络节点移动的的模式。\n\
  \n### 4.2.3.3.3 曼哈顿移动模型\n曼哈顿移动模型（Bai 等，2003）也是一种基于地理限制的移动模型，它使用预定义的网格拓扑结构进行节点移动。它模拟了城市区域组织良好的街道中的节点移动模式。它通过使用概率方法在街道上直行、左转和右转，沿水平和垂直方向移动。在节点的每个交叉口直行时，它选择\
  \ `0.5` 的概率，而左转或右转的概率为 `0.25`。它不适用于高速场景，但允许以特定的概率向左或向右移动，即允许改变方向。\n\n### 4.2.3.3.4\
  \ 城市区域模型\n城市区域移动模型（Davies 等，2000）模拟了节点在城市某区域内的真实移动。移动模型中的移动节点遵循预定义路径，并像真实场景一样受到障碍物和交通规则的限制。每个移动节点都从街道上的定义点开始，通过最短路径向随机选择的目的地移动。到达目的地后，它在该位置停留特定的暂停时间，然后再次选择随机目的地进行移动，并重复该过程直到仿真结束。城市区域移动模型通过限制移动模式展示了节点的真实移动，即像真实场景中人们遵循交通规则在预定义路径上移动一样。研究人员正在考虑城市区域移动模型的改进，并已经取得了许多改进，例如模型中的暂停时间、速度变化的引入、增加街道数量、扩大仿真区域、高速等。\n\
  \n### 4.2.3.4 仿真移动模型评估\n仿真移动模型旨在以相关的方式真实地模拟节点移动。它们由于对移动模式和群体运动行为的真实建模而被广泛接受。以下是仿真移动模型能够捕获的真实场景特征：\n\
  \n1. **时间依赖**：仿真移动模型能够处理真实场景，节点在仿真区域内表现出加速度和光滑的方向变化。\n2. **空间依赖**：大多数仿真移动模型中的节点并非独立移动；而是以相关的方式移动，例如在战场、搜索救援作业。\n\
  3. **地理依赖**：仿真移动模型处理地理限制，因为真实场景中可能存在树木、建筑、街道等障碍物。\n\n### 4.2.4 基于地图的移动模型\n基于地图的移动模型基于交通和用户移动模式，用于评估和解决机会网络中的网络问题。基于地图的移动模型中的节点在由已知文本格式地图数据定义的预定义路径上随机移动。\n\
  \n#### 4.2.4.1 基于路由的地图移动模型\n基于路由的移动移动（RBMM）移动模型模拟了节点基于仿真地图预定义路由的移动。该模型中的节点在获取地图数据后，会在仿真地图上遵循预定义的路由，但在节点移动过程中，模型并不随机选择目的地；相反，它们选择当前正在移动的下一个目的地。模型中的路由有许多停点，节点在旅行时遵循这些站点；它们在停点停留指定的时长，通过最短路径到达目的地进行移动模式建模（Ekman\
  \ 等，2008）。\n\n为了模拟车辆运动行为，提出了一种 `RBMM` 移动模型的变体，即街道随机路点（STRAW）移动模型，它使用了真实的街道场景，节点在街道地图数据定义的预定义道路或路由上行驶，以模拟真实的车辆交通模式（Choffnes\
  \ 和 Bustamante，2005）。\n\n\n\n\n\n早高峰交通模型（Rush Hour Traffic model，Seah 等人，2006）处理早高峰期间的交通状况。早高峰交通模型关注高流量区域和目的地的选择，因为人们倾向于前往附近的地方，而不是更远的目的地。对于节点的节点选择，分布是通过基于指数分布的区域分配算法完成的。由于该模型没有考虑地理限制、时间依赖性等，需要对早高峰交通模型进行若干改进。\n\
  \n#### 4.2.4.3 工作日移动模型\n\n工作日移动模型（Working Day Movement model）由 Ekman 等人（2008）提出，用于捕捉现实生活场景中的移动模式。该模型是为延迟容忍网络（DTNs）提出的，旨在处理在真实世界测量实验轨迹中发现的节点间接触时间和接触时间分布。作者使用\
  \ `ONE` 模拟器验证了他们的模型。该模型处理人们的日常工作常规，并试图模拟这种常规，同时将其统计特征与真实世界的轨迹进行比较。工作日模型由四个子模型组成，描绘了大多数人每天重复遵循的工作常规。\n\
  \n1. **家庭活动子模型**：该场景用于在在晚上和深夜模拟家庭活动。在此情况下，节点被分配地图上的某一点作为其家庭位置，它步行短距离并留在那里直到唤醒时间。该模型没有考虑家庭内部的移动（Ekman\
  \ 等人，2008）。\n2. **办公活动子模型**：该模型显示了员工在办公室内的移动（例如从员工办公桌到会议室或会议地点）（Ekman 等人，2008）。\n\
  3. **晚间活动子模型**：该模型模拟了人们下班后晚上以小组形式进行的活动，如晚上散步、在街上闲逛、进入餐厅等（Ekman 等人，2008）。\n4. **交通子模型**：该子模型模拟了节点在办公室、家庭和晚间活动之间的移动。这可以通过步行子模型、汽车子模型或公交子模型实现（Ekman\
  \ 等人，2008）。\n\n节点在包含所有家庭、办公室和晚间活动地点的地图上移动，该地图为节点的移动定义了空间和路线。工作日移动模型试图模拟人们在日常生活中遵循的每种场景。\n\
  \n### 4.2.4.4 基于最短路径地图的移动\n\n基于最短路径地图的移动（SPMBM）移动模型（Keränen 和 Ott，2007）为 DTN 提出，它基于仿真地图场景内的可用最短路径。在该模型中，节点不是在仿真地图上随机移动，而是在两个随机节点与仿真地图上的兴趣点（`POIs`）之间的可用路径中选择最短路径，因为人们大多数使用最短路径旅行。兴趣点（`POI`）是仿真地图上小组旅行所在的地方。在基于最短路径地图的移动模型中，所有节点被随机放置在仿真地图上，然后节点遵循\
  \ `Dijikstra` 算法旅行到仿真地图上的特定目的地，以从地图上的可用路径中发现最短路径。到达指定目的地后，节点暂停一段时间，然后再次通过最短路径移动到新选择的目的。\n\
  \n### 4.2.4.5 基于地图的移动模型评估\n\n基于地图的移动模型通常根据地图、人们遵循的路线、交通模式、工作活动模式等对移动模式建模。这些移动模型在模拟各种现实场景方面非常有用，但基于地图的移动模型具有某些局限性，因为模型中的路径是预定义的，这在某些情况下在现实生活中是不可能的。节点始终遵循地图数据的预定义路线，这无法准确代表真实的人类移动。研究人员希望对更多与基于路线和地图的移动相关的现实应用场景进行建模。\n\
  \n### 4.2.5 社会网络移动模型\n\n基于社交网络的移动模型根据人类决策和社交本质（如人类在战场或灾难救援期间的社交行为）捕捉移动行为。\n\n####\
  \ 4.2.5.1 社区模型\n\n社区模型（`CMM`，Musolesi 和 Mascolo，2006）是一种基于社交网络的移动模型，模拟移动模式。`CMM`\
  \ 模型根据节点所属的社区进行分组。相同社区的节点互为朋友，属于不同社区的节点互为非朋友。最初为每个社区分配一个单元，它们共享社交链接。节点的聚集行为是该模型的主要缺点，节点会离开社区。\n\
  \n为了解决这些局限性，提出了基于家庭单元的移动（`HCM`）。根据该模型（它是 `CMM` 的变体），某些节点也可以与其他社区建立社交链接（Hsu 等人，2007）。因此，`HCM`\
  \ 模型处理聚集行为，节点离开家庭社区前往目的地社区的概率基于节点与其他节点的社交链接（Veeramani 等人，2011）。\n\n#### 4.2.5.2\
  \ 社会网络模型\n\nHerrmann（2003）提出了一种社交移动模型，其中用户的移动受到他们之间关系的影响。在该模型中，虚拟用户定期在一组抽象位置之间移动。用户被给定一组在固定时间内访问的抽象位置。Musolesi\
  \ 等人（2004）提出的社交网络模型是基于社交网络理论的因为它因为它于人际关系。该模型允许许多主机根据它们之间的社交关系分在一起，并映射到拓扑空间。\n\n\
  ## 4.4 测试工具\n\n\n\n\n仿真是分析自组织网络协议性能最常用的方法，也是一种极具价值的工具，因为它能够快速探索大型系统；它们是对真实系统的模拟，具有所选系统的关键特征。在验证网络协议的分析、仿真、仿真（emulation）和测试平台实验（testbed\
  \ experiments）中，仿真具有许多优势，包括可重复性、参数隔离性、可扩展性和指标探索性。\n\n在众多可用的仿真器中，如 `GloMoSim` (Zeng\
  \ et al., 1998)、`OPNET Modeler` (2004)、`NetSim` (Wong et al., 1990) 等，其中 `ns-2`（一个\
  \ monarch 扩展）（The ns-2 Project, 2008）是评估网络协议性能最流行的仿真工具。它是一个用 `C++` 和 `OTcl` 编写的离散事件仿真器。它的活跃开发和维护于\
  \ 2010 年停止，但用户社区的志愿者仍在继续开发。`Ns-3`（The ns-3 Project, 2003）是 `ns-2` 活跃开发的新版本；它用 `C++`\
  \ 和 `Python` 编写并具有脚本能力，不是 `ns-2` 的后兼容扩展。\n\n离散事件仿真器类包含许多仿真器，它们不仅可以模拟复杂的计算机系统，还能模拟生物、工业、经济以及其他各种学科的系统。通常，这类仿真器将系统操作视为离散的事件序列（即每组事件序列都发生在特定的时刻，且相邻事件之间系统不会发生变化）。`SimEvents`\
  \ (Clune et al., 2006)、`SIMUL 8` (Hauge and Paige, 2004)、`Simio` (Kelton et al.,\
  \ 2011)、`GoldSim` (Guide et al., 2007)、`FlexSim` (Gelenbe and Guennouni, 1991)、`ExtendSim`\
  \ (Diamond et al., 2007)、`Enterprise Dynamics` (Rabelo et al., 2005)、`Simcad Pro`\
  \ (Adra, 2005) 等是商业离散事件仿真器的示例。`Simula` (Dahl and Nygaard, 1965)、`OMNET++` (Varga,\
  \ 2005)、`Parsec` (Bagrodia et al., 1998)、`CPN Tools` (2005)、`JaamSim` (King and\
  \ Harrison, 2013) 是开源离散事件仿真器的示例。\n\n尽管仿真提供了许多优势，它仍然可能无法准确模拟现实场景，并且无法反映网络系统的真实性能。许多作者表明，不同仿真器获得的结果可能显示出显著的差异和分歧的结果。一些流行的仿真器（`OPNET\
  \ Modeler`、`GloMoSim` 和 `ns-2`）获得的结果之间存在巨大差异（Cavin et al., 2002）。考虑到移动性建模，节点集合较少以及轨迹结果持续时间有限在仿真中引发了关键问题。因此，人们对于使用各种准确重现移动轨迹的工具来测试系统和网络协议表现出浓厚的兴趣。`STRAW`\
  \ (Choffnes and Bustamante, 2005) 使用真实的美国城市车辆进行车辆流量建模，并通过使用车辆移动性模型提供了更准确的仿真结果。`Mobility\
  \ simulator` (Haerri et al., 2005) 是另一个真实模拟场景的仿真器，由交通部（DOT）智能城市挑战资助。`TRANSIM` (Smith\
  \ et al., 1995) 是另一个预测运输规划和排放分析的工具，在第 4.3 节中详细讨论。用于仿真和结果验证的工具正在增加，并为未来的工作提供了空间。\n\
  \n## 4.5 移动模型对机会性网络性能的影响\n\n机会性网络可以在高移动环境中工作，这反过来影响了系统的性能。意所当然的是，使用不同的移动模型在网络协议性能上显示出显著差异。高度动态的网络、移动特性以及性能指标的变化影响了网络协议的性能，因为机会性网络中的消息在两个节点接触时以对点方式进行传输。与固定网络相比，节点的吞吐量随着高度动态网络而增加（Grossglauser\
  \ and Tse, 2001）。通常，机会性网络的特征是直径小，即移动节点之间所谓的“小世界”（Chaintreau et al., 2007）。结果通过捕捉移动性进行验证。\n\
  \n## 4.6 移动建模的未来研究方向\n\n本章描述的机会性网络移动性模型的广泛概念和挑战已被广泛理解，并且是研究领域中活跃的话题。\n\n\n\n\n-\
