  #### 1.11.2 路由策略分类\n#### 1.11.3 复制与语义分类\n### 1.12 Freenet\n## 参考文献\n\n## 1.1 引言\n\
  \n机会性网络 (`ONs`) 是延迟容忍网络 (`DTNs`) 的子集，其中端到端连接性并不总是可用的。在这种环境中，通信在节点发生机会性接触时进行。\n\n\
  每个 `ON` 都源于 `MANETs`，即移动自组织网络。`ONs` 可以出现在无法实现端到端连接的场景中。在这些情况下，由于连接性稀疏，`IP` 协议无法工作。在这些情况下，用户可能会关闭设备或移出范围，导致\
  \ `MANET` 协议不适用于 `ON`。在 `ON` 中，移动性、断开连接和分区被视为常而非异常（Ritu & Sidhu, 2014)。\n\n## 1.2\
  \ 机会性网络的需求\n\n在过去的几年里，研究人员对移动自组织网络（`MANET`）进行了大量研究。`MANET` 是一种节点在无线范围内交换数据包的网络。然而，在灾区地区构建基础设施是非常困难的。\n\
  \n`ONs` 被认为是紧急情况下非常合适的选择，因为它们缺乏基础设施和中心服务。`ON` 使用“存储-携带与转发”的过程在两个节点之间传递消息。这解释了 `ON`\
  \ 具备延迟容忍的能力（Martín-Campillo, Crowcroft, Yoneki, & Martí, 2013)。\n\n## 1.3 从 MANET\
  \ 到机会性网络的迁移\n\n`ON` 是 `MANET` 的演进，它支持延迟容忍。`MANETs` 依赖中间节点进行通信，因为没有中心化服务。它们的特点是自配置、高度动态的拓扑结构、严重的资源限制以及共享无线介质。`ONs`\
  \ 的出现是因为 `MANETs` 面临的挑战，例如缺乏端到端连接性。在 `MANETs` 中，节点之间的连接应该始终通过公共互网络可用，这在常见场景中通常是不可能的。由于环境限制，`MANET`\
  \ 协议并不适用（Sugihara & Gupta, 2011)。\n\n\n\n\n\n传感器网络是由成百上千个传感器节点协作工作的结果。每个传感器节点包含四个核心组成部分，如感知单元、处理单元、无线电单元和电源单元。这些单元组合在一起可以放入如火柴盒般小的空间内，甚至是更小的模块中。由于传感器节点的感知和计算能力受限，它们只能在短距离内移动。这些节点散开并排列，以完成一项共同任务（Akyildiz,\
  \ Su, Sankarasubramaniam, & Cayirci, 2002）。\n\n无线传感器网络（`WSNs`）是在空间上分布在特定范围内并从物理世界收集信息的网络。这些网络用于观测压力、温度、湿度等环境因素，并将这些数据发送到汇聚节点或目标节点。WSNs\
  \ 已证明在交通监控、军事应用、天气预报、滑坡检测、火灾检测等多个应用领域具有极有价值的益处。它们是物联网（`IoT`）、信息物理系统（`CPS`）等新兴技术的支柱。WSNs\
  \ 最引人感兴趣的贡献在于医疗保健。医疗保健领域的无线传感器网络本身就是近年来备受关注的研究课题。感知物理实体信息的潜力使 WSNs 成为研究的热点（Jadhav\
  \ & Satao, 2016）。\n\n### 1.4.1 传感器网络应用示例\n\n**入侵检测与跟踪**：传感器被部署在战场边缘，用于检测、分类和跟踪入侵的人员和车辆。\n\
  \n**天气监测**：天气监测是一个重要方面；使用专用节点可以预测温度、风速、气压、降雨量、湿度等天气参数。\n\n**室内监控**：这些设备用于为画廊、医院、购物中心和其他设施提供安全保障。\n\
  \n**交通分析**：这些设备可以监控交通或城市的拥堵路段，帮助人们轻松到达目的地（Akyildiz, Su, Sankarasubramaniam, & Cayirci,\
  \ 2002）。\n\n### 1.5 移动无处不在局域网 (MULEs)\n\n`MULEs` 是一种数据收集器；用于从 `WSNs` 中的静态传感器节点收集数据。与多跳传输方法相比，数据信运载显著降低了传感器节点的能量消耗，但在数据交付延迟方面存在缺点。数据信运载的移动规划问题包含三个部分：决定路径、测量随时间变化的速度以及调度从每个节点收集数据的时间。这三个方面并非相互独立，且改进它们非常困难，正如其\
  \ NP 困难性所示（Sugihara & Gupta, 2011）。\n\n`MULEs` 接收来自传感器节点的数据；它们对其进行缓存，然后发送到范围内的有线接入点（`APs`）。由于传感器仅在短距离内传输，因此实现了显著的节电。从我们的角度来看，主要优势在于由于通信现在短距离内进行，传感器可以节省大量的功率。新的无线技术，如超宽带（`UWB`），其以极低的功耗运行并具有广泛的数据突发限制，非常适用于\
  \ `MULE` 通信。这种方法的主要缺点是增加了延迟，因为传感器节点必须等待 `MULE` 靠近（Small & Haas, 2003）。\n\n### 1.6\
  \ ZebraNet\n\n`ZebraNet` 是一种范围和能量有限的移动网络。在 `ZebraNet` 中，节点用于收集并转发数据。`ZebraNet` 的主要目标是从环境中收集信息并进行分析。然而，由于节点需要频繁通信，`ZebraNet`\
  \ 的能量消耗较高。为了解决这个问题，`ZebraNet` 使用了一种特殊协议来减少传输次数。\n\n\n\n\n\nMANETs 是自管理的无线网络。这些节点没有基础设施限制，彼此之间进行路由，并包含临时和动态无线网络。Ad\
  \ hoc（应急）是一个拉丁语。对于这一目的，它意味着 MANET 中的每个设备都有自由自由从一个地方移动到另一个地方的能力，并且它们与其他设备之间的链路会频繁变化（Mehta,\
  \ Nupur, & Gupta, 2015）。\n\n此外，MANET 中移动设备之间的数据传输可以直接实现，而不依赖于任何中心化服务单元。某些服务被添加到蓝牙等传输标准中，这些标准遵循“存储-携带与转发”原则。在过去的几年里，我们看到手机应用程序急剧增加；似乎中心化服务正在超越去中心化方法。我们将讨论\
  \ MANET 的当前应用领域，以及阻碍其扩散的参数（Stieglitz & Fuchß, 2011）。\n\nMANET 是一种在没有预定义基础设施通信系统的情况下，在移动节点中工作的独立方案。此外，它利用设备之间的无线连接。这些节点能够在传输范围内直接无线连接。因此，将会有多个中间节点通过多跳，将数据包从源节点转发到目的节点。为了确保通信成功，中间节点必须协作在源节点和目的节点之间交接数据包（Kaushik\
  \ & Kaushik, 2012）。\n\n### 1.8.1 应急网络的优点\n\n1. 它允许访问信息和服务；地理位置位置并不重要。\n2. 它独立于中心化网络运行（即它是一个自组织网络），各节点充当路由器运行，并且比有线网络更便宜。\n\
  3. 它具有可扩展性，能够容纳大量节点。\n4. 它是灵活的。\n5. 它具有良好的鲁棒性，因为它没有中心化管理。\n6. 网络可以在任何时间、任何地点建立（Mehta,\
  \ Nupur, & Gupta, 2015）。\n\n### 1.9 移动社交网络 (MSNs)\n\n移动社交网络 (MSNs) 用于以一种吸引人的方式为人与之间提供通信环境。MSNs\
  \ 利用了无线网络（移动互联网）和 OppNets（应急网络）的优点。因此，MSNs 可以位于移动设备中并由用户执行。所以人与移动设备的交互，即人机交互（HCI），对\
  \ MSNs 可能非常重要。基于移动分布式系统，MSNs 在几个方面被视为移动计算和社交计算的整体计算（Hu, Chu, Leung, Ngai, Kruchten,\
  \ & Chan, 2015）。\n\n在移动社交网络 (MSNs) 中，在缺乏网络基础设施的情况下，用户通过协作建立他们彼此之间的连接，因为他们他们有相同的需求。由于这些网络不需要任何预定义的网络基础设施，它们可以在许多关键情况下建立，包括战场、巨大的灾后恢复和广域传感器网络。在这些环境中，由于物理阻碍、不确定的节点移动性和有限的无线范围，MSNs\
  \ 中的网络连通性通常上是高度动态的。在这样的高度动态网络中，连通性和不确定性使得 MSNs 中的数据传播成为一个挑战性问题（Fan, Du, Gao, Chen,\
  \ & Sun, 2010）。\n\n最近的技术发展使移动设备具有以去中心化的方式创建、存储和共享数据的能力，并在高速、高温度和不同位置等异常条件下增加了通信能力。由于一群人之间存在共同兴趣的内容，可能会以\
  \ OppNet 的形式出现各种机会性节点，以便在日常生活中在这些人之间共享内容。OppNet 被嵌入移动设备中，以应急方式在移动设备之间传输社交网络内容。OppNet\
  \ 用于在同一地理位置的移动设备用户之间执行内容。移动用户能够通过移动设备通过蓝牙或 `Wi-Fi` 等短距离通信交换数据。由于机会性数据共享独立于任何网络基础设施，它最大限度地减少了通过互联网的数据流量。它还可以允许在偏远地区或灾难场景（例如地震、海啸）进行数据交换，在这些场景中基础设施可能损坏或不可用（Hu,\
  \ Chu, Leung, Ngai, Kruchten, & Chan, 2015）。\n\n### 1.10 车载应急网络 (VANETs)\n\nVANET\
  \ 是一种由于为了相同的目的和使用情况而建立车辆网络的构想而产生的网络。VANETs 被认为是最可靠的网络之一，用于连接公路和城市地区等环境中的车辆。VANETs\
  \ 的主要目标是独立于任何控制器或基站，建立许多车辆之间的网络通信。VANETs 有许多应用，使其对紧急情况很有帮助，例如在发生事故时向救护车共享信息以挽救生命。除了这些实用的应用，VANET\
  \ 车辆还面临许多问题，例如缺乏基础设施。这使得车辆承担了根据 VANET 要求维护通信的巨大责任（Rehman, Khan, Zia, & Zheng, 2013）。\n\
  \n#### 1.10.1 VANET 的应用\n\n1. 实时交通：数据可以存储在路侧单元 (`RSU`) 中，以便在需要时使用。\n2. 协作消息传递：慢速/停止的车辆共享消息并相互协作。\n\
  3. 协作碰撞警告：它警告驾驶员前方有任何危险，以便他们修正路线。\n4. 视觉增强：在天气糟糕的情况下，它通过关于车辆和障碍物的清晰信息引导驾驶员。\n\n\
  #### 1.10.2 VANET 的特征\n\n1. 动态拓扑：由于车辆的高移动性，VANET 环境的拓扑不断变化。相反方向车辆之间的连接时间短暂。在速度较高的高速公路环境中，这种连接时间甚至更短。\n\
  2. 可预测的移动模式：车辆在 VANET 环境中有预定义的路线。因此，网络设计人员可以预测网络中的移动模式。\n3. 网络拓扑：由于节点的高移动性和随机速度，网络拓扑频繁变化。\n\
  4. 无边界的网络规模：VANETs 的规模可以从一个城市或几个城市变化到一个或多个国家。\n5. 节点保护：VANET 节点在物理上受到更好的保护，并且可以减少基础设施攻击的影响。\n\
  6. 低能耗：VANETs 没有能耗问题；它们使用的能量很少。\n\n由于枢纽的高发展和地理的持续变化，VANET 中车辆之间的关联存在访问间隔。\n\n###\
  \ 1.11 延迟容忍网络 (DTN)\n\n延迟容忍网络 (`DTN`) 是一种建立网络环境的技术，旨在定位多样化网络中的技术问题。这些技术问题可能导致缺乏永久网络连接。此类网络的示例包括在移动网络或极端地面环境中运行的网络（Ali,\
  \ Qadir & Baig, 2010）。\n\n\n\n\n\n容延网络（DTNs）是一种可能永远不存在端到端同时路径的移动网络。DTN 的特性与传统的自组织网络（ad\
  \ hoc networks）不同。DTN 的路由协议遵循存储-携带-转发机制，以尽度地减少数据包丢失的概率，容忍延迟，并在交付成功率和交付延迟方面提高交付性能（Benhamida,\
  \ Bouabdellah, & Challal, 2017）。\n\n### 1.11 网络拓扑分类\n\n根据网络拓扑信息的可用性，DTN 协议可以分为确定性、随机性和基于编码的方案。在确定性类中，系统假设网络拓扑信息是先知的。当网络行为是随机的时，路由协议是随机的。它取决于关于何时以及何地转发消息的决策。这种决策从转发给范围内的任何接触节点，到使用历史数据或移动性模式等信息不等。基于编码的方法的基本思想是通过线性组合（网络编码）将大量消息编码为一条消息，或将一条原始消息编码为大量的编码块（删码编码）。\n\
  \n### 1.112 路由策略分类\n\n此类根据路由策略将 DTN 解决方案分为基于社交的和基于机会的协议。在基于社交的协议中，每个节点使用社区间、中心性、社交相似性等社交指标选择中继节点来转发消息。这些指标定义了节点之间的共同兴趣和接近性。然而，基于机会的路由协议根据移动性模式、节点接触目的地的历史信息以及再次接触目的地的概率等因素选择中继节点。\n\
  \n### 1.11.3 与语义分类\n\n基于多播的传输将消息传递给一组感兴趣的接收者，而基于单播的传输将消息传递给其唯一目的地。在单播传输中，无法初始化任播（anycast）目的地，因为可以是成员组内的任何一个节点（Benhamida,\
  \ Bouabdellah, & Challal, 2017）。\n\n### 1.12 Freenet\n\nFreenet 是一个分布式内容共享系统，用户具有插入和检索的能力。它以对等点匿名网络闻名，旨在为内容发布者和检索者都提供匿名性。Freenet\
  \ 中的任何节点都没有其他节点的任何信息，除了其直接邻居。Freenet 应用了跳跳传输用户消息以及重写每个节点消息的（源）地址等技术来提供用户匿名性。Freenet\
  \ 提供两种运行模式：Darknet 和 OppNets。在 Darknet 中，只允许信任的朋友相互连接，而在 OppNet 中，任何人都可以连接到 Freenet。这些节点必须为了存储和检索数据而相互查询，这些数据以位置无关的密钥命名。每个节点管理自己的本地数据存储，并确保网络中其他节点可以对其进行读写操作；同时还维护一个动态路由表，其中包含其他节点的地址以及它们被认为持有的密钥。Freenet\
  \ 是一个对等点匿名内容共享系统。每个节点必须维护部分硬盘空间以为 Freenet 网络的内容共享做出贡献。由于由于对等点系统，Freenet 中的节点有随时动态加入或离开网络的能力。Freenet\
  \ 的循环范围 `[0,1]` 与该范围内的每个节点相关，其中位置 `[0]` 和位置 `[1]` 是相同的。节点在首次加入 Freenet 网络时，在范围内随机选择其位置。为了方便任意节点连接到\
  \ Freenet 网络，Freenet 网络提供了一组种子节点（Tian, Duan, Baumeister, & Dong, 2017）。\n\n## 参考文献\n\
