  \ 1239–1252.\n\n# 机会性网络路由协议分类 Khaleel Ahmad, Muneera Fathima, and Khai Amali\n\n\
  ## 5.1 引言\n\n## 5.2 基于地理位置的\n-   竞争转发 `CBF`\n-   地理转发 `GeRaF`\n-   地理性路由 `GOR`\n\
  -   多速率地理性路由 `MGOR`\n-   位置辅助路由 `LAOR`\n-   基于位置的路由 `POR`\n-   拓扑与链路质量感知的地理性路由 `TLG`\n\
  -   链路质量地理性路由 `LinGo`\n-   韧性机会性路由 `ROMER`\n-   定向传输协议 `DTRP`\n-   自组网络中的机会性路由 `OPRA`\n\
