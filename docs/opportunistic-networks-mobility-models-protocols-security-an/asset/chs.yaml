  ![](img/fig16.28.jpg)\n\n图 16.28\n\n`EpidemicRouterWithScore` 的结果。\n\n## 16.5 结论\n\
  \n本关于使用 `ONE` 模拟器进行开发的教程从基础知识开始——涵盖了如何在配置文件中添加或更改参数，以及在 `ONE` 中实现路由协议的方法。最后，利用所有这些知识，从零开始实现了一种新的路由协议，其性能优于\
  \ `EpidemicRouter`。本章旨在帮助研究人员熟悉 `ONE`。`ONE` 模拟器中还有许多可以探索的内容，包括使用真实的移动轨迹和数据以及使用 `JUnit`\
  \ 编写测试，这些留给读者读者。\n\n## 参考文献\n\n- Chhabra , A., Vashishth , V., and Sharma , D. K.\
