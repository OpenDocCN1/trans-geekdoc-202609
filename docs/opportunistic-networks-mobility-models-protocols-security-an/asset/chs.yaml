  \n# 6.3 带有拥塞避免的自适应路由协议\n## 6.3.1 拥塞感知自适应路由协议\n## 6.3.2 结果与讨论\n\n## 参考文献\n\n# 6.1\
  \ 机会网络引论\n## 6.1.1 机会网络的技术背景\n\n通信和系统架构的技术进步为用户提供了具有多个通信接口的小型手持移动无线设备，催生了无处不在的计算这一新兴领域（Chaintreau\
  \ et al., 2005; Jung et al., 2007; Kathiravelu and Pears, 2006; Pareschi et al.,\
  \ 2008）。这些具有多种通信接口和各种数据率的移动设备的携性促进了许多新网络架构的发（Feeney and Nilsson, 2001; Camp et al.,\
  \ 2002; Bruno et al., 2005）。自组织网络和移动自组织网络（MANETs）是此类网络架构，便携设备能够通过短距离无线连接在对等设备之间建立点对点的网络连接。事实证明，这些自组织网络在无法直接访问互联网或由于自然和其他灾害导致通信基础设施损坏的场景下非常有用（Bruno\
  \ et al., 2005）。在过去的几年中，机会网络成为通信网络领域的一个新范式，被认为是 MANETs 和延迟容忍网络的子类（Fall, 2003; Cerf\
  \ et al., 2004）。具有多个通信接口的小型移动手持设备的普及为这种新的通信范式铺平了道路，在这种范式下，移动无线设备在彼此处于通信范围内，可以机会性地交换感兴趣的内容，或者利用其与其他设备的本地连接机会性地为其他移动设备转发数据包。这些机会性交换为机会网络以及新兴的“存储、携带和转发”范式（另一种称为口袋交换网络\
  \ [PSNs] [Chaintreau et al., 2005]）奠了最小基础设施的基础。机会网络中移动设备之间间歇性的连接迫使它们将内容存储在自己的缓冲区中，在移动时携带，直到遇到潜在设备以转发该内容。正是设备移动性和移动设备之间的协作，使得机会网络在信息共享方面取得了成功（Kathiravelu\
  \ and Pears, 2006; Chaintreau et al., 2005; Leguay et al., 2006; Conti and Kumar,\
  \ 2010; Pelusi et al., 2006）。由于机会网络被假设在没有典型网络基础设施支持的情况下运行，它们也适用于世界上发展中地区，在这些地区，由于政治和经济原因，网络基础设施不可用或范围非常有限。即使在存在网络基础设施的地方，自然灾害也可能摧毁基础设施，使机会网络有利于人们之间交换至关重要的关键信息，特别是对于参与救援和慈善工作的人员（Conti\
  \ and Kumar, 2010; Pelusi et al., 2006）。在世界的发达地区，机会网络可以在高密度社交互动场景的补充服务质量方面发挥主要作用（Hui\
  \ et al., 2008; Leguay et al., 2006; LeBrun and Chuah, 2006; Pietilinen et al.,\
  \ 2009）。机会网络有趣的固有属性吸引了全球研究人员从不同角度探索其研究问题。机会网络自诞生以来，的一些早期工作开始寻找以连接轨迹形式存在的机会性连接信息（Chaintreau\
  \ et al., 2005, 2007; Leguay et al., 2006; Kathiravelu and Pears, 2006）。随后还有一些研究关于网络行为的表征、可能用例场景的识别以及能够适应机会网络固有属性的应用开发（Kathiravelu\
  \ and Pears, 2006; Calegari et al., 2007）。理论和实验研究的进一步发展为机会网络路由协议和转发算法的设计与实现铺平了道路（Wang\
  \ et al., 2005; Song and Kotz, 2007; Chaintreau et al., 2007）。\n\n## 6.1.2 机会网络中的内容分\n\
  \n机会网络的潜力和独特特性吸引了研究人员寻找利用机会性接触分配感兴趣内容的方法。利用机会网络进行内容分发的早期工作始于 PSNs（Hui et al., 2005a;\
  \ Chaintreau et al., 2005）。PSNs 旨在利用本地和全局连接为移动人类场景传递消息（Hui et al., 2005a, 2005b）。\n\
  \n## 6.1.3 机会网络中的研究倡议\n\n在基于模拟的研究中使用流行的移动模型时，机会网络的独特特性提出了新问题。在这些研究中使用流行的移动模型来模拟设备移动性和设备连接也会使设计过程复杂化（Hsu\
  \ et al., 2005; Kathiravelu and Pears, 2006; Konishi et al., 2005）。随着新网络特征（如韧性和社区结构，Girvan\
  \ and Newman, 2002; Hui et al., 2007）的出现，需要能够表示具有这些特定特性及其固有属性的图的新型模型。对时间聚合现场轨迹集的详细调查揭示了当查看整个时间聚合接触集时，节点之间存在反复的交互；我们称这些反复交互为网络中的接触簇（CoCs）。在利用移动模型对机会网络进行模拟的研究中，最终目标是提取包含参数的接触信息，例如每对节点接触多长时间以及每对节点不接触持续多久。因此，研究人员开始直接使用从真实现场轨迹中获取的概率分布信息来生成连接轨迹，而不是依赖于任何正式的移动模型（Bonn,\
  \ 2005; Calegari et al., 2007）。理由是，即使使用这种正式的移动模型，人们所做的也是建模节点行为以测量设备连接，因此自然产生的问题是，为什么不根据估计参数直接对连接进行建模呢？此外，直接生成连接信息消除了设计师识别合适的正式移动模型并设置其参数的麻烦。其他优势，例如能够对变化的用户群体和设备连接模式进行基于模拟的研究，也可以轻松地集成到此类连接生成器中，并产生轨迹，而不是进行复杂的现场轨迹采集实验。\n\
  \n\n\n\n\n在我们之前的项研究（Kathiravelu 等，2009）中，我们能够利用机会性网络的两个高层属性——可预测性和连通性，对其行为进行建模。从这两个属性中通过概率估计获得的信息可以被节点利用，在做出未来的机会性接触时进行概率估计。\n\
  \n为了促进消息向目标地地的转发，路由算法首先需要对邻域信息进行机会交换。如 Kathiravelu 等（2009）所示，节点利用其过去与邻居的接触历史以及接触之间的间隔历史，以预测性和连通性的形式，概率地确定其未来的接触机会。当节点机会性地相遇时，它们会与邻居交换其估计的预测性和连通性信息。接收到此类信息的节点应根据接收到的信息确定最佳转发节点，以转发存储在缓冲区中的消息。\n\
  \n该新协议的建议基于以下原理：基于自相似性属性，节点可以概率地估计它们与邻居节点的预测性和连通性，因此在转发消息时，它们不需要利用任何随机概率估计。一旦节点估计了关于邻居的连通性信息，它们就可以将这些存储在定义良好的数据结构中，并在机会性接触期间交换该数据结构。接收来自邻居连通性信息的节点可以根据收到的信息更新其连通性表信息；因此，它们的连通表包含了关于任何给定时刻潜在转发器的最新信息。每个节点还可以为给定的目标维护多个转发器的信息。这使得每个节点能够从指向给定地地的多个可能转发者中选择最佳转发者。某一场景中由节点\
  \ 6 维护的连通表示例快照所示表 6.1。\n\n**表 6.1**\n\n包含指向给定地地的潜在转发者信息及其估计接触预测的连通表\n\n![](img/T6.1.jpg)\n\
  \n连通表的每行可能包含最多三个最佳节点，按目标节点标识符的递增顺序排列。这些节点对于与其过去接触过的目标地具有最高的相遇或转发至该地地的预测性、预期的接触建立时间以及预期的接触持续时间。如果一个节点没有遇到某个特定节点，则它将维护预测性最高的节点信息，该节点可能会遇到该特定节点。通过这种方式，每个节点无论未来是否会与给定节点相遇，都维持了网络连通性的全局视图。\n\
  \n### 6.2.1 邻域确定与消息转发\n\n当节点接收来自邻居的序列化连通表时，它会更新自己的连通性表，包含最高预测性的转发节点详细信息及其相关的连接建立时间和接触持续时间。每个节点执行的自适应消息转发算法位于算法\
  \ 6.1 至 6.3 中。\n\n![](img/T6.1a.jpg)\n\n![](img/T6.1b.jpg)\n\n我们使用真实的实地连通性实验轨迹迹（Leguay\
  \ 等，2006）来确定预测性和连通性信息，而不是应用随机概率方法来确定接触的递送预测性（Lindgren 等，2003）。在每个节点中，其与邻居节点的接触历史以接触持续时间和接触间隔时间列表的形式进行维护。基于这些接触历史信息，节点可以对其与同伴节点的未来相遇做出接触预测，这些预测驱动了机会性转发机制。\n\
  \n节点在其消息缓冲区中维护数据包，直到它遇到预期的最佳转发节点。当节点从另一个节点接收到数据包时，如果其目标是节点本身，则它将数据包传递给上层进行处理。如果收到的数据包目标是其他节点，则节点将判断其是否与目标地直接接触。如果与目标有直接接触，则它将数据包转发给目标。\n\
  \n![](img/T6.1c.jpg)\n\n否则，它将从连通表中选择预测性最高的节点，并在遇到该节点时转发数据包；或者如果它发现自己是最佳转发节点，它会将数据包保存在缓冲区中，直到遇到目标节点。\n\
  \n三种著名的路由协议，即 Epidemic（Vahdad 和 Becker，2000）、PRoPHET（Lindgren 等，2003）和 HiBOP（Boldrini\
  \ 等，2007）被仿真，并与所提出的拥塞感知自适应协议进行对比。基于事件的仿真器 JiST/SWANS（Barr 等，2005）用于模拟 Kathiravelu\
  \ 等（2009）描述的流量生成和传播。\n\n假设在网络中，最终可以在任意节点对之间建立跳跳路径，且节点位于范围之内或范围之外。随着仿真的进行，节点之间的连通性变得间歇性。\n\
  \n图 6.1\n\n图 6.1\n\n带有集群的仿真评估系统\n\n在仿真中，初始的 30 分钟被认为是过渡期。然后仿真运行 6 小时。仿真结束后，允许 1\
  \ 小时的稳定时间。\n\n在仿真中，节点之间的动态连接模式定义了连通性模型。连通性模型决定了节点对之间的链路级连通性，即新通信链路的建立和现有通信链路的断开。我们对\
  \ JiST/SWANS 仿真器的原生 802.11 链路层进行了修改，以根据连通性模型模拟机会性网络的接触和接触间隔。正如 Kathiravelu 等（2009）所讨论的，模拟搜索救援场景的成员在\
  \ 3-5 分钟的时间间隔内相互接触。\n\n### 6.2.2 性能指标\n\n正如 Lindgren 和 Phanse（2006）在类似的实验研究中所使用的，我们在基于真的真的使用了三种缓冲区管理策略，即直接丢弃（NOPO）、MOFO（优先丢弃转发最多的消息）和\
  \ SHLI（优先剔除寿命最短的消息）来衡量性能。\n\n\n\n\n\n我们使用消息交付率（`MDR`）以及每个节点在传输、接收消息以及睡眠和空闲状态下消耗的平均能量作为性能指标，用以衡量在不同可预测性和连通性组合下的系统性能，以便准确识别当这两个因素发生变化时的系统性能。\n\
  \n为了测量在传输、接收、睡眠和空闲状态下消耗的能量，我们使用了 Chen 等人（2002）在表 6.2 中提出的针对 2 Mbps 通信电台的能量消耗值，并改进了\
  \ Friedman 和 Kogan（2009）描述的相同方法进行计算。我们监控每个节点从一种活动切换到另一种活动时的状态变化，然后测量其消耗的能量。\n\n\
  我们使用以下公式来计算每个节点的平均消耗能量：\n\n$$\n\\text{Average\\ Energy\\ Expended\\ per\\ node}\
  \ = \\frac{\\begin{array}{l} \\text{Total\\ energy\\ spent\\ for\\ all\\ the} \\\
  \\ \\text{activities\\ by\\ all\\ nodes} \\\\ \\end{array}}{\\text{Total}\\\\,\\\
  text{number}\\\\,\\text{of}\\\\,\\text{nodes}}\n$$\n\n(6.1)\n\n### 6.2.3 自适应路由协议的性能评估\n\
  \n在图 6.2 至 6.4 中，我们分别展示了针对类型 1 流量的每种缓冲区管理策略的 `MDR`。首先，从三个具有不同缓冲区管理策略的图中可以得出通用结论：很容易观察到，对于任何给定的缓冲区大小，自适应协议在所有情况下\
  \ `MDR` 都优于泛洪协议和 `PRoPHET` 协议。这证实了我们的假设：通过使用历史信息，我们可以选择最佳未来转发者以获得更高的 `MDR`。\n\n\
  ![](img/fig6.2.jpg)\n图 6.2\n仅使用丢弃缓冲区管理策略时，类型 1 流量的 `MDR`。\n\n![](img/fig6.3.jpg)\n\
  图 6.3\n使用 `MOFO` 缓冲区管理策略时，类型 1 流量的 `MDR`。\n\n![](img/fig6.4.jpg)\n图 6.4\n使用 `SHLI`\
  \ 缓冲区管理策略时，类型 1 流量的 `MDR`。\n\n我们可以清楚地观察到，正如预期，三个预测性为 90%、连通性为 50% 的测试用例表现均优于预测性为\
  \ 50%、连通性为 50% 的情况。显然，90% 的预测信度确实会获得更高的 `MDR`。值得注意的是，在相同的运行条件下，泛洪路由协议实现的 `MDR` 高于\
  \ `PRoPHET` 路由协议。我们还观察到，自适应和泛洪路由协议的 `MDR` 都高于 `PRoPHET` 协议。\n\n**表 6.2**\nChen 等人（2002）提出的\
  \ `Tx`（传输）、`Rx`（接收）、空闲和睡眠模式下的功耗\n\n![](img/T6.2.jpg)\n\n从图 2.2 至 2.4 中，我们还可以观察到\
  \ `MOFO` 策略在 `MDR` 方面优于 `NOPO` 和 `SHLI` 策略。当发生拥塞时，`MOFO` 策略确保缓冲区中历史转发次数最少的消息保留，而转发次数最多的消息从缓冲区中剔出。这使得转发最少的消息更容易到达目的地。根据生存时间（TTL）值剔除消息的\
  \ `SHLI` 策略性能与 `NOPO` 策略相似。\n\n### 6.3 带拥塞避免自适应路由协议\n\nKathiravelu 等人（2010）描述的协议根据每个节点过去的接触历史，启发式地估计每个节点的预测性和连通性这两个值，然后对消息做出转发决策（Kathiravelu\
  \ 等，2010；Lakkakorpi 等，2010）。该协议假设，当所选转发者接收到上述描述的消息时，它将有足够的存储空间来容纳这些消息，并尽力转发它们（Kathiravelu\
  \ 等，2010）。\n\n这可能导致一种情况：少数节点必须将其大部分资源分配给其他节点，以提高消息的整体交付率。即使自适应路由协议考虑了距离目的地剩余跳数和到达特定目的地的概率等属性，某些节点仍可能变得更受欢迎，并且必须投入宝贵的资源（如电池电）进行相互转发。这是因为到目前为止的启发式方法没有关注节点在其他节点中如此受欢迎的位置。这最终导致热门节点丢失大量消息，并导致最终消息交付的下降。避免拥塞的典型\
  \ MANET 方法在节点未准备好接收此类消息时直接丢弃到达的消息，导致消息在传输过程中丢失（Sharma 和 Bhadauria, 2011；Jain 等，2012）。\n\
  \n当节点过载时，它们采用缓冲区管理策略来避免拥塞并容纳新消息。结果是大量消息在传输过程中丢失。在机会性网络中，由于源节点和目的节点之间的链路层没有有效的反馈路径，源节点通常无法感知中间节点的拥塞和消息丢失。拥塞的节点经常拒绝接收，结果导致网络出现分区。因此，基于端到端连通性的典型方法适用于机会性网络。在我们的实验研究中，我们观察到避免拥塞的方法影响了网络的整体性能。我们还观察到需要一种更好的、受控制的方法来避免拥塞。\n\
  \n#### 6.3.1 拥塞感知自适应路由协议\n\n我们提出的 `CAARP` 在做出转发决策时，考虑了节点接收消息所需的缓冲区空间。在缓冲区空间有限的节点中，必须决定接受哪些消息进行转发。如果到达的消息在到达目的地之前还需要经过更多跳数，则将根据优先顺序进行处理。\n\
  \n一条消息已经转发了多次，意味着该消息已经到达目的地或更接近目的地。相反的建议是，将此类消息放在列表末尾并赋予较低优先级不会对消息传递产生多大伤害（Lindgren\
  \ 和 Phanse, 2006）。我们持有反对意见。已经转发多次的消息可以以优先的方式收纳在缓冲区中。`MOFO`（优先剔除转发最多的数据包）方法采用了这种策略，该方法的效果在\
  \ Lindgren 和 Phanse（2006）中进行了讨论。\n\n\n\n\n当节点相互接触时，会交换摘要向量，该向量包含节点根据其拥塞避免策略愿意接受的消息列表列表。发送节点将相应地从其缓冲区中提取若干消息转发到接收节点。接收节点将保留那些需要通过其他节点转发到最终目的地的消息，直到遇到合适的转发者；同时，转发那些可以立即发送的消息。\n\
  \n当节点接收到一条消息时，如果缓冲区占用率小于总空间的 50%，则将无任何问题地接受该消息（Lakkakorpi, 2011）。如果缓冲区中的可用空间大于 50%，则将启用拥塞避免算法来决定将哪些消息存储在缓冲区中。拥塞避免算法首先考虑节点自身生成消息的速率。如果缓冲区可用空间小于安全阈值，该算法将优先考虑这些消息，且如果阈值仍被超过，算法将仅允许无法立即转发的节点或节点自身的消息占用缓冲区（见图\
  \ 6.5）。\n\n![](img/fig6.5.jpg)\n\n图 6.5\n\n自适应路由协议的消息投递机制。\n\n当占用的缓冲区空间小于 50% 但高于安全阈值时，拥塞避免算法决定接纳需要经过多跳才能到达其各自目的地的消息。如果占用空间低于阈值，则只接受自身的消息。由于每个节点都维护着前文描述的路由表，该算法能够确定哪些消息将被接受。\n\
  \n算法 6.4 和 6.5 阐述了当节点剩余缓冲区空间小于总空间的 50% 时，拥塞避免是如何运行的。每个节点列出其认为相遇概率更高的节点，并向其邻居通告。此类公告的接收者不应向发送者转发任何到达目的地概率不高的消息。算法\
  \ 6.4 阐述了节点如何通知其邻居自身的拥塞情况，并停止从邻居处接收更多消息。算法 6.5 阐述了消息发送者如何准备一个消息列表，发送给已表示意愿接收消息的邻居。我们提出的拥塞避免方法已整合到自适应路由协议中。改进后的协议命名为拥塞感知自适应路由协议，它完全整合了算法\
  \ 6.4 和 6.5 中描述的功能。\n\n![](img/T6.2a.jpg)\n\n通过仿真比较了 CAARP 与流行病（epidemic）、PRoPHET\
  \ 和 HiBOP 路由协议在低中等拥塞下的性能（Vahdad and Becker, 2000; Lindgren et al., 2003; Boldirini\
  \ et al., 2007）。\n\n通过仿真比较了所提出的连接模型，该模型用于模拟固有的机会性网络特性（Kathiravelu et al., 2006,\
  \ 2009）。\n\n![](img/T6.2b.jpg)\n\n### 6.3.2 结果与讨论](#chapter5.xhtml#re_ch-5-sec-11)\n\
  \n图 6.6 展示了在 50P50C 和 90P50C 情况下自适应协议和 CAARP 的 MDR（消息丢失率）。可以观察到当缓冲区大小为 100 时，CAARP\
  \ 的性能优于自适应协议，但在缓冲区较较小时，自适应协议的性能更好。\n\n![](img/fig6.6.jpg)\n\n图 6.6\n\n自适应路由协议与 CAARP\
  \ 的 MDR 比较。\n\n另一个有趣的观察结果是，当缓冲区较较小时，在 50P50C 和 90P50C 情况下，CAARP 的 MDR 非常低。这是因为 CAARP\
  \ 分配了至少一半的缓冲区空间来存储自身的消息，之后才会考虑从邻居处接收的消息。\n\n当缓冲区大小明显较小时，MDR 变得很低。为了研究这种影响，将缓冲区大小从\
  \ 1 变化到 20，并研究了自适应协议和 CAARP 的行为。从图 6.7\n\n图 6.7\n\n缓冲区大小较小时，自适应路由协议与 CAARP 的 MDR\
  \ 比较。\n\n图 6.8 展示了自适应（Kathiravelu et al., 2009）、我们提出的 CAARP、流行病（Vahdad and Becker,\
  \ 2000）、PRoPHET（Lindgren et al., 2003）以及 HiBOP（Boldirini et al., 2007）路由协议的 MDR。可以明显观察到，当缓冲区大小增加时，CAARP\
  \ 的 MDR 剧增。对于所有其他协议，MDR 大多数随缓冲区大小保持不变。\n\n![](img/fig6.8.jpg)\n\n图 6.8\n\nCAARP\
  \ 与自适应、PRoPHET、HiBOP 和流行病路由协议的 MDR 比较。\n\n总之，在本章中，我们提出、设计并开发了 CAARP，它可以在机会性网络环境中表现得更好。所提出的协议性能优于该领域的知名协议，特别是在缓冲区较大时。作为该领域的未来探索，我们预见将开发出整合机会性网络特性（如机器学习）的更先进的协议。参考文献\n\
