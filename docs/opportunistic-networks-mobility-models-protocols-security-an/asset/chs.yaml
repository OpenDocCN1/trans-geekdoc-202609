  \ (CL EE)\n#### 5.7.3.4 传感器上下文感知自适应占空比无信标机会性路由 (SCAD)\n\n## 5.8 结论\n\n## 参考文献\n\
  ## 5.1 引言\n机会性网络 (`OPN`) 是一种不需要预定义路径的移动自持网络 (`MANET`)。基于这些考虑，路由协议被分为六大类：\n\n1. 基于地理位置\n\
  2. 链路状态\n3. 上下文感知\n4. 概率\n5. 基于优化\n6. 跨层\n\n引入这些路由协议的目的是为设备提供地理位置信息。\n\n（图 5.1：路由协议分类）\n\
  \n### 5.2.1 基于竞争的转发 (CBF)\nCBF 是一种专为车载自持网络 (`VANETs`) 设计的地理路由协议（Füßler, Käsemann,\
  \ Mauve & Hartenstein）。每个节点包含其前一跳、目的地 ID 和数据包 ID。如果接收到的节点不是最终目的地，则数据包应再次转发。\n\n\
  节点 `n` 的包进度计算如下：\n\n```\nP[n] = dist(l, d) - (n, d)\n```\n\n其中 `dist` 是欧几里得距离；`l`\
  \ 和 `d` 分别是它的最后一跳和目的地。\n\n定时器值计算如下：\n\n```\nt = {\n  \\begin{array}{l}\n    \\tau(1\
  \ - R_n/R_{max}), 0 \\leq R_n < R_{max} \\\\\n    \\infty, \\text{otherwise}\n \
  \ \\end{array}\n}\n```\n\n`R[max]` 是最大射电范围；`R[n]` 是节点 `n` 的范围；`τ` 是最大转发延迟；根据 `t`\
  \ 的值，可以确定参与者的数量。如果是无穷大，则数据包被丢弃；否则，将在 `t` 秒后转发，除非被相同 ID 的节点截获。在这种情况下，定时器将被取消。\n\n\
  ### 5.2.2 地理随机转发 (GeRaF)\n这种由 B.S. Raj 等人提出的路由协议是一种完全独特的转发技术，它由地理位置和中继节点的随机选择支持。该协议提出了一种贪婪地理算法。由于其强大性和可量化性，它在无线设备网络中非常有吸引力。然而，贪婪地理路由会导致路由模型过长，并且在随机网络拓扑中可能效果不好（Raj,\
  \ Naveenraj & Gopinath, 2015）。\n\n### 5.2.3 地理机会性路由 (GOR)\n\n\n\n\nGOR 是地理路由与机会性路由的结合。地理路由的优势在于不需要维护任何路由表，它仅根据邻居节点做出决策。机会性路由始终优于传统路由（TR）。GOR\
  \ 分析了可靠性、数据包推进与介质访问控制（MAC）协调时间成本之间的权衡。引入了一种名为“期望单跳吞吐量”（EOT）的局部参数，以平衡所有因素。必须实现最大\
  \ EOT（Zeng, Lou, Yang & Brown, 2007）。实现最大 EOT 的理念源于于一点：\n\n1. 由于全条路径的可实现吞吐量小于每跳吞吐量，如果我们使\
  \ EOT 最大化，那么吞吐量极有可能增加。\n\n对于一个给定的候选集\n\n$$R(M_{j}) = L_{p} \\ast \\frac{Y \\ast\
  \ X}{{\\overline{P}}_{M}t_{r} + Z \\ast X}$$  \n\n这里 $X = \\pi_{w = 0}^{i - 1}\\\
  overline{P}_{jw},Y = {\\sum_{\\text{i} = \\text{1}}^{\\text{r}}{a_{ji} \\ast p_{ji}}}\\\
  ,\\text{and}\\,, Z = {\\sum_{\\text{i} = \\text{1}}^{\\text{r}}{t_{i} \\ast p_{ji}}}$\n\
  \n$$P_{M}\\operatorname{} = \\pi_{i = \\text{1}}^{r}\\left( {\\text{1} - P_{i}}\
  \ \\right),{\\overline{P}}_{jw} = \\left( {\\text{1} - P_{jw}} \\right)\\,\\text{and}\\\
  ,, t_{i} = T_{s} + T_{f}\\left( i \\right)$$  \n\n$M[j] = \\{S[j1],\\dots,S[jr]\\\
  }$ 是 $M$ 中一组具有优先级的有序节点。\n\n2. 路径延迟是每跳延迟之和，即由传输数据包和候选协调引起的实际延迟。由于每跳延迟因素（`T[s]`和`Tf`）组合在一起，`t[i]`\
  \ 位于分母中，因此随着延迟的减少，吞吐量随之增加。\n\n3. EOT 同样考虑了数据包推进因素；因此通过增加潜力，我们可以减少跳数，从而减少消息干扰和延迟。\n\
  \n我们通过计算一个上界来了解其凹性，这表明即使我们引入大量的转发候选者并增加了数据包更接近目的地的概率，所获得的收益也只是微乎其微。\n\n### 5.2.4\
  \ 多速率地理位置机会性路由 (MGOR)\n\nK. Zeng 等人对干扰、多速率、候选者选择和优先级排序对最大化吞吐量的影响进行了全面研究。考虑到无线干扰和机会性路由（OR）的独特属性，他们提出了“并发传输器集”的概念，以展示\
  \ OR 传输冲突施加的限制，并将最大端到端吞吐量问题表化为最大流线性规划。引入了两个多速率 OR 参数：i. 期望介质时间（EMT）和 ii. 期望推进速率（EAR），以及它们对应的本地速率分布。至于候选选择方案，其中一种是最小介质时间机会路由（LMT\
  \ OR），另一种是多速率地理位置机会性路由（MGOR）。在仿真中，MGOR 的性能优于 GOR（Zeng, Lou & Zhai, 2008）。\n\n###\
  \ 5.2.5 辅助机会性路由 (LAOR)\n\n无线信道的路由是一项挑战。GOR 通过利用广播特性和使用网络拓扑的空间多样性被设计为能良好处理不稳定传输。由于\
  \ GOR 不支持多通道，因此设计了 LAOR（Zeng, Yang & Lou, 2009）。相对于 GOR，LAOR 考虑了候选选择、优先级和协调。LAOR\
  \ 提出了一种名为“期望单跳吞吐量”（OEOT）的局部参数，以定义单跳数据包推进与数据包转发时间之间的权衡。基于本地速率适应和候选选择算法提出了不同的算法来优化网络。经过严格的仿真，结果表明，结合了速率适应和候选选择的多速率\
  \ GOR 优于 GOR。MGOR 与单速率 GOR 相比，具有高交付率和低延迟，性能优异。\n\n### 5.2.6 基于位置的机会性路由 (POR)\n\n\
  S. Yang 等人提出了一种名为 POR 的新颖协议。它考虑了无线信道广播特性的完整收益以及机会性转发。数据包通过多个转发器转发到组播。利用本地信息在数据包头中插入一个预定义列表，数据包沿给定方向移动。冗余性和随机性使其更高效、更稳健。POR\
  \ 的开销忽略不计且具有更好的扩展性。这里产生的主要成本是由于计算资源的增加，因为许多数据包被转发到上层。它需要大量的缓冲区空间，但如果合理利用时隙，就可以减少缓冲区的使用。POR\
  \ 不仅在正常情况下表现良好，在不利环境下运行良好（Yang, Zhong, Yeo, Lee & Boleng, 2009）。\n\n### 5.2.7 拓扑与链路感知的机会性路由\
  \ (TLG OR)\n\nOR 利用无线传输的广播特性和空间多样性来提高自组织网络的性能（Zhao, Rosario, Braun, Cerqueira, Huang\
  \ 2013）。在大多数现有协议中，设置了预定义路径并允许节点遵循该路径。相反，OR 让接收方可以选择下一跳，通过让多个接收方协调并决定哪一个是更好的转发者。TLG\
  \ OR 使用网络拓扑、链路质量和地理位置等网络指标进行操作。TLG OR 在服务质量（QoS）和体验质量（QoE）方面表现良好。\n\n### 5.2.8 链路质量与地理感知的机会性路由\
  \ (LinGo)\n\n物联网（IoT）对安全和环境监控多媒体应用有巨大影响，这些应用旨在减少应急响应时间并用于预测危险事件。在这种场景下，OR 允许以分布式方式（即逐跳方式）路由，而不是基于预定义的端到端路径，后者并不是可靠的解决方案。这使得监控对象在物联网平台上支持\
  \ QoE 的视频传输。现有模型在候选选择上仅考虑了单一指标，包括链路质量或地理信息，这可能导致高丢包率并降低用户的视频感知。提出的 LinGo 是一种跨层链路质量感知和地理感知的机会性协议（Rosario,\
  \ Zhao, Braun, Cerqueira, Santos & Li, 2013）。它是为移动物联网平台的视频传输设计的。LinGo 通过考虑链路质量、地理位置和能量等多个指标改进了路由。与现有模型相比，LinGo\
  \ 在 QoE 方面取得了更好的结果。\n\n\n\n在传感器网络中，稳定且可靠的路由是一个至关重要的问题。为了解决这个问题，实施了运行 `Tiny OS` 的\
  \ `mica2` 节点。在 `DTRP` 中，对节点进行了测试以获得更好的结果（Nassr, Jun, Eidenbenz, Hansson & Mielke,\
  \ 2007）。`DTRP` 是一种多路主动路由协议，专门用于提高网络的可扩展性和可靠性。`DTRP` 基于信标消息，这些消息定期由汇聚节点产生，并由传感器节点在整个网络中进行泛洪。与其他的单路径距离矢量路由协议不同，信标消息并不用于确定目的地的下一跳节点。相反，它们用于确定汇聚节点与传感器节点之间的跳距离值。文中做了一些假设，例如，当任何数据到达节点时，它知道从源节点到目的地（汇聚节点）的跳数，同时也知道自己与目的地之间的跳距离（该距离从信标中获得）。第三条信息，即源节点与到达节点之间的跳数，可以从数据包头\
  \ easily 获取。\n\n三个值 `d [1]`、`d [2]` 和 `d [3]` 描述如下：\n\n- `D [1]`：源节点到目的地之间的最短路径跳数距离（从信标包中获得）\n\
  - `D [2]`：数据包到达某个节点之前传输的跳数距离（从数据包头中获得）\n- `D [3]`：中继节点与目的地之间的最短路径跳数距离。\n\n利用这三条信息，节点会决定是否再次泛洪。\n\
  \n```\nP^(t*r) = e^(m*α)\n```\n\n`α = d[1]–(d[2]+d[3])` 且 `m` 是一个可调参数。通常假设 `m ≥\
  \ 0`，如果 `m = 1`，则场景等同于全泛洪。\n\n### 5.2.11 动态自组网络中的机会路由 (OPRAH)\n\n听到任何其他参与者的流量被称为干扰。这是路由过程中的一个主要问题，但在大多数情况下被忽略了。路由协议主要有两种：\n\
  \n1. **响应式（Reactive）**：它尝试仅在连接时识别路由路径。\n2. **主动式（Proactive）**：它尝试在连接之前识别节点之间的连接并存储路由表信息。\n\
  \n响应式和主动式协议在 `OPRAH` 中的工作原理相似；它们都尝试识别持续时间更长的路由。经过大量的仿真，结果显示 `OPRAH` 能够持续找到更短的路径，平均长度为按需距离矢量\
  \ (`AODV`) 路径的 77%（Westphal, 2006）。\n\n### 5.2.12 移动自组网络中的协作机会路由 (CORMAN)\n\nZ.\
  \ Wang 等人提出了一种名为 `CORMAN` 的新型路由协议。在开展研究利用无线信道的特性之前，无线信道的链路质量一直是数据传播的主要问题。链路质量是一个在不同地理区域发生剧烈变化的因素。链路质量的变化与无线信道的广播特性结合为研究提供了新的领域，并被称为协作通信。`CORMAN`\
  \ 是极端机会路由 (`ExOR`）的扩展，以满足节点移动性的需求（Wang, Chen & Li, 2012）。这些是 `CORMAN` 的基本组件：\n\n\
  1. **PSR（主动源路由）**：它为每个节点提供关于网络中其他节点的完整知识。\n2. **大规模实时更新**：随着数据包的传输，如果发生任何拓扑变化，列为转发器的节点可能会发生变化。\n\
  3. **小规模重传**：如果认为有帮助，某些不在列表中的节点也被用于数据的重传。\n\n这 3 个参数均用于实现高效的协作通信。\n\n### 5.2.13\
  \ 跨层链路质量与感知机会路由 (XLinGo)\n\n由于其性质，`FANETs` 必须准备好应对任何类型的变化。为此，提出了 `XLinGo`（Rosario,\
  \ Braun, Cerqueira, Alyafawi, 2014），它改进了 `FANETs` 中的并发流传输。`XLinGo` 依赖于性能指标，如跨层路由决策，支持多跳的鲁棒性。结果表明，`XLinGo`\
  \ 在支持 QoE 的情况下可以实现更好的多跳数据分发。\n\n### 5.2.14 拓扑辅助机会路由 (To Go)\n\n拓扑信息最近被用于改进车载网络中的地理路由。由于其不可靠的性质，拓扑辅助地理路由是一项挑战。在这里，对传统的地理路由进行了研究，以解决不可靠网络的问题（Lee,\
  \ Lee & Gerla, 2010）。引入了 `To Go`，它将拓扑辅助地理路由与转发算法相结合，例如确定目标节点的节点预测算法 (`NPA`)、获取候选转发集的转发选择算法\
  \ (`FSS`) 以及基于距离计时器的调度器。候选集使用增强拓扑知识进行选择。仿真显示，`To Go` 的性能优于不使用拓扑的地理路由协议。\n\n## 5.3\
  \ 链路状态感知\n\n接下来，我们考虑通过考虑交付概率来解决网络可靠性的路由协议。在每个节点对数据进行分析以确保高传输率。\n\n#### 5.3.1 无线网络机会多跳路由\
  \ (ExOR)\n\n`ExOR` 是一种集成路由和 MAC 的协议（Biswas and Morris, 2004）。与其他协议不同，`ExOR` 会检查消息发送路径的每一跳。它检查中间节点是否接收了消息。\n\
  \n在 `ExOR` 中，并不是所有节点都被选择传输数据包。只选择了少数最佳节点并对它们进行排序；根据优先级，优先级最高的节点首先通信。`ExOR` 面临四个主要问题：\n\
  \n1. 节点应该对哪些子集接收了数据包达成一致。由于一致包含通信，应确保一致协议不会产生任何开销。\n2. 在所有接收数据包的节点中，距离目的地*最近*的节点必须转发数据包。\n\
  3. 从大型密集网络中仅选择潜在的转发者，因为参与者过多会增加一致成本。\n4. 为了避免冲突，应避免同时传输。\n\n`ExOR` 以批格式运行。列出最佳节点并根据预期的目的地成本进行排序。在实时情况下，结果令人印象深刻，提升了\
  \ 2%–4%。\n\n#### 5.3.2 Economy：一种无重复机会路由\n\n\n\n\nOR（机会路由）性能优于传统路由，但消息的复制会导致 OR\
  \ 产生问题。`Economy` 是一种无重复协议（Hsu, Liu & Seah, 2009）。它为所有数据包分配一个令牌。在 `Economy` 中，每个节点都拥有一个数据包缓冲区和一个\
  \ `ACK manager`。`ACK manager` 记录已接收或发送的数据包列表，以避免重复。当节点接收到数据包时，该节点会检查令牌是否存在。如果令牌存在，则丢弃该数据包，否则对其进行处理。\n\
  \n令牌实际上是一个包含源地址和确认信息的控制包。这里我们有两种类型的确认：\n\n1. `Cumulative ACK`（累积确认）：直到此数字之前的所有序列号（`SN`）都必须已经被确认。\n\
  2. `Discrete ACK`（离散确认）：在 `SN` 列表中但不在范围内的某一个。\n\n令牌的传递方式是为了确认发送者并告知其数据包已到达目的地。因此，令牌传递从目的地开始并传递到源端。`Economy`\
  \ 的性能优于 `ExOR`。\n\n### 5.3.3 MAC 独立机会性路由 (MORE)\n\n`ExOR` 使用 `MAC` 结合路由来限制路由器对介质的访问，尽管\
  \ `ExOR` 并没有使用 `802.11 MAC` 的完整功能。它防止了空间复用，因此可能无法充分利用资源。`MORE` 以一种自然的方式将机会性路由和网络编码（`NC`）结合，提供了无需节点协调的机会性路由（Chachulski,\
  \ Jennings, Katti & Katabi, 2007）。\n\n`MORE` 是一种 MAC 独立的协议，它随机混合所有数据包。随机性确保了数据包一旦被听到就不会再被听到，以避免重复。`MORE`\
  \ 不需要任何特殊的调度即可与路由器通信，并直接运行在 `802.11` 上。`MORE` 相比传统的优先机会性路由协议实现了更高的吞吐量。\n\n### 5.3.4\
  \ Code OR：分段网络编码无线网格网中的机会性路由\n\nY. Lin 等人提出了 `Code OR`。在 `NC` 的帮助下，`OR` 可以以较低复杂度实现。`NC`\
  \ 执行分段 `NC`，通过将数据划分为若干段并逐一发送。在需要对一个数据集进行确认之前，不会发送另一个。这导致了性能受到影响。正因如此，设计了 `Code OR`，它通过合理利用带宽并行传输多个分段的数据集。如果数据包较小且窗口大小较大，`Code\
  \ OR` 在现实场景中表现良好（Lin, Li & Liang, 2008）。\n\n### 5.3.5 Slide OR：无线网格网中的在线机会性网络编码\n\
  \n使用 `NC` 可以以一种简单且 Practical 的执行机会性路由。由于某些问题，使用 `NC` 的协议需要分为多个段，并仅对同一段内的包进行编码。然而，要知道下一段何时传输的精确时间具有挑战性。为了克服这个问题，设计了\
  \ `Slide OR`（Lin, Liang & Li, 2010）；它对源包进行编码并滑动方式放置，使得一个窗口的编码包可以用于解码另一个窗口的源包。`Slide\
  \ OR` 优于现有的多段模型。\n\n### 5.3.6 XCOR（协同交流网络编码与机会性路由）\n\n`OR` 和 `NC` 各有其优势。`Interflow\
  \ NC` 预计在高度丢真环境中性能增益较差，而 `OR` 预计会有高性能增益。相反，随着网络中流数量增加，`OR` 的增益减少，而 `interflow NC`\
  \ 具有高增益。\n\n出于此原因，并且即使在流数量增加时 `NC` 的表现更好，产生了一个将 `OR` 和 `NC` 结合的想法，称为 `XCOR`（Koutsonikolas,\
  \ Hu & Wang, 2008）。出于此原因，并且由于 `NC` 即使在流数量增加时表现更好，产生了一个将 `OR` 和 `NC` 结合的想法，称为 `XCOR`（Koutsonikolas,\
  \ Hu & Wang, 2008）。\n\n1. 应该采取措施以避免重复传输。\n2. `Interflow NC` 假设了固定路径，而 `interflow\
  \ NC` 具有高增益。\n\n由于此，且由于由于，`OR` 这种集成似乎是不可行的，因为 `OR` 缺乏关于下一跳的信息。\n\n关于 `OR` 或 `NC`\
  \ 哪个能提供更好的吞吐量没有明确答案，取决于指定的网络拓扑和流量。\n\n### 5.3.7 累积确认 (CCACK)\n\nD. Koutsonikolas\
  \ 等提出了 `CCACK`。它基于网络编码工作，这显著简化了路由协议的设计。然而，基于 `NC` 的协议面临许多问题，例如一次发送多少编码包。为了避免消息开销，启发式地计算了传输次数。`CCACK`\
  \ 允许节点确认，这在 `802.11 WMN` 测试平台上进行了测试。`CCACK` 优于 `MORE`（Koutsonikolas, Wang, 2010）。\n\
  \n### 5.3.8 O3：基于覆盖的机会性路由\n\n一种使用 `interflow NC` 进行机会性路由的新方法已被解释（Han, Bhartia, Qiu\
  \ & Rozner, 2011）。其独特之处在于减少了端到端延迟。但机会性路由使用 `intraflow NC`，减少信息的扩散，从而最小化。为了应对这一挑战，最初将机会性路由和\
  \ `interflow NC` 解耦，并提出了一种无需担心丢包的覆盖方案。其次，底层网络使用优化的机会性路由以及速率限制来提供高效可靠的覆盖链路。基于此模型，设计了一种算法，联合优化机会性路由、速率限制、交流和内流。使用了\
  \ `QualNet` 仿真工具，结果显示：\n\n1. 速率限制改进了路由的性能。\n2. `OR` 在高丢包率下受益，而 `interflow` 在低丢包率下受益。\n\
  3. `O3` 显著优于先进的路由协议。\n\n### 5.3.9 无线网格网简单机会性自适应路由协议 (SOAR)\n\n由于网络不可靠且不可预测，传统路由无法提供更好的性能。提出了支持\
  \ `WMN` 同时流的 `SOAR`（Rozner, Seshadri, Mehta & Qiu, 2009）。它通过四个主要组件获得高吞吐量和公平性：\n\n\
  1. 利用路径多样性的自适应路径选择应该能减少重复传输。\n2. 使用优先级定时器转发来选择转发数据包的最佳节点。\n3. 本地丢失恢复应该高效地检测并重传丢失包。\n\
  4. 自适应速率控制的确定应适用于网络状况。\n\n`SOAR` 在各种场景下显著优于传统路由、`ExOR` 和经典的机会性路由协议。\n\n### 5.3.10\
  \ 机会性任意路径转发 (OAPF)\n\n与有线网络不同，无线网络由于网络波动无法建立对点链路。链路质量的波动会导致链路层重传数据包。`OAPF` 预先选择一组候选下一跳，并使用其中任何一个来转发数据包（Zhong,\
  \ Wang, Nelakuditi & Lu, 2006）。\n\n\n\n路由候选者的选择和数据包的排序是需要解决的主要问题。与 `ExOR` 类似，候选者的选择和排序是基于候选节点到目的地之间的最佳路径预期传输次数（`ETX`）。并不是所有节点都会被考虑；只有少数最佳节点会被选中作为转发候选者。这避免了冗余、拥塞和干扰。被选中并排序的候选者并不保证采用任何\
  \ anypath 转发。为了解决这种情况，引入了一种名为预期 anypath 传输（`EAX`）的新指标，它针对一对节点，可以捕捉它们在到达目的地之前之间的预期跳数。候选者的选择和排序是针对\
  \ `EAX` 进行的，以获得更好的结果。\n\n## 5.4 上下感知\n\n由于机会性网络的动态性质以及对节点信息的匮乏，机会性网络中的路由成为了一项挑战。在某些情况下，诸如相遇历史或预定义路径等信息可能会被馈给网络。这被称为上下文感知。\n\
  \n### 5.4.1 部分上下文感知\n\n网络对网络中的节点仅有部分了解。\n\n#### 5.4.1.1 基于相遇历史和传递性的概率路由协议 (PRoPHET)\n\
  \nA. Lindgren 等人提出了一种基于传输历史的概率路由协议。文中提出了一种名为递送预测性（delivery predictability）的指标。根据某些阈值，递送预测性大于阈值的节点被认为是最佳节点。只有这些节点被用于转发数据包（Lindgren,\
  \ Doria & Schelén, 2003）。\n\n```\nP[(a, b)] = P[(a, b)old] + (1−P[(a, b)old]) *\
  \ P[init] where P ε [0,1]\n```\n\n这被用于计算递送预测性。在 `PRoPHET` 中，下一跳的选择取决于递送预测性。递送预测性越高，该节点作为下一个转发者的概率就越大。`PRoPHET`\
  \ 还考虑了老化机制（aging）和传递性。如果任何节点长时间没有转发数据，它就会老化并被赋予低优先级。传递性是指节点 `a` 频繁遇到节点 `b`，而节点 `b`\
  \ 又频繁遇到节点 `c`，那么节点 `c` 很有可能是通往节点 `a` 的良好转发者。\n\n#### 5.4.1.2 MaxProp\n\n由于网络的断裂（动态性质），延迟容忍网络（DTN）路由是一项巨大的挑战。`MaxProp`\
  \ 是一种旨在有效路由 DTN 消息的路由协议（Burgess, Gallagher, Jensen & Levine, 2006）。`MaxProp` 基于优先级工作；它对待传输的数据包和丢弃的数据包都进行排序。这些优先级基于路径概率和历史相遇。当两个节点发现彼此时，以下是交换数据包的步骤：\n\
  \n1. 所有消息都传输到邻居节点。\n2. 将路由信息（如相遇概率和向量列表）与邻居节点共享。\n3. 通过递送的数据给予确认。\n4. 遵循最短路径或在网络中移动得不远的节点被赋予优先级。\n\
  \n在对 30 辆巴士进行为期 60 天的测试后，结果表明 `MaxProp` 的性能优于其他调度对等节点（节点）会面的协议。\n\n#### 5.4.1.3\
  \ MobySpace 路由\n\nDTN 中的路由由于其动态性是一项挑战。然而，如果我们考虑到有关节点移动性的知识优势，路由就可以从中受益。Leguay, Friedman\
  \ 和 Conan (2006) 用一种通用算法阐述这个问题，该算法利用名为 `MobySpace` 的高维欧几里得空间。`MobySpace` 根据节点访问每个可能位置的频率对其进行评估。与其他算法相比，`MobySpace`\
  \ 良好，特别是当节点路由具有高连接时间时。因此，同质化程度对路由有巨大影响（Burgess, Gallagher, Jensen & Levine, 2006）。\n\
  \n#### 5.4.1.4 Bubble Rap\n\n为了了解人类移动的社交模式，提出了一种针对口袋网络（PSNs）的转发算法，称为 `Bubble Rap`（Hui,\
  \ Crowcroft & Yoneki, 2011）。它结合了社区结构和节点中心性的知识来做出路由决策。\n\n该算法背后有两个直觉：\n\n1. 人具有不同的角色，即先处理热门节点，然后是其余。\n\
  2. 了解社交生活，即将其作为中继。\n\n这被称为泡泡转发。\n\n该算法包含几个假设：\n\n1. 每个节点必须且应该是一个社区的一部分。可能存在单节点社区。\n\
  2. 每个节点在整个网络中有一个全局排名，在社区内有一个本地排名。如果一个节点属于多个社区，它可能有多个本地排名。\n\n`Bubble Rap` 的转发如下：当节点有消息要转发时，根据其排名向上泡泡直到到达目的地。一旦消息递送，原始者（源）必须从缓冲区中删除。\n\
  \n#### 5.4.1.5 PRoPHET+: 基于 PRoPHET 的适应路由\n\n`PRoPHET+` 是 `PRoPHET` 的扩展（Huang, Lee\
  \ & Chen, 2010）。`PRoPHET+` 旨在最大化消息递送率并最小化节点延迟。它使用加权函数评估递送值，这些缓冲区大小、流行度和 `PRoPHET`\
  \ 的预测值。`PRoPHET+` 的权重是基于定性考虑的。如果合理考虑逻辑权重，`PRoPHET+` 可以优于 `PRoPHET`。\n\n#### 5.4.1.6\
  \ 意图 DTN 路由资源分配协议 (RAPID)\n\n现有路由协议主要关注在有限知识下寻找路径，但这些方法对路由指标可能仅产生偶然影响。`RAPID` 是一种意图路由协议，专门提升特定路由指标的性能（Balasubramanian,\
  \ Levine & Venkataramani, 2007）。`RAPID` 将 DTN 路由视为资源分配问题，并通过带内控制通道传播元数据。此外，DTN 路由协议缺乏足够的信息；即使存在足够的信息，最优性也是一个\
  \ NP 问题。在测试平台上的严格仿真显示，`RAPID` 的收益优于现有协议。\n\n### 5.4.2 完全上下文感知\n\n完全上下文感知不仅有助于利用信息，而且通过使用上下文信息提供帮助。\n\
  \n#### 5.4.2.1 上下文感知路由 (COR)\n\nZ. Zhao 等人提出了 `COR` 协议。普通的列表有很多限制。为了避免这种情况，设计了 `COR`。`COR`\
  \ 以三个步骤工作：\n\n1. 考虑地理进度、链路质量和剩余能量等上下文信息做出路由决策。\n2. 所有合格节点都被用于数据转发。\n3. 利用节点的相对移动性进行进一步连接。\n\
  \n\n\n\n\n在 COR 中，假设每个节点都能通过 `GPS` 等设备获知其地理位置。每个节点根据可用的上下文信息计算其动态转发延迟 (`DFD`) (Zhao,\
  \ Rosario, Braun & Cerqueira, 2014)。为了体现上下文的重要性，公式中引入了权重。\n\n```\nDFD = (*α*\\**L*[*Q*]+*β*\\\
  *Progress+ↆ*γ*\\**R*[*E*]+*δ*\\*Live) \\* DFD[max]\n```\n\n| |\n| --- | --- |\n\
  `α`, `β`, `γ`, `δ` 是权重系数，总和为 1，即 `α + β + γ + δ=1`。`DFD[max]` 是允许每个节点的最大延迟。`L [Q]\
  \  = 链路质量`，`R [E]  = 剩余能量`。\n\nCOR 的性能优于仅使用单一指标的协议。\n\n```\n$$L_{Q} = \\left\\{\
  \ \\begin{array}{l} {0\\text{if}L_{Q}I_{t} > L_{Q}I_{\\text{Good}}} \\\\\\\\ {{\\\
  frac{L_{Q}I_{\\text{max}} - L_{Q}I_{2}}{L_{Q}I_{\\text{max}}}}\\text{if}L_{Q}I_{\\\
  text{Bad}} < L_{Q}I_{t} < L_{Q}I_{\\text{Good}}} \\\\\\\\ {1\\text{if}L_{Q}I_{t}\
  \ < L_{Q}I_{\\text{Bad}}} \\\\\\\\ \\end{array} \\right.\n```\n\n| |\n| --- | ---\
  \ |\n`L [Q]` ：使用数据包递送率（PDR）将链路分为三类\n\n1. 已连接 (`PDR > 90%`)\n2. 过渡态 (`10% < PDR < 90%`)\n\
  3. 断开态 (`PDR < 10%`)\n\n根据此，我们定义了阈值值的良好链路和坏链路。`L [Q] I [Good]` 和 `L [Q] I [Bad]`。`L\
  \ [Q] I [t]` 通过链路的 `L [Q] I [value]` 进行测量。`L [Q] I [max]` 是 `L [Q] I [t] [.]` 的最大值。\n\
  \n进度：向目的地地理进展较大的节点其值较小。\n\n```\n$$\\text{Progress} = \\left\\{ \\begin{array}{l}\
  \ {{\\text{2}R - P_{i}/\\text{2}R\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\\
  ,\\,\\,\\text{if\\ Dist}_{\\text{S} - \\text{D}} > R} \\\\\\\\ {{\\text{0}\\,\\\
  ,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\\
  ,\\,\\,\\,\\,\\\\,\\\\,\\text{if\\ Dist}_{\\text{S} - \\text{D}} < R} \\\\\\\\ \\\
  end{array} \\right.\n```\n\n| |\n| --- | --- |\n`P [i]` 是节点 `i` 的进度，`R` 是无线电范围，`Dist[S–D]`\
  \ 是源与目的之间的距离。\n\n```\n$$R_{E} = \\left\\{ \\begin{array}{l} {E_{0}–E_{r}/E_{0}\\\
  ,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\operatorname{}\\text{if}E_{r} > E_{\\text{min}}} \\\
  \\\\\\ {1\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\,,\\,\\,\\,\\,\\,\\,\\,\\,\\,\\\
  ,\\,\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\text{text{if}E_{\\r}} < E_{\\text{min}}} \\\\\\\
  \\ \\end{array} \\right.\n```\n\n| |\n| --- | --- |\n剩余能量 (`E [r]`) 高节点产生的“剩余能量”值较小。`E\
  \ [0]` 是初始值，`E [r]` 是剩余能量。\n\n```\n$$\\text{LIVE}\\operatorname{} = \\frac{1}{\\\
  left( {\\text{180} - \\alpha/\\text{180} \\right)^{\\text{2}} \\ast T_{\\text{LV}}}$$\n\
  ```\n\n| |\n| --- | --- |\n`α` 是节点移动的角。如果 `α = 0`，节点向目的地移动；如果 `α = 180`，节点向相反方向移动。`T\
  \ [LV]` 是链路可以保持的时间。\n\nCOR 中的数据转发都使用了这四个参数。\n\n## 5.4.2.2. 基于历史的机会性路由协议 (HiBOp)\n\
  \n机会性网络在不存在端到端路径的情况下也允许内容共享。提出了一种名为 `HiBOp` 的上下文感知框架，它通过上下文信息进行学习和自我表示；用户的行为和他们的社交关系驱动着它\
  \ (Psarella, Conti, 2008)。\n\nHiBOp 的主要特征有：\n1. 上下文感知框架。\n2. 学习与表示。\n3. 社会关系驱动。\n\
  4. 基于历史的路由。\n\n## 5.5\n\n### 5.5.4 机会性泛洪 (OR Flood)\n\n机会性网络在不存在端到端路径的情况下也允许内容共享。提出了一种名为\
  \ `HiBOp` 的上下文感知框架，它通过上下文信息进行学习和自我表示；用户的行为和他们的社交关系驱动着它 (Psarella, Conti, 2008)。\n\
  \nHiBOp 的主要特征有：\n1. 上下文感知框架。\n2. 学习与表示。\n3. 社会关系驱动。\n4. 基于历史的路由。\n\n### 5.5.1 瘟病路由\
  \ (Epidemic Routing)\n\n移动自组织网络在没有预定义路径的情况下也可以通信。然而，网络本质上具有很动态性。现有协议不足以处理这种动态。瘟病路由的设计是为了在源和汇点之间可能不存在连接路径的情况下允许递送\
  \ (Vahadat & Becker, 2000)。\n\n瘟病协议的主要目标是最大化递送率并最小化延迟，同时尽量减少资源。在瘟病路由中，消息在网络中泛洪，以便其到达目的地。同时泛洪许多副本会导致大量的资源浪费。为了避免这种情况，只选择倾向于向目的地移动的少数最佳节点。接收节点都有机会接受/拒绝数据。通过使用最佳节点，减少了网络的冗余并最大限度地减少了资源浪费。仿真是在\
  \ Monarch 模拟器上进行的，显示在合理的资源消耗下实现了 100% 的递送。\n\n### 5.5.2 喷洒等待 (Spray and Wait)\n\n\
  机会性网络在不存在端到端路径的情况下也允许内容共享。提出了一种名为 `HiBOp` 的上下文感知框架，它通过上下文信息进行学习和自我表示；用户的行为和他们的社交关系驱动着它\
  \ (Psarella, Conti, 2008)。\n\nHiBOp 的主要特征有：\n1. 上下文感知框架。\n2. 学习与表示。\n3. 社会关系驱动。\n\
  4. 基于历史的路由。\n\n这种方法在阈值处定义了良好链路和坏链路的边界（bonds）。`L [Q]`：使用数据包递送率（PDR）将链路分为三类：\n\n1.\
  \ 已连接 (`PDR > 90%`)\n2. 过渡态 (`10% < PDR < 90%`)\n3. 断开态 (`PDR < 10%`)\n\n根据此，我们定义了阈值值的良好链路和坏链路的边界。`L\
  \ [Q] I [Good]` 和 `L [Q] I [Bad]`。`L [Q] I [t]` 通过链路的 `L [Q] I [value]` 进行测量。`L\
  \ [Q] I [max]` 是 `L [Q] I [t] [.]` 的最大值。\n\n进度：向目的地地理进展较大的节点其值较小。\n\n移动自组织网络在没有预定义路径的情况下也可以通信。然而，网络本质上具有很动态性。现有协议不足以处理这种动态。瘟病路由的设计是为了在源和汇点之间可能不存在连接路径的情况下允许递送\
  \ (Vahadat & Becker, 2000)。\n\n瘟病协议的主要目标是最大化递送率并最小化延迟，同时尽量减少资源。在瘟病路由中，消息在网络中泛洪，以便其到达目的地。同时泛洪许多副本会导致大量的资源浪费。为了避免这种情况，只选择倾向于向目的地移动的少数最佳节点。接收节点都有机会接受/拒绝数据。通过使用最佳节点，减少了网络的冗余并最大限度地减少了资源浪费。仿真是在\
  \ Monarch 模拟器上进行的，显示在合理的资源消耗下实现了 100% 的递送。\n\n机会性网络在不存在端到端路径的情况下也允许内容共享。提出了一种名为\
  \ `HiBOp` 的上下文感知框架，它通过上下文信息进行学习和自我表示；用户的行为和他们的社交关系驱动着它 (Psarella, Conti, 2008)。\n\
  \nHiBOp 的主要特征有：\n1. 上下文感知框架。\n2. 学习与表示。\n3. 社会关系驱动。\n4. 基于历史的路由。\n\n机会性网络在不存在端到端路径的情况下也允许内容共享。\n\
  \n### 5.5.3 概率\n\n`α`, `β`, `γ`, `δ` 是权重系数，总和为 1，即 `α + β + γ + δ=1`。`DFD[max]`\
  \ 是允许每个节点的最大延迟。`L [Q]  = 链路质量`，`R [E]  = 剩余能量`。\n\nCOR 的性能优于仅使用单一指标的协议。\n\n### 5.5.4\
  \ 固定点机会性路由 (FPOR)\n\n机会性网络在不存在端到端路径的情况下也允许内容共享。提出了一种名为 `HiBOp` 的上下文感知框架，它通过上下文信息进行学习和自我表示；用户的行为和他们的社交关系驱动着它\
  \ (Psarella, Conti, 2008)。\n\nHiBOp 的主要特征有：\n1. 上下文感知框架。\n2. 学习与表示。\n3. 社会关系驱动。\n\
  4. 基于历史的路由。\n\n\n\n\n\n泛洪在无线网络中被广泛使用。但低占空无线传感器网络（WSNs）被忽略了，因为网络中的节点大多数处于睡眠状态，且异步唤醒。因此，这个问题需要考虑。\n\
  \n机会性泛洪（Opportunistic flooding）被用于具有不稳定无线链路和预设工作计划的低占空网络（Guo, He, Gu, Jiang & He,\
  \ 2009）。通过使用能量最优树之外的链路发送数据，以减少传输中的冗余和泛洪延迟。提出了一种转发者选择方法来减少隐藏终端问题，并提出了一种基于链路质量的退避方法来纠正同时的转发操作。经过大量仿真，结果显示机会性泛洪接近最优性能。\n\
  \n### 5.5.5 委托转发（Delegation Forwarding）\n\n机会性网络（OppNets）的特点是移动不可预测性、接触异构性以及缺乏全局知识。在所有这些条件下，通常无法以低成本成功传递消息。在许多情况下，为了避免与网络相关的成本，只选择少数节点来转发数据。然而，这可能不是一个理想的情况，因为我们选择的优节点可能在目的地处无法进行适当的中继。\n\
  \n委托转发主要关注在降低成本的同时提高成功率和平均延迟（Erramilli, Chaintreau, Crovella & Diot, 2008）。分析了两种委托转发的变体，一种质量独立于底层接触速率，另一种质量与节点的接触速率相同。在这两种情况下，委托转发都将期望成本从\
  \ `O(N)` 降低到 `O(√N)`，同时确保了高性能。这里的高性能指的是高成功率和低平均延迟。委托转发在现实世界中也表现良好。\n\n### 5.5.6\
  \ 基于接触的路由 (EBR)\n\n在许多协议中，泛洪是为了提高交付率。但相反，这会由于多个副本而增加开销并浪费缓冲区资源。EBR 是一种基于配角的 DTN\
  \ 路由协议（Nelson, Bakht & Kravets, 2009）。它的工作原理是“节点未来的接触速率可以通过过去的数据进行大致预测”。这意味着频繁接触节点可能比其他节点更容易成功。\n\
  \nEBR 限制了消息副本的数量，减少了网络消耗和缓冲区资源。EBR 中的路由是基于节点的决策和接触次数完成，并倾向于消息交换。由于这些因素，交付率提高了；这不断减少了网络中的开销。在\
  \ EBR 中，关于节点接触的信息完全是局部参数，并且可以轻松跟踪。因此，EBR 可以保持低开销；它在每次连接期间只需要 `O(n)` 次路由消息交换，并在本地存储\
  \ `O(n²)`。EBR 还能免受黑洞攻击。\n\n### 5.5.7 MaxOPP：一种用于无线网格网络的新型机会性路由\n\n机会性网络由于损耗链路和变化的信道条件存在退化因素。机会性路由协议利用无线介质的广播特性允许跳跳传输。但大多数现有协议都定义了传输之前的跳数。MaxOPP\
  \ 是一种新型协议，是一种自适应且灵活的机会性路由算法，能够在每个跳和运行时选择能够最大化吞吐量收益的候选转发者（Bruno, Conti & Nurchis,\
  \ 2010）。候选转发者的选择根据网络状况动态进行。与传统的最短路径协议相比，MaxOPP 即使对于批量数据传输也能实现高吞吐量。\n\n### 5.5.8\
  \ 优选概率转发 (OPF)\n\n机会性路由在许多方面都优于传统路由，例如对广播的有效利用以及对无线介质空间多样性的更好利用。人们已经使用各种技术在各种环境中提出了许多算法。但还没有一种算法设计为基于代数的协议。因此，这里提出了一种用于域间路由的基于\
  \ OR 代数的路由协议，它在 OR 代数的数学语言中识别了 OR（机会性路由）的核心特征（Lu & Wu, 2009）。在这里，OR 选择任何路径路由协议。对于任何节点对，已经选择了一组候选路径。仅根据网络状况和可用性动态选择单个节点。候选路径集被视为一个名为\
  \ OR tree 的树。\n\nOR 代数算法还可以结合 `Dijkstra’s` 最短路径、`Bellman-Ford` 算法进行应用。这有助于我们为机会性路由设计适当的路由指标。\n\
  \n### 5.5.9 优选机会性转发 (OOF)\n\n选择多副本转发主要是为了降低成本（Liu & Wu, 2012）。在这里描述了两种多副本转发协议：i.\
  \ 优化的机会性转发 (`OOF`) 和 ii. `OOF-`。这些协议在最小化延迟的同时最大化交付率，但转发消息的数量不能超过阈值。数据包头中给出了 `TTL`；一旦时间到达，数据包就会丢弃。`OOF`\
  \ 和 `OOF-` 与流行算法、Spray and Wait 等算法相比表现更好；但这些协议受到一些限制的影响。\n\n## 5.6 基于优化的\n\n某些路由协议主要集中在如何优化网络。\n\
  \n### 5.6.1 基于效用的\n\n它优化源利用。\n\n#### 5.6.1.1 节点约束的机会性路由 (Consort)\n\nX. Fang 等人提出了\
  \ Consort 协议。它主要关注如何为每个用户选择机会性路由，以增加相对于节点的 WMN 总效用。通过结合原始对偶方法和子梯度方法，设计了一种分布式算法，即\
  \ Consort。在每次迭代中，Consort 根据从上一次迭代接收的用户和节点行为更新拉格朗乘子。根据接收到的拉格朗乘子，节点调整自己的行为，然后更新拉格朗乘子。Consort\
  \ 给出的结果接近最优解（Fang, Yang & Xue, 2011）。\n\n#### 5.6.1.2 优化的多路径网络编码 (OMNC)\n\nNC 在不可靠的网络中起着重要作用。OMNC\
  \ 应用多路径将数据包传输到目的地，并使用广播 MAC 在相邻节点之间传递包（Zhang & Li, 2009）。编码和广播速率由分布式算法分配给发射器，以增加\
  \ NC 的优势并减少拥塞。OMNC 是一种速率控制协议，提高了长无线网络的吞吐量。对于单单播和多单播情况，OMNC 相比传统路由和现有的 NC 协议具有显著的吞吐量优势。\n\
  \n#### 5.6.1.3 机会性剩余期望网络效用 (OpRENU)\n\n\n\n\n\n`OR` 主要用于补偿低数据包交付率。在这里，`OR` 被应用于基于效用的路由，其中数据的成功包交付会带来收益（Wu,\
  \ Lu & Li, 2008）。它的主要功能是实现效用最大化。在这里，最大效用被定义为传输收益和成本的函数，因为每个的链路可靠性决定了最终的数据包交付，从而决定了效用。`OR`\
  \ 提供了通过机会延迟增加可靠性的能力。在不允许任何重传的情况下，通过 `OR` 评估基于效用的路由的最优性。他们观察到，最优方案需要在节点对之间的所有路径上进行穷搜索。目前已经提出了最优方案和启发式方案来选择中继节点并确定它们之间的优先级。\n\
  \n#### 5.6.1.4 延迟敏感型基于效用的机会性路由 (TOUR)\n\n基于循环的移动社交网络（MSNs）是一种新型延迟容忍网络（DTN）。移动用户定期移动并连接到他们的短距离通信设备。为\
  \ MSNs 设计了基于效用的路由。在网络中，如果消息成功发送到目的地，它将获得正收益作为奖励，否则收益为零。每次交付无论成功与否，都会产生一些转发成本。因此，效用等于收益减去转发成本。利用该模型，设计了\
  \ `TOUR` 或 `截止敏感型机会性基于效用的路由 (DOUR)`（Xiao, Wu, Liu & Huang, 2013）。最初，每个节点都确定一个最优转发序列，该序列以分布式和贪心的方式拥有一系列转发机会。然后根据模型转发消息。`TOUR`\
  \ 也被扩展到多副本模式，从本质上在收益、延迟和每条消息交付的成本之间取得了良好的权衡。\n\n#### 5.6.1.5 Dice\n\n`NC` 已经成为无线网格网络中一种极具前景的技术。然而，它没有考虑无线网络中的继承资源竞争。X.Zhang\
  \ 和 B. Li 提出了一种博弈论方法 `Dice`，用于优化基于 `NC` 协议的资源分配。`Dice` 将问题视为网络博弈；参与者是玩家。所有玩家与竞争共享带宽。如果玩家想要合作，则使用哈希议价算法（hash\
  \ bargaining algorithm）。如果玩家是自私的，则可以通过对他们定价来实现最优均衡。在这两种情况下，玩家都应该对子问题进行局部优化：广播/编码率分配和多路径机会性路由。经过大量工作后，结果显示\
  \ `Dice` 优于 `MORE` 等其他启发式模型（Zhang & Li, 2008）。\n\n#### 5.6.1.6 自动调节机会性确认/基于定时器的路由\
  \ (JOKER)\n\nRamon Sanchez-Iborra 和 Maria-Dolores Cano 提出了一种名为 `JOKER` 的协议。`JOKER`\
  \ 是一种在考虑了移动自组织网络的一种改进方法（BATMAN）的某些特征后设计的机会性路由协议。这是一种用于候选选择和协调阶段的新型协议，有助于我们提高支持多媒体流量的能量效率。提出\
  \ `JOKER` 是为了支持高能效的视频传输。与 `BATMAN` 相比，`JOKER` 在实时性方面表现优（Sanchez-Iborra & Cano, 2016）。\n\
  \n### 5.6.2 基于学习的\n\n学习对路由是有帮助的，因为我们并不总是能够获取上下文信息。\n\n#### 5.6.2.1 自适应机会性路由\n\n\
  A.A. Bhorkar 等提出了一种名为 `d-Adapt OR` 的协议，即一种分布式机会性路由算法。即使对网络拓扑和通道统计数据一无所知，它也能精确工作。在\
  \ `QualNet` 仿真器中与其他自适应路由协议一起进行仿真，`d-Adapt OR` 在实际环境中显示出更好的结果。在这里，考虑了长期奖励标准，忽略了短期性能。为了实现短期性能，考虑了“遗憾”（regrets）。`Regret`\
  \ 是一个关于跨度的函数，用于估计在任何给定自适应算法下，相对于拓扑感知（最优）协议性能的性能损失。遗憾数量越少越好。拥塞控制必须正确进行（Bhorkar, Naghshvar,\
  \ Javidi & Rao, 2012）。\n\n#### 5.6.2.2 带有学习算法的机会性路由 (ORL)\n\nP. Tehrani 等人考虑了一种未知的局部概率广播模型。主要目标是设计一种在线学习算法，能够根据概率链路的实现来管理中继节点的顺序选择。我们所感兴趣的性能优势是“遗憾”。`Regret`\
  \ 衡量为相对于具有最优集中路由的已知模型，随时间积累的预期额外成本。该在线学习算法同时适用于集中和分布式网络（Tehrani, Zhao & Javidi,\
  \ 2013）。\n\n#### 5.6.2.3 自私感知\n\n网络性能可能会受到自私节点和拥塞的影响，因此在选择下一个中继之前，我们应该考虑网络中的自私节点和拥塞。在这里，提出了一种技术改进多跳无线自组织网络分布式自适应\
  \ `OR` 协议的性能（Febeena & Vinitha, 2013）。该算法遵循三次握手寻找下一跳：\n\n1. 消息转发到所有邻节点；接收数据包的节点将发送确认。等待一段时间后，检查是否每个节点都发送了\
  \ `ACK`。如果任何节点没有发送 `ACK`，则将被视为自私节点。相对变量的选择通过 `Sd(j,s) = 1` 完成，其中 `j` 属于 `S` 且 `i\
  \ ≠ j`。\n2. 向该节点发送请求，在丢弃内存后参与路由。\n3. 如果在 `FO` 广播后收到 `ACK`，则 `Sd(j,s) = 0` 且 `Cd(j,s)\
  \ = 1`，这意味着该节点拥塞。\n\n这有助于我们发现节点是自私还是拥塞，以便采取必要措施。\n\n### 5.6.3 基于图的\n\n图论工具被用于优化。\n\
  \n#### 5.6.3.1 最短多速率机会优先 (SMAF)\n\n多速率机会优先中的节点同时使用一组下一跳和选定的传输率来到达目的地。传输率可用于集合中节点的广播；从集合中任何节点将数据转发到目的地。现有协议没有联合优化下一跳和传输率。\n\
  \n在给定的网络拓扑和目的地，我们将寻找传输率和转发集合，使得目的地路径最小。这被称为最短多速率机会问题。这是一个寻找联合优化距离的开放问题。为了解决这个问题，设计了期望机会传输时间（`EATT`）路由指标和\
  \ `SMAF` 算法（Laufer, Dubois-Ferriere & Kleinrock, 2009）。它的复杂度与多速率单路径路由的 `Dijkstra`\
  \ 算法相似，但在链路状态路由协议中执行非常容易。\n\n#### 5.6.3.2 最小代价机会性路由 (LCAR)\n\n许多网络现在使用单路径机会性路由来最小路径代价。`LCAR`\
  \ 问题已经讨论过（Dubois-Ferriere, Grossglauser & Vetterli, 2011），即以何种方式分配候选集合来实现最小代价。存在一种权衡：随着候选中继的增加，转发成本会降低，但另一方面，偏离最短路径的可能性也会增加。\n\
  \n\n\n\n\nLCAR 算法可以应用于任何网络以获得最佳结果。当 LCAR 整合到底层协调协议中时，表现出最佳结果：一种链路层协议，该协议随机选择任何节点进行转发。当应用\
  \ LCAR 时，候选节点的选择是以优化网络的方式进行的。\n\nLCAR 应用于低功耗、低速率无线通信，提供了一种新的无线链路层技术以降低能量消耗和网络拥塞。LCAR\
  \ 路由比其他单路径协议更加稳定且健壮。\n\n### 5.6.3.3 多速率任径路由的项项式时间算法 (PTAS MRA)\n\n与多速率任径路由一样，每个节点都同时操作下一跳的起始位置和所选的传输速率，以尽快到达目的地。早期的协议没有考虑同时优化这两个参数的问题。为了解决这个问题，引入了这种\
  \ `PTAS MRA` 路由算法（Laufer, Dubois-Ferriere & Kleinrock, 2012）。结果显示，它的执行时间与普通最短路径算法相同，因此适用于任何协议。\n\
  \n### 5.6.3.4 多约束任径路由 (MAP)\n\n任径路由被提出用于利用介质广播特性和空间多样性的不可靠网络。在这里，我们考虑受 `K` 个约束的任径路由，并展示了一种多项式时间\
  \ `K`-近似算法。当 `K = 1` 时，该算法在该问题上显示最优的多项式时间。如果 `K ≥ 2`，该问题已知是一个 NP-hard 问题。这是一个非常简单的算法，可以应用于任何无线路由协议（Fang,\
  \ Yang & Xue 2013）。\n\n### 5.6.3.5 PLASMA：一种无线多跳网络的新路由范式\n\nR. Laufer 等人提出了一种名为\
  \ `PLASMA` 的新路由协议。每个数据包都通过最佳可用路径交付到任何网关。路径或网关都不会预先选择；当数据包通过网络时，它们由网格路由器动态选择。提出了一种分布式路由算法来优化两组网关和传输速率。采用负载均衡技术将流量分散到各个网关。仿真后，结果显示\
  \ `PLASMA` 优于最先进的多速率任径路由算法（Laufer, Velloso, Vieira & Kleinrock, 2012）。\n\n### 5.6.3.6\
  \ 地带机会性路由 (LOR)\n\n现有的协议如 `ExOR` 和 `MORE` 无法应用于大规模网络。因此为了克服这一点，设计了 `LOR`（Li, Mohaisen\
  \ & Zhang, 2013）。它使用分布式最小传输选择 (`MTS-B`) 算法，并利用本地信息将大规模网络划分为许多嵌套的近节点集 (`CNS’s`)。`LOR`\
  \ 在本地实现网络并优化它们。由于它不需要全局拓扑，开销被降至最低。`LOR` 在所用转发者列表的全局最优性和由于开销引起假设的可扩展性之间表现出更好的权衡。它在开销、端到端延迟和吞吐量方面优于\
  \ `MORE` & `ExOR`。\n\n## 5.7 跨层\n\n网络层与其他较低层级之间的交互是为了获得更好的性能结果。\n\n### 5.7.1 物理层感知\
  \ (PHY-Aware)\n\n通过考虑信道状态信息的动态变化来提高网络吞吐量。\n\n#### 5.7.1.1 干扰限制机会性中继 (ILOR)\n\n`ILOR`\
  \ 设计用于与网络接口良好工作。在无线网络中，干扰是主要问题。因此，`ILOR` 有助于避免干扰。`ILOR` 工作于慢衰落无线环境中，其时间通常为数百毫秒（Bletsas,\
  \ Dimitriou & Sahalos, 2010）。\n\n消息的传输分为两个阶段：\n\n阶段 I：由机会性路由协助；阶段 II：由传统的再生中继协助。\n\
  \n在阶段 I 中，源端向新目的地发送，同时中继节点 `I` 在无任何延迟的情况下将若干消息转发到不同的目的地。阶段 II：机会性选择的数组 `b ≠ I` 转发到相应的目的地，而源端向新目的地发送一个消息。参与的中继节点在源端和目的地之间应具有强路径，同时它们之间必须保持相互隔离。在这里，“有用性”通过噪声限制和干扰限制得到了很好的定义。这对于慢衰落、密集且干扰限制的网络效果良好。\n\
  \n#### 5.7.1.2 并行机会性路由 (Parallel OR)\n\n在 W.Y. Shin 等人的研究中，随着对数量增加到运行最大值，对 `OR`\
  \ 在功率、延迟和总吞吐量方面进行了检查。他们提出了一种名为 `Parallel OR` 的协议；通过许多节点同时执行来增加机会增益，同时控制用户间接口。观察到，`Parallel\
  \ OR` 在整体功率-延迟权衡方面比传统路由显示出净改进。这种增益源于多用户多样性增益带来的最大接收信号功率（Shin, Chung & Lee, 2013）。\n\
  \n#### 5.7.1.3 简单实用的机会性路由 (SPOR)\n\nG.Y. Lee 和 Z. Haas 提出了一种简单实用的 OR 算法，该算法通过考虑网络节点内的链路接口来分析其在多跳无线网络中的性能。`SPOR`\
  \ 算法通过吞吐量的显著提升显示出更好的结果，特别是对于短距离路径。由于其实现简单，它可以被易地集成到大多数路由协议中。`SPOR` 算法为无线网络中任何机会性路由的实现提供了一种实用有效的方法（Lee\
  \ & Haas, 2011）。\n\n#### 5.7.1.4 高速机会性路由 (HS OR)\n\n由于现有的 OR 协议无法满足高速、多速率无线网格网络的需求，设计了一种新的路由协议——实用机会性路由\
  \ (`POR`) 来克服此。在 `POR` 中，数据包沿着路径转发，该路径是一个有序列表。每条路径都必须满足反馈约束，即路径上的任何节点都必须接收下一跳的数据，以确保从下游节点的正确接收。节点的完整路径在数据包报头中指定。一旦数据包被接收，它将不再转发。节点在反馈帧中确认数据包的接收状态，以避免重复。在收到成功确认后，接收器中的数据包被转发。路径基于贪心算法进行选择（Hu,\
  \ Xie & Zhang 2013）。\n\n`POR` 主要关注网络的高吞吐量。数据包被分成帧并计算节点的校验和。使用拥塞控制位避免网络拥塞。`POR` 适用于在\
  \ Wi-Fi 接口上的高速多速率无线网格网络，具有低复杂度、支持 TCP、支持多链路数据速率并能够利用高效性。\n\n#### 5.7.1.5 能量高效机会性路由\
  \ (EEOR)\n\n提高吞吐量的基本思想是允许转发者列表中的任何节点在听到并靠近目的地时转发。转发者列表中的节点进行优先级排序，如果接收者的数据包优先级高于发送者，则丢弃该数据包。这里的关键问题是如何高效地对转发者列表进行排序。\n\
  \n\n\n\n\n在这里（Mao, Tang, Xu, Li & Ma, 2011），假设了一个假设：每个节点都具有固定的传输功率（不可调），同时也允许某些节点调整其传输功率（可调）。针对这两种情况，提出了能量高效型算法，用于选择和优先划分转发列表。结果显示，`EEOR`\
  \ 优于 `ExOR`。\n\n### 5.7.2 MAC 感知\n\n这些是为无线传感器网络（WSN）提出的，因为其寿命和性能取决于 MAC 层。\n\n###\
  \ 5.7.2.1 QoS 面向型机会性路由 (QOR)\n\n`TR` 无法应用于 WSN，因为它们面临无线物理的现实问题，包括不对称和长距离瞬态链路。针对\
  \ WSN 数据采集提出了一种基于 QoS 的机会性路由协议 `QOR`（Lampin, Barthel, Auge-Blum & Valois, 2012）。与传统路由不同，`QOR`\
  \ 利用了 `OR` 的优势来提供快速且可靠的传输。\n\n`QOR` 有三个过程：\n\n1. 一种联合路由结构和寻址方案，允许我们识别可能成为节点对之间机会性中继节的有限节点集。\n\
  2. 设计了级联确认（Cascaded acknowledgment），提供了可靠的 `ACK` 和无冗余的转发。\n3. 性能评估结论认为，`QOR` 有效利用了机会性链路。\n\
  \n`QOR` 减少了端到端延迟并提供了高交付率。`QOR` 在密集网络和稀疏网络中均表现良好。\n\n### 5.7.2.2 针对低功耗和丢包网络的机会性路由\
  \ (ORPL)\n\n在 B. Pavkovic 等人的研究中考虑了一个问题，即 `IEEE 802.15.4` MAC 层上的 `RPL`。这两个层级以不同的方式运行；`RPL`\
  \ 可以被看作是一个有向无环图，而 `IEEE 802.15.4` 中是簇树结构。两者的耦合是一个需要考虑的问题。设计了一种改进的簇树结构，它可以与多个父节点关联，利用了\
  \ MAC 层超帧的充分组织。这是一种改进的 MAC 层，可以与 `RPL` 进行机会性转发，并具有向多个节点转发数据包的可能性。我们不再每次都使用相同的父节点，只要它们靠近汇聚节点，我们就使用不同的父节点。我们利用机会性转发来支持高优先级、延迟敏感的告警，这些告警应该在截止日期之前结合低强度监控数据到达汇聚节点。`ORPL`\
  \ 在交付率、延迟和开销方面均优于 `RPL`（Pavković, Theoleyre & Duda, 2011）。\n\n### 5.7.2.3 具有拥堵多样性的机会性路由\
  \ (ORCD)\n\n最小延迟路由协议通常最受青睐。最小延迟路由协议的主要问题在于重负载流量场景下，此时网络会导致严重的拥堵和无限制的延迟。为了避免这种情况，提出了\
  \ `ORCD`（Naghshvar and Javidi, 2010）。它是最短路径路由与背压路由的结合。根据拥堵控制措施，对数据包进行相应排序，预计具有低整体拥堵。使用了一种名为\
  \ `Lyapunov` 的新函数来确保在允许的流量下所有网络都有界的预期延迟。提供了 `ORCD` 的两种变体：\n\n1. `Infreq-ORCD`：它允许在计算中使用过时的积压数据对节点进行排序。\n\
  2. `AD-ORCD`：它允许异步分布。\n\n### 5.7.2.4 针对无线传感器网络的机会性路由 (ORW)\n\n机会性路由显著优于 WSN。WSN\
  \ 是循环作业的，即它们频繁进入睡眠模式以延长网络寿命。然而，`OR` 假设节点是唤醒的。为了避免这种情况，提出了一种针对 WSN 的机会性路由方案 `ORW`（Ghadimi,\
  \ Landsiedel, Soldati, Duquennoy & Johansson, 2014）。`ORW` 使用了一种名为预期循环作业唤醒次数（`EDC`）的指标，它反映了成功到达目的地所需的循环作业唤醒次数。设计了一种算法来优化\
  \ `EDC`，使其与 `TR` 相比能够显著减少延迟并提高能量效率。在仿真器和测试平台上均评估了 `ORW` 的性能。`ORW` 平均将无线电占空比减少了 50%。\n\
  \n### 5.7.3 PHY 和 MAC 感知\n\n它们提供了实用且高效的路由协议。\n\n### 5.7.3.1 机会性重传协议 (PRO)\n\nM.H.\
  \ Lu 等提出了一种名为 `PRO` 的高效重传协议。`PRO` 是一种链路层协议，允许监听节点作为中继，在获取传输失败的知识后代表源进行重传（Lu, Steenkiste\
  \ & Chen, 2009）。与目的地具有高连接性的中继比源节点有更高的概率交付数据包。\n\n`PRO` 具有 4 个主要特征：\n\n1. 信道倒易性结合运行时校准过程用于确定到目的地的瞬时链路质量。\n\
  2. 本地处理过滤掉糟糕的中继。\n3. 分布式中继选择算法从合格的中继中选择最佳的合格中继集并对其进行优先级排序。\n4. 应用了 `802.11e` 增强分布式接入（`EDCA`）以确保高优先级传输。`PRO`\
  \ 在测试平台和现实世界中运行良好。\n\n### 5.7.3.2 无线多跳网络中传输机会最大化 (MTOP)\n\n随着 WiFi 网络变得越来越拥挤（在使用\
  \ `802.11` 射电的情况下），`MTOP` 在跳数短的密集网络中将非常有帮助。`MTOP` 取自机会传输协议（`TXOP`），它可以连续转发帧（Lee,\
  \ Yu, Shin & Suh, 2013）。`MTOP` 最小了 MAC 开销。仿真在 OPNET 上进行。结果显示 `MTOP` 在多种场景下均有效。\n\
  \n### 5.7.3.3 跨层辅助能量高效机会性路由 (CL EE)\n\nJ. Zuo 等提出了 `CL EE`，它利用了跨层信息。信息可以是物理层的帧错误率（`FER`）、MAC\
  \ 层的最大重传次数以及网络层的中继数量。使用基于能量耗散的目标函数来计算传统路由和机会性路由每个可用路径的端到端能量消耗。仿真结果显示，能量高效的 `OR`\
  \ 在端到端延迟方面优于 `TR`，且吞吐量也增加了（Zuo, Dong, Nguyen, Ng, Yang & Hanzo, 2014）。\n\n## 5.8\
  \ 结论\n\n\n\n\n由于机会性网络的动态特性，在其中中进行路由是一项挑战。路由有助于优化网络，因此选择合适的路由协议可以带来更好的结果。本文已经讨论了机会性网络中路由协议的分类，以便让读者对机会性网络（OppNets）有一个清晰的认识。在未来，我们将尝试讨论其他一些新协议。目前为止，尚未设计出一种适用于所有情况的路由协议。\n\
