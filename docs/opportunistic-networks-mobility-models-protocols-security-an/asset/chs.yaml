  \n\n\n\n\n既然已经讨论了 `updateHosts()` 函数，现在回来看图 16.8 中的 `world.update()` 方法，发现还有另一个名为\
  \ `moveHosts()` 的重要函数，它也属于 `World.java`。该函数的定义可以在图 16.13 中看到。它调用了 `move()` 函数，后者进一步调用\
  \ `setNextWayPoint()`。这两个函数都属于 `DTNHost.java`。这些调用都确保了节点设置了下一个新目的地。路径中的下一个点是使用 `RandomWayPoint`\
  \ 移动模型获取的，该模型在 `default_settings.txt` 的所有组通用设置中已设定。\n\n![](img/fig16.13.jpg)\n\n\
  图 16.13\n\n代码片段 - `moveHosts()`。\n\n至此，第 16.2 节结束。在下一节中，将讨论负责在整个网络中路由消息的函数。在学习了第\
  \ 16.2 节的基础知识后，理解第 16.3 节将涵盖的路由细节至关重要。主要原因是，大多数与开发新路由算法相关的研究都可以通过对现有的路由器类进行修改或添加扩展来实现，例如\
  \ `ProphetRouter`、`EpidemicRouter`、`SprayAndWaitRouter` (Spyropoulos 等., 2005) 或基础路由类\
  \ `ActiveRouter`。新路由算法的实现将在第 16.4 节中讨论。\n\n### 16.3 ONE 中现有的路由协议实现\n\n回到上一节涵盖的内容，`this.router.update()`\
  \ 方法取决于所使用的路由器类。同样地，`this.router.update()` 方法在 `update()`（属于 `DTNHost.java`）结束时被调用。这个\
  \ `update()` 方法本身是由 `updateHosts()` 调用的，而 `updateHosts()` 是 `world.update()` 的子调用之一。`world.update()`\
  \ 函数是由 `runSim()` 调用的。\n\n现在已经总结了上一节 `router.update()` 函数被调用的情况，可以开始查看定义了。此外，将涵盖在\
  \ `ProphetRouter.java` 中实现的 Prophet 路由协议。可以参考图 16.14 中 `ProphetRouter.java` 的 `update()`\
  \ 方法定义。\n\n![](img/fig16.14.jpg)\n\n图 16.14\n\n代码片段 - `ProphetRouter.java` 中的 `update()`。\n\
  \n第一次调用是对其父类 `ActiveRouter` 的 `update()` 方法进行的。该代码片段可以在图 16.15 中看到，并在后续进行讨论。\n\n\
  ![](img/fig16.15.jpg)\n\n图 16.15\n\n代码片段 - `ActiveRouter.java` 中的 `update()`。\n\n\
  该方法第一次调用其父类 `MessageRouter.java` 的 `update()` 方法。此 `update()` 方法用于更新应用层，与我们的讨论无关。接下来，在循环中进行的下一个调用是\
  \ `isMessageTransferred()`，检查消息是否已完全传输。`isMessageTransferred()` 函数首先调用 `getRemainingByteCount()`。决定消息大小的总字节数是使用\
  \ `default_settings.txt` 文件设置的，如第 16.1 节所示。这些在消息创建设置（Message Creation Settings）中指定，默认指定为\
  \ `Event1.size = 500 k, 1 M`。这意味着消息大小将随机选择在 500 kB 到 1 MB 之间。因此，`getRemainingByteCount()`\
  \ 函数告诉我们剩余多少字节的消息待传输。当此值达到 0 时，消息已完全传输。因此，当 `getRemainingByteCount()` 返回 0 时，`isMessageTransferred()`\
  \ 返回 True。\n\n`ActiveRouter` 的 `update()` 方法调用了另一个有趣的函数 `getMessage()`。它返回当前在建立连接之间传输的消息。基本逻辑是：如果根据\
  \ `isMessageTransferred()` 的值应该传输消息，但 `getMessage()` 返回了 `null`，则传输由于其他原因被中止。因此，需要从缓冲区中移除此消息。因此，`removeCurrent`\
  \ 布尔变量被设置为 True，并最终用于检查是否从缓冲区中移除消息以及移除连接。如果 `removeCurrent` 未被设置为 True，则移动到下一个连接。图\
  \ 16.15 中定义中的另一个重要条件语句检查生存时间（TTL）是否过期，然后通过调用 `dropExpiredMessages()` 丢弃消息。\n\n从\
  \ `ActiveRouter` 的 `update()` 方法回到图 16.14 给出的 `ProphetRouter` 的 `update()` 方法。这里有两个调用的函数：`canStartTransfer()`\
  \ 和 `isTransferring()`。`canStartTransfer()` 函数确保至少有一个消息和一个连接以确保传输。`isTransferring()`\
  \ 函数返回一个布尔值，取决于当前是否正在进行传输。\n\n下一个重要函数是 `exchangeDeliverableMessages()`。在这里，该函数请求从所有其他节点传输应该交付到此节点的消息。一旦启动传输，该函数就会停止此过程。函数定义给出图\
  \ 16.16 中。查看图 16.16 中的定义，可以看到 `exchangeDeliverableMessages()` 首先使用 `getConnections()`\
  \ 获取特定主机的所有可能的连接列表。然后根据队列模式对它们进行洗牌，创建一个相关消息和连接的元组。\n\n![](img/fig16.13.jpg)\n\n\
  图 16.16\n\n代码片段 - `exchangeDeliverableMessages()`。\n\n如果这没有产生任何传输，则调用 `requestDeliverableMessages()`\
  \ 函数。该函数的定义在图 16.17 中显示。它基本上请求与当前节点有连接的所有其他节点传输消息。\n\n![](img/fig16.17.jpg)\n\n\
  图 16.17\n\n代码片段 - `requestDeliverableMessages()`。\n\n`ProphetRouter` 的 `update()`\
  \ 方法中的最后一个函数是 `tryOtherMessages()`。该函数的定义可以在图 16.18 中看到。`tryOtherMessages()` 函数定义了\
  \ ProphetRouter。它首先获取该节点的所有消息。在所有初始检查之后，它通过检查连接的另一个节点是否有更高的交付几（概率）来过滤消息，然后将其添加到此类消息和连接的列表中。然后将此列表传递给\
  \ `tryMessagesForConnected` 进行发送。这就是消息在网络中路由的过程。此外，尽管该过程是在 `ProphetRouter` 中涵盖的，但对于其他路由协议也大相同，只有细微变化。鼓励读者阅读其他实现，并结合本节涵盖的概念来理解它们。在下一节中，将实现基于\
  \ `EpidemicRouter` 的新路由算法，但带有额外的功能。\n\n![](img/fig16.18.jpg)\n\n图 16.18\n\n代码片段\
  \ - `tryOtherMessages()`。\n\n### 16.4 在 ONE 中从零实现一个新的路由协议\n\n作为本节的一部分，将实现基于 `EpidemicRouter`\
  \ 的新路由算法。该协议的功能将是：\n\n1. 引入所有节点的评分机制。\n2. 该评分机制将基于节点与另一个节点接触并建立连接的频率。\n\n\n\n\n\n\
  3. 与 `EpidemicRouter`（它会为所有消息尝试所有可能的连接）不同，此协议将只会尝试将消息传输到连接中另一个节点得分更高的连接。\n\n4. 每个节点的默认分将为\
  \ `100`，每当下次相遇时，分值将增加 `5`。\n\n这种新的路由协议将被命名为 `EpidemicRouterWithScore`。在编写完协议代码后，将分别使用\
  \ `EpidemicRouterWithScore` 和 `EpidemicRouter` 生成报告。通过检查，可以发现像评分机制这样简单的加法操作就能显著提高投送成功率。\n\
  \n为了创建一个名为 `EpidemicRouterWithScore` 的新 Java 文件，第一步是导入所有相关的 Java 程序包。\n\n此之后，`ActiveRouter`\
  \ 类提供的大部分功能将得到智能地使用，因为这会使编写新功能变得简单得多。你本也可以选择使用 `EpidemicRouter`，但泛洪路由协议并没有许多无法重写的特性。通过直接扩展\
  \ `ActiveRouter` 可以使代码更加简单。此外，由于路由器类需要一个评分属性来实现评分机制，将声明一个 `HashMap` 来存储特定节点的评分。这些步骤可以在\
  \ 图 16.19 中看到。接下来，将编写构造函数。这些函数与 `EpidemicRouter` 类几乎相同，不同之处 `score` 必须被声明为一个新的 `HashMap`。此步的代码可以在\
  \ 图 16.20 中看到。\n\n![](img/fig16.19.jpg)\nFIGURE 16.19\n扩展 ActiveRouter 类。\n\n![](img/fig16.20.jpg)\n\
  FIGURE 16.20\n为 EpidemicRouterWithScore 编写构造函数。\n\n现在，必须编写描述评分机制的函数。为此，将将重写 `ActiveRouter`\
  \ 的 `changedConnection` 函数以向其中添加评分功能。它将在连接建立时进行检查。当连接建立时，首先检查连接中的另一个节点是否已经从之前的相遇中获得分值。如果是，则其分值增加\
  \ `5`。如果不是，如果是第一次建立连接（首次接触），将赋予其默认分值 `100`，然后由于与另一个节点发生了接触，分值增加 `5`。实现此点的代码非常直观，可以在\
  \ 图 16.21 中看到。`con.getOtherNode(getHost()).getAddress()` 函数为我们提供了连接另一个节点的地址。首先 `con.getOtherNode(getHost())`\
  \ 获取了 `DTNHost` 类中连接的另一个节点。然后调用 `DTNHost` 的 `getAddress()` 方法获取其整数地址。代码其余部分可以通过上述说明来理解。\n\
  \n![](img/fig16.21.jpg)\nFIGURE 16.21\n编写 changedConnection() 函数。\n\n编写协议的下一步是编写在上一节中详细讨论的\
  \ `update()` 方法。在此方法中，大多数节点在建立连接后，其消息将尝试进行投递。该方法与 `EpidemicRouter update()` 方法几乎相同，但有一处不同。它不再指定\
  \ `tryAllMessagesToAllConnections`（属于 `ActiveRouter` 的函数）作为最后一个函数调用，而是指定一个名为 `tryAllMessagesToAllConnectionsWithGreaterScore`\
  \ 的新函数。必须在代码中编写该函数的定义以赋予所需的功能——即只向连接中得分高于主节点的节点发送消息。此函数的实现代码可以在 图 16.22 中看到（注：此处原文链接为\
