  \n# OMNs 中的能量管理\nu Snigdh 和 K. Sridhar Patnaik\n\n## 目录\n\n## 8.1 引言\n随着传感器网络和移动自组网络（MANETs）的普及，我们拥有了大量的异构智能设备，它们需要在网络中频繁通信。这将增加未来对网络能力的需求。随着无数异构设备的扩散，由于带宽不足，服务质量将会下降。机会性移动（自组织）网络（Pelusi\
  \ 等，2006）可以被认为是一种卓越的概念，是实现这些需求的第一步。\n\n### 8.2 OMNs 与 MANETs 及 WSNs 的比较\n### 8.21\
  \ 节点移动\n### 8.2.2 能量保护\n### 8.2.3 节点密度\n### 8.3 能量限制\n### 8.3.1 影响能量消耗的因素\n### 8.4\
  \ 能量保护方法\n### 8.4.1 现有方法\n#### 8.4.1.1 相遇频率\n### 8.4.1.2 用户间的社交关系强度\n#### 8.4.1.3\
  \ 相遇的规律性\n### 8.4.1.4 对内容类型的兴趣\n### 8.4.1.5 基于智能基础设施的能量保护\n### 8.5 用于优化能量消耗的定制化路由协议\n\
  ### 8.5.1 转发方法\n### 8.5.2 泛洪方法\n### 8.6 现有路由协议在能量消耗背景下的性能分析\n### 8.7 现有研究与里程碑\n\
  ### 8.8 持续进行的研究挑战\n\n\n\n\n\nOMNs 的协议栈在传统的 TCP/IP 架构中考虑了一个额外的层，通常被称为 `bundle` 层（Huang\
  \ 等人，2008 年）。这些网络将节点作为一种实体来实现数据聚合（Socolofsky 和 Kale，1991 年）。由于这些网络的特点是频繁断开连接，节点还需要缓存存储器来存储消息，直到连接能够重新建立。OMN\
  \ 的通用特征可以总结为：\n\n*   移动性\n*   资源限制\n*   高异构性\n*   资源故障\n*   动态接触\n\n### 8.1.2 OMNs\
  \ 的分类\n\n一个 OMN 可以被视作是从以下网络连接的特殊情况中涌现的：\n\n1. **以人为中心的手机手机**：人们携带的智能手机可用于建立这种类型的网络。因此，此类网络被称为口袋交换网络（`PSNs`），即由人们携带的移动设备形成的网络。因此，机会网络（`OppNets`）的一个子集被称为\
  \ `PSNs`（Lilien 等人，2006 年）。\n\n2. **VANETs**：车辆配备了支持无线连接的设备，因此在可能的情况下连接到其他类似设备是理想的。车载自组织网络（`VANETs`）在\
  \ `OppNets` 中有更广泛的应用，因为它们可以通过路边的基础设施节点（主要称为路侧单元 `RSUs`）进行 3G/2G 蜂窝连接，或作为 Wi-Fi 访问点以促进通信。因此，`OppNet`\
  \ 在 `VANET` 领域有着生的应用。\n\n3. **混合网络**：由于现在的网络包含智能手机、车辆中的 Wi-Fi 接口设备设备或 Wi-Fi 适配器等异构设备，任何基于基础设施或无基础设施的无线设备的组合也形成了一种尽可能为了必要通信进行连接的\
  \ `OppNet` 类型。\n\n### 8.2 OMNs 与 MANETs 以及 WSNs 的比较\n\nOMNs 被认为是延迟容网络（`DTNs`）的一个子集，是\
  \ `MANETs` 的一个有趣的衍生物。一些文献还假设 `OppNets` 出现于机会传感器网络的概念（Pelusi 等人，2006 年）。此类网络中的节点通常是人们携带的手持设备，它们会自动相互发现，无需用户干预即可进行必要的通信。\n\
  \n下文讨论了区分 `OppNet` 和 `MANET` 的主要概念。\n\n#### 8.2.1 节点的移动性\n\n在 `MANET` 的情况下，中间设备如果是移动的，将产生电池损耗（一种必要的开销），以实现节点之间的通信。因此，`MANETs`\
  \ 和无线传感器网络（`WSNs`）都采用几乎固定的路由策略，节点移动时可能会更新也可能不更新。因此，由于网络中节点不可预测的移动性，稳定的连接受到了损害。因此，移动性被视为一种限制，需要在一定范围内对其控制。\n\
  \nOMN 消除了 `MANETs` 和 `WSNs` 对连接建立的主要关注，即移动性。事实上，它利用移动性来为数据传输建立路径。它利用设备的移动性，并将其视为移动过程中携带消息的机会，并在认为可能的任何通过任何路径将数据转发到目的地。\n\
  \n### 8.2.2 节约\n\n`OppNet` 与 `MANET` 的主要概念是能量消耗。在 `MANET` 情况下，邻居发现使用`节点发现请求`（`NDREQs`）和`节点发现回复`（`NDREPs`）。这会耗尽现有移动无线设备的电池。\n\
  \n`OMNs` 中的能量效率是一个挑战，因为移动设备是能量限制的。移动性也会影响能量消耗，因为它需要频繁的 `SCAN` 和 `OFF` 循环。\n\n###\
  \ 8.2.3 节点密度\n\n节点密度影响 `OMNs` 中的能量消耗。相反，随着可用设备数量增加，接触机会大大增加，这是很有。然而，`OppNet` 的特点是高延迟、高错误率、低可靠性、安全问题和资源限制。\n\
  \n### 8.3 能量限制\n\n在任何自组织网络中建立和维护路由路径、传输和接收消息、调度 `active` 和 `sleep` 循环以减少冲突时，能量都会消耗。除了空闲监听和过度监听外，干扰也会导致能量浪费。\n\
  \n#### 8.3.1 影响能量消耗的因素\n\n##### 邻居发现\n\n由于大多数设备是手持的或不断移动的，为了建立机会相遇，需要连续或频繁的扫描。因此，邻居发现需要发送和接收关联请求。例如，在支持蓝牙的\
  \ `OMNs` 中，邻居发现过程使用 `NDREQs` 和 `NDREPs`。\n\n##### 数据转发和连接（路由）\n\n`OppNets` 中的连接可以是以人为中心或以数据为中心的，并由\
  \ `Bluetooth` 或 `Wi-Fi` 促进。只有当节点处于彼此范围内范围内，通信才会发生。移动性对于识别影响 `OMNs` 所用数据交付方案的特征至关重要。\n\
  \n\n\n\n无论其他特性如何，OMN（机会移动网络）中的每个节点都预期能够接收消息并将其转发给最合适的候选节点。因此，在与是否接受处理并转发、还是拒绝收到的数据包相关的初始计算中，需要加速能量。\n\
  \n## 8.4 能量节约方法\n\n可以通过以下方式实现能量节约：\n\n* 数据压缩\n* 协议开销减少\n* 节能路由\n* 周期循环\n* 拓扑控制\n\
  \n### 8.4.1 现有方法\n\n当模式中存在潜在可利用的规律性时，可以利用用户移动性形成 OppNet。减少能量的基本思想是限制在通常的基于泛洪的数据传输方法中需要生成的消息副本数量。因此，现有方法侧重于决定何时以及复制多少消息。这些决策可能完全取决于节点移动的速度，而不是数据包成功传输的概率。下一节概述了基于以下因素的一些方法，这些因素用于利用节点及其连接的特性。它们列如下：\n\
  \n* 节点相遇的频率\n* 用户之间社会关系的强度\n* 经常访问的地方\n* 他们感兴趣的内容类型\n* 智能基础设施\n\n#### 8.4.11 相遇频率\n\
  \n该因素用于优化数据转发需要实施的程度和范围。它可以大致分类为：\n\n* 以人为为中心（Chaintreau et al., 2007; Perino and\
  \ Varvello, 2011）\n    * 例如，以人为中心的方法是：如果节点 `A` 和 `B` 明确彼此的身份且条件有利，则它们之间发生数据转发。例如，如果\
  \ `A` 想与 `B` 通信，则生成端点并建立路由以进行通信。\n* 群组通信（Phuong et al., 2016）\n    * 这是一种以数据为中心的方法，节点身份的知识并不重要，而是到达目的地的上下文发射更为重要。在这种情况下，内容由任何用户生成，并被对该数据感兴趣的其他用户吸收。它类似于发布-订阅架构，信息被推送到属于相同兴趣域的用户。\n\
  \n#### 8.4.1.2 用户之间社会关系的强度\n\n许多路由算法并不是盲目地将数据包转发给相遇的节点，而是结合智能决策策略来选择最佳候选节点以确保消息交付。这些策略通常与接触的先验知识、上一次成功数据交付的历史，或简单的节点移动性相结合。因此，许多路由算法使用基于马尔可夫的方法或贝叶斯信任网络来估计每个节点的成功概率，然后启动与他们的通信或转发消息，希望消息能成功交付。这些方法类似于社交网络，节点计算并为每个节点分配一个置信值并据此做出决定。这种方法还减少了消息复制的总数，以及在随机扫描操作中消耗的能量。该类下的数据转发方案可以分类为（Pelusi\
  \ et al., 2006; Waltari and Kangasharju, 2016; Bulut and Szymanski, 2010; Conti\
  \ and Kumar, 2010）。\n\n1. **社会上下文无关**：也称为随机。在这种情况下，会生成并复制一定数量的副本，希望其中一个副本能到达目的地。\n\
  2. **社会内容感知**：也称为基于效用的。这些方法尝试估计节点进入目的地的概率。该概率基于接触频率、接触间隔时间和成功交付概率计算得出，而这是选择最合适的候选节点转发数据的依据。这通常是一种基于节点过去相遇和经验的推理方案。这些方案在到达目的地方面更加准确，但对上下文信息的存储要求更高，且更容易产生延迟。\n\
  \n#### 8.4.1.3 相遇的规律性\n\n对于经常在同一感兴趣区域移动，且访问地点可能与固定间隔或持续相关的节点，可以对接触时间进行同步。文献中提到针对上述情况采用了对称和非对称的邻居发现间隔。此外，对称发现间隔类可以进一步分类为同步和异步。\n\
  \n这可以通过一个简单的例子来理解。如果用户 `A` 经常从同一个地点乘坐公交车上班，并与大约同一组去往相同或不同地点的人相遇，那么他们的设备就可以利用这种相遇的规律，将信息传输到设备携带的不同地点。在这种情况下，消息不需要为了交付而冗余广播，并且可能在提高消息接收概率的同时节约电池寿命。这一概念已被广泛研究和采用以保证消息交付。\n\
  \n采用同步对称邻居发现间隔将使个人移动无线设备能够保存可能的邻居，并通过在每个设备上同时启动对称邻居发现来发现其他设备。例如，`IMPALA`（Liu and\
  \ Martonosi, 2003）和 `CENWITS`（Huang et al., 2005）使用 GPS 辅助的时间校准和定期运行调度来同步对称邻居发现间隔。因此，它们同时开启接收器启动通信，而没有扫描网络的负担。然而，缺点是如果两个设备在彼此范围内，但它们的对称发现间隔没有重叠，它们的相遇将被完全错过。\n\
  \n另一种使用方法是异步-对称方法。这两种方法允许设备选择对称邻居发现间隔的时间。例如，`STAR`（Wang et al., 2009）和 `DWARF`（Izumikawa\
  \ et al., 2010）允许不同的参与者具有不同的相遇模式。它们的发现间隔被称为探测间隔。\n\n同样，自主邻居发现是完全不同的策略，自主邻居发现设备在大部分时间内关闭无线电，但仍能保证设备之间新的相遇会被发现。\n\
  \n#### 8.4.1.4 对内容类型的兴趣\n\n\n\n\n\n还可以根据所连接的用户上下文的知识量（Pelusi et al., 2006）通过智能路由来节省能量。上下文可能包含如缓冲区大小、密度、剩余能量和网络带宽等属性。传统上属于栈较低层级的信息（如链路可用性、接触机会和通信成本）也成为了中间件操作的基础，而较低层级也可以从由中间件管理的上下文信息中获益。社交感知中间件是一种内容共享服务，它利用用户社交关系来优化数据分布，以最大化将内容传递给感兴趣的用户的概率（Conti\
  \ et al., 2010）。该策略寻找与目的地的已知上下文属性匹配度不断增加的节点。高匹配度意味着节点与目的地上下文之间具有高相似性，因此该节点将消息带入目的地社区的概率较高。他们还考虑了人们不太可能随机移动。相反，他们根据不同时间尺度（天、周、月）上重复的行为模式以一种可预测的方式移动。如果一个节点以前访问过某个地方几次，那么它在未来很可能再次访问该位置（Boldrini\
  \ et al., 2010）。像 CAMEO（Arnaboldi et al., 2014）这样的中间件通过用户移动性以及具有共同兴趣、习惯和需求的用户之间的机会性无线通信所产生的额外交互机会，扩展了在线社交网络的范式。该类下的数据转发方案分为上下文无感知、部分上下文感知和全上下文感知。\n\
  \n#### 8.4.1.5 基于基础设施的节约\n\n与利用节点移动性和接触模式类似，在无线热点的帮助下，用户移动性也可用于数据包传输、包路由和无线操作决策，而不是仅仅依赖蜂窝网络。理想情况下，节点扩展其无线信号覆盖范围以连接节点并形成链路。这些设备形成的移动自接网络（MANETs）可用于发送和路由延迟不敏感的数据包。这将为移动设备在使用低功耗无线电的情况下提供更长时间的丰富的通信能力，从而节省能量（Su\
  \ et al., 2004）。\n\n### 8.5 用于优化能耗的定制路由协议\n\n由于节点在无基础设施的机性网络（OMNs）中完成下一跳选择的所有计算，消耗了大量的电池电，这缩短了网络寿命（Lilien\
  \ et al., 2006）。因此，应为这类网络中的消息传递选择合适的节约能量路由协议。链路的自形成本质以及节点参与通信的情况会影响节点自身的电池储备。现有算法通过优化路由方案强制实施节约。因此，路由协议可以根据其计划实现能量优化的方式分类。到为止，已提出了许多路由协议来处理机会性网络的高度动态环境。我们可以将路由协议分为两大大类：\n\
  \n*   基于转发的方法\n*   基于泛洪的方法\n\n#### 8.5.1 基于转发的方法\n\n该方案采用单副本方法，即仅创建一个消息副本，并通过中间节点转发到目的节点。在这种方法中，节点根据某些知识选择最佳路由将数据包发送到目的节点。基于转发的方法可以分为三个主要类：直接传输、基于位置和基于知识。\n\
  \n**直接传输**：直接传输（Direct transmission）（Spyropoulos et al., 2005）是最简单的路由协议之一。在这种情况下，会创建一个消息单副本，且源节点仅在遇到目的节点时才转发数据包。因此，这种方法的延迟非常高，但对缓冲器的需求逐渐变得小得多。\n\
  \n**基于位置的方法**：在这种方法中，节点选择离自己最近的邻居并将数据包转发给最近的邻域节点。移动节点运动矢量（MoVe）（LeBrun et al., 2005）利用节点的相对速度来寻找节点之间的最近距离，以预测它们的未来位置。根据预测的未来位置，消息被转发到离目的节点最近的移动节点。在这种方法中，带宽需求少于流行病路由，但交付延迟更高。\n\
  \n**基于知识**：在基于知识的策略中，源节点和中间节点决定哪个节点必须转发消息，以及是应该立即传输消息还是保留消息直到遇到更好的节点；此决策是基于关于网络的某些知识。Jain\
  \ 等人（2004）提出了基于知识的路由策略，其基本思想是利用网络知识将传统的最短路径路由技术应用于机会性网络（OMN）。\n\n其他路由策略还包括上下文感知路由（CAR）策略（Musolesi\
  \ et al., 2005），其中计算节点的递送概率并将消息转发给递送概率更高的节点。节点之间定期交换递送概率，以便为每个目的节点计算最佳承载者。MaxProp（Boldrini\
  \ et al., 2010; Burgess et al. 2006）是一种基于优先考虑传输到其他节点的包调度，以及当缓冲区满时调度丢弃数据包的路由协议。在这里，包的调度是根据历史数据到对等节点的路径概率。最短预期路径路由（SEPR）策略（Tan\
  \ et al., 2003）根据历史数据估计链路转发概率。它计算有效路径长度（`EPL`），并在两个节点相遇时接收到较小的 `EPL` 值时更新本地 `EPL`\
  \ 值。\n\n#### 8.5.2 基于泛洪的方法\n\n基于泛洪的路由协议是一种多副本的策略。在这种方法中，持有数据包的节点向所有邻域广播其数据包。此过程持续直到数据包递送到目的节点。\n\
  \n流行病路由（Epidemic routing）（Vahdat and Becker, 2000）用于在连接高度间性的 OMN 中转发数据。流行病路由类似于泛洪方法，因为在该方法中消息由节点广播到所有邻域，但具有某些局限性。在传播过程中，生成的每条消息都被分配一个\
  \ `hop count`（跳数），并且每个节点的缓冲区空间受到限制以实现这些限制。流行病路由使用了用于同步重复数据库的流行病算法（Rodrigues et al.,\
  \ 2011）。\n\n另一种类似的技术称为喷洒与等待（spray and wait）（Spyropoulos et al., 2004），它是泛洪方法的变体，限制了泛洪范围。基本上它包含两个阶段：喷洒阶段和等待阶段。在喷洒阶段，节点生成数量为\
  \ `N` 的副本，并随机传播到其一跳距离内存在的邻居中。在等待阶段，如果没有找到目的地，节点将执行直接传输。这种方法的主要局限性是中间节点是随机选择的，它们未能实现节点的社交行为。因此，为了增强路由策略的性能，未来的接触预测起着至关重要的作用。\n\
  \n\n\n\n\n```markdown\n概率路由协议（`PROPHET`）利用遭遇历史和传递性（`Lindgren et al., 2003`）进行预测。在此协议中，节点估计每个可用路由或通往目的地链接节点的概率，并利用这些信息决定哪个节点必须传输其消息，以及是否应该存储数据包并等待更好的转发消息的机会。基于历史的机会性协议（`HiBOp`）不仅使用一组预定义的上下文信息，还使用用户希望提供的任何信息来描述其当前上下文（`Boldrini\
  \ et al., 2007`）。这意味着每个节点都应该自动学习并记住其当前上下文。随后，上下文数据将输入算法，以决定通往最终目的地的下一跳。\n\n## 8.6\
  \ 现有路由协议在能耗背景下的性能分析\n\n所有协议在稀疏网络中的表现都相似：随着连接性的降低，递送率下降且延迟增加。消息的递送依赖于预测的通信机会序列，这被为\
  \ `contact`。大多数协议的目标是最大化数据交付并最小化延迟。\n\n基于转发的方法的主要缺点是延迟高和递送率低，但所需的缓冲区和流量也随之减少，因此所需的带宽少于基于泛洪的方法。同样，在泛洪方法中，如果网络流量增加，带宽需求会增加，与基于转发的方法相比，缓冲区的需求也会增加。相比之下，泛洪方法由于创建了多个消息副本并向邻居广播，其递送延迟会降低。\n\
  \n### 8.7 现有研究与里程碑\n\n成功应用 `OppNets` 的当前研究应用（`Xi and Chuah, 2009`）可以总结为：\n\n* `ZebraNet`\
  \ 系统，已在 Mpala 研究中心实施，目前正在测试中。\n* `共享无线信息站模型`（`SWIM`），其基于对鲸鱼的监测。\n* 印度的 `DakNet`\
  \ 项目。`OppNet` 用于为农村和发达地区提供间歇性互联网连接，成为帮助缩小数字鸿沟的唯一负担得的方式。\n* `萨米网络连接`（`SNC`）项目，旨在为居住瑞典、挪威和芬兰西北部\
  \ `Sápmi` 地区（也称为拉普兰）的游牧萨米驯驯驯牧民族提供网络连接。为萨米人提供网络连接使他们能够按照传统继续生活，同时通过远程工作和基于网络的业务获得经济维持。\n\
  \n## 8.8 持续的研究挑战\n\n因此，`OMN` 考虑了无线网络几乎的所有特性，如用户的移动性、自组织节点连接与链路、频繁的断开、网络分区和链路不稳定，到目前为止，这些特性在无线网络场景中被视为“异常”。这些特性需要特殊的路由协议和能量管理技术。尽管\
  \ `OppNets` 似乎是解决持续移动性通信的可行方案，但在现实环境中部署 `OppNet` 面临着若干挑战。仍在严格开发中的某些领域包括：\n\n* 安全与隐私\n\
  * 数据缓存\n* 内容扩散\n* 上下文与位置感知\n\n已经提出了几种将 `OMN` 表示最优路由的模型，捕捉了 `OMN` 节点的不同特征。然而，仍有许多工作需要完成，以包含以人为的行为并优化网络。\n\
