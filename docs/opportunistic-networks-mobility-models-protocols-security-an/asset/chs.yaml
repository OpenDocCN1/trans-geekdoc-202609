  \ 发送窗口与确认\n#### 9.3.1.5 性能\n#### 9.3.2 SlideOR\n#### 9.3.2.1 概述\n#### 9.3.2.2 编码与解码机制\n\
  #### 9.3.2.3 滑动窗口过程\n#### 9.3.2.4 性能\n\n## 9.4 研究方面\n\n## 参考文献\n## 进阶阅读\n\n### 9.1\
  \ 引言\n网络编码（`NC`）是一种让路由器、交换机等网络元素在将数据包通过通信信道之前对其进行混合的技术，最终减少数据包的传输次数。根据即时权威节点的不同，在节点处混合的数据包可能属于相同源，也可能属于不同源。`NC`\
  \ 打破了传统的网络流量假设，即信息是相互分离的，但可能共享网络资源。相反，信息混合提供了更高的网络吞吐量、对链路故障更强的健壮性（鲁棒性），以及对攻击和窃听的更强韧性。`NC`\
  \ 用于实现最大的可能信息流，以接近香农容量极限。它最初为有线网络提出以解决瓶颈问题，但链路的多样性和广播特性使其在无线网络中更具吸引力。\n\n另一方面，机会性网络（`OppNets`）（Pelusi\
  \ 等人, 2006; Huang 等人, 2008; Rodriguez Aranguren, 2013）基于配备蓝牙和 Wi-Fi 等短距离无线传输技术的设备之间的自发交互与协作。它在移动节点处于通信范围内的任何时候利用机会，让它们相互发现并异步交换信息。每个节点利用任何能让数据更接近实际目的的机会。由于“存储-携带-转发”范式，`OppNets`\
  \ 仅适用于延迟容忍网络。单个节点的意图是在邻域内通过最佳下一跳分发数据，以便在实际目的地成功送递，而在这种情况下，通信节点之间的端到端路径即使存在，也是罕见或不可预测的。\n\
  \n\n\n\n在传统的数据包传输中，源节点将消息拆分成数据包并通过介质进行传输。数据包沿着不同的路径路由，但它们都必须到达目的节点，数据包在该处重新组装成原始消息。在高流量网络中，这种方法最常见的问题是瓶颈，会导致丢包、延迟等，从而大幅降低网络吞吐量。此外，通信端之间的极少数路由和节点可能会拥堵，而其他节点仍处于低利用状态。\n\
  \n网络编码（NC）最早由 Yeung 和 Zheng 于 1999 年底引入，作为各种相互独立的源之间路由的替代方案（Ahlswede, 2000）。它是一种传输技术，用于在源节点累积各种数据包并在目的节点解封装接收到的包。在\
  \ NC 中，传统的路由器和交换机配备了编码器/解码器，使其能够机会性地监听介质并对多个包进行编码，而不仅仅是按到达顺序进行转发。多个包的合并取决于节点的编码机会，而这本身又取决于其输出缓冲区以及此时邻居节点的信息。如果存在机会，节点将编码多个数据包并在一次传输中发送给实际接收者或下一跳（即更接近实际接收者）。\n\
  \n令 `V` 表示可以作为编码器和解码器的节点集，`E` 表示节点之间的连接集，那么图 9.1 中的图 `G = (V, E)` 阐述了一个无噪信息交换的点对点通信网络。图中的每个节点都可以从所有密集的且相互独立的源中收集信息，对其进行编码并转发到输出链路（无线网络）或输出链路组组（有线网络）。\n\
  \n![](img/fig9.1.jpg)\n\n图 9.1\n\n表示流网络的图。\n\n节点 `s [i]` 表示第 `i ^(th)` 个源站，`d [i]`\
  \ 表示子网络的第 `j ^(th)` 个目的站。节点 `1`、`2`、`3` 等是中间中继路由器或交换机，能够分别对出站和进入的数据包进行编码和解码。箭头表示网络中的数据流，每条链路具有不同的比特率容量。`s\
  \ [i]` 和 `d [j]` 之间的信息交换通过中继节点完成，这些节点位于两者的通信范围内，因此在将其放入输出链路之前利用了编码机会。\n\n网络编码的优势也可以从图\
  \ 9.2 中看出，图中在单个通信范围内有一个源和两个目的节点；这被著名的蝴蝶网络。\n\n![](img/fig9.2.jpg)\n\n图 9.2\n\n(a)\
  \ 无网络编码和 (b) 有网络编码的蝴蝶网络。\n\n在图 9.2 (a) 中，数据包 `p [1]` 和 `p [2]` 分别指向目的地 `d [2]` 和\
  \ `d [1]`。节点 `3` 和 `4` 充当包 `p [1]` 和 `p [2]` 的中继。如果没有编码方案，节点 `3` 和 `4` 将通过两次独立的传输发送两个数据包，因此总共需要四个传输周期才能完成；而在图\
  \ 9.2 (b) 使用 NC 的情况下，节点 `3` 和 `4` 在将包发往目的地之前对其进行编码。NC 仅需两个传输周期，即节点 `3` 发送一次编码包 `b\
  \ [1] + b [2]` 的传输，以及节点 `4` 为同次通信发送另一次相同的编码包。因此，与无编码相比，NC 展示了在小拓扑结构中通过混合包来节省 50%\
  \ 带宽的机主义和智能行为。`+` 表示 NC 运算符，将在下一节中介绍。\n\n近年来，随着通信服务在现实生活中变得日益重要，NC 在高效信息交换中发挥着重要作用。机会性网络（OppNets）为高移动性设备之间提供了短距离连接，由于节点之间密切接触，NC\
  \ 联盟保证了最大的数据传输。蜂窝网络、Wi-Fi、无线传感器和 Mesh 网络、移动自组网络（MANETs）、车载自组网络（VANETs）、Wi-max 等主流网络受编码感知型\
  \ OppNets 的影响更大。\n\n## 9.1.2 网络编码的分类\n\n图 9.3 显示了取决于若干参数的网络编码方案分类。第一类基于中间节点处进入数据包的前一跳（或前几跳）。在任何时刻，网络中不同的通信对之间都存在多个信息流。第一类\
  \ NC 是会话间的（inter-session），它允许来自不同会话（源）的数据包混合。它解决了瓶颈障碍并减少了传输次数，从而提高了网络吞吐量。然而，会话内的（intra-session）是另一类，它允许单个会话（源）的数据包融合。它有助于通信端之间可靠的对话，相比之下，传统的传输方式以反馈机制的形式消耗带宽。\n\
  \n![](img/fig9.3.jpg)\n\n图 9.3\n\n网络编码分类。\n\n分类 NC 的另一个视角是多个包的融合（编码）和将一个包拆分为多个包（解码）。基于数学运算的随机线性（RL）编码创建了形式为\
  \ $\\underset{i}{\\overset{k}{\\Sigma}}\\alpha_{i}p_{i}$ 的复杂编码包，其中随机系数 `α[i]` 在有限域上选取，`p[i]`\
  \ 表示原始或编码包。相比之下，基于二进制运算的异或（XOR）编码执行逻辑运算 `⊕`，产生一个简单的编码包。\n\n从另一个方面，我们可以根据编码包在源到目的路由中间跳的处理方式来对编码技术进行分类。在通信节点之间传输时，编码包可以在每个中间跳解码，也可以仅在目的地解码，根据此，编码方案属于局部或全局。事实上，二进制异或偏好逐跳的（局部）编码和解码，而\
  \ RL 采用了主机到目的地的（全局）编码方案。\n\n## 9.2 会话间网络编码\n\n会话间 NC 在中间节点采用编码解码能力的情况下，将无线介质的广播特性视为一种机会。延迟容忍型\
  \ OppNets 的节点在中间跳中继数据包之前，可以有更多的时间以更有利的方式利用编码机会。本节将讨论与机会性网络兼容的相关技术，以及其工作原理、实现细节和性能分析。\n\
  \n### 9.2.1 COPE\n\n在文献中，引入了一种名为 COPE 的机会性 NC（Katabi et al., 2006; Katti et al.,\
  \ 2006），它桥起了多跳无线网网中突发流和单播流的理论与实际概念。基于二进制异或的 COPE 提高了每次传输的信息量，根据流量模式、拥塞程度和传输层协议，极大提升了网络吞吐量，从百分之几增加到几倍。COPE\
  \ 在互联网协议（IP）和介质访问控制（MAC）层之间插入了一个编码垫层，它识别路由中间跳的编码机会并利用这些机会在单次传输中转发多个包，从而节省了大量带宽（图\
  \ 9.3）。\n\n#### 9.2.1.1 概述\n\n\n\n\n\n为了利用机会性网络（OppNets）中的编码机会，`COPE` 在网络栈中集成了一个新层。它整合了三项主要技术：\n\
  \n1. **机会性监听（Opportunistic listening）**：每个节点都会旁听无线信道，并在有限时间内（0.5 秒）缓存数据包，无论这些数据包是否是发送给它们的。由于无线介质的广播特性，通信范围内的直接下一跳节点可以感知到中继节点传输的数据，并将其保留以备后续的编码机会。因此，`OppNet`\
  \ 节点需要定期监听介质。\n\n2. **机会性编码（Opportunistic coding）**：从介质感知到新的数据包后，节点会在将其发送到空中之前寻找与缓冲区中数据包结合的机会。如果不存在机会，它将单独传输数据包以避免数据延迟。\n\
  \n3. **学习邻居状态（Learning neighbor’s state）**：包编码取决于其在目的地的解码程度。因此，每个节点都会探索其邻居的缓冲区池。事实上，网络元素定期将接收报告（即最近接收的数据包的知识）发送给其邻居。\n\
  \n机会性网络中网络编码的一个基本前提是在一个通信范围内至少有三个节点，如图图 9.4 所示。它代表了 `OppNet` 的一小部分并解释了机会性 `COPE`\
  \ 的工作原理。节点 `s [1]` 和 `s [2]` 分别向目的节点 `d [2]` 和 `d [1]` 交换数据包 `p [1]` 和 `p [2]`。图中可以清楚地看到无线通信范围。目的节点\
  \ `d [2]` 不在 `s [1]` 的范围内，同样，`d [1]` 在节点 `s [1]` 的传输范围内，但所有四个节点（即通信对 `s [1]`、`d\
  \ [2]` 和 `s [2]`、`d [1]`）都在节点 `r` 的同一个广播范围内。因此，`s [1]`、`d [2]` 与 `s [2]`、`d [1]`\
  \ 之间的通信可以通过节点 `r` 进行中继，该节点从相应的源-目的对发送数据包。\n\n![](img/fig9.4.jpg)\n\n图 9.4\n\n对 `COPE`\
  \ 的理解。\n\n此外，在没有网络编码方案的情况下完成通信所需的包传输如下：\n\n1. 源节点 `s [1]` 将数据包 `p [1]` 交给中继节点 `r`（第\
  \ 1 传输）。\n2. 源节点 `s [2]` 将数据包 `p [2]` 交给中继节点 `r`（第 2 传输）。\n3. 中继节点 `r` 向目的节点 `d\
  \ [2]` 发送数据包 `p [1]`（第 3 传输）。\n4. 中继节点 `r` 向目的节点 `d [1]` 发送数据包 `p [2]`（第 4 传输）。\n\
  \n在源-目的对 `s [1,]` `d [1]` 和 `s [2,]` `d [2]` 之间交换数据包 `p [1]` 和 `p [2]` 需要的累计传输为四次。相反，考虑使用机会性\
  \ `COPE` 方案的通信场景：\n\n1. 源节点 `s [1]` 向中继节点 `r` 单播数据包 `p [1]`，该包可以被邻居节点（即 `n [2]`、`n\
  \ [3]` 和 `d [1]`）机会性旁听到（第 1 传输）。\n2. 源节点 `s [2]` 向中继节点 `r` 单播数据包 `p [2]`，该包可以被其周围邻居（即\
  \ `n [1]` 和 `d [2]`）机会性旁听到（第 2 传输）。\n3. 此外，中继节点 `r` 使用 `XOR` 操作结合接收到的包 `p [1]` 和\
  \ `p [2]` 并在通信介质上广播，其直接下一跳（例如 `d [1]` 和 `d [2]`）可以听到它（第 3 传输）。\n4. 目的节点 `d [1]`\
  \ 和 `d [2]` 将从中继节点 `r` 接收的编码包与从源 `s [1]` 和 `s [2]` 旁听的包进行 `XOR` 操作，以解码各自的数据包 `p\
  \ [2]` 和 `p [1]`。\n\n上述对 `COPE` 的演示仅需三次传输，且显而易见地带有很小的 `XOR` 操作开销。事实上，`COPE` 能够节省更多带宽，正如稍后在该小节中讨论的示例所示。正因如此，对邻居传输的短时间旁听和缓存，以及邻居缓冲区知识的更新（即定期获取接收报告），使得机会性编码对\
  \ `OppNets` 有益。\n\n### 9.2.1.2 包编码 #chapter9.xhtml#re-ch-9-sec-7\n\n`COPE` 方案已经处理了一些设计问题，以避免在与现有网络栈集成时产生副作用。首先是无任何延迟传输数据包的原则。`COPE`\
  \ 足够智能，可以在将多个包放入空中之前对其进行编码，但同时由于每次传输前的编码和解码过程确保了包延迟。在没有编码机会的情况下，节点将单独传输包，而不是等待可编码的匹配包。\n\
  \n其次，`COPE` 优先对长度相同的包进行编码。不等长度数据包的 `XOR` 操作会增加带宽消耗。反之，单个节点维护一个先进先出 (`FIFO`) 输出队列来存储其自己的数据包。\n\
  \n第三，`COPE` 仅对发送相同下一跳的包进行编码。如果存在编码机会，节点会查询匹配包的虚拟队列头部。注意到，不等大小的包可以进行零填充以利用 `COPE`\
  \ 编码机会，但这可能导致带宽利用率降低。\n\n重序是 `COPE` 在接收端解码时的另一个问题。在实践中，由于传输控制协议 (`TCP`) 流的数据包足够大进入队列，重序并不罕见。但重传会导致重序，因此为了管理此类情况，`COPE`\
  \ 与排序代理调优以确保包的顺利交付。\n\n最后，`COPE` 确保目的下一跳的可解码性。中继节点估计缓冲区包被其直接下一跳听过的概率。这种概率取决于路由协议定期捕的邻居接收报告。\n\
  \n准确来说，`COPE` 在每个网络节点维护以下数据结构：\n\n1. 每个节点配备 `FIFO` 队列用于缓存转发中的包，称为输出队列。\n2. 每个节点配备两个虚拟队列，用于和小包和长包，接收邻居包的指针。\n\
  3. 节点还维护 `packet info`，这是一个哈表，以包 ID 为键，表示邻居拥有该包的概率。\n\n###### 9.2.1.3 包解码 #chapter9.xhtml#re-ch-9-sec-8\n\
  \n包解码执行与编码类似的 `XOR` 操作。每个节点维护一个日志，即包池，保留接收和发送的原始包的副本。每当节点听到一个编码包时，调度器顺序扫描包池并检索目标数据包。\n\
  \n### 9.2.1.4 包结构 #chapter9.xhtml#re-ch-9-sec-9\n\n如果路由协议包含自己的头部，编码胶合层位于路由和 MAC\
  \ 头部之间；否则，它位于 IP 和 MAC 头部之间，如图 9.5 所示。\n\n![](img/fig9.5.jpg)\n\n图 9.5\n\nCOPE 头部格式。\n\
  \n`COPE` 头部整合了以下字段：\n\n\n\n\n\n### 1. 原始包信息\n`COPE` 头部第一个段存储了原始数据包（即被编码在一起的数据包）的信息。这有助于接收端进行解码。`num_ENCODED_PKT`\
  \ 存储了节点正在编码的原始包数量。原始包的标识存储在 `pkt_ID` 中，它是数据包源地 `IP` 地址和 `IP` 序列号的 32 位哈希。`next_HOP`\
  \ 保留了数据包下一跳的 `MAC` 地址。\n\n### 2. 接收报告\n各个节点与其邻居共享其更新后的缓冲区信息，以便以最小的计算开销利用机会性编码。`XOR`\
  \ 头部中间区块以 `num_REC_RPRT` 开头；它包含了当前正在共享的报告数量。`src_IP` 和 `last_PKT` 指定了源 `IP` 地址以及从该源最近嗅探到的数据包。紧凑且健壮的\
  \ `bit_MAP` 字段容纳了与同一源最近听到的数据包对应的二进制位序列。例如，结构 `{128.0.16.28, 49, 10010001}` 的报告被解释为从该源听到的最后一个包。`128.0.16.28`\
  \ 的序列为 `49`，之前嗅探到的包是 `41`、`44` 和 `48`。对最近接收到的包发送重复报告，是为了防止其因拥塞和信道噪声而丢失。\n\n### 3.\
  \ 异步确认\n`COPE` 头部最后部分用于目的节点数据包交付的确认部分。它始于报告中容纳的确认数量。每个节点为每个邻居维护一个 16 位的计数器，称为 `neigh_count`。每当向该邻居发送数据包时，相应邻居的计数器就会加\
  \ ，其值被赋值给包作为本地序列号，即 `num_LOCAL_PKT_SEQ`，用于在通信对中标识数据包。与接收报告类似，该部分采用累积确认。每个确认包含邻居的\
  \ `MAC` 地址，随后是成功接收到的最后一个数据包的确认指针。`ack_MAP` 字段指示了之前听过但丢失的数据包。例如，确认条目 `{X, 25, 01111111}`\
  \ 证实了包 `25` 以及序列号为 `18–24` 的包。它还引用了包号 `17` 的丢失。`COPE` 会重传丢失的包几次（默认为 2 次），然后放弃。如果包在预定义时间（`Ta`，略大于单链路的往返时间）内未被确认，则该包将再次插入输出队列头部，并在利用编码机会后重传。\n\
  \n#### 9.2.1.5 性能\n`COPE` 的收益通过编码增益来衡量，即相对于非编码传输节省的传输次数，这会导致吞吐量的提升。\n\n从以下公式可以推断，编码增益大于等于\
  \ 1。\n\n$$\\text{Coding}\\,\\text{gain} = \\frac{\\text{Number}\\,\\text{of}\\,\\\
  text{transmisions}\\,\\text{against}\\,\\text{non-coded}\\,\\text{transmissions}\\\
  ,\\text{without}}{\\text{Number}\\,\\text{of}\\,\\text{transmisions}\\,\\text{with}\\\
  ,\\text{COPE}}$$\n\n\n\n\n\nBEND 的核心概念是在转发节点之间划分流量，以在机会性网络中实现高吞吐增益。它利用了对节点整个范围的过度监听，而不是像\
  \ COPE 那样仅关注少数几个共同节点来获取数据包混合机会。图 9.7 展示了两个不相交的流的示例，它们足够接近，可以利用 MAC 层捕捉到的编码机会。\n\n\
  ![](img/fig9.7.jpg)\n\n图 9.7  \n\nBEND 的概念化。\n\n在图中，数据包 `p [1]` 和 `p [2]` 分别对应通信节点对\
  \ `(A[1], B[1])` 和 `(A[2], B[2])` 的网络流 `f [1]` 和 `f [2]`，它们间隔两跳，可能分别通过中间节点 `M` 和\
  \ `N` 完成传输。数据包 `p [1]` 由节点 `A [1]` 发送至目标节点 `M`，同时被节点 `A[2]`、`X`、`Y` 和 `Z` 听到，因为它们都在节点\
  \ `A [1]` 的范围内。同样，数据包 `p [2]` 由节点 `B [2]` 发送至节点 `N`，但被 `B [1]`、`X`、`Y` 和 `Z` 窃听，因为它们是\
  \ `B[2]` 的邻域。这两个流互不相交，但紧密交叉节点 `M` 和 `N`。在这种情况下，COPE 无法找到任何编码机会，而 BEND 则协调了位于邻域（即\
  \ `X`、`Y`、`Z`）的数据包的编码和转发。BEND 并没有像 COPE 那样丢弃这些包，而是将它们存储在 MAC 层，并利用它们在未来产生编码机会。在图\
  \ 9.7 所示的通信中，`X`、`Y` 和 `Z` 中的任何一个赢得 MAC 层介质竞争的节点都可以编码 `p [1]` 和 `p [2]` 并在介质中传输。此外，目标节点\
  \ `B [1]` 和 `A [2]` 在接收到编码包及其自身的缓冲区信息后，可以解码出所需的原始数据包。\n\nBEND 的目标是通过 MAC 层促进的逐包和逐跳决策来增加编码增益，从而提高吞吐增益，即数据包可以通过不同的路径路由，以便在不同实例下通过不同的混合节点与网络中不同流的其他包寻找机会性编码。\n\
  \n### 9.2.2.2 数据包混合与队列策略](#chapter9.xhtml#re_ch-9-sec-13)\n\nBEND 促进 `XOR` 操作在单次传输中混合多个原始数据包。编码条件确保数据包\
  \ `p [i]` 的接收方缓冲区中有 `p [j]`（其中 `i ≠ j`），以便它可以通过对 `p [j]` 和编码包进行 `XOR` 操作来获取所需的原始数据包。\n\
  \n每个节点维护两个不同的 FIFO（先先出）队列，即 `Q [1]` 用于保留传输过程中目标自己的数据包，`Q [2]` 用于承载监听到的传输。具有编码能力的数据包从\
  \ `Q [1]` 和 `Q [2]` 移动到名为 `mixing-Q` 的不同队列中。这三个队列负责混合过程中的数据包匹配，如下：\n\n当网络层将新数据包\
  \ `p [1]` 传递给 MAC 层时，BEND 会遍历三个队列以寻找编码对。它总是从 `mixing-Q` 开始探索以满足两两匹配条件。如果没有找到合适的编码包，它会轮流搜索\
  \ `Q [1]` 和 `Q [2]`。它从队列头的数据包开始，移除第一个匹配的数据包并将其入队 `mixing-Q` 的队尾，连同数据包 `p [1]`。如果没有找到匹配项且该节点是\
  \ `p [1]` 的目标转发者，则将其入队 `Q [1]` 或 `Q [2]` 的队尾。`Q [1]` 和 `Q [2]` 会持有数据包直到其被传输。与 COPE\
  \ 类似，如果到预定的轮次仍未匹配编码，节点将单独传输该数据包。\n\n与 COPE 相比，BEND 的数据包匹配机制更慢且更复杂。BEND 的匹配过程不再只关注虚拟队列中最前面的数据包，还关注数据包的下一跳接收者以及之前的转发者。因此，BEND\
  \ 对内存空间有很大需求，并且复杂的队列结构。\n\nBEND 为编码包传输分配了更高的优先级，以最大化编码机会，但同时不允许非编码包传输出现饥饿。`mixing-Q`\
  \ 的优先级高于 `Q [1]` 和 `Q [2]`。调度器生成一个 0 到 1 之间的随机均匀数字。如果该数字大于 `W [x]`（一个预定义的调调权重阈值）且\
  \ `mixing-Q` 不空，则节点将通过匹配机制生成编码传输，否则调度一次非编码传输。\n\n### 9.2.2.3 数据包解码](#chapter9.xhtml#re_ch-9-sec-14)\n\
  \n网络中的节点拥有自己的缓冲区，用于存储之前转发的、产生的或从介质中听到的数据包。这些数据包供节点从接收到的编码包中提取原始数据包。当编码包到达任何节点时，它会检查该节点的\
  \ MAC 地址是否在接收者列表中。如果该节点是实际接收者，它会从头部中确定数据包 ID，并查找接收者缓冲区，通过对所需包进行 `XOR` 操作来检索目标数据包。此外，数据包可以根据编码机会与队列中的其他包进行混合。此过程不断重复，直到数据包递送到目标节点。\n\
  \n### 9.2.2.4 数据包头](#chapter9.xhtml#re_ch-9-sec-15)\n\nBEND 由 MAC 层管理，因此数据包采用 802.11\
  \ 规范（IEEE Computer Society LAN MAN Committee, 1997），但在数据头和控制头中进行了少量修改，如图 9.8 所示。数据帧头针对原始包或编码包有不同的字段排列。原始包包含源和目的\
  \ IP 地址（源和目的）以及第二下一跳的 IP 地址。该字段获取数据包下一跳的 IP 地址。编码包包含编码包的长度（`code_len`），即编码包中原始数据包的数量、所有接收者列表（目的地）以及相应的\
  \ `packet_ID`。接收者地址在自适应机会网络编码（AONC）中为 6 字节。与 COPE 类似，主机 IP 地址和 IP 数据包序列号的哈希生成 4\
  \ 字节长的包 ID。帧控制字段类型和子类型位对应于原始包、编码包、确认（ACK）、否定确认（NACK）或其他 802.11 帧。当编码包到达接收者时，它通过遍历缓冲区的数据包来检查包的可解码性。如果发现编码包可解码，接收者将发送\
  \ ACK 或 NACK。此反馈帧包含数据包的源 IP 地址以及已确认或否定确认包的包 ID。由于 BEND 在多个转发者处产生数据包副本，ACK 帧用于清除之前跳数中已递送包的所有副本（图\
  \ 9.8）。\n\n![](img/fig9.8.jpg)\n\n图 9.8  \n\n修改后的 MAC 头。\n\n### 9.2.2.5 性能](#chapter9.xhtml#re_ch-9-sec-16)\n\
  \nBEND 解决了编码与扩散增益之间的困境，这种平衡无法通过感知编码路由和 COPE 同时实现。由于链路层在多跳机会性网络中动态地将流量分散到许多转发者，从而带来了编码机会的收益。这种流量的扩散被称为“扩散增益”。\n\
  \n\n\n\n\n在三层网络架构中，随着第 2 层节点数量的增加，`BEND` 相比于 `COPE` 始终具有更高的增益（约 55%–97%）。`BEND`\
  \ 的仿真结果证明，具有两个及以上原始数据包的编码机会远高于现有的 `COPE`。`BEND` 的性能在重度多跳流量（即通过网络中多个中间节点的海量流）下表现非常出色。由于\
  \ `BEND` 利用了机会性 OppNets 中的数据包冗余，而 UDP 接收端的数据包重复与 `COPE` 一致。\n\n#### 9.2.3 AONC\n\
  \n尽管 `COPE` 和 `BEND` 证明了它们提升网络吞吐量增益的能力，但它们无法有效支持视频数据通信。研究提出了一种带宽和能量高效的 `AONC` (Shen\
  \ 等人，2012) 方案，用于提升基于多媒体的 OppNets 中视频流的传输质量。传统数据传输与实时视频数据传输之间的根本差异启发了 `AONC`。`AONC`\
  \ 的流量感知数据调度算法与现有网络编码技术的特殊功能协同工作。\n\n#### 9.2.3.1 概述\n\n`AONC` 受 `COPE` 启发，并执行类似的\
  \ `XOR` 操作进行数据包混合，但采用的是非对称方式。为了理解 `COPE` 和 `AONC` 之间的概念差异，请考虑 [图 9.9] 所示的简单示例。缓冲在输出队列中的不等长度数据包被分为三个数据集，即\
  \ `data 1`、`data 2` 和 `data 3`。假设任意两个数据集都符合编码标准。[图 9.9] (b) 显示了在对称模式下使用 `XOR` 操作的随机编码数据包。由于长度不一（这在视频数据流量中非常常见），数据包被填充零以匹配最长的数据包，这最终导致了带宽介质的浪费。在这种情况下，节点需要传输三次。而非对称模式编码，基于非对称模式的\
  \ `AONC` 利用了变长数据数据包的优势，从而实现了对带宽的有效利用。在 [图 9.9] (c) 中，同一流的视频数据包首先进行拼接，然后根据编码匹配条件与其他流的数据包合并。[图\
  \ 9.9] (c) 显示，对于 [图 9.9] (a) 所示的数据集仅需一次传输，而传统的对称编码方法 `COPE` 需要三次。\n\n![](img/fig9.9.jpg)\n\
  \n图 9.9\n\n传统编码方案（即 `COPE`）与 `AONC` 的对比。\n\n`AONC` 考虑到变长视频数据包，对编码数据包考虑动态优先级分配，而\
  \ `COPE` 在调度中将编码传输标记为高优先级。`AONC` 与对称模式编码的另一个主要区别是传输前对视频数据的压缩技术。压缩视频流具有非常复杂的流量特征，因此基于\
  \ `FIFO` 的调度机制丢失了编码机会。\n\n#### 9.2.3.2 协议机制\n\n传统的对称编码和数据调度方法由于视频流量在网络中不同的数据行为，降低了\
  \ OppNets 的性能。同时，编码数据包的优先级分配方法也是合理的。`AONC` 的基本机制包含以下部分：\n\n1. 采用非对称编码方法来增强数据交换增益。数据交换增益是通过成功的编码数据包交换而减少的传输次数。\n\
  2. 设计了具有动态优先级的机会性传输策略以提高网络吞吐量。\n3. 使用流量感知数据调度算法来减少编码机会的损失。\n\n`AONC` 是一种面向流的编码机制，即它将来自前一个转发器和下一跳接收器的数据包分组为一个流，并将其存储在该流的专用输出队列中。当一个流通过中间节点传输且流的数据包在传输过程中具有编码机会时，该流被称为“编码流”。`AONC`\
  \ 从预定义的编码流组的每个流中选择数据包并对其进行切片。这些数据包切片混合在单次传输中，从而增加了单次传输的信息量。\n\n`AONC` 基于机会编码的转发策略基于动态优先级分配。编码数据包的动态优先级设置取决于数据交换增益和空间利用率。空间利用率是\
  \ `AONC` 中用于估计编码数据包处理的实际数据量的指标。与 `BEND`（为编码数据包分配更高优先级）不同，`AONC` 使用动态优先级来表示编码数据包的重要性程度。通过这种方式，空间利用率较高的编码数据包以较高的优先级传输。因此我们得出结论：具有编码机会和更好空间利用率的节点高概率捕获通信介质。\n\
  \n除了对 `BEND` 的改进外，还使用了流量预测机制来预测接入流量的量。`AONC` 显著增强了视频包的传输质量，并在带宽利用上获得了显著收益。\n\n###\
  \ 9.2.3.3 数据包头部\n\n`AONC` 在 `MAC` 层执行数据包的编码/解码和标记。它对 `IEEE 802.11` 头部进行了修改，以提供实时视频传输。[图\
  \ 9.10] 显示了 `AONC` 的头部。\n\n![](img/fig910.jpg)\n\n图 9.10\n\nAONC 的修改后的头部。\n\n`destination[CFN]`\
  \ 包含原始数据包的接收者地址，其中 `CFN` 是编码数据包的流。`NUM_packet[CFN]` 代表属于该编码流的数据包数量。`INFO_packet[CFN][NUM_packet[CFN]]`\
  \ 记录了编码数据包中的原始 ID 和长度列表。数据包 ID 的计算方式与 `COPE` 类似。`ACK` 帧增加了一个字段，即 `INFO_packet[NUM_packet]`，用于一次性反馈多个切片单元。\n\
  \n#### 9.2.3.4 性能\n\n与 `BEND` 和 `COPE` 相比，`AONC` 的动态特性提供了网络吞吐量的增强以及视频传输的稳定性。`AONC`\
  \ 的平均峰值信噪比 (`PSNR`) 值高于其他策略（如 `BEND`、`COPE` 或 `802.11`），证明了其更高的可靠性和视频传输质量。`AONC`\
  \ 的视频质量接近原始非编码传输序列，这是一种几乎无错误的传输。`AONC` 的编码机制和数据调度方案比 `BEND` 和 `COPE` 更好的网络带宽利用率，避免了通信介质中的丢包问题。\n\
  \n\n\n\n上一节讨论的编码技术是跨会话的，而 ExOR (Biswas & Morris, 2005)、MORE (Chachulski et al.,\
  \ 2007)、MIXIT (Katti et al., 2008)、机会性路由中的编码 (CodeOR) (Lin et al., 2008) 以及 SlideOR\
  \ (Lin et al., 2010) 都是基于会话的网络编码技术。机会性路由通过利用共享无线广播介质提高了 `OppNets` 的单播网络吞吐量。但另一方面，它面临着多个中间节点转发不必要的重复包，以及源到地之间单条转发路径过载的挑战性问题。`ExOR`\
  \ 使用了大量的控制包和复杂的数据包调度算法来避免数据包重复。然而，一种更可行且实用的方法被称为 `MORE`，它在发送窗口中使用随机网络编码和停止-等待协议。它的继任者\
  \ `MIXIT` 在损性无线介质中获得了更高的吞吐量，但使用了相同的停止-等待机制，因此在大规模网络中具有相同的缺点。\n\n接下来的小节将介绍 `CodeOR`\
  \ 和 `SlideOR` 编码技术，这些技术特别适用于无线网格网络中的单播实时多媒体数据流量。\n\n#### 9.3.1 CodeOR\n\n随机网络编码的计算复杂度随着数据包数量的增加而增加。计算复杂度的限制和带宽利用率低的问题启发了\
  \ `CodeOR`；这是一种分段网络编码方案，数据流被划分为若干段，并在同一段内执行包编码。`CodeOR` 允许发送节点使用机会性路由协议广播多个段的滑动窗口。\n\
  \n#### 9.3.1.1 概述\n\n`CodeOR` 通过在机会性路由中使用流控制以及将数据流划分为多个段的分段网络编码，提高了实时多媒体流量的网络吞吐量。多个小段并发传输，但按顺序方式进行。`CodeOR`\
  \ 通过改变段大小和窗口大小来减少解码延迟并增加吞吐量。它结合了机会性路由和分段网络编码的优点。\n\n#### 9.3.1.2 协议机制\n\n`CodeOR`\
  \ 灵感源于 `MORE` 协议。协议机制如图 9.11 所示。图中所示的网络部分同时有 (k-1) 段、k 段和 (k+1) 段在传输中。`CodeOR` 的详细工作原理将在后续章节介绍。\n\
  \n```\nimages/fig9.11.jpg\n```\n图 9.11\n\n`CodeOR` 的工作原理：段 k-1、k 和 k+1 的并发但顺序的传输。\n\
  \n#### 9.3.1.3 CodeOR 动机\n\n在 `MORE` 中，节点无论目的地如何都持续传输，直到获得足够数量编码包来解码该段，因此它会很晚才开始传输下一段。`CodeOR`\
  \ 的动机是只要目的地接收到解码该段所需的包数量，立即停止该段的传输，并比 `MORE` 更早开始传输下一段。`MORE` 协议传输一个段并等待其确认，而 `CodeOR`\
  \ 允许多个段在空中。`CodeOR` 的工作原理如图 9.11 所示，在源节点 s 和目的节点 t 之间的通信中，(k-1) 段、k 段和 (k+1) 段同时“在途中”。来自源\
  \ s 的数据流段被广播并由 1 跳下游邻居节点 a、d 和 i 接收，以便转发给它们的下游邻居。当邻居节点获得了足够解码该段的编码包时，源 s 在前一个段“在途中”时开始传输下一段。\n\
  \n#### 9.3.1.4 发送窗口与确认\n\n在多跳通信中，链路带宽各异，需要知道节点正在转发的数据包数量，以便接收节点不会被过载。如果上游邻居发送包的速率高于接收节点向其下游邻居发送的速率，接收节点可能会因为缓冲区溢出而丢弃包。发送窗口限制了源端缓冲区中任何时刻可以传输的段数量。\n\
  \n由于有多个包并发在空中，`CodeOR` 实现了两种确认机制。第一个是端到端确认 (`E-ACK`)，由目的地通过最短路径发送给源，以通知数据包段已到达目的地。第二个是跳跳确认\
  \ (`H-ACK`)，供中间节点用于指示上游节点，当前段已接收到足够数量的编码包，可以移动到下一段。在图 9.11 中，当源 s 的 1 跳邻居 a、d 和\
  \ i 获得了当前段足够的编码包时，它们将发送 `H-ACK` 包以通知上游节点（即 s）开始传输下一段。\n\n#### 9.3.1.5 性能\n\n观察到，由于段的并发传输，`CodeOR`\
  \ 比其前身 `MORE` 获得了更高的吞吐增益。随着源和地之间跳数的增加，`MORE` 变得效率低下，而 `CodeOR` 利用所有网络资源允许并发数据传输。理想情况下，发送窗口大小应等于源和地之间的延迟带宽积。`CodeOR`\
  \ 随着窗口大小增加而增加，长路径可达 6，而短路径则保持不变。\n\n#### 9.3.2 SlideOR\n\n`MORE` 提供了一种停止-等待机制，反映了中间节点冗余包过度收听与极少数节点转发包时源地之间路径匮乏之间的极端权衡。当源节点停止传输特定段的编码包时，移动到下一个节点是一个开放性挑战。此外，`CodeOR`\
  \ 通过流水线方式传输多个段部分解决了这一开放问题，但在 `CodeOR` 中决定移动新段传输的时间是极具挑战性的。\n\n#### 9.3.2.1 概述\n\n\
  `SlideOR` 通过在重叠的滑动窗口中编码源包来解决这个问题。此外，`SlideOR` 灵感源于在线网络编码，与分段编码（一段的编码包无法解码下一段）相反，不同滑动窗口的编码包在\
  \ `SlideOR` 协议中相互有利。实现基于两个关键问题：\n\n1. 滑动窗口移动多远（即快/慢）。\n2. 下跳可能会以不同的滑动窗口位置重新编码接收到的包，这可能会增加编码复杂度。\n\
  \n#### 9.3.2.2 编码与解码机制\n\n传输节点的数据流被分为包，并分配一个序列号作为该包的标识。在任何时刻，当源节点赢得传输槽位的竞争且 MAC\
  \ 层允许传输时，源节点随机编码输出缓冲区中的某些连续包，这被称为滑动窗口大小。因此，编码算法产生编码包 x 如：\n\n```\nx = \\sum_{i =\
  \ k}^{k + W} \\alpha_i E_i\n```\n\n\n\n\n其中 `k` 是下一个数据包 `E` 的序列号，`α` 是从伽罗斯域（如 `GF\
  \ (2⁸)`）中随机选择的系数。\n\n任何节点对接收到的数据包的解码类似于求解线性方程组，因为每个编码数据包都是前一跳源数据包的线性方程。每个节点都需要随编码数据包传输编码系数，以便进行后续解码过程。\n\
  \n#### 9.3.2.3 滑动窗口过程\n\n在成功接收新的编码数据包后会执行反馈机制。`SlideOR` 使用的假设是通信节点之间 `ACK` 包的传输是可靠的。目的节点通过源目的最短路径向源节点发送\
  \ `ACK`，携带下一个预期数据包的序列号。该序列号用于推进源站的窗口。因此，很容易看出，在顺序包传输中，源在接收 `ACK` 帧后将窗口从 `[k, k +\
  \ W − 1]` 增加到 `[k + 1, k + W]`。\n\n#### 9.3.2.4 性能\n\n基于滑动窗口的机会性路由要简单得多，实现也容易得多。它通过仅引入窗口推进，减少了多个分段并发传输调度机制的复杂性。文献表明，当窗口大小增加时，吞吐量增高于\
  \ `MORE` 以及 `CodeOR` 协议。`SlideOR` 可以在 `ACK` 传播期间并发传输编码数据包。\n\n### 9.4 研究展望\n\n近年来，网络编码在软件定义网络中更加流行。如\
  \ `hp`、`Cisco`、`D-link` 等许多行业正在引入网络编码技术以增强网络吞吐量，并减少数据包延迟和通信带宽。市场上已有的基于网络编码的接入点，用于\
  \ Wi-Fi 信号传输。\n\n软件定义网络 (SDN) 具有在互联网上虚拟化缓冲、调度和路由等服务的潜力。文献（Hansen et al., 2015; Krigslund\
  \ et al., 2015; Liu & Hua, 2014; Zhu et al., 2015）提供了通过网络编码支持的 `SDN` 视图，以促进高速 5G\
  \ 连接。网络编码技术利用 `OpenFlow` (SDN) 的集中控制架构，为安全且更高效的网络创造了肥沃的土壤。\n\n### References\n\n\
