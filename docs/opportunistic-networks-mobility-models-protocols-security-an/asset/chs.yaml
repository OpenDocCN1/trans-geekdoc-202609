  `图 14.14`\n保护生物圈的 `DTN`。\n\n### 1.2 边境地区/跨界地区\n`DTNs` 可用于由于地形恶劣或极低温（如冰冰冰川）而人类难以进入的边境地区或跨界地区。图\
  \ 14.3 展示了部署部队的边境地区。坐在控制办公室的指挥官通过 `DTN` 向部队发送消息。部队通过网络接收指挥官的命令。\n\n### 2. 帮助残障人士\n\
  `DTNs` 可用于协助残障人士（如视障人士、聋哑人士等）的日常生活。图 14.4 展示了一个坐在轮椅上的残障人士向帮助台发送消息，请求帮助爬楼梯。部署了 `DTN`\
  \ 节点以建立网络。同样，`图 14.5` 代表一个安装了 `DTN` 节点的拐杖。该节点存储了城市地图，并在人应该去向的方向产生推力。\n\n### 3\n\
  `DTNs` 可以应用于智慧城市信息化/农村信息化，其中它们可用于清理堵塞的地沟或处理垃圾。图 14.6 展示了安装在排水管中的 `DTN` 节点。这些节点检测管道中的速度。一旦某个节点报告速度为零，即可识别在该节点与前一个节点之间的某处存在堵塞。\n\
  \n\n\n\n\n### 4. 保护野生动物\nDTN 连接可以通过追踪动物的移动并进行计数，用于国家公园或保护区内鸟类和野生动物的保护。图 14.7 展示了一个网络，其中\
  \ DTN 节点部署在森林中以维护森林动物数量的计数。这有助于森林官员监测动物情况。如果任何节点连续几天未发现某只动物，则认为其已死亡。不同节点维护的计数会通信给森林官员。DTN\
  \ 节点内部安装了传感器，用于跟踪周围动物的移动。\n\n### 5. 预测自然灾害\nDTN 连接可以应用于海洋/海底国家之间的通信，从而创建一个水下海洋网络。图\
  \ 14.8 描绘了建立在水下的 DTN。这种水下海洋网络用于检测水流速度和洋流，以预测气旋的发生。每个节点检测速度并将其传输给官员，官员对速度进行解释和分析，以便对任何自然灾害提供预警。\n\
  \n### 6. 温度/交通监控\n通过将 DTN 节点安装在城市公交车的屋顶，可以利用它们感知其运行区域的交通和/或温度（Hirakawa, Uchida,\
  \ Arai, & Shibata, 2015）。图 14.9 展示了屋顶部署了 DTN 节点的公交车。这些传感器可以记录拥堵的交通，并通知官员特定位置的交通堵塞。官员随后更新\
  \ Google Maps 上显示的最短路线，让人们了解城市内不同的交通拥堵情况。\n\n### 7. 复杂地形中的通信\nDTN 可用于在无法建立有线和无线通信的复杂地形中提供通信设施，例如喜马拉雅山脉等山区，或拉贾斯斯坦邦的塔尔沙漠等沙漠地区。图\
  \ 14.10 展示了可能缺乏连续网络连接的地区通信的便利性。节点可以轻松部署在这些地区，并建立通信网络。\n\n### 8. 保护生物圈\nDTN 可用于保护森林中的植物和树木，从而保护生物圈。图\
  \ 14.11 展示了用于保护生物圈的 DTN。\n\n### 9. 邮局场景\n邮递员向村民交换/交付不同的消息，或者不同村庄之间交换不同的消息，例如 Daknet。图\
  \ 14.12 描绘了邮递员跨越延迟容忍网络向村民递送消息的情况。\n\n### 10. 交通传感器\nDTN 可用于监控高峰期间的交通状况。其目的是预测交通拥堵，从而帮助旅行者据此决定路线。这可以通过在每个交通信号灯上安装传感器来实现，每当针对特定信号产生请求时，它就可以做出响应。在这种情况下，通信延迟是可以接受的，因为人们通常在离开家之前询问此类交通问题。图\
  \ 14.13 展示了一个部署在交通信号灯上的传感器，它记录每个信号处的交通拥堵情况并将报告发送给官员，官员反过来更新人们通勤时地图上的最短路线。\n\n###\
  \ 11. 偏远地区的通信\n在经济上不可行的地区提供通信设施，例如远离主要城市和城镇的偏远地区/贫困乡村（Ntareme, Zennaro, & Pehrson,\
  \ 2011）。DTN 还可以部署用于从非常遥远和偏远的地方收集信息，如南极。可以获取有关那里进化任何新物种或由于全球变暖引起的拓扑变化的信息。这可以通过追踪它们物理特征的某些显著差异来实现。这可以通过放置能够捕捉此类数据并传回图像或统计数据的\
  \ DTN 节点来完成。收到的结果将有助于研究那里的演化模式，如图 14.14 所示。\n\n## 参考文献\nBenhamida , F. Z., Bouabdellah\
  \ , A., and Challal , Y. (2020).\n\n\n\n\n\n容延节点网络 (`DTN`)（Fall, 2003）是一种源到目的地之间没有直接路径的挑战性网络。许多现实生活中的网络都遵循这种\
  \ `DTN` 范式，例如卫星通信（Prescott, Smith and Moe, 1999）、野生动物追踪传感器网络（Juang et al., 2002）、军事网络、车载自组织网络（Ott\
  \ and Kutscher, 2005）等。在这种场景下，网络拓扑结构动态变化。因此，`DTN` 中的路由使用“存储并转发”机制来实现通信的通信。各种 `DTN`\
  \ 路由协议应用不同的技术，根据特定的路由指标到达目标节点，例如估计的递送概率、历史接触频率、可用网络资源或估计延迟（Schurgot, Comaniciu and\
  \ Jaffres-Runser, 2012）。\n\n在现代社会，随着强大的移动设备的出现，用户在移动时渴望保持连接。这导致了网络场景存在异构、移动且受电源限制的设备，以及由于阴影效应的存在和昂贵的互联网服务，即使在城市场景下也存在间歇性连接的无线网络（Moreira,\
  \ Mendes and Sargento, 2014）。\n\n如果这种网络源和目的地之间有直接路径，我们可以获得更好的结果（Costa et al., 2008;\
  \ Boldrini, Conti and Passarella, 2010）。此外，利用节点与其相应的社交交互（即社区（Hui, Crowcroft and\
  \ Yoneki, 2011）、社交交互层次（Moreira, Mendes and Sargento, 2012; Nguyen and Giordano,\
  \ 2012）），我们可以确保高效路由具有更好的性能。\n\n社交感知的内容型机会路由协议 (`SCORP`) 考虑用户的日常社交交互和兴趣，以确保在密集区域（即城市地区）更好的递送（Moreira,\
  \ Mendes and Sargento, 2014）。`dLife` 路由协议考虑了用户在日常生活中行为的动态性（Moreira and Mendes, 2012）。它利用社交交互的轨迹进行进一步的数据传输。`dLifeComm`\
  \ 路由协议是 `dLife` 的更新版本，它还考虑了社交交互轨迹及其兴趣，以获得比 `dLife` 更好的性能。\n\n在本章中，我们评估了上述三种社交感知路由的性能，即\
  \ `SCORP`、`dLife` 和 `dLifeComm`。本章的结构如下：在第 15.2 节，我们介绍了 `SCORP`、`dLife` 和 `dLifeComm`。第\
  \ 15.3 节展示了仿真工具和环境设置。第 15.4 节介绍了我们的评估研究。在第 15.5 节，我们讨论了这项研究的结论。\n\n## 15.2 社交感知路由协议\n\
  \n在这里，我们简要讨论了 `SCORP`、`dLife` 和 `dLifeComm` 社交感知路由协议。\n\n### 15.2.1 社交感知的内容型机会路由协议\
  \ (SCORP)\n\n社交感知的内容型机会路由协议在做决策时考虑了节点之间的社交存在以及节点对内容的知识。`SCORP` 在做决策时考虑了节点之间的社交存在以及节点对内容的知识。使用\
  \ `SCORP` 有两个原因：首先是节点之间的社交存在（Costa et al., 2008）；其次是节点之间的社交存在以及节点在决策时拥有的内容知识（Moreira,\
  \ Mendes and Sargento, 2014）。\n\n### 15.2.2 dLife\n\n`dLife` 路由协议考虑了用户日常生活中行为的动态性（Moreira\
  \ and Mendes, 2012）。它利用社交交互的轨迹进行进一步的数据传输。`dLife` 考虑了用户日常生活中行为的动态性（Moreira, 2012）。\n\
  \n### 15.2.3 dLifeComm\n\n`dLifeComm` 路由协议是 `dLife` 的更新版本，它还考虑了社交交互轨迹及其兴趣，以获得比 `dLife`\
  \ 更好的性能。`dLifeComm` 还考虑了社交交互轨迹及其兴趣，以获得比 `dLife` 更好的性能（2012）。\n\n## 15.3 方法与设置\n\n\
  ### 15.3.1 ONE 仿真器\n\n`ONE` 是一个基于 Java 的仿真器，用于分析性能（Keränen, 2009）。\n\n### 15.3.2\
  \ 仿真环境\n\n下表描述了仿真时间、生存时间 (`TTL`) 和节点数量的仿真设置。\n\n**表 15.1** 仿真参数\n\n| 参数 | 数值 |\n\
  | :--- | --- |\n| 仿真时间 | 3, 6, 12, 24, 48 (小时) |\n| 更新间隔 | 1 秒 |\n| 每组节点数 | 50,\
  \ 100, 150, 200, 250 |\n| 接口 | 蓝牙接口 |\n| 接口类型 | 简单广播接口 |\n| 传输速度 | 250 kbps |\n\
  | 传输范围 | 10m |\n| 路由协议 | `SCORP`, `dLife`, `dLifeComm` |\n| 缓冲区大小 | 5, 50, 100,\
  \ 200, 500 (MB) |\n| 消息 TTL | 50, 100, 150, 200, 250 (分) |\n| 移动模型 | 最短路径地图 |\n\
  | 消息大小 | 500 kB–1MB |\n| 仿真区域大小 | 4500m × 3400m |\n\n## 15.4 比较评估\n\n在本节中，我们使用 `ONE`\
  \ 仿真器从三个性能指标研究了三种社交感知路由协议（即 `SCORP`、`dLife` 和 `dLifeComm`）的性能。这些指标是：递送概率（即递送到目的地的总消息数与源端创建的总消息数之比）、平均延迟（即从消息创建到递送之间的时间）和开销率（即为了成功递送单个数据包而转发的冗余数据包数量）。因此，我们考虑了不同\
  \ `TTL`、移动节点数量、仿真时间以及缓冲区大小的影响。\n\n### 15.4.1 TTL 影响评估\n\n\n\n\n\n在本节，我们看到所有路由的交付概率都随着\
  \ `TTL` 的增加而增加，如图 15.1 所示。因此，`SCORP` 的交付率高于 `dLife` 和 `dLifeComm`。在平均延迟方面，我们看到最初\
  \ `SCORP` 的延迟远高于 `dLife` 和 `dLifeComm`，但随着 `TTL` 的增加，`SCORP` 的平均延迟有所降低；从图 15.2 中可以看出，当\
  \ `TTL` 大于或等于 150 min 时，`SCORP` 的平均延迟低于其他路由。同样，我们从图 15.3 中看到 `SCORP` 的开销率最初高于其他路由，但当\
  \ `TTL` 大于 100 时，`SCORP` 的交付率低于 `dLife` 和 `dLifeComm`。因此，我们可以认为 `TTL` 的值大于或等于 150。因此，当\
  \ `TTL` 大于或等于 150 时，`SCORP` 表现出更好的交付率、更低的延迟和更低的开销。\n\n![](img/fig15.1.jpg)\n图 15.1\n\
  交付概率 vs. TTL。\n\n![](img/fig15.2.jpg)\n图 15.2\n平均延迟 vs. TTL。\n\n![](img/fig15.3.jpg)\n\
  图 15.3\n开销率 vs. TTL。\n\n## 15.4.2 节点的影响\n\n在该图中，我们观察了间性连接网络（ICMN）中移动节点的影响（Hossen\
  \ and Rahim, 2016）。在这里，我们看到随着移动节点的增加，`SCORP` 最初交付率较低，但当节点数为 150 时，`SCORP` 的交付率高于\
  \ `dLife` 和 `dLifeComm`，如图 15.4 所示。同样，当节点数在 150 到 200 之间时，`SCORP` 的平均延迟较低，如图 15.5\
  \ 所示。在开销率方面，当节点数大于 100 时，开销率接近恒定，如图 15.6 所示。因此，我们可以说，当节点数在 150 到 200 之间时，考虑到交付率、平均延迟和开销率，`SCORP`\
  \ 路由表现出更好的性能。\n\n![](img/fig15.4.jpg)\n图 15.4\n交付概率 vs. 节点数。\n\n![](img/fig15.5.jpg)\n\
  图 15.5\n平均延迟 vs. 节点数。\n\n![](img/fig15.6.jpg)\n图 15.6\n开销率 vs. 节点数。\n\n## 15.4.3\
  \ 时间的影响\n\n在该研究中，我们看到随着时间的增加，`SCORP` 的交付率远高于 `dLife` 和 `dLifeComm`，如图 15.7 所示。我们看到\
  \ `SCORP` 的平均延迟基本恒定，如图 15.8 所示。同样，我们看到 `SCORP` 的开销较高，如图 15.9 所示。因此，我们可以说考虑到时间，`SCORP`\
  \ 具有更高的交付率。\n\n![](img/fig15.7.jpg)\n图 15.7\n交付概率 vs. 时间。\n\n![](img/fig15.8.jpg)\n\
  图 15.8\n平均延迟 vs. 时间。\n\n![](img/fig15.9.jpg)\n图 15.9\n开销率 vs. 时间。\n\n## 15.4.4 缓冲区的影响\n\
  \n在这里，随着缓冲区增大，`SCORP` 路由显示出更高的交付率、更低的延迟和更低的开销。另一方面，`dLife` 路由显示交付率较低，而 `dLifeComm`\
  \ 显示出更高的延迟和开销，如图 15.10、图 15.11 以及图 15.12 所示。\n\n![](img/fig15.10.jpg)\n图 15.10\n\
  交付概率 vs. 缓冲区大小。\n\n![](img/fig15.11.jpg)\n图 15.11\n平均延迟 vs. 缓冲区大小。\n\n![](img/fig15.12.jpg)\n\
  图 15.12\n开销率 vs. 缓冲区大小。\n\n因此，从 `TTL`、移动节点数、时间和缓冲区大小的影响可以看出，与 `dLife` 和 `dLifeComm`\
  \ 相比，`SCORP` 有更高的交付率、更低的延迟和更低的开销，条件为：\nTTL ≥ 150 min\n节点数 150–200\n缓冲区 ≥ 50 MB\n\
  \n## 15.5 结论\n\n在本章中，我们研究了在 ICMN 场景受 `TTL`、移动节点数、时间和缓冲区大小影响的 DTN 社交感知协议，即 `SCORP`、`dLife`\
  \ 和基于社区的 `dLifeComm`。仿真结果表明，在机会性 ICMN 场景下，在 `TTL` 等于或大于 150 min、节点数在 150 到 200 之间以及缓冲区大于\
  \ 50 MB 的情况下，`SCORP` 的性能优于 `dLife` 和 `dLifeComm`。\n\n## 参考文献\n\nBoldrini, C., Conti,\
