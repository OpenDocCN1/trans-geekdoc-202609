  \n## 12.1 引言\n\n机会性网络是经典移动自组网络（`MANET`）的演变。`MANET` 的特点是无基础设施、自主的移动节点。当节点处于彼此通信范围内时，它们直接通信。每个节点都可以扮演两个角色：端节点（源节点或目的节点）和中间节点（中继节点或路由器）。在\
  \ `MANET` 中，源与目的之间的端端连接对于消息的最终传输是必要的。然而，当节点具有高度移动性时，节点之间的连接机会可能会变得断断续续。因此，传统的 `MANET`\
  \ 路由协议由于源与目的之间缺乏端到端路径而无法实现最终传输（Borgia et al., 2005）。因此，传统 `MANET` 的某些属性，如节点断开连接、用户移动、网络分区和链路不稳定，被视为缺点。这使得节点之间的通信变得异常困难。机会性网络的目标是利用这种间歇性连接来为节点之间提供通信，并为这种环境设计应用程序。\n\
  \n机会性网络由人们携带的手持移动设备形成，且不假设任何预先存在的网络基础设施（Pelusi et al., 2006; Verma and Srivastava,\
  \ 2011）。它们在移动设备之间提供连接机会，同时消除了端到端的要求。断开连接、移动等被视为特性而非缺点（Conti and Kumar, 2010; Verma\
  \ et al., 2013）。最终传输通过使用“存储-携带-转发”（store-carry-forward）方法实现，在该方法中，在没有指向目的地的转发机会时，使用中间节点存储消息，并利用未来与其他设备的任何接触。在文献中，机会性网络也被称为间歇连接网络（`ICMNs`）。\n\
  \n机会性网络类似于延迟容忍网络（`DTN`）（Fall, 2003），后者由 DTN IRTF 研究小组定义（[`irtf.org/concluded/dtnrg`](https://irtf.org/concluded/dtnrg)）。`DTN`\
  \ 由断开连接的网络组组成，每个网络内的节点通过预定义的拓扑结构良好连接，但独立网络之间的通信通过 `DTN` 覆盖层建立。通常情况下，每个网络中与 `DTN`\
  \ 覆盖层连接的点（节点）是已知的。为了实现端到端连通性，`DTN` 覆盖层利用网络之间偶尔的通信机会，这些机会可能是随时间计划的也可能是非计划的。对于机会性网络中可能的断点不假设任何先验知识，也不假设存在独立的良好连接的子网络。因此，尽管\
  \ `DTNs` 和机会性网络之间有许多相似之处，但两者的路由方法非常不同。\n\n事实上，尽管机会性网络研究仍处于阶段，但机会性网络概念如今已应用于许多具体应用中。已利用机会性网络开发了各种应用程序来分析人类移动性和社交交互模式，并在此基础上构建产生最小消息延迟的高效消息路由模型（Jain\
  \ et al., 2004; Verma and Pattanaik, 2017）。机会性网络还应用于关注野生动物监测的跨学科项目，以对动物迁徙和物种间交互进行新颖研究。利用机会性网络为农村地区带来互联网连接也是一种趋势。机会性网络代表了一种易部署且极其廉价的解决方案，为农村地区带来互联网连接（Boldrini\
  \ et al., 2008; Conti and Giordano, 2007a, 2007b）。\n\n本章描述了机会性网络的各种现存现实应用和案例研究。对于每个应用，深入讨论了主要目标、动机、局限性和实现方法。本章其余部分的组织如下：第\
  \ 12.2 节至 12.11 节详述了机会性网络的现实应用。最后，在第 12.12 节对本章进行总结。\n\n\n\n\n\n新兴的泛在环境正在产生海量信息。当前的互联网协议无法管理这些信息，因为它们几乎是\
  \ 40 年前开发的，并非设计用于在这些新兴的泛在环境中工作。该协议施加在低成本设备（如传感器或标签）上的通信规则直接限制了此类环境的基本目标。由于泛在计算和无处不在的计算被认为是未来所有智能系统的关键推动因素，因此需要开发一种完全不同的方法，在这些环境中提供能够满足其需求的通信。可以利用生物系统的的工作原理来完全重新定义新兴泛在环境的工作原理，例如结构、控制、功能和通信。基于这一现象，生物遗传学及其演化机制与泛在计算概念相结合，导致了自主和自主自适应系统的产生，例如面向服务的通信系统。生物启发的下一代网络（`BIONETS`）基于相同的现象，将无处不在的低成本泛在环境视为自优化服务集合的随机自组织产物（Carreras\
  \ et al., 2004）。\n\n在 `BIONETS` 中，服务由染色体定义，许多服务与生物体相关。由于染色体的存在，服务会不断且自主地演化并适应环境。染色体由基因组成，基因是服务的最小数据单元，定义了生物体和服务类的所有功能特征。类似于生物系统，可以为生物体和服务定义一个完整的生命周期。生命周期从生物体的出生开始，经历繁殖，并以死亡结束。所有这些阶段在\
  \ Carreras 等人 (2004) 中都有清楚的描述。繁殖和演化过程受到自然现象的影响并从中继承。\n\n生物体遗传信息的适应度是通过确定其与周围环境的适用性以及遗传信息与环境之间的交换来衡量的。因此，信息根据需求在配对生物体之间进行本地交换，而不是端到端通信。根据适应度，相应的环境会对生物体进行自然选择评估。结果是最好的生物体（服务）脱颖而出。\n\
  \n通过这种方式，`BIONETS` 了一种在无处不在的网络中交换信息的新颖。主要目标是在移动用户之间按需交换信息，并传播信息而不是转发数据包。遗传学模型被用于评估和选择适用于一组用户节点的服务。这些服务的适用性会导致它们在用户节点上增长；否则它们将会衰减。随着种群的增长，还会通过突变和优者生存选择对服务进行评估（Altman\
  \ et al., 2010）。\n\n为了证明所开发模型在现实场景中的正确性，考虑了一个停车场场景，在该场景中，城市被分为区块，每个基因代表停车位的占用状态（空闲或被占用）。服务不断向用户建议最近的可用停车位，并根据用户的移动更新建议。初始仿真结果已经证明了模型的正确性；然而，该模型应该扩展以适应更真实的用户行为和动态场景（Carreras\
  \ et al., 2007）。\n\n## 12.3 移动泛在局域网扩展\n\n互联网是主要的通信工具，并且日益适应其无处不在的特性，但其任意安装受到成本的限制。为了解决这个问题，提出了移动泛在局域网扩展（`MULE`）。`MULE`\
  \ 是一种在环境中移动并从微节点（motes）中收集数据的移动设备。`MULE` 然后返回中央服务器并上传收集的数据。`MULE` 充当微节点与中央服务器之间的桥梁，即使微节点不在中央服务器范围内也能进行数据收集。\n\
  \n`MULE` 实现在各种设备上，特别是四轮及及以上的车辆。`MULE` 使用蓝牙无线协议与微节点通信。`MULE` 还使用蜂窝网络与中央服务器通信。中央服务器安装在车辆站，充当系统的主控制器。\n\
  \n`MULE` 的适应度通过其与周围环境的适用性来衡量。`MULE` 根据其适应度调整移动。例如，如果 `MULE` 处于数据需求量区域，它会在那里呆得久一点。如果\
  \ `MULE` 处于低需求区域，它将移动到另一个区域。这种适应行为允许 `MULE` 优化数据收集效率。\n\n`MULE` 还用于管理微节点的功耗。由于微节点是低成本低功耗的，它们无法执行复杂的计算。`MULE`\
  \ 代微节点承担部分计算，有助于延长它们的电池寿命。\n\n此外，`MULE` 用于为微节点提供连接性。微节点通常位于互联网覆盖差的区域。`MULE` 为微节点提供了连接互联网的网关。这允许实时对微节点进行监控和控制。\n\
  \n\n\n\n\nMULEs 以及该模型的低成本实现和配置，为研究人员、政府、私营机构以及其他需要以廉且可靠的方式从离散分布式网络收集数据的人员引入了一个新系统。该模型的主要目标是最大程度地实现数据采集（Kazemeyni\
  \ et al., 2012）。\n\n## 12.4 共享无线信息站模型\n\n容量和延迟是无线自组织网络的两个主要关注问题。最终，在某些分析中，这两者之间会发生权衡，特别是关注两个极端：要么最小化延迟，要么最大化容量。然而，在这些极端情况下，不同的策略在很大程度上实例化了相同的权衡。信息站（Infostation）网络方法就是这样一个例子，它以延迟为代价增加了移动网络的容量，并以极高的速率提供地理间歇性覆盖。作为信息站方法的扩展，定义了一种网络模型，被称为共享无线信息站模型（`SWIM`），它整合了自组织网络（Small\
  \ and Haas, 2003）。`SWIM` 模型在存储需求适度增加的情况下，能够进一步增强容量与延迟的权衡。\n\n在一个生物信息收集系统中定义了一种自组织网络设置，其中节点由标记有无线设备的鲸鱼表示，这表明\
  \ `SWIM` 可用于处理实际问题。通过引入多级操作，可以将海鸟表示为移动数据采集节点来增强并实现 `SWIM`。开发了一种用于端到端延迟分布的分析公式，有助于计算存储需求。该生物系统包含随机延迟。系统可以认为旧数据与最新数据一样有用，因为动物的行为在多年间保持不变，且数据在任何时间尺度上都是依赖时间的。推出的分析公式可用于对某些指标的系统模型进行数值评估，有助于分析这些指标对系统性能的影响。它还允许对容量与延迟的权衡进行严密检查。\n\
  \nWINLAB2 的一个小组小组提出了信息站架构（`http://www.winlab.rutgers.edu/docs/focus/Infostations.html`/`http://www.winlab.rutgers.edu/docs/focus/Infostations.html`）。该架构包括低功耗基站，并适用于可以容忍大量延迟的应用。信息站由于具有稳定的无线信号质量，可以为小地理区域内的用户提供极高的数据传输速度。信息站缺乏连续覆盖；因此，为了高速提供数据，它必须承担间歇性连接的成本。当一个节点想要传输的数据超出信息站范围长时间时，就会经常发生高延迟，且它应该始终直接传输到信息站。信息站利用节点的移动性来用连接性换取容量，当节点返回信息站范围时，它会以高数据速率进行传输（Small\
  \ and Haas, 2003）。\n\n如上所述，`SWIM` 扩展了容量与延迟的权衡，允许信息通过在网络中复制和扩散（共享）到达信息站。信息利用移动节点作为物理载体进行传播，这在某种程度上克服了信息站模型的局限性（节点必须出现在信息站处）。\n\
  \n## 12.5 车载容延网络\n\n由于与传统网络相比的某些特殊特征，车载自组织网络的应用前景近年来受到了越来越多的关注。其应用范围涵盖了道路安全、交通管理和驾驶辅助，以及在孤立地区提供连接，并在灾害发生时为救援队建立网络。其特征包括离散性和间歇性、不需要端到端连接，并且具有随机延迟、高延迟和极不规则的数据速率。\n\
  \n\n\n\n\nDTN（延迟容延网络）的应用和方法论被用于水下网络，实现污染跟踪、导航辅助和灾害预测的通信，并被生物学家用于在广泛区域跟踪和监测野生动物物种的行为（Ahmed\
  \ et al., 2015）。\n\nVDTN（车载延迟容延网络）考虑了带外信号的两个平面，即控制平面和平数据面，分别用于连续节点之间的连接建立和数据包（bundles）传输。在所提\
  \ VDTN 中，定义了三种节点：终端节点、移动节点和中继节点。终端节点实现与用户的连接，移动节点在节点（固定和移动）之间传输数据包，中继节点负责增强网络连通性以及类似的数据包交付，它们作为固定节点位于交叉路口。\n\
  \n为了评估所提 VDTN 的性能，使用了一个实验室测试平台（`VDTN@Lab`）和一个真实测试平台（由巴西 FIAT 开发）。为了提供并增强数据包交付率和等待时间，定义了不同的路由协议。VDTN\
  \ 节点上的缓冲区通过调度和丢弃技术进行，而分片减少了相同数据包的重传，从而提升了整体网络性能。定义了一种基于简单网络管理协议的辅助方法，以协助监控 VN 节点并跟踪不一致性（Isento\
  \ et al., 2013）。\n\n## 12.6 面向泛在适应的社交\n\n随着技术的不断进步，世界正见证日常生活中具有存储、处理和信息广播能力的小型移动设备的快速增长。尽管这为人类生活的不同侧面提供了产生、收集和传输新见解与信息的媒介，但它也为这些实现带来了某些挑战。它要求在灵活性、适应性和动态性方面进展，因为现有的端到端网络方法已不再适用。欧盟未来与新兴技术（FET）计划的面向泛在适应的社交网络（`SOCIALNETS`）项目（`http://www.social-nets.eu/`）旨在克服这些挑战，并通过理解、表示和利用关键属性，帮助人类适应并展现出优于其他物种的敏捷性（Allen\
  \ et al., 2008）。预计通过建立设备进行社交网络的能力，可以促进高度高效的泛在通信和内容安排。\n\n通信对于人类社会的信息和知识交换至关重要，但现有的网络设计和人工开发的内容安排方法限制了人类通信严格采用工程范式来辅助传输。在无线网络中引入此类工程范式可能是阻碍\
  \ MANET（自组织移动网络）或传感器网络等技术演进的主要原因。可以观察并证实，近期以人为中心的技术受到了人性的基本特征和自我组织的启示。像 `SOCIALNETS`\
  \ 这样的项目需要以人为中心。\n\n`SOCIALNETS` 项目的基础是采用人类事务和合作的框架来为泛在网络的问题提供解决方案，这在人类条件和情况下是理想的，并持续存在于人类文化之中。正如名称所示，它与技术的终端用户密切相关，并结合了社会学、复杂系统、计算机科学和网络工程的设计与概念。人类社会关联涉及多个学科，自然类比的发展被用于协助自我组织，例如自主神经系统和生物学（Allen\
  \ et al., 2008）。\n\n`SOCIALNETS` 涵盖在线社交网络和机会性无线网络。该项目研究了以何种方式实现社交网络来进行具有安全和保障的数据交付与收集。一个综合假设是：人性的基本特征、极其高效且动态的相互事务与社交网络相结合，将产生一个极其高效、先进、可靠、多功能且以人为中心的泛在通信系统。该项目有以下主要发现：\n\
  \n- 通过社交方面和循环物理机制理解人类行为的基础，包括通过泛洪（gossip）和生物传输等过程在内网和互联网中的信息运动。\n- 演化一种灵活的社交框架，用于单播和广播方案中的数据传输。它包括社区发现和定义协议，允许通过机会性网络方法论利用人类社会组织进行数据传输。\n\
  - 行为内容处理方法，例如：(1) 根据人类社会设计的商品社交安排以获得访问效率；(2) 鼓励协调行为和相互交换的社交计划；(3) 用于理性推送的社交技术。\n\
  - 开发通用的社交保护，在去中心化框架内使用信任纽带处理随机信任和协调。它使我们能够获得数据存储功能的信心、数据访问和交换的机密性以及去中心化节点之间的协调。\n\
  - 完整的架构设计，展示了 `SOCIALNETS` 的不同组件如何通过社交网络层集成并相互协助。\n- 确定潜在的近期应用以及通过无线框架实现应用的方法。关注的应用包括没有互联网可用时的社交网络博客、机会性网络以及发展中地区的通信实现。\n\
  \n`SOCIALNETS` 的目标是利用人类社交交互的关键特征，为大型、异构且可靠的泛在网络开发通信和信息分布的新方法。这一概念的成功实施需要社会学、复杂系统、网络工程和计算机科学等不同领域之间的协作与合作（Allen\
  \ et al., 2008）。\n\n## 12.7 社交感知移动与泛在计算的服务平台\n\n赋予移动用户的智能设备搜索和使用周围可用资源的能力，可以方便地引导他们构建和访问丰富的服务集，此类服务可以增强手机的可用性。特别是，分布式任务执行需要使用不同的资源，如原始计算能力、社交网络连接或跨设备的传感器读取。为了在机会性泛在网络中提供分布式任务执行，提出了社交感知移动与泛在计算（`SCAMPI`）框架（Pitkänen\
  \ et al., 2012）。该架构通过实施影响人类社交的行为，支持各种传感器、个人通信设备和周围资源之间有效的机会性通信。`SCALPI` 通过遵循面向服务的方案将资源抽象为服务成分，促进了广泛应用程序的组合。\n\
  \n\n\n\n\n# SCAMPI 项目\n\n`SCAMPI` 项目的目的是赋能智能设备的终端用户，利用自己的资源并以安全可靠的方式机会性地利用环境中可用资源。该项目利用了环境中所有可用资源，这些资源可以是固定设备（如\
  \ Wi-Fi 路由器、视频监控摄像头）或其他设备上的可用资源，且是机会性和按需的。SCAMPI 研究了类似于传统面向服务型方案的新方向，其应用使得个人且隔离的设备具备了更广泛的功能。SCAMPI\
  \ 中的服务将个人设备的资源与环境资源以及用户授予的资源进行了抽象。与传统的互联网模型相比，其网络框架被认为是高度不稳定，因此需要对技术解决方案进行完全重新设计（Pitkänen\
  \ et al., 2012）。\n\n面向服务型的人类泛在网络结合了传统泛在网络和机会性网络的特点。假设在泛在网络中，移动用户分散在某一区域内，大多数设备能够共享网络和计算资源。机会性网络被认为具有高度动态性和不稳定的拓结构，因此为了保持网络和计算任务的连续性，必须利用机会与其他设备建立连接。这种技术将接入基础设施集成到完整的以服务为中心的设计中。被视为服务的设施接入（例如允许访问传统互联网基础设施的支持）将被视为一种机会性服务；此类访问可以由实现所需的目标组成，例如，向物理邻域之外的用户传递某段内容。\n\
  \n泛在和机会性网络方法论是 SCAMPI 项目的基础。为了理解这一点，人们应该研究移动和泛在网络以服务为中心的平台的意义和部署，并从绝对的网络问题转移转移。因此，该项目侧重于协作机制，利用用户设备可用的软件和硬件资源提供共享服务，而不是填充纯粹的网络问题。技术方法将侧重于人类因素。项目内部建立的技术解决方案一方面研究了\
  \ SCAMPI 解释提供的以社会为中心的服务的创意示例，另一方面则侧重于关于用户社会属性的知识，这些知识将作为根上下文信息利用。SCAMPI 使用各种资源，无论是物理资源（如处理单元、数字相机、Wi-Fi\
  \ 路由器和传感器）还是软资源（如程序和文件），都作为服务条目（Pitkänen et al., 2012）。\n\nSCAMPI 可以在机会性网络上提供服务，这使其与众不同。SCAMPI\
  \ 是一个自主且无基础设施的系统，利用其移动设备自动形成网络。因此，它对任何服务的实现似乎都是复杂且具有挑战性的任务之一。在没有任何基础基础设施和基础设施辅助的情况下，SCAMPI\
  \ 能够采用纯机会性网络。SCAMPI 的主要目标是关注无基础设施的计算环境，这种环境对于广泛应用领域的用户非常有用，而且在灾害和紧急情况等极端情况下也有用。\n\
  \n若干研究结果支持将 SCAMPI 框架作为机会性计算的方法，它可以在上述讨论的最严酷环境之一中提供计算平台。整个分析解释了分析建模、低级技术和通过社交网络实验的人工学习相结合如何有助于为移动用户构建一个丰富的服务基础设施。认为这种架构可以提供各种新兴的社会和感知感知应用，将能够利用最新的智能设备进行自适应应用开发（Pitkänen\
  \ et al., 2012）。\n\n## 12.8 ZebraNet\n\n无线通信和移动计算是在移动设备上实现若干新计算应用的关键技术。无线传感器网络的核心领域是涉及通过商业和科学手段独立利用计算、感知和无线网络设备的应用。`ZebraNet`\
  \ 系统是一种基于无线点对点网络方法的移动传感器网络，基本上是为野生动物的跟踪和监测而提出的（Juang et al., 2002）。在 `ZebraNet`\
  \ 系统中，电子跟踪圈（节点）由 `GPS` 芯片、非易失性闪存、无线电收发器和小型用户可编程 CPU 组成，系在广阔森林区域漫游的动物身上。这些项圈作为点对点网络运行，并将存储的信息转发到基站。通常，此类野生动物地区没有蜂窝网络或广播服务的设施；因此，自组（ad\
  \ hoc）或点对点网络是提供通信的唯一方法。由于研究人员本身在移动且基站也不稳定，尽管有多种自组协议可用，但增加了额外的挑战。`ZebraNet`的主要设计目标是减少能量、存储和其他资源的利用，通过“数据回传”的高成功率保持系统的可靠性。显而易见，所开发的面向领域的协议及其能量权衡将在其他无线和基于传感的应用中具有通用的适应性（Liu\
  \ et al., 2004）。\n\n一个拥有 30 个节点的 `ZebraNet` 系统在肯尼亚中部的 Mpala 研究中心实施，以研究斑马在自然栖息地的行为。`ZebraNet`\
  \ 项目基本上是为了在偏远地区提出的，例如野生动物保护区，在这些地区假设没有基础的网络和通信基础设施。因此，`ZebraNet` 使用点对点通信传输数据。研究人员在手持移动设备的帮助下，收集在通信范围内漫游的动物所采集的数据。在文献中，对自组传感器网络有广泛讨论，而对于具有移动基站的移动传感器网络讨论极少，对实现真实系统的讨论更少（Zhang\
  \ et al., 2004）。`ZebraNet` 项目提供了一些独特的贡献：\n\n- 该项目认为自己是第一个为带有移动基站的移动传感器网络运行协议的项目。它假设基站仅在研究人员为了数据采集而移动时偶尔可用，且研究将在路过该区域时上传数据。\n\
  - 该项目的最终目标是跟踪斑马完全未知的移动模式，并确定斑马为何、何时以及如何开始长期迁移，这也是一个关键的生物学问题。其目的是利用近期、较少处理的生物数据引导移动模式，以开发初始协议，这些协议以后可以处理和适应，作为第一个部署的系统，使学习者能够详细研究斑马的活动，特别是它们的长期迁移。\n\
  - `ZebraNet` 数据采集系统遵循与其他传感器网络相同的通信模型，即数据被集体发送到基站。开发的 `ZebraNet` 协议针对这种数据采集通信方案进行了优化，并以避免在该应用领域出现高程度延迟。\n\
  \n\n\n\n\n-   借助真实系统的帮助，将对运行中的 ZebraNet 原型硬件进行能量测量和能量权衡。\n\n如前所述，ZebraNet 使用点对点网络方案将信息传输到研究人员的移动基站，而无需任何蜂窝或电信网络。实验成功后，系统将分析某些点，例如电池的影响、重量限制对能量的影响、系统存储以及其协议，以便进一步改进（Juang\
  \ et al., 2002）。\n\n## 12.9 FreeNet\n\nFreeNet 是一种基于点对点网络策略的应用程序，它允许在保留生产者和消费者身份的同时进行数据的显示、复制和访问（Clarke\
  \ et al., 2001）。它的功能是由相似节点组成的网络，这些节点汇聚存储区域来保存数据项，并协助请求到达数据最可能的物理位置。它不具备广播搜索或通用文件索引功能；因此，文件是以无位置模式访问的。请求的文件会在申请者附近动态复制，并在不再需要的时间和地点被删除。很难找到通过网络传输的文件的实际源和目的地，节点管理员无法轻易确定或控制其节点的文件。\n\
  \n网络化计算机系统被广泛用于存储和传输信息。然而，这为用户提供了较低的安全性，并将数据文件存储在某些预定义或固定位置，创建了主要的故障点。系统应该实施高安全和高可靠性措施，以满足个人保护隐私的需求，并防止主要故障点遭受完全的数据丢失或泛洪攻击。FreeNet\
  \ 是一种分布式数据存储和检索系统，专注于隐私和可用性问题。该系统在许多个人电脑上运行，作为一个位置无关的分布式文件系统，并以未知的方式授予数据输入、存储和访问。其主要设计目标是（Clarke\
  \ et al., 2001）：\n\n-   信息生产者和消费者的匿名\n-   信息存储者的可否认性（Deniability）\n-   抵抗第三方拒绝访问信息的尝试\n\
  -   信息的高效动态存储和路由\n-   所有网络功能的去中心化\n\n系统的开发是为了自适应地响应使用序列、透明移动、复制和所需文件的清理，以便在不依赖广播搜索和集成文件索引方案的情况下实现高效服务。尽管未来会有大量具有内存空间的节点加入，但无法保证永久的文件存储。该系统运行在应用层，并假设有一个安全的传输层但并不依赖它。该系统仅对\
  \ FreeNet 文件操作需要匿名性，而不适用于通用网络利用。\n\nFreeNet 作为一个免费软件项目正处于开发阶段，其介绍实现可以从官方网站下载（[www.freenetproject.org](http://www.freenetproject.org)）。它每天都在扩展，最初开发于爱丁堡大学。\n\
  \nFreeNet 中的节点相互作用以存储和访问数据文件，这些文件的名称由位置无关的键定义。每个节点都有一个专门用于网络读写的特定本地存储器，它还拥有一个包含其他节点地址及其键的动态路由表。假设系统的大多数用户将运行节点，以增加安全措施以及网络的总存储容量（Clarke,\
  \ 1999）。\n\n该系统可以被视为一种协作分布式文件系统，具有位置独立性和透明的慢复制。类似于 `distributed.net` 允许普通用户共享其计算设备上未使用的\
  \ CPU 周期，FreeNet 允许他们共享未使用的磁盘空间；然而，`distributed.net` 将此功能留给自己。键的请求通过一系列代理网络从节点传递到节点，每个节点本地决定下一个转发者。路由根据请求的键而异。用于数据存储和访问的路由算法旨在随时间自适应地调整路由，以便仅使用本地知识实现高效的系统性能。这是非常有要求的，因为节点只能访问代理序列中的直接上游和下游节点，以管理隐私。\n\
  \n类似于 IP 的存活时间（`TTL`），FreeNet 中的每个请求都被分配了跳数限制，该限制在每个节点处都会递减以避免无限链链。它还具有一个唯一的伪随机标识符，以避免由重复请求引起的循环；当发生这种情况时，前一个节点简单地拒绝它并将其转发到不同的节点。此过程一直运行，直到请求根据输出被成功处理或超过其跳数限制；结果将通过相同的链式序列回传给源节点。节点之间没有层级结构；因此存在一个中心故障点。如果一个新节点想要加入网络，它首先发现一个或多个节点的地址，然后开始向它们发送请求（Clarke,\
  \ 1999）。\n\nFreeNet 网络在分布在许多处理设备上的协作节点的帮助下，提供了一种有效且匿名的信息存储和访问机制。除了高效的路由算法外，它在保持高可扩展性的同时维护了信息的秘密性和可用性。测试版本的初始实现已显示出良好的结果，有大量的下载和流传副本。由于匿名系统的属性，无法统计有多少人正在使用以及其机制的性能如何，但事实结果非常令人满意（Clarke\
  \ et al., 2001）。\n\n## 12.10 DakNet\n\n尽管世界各地建立通信已变得非常方便，但偏远地区的居民仍然必须跨越长距离才能与他人联系或获取所需文件，而发达地区的居民几秒钟内就能完成。由于不恰的假设，政府在村庄建立了铜线电话连接，随着无线技术的出现，这后来似乎比宽带无线互联网连接更昂贵。名为\
  \ DakNet 的基于无线技术的自需网络用于在现有交通和通信基础设施的帮助下实现数字连接。DakNet 源自印地语单词 Dak（一个与邮政相关的词），它整合了物理运输和无线数据传输，以扩展上链路、邮局或网吧提供的互联网连接（Pentland\
  \ et al., 2004）。\n\n\n\n\n实时应用需要巨额资本投入，因此为了补偿接收端成本，它需要高水平的用户采用率。城市平均人口无法负担手机和电脑等个人通信设备，为了承担这些费用，他们需要共享通信框架。在这些地区，建立一个非实时框架以及诸如语音消息、电子邮件和公告板、MMS（多媒体短信）及类似的应用，可能比实时电话或蜂窝网络服务更加方便。研究表明，为了实现高效的农村信息通信技术（ICT）服务，目前的基础设施比非实时连接需要更强的管理能力底层交互性（Hasson\
  \ et al., 2003）。村民们饱受交通不便、价格不公和腐败的困扰，他们切渴望并准备好为数字设施付费。诸如异步或存储和转发这种具有成本效益的通信技术，可以在不牺牲价值用户服务交付的情况下使用，还能建立一个社会成员可以不断添加和监控的本地信息库，并具备启用电子邮件和语音消息等服务的能力。\n\
  \nDakNet 是一种基于无线的自组织网络，在 MIT 媒体实验室开发，旨在实现异步数字连接，证明了无线与异步技术的结合可以作为通用宽带连接的路线图（Hasson\
  \ et al., 2003）。在印度和柬埔寨的一些偏远地区，DakNet 已成功实施，其成本远低于传统的线路基础设施。它让村民能够使用负担得起的互联网服务。\n\
  \n如上所述，DakNet 利用现有的通信和交通设施，在不存在这些服务的地区实现数字连接。在成本效益和节能方法上，DakNet 通过亭台与便携存储设备（称为移动接入点，即\
  \ `MAPs`）之间的短点对点连接传输数据。`MAP` 安装在车辆上并由发电机供电；它在亭台与个人通信设备（如局域网）或通过互联网连接的枢纽（针对无实时互联网访问的情况）之间传输数据。存储在\
  \ `MAPs` 中的数据通过廉价的 `Wi-Fi` 无线收发器在每个点对点连接上高带宽自动传输。\n\nDakNet 有两个基本操作步骤（Pentland et\
  \ al., 2004）：\n\n*   当安装了 `MAP` 的车辆到达带有 `Wi-Fi` 功能的农村亭台区域内时，它会上传和下载大量数据。\n*   当它到达任何互联网接入点或枢纽时，它会自动同步从农村亭台收集的所有数据。\n\
  \n通过每辆安装了 `MAP` 的车辆，反复执行这些步骤，从而形成了一种经济且持续的无线通信基础设施。\n\n对于一辆通过高连接质量农村地区的单次车辆来说，实现常规信息服务可能就足够了。尽管\
  \ DakNet 不提供按需数据交付，但它可以在每个方向上传输海量数据（通常为 `20 MB`），并且与电话调制解调器等低带宽技术相比，它可以提供高数据吞吐量。村民可以利用相同的基础设施，通过额外安装无线电塔和天线来享受按需信息访问，这些额外设施对他们来说是完全透明的，因为他们不需要学习新技能即可。有了这些额外设施，可以启用一些新的、更复杂的服务，例如\
  \ IP 语音（VoIP），它允许通用的实时电话。异步无线宽带通信为全天候的宽带框架和终端用户实用程序提供了基础和迁移路径（Pentland et al., 2004）。\n\
  \n印度和柬埔寨北部的村民正在 DakNet 连接的帮助使用电子邮件和语音信箱等电子服务。印度的一个名为 Bhoomi 的电子治理项目将 DakNet 概念作为负担得起的农村连接的工具，并于\
  \ 2003 年 9 月安装在柬埔寨的偏远地区，涵盖 15 所太阳能农村学校、远程医疗中心和一个州长办公室。\n\n### 度的 Bhoomi 计划\n\n该计划由卡纳塔克邦州政府发起，旨在将土地记录数字化，并成功部署在全州的每个县级总部，完美取代了纸质记录系统（Chawla\
  \ and Bhatnagar, 2004）。`Bhoomi` 的数据库可供距离 `Bhoomi` 县总部 `Taluka` 高达 `40 km` 的 Daddaballapur\
  \ 村庄使用。在部署过程中，使用一辆配备了 DakNet `MAP` 的公共汽车将每个村乡村亭台的土地记录请求传送到 `Taluka` 服务器。这些服务器处理请求并生成土地记录；此外，这些记录通过公共汽车运送到每个乡村亭台，在向亭台经理收取少量费用后在当地打印。公共汽车每天通过枢纽和每个村庄往返三次，使村民能够访问\
  \ `Bhoomi` 数据库。这在成本和访问便利性方面为村民提供了若干益处。\n\n### 柬埔寨学校的电子邮件设施\n\n柬埔寨几乎 225 所农村学校由 `cambodiaschools.com`\
  \ 管理，其目的是通过与骨干网或枢纽（配备省会 `Ban Lung` 的卫星天线）建立异步连接来促进互联网访问，这由 `256 Kbps` 链路组成（Chea\
  \ et al., 2009）。该项目由一些个人捐赠者世界银行资助。与 `Bhoomi` 项目不同，由于柬埔寨北部地形复杂，这里的 `MAPs` 安装在 `Honda`\
  \ 摩托车或牛车上（少数地点）。该项目的成效也非常令人满意，因为它首次为柬埔寨的学生提供了互联网设施。\n\n受到 DakNet 巨大反响和低成本实施的激励，研究人员正将其覆盖范围扩大到其他国家，包括尼日利亚、约旦和柬埔寨的其余地区。研究人员还试图提供一种关键解决方案，使用户能够自己实施\
  \ DakNet。这样的项目应该为孤立地区的居民首次实现数字连接的可能性，因为研究表明增加连接性会促进经济增长。此类项目的主要目标是用无线技术取代有线互联网连接，但只有在通过某些官僚评估（包括用户满意度、经济增长和系统可靠性）后才能实施。政府只有在成功竞争通过上述官僚评估后，才能为世界偏远地区的贫民提供互联网设施。\n\
  \n\n\n\n# Haggle\n\nHaggle 是一种最近用于间发性连接环境下提供通信的联网方法（Nordström et al., 2012）。在间发性连接中，不存在固定的网络连接，无论是蓝牙、802.11\
  \ WLAN、以太网或其他。它旨在通过利用应用层转发而非网络层转发，从根本上退出当前的 TCP/IP 协议族。Haggle 利用上下文感知，在间发性连接状态下的泛在移动设备之间进行消息传输。机会性转发、身份验证、隐私、可靠性以及鼓励合作是\
  \ Haggle 的主要特性。一些研究人员已经部署了这种通信模型，在大规模（约 500–800 个节点）实验的基础上对其进行研究，了安全性、可靠性和信息老化等问题，并与社会学家进行了交流，以分析其对互联网用户的意义。Haggle\
  \ 代码可以从 `https://code.google.com/archive/p/haggle/` 下载。\n\nHaggle 为一组具有过度空间局部性的新应用赋予了能力，并将这种网络领域称为社区，还对社区的形成和管理提供了特定支持。Haggle\
  \ 内部的社区使得得出结论和控制信息传输变得简单（Scott et al., 2006）。Haggle 可用作一种自需内容共享的技术，旨在利用对上下文感知循环的搜索。遵循用户重要的原则，Haggle\
  \ 优先考虑内容，并允许高需求内容比非需求内容传输得更快，即使目标候选数量很少时也是如此；也就是说，即使内容并不流行，感兴趣的候选者也有强烈的意愿。与 Haggle\
  \ 不同，早期的移动内容共享技术侧于最大化交付率和最小化延迟，而不考虑其对用户重要性，但 Haggle 可以抑制低需求内容的传输，从而节省能量、存储和带宽，并尽可能地减少垃圾信息的传播（Odiyo,\
  \ 2010）。\n\nPhotoShare 使用户共享智能手机相机拍摄的图像。MobiClique（Pietiläinen et al., 2009）和 Opportunistic\
  \ Twitter（Ristanovic et al., 2012）允许以自需方式使用 Facebook 和 Twitter。MailProxy 促进了在没有基础设施的情况下发送电子邮件。Haggle-ETT（Martín-Campillo\
  \ et al., 2010）为灾区地区提供了电子分诊标签；这些是构建在 Haggle 之上的若干突出应用。Haggle 使这些应用能够在无任何中间服务提供商支持的情况下通过自需网络和当前局域网（LAN）明显地共享和传输内容。邻近设备共享它们的兴趣并按优先级推送共同内容，接收到的内容存储在本地，直到新的传输机会出现。这意味着内容根据其相对优先级移动，而不需要端主机的身份或地址。\n\
  \n与 DTN（Fall, 2003）、PodNet（Lenders et al., 2007）以及现有的发布/订阅系统（Eugster et al., 2003）等相关系统相比，Haggle\
  \ 的贡献之一是将基于推送的搜索传播作为内容共享的基本技术。其他贡献还包括使用转发算法估计内容代表的先进方法（考虑了正确的抽象和基础），以及如何将它们结合起来构建一个系统。Haggle\
  \ 使智能手机用户能够在节点接触受时间限制时，根据重要性共享内容并对其进行排序。\n\n## 12.12 结论\n\n机会网络的通信和计算机制为泛在和间歇性网络提供了一种新兴的计算范式，在未来拥有巨大的机遇。通过观察泛在设备在我们日常生活中的当前增长和利用，机会性网络在不久的将来将成为我们日常生活的重要部分。因此，尽管机会性网络已经有许多现有应用，但仍需要开发更高效的解决方案来解决这一迷人计算领域中仍然存在的许多未解决问题。为了使这种范式更加流行、安全、可靠且容错，需要与高度动态、分布式且间歇性的网络相兼容的软件架构。除了所有这些属性外，架构还应该具有极大的灵活性、可扩展性、适应性和用户友好性，以便用户成功接受。机会性计算可以解决许多挑战性应用领域的问题。机会性网络的关键应用领域包括灾难和危机管理系统、信息移动服务和智能交通系统、泛在医疗系统以及社交和上下文感知计算系统。本章介绍了机会性网络领域重点应用领域的许多现有框架、案例研究和实验。它还关注了应用设计人员在开发机会性网络应用时面临的若干挑战和问题。通过通过深入研究一些关键问题（包括安全性、遗留系统支持和用户界面），探讨了每个现有应用。本章深入研究了\
  \ 10 个展示了机会性网络不同方面的现有应用。\n\n##  References\n\nAhmed , S. H., Kang , H., and Kim\
