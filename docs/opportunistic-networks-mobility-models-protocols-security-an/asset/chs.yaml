  \n## 13.5 基于时间与数据触发的机会性网络跨层反馈仿真\n### 13.5.1 模式生成\n### 13.5.2 模式与场景文件\n### 13.5.3\
  \ KauNet 触发\n\n## 13.6 研究方向\n\n## 13.7 关键术语与定义\n\n## 13.8 参考文献\n\n\n\n\n\n# 13.1\
  \ 引言\n\n网络性能可以通过仿真、仿真和实时实验来评估。然而，在机会性网络（opportunistic networks）的情况下，在仿真环境中进行实验具有若干优势。多跳移动通信经常面临连接中断和节点密度低的问题。在这种情况下，传统的网络通信协议可能无法保证端到端的连接性。延迟容忍网络（`DTN`）是一种通信网络范式，能够在端到端连接无法保证且间歇性数据以不同间隔到达的情况下，确保可靠的节点间通信。在这些情况下，仿真器提供的结果可能与现实相径甚远。实时实验是实际部署前评估系统性能的理想选择。然而，实时系统面临时间和资金限制。此外，设计用于灾难管理或紧急情况下部署的系统无法在事件发生前进行评估。在这种情况下，网络仿真是理想的。目前有许多仿真器可以评估为机会性网络设计的协议。\n\
  \n在本章中，我将探讨通过时间驱动触发来仿真机会性网络、仿真设计方面以及不同的仿真抽象技术。还讨论了机会性网络跨层信息交换仿真的研究方向。\n\n# 13.2\
  \ 机会性网络中的仿真简介\n\n## 13.2.1 网络仿真的基础\n\n快速增长的分布式计算架构和功能需要充分的测试以满足服务质量（`QoS`）要求（Esmailpour,\
  \ 2016）。在这种情况下，仿真平台是理想的，因为它允许我们在不部署实际网络和设备的情况下使用协议和应用程序的真实实现。\n\n网络仿真器用于测量网络的吞吐量和响应能力。它也可以用于真实网络的故障排除。网络仿真器能够在不需要路由器甚至实时流量的情况下模拟客户端服务器配置（Jin\
  \ et al., 2014）。仿真器有硬件或软件解决方案两种。\n\n## 13.2.2 仿真、仿真与真实世界实验\n\n从实践和语义上讲，网络仿真器不同于网络模拟器。仿真器用于测试真实网络的性能。在网络仿真器中，节点等端系统可以连接到仿真器上。网络仿真器镜像网络，连接连接端系统（Hahn\
  \ et al., 2011）。\n\n另一方面，网络模拟器是一种创建虚拟网络的数学模型。模拟器被程序化为在具有可变节点和延迟的负载负载配置下模拟实际网络。`OPNET`、`NetSim`\
  \ 和 `ns`（开源）是一些模拟器的示例。\n\n通用开放研究仿真器（`CORE`）是一种用于混合拓扑结构的网络仿真器（Ahrenholz, 2010）。在实时，`CORE`\
  \ 构建了计算机网络的表示。它由网络技术研究小组开发，是波音研究与技术部门的一部分。仿真器可以连接到物理网络和路由器（[图 13.1]）。它为运行真实的应用程序和协议提供了一个环境。`CORE`\
  \ 用于网络场景评估和协议测试。可以使用 `CORE` 测试网络的扩展性。\n\n![](img/fig13.1.jpg)\n\n图 13.1\n\nCORE\
  \ 架构。\n\n`CORE` 的后端是 `CORE` 守护进程，它管理仿真会话。图形用户界面（`GUI`）和守护进程使用基于 socket 的应用程序接口 `CORE\
  \ API` 进行通信。节点和网络通过安装在节点上的接口结合在一起。仿真器允许通过基于 socket API 运行不同的网络组件。`CORE` 守护进程还可以管理虚拟节点和网络的会话。`CORE`\
  \ 节点比完整的虚拟机更轻量。在标准计算机上可以创建几十个节点。网络栈可以在 `CORE` 框架中重用。源代码是可选的并且易于理解和修改。\n\n`CORE`\
  \ 使用操作系统的虚拟网络栈仿真网络。为了进行仿真，`CORE` 需要运行在通用计算机上。`CORE` 本身不是硬件或测试平台的实例化。\n\n`ns-3` 是一种用于模拟网络和路由协议的网络模拟器。它是一个基于离散事件的模拟器，能够测试路由和队列算法，并在线和无线网络上运行组播协议和\
  \ IP 协议，例如用户数据报协议（`UDP`）或传输控制协议（`TCP`）。`ns-3` 仿真核心支持基于 IP 和非 IP 网络（[图 13.2]）。\n\n\
  ![](img/fig13.2.jpg)\n\n图 13.2\n\nns-3 架构。\n\n`ns-3` 构建为一个协同工作的软件库系统。可以编写与这些库链接的用户程序。要部署\
  \ `ns3`，目标系统应先构建库，然后构建用户程序程序。\n\n## 13.2.3 机会性网络中仿真的优势\n\n大规模机会性网络在实际部署之前需要大量的评估。测试平台通常包括对具有多个交换机和节点的大型网络的测试。因此，网络仿真可以是实际部署前一种成本效益高的解决方案。真实的客户端/服务器应用程序服务可以部署在仿真网络中。通过增加单个机器上的客户端数量来实现扩展。\n\
  \n### 13.2.4 挑战\n\n机会性网络中的计算节点通常是资源有限的移动设备。配置仿真器的场景之一是考虑仿真器机器之外的节点。创建 `UDP` 隧道是为了在仿真器和每个应用程序之间传输以太网帧。因此，分布对于仿真器来说是透明的。这种环境可能很难配置。此外，网络场景可能从简单拓扑结构到复杂设计不等。因此，配置应尽可能自动化。\n\
  \n## 13.3 机会性网络的仿真设计方面\n\n## 13.3.1 泛在计算\n\n泛在计算是分布式计算的演进，计算设备被集成用于信息处理。它也被称为无处不在的计算。它能够在任何需要的地方的地方进行计算和信息交换。计算设备在无线网络上相互交互和通信。\n\
  \n### 13.3.2 延迟容忍网络（DTN）架构\n\n\n\n\n\n移动自接网络类似于地面移动网络、传感器网络或卫星通信，通常会经历高延迟、断开连接和长时间的等待。其他需求（如互操作性考虑和计算设备的低功耗）使得可靠通信任务变得更具挑战性。容延网络（DTN）提供了一种独立于消息服务的网络架构。DTN\
  \ 运行在各种网络架构的传输层之上，并为异构和特殊网络提供存储转发功能（Li 等人，2015）。在需要可靠递送时，DTN 要求将消息存储在非易失性内存中，并通过全局唯一元组提供名称映射。DTN\
  \ 调度器的结构见图 13.3。\n\n![](img/fig13.3.jpg)\n\n图 13.3  \n\nDTN 调度器的结构。多个收敛层（每个协议栈对应一个）为消息调度器提供了一个公共接口。\n\
  \n传输到具有大量非易失性存储的 DTN 节点的消息被归类为持久性。它可以持有该消息直到下一次通信机会。在 DTN 中，不能假设存在端到端的路由路径。相反，路由被分类为一系列随时间变化的接触点，被称为“通信机会”，其特征是开始和结束时间、延迟、方向和容量。\n\
  \n### 13.3.3 覆盖网络的包协议](#chapter13.xhtml#re_ch-13-sec-10)\n\n在 DTN 中，包（bundle）被定义为一个数据单元。同一个包的多个实例可能存在于网络的不同部分。然而，不同的实例可能有不同的表示形式。一个实例可能位于包节点的本地内存中，而另一个实例可能处于传输途中。包负载（bundle\
  \ payload），或简单称为“负载”，是要传输到包目的地的数据。如果携带的是完整数据，则称为名义负载。负载可以被分段，例如长度为 `M` 字节的数据中的前\
  \ `N` 字节，其中 `N<M`。目标地址在包传输期间作为参数之一提供。DTN 中发送或接收包的节点被称为包节点。包节点可以是运行在通用计算机上的进程。然而，一个通用的包节点有三个组件：(i)\
  \ 包协议代理；(ii) 收敛层适配器；以及(iii) 应用代理。\n\n节点的包协议代理是执行包协议过程的组件。收敛层适配器代表包协议代理发送和接收包。节点的应用代理是利用包协议（BP）服务的节点组件（图\
  \ 13.4）。\n\n![](img/fig13.4.jpg)\n\n图 13.4  \n\n包协议位于应用层。\n\nBP 在具有间歇性连接、高位错误概率和可变延迟的网络中非常。BP\
  \ 实现在应用层，形成一个存储转发网络。BP 的特征是能够通过覆盖网络的延迟绑定来利用机会性网络的能力。\n\n### 13.3.4 安全：身份验证与隐私](#chapter13.xhtml#re_ch-13-sec-11)\n\
  \n机会性网络利用开放网络传输数据。中间节点可能是恶意的（在不考虑自身利益的情况下攻击正常的网络操作）或自私的（意图在最大化自身利益的同时最小化其对任务的贡献）。在\
  \ DTN 中，包可能会穿越底层的异构网络。在传输过程中出于恶意目的修改消息（或包）是一个巨大的安全威胁。由于 DTN 的资源稀缺特性，未经授权访问和使用 DTN\
  \ 资源可能是一个严重的问题。端到端连接的缺失不仅给路由带来了挑战，还使得现有的安全解决方案不再适用。\n\n《包安全协议规范》定义了可能包含在包中的三种安全块：i)\
  \ 包身份验证块 (BAB); ii) 负载完整性块 (PIB); 以及 iii) 负载机密块 (PCB)。\n\n### 13.4 仿真器测试平台](#chapter13.xhtml#re_ch-13-sec-12)\n\
  \n#### 13.4.1 概述](#chapter13.xhtml#re_ch-13-sec-13)\n\n仿真提供了完全控制且可重复的环境，在这些环境中，应用程序可以在本地实验室中共存以进行开发和调试（Beuran\
  \ 等人，2012）。仿真网络是很容易实现的。它具有成本效益且可扩展性。\n\n测试平台是一个在现实世界中测试协议的框架。测试平台由四个元素组成：i) 组件（硬件和软件）；ii)\
  \ 监控架构；iii) 数据库；iv) 用于存储和分析结果的 GUI。\n\n#### 13.4.2 质量观测与移动性实验工具 (QOMET](#chapter13.xhtml#re_ch-13-sec-14)\n\
  \n可以创建一个可扩展的有线网络基础设施来执行无线网络仿真。QOMET 是一个具有两阶段场景驱动仿真的无线局域网（WLAN）仿真器。在第一阶段，用户提供一个代表真实世界的场景。第一阶段的输出是连续时刻网络状态描述。基于此，第二阶段产生无线环境条件。\n\
  \n场景驱动架构有两个阶段。在第一阶段，根据真实世界的场景表示创建网络质量下降（`∆Q`）描述，其对应于真实世界的事件（图 13.5）。两点之间网络服务质量的变化被称为下降，表示为\
  \ `ΔQ`。在第二阶段，使用第一阶段计算出的 `ΔQ` 完成仿真器配置。\n\n![](img/fig13.5.jpg)\n\n图 13.5  \n\nWLAN\
  \ 仿真的两阶段方法。\n\n对于仿真器配置，计算距离引起的衰减至关重要。衰减被建模为大规模路径损耗和小规模衰落分量。如果 `γ` 是信道的路径损耗指数，距离\
  \ `d` 的大规模路径损耗表示为 `d^γ`。衰落代表信号与估计衰减之间的偏差（图 13.6）。\n\n![](img/fig13.6.jpg)\n\n图 13.6\
  \  \n\n分布式仿真设置。\n\n距离参考点距离 `d` 处的接收功率表示为：\n\n```\nUR = UR - 2.3log(d^γ) - X[σ]\n\
  ```\n\n其中：\n- `UR` 是参考点的功率\n- `d^γ` 是路径损耗\n- `X[σ]` 是代表衰落分量的高斯分布随机变量\n\n帧错误率 (FER)\
  \ 是接收功率 `UR` 的函数，表示为：\n\n```\nFER[1] = FER[s] * e^(γ*(S - UR))\n```\n\n其中：\n- `FER[s]`\
  \ 是适配器特定的帧错误率\n- 当 `UR` 等于阈值 `S` 时，`FER[1]` 等于 `FER[s]`\n\n仿真器还有另一个问题——区分信号和噪声的能力。比特错误率\
  \ (BER) 可以表示为信噪比 (SNR) 和接收功率 `UR` 的函数。\n\n下一步是引入延迟 `D`。延迟计算为由于重传延迟的加权平均值。`UR`、`FER`、`BER`\
  \ 和 `D` 是数据链路层的仿真参数。下一步是计算网络层参数。丢包率 (PLR) 和感知带宽 (BW) 是两个需要建模的参数。PLR 是 `FER` 的函数。\n\
  \n#### 13.4.3 QOMB 测试平台](#chapter13.xhtml#re_ch-13-sec-15)\n\n\n\n\nQOMB 是一个用于评估无线网络系统、协议和应用程序的测试平台。该测试平台使用了无线网络仿真工具集——质量观测与移动实验工具（QOMET）。对于给定的场景，该测试平台可以重现真实的无线网络条件（Beuran,\
  \ 2012）。\n\n根据流量状况，QOMB 测试平台支持多跳路由协议（如优化链路状态路由协议，OLSR）以及动态通信状态计算。也可以进行路由协议的实际实现。\n\
  \n对应于现实世界的事件，QOMET 使用场景表示来计算点到点的网络质量衰减（`ΔQ`）。`ΔQ` 的描述通过内核模块中的动态库程序实时应用。因此，用户定义的无线条件场景会在有线网络测试平台上被重现。QOMB\
  \ 中执行了几个处理步骤以实现流量状况并支持多跳路由。使用 QOMB 测试平台，可以在不同的网络场景下实现常规协议。\n\n## 13.5 使用时间与数据驱动的触发机制以仿真机会性网络中的跨层反馈\n\
  \n机会性网络协议除了交换数据包外，还需要对底层网络的动态变化做出响应。为了支持对下层事件做出响应的应用和协议的 IP 级仿真，可以实现仿真触发器。仿真触发器可以与其他仿真效果同步，并仿真任意的跨层反馈。\n\
  \n本章重点介绍 KauNet 仿真系统。该系统提供了基于仿真的实验，具有更高的控制和灵活性。通过收集的轨迹和解析表达式，可以重现模式的起源。\n\nKauNet\
  \ 基于著名的仿真器 `Dummynet` 设计。`Dummynet` 是一个实时网络仿真工具，最初设计用于测试网络协议。它也用于带宽管理和各种调度算法的实现。`Dummynet`\
  \ 已使用多年，提供了稳定的代码库。`Dummynet` 可以仿真丢包、引入延迟并应用带宽限制。`KauNet` 扩展了 `Dummynet`，增加了引入位错误的能力。`KauNet`\
  \ 允许按数据包或每毫秒为单位进行位错误、丢包、延迟和带宽变化。\n\nKauNet 使用描述所需变化的模式（patterns）。在仿真开始时，模式被插入 `KauNet`\
  \ 的内核中。它允许在条件变化时进行精确控制，从而确保了细粒度的控制。使用命令行工具来整合动态事件。KauNet 仿真器的常用用途是传输层协议的验证、传输层和应用层的性能评估，以及切换场景的仿真。\n\
  \nKauNet 的两种运行模式是时间驱动和数据驱动。在时间驱动模式下，无论是否传输了数据，索引每毫秒都会增加一次。在数据驱动模式下，索引随每个数据包增加一次。因此，触发模式的最大分辨率为一毫秒或一个数据包。然而，在位错误模式下，索引根据比特数进行增加。\n\
  \n### 13.5.1 模式生成\n\n最初，模式在内核空间中创建并保存。在仿真期间，仿真器的行为由这些模式控制。可以指定不同的流发送到不同的管道（pipes）。这允许使用许多不同的模式仿真多个主机之间的多个连接。可以使用\
  \ `ipfw` 命令创建多个规则。可以指定一个新模式，该模式将在当前模式完成后被使用。默认设置是循环的，在一个模式周期完成后从头重新开始。\n\n除了基于内核的模式管理外，还提供了一个命令行工具\
  \ `patt_gen` 用于创建和管理模式。它还能够从简单的文本文件中导入未压缩的模式描述。这些文本文件可以由离线仿真器或轨迹采集设备生成。除了命令行工具，还有一个基于\
  \ GUI 的工具 `pg_gui`。\n\n### 13.5.2 模式与场景文件\n\n对于每个方面（如丢包、位错误、延迟、可变带宽等），都需要单独的模式文件。实验需要一个多个方面的同时变化——因此在仿真运行时需要管理多个模式。模式文件使用\
  \ `patt_gen` 工具存储并导入到内核。\n\n为了简化模式文件的管理，定义了一种场景文件格式。场景文件由多个模式文件和一个额外的头文件组成。场景文件头也包含一个场景\
  \ ID（SID）和对场景的文本描述。仿真器配置为接受具有正确校验位数的 SID。\n\n### 13.5.3 KauNet 触发\n\nKauNet 中将信息传递的功能称为触发器（triggers）。触发器在运行时传送位置控制信息。触发模式可以是数据驱动或时间驱动的。KauNet\
  \ 触发在涉及机会性网络的场景中更为常见。机会性网络固有的间歇性连接等跨层信息可以通过触发来仿真（Pérennou et al., 2011）。\n\n考虑一个具有间歇性连接且在连接变化期间带宽可用场景。在这种情况下，可以对连接期间发生的带宽变化进行建模。带宽变化模型与生成向上流连接信息的触发模式相结合。带宽和触发模式相互同步，以形成一个一致的仿真场景。\n\
  \n[图 13.7] 显示了使用触发器的仿真设置的概览。在此设置中，两个主机通过一个支持 KauNet 的主机连接。KauNet 主机仿真特定链路或网络的条件。对带宽可变性、延迟、位错误和丢包进行仿真。触发模式位于\
  \ KauNet 主机上。触发模式使用 `patt_gen` 工具创建。\n\n```\nimages/fig13.7.jpg\n```\n图 13.7\n\n\
  时间驱动的仿真触发。\n\n为了将 KauNet 的触发功能扩展到外部进程，需要一种机制将触发的触发器的触发值传输给接收者。此功能通过触发器通信模块实现。该模块允许通过\
  \ UDP 接口从某个管道接收触发器。触发器的接收者可以位于用户空间或内核空间，位于本地或另一个主机上。\n\n总之，依赖于跨层信息的机会性通信可以通过 KauNet\
  \ 仿真系统的模式驱动触发器进行仿真。触发器可以与其他仿真效果控制并同步。触发器通过触发器通信模块分发到本地和远程进程。仿真器允许对位错误、丢包和数据包延迟进行细粒度且重复的控制。\n\
  \n## 13.6 研究方向\n\n\n\n\n`KauNet` 内核中高效的模式处理将提高仿真器的吞吐量。针对机会性网络，减少模拟延迟、位错误和变量带宽的计算开销需要进一步的研究。模式以压缩格式存储在内核中，并随着模式信息的消耗逐步进行解压缩。未来可以进行研究以演进更好的压缩和解压缩技术。\n\
  \n## 核心术语与定义\n\n**动态源路由 (DSR)**：一种用于移动节点多跳无线自组织网络的路由协议。`DSR` 允许网络完全自组织和自配置，不需要任何现有的网络基础设施或管理条件。`DSR`\
  \ 仅在发送节点请求路由时才形成路径。然而，它使用源路由而不是依赖每个中间设备上的路由表。\n\n**网络仿真**：从执行点的角度评估网络性能的实验技术。它提供了不同层次的抽象和对实验的控制，以及一系列可以重现的实验条件。仿真是实时进行的，并允许动态改变条件的选项。因此，网络仿真可以在取决于成本、时间等限制因素的广泛范围内进行。使用仿真对延迟容忍网络（DTN）进行性能评估更为有效。\n\
  \n**优化链路状态路由 (OLSR)**：一种针对移动自组织网络优化的 IP 路由协议，也可用于其他无线自组织网络。若干选定的节点被称为多点中继（`MPRs`），在泛洪过程中转发广播消息。与经典的泛洪机制相比，这种技术显著减少了消息开销（后者每个节点在接收到第一个副本时都会重新发送）。链路状态信息仅由选为\
  \ `MPRs` 的节点生成。因此，通过最小化网络中泛洪控制消息的数量实现了第二次优化。\n\n## 参考文献\n\nAhrenholz, J. (2010).\
