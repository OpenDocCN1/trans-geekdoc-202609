    It is generally accepted that the classical ML algorithms are capable of dealing
    with complicated features of the input data, such as multiple-dimensions and multi-collinearity.
    The input variables of HCP-Models were the features extracted from Raman spectra,
    which were all related to holocellulose, which may lead to the correlation among
    predictor variables. For verify the multi-collinearity, the variance inflation
    factor (VIF) was calculated. The value of VIF was 17.22, greater than 10, indicating
    that the data were suffered from multi-collinearity. The characteristic of multi-collinearity
    brings greater challenge for model development, which may partially unsolved by
    introducing the penalty item in regularization models. SVR is a widely used algorithm
    in regression and classification tasks. In SVM system, the result was determined
    by a few support vectors. The key information was utilized efficiently and the
    redundant information was eliminated, which is helpful to improve the robustness
    of SVR model. Both DT and RF are tree-based models. In DT model, the number of
    splitting nodes are adjusted to cater to the complexity of input values. By doing
    so, the essential information of input values can be extracted as much as possible
    when the redundant ones were hindered from intervening the models. Meanwhile,
    the deeper the model tree, the higher accuracy the training set, but the more
    possibility of overfitting. So, the tree-depth of the DT is controlled in model
    development, which can effectively avoid overfitting. Even DT and RF are both
    tree-based models, it may be difficult to train a reliable model with high predictive
    accuracy from multitudinous or complicated data because of the restrictions of
    memory, time complexity and data complexity (Mu et al., 2018). These deficiencies
    of DT can be partially compensated by RF which was an ensemble of many decision
    trees. In RF models, each decision tree was used as parallel estimators and the
    result of the model was based on majority vote of the results received from each
    decision tree. Consequently, the predictive accuracy of RF model was higher than
    that of DT. Comparing the classical ML models with the regularization models,
    it can be found that the prediction accuracy of the classical ML models was higher
    than that of the regularization model. It may demonstrate that the classical ML
    algorithms are more suitable than the regularization algorithms in dealing with
    the multiple-dimensions and multi-collinearity input values in this study. Furthermore,
    the RF model was superior to others five models. It is also coherent to the findings
    in building the lignin predictive models (Gao, Zhou, Liu, et al., 2022). Consequently,
    comparing with the result in this study with the findings of lignin predictive
    models in our previous work, it is suggested that the selection of optimum model
    from different classical ML algorithms did not change with the different data
    matrix of extracted features from Raman spectra.


    # 3.6. Prediction performance of advanced GBM algorithms


