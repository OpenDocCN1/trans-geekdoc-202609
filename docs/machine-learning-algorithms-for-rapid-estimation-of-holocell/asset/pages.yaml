    SVR, DT, and RF were all the commonly used classical ML algorithms. SVR is derived
    from support vector machine (SVM), which originally defines hyperplane for solving
    classification tasks, and then extended to solve more complex problems such as
    regression (Awad & Khanna, 2015). DT and RF are tree-based algorithms. But DT
    has only one tree, whereas RFs many decision trees on many sub-samples of dataset.
    The predictive value of RF model was based on the majority vote of the results
    received from each decision tree.


    LightGBM, CatBoost, and XGBoost are all advanced GBM algorithms which are famous
    for their efficiency, accuracy and interpretability in many complex tasks (Dorogush
    et al., 2018; Hong, 2020; Jabeur et al., 2021; Ke et al., 2017). XGBoost is a
    modified frame from GBM proposed by Chen, which is adept at dealing with tasks
    of classification and regression (Chen & Guestrin, 2016). The tree nodes in XGBoost
    were split layer by layer, and the residuals of the previous model-tree are fitted
    through the newly generated tree (Pan et al., 2022). LightGBM is a distributed
    and efficient gradient boosting framework which is histogram-based and places
    continuous values into discrete bins, leading to a faster training and more efficient
    memory usage (Ke et al., 2017). CatBoost is an advanced gradient boosting decision
    tree algorithm proposed in 2018. It is advantaged at its efficient and rational
    function in processing features. And the greedy strategies were considered to
    improve the prediction accuracy when CatBoost model constructing new split points
    for the current tree (Jabeur et al., 2021; Prokhorenkova et al., 2018). All the
    models were built with Jupyter Notebook in Python environment.


