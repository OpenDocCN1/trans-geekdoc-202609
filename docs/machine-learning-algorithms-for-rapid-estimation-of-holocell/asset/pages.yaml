    # 3. Results and discussion


    # 2.6. Model evaluations


    # 3.1. Analysis of FT-Raman spectra


    Raman spectra provides a great deal of spectral information with high chemical
    information content, which is characterized by a series of peaks related to specific
    chemical bonds (Jermyn et al., 2016). As shown in Fig. 1, both the signals at
    1095 and 1122 cm–1 were attributed to the C—O and C—O stretching, symmetric and
    asymmetric stretching of COC, glycosidic, and ring breathing (Schenzel & Fischer,
    2001; Wiley & Atalla, 1987). The peak located at 1149 cm–1 appeared to be related
    to HCC and HCO bending (Schenzel & Fischer, 2001; Wiley & Atalla, 1987), and 1462
    cm–1 was assigned to the CH2 scissoring of carbohydrates (Agarwal & Atalla, 2010).
    At the signal of 1331 cm–1 and 1378 cm–1, HCC and HCO bending coordinates were
    most significant (Wiley & Atalla, 1987). The C—H stretching region from 2780 cm–1
    to 3060 cm–1 includes contributions from lignin and carbohydrates (Wiley & Atalla,
    1987). In detail, the peak at 2895 cm–1 was assigned to CH and CH2 stretching
    of the cellulose dominates (Wiley & Atalla, 1987), and the peak at 2945 cm–1 from
    the CH stretching of the methoxyl groups of the lignin was more pronounced (Gierlinger
    & Schwanninger, 2006; Wiley & Atalla, 1987), which have been proved to be a qualified
    internal standard in the task of predicting holocellulose content based on Raman
    spectroscopy (Gao, Shu, et al., 2022). After the spectral processes of smoothing,
    baseline correction, and deconvolution calculation, the input variables of HCP-Models
    were obtained, which were expressed as I1095, I1122, I1149, I1331, I1378, I1462,
    and I2895.


    The predictive accuracy of all the quantitative models, namely, RR model, LR model,
    ENR model, SVR model, DT model, RF model, LightGBM model, CatBoost model, and
    XGBoost model, were estimated by the coefficient of determination (R2), root mean
    square error (RMSE), normalized root mean square error (NRMSE), mean absolute
    error (MAE), and mean absolute percentage error (MAPE). R2 is an index of goodness
    of fit, indicating the proportion of variance of output variable explained by
    the input variables. Theoretically, the larger the R2, the higher the model accuracy
    (Hosseinzadeh et al., 2022; Schubert & Kläusler, 2020). The RMSE is frequently
    used metric of errors between measured and predicted values, which serves to aggregate
    the magnitudes of the errors in predictions for various data points into a single
    measure of predictive power. The RMSE is a measure of accuracy, to compare forecasting
    errors of different models developed by RR, LR, ENR, SVR, DT, RF, LightGBM, CatBoost,
    and XGBoost. The NRMSE refers to the root mean square of RMSE normalized by the
    average of measured values. The lower the value of RMSE and NRMSE, the higher
    the predictive accuracy of quantitative model. The MAE is the average difference
    between the observations (measured values) and model output (predictions), which
    is a metric to measure the accuracy of a given model. MAPE is a simple average
    of absolute percentage errors, which used to define the accuracy of predictive
    model. The lower the value of MAE, the better a model is able to forecast values.
