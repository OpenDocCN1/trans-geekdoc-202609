    ### 2.6. 模型评估


    ### 3.1. FT-Raman光谱分析


    拉曼光谱提供了大量具有高化学信息含量的光谱信息，其特征是一系列与特定化学键相关的峰（Jermyn et al., 2016）。如图 1 所示，1095 cm–1
    和 1122 cm–1 处的信号均归因于C—O和C—O伸缩振动、COC的对称和不对称伸缩振动、糖苷键以及环呼吸振动（Schenzel & Fischer,
    2001; Wiley & Atalla, 1987）。位于1149 cm–1 的峰似乎与HCC和HCO弯曲振动有关（Schenzel & Fischer,
    2001; Wiley & Atalla, 1987），而1462 cm–1 被分配给碳水化合物的CH2剪切振动（Agarwal & Atalla, 2010）。在1331
    cm–1 和 1378 cm–1 处的信号中，HCC和HCO弯曲坐标最为显著（Wiley & Atalla, 1987）。2780 cm–1 至 3060
    cm–1 的C—H伸缩振动区域包括木质素和碳水化合物的贡献（Wiley & Atalla, 1987）。具体而言，2895 cm–1 处的峰被分配给纤维素的CH和CH2伸缩振动（Wiley
    & Atalla, 1987），而来自木质素甲氧基的CH伸缩振动的2945 cm–1 峰更为明显（Gierlinger & Schwanninger, 2006;
    Wiley & Atalla, 1987），这已被证明是基于拉曼光谱预测全纤维素含量任务中的合格内标（Gao, Shu, et al., 2022）。经过平滑、基线校正和去卷积计算等光谱处理后，得到了HCP模型的输入变量，分别表示为I1095、I1122、I1149、I1331、I1378、I1462和I2895。


    所有定量模型（即RR模型、LR模型、ENR模型、SVR模型、DT模型、RF模型、LightGBM模型、CatBoost模型和XGBoost模型）的预测精度均通过决定系数（R2）、均方根误差（RMSE）、归一化均方根误差（NRMSE）、平均绝对误差（MAE）和平均绝对百分误差（MAPE）进行评估。R2是拟合优度指标，表示由输入变量解释的输出变量方差的比例。理论上，R2越大，模型精度越高（Hosseinzadeh
    et al., 2022; Schubert & Kläusler, 2020）。RMSE是测量值与预测值之间误差的常用度量指标，用于将各数据点预测误差的幅度汇总为单一的预测能力度量。RMSE是精度的度量，用于比较由RR、LR、ENR、SVR、DT、RF、LightGBM、CatBoost和XGBoost开发的不同模型的预测误差。NRMSE是指由测量值平均值归一化后的RMSE均方根。RMSE和NRMSE的值越低，定量模型的预测精度越高。MAE是观测值（测量值）与模型输出（预测值）之间的平均差值，是衡量给定模型精度的指标。MAPE是绝对百分误差的简单平均值，用于定义预测模型的精度。MAE的值越低，模型预测数值的能力越好。R2、RMSE、NRMSE、MAE和MAPE的计算如下：


    ### 3.2. 数据集分析


