    在树生长过程中寻找分割点，显著提升了建模效率。但是，效率的普遍提高伴随着特征数量的减少以及对小梯度实例的随机丢弃，这在开发 LightGBM 模型时可能会略微降低预测精度（Ke
    et al., 2017）。由于本研究中的数据集数量与机器学习任务中常用的数据集相比并不大，因此建模效率不如预测精度重要。因此，在本研究中，由于上述优势，获得了更高预测精度的
    XGBoost 算法被赋予最高优先级。此外，CatBoost 构建的 HCP 模型的预测精度与 XGBoost 相近，但在木质素含量预测模型中略低于 XGBoost。这可能是由于从拉曼光谱中提取的特征具有不同的数学特性。因为与木质素相关峰相比，全纤维素相关峰的位置和强度差异很大，发现与全纤维素相关的提取特征所包含的标注输入变量数量多于与木质素相关的特征。CatBoost
    算法的特点是引入了有序增强，该方法擅长避免由目标泄漏引起的过拟合，从而随之提升模型的预测精度（Prokhorenkova et al., 2018）。因此，CatBoost
    的这一有利特性将有助于提高定量模型的预测精度。综上所述，基于拉曼特征估算全纤维素含量时，XGBoost 和 CatBoost 均优于所有其他模型。在经典机器学习算法组中，为构建相应预测模型而选择最优算法的结果不受两个数据集差异的影响，即提取的与木质素相关的拉曼特征或与全纤维素相关的拉曼特征。然而，在高级
    GBM 算法组中，预测全纤维素含量和木质素含量时最优算法的选择结果不一致，这是由于建模数据特性各异所致。因此，在执行 GBM 算法组中最优算法的选择时，不应忽略数据矩阵之间的差异。


    因此，拉曼特征与高级 GBM 算法相结合，可以开发出更鲁棒、更精确的模型，用于预测杨树木材的全纤维素含量。然而，可能还会遇到其他木质纤维素资源，包括其他被子植物和裸子植物，如竹子、藤类以及全纤维素化学结构和含量不同的农业残余物，这些尚未被研究过。但本研究描绘了通用方法论，当面对不同类型的材料时，模型需要进行调整和修改，以分别适应不同的木质纤维素资源。


    ## 4. 结论


    由正则化算法、经典机器学习算法和高级 GBM 算法构建的全部九个模型均已成功预测了全纤维素含量。高级 GBM 算法在训练和测试过程中均优于所有模型。特别是，CatBoost
    和 XGBoost 模型的测试 R<sup>2</sup> 预测精度为 0.93，测试 RMSE 约为 0.28%，在全部九个算法中居于首位。因此，很明显，傅里叶变换拉曼光谱结合机器学习算法是一种有前景的方法，可以在无需复杂繁琐的化学实验的情况下，准确且环保地预测全纤维素含量。


