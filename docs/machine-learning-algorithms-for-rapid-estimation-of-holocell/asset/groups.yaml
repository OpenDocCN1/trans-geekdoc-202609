    测试R²≥0.81，测试RMSE≤0.47%，测试MAE≤0.40%，测试MAPE≤0.49%。这三种经典机器学习算法已被证明适合构建HCP模型。在三种经典机器学习算法中，RF表现出最佳的预测精度，测试R²为0.85，RMSE为0.40%，MAE为0.31%，MAPE为0.38%，显示出竞争优势。而且，经典机器学习算法开发的HCP模型的预测精度高于正则化算法构建的模型，因为具有更高的R²和更低的RMSE、MAE及MAPE。


    普遍认为，经典机器学习算法能够处理输入数据的复杂特征，如多维性和多重共线性。HCP模型的输入变量是从拉曼光谱中提取的特征，这些特征均与全纤维素相关，可能导致预测变量之间的相关性。为验证多重共线性，计算了方差膨胀因子（VIF）。VIF值为17.22，大于10，表明数据存在多重共线性问题。多重共线性的特征为模型开发带来更大挑战，这可以通过在正则化模型中引入惩罚项来部分解决。SVR是回归和分类任务中广泛使用的算法。在SVM系统中，结果由少数支持向量决定。关键信息被高效利用，冗余信息被消除，这有助于提高SVR模型的稳健性。DT和RF都是基于树的模型。在DT模型中，分割节点的数量会调整以适应输入值的复杂性。通过此方式，在冗余信息被阻止干预模型的同时，可以尽可能多地提取输入值的基本信息。同时，模型树越深，训练集的精度越高，但过拟合的可能性也越大。因此，在模型开发中控制DT的树深度，可以有效避免过拟合。尽管DT和RF都是基于树的模型，但由于内存、时间复杂度和数据复杂度的限制（Mu
    et al., 2018），从大量或复杂的数据中训练出具有高预测精度的可靠模型可能很困难。RF作为许多决策树的集成，可以部分弥补DT的这些不足。在RF模型中，每个决策树被用作并行估计器，模型结果基于每个决策树所得结果的多数投票。因此，RF模型的预测精度高于DT。将经典机器学习模型与正则化模型进行比较，可以发现经典机器学习模型的预测精度高于正则化模型。这可能表明，经典机器学习算法比正则化算法更适合处理本研究中多维和多重共线性的输入值。此外，RF模型优于其他五个模型。这也与构建木质素预测模型的研究结果一致（Gao,
    Zhou, Liu, et al., 2022）。因此，将本研究的结果与我们之前工作中木质素预测模型的发现进行比较，建议从不同经典机器学习算法中选择最优模型并不会随着拉曼光谱提取特征的不同数据矩阵而改变。


