    Ke et al., 2017). The hyper-parameters and the tuned optimal value were summarized
    in Fig. 4 and Table 1.


    ## 3.4. Prediction performance of regularization algorithms


    All the HCP-Models were established with the optimum hyper-parameters (Table 1),
    and the statistical results of the nine models were shown in Tables 2 and 3. RR,
    LR, and ENR models were approximately equal to each other with the test R² of
    ~0.80 and RMSE of ~0.48%, which were nearly consistent with our previous study
    (Gao, Shu, et al., 2022). The predicted values from the regularization algorithms
    vs. measured values in datasets were plotted in Fig. 5. It should be mentioned
    that the previous models built by regularization algorithms lacks the step of
    tuning hyper-parameters. It was expected that the models should present higher
    predictive accuracy than the previous ones with the help of the additional tuning
    step. Nevertheless, it only displays marginally better results of RMSE in test
    set since the tuning process was monitored based on the value of RMSE. Therefore,
    it suggests that the tuning step is slightly helpful to improve the quality of
    models built by regularization algorithms in this study. It still leaves room
    for improvement for better algorithms.


