  - '[PAGE 0]


    # Machine learning algorithms for rapid estimation of holocellulose content of
    poplar clones based on Raman spectroscopy


    Wenli Gao a,b,1 , Liang Zhou a,b,*,1 , Shengquan Liu a,b , Ying Guan a,b , Hui
    Gao a,b , Jianjun Hu c


    a School of Forestry and Landscape Architecture, Anhui Agricultural University,
    Hefei, Anhui 230036, PR China b Key Lab of State Forest and Grassland Administration
    on Wood Quality Improvement & High Efficient Utilization, Hefei, Anhui 230036,
    PR China c State Key Laboratory of Tree Genetics and Breeding, Key Laboratory
    of Tree Breeding and Cultivation of National Forestry and Grassland Administration,
    Research Institute of Forestry, Chinese Academy of Forestry, Beijing, PR China


    # ARTICLE INFO


    +   - Holocellulose content

    +   - Machine learning algorithms

    +   - Raman spectroscopy

    +   - CatBoost

    +   - XGBoost


    # ABSTRACT


    In this study, regularization algorithms (RR, LR, and ENR), classical ML algorithms
    (SVR, DT, and RF), and advanced GBM algorithms (LightGBM, CatBoost, and XGBoost)
    were applied to build the holocellulose content predictive models of poplar based
    on features extracted from Raman spectra. Evaluation results of models indicate
    that classical ML algorithms show higher predictive accuracy than regularization
    algorithms, and the advanced GBM algorithms better than the classical ML algorithms.
    Furthermore, models built by CatBoost and XGBoost can estimate holocellulose content
    with high predictive accuracy of test R² above 0.93 and test RMSE less than 0.29%.
    It provides the heretofore best precision of holocellulose content predictive
    model based on Raman spectroscopy so far for our knowledge. Therefore, it is suggested
    that Raman spectroscopy coupled with ML algorithms is a promising tool for predicting
    the holocellulose content in poplar which can be applied in large-scale tree genetic
    and breeding programs.


    # 1. Introduction


    Holocellulose, the sum of cellulose and hemicellulose, is a water-insoluble carbohydrate
    fraction which can be extracted from wood materials through the chlorination method
    by removing the lignin (Basu, 2018). It is an important fraction because its hydrolyzed
    products were composed by various monomeric sugars, which are able to convert
    into useful compounds or to ethanol via fermentation (Isikgor & Becer, 2015; Ma
    et al., 2012). Due to the large differences in holocellulose content among different
    types of lignocellulosic biomass, species, or even genetic resources, the selection
    of resources with expected holocellulose content becomes an essential task. Meanwhile,
    the variation also provides a good opportunity to scheme a large-scale genetic
    breeding program for selecting and finding the suitable germplasm with the expected
    holocellulose content. However, for doing so, intensive labor and tedious testing
    are required when the traditional wet chemical methods (WCM) are used since there
    are plenty of samples that need to be measured. Besides that, because each genetic
    sample is prepared from small seedling or growth cone of living tree, the spendable
    quantity of the sample sometimes fails to meet the required replica when using


    WCMs. Moreover, the WCMs are also criticized for the huge usage of toxic reagants
    during the determination. Therefore, a rapid, accurate, eco-friendly, and low
    sample quantities requirement method is needed.


    Several spectroscopic methods, such as near-infrared (NIR) spectroscopy, middle-infrared
    (MIR) spectroscopy (Tucker et al., 2001) and Raman spectroscopy, combined with
    suitable algorithms have been successfully predicted the content of chemical components
    of lignocellulosic materials instead of traditional WCMs. NIR has been used to
    predict the lignin content in wood (Liang et al., 2020; Yang et al., 2019), lignin
    content in pears (Wu et al., 2021) and holocellulose content in wood (Liang et
    al., 2020; Yang et al., 2019). However, it is reported that both the position
    and intensity of water-related peaks of NIR spectra will be changed by the sample
    moisture and testing ambient humidity (Gordobil et al., 2021). So, it possibly
    results a disturbance on the quantitative results if the sample moisture and testing
    atmosphere is out of rigid control. Conversely, Raman spectroscopy, which is insensitive
    to the sample moisture, provides a great deal of spectral information with high
    chemical information content, which is characterized by a series of peaks related
    to specific chemical bonds (Jermyn et al., 2016). These valuable information brings
    high sensitivity and specificity, such as, to'
