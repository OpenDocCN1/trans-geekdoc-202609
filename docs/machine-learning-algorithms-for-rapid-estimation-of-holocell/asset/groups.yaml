    the predictive accuracy of HCP-Model built by CatBoost was close to that of XGBoost,
    while it is marginally lower than that of XGBoost in lignin content predictive
    model. It is possibly due to the different mathematical characteristics of the
    extracted features from the Raman spectra. Because the position and intensity
    of holocellulose-related peaks are quite different from that of lignin-related
    ones, the extracted features related to the holocellulose were found to have larger
    number of the denoted input variables than that related to lignin. CatBoost algorithm
    is characteristic of the introduction of ordered boosting, which is skilled in
    avoiding overfitting caused by target leakage and then it will enhance the predictive
    accuracy of model consequently (Prokhorenkova et al., 2018). So, higher predictive
    accuracy of quantitative models would be contributed by this advantageous characteristic
    of CatBoost. Hence, it is concluded that XGBoost and CatBoost were superior to
    all other models in estimating holocellulose content based on Raman features.
    The selection of optimal algorithm in the groups of classical ML algorithms for
    building the corresponding predictive model wasn''t affected by the difference
    between two datasets, namely extracted Raman features related to lignin or related
    to holocellulose. However, the selection result of optimal algorithm among advanced
    GBM algorithms was inconsistent in predicting holocellulose content and lignin
    content, due to the diverse characteristics of data for modeling. Therefore, it
    is suggested that the differences between data matrix cannot be ignored when selection
    of optimal algorithms in the group of GBM algorithms is executed.


    Thus, it shows that more robust and precise models can be developed by Raman features
    combined with advanced GBM algorithms, which can be used to predict the holocellulose
    content of poplar wood. However, other lignocellulosic resources, including other
    angiosperm and gymnosperms, such as bamboos, rattans, and agricultural residuals
    with different chemical structure of holocellulose and different holocellulose
    content, are likely to be encountered, which have not been studied yet. But the
    general methodology was depicted in this study and the model need to be adjusted
    and modified when faced with different types of materials to adapt the different
    lignocellulosic resources, respectively.


    ## 4. Conclusion


    All nine models built by regularization algorithms, classical ML algorithms, and
    advanced GBM algorithms have successfully predicted the holocellulose content.
    The advanced GBM algorithms outperformed all the models both in training and test
    process. In particular, the predictive accuracy of the CatBoost and XGBoost models
    was 0.93 for test R<sup>2</sup> and around 0.28% for test RMSE, which hold the
    first priority among all the nine algorithms. Therefore, it is evident that FT-Raman
    spectroscopy combined with ML algorithms is a promising way for predicting holocellulose
    content accurately and environmentally friendly without complex and tedious chemical
    experiments.


