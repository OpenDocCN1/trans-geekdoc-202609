    ### 3.2. Analysis of dataset


    The holocellulose contents of poplar samples in this work ranged from 78.60% to
    84.57% with the average value of 81.84%, which was consistent with the other published
    literature (Liang et al., 2020). All the 125 samples were divided into two groups.
    In the training set, the holocellulose content ranged from 78.60% to 84.57% with
    the average value of 81.84%. In the test set, the data range was from 79.72% to
    84.21% with the average value of 81.86%, and the detailed distribution was similar
    to that of the training set (Fig. 2).


    In HCP-Models, the data of holocellulose content was set as the output variable,
    while the input variables were Raman features extracted from Raman spectra, namely
    I1095, I1122, I1149, I1331, I1378, I1462, and I2895. Theoretically, all these
    features were related to holocellulose (Agarwal, 2019; Wiley & Atalla, 1987).
    To estimate whether the selected predictor variables can provide useful information
    for building HCP-Models, the Pearson correlation analysis was applied to analyze
    the correlations between input variables and output variable roughly. The higher
    Pearson correlation coefficient (Pearson''s r) means a higher correlation between
    the two types of variables (Adler & Parmryd, 2010). According to Fig. 3, the holocellulose
    content had a stronger correlation with the $I_{1149}$ (Pearson''s r: 0.51, p
    < 0.001), $I_{1095}$ (Pearson''s r: 0.43, p < 0.001), and $I_{2895}$ (Pearson''s
    r: -0.47, p < 0.001) than other variables. And all the predictor variables were
    more or less related to the output variable, indicating the significant relationships
    between the Raman features and the measured holocellulose content. Hence, these
    selected input features were promising to provide enough variation of digital
    information for the model building (Adler & Parmryd, 2010).


