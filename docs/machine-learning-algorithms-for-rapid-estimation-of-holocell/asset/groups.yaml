    \ (Agarwal & Ralph, 2012; Gao, Shu, et al., 2022; Gao, Zhou, et al., 2022; Gao,\
    \ Zhou, Liu, et al., 2022), and crystallinity of cellulose (Agarwal et al., 2010,\
    \ 2018). In addition, since only 2 mg samples are needed for each collecting of\
    \ spectra, less requirement of quantity of sample is possibly a typical superiority\
    \ of Raman techniques in the specialized application of large-scale tree genetics\
    \ and breeding programs. Raman spectroscopy combined with regularization algorithms\
    \ have been successfully applied to the task of predicting holocellulose content\
    \ and lignin content of poplar clones (Gao et al., 2021; Gao, Shu, et al., 2022).\
    \ Even predicting results of these models are acceptable yet, it is still wondering\
    \ whether the predicting accuracy and efficiency of the models can be improved\
    \ further or not.\n\nVarious classification and prediction works related to lignocellulosic\
    \ materials and its chemical components were successful accomplished owing to\
    \ the application of classical machine learning (ML) algorithms which include\
    \ support vector machine regression (SVR), decision tree (DT), and random forest\
    \ (RF) (Daassi-Gnaba et al., 2018; Ehrhart et al., 2021; Gao, Zhou, Liu, et al.,\
    \ 2022; Gu & Henrik Andersson, 2010; Souza et al., 2020; Xing et al., 2019). Meanwhile,\
    \ it was reported that advanced gradient boosting machine (GBM) algorithms, such\
    \ as Light Gradient Boosting Machine (LightGBM), Categorical Boosting (CatBoost),\
    \ and eXtreme Gradient Boosting (XGBoost), are able to handle complex mathematical\
    \ problems, such as classification, regression, and others (Chen & Guestrin, 2016;\
    \ Ke et al., 2017; Prokhorenkova et al., 2018). Based on these meaningful works,\
    \ lignin content predictive models by ML algorithms based on Raman features have\
    \ been recently established (Gao, Zhou, Liu, et al., 2022). The result indicated\
    \ that ML algorithms achieved a more accurate and efficient prediction of lignin\
    \ content than regularization algorithms (Gao, Zhou, Liu, et al., 2022). Therefore,\
    \ the significant improvement in predictive accuracy of holocellulose content\
    \ is expected if the machine learning (ML) algorithms is going to be implemented\
    \ instead of the regularization algorithms. However, it should be noticed that\
    \ the position and intensity of lignin-related peaks are quite different from\
    \ that of the holocellulose-related ones, and then the useful features extracted\
    \ from Raman spectra in establishing holocellulose content predictive model (HCP-Model)\
    \ will be another data matrix. It will certainly bring question to how transferred\
    \ the methodology of predicting lignin content by the ML algorithms to the new\
    \ target, namely holocellulose. Furthermore, it also needs to be verified that\
    \ the comparative result among different ML algorithms is consistent or not between\
    \ HCP-Model and lignin content predictive model.\n\nTherefore, the objective of\
    \ the present work is to apply the ML algorithms to develop the HCP-Models. the\
    \ holocellulose-related Raman features extracted from Raman spectra were applied\
    \ as the input variables and the measured holocellulose content was applied as\
    \ the output variable. Meanwhile, the regularization algorithms (RR, LR, and ENR)\
    \ were also adopted to make a comparison with those ML algorithms. The accuracy\
    \ of each predictive model is going to be examined and compared, and then the\
    \ optimal model will be selected. Furthermore, after progressively tuning hyper-parameters,\
    \ the HCP-Models with high predictive accuracy will be anticipated. It is hoped\
    \ that the optimal predictive model is favorable of quick and efficient estimating\
    \ holocellulose content in large-scale tree genetics and breeding programs.\n\n\
    # 2. Materials and methods\n\n# 2.1. Materials\n\n125 groups of poplar samples\
    \ were harvested from ten poplar clones. The information of these ten poplar clones\
    \ is depicted elaborately in the published study (Gao, Shu, et al., 2022; Gao,\
    \ Zhou, Liu, et al., 2022). All the samples were processed into 40–60 mesh and\
    \ 100–120 mesh wood powder, for measuring the holocellulose content by WCM s and\
    \ collecting the Fourier-transform Raman (FT-Raman) spectra, respectively. 80%\
    \ of the samples were randomly divided into training set, and the\n\nremaining\
    \ 20% of the samples were used as the test set.\n\n# 2.2. Determination of holocellulose\n\
    \nThe sodium chlorite method was applied to measure the holocellulose content,\
    \ referring to the China national standard of GB/T 2677.10–1995. First, introduce\
    \ a distilled water, glacial acetic acid, and sodium chloride into a container\
    \ with the extracts-free sample and soak in water at 75 °C for one hour. Then,\
    \ 0.5 mL of acetic acid and 0.6 g of sodium chlorite were added to the solution,\
    \ and the water bath was continued for one hour. Repeat the above operation of\
    \ adding sodium chlorite and acetic acid for sufficient and successive cycles\
    \ of chlorination (four times in this study). After the adequate chlorination,\
    \ the solution was filtered and washed. The residue was measured by gravimetrically,\
    \ namely the measured holocellulose content (Liang et al., 2020; Rabemanolontsoa\
    \ & Saka, 2012).\n\n# 2.3. Collection of Raman spectra\n\nPoplar samples used\
    \ to collect FT-Raman spectra were processed into pellets from ~2 mg of 100–120\
    \ mesh sample, in triplicate. Then, all the FT-Raman spectra were collected from\
    \ 64 scans with a 4 cm−1 spectral resolution by using a FT-Raman spectroscopy\
    \ from Bruker (Vertex 70RAMII). The fluorescence was exited at 1064 nm and the\
    \ Raman shift ranged from 200 to 3600 cm−1 was collected with the laser power\
    \ of 500 mW. And the range of 800 to 3600 cm−1 was applied for analysis.\n\n#\
    \ 2.4. Spectral processes and Raman features extracted from Raman spectra\n\n\
    The extraction of Raman features is challenging because of the spectral noise,\
    \ baseline drift, and signal overlap, which can be alleviated by spectral processes\
    \ of denoise, baseline correction, and the calculation of deconvolution. Refer\
    \ to the previous works (Gao et al., 2021; Gao, Shu, et al., 2022; Gao, Zhou,\
    \ et al., 2022), Savitzky-Golay and adaptive iteratively reweighted penalized\
    \ least squares (airPLS) can be carried out to smooth the spectra and correct\
    \ the spectral baseline, respectively. Then, Gaussian and Lorentzian deconvolution\
    \ was carried out to overcome the signal overlap for calculating the single signal\
    \ intensity of each specific peak. Therefore, information of peaks located at\
    \ 1095, 1122, 1149, 1331, 1378, 1462, and 2895 cm−1 was extracted successfully,\
    \ which were all related to holocellulose (Agarwal, 2009; Agarwal & Ralph, 1997;\
    \ Wiley & Atalla, 1987). Refer to the previous work, the peak intensity of 2945\
    \ cm−1 was qualified to normalize the intensities of holocellulose-related peaks\
    \ (1095, 1122, 1149, 1331, 1378, 1462, and 2895 cm−3) (Gao, Shu, et al., 2022).\
    \ Therefore, the normalized peak intensities of holocellulose-related peaks (I1095,\
    \ I1122, I1149, I1331, I1378, I1462, and I2895), which were called Raman features\
    \ in this study, were obtained and applied as the predictor variables of the HCP-Models.\n\
    \n# 2.5. Modeling algorithms\n\nThe training data was used to tune and optimize\
    \ the hyper-parameters of ML algorithms, and then the HCP-Models were developed\
    \ with the optimum hyper-parameters. The data of the test set, which was always\
    \ independent from the training process, was used to estimate predictive accuracy\
    \ of the models. Before building the HCP-Models, all the input variables were\
    \ standardized by StandardScaler from Scikit-learn library in Python. The standardized\
    \ data was calculated as follow: Eq. (1):\n\n```\nx' = \\frac{x - \\bar{x}}{\\\
    sigma} \n (1)\n```\n\nwhere x'was the standardized value, x was the primary value,\
    \ x̄ was the mean value, and σ was the standard deviation of the whole range of\
    \ the"
