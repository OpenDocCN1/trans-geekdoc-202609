  mdcn: "\n\n## 基于拉曼光谱的杨树克隆木全糖含量快速估算的机器学习算法\n\nWenli Gao a,b,1, Liang Zhou a,b,*,1,\
    \ Shengquan Liu a,b, Ying Guan a,b, Hui Gao a,b, Jianjun Hu c\n\na 安徽农业大学林学与园林学院，安徽合肥\
    \ 230036，中国  \nb 国家林草局木材质量改良与高效利用重点实验室，安徽合肥 230036，中国  \nc 中国林业科学研究院林业研究所，国家重点实验室（树木遗传与育种）、国家林草局树木育种与栽培重点实验室，北京，中国\n\
    \n## 文章信息\n\n- 木全糖含量\n- 机器学习算法\n- 拉曼光谱\n- CatBoost\n- XGBoost\n\n## 摘要\n\n在本研究中，基于从拉曼光谱中提取的特征，应用正则化算法（RR、LR\
    \ 和 ENR）、经典机器学习算法（SVR、DT 和 RF）以及先进的 GBM 算法（LightGBM、CatBoost 和 XGBoost），构建了杨树木全糖含量预测模型。模型评价结果表明，经典机器学习算法的预测精度高于正则化算法，而先进的\
    \ GBM 算法优于经典机器学习算法。此外，由 CatBoost 和 XGBoost 构建的模型可实现木全糖含量的高精度估算，测试集 R² 高于 0.93，测试集\
    \ RMSE 低于 0.29%。据我们所知，迄今为止，这提供了基于拉曼光谱的木全糖含量预测模型的最高精度。因此，建议将拉曼光谱与机器学习算法相结合，作为预测杨树木全糖含量的一种有前景的工具，该工具可应用于大规模树木遗传与育种计划。\n\
    \n## 1. 引言\n\n木全糖，即纤维素和半纤维素之和，是一种可通过氯化法去除木质材料中的木素而提取的不溶于水的碳水化合物分数（Basu, 2018）。它是一个重要的分数，因为其水解产物由各种单糖组成，这些单糖能够通过发酵转化为有用化合物或乙醇（Isikgor\
    \ & Becer, 2015; Ma et al., 2012）。由于不同类型的木质纤维素生物质、物种甚至遗传资源之间木全糖含量存在较大差异，选择具有预期木全糖含量的资源成为一项必要任务。与此同时，这种差异也为制定大规模遗传育种计划以选择和寻找具有预期木全糖含量的合适种质提供了良好机会。然而，为实现这一目标，当使用传统湿化学方法（WCM）时，需要大量的劳动和繁琐的测试，因为有大量样本需要测量。此外，由于每个遗传样本是由活树的小苗或生长锥制备的，可用样本的数量有时无法满足使用\
    \ WCMs 时所需的重复样本数量。此外，WCMs 在测定过程中还因大量使用有毒试剂而受到批评。因此，需要一种快速、准确、环保且对样本数量要求低的方法。\n\
    \n已有多种光谱方法，如近红外（NIR）光谱、中红外（MIR）光谱（Tucker et al., 2001）和拉曼光谱，结合合适的算法，已成功用于预测木质纤维素材料的化学成分含量，以替代传统\
    \ WCMs。NIR 已被用于预测木材中的木素含量（Liang et al., 2020; Yang et al., 2019）、梨中的木素含量（Wu et\
    \ al., 2021）以及木材中的木全糖含量（Liang et al., 2020; Yang et al., 2019）。然而，有报道指出，NIR 光谱中与水相关峰的位置和强度会受样本湿度和测试环境湿度的影响（Gordobil\
    \ et al., 2021）。因此，如果样本湿度和测试大气未受到严格控制，可能会对定量结果造成干扰。相比之下，拉曼光谱对样本湿度不敏感，并提供了大量具有高化学信息含量的光谱信息，其特征是一系列与特定化学键相关的峰（Jermyn\
    \ et al., 2016）。这些宝贵的信息带来了高灵敏度和特异性，例如，可用于分析主要化学成分含量的差异（Agarwal & Ralph, 2012;\
    \ Gao, Shu, et al., 2022; Gao, Zhou, et al., 2022; Gao, Zhou, Liu, et al., 2022）以及纤维素的结晶度（Agarwal\
    \ et al., 2010, 2018）。此外，由于每次光谱采集只需要 2 mg 样本，对样本数量的要求较低，这可能是拉曼技术在大规模树木遗传与育种计划专用应用中的典型优势。拉曼光谱结合正则化算法已成功应用于杨树克隆木全糖含量和木素含量的预测任务（Gao\
    \ et al., 2021; Gao, Shu, et al., 2022）。尽管这些模型的预测结果尚可，但仍有待探究模型的预测精度和效率是否能够进一步提升。\n\
    \n各种与木质纤维素材料及其化学成分相关的分类和预测工作，已归功于经典机器学习（ML）算法的应用而成功完成，这些算法包括支持向量机回归（SVR）、决策树（DT）和随机森林（RF）（Daassi-Gnaba\
    \ et al., 2018; Ehrhart et al., 2021; Gao, Zhou, Liu, et al., 2022; Gu & Henrik\
    \ Andersson, 2010; Souza et al., 2020; Xing et al., 2019）。同时，有报道指出，先进的梯度提升机（GBM）算法，如\
    \ Light Gradient Boosting Machine（LightGBM）、Categorical Boosting（CatBoost）和 eXtreme\
    \ Gradient Boosting（XGBoost），能够处理复杂的数学问题，如分类、回归等（Chen & Guestrin, 2016; Ke et\
    \ al., 2017; Prokhorenkova et al., 2018）。基于这些有意义的工作，最近已建立了基于拉曼特征的机器学习算法木素含量预测模型（Gao,\
    \ Zhou, Liu, et al., 2022）。结果表明，机器学习算法在木素含量预测方面比正则化算法实现了更准确、更高效的预测（Gao, Zhou,\
    \ Liu, et al., 2022）。因此，如果用机器学习（ML）算法替代正则化算法，预计木全糖含量的预测精度将得到显著提高。但是，应注意到，与木素相关峰的位置和强度与木全糖相关峰有很大不同，因此从拉曼光谱中提取的用于建立木全糖含量预测模型（HCP-Model）的有用特征将是另一个数据矩阵。这无疑会带来如何将机器学习算法预测木素含量的方法论转移到新目标（即木全糖）上的问题。此外，还需要验证不同机器学习算法之间的比较结果在\
    \ HCP-Model 和木素含量预测模型之间是否一致。\n\n因此，本工作的目标是应用机器学习算法开发 HCP-Models。从拉曼光谱中提取的与木全糖相关的拉曼特征被用作输入变量，测得的木全糖含量被用作输出变量。同时，还采用了正则化算法（RR、LR\
    \ 和 ENR）来与这些机器学习算法进行比较。将对各预测模型的精度进行检验和比较，然后选择最优模型。此外，在逐步调整超参数后，预计将得到预测精度高的 HCP-Models。希望最优预测模型有利于在大规模树木遗传与育种计划中快速、高效地估算木全糖含量。\n\
    \n## 2. 材料与方法\n\n### 2.1. 材料\n\n从十个杨树克隆中采集了 125 组杨树样本。这些杨树克隆的信息在已发表的研究中有详细描述（Gao,\
    \ Shu, et al., 2022; Gao, Zhou, Liu, et al., 2022）。所有样本均加工成 40–60 目和 100–120 目木粉，分别用于\
    \ WCM 测定木全糖含量和采集傅里叶变换拉曼（FT-Raman）光谱。80% 的样本随机分为训练集，其余 20% 的样本用作测试集。\n\n### 2.2.\
    \ 木全糖测定\n\n采用亚氯酸钠法测定木全糖含量，参照中国国家标准 GB/T 2677.10–1995。首先，将无浸出样本置于容器中，加入蒸馏水、冰醋酸和氯化钠，在\
    \ 75 °C 水浴中浸泡一小时。然后，向溶液中加入 0.5 mL 醋酸和 0.6 g 亚氯酸钠，继续水浴一小时。重复上述加入亚氯酸钠和醋酸的操作，进行充分且连续的氯化循环（本研究中循环四次）。充分氯化后，溶液被过滤和洗涤。残渣采用重量法测定，即测得的木全糖含量（Liang\
    \ et al., 2020; Rabemanolontsoa & Saka, 2012）。\n\n### 2.3. 拉曼光谱采集\n\n用于采集 FT-Raman\
    \ 光谱的杨树样本约取 2 mg 100–120 目样本制成压片，三重平行。然后，使用布鲁克（Bruker）FT-Raman 光谱仪（Vertex 70RAMII）以\
    \ 4 cm−1 的光谱分辨率采集 64 次扫描的所有 FT-Raman 光谱。荧光在 1064 nm 激发，采集 200 至 3600 cm−1 的拉曼位移，激光功率为\
    \ 500 mW。分析采用 800 至 3600 cm−1 的范围。\n\n### 2.4. 谱面处理及从拉曼光谱中提取的拉曼特征\n\n由于光谱噪声、基线漂移和信号重叠，拉曼特征的提取具有挑战性，可通过去噪、基线校正和去卷积计算等谱面处理来缓解。参照前期工作（Gao\
    \ et al., 2021; Gao, Shu, et al., 2022; Gao, Zhou, et al., 2022），Savitzky-Golay\
    \ 和自适应迭代重加权惩罚最小二乘法（airPLS）分别用于平滑光谱和校正光谱基线。然后，进行高斯和洛伦兹分峰以克服信号重叠，计算每个特定峰的单一信号强度。因此，成功提取了位于\
    \ 1095、1122、1149、1331、1378、1462 和 2895 cm−1 的峰信息，这些峰均与木全糖相关（Agarwal, 2009; Agarwal\
    \ & Ralph, 1997; Wiley & Atalla, 1987）。参照前期工作，2945 cm−1 的峰强度被用于对与木全糖相关的峰（1095、1122、1149、1331、1378、1462\
    \ 和 2895 cm−1）的强度进行归一化（Gao, Shu, et al., 2022）。因此，得到了与木全糖相关的归一化峰强度（I1095、I1122、I1149、I1331、I1378、I1462\
    \ 和 I2895），在本研究中称为拉曼特征，并将其作为 HCP-Models 的预测变量。\n\n### 2.5. 建模算法\n\n训练数据用于调优和优化机器学习算法的超参数，然后使用最优超参数开发\
    \ HCP-Models。测试集的数据始终独立于训练过程，用于估算模型的预测精度。在构建 HCP-Models 之前，所有输入变量均使用 Python Scikit-learn\
    \ 库中的 StandardScaler 进行标准化。标准化数据按以下公式计算：Eq. (1)：\n\n```\nx' = \\frac{x - \\bar{x}}{\\\
    sigma} \n (1)\n```\n\n其中 x' 是标准化值，x 是原始值，x̄ 是平均值，σ 是整个范围的标准偏差。\n\n"
