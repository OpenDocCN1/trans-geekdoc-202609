- "# 金融革命：比特币、区块链与财富的民主化\n\n\n\n\n\n\n\n\n\n\n## 前言\n作者 Susanne Chishti - FINTECH\
  \ Circle 首席官\n\n数字颠覆影响了社会的每一个方面，从社交媒体到智能手机，并在这一过程中，从根本上改变了我们互动的方式和生活方式。\n\n无处不在的技术让我们保持井井有条的同时也保持忙碌；如果我们不是在提高效率，我们通过查看社交媒体动态和发布自拍来让自己忙起来。\n\
  \n然而，尽管世界上有这么多技术，我们发现自己仍然在旅途中通勤、计算和交流。\n\n生活似乎在逃避我们、追赶我们。我们不断试图跟上最新的新闻、发布、分享或点赞；这是一个技术主导我们生活的新社会的术语。同时，技术在许多方面让我们的生活变得更容易，我们几乎可以做任何事情，只需要智能手机和\
  \ Wi-Fi 连接。但如果我们也能通过智能手机维持生呢？\n\n这个想法现在正在变成现实，我们可以通过应用程序或平台购买、出售或交易“数字商品”，而无需亲临现场或拥有展示商品的商店。\n\
  \n起初，我们只有简单的数字商品，如音乐、电影或书籍，我们可以将其下载并存储在智能手机中随身携带。\n\n随着加密货币、区块链和数字资产的出现，我们现在甚至可以将个人财富存储智能手机中。不仅是存储，还可以买、卖和交易，这改变了每个人的游戏规则。\n\
  \n区块链上的现实世界资产代币化使我们有可能在无需亲临现场的情况下交易全球金融市场。更重要的是，我们不需要经纪人或中介；我们可以简单地即时且安全地进行“点对点”交易，并知道一旦区块链上的交易通过验证，它就是不可逆的。\n\
  \n这就是区块链上数字资产的力量。\n\n更进一步说，任何拥有智能手机的人都可以随时随地交易任何物品，并知道所有交易都是防篡改、带有时间戳且透明的。\n\n在金融领域，这被称为去中心化金融，它改变了一切。\n\
  \n金融科技为我们提供了工具和手段，让我们掌控自己的金融命运。\n\n加密货币和区块链是金融科技的新前沿，现在学习这些技术至关重要，从而为繁荣的金融未来做好更好的准备。\n\
  \nEleftherios Jerry Floros 是一位金融科技专家，将知识与经验相结合，他还是 Wiley 出版的畅销书的共同合著者，我有幸编辑了该书。\n\
  \n作者 Susanne Chishti - FINTECH Circle\n\n# 关于本书\n通过定义加密货币、区块链、去中心化金融和财富民主化的各种概念，带领读者从起源走向现在。在整书中，将有很多主题解释技术如何影响我们的生活，从社交媒体到`tokenization`。机会是巨大的，可能性是无限的。\n\
  \n**简单定义区块链协议：**\n将其想象成一条长长的区块链，每个区块都填满了数据。然后，这些数据在全局`computers`网络上同时进行验证和更新。一旦某个区块“填满”了，后续数据就会存储在下一个区块中，依此类推。\n\
  \n我之前的文章和贴文的摘录被汇编并包含在书中，以对世界金融和商业领域正在发生的技术变革提供更清晰的视角。\n\n快速阅读书末尾的《加密货币入门课程》是熟悉不同技术的极佳方法。祝阅读愉快！\n\
  \n## 前言\n“钱将成为繁荣的工具，而不是贪婪的武器”\n\n## 公平的世界\n数字颠覆将深刻影响全球经济以及我们的个人生活。人工智能、机器学习、数据科学、机器人和区块链将彻底改变全球经济和国际贸易的每一个方面。专家预测，数字革命的影响将比互联网的普及更大。如今，人们甚至无法想象与被称为互联网的全球网络“断开连接”，而与此同时，智能手机无论好坏都已成为我们一生的好朋友。虽遗憾却是事实。一个人的智能手机掌握着他们世界中所有珍贵和数字的一切：照片、联系人、社交媒体、议程、地图、应用程序、时间表、待办事项列表、银行、游戏等等。\n\
  \n当当今的世界网是通往全球信息和通信的门户时，未来的互联网将成为“价值互联网”。\n\n去中心化——一个实体、组织或机构的活动（特别是关于规划和决策的活动）从中央权威、治理或公司转移或委托出去的过程。相反，`Google`\
  \ 和 `Facebook` 是公司集权的典型范例，中央银行和政府则是国家权威。\n\n在金融领域，去中心化被称为“去中介化”，即逐渐消除中间人、经纪人和交易所，其结果是交易费用将仅为目前金融成本的一小部分。\n\
  \n\n\n\n\n这种价值互联网的去中间化，将让每个参与者都获得与如今控制所有金融网络和系统的传统银行、经纪商和金融机构相同的机会。在此过程中，他们通过垄断并利用“信息不对称”和“信任套利”，实现了利润最大化，并获得了压倒性的市场支配。\n\
  \n局外人只有在被接受并付出代价后，才能进入这个由银行和金融机构组成的封闭生态系统（统称为全球金融行业）。\n\n这一切都关乎变革，而战场位于控制与共识、公共与私有，以及开放区块链与许可制分布式账本技术（DLT）之间。\n\
  \n在接下来的章节中，我努力简化所有的金融术语和技术概念，以便任何对金融科技、加密货币和区块链感兴趣的人都能阅读本书，并轻松理解未来金融术语、概念和观点。\n\n\
  我将之前发表的文章和帖子摘录汇编并包含在书中，以更清晰地展示世界金融和商业领域发生的所有技术变革。\n\n我希望这本书能成为理解加密货币、区块链以及管理个人财务的价值工具，并带来持久的财富繁荣！\n\
  \n\n\n\n\n\n\n\n\n- 加密 500 \n\n\n\n\n\n\n\n\n\n\n## 全球加密监管\n## 代币化世界中的财富\n\n## 关于作者\n\
  ## 致谢\n## 推荐阅读\n## 推荐文章\n## 加密入门\n\n\n\n一切金钱都是幻象\n\n如果世界上所有的财富更公平、更公正地分配给世界各地的每一个人会怎样？\n\
  \n这听起来像是一个乌托邦式的梦想，但现实即将发生。实现这一点的游戏改变者是区块链，这项由 `Bitcoin` 推向舞台的底层技术。\n\n\n一切金钱都是幻象。实现这一点的游戏改变者是区块链，这项由\
  \ `Bitcoin` 推向舞台的底层技术。\n\n如果世界上所有的能够更公平、更公正地分配给世界各地的每一个人会怎样？\n\n这听起来像是一个乌托邦式的梦想，但现实即将发生。实现这一点的游戏改变者是区块链，这项由\
  \ `Bitcoin` 推向舞台的底层技术。\n\n\n\n\n中国目前在超越美国成为世界最大经济体以及在人工智能为关键驱动的技术增长方面，是美国最大的威胁。\n\
  \n\n在 20 世纪 80 年代初和整个 90 年代，“加密朋克”（cypherpunk）运动开始取得进展并传播到全球。\n\n1992 年某某时候，第一批加密朋克人物——埃里克·休斯（Eric\
  \ Hughes）、提摩西·C·梅（Timothy C. May）和约翰·吉尔摩（John Gilmore）在旧金山湾地区吉尔摩的公司 `Cygnus Solutions`\
  \ 建立了一个小组。\n\n加密朋克是一个由“cipher”（加密）和“cyberpunk”（网络朋克）组合而成的新词，他们是某种“加密无政府主义者”（礼貌地称为活动人士），主倡使用先进的密码学和隐私增强技术来实现社会和政治变革。\n\
  \n加密无政府主义者、加密朋克提摩西·梅（Timothy May）在他的《加密无政府主义宣言》中描述了密码技术的使用如何允许创建一个系统，使人们能够直接互动，并在“无政府资本主义”社会中拥有更高的自主权，且不受政府影响。\n\
  \n为了传播信息并吸引活动人士参与，他们建立了一个加密朋克邮件列表，到 1994 年已有 700 名订阅者。它演变成一个非常活跃的论坛，涵盖了计算机科学、密码学、数学、政治和哲学的学术及技术讨论。偶尔，论坛会遭受大量的攻击和个人争论，这使其变得非常活跃并促进了其增长；到\
  \ 1997 年，其订阅人数已超过 2000 名。\n\n同年，吉姆·乔特（Jim Choate）和伊戈尔·丘多夫（Igor Chudov）建立了“加密朋克分布式重发器”（Cypherpunks\
  \ Distributed Remailer），这是一个独立的邮件列表节点网络，旨在消除“单点故障”（SPOF），单点故障简单是指系统中一旦故障就会导致整个系统停止运行。\n\
  \n例如，电网停电或供水中断。\n\n单点故障在任何系统中都是不受取的，无论是目标是始终高度可靠且“可用”的工业系统还是软件应用程序。因此，通过在所有潜在的单点故障处添加“冗余”，可以使系统更加健壮。\n\
  \n爱德华·斯诺登（Edward Snowden）谈到了单一信息存储库（又称“数据孤岛”）的单点故障风险，这些库由“科技巨头”控制，并被政府用于间谍、监视以及控制公民的“老大哥”。\n\
  \n中心化是指一个实体控制其网络上的数据，这可能导致系统产生可怕的单点故障。\n\n\n在经济学中，信息不对称是拥有的终极优势；它是获得巨额利润的入场券，对政府而言具有战略意义。\n\
  \n在金融世界，信息不对称和“信任套利”——利用货币/资产/财富管理以及金融交易处理中的信任因素——可以产生巨大的利润。\n\n更重要的是，信息不对称将知识和财富集中在传统金融机构中，这些机构可以自由收取高价，从而损害客户利益来提高其利润率。\n\
  \n金融科技（FinTech）反转了这一方程式：客户是自己财富的提供者，而金融机构仅仅是资金的保管者、守护者或托管，提供与与指标挂钩的财务建议。\n\n\n驱动区块链超快速度发展的动力，是编码人员和开发者不断改进区块链及其应用层的意愿。由于区块链是开源且基于共识的，每个人都可以对协议做出贡献。\n\
  \n在加密货币领域，协议共识最多一直具有挑战性，使用“硬分叉”将区块链分成不同的链并具有不同的区块大小。在加密货币短暂的历史中，最著名的硬分叉是比特币分为 `Bitcoin`\
  \ 和 `Bitcoin Cash`，随后是 `Bitcoin Cash` 和 `Bitcoin SV`（Satoshi’s Vision）的另一次硬分叉。遗憾但意外的是，后一次硬分叉导致了加密市场的完全崩溃，恢复过程非常缓慢。\n\
  \n尽管世界已进入数字领域，权力、金钱和自然资源仍然是所有冲突和战争的根源，加密成为全球权力和控制的新前线，被形象地称为“加密断层”。\n\n任何数字资产都可以在区块链上进行“代化”，只需将特定资产划分为所有权或份额，这些随后成为由\
  \ `Ethereum` 定义的代。\n\n为了避免任何可能的冲突，这些智能合约预先编码，以确保在智能合约条件执行并履行后，所有方都能获得其公平份额。\n\n\
  例如，在音乐行业，在售出预先约定的数量歌曲或专辑并扣除制作费用后，基于智能合约的版税将支付给所有相关。唱片公司、录音室、音乐家、词作者、发行商、出版商以及制作制作和发行链中的任何其他方，将根据智能合约中编码的约定时间内公平地收到各自的付款。\n\
  \n\n数字资产代币化将同时彻底改变金融市场和全球贸易，降低任何众筹投资者在最早阶段参与价值增长轨迹的门槛。众筹投资者不再需要等待科技巨头或其他成功公司的 IPO\
  \ 才能参与某些股票可能的增值，而不再是在公共股票市场上市后才能参与，这改变了整个世界。\n\n\n\n独立的财富和繁荣将变得更加广泛，同时也补偿由于人工智能、机器学习、机器人技术以及工作流程和系统自动化应用而给劳动力市场带来的技术冲击。\n\
  \n代币化（Tokenization）是区块链技术发展最重要的方面之一，许多人认为它对经济的影响可能亚于互联网的发展。代表经济健康状况传统财务指标通常忽略了向消费者的价值转移。\n\
  \n此前，诸如知识产权、品牌和商誉等看似无法量化的抽象资产，以及版权和专利等记录资产，现在可以以代币的形式在区块链上进行表示——即作为一种“数字法律权利”——并带有唯一的标识符数字，甚至可以进一步拆分和细分为碎片化代币或单位。\n\
  \n这种数字价值和资产可转让性的范式转移，使得出售几乎任何东西的合法份额成为可能，例如艺术、音乐、艺术家甚至表演者的未来收入，以及地球上任何涉及金钱和价值的万物。\n\
  \n随着越来越多的资产被代币化，全球金融市场将变得更加活跃，进入全球经济的市场参与者增加，促进了前所未有的大众包容性新水平。\n\n\n\n在早期，“信息互联网”主要用于搜索网站以及在线上关于任何事物和一切的基本信息。这个过程相当复杂且笨拙，更像是一种“试错”方法，这种状态一直持续到第一批“搜索引擎”出现并改变了整个“互联网冲浪体验”。“WebCrawler”和“AltaVista”的首批迭代让用户拥有了使用“搜索关键词”搜索任何已索引网站的可能性，这指数级地增加了找到所需网站的概率。\n\
  \nAOL 是第一个将原始搜索和电子邮箱/消息整合在一个工具中的网络门户网站，该工具让每个人都能轻松使用，并导致 AOL 成为全球最大的互联网提供商和媒体公司之一。AOL\
  \ 与时华纳（Time Warner）之间一次命运性的合并——被称为“地狱之婚姻”——导致了 AOL 的灭亡和时华华媒体公司的衰落。\n\n随着时间的推移，互联网变成了一个任何人都可以使用的工具，而不是极客们使用的“秘密工具”，这导致互联网成为全球在线信息的主要来源。\n\
  \n用户体验和实用性取得了胜利，互联网——正如我们今天所知的模样——诞生了。\n\n在整个 20 世纪 90 年代，互联网 1.0 见证了前所未有的增长，无数“.com”初创公司涌入硅谷创业潮，其估值以天文数字来衡量，是十亿计而非百万计。\n\
  \n对于天使投资人和风险投资人来说，只有天空才是极限，直到 2000 年 3 月 11 日那场名昭臭鼎的“.com”崩溃后，创业热和融资派对才突然结束。\n\n\
  即使对于像 eBay、Amazon 和 Google 这样真正且具有创新的初创公司，其市值的跌也是前所未有的，全线下降了惊人的 90% 或以上，实际的初创伤亡率甚至更高，非官方记录显示为\
  \ 99%。那时，创业领域没有像今天这样组织化和透明，互联网仍处于婴儿阶段，硅谷的投资者对他们的成功守口如瓶，对失败更是如此。毕竟，在硅谷风险投资这个狭小而私密的世界里，声誉就是一切。\n\
  \neBay、Google 和 Amazon 幸存于“.com”崩溃，并变得更大、更好，并且在这个过程中，创建了引领下一波技术创业浪潮的平台基础设施——社交媒体。\n\
  \n第一批社交媒体平台如“MySpace”和“Friendster”曾非常成功，直到“The Facebook”（Facebook 的最初名称）破坏了派对。\n\
  \nFacebook 不仅通过引入“墙”（the Wall）完全改变了社交媒体的概念，还完全改变了商业模式。\n\n起初，一切都是免费的，更重要的是，没有广告。但由于没有一种可持续的商业模式可以在没有任何形式收入的情况下永久提供免费服务，广告逐渐引入了\
  \ Facebook 信息馈送（“墙”的后续版本）。Facebook 持续改进、更新和精炼社交媒体，直到可以为企业广告主“微定位”Facebook 用户——以及潜在消费者——针对那些带着广告、页面和帖子涌向\
  \ Facebook 的广告主。\n\nGoogle 遵循了类似的模式，但在“搜索”领域，通过简单但流畅的布局将关键词与广告链接起来，与 Yahoo 的色彩纷呈形成背道而驰。\n\
  \n\n\n全球网是范围内前所未有的连接的催化剂，无论语言障碍或领土边界。\n\n\n20 世纪 90 年代中期，“WebCrawler”、“AltaVista”、“Lycos”、“Yahoo”和“Google”等搜索引擎出现在网上，对信息进行索引和分类，将搜索功能缩小到文本、标题和简单的关键词。\n\
  \n为了加强 Yahoo 的搜索统治，启动了“你用 Yahoo 吗？”广告活动，并在 1996 年成为最常用的门户网站，在技术上成为大多数网页冲浪者的主要入口。\n\
  \nYahoo 在搜索领域占据了早期领先，并在 1998 年后一直是网上第一搜索引擎，直到被 Google 完全取代并赶下台，Google 从此保持了领先地位，并增加了其市场主导地位。\n\
  \n讽刺的是，Yahoo! 作为当时的技术创新者，现在却被边缘化，因为在 1999 年，斯坦福辍学的学生和 Google 创始人 Larry Page 和 Sergey\
  \ Brin 曾向 Excite（当时主要的互联网门户）提供 100 万美元收购他们独特的搜索算法。\n\nExcite Inc. 拒绝了，剩下的便成了历史。\n\
  \n\nGoogle 的首次投资由 Sun Microsystems 联合创始人 Andy Bechtolsheim 提供，他在简短会议后给 Google 创始人提供了一张\
  \ 10 万美元的支票以开始创业并开发使用“页面排名”技术的独特搜索引擎算法，该算法如今主导了全球 90% 的互联网搜索。\n\n\n\n多年来，Google\
  \ 的业务已扩展许多创新的产品和服务，在此过程中，`Google` 在数据聚合方面获得了绝对的市场主导地位，并使其成为全球最大的数据存储公司。\n\n根据领先的网站流量监控服务\
  \ `Alexa` 显示，`Google` 域名是全球访问次数最多的网站域名；在此过程中，Google 已成为互联网搜索领域无可争议的全球领导者。\n\n有趣的是，Google\
  \ 几乎每年都会更新其“隐私政策”，且每个版本都可以在其网站上按时间顺序有序分类找到。这些更新并非随机或重复的；它们反映了全球范围内监管数据隐私的法律的任何变化，并针对欧盟和瑞士等不同国家和地区有所变动。\n\
  \n“我们使用各种技术来收集和存储信息，包括 Cookie、像素标签、本地存储（如浏览器网页存储或应用程序数据缓存）、数据库和服务器日志。”\n\n“出于法律原因，如果我们诚实相信访问、使用、保存或披露这些信息对于以下目的是必要的：符合任何适用法律、法规、法律程序或具有执行力的政府请求，我们将在\
  \ Google 之外共享个人信息。”\n\n\n对于那些对隐私和“安全密码”天真或幻想的信徒来说，点击并接受任何在线“隐私政策”或“条款与条件”几乎毫无用，因为归到底它无法保证任何事情。这些法律政策更多涵盖了科技巨头的法律立场，以及他们对于政府“后门”访问用户数据的政策，即使用加密解密技术来破解全球捕获的所有数据。\n\
  \n只要任何人在世界上任何地方（中国除外）在线，所有用户数据都会捕获并存储在美国境内。无例外。\n\n有人可能会认为，政府并不总是能够完全且不受限制地访问个人数据，但由于“数据可能会被第三方使用”，隐秘的“数据经纪人”（如现已倒闭的“Cambridge\
  \ Analytica”）可以向任何政府机构或其他利益方提供多年来坚定收集和汇的所有所需数据。\n\nGoogle 对数据的“侵入”是无处不在。与 `Facebook`\
  \ 通过自己的网站和 App 收集数据不同，Google 在处处收集数据。Google 搜索是数据挖掘的主要来源，但同时它已扩展到其提供的每一个 App 和“免费”服务，包括\
  \ `Google+`、`Chrome`、`YouTube` 及其专有的 `Android` 操作系统，后者占据了全球一半以上的智能手机。\n\n在 `Android`\
  \ 终端用户不知或未授权的情况下，所有 `Android` 手机（特别是其旗舰“Pixel”智能手机）上的所有数据、信息和用户交互都会自动上传到 Google\
  \ 并永久存储。\n\n即使是无尽的 Google“免费”产品列表，如 `Google Drive`、`Docs`、`Wallet`、`Books`、`Maps`、`Music`、`News`、`Pictures`、`Pay`、`Play`、`Earth`、`Agenda`、`Hangouts`、`Blogger`、`Translate`、`Shopping`、`Classroom`、`Keep`\
  \ 等——都会在全球范围内（主要在美国境内）巨大的 Google 服务器群中提取、记录并存储数据。\n\n`Google X` 通过其子公司“Loon LLC”，甚至在追求开发和部署“全民免费互联网”，向世界范围内农村和偏远地区传输互联网接入和\
  \ `4G-LTE` 移动连接，部署在高度为 18 公里的平流层飞行的高空气球，以捕获个人数据的最后边疆。\n\n“全民免费互联网”的想法是如此荒谬且疯狂，以至于它已经拥有\
  \ 50 亿用户。\n\n\n\n当千禧一代沉迷于社交媒体并偶尔遭受“数字排毒”的痛苦时，`Google` 和 `Facebook` 等广告巨头已经开辟了一个价值数十亿美元的行业，涉及数据的收集、存储、重新包装和销售。\n\
  \n数据是新的新的黄金，而“科技巨头”则是统治世界的国王。\n\n## 跨越毛骨悚然线\n\n\n版权 2018 – Wandering Foot Productions\n\
  \n《毛骨悚然线》是一部令人震惊且大开眼界的纪录片，揭示了“数据大师们”即 `Google` 和 `Facebook`——使用的数据收集策略和工具。\n\n如果说关于\
  \ Facebook 创始人马克·扎克伯格的电影《社交网络》是引人入胜且趣味十足，那么《毛骨悚然线》绝对从负面意义上令人极其震撼。\n\n它详细描述了 `Google`\
  \ 和 `Facebook` 主要在每一个“触点”提取用户数据的广泛技术，即你的家用电脑、台电脑、平板电脑、电视、家庭助手、智能手表或智能手机（很快还将包括你的汽车或“移动订阅”，甚至通过\
  \ `Uber` 和 `Lyft` 等应用）。当 `Facebook` 严密监控其 22 亿用户时，`Google` 又更上一个层次，让 `NSA`（国家安全局）看起来像个无辜的人。\n\
  \nGoogle 搜索是主要的数据挖掘机制，通过对在“搜索框”中输入的每一个字母、单词或句子，以及随后的每一次点击，提取、编译并分析用户行为。而且不仅于此，每一个\
  \ `Google` 产品都会利用每一个机会和可能性提取用户数据。“`Google` 对其中许多事情的政策，”是“直达毛骨悚然的边缘而不越越线。” 来源：`Google`\
  \ 首席执行官埃里克·施密特的非正式言论。\n\n\n除了 `Facebook` 和 `Google` 产生的巨额广告收入外，`美国` 政府还是两者的最大客户。美国政府在服务人民的同时，也以“反恐战争”的名义监控自己的公民。从官方上说，隐私权被载入《美国宪法》的`第四修正案`。但非正式地说，在美国境内，任何前提都可能被搜，任何信息或数据都可能被访问和分析——引用`《爱国者法案》第\
  \ 802 条`中对“国内恐怖主义”的扩大定义——由`国土安全部`或其他机构执行，无需搜查令。\n\n在国际范围内，监控的灰色地带和界限更加模糊，正如最近暴露的`斯诺登文件`所示。`XKeys\
  \ (XKS)` 被 `NSA (国家安全局)` 用于每天搜索和分析全球互联网数据和网页交互，出于全球间谍活动和监控目的。近期名名扫地的 `Cambridge\
  \ Analytica` 声称在 1997 年就拥有 22 亿美国人的心理画像。\n\n甚至是存储在云平台上的数据或通过电子邮件提供商输入的，以及如 `Grammarly`\
  \ 等简单的拼写检查程序，也被用于“读取”并确定法律要求访问、保留或披露你的个人数据，以保护 `Grammarly` 以及网站和/或服务的权利、财产或个人安全，并响应公共当局的合法请求。”\
  \ 来源：`Grammarly` – 2019 年隐私政策。软件程序扫描文本中的击键或关键词，任何目标词汇都会立即被相应的“当局”（无论他们是谁）分析以进一步调查。\n\
  \n\n中国是“大哥”间谍活动和审查的眼中钉，互联网限制阻止了 `Google` 和 `Facebook` 等从地球上人口最多的中国公民那里积累关键的用户数据。为了保护和确保网络安全，中国部署了`中国长城墙\
  \ (GFW)`，这是审查技术和立法政策的结合，用于监管中国境内的互联网。某些措施包括阻止访问外国网站和信息源（如 `Google`、`Facebook`、`Twitter`\
  \ 等），以及减慢跨境互联网流量。除了国内审查外，中国还培养并给予`阿里巴巴``百度`和`腾讯`等中国科技公司优先待遇，以开发国内互联网和技术产品，同时减少对外国互联网和科技公司服务的访问和使用。互联网监控和在线数据挖掘在全球范围内泛滥，认为我们的个人数据免受全球窃听、间谍活动或监控直是极其天真的。自从万维网出现以来，隐私就像全球监控的“玻璃房”，而“大哥”正在看着。这一切永远不会改变。\n\
  \n\n“在理论上，至少按照最初的设想，互联网是一个知识可以自由共享的民主空间。在现实中，它是一个受高度控制和监控的网络空间，由那些将你的数据和个人信息出售给最高价者的公司所所有；它完全不民主。区块链时代有望改变这一切，这就是为什么热爱区块链的人喜欢谈论它的政治。官僚机构可能并不性感，但它确实提供了无政府状态不具备的某些。”\
  \ 来源：Samuel Miller 发表 Medium – Aerum 博客\n\n在超连接的世界中，互联网速度对于开发为大众市场和全球互联网用户提供价值服务的平台至关重要，这些平台将绕过目前“控制”全球网的遗留技术巨头。`Google`\
  \ 和 `Facebook` 等人的所谓“免费”服务实际上是数据挖掘、提取的手段，并存储在由这些科技巨头拥有并控制的专有数据孤岛中。存储、控制并将这些数据出售给广告商（以及其他不显眼的的第三方，如\
  \ `Cambridge Analytica`）导致了“无尽利润的金矿”；将 `Google` 推向了上市公司科技公司的顶点，加入了已欢迎 `Apple`、`Amazon`\
  \ 和 `Microsoft` 的“万亿美元俱乐部”。\n\n\n技术活动人士、密码朋和反叛黑客希望结束 `Google` 和 `Facebook` 等大科技公司对互联网的肆意滥用和数据牟利。这些追求“自由且不受控”互联网的倡者和活动人士正在利用开放基础设施中的“群众”资源，创建一个“属于人民、为了人民、由人民”的互联网（借用美国美国总统亚伯拉罕·林肯的名言）。\n\
  \n与区块链的发展同步，我们现在所知的互联网很快将被区块链协议取代，并创造出允许并交换价值的“价值互联网”。这种“全民自由互联网”运动正在悄悄进展，以实现全球性的社会和政治变革。\n\
  \n\n\n\n\n“区块链是一种奇特的东西——它是我们时代被过度炒作、最不被理解且最具破坏性的技术”\n\n\n速度和扩展性是目前区块链初创企业在实现主流化应用方面面临的最大挑战。\n\
  \n有无数区块链初创公司正在利用“链上”、“链下”和“侧链”开发各种区块链协议，其唯一目的就是提高区块链的运行速度和扩展性，这也是区块链开发的终极目标和“圣杯”。\n\
  \n`Visa` 和 `MasterCard` 等老牌公司已经申请了多项区块链专利，以构建基于区块链的金融系统，使这些支付公司能够利用区块链处理数百万次的交易。然而，由于交易速度受到“受限”——每笔交易都必须经过网络参与者的验证——目前的区块链形式无法满足每分钟百万级交易的需求，而全球贸易安全可靠地处理金融交易正所需的这种能力。\n\
  \n使用不可篡改且透明的区块链的主要原因之一是反欺诈，这让这些信用卡巨头每年损失巨额资金。\n\n银行、金融机构以及如 `PayPal` 等其他在线支付公司也面临着类似的欺诈问题，并正在积极寻求区块链解决方案来应对欺诈和网络安全威胁。\n\
  \n然而，尽管区块链是一项先进技术和不断发展的协议，它在许多方面仍然处于初级阶段且不完善。\n\n区块链能够处理海量数据以支持和扩展全球金融网络，并开启使用区块链的安全交易新时代，这只是时间问题。\n\
  \n\n“通过委托，具有特定领域知识的人能够更好地影响决策结果，从而提升国家的整体治理水平。正因如此，流动民主自然地演变为优胜劣汰，决策主要由那些拥有在相关问题上做出明智决策所需的知识和经验的人做出”。\n\
  \n“总的来说，流动民主具有巨大的潜力，不仅可以作为虚拟社区决策的基础，也适用于当地社区和整个政府。”\n\n\n流动民主是“委托民主”的一种形式，选民可以选择将投票权授予代表人，而不是直接投票。在加密货币世界中，流动民主并不一定依赖于委托投票，而是更多取决于一种“加权”且“临时”的投票系统，该系统通常由投票者在任何给定时间的代币持有量决定。\n\
  \n通过结合“直接民主”和“代表民主”的优点，它为在线/虚拟社区创建了一种强大的集体决策投票机制，例如 `DAO`（去中心化自治组织）或与区块链上 `Ethereum`\
  \ 智能合约相关的治理。\n\n简单来说，治理代表或共识投票者持有的代币越多，该代表或投票者拥有的投票权就越大，但始终受相关区块链协议的严格治理和共识限制。密码学的误差是不存在的，代码输出是由输入决定的，因此所有代码结果都是结论性的，就像数学具有确定性一样。\n\
  \n治理或共识问题只有在最初出现编码错误（即“人为失误”）时才会发生，否则结果将与预期有实质性差异。\n\n`Ethereum` 的“DAO”——去中心化自治组织——是代码错误的典型案例，导致了\
  \ 5000 万美元的黑客攻击。通过引发有争议的“硬分叉”，损失得以收回，但 `DAOs` 的概念遭受了重大打击，且尚未完全恢复。\n\n区块链是开放协议，这意味着所有人都可以根据共识治理的编码标准来访问并改进协议。这防止了任何坏人或鲁莽的编码人员在不引起共识治理立即通知的情况下，尝试操纵或破坏任何协议。\n\
  \n当一个或多个参与者决定采取相反的编码策略或协议更改时（技术术语称为“硬分叉”），问题出现了——这对整个链可能会产生重大影响，因为会自动创建两个具有不同区块大小、节点和治理规则的独立链。\n\
  \n`Bitcoin (BTC)` 在硬分叉方面处于领先地位，目前为止已发生 3 次分裂：`Bitcoin (BTC)`、`Bitcoin Cash (BCH)`、`Bitcoin\
  \ Gold (BTG)`、`Bitcoin ABC (可调整区块限制)` 以及 `Bitcoin “Satoshi 之愿” (BSV)`。\n\n以下是按日期和或区块分裂比特币的硬分叉列表：\n\
  \n\n\n最近的比特币分裂导致了 `Bitcoin ABC` 和 `Bitcoin SV`，某些人认为是两个比特币阵营之间的“内战”，第一方由企业家 `Roger\
  \ Ver` 和 `Bitmain`（世界最大的加密货币交易所之一）的吴纪强 领导，支持 `Bitcoin ABC`；第二个阵营由 `Craig Steven\
  \ Wright` 和亿万翁 `Calvin Ayre` 领导，支持竞争版本 `Bitcoin SV`，后者将每个区块的大小从标准的 1MB 增加到 128MB。\n\
  \n硬分叉在 2018 年底导致了整个加密货币市场的崩溃，围绕加密货币的紧张情绪对比特币及整个加密货币的未来投下了严重的怀疑。\n\n\n就像“Netscape\
  \ 对阵 Internet Explorer”以及“iOS 对 Android”一样，区块链正面临来自各方的挑战，开发者不断开发出更新、更好、更快的协议，利用“链上”、“链下”、“侧链”以及其他可能的“链”。这场区块链霸权的战斗是全球性且激烈的。\n\
  \n区块链的基础协议以及开放、去中心化、透明、时间戳和防篡改数据传输的独特特征，使得区块链如此价值，成为未来的突破性技术。它将深刻影响贸易、商业和网络的各个方面，在几年后，我们所知的\
  \ `TCP/IP` 网络将过时并成为落后的技术，尽管它可能像 `COBOL` 计算机编程语言在持续技术开发几十年后仍存在一样。\n\n但普通互联网用户并不关心哪种协议在支持他们的互联网，他们关注的是速度。没有人喜欢缓慢的网络，更不用说一个容易被黑客攻击并简单窃取数据的网络了。区块链将使变得越来越困难，在大多数情况下是不可能的，因为所有交易都由一个激励参与者网络进行验证，该网络会立即检测到偏离、黑客攻击或网络攻击。\n\
  \n区块链确保了链中的所有区块只能通过整个网络的同步更新来验证，这使其具有不可篡改性，并将验证激励机制植区块链代码本身；这意味着这些协议是“自给自足的”。\n\n\
  \n\n只有一种极低概率的可能性即“51% 攻击”，这意味着区块链协议的一半以上受到了攻击并被破解。要实现这一目标，需要巨大的计算能力，以至于即使是美国、中国或俄罗斯等整个国家的计算总和也够不上，因此这种这种情况极不可能发生。\n\
  \n然而，量子计算——这种结合了超速和惊人能力的计算方式——可能会使区块链协议过时或变得容易受到网络攻击，现在甚至有了关于“量子免疫”（意味着 100% 安全）和“量子抗性”（意味着并非\
  \ 100% 安全）区块链的讨论。\n\n尽管，量子计算和区块链领域接下来会发生什么，只有时间能给出答案，由于区块链技术的快速发展，解决方案总会在未来的某处。\n\
  \n\n驱动区块链以超快速度发展的动力，是一个由程序员、开发者和计算机科学志愿者组成的军队的意愿，他们不断改进区块链协议以及区块链之上的应用层。\n\n到目前为止，像谷歌、Facebook、苹果、阿里巴巴、亚马逊、百度和腾讯这样的科技巨头聚合并捕获了数据价值，将其存储在自己的专有数据孤岛中，除非付费，否则他们不愿且明确拒绝共享。\n\
  \n如今的互联网由一个“薄”协议和一个“厚”应用层组成，其真正的价值是由全球互联网用户创造的，而产生的数据随后由现代世界的科技巨头存储和控制。\n\n区块链反转了这一方程式；它是一个“厚”协议层和一个“薄”应用层，这与互联网协议完全相反。\n\
  \n与如今的互联网不同，区块链是一个开源的去中心化节点网络，在这些网络上，所有用户数据的存储和复制是在协议本身中进行的，而不是存储在“企业科技孤岛”中并只能通过层于互联网协议之上的应用程序访问。\n\
  \n简单来说，如今互联网上的所有数据都由私有公司存储并控制在专有孤岛，而在区块链上，所有数据都变得公开可用，这就是区块链的魅力所在。它让每个人都能获取数据，并用于开发新的应用程序和生态系统，造福广大民众。\n\
  \n区块链开发者——以及“网络中立”的真正信徒——的最终目标是实现一个真正的“自由”互联网，它让所有人都可以使用，不受限制，不受大科技公司的牟利。我们现在距离区块链成为主流并取代我们今天所知的“受控”互联网只有一步之遥。这意味着让权力归还于人民。\n\
  \n\n\n尽管区块链具有革命性，并将并将颠覆我们今天所知的整个互联网，但它仍然不成熟且使用起来很麻烦。\n\n除了由受过高等的数据科学家、密码学家和区块链专家开发终极区块链协议至关重要外，到目前为止的所有区块链协议都存在支撑区块链技术的相同缺陷：\n\
  \n1. **速度** - 尽管有了许多改进，但与目前的互联网速度以及传统金融网络的极交易速度相比，区块链交易仍然极其缓慢。例如，“高频交易”在毫秒（一千分之一秒）内执行，某些网络甚至在微秒（百万分之一秒）内。相比之下，`Bitcoin`\
  \ 每秒可以处理约 3-4 次交易，`Ethereum` 网络的最大容量为每秒 15 次交易，但这一数字正在随着新型先进协议的快速增加。\n\n\n\n4. **以太坊和智能合约**\
  \ - 最常见的是 `ERC20`，但更新、更快、更实用的智能合约（如 `ERC223`）正在开发中，竞争在于增加智能合约的实用性、效率和适应性。\n\n5.\
  \ **加密钱包和密钥** - 只有少数钱包对于防止黑客攻击非常安全，它们主要是 `MyEtherWallet` 和 `MetaMask`。对于普通的加密交易者/持有者（也是几乎所有\
  \ ICO 的首选），只有上述 2 个加密钱包足够安全并被接受接收加密代币和硬币。\n\n6. **加密交易所** - `Binance`、`HitBTC`、`Coinbase`、`Kraken`\
  \ 以及许多其他是目前共 272 个交易所和 33000 个市场（CoinMarketCap 2021 年 2 月）中的主要交易所，目前有 4000 多种不同的加密货币可以交易，但加密交易技巧对于导航这些交易所并盈利交易至关重要。\n\
  \n7. **加密、代币和硬币 - 交易与投机** - `Bitcoin` 在很大程度上由 4 个大矿矿集团和少数巨比特币持有者控制。其他加密货币也由于挖矿成本高（电力消耗和巨大的计算需求）以及供需压力而面临压力，包括\
  \ `Bitcoin` 和 `Ether`。 4000 多种加密货币中的绝大多数面临着缺乏实用性、无功能和流动性的明显问题。无数代币列在许多交易所中，但只有少数升到了数字的高度，为投资者带来了惊人的\
  \ ROI（投资回报），绝大多数代币流动性极差且交易水平接近零。\n\n8. **加密货币 OTC 交易** - 很大程度上不受监管，不受公众保护，几乎秘密且通常仅限“专属会员”。场外交易是真正交易大量\
  \ `Bitcoin` 的地方，这些巨额交易可能不会影响 `Bitcoin` 的价格或交易量。\n\n8. **加密货币托管和多签名授权** - 对于加密货币的主要持有者，在声誉良好的银行、经纪公司或交易所进行安全的托管不仅是建议的，也是绝对必要的。为了避免不小心丢失账户\
  \ `key` 这一恼人问题，并防止欺诈或滥用（在没有合作伙伴、公司董事或合规官许可或知情的情况下转换或提取加密货币），可以使用多签名账户来确保私人、公司和巨额加密账户的安全，且不依赖于单一密钥或账户持有者。有很多疯狂和幽默的故事，密钥持有者翻垃圾堆寻找他们丢失的加密钱包字母数字密钥。\n\
  \n\n\n\n如果没有区块链、智能合约和加密货币，今天的首次币发行或代币发行将是不存在的。由于这三种先进技术的结合，ICO 和 STO 为初创公司和企业融资创造了一个全新的宇宙。在未来的某个时候，只有在经过某种形式的“轻型”监管后，ICO\
  \ 和 STO 最终将取代 IPO，原因很简单：`ICOs`/`STOs` 是大众可以参与的，而 `IPOs` 是“机构化”的，大众只有在 `IPO` 上市且股票在`NASDAQ`\
  \ 和`纽约证券交易所`等知名交易所上市后才能参与。现阶段，当 IPO 的炒作退去后，股价下跌的可能性高于上涨，除非是像那些明显的——且大多是例外的案例，例如科技巨头\
  \ `Apple`、`Amazon`、`Facebook`、`Google`、`Netflix` 等。\n\n加密货币的祸源，也是加密交易所面临的最大挑战。近期，全球一些声誉良好的交易所重大黑客攻击和盗窃事件为交易所的网络安全蒙上了一层阴影，反过来催生了整个防止黑客攻击的行业。\n\
  \n有钱的地方就一直有犯罪机会。不幸的是，`ICOs` 也未能幸免，许多 `ICOs` 纯粹是欺诈，意在利用大众的天真来欺骗并盗取投资者的资金；这些不知情的投资者希望投入自己的储蓄，以换取\
  \ ICO 成功后的丰厚回报。未来只有监管以及更强的司法参与和监督，才能防止 ICO 欺诈。因此，诸如 `ICObench` 这样的专业 ICO 评级和审查机构非常有价值，通过同行评审以及\
  \ `KYC/AML` 白名单合规性与验证来检测 ICO 诈骗。\n\n运行在计算机 P2P 网络上的去中心化应用程序面临面临着更大的挑战，例如与现有金融网络和基础设施的互操作性和兼容性。简单来说，目前形式的区块链对用户并不友好，尚未完全开发，因此尚未实现主流普及。\n\
  \n\n### GDPR 第 17 条 - “被遗忘权”\n如果和当你的个人数据不再需要或被非法使用时，你有权隐含地要求删除你的数据。\n\n数据主体有权对其有关或自身的个人数据进行更正，并拥有“被遗忘权”，如果保留此类数据违反了控制者所受的本条例、欧盟或成员国法律。特别是，当个人数据对于其收集或进行处理的目的不再必要，或者数据主体已撤回其同意或反对对其有关或自身的个人数据进行处理，或者其个人数据的处理其他不符合本规定时，数据主体有权删除其个人数据并不再对其进行处理。\n\
  \n\n这是区块链面临的最巨大挑战——`blockchain/DLT` 协议的不可逆转性和不可篡改性——特别是对于基于区块链的金融服务、版权与内容创作/发行以及社交媒体网络的发展。\n\
  \n另一个同样重要的问题是，当“数据输入点”的个人数据被错误或故意和/或欺诈性地操纵时，此类数据问题如何被扭转、补救和/或更正？\n\n区块链初创公司和协议开发者如果不想被法律制裁，将找到合适的解决方案。\n\
  \n只有当这些新技术能够按照预期、去中心化且无缝地被利用时，加密货币的用户体验、实用性和大众普及才会不断增长。在计算机的早期，计算机制造商面临着同样的困境：如何在不需要学习\
  \ `COBOL` 等编程语言的情况下增加使用。惊讶的是，当 `Steve Jobs` 引入第一台 `Macintosh` 时，他通过使用`mouse` 破解了“阻力”。\n\
  \n`Microsoft` 的 `Bill Gates` 随后复制了图标概念，导致 `Microsoft` 成为全球运营软件领导者并主导了市场份额。在市场份额争夺的惨过程中，`Apple`\
  \ 几乎破产，`Steve Jobs` 被解雇。\n\n多链是高级开发的“圣杯”。各种区块链和 DLT 协议的兼容性和互操作性（包括链上和链下混合）是许多竞争协议霸权的初创公司的目标。\n\
  \n区块链终有一天将取代——或至少超越我们所知的互联网。超速 `blockchain/DLT` 协议将叠加在 `TCP/IP` 协议之上，通过这种方式，区块链\
  \ 3.0 将成为现实。\n\n在这个竞争异常激烈的领域，`Aerum`——一家 2018 年开发的创新捷克初创公司——开发了一个与 `Ethereum` 连接的高性能开放去中心化应用平台（使用跨链去中心化\
  \ `Atomic Swaps`），它将实现超快速交易（`Ethereum` 的 100 倍 - 2 秒区块时间 - 5 秒实时交易执行），并能与其他区块链协议并排运行或叠加在其之上。其他初创公司正在创建它们自己的混合链上/链下/侧链协议，但这些大多基于封闭和许可的\
  \ `DLT` 协议，因此是中心化的并由中央机构或治理实体控制。然而，区块链 3.0 将保持开放和去中心化，这才是 `Satoshi` 愿景的真正精神。\n\n\
  为了建立“价值互联网”，它必须恰恰做到：实现所有参与者的价值传输。更快、透明且不可篡改的交易，可以追溯到特定的区块，而不需要中间人。同时，这一过程必须对所有人都是简单且易于的。通过这样做，价值互联网将会自动形成。\n\
  \n\n\n\n\n还有有多少用户注册在“MySpace”、“Napster”上，或者继续使用“Yahoo”而不是“Google”？这些早期科技公司在最初凭借其创新平台和独特服务登场时，其规模仅是它们曾经辉煌的一小部分。\n\
  \n同样的蜕变也将发生在 `Facebook`、`Google`、`Amazon`、`Netflix` 和 `Apple` 等当前的科技巨头身上。已经有无数区块链初创公司正在创建基于区块链的、当前大科技领军者的“克隆版”。从音乐和视频流媒体到内容和社交媒体，许多以前属于大科技公司专有数据的内容和创意——存储在它们自己的专有数据孤岛中，以换取对其平台的“免费”使用——现在正变得代币化。代币生态系统正在通过公平地奖励提供内容或创意的用户来建立自己的用户群，并为“知识共享”和广大的“大众”提供这些生态系统内的曝光和触达，以进一步发展他们的才华和创意。很快，如今的科技巨头将回顾、改变并调整其业务模式，以跟上极速区块链的发展，同时不牺牲利润或放弃市场份额。\n\
  \n\n\n\n\n让史夫·乔布斯成为远见者的是，他专注于并基于以下关键 UX 元素创造产品：\n\n1. 用户体验\n2. 效用\n3. 即时满足\n\n这里“效用”的含义是一个源自伯努利定义的经济术语——适应现代后——是指“消费商品或服务所获得的总满意度”。\n\
  \n所有 `Apple` 产品都具有上述 3 个关键元素，因此 `Apple` 最近已成为世界上最有价值的公司，超过了魔法般且天文般的 2 万亿美元市值。\n\n\
  史夫·乔布斯与他的首席设计师约翰·艾维爵士（Sir Jon Ive）从第一幅设计图到最终成品，一直专注于用户体验。\n\n独一无二且突破性的产品是像史夫·乔布斯这样的远见者与像约翰·艾维爵士这样才华横溢的设计师之间密切且独特合作的结果。他们的成功产品今天在全球范围内使用，开创性产品已经遍布全球博物馆，不仅改变了一整代人，还改变了整个消费世界。\n\
  \n1. Apple Macintosh\n2. Apple IPod\n3. Apple IPhone\n4. Apple IPad\n5. Apple MacBook\n\
  6. Apple App Store\n7. Apple Music\n\n这些 `Apple` 产品彻底改变了计算机和电子世界，从那时起许多玩家进入该领域，复制并改进史夫·乔布斯和约翰·艾维爵士的知识产权、独特设计和想法。\n\
  \n所有 `Apple` 产品成功的主要原因是用户体验，因为他们所有的产品都是直观且易用的，复杂的技术在后台运行。普通消费者不在乎后台运行的是什么技术或计算机编程语言，消费者关心的唯一件事是：它是否好用，速度是否快。\n\
  \n互联网和区块链也是如此，用户不在乎是什么技术或协议为他们的便携设备、平台或应用提供支持，重要的是速度、功能和即时满足。\n\n区块链 3.0 需要实现相同甚至更多的目标，以实现广泛的采用和使用，这只是时间问题以及以客户为中心的发展。\n\
  \n\n\n我们可能永远无法发现中本·聪聪（Satoshi Nakamoto）的真实身份，但他那卓越思想的影响将永远影响金融市场和全球经济。这种第一个真正的国际、无国界且去中心化的、供所有人、在任何地方、任何时间使用的货币的创造者，在没有收集荣誉的情况下创造了历史。在向数字货币的发明者和先驱给予赞誉时，各国政府面临着。由于创造了第一种真正的国际、无国界且去中心化的、供所有人、在任何地方、任何时间使用的货币，政府面临着噩梦——如何监管加密货币？\n\
  \n除了加密货币的疯狂投机，最紧迫的问题是创建一个脱离任何国家、政府或监管机构的金融工具是否可能？\n\n各国是否会发行自己的加密货币？\n\n随着全球加密货币市值接近\
  \ 1.5 万亿美元，多方接受变得不可避免。\n\n中本对去中心化货币的愿景是一项不可思议的成就，全世界的政府没有其他选择遵循他的领导并发行自己的数字货币。\n\
  \n\n隐秘但传奇的远见者中本聪创造了名为 `Bitcoin` 的不可破解加密货币，以及作为不可篡改的底层技术 `Blockchain`。\n\n从默默到主流的漫长道路，并在\
  \ 2017 年达到巅峰后，许多企业家、远见者和机会主义者复制了 `Bitcoin` 的独特性——去中心化、无国界。然而，加密货币王冠仍然稳固地留在第一个加密先驱中本手中，占据全球加密市场的平均\
  \ 52%。\n\n安全性——`Bitcoin` 之能生存的原因之一是它让黑客无可下手。公共账本不包含有关用户的身份信息。更重要的是，没有人拥有或控制该账本。\n\
  \n没有单一版本。\n\n\n中本王座的继承者是维塔里克·布特林（Vitalik Buterin），这位出生在加拿大的俄罗斯天才在仅 19 岁时就创造了 `Ethereum`、以太坊（ETH）和智能合约。\n\
  \n`Ethereum` 目前是大多数 ICO 使用的领先区块链平台，占整个 ICO 市场的 87%。遥遥居第二的是 `Waves`，随后是 `Stellar`、`NEO`、`NEM`\
  \ 和 `EOS`，后者在 2018 年是全球顶级 ICO，当时筹集了令人震惊的 42 亿美元。\n\n\n\n\n目前还不清楚为什么要包含这个特定的《金融时报》（FT）标题，但大多数人推测它是\
  \ 2009 年 1 月 3 日比特币创始区块的一个可验证的“日期戳”，并引用了英国政府对与其银行的救助。\n\n有些人甚至认为，这是对银行和金融机构滥用全球金融体系（并延伸到全球经济）的某种“反抗”。\n\
  \n与此同时，它重申了比特币的宗旨：一种点对点的数字货币，不受任何中央银行或政府的控制，这正是去中心化的真正精神。\n\n\n\n遗憾的是，比特币作为虚拟货币，是在无名和法律阴影下开启了其开创性的职业。由于其去中心化、无国界和匿名性，它被用作非法和犯罪活动的“完美支付方式”，例如毒品和武器销售，还被用于洗钱和逃税。\n\
  \n丝绸之路市场（不要与连接东西方的古代历史丝绸之路混淆）由罗斯·威廉·乌尔布里特（Ross William Ulbricht，以化名“恐惧海盗罗伯特”身份伪装）于\
  \ 2011 年 2 月创建。\n\n它是第一个现代数字“黑市”，作为暗网上的“Tor 隐藏服务”运行，在当时是著名的通过比特币交易支付的非法毒品销售平台。\n\
  \n2013 年 10 月，臭名昭彰的丝绸之路市场被联邦调查局（FBI）关闭，同时，罗斯·乌尔布里特因八项指控被捕，并最终被处以终身监禁且不得假释。\n\n在整个审判过程中，他拼命证明自己只是一个无辜的受害者，并指责其他人（包括\
  \ Mt. Gox 首席执行官马克斯·卡佩莱斯）在在他不知的情况下运行了该网站。\n\n在判刑前，在一封写给主审法官福雷特的信中，乌尔布里特书面表示，他通过丝绸之路采取的行为是出于“自由意志主义理想主义”，并且“丝绸之路本应该是给人们提供做出自己选择的自由”。他还承认自己犯了一个“毁掉生活的巨大错误”。\n\
  \n曼哈顿美国联邦法院的福雷特法官相信罗斯·乌尔布里特，判处了 5 项合并执行（意味着同时执行）的刑，其中 2 项是终身监禁且不得假释。他还被命令没收他在丝绸之路市场运营期间获得的\
  \ 1.83 亿美元非法收益。\n\n随后出现了丝绸之路的几个版本，但在它们启动之前，都被 FBI、国际刑警组织或其他国际执法机构和当局关闭。作为一种意料之外的后果，世界各地的黑市复苏了，满足了不法分子使用旧的美元作为现金支付的旧式握手交易，这远远远离了数字交易为国际执法部门提供的监管审查。\n\
  \n比特币遭受了“声誉损害”，从那时起一直被视为和归类为与犯罪相关的“脏钱”，这种污名至今仍困扰着比特币，并阻止了世界上许多地区开设加密账户。即使没有使用银行账户进行加密货币的传输或转换，仅仅是与比特币或加密货币关联在现在及可预见的未来就足以成为被拒绝开设银行账户的理由。\n\
  \n\n\n与比特币或美元不同，实物黄金实际上是被“开采”的，具有真实的内在价值且触手可及。\n\n几个世纪以来，金币或金条形式的黄金被用于交换商品和服务，并作为储备。整船的黄金被运输到世界各地，用于资助战争并在世界最偏远的地区建立哨所和殖民地。\n\
  \n直到今天，金币和金条仍在从沉没的船骸中打捞，那些在 1410 年至 1639 年间航行全球、征服海外土地和领土的西班牙大帆船。赏金猎人对数百年后在海底发现的宝藏之完好程度感到惊叹。\n\
  \n如今，黄金仍被视为动荡时期的避风港，但现在大多存储在全球各地的高安全性银行库中。由于黄金是实物，且可以相对容易地通过金币或金条运输或携带，它在未来几个世纪内将继续作为“价值存储媒介”。\n\
  \n\n比特币——最受欢迎的加密货币——由神秘的中本聪（Satoshi Nakamoto）在 2008 年全球金融危机后于 2009 年创立。中本聪的愿景和比特币的目的是建立一种“去中心化”的数字货币，因此不受任何政府或中央银行的影响、控制或操纵。\n\
  \n为了实现这一目标，比特币基于革命性的、改变游戏规则的突破性区块链技术这这是一个公共分布式账本，具有防篡改、时间戳和透明性。到为止，只有少数人成功破解了从其创建者设置的数学问题锁定的\
  \ 2000 万个比特币中提取代码。这位创建者是一位软件工程师，真实身份未知，但使用的名字是中本聪。\n\n\n所有交易都是安全、可靠且不可逆的，其涉及的成本是全球银行和金融机构收取的当前通货膨胀成本的一部分。从负面来看，由于验证过程以及目前难以扩展的区块链系统，区块链交易（与其他手段相比）要慢一些。然而，现在有了许多改进和增加，将实现快速交易处理和扩展。\n\
  \n最初，比特币并没有被认真对待，被视为一种几乎没有或完全机会成功的“噱头”。然而，事实证明这是完全错误的，在此期间实际上建立了其他数千种数字货币，包括电子钱包和交易所，这些数字货币可以在这些地方进行交易、兑换其他加密货币以及真实的“法币”。快进到今天，诸如\
  \ `CME` 和 `CBOE` 等衍生品交易所以及科技交易所 `NASDAQ` 已经在交易比特币期货合约。作为老牌纽约证券交易所的母公司，洲际交易所（ICE`）即将推出“Bakkt”，这是一个比特币期货交易和托管平台。\n\
  \n《支付服务法》（银行法的一部分）已经过修订，允许“虚拟货币”作为一种法的支付形式。另一个里程碑是日本金融监管机构正式批准了加密货币交易所的运营。同时，17\
  \ 种加密货币被批准在这些交易所交易，包括比特币、`Ether`、`Ripple`、`Litecoin` 和 `Monacoin` 等主要货币。\n\n\n具有前性的日本是首批正式接受数字货币作为合法支付形式的主要工业国家之一，旨在成为全球第一个推出名为“J-coin”的国家数字货币的国家，该货币由包括瑞穗金融集团（`Mizuho\
  \ Financial Group`）和日本邮政银行在内的银行团发行。\n\n日本的 `FSA`（金融厅）目前已为 17 家加密交易所颁发许可，并允许另外 18\
  \ 家公司在申请正在审核期间运营加密交易所。这些公司有时被称为加密货币交易所的“准运营商”，`FSA` 的等待名单很长，在此期间超过 160 家交易所申请获得批准。\n\
  \n中国和韩国等国家已打击了比特币和加密货币交易所，有些国家采取了缓慢的“观望”态度，许多国家正在考虑适当的立法和监管。\n\n\n价值存储是一种资产的功能，它可以在稍后被保存、提取和交换，并在提取时具有可预测的用途。更广泛地说，价值存储是任何在未来仍保留购买力的东西。\n\
  \n交换媒介是一种用于促进各方之间商品销售、购买或交易的中间工具。要使一种工具作为交换媒介发挥作用，它必须代表所有方接受的价值标准。在现代经济中，交换媒介是货币。\n\
  \n\n比特币同时符合这两个标准，因此它的全球采用是现象且持久的。由于这个原因，人们建立了数千种其他数字货币，但它们的全球采用和成功是否能与比特币一样还有待观察。\n\
  \n\n比特币加速上升到令人眩晕的高度仅仅是群体狂热的结果，疯狂的交易加剧了更多的投机。目前的炒作如此巨大，以至于每个人都想购买、卖出、交易、交换或拥有比特币，无论其内在价值或基础价值如何，而且几乎不考虑涉及的风险。\n\
  \n大型银行和经纪公司以及经验丰富的交易员和富裕投资者可以负担比特币“狂躁”的波动——有时在一天内波动一千或两千美元——但普通投资者应该小心，保护自己免受比特币价值可能崩溃的影响。\n\
  \n已经存在——并将继续存在——关于比特币随时可能崩溃的疯狂投机，而另一些人预测比特币的价值甚至超过 100,000 美元的巨大关口。\n\n约翰·马菲（McA\
  \ 菲创始人和网络安全先驱）——坚定地预测比特币价格将在 2022 年达到 100 万美元。尽管大多数怀疑者和专家认为这一预测是极其疯狂的，但在内心深处，许多人希望马菲能被证明是正确的。\n\
  \n郁金香热是荷兰黄金时代的一个时期，见证了有记录的首次投机泡沫的飞速上升和 1637 年 2 月的惨烈崩溃。这一事件在 1841 年通过英国记者[查尔斯·马凯](https://en.wikipedia.org/wiki/Charles_Mackay_\\\
  (author\\))所著的《奇异的幻想与大众疯狂》一书广为人知。\n\n\n\n\n\n这种观点认为，物品的价值并非取决于其自身的属性，亦非生产该物品所需的劳动量，而是取决于不同的人对该物品的需求或需要程度。`Subjective\
  \ Theory of Value`（价值主观理论）将价值建立在物品的稀性和有用之上，而不是基于创造它投入了多少资源和工时。\n\n该理论由 19 世纪后期的经济学家和思想家提出，包括\
  \ `Carl Menger` 和 `Eugen von Boehm-Bawerk`。\n\n\n\n在比较 `Bitcoin` 和 `US dollars`\
  \ 时，“感知”价值超越了“真实”价值，也就是说，两种货币之所以被认可价值，是因为它们的通用标准、分配以及作为支付方式的认可。\n\n另一方面，`Gold` 也可以被接受为支付方式，其不同之处在于作为物理“价值存储手段”它是实体的。\n\
  \n供需市场动态决定了 `Bitcoin` 等货币和 `gold` 等商品的“感知”价值。`Bitcoin` 的感知价值在 2021 年 1 月达到了近 `$\
  \ 48.000` 的天文数字，这在很大程度上归于炒作、狂热和稀缺性。\n\n`Mark Zuckerberg` 的对手——`Winklevoss brothers`\
  \ `Cameron` 和 `Tyler Winklevoss` 据说通过拥有大约 `100.000` 枚 `Bitcoins` 首批证实的 `Bitcoin`\
  \ 比富翁。`Winklevoss brothers` 始终强调，他们认为 `Bitcoin` 是比黄金更好的“价值存储”。数字世界现在似乎也认同这一点。\n\n\
  \n`Bitcoin` 已死反复千万，但它依然存在。\n\n目前，`Bitcoin` 的市值（$1 trillion`，截至 2021 年 2 月）几乎相当于某些华尔街投资银行的市值。`Bitcoin`\
  \ 甚至比大多数法币都要，而且疯狂的市场价值增长似乎不可阻挡。\n\n疯狂的投机、炒作和剧烈的交易在短时间内将 `Bitcoin` 价格推向令人置信的水平，现在随着\
  \ `Bitcoin futures` 在 `CME`、`CBOE` 和 `Nasdaq` 等衍生品交易所上市，市场分析师和投资者纷纷推测 `Bitcoin`\
  \ 的价格甚至会更高。\n\n那么，为什么 `Bitcoin` 对投资者、投机者、银行、经纪商、金融机构以及普通零售投资者如此具有？\n\n\n`Bitcoin`\
  \ 使用 `blockchain` 创建了一种数字货币，这是一种不可逆转、不可腐败且去中心化的金融基础设施，它在没有政府或 `Central banks` 干预的情况下，改变了货币或价值交换的方式。\n\
  \n`Bitcoin` 被其创造者——神秘的 `Satoshi Nakamoto` 限制在 `21 million` 枚，而目前已有近 `17 million`\
  \ 枚被“挖出”。\n\n在不遥的将来，`Bitcoin mining` 将停止，由于由于极端的稀缺性，`Bitcoin` 的价值将是当前市值的数倍。\n\n\
  如果有任何政府干预并试图监管或限制 `Bitcoin`，将引发 `Bitcoin` 社区以及全球投资者社区前所未有的反弹，随后 `Bitcoin trading`\
  \ 将简单地转移到其他不受监管的边缘市场，其中 `Malta` 是一个主要的竞争者。\n\n更重要的是，`Bitcoin` 向全世界引入了革命性的、改变游戏规则的突破性技术\
  \ `Blockchain`（区块链），这是一种防篡改、带有时间戳且透明的公共分布式账本。\n\n`Blockchain` 是为 `Bitcoin` 创建的数字基础设施，它将超越互联网，成为信息时代迄为止最重要的技术进步。\n\
  \n\n回首 19 世纪初美国的 `Gold rush`（淘金热）时期，有许多相似之处。\n\n繁荣与衰退的周期以及伴随的基础设施投资导致了贸易扩张、大规模移民以及在新地区定居。\n\
  \n在 `Gold rush` 之后，当大多数淘金者离开后，留下的的是道路、铁路以及居住在新建立的城镇和贸易前哨的社区基础设施。\n\n在当时世界货币供应基于\
  \ `[gold](https://en.wikipedia.org/wiki/Gold_standard Gold standard)`（金本位）时，新开采的黄金提供的经济刺激远超金矿区。\n\
  \n这种情况同样适用于 `Bitcoin` 和 `Blockchain`。当尘埃落定后——假设发生了 `Bitcoin meltdown` 或遭到打压——留下的将是一个全球技术基础设施，它将不仅被全球金融界使用，还将被几乎每一个参与任何形式商业或贸易的行业使用。\n\
  \n在此之前，`Bitcoin bubble` 将膨胀、缩小，但它永远不会破灭。\n\n\n\n根据全球咨询公司 `McKinsey`（麦肯锡）的估计，目前有超过\
  \ `2.5 billion` 人口没有银行服务或银行服务不足，这意味着这些全球公民无法获得银行或信贷设施，实际上被排除在全球银行和金融市场之外。\n\n由于大部分“没有银行服务”人口是第三世界国家缺乏适当文件的公民，他们实现财务独立或自给自足的机会大大减少，导致其在生存上长期依赖国际援助或政府救济，或者在最坏的情况下，面临饥荒和死亡。\n\
  \n`Microloans`（小额贷款）曾是一种补救措施，然而，不良高利贷者收取的过高利率，或真实企业家对 `microloans` 的高违约率，导致了 `micro-loan\
  \ lending`（小额贷款业务）的整体下降。\n\n过去小额贷款的成功与失败案例如此多样且迥异，以至于没有足够的可靠统计数据来衡量全球范围内 `micro-lending`\
  \ 的进展或失败。\n\n\n\n\n\n“支持者声称，UBI 将打破弱势群体的依赖循环，让他们获得时间和资金去寻求阶层跃升所需的培训和高等教育。然而事实上，它是剥夺了那些真正需要的人的资源来进行更广泛的。”\n\
  \n\n\n\n\n毕竟，每位公民发放一千或两千美元，在某些国家会迅速累积到数十亿，而在美国，这将转化为数万亿美元。\n\n目前，大多数工业国家甚至无法为那些有权的老年人支付应有的养老金，而这些人为了终其一生都在向政府或公司养老金计划缴费。更不用说还要增加这一代年轻人了，他们正值壮年，在完成大学学后进入职场，而大学毕业已是现代世界的最低教育水平。\n\
  \n在世界上大部分地区，失业金、社会福利和医疗保健已经因缺乏政府资金和支出而陷入困境，加入 `UBI` 从字面上讲会“拖垮”政府预算，因此，政府提供的“免费午餐”概念简直是幻觉的。\n\
  \n\n\n无论全球 `UBI` 乌托邦面临什么障碍，最紧迫的问题是对自我价值和自尊心产生的负面影响和社会反响。依靠政府生活不会对集体生产力做出贡献，相反，它会扼杀学习和在生活中获得超越邮寄津贴成就的动力。\n\
  \n`UBI` 是一个坏主意，它向有抱心的年轻人传递了错误的信号，并极可能导致整个社会的“庸化”。社会污名和后果是不容忽视的。\n\n\n在世界上大部分地区，野心勃勃且受过教育的年轻人决心在生活中“取得成功”，并设定了很高的目标，同时为了实现梦想而牺牲娱乐和空闲时间。\n\
  \n虽然这是世界上某些地区的理想情况，但大多数坚定的年轻人并没有同样的机会，即使在“奶糖与蜂蜜之地”——美国也是如此。\n\n美国的各贫困地区并没有给年轻一代提供平等机会，这在黑人和西班牙裔社区中尤为普遍，在那里贫困是日常生活的一部分。毒品和犯罪占据中心位置，大多数贫困社区青年的唯一避难所是体育、音乐或军队。`US\
  \ Armed Forces` 提供的纪律、苦训练、付费教育和可能的长期就业，对于那些试图逃离贫困、毒品、犯罪和家庭暴力，或仅仅试图避免在家里附近做低薪苦力工作的年轻人来说，就像像磁石一样。\n\
  \n良好的教育是需要代价的，由于美国大学和学院高昂的学费，除非获得奖学金，否则普通的黑人或西班牙裔青少年进入大学或学院并接受高等教育的机会微乎其微。\n\n作为\
  \ `UBI` 的替代方案，一个正在被考虑的更现实的概念是 `UBA` 或“通用基本资产”，一种资本主义合作社。与其采取 `UBI` 概念所提议的常规政府拨款，公民及其社区可以参与可行的基础设施项目（如太阳能电池板或风电场），并获得收入和利润的公平份额。这些额外收入可以用于增加个人储蓄，或重新投资到其他\
  \ `UBA` 项目中，进一步并确保所有 `UBA` 参与者的财务独立。\n\n这个概念目前看起来可能有些遥远或不可实现，但随着区块链和价值互联网的到来，这可能比预期更早成为现实并在全球范围内创造新水平的繁荣。\n\
  \n\n“我们的目标是那一英分币。全球银行业一直忽视了所谓的金字塔底部。我们没有这样做，因为我们理解金字塔底部需要被服务，而且这样做也有商业可行性。”\n\n\n\
  某些撒哈拉以南非洲国家采取了更积极的方法，一个响彻金融界的成功案例是“M-Pesa”，这是由肯尼亚最大的移动运营商 `Safaricom` 于 2007 年推出的的一种移动银行和货币转账服务，它为没有银行账户的人群提供了参与全球银行体系的机会，并在适当的时候进入了金融市场。\n\
  \n在运营仅 12 年后，`M-Pesa` 的成功令人印象深刻。\n\n如今，在撒哈拉以南的几个国家以及印度、埃及、阿尔巴尼亚和罗马尼亚，其用户已超过 2000\
  \ 万。\n\n为了获得市场份额并扩大 `M-Pesa` 支付转账网络，它与 `Western Union`（西部联汇）、`MoneyGram` 和 `WorldRemit`\
  \ 等汇款巨头建立了合作伙伴关系，还与瑞士的“邮政金融”部门建立了合作，通过广泛的瑞士邮政局网络，为 `M-Pesa` 在瑞士银行和货币转账系统中提供了稳固的足点。\n\
  \n`M-Pesa` 最自豪的成就是通过为肯尼亚没有银行账户的人提供移动银行和货币服务，使估计 2% 的肯尼亚家庭脱了极端贫困并在过程中提高了生活水平。\n\n\
  `M-Pesa` 的成功故事成为其他银行和电信公司效仿的催化剂，建立自己的移动支付网络与非洲成熟的支付转账公司竞争。\n\n代表 46 家肯尼亚银行的 `Kenya\
  \ Bankers Association` 最近宣布，他们将引入自己的移动支付网络，通过智能手机应用程序实现肯尼亚境内账户之间的转账，直接与 `M-Pesa`\
  \ 竞争。\n\n`PayTech`——金融领域的新支付技术——通过解决全球银行客户的需求，使金融服务对所有人更容易获得且更廉价。\n\n\n“我们针对的是那一英分币。全球银行业一直忽视了所谓的金字塔底部。由于只有一小部分拥有信用卡，导致几乎其他人都不得不携带现金。现在更多人拥有了手机，利用智能手机实现数字支付的时机已经成熟。”\n\
  \n\n尽管听起来很奇怪，现金是昂贵的，贫困也是。\n\n贫困通常意味着无法获得银行或信贷服务，这对于任何试图实现财务独立的人都是一种抑制。能够进行支付并获得廉价贷款可以改善贫困人的生活质量，因为通过管理财务，可以对支出进行控制，并留一些储蓄以备未来购买。\n\
  \n此外，通过参与国家的实体经济，政府可以追踪流通中的货币，并相应调整利率，并将通胀控制在合理的范围内。\n\n\n找到中庸之道将是两全其美的，既减少了现金的流通，同时增加了数字现金（即银行卡和信用卡的使用）。\n\
  \n为了实现这一目标，金融普惠是首要目标，其次是接入全球互联网。在没有移动基础设施的情况下，给全球公民提供智能手机是徒用的，因此，建立一个所有人都能访问且*免费*的全球互联网网络将是朝着正确方向迈出的大一步。\n\
  \n可靠的互联网接入和金融普惠不仅能为没有银行账户的人群提供财务独立，还能为这些人提供自己摆脱贫困的工具。\n# 全球汇款的经济影响\n\n“全球汇款总额估计为\
  \ 5080 亿美元”\n\n\n根据世界银行的一份报告，截至 2020 年，海外生活和工作的人每年汇回约 5080 亿美元。通常情况下，这些汇款从工业化国家流向发展中国家（中国除外）。\n\
  \n这些来自海外的资金对特定国家的经济产生巨大影响，同时也是该项主要的经济资产。\n\n中国和印度等人口大国从外部资本流入中受益良多，因为这不仅促进了国家经济增长，还增加了其外汇储备（主要是美元）。\n\
  \n海外劳工汇入金额排名前五的国家：\n\n1. 印度 - 627 亿美元\n2. 中国 - 610 亿美元\n3. 菲律宾 - 299 亿美元\n4. 墨西哥\
  \ - 285 亿美元\n5. 巴基斯坦 - 198 亿美元\n\n\n虽然虽然全球汇款对国家经济是有益的，但如果能让出口劳动力留在国内，为当地经济和整个社会做贡献会更好且更有用。\n\
  \n\n近期全球冲突和战争的激增（特别是中东地区）导致了新一轮难民，他们离开了饱经战火的国家，前往欧洲更安全的港湾。\n\n难民的大规模涌入难以遏制，土耳其在与战争国家边界附近收留数百万难民方面发挥了关键作用，为估计\
  \ 270 万名难民提供了食物和住所。\n\n绝大多数难民徒步穿越“巴尔干路线”到达欧洲，更大一部分人（主要是非洲人）乘船跨过危险的地中海到达欧洲；他们通常乘坐渔船，但大多数是过度拥挤的充气橡胶船，这些船在恶劣天气和波涛汹中极易翻船。\n\
  \n欧盟对这场人道主义灾难的处理非常糟糕，“关怀负担”被转嫁给了欧盟边境国家希腊、意大利和西班牙。涌入这些国家的难民数量令其难以承受，希腊岛屿的小镇、渔村和当地社区已无法应对这种不可控的难民涌入，导致了规模巨大的人道主义灾难。\n\
  \n令人悲哀且羞耻的事是，欧盟不仅在阻止难民和寻求申请者进入欧洲方面做得不够，而且在防止成千上万男女儿童在危险的地中海跨越海途中丧生生命方面做得不够。欧盟没有通过与利比亚等“中转”港口政府合作来从源头阻止移民外流，反而是派遣了军舰和巡逻艇，在海上“打捞”任何幸存者。难民跨海遇难造成的人伤亡给欧洲社会和历史留下了不可磨灭的印记。\n\
  \n当人道主义危机在中东展开时，出现了一种奇怪的“一线曙光”，即新的“解放技术”正在通过区块链和通用的金融科技、数字身份和金融普惠，帮助难民和寻求申请者成为全球社会的一部分。\n\
  \n区块链最有前景，因为它允许向难民、寻求申请者和没有银行账户的人发放数字 ID，这反过来将让他们获得庇护、住房、工作以及银行金融服务，从而实现财务独立。\n\n\
  移动连接在全球普惠中发挥着越来越重要的作用，因为它让每个人都能免费接入互联网和全球网信息。\n\n这些技术的结合将让“sans papiers”（法语对世界上“无证”公民的称呼）能够作为认可的公民加入数字世界，享有同样的法律地位和财务独立。\n\
  \n非政府组织（NGO）和人道主义援助机构也从区块链技术中受益，能够在所有人可访问的不可篡分布式账本中跟踪 ID 和庇护申请以及私人生物数据。\n\n进入劳动力市场和获得财务独立的机会将对贸易和全球经济产生巨大影响，区块链将使所有人都能参与价值互联网，并让经济不平等成为过去。\n\
  \n# 我们信任区块链\n\n信任和透明度是所有金融交易和货币事务的重要因素。\n\n因此，任何由声良好的实体、机构或政府（与真实货币和国债相关）支持的事物都是诚信和透明的第一步，在金融世界更是如此。\n\
  \n如果由财团或一组主要银行以及声誉良好的金融机构（如日本的“J-coin”案例）用资产及其既有声誉支持其数字货币，而不是像许多加密货币那样仅靠口头和模糊的承诺，那将非常有帮助。\n\
  \n加密发行的挑战之外，始终存在市值、估值和可能的“回本”问题，如果这些因素在事实发生前或发生后无法或未能确定，问题就会呈指数级增长。\n\n因此，至关重要的一点是——这也是任何资产支持型数字货币的底层承诺——说明“资产支持”一词的准确参数以及如何执行它。此外，说明谁负责代币治理和代码协议的执行也是必须的。\n\
  \n在现实世界中，这些功能由中央银行执行并通过法院实施。\n\n在加密世界中，它们是通过代码协议和共识进行治理的。\n\n\n\n关于虚拟货币的确切定义尚无定论，但有一点是肯定的：除了日本以外，世界上大多数国家尚未将其视为法定货币。日本在\
  \ 2017 年 12 月通过的《支付服务法》中将 `Bitcoin` 以及所有其他数字货币认定为“法定货币”。\n\n即便如此，日本拥有世界上最激进的数字货币监管框架，其近期表示正在考虑将加密货币“重新定义”为“加密资产”，而紧随其后的下一步实际上是成为法定货币。\n\
  \n日本金融厅（`FSA`）仍在决定是否将加密货币归入这一新的法律类别，“以防止加密货币交易者误认为加密货币已经是日本政府的法定货币”。\n\n除了日本之外，即使是“法定货币”的标准定义目前在国际上也存在争议，新术语“许可性”（permissive）被提出作为正确的替代定义。\n\
  \n需要时间，并且可能需要 `UN`、`IMF` 和 `World Bank` 的高级决策，才能对加密货币的统一且全球接受的定义以及法律地位达成一致。\n\n\
  目前，法币、电子货币（简称 `e-money`）与数字货币（`cryptocurrency`）之间的主要区别在于政府和中央银行的控制。\n\n加密货币仅是数字的且无边界，而国家货币——无论是数字形式还是物理形式——都受到控制并限制在国家边界之内，因此受其政府和中央银行的控制（`Euro`\
  \ 和东加勒比比元等经济和货币联盟是一些例外，但这些货币也由一个中央银行控制，且后者自 1976 年以来挂钩美元）。\n\n这赋予了美国等国家巨大的权力和影响，因为强大的美元被用于全球超过一半的金融交易（非法或犯罪美元交易的黑数尚未知），其持有量大约是外国政府、央银行和金融机构所持储备货币的\
  \ 3 倍左右（约占所有已知外汇储备的 64%）。\n\n经济学家 `Paul Samuelson` 和等人（包括去世前的 `Milton Friedman`）认为，海外对美元的需求使美国能够维持持续的贸易逆差，而不会导致货币贬值或贸易流重新调整。但\
  \ `Samuelson` 在 2005 年表示，在未来的某个不确定时期，这些压力将引发对美元的挤兑，并产生严重的全球金融后果。\n\n来源：`Google research`\n\
  \n## 那么，中央银行的控制是否比点对点控制的加密货币对全球经济更好、更安全？\n\n关于这一点也尚无定论，许多经济学家认为这个等式的双方都有收益和风险：由政府和中央银行控制的稳定国家货币对商业、贸易和整体经济是有益的；而另一些人认为加密货币很快将取代全球的法币。\n\
  \n另一个问题是可转换性，`Bitcoin` 的信徒们倾向于不承认，但所有人仍然用法币来衡量他们的加密持仓。\n\n## 为什么选择法币？\n\n因为法币——即“真正的钱”支付了日常需求和要求。它是有形的，可以方便地随身携带或通过电子方式传输，并在日常生活中支付购物费用非常方便。\n\
  \n相比之下，加密货币可能受到黑客的攻击（尽管这种情况尚未发生），或者在发生网络攻击、停电或通信线路（互联网、移动网络、座电话）故障或中断的情况下，在一段时间内无法访问。\n\
  \n到为止，黑客攻击仅涉及被击中的的脆弱交易所。\n\n## 挑战与稳定性\n\n到为止，黑客攻击仅涉及被击中的的脆弱交易所…… [其余文本遵循相同的格式逻辑，去除多余的星号并按照提供的指令将变量/术语封装在反引号中]。\n\
  \n\n\n\n# 资产支持型加密货币之旅\n\n在寻找加密货币的圣杯——稳定性时，许多初创公司已开启了一场难以捉摸的任务，旨在创造一种“稳定”币——最好由现实世界资产支持，并且可以用于日常购物。\n\
  \n简单来说，资产支持型加密货币通常带有一个非常吸引人的营销卖点，但缺乏实质内容。\n\n高尚的想法无处不在，加密世界充斥着各种资产支持的货币，从黄金、钻石和大宗商品支持，一直到数字资产支持（音乐版权），以及诸如“柠檬币”之类的奇特品种。\n\
  \n## 加密货币的本质\n\n加密货币是原生数字资产，基于某种形式的加密经济模型，该模型通过纳入激励与惩罚机制，在网络中的无关参与者之间建立共识。\n\n`安全性`、`稀缺性`、`激励`、`惩罚`、`共识`、`用途`、`网络效应`、`反审查`、`去中心化`、`账本不可篡改性`。\n\
  \n这些是基于区块链技术的开放去中心化共识协议的真正加密货币的属性。\n\n基本上没有理由构建一种资产支持的加密货币。它是没用的。\n\n**来源：** Aleksandar\
  \ Svetski 于 Medium 2018\n(来源链接：`https://hackernoon.com/asset-backed-cryptos`)\n\n\
  据最新统计，全球有 4000 多种加密货币在 33000 多个市场进行交易（Coinmarketcap – 2021 年 1 月），而且新人似乎并不稀缺，这只是酷产品设计的问题——“垃圾币（shitcoin）”一定带着某种华丽的修饰夺得了特等大奖。这几乎就像当代码人员决定挖掘某种特种的新币时，现场有一支专业的品牌团队在支持一样。\n\
  \n## 法定货币与财务影响\n\n另一个需要考虑的关键点是加密货币是否为“法定货币”，因为这对金融、银行领域以及全球经济和贸易具有深远的影响。\n\n“法定货币”一词有许多定义，但以下是最具描述性的一个：\n\
  \n> 在法律上有效用于支付债务的货币，且在提供时必须被接受。\n> *来源：韦氏-韦伯英语词典*\n\n那么，资产支持型加密货币处于什么位置呢？官方上来说，哪里都不是。\n\
  \n除非某种货币或代币被政府接受（或支持），否则它就不是“法定货币”，而根据 `Ethereum` 上智能合约条款的一种遥不可及的“法律主张”。\n\n换句话说，在发生任何纠纷时，与货币或代币相关的索赔只能在法院进行。这本身就是一个多方面的挑战，因为去中心化货币或代币是“无国界的”，也就是说，它只存在于区块链协议之上，而该协议极可能是\
  \ `Ethereum`。问题在于，适用哪个法院或司法管辖区。\n\n也许正因如此，`Bitcoin` 及其 4000 多个克隆币像海啸一样涌入市场，法院没有救济，也没有中央银行控制，更没有银行、经纪人或中间人，只有交易的双方对交换的公平价值达成一致。\n\
  \n资产支持型加密货币的疯狂——甚至是高尚——的想法都由于这一前提下失败了，因为没有人可以负责，即使有责任，也没有地方可以获得保障的索赔。\n\n即使由于某种奇怪的现实原因，有人对\
  \ `Bitcoin` 拥有索赔权，他也无法前往 `Mt. Gox` 或全球任何交易所来主张其权利或没收资产以满足其索赔。\n\n“中本聪（Satoshi Nakamoto）——即使他真的存在——也不能对\
  \ `Bitcoin` 负责。是激励与惩罚的 `Bitcoin` 协议在它的参与者之间创造了共识，即 `Bitcoin` 矿工们之间”。\n\n## 估值与执行的挑战\n\
  \n即使某种货币或代币由资产支持，那么该资产的公平价值是多少？由谁来决定该价值？当资产（如黄金、石油或房地产）的价值波动时会发生什么？问题没完没了，而解决方案更少。\n\
  \n“佩特罗（Petro）”是一个不稳定的政府根据其国家最珍贵的资源（石油）的基础价值发行货币的极差尝试。即使“佩特罗”有主权政府（委内瑞拉）的支持，它在各个方面都失败了，成为了全世界的笑柄，并成为加密货币爱好者和学者们讨论的话题。\n\
  \n### 房地产与商品支持\n\n由房地产——即物理物业——支持的货币面临着更大的挑战。谁将去法院索赔？适用哪个法院或司法管辖区？谁来评估物业价值？索赔如何具有执行力？在资产成功出售的情况下，谁将是受益者？\n\
  \n对于商品支持的加密货币，情况变得更加复杂。某些货币声称每一枚硬币都由真实的黄金支持，这听起来很棒。但从实际角度来看，谁来支付那些真实的黄金？在哪里收集它？或者将将其交付到何处？如何证明合法所有权是下一个问题，毕竟所有的硬币——作为交易的一部分——都是虚拟的，而黄金是物理的。\n\
  \n在此时，必须有人或某些机构进行调解，而这与去中心化加密货币世界所代表的一切背道而驰。\n\n此外，需求的突然激增可能会超过资产支持加密货币中特定商品（黄金、银、钻石等）的供应。\n\
  \n想象一下，如果一种资产支持的加密货币由黄金支持，这种特定的加密货币经历了类似于 `Bitcoin` 的飞速增长，那么如果出现突然从 `Bitcoin` 转向黄金“避风港”的逃潮，可能没有足够的物理黄金来满足对黄金的需求激增。\n\
  \n这确实发生在 1971 年 8 月 15 日，当时理查德·尼克松总统暂停了美元兑换黄金的规定，借此有效地结束了布雷顿森林体系。世界震惊了，特别是法国人并没有对此掉以轻，当时的法国总统夏尔·的高高\
  \ 实际上派遣了一艘法国军舰进入纽约港，要求美国联邦储备银行交出其黄金储备，以交换法国的美元储备。\n\n## CBDC – 中央银行数字货币\n\n由政府发行的加密货币的概念正在全球许多国家被考虑，特别是中国、俄罗斯、瑞典甚至欧盟。全球范围内的银行和金融机构也计划推出自己的货币。\n\
  \n“J 币（J-coin）”本应由瑞穗金融集团（Mizuho Financial Group）和日本邮政银行领导的日本银行联盟提出的一种新型国家数字货币，原定于东京\
  \ 2020 年奥运会同步发布，但由于新冠肺炎肺炎，并未发生。\n\n爱沙尼亚也计划通过 `ICO`（代币首次发行）推出自己的名为“爱币（Estcoin）”的政府支持加密货币，但这一想法遭到了来自欧盟的反对，随后被取消。\n\
  \n瑞典在成为世界上第一个无现金国家的目标方面处于领先。现在，超过 90% 的支付是使用信用卡或银行卡进行的数字支付。在瑞典的许多商店，甚至贴着“不接受现金”的标牌，这对于瑞典人来说很常见，但对访问的游客来说通常是一个巨大的惊喜。\n\
  \n\n\n\n\n`Riksbank`（瑞典中央银行——世界上首个且最老的中央银行）计划发行一种名为 `E-krona` 的电子货币，其“并非为了取代现金，而是作为现金的补充”。货币政策和金融稳定是瑞典政府和中央银行仍在研究的关键问题，此外还包括国家保障的现金数字补充。\n\
  \n在这一点上，电子货币与主权国家发行的数字货币有着明显的区别。前者是现金的“数字补充”，而像主权币之类的数字货币极有可能是基于区块链技术发行的数字货币。\n\n\
  ### SDC – 主权数字货币\n\n在这种背景下，`sovereign`（主权）一词被用来代替 `national`（国家），因为在欧盟决定并由欧洲央行发行数字`Euro`的假设情况下，这将是\
  \ 27 个国家政府之间的协议和共识。\n\n俄罗斯在这一方面占据了先发优势，尽管俄罗斯总统普京曾一度呼吁在俄罗斯境内全面禁止所有加密货币，但他正式宣布俄罗斯将发行自己的`CryptoRuble`（加密卢布），这种货币无法被“挖矿”，并将由俄罗斯当局发行和控制。目前这尚未实现。\n\
  \n普京总统曾表示：\n\n```\n\"这目前是中央银行的特权，到目前为止中央银行拥有足够的权限。然而，从广总体来说，未来绝对需要立法监管，”\n```\n\n\
  ```\n\"众所周知，加密货币没有任何东西支撑。它不能作为价值存储手段。它背后没有物质贵品，也没有任何东西保障，它在某种程度和某些情况下可以作为结算媒介。这种操作既快速又高效。\"\
  \n```\n\n来源：塔斯斯新闻社\n\n在全球范围内，经济学家、银行家、商业领袖、政治人物、政府、金融监管机构和中央银行正在讨论和思考如何分类和监管加密货币，甚至完全禁止这些货币。\n\
  \n正如任何新技术的出现一样，总会有倾向于现状的怀疑者、批评者和质疑者。比特币花费了近 10 年才成为主流，而现在全球已有 4000 多种加密货币被并在并在加密货币交易所交易。\n\
  \n根据 `CoinMarketCap` 提供的最新数据（2021 年 2 月），加密货币的当前市值达到了令人震惊的 1.5 万亿美元——其中比特币占据了 60%\
  \ 的主导市场份额——其余部分由全球 33000 多个市场交易的 4000 多种加密货币共享。\n\n毫无疑问，加密货币已经获得主流认可并将会留存，政府和中央银行以“中央银行数字货币”（CBDC）的形式发行自己的加密货币只是时间问题，这些货币将是“法定法货币”、稳定的的，并获得发行国家或联盟（如欧盟）的支持。\n\
  \n“数字能力匮乏”的国家将在全球货币体系中后，该体系在不久的将来将基于区块链技术和互联网 3.0 —— 价值互联网进行数字化的价值交换。\n\n### 量子货币\n\
  \n“量子货币是一种加密协议，其中造币厂可以产生一种量子态，其他人无法复制该状态，且任何人（拥有量子计算机的人）都可以验证该状态源自造币厂”\n\n**引用参考：**\
  \ Farhi, Edward & Gosset, David & Hassidim, Avinatan.\n\n*(注：原文中包含大量重复的段落，我已根据格式规则处理了所提供的唯一内容。)*\n\
  \n\n\n\n\nhttps://www.visualcapitalist.com/the-50-most-visited-websites-in-the-world/\n\
  \n# 社交媒体旋涡\n\n2020 年，`Facebook` 突破了 28 亿用户的基准。\n\n如果 `Facebook` 是一个国家，它将是世界上最大的国家，而且其用户增长仍然不可阻挡。\n\
  \n在征服了世界大部分地区后，`Facebook` 与 `Google` 以及其他全球科技公司现在将目标对准非洲以及世界边缘地区，那里的互联网和/或移动覆盖不足或没有。\n\
  \n解决方案是——利用飞气球发射免费互联网并获取用户参与——通过提供廉价智能手机并结合银行应用程序来实现。\n\n在我们的岸边，移动和社交媒体已经席卷全球。\n\
  \n曾经是极客们的兼职活动，现在已成为每个拥有智能手机的人的“必修课”。\n\n毕竟，如果一个人在社交媒体上无法被追溯，你又怎么信任他呢？\n\n# 情绪反复的千禧一代\n\
  \n技术对商业和整个社会产生了深远影响。\n\n新一代的千禧一代倾向于通过智能手机进行交流，而不是面对面接触。后者仍然常见，但如今更常见的情况是，人们交流时一只耳朵听着，另一只手拿着智能手机查看电子邮件和社交媒体帖子。这种数字依赖在年轻人中泛滥，并正向成年人扩散。\n\
  \n## 为什么？\n\n因为智能手机将所有的信息和实用工具（`apps`）都整合在一个口袋大小的设备中，可以随时随地访问。\n\n能够 24/7 访问任何信息既有优势也有劣势。由于担心错过新闻和有趣的帖子，大多数人会将智能手机放在手触手可及的地方，最好靠近电源插座和有\
  \ `Wi-Fi` 的地方。\n\n缺点是，生活似乎围绕着智能手机 `apps` 和社交媒体帖子演变。千禧一代过于忙于他们的智能手机，以至于有时会错过生活以及生活所提供的所有美好。\n\
  \n持续在线会导致躁不安和压力，这两个因素都会影响情绪和表现。\n\n仅仅让所有信息触手可及是不够的；它们必须能够万无一失地可用。\n\n# UX – 终极差异化因素\n\
  \n数字技术专家认为，在竞争拥挤的互联网上，用户体验和参与度是终极的差异化因素。交互式数字媒体平台，如电脑、笔记本电脑、平板电脑、智能手机以及最近的智能手表——后者正以光速不断创造全新的功能性\
  \ `apps` 世界——是数字格局快速扩张的关键。\n\n最成功的 `apps` 是那些具有卓越用户体验设计和用户界面布局的程序。\n\n`Apps` 必须易于使用，且操作起来必须直观。`Amazon`、`Airbnb`、`Uber`\
  \ 是卓越 UX 设计的绝例，这些 `apps` 为上述科技巨头带来了巨大的利润。\n\n这些 `apps` 不仅易用，还让订购产品或服务变得非常简单，订单支付更加容易。\n\
  \n# 市场份额还是市场创造？\n\n平台经济使得创建一个全新的市场成为可能，而必必承担资产型基础设施的负担和费用。\n\n由于云存储，技术可以在全球提供，并允许极快地扩展到下一个水平。\n\
  \n`Apple`、`Amazon` 和 `阿里巴巴` 等科技巨头可以在全球提供其商品和服务，而不必像实体店那样在当地设有面面。他们可以选择旗舰店（如 `Apple`）或当地存储和分销中心。\n\
  \n\n\n\n科技巨头拥抱了新技术和平台经济的优势，使其在面对传统的基于资产的竞争对手时具有比较优势。\n\n可扩展的大型客户群比高端客户群更具优势。\n\n\
  大众是新的目标。\n\n# 传统银行业\n\n街头银行正面临来自挑战银行和`FinTech`（金融科技）带来的生存以来最大的挑战。2018 年，英国有 583\
  \ 家银行网点关闭，创下了记录，而这一记录在 2019 年再次被打破，估计 2018 和 2019 年总共关闭了 762 家网点。\n\n2020 年，由于疫情爆发及随后的封锁，银行网点的关闭数量无疑飙升，但在本文写作时（2020\
  \ 年 12 月），确切数字尚不清楚。\n\n受影响最大的是农村和低收入地区的银行网点，在面对在线和挑战银行的激烈竞争时，大银行正试图削减成本。\n\n英国银行和建筑合作协会面临着降低成本的压力，因此自\
  \ 1989 年以来，他们以每年 300 家的速度在全国范围内关闭实体银行网点。\n\n根据诺丁汉大学的数据，到 2020 年底，将仅剩下约 8000 家银行网点，与\
  \ 1989 年的 17831 家银行网点相比相形见��。\n\n银行网点的关闭不仅是英国的问题，也是全球性现象。\n\n这种下降的原因显而易见：越来越多的人进行网上银行，且大多数人是通过智能手机上的\
  \ App 完成的。\n\n对于老年人来说，这是最不受欢迎的，因为许多人甚至没有电脑或智能手机，即使有了，也不知道如何使用。\n\n这个问题引起了极大关注，立法者和活动人士正试图建立保护措施，以确保老年人和最脆弱的客户仍然可以使用面对面的银行服务。\n\
  \n其中一种解决方案是在邮局银行，它在全国范围内拥有令人瞩目的 11500 家网点。\n\n对于千禧一代来说，网上银行更方便，因此银行网点的关闭并不是他们他们。千禧一代担心的是银行收费/费用，而挑战银行恰恰提供了这些具有竞争力的银行收费（有些甚至是免费的），并通过用户友好的\
  \ App 和出色的客户支持提供卓越的客户体验。\n\n这一趋势不仅将持续，而且随着更多的挑战银行进入市场并开始以更低的成本提供更好的银行服务，这一趋势还将加速。\n\
  \n传统银行业将重蹈“马车”的覆辙，只有少数传统银行出于声望和怀旧的原因而存续。\n\n# PSD2\n\n《经济学人》将`PSD2`描述为欧洲银行业的一场“地震”。\n\
  \n事实确实如此。它将以前所未有的方式动摇银行业业。\n\n## 什么是`PSD2`？\n\n简单来说，如果客户给了明确同意，它将强制银行和金融机构通过`API`（应用程序接口）与其他获得许可的金融服务提供者共享客户账户信息。\n\
  \n`PSD2`背后的理念是向新进入者开放银行和金融行业，同时使其更具竞争力。\n\n在客户同意的情况下将客户账户开放给第三方——从根本上改变了全球零售银行业格局，特别是在欧洲，随着`PSD2`（修订后的《支付服务指令\
  \ 2》）的即将实施。\n\n“开放银行”有许多定义——取决于人们看到或读过的内容，它对不同的人显然意味着不同的含义。\n\n考虑到这一点，我们将开放银行定义为使用`APIs`（应用程序接口）在获得许可的情况下将消费者的财务数据开放给第三方，使这些公司能够创建并分发自己的金融产品。\n\
  \n四种趋势汇聚创造了开放银行的条件：\n\n1. **监管** - 新的监管条例（如`PSD2`）开启了开放银行时代。\n2. **创新** - 新技术，特别是智能设备和向即时支付的转变，正在为金融服务开辟新机会。\n\
  3. **消费者预期的变化** - 消费者对无缝体验的需求日益增加，全天候、多设备和 24/7 的服务已成为预期。\n4. **竞争** - 竞争压力，包括新入者的出现（如数字银行/neo-banks）以及现有银行推出自己的`API`门户。\n\
  \n在 2018 年 1 月 13 日，`PSD2`已成为每个欧盟成员国的国家法律，随后银行必须准备好立即且妥善的实施。\n\n来源：AT Kearney -\
  \ 金融服务的勇敢新世界\n\n金融服务、财富管理和保险将成为`PSD2`最大的受益者，因为他们能够通过`API`s 访问客户数据并直接向客户提供服务。对于客户来说，好处在于他们能够比较价格，并在必要时轻松地从一个切换到另一个。\n\
  \n# 近零边际成本\n\n像沃尔玛这样的资产型业务模式与亚马逊或阿里巴巴等科技巨头相比处于巨大的劣势。亚马逊的交易是在线，许多产品存储在云端（Kindle 书籍、电影），而沃尔玛拥有一个物理配送网络，供应\
  \ 11695 家“实体”商店。\n\n物理资产需要人，而人需要钱。另一方面，亚马逊利用先进的技术、云存储和货物的物理处理，人工参与减少到最低。这种在整个亚马逊业务模型中使用技术的策略导致了成本降低、收入增加，并创造了巨大的利润——2016\
  \ 年底在 1360 亿美元营收下实现了 7.49 亿美元的利润。\n\n平台经济的优势是许多的，“近零边际成本”概念是最重要的。边际成本定义为在吸收固定成本后生产额外单位商品或服务的成本。\n\
  \n当生产另一个商品或服务的额外成本与所获收入的比例微乎其微时，实现了近零边际成本。换句话之，收入越高，生产额外产品或服务的成本越低。科技世界中的典型例子是亚马逊、Airbnb\
  \ 和 Uber。\n\n在金融科技领域，数字财富平台、机器人投顾和挑战银行是平台经济和近零边际成本的冠军。\n\n# 人工智能与机器学习\n\n平台的力量只是金融行业构造性位移的开始。人工智能、机器学习和大数据分析将彻底改变金融行业，而金融科技将引领一个长期渴望现代化和传统基础设施技术进步的行业变革。\n\
  \n德意志银行老板 John Cryan 暗示，其全球范围内 97,000 名员工中可能有一半会失去工作。到目前为止，这家德国银行仅裁减了 2015 年宣布的五年重组计划中\
  \ 9,000 个职位中的 4,000 个。其员工执行的许多手动任务可能适合机器人和机器学习。\n\n\n\n\n在不知情的情况下，大多数消费者在日常生活中已经在使用人工智能和机器学习。\n\
  \n智能个人助手，如苹果的 `Siri`、亚马逊的 `Alexa` 和微软的 `Cortana` 是广为人知的日常工具，其用户参与度正在快速增长。\n\n为了进一步增加用户参与度并获得市场份额，三大科技巨头生产了\
  \ VCD（语音命令设备），如亚马逊的 `Echo`、谷歌的 `Home` 和苹果的 `HomePod`。\n\n随着消费者习惯在家里使用这些设备，提供的服务将呈指数级增长。\n\
  \n物联网——一个相互连接的物理设备网络——将为电视、音响、冰箱、洗衣机、洗碗机以及家用供暖/温度控制单元等电器的语音控制操作增加另一个维度。\n\n## 什么是人工智能和机器学习？\n\
  \n人工智能是先进技术的集合，允许机器能够感知、理解、行动和学习。\n来源：埃森（Accenture）\n\n机器学习是一种数据分析方法，它可以实现分析模型的自动化构建。通过从数据中迭代学习的算法，机器学习允许计算机在不需要被显式编程去哪里寻找的情况下，发现隐藏的见解。\n\
  来源：SAS\n\n逐步采用这些新技术将提高所创造的效率并使生活变得更轻松，即在不断增加的工作量和信息负载中高效利用时间。\n\n## 大数据分析\n\n大数据分析的定义是检查大型且多样化的数据集（包括结构化和非结构化数据——即大数据），以发现隐藏的模式、未知的相关性、市场趋势、客户偏好和其他有用信息，这些信息可以帮助组织做出更明智的商业决策。\n\
  来源：SearchBusiness Analytics\n\n大数据如此重要且富有价值，以至于被定义为数字时代的新淘金。\n\n从科技到 IT 行业，无数公司正在争夺大数据市场份额和领导地位，同时正在探索高效分析这些数据以寻找消费者行为中有价值线索的过程。\n\
  \n能够提取、分析和处理大数据，可以为消费者行为提供独特的见解，并可进一步用于预测性分析。\n\n在大数据分析出现之前，像 `Nielsen` 和 `Forrester`\
  \ 这样的机构的市场研究会为公司提供市场信息和消费者行为分析，使营销和销售部门能够以某种方式预测未来的消费者趋势。\n\n大数据分析彻底改变了分析消费者行为和预测趋势的过程，因为它整合了客户销售漏斗中显著更多的“触点”，并且不仅分析结构化数据，还分析非结构化数据，后者有时可以揭示令人惊讶的数据模式和客户洞察。\n\
  \n提前知道客户想要什么对于大企业来说是一个非常有利可图的提案。\n\n## 算法\n\n通过数据挖掘、分析以及使用人工智能和机器学习提取的信息可以通过算法进行处理，以创建有效的解决问题手段和解决方案，从而造福用户。\n\
  \n在日常使用中，算法为复杂任务提供了捷径和效率，而用户甚至不知道后台运行着这些技术。\n\n每个平台都使用算法来增强用户体验，并为复杂的计算提供高效解决方案。\n\
  \n在 `FinTech` 领域，算法提供了解决方案并显著提高了 App 和在线应用程序的用户友好性。\n\n挑战银行、在线保险和数字财富管理——我们今天所知的\
  \ `FinTech` 先驱——通过使用算法获益巨大，因此相比于使用过时且低效 IT 基础设施的传统银行具有竞争优势。\n\n## 客户是王，但平台制定规则\n\
  \n科技巨头利用了平台所有的效率和利益。\n\n如果实施得当，平台经济可以带来用户体验。\n\n目前，`腾讯` 的市值为 `$7.2 万亿`，其次是 `阿里巴巴`\
  \ `$5.7 万亿`、`苹果` `$2 万亿`、`亚马逊` `$1.6 万亿`、`谷歌` `$1.4 万亿` 以及 `Facebook` `$7700 亿`（截至\
  \ 2021 年）。\n\n有传言且广泛预期 `Apple`、`Amazon`、`Google` 和 `Facebook` 等科技巨头可能会进入银行和金融服务，为其用户群提供工具。\n\
  \n科技金融服务在全球推出只是时间问题。对于平台用户来说，在线访问金融服务可以节省金钱精力。既然一切都可以通过用户熟悉的平台在线完成，为什么还要去银行网点存支票或从\
  \ `ATM` 取款呢？\n\n`阿里巴巴` 已经通过其支付子公司 `蚂蚁金`（及其在线支付平台 `支付宝`）进入了金融服务市场，该公司目前是全球最大的 `FinTech`\
  \ 公司，估值惊人的 `$2000 亿`（截至 2020 年 12 月）。与其他知名科技公司相比，这一数字是 `Airbnb` `$1000 亿` 市值的两倍，是\
  \ `Uber` `$700 亿` 估值的三倍。\n\n![Visual Capitalist - The Business of AirBnB - 13-02-21.png](img/Image00009.jpg)\n\
  \n版权 2021 – Visual Capitalist\n\nhttps://www.visualcapitalist.com/the-business-of-airbnb-by-the-numbers/\n\
  \n虽然龙可能是典型的中国符号——权力、力量和幸运的象征——但这个国家可能不得不开始感谢一只强大的蚂蚁——`蚂蚁金`，因为它在电子商务和金融科技领域取得了了巨大成功。但是，`蚂蚁金`\
  \ 到底是什么？\n\n`蚂蚁金` 及其在线支付平台 `支付宝` 是 `阿里巴巴` 的金融服务部门。`阿里巴巴`是中国顶尖的电子商务公司，在 2016 年发布了非常令人深刻的业绩：收入达\
  \ `$156.亿`，`EBITDA` 为 `$81 亿`，分别比去年增长了 33%和 28%。此外，`蚂蚁金` 控制了中国 70%的移动支付市场。\n\n\n\
  \n\n\n截至今日，支付宝已是`蚂蚁金融`业务的核心部分，但该公司正迅速向其他领域扩张，包括资产管理和贷款。为了在金融科技业务的这些不同分支实现增长，该公司正建立在一个公司梦以求的最稳固的基础之上：4.5\
  \ 亿用户的用户基数，其中许多人使用支付宝支付阿里巴巴每天处理的 1.75 亿笔交易中的大部分份额。\n\n来源：BBVA\n\n银行、保险和财富管理是正受到金融科技颠覆的关键金融行业，其风险极高。\n\
  \nRevolut —— 一家总部位于伦敦的数字银行已拥有超过 300 万平台用户，并计划通过在整个欧洲、美国和远远（特别是澳大利亚）的快速扩张计划，在 2019\
  \ 年底之前获得 500 万客户。\n\n如 `Betterment`（资产管理规模 2200 亿美元）、`Schwab Intelligent Portfolios`（资产管理规模\
  \ 450 亿美元）和 `Wealthfront`（资产管理规模 200 亿美元）等机器人投顾巨头已经征服了财富管理行业。\n\n通过使用 `ETF`（交易型基金）而非传统经纪商使用的个人财务顾问来提供更廉价的财富管理服务，机器人投顾不仅在价格上竞争，在服务上也具有竞争力。\n\
  \n在这种背景下，服务并非指使用个人财务顾问，而是指对其客户群及其财务的支持。通过使用算法等最新技术，机器人投顾为客户提供了金融行业专业人士使用的工具。\n\n\
  投资组合再平衡、资产配置、风险管理、税务收割、养老金、`ISA`（个人储蓄账户）、`SRI`（社会责任投资）和可持续投资是根据居住地不同所提供的某些创新额外机器人投顾服务。\n\
  \n直到最近，财富管理仍然是少数那些可以存款 10,000 英镑或更多最低金额的富人专属。\n\n机器人投顾在获取市场份额的过程中，通过将最低存款要求降低到仅需\
  \ 1,000 英镑，实现了财富管理的民主化。\n\n诸如“零机器人”等新入者甚至接受仅 1 英镑的最低存款，并提供零费用服务，意在获取市场份额。游戏规则已经发生了改变，通过利用平台经济实现了财富管理的民主化。\n\
  \n金融科技公司相对于 `Amazon` 和 `阿里巴巴` 等大型科技平台甚至具有更好的比较优势，因为金融科技平台受益于“纯”平台经济，一切都存储在云端并交易（除了银行卡、借记卡或信用卡的物理运输外），而零售商大部分是在线上的（所有购买交易都在那里），但仍然包含将货物和产品实际运送客户的物理环节。\n\
  \n传统银行和经纪商看到其客户群萎缩，正在追赶金融科技行业，但在服务和技术方面仍然落后。\n\n金融科技 —— 即金融技术的最佳体现 —— 正通过其创新的金融产品、卓越的用户体验以及通过为终端用户开发的平台实现的极速执行，针对大众市场。\n\
  \n随着 `PSD2` 和 `MiFID2` 指令的实施，平台力量将得到加强，这些指令将强制传统银行向第三方开放其客户数据“金库”（通过 `API`），并对在欧盟境内运营的金融服务公司实施广泛的监管变化，这将对全球产生深远影响。\n\
  \n金融行业的数字化颠覆最初可能会面临阻力，但从远来看，其收益将远大于银行和金融服务公司必须克服的任何短期负面影响。\n\n最终，受益最多的是消费者，而银行和金融行业本身必须适应、参与并推进正在以加速速度在全球范围内发生的数字化颠覆。\n\
  \n# 第六章：App、dApp 与去中心化\n\n## 去中心化应用\n\n我们今天所知的互联网由 `Apple` 和 `Google` 通过其浏览器“Safari”和“Chrome”控制，且\
  \ `Amazon` 和 `Facebook` 都从其客户/用户处聚合数据。\n\n互联网用户可能没有意识到，所有的互联网搜索和访问的网站都会永久记录。还有少数其他互联网浏览器如“Firefox”，它们与科技巨头是“独立”的，但互联网上的所有数据都会被记录并永久存储。\n\
  \n数据被收集和存储的原因是因为它是新石油，并为今天的科技巨头们创造了巨额利润。\n\n`Google` 特别精通了在其搜索引擎上销售广告的艺术，其次是 `Facebook`。两者都通过广告创造了超过\
  \ 90% 的收入，同时已确立了自己作为发布任何新服务或产品的首选平台。\n\n`Facebook` 更进了一步，它对其用户提供“微精准定位”。广告商，特别是政党，可以通过选择\
  \ `Facebook` 仪表板提供的详细标准，精确锁定他们想要定位的用户。\n\n在支付未的额外费用后，`Facebook` 将提供内部支持，让其客户可以使用无数功能对其用户进行微精准定位。最近的美国竞选活动过度使用\
  \ `Facebook` 服务，以至于他们成功在潜意识中影响了美国不同地区的选民。\n\n结合 `Twitter`，据说几次美国总统大选是通过社交媒体赢得的。关于伦理的讨论一直处于许多政治辩论的前沿，但社交媒体的力量已再无法被低估了。只要价格合适，政治结果就可以成为可能。\n\
  \n去中心化应用，简称 `dApps`，是基于区块链协议的开源、去中心化、分布式、透明、有激励且韧性的应用程序。\n\n最重要的是理解，区块链分布式账本是开源的，不由任何中心化实体存储或由单一公司管理。\n\
  \n`dApps` 的发展仍处于婴儿阶段，并具有以下特征：\n\n1. 开源 —— 由自治性治理，仅通过共识允许更改\n2. 去中心化 —— 所有代码和交易记录都存储在公共记录中\n\
  3. 有激励 —— 区块验证通过加密令牌奖励进行激励\n4. 协议 —— 社区必须就如何使用“工作量证明”、“权益证明”或混合模式来证明加密算法达成一致\n\n\
  `Bitcoin` 是第一个 `dApp`，其他成功的 `Ethereum` `dApps` 包括 `Golem`、`Augur` 和 `Melonport`。\n\
  \n由于这些独特的特性，`dApps` 有潜力重塑未来的技术格局，并开启全新的去中心化应用宇宙。\n\n一个 `dApp` 的成功案例是“Brave”浏览器，它在保护隐私的同时阻止了不想要的广告。它不存储或出售浏览数据，作为一种选项，`Brave`\
  \ 浏览器用户可以通过访问最频繁的网站获得匿名奖励，这与目前在 `Google Chrome` 上的浏览体验相比发生了范式转移。\n\n## 智能合约\n\n\n\
  \n\n\n智能合约的概念最早于 1994 年由密码学家和计算机科学家 `Nick Szabo` 提出，这远在区块链出现之前的很久。\n\n尽管在当时，智能合约的概念被认为是开创性的，但它并没有进一步发展。\n\
  \n2015 年，22 岁的天才 `Vitalik Buterin` 在他的 `Ethereum` 平台上重新创造了智能合约。值得注意的是，`Bitcoin`\
  \ 是第一个支持基础智能合约的系统，从价值可以在网络中从一个人转移到另一个人的意义上。这些智能合约允许以透明的方式交换任何有价值的物品，而无需任何中间人的参与。\n\
  \n想象这样一个世界：自动执行的合约允许以透明且无冲突的方式进行货币、股票、财产或其他任何有价值物品的交换，最重要的是，不需要任何中间人或第三方。\n\n`Ethereum`\
  \ 智能合约正是做这一点，而且这些合约的发展正在飞速增长。在现实世界中，合同概述了关系的条款和条件，且这通常受法律保护。智能合约使用加密代码创建，这些代码完全按照其创建者（即双方）设定的规则执行。\n\
  \n## 玻璃房与隐形灵魂\n\n随着“物联网”（`IoT`）的到来，通过 `Bluetooth`、`Wi-Fi` 和互联网连接家电设备和设备，使得数据能够无缝地交换，我们最后的隐私防线将永远消失。\n\
  \n“物联网”是无不包的，所有互联物品如家用恒温器、冰箱、智能电视等都会收集数据并在无人知情的情况下上传到互联网。通过在我们所有的家电设备和设备中嵌入芯片、传感器和执行器，数据和信息将被持续且随机地收集，然后这些数据将传输给家电设备制造商或其他任何人，无论他们是谁。\n\
  \n令人绝对难以相信的是，如此规模的隐私泄露竟然能被我们作为我们基本“隐私权”的少数法律所容忍。住在未来的 `IoT` 房子里，将就像住在玻璃房里，一切都将由任何访问从我们房子发出的\
  \ `IoT` 数据的人看到并观察，这确实是一个非常可怕的前景。我们的生活将成为大数据的一部分，我们的灵魂对外部世界将是隐形的。机器将控制我们的生活，个人将仅仅变成充满数字的世界中的一个数字。\n\
  \n> “大数据是一个研究如何分析、系统地从中提取信息，或以处理传统数据处理应用程序软件无法处理的大规模或复杂数据集的领域”\n\n> 来源：维基百科\n\n\
  在我们家之外，私有数据从我们可以想象的每一个点向我们收集。当我们使用智能手机、智能手表、家用电脑、平板电脑、虚拟助手、应用程序、信用卡，以及每一次 `Facebook`\
  \ 点赞、`Twitter` 帖子、`Instagram` 分享、`Google` 搜索、自拍或任何活动。\n\n有人说这是“大哥”在监视我们，或者也许没那么阴险，无论如何，我们所知的隐私已不再存在。即使我们拔掉所有电源不再触碰手机，我们也会通过与朋友或任何“连接”到隐喻“社交媒体网格/图谱”的人关联而变得“可见”。通过关联，使用人脸识别，任何拍摄并上传的照片都会让我们再次“可见”。更不用说满城都是摄像头正追踪着我们的一举一动。不幸的是，情况还会变得更糟。\n\
  \n这种毫不廉耻的数据收集的首要驱动力是巨大的利润。通过能够分析我们的每一个动作，各种公司可以精细调整他们的产品供应。销售无法保证，但可能性会显著增加。除了隐性数据收集，“数据经纪人”将他们海量的信息出售给出价最高者，现在甚至有一个巨大的“数据”交易市场。感兴趣的买家与数据本身一样多样；可能包括零售、医疗、政治，或仅仅是以需要进行公民普查为由政府。\n\
  \n在积极方面，在不同“触点”收集的数据可以提供其他方式无法看到的洞察。大数据与 5 个关键概念相关：数量、多样性、速度、真实性和价值。真实性专门关于捕获的数据中含有多少“噪声”，这至关重要，因为数据将由算法处理，需要过滤掉“噪声”。大数据的核心在于统计效力、用户行为和预测分析。\n\
  \n使用算法、预测分析和行为心理学可以揭示异常或不寻常的模式。在医学领域，它可以提醒即将发生的疾病或痛苦，然后可以采取行动防止这种情况发生。不幸的是，情况并不止于此。我们的数据变成了可以随意买卖的商品，而我们甚至不知道哪些数据被收集和汇总了。\n\
  \n`dApps` 将扭转这种毫不廉耻的私有数据捕捉，我们将能够控制那些在我们的不知情且违背意愿的情况下被收集的数据。当然，我们无法阻止整个数据收集过程，但我们确实能够减少被收集的数据数量和类型。没有人反对为了公共利益而收集数据，但显然，人都反对为了利润而收集影响个人隐私权的个人数据。隐私和全方位数据收集之间将存在一种微妙的平衡，但这将被证明是极具挑战性的。我们所处的世界——从所有意义上来说——已经从人类变成了机器，我们只是全球监控和控制系统的一部分。\n\
  \n## 融合\n\n> “人工智能、区块链与物联网的融合”\n\n> 来源：`Jamie Burke` – 首席执行官兼创始人 - `Outlier Ventures`\n\
  \n这篇理论最初由伦敦的 `Outlier Ventures` 开发，构其投资策略的基础。在他们的创业组合中，有一家名为 `Fetch.AI` 的公司，它自称为一个“去中心化的数字世界”，在这里自主软件代理执行“有用的经济工作”，利用“自主经济代理”。\n\
  \n在不涉及细节的情况下，`Fetch` 的最终目标是开发可以在不受干预的情况下独立运行的“盈利实体”。`Fetch` 的计划非常有野心，但只需几年后，融合生态系统将变得功能完善，融合网络也将开始运行。这将是经济和社交活动的新时代，网络将是开源、分布式、去中心化、自动化和代币化的。\n\
  \n`Outlier Ventures` 展望了一个融合的未来，数字景观将由数字技术、加密和代币组成，导致前所未有的复杂的经济动态。这一切听起来可能很有未来，但它已经在这里了。加密货币、加密资产和加密消费品可用，融合的到来就在咫尺。一个机器人、机器学习和人工智能将对我们的生活和社会本身产生深远影响的地方。\n\
  \n去中心化将在未来发挥关键作用，因为越来越多的人成为自由主义者，并寻求一个不受审查且由自我主权身份占据中心地位的社会。一个建立在共识、平等和平均权利之上的社会。\n\
  \n华为 5G 与三星 6G “数字孪生”\n\n\n\n\n随着通信世界从“蜗递”和固定电话转变为电子化和移动化，通信速度呈指数级增长。在当前 3G/4G 的部署和覆盖阶段，我们已经有了足够的“速度”在设备之间传输数据。除非在出门时能从智能手机上立即下载最新的\
  \ Netflix 电影是迫在眉睫或至关重要的，否则在世界上大多数发达地区，3G/4G 数据传输能力和速度甚至足够在旅途中进行视频通话、FaceTime 或 Zoom\
  \ 会议。这便产生了一个问题：一旦 5G 实现全球部署和广泛的网络覆盖，我们为什么还需要超快速（意味着快 100 倍或更多）的数据传输能力呢？\n\n简短的回答是，对于日常的在线通信和对话，我们绝对不需要\
  \ `5G`，目前的移动网络就足够了。\n\n科技界和政府的看法有所不同。能够超快速传输数据具有独特的优势。对于科技界来说，这意味着能够连接设备——无论是智能手机、汽车还是冰箱——以实现这些不同设备之间的“交互”，无论给出的理由是多么有用、愚蠢或廉价。对于政府来说，它是终极的间谍工具。数据可以在“眨眼之间”从你的智能手机中提取，而无人察觉。甚至是整个相库和视频——这些“数据密集型”且消耗大量传输比特和字节的内容——也可以在几秒钟内下载或上传，最终，一旦移动网络能够处理这种难以想象的速度和容量，它们可以在微秒甚至纳秒内完成。\n\
  \n对于普通消费者，由于 `5G` 部署背后的真实原因，更快的上传/下载可能很有趣，比如可以在几秒内向智能手机上下载整部 Netflix 电影。对于设备之间的连接——被营销为“物联网”——`5G`\
  \ 起初是“大材小用”的，直到世界上的所有电子设备都互联起来。那么问题是，谁会在乎你的冰箱、洗碗机和洗衣机是否可以通信（即交换数据）呢？除了这些设备的生产者以及背后的你自己的政府，没人会在乎。\n\
  \n2020 年见证了中美之间升级的科技战的开始，双方在许多技术前线展开展开决斗，而 `5G` 是全球最具争议的“技术断层”。在全球科技之战的核心是 `华为`，它是一个极其重要的棋子。美国国会不仅禁止\
  \ `华为` 在美国供应 `5G` 设备和组件，还秘密地“说服”了它的“特殊关系伙伴”——英国也禁止 `华为`。事实证明，英国屈从了，代价是浪费了数十亿美元——目前估计超过\
  \ 70 亿英镑——并导致英国境内 `5G` 覆盖的推出估计延迟了 3 年。甚至欧盟也在考虑对 `华为` 实施全面禁令，德国和法国带头说服成员国在全欧洲采取全面禁令。印度在旁观，正利用其自己的科技行业以及通过印度亿万翁穆克什·安姆巴尼（Mukesh\
  \ Ambani）通过其集团“信实工业”和 `Jio` 网络开发他们自己的 `5G` 网络。再次，为了这个梦寐以求的“5G 之王”头衔，数十亿美元在其中博弈。如果超快速的\
  \ `5G` 还不够，韩国的 `三星` 已经发布了关于超快速 `6G` 的白皮书（日期为 2020 年 7 月 15 日），这意味着比 `5G` 快 50 倍，而且它已经比计划提前两年。只需在\
  \ Google 上搜索“Samsung 6G”或点击下方链接阅读其全部信息：\n\n[`news.samsung.com/uk/samsungs-6g-white-paper-lays-out-the-companys-vision-for-the-next-generation-of-communications-technology`](https://news.samsung.com/uk/samsungs-6g-white-paper-lays-out-the-companys-vision-for-the-next-generation-of-communications-technology)\n\
  \n显然，将你的智能手机与汽车、电视或家里任何实用的电子设备相结合可以提供某种舒适，甚至增加人的懒惰，但这真的并不是必要或本质的，仅仅是奢侈。\n\n## 量子霸权与同步共舞\n\
  \n要解释和理解量子计算非常困难。\n\n它是物理学与计算机交叉区域的计算。\n\n它是叠加与纠缠。\n\n它是一种计算状态——`qubits`——在这里数字\
  \ 1 和 0 是合一的。\n\n它是量子纠缠，其中粒子正在“同步共舞”。\n\n它是几秒内的数十亿次计算机计算，最终是纳秒级。\n\n这简直是不可思议。\n\n\
  然而，它将改变我们所知的世界中几乎的一切事物。\n\n根据 NASA 科学者的说法，“量子”被定义为“任何物理实体与另一个物体相互作用所需的最小量，通常指能量或物质的最小单位”。\n\
  \n量子计算如此强大，它将使每一个密码都失效，因为凭借每秒运行数十亿次计算或其分数的计算能力，它可以在几分之一秒内破解任何加密代码。\n\n但就像早期的计算机主机在计算的最初开发阶段占据了大学的整个楼层一样，量子计算只能在受控环境下运行，核心单元（设备中的\
  \ `cubits`）需要使用“稀释制冷”冷却到 1 开尔文以下（-272.15 摄氏度）。随着时间的推移，量子计算机将变得更小，在此之前，计算机主机将能够接入量子计算网。\n\
  \n甚至有关于“量子霸权”的讨论，Google 早在 2017 年就宣布它将实现这一点，但当时并没有发生，一些科学家甚至说认为是不可能的。然而，在 2019 年\
  \ 10 月，Google 与 `NASA`（美国国家航空航天局）以及橡树岭国家实验室合作展示了实现量子霸权的能力，即在几秒内完成通常需要地球上最先进超级计算机花费数千年的计算。Google\
  \ 使用了与 `Google AI Quantum` 合作开发的 `Sycamore` 处理器，据报道实现了“量子霸权”里程碑，计算速度比被认为世界上最快的计算机\
  \ `Summit` 快 300 万倍。2019 年 10 月 23 日，量子霸权最终被确认为，以下链接是 NASA 向世界的公告：\n\n[`www.nasa.gov/feature/ames/quantum-supremacy/`](https://www.nasa.gov/feature/ames/quantum-supremacy/)\n\
  \n# 第七章 代币 - 金融宝石\n\n### ICO 热潮\n\n“ICO 热潮的唯一规则是贪婪和信息不对称的最大化”\n\n引自：Jamie Burke\
  \ - Outlier Ventures\n\n\n\n\n# ICO – 代币首次发行\n\nICO – 代币首次发行（Initial Coin Offerings）是利用区块链和智能合约进行众筹投资的首次迭代，在\
  \ 2017 年和 2018 年上半年经历了了极短的巅峰时期，随后在当年年底彻底崩盘。人们提出了许多原因，但最引人注目的是“骗局”，因为随着那些野心勃勃的创业者和创始人而来的，投机者和骗子也随之而来。这些坏徒不惜成本地开发了一套平滑的营销和推广活动，偶尔还会获得\
  \ `Floyd Mayweather`、`Manny Pacquiao`、`Paris Hilton`、`Cristiano Ronaldo` 和 `Lionel\
  \ Messi` 等顶级巨星的背书。为了确保融资成功，他们在全球范围内通过代币“空投”招募“赏金猎人”，以确保社交媒体的参与度，希望 ICO 项目获得声誉并吸引投资者的兴趣，实现病毒式传播。\n\
  \n“拉高出出”（Pump & Dump）计划在 ICO 行业盛盛不，最终导致其在 2018 年底过早终结。现在的 ICO 已非常不受欢迎，投资者正积极寻找新的机会，即涉及股权或证券代币与实用代币相结合的混合代币概念。这些混合投资方案提供了一定的安全性，因为证券代币根据其发行管辖区的不同受到金融监管的程度。此外，投资者还受益于参与项目股权、未来收益或利润共享业务模式的形式。\n\
  \n## 证券代币 – 众筹的新前沿\n\n除了 ICO 崩盘外，加密市场同步崩溃，使得本就困难的市场对于任何众投资者来说更具挑战性。\n\n从中吸取的教训是，因此现在几乎所有新的\
  \ ICO 发布通常都是股权和实用代币的混合体，并考虑了投资者的最大利益以及巨大的投资回报率（ROI）潜力。\n\n除了通过 `STO` 向投资者提供证券代币外，金融行业、监管机构和政府对\
  \ ICO 作为一种可能产生超额回报的投资工具的认知也发生了加速且显著的变化。\n\n即使大多数 ICO 都失败了——达到惊人的 90% 或以上——全球投资者社区仍然认为这些高风险/高收益项目具有巨大潜力，希望发现下一个“创业之星”，其成功轨迹可能与\
  \ `Google`、`Uber` 或 `Airbnb` 相似。\n\n参与众筹项目的欲望之所以增加，是因为项目启动之前就有获得海量用户的机会。兼任“Beta\
  \ 测试员”的众投资者是任何初创公司的终极梦想，这为混合 ICO/STO 项目在已经拥挤的天使和风投（VC）融资生态系统中注入了动力。\n\n另一方面，风投（VC）公司对整个全新的新的\
  \ ICO 融资系统持怀疑态度，一些公司接受了它，而另一些公司则断然拒绝参与任何形式的代币发行。\n\n天使投资人和 `VC` 习惯于种子轮和系列 `A/B/C/etc.`\
  \ 的传统融资模式，估值在其中起着至关重要的作用。\n\nICO、`STOs` 或任何混合模式遵循一种截然不同的模式；在非常短的时间内，基于大约 50 页的白皮书和路线图募集大量资金。几乎所有的\
  \ ICO 通常甚至没有可以展示的产品或平台，除非可能有一个 `MVP` 或演示版 App。对于投资者来说，在投资之前通常没有财务预测、可比指标（comps）或过往业绩可供参考，这使得\
  \ ICO 投资成为了一项高风险投资建议。\n\n这种“劣势”通过极高回报的承诺得到了补偿，其 `ROI` 范围在 10 倍到 100 倍之间，这在种子阶段的初创公司是前所未有的。后者遵循“增长”投资案例，在获得种子轮或后续投资之前，向早期投资者展示第一批“付费客户”或大量用户群。\n\
  \n在种子轮的最开始、项目甚至启动之前进行大规模投资的优势是，项目创始人可以专注于开发产品或服务，而不需要不断花费精力和寻找额外的投资者和后续投资资金。缺点是\
  \ 90% 或以上的失败率。\n\n对由才华创业者团队支持的稳健项目进行精调和平衡，可以产生最佳的 `ROI` 并显著降低风险因素。\n\n## 比特币狂潮与\
  \ ICO 热热背后的心理\n\n许多读者现在可能好奇 `Bitcoin` 与 ICO 热热之间有什么类比或联系，对此的快速回答是：ICO 可能看起来是“真实的”，但归根底只是一种“炒作”，意思是指看起来真实的事实际上并非如此。\n\
  \n“去中心化”和“大众包容”（这个世界的众投资者）的整个底层理念是 ICO 给人的印象，但实际上，它是“闭环”生态系统无意的群众参与，对于初创公司的所有权或收益没有任何权利或参与权。代币——简要定义为“数字权利”——是以“给予者”（即众投资者）的风险为代价用真实现金换取的。许多众投资者最终只收获了毫无价值的代币和空头承诺。\n\
  \n所有的 ICO 都是基于加密的，并将量化的代币发行与 `BTC`、`ETH` 以及许多其他加密货币（包括 `USD`、`EUR`、`GBP`、`JPY` 等法币）进行固定兑换，这些货币广为人知且市值巨大，通常是世界十大加密货币。\n\
  \n`Bitcoin` 脱颖而出，由于它目前已具有“传奇性”地位，是世界上第一个直接与变革性的 `Blockchain` 协议的的加密货币但它并不是 ICO 融资和代币经济的主要驱动力。\n\
  \n`Ethereum` 因为 `ERC20` “智能合约”概念而取得了巨大进展，正因如此，它是 ICO 中最常用的加密货币。\n\n“比特币没有任何货币政策和中央银行控制，它是纯粹的供需和稀缺性驱动。”\n\
  \n在 2017 年底，当 `Bitcoin` 从无名无升至令人震惊的高度并接近 20,000 美元的标准时，每个人都希望在 2017 年初它仅为 1000 美元时买入。\n\
  \n进一步追溯到 2010 年 3 月，当 `Bitcoin` 首次开始交易且价值仅为 0.003 美元——这是一分钱的碎片——在短短 8 年跨度内飙升至 20,000\
  \ 美元简直不可思议。\n\n让我们对买卖 1000 个比特币进行一个简单的计算：\n\n```\n比特币 价格–2010 年 3 月——买入 1000 x 0.003\
  \ = 3 美\n比特币 价格–2018 年 12 月——卖出 1000 x 20,000 = 20,000,000 美\n比特币 价格–2018 年 12 月——卖出\
  \ 10,000 x 20,000 = 200,000,000 美\n比特币 价格–2018 年 12 月——卖出 100,000 x 20,000 = 2,000,000,000\
  \ 美\n```\n\n（为了清晰和易于理解，所有数字均向上取整）\n\n对于任何在 2010 年以仅 3 美元（一杯咖啡的价格）有机会购买 1000 个比特币的人来说，在\
  \ 2018 年 12 月他们将成为这令人疯狂的 2000 万美元的幸运主人（更不用说上述提到的 20 亿美元比特币价值计算了）。\n\n今天，当 1 个比特币在\
  \ 2021 年 2 月 16 日突破 5 万美元大关时，该金额将是令人眩晕的 5000 万美元。\n\n谈论事后见效应和充分发挥的恐恐症……\n\n\n\n\n\
  \n整个核心理念是，你可以以“忽略不计的成本”购买任何代币，远低于单位 1 加上几位小数的价格，这样它就能拥有与比特币世界常用表达“比特币登月（Bitcoin\
  \ to the moon）”相同的上涨轨迹。\n\n而且在某种程度上，大多数 ICO 最初都足了这一前提取得了成功，那些与 `Bitcoin` 或 `Ether`\
  \ 以分数配对的代币，会变成 1 的倍数，并为早期投资者带来 `x10`、`x100` 甚至 `x1000` 倍甚至更多的惊人回报。唯一的限制就是天空。\n\n\
  然而，ICO 的狂盛宴并没有持续多久，而且通常在 ICO 结束后不久就消失了。随着炒作、热度以及代币的“拉高出货”消退，给代币持有者留下了毫无价值且且流动性极差的代币。让我们这些不幸的群体投资者称为“代币人（tokenites）”，他们正遭受着史诗级的加密货币宿醉。\n\
  \n但就像所有的宿醉一样，一旦派对开始，醉酒就会再次开始。在写作时（2021 年 2 月），第二波 ICO 浪潮正开始形成……\n\n## 加密货币沙皇与 SEC\
  \ 的权力\n\n### “我们是投资者的倡导者”\n\n`SEC` 保护投资者，促进证券市场的公平，并分享有关公司和投资专业人士的信息，帮助投资者做出明智决策并充满信心地投资。\n\
  \n来源：SEC 首页\n（来源链接：https://www.sec.gov/）\n\n令人生畏而又推崇的证券交易委员会——简称 `SEC` ——是美国联邦政府的一个独立机构，由一个委员会及其主席控制，该主席实际上独立于行政分支（即美国总统）的控制。\n\
  \n这意味着，虽然 `SEC` 在宪法上是行政部门的一员，但美国总统对该机构的权力是有限的，且只有通过国会通过的法律才能授予授权并定义 `SEC` 的宗旨。这赋予了\
  \ `SEC` 维护证券法和监管证券行业的首要且排他的责任，因此，它是提议或修订任何所有证券法律的最高权威。\n\n这既是好消息也是坏消息。美国总统无法指导 `SEC`\
  \ 的政策，在两党合作的国会层面，所有提议的法律和法规变更在进入国会并生效之前，必须经过多个委员会和子委员会的审查。\n\n### 与 ICO 和加密货币的关系\n\
  \n这变得很有问题，因为只有 `SEC` 能够改变构成证券的定义和标准。目前，`SEC` 对于如何处理 ICO、代币和加密货币仍然没有下定论，它仅仅在考虑如何处理整个加密货币行业，该行业的市值目前高达惊人的\
  \ 1.5 万亿美元（截至 2021 年 2 月），正在实现主流采用。\n\nICO 在很大程度上是无法统计的，因为除了募集的金额和到为止已发行的 ICO 总数（或其中已经破产的\
  \ 90%）之外，目前尚无任何财务记录。这在不久的未来确实可能变成非常严重的问题，因为有一个整个行业尚未被记录，更不用说全球数百万在世界各地二级市场交易所交易其\
  \ ICO 代币的参与者了，而且在许多情况下，他们大多遭受了巨额损失，而少数幸运的人则赚了巨额利润。\n\n`SEC` 主席 `Jay Clayton` 最近表示，当时几乎所有的\
  \ ICO——约 99%——都是证券，因为通过在二级市场交易所交易“实用型代币”，它们未能通过决定性的“豪威测试（Howey test）”，即投资者交易代币是为了获利。\n\
  \n### 豪威测试应该是决定因素吗？\n\n起初，这看起来是合逻辑的，因为 `SEC` 的存在是为了监管证券市场，并保护投资者免受证券行业坏人的侵害，或者在\
  \ ICO 的情况下，免受骗子和诈骗者的侵害。但这种方法让每个人陷入了尴尬境地。如果我们遵循 `Howey test` 规则，那么所有过去、现在和未来的 ICO\
  \ 都在违法并应该被关闭。这种情况已经发生在许多 ICO 和交易所身上，诉讼、传票和“停止终止”通知已在全国范围内的州级和联邦层面颁发并送达。与此同时，许多交易平台和交易所仍在竭力获得\
  \ `SEC` 授权，并完全符合相应的 `SEC` 规则和条例，这从任何意义上目的来说都是一个积极的进展。\n\n所有数字资产——硬币、代币和版权——都是为了存储或交易——读作“倒卖”——而获利的，因此应该被归类为“数字证券”并进行相应的监管。将数字资产留在“灰色地带”绝对是肯定的错误方法，并会误导不知情的投资者和市场参与者。\n\
  \n从所有数字资产被归类为证券的那一刻起，对于“实用型代币”可以例外，这些代币是真正的实用工具，仅用于生态系统或社区，其唯一目的是服务并使参与者受益。例如，书俱乐部使用的书籍代币，或会员俱乐部或社区使用的会员代币。\n\
  \n清晰地定义“数字证券”的特征和标准将是数字资产监管正确方向的第一步。考虑到所有数字资产的巨大市值，可能值得——甚至是必要——创建一个全新的联邦机构，该机构要要跟上加密领域发展的最新动态，并拥有必要的资源（人力、法律专业能力以及权威）来监管整个数字资产行业。\n\
  \n一个功能完备的“数字证券委员会”最初甚至面临来自 `SEC` 以及许多其他竞争绝对权威的联邦和州机构的阻力，但从长远来看，它将有利于政府、金融行业和市场参与者。\n\
  \n`SEC` 面临的最大挑战——对于全球所有的金融机构和监管机构也是如此——将是处理加密货币去中心化和无国界的特质，并由此延伸到 ICO 和所有数字资产。\n\
  \n这是一个根本性问题，因为 `SEC` 只能在其边界范围内行使权力，即美国。但一旦数字资产或证券被移动并存储在国边界和管辖区之外，`SEC` 就变得无能为力，即无法控制或监管该证券、金融工具或数字资产。让这项任务更加困难的是，数字证券可以极快且瞬间跨越边界和司法区，除了区块链和分布式账本技术提供的透明度和可追溯性外，没有任何控制。\n\
  \n与区块链相反，利用现有的金融系统和网络，犯罪分子可以通过暗网和其他逃法网络以加密货币的形式跨境，没有任何可追溯性，这对于合性和执法来说实际上更糟糕。\n\n\
  通过利用区块链和 DLT 技术，`SEC` 以及所有其他执法机构可能更好地跟踪数字资产的流动，并确保监管和法律合规。\n\n与此同时，`SEC` 已通过任命一位新的“加密沙皇”采取了第一项决定性举措。`Valerie\
  \ Szczepanik` 女士于 1997 年开始 `SEC` 工作，是一位拥有 22 多年经验的资深律师，将担任数字资产和创新高级顾问，负责 `SEC` 对加密货币、硬币和代币的监管。\n\
  \n\n\n\n\n在 `SEC` 发布的一份声明中，领导其分布式账本工作组的 Szczepanik 女士将“协调 SEC 所有部门和办公室，关于将美国证券法应用于新兴数字资产技术和创新，包括首次币发行（ICO）和加密货币”。她对\
  \ `ICOs` 的立场非常直截，这在火热潮流的 `ICO` 行业中被认为是利好：\n\n“ICOs 是一种相对廉价且无摩擦的方式，可以通过流动性二级市场筹集大量资金，”\n\
  \nValerie Szczepanik 在纽约的 SINET 创新峰会上。\n\n来源：《财富》杂志（2018/06/07）\n（来源链接：http://fortune.com/2018/06/07/valerie-szczepanik-sec/）\n\
  \n处理加密货币和代币已经是一项挑战，因为不同的联邦机构甚至对货币或代币的定义都无法达成一致。\n\n在纽约律师协会的区块链峰会上，`SEC`、`CFTC` 和\
  \ `FINRA` 的监管机构出席了会议，并讨论了加密货币的定义问题。在活动过程中，主持人指出不同的监管机构甚至不使用相同的语言来定义数字代币。\n\n“`SEC`\
  \ 说它们是证券，`CFTC` 说它们是财产，`FinCen` 说它们是货币，而 `IRS` 说它们是财产，” `Kobre & Kim` 律师事务所的律师 David\
  \ McGill 指出。\n\n来源：《财富》杂志（2018/06/07）\n（来源链接：[http://fortune.com/2018/06/07/valerie-szczepanik-sec/]）\n\
  \n当 `IRS`（美国税务局）将加密货币和代币定义为“财产”时，这显然是不合逻辑的，因为这些金融工具具备了可以在金融市场上交易的证券的所有特征和属性。\n\n\
  既然 `SEC` 已经朝着正确的方向采取了决定性行动，预计加密货币监管很快将在联邦层面制定并通过，其中包含一个关键条款：所有所有者、托管机构和交易所必须披露所有数字资产持有情况，特别是加密货币。这将确保美国境内所有的加密货币都有据可查，否则将因未披露和/或隐藏而受到联邦和/或州法律的惩罚。\n\
  \n一项全面且定义明确的联邦法将成为整个金融业的规则改变者，并可能在适当的时候通过联合国决议和国际货币基金组织（IMF）监督来实现全球合规的催化剂。\n\n##\
  \ 加密货币 500\n\n“机构投资者忽视加密货币变得越来越困难”\n来源：高盛\n\n比特币和数百种“可交换”的加密货币席卷了金融世界。最初作为实验或噱头的尝试现在已成为主流。世界各国政府现在开始采取措施，要么像日本那样接受加密货币作为法定货币，要么像中国那样禁止它们（后者是徒劳的，因为这些数字货币是无边界且无国界的）。\n\
  \n如果任何国家禁止加密货币，很容易在其他地方进行交易。\n\n对于一种无法被任何人控制、24/7/365 全天候可用并可以作为交换媒介和价值载体的金融工具，具有无限的吸引力。它是终极。\n\
  \n然而，数字货币有三个缺点——波动性、稳定性和无形性。\n\n大型网络攻击或网络安全漏洞可能导致加密货币在未知时间内无法访问。黑客攻击可能导致加密货币和硬币从电子钱包和交易所被盗取，这种情况已经发生过多次。\n\
  \n波动性是另一个无法真正克服的问题，因为加密货币根据纯粹的供需动态进行交易。没有任何经济因素（如 `GDP`、通胀或失业率）直接影响加密货币，因为这些数字货币无边界，且没有中央权威可以影响、操纵或操纵。\n\
  \n在日常生活中，货币的稳定性起到“记单位”的作用，使消费者可以将货币作为“价值衡量标准”，例如在购买食品或消费品时。比特币在这方面失败了，因为比特币价格的高波动性（在一天内以数百甚至数千美元的价格剧烈波动）使得比特币难以作为日常购买或房租、房贷等每月支付的货币。\n\
  \n具有不同属性的加密货币随处可见，可以随时随地进行交易。`Bitcoin`、`Ethereum`、`Ripple`、`Litecoin`、`Neo`、`Monero`\
  \ 和 `Dash` 是加密货币世界的“传奇”，并在未来许多年后可能保持这种地位。这仅仅是因为著名的品牌名称、疯狂的炒作和巨大的市值。\n\n对于其他数百种市值较小且知名度较低的加密货币，仍然有增长机会。\n\
  \n就像法币一样，可转换性和稳定性是关键，越强的货币交易越频繁。\n\n随着时间的推移，更强的加密货币将生存下来，而较弱的将在无无中消失。就像“财富 500”一样，很快就会出现一种“加密\
  \ 500”，即 500 种交易量最大、市值最高的加密货币排名。\n\n在此期间，会有疯狂的交易和失败的尝试，但加密货币将成为世界上许多国家的主流并可能的法定货币。\n\
  \n## 柠檬币与柠檬水\n\n2008 年下半年，金融机构的证券化在单美国就达到了天文数字 10 万亿美元，随后在欧洲达到了 2.2 万亿美元的巨额。\n\n\
  2008 年金融危机之后，由于 `CDOs`（担保债务凭证）的广泛使用，证券化几乎完全消失，而这种工具很大程度上导致了金融崩溃。\n\n`CDOs` 的发行是重新包装的违约次级抵押贷款贷款，这些贷款简单地与\
  \ AAA+级贷款组合混合在一起。这些金融产品由信誉良好的 `Fitch`、`Moody’s` 和标准普尔评级机构进行评级，然后卖给不知情的银行和金融机构，通常是与一种“经过处理”但匹配的\
  \ `信用违约互换`（Credit Default Swap）结合销售，这是一种高科技金融保险。\n\n\n\n\n\nENVION 是另一个从“成功”变为骗局的\
  \ ICO（至少他们是说的），它筹集了惊人的 1.1 亿美元，并已申请破产。前首席执行官和创始人在法庭上斗法，在此过程中，估计有 30,000 名众投资者（其中一些加入了“Envion\
  \ 投资者小组”）寄予了希望，但不可避免地损失了所有投资资金。\n\n由于过度的 ICO 傲慢和附带损害，`ICO` 融资格局已经发生了巨大变化，目前正经历着明显的第二次迭代（截至\
  \ 2021 年 2 月）。\n\n现在，想通过一份 30 页的白皮书和空头承诺来筹集数千万美元已不再，如今只有可行性和实质内容才是最重要的。\n\n毕竟，当几乎所有的实用代币——估计占总量令人难以信的\
  \ 99%——目前无法运行、流动性极差或两者兼有时，你如何能让大众投资者感兴趣并参与到“闭环”实用代币生态系统中呢？\n\n根本原因也是问题所在在于：为了参与任何“闭环”实用代币系统，人们首先必须使用加密货币购买“实用代币”。在进行此交易之前，必须在金融市场上使用法币购买加密货币。在这个耗时且漫长的过程中，在加密账户通过验证并可以使用加密钱包用于买卖代币和货币之前，必须经过好几个\
  \ `AML/KYC` 关卡。\n\n关于这个耗时过程最有趣的讽刺之一，通过一个关于“柠檬币与柠檬水”的 YouTube 视频解释得最好，你可以点击以下链接查看：\n\
  \nhttps://www.youtube.com/watch?v=eaSZg5nR-N4\n\n视频以一种相当幽默的方式描绘了实用代币系统，然而现实并无太大区别，在建立加密账户和钱包的难度，以及在购买实用代币之前必须经历的艰辛的\
  \ `AML/KYC` 合规过程，是可以与之类比的。\n\n数字资产、产品和服务的代币化为财富创造和繁荣提供了巨大机会；然而，涉及的过程必须变得更加精简，以确保大众的接受和采用。\n\
  \n# 区块链数字资产的新宇宙\n\n“证券代币将成为初创企业融资的转型性游戏规则改变者，因为它从一开始就为投资者提供了股权形式和收益参与形式的安全保障。”\n\
  \n其原因有许多，但近期区块链活动发生的最常见的 3 个原则是：信誉、可行性和实质内容。\n\n尽管 `ICO` 融资在 2017 年和 2018 年的大部分时间非常流行，但失败的\
  \ `ICO` 数量惊人，许多发行的代币自发行以来价值大幅下降。\n\n有许多因素汇聚成了 `ICO` 融资中这种困难的局面，但大多数人都会同意，是时候进行剧烈变化了。\n\
  \n进入 `STO`——证券代币发行——它正在风席接管 `ICO` 行业。这并非偶然，而是良好的投资直觉，因为有太多 ICO 没有履行其实性“实用代币”的承诺。\n\
  \n通过创建在区块链协议上发布的数字资产，将创建一个适应新资产投资方式全新行业。\n\n## ICO 2.0 – 面向大众的证券代币\n\n许多因素促成了 `ICO`\
  \ 的成功，而更多负面因素导致了我们今天所知的 `ICO` 格式的消亡。\n\n在不久的将来，`ICO` 将逐渐发展到 `ICO` 2.0，在那里监管将在扩大\
  \ `ICO` 市场方面发挥重要作用，同时向积极方向演变，涵盖各种格式和法律结构，如混合 `ICO/STO`、`DAICO`、`RICO`（可逆初始代币发行）或最新的\
  \ `IEO`（交易所发行）。\n\n投资者现在正在寻找由强大团队支持的有前景的项目，用以参与项目的股权和收益，而不仅仅是参与“闭环”代币生态系统，或期待在二级市场获利，希望上市后价值可能飙升。\n\
  \n证券代币是未来的金融工具，将允许大众从一开始（即种子阶段）参与有前景的初创企业。直到目前，这一阶段主要由天使投资者和风险投资机构（VC）保留，他们拥有商业和财务资源，使能够在最早阶段寻找并发现投资机会。这些种子阶段的投资通常会有后续的轮融资，大幅提高估值，使初始投资者能够通过私募收购或后期过度炒作的\
  \ `IPO` 之后退出并套现。\n\n证券代币发行的运作方式不同；所需的资金从一开始就开始筹集，因此项目团队可以专注于产品或服务的开发，并在需要额外资金或甚至可能需要资金之前，在此过程中获得牵引。\n\
  \n融资的相对简便与机构、风投和加密基金的逐步参与相结合，将指数级推动 `ICO/STO/IEO` 市场的增长，并允许大众市场投资者参与金融的高科技世界和代币化的未来。\n\
  \n## 数字证券与碎片化投资\n\n碎片化或“零食级”投资让零售投资者能够参与任何类型的投资，因为投资份额本身将被细分为可以在私下或在交易所交易的碎份。\n\n\
  想象一下，有人成为曼哈顿摩天大楼或毕加索画作的碎片所有者，而不必担心维护、保养、存储或任何相关成本。由于这些数字资产注册在不可篡改且透明的区块链上，治理通过区块链协议上的智能合约进行编码，任何金融交易都是根据预先约定自动执行并传输，不需要第三方中介。\n\
  \n可能性是无限的，碎片化投资很快将成为一个主要行业，但一个障碍不会很快得到解决，那就是数字资产和证券的监管。\n\n加密货币、货币和代币在世界大部分地区被视为某种形式的证券，但划分和碎片化的监管使得精确定义货币或代币变得非常复杂。在世界其他地方，定义和监管由国家政府及其相应的金融机构管理，而在美国，监管框架进一步细分为\
  \ 50 个州，每个州都有自己的立法和州监管机构。这种监管碎片化已经产生了困惑的法律影响，从长远来看，这将是整个美国加密行业的阻碍。唯一受益的将是那些为需要澄清所有加密相关事务的人提供法律服务，并在联邦和州一级申请正确的监管豁免提供协助的律师。\n\
  \n将加密货币、货币和代币分类为“数字证券”（必须披露），将清晰地定义“数字资产”的标准，并消除对数字货币和代币化资产（甚至包括版权、音乐、电影和作者权利）的任何模糊。\n\
  \n这可能违背加密货币去中心化本质的本质，但它会消除大部分甚至所有加密货币交易中的非法和犯罪元素。\n\n\n\n\n在全球范围内监管加密货币和数字资产将通过增强投资者的信任和信心，使整个加密行业合法化并从中受益；指数级地增加加密货币在主流全球经济中的采纳，并可能通过降低波动来稳定加密货币。\n\
  \n针对数字资产的明确规则和法规将为公平的商业实践以及所有市场参与者的包容（从您的零售投资者到专业股票经纪人）铺平道路，平衡竞争环境，从而让所有人按照相同的规则运行。通过这种方式，将开启一个全新的数字资产交易和投资宇宙。\n\
  \n# 第八章：区块链上的资产代币化\n\n## 非银行化资产\n\n金条、稀有钻石、独家珠宝、精美艺术品、古董、贵金属、稀有收藏品、独家房产、优质地段物业、名性建筑、注册专利、知识产权、版权、电影和音乐版权、顶尖运动员的未来收入、顶级篮球队、足球超级巨、高排名网球明星、世界著名的摇滚巨星、奥斯卡提名电影明星、YouTube\
  \ 网主、名人等，代表了一种新的资产类别——**非银行化资产**——这些资产是可以进行代币化的。\n\n非银行化资产通常是“流动性不足”的，而且像精美艺术、珠宝和经典汽车等昂贵的资产，它们无法快速出售或兑换现金。\n\
  \n流动性较差的资产如古董车、独家珠宝和优质房产可以较容易地出售，但只有在与确定的或热情的买家达成交易后，真实价值才会被提取出来，在这种情况下，钱不是目标，更多的是独性和排他性的无形价值。在财富管理中，这种购买行为被称为“情怀投资”，最近收藏品和艺术品的价格已经飙升。\n\
  \n史上售出的最昂贵艺术品世界纪录是列奥纳德·达·芬奇的画《救世主》（Salvator Mundi），该画在纽约佳士士拍卖会上以创纪录且令人震惊的 4.5 亿美元价格成交。在拍卖时，买家保持匿名，但由于涉及的价格高昂，人们启动了“搜寻模式”以追踪这幅老大师画作的新主人。事实证明，这位幸运的新主人正是沙特阿拉伯的皇储穆哈默德·本·萨尔曼——他计划在阿拉伯联合酋的阿布扎比卢浮宫展示并展览这幅画。\n\
  \n普通人拥有达·芬奇、梵高或毕加索的独家艺术杰品的概率几乎为零，但代币化可能在不遥的未来改变这一点。\n\n对代币化资产进行碎片化或单位投资将很快为人们提供拥有无价艺术品、收藏品甚至名人的某部分或份额的可能性。\n\
  \n这些所谓“非银行化资产”的所有权可以转移到区块链上的数字实体，并细分为碎片化所有权单位，由代币表示并向大众出售。\n\n艺术爱好者可以通过智能手机的便利性在线购买这些艺术品代币，成为认证杰作艺术品的碎片化所有者，而而不必担心或支付安全存储、保护或随后的“转手”销售的费用。所有的权利、义务和收益（展览展示或拍卖销售收益）都将注册并编码到智能合约中，治理机构将向任何想要加入的人开放，赋予了“投票权”概念全新的意义。\n\
  \n音乐、电影和娱乐领域也可以在区块链上进行代币化，让粉丝和狂热爱好者都有机会拥有大片电影、金片音乐专辑，甚至是超级巨星或名人的出版权。\n\n现在，名人已经向大众出售了他们未来收入的“份额”，更多的人也将将效仿。\n\
  \n以版税形式出售未来收入的原始先驱是世界著名的摇滚巨星大卫·鲍伊，他在 1997 年发行了臭名昭著的“鲍伊债券”。美国普信人保险公司以 5500 万美元购买了整批“鲍伊债券”，并由大卫·鲍伊的唱片公司\
  \ EMI Record 提供担保，该公司当时与大卫·鲍伊本人签署了一份 3000 万美元的录片合约。这些债券支付的年利率为 9%。\n\n通过放弃来自录片公司\
  \ EMI 十年的版税，大卫·鲍伊获得了 5500 万美元的预付款，这是一项精明的举措，让他能够从前经理那里买回歌曲。\n\n2004 年 3 月，穆迪将这些债券的评级从\
  \ A3 下调至 Baa3（仅高于垃圾级一级），这是由于收入低于预期的预期导致，而且根据穆迪的说法，EMI 是一家“未知的”录片公司，这种设定完全不合理。\n\n\
  然而，鲍伊债券并未违约，按计划在 2007 年清算，之后权利和版税回给了已故的大卫·鲍伊。由于诉讼、争议以及投资者普遍缺乏兴趣，名人债券并未成功。\n\n##\
  \ 数字资产与极高流动性\n\n根据管理合同的详细条款，名人债券可以作为资产支持证券或商业债务证券发行。\n\n知识产权的证券化可以扩展到各种知识、商业、技术、体育以及娱乐权利、收入和版税，只要有买家兴趣和流动性市场。\n\
  \n而正是这种关键的区别——流动性——造成了世界的巨大差异。\n\n将名人或体育明星的未来收入或杰作销售收益出售给机构投资者，与出售给爱好者、狂热者或主要粉丝群体有明显不同。后者对拥有独特或独有的事物充满热情，财务奖励在购买过程中处于次要位置。\n\
  \n曼联和多斯蒙德德沃鲁克等顶级联赛球队已经在股票交易所上市，大多数由于稳定的收入（电视转播、门票和商品销售）以及巨额利润，更重要的是由于品牌和粉丝忠诚度，其股票价值不断升值。\n\
  \n投资者更关注财务收益，而真正的粉丝显然更关注球队的成功和名声。\n\n非银行化资产的代币化将投资者的胃口从少数人的封闭圈扩大到更广泛的众筹投资世界，从热情到狂热、从投机者到聪明投资者。\n\
  \n通过让这些金融工具在线面向大众并可通过智能手机交易，将打开普通人参与金融市场的大门。\n\n## 资产的民主化\n\n> 代币化是将资产转换为数字资产或代币的过程，这种代币可以在透明、时间标记且不可逆转的区块链系统中进行交易、转移、移动、记录或存储。\n\
  \n来源：Medium\n\n几十年前是不可想象的，但现如今，只要有一台笔记本电脑、平板电脑或智能手机并连接互联网，任何人都可以参与金融市场和全球贸易。\n\n\
  \n\n\n\n曾经是经纪人和中介机构的专属领域，现在已可以通过平台和应用程序实现。任何具备基础计算机知识的人，都可以通过点击几次完成转账、买卖商品、执行金融交易并在范围内进行金融市场交易。\n\
  \n这一切之所以成为可能，是因为计算能力的不断增强，这些能力正持续压缩到笔记本电脑、平板电脑和智能手机等便携设备中。\n\n计算能力的这种“小型化”不仅彻底改变了技术，用户体验随之发生了飞跃性的提升。\n\
  \n在计算时代初期，了解并掌握计算机语言是使用计算机的必要条件，但今天，一个孩子可以在一天内学会使用平板电脑或智能手机，通常只需要几个小时。\n\n与此同时，移动设备以及移动网络的极速普及创造了一个全球互联的世界，以超快速度交换信息。结果是，世界变得“小”了，同时也变得更快，甚至到了信息过载的程度。\n\
  \n区块链的出现为万维网信息的传输增加了一个全新的维度，它创造了“价值互联网”，并此实现了几乎一切的代币化。\n\n### 资产代币化\n\n资产代币化实现了碎片所有权，并允许数字资产进行安全且无边界的交易。这意味着任何人可以在世界的任何地方交易任何物品，而无需第三方中介。\n\
  \n因此，已转换为“数字资产”的传统“模拟资产”可以在全球市场和加密交易所进行更易、更快的交易，且成本仅为传统全球金融交易相关成本的一部分，更重要的是，不再有无休止的纸质记录。\n\
  \n根据 Morgan Creek Digital Assets 创始人兼合伙人 Anthony Pompliano 的说法，代币确实代表了“数字资产与传统金融产品的交汇，它们仅仅是改进旧概念的新技术”。\n\
  \n### 代币化的核心优势\n\n更重要的一点是，正如 Michael Ippolito 在 LinkedIn 上写的一篇有趣文章中所描述的，代币化的四大核心优势是：\n\
  \n*   **流动性**：代币的创建显著减少了在流动性差资产中交易所有权股权的摩擦。\n*   **可访问性**：由于我们当前金融体系的设置，许多投资机会并非全球市场参与者都能获得。代币化和区块链改变了这一切。\n\
  *   **可见性**：代币是解决二级市场最持久问题之一的有趣答案，即追踪流经这些市场的资产有多么困难。\n*   **效率**：代币真正的卖点在于其能够大幅减少中介在金融交易中的参与度。`Smart\
  \ contract` 代码允许在代币本身中编写高度特定的所有权条款。\n\n### 障碍与挑战\n\n硬币的另一面，万物代币化面临着 4 个大障碍，即监管框架、区块链协议的成熟度与可扩展性，以及需要由稳定币支持的更成熟的市场（以保持价格一致）。如果持续的不稳定和高波动性继续困扰全球加密市场，那么将固定资产代币化并鼓励主流加入将是不可行的，甚至是不可能的。\n\
  \n代币化是区块链技术发展中最重要的方面之一，许多人认为它对经济的影响可能不亚互联网的发展。代表经济健康的传统金融指标通常忽略了向消费者的价值转移。\n\n此前，看似无法量化的抽象资产（如知识产权、品牌和商誉）以及版权和专利等记录资产，现在都可以以代币的形式在区块链上进行表示——即作为一种“数字法律权利”——并带有唯一标识符，甚至可以被进一步拆分和细分为碎片化代币或单位。\n\
  \n这种数字价值和资产可转移性的范式转变，使得出售几乎任何物品的合法份额成为可能，例如艺术品、音乐、艺术家甚至表演者的未来收入，以及阳光下其他涉及金钱和价值的所有事物。\n\
  \n随着越来越多的资产被代币化，全球金融市场将变得更加流动，进入全球经济的市场参与者增加，从而促进了前所未有的群体包容性。\n\n区块链需要克服的唯一挑战是速度、可扩展性和稳定性，这对于实现加密货币在全球的主流采用至关重要。\n\
  \n在上述三点中，加密货币的稳定性是目前最大的挑战，试图抑制加密波动性必须包含许多市场参与者。\n\n“所有数字货币的总市值已超过 1.4 万亿美元（截至 2021\
  \ 年 2 月），区块链技术在 2020 年吸引的投资超过 16 亿美元。尽管如此，加密货币的广泛采用仍受到市场波动和账户脆弱性的限制。\n\n资产抵押的稳定币——通常挂钩强大的美元或“避险港”黄金——目前是解决加密波动最有前景的解决方案，然而，许多稳定币如\
  \ `Tether`、`Gemini`、`Paxos`、`Circle`、`Coinbase` 和 `Tiberius` 仍在努力实现它们声称的功能，即为挂钩美元或黄金的加密货币提供稳定性。这有许多原因，其中之一是市场不成熟，也是采纳率缓慢。\n\
  \n简单来说，市场参与者越多，采纳率越高，流通的稳定币越多，稳定币的稳定性和整体功能就越好。\n\n### 原子交换——不是核能，但绝对先进\n\n原子交换（Atomic\
  \ Swaps）代表了一种交换代币的择手段，无需通过如交易所这样的信赖第三方。\n\n来源：Medium 上 Samuel Miller – Aerum 博客\n\
  \n在加密世界中，“原子”（atomic）一词只是一个高级的计算机科学术语，意味着交换要么完全发生，要么完全不发生，从而确保双方都在终端收到了交换的代币。\n\n\
  为了实现最优效率，`Aerum` 协议使用了两种原子交换：“链上”和“跨链”，这意味着双方都必须使用确认交易的加密函数来确认交换——资产或代币的瞬时转移。\n\n\
  原子交换的优势在于，随着这种安全交易功能的发展，它将实现任何代币化数字资产的即时、无边界交换，且无需任何中介，成本仅为涉及许多第三方、网络和系统的传统交换的一小部分——甚至免费。\n\
  \n与区块链的发展同步，我们今天熟悉的互联网将逐渐被区块链协议取代，并在过程中变为“价值互联网”，实现并促进价值的无边界交换。\n\n区块链的美之处在于一切都是透明的，所有数据以及所有交易对于区块链上的每个区块都是公开记录且可追溯的。\n\
  \n### P2P——颠覆金融的趣味术汇\n\n“点对点”（Peer-to-Peer）被重新发明了。区块链技术通过在点之间提供更快、更便宜、更安全且更有效的交易，颠覆了许多传统行业。过去需要昂贵中介或第三方的操作，现在由于智能合约的实施，可以通过区块链轻松完成。\n\
  \n\n\n\n\n正是这种固有的信任特性，使得区块链成为金融科技和 P2P 应用的彻底颠覆者。\n\n来源：Medium 上 Samuel Miller 的\
  \ Aerum 博客\n\nAerum 是一家总部位于布拉格的热门区块链初创公司，在香港举行的“2018 独角兽区块链奖”中荣获“创新区块链奖”，正引领开发下一代区块链基础设施。在此基础上，可以构建企业级、极速且可扩展的\
  \ P2P 应用，这些应用将从根本上彻底变革并颠覆 P2P 行业。\n\n点对点转账和贷款目前是一个高增长行业，正渗透到银行和金融的各个方面。其目的是根据对申请人财务状况、信用记录、还款历史的客观无偏评估（有时也通过社交媒体研究和审查等“非正规”方法），为值得赖的客户提供资金。\n\
  \n通过根据传统银行和贷款中使用的不同估值参数来审查申请人的信誉，更多消费者有权申请贷款并随后获得批准，从而指数级地扩大了信贷和贷款市场。\n\n速度问题和扩展性障碍目前正由各层区块链开发者致力于解决。在不久的将来，银行和整个金融行业将被迫使用区块链的先进、极速且网络安全的技术进行所有金融交易，因为这这意味着以远低于目前支付转账、信贷、贷款和一般银行业相关的成本获得更多的业务。\n\
  \n## 自主经济代理体 - 终极赚钱机器\n\n“Fetch 是一个去中心化的数字世界，其中发生了有用的经济活动。这些活动由自主经济代理体（AEAs）执行。这些数字实体可以独立于人类干预进行交易，并代表它们自己、设备、服务或个人。\n\
  \n代理体可以单独或合作，为当今的复杂问题构建解决方案。\n\nFetch.ai 是人工智能、物联网和机器人驱动的区块链交汇处，未来数字经济所缺失的关键基础设施。”\n\
  \n来源 – 由 Outlier Ventures 支持的 Fetch.ai\n\n“自主经济代理体”从定义上就独立于人类交互。因此，所有人类思维和情感元素——例如恐惧和贪婪——都从交易方程式中被，从而使交易不再人为错误和风险。这是处于“星际迷航”级别的突破性和革命性技术，它等同于商业领域的火箭科学。\n\
  \n如今，估计有价值 256 万亿美元的现实资产被“记录”在纸质记录中，但高度缺乏流动性。这些资产终将被代币化，但时间表尚不清楚，因为许多因素在起作用，例如监管和法律地位，使这些资产在时间和价值上保持“冻结”。\n\
  \n区块链技术将提供监管和法律框架，将现实资产转化为新的碎片所有权形式，由区块链上的数字代币表示，可以在全球范围内无国界边界进行交易、交换和存储。\n\n资产从模拟到数字的这种根本性转变，将导致传统缺乏流动性的全球市场产生前所未有的流动性。\n\
  \n释放出自主且独立的法律实体的 AEAs，赋予它们在有限或无责任（取决于监管和管辖权）的情况下交易和活动的能力，是一场极其惊人的游戏规则改变者。\n\nAEAs\
  \ 将区块链上漫游，以发现信息不对称、检测过剩、处置剩余、寻找或创造需求，并在全球范围内积极利用市场失灵。\n\n简而言之，AEAs 将参与即时的全球“商业套利”，而无需昂贵的劳动力或通过遗留网络和系统的第三方中介。\n\
  \n人们甚至无法想象这对全球贸易和整个劳动力市场产生的深度和颠覆性影响。这是无情技术“好、坏与丑”的全方位体现。在这个过程中，它将让少数早期采用者及其所有者变得难以想象地富有。\n\
  \n它将与今天杰夫·贝佐斯的亚马逊零售帝国相比，但是一个去中心化的全球商业和贸易行业，规模是数倍甚至更多。\n\n全球贸易、运输和商业将永不再改变。\n\n##\
  \ 全球经济的去中心化\n\n代币化将创造一个更有流动性的世界和全新的市场，这些市场将从根本上改善全球贸易的动态格局。\n\n这是全球经济的范式转移，将导致以前没有人能想象的经济扩张。\n\
  \n来源：MastertheCrypto\n\n目前，全球经济由科技公司统治，他们使用应用程序和平台，以更低的成本提供整体更佳的客户体验。亚马逊和阿里巴巴等科技巨头正在侵入整个在线商业和零售行业，并在过程中将自满的、遗留的和传统的“实体”连锁店推向关闭。最近的受害者包括曾经强大的美国零售巨头“斯道（Sears）”和“玩具乐场（Toys-R-Us）”，未来几年内必更多追随其后。世界已经注意到了，现在经常提到“零售末日”。\n\
  \n即使零售战场尚未完全清除受害者，这些科技巨头已经目标了全球各地的“主街”和“商业街”，一条接一条地攻占。零售中附带伤害的受害者，即受打击最严重的购物中心、商场和街道，那些位于大城市边缘、郊区或靠近小镇的场所，是那些没有拥有巨大消费能力的买家或消费者奢侈待遇的地方。\n\
  \n企业“买得多，省得多”口号的讽刺在于，通过在线商店和应用程序增加销量和产品供应，结果导致你当地的小店或零售店正在世界每个角落缓慢但确定地消失。美国是一个领先的例子，它最早开始建立购物中心和超级市场，随后是在线零售平台，这些平台几乎摧毁了国家许多地区的当地零售，而这种掠夺性趋势仍在中断地持续。\n\
  \n区块链和资产代币化将颠覆全球商业、贸易和金融，因为它将允许大众参与其中，而不仅仅是作为全球经济的接收方。\n\n这是全球经济的范式转移，将导致以前没有人能想象的经济扩张。我们现有经济的榨取性质使得，要成为市场参与者，你必须在许多公司所在的地理区域生活和消费。区块链或包容性网络创造了无边界财富创造手段，从而消除了全球\
  \ GDP 增长最大的障碍。未来已经到来，登录 `Github`，拿起你们的锄和铲子，让我们开始构建吧。\n\n\n\n\n数字货币已经成为全球金融市场的重要部分，尽管遭到了传统金融机构和全球许多政府的巨大阻力——例如摩根大通首席执行官杰米·迪蒙（Jamie\
  \ Dimon）之人的偶尔“抨击加密货币”。事实是，我们不再需要像以前那样使用货币，我们可以通过信用卡支付，甚至只需使用智能手机“触碰”支付。在电子支付无法或不可行时，现金很方便，而且用现金买东西带有某种怀旧感，但现金是昂贵的。它需要中央银行发行和治理、防伪和设计、印刷和运输，甚至在纸币损坏或褪色时进行存储和回收。而且，现金在用于非法目的时是不可追踪的。数字货币改变了这一切，只要电子支付系统可用且方便，它将让支付变得更加简单，同时也更具追溯性。全球各国政府和税务当局已经意识到这些优势，因此，央行开始发行与本币\
  \ 1:1 挂钩的数字货币只是时间问题，对于欧洲中央银行（ECB）来说，那将是欧元`。\n\n去中心化金融（简称 `DeFi`）将更上一层楼。它不仅将包含区块链上的数字货币，还将涵盖今天使用的所有金融服务，如储蓄、信用、贷款、保险等，而这一切将通过“价值互联网”实现，并通过你的智能手机、平板电脑、笔记本电脑或家用电脑访问。\n\
  \n`DeFi` 与今天金融的区别在于，它将世界的货币和金融世界从传统银行和金融机构转移给个人。政府仍然会有中央控制，但货币的交换或价值的转移将在相关方之间进行，不需要单一或中心化的实体、公司或政府等中介机构的明确授权。买家、卖家和交易者将能够独立直接地进行交易，使用加密货币来结算和完成交易。商业世界将随之改变，并在过程中为任何人（包括金融服务不足或没有银行账户的人们）创造机会。\n\
  \n## 单位经济学\n\n在过去的 20 年里，商品和财产的所有权发生了根本性的变化。我们不再“拥有”某些东西，而仅仅是以“订阅”（subs）的形式租用，这种趋势在几乎所有部署在\
  \ App 上的每个业务模型中都在增长。\n\n“先买后付”已被“订阅”业务模式取代，一切简单地租用或租赁，而不一定再拥有，从电影到音乐，从汽车到公寓，从商品到服务，以及其之间的一切。\n\
  \n在表面之下，我们缓慢而坚定地偏离了对任何事物的直接所有。财务限制、便利性和即时满足是租用或租赁而非直接拥有的决定因素。随之，整个传统行业发生了变化，`Ford\
  \ Motor Co.` 不再以原始形式存在，它创建了 `Ford Smart Mobility` 来与今天的科技巨头——如 `Google`、`Uber` 甚至\
  \ `Apple`——竞争。很快，我们甚至不会买车，我们只需租用或租赁它，在不不久的将来，长期租赁协议和租赁合同将被 App 上的几次点击所取代，从而消除了财务承诺的概念。\n\
  \n任何财务行为都将变成“周转”或基于“按需付费”的。资本支出和融资将被“小口化”订阅模型所取代。这一切都有充分的理由。信用已经过了它的黄金期，我们现在承受着天文数字般的**252\
  \ 万亿美元全球债务**，而且我们还没有看到尽头，因为这些债务正以惊人的速度增长。\n\n## 代币化与碎片所有权 – 金融的新前沿\n\n代币化——资产的碎片所有权——将促进财富创造，并为金融包容和自由提供一条更公平的道路。\n\
  \n房地产等资产很容易被“代币化”为碎片所有权，还有许多其他“无形”资产可以被分为所有权份额，例如音乐和电影版权、专利、艺术品、收藏品以及许多难以转换为现金的“非流动性资产”。\n\
  \n思考资产代币化的一种方式是将其视为由“乐高”积木组成的建筑，每个积木——或者“去中心化金融”中定义的“代币”都可以根据“智能合约”进行交易。\n\n描述“代币化”的另一种方式是，在金融市场上交易的是公司股票和金融工具，而在数字资产和证券中，交易的是资产本身的碎片。碎片所有权是一个相对新的概念，需要一些时间才能完全主流化，但它是不可避免的，由信用驱动的资本不再充足，很快将被基于区块链上创建的基于“智能合约”的数字资产所取代。碎片所有权是一个新趋势，也是为后代保护财富最公平的方式。\n\
  \n## 数字资产、衍生品与证券\n\n金融领域中的“数字”概念是指任何本质上是虚拟的、因此不是有形的金融工具。底层资产可能是物理的或有形的，如房地产或版权，然而，其价值是通过金融市场上的交易决定的。一栋建筑的价格是由房地产市场的供需关系决定的，而数字资产的价格是由金融市场的动态决定的。其区别在于，资产的真实价值与数字资产的市场价值之间可能存在巨大差距。真实资产与虚拟资产之间的差异可以是价值的一个重要方面和决定因素，而且时间至关重要。\n\
  \n在现实市场中，资产价值可能在较长时间内或下降，而在金融市场上，时间框架实际上可以缩短到分钟，而不是几天、几周或几个月。举一个简单的例子，曼哈顿摩天大楼的价值在长期保持不变——除非发生突然的市场或房地产崩溃——而一个“代币化”的建筑在交易时间内可能会波动。同样的动态也适用于数字证券和衍生品。\n\
  \n在今天的金融市场上，证券被定义为“可交易的金融资产”，通常被称为可流通“金融工具”，并大致分为股权（股票）或债务（债券）证券。数字证券是使用区块链（DLT）技术发行和交易的股权、债务和资产，主要涉及确定特定数字证券、资产或衍生品治理和权利利益分配的“智能合约”。\n\
  \n证券（按照目前的定义）与数字证券之间的关键区别和决定因素是根据智能合约确定的条件进行的共识治理。另一个用于描述数字证券的术语是“证券代币”，它涉及发行代币，然后在二级市场上变得“可交易”（因为主流金融市场的采纳和交易尚于遥远）。\n\
  \n最常用的“智能合约”协议是“以太坊”，它于 2015 年由俄罗斯裔加拿人天才少年维塔里克·布特林（Vitalik Buterin）创建，当时他仅 22 岁。\n\
  \n\n\n\n被视为加密货币和金融科技领域的天才，他将加密货币和区块链推向了风的中心，使其从无名走向主流，并在此过程中吸引了全球关注。\n\n比特币的本质是在区块链上开发的首个“智能合约”，因为比特币的“非通胀性”和有限供应量被限制在\
  \ 2100 万个，并被写入比特币底层区块链协议的智能合约中。\n\n简单来说，没有共识，没有人可以改变比特币或其底层区块链协议，这导致了全球各比特币持有者与比特币“矿工”集团之间的许多全球纠纷，引发了“硬分叉”；即将特定区块链分成两部分，这种分裂通常具有争议性、往往引起争议且有时复杂。\n\
  \n比特币实际上是第一个功能性的“数字价值”示例，可以在不涉及任何中间人或第三方情况下，在双方之间进行透明交换。\n\n智能合约创建在“不可逆”的区块链上，使用加密代码来执行——完全按照其创建者确定的固定合同条款和条件进行执行，这些数字合同也受法律强制执行（例如，在财产方面）。\n\
  \n“智能合约”背后的思想是能够以透明且“无摩擦”的方式交换“数字价值”，无论是货币、股票、资产、商品、财产或其他任何有价值物品，而无需明确要求任何中间人或第三方。交易过程本身已简化到任何拥有智能手机的人都可以使用\
  \ App 或在线平台买或或卖数字资产，而不需要依赖经纪人来执行交易。数字证券之所以如此有趣，是因为它们可以通过智能手机上的简单 App 从任何地方进行交易，而普通证券必须通过获得许可的经纪人/交易商在金融市场上进行交易，这涉及到成本，而且有时会产生意外的延迟。\n\
  \n去中心化金融（DeFi）和任何数字证券都基于“去中间化”原则，也就是说，第三方或中间人已从交易方程式中移除，不需要投资银行或金融机构等中央或控制机构（除非遵守由\
  \ `SEC`、`FCA` 或世界上任何其他金融监管机构监管的证券法）。\n\n大众使用智能手机进行金融交易将降低零售投资者的准入门槛，并简化从证券发行到监管的整个流程。\n\
  \n在不未来的某一个时候，随着数字证券的主流采用和非流动性资产的代币化增加，金融市场内的流动性将呈指数级增长，并造福所有市场参与者。\n\n去中心化金融和通过“代币化”实现的数字资产碎片所有权将降低任何想要在金融市场上交易和赚钱的零售投资者的准入门槛。\n\
  \n这是一场史诗级的游戏规则改变者，毫无疑问，现在就是开始的时候。\n\n# 第九章：中心化 vs 去中心化\n\n## 中心化控制 vs 去中心化共识\n\n\
  在数字世界中，中心化与去中心化之间存在着巨大的鸿沟。\n\n秉着中本（Satoshi Nakamoto）真正的精神，比特币及其底层区块链协议的意图是创造一种没有任何中央控制的货币。\n\
  \n具体来说，任何双方都应该能够“点对点”进行交易，而不涉及任何第三方，这被称为去中间化。\n\n自由意志主义本质的比特币信徒者认为，加密货币不需要中央控制，供需关系创造了价值。\n\
  \n这种思维方式看起来是合理的，在比特币的非常早期，世界各地的零售商店甚至开始接受比特币作为支付方式。\n\n当时，汇率计算很简单，1 个比特币大约等于 1 美，因此使用借记卡或信用卡作为日常支付方式相对容易。毕竟，这种转换与外汇交易一样相似且熟悉。\n\
  \n但当比特币在 2018 年 1 月升值到 1000 美元时，将其作为日常支付方式和计量单位变得越来越困难。\n\n转换并计算到小数点后后 5 位意味着微量计算，这需要带有计算器的智能手机来计算任何物品的价格。\n\
  \n到 2018 年 12 月底，比特币几乎触及 20000 美元的魔法数字。\n\n那时，使用比特币进行日常支付变得几乎不切实际。即使银行 App 可以完成所有的转换计算，但除了汽车或房屋等大额物品外，用比特币支付日常购物变得变得不切实际。\n\
  \n自比特币达到峰值以来，价格已回落到 3500 美元左右，并在 2019 年第一季度的大部分时间一直在该水平附近波动。\n\n与此同时，大多数具有“进步思想”的零售商已停止接受比特币作为支付方式，因此，比特币的主流采用陷入停滞，并且可能永远无法恢复。\n\
  \n相反，比特币 ATM 的普及呈指数级增长，现在你可以在镇上当地的肉铺店里找到它们。\n\n比特币狂热者认为，这是一个信号，表明在不久的将来，零售商将转变观点，并重新接受比特币作为有效的支付方式。其他人认为，比特币\
  \ ATM 的激增——它们只接受现金不取出——是为了洗钱。而且没有比在当地肉铺店里做这件事更方便的，隐蔽且不引起怀疑，24 小时营业。\n\n无论比特币 ATM\
  \ 普及的真实原因是什么，可以确定，比特币在社会中具有价值存储的地位，有些人称之为“数字黄金”。\n\n关于比特币是交换媒介还是价值存储或两者兼有的无尽讨论，将全球加密社区分为两个主要阵营。\n\
  \n那些认为比特币应该被视为“数字货币”的人，以及认为比特币是“数字黄金”的人。也就是说，比特币是加密货币还是加密资产？毕竟，比特币仍然占据全球加密货币市场 50%\
  \ 以上份额，这在可预的未来可能保持现状。\n\n在思考这两个加密阵营的论点时，必须考虑并考虑到比特币是世界上第一个加密货币，正因如此，它获得了传奇地位。大多数人可能不知道\
  \ `Ether` 或 `Litecoin`，但世界上几乎每个人都知道，或至少听过比特币，特别是在它 2018 年达到令人眩晕的高度之后。\n\n赋予比特币“加密货币之王”的称号凭借其传奇地位和市场份额的主导地位是合适的。\n\
  \n但即使比特币是第一个且最为人知的加密货币，它确实经历了三次重大的硬分叉。\n\n2017 年 8 月，比特币分裂为比特币 (BTC) 和比特币现金 (BCH)。\n\
  \n分裂的主要原因是与扩展性相关的 1MB 块大小（现在是 2MB）和 7 tps（每秒交易数）的交易速度。相比之下，`Visa` 可以执行 24,000 tps，这使得比特币目前成为一个不可行的竞争对手。\n\
  \n比特币现金使用与比特币相同的代码库，但块大小限制现在是 8MB，使得每天进行约 200 万次交易成为可能。\n\n这个名字并非偶然，比特币现金旨在作为日常支付方式，而比特币被更多地视为价值存储工具。\n\
  \n但更重要的是，与拥有许多矿池的比特币不同，相反，比特币现金只有 3 个矿池，因此是高度中心化的。\n\n\n\n\n因此，对于一种本应该“去中心化”的加密货币，它实际上却是“中心化”的，这违背了中本·纳个的精神。这个令人头疼的问题存在于整个加密世界：中心化与去中心化、控制与共识，以及区块链与分布式账本技术（DLT）。这一切归结为一个问题：是由少数人决定重大问题，还是应该所有成员之间达成共识？\n\
  \n答案取决于具体的情况和环境。在某些情况下，由少数人决定事务更好；而在另一些情况下，达成共识则更好。说起来容易做起来难，因为在不久之后，即 2018 年 11\
  \ 月，发生了另一次硬分叉，将 `Bitcoin Cash` 分为 `Bitcoin ABC` 和 `Bitcoin SV`（中本的愿景）。这一次，双方立场变得更加强硬，争议的核心人物是克雷·莱特（Craig\
  \ Wright），他实际上声称自己就是中本·纳个，但无法证明。\n\n看来在比特币之路的某个地方，进一步的硬分叉是不可避免。\n\n## 加密宇宙 (Cryptocosm)\n\
  \n乔治·弗兰克林·吉尔德（George Franklin Gilder）是一位美国作家、经济学家、技术乌托邦倡导者和投资者，也是发现研究所（Discovery\
  \ Institute）的联合创始人。他在 1981 年出版的国际畅销书《财富与贫穷》描述了罗纳德·里根政府早期对资本主义和供给侧经济学（作为对统治地位的“需求侧”凯恩斯经济学的制衡）的道德和实践上的论证。\n\
  \n“在谷歌时代，互联网的首要规则是‘通信优先’。这意味着一切都可以自由复制、移动和变异。虽然我们大多数人欢迎‘免费’是基于它意味着‘不收费’，但我们真正想要的是得到的东西，而不是权威选择提供的东西。在实践中，“免费’意味着不安全、无形、无依从以及从上而下的变化。”\n\
  \n来源：乔治·吉尔德 —— 《谷歌之后的生活》\n\n乔治·吉尔德的加密宇宙是一个关于点点技术以及谷歌在数据领域日益衰落的主导地位的迷人论文。\n\n在他的著作《谷歌之后的生活》中，作者乔治·吉尔德描述了一个没有谷歌的世界，在这个世界里，每个人都通过点点网络参与数据的聚合和分配。\n\
  \n乔治·吉尔德以“谷歌大总部”（Googleplex）命名，描绘了一个巨大的科技集团的蓝图，它控制数据并将其存储在只有谷歌自己才能访问的专利数据“孤岛”中。但根据吉尔德的说法，谷歌垄断数据的日子已数不日宜。数据统治的狂欢正缓慢但坚定地结束，随之，一个全新的加密宇宙时代将诞生。\n\
  \n“加密宇宙是一个技术突破，有望改变我们生活的方方面面。”\n\n通过夺回对数据的控制权，新的业务模式将会出现，这将使其数据所有者受益，它甚至可能为我们提供的数据支付付费。\n\
  \n谷歌的“免费”业务模式提供了对谷歌数据和信息的无限使用，可以通过谷歌搜索访问，但普通用户并不真正理解的是，谷歌用户本身就是他们的产品。通过许多谷歌产品之一自愿分享信息，用户对谷歌本身就变得有价值了。因此，当人们认为一切都是免费的，实际上是要付出交出隐私作为代价的。\n\
  \n谷歌的“不作恶”（Don’t Be Evil）口号听起来很有力量感，甚至带有安抚性，但事实并非如此。谷歌已经渗透进社会结构中，并为了利润记录了我们的私人数据。\n\
  \n技术一直是谷歌的秘密武器，但新技术将结束谷歌时代，并开启一个新的平等的时代，那里的公民可以控制自己的命运。\n\n加密宇宙将抹平竞争环境，让全球公民参与到一个平等且丰富的世界上。\n\
  \n## 中本的诅咒 (Satoshi’s Curse)\n\n比特币对世界产生了深远的影响。直到最近才不为人知，它已经走出阴影，成为未来的数字货币。\n\n\
  比特币的影响是深远的，世界意识到了这种不被任何人控制的替代货币。\n\n但比特币的真正目的是什么？它是反抗的武器，还是财务独立的工具？由于它的创造者的消失，这些问题现在仍然没有答案。或者，从初就根本没有创造者吗？\n\
  \n阴谋论者提到了中央情报局（CIA）或国家安全局（NSA）控制货币的政府阴谋，其他人则认为是一群想要改变我们所处世界的无政府主义程序员。\n\n当讨论和辩论激烈进行时；比特币占据了世界加密货币的一半。在比特币接近\
  \ `$20K` 的峰值时，市值接近万亿美元。按照所有标准来看，这是一个不容的市值。\n\n自从第三次比特币硬分叉以来，整个加密市场经历了惨烈的崩盘。曾经通往难以捉摸的\
  \ `$100K` 价格水平的路径突然向南反转，整个加密社区都在 `$1,000` 水平迎接冲击。\n\n跌至谷底从未发生，但恐惧已经抓住了整个加密世界，从死忠者到浪漫主义者；那些紧紧着加密货币就像要去和加密女神约会一样的人。\n\
  \n世界各地的自由主义者希望比特币能回到它的光光，而世界其他地方则痛苦地目睹比特币价值的快速下跌。\n\n但比特币不是你普通的加密货币，比特币是传奇。它是第一种不被任何人拥有或控制的数字货币；因此，它是全球中央银行比喻眼中的刺。\n\
  \n未来可能是未知的，但比特币已于此，而全球精英在疑惑为什么。中本确保了稀缺性将驱动比特币的价值直到永恒。与此同时，世界正热切地等待比特币下一次冲顶。而全球精英正感到恐惧。\n\
  \n## 新货币与价值的创造\n\n加密货币热潮正达到白热化，世界似乎永远无法满足。\n\n每天都有一种新的加密货币出现在市场上，`ICO/STO` 代币再次涌入融资领域。\n\
  \n与此同时，世界各地的政府和金融监管机构都在拖延（并沉浸在官僚主义的遗留中），思考在日益复杂的数字资产世界中采取何种立场或方向。\n\n“数字资产是所有具有价值、可以被拥有或授予使用权，但没有实体的事物。”\n\
  \n这会让许多人困惑，因为大多数人认为资产是物理的、有形的价值体现，如货币、货物或财产。\n\n那么数字货币的意义何在？实际上意义重大。\n\n数字货币允许资金在全球范围内进行快速、无界的传输。它还让世界各地没有银行或银行服务不足的人只需通过智能手机和互联网连接就能参与金融体系。\n\
  \n在当今超快速的数字世界中，加密货币提供了另一种价值传输和存储手段，补充而非取代——物理法币（即真实的钱）。\n\n资深赌徒 (The Accredited\
  \ Gambler)\n\n\n\n\n\n在世界的工业地区，特别是在发达的金融市场，如美国、英国、欧洲和远东（具体为日本、中国、韩国、新加坡、香港），投资者只能参与上市证券的金融市场，即任何已在相应机构正式注册的金融工具。\n\
  \n投资任何“OTC 粉红股账单”或其他未注册的证券对于普通消费者或零售投资者来说，绝大部分是“不可行”的，世界各地的金融当局都会确保投资未注册证券变得困难——如果不是不可能的话——尽管根据适用国家或司法管辖区的不同，有许多漏洞可以用来规避监管机构。\n\
  \n众筹是让普通人能够投资有前景的初创公司的方式之一，然而这更像是一个“社区投资俱乐部”，因为早期投资者不被参与股权，只能获得未来活动的头排入座承诺、商品或产品的优先购买权、公司周边，以及在某些情况下，未来使用的的代币。最终，众筹演变为允许早期投资者参与初创公司股权（在英国和世界其他地区），现在这已演变为火热且潮流的首次代币发行（ICO）或代币生成事件（TGE），而这些在很大程度上仍不受监管。瑞士的\
  \ `FINMA` 是唯一采取领先并发布指南的重大金融机构，让每位投资者在 ICO 不完善的法律框架下了解游戏的基本规则。\n\n在英国，允许参与初创公司比美国要宽松得多也更容易。根据\
  \ `FCA` 的说法，基本上有 5 类合规投资者：\n\n- 日常投资者（通常称为众筹投资者）\n- 顾问投资者（受 `FCA` 监管的投资者）\n- 自证的精明投资者\n\
  - 认证的精明投资者\n- 认证的高净值投资者\n\n这使得投资者很容易获得资格并参与初创公司投资。`HMRC` 通过使用 `EIS/SEIS` 计划获得的税收减免，使其更具吸引力。\n\
  \n在美国，这完全是另一回事。合格投资者是指任何净值或资产超过 100 万美元（不包括主要居所）且年收入超过 20 万美元（已婚夫妻合计为 30 万美元）的人。目前美国仅有\
  \ 1366 万合格投资者（仅占 2020 年美国人口的 3%）。仅凭这一个标准，准入门槛就高到自动排除了 74% 以上的美国成年人（包括精通金融的人士）。因此，无论一个人对金融、经济或投资有多精通，“如果你没钱，你就不允许玩”，就没有区别。\n\
  \n但如果一个人是赌徒，就不需要获得认证，他们只需要去拉斯维加斯或大西洋城挥霍掉他们的生命、积蓄和生计即可。除了赌场有权（甚至有义务）禁止某人玩甚至进入赌场外，没有哪一项美国联邦法规禁止人们在赌场、宾果游戏厅或马场赌博（更不用说其他更非法——或完全犯罪的赌博场所了）。\n\
  \n合格投资者受到保护，而赌徒则听天由命或自顾。\n\n# 第十章：华尔街 2.0\n\n## 华尔街之狼\n\n注意这里是复数，它指的是大量成功的投资银行家，他们拿着客户的钱为自己工作，留给其他人的是残渣和碎片。\n\
  \n整个华尔街——以及其他地方——投资银行家的心态实际上在入职阶段就被“喂”了，所有这些年轻的投资银行家都由大型投资银行（如 `Goldman Sachs` 和\
  \ `JP Morgan`）亲自培养，以获得难以信的金融成功。新员工被训练要“鲁莽地”交易并获取巨额利润，然后出去在奢华派对、独家夜店和极度昂贵的餐厅“挥霍掉现金”。在私人生活方面，豪华跑车以及位于城镇最昂贵社区的配套豪宅或顶层公寓是常态，而非例外。炫耀性消费和过度物质主义是这些年轻、野心勃勃且贪婪的投资银行家的狂热动力，他们每年直接从春藤盟商学院毕业后成群涌向华尔街。\n\
  \n我们大多数人可能看过大大片《华尔街之狼》，它生动、有趣且真实地描绘了乔丹·贝福特（Jordan Belfort），他起家于声誉良好的“精品”投资银行 `LF\
  \ Rothschild`，结果在 1987 年 10 月 19 日“黑色星期一”崩盘后发现自己失去了工作。\n\n在通过电话销售 OTC（场外交易）“粉红股账单”（即列在“二级市场”上的可疑公司的无价值廉价股）之后，他完善了“快速致富”的计划。1989\
  \ 年，他创立了金融交易公司“Stratton Oakmont Inc.”；这家名昭著的华尔街公司甚至发起了竞争激烈的 Steve Madden IPO。Stratton\
  \ Oakmont 在 1996 年达到巅峰，不久后被迫破产。\n\n过量饮酒和药物驱动的性派对是当时的常态，而“斯特拉顿人”（Stratton Oakmont\
  \ 交易员的亲切称呼）以狂欢派对、无情的赚钱手段和欺骗客户而闻名。\n\n在疯狂的“斯特拉顿人”派对结束后，乔丹·贝福特和他的伙伴丹尼·波鲁（Danny Porush）于\
  \ 1999 年因证券欺诈和洗钱被起诉。两人均认罪，并在与纽约检察官达成“辩诉交易”后，获得了较短的刑期。\n\n在结束相对短暂的监禁后，乔丹·贝福特创立了“Straight\
  \ Line”，这是一家销售策略和策略咨询公司，根据贝福特的说法，这让他赚到了比 Stratton Oakmont 更多的钱。这就是华尔街的故事。\n\n那些愚蠢和无知的人总是为华尔街之狼的财富买单，这永远不会改变。\n\
  \n那些日子早已消失，取而代之的是几乎 24/7 全天候运行的更复杂的金融工具和交易平台。当纽约市场收盘时，东京市场开放，随后是伦敦，在每个时区都有更多市场，为投资者和交易者提供了每周\
  \ 5 天（周一到周五）交易的机会。\n\n外汇市场（仅伦敦每天交易额就有 5 万亿美元）将交易时间延伸到每天 24 小时，每周 5 天。\n\n加密货币市场和交易所让金融交易实现了“闭环”，24/7\
  \ 不间断全天候运行，日复一日，全年无休。\n\n\n\n\n此外，参与金融市场的投资者和交易者越多，就越能减少可能的操纵行为，同时指数级地增加流动性。在复杂的手机交易平台上提供的数字资产碎片化所有权，将显著降低未来大众市场和零售投资者的准入门槛。\n\
  \n世界正见证着全球金融业以惊人的速度发生前所未有的变革，而最好的时刻尚未到来，那就是区块链上的数字资产代币化。\n\n# 无畏女孩与金融界的奇迹女性\n\n\
  ![Image](img/Image00010.jpg)\n\n版权 2020 - Dreamstime\n\n`无畏女孩`旨在传达一种关于职场性别多样性的视觉信息，并鼓励公司在董事会中招募更多女性。\n\
  \n塑像的牌子上写着：\n\n“了解女性领导的力量。\n\n她（SHE）可以改变一切”，其中 `SHE` 既指主体的性别，也指该基金的`NASDAQ`股票代码。\n\
  \n版权：State Street Global Advisors\n\n`无畏女孩`是一尊青铜塑像，为了“对峙”重达 7000 磅的`华尔街铜牛`而委托创作。它曾被移至`纽约证券交易所（NYSE）`外，并被放置在正对面，面对着标志性的青铜牛，这里是投资银行新手和游客的打卡圣地。\n\
  \n这一象征性举是由纽约市长`比尔·德·布希尔`和市当局发起的，这似乎是未来的一种信号。\n\n在男性主导的投资银行行业充满歧视的世界里，性别平等是一个模糊且鲜为人知的概念。\n\
  \n成功的女性是例外而非常态，这些同样优秀且受过良好教育的女性同行需要付出至少两倍的努力才能在华尔街的一家顶级投资银行获得好工作。攀爬公司阶梯更加艰辛且充满挑战，因为遗憾的是，直到今天，关键职位仍为男性预留，并且很可能从前投资银行老兵的内部圈中选出，这些人对前雇主和导师欠有人情或债务。生意完全取决于你认识谁，而不是你了解什么，特别是在投资银行这种联系紧密且封闭的圈子里。\n\
  \n那些成功登顶的强大女性面临着来自其前上司和公司董事的更多挑战。取悦雇主是需要代价的，为了确保职业长青，必须搁置对平等的合理预期。这是一个不公平的世界，女性往往处于平等的低端。\n\
  \n男性在企业世界中的主导地位无处不在，这是由于整个社会未能从每一个可能的层面解决平等和女性赋权的问题，从小学一直持续到大学毕业，以及职业机会。除了性别不平等，还有种族、肤色、文化、宗教和性向的划分，这在长长的偏见、歧视和不平等的列表中最显而易见。\n\
  \n钱不能让情况变得更好，原始的心态更是如此。\n\n幸运的是，形势正在发生变化，越来越多的女性加入了管理高层和公司董事会。\n\n一个突出的领域是`CLO`（担保贷款债券）业务，目前是华尔街最热门的“玩法”之一，十分分之一的高级管理职位由女性高管担任。\n\
  \n担保贷款债券是“由债务池支持的单一证券”，是目前华尔街推崇的最受欢迎金融产品之一，也是规模高达 700 亿美元市场的一部分。\n\n`Linda Pace`负责`凯莱尔集团`价值\
  \ 250 亿美元的`CLO`业务，这使她稳固地处于全球`CLO`经理人的前三名。在 50 个全球最大的`CLO`团队中，有 13 个由女性高管管理，传闻他们更擅长这样做。根据研究数据，`CLO`投资组合在女性的管理和监督下表现确实更好。\n\
  \n另一个惊人的成功故事是强大的`Stacey Cunningham`，她在历史悠久的`纽约证券交易所`作为夏季实习生开始职业，在经历了长达 24 年的职业轨迹后，一路走到了顶端。\n\
  \n对于这位曾经的`NYSE`实习生来说，这令人印象深刻，`Cunningham`将成为 1792 年成立以来首位执掌交易所的女性。\n\n听起来可能难以置信，当时的女性投资银行家和交易员如此格格不入，以至于整个`NYSE`建筑内甚至没有专门的女厕。起初是一个改装的电话亭用作女厕，随后在主交易所楼层建造了一个单间厕所隔间。\n\
  \n在成为这家拥有 227 年历史的金融机构的首位女性负责人后，`Cunningham`的任任命将成为女性赋权的催化剂。\n\n在`Cunningham`之前，传奇人物`Muriel\
  \ Siebert`于 1967 年成为首位加入华尔街担任交易员的女性，为许多成功的女性开启了大门。\n\n最近，23 岁的`Rosenblatt Securities`股票交易员`Lauren\
  \ Simmons`成为`新证券交易所`最年轻的黑人场内交易员。这在就业规模上是一个“三连冠”。\n\n\n\n\n史诗级电影《华尔街》中的其他虚构人物是基于现实中的金融罪犯，如迈克尔·米尔肯、伊万·波斯基和卡尔·伊根，他们是当时的“内幕交易者”和“企业收购者”。\n\
  \n资本主义本身基于对“贪婪”和对“恐惧”的金融悔恨，这两种情绪引导着投资者的行为并导致了盈亏，最终导致了金融市场上不可控的价格波动。\n\n也许米尔顿·弗里德曼和弗雷德希·哈耶克关于让市场力量自由发展、不受政府干预的观点是，这样就能释放贪婪的良面。或者亚当·斯密的“看不见的手”是更好的意识形态，允许市场的自我调节性质根据市场参与者的自利行为来决定资源的配置。无论哪种理论是正确的或可能占优，贪婪在几个世纪以来一直存在，并且总会有不公的受害者，因为贪婪导致了不可避免的“理性疯狂”，从而创造了“资产泡沫”，而资产泡沫往往有坏结局。\n\
  \n## 道氏理论与随机漫游假设\n\n这两个术语和理论看起来可能有些“神乎其神”，但都非常有用，道氏理论是技术交易和金融投资的权威和最终定论。\n\n道氏理论关于股价波动的六大基本原则是技术分析的一种，包含了板块轮动的某些方面。该理论源于查尔斯·H·道氏（Charles\
  \ H. Dow，1851-1902）撰写的 255 篇《华尔街日报》社论，他是《华尔街日报》的记者、创始人兼首任编辑，也是道琼斯指数公司的联合创始人。\n\n\
  来源：Investopedia\n\n道氏理论至今仍被全球的金融交易员使用，并在每所顶誉的商学院教授，它是技术交易的基础，也是几个世纪以来股票交易中出现的许多其他交易和投资概念的先驱。\n\
  \n遵循市场趋势、波动和阶段，并像道氏理论描述的那样观察成交量并吸收财经新闻，使交易员获得了优于那些“无知”竞争对手（即投机者和散户）的竞争优势，后他们像在赛马场一样“下注”，随机且没有深思熟虑。这只是一种没有逻辑支撑的交易“投机”。\n\
  \n`Random Walk` 理论认为股价的变化具有相同的分布且相互独立，因此股票价格或市场的过去波动或趋势不能用于预测其未来波动。简而言之，这种观点认为股票遵循一条\
  \ `random` 且不可预测的路径。这与有效市场假设一致。\n\n来源：Investopedia\n\n`Random Walk` 假设可以追溯到法国经纪人朱尔·雷纳诺（Jules\
  \ Regnault）于 1863 年出版的一本书，多年来由各种学者和常藤大学教授不断更新。\n\n道氏理论与随机漫游理论的主要区别在于，道氏认为整个股市基于运动并可以从某种程度上被预测，而随机漫游理论认为股价波动是随机且不可预测的。\n\
  \n当然，学术界的各个层面和角落都有批评者和反对者，他们认为金融市场是可预测的——股价随趋势移动——通过分析历史市场价格和趋势，可以预测未来的市场价格。\n\n\
  但是，每份投资建议中的法律免责声明都说明了完全相反的内容：\n\n“过去的业绩不代表未来表现”\n\n由于有太多的市场预测没有变成现实，而不是变成了现实，因此由懂行的律师拟定了这一标准且实用的法律免责声明。\n\
  \n自金融交易理论出版以来，出现了无数遵循市场指标的交易策略，大多数交易员已经掌握了其中绝大多数的概念，然而，无论多么精明的交易员也只会利用少数策略，并将其纳入个人交易策略中。一些交易员倾向于基于算法的交易（简称为\
  \ `algo-trading`），以消除交易中的“情感”因素，从而增加成功的机会。\n\n然而有一点是可以肯定的，没有任何交易或投资策略能产生持续的“获利”。最好的情况下，胜率很高，但很少能持续超过\
  \ 80%。换句话说，没有一种“魔法”交易策略可以在交易或投资中产生持续收益，因为时机和交易纪律就是。\n\n通过使用全面的交易和风险管理策略，成功的机会会指数级增长，随着人工智能和机器学习的加入，普通散户交易和投资可以变得更加“安全”。\n\
  \n以下是道氏理论的摘要，全文可以在书后的“资源”部分找到。\n\n## 道氏理论六大基本原则 - 摘要\n\n### 1. 市场有三种运动\n\n- **(\
  \ 1 ) “主趋势”、主要运动或大趋势可能持续从不到一年到几年。它可以是牛市或熊市的。**\n- **( 2 ) “中期波动”、次级反应或中间反应可能持续十天到三个月，通常回撤自上次中期波动或主趋势开始以来主要价格变化的\
  \ 33% 到 66%。**\n- **( 3 ) “短期波动”或微观运动根据意见而异，从几小时到一个月或更久。三种运动可能同时发生，例如，在牛市主趋势的熊市次级反应中的每日微运动。**\n\
  \n### 2. 市场趋势有三个阶段\n\n道氏理论认为主要的市场趋势由三个阶段组成：积累阶段、公众参与（或吸收）阶段和派发阶段。\n\n### 3. 股市反映所有消息\n\
  \n股价会在新信息出现后迅速将其纳入。一旦消息发布，股价将变化以反映这些新信息。\n\n### 4. 股票指数必须相互确认。\n\n### 5. 成交量确认趋势\n\
  \n道氏认为成交量确认了价格趋势。\n\n### 6. 趋势一直存在直到确定性信号证明其结束\n\n道氏认为尽管存在“市场噪音”，趋势依然存在。\n\n市场可能会暂时向趋势相反的方向移动，但很快就会恢复之前的运动。\n\
  \n在这些反转期间，应该给趋势留疑疑的空间。\n\n## 无赖银行与中介的终结\n\n“无赖”在金融世界某种程度上是一个错误的说法，因为信任在金融和银行业就是一切。这并不是说所有的投资银行家和交易员都是“值得信赖的”，而是信任是所有银行和金融交易的基础，没有它就没有金融行业可言。\n\
  \n然而，区块链将使金融交易变得“无赖”，因为区块链协议通过算法验证交易，不需要信任实体。换句话说，很快就不需要金融交易所结算任何金融交易，即使是国际跨境交易。\n\
  \n区块链技术对金融行业的影响是巨大的，不仅在交易量方面，而且在金融行业的劳动力方面。中介在每个金融交易中都不是必要的，区块链将导致金融交易的自动化，并是以人类就业为代价。前景看起来糟糕，而且还会变得糟糕。\n\
  \n\n\n\n虽然劳动力市场将受到自动化和机器人化的影响，但终端用户将在各方面受益。更廉、更好的服务将是显而易见的优势，而欺诈和错误的减少则是附带收益。\n\n\
  # 加密骗局与独角兽表演\n\n比特币是加密货币世界的谜团，而区块链则是金融的革命。\n\n如果没有比特币，区块链将比预期中更久地处于“隐身”状态，随之来的还有\
  \ `FinTech` 以及整个金融领域的发展。\n\n与此同时，比特币创造了许多期待，但其中一些并没有实现。一种超越政府或中央银行控制的去中心化数字货币，是比特币神秘创造者中本·纳康个的终极愿景。\n\
  \n在现实世界中，稳定性对于任何货币或经济都是“关键**，而比特币在这方面遭遇了惨痛的失败。尽管电子商务和企业界在主流采用方面付出了巨大的努力和尝试，比特币仍未成为“日常货币”，而且很可能永远都不会成为。\n\
  \n现在很多人怀疑比特币的实验是否已经失败，它是否仅仅是加密货币信徒为了发财而推销的“蛇油”。还有人说比特币是一只独角兽，一种仅仅为了反抗而创造并注定失败的加密货币，而不是一种可行的支付手段或价值存储手段。少数人认为加密货币正遭受“发育停滞”，其应用潜力虽然存在，但由于主流采用程度极低而受到阻碍。\n\
  \n比特币项目启动多年，全球许多专家和经济学家仍无法对比特币的用途或价值达成共识。大多数经济学家反对比特币，而投资者持相反意见。\n\n然而，有一点是肯定的，谁购买比特币的人都发了大财。不需要高科技科学就能理解，比特币的价格从几分钱飙升到神奇的\
  \ 20000 美元水平，又回落到 3000 美元。有些人认为 20000 美元是峰值，而另一些人则坚信比特币很快就会从目前的低点反弹，冲向 10 万美元的平层高度。\n\
  \n只有时间能告诉我们比特币面临着什么，在此之前比特币将继续存在并以加速的速度增长。\n\n# 加密托管\n\n加密货币主流采用非常困难的主要原因之一是货币价值的稳定性，或者准确地说，是加密货币价值的不稳定性。即使是狂热的加密粉丝在使用加密货币时也面临困难，因为大多数加密货币的价值全天都在剧烈波动。\n\
  \n信用卡或借记卡并不一定让人感到舒适，交易可以即时处理，但当加密转换为法币或反之时，价值每分钟都在变化，使得几乎无法将加密货币作为“价值衡量”。\n\n相反，使用法币，真实货币的价值（以及与其他货币的汇率）在全天保持不变，可能在一年内保持稳定。从心理学上来说，知道商品或服务的价值在一段时间内保持不变，给日常消费者带来某种安全感和“公正感”。这种支付特定金额的感觉是“公平且合理”的，带给每个消费者购买和花费资金的信心。\n\
  \n为了对比，如果一个消费者花 2 美元买一杯咖啡，他会觉得被“欺骗了”，如果账单上的金额变成了 2.20 美元。\n\n即使这个金额在经济或储蓄方面意义不大，毕竟不会给一个人的财务状况造成巨大的痛苦或伤害，它仍然会影响那个人的想法和感受，这是因为没人喜欢被“欺骗”。\n\
  \n在现实生活中，对于大额物品，“价值幻觉”和“欺骗效应”被成指数级放大。想象一下用比特币买一辆车，购买时价值恰好为 20000 美元（金额仅为示例，不与实际价格有关），但当几周后信用卡账单出现金额时，由于从比特币转换为美元，金额已经上升到\
  \ 26124 美元（虚拟金额）。如果价值对美元下降了，账单金额仅为 21258 美元（虚拟金额），那么这个买车的人确实会非常开心。\n\n法币和加密货币之间不存在固定的汇率，除非商品是用加密货币购买并支付的，且账户是以加密货币计价。任何卖家都不会以加密货币出售商品或服务，因为价格在当天或特定时刻的演变可能会导致该笔交易变成巨额利润或重大损失。\n\
  \n有一个著名的故事，关于佛罗里达州的名为拉斯斯洛·哈尼茨（Laszlo Hanyecz）订购的披萨外送，他支付了 1 万个比特币——这 1 万个在当时（2010\
  \ 年 5 月 22 日）价值约 30 美元。\n\n按照目前 50000 美元的峰值（2021 年 2 月），今天那份披萨价值将是天文数字般的 5 亿美元！\n\
  \n“比特币披萨”现在是加密货币界的一年度盛事，因为它被认为是世界上第一笔也是最近最贵的比特币交易。\n\n这种情况在真实的法币上从未发生过，除非有人欺诈或实施了诈骗。即使从一种主要货币转换为另一种，汇率在当天也是“固定”的，通常汇率仅会在平均\
  \ 1-2%的狭窄范围内波动，尽管某些供应商和金融服务提供商无耻地收取过高的转换费。\n\n这种真实货币汇率的稳定性是影响购买力并驱动整个经济的原因，因为消费者知道他们辛苦挣来的钱的价值在一段时间内保持不变。\n\
  \n加密密钥是加密算法用于将明文转换为密文或反之的位串。该密钥保持私密并确保通信的安全。\n\n来源：Techopedia\n\n另一个大大问题是加密货币的实际交易元素。与可以计数和随身携带进行即时支付的真实实体货币不同，加密货币存储在所谓的加密钱包中，持有者拥有唯一的字母数字加密密钥（字母长度可达\
  \ 64 位，使得“破解密码”几乎不可能，但也很难记忆）。如果加密密钥丢失或被盗，加密钱包账户无法访问，更重要的是，加密密钥永远无法恢复，这意味着任何存储的加密货币都永远丢失了。\n\
  \n有很多疯狂且有趣的故事，关于加密钱包持有者丢失加密密钥并再也无法访问账户。有些人甚至因为丢失访问密钥而损失了财富。这是一个严重的问题，为了解决这个问题，许多“加密托管机构”正在提供安全甚至有保险的托管服务。持有加密货币这种笨拙且相当别扭的方式对于加密“持有者”和消费者来说仍然是一个主要缺点。\n\
  \n黑客攻击是另一个大问题，简单的黑客攻击导致了全球范围内大量的加密资产被盗。由于加密货币是以数字形式存在的，除非存储被盗加密货币的加密钱包所有者被追踪和识别，否则追回极其困难。\n\
  \n\n\n加密货币托管已成为加密货币初创领域的一个大趋势。在将来，持有加密货币将像拥有普通银行账户一样安全方便，这种便利性将推动加密货币的进一步普及。\n\n\
  # 机器人交易员与自动化财富生成器\n\n任何带有“robo（机器人）”字样的东西听起来都非常“无人化”且具有未来感。遗憾的是事实如此，因为这个世界很快就会变得越来越不像人类，而是机器人。\n\
  \n人类物种不会仅仅消失，除非全球对机器人开发和部署的伦理标准达成共识，否则机器人可能会接管一切。\n\n配备人工智能并连接到量子计算网格的核动力机器人将对我们人类物种构成威胁，全球的科学家已聚集在一起讨论方案，防止这种具有威胁性的事情真的发生。\n\
  \n与此同时，机器人技术的发展正以疯狂的速度持续进行，中国、日本和美国之间的竞争正白激烈。\n\n## 机器人流程自动化\n\n机器人流程自动化（Robotic\
  \ Process Automation）是一项新兴且快速扩展的技术，简而言之，它是一种由软件机器人和人工智能组成的先进“业务流程自动化”系统。\n\n`RPA`\
  \ 技术和机器人可以用于许多行业，汽车制造就是充分拥抱这两项技术的行业之一。毕竟，使用“输送带”装配线进行大规模汽车生产大幅降低了单位生产成本，使普通大众也能负担得起汽车。福特在上世纪之交开始，而自动化和机器人技术在\
  \ `21^(st)` 世纪将其推向了新的高度。\n\n在其他行业，`RPA` 和机器人的部署正在加速，但受到安全标准规则和劳动法规的阻碍。由于担心未来发生劳动力动荡，世界各地的工会誓言要反对机器人取代工人，这也是理所应当的。\n\
  \n亚马逊已处于领先地位，并正在尝试所有可能降低成本和增加利润的技术。从 `RPA`、机器人、无人机、穿梭车、飞行汽车、全自动分发枢纽到电池驱动的递送机器人，任何技术都在考虑范围之内，其中一些技术已经在爱沙尼亚和新加坡等对新兴技术接受度较高的地区投入使用。\n\
  \n机器人化和自动化将摧毁传统的劳动力市场，专家认为，在未来 10 年内，这将影响全球 50% 以上的劳动力。\n\n## 金融领域的机器人交易\n\n在金融行业，“robo”具有完全不同的含义。它更多地与算法用于价格模式识别和风险管理。在这方面，使用不受人类参与和情感影响的算法实际上非常有用的概念。整个金融市场都受到人类微弱的“恐惧与贪婪”情绪的影响，而通过基于算法的交易，这些情绪被有效地从金融方程式中剔除了。人类会本能地关闭任何进入亏损状态的亏损交易仓位——甚至为了寄于反弹的希望而继续持仓；而“机器人交易”只会考虑价格波动、成交量、市场情绪、即时新闻、历史数据、技术分析和基本面等真实因素，并严格按照代码参数使用算法进行交易。\n\
  \n## 自动化财富生成器\n\n“自动化财富生成器”是一个全新的金融科技（FinTech）概念，它结合了两者的优优势：提供投资指导和客户支持的专家顾问，以及确保盈利的算法交易，外加有效的风险管理。\n\
  \n利用代币化（区块链数字资产代币化）的新型“财富管家”将创造一个全新的行业，取代传统行业。\n\n老式的财富管理和私人银行除了适应之外别无选择。\n\n\n\n\
  \n像`摩根大通`、`高盛`或`美国银行`这样声誉显赫的投资银行和精英金融机构绝不会消失或没入历史。他们会经历一个转型期，最终处于数字鸿沟的彼岸，完全沉浸在加密领域并再次制定规则。\n\
  \n区块链的去中心化本质将受到未来全球金融机构和银行许可制`DLTs`的挑战，唯一的区别是用户群体将从企业客户转向自决的终端用户。\n\n华尔街将永远是美国金融的核心与灵魂，但技术将创造出虚拟的`华尔街`，金融交易将在区块链和云端进行。旧系统将被极速光纤和卫星连接取代，机器人技术将在人工智能和量子计算的指导下运行。\n\
  \n如今传统的股票经纪人将被“机器人交易员”取代，交易所将变为虚拟化、自给自足和自我治理的。\n\n在不久的将来，银行业和投资将不再通过现今传统银行和交易所的金融网络进行，而是通过未来的区块链协议进行。\n\
  \n新的全球`华尔街`将负责未来的金融和全球经济，但那支获得财务赋权的大军将是一股不容忽视的力量。\n\n# 第十一章：99%的去中心化\n\n## 百分一\n\
  \n金钱统治世界。\n\n过去如此，未来也必如此。\n\n在整个历史上，金钱在控制与权力之间起着至关重要的作用。拥有金钱可以将其交换价值或留作保障。它还赋予了权利和特权。金钱是交换媒介、价值尺度手段和衡量单位。拥有巨款的人可以行使控制，这赋予了终极权力。正因如此，货币供应具有稀缺性，通过控制货币供应，古代的统治者和现代的中央银行影响货币价值，从而在全球范围内行使控制权。\n\
  \n自古以来，金钱就是“权力的代理”。在那个时代，廷臣在堡垒和城堡中为当时推崇的、近乎神圣的王后提供建议。在现代，国王的法院已被议会取代并由政府管理。在秘密的高层中，政府可以通过政治关系或由“大公司”资助的、现代廷说客受到控制，以影响立法和违法。法律的通过是为了特权和保护某个行业，而法律的违背是为了攻击某个主权国家，这两者的界限相当模糊。\n\
  \n在当今高度连接的数字世界中，金钱的交换已采取了不同的形式。它是数字化的、极快的，几乎可以存储在任何地方。\n\n进入这 1%——世界的超级精英，他们通过所有权、控制和技术掌控全球经济和金融市场。这些是强大的家族王朝，通过影响力、金钱和控制掌控广阔的经济版图。在美国，有\
  \ 60 个家族形成了“精英阶层”的一部分，其中包括`洛克菲勒家族`、`范德堡家族`、`梅隆家族`、`杜邦家族`、`阿斯家族`、`华堡家族`和`摩根家族`。这些王朝代代传承财富和权力，确保政治和全球经济中的影响力保持在精英的封闭圈子内。\n\
  \n在 20 世纪初，金钱、权力和影响力集中在“货币信托”中，其中包括`洛克菲勒家族`、`罗斯柴家族`、`摩根家族`和`华堡家族`。\n\n1910 年 11\
  \ 月，在佐治亚州外杰基尔岛的一次秘密会议上，`联邦储备体系`的奠被奠定。会议极其保密，直到大约 20 年后大萧条开始时才被揭露。直到今天，还没有人真正知道`联邦储备体系`的真实股东是谁，该体系由\
  \ 12 家`联邦储备银行`组成，它实际上是一个私人公司，而非联邦政府机构。由于`联邦储备委员会`是美国的中央银行，负责货币政策和管理通胀，它行使着巨大的影响力和权力，不仅影响美国经济，也影响整个全球经济和各国财富。通过“伦敦联系”，人们认为`罗斯柴家族`在`联邦储备委员会`中拥有最大的影响力，并延伸到全球金融银业。\n\
  \n`洛克菲勒家族`和`罗斯柴家族`是两个最强大的家族王朝，掌握着巨大的权力并控制着全球金融银行业的大部分地区。他们对金融市场的控制以及对全球政治格局的影响是前所未有的，据估计，通过私有持有`高盛`和其他金融机构，`罗斯柴家族`的财富超过了\
  \ 6000 亿美元。\n\n`罗斯柴家族`对全球经济的影响像一只章鱼，触角伸向各处。他们拥有这个世界。\n\n## 美国美元帝国主义\n\n如今的美国美元被视为“全球储备货币”，这在尼松总统于\
  \ 1971 年 8 月 15 日单方面暂停美元兑黄金的兑换很久之后，这一举措实际上结束了布雷顿森林协议。从那天起，美元正式成为一种法币。\n\n总部位于华盛顿特区的强大机构如`国际货币基金组织`和`世界银行`——确保了美元的霸权。\n\
  \n更重要的是，美元是某种“弹性货币”，这意味着`联邦储备委员会`可以根据需要通过随意打印更多货币来扩大货币供应，这通常被称为“量化宽松”。\n\n对于世界其他地区，基于巨大的流动性和`美国主权债`的海量市场，`美国国债`被认为是“安全”的。\n\
  \n在取消布雷顿森林协议后，美元已不再与金本位挂钩，但其影响力仍然非常强大。这与美国作为全球经济和军事强国的地位有关。在金钱无法影响的地方，军事力量一定可以。\n\
  \n在银行和金融界，强大的美元仍然占据着至高地位。\n\n全球大部分金融交易均以美元进行，全球货物和商品贸易很可能用美元支付。这导致全球政府和公司对美元产生了巨大的需求。\n\
  \n任何交易美元的银行很可能在美国设有子公司、分行或办事处，很可能在纽约。\n\n为了能够进行美元交易，银行必须是美元体系的一部分。相反，被排除在美元体系之外或被拒绝在美国业务，通常意味着任何大银行的“瞬间死亡”。\n\
  \n底线是美国政府和诸如`财政部`、`联邦储备委员会`、`五角楼`、`CIA`、`FBI`、`司法部`和`国税局`等机构，因为美元霸权而行使着巨大的权力。如果这不起作用，封锁或战争的威胁就会奏效。\n\
  \n在 9/11 袭击后，美国以“反恐战争”为名义，发起了全球范围内的对抗行动。要么配合，要么承担后果。\n\n而且这不仅限于协调的军事打击，还包括秘密军事行动、大规模的反洗钱打击，以及对隐私的公然侵犯。正如乔治·W·布什总统所说：“你要么支持我们，要么就是反对我们。”\n\
  \n世界顺从了。\n\n## 全球货币控制\n\n“谁控制粮食供应谁就控制民众；谁控制能源谁就能控制整个大陆；谁控制金钱谁就能控制世界”\n\n引用：亨利·基辛辛\n\
  \n\n\n\n1944 年的布雷顿森林协议建立了二战后首个国际货币秩序，并确立了美国、加拿大、西欧、澳大利亚和日本之间的商业与金融关系。\n\n受布雷顿森林协议的影响，国际货币基金组织（`IMF`）和世界银行（最初名为“国际复兴与开发银行”）应成立。\n\
  \n布雷顿森林协议的首要目标是让每个国家采取国家货币政策，通过将其货币与黄金挂钩，将汇率维持在 `1%` 以内，并赋予 `IMF` 弥补临时“收支不平衡”的能力。此外，当时还需要解决其他国家之间缺乏合作的问题，并防止货币的“竞争性贬值”。\n\
  \n另一个强大的机构是总部位于瑞士巴塞尔的“巴塞尔银行监管监督委员会”（`BCBS`）。`BCBS` 是一个由各国银行监管机构组成的委员会，由“G 十国”中央银行行长于\
  \ 1974 年建立——令人惊讶的是，它并没有创始条约。其目标是促进全球范围内银行监管标准的趋同并提高其水平。《巴塞尔 III》协议是 `BCBS` 向成员国提出的关于银行资本充足性、压力测试和市场流动性风险的最新全球（但自愿性的）监管框架。\n\
  \n美国政府联合财政部、联邦储备委员会以及 `IMF`、世界银行和 `BCBS` 等强大机构，对全球经济以及依赖美元援助的第三世界国家施着非常强的影响。\n\n\
  通过联合国和联合国安理会，美国政府不仅能在全球范围内影响政治，还能发起制裁，并在必要时，对“流氓”国家协调军事打击，例如伊拉克、阿富汗，以及如果可能持续违反联合国制裁和决议的朝鲜。\n\
  \n由于这种权力的集中，美国政府能够对全球政治以及经济政策施加非常强大的影响，从而维持其在全球的美元霸权。\n\n一个大问题是，加密货币终有一天会取代强大的美元和其他所有法币吗？\n\
  \n# 失控的债务\n\n我们所知的货币已不再如此，其意义和价值随着时间的推移而不断侵蚀。全球各央银行在没有必要储备支撑的情况下印钞。这种做法暂时平息了局面，并被方便地称为“量化宽松”，即“缓解衰退经济的痛苦”。\n\
  \n最大且最强大的是美国“联邦储备银行”。与流行观点相反，通常为人知的 `Fed` 并不是一个完全的政府机构或部门，而是一家受美国政府授权保护的私营美国公司。\n\
  \n`十二家地区联邦储备银行的建立是作为该国中央银行体系的运作部门。它们的组织方式非常像私营公司（例如 `FedEx`），这可能导致对其所有权的某些困惑。联邦储备银行具有中间法律地位，既具有私营公司的特征，又具有联邦公共机构的特征。`\n\
  \n在 `Lewis v. United States` 案中，美国第九巡回上诉法院指出：“储备银行并非 `FTCA`（《联邦侵权责任索赔法》）项下的联邦机构，而是独立的、私营的且受当地控制的公司。”\n\
  \n关于十二家联邦储备银行与各种商业银行（成员银行）之间的结构关系，政治学教授 Michael D. ...\n\n来源：维基百科\n\n关于十二家联邦储备银行与各种商业银行（成员银行）之间的结构关系，政治学教授\
  \ Michael D. ...\n\n（注：提供的文本在后半部分包含几处破碎或重复的句子。我根据指令保留了核心叙述流，以清理格式。）\n\n\n\n存在着整个“债务”行业，金融公司以“每美元价值几分钱”的价格买卖整合债务。信贷公司允许——甚至**邀请**你将债务从一张信用卡转移到另一张。\n\
  \n问题是，为什么会有人买入或出售债务呢？\n\n答案非常简单：因为债务能产生收益。\n\n首先，对于“无担保”贷款（如学生贷款，尤其是“发薪日”贷款），收取的利率极其高——取决于你的信用状况、违约率和其他其他变化因素，利率从每天\
  \ 1% 的利息到远超掠夺性的年化收益率 `1000%`（或其倍数）不等。\n\n“发薪日”贷款拥有业内最高的利息之一，但违约率也非常高。\n\n其次，高昂的逾期费、罚金以及法律/法院费用可以使任何债务成倍增加。小额债务变成大额债务，债务人会发现自己陷入了无休止的债务螺旋循环，个人信用评分破产，甚至被列入黑名单。\n\
  \n第三，债务可以在内部市场和二级市场以“每美元价值几分钱”的价格出售。即使这样会有亏损，贷款的一部分仍通过这些债务交易收回。\n\n因此，起初看起来是一个复杂且无回报的商业模式，实际上对于接收方来说是一个非常有利的商业提议。\n\
  \n当出于任何原因需要资金时，政府可以简单地增加税收、减少政府支出、发行政府债券（债务）、本币贬值或直接印刷更多货币。后三者是最的，因为任何对货币的“操纵”都会侵蚀公众信任，并可能导致货币无法挽救的稳定。\n\
  \n# 货币的终结与无现金社会\n\n在世界上大多数国家，现金仍然是王。\n\n瑞典是世界上最先进的无现金国家，超过 90%的支付是通过信用卡完成的。在瑞典各地的商店、酒吧和餐厅的门和橱窗上，甚至贴着“不接受现金”的告示。\n\
  \n在挪威，你的信用卡兼作你的官方身份标识，你最常用的信用卡背面列有你的照片和个人信息。\n\n即使在德国、日本和美国等发达国家——这些国家正认真考虑在未来实现无现金化——现金仍然占据主导地位。\n\
  \n如未纳税的“黑钱”和犯罪的“脏钱”等经济因素对全球经济有贡献，但这些非法且未纳税的资金并未计入政府官方统计数据和经济指标，因为它们是不可追踪的。\n\n印度近期在抑制“黑钱”流通（特别是大额钞票的发行）方面的失败并未达到预期效果，唯一的收获是想要存款或取款的普通人在银行门口排了极长的长队。\n\
  \n要实现全球范围内真正的全球无现金社会，需要政府、中央银行、联合国、国际货币基金组织（IMF）和世界银行之间的全面合作。这样一个全球性目标需要所有相关政府投入大量的时间和精力，而且无现金社会的可行性将无法保证。\n\
  \n黄金、银、钻石和其他“价值存储手段”——甚至是普通的白米（过去和现在都作为支付手段）——将作为替代方式重新出现。\n\n\n\n\n从第一次工业革命到如今的数字革命，整个行业由于技术突破而发生了颠覆或简单地消失在历史长中。\n\
  \n当蒸汽机被柴油机取代时，所有主要工业国家都出现了一个全新的行业。制造节奏大幅加快，产出涵盖了普通大众有用的任何物品。\n\n`Ford Motor Co.`\
  \ 的“T 型车”是第一款在流水线上大批量生产的、由可互换零件组成且负担得起的汽车。\n\n它的是如此成功，以至于在`20^(th)`世纪初在美国催生了整个汽车制造行业。\n\
  \n第二次世界大战后，电视取代了广播成为新闻和娱乐的主要来源，这种转变一直持续至今。\n\n在 20 世纪 80 年代，家用电脑进入了美国住户，而到`21^(st)`世纪初，手机接管了主要的通信方式。\n\
  \n尽管在 1996 年 8 月发布了`Nokia 9000 Communicator`（官方认的第一款智能手机），但由于其价格昂贵，它从未实现主流普及。\n\n\
  当史夫·乔布斯在 2007 年发布第一款`Apple iPhone`时，它风靡全球。\n\n它是第一款易于使用的、具有多点触控的智能手机，其应用让用户极其惊喜。\n\
  \n从那时起，手机中被嵌入了更多功能，以至于它更多地像是一台微型个人电脑而非手机。随之，数字成瘾运之生。\n\n随着每项新技术的出现，技术周期变得越来越短，同时也在加速，将用户留在了“技术尘埃”中。这种速度毫无中断地持续着。\n\
  \n后果不容低估，因为社会进步的速度实际上会导致压力和焦虑等心理健康问题。\n\n应用程序的设计使用了行为心理学、神经科学和游戏理论，以“增强”用户体验。有些应用更进了一步，添加了赌博元素——变动奖励——来增加应用程序的“粘性”。\n\
  \n虽然有人认为这是数字成瘾，但另一些则声称这只是“注意力经济”的一部分，即围绕广告行业需求构建的互联网。无论如何，青少年对手机的使用量急剧增加，导致在某些国家教室里不再允许使用手机。这很有道理，年轻人的注意力跨度下降得如此厉害，以读一本书或看完整部电影都变成了一种挑战。\n\
  \n这种技术加速——结合信息过载——已经达到了大多数普通人无法继续跟上的程度。生活的美容和愉悦被缩减为盯着便携式平板屏幕，像没有明天一样地飞速打字，同时又错过了生活。\n\
  \n智能手机制造商已经意识到了这个问题，并现在整合了提醒用户过度使用的功能。\n\n当智能手机在个人层面影响我们时，它也通过创建提供我们通常需要面对面获取服务的应用程序，扰乱了整个行业。\n\
  \n一个主要的例子是`Amazon`，在那里，任何物品都可以在线订购并在第二天送货上门。这种便利性摧毁了全球许多实体零售店，且这种趋势仍在毫无中断地持续。\n\n\
  随着技术的发展，它将导致更多的伤亡，特别是在劳动力市场。自动化、机器学习和机器人技术很快就能比人类同伴更好地地完成任务，这将导致许多人失业。\n\n据估计，在未来\
  \ 10 年内，一半以上的劳动力将消失，机器人将取代人类成为工人。\n\n这个问题是如此令人警觉，以至于`IMF`、`World Bank`和联合联合国正在讨论应对措施。\n\
  \n但看起来，我们已经太晚了，伤害已经造成。\n\n## 对颠覆征税\n\n坚决的反对者认为，对于每一个被机器人取代的工人，都应该征收“机器人税”。其他人则认为，使用机器人的公司应该缴纳更高的税，然后还有那些“愚的少数人”，他们认真地相信其他工作和职业将随着目前工作的消失而并行发展。\n\
  \n事实是，自动化和机器人流程自动化已经在扰乱整个行业，从汽车制造到零售业，从银行到保险。当`blockchain`技术实现主流普及以及其他技术发展到某些任务变得完全过时时，额外的“去中间化”将成为现实。\n\
  \n除了抗议和可能的民乱外，世界各国政府现在就应该采取措施，对在易自动化影响行业工作的工人进行重新教育。此外，应该建立激励机制，让工人有机会提前退休。\n\n\
  但最有效的措施是对颠覆行为征收利润 25%的税。这个比例偏高，但它可以在补偿失业者的同时，震慑大公司不要简单地用自动化和机器人取代其劳动力。\n\n## 数字起义\n\
  \n随着技术的进步带来了许多积极影响，也有负面影响。\n\n连锁反应是不可预测的，并产生许多意想不到的结果。\n\n技术旨在造福人类，但遗憾的是，它主要用于企业贪婪。今天的科技巨头正利用技术获取市场份额并增加利润，而没有对客户给予应有的考虑。\n\
  \n虽然许多措施正在构量中，但最好且最有效的措施是教育。教授新一代工人目前需求或未来将需要的技能，将产生最好的结果。当然，并不是每个学生都想成为编码员或计算机科学家，然而，给每个学生提供选择比失业是更好的替代方案。更重要的是，可以创建和培养其他职业，为高技能计算机编程或其他复杂职业提供替代方案。\n\
  \n在创意产业中，有很多机会创造出可以吸引新一代的工作，而这些工作总的无法被机器人取代。\n\n数字起义将是微妙但必要的，以确保后代不再与机器人竞争。防胜永远胜于治疗。\n\
  \n# 第十二章：财富的民主化\n\n### 比特的零地\n\n在 2018 年底的一个月内，`Bitcoin`大跌了 45.92%，跌破 3500 美元支撑位，加密双胞胎`ETH`也损失了\
  \ 56.71%，`XRP`滑落了 40.26%。在几次机会中这三种主流加密货币再次反弹到更高水平，随后又跟了下跌。\n\n“跌-升-跌-重复”的持续循环。\n\
  \n“比特币让人们从在现代市场经济中运作中解放出来”来源：`Tim Draper`引言。\n\n交易`Bitcoin`就像在德克萨斯牛仔竞技表演中骑一头 1000\
  \ 磅的牛。\n\n2021 年 2 月 8 日，`Bitcoin`达到了 48000 美元的历史新高。\n\n\n\n\n比特币的技术交易极具挑战性，而且对于一种在短时间内发生剧烈上下波动的金融工具来说，并不一定有用。\n\
  \n在技术交易中唯一真正有用的金融指标是成交量、支撑位与阻力位，以及生产成本基准——即挖矿成本，特别是电费。\n\n## 中国对比比特币的规定\n\n与此同时，中国已确立了全球比特币挖矿之都地位，通过其巨大的矿池控制了全球挖矿总算力的大部分\
  \ 71%（算力是衡量矿工计算能力的指标）——尽管中国在 2017 年禁止了比特币、所有加密货币以及 ICO（使用加密货币和智能合约作为支付手段和价值转移手段的首次代币发行）。\n\
  \n通过快速对比，主要加密货币产国的挖矿成本（2020 年平均挖矿成本）：\n\n- 中国 - $3.172\n- 俄罗斯 - $4.675\n- 冰岛 - $4.746\n\
  - 美国 - $4.758\n\n建立加密货币挖矿成本“基准”非常有挑战性，因为比特币的挖矿成本差异巨大，从最便宜的委内瑞拉（令人惊讶地仅为 $531）到南韩国惊人的\
  \ $26,170（市场数据由 Elite Fixtures 提供）。\n\n更有趣的是，南韩国拥有世界上最便宜的电费之一，仅为 $0.12/ – 也就是 12\
  \ 美分，在 Statista 的全球排名中位列第四便宜。\n\n显然，南韩国在比特币生产成本方面是一个离群值，或者电费单价与实际总生产成本之间存在扭曲的相关性，因为后者还考虑了劳动力成本、进口关税、ASIC（专用集成电路）矿机的维护费用以及税收。\n\
  \n中国的成本位列倒第二，为 $0.08/kW，而全球最便宜的是阿根廷，那里 1 千瓦电仅需 $0.01/kW – 仅为美元的一分之一。\n\n排除极端情况，平均加密货币挖矿成本在\
  \ $3,000 至 $6,000 之间。\n\n除了电费外，其他起作用的因素还有环境温度（用于矿机冷却）、挖矿设施的维护和劳动力成本，这使得中国成为世界上挖掘比特币（或任何其他加密货币）最便宜的国家。中国通过利用极廉且受补贴的煤炭供应“燃烧能量”进行加密货币挖矿，将效率进一步推进了一步。\n\
  \n与大众认知相反，比特币挖矿比黄金生产更环保、更可持续，黄金生产的碳足迹比加密货币大得多。\n\n神秘且孤立的朝鲜并未在任何研究或全球统计中被，但可能会因为极低的劳动力成本以及补贴的煤炭和水能而击败中国和委内瑞拉。\n\
  \n作为一种“不受欢迎”的奖励，朝鲜极寒的天气导致加密货币挖矿设施内环境温度较低这是另一个非常有效的成本降低因素，因为低温有利于矿机冷却，从而进一步降低了电力消耗。\n\
  \n中国主导比特币的秘密实际上是“中心化”，这与比特币所代表的无国界和去中心化理念完全相反。\n\n但将如此多的加密货币挖矿能力“集中”在像中国这样的任何一个大国手中，会使比特币暴露在令人担忧的政治风险之中。\n\
  \n如果有一天中国政府决定打击比特币（或所有主要的加密货币），可能是因为将加密货币视为对中国经济的威胁，或视为对其计划中的数字主权货币不受欢迎的竞争者，中国可能会对全球比特币及整个加密货币造成无法估量的破坏。而加密货币不可预测性正是加密货币进入主流时最不需要的东西。\n\
  \n## 共产主义资本主义与影响技术圈\n\n在一个句子中出现“共产主义”和“资本主义”两个关键词，听起来非常奇怪，看起来也不对，但在某种意义上它是真实存在的。\n\
  \n中国绝不是一个民主国家，也不是自由权利的倡导者，但它提供了比世界上大多数国家更多的财务成功机会。一个演变为“共产主义资本主义”的共产主义政权，首先是在其境内，然后是通过香港的“移交”，现在则是通过技术征服世界。这是一个不容忽视的力量。\n\
  \n然而，美国对此持反对意见。它自认为世界超级大国，是因为拥有世界上最大的经济体（自 1871 年以来持续如此），当然还有世界上最强大、技术最先进的军队。在资本和技术方面，美国有很多可以提供的，硅谷是风险投资卓越的典范，也是美国创业精神的中心。其大型成功的科技公司名单令人印象深刻，与中国科技公司相比；大多数美国科技公司都拥有知名的品牌，并闻名全球。\n\
  \n中国也有许多数十亿美元的科技公司，但在境外知名的并不多，因为中国禁止许多外国公司在中国经营，并只支持自己的公司，优先考虑那些遵循执政党路线（即审查和监视）的公司。\n\
  \n世界可能对中国的人权记录存在分歧，但可以说监控、压迫、服从和一致是共产主义政权不可分割的一部分。与之形成鲜明对比的是，中国极具野心，在非常短的时间内执行大型基础设施项目，有时只需几个月而非几年，并投入必要的预算以确保计划顺利实施。目前，面临新冠肺炎肺炎和遭受封锁打击的经济，中国正承诺在未来五年内向\
  \ 5G、网络安全和工业自动化等不同行业投入 1.4 万亿美元的巨资。媒体巨头彭博将其誉为“中国的科技狂欢节”，并写道，流入“技术过山车”的无尽资金流无法长期维持。相反，中国永远不能被低估，许多按计划完成的成功基础设施项目证明了北京在其境内创造一个“科技超级经济”的决心，这种经济将通过数字霸权影响外部世界。\n\
  \n\n\n\n`Huawei` 是近期新闻报道中的中国科技明星之一，这是一家在技术领域脱颖出的公司，特别是在 5G 网络组件和部件的供应方面。就在几年前，它还受许多政府委托提供\
  \ 5G 设备，甚至美国和英国也签署了协议，但在新冠肺炎期间被撤销了。目前尚无法得知或量化许多指责中国是疫情根源的这种“指责”在多大程度上煽动或影响了对“华为”的禁令，但看起来华为似乎为其所属政府遭受了间接的“惩罚”。更重要的是，许多国家最大的担忧之一是中国可能进行间谍活动，或通过\
  \ 5G 网络输送间谍软件，这导致某些国家，特别是美国、英国和澳大利亚（“五眼”联盟的关键成员——缩写为 `FVEY`——该联盟还包括加拿大和新西兰）在财务和交付周期上付出了巨大的代价，取消了合同。据估计，延迟取消华为并转用诺基亚或爱信构建\
  \ 5G 网络将导致长达 3 年的严重延误，并耗超过 25 亿美元，而此时英国已经承受着脱欧带来的巨额成本负担。人们还认为，美国在持续且恶化的中美贸易战中对中国进行了报复，此无意中导致了两个巨大的“技术影响圈”的形成，一个是中国，另一个是英语世界的主要经济体以及欧盟。\n\
  \n可以说，这是硅谷对阵硅谷龙，而这条龙似乎正在一个接一个地击败它的科技宿敌。\n\n## G20 加密货币征税 – 祸中得福\n\n“我们将根据 `FATF`\
  \ 标准对加密资产进行反洗钱和打击恐怖主义融资的监管，并根据需要考虑其他措施。”\n\n来源：G20 官方声明（2018 年 12 月）\n\n在最近于布宜诺斯艾利斯行的\
  \ G20 峰会上，广泛讨论了全球加密货币征税和监管的初步步骤。从任何意义上说都是积极的发展，因为全球范围的税将带来加密货币的主流采用以及透明度，更重要的是，使资金流可追溯。\n\
  \n目前，`Bitcoin` 和许多其他加密货币仍饱受与洗钱和犯罪相关的“脏钱”污名。尽管仍有大量洗钱活动通过 `Bitcoin` 和其他加密货币进行，但全球执法机构已意识到了这一现实，并积极追踪全球范围内的非法转账，偶尔会有重大的破案或公开的成功案例。\n\
  \n`Bitcoin` 具有无国界、去中心化且基于公共区块链，为调查人员提供了追踪大量 `Bitcoin` 移动及相应钱包地址的可能性；然而，识别钱包所有者完全是另一回事，因为\
  \ `Bitcoin` 交易隐藏在匿名性之中。只有通过专业的 `Bitcoin` 专家团队共同努力，才能追踪全球范围内大规模 `Bitcoin` 转账的流，而大多数国家没有财力或人力来追求这种耗时且艰巨的活动。\n\
  \n征税将成为最终的规则改变者，因为它将迫使加密货币持有者和托管人（全球加密交易所和钱包提供商）履行披露义务。这样做不仅会让持有者的地址变得可追踪并承担责任，更重要的是，让官方和受监管的资金托管人承担责任。由于这些托管人凭借其功能性的在线交易所或平台而更容易被追踪，报告责任主要落在托管人身上，而根据法律，托管人可能会受到调查、起诉、罚款、监禁、禁入甚至被关停。\n\
  \n当然，目前存在许多漏洞和规避手段来隐瞒加密交易和隐藏加密资金，但征税方面绝对会将加密货币纳入税务机关和司法部门的雷达范围。\n\n如果有人怀疑某些税务机关的决心或被抓获的可能性，可以尝试一下美国国税局（IRS\
  \ Service）。\n\n《海外账户税收合规法》（`FATCA`）作为 `HIRE Act` 的一部分通过，通常要求外国金融机构和某些其他非金融外国实体报告其美国账户持有人持有的外国资产，否则将对“应扣税款项”进行扣缴。`HIRE\
  \ Act` 还包含要求美国人士根据其价值报告其外国金融账户和外国资产的立法。\n\n来源：`IRS`\n\n`IRS` 在全球许多国家和司法辖辖区执行了 `FACTA`，并成功抓住了许多“逃税者”（美国对逃税者的说法）、洗钱者和犯罪分子。`IRS`\
  \ 拥有巨大的权力，以至于在 2009 年，它甚至迫秘密银行天堂瑞士屈服于 `IRS` 的执法，并羞辱了强大的 `UBS`（瑞士联合银行），要求其披露并公开 52,000\
  \ 名美国公民的银行账户信息，即使这些账户受到严格的瑞士银行保密法的保护。在调查并被正式指控“协助和唆使”逃税后，`UBS` 被迫和解，并向美国司法部支付了高达\
  \ 7.08 亿美元的天数字罚款——正式名称为“有限延期起诉协议”，以维持其美国分支和银业务的运营。\n\n从任何角度衡量，`IRS` 的策略都是“边缘违法的”，但可以通过一个“魔术”来执行：任何外国银行的“不合规”意味着他们将被禁止并排除在\
  \ във领土内运营任何分支，这种严厉的措施取得了令人惊叹的结果。许多美国 `UBS` 逃税者由于最终被 `IRS` 起诉，现在是在美国的监狱里度过圣诞节，而不是在瑞士阿尔卑斯山；在执法过程中，美国政府现在建立了一个德国、法国、比利时和以色列等国家所效仿的先例。\n\
  \n在全球范围内——通过商定的多边税收条约执行——抓捕和起诉逃税行为可能会产生巨额罚款。更重要的是，在全球范围内以数字资产或货币形式收回未缴税资金，将激励任何税务机关采取行动。\n\
  \n## 全球加密货币监管\n\n`Bitcoin` 以及加密货币目前在各自美国联邦机构的分类如下：\n\n`SEC` - 证券及交易委员会 - 证券\n`IRS`\
  \ - 美国国税局 - 财产\n`CFTC` - 商品货期货交易委员会 - 商品品\n`FINCEN` - 金融犯罪执法网络 - 资金\n\n并不是这些优秀的政府机构缺乏词典或不知道如何定义加密货币，而是它们的章程阻止了它们监管尚未明确定义或不属于其管辖范围参数的资产类别或金融工具。加密货币在不同形式、不同环境中都是上述所有定义，具体取决于管辖权和适用法律。\n\
  \n如果加密货币无法在全球范围内被精确定义，那么全球范围的监管几乎是不可能的。\n\n## 巨鲸观察与加密货币挖掘\n\n在 2018 年，随着 `Bitcoin`\
  \ 跌破每一个支撑位，这种跌势似乎不可阻挡，但在某些水平上，三种主要的加密货币似乎找到了强有的技术支持。\n\n`Bitcoin` 在 2018 年曾围绕 6,400\
  \ 美元的支撑位徘徊了相当，并在 2019 年初围绕 3,500 美元水平徘徊，偶尔低于 3,200 美元的关键支撑位——也是比特币挖矿成本的基准。\n\n\n\
  \n\n一旦比特币跌破 3200 美元的关键支撑位，它可能会一路自由跌落至 1000 美至 1500 美元之间的水平。\n\n比特币挖矿基准具有至关重要的意义，因为在该支撑位以下，全球\
  \ 90% 以上的矿业行业在经济上已不再可行。中国占据主导地位，拥有 71% 的市场份额，其最大的矿池 `AntPool` 占据了 21.9% 的巨大算力，其次是\
  \ `BTCtop` 的 13.8% 和 `F2Pool` 的 8.6%（根据 2018 年的数据）。\n\n随着比特币挖矿从“单机挖”发展到“家庭工业”，再到现在的“工业化水平”，游戏规则已经改变。比特币矿工不仅集体组织成矿池，而且通过结盟，他们可以有效控制比特币的供应，并以此在某种程度上影响比特币的价格。\n\
  \n在 `CryptoWatch` 上发布的一篇文章（2018 年 12 月 4 日）中，圣克拉拉大学金融学教授 Atulya Sarin 教授表示（他在《跨国财务管理基础》一书中写过关于货币的内容），如果比特币的价格跌破其挖矿成本，挖矿的动力将会恶化，将比特币推入“死亡螺旋”。也就是说，如果没有支持维护记录谁拥有什么的账本记录的挖矿活动——比特币毕竟是一组加密数字，无法建立任何东西的所有权——比特币将变得一文不值。\n\
  \n另一方面，比特币巨鲸并不会坐视旁睁看着他们巨额的加密资产蒸发，他们会在比特币价格下跌时卖出，并在每个比特币价格周期的底部买入大量资金。\n\n## 疯狂教授与经济巫师\n\
  \n“看待加密货币的正确方式是将其看作彩票，这些彩票将在一个乌托邦式的未来获得回报，届时它们将用于那些流氓和失败的国家，或者可能是在公民已经失去所有隐私迹象的国家。功能混乱的委内瑞拉成为第一个国家支持的加密货币\
  \ `Petro`，这并非巧合。”\n\n来源：Kenneth Rogoff 的引言\n\n国际象棋大师、前国际货币基金组织首席经济学家、哈佛大学经济学教授 Kenneth\
  \ Rogoff 在《卫报报》（2018 年 12 月）中将比特币描述为“疯狂的”和“彩票”，并称其长期价值“更有可能是 100 美元而不是 100,000 美元！”\n\
  \n最近，`Allianz Global Investors` 的首席执行官 Andreas Utermann 加入了抨击比特币的行列，要求对所有加密资产进行“非法化”。\n\
  \n与此同时，比特币支持者、反传统观点者 Tom Lee 表示，“比特币的公允价值远高于其当前价格，它最高可以达到 150,000 美元”。\n\n老实说，没有人真正知道比特币、`Ether`\
  \ 或任何其他加密货币将去向何方，但有一点是肯定的，在当前的崩溃结束后，比特币将再次崛起。\n\n对于加密货币支持者来说，尽管这听起来可能政治不正确，但比特币永远有一个“用例”，即使不是作为“合法”数字货币的合规传输和存储，也绝对用于洗钱和犯罪资金转移等非法活动，除非全球监管启动以防止这种情况。\n\
  \n## 比特币从灰烬中崛起\n\n“如果你有时间，它就会出现。它不会在三个月或一年内发生，而是在两到三年内，这是进入加密货币市场的黄金时间。”\n\n来源：Tom\
  \ Lee 2018 年引言 – Fundstrat Global Advisors\n\n比特币的未来目前非常动荡，分歧的双方都有太多的反对者和支持者。\n\n\
  比特币价格越低，加密货币矿工为了收回投资而进行的恐慌抛售就越多。\n\n另一方面，加密巨鲸将 2018 年的比特币崩溃视为买入比特币和其他加密货币的机会。\n\n\
  无论未来为加密货币准备了什么，从灰烬中崛起将是一场漫长的旅程，并将给比特币信徒一个前所未有的壮丽反弹。这就是为什么加密粉丝们应该 `HODL`（正如加密圈所熟知的，意为“持有”）。\n\
  \n## 代币化——金融与财富创造的新边界\n\n“一个大胆的愿景。一个根本性的转变。我们相信现在是时候颠覆资产获取了”\n\n来源：Olga Feldmeier，Smart\
  \ Ag AG CEO\n\n富有魅力且坚不可摧的 Olga Feldmeier——2018 年苏黎世加密+ICO 峰会的主持人和主演讲者——最好地总结了这一点：万物代币化将造福我们所有人。\n\
  \n她正通过她的区块链初创公司 `Smart Valor AG` —— 一位于加密小镇楚格的瑞士公司来实现这一点，在大范围内对数字资产进行代币化。\n\n这种从“机构化证券化”到“去中心化代币化”的颠覆性范式转变将影响整个银行业业，从资产管理到债务，以及其间的一切。\n\
  \n代币化将为市场参与打开“大门”，从而使全球金融市场更具流动性，并将深刻影响全球贸易和金融，导致前所未有的经济扩张。\n\n这是指数网络效应乘以百万。\n\n\
  考虑到这一点，想象一下任何人都可以无需中介即可交易金融市场并进行投资？\n\n并且能够获得只有经纪人和银行——这些守门人和资金提供者——才拥的信息和投资？\n\n\
  区块链投资平台将使大众市场投资者能够真正参与盈利性投资——那些改变世界的优质初创公司——从一开始，即种子阶段，就有风险管理算法保护投资者免受损失影响。\n\n\
  财富创造将产生全新的意义，真正的赢家将是大众，即通过代币化参与金融和投资世界的财务独立投资者。\n\n### 影响力投资\n\n影响力投资旨在产生积极的、可衡量的社会和环境影响，同时获得财务回报。影响力投资可以在新兴市场和发达市场进行，目标回报范围从低于市场水平到市场利率不等，取决于投资者的战略目标。\n\
  \n不断的影响力投资市场为解决世界上最迫的挑战提供资金，涉及可持续农业、可再生能源、保护、微金融以及负担得起的基本服务（包括住房、医疗和教育）。\n\n来源：全球影响力投资网络\
  \ (Global Impact Investing Network)\n\n\n\n尽管全球范围内的人希望根据 2005 年生效的《京都议定书》大幅减少温室气体排放，但美国近期决定退出，这令世界各国感到惊讶并造成了损害。\n\
  \n世界上几乎每个国家（总共 192 个）在对抗全球变暖的斗争中采纳了《京都议定书》。遗憾的是，加拿大于 2012 年 12 月退出，美国也于 2017 年 6\
  \ 月退出了《巴黎协定》，因为他们担心碳排放的减少会损害美国经济。\n\n虽然现任政府当局更关注经济，但千禧一代从不同的角度来看待生活。\n\n在接下来的十年里，超过\
  \ 24 万亿美元的资产将转移给下一代，这是历史上规模最大的财富转移。这些资产将不得不重新投资，而趋势是转向影响力投资。\n\n根据富达（Fidelity）的一份报告，超过\
  \ 77% 的富裕千禧一代和超过 72% 的 X 世代表示，他们将把财富投资于符合个人价值观的社会责任公司。\n\n尽管影响力投资行业尚处于起步阶段，但数据是令人惊叹的。据估计，影响力投资基金已向环保意识型公司投资了超过\
  \ 2280 亿美元，复合增长率每年超过 102%。\n\n据估计，仅 2017 年的投资额就超过 1400 亿美元，总 `AUM` 在未来十年将超过 4.3\
  \ 万亿美元。\n\n值得关注的是，千禧一代具有如此环保意识；他们准备为了“行善”而放弃财务收益。换句话说，他们对回报没有高期望，更多的是在一切一切太晚之前做正确事的道德信念。\n\
  \n影响力投资分为三个主要领域：环境、社会和治理（`ESG`）。无论采用何种投资策略，大多数千禧一代对地球的关注超过了自己的遗产，因此他们致力于将资产的大部分投入到可持续投资中。\n\
  \n财富管理经理已经注意到这一趋势，并正积极寻求千禧一代，有时将“影响力投资”一词作为营销工具，而没有采取刻意且深思熟虑的方法来追求可持续投资机会。\n\n全球影响力投资网络（`GIIN`）等行业组织正积极尝试建立共同认同，以吸引更多投资，同时为相关方提供工具、资源、研究和教育，将影响力投资推向财富管理的前沿。\n\
  \n沃伦·巴菲特的孙子霍华·巴菲特（Howard Buffett）在哥伦比亚大学教学，他正在建立一门关于影响力投资的课程。他与 Bill Eimicke 教授合著了书籍《社会价值投资》，这是对其祖父“价值投资”策略的一种变体。即使霍华·巴菲特一生都不需要工作，他的道德准则也战胜了追求安逸生活的冲动，这就是千禧一代的精神：在一切太晚之前拯救地球。\n\
  \n## 金融科技与无银行服务者的金融包\n\n在财富和金融领域，绝对不公平的事情是排除了没有银行服务和服务不足的大众。有人会辩称这不是事实，因为只要你有合法身份和证明文件，就可以访问世界各地的银行和金融系统。\n\
  \n问题就在这里，目前全球估计有 20 亿没有银行服务（或服务不足）的公民无法获得金融或银行服务，因为他们没有法律身份、没有证明文件或者只是无法连接互联网。这些人以昂贵的金融产品、掠夺性贷款和信贷付出了高昂代价，并且无法获得廉价资金或负担得起的银行服务。\n\
  \n在工业世界，情况略有不同。大多数人可以访问互联网和在线银行，对金融和经济学课题有了解，并且知道如何赚取或节省分钱。对于真正精明的人来说，有一个可以轻松赚钱的宇宙。\n\
  \n人们可以简单地从许多在线货币、银行和投资平台中进行选择，并“精挑”提供的投资机会，唯一的要求是首先得有钱。\n\n创新初创公司正在将从黄金到艺术品的一切物代币化，利用智能合约的所有优势，将数字资产、产品或服务直接交付给终端用户。\n\
  \n区块链通过将一切物品代币化为如 `ERC20` 等数字协议，提供了碎片化/单位投资，允许任何人在不了解该协议如何运作的情况下参与，这项技术仅在后台运行，由智能合约按照代码执行“正确的事”。\n\
  \n即使 `Ethereum` 使用智能合约自动化了金融交易的大部分复杂部分，仍需用户进行输入。技术初创公司完全意识到了这一点，因此创建了具有用户友好且直观的用户界面的应用程序，以解决现代文明的迫切需求，即时间和注意力的缺失。\n\
  \n`UX` 专家在设计应用程序时考虑了这一点，而那些成功超出疯狂预期的应用，是那些设计了卓越 `UX` 的——这是任何应用设计师的终极目标。\n\n`Uber`、`Airbnb`、`Instagram`、`Amazon`\
  \ 和 `Apple` 是简单和人为中心的设计的主要例子，这是数字世界的终极差异因素。\n\n传统金融行业正在注意到，目前正在进行一场激烈的金融科技竞争，通过利用金融技术并吸引有眼光的千禧一代来获取市场份额。\n\
  \n金融科技在许多方面改进了金融和银行，但还有很长的路要走。\n\n## 代币化世界中的财富\n\n数字变革的到来将影响每个人每物。\n\n在未来十年内，5 个“地震级”变化将深刻改变数字格局和我们所知的世界：\n\
  \n* 量子计算\n* 超人工智能\n* 数字化转型速度\n* 技术加速\n* 劳动力商品化\n\n人工智能、机器学习、机器人化、自动化和零工经济将深刻冲击全球劳动力市场。\n\
  \n专家估计，超过 50%的劳动力市场将被自由职业、自动化机器人取代，涵盖从银行到零售，从运输到物流的任何涉及中介或经纪人的领域。\n\n为了应对技术对劳动力市场的影响，全球范围内出现了一个关于\
  \ `UBI`——全民基本收入的讨论，它将取代所有社会福利，如失业金、养老金、住房和社会福利（以及其他社会服务），并为每个人提供最低的生活保障。\n\n在理论上，这听起来很棒，让人想起过去共产主义的好日子，“集体”照顾着人们。唯一的一个根本性问题仍然是谁来为这一切买单？\n\
  \n\n\n\n# 全球财富再分配与 UBI 愿景\n\n尽管双方专家都在争论其益处和可能性，但有一个事实是肯定的：目前世界上没有任何一个国家愿意能够为其公民提供\
  \ `UBI`，此点无疑。即使是资源丰富的国家，如`美国`、`阿拉伯酋`、`沙特阿拉伯`、`科威特`、`伊朗`和`俄罗斯`——更不用说`香港、韩国、中国、澳大利亚、新加坡和挪威`了——它们也负担不起提供\
  \ `UBI`。\n\n## 生产力与劳动关系的变革\n\n由于一个简单的原因，生产力将受到抑制，分工将受到深刻且不公平的影响。也就是说，`生产性`的劳动者为`非生产性`的人买单，极有可能导致政府及其经济不稳定甚至崩溃。\n\
  \n`UBI` 仅仅是一个乌托邦式的梦想。唯一有意义的目标是通过使用`blockchain` 对财富进行有效再分配来赋予民众，并将没有银行服务或服务不足的群体纳入其中。\n\
  \n## 通用基本资产 (UBA)\n\n`公共利益`的一种现实替代方案将是 `UBA` —— 通用基本资产——这是一种现代模式，公民参与水资源、可持续能源和其他基础设施等公共事业的所有权和收益分配。与只能依靠最低生活金生存的\
  \ `UBI` 接收者不同，`UBA` 可以重新投资剩余资金，创造更多的财富和繁荣。\n\n进一步来说，数字颠覆将产生更多收益并造及整个社区。目前，已经有了对科技公司征收`数字税`的讨论，这可以进一步扩大并应用到全球。\n\
  \n## 区块链时代的金融革命\n\n在`blockchain`上将互联网代币化是最完美的 `UBA` 概念。每个参与`价值互联网`的人都有权获得编码在`smart\
  \ contract`中的自己的`公平份额`。这对于目前来说可能是一个遥远的想法，但在不久的未来绝对值得考虑。\n\n最终，最好为世界所有公民提供经济激励和支持，让他们接受教育或掌握技能，以生产造及广大人口的产品和服务，而不仅仅是为了大科技公司和企业界。赋予民众是一项艰巨的任务和严峻的挑战，但通过消除引发一切冲突的唯一元素：`钱`，可以解决世界上许多冲突。\n\
  \n简单来说，钱买到了权力和控制，这种权力并不关心平等或机会均。去中心化将财富、繁荣和权力转移给人民，而不是低效的政府、企业干预和中央银行控制。\n\n###\
  \ 范式转移的影响\n\n任何包含`革命`一词的想法或概念都会引起关注，因为无论正在讨论或提议什么，都是革命性的。\n\n在金融背景下，在一个由技术治理并由`crypto`驱动的世界里，国际金融市场——以及全球经济——的运作方式将发生地震性的变化。技术已经影响着生活和社会每一个方面，无论是通过`apps`、`智能手机`、`算法`还是社交媒体，结合无尽的信息流，将改变我们所知的世界的一切。\n\
  \n`Crypto` 仍处于处于阶段，采用其成为现实还有相当距离，但这种现实将比想象中早出现。随着目前全球经济的衰退以及对所处金融动态的持续思考，经过时间检验的供需概念将发生不可逆转的变化。在目前及可预见的未来，一切都存在着巨大的不——或者更准确说是`失衡`。金融市场现在甚至运行在以前所未有的负值领域：`负利率`、`负油价`、`负权益`、`负资产`——这些都是最近才未知的超现实概念。\n\
  \n## 利润与经济增长\n\n`负资产`的概念如果转化并与现实世界相比，将意味着去购物不仅还能领钱，不仅获得免费商品，而且实际上拿到了报酬。这听起来很疯狂，因为这违背了商业贸易的所有立足，即带有利润的买卖，通常被称为`利润`。因为`利润`意味着收益，而`负`意味着亏损。\n\
  \n`利润`是商业中终极动力；`利润`提供了生产、创造和成功的激励。`利润`导致增长，反过来推动经济运行。没有`利润`，就没有经济可言。\n\n在经济术语中，将不再有恐惧或贪婪，也不会有任何供给。一切将是免费且充足的。\n\
  \n人们说`钱`是万恶之源，这是事实。从`法国大革命`到`英中鸦片战争`，大多数战争发生都是因为贪婪、夺地或为了权力和控制夺取自然资源。`美国`入侵伊拉克并不是为了将伊拉克人民从他们的独裁者`萨达·侯赛因`手中解放出来；他们毫无疑问且毫无后悔或克制地是为了那片土地上丰富的矿产资源，即`石油和天然气`。\n\
  \n\n\n\n\n# 代币化与碎片化所有\n\n代币化和碎片化所有将深刻改变金融和全球经济的格局，它让更多的人能够参与财富和富足，不仅是现有的财富，还包括正在创造的财富。技术和加密货币将促进大众（即“没有银行服务的人群”）的金融包容，并为所有人参与世界富足提供公平的竞争平台。我们无法产生比地球上现有的更多的水，但我们可以确保水资源的分配更加均匀。这适用于地球提供的所有东西；从土地到自然资源，从食物到药物，以及人类生存所需的一切。\n\
  \n权力的矢量将控制一切，但所起的动态将发生变化，因为金融市场的运作基于其参与者的交易量和互动。代币化作为现实世界资产的碎片化所有，将呈指数级增加市场参与度，并带来前所未有的流动性。简单来说；参与任何市场的人越多，受影响、操纵和权力滥用的可能性就越小。\n\
  \n集中在少数人手中的权力和控制从未成功过，看看历史上的任何一个暴政或独裁统治，没有一个是长久的，从成吉思汗到罗马帝国，从纳粹德国到伊克的萨达姆，从共产主义到南非种族隔离制度、津巴布韦和委内瑞拉，所有政权都走向终结并惨遭失败。\n\
  \n金融市场和全球经济也大无相同。在全球范围内交织的服务和全球流动的货物通过电子金融交易进行结算。很快，通过代币和加密货币，一个可以在智能手机上访问的金融交易之海将涌现。全球贸易和金融交易的世界被压缩到手机屏幕上，每个人都可以从世界任何地方几乎免费地参与。\n\
  \n现在，新冠肺炎无意中将整个世界推向了“新现实”，我们所熟知的世界将永一不再复。我们要么希望回到过去的美好时光（一个人类战胜技术的世界），要么适应并继续前进。技术可以让世界变得更好；关键在于如何对不断变化和进步的未来而来的技术应用正确的伦理和全球治理。每个拥有智能手机的人都可以通过每一次点击影响结果，而数字是有魔力的，参与的人越多，这种参与的力量就越强大，无论是社交媒体、电子商务还是贸易。技术无处不在，我们现在可以从掌心中虚拟地掌控自己的未来。这就是技术的力量。\n\
  \n## 比特币登月\n\n正当你认为它不能再更高时，`Bitcoin` 在 2021 年 2 月 16 日突破了 `$50,000` 的魔关关。关于如何以及为什么，有很多理论，但大多数观察者都会认同，特斯拉对\
  \ `Bitcoin` 前所未有的 15 亿美元投资不仅推高了价格，还刺破了对加密货币投资犹豫和不确定性的面纱。再加上摩根大通、摩根士利和高盛等主要投资银行披露了购买\
  \ `Bitcoin` 的计划，你就拥有了完美风暴的所有配料。大银行现在准备好对冲风险并购买 `Bitcoin`，这是一次巨大的信任投票，也是给其他其他人加入\
  \ `Bitcoin` 火箭登月之旅的信号。\n\n仅仅在 3 个月前，`Bitcoin` 的交易价格还在 `$10,000` 左右，而且在 2020 年 10\
  \ 月，这个金额还被认为处于“高位”。对于那些囤了 `Bitcoin` 的幸运儿来说，通往顶部的过程至少是令人兴奋的，对其他人来说，简直是“屏息”。\n\n###\
  \ 比特币在泡沫破裂前能走多远？\n\n显然，下一个预测站点是 `$100,000`，有人甚至认为是 `$300,000`。随着机构资金流入加密货币——其中大部分被预留给\
  \ `Bitcoin`——它可能会进一步推高价格，同时挤走 `Bitcoin` 巨鲸（这些受推崇加密货币的超级持有者）。再加上可能也看到机会的“企业模仿者”，他们也希望通过同样购买大额份额来参与\
  \ `Bitcoin` 的狂欢盛宴，这可能会引发牛市，将加密货币价格推向更高。\n\n蓝筹股入侵加密市场与对 `Bitcoin` 的淘金热相结合可能会引发大规模调整甚至暴跌，其后果可能是灾难性的。在这种情况下，许多人将寻求平仓并止损，从而引发进一步的下行螺旋。\n\
  \n对于局外人来说，这似乎是违事者的问题，那些粗率投资 `Bitcoin`（及其加密货币表亲们）的人应该付出代价。但对于经验丰富的市场观察者来说，这种规模的修正可能会导致金融市场崩溃并使整个全球经济脱轨，让人想起\
  \ 2008 年的次贷危机，但这次还加入了全球流行病的因素。\n\n目前，全球政府正在向其经济注入数十亿和万亿美元，以维持并防止史诗规模的崩溃（作为“间歇性”封锁及其对经济削弱影响的非预期后果）。全球范围内的集体努力让人相信，没有国家会希望自己的经济在自由落体中崩溃，尤其是在刚刚从疫情束缚中幸存并出来的时候。因此，可以说，向新常态的“结构化回归”已在日程之中，加密货币在为破碎经济提供燃料的同时，避免了进一步的量化宽松——这种缓解所有经济痛苦的创可贴。\n\
  \n但无论此以后发生什么，`Bitcoin` 为加密货币的主流采用铺平了道路，随之而来的是整个全新的加密货币和代币宇宙。事实上，金融革命将是代币化的。\n\n\
  ## 结语\n\n“在这个世界上，几乎没有公平可言，除了每个人恰好拥有 24 小时来做自己认为合适的事” 来源：爱迪森\n\n以上是我最喜欢的格言之一，也是每个人每天应该追求的，因为它是成功与失败的终极区别。在开启\
  \ `Bitcoin` 的狂热购买之旅之前，请做好功课，永远不要低估加密货币的波动性。我希望你喜欢我的书，并且关于世界和我们未来的许多内容被证明是有用的。\n\n\
  ## 关于作者\n\n- Jerry Floros\n\n2014 年，我参加了`London Academy of Trading`学习金融和衍生品交易，在完成学习课程并通过考试后，我获得了衍生品交易文凭。金融交易对我产生了浓厚兴趣，我决定将职业从海运转向金融科技（FinTech），并将业务基地从安特卫普搬到伦敦。\n\
  \n2017 年后，我开始编写关于金融科技、数字颠覆甚至脱欧的文章。我主要的在线发布渠道是 `The Market Mogul`，目前已转型为 `Mogul News`。\n\
  \n作为位于伦敦的知名作家，我有幸被选为以下畅销书的贡献作者之一：\n\n- 《财富科技书》\n- 《支付科技书》\n- 《法律科技书》\n- 《AI 书》（人工智能）\n\
  \n2020 年 12 月底，我出版了我的第一本书《新冠危机——如何在新现实中生存与繁荣》（英文名：`The Corona Crash`）。\n\n在职业身份上，我是\
  \ `MoneyDrome X` 的创始人兼 CEO，这是一个由人工智能、机器学习、分析、区块链和加密货币驱动的多链数字资产和证券投资平台。\n\n\n\n\n\
  \n2020 年 2 月，在第一轮疫情封锁发生前，我在英国华威大学商学院进行了一场主旨演讲。\n\n目前，我正在研究人工智能、区块链、加密货币、去中心化金融和数字颠覆，这些领域将深刻影响全球经济以及我们的个人生活。\n\
  \n## 致谢\n\n入选为四本金融科技（FinTech）书籍担任贡献者，开启了我的写作生涯，基于此，我衷心感谢 Susanne Chishti 女士——FinTech\
  \ Circle 的首席执行官。\n\n她创新的众包式金融科技书丛在金融科技领域产生了巨大影响，我感谢她让我有机会成为四本书的贡献作者，而这些书在此时已全部成为全球畅销书。\n\
  \n我还要想感谢 Richard McMunn——英国领先的图书出版教练和导师，他引导我进入出版世界；以及 Joshua Brown——VIP 计划总监，他在公关、营销和推广方面提供的支持。\n\
  \n我要感谢“视觉资本主义”（Visual Capitalist）公司允许我在书中使用迷人的图像和信息图，为不同的概念和主题增添“视觉效果”。\n\n我希望这本书能为我们每一个人带来繁荣和财务健康的改变。\n\
