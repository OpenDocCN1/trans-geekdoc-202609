  \n## 加密货币入门课程\n\n以下术语是最重要的加密货币概念和技术定义，按重要性和相关性排序，将帮助读者更好地理解书中的内容和主题。\n\n### 加密货币\
  \ (Crypto)\n加密货币是一种数字资产，设计用于作为交换媒介，使用强加密技术来确保金融交易的安全、控制额外单位的创建并验证资产的转移。\n\n### 密码学\
  \ (Cryptography)\n密码学是通过将信息转换为安全格式来保护信息的科学。这一过程被称为 `encryption`（加密），几个世纪以来一直防止手写信息不被非预期接收者读取。今天，它被用于保护数字数据。\n\
  \n### 区块链 (Blockchain)\n区块链是一个不断增长的记录列表（称为`blocks`），通过密码学链接。每个区块包含上一个区块的加密哈希、时间戳和交易数据。从设计上，区块链能够抵抗数据篡改。\n\
  区块链是以“区块”组织的、通过加密验证连接的记录账本，有时被称为“共识真理的数字存储”。\n\n### 去中心化 (Decentralization)\n去中心化是将组织的活动（特别是关于规划和决策的活动）从中心、权威的位置/群体中分发或委托出去的过程。\n\
  \n### 金融科技 (FinTech)\n金融科技，通常缩短为 `FinTech` 或 `fintech`，是旨在提供金融服务方面与传统金融方法竞争的新型技术和创新。它是一项利用技术改进金融活动的新兴行业。\n\
  \n### 代币化 (Tokenization)\n代币化是将现实世界资产的权利转换为区块链上数字代币的过程。\n\n### 中本聪 (Satoshi Nakamoto)\n\
  中本聪是开发 `bitcoin` 的未知个人或个人所使用的名称，他们编写了 `bitcoin` 白皮书，并创建并部署了 `bitcoin` 的参考实现。作为实现的一部分，他们还设计了第一个区块链数据库。\n\
  \n### 维塔利·布特林 (Vitalik Buterin)\nVitaly Dmitriyevich \"Vitalik\" Buterin 是一位俄罗斯裔加拿大程序员兼作家，主要以\
  \ `Ethereum`（以太坊）创始人和《比特币杂志》联合创始人闻名。\n\n### Solidity\nSolidity 是一种用于编写智能合约的面向对象的编程语言。它用于在各种区块链平台上实现智能合约。\n\
  \n### 智能合约 (Smart Contract)\n在区块链协议中编写的自动执行且具有法律约束力的合同。\n\n### TGE\n代币生成事件（Token\
  \ Generation Event）——`ICO` 或 `STO` 的另一个名称。\n\n### ICO – 首次代币发行 (Initial Coin Offering)\n\
  首次代币发行（`ICO`）是加密货币领域相当于主流世界中 `IPO` 的产物。`ICOs` 充当某种筹资金的角色；一家寻求的……\n\n### STO – 安全代币发行\
  \ (Security Token Offering)\n与 `ICO` 中提供的不赋予任何权利或义务而仅提供特定网络、平台访问的代币相反，`STO` 中提供的代币是由实物资产支撑的实际证券。\n\
  \n### DAO\n去中心化自治组织（无领导公司）是去中心化的、分布式的、有韧性的且具有激励机制的应用程序。\n\n### AML/KYC\n反洗钱/了解客户（Anti-Money\
  \ Laundering/Know Customer）——在注册服务时的身份验证过程中要求提供。\n\n### FOMO\n对错失投资机会的“恐惧”（Fear\
  \ Of Missing Out）。\n\n### HODL\n“紧握生命”（Hold On to Dear Life）在加密领域很常用，意味着无论发生什么都持有加密货币。这是对比特币早期购买者的引用，他们在“HODLing”的过程中变成了疯狂的百万富翁——甚至是亿富翁——比如温克沃斯兄弟。\n\
  \n### 节点 (Nodes)\n`node` 是计算机科学中使用的基本单元。`nodes` 是大型网络上的设备或数据点。个人电脑、手机或打印机都是 `nodes`。在定义互联网上的\
  \ `nodes` 时，`node` 是任何具有 IP 地址的物体。\n\n### 硬叉 (Hard Fork)\n`hard fork` 是一种规则更改，导致旧规则验证的软件会将根据新规则产生的区块视为无效。在\
  \ `hard fork` 的情况下，所有旨在按照新规则运行的节点都需要升级。\n\n### 流动民主 (Liquid Democracy)\n委托民主，也称为\
  \ `liquid democracy`，是一种民主形式，选民可以选择将投票权委托给代表而不是自己直接投票。\n\n### 共识 (Consensus)\n区块链作为与比特币最相关的分布式账本，也依赖共识算法在\
  \ `nodes` 之间达成一致。区块链可以被看是一个由点对点（P2P）网络上的分布式计算机管理的去中心化数据库。\n\n### dApps\n使用区块链协议的去中心化应用程序。\n\
  \n### 稳定币 (Stable Coin)\n稳定币是旨在减少价格波动影响的加密货币。为了减少波动，稳定币的价值可以锚定货币或可交易的商品（如贵金属或工业金属）。直接由货币或商品支撑的稳定币被认为是中心化的，而利用其他加密货币的稳定币则被称为去中心化。\n\
  \n### Nick Szabo\n\n\n\n\n\n尼克·萨博（Nick Szabo）是一位计算机科学家、法学学者和密码学家，以在数字合约和数字货币领域的研究闻名。他于\
  \ 1989 年毕业于华盛顿大学，获得计算机科学学位。他是马洛基罗基林大学（Universidad Francisco Marroquín）的荣誉教授。\n\n\
  ## EVM – 以太坊虚拟机\n\n以太坊虚拟机可以被视为准图灵完备机器。图灵完备指的是一种数据处理规则系统，以图灵机发明者阿伦·图灵命名。\n\n## P2P\
  \ – 点对点\n\n点对点经济（`P2P` economy）是一种去中心化模型，其中两个个体直接进行商品和服务的买卖，不需要第三方中介，也不需要使用公司或企业。\n\
  \n## 紧急援助/刺激/救济方案\n\n政府颁布的紧急援助方案通常是援助、救济和刺激措施的结合，旨在支持公民以及企业，并刺激陷入困境的经济，促进经济增长，引导经济走出经济衰退或萧条。\n\
  \n## 量化宽松\n\n量化宽松是一种货币政策，中央银行通过购买政府债券或其他金融资产，向经济中注入资金以扩大经济活动。通过增加货币供应，中央银行被认为是在凭空“印钞”，仅仅是通增加其资产负债表的规模来增加借款人的可用信贷额。（来源：维基百科）\n\
  \n## GDP\n\n国内生产总值是衡量特定时期内生产的所有最终商品和服务市场价值的货币标准（来源：维基百科）\n\n## 通货膨胀\n\n在经济学中，通货膨胀相对于可用商品的价格水平普遍上涨，导致经济体在一段时间内购买力出现大幅且持续的下降（来源：维基百科）\n\
  \n## 零工经济\n\n指的是所谓的“灵活”劳动力市场，其特征是短期合同形式的自由职业工作盛行，但没有工人权利或保护、保障性就业、稳定收入、带薪假期、病假、医疗保障或“社会安全”网。科技公司将零工经济描述为有利于灵活工作和工作时间的模式，但劳工专家、零工人员和独立承包商认为它是对工人剥削的一种形式。\n\
  \n`零工经济` 是一种新型的自由市场系统，其中提供临时职位，“按需”公司聘佣工人或独立承包商履行短期承诺。“gig”一词实际上是一个主要用于音乐界的俚语，指的是音乐家仅持续特定特定时间段的工作，而并不会真正成为乐队的永久成员。\n\
  \n《纽约客人》杂志将这种“灵活”的零工经济称为“按需的、点对点的或平台型经济”。简单来说，`零工经济`由那些聘用合同工从事临时或项目制工作的公司组成，而不是将他们聘为永久职位。\n\
  \n来源 - `https://mhrglobal.com/us/en/blog/gig-economy-good-bad-and-future#!`\n\n\
  ## IoT - 物联网\n\n物联网是由相互关联的计算设备、机械和数字机器组成的系统，这些设备具有唯一的标识符，并能够在网络上传输数据而无需人与人或人与计算机的交互（来源：维基百科）。\n\
  \n## 量子计算\n\n指的是利用“叠加”和“纠缠”等量子现象进行计算。\n\n量子计算机利用“量子比特”根据物体在被测量之前的状态概率进行超快速计算——每秒数十亿次——这使得能够处理比普通计算机多指数级的数据。量子计算的一个相关且关键的方面是，自从\
  \ NASA 和谷歌的合作项目（2019 年 10 月）实现“量子霸权”以来，它可以在极短时间内破解任何密码或代码，导致了对“抗量子”、“量子安全”或“量子防弹”计算机的需求（来源：维基百科）\n\
  \n## 5G\n\n在电信领域，`5G` 是蜂窝网络的第五代技术标准，手机公司已在全球范围内开始部署。蜂窝网络是 `4G` 网络的继者，与其前身一样，将服务区域划分为名为“小区”的小地理区域，通过无线波连接到`互联网`。`5G`\
  \ 网络的主要优势在于它不仅能服务手机，还能在物联网（`IoT`）和机器机器通信中实现新的应用（来源：维基百科）。\n\n## 6G\n\n第六代无线技术是 `5G`\
  \ 技术的继者，`6G` 网络将使用更高的频率并提供更高的容量和更低的延迟。三星已处于领先地位，中国正在其范围内进行竞争（来源：维基百科）。\n\n## 金融革命\n\
  \n通过金融技术对货币、金融和经济进行数字化转型。\n\n## 公平财富\n\n将国家的收入和财富“公平”地分配给其人口或在全球范围内进行分配。财富的公平分配让所有全球公民都有财务独立和成功的机会。\n\
  \n## 有意识资本主义\n\n由约翰·马基（John Mackey）和拉杰·西索迪（Raj Sisodia）创立的社会责任经济和政治哲学。支持者认为企业应该以道德的方式运营，服务所有利益相关者的利益，而不仅仅是管理层和股东（来源：维基百科）\n\
  \n它基于一个简单的理念：通过有意识的经营，可以提升人类。有意识资本主义是一种看待资本主义和商业的方式，更好地反映了我们在人类历程中的位置、世界现状以及商业对世界产生积极影响的内在潜力。\n\
  \n来源 - `https://www.consciouscapitalism.org/credo`\n\n\n\n\n\n## 引言\n其定义为获取金融服务的可用性和机会均等。它指的是个人和企业获取适当、负担得起且及时的金融和服务的过程，其中包括银行、信贷、贷款和保险产品（来源：维基百科）。\n\
  \n## 无银行服务群体\n无银行服务群体是指没有自己银行账户的成年人。与银行服务不足的人群一样，在可用的情况下，他们可能依赖替代金融服务来满足财务需求（来源：维基百科）。\n\
  \n## 影响力投资\n影响力投资是指“对公司、组织和基金进行的投资，旨在产生财务回报的同时，产生可衡量的有益的社会或环境影响”。影响力投资为解决社会和或环境问题提供资金。\n\
  \n## XKeyscore\n爱德华·斯诺登首次在《卫士报》上揭露，这是一个拥有复杂软件的秘密计算机系统，美国国家安全局（NSA）将其用于大规模监控，并每天持续搜索、分析和收集全球互联网数据以及网络用户交互信息。\n\
  \n## 影响影响圈\n中美贸易战——双方都在争夺“技术影响力”——导致了技术影响圈的出现。这些技术影响圈是指地理区域，在这些区域内，外部力量对控制技术和/或拥有特权而非排他的能力，或者外部行为者在技术治理方面拥有主导影响。\n\
  \n（来源：LSE Ideas – 作者牛津博士 Valentin Weber 的 Medium 文章——“理解技术影响圈的意义”——文章链接：`https://medium.com/@lseideas/making-sense-of-technological-spheres-of-influence-e1fb56581ec6`）\n\
  \n### 欧亚技术月带\n它是欧洲、东南亚和东亚的结合，被称为世界上“技术月带”，是大国寻求获得影响力的最宝贵领。它包含了拥有重要稀土资源的国家（中国、印度、马来西亚、缅甸、泰国和越南），这些资源被用于生产高科技产品。它还是全球技术供应链和创新枢纽所在地，跨越中国、台湾、韩国、日本、泰国一直到德国、法国和英国，并穿过伊朗和以色列等网络强国。\n\
  \n技术月带的地缘政治重要性也具有更传统的特征。全球三大经济、军事和技术政治实体中的两个——中国和欧盟——在此处发生互动。相比欧亚腹陆，它更像是一个地理枢纽。\n\
  \n（来源：LSE Ideas – 作者牛津博士 Valentin Weber 的 Medium 文章——“理解技术影响圈的意义”——文章链接：`https://medium.com/@lseideas/making-sense-of-technological-spheres-of-influence-e1fb56581ec6`）\n\
  \n## FVEY - 五眼联盟\n由美国、英国、加拿大、澳大利亚和新西兰组成的情报机构国际联盟，这些机构之间进行间谍活动并共享信息。\n\n## 中国社会信用体系\n\
  中国目前由中国共产党开发的国家信誉体系，利用大数据构建一个“高信任社会”，对个人、企业和组织的财务以及社会信誉和行为进行评分。该系统包括最高人民法院列出的“被执行信息失信人员”名单，被列为“不合格”。这可能导致名单上的人无法购买火车或飞机票、被禁止出国、获得信贷或贷款，甚至无法购买物业。\n\
  \n中国的社会信用体系被比作乔治·奥威尔的《1984》、《黑镜》、《老大哥》以及所有科幻小说作家能想象到的任何其他反乌托邦未来场景。\n\n## 新经济学 (Xinomics)\n\
  指中国的混合经济模式，该模式受到习近平主席的高度影响，并结合了共产党对中国经济更紧密的控制。它涉及国家支持的企业私有化和面向消费者部门的去监管化，但共产党对经济决策的整体控制却在收紧（来源：《澳洲财经评论报》）。\n\
  \n## Amazon Rekognition\n一种专业软件，使用经过验证的高度可扩展的深度学习技术，无需机器学习专业知识即可轻松地在您的应用程序中添加图像和视频分析。通过\
  \ Amazon Rekognition，您可以识别图像和视频中的物体、人物、文本、场景和活动，并检测任何不当内容。Amazon Rekognition 还提供了极高精度的人脸分析和人脸搜索功能，您可以将其用于各种用户身份验证、人数统计和公共安全用途的检测、分析和脸部比较。\n\
  \n（来源：`https://aws.amazon.com/rekognition/`）\n\n## 美国边缘项目 (The American Edge Project)\n\
  这是一个新成立的联盟，致力于主张美国创新者是美国经济健康、国家安全和个人自由不可缺的一部分。\n\n美国边缘项目由 Facebook 发起并获得知名美国科技公司支持，旨在“讲述技术和创新对美国经济和企业（特别是小型企业）产生的积极影响，以及它们如何增强言论自由和我们国家的整体安全”。\n\
  \n（来源：`https://www.facebook.com/pg/AmericanEdgeProject/about/?ref=page_internal`）\n\
  （来源：美国边缘项目 - `https://americanedgeproject.org/`）\n\n## 深度伪造 (Deepfakes)\n也被称为“合成媒体”，将现有图像或视频中的某人的形象替换为他人的肖像。虽然伪造内容本身并不新鲜，但深度伪造利用机器学习和人工智能的强大技术来操纵或生成视听内容，具有极大的欺骗潜力。创建深度伪造的主要机器学习方法基于深度学习，并涉及训练生成式网络架构，例如\
  \ `autoencoders`（自动编码器）或生成对抗网络（`GANs`）。\n\n深度伪造——“深度学习”与“伪”的合成词——因其在名人色情视频、报复性色情、假新闻、恶作剧和财务欺诈中的应用而引起广泛关注，这引发了业界和政府在检测和限制其使用的反应（来源：维基百科）。\n\
  \n上述大多数概念和定义是广为人知的，并包含了媒体创造的新术语。其目标是用通俗易懂的英语语言来定义或重新定义这些术语、概念和定义。\n\n信息来源包括 WHO、NHS、CDC、维基百科、Investopedia、Wired、LinkedIn、LSE、Medium、剑桥字典、柯林斯字典、韦氏词典、麦克林字典\n\
