    and value of the Internet of Vehicles lies in the collection and processing of
    data and information of each vehicle in the urban traffic network, the sharing
    of data, the common connection among vehicles, roads, and the Internet so as to
    establish a traffic management system independent of vision, weather conditions,
    and human operation.


