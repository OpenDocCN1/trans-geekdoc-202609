    # 7.2 Big Data Transportation and Rural Logistics


    Compared with urban logistics, rural logistics has more levels of transportation.
    Rural logistics is usually carried out in three steps, as warehouse tallying,
    regional transportation, and the last-kilometer distribution. In fact, in the
    vast majority of rural areas, except for the last kilometer of distribution, other
    logistics steps are similar to urban distribution. The last kilometer of distribution
    has become the most critical step to determine the efficiency of logistics.


    At the end of May 2016, at the 3rd China County E-commerce Summit, Xiong Jian,
    head of rural logistics of Cai Niao network, said that Cai Niao network is using
    the data system to organize the transportation capacity of express delivery and
    logistics companies around the country and build a more dense and deeper distribution
    network in the rural areas. Through the rural terminal logistics network, more
    than 30% of rural parcels can be delivered from the county to the rural area on
    the same day, and nearly 70% of parcels can also be delivered to the village the
    next day. Cai Niao network has established a rural terminal network covering more
    than 320 counties and nearly 16,000 rural service stations in the country.


    Due to the fact that the address of the consignee is not clear, the path planning
    is not in line with the reality and there are too many accidental factors in the
    rural logistics, common phenomena such as wrong delivery and multiple delivery
    in the logistics, resulting in the increase of the delivery cost and the decrease
    of the satisfaction of the consignee, etc. In view of the problem of “last kilometer”
    delivery of rural e-commerce logistics, many logistics companies have tried to
    use a variety of special forms of delivery, but have not effectively improved
    the efficiency.


    In view of this, we must introduce big data transportation technology, correctly
    analyze the regional distribution state of rural logistics and the living conditions
    of the consignee, and put forward targeted methods to effectively solve the rural
    logistics problem.'
