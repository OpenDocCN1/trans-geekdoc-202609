    # # Unmanned Driving: Transportation Revolution Sweeping Across the Globe


    Unmanned driving set off a transportation revolution sweeping the world, Starting
    the New Era of Intelligent Transportation. The autonomous driving is the main
    trend for the development of Transportation, and disrupting and Reshaping Transportation
    Ecology in the long run. Driverless taxis and shared travel, driverless truck
    fleets will become commonplace. In cities, rail transit will also be automated
    and driverless. Driverless taxis and shared travel, driverless truck fleets will
    become commonplace. In cities, rail transit will also be automated and driverless.
    Driverless taxis and shared travel, driverless truck fleet will become widespread,
    inside the city, rail transit will be automated and unmanned. At the same time,
    our roads will become safer and more efficient.


    # ## 12.1 Origin, Development, and Application of Unmanned Driving Technology


    # ### 12.1.1 Unmanned driving starting the new era of intelligent transportation


    Promoted by the thriving scientific technology, the role of the unmanned driving
    technology in social studies is increasingly important. Based on the surrounding-perceiving
    technology, the unmanned driving automobile can perceive the surroundings around
    the automobile and process the information about the surroundings. Unmanned driving
    technology can guarantee the automobile''s normal working on the road and its
    reaching'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'its planned destination by making use of computer information technology to
    control and adjust the automobile’s speed and driving direction.


    During the process of the development of the unmanned driving automobile, accurate
    information technology has been applied to the automobile to develop the people–automobile
    interaction, whose efficiency has been increased while the operating complexity
    has been decreased. The unmanned driving technology may not only increase the
    automobile’s operating efficiency but also avoid the chances of traffic accidents
    and offer travel service for those who have not learned to drive.


    # 12.1.1.1 Profile of development in the unmanned driving technology


    In the long run, autonomous driving is the main trend for the development of automobiles
    and unmanned driving is a type of display of autonomous driving and an important
    component of intelligent transportation. Broadly speaking, the unmanned driving
    automobile can be regarded as the integrated application of computer technology,
    communication technology in a network, and technology of intelligent control in
    the context of the internet. The unmanned driving automobile is a sort of special
    intelligent robot which can move, thus many experts in this field also call it
    the moving robot with automatic wheels.


    The unmanned driving automobile can use on-board sensors to achieve automatic
    perception of the surrounding environment, grasp real-time road condition information,
    and through the intelligent computer system as the core of the intelligent driving
    device, the automobile can be driven to the destination without any intervention.
    During the driving process, the unmanned driving automobile can use the system
    equipped with safety control functions to deal with a variety of unexpected situations
    to ensure the safety of driving.


    # 12.1.1.2 Direction of applying the unmanned driving technology


    +   (1) The Unmanned Driving Systems in the Highway Environment: Highways are
    well-marked with road signs and the unmanned driving systems used in this structured
    environment need to assume the function of tracking road markings and automatically
    identifying vehicles. For high-speed automated driving in this more standardized'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'environment, the unmanned driving systems strive to achieve a fully automated
    level of driving. These applications are difficult to apply to other environments,
    but the full value of unmanned driving applications can be demonstrated if fully
    automated driving can be achieved because highway driving is so dangerous and
    boring.


    +   (2) The Unmanned Driving Systems in Urban Environments: Compared to driving
    on highways, the unmanned driving in the city has a broad prospect for development
    as it requires less automobile speed and it is somewhat safer. At present, it
    can share the pressure of high-capacity public transportation in the city and
    relieve the traffic tension in urban areas. The specific application scenarios
    include airports, industrial parks, parks, campuses, or other public places.


    +   (3) The Unmanned Driving Systems in Special Environments: Some countries have
    more advanced technologies for the unmanned driving and have committed to the
    use of unmanned technology in military and other special environments. There are
    commonalities among the unmanned driving technology in these areas and applications
    in highway and urban environments, but there are differences in the relevance
    of technical performance as well.


    # 12.1.1.3 Bottlenecks in the development of unmanned driving technology


    The unmanned driving automobiles are mostly at the experimental and testing stage,
    which have a long way to go before they can be put into use in the real complex
    traffic environment, and there are various bottlenecks in their development: laws
    and regulations, technical limitations, data leakage, ethics, and so on. In the
    near future, the unmanned driving automobiles are unlikely to think and make decisions
    like humans, and the protection of the safety of the vehicle and the passengers
    inside is the primary task of the unmanned driving automobile. In the manned driving
    situation, most drivers will sacrifice some of their own interests in order to
    protect the lives of others if their life is not endangered.


    For example, if the pedestrian is running a red light at the front of the road,
    the other vehicles are traveling at the left side in the same direction and a
    roadblock is on the right side, in this case, many drivers would prefer to turn
    right into the roadblock in order not to endanger others’ lives even if the pedestrian
    is running the red light though repairing the broken car will cost them some money.
    The automatic driving automobile, however, will judge the front resistance as
    the minimum so as to directly'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'hit the pedestrian. Therefore, the journey of the development of the unmanned
    driving technology is not smooth, which requires not only in-depth layout of the
    government, universities, research institutions, but also the majority of entrepreneurs’
    and enterprises’ active participation with the strong force of the market to speed
    up the process of its development so that the subversive unmanned driving technology
    and intelligent transportation can really benefit hundreds of millions of people.


    # 12.1.1.4 Future outlook for the unmanned driving technology


    After the birth of the automobile, the progress of the automobile industry has
    made a positive contribution to the development of society. Relying on advanced
    technological means, the unmanned driving effectively improves the safety and
    accuracy of driving and reduces the chances of traffic accidents involving automobile
    driving. Along with the further development and maturity of the technology, the
    scope of application of the unmanned driving in passenger automobile and commercial
    vehicles will also continue to broaden, which will set off a revolutionary wave
    on the global scale.


    China’s huge population has laid a sound market foundation for the development
    of the automobile industry, which occupies a very important position in the global
