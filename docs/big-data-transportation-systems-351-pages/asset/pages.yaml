  md: '# 12.1.2 Four stages of the development of the unmanned driving technology


    In response to the explosive growth of active safety technology in automobiles,
    the National Highway Traffic Safety Administration (NHTSA) released a five-level
    standard for the automation of automobiles in 2013, which classifies the automated
    driving function of vehicles into five levels: Level 0 to Level 4.


    # 12.1.2.1 Level 0: No automation


    Level 0 means that the automobile does not have any autopilot function and the
    driver has full control over all the functions of the automobile. While driving
    the car, the driver is responsible for the starting, braking, and operating of
    the automobile and observing the surrounding road conditions as well. As long
    as the human controls the automobile, it is classified as Level 0 no matter what
    driving assistance technology the automobile has been equipped with. Therefore,
    although the regular car is equipped with functions such as forward collision
    warning, lane departure warning, automatic wiper control, and automatic headlight
    control, it can only be driven with human control and it is still classified as
    Level 0.


    # 12.1.2.2 Level 1: Automation at single-function level


    Level 1 means that the driver is responsible for the driving safety, but the driver
    can relinquish some of the control and leave it to the system. At this stage,
    some of the functions have been already automated, such as the frequent adaptive
    cruise control, emergency brake assistance, lane keeping, and so on. Level 1 has
    only a single function and the driver is still in control of the automobile while
    driving and the automobile cannot be left completely alone.


    # 12.1.2.3 Level 2: Partial automation


    At Level 2, the automobile can share the rights of control with the driver. In
    some of the predefined environments, the driver does not need to control the automobile
    and the automobile can work automatically, but the driver is always on standby,
    responsible for the driving safety and ready to drive the vehicle at any time.
    At this stage, the key to partial automation'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'of the automobile is not to have more than two functions, but that the driver
    is no longer the primary operator of the automobile. For example, the tracking
    function formed by the combination of ACC and LKS and the autopilot function invented
    by Tesla are of Level 2 functions.


    # 12.1.2.4 Level 3: Conditional automation


    At this stage, the automobile can be controlled automatically in limited situations,
    such as driving on highways or roads with little traffic. The driver has enough
    time to take over the car in case of an emergency to ensure safe driving. At this
    stage, the driver is freed up to the greatest extent possible and no longer has
    to be responsible for the driving safety and constantly monitoring road conditions
    while driving.


    # 12.1.2.5 Level 4: Full automation (unmanned driving)


    At this stage, the automobile can travel to its destination without human assistance
    by entering the departure and arrival information in advance. The automobile will
    be responsible for the driving safety throughout the entire travel with minimal
    reliance on the driver, and the vehicle can travel without a passenger.


    In addition to the NHTSA, the Society of Motor Vehicle Engineers (SAE) has also
    graded automated driving, dividing automated driving technology into six levels
    from 0 to 5, with levels 0 to 3 being consistent with the NHTSA''s classification
    of automated driving, which respectively emphasizes no automation, driving support,
    partial automation, and conditional automation. As for full automation, SAE has
    subdivided it and further emphasized the requirements for driving on the road
    and in the environment.


    At this stage, according to SAE''s regulations of Level 4 for automated driving,
    the automobile can only be automated in certain road conditions such as closed
    parks and fixed driving routes. Level 5, on the other hand, allows for automated
    driving in a variety of environments and provides effective responses to complex
    vehicle, pedestrian, and road conditions.


    All in all, the driving functions at different levels increase accordingly. Advanced
    Driving Assistance Systems (ADAS) is the highest level of driver assistance system
    and belongs to Level 0 to Level 2 (see Table 12.1).


    Among them, Level 0 autopilot has only sensor detection and decision alert functions;
    if it is equipped with a night vision system, it will be able'
