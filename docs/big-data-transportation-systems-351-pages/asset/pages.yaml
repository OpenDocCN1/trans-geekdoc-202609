  md: '# 9.1.1 Equipment application of big data


    For the Olympic Games, taxis are the most important means of transportation. The
    big data application of the Beijing Olympic Games to taxis is also China''s first
    comprehensive attempt. Prior to 2008, all the expressways within Beijing''s Fifth
    Ring Road basically completed the installation of RBMS flow meter, which can effectively
    capture the traffic conditions of the expressways.


    The biggest bright spot comes from the taxis. When the 2008 Olympic Games began,
    all taxis in Beijing had been equipped with the GPS. The traffic management department
    could effectively locate each taxi, track it in time, and efficiently solve the
    problem.


    Besides, the electronic charging mode had also begun to operate among Olympic
    enterprises. The in-depth big data cooperation between Beijing Olympic Organizing
    Committee and Beijing transportation department with China Mobile, China Unicom,
    and China Telecom could effectively identify vehicle license plate to solve the
    traffic accidents quickly, and store and backup these data on time.


    At the same time, during the Beijing Olympic Games, hundreds of traffic incident
    detectors were distributed on the streets of Beijing. These devices could detect
    traffic accidents, road ponding, and other problems at its earliest and set their
    own alarms. The information was then immediately displayed in the command center,
    and the personnel in the transportation department handled the situation in the
    quickest possible time. This automatic alarm device shortens the handling of traffic
    accidents by 3–5 minutes, which greatly improves the rapid handling capacity of
    traffic accidents and ensures the effective operation of urban traffic.


