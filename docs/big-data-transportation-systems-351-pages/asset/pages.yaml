    In the specific calculation, the life cycle of a vehicle means that when the cost
    of maintenance and operation is greater than the depreciated value, the vehicle
    is determined to have reached the end of its useful life. Each current asset of
    the same vehicle type is replaced in order of priority. Funding is determined
    by vehicle type, and each vehicle type receives an even distribution of funding
    within a category as a way to help with the balanced distribution of the fleet.
    The vehicle''s replacement eligibility is that the user calculates the end of
    the vehicle''s life cycle over a specified period of time (usually 3 years), and
    there is no vehicle allocation to replace it. This is followed by a calculation
    of the number of purchases, and the replacement of specific vehicles is based
    on the allocation of priorities. It also allows users to create hypothetical scenarios
    to see the impact of budget adjustments on model results, such as budget increases
    and budget decreases. An indicator of good vehicle allocation means not replacing
    a vehicle at the end of its life cycle, but using a structured, logical approach
