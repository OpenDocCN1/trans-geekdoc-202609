  md: '**Signal:** The signal is an important factor that affects the operation of
    unmanned driving trains. Only when the signal system is running stably can the
    train complete acceleration, deceleration, turning, stopping, opening and closing
    the doors, etc. Safety accidents such as doors pinching passengers and trains
    derailing may happen when there are problems with the signal system. Therefore,
    the automatic detection and maintenance of the signal system is particularly critical.


    **Evacuation Platform:** The handling of accidents may be more challenging when
    the accidents happen while the trains are in operation because the staff cannot
    get to the spot to handle the accidents effectively. In order to reduce the negative
    impact of the accidents, an evacuation platform has to be set up in the tunnel
    so that passengers can be moved to a safe area if an accident occurs.


    The unmanned driving technology itself has a high dependence on the supporting
    hardware and software facilities. The solutions have to be made manually when
    the supporting hardware and software facilities have problems and the control
    center cannot effectively solve the problem. Therefore, the train operation department
    must carry out real-time inspection of the train supporting facilities and equipment
    to fully ensure the reliability of unmanned driving train operations.


    # 12.6.5.2 Innovative management model


    In some cases, the remote control from the control center cannot effectively solve
    the problem and staff must enter the interior of the train to deal with it when
    there are problems with train in operation. The manual handling also requires
    a certain amount of time. The problems cannot be handled in a timely manner by
    the crew as is generally the case with traditional human-piloted trains. Therefore,
    it is necessary to make innovation in management mode in order to improve the
    processing speed of the unmanned driving trains.


    The driver’s role does not exist in the unmanned driving trains, and the driver’s
    functions in the traditional manned driving mode will be transferred to the dispatching
    department, which requires the latter to be more refined, that is, the dispatching
    department of the unmanned driving trains should have strong communication and
    coordination skills and professional driving skills, etc., so that it can monitor
    train passenger flow in'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'real time, respond immediately to feedback from train passengers, and provide
    passengers with effective solutions to problems in the shortest possible time.


    In addition, a more complete maintenance and dispatch system should be established
    in order to solve more complex unmanned train operation problems so that in the
    event of complex problems such as signaling system failures and train track damage,
    the problems can be solved quickly. To this end, the maintenance dispatching,
    traffic dispatching, and passenger dispatching need to maintain efficient coordination,
    which requires the integration of all three into the control center dispatching
    system at the same time.


    # 12.6.5.3 Personnel Quality


    The application of the unmanned driving technology in the field of urban rail
    transit has a high dependence on the professionals. Although there may be no longer
    staff inside the train, this does not mean that the unmanned driving trains no
    longer need human support. On the contrary, there is a higher demand for the overall
    quality and skills of the relevant staff.


    +   (1) Control Center: For example, when a train malfunction occurs, it is more
    likely to be handled by remote control from a control center, whereas it may have
    previously been handled simply by the driver. Now since there is no crew on the
    unmanned driving train, the train dispatcher should not only have dispatching
    skills, but also train incident handling skills such as calming down the passengers
    and analyzing and resolving train malfunctions. Of course, in order for the train
    dispatchers to have these skills, they need to be professionally trained.


    +   (2) Stations: With the application of the unmanned driving technology to the
    urban rail transit, a greater number of people with greater expertise and higher
    service levels need to be staffed at the stations in order to respond effectively
    to all kinds of accidents that may occur with trains.


    # 12.6.5.4 Passengers'' cooperation


    Passengers are required to do a good job in cooperating with the unmanned driving
    trains when the trains are in operation. On the one'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'hand, the human interference in train operation should be reduced. If part
    of the passengers’ interference in the train operation is not stopped in a timely
    manner, it will have great negative influence on the train operation because there
    are no crew on the train. In this case, the passengers’ initiative in cooperation
    is required besides the severe punishment for the interference actions on the
    train operation. On the other hand, the passengers may offer assistance in the
    rescue. After a train accident, it takes some time for the professional staff
    to arrive at the scene of the accident and they may miss the best time to rescue.
    If the passengers can spontaneously handle the accident appropriately by following
    the accident handling requirements, they will effectively reduce the hazards of
    the accident.


    The prospect of the application of the unmanned driving technology to the rail
    transit transportation deserves our great expectation. It is the government departments
    that need to take a balanced approach, grasp the key points, guide the safe and
    standardized application and development of the unmanned driving technology while
    encouraging innovation and providing a more excellent business environment for
    entrepreneurs and enterprises in order to ensure the rapid and stable development
    of the unmanned driving technology in China.'
