  md: '# 2.5 Freight Transportation of Big Data Transportation


    Compared to passenger travel, freight logistics transportation and turnover are
    also the important parts of big data transportation and intelligent transportation.
    Moreover, with the improvement of vehicle networks and the Internet of Things,
    freight data are becoming more valuable.


    From the point of view of the mode of freight transportation, the more important
    modes of transportation at present are rail transport, highway transport, waterway
    transport, and the civil aviation transport. The data generated by these freight
    transportation vary, but the key information is of common value.


    According to the Statistical Bulletin on the Development of the Transport Industry
    in 2016 published by the Ministry of Transport in April 2017, the whole society
    had completed 43.134 billion tons of freight in 2016. Of these, the total amount
    of freight transported by railways nationwide was 3.332 billion tons, the amount
    of freight transported by highways nationwide was 33.413 billion tons, the amount
    of freight transported by waterways nationwide was 6.382 billion tons (excluding
    port data), and the amount of freight transported by civil aviation was 6.669
    million tons (including international shipping data).


    In a comprehensive comparison, the freight travel focuses on its flexibility,
    convenience, and densely populated outlets of highway transportation. In the process
    of construction and operation of intelligent transportation in the city, the highway
    transportation is more important. During the transportation process, the daily
    data volume generated by video surveillance, traffic police, road information,
    control information, operational information, GPS positioning information, and
    RFID identification information can reach the PB level and it is exponentially
    increasing. How these data are used wisely is at the heart of freight transportation
    of big data transportation.


    # 2.5.1 How to predict freight transportation in advance


    For freight drivers, it is the most cost-effective way to return with full load
    for every transportation. But in many cases, in order to transport goods, there
    is always a single transportation with no-load driving, which not only causes
    a waste of resources but also reduces the profit of freight'
  merge: -1
