  md: '# # About the Authors


    ![](img/64ac2ad4e2782dff8c190440ca455c6a_17_0.png)


    Guanghui Zhao (1976—) is researcher, professor, and bachelor of law at Wuhan University.
    He has completed his master’s degree in administration from Central South University
    of Finance and Economics; master’s in economics from Central Agricultural University;
    Ph.D in management science and engineering from the Wuhan University of Technology;
    postdoctorate from Wuhan University and Chinese Academy of Social Sciences. He
    is also senior visiting fellow at School of Engineering, University of Michigan;
    professor at Guizhou University of Finance and Economics; founding Director of
    Research Center for Modern Transport Development in College of Management Cadres
    of Ministry of Transport and Director of the training office of the Ministry of
    Transport in support of the western region; chief researcher of Beijing Jiaogan
    Think tank Information Technology Research Institute; researcher at Research Center
    for Industrial, Academic Research Issues, Wuhan University; tutor for MPA at University
    of Science and Technology of China; “Young science and technology talent in traffic”
    of Ministry of Transport, the excellent manager of science and technology in recognition
    of the Ministry of Transport and an expert of the famous teacher’s group of the
    Ministry of Transport; a teacher of the training course of the nationwide head
    of bureau of transportation; core expert of think tank in Guizhou province; core
    expert of Guangxi Zhuang Autonomous Region; Deputy Director of bureau of transportation
    in Qinzhou City, Guangxi Zhuang Autonomous'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Region and a distinguished expert of the strong division of traffic of Guangxi
    transportation department. He is in charge of projects such as National Social
    Science Fund and research projects entrusted by the business department of Ministry
    of Transport. He is also associated with the Postdoctoral Foundation Project of
    China, Special Fund Project of China Postdoctoral Foundation, and over 30 National
    Educational Science Planning Projects. He has published more than 100 academic
    papers in various key academic journals and more than 20 treatises.


    ![](img/64ac2ad4e2782dff8c190440ca455c6a_18_0.png)


    **Gusheng Zhu**, the professor, editorial Director of the Journal of Qujing Normal
    University; the communication review expert of the National Social Science Planning
    Office; the leader of “Applied Economics”, a key discipline of Yunnan Province;
    the chief expert of the Yunnan Provincial Key Research Base of Philosophy and
    Social Sciences; contact expert of Qujing Municipal Committee; major administrative
    decision-making consultation and argumentation expert of Qujing Municipal


    Government; master advisor of Shanghai Normal University and Yunnan Agricultural
    University. He mainly engages in economic and cultural research in the upstream
    of Pearl River, has participated in the National Social Science Planning Project,
    the Ministry of Education Humanities and Social Sciences Project research work,
    has hosted a number of projects, such as the Provincial Philosophy and Social
    Science Planning Project, the Provincial Social Sciences Key Research Base Project,
    the University and Province Cooperation Project, the Provincial Education Department
    Research Fund Project and many other research projects, and has won a series of
    honorary titles, such as the outstanding professional and technical talents with
    outstanding contributions at the provincial level, the “Excellent Editor”of journal
    of local colleges and universities, and won special government allowance for outstanding
    backbone teachers at municipal level.'
