  md: '# 4.2 Feature 2 of Big Data Transportation:

    Full Utilization of Resources


    The high vacancy rate of cars in traffic has always been a headache for traffic
    managers. A vehicle with five seat, when fully seated, is fine for five people
    to share one vehicle. If five people each drive one car, there will be four more
    cars on the road, and these cars will naturally increase traffic congestion and
    the exhausted fumes from the cars will also increase pollution.


    The mode that allows five people to share a car is the hitchhiking mode or carpooling
    mode. Didi Taxi has long offered hitchhiking and carpooling services. When a passenger
    chooses to carpool, a Didi Taxi driver can pick up and drop off several passengers
    to different destinations at the same time, thus reducing the number of transport
    used to travel and also ensuring that passengers are able to travel normally with
    traffic congestion eased considerably.


    According to the statistics, the Didi hitchhiking service transported 4.2 million
    passengers during the 2017 Spring Festival, which is equivalent to opening 1909
    green trains or 5874 8-car EMUs on the basis of the established railway transportation
    capacity. This is four times the number of trains transported in the same period
    last year. A total of 2.8 million car owners participated in empty seat sharing.
    Even on New Year''s Eve (from 22:00 on January 27 to 6:00 on the next day), 70,000
    people left for the reunion on their way home. During the Spring Festival (January
    28–February 1), cross-city hitchhiking is mostly short-distance trips, family
    visits, and short trips in surrounding cities.


    In terms of the number of passengers, Wenzhou people like to travel alone the
    most, and 66.3% of Wenzhou people hitch a ride alone on their way back. Guangzhou
    people like to travel with friends the most, and 52.11% of Guangzhou people hitch
    a ride together when they return.2


    In the modes of carpooling and hitchhiking, idle resources are used to the greatest
    extent, which makes these modes an effective way to relieve traffic pressure.
    The most important thing is that the government and enterprises get the real first-hand
    data from people’s travel through the hitchhiking and carpooling. From these data,
    the government will formulate its traffic relief plan and decision-making, and
