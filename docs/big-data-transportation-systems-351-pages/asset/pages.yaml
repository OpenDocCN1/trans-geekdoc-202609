    information collection equipment is more flexible. For example, the collection
    equipment installed on the traffic vehicle and supervision vehicle will collect
    the data through magnetic frequency, photoelectric, weight sensor, and other methods,
    which can effectively collect the real-time running speed of the vehicle. The
    data are in flux, so projections of congestion are more accurate.'
