    # 4.1 Feature 1 of Big Data Transportation: Shared Economy


    Although the shared economy model has developed relatively early abroad, its development
    speed and innovation models enhanced only after entering China. Through the mobile
    Internet and big data, the shared economy can reasonably reallocate resources,
    improve the utilization rate of resources, and reduce the cost of ownership. It
    also reduces waste and has obvious effects on the improvement of economic benefits
    to the community as a whole.


    The shared economy has several characteristics:


    +   (a) The allocation of resource elements is rapid and efficient.

    +   (b) Ownership changes and proprietorship and usage rights are separated.

    +   (c) All resource allocations are based on data mining from shared platforms.

    +   (d) Everyone can be a participant in the shared economy.'
