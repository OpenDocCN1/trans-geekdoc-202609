    accident, and different kinds of data changes need to be combined to judge.


    # 6.2.3 Location of traffic accident


    The location of the traffic accident cannot be determined only by the data provided
    by the road section detector. After the data information is synthesized, the detection
    system can determine whether the traffic accident happened in the upstream or
    downstream of a section, but the distance from the section cannot be determined.


    Therefore, the accident monitoring platform needs to integrate the data obtained
    by the adjacent section detector on the highway so as to determine the specific
    location of the traffic accident.


    In fact, after the traffic accident, the data collected by the upstream detector
    and the downstream detector are different. Using this feature, the detection platform
    can determine the location of the traffic accident section as follows:


    +   (1) Data from upstream detector. When the traffic accident occurs, the capacity
    of the road section at the location where the traffic accident occurs suddenly
    drops, forming a traffic bottleneck, which will cause traffic congestion at the
    upstream of the location where the accident occurs. Therefore, the traffic data
    detected by the detector will have the following characteristics: reduced speed,
    increased occupancy rate, and reduced traffic flow. By using these three data
    features, the traffic accident monitoring platform can judge that the location
    of the traffic accident is at the downstream of the location section of the monitor.


    +   (2) Downstream detector. When a traffic accident occurs, the change of traffic
    digital information detected by the downstream detector is different from that
    detected by the upstream detector. Generally speaking, the changes of traffic
    flow digital information detected by the downstream detector have the following
    three characteristics: increased vehicle speed, reduced occupancy rate, and reduced
    traffic flow.'
