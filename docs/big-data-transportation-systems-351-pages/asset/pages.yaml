    by their mobile phones. However, due to the inconvenient deposit payment, the
    need to return bicycles to the specific places, and the old style of bicycles,
    the users’ experience of the government-led bicycle rental is not good.


    In recent years, with the rise of shared bicycles, the self-service bicycle travel
    has become more and more common. From users’ registration, deposit payment, bicycle
    use, bicycle return, etc., all are completed by the users themselves. The shared
    bicycle operation team is only responsible for the processing of transportation
    information data, bicycle quantity scheduling, and bicycle maintenance.


