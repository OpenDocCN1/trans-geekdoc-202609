    with other data sources, the multi-day travel data of residents recorded by the
    bus T-union information, even though occasionally changed, is basically the same
    for a long period of time, which also ensures that the data collected by the bus
    T-union can accurately determine the travel destination of passengers.


    This kind of precise collection effect, does not need to carry on the massive
    analysis and judgment to the passenger''s next station point in the data follow-up
    analysis, thus effectively reducing the complexity, and improving the efficiency
    and the precision.


