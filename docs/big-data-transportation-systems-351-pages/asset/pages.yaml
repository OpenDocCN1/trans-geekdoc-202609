  md: 'technology is constantly evolving and Autopilot is not perfect. Therefore,
    for this accident, who should exactly be blamed? Some believe that the responsible
    party is Tesla, while others believe that the responsible party is the inattentive
    driver, and still others believe that the responsible party is the sensor supplier
    Mobileye. This perception of the unmanned driving traffic accident reminded us
    of the alternating current battle between Tesla and Edison.


    In 1880, Tesla invented the world''s first alternating current generator and Edison
    invented the electric chair in order to bring awareness of the dangers of alternating
    current to people. Later, after a fierce battle between the two, Tesla''s alternating
    current prevailed and made an outstanding contribution to the development of human
    civilization. Thus, all new things are a symbiosis of pros and cons, and there
    is no absolute good or bad. Therefore, in the face of new things — unmanned driving
    cars — we should grasp the trend of development and we cannot completely deny
    it because of an accident.


    So, how to solve the issue of safety of the unmanned driving cars?


    In order to reduce the occurrence of traffic accidents in the course of driving
    unmanned vehicles, the unmanned vehicle manufacturers should establish a strict
    system of regular return of vehicles to the factory for maintenance and driving
    emergency disposal service system, especially to establish a “dual system” control
    mode to solve the problem of possible sabotage of the vehicle network, such as
    hacker intrusion, virus damage, and so on. The primary system in “dual system”
    refers to the open system of the networking, while the secondary system refers
    to the independent closed system. Once the driver discovers that the primary system
    has been sabotaged, the driver can immediately switch to the secondary system
    to ensure that the vehicle runs normally and that the driver and passengers get
    off safely, and then the vehicle needs to be sent to a maintenance organization
    for repair.


    If the driver does not find any abnormality when the primary system has been damaged,
    for example, the car will collide onto the obstacle in front instead of turning
    for a roundabout driving because the code of the system was revised and the driver
    may not be able to switch the systems in time, which will result in the traffic
    accident. In other words, the vehicle manufacturers must install protective software
    for the unmanned driving cars so that the vehicle can automatically detect faults,
    check and kill viruses, and take responsibility for the traffic accidents caused
    by improper protection, so as not to shirk the responsibility of vehicle'
