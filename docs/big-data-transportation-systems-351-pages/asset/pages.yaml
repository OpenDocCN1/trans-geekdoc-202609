    # ## 8.7 Big Data Transportation and Emergency Planning


    In 2003, a citizen in Nanjing opened the APP of “intelligent travel in Nanjing”
    before going to work. The APP pushed a message for him: there was an accident
    on the road the he needs to pass every day, so it is suggested to detour. Through
    this warning, the citizen chose a new route and arrived at his workplace on time.


    Such scenes are not from a science fiction, but a reality. With the help of the
    big data, emergency events can be identified on time and corresponding route suggestions
    can be made, which becomes another key direction of the big data for traffic application.


    In any country, there will inevitably be accidents or other emergency events.
    How to establish a perfect emergency planning scheme is one of the important assessment
    methods for the public transportation management. In the past, the emergency planning
    often had the characteristics of being temporary and sudden, which cannot effectively
    transmit to the public. As a result, it is prone to frictions and contradictions,
    and the public does not understand the governance. However, in the Internet era,
    with the help of the fast big data, the emergency planning should be more mature,
    forward-looking, and communicative, the responsibility of the future transportation
    department.


    # ## 8.7.1 Construction of traffic emergency system


    In the era of big data, the establishment of emergency system is no longer limited
    to the public transportation department, but it should take the transportation
    department as the core, and at the same time establish a seamless connection with
    the fire department, public security department,'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'and electric power department through the network system, so that the big data
    can play a real role, and effectively integrate all kinds of information to achieve
    the rapid development and release of emergency data.


    The establishment of emergency command service platform has become the key to
    big data emergency planning. Such a platform will play three important roles:
    beforehand supervision and prediction, interim emergency response and scheduling,
    and afterwards summary and filing.


    (1) Beforehand supervision and prediction. The traffic command center conducts
    real-time inspection on each road section through the system, conducts more self-monitoring
    on the congested road section, and timely deals with the hidden dangers found.
    The data platform will share data with other departments, such as house decoration
    and fire drill in a certain section. Forecast information shall be sent to the
    public through the platform in advance to remind the public to detour.


    (2) Interim emergency response and scheduling. In case of traffic accident, the
    traffic emergency platform shall immediately start the emergency plan, timely
    transmit the scene of the accident to the traffic command center, and at the same
    time, the information can also be transmitted to the hospital and the public security
    department at its earliest to do a good job in emergency treatment and avoiding
    traffic jam.


    (3) Afterwards summary and filing. The emergency platform can effectively record
    the intercommunication information between various departments and save the picture.
    After the accident is handled, the data can be classified and consolidated to
    provide basis for the handling of similar events in the future.


    All of the aforementioned work needs the big data support, which includes the
    urban road state judgment, information query, information transmission of various
    departments, and so on. Only in this way can the big data play a role, handle
    events efficiently and timely, and ensure the smooth flow of roads. Otherwise,
    when the accident occurs, if the traffic department does not receive the information
    or the medical institutions do not receive the treatment call, it will inevitably
    cause further traffic chaos and greatly affect the travel.'
