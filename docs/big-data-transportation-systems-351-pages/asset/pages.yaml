    # ### 2.3.1 Highway travel under the big data


    In recent years, the mileage of highway construction in China has been increasing,
    and the challenges of road network maintenance and management have become increasingly
    prominent. The work of toll collection, monitoring, communication, and other fields
    on the highway is not intelligent enough. A large number of human and material
    resources need to be put into it, which increases the cost of highway management.


    At present, the road condition information of many high-speed sections still relies
    heavily on manual reporting or display screen. As a result, road information cannot
    be fed back in real time, and the blindness and uncertainty of people’s travel
    will increase. Especially in case of severe weather such as heavy fog, ice, and
    snow, if the highway management department cannot release the information on time,
    and cannot monitor and command the traffic conditions of each road section through
    data, it may cause major safety risks.


    We can simply divide big data management of highways into safety management, road
    administration management, and service management.


    In terms of safety management, the highway has a large amount of decentralized
    traffic data, advanced electronic sensor technology, video surveillance equipment,
    near-field communication equipment, etc. These devices and data, if utilized wisely,
    can help management department build a large scale, all-encompassing, real-time,
    and an efficient safety management system. Through big data analysis and program
    development, this system can monitor the traffic flow, weather conditions, road
    conditions, and vehicle accidents and other information, and can send the information
    of certain road sections prone to accidents to the public through the Internet
    of Vehicles, traffic radio, WeChat, and other channels.


