  md: 'a wide range of safety control, combining a variety of functions in coordination
    with the manned system. The relevant problems are to be solved on the basis of
    the implementation of safety analysis in order to improve the safety of the overall
    operation. For example, in the process of designing the line, it is necessary
    to ensure that the driving environment is not disturbed by external factors, and
    in the process of subsequent development, it is necessary to continuously improve
    the safety system and timely perceive safety risks through sensors.


    +   (2) Only with sufficient safety, maintainability, reliability, and availability
    can the normal operation be maintained due to the limited number of humans involved
    in an unmanned system. In case of equipment failure or emergency, it is necessary
    to use the remote monitoring system to respond to the problem in a timely and
    effective manner; in addition, the unmanned system should also have the ability
    to analyze scenarios and issue emergency plans in a timely manner. In the event
    of an abnormal situation, the formulation of the plan should comprehensively consider
