    of the same year, the definition of the “Internet of Vehicles” was formally formed
    at the Fourth International Symposium on RFID Technology Development held in Shanghai.


    The Internet of Vehicles refers to the electronic tag loaded on the vehicle. Through
    the identification technology such as radio frequency, now all the attribute information,
    static, and dynamic information of the vehicle are extracted and effectively used
    on the information network platform. According to different functional requirements,
    the Internet of Vehicles will be able to support the operation status of all vehicles,
    effectively supervise and provide comprehensive services.


    Of course, the aforementioned definition is mainly made from the perspective of
    information technology. With the development of technology and society, the role
