    # 9.1 Big Data Transportation and Beijing Olympic Games


    In 2008, the Olympic flame came to Beijing, which was the most important global
    event in Beijing. The Beijing Olympic Games, which attracted the attention of
    the whole world, had received 6.52 million domestic and foreign tourists and 382,000
    inbound tourists during the Olympic Games, which was undoubtedly a great challenge
    to Beijing’s traffic and a comprehensive display of the image of the capital.


    So, how did the big data transportation serve for the 2008 Beijing Olympic Games?
    What achievements are worthy of learning and reference for future large-scale
    activities?'
