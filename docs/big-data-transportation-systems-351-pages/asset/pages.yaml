    will be improved.


    # 12.3.1.4 Path planning technology


    The path planning technology in the unmanned driving field refers to the technology
    by which the unmanned driving car''s intelligent system will design a safe and
    efficient driving route between the established starting point and destination,
    by analyzing data such as road conditions, speed, distance traveled, number of
    signal lights, etc., which requires the application of statistics, big data, cloud
    computing, and other technologies.


    In terms of the analysis of path, the driver can make flexible decisions in combination
    with real-time road conditions while driving a car, but in an unmanned driving
    state, the intelligent control system needs to make use of a high-precision 3D
    road condition model to efficiently calculate the relative position, distance,
    speed, and other information about the car and surrounding things, so as to achieve
    safe driving.


    The road condition thinking model needs to be adjusted in real time, and this
    process will involve massive amounts of data, which must be processed efficiently
    with the help of GPU or distributed neural network algorithms. It should be pointed
    out that in order to update the high-precision three-dimensional road map in real
    time, it is necessary to share data between the intelligent systems of automated
    vehicles in the region. In order to obtain richer and more diverse information
    about road conditions, the automated vehicles need to install software and hardware
    devices such as laser distance radar, inertial radar, and various sensors.


    In terms of path planning, the path planning not only requires high-precision
    three-dimensional road maps, but also has a high dependence on high-precision
    positioning technology. The unmanned driving car must be able to perceive and
    identify its own position in real time, execute the optimal route scheme set by
    the intelligent system, and comply with the traffic order, avoid obstacles in
    time, and adhere to the safety of people as the first priority to complete the
    driving task safely and efficiently.


    The route planning function mainly consists of three points:


    +   (1) The carriageway is planned by taking the overall environment into account
    to design the optimal route between the departure point and the destination and
    taking the individual needs of passengers into account as well.'
