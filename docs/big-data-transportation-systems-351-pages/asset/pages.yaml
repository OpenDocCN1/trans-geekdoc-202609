    # 12.3.1.1 The systematic structure of automotive


    The systematic structure of automotive builds the skeleton for the automotive
    system and defines the principles of the unmanned vehicle system''s hardware and
    software organization, integration methods, and support procedures.


    # 12.3.1.2 Perception and identification of external environment


    The artificial intelligence system is a data-driven system, and the unmanned vehicle
    system is no exception. The core means for the unmanned vehicles to perceive the
    environment and grasp real-time road condition information is on the basis of
    the external environment perception and recognition technology of on-board sensors.
    With the support of the external environment perception and recognition technology,
    the unmanned driving car can let the on-board intelligent system obtain the relative
    position, distance, speed, and other information between the objects on the road
    (for example, pedestrians, cars, obstacles, etc.) in real time to provide the
    necessary support for the car''s decision-making and command execution.


    # 12.3.1.3 Position navigation system


    During the driving process of the unmanned driving cars, the positioning and navigation
    system will provide a variety of information such as car position, speed, direction,
    etc., which is the basic software for the unmanned driving cars. After years of
    development, the positioning and navigation technology system has been constantly
    improving, and a variety of positioning and navigation technologies such as satellite
    navigation technology, roadmap positioning technology, visual positioning technology,
    track estimation technology, map matching technology, inertial navigation technology,
    and so on have emerged. As a matter of fact, two or more than two positioning
    and navigating technologies are applied at the'
