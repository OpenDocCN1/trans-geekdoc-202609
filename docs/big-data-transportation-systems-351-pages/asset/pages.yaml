    The reason why the unmanned driving cars cannot make use of ordinary maps is that
    the ordinary maps are marked with simple information, with two parallel lines
    representing roads and intersections representing crossroads. People can use their
    cognitive abilities to make judgments on the basis of this simple information,
    but it is difficult for the unmanned driving cars to function in this way. Therefore,
