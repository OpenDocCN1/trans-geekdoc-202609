- pgno: 5
  md: '# Foreword


    On May 10, 2017, my student Dr. Zhao Guanghui and I discussed issues related to
    the development of intelligent traffic at AIMS, Hangzhou. Later, he planned to
    write something about traffic big data. I told him that the University of Michigan
    has the world''s leading intelligent traffic laboratory. They spent a few years
    trying to optimize several traffic lights next to the University of Michigan.
    Then, they came to a big city of China to start experimenting on traffic big data
    by managing traffic lights with big data. With the help of the traditional camera
    and the induction coil, the light was switched every 90 seconds through man-made
    operation. By analyzing the congestion data, which was sent to the monitoring
    room, the traffic lights were adjusted through artificial intelligence. After
    two months, the city''s congestion eased 20% during rush hours. In the future,
    more cities in the world will optimize their traffic lights through big data,
    which will help maximize the use of the limited resources of road and save a lot
    of time and traffic resources. What is more, there are 150–200 million privately
    owned cars in China. These cars are idle in the parking lot about 95% of the time
    every day. They take up much space, waste resources, and cause congestion. With
    big data, these idle resources can be mobilized to serve the people who need to
    take a ride. How much contribution the practice would make!


    After reading the manuscripts of the book written by Dr. Zhao Guanghui and Professor
    Zhu Gusheng, I deeply believe that the big data technology has promoted the development
    of China''s traffic. The examples include collection of traffic big data sources,
    application of traffic big data platforms, the pain points, cases and business
    models of traffic'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'logistics, public transportation, and traffic safety, operation experience,
    and the current status, strategies and actions of traffic big data in other countries.
    Dr. Zhao proposed that traffic big data has changed the travel patterns of Chinese
    society, shifting from “people trying to find a car” in the past to “making arrangements
    for cars to find people who want to take a ride” now. By analyzing data on rainy
    days, sunny days, rush hours, normal hours, weekdays, and holidays, the future
    travel conditions and number of passengers in specific places under these circumstances
    can be predicted. The accuracy rate has now reached 85–90%. Decisions can be made
    15 minutes earlier to send the cars to designated places. With the allocation,
    route planning, and positioning 15 minutes in advance, online car-hailing brings
    much convenience to people, which is unimaginable before. Now people get quite
    used to it.


    The effort to match passengers and cars is not the only application. The effort
    to match people and materials has also changed greatly because of big data. At
    24:00 on November 11, 2017, the sales of Tmall on that day reached 168.2 billion
    yuan. Among them, online shopping contributed 90%, with sellers and buyers covering
    222 countries and regions. Before November 11, sellers predicted by big data that
    express parcels would increase by more than 30% that of 2016, and the big data
    predicted that the number would reach 140 million on November 11, and more than
    1.7 million couriers would be involved in the logistics. By enhancing collaboration
    and data sharing to improve logistics services, the delivery bills had covered
    more than 80% of the whole industry. It was the first time that big data forecast
    cover more than half of the express parcels in the industry, and the efficiency
    was improved through the connection of big data and social collaboration. On the
    basis of the upgrade of logistics early warning radar, the big data platform has
    fully elevated from the time interval forecast to the real-time forecast, covering
    more than 50% of China’s express parcels. The algorithm optimization enabled big
    data of more dimensions to be used. As a result, real-time forecast of number
    of parcels delivered every day was provided, with the accuracy rate exceeding
    90%. These data can help express partners to deploy capacity, and companies can
    prepare capacity in advance based on the forecast data. Therefore, efforts were
    made to increase 4,000 temporary workers and 5,240 trucks, and increase the tonnage
    of plane leases in advance. The “big data distribution route” can automatically
    calculate the distribution path and allocate the parcel to the outlet closest
    to the buyer based on the information on the delivery bill. More than 50% of parcels
    were delivered to buyers faster'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'through big data distribution route. Sellers were giving forecast of all kinds
    of best-selling goods by using big data, and managing inventory at warehouses
    across the whole country, so that the parcels could be as close to buyers as possible.
    By using big data to forecast the volume of parcels, the goods were able to reach
    buyers as early as possible. The pattern shifted from “buyers waiting for the
    parcels” to “parcels finding buyers”.


    Big Data Transportation Systems brings us a brand new perspective to observe and
    make use of big data, thanks to Dr. Zhao Guanghui’s hard work after returning
    from the University of Michigan and Professor Zhu Gusheng’s continued attention
    to China’s traffic. I wrote the preface to Internet + Traffic, a book written
    by them before. This book Big Data Transportation Systems provides a depiction
    of the new stage of traffic development. Against the backdrop of China’s strategy
    to develop itself into a transportation power, such forward-looking study, the
    scholars’ interaction with the workers in the transportation field, and scholars’
    contribution to the development of world transportation became all the more necessary.
    Everyone must have the purpose of life, because your existence has an impact on
    society and the people around you. Everyone can make a difference to the world
    no matter what role s/he is playing. I hope that Dr. Zhao will continue to work
    hard, stay diligent, grasp the major technological changes in the world, follow
    the world’s trend, provide more research findings for the transportation power
    dream with his international vision, broad mind and extraordinary wisdom and deliver
    more works to readers.


    I believe, thanks to the wisdom of China’s talents in the field of transportation
    and the contribution of talents from all over the world, China’s traffic big data
    will definitely become more advanced in the future. China will come closer to
    its goal of becoming a world transportation power, and the prospects of China’s
    traffic development by virtue of big data will also be brighter.'
