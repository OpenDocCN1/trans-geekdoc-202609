  md: '# 1.2 Big Data Transportation and Intelligent Transportation


    # 1.2.1 What is intelligent transportation


    The concept of intelligent transportation was proposed very very early. As early
    as 1990, the Japanese Iguchi Yaichi first proposed the concept of intelligent
    transportation system (referred to as ITS). But at that time, ITS did not attract
    widespread attention. It was not until 1994 when the United States changed its
    transportation research organization intelligent vehicle highway society (IVHS)
    to ITS America that the concept of ITS was paid attention to.


    Over the years, with the development of Internet technology, big data technology,
    cloud computing, blockchain, and other technologies, the trend of intelligence
    is more and more obvious, and the proportion of intelligence in the field of transportation
    continues to rise. The world''s important economies, including the United States,
    Europe, and China, have paid more and more attention to intelligent transportation,
    and have invested a lot of manpower and material resources for its development.


    So far, there is no authoritative definition of intelligent transportation, and
    various researchers have their own understanding of it. However, we can understand
    this concept with the help of the definition of intelligent transport given by
    the President of the first ITS World Congress.


    The intelligent transportation system is to effectively integrate and apply advanced
    information technology, communication technology, control technology, sensor technology
    and system comprehensive technology to the ground transportation system on the
    basis of relatively complete road infrastructure so as to establish a real-time,
    accurate and efficient ground transportation system that plays a role in a large
    range.


    In general, the composition of the intelligent transportation system has seven
    components, namely, advanced transportation information system (ATIS), advanced
    transportation management system (ATMS), advanced public transportation system
    (APTS), advanced vehicle control system (AVCS), freight management system, electronic
    toll collection system (ETC), and emergency medical system (EMS). Together, these
    seven components form a three-dimensional intelligent transportation system that
    affects every aspect of people''s lives.


    For Xiong''an New District newly approved by the Central government, the government
    is taking the lead in the construction of intelligent public transportation as
    the main mode of travel.'
