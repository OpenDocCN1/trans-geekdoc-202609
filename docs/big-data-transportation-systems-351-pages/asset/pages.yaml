- pgno: 9
  md: '# # Foreword


    The big data is a popular area that has attracted worldwide attention, as it will
    profoundly change the way people work and live. Its huge potential application
    has been fully reflected in many fields. By applying big data technology, Caoniao
    Logistics has established China''s smart logistics backbone network supported
    by “Sky Network + Ground Network + People Network”; toutiao.com actively constructs
    intelligent recommendation algorithms with personalized design, wide coverage,
    and high input-output ratio; Amazon is focusing on the development of intelligent,
    Internet-based, and automated smart supply chain management systems. The application
    of big data in traffic is also keenly anticipated. Traffic big data refers to
    the collection of data featuring large-scale, multiple sources, various types,
    complex structures, and low value densities. By exploring its connection and common
    rules by using big data technology and analytical methods, we can help provide
    vigorous data support for the management decisions of relevant departments, accelerating
    the successful implementation of intelligent traffic and smart cities.


    Although China''s transportation industry just started not long ago, it has made
    remarkable progress by drawing on the advantages as a late comer. As a country
    with a vast territory, complex topographical and climatic conditions and huge
    geographical differences, China has accumulated rich experience in the research,
    design, testing, construction, maintenance, and management of infrastructure projects
    after years of practice. We have overcome worldwide problems in building highways
    and railways on plateau frozen soil, expansive soil and in deserts, and our high-speed
    railways have become a new example of “Made in China”'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'and have been introduced to other countries. However, as a basic, fore- runner,
    and service-oriented industry supporting the development of the national economy,
    the transportation industry is a large and complex system. Catching up with transportation
    powers such as Japan, Europe, and the United States is no easy feat. To develop
    the transportation industry, pouring capital investment is far from enough. We
    not only need to provide sufficient talents, fund, and technology but also need
    to formulate scientific and rational strategic planning, effective implementation
    programs, and comprehensive long-term guarantee mechanisms at the top level.


    There is no doubt that governments at all levels in China have attached great
    importance to the development of the transportation industry. Thanks to their
    hard work, the mileage of roads and railways has grown rapidly; the construction
    of public transportation system and subways has been going on in an orderly manner;
    and the emerging model of “Internet + Traffic” such as shared car rental and shared
    bicycles have also been flourishing under the support and guidance of the local
    governments. However, China’s transportation industry, as a whole, is still at
    the initial stage of development. Unbalanced regional development, lack of industrial
    inter-connectivity, and lag in information technology have caused many problems,
    such as traffic congestion, frequent traffic accidents, low transportation efficiency,
    and high costs. These problems have brought inconvenience to people’s work and
    lives, and restrained the steady and sound growth of China’s economy. The emergence
    of big data traffic provides an effective solution to the aforementioned problems.


    Developed countries such as the United States and the United Kingdom have conducted
    in-depth research and practice on the application of big data in traffic, achieving
    good results in solving traffic congestion, emergency response in severe weather
    and road condition analysis and prediction. Governments at all levels in China
    are working hard to catch up, as they have actively explored the application in
    Beijing, Shanghai, and Hangzhou, setting a good example for the whole country.
    In fact, China has invested a considerable amount of resources in the process
    of promoting traffic big data. However, due to the lack of overall strategic planning,
    problems such as repeated development and low resource utilization are particularly
    serious. Meanwhile, talents in big data are quite scarce. Even in developed countries,
    talents in this regard are scarce resources, therefore, the research on the theory
    and application of big data is still quite limited. Interdisciplinary talents
    in China who can'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'apply big data technology and analytical methods to transportation are

    even more scarce.


    What is more, the problem of information island is particularly seri-

    ous. The ability to collect, analyze, and apply massive traffic data from

    multiple sources efficiently and cost-effectively is the foundation and

    precondition for advancing the implementation of traffic big data, but

    information systems among different regions, levels, and departments of

    China have yet to align seamlessly, hindering the spreading and sharing of

    traffic data. Therefore, breaking the information islands among different

    regions, levels, and departments has become an important task in the

    development of traffic big data in China. This book provides a systematic

    and in-depth analysis of the macro-background of the rise of traffic big

    data, and the development status, pain points, priorities, strategic planning,

    and implementation programs of traffic big data. It recommends a

    way to develop traffic big data with Chinese characteristics. The book’s

    systematic review of the development of China’s traffic big data is

    impressive. In particular, while summarizing traffic big data cases of

    transportation powers such as the United States and the United Kingdom,

    the book also gives detailed analysis of the exploration and practice in this

    area by Beijing, Shanghai, Guizhou, and Yunnan. It provides valuable

    experience for decision-makers, managers, governments at all levels,

    technical service providers and equipment manufacturers. The develop-

    ment of traffic big data will not only accelerate the in-depth application of

    the next-generation information technology such as big data, cloud com-

    puting, sensors and artificial intelligence in the transportation area, but

    more importantly, it will bring a new way of thinking and development

    philosophy to the transportation industry.


    Compared with Europe and the United States, China still lags behind

    in the traffic big data software and hardware such as technology, equip-

    ment, and information systems, but we can catch up if we learn from their

    experience. However, if we lag behind in our way of thinking and devel-

    opment philosophy, we will remain imitators and followers forever, and

    the dream of becoming a transportation power will never come true.

    Therefore, in the future, China should seize the important opportunities

    brought about by traffic big data, innovate our ways of thinking and devel-

    opment philosophy, introduce advanced technologies, equipment, and

    management models, and catch up with them through developing traffic

    big data, so as to turn ourselves from a big transportation country into a

    transportation power.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Zhao Guanghui is Professor Ni Jun’s student. As a young talent in science and
    technology recognized by the Ministry of Transport, he pursues rigorous and precise
    study of big data, and he is good at innovation and exploration. I am so delighted
    to write a foreword his book Big Data Transportation Systems. I headed a team
    in 2014 to the M. Wu Manufacturing Research Center of the University of Michigan
    to study the US manufacturing. At that time, Professor Ni Jun happened to be in
    China. Dr. Zhao told us at the seminar that he used to work at the Ministry of
    Transport, and came to the University of Michigan to study big data manufacturing
    and traffic big data. It was a very rewarding visit. Four years have passed, but
    I still remember vividly taking photo with Dr. Zhao on the campus of the University
    of Michigan. In the past four years, he wrote a series of books on traffic big
    data, some of which have been published overseas. He is always tireless and diligent,
    and young scholars can learn from him.


    You Zheng

    Tsinghua Campus, China

    April 13, 2018'
