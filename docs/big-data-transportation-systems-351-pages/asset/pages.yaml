    # 12.4.3.2 Travel on separate roads


    Travel on separate roads will set different lanes for pedestrians, bicycles, electric
    vehicles, private cars, buses, and other different vehicles and they will travel
    on the corresponding lanes and control their travel routes within the travel range.
    At present, the highway and rail transportation have almost realized the travel
    on separate roads. In the early application of the unmanned driving cars, it is
    necessary to set up special lanes for the unmanned driving cars in order to improve
    the safety and reduce the negative impact of accidents.


    In the future, when the traffic lights at the traffic intersections are canceled,
    the lane separation from people to vehicles will be an inevitable choice, because
    it is difficult for ordinary people to judge the route of the unmanned driving
    vehicles, and at the same time, it is difficult for the unmanned driving vehicle
    systems to find fixed patterns in the large number of irregular flows. Indeed,
    with the widespread application of the Internet of Things technology, pedestrians
    will be able to interact with the unmanned driving cars in the future, but passengers
    in the cars may not be willing to compromise, which may lead to unnecessary conflicts
    and disputes, and lane splitting will effectively solve this problem.


    In addition, when the unmanned driving cars and manned driving cars are working
    on the same road, due to the lack of binding force of the intelligent traffic
    center system with unified dispatching function on the human-driven cars, the
    instructions will not be effectively implemented, and conflicts would occur frequently,
    which is by no means the desired outcome.'
