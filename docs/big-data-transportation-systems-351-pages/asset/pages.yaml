  md: 'The above technologies may seem isolated from each other, as a matter of fact,
    they can be systematically grouped into three levels: the levels of perception,
    decision-making, and execution. Among them, the perception and identification
    of the external environment is classified into the perception level, the positioning
    and navigation system and path planning are classified into the decision-making
    level, and vehicle control technology is classified into the executive level.
    In addition to these main technologies, there are many other technologies involved
    in unmanned driving, which are detailed as follows.


    # 12.3.2 Perceptual level: Collecting environmental and driving information


    The unmanned driving cars make full use of the collaboration among radar, sensors,
    satellite navigation systems, artificial intelligence computing modules, and other
    hardware and software facilities to allow the car to drive autonomously without
    anyone interfering. The unmanned driving car will be equipped with a large number
    of on-board sensors, which are equivalent to equipping the car with a myriad of
    eyes, therefore, the unmanned driving car is significantly safer and more reliable
    than ordinary cars.


    In the process of the unmanned driving, the most important thing is the implementation
    of the unmanned operation on the basis of the perception of the environment and
    this technology plays a fundamental support role in the unmanned driving technology.
    In addition to conducting environmental perception, the application of vehicle
    control technology is also involved in the technology, that is, the development
    of the unmanned driving has to depend on environmental perception and vehicle
    control technology support.


    In a relatively well-developed unmanned driving system, the information collection
    network collects information about the car’s surroundings, and then an intelligent
    algorithm formulates a driving plan, followed by the use of an intelligent vehicle
    driving controller to get the car to its destination.


    The perception level is an important channel for the unmanned driving cars to
    obtain external information. At present, the intelligent sensor system for the
    unmanned driving cars to perceive the external environment mainly contains three
    components: visual sensors, LIDAR, and millimeter wave radar. The navigation through
    the visual sensor is also known as visual navigation. The vehicle will achieve
    car positioning and'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'detecting the surrounding environment by using the camera to obtain local images
    of the environment around the road and using the technology of image recognition,
    etc.


    The lidar allows the unmanned driving cars to monitor dynamic obstacles in real
    time and it is characterized with anti-light interference ability and high detection
    accuracy, which can provide strong support for dynamic obstacle monitoring and
    motion status assessment. The lidar is able to acquire many environmental parameters
    such as the number of lines, accuracy, point density, scanning frequency, detection
    distance, horizontal and vertical viewing angle, providing basic information such
    as position and distance, as well as feedback on the density of the target object,
    thus allowing the algorithm to derive its reflectivity, which is helpful for in-depth
    analysis.


    The millimeter-wave radar has a frequency range between 30 to 300 GHz, which is
    similar to the low frequency band or the centimeter band, and it is able to make
    all-weather images. The high-frequency band takes full advantage of the high resolution
    of infrared waves. The millimeter-wave radar and lidar follow the same detection
    principle, and they use the reflection of the object on the radar wave to obtain
    the target object data, but the millimeter-wave radar technology is more mature.
    In terms of penetration and cost it has certain advantages, but the disadvantage
    is also more prominent, for example, the frequency band on the detection distance
    is too large, it is difficult to perceive the pedestrians and it cannot realize
    the target of fine identification.


    The mainstream trend of the unmanned driving car exploration projects is to improve
    the car’s ability to sense its own operating state and the surrounding environment
    through the integrated use of a variety of intelligent sensing systems. In general,
    the process of unmanned driving consists of two steps: the first step is to obtain
    the information about the environment by using technologies such as radar; and
    the second step is to control the car’s braking and steering systems on the basis
    of the judgments about the environment to ensure that the car can safely and steadily
    function on the road. By combining these two modules and taking advantage of the
    synergy between them, the entire process of the unmanned driving can be accomplished.


    The car can capture information about its current location, the road, surrounding
    vehicles and obstacles, and send this information to the central computer in the
    car by using the environmental sensing technology so that it can grasp the situation
    on the way to help the car to set and adjust'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'the driving route, and finally reach the planned goal. In other words, the
    car can obtain information about its location and surrounding objects through
    the environment perception technology, judge the properties of these objects and
    their distance from itself, and grasp the current environmental information from
    the macro level.


    At the present stage, the technologies used in the environmental sensing mainly
    include visual sensing, laser sensing, and microwave sensing. With the help of
    these technologies, the car sensors, in-vehicle communication systems, and radar
    systems can capture the environmental information, present two- or three-dimensional
    images by using information technology, and send the acquired information to the
    information processing terminal, where the technicians will process the three-dimensional
    images to perceive and judge the real-time environment of the car. In addition,
    different cars can also be connected to collect real-time environmental and driving
    information of different vehicles. The application of remote communication technology
    and Li Yongle''s wireless network technology in the unmanned driving field effectively
    improves the car''s ability to perceive the environment and promotes the development
