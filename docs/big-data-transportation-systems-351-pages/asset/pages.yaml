    of big data transportation can provide rich and effective practical information
    for logistics information. In order to make the logistics industry get better
    development, it is very important to study the establishment and construction
    of the relationship between logistics and big data transportation.


    # 7.1 Big Data Transportation and Transportation Organization


    Logistics transportation organization includes a series of transportation activities,
    such as investigation and prediction of transportation, preparation for transportation
    plan, allocation of transportation vehicles and ships, organization of passengers
    and freight stations, transportation vehicle scheduling and route optimization,
    tracking, positioning and monitoring of transportation process, and coordination
    of multimodal transportation.


    The organization of information transportation is inseparable from the application
    of big data transportation technology, which permeates all aspects of transportation
    production including the application of electronic technology, network technology,
    and communication technology, and has different forms of software and hardware.'
