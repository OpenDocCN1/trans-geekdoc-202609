    +   (1) Emergency braking and satellite navigation system: When there is an emergency
    situation, the braking system will be activated immediately in response to ensure
    that the unmanned driving car is under the effective monitoring of the human.


    +   (2) Adaptive cruise control system: This system is to ensure that the unmanned
    driving car maintains a safe distance from the vehicle in front of it so that
