  md: '# 12.5 Key Factors in Unmanned Driving from Concept to Practice


    # 12.5.1 Safety: The inevitable destination for unmanned driving development


    The quest for safety is spurring a rapid growth in demand for the unmanned driving
    vehicles. According to the data released by the World Health Organization, globally,
    approximately more than 1.2 million people die in road traffic accidents each
    year. In China, human-caused traffic accidents account for 93%, with an average
    of 500 people dying in traffic accidents every day. With the emergence of the
    unmanned driving cars, the traditional “human–car–road” ternary control will be
    transformed into the “car–road” binary control, with the result that the uncontrolled
    drivers will be eliminated and “zero violations” will be achieved so that the
    efficiency and safety of the traffic system will be greatly improved and the frequency
    of traffic accidents will be significantly reduced, thus driving safety will be
    effectively ensured. Studies have shown that after automobiles are equipped with
    automatic braking systems, the incidence of rear-end accidents will be reduced
    by 40%; if all motor vehicles are equipped with the automatic braking systems,
    the number of traffic accidents can be reduced by 700,000 per year.


    The premise of the unmanned driving development is safety. The safety and reliability
    of unmanned driving has not yet been widely recognized by the people because unmanned
    driving technology is still at the trial and improvement stage. For example, the
    British regulators require that the unmanned driving cars have to be monitored
    by humans when they are driven on the road, and they have to be able to be switched
    to the manned driving mode at any time; Germany plans to release a series of regulatory
    policies on automated vehicles, including the requirement that the unmanned driving
    cars have to be equipped with a steering wheel, have a device installed that is
    similar to the black box of civil aircraft so that in the event of a car accident
    the relevant investigators can be based on the black box for the causes of the
    accident analysis, therefore the responsibility of all parties will be made clear.


    Volvo in Sweden has conducted a survey which showed that more than half of the
    consumers support the installation of steering wheels in automatic cars, and 80%
    of the consumers said that the manufacturer'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'should be responsible for settling claims if an accident occurred in a self-driving
    car because the cause of the accident was a malfunctioning autopilot system. In
    fact, if an unmanned driving car encounters an emergency while driving, the user
    does not trust the autopilot system to respond effectively and the struggle for
    control is likely to bring about extremely serious consequences. This is because
    the drivers tend to be more relaxed during the process of autopilot and do not
    pay much attention to the driving conditions, they are likely to make wrong judgments
    and put themselves in danger when faced with unexpected situations.


    When faced with such a situation (a traffic accident) where the driver and vehicle
    are competing for control, it is difficult for the traffic department to decide
    which is the party responsible for the accident. On the other hand, if the driver
    is required to remain vigilant and ready to switch to human driving mode while
    the car is in motion, it would be better to adopt human driving directly. This
    “human or car” design makes the unmanned driving meaningless and increases the
    burden on the driver’s mind, which will make the desire to drive freely and comfortably
    futile.


    Moreover, in essence, this “human or car” design is an irresponsible manifestation
    of the safety of unmanned driving. If there is a “back road” of manned driving,
    the relevant personnel will not focus on the unmanned driving safety issues, and
    the unified standards for the design and manufacture of the unmanned vehicles
    cannot be built in a short period of time, therefore the user’s safety will not
    be effectively guaranteed.


    On May 7, 2016, the Tesla Autopilot that activated the automatic driving assistance
    system collided with a white tractor-trailer truck while driving, the top of the
    Autopilot was completely destroyed and the driver died on the spot. Tesla’s explanation
    for the accident is that the white truck was not recognized against a blue sky
    background and the side of the tractor-trailer truck was suspended on the ground
    from Autopilot’s viewpoint, which caused the Autopilot system to miscalculate
    and fail to activate the automatic brakes, resulting in a collision between the
    two vehicles. Also, because the location of the vehicle collision was at the windshield
    of Autopilot, the crash safety system failed to work, killing the driver at the
    scene.


    The accident caused an uproar because Tesla had claimed that a fatal traffic accident
    occurs every 94 million miles in the US and that the Autopilot-assisted driving
    system had traveled 130 million miles at the time of the crash. Also, Tesla stressed
    that the unmanned driving'
