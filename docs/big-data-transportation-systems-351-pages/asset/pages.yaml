    in the 1970s, and major breakthroughs have been made in the feasibility and practicality.
    By the late 1980s and early 1990s, many countries detached from unmanned driving
    automobile research projects and began to focus on highway civilian vehicle-assisted
    driving projects because the expected goals were too complex and the technical
    conditions were immature. The unmanned driving cars of this period, however, were
    semi-autonomous vehicles, and there was a large gap between them and the real
    unmanned driving cars.


    Until 1999, the unmanned driving car developed by Carnegie Mellon University in
    the United States successfully crossed the east and west of parts of the United
    States. On 5,000 km of the intercontinental highway, the vehicle traveled more
    than 96% of the distance at a speed of 50 to 60 km/h autonomously, thus the unmanned
    driving car project was declared a success.


    In 2000, Toyota Motor Corporation had developed the unmanned driving bus and the
