    # ## 12.6.4 Difficulties in the application of the unmanned driving in urban rail
    transit


    +   (1) Online Testing and Monitoring: Monitoring vehicle operating status is
    only part of the online monitoring work of the unmanned driving system and there
    are a number of other systems including the automatic booking system, signaling
    system, passenger information system, fire alarm system, etc. In the event of
    system failure, it should also respond in a timely manner and make the corresponding
    resolution. Obstacle detection is an essential part of the unmanned driving system
    that cannot be ignored, and in addition to the detection, appropriate handling
    measures should be taken. Nowadays, contact detection is the commonly used detection
    method in the industry, and there is lack of effective non-contact obstacle detection.
    If an obstacle is detected, it will be responded by emergency braking, which makes
    it difficult to improve the efficiency of unmanned driving. At the same time,
    it is necessary to focus on the pyrotechnic detection, anti-terrorist riot monitoring,
    foreign object intrusion monitoring, and their corresponding handling methods
    to reduce the resistance in the operation of the unmanned driving vehicles.


    +   (2) Automatic Linkage of Vehicles: If the train encounters an emergency situation
    during operation that causes an anchor, it is necessary to start an emergency
    rescue. In the process of emergency rescue, the broken-down train should be connected
    to the rescue vehicle, the automatic connection can solve this problem. However,
    if we want to quickly complete the one-time automatic linkage between the anchored
    train and the rescue vehicle at the rescue site, we have to improve the relevant
    technical levels. The current automatic linkage has many limitations, and only
    the communication trains that run in the same direction and have their doors in
    a closed and locked state can achieve the'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'automatic linkage. In the future, more attention should be paid to improve
    the rescue efficiency of broken-down trains and reduce the limitations of the
    automatic linkage.


    (3) Emergency Accident Handling in Operation: A serious crisis can occur if an
    emergency occurs in operation, especially if an unforeseen situation occurs in
    the train. For example, a serious crisis may take place when a passenger presses
    the emergency brake button on a train which is in the operating zone and the train
    is in fully automatic operating mode without a following maintenance crew. For
    this kind of situation, the operating managers need to develop the targeted solutions.
    From time to time, there will be cases of passengers violating the rules of subway
    operation in the stations, for example, the passengers force their ways into booth
    screen doors or train doors being jammed while the train is closing the doors,
    which will result in the abnormal operation of the train. All these emergencies
    should be dealt with by the station staff, which requires them to predict the
    risks and make efficient resolutions.


    At present, there are still many technical difficulties that need to be overcome
    in unmanned driving like the construction of the better signal systems. The subways
    of first-tier cities in China carry a lot of passenger pressure including the
    high frequency of departures and the demanding requirements for safety, but the
    function of the subway system will be gradually improved on the basis of increasing
    technical levels, and the difficulties faced by the unmanned driving technology
    will also gradually be overcome. When the development of the operating system
    is gradually bettered, more and more urban rail transit will introduce the unmanned
    driving technology, which will promote the metro operations to achieve a leapfrog
    development.


    # 12.6.5 Solutions of urban rail transit based on unmanned driving


    The urban rail transit, as an important part of urban transportation construction,
    is the mainstream tool for urban residents’ daily travel, which has a crucial
    impact on their travel experience. In recent years, the urban rail transit technology
    ushered in a period of rapid development and a large number of unmanned driving
    technology applications emerged,'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'which provide new ideas for controlling train operating costs and improving
    the quality of travel services, and it is a major hot direction in the field of
    transportation. Therefore, the analysis of the unmanned driving technology application
    in the urban rail transit to find effective solutions will promote this technology
    in the city, which will have a positive influence on the large-scale application
    of unmanned driving technology in the field of rail transportation.


    # 12.6.5.1 Guarantee of facilities and equipments


    **Train Functional Guarantee**: The unmanned driving train in operation does not
    need human involvement because the train not only has the automatic operating
    functions but also tests their breakdown. When there is a potential safety hazard
    or fault in a certain part of the train, it is necessary for the train to be able
    to find out the root of the problem, provide effective solutions, take effective
    measures in time to prevent the situation from worsening so that the stable and
    safe operation of the train can be ensured.


    It is necessary for the train to be able to automatically perform backward positioning.
    The execution of loading and unloading operations is likely to cause safety accidents
    when the unmanned driving train crosses the stopping position. Therefore, it is
    necessary to ensure that the unmanned driving train can perform backward positioning
    to ensure the safety of passengers on and off the train.


    It is also necessary for the train to obtain the function of detecting and handling
    obstacles automatically. Major traffic accidents may happen when the unmanned
    driving train encounters obstacles in the course of operation and no effective
    measures are taken in a timely manner. Therefore, the unmanned driving trains
    must be able to automatically detect and effectively handle obstacles in order
    to ensure the safety of trains in operation.


    It is necessary for the train to obtain the function of video monitoring as well.
    With the support of the video monitoring system, the train operation control center
    can keep track of the internal and external conditions of the train in real time,
    so that the control center can make timely and effective adjustments to prevent
    traffic accidents when problems arise in the operation of the train.'
