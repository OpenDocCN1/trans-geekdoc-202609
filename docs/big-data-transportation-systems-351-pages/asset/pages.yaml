    density can largely reflect the road traffic conditions. Therefore, taxi trajectory
    data reflected by onboard GPS and BeiDou system can be used to analyze the changes
    of urban traffic congestion. For example, traffic flow density model is built
    and large taxi trajectory database is used to automatically determine the capacity
    of each road section, so as to estimate the average speed of the road section
    and predict the traffic situation and potential traffic congestion.


