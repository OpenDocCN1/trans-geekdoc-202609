    # 12.2.3.3 Elderly and disabled people


    At present, the unmanned driving vehicles have been used on a large scale for
    two groups of people: the elderly and the disabled people. Because of the physical
    limitations, the elderly and the disabled people face the problem of inconvenience,
    and the use of unmanned driving vehicles can help these two groups of people to
    solve their travel problems.


    It is predicted that by 2050, the elderly population in the United States will
    exceed 80 million, accounting for more than 20% of the total population, and one-third
    of them will face travel problems, which is also the case in China. By 2050, China''s
    elderly population is expected to account for 33% of the total population. In
    Japan, the proportion of elderly people in the total population is expected to
    reach 40% by 2060. At the same time, the size of the disabled population is enormous.
    For example, there are about 53 million people with disabilities in the United
    States, making up 22% of the adult population. About 13% of US adults have mobility
    impairments and 4.6% have visual impairments.


    These people with disabilities and the elderly provide a wide market for the promotion
    of the use of the unmanned driving vehicles, and both groups seek independence
