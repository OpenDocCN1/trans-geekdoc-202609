  md: '# 8.4.1 Application of big data in active parking system


    The problem of parking has become a universal traffic problem in the city, which
    not only affects the travel time but also affects the traffic efficiency because
    the vehicles cannot find the parking space quickly. Therefore, parking problem
    is a crucial problem in station planning.


    With the application of big data, the parking system will be improved effectively.
    Among them, the active parking system has received more and more attention.


    The so-called active parking system means that big data can quickly capture the
    information of the surrounding parking lots and push relevant contents to users.
    For example, when the electronic license plate has GPS positioning function, the
    parking guidance system will quickly compare the location of the vehicle with
    the information of the nearby parking lot, and push the route for the vehicle
    to predict the arrival time of the parking lot. In this way, the owner can choose
    the parking lot or reserve the parking space in advance to realize the purpose
    of fast parking.


    At present, Shenyang in Liaoning Province has begun to explore this aspect. In
    a certain scale of parking lot, Shenyang has begun to implement parking guidance
    system, set GIS technology in the parking lot, and provide access to the city’s
    parking information management platform. Besides, the system is integrated with
    the mobile terminal, and the vehicle owner can quickly query the data, access
    guidance to the parking, and pay the parking fees. With the combination of big
    data and the cloud platform, the parking lot in Shenyang is integrated into the
    unified management system to solve the problem of parking.


    At the same time, the active parking system can also judge whether there is a
    problem of disorderly parking according to the parking position. In case of any
