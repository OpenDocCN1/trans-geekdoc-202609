    Compared with the semi-automated ones, the fully automated unmanned driving automobiles
    are safer because the former can be subject to human errors while the fully automated
    unmanned ones cannot be. For example, a survey by the Virginia Tech Transportation
    Institute (VTTI) showed that it takes 17 seconds for a driver of a Level 3 automated
    automobile to respond to takeover request from the automobile, and if the automobile
    is traveling at 65 mph, the vehicle will have covered 1,621 feet, or 494 meters,
    during these 17 seconds.


    From seeing an object on the road to applying the brakes to the automobile, it
    will take the human driver 1.2 seconds, which is much longer than the 0.2 seconds
    used by the on-board computer. Although the gap is only 1 second, the automobile
    can travel 40 meters in 1.2 seconds if the automobile is traveling at 120 km/h,
    and it can only travel 6.7 meters in 0.2 seconds. In the case of an emergency,
    this one second gap could be the very one between life and death for the passengers.
    Therefore, for the entire automotive industry, unmanned driving is the ultimate
