    # ## 2.1 Self-Service Travel of Big Data Transportation


    With the increasing popularity of automobiles and the diversification of transportation
    modes, as well as the development of intelligent transportation, people’s travel
    methods are increasingly personalized. Whether it is transportation to work or
    holiday trips, self-service travel is becoming more and more popular with consumers.
    People’s sense of autonomy and self-service are getting increasingly stronger,
    and they no longer need staff to give full guidance during the trip, and they
    can complete the whole process of inquiry by using their mobile APP.


    Looking at the current market, the way people travel on their own involves various
    means of transportation, including bicycles, cars, trains, high-speed trains,
    airplanes, etc.'
