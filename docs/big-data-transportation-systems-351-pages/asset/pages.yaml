- pgno: 13
  md: '# Preface


    In today’s world of rapidly expanding information, the data have become a valuable
    resource for the development of human society. The Internet age, in the form of
    e-commerce, e-office, e-government, etc., has brought human data communication
    to the PB level, and in most scenarios of our lives, the big data have become
    a way and a synonym to describe the large amount of unstructured and semi-structured
    data.


    In particular, the value and role of big data in the field of transportation,
    which is closely related to our lives, is constantly highlighted. The vast amount
    of data and information in the transportation sector, if not properly mined and
    used, will only be wasted as valuable resources. Moreover, the goal of intelligent,
    personalized, and self-service transportation will be an empty word.


    In a sense, big data transportation is the intelligent transportation and self-service
    transportation. With the support of big data, transportation will be more reasonable
    and more efficient.


    Since the rapid development of the field of intelligent transportation in 2005,
    big data has been highly valued by the government as a goal to “ensure safety,
    enhance efficiency, improve the environment and save energy”. Many of the technologies
    in the field of transportation are at the international leading level. With the
    increasing popularity of big data, big data transportation and intelligent transportation
    are more and more pervasive. Related products and services are also constantly
    entering people’s lives.


    For example, shared bicycle, Didi taxi, carpooling, self-service travel, Gaode
    map, and intelligent logistics are intelligent products and services'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'which show vigorous vitality under the support of big data, and transportation
    has become more efficient and environmentally friendly.


    The development of big data transportation is considered of great importance not
    only by China but also is an important topic all over the world. However, Japan,
    the United States and Europe, which developed earlier, have their own unique technology
    and experience. These techniques and experiences are worth studying and learning
    from in order to better develop our big data transportation. We may not resolve
    our own defects by accepting other’s good suggestions, but it is possible to turn
    them into our own use. In the development and research of big data transportation,
    we have to learn from others, we have to be good at the application and imitating
    things can never be independent.


    Throughout the book, the discussion and research are explained in Parts I and
    II, and the order of cognition first and then practice also fits the cognitive
    habits of the readers. The book cites a large number of domestic and foreign cases,
    including relevant government action cases, as well as cases of exploration by
    enterprises in an attempt to present a comprehensive picture of the present and
    future of the development of big data transportation.


    The development of big data transportation has not been smooth sailing. Although
    much has been achieved, there are still various problems. For example, the development
    of big data transportation in China is relatively chaotic and lacks in the formation
    of a unified layout. The administrative regions are somewhat fragmented and lacks
    in a unified standard, which is not conducive to the future development of big
    data transportation, and data without standards cannot be used as a whole. If
    transportation data is shared in the future, it is likely to be costly and time-consuming
    to harmonize the formats and standards.


    Besides, because the big data transportation started off late in China, at the
    level of data transportation sharing, there are no big platforms to realize the
    opening and sharing of data resources. These aspects have a long way to go compared
    to foreign countries. Without advance planning and research, various obstacles
    may arise in the future.


    Overall, the development of big data transportation in China has been very successful
    and the future is extremely bright. On the basis of development in accordance
    with national conditions, we should learn more from foreign experience, plan ahead,
    and take advantage of the early layout. Accurately grasping the advantages of
    big data in the field of intelligent transportation plays a very important role
    in improving'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'transportation efficiency, solving traffic congestion, ensuring transportation
    safety, reducing environmental pollution, and improving China’s traffic conditions
    at a new height and starting point.


    In the future, we look forward to more convenient and easy transportation. No
    matter the government or the enterprise, they can explore better modes in big
    data transportation and intelligent transportation, so as to realize a bright
    future with smooth transport and communication, friendly environment, and convenient
    transportation.


    The book was written in a hurry, which inevitably leads to various mistakes. I
    am grateful for all readers correcting them enthusiastically!'
  merge: -1
  img_proc: true
