    major holidays, the integration model will be opened to cope with the coming traffic.


    +   (4) **Trajectory tracking model.** Trajectory tracking model realizes the
    search of the same number and firmly locks the trajectory of people and vehicles
    with the help of the correlation of various information, such as license plate
    tracking and new license plate tracking. Generally speaking, if there is a major
    traffic accident and the perpetrators need to be arrested quickly, this big data
    management model will start.'
