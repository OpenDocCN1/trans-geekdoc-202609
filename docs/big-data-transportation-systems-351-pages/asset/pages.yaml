    characteristics and changing trend of the traffic flow distribution and monitor
    the road state so as to make the congestion index, and manage the traffic by adjusting
    the traffic signal lights. This model is a conventional management model which
    is applied to daily traffic management.


    +   (2) **Risk management model.** For the high-risk traffic sections, the risk
    and vulnerability analysis is carried out with the help of big data. Through the
    comparison of historical data, the problems that are about to occur are predicted,
    and the risk management mechanism is established. This model is usually used before
    the temporary large-scale activities.


