    big data applications, as well as the comprehensively complete transportation
    network in the United States, the development of big data transportation in the
    United States leads the way for global big data transportation development.


    From the logy of development, the United States adheres to the idea of government-guided
    norms and market-led development. The U.S. government has introduced a series
    of policies on big data research and applications, such as the release of the
    _Federal Big Data Research and Development Strategic Plan_ in May 2016. These
    policies set the norms for enterprises to develop big data applications from a
    government framework. With the relevant norms in place, companies simply need
    to drive big data within the framework for industry convergence. As an important
    application area, big data transportation is bound to be vigorously developed
    by the government and the market.


    It is with the support of policy and the associated technological base that the
    development of big data transportation in the United States has some distinct
    features.


    # ### 3.1.1 Years of technological sophistication and innovation


    Within the field of big data transportation, the years of technological sophistication
    in the United States have led to two developments. One is the accumulation and
    improvement of the transportation network. The U.S. has a dense transportation
    network and experienced infrastructure as well as governance in the transportation
    field, which is the foundation for big data transportation. The United States
    has also been implementing plans to establish an information superhighway since
    the 1990s. By now, the network infrastructure has been well established and protected
    as a strategic asset. Back in 2007, Walmart had built a mega data center with
    a storage capacity of over 4Pb.¹'
