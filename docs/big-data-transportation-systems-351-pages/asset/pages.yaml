    # 12.6.1.3 Profile of the unmanned driving technology applications in China


    There are already a significant number of subway lines in China which make full
    use of the automated unmanned driving technology.


    +   (1) Beijing Rail Transit Airport Line: This line adopts fully automatic unmanned
    driving trains, which can optimize and adjust the train running strategy and running
    density according to the passenger flow, and at the same time, it is equipped
    with a relatively complete operation assistance system that can locate the trains
    in real time, make the trains fold back automatically, shorten the running interval,
    and improve the passenger carrying capacity.


    +   (2) Shanghai Metro Line 10: This line is the first line in China to apply
    the unmanned driving technology which can drive with more accurate acceleration
    and deceleration control, with no need to consider the driver’s shift plan, and
    a large number of self-checks after starting up the train every day. The train
    has a higher level of safety and reliability.


    +   (3) Beijing Rail Transit Yanfang Line: This line is the first fully automatic
    running metro line developed independently in China and the second'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'line applying the unmanned driving technology following Shanghai Metro Line
    10. The first phase opened at the end of 2017 and the second phase was expected
    to open in 2020, with trains running smoothly and efficiently, which can provide
    passengers with quality riding experience and reduce energy consumption by 10%
    to 15% compared with the ordinary trains.


    Much convenience had been brought by the application of the unmanned driving technology
    thanks to the urban rail transit running on a specific track, and less interference
    from pedestrians and other vehicles is involved. The research on and development
    of the unmanned driving technology will not only promote the increasing improvement
    of urban rail transit, but also lend valuable reference experience for the large-scale
    application of the unmanned driving technology in the field of transportation
    so that human society will usher in a new chapter of the era of the unmanned transportation.


    # 12.6.2 Functional features of unmanned urban rail transit system


    In recent years, the development process of urban rail transit has been accelerating,
    and the corresponding supporting technology has also been rapidly updated. Many
    first-tier cities with large populations have to bear greater pressure on passenger
    flow, therefore they can only shorten the process of new line construction and
    increase the number of busy lines and frequency of shuttles, which must absorb
    more crew members, drivers, etc., and undoubtedly more costs have to be invested
    at the same time.


    In addition, increasing the frequency of trains will increase the labor intensity
    of manual work, and if heavy physical labor is maintained for a long time, safety
    accidents are likely to occur due to fatigue. Considering this situation, the
    urban rail transit industry is increasingly involved with the unmanned driving
    technology.


    In summary, the functional features of the unmanned driving systems in urban rail
    transit are reflected in the following aspects:


    +   (1) The automated control over the train''s operation is specifically displayed
    in the train starting, train alignment, obstacle recognition, train and screen
    door monitoring, formation adjustment, and many other'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'working processes. The operation of the train can be intelligent operation
    instead of the traditional manual operation, which achieves electro-mechanical
    integration of operation.


    +   (2) The efficiency and comfort of the trains can be improved and energy can
    be saved as well. The goal of saving energy can be achieved through taking the
    planned timetable as a reference to control the train’s running interval and running
    time reasonably; and the impact rate of the traction brake is effectively controlled
    by computer and the acceleration and deceleration are only carried out when necessary.
    The changes to the opening scheme are made and the reasonableness of the train
    running interval is maintained on the basis of the analysis of historical passenger
    space-time distribution, real-time cross-sectional passenger flow changes, large
    passenger flow warning information by combining them with the original plan, and
    if it is necessary, the passengers will be immediately evacuated.


    +   (3) The operation of the vehicle, communication, and signal systems can cooperate
    with each other and form relatively perfect subsystems in each part, which gives
    full play to the role of the Integrated Supervisory Control System (ISCS). The
    connection between different subsystems is strengthened to exert different functions
    in train rescue, equipment trouble shooting, and other work. The COCC, combined
    with ISCS, is used to jointly implement automated network operations and improve
    operational efficiency as a whole.


    +   (4) The human-machine monitoring interface and the corresponding interface
    is opened to send relevant information for operators, passengers, and maintenance
    departments when the trains remain in normal running condition, so as to make
    it convenient for the demanders to inquiry and use; if abnormalities occur, the
    safety program will be automatically enabled and the early warning will be given
    so as to clarify the degree of influence and find the root cause of the problem
    in an automated way or in cooperation with technical personnel, and the interface
    service is opened to facilitate the intervention of maintenance personnel.


    # 12.6.3 The requirements of the unmanned driving for urban rail transit


    +   (1) Listing and control systems require high safety. As an important part
    of the unmanned driving system, the control system is responsible for'
