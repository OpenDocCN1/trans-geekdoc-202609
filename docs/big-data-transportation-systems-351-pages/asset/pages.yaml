    Through the UAV transportation service supported by big data, it used to take
    two or three hours to deliver ordinary daily necessities, but now it only takes
    roughly 20 minutes.


    By using big data transportation technology, we can fully improve the logistics
    efficiency, help enterprises to improve the problems, and expand the promotion
    space by optimizing the transportation organization.


    Specifically, the impact of big data transportation technology on transportation
    organization is reflected in the following points:


    # 7.1.1 Transportation environment forecast


    In the past, logistics enterprises were always used to predict the transportation
    environment through past experience, questionnaire, or prior contact, for example,
    looking for customer sources, designing the best route and understanding the traffic
    changes. But in fact, when the findings are summed up, the transportation environment
    is likely to change.


    Compared with the past, big data can help logistics enterprises to fully and accurately
    outline the transportation environment and reflect the environmental changes through
    real and effective data so as to make predictions on the various stages of product
    transportation. In this way, the transportation organizer can reasonably set the
    transportation plan.


    # 7.1.2 Location of transportation nodes


    In transportation organization, the location problem of transportation nodes requires
    logistics enterprises to minimize the distribution cost on the basis of fully
    considering their own business characteristics, commodity characteristics, and
    traffic conditions. This problem can be solved by using the classification tree
    method in big data technology.'
