  trans: '


    那些有兴趣投资首次代币发行（ICO）的投资者，可以先熟悉加密货币领域。大多数 ICO 要求投资者使用预先存在的加密货币购买代币。这意味着 ICO 投资者需要一个用于以太坊或比特币等不同货币的钱包，以及一个能够存储他们选择购买的货币或代币的钱包。一个人该如何寻找可供投资的
    ICO 呢？


    跟上新的 ICO 并不容易。积极的投资者最明智的做法是在线上阅读有关潜在项目的信息。ICO 会引起很多关注。网上有很多投资者聚集讨论潜在前景的网站。有一些专门用于获取
    ICO 的网站，使投资者能够了解新的发行并相互比较。


    ## ICO 与 IPO


    传统企业有几种筹集扩张和增长所需资金的选择。企业会明智地起步，并在销售允许时扩张，此时只有公司所有者作为其债权人。然而，这意味着他们不得不等待资源积累。


    公司通常会寻求外部买家的早期资金，这些买家可以用一部分股权作为交换，为他们提供迅速的资金注入。另一种选择是通过首次公开募股（IPO）交易股票并上市，从私人投资者那里筹集资金。虽然
    IPO 仅涉及出资者，但 ICO（包括众筹活动）可以涉及那些有兴趣投资新项目的投资者。


    ![What is the difference between cryptocurrency coins and tokens? - Quora](img/image00125.jpeg)


    然而，ICO 与 Kickstarter 不同之处在于，ICO 支持者是由其支出可能带来的回报或利润所驱动的，而众筹项目本质上是捐赠。这就是为什么 ICO
    被称为“众筹销售”。有趣的是，ICO 与 IPO 仍然保持至少两个重要的结构区别。ICO 本质上是不受监管的，这意味着像证券交易委员会这样的监管机构并不控制它们。


    其次，由于其去中心化结构和缺乏监督，ICO 远比 IPO 更缺乏结构。ICO 可以以多种不同的形式组织。在某些情况下，组织会设定特定的筹资目标或上限，这确保了通过
    ICO 交易的每个代币都有预定价格，且代币总供应量保持不变。在其他场景中，ICO 代币供应量是固定的，但筹资目标是弹性的。


    这意味着分发给持有者的代币数量将由筹集的资金决定。另一方面，其他项目提供一种由筹集资金总额计算的复杂代币供应量。在这两种情况下，代币的价值是固定的，但代币总数是无限的。


    ## ICO 的优缺点


    在首次公开募股中，投资者通常会以其资金换取公司的股票。在 ICO 事项中，并没有本质上的证券。相反，通过 ICO 筹集资金的企业会发行一种加密货币代币，这是债券的区块链近似物。在某些情况下，投资者会用一种常见的现有代币（如以太坊或比特币）交换等量的新代币。


    值得注意的是，组织通过 ICO 创建代币是非常简单的。在线服务使得立即生成加密货币代币成为可能。在比较股票和代币之间的差异时，投资者应该牢记这一点。代币没有内在价值，也没有道德保护。ICO
    管理员根据 ICO 的条件创建代币，收集代币并按照其计划分配给单个投资者。


    ICO 的早期参与者通常被吸引购买代币，希望该项目在推出前能够取得成功。如果发生这种情况，他们在 ICO 期间购买的不同代币的估值将高于 ICO 期间设定的价值，从而产生净利润。极高回报的机会是
    ICO 的主要优势。许多持有者因 ICO 而成为百万富翁。随着区块链和加密货币市场中 ICO 的兴起，它们带来了新的障碍、威胁和机遇。许多人投资 ICO 是为了快速高效地获利。


    过去几年中最受欢迎的首次代币发行（ICO）已被证明是这种乐观情绪的基础，因为它们带来了巨额利润。然而，这种热情有可能误导公民。ICO 充斥着骗局和骗子，他们试图利用过于热衷且缺乏教育的买家，因为
    ICO 大多不受监管。由于被盗或疏忽而损失的资金永远无法恢复，因为它们不受 SEC 等金融监管机构的监管。几年前，许多立法和私人机构对 2017 年 ICO
    的爆炸式增长做出了反应。


    几家主要中国银行禁止将代币用作货币，并禁止银行提供与 ICO 相关的服务。因此，以太坊和比特币的价格暴跌，引发了进一步区块链立法即将出台的猜测。该禁令通常适用于已经启动的发行。2018
    年初，Twitter、Facebook 和 Google 屏蔽了 ICO 广告。在 ICO 方面，您无法确定作为投资者不会成为欺诈的受害者。投资者应采取以下预防措施以防止
    ICO 诈骗：


    · 确保项目策划者能够准确识别其目标。成功的 ICO 的白皮书通常简单、易懂，并具有具体、简洁的目标。


    · 了解程序员。投资者应该期望推出 ICO 的组织完全透明。


    · 调查 ICO 的合法条款和条件。由于外部机构很少监管这个行业，投资者有责任确保其参与的任何 ICO 都是合法的。


    确保 ICO 资产存放在一个或多个托管账户中，这是一种需要多个密钥才能打开的钱包。这将帮助您防范诈骗，特别是如果任何密钥由中立的第三方持有。


    ![](img/image00125.jpeg)


    # 第 3 章：加密货币与加密资产


    比特币和其他加密货币是不受实际货币或实物证券保护的数字代币。它们在自愿各方之间交换，无需中介，并记录在数字账本上。加密货币最好被视为受加密保护的数字货币或模拟货币，使得伪造和双重花费几乎不可能。许多加密货币专注于区块链技术，这是一种由分布式计算机网络实现的公共数据库。


    加密货币的特点在于它们不由任何中央实体分发，这使得它们在技术上抵抗政治干预或胁迫。加密货币是一种建立在遍布大量计算机网络上的现代数字商品。由于其自主性质，它们可以独立于政府和中央机构的管辖范围运行。“加密货币”一词来源于用于保持网络稳定的加密机制。


