  trans: '


    任何人，无论种族、性别或文化背景，都有机会使用 `Blockchain` 和 `Bitcoin`，这或许是其最重要的特征。根据世界银行的数据，近 20 亿成年人没有银行账户或任何其他持有资金或资产的方式。这些人中几乎全部居住在发达国家，在那里国家尚处于起步阶段，金钱至上。


    ![Consensus in Blockchain: What You Need to Know | OpenLedger Insights](img/image00125.jpeg)


    这些人也会收到少量现金并以现金形式获得报酬。然后他们必须将这些实体现金藏在家中或营业场所，这使他们容易遭受勒索或不必要的虐待。`Bitcoin` 钱包的密钥可以写下来，保存在廉价手机上，甚至在合适的情况下记在脑子里。


    对于大多数人来说，这些解决方案比床垫下的一小捆现金更不容易被发现。未来的 `Blockchains` 现在正在寻找存储医疗文件、土地所有权以及大量其他民事交易的方法，而不仅仅是作为资产存储的记账单位。


    ## Blockchain 的缺点


    虽然 `Blockchain` 有很多好处，但在采用方面它仍然有很多缺点。当今阻碍 `Blockchain` 技术采用的障碍不仅仅是技术问题。大部分情况下，真正的障碍是政治和立法问题，更不用说将
    `Blockchain` 集成到现有企业网络中所需的数千小时定制产品开发和后端编程了。以下是阻碍 `Blockchain` 普遍接受的一些障碍。


    - `Bitcoin` 采矿的基础设施成本高昂。

    - `Bitcoin` 有被用于非法活动的历史。

    - 每秒交易量低。

    - 立法。


    ### 技术成本


    虽然 `Blockchain` 将为用户节省交易成本方面的资源，但它并非免费技术。例如，`Bitcoin` 的“工作量证明”方案消耗大量计算资源来验证交易。


    ![Four myths associated with Blockchain Technology](img/image00125.jpeg)


    在现实世界中，`Bitcoin` 网络数百万台计算机产生的电力大约相当于丹麦的年用电量。假设能源成本为每千瓦时 0.03 至 0.05 美元，不包括硬件支出的运营成本约为每枚币
    4000 至 6000 美元。尽管加密货币采矿成本高昂，消费者仍愿增加电费以在网络上验证交易。


    也就是说，当矿工将区块引入 `Bitcoin` 网络时，他们会获得足够的 `Bitcoin` 以使其时间和资源值得付出。然而，矿工需要被收费或以其他方式激励，以验证不使用加密货币的
    `Blockchains` 上的交易。这些问题的答案正在开始出现。例如，`Bitcoin` 采矿场已设立以利用太阳能、钻井场的废弃天然气或风力发电场电力。


    ### 速度低效


    `Bitcoin` 是 `Blockchain` 潜在低效性的绝佳示例。`Bitcoin` 的“工作量证明”方法大约需要十分钟才能将新区块连接到 `Blockchain`。据估计，此时
    `Blockchain` 每秒只能处理大约七笔付款（TPS）。


    其他加密货币，例如 `Ethereum`，优于 `Bitcoin`，但它们也受到 `Blockchain` 的限制。例如，传统 Visa 品牌每秒可处理 24000
    笔交易。多年来，人们一直在致力于解决这一问题。目前已有 `Blockchains` 可以每秒处理超过 30000 笔交易。


    ### 非法活动


    虽然 `Blockchain` 网络的匿名性防止人们被黑客攻击并保持其保密性，但它也允许非法交易和运营。丝绸之路（Silk Road）是一个加密的“暗网”毒品市场，从
    2011 年 2 月运营到 2013 年 10 月被 FBI 关闭，这或许是 `Blockchain` 被用于非法交易的最著名案例。


    使用 TOR 浏览器，用户可以在不被监视的情况下搜索网站并进行非法 `Bitcoin` 和其他加密货币交易。根据当前美国法规，金融服务公司必须在客户开户前收集客户详细信息，核实每位客户的身份，并确保客户不出现在任何已确认或涉嫌恐怖组织的名单上。


    这种方法既有优点也有缺点。它鼓励每个人开立金融账户，但仍然使犯罪分子更容易进行交易。许多人声称，加密货币的积极用途，例如为无银行账户人群提供金融服务，其益处大于负面用途，特别是因为大多数犯罪活动仍然使用无法追踪的现金进行。


    ### 监管


    加密社区中的许多人担心政府对加密货币的监管。尽管要终止类似 `Bitcoin` 的东西在去中心化网络发展后变得极其复杂且几乎不可能，但政府可能会使持有加密货币或投资其网络变得非法。随着包括
    PayPal 在内的主要公司继续在其平台上推广加密货币的持有和使用，这一问题已有所缓解。


    ### Blockchain 的进步依赖于可扩展性


    可扩展性，即几乎实时完成交易（如信用卡购买结算）的机会，是 `Blockchain` 面临的关键挑战之一。对于 `Bitcoin` 和 `Ethereum`
    的以太币等加密货币，可扩展性已经被描述为一个问题。如果分布式账本要在金融科技（FinTech）公司中获得普及，并与速度快几十倍的支付网络竞争，它必须在提高可扩展性和吞吐量的同时解决延迟问题。


    ### 引入“分片”


    开发人员正在尝试多种方法来提高交易吞吐量，包括分片。简单来说，分片是一种分区 P2P 网络计算和存储负载的方法，使得没有单个节点对整个程序的交易导向工作负载负责。相反，每个节点仅保存其自身分区或分片的数据。


    分片中的细节也将由其他节点交换，使账本保持去中心化和技术稳定，以便任何人都可以访问所有账本条目；他们只是不处理和存档所有信息，例如银行交易和合同代码。当今
    `Blockchains` 中的每个认证机器或节点主要记录电子账本上的所有数据并参与共识阶段。


    在广泛的 `Blockchain` 技术（如 `Bitcoin`）中，大多数网络各方必须验证新交易并记录数据，如果要将其添加到 `Blockchain` 中；这使得处理每笔付款都缓慢而繁琐。正因如此，基于
    PoW 的 `Bitcoin` 每秒只能处理 3.3 到 7 笔交易；而一份金融文件可能需要 10 到 15 分钟才能完成。另一种广泛使用的 `Blockchain`
    数据库和加密货币 `Ethereum` 每秒只能处理 12 到 30 笔付款。相比之下，VisaNet 平均每秒处理 1700 笔操作。


    ![](img/image00125.jpeg)


    # 第 2 章：开发知识库


    该方法旨在对数据文件进行时间戳标记，使其无法被回溯日期或篡改。`Blockchain` 的目标是消除对中央服务器的需求，以解决重复记录的问题。`Blockchain`
    用于安全地转移货币、土地、合同和其他信息等对象，而无需银行或政府等第三方经纪人。


    '
