    Anyone may validate a block of transactions and link it to the Blockchain.


    Citizens are encouraged to enter public networks, which are often free to access.
    A public Blockchain network can be used by anyone.


    #### Private


    Blockchain technology is contained inside a single company. Only those members
    of the association are allowed to validate and install transaction blocks. Everybody
    on the website, though, is normally permitted to view.


    #### Consortium


    Only a small number of entities will validate and add transactions in this Blockchain
    variant. The ledger may be made public or limited to exclusive classes.


