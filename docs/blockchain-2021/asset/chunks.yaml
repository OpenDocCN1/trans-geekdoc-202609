    category is Bitcoin.


    ### Blockchain 2.0: Smart Contracts


    Smart Contracts, which are tiny computer systems that “run” in the Blockchain,
    are the latest main concepts. They are free programming programs that run in the
    background and search for conditions such as facilitation, authentication, and
    compliance. It’s a deal that’s used to supplement conventional contracts.


