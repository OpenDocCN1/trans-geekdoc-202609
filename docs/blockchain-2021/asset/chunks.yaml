    \ however, the degree of exclusion would depend on the form of a distributed ledger.\
    \ Even if its primary purpose is to operate alongside current intermediaries will\
    \ not shift, Blockchain will need to work with some of them in some instances.\n\
    \n### All Blockchains Are the Same\n\n·      There are actually multiple technologies\
    \ that are included in the concept of the Blockchain.\n\n·      Many of the core\
    \ components of a type of Blockchain implementation are included in the database,\
    \ the peer-to-peer network, consensus, and incentive mechanisms. If you expand\
    \ something, you can end up with a totally different kind of Blockchain, or none\
    \ at all.\n\n·      There is a broad range of use cases being developed, including\
    \ trade finance, banking, supply chain, and telecommunications, in the logistics\
    \ and the areas of supply and information industries, and a large number of DLT\
    \ and distributed ledger platforms available.\n\n### Everyone Needs “a Blockchain”\n\
    \n·      The term “Blockchain” doesn’t refer to anyone’s technological approach\
    \ but instead is a dynamic multi-use technology that serves several purposes;\
    \ it is not meant to be a substitute for “traditional databases.” As compared\
    \ to traditional systems, “public,” “private,” and “hybridged” Blockchain platforms\
