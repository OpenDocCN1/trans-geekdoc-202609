  trans: '


    上述功能使市场能够处理包括交割最终性和违约控制在内的问题，以及业务监管、适用于内部结算的法律框架（从过于简单的“代码即法律”转变）以及问责制等关键方面。像比特币这样的加密货币和区块链网络，在最基本阶段，具有与某些这些金融市场基础设施（FMI）提供的功能相似的特征。比特币通过跟踪区块链上的所有价值单位，扮演着中央证券存管机构（CSD）的基本角色。


    这一角色通过确保比特币不会在网络中被欺诈性地创建或删除，且其数据不会被不当修改的机会来补充，这要归功于挖矿机制（sent）。除了作为 CSD 的地位外，比特币可能被认为具有一个功能类似于证券结算系统（SSS）的特征。请注意，我认为比特币更类似于
    SSS 而不是支付系统（PS），因为它保证了在矿工认证后交易中比特币分布的任何类似情况，这是 SSS 提供的，但并非总是由 PS 提供的。


    SSS 的操作本质上使保护能够从一方转移到另一方。比特币中的两个用户都可以进行交易，将比特币提交到该方案中的其他地址，这些交易被验证并有效交换，直到被包含在已挖出的区块中。虽然这些功能（应牢记，它们在比特币等基本商品上表现良好），但很难相信它们能具备在较小金融领域维持交易带宽或资产深度所需的任何功能。


    然而，更重要的是，区块链缺乏创建大规模行业所需的许多基本构建块。如果大型 CSD 和 SSS（以及 PS）的技术要转移到分布式账本技术（DLT）上——我们认为这是可行的——很难想象监管机构会允许取消
    CSD、SSS 或 PS 作为法律实体的需求。此外，这些程序的消费者会检查某些组织提供的额外保障，以便在事情出错或好事发生时获得补救。这些公司可能并不总是现有的巨头，这在其他行业中已经发生过。我们认为，如果
    DLT 克服当前技术障碍并获得行业从业者的更广泛接受，CSD、SSS 和 PS 的商业模式肯定需要适应。


    例如，CSD 将不再需要跟踪谁持有什么，但它将必须确保在去中心化账本上保存的资产是合法的，并且如果发行人违约或对区块链上持有的资产采取企业行动，CSD 将确保资产被及时移除或替换。除了
    CSD 和 SSS/PS 的功能外，比特币实际上并不提供，或许永远不会提供中央对手方（CCP）提供的运营能力（甚至交易存储库（TR）也不提供）。


    更先进的公共区块链，如以太坊，具有基本的 CCP 功能，允许通过智能合约和预言机进行交易维护。这些组织主要运作以在交易对手无法履行其承诺的情况下控制和共享违约责任，包括保证金出售的权利。去中心化这一功能的努力要么会牺牲其基本功能，要么会涉及完全预先融资，其成本和物流对于任何大型金融领域来说都将是艰巨的，甚至不切实际。


    除了基本功能外，CCP 在确保只有最具流动性和信誉良好的公司才被允许参与交易方面的地位不应被忽视。多次金融冲击增强了监管机构将更多风险转移到这些机构的能力。现在的重点是这些组织如何最好地处理这一问题，而不是鼓励回到
    ![](img/image00125.jpeg)之前的范式。


    我们的推断是，这些 CCP 将从将其基础设施迁移到 DLT 中获益，不仅在成本节约方面，而且在使它们能够以更资本高效和更透明的方式开展业务，以及为它们提供管理其监管市场所需的资源方面。更进一步，如果多个
    FMIs 在共享平台上合并，DLT 可以包含一个多用途 FMI 论坛，供注册和受控制的公司代表其客户转移和控制资产和合同。


    此外，根据 DLT 的设计方式，我们认为有机会以这种方式构建这样的网络，使其可以极其标准化地远程运行。这意味着，即使在这个网站上运营公司的 CSD 或 CCP
    破产，底层 DLT 的声誉也将得到保留，管理员可以将业务转移到稳定的组织。


    在我们看来，利用 DLT 构建下一代多用途业务技术网络的能力，使 FMIs 及其客户能够以更可靠、更少干扰的方式工作，这是使用区块链的全部理由。这将很困难，也不会一夜之间发生；这些行业的现有巨头必须保持开放的心态，并不断参与为自己和客户创造良好的体验。


    ## 首次代币发行


    加密货币行业的首次公开募股版本是首次代币发行。ICO 是为创建新应用、代币或服务筹集资金的一种方法。


    ![什么是首次代币发行？](img/image00125.jpeg)


    有兴趣的买家将购买该发行，以换取企业创建的新加密货币代币。该代币可用于使用公司的服务或产品，也可能仅仅是作为产品或计划的股权。


    *   ICO 是初创公司常用的融资工具，这些公司希望在区块链或加密货币领域销售商品和服务。


    *   首次代币发行（ICO）相当于债券，但通常可用于资助软件设备或服务。


    *   一些首次代币发行（ICO）为投资者带来了巨额利润。更多的 ICO 则失败了，被揭露为欺诈，或表现不佳。


    *   要投资首次代币发行，您首先需要购买虚拟货币，并具备良好的加密货币交易所和钱包使用知识。


    *   由于 ICO 大多不受监管，投资者在调查和投资 ICO 时必须保持极度警惕和谨慎。


    ### 首次代币发行的运作方式


    当与加密货币相关的公司寻求通过首次代币发行（ICO）筹集资金时，它通常会制作一份白皮书，解释该特定项目的内容，项目完成后将满足什么需求，需要多少资金，创建者可以持有多少数字代币，允许哪种类型的资本，以及活动将持续多长时间。


    在代币发行活动期间，项目支持者和爱好者使用数字货币购买项目的任何代币。买家将这些代币称为代币，它们相当于在首次公开募股期间向投资者和成员提供的企业股票。如果筹集的资金未达到公司的最低要求，资金可能会退还给资助者；此时，ICO
    被视为失败。如果在规定的时间内满足融资标准，筹集的资金将用于实现项目的优先事项。


    ### 特别注意事项


