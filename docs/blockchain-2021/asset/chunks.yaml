  trans: '


    它曾被建议作为比特币早期工作量证明（PoW）的一种替代方案。在权益证明（PoS）设备中，没有矿工、先进的硬件或巨大的能源需求。你需要的是一台标准计算机。当然，并非所有人都适合。你确实需要投入一些资金。在
    PoS 中提供外部援助几乎没有用处。相反，你需要提交一种内部加密货币。每个协议都有自己的规则，但一般来说，你必须持有一定数量的资金才能被考虑进行质押。然后，当你在钱包中持有代币时，资金是安全且不可移动的（当你进行质押时，代币是安全且不可移动的）。


    你和其他验证者通常会就哪些交易将用于下一个区块达成妥协。你在押注哪个区块会被选中，程序会为你选出一个。如果你想根据自己的贡献分得一部分交易费用，你将根据投资的百分比被收取费用。你投入的资金越多，赚取的钱就越多。如果你想作弊并提供无效交易，你将冒失去大部分（或全部）质押资金的风险。因此，一种类似于
    PoW 的系统可供使用，在该系统中，诚实行为比不诚实行为更有利可图。


    在某些情况下，验证者不会获得新铸造的代币作为补偿。因此，区块链的本地货币必须以另一种方式创建，这可以通过初始发行或在稍后切换到 PoS 之前先使用工作量证明（PoW）启动协议来实现。迄今为止，简单的
    PoS 仅在较小的加密货币中出现过。因此，尚不清楚它是否会成为 PoW 的可行替代方案。


    虽然在理论上看起来是合理的，但在现实中可能会有所不同。由于 PoS 是以大量价值实现的，该机制会转变为金融奖励。任何具备基本黑客技能攻击任何 PoS 机器的人，只有在能从中获利时才会去做。因此，验证其是否可行的唯一方式是通过实时数据库网络。PoS
    将在不久的将来大规模接受考验。


    ## 更多共识算法


    所有算法都集中在工作量证明（PoW）和权益证明（PoS）上。不过，有人使用它们有很多原因，每种都有其自身的优点和缺点。统一机制对于分布式系统至关重要，因为没有它们，网络就会分崩离析。大多数比特币爱好者认为，其最好的方面是
    PoW 算法，它允许用户就一组单一的真理达成一致。


    如今，共识算法不仅支持电子现金网络，还支持区块链，使开发者能够通过分布式系统执行技术。它们一直是区块链技术的支柱，对于现有网络的持续生存至关重要。PoW 继续是其中最常见的共识算法。尚未有人提出更准确和稳定的解决方案。然而，正在进行大量关于
    PoW 替代方案的开发和研究，我们肯定会在未来看到更多。


    ## 区块链 2.0 为用户提供了一些极好的新应用可能性


    当中本聪首次发布比特币白皮书时，这项技术似乎只会用于数字货币，但随着 2.0 版本的推出，不同的应用场景正在每天涌现。


    供应链、投资、监控和物联网只是区块链 2.0 的各种实现中的几个例子。本质上，区块链 2.0 超越了交易，允许人们在不使用第三方经纪人的情况下共享价值。


    ## 区块链被许多人与互联网进行比较


    互联网，如同区块链技术一样，是通过多个个人和组织的合作逐步构建而成的，他们都做出了宝贵而有意义的贡献。


    - Tim Berners-Lee 的万维网（www）是推动互联网成为我们今天所认识的组织的最后一个里程碑。这并没有使他成为互联网的主人，关于中本聪也是如此。如今，许多软件和程序在互联网上创建和运行，它们的所有者并不控制互联网；然而，他们拥有相关的程序或服务。


    - 区块链在几个方面类似于互联网的早期。许多人正在考虑在区块链上构建什么，就像在 1990 年代，任何聪明且精通技术的人都梦想在互联网上创建这样的东西一样。


    从电子邮件到朋友、商业和娱乐，任何东西都已进入互联网，我们预期区块链技术也将效仿。虽然没有人控制区块链技术本身，但可以说，拥有最多用户的人实际上拥有区块链。同样，正如某些互联网巨头可以声称自己就是互联网一样，区块链未来也将能够声称这个头衔。


    ## 区块链作为金融市场基础设施（FMI）


    我们对新兴技术的潜力及其对金融市场的影响感到非常兴奋。区块链，或者更广泛的分布式账本技术，是引起我们兴趣的创新之一（DLT）。尽管我们对 DLT 非常乐观，但我们可能不认为它是每个部门的万能药，尤其是金融市场。


    最近，越来越清楚的是，区块链和加密货币将无法完全取代银行，因为这些机构所做的远不止是结构化账本。一些注意力已转向如何（以及是否）这种软件——或者任何技术——可以用来驱逐位于银行和金融部门基础设施（FMI）之间的机构。我们花了很多时间思考这个问题，并且已经写过相关内容。


    在深入探讨之前，回顾一下首字母缩写和缩略语，了解 FMI 是什么以及它们做什么是个好主意。在《2012 年金融市场基础设施原则》中，国际清算银行（BIS）和国际证券委员会组织（IOSCO）描述了
    FMI（PFMI）。PFMI 定义了五种不同类型的 FMI 公司，并为每种公司提出了监管标准：


    ### 支付系统（PS）


    它是“参与者之间或从参与者处资金转移的工具、流程和法规的汇编；该方案涉及参与者以及运营该安排的机构。”


    ### 中央证券存管机构（CSD）


    它提供资产服务、中央托管服务和证券账户，可能涉及管理企业行动和赎回，并在确保证券问题的可信度方面发挥关键作用（即，确保证券不会因错误或欺诈而被生产、丢失或其数据被篡改）。


    ### 证券结算系统


    它有助于“按照一系列预先确定的显著更高规则，通过记账方式转移和结算股份。”


    ### 中央对手方


    它作为在一个或多个资本交易所出售的合约的对手方的中介，对每个卖方充当买方，对每个买方充当卖方，确保透明的合约得到履行。


    ### 交易存储库


    该机构维护一个交易记录的集中式电子数据库。重要的是要记住，PFMI 本身并不是法律或法规；相反，它们作为许多监管机构为该行业制定自身规则的基础。还需要区分
    FMI 的运营地位（例如交换股份以进行结算）及其作为市场运营商监督者的角色。


    '
