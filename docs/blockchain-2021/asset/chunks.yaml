    ## Consensus Algorithms and Cryptocurrency


    ![What is Consensus Algorithm In Blockchain & Different Types Of Consensus Models
    | by BangBit Technologies | Medium](Images/image00125.jpeg)


    ### Consensus Algorithm


    The consensus is a process that helps users and/machines communicate. It requires
    making sure that certain elements in the scheme will rely on a common point of
    fact, even though certain agents struggle. Thus, the mechanism must remain stable.
    In a hierarchical arrangement, there is a common authority that rules and decides,
    dictating how things are done.


    In most instances, they will make modifications whenever they please. Any dynamic
    governance mechanism for finding agreement between multiple administrators is
    absent. But when distributed, it’s another matter altogether. In a distributed
    ledger, how should we decide what entries should be entered? Overcoming this hurdle
    where people had difficulty trusting each other has been the most important step
    for Blockchains.


    Cryptocurrencies and ledgers depend on consensus algorithms in this paper. In
    `cryptocurrencies`, the balances are held in a distributed ledger. It is important
    that any (or every) node retains an equivalent database. Otherwise, you could
    wind up with contradictory facts and undermine the network. No user is able to
    invest another’s coins. In order for the network members to know what funds were
    invested, it must be in a single location.


    The founder of Bitcoin, Satoshi, suggested a method of `PoW`. Its explanation
    will be given. Let’s describe several of the various consensus algorithms. Validators
    must have a stake in the network to start. The validator seeks to prevent fraud
    by offering a stake in the ground. They would be severely punished if found cheating.


    Examples cover computation and cryptocurrencies. Why should they put themselves
    at risk? Often, a reward is given. Fees for this typically provide a mix of the
    protocol’s unique cryptocurrency and freshly-generated units of cryptocurrency.


    ### Transparency


    We don''t need more openness to know that somebody is dishonest. For best security,
    blocks should be difficult to manufacture but easy to verify. It establishes that
    the identification process is controlled by users.


    ## Important Real-Life Use Cases of Blockchain


    ### Dubai: The Smart City


    In 2016, the smart Dubai office implemented a Blockchain plan. Entrepreneurs and
    creators would be able to communicate with investors and leading firms through
    this technology. The aim is to incorporate a Blockchain-based infrastructure that
    encourages the growth of a variety of industries in order to render Dubai “the
    happiest city on the planet.”


    ### Incent Customer Retention


    Incent is a Blockchain-based Consumer Retention as a Service platform. It''s a
    rewards scheme that works by creating tokens for businesses that are part of the
    network. Blockchain is shared instantly in this scheme, and it can be placed in
    digital portfolios on a user''s phone or accessed through a browser.


    ### Blockchain for Humanitarian Aid


    The UNWFP launched a humanitarian relief program in January 2017. The project
    was created in Pakistan’s Sindh province’s rural areas. Beneficiaries obtained
    capital, food, and all types of transactions are recorded on a Blockchain to maintain
    the process’s protection and accountability.


    ## Consensus Algorithms and Its Types


    ### Proof-of-Work


    The longest consensus algorithms are `PoW`. They were first used in Bitcoin. However,
    they have existed for quite some time now. The process by which validators (miners)
    attempt to hash the information before they arrive at a solution. A hash function
    is computed, and the hash value is generated as you pass the data through it.
    And if you repeat the experiment, you can still get the same result. It would
    be a minor detail to change even a single of your Hash.


    Thus prove that you know that the data prior to reality. After revealing the value,
    they will run the Hash on the data to ensure that it’s the result is right. `PoW`
    lays down rules for what constitutes a legitimate block. Just the block starting
    with the number ‘00’ will be approved. They will be able to change the criterion
    in any guess before getting to the right answer. The bar has been raised very
    high for big Blockchains. You’d need storage full of specific hashing hardware
    to deal with other miners and then some hope for generating a legitimate block.


    When mining, the expense of these computers and the energy used to power them
    is your stake. Since `ASICs` are designed for a single-use, they can’t be used
    for anything else. The only option to recoup the initial expenditure is to mine.
    Mining pays off handsomely if you connect a new transaction to the chain successfully.
    It’s simple for the database to check that you’ve made the correct block.


    You would need to pass the data through the feature once, even though you’ve attempted
    trillions of iterations to get the correct Hash. Your data would be approved if
    it generates a correct hash, and you will be rewarded. Otherwise, the system will
    deny it, and you will have squandered time and energy.


