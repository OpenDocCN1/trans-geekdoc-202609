  trans: '


    技术的广泛商业化还有很长的路要走；它非常新颖，需要彻底转型。如果为准备或应对颠覆是个好主意，那么商业各个领域和职能中的规划者和政策领导者可以保持警觉，继续关注这些技术的新用途，以便尽可能早地预见并利用机会。


    `Blockchain` 中的信息在密码学上是安全的，因为它存储在一个永无止境的数据块序列中。维持 `Bitcoin` 网络 `Bitcoin` 值的一切都分布在大量计算机上，而不是一台控制整个网络算力的主机。


    相反，节点通过使用块的共享副本来参与。此外，不断增长的数据量会导致更多文档被附加到 `Blockchain` 上。最简单地说，使用 `Blockchain`，你拥有一个存储记录的数字账本和一个验证这些记录完整性的
    `Blockchain` 应用。


    · 进入交易是方案成员对数据库的初始目标。


    · 加强这些块，确保它们按顺序完成，然后再次检查以确保其保密性。


    去中心化 `Blockchain` 的主要好处是它对所有人开放。会议上的每个人都能够验证块的存在以及其中包含的付款。你需要展示分配给你的私钥才能使其工作，但你的交易是安全的，因为它使用你的唯一密钥加密。`Blockchain`
    基本上是去中心化的，这意味着没有任何单一机构或权威机构会验证交易并制定严格规则来批准交易。


    这意味着涉及大量信任，因为 `Blockchain` 的所有成员都必须达成一致以批准交易。最关键的方面是它是安全且保密的。数据库只能扩展，过去的记录不容易被更新（至少，更改之前的记录是有代价的）。任何希望在
    `Blockchain` 中包含交易的人都必须由所有其他用户/成员检查和验证，以确保交易的合法性。


    数字签名算法应用于交易。管理 `Blockchain` 框架的规则可能由相关系统决定，使“真”的概念非标准且可解释。然后由成员投票来确定交易是否正确。一旦形成有效的交易集合，它就会被附加到块中，然后分发到集群中的所有节点。


    新创建的块通过扩展来证明其正确性。每个块都包含一个哈希。哈希是一种特殊的签名，用于区分其内容与前一个块。块有助于保证数据完整性，因为它们将时间戳纳入支付过程。它们允许交易被多次确认，并保证它们不能被篡改。虽然它有能力解决许多问题，但它还不是任何事情的解决方案。我们拥有的
    `Blockchain` 类型有：`Private`、`Public` 和 `Federated`。


    ## Public


    去中心化 `Blockchain` 的决定性特征是任何人都可以查看所有活动，包括交易。每个人都可以期望他们的协议成为决策机制的一部分。


    ## Federated


    `Federated Blockchain` 允许每个人发表意见，但并非每个人都参与共识阶段。由于它们只有少数成员，只有少数节点被允许继续其活动。


    同样，换句话说，比如说，在一个由 20 家或更多制药公司组成的社区中，我们应该认为让其中 16 家公司同意是可能的。与典型系统相比，参与者对 `Blockchain`
    技术的无限制访问可以以公共或私有方式进行。


    ## Private


    据我们所知，世界上大多数当前的 `Blockchain` 都在组织内部使用。只有特定的一组参与者被授权使用它并进行交易。使用 `Blockchain` 技术的问题不在于它有许多优点，而在于它实际上是一个讨论话题。


    ## Blockchain 是基于云的神奇数据库


    从定义上讲，`Blockchain` 是交易记录的线性数组；信息和交易之间没有区别。通过此图表，条目仅在有人对共享数据存储数据目录进行新增时创建，而不是在有人删除现有条目时创建。


    因此，列表会无限制地扩展，并应复制到数据库中的每个对等节点。由于不可能，无法将 PDF 或 Word 文件等某种物理材料存储在账本上。它只能作为存在的证据，而不是分布式账本性质的证明。但数据湖的使用仅限于记录的所有者，在支付费用使用的情况下可以扩展。


    ## 区块链可以改变未来


    我们可以将 `Blockchain` 用于非常复杂和精密的交易，包括确认钻石的有效性或个人身份的有效性。除了在贸易金融中提高准确性、节省成本和加快处理速度之外，还有讨论将
    `Blockchain` 技术应用于此的可能性。


    虽然 `Blockchain` 可用于帮助这些案例，但它并不能消除欺诈者干扰记录和账本的可能性；欺诈仍然是一个问题。其次，这些场景比平时更可能徒劳，因为传统账本也会有更高的交易费用和处理时间。


    ## Blockchain 完全免费


    鉴于普遍持有的观点和信念，`Blockchain` 既不是免费的，也不是廉价的，运行起来也不快。它可以被视为一个单一的“事实”，许多计算机聚集在一起，基于无法在计算完成前更改的公式提供答案（`SVT`）。


    作为 `Blockchain` 中的一个“块”处理大量数据，它需要大量的处理资源。对于用于维护 `Blockchain` 运行的所有计算资源，总得有人来付费。


    ## Blockchain 是单一的


    几个名称被赋予同一项技术创新；最著名的是 `Blockchain` 和分布式账本技术。`Private` 和 `Public` 软件作为两种不同的类型存在，并属于两个不同的类别：通用或普通目的以及为特定目的定制。


    共同点是它们的功能被加密分割，是分散的，并且依赖于某种共识来做出决策。数据库是分布式或去中心化的账本，可以分为三种类型：`Bitcoin` 的 `Blockchain`、`Ethereum`
    的 `Blockchain`、`Hyperledger` 的 `Blockchain`，以及 `IBM` 的 `Blockchain`-as-a-service。


    ## 任何事情都可以使用 Blockchain 完成


    尽管这项技术非常强大，但它并非神奇。任何 `Bitcoin` 或 `Blockchain` 程序员可能对其产品极其热情，这是可以理解的，因为他们的创造用于为无银行账户人群提供金融自由，并为不那么富有的人提供去中心化的资金转移。


    有些人将 `Blockchain` 视为与政府或律师分离的权威，而不是将其视为仅仅是数学的附属品。在某些开发者的心目中，智能合约、`Blockchain`
    和金融最终将取代资本、律师、仲裁机构和其他组织。


