  trans: '


    Bancor 是一个去中心化协议，使用户能够快速且准确地转移虚拟货币代币，而无需在 Coinbase 等加密货币交易所进行交易。Bancor Network
    Token 是 Bancor 网络中唯一的加密货币。


    截至 2021 年 2 月，BNT 按市值排名第 109 位，总估值约为 2.12 亿美元，每个 BNT 的价格为 1.88 美元。


    * Bancor 是一个去中心化金融网络，旨在为小型和微型代币提供流动性和回报。

    * Bancor 及其竞争对手 Uniswap 是现代一代去中心化金融网络的先驱，使用两个代币层来促进其流动性储备和可用性：ETHBNT 和 BNT。

    * 在最近一代开放金融网络中，Bancor 及其竞争对手 Uniswap 是领跑者。


    ## 了解 Bancor


    Bancor 是一个基于以太坊的链上交易协议，允许通过多个区块链进行自动化、去中心化交易。该协议最初由 Galia Benartzi、Eyal Hertzog
    和 Guy Benartzi 于 2017 年在以色列创建。


    ![What is Bancor? 2019 Beginner''s Guide on BNT Cryptocurrency](img/image00125.jpeg)


    根据其白皮书，Bancor 允许在智能合约区块链技术中对代币进行自动化价格确定和自主流动性。Bancor 这个名字是为了纪念 John Maynard Keynes，他在布雷顿森林会议上提出了“Bancor”这一术语，作为超国家储备货币。


    ## Bancor 的加密货币流动性池


    考虑到其市场估值，如果未在交易所上市，许多小型加密货币代币流动性较差。交易费用可能高于比特币和以太坊等更具流动性的货币。得益于 Bancor 的智能代币和智能合约技术，小型和微型代币可以以较少的麻烦和费用购买和交换。


    智能代币和智能合约是自执行合同，涉及各方之间的理想条件写入代码行中。在中心化或去中心化加密货币交易所进行的典型加密货币交易涉及两个或多个方之间的代币交换：买方和卖方，交易所充当做市商。


    ## Bancor Network Token (BNT)


    Bancor 的目标是通过去中心化储备货币 Bancor Network Token (BNT) 以及一个通过协议调节汇率和交易量的自动化交易系统来消除中间人。在
    Bancor 网络上生成的所有智能代币的默认货币是 BNT，即 Bancor 的原生储备货币代币。


    在 BNT 的首次代币发行 (ICO) 中做出的一项承诺是，随着其他加密货币兑换进出 BNT，投资者将从转换成本中获得利息。Bancor 的协议允许用户在符合
    ERC-20 标准的代币之间切换。持有许多其他 ERC-20 代币储备的智能合约与每个智能代币相连。在内部，代币根据这些储备和消费者查询的数量进行分配。


    智能代币本质上是存储其他关联虚拟代币金融价值的虚拟代币。它的工作方式与中央银行持有外汇储备并根据需要进行兑换的方式相同。Bancor 协议支持符合 ERC-20
    格式的虚拟货币代币。在 Bancor 网络上开发的任何智能代币都符合 ERC-20 标准，这意味着它可以与网络上的另一个代币进行交互。


    ## Bancor 的 ETHBNT 空投


    Bancor 于 2020 年 1 月 1 日开始向持有最低 BNT 数量的钱包空投价值超过 5 万美元的 ETHBNT。ETHBNT 是 Bancor 池代币，代表
    ETH: BNT 流动性池份额。


    基于以太坊的 Bancor 转换费用由 ETHBNT 收集。尽管不确定额外资本是如何应用于 Bancor 股权池，而不是 Bancor 将其法币资产注入其网络，但这一变化旨在通过增加提供者来提高流动性。


    ## 对 Bancor 的批评


    在内部，Bancor 网络在所有智能代币合同中采用恒定储备比率 (CRR) 原则，旨在防止智能代币的储备利息被耗尽。不同加密货币之间的汇率由 Bancor
    网络的内部公式和算法平等维持。然而，Bancor 提供流动性的论点是有争议的。


    “Bancor 拥有的加密货币流动性是主观的，”一位名为“Bitcoinchaser”的博主写道。如果代币或其下的某个其他代币出现大规模挤兑，价格将暴跌，20%
    的限制将在几分钟内消失。其论点是，在等效条件下，加密货币行业中任何其他类似代币或任何新代币都会更早被清除。Bancor 声称其优越技术将避免任何单一代币（甚至其自身代币）出现挤兑，这一论点是可疑的。


    由于其 ETHBNT 空投表明其网站上的流动性最初由法币储备融资，Bancor 正如“Bitcoinchaser”所声称的那样，为流动性较差的代币提供流动性，但在市场恐慌的情况下，BNT
    本身可能变得流动性不足。Bancor 并不是去中心化交易领域中唯一拥有流动性池的参与者。


    一项对 Uniswap 池的研究发现，池中底层商品价格的任何不利变动都会导致流动性提供者出现负收益，其损失将超过交易费用带来的收益。10 名 Bancor
    代表通过指向“套利交易者”来跳过损失及其可能对交易所造成的危险，这些套利交易者可以介入并利用市场力量恢复秩序。


    ## 区块链神话


    区块链目前非常时髦，在董事会会议桌旁或茶水间谈论它很有趣。在所有这些区块链讨论中，有一些神话需要被揭穿，事实需要立即澄清。


    ## 区块链等于加密货币


    * 比特币（数据库）和比特币（加密货币）也是在同一时期创建的。然而，加密货币只是区块链应用之一。

    * MIT 将区块链技术列为通用技术。

    * 通用技术是一种可以应用于广泛行业的应用。它具有随时间变化的能力。它还作为互补技术进步的催化剂。电力、柴油涡轮、铁路，以及最近的互联网，都是众所周知的表现形式。


    你可能会遇到广泛的区块链客户端应用程序。为了检查、证明或评论控制或税务问题，你需要了解该技术在所有使用案例中的优势和劣势。


    这些知识需要更新，以反映区块链商业策略和技术中内置的持续变化和协同效应。


    ### 加密货币主要用于不法目的


    * 由于比特币的去中心化、不可关联和匿名性质，有些人将其比作犯罪分子的首选工具。比特币网络上的交易是我们现在看到的，并且完全透明。因此，尽管交易各方未知，但结果很容易验证。

    * 比特币等公共区块链在执法打击犯罪活动方面也证明非常有效，因为它们比实物货币更透明。

    * 通过查看区块链应用程序的形式，交易记录可以完全保密，它可以是半私有的或保持记录公开。


    ### 区块链将消除所有中介


    * 无论涉及的银行是否愿意，由于缺乏银行作为交易的渠道，它已经获得了流行。


    '
