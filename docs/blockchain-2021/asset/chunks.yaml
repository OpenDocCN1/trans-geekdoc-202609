- raw: 'Bancor is a decentralized protocol that enables consumers to transfer virtual
    currency tokens quickly and accurately rather than trading them on cryptocurrency
    exchanges such as Coinbase. Bancor Network Token is the only cryptocurrency in
    the Bancor network.


    BNT is the 109th most expensive cryptocurrency by market cap as of February 2021,
    with a total valuation of about $212 million and a price of $1.88 per BNT.


    *   Bancor is a decentralized finance network that aims to offer liquidity and
    returns to small- and micro-cap coins.


    *   Bancor and its rival Uniswap are the pioneers of a modern generation of decentralized
    financial networks, using two token layers to promote its liquidity reserves and
    usability: ETHBNT and BNT.


    *   In a recent generation of open finance networks, Bancor and its rival Uniswap
    are the frontrunners.


    ### Understanding Bancor


    Bancor is an Ethereum-based on-chain trading protocol that allows automatic, decentralized
    trading through several Blockchains. Galia Benartzi, Eyal Hertzog and Guy Benartzi
    first created the protocol in Israel in 2017.


    ![What is Bancor? 2019 Beginner''s Guide on BNT Cryptocurrency](Images/image00125.jpeg)


    Bancor, according to their whitepaper, allows for automated price determination
    and autonomous liquidity for tokens in smart contract Blockchain technology. Bancor
    was selected as a nod to John Maynard Keynes, who suggested the term “Bancor”
    for a supranational reserve currency at the Bretton Woods conference.


    ### Bancor''s Crypto Liquidity Pools


    Given their market valuation and if they’re not classified on an exchange, several
    tiny crypto-coins are illiquid. Transaction fees might be greater than those of
    the more liquid currencies, such as Bitcoin and Ethereum. Small- and micro-cap
    coins may be purchased and exchanged with limited hassle and fees thanks to Bancor’s
    smart token and smart contract technologies.


    Smart tokens and smart contracts are self-executing contracts with ideal conditions
    between parties involved written into lines of code. A typical cryptocurrency
    trade on a centralized or decentralized cryptocurrency exchange entails the exchanging
    of tokens between two or more parties: a buyer and a seller, with the exchange
    serving as a market maker.


    ### Bancor Network Token (BNT)


    Bancor’s goal is to cut out the middleman by providing a decentralized reserve
    currency, the Bancor Network Token (BNT), as well as an automated exchange system
    that regulates rates and trading volumes via the protocol. The default currency
    for all smart tokens generated on the Bancor network is BNT, Bancor’s native reserve
    currency token.


    One of the commitments made during BNT’s initial coin offering (ICO) was that
    investors would earn interest on conversion costs as other crypto coins were exchanged
    into and out of BNT. Bancor’s protocol allows users to switch between ERC-20 compliant
    tokens. Smart contracts that carry reserves of many other ERC-20 tokens are connected
    to each smart token. Internally, the tokens are allocated dependent on these stocks
    and the number of consumer queries.


    Smart tokens are essentially virtual coins that store the financial value of other
    associated virtual coins. It works in the same way as a central bank that keeps
    foreign exchange reserves and exchanges them as required. Both virtual currency
    tokens that are compliant with the ERC-20 format are supported by the Bancor protocol.
    Any smart token developed on the Bancor network is ERC-20 compliant, which means
    it can interact with another token on the network.


    ### Bancor''s ETHBNT Airdrop


    Bancor began airdropping more than $50,000 worth of ETHBNT to wallets carrying
    a minimum of BNT on January 1, 2020. ETHBNT is a Bancor pool token that represents
    ETH: BNT liquidity pool shares.


    Fees from ETH-based Bancor conversions are collected by ETHBNT. Although it is
    uncertain how extra capital was applied to the Bancor equity pools rather than
    Bancor injecting its fiat currency assets into their network, the change was intended
    to raise liquidity by rising providers.


    ### Criticisms of Bancor


    Internally, the Bancor network employs the Constant Reserve Ratio (CRR) principle
    in all smart token contracts, with the aim of preventing the reserve interest
    of smart tokens from being exhausted. The rate of exchange between different cryptocoins
    is equally maintained by the Bancor network’s internal formulas and algorithms.
    However, the argument that Bancor provides liquidity is debatable.


    “The amount of crypto liquidity that Bancor has, is subjective,” writes a blogger
    who goes by the moniker “Bitcoinchaser.” If there is a big run on the token or
    some other token beneath it, the price will plunge, and the 20% limit will vanish
    in minutes. The argument being that every other analogous coin, or any fresh token,
    will be wiped out sooner in the cryptocurrency industry under equivalent circumstances.
    Bancor’s contention that its superior technologies will avoid a run on any single
    coin, even its own tokens, is dubious.


    Because its ETHBNT airdrop demonstrates that liquidity on its website is initially
    financed with fiat currency reserves, Bancor, as “Bitcoinchaser” claims, offers
    liquidity for much fewer liquid coins, but BNT itself can become illiquid in the
    case of a market panic. Bancor isn’t the only participant in the decentralized
    trading room with a liquidity pool.


    A study of Uniswap pools found that any unfavorable shift in the price of the
    underlying commodity in the pool would result in negative gains for the liquidity
    supplier, outweighing the benefit from fees. 10 Bancor representatives skip over
    the losses and how they may jeopardize the exchange by pointing to “arbitrageurs”
    who can step in and restore order using the power of markets.


    ## Blockchain Myths


    Blockchain is so trendy right now that it’s fun to talk about it at the boardroom
    table or at the watercooler. In the midst of all this Blockchain talk, there are
    a few myths that need to be debunked, and the record set straight right now.


    ## Blockchain Equals Cryptocurrencies


    ·      Bitcoin, the database, and Bitcoin, the cryptocurrency, were also created
    around the same period. However, cryptocurrency is only one of several Blockchain
    applications.


    ·      Blockchain technology is classified as a General-Purpose Technology by
    MIT.


    ·      A GPT is an application that allows you to apply across a broad range of
    industries. It has the ability to change over time. It also serves as a catalyst
    for complementary technology advancement. Electricity, the diesel turbine, the
    railroad, and, most recently, the internet are all well-known manifestations.


    ​You might come across a broad range of Blockchain client applications. To inspect,
    attest, or comment on controls or tax questions, you’ll need a basic understanding
    of the technology’s advantages and drawbacks in all usage cases.


    This knowledge would need to be updated to reflect the ongoing changes and synergies
    built into Blockchain business strategies and technology.


    ### Cryptocurrencies Are Primarily Used for Nefarious Purposes


    ·      Owing to the decentralized, unlinkable, and anonymous nature of Bitcoin,
    some people have compared it to a preferred tool for criminals. Transactions on
    the Bitcoin network are how we see them now and completely transparent. It is
    thus, therefore, that although the parties to the transaction are unknown, the
    results are easily verifiable.


    ·      Public Blockchains such as Bitcoin have also proven to be quite effective
    in law enforcement for cracking down on criminal activity since they are more
    transparent than tangible currency.


    ·      By looking at the form of Blockchain application, transaction records can
    be fully confidential, and it can be a semi-private or keeping record-public.


    ### Blockchain Will Remove All Intermediaries


    ·      Regardless of if the bank was in question is willing or unwilling, it has
    gained popularity due to the lack of banks as a conduit for the transaction.'
