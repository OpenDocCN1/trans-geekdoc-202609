- raw: 'The opportunity for anybody, regardless of race, gender, or cultural context,
    to use Blockchain and Bitcoin is perhaps its most significant feature. According
    to the World Bank, almost 2 billion adults lack bank accounts or any other way
    of holding their money or assets. Almost all of these people reside in developed
    nations, where the country is already in its infancy and money is king.


    ![Consensus in Blockchain: What You Need to Know | OpenLedger Insights](Images/image00125.jpeg)


    These individuals also receive small amounts of money and are compensated in cash.
    They must then hide this tangible cash in their homes or places of business, making
    them vulnerable to extortion or needless abuse. A Bitcoin wallet’s keys can be
    written down, saved on a cheap mobile phone, or even memorized if appropriate.


    These solutions are more likely to be hidden than a little bundle of money under
    a mattress for most people. Blockchains in the future are now searching for ways
    to hold medical documents, land ownership, and a host of other civil transactions,
    in addition to being a unit of account for asset storage.


    ### Disadvantages of Blockchain


    While the Blockchain has a lot of benefits, it still has a lot of drawbacks when
    it comes to acceptance. Today’s roadblocks to Blockchain technology adoption aren’t
    only technological. For the most part, the real obstacles are political and legislative,
    not to mention the thousands of hours of custom product development and back-end
    programming needed to incorporate Blockchain into existing enterprise networks.
    The following are some of the roadblocks to universal Blockchain acceptance.


    ·      Bitcoin mining has a high infrastructure cost.


    ·      Bitcoin has a history of being used in illegal activities.


    ·      Transactions per second are low.


    ·      Legislation.


    #### Technology Cost


    Although Blockchain will save users resources on transaction costs, it is not
    a free technology. Bitcoin’s “Proof-of-Work” scheme, for example, consumes a tremendous
    amount of computing resources to verify transactions.


    ![Four myths associated with Blockchain Technology](Images/image00125.jpeg)


    In the real world, the power generated by the Bitcoin network’s millions of computers
    is roughly equivalent to Denmark’s annual electricity use. Assuming energy costs
    of $0.03~$0.05 per kWh, operating costs exclusive of hardware expenditures are
    around $4,000 to $6,000 per coin. Despite the high costs of mining cryptocurrency,
    consumers want to pump up their utility bills in order to verify transactions
    on the network.


    That’s so when miners introduce a block to the Bitcoin network, and they are credited
    with just enough Bitcoin to render their time and resources worthwhile. However,
    miners will need to be charged or otherwise incentivized to verify transactions
    on Blockchains that do not use cryptocurrencies. Any answers to these problems
    are starting to emerge. Bitcoin mining farms, for example, have been set up to
    utilize solar electricity, waste natural gas from drilling sites, or wind farm
    power.


    #### Speed Inefficiency


    Bitcoin is an excellent example of Blockchain’s potential inefficiencies. It takes
    about ten minutes for Bitcoin’s “Proof-of-Work” method to connect a new block
    to the Blockchain. The Blockchain can only handle about seven payments a second
    at that point, according to estimates (TPS).


    Other cryptocurrencies, such as Ethereum, outperform Bitcoin, but they are also
    constrained by Blockchain. For example, the legacy Visa brand will manage 24,000
    transactions per second. For years, people have been working on solutions to this
    issue. There are Blockchains that can handle over 30,000 transactions per second
    right now.


    #### Illegal Activity


    While the Blockchain network’s anonymity prevents people from hacking and maintains
    their secrecy, it also allows for illicit trade and operation. The Silk Road,
    an encrypted “Dark Web” drug marketplace that operated from February 2011 until
    October 2013, when it was shut down by the FBI, is perhaps the most well-known
    case of Blockchain being used for illegal transactions.


    Using the TOR browser, users may search the website without being watched and
    making illicit Bitcoin and other cryptocurrency transactions. Financial service
    companies must collect details about their customers before they open an account,
    check each customer’s identification, and ensure that customers may not exist
    on any registry of confirmed or alleged terrorist groups, according to current
    US regulations.


    This method has both advantages and disadvantages. It encourages everyone to enter
    financial accounts, but it still makes it easier for offenders to trade. Many
    have claimed that the positive uses of cryptocurrency, such as financing the unbanked,
    outweigh the negative uses, particularly because the majority of criminal activity
    is still carried out with untraceable cash.


    #### Regulation


    Many people in the crypto community are worried about government oversight of
    cryptocurrencies. Governments could potentially render it unlawful to hold cryptocurrency
    or invest in their networks, despite the fact that ending anything like Bitcoin
    is becoming extremely complicated and near impossible when the decentralized network
    develops. As major corporations, including PayPal, continue to promote the possession
    and usage of cryptocurrency on their platforms, this issue has diminished.


    #### Blockchain’s Advances Rely on Scalability


    Scalability, or the opportunity to accomplish transactions in almost real-time,
    like clearing credit card purchases, is one of the key challenges confronting
    Blockchain. With cryptocurrencies like Bitcoin and Ethereum’s Ether, scalability
    has already been described as an issue. If a distributed ledger is to gain traction
    among financial technology (FinTech) firms and contend with payment networks dozens
    of times faster, it must improve scalability and throughput while also addressing
    latency issues.


    #### Enter “Sharding”


    Developers are experimenting with a number of approaches to improve transactional
    throughput, including sharding. Simply placed, sharding is a method of partitioning
    a P2P network’s computational and storage burden such that no one node is liable
