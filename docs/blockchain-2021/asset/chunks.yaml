    Those investors who are interested in investing in initial coin offerings (ICOs)
    can first become acquainted with the cryptocurrency field in general. Most ICOs
    require investors to buy tokens using cryptocurrencies that are pre-existent.
    This suggests that ICO investors would require a wallet for different currencies
    like Ethereum or Bitcoin and a wallet with the ability to store the currency or
    token they choose to buy. How should a person go about looking for ICOs to invest
    in?


    It is not easy to keep up with the new ICOs. Reading up on potential ventures
    online is the smartest thing an active investor might do. ICOs cause a lot of
    buzzes. There are a lot of sites online where investors meet to talk about potential
    prospects. There are websites devoted to obtaining ICOs, enabling investors to
    learn about new offers and equate them to each other.


    ## ICO vs. IPO


    Traditional businesses have a few options for collecting the funds they need for
    expansion and growth. A business will start smartly and then expand when its sales
    enable, with just the company owners as its creditors. This, though, implies that
    they are going to have to wait for resources to accumulate.


    Companies will often seek early funding from outside buyers, which can provide
    them with a swift infusion of cash in exchange for a part of their equity interest.
    Another choice is to raise funds from private investors by trading stock in an
    initial public offering (IPO) and going public. While IPOs only deal with contributors,
    ICOs, including crowdfunding events, can deal with investors who would be interested
    in investing in new projects.


    ![What is the difference between cryptocurrency coins and tokens? - Quora](Images/image00125.jpeg)


    However, ICOs vary from Kickstarter in that ICO supporters are driven by the potential
    for a return or profit on their expenditure, while crowdfunding projects are essentially
    donations. That is why ICOs are called “crowd sales.” It is interesting that ICOs
    still maintain at minimum two significant structural distinctions from IPOs. ICOs
    are essentially uncontrolled, implying that regulatory agencies like the Exchange
    and Securities Commission do not control them.


    Second, ICOs are far more structure-free than IPOs owing to their decentralized
    structure and absence of oversight. ICOs may be arranged in a number of different
    forms. In certain situations, an organization will establish a particular fundraising
    target or cap, which ensures that every token traded through ICO will have a predetermined
    price, and the overall token supply will remain constant. In other scenarios,
    the ICO token supply is fixed, but the funding target is elastic.


    This implies that the number of tokens distributed to holders would be determined
    by the funds collected. Others, on the other hand, provide a complex token supply
    that is calculated by the sum of funding collected. In both cases, the value of
    a token is set, but the total number of tokens is infinite.


    ## Pros and Cons of ICO


    In an initial public offering, the investor usually receives stock of a company’s
    stock in return for her money. There are no securities per se in matters of an
    ICO. Instead, businesses collecting funds via an ICO issue a cryptocurrency token,
    which is the Blockchain approximation of a bond. In certain instances, investors
    swap a common current token, such as Ethereum or Bitcoin, for an equal quantity
    of new tokens.


    It’s worth remembering that it is quite simple for an organization to build tokens
    with an ICO. Online services make it possible to generate cryptocurrency tokens
    immediately. When comparing the variations between stocks and tokens, investors
    should bear this in mind. A token has no inherent worth and no ethical protections.
    ICO administrators create tokens in accordance with the conditions of the ICO,
    collect them and assign them to individual investors accordingly as per their
    schedule.


    Early participants in ICOs are typically enticed to purchase tokens hoping that
    the venture can prosper until it is launched. If this occurs, the valuation of
    different tokens they bought during an ICO will rise above the value set during
    an ICO, resulting in net profits. The opportunity for extremely large returns
    is the major advantage of an ICO. Many holders have become millionaires as a result
    of ICOs. With the rise of ICOs in the Blockchain and cryptocurrency markets, they’ve
    taken with them new obstacles, threats, and opportunities. Many people invest
    in ICOs to get a fast and efficient profit on their money.


    The most popular initial coin offerings (ICOs) of the last few years have proven
    to be the basis of this optimism since they have delivered enormous profits. This
    zeal, on the other hand, has the potential to drive citizens astray. ICOs are
    fraught with scams and con artists seeking to exploit overly zealous and ill-educated
    buyers as they are mostly uncontrolled. Funds missing due to theft or negligence
    can never be restored because they are not supervised by financial regulators
    such as the SEC. A couple of years back, a number of legislative and private bodies
    reacted to the meteoric growth of ICOs in 2017.


    A couple of major Chinese Banks outlawed the use of tokens as currencies and forbade
    banks from providing ICO-related services. As a consequence, both Ethereum and
    Bitcoin rates plummeted, fueling speculation that further Blockchain legislation
    was on the way. The prohibition often applied to offerings that had already been
    initiated. ICO ads were blocked by Twitter, Facebook, and Google in early 2018.
    When it comes to ICOs, you can’t be sure that as an investor, you would not become
    a victim of fraud. Investors should take the following precautions to prevent
    ICO scams:


    · Ascertain that project planner may accurately identify their objectives. Whitepapers
    for successful ICOs are usually easy, understandable, and have specific, succinct
    objectives.


    · Get to know the programmers. Investors should expect an organization introducing
    an ICO to be fully transparent.


    · Look into the ICO''s legitimate conditions and terms. Since outside authorities
    seldom monitor this industry, it is up for the preference of investors to guarantee
    that any ICO they participate in is legal.


    Ascertain, the ICO assets are kept in one or more escrow account, which is a wallet
    that can only be opened with multiple keys. This will help protect you from scams,
    particularly if any of the keys are held by an impartial third party.


    ![](Images/image00125.jpeg)


    # Chapter 3: Cryptocurrency and Crypto Assets


    Bitcoin and other cryptocurrencies are digital tokens that are not protected by
    actual money or physical securities. They are exchanged between willing parties
    without the use of a middleman and are recorded on digital ledgers. Cryptocurrency
    can be regarded best as digital currency or simulated currency protected by encryption,
    making counterfeiting and double-spending virtually impossible. Many cryptocurrencies
    are focused on Blockchain technology, a public database implemented by a distributed
    network of computers.


    Cryptocurrencies are distinguished because they are not distributed by any central
    entity, making them technically resistant to political intervention or coercion.
    A cryptocurrency is a modern kind of digital commodity built on a network that
    spans a vast number of computers. They can operate independently of the jurisdiction
    of the government and central authorities because of their autonomous nature.
    The term “cryptocurrency” comes from the encryption mechanisms used to keep the
    network stable.

