    ## 2.11.2. 分层架构


    用户层是云支持客户端与云托管供应商及云服务进行交互、执行与客户相关的管理任务以及监控云托管服务的用户界面。它还可以将云服务的输出提供给另一个资源层场景。


    在云收到支持请求后，它会编排其资产及其他云的资源（如果通过跨云目的获取了其他云的工具），并通过用户涂层将云解决方案反馈回来。用户层是云服务单元（CSU）所在的位置。接入层为服务层中可用功能的手动和自动接入提供通用接口。


    这些功能既包括服务本身的能力，也包括管理功能和业务能力。接入层通过云 API 接入供应商的服务和资源，以处理合作伙伴、用户或其他提供方云服务消费请求。


    接入层负责通过一个或多个接入机制引入云服务功能，例如通过浏览器访问的一组网页，或以编程方式访问的一组 Web 解决方案。接入层还负责处理安全和高质量的服务（QoS）。支持层包含由云供应商提供的服务的实现（例如，SaaS、PaaS、IaaS）。


    支持层包含并控制使用解决方案的软件组件（但不包括固有的 hypervisor、宿主操作系统、设备驱动程序等），并安排通过接入层向客户提供云服务。资源层包含供应商可用的物理资源以及适当的抽象和控制机制。例如，hypervisor
    软件可以提供虚拟机、虚拟存储和虚拟机容量。此外，它还包含提供商和消费者之间提供内置网络连接所必需的云核心传输网络功能。多层功能包括一系列功能元素，它们与四个不同层的实际元素交互以提供支持能力。它包括五个类别的实际组件：


    -   **集成：**负责将设计中的功能组件连接起来以构建统一的架构。功能集成元素除了外部功能组件外，还提供云架构及其内部功能组件中的消息路由和消息交换机制。

    -   **安全系统：**负责实施与安全相关的控制措施，以减轻云计算环境中的安全威胁。安全系统的操作组件包括支持云服务所需的所有安全设施。OSS 也参与系统监控，包括事件和告警的使用。

    -   **业务支撑系统 (BSS)：**涵盖与客户处理和支持流程（例如账户和计费）相关的业务管理功能集合。

    -   **开发目的：**支持云服务程序员的云计算活动，包括支持该开发以及服务实现、构建管理和测试管理。


    图 2.7 展示了建议书 ITU-T Y.3502 中定义的四层云计算参考架构。该架构具有与 Y.3500 相同的四层结构；然而，它提供了关于最低层（即工具和系统层）的更多细节。该层由两个子层组成。


    ![](img/625475237d5c9b4148fda1077938a911_50_0.png)


    **图 2.7.** 展示了*云计算—概述与词汇*中描述的四层云计算参考架构。ITU-T Y.3500


    -   **资源编排：**将上层和用户可消费的服务中的计算、存储和社区资源进行导向、跟踪和监控。它控制资源的重新调整、修改和释放。

    -   **物理资源：**提供云解决方案所必需的计算、存储和社区资源。这些工具可能包括驻留在云数据中心内部的资源（例如，计算服务器、存储服务器和云内网络）以及驻留在数据中心外部的资源，通常是网络资源，包括跨云网络和核心传输网络。


    这些虚拟资源随后由资源编排根据消费者需求进行管理和控制。池化和虚拟化层中的软件和平台资源是用于编排和实现云服务的运行时环境、应用程序和其他应用资产。


    ## 2.12. 云计算的网络需求


    在这方面，考虑由 ITU-T 开发并在图 2.8 中展示的云系统版本（International Telecommunication Union 2012）将会很有帮助。该图表明云服务及网络提供商以及云服务用户的网络问题范围。


    ![](img/625475237d5c9b4148fda1077938a911_51_0.png)


    ![](img/625475237d5c9b4148fda1077938a911_52_0.png)


    **图 2.9.** 云主机网络


    云支持提供商声明一个或多个本地或区域云基础设施。云内系统很可能包含一些通过 IP 路由器连接的局域网。在基础设施内部，数据库服务器被组织为虚拟机器集群，为不同用户提供虚拟化、隔离的计算环境。这些云基础设施可能由完全相同的
    CP（内容提供商）或不同的 CP 拥有。最后，核心传输网络被客户用于访问 CP 的数据中心并安装云解决方案。网络 OSS 支持的过程包括网络库存、配置特定网络元素以及故障导向的服务管理和维护。


    **云 OSS：**云计算基础设施的 OSS 是专门服务于云计算服务提供者的系统。云 OSS 支持所有云资源的维护、监控和配置过程。


    这三个网络元素（云内、跨云、中心）加上 OSS 组件，是云解决方案组合和交付的基础：


    -   **可扩展性：**网络应具备快速扩展的能力，以满足从当前拥有数百或数千台服务器的云基础设施扩展到拥有数万甚至数十万台服务器的网络的需求。这种扩展在寻址、路由和拥塞控制等方面带来挑战。

    -   **性能：**大型数据中心和 CP 网络中的流量是不可预测且有一定波动性的（Kandula, Sengupta, and Patel 2009）。同一机架内的本地服务器之间存在持续的峰值，以及使用单个源服务器和多个目标服务器的间歇性大流量。云内网络需要提供服务器之间可靠的无拥塞高速直接（逻辑点对点）通信，以及数据中心内任意两个随机服务器之间统一的能力。ITU-T
    报告结论认为，数据中心中目前使用的三层拓扑结构（接入层、汇聚层和核心层）并不适合提供所有这些要求。更灵活和动态的数据流控制以及网络设备虚拟化，为提供所需的
    QoS 提供了更好的基础。

    -   **敏捷性和灵活性：**基于云的数据中心需要具备响应和管理云资源使用高度动态特性的能力。这包括适应虚拟机自由度以及提供通过数据中心泄漏路由细粒度控制的能力。


    推动云计算系统的媒体要求是新媒体技术（主要是软件定义媒体（SDN）和系统运营虚拟化）开发和部署的关键驱动因素之一（Stallings 2015; Erpinews
    2017; GovernmentCIO n.d.; Cloud Computing n.d.; International Communication Union
    2016; people.unica.it n.d.）。


    云计算提供了规模经济、专业社区管理和熟练的安全管理。个人或公司只需为其所需的存储功能和服务付费。消费者，无论是企业还是个人，都不必费心设置数据库程序、获取所需的硬件、执行维护以及备份数据：所有这些都属于云支持的范畴。从理论上讲，使用云计算来存储数据并与其他人讨论数据的另一个巨大好处是
    CP 管理安全。然而，客户并不总是受到保护。CP 之间存在许多安全故障。2013 年初，Evernote.com 因发现入侵事件后建议所有客户重置密码而成为头条新闻。云服务安全将在后续章节中讨论。


