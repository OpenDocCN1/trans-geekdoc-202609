    ## IaaS Security Boundaries

    The IaaS boundary divides the cloud ecosystem in the infrastructure layer, exposing
    as an agency the IaaS API, while outlining the layers barred to customers since
    the interconnected stack encompasses core connectivity, hardware, and facilities.
    Beyond the IaaS border lies the ecosystem orchestration boundary, cloud installation
    boundary, and trust boundary. The internal and external IaaS boundaries require
    coordination to establish a decent level of trust and to coordinate security with
    other cloud actors. This trust has to be determined with all the IaaS whether
    the agency is provided within the customer''s control or not. **Well-defined**
    boundaries must delineate responsibilities for security, privacy, and high quality
    of providers within the service boundaries.


    Consumers need to assess the trustworthiness of interfaces (logical and physical)
    with other actors both inside and outside system boundaries. The cloud deployment
    version chosen from the cloud user has a direct impact on the trust relationship
    with the cloud provider(s). For the IaaS support model, the cloud user assumes
    a higher level of responsibility than the cloud provider or other actors for the
    support provided.


    ## PaaS Security Boundaries

    NIST SP 800-115 defined PaaS as follows:


    - The capacity given to the [cloud consumer] would be to deploy onto the [cloud
    supplier] consumer-created or obtained applications generated by using programming
    language, libraries, services, and tools supported by the provider. The [cloud
    consumer] does not manage or control the underlying cloud infrastructure including
    network, servers, operating systems, or storage, but he commands within the deployed
    applications and possibly configuration settings for the application-hosting environment.

    - The PaaS border divides the cloud ecosystem in the platform layer, offering
    an integrated development environment and integration stage, while delineating
    the layers external to consumers as the connected stack that packs servers, network,
    operating systems, and storage, from the operating environment down to facilities,
    allowing cloud customers to deploy or construct their selection of compatible
    applications. Like the IaaS service bounds, a PaaS-based ecosystem includes PaaS
    internal and external boundaries, which the cloud user establishes with the cloud
    supplier to delineate management control and range of duties. Providers assume
    increasing amounts of responsibility for implementing and monitoring security.


    Figure 5.6 depicts the PaaS outer boundaries consisting of an interconnected stack
    that connects the facility boundaries of this IaaS with the integration boundary
    of the PaaS. Below the PaaS, limits establish the API, the delivery and connectivity,
    both the abstraction and control, as well as the hardware and amenities bounds.
    The limitations that supply PaaS interfaces require coordination to establish
    an acceptable level of trust and coordination of security together with the cloud
    provider. As mentioned previously, cloud users will need to estimate the danger
    of using the system and establish the risk tolerance. Cloud providers, in most
    cases, assume increased responsibility for safety and support coordination than
    cloud customers in a PaaS established cloud ecosystem.


    ![](img/625475237d5c9b4148fda1077938a911_114_0.png)


    **Figure 5.6.** *Platform-as-a-service border—supplier''s layers*


    ![](img/625475237d5c9b4148fda1077938a911_114_1.png)


    **Figure 5.7.** *Deployment border with PaaS external layers. Platform-as-a-service
    boundary—consumer''s layers*


    ## SaaS Security Boundaries

    NIST SP 800-115 defines SaaS as follows:


    - The capability provided to this [cloud consumer] is to use the [cloud provider’s]
    applications running [in a cloud ecosystem managed by the supplier or technical
    broker]. The applications are accessible from various client devices through either
    a thin client interface, like a web browser (e.g., web-based e-mail) or a software
    interface. [Cloud users] don’t manage or control the internal cloud [ecosystem]
    including network, servers, operating systems, storage, or perhaps individual
    program capacities, with the possible exception of limited user-specific application
    configuration settings.

    - Cloud providers must assume the most significant level of responsibility for
    fulfilling all common compliance requirements and for monitoring and implementing
    security and privacy controls. The SaaS border divides the cloud ecosystem in
    the software layer, exposing as support the program and SaaS API(s), while delineating
    the layers outside to consumers as the interconnected stack that encompasses from
    the software layer down to facilities.


    The internal SaaS boundaries consist of an interconnected stack of top layer borders
    that include the consumer data, demonstration, API, and program. The SaaS outer
    boundaries begin at the SaaS coating and build upon PaaS outer boundaries. The
    bounds that expose ports at the SaaS layer require operational, safety, and privacy
    coordination with the cloud supplier to establish a decent level of trust. Trust
    in a SaaS-based cloud ecosystem needs to be created by the cloud consumer in concert
    with any contracted cloud actors (suppliers, agents, etc.). Within the SaaS boundaries,
    establishing trust is not only harder but is also a more critical component because
    the provider is assuming most and sometimes all of the responsibilities for deploying
    and managing the process. Since the support is outside the cloud consumer’s physical
    or logical control, establishing and maintaining trust could only be done through
    well-defined deployment and orchestration bounds with enforceable terms and conditions.
    Relative to the IaaS and PaaS service models, within a SaaS-based cloud ecosystem,
    cloud providers assume the best response for implementing privacy and security
    controls and organizing and managing the service.


    The amount of confidence within SaaS boundaries and between the internal and external
    SaaS boundaries—for both the cloud consumer and the cloud provider—ought to be
    the most tight, and therefore more restrictive service arrangements and SLAs are
    demanded, together with well-defined penalties and liabilities.


    ## 5.5. ECOSYSTEM ORCHESTRATION BOUNDARY


    To minimize business expenses and reduce the price of cloud solutions, providers
    design cloud solution sets targeting as many prospective customers as possible.
    Such solutions are more accessible for business segments to understand and transfer
    workloads within, and to, the cloud. These pre-packaged solution sets frequently
    contain modules of elements that are identical, with identical settings, and that
    can easily be reproducible in different cloud ecosystems.


    This chapter described the cloud ecosystem as an intricate system of interdependent
    components that work together to allow a cloud-based information system. It is
    essential to be aware that while serving a cloud-based information system, a cloud
    ecosystem could be orchestrated by multiple cloud actors that collaborate to build
    it.


    Cloud providers construct the foundation of the ecosystem. The layers assembled
    by agents or intermediate providers inherit the controls from the lower sheets
    from the stack implemented by providers. Based on the support model, a cloud user
    adds performance to the cloud ecosystem, while inheriting privacy and security
    controls achieved by all other cloud actors.


    Many times, due to the multitenancy character of cloud computing systems, components
    of the cloud ecosystem have been shared with all other cloud ecosystems serving
    different information systems. Moreover, except for an on-premises personal cloud,
    many clouds operate in third-party data centers. And in an on-premises personal
    cloud, there are likely to be provisions for cloud burst to a different cloud
    under extreme conditions. Among the impediments to broader cloud computing adoption
    is the cloud consumers’ inability to continuously monitor the controls employed
    by new cloud actors or the operation of the elements managed by these actors.


    By ensuring that all of the cloud actors have a clear comprehension of their responsibilities
    and that the cloud actors correctly implement agreed-upon security and privacy
    controls identified in the safety plans, it is feasible for the cloud actors to
    define the cloud ecosystem orchestration boundary and to accurately assess the
    inherited risk from the usage of the particular orchestration for the information
    system under discussion.

