  - '[PAGE 109]


    To make sure that policy and procedures have been enforced throughout the system
    life cycle, service arrangements must include some means for your organization
    to be able to see the security and privacy controls and procedures utilized by
    the cloud provider and their performance over time.


    Trust is an important concept related to risk management. The reliance on cloud
    computing solutions results in the demand for trust relationships among cloud
    actors. But, building trustworthiness requires visibility into suppliers'' and
    technical brokers'' practices and risk/information security decisions to properly
    gauge the threat and estimate the risk tolerance. It is critical to say that the
    level of trust can vary and the accepted risk depends on the established trust
    relationship. The next section further discusses the importance of creating trust
    and introduces the idea of confidence border. Additionally, Chapter 7 discusses
    in detail the cloud consumer''s risk management in a cloud ecosystem.


    In a cloud ecosystem, it is of crucial importance for cloud users to establish
    the apparent demarcation of information system boundaries on all levels within
    a vendor-neutral method. Furthermore, it is incumbent on the cloud user to develop
    measures to ensure proper protection, irrespective of vendor, ownership, or support
    level for the cloud-based information system. To avoid vendor lock-in and to allow
    for a vigilant improvement of designed countermeasures, cloud consumers must not
    only set a plan to adopt a cloud-based solution but also be ready to transition
    to alternate cloud suppliers or brokers if necessary.


    Accordingly, at every level along with the subsystem level, a cloud user should
    identify the safety and privacy controls and negotiate which cloud celebrity is
    responsible for the implementation and operation of each control function. Every
    cloud actor should track and manage the service levels and the licensure, and
    should also want to support the integrity and availability of the data system
    on a boundary-by-boundary basis. Furthermore, if typical integrations to the cloud
    service provide performance, data feeds, or services, all strata needs to be identified
    and the information system control border must be established. Also, for the aggregated
    cloud service, cloud actors need to develop clear possession of the methodology
    to preserve, track, and protect the provided performance, the transactions, along
    with the associated data.


    The practice of establishing information system boundaries and the related risk
    management implications remains an organization-wide activity independent of seller
    interaction. Cloud customers will need to carefully negotiate with all actors
    participating in the orchestration of the cloud ecosystem solutions for all of
    a company''s business requirements, all intricate technical concerns with respect
    to data security, and the programmatic costs to the business. To construct the
    foundational degree of'
  - '[PAGE 110]


    protection for the information and to provide the adequate overall security position
    of this cloud-based data system, the inherited security and privacy controls implemented
    by cloud providers and cloud technical agents (when participating in the orchestration)
    need to be correctly assessed and monitored at each boundary. To elevate the programs’
    security position and protect data commensurate with its sensitivity, cloud users
    often should negotiate tailoring of current controls via parameter choice or via
    implementation of compensating safety and privacy controls.


    Because data owners retain the responsibility and accountability to ensure that
    all of cloud security controls are handled and monitored on a continuing basis,
    it is essential to incorporate in the safety programs and the service agreements,
    clear grasp of, and attention to


    +   - The choice, implementation, evaluation, and tracking of safety controls
    for cloud-based systems

    - The consequences of modifications in the cloud support performance on the overall
    security position of the cloud-based data system and about the assignment and
    business processes supported by that system

    - The effects of changes to the information system onto the cloud service and
    its controls.


    Security controls identified by the cloud user and employed by cloud actors are
    documented in the safety plan for its holistic data system and assessed for effectiveness
    throughout the risk management process (i.e., during the first authorization of
    the data system and subsequently during the constant monitoring process).


    Cloud security controls can also be assessed for efficacy if a further functionality
    is added after the data system is approved to operate. As owners of this data,
    cloud consumers need to take suitable measures to ensure that changes in any internal
    boundary of the cloud system do not affect the safety posture of the general system.


    Furthermore, they have to aggregate, in the information level, applications, platforms,
    and infrastructure level, all pertinent information obtained from the cloud providers
    and technical cloud brokers, and to consolidate the aggregated data, behavior
    near real-time observation and execute safety impact analyses.


    The following sections identify and discuss each physical or logical border in
    the cloud ecosystem. When architecting a cloud-based information system and orchestrating
    the cloud ecosystem, the cloud consumer should start by categorizing the consumer’s
    data along with the application and differentiating the corresponding boundaries.
    Then, the consumer'
  - '[PAGE 111]


    should identify functional capacities or components that are needed to support
    the implementation and secure the information, the multiple bounds corresponding
    to the service model, the cloud ecosystem''s orchestration, the cloud installation
    model, and last, but not the least, the trust boundary. In the next sections,
    we discuss these bounds.


    # # 5.4. USER-DATA BOUNDARY


    The core of the cloud ecosystem would be the user-data boundary. This border traverses
    all stackable practical layers of the cloud ecosystem, which also comprises the
    cloud customers'' information, which defines the necessary level of security in
    all outer layers.


    The way the user-data boundary intersects with the demonstration, API, and application
    border helps us understand the value of the information stored inside the user-data
    midsize and the corresponding safety controls required to operate the said outer
    operational layers. The middle of this cloud ecosystem, the user-data boundary
    (Figure 5.5) includes user information encompassed within the user-data perimeter.
    As the user information contained inside the user-data perimeter goes from cloud
    supplier to cloud customer, the user-data boundary traverses the demonstration,
    the API, along with the application boundary and should guarantee the safety of
    the information.


    ![](img/625475237d5c9b4148fda1077938a911_111_0.png)


    A data-centric architecture leveraging a border strategy warrants that all elements
    of a cloud ecosystem are designed and instrumented based on the sensitivity of
    the cloud customers'' data.'
  - '[PAGE 112]


    Service border is a general concept introduced to identify the support layers
    obtained by employing a cloud consumer or employed by cloud actors other than
    the consumer.


    Data-centric boundaries


    +   - SaaS border

    - Demo modality boundary

    - Display platform border

    - Application programming interfaces boundary

    - Applications boundary

    - Data boundary

    - Metadata boundary

    - Content border

    - IaaS boundary

    - Software programming interfaces border

    - Core connectivity and delivery boundary

    - Abstraction boundary

    - Hardware boundary

    - Facilities border


    These sections discuss critical components of border definition and acceptable
    risk. Since the consumer''s view is offered in these sections, the performance
    the consumer manages is perceived as inner, and also to better emphasize the data-centric
    structure with layers wrapping around user''s data, the bounds defining customer''s
    managed layers are referred to as internal service bounds.


    In contrast, the boundaries defining the layers led by other cloud actors (supplier,
    technical agent, etc.) are declared as outer service bounds. Additionally, because
    of the similarities in graphical representation between the three kinds of service
    bounds, only a graphical representation of your PaaS boundaries is supplied below.


    The capability provided to the [cloud consumer] is to supply processing, storage,
    networks, and other fundamental computing tools where the consumer can deploy
    and run arbitrary software, which can include things like operating systems and
    software. The [cloud consumer] does not manage or control the underlying cloud
    infrastructure but has control over operating systems, storage, and deployed applications;
    and may be limited control of select networking elements (e.g., host firewalls).


    You will find both internal and external boundaries, which the cloud consumer
    needs to establish with the cloud provider to delineate management control and
    range of responsibilities.'
