    ## 更好的用户体验和云应用


    云客户应用使用分为三种类型：


    -   基于 Web 的客户：资源通过互联网浏览器获取。

    -   客户端软件：通过软件获取云工具。

    -   带有云扩展的程序：一些桌面程序拥有对云的可选择扩展功能。


    云供应商拥有为使用最常见存储解决方案和应用程序的客户提供方云解决方案所需的基础设施。云供应商利用各种平台和技术来确保适当的服务交付；这些平台的示例包括云服务器和云存储。云存储提供存储解决方案，而云服务器运行客户的程序。


    ![](img/625475237d5c9b4148fda1077938a911_81_0.png)


    ### 云存储


    云存储是一种在合理的池（通常跨越多个位置的一些服务器）中存储电子信息的版本。物理环境通常由托管公司处理并拥有。存储提供商负责其信息的可访问性和可用性，同时负责保持物理环境运行并受到保护。云存储依赖于高度虚拟化的基础设施，通常识别一些托管的项目存储辅助功能。然而，该术语已扩展以包含当前作为辅助功能可用的不同种类的信息存储，例如存储。


    公司只需支付其实际使用的存储空间的费用，但这并不自动意味着云存储不昂贵。


    存储维护任务转嫁给支持供应商。云存储供应用户即时访问广泛的资源。云存储可作为自然灾害证明备份使用。


    安全问题和缺乏信息：外包存储的性能取决于电信供应商通过其基于铝或光纤电路的 WAN 连接提供的成本、性能、可靠性和服务质量 (QoS)。允许文件共享的网站可能会导致盗版和侵犯版权。


    ### 云服务器


    云主机是一个通过云计算系统在公众（互联网）或专用网络上托管的合理服务器。即使服务是远程由云供应商获得的，云服务器也提供与本地服务器相同质量的支持。云服务器可以被描述为云服务模块中的即服务基础设施
    (IaaS)。


    在某些方面，云服务器与服务器以完全相同的方式运行；然而，它们提供的功能可能大不相同。在选择云托管时，客户租用的是虚拟服务器空间，而不是租用或购买物理服务器，这通常按小时计费，基于任何特定时刻所需的能力。


    虚拟机是系统（例如计算机）的软件实现，拥有自己的操作系统 (OS) 并像物理机器一样实现应用程序。在云环境中，现代物理硬件可能被分成有限数量的虚拟机，这些虚拟机可以分配给客户。这也有助于更有效地消耗计算工具。不同种类的虚拟机操作系统可以在完全相同的硬件上共存，但需要虚拟隔离来协调此操作系统的性能。在这种交付模式中，机器被分成几个逻辑服务器，每个逻辑服务器使用其不同的操作系统、用户界面和软件，尽管它们共享相同的物理服务器。


    ### 云计算服务模式


    云计算供应商根据三种基本模式（Hayes 2008）提供其服务，如图 4.6 所示。以下是三种类型的云计算：


    ![](img/625475237d5c9b4148fda1077938a911_83_0.png)


    **图 4.6.** 云计算供应商根据三种基本模式提供其服务


    -   **软件即服务 (SaaS)** 也被称为“按需软件”。SaaS 用户不是购买不同的软件，而是定期租用软件，并通过在线浏览器使用它。


    SaaS 提供的软件组合非常广泛。软件即服务类型的云计算增长非常快。软件即服务的最大市场是客户关系管理。


    -   **平台即服务 (PaaS)** 为云计算用户提供计算机平台。它也是云计算提供的其他两种服务之间的纽带；SaaS 和 IaaS。


    标准计算机需要一个包含硬件和架构的计算机平台，以及应用程序框架。这样的平台是硬件和应用程序协作的基石，包括操作系统、语言和架构。对于云计算，在没有实际计算机的情况下，平台即服务为用户提供编写计算系统所需的一切。PaaS
    提供的少量设施包括托管、实现、测试和程序开发，以及应用程序设计。此外，提供 PaaS 的云服务提供商包含一组质量来设计、测试、实现、管理和运行程序。这些设施可以供个人和企业客户使用，通过订阅一个包含所有提供功能的套餐。


    平台即服务 (PaaS) 版本高于软件即服务设置，并提供硬件、网络和操作系统支持，以便其客户可以设计自己的应用程序。为了满足应用程序的扩展性和可管理性等要求，客户必须从
    PaaS 卖方处选择预定义的操作系统和应用程序服务器组合，例如，Web 开发者可以在开发、测试并最终托管其网站的任何阶段利用相应的 PaaS 环境。


    -   **基础设施即服务 (IaaS)** 是云上的下一个计算类型。与提供不同软件和硬件设备（在云平台上）的 PaaS 和 SaaS 一样，IaaS 提供虚拟化平台。硬件虚拟化过程仅向用户展示抽象的计算机平台，而不是物理平台。这种虚拟化导致创建所谓的“虚拟机监视器”或甚至“
    hypervisor ”，这是云计算系统的下一部分的创建，即基础设施即服务。IaaS 客户可用的基础设施包括软件、服务器、网络设备以及数据中心空间。客户云服务提供商产生的费用通常取决于消费者使用的服务量，因此不是固定的。但是，根据用户订阅的设施数量，消费者必须支付最低费用。


    IaaS 是通过网络由标准化服务提供的基本计算和存储区域。此版本通过合并并提供数据中心空间、存储系统、网络服务器、设备等简化了工作负载。此外，客户可以开发并安装其自己的操作系统、应用程序和软件。


    利用云计算技术有许多优势。然而，任何类型的云服务都有其自身的一组优势和陷阱。为了做出正确的决策，用户仔细权衡优缺点非常重要。


    IaaS 被认为是最简单的云服务模型，正如 IETF（互联网工程任务组）所述，IaaS 供应商提供计算机——物理或（更常见地）虚拟机——以及其他资源。在 IaaS
    版本中，诸如主机硬件、软件、服务器、存储和其他基础设施要素之类的工具可以提供给客户。


    提供 IaaS 的云供应商提供按需和高度可扩展的工具，使 IaaS 适用于临时、实验性或突然变化的工作负载。此外，IaaS 可以是一些没有资金投资于硬件或其他工具的组织，或经历快速扩张且攀升硬件可能困难企业的绝佳解决方案。


    如今，许多企业更喜欢外包服务器、应用程序、数据中心等，而不是购买工具。在这里，他们可以找到完整的按需支持。虽然 IaaS 供应商可以为一些企业和协会提供巨大利益，但在许多情况下其限制可能是可争议的，例如在高性能至关重要的企业中，或在法规合规性防止外包信息处理或存储的地方。


    从 PaaS 版本来看，云供应商提供计算平台，通常包含操作系统、编程语言实现环境、数据库和 Web 服务器。一些 PaaS 供应商为客户提供可扩展的工具，其中底层存储和计算机资源根据应用程序要求自动扩展，因此云客户不需要手动分配资金。PaaS
    提供商通常提供一个计算平台，允许快速有效地创建 Web 应用程序，这使得客户可以避免获取和维护所需基础设施和软件的复杂性。PaaS 与 SaaS 非常相似，只是它不是通过网络提供应用程序，而是通过网络提供用于生成应用程序的平台。PaaS
    基本属性通常包含以下内容：


    -   许多 PaaS 平台提供多租户架构，其中并发和多个用户使用完全相同的改进程序。

    -   一些 PaaS 平台鼓励团队协作开发。

    -   大多数 PaaS 平台提供工具来处理计费和订阅控制。


    PaaS 被认为在多个程序员正在开发项目开发，或需要其他外部方与开发项目互动的情况下最有用。此外，PaaS 在程序员希望自动化测试和安装服务时也有用。


    有些场景下 PaaS 可能不是理想的替代方案；例如，专有语言可能会影响或干扰后续转移到其他供应商的操作，或者程序运行涉及定制底层应用程序和硬件的情况。一些最常见的
    PaaS 供应商示例包括 Microsoft Azure 服务、Google App Engine 以及 Force.com 平台。


