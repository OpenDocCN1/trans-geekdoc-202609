    集中式索引会将内容暴露给任何可以访问该索引结构的人。这种访问控制漏洞在云中可能无法被容忍，因为对索引服务器信任度的假设不再成立。此外，黑客攻陷目录主机可能导致完全且灾难性的隐私泄露。去中心化索引是一种替代架构，用于识别符合搜索者查询的特定文件（或文件宿主）集合。可以通过确保供应商在提供文件之前执行其访问策略来增强访问管理。但是，索引仍然由供应商无法控制的不可信机器托管。为了解决上述问题，一些研究探索了利用基于谓词的密码学（Chang
    和 Mitzenmacher 2004；Yang, Zhong 和 Wright 2007）生成私有索引的潜力。


    虽然值得关注，但由于密钥管理要求和计算开销，这些方法缺乏特定的适用性。Bawa 等人（2009）通过引入分布式访问控制协议，提出了一种有趣的个人索引方法。一项较新的研究（Squicciarini,
    Sundareswaran 和 Lin 2010）通过让用户更好地控制索引，从另一个角度解决了隐私问题。具体而言，提出了一种三层数据安全性框架，根据信息所有者的需求提供强、中和低级别的安全性。这是通过构建前一节中提到的相同
    JAR 文件来实现的。JAR 文件包含策略和数据，并按如下方式实现不同的安全级别：


    -   **强安全性：** 不允许服务提供商浏览用户文档的敏感部分，以消除在记录的敏感部分进行沟通并可能导致隐私泄露的可能性。用户需要指明其信息文件的敏感区域。然后，JAR
    充当选择应从 CSP 读取哪些主题的作用。在连续读取该文档时，通过识别敏感字段开始的位置来跳过安全字段。

    -   **中等安全性：** 此选项禁用对该信息文件的任意访问，以避免文档内的成功索引。CSP 将被强制按照特定顺序查看内容，以便能够找到其所需的信息。

    -   **低安全性：** 用户明确指定其信息文件和索引的使用范围。服务提供商应被信任，并将通知并重新连接所有用户用于索引目的的关键词。


    ### 3.4. 多云环境中的隐私与安全


    云计算正在呈指数级增长，目前已有数百个不同规模的 CSP（Weinman 2013）。云间网络（也称为 intercloud）的概念已被提出，并在近年来得到研究（Weinman
    2013；Zhu 等人 2012）。在云间网络中，我们以特定的冗余度将信息分布在多个由不同供应商管理的独立云中，使得即使部分云变得不可访问，存储的数据仍可保持可访问。多云环境（Zhu
    等人 2012）为云客户提供了许多新的机会和路径。云客户将能够利用不仅是一个，而是许多云服务提供商来满足其多样化需求，并在某家提供商停止服务时切换提供商。为了推广多云，IEEE
    启动了 Intercloud 测试床项目（Weinman 2013），使不同云之间的交互成为现实。


    虽然云用户可能享受许多云提供的更廉价的数据存储和强大的计算能力，但客户也面临更复杂的外包数据可靠性问题和隐私保护问题。具体而言，由于很难获得对每个 CSP
    可靠性的明确承诺（Owens 2010），通常建议云消费者采用可搜索加密方法（Song, Wagner 和 Perrig 2000；Kamara 和 Lauter
    2010），以加密其外包信息的方式，使得 CSP 可以在不解密的情况下直接搜索加密数据。尽管在许多致力于提高可搜索加密效率和安全的努力中，很少关注确保可搜索加密信息的可靠性。虽然云存储提供按需远程备份替代方案，但它不可避免地增加了与单点故障和潜在存储灾难相关的可靠性顾虑。一个完美的多云环境应具有以下属性：


    -   **可靠性：** 对于给定的 CSP，如果可以找到 t 个（t < n）CSP，机器仍应能运行，其中 t 是计算机的预定义阈值。

    -   **语义安全性：** 机器应通过满足以下两个要求来实现语义安全（Curtmola 等人 2006）。首先，给定文档索引和编码文档的选择，任何对手都不能了解原始文件的任何信息，除了文档跨度外。其次，给定一系列关键词查询的一组陷阱，任何对手都不能了解关于原始文件的任何信息。

    -   **陷阱安全性**：这要求有关查询关键词的任何信息——包括搜索例程——在多个 CSP 协作搜索之前不应泄露。即使对手威胁其中一个 CSP，该条件依然成立。

    -   **健壮性**：当协议成功完成时，用户返回并重构适当的文件。如果协议在协作搜索阶段中止，则不返回任何内容，且 CSP 无法了解文档集或隐含的搜索关键词。


    值得注意的是，很少有工作考虑同时确保外包到多个云的数据的可搜索性、隐私和可靠性。目前的可靠性保证仅依赖于每个 CSP 的备份选项，但这可能是一个单点故障。例如，2011
    年 Amazon 弹性计算服务的崩溃导致一些流行的社交媒体网站离线一天，并且一个单一的能源部门合作网站在近两天内无法访问。更严重的是，这次崩溃永久性地销毁了许多客户的数据，对某些用户造成了严重后果（Blogdot
    2011）。近期研究（Chen 等人 2010；Hu 等人 2010）提出了再生码，用于像云这样的分布式存储中的数据可靠性。基于网络编码概念构建的再生码旨在混合存储在现有存储节点中的数据块，然后在新存储节点中生成信息。研究表明，与在相同容错级别下的传统擦除码相比，再生码减少了数据修复/恢复流量。


    实现外包到多个云的数据的可搜索性、隐私和可靠性的一种朴素方法是简单复制。具体而言，我们可以将单用户可搜索加密策略复制到 CSP 中。每个 CSP 存储相同的可搜索密文。因此，即使
    n – 1 个 CSP 不可用，远程文件仍然可用。但由于保存副本需要大量能力，此策略并非空间高效。为了在容忍 CSP 故障的同时减少冗余，另一种可能的方法是使用擦除编码。具体而言，我们可以使用秘密共享方法将文件编码为一组份额，并将这些份额分配给
    n 个 CSP，以便如果特定数量的 CSP 不可访问，可以使用其余 CSP 的份额来重构原始文件。


    与第一种方法相比，第二种策略通过将从 n – 1 降低可靠性保证到 2 – t，从而节省了存储空间。


    '
