  mdcn: '

    ## SaaS 架构与部署模型


    SaaS 是专为特定功能设计的业务应用的理想平台，云供应商负责运行软件的底层平台和基础设施。


    SaaS 有两种不同的模式：


    ### 单租户 SaaS 架构

    - **单租户 SaaS 架构：** 尽管不存在百分之百安全的系统，但单租户环境更容易实现更高的安全性，因为每个客户端的数据与其他任何数据完全隔离。在一个客户意外访问另一个客户数据（如在多租户环境中）的可能性基本被消除。

    - **单租户架构：** 这些架构通常被认为更可靠，因为一个客户软件实例的性能不会受到其他客户操作的影响。


    在单租户环境中，由于单个系统备份到 SaaS 服务器的专用部分，您需要对备份和恢复拥有更多的控制权。另一方面，在多租户环境中，这一过程更为复杂，以至于用户不一定能随时获得。


    对于最终可能希望迁移到自托管环境的企业来说，通过使用单租户模式，流程会变得更简单。


    在单租户模式下，您对环境拥有完全控制权。这意味着平台在定制化方面提供了更大的灵活性。它还提供了对更新和升级的更多控制。


    ### 多租户 SaaS 架构

    - **多租户 SaaS 架构：** 多租户操作的货币优势在于，由于所有资源共享，每位用户的成本会降低。如果您正在寻找一种在财务上最合理的解决方案，多租户模式可能正是您所需要的。由于每个资源都是共享的，多租户模式在最大资源利用率下运行，从而实现最佳效率。系统是一个持续变化的环境，资源被并发访问。提供多租户环境的
    SaaS 平台通常非常注重提供一流的客户服务。这是因为它们拥有更多的用户，需要确保每位用户都有良好的体验。


    应用于系统的更新会影响所有客户，因此，系统更新和更新维护通常由 SaaS 公司处理，而不是由单个客户处理。因此，多租户模式通常需要更少的维护。


    值得注意的是多租户与多企业之间的区别，因为它们是两个非常不同的概念，但很容易混淆。


    ### 多企业 vs. 多租户

    多企业，也称为多企业小型业务系统，是一种使几方能够协作进行活动的 B2B 生态系统。另一方面，多租户环境是一个与销售相关的术语，描述了软件解决方案的处理方式。


    多租户架构是企业 SaaS 应用的行业标准，但这并不意味着开发人员应该回避运行单租户环境的概念。每种架构都有其最佳使用案例。在决定哪种适合您时，重要的是考虑您需要完成的具体任务。如果您考虑哪种方式能提供与您当前环境相似的开发环境，在某些情况下，您可以选择使用单租户模式。例如，如果您希望完全控制环境和维护，您可能会选择投资单租户生态系统。但对于寻求最无缝数字化转型的公司来说，单租户基础设施可能更笨重和繁琐。就
    SaaS 初创公司而言，目前几乎没有哪家公司在运行单租户模式。但对于希望从受控服务器环境迁移到任何自托管环境的公司来说，单租户模式是理想的。


    云客户有五种主要的云计算解决方案架构部署方式，如图 4.7 所示：


    - 私有

    - 虚拟私有

    - 混合

    - 社区

    - 公共


    ![](img/625475237d5c9b4148fda1077938a911_87_0.png)


    **图 4.7.** 云配置版本


    图 4.8 说明了云模型的特征：


    - 高度可扩展的工具，因为云工具可按需提供

    - 对云解决方案和资产的高可访问性

    - 降低成本

    - 自适应服务

    - 与位置无关的解决方案可访问性


    ![](img/625475237d5c9b4148fda1077938a911_88_0.png)


    ### 4.1.8. 私有云


    这种部署方式基本上使组织能够创建远程数据中心。从安全角度来看，该模型通常提供最大程度的控制。私有云是一种提供类似于公共云服务的云计算结构，例如可扩展性和灵活性；然而，与向众多组织提供服务的私有云不同，私有云专属于一家公司，如图
    4.9 所示。与 DropBox 和 Google Drive 等云存储服务不同，私有云由个人拥有和控制：个人购买存储方法并将其连接到网络，而不是租用互联网空间。不久前，建立个人云存储系统基本上需要个人构建服务器。但现在，得益于
    D-Link、Western Digital 和 Seagate 等公司为消费者提供的友好系统，个人只需插入设备即可。


    ![](img/625475237d5c9b4148fda1077938a911_89_0.png)


    **图 4.9.** 私有云专属于一家公司


    ### 4.1.9. 虚拟私有云


    虚拟私有云包含按需提供的共享计算工具，可分配给云环境中的客户，如图 4.10 所示。虚拟私有云（VPC）是位于公共云内部的一种私有云，它允许您在使用公共云资源的同时体验虚拟化网络的好处。VPC
    将您的信息与其他公司的信息隔离开来——无论是在传输过程中还是在云提供商的网络中——有助于创建更安全的环境。


    ![](img/625475237d5c9b4148fda1077938a911_89_1.png)


    **图 4.10.** 虚拟私有云


    VPC 通过虚拟专用网络（VPN）连接与远程网络相连。对于寻求高安全性、隐私和管理水平的公司（如处理法规遵从性的医疗和金融机构），VPC 是理想的。企业还发现
    VPC 非常适合运行关键任务应用。通常通过托管服务提供商的控制面板来管理 VPC。这个进入 VPC 的窗口允许个人轻松查看并根据需要进行调整。


    ### 社区云


    这种云安装方式为有限数量的企业提供了云计算替代方案，这些企业由所有参与方或第三方托管服务提供商共同管理和采购，如图 4.11 所示。通常，这种部署包含具有相似政策或需求（可能受益于相同基础设施）的特定组织，或专注于联合项目、研究或需要集中计算中心的软件的组织。社区云可以被视为私有云的混合设计。


    ![](img/625475237d5c9b4148fda1077938a911_90_0.png)


    **图 4.11.** 社区云


    ### 混合云


    混合模型由私有云和公共云工具的组合组成，其中私有云和公共云基础设施独立运行，通常通过加密链接进行通信，如图 4.12 所示。有必要了解私有云和公共云是不同且独立的组件。通常，组织在私有云中存储关键或重要数据，并借助公共云，可以使用私有云接收应用程序依赖的计算工具，这增强了安全性并将信息漏洞降低到可接受的最小值。混合云具有许多优势并提供许多选项，因为这种部署版本适用于发生故障转移场景时创建备份，或平衡繁重的工作负载，并且基于示例可能比私有云更具成本效益及其他优势。图
    4.12 展示了这种云安装版本。


    ![](img/625475237d5c9b4148fda1077938a911_91_0.png)


    **图 4.12.** 混合模型由私有云和公共云工具的组合组成


    云计算服务商服务各种类型的消费者。云客户可能是小型企业、中型企业、大型企业，或仅为私人目的利用云解决方案的个人。无论客户的类型和意图如何，消费者必须向云供应商定义其支持需求，例如存储需求、CPU
    时间、内存需求、可访问的平台和软件。

