    All that the customer needs are an input device (keyboard) and a seeing device
    (display). Some may not require a mouse.


    By comparison, a thick client provides users with more attributes, im-

    ages, and choices making the applications more customizable. Unlike thin

    clients, thick clients do not rely upon a central processing host because

    the processing is performed locally on the user system, and the server is

    obtained mostly for storage purposes. For that reason, heavy clients fre-

    quently are not suited for public surroundings. To maintain a heavy client,

    all systems for software installation and updates have to be maintained,

    rather than just keeping the software on the server. Additionally, heavy

    customers often require operating certain applications, again introducing

    more limitations and work for deployment.


    Over the past couple of years, the general drift is to move toward smart

    clients, also called wealthy customers. The trend is a movement from con-

    ventional client/server architecture to a model that is contemporary.


    More like a thick client vs. a thin client, smart clients are Internet-

    connected apparatus that allows a user''s local applications to social-

    ize with server-based programs by using web services. For instance, a

    wise client running a word processing application might interface with'
