    technical cloud brokers for securing portions of the system on which the cloud
    customer''s data and applications operate. Visibility into how the cloud supplier
    functions, such as the provisioning of composite solutions, is an essential ingredient
    for adequate oversight of system safety and privacy by a cloud consumer.

