    ## 致谢


    首先，我要感谢我的家人和朋友一直以来的陪伴与支持。我还要感谢 Nigel Wyatt、Michael Weiss（格里菲斯学院都柏林分校）、Gabriel
    Grecco（摄影）以及 Momentum Press 团队提供的支持与启发。


    ## 引言


    我的关于云计算中数据安全系列作品的这一卷第一册，既可作为专业基准，也可作为从业者指南，为当今最完整且简洁的云计算安全视图提供了参考。它涵盖了云计算安全概念、技术和实践与其相关基础技术以及近期进展之间的关系。它探讨了针对广泛云计算保护问题的实际解决方案。


    本书的主要受众是工程师/学生，他们有兴趣监测和分析特定的、可量化的云计算保护环境，这可能包括基础设施或交通系统、机械系统、地震事件以及水下环境。对于有兴趣进行战术监视以及移动云计算保护目标分类和监测的安全及相关专业人员来说，本书也很有用。这本详尽的参考书和从业者短书对于云计算安全方向的高年级本科生和研究生课程的学生也具有重要意义。


    ## 第 1 章


    ### 云计算基础


    尽管互联网诞生于 20 世纪 60 年代，但直到 20 世纪 90 年代，人们才发现互联网服务于企业的潜力，这也导致了该领域更多的创新。随着互联网传输速率和连接性的改善，催生了被称为应用服务提供商（ASPs）的新型业务。消费者向
    ASPs 支付月费，以便通过 ASP 的系统在网络上运营他们的业务。直到 20 世纪 90 年代末，我们现在所熟知的云计算才出现，并引发了关于什么是云计算的讨论。


    既然我们对云有了大致的了解，只需考虑你日常在网上的所有活动，你就会明白你在线进行的许多工作都依赖于云。例如，你的社交网络互动、在线购物、在线缴纳能源账单、网络购物，一切都在云上。有一个叫做客户关系管理（CRM）的程序，它也依赖于云。该软件在大多数销售组织中得到了高度利用，以实现卓越的可操作性、提高生产力和降低成本。云的使用方式类似于一名外勤销售代表获得访问你移动设备的权限，该设备已连接到网络。然后他可以从任何位置获取客户信息。销售代表可以在移动中更新信息，因此他无需回到办公室来升级信息。销售经理也可以通过他们的联网设备监控一切，并将了解哪些交易可以达成。


    从另一个角度看，一位使用美国云供应商存储数据库的欧洲云用户可能会发现，由于其信息受《美国爱国者法案》的约束，可能会受到审查。云计算的主要优势是易用性和成本降低。云供应商专门提供其支持的服务：租赁硬件、操作系统、存储和应用服务。因此，企业无需雇用各种
    IT 员工，可以专注于其核心使命。例如，一家公司不需要雇用专门从事备份的员工，因为它可以从像 Code42 CrashPlan 这样专注于备份服务的组织购买此服务。备份云供应商提供的支持很可能远远超过临时雇用来看护此项工作的员工。这种计算外包版本提供的另一个优势是它减少了前期的业务费用和持续的费用。云计算提供商以高科技版本运行，消除了繁琐的任务，例如软件和设备的更新与维护。云用户可以将节省下来的现金用于未来设备投资和管理，并分配对其任务具有战略意义的领域。


    美国国家标准与技术研究院（NIST；Knight 2012）一直试图提供一种统一的方式来从一开始就规范云计算。尽管其复杂性和特征复杂，但 NIST 已确定了五个表征云计算系统的基本特征：


    1. **按需自助服务：** 消费者可以单方面自动配置计算能力（如服务器时间和网络存储），而无需与每个服务提供商进行人工交互。

    2. **广泛的网络访问：** 能力通过网络可用，并通过标准机制访问，以促进异构薄或厚客户端平台（如智能手机、移动设备、平板电脑、笔记本电脑和工作站）的使用。

    3. **资源池化：** 提供商的计算资源被汇集以多租户模式服务多个消费者，不同的物理和虚拟资源根据消费者需求动态分配和重新分配。存在一种位置独立的感觉，因为客户通常对提供的资源的具体位置没有控制或知情权，但可能能够在较高抽象级别指定位置（例如国家、州或数据中心）。资源的例子包括存储、处理、内存和网络带宽。

    4. **快速弹性：** 能力可以弹性地配置和释放，在某些情况下自动配置，以根据需求快速向外和向内扩展。对于消费者而言，可用于配置的资源通常似乎是无限的，并且可以在任何时间以任何数量获取。

    5. **计量服务：** 云计算系统通过利用适合服务类型的抽象级别上的计量能力（例如存储、处理、带宽和活跃用户账户）来自动控制和优化资源使用。资源使用可以监控、控制并报告，为提供商和消费者提供透明度。


