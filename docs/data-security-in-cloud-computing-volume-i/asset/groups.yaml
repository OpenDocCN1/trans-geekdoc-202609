    # 云计算安全要素


    互联网的演化可以分为三代：从 20 世纪 70 年代开始，第一代以从终端获取的昂贵大型机为标志；第二代诞生于 20 世纪 80 年代末和 90 年代初，其特点是被图形用户界面（GUI）的个人计算机爆发式增长所识别。21
    世纪的第一个十年引入了第三代，其定义为移动计算——物联网——以及云计算。


    1997 年，埃默里大学的 Ramanath Chellappa 教授首次定义了云计算系统，称其为一个重要的“计算范式，其中计算的边界将由经济理性而非单纯的技术限制来设定。”


    尽管国际 IT 文献和媒体此后提出了许多关于云计算的定义、模型和架构，但自治计算和效用计算系统是社区通常所指的云计算的基础。从 2000 年代初开始，随着意识到云计算可能同时惠及服务提供者和消费者，公司迅速拥抱了这一概念。企业开始通过互联网提供计算功能、企业级应用程序、基于网络的零售服务、文档共享能力以及完全托管的
    IT 平台，仅举 2000 年代云计算应用的几个例子。虚拟化和面向服务架构（SOA）的最热普及推动了云计算作为任何交付和关键任务战略中一个基本且日益重要的部分。它使得现有和新产品和服务能够更有效地、方便地和安全地被提供和吸收。毫不奇怪，云计算成为
    IT 领域最热的趋势之一，具有独特且互补的特性，如弹性、韧性、快速配置和多租户。信息系统目前在 IT 发展中处于三重或三因素拐点（图 5.1）。


