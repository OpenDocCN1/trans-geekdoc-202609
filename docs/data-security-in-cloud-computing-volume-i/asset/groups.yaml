    ![](img/625475237d5c9b4148fda1077938a911_62_0.png)


    图 3.4. 亚马逊用户登录门户


    哈希算法用于创建信息的单向不可逆表示，以确保安全性（Erl, Puttini, and Mahmood 2013; Goodrich and Tamassia
    2010; Kurose and Ross 2012）。此外，一旦数据的一部分被哈希处理，就无法撤销，因为不存在“反哈希密钥”：哈希功能可以通知我们在数据中心存储或传输中的信息是否受到威胁（Erl,
    Puttini, and Mahmood 2013）。消息摘要通常比原始材料更加紧凑。如果一方需要通过网络向另一方发送消息，它可以随附该信件与新闻。接收方通过应用完全相同的哈希函数来验证消息的完整性，并确认该内容与消息一致。


    文献中涵盖了许多用于确保云环境中虚拟机（VM）安全性的函数。Santos, Gummannadi, 和 Rodrigues (2009) 提出了一种方法，以获取可靠的云计算系统（TCCP），使支持基础设施（IaS）解决方案（如
    Amazon EC2）能够提供封闭箱执行环境。TCCP 保证客户虚拟机的私有实施，并允许用户在启动自己的虚拟机之前向 IaaS 供应商证明服务是否受到保护。该策略包含三个模块，用于保护其敏感信息的完整性和隐私。


    如今，越来越多的组织正在采用公共云解决方案来存储其数据（例如 Microsoft Skydrive 和 Dropbox），除了 Amazon EC2 和 MapReduce
    框架外，还将其用于数据处理。研究结果表明，云计算的采用率持续增长，2013 年调查显示 75% 的受访者使用了云平台，而 2012 年这一比例为 67%（Bridge
    2013）。使用云技术在推动多个组织（例如政府部门）之间的强制性数据共享方面也很有用，这对于许多关键社会应用都有帮助，包括国土保护、网络安全、疾病传播控制以及绿色市场。


    但是，信息保密性的关键问题（Cavoukian 2008; Gellman 2009; Jaeger, Lin, and Grimes 2009; Pearson
    and Charlesworth 2009）阻碍了云技术，特别是公共云的广泛采用。确保从云共享和存储的敏感信息得到牢固保护，防止未经授权的访问至关重要。这意味着存储在云中的信息应根据访问管理策略在不同的消费者之间，甚至在不同组织之间进行共享。


    在应用访问控制时，保护授权用户的配置文件信息（例如用户功能和位置）也很重要，因为这可能会导致对信息内容的推断。这是由于先进的访问管理系统（如著名的基于属性的访问控制模型（Lin
    and Squicciarini 2010））要求将关于用户的执行系统信息披露给访问管理。此外，云中的数据可能会在可能位于不同区域（甚至州）的信息中心之间移动，而云用户对其信息的处理和存储位置知之甚少。因此，确保日常操作中的隐私是一项对云服务提供商（CSPs）及其客户都具挑战性的任务。迫切需要创建针对云特有的数据获取技术。下一节首先介绍通用的云信息安全版本，然后回顾最先进的云信息安全方法。该部分以对云信息泄露的另一潜在原因的讨论结束。


    从云中，我们观察到以下两个显著特征，它们为信息安全方法的发展带来了障碍。云服务可能通过一串服务提供商提供（Jaeger, Lin, and Grimes 2009）。让我们强调直接服务提供商是
    S，其间接和直接构建者是 S1, S2, S(...)，他们需要一个选择服务提供商的人。候选人的支持提供商的隐私策略需要评估，以确保它们符合客户的隐私偏好。更严格地说，间接构建者的策略可能需要确认以满足客户的隐私需求。在整个服务期间通过多方确保和执行消费者的隐私要求更为困难。一些针对云支持中涉及各方的可能调整，如文献中所述（Gellman
    2009），需要考虑：参与的各方可能希望升级其隐私策略，或者甚至服务提供商可能希望由于业务出售、合并、政府移植等原因，与客户的信息一起将业务迁移到他人手中。这些事件可能会影响所有各方最近商定的策略。


    问题是如何有效且高效地反映这种变化；对达成策略安排和政策权威的影响效果可以减轻。具体而言，个人加入云并面对一些 CSP，其中每一个都能提供他所需的服务。为了发现隐私策略最符合用户隐私要求的服务提供商，消费者的隐私要求和支持供应商当前的隐私策略共同输入到策略匹配模块。排名模块帮助用户选择具有最匹配隐私策略的服务提供商。考虑到所选的服务提供商可能仍没有完全符合消费者要求的策略，下一步将是将其策略发送到覆盖整合模块，该模块将根据双方自动创建整合策略。


    整合策略可能以两种格式存在。一种是以良好的策略安排形式，即用特定策略语言编写的策略。另一种是可执行格式（例如 Java JAR 文件），用于随后的策略执行。通过该过程，即使可执行覆盖可能在连接到直接服务提供商的构建者之间旅行，消费者的数据保密性也将受到保护。


    如上所述的安全模型数据所示，策略执行组件对云中信息的整体安全至关重要（Cavoukian 2008; Gellman 2009）。目前有一些尝试旨在处理这一问题。一些策略（Nabeel
    et al. 2011; Nabeel, Shang, andertino 2013; Shang et al. 2010）使用广播密钥管理方法来提供对云信息的访问控制。此类方法根据访问管理策略对组信息进行分组，并使用另一密钥重新建立每个类别。然后，用户仅被授予他们被允许访问的信息项目的密钥。这些加密操作需要在运营商所在地执行，从而产生高通信和计算成本。


    例如，如果个人被撤销，运营商应下载云中由此变化更改的信息，然后创建一个新的加密密钥，用新密钥重新加密下载的信息，然后将重新加密的信息上传到其云。但是，这种策略在管理常规用户进出方面并不高效。


    为了提高操作效率，一些系统使用称为“代理”的第三方（Pearson and Charlesworth 2009）在信息接收者变化时执行重新加密。但是，它们没有保护用户的识别特征。


    另一类有趣的工作（Sundareswaran et al. 2012）旨在将信息与访问管理策略紧密结合，以确保无论何时何地获取数据，策略都将被机械地执行。使用
    Java 技术的好处主要是双重的。首先，JARS 为信息以及权限引擎提供轻量级且可移动的容器。其次，JARS 的基础设施要求最低（即远端运行合法 Java
    运行时环境（JRE）），这使得我们的策略易于被接受。用户关于明确策略的信息项目将以编码格式连同加密日志文件一起存储在各种内部 JAR 中。外部 JAR 包含认证模块和策略。它负责认证希望获取信息的实体，选择正确的内部
    JAR 并实施相应的覆盖。该 crate 将在结构中被密封和签名。


    ### 3.3. 云数据泄露的其他潜在原因


    除了在实际数据文件中执行用户的隐私策略外，还有一个有趣且根本的隐私问题是由信息索引引起的。索引可能包含关于信息的巨大负载。由于索引通常是在服务提供商获取用户信息并决定创建索引以改善搜索功能之后收集的，用户甚至可能不知道这种信息的使用，这很可能会泄露比用户计划更多的信息。促进对分散内容进行有效搜索的最常见策略是构建集中的倒排索引。该索引将每个术语映射到包含该表达的一些文件集，并可以从搜索者处查询以获得匹配文档的列表。搜索引擎和中介通常采用这种策略。正如
    (Bawa et al. 2009) 所示，该策略可以通过将访问控制策略与内容一起分发到索引主机来扩展，以鼓励受访问控制的搜索。索引主机必须对每个搜索者实施这些策略，以适当过滤搜索结果。由于必须联系索引主机才能完全执行搜索，因此搜索非常高效。


