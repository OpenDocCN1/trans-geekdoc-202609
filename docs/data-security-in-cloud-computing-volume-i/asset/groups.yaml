    ![](img/625475237d5c9b4148fda1077938a911_44_0.png)


    如图 2.4 所示的参考结构定义了五个主要的“参与者”，涉及随后列表中描述的功能和职责：


    -   **云用户**：与云提供商（CP）保持业务关系，并使用 CP 提供的服务的个人或公司。

    -   **云供应商**：负责创建可供相关方使用的服务的个人、公司或实体。

    -   **云审计员**：负责运行针对云解决方案、数据系统操作、功能以及云执行安全性的独立评估。

    -   **云代理**：管理云解决方案的使用、功能和交付，并负责在云提供商（CP）和云客户之间协商连接的实体。

    -   **Cloud Inc.**：提供云解决方案从 CP 到云客户的传输和连接的中介机构。


    该云消费者和供应商的功能已在前文讨论过。总结来说，云提供商（CP）可以提供至少一种云解决方案，以满足云客户的 IT 和业务需求。对于所有三种服务模式（SaaS、PaaS
    和 IaaS），CP 提供支持该服务模式所需的处理和存储设施，并为云支持客户提供云端口。对于 CP 部署的 SaaS，CP 会配置、维护和升级其软件程序在云基础设施上的性能，从而使服务能够按照预期的服务量提供给云客户。


    SaaS 的客户可能是向成员提供应用程序使用服务的组织，或者是为最终用户配置软件的应用程序或应用程序程序管理员。对于 PaaS，CP 监控其平台的计算基础设施，并运行提供平台各部分（包括运行时程序实现堆栈、数据库和其他中间件组件）的云应用程序。PaaS
    的云用户可以使用 CP 提供的资源和实现资源，在云环境中创建、安装、测试和管理托管的软件。对于 IaaS，CP 加速支持底层的计算工具，例如服务器、存储、网络和托管基础设施。


    IaaS 云用户随后利用这些计算工具（如计算机）来满足其必要的计算需求。云提供商是一个媒体设施，提供云客户与 CP 之间的云解决方案传输和连接。通常，CP
    会安装服务级别协议（SLA），使用云提供商按照提供给云客户的 SLA 程度提供服务，并可能要求云提供商在云客户和 CP 之间提供安全且专用的连接。当 CP
    过于复杂，云用户难以直接处理时，云代理会很有帮助。云代理可以提供两种服务范围：


    -   **服务聚合**：代理将多个云解决方案结合起来，以满足单个 CP 未能明确解决的客户需求，以最大化性能或降低成本。

    -   **服务套利**：这类似于支持聚合，但区别在于被聚合的专业服务并非固定。支持套利意味着经纪人拥有从多个机构中选择服务的灵活性。例如，云代理可以利用信用评分支持来量化并选择得分最佳的服务。


    云审计员可能会使用 CP 评估提供的服务，涉及安全控制器、隐私影响、功能等方面。审计员是一个独立实体，可以确保 CP 符合某些标准。图 2.5 展示了这些“参与者”之间的连接。


    云用户可以直接向 CP 提出云解决方案请求，或通过云代理提出。云审计员进行独立审计，并可能需要联系其他方以收集必要信息。此图展示了


    ![](img/625475237d5c9b4148fda1077938a911_46_0.png)


    图 2.5. 云“参与者”连接


    云网络问题涉及三种不同的网络类型。对于云制造商而言，系统结构是标准大型信息中心的结构，由高性能服务器和存储装置组成的机架，通过高速机架顶层以太网交换机连接而成。业务网络可能具有不同的结构，通常包括许多局域网（LAN）、服务器、工作站、个人电脑和移动设备，使用各种网络功能、安全和管理工作负载。消费者和生产商关于云提供商的关注点（该提供商可与许多客户共享）在于创建虚拟网络的能力，以及相应的
    SLA 和安全保证。


    ## 2.10. 云提供商架构组件


    图 2.4 显示了 CP 的四个主要架构组件。服务编排是指程序组件的组合，用于支持 CP 在结构、协调和管理计算资源方面的操作，以向云消费者提供云服务。编排被展示为三层架构。在此处我们看到资源抽象层将物理资源简单映射到消费者可见的服务。资源抽象元素的示例包括软件元素，例如，hypervisors、虚拟机、虚拟信息存储以及其他计算资源抽象。云服务管理包含与服务相关的各项功能，这些功能对于管理和运营云客户需要或提议的服务至关重要。它涵盖三个主要领域：


    **业务服务**：这包括处理与客户端相关的业务服务，如簿记、计费、报告和审计。


    **供应/配置**：这包括用于向客户快速部署云系统的自动化工具，调整资源和配置分配，以及跟踪和报告资源使用情况。


    **可移植性/互操作性**：消费者关注鼓励数据和系统可移植性以及服务互操作性的云产品。这在混合环境中非常有用，因为在混合环境中，消费者可能希望改变本地和异地站点之间信息和软件的分配。


    安全是贯穿此参考架构所有层面的问题，范围从物理安全到应用安全。因此，这是所有云“参与者”的共同责任，而不仅仅是 CP。隐私同样涵盖此参考架构的所有层面。关于隐私的关键要求是，CP
    必须提供对个人身份信息（PI）和个人可识别信息（PII）的充分且有保障的保护。


    ## 2.11. ITU-T 云计算参考架构


    查看另一种参考结构是有益的，该结构发表在 ITU-T Y.3502 中（国际电信联盟 2014）。与 NIST 结构相比，该架构的范围略广，并视其为分层功能架构。


    ### 2.11.1. 云计算“参与者”


    在查看四层基准架构之前，我们需要了解 NIST 和 ITU-T 在定义云“参与者”方面的差异。ITU-T 文档将三个“参与者”定义如下：


    -   **云支持客户或消费者**：利用云解决方案的一方，处于业务关系中。这种业务关系是通过使用云服务提供商或云支持伙伴来建立的。


    云支持客户的关键操作包括但不限于：利用云解决方案、执行公司管理以及管理云解决方案的使用。


    -   **云服务供应商**：提供云服务的一方。云服务提供商的目标任务是提供云服务所必需的任务，以及确保向云服务客户交付云服务所必需的操作，外加云支持维护。云服务提供商包括一套全面的活动（例如，提供服务、部署和跟踪服务、处理业务计划、提供审计信息等），以及许多子角色（例如，公司经理、服务经理、网络提供商、安全和风险经理等）。


    -   **云服务伙伴**：参与云服务提供商或云服务客户端的活动，或兼有两者的一方。云服务伙伴的活动取决于伙伴的类型及其与云服务提供商和云服务客户的关系。云服务伙伴的例子包括云审计员和云支持代理。


    因此，云服务伙伴结合但不限于 NIST 中代理和审计员的功能。图 2.6 描绘了云生态系统中的主要“参与者”及其可能的部分角色。


