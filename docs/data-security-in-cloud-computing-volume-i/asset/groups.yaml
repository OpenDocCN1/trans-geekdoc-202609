  mdcn: "\n\n## 图 3.2. 用户、客户端机器与云服务器的流程\n\n![](img/625475237d5c9b4148fda1077938a911_58_0.png)\n\
    \n操作系统层面的漏洞也可能危及云安全。操作系统也容易受到竞态条件相关漏洞的影响，例如 TOCTOU（检查时到使用时的时间窗口）漏洞。\n\nTOCTOU\
    \ 漏洞产生于在评估状态（如安全凭证）及其检查结果的使用过程中，方法发生了变化。TOCTOU 由检查阶段组成，该阶段确定不变的前置条件（例如，可访问性许可），以及使用阶段，该阶段假设不变条件仍然有效并对对象进行操作。TOCTOU（检查时到使用时，由检查条件与检查结果使用之间系统变化引起的软件缺陷类别）通常发生在\
    \ SETUID（执行时设置用户 ID）程序中，这些程序拥有管理员权限，但可能被无特权用户调用；因此，进程可以代表用户执行任务。举例来说，打印应用程序通常具有\
    \ SETUID-root 权限以访问打印机设备，这可能是一项需要管理员权限的操作。以用户身份运行时获得 root 权限，打印应用程序随后通过工作系统的可访问性目的，检查调用其实现的个人是否有权读写特定文件。操作系统以交错方式实现进程，因为操作系统在每个\
    \ CPU 上每次只调度一个过程。因此，方法在 CPU 上从开始到结束执行时会被中断。\n\nCPU 在一段时间内执行某个技术，然后操作系统暂停当前过程并恢复被暂停进程的执行。假设图\
    \ 3.3 中给出的代码所在的系统在允许访问获取文档 `/home/Mark/symlink` 后、在实现 `open()` 之前被冻结。然后假设攻击者的过程被选中执行并将链接更改为指向\
    \ `/etc/passwd`。当初始进程再次运行时，它将会启动一个它没有许可执行的文件（`passwd`）。\n\n```c\nif (access(\"\
    /home/username/symlink\", R_OK | W_OK) != -1)\n{\n    // Symbolic link can change\
    \ here\n    f = fopen(\"/home/username/symlink\", \"rw\");\n    ...\n}\n```\n\n\
    ## 图 3.3. 代码\n\n操作系统也容易受到恶意扩展和驱动程序的安装影响。内核扩展，特别是设备驱动程序，现在构成了当代内核代码基础的重要组成部分（在\
    \ Linux 中大约占 70%，在 Windows 中占比更高）（Kadav 和 Swift, 2012）。大多数这些扩展旨在允许机器使用日益多样化的 I/O\
    \ 设备进行通信，而无需重启或重新编译操作系统。但由于它们以最高权限级别运行，且可能是恶意的或存在漏洞，因此对系统可靠性构成危险。检测恶意扩展非常困难，文献中的大多数建议并未取得成功。\n\
    \n由于云计算依赖于虚拟化技术，来自虚拟机监控程序（hypervisor）和虚拟机（VM）图形的漏洞也可能破坏安全性。虚拟机监控程序复杂代码中的任何错误或缺陷都可能危及位于同一服务器上的\
    \ VM 之间的隔离。云计算容易受到系统漏洞的影响，导致一个服务器的 VM 入侵另一个服务器，以及 VM 快照和回滚方面的缺陷（Hashizume 等, 2013）。关于特定于计算的信息存在许多漏洞。数据可能会分布在具有不同数据所有权法律的各种国家（Ertaul,\
    \ Singhal 和 Gökay, 2010）。此外，如果数据在删除或移动后未从二级存储中充分消除，可能会发生数据泄露（Hashizume 等, 2013）。在设计层，正如在传统计算系统中一样，云计算更容易受到硬件木马的攻击，它们在门级呈现出恶意行为（Tehrani,\
    \ Salmani 和 Zhang, 2014）。\n\n在网络层，云计算也容易受到系统协议中漏洞的影响，通常导致拒绝服务（DoS）攻击，例如 TCP SYN\
    \ 泛洪，其中攻击者发送超过服务器能处理的链接请求数据包（SYN 数据包），从而使服务器对合法客户不可访问（Kurose 和 Ross, 2012）。\n\n\
    如果应用于云环境，有许多安全机制可以帮助缓解前一节中描述的许多漏洞。在本节中，我们分享其中的一些，包括信息和虚拟化安全机制。\n\n加密常用于保护云信息的机密性。它包括使用数学方法和秘密密钥（称为加密密钥）对数据进行转换（编码）。加密的数据只能使用解密密钥显示给授权方。\n\
    \n加密防止攻击者在数据保存在数据中心时以及在网络传输过程中窃听云敏感信息。对称加密使用相同的密钥来加密和解密信息，使其算法与相应的非对称算法相比更简单。保护级别取决于密钥的长度。Laura\
    \ 首先使用 Mark 的公钥对明文消息进行加密，该公钥是公开的，任何人都可以访问。例如，Mark 会将其公钥发布在其业务或免费网站的目录中。Mark 还拥有一个仅对他已知的私钥，该私钥与其公钥不同。换言之，使用公钥加密的明文信息只能使用相应的私钥解密。非对称加密可用于解决对称加密中的密钥分发问题，并作为实现数字签名的机制。\n\
    \n电子签名是一种使实体保证消息有效性的方法。数字签名必须实现不可否认性；也就是说，当事方将有效签名应用于消息后，很难否认该签名。\n\n非对称加密通常用作云环境中的数字签名机制。在公钥/私钥加密中，使用某人的私钥加密的信息只能用该人的公钥解密。因此，例如，如果\
    \ Mark 获得 Laura 的公钥并希望在网络中发送的文档（通常是不可信站点）中获得她可靠的数字签名，他可以要求 Laura 使用她的私钥对信息或记录进行“签名”或加密。如果\
    \ Mark 能够使用 Laura 的公钥解密信息，他可以确信只有 Laura 才能加密该记录，因为她知道她的私钥。现在让我们考虑云环境中的常规 Web 应用程序。SSL\
    \ 是一种使用加密来保护两台服务器之间数据传输的网络协议。要理解 SSL 对 Web 应用安全的重要性，请想象一种您希望从 Amazon 购买书籍的情景。\n\
    \n当您在网站上浏览时，您的互联网浏览器与 Amazon 服务器都通过常规 TCP 协议连接。使用这种连接，您的浏览器（即正在搜索的物品）与 Amazon\
    \ 服务器（即关于 Amazon 产品的数据）之间交换的信息未加密。由于此通道未加密，位于本地网络上的攻击者可能利用网络嗅探应用程序来检查您的浏览器与 Amazon\
    \ 服务器之间交换的原始系统数据包中的信息。例如，攻击者可能会得知特定机器的用户对关于尤利乌斯·恺撒的小说感兴趣。\n\n当然，用户应阻止攻击者能够“嗅探”其敏感信息，如信用卡号和送货信息。例如，用户可能错误地输入了\
    \ Amazon.com，并可能与伪造的服务器进行通信。因此，用户还必须确保承载信息的服务器是 Amazon.com。\n\nSSL 协议通过采用加密程序来隐藏从一台计算机到另一台计算机传输的内容，并应用身份验证方法以确保浏览器正在与之通信的计算机是可靠的，从而满足这些需求。换言之，使用\
    \ SSL 从 Amazon 购书，用户可以确信攻击者不会发现其/她的信用卡信息，并且任何共享数据都仅与真正的 Amazon.com 进行交易。如图 3.4\
    \ 所示，一旦用户与 Amazon.com 创建货币交易，浏览器和主机便在 HTTP 下建立 SSL 连接（https）。请注意锁形图标出现，显示这是一个可靠连接。还要注意它读取的是\
    \ https 而不是 HTTP。当用户在电子商务服务器（例如 Amazon）上点击登录或登录按钮后，其浏览器和主机将通过“握手”建立 SSL 连接，然后进入另一个身份验证阶段。在握手阶段，浏览器和服务器就特定的加密算法达成一致，主机向客户发送证书。该证书是由受信任的证书颁发机构（CA）签发的一段信息，它将加密公钥绑定到特定实体（例如\
    \ Amazon.com），旨在验证主机是否确实是其所声称的身份。\n\n"
