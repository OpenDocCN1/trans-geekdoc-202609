  mdcn: '

    在面临实际威胁场景时，其影响将比通常的IT系统和分散系统中发生的情况更加显著，波及更大规模的 infrastructure（基础设施）、服务以及使用它们的人群。因此，我们认为，尽管我们已经安全地完成了资源扩展，但云计算方法中仍残留着安全性、隐私性以及信任方面的问题。


    云计算的下一个特征是结构。云计算方法通常为其客户保证逻辑隔离和物理隔离，因为它们在利用相同的云支持时往往共享物理工具。然而，当讨论同一物理机器上的计算工具（可能使用云解决方案或虚拟机
    VM）时，实现物理隔离是相当困难的。因此，大多数云提供商（CP）试图为其客户提供可行的合理隔离。在这种场景下，存在无法以传统方式解决的隐私、安全性和信任问题。因此，在这些情况下需要新的对策。根据
    ISO 27001 标准，危害是一种可能的事件。当危害变成实际发生的事件时，可能会导致不良事件的发生。之所以称为不良事件，是因为该事件可能会损害公司或某种方法，导致安全事故和/或用户隐私泄露。


    本章介绍的分类方法使用了三种不同的类别：与基础设施相关的危害、与服务提供商相关的危害，以及通用危害。这种分类的主要目的是通过指出发生的关键问题，从而在安全相关问题中减轻云管理员的负担，进而为他们节省金钱和时间。为了能够制定适当的分类，提供正确的信息以理解随云计算方法新兴技术而来的危害至关重要。在通过详细描述这些针对云环境的已识别风险来引入建议的分类之后，我们将提供每个类别中识别出的危害的整体概况，并提供关于可用于发现和预防每种危害的对策的建议。


    ## 6.2. 理解威胁


    在引入危害分类之前，理解相对于传统IT系统或分布式系统中遇到的新危害而言其独特性非常重要。为了使我们的工作更加轻松，我们将使用两个安全组织提供的信息，即欧洲网络与信息安全局（ENISA，2009）和云安全联盟（Cloud
    Security Alliance，2011）的人员。多年前，ENISA 发布了一份题为*云计算方法中的安全*的问卷调查。该调查始于评估云计算方法的优点。但是，尽管在规模和资源集中方面存在优势，就最佳安全危害而言，显然其缺点多于优点。同一项调查将危害分类，分为组织和策略危害、技术威胁、法律威胁以及非云特有的危害。每个危害都被分配了一个从低到高的层级，可以根据其可能性、影响、脆弱性以及受影响资产进行描述。


    必须强调的是，非云特有的风险仅包含一个类别，因此比其他类别少。因此，云计算方法的兴起吸引了一整套此前未知的全新安全威胁。这组安全威胁描述了缺乏隔离这一现象，即持续性经济拒绝服务（EDoS），它描述了云计算系统在一个客户功能中对计算工具的耗尽。另一个值得注意的情况是恶意软件——这是在云计算方法的背景下重新定义的理论，再次表明非云特有的漏洞少于云系统本身创建的漏洞。


    云安全联盟证实，尽管IT技术和云技术在安全控制方面存在相似性，但在公司可能面临的危害方面，两者之间存在许多差异。CP 使用运营版本，而这些背后的技术可能是新危害的来源。在云支持版本中，供应商和客户的安全责任之间可能存在空白。此外，由于
    CP 的目标是价格效率，即实现规模、重用和标准化，它们最终会到达安全机制失去灵活性的地步。


    ENISA 和云安全联盟关注使用云系统的安全用户，这些用户可能会与客户一起成长为最大的威胁，特别是那些拥有更高特权的用户。与传统的 IT 解决方案相比，对云表面的攻击已扩大，这不仅因为共享资产，还因为对手可以利用云基础设施中虚拟机（VM）、云控制系统或其他任何组件中可能存在的漏洞，使用额外的攻击向量。


    根据 Xiao 和 Xiao (2012) 的研究，就信息平台的“内部人员”（insider）一词而言，它适用于任何拥有已接受的数据系统及其服务和任务的访问权限、自由或理解的人。恶意内部人员是指那些受动因驱使，通过各种破坏信息保密性、伦理和可访问性的活动，利用其特权对公司任务产生负面影响的人。同样，对于云计算，内部人员被视为一个实体，其定义为：


    - 在你的云服务器上工作

    - 拥有进入云工具的权限

    - 使用云托管解决方案


    因此，云内部人员（图 6.1）主要是特权用户，他们可能被引诱去破坏其云基础设施的安全性。他们的活动可能导致暂时的中断、有效用户隐私的泄露，或者根据他们的权限导致所提供服务的永久中断。需强调的是，与虚拟机相关的信息，例如正在构建以与其内部通信的一个提供虚拟机进行通信的虚拟系统架构，可能仅由特权用户表达，并通过攻击的后续步骤进行操作。为了实现这一点，恶意用户可能试图映射所有可用的虚拟机并提取额外的虚拟机相关数据（Xiao
    和 Xiao 2012），以突破云安全或侵犯用户隐私。


    ![](img/625475237d5c9b4148fda1077938a911_128_0.png)


    云内部人员主要是特权用户，他们可能被引诱去破坏其云基础设施的安全性


    ## 6.3. 分类与对策


    为了简化对云计算所面临安全威胁的研究，需要对已知的危害（ENISA 2009）进行分类。我们对此类分类的建议使用三个主要类别：


    - 与基础设施和服务器相关的危害，影响整个云基础设施。

    - 与服务商相关的危害，可能影响在云中寻求代理服务的消费者。

    - 可能影响基础设施和服务提供商或客户的通用危害。


    必须强调，本章其余部分中所有关于危害评估工具的提及并不意味着对策；相反，可以针对每种危害采用特定流程来识别正确的对策。


    ### 6.3.1. 招聘与主机威胁


    云计算中的所有危害都可能与整个云基础设施相关，或者它们是云特有的。在这两种情况下，其重要性都很高。因此，它们可能对系统以及个人生活造成灾难性的后果。这种未经授权的物理访问可能会危及系统的装置和设备，并可能导致长时间的服务拒绝（DoS）。风险评估工具，如
    CRAMM 和 Octave（Caralli 等人 2002；Yazar 2002），可以防止此类问题，并应在云系统发展的第一阶段予以考虑（ENISA 2009）。


    在许多场合，员工对云系统构成严重危害。培训不足或疏忽与普通员工不一致和不规律的活动密切相关。此类活动可能涉及意外丢失或删除其备份信息以及操作或安全日志。


    风险管理策略结合全面安全政策的演变，可以预防类似事件的发生。这些步骤有助于员工遵循流程常规，从而显著降低造成关键且不可恢复错误的可能性。


    利用垃圾中位置的信息没有局限性。有时，在垃圾中提取的数据对于计划攻击云系统的人来说可能很有价值。信息泄露也可能被恶意用户利用，希望实施社会工程攻击或缓解更危险的状况。每个组织都必须制定/建立关于敏感数据生命周期及其安全的政策，并应确保员工无例外地严格遵守这些政策（Krutz
    和 Vines 2010）。


    这种类型的攻击需要多次尝试（暴力破解攻击），因此通过限制无效密码尝试，相当容易阻止（Krutz 和 Vines 2010）。


