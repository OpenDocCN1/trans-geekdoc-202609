    Besides the downgrading of the reliability guarantee, the second strategy is also
    more time consuming due to the numerous rounds of communications needed among
    CSPs to complete the protocol. The STRE (storage and retrieval mechanism) empowers
    cloud users to disperse and search their encrypted data in CSPs living in multiple
    clouds while obtaining reliability. The STRE mechanism follows a similar spirit
    to the second naïve approach and proposes more efficient secret sharing-based
    protocols. Moreover, the STRE mechanism also has better protection on the consumer''s
    search pattern. Especially, many works (Curtmola et al. 2006; Kamara, Papamanthou,
    and Roeder 2012) on searchable encryption would completely disclose the consumer''s
    search pattern which indicates whether two hints are for the same query keyword
    or not. From the STRE mechanism, this type of pattern escape risk is decreased
    because the search is conducted on a dispersed basis and the search routine will
    be revealed only if higher than t CSPs collide.


    An overview of the STRE mechanism is given below. The STRE mechanism is composed
    of three significant phases: the setup phase, the storage phase, and the recovery
    phase. During the setup phase, a master secret key is generated from a security
    parameter and delegated to the cloud user. During the storage period, the user
    requires a group of input files and the master secret key and creates a set of
    file shares and a file index. The file shares and document indicator are uploaded
    to the corresponding CSP. The recovery phase is to search the files containing
    a particular keyword.


    The user generates a set of trapdoor shares based on the query keyword and his
    or her master key. The trapdoor discussion is delivered to the various CSPs—the
    consumer. Last, the user reconstructs and decrypts the results and gets the files
    that are clear, each of which contains the query keyword.


    # 3.5. CLOUD ACCOUNTABILITY


    One of the primary motives underlying cloud computing methods is the chance to
    outsource complicated computation and to save large quantities of information.
    But to this date, customers have few, if any, specialized techniques to check
    resource consumption and data storage status, as soon as they are “sent” to the
    cloud providers. Cloud suppliers do not allow users to observe their inner workings,
    and consumers have no reliable information about their information whereabouts
    or the status of their actual computation. While encryption can guarantee the
    confidentiality of outsourced data, and access control may enhance these guarantees
    by controlling who is accessing what percentage of data (or, more generally,'
  - '[PAGE 70]


    resources), ensuring the integrity and confirming how much data is being used
    is hard. To deal with these issues, accountability is an important security condition
    in cloud technologies. Accountability aims at supplying a detective, rather than
    a preventive remedy to cloud users (Ko et al. 2011).


    The goal is not to protect data privacy or control resource use, but instead to
    confirm who has got access to resources, and also how. Based on Ruebhausen and
    Reich (Ruebhausen and Reich. 2013), cloud liability can help “make data processing
    from the cloud more transparent,” so that “seized data-lifecycle events can be
    matched against policies in Tests and thereby show the customer, that his information
    is handled appropriately.” Unlike privacy protection technology, which is built
    on the hide-it-or-lose-it perspective, accountability focuses on keeping the information
    usage transparent and trackable.


    Traditional liability methods focus on information collection and postmortem analysis,
    and third-party audits. Usually, an accountability system will include data collection,
    through log group and event monitoring, followed by auditing and evaluation of
    the accumulated evidence to detect potential anomalies or to check actual data
    lineae. However, as stated by Ko et al. (2011), cloud computing''s guarantee of
