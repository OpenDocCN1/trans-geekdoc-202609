    # 云计算中的数据安全问题，第一卷


    # Giulio D’Agostino


    由于其经济性、可靠性、可扩展性以及保证的服务质量等优势，云计算已被许多组织和个人采用。读者将学习软件即服务 (SaaS)、平台即服务 (PaaS)、基础设施即服务
    (IaaS)、服务器和桌面虚拟化等具体细节，以及更多内容。


    本书不仅涵盖云计算中的信息保护、架构和基础，还涵盖了迁移现有应用程序到云端所需的计划设计和深入实施细节。读者将对云计算工程有更深入的理解，并了解如何在快速获得其利益的同时降低
    IT 实施风险。本书的内容非常适合希望迁移到云端的用户、寻求了解云基础知识的 IT 专业人员，以及将构建用于测试目的的云解决方案的计算机科学学生。


    **Giulio D’Agostino** 是一名系统管理员、企业家和网络安全顾问，拥有超过二十年的云计算、软件即服务和出版领域经验。他曾受雇于 Google、Apple、Hewlett
    Packard 和 Salesforce.com，并在丹麦技术大学 – DTU、Griffith College Dublin、Web Summit 2016/2017
    讲授课程，曾作为爱尔兰科技新闻的撰稿人，目前担任基于 SaaS 和云连接的远程连接服务公司 LogMeln Inc. 的系统管理员。


