    3.  **SaaS（软件即服务）**：赋予消费者的能力是使用运行在云基础设施上的提供商软件。应用程序可以通过诸如 Web 浏览器（例如在线电子邮件）等瘦客户端界面从多个客户端设备访问。用户不控制或管理内部云基础设施（包括网络、服务器、操作系统、存储，以及单个程序功能），但可能例外于有限的用户特定应用程序配置设置。


    ISO/IEC JTC1 SC38 WG3 和 ITU-T 还开发了一种源自 NIST SP 800-115 的云计算分类法：国际标准 ISO/IEC 17788，建议
    ITU-T Y.3500 信息技术——云计算——概述与词汇。云计算的初始概念和许多术语在 NIST 和 ISO/IEC 标准之间大多可以互换。但由于 NIST
    的云计算定义可用时间更长，且构成了 ISO/IEC 标准所表征的核心概念，因此本书引用的是 NIST 的定义。这三种云服务模型具有以下能力：


    -   IaaS（基础设施即服务）使云消费者能够在云供应商提供的硬件和资源抽象层（管理程序）上运行其选择的几乎任何操作系统和软件。消费者的操作系统和软件可以迁移到云供应商的硬件中，从而可能取代组织的数据中心基础设施。

    -   PaaS（平台即服务）允许消费者构建其云应用程序。云供应商保留一个虚拟环境和一组资源，以便创建新的 Web 应用程序。

    -   SaaS（软件即服务）使云消费者能够运行在线应用程序。现成的程序通过互联网访问。云提供商拥有软件，消费者在各方签署协议后被授权使用以下服务。


    总之，云计算提供了一种便捷、按需的方式，用于访问可配置资源池（例如网络、服务器、存储、程序以及解决方案），使用户能够以任何设备、在任何时间、任何地点，以灵活的方式按需开发、托管和运行应用程序和服务。


    NIST 还是第一个指定与技术无关且与实现无关的云计算参考架构（RA）（NIST SP 500-292）的机构，该架构确定了最关键云参与者及其功能，以及管理并提供云解决方案所需的主要架构元素（例如服务部署、服务编排、服务管理、服务聚合）。


    源自 NIST SP 500-292，ISO/IEC JTC1 SC38 WG3 以及 ITU-T 还开发了一项基准架构标准：国际标准 ISO/IEC 17789
    | 建议 ITU-T Y.3502 信息技术——云计算——参考结构，该结构描述了云计算参与者，重点关注云提供商和云客户，同时将其余云参与者归入另一个云合作伙伴类别中。云参考架构加上云分类法是基础性文件，它们协助云计算利益相关者沟通概念、结构或操作和安全需求，这仅是其优势中列举的一小部分。如前所述，云参考架构是一个通用的、高层次的概念设计，有助于理解云计算的操作复杂性。该参考架构并不代表特定云计算系统的系统结构；相反，它是一个使用共同参考框架来描述、讨论和创建系统特定架构的工具。


    图 5.2 中描绘的架构不绑定于任何特定厂商的产品、解决方案或基准实现，也不提供规定性解决方案。参考架构定义了一组云参与者及其活动和功能，这些可用于编排云生态系统。云计算参考架构与一些配套的云计算分类法相关，并拥有一套描述和视图，这是讨论特性、应用程序和标准的基础。


    ## 云服务模型


    ![](img/625475237d5c9b4148fda1077938a911_101_0.png)


    此外，NIST 参考架构图表解释了云生态系统中每个云参与者的整体活动。该参考架构旨在帮助理解计算的操作复杂性。它不代表特定云计算系统的系统结构；相反，它是一个利用标准参考框架来描述、讨论和开发特定系统架构的工具，我们打算在后续关于云环境中关键管理问题的讨论中利用这一点。为了增强
    NIST SP 500-292 云参考架构，NIST 在 NIST SP 500-299（云安全参考结构）中确定了两种类型的云经纪人：


    -   商务经纪人，以及

    -   技术经纪人。


    为了增强 NIST SP 500-292 云参考架构，NIST 在 NIST SP 500-299（云安全参考架构，见图 5.2）中确定了两种类型的云提供商，以及属于提供商职责范围内的关键管理功能。根据云服务架构方面的不同，这些功能可能需要在这两种供应商之间进行划分。从云客户的角度来看，这种划分是不可见的。主要提供商提供由其拥有的基础设施托管的服务。它可能通过第三方（如经纪人或中间提供商）向客户提供这些服务，但主要提供商的
    defining 特征在于它不从其他提供商获取其支持服务的来源。中间供应方可以在不向主要提供商提供可见性或透明度的情况下与其他云提供商互动。中间提供商使用主要提供商提供的服务作为其服务的不可见元素，并将这些服务作为整合产品呈现给客户。从安全角度来看，关键提供商所需的所有安全服务和组件，中间提供商同样需要（NIST
    2011b, 2013）。


    公司经纪人仅提供公司服务和连接服务，不接触云消费者来自云的数据、操作或制品（例如图片、卷、防火墙），因此无论云结构如何，在执任何关键管理功能方面均无责任。相反，技术中介确实与客户资产互动；专业经纪人聚合来自多个云供应商的服务，并通过固定单一入口点和互操作性问题来提供一层技术功能。专业云中介有两个关键
    defining 特征，使其区别于中间提供商：


    1.  能力：向众多不同的提供商提供单一一致的接口（用于业务或技术功能），以及

    2.  中介允许对后台谁在提供服务具有清晰的可见性，而中间提供商不提供这种透明度。


    由于技术经纪人允许这种清晰的可见性，客户知道哪些云容量是由专业中介使用的，哪些是由与技术经纪人合作工作的云提供商提供的。


    这种情况与涉及中间供应方的情况不同，因为中间供应方是不透明的，消费者 unaware 关键管理功能（在适用时）如何在中间供应方和主要供应方之间分割。


    ## 5.2. 云安全基础


    云计算提供了具有显著成本节约的合作关系，既涉及资本支出（CAPEX），也涉及运营费用（OPEX），并且还允许利用尖端技术来满足数据处理需求。在云环境中，安全和隐私是所有云参与者的跨领域关注点，因为它们涉及云计算参考架构的大多数层级，并影响许多云服务支持环节。因此，与云服务相关的这些资源的安全管理是计算的一个重要方面。在云环境中，你会发现安全威胁和安全需求因不同的云安装模型而异，同时针对此类威胁的重大缓解措施以及实施安全控制的云责任取决于所选的支持模型和已选择的服务类别。


    许多安全风险可以通过应用标准安全程序和机制来缓解，而有些则需要云特定解决方案。由于云计算参考架构的每一层可能具有不同的安全漏洞，并且可能面临独特的威胁，因此云启用服务的结构直接影响其安全地位以及系统的关键管理方面。


