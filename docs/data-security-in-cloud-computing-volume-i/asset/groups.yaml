  mdcn: "\n\n## 4.2. 云存储前提条件\n\n云服务商根据客户的要求提供大量可访问的存储空间选择。客户可能只需要几吉字节的存储，也可能需要数万太字节的存储，并按月或年支付费用。云存储服务商可能会提供额外的服务与功能，这些会直接影响客户对服务商的选择。例如，有些服务商提供灵活的存储方案，且不设存储能力上限；而其他变量也可能影响客户的选择。举例来说，数据访问的适应性至关重要，一些云存储公司提供了通过智能手机访问云解决方案的功能；对于需要员工通过不同技术获取服务的业务而言，这可能是一个关键因素。\n\
    \n## 4.3. 云操作系统前提条件\n\n云操作系统是专为在云计算环境中运行而设计的操作系统。一些客户需要在特定计算环境中运行云操作系统；另一些客户则可能使用预装了服务和软件的云操作系统。通常，云操作系统必须安全且经济地运行软件和硬件工具，以确保解决方案的最佳交付。基于浏览器的云操作系统是指仅通过网络浏览器获取的操作系统。只要系统包含互联网浏览器（如智能手机），这一特性也允许在各种类型的设备上运行特定操作系统。云计算操作系统被视为\
    \ SaaS（软件即服务），因为基于浏览器的云操作系统是应用作为云客户操作系统运行的安装形式。云操作系统和基于浏览器的云操作系统往往容易混淆。一些客户需要基于浏览器的操作系统提供可管理的系统，以便按组或用户授予权限和解决方案；其他客户可能要求基于浏览器的操作系统提供工具、应用程序或面向网络用户的\
    \ VoIP（网络电话）解决方案。\n\n## 4.4. 内存前提条件\n\n成功的内存管理被认为是云计算系统中的重要问题之一，其中按需资源分配必须确保云资源使用的经济性。内存应在需要时可用，而不是被分配后却未被使用而造成浪费。亚马逊\
    \ EC2 被认为是该云领域更高效的实现之一，其中 EC2 云会按需分配资源。存在许多内存控制方法，可以管理多个虚拟机之间的资源共享，例如虚拟交换管理机制（VSMM）。\n\
    \n## 4.5. CPU 前提条件\n\n当客户计划采用云技术时，所需的 CPU 算力必须由消费者提供。比较现代程序的 CPU 算力可能非常困难。因此，一些云服务商提供标准化的\
    \ CPU 单位，每个 CPU 单位相当于 1 GHz CPU 的某些处理性能。举例来说，一个拥有四个 CPU（每个四核）、运行频率为 2 GHz 的系统，将拥有\
    \ 32 个 CPU 单位。标准化的 CPU 单位有助于客户正确规划资源分配和能力。云服务商通常根据 CPU 使用量或时间向客户收费。\n\n![](img/625475237d5c9b4148fda1077938a911_93_0.png)\n\
    \n## 4.6. 软件前提条件\n\n通过云管理程序可以实现工具的最佳利用，以及它们与客户和解决方案的交互。云管理应用程序是设计用于跟踪和运行云端服务、应用和数据环境的软件。\n\
    \n采用云计算解决方案的决定必须经过云客户的仔细考量。云计算提供了许多吸引人的替代方案，但无论当前有多少企业采用了云选项，这些选择对客户而言不一定有益或合适。云解决方案对一些公司可能是建设性和有益的解决方案，但对其他人则未必；因此，在做出选择之前，理解云计算的利弊至关重要。\n\
    \n如果得当实施，云选项通常可以降低运营成本并非常经济。云计算可以降低云客户的硬件和支持需求。云计算提供自由度，因为客户可以在任何地方访问资源和服务。云计算支持机构之间的合作。云计算可以为灾难恢复和备份程序提供优秀选项。云计算提供高度可扩展和动态的资源。云计算存在许多安全漏洞。采用云服务的组织需要拥有可靠的网络连接，以确保云解决方案的正确交付，并且通常组织无法承受长时间的停机。一些云服务商可能会停止运营。与一些云服务商可能出现隐私、数据位置和合规性问题。组织技术与云服务商之间可能会出现兼容性问题。\n\
    \n云计算带来了许多安全风险。这些风险由云安全联盟（CSA）确定，该联盟是一个非营利组织，旨在指定云计算安全建议的参数（Samson 2015）：\n\n\
    - **数据泄露：** 攻击者可以利用设计不良的数据库，并可能获取每个客户的数据。\n- **信息减少：** 许多问题都可能导致信息丢失，例如攻击者、疏忽的提供商或危机。\n\
    - **账户或服务流量劫持：** 攻击者可以在该领域进行多种恶意活动；以下是一些案例：\n  - a. 获取客户凭证\n  - b. 操纵信息\n  - c.\
    \ 将客户重定向到不道德的网站\n  - d. 在客户系统中创建新的基础以发起其他攻击\n- **不安全的接口和 API：** IT 管理员依赖端口进行云端监控和管理。API\
    \ 对一般云提供商的安全性和访问至关重要。因此，事实证明，第三方以及在某些事件中的各方正在建立这些端口并注入广告解决方案或额外应用程序。\n- **拒绝服务（DoS）攻击：**\
    \ DoS 攻击可能导致对一个或多个解决方案的访问问题。DoS 攻击可能给客户造成重大损失。\n- **恶意内部人员：** 这可以是云服务商内部受雇的员工或承包商，他们怀有恶意意图，可能会给客户和云服务商造成伤害。\n\
    \n一些云滥用示例：\n\n- a. 客户利用云支持来破解一个在本地计算机上过于难以破解的加密密钥。\n- b. 客户打算发起 DoS 攻击，将恶意软件或其他禁止行为传播到非本地基于云的网络上。\n\
    \n在采用云解决方案之前，组织需要了解和确定云计算的安全风险，并就企业是否应使用云技术做出合乎逻辑的选择。这应包括云计算如何提供最佳效益，以及必须采取哪些安全措施。\n\
    \n在向云服务商交付模型的每个阶段都存在常见的技术漏洞，其中受损的部分（如应用程序、阶段或基础设施）可能会影响整个网络。与数据所有权、共享访问、隔离失效和虚拟分发相关的其他类型安全风险也存在。\n\
    \n尽管存在重大且多样的安全风险，但这不应阻止企业拥抱云计算的诱人优势。应考虑到安全风险并加以防范。云计算现在是一个价值数十亿美元的行业，许多企业、组织和合作社已采用云计算解决方案和优势（Durbanoe\
    \ et al. 2010; Trivedi and Pasley 2012; Beal 2018; Agape Consulting Group 2016）。客户应认识到不存在绝对安全的网络，但云计算的安全漏洞可以被减轻，以达到良好的安全水平。客户可以采取以下措施：\n\
    \n1. 识别进入云端的风险\n2. 制定优秀的合规、安全和隐私政策，并确保相关方参与覆盖范围\n3. 评估客户和云服务商的安全责任\n4. 确保对运营解决方案进行审计\n\
    \n"
