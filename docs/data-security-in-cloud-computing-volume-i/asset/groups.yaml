    和 Lo Iacono，2009；Jensen 等人，2009）。这种操纵可能导致翻译，从而执行被禁止的代码。鉴于这些攻击非常常见，且在大多数情况下易于利用，云供应商应从一开始就考虑部署对策和安全方案（Grobauer,
    Walloshek, 和 Stöcker，2011）。


    ## 6.11. 客户疏忽与云安全


    云客户未能妥善保护其云计算环境，使得恶意用户能够攻击云系统。客户必须认识到他们必须保护其信息和资源。有时，云客户错误地假设供应商有责任保证信息的安全。这种类型的威胁无法通过审计或其他措施来解决。即使客户不遵守正确的流程，每个公司也应始终保持高安全标准（ENISA
    2009）。


    正确方向上的一步是通过包含管理大量虚拟机的客户端界面，并加强整体云系统的运行（ENISA 2009）。正如 Cheng 等人所建议的，定期更新浏览器和在多个虚拟机中安装各种类型的入侵检测系统（IDS）可以减轻这种危险（Cheng,
    Roschke, 和 Meinel，2009；Roschke, Cheng, 和 Meinel，2009, 2010）。


    ## 6.12. 治理能力的降低


    正如前面所述，云客户使用的安全方法与其 CP 的指导原则存在显著偏差。这种矛盾可能导致控制和治理的减弱，从而对云系统及其数据产生不利影响。为此，每个 CP
    应继续使其客户了解透明且严格的安全程序和指示，同时，在外包情况下，合作伙伴的服务必须与这些指示/策略保持一致（ENISA 2009）。


    ## 6.13. 常见风险


    这是前面的威胁类别。它是一组可能影响基础设施和支持提供商/客户的危险。在发生安全违规时，云环境将面临重大影响。


    攻击者可能会冒充（例如，通过电话或电子邮件）经理、首席技术人员或其他关键实体，以诱取机密信息，这些信息可被用于直接或间接地攻击机器。此类建议可能包含密码、媒体拓扑、使用的软件和
    hypervisor 变体以及许多其他内容，这可能为攻击者提供建立攻击所需的知识。社会工程攻击可以通过严格的程序以及当然通过审计来缓解，审计在防止此类攻击中发挥着不可或缺的作用（Cloud
    Security Alliance，2010；Orgill 等人，2004）。


    来自其他攻击的危险在于其能力：(a) 以“分散”的方式在整个网络上部署武器，以及 (b) 聚合这些力量以产生压倒性的流量。分布式拒绝服务（DDoS）攻击正在变得更加强大，因为攻击者利用了继承分布式系统优缺点的云架构（Bakshi
    和 Yogesh，2010）。然而，Bakshi 和 Yogesh 提出的解决方案表明，将入侵检测系统（IDS）部署到虚拟机中（Douligeri 和 Mitrokotsa，2004）。


    ## 6.14. 加密密钥


    在此类攻击、员工疏忽或缺乏安全策略中的漏洞或弱点，使关键密钥（文档加密、SSL、客户端个人密钥）易受未获许可或未通过身份验证的恶意用户利用（ENISA 2009）。这种崩溃可能为未经授权的访问提供权限，这些用户可能对云基础设施和其他客户发起攻击。


    ## 6.15. 服务引擎存在


    支持引擎由云系统供应商设计和支持，有时也来自开源社区。服务引擎更容易受到攻击或突发故障的影响；这意味着它可能暴露于不同的恶意冲击中。例如，攻击者可能控制支持引擎并访问客户端环境中包含的信息（Kennedy
    2015）。该服务引擎的定期安全升级将能够部分解决此问题。


    某些类型的恶意软件被编程为打开单个端口，以允许攻击者访问或潜在地操纵程序的漏洞（Krutz 和 Vines，2010）。由于恶意软件每天都在增长和进步，解决它并非一项琐碎的任务。


    这产生了一种恶意的分区，这是针对数据系统和云计算系统的最严重的威胁之一，因为云架构需要特定功能，如系统管理员和审计员、托管安全服务提供商等，这些人被认为非常不安全（ENISA
    2009）。


    可以根据威胁是否被覆盖（●）、部分覆盖（○）或未投保（–），提供建议关于特定危险是否可以通过某些技术对策（技术选项）或某些组织或程序对策（非技术替代方案）来解决。


    一般地说，这是识别事物身份并确信其行为的过程。从云的角度来看，“事物”一词包括 CP 及其员工、云客户以及信息所有者。信任可以通过使用信任模型的信任机制来实现。信任模型是一种包含信任建立、信心更新和信任撤销的控制技术或协议。云计算方法的信任方向不能与传统信任模型一起执行。这是云技术的独特性质的结果——即它们的规模、位置、缺乏边界、消费者数量以及缺乏保证——这使得现有的分布式系统信任模型不恰当。云系统广泛部署的最关键障碍之一是消费者与
    CP 之间的信任困境。当数据保存在云上时，用户认为他们失去了控制，并且对诸如谁有权访问、他们的信息如何被处理或/及复制等问题持怀疑态度。可以实施的信任机制充当先前担忧的对策，因为信任旨在安全且快速地建立实体之间的关系。然而，现有信任模型（例如，用于获取受公司边界限制的数据中心）不适合云计算环境。主要原因如下：


    -   **信息处理：** 当客户将其信息传输到云端时，该信息的中央处理者不再是真正的所有者，而是供应商。这一简单事实使信任方面的事情变得不同，因为增加了一个新的威胁参数。换句话说，该信息的物理芯片必须始终完全值得信赖。另一方面，CP
    不能完全可靠。


