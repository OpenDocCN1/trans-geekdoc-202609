    et al. 2010; Hu et al. 2010) proposed regenerating codes for data reliability
    in distributed storage like the cloud. Regenerating codes built on the concept
    of network coding aim at mixing data blocks that are stored in existing storage
    nodes, and then generating information in a brand new storage node. It is revealed
    that regenerating codes reduces the data repair/recovery traffic over conventional
    erasure codes topic to the same fault tolerance level.


    One naive approach to achieve searchability, privacy, and reliability on information
    outsourced to many clouds is that of trivial replication. In particular, we can
    replicate the single-user searchable encryption strategy to CSPs. Each CSP stores
    the same searchable ciphertexts. Thus, even if n – 1 CSPs are unavailable, the
    remote files are still available. But this strategy is not space efficient since
    it takes a whole lot of capability to conserve the replicas. To reduce redundancy
    while tolerating CSP failures, another possible approach is to use erasure coding.
    Specifically, we could use secret sharing methods to encode the files into a set
    of stocks and distribute the shares to n CSPs so that if a particular number of
    CSPs are inaccessible, the shares from the rest of the CSPs may be used for reconstructing
    the original files.


    In comparison with the first approach, the second strategy saves storage space
    by reducing the reliability assurance out of n – 1 to 2 – t.'
