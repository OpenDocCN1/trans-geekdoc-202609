    Cloud resources and services can be retrieved readily by clients and users via
    a network like web services or tools on demand: Clients can use resources according
    to their requirements at any time and in any place. Highly scalable tools and
    support capabilities can be reached automatically. Services are quantified: the
    use of their allocated resources and solutions (for example, processing, storage,
    memory, etc.) may be controlled, measured, managed, and documented so both clients
    and suppliers may have a clear view within the wants and consumption of their
    resources.


    Cloud customers are of many types, but generally, a cloud customer is a computing
    system that uses cloud solutions (Hofér and Howerantz 2009). Cloud customers are
    described either in the context of hardware or applications; in the sections below,
    hardware and applications customer types will be analyzed in a few cases.


    # ### 4.1. HARDWARE CUSTOMERS


    The expression “hardware customers” refers to cloud customers who are distinguished
    based on hardware features of computing systems.


    Hardware customers are of three kinds, as shown in Figure 4.3.


    ![](img/625475237d5c9b4148fda1077938a911_77_0.png)


    Figure 4.3. Hardware customers. Thick clients, lean customers, smartphones, hardware
    customers


    # #### 4.1.1. THICK CLIENTS


    Thick clients refer to computing systems that perform substantial information
    processing from the client/server version. Thick clients have a lot of ports,
    internal memory, input and output devices like PCs. With thick clients, there
    is no need for continuous communication between clients and servers. Nearly all
    available cloud solutions are created for thin clients, including Microsoft LiveMesh
    along with the Elastic Compute Cloud (EC2).


    # #### 4.1.2. THIN CLIENTS


    A thin client is generally a terminal that is not meant for significant processing
    and renders the processing responsibilities of bulky information'
  - '[PAGE 78]


    to a host. A thin client is a network computer without a hard disk that functions
    as broadcasts communicating with a host. Thin client typical programs have been
    in areas in which the end user has particular activities for which the machine
    is utilized, like schools, authorities, manufacturing plants, and so forth.


    # 4.1.3. SMARTPHONES


    Within the past 10 years, we have noticed the processing capacity of mobile devices
    based on iOS and Android operating systems has attained the same level of support
    as notebooks and desktop PCs. Such cellular devices support both Wi-Fi and LTE
    connectivity, so a roaming customer can get any services that are cloud-based.
    Safety is a vital issue once the roaming customer accomplishes financial portfolio
    management, electronic banking transactions, and social media. In forthcoming
    years, mobile devices will start to replace PCs as the display size on the apparatus
    gets more substantial, thus enabling a complete page view.


    # 4.1.4. SOFTWARE CUSTOMERS


    Computer software customers refer to cloud customers who are distinguished according
    to applications functionality; for instance, some cloud software demand Internet
    connectivity while the program is functioning, whereas additional cloud software
    can operate offline but with limited purposes. Software customers are of three
    kinds as shown in Figure 4.4.


    # 4.1.5. THICK OR THIN . . . OR SMART?


    A thin client machine is going to communicate with a central processing server,
    meaning there is not much hardware and software installed on the user’s machine.
    Occasionaly, thin may be defined as simply not needing the software or operating
    system installed on the user machine. This permits all end users’ systems to be
    centrally managed and software set up on a central server location as opposed
    to being set up on each individual system. Thin clients are best suited to surroundings
    where the exact same information will be accessed by the clients, which makes
    it a better solution for public environments. Because of this, thin clients are
    often deployed in airports and resorts, where installing software in all systems
    would not make sense. It would be a huge headache for IT to both deploy and maintain.
    When compared with the feature-rich desktop PCs, thin clients often'
