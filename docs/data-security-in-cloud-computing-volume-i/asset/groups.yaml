    除了可靠性保证降级外，第二种策略还由于CSP之间需要大量轮次的通信来完成协议而更加耗时。STRE（存储和检索机制）使云用户能够在多个云中的CSP分散和搜索其加密数据，同时获得可靠性。STRE机制遵循与第二种朴素方法相似的精神，并提出了更高效的基于秘密共享的协议。此外，STRE机制在保护消费者搜索模式方面也具有更好的效果。特别地，许多关于可搜索加密的研究（Curtmola等人
    2006; Kamara, Papamanthou, and Roeder 2012）会完全披露消费者的搜索模式，该模式指示两个提示是否对应同一个查询关键词。从STRE机制来看，这种模式泄露风险降低了，因为搜索是在分散的基础上进行的，且只有当超过
    t 个 CSP 碰撞时，搜索例程才会被揭示。


    以下是STRE机制的概述。STRE机制由三个重要阶段组成：设置阶段、存储阶段和恢复阶段。在设置阶段，从安全参数生成一个主密钥并委托给云用户。在存储期间，用户需要一组输入文件和一个主密钥，并创建一组文件共享和一个文件索引。文件共享和文档指标被上传到相应的CSP。恢复阶段旨在搜索包含特定关键词的文件。


    用户基于查询关键词及其主密钥生成一组陷门共享。陷门讨论被交付给各个CSP——即消费者。最后，用户重建并解密结果，并获得包含查询关键词的明文文件。


    ## 3.5. 云责任性


    云计算方法背后的主要动机之一，是外包复杂计算并保存大量数据的机会。但迄今为止，客户几乎没有（如果有的话）专门的技术来检查资源消耗和数据存储状态，一旦它们被“发送”到云服务商处。云供应商不允许用户观察其内部运作，消费者也没有关于其信息位置或其实际计算状态的可靠信息。虽然加密可以确保护外部数据的保密性，访问控制可以通过控制谁访问多少数据（或更广泛地说，资源）来增强这些保证，但确保完整性并确认使用了多少数据仍然很困难。为了处理这些问题，责任性是云技术中重要的安全条件。责任性旨在为云用户提供一种探测性的，而非预防性的补救措施（Ko等人
    2011）。


    目标不是保护数据隐私或控制资源使用，而是确认谁获得了资源的访问权限，以及如何获得的。根据 Ruebhausen 和 Reich（Ruebhausen 和 Reich.
    2013），云责任性可以帮助“使来自云的数据处理更加透明”，从而“将捕获的数据生命周期事件与测试中的策略进行匹配，并以此向客户展示其信息得到妥善处理”。与基于“隐藏它或失去它”视角构建的隐私保护技术不同，责任性关注于保持信息使用的透明性和可追溯性。


    传统的责任方法侧重于信息收集和事后分析，以及第三方审计。通常，责任系统包括通过日志组和事件监控进行的数据收集，随后是对累积证据的审计和评估，以检测潜在异常或检查实际数据
    lineage。然而，正如 Ko 等人（2011）所述，云计算由虚拟化提供的弹性保证在责任性方面引入了一些新的复杂性，与监控和处理以极其动态方式连接的多个虚拟和物理资源的能力相关。此外，由于假设远程节点上信任有限，这些节点可能不可靠到足以收集当前责任所需的证据，日志收集本身成为一个具有挑战性的任务。


    虽然目前的行业实践依赖云和服务商之间合约和监管安排来确保数据和资源责任性（Pearson 2011），但研究人员已经调查了通过技术手段克服上述挑战的方法。一种常见方法是依赖作为计算和存储过程的一部分产生的日志，可能辅以必要的临时信息以监控对报告的访问和其他活动。最近的工作建议使用数字证据包来解决互操作性和证据伦理问题，同时进一步利用元数据来促进证据处理（Ruebhausen
    和 Reich 2013）。其他人建议使用代理来促进分布式数据收集并提供更重要的基础设施（Gellman 2009; Sundareswaran, Squicciarini,
    and Lin 2012）。


    云来源侧重于记录信息对象的所有权和处理历史，它被认为是云计算中数据取证成功的重要因素（Asghar 等人 2011; Lu 等人 2010）。特别是，研究人员强调来源可以作为推导所谓“保管链”的手段，这应该描绘数据是如何被收集、检查和维护的。这对云取证尤为重要，即在发生法律纠纷时，确保来源信息可作为法庭证据被采纳。在现有提案中，一个关于来源的近期项目依赖于可证明数据所有权（PDP）的概念（Gellman
    2009），主要构建可在客户端验证的数据持有密码学证明。影响传统计算的相同漏洞、威胁和攻击也是云计算的风险，并增加来自使用虚拟化资源和虚拟机监视器的威胁。本章还讨论了许多抽象层级威胁的对策。后来，本章解决了云存储解决方案和多云中的隐私和安全问题，以及云责任性。


    云安全中最显著的研究挑战是云供应商如何向云客户端保证一定程度的安全性。云客户别无选择，只能信任其云服务商，而且通常对提供的安全级别没有保证。


