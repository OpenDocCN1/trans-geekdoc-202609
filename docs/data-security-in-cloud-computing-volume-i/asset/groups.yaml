    EDoS（弹性拒绝服务攻击）的一种手段（Kaliski 和 Pauley 2010）。“隔离”一词描述了安全性和性能隔离。因此，一个服务的实施不应干扰下一个服务。通常，隔离可以通过仅使用不同的物理服务器或远程系统基础设施来实现。然而，就云计算而言，由于虚拟机共享资源，实现完全隔离非常困难。因此，在隔离机制出现故障的情况下，任何能够访问共享资源的人都可能具备恢复机密数据的能力（ENISA
    2009；Raj 等人 2009）。云解决方案具有与直接针对此类服务的抽象级别相匹配的计量功能，例如处理能力和存储。计量信息用于服务交付和收费服务（Grobauer,
    Walloshek 和 Stöcker 2011）。Widder 等人提出了一种方法，表明使用复杂的事件处理引擎（Widder 等人 2007）。


    ### 6.3.3. 锁定效应


    当云基础设施的所有权和覆盖范围发生变更，而 prior 客户仍保留为客户身份时，会出现许多问题。当客户无法将其信息从一个 CP 转移到另一个时，会出现一个极其重要的困难。在这种情况下，根据云系统的结构，可能会出现许多不同的锁定问题。由于法律或技术因素，从每个客户那里提取信息都非常困难。在
    SaaS 结构中，可能会发生提供商锁定问题。PaaS 结构中的问题可能涉及 API 封装，因为 CPs 并不使用完全相同的虚拟化平台。客户应检查新提供商是否使用相同或兼容的平台。IaaS
    锁定因每个客户使用的基础设施而异。为了防止这种情况发生，必须在广泛研究后选择正确的 CP，并且必须特别注意云覆盖范围的任何变化（ENISA 2009；Widjaya
    2011）。


    ## 6.4. 合规性问题


    企业和组织出于多种原因迁移到云系统。由于这些企业在迁移前已使用安全认证和其他标准，因此可能会出现合规性问题。


    这一点至关重要，因为 CP 可能不使用相同的安全标准或准则，或者安全方案可能互不协调。因此，客户评估 CP 是否能提供与其部署协调一致的服务，并能托管符合其要求的解决方案，这一点至关重要。否则，这可能导致长时间的
    DoS（拒绝服务），而消费者的失望将损害运营商的名声（ENISA 2009）。由于云系统可能拥有分布在各个国家的不同基础设施元素，这一风险会变得更加严重。


    考虑到这些问题，可以得出结论，关于数据溯源存在许多未解决的挑战。这导致云客户产生疑虑，他们需要了解其所使用信息的来源。每个 CP 都需要建立其溯源系统，以确保所提供服务的质量，并保护数据机密性和客户隐私。


    如果这些条件被破坏，可能会引发关于信息及其存储的权限问题（ENISA 2009；Vouk 2008）。


    ## 6.5. 基础设施修改


    随着技术的发展，更好的硬件和软件替代方案被引入。CPs 可能会升级或更新其软件和设备。这可能会为每个客户带来额外费用，即使后者在云中的资源使用量保持不变。更重要的是，如果适当的安全机制未能充分保护数据，保存/交易数据的知识产权可能会受到威胁。CPs
    应关注此类事项，并付出额外努力制定关于其系统正确使用的严格规则和安全策略，以防止法律麻烦。


    ## 6.6. 数据处理


    除了信息溯源外，云计算中的另一个重要关注点是信息处理。客户无法确切知道云系统将如何处理其信息，以及处理是否符合其居住国的所有法律框架。许多 CPs 描述了他们遵循的流程及其可能持有的证书，但如果数据受到针对恶意用户的保护，则无法保证消费者存储的信息是否被合法访问。这引发了另一个难题：如何从法律角度评估这些数据，同时（在同一时间）防止其泄露，而不侵犯用户隐私（ENISA
    2009）？


    ## 6.7. 行政管理与资产


    CP 可能会更改其行政员工（例如系统或网络管理员），或者整个云系统甚至可能被出售给另一个提供商。由于新所有者可能无法满足 prior 所有者/管理员的安全需求，这可能会导致许多安全问题。这可能影响信息的机密性、可用性和完整性，进而影响
    CP 的声誉。因此，在新管理层决定更改之前，保持先前已建立的安全措施一段时间至关重要。


    ## 6.8. DoS


    由于云方法提供资源共享，因资源误判或误配而导致的对同租户的 DoS 可能导致由单个租户实施的恶意行为影响另一个租户。更重要的是，客户可能无法访问特定服务，因为其他人可能已预订了可用资源。随着提供商的名声显著下降，这可能变成一个严重的问题

