    contain modules of elements that are identical, with identical settings, and that
    can easily be reproducible in different cloud ecosystems.


    This chapter described the cloud ecosystem as an intricate system of interdependent
    components that work together to allow a cloud-based information system. It is
    essential to be aware that while serving a cloud-based information system, a cloud
    ecosystem could be orchestrated by multiple cloud actors that collaborate to build
    it.


    Cloud providers construct the foundation of the ecosystem. The layers assembled
    by agents or intermediate providers inherit the controls from the lower sheets
    from the stack implemented by providers. Based on the support model, a cloud user
    adds performance to the cloud ecosystem, while inheriting privacy and security
    controls achieved by all other cloud actors.


