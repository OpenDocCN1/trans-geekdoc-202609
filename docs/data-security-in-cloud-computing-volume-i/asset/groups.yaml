    # 图 4.1. 云计算结构


    ![](img/625475237d5c9b4148fda1077938a911_76_1.png)


    # 图 4.2. 云计算解决方案的特性


    客户和用户可以通过网络（如按需提供的网络服务或工具）轻松获取云资源和服务：客户可以根据需求在任何时间、任何地点使用资源。可高度扩展的工具和支持能力可自动触达。服务是可量化的：对其分配的资源（例如处理能力、存储、内存等）和解决方案的使用情况进行控制、测量、管理和记录，以便客户和供应商都能清晰地了解资源的需求和消耗情况。


    云客户类型多样，但通常而言，云客户是指使用云解决方案的计算系统（Hofér 和 Howerantz，2009）。云客户可以在硬件或应用程序的背景下进行描述；在以下章节中，将在几个案例中分析硬件和应用程序客户类型。


    ## 4.1. 硬件客户


    “硬件客户”一词指的是根据计算系统的硬件特征来区分的云客户。


    如图 4.3 所示，硬件客户分为三种类型。


    ![](img/625475237d5c9b4148fda1077938a911_77_0.png)


    图 4.3. 硬件客户。厚客户端、瘦客户、智能手机、硬件客户


    ### 4.1.1. 厚客户端


    厚客户端指的是从客户端/服务器版本执行大量信息处理的计算系统。与个人电脑（PC）类似，厚客户端拥有大量的端口、内存以及输入和输出设备。使用厚客户端时，客户端和服务器之间不需要持续通信。几乎所有可用的云解决方案都是为瘦客户端创建的，包括
    Microsoft LiveMesh 以及弹性云计算服务（EC2）。


    ### 4.1.2. 瘦客户端


    瘦客户端通常是指一种并非用于重大处理，而是将大量信息处理责任委托给主机的终端。瘦客户端是一种没有硬盘的网络计算机，它作为广播装置与主机通信。瘦客户端的典型程序应用在学校、政府机构、制造厂等领域，在这些领域中，终端用户对该机器的使用有特定活动需求。


    ### 4.1.3. 智能手机


    在过去 10 年中，我们注意到基于 iOS 和 Android 操作系统的移动设备的处理能力已经达到了与笔记本电脑和台式 PC 相同的支持水平。这类蜂窝设备支持
    Wi-Fi 和 LTE 连接，因此漫游客户可以获取任何基于云的服务。一旦漫游客户执行金融投资组合管理、电子银行交易和社交媒体活动，安全便成为一个至关重要的问题。在未来几年内，随着设备屏幕尺寸的增大从而能够显示完整页面，移动设备将开始取代
    PC。


    ### 4.1.4. 软件客户


    计算机软件客户指的是根据应用程序功能进行区分的云客户；例如，一些云软件在程序运行时需要互联网连接，而另一些云软件可以离线运行，但用途有限。如图 4.4 所示，软件客户分为三种类型。


    ### 4.1.5. 厚客户端、瘦客户端……还是智能客户端？


    瘦客户端机器将与中央处理服务器通信，这意味着用户的机器上安装硬件和软件不多。有时，“瘦”可以被定义为仅仅意味着用户的机器上不需要安装软件或操作系统。这使得所有终端用户的系统可以集中管理，并且软件在中央服务器位置设置，而不是在每个单独的系统上设置。瘦客户端最适合于客户端访问完全相同信息的环境，这使其成为公共环境的更好解决方案。因此，瘦客户端通常部署在机场和度假区，在这些地方在系统中安装软件没有意义。对于
    IT 部门来说，部署和维护这都将是一个巨大的头痛问题。与功能丰富的台式 PC 相比，瘦客户端往往显得有些原始和过时。由于大多数瘦客户端运行在非常少的硬件上，无法整合丰富的图形用户界面。客户只需要输入设备（键盘）和显示设备（显示器）。有些甚至不需要鼠标。


    相比之下，厚客户端为用户提供更多的属性、图像和选项，使应用程序更具可定制性。与瘦客户端不同，厚客户端不依赖于中央处理主机，因为处理是在用户系统本地执行的，而服务器主要用于存储目的。因此，厚客户端通常不适合公共环境。要维护厚客户端，必须维护所有用于软件安装和更新的系统，而不仅仅是维护服务器上的软件。此外，厚客户经常需要运行特定的应用程序，这再次带来了更多部署的限制和工作。


    在过去几年里，一般趋势是转向智能客户端，也称为富客户。这种趋势是从传统的客户端/服务器架构向现代模式的转变。


    与厚客户端 vs. 瘦客户端相比，智能客户端是连接互联网的装置，允许用户的本地应用程序通过使用 Web 服务与基于服务器的程序进行交互。例如，运行文字处理应用程序的智能客户端可以与远程在线数据库接口，以便从数据库收集数据用于文字处理文档。智能客户端支持离线操作。换句话说，即使没有连接互联网，它们也可以使用数据（这使它们区别于基于浏览器的应用程序，后者在设备未联网时无法工作）。智能客户端软件具有从专用服务器在系统上实时部署和升级的能力。由于基于
    Web 服务构建，它们支持多种语言和平台，并且可以在几乎任何具有互联网连接的设备上运行，包括台式机、工作站、笔记本电脑、平板电脑、PDA 和移动电话。智能客户端提供丰富的图形用户界面（GUI），并且总体开发和维护成本比瘦客户端等更高。缺点是，智能客户端需要客户安装或设置运行时库——在执行期间与程序绑定的例程。智能客户端最常与
    Web 浏览器客户端（或基于浏览器的应用程序）进行对比。


    ### 4.1.6. 瘦客户端或 Web 应用程序客户


    当使用瘦客户端时，通常在台式 PC 上发现的所有属性，包括软件、敏感信息、内存等，都保存在数据中心。运行远程桌面协议（RDP，如 Citrix ICA 和
    Windows Terminal Services）和/或虚拟化软件的瘦客户端，访问存储在服务器、刀片等条目上的硬盘。瘦客户端、软件解决方案和后端硬件构成了瘦客户端计算，这是一种数字桌面计算版本。瘦客户端作为
    PC 替代技术，帮助客户立即访问任何虚拟桌面或虚拟化应用程序。瘦客户端为企业提供了一种创建虚拟桌面基础架构（VDI）的成本效益方法。瘦客户端被全球各种不同需求但共同目标一致的
    industries 和企业使用。瘦客户端在成本、安全性、可管理性和可扩展性方面的好处，都是 IT 人员研究——并转向——瘦客户端的原因。


    ### 4.1.7. 智能客户


    智能客户拥有软件，不仅可以让他们将大部分信息保存在万维网上，还能利用 PC 的处理能力和其他资源，以确保


