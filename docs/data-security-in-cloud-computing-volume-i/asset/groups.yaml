    # INTRODUCTION


    This first volume of my series of works dedicated to Data Security in Cloud Computing
    acts as a professional benchmark, as well as a practitioner''s guide to today''s
    most complete and concise view of cloud computing security. It offers coverage
    on cloud computing security concepts, technology, and practice as they relate
    to based technologies, and to recent advancements. It investigates practical answers
    to a wide assortment of cloud computing protection issues.


    The primary audience for this book consists of engineers/students interested in
    monitoring and analyzing specific, measurable cloud computing protection environments,
    which may include infrastructure or transportation systems, mechanical systems,
    seismic events, and underwater environments. This book will also be useful for
    safety and related professionals interested in tactical surveillance and mobile
    cloud computing protection target classification and monitoring. This thorough
    reference and practitioner''s short book is also of significance to students in
    upper-division undergraduate and graduate-level classes in cloud computing security.'
