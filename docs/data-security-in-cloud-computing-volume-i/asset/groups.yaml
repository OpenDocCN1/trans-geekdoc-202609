    # 5.4. 安全边界（从文本推断的上下文）

    *（注意：文本从关于 IaaS、PaaS 和 SaaS 边界的讨论中间开始。根据行文逻辑，该部分可能紧接在被 OCR 源文件中截断的“5.4. 安全边界”标题之后，或者是前一节的延续。我将对提供的文本进行逻辑结构化处理。)*


    ## IaaS 安全边界

    IaaS 边界在基础设施层划分云生态系统，将 IaaS API 作为代理暴露，同时勾勒出客户禁入的层级，因为相互连接的堆栈涵盖了核心连接、硬件和设施。在 IaaS
    边界之外是生态系统编排边界、云安装边界和信任边界。IaaS 的内部和外部边界需要协调，以建立合理的信任水平，并与其他云参与方协调安全工作。这种信任必须根据机构是否由客户控制来决定与所有
    IaaS 的关系。在**明确定义**的边界中，必须界定服务提供商在安全、隐私和高质量方面的责任。


    消费者需要评估与其他参与方（无论位于系统边界内部还是外部）在接口（逻辑和物理）方面的可信度。从云用户选择的云部署版本对云提供商的信任关系有直接影响。在 IaaS
    支持模型中，对于所提供的支持，云用户承担了比云提供商或其他参与方更高的责任。


    ## PaaS 安全边界

    NIST SP 800-115 对 PaaS 的定义如下：


    - 提供给[云消费者]的能力是将使用提供商支持的编程语言、库、服务和工具生成或获得的消费者创建或获取的应用程序部署到[云供应商]上。[云消费者]不管理或控制底层云基础设施（包括网络、服务器、操作系统或存储），但可以在部署的应用程序内以及应用程序托管环境的可能配置设置中进行操作。

    - PaaS 边界在平台层划分云生态系统，提供集成开发环境和集成阶段，同时勾勒出对消费者而言外部的那些层级，作为包含服务器、网络、操作系统和存储的相互连接堆栈，从运行环境一直到设施，允许云客户部署或构建其选择的兼容应用程序。类似于
    IaaS 服务边界，基于 PaaS 的生态系统包含 PaaS 内部和外部边界，这是云用户与云供应商之间建立的，用于界定管理控制权和职责范围。提供商承担了越来越多的实施和监控安全的责任。


    图 5.6 描绘了 PaaS 外部边界，它由一个相互连接的堆栈组成，将该 IaaS 的设施边界与 PaaS 的集成边界连接起来。在 PaaS 下方，限制建立了
    API、交付和连接、抽象和控制，以及硬件和设施边界。提供 PaaS 接口的限制需要协调，以与云提供商建立可接受的信任水平和安全协调。如前所述，云用户需要估算使用系统的危险并确定风险承受度。在大多数情况下，在基于
    PaaS 的云生态系统中，云提供商相比云客户承担了更多的安全和支持协调责任。


    ![](img/625475237d5c9b4148fda1077938a911_114_0.png)


    **图 5.6.** *平台即服务边界——供应商的层级*


    ![](img/625475237d5c9b4148fda1077938a911_114_1.png)


    **图 5.7.** *具有 PaaS 外部层级的部署边界。平台即服务边界——消费者的层级*


    ## SaaS 安全边界

    NIST SP 800-115 对 SaaS 的定义如下：


    - 提供给该[云消费者]的能力是使用[云提供商的]在[由供应商或技术中介管理的云生态系统]中运行的应用程序。应用程序可通过各种客户端设备访问，通过瘦客户机接口（如
    Web 浏览器，例如基于 Web 的电子邮件）或软件接口。[云用户]不管理或控制内部云[生态系统]（包括网络、服务器、操作系统、存储或可能的单个程序容量），但可能包括有限的用户特定应用程序配置设置。

    - 云提供商必须承担满足所有常见合规要求以及监控和实施安全和隐私控制的最重大责任。SaaS 边界在软件层划分云生态系统，将程序和 SaaS API 作为支持暴露，同时勾勒出对消费者而言外部的那些层级，作为从软件层一直到设施的相互连接堆栈。


    SaaS 的内部边界由顶层边界的相互连接堆栈组成，包括消费者数据、演示、API 和程序。SaaS 外部边界始于 SaaS 涂层，并建立在 PaaS 外部边界之上。在
    SaaS 层暴露端口的边界需要与云供应商进行运营、安全和隐私协调，以建立合理的信任水平。在基于 SaaS 的云生态系统中，信任需要通过云消费者与任何签约的云参与方（供应商、代理等）协作来建立。在
    SaaS 边界内，建立信任不仅更困难，而且也是一个更关键的组成部分，因为提供商承担了部署和管理过程的绝大部分甚至全部责任。由于支持不在云消费者的物理或逻辑控制之下，只能通过具有可执行条款和条件的明确定义的部署和编排边界来建立和维持信任。相对于
    IaaS 和 PaaS 服务模型，在基于 SaaS 的云生态系统中，云提供商在实施隐私和安全控制以及组织和管理服务方面承担了最大的响应责任。


    SaaS 边界内以及 SaaS 内部和外部边界之间（对于云消费者和云提供商两者）的信任程度应当是最紧密的，因此要求更严格的服务安排和服务级别协议（SLA），以及明确定义的处罚和责任。


    ## 5.5. 生态系统编排边界


    为了最小化业务费用并降低云解决方案的价格，提供商设计了针对尽可能多潜在客户的云解决方案集。这类解决方案更容易让业务部门理解，并在云内部、之间和向云迁移工作负载。这些预包装的解决方案集通常包含相同的组件模块，具有相同的设置，并且可以轻松地在不同的云生态系统中复现。


    本章将云生态系统描述为一个相互依赖组件组成的复杂系统，这些组件协同工作以支持基于云的信息系统。重要的是要意识到，在为基于云的信息系统提供服务时，云生态系统可以由多个协作构建它的云参与方进行编排。


    云提供商构建了生态系统的基础。由代理或中间提供商组装的层级继承自提供商实现的堆栈中较低层级的控制。根据支持模型，云用户向云生态系统添加性能，同时继承由所有其他云参与方实现的隐私和安全控制。


    很多时候，由于云计算系统的多租户特性，云生态系统的组件已被共享给为不同信息系统服务的所有其他云生态系统。此外，除了本地个人云之外，许多云运行在第三方数据中心。即使在本地个人云中，在极端条件下也可能有向不同云进行云突发（cloud
    burst）的规定。阻碍云计算更广泛采用的障碍之一是云消费者无法持续监控新云参与方采用的控制措施或这些参与方管理的元素的操作。


    通过确保所有云参与方对其职责有清晰的了解，并且云参与方正确实施了安全计划中确定的商定安全和隐私控制，云参与方可以定义云生态系统编排边界，并准确评估使用特定编排用于所讨论信息系统的继承风险。


