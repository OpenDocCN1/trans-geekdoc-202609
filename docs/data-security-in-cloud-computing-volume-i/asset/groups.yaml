    ## 第 3 章


    # 云安全基线


    ### 3.1. 基础概念


    本章讨论云计算保护的 basics，以及该领域的主要挑战。它首先概述个人信息安全，讨论其三大支柱——道德、机密性和可访问性——以及可信度和信任等其他重要概念。


    本章还讨论了漏洞、威胁和攻击的一般概念，并在云计算系统的背景下，随后总结了针对云计算危险的最常见缓解措施。本章还探讨了云存储解决方案和多云环境中的隐私与安全性，以及云可靠性。


    计算机安全包含三个至关重要的支柱，可以通过首字母缩写 CIA 来记忆，其含义为：


    - 机密性（Confidentiality）

    - 完整性（Integrity）

    - 可访问性（Accessibility）


    机密性包括向未经授权的方隐藏敏感数据。三种机制有助于实施隐私保护。第一种是加密，它使用数学转换来隐藏明文数据。第二种是访问管理，它定义了允许访问机器特定区域或信息特定部分的人员。


    第三种是授权，它决定了每个经授权的方被允许对某条信息或系统模块执行哪些操作（Bishop 2003；Goodrich 和 Tamassia 2010；Stallings
    和 Brown 2012）。完整性支柱意味着未经授权的方无法更改系统及其数据。保护完整性的机制通常试图首先防止变更或篡改发生，或者在攻击发生后发现它。下一个支柱，可访问性，描述了系统和信息为了能够以及时的方式被授权方访问而需要具备的特性。


    还有其他重要概念，如真实性（authenticity），即数据和交易是真实的；以及不可抵赖性（non-repudiation），即保证一方无法否认某笔交易、声明甚至某次接触。在计算机安全中，我们将这些缺陷预测为漏洞。计算机系统永远不会没有漏洞，因为它们是由人创建、实现和分析的，而人总是会持续犯错。因此，一个弱点就是安全的威胁。我们预测一次攻击——一种由对手完成、通常利用系统至少一个漏洞实现的危险。


    云计算系统中的安全挑战与传统计算中的没有太大区别，只是云环境增加了漏洞的数量和攻击的影响。由于云环境包含许多抽象层——应用程序、操作系统、架构和社区——攻击者有很多途径可以破坏云支持的安全性，例如，在线云应用程序中一个未清理输入品的漏洞可能导致存储在数据中心中的敏感信息泄露。


    正如我们所说的，云计算解决方案可能在大多数抽象层中表现出漏洞（Grobauer, Walloschek, 和 Stocker 2011）。图 3.1 按照此层级展示了云安全漏洞，让人对可能发生的位置有一个概念。


    ![](img/625475237d5c9b4148fda1077938a911_56_0.png)


    **图 3.1。** 展示云安全漏洞


    ### 3.2. 应用程序层


    在应用程序层，云程序可能存在多个缺陷，使恶意行为者能够绕过身份验证并收集有关已安装数据库版本的信息。许多云程序是基于互联网的，并且也存在典型的互联网漏洞，如用户输入验证不足，这使得
    SQL 注入等攻击成为可能（Su 和 Wassermann 2006）。SQL 注入漏洞允许攻击者向互联网搜索引擎注入外部代码，以便通过 SQL 查询解释器执行。尽管由于
    2000 年代中期的事件，该漏洞已被广泛研究，但在漏洞数据库中仍被广泛报道。要了解该漏洞，首先考虑一个典型场景：个人与托管 web 应用的 web 主机交互，该
    web 应用将其信息存储在数据库中。通常，web 应用的代码和数据库存储在不同的机器上。在一个典型场景中，采用出版零售商（例如亚马逊）部署的 web 应用允许用户根据作者、书名等搜索书籍。


    整个图书目录存储在数据库中，程序使用 SQL 查询来检索书籍详细信息。互联网脚本引擎随后构建一条 SQL 命令，该命令是程序开发者编写的指令和用户输入的混合体。该问题导致数据库查看“books”表中的每一行，提取所有作者列值为“Wiley”的文档，并返回所有这些记录的记录。


    此列表集由 web 应用程序处理，并以 HTML 页面形式呈现给用户。现在，假设一种情况，攻击者可以导致对这种信息解释的突破，并脱离该信息的上下文。SQL
    查询中的字符串数据必须封装在单引号内，以将其与查询的其余部分分开。在这种情况下，攻击者提供包含引号（''）的输入以结束她控制的字符串，并创建一条新的 SQL
    命令，改变了程序员希望程序执行的查询。在输入在 Internet 脚本语言和 SQL 查询解释器之间的边界处被翻译的方式上存在一个开放突破口。


    攻击者输入中的双连字符（--）通知查询解释器丢弃其余的代码行，尽管程序开发者可能包含额外的命令。这次攻击的结果是数据库中整个“books”表的删除，如图 3.2
    所示。更重要的是，即使是用不验证范围边界的编程语言（包括 C 或 C++）编写的程序代码，也可能容易受到通过缓冲区溢出的远程代码注入（Lhee 和 Chapin.
    2003）的影响。


    如果程序不使用加密来保持其处理数据的机密性，则程序也可能容易受到敏感信息泄露的影响。如果其身份验证和访问控制流程存在缺陷，程序代码也可能容易受到破坏。


