    also other crucial concepts like credibility and trust.


    This chapter also discusses the ideas of vulnerabilities, threats, and strikes
    generally, and, in the context of cloud computing systems, it is fol-lowed by
    a summary of the most common mitigations for cloud computing dangers. This chapter
    also talks about privacy and safety in cloud-storage solutions and multiclouds
    and cloud reliability.


    Computer safety contains three crucial pillars, which can be re-membered by using
    the acronym CIA, which stands for:


    +   - Confidentiality

    - Integrity

    - Accessibility


    Confidentiality includes the concealment of sensitive data from unau- Thorized
    parties. Three mechanisms help apply privacy. The first is cryp- tography, which
    hides plain text data using mathematical transformations. The next is access management,
    which defines the parties allowed access to specific areas of the machine or particular
    parts of information.


    The last is empowerment, which decides what activities each ap- proved party is
    permitted to do with a bit of information or a system module (Bishop 2003; Goodrich
    and Tamassia 2010; Stallings and Brown 2012). The ethics pillar means unauthorized
    parties cannot change a sys- tem and its data. Mechanisms protecting integrity
    generally attempt to de- fend against a change or tampering from happening in
