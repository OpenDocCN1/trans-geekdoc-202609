- pgno: 67
  md: '# 3.4. PRIVACY AND SECURITY IN MULTICLOUDS


    Cloud computing is growing exponentially, whereby there are now hundreds of CSPs
    of various dimensions (Weinman 2013). A concept of a cloud-of-clouds (also referred
    to as an intercloud) is suggested and has been studied in recent years (Weinman
    2013; Zhu et al. 2012). In a cloud-of-clouds, we distribute information, with
    a particular degree of redundancy, across several independent clouds managed by
    different vendors, like the stored data can remain accessible even when a subset
    of clouds becomes inaccessible. The multicloud environment (Zhu et al. 2012) offers
    lots of new opportunities and paths to cloud customers. Cloud consumers will be
    able to leverage not just one cloud provider, but a lot, to fix their diverse
    requirements and switch providers if a person stops service. To market the multiple
    clouds, IEEE has initiated the Intercloud Testbed project (Weinman 2013) that
    helps make interactions among various clouds a reality.


    While cloud users may enjoy cheaper data storage and powerful computational capabilities
    offered by many clouds, customers also face more complicated reliability problems
    and privacy preservation problems of the outsourced data. More specifically, as
    it is challenging to get explicit promises on the trustworthiness of each CSP
    (Owens 2010), cloud consumers are typically advised to adopt searchable encryption
    methods (Song, Wagner, and Perrig 2000; Kamara and Lauter 2010) to encrypt their
    outsourced info in a way that the CSPs can immediately search the encrypted data
    without decryption. Despite many efforts devoted to enhancing the efficiency and
    security of their searchable encryption, there is little concern for ensuring
    the reliability of the searchable encrypted information. Though cloud storage
    provides an on-demand remote backup alternative, it inevitably increases dependability
    concerns related to having a single point of failure and to possible storage wreck.
    A perfect multicloud environment should possess the following properties:


    +   *   **Reliability:** Given in CSPs, the machine should still operate if t
    (t < n) CSPs can be found, in which t is a predefined threshold value for your
    computer.


    +   *   **Semantic safety:** The machine should be semantically secure (Curtmola
    et al. 2006) by fulfilling the following two requirements. First, given the document
    index and the selection of encoded documents, no adversary could find out any
    information about the original files except the document spans. Second, given
    a set of trapdoors for a succession of keyword questions, no adversary could find
    out any information regarding the original documents'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   * **Trapdoor safety**: This necessitates that any information concerning
    the query keyword—including the search routine—should not be leaked before the
    multiple CSPs’ collaborative searches. The condition holds even if an adversary
    jeopardizes one CSP.


    +   * **Robustness**: When the protocol successfully finishes, the appropriate
    files are returned and reconstructed by the users. When the contract aborts, in
    the collaborative search stage, nothing is returned, and CSPs understand nothing
    about the document set or the inherent searched keyword.


    It is worth noting that not many works consider the issue of simultaneously ensuring
    searchability, privacy, and reliability on data outsourced to many clouds. Present
    reliability guarantees solely rely on each CSP’s backup option, which however
    could be a single point of collapse. By way of example, the wreck of Amazon’s
    elastic computing support in 2011 took some favorite social media sites offline
    for a day and also a single energy department cooperation site was inaccessible
    for nearly two days. More seriously, this wreck has eternally destroyed many clients’
    data with serious consequences for some users (Blogdot 2011). Recent studies (Chen
    et al. 2010; Hu et al. 2010) proposed regenerating codes for data reliability
    in distributed storage like the cloud. Regenerating codes built on the concept
    of network coding aim at mixing data blocks that are stored in existing storage
    nodes, and then generating information in a brand new storage node. It is revealed
    that regenerating codes reduces the data repair/recovery traffic over conventional
    erasure codes topic to the same fault tolerance level.


    One naive approach to achieve searchability, privacy, and reliability on information
    outsourced to many clouds is that of trivial replication. In particular, we can
    replicate the single-user searchable encryption strategy to CSPs. Each CSP stores
    the same searchable ciphertexts. Thus, even if n – 1 CSPs are unavailable, the
    remote files are still available. But this strategy is not space efficient since
    it takes a whole lot of capability to conserve the replicas. To reduce redundancy
    while tolerating CSP failures, another possible approach is to use erasure coding.
    Specifically, we could use secret sharing methods to encode the files into a set
    of stocks and distribute the shares to n CSPs so that if a particular number of
    CSPs are inaccessible, the shares from the rest of the CSPs may be used for reconstructing
    the original files.


    In comparison with the first approach, the second strategy saves storage space
    by reducing the reliability assurance out of n – 1 to 2 – t.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Besides the downgrading of the reliability guarantee, the second strategy is
    also more time consuming due to the numerous rounds of communications needed among
    CSPs to complete the protocol. The STRE (storage and retrieval mechanism) empowers
    cloud users to disperse and search their encrypted data in CSPs living in multiple
    clouds while obtaining reliability. The STRE mechanism follows a similar spirit
    to the second naïve approach and proposes more efficient secret sharing-based
    protocols. Moreover, the STRE mechanism also has better protection on the consumer''s
    search pattern. Especially, many works (Curtmola et al. 2006; Kamara, Papamanthou,
    and Roeder 2012) on searchable encryption would completely disclose the consumer''s
    search pattern which indicates whether two hints are for the same query keyword
    or not. From the STRE mechanism, this type of pattern escape risk is decreased
    because the search is conducted on a dispersed basis and the search routine will
    be revealed only if higher than t CSPs collide.


    An overview of the STRE mechanism is given below. The STRE mechanism is composed
    of three significant phases: the setup phase, the storage phase, and the recovery
    phase. During the setup phase, a master secret key is generated from a security
    parameter and delegated to the cloud user. During the storage period, the user
    requires a group of input files and the master secret key and creates a set of
    file shares and a file index. The file shares and document indicator are uploaded
    to the corresponding CSP. The recovery phase is to search the files containing
    a particular keyword.


    The user generates a set of trapdoor shares based on the query keyword and his
    or her master key. The trapdoor discussion is delivered to the various CSPs—the
    consumer. Last, the user reconstructs and decrypts the results and gets the files
    that are clear, each of which contains the query keyword.


    # 3.5. CLOUD ACCOUNTABILITY


    One of the primary motives underlying cloud computing methods is the chance to
    outsource complicated computation and to save large quantities of information.
    But to this date, customers have few, if any, specialized techniques to check
    resource consumption and data storage status, as soon as they are “sent” to the
    cloud providers. Cloud suppliers do not allow users to observe their inner workings,
    and consumers have no reliable information about their information whereabouts
    or the status of their actual computation. While encryption can guarantee the
    confidentiality of outsourced data, and access control may enhance these guarantees
    by controlling who is accessing what percentage of data (or, more generally,'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'resources), ensuring the integrity and confirming how much data is being used
    is hard. To deal with these issues, accountability is an important security condition
    in cloud technologies. Accountability aims at supplying a detective, rather than
    a preventive remedy to cloud users (Ko et al. 2011).


    The goal is not to protect data privacy or control resource use, but instead to
    confirm who has got access to resources, and also how. Based on Ruebhausen and
    Reich (Ruebhausen and Reich. 2013), cloud liability can help “make data processing
    from the cloud more transparent,” so that “seized data-lifecycle events can be
    matched against policies in Tests and thereby show the customer, that his information
    is handled appropriately.” Unlike privacy protection technology, which is built
    on the hide-it-or-lose-it perspective, accountability focuses on keeping the information
    usage transparent and trackable.


    Traditional liability methods focus on information collection and postmortem analysis,
    and third-party audits. Usually, an accountability system will include data collection,
    through log group and event monitoring, followed by auditing and evaluation of
    the accumulated evidence to detect potential anomalies or to check actual data
    lineae. However, as stated by Ko et al. (2011), cloud computing''s guarantee of
    elasticity empowered by virtualization introduces a few new complexities in accountability,
    associated with the ability of monitoring and processing multiple virtual and
    physical resources, connected in an incredibly dynamic fashion. Further, the log
    collection becomes a challenging task in itself, as a result of potentially limited
    trust assumed at distant nodes, which may not be dependable enough to collect
    the evidence required for current liability.


    Though the present industry practice relies on contractual and regulatory arrangements
    between cloud and client suppliers to ensure data and resource accountability
    (Pearson 2011), researchers have investigated ways to overcome the above challenges
    via technical means. A frequent approach is to rely on logs produced as part of
    the computation and storage procedure, possibly augmented with ad-hoc information
    necessary to monitor access and other activities against the report. Recent work
    has suggested doing this by using digital proof bags to address interoperability
    and evidence ethics, while further metadata may be utilized to facilitate evidence
    processing (Ruebhausen and Reich 2013). Others have suggested using agents to
    promote distributed data collection and provide a more vital infrastructure (Gellman
    2009; Sundareswaran, Squicciarini, and Lin 2012).


    Cloud provenance concentrates on recording ownership and processing history of
    information objects, and it is considered a significant factor in the success
    of data forensics in cloud computing (Asghar et al. 2011; Lu et al. 2010). In
    particular, researchers have emphasized that provenance can be a means to derive
    the so-called chain of custody, which should'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'portray how the data were gathered, examined, and maintained. This is particularly
    critical for cloud forensics, that is, in the event of a legal dispute, to ensure
    that provenance information is admissible as proof in court. Among existing proposals,
    a recent project on provenance depends on the idea of provable data ownership
    (PDP) (Gellman 2009), which mainly builds cryptographic proofs of data possession
    which could be verified at the customer end. The very same vulnerabilities, threats,
    and strikes that affect traditional computing are a risk to cloud computing, with
    added threats coming from using virtualized resources and hypervisors. This chapter
    also discussed countermeasures for threats at many layers of abstraction. Later,
    this chapter addressed privacy and safety in cloud-storage solutions and mult
    clouds, and cloud liability.


    The most significant research challenge in cloud safety is the way that cloud
    suppliers can assure a degree of security to cloud clients. Cloud customers do
    not have any choice but to trust their cloud providers, and they usually have
    no assurances on the level of safety being supplied.


