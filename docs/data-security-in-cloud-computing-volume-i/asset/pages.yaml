  md: '# ## CHAPTER 6


    # # CLOUD SECURITY


    # ## 6.1. THE STATE OF CLOUD SECURITY


    The Continuing Fiscal crisis and the rising computational and storage demands
    have imposed significant modifications on modern IT infrastructure.


    IT cost reduction has been accomplished by offloading information and computations
    to computing. Even though this financial model has discovered flexible ground
    bringing in investments, lots of people and businesses are hesitant to utilize
    cloud solutions due to the many safety, privacy, and trust problems that have
    emerged. Nearly all security specialists believed that cloud computing problems
    ought to be solved using existing countermeasures inherited from traditional IT
    systems as well as dispersed systems which are the ancestors of cloud computing
    environments. It did not take long for them to understand this original approach
    was incorrect, due to the principal qualities of the cloud computing version,
    specifically:


    +   * **Scale:** In order to realize substantial economies, the cloud version
    supports enormous concentrations of hardware tools to supply to the services that
    are supported, and

    * **Architecture:** Even though clients who discuss hardware and software resources
    are usually unrelated, they rely upon logical isolation mechanisms to guard their
    data. This trend toward international supply and redundancy implies that tools
    are often managed in the majority, both logically and physically (ENISA 2009).


    Both these attributes of cloud computing systems are in the core of the cloud
    safety, privacy, and trust problems that have emerged. Considering scale, the
    very first attribute analyzed, cloud computing infrastructures have attained massive
    levels of computational tools. Consequently, in the'
