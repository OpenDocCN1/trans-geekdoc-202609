  md: '# ABSTRACT


    Cloud computing has already been adopted by many organizations and people because
    of its advantages of economy, reliability, scalability and guaranteed quality
    of service amongst others. Readers will learn specifics about software as a service
    (SaaS), platform as a service (PaaS), infrastructure as a service (IaaS), server
    and desktop virtualization, and much more.


    This book covers not only information protection in cloud computing, architecture
    and fundamentals, but also the plan design and in-depth implementation details
    needed to migrate existing applications to the cloud. Readers will have a greater
    comprehension of cloud engineering and the actions required to rapidly reap its
    benefits while at the same time lowering IT implementation risk. The book’s content
    is ideal for users wanting to migrate to the cloud, IT professionals seeking an
    overview on cloud fundamentals, and computer science students who will build cloud
    solutions for testing purposes.


    # KEYWORDS


    Amazon Web Services; API; Azure; BaaS; cloud computing; computer engineering and
    science; Google Cloud; Java; MySQL; Node.js; SaaS; SQL'
