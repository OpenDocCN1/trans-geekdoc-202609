    together with the true sufferer’s public key and forwards it to the sufferer (Kennedy
    2015). Their objective is to acquire information or to make a base for a subsequent
    attack.


    CPs do not create browsers that are appropriately safe for this function. Consequently,
    computer users utilize many different browsers with safety attributes that mostly
