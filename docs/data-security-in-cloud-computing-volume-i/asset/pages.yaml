- pgno: 65
  md: 'To enhance the operation, a few systems use a third party referred to as “proxy”
    (Pearson and Charlesworth 2009) to run re-encryption in the event of the change
    of information recipients. But, they do not shield the identifying characteristics
    of their users.


    Another interesting category of work (Sundareswaran et al. 2012) intends to tightly
    bind information with access management policies to make sure that policies will
    be mechanically enforced whenever and wherever the data are obtained from. The
    benefits of utilizing Java techniques are largely twofold. To begin with, JARS
    supply a lightweight and mobile container for the information in addition to the
    authority’s engine. Secondly, JARS have minimum infrastructure requirements (i.e.,
    a legal Java runtime environment (JRE) running in the remote end) that allow our
    strategy to be readily embraced. User information items regarding clear policies
    will be kept in various internal JARS in encoded format together with encrypted
    log files. The outer JAR includes the authentication module and policy. It’s in
    charge of authenticating entities that wish to get the information, choosing the
    right internal JAR and implementing the corresponding coverages. The crate is
