    Each organization has to adopt/ establish policies concerning the life cycle and
    also the security of sensitive data and should guarantee that the policies are
    followed closely by the workers without exclusion (Krutz and Vines 2010).


    This type of attack demands several efforts (brute force attack), and so it is
