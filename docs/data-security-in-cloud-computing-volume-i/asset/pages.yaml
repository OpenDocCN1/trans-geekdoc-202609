    # 6.6.   DATA PROCESSING


    Along with information provenance, another significant concern in cloud computing
    is information processing. A customer cannot be specific about how the cloud system
    will manipulate his information and also if the processing complies with all the
    legal framework of the nation where he resides. Many CPs describe the processes
    they follow along with the certificates they might have, but if the data are protected
    against malicious users, it cannot be guaranteed whether the consumers’ stored
    information has been legally accessed or not. This raises another dilemma: how
    can these data be assessed from the legal standpoint and (at precisely the same
    time) be shielded from disclosure, without breaking users’ privacy (ENISA 2009)?


    # 6.7.   ADMINISTRATIVE AND ASSETS


    It is likely that a CP will alter its administrative employees (e.g., system or
    network administrators) or the entire cloud system might even be sold to another
    provider. This can result in many safety issues because the new owners might not
    always fulfill the safety demands of the prior owner/administrator. This might
    have impact on the confidentiality of the information, availability, and integrity,
    and hence on the CP’s reputation. Therefore, it is crucial to keep the previously
    established safety measures for a period before the new management decides to
