    # 6.4. COMPLIANCE ISSUES


    Businesses and organizations migrate to cloud systems for many reasons. Since
    these businesses have been using security certifications and other criteria before
    the migration, compliance issues may emerge.


    This is principal since the CP might not use the same safety criteria or standards,
    or perhaps because the safety schemes might not be harmonious with one another.
    It is thus essential for the clients to assess if the CP can provide services
    that are harmonious with their deployments and can host solutions following their
    requirements. Otherwise, this can cause DoS for a lengthy period, while the consumers''
    disappointment will sabotage the operator''s standing (ENISA 2009). As cloud systems
    might possess different elements of the infrastructure spread through various
    countries, this danger gets much worse.


    Contemplating these problems, it may be concluded that there are many open challenges
    regarding data provenance. This leads to doubt for the cloud clients, who should
