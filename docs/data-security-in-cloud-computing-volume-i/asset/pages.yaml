    On several occasions, workers pose a severe danger to the cloud system. Deficient
    training or neglect is closely linked to inconsistent and irregular activities
    of the ordinary worker. Such activities might involve the unintentional loss or
    deletion of their backup info and operational or security logs.


    A risk management strategy in combination with the evolution of an exhaustive
    safety policy can lead to the prevention of similar events. These steps help the
    workers to adhere to a routine for processes, significantly reducing the probability
    of causing crucial and unrecoverable errors.


    There is no limitation to exploiting information located in the garbage. Sometimes
