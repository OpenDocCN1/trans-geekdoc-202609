    # 6.10.  INFORMATION INTERCEPTION


    This is a set of strikes inherited from conventional IT systems. As cloud systems
    are more scalable, the consequences of these attacks can also be scalable and
    in the majority of instances more severe. This group of strikes comprises


    Man-in-the-middle: In this kind of attack, the attacker may impersonate the victim
    by altering the public key/user association. Because of this, the sender encrypts
