    # 6.3. CLASSIFICATION AND COUNTERMEASURES


    To ease the investigation of the security threats faced by cloud technologies,
    it is required to classify the known dangers (ENISA 2009) into different categories.
    Our suggestion for this type of classification uses three main classes:


    +   - Infrastructure and server related dangers, which influence the whole cloud
    infrastructure.

    - Service provider—associated dangers that might influence the consumers that
    seek an agency in the cloud.

    - Common dangers that may affect the infrastructure and the support providers
    or customers.'
