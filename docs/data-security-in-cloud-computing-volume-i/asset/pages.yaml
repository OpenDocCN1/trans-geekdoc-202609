    # ### 3.3. OTHER POTENTIAL REASONS FOR DATA LEAKAGE FROM THE CLOUD


    Apart from enforcing users’ privacy policies in their real data file, there is
    another interesting and fundamental privacy problem brought on by information
    indexing. Indexes may have a fantastic load of material regarding the information.
    Since indicators are often assembled after the service supplier gets the user’s
    information and makes the decision to create indicators to improve search functionality,
    users might not even know about such utilization of the information which likely
    leaks far more info than that planned by users. The most common strategy for encouraging
    effective search over spread content is to construct a centered inverted index.
    The indicator maps every term to some set of files that contain the expression
    and can be queried from the searcher to acquire a listing of matching documents.
    Search engines and mediators generally adopt this strategy. As indicated in (Bawa
    et al. 2009), the strategy can be expanded to encourage access-controlled search
    by distributing access control policies together with content to the indexing
    host. The indicator host has to employ these policies for every searcher to filter
    search results appropriately. Since the indexing host has to be contacted to perform
    a search fully, searches are tremendously effective.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'A centralized index nonetheless exposes content suppliers to anybody who has
    access to this index structure. This breach of access control might not be tolerable
    in the cloud, in which assumptions about the trust of this indexing server no
    longer hold. Further, the compromise of this catalog host by hackers could cause
    a complete and catastrophic privacy loss. Decentralized indexing is an alternate
    architecture utilized to identify a specific set of files (or hosts of files)
    fitting the searcher''s query. Access management can be encouraged by making sure
    the suppliers apply their access policies before providing the files. But, indexes
    continue to be hosted by untrusted machines over which suppliers have no control.
    To be able to solve the problems mentioned above, some functions have explored
    the potential for producing private indicators by relying on predicate-based cryptography
    (Chang and Mitzenmacher 2004; Yang, Zhong, and Wright 2007).


    While noteworthy, these functions lack particular applicability as a result of
    key management requirements and the computational overhead. Bawa et al. (2009)
    suggested an intriguing approach to personal indexing by introducing a distributed
    access control employing protocol. A more recent work (Squicciarini, Sundareswaran,
    and Lin 2010) addresses the privacy problem from another perspective by enabling
    the users to obtain better control within the indicators. Specifically, a three-tier
    data security frame was suggested, which offers powerful, moderate, and low security
    in line with the information owner''s needs. This is accomplished by constructing
    an identical JAR file as mentioned in the former section. The JAR file encloses
    both policies and data, and implements the different levels of security as follows:


    +   *   **Powerful security:** The service supplier is not permitted to browse
    the sensitive section of the consumer''s document, to negate the probability of
    communication being conducted in a sensitive part of the record that could result
    in privacy flows. Users will need to supply sensitive areas regarding their information
    files. Then the JAR plays the function of choosing which subjects are to be read
    from the CSPs. The secure fields are just skipped during the continuous reading
    of this document by identifying the place in which the secure field begins.

    *   **Moderate security:** This option disables arbitrary access to this information
    file to avoid successful indexing within the document. The CSP will be enforced
    to see the material in the following sequence before it can find the information
    it needs.

    *   **Low security:** The user specifies undoubtedly from the coverage the use
    of his information file and the use of indexing. The service supplier is supposed
    to be trusted and will notify and reconnect with all the users the keywords to
    be used for indexing purposes.'
