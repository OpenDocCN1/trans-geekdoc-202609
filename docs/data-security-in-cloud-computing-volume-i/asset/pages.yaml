- pgno: 64
  md: 'want to upgrade its privacy policies, or even a service supplier might want
    to move its operations jointly with customers’ information to somebody else due
    to the selling of business, a merger, transplant from the authorities, and so
    on. These events can influence the recent policies agreed to by all parties.


    The question is how to effectively and efficiently reflect such a change; the
    effects of the influence on attaining policy arrangement and policy authorities
    could be lessened. Specifically, an individual joins the cloud and also confronts
    a few CSPs, each of them capable of supplying the service that he desires. To
    be able to discover the service supplier whose privacy policies best match the
    user’s privacy requirements, the consumer’s privacy requirements and support suppliers’
    current privacy policies are fed to the policy standing module collectively. The
    ranking module assists the user to choose the service supplier with the maximum
    appropriate privacy policies. Considering that the chosen service provider still
    might not have policies that exactly match the consumer’s requirements, the next
    step would be to ship their policies into the coverage integration module that
    will automatically create an integrated policy according to both parties.


    The integrated policy will probably be in two formats. One is in a good policy
    arrangement, that is, a policy written in a particular policy speech. Another
    is within an executable format (such as a Java JAR file) that is used for the
    following policy enforcement. Through the procedure, the consumer’s data confidentiality
    will be safeguarded from the executable coverage, even if the executable coverage
    might additionally travel among builders connected to the direct service provider.


    As revealed by the data mentioned above about the security model, the policy enforcement
    element is essential to the overall safety of the information in the cloud (Cavoukian
    2008; Gellman 2009). There have been a few present attempts that aim to deal with
    this matter. Some strategies (Nabeel et al. 2011; Nabeel, Shang, andertino 2013;
    Shang et al. 2010) use broadcast key management approaches to give access control
    over the cloud information. This action sort of approaches group information method
    based on access management policies and reestablishes each category using another
    key. Users are then granted only the keys to the information items they are permitted
    to access. These encryption actions need to be carried out in the operator’s premises,
    thereby incurring high communication and computation costs.


    As an example, if an individual is revoked, the operator should download the information
    changed by this change in the cloud, then create a new encryption key, re-encrypt
    the downloaded information with the new key, then upload the re-encrypted information
    to his or her cloud. But this strategy is not efficient in managing regular user
    entries and departures.'
