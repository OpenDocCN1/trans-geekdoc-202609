    An advice on whether the particular hazard can be addressed through some technical
    countermeasures (technical option) or via some organizational or procedural countermeasures
    (non-toxic alternative) can be made based on whether a threat is coated (•), partly
    coated (o), or not insured (–).


    Generally speaking, it is the procedure for recognition of a thing’s identity
    and the confidence in its behavior. From the cloud perspective, the expression
    thing involves the CP along with his employees, the cloud client along with the
    information owner. Trust can be accomplished through trust mechanics that use
    trust models. A trust model is a control technique or protocol which includes
    trust institution, confidence renewal, and hope withdrawal. Trust direction of
    cloud computing methods cannot be performed together with the traditional trust
    models. This is a result of the distinctive qualities of the cloud technologies—that
    is, their dimensions, location, the absence of perimeter, number of consumers,
    and lack of assurance—which names the present trust models for dispersed systems
    improper. Among the most critical barriers to the widespread installation of cloud
    systems is the dilemma of confidence between the consumer and the CP. When data
    are saved on the cloud, users believe they are losing control, and they are suspicious
    about topics such as who has access to this, how is their information processed
    or/and replicated, and so on. The trust mechanisms which may be implemented act
    as countermeasures to the prior concerns, because trust achieves to set entities’
    relationship safely and quickly. However, existing trust models used, for example,
    to get a data center that is limited from the perimeter of a company, are not
    suitable for cloud computing environments. The main reasons for this are listed
    below:


    +   - **Information processing:** When a client transfers his information to the
    cloud, the central processor of this information is not the real owner any longer,
    but the supplier. This simple fact makes things different concerning trust because
    a brand new threat parameter has been increased. To put it differently, the physical
    chip of this information should always be wholly trustworthy. On the other hand,
    the CP cannot be entirely reliable.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   - **Information place**: In traditional methods, the geolocation of information
    is always understood. When deploying solutions in cloud computing methods, the
    physical location of information is no longer understood or entirely reliable.
    A trust model that does not consider the location of information in transit cannot
    be regarded as necessary in cloud technologies.


    +   - **Information accessibility**: The place from where users get the information,
    that is, the cloud is unknown and cannot be localized.


    +   - **Number of consumers**: In traditional systems, it is not tough to specify
    the number of individuals who may access the machine. But here only a client pays
    for a service and the supplier of the particular service pays the other supplier
    for part of the service he is assumed to be providing to the client.


    There are numerous cloud-specific trust models indicated in the literature. However,
    these versions should be assessed via a listing of prerequisites which a trust
    model for cloud surroundings should meet.


    +   - **Trust metric**: At a trust model, it is required to specify a way of measuring
    confidence. Since trust is an abstract expression, a way of quantifying the confidence
    value of a cloud supplier or a cloud client has to be defined. It is also required
    to specify the measured levels of confidence for part of the confidence model.


    +   - **Abnormal behavior**: A significant element in the evaluation of trust
    ought to be the strange behavior of consumers from the cloud. A behavior that
    deviates from the typical or an outdated behavioral background or possibly short-term
    accessibility should lead to zero hope. Because of this, it is deemed essential
    for cloud assurance models to specify which behavior is labeled as ordinary and
    which is not. What is more, the weights and standards (time, background, weights
    of ordinary versus abnormal) must also be clarified.


    +   - **Identity management/authentication**: To be able to accumulate confidence
    related opinions, a model should be confident that the identities of those users
    are real.


    +   - **Data safety**: Trust management and applicable models are employed as
    part of the total security management strategy of this cloud. A trust model must
    define the minimum prerequisites for attaining an acceptable degree of information
    security. The SLA ought to be a part of this trust management procedure.


    Cloud computing has been among the most well-known technologies in information
