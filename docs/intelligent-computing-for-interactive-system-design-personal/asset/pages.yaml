    # 9.2.4.2 Collecting Data in the Lab


    Using the three devices described in Section 9.2.3 (development phone, capacitive
    sensing prototype, and multi-spectral sensor), we collected data from 15 participants
    (six females). Seventy-three percent of participants were between 20 and 39 years
    old and the rest were older.


    We asked participants to bring anything that they might normally put their phone
    into including jackets, purses, or other bags. We collected data from each participant
    in any of the following places that they report having kept their phone: front
    trousers pocket, back trousers pocket, jacket pocket, bag/purse, and hand. We
    chose these based on our phone placement survey responses. To increase the external
    validity of this study, we did not have participants put our sensing devices in
    places that they would not normally put their phone. While this meant that we
    would capture more data for some participants than for others, it also maximizes
    the realism of our collected data.


    For each place participants normally keep their phone, they completed a series
    of activities to simulate the various conditions that the device might encounter
    in everyday life while in the placement. For all placements except bag/purse,
    the activities were: sitting on a couch, sitting on a desk chair, standing in
    place, and walking around. We did not have participants sit for the back trousers
    pocket placement. For the bag/purse we had participants let the bag sit on the
    floor, stand while holding the bag, and walk while carrying the bag. Participants
    spent 20s on each activity. Because each device had at least one sensor that was
    directional (e.g., toward leg in a trouser pocket), we collected all data for
    each placement with each device facing both inward and outward. We collected from
    two devices at a time to minimize the number of trials.


    Unlike the other placements, most of the variation in placing a device on a surface
    involves finding a variety of surfaces. Thus, we collected the surface-specific
    data ourselves, following a similar process to the other placements: we recorded
    data from each device in the two orientations of facing-up and facing-down. In
    total we collected data for 18 surfaces, including tables, desks, chairs, couches,
    on and in a metal filing cabinet, and even on a pillow.'
