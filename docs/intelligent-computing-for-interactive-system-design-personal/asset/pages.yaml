  md: 'Family is close regardless of communication (17 of 58 contacts). Many misclassified
    participants were family members. Several participants described specific familial
    relationships from the perspective of obligation, which hinted at a greater underlying
    complexity. For example, one participant said that she refused to take her grandmother''s
    phone calls, stating that she calls too frequently and repeats herself. Yet, the
    participant still reported feeling very close to her grandmother. Another participant,
    the mother of an 11-year-old, said “of course I am close to him,” but that it
    is not necessary for them to talk on the phone. Another participant said her uncle
    was “definitely close, but he’s different from the other close people. He’s that
    really strict uncle that wants to tell me how to live my life, so I don’t talk
    to him too much, maybe every couple months.”


    **Interview summary.** These interviews highlight the limited effectiveness of
    the tie strength models. A major issue is the temporality of a relationship. In
    particular, the circumstances under which two people became close are not necessarily
    the same as the current circumstances of the relationship, even if the two people
    remain close. The communication logs only capture relatively recent behavior.
    Therefore, they do not contain the data that indicates a strong long-term relationship.
    The other main component is that there remains a large amount of interpersonal
    interaction that happens outside of phone calls and text messages, including communication
    in other media, as well as face-to-face communication. Call- and SMS-based models
    do not account for this.


    # 9.4 Conclusion


    The personal data available from mobile phones is an incredible source of contextual
    information, with the potential to say much about the individual who is the subject
    of that data. However, the gap between an idea for a contextual inference and
    the production-quality implementation of that inference is large, and the vast
    majority of these inferences are simply imperfect. The classifiers described in
    this chapter were far from perfect. While this should not necessarily dissuade
    you from developing a new personal context inference, it is important to go in
    with your eyes open. Carefully planning your approach can save you huge amounts
    of time (e.g., painstakingly collecting labeled data only to find that you needed
    different data), and can help to set realistic expectations for what your classifier
    will be able to accomplish.


    # 9.5 Follow-up Questions


    While we are unable to provide the data from these studies, you can still explore
    the realm of personal context inferences on your own. For example, you can collect
    some sensor data from your own phone using a data collection application such
    as'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Google''s Science Journal app (https://play.google.com/store/apps/details?id=com.google.android.apps.forscience.whistlepunk).
    You can use this to collect data from many sensors, not just accelerometer. Some
    questions to guide your exploration of phone placement:


    +   - How much sensor data do you need to collect and label before you can train
    an accurate model for phone placement?

    +   - How do the places that you keep your phone match up with the places we identified
    through our surveys and interviews?

    +   - Can you get your classifier to perform better if you merge some labels together
    (e.g., like we did with enclosed/not enclosed)?

    +   - Can you add other features, such as time of day or location, to improve
    your model?

    +   - How does your model perform when you train it on your data and also test
    it on your own data? How does that compare to training it with your data and testing
    it with a friend or classmate?

    +   - Can you purposefully trick the classifier into thinking you put your phone
    somewhere that you didn''t?


    Training classifiers for tie strength from just your own data is challenging for
    all of the reasons described in Section 9.3.6, and asking somebody else for their
    data can be problematic from a privacy perspective. However, one interesting possibility
    is to use your own data to classify life facet. You could start by labeling just
    a couple of your contacts to see how it performs on the remaining unlabeled contacts.
    There are apps in the app store that will let you download your communication
    data in a file. You can also get access to some of your own data by downloading
    it from social networking sites (e.g., Facebook lets you download some of your
    own data).


    +   - How much training data do you need in order to classify life facets using
    your own data?

    +   - What features do you think will be most useful given our results?

    +   - Since you are *the* expert on your own social relationships, what features
    would you change or add to improve these models? Do they improve the inference?
    Do you think they will work on other peoples'' data as well?


