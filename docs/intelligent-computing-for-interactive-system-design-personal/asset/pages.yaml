    # 9.3.8.3 Error Analysis Participant Interviews


    We wanted to understand the reason for the particularly low recall of the strong
    tie class in these models. To do this we conducted semi-structured interviews
    with seven of our participants. For each participant, we selected five to ten
    contacts they had labeled as strong ties that we misclassified as weak ties (58
    contacts total). Interviews took place over the phone, lasted about a half an
    hour, and were recorded to facilitate note taking. We asked participants open-ended
    questions about the nature of their relationship and communication with each selected
    contact:


    +   - When and how did you meet this person?

    +   - What led to this being a close relationship?

    +   - Has anything changed between the time that you became close and now?

    +   - Was there anything different about the channels that you used to communicate
    with this person or the frequency of communication that you used with this person
    between then and now?


    Several themes surfaced that help explain the discrepancy between communication
    frequency and tie strength.


    **Communication channel.** We used to talk on the phone more when we first became
    close (seven of 58 contacts). In these cases, participants indicated that they
    spoke on the phone more frequently before, but that they speak on the phone less
    frequently now, mostly just to catch up. In some cases, this seemed to be a result
    of a change in life stage (either for the user or for their contact) and/or a
    change in their geographic location. For example, one participant complained that
    he used to'
