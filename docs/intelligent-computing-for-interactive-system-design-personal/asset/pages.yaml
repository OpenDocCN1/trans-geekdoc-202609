- pgno: 17
  md: '# ## 9.3 Inferring Social Relationships from Communication Behavior


    The previous section explored one, fairly low-level, type of personal context.
    Another very different type of context is the context of a social relationship.
    For a particular contact in your phone, how do you know that individual and how
    close are you to them? The context of a social relationship can be used for filtering
    the information that is presented in an interface, prioritizing email messages,
    or even for automatically determining privacy settings [Wiese et al. 2011]. In
    this work, our goal was to develop models to infer social closeness and life facet
    from call logs, SMS message logs, and the contact list available on smartphones.
    The example described in this section was published in Min et al. [2013] and Wiese
    et al. [2015] and reuses some of the text published in that paper. Again, we start
    by asking the core questions.


    # ### 9.3.1 Q1: What Am I Actually Inferring?


    There are two types of information about a social relationship we wanted to infer
    in this project. First was life facet: where you know somebody from, or what part
    of your life they fit into now. Second was tie strength: how close you feel to
    that person.


    For life facet, we started with 11 different categories, which we then sorted
    into three life facets: family (immediate family, extended family, and significant
    other), work, and social (neighborhood, religious, family friend, knowing through
    somebody else, school, hobby, and others). We selected the names of these sub-categories
    by combining several sources [Hill and Dunbar 2003, Spencer and Pahl 2006, Kelley
    et al. 2011, Wiese et al. 2011], aiming to strike a balance between comprehensiveness
    (for richness of data) and simplicity (to prevent errors and minimize burden for
    participants). Ultimately, we decided that we would infer the three life facets
    rather than the sub-categories. Part of this decision was because of the amount
    of training data we had for different sub-categories, but also because of the
    complexity and low performance we would expect from an 11-class classifier.


    The nature of tie strength poses a challenge for building this model. Tie strength
    could be treated as a numeric class value based on the answers to the tie strength
    questions. However, the difference between a rating of 1 and 2 is not necessarily
    equal to the difference between a rating of 2 and 3. Therefore, we used the tie
    strength levels of very strong tie, medium strong tie, and weak tie as nominal
    class values in these models.


    We assigned those class labels as follows, based on previous work [Zhou et al.
    2005]:


    +   - strong tie—the top group (rank 1–4)'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   * medium tie—the middle group (rank 5–19)


    +   * weak tie—the remaining contacts


    We further decided to explore both binary and ternary classifiers for the tie-strength
    problem:


    +   * 3-class: classifies as strong, medium–strong, or weak


    +   * 2-verystrong: binary classifier that combines medium–strong and weak ties
    into one class


    +   * 2-mediumstrong: binary classifier that combines strong and medium–strong
    ties into one class


    # ## 9.3.2 Q2: What Is the End Goal for this Classifier?


    Similar to the work described in Section 9.2, the primary goal of this project
    was research: the plan was not to develop a model or system and deploy this to
    the wild, but rather to just characterize the problem space and show that it was
    possible and how well it performed. However, if the work was particularly successful,
    the classifiers trained here might facilitate additional research to explore some
    of the hypothesized applications (e.g., following up the previous work we had
    been doing on the association between these dimensions of relationships and privacy
    preferences [Wiese et al. 2011]).


    # ## 9.3.3 Q3: What Data Do I Need, What Data Do I Want?


    To develop these classifiers, our plan was to use call logs, text message logs,
    and the contact list on phones running the Android operating system. Unfortunately,
    at the time that we were doing this study there were some limitations to this
    data. In particular, by default Android (Alphabet Inc., Mountain View, CA, USA)
    phones limited the call log to the last 500 calls and typically have a default
    limit of 200 SMS messages per contact. This resulted in broad differences in how
    many days the logs represented (range: 21–369; median: 80; mean: 108). This represents
    a serious limitation to the dataset, but it would be difficult to have collected
    more data without running a longer-term data collection. Another challenge was
    that contact lists have many fields, but in practice the data in the contact list
    is fairly sparse. To protect privacy, we did not collect the content of SMS messages.
    However, we did collect descriptive information such as email domain name, first
    six digits of phone numbers, and city/state/zip code.


    Another aspect of deciding which data to collect was to determine which of a participant''s
    contacts to get ground truth labels for. The vast majority of any individual''s
    contacts will be weak ties, and so random sampling is unlikely to turn'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'up medium and strong ties. However, in this work, we wanted to maximize the
    likelihood of collecting information on strong ties. To accomplish this, we asked
    participants to generate a list of contacts that fit specific social categories,
    regardless of their appearance in the phone contact list. Participants listed
    five people in each of the following categories: immediate family, extended family,
    people they live with, coworkers, people they feel close to, and people they do
    hobbies with. We selected these groups based on past qualitative work that suggests
    these categories will contain an individuals'' strong ties, and people from different
    life facets [McCarty 2002, Spencer and Pahl 2006, Wiese et al. 2011]. In the end,
    each participant ended up with a list of 70 contacts that were a mixture of the
    names they gave us, contacts they had contacted frequently in the data we collected,
    and names chosen randomly.


    In addition to the communication log and contact data and the class labels described,
    we decided to collect some additional data from our participants, including some
    data we thought might be easily collectable in the future. Participants provided
    demographics for each contact in the 70-person list, such as sex, age, and relationship
    duration.


    Finally, because of the difficult-to-define nature of tie-strength, participants
    also answered four questions about their relationship with each contact, adapted
    from Marin and Hampton [2007]:


    +   1. How close do you feel to this person?

    +   2. How strongly do you agree with the statement “I talk with this person about
    important matters”?

    +   3. How strongly do you agree with the statement “I would be willing to ask
    this person for a loan of $100 or more”?

    +   4. How strongly do you agree with the statement “I enjoy interacting with
    this person socially”?


    # **9.3.3.1 Defining Features**


    The real complexity of the communication data is clear when we consider how we
    will turn that data into features used to train the model. To start, we defined
    five factors that characterize communication patterns in the context of life facets
    and tie strength: intensity, regularity, temporal tendency, channel selection/avoidance,
    and maintenance cost.


    **Intensity and regularity:** The number of and duration of communication actions
    has been used to predict tie strength in past work [Hill and Dunbar 2003, Roberts
    and Dunbar 2011]. For example, voice calls were very common for family'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'relationships. Meanwhile, office interactions and personal interactions show
    different regularity [Do and Gatica-Perez 2013].


    **Temporal tendency**: In their friends-acquaintances work, Eagle and Pentland
    [2006] observed the temporal tendency in contacting people. Our participants called
    their family, work, and social contacts at different times of day and days of
    the week. For example, people frequently called their family members in the afternoon
    (12pm–3pm) and evenings (3pm–6pm), and contacted social friends more on Friday
    afternoon. They were less likely to call work facet contacts on the weekend.


    **Channel selection and avoidance**: People tend to favor a certain communication
    medium based on the person they are communicating with [Mesch 2009]. According
    to our survey result, participants communicated via face-to-face, calls, text
    messages, and Facebook with different priorities based on the relationship of
    the contact.


    **Maintenance cost**: Roberts and Dunbar [2011] suggested that people apply different
    amounts of effort in maintaining different kinds of relationships, where effort
    (cost) can be evaluated based on the time to last contact between two individuals.
    However, this value could be smaller than the actual cost by chance according
    to the data collection date. To minimize this coincidence, we measure the number
    of communications in the past 2 weeks (short-term view) and in the past 3 months
    (relatively long-term view) as the maintenance cost of the given relationship.
    In the following section, we describe how we operationalized these categories
    into specific machine learning features.


    We defined 153 features from mobile data: 17 from phonebook, 66 from call logs,
    36 from message logs, and 34 from communication (call + message) logs (see Table
    9.4).


    **Phonebook contact-profile features (profile features)**: We measured the similarity
    between our participants and their contacts in terms of last name, email domain,
    first six digits of phone number (area code + exchange), and company name. For
    email domain, we excluded several popular free-hosting domains, such as @gmail.com.
    We also captured the labels on each contact’s phone numbers, such as home, work,
    mobile, and other, which are pre-defined in Android. Since only a few participants
    had their own and contacts’ postal address in the phonebook, we simply checked
    if the contact’s postal address exists, and measured a binary feature for each
    label (home, work, and other) of the address. We also had additional binary features
    for additional contact information, such as ringtones, notes, or if the contact
    was marked as a favorite in the Android contact list.'
  merge: -1
  img_proc: true
