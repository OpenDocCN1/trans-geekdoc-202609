  md: '# 9.2.8.2 Modeling Phone Placement from Additional Sensors in the Lab


    We collected additional data in the lab, as described in Section 9.2.3. We extracted
    features from the accelerometer facing one direction and our other sensors facing
    two directions. This allowed us to simulate a device with sensors on two sides.


    Following Harrison and Hudson''s [2008] approach, our multi-spectral features
    are one reading from each of the light-to-frequency converter and photo resistor
    for each of no-light, red, blue, green, UV, and IR. For the light and proximity-sensor
    on the phone, we took the mean over the 20s window of the ambient-light level
    and the binary proximity state. Lastly, we took the mean over a 1s window at each
    "pixel" in the capacitive sensing grid and computed three features over the grid:
    mean over pixels, median pixel value, number of non-zero pixels (pixels with some
    capacitance sensed). We used the same accelerometer features over a 1s window
    as in the ESM study from the previous section.


    Our classification technique and evaluation followed that of the ESM study: a
    leave-one-participant-out cross-validation, where we counted each person or surface
    as a separate participant. We analyzed the lab study data by addressing the same
    classification tasks that we identified for the ESM study: Enclosed or Out, On
    Person or Not, and In Bag, In Pocket, Out or In Hand. In addition, we trained
    each of these models with different combinations of data sources: each of them
    individually, then the new data sources combined with accelerometer data. Our
    goal in doing this was to understand the value of the additional sensors on top
    of the accelerometers that are already common on devices.


    Like the ESM data, we constructed Enclosed or Out models using Weka''s SMO SVM
    with a polynomial kernel. When we experimented with pilot data, we discovered
    that the On Person or Not and In Bag, In Pocket, Out or In Hand problems were
    classified much better using Weka''s implementation of Random Forest [Breiman
    2001], which is a collection of decision trees as described in Section 4.2.2.3.
    Thus, we employ a Random Forest classifier for those problems in our lab study.


    Table 9.3 gives an overview of the accuracies from these models. From these results
    we can see some interesting trends:


    +   1. Enclosed or Out: Perhaps unsurprisingly, the phone''s light and proximity
    sensor seems to be the most useful sensor for classification, yielding an average
    accuracy of 98%. Beyond this, there seems to be some evidence that the accelerometer
    can help to disambiguate the few errors made using light/proximity only, even
    achieving 100% accuracy in one case.


    +   2. On Person Or Not: By contrast, when classifying whether or not the phone
    was on the participant, the light/proximity sensor performed the worst of each
    of the individual sensors (71%). In this case, the capacitive sensor was'
