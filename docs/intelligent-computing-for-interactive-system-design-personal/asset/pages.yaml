    we built a prototype capacitance-sensing device similar to that of Saponas et
    al. [2011]. Our device reports a raw capacitance signal from a 10 x 20 grid at
    roughly 100Hz. The device was designed in a form factor similar to that of today''s
    mobile phones (see Figure 9.2, left).


    Multi-spectral sensor: One way to detect where the phone is placed is to gain
    information about the material that the device is up against. Following as closely
    as we could to the approach taken by Harrison and Hudson [2008], we constructed
    a sensing device comprising red, green, blue, ultraviolet (UV), and infrared (IR)
    light-emitting diodes (LEDs), a photo resistor, and a TSL235R light-to-frequency
    converter (Figure 9.2, right). The device was controlled by an Arduino Pro Mini
    (Arduino LLC, Boston, MA, USA), logging readings from the two sensors to an onboard
    microSD card. While the current form of the device does not fully satisfy our
    criterion of not disturbing the user, we believe that a carefully engineered version
