    |


    Finally, we calculated the completion of each profile. This serves as a weak proxy
    to measure the user''s effort in filling in the contact information. Android phones
    can automatically fill contact list data by syncing with online social networking
    service (SNS) such as Google+ [Alphabet Inc., Mountain View, CA, USA] and Facebook
    (Facebook Inc., Menlo Park, CA, USA). In our 70-contact list data set, 50% of
    mobile contacts had photos, suggesting that about a half of participants used
    auto-sync. Interestingly, we still found that the majority of contacts had less
    than three profile attributes, including name, a phone number, and an email address.
    Thus, more contact information could still be a potentially useful signal.


    **Call features:** We created several features to examine the intensity of voice
    communications, including total number of and duration of calls for each contact.
    We counted the number of lengthy calls, in which their duration is twice the average
    duration. To measure the regularity of calls, we calculated five statistical values
    (AVG, SD, MIN, MAX, and MED) for the number of calls per week. For the duration
    of calls, we calculated AVG and MAX to measure a simple regularity and burstness,
    respectively. We also measured users'' channel selection and avoidance behaviors
    by calculating the ratio of outgoing calls, failed (duration <5s) calls, and missed
    calls. Temporal tendency and maintenance cost were also extracted from call logs
    as shown in Table 9.4.


    **Message (MSG) features:** We defined many message features similar to the call
    features as shown in Table 9.4. Here, we counted the length of MMS as 160 characters,
    which is the maximum length of an SMS. With their large-scale text messaging'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'study, Battestini et al. [2010] applied a time metric of a 20min response time
    to group messages together as a conversation. We used this metric to capture the
    ratio of replied messages.


    **Communication (COMM) features**: Messages frequently involve other communication
    channels [Battestini et al. 2010]. For example, people often call back using voice
    in response to an SMS. Therefore, we considered calls and messages equally as
    the COMM features. For the intensity, regularity, and channel selection features,
    we calculated total #COMMs, the #days had COMMs/days logged, and the ratio of
    calls (#calls/total COMMs), respectively. We also had features checking COMMs
    on 4 days that, in the U.S., often carry some kind of meaning. These days included
    Thanksgiving, Christmas, New Year''s Day, and Valentine''s Day. Finally, we extracted
    four features from survey results, such as same gender, age difference, is-Facebook
    friend, and frequency seen, referring to them as the survey features (see Table
    9.4). Current smartphones do not have these data, but we included these as features
    since some of the information could be obtained from today''s SNS, and others
    could be captured by future smartphones. For example, demographic information
    such as gender and age can be automatically retrieved from Facebook profiles (or
    estimated from smartphone usage patterns [Altshuler et al. 2012]), and face-to-face
    communication could be detected by using Bluetooth proximity [Do and Gatica-Perez
    2013], or GPS co-location [Cranshaw et al. 2010].


    # 9.3.4 Q4: Where Will My Training Data Come from, and Is It Good Enough?


    Different people have different types of social relationships, and we wanted to
    maximize the likelihood that we would reach a diverse set of users. Toward this
    end, we recruited 40 participants (13 males and 27 females) living throughout
    the U.S. by posting ads in several places: on Craigslist in six major U.S. cities,
    on a nationwide site for recruiting study participants, on a website for posting
    social relationship research studies, and on a participant pool within our university.
    In the end, 55% of our participants were students (graduate or undergraduate),
    35% were employed in a variety of professions, and 10% were unemployed. Participant
    ages ranged from 19 to 50 years (mean = 28.0 years, standard deviation [SD] =
    8.9). Participants downloaded our Android app, which copied their contact list,
    call log, and SMS log to a database file. Participants then uploaded this file
    to our server through a custom website that was designed for this study. The entire
    study was conducted through this website. Participants were instructed to complete
    the ground truthing within 2 weeks, and were compensated $80 USD.


    This is almost certainly not good enough for a production model, but for our purposes
    we were convinced it would be good enough to see if there is a signal in'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'this data or not. In the end, we had to weigh many tradeoffs to balance how
    many participants we had, how many contacts they would rate, and who would be
    incentivized to participate. This was a particularly hard dataset to collect because
    of the potentially sensitive data we were collecting and the amount of effort
    that went into providing the ground truth.


    # 9.3.5 Q5: What Are the Privacy and Ethical Implications of Developing this Classifier?


    One of the issues with developing these classifiers was the sheer volume of sensitive
    data we were asking for from our participants. While we had institutional review
    board (IRB) approval from our university''s IRB, ultimately we were asking for
    our participants to trust us with their communication records.


    There are also some serious implications to consider if the classifier ends up
    working well. Having this kind of contextual information about a person''s relationships
    can be very valuable for certain types of social engineering attacks. Another
    issue is that, depending on how this classifier was used, it might be possible
    to be gamed. For example, if the classifier is used to automatically determine
    privacy and sharing preferences, an adversary could potentially communicate with
    a target in such a way that the classifier is fooled into thinking the adversary
    should get access to data that they should not.


    Finally, there are potential ethical implications to knowing about an individual''s
    social support, especially if they do not have much support. For example, if someone
    is socially isolated they might be at risk for depression or self-harm behaviors.
    Or they might just have multiple phones, and so the data we have access to is
    an incomplete picture of the user''s social interaction. What responsibility does
    a developer or researcher have in this situation? Should they solicit help? Suggest
    that the user seek help? Simply ignore this information? While we were not planning
    to deploy this classifier, these concerns are real and complex.


    # 9.3.6 Q6: A General Classifier or Personal Classifiers?


    In the case of these classifiers, a personal classifier doesn''t make much sense,
    because these (life facet and tie strength) are things that are not likely to
    change, and if they do they will probably change slowly over a long period of
    time. Thus, having a personalized classifier to tell me who my four closest people
    are makes no sense—I know who those people are, and once I provide that training
    data to the classifier the classifier does not need to classify those contacts
    again. The value of this classifier is in a user never having to tell the phone,
    but the phone automatically inferring this information, and thus a general classifier
    makes more sense here.'
