    like sensor data that describes the user''s behavior and surroundings to very
    high level data (right side) that describes information about individuals that
    they might not even know about themselves. Information in the lower levels can
    often be directly sensed, but data higher on the continuum has to be provided
    manually or inferred from a combination of lower level data. Copyright © 2017
