  md: 'For each placement (e.g., pocket or desk), we collected data from our three
    prototypes in two orientations each (e.g., facing-in and facing-out). We assembled
    these six sensor recordings for each placement into a single virtual-recording.
    This simulates a virtual device with the union of sensing capabilities from our
    three prototypes. This means that a single instance of collected data included:
    capacitive data (facing forward and backward), multispectral data (facing forward
    and backward), phone light/proximity sensor data (facing forward and backward),
    and phone accelerometer readings. We only considered one set of phone accelerometer
    readings because the second set from the phone facing the other direction was
    redundant.


    # 9.2.5 Q5: What Are the Privacy and Ethical Implications of Developing this Classifier?


    While this classifier is a learning tool for us, rather than a production system,
    it''s still important to consider potential privacy or ethical implications. One
    such implication is that it may not occur to a user that you could infer this
    data from accelerometer readings. Thus, if a developer with this classifier requested
    access to accelerometer data without disclosing that they had this inference ability,
    that could be considered a privacy violation. Another potential issue is that
    it may be possible to infer other characteristics about an individual based on
    their placement behaviors. For example, we saw differences between the behaviors
    of men and women in the data that we collected. Therefore, this classifier could
    be used as a clue to the gender of the user, even if they have not disclosed that
    information. Finally, while we tried to collect data from a variety of participants,
    our sample population is not nearly representative of all of the different characteristics
    of the broader population. While this might have been okay for an initial research
    effort, it would be very irresponsible to only use this data to train a production
    classifier.


    # 9.2.6 Q6: A General Classifier or Personal Classifiers?


    In this project we focused on a general classifier for one reason in particular:
    the amount of data we collected. In addition, it would be desirable for many of
    these use cases for the classifier to work out of the box without any training
    by the user (i.e., the cold start problem). However, the data that we collected
    does suggest that personalized classifiers are likely to perform better than a
    general classifier. We identified different archetypes of users (i.e., different
    people have different priors for different classes). In addition, other contextual
    factors (e.g., location, time of day, calendar information) might be useful for
    an individual, but would be difficult to generalize across the population.'
