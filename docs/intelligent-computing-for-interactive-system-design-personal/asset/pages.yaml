    from Wiese et al. [2017].


    two different points on this continuum. First, Section 9.2 uses low level streams
    to infer a type of human-readable event: phone placement. Next, Section 9.3 uses
    call logs, text message logs, and the contact list to infer information about
    the user''s social relationships.


    # 9.1.2 Questions to Consider Before Developing a New Personal Context Inference


    The two examples described in the sections below demonstrate two very different
    opportunities for inferring personal context from mobile devices. The process
    of completing each of those projects was not simple: it required considerable
    planning and forethought. It can be tempting to jump right in and start training
    models right away. However, just as human–computer interaction (HCI) tells us
    we should think about design before starting to code an application, some forethought
    and planning is very important when inferring personal context. Some of those
    questions are listed below.


    # 9.1.2.1 Q1: What Am I Actually Inferring?


    Having a clear description of the specific thing that will be inferred is an important
    first step. Let''s say you want to develop an “Are people nearby?” inference.
    Is that a binary (yes/no) classifier, or is it guessing how many people are nearby?
    What does “nearby” actually mean? Within a certain distance? In the same room?
    How frequently will this inference change? Having a specific statement of what
    the inference really is will be essential background for answering the remaining
    questions.'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# 9.1.2.2 Q2: What Is the End Goal for this Classifier?


    It is important to identify the purpose for developing the classifier. Is the
    goal to show that it that it is possible and establish how well it might work?
    Or is the classifier going to be used in a production environment as a part of
    an application? If it will be deployed, is the inference going to be available
    programmatically to third-party developers, or only used within your own application?
    Understanding the end goal has implications for other aspects of development,
    such as the pipeline for collecting data from sources and the robustness of the
    resulting classifier. It can also have implications for tuning the model, for
    example, trading off between precision and recall.


    # 9.1.2.3 Q3: What Data Do I Need, What Data Do I Want?


    Next, it is important to consider what data source(s) you will use for the classification.
    There are many possible data sources: inertial measurement unit (IMU) sensors,
    location, phone state, app usage, and log data from many apps as well. Will the
    inference depend on having a long history of data in order to calculate features,
    or is an instantaneous measurement alright? For example, the tie strength and
    life facet classifiers described in Section 9.3 require having enough data in
    the call and SMS logs that features can be calculated from them. Without a minimum
    amount of data, the classifiers simply cannot function. By contrast, the phone
    placement model in Section 9.2 needed only instantaneous data.


    # 9.1.2.4 Q4: Where Will My Training Data Come from, and Is It Good Enough?


    Many ideas for inferring personal context break down when it comes to this question.
    Unlike many other types of inferences, personal context classifiers can seldom
    be calculated from an existing “big data” style dataset. A major reason for this
    is that the data labels can often be difficult to come by. For example, in the
    hypothetical “are people nearby?” classifier above, where does the data label
    come from? You could have the user label the data *in situ*, as we did in the
    work described in Section 9.2. In other situations, such as the relationship classifiers
    in Section 9.3, you could have the user label these *post hoc*. The challenge
    with inferring personal context is in the name: it’s *contextual*, which means
    that the data label depends on the individual *person* and the situation they
    are in. In some cases data labels might be able to come from someone other than
    the user (which can be costly and can introduce other issues), but much of the
    time they cannot.


    Another important aspect to consider for training data is its coverage. One way
    to think about coverage is to consider the question “What percentage of unique
    real-world situations does my training data cover?” In practice this is a very
    difficult question to answer, but breaking it down can make it a bit more tractable.'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'First, consider if there are systematic holes in the dataset with respect to
    a particular person. For example, if you’re depending on user-provided data labels,
    are there situations when the user might not provide any labels (i.e., while driving,
    while in a meeting, while watching TV). Next, consider how representative your
    training set participants are with respect to the broader population. What type
    of diversity might matter? Does the person’s job, age, living situation, culture,
    gender, or something else matter for this inference? While always important to
    consider, this is especially important when the classifier will ultimately be
    deployed in a production context. These types of oversights do happen in production
    environments. For example, the man in China who was wrongfully charged with jaywalking
    because his face appeared in an advertisement on the side of a bus, a situation
    that the training data had failed to account for¹. Another example occurred when
    an automatic image tagging solution offered by Amazon classified images of members
    of the US Congress (particularly people of color) as criminals². In this case,
    better training data might have helped the developers see that this was a model
    that should not have been developed at all. These are just two high profile examples
    of terrible situations that could have been avoided if the training data used
    to develop those models accurately reflected the diversity of potential users
    and contexts, but there are countless examples. There are many types of diversity
    in the pool of potential users and the responsibility is on you (the developer)
    to consider what types of diversity your particular model should account for.


    # **9.1.2.5 Q5: What Are the Privacy and Ethical Implications of Developing this
    Classifier?**


    Further building on the previous point, it is essential to consider the privacy
    and ethical implications of developing a model or a classifier. Just because we
    are not especially good at foreseeing the negative consequences of our work, does
    not mean we should not try. As a field, computing is coming up against the reality
    that the technology we develop can be used for purposes other than those we initially
    intended.


    On an even more basic level, users are unlikely to be able to anticipate what
    you can do with their data. For example, an application can ask for access to
    the user’s accelerometer, which seems pretty innocuous. But if that application
    uses that data as an input into a “how intoxicated are you?” classifier [Gharani
    et al.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '[2017], that data just became *much* more sensitive. In these situations, it
    is important to give users both notice (i.e., explaining what you will do with
    that data) and choice (i.e., an option not to use that feature). Even this can
    be complicated and can lead to inequity and other issues.


    # ## 9.1.2.6 Q6: A General Classifier or Personal Classifiers?


    Next, are you going to train one classifier that generalizes across all users,
    or a classifier that is personalized to each user? These are two extremes: the
    generalized classifier is ready out of the box, but can never adapt or change
    to the particular situation of the user. However, the completely personalized
    classifier will not work until it has enough data. In these cases, something in
    the middle may be preferred. One approach is to launch a service based on a generalized
    classifier, but to collect training data and retrain the model once it has been
    deployed to the user.


    # ## 9.1.2.7 Q7: What Happens When the Classifier Is Wrong?


    Finally, it is important to consider what will happen when your classifier infers
    context incorrectly, which it inevitably will do at least some of the time. Does
    the application misbehave in these cases? Does it give the user the ability to
    fix the incorrect inference? Or to disable the functionality that is connected
    to the classifier? It is important to consider what is the worst case scenario
    for an incorrect inference from your classifier, and what steps can you take to
    address its negative impacts?


    # ## 9.1.3 Summary


    The questions outlined provide a guiding framework to consider different projects
    focused on inferring personal context from mobile phones. The following two sections
    describe two research projects at different places on the continuum in Figure
    9.1 from this perspective.


    # ## 9.2 Example: Inferring Phone Placement


    One opportunity for inferring personal context from a mobile phone is to infer
    specific aspects of context about the phone, which in turn can be relevant for
    personal context. One such example is to infer where the phone has been placed.
    This can be useful as an aid to a flexible authentication system [Hayashi et al.
    2013], it can be a useful context for interpreting the output of another sensor
    [Singla et al. 2018], or as a factor in a dynamic notification scheme [Weber et
    al. 2016, Komninos et al. 2018]. The example described in this section was published
    in Wiese et al. [2013], and reuses some of the text published in that paper.'
  merge: -1
  img_proc: true
- pgno: 6
  md: "# 9.2.1 Q1: What Am I Actually Inferring?\n\nIf we're going to build a phone\
    \ placement classifier, the first question to ask is what are the possible classes\
    \ that we want to infer. In other words, “Where do people actually keep their\
    \ phones?” We need to know what the possible labels are so that we can collect\
    \ the appropriate data. We could try to enumerate this list on our own, but then\
    \ we’re subjecting the classifier to be biased toward our own experiences. I’m\
    \ one particular type of phone user, and if I enumerate this list myself, it’s\
    \ subject to the bias of my own experience. Another way to answer this question\
    \ is to try to find an answer in the literature. If the literature does not have\
    \ an answer, it’s worth the time and effort to come up with an answer that is\
    \ based on more than just the experience of myself and my collaborators. In this\
    \ project, we did that with interviews, surveys, and *in-situ* data collected\
    \ through the experience-sampling method (ESM, see Larson and Ciskzzentmihalyi\
    \ [2014]).\n\nWe began our investigation of phone placement with 50 short, semi-structured\
    \ interviews with desk-based office workers in their usual office setting at our\
    \ company. We approached participants in their offices and if they agreed to participate\
    \ we asked:\n\n+   1. What was the current location of their mobile phone?\n+\
    \   \n+   2. Where they normally keep the phone at work, at home while sleeping\
    \ and awake, in the car, and while out walking around?\n+   \n+   3. How they\
    \ decide where to put their phone?\n+   \n+   4. In how many of ten pre-identified\
    \ places had they ever put their phone, and which of those places had the phone\
    \ been in during the past 24h?\n\nFor question 4, we used past literature to suggest\
    \ places where people might keep their mobile devices [Ichikawa et al. 2005, Patel\
    \ et al. 2006, Dey et al. 2011]. In addition, we administered a modified version\
    \ of this same survey (omitting the “right now” question) to participants in our\
    \ ESM and lab studies described below (some participated in both and were only\
    \ interviewed once). We had a total of 93 (37 female) office worker participants\
    \ (OWork).\n\nTo understand the broader generalizability of our results, and avoid\
    \ any possible bias from an internal office worker population, we deployed a survey\
    \ based on our interview questions on Amazon’s Mechanical Turk (MTurk) to 600\
    \ participants (242 females) located in the United States (U.S.), see Egelman\
    \ et al. [2014] for a good overview of using crowdsourcing platforms to collect\
    \ study data.\n\nWe captured a broad variety of places that people place their\
    \ phones, which we further categorized into bag, car, out, and pocket (see Table\
    \ 9.1 for an exhaustive list)."
  merge: -1
  img_proc: true
