    # 9.2.4 Q4: Where Will My Training Data Come from, and Is It Good Enough?


    There are many factors to consider when collecting training data. One major trade-off
    was between the external validity of the data (collecting real data from a range
    of people in real situations) and the ability to explore data sources that are
    not available on consumer devices (described already). Thus, we decided to do
    two different data collections—one in-the-wild and one in-the-lab. This allowed
    us to explore the classification problem from two different angles. Collecting
    and labeling the data in-the-wild is a significant challenge. We describe both
    data collections here.


    # 9.2.4.1 Collecting In-situ Labeled Data


    To collect sensor data in situ we used the ESM (see Larson and Csikszentmihalyi
    [2014] for a thorough description) to collect accelerometer data from 32 participants’
    personal smartphones in conjunction with a ground-truth label describing the phone’s
    placement. These in-situ labels complement the retrospective self-report data
    from the phone placement interviews. While interview participants were undoubtedly
    as complete as possible, in-situ survey data enriches our understanding of where
    users choose to keep their phones.


    We built a data collection application, Where’s Your Phone? (WYP) on the Windows
    Phone 7.5 platform (Microsoft Corporation, Redmond, WA, USA). WYP collects 10s
    of accelerometer data (three dimensions at 50Hz) roughly every 30min. It then
    prompts the participant to answer “Where was your phone at XX:XXpm?” Below this
    question, participants were given six choices including Other and I Don’t Know.
    Each category had a few sub-categories (see Table 9.1 for all 23 sub-categories).
    We chose categories based on the phone placement interview responses to minimize
    the number of situations when ESM participants would need to enter free-text Other
    responses.


    Unanswered surveys expired when the next set of accelerometer data was collected
    and unlabeled accelerometer data were deleted. Participants specified a bedtime
    at which WYP turned off and a wake time at which it resumed. Participants could
    also “snooze” WYP for up to 2h at a time. Survey responses and corresponding accelerometer
    data were automatically uploaded to a server.


    We recruited 32 participants (16 males, 16 females) from a Windows Phone 7.5 email
    list. Fifty-nine percent of participants were between 20 and 39 years old and'
