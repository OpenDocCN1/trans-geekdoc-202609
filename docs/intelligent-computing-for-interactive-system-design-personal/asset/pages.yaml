    # ## 9.2.7 Q7: What Happens When the Classifier Is Wrong?


    Given the results in the next section, it is clear that this classifier is going
    to be wrong fairly often. This has implications for the types of situations that
    the classifier should be used in. In some sense, the results of the classifier
    are more of a _noisy contextual hint_ than a reliable inference of context. For
    the purposes of demonstrating feasibility and establishing a baseline, this is
    fine. However, you probably wouldn''t want this classifier to be making decisions
    about when your phone should or shouldn''t be silent: you might miss a call or
    interrupt someone giving a presentation because of a missed classification.


    # ## 9.2.8 Q8: How Well Does the Classifier Perform?


    After asking and answering all of these questions, we''re ready to build and evaluate
    the classifiers. How do they perform with all of the data we''ve collected?


    # ### 9.2.8.1 Modeling Phone Placement from In-situ Data


    We used the labeled accelerometer data collected _in situ_ by our ESM participants
    (see Figure 9.3 for an example). Using techniques from Chapters 2 and 3, we extracted
    the following features over each axis of 1s windows of accelerometer data as inspired
    by previous work [Kunze et al. 2005, Shi et al. 2011, Tsai et al. 2011, Vahdatpour
    et al. 2011]:


    +   - mean; variance; root mean square (RMS): ($\sqrt{\frac{1}{N} * \Sigma_i x_i^2}$)

    +   - interquartile range; 25%, 50%, 75% quartiles (see Section 2.5.2.2)

    +   - the sum of detail coefficients across the first five wavelet levels


    We used these features to evaluate models for three classification problems (following).
    All models were built using the Weka Toolkit''s sequential minimal optimization
    (SMO) support vector machine (SVM) with a polynomial kernel [Hall et al. 2009].
    See Section 4.2.2.2 for an explanation of SVM. We chose these features and the
    SMO algorithm by experimenting with pilot data we collected earlier. The results
    are reported from a leave-one-participant-out cross-validation. This approach
    to cross-validation is useful for making sure that we do not train and'
