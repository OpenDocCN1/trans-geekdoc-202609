  md: '# # Authors'' Biographies


    # ## Parisa Eslambolchilar


    ![](img/37b9feea690424a4c981364f15c3ffa2_36_0.png)


    **Parisa Eslambolchilar** received a BEng degree in Hardware Engineering from
    the University of Amirkabir, Tehran, in 1999, and a Master''s in Engineering in
    Robotics and AI from the University of Tehran, Iran in 2002 and a PhD degree in
    Computer Science from the Hamilton Institute, National University of Ireland,
    Maynooth in 2007. In March 2007, she joined the Computer Science Department of
    Swansea University as a lecturer. In March 2017, Parisa started her new post as
    a Senior Lecturer in the School of Informatics and


    Computer Science at Cardiff University. She is currently a Reader in Human-Computer
    Interaction (HCI) at Cardiff University and leads the Complex Systems Research
    Group and the Human Factors Technology Research Priority Area at the School.


    Parisa''s research interests include HCI, ubiquitous computing, and designing
    interactive systems to support self-reflection, self-monitoring, feedback (audio,
    haptic, visual, and soma), persuasion, immersion, and navigation. Her work exploits
    the Internet of Things (IoT), wearables, smartphones, augmented reality, and virtual
    reality.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Andreas Komninos


    ![](img/37b9feea690424a4c981364f15c3ffa2_37_0.png)


    Andreas Komninos has a BSc (Hons) in Computer Studies from Glasgow Caledonian
    University (2001) and a PhD (Computer and Information Science, 2005) from the
    University of Strathclyde, UK. He has worked as a Lecturer at Glasgow Caledonian
    University, specializing in Mobile and Ubiquitous Computing (2005–2013), as an
    adjunct faculty member at the Hellenic Open University, the University of Patras
    and the Technological Educational Institute (2010–2019). He has also worked as
    a post-doctoral researcher in projects related to Mobile and Ubiquitous Computing
    at


    the University of Strathclyde (UK), the Computer Technology Institute and Press
    “Diophantus” and the Industrial Systems Institute (Greece) between 2013 and 2020.
    He is currently an Assistant Professor in Network-Centric Systems at the Computer
    Engineering and Informatics Department, University of Patras, Greece.


    Andreas'' research interests focus on interactive and context-aware mobile and
    ubiquitous computing systems, that leverage sensors, the IoT and machine learning
    technology. He has worked and published scientific papers in a range of domains,
    including mobile and smartwatch text entry, multimodal navigation, the IoT and
    sensor-based systems, and augmented reality. His published work and professional
    information can be found at http://www.komninos.info.


    # Mark Dunlop


    ![](img/37b9feea690424a4c981364f15c3ffa2_37_1.png)


    Dr Mark Dunlop is a Senior Lecturer in Computer Science in the Department of Computer
    and Information Sciences at the University of Strathclyde. He received his BSc
    (Hons) and PhD degrees from the University of Glasgow in 1988 and 1991, respectively.
    He has held academic posts at the universities of Glasgow, the West of Scotland
    and, currently, Strathclyde in addition to a senior researcher post at the Risø
    Danish National Laboratory. He is an associate editor for the journals Personal
    and Ubiquitous Computing and International Journal of'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Mobile Human Computer Interaction, and is a member of the international steering
    committee for ACM MobileHCI (having co-founded the conference series in 1998 and
    acted as both local-chair and program-co-chair). He has been a chair of the ACM
    CHI Usability and User Experience committee and has also acted as an expert witness
    in mobile usability patent cases in Australia and the United States.


    Mark''s research focuses on the usability of mobile systems including sensor and
    crowd-source driven interaction, smarter text entry, and fitness/digital health
    applications of mobile HCI research. He follows a strong user-centered approach
    with elements of participatory design and formal usability experimentation. His
    teaching focuses around HCI and mobile application development.'
  merge: -1
  img_proc: true
