    ### Call features

    We created several features to examine the intensity of voice communications,
    including total number of and duration of calls for each contact. We counted the
    number of lengthy calls, in which their duration is twice the average duration.
    To measure the regularity of calls, we calculated five statistical values (AVG,
    SD, MIN, MAX, and MED) for the number of calls per week. For the duration of calls,
    we calculated AVG and MAX to measure a simple regularity and burstness, respectively.
    We also measured users'' channel selection and avoidance behaviors by calculating
    the ratio of outgoing calls, failed (duration <5s) calls, and missed calls. Temporal
    tendency and maintenance cost were also extracted from call logs as shown in Table
    9.4.


    ### Message (MSG) features

    We defined many message features similar to the call features as shown in Table
    9.4. Here, we counted the length of MMS as 160 characters, which is the maximum
    length of an SMS. With their large-scale text messaging study, Battestini et al.
    [2010] applied a time metric of a 20 min response time to group messages together
    as a conversation. We used this metric to capture the ratio of replied messages.


    ### Communication (COMM) features

    Messages frequently involve other communication channels [Battestini et al. 2010].
    For example, people often call back using voice in response to an SMS. Therefore,
    we considered calls and messages equally as the COMM features. For the intensity,
    regularity, and channel selection features, we calculated total #COMMs, the #days
    had COMMs/days logged, and the ratio of calls (#calls/total COMMs), respectively.
    We also had features checking COMMs on 4 days that, in the U.S., often carry some
    kind of meaning. These days included Thanksgiving, Christmas, New Year''s Day,
    and Valentine''s Day. Finally, we extracted four features from survey results,
    such as same gender, age difference, is-Facebook friend, and frequency seen, referring
    to them as the survey features (see Table 9.4). Current smartphones do not have
    these data, but we included these as features since some of the information could
    be obtained from today''s SNS, and others could be captured by future smartphones.
    For example, demographic information such as gender and age can be automatically
    retrieved from Facebook profiles (or estimated from smartphone usage patterns
    [Altshuler et al. 2012]), and face-to-face communication could be detected by
    using Bluetooth proximity [Do and Gatica-Perez 2013], or GPS co-location [Cranshaw
    et al. 2010].


    ## 9.3.4 Q4: Where Will My Training Data Come from, and Is It Good Enough?


    Different people have different types of social relationships, and we wanted to
    maximize the likelihood that we would reach a diverse set of users. Toward this
    end, we recruited 40 participants (13 males and 27 females) living throughout
    the U.S. by posting ads in several places: on Craigslist in six major U.S. cities,
    on a nationwide site for recruiting study participants, on a website for posting
    social relationship research studies, and on a participant pool within our university.
    In the end, 55% of our participants were students (graduate or undergraduate),
    35% were employed in a variety of professions, and 10% were unemployed. Participant
    ages ranged from 19 to 50 years (mean = 28.0 years, standard deviation [SD] =
    8.9). Participants downloaded our Android app, which copied their contact list,
    call log, and SMS log to a database file. Participants then uploaded this file
    to our server through a custom website that was designed for this study. The entire
    study was conducted through this website. Participants were instructed to complete
    the ground truthing within 2 weeks, and were compensated $80 USD.


    This is almost certainly not good enough for a production model, but for our purposes
    we were convinced it would be good enough to see if there is a signal in

