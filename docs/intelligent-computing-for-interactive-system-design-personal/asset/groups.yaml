    ### 通话特性

    我们创建了多个特性来检查语音通信的强度，包括每个联系人的总通话数和总通话时长。我们统计了长通话的数量，其时长是平均时长的两倍。为了衡量通话的规律性，我们计算了每周通话次数的五个统计值（AVG、SD、MIN、MAX
    和 MED）。对于通话时长，我们分别计算了 AVG 和 MAX 以衡量简单的规律性和突发性。我们还通过计算外拨通话、失败（时长 <5s）通话和未接来电的比例，衡量了用户的渠道选择和避免行为。时间倾向和维护成本也从通话日志中提取，如表
