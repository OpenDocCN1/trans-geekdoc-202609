    Other contacts in this category appear to be in relationships in decline, yet
    the feeling of closeness lingers. One participant spoke about reaching out to
    a friend multiple times without reciprocity: “I’d like to be friends, but it doesn’t
    work unless we both put in the effort.”


    In-person communication (11 of 58 contacts). Participants also identified people
    whom they mostly interacted with in person. A contact’s close proximity to the
