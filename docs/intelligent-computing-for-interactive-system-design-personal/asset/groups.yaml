    ## 作者简介


    ### Parisa Eslambolchilar


    ![](img/37b9feea690424a4c981364f15c3ffa2_36_0.png)


    **Parisa Eslambolchilar** 于 1999 年获得德黑兰阿米尔卡比尔理工大学（University of Amirkabir）硬件工程学士学位，2002
    年获得伊朗德黑兰大学（University of Tehran）机器人与人工智能工程硕士学位，以及 2007 年获得爱尔兰国立大学梅努斯分校汉密尔顿学院（Hamilton
    Institute, National University of Ireland, Maynooth）计算机科学博士学位。2007 年 3 月，她加入斯旺西大学（Swansea
    University）计算机科学系担任讲师。2017 年 3 月，Parisa 在卡迪夫大学（Cardiff University）信息学与计算机科学学院担任高级讲师的新职务。她目前是卡迪夫大学人机交互（HCI）读者，并领导该学院的复杂系统研究组和人因技术研究优先领域。


    Parisa 的研究兴趣包括 HCI、无处不在计算，以及设计支持自我反思、自我监测、反馈（音频、触觉、视觉和体感）、劝说、沉浸和导航的交互系统。她的工作利用物联网（IoT）、可穿戴设备、智能手机、增强现实和虚拟现实。


    ### Andreas Komninos


    ![](img/37b9feea690424a4c981364f15c3ffa2_37_0.png)


    Andreas Komninos 拥有格拉斯哥卡利多尼安大学（Glasgow Caledonian University）计算机研究荣誉学士学位（2001
    年）和英国斯特拉斯克莱德大学（University of Strathclyde）计算机与信息科学博士学位（2005 年）。他曾在格拉斯哥卡利多尼安大学担任讲师，专注于移动与无处不在计算（2005–2013
    年），并在希腊公开大学、帕特拉斯大学和技术教育学院担任兼职教职人员（2010–2019 年）。他还在 2013 至 2020 年期间，担任英国斯特拉斯克莱德大学、计算机技术研究所与出版社“Diophantus”以及希腊工业系统研究所移动与无处不在计算相关项目的博士后研究员。他目前是希腊帕特拉斯大学计算机工程与信息学系网络中心系统助理教授。


    Andreas 的研究兴趣专注于交互式和上下文感知的移动与无处不在计算系统，这些系统利用传感器、物联网和机器学习技术。他在包括移动和智能手表文本输入、多模态导航、物联网与传感器系统以及增强现实在内的多个领域工作并发表过科学论文。他的出版物和专业信息可在
    http://www.komninos.info 查找。


    ### Mark Dunlop


    ![](img/37b9feea690424a4c981364f15c3ffa2_37_1.png)


    Mark Dunlop 博士是英国斯特拉斯克莱德大学（University of Strathclyde）计算机与信息科学系计算机科学高级讲师。他分别于 1988
    年和 1991 年获得格拉斯哥大学（University of Glasgow）荣誉学士学位和博士学位。他在格拉斯哥大学、西苏格兰大学以及目前的斯特拉斯克莱德大学担任过学术职务，此外还在丹麦国家实验室（Risø
    Danish National Laboratory）担任高级研究员。他是《个人与无处不在计算》（Personal and Ubiquitous Computing）和《国际移动人机交互杂志》（International
    Journal of Mobile Human Computer Interaction）的副编辑，并是 ACM MobileHCI 国际指导委员会成员（他于
    1998 年共同创办了该会议系列，并担任过本地主席和项目联合主席）。他曾担任 ACM CHI 可用性与用户体验委员会主席，还在澳大利亚和美国的移动可用性专利案件中担任过专家证人。


    Mark 的研究专注于移动系统的可用性，包括传感器和众包驱动的交互、更智能的文本输入，以及移动 HCI 研究在健身/数字健康领域的应用。他遵循以用户为中心的方法，融入参与式设计和正式可用性实验的元素。他的教学围绕
    HCI 和移动应用程序开发展开。


