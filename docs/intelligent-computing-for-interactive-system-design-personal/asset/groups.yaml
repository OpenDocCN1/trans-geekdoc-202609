    The most successful class condition is 2-verystrong, followed by 2-mediumstrong.
    3-class performs the worst. This is typical of multi-class models, which usually
    take a performance hit compared to binary classifiers.


    The models incorrectly classified more strong ties as weak than were correctly
    classified as strong (in Table 9.6, the recall values for the strong tie class
    are the percentage of strong ties correctly classified). Also, about half of ties
    that were classified as strong were actually not strong (in Table 9.6, the precision
    values for strong ties is the percentage of contacts that were classified as strong
    ties who were actually strong ties). These misclassifications emphasize the weakness
    of using call and SMS logs to infer tie strength, and thus the problem with using
    those logs as direct proxies for tie strength. This result is even more pronounced
    in recall values for the strong tie class of the 2-verystrong models in Table
    9.6. The 2-verystrong-all model, the model with the best performance, only detects
    a third of strong ties.


    ### 9.3.8.3 Error Analysis Participant Interviews


    We wanted to understand the reason for the particularly low recall of the strong
    tie class in these models. To do this we conducted semi-structured interviews
    with seven of our participants. For each participant, we selected five to ten
    contacts they had labeled as strong ties that we misclassified as weak ties (58
    contacts total). Interviews took place over the phone, lasted about a half an
    hour, and were recorded to facilitate note taking. We asked participants open-ended
    questions about the nature of their relationship and communication with each selected
    contact:


    - When and how did you meet this person?

    - What led to this being a close relationship?

    - Has anything changed between the time that you became close and now?

    - Was there anything different about the channels that you used to communicate
    with this person or the frequency of communication that you used with this person
    between then and now?


    Several themes surfaced that help explain the discrepancy between communication
    frequency and tie strength.


    **Communication channel.** We used to talk on the phone more when we first became
    close (seven of 58 contacts). In these cases, participants indicated that they
    spoke on the phone more frequently before, but that they speak on the phone less
    frequently now, mostly just to catch up. In some cases, this seemed to be a result
    of a change in life stage (either for the user or for their contact) and/or a
    change in their geographic location. For example, one participant complained that
    he used to keep up with a friend much more regularly before that friend got married,
    and now they hardly speak at all. Change in life stage and change in geography
    are discussed more in the Relationship evolution section below.


    Other contacts in this category appear to be in relationships in decline, yet
    the feeling of closeness lingers. One participant spoke about reaching out to
    a friend multiple times without reciprocity: “I’d like to be friends, but it doesn’t
    work unless we both put in the effort.”


    In-person communication (11 of 58 contacts). Participants also identified people
    whom they mostly interacted with in person. A contact’s close proximity to the
    home seems to play an important role. One participant described talking to her
    neighbor opportunistically, when they see each other. Another detailed how she
    spoke with her 11-year-old son regularly, just not over the phone. Three participants
    described friends from classes and their dorm with whom they spoke when they saw
    each other.


    Extended family often fell into this category. Many participants reported primarily
    speaking with parents, siblings, and other family members in person. In one case,
    a participant reported going to her parents’ house a couple times per month, but
    mostly not calling her dad on the phone. In these cases, lack of communication
    logs did not mean lack of effort in maintaining the relationships. In discussing
    these contacts, some participants specifically mentioned making an effort to travel
    once a year to see each other, or making a special effort to get together when
    they do happen to be in the same place.


    Other communication channels (25 of 58 contacts). For some strong ties, participants
    noted that they communicate regularly, but not via phone calls or SMS. For several
    participants, communication with a contact happened almost exclusively using Facebook.
    Other participants used instant messenger, email, Skype (Skype Technologies S.A.R.L.,
    Luxembourg City, Luxembourg), or SMS replacements such as WhatsApp (WhatsApp Inc.,
    Mountain View, CA, USA) to stay in touch with close contacts.


    **Relationship evolution.** Different location or different life stage (27 of
    58 contacts). When asked what was different about their relationship between whether
    they became close and now, many participants responded immediately that either
    they or their contact had moved. Participants said that with the change in geography,
    the communication frequency had changed, but not the perception of closeness.
    The move was often triggered by a change in life stage (e.g., going to college,
    graduating, getting a new job). However, even without moves, a significant life
    stage change could trigger a communication change on its own (e.g., getting married
    or having a child).


    Family is close regardless of communication (17 of 58 contacts). Many misclassified
    participants were family members. Several participants described specific familial
    relationships from the perspective of obligation, which hinted at a greater underlying
    complexity. For example, one participant said that she refused to take her grandmother''s
    phone calls, stating that she calls too frequently and repeats herself. Yet, the
    participant still reported feeling very close to her grandmother. Another participant,
    the mother of an 11-year-old, said “of course I am close to him,” but that it
    is not necessary for them to talk on the phone. Another participant said her uncle
    was “definitely close, but he’s different from the other close people. He’s that
    really strict uncle that wants to tell me how to live my life, so I don’t talk
    to him too much, maybe every couple months.”


    **Interview summary.** These interviews highlight the limited effectiveness of
    the tie strength models. A major issue is the temporality of a relationship. In
    particular, the circumstances under which two people became close are not necessarily
    the same as the current circumstances of the relationship, even if the two people
    remain close. The communication logs only capture relatively recent behavior.
    Therefore, they do not contain the data that indicates a strong long-term relationship.
    The other main component is that there remains a large amount of interpersonal
    interaction that happens outside of phone calls and text messages, including communication
    in other media, as well as face-to-face communication. Call- and SMS-based models
    do not account for this.


