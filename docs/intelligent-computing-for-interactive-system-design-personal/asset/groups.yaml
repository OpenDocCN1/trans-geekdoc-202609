    ### 9.3.8.2 Tie Strength Classification


    We trained the tie-strength models using the Weka Toolkit''s [Hall et al. 2009]
    implementation of an SVM. We conducted a leave-one-participant-out cross-validation
    (each fold contained data from one participant). This prevents any anomalies within
    a particular participant''s data from causing a performance overestimate. We trained
    nine models, varying two aspects of input data. First we varied what the model
    was classifying (as described in Q1 between a ternary classifier and two different
    binary classifiers (first column of Table 9.6). Second, similarly to the life
    facet models, we also varied the input data for the classifier (second column
    of Table 9.6).


    Classification results vary considerably (Table 9.6), ranging from 46.28% (κ =
    0.179), to 91.55% (κ = 0.361). The κ statistic measures the agreement between
    predicted and observed categorizations, correcting for agreement that occurs by
    chance. Table 9.6 reveals clear trends. First, within each of the class conditions,
    classifiers perform best for all, second best for contactlist and worst for somecomm.
    Most of the contacts who are not in the contact list (thus excluded from contactlist
    models) or who have no communication history (thus excluded from the somecomm
    models) are not strong ties, and thus are easier to classify. As a result, the
    models that include them perform better.


