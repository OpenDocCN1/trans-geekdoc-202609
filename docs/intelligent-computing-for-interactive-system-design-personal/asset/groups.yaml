    - 2. Where they normally keep the phone at work, at home while sleeping and awake,
    in the car, and while out walking around?

    - 3. How they decide where to put their phone?

    - 4. In how many of ten pre-identified places had they ever put their phone, and
    which of those places had the phone been in during the past 24h?


