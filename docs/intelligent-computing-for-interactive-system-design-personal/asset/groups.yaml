    ### 9.2.1 Q1: What Am I Actually Inferring?


    If we''re going to build a phone placement classifier, the first question to ask
    is what are the possible classes that we want to infer. In other words, “Where
    do people actually keep their phones?” We need to know what the possible labels
    are so that we can collect the appropriate data. We could try to enumerate this
    list on our own, but then we’re subjecting the classifier to be biased toward
    our own experiences. I’m one particular type of phone user, and if I enumerate
    this list myself, it’s subject to the bias of my own experience. Another way to
    answer this question is to try to find an answer in the literature. If the literature
    does not have an answer, it’s worth the time and effort to come up with an answer
    that is based on more than just the experience of myself and my collaborators.
    In this project, we did that with interviews, surveys, and *in-situ* data collected
    through the experience-sampling method (ESM, see Larson and Csikszentmihalyi [2014]).


    We began our investigation of phone placement with 50 short, semi-structured interviews
    with desk-based office workers in their usual office setting at our company. We
    approached participants in their offices and if they agreed to participate we
    asked:


