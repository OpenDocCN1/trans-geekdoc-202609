    # 9.2.4 Q4: Where Will My Training Data Come from, and Is It Good Enough?


    There are many factors to consider when collecting training data. One major trade-off
    was between the external validity of the data (collecting real data from a range
    of people in real situations) and the ability to explore data sources that are
    not available on consumer devices (described already). Thus, we decided to do
    two different data collections—one in-the-wild and one in-the-lab. This allowed
    us to explore the classification problem from two different angles. Collecting
    and labeling the data in-the-wild is a significant challenge. We describe both
    data collections here.


    # 9.2.4.1 Collecting In-situ Labeled Data


    To collect sensor data in situ we used the ESM (see Larson and Csikszentmihalyi
    [2014] for a thorough description) to collect accelerometer data from 32 participants’
    personal smartphones in conjunction with a ground-truth label describing the phone’s
    placement. These in-situ labels complement the retrospective self-report data
    from the phone placement interviews. While interview participants were undoubtedly
    as complete as possible, in-situ survey data enriches our understanding of where
    users choose to keep their phones.


    We built a data collection application, Where’s Your Phone? (WYP) on the Windows
    Phone 7.5 platform (Microsoft Corporation, Redmond, WA, USA). WYP collects 10s
    of accelerometer data (three dimensions at 50Hz) roughly every 30min. It then
    prompts the participant to answer “Where was your phone at XX:XXpm?” Below this
    question, participants were given six choices including Other and I Don’t Know.
    Each category had a few sub-categories (see Table 9.1 for all 23 sub-categories).
    We chose categories based on the phone placement interview responses to minimize
    the number of situations when ESM participants would need to enter free-text Other
    responses.


    Unanswered surveys expired when the next set of accelerometer data was collected
    and unlabeled accelerometer data were deleted. Participants specified a bedtime
    at which WYP turned off and a wake time at which it resumed. Participants could
    also “snooze” WYP for up to 2h at a time. Survey responses and corresponding accelerometer
    data were automatically uploaded to a server.


    We recruited 32 participants (16 males, 16 females) from a Windows Phone 7.5 email
    list. Fifty-nine percent of participants were between 20 and 39 years old and'
  - '[PAGE 11]


    the rest were older. Our participants submitted 5,524 ESM responses, although
    the number submitted varied across participants (median [med]: 147.5, minimum
    [min]: 29, maximum [max]: 358). The total number of responses from male (52%,
    2,847) and female (48%, 2,677) participants was similar. It is important to acknowledge
    the potential limitations in the comprehensiveness of the ESM responses; times
    when phones are away from their owner would be under-reported.


    # 9.2.4.2 Collecting Data in the Lab


    Using the three devices described in Section 9.2.3 (development phone, capacitive
    sensing prototype, and multi-spectral sensor), we collected data from 15 participants
    (six females). Seventy-three percent of participants were between 20 and 39 years
    old and the rest were older.


    We asked participants to bring anything that they might normally put their phone
    into including jackets, purses, or other bags. We collected data from each participant
    in any of the following places that they report having kept their phone: front
    trousers pocket, back trousers pocket, jacket pocket, bag/purse, and hand. We
    chose these based on our phone placement survey responses. To increase the external
    validity of this study, we did not have participants put our sensing devices in
    places that they would not normally put their phone. While this meant that we
    would capture more data for some participants than for others, it also maximizes
    the realism of our collected data.


    For each place participants normally keep their phone, they completed a series
    of activities to simulate the various conditions that the device might encounter
    in everyday life while in the placement. For all placements except bag/purse,
    the activities were: sitting on a couch, sitting on a desk chair, standing in
    place, and walking around. We did not have participants sit for the back trousers
    pocket placement. For the bag/purse we had participants let the bag sit on the
    floor, stand while holding the bag, and walk while carrying the bag. Participants
    spent 20s on each activity. Because each device had at least one sensor that was
    directional (e.g., toward leg in a trouser pocket), we collected all data for
    each placement with each device facing both inward and outward. We collected from
    two devices at a time to minimize the number of trials.


    Unlike the other placements, most of the variation in placing a device on a surface
    involves finding a variety of surfaces. Thus, we collected the surface-specific
    data ourselves, following a similar process to the other placements: we recorded
    data from each device in the two orientations of facing-up and facing-down. In
    total we collected data for 18 surfaces, including tables, desks, chairs, couches,
    on and in a metal filing cabinet, and even on a pillow.'
