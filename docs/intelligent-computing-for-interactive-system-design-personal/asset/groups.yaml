    ### 时间倾向

    在朋友-熟人研究中，Eagle 和 Pentland [2006] 观察到了联系他人的时间倾向。我们的参与者在一天中的不同时间和一周中的不同日子拨打家庭、工作和社交联系人的电话。例如，人们经常在下午（12pm–3pm）和傍晚（3pm–6pm）给家人打电话，并在周五下午更多地联系社交朋友。他们不太可能在周末给工作场所联系人打电话。


    ### 通道选择与避免

    人们倾向于根据与之沟通的人偏爱某种通信媒介 [Mesch 2009]。根据我们的调查结果，参与者根据联系人的关系，以不同优先级通过面对面、电话、短信和 Facebook
    进行沟通。


    ### 维护成本

    Roberts 和 Dunbar [2011] 认为，人们在维护不同类型的关系时会投入不同程度的努力，其中努力（成本）可以根据两个个体之间上次联系的时间来评估。然而，根据数据收集日期，这个值可能偶然小于实际成本。为尽量减少这种巧合，我们将过去
    2 周（短期视角）和过去 3 个月（相对长期视角）内的通信次数作为给定关系的维护成本。在以下部分，我们将描述如何将这些类别转化为具体的机器学习特性。


    我们从移动数据中定义了 153 个特性：17 个来自电话簿，66 个来自通话日志，36 个来自消息日志，34 个来自通信（通话 + 消息）日志（参见表 9.4）。


