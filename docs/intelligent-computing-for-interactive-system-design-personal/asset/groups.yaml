    Roberts and Dunbar [2011] suggested that people apply different amounts of effort
    in maintaining different kinds of relationships, where effort (cost) can be evaluated
    based on the time to last contact between two individuals. However, this value
    could be smaller than the actual cost by chance according to the data collection
