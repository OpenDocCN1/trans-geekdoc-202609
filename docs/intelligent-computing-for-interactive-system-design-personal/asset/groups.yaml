    # # Authors'' Biographies


    # ## Parisa Eslambolchilar


    ![](img/37b9feea690424a4c981364f15c3ffa2_36_0.png)


    **Parisa Eslambolchilar** received a BEng degree in Hardware Engineering from
    the University of Amirkabir, Tehran, in 1999, and a Master''s in Engineering in
    Robotics and AI from the University of Tehran, Iran in 2002 and a PhD degree in
    Computer Science from the Hamilton Institute, National University of Ireland,
    Maynooth in 2007. In March 2007, she joined the Computer Science Department of
    Swansea University as a lecturer. In March 2017, Parisa started her new post as
    a Senior Lecturer in the School of Informatics and


    Computer Science at Cardiff University. She is currently a Reader in Human-Computer
    Interaction (HCI) at Cardiff University and leads the Complex Systems Research
    Group and the Human Factors Technology Research Priority Area at the School.


    Parisa''s research interests include HCI, ubiquitous computing, and designing
