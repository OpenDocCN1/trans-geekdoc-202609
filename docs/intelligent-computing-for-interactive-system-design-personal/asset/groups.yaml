    *原位* 收集的。


    ## 9.3 从通信行为推断社会关系


    上一节探讨了一种相当低级别的个人上下文类型。另一种非常不同的上下文是社会关系的上下文。对于手机中的某个联系人，你如何认识该个人，与他们有多亲密？社会关系的上下文可用于过滤在界面中呈现的信息、优先处理电子邮件，甚至自动确定隐私设置
    [Wiese et al. 2011]。在本工作中，我们的目标是开发模型，从智能手机上的通话记录、短信记录和联系人列表中推断社交亲密度和生活领域。本节中描述的示例已发表于
    Min et al. [2013] 和 Wiese et al. [2015]，并重用了该论文中发布的部分文本。同样，我们从提出核心问题开始。


    ### 9.3.1 Q1：我实际上在推断什么？


    在本项目中，我们想要推断关于社会关系的两类信息。第一类是生活领域：你认识某人的渠道，或者他们现在融入你生活的哪个部分。第二类是关系强度：你与那个人有多亲近。


    对于生活领域，我们从 11 个不同的类别开始，然后将其分为三个生活领域：家庭（直系家庭、扩展家庭和伴侣）、工作和社交（邻里、宗教、家庭朋友、通过他人认识、学校、爱好和其他）。我们通过结合多个来源
    [Hill and Dunbar 2003, Spencer and Pahl 2006, Kelley et al. 2011, Wiese et al.
    2011] 来选择这些子类别的名称，旨在全面性（为了数据丰富性）与简单性（为了防止错误并最大限度减少参与者负担）之间取得平衡。最终，我们决定推断三个生活领域，而不是子类别。部分原因是我们不同子类别的训练数据量，但也因为预期
    11 类分类器的复杂性和低性能。


    关系强度的性质给构建此模型带来了挑战。关系强度可以根据关系强度问题的答案被视为数值类别值。然而，1 分和 2 分之间的差异不一定等于 2 分和 3 分之间的差异。因此，我们在这些模型中将非常强关系、中等强关系和弱关系的关系强度水平作为名义类别值。


    我们根据以往工作 [Zhou et al. 2005] 分配了这些类别标签，如下：


    - 强关系—顶级组（排名 1–4）


    - 中等关系—中间组（排名 5–19）


    - 弱关系—剩余联系人


    我们还决定为关系强度问题探索二分类和三分类分类器：


    - 3 类：分类为强、中强或弱


    - 2-非常强：二元分类器，将中强和弱关系合并为一类


    - 2-中强：二元分类器，将强和中强关系合并为一类


    ### 9.3.2 Q2：此分类器的最终目标是什么？


    与第 9.2 节中描述的工作类似，本项目的主要目标是研究：计划不是开发模型或系统并将其部署到实际应用中，而是仅表征问题空间，并展示其可行性和表现如何。然而，如果工作特别成功，这里训练的分类器可能有助于进一步研究，以探索一些假设的应用（例如，跟进我们之前关于这些关系维度与隐私偏好之间关联的工作
    [Wiese et al. 2011]）。


    ### 9.3.3 Q3：我需要什么数据，我想要什么数据？


    为开发这些分类器，我们计划使用运行 Android 操作系统的手机上的通话记录、短信记录和联系人列表。不幸的是，在进行这项研究时，这些数据存在一些限制。特别是，默认情况下，Android（Alphabet
    Inc.，美国加利福尼亚州山景城）手机将通话记录限制为最近 500 次通话，并且通常每个联系人默认限制 200 条短信。这导致日志所代表的天数存在广泛差异（范围：21–369；中位数：80；平均值：108）。这对数据集是一种严重限制，但如果不进行更长期的数据收集，就很难收集更多数据。另一个挑战是，联系人列表有许多字段，但在实践中，联系人列表中的数据相当稀疏。为保护隐私，我们没有收集短信内容。但是，我们确实收集了描述性信息，例如电子邮件域名、电话号码的前六位数字以及城市/州/邮政编码。


    决定收集哪些数据的另一个方面是确定为哪些联系人获取基础真实标签。任何个人的绝大多数联系人都将是弱关系，因此随机抽样不太可能出现中等和强关系。然而，在这项工作中，我们希望最大限度地提高收集强关系信息的可能性。为实现这一目标，我们要求参与者生成符合特定社会类别的联系人列表，无论它们是否出现在手机联系人列表中。参与者在以下每个类别中列出了五个人：直系家庭、扩展家庭、与他们同住的人、同事、他们感到亲近的人，以及与他们一起爱好的人。我们根据过去的定性工作选择了这些群体，这些工作表明这些类别将包含个人的强关系，以及来自不同生活领域的人
    [McCarty 2002, Spencer and Pahl 2006, Wiese et al. 2011]。最终，每个参与者都得到了一个包含 70 个联系人的列表，这些联系人是他们提供的姓名、在我们收集的数据中频繁联系的联系人以及随机选择的姓名的混合体。


    除了上述通信日志、联系人数据和类别标签外，我们还决定从参与者那里收集一些额外数据，包括一些我们认为未来可能易于收集的数据。参与者为 70 人名单中的每个联系人提供了人口统计信息，例如性别、年龄和关系持续时间。


    最后，由于关系强度难以定义的性质，参与者还回答了四个关于他们与每个联系人关系的问题，这些问题改编自 Marin and Hampton [2007]：


    - 1. 你与这个人感觉有多亲近？


    - 2. 你有多强烈同意“I 与这个人讨论重要事情”这一陈述？


    - 3. 你有多强烈同意“我愿意向这个人借款 100 美元或更多”这一陈述？


    - 4. 你有多强烈同意“我喜欢与这个人进行社交互动”这一陈述？


    #### 9.3.3.1 定义特征


    当我们考虑如何将这些数据转换为用于训练模型的特征时，通信数据的真正复杂性就很明显了。首先，我们定义了五个因素，用于表征在生活领域和关系强度背景下的通信模式：强度、规律性、时间倾向、渠道选择/回避和维护成本。


    **强度和规律性：**通信动作的数量和持续时间在过去的工作中已被用于预测关系强度 [Hill and Dunbar 2003, Roberts and Dunbar
    2011]。例如，语音呼叫对家庭来说非常常见

