    # 9.2.8.2 Modeling Phone Placement from Additional Sensors in the Lab


    We collected additional data in the lab, as described in Section 9.2.3. We extracted
    features from the accelerometer facing one direction and our other sensors facing
    two directions. This allowed us to simulate a device with sensors on two sides.


