    are one reading from each of the light-to-frequency converter and photo resistor
    for each of no-light, red, blue, green, UV, and IR. For the light and proximity-sensor
    on the phone, we took the mean over the 20s window of the ambient-light level
    and the binary proximity state. Lastly, we took the mean over a 1s window at each
    "pixel" in the capacitive sensing grid and computed three features over the grid:
    mean over pixels, median pixel value, number of non-zero pixels (pixels with some
    capacitance sensed). We used the same accelerometer features over a 1s window
    as in the ESM study from the previous section.


    Our classification technique and evaluation followed that of the ESM study: a
    leave-one-participant-out cross-validation, where we counted each person or surface
    as a separate participant. We analyzed the lab study data by addressing the same
    classification tasks that we identified for the ESM study: Enclosed or Out, On
    Person or Not, and In Bag, In Pocket, Out or In Hand. In addition, we trained
    each of these models with different combinations of data sources: each of them
    individually, then the new data sources combined with accelerometer data. Our
    goal in doing this was to understand the value of the additional sensors on top
    of the accelerometers that are already common on devices.


