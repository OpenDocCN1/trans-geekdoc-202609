- fmt: '

    One global company supplying gas cylinders is looking at tackling this question.
    With millions of gas cylinders sent out to millions of customers, they currently
    don’t know which gas cylinders are full or about to run empty. They’re investigating
    what it would cost to put a tiny sensor and processor in each cylinder that would
    tell them where the bottle is and how full it is – it might be at a remote cattle
    station and maybe it’s only 20% full. With that direct signal from the customer,
    the company can now create a service around how to replenish the gas. The customer
    could then get a message, ‘Your gas bottle is about to run out, click here for
    a refill.’ There are of course some ways of knowing how much gas is left with
    new tech, but there is, to my knowledge, no current holistic global feedback loop
    at scale.


    This sort of initiative is useful for the customer because they’re never caught
    short when they want to heat, cook or use gas for a variety of purposes. For the
    gas company it builds loyalty, tracks and predicts demand and data on which to
    potentially base other product offerings; it allows them to legitimately communicate
    with the customer in a value exchange that works for both.


    The use of data and applied analytics is creating winners and losers in all aspects
    of business. A corporate Pearl Harbor awaits organisations not able to enable
    and decipher customer signals.


    ![Image](images/himg-23-1.jpg)


    ## Costs of not using data – the importance of observing and understanding


    The surprise attack on Pearl Harbor stands out as one of the most catalytic moments
    in understanding the value of data. In early 1941 the US military was aware of
    the tensions with Japan, and a small team was working to crack the Japanese naval
    codes. Compared to amassing firepower and hardware, codebreaking was not a priority
    for military investment in those days.


    Japan’s raid on Pearl Harbor sharply illustrated that identifying and understanding
    a signal from noise that is outside the organisation, in this case cracking the
    codes of Japanese communications, was every bit as important as having aircraft
    carriers. The attack changed the US military’s appreciation of data; the navy
    consequently invested heavily in mathematicians, code-breakers and information
    detection and developed a cohesive program that became mission-critical to winning
    the war.


    Within a few months of Pearl Harbor the US military cracked the code of the Japanese
    and in turn knew that the Japanese invasion force, including many of the very
    aircraft carriers that had facilitated the attack on Pearl Harbor, were en route
    to the Midway Islands. This was achieved through finding the signal in the scrambled
    code of the communication of the Japanese military data – it enabled the US to
    decisively defeat Japan at the Battle of Midway, and this was the turning point
    in the war in the Pacific.


    Pearl Harbor was, literally, a burning platform, and it drove decisive change
    through tragic loss. At some point, every business will face its own metaphorical
    Pearl Harbor moment in that it will be surprised by competition often from outside
    its traditional frame of reference in a way it is unable to predict, that is unless
    they become an organisation with real predictive capabilities.


    In business it is now imperative to understand and try to predict wherever possible
    macroeconomic changes, and micro-behavioural changes of the customer and marketplace
    in real time. If the US Navy had even one hour’s notice of Pearl Harbor the result
    would have been very different.


    One super-smart venture capitalist in Silicon Valley said something to me that
    still sticks in my mind. He said, ‘If the company wants the consumer to sign a
    long-term contract, its customer service is most likely terrible. The contract
    is for their benefit not yours. It is to stop you leaving.’ It made me realise
    that many of the highest-ranking companies for customer experience – `Netflix`,
    `Google`, `Amazon`, `Alibaba`, `Apple` – have no need for lock-in, long-term contracts
    (although most have subscription/premium offers and linked offers and services:
    `Amazon Prime`, `Echo/Alexa`, `Google Nest`, `Apple’s Siri`). All these companies
    know their customers’ actions at a moment in time and over time. It means they
    can more accurately predict the future needs of their customers. Compare this
    to most telecommunications companies, or many financial companies that sell multi-year
    contracts as it’s often to their advantage not yours.


    Ironically a range of these long-term telco contracts are for the leasing of `Apple`
    products. The world’s most successful consumer company, `Apple`, does not need
    to contract us to a term, as we queue up for their new releases. Many telcos with
    mediocre service want a two-year term with penalties to give us access.


    Companies mistake the loyalty of customers with a lack of options for customers
    to leave. And, when someone else understands their needs better than you, they
    move and you have no understanding of why. This is because the early signals in
    the data were missed, just like Pearl Harbor. Eventually the failure to act to
    understand the customer has a cost. It snowballs to the point that your effort
    to make your organisation more data-driven and more attractive becomes increasingly
    difficult.


    ## From data-driven to AI-powered – the future of predictive companies


    For decades some entrepreneurs, company executives and board members have recognised
    the importance of particular data sets and harnessed them. We’re all familiar
    with the rise rise of the `FAANGs` (`Facebook`, `Amazon`, `Apple`, `Netflix`,
    `Google`), probably `GAFAM` (`Google`, `Apple`, `Facebook`, `Amazon`, `Microsoft`).


    Writing this in 2023, there have been some significant changes in value to the
    `FAANG` stocks; even with large-scale corrections they still have amassed massive
    valuations via their innovation from data use, and in some cases abuse. Not convinced?
    Look at the following two snapshots from a real-time link of the most valuable
    companies.


    ![Image](images/himg-25-1.jpg)


    ![Image](images/himg-26-1.jpg)


    According to Boston Consulting Group (`BCG`) research from 2020, one in three
    public companies will cease to exist in its current form by 2025 – a rate six
    times higher than it was 40 years ago. Forty-four per cent of today’s leading
    companies have only held their position for at least five years, down from 77%
    in 1970.


    In January 2021 `Juniper`, an AI engineering company, ran a survey of 700 organisations
    across multiple sectors from agribusiness, industrial, tech, pharma and across
    Asia, Europe and North America.


    It also found 95% of organisations believe they would benefit from embedding AI
    into their daily operations, products and services, yet only 6% of C-suite level
    leaders reported AI-powered solutions across their organisation. Even the most
    advanced companies with AI can still find a myriad of new ways to use this technology.


    In 2023 McKinsey & Company research found that 90% of commercial leaders expect
    to utilise AI solutions often in the next two years.


    There are some logical steps you can take to change the way your company approaches
    becoming an AI/data-driven business. The first step is to understand where your
    company is now, what’s coming next from this frontier in terms of data and the
    customer, the flow of data (or not) across the organisation (and up and down the
    decision chain). This will give you a baseline of where to start. Then you need
    to build a road map (or should I say data map and strategy) that includes options
    and how to ‘do no harm’ (trust, privacy and value exchange).

