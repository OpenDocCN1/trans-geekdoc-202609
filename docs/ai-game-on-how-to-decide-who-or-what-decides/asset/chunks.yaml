    \ and a data Hippocratic oath are key to staying on the right side of the data\
    \ value exchange.\n\nAs data can be stored forever, a question that should be\
    \ asked is: If we store this data for this one purpose, then reuse it for another,\
    \ who will authorise that use, and ensure the above scenarios are answered, and\
    \ that the data Hippocratic oath can be kept?\n\n## [Data collection, use, sharing\
    \ and policy](#content-toc.xhtml#pz5-34)\n\nWalid Khiari, an investment banker\
    \ in Palo Alto, explained to me at breakfast one morning, ‘The old world was policy\
    \ driving adoption. The new world is adoption driving policy.’\n\nUber anyone?\
    \ Over 2 million Australians had downloaded the Uber app and were actively using\
    \ the service before governments had meaningful discussion about its impact on\
    \ taxi license plates, which they had sold to taxi owners. Adoption is now the\
    \ driver of policy in too many places, illustrating how regulators are too often\
    \ late to the party or rather society’s needs. The party may be being held by\
    \ large tech companies that are extracting massive value out of new ways of engaging\
    \ people. The consequences of misinformation, too much screen time and second-order\
    \ impacts are pushed on to society.\n\nAdoption driving policy is not a healthy\
    \ position for society to be in, and we need regulators to step up and get into\
    \ the fast lane of tech developments. The best time to legislate for how the next\
    \ generation of AI/data/tech companies use data is before it starts, not when\
    \ billions of people are using it daily.\n\nWhen social media began, were any\
    \ regulators ready for this new world? Which government departments were thinking\
    \ about the trillions of data points that would flow, and the predictive and addictive\
    \ attributes that would be available to the owners?\n\nNow with tools like OpenAI\
    \ and its ChatGPT outputs and more, there are increasing levels of concern around\
    \ copyright and other areas where the laws lag well behind the adoption cycle.\
    \ If you are a writer or content creator what are the chances your work is in\
    \ OpenAI? Odds are your content is now in the vast content soup that can be trawled\
    \ and used. Amazon has many new book titles for sale written by AI; much of this\
    \ has been derived from the AI looking at existing authors’ work. *I Forced a\
    \ Bot to Write This Book* is one such title.\n\nThe current debate about whether\
    \ we should pause AI development is a rational debate to be had. What it seems\
    \ to miss is the use case imperative. If the use case is to help humanity, would\
    \ we want to pause it? Or if the use case to create division, hatred and misinformation\
    \ or other bad use cases perhaps we should pause. If AI can help identify moles\
    \ that are pre-cancerous, for example, that is very different to use cases that\
    \ lead to teen depression.\n\nRegulators are a long way back in the thinking here\
    \ and we need more regulators at the AI planning table.\n\nThe right to be forgotten\
    \ is now law in several countries. It was only needed once computers could remember\
    \ everything. Now we have AI that can detect human emotions, and the use of this\
    \ emotional observation is open to misuse. There is currently no policy response\
    \ to many of these AI advances. Developing the use case is key.\n\nMira Murati,\
    \ CTO at OpenAI, the company that developed ChatGPT, recently expressed her concerns\
    \ about the chatbot and said that AI can be misused. ‘\\[AI\\] can be misused,\
    \ or it can be used by bad actors. So, then there are questions about how you\
    \ govern the use of this technology globally. How do you govern the use of AI\
    \ in a way that’s aligned with human values?’ she asked in an interview with *Time*\
    \ magazine. Murati added that AI should be regulated by the governments.\n\nIn\
    \ a Sam Harris podcast, titled ‘The Trouble with AI,’ he talks to Gary Marcus,\
    \ bestselling author of *Rebooting AI* and founder of Geometric Intelligence,\
    \ and Stuart Russell, Professor of Computer Science at Berkeley and Director of\
    \ the Center for Human-Compatible AI. It’s a two-hour podcast and a fascinating\
    \ conversation about AI challenges and where we’re at in terms of artificial general\
    \ intelligence (AGI).\n\nSome key takeaways from this are:\n\n1.  Testing what\
    \ happens with AI on millions or billions of people is not ethical. We would not\
    \ allow this in food or pharmaceuticals. There are regulations that are enforceable\
    \ and risk mitigation measures in place. Yet we allow tech companies to do R&D\
    \ in the wild with little more than reputational consequences at present.\n\n\
    2.  Cessation of research is very hard to enforce and apply. But it has happened\
    \ – genetic engineers were gung-ho about improving the human gene pool 50 years\
    \ ago, yet by the mid-1970s they had pulled back. As of now there are no human\
    \ clones. I make the point again, it’s about the use case, as using DNA to modify\
    \ cancer cells is happening and is not seen as a threat like creating a clone\
    \ army.\n\n3.  Views on the timeline to any real AGI are different. It’s clearly\
    \ impossible to know when and if this materialises. Various experts do think it\
    \ will be here in some form and make the point that so far the rollout of AI has\
    \ not gone smoothly and lack of thoughtful regulations is not a good sign for\
    \ what may await in AGI and other AI use.^([^(22)](#fn22))\n\n    I wonder how\
    \ many regulators attend South by Southwest (SXSW) to watch the birth of new industries,\
    \ or subscribe to Crunchbase to follow where the early capital is being allocated\
    \ and what is waiting downstream from these deals for society. It is time to demand\
    \ more from the entrepreneurs running these businesses to ensure their businesses\
    \ align with humanity’s interest, and to call for more from the regulators who\
    \ will need to stay in front to protect society from bad actors and unintended\
    \ consequences.\n\n    There are rapidly shifting expectations about how data\
    \ can be collected, used and shared, both from the individuals whose data it is\
    \ and the companies that are amassing and using it to deliver services to the\
    \ customer. As customers become more knowledgeable about the value of their data,\
    \ the onus is on organisations to ensure it is fit for purpose and that purpose\
    \ can’t be solely profit above the customers’ interests or those of society.\n\
    \n    Large ecosystems of shared data have formed into massive data lakes and\
    \ increasingly gigantic oceans.\n\n    Some are of the highest standards, where\
    \ real thought has gone into making the data de-identified, privacy compliant,\
    \ and encrypted to the highest standards attaining ISO ratings and other metrics\
    \ to show compliance with GDPR standards and more."
