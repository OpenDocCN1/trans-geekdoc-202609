    \ measure the inputs and observe the errors. It is not easy to observe human errors,\
    \ as we tend to retrofit information back into why we made the decision. If the\
    \ same judge can make a different decision based on their feelings due to the\
    \ recency of their last meal, we have a problem with human decision-making that\
    \ needs some reflection against those made by machines today, without even allowing\
    \ for the machines of tomorrow.\n\n                ## [What questions should we\
    \ be asking?](#content-toc.xhtml#pz6-34)\n\n                The questions we ask\
    \ define us. When Einstein was 16 he tried to imagine he was chasing a beam of\
    \ light to get a different perspective on what light is. It’s a simple but great\
    \ example of where human thought creates breakthrough innovation. The human mind\
    \ will be a critical input into innovation for a long time to come. It is this\
    \ expansive thinking and questioning, what would it be like to be on a beam of\
    \ light moving at light speed, that opened up Einstein’s insights. This sort of\
    \ thinking may well be the last frontier for AI to challenge humankind on. This\
    \ creative thinking is where humans can spend more time, once smaller decisions\
    \ are industrialised into ethically safe AI and data systems.\n\n            \
    \    Two good questions to ask of your data that hold significant value if you\
    \ can answer them well are: ‘Which customer will defect from our product and service\
    \ and why?’ These are key questions linked to the future enterprise valuation\
    \ of the business.\n\n                Defection is predictable in most cases,\
    \ yet if you ask questions like these in most boardrooms you may well be met with\
    \ one of the following responses: that is an operational matter not concerning\
    \ the board, or we don’t have the data to accurately know, but our gut feel is\
    \ XYZ. Both answers are dangerous and may well be key signs your organisation\
    \ is heading the way of the taxi industry. The silent voice of the real defecting\
    \ customer is gold, as that voice – or more likely data flow – is showing your\
    \ product or services has flaws that relate to their existing or future needs.\n\
    \n                ‘What is the unmet need of our future customers?’ This is where\
    \ strategy can be created. (This prediction could be a book in itself, and I look\
    \ at this in the last chapter.)\n\n                The value of any business is\
    \ determined by the future cash flow of the customers. The future unmet need of\
    \ your customer is the future value of the business, if you can find it and solve\
    \ it. Motorola and Yahoo failed to find their customers’ future needs and others\
    \ did – Apple and Google – and the change continues with new entrants and new\
    \ business models.\n\n                ## [Finding ‘the answer’ in business](#content-toc.xhtml#pz6-35)\n\
    \n                We live in a world where if the answer exists, you can find\
    \ it in one click, so most answers to any basic question are no longer hard to\
    \ find. The new challenge facing boards and executives is what questions can add\
    \ to the collective value. Questions such as:\n\n                *   What new\
    \ data could be found in our business that would answer and frame new questions?\n\
    \n                *   What data do we have that may hold value today and tomorrow?\n\
    \n                *   What ethically sourced external data could be obtained that\
    \ allows us to know what our customers do when they are not interacting with our\
    \ product or service?\n\n                *   How can we get to the future needs\
    \ of our customers before our competitors?\n\n                *   What would real\
    \ AI capability add to our products and services?\n\n                In a world\
    \ of data and AI, new questions can be asked of existing and new data. The answers\
    \ can be delivered at the speed of light, actioned across all customers, and measured\
    \ for all customers, then reprogramed from all insights, a perpetual and ever-improving\
    \ OODA loop of action, insight, with more actions, more data, more insights.\n\
    \n                **A learning machine that serves customers is the engine room\
    \ of the AI: Game On companies of tomorrow**\n\n                ## CHAPTER TAKEAWAYS\n\
    \n                1.  AI and data-driven decision-making are transforming industries\
    \ and offering new possibilities for innovation. Yet far too many are still just\
    \ talking about AI. Having the first, material use case is vital as a defensive\
    \ moat, and builds momentum that can lead to a new business model.\n\n       \
    \         2.  The OODA loop and differentiation between Type 1 and Type 2 decisions\
    \ can help companies avoid slowing down innovation.\n\n                3.  Governance\
    \ frameworks are crucial for ensuring AI and data operations are trustworthy and\
    \ reliable and must always protect and advance human dignity.\n\n            \
    \    4.  Biases can affect decisions in various areas, and synthetic data models\
    \ and testing can help identify them.\n\n                5.  Customer signals\
    \ can get lost, blocked or distorted between the front line and the boardroom,\
    \ so it is vital to make sure you are getting an objective set of signals from\
    \ your customers, including those who defect."
