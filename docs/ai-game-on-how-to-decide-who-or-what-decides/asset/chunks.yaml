- fmt: '

    When I joined the board of the NRMA (Australia’s largest motoring and tourism
    mutual) there was a long-standing belief that the most loyal customers were the
    ones who occasionally broke down, used the legendary roadside assistance to great
    peace of mind, then went on their way, happy with the service. The NRMA has a
    very high net promoter score (`NPS`) of 82. This customer was often thought to
    be a young mother with kids who felt vulnerable on the side of the road, so joined
    to feel safe. They were loyal customers and it all made perfect sense. Then we
    did some work on the data.


    The team ran the data on the most loyal customers, to evaluate their breakdown
    rates versus other customers. How long was the wait time when they broke down?
    What was the resolution in the field? Once we had the data it was clear that the
    most loyal customers weren’t breaking down very often at all. It was an assumption.


    The data told us that the most loyal customers use some of the NRMA’s other services.
    So, it’s the other services that are very much helping to add value to customers’
    own sense of value and belonging, as well as the great roadside assistance work.
    Once we saw the data, the objective evidence, we asked more questions of the data.
    What other services do they use, how often, when? What other services are they
    interested in that we might be able to provide in the future? What can we predict
    about their needs? How can we know them better to serve them better?


    These and other insights led us to build a new strategy around tourism and we
    have moved a significant part of our balance sheet as a consequence.


    This is data impacting the strategy and strategy impacting data. When the balance
    sheets are more aligned with the customers’ needs, the company is moving with
    its customers’ needs and emerging needs. The board is also informed through the
    data to help govern for the future.


    Apple captured the watch market at breakneck speed. The Apple Watch was released
    in April 2015 with 4.2 million sold in the first quarter. By December 2020 there
    were 110 million Apple Watches in circulation.


    ## Threat of substitution


    Substitution of products and services is significantly impacted by data, `AI`
    and machine learning.


    If you have an Apple Watch, it’s likely that you’ve got another Apple product,
    perhaps an `iPhone`, `iPad`, `MacBook`, `HomePod`, `Apple TV` or `Apple Music`.
    You might also have connected your `Spotify` account and fitness apps, and you
    speak to `Siri`. However, changing your phone to a `Samsung` or another `Android`
    phone is not as straightforward as it appears, as there are all sorts of interoperability
    issues that make an ongoing relationship with Apple more likely, or stickier.
    The cost of switching your phone is now significantly higher than it was before
    Apple entered the market. Remember Blackberry?


    You don’t need to own an `iPhone`; you can have any mobile phone, `Samsung`, `Google
    Pixel`, `TCL`, `OPPO`, `Xiaomi` and more. You can find a mobile phone that’s 90%
    cheaper than the `iPhone`. Millions of people are fiercely loyal to their `iPhone`,
    camping out the night before new versions are released. Loyalty is reinforced
    by data and `AI` networking, linked product apps in Apple’s case. That’s one reason
    why Apple is worth so much money, because changing is hard and very few Apple
    customers want to change. If you have all your photos in your phone and `iCloud`,
    shared across your devices, you’ve got all your apps to access everything seamlessly.
    Apple is a lifestyle enabler.


    Tesla is similar. If you own a `Tesla`, they have all your driving information
    and you’re part of a `Tesla` ecosystem. You have various navigational, driving,
    charging station apps connected to your car and your phone. You might also have
    taken out insurance and received a discount, as `Tesla` is able to provide detailed
    information about how you use your car, how you drive it, where you drive it and
    more. `Tesla` is starting to market its own insurance.


    What Apple and Tesla have in common is that they have real fans, and are good
    at delighting their customers. Have you ever heard anyone talk about their insurance
    company the way they talk about their Tesla? Can you honestly say your company
    or organisation does that?


    ## Chapter Takeaways


    1. Data is the spine of future-facing companies, and the best data wins over the
    best analytics. When the best data meets the best analytics, the organisation
    is very hard to beat.

    2. Major tech companies have already embedded `AI` in their operations, giving
    them a big advantage, but `AI`-based tools are also spreading into other sectors.

    3. Data and `AI` are changing the way we hire and remunerate employees, and machine
    learning operations (`MLOps`) are transforming the deployment of `AI` in businesses.

    4. Protecting customer data is crucial, and organisations should rely on data,
    not assumptions, to understand their customers.

    5. Real customer insight can be obtained through analysing real customer data,
    and businesses must be careful not to rely on flawed assumptions about their customers.


    ***


    # Chapter 6


    # NAVIGATING THE DECISION-MAKING REVOLUTION, DECISION AS SERVICE, DAAS


    **‘If we have data, let’s look at data. If all we have are opinions, let’s go
    with mine.’** – Jim Barksdale, former president and CEO of Netscape, founder of
    Barksdale Group


    ![Image](images/himg-93-1.jpg)


    People make thousands of micro-decisions each day. Cornell University research
    found that people make an average of 226 decisions each day on food alone.


    Yet for all the high cognitive load of running a business, think about this. One
    of the algorithms I have seen deployed in retail has 23 trillion variables and
    makes millions of decisions each second. These then move into recommendations
    for customers, and actions for management and staff. We are in a decision-making
    revolution – welcome to decisions as a service (`DaaS`).


    Car insurance companies are sitting on millions of individuals’ claims history,
    all tagged with when, where, who, what, how, and often why the accident occurred
    – all key data points on accidents. Are men aged 29 driving a white Subaru on
    a Friday night at more risk than the same-aged male driving a Corolla? They know.
    It’s in the data. What is the most dangerous time of day to travel to the beach?
    They know, and on it goes. Insurers are in the box seat to innovate in a way that
    their customers would value and which would drive profits through lower claims.
    Yet they can’t because the data is locked up on a one-way bet that calculates
    a price risk against their customers. The result is that it is causing frustration
    instead of being liberated to help their customers.


    **‘Risk comes from not knowing what you’re doing.’** – Warren Buffett


    A relative of mine was in a car crash recently. Not hurt thankfully, and they
    were not at fault. My relative took a photo of the damage to both cars and obtained
    the number plate and name of the driver. A good result in the circumstances as
    the other driver was not very cooperative.

