    The HiPPO can be the enabler of the large-scale adoption of data and AI like Jeff
    Bezos was back in his day or the barrier to the new way. Board’s major responsibility
    is to ensure the CEO of the day is optimal for that organisation, at that time,
    and for the foreseeable future. Unfortunately, we have seen this go horribly wrong
    over and over again leading to some monumental failures. As reported in the *Harvard
    Business Review*:


    In most organizations, authority for the most important strategic decisions is
    left to the highest-paid person’s opinion (HiPPO). All too often, the HiPPO can
    prove to be wrong. A HiPPO drove the strategy for JC Penny’s disastrous move to
    go upmarket and abandon its thrifty customer base.


    HiPPOs are also responsible for the downfall of many once-great organisations.
    The notion that no one is as smart as everyone occurs even in the C-suite.


    An organisational culture of data-driven decision-making is where evidence and
    reason flow throughout the organisation, where the quality of the data underpins
    trust and reliability and where a values-based approach to governance is at the
    forefront of all decisions.


    A data culture is where data is treated as a valuable asset, and where the customer
    interest is sacrosanct


    It’s also important to share what a data culture is not. A culture is holistic,
    not partial, so it’s not about undertaking a digital transformation in one part
    of your business, most likely the customer interface. That is a ‘project’.


    Thomas H Davenport wrote the following in the *HBR*:


    I’m convinced that the ingredient for the effective use of data and analytics
    that is in shortest supply is managers’ understanding of what is possible. Data,
    hardware, and software are available in droves, but human comprehension of the
    possibilities they enable is much less common. Given that problem, there is a
    great need for more education on this topic.


    Recent analysis of digital transformations observed that successful projects exhibited
    a 70:20:10 ratio. Seventy per cent of the effort went on process, ways of working,
    people issues and KPIs, 20% went on getting the data right, and 10% was on the
    technology. The research also noted that as most businesses are still really product-led
    and not customer-led, the effort by executives needs to happen first to change
    the way the business orients from the product being paramount, to the customer
    being at the centre of their purpose.


    When data transformation is technology-led or data-led, you miss the real opportunity
    for change.


    If you’re not a digital native, you need to make a serious effort to upskill and
    learn as much as you can about data, AI and machine learning. Reading this book
    is a good start, but you also need to engage with the data leaders in your organisation,
    ask lots of questions and get curious. If you’re a start-up it’s easier for you
    to build your organisation with a data spine; in fact, there’s a high likelihood
    that your start-up is founded on data, AI and machine learning.


    If you’re the executive of a legacy business and/or a bricks-and-mortar business,
    you need to stand back from the fear of the onslaught coming from your global
    data/AI competitors to reimagine your business model.


    ## Getting started with your AI/data journey


    As is often the case, eventually the pain of inaction will intensify to the point
    where action is less painful.


    If your inertia about your fitness program continues long enough there will eventually
    be a day where you need to move more because it is lifesaving. It is the same
    for organisational adoption of data and AI enablement. The early days are hard,
    ambiguous, even dangerous, with cost blowouts and organisational frustration.
    It is like that at the start, just like the first morning at the gym after a lifetime
    of sitting at a desk. Stop and you will pay a very high price.


    There’s an old joke that encapsulates how many executives and business owners
    feel about the data/AI revolution. A couple from the city get lost when out on
    a drive in the countryside and ask a farmer for directions back to town. ‘Oh,
    I wouldn’t start from here,’ the farmer replies with a grin.


    So, just where do you start if you haven’t already? And if you have, you might
    want to take a brief pause and ask yourself the following questions.


    1. Where are you now?

    2. Where do you want to be?

    3. How will you get there?

    4. What are the forces that are driving the change?


    ## 1. Where are you – really?


    In Michael Lewis’s book, *The Premonition*, about the global pandemic, he recounts
    that before the Covid-19 pandemic started, a group of health experts from around
    the world were paid a lot of money to assess the world’s capability to deal with
    a pandemic. They ranked every country’s capacity to handle a pandemic, and guess
    what? America was ranked the most prepared country in the world – the most organised,
    with the highest capability, best doctors and most resources. Of course, when
    the pandemic hit, America did not shower itself in glory in its performance compared
    to other developed nations in terms of avoidable deaths.


    This summary struck me as completely relevant to executives assessing where their
    company is in terms of their data/AI use and capability, because when you’re assessing
    yourself it’s easy to compare your company to others in your sector and become
    complacent. Just like the US pandemic expert panel who assessed the USA’s capability
    as high on a set of metrics that didn’t take into account the real-world impacts
    of the virus, political interference, bureaucratic blunders, misinformation on
    social media and the politicisation of health advice. Understanding the real issues
    around your organisation’s ability to assess your AI and data capability is harder
    than it seems.


    An honest appraisal of your current data situation and capability to capture,
    share, interpret and action it is essential. Before you make any decisions, ask
    for a briefing (either from an internal or external team if you have these roles)
    to understand just where your business is in terms of what data you have, where
    it’s held, how it’s shared (if at all), what is its purpose, who is responsible
    for its quality, security and governance.


    It may well be a good idea to get an external party, a data AI specialist, to
    assess your current status. Auditors assess the current financial status, and
    provide an independent view of the processes and team in the finance department,
    so there is value in an independent data view.


    ![Illustrative at time of publishing, noting that there are clearly examples of
    banks, telcos, FMCG and the like who are great users of customer signals](images/himg-138-1.jpg)


    **Illustrative at time of publishing, noting that there are clearly examples of
    banks, telcos, FMCG and the like who are great users of customer signals**


    **You must understand your data and the opportunities and threats that exist in
    its storage and use**

