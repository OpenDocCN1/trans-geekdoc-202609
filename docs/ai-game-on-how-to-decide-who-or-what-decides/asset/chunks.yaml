    4. 当他们不使用我的产品时，他们在做什么？（这是一个非常有创意的问题，需要真实的数据来回答，但它能引发一些非常深刻的洞察。）


    5. 我的竞争对手为他们提供了什么？


    6. 客户是否注意到了我的产品与竞争产品之间的差异？我的产品好在哪里？


    7. 新客户和现有客户有哪些未被满足的需求，是我的产品或服务可以满足的？


    8. 可能会出现什么样的竞争反应，导致我的计划失败？


    9. 我可以采取哪些缓解措施来应对竞争反应？


    在不了解你的具体使用场景、行业和现有能力的情况下，无法对“自建、购买还是伙伴关系”的决策提供具体指导。我想说的是，几乎所有公司在法律和会计方面都会合作，因为这些领域非常复杂，一旦出错就会构成实质性威胁。这些合作伙伴关系通常还会由内部高管进行加强，例如内部法务顾问或财务总。`AI-data
    analytics` 是复杂的，一旦出错就会构成实质性威胁。研究表明，顶尖的分析人才会产生超常的回报。最好的科学家和工程师的生产力是平均水平者的 10 到
    50 倍。这里的教训是，确保如果你打算自建团队，你的团队确实有能力，而反过来又产生了一个挑战：组织中谁有足够的设备来评估团队或任何外部供应商。


    **会有失败也有成功——请坚持下去**


    杰夫·贝索斯在给股东的一封信中说：“我认为我们特别独特的一个领域是失败。我相信我们是世界上最适合失败的地方（我们有丰富的实践经验！），而且失败与发明是不可分的双胞胎。”他接着说，所有的突破都源于失败。


    这是一个持续的过程，由客户引导你前进，而不是由你来猜测客户的想法。


    ## 4. 驱动变革的力量是什么？


    现在你在世界上任何地方做生意，你的客户都知道优秀的分析和 `AI` 应该是什么样。数十亿客户正在使用 `Apple`、`Amazon`、`Google`、`Spotify`、`Siri`、`Alexa`、`阿里巴巴`、`腾讯`、`Waze`、`TikTok`
    等产品。在 `Netflix` 上花费少量的美元订阅费用，就能让用户接触基于其他 `Netflix` 用户偏好（数据）创建的价值 160 亿美元的内容。这是一个所有公司现在都在竞争的高价值主张。你的客户知道什么是好的，并且他们期望你也能提供这些。


    2021 年 8 月，澳大利亚联邦法院做出了一项裁决，规定“发明者可以是非人类”。这意味着，他们决定人工智能在专利申请中可以被法律认定为发明者。


    `Tesla` 现在从每辆车中传回了大量数据——它理解拜伦湾、波士顿或波哥大道路的能力——这种优势归他们所有。反过来，他们将卖出更多的汽车，因为系统很好，而且随着
    `Tesla` 获取更多数据，系统会变得更好。这就是数据的良性循环，或者说是数据/数据网络效应的飞轮。


    在下一章中，我将探索公司内部的数据类型和流，将重点从客户扩展到数据和 `AI` 如何应用于许多人认为未曾或无法由数据驱动的领域。


    ## 章节要点


    1. 客户正在根据他们与最优秀组织接触时的体验标准，来衡量他们在所有组织中的体验，而最好的组织通常是先进的数据驱动型组织。

    2. 数据是可持续的，其生命周期包括提炼、重用、混合、与其他数据增强，以及针对新用例进行重新建模。

    3. 数据文化是将数据视为宝贵资产，并将客户利益视为神圣不可侵犯。

    4. 成功的数字化转型需要 70:20:10 的比例，其中 70% 的精力投入流程、工作方式、人员问题和 KPI，20% 用于确保数据无误，10% 用于技术。

    5. 要成为 `AI` 数据驱动型企业，公司必须在评估自身现状时保持诚实，建立清晰的决策结构和系统，拥抱获得新见解和想法的可能性，避免“就地发明”综合征，并考虑通过开发、购买、借用或伙伴关系来获取数据驱动解决方案。


    [`www.gobankingrates.com/money/business/jeff-bezos-worst-business-failures/#:~:text=%E2%80%9COne%20area%20where%20I%20think,and%20invention%20are%20inseparable%20twins.%E2%80%9D`](https://www.gobankingrates.com/money/business/jeff-bezos-worst-business-failures/#:~:text=%E2%80%9COne%20area%20where%20I%20think,and%20invention%20are%20inseparable%20twins.%E2%80%9D)


    # 第 9 章


    # 数据与 AI 的未来


    **“在每一个决策中，无论是个人、政府还是公司，我们都必须考虑它将如何影响我们未来七代的后代。” —— 第七代原则，易洛魁族**


    董事会是企业未来的终极守护者。你的组织如何适应 `AI`：《游戏开始》（Game On）将决定它的未来。每个人每个组织都会受到 `AI` 产生的地震性变化的影响。


    `AI` 的轨迹并不总是清晰的。十多年前，`Watson` 还是 IBM 的 AI 英雄，它在节目《危险一答》（Jeopardy）中夺冠。很快就有声称 `Watson`
    正在进行新的癌症研究和其他高价值用例。IBM 称 `Watson` 为“知识的未来”。他们曾拍摄过广告，让 `Watson` 与鲍勃·迪伦讨论他的创作风格，当时
    `Watson` 被视为正在发生的 AI 革命。现实情况并非如此。


    如今的 AI 能力更加先进、更加平民化。尽管如此，某些领域仍会出现危险、挫折和炒作。领导者需要具备好奇心、谦逊和怀疑精神。


    在第 1 章中，我引用了《连线》杂志编辑克里斯·安德森，他在 2008 年说：“数据的巨大量将使理论甚至科学方法失效”。


    现在是 2024 年，商业、环境、健康、医疗、农业和能源领域有越来越多的董事和高管正在利用数据和 AI 的力量来他们的决策、业务平台、研究等方面。


    ## 数据和 AI 正在改变并挑战你的思维方式


    直到最近，人类一直是无可争议的最优知识来源、数据收集者以及已知宇宙中大多数预测能力的引发者。


    我们的人类软件和硬件进化得极其缓慢——毕竟这是进化的。机器和 AI 正在以指数级速度进化，随着数据扩张得更快，机器编写更好、更快代码的复合效应正在以我们无法完全理解的速度加速。

