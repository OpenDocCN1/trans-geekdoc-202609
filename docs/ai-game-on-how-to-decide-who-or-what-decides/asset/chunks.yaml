    \ AI self-learning and self-questioning, much like a human would do, asking new\
    \ questions from the knowledge they have acquired. Titled ‘Large Language Models\
    \ Can Self-Improve’, a group of researchers built an LLM that can come up with\
    \ a set of questions, generate detailed answers to those questions, filter its\
    \ own answers for the most high-quality output, and then fine-tune itself on the\
    \ curated answers.\n\n            At the time of writing, there are claims of\
    \ AI fact-checking and also evidence that there are a lot of ‘facts’ in AI that\
    \ are not true. It’s evolving and the only thing I can be sure about is this is\
    \ likely to be the slowest rate of AI development we will ever see. We may end\
    \ up subscribing to AI truth verification detecting apps.\n\n            The driverless\
    \ car is a good analogy for the new type of decision-making that will be required\
    \ in companies as we become enabled by DaaS. The driverless car needs to know\
    \ much of the same high-level views required by directors and executives:\n\n\
    \            *   Where am I, precisely?\n\n            *   What is going on around\
    \ me (other cars, pedestrians, roadworks, traffic lights, roundabouts, merging\
    \ lanes, turning lanes, weather)?\n\n            *   What will or might happen\
    \ next (red light, green light, arrow light, random pedestrian on the road, car\
    \ overtaking, car running a give way sign)?\n\n            *   What should I do\
    \ now (nothing, something)? What intervention is the best next move?\n\n     \
