    这并不是关于在网络窃取、开放 API、粗心的数据卫生、培训或网络安全上冒险。它关乎数据安全以及与用例的对齐，让你在竞争对手发现先机之前就通向未来。


    归结底就是一点：如果你把数据锁起来，你就输了；如果你让数据裸奔，你也输了。


    这就是为什么我们需要那些思考“AI：游戏开始（Game On）”未来的领导者。在这个领域需要真正的董事会参与以及深思熟虑的以客户为中心的用例。寻求帮助，就像你处理像
    AI 和数据这样复杂的其他问题一样。数据和 AI 无法被那么容易地粉饰，并以伦理的方式实现实现和获胜。任何告诉你这很容易的人都没有做对方法。


    保持好奇心，并培养一种好奇的文化。正如阿尔伯特·爱因斯坦所说：“我没有特别的天赋，我只是充满好奇心。”


    已故的天文学家卡尔·萨根曾说：“在某个地方，某些不可思议的事等待着发现。”这是开启数据策略的一种极方式。


    ![Image](img/himg-42-1.jpg)


    在下一章，我将深入探讨数据和 AI 的伦理，包括谁拥有数据、公司如何使用它，以及如果你想的话，你可以做什么来保护和分享它。我还将讨论 AI 以及等待监管跟上的陷阱。


    ## 章节要点


    1. 数据太重要了，不能留给数据部门；董事会和管理层需要自我了解。

    2. `BrisConnections` 的失败证明了使用当代数据科学和分析进行可审计预测的重要性。

    3. AI 正在改变医疗保健和金融业，提高能力和准确性，并向以客户为中心的方法转变。其他行业正在随其后。

    4. 银行、养老金和金融服务行业不当行为皇家委员会导致了理念变为“卖方自负（let the seller beware）”。

    5. 组织学习并将这种学习转化为行动的能力是最终的竞争优势，数据分析和 AI 在捕捉客户需求信号方面蓬勃发展。


    ***


    # 第 3 章：信任的重要性


    来自澳大利亚公司董事学院 (`AICD`) 的一封信：


    亲爱的 Tim：


    今天，当我们在 LinkedIn 直播发布新的《网络安全治理原则》时直播出现故障，超过两千人感到失望。


    我们对所有出席人员表示诚挚的歉意。


    这似乎是一个技术故障，这种体验不符合你理应对我们期待的高标准。我们正与 LinkedIn 及我们的服务供应商合作了解此问题。下方提供了该活动的录像。


    ### 恶意链接


    我们还想请注意在活动取消前的 15 分钟内，可能在活动聊天中发布的可疑恶意链接。


    * 这些链接可能引导至请求个人信息的页面。

    * 这些链接并非由 `AICD` 发布。

    * 如果您点击了此类链接并输入了详细信息，请联系您的金融机构。如果您能也告诉我们，我们将不胜感激，以便我们尽可能提供支持。

    * 如果您没有这样做，则不需要采取任何行动。


    LinkedIn 平台上出现的链接与 `AICD` 的数据之间没有联系，我们的数据仍然是安全的。


    虽然黑客可能利用恶意链接针对该活动，但目前没有发现这些行动与直播失败之间存在已知联系。


    针对这一问题，我们正与澳大利亚网络安全中心和 LinkedIn 合作调查此事。


    ### 网络安全治理原则


    虽然没有任何组织能免受网络安全风险，但我们对《网络安全治理原则》未能以直播形式呈现给各位感到遗憾。


    我们希望您发现这些本身在管理安全威胁方面是有价值的，下方的录像能为您在自己的背景下应用这些原则提供见解。


    一段时间以前，我参加了由澳大利亚公司董事学院 (`AICD`) 举办的关于网络犯罪的董事培训课程。如上面的来信所示，情况并不顺利，因为活动似乎由于恶意活动而被撤回了。`AICD`
    努力帮助董事变得更加专业和见多识广。他们是网络攻击的受害者。上面的邮件是在活动失败后发出的。当这封邮件到达时，我的第一个想法是：“这是真的还是垃圾邮件？这是一个真实的威胁吗？”


    数据的使用和误用现在是所有关注业务去向的董事会的话题。老格言“生命中只有两件事是确定的：死亡和税收”需要更新了。我在硅谷的朋友 Ramneek Gupta
    建议了一个新版本：“生命中有两件事是确定的：死亡和网络泄露。”


    董事会现在应该询问这类问题：


    * 我们持有哪些数据？

    * 谁有访问权限？为什么？

    * 这些数据中哪些部分对我们的运营是至关重要的，哪些部分我们可以放弃？

    * 我们为什么要持有它？例如，为了监管机构、为了我们自己、创新、还是其他？

    * 客户从中得到了什么好处？

    * 它是如何加密的？

    * 它是如何保护的？

    * 它是如何备份的？

    * 我们是否测试过保护数据的漏洞在哪里？


    大多数数据犯罪（勒索攻击等）的讽刺之处在于，小偷想要的是个人信息 (PI)：身份数据、信用卡、医疗记录、护照号码、医保号码，甚至关于你雇主的信息。然而，在许多强大的分析用例中，引擎不需要
    `PI` 就能预测最佳优惠或解决痛点。在写作时，亚马逊的个性化引擎尚未被破解，它是数十亿购买模式的总结。


