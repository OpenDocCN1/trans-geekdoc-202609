    \ 12 Technological Forces That Will Shape Our Future*, Kevin Kelly, Penguin, 2017.\n\
    \n                        *Leadership: Six Studies in World Strategy*, Henry Kissinger,\
    \ Allen Lane, 2022.\n\n                        *Select Committee on Artificial\
    \ Intelligence*, Lord Clement-Jones (Chairman), [https://publications.parliament.uk/pa/ld201719/ldselect/ldai/100/10001.htm](https://publications.parliament.uk/pa/ld201719/ldselect/ldai/100/10001.htm).\n\
    \n                        *The Premonition: A Pandemic Story*, Michael Lewis,\
    \ W W Norton & Company, 2021.\n\n                        ## Further listening\n\
    \n                        ‘PIVOT’, Scott Galloway and Kara Swisher [https://podcasts.apple.com/au/podcast/pivot/id1073226719](https://podcasts.apple.com/au/podcast/pivot/id1073226719).\n\
