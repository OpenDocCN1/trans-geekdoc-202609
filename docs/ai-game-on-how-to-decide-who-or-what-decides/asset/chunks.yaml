  trans: '


    董事会需要在治理层面着手工作，正如之前提到的，治理源于拉丁词 `gubernare`，意为“操纵”。站在船的桥上层可以为导航提供更高的视角。鸦巢更高，卫星则更高。规模化的数据使用允许人们获得更广阔的视野。光圈被打开了。同时，企业既需要望远镜也需要显微镜（字面和比比意义上的），以理解市场、客户行为、产品或服务的使用模式，既包括地平线上的宏观层面，也包括每个交互过程的原子级数据层面。优秀的数据用例可以提供规模化的视角，以及个性化所需的原子级细节。Netflix
    通过同一个数据驱动系统洞察了内容的宏观趋势和客户的微观使用。他们可以比传统内容创作者更低的风险订制新剧，因为他们可以预测哪些客户会看新剧。这不是焦点小组，而是真实的、规模化的洞察。


    在某些方面，历史可以被描述为对惊喜的研究；它是那些未被很好预测的大规模事件的发生。如果 JFK 的刺杀事件在达拉斯的那天就能被预见到，那么汽车就不会开到狙击手面前。历史将其记录为一个悲性的惊喜事件。惊喜的发生是因为数据的缺乏、对可用信息的误解，或无法预测接下来将发生什么。


    已故亨利·基辛格（Henry Kissinger）在他最近与 Eric Schmidt 和 Peter Huttenlocher 合著的书籍 `The Age
    of AI` 中指出，通常当某些事情无法被人类理解时，他们会将其视为天显神迹、厄运或自然现象。更准确地说，这也是缺乏数据以及从数据中获取洞察的结果。地震似乎是随机的；然而，通过更好的传感器、数据和模型，我们越来越能够预测它们发生的时间和地点，尽管我们还有很一段路要走。我们确实可以更好地预测地震的连锁反应，如海啸和火山灰。


    因此，理解许多组织前线的信号是如何被阻塞并无法到达董事会的是非常关重要的。信息流中杀死帝国的“杂质”是什么？组织中谁对干扰信号有既利益？你如何在你的组织中发现这一点？更好的是，如何创建一个不受干扰地直接将这些信息传递给领导团队的系统？这就是
    AI: Game On 公司可以做到的。


    客户下一个想要从你那里得到什么，如果你能很好地回答它，并且在竞争对手之前回答，这是一个具有极大价值的问题。决定采取或不采取哪些行动（这让你能够理解客户的需求），是意图/注意力经济中的核心资产。Google
    的帝国建立在收集这种信号并以接近光速的速度拍卖结果的基础之上。


    Kevin Kelly 在他富有见解的著作 `The Inevitable` 中说，丰富的答案只会产生更多的问题。““虽然机器可以无限地扩展答案，但我们形成下一个问题的时间是非常有限的。当答案变得廉价，而问题变得有价值时。”^(⁵⁶)


    “如果我给我一个小时来解决一个问题，而我的生命取决于它，我会用前 55 分钟来确定要问的问题，因为一旦我知道了正确的问题，我可以在不到 5 分钟内解决问题。”
    – 爱因斯坦


    好的问题将由机器创造，但目前这在很大程度上仍然人类的挑战。也许 AI 的未来更多在于 AI 学习哪些是最佳提问方式的速度有多快。这里有一些早期工具已经在提示人类提出问题。


    组织的注意力需要放在哪些是好问题，以及如何通过数据和 AI 回答这些问题，从而改变业务的轨迹。Michael Lewis 的书籍 `The Premonition`
    讲述了 Jose 博士的故事，他曾在哈佛接受过训练，并在美国卫生研究所研究了十年的疾病。他在发现患者哪里出了问题以及培训年轻医生方面是天才天才。每天早上，他都会与患者度过真实、亲密的时光，倾听他们关于自己经历的故事/回忆。通过对话，他深入了患者的生活，通过这些信息，他对可能导致症状的传染性疾病形成了鉴别诊断，正如
    Jose 博士所说：“你到底做了什么导致你患了这该死的病？”


    有一天，一个大学生来看诊了，他的躯干上有一块戏剧性且神秘的皮疹。当 Jose 博士到达时，他让学生分享了他的社交生活，并问道：“你上一次泡热水缸是什么时候？”而不是“你进过热水缸吗？”孩子的回答是：“几天前。”当时有人和你在一起吗？”Jose
    博士问。“是的，有几个朋友。“他们中有人长皮疹吗？”他问道。“其实有的。我室友就有，只是没那么严重。”这是典型的从热水缸中获得的`假单胞菌` (Pseudomonas)
    细菌。在医学院，医生被教导如何遵循清单来获取新患者的病史，而不是去探索患者的社交关系。传染病需要不同的方法，因为它们是通过人际接触传播的。在医学中，问对问题与董事会一样至关重要。


    正如 Sam Harris 评论道：“人类是观点机器。”^(⁵⁷)


    近年来，我与许多企业高管和董事会成员进行了多次对话，他们问道：“我们如何才能变得更以客户为导向，更符合客户的需求？”我发现自己回答道：“你无法修复你无法理解的东西”，而问题在于，大多数公司只是缺乏工具、文化和动力来真正理解客户，因此无法理解他们的需求。


    如果你为任何问题提供足够的数据，答案可能会发生很大变化，并能激发下一个问题。


    ## 数据和 AI 可以/应该应用在哪些决策上？


    我们正从从软件即服务 (`SaaS`) 转向决策即服务 (`DaaS`) 时代。现在自动化愚蠢成为可能的。


    有时数据会变成人为的无能。数据应用程序应该是智能、对客户友好并符合客户最大利益的。并非所有的都是如此。


    有一个美国航空公司安全人员的惨剧故事，他们用武力将一名乘客拖下飞机，因为自动乘客载量系统超载了，这在美国和欧洲是标准做法。`UA 3411 航班`上的乘客遭受了脑震、鼻骨骨折并丢失了两颗牙齿.^(⁵⁸)


    在考虑决策中 AI 与人类的互动时，理解决策过程以及通常做的决策类型都是重要的。


    `OODA 循环`（观察、调整、决定、行动）被用于帮助战斗机员“智胜”对手.^(⁵⁹)


    此外，在 AI 环境中，这个循环在不断重复，每个部分同时馈给所有步骤。


    ![Image](img/himg-101-1.jpg)


    现在，这种技术已被那些想要利用数据和 AI 推动业务优势和新业务模式的人所借用.^(⁶⁰)


    拥有的数据越多，模型就越好。模型越好，产品/服务就越好。这导致了更多使用，随之产生更多数据，循环继续下去。反馈是持续的，必须由人类进行监督和经过考虑的解读。


