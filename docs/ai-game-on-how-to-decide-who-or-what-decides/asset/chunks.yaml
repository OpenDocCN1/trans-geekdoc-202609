    ![](img/cover.jpg)


    ![图像](img/cover.jpg)


    ![图像](http://aigameon.com)


    致 Elizabeth、Syd 和 Anna。


    感谢你们：

    - 我们见过的奇妙世界。

    - 我们有幸结识的人。

    - 等待我们的冒险。


    # 关于 TIM TRUMPER


    Tim 是 `NRMA` 的主席，`Quantium` 的顾问兼创始股东（`Quantium` 为全球一些领先品牌提供数据和分析服务），他同时在几家私有高增长创新公司中拥有利益，包括
    `andi search`。


    他的职业生涯跨越了多个领域，包括人工智能和机器学习、大数据、数字化转型、出行与交通、金融服务以及媒体。


    他是利用数据驱动创新和公司战略的权威。他的核心兴趣在于业务领导者如何促进成功的 AI 和机器学习机器学习 业务转型，以驱动创新、制定公司战略，并为客户和社区提供服务。


    Tim 是一位丰富的董事长、非执行董事、前首席执行官（CEO），以及多家全球及澳大利亚高性能公司的顾问。


    他拥有 `UNE` 的 MBA 学学位，并在 2018 年完成了哈佛大学的“更有效的公司董事会治理计划”，并且是 `AICD` 的毕业生。


    # 前言


    很久以前，一位智者告诉我，没有哪一个时候是适合盖房子、生孩子、创业或写书的。对我来说，写这本书排在清单的最后位，而且这书已经准备了很久。感谢 Jaqui Lane
    和 Michael Parker 帮助我度过了这一切。


    我的数据之旅始于很久以前，当时我有幸遇到了互联网领域了不起的先驱 `Louis Rossetto` 和 `Jane Metcalfe`，这对人在 1993
    年于他们的旧金山办公室共同创立了 `Wired` 杂志。这开启我在数据和分析世界中的漫长旅程，并让我了解如何利用它们来理解和预测“意图”与“注意力”——我们时代的两种新资产类别。Rossetto
    和 Metcalfe 谈论了他们在万网黎明前夕看到的未来。当时的澳大利亚只有几百个电子邮件用户和少数几个运行网站，而这些网站不仅仅是绿屏上的文本。


    想想这三十年来发生了什么变化。几乎一切都改变了。


    Louis 指着一份《旧金山黄页》（San Francisco Yellow Pages）说：“这一文不值。”在当时，黄页是一个巨大的行业。他接着说：“如果你能算出这个周末旧金山谁需要医疗帮助或想买新车，那它几乎是无价的。我们在这里建立的是一种知晓一切的方法。”他说的是一种预测机器，这让我大开眼界。在
    `AltaVista`、`Yahoo`、`Google`、`Andi` 等平台出现之前，Louis 就预到了搜索的需求。这是一个惊人的预言。


    接着在 1997 年，微软（`Microsoft`）西雅图战略负责人对我说：“所有人知道，拥有关于客户需求最棒数据的人将获胜，”同时他解释了在拨号上网时代，他们如何试图理解数亿客户与
    `Word` 的交互情况。在 1997 年，这是一项令人惊叹的举措。


    我花了许多时间思考，这种关于大规模数据集的思维模式会产生什么。


    我在媒体行业工作了多年，利用我们拥有的数据来为战略提供最佳支持。那是来自调查和焦点小组的低级数据。我们已尽力而为。当互联网真正兴起时，它改变了游戏规则。


    在 2009 年，我遇到了 `Adam Driussi`，`Quantium` 的创始人也是现任 CEO。当时我正在帮助一家保险公司，Adam 向董事会做了一次演示。Adam
    头脑非常敏锐，并将对帮助公司发现真正的规模化洞察、以及日益将 AI 赋能的应用应用于其数据中的热情结合在一起。


    在看了数百次面向公司的演示后，我被 Adam 提出的方案所吸引了。他展示的内容非常有力量。通过使用去标识化的信用卡数据，能够理解保险公司客户的真实行为；这不是通过调查得出的，也不是小样本，而是规模化的，而且行为是真实的。


    最有趣的是，你如何利用这些数据来推断客户流失的原因。是因为价格、服务、糟糕的理赔体验，还是其他原因？数据实际应用中的细微差别是突破性的。客户公司购买了这项服务，它在当时帮助了公司的转型。


    我觉得这非常有趣，于是跟进了 Adam，在几次交谈后，我作为股东和顾问加入了 `Quantium`。`Quantium` 从那些只有约 14 人的日子，发展到今天拥有超过
    1200 名员工的全球业务。与 `Quantium` 的这段旅程让我与非常聪明的人合作，并学习了大量关于数据使用、分析和 AI 部署的前沿知识。当你读这本书时，你会发现我的很多观点很大程度上受到我与
    `Quantium` 关系的影响，毫无疑问，潜移默化在多年来一直发挥着作用。从事分析实践并了解董事会的治理关切并不是一种常见的组合，所以我真心希望这种视角对读者有所帮助。


    写这本书的第一个契机来自我的一位 CEO 级别的客户，他说：“你在数据使用、AI 赋能和数据伦理的最前沿已经拥有了三十多年的第一视角——为什么不告诉我们一些你学到的东西呢？”


    接着，澳大利亚前 20 家公司之一的董事长对我说：“Tim，你有一个独特的视角，因为你既是数据从业者，又是一家大公司的董事长。你可以看到董事会对治理、风险和战略的看法。你还能看到全球高管正在面临的数据和用例挑战。你还能看到他们的伦理困境。让大家知道你学到的东西吧。”


    上面的评论以及许多其他评论伴随了我多年。


    '
- fmt: '

    The Turing test (for whether a machine can exhibit intelligent behaviour indistinguishable
    from that of a human) is redundant now and deemed a low bar in the tech world.
    We have seen how a particular form of AI using natural language, known as `ChatGPT`
    (generative pre-trained transformer), passed the US medical licensing exam, the
    bar exam, and the Wharton MBA final exam. But bear in mind that it has also prepopulated
    a lot of false information and is a long way from perfect.


    Nonetheless, since its release in late November 2022, `ChatGPT` reached the 100
    million users metric with the fastest adoption rate ever for a new technology
    platform. It’s a sign that the world is at an inflection point – it is AI: Game
    On.


    The advances in AI and generative AI are now so omnipresent that we are surrounded
    by AI applications that appear to be human and, in many cases, deceive humans.


    Up until the early 2020s human beings have been the undisputed best source of
    knowledge, collectors of data, and the instigators of the most predictive capability
    in the known universe. From the most basic forms of knowledge, such as where is
    the next waterhole, and will we have enough food for the winter? Human beings
    could thrive with only some predictive cognitive ability. It is our superpower
    that allows us to survive against predators despite their superior physical assets.


    Today’s highly complex competitive business world boils down to the fact that
    the more accurately and faster you can predict what is going to happen to your
    organisation, your customers and your competitors, the more your your decisions
    will be today, and that changes your destiny.


    Google’s CEO called an ‘all-hands code red’ in December 2022 over the impact of
    generative AI and the explosion of innovation that is coming via OpenAI’s `ChatGPT-4`
    and other AI applications. If Google is worried about what it will do to their
    business, it may be naive to assume it will not influence every organisation.


    We are at the start of a new wave of large innovation that some claim will be
    the most significant in human history. When platform shifts happen, such as electricity,
    cars, television and the internet, the impacts come in waves and the final destination
    is not clear. We are here now for AI and all leadership teams need to be thinking
    about what AI: Game On means to them.


    Today’s world increasingly requires AI literacy, not coding skills. Although coding
    skills are clearly valuable, leadership teams will need to understand AI’s capabilities,
    risks and the use cases that align with the organisation’s purpose and society’s
    expectations. That understanding extends to people’s safety, their careers, and
    equitable aspects of humanity. We are at the time where it is AI: Game On and
    there is a growing need to navigate the AI systems that are beginning to pervade
    everyone’s lives.


    Eric Schmidt, former chair of Alphabet (Google), notes:


    > It’s pretty clear to me that there’s going to end up being the system that knows
    everything, and then there’s going to be a supervisory system that limits it.


    The founder of a data analytics company in San Francisco said to me, ‘There are
    only four things that you can do with predictive data: find customers, keep customers,
    understand what they want next from you and optimise your `capex` towards the
    future needs of the customer.’ All four are mission-critical.


    In 2008 Chris Anderson, editor of *Wired*, stated that the ‘sheer volume of data
    would obviate theory and even scientific.’

