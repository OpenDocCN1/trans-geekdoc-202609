    很难准确了解 OpenAI 的实际人数，这家公司促成了 `ChatGPT-3` 生成式作品的诞生。2023 年 3 月的 LinkedIn 显示大约有 570
    人。从生产力的角度考虑这一点：少于 1,000 人的人创造出了一种以以前所未有的速度改变世界的工具。现在这可能证明只是一个时间上的瞬间；然而，它对商业界和公众对
    AI 想象的影响将是深远的。知识产权（IP）和数据超越劳动力和资本的趋势在许多领域是显而易见的，并将从这里继续增长。


    例如，亚马逊的交叉销售算法产生了亚马逊所有零售销售额的约 35%。这意味着，当你在亚马逊上购买一本书、吉他或其他任何物品时，网站会回复“购买过此书的人也购买了……”，这种根据客户的持续选择进行自动且持续调整的推荐，驱动了惊人的新销售额量。以美元计算，亚马逊通过该算法创造了
    480 亿美元的收入。


    因此，可以认为亚马逊所拥有的关于客户的知识产权及其算法现在的价值已经超过了地球上几乎每一家零售商，像 `Walmart` 这样的巨头除外。IP 和数据正在取代劳动力和资本，成为价值创造的基石，董事和高管需要意识到并准备好如何带领公司进入
    AI：游戏开启时代（Game On age）。


    在与美国一位领先的投资银行家聊天时，他的观点是做空任何销售带条形码产品的公司。当他采访大型零售公司的 CEO 时，如果他们的产品是通过条形码销售的，他会问：“你计划如何阻止亚马逊以比你更便宜、更优质且交货更快的方式销售这些产品？”如果他们的答案令他不满意，他就会进行下注其股票下跌的交易。他非常震惊，竟然有这么多
    CEO 很少给出一个令人满意的回答。“他们给了我一些关于以客户为中心的倡议的空话，但大多数人并没有采取规模化的行动将数据和 AI 置于公司的核心和脊柱。”这些组织的董事会目前正处于这种境地，董事和高管需要让组织拥有自己的使命、伦理，以及数据驱动的骨干、基于伦理的心脏与所有利益相关者之间的联系。失去了心脏，你就只是一个数据驱动的
    AI 弃儿，等待着媒体的舆论风暴。做得太少，你就是柯达遇上百事达。Bed Bath & Beyond 是一个极佳的案例研究。我认识有人在 2017 年在他们的分析团队工作。他感到很沮丧，因为团队领导过于确定他们已经涵盖了一切，声称涵盖了所有的
    AI 应用、个性化优化等。问题是，没有人告诉客户。一份声称你已经解决了这些问题的 PPT 幻灯片是行通通。


    “每个人都知道，拥有关于客户需求最佳数据的人将获胜。”这些话是 1997 年在西雅图微软总部的一场会议上对我说的。那位高管正试图研究如何从数百万使用他产品的客户那里获取信号，以便为他们设计出更好的产品。那时的互联网在很大程度上仍是拨号上网，缓慢且笨拙。数据策略在
    1997 年并不是你会听过的话题，但这些话留在了我的脑海中，标志着某些重大事件的开始。


    想象一下在 1997 年实时学习 2 亿多人使用你的产品在做什么。在当时，这就像是在说你正在研究时间旅行。这种在当时是如此独特的方法，已被证明是正确且对生存至关重要的。然而，在近三十年后，许多组织仍在研究如何从真实的规模化客户洞察中找到他们的数据策略。你的组织如何从未来可能被数据
    AI 驱动竞争对手挑战的同质化传统产品中多元化？这正是董事和高管需要问的问题。


    AI 近期惊人的进步将加速拥有强大自有数据集的公司的优势。世界上最臭名昭著的选股人之一 `Cathie Wood` 在 2023 年 2 月声称：“我们相信，从人工智能中受益最大的隐藏宝石是那些拥有自有数据集的公司。”他们声称
    `Tesla` 是一个很好的例子，因为它拥有道路和驾驶行为的数据。注意，这并非投资建议！


    `a16z` 播客在 2023 年 1 月询问了 Andreessen Horowitz 的一些投资合伙人对 2023 年的主题看法。他们说：“如果一家公司没有
    AI 策略，它真的应该在昨天就开始考虑了。”该播客指出，他们看到 AI 在组织的后勤部门带来了 10 到 100 倍的生产力提升，不仅是在客户端，还包括采购、财务等领域。随着
    AI 的使用成为标配，你需要自己的策略来驾驭它的力量。


    不提问且不对这类问题采取行动，在我们进入 AI：游戏开启世界时，将限制你的业务。


    以我写下这些字时正在喝的 San Pellegrino 为例。任何人都可以将其输入 `Google`，在搜索中添加“最低价”，它就会找到由 `Google`
    SEO 和付费广告所定义的最佳报价。策略大师 `Michael Porter` 说：“业务需要决定是廉价的还是差异化的”；痛苦源于无差异化的产品。我们现在正看到“差异化”与“更廉价”的结合。亚马逊等巨头提供的“低价——快速交付”服务是难以战胜的，当经济效益产生于客户身上时，客户将会迁移，尤其是来自一个能够消除购买摩擦的信誉提供商时。


    San Pellegrino 对它的客户了解什么？它知道在哪些地区由哪些零售商制造并销售了多少规格和口味的瓶子，但公司能对客户的习惯了解什么？他们在哪里喝
    San Pellegrino，除了解渴之外还为了什么目的？除非他们增加自己的仓库数据，否则他们将不知道客户在喝它时吃了什么，他们的年龄是多少，他们是忠诚还是会转向其他气泡水，他们对价格有多敏感，或者他们每天通常消费多少。还不知道厨房里的
    `SodaStream` 对该家庭消费会产生什么影响。San Pellegrino 是否主要在招待客人时消费？这种来自真实数据的特定消费者洞察依赖于生产者与每个客户建立关系，即通过外部关联数据建立客户的直接视线。超市忠诚卡正是为此目的开发的，在有优秀软件和分析的情况下，它们就能很好运作。这就是为什么，如果你的业务与客户之间的互动很少，或者缺乏“信号”，你应该警觉，并开始投入思考和资源来回答诸这样的问题：我如何与客户直接创造信号？我能发明什么样的产品让客户与我互动从而增加客户信号，我能从这种信号中为客户提供什么利益？确保回答了最后一个问题，否则你创造的是客户的骚扰而不是利益。

