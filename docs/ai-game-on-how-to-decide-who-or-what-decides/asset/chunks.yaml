- fmt: '

    In today’s AI: Game On world, there are tools that will prescore every customer
    in the call centre with tenure, lifetime value, most likely reason to call, and
    best next conversation to help the customer.


    ## Signals and noise and how to spot the difference


    ‘You learn a lot more from your customers than you do from the competition.’ –
    `Michael Dell`


    Signals from customers are gold and have always been the key to real customer-centricity.
    I worked in magazines many years ago and arguably the most successful editor in
    Australia at that time was the legendary Nene King. Nene would spend her weekends
    in supermarkets watching women pick up ‘her’ magazines at checkout (`Australian
    Women’s Weekly`, `Women’s Day`) and ask them questions such as: Why did you pick
    up the magazine? What on the cover prompted you to pick it up? What article were
    you reading? Why did you put the magazine back? That was analogue customer feedback,
    the point being she was obsessed with the customer and what motivated them to
    pick up the magazine in the first place and then purchase it, or not.


    Tim Ferriss interviewed `Michael Dell`, the Founder of `Dell Computers`, in 2021.


    If you have 10,000 retail stores and you’re trying to predict what people are
    going to go into those stores and buy, you can have really sophisticated AI and
    try to guess that, but ultimately it’s just a guess, and you’re having to stage
    and prepare all sorts of things and anticipate sales and it’s going to be wrong.
    And, to some degree, demand is going to change, and unexpected stuff is going
    to happen. Whereas because you’re in direct contact with that customer you have
    clear information, and the quality of your demand signal is perfect.


    `Michael Dell` went on to explain how companies who are finding new ways to generate
    persistent signal back from customers are well placed to spot changing needs,
    and decode future needs of customers.


    Dominos is another example. They want you to buy pizza on their app because they
    want to make it easier and cheaper for you to order their pizza. They also want
    to learn more about you (what your pizza and related product preferences are,
    where you live, your email, purchasing preferences etc.). While they’re keen to
    capture this information they will need to have their customers’ interest at heart
    by adding value; otherwise, customers won’t use the app to buy from them. Customer-centricity
    in terms of the experience of using the app must be great for the customer and
    continuously improve. Otherwise the company will see high customer churn as competitors
    or new entrants create better customer experience.


    So, if you’re going to develop an app for your product/service, or drive people
    to your website/call centre for purchases and support, you’d better make sure
    these interactions really add value across the whole experience, and it’s not
    simply self-serving/cost-cutting for you. Companies need to ask the question,
    who is this benefiting most here, the organisation or the customer?


    An executive in San Francisco shared the following with me. ‘There are four things
    that you can do with data’


    1. Find customers.

    2. Keep customers.

    3. Understand what they want next from you.

    4. Optimise your capex towards the future needs of the customer.


    They are all mission-critical.


    Let me share a personal experience. I share a holiday house out west of Sydney
    in a remote location and I was with a satellite company called `Activ8me`, a small
    Australian telco (and in fairness to them, they’ve been great). But we’ve just
    connected to Elon Musk’s `Starlink`,


    After calling `Activ8me` to cancel, the representative did the paperwork, but
    never asked me why I was cancelling. The key customer signal for `Activ8me` was
    missed and this business will sadly be hit hard as a consequence of better tech
    by `Starlink`. The representative could have asked me: ‘Why are you leaving? What
    have we done that makes you want to leave? How can we keep you?’


    The end result? `Starlink` is already eating the Australian government’s `NBN`
    and `Sky Muster`-based offering, as the `Australian Financial Review (AFR)` headline
    in January 2022 indicates: *Elon Musk’s Starlink global internet creeps onto NBN’s
    turf.*


    Between 69% and 80% of online orders are abandoned (not converted),


    Think about this. Of 100 people who head to your website to buy only 20–30 complete
    the transaction. If you could understand why potential customers weren’t completing
    the transaction, you could deliver significantly higher revenues for your organisation
    and a better customer experience. Not only that, you could improve inventory management,
    which again is better for customers and your bottom line.


    For digital shoppers, the primary reason for abandoning an online order was the
    high extra costs at checkout (shipping being significant), followed by discount
    codes that do not work, the requirement to set up an account and the process taking
    too long


    I have worked with companies that have undergone thorough research on their abandonment
    rates. In one case a high percentage of potential customers reached the second
    stage of a three-stage process and then abandoned the cart. So, the right question
    to ask was: What is it about stage two? Does it ask for too much information?
    Does it take too long? Do people get stuck filling out information? By asking
    numerous questions, changing elements of the process, and using AB testing, the
    company was able to pinpoint the pain points.


    Utilising and analysing data also have the benefit of anonymity of observation.
    Known as the Hawthorne effect, people behave differently when they know they are
    being observed. In surveys, there are any number of biases that can creep or leap
    into play: non-response, response (answering with what someone thinks the survey/interview
    wants to hear), question design and order, halo effect and more. This said, you
    are better off observing than not. It is also why looking at data (de-identified
    credit cards, shopping preferences, subscriptions, memberships etc.) is significantly
    more accurate because you’re not intervening in the customer’s behaviour. Rather,
    you get a raw, objective signal.


    `Dell` knows what customers want as it deals directly with them every moment of
    every day. `Michael Dell` would have seen the demand curve for processing capacity
    go up every minute/day and asked what could be done: What can we build that fits
    into the next best view of the customer?


    ## Data and attention


    Seventy-two per cent of all companies are working on trying to improve customer
    experience


    The best customer experience is often not discernible at all, as it is friction-free.
    When you stream a Netflix TV show it just works. The experience is good, because
    you don’t need to talk, walk, click or chat, it just plays. If you sit still the
    next episode plays in a friction-free model (which we now know as bingeing). How
    does your business compare with low-friction competitors?

