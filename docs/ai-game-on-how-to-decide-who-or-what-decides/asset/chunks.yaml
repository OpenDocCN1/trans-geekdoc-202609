    \ are often deeply complex as they relate to the balance between personal responsibility,\
    \ community responsibility and standards, as well as what we are prepared to cede\
    \ to the state or a global tech platform, or both.\n\n                       \
    \ I do not think that computer scientists, tech industry leaders and professionals\
    \ should make these decisions, especially if you read my chapter about the ethics\
    \ around data. Boards, tech industry leaders, professionals and computer scientists\
    \ should engage the wider population and explain more clearly and transparently\
    \ that many of today’s tools, AI and other systems give all of us a range of choices.\n\
    \n                        In China, a law was introduced in 2019 that banned minors\
    \ from playing video games between 10 pm and 8 am, or from playing more than 90\
    \ minutes on a weekday. On 1 June 2021 every game in the country was required\
    \ to add a new authentication system that checks a player’s Chinese national identity\
    \ (including their age) to help block underage players from going past those limits\
    \ in the name of preventing video game addiction. As a result, Tencent, the biggest\
    \ game company in the world, is rolling out facial recognition technology that\
    \ will likely scan many gamers’ faces every single evening, aiming to catch minors\
    \ breaking a gaming curfew and help prevent video game addiction. ^([^(98)](#fn98))\n\
    \n                        ## [The future is already here](#content-toc.xhtml#pz7-12)\n\
    \n                        We’re seeing this play out in the world of business,\
    \ government and research where there’s a bifurcation of those that use AI well,\
    \ namely the large tech giants of the world, and everybody else, who are yet to\
    \ fully understand it. The challenge for companies that lag behind in the data/AI\
    \ race is that once your competitors (or even companies that you didn’t perceive\
    \ as your competitors) have the data/AI advantage, this advantage keeps accruing\
    \ to them exponentially, as they can now create more AI and accelerate even faster.\
    \ This flywheel effect makes it difficult or near impossible for others, perhaps\
    \ you and your company, to catch up.\n\n                        The Canadian philosopher\
    \ and founding father of media theory Marshall McLuhan argued in his seminal work\
    \ *Understanding Media: The Extensions of Man* that the ‘medium is the message’,\
    \ that the way humans absorb information remoulds who we are as individuals and\
    \ as a society. McLuhan said that the shocking TV footage of the JFK assassination\
    \ was the start of TV news becoming a big deal. Up until that moment news was\
    \ for newspapers. Once you see that terrible moment, you realise no newspaper\
    \ can really cover the news like that. Communication technology changes society.\
    \ AI use is similar, in that it is now a medium and a message in one. Once you\
    \ see real personalisation selected for you, real text-to-image applications,\
    \ and conversations output in databases and the like, you can’t go back to the\
    \ old world. The change is impossible to reverse.\n\n                        The\
    \ cost to sequence a whole human genome has declined from $3 billion in 2003 to\
    \ around $500 today – 5 X what a Moore’s law trendline would dictate. The time\
    \ required to sequence a genome is also plummeting. The first genome took 13 years\
    \ of computing power, and now only requires a few hours of it. As costs have declined\
    \ and computing power has increased, the number of human-genome base pairs sequenced\
    \ per US dollar has soared (see [chart](#chapter09.xhtml#pz151-4)). DNA sequencing\
    \ costs will continue to decline. By 2025, or sooner, the cost to sequence a human\
    \ genome will drop to $100. However, the cost will keep declining to the equivalent\
    \ of ‘one delivery pizza’, and ultimately to less than one cent per genome – the\
    \ price of flushing a toilet.\n\n                        ![Source: National Human\
    \ Genome Research Institute https://www.genome.gov/about-genomics/fact-sheets/Sequencing-Human-Genome-cost.](images/himg-151-1.jpg)\n\
    \n                        **Source: National Human Genome Research Institute**\
    \ **[https://www.genome.gov/about-genomics/fact-sheets/Sequencing-Human-Genome-cost](https://www.genome.gov/about-genomics/fact-sheets/Sequencing-Human-Genome-cost).**\n\
    \n                        Screening newborns is also a new frontier, as Raymond\
    \ McCauley, chair of Digital Biology, explained back in 2017:\n\n            \
    \            As costs continue to fall, it may become standard practice to sequence\
    \ the genomes of new-borns. We’re going to be, as a matter of course, sequencing\
    \ infants’ DNA and predict the things that this human being is likely to face.\
    \ We’ll know what to worry about in the first 72 hours, then the first 6 months,\
    \ then the first 3 years, then what we tell them when they turn 18.^([^(99)](#fn99))\n\
    \n                        This is a road map to the prediction of many health\
    \ issues for the individual. It’s a worthy debate to be had. Do you want to know\
    \ your chances of getting skin cancer in later life or not? If you did know your\
    \ risks, would you change lifestyle factors to help lower risk? If you knew the\
    \ risks for your children would you treat them differently?\n\n              \
    \          There is a lot of conjecture about the way AI will lower operational\
    \ costs in organisations, via increases in productivity and replacement of some\
    \ jobs. AI seems to have deflationary capability and how this plays out will be\
    \ fascinating. As the world’s demographics age, particularly in developed countries,\
    \ where natural population growth is declining, AI use may well turn out to be\
    \ a powerful addition to GDP growth.\n\n                        I’ve written this\
    \ book to help business leaders (in the broadest sense) think about what else\
    \ could be predicted in their business and market for their customers as we are\
    \ now in AI: Game On. The market for genetic-testing services is projected to\
    \ be more than $17 billion by 2026. This is a new prediction industry in health.\
    \ What is your current business and what could or must be your future business,\
    \ based on an AI: Game On approach? What data is available in your business right\
    \ now and outside it to do this?\n\n                        ## [AI and its impact\
    \ on everything](#content-toc.xhtml#pz7-13)\n\n                        **‘Artificial\
    \ Intelligence is the new electricity.’** – Professor Andrew Ng\n\n          \
    \              Google CEO Sundar Pichai notes that the impact of AI will be even\
    \ greater than that of fire or electricity on our development as a species. So\
    \ caution is needed now.\n\n                        When and if a machine can\
    \ outthink humanity, and out-predict our needs, the world becomes a riskier place.\
    \ Any machine that can think and predict human needs and intentions needs to do\
    \ so in a way that is aligned with humanity’s interests. Who has the right to\
    \ own such a machine?"
