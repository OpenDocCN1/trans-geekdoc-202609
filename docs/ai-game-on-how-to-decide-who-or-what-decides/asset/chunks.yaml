  trans: '

    全球范围内对于数据采集以及人工智能和机器学习开发必须具备的伦理基础，正进行着激烈的讨论。大多数政府现在正竞相制定并实施针对数据使用和人工智能的法规、报告制度和问责机制。尽管如此，任何程度的监管和法律都无法取代个人和企业对数据伦理使用的集体责任。


    互联网之父蒂姆·伯纳斯-李（Tim Berners-Lee）曾说：“数据是宝贵的东西，它的寿命将比运行它的系统更长。”各董事会成员已经意识到，糟糕的数据使用、卫生管理和滥用将成为集体诉讼和监管审查的温床。


    英国上院人工智能特别委员会主席克莱门-琼斯勋（Lord Clement-Jones）分享了该委员会的核心建议——五项伦理原则，他认为这些原则应适用于国内和国际领域：


    *   人工智能的发展应当符合人类的共同利益并造福人类。

    *   人工智能的操作应基于可解释性和公平原则。

    *   人工智能不应被用来损害个人、家庭或社区的数据权利或隐私。

    *   所有公民都应权接受教育，使其能够与人工智能一起在心理、情感和经济上蓬勃发展。

    *   绝不应赋予人工智能伤害、摧毁或欺骗人类的自主权力。


    不受控制的创业活动可能带我们进入黑暗领域。用例必须与上述伦理原则保持一致。某些用例可能会人类难以从中恢复。人类基因组在促进健康进步时如此强大，但如果被用于不符合人类最佳利益的目的是改造，则又令人担忧。


    一旦原子弹被开发、测试并使用，其影响是众所周知的，并对后世产生了影响。无论你如何看待这种武器的伦理本质，关于今天谁有权开发此类技术，需要每个人都仔细思考。此外，需要制定、实施和监控规则、指南和法规（最好是全球性的）。在一个人工智能瞬间在全球范围内扩散和发现的世界里，必须对伦理原则以及应用于整个数据和人工智能频谱的监管框架进行深思。


    ## 人工智能中的偏见与人类决策


    商业界及更广泛社区围绕人工智能的许多讨论，集中在组织部署的算法中可能存在的意识和无意识偏见，以及这些偏见如何对各种交互结果产生正面或负面影响。


    机器可能会做出错误的决策，而且这种错误是规模化的。但人类会根据情绪、无意识偏见、不完整的信息以及无法吸收大量和不同来源的信息而做出许多错误决策。


    当我们算法决策与人类做出的决策进行比较时，我们往往会找错基准。例如，让我们考虑特斯拉（Tesla）如何因为其自动驾驶模式发生的死亡事故而面临着真实的压力，这是理所应当的。第一辆特斯拉在美国发生车祸并导致死亡的那一天，是全球性新闻。就在那天，还有
    90 多起其他交通事故死亡事故，美国道路上平均每天死亡人数超过 100 人，这是一个悲剧但罕少受到质疑的人类基准。在所有这些人类驾驶的灾难中，几乎没有数据可以让我们理解这些事故发生的真正原因。而在特斯拉的事故中，有成千上万的数据点可以帮助特斯拉不断改进汽车的运行方式。特斯拉在其官方网站上发布关于所有事故的信息是很有帮助的。


    2021 年，美国道路记录了惊人的 42,000 多起死亡事故。对这些悲剧的法医学理解很难剖析，因为多种事件的组合很常见：光线昏暗、路况不佳、速度、酒精、疲劳、轮胎光光的汽车等等，导致每场悲剧事件的因素清单还在不断加长。


    对于导致 42,000 起“非特斯拉”死亡事故背后的人类决策性质，很少有审查。相比之下，特斯拉系统始终在实时从驾驶行为、车辆行为和局部情况中进行学习。而人类只了解自己的驾驶技术。更糟糕的是，我们倾向于教自己的孩子开车。如果父母有坏习惯，这种习惯很容易传递给下一代。如果无人驾驶汽车发生事故，可以通过编码来规避该错误并永远避免。


    特斯拉优化其自动驾驶系统的能力增长呈指数级，快于人类进行的驾驶培训。


    在澳大利亚，关于车祸的实际数据同样匮乏。大量的原因或结果数据在所有自动驾驶汽车中都可以获得，但无法通过人类评估（警察和车祸调查员）获得。Quantium 首席执行官、联合创始人亚当·德里西（Adam
    Driussi）表示：“更好的数据将胜过更好的算法。最好的数据和最好的算法结合在一起是非常难以的。”最好的结果是确保使用的算法和数据都是最高标准。


    我们人类既有意识也有无意识的偏见，我们做出的决策和错误也很难审计——我们无法在大规模范围内重编程。


    良好的数据和人工智能治理必须允许数据分析以及任何实际或感知的偏见和错误得到评估、审计、修复和重编程。人工智能有比人类更稳健、偏见更少的潜力，消除决策中的偏见是一个关键优先事项。现实是，人工智能继承了人的偏见，因为偏见是由人创造的。计算机梅尔文·康威（Melvin
    Conway）博士制定了所谓的“康威定律”（Conway''s law），该定律指出：“设计系统的组织受限于产生这些组织通信结构的复制。”


    康威定律也存在于教育机构中。在培训技术学生的伦理教育时，机构大多采用了所谓的“硅谷式”的人工智能伦理方法，这种方法围绕单一文化框架构建，强化了白人男性西方的视角，而这种视角正教导并影响着作为数据科学家、人工智能和机器学习专家主军的年轻男性群体。这可能意味着，支撑数字技术以及全球相关监管和伦理框架的基础本质上是有偏见的。


    在 2021 年的一篇文章中，埃马纽埃·R·戈菲（Emmanuel R. Goffi）讨论了文化多样性在人工智能伦理中的重要性，指出 AI 伦理准则西方占
    63%。根据《全球人工智能伦理指南格局》作者的说法，这种过度代表表明人工智能待遇缺乏全球平等，并显示出经济最发达的国家正通过“忽视当地知识、文化多元性和全球公平性”来塑造辩论。戈菲建议，“我们需要将人工智能伦理规则的讨论开放给不同的文化，并因此引入不同的哲学视角。”意识到围绕人工智能、数据和伦理的讨论很大程度上由西方主导是令人不安的，因为它忽略了亚洲、中国、印度、拉丁美洲、非洲和中东等地区的不同文化和哲学视角及构建。

