- fmt: '

    There is a robust global discussion around the ethics that must underpin the collection
    of data and the development of AI and machine learning. Most governments are now
    racing to develop and implement regulations, reporting and accountability for
    data use and AI. That said, no amount of regulation and laws replace the concept
    of individual and collective corporate responsibility for the ethical use of data.


    The founder of the internet, Tim Berners-Lee, said, ‘Data is a precious thing
    and will last longer than the systems it runs on.’ Boards are on notice that poor
    data use, hygiene and misuse is a place of class actions and regulatory scrutiny.


    The head of the UK House of Lords Select Committee on AI, Lord Clement-Jones,
    shared the core of that committee’s recommendations – five ethical principles
    which, it says, should be applied across sectors, nationally and internationally:


    * Artificial intelligence should be developed for the common good and benefit
    of humanity.

    * Artificial intelligence should operate on principles of intelligibility and
    fairness.

    * Artificial intelligence should not be used to diminish the data rights or privacy
    of individuals, families or communities.

    * All citizens should have the right to be educated to enable them to flourish
    mentally, emotionally and economically alongside artificial intelligence.

    * The autonomous power to hurt, destroy or deceive human beings should never be
    vested in artificial intelligence.


    Uncontrolled entrepreneurial activity could take us to some dark places. The use
    case needs to be aligned with the ethical principles above. There are some use
    cases from which humanity may struggle to recover. The human genome is so powerful
    when used for good health advancement, yet so concerning if used to modify humans
    for a purpose that is not aligned with humanity’s best interest.


    Once the atomic bomb was developed, tested and used, its impact was known and
    it has had consequences for generations. Whatever you think of the ethical nature
    of this weapon, just who has the right to develop such technology today needs
    to be carefully thought through by everyone. And rules, guidelines and regulations
    (preferably global) need to be formed, enacted and monitored. In a world where
    AI is dispersed and discovered globally within an instant, much thought needs
    to be given to the ethical principles and a regulatory framework applied across
    the whole of the data and AI spectrum.


    ## Bias in AI and human decision-making


    Much of the discussion in the business and wider community around AI is focused
    on the conscious and unconscious bias that may be in the algorithms that are being
    deployed by organisations, and how these might positively or negatively impact
    the outcomes of various interactions.


    Machines can make bad decisions and they can be at scale. But humans make a lot
    of bad decisions based on emotion, unconscious biases, incomplete information,
    and the inability to absorb large quantities and different sources of information.


    When we compare algorithmic decisions to decisions that humans make, we often
    get the baselines wrong. For example, let’s consider how Tesla has faced real
    pressure, as it should, for the fatalities that have occurred with their self-driving
    mode. The day that the first Tesla crashed in the USA and killed someone it was
    worldwide news. That day there were more than 90 other road fatalities, and an
    average of over 100 deaths occur each day on roads in the USA, a human baseline
    that is tragic yet rarely questioned. Of all these human driving catastrophes
    there is little data to understand just why these happened. Whereas in the Tesla
    crash, there are tens of thousands of data points to help Tesla continuously improve
    how the car operates. It’s useful that Tesla publishes information about all crashes
    on its website.


    In 2021, a staggering 42,000-plus fatalities were recorded on American roads.
    The forensic understanding of these tragedies is hard to unpack as combinations
    of events are common: low light, poor road conditions, speed, alcohol, fatigue,
    cars with bald tyres, and on goes the list of factors that add up to each of these
    tragic events.


    There is very little scrutiny into the nature of the human decisions behind the
    errors that lead to 42,000 ‘non-Tesla’ deaths. In contrast, Tesla systems learn
    from driving behaviours, car behaviours and local situations all the time, in
    real time. Humans know only our own driving techniques. Worse still, we tend to
    teach our own children to drive. If the parent has a bad habit, it can easily
    be transferred to the next generation. If the driverless car has an incident,
    it can be coded to avoid that mistake and avoid it forever more.


    Tesla’s ability to optimise its autopilot grows exponentially faster than a human
    undertaking driver training.


    In Australia, there’s the same paucity of actual data about car crashes. A great
    deal of the cause or effect data would be available in all self-driving cars but
    not via human assessments (police and car crash investigators). ‘Better data will
    outperform better algorithms,’ says Adam Driussi, CEO, co-founder and CEO of Quantium.
    ‘Combined, the best data and best algorithms are very hard to beat.’ The best
    result is to ensure both the algorithms and the data being used are of the highest
    standard.


    We humans have biases, both conscious and unconscious, and we make decisions and
    mistakes that are hard to audit – we are impossible to reprogram at scale.


    Good data and AI governance must allow the data analytics and any actual or perceived
    biases and mistakes to be evaluated, audited, repaired and reprogrammed. AI has
    the capacity to be more robust and less biased than humans, and getting bias out
    of AI decision-making is a key priority. The reality is that AI has inherited
    biases from people, as people create them. Computer scientist Melvin Conway PhD
    developed what is known as Conway’s law, which states that ‘organisations which
    design systems are constrained to produce designs which are copies of the communication
    structures of these organisations.’


    Conway’s law exists within educational institutions as well. In training technology
    students on ethics, institutions are mostly taking what’s been dubbed a ‘Silicon
    Valley approach’ to AI ethics that is structured around a single cultural frame
    that reinforces a white, male Western perspective taught to and therefore influencing
    younger, male minds who make up the bulk of data scientists, AI and machine learning
    specialists. What this might mean is that the ethics underpinning digital technology
    and associated regulatory and ethical frameworks of worldwide are essentially
    biased.


    In a 2021 article, Emmanuel R. Goffi discussed the importance of cultural diversity
    in AI ethics, noting that the West accounts for 63% of the codes relating to the
    ethics of AI. According to the authors of ‘The Global Landscape of AI Ethics Guidelines’,
    this over-representation indicates a lack of global equality in the treatment
    of AI and shows that the most economically advanced countries are shaping the
    debate by ‘neglecting local knowledge, cultural pluralism and global fairness.’
    Goffi suggests that ‘We need to open the discussion about the ethical rules of
    AI up to different cultures and, therefore, different philosophical perspectives.’
    It makes for uncomfortable reading to recognise that much of the discussion around
    AI, data and ethics is Western-dominated, largely leaving out the different cultural
    and philosophical perspectives and constructs of the likes of Asia, China, India,
    Latin America, Africa and the Middle East.

