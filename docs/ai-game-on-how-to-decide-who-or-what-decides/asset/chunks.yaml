  raw: 'Data and AI are changing and will continue to change every aspect of our lives.
    This is on top of many other profound transformations. We’ve just been living
    through one of the most challenging periods of the last 50 years. We have had
    a one-in-100-year global pandemic, followed by massive trade instability as a
    result of Russia’s war on Ukraine, and we are experiencing the influence of climate
    change. All of which have resulted in significant disruption. Resilience and adaptive
    capabilities may have never been more important than they are today, for individuals,
    organisations and societies.


    The capturing, harnessing and sharing of data and its interpretation has, arguably,
    enabled the world’s leaders and medical professionals to research, develop and
    deliver pandemic responses vastly more effectively and efficiently than we’ve
    ever seen before. This has saved millions of lives, reducing the impact of the
    virus on millions of others and averting a global economic crisis.


    AI is being deployed across a wide range of health and medical treatments. For
    example, take the assessment of lung cancer from X-rays. One doctor/radiologist
    can only look at a certain number of X-rays per day and use their knowledge to
    look for health problems like cancer. An AI machine capable of continually learning
    can view thousands per day. Combine the radiologist with the machine and you’ve
    now got significantly increased capability. There is real excitement about how
    AI can notice correlations and early signs of other diseases. Some of this has
    not been picked up before and is now being investigated further by humans.


    I recently saw a demonstration of [Enlitic.com](http://Enlitic.com) in a public
    forum, which was impressive, showing the scanning of thousands of X-rays to detect
    anomalies at incredible speed and great accuracy. They are focused on solutions
    using AI tools that positively impact patient care and that their AI can find
    health issues with greater accuracy than doctors alone and at much greater speeds.^([^(10)](#fn10))


    For the financial sector, especially in Australia, the Royal Commission into Misconduct
    in the Banking, Superannuation and Financial Services Industry, and resultant
    responsible lending recommendations, has effectively changed the law in terms
    of home loans. It’s moved from ‘let the buyer beware’ to ‘let the seller beware’.
    Banks and other financial institutions around the world are going to need specific
    criteria to decide which products they can sell to who. If you are not using real
    data to know your customer and what you could or should not be selling to them,
    a regulator may well want to ask you why not?


    While Know Your Customer (KYC) is something that banks are regulated to comply
    with – mainly for anti-money laundering purposes – they, and other large companies,
    are all aiming at some form of customer-centric goal. The reality is AI is not
    being deployed at anywhere near the scale and sophistication to really know their
    customers, or better still predict what they need, when they need it.


    Here’s a recent personal example. I received a cheque. Do you remember them? So,
    I found the bank branch and deposited the cheque, and, as I did so, the teller
    asked me if I needed a car loan. I felt sorry for the teller, because I’d paid
    cash for my car with that bank, so my transaction history inside of the bank tells
    them I don’t need a car loan, but the teller at the front desk didn’t have that
    information. Rather he had a self-serving instruction from head office to try
    and sell car loans. My data is there to be used for my benefit, but their systems
    are too disconnected to empower the teller with the next best conversation to
    have with me for my benefit. Banks with better management focused on customer
    innovation with data, and fintech challengers, will not be this slow to use their
    customers’ data and will be able to create the next best action – a conversation
    with the customer, based on their specific needs.


    It’s hard when you’re the incumbent because ego and hubris get in the way. In
    his 2014 letter to Berkshire Hathaway shareholders Warren Buffett referred to
    his ABC checklist:


    ‘My successor will need one other particular strength: the ability to fight off
    the ABCs of business decay, which are arrogance, bureaucracy and complacency.
    When these corporate cancers metastasize, even the strongest of companies can
    falter.’^([^(11)](#fn11))


    ## [Data AI capability/data AI leadership scarcity](#content-toc.xhtml#pz5-23)


    Several years ago, the challenge for business was that they didn’t have enough
    accessible data. The start of the typical data journey is that data is in different
    formats, in different parts of the business, and is not shared. In many cases,
    data is actively hidden or held back from other parts of the business. Knowledge
    is power; pay and advancement have, up until now, been tied to data silos, making
    knowledge a power paradox.


    Most digital transformation projects are specific, time-limited projects, rather
    than an integrated, whole-of-business transformation that puts data at the centre
    of everything. In [Chapter 5](#chapter05.xhtml#page_83), I explore the data spine
    concept, and how successful companies today and tomorrow will have a data spine
    that supports the flow of data throughout the organisation, and it’s this approach
    that is a true data transformation.


    The real scarcity for businesses now is in identifying or developing leaders,
    executives, board members and founders who are able to recreate their companies
    or build new ventures that can find and use data and AI to deliver a new sort
    of customer advantage.


    The data-driven giants, like Amazon, Apple, Netflix, Alphabet, Microsoft, Tesla
    and Meta, are using data and AI to create advantage. Some will also know about
    other interesting companies such as Adobe, Klarna, Reonomy, FourKites, Databricks,
    Canva, Teradata IBM and Cloudera.^([^(12)](#fn12))


    In 2022, McKinsey examined the one constant throughout the data era: the need
    to learn, adapt and change. They also noted that when change accelerates so does
    the need to learn. If that’s the case, then is there any place better to learn
    than from your customers’ needs? The most powerful way to learn what your customers’
    needs are is through what they are sharing with you in a privacy-compliant and
    respectful way.


    An organisation’s ability to learn and rapidly translate that learning into action
    is the ultimate competitive advantage. This is where data analytics and AI thrive.
    The capabilities capture the signals of the customer in real time. They can respond
    in real time, and know who to alert in real time, if needed. They can also help
    predict future needs and wants, link up production, stock control, delivery and
    pricing, all in real time. This is a predictive business.


    There are now companies that create algorithms at speed, with some claiming to
    create 200,000 algorithms a day. One such company, DataRobot, in 2021 was valued
    at $6.3 billion.^([^(13)](#fn13))


