    “生存下来的不是物种中最强的一种，也不是最智能的物种，而是最能适应变化的物种。” —— 查尔斯·达尔文


    在下一章中，我们将探讨数据之旅：如何开始这段旅程、你需要建立的文化、根据你组织所处阶段所提供的选择，以及当前数据和人工智能领域的前沿动态。


    ## 章节要点


    1. 业务的新演化模型是数据驱动的，这要求公司采用 AI 来解释并响应客户信号。

    2. 公司不需要单独的数据战略，因为其整个业务战略必须由数据驱动，并由 AI 赋能以指导所有的战略计划。

    3. 预测客户行为对于保持竞争力至关重要，这需要在董事会中得到充分理解。

    4. 未来的董事会应该更多关注基于客户需求的未来事件，并使用如实时数据的沉浸式虚拟漫览等工具。

    5. 当数据被视为一个生态系统时，会创造更多价值。使用七种以上数据源的机构固定资产周转率几乎是不使用外部数据进行决策的同类企业的 14 倍，市值则是后者的倍。


    # 第 8 章


    # 数据 AI 之旅


    自从《大趋势》作者约翰·奈斯比特（John Naisbitt）写下“我们淹没在信息中，却渴求知识”已经 40 多年。发生了许多变化，世界已两极化：一方是擅长使用信息、数据以及现在的
    AI 的强大组织，另一方则是仍在这种新运营环境中寻找道路的组织。


    “健身房最重的重量是大门。” —— 美国拳手 Ed·拉蒂莫


    ## 数据和 AI 是你业务的心脏和循环系统


    2016 年，凯文·凯利（Kevin Kelly）写了《必然：理解塑造我们世界的 12 种种技术力量》。他的书的核心概念是，今天我们生活中每一个重大变化的中心都是某种技术。


    “技术是人类的加速器。正由于技术，我们制造的一切始终处于演变过程中。每种事物都在变成其他东西……没有什么是完成的。没有什么是定型的。不断的流动不仅仅意味着事情会不同，它意味着过程比产品更重要。”


    生成式 AI 工具是这一点的绝佳例子，因为现在的过程和能力能够创建下一次迭代。就像原子聚变及其对永久能源的承诺一样，生成式 AI 是永恒的程序改进。


    数据被称为“新石油”。我不同意这种比喻。汽油石油是“一次性”产品：精炼、使用、结束，并带有碳排放的外部性。数据要可持续得多，其生命周期更像是精炼、使用、重复使用、混合、与其他数据增强、新用例重塑、精炼并以此循环。医学研究人员利用几十年前收集的
    DNA 在药物发现中取得了巨大效果。数据随时间和使用产生价值。


    麦肯锡全球研究所的一份报告估计，机器可读、大众以低成本或无成本访问并能够共享和分发的“液体”信息可以产生额外的 3 万亿美元的经济活动，实现如自动驾驶汽车、个性化医疗和可追溯食品供应链等多样化应用。


    物联网（IoT）数据源的扩散加速了数据共享的可性。此外，还有用于汇总、共享和交换数据的新技术、协议和标准。通过数据交换获取知识是欧盟新数据战略的一部分。它旨在创建一个“数据单一市场”，赋能个人、企业和组织根据非个人数据的洞察做出更好的决策，以便与目前的科技巨头竞争。


    然而，将所有这些数据捕获并添加到现有的（遗留）和新的业务系统中，也为如何寻找、使用、管理以及合法、安全、高效地共享这些数据造成了困惑。特定的数据集来自哪里？谁拥有什么？我们是合法获取的吗？我们是否合道德地处理了它？我们是否保护了它？谁允许查看某些内容？它在哪里？可以共享吗？可以出售吗？人们能看到它是如何使用的吗？最重要的是，它的目的是什么？最后一个问题似乎显而易见，但在我过的很多公司里，答案取决于你说话的对象、处于什么水平以及他们属于哪个部门（孤岛）。


    随着数据应用的增长并变得无处不在，消费者、所有者和数据管理员发现他们没有可以遵循的策略。消费者希望连接到他们信任的数据，以便做出最好的决策。数据所有者需要工具来安全地将数据分享给需要的人。风险注册需要适应网络犯罪和勒索软件泛行的时代现实。


    董事会的困境归结为一点：在 VUCA 世界（波动性、不确定性、复杂性和模糊性）中管理风险。数据滥用和网络客客已经出现在大多数董事会的风险清单上。缺乏数据使用以及在数据和
    AI 方面缺乏竞争力也需要加入风险清单。


    你如何能够保护组织中的数据皇冠明珠并同时对其进行优化利用？锁起来你就无法让客户受益，打开它就会被黑客。明智的做法是从对你拥有的数据进行审计开始：你为什么拥有它、如何获取它、它的用途是什么。


    这就是你可能需要外部帮助的地方。如果数据不是你的核心竞争力，请寻求专家帮助。那些 24/7 执行此类工作的公司在经验曲线上已经领先许多。


    ## 数据就是产品


    数据日益成为产品。Fitbit 是一个相对简单的设备；是用户的数据仪表板为其提供了大部分价值，而拥有 Fitbit 的公司（2021 年起为 Google）为其业务获取更多数据，并可以持续改进其一系列产品和服务。Fitbit
    拥有超过 1.2 亿台供数百万用户使用的设备。Waze（同样在 2013 年被 Google 购买）是另一个例子，客户在驾驶时的数据是产品的输入。通过使用
    Waze，我向公司提供关于我在何处驾驶、交通状况如何或其他信息，同时从他们那里获得关于我的预计到达时间（ETA）、交通拥堵、危险等宝贵信息。它根据其他用户的信息建议我的驾驶路线，因此系统随着用户的增加而变得越来越智能。


    “以给换取”的数据模型已进入我们生活的许多领域。想一下你每天使用的 App 即可。许多是“免费”的，因为价值交换是你的信息/数据，例如来自 Facebook、Twitter、`Booking.com`、Findr、Strava、Under
    Armour 的 MapMyRun、Everyday Rewards、FlyBuys 等。


    ## 数据、AI 与人类的协同作用


