  trans: '


    *   什么样的情感健康/智力（EQ）是成为我们组织领导者的关键？

    *   哪位候选人是最佳人人选？

    *   哪位候选人在未来 10-15 年内可能成为 CEO？

    *   哪些员工需要支持？

    *   哪些员工面临过度工作/职业倦怠的风险？

    *   哪位经理帮助员工的方式能让他们对工作更快乐？

    *   我们如何收集有关高绩效员工的数据，以便预测谁能创造更多这样的人才？

    *   团队中哪些行为预示着最佳团队领导？

    *   在人力资源职能中使用 AI 数据可以缓解哪些文化风险？


    当这类类型的问题被整合到招聘算法中时，该算法可以扫描 LinkedIn，寻找能够为组织工作的才华。理论上，它可以创建出快乐且高效的团队。所有这些类型的问题都存在于组织已经收集的数据中；然而，这些信息可能分散在各个部门，由特定的个人掌握，且尚未达到可供分析的状态。


    还记得街道指南吗？对于那些不记得的人来说，以前有印有城市交通地图的书，每辆车都有一本。那是一门很棒的生意。如今，是利用实时位置和旧地图基准的预测性分析意味着司机可以根据交通状况获得使用何条街道的实时建议。同样，人力资源也将进入一个预测性分析的世界，如今大多数
    HR 团队使用的地图将像你以前手套箱里的旧街道指南。这些是数据和 AI 快速进入的领域，HR 团队将在这里看到更多的变化。一种使用数据“希波拉底誓言”或类似原则的伦理驱动方法将是必要的。


    招聘正在被 AI 增强。最近据报道，Afterpay、Qantas、Spark NZ、Iceland Foods、Woodies（美国）等公司正在使用一个名为
    `Phai` 的机器人对候选人进行初试。`Phai` 机器人是一个智能面试官。它声称可以从人们对问题的书面回答中发现其性格特征。这背后的公司是 `PredictiveHire`。他们利用
    Google 的 `Bidirectional Encoder Representations from Transformers (BERT)` —— 一种自然语言预训练算法，对
    130 万名候选人进行了适配，这使得 `PredictiveHire` 积累了一个包含 5.5 亿单词的专利数据集。


    虽然 AI 和数据的重点一直放在营销上，但整个组织正向 AI 迈进：通过更好地使用和部署数据及 AI 来开启“游戏模式（Game On）”，包括采购、物流、运营、资本支出、财务等。一家财富富榜前
    30 强澳大利亚上市公司的 CEO 最近向我分享了他的观点，“在我们业务中，没有哪一个领域是数据驱动的方法无法产生重大的商业影响”。他举例说，从物流、并购、财务、ESG、采购和人力资源到新产品设计甚至健康安全，业务中的几乎每一个流程都能带来
    3000 万美元的 EBIT 影响。


    ## AI：开启游戏模式首先需要文化变革


    你能改变一家公司的文化，使其产生对数据的渴求，而不是仅仅是建立一个数据驱动的公司吗？绝对可以。只要看看 `Microsoft` 发生的变化吧。Satya Nadella
    从根本上重新设计了 `Microsoft` 与客户和其他利益相关者互动的方式。自从采用这种方法以来，`Microsoft` 的市值已经增长了一倍多。与之相关的是
    Nadella 的学习方法。


    *Satya Nadella 演讲演示*


    我们从事的是满足客户未被满足、未被表达的需求。这意味着你需要一个能够发现这些未满足和未被表达需求的系统。任何调查都无法发现客户未曾表达的线索。当我加入 `Microsoft`
    时，那里的文化是生硬、量化、指标驱动的。为了发现客户未满足、未被表达的需求，我们必须改变文化，并因此改变我们使用的指标，以便能够实时捕捉客户的信号。


    ## 实时捕捉客户信号


    Alfred Chuang 是 `BEA Systems` 的创始人兼 CEO（该公司已以 86 亿美元卖给 `Oracle`）以及 `Race Capital`
    的创始人，他是预测交易处理的先驱之一。Chuang 评论，“企业为了保持相关性和竞争力，需要能够预测客户的行为和偏好，并需要依靠预测交易来自动化其大部分业务交互。”


    换句话说，这要求从“通过数据和 AI 增强决策”转向“预测结果和下一个最佳行动”。他引用 `TikTok` 作为该领域的全球领导者之一。它的算法能“看到”你看的内容并给你更多此类，并从你观看的每一个片段中学习。


    Alphabet 成立了一家利用 AI 进行药物研发的公司，该其基于 `AI Lab` 进行的研究。作为其的一部分，`Google` 在 2014 年收购了
    `DeepMind` 并启动了 `Isomorphic Labs`，其使命是“从头开始重构整个药物研发过程。AI 不仅分析数据，还针对复杂的生物现象建立强大的预测和生成模型，这些模型已在蛋白质折叠领域取得了突破。其中一个模型在短短几天内准确预测了蛋白质结构将如何折叠，而这曾困扰了科学家几十年。”


    Xavier Shay（数字银行 `Up` 的首席执行官，2022 年 1 月通过收购 `Ferocia` 被 `Bendigo Bank` 收购）道：“人们现在发现你可以获得与
    Netflix 和 Uber [在银行领域] 同样的科技体验。如果你不怕 `Square`，说明你没有留心。不仅仅是 `Square`，几乎是 Apple、Google、Amazon
    等几乎所有大型科技巨头，我认为他们都有相同的游戏计划。”


    摩根大通近日宣布，将投入 167 亿美元用于开发新技术，以避免受到数字银行的冲击。


    ## 数据和 AI 对你现在至关重要


    想象这样一个场景：比如，一个场所变得意义远超此。例如，如果客户在入场时扫描虹虹膜会怎样？这种扫描可以用于识别某些健康问题，由于这种早期意识，这些问题可以被成功治疗。只要客户知道机器在代表他们做什么，并且相同的数据没有被发送给其他人，他们可能会发现这很有帮助。


    在这个虚拟案例中，通过使用对客户可见、可操作且透明的数据，数据使用的价值影响可以使场所运营者挖掘到传统收入领域之外的价值池。“产品之产品”蕴含着巨大的价值。产品是场所以及在那里发生的任何事情，但那种入场扫描和大量的人流可以产生无数其他大规模的影响。


    '
- fmt: '

    Increasingly, we will see data-driven balance sheets. Historically, the basis
    for every company’s share price and valuation has been a combination of discounted
    cash flows, internal rates of returns, revenue growth, `P/E ratio`, `EBITDA margin`,
    `EV/EBITDA ratio` and so on. These are all based on models about future revenues
    and costs. Where is the future revenue coming from? Customers! If you really understand
    customers and what they want, you can much better predict revenues and therefore
    valuations. Put it this way, if you are in a company that has a forecast, budget
    and business plan, you are predicting customers’ spending. Yet for all the care
    that goes into this, too many companies fail to look at the drivers of customer
    behaviours that make up the forward cash flow. This is starting to alter, and
    it will make customer predictions count in the boardroom in new ways.


    Imagine if your business had a more accurate and predictive model of future customer
    behaviours


    There’s a model already being used by some of the world’s leading data/AI-driven
    companies, as well as by shareholders, investors, fund managers and financial
    institutions. It is called customer-based company valuation (`CBCV`) and it’s
    based on deep data about customers. A recent article in `Harvard Business Review
    (HBR)` cites the IPO of `Revolve` in the USA, an e-commerce platform that caters
    to millennial and Generation Z consumers by curating luxury apparel, footwear
    and accessory items. The IPO was priced at $1.2 billion and exploded on its first
    day by 89%, giving it a valuation of 4.5 times its previous 12-month revenue,
    ‘more like a tech company than a clothing company’.


    Using data to price assets is emerging – another governance issue in waiting.
    Directors who are signing off on valuations of assets will need to understand
    what data was used and what impact that has on valuations.


    If you haven’t come across `CBCV` perhaps you have heard of `C3` (customer cohort
    charts). These charts track revenue by acquisition cohort over time and show how
    total customer spending changes as each cohort ages. Companies such as `Slack`,
    `Lyft`, `Dropbox`, `Farfetch`, `Backblaze` and `ZooPlus` integrate `C3` charts
    into their quarterly, half-yearly and yearly reporting packs to better enable
    shareholders and investors to evaluate their future business.


    Data and AI bring a higher degree of precision, accountability and diagnostics
    to value customers in the new loyalty economy. `Netflix`, `Verizon`, `Spotify`,
    `Activision`, `Blizzard` (acquired by `Microsoft` for US$68 billion in October
    2023),


    As an executive, director or leader in your business, the questions you may have
    are: Where does the ethical use of AI bring the most competitive advantage? Is
    it in products, services, processes, decision-making, new business models – or
    all of the above?


    AI has already migrated from simply finding relationships and predicting trends.
    It is now capable of spotting (predicting) future shifts by analysing preferences
    and sentiments using vast quantities of your own data – as well as text, voice,
    images, digital, newsfeeds, social media and global data-banks.


    When talking to `John Chambers` while he was global chairman of `Cisco`, his view,
    which I share, is that boardroom dashboards should be focused on future events,
    based on customers’ needs with less time looking in the rear-view, and more time
    predicting what is next best action for the organisation. The static historic
    numbers from last month will soon change to immersive virtual walkthroughs of
    the real-time data – a control room where streaming data is alive and where you
    can hear the calls of the customers, feel the strength of the demand and the nuance
    of the changes in the market.


    The boardroom of the future is set to become less of a slideshow and more immersive
    flight deck simulator, with real-time customer-centric information.


    ## Leveraging AI as a business transformation opportunity


    `BCG` presents one model for large-scale adoption of data and AI. It is a methodology
    based on extensive research across 3,000 respondents from 29 industries and 112
    countries. Their model focuses on two core themes: embedding AI into your business
    and preparing your operating model for AI across three core building blocks: data,
    processing and action.


    `BCG`’s model provides a four-step approach to unlocking the financial benefits
    of AI, which involves reimagining the way your company works with data and an
    ability to move from pilot to scaling. The model looks like this:


    1. `Discover AI` – Launch pilots in key areas.

    2. `Build AI` – Embed in overall strategy; reimagine use of data; invest in data
    capability building, technology, and algorithms and in developing technical AI
    skills.

    3. `Scale AI` – Broader use cases and solutions. Embed AI into processes and solutions
    on both production and consumption sides.

    4. `Organisational learning with AI` – Create opportunities for mutual learning
    between humans and AI.


    ### External data and data ecosystems


    Leading AI companies are harnessing the insights of their own data as well as
    that of third-party data companies sourced within ethical and data use guard rails.
    If your first-party data is not available and usable, you may need other data
    sets to help get to the unmet needs of your customers. Noting that first-party
    data should be your first port of call since it’s yours and it will typically
    be unique to your organisation. So, if you can access first-party data, you should
    regard it as an asset, so long as it has been collected ethically. An increasing
    number of companies are building businesses on the Internet of Data and Computing
    (`IoDC`), commonly referred to as collaborative data ecosystems. `Woolworths Australia`
    has done this through their partnership with `Quantium`, and now `CBA` and `Telstra`
    have also created ventures with `Quantium`. These allow their own business needs
    to be built at scale, and also for their partners. `Amazon Web Services (AWS)`
    offers such an ecosystem as does `Teradata`, `Databricks`, `Alibaba` and `BaseBit`
    to name just a few, alongside significant data ecosystems in the health, education
    and government services areas.


    The benefits of collaborative data ecosystems are significant. A `Capgemini` report
    noted that ‘organisations that use more than seven data sources have nearly 14
    times the fixed-asset turnover and twice the market capitalisation compared to
    organisations who do not use any external data for decision making’.


    ### You are what you measure


    Data without context and clarity is almost as useless as not looking at the data
    at all. On a recent podcast (`Pivot`), this type of discussion takes us straight
    to questions about the use and impact of data: What problem is trying to be solved,
    and what are the data sets that help you solve that problem?


    As data becomes more transparent and accessible it is not hard to imagine new
    business use cases. Imagine a new type of insurance business where you go to your
    cohort of `LinkedIn` friends who might all be of similar economic status to yourself.
    You know these people are very unlikely to commit fraud, and are largely low-claim
    risks. This model could be developed to a point where the cohort actually becomes
    the underwriter of insurance. As we move into a world of AI-enabled personalised
    bots, vast numbers of new ways of using AI and data will be developed.

