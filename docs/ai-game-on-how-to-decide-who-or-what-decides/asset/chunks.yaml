    图灵测试（用于衡量机器能否表现出与人类无法区分的智能行为）现在已是多余的，在科技界被认为是一个低标准。我们已经看到一种使用自然语言的特定 AI 形式——即
    `ChatGPT`（生成式预训练变换器）通过了美国医学执照考试、律师资格考试以及沃顿商学院 MBA 期末考试。但请记住，它也预填充了大量的虚假信息，距离完美还有很一段距离。


    尽管如此，自 2022 年 11 月底发布以来，`ChatGPT` 以新技术平台前所未有的速度达到了 1 亿用户这一指标。这标志着世界正处于一个转折点——AI
    时代，战斗开启（AI: Game On）。


    AI 和生成式 AI 的进步现在已是无处不在，我们正被许多看起来像人类的 AI 应用包围，在很多情况下，这些应用还在欺骗人类。


    直到 21 世纪 20 年初，人类一直是无可争议的最优知识来源、数据收集者以及已知宇宙中最强预测能力的推动者。从最基础的知识形式，例如下一个水坑在哪里，以及我们是否有足够的食物过冬？人类仅凭一些预测认知能力就能繁荣。正是我们的超能力，使我们在尽管捕食者拥有更优越身体素质的情况下依然能够生存。


    今天高度复杂的竞争性商业世界归结为一个事实：你越能准确、越快地预测你的组织、客户和竞争对手将发生什么，你今天的决策就越明智，从而改变你的命运。


    Google 首席执行官在 2022 年 12 月针对生成式 AI 的影响以及 OpenAI 的 `ChatGPT-4` 及其他 AI 应用带来的创新爆发式增长，发布了“全员红色警报”。如果
    Google 担心这对它的业务造成什么影响，那么假设它不会影响到每一个组织就太天真了。


    我们正处于新一波大浪潮的起点，有些人声称这是人类历史上最有意义的变革。当平台发生转移时（如电力、汽车、电视和互联网），影响会一波波到来，且终点并不明确。我们现在正处于
    AI 时代，所有领导团队都需要思考“AI 时代，战斗开启”对他们意味着什么。


    今天的世界越来越需要 AI 素养，而不是编码技能。虽然编码技能显然很有价值，但领导团队需要理解 AI 的能力、风险，以及符合组织宗旨和社会期望的用例。这种理解一直延伸到人的安全、职业以及人性的公平性方面。我们正处于
    AI 时代，战斗开启的时刻，而且对于导航开始渗透到每个人生活的 AI 系统，存在着日益增长的需求。


    埃里克·施密特（Eric Schmidt），Alphabet（Google）前主席指出：


    > 对我来说，很清楚，最终将出现一个无所不知的系统，然后会有一个限制它的监管系统。


    旧金山一家数据分析公司的创始人对我说：“利用预测性数据你只能做四件事：寻找客户、留住客户、理解他们下次从你那里想要什么，以及根据客户的未来需求优化你的 `capex`。”这四点都是至关重要的。


    2008 年，《连线》（*Wired）编辑克里斯·安德森（Chris Anderson）表示，“海量数据将使理论甚至科学变得多余。”

