- fmt: "\nIf another operator is opening a light rail right beside the road, for example,\
    \ it could have a huge impact on traffic projections as will the growth of ridesharing,\
    \ and ultimately autonomous vehicles. Also, if you are contemplating a project\
    \ with the life of a toll road, you should consider future developments like drones\
    \ or similar technology that can transport people, as well as other possible road\
    \ transport substitutes. Then there is trend data. How many young people are in\
    \ the catchment area? And what is their propensity to learn to drive and to buy\
    \ a car? What are the trends for people working from home, or hybrid work involving\
    \ only one or more days a week in the office, as well as trends around teleconferencing\
    \ and the advent of telepresence robots?\n\nSuch factors are predictive of traffic\
    \ flows, so too is telco data showing mobile phone usage in areas, as are other\
    \ location data from apps, `Uber` trips and the like. These data sets make the\
    \ assumptions of `BrisConnections` (and others like it) look like a horse-drawn\
    \ cart compared to the latest Mars rover.\n\n![Image](images/himg-32-1.jpg)\n\n\
    As you can see in the graphic above, quality data sheds light on the micro and\
    \ the macro; it gives us both telescopic and microscopic perspectives.\n\nWe’ve\
    \ seen that to underinvest in how to answer such questions, or to be incapable\
    \ of reading the anomalies in questionable data, can be seen as bordering on negligence\
    \ in today’s data-driven world.\n\nCoca-Cola disastrously changed their formula\
    \ in 1995 to `New Coke` after customer research said consumers preferred the new\
    \ taste. The focus groups misled them, and it was a near-death experience for\
    \ the company. They changed the formula back to the original `Coke` as they concluded\
    \ through sales falling fast that ‘marketing was too important to be left to the\
    \ marketing department’.\n\nI have seen many cases where data has become too important\
    \ to be left to the data department, as is evidenced by the litigation in relation\
    \ to `BrisConnections`. Data use, and misuse, is a whole-of-organisation strategic\
    \ issue. You may well have and/or need a great data department, but it has to\
    \ be fully integrated within your organisation, not an island of mathematical\
    \ rigour and data science. Amazon does not have a data business. It has a customer\
    \ business fed and increasingly led by customer data.\n\n## AI and data-led companies\
    \ require a different kind of leadership and governance\n\nIn Nancy Giordano’s\
    \ book *Leadering*, she delves into the future of company stewardship. The gist\
    \ of her message is that there has to be a transition from leadership to leadering,\
    \ from ‘a static, closed, hierarchical, organisational approach designed to scale\
    \ efficiently for consistent, short-term growth, to leadership that cultivates\
    \ a dynamic, adaptive, caring, inclusive mindset which supports continuous innovation\
    \ for long-term, sustainable value.’\n\nUsing this model of ‘leadering’, it becomes\
    \ easier to achieve what needs to be done to plan and execute data and AI utilization,\
    \ as it should be led from the top down. The board and executives can lead this\
    \ change:\n\n*   **Devising a plan for how AI will benefit the organisation, its\
    \ staff, customers and society**\n    *   It’s critical to have a vision for how\
    \ AI will impact your business over the next three years. What does good look\
    \ like? How can data help the strategy or enlighten the strategy? What are the\
    \ risks of using data compared to the risks of not using data? What use cases\
    \ would drive material, positive change? Recent BCG-MIT research found that companies\
    \ with the right data, technology and talent, but with no clear strategy, only\
    \ have a 21% chance of achieving significant benefits.\n*   **Allowing disparate\
    \ teams to work together**\n    *   A company that wants to succeed with AI needs\
    \ to thoughtfully remove barriers to information use that empower teams to explore\
    \ new ways of working together. This will help improve agility and innovation\
    \ and takes the organisation to a more holistic view of the customer, the market\
    \ and the opportunities.\n*   **Leaning into diversity**\n    *   Diversity of\
    \ thought is key to a data strategy, so make sure teams have diverse perspectives\
    \ across data and AI applications.\n*   **Rethinking how people interact with\
    \ machines (and vice versa)**\n    *   BCG research shows that when you create\
    \ feedback loops in AI deployment, there’s a greater chance of success. To seize\
    \ on this, you’ll want AI learning from human feedback, humans learning from AI,\
    \ and AI learning autonomously. Then repeat the cycle.\n\nChanging your business\
    \ to be data-driven with AI doesn’t just require a change in technology, it demands\
    \ a change in process, culture and collaboration. One CEO who is on this path,\
    \ and doing it well, said to me that for every dollar they spend on tech and data,\
    \ they spend one on change management initiatives. He claimed this was the secret\
    \ to their data innovation.\n\n## AI/data versus human decision-making\n\nIf you’re\
    \ a professional lawyer, accountant, engineer or doctor, your position is most\
    \ likely already changing in significant ways due to data and AI. This change\
    \ is now in every aspect of our lives: education, health, housing, recreation,\
    \ our cities, the environment, investments and who we elect. Even our laws and\
    \ how our justice system operates have components of data and AI in them. The\
    \ recent advances in `OpenAI`’s `ChatGPT` and other large-scale language models\
    \ are showing profound advancements in AI use cases. Some are very good, some\
    \ alarmingly bad. A friend of mine ran multiple experiments on several of the\
    \ new AI-enabled systems to find information about `Paul Graham`, a founder of\
    \ `Y Combinator`. The text was thoroughly convincing, yet completely wrong. My\
    \ friend went on to say that `OpenAI` and `ChatGPT` appear prone to favour text\
    \ written by other AI over human writing.\n\nJust think about that for a moment.\n\
    \nWe could be at the place where we down-rank human thought and up-rank AI because\
    \ of our own bias to find the machine’s writing more plausible! In Chapter 6 I\
    \ will share the story about judges and the pattern of their decision-making before\
    \ and after breaks and lunch. The point is machines have biases and so do humans.\n\
    \nData and AI already affect our political system. In Australia the only exemption\
    \ for the use of private information in marketing and direct mail is for political\
    \ parties. They can access the electoral roll and write to you directly. This\
    \ information is, rightly, off limits for all other uses and perhaps it should\
    \ be off limits to political parties too. Millions of Australians have received\
    \ texts from political parties that we have never opted into. The results of each\
    \ election are pored over by political strategists of all parties, and the detail\
    \ in the data would surprise many. The Census collector district (approximately\
    \ 200 homes) in Australia that is the most marginal is knowable. Who the people\
    \ in those 200 or more homes are is also knowable. What would make them change\
    \ their vote? That is predictable, and what policy ideas will resonate with them\
    \ is also predictable if enough data is brought to the table, or more accurately,\
    \ to the machines.\n\nIf you’re like me and have wondered why on earth a new government\
    \ policy is introduced when it seems counter to common sense, it could well well\
    \ that the answer lies in the data the politicians are reviewing. The trouble\
    \ for society here is that data use of this nature is optimised for swinging voters\
    \ in marginal electorates and that is not always to the benefit of our wider society.\n"
