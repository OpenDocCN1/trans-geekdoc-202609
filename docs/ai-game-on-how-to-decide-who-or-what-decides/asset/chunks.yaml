  raw: 'We got to this position as businesses focused on what they wanted to use data
    for, not for what’s in the best interest of the customer. And the result? A massive
    line-up of class actions that will, in an odd way, hopefully force boards and
    executives to pay more attention to their data and AI. In short, if the organisation
    collects data, it better have a good reason to do so, a good use case for the
    customer, and exceptionally good data protections.


    ## [It’s the use case, stupid](#content-toc.xhtml#pz5-33)


    Executives and managers need to get better at asking: Where is the customer in
    the use case? Why is this good for them? How do we protect them from poor first-,
    second- or third-order consequences from our data use? How do we contain the data
    and keep it out of the wild? If your propriety data gets out in the OpenAI world
    your advantage is now everyone’s.


    To highlight some of the issues here, consider OpenAI and the large language models
    (LLMs) being used. Some useful metrics on OpenAI come from the *Australian Financial
    Review* on 24 January 2023 quoted below:


    With each new generation of LLMs, the number of parameters has been ballooning,
    starting with 117 million in GPT and 340 million in BERT. GPT-3, the LLM on which
    OpenAI based ChatGPT, has 175 billion parameters. Google’s GLaM (Generalist Language
    Model) has 1.2 trillion.


    The result is a kind of magic: machines that have ingested an internet’s worth
    of data, weighed up the relationships between things, and are able to generate
    content that appears to be new and original.


    The article went on to explain how LLMs with billions, and moving to trillions,
    of parameters can still create effects that AI researcher Emily Bender described
    as “stochastic parrots”. They seem intelligent, yet don’t understand the words
    they are creating. A human looks for meaning, while currently, models look for
    patterns.^([^(21)](#fn21))


    **Machines may already know you better than you know yourself, at least your consumption
    habits**


    If you ask most people what they spent on subscription services last month, many
    will dramatically underestimate the recurring costs they pay to streaming companies
    and others. Or ask your friend what their favourite cuisine is and then get them
    to look at their bank statements of what cuisine they paid for the most in the
    last three months. Often our own recollection of real behaviours can be wrong.
    It’s a bias in our mind as opposed to the reality of our bank statements. It also
    shows that banks can know us better than we know ourselves in many instances.
    What could a bank do for its customers with the data they have?


    Imagine if you could travel to a new town, walk into a restaurant and see what
    someone like you who eats regularly in that restaurant orders frequently.


    It could reveal the best meal in the house, not what some random person has stated
    on a website that is full of spam and self-interest. Loyalty is usually a measure
    of customer satisfaction and banks can see loyalty clearly at scale if they have
    systems set up to help and understand their customers.


    Years ago at Quantium, they built an app called People Like You for UBank. It
    used de-identified bank data and you could find some highly predictive information
    in this data set. I looked at the pizza restaurants in my postcode for people
    of similar age and income to me. To my amazement they all were going to this very
    small pizza place that was hidden off the main street that I liked too. I thought
    I was special! Google searches did not reveal this restaurant as this low-key
    place had no SEO or AdWords dollars. The bank data found what Google could not
    see – we are what we do.


    Banks have been using the same credit models for generations, and even with the
    new laws around Know Your Customer (KYC), banks still ask borrowers to labour
    through reams of questions that they already know the answer to. How much do you
    spend on food? You say $200 a week for the family. They know it is $230 but don’t
    use their own – your own – data. It is changing in some banks, but it’s generally
    seen as too hard, and their systems are old; they suffer from inertia and push
    the hard work to the customer and use claimed behaviour over real behaviour. Netflix
    knows I don’t watch documentaries about postmodern art. Ask people in a survey
    or focus groups and you will hear lots of noise of good intentions or virtue signalling
    over real customer signals.


    Here’s a test that I often use in discussions around data guard rails with organisations.


    1.  Are they legal?


    2.  Are they ethical?


    3.  Does anyone lose as a consequence of the use case?


    4.  Is it helpful to those whose data you are using?


    5.  Does the customer agree the data helps them?


    6.  If all your use cases were in the public domain, is this a ‘story’?


    Would any part of this plan be troubling for you, your stakeholders or society
    if an investigative journalist found the data use case? If what is being planned
    needs to be hidden from public scrutiny or even internal scrutiny, don’t do it.
    The use case needs to be your North Star.


    Let me run some scenarios past you, and ask yourself how comfortable you feel.
    Please note, these are clearly personal choices and there will be different views:


    *   You are asked if your de-identified health data could be used to find a new
    way of preventing/treating cancer. (Sounds okay, so long as I can pull my data
    if I want to or not, and there is zero risk of PI (personal data being identified
    or obtained). If there was a breakthrough and large financial win from the data,
    is there a share split with the data provided?)


    *   Having your car’s braking data used to help design better brakes. (Good, so
    long as it can’t be used against me in an insurance claim, or a police matter.)


    *   Your movie streaming preferences are being used to find more of what you want
    to watch. (Good, thanks, so long as no one else can see my own viewing preferences.)


    *   Your shopping data being used to help the retailers stock the right items
    for you and others. (Good, so long as it’s not on-sold for insurance, or other
    second-order users that could erode my benefits or irritate me.)


    *   Health data being used by an insurance company to inform them of your health
    risks, so they can increase premiums. (Not good. A simple no.)


    *   An online retailer using your data in a way that shows your preferences are
    for premium wines, and they offer discounts to other customers who show greater
    price sensitivity discounts on some of the same premium wines, effectively leaving
    you in the sucker segment paying full price. (Bad use of customer data as it puts
    their interests ahead of the customers.)


    *   The government or platforms using/selling your social media data to predict
    who you will vote for and target you with messages to persuade you to switch your
    vote. (We hate this, yet it is used and both sides of politics use social media
    to try and predict voting intentions. It’s the use case, transparency of the user’s
    data and who gets the benefits of the data use that matter in the end.)


    There is a growing, legitimate interest from individuals regarding the data they
    provide to various organisations. In short, there does need to be a real value
    exchange to keep the balance right.


    Transparent notices on what the data is being used for are needed. Surprising
    customers with a bad use of their data is not a sustainable strategy. For example,
    sharing my family’s data on our use of streaming services gives the streaming
    company real insights into what shows to make next, what to change, and where
    to advertise for like programs and more. The users (my family) get great recommendations
    at a minimum, and you could argue they will also get a pipeline of new content
    they are likely to enjoy. So, there is some mutual value.'
