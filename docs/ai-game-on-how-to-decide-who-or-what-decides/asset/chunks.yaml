  trans: '


    关于数据、人工智能和机器学习的讨论大多集中在对劳动力市场的影响，或者更具体地说，人类在职场中被取代，以及对失去职业和工作的恐惧。这些虽然引发了巨大的头条新闻，但现实情况往往更难预测。我并不是说未来的工作、职业和专业领域不会发生重大变化，但技术一直导致了结构性调整，这需要技能的转变和工作场所的变化。瑞士日内瓦高等学院的理查德·鲍德温（Richard
    Baldwin）教授最近提到人工智能时说：“AI 不会夺走你的工作，使用 AI 的人才会夺走你的工作。”


    也许在未来的 20 年里，人工智能和机器学习似乎不太可能取代人类智能，而是会增强人类智能。归根结底，这是一个从机器到人的交接。这种交接是 Spotify 歌单、新的抗生素、飞机的着陆、无人机递送的包裹。因此，价值源于对人类的增强。正因为这个原因，我喜欢用“增强”（augmented）而不是“人造”（artificial）来描述
    AI。AI 追求创造更好的客户体验并完成到真正理解客户的旅程，仍然是使用数据的首要优先事项。


    > “在那些堆积的数据中，隐藏着可能改变患者生活或改变世界的知识。” – Atul Butte


    在由诺曼·斯旺（Norman Swan）博士主持的、与澳大利亚胰腺癌顶尖智脑合作的公益研讨会上，我见证了数据和分析如何帮助改变医学的轨迹。我们许多胰腺癌领域的顶级专家在场，讨论了这种最残酷的癌症为何难以早期发现，以及它为什么生存率最低之一。


    Quantium 的联合创始人格雷·施奈德（Greg Schneider）在白板上画了三列。他说，如果第一列是患有或曾患有胰腺癌的人的 DNA 测序数据，第二列是这些人一生中发生的所有医疗干预，第三列是这些人的所有生活方式因素，如果你以一种去标识化且符合隐私的方式将这些列连接起来，你将立即看到理解疾病的新方法。当然，相关人员需要批准将其数据用于此类用途。例如，它可以显示童年使用抗生素对胰腺癌是否有任何积极或负面的影响。摄入大量加工食品是否会增加任何风险？


    哪些 DNA 特征使个体更容易脆弱？数据中将揭示相关性和可能的因果关系。


    格雷对医学或胰腺癌一无所知，但他对如何使用数据非常了解。当这些医学专家看到，大规模使用并为了造福患者的数据，将是通往治疗方法发现并有望实现预防道路的巨大加速器时，房间里响起了一阵吸气声。


    随着大规模遗传信息安全地供医学科学使用，更个性化医疗的加速将更加迅速。


    英国生物库（UK Biobank）有一个宏勃的计划，要测序地球上所有的生命。这是一个大型且宏大的项目。基因组测序使药物发现有所改进，越来越多的医学突破看起来越来越像是一个数据和数学挑战。Moderna
    的新冠疫苗是通过使用病毒基因序列快速创建的，病毒本身从未出现在现场。根据 Illumina 首席执行官弗朗西斯·德苏萨（Francis deSouza）的话，“这被视为一个软件问题”。


    医学和生活的大多数方面一样，在 AI 数据赋能的未来将变得更加个性化。


    ## 你的新细分策略是“一人一面”


    许多组织使用数据输入进行客户细分或理解客户偏好。当在基础水平进行且没有人工监督时，你可能会得到一些奇怪的结果。例如，让我们看看查尔斯国王（King Charles）和奥兹·奥斯伯恩（Ozzy
    Osbourne），这是 Quantium 创始人之一托尼·戴维斯（Tony Davis）分享给我的。


    ![Image](img/himg-133-1.jpg)


    他们出生于同一个 1948 年。他们都处于高财富群体，并在同一地点——伦敦花费大量时间。他们都喜欢国际旅行、狗、跑车、美酒，有孩子并曾结过婚。人们可能认为他们的音乐品味不同，但谁知道呢？从基础数据的角度来看，他们具有惊人的相似性。对于某些基于年龄、性别和家庭状况的简单算法引擎来说，他们看起来非常相似，就像双胞胎一样。给英国国王和重金属之王发送相同的广告和产品建议，这无疑会令他们感到困扰。他们都不会认为这种场景有一点良好的客户体验。


    任何不是“一人一面”、全个性化的细分都注定失败。个性化现在是消费者的基本要求。麦肯锡也同意这一点。他们发现 71%的消费者希望公司提供个性化的互动，而 76%的人在这种情况发生时会感到沮丧。未来的业务、医学和大多数行业将是数据驱动的个性化。数据是个性化的核心。如果你不真正了解客户，你就无法提供个性化服务。


    在《亚马逊》（The Everything Store）一书中，布拉德·斯通（Brad Stone）讲述了杰夫·贝佐斯（Jeff Bezos）如何在二十年前向董事会提议对亚马逊的所有触点进行个性化的需求。当董事会问他“你为什么需要这么多数据科学家？”时，他的回答大意是：“如果我们不个性化一切，其他人就会这样做，那时我们就会被淘汰。”他比大多数人都早。1999
    年给股东的信中，贝佐斯分享了他对亚马逊成为“万物店”的愿景：我们的愿景是利用这个平台打造世界上最以客户为中心的公司，让客户可以在这里发现并购买他们可能需要的任何东西。


    我们会倾听客户，代表他们发明，并为每一个人提供个性化的商店，同时努力继续赢得他们的信任。^


    ![Image](img/himg-135-1.jpg)


    本书无法为每种不同类型的组织或读者提供定制旅程，但本章可以提供一个框架，帮助你规划自己的旅程，无论你是小微企业的负责人，还是大型企业、非营利组织、政府机构、初创公司或扩张型企业的高管或董事成员。


    ## 构建数据文化


    警惕 HiPPOs（高薪者的意见）


