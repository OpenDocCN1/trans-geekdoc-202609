    It’s no coincidence that many of the wealthiest people in the world at the time
    of writing are founders of data-rich companies where the value creation is attributed
    to data-driven enterprises: Elon Musk, Jeff Bezos, Mark Zuckerberg, Larry Page,
    Sergey Brin among others. There is, of course, some very real concern about the
    concentration of this power, and in some of the use cases along with the way data
    is stored and used. We will look at some of this later in the book.


    So why are so many companies so slow off the mark to immerse themselves in data
    and AI to ensure future business performance and success?


    Churchill purportedly said, ‘Success is going from failure to failure without
    loss of enthusiasm.’ This, I know, could be a description of many customer transformation/digital
    transformation programs over the past 20 years, most of which fail as they have
    been driven too much from a technology fix, and too little around the business
    needs, business adaptation and customer fit. Too much of a digital veneer (usually
    in the customer experience/interface area), and too little appreciation that it’s
    a whole-of-business project, and that it never stops.


    ## CHAPTER TAKEAWAYS


    1. Data and AI are the drivers of future economic growth and value, replacing
    labour and capital as the cornerstone of value creation.

    2. Companies that embrace AI and data are outperforming those that don’t have
    a cohesive response to AI.

    3. Companies that know their customers’ signals and behaviour can more accurately
    predict future needs and stay competitive by make barriers to entry higher.

    4. The top three challenges for companies are AI-ready technology stacks, workforce
    readiness and AI governance.

    5. While most organisations believe they would benefit from AI, only 6% of C-level
    leaders reported AI-powered solutions across their organisation.


