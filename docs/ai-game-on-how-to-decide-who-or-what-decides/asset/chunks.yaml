- fmt: '

    It is leadership that is needed to help, to set the aspirations for the company,
    to facilitate shared goals, ensure accountability and invest in the talent and
    resources to make it happen. Anchor the initiatives from the customer’s perspective.
    John Deere’s innovation about using AI to spot weeds, and to apply a small amount
    of herbicide precisely on this weed, is good for the customer, and better for
    the planet. It is also harder to clone than a normal tractor and their competitors
    will need to respond or be seen as last year’s model. If you happen to be in the
    business of selling herbicide this is a threat from outside your traditional competitive
    set.


    Telco companies are awash with data. They know where we are, what cell tower is
    connected to each device, who we call, when, for how long, who we text, when and
    where we work out, who we cohabitate with, who we are friends with via the location
    of our phones and people we spend time with at the locations. For sound privacy
    reasons, telcos don’t use this information unless the law requires it (think the
    police, homeland security, ICAC, ASIC, the courts and more).


    A business colleague of mine who lives in the UK was overseas when a caller (a
    thief) rang their telco to say they wanted to port (move) their number to a new
    phone. The telco obliged, never asking for the password that was on the account;
    they just happily ported the mobile number. As soon as the transfer occurred the
    actual owner’s phone stopped working. Oblivious to what had occurred, he called
    his telco to say his phone was not working. The telco never mentioned that they
    ported the mobile number moments before but did helpfully advise that the bill
    was up to date and there should be no issues. The call centre was not linked to
    the systems in the porting department, so they were blind to this issue. Offering
    comfort, the telco representative reassuringly said that ‘it should sort itself
    out, our system here shows it’s all in order.’ Things were not in order. The CEO
    of this telco is on the regular speaking circuit recounting their AI prowess and
    customer-centricity credentials, seemingly oblivious to the pain and knock-on
    effects created by their lack of customer understanding due to their poor technology
    systems. The lack of sound data hygiene inflicts massive damage on customers,
    and hundreds of millions in cybercrime that is being borne by banks.


    Over the next eight minutes the hacker used the mobile number to ask for new passwords
    for banking apps and ran off with the equivalent of $400,000 from two banks (both
    of which purport to have high-grade AI-predicting capability). If you call your
    bank from your mobile number their systems will assume largely it is you calling.
    If you open their banking apps with your mobile and reset the passwords these
    are sent via text to your phone, as two-factor identification is seen as best
    practice, which is simply not true when a phone number is ported. Once your phone
    is hacked, all these credentials are moved to the thief and it is game over.


    When you pause to think of the data the telco has, it is incredible that this
    whole saga can occur, and that they ignore the data that can help the customer.


    The fraudster tested the banks further, changing the home address linked to one
    account just for good measure, from a high-value home in a wealthy part of the
    city to a significantly lower value area, even though the bank had a mortgage
    on the home. Surely this would have set off a potential hack alert. No such luck.
    My friend even had a private banker at this leading bank, who would have instantly
    known that this change was fraud, but alas their brilliant AI-enabled systems
    snoozed through the crimes.


    It took my friend two months to unravel the hack and another two months to sort
    out the reimbursement of the stolen funds! All because the data systems of the
    telco and bank were simply not up to standard and the thieves know this. Meanwhile,
    the cybercriminals sail away on their mega yachts in the South of France.


    And where are the telco and bank boards? This is enabling large-scale crime, and
    we see yet again how data is too important to be left to the data department.


    A director of one of the leading banks in Australia said to me this sort of crime
    is costing her bank around $500 million a year. At this loss, close to $10 million
    a week, the payback from building systems that protect the customer and the bank
    seems to be a no-brainer.


    Credit card companies are much better at deploying and using global, large-scale
    analytics at scale and have developed some good predictive AI. For example, if
    you fill up a tank of petrol at 9:06 am in one area and try to buy a pair of shoes
    50 kilometres away at 9:15 am, their systems will automatically flag this as a
    fraud, as you can’t have travelled that far in 9 minutes. They also have a flag
    on the card to indicate if the card was presented or not presented. These and
    other more sophisticated data analytics systems are built in to protect their
    customers first and foremost and have the additional benefit of reducing the cost
    of refunding clients for fraudulent transactions. Banks are working on many initiatives
    to reduce this sort of crime, but an honest assessment of their real capability
    and board-level risk analysis is needed. In the last few months some of the banks,
    some using telco data, have made powerful corrective steps to combat some of this
    fraud. There are still mountains to be climbed here, and a vast societal benefit
    from use of AI and data to stop fraud.


    ## Data’s power to hunt and kill assumptions


    There’s a tendency in humans to invent an explanation when they don’t have the
    data to really understand the issues. Meteorites were signs of the gods, the eclipse
    of the moon was a miracle, not a predictable event based on maths. Organisations
    have myths too when there is a void of data. One of the jobs to be done everywhere
    in corporate life, especially at the board and executive level, is to empower
    their organisations and employees to hunt and kill assumptions.


    What is your organisation sure of that may not be true? It is a good idea to ask
    yourself and colleagues what your own organisation’s myths are that are yet to
    be tested by data. Ben Ashton, a friend of mine and former colleague at Quantium,
    is a smart lawyer and now CEO of CommBank iQ. We then ran the bank data (in a
    de-identified privacy-compliant way). The majority of Ben’s customers were 55+,
    in middle-income areas. Ben’s first reaction was that the data couldn’t be right,
    so we retested it. It was right. Ben was surprised but it did help to explain
    why his marketing efforts weren’t getting the traction they should, and it explained
    his feeling of pushing against a headwind or current. How could his field force
    not know their own customers? The answer is simple. Most of us want to believe
    our customers are like us and if you’re a successful marketing executive, salesperson
    or product development person, you could well prefer the idea that your customers
    are a bit like you, or someone you aspire to be like. It’s a classic example of
    unconscious bias and we all have it. Real customer data when carefully used can
    have far less bias.


    The silent voice of the real customer needs to be heard and understood. If that
    conflicts with what your team believes, that is good. Busting myths may not make
    you friends but it will help the business in the longer term.

    '
