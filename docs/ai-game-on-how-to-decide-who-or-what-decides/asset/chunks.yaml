- fmt: '

    Boards need to work on this at the governance level, and as mentioned before governance
    derives from the Latin word `gubernare` meaning ‘to steer’. Standing on the bridge
    of a ship gives a higher perspective for navigation. A crow’s nest higher, satellites
    higher still. Data use at scale allows a wider perspective. The aperture is opened.
    At the same time businesses need both telescopes and microscopes (literally and
    figuratively) to understand markets, their customers’ behaviour, the patterns
    of product or service use and at both the macro level on the horizon, and the
    subatomic data level for each interaction. Great data use cases allow for perspective
    of scale, and atomic-level detail for personalisation. Netflix sees macro trends
    in content and micro use of the customer all through the same data-driven system.
    They can commission new shows at lower risk than traditional content makers as
    they can predict which customers will watch the new show. Not focus groups; real,
    scaled insights.


    History in some ways could be described as the study of surprises; it is the arrival
    of large-scale events that were not well predicted. If the assassination of JFK
    was predicted on that day in Dallas the car would not have driven in front of
    the sniper. History noted it was a tragic surprise event. Surprises happen from
    a lack of data or a misunderstanding of available information or inability to
    predict what is going to happen next.


    The late Henry Kissinger, in the book he recently co-authored with Eric Schmidt
    and Peter Huttenlocher, `The Age of AI`, makes the point that often when something
    is not understandable by humans, they perceive it as an act of God, bad luck or
    nature. More precisely, it’s also a lack of data and insight from data. Earth-quakes
    can appear to be random; however, we are increasingly able to predict when and
    where they will occur with better sensors, data and models, even though we still
    have a way to go. We can certainly better predict the flow-on effects of earthquakes
    such as tsunamis and ash fallout.


    So, it’s important to understand how the signal from the front line in so many
    organisations gets blocked and can’t make its way to the boardroom. What is the
    gunk in the information flow that kills empires? Who in the organisation has a
    vested interest in messing with the signal? How can you spot this in your organisation?
    Better still, how can you create a system that delivers this information directly
    to the leadership team with no interference? That is what an AI: Game On company
    can do.


    What your customer wants next from you is a question that holds incredible value
    if you can answer it well, and before your competition does. Deciding what actions
    to take or not take, which allows you to understand what the customer needs, is
    the key asset in the intention/attention economy. Google’s empire is built on
    harvesting this signal and auctioning the results at close to the speed of light.


    Kevin Kelly, in his thoughtful book `The Inevitable`, says abundant answers simply
    generate more questions. ‘While the machine can expand answers indefinitely, our
    time to form the next question is very limited. When answers become cheap and
    questions become valuable.’^([^(56)](#fn56))


    ‘If I had an hour to solve a problem and my life depended on it I would use the
    first 55 minutes determining the questions to ask, for once I know the proper
    question I could solve the problem in less than 5 minutes.’ – Einstein


    Good questions will be created by machines but for the moment it’s largely a human
    challenge. Perhaps the future of AI is more about how fast AI learns what are
    the best questions to ask. There are some early tools here that do prompt human
    questions to ask.


    Attention of organisations needs to go to what are the great questions and how
    can these be answered with data and AI that changes the trajectory of the business.
    Michael Lewis’s book `The Premonition` speaks to the story of Dr Jose, who had
    trained at Harvard and spent a decade researching disease at the National Institute
    of Health. He was a genius at figuring out what was wrong with patients and at
    training young doctors. Each morning, he spent genuine, intimate time with patients,
    listening to their stories/memories of what they’d been up to. Through the conversation
    he was digging into the patient’s life and through this information he formed
    a differential diagnosis of the infectious diseases that might have caused the
    symptoms or as Dr Jose put it, ‘What have you been doing that puts you at risk
    for whatever the hell you’ve got?’


    A college student turned up one day with a dramatic and mysterious rash on his
    torso and when Dr Jose arrived, he let the student share a tour of his social
    life and asked, ‘When was the last time you were in a hot tub?’ Not, ‘Were you
    ever in a hot tub?’ The kid’s response: ‘A few days ago.’ ‘Anyone with you?’ Dr
    Jose. ‘Yeah, a few friends.’ ‘Any of them have a rash?’ he asked. ‘Actually, yes.
    My roommate does, just not as bad.’ It was classic `Pseudomonas` bacteria you
    can get from hot tubs. In medical school, doctors are shown how to follow a checklist
    to get the life history of a new patient, not to explore the patient’s social
    relationships. Communicable diseases require a different approach as they are
    spread by person-to-person contact. Asking the right questions is vital in medicine
    as it is in boardrooms.


    As Sam Harris comments, ‘Human beings are opinion machines.’^([^(57)](#fn57))


    I have been in many conversations with C-suite and board members over recent years
    where they ask, ‘How can we become more customer-driven, more in tune with the
    needs of the customer?’ I find myself saying this in response: ‘You can’t fix
    what you can’t understand’, and the trouble is most companies just don’t have
    the tools, culture and drive to really understand customers and therefore don’t
    understand their needs.


    If you bring enough data to any question, the answer can change a lot and can
    inspire the next question.


    ## What decisions can/should data and AI be applied to?


    We’re moving from software as a service (`SaaS`) to an era of decisions as a service
    (`DaaS`). It is now possible to automate stupidity.


    Sometimes data becomes artificial incompetence. Data applications should be smart,
    customer-friendly and in the best interests of the customers. Not all are.


    There’s the disastrous story of United Airlines security staff dragging a passenger
    off a flight with force as the automated passenger load system had overbooked
    the flight, a standard practice in the USA and Europe. The passenger on `UA Flight
    3411` suffered concussion, a broken nose and lost two teeth.^([^(58)](#fn58))


    When considering the interaction between AI and humans in decision-making it is
    important to understand both the decision-making process and the types of decisions
    that are typically made.


    The `OODA loop` (observe, orient, decide, act) is used to try to help fighter
    pilots ‘outthink’ their adversaries.^([^(59)](#fn59))


    In addition, in an AI setting, the loop is repeating constantly, and each part
    is feeding into all the steps simultaneously.


    ![Image](images/himg-101-1.jpg)


    Now this technique has been co-opted by those wanting to propel business advantages
    and new business models using data and AI.^([^(60)](#fn60))


    The more data you have, the better your models get. The better your models are,
    the better your product/service becomes. This leads to more usage and, subsequently,
    more data and the cycle continues. Feedback is constant and has to have oversight
    and considered interpretation by humans.

