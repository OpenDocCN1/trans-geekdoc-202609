    \ growing rich data sets, and there’s a whole ecosystem of adtech and martech\
    \ flowing around this. Data and AI have now moved into all the other myriad functions\
    \ of the enterprise – logistics and supply chains, rents, procurement, allocation\
    \ of capital, and maintenance.\n\n            However, when it comes to understanding\
    \ your staff’s needs, who needs support, who should have the promotion and why,\
    \ it is a different story. By comparison, the people analytics industry is where\
    \ media was in the 1990s. It’s game on in the people management sector and AI\
    \ and data will change the way we hire and remunerate employees. Data and AI will\
    \ also change how companies engage with contractors, gig workers, consultants,\
    \ software suppliers, lawyers, accountants, insurance providers, fund managers\
    \ and more. Data science in the HR department is just getting started.\n\n   \
    \         Machine learning operations (MLOps) are transforming how data and AI\
    \ are being deployed in business. Companies that are harnessing MLOps have already\
    \ shifted gears from exploring what AI can do via experimental pilot projects\
    \ on the sidelines or in specific silos within their business to creating a standard,\
    \ company-wide AI factory capable of achieving scale and value with speed and\
    \ efficiency. MLOps take advantage of massive improvements in AI tooling, workflows,\
    \ open software solutions, modular options and platforms.\n\n            AI: Game\
    \ On companies are leveraging their data to drive margin and market share, nurturing\
    \ it as a strategic asset and applying it in ways that have a concrete impact\
    \ on their business. Think of Atlassian and Canva, as great Australian examples.\
    \ John Deere, the 180-year-old manufacturer of farming and industrial machinery,\
    \ is also harnessing data and machine learning. With its See & Spray technology,\
    \ high-resolution cameras capture 20 images per second. Based on the images and\
    \ artificial intelligence, the system recognises the difference between cultivated\
    \ plants and weeds so that individual plants can be specifically treated. With\
    \ this new generation of weed control, the use of pesticides can be reduced by\
    \ up to 80–90%.^([^(49)](#fn49))\n\n            Despite all the evidence, discussion\
    \ and success of data/AI-native businesses, why is it that so many companies are\
    \ yet to harness the full potential of their data? A 2022 State of Data Culture\
    \ Report noted that 97% of data leaders said their companies had suffered the\
    \ consequences of ignoring data, from missing out on new revenue opportunities,\
    \ poorly forecasting performance and making bad investments.^([^(50)](#fn50))\n\
    \n            What can be done to enable this change and do it fast?\n\n     \
    \       ## [Shifting from data ownership to customer benefit – the importance\
    \ of thoughtful data use](#content-toc.xhtml#pz6-22)\n\n            The human\
    \ body is remarkable in its capacity to measure what is going on around it. Our\
    \ five senses are plugged into the largest, most effective brain anywhere in the\
    \ known universe at the time of writing. We are also a machine that can be distracted\
    \ in an instant.\n\n            The human ‘flight, fight or freeze’ response is\
    \ part of how the brain runs a prediction on what it expects to happen and gears\
    \ us up for its prediction. If you put the kettle on, like you do four times a\
    \ day, and this time it explodes, that is counter to the predictive model your\
    \ brain had of the kettle’s next move. The shock will be out of sequence with\
    \ the expectation and your consciousness will be acutely focused on the disparity\
    \ between the prediction and the new reality. Full attention will be on at this\
    \ moment.\n\n            Deciding what to pay attention to in daily life is not\
    \ that different to deciding what to pay attention to in a business. You can chase\
    \ a lot of small issues like the noise of the fan in your computer, or you can\
    \ focus your energy on that life-changing new initiative for your well-being.\n\
    \n            The human body, with the five senses operating well, and a brain\
    \ that is functioning reasonably well, has all it needs for most of what comes\
    \ our way. Organisations are not born with those systems in place. They have to\
    \ be created, designed and orchestrated to deliver ‘what good looks like’.\n\n\
    \            Previously, most companies were organised in a top-down hierarchical\
    \ structure with clearly defined departments (silos/empires), prescriptive job\
    \ descriptions, and rigid reporting lines. Information (data) was collated for\
    \ specific responses (orders, invoicing, supply purchases, employee payments etc.)\
    \ with separate specific corporate service areas: legal, accounting, advertising,\
    \ marketing and so on. Information was contained and passed through ‘lochs’ in\
    \ carefully calibrated releases.\n\n            If you decide to do only one thing\
    \ with data, do this: set it up to allow you to understand what your customer\
    \ feels when using your product. Build systems that allow you to deeply recognise\
    \ what your customer feels. If your customers are waiting hours to connect with\
    \ a call centre, and you’re not measuring that, you are toast. If your website\
    \ checkout is not easy, it’s over – you just don’t know it yet. If the delivery\
    \ of a customer’s order is not made on time, or at all, you’ve lost the game.\
    \ If you’re not nurturing a relationship with your customers, they’ll leave you\
    \ to find someone who will.\n\n            **Your customers are one click away\
    \ from someone who can make their life easier, better, faster, cheaper, make them\
    \ feel more appreciated or all of these things**\n\n            More critically,\
    \ if you’re tracking and measuring the wrong things you could be responding to\
    \ the wrong signals. Organisations can choose to notice the loudest voice, the\
    \ outlier, or the oddball on Twitter banging on about some passion project of\
    \ theirs, and why your organisation is not acting on it. Or you can focus on what\
    \ loyal customers expect from you next, and that is a prediction you can make\
    \ that will pay dividends fast. You can put all your attention focusing on the\
    \ one complaint (the noise) from the outlier on Twitter, or you can notice the\
    \ 95% of customers who, through their often-silent observable behaviours, have\
    \ given you strong signals about what they like about your company and clues about\
    \ how to improve it.\n\n            As a board member, CEO or executive, it’s\
    \ important to enable data and AI throughout the business through a data-led culture.\
    \ If you’re in a legacy company there may be material benefits to loosen firmly\
    \ rooted, siloed ways of working, to open up the data lochs and get the data flowing.\
    \ Of course, data guard rails, privacy and ethics need to be your North Star."
