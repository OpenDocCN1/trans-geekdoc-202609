    如果你身处大公司，通常高管和董事成员会向负责客户体验、营销和销售的人员询问数据，因为大部分客户数据都存储在那里。如果你有首席数据官，他们很可能是第一个联系点；如果你的公司对数据的力量高度敏锐，你的首席风险官也将是一个接触的关键人物。构建了全球电信网络的爱立信（Ericsson）有一位数据赋能官。^(⁸⁹)


    让你的客户对贵公司预测他们需求的能力进行排名。让他们将你与某些竞争对手进行比较，更重要的是，让他们比较你与那些更先进的数据用户相比。


    将公司的表现与其他更具以客户为中心的行业领先者进行基准比较可能会很有启发。例如，如果你是一家能源公司并以银行为基准，结果可能显示你的表现尚可，并且领先于银行。现在
    Apple 推出了银行产品，现状将面临挑战。然而，我建议你将公司与 Netflix 或 Etsy 等先进的数字公司进行基准比较。你新的 AI-数据驱动竞争对手将思考如何创造你所在行业的
    Netflix，到那时，你将感受到数据驱动竞争的全部威力。


    幸运的是，越来越多的有一批 C 级高管理解数据和 AI 的重要性，能够评估自己公司的脆弱性，并正在采取果断行动试图改变现状。这部分人才的需求非常高，我们需要在这里建立一个更大的专家库。事实上，写这本书的一个关键原因就是更深入地阐述这种需求并开发必要的专业知识。


    ## 2. 你想处于什么位置？


    **“预测未来最可靠的方法是尝试理解现在。”** – 约翰·纳斯比特特（John Naisbitt）


    拒绝变化不是一种策略，预测客户需求才是。我经常被问到的一个问题是：“如果你根据你对数据的了解身处我们的行业，你会建议我们做什么？”我的回答是：“试着想象你的客户的未来会是什么样子。用你可能获得的所有客户信息包围自己，因为你基本上是在寻找客户今天和明天未满足的需求。”


    如果你能理解每一个可能的客户需求，你会怎么做？关于 Apple App Store 有一个故事。当 Apple 发布 iPhone 时，史蒂夫·乔布并不热衷
    App Store 的概念。他的一个助手说：“我们必须拥有这个商店，它将推动对手机的需求。”乔布并不被说服，并重申他认为最好的办法只是发布带有浏览器网页功能的手机。经过进一步讨论后，他妥协并同意建立
    App Store。


    如果史蒂夫·乔布在设计 iPhone 时没有看到 App Store 的力量，那么在进入数据驱动和 AI 赋能的业务之前，如果你存在看不见的机遇和风险，你并不孤单。


    典型的 CFO/CEO/董事会希望看到第一个 AI-数据计划获得三比一的回报。现实是，这从一开始就不可能发生。开始将包括数据整理、赋能、测试和最佳业务案例的摩擦。


    ### 一个持续进行的过程


    如果你是一家资源有限的小型企业，在投入任何资金之前，先看看有哪些免费的资源。Google 有许多工具可以让你看到你所在类别的搜索情况。我的一个朋友经营着小型有机食品初创公司并向我寻求建议。在做任何其他事情之前，我在
    Google 趋势中搜索了我朋友所属的食品类别。令人惊讶的是，昆士兰州的搜索量比人口更多的新南威尔士州多出 100%。这些是免费数据，在这种情况下非常有帮助的。再加上一份销售此类食品的餐厅列表，你就可以尽早了解市场所在地以及正在向何方发展。它可以将搜索结果导出到电子表格中，我的朋友可以立即开始处理。这是免费的实时客户意图。关键在于花时间思考那些能让你成功的问题：


    1. 如今，我的产品或服务的总市场有多大？五年后有多大？

    2. 按位置划分，我的市场在哪里？

    3. 我的客户具有哪些特征？年龄、收入、生活方式以及其他购买行为。

    '
- fmt: '

    4. What do they do when not using my product? (That is a very creative question
    that needs real data to answer, but it leads to some very powerful insights.)


    5. What are my competitors offering them?


    6. Does the customer notice the difference between my product and the competition’s?
    How is it better?


    7. What is the unmet need of new and existing customers that my products or services
    can fulfil?


    8. What competitive response could occur that would make my plans fail?


    9. What mitigation action can I take to develop a competitive response?


    Without knowing your specific use case, industry and existing capability, it’s
    not possible to give specific guidance on the build, buy or partner decision.
    What I would say is that almost all companies partner in legal and accounting,
    as it’s complex and getting it wrong is a material threat. The partnerships are
    often also augmented with internal executives, like internal legal counsel or
    financial controllers. `AI-data analytics` is complex and getting it wrong is
    a material threat. Studies have shown that the top analytics talent produces outsized
    returns. The best data scientists and engineers are 10 to 50 times more productive
    than average performers. The lesson here is to make sure that if you are going
    in-house your team really is capable, and that, in turn, creates the challenge
    of who in the organisation is well equipped to evaluate the team or any external
    suppliers.


    **There will be failures and success – keep going**


    In a letter to shareholders, Jeff Bezos said, ‘One area where I think we are especially
    distinctive is failure. I believe we are the best place in the world to fail (we
    have plenty of practice!), and failure and invention are inseparable twins.’ He
    goes on to say that all breakthroughs come from failure.


    It’s a continuous process, where the customer leads you rather than you second-guessing
    the customer.


    ## 4. What are the forces that are driving the change?


    You can’t be in a business anywhere in the world now where your customers aren’t
    aware of what great analytics and `AI` looks like. Billions of customers use `Apple`,
    `Amazon`, `Google`, `Spotify`, `Siri`, `Alexa`, `Alibaba`, `Tencent`, `Waze`,
    `TikTok` and many more. A small dollar subscription spent on `Netflix` gives the
    user access to US$16 billion of content created based on the preferences (data)
    of other `Netflix` users. This is a very high-value proposition that all companies
    now compete with. Your customers know what good looks like and they expect it
    from you.


    In August 2021 Australia’s Federal Court handed down a decision that stated that
    ‘an inventor can be non-human’. That is, they’ve decided that artificial intelligence
    can be legally recognised as the inventor in patent applications.


    `Tesla` now has so much data coming back from each car – its capacity to understand
    the roads of Byron Bay, Boston or Bogotá – and this advantage accrues to them.
    In turn, they’ll sell even more cars because the system is good and getting better
    as `Tesla` acquires more data. That’s the virtuous cycle of data, or the flywheel
    of the data/data network effect.


    In the next chapter I explore the types and flow of data within companies, expanding
    out from the focus on customers into how data and `AI` can be applied across companies
    in areas that many think are not or cannot be data-driven.


    ## CHAPTER TAKEAWAYS


    1. Customers are judging the experiences they have with all organisations according
    to the standards they experience with the very best, and the best are typically
    advanced data-driven organisations.

    2. Data is sustainable, and its life cycle includes refinement, reuse, blending,
    augmentation with other data, and remodelling for new use cases.

    3. A data culture is where data is treated as a valuable asset, and where the
    customer interest is sacrosanct.

    4. Successful digital transformations require a 70:20:10 ratio, where 70% of the
    effort goes into process, ways of working, people issues, and KPIs, 20% on getting
    the data right, and 10% on technology.

    5. To become an `AI` data-driven business, companies must be honest in their appraisal
    of their current status, develop clear structures and systems for decision-making,
    embrace the possibility of receiving new insights and ideas, avoid the ‘not-invented-here’
    syndrome, and consider developing, buying, borrowing or partnering for data-driven
    solutions.


    [https://www.gobankingrates.com/money/business/jeff-bezos-worst-business-failures/#:~:text=%E2%80%9COne%20area%20where%20I%20think,and%20invention%20are%20inseparable%20twins.%E2%80%9D](https://www.gobankingrates.com/money/business/jeff-bezos-worst-business-failures/#:~:text=%E2%80%9COne%20area%20where%20I%20think,and%20invention%20are%20inseparable%20twins.%E2%80%9D)


    # Chapter 9


    # WHAT’S NEXT IN DATA AND AI


    **‘In every decision, be it personal, governmental or corporate, we must consider
    how it will affect our descendants seven generations into the future.’ – Seventh
    Generation Principle, Iroquois Nation


    Boards are the ultimate custodian of the enterprise’s future. How your organisation
    adapts to `AI`: Game On will decide its future. Every person and organisation
    will be affected by the seismic changes that `AI` is producing.


    The trajectory of `AI` use is not always clear. `Watson` was IBM’s AI hero more
    than a decade ago when it won the show *Jeopardy*. Soon there were claims `Watson`
    was working on new cancer research and other high-value use cases. IBM called
    `Watson` ‘the future of knowing’. They had TV ads with `Watson` talking to Bob
    Dylan about his songwriting style and `Watson` was seen as an AI revolution in
    the making. The reality fell short.


    Today’s AI capabilities are more advanced, more democratised. That said, there
    will be hazards, setbacks and hype in some sectors. Leaders will need to be curious
    and have humility and scepticism.


    In Chapter 1, I referenced Chris Anderson, editor of Wired, who said in 2008 that
    ‘the sheer volume of data would obviate theory and even scientific method’.


    Now that we’re in 2024, many more directors and executives across the commercial,
    environmental, health, medical, agriculture and energy fields are utilising the
    power of data and AI in their decision-making, business platforms, research and
    more.


    ## Data and AI are changing and challenging how you think


    Up until recently human beings have been the undisputed best source of knowledge,
    collectors of data and the instigators of most predictive capability in the known
    universe.


    Our human software and hardware evolve achingly slowly – it’s evolution, after
    all. Machines and AI are evolving at an exponential rate and as the expansion
    of data grows even faster, the compounding effects of machines writing better
    and faster code are accelerating at speeds we can’t fully comprehend.

