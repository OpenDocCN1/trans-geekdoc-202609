    HiPPO 可能是数据和 AI 大规模采用的推动者，正如杰夫·贝佐斯当年那样；也可能是通往新方式的障碍。董事会的主要责任是确保当时的首席执行官对于该组织、该时期以及可预见的未来是最优的。遗憾的是，我们已经目睹这种情况一次又一次发生严重错误，导致了一些重大的失败。正如*哈佛商业评论*中所述：


    在大多数组织中，最重要的战略决策决定权往往交给了薪水最高者的意见（HiPPO）。然而，HiPPO 往往被证明是错误的。一个 HiPPO 推动了 J Pen
    尼（JC Penny）灾难性的战略，即转向高端市场并放弃了其节俭型客户群。


    HiPPO 还导致了许多曾经辉煌组织的衰落。这种“没有人比大家都聪明”的观念甚至在高管层也存在。


    数据驱动决策的组织文化，是指证据和理性贯穿整个组织，在这里数据的质量支撑着信任和可靠性，而且基于价值观的治理方法处于所有决策的前沿。


    数据文化是指将数据视为宝贵资产，并将客户利益视为神圣不可犯的文化。


    分享数据文化“不是”什么同样重要。文化是整体的，而不是局部的，因此它不是在业务的某一部分（最可能是客户界面）进行数字化转型。那是一个“项目”。


    托马斯·H·达文波在*哈佛商业评论*中写道：


    我坚信，有效利用数据和分析最短缺的要素是经理们对可能性的理解。数据、硬件和软件层出不穷，但人类对这些工具所实现的可能性的理解要少得多。鉴于这个问题，迫切需要对这一主题进行更多教育。


    近期对数字化转型的观察发现，成功的项目呈现出 70:20:10 的比例。70% 的精力投入流程、工作方式、人员问题和 KPI，20% 花在确保数据正确，10%
    花在技术上。研究还指出，由于大多数企业仍然是以产品为导向而非以客户为导向，因此高层的努力需要首先发生，以改变业务导向——从以产品至上转变为以客户为宗旨的核心。


    当数据转型由技术驱动或数据驱动时，你就会错过了改变的真正机会。


    如果你不是数字原住民，你需要付出巨大努力提升技能，并尽可能多学习数据、AI 和机器学习。阅读这本书是一个很好的开始，但你还需要与组织中的数据负责人交流，多提问并保持好奇。如果你是初创公司，建立数据骨架会更容易；事实上，你的初创公司极有可能建立在数据、AI
    和机器学习的基础上。


    如果你是传统业务和/实体业务的高管，你需要从对全球数据/AI 竞争对手冲击的恐惧中抽出来，重新构你的业务模型。


    ## 开启 AI/数据之旅


    通常，最终不行动的痛苦将加剧到行动变得不那么痛苦的程度。


    如果你对健身计划的惯性持续足够久，终有一天有一天，你需要更多运动，因为这关乎生存。组织采用数据和 AI 能够也是如此。早期阶段是艰难、模糊甚至是危险的，伴随着成本超支和组织挫败感。这就像在坐了一辈子办公桌后，第一次去健身房的早上。停下来，你将付出非常昂贵的代价。


    有一个老笑话概括了许多高管和企业主对数据/AI 革命的感受。一对城夫妻在乡村开车迷路了，向一位农民询问回镇的路。“哦，我可不会从这里开始，”农民咧着脸回答道。


    那么，如果你还没有开始，你该从哪里开始呢？如果你已经开始了，你可能想稍微停一下，问自己以下问题：


    1. 你现在在哪里？

    2. 你想去哪里？

    3. 你将如何到达那里？

    4. 驱动变革的力量是什么？


    ## 1. 你现在真的在哪里？


    在迈克尔·刘易斯关于全球大疫情的书籍《预感》（*The Premonition*）中，他讲述了在 Covid-19 疫情开始之前，全球的一群健康专家获得了巨额报来评估世界应对疫情的能力。他们对每个国家处理疫情的能力进行了排名，你猜怎么着？美国被评为全球准备最充分的国家——组织最严、能力最高、医生最优秀、资源最多。当然，当疫情袭来时，与其他发达国家相比，美国在可避免的死亡人数方面的表现并没有大放异彩。


    这个总结让我觉得与高管们评估公司在数据/AI 使用和能力方面的现状完全相关，因为当你评估自己时，很容易将你的公司与同行业的其他公司进行比较并产生自满。就像美国的疫情专家小组，他们根据一组指标将美国的能力评为高水平，但这些指标没有考虑到病毒对现实世界的影响、政治干预、官僚主义失误、社交媒体上的误信息以及健康建议的政治化。理解你组织在评估
    AI 和数据能力方面的真实问题比看起来的要困难。


    对你目前的数据状况以及捕获、共享、解释和执行数据的能力进行诚实的评估至关重要。在做出任何决策之前，请要求进行一次简报（如果你有这些角色，可以来自内部或外部团队），了解你的业务处于什么水平：你拥有哪些数据、存储在何处、如何共享（如果有的话）、目的是什么、谁负责其质量、安全和治理。


    请外部人员（数据 AI 专家）来评估你的现状可能是一个很主主意。审计师评估当前的财务状况，并对财务部门的流程和团队提供独立观点，因此独立的数据视角是有价值的。


    ![发布时的插图，注意到显然有银行、电信、快消品等客户信号的极佳用户案例](img/himg-138-1.jpg)


    **发布时的插图，注意到显然有银行、电信、快消品等客户信号的极佳用户案例**


    **你必须理解你的数据，以及在数据存储和使用中存在的机会与威胁**


