  trans: "\n\n在 2023 年 5 月访问微软时，看到他们如何将 `Copilot` 概念引入其许多产品是一件很有趣的事。例如，他们正在开发新方法来总结数百封电子邮件并以草稿形式准备最佳的回复，或者通过自动化洞察来读取电子表格。又或者对\
    \ Teams 会议进行摘要，并为会议举办者自动分配任务和准备结果，这你觉得如何？\n\n这些工具及更多工具将加速 AI 辅助工具的采用，并让这些工具向数亿用户实现普及。\n\
    \n`Azure`、`Amazon`、`Google` 等企业的云战前沿现在正聚焦于智能 AI 云服务上。拥有最智能工具的云平台将从没有工具的云中夺取份额。这将导致人类活动各个领域对\
    \ AI 工具的采用速度大大加快。\n\n现在是新世界的加速时刻，Kevin Kelly 所描述的那个由数据流、认知化、筛选、访问、共享和过滤组成的世界。\n\
    \n2023 年 2 月 17 日，来自 `a16z` 的一期名为“1000 倍开发者”的播客中采访了 `Replit` 的首席执行官，这家公司专注于使用\
    \ AI 来帮助开发者。这位首席执行官谈到了一个开发者可能获得 1000 倍提升的未来。他指出，粗略估计只有大约 1% 的人会写代码。对新代码的需求是爆炸性的，而\
    \ `Replit` 的目标就是开发通过提供更好、更快的选项来引导代码的 AI 驱动工具。我不确定这是好是坏，我只是观察到，如果你的技术通过新工具能够获得哪怕一点提升，你也会想去探索它。`Replit`\
    \ 首席执行官接着谈到了新代码的丰富性以及创建由新工具支持的新工具。\n\n## 作为高管或董事会成员，你在 AI 时代的角色是什么：游戏开始（Game On）？\n\
    \n此时值得反思几个问题：\n\n1. 在机器在发现和处理信息的能力上反复超越人类的世界里，CEO 的角色是什么？\n2. 董事会在对于这样一个机器系统的责任中，扮演着什么角色？\n\
    3. 这里存在哪些问题？董事会和社会如何降低风险？\n\n这里的每一个问题可能都有一本书，我肯定会进一步探索并分享一些想法。现在作为高管或董事会成员，你所能采取的最行动是：\n\
    \n1. 为时间治理（Govern for time）\n   - 治理源于拉丁词 `gubernare`，意为“操控”。数据越好，创建洞察和行动以控制组织进程的能力就越强。如果你在整个组织拥抱数据、AI\
    \ 和机器学习，并以企业级的骨干构建你的业务，你正走向你自己的 AI 版本：游戏开始（Game On）。\n2. 理解并拥抱机器学习\n   - 下一步是全球范围内已经在组织中实施的“机器学习”的演进。这是未来的预测型公司，届时数据、AI\
    \ 和机器学习将与人类团队相结合，学习将其整合到他们的决策能力中。\n\n这是两项深远的责任，如果你的组织希望延续下去，这些责任是无法避免的。\n\n我有幸看到\
    \ Garry Kasparov 在 2019 年的西南节（`SXSW`）上演讲。Kasparov 在 1985 年以 22 岁成为历史上最年轻的无争议象棋冠军。1997\
    \ 年，他在标准时间控制下输给了 `IBM` 超级计算机 `Deep Blue`，成为首位在比赛中输给电脑的世界冠军。Garry 分享了从那以后输给机器的感受；从那时起，象棋变成了人类与机器的游戏。它是人类与机器的增强，而非人类的取代。这些象棋大师几十年前就必须决定何时允许机器移动，何时不；这现在是所有领导者的决策。\n\
    \nCEO 和董事会已经在做出机器和数据增强的决策，正如 `Salesforce` 首席执行官 `Marc Benioff`、`Amazon` 创始人 `Jeff\
    \ Bezos` 以及 `Microsoft` 首席执行官 `Satya Nadella` 所做的那样。尽管如此，数据、AI 和机器学习是下一个层次，让你能够深入、查看并处理你的组织每天每秒产生的数据，有时添加其他数据集来精炼你的数据。新奇的是信息量，是从客户需求到观察到的数据流向董事会再流回的潜在流动；当它被正确构建和整合时，它就像一根（带有脊髓液的）数据骨干。\n\
    \n## 对客户提问，并持续提问\n\n确保你尽可能学习任何关于你客户的知识。引用 `Jack Welch` 的话，他的遗产显然很复杂：“获胜只有两种方法：搞清楚你的客户想要什么，并比任何人都更快地做到。”\n\
    \n要建立一家真正以客户为中心的公司，你需要将其作为一个全全的挑战来领导。\n\n具有预测能力的公司的组织设计始于一种认知：数据、AI 和机器学习来自公司的各个角落，并从底部流向顶部再流回来。`Tesla`\
    \ 有这些，`Microsoft` 有，`John Deere` 以及不断增加的新旧公司都有。实时完整地了解客户在购买什么、如何使用产品或服务、他们使用或购买的频率、他们使用的应用程序以及频率、花费了多久等。这些信息流向了业务的所有部分：供应链、仓储、物流、销售团队、产品设计人员、开发、技术团队、呼叫中心支持团队、销售营销团队，而且不能遗漏高管和董事会。\n\
    \n## 业务的“按需知”模型已变为“按需共享”\n\n共享的需求是整个组织范围内的。未能连接业务部门的数据现在正为你的业务带来成本，未来将产生更高成本。世界在径\
    \ 9/11 袭击中吸了这种失败的悲剧教训。包括 `CIA`、`FBI`、`NSA`、`FAA` 在内的众多政府机构未能连接数据和线索，导致了机构间数据和情报共享的重大变化，即合并他们的数据库以进行更全面的信息分析。《9/11\
    \ 委员会报告》非常有可读性，尤其是第 13.3 节“信息共享中的努力统一”。\n\n将数据、AI 和机器学习的责任孤立给某一个个人（你的 `CDO` 或\
    \ `CIO`），然后让他不得不与整个组织斗争，并不是扩展数据驱动的以客户为中心的方法。需要全组织范围的领导力和管理所有权，并将 KPI 锚定在客户体验和客户体验回报上。\n\
    \n在内部共享数据现在充满了风险，即这些数据可能通过非法手段被共享到外部。网络窃窃的风险不能成为你被拥有更好数据和更优 AI 驱动产品的竞争对手击败的理由。应对网络风险领域意味着既要考虑收益，也要考虑亏损。如果组织无法想象或看到收益，那么所有关于数据和\
    \ AI 的讨论都只是停留在风险登记册上。\n\n"
