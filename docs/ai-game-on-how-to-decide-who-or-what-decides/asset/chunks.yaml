    \ and distributed could generate an additional $3 trillion in economic activity,\
    \ enabling applications as diverse as self-driving cars, personalised healthcare\
    \ and traceable food supply chains.^([^(84)](#fn84))\n\n                The increased\
    \ feasibility of sharing data is being accelerated by the proliferation of data\
    \ sources through the Internet of Things (IoT). In addition, there are new techniques,\
    \ protocols and standards for pooling, sharing and exchanging data. Knowledge\
    \ through the exchange of data is part of a new European Union data strategy.\
    \ It is designed to create ‘a single market for data’ to empower people, business\
    \ and organisations to make better decisions based on insights from non-personal\
    \ data in order to compete with the current tech giants.^([^(85)](#fn85))\n\n\
    \                However, capturing and adding all this data to existing (legacy)\
    \ and new business systems is also creating confusion about how to find it, use\
    \ it, manage it, and legally, securely and efficiently share it. Where did a certain\
    \ data set come from? Who owns what? Have we legally sourced it? Have we ethically\
    \ dealt with it, and have we protected it? Who’s allowed to see certain things?\
    \ Where does it reside? Can it be shared? Can it be sold? Can people see how it\
    \ was used? And, most importantly, what is its purpose? This last question may\
    \ seem obvious but in many companies I’ve worked with the answer differs depending\
    \ on who you are talking to, at what level, and in which division (silo) they\
    \ belong.\n\n                As data applications grow and become more ubiquitous,\
    \ consumers, owners and stewards of data are finding that they don’t have a playbook\
    \ to follow. Consumers want to connect to data they trust so they can make the\
    \ best possible decisions. Owners of the data need tools to share their data safely\
    \ with those who need it. Risk registers need to adapt to the reality of our times\
    \ with cybercrime and ransomware widespread.\n\n                The board’s dilemma\
    \ comes down to one thing: managing risk in a world of VUCA – volatility, uncertainty,\
    \ complexity and ambiguity. Data misuse and cyber hacks are already on the risk\
    \ register of most boards. The lack of data use and not being competitive with\
    \ data and AI need to be added to the risk register too.\n\n                How\
    \ can you protect the crown jewels of data in the organisation and use it optimally\
    \ at the same time? Lock it up and you get no customer benefit, open it up and\
    \ you get hacked. It is wise to start with an audit of what you have data-wise,\
    \ why you have it, how you obtained it, what has and could it be used for.\n\n\
    \                This is where you may need outside help. If data is not your\
    \ core competency, get help from experts. Companies that do this work 24/7 are\
    \ a long way along the experience curve.\n\n                ## [Data is the product](#content-toc.xhtml#AbNa)\n\
    \n                Increasingly the data is the product. Fitbits are a relatively\
    \ simple device; it’s the data dashboards for the user that hold much of the value\
    \ for them, while the company that owns Fitbit (Google from 2021) acquires yet\
    \ more data for its businesses and can continuously improve a range of its products\
    \ and offerings. Fitbit has over 120 million devices used by millions of users.\
    \ Waze (also bought by Google in 2013) is yet another example where the data of\
    \ the customer, while driving, is an input into the product. By using Waze I give\
    \ the company data about where I am driving, how the traffic flow is working,\
    \ or other information, while receiving valuable information from them about my\
    \ ETA, traffic con-gestion, hazards and more. It suggests changes to my drive\
    \ based on information from other users so the system gets smarter with more users.\n\
    \n                The ‘give to get’ model of data is upon us across many areas\
    \ of our life. Just consider the apps you use on a daily basis. Many are ‘free’\
    \ because the value exchange is your information/data, such as those from Facebook,\
    \ Twitter, [Booking.com](http://Booking.com), Findr, Strava, Under Armour’s MapMyRun,\
    \ Everyday Rewards, FlyBuys and more.\n\n                ## [The synergy of data\
    \ and AI and humans](#content-toc.xhtml#AAbf)"
