    ![](images/cover.jpg)


    ![Image](images/cover.jpg)


    [![Image](images/himg-1-2.jpg)](http://aigameon.com)


    To Elizabeth, Syd and Anna.


    Thank you for:

    - The wonders we have seen.

    - The people we are fortunate to know.

    - The adventures that await.


    # ABOUT TIM TRUMPER


    Tim is Chairman of the `NRMA`, an advisor to and a founding shareholder in `Quantium`,
    which provides data and analytics to some of the world’s leading brands, and he
    also holds interests in several private high-growth innovative companies, including
    `andi search`.


    His career has spanned diverse categories including artificial intelligence and
    machine learning, big data, digital transformation, mobility and transport, financial
    services and media.


    He is an authority on the utilisation of data to drive innovation and corporate
    strategy. His core interest relates to how business leaders facilitate successful
    AI and machine-learning business transformation to drive innovation, for corporate
    strategy and for the service of customers and the community.


    Tim is an experienced chair, non-executive director, former CEO, and advisor to
    high-performance global and Australian companies.


    He holds an MBA from `UNE` and in 2018 completed Harvard’s `Making Corporate Boards
    More Effective Governance Program`, and is a graduate of `AICD`.


    # PREFACE


    A wise man said to me a long time ago, there is never a good time to build a house,
    have a child, start a business, or write a book. The book is last on this list
    for me, and it’s been a long time coming. Thank you, Jaqui Lane and Michael Parker,
    for helping me through it all.


    My journey into data started a long time ago when I was fortunate to meet amazing
    pioneers of the internet `Louis Rossetto` and `Jane Metcalfe`, the pair who in
    1993 co-founded `Wired` magazine in their San Francisco offices. It set me up
    for a long journey in the world of data and analytics and how it can be used to
    understand and predict intention and attention, the two new asset classes of our
    time. Rossetto and Metcalfe talked about what they saw coming at the near dawn
    of the World Wide Web. Australia at that time had a few hundred email users, and
    a handful of real working websites that were not just green screen text.


    Think about what has changed in those three decades. Pretty much everything has
    changed.


    Louis pointed to a copy of the `San Francisco Yellow Pages` and said, ‘This is
    worthless.’ At the time `Yellow Pages` was a massive industry. He went on to say,
    ‘If you can work out who will need medical help or buy a new car this weekend
    in San Francisco it is close to priceless. What we are building here is a way
    to know everything.’ He was talking about a prediction machine, and it blew my
    mind. Louis saw the need for search, before `AltaVista`, `Yahoo`, `Google`, `Andi`
    and others. It was an amazing prediction.


    Then in 1997 the head of `Microsoft` strategy in Seattle said to me, ‘Everybody
    knows that the guy with the best data on their customers’ needs will win,’ as
    he explained how in the dial-up world they were trying to understand hundreds
    of millions of customers’ interactions with `Word`. In 1997 this was a mind-blowing
    initiative.


    I spent many years looking for what would come out of this line of thinking about
    large-scale data sets.


    I worked in the media for many years, using what data we had to best inform strategy.
    It was low-grade data from surveys and focus groups. We did our best with it.
    When the internet really fired up it was a game changer.


    Then in 2009 I met `Adam Driussi`, co-founder and now CEO of `Quantium`. I was
    helping an insurance company at that time and Adam made a pitch to the board.
    Adam has a very sharp mind and combines this with a passion for helping companies
    find real scaled insights and increasingly apply AI-enabled actions to their data.


    Having seen hundreds of pitches to companies, I was taken with what Adam put forward.
    What he showed was powerful. By using de-identified credit card data it enabled
    the understanding of real customer behaviours of the insurance company customers;
    not surveyed, and not a small sample, it was scaled and the behaviours were real.


    What was most interesting was how you could use this data to work out why customers
    defected. Was it price, service, poor claims, or something else? The nuances in
    the real use of data were ground-breaking. The client company bought the offering
    and it helped transform it at that time.


    I found it so interesting I followed up with Adam and after a few conversations
    I joined `Quantium` as a shareholder and advisor. `Quantium` has grown from those
    days, when there were about 14 people, to become a global business with over 1,200
    staff today. This journey with `Quantium` has allowed me to work with very smart
    people and to learn a great deal about the frontiers of data use, analytics and
    AI deployment. As you read this book it will become clear that much of my perspective
    is informed by my relationship with `Quantium` and no doubt osmosis has been hard
    at work over many years. Being in the practice of analytics and knowing the governance
    concerns of boards is not a common combination, so I do hope this perspective
    is helpful for the reader.


    The first prompt for writing this book was from a CEO client of mine, who said,
    ‘You’ve had a front-row seat at the forefront of data use, AI enablement and data
    ethics for over three decades – why not tell us some of what you have learnt?’


    Next, the chair of one of Australia’s top 20 companies said to me, ‘Tim, you have
    a unique vantage point, as you are a data practitioner, and also chair of a very
    corporation. You can see a board’s perspective on governance, risk and strategy.
    You can also see the data and use case challenges executives all over the world
    are working on. And you can see their ethical dilemmas. Let others in on what
    you have learnt.’


    The comments above, and many others, stayed with me for years.


    The whole world is increasingly focused on equity, transparency, and a more inclusive
    orientation. I’ve written *AI: Game On* to help business leaders who want to thrive
    in a world that is ever more data-driven and AI-directed. These developments must
    be properly scrutinised for ethical standards and data use cases.


    I have seen many examples of where the data use cases and AI can align to the
    customer’s benefit, and company advantage, while helping society. This should
    not be a rare event; this should be the way of the future.


    Finally, if you’ve been dismissing AI, applied analytics, machine learning and
    deep neural networks as not applicable to your business, you’ll soon discover
    your perspective is out of date. And if you’ve skimmed over these developments
    as being too hard, you need to know that embracing the world of data and AI is
    simply not optional. So, for those who harbour doubts, I suggest you suspend your
    disbelief, and be prepared to accept that what was once science fiction is now
    fact.


    Tim Trumper


    January 2024


    # INTRODUCTION


    Data and AI are changing how we think about how we think.

