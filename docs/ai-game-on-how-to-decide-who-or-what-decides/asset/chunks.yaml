- fmt: 'The more times a business operates through a cycle, the greater the competitive
    distance. Companies that can and have operationalised this model are going to
    be harder to catch up with. Amazon’s flywheel is a much-cited story about how
    the more they create value for customers the better they can help them next time.
    Tesla information about road conditions is growing fast and creates better driving
    conditions for their customers. The data of the customer when captured and used
    by them, for them, is a powerful flywheel effect.


    ## Types of decisions


    As with other business areas, the types of decisions executives and boards need
    to make in relation to their data and AI operations fall into two main categories.
    Strategic (Type 1) decisions are consequential, irreversible or extremely difficult
    to reverse. They are one-way doors and must be made methodically, deliberately,
    slowly and with great consideration. Selling the family home is one such decision.
    Non-strategic (Type 2) decisions are changeable and reversible. These can and
    should be made quickly by a high-judgement individual or small team. Interestingly
    Jeff Bezos addressed this very issue in his 1997 shareholders letter noting that
    as companies get bigger there is a tendency to make the processes around Type
    2 decisions the same as Type 1 decisions, which slows down innovation to customer
    needs.


    The governance framework of how to use AI, and to ensure that customer sanctity
    and ethics apply (see Chapter 8), is a strategic Type 1 decision. The ongoing
    data operations that feed into AI operation can then become a Type 2 decision
    if the guard rails are in place, and the governance, in order to do no harm. The
    delegation of deciding how to decide, who or what decides, is critical. Reviews
    of all decision-making by AI need to be done to ensure ethical considerations
    are not subject to drift in goal alignment.


    Data can and does work well with strategic and non-strategic decision-making.
    I saw an M&A transaction that was data-led. The company wanted to expand, and
    instead of finding targets based on traditional means of engaging investment bankers
    to identify potential targets, the data found the target company in the behaviours
    of the customers. To be specific, we found that what the customers of company
    A were buying was in adjacent categories to the target company B, which was available
    for acquisition. It was about following the customer to identify the new venture
    rather than following the investment bank’s recommendation from a list of the
    usual suspects.


    While data and AI can and should be utilised throughout an organisation’s decision-making
    processes, even at board level, it’s currently most powerful and effective in
    high-frequency decisions like what offer to make next to customers. Share trading
    is one obvious place, where the algo-traders are using billions of signals to
    try to find alpha in the data flows. Approximately 60–73% of all trading in US
    equities is done by algorithms.


    Another example of strategic decision-making in the medical field can be seen
    in the area of structural biology. Determining the 3D shapes of biological molecules
    is one of the hardest problems in modern biology and medical discovery. ‘Using
    clever, new machine learning techniques, Stanford University PhD students Stephan
    Eismann and Raphael Townshend, under the guidance of Ron Dror, associate professor
    of computer science, have developed an approach that overcomes this problem by
    predicting accurate structures computationally.’


    Of relevance to our decision-making discussions is that instead of specifying
    what makes a structural prediction more or less accurate, the researchers let
    the algorithm discover these molecular features for itself. They did this because
    they found that the conventional technique of providing such knowledge can sway
    an algorithm in favor of certain features, thus preventing it from finding other
    informative features. They took a strategic decision to let the AI decide. The
    result was impressive:


    ‘The network learned to find fundamental concepts that are key to molecular structure
    formation, but without explicitly being told to,’ said one of the researchers.
    The exciting aspect is that the algorithm has clearly recovered things that we
    knew were important, but it has also discovered characteristics that we didn’t
    know about before.


    ## The decision of our time is how to decide who or what decides


    Dealing with this challenge will be integral to your organisation’s move to AI:
    Game On and your destiny.


    How will you know where AI was used in Type 2 decisions? Who signed off on it?
    Will a regulator want to understand what’s in the decision as a service? What
    is the source data? Is it verified? What is the customer outcome, and what second-order
    consequences are there?


    ## What is your defensive moat?


    Even if you adopt a real AI strategy, many others will do the same and have access
    to the same tools and perhaps the same data. The answer and the advantage will
    be in the use case. Whoever gets to the customer first starts the new flywheel
    of scale.


    Humanity is on a journey that is allowing us to put more and more decisions and
    actions into the hand of machines. Years ago department stores had a lift driver
    because passengers were nervous about being in the lift without one. We grow more
    accustomed to machines making decisions for us every day. Driverless trains were
    introduced in Japan in the 1980s, then in France and now around the world. The
    spread of driverless trains is a good reminder that ‘new’ automated decision-making
    capability is quickly accepted by people so long as trust and security are not
    compromised.


    Google is a decision as a service (DaaS) pioneer where the value exchange it offers
    could be summarised as you allow Google to track what you search for, and it uses
    the intention data so advertisers can target you for a large commercial gain in
    it in Google’s favour. John L. Hennessy, the chairman of parent company Alphabet,
    told CNBC that Google was hesitant to use its Bard AI in a product as it’t ‘really
    ready’, and yet Google unveiled its Bard AI in February 2023 amid intense interest
    in competitor ChatGPT. A promotion for Google Bard featured a factual error –
    and Alphabet’s stock dropped 9% in a day after the mistake received media attention.
    That was a valuation hit of over $100 billion dollars at the time. If the data
    giants can get this wrong, it is a lesson that there is real complexity here to
    be solved and governance needed at board level.


    Some consumers don’t want to engage in this value exchange, and that should be
    their choice. There is some new, albeit small, competition in the search marketplace.
    As mentioned before I am an adviser to Andi search, a new way of searching the
    internet. It has a high level of data protection and is ad-free with no data tracking,
    so your searches are not spam based on ads that bid for your attention. Jeremy
    White is the founder of Andi search and he told me, ‘If you’re building a system
    like a GPT-based LLM, everything looks like a language problem’ and not everything
    is a language problem.

