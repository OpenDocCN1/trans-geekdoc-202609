  trans: '


    如果机器的行为背离了人类的最优利益，它就会陷入流氓行为的世界，而这正是几代反乌托邦科幻小说的常态。从埃隆·马斯克到去世的史蒂芬·霍金，一些最顶尖的人才都可靠地指出了这种风险。如果无法理解
    `AI` 驱动的预测机器在预测什么以及如何预测，那么一切都可能出错。其目的必须坚定地植根于对人类的益。创造物不听从主人的“弗兰肯斯坦式困境”可能会发生在我们身上。假装这种可能性不存在是天真的，而确保其不发生是我们的责任。


    我们将面临挑战、伦理问题、`AI` 武器化的虚假信息、对虚假账户的信任幻觉等问题。如果不谨慎使用，生成式 AI 可能变成一只极具说服力的鹦鹉，听起来很好，但实际上却一无所知。


    将会出现新的致力于消除虚假信息、治理网络水军工厂的新型企业；会有新的想法，而我们需要这些想法。我的儿子对于如何验证人类对音乐和艺术的输入有一个想法。`Andi
    Search` 有方法展示它用于生成摘要的源文档，以消除在其他形式的 AI 中出现的幻觉。


    你的业务拥有一项 `OpenAI` 中找不到的数据资产。那是你为客户、利益相关者和社会创造价值的专有数据。


    每一个行业部门、每一个科学领域、技术、医学、健康、气候、资源、文化、金融、艺术……都在受到数据/`AI` 和机器学习的影响。新业务、不同的业务模式、新方法、新或不同的解决方案每天都在涌现。


    这个世界是一个复杂、动态且充满挑战的地方。波动性、不确定性、复杂性和模糊性（`VUCA`）无处不在，并在生活的各个方面扩张。


    AI 有一天可能会减少这些 `VUCA`。但这不是我们现在的情况。AI 正在以指数级速度增加 `VUCA`。AI 巨大到无法忽视，复杂到无法完全委托，变化太快以至于无法被完全理解。与此同时，企业领袖要对如何处理
    `AI`、如何计划、采用何种伦理标准以及追求哪些用例负责。如果你停滞不前，新入场者或现有竞争对手就会推出一种可能损害你业务的新型 `AI` 驱动产品或服务。如果你进展太快，就会越过被认为可以的用例。


    企业、社会和个人面临着许多困难。气候变化、大规模的收入不平等、不断变化的地缘政治力量、乌克兰战争、新的影响领域，这仅是一角。数据、分析和 `AI` 可以并且正被用于帮助解决其中的一些问题，并且是以符合伦理的方式。


    我们世界的变化速度将永远不再像这样缓慢。摩尔定律、量子计算的进步（包括澳大利亚公司 `Silicon Quantum Computing` [`SQC`]
    最近的突破，他们宣布了世界上首个在原子尺度制造的集成电路）。


    我以一个乐观的展望结束本书，对我们面临的 `AI` 在世界中如何使用的挑战保持现实态度，并意识到这里仍有多少内容是不可预测的。


    显而易见，有许多需要学习，没有人掌握所有的答案，我在书中试图传达的大部分内容都是开放辩论的。我们都在试图找到正确的方法来帮助世界适应 `AI`：在特定的时刻，游戏开始（Game
    On），并以一种适合人类的方式进行。我看到过数据/`AI` 如何成为一种强大的向善力量。我看到过企业领袖、高管和创业者可以在解决我们最大的挑战方面发挥实质性作用，并在此帮助世界人民过上更好、更充实的生活。


    显而易见，如果用例与社会的最佳利益不一致，`AI` 可能会造成真实的伤害，可能在大规模上造成。它今天就有这种力量，而且这种力量还会增长。我们是否处于所有人都有个人代理来寻找真相、无偏见地代表我们行动并将其带回家的边缘？还是说我们正走向更多的
    `AI` 驱动的虚假信息？我们的健康机器人会找到我们的最佳健康状态和疾病治愈方法吗？还是会有某个反乌托邦的世界向我们走来？莎士告诉我们，美德的行为比复仇罕见，因此我们不能假设善意会胜出。它需要人们去争取，需要监管机构采取行动。无论发生什么，你的组织都需要成为这个新世界的一部分，在这里是
    `AI`：游戏开始。


    世界需要法律和伦理框架、可行且理解良好的护栏，我们需要在这些方面拥有专业知识的领导者。如何决定由谁或什么来决定是我们我们时代的问题。


    ## 章节摘要


    1. 就像马歇尔·麦卢汉声称“媒介即信息”一样，`AI` 也在从根本上改变社会交流和相互作用的方式。

    2. 大多数组织可能拥有一独特的数据集，可以战略性地进行增强，以创造洞察和预测能力。

    3. 社会应该决定监控水平和数据使用情况，而不仅仅是科技行业和专业人士。

    4. `AI` 的未来分布是不均匀的，科技巨头相对于其他人都保持着显著优势。

    5. 虽然 `AI` 最终可能帮助减少不性和波动，但明智的做法是预感到在可预见的未来，变化的速度只会加速。


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ 延伸阅读


    - `The Hype Machine: How Social Media Disrupts Our Elections, Our Economy, and
    Our Health – How We Must Adapt`, Sinan Aral, Currency, 2021.

    - `Who Can You Trust?: How Technology Brought Us Together and Why Might Drive
    Us Apart`, Rachel Botsman, Public Affairs, 2017.

    - `Post Corona: From Crisis to Opportunity`, Scott Galloway, Bantam Press, 2020.

    - `Leadering: The Ways Visionary Leaders Play Bigger`, Nancy Giordano, PBI Publishing,
    2021.

    - `Homo Deus: A Brief History of Tomorrow`, Yu Noah Harari, Harper Perennial,
    2018.

    - `The Inevitable: Understanding the 12 Technological Forces That Will Shape Our
    Future`, Kevin Kelly, Penguin, 2017.

    - `Leadership: Six Studies in World Strategy`, Henry Kissinger, Allen Lane, 2022.

    - `Select Committee on Artificial Intelligence`, Lord Clement-Jones (Chairman),
    [`publications.parliament.uk/pa/ld201719/ldselect/ldai/100/10001.htm`](https://publications.parliament.uk/pa/ld201719/ldselect/ldai/100/10001.htm).

    - `The Premonition: A Pandemic Story`, Michael Lewis, W W Norton & Company, 2021.


