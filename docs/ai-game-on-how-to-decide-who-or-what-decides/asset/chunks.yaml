  trans: '

    数据和人工智能（AI）正在改变，并将继续改变我们生活的方方面面。在许多其他深远变革之外，我们刚刚经历了过去 50 年来最具挑战性的时期之一。我们经历了百年一遇的全球性流行病，随后是俄罗斯入侵乌克兰导致的大规模贸易动荡，而且我们正经历着气候变化的影响。所有这些因素都导致了巨大的干扰。对于个人、组织和社会而言而言，韧性和适应能力可能比以往任何时候都显得更加重要。


    可以说，对数据的捕获、利用、共享及其解读，使得世界领导者和医疗专业人员能够比我们以往任何时候都更有效、更高效地研究、开发和实施大流行病应对措施。这拯救了数百万生命，减少了病毒对其他数百万人的影响，并避免了全球性经济危机。


    ### 医疗保健中的 AI

    人工智能正被应用于广泛的健康医疗治疗领域。例如，通过 X 光片对肺癌进行评估。医生/放射科医生每天只能查看一定数量的光 光片，并利用他们的知识寻找癌症等健康问题。而能够持续学习的
    AI 机器每天可以查看数千份。将放射科医生与机器结合，你就显著提升了能力。对于 AI 如何发现其他疾病的关联性和早期迹象，人们感到非常兴奋。其中一些发现以前还未被察觉，现在正由人类进行进一步调查。


    我最近在一个公共论坛上看到了 [Enlitic.com](http://Enlitic.com) 的演示，这令人印象深刻，它展示了如何以惊人的速度和极高的准确性扫描数千份
    X 光片以检测异常。他们专注于使用 AI 工具的解决方案，这些工具对患者护理产生积极影响，而且他们的 AI 能够比单凭医生更准确、更快速地发现健康问题。


    ### 金融领域与监管

    对于金融部门，特别是在澳大利亚，关于银行、养老金和金融服务行业不当行为的皇家委员会以及由此产生的负责任贷款建议，有效地从住房贷款方面改变了法律。它从“买方自慎”转变为“卖方自慎”。全球范围内的银行和其他金融机构将需要特定的标准来决定可以向谁出售什么产品。如果你不使用真实数据来了解你的客户，以及你可能或不应该向他们销售什么，监管机构很可能会问你为什么不呢？


    虽然了解客户（KYC）是银行受监管必须遵守的——主要是为了反洗钱目的——但他们和其他大公司都旨在实现某种形式的以客户为中心的目标。现实是，AI 的部署规模和水平远未达到真正了解其客户、或者更好地预测他们在何时需要他们需要东西的程度。


    这里有一个最近的个人例子。我收到了一张支票。你还记得支票吗？于是，我找到了银行分行并存入了支票，在办理时，柜台员问我是否需要汽车贷款。我为柜台员感到很遗憾，因为我是用那家银行的现金买了车，所以我在银行的交易记录告诉他们不需要汽车贷款，但前台柜台员并没有这些信息。相反，他收到的是总部的一项自私指令，要求他推销汽车贷款。我的数据本可以为了我自己的利益而使用，但他们的系统过于脱节，无法赋予柜台员对我进行进行“下一次最佳对话”的能力。拥有良好管理并专注于数据客户创新的银行，以及金融科技挑战者，在使用客户数据方面将不会如此迟缓，并能够创建下一次最佳行动——根据客户的特定需求与客户进行对话。


    当你是现有者时，这很难，因为自尊和傲慢会产生障碍。沃伦·巴菲特在 2014 年给伯科希撒韦股东的信中提到了他的 ABC 单：


    “我的继任者还需要另一种特殊能力：抵御业务衰败的 ABC 能力，即傲慢、官僚主义和自满。当这些企业癌症蔓延时，即使是最强大的公司也会动摇。”


    ## 数据 AI 能力/数据 AI 领导力匮乏


    几年前，企业面临的挑战是他们没有足够的可访问数据。典型数据旅程的起点是数据处于不同的格式、位于业务的不同部门，并且没有共享。在许多情况下，数据被积极地隐藏或被其他部门扣留。


    现实是，AI 的部署规模和水平远未达到真正了解其客户、或者更好地预测他们在何时需要他们需要东西的程度。


    在`第 5 章`中，我探讨了“数据骨干”（data spine）概念，以及今天和未来的成功公司如何拥有它。现在企业真正的稀缺在于识别或培养能够重建这种机制的领导者、高管和创始人。


    数据驱动的巨头，如 `Amazon`、`Apple`、`Netflix`、`Alphabet`、`Microsoft`、`Tesla` 和 `Meta`，正在使用数据和
    AI 创建优势。一些还包括 `Adobe`、`Klarna`、`Reonomy`、`FourKites`、`Databricks`、`Canva`、`Teradata`、`IBM`
    和 `Cloudera`。


    数据时代贯穿始终的需求学习、适应和改变。他们还注意到当变化加速时，学习的需求也随之增加。如果是这样，还有比你的客户更好的学习地方吗？了解客户需求的最有力方法是通过他们以符合隐私规定的方式与你分享的内容。


    一个组织学习并并将这种学习转化为行动的能力是终极竞争优势。这是数据分析和 AI 蓬勃发展。这些能力实时捕捉客户的信号。它们可以实时响应，并在需要时实时通知。它们还可以帮助预测未来的需求和欲望、库存控制、交付和定价，都是实时完成的。这是一个预测性业务。


    现在有了能够快速创建算法的公司，有些声称每天创建 200,000 个算法。其中一家公司 `DataRobot` 在 2021 年的估值为 63 亿美元。


    当马克·安德森在 2011 年说“软件正在吞噬世界”时，即使是他也未预料到 Sarah Wang 在最近的播客中所说的，2023 年 AI 将吞噬软件。


    自适应算法（SAMs）已经存在了一段时间，现在用代码编写代码已成常态。2023 年 2 月，微软声称有超过 1 亿软件开发者现在正在使用 `GitHub Copilot`。你将代码用于哪些任务以及出于什么目的，将越来越多地决定你的企业成果和声誉风险。这最终归属于董事会的责任，因为如果出现问题，董事将承担后果，风险可能比收益更大。在在未来，组织的命运将与代码紧密相连，取决于如何履行组织的使命、宗旨，以及这一切如何与社会的预期相契。对于某些人来说，这很难想象，但这就是新的现实。

    '
- fmt: "\nIn visiting Microsoft in May 2023, it was interesting to see how they are\
    \ adding the `Copilot` concept to many of their products. For example, they are\
    \ developing new ways to summarise hundreds of emails and prepare the best responses\
    \ in draft, or the reading of spreadsheets with automated insights. Or, how about\
    \ summaries of Teams meetings with automated allocation of tasks and outcomes\
    \ prepared for the host of the meeting.\n\nThese tools and more will speed up\
    \ the adoption of AI-enabled tools, and the democratisation of these tools, to\
    \ hundreds of millions of users.\n\nThe frontier of the cloud wars of `Azure`,\
    \ `Amazon`, `Google` and others is now focused on smart AI cloud services. The\
    \ cloud with the smartest tools will take share from the clouds without the tools.\
    \ This is going to see much faster adoption of AI tools in all aspects of human\
    \ endeavour.\n\nIt is the acceleration of the brave new world now, the world that\
    \ Kevin Kelly describes as one of data flows, cognifying, screening, accessing,\
    \ sharing and filtering.\n\nAn `a16z` podcast, on 17 February 2023, titled ‘1000x\
    \ Developer’ contained an interview with the CEO of `Replit`, a company that is\
    \ focused on using AI to help developers. The CEO was talking about a future where\
    \ could be 1000x uplift for developers. He made the point that in approximate\
    \ numbers, only around 1% of people can code. The demand for new code is off the\
    \ charts, and AI-driven tools that nudge the code with better and faster options\
    \ are what `Replit` aims to do. I am unsure whether this is good or bad, only\
    \ observing that if your technology could get even uplift with new tools you would\
    \ want to be exploring that. `Replit` CEO went on to talk about bounty of new\
    \ code and creating tools enabled with new tools.\n\n## What is your role as an\
    \ executive or board member in AI: Game On?\n\nIt is worth reflecting on some\
    \ questions at this point:\n\n1. What is the role of CEO in a world where the\
    \ machines are outperforming people repeatedly, in the ability to find and process\
    \ information?\n2. What is the role of the board in their responsibility for such\
    \ system of machines?\n3. What are the issues here and how does the board and\
    \ society mitigate risk?\n\nThere is probably a book in each of these, and I will\
    \ certainly explore more and share some thoughts. The most important actions you\
    \ can take as an executive or board member right now are:\n\n1. Govern for time\n\
    \   - Governance is from the Latin word `gubernare` meaning ‘to steer’. The better\
    \ the data, the better the capacity to create insights and actions to control\
    \ the course of organisation. If you embrace data, AI and machine learning across\
    \ your whole organisation and build your business with enterprise-wide spine,\
    \ you are on your way to the first version of your own AI: Game On.\n2. Understand\
    \ and embrace machine learning\n   - The next step, one that is already being\
    \ implemented in organisations around the world, is the evolution of ‘machine\
    \ learning’. This is the predictive company of tomorrow, when data, AI and machine\
    \ learning combine with human team who learn to integrate into their decision-making\
    \ capability.\n\nThese are two profound responsibilities, and they cannot be avoided\
    \ if your organisation hopes to be around for tomorrow.\n\nI was lucky enough\
    \ to see Garry Kasparov talk at South by Southwest (`SXSW`) in 2019. Kasparov\
    \ became the youngest ever undisputed Chess Champion in 1985 at age 22. In 1997\
    \ he became the first world champion to lose a match to a computer, under standard\
    \ time controls, when he lost to the `IBM` supercomputer `Deep Blue`. Garry shared\
    \ what it was like to lose to a machine since then, chess has become a game of\
    \ humans and machines. It is the augmentation of human and machines, not replacement\
    \ of humans. These chess masters had to decide decades ago when to allow the machine\
    \ to make the move and when not; this is now a decision for all leaders.\n\nCEOs\
    \ and boards are already making decisions augmented with machines and data, perhaps\
    \ in the way that `Marc Benioff`, CEO of `Salesforce`, `Jeff Bezos`, founder of\
    \ `Amazon`, and `Satya Nadella`, CEO of `Microsoft`, are doing. Nonetheless, data,\
    \ AI and machine learning are the next levels of being able to delve into, view\
    \ and act on the data your organisation is creating every second of every day\
    \ and, at times, adding other data sets to refine your data. What is new is the\
    \ quantum of information, the potential flow from customer needs from data observed\
    \ to the boardroom and back; it’s like a backbone of data (with spinal fluid)\
    \ when it’s built and integrated correctly.\n\n## Ask questions about the customer\
    \ and keep asking questions\n\nMake sure you learn whatever it is you can learn\
    \ about your customers. To quote `Jack Welch`, whose legacy is clearly complex:\
    \ ‘There’s only two ways to win. Work out what your customer wants and do it faster\
    \ than anyone else.’\n\nTo build a truly customer-centric company you need to\
    \ lead this as a whole-of-organisation challenge.\n\nOrganational design for a\
    \ company with predictive capabilities starts from an appreciation that the data,\
    \ AI and machine learning come from all over the company, and flow from bottom\
    \ to top and back again. This is what `Tesla` has, `Microsoft` has, `John Deere`\
    \ and a growing list of new and older companies have. Complete visibility in real\
    \ time about what customers are buying, how they are using the products or services,\
    \ the rate at which they are using or buying, the applications they’re using and\
    \ how often, how long they’re taking, and so on. This information flows through\
    \ to all parts of the business: to supply chains, warehousing, logistics, the\
    \ sales team, to the product designers, developers, tech teams, call-centre support\
    \ teams, sales and marketing teams, and not to be left out, to the executive and\
    \ the board of directors.\n\n## The ‘need to know’ model of business has changed\
