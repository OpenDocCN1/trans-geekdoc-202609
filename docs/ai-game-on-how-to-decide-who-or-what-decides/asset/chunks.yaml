    of the internet the government made it illegal to price health insurance on a
    risk basis for the individual. This means that if a smoking, beer-guzzling, non-exerciser
    compares their health insurance costs to a teetotalling fitness nut there will
    be almost no difference in price. Australia’s private health insurance system
    is community rated not risk rated by the individual. This ensures all people get
    the same price for a policy no matter their age, gender or health status. This
    policy takes all the data arbitrage out.


    It’s also a good example of where regulation got ahead of the advances in data
    analysis capabilities. Today, you could predict with reasonable accuracy the body
    mass index (BMI) of households based on their location relative to fresh food
    and fast-food restaurants, heat maps of credit card expenditure on gym memberships,
    and thousands of other data points that are available. In Australia’s case, sound,
    timely regulation meant the incentives to price the health risk was removed. Add
    in a DNA sample and you could predict a great deal of health issues for the individual.


    This policy has a positive effect on the health insurers because their best lever
    to increase profits is in helping their customers stay well and keep fit. Innovation
    in this area has flourished with wellness apps, and linkages of these apps to
    health insurance companies. Discovery Limited, a South African-based financial
    services group, is the global master of this, and I share this example story in
    [Chapter 7](#chapter07.xhtml#page_113). Suffice to say here, one of their promotions
    is subsidised Apple Watches, which are then linked (with the customer’s permission)
    to health and wellness apps and vital information. The value of this data exchange
    is shared between the company and the customer.


    It is an example of where the use case for the customer – being healthier – also
    aligns with the company as healthier customers mean fewer claims on their insurance.
    There is real value created and real value attributed to the customer and shared
    with the customer. This value exchange is front and centre of their marketing.


    On 8 February 2023, Microsoft CEO Satya Nadella revealed some of Microsoft’s new
    initiatives around AI integration into their products. He cited this use case:


    A farmer, speaking in Hindi, expresses a pretty complex thought about how he had
    heard about some government program and wants to apply for a subsidy that he thinks
    he’s eligible for. It’s a pretty complex prompt query. But this technology does
    a good job. It goes to the bot that recognises the speech comes back and says
    ‘You know what, you should go to this portal, fill out these forms and you will
    get your subsidy.’ So he says, ‘Look, I’m not going to go into any portal. I’m
    not going to fill out any forms. Can you help me?’ And it does it.


    The Microsoft CEO went on to explain how they built a daisy chain model of trained
    AI that worked out how to find the relevant government websites and then how to
    apply for grants for the farmers. It also used speech recognition to allow those
    with low literacy to solve their needs.


    Boards need to be asking, now that these tools are available, what can their organisations
    create with this new sort of capability? As the democratising of AI tools unfolds
    what will your organisation do? How will it help your customers and meet their
    changing needs?


    For example, traditional travel companies allow you to book airfares and accommodation,
    insurance and more. The customer bears the risk of weather. Yet, an AI-enabled
    travel booking engine could be built to allow the user to book a holiday at a
    budget and time that is, for example, optimised for good weather. It adjusts the
    bookings to the weather of your trip. You book your week of leave and set a budget,
    set some criteria, such as good beaches and restaurants. It scans for deals and
    weather-optimised bookings and rebookings inside of cancellation deadlines for
    your benefit, with some last-minute booking options thrown in. The days of you
    researching holidays could be over. Your bot, with your best interests guiding
    it, could do this. Feed it your favourite photos from your last trip and it could
    find places ‘like that’ for your next trip. When you stop and think about new
    business models using AI they are endless, and we will see many come in the near
    term as AI: Game On becomes fully enabled.


    Are we on the verge of all having personal agents finding truth without bias and
    bringing it home to us? Or are we heading for more AI-enabled misinformation?
    We don’t know, but we will find out. Regulators need to help the former and stop
    the latter.


    The over-collection of data is growing and is rapidly becoming out of control.
    There have been stories in the press recently about how a bread retailer is not
    allowing customers to buy bread without giving the retailer their email. Why?
    To force people into some low-value loyalty system, which is all about the business
    being able to target the customer but has little or no value to the customer.


    A couple of personal examples. I went to lease an investment property and the
    forms stated that I had to give them permission to use my private information
    in the media. Sure, it was on the fourth page of the terms and conditions in font
    size 6. Why? There is no reason, other than if you happened to be Tom Cruise,
    they would want to leverage your profile. Yet, here it was as a standard condition.


    Recently, I was looking to make an investment in a new fund, where I know the
    managers and believe in their capability. So, I filled out the forms, and was
    then asked to provide my passport as part of the Know Your Customer (KYC) protocols
    set up to ‘know me’ and also inhibit money laundering. Its aim is fair enough,
    but the idea of sending a photo of my passport to an email address I have not
    used before was too much for me, so I said no. In fact, I asked them to give me
    directors’ guarantees that in the event they are hacked, and I suffer loss, they
    will cover my losses. Guess what? They would do no such thing.


    A large-scale electrical retailer sent me an email about the urgent recall of
    a product I bought from them saying there was a fire risk and serious damage or
    death could result. I asked them to take the product back, and they then asked
    me for their model number and photos of the compliance plate. It was not a scam,
    but does show their data strategy is a mess, as they clearly don’t know which
    customer has which model of their product. It’s lazy, sloppy and will result in
    litigation. Where is the board? Data is too important to be left with the data
    department.


    Society is going to need a way through this, as Rachel Botsman explores in *Who
    Can You Trust?* The 2022 Optus and Medicare data breaches in Australia show how
    private information of customers (even past customers of up to five years) is
    now vulnerable to criminals who are out to auction the data to other criminals.
    Cyber theft is a global business, and billions of dollars are being spent to mitigate
    the threat, as it should be. A more important question for all businesses must
    be: What information do we actually need to benefit the customer? Does my real
    estate agent need to be able to tell the media about my house? Does the coffee
    shop need to send me special offers I don’t want or a retail outlet an electronic
    receipt so they can add me to their marketing database? Thoughtfulness and empathy
    from leaders has never been needed more than it is today.'
