    ## 监管与监督


    2023 年 11 月，位于英国的布莱切利公园（二战时期著名的破译中心）接待了全球顶尖的技术力量国家。在这次会议上，各国承诺共同应对人工智能可能带来的灾难性危害。超过
    25 个国家参加了会议，试图搁置地缘政治竞争以及关于如何治理机器兴起的竞争理念分歧。美国、欧盟、中国、印度以及其他 25 个主要来自亚洲和海湾的国家参加了会议，就
    AI 相关的关键问题达成共识。


    虽然本章的重点始终是就数据和人工智能采取符合客户最大利益的行动，但一个日益全球化的监管框架正在制定，以保护个人隐私和个人数据所有权。在这方面还有很长的路要走。我们需要希望监管机构和政府能够跟上人工智能和机器学习的快速发展。他们在个人数据所有权方面已经取得了实质性进展，但具体差异取决于你所在的国家。


    作为一家通过人工智能和机器学习获取并利用数据的公司，你将开发出具有巨大价值的知识产权。你的其他高价值资产（如实物资产）组织中会有人非常了解它们、它们在哪里、如何运作以及存在哪些风险。既然数据和人工智能具有如此价值，请确保组织能够对这一类资产回答类似的问题。以下是一些可以着手的问题：


    *   它是如何运作并创造价值的？

    *   它在伦理上是健全的？

    *   客户是否授权了使用其数据，目的是为了什么？

    *   存储这些数据会产生哪些风险？

    *   使用这些数据可能会产生哪些二级或三级后果？


    运行良好的人工智能应该识别为知识产权（IP），并列入你的资产和风险清单，这意味着董事会将意识到其价值以及如何保护它。


    如果你因为缺乏人工智能方面的创新而处于失败边缘，这一事实应该出现在你的风险清单。


    我将用“数据希波克拉斯誓言”结束本章。


    **我们不会对收集的数据造成任何伤害。** **我们不会为了任何让我们要服务的对象的生活变得更加艰难的目的是而使用关于任何人的信息。** **我们将尊重客户的隐私，不允许关于他们的信息以任何方式被用于针对他们。**


    以数据希波克拉斯誓言为基础，现在是时候探索你的组织和行业可能的未来了。接下来的章节将帮助你理解需要做些什么才能达到竞技状态，并成为一个利用数据和人工智能实现业务未来增长或让你的组织更有效、更高效的组织。


    ## 章节要点


    1.  网络安全对企业至关重要，客户的信任是脆弱的，因此公司应该专注于建立和维护信任。

    2.  正如同保险公司可以通过帮助客户保持健康来增加利润一样，人工智能技术可以用于在所有行业创造符合客户最大利益的新业务模式。

    3.  人们对数据收集、使用和共享的预期快速变化，监管机构需要领先于技术发展，并通过立法保护社会免受坏分子的侵侵害。

    4.  公司董事必须认真对待伦理问题。

    5.  人工智能技术通常能比人类做出更好的决策，但人工智能和人类决策中都存在偏见，因此我们在开发和部署新技术时需要保持同理心并谨慎。


    __________


    # 第 4 章


    # 了解你的客户


    “只要愿意思考正在发生的事情，就绝对没有不可避免性。” —— 马歇尔·麦卢汉（Marshall McLuhan），加拿大哲学家


    “我从根本上相信，如果像我们这样的组织或其他组织能够解决客户未来的问题，它们将会成功。如果不能，它们就会倒闭。” —— 迈克尔·戴尔（Michael Dell）


    *看着流媒体电视，还是电视在看我*


    截至 2023 年 9 月，Netflix 拥有 2.47 亿付费订阅者([#fn36])


    ## 驾驭意图和注意力经济


    要在意图和注意力经济中获胜，你需要与客户需求契合、并能够识别新兴需求的数据和 AI 驱动系统。Netflix 没有数据业务，它有客户业务。他们可以从客户数据中辨别意图，并与你互动以获取注意力。Netflix
    的建立在“客户科学”的格言之上，这是一种为了了解你而提供服务的科学形式。Netflix 联合创始人兼执行主席里德·哈斯廷（Reed Hastings）曾表示，希望客户科学能成为他的遗产。一个“AI：游戏开始”组织是围绕生态系统构建的，该系统足够了解每个客户，足以预测他们想要什么、何时想要以及如何想要，从而真正了解他们并服务他们。


    当我写这些时，收到一封办公用品供应商的短信，让我对他们的打印机墨盒交付进行排名。他们寻求反馈是好事。但产品从未送达，他们的系统又太糟糕了，不知道这一点。在他们的网站上，有一系列常见问题解答（FAQs），但没有关于交付未到达该怎么办的内容。然而，我可以看到
    CEO 的演示稿将“以客户为中心”作为首要目标。如果没有一个能够从颗粒度层面看到客户真实情况的数据骨干，这仅仅是一场猜测，而关于成为一家以客户为中心的公司的辞藻只是一个无法实现的承诺。


    他们拿了客户的钱，所以现在这全都是客户的问题。对他们来说很不错，但这将导致大规模的流失。他们的数据系统看到这种关联了吗？它们应该看到且能够看到，但如果一家公司的文化像这家公司这样，他们会被那些正确处理这一点并与真实客户体验保持一致的公司生活吞噬。当我抛弃这个糟糕的服务提供商并将浏览器指向亚马逊时，我为被困在这家澳大利亚注册业务中的员工感到同情，他们尚未学会如何让他们的数据骨干为客户服务。那是董事会和
    CEO 的责任，董事会需要站起来，确保他们的组织在全球具有竞争力，因为我们只需点击一下就能找到让客户少点烦恼的数据驱动公司。


    查尔斯·达尔文的《物种起源》在商业领域同样上演。顶尖企业的生命周期比以往任何时候都短，因为缺乏对客户的关注，导致许多组织在梦游状态中走向了“柯达时代”。


    在 1955 年的财富 500 强公司中，只有 10.2%在 2020 年仍留在榜单上，这意味着 1955 年的 89%公司要么破产，要么与其他公司合并（或被收购），或者它们仍然存在，但已从按总收入排名的财富
    500 强中跌落了一年或以上([#fn37])。


    '
- fmt: '

    A 2016 report recorded that corporations in the S&P 500 Index in 1965 stayed in
    the index for an average of 33 years. By 1990, average tenure in the S&P 500 had
    narrowed to 20 years and is forecast to shrink to 14 years by 2026. At the current
    churn rate, about half of today’s S&P 500 firms will be replaced over the next
    10 years as ‘we enter a period of heightened volatility for leading companies
    across a range of industries, with the next ten years shaping up to be the most
    potentially turbulent in modern history.’


    The annual reports of many large corporations claim their focus is on being customer-centric.
    It’s the right aspiration yet we are all customers and, through that lens, we
    know through our lived experiences every day that it’s very hard for companies
    to read their own labels about being customer-centric from ‘the inside of their
    own bottle’.


    Founders and executives of AI: Game On companies know this, and the story of Airbnb,
    which early on studied, lived as and spent time with customers who were renting
    short-term apartments, is a good example of what it takes. Study the customer’s
    pain point, like where to find the keys, what to do when appliances don’t work,
    where the closest food outlets are, transportation options and the like. This
    enabled them to build one of the most successful ventures of the last decade,
    one built on understanding and meeting the unmet needs of the customer. They have
    detractors of course as there are societal impacts from short-term rental of accommodation
    that need attention too. However, the affinity they have with their customers
    is well known.


    The CEO of a $40 billion retailer told me he sees customer-centric data use as
    a return to the past. I looked at him puzzled, wondering how machine learning
    could be like the past. He went on to explain:


    When the business was founded it was one store, with one proprietor who knew most
    of the customers by name, and what sort of bread they liked, and what cut of meat.
    Today, we have 30 million visits a week, selling 100,000 products in thousands
    of locations, and we can again know each of the customers’ personal preferences,
    and how they change.


    Via the data in their loyalty card this retailer has created a personalisation
    engine that is helpful for their customers. It knows what type of tea they like,
    and if the customer buys a 10-pack or 100-pack of tea bags. The algorithm will
    forecast when the customer will next need tea bags, as it will for all the products
    the customer buys. A personalised digital shopper assistant is created for every
    customer. The results are phenomenal.


    Building this customer-driven AI is a significant, long-term investment and a
    whole-of-organisation approach in terms of thinking, structure, culture, engagement
    and action. But the outcome of this multi-year investment into analytics has been
    valued at well over $1 billion in enterprise value creation. It is a machine learning
    system and as the executives learn more about what is possible, human creativity
    allows the system to be updated to find more ways to help customers. It’s a flywheel
    of customer-centricity. To summarise:


    * Customers get what they want in the location they want it.

    * Customers are rewarded with loyalty points and offers specific to their needs,
    they experience fewer stock outages, and new products are developed for their
    future interests.

    * Wastage of food and other products is reduced, enhancing their ESG metrics.

    * Suppliers are informed about what the end customers want more of and less of.

    * The retailer’s market share increases via increased customer loyalty.


    But this is just the beginning. It’s worth a quick brainstorm to think about the
    possibilities once the underlying data is sorted and the customer permissions
    are in place to use the data to help the customers. For example, you could create
    new segments that are infused with the customer data sets. Next week I am hosting
    a dinner party and want to cook something for a friend who is vegetarian. The
    data can help tell me what to cook. In a de-identified way you can create a shopping
    list of people who shop as vegetarians; the data shares what is a good guide of
    what products are in season and can guide in planning the menu. Add in some generative
    AI, and it can enable a shopping bot to fill the basket in draft for the customer’s
    review.


    No one is as smart as everyone, and the collective intelligence of millions of
    shoppers is now able to be turned into a collective asset for the customers as
    they can tap into the ideation of all other shoppers. For example, you could ask
    the system what meat cuts budget-focused shoppers buy.


    If your organisation is not looking at personalisation for the customer benefit,
    ask why? You can bet your competitors are working on how to take friction out
    of your customers’ lives and enhance personalisation as these are now becoming
    table stakes.


    ## What customer-centric does not look like


    Now that I have that out of the way, let’s talk about others that are floundering
    here, as it’s much more common than the success story above.


    Outsourcing the costs of looking after customers with bots via `OpenAI ChatGPT`
    or others is not an act of customer-centricity, it’s a cost-saving initiative,
    unless the customer sees it as superior, which most don’t. Sure, there is promise
    here with `ChatGPT` capabilities and other large language tools. If you’re not
    sure, ask your customers if engaging with a bot is better than talking to a real
    person who can understand them clearly. If it’s not better, then it’s a cost saving
    at the expense of the customer. That may be okay, or even necessary for corporate
    survival, but don’t pretend it’s not a cost-saving exercise by dressing it up
    as a digital project.


    As a customer you’ve probably experienced numerous fails in customer service with
    humans and with bots. Have you noticed how when you search for, say, ‘What does
    the orange flashing light on the fridge mean’, you find the answer more efficiently
    outside the brand’s website through an external search? If you go to the brand
    website you have to hunt around the tabs, several levels of sub-tabs, multiple
    PDFs, and FAQs that don’t list your issue. Why is it that so many companies don’t
    have a way for customers to search product features/operating instructions easily?
    The question to ask is, ‘Where is the customer in this?’


    How many times do you see `Help` and `FAQ` sections that are not answering your
    needs, and there is no better answer, or way of finding the better answer?


    How many times are we asked questions by call centre operators even though they
    have the data on what you are calling about? You call them, and they ask you for
    your phone number, even though you are on your phone, and they can see the number.
    It gets worse.


    Yet, in these and the millions of other poor customer use cases, often a board
    is being told by management that their business is customer-centric. It’s only
    when you are really outside of your organisation and using the products or services
    that the pain is felt.


    I know many board chairs who make it their business to call the call centre for
    their own personal dealings and use a phone that is not their own to see how customer
    experience really works, or go to their own company’s website when a friend has
    an issue to see if they can resolve the issue by interacting with the bot. It’s
    interesting what you can learn by being a customer of your own company. If you
    haven’t done it I encourage you to have a go at being your own mystery shopper.

    '
