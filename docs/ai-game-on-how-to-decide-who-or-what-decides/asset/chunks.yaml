    \ board members will ask the people running customer experience, marketing and\
    \ sales about their data, as this is where most customer data sits. If you have\
    \ a chief data officer, they are likely to be the first point of contact and,\
    \ if your company is highly attuned to the power of data, your chief risk officer\
    \ will also be a key person to engage. Ericsson, who has built global telecommunications\
    \ networks, has a data enablement officer.^([^(89)](#fn89))\n\n              \
    \  Ask your customers to rank your company’s capability to predict their needs.\
    \ Ask them to compare you to some of your competitors and, more importantly, how\
    \ you compare to the more progressive users of data.\n\n                Benchmarking\
    \ the performance of the company against the leaders in other more customer-centric\
    \ industries could be illuminating. For example, if you are an energy company\
    \ and benchmark yourself against banks, the results might show that you perform\
    \ okay, and that you’re ahead of banks. Now that Apple has banking products, the\
    \ status quo will be challenged. However, I’d suggest you benchmark your company\
    \ against Netflix or Etsy, advanced digital companies. Your new AI-data-driven\
    \ competitor will be thinking about how to create the Netflix of your sector and\
    \ that is when you will feel the full force of data-driven competition.\n\n  \
    \              Fortunately, there’s an increasing cohort of C-suite executives\
    \ who understand the importance of data and AI and are capable of assessing their\
    \ own company’s vulnerabilities and are taking decisive action to try and change\
    \ it. This pool of talent is in very high demand, and we need a larger pool of\
    \ expertise here. Indeed, a key reason for this book is to shed more light on\
    \ this need and develop the necessary expertise.\n\n                ## [2\\. Where\
    \ do you want to be?](#content-toc.xhtml#pz7-5)\n\n                **‘The most\
    \ reliable way to forecast the future is to try to understand the present.’**\
    \ – John Naisbitt\n\n                Denial of change is not a strategy, predicting\
    \ the customers’ needs is. A question I am asked a lot is, ‘If you were in our\
    \ business with what you know about data, what would you suggest we do?’ My response\
    \ is: ‘Try to imagine what the future looks like for your customers. Surround\
    \ yourself with all the customer information that you can possibly get because\
    \ you’re basically looking to find the unmet needs of your customers today and\
    \ tomorrow.’\n\n                What would you do if you could understand every\
    \ possible customer need? There’s a story about Apple’s App Store. When Apple\
    \ was launching the iPhone, Steve Jobs was not keen on the concept of the App\
    \ Store. One of his lieutenants said, ‘We’ve got to have this store, it’s going\
    \ to drive demand for the phones.’ Jobs was not convinced and reiterated that\
    \ he thought the best thing was to just put the phone out as it had the web in\
    \ the browser form. After further discussions he acquiesced and agreed to have\
    \ the App Store.\n\n                If Steve Jobs couldn’t see the power of the\
    \ App Store when he designed the iPhone, you’re not alone if there are opportunities\
    \ and risks you can’t see before you get to a data- and AI-enabled business.\n\
    \n                The typical CFO/CEO/board wants to see a three-to-one payback\
    \ on the first AI-data initiative. The reality is that’s unlikely to happen from\
    \ the get-go. Starting will include the friction of data sorting, enabling, testing,\
    \ and the best business case is unlikely to be your first. I have seen paybacks\
    \ of over forty-to-one from longer-term data initiatives. What other activity\
    \ have you invested in recently that paid back like this? Now that AI can be reprogrammed\
    \ and increasingly rebuilt, the ROI will grow from a baseline that is already\
    \ high.\n\n                I had a memorable meeting with the CEO of a large business\
    \ who said, ‘We don’t need to do all this data stuff as we have revenue growth\
    \ and it’s going well.’ I asked him this question: ‘Do your shareholders know\
    \ that the organisation is reluctant to invest in understanding its customers’\
    \ needs and future needs?’ That is the decision you are making, at the exact time\
    \ that your customers’ expectations are climbing, because they’re only one click\
    \ away from a company that can better serve them with what they want. Just out\
    \ of interest, I looked up the share price of this business as I wrote this; it’s\
    \ down 80% and that same CEO was shown the door in a shareholder revolt a few\
    \ years later.\n\n                ### An ongoing process\n\n                The\
    \ taxi industry was decimated because they thought they understood the customer,\
    \ and that the customer benefit was clear. Then, suddenly, it wasn’t. Uber comes\
    \ in followed by Ola, Didi, Lyft and more. Why did they disrupt the venerable\
    \ taxi industry around the world? Their customer service was better, their customer\
    \ engagement more seamless, they were cheaper (sometimes) and they keep on investing\
    \ in research and development. Of course, I can’t write about Uber without noting\
    \ its various challenges, lack of profitability, and governance disasters. However,\
    \ the point I am making here is that Uber, a company that started in 2009, grew\
    \ to be the world’s most valuable start-up and listed on the NYSE in 2019. It\
    \ continues to invest in using data as its North Star.\n\n                Uber’s\
    \ research and development budget is enormous: $1.5b in 2017, $4.8b in 2018, $2.2b\
    \ in 2019 and $1.9b in 2020.^([^(90)](#fn90))\n\n                ## [3\\. How\
    \ will you get there?](#content-toc.xhtml#pz7-6)\n\n                Just as you\
    \ need to be able to undertake an honest appraisal of where you are now (aka no\
    \ egos, HiPPOs, not-invented-here mindsets), you’ll need to develop clear structures\
    \ and systems that support a dynamic flow of information, insights, discussion\
    \ and decision-making in radically different time frames than you are probably\
    \ now working in. Embrace that you’ll be receiving insights and ideas, and seeing\
    \ opportunities that you hadn’t even thought about.\n\n                Once you\
    \ are truly on the data/AI journey you must be careful of the ‘not-invented-here’\
    \ syndrome as this can easily reduce the capacity of the business to develop,\
    \ implement and scale your data-driven business. Instead, add a little ‘proudly\
    \ invented elsewhere’, a concept that was shared with me by Citibank.\n\n    \
    \            **Develop, buy, borrow or partner**\n\n                At the point\
    \ you decide you have to act and grow as a data-driven business, you need to decide\
    \ whether you develop your own team and algorithms, partner with a specialist\
    \ company, or buy existing solutions. The answer may even be a combination of\
    \ all three.\n\n                If you’re a small business with limited resources,\
    \ before you spend anything, look at what’s available for free. Google has a myriad\
    \ of tools that allow you to see searches in your category. A friend of mine has\
    \ a small organic food start-up and asked for advice. Before I did anything else\
    \ I searched Google Trends for my friend’s food category. Queensland, surprisingly,\
    \ had 100% more searches than NSW does with a larger population. That is free\
    \ data, and helpful in this instance. Add to this, a listing of restaurants that\
    \ sell that type of food and you can get an early view of where the market is\
    \ and where the market is heading. It will export the searches to a spreadsheet,\
    \ and my friend could start working on that immediately. This is real-time customer\
    \ intention for free. It’s all about taking the time to think of the questions\
    \ that will set you up for success:\n\n                1.  What is the total market\
    \ for my product or service today? In five years from now?\n\n               \
    \ 2.  Where is my market, by location?\n\n                3.  What key attributes\
    \ do my customers have? Age, income, lifestyle, other purchasing behaviours, which\
    \ carefully avoid the King Charles and Ozzy Osbourne blunt segment conundrum."
