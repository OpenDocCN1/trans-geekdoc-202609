    # Chapter 2: THE DATA AND AI BUCK STOPS WITH THE BOARD


    > ‘It’s not what we don’t know that gets us in trouble. It’s what we know for
    sure that just ain’t so.’ – Mark Twain


    ## Boards and executives are now responsible for the poor use of data


    BrisConnections was a consortium of three companies (Macquarie Bank, Thiess and
    John Holland) that were awarded the public-private partnership contract for the
    Airport Link, a motorway-grade toll road in the northern suburbs of Brisbane.
    BrisConnections commissioned its engineering partner, Arup, to investigate the
    prospects for an Airport Link tunnel, a 6.7-km toll road that connects the Brisbane
    CBD with the Clem Jones Tunnel and the arterial road leading to Brisbane Airport.


    Within seven months from the opening of the major toll road, in July 2012, BrisConnections
    went into administration causing the loss of billions. The cause? Actual traffic
    turned out to be dramatically below the forecast flow. The prediction of customers’
    intention was a complete failure.


    In the litigation that followed the directors found out that use of data matters
    to the tune of a $2 billion class action that was launched. Under the scrutiny
    of the court process the forecaster conceded the models used to forecast the use
    of the road was ‘utterly absurd’, leaving a multibillion-dollar hole.


    The BrisConnections litigation opened the whole debate about whether data was
    too important to be left to the data department. The answer was clearly yes. It
    wasn’t just the professional firms that were held to account, it was board members.
    The lesson? Boards and management need to get much better at real data diligence,
    and ask questions such as: What data goes into the model? Where did it come from?
    What biases could be in it? What is our comfort score on how accurate this is?
    Can it be independently verified? What other sources of data could add to our
    analysis?


    We are all afflicted by confirmation bias. We want our beliefs confirmed. Information
    that supports confirmation bias can trigger a dopamine release that makes it very
    comforting. Being wrong is dopamine-depleting and all people avoid this feeling,
    even when it is good for them. Advice that is counter to our own opinions is often
    rejected.


    Infrastructure and the use of data have been around us for millennia. Consider
    Dr John Snow. Conventional wisdom during the cholera pandemic in London in 1854
    was that it was an airborne disease, the logic being that the smell of sewerage
    was all over London, as the sewer system was being built and many people were
    dying of this terrible disease. One lone voice, Dr John Snow, said he thought
    the disease was in London’s drinking water. He was ridiculed and then he created
    a map of the deaths. It showed that the closer you lived to one particular water
    pump the more likely it was that you would die. Once the data was plotted and
    visualised, it was understood by humans – and it paved the path to the end of
    that sad chapter in London’s history. Data hunts and kills myths, provided you
    have an open mind to the new data.


    ![Cholera deaths mapped in London in 1854](images/himg-30-1.jpg)


    **Cholera deaths mapped in London in 1854**


    BrisConnections was the first time I can remember an Australian board being sued
    for poor use of data, for not taking reasonable care to assess the data it had
    commissioned. The already long, costly and multi-pronged litigation continued
    through to 2017.


    This failure is a lesson for all directors, executives and professionals for many
    reasons. It makes clear that the predictions you make from the data you use or
    don’t use are auditable. What you did with it can be audited, and also what you
    did not do with it. It shows that, as expectations increase and better data sets
    become available, the idea that a survey survey size can be used to justify huge
    investment decisions is not going to fly. In court you’ll sit in front of a judge,
    and expert witnesses, people like me, will say, ‘You could have predicted demand
    for the Airport Link more precisely if you’d used contemporary data science and
    external data sets and analytics. You can now build an AI-predictive model of
    every car owner and their unique propensity to use that toll road.’ This could
    be done in a privacy-compliant manner with de-identified data sets.


    In today’s world of predictive analytics of real-world data enabling AI, it is
    possible to build a toll road that is targeted at specific societal needs. First,
    identify the problem to be solved. Say it’s to improve the speed and convenience
    of access from the CBD and catchment areas en route to the airport or other destinations
    along the road. Then, look at the proposal through the lens of the customer. Who
    is the customer? Where is the customer? Where are they going? Why are they going?
    What alternative modes of travel do they have? What public transport options could
    be considered? What second-order impacts are there in the local area: noise, pollution,
    endangered species and more?


    Those questions might lead to the commissioning of data on car ownership in the
    area served, common destinations or routes driven, and the population’s financial
    capacity to pay the toll. The linkages with plans for public transport in the
    area and the viable alternatives to using a toll road need to be factored in.

