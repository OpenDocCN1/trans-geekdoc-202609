  raw: "                Increasingly, we will see data-driven balance sheets. Historically,\
    \ the basis for every company’s share price and valuation has been a combination\
    \ of discounted cash flows, internal rates of returns, revenue growth, P/E ratio,\
    \ EBITDA margin, EV/EBITDA ratio and so on. These are all based on models about\
    \ future revenues and costs. Where is the future revenue coming from? Customers!\
    \ If you really understand customers and what they want, you can much better predict\
    \ revenues and therefore valuations. Put it this way, if you are in a company\
    \ that has a forecast, budget and business plan, you are predicting customers’\
    \ spending. Yet for all the care that goes into this, too many companies fail\
    \ to look at the drivers of customer behaviours that make up the forward cash\
    \ flow. This is starting to alter, and it will make customer predictions count\
    \ in the boardroom in new ways.\n\n                **Imagine if your business\
    \ had a more accurate and predictive model of future customer behaviours**\n\n\
    \                There’s a model already being used by some of the world’s leading\
    \ data/AI-driven companies, as well as by shareholders, investors, fund managers\
    \ and financial institutions. It is called customer-based company valuation (CBCV)\
    \ and it’s based on deep data about customers. A recent article in *Harvard Business\
    \ Review (HBR)* cites the IPO of Revolve in the USA, an e-commerce platform that\
    \ caters to millennial and Generation Z consumers by curating luxury apparel,\
    \ footwear and accessory items. The IPO was priced at $1.2 billion and exploded\
    \ on its first day by 89%, giving it a valuation of 4.5 times its previous 12-month\
    \ revenue, ‘more like a tech company than a clothing company’.^([^(77)](#fn77))\n\
    \n                Using data to price assets is emerging – another governance\
    \ issue in waiting. Directors who are signing off on valuations of assets will\
    \ need to understand what data was used and what impact that has on valuations.\n\
    \n                If you haven’t come across CBCV perhaps you have heard of C3\
    \ (customer cohort charts). These charts track revenue by acquisition cohort over\
    \ time and show how total customer spending changes as each cohort ages. Companies\
    \ such as Slack, Lyft, Dropbox, Farfetch, Backblaze and ZooPlus integrate C3 charts\
    \ into their quarterly, half-yearly and yearly reporting packs to better enable\
    \ shareholders and investors to evaluate their future business.^([^(78)](#fn78))\n\
    \n                Data and AI bring a higher degree of precision, accountability\
    \ and diagnostics to value customers in the new loyalty economy. Netflix, Verizon,\
    \ Spotify, Activision, Blizzard (acquired by Microsoft for US$68 billion in October\
    \ 2023),^([^(79)](#fn79))\n\n                As an executive, director or leader\
    \ in your business, the questions you may have are: Where does the ethical use\
    \ of AI bring the most competitive advantage? Is it in products, services, processes,\
    \ decision-making, new business models – or all of the above?\n\n            \
    \    AI has already migrated from simply finding relationships and predicting\
    \ trends. It is now capable of spotting (predicting) future shifts by analysing\
    \ preferences and sentiments using vast quantities of your own data – as well\
    \ as text, voice, images, digital, newsfeeds, social media and global data-banks.\n\
    \n                When talking to John Chambers while he was global chairman of\
    \ Cisco, his view, which I share, is that boardroom dashboards should be focused\
    \ on future events, based on customers’ needs with less time looking in the rear-view,\
    \ and more time predicting what is next best action for the organisation. The\
    \ static historic numbers from last month will soon change to immersive virtual\
    \ walkthroughs of the real-time data – a control room where streaming data is\
    \ alive and where you can hear the calls of the customers, feel the strength of\
    \ the demand and the nuance of the changes in the market.\n\n                The\
    \ boardroom of the future is set to become less of a slideshow and more immersive\
    \ flight deck simulator, with real-time customer-centric information.\n\n    \
    \            ## [Leveraging AI as a business transformation opportunity](#content-toc.xhtml#pz6-42)\n\
    \n                BCG presents one model for large-scale adoption of data and\
    \ AI. It is a methodology based on extensive research across 3,000 respondents\
    \ from 29 industries and 112 countries. Their model focuses on two core themes:\
    \ embedding AI into your business and preparing your operating model for AI across\
    \ three core building blocks: data, processing and action.\n\n               \
    \ BCG’s model provides a four-step approach to unlocking the financial benefits\
    \ of AI, which involves reimagining the way your company works with data and an\
    \ ability to move from pilot to scaling. The model looks like this:\n\n      \
    \          1.  Discover AI – Launch pilots in key areas.  \n\n               \
    \ 2.  Build AI – Embed in overall strategy; reimagine use of data; invest in data\
    \ capability building, technology, and algorithms and in developing technical\
    \ AI skills. \n\n                3.  Scale AI – Broader use cases and solutions.\
    \ Embed AI into processes and solutions on both production and consumption sides.\
    \ \n\n                4.  Organisational learning with AI – Create opportunities\
    \ for mutual learning between humans and AI.^([^(80)](#fn80)) \n\n           \
    \         ## [External data and data ecosystems](#content-toc.xhtml#pz6-43)\n\n\
    \                    Leading AI companies are harnessing the insights of their\
    \ own data as well as that of third-party data companies sourced within ethical\
    \ and data use guard rails. If your first-party data is not available and usable,\
    \ you may need other data sets to help get to the unmet needs of your customers.\
    \ Noting that first-party data should be your first port of call since it’s yours\
    \ and it will typically be unique to your organisation. So, if you can access\
    \ first-party data, you should regard it as an asset, so long as it has been collected\
    \ ethically. An increasing number of companies are building businesses on the\
    \ Internet of Data and Computing (IoDC), commonly referred to as collaborative\
    \ data ecosystems. Woolworths Australia has done this through their partnership\
    \ with Quantium, and now CBA and Telstra have also created ventures with Quantium.\
    \ These allow their own business needs to be built at scale, and also for their\
    \ partners. Amazon Web Services (AWS) offers such an ecosystem as does Teradata,\
    \ Databricks, Alibaba and BaseBit to name just a few, alongside significant data\
    \ ecosystems in the health, education and government services areas.\n\n     \
    \               The benefits of collaborative data ecosystems are significant.\
