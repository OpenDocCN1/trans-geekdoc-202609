    \ pickers `Cathie Wood`, claimed in February 2023, ‘We believe that the hidden\
    \ gems that will benefit the most from artificial intelligence are those companies\
    \ with proprietary datasets.’ They claimed `Tesla` as a good example due to its\
    \ data on roads and driving behaviours. Note, this is not investment advice!\n\
    \nThe `a16z` podcast in January 2023 asked some of the Andreessen Horowitz investment\
    \ partners for their themes on 2023. They said, ‘If a company doesn’t have an\
    \ AI strategy, it should really be thinking about one yesterday.’ The podcast\
    \ made the point that they see lots of 10–100x productivity in organisations’\
    \ back of house with AI. Procurement, finance and other areas, not just on the\
    \ customer side. As AI use becomes table stakes you will need your own strategy\
    \ to harness its power.\n\nTo not ask and act on these sorts of questions is going\
    \ to limit your business as we enter the AI: Game On world.\n\nTake the San Pellegrino\
    \ I am drinking while writing this. Anyone can type it into `Google`, add ‘lowest\
    \ price’ to their search and it will find the best offer as defined by `Google`\
    \ SEO and paid ads. Strategy guru `Michael Porter` said, ‘Business needs to decide\
    \ to be cheap or different’; pain comes from an undifferentiated offering. We\
    \ are now seeing different combined with cheaper. The low price – fast delivery\
    \ offerings of giants such as Amazon are hard to beat, and customers will migrate\
    \ when economic benefits accrue to them, especially from a trusted provider that\
    \ removes friction from the purchase.\n\nWhat does San Pellegrino know about its\
    \ customers? It knows how many bottles in which sizes and flavours are made and\
    \ sold in which regions by which retailers, but what can the company know about\
    \ its customers’ habits, where they drink San Pellegrino, for what purpose outside\
    \ of thirst? Unless they augment their own warehouse data they will not know what\
    \ customers eat when they’re drinking it, how old they are, whether they’re loyal\
    \ or switch with alternative sparkling waters, how price sensitive they are, or\
    \ how much they typically consume each day. Nor what impact a `SodaStream` in\
    \ their kitchen would have on that home’s consumption. Is San Pellegrino mainly\
