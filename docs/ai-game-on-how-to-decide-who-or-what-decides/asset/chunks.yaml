    ‘It is not the strongest of the species that survives, nor the most intelligent;
    it is the one most adaptable to change.’ – Charles Darwin


    In the next chapter we look at the data journey, how to start the journey, the
    culture you need to build, the options available to you depending on where your
    organisation is currently, and more of what’s at the forefront of data and AI
    right now.


    ## CHAPTER TAKEAWAYS


    1. The new evolutionary model of business is data-driven and requires companies
    to adopt AI to interpret and respond to customer signals.

    2. Companies don’t need a data strategy as their entire business strategy must
    be driven by data and enabled with AI to guide all strategic initiatives.

    3. Predicting customer behaviour is critical to remaining competitive and this
    needs to be well understood in the boardroom.

    4. The boardroom of the future should focus more on future events based on customers’
    needs and use tools such as immersive virtual walkthroughs of real-time data.

    5. Data when seen as an ecosystem creates more value. Organisations that use more
    than seven data sources have nearly 14 times the fixed-asset turnover and two
    times the market capitalisation compared to peers who do not use external data
    for decision-making.


    # CHAPTER 8


    # THE DATA AI JOURNEY


    It has been 40-plus years since John Naisbitt, author of *Megatrends*, wrote,
    ‘We are drowning in information but starved for knowledge.’ A lot has changed,
    and the world has polarised into organisations that are strong on using information,
    data and now AI and the others who are still trying to find their way in this
    new operating environment.


    ‘The heaviest weight in the gym is the front door.’ – American boxer Ed Latimore


    ## Data and AI are your business’s heartbeat and circulatory system


    In 2016 Kevin Kelly wrote *The Inevitable: Understanding the 12 Technological
    Forces That Will Shape Our World*. The underpinning concept of his book is that
    at the centre of every significant change in our lives today is a technology of
    some sort.


    ‘Technology is humanity’s accelerant. Because of technology everything we make
    is always in the process of becoming. Every kind of thing is becoming something
    else … Nothing is finished. Nothing is done. Constant flux means more than simply
    things will be different. It means processes are now more important than products.’


    Generative AI tools are a great example of this point, as processes and capabilities
    are now able to create the next iteration. Like the notion of atomic fusion and
    its perpetual energy promise, generative AI is perpetual programming improvement.


    Data has been said to be the ‘new oil’. I disagree with this analogy. Oil as it
    relates to petrol is a ‘use once’ product: refine, use, done, with its externality
    of carbon emissions. Data is much more sustainable with its life cycle being more
    like refine, use, reuse, blend, augment with other data, new use cases remodel,
    refine, and on it goes. Medical researchers are using DNA collected decades ago
    to great effect in drug discovery. Data can be valuable over time and use.


    A report by McKinsey Global Institute estimated ‘liquid’ information that is machine-readable,
    accessible to a broad audience at little or no cost, and capable of being shared
    and distributed could generate an additional $3 trillion in economic activity,
    enabling applications as diverse as self-driving cars, personalised healthcare
    and traceable food supply chains.


    The increased feasibility of sharing data is being accelerated by the proliferation
    of data sources through the Internet of Things (IoT). In addition, there are new
    techniques, protocols and standards for pooling, sharing and exchanging data.
    Knowledge through the exchange of data is part of a new European Union data strategy.
    It is designed to create ‘a single market for data’ to empower people, business
    and organisations to make better decisions based on insights from non-personal
    data in order to compete with the current tech giants.


    However, capturing and adding all this data to existing (legacy) and new business
    systems is also creating confusion about how to find it, use it, manage it, and
    legally, securely and efficiently share it. Where did a certain data set come
    from? Who owns what? Have we legally sourced it? Have we ethically dealt with
    it, and have we protected it? Who’s allowed to see certain things? Where does
    it reside? Can it be shared? Can it be sold? Can people see how it was used? And,
    most importantly, what is its purpose? This last question may seem obvious but
    in many companies I’ve worked with the answer differs depending on who you are
    talking to, at what level, and in which division (silo) they belong.


    As data applications grow and become more ubiquitous, consumers, owners and stewards
    of data are finding that they don’t have a playbook to follow. Consumers want
    to connect to data they trust so they can make the best possible decisions. Owners
    of the data need tools to share their data safely with those who need it. Risk
    registers need to adapt to the reality of our times with cybercrime and ransomware
    widespread.


    The board’s dilemma comes down to one thing: managing risk in a world of VUCA
    – volatility, uncertainty, complexity and ambiguity. Data misuse and cyber hacks
    are already on the risk register of most boards. The lack of data use and not
    being competitive with data and AI need to be added to the risk register too.


    How can you protect the crown jewels of data in the organisation and use it optimally
    at the same time? Lock it up and you get no customer benefit, open it up and you
    get hacked. It is wise to start with an audit of what you have data-wise, why
    you have it, how you obtained it, what has and it be used for.


    This is where you may need outside help. If data is not your core competency,
    get help from experts. Companies that do this work 24/7 are a long way along the
    experience curve.


    ## Data is the product


    Increasingly the data is the product. Fitbits are a relatively simple device;
    it’s the data dashboards for the user that hold much of the value for them, while
    the company that owns Fitbit (Google from 2021) acquires yet more data for its
    businesses and can continuously improve a range of its products and offerings.
    Fitbit has over 120 million devices used by millions of users. Waze (also bought
    by Google in 2013) is yet another example where the data of the customer, while
    driving, is an input into the product. By using Waze I give the company data about
    where I am driving, how the traffic flow is working, or other information, while
    receiving valuable information from them about my ETA, traffic con-gestion, hazards
    and more. It suggests changes to my drive based on information from other users
    so the system gets smarter with more users.


    The ‘give to get’ model of data is upon us across many areas of our life. Just
    consider the apps you use on a daily basis. Many are ‘free’ because the value
    exchange is your information/data, such as those from Facebook, Twitter, `Booking.com`,
    Findr, Strava, Under Armour’s MapMyRun, Everyday Rewards, FlyBuys and more.


    ## The synergy of data and AI and humans

