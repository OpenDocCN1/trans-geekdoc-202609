  trans: "\n今天，人类正在越来越多地做出由机器引导和增强的决策，在此过程中，我们正日益将决策权让给这些机器。想想你普通的一天：对于许多人来说，新闻推送、开车上班或乘坐公共交通工具、天气、电视节目推荐，以及日益增加潜在浪漫伴侣都外包给了\
    \ AI。我们已经频繁地移交了决策权，而且这种趋势正在快速增长。我们在这里的决策可能从好、坏到糟糕不等，提供者的用例和伦理问题将比以往任何时候都重要。这些董事和高管将如何决定由谁或什么来决定，这将影响地球上的每个人。\n\
    \n## 我们如何决定由谁或什么来决定？\n\n2023 年 2 月，《连线》杂志发表了一篇名为《AI 入侵时代比你想象的更近》的文章，副标题是“算法难以理解人类的模糊性”。但这些特性在面对人工智能黑客的威胁时只是一个脆弱的盾牌。\n\
    \n著名的安全技术专家布鲁斯·施奈尔（Bruce Schneier）写道：\n\n> 虽然一个充斥着 AI 黑客的世界仍然是一个科幻问题，但它并不是一个愚蠢的科幻问题。AI\
    \ 的进展正飞速且猛烈地进行，能力的跨越是反复且不连续的。我们认为困难的事情被证明是容易的，而我们认为本该容易的事情却被证明是困难的。\n> 我们需要开始考虑可执行、易理解且符合伦理的解决方案，因为如果我们对\
    \ AI 有任何预期，那就是我们将比预期的更早需要这些解决方案。\n\n施奈尔继续指出，落入错误者之手的 AI 可能会被执行某些非常阴险的任务。他以将 AI\
    \ 对税法以寻找漏洞为例，导致发现了数千个新漏洞。社会还没有准备好应对可能发生的情况。直到目前，黑客行为是由个人完成的——我们正在进入一个由机器完成和创造的时代。\n\
    \n在这段旅程中需要记住的问题有：\n\n* 我们何时将任务委托给机器？\n* 我们何时干预并夺回 100%的人类控制？\n* 当我们决定忽略机器的数据时，我们使用什么数据？你将如何审计导致决策的训练数据？\n\
    * 许多组织现在正在培训员工，让他们意识到任何输入 OpenAI 的内容现在对其他人可用。你有什么计划阻止这种知识产权（IP）的流失吗？\n* 如果肯德基不满的员工将秘密的\
    \ 11 种香草和香料上传到 OpenAI 会怎样？你明白我的意思。\n\n还有更多问题：\n\n* 我们如何治理决策的数据集？\n* 我们为决策或机器带来了什么偏见？\n\
    * 我们如何以及用什么数据评估自己的偏见？\n\n埃里克·施密特（Eric Schmidt）建议，有几个驱动 AI 前沿的关键主题。\n\n1. **会看的机器。**\
    \ 机器比人类看得更好，从 X 光片到自动驾驶汽车，这种计算机视觉正在改变运动员管理。通过人脸识别，经理可以在比赛期间对运动员进行实时分析，以完善训练计划并帮助避免受伤。Mustard（一款棒球应用软件）是目前采用计算机视觉的一个例子。\n\
    2. **深度学习。** 近年来 AI 最著名的例子之一是机器击败了世界顶尖选手 `AlphaGo`。\n3. **预测模型。** AI 在药物研发中的应用帮助了发现过程：“筛选并不新鲜，但直到现在，分子被表示为向量。然而，新的神经网络可以自动学习这些表示。”\n\
    \    * 在麻省理工学院（MIT），计算机科学家和合成生物学家完成了一项非常复杂的实验，使用 1 亿种化合物来确定哪种能产生抗生素的反应：一种名为 `Halicin`\
    \ 的新药物。\n    * 生成式 AI 领域正蓬勃发展，数十亿初创企业正在成立以利用 `OpenAI` 和其他技术。写作、音乐、艺术、商业、科学等都将受到影响。已经有很多平台，包括\
    \ `Jasper`、`Simplified` 和 `ContentBot`。例如，`OpenAI` 的 `DALL-E 2` 根据文本命令创建高分辨率的概念艺术。关于代码，AI\
    \ 正在产生重大影响。2021 年 11 月，`GitHub` 上三分之一的代码是用 `Copilot` 编写的，这是一个几个几个月前才创建的 `GPT-3`\
    \ 工具。\n\n随着深度学习模型规模指数级增长，它们将影响并改变我们所知的科学研究和发现的每一个部分。\n\n当我们走向一个由数据驱动、以越来越快的速度输入\
    \ AI 的未来时，我们需要在治理上真正留心。\n\n作为一个组织，如果你从这样一个假设开始：系统的设计应遵循数据的“希波克拉底誓言”进行优化，即“首先不伤害”，那么你就有了一个良好的起点。\n\
    \n"
- fmt: '

    The cultural norms around the world are very different. Let’s use surveillance
    cameras as an example. In Britain, they’re widely accepted. If you’re on the street,
    you’re on camera. In the United States, there’s partial coverage. Sometimes you
    are on camera; sometimes you’re not. But in Germany, with the collective memory
    of the `Stasi`, the population is violently opposed to such surveillance. These
    three different democracies have made different choices in relation to surveillance
    camera deployment and use through public discussion, protests and voting. What
    level of surveillance would you be prepared to accept for yourself or your children?
    The answers to this and other questions are often deeply complex as they relate
    to the balance between personal responsibility, community responsibility and standards,
    as well as what we are prepared to cede to the state or a global tech platform,
    or both.


    I do not think that computer scientists, tech industry leaders and professionals
    should make these decisions, especially if you read my chapter about the ethics
    around data. Boards, tech industry leaders, professionals and computer scientists
    should engage the wider population and explain more clearly and transparently
    that many of today’s tools, `AI` and other systems give all of us a range of choices.


    In China, a law was introduced in 2019 that banned minors from playing video games
    between 10 pm and 8 am, or from playing more than 90 minutes on a weekday. On
    1 June 2021 every game in the country was required to add a new authentication
    system that checks a player’s Chinese national identity (including their age)
    to help block underage players from going past those limits in the name of preventing
    video game addiction. As a result, `Tencent`, the biggest game company in the
    world, is rolling out facial recognition technology that will likely scan many
    gamers’ faces every single evening, aiming to catch minors breaking a gaming curfew
    and help prevent video game addiction.


    ## [The future is already here]


    We’re seeing this play out in the world of business, government and research where
    there’s a bifurcation of those that use `AI` well, namely the large tech giants
    of the world, and everybody else, who are yet to fully understand it. The challenge
    for companies that lag behind in the `data/AI` race is that once your competitors
    (or even companies that you didn’t perceive as your competitors) have the `data/AI`
    advantage, this advantage keeps accruing to them exponentially, as they can now
    create more `AI` and accelerate even faster. This flywheel effect makes it difficult
    or near impossible for others, perhaps you and your company, to catch up.


    The Canadian philosopher and founding father of media theory Marshall McLuhan
    argued in his seminal work *Understanding Media: The Extensions of Man* that the
    ‘medium is the message’, that the way humans absorb information remoulds who we
    are as individuals and as a society. McLuhan said that the shocking TV footage
    of the JFK assassination was the start of TV news becoming a big deal. Up until
    that moment news was for newspapers. Once you see that terrible moment, you realise
    no newspaper can really cover the news like that. Communication technology changes
    society. `AI` use is similar, in that it is now a medium and a message in one.
    Once you see real personalisation selected for you, real `text-to-image` applications,
    and conversations output in databases and the like, you can’t go back to the old
    world. The change is impossible to reverse.


    The cost to sequence a human genome declined from $3 billion in 2003 to around
    $500 today. The time required to sequence a genome is also plummeting. As costs
    have declined, the number of base pairs per US dollar has soared. By 2025, the
    cost to sequence a genome will drop to less than $100, the equivalent of a pizza.


    ![Source: National Genome Institute (https://www.genome.gov/about-genomics/fact-sheets/Sequencing-Human-cost)](images/himg-151.jpg)


    **Source: National Genome Institute (https://www.genome.gov/about-genomics/fact-sheets/Sequencing-Human-cost)**


    Screening newborns is also a new frontier, as Raymond McCauley, chair of Digital
    Biology, explained back in 2017: As costs continue to fall, it may become standard
    practice to sequence the genomes of newborns. We’ll know what this human being
    is likely to face in the first 72 hours, then the first 6 months, then the first
    3 years.


    This is a road map to the prediction of many health issues for the individual.
    It’s a worthy debate to be had. Do you want to know your chances of getting cancer
    in later life or not? If you did know your risks, would you change lifestyle factors
    to help lower risk? If you knew the risks for your children would you treat them
    differently?


    There is a lot of conjecture about the way `AI` will lower operational costs in
    organisations, via increases in productivity and replacement of some jobs. `AI`
    seems to have deflationary capability and how this plays out will be fascinating.
    As the world’s demographics age, particularly in developed countries where natural
    population growth is declining, `AI` use may well turn out to be a powerful addition
    to GDP growth.


    I’ve written this book to help business leaders (in the broadest sense) think
    about what else could be predicted in their business and market for their customers
    as we are now in the AI era. The market for genetic-testing services is projected
    to be more than $17 billion by 2026. This is a new prediction industry in health.
    What is your current business and what could or must be your future business?
    What data is available in your business right now and outside it to do this?


    ## [AI and its impact on everything]


    ‘Artificial Intelligence is the new electricity.’ – Professor Andrew Ng


    Google CEO Sundar Pichai notes that the impact of `AI` will be even greater than
    that of fire or electricity on our development as a species. So caution is needed
    now.


    When and if a machine can outthink humanity, and out-predict our needs, the world
    becomes a riskier place. Any machine that can think and predict human needs and
    intentions needs to do so in a way that is aligned with humanity’s interests.
    Who has the right to own such a machine?

