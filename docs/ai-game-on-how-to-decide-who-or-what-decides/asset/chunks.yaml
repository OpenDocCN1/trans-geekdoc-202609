- fmt: "\nOthers operate on the dark web and are a jungle of personal information\
    \ gained through cybercrime and other nefarious means. There are some significant\
    \ initiatives and not-for-profit organisations building platforms for data sharing.\n\
    \n`Gaia-X` is one such data-sharing project backed by the European Union and the\
    \ `Gaia-X Association for Data and Cloud`.\n\nIn Australia, the federal government\
    \ is investing in expansion of the consumer data right rules (`CDR`), infrastructure\
    \ and skills to drive standards for emerging technologies such as artificial intelligence,\
    \ quantum computing and 6G mobility. It rightly sees consumer data rights as critical\
    \ to promoting greater mobility and richer service options for users when choosing\
    \ their bank, energy or telecommunication providers.\n\nThe push to expand the\
    \ `CDR` is part of a broader plan to lift data capability with the aim of promoting\
    \ greater data sharing and asset management. For example, `Geoscience Australia`\
    \ has been provided with $40 million to develop a three-dimensional digital atlas\
    \ of Australia’s geography, bringing together public data on people, the economy,\
    \ employment, infrastructure, health, land and the environment into a single national\
    \ data asset. There’s also a $16.5 million pilot program to make government data\
    \ assets more discoverable. This program will develop data inventories for 20%\
    \ of Commonwealth agencies, and shared digital infrastructure and standards for\
    \ a publicly available catalogue of government data assets.\n\nIntergovernmental\
    \ data is a real challenge. The state governments in Australia are responsible\
    \ for state police and all road fatality data is held at a state level. The Australian\
    \ Government is interested in understanding and helping to reduce road accidents\
    \ and would ideally like to link the state data sets to form a national view.\
    \ The nuances in these data sets hold the keys to safer roads. To help reduce\
    \ the terrible burden of road accidents we need to have real attribution data\
    \ as to the real cause of each accident.\n\nThere can be multiple factors in a\
    \ road death. Factors include the condition of the road, the weather at the time\
    \ (was the sun in a driver’s eyes?) the type of car, the driver’s age, and speed,\
    \ fatigue of the driver and so on. These data sets are rich, and if linked and\
    \ reviewed with powerful analytics, their yield will be lives saved and infrastructure\
    \ spending aligned to better safety. Sharing data to save lives should be easy,\
    \ but silos and bureaucracy make this hard for now.\n\nWhen you look at data that\
    \ is captured in a road accident it is rudimentary, and I suspect we miss lead\
    \ and lag indicators. As cars increase in sophistication, they will have more\
    \ data on board, increasingly like a black box flight recorder. Where is this\
    \ data being used for road safety? Some early initiatives exist in the USA, but\
    \ it’s a long way from scaled real insights. If a driver has had their traffic-side\
    \ mirror hit twice, is that a near head-on, a near-fatality miss? It could be,\
    \ but the data is not there to analyse. If a truck on a mine site had a mirror\
    \ clipped that data would, in many cases, be used as a way to understand near-miss\
    \ fatalities. We need to think a lot more as a society about how to use this sort\
    \ of information to help make a safer world. It can be done in a privacy compliant\
    \ way that protects the individual.\n\n## Unintended or unethical data use\n\n\
    There are countless examples of data and machine learning algorithms having been\
    \ misused and abused – either intentionally or unintentionally. In 2022, the Australian\
    \ Government held a parliamentary subcommittee into social media and online safety.\
    \ `Frances Haugen`, a `Facebook` whistle-blower, was invited to give evidence.\
    \ `Haugen` had previously leaked documents and gave damning testimony to a US\
    \ congressional committee. `Haugen` said the company knew the algorithms underpinning\
    \ products on `Facebook` and `Instagram` were sowing misinformation and harming\
    \ children, but that executives had ‘put astronomical profits’ ahead of safety.\
    \ She has urged the Australian parliamentary subcommittee to ‘regulate the heart\
    \ of the business model of the platforms – the algorithms and design features\
    \ that allow disinformation and hate to be spread and for the exploitation of\
    \ personal data.’\n\n1. **Amazon’s AI recruiting tool** – The tool developed for\
    \ hiring by `Amazon` started to bias against female job applicants.\n2. The **Australian\
    \ Government’s** Online Compliance Intervention, commonly known as `Robodebt`,\
    \ was later judged to be an unlawful method of automated debt assessment and recovery\
    \ employed by `Services Australia` as part of its `Centrelink` payment compliance\
    \ program. The scheme aimed to replace the manual system of calculating overpayments\
    \ and issuing debt notices to welfare recipients. The new idea was to use an automated\
    \ data-matching system that compared `Centrelink` records with averaged income\
    \ data from the `Australian Taxation Office`, which was a method found to be unlawful.\
    \ It started in 2016, and it was terminated in 2020, with the Australian Government\
    \ paying $1.2 billion in compensation as a result of a class action.\n3. **Microsoft’s**\
    \ Twitter bot named `Tay`, based on an ML algorithm that was meant to get smarter\
    \ the more users interacted with it, got corrupted within 24 hours from its launch\
    \ with the supply of misogynistic, racist messages from `Twitter`.\n4. **Google’s**\
    \ hate speech detector – `Google`’s AI tool developed to catch hate speeches started\
    \ to behave differently towards Black people.\n\nIn terms of outright misuse and\
    \ abuse of data, consider the following examples:\n\n1. **Cambridge Analytica**.\
    \ In early 2014, `Cambridge Analytica`, a British political consulting firm, signed\
    \ a deal with `Aleksandr Kogan` for a private venture that would capitalise on\
    \ the work of `Michal Kosinski` and his team. `Kogan` created a quiz, thanks to\
    \ an initiative at `Facebook` that allowed third parties to access user data.\
    \ Almost 300,000 users were estimated to have taken that quiz. It later emerged\
    \ that `Cambridge Analytica` then exploited the data it had harvested via the\
    \ quiz to access and build profiles for 87 million `Facebook` users. Some claim\
    \ neither `Facebook` nor `Cambridge Analytica`’s decisions were strictly illegal.\
    \ According to `Julian Wheatland`, COO of `Cambridge Analytica` at the time, the\
    \ company’s biggest mistake was believing that complying with government regulations\
    \ was enough, and thereby ignoring broader questions of data ethics, bias and\
    \ public perception.\n2. In September 2019, **Twitter** admitted to letting advertisers\
    \ access its users’ personal data to improve the targeting of marketing campaigns.\
    \ Cited by the company as an internal error.\n3. In 2020 hackers accessed 5.2\
    \ million **Marriott** guest records including customer contact information, personal\
    \ preferences, birthdays and more. This attack succeeded because the attackers\
    \ compromised employee credentials to access a third-party application. While\
    \ more a case of data theft than abuse, it was two months before anyone realised\
    \ it had occurred, resulting in a significant breach of trust for Marriott. \n\
    \nInterestingly, three of the leading tech players, namely `IBM`, `Google` and\
    \ `Microsoft`, have turned down projects due to ethical concerns. `Google` cloud\
    \ experts agreed not to move forward with the idea of creating AI for financial\
    \ institutions to make decisions for lending money. The project was put on hold\
    \ until the concerns regarding gender and racial biases were resolved. `Microsoft`,\
    \ too, limits the use of its software that mimics voice amid concerns about using\
    \ the technique for creating deep fakes. Similarly, sensing the possibility of\
    \ misuse, `IBM` discontinued its face recognition services altogether.\n"
