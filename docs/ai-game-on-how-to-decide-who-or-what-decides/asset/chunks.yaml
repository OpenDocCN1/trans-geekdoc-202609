    # Chapter 7


    # DATA AT THE HEART OF THE WHOLE COMPANY


    **‘Find products for your customers not customers for your product.’** – Seth
    Godin


    As chair of the NRMA, I have had the privilege to meet the Australian CEOs of
    many of the largest car companies in the world. The automotive industry is a giant
    and is the second largest expenditure most people make in their lifetime. Yet
    outside `Tesla`, real data use and deep embedded customer interaction systems
    are undeveloped. Most traditional car manufacturers are disconnected from the
    end customer via poor data strategy and dealership models that outsource the customer
    relationship.


    I recently asked the CEO of one of the large Japanese automotive firms how they
    predicted demand by car type and location. He said, ‘We don’t really, the factory
    largely allocates us the make, model, features and colours. In reality, a country
    like Australia is at the end of the output to the factory in Japan.’ I was stunned,
    naively thinking it would be a meticulous data-driven process, using analytics
    to predict demand by location to build up to that total forecast. What happens
    is basically a factory 10,000 kilometres away pumps out cars with no real data
    on the true localised demand of the market. Good executives do their best to allocate
    the cars to the dealers, from spreadsheets and/or simple demand forecasting tools
    and dealer requests. It is a long way from the way `Amazon` uses a patented IP
    to predict which of their hundreds of millions of customers will buy each of their
    millions of products.


    In today’s data-rich world there is a way to predict demand by household for new
    cars on a de-identified probability basis. This can be done without personal information
    (`PI`). The location of the existing fleet of all cars is known, databases exist
    of registration, location of dealerships, and the churn of the ownership are all
    knowable and this can be fed into a prediction for purchase.


    A propensity score to buy a new car could be created for every home. The value
    of the home is one proxy for the type of car model. Owners of $20 million harbourfront
    homes may be driving a 15-year-old `Mazda`, but it is mathematically more likely
    that this type of homeowner will own a prestige car. I spoke with a brilliant
    data scientist I know who said he could build a model that basically asks this
    question: How likely is this pod of 10 residential homes to buy, say, a `Toyota
    Corolla`, this year using every available data set on a de-identified basis? Repeat
    for all homes and you’ve created a forecast by location for that brand of car.
    You could run this model against real sales data and improve its performance continually.
    This makes allocation from the factory better, and importantly, allocation by
    location in the country much more relevant. This is how a retail giant like `Walmart`
    would view this challenge to allocate each item they stock, using data, to predict
    demand by location, time, season and time of day. If it’s worth doing for cat
    food, it would be worth doing for cars with a much higher value. If the organisation’s
    culture is not one of data-driven innovation it will end up being challenged by
    a new entrant that will be data-driven.


    Highly predictive models change the cost curve for the industry and allow customers
    to find what they want at the right place.


    We are at the point of a new evolutionary model, in which data has evolved to
    dominate. Capturing signals from the real source and aligning the organisation
    to respond is what we need. Capturing data is one thing; creating an organisation
    that responds effectively is much harder.


    At the time of writing, `Tesla` is opening up some of its charging stations to
    non-Tesla vehicles. The benefit for `Tesla` is more available charging stations.
    Other car companies are largely still disconnected from the end user.


    In his book *Post Corona*, `Scott Galloway` makes the point that: ‘There are two
    fundamental business models; one, a company can sell stuff for more than the cost
    of making it. `Apple` takes $400 worth of circuits and glass and imbues it with
    a promise of status and sex appeal through brilliant advertising, and charges
    me $1200 for an iPhone. Two, a company can give stuff away, or sell it below cost
    and charge other companies for access to its consumers.’


    His points are valid and the trade each of us undertakes with a company for allowing
    the use of our data is complex. In the simplest terms, you need to make sure the
    customer receives real value and you don’t harm them in the process.


    `Galloway` sees the world dividing into those companies that strive to protect
    customer data and make a virtue out of their data strategy, and those where it’s
    ‘data game on’, using all customer data to extract maximum value. The critical
    factor for companies to consider is a combination of the data use case, transparency
    with the customer, and what’s in it for the customer.


    **‘Every company these days is basically in the data business and they’re going
    to need AI to civilise and digest big data and make sense out of it – big data
    without AI is a big headache.’** – `Kevin Kelly`


    More companies are embedding artificial intelligence in their products, services,
    processes and decision-making. AI has now shifted from a ‘nice-to-have’ to a ‘must-have’
    technology, yet `BCG` noted in a recent article that ‘while many companies have
    invested in AI only 11% have realised significant value from these investments.’

