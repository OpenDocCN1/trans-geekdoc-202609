  raw: 'In visiting Microsoft in May 2023, it was interesting to see how they are
    adding the Copilot concept to many of their products. For example, they are developing
    new ways to summarise hundreds of emails and prepare the best responses in draft,
    or the reading of spreadsheets with automated insights. Or, how about summaries
    of Teams meetings with automated allocation of tasks and outcomes prepared for
    the host of the meeting.


    These tools and more will speed up the adoption of AI-enabled tools, and the democratisation
    of these tools, to hundreds of millions of users.


    The frontier of the cloud wars of Azure, Amazon, Google and others is now focused
    on smart AI cloud services. The cloud with the smartest tools will take share
    from the clouds without the tools. This is going to see much faster adoption of
    AI tools in all aspects of human endeavour.


    It is the acceleration of the brave new world now, the world that Kevin Kelly
    describes as one of data flows, cognifying, screening, accessing, sharing and
    filtering.


    An a16z podcast, on 17 February 2023, titled ‘1000x Developer’ contained an interview
    with the CEO of Replit, a company that is focused on using AI to help developers.
    The CEO was talking about a future where there could be 1,000x uplift in productivity
    for developers. He made the point that in approximate numbers, only around 1%
    of people can code. The demand for new code is off the charts, and AI-driven tools
    that nudge the code writers with better and faster options are what Replit aims
    to do.


    I am unsure whether this is good or bad technology, only observing that if your
    technology could get even a 2x uplift with new tools you would want to be exploring
    that. The Replit CEO went on to talk about bounty hunters of new code and creating
    tools like 99 Designs for code creation, enabled with new AI tools.


    ## [What’s your role as an executive or board member in the AI: Game On world?](#content-toc.xhtml#pz5-25)


    It is worth reflecting on some questions at this point.


    1.  What is the role of CEO in a world where the machines are outperforming people,
    repeatedly, in the ability to find and process information?


    2.  What is the role of the board in their fiducial responsibility for such a
    system of machines?


    3.  What are the regulatory issues here and how does the board and society mitigate
    risk in such a world?


    There is probably a book in each of these, and I will certainly explore more and
    share some thoughts in other chapters. The most important actions you can take
    as an executive or board member right now are to:


    1.  **Govern for our time**


    *   Governance is from the Latin word *gubernare* meaning ‘to steer’. The better
    the data, the better the capacity to create insights and actions to control the
    course of the organisation. If you embrace data, AI and machine learning across
    your whole organisation and build your business with an enterprise-wide privacy-compliant
    data spine, you are on your way to the first version of your own AI: Game On business.


    2.  **Understand and embrace machine learning**


    *   The next step, one that is already being implemented in organisations around
    the world, is the evolution of the ‘machine learning machine’. This is the predictive
    company of tomorrow, when data, AI and machine learning combine with a human team
    who learn to integrate machine learning and AI into their decision-making capability.


    These are two profound responsibilities, and they cannot be avoided if your organisation
    hopes to be around for tomorrow.


    I was lucky enough to see Garry Kasparov talk at South by Southwest (SXSW) in
    2019. Kasparov became the youngest ever undisputed World Chess Champion in 1985
    at age 22. In 1997 he became the first world champion to lose a match to a computer,
    under standard time controls, when he lost to the IBM supercomputer Deep Blue.^([^(15)](#fn15))


    Garry shared what it was like to lose to a machine, something not many of us had
    confronted, back in 1997. Garry was in no way worried about it. In fact, he said
    that since then, chess has become a game of humans and machines. It is the augmentation
    of human and machines, not replacement of humans. These chess masters had to decide
    who or what decides decades ago. When do you allow the machine to make the move
    and when do you not is now a decision for all leaders.


    CEOs and boards are already making decisions augmented with machines and data,
    perhaps not in the way that Marc Benioff, CEO of Salesforce, Jeff Bezos, founder
    of Amazon, and Satya Nadella, CEO of Microsoft, are doing. Nonetheless, data,
    AI and machine learning are the next levels of being able to delve into, view
    and act on the data your organisation is creating every second of every day and,
    at times, adding in other data sets to refine your data. What is new is the quantum
    of information, the potential flow from customer needs from data observed to the
    boardroom and back; it’s like a backbone of data (with spinal fluid) when it’s
    built and integrated correctly.


    ## [Ask questions about the customer and keep asking questions](#content-toc.xhtml#pz5-27)


    Make sure you learn whatever it is you can learn about your customers. To quote
    Jack Welch, whose legacy is clearly complex:


    **‘There’s only two ways to win. Work out what your customer wants and do it faster
    than anyone else.’**


    To build a truly customer-centric company you need to lead this as a whole-of-organisation
    challenge.


    Organisational design for a company with predictive capabilities starts from an
    appreciation that the data, AI and machine learning come from all over the company,
    and flow from bottom to top and back again. This is what Tesla has, Microsoft
    has, John Deere and a growing list of new and older companies have. Complete visibility
    in real time about what customers are buying, how they are using the products
    or services, the rate at which they are using or buying, the applications they’re
    using and how often, how long they’re taking, and so on. This information flows
    through to all parts of the business. To supply chains, warehousing, logistics,
    the sales team, to the product designers, developers, tech teams, call-centre
    support teams, sales and marketing teams, and not to be left out, to the executive
    and the board of directors.


    ## [The ‘need to know’ model of business has changed to the ‘need to share’](#content-toc.xhtml#pz5-29)


    The need to share is organisation-wide. The failure to connect the data across
    your business is costing your business now and it will cost it more in the future.
    The world had a tragic example of this failure in the 9/11 attacks in the USA.
    The failure of numerous government agencies, including the CIA, FBI, NSA, FAA
    and others, to connect the data and the dots resulted in a significant change
    in inter-agency sharing of data and intelligence to blend their databases for
    more comprehensive information analysis. The 9/11 Commission Report makes interesting
    reading, not least of all section 13.3 Unity of Effort in Sharing Information.^([^(16)](#fn16))


    Isolating data, AI and machine learning responsibility to one individual, your
    CDO or CIO, who then has to wrestle with the whole organisation, is not a way
    to scale data-driven customer-centricity. Organisational-wide leadership and management
    ownership, with KPIs anchored to the customer experience and return on customer
    experience, are needed.


    Sharing data internally is now fraught with risk that this data can be shared
    externally via nefarious means. The risk of cyber theft cannot become the reason
    you get taken to the cleaners by competitors with better data and better AI-driven
    offerings for your customers. Navigating the cyber risk terrain means looking
    at the upside as well as the downside. If organisations can’t imagine or see the
    upside, then all this talk about data and AI is just sitting on the risk register.'
