    platforms, research and more. If you’re not, you’re going to be outpaced or, more
    plainly, you’re toast.


    We are at the point where a new model of business is evolving. It is one in which
    the ‘data vertebrate’ has evolved to dominate the data invertebrate. Capturing
    signals from the real source of truth, the customer, and having a data spine that
    helps the organisation to interpret and respond to these signals is what the new
    predictive organisations are set up to do. Capturing data is one thing; creating
    an organisation that responds in an ethical way, that aligns with the values of
    society, is much harder.


    This book is not about the tech companies, although there is a lot to be learned
    by understanding them, and *AI: Game On* will show some of what these companies
    are doing with AI and data. *AI: Game On* is for you, and how you can use this
    information for the organisation you are in, or about to join at a board or executive
    level. As you read about the good, the bad and the ugly experiences that companies
    are encountering with data and AI, consider whether you and those around you in
    your company see data and artificial intelligence as material company assets,
    which will ensure your company is around in the next five to 10 years. Then think
    about what stage your company (and you) have reached right now in leveraging your
    data for future growth. Identifying your current position on the data-opportunity
    continuum is the first step to being in the AI game, the first step towards becoming
    a predictive company. The benefits of becoming a predictive organisation cannot
    be overstated.


    I have had a front-row seat in seeing how intellectual property and the data infrastructure
    developed to perpetually understand customers and their behaviours. They are the
    new crucial company assets, the drivers of enterprise value and opportunity.


    Value accrues to those who solve hard problems. Turning your organisation into
    one that is excellent at harvesting data and using data for the customers’ benefit
    is hard, and it explains, in part, why the value here is currently so concentrated
    in the tech giants. Research by McKinsey notes that organisations that leverage
    customer behavioural insights outperform peers by 85% in sales growth and more
    than 25% in gross margin.^([²](#fn2))


    This book is written for those who want to find this new way.


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_


    ![Image](images/himg-16-1.jpg)


    [![Image](images/himg-17-1.jpg)](#content-toc.xhtml#pt01)


    # [Chapter 1](#content-toc.xhtml#pz5-11)


    # [DATA FLOWS HAVE CHANGED BUSINESS AND THE WORLD](#content-toc.xhtml#pz5-11)


    ## [‘Everybody knows that the guy with the best data on their customers’ needs
    will win.’](#content-toc.xhtml#pz5-13)^([³](#fn3))


    The fabric of the global economy and business has changed in the last three decades.
    Labour and capital, while still drivers, are now massively augmented with data
    and IP to create value.


    Data, AI and technology are now combining to dramatically outpace labour and capital
    as the determinates of future economic growth and value. Companies that are enabling
    the full use of this new combination are outperforming those that have not yet
    been able to form a cohesive response to AI. Any organisation that is not becoming
    more data-driven, AI-enabled and customer-centric is borrowing against its future.
    Google CEO Sundar Pichai describes AI as ‘the most profound technology we are
    working on today’ and Microsoft CEO Satya Nadella said, ‘I have not seen something
    like this since I would say 2007–2008 when the cloud was just first coming out.’


    We are at a time of AI: Game On. The financial press is claiming it’s the AI arms
    race.


    If you are not working out what this new arms race will add or subtract to your
    business, look out. It will impact all areas of life, business and society.'
