    我们需要领导力来提供帮助、设定公司愿景、促进共同目标、确保问责制，并投入人才和资源来实现这些目标。从客户的角度来落实各项计划。约翰迪尔（John Deere）利用
    AI 识别杂草并对这些杂草精准喷洒少量除草剂的创新，对客户有利，对地球更有利。这种技术也比普通拖机更难复制，竞争对手必须做出反应，否则将被视为去年的产品。如果你恰好是卖除草剂的，这就是来自你传统竞争范围之外的威胁。


    电信公司充斥着数据。他们知道我们在哪里，每个设备连接到哪个手机基站，我们给谁打电话、何时、通话了多久、给谁发短信、我们在何时何地健身、我们和谁同住、通过手机位置知道我们是谁的朋友，以及我们在特定地点与谁共处。出于隐私考虑，除非法律要求，否则电信公司不会使用这些信息（想想警察、国土安全、反贪败委员会、ASIC、法院等）。


    我的一位在英国的生意同事在国外时，一个来电者（小偷）拨打了他们电信公司的电话，说他们将号码转入（移动）到一个新手机。电信公司照办了，完全没有询问账户密码；他们只是高兴地转入了手机号码。一旦转移完成，主主的手机就停止工作了。他完全不知道发生了什么，于是给电信公司打电话说他的手机坏了。电信公司从未提到他们几分钟前转入过手机号码，但心地建议账单已结清，不应该有问题。呼叫中心与转网部门的系统没有关联，因此他们对这一问题一无所知。电信公司的代表在安慰对方时语气坚定地说：“这应该会自己解决的，我们这里的系统显示一切正常。”情况并非正常。这家电信公司的首席执行官经常在巡回演讲中讲述他们宣扬的
    AI 实力和以客户为中心的信誉，似乎对由于其技术系统落后导致对客户缺乏理解而造成的痛苦和连锁反应一毫无察觉。缺乏良好的数据卫生给客户造成了巨大损害，而银行承受了数亿计的网络犯罪损失。


    在接下来的八分钟内，黑客利用该手机号码申请了银行 App 新密码，并从两家银行盗走了等值 40 万美元的资金（这两家银行都声称拥有高标准的 AI 预测能力）。如果你用手机号码给银行打电话，他们的系统很大程度上认为是你拨打的。如果你用手机打开他们的银行
    App 并重置密码，这些密码会短信发送到你的手机，因为双重验证被视为最佳实践，但在手机号码被转网时这并非如此。一旦你的手机被破解，所有凭据都会转移到小偷手中，游戏就结束了。


    当你停下来思考电信公司拥有的数据时，这整场戏竟然会发生，而且他们竟然忽视了可以帮助客户的数据，简直令人不可思议。


    诈骗者进一步测试了银行，为了稳妥起见，还更改了与一个账户关联的家庭地址，从城市富华地区的高价值豪宅改到了价值低得多的地区，尽管银行对该房屋拥有抵押贷款。理说这会触发潜在的黑客警报。但运气没那么好。我朋友在这家领先银行还有一位私人银行家，他本该立刻发现这种变化是欺诈，但遗憾的是，他们卓越的
    AI 系统在犯罪发生时睡着了。


    我的朋友花了两个月才破解了黑客攻击的过程，又花了两个月才处理好被盗资金的退还！全因为电信公司和银行的数据系统根本不标准，而小偷们知道这一点。与此同时，网络犯罪分子坐着他们在法国南部的巨型游艇扬长而去。


    电信公司和银行的董事会在哪里？这是在助长大规模犯罪，我们再次看到数据是太重要了，不能将其交给数据部门处理。


    澳大利亚一家领先银行的董事曾告诉我，这种犯罪每年让她的银行损失约 5 亿美元。按照这种损失速度，每周接近 1000 万美元，建立保护客户和银行的系统来获得回报似乎是理所当然的。


    信用卡公司在规模化部署和使用全球分析方面要好得多，并已经开发了一些优秀的预测性 AI。例如，如果你在早上 9:06 在一个地区加满一箱汽油，然后在 9:15
    在 50 公里外买一双鞋，他们的系统会自动将其标记为欺诈，因为你不可能在 9 分钟内走那么远。他们的卡片上还有一个标记，指示卡片是否被刷过。这些以及其他复杂的数据分析系统的建立首先是为了保护他们的客户，并额外益处是减少了为欺诈交易客户退款的成本。银行正在努力许多计划以减少此类犯罪，但需要对他们的真实能力和董事会风险分析进行诚实的评估。在过去的几个月，某些银行（有些使用了电信数据）已经采取了有力的纠正措施来打击此类欺诈。这方面仍有大山要爬，而利用
    AI 和数据来打击欺诈将产生巨大的社会效益。


    ## 数据猎杀和消灭假设的力量


    人类有一种倾向，当没有数据来真正理解问题时，他们会发明一种解释。陨星是神灵迹象，月食是奇迹，而不是基于数学的可预测事件。组织在数据空白时也会产生神话。在企业生活中处处需要完成的工作之一（特别是在董事会和执行层级）就是赋予他们的组织和员工去猎杀和消灭假设的能力。


    你的组织对哪些事情可能并非事实？问问你自己和同事，你们组织有哪些尚未被数据检验的神话，这是一个好主意。Ben Ashton 是我的朋友，也是 Quantium
    的前同事，他是一位精明的律师，现在是 CommBank iQ 的 CEO。我们运行了银行数据（以去匿名且符合隐私要求的方式）。Ben 的大部分客户是 55
    岁以上的中等收入人群。Ben 的第一反应是数据不可能是，所以我们重新测试了。结果是正确的。Ben 感到惊讶，但这确实有助于解释为什么他的营销努力没有获得应有的关注，也解释了他那种像在逆风或逆流中推行的感觉。他的外勤怎么可能不知道自己的客户呢？答案很简单。我们大多数人种希望相信客户和我们一样，如果你是一个成功的营销主管、销售人员或产品开发人员，你可能更倾向于认为客户有点像你，或者像你向往成为的人。这是一个无意识偏见的典型例子，我们所有人都有这种偏见。经过仔细使用，真实的客户数据偏见会少得多。


    真实客户的无声声音需要被听到和理解。如果这与你团队的信念相冲突，那是好事。打破神话可能不会让你赢得朋友，但从长远来看对业务有帮助。


