    \ on maths. Organisations have myths too when there is a void of data. One of\
    \ the jobs to be done everywhere in corporate life, especially at the board and\
    \ executive level, is to empower their organisations and employees to hunt and\
    \ kill assumptions.\n\n            What is your organisation sure of that may\
    \ not be true? It is a good idea to ask yourself and colleagues what your own\
    \ organisation’s myths are that are yet to be tested by data.\n\n            Ben\
    \ Ashton, a friend of mine and former colleague at Quantium, is a smart lawyer\
    \ and now CEO of CommBank iQ.^([^(51)](#fn51))\n\n            We then ran the\
    \ bank data (in a de-identified privacy-compliant way). The majority of Ben’s\
    \ customers were 55+, in middle-income areas. Ben’s first reaction was that the\
    \ data couldn’t be right, so we retested it. It was right. Ben was surprised but\
    \ it did help to explain why his marketing efforts weren’t getting the traction\
    \ they should, and it explained his feeling of pushing against a headwind or current.\
    \ How could his field force not know their own customers?\n\n            The answer\
    \ is simple. Most of us want to believe our customers are like us and if you’re\
    \ a successful marketing executive, salesperson or product development person,\
    \ you could well prefer the idea that your customers are a bit like you, or someone\
    \ you aspire to be like. It’s a classic example of unconscious bias and we all\
    \ have it. Real customer data when carefully used can have far less bias.\n\n\
    \            The silent voice of the real customer needs to be heard and understood.\
    \ If that conflicts with what your team believes, that is good. Busting myths\
    \ may not make you friends but it will help the business in the longer term."
