    \ and augmented by machines, and in doing so we are increasingly abdicating our\
    \ decisions to these machines. Think about your average day. Your newsfeed, drive\
    \ to work or commute on public transport, the weather, TV show recommendations,\
    \ and increasingly romantic potential partners are all outsourced to AI for many\
    \ people. We hand off decision-making frequently, already, and it’s growing fast.\
    \ Some of our decision-making here will range from good, bad to ugly, and the\
    \ use case and ethics of the providers will matter like never before. How will\
    \ these boards and executives be deciding who or what decides is going to impact\
    \ every person on the planet.\n\n                ## [How do we decide who or what\
    \ decides?](#content-toc.xhtml#pz7-11)\n\n                A *Wired* article in\
    \ February 2023 titled ‘The Age of AI Hacking Is Closer Than You Think’ was subtitled\
    \ ‘Algorithms struggle to understand human ambiguity’. But such quirks are a flimsy\
    \ shield against the threat of artificially intelligent hackers.\n\n         \
    \       Bruce Schneier, a renowned security technologist, wrote the following:\n\
    \n                While a world filled with AI hackers is still a science-fiction\
    \ problem, it’s not a stupid science-fiction problem. Advances in AI are coming\
    \ fast and furious, and jumps in capability are erratic and discontinuous. Things\
    \ we thought were hard turned out to be easy, and things we think should be easy\
    \ turn out to be hard.\n\n                We need to start thinking about enforceable,\
    \ understandable, and ethical solutions, because if we can expect anything with\
    \ AI, it’s that we’ll need those solutions sooner than we might expect.\n\n  \
    \              Schneier went on to point out AI in the hands of the wrong people\
    \ can be tasked with some very nefarious tasks. He used the example of aiming\
    \ AI at tax laws looking for loopholes, resulting in thousands of new loopholes\
    \ being found. Society is simply not ready for what could be done here. Hackiing\
    \ up until now has been done by individuals – we are entering a time when it can\
    \ be done and created by machines.^([^(94)](#fn94))\n\n                Some questions\
    \ to keep in mind on this journey:\n\n                *   When do we delegate\
    \ to the machine?\n\n                *   When do we step in to take 100% human\
    \ control?\n\n                *   What is the data we use when we decide to ignore\
    \ the data from the machines? How are you going to audit the training data that\
    \ led to the decision?\n\n                *   Many organisations are now educating\
    \ staff to make them aware that anything that goes into OpenAI is now available\
    \ for anyone else. What is your plan to stop this drift of IP?\n\n           \
    \     *   What if a disgruntled employee of KFC put the secret 11 herbs and spices\
    \ up on OpenAI? You get the point.\n\n                There are more questions:\n\
    \n                *   How do we govern the data sets of our decisions?\n\n   \
    \             *   What bias do we bring to the table or the machine?\n\n     \
    \           *   How do we assess our own bias and with what data?\n\n        \
    \        Eric Schmidt suggests there are a few key themes that are driving the\
    \ frontier of AI.\n\n                1.  **Machines that can see.** Machines see\
    \ better than people, from X-rays to driverless cars, and this computer vision\
    \ is changing athlete management. Using facial recognition, managers can use real-time\
    \ analysis of their athletes during games to sharpen training plans and help avoid\
    \ injuries. Mustard, a baseball app, is one current example that employs this\
    \ computer vision, while Liverpool Football Club uses AI-driven data analytics\
    \ and 10 US figure skaters used a system called 4D motion at the 2022 Winter Olympics.^([^(95)](#fn95))\n\
    \n                2.  **Deep learning.** One of the more famous examples of AI\
    \ in recent years was when the machine defeated the world’s best AlphaGo players,\
    \ using some new moves and strategies that had never been used by humans across\
    \ more than 2,500 years of playing the game.\n\n                3.  **Predictive\
    \ computer models.** The use of AI for pharmaceutical drugs has helped changed\
    \ the field, leading to new non-resistant antibiotics: ‘Screening is not new,\
    \ but until now, these models were not sufficiently accurate to transform drug\
    \ discovery. Previously, molecules were represented as vectors reflecting the\
    \ presence or absence of certain chemical groups. However, the new neural networks\
    \ can learn these representations automatically, mapping molecules into continuous\
    \ vectors which are subsequently used to predict their properties.’\n\n      \
    \              *   At MIT, computer scientists and synthetic biologists achieved\
    \ a very complicated experiment, using 100 million different compounds to figure\
    \ out which ones would create a reaction for antibiotic use. Using this technique,\
    \ they came up with a new drug called Halicin. So far, Halicin looks to be the\
    \ next broad-scale antibiotic – the first of its kind in roughly four years.^([^(96)](#fn96))\n\
    \n                    *   The generative AI sector is thriving, with billions\
    \ of ventures forming to capitalise on OpenAI and other technology. Writing, music,\
    \ art, business, science and more are going to be influenced by this type of technology.\
    \ There are already platforms available including Jasper, Simplified and ContentBot\
    \ that offer different versions of generative AI. For example, OpenAI’s DALL-E\
    \ 2 creates high-resolution concept art from text commands, while when it comes\
    \ to coding AI is having a major impact. In November 2021, a third of the code\
    \ on GitHub (a hosting platform for code) was being written with Copilot, a GPT-3\
    \ tool that had been created only five months previously.^([^(97)](#fn97))\n\n\
    \                        With the size of deep learning models increasing exponentially\
    \ they will impact and transform every part of scientific research and discovery\
    \ we know.\n\n                        As we head to a future that will be enabled\
    \ with data, fed into AI at increasing speed, we are going to need real care in\
    \ our governance.\n\n                        As an organisation, if you start\
    \ with the premise that the system should be designed so that it optimises along\
    \ the data Hippocratic oath first, and do no harm, you will be starting in a good\
    \ place.\n\n                        Just because you can does not mean you should.\
    \ As an example, double parking is bad for traffic flow, but it is tolerated in\
    \ small doses for emergencies. We don’t condone speeding, yet we don’t track every\
    \ car and give them an automatic ticket every time they go above the limit. Technically\
    \ that would be easy. If you want to eliminate the vast majority of crime in our\
    \ society, put cameras in every public space with face recognition, link it to\
    \ the electoral roll of the country, as well as all visitors to the country, and\
    \ for every incident you get a facial ID. That is not hard to do, but in Australia\
    \ we don’t want it. But if you really care about crime, to the exclusion of personal\
    \ freedom, it could be done. So, technology, AI and machine learning give us these\
    \ choices and they are not choices that computer scientists should make. These\
    \ are choices for society."
