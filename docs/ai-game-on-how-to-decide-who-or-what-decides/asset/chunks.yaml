    \ frustrated as the team leaders were too sure they had it all covered, claiming\
    \ all this AI use, personalisation optimisation and more. Trouble was no one told\
    \ the customers. A PowerPoint deck claiming you have this covered will not fly.\n\
    \n‘Everybody knows that the guy with the best data on their customers’ needs will\
    \ win.’ These words were said to me in a meeting in 1997 in Seattle at Microsoft\
    \ head office. The executive was trying to work out how to capture the signals\
    \ from millions of customers using his product so he could design a better product\
    \ for them. The internet was still largely dial-up, slow and clunky. Data strategy\
    \ was not something you heard about in 1997 but these words stuck in my mind as\
    \ the beginning of something significant. \n\nImagine trying to learn, in real\
    \ time, what 200 million plus people were doing with your product in 1997. Back\
    \ then it was like saying you were working on time travel. This approach, then\
    \ so unique, has proved to be true and essential for survival. Yet many organisations\
    \ nearly three decades later are still working on how to find their data strategy\
