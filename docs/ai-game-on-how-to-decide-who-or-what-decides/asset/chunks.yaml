    \ harming children, but that executives had ‘put astronomical profits’ ahead of\
    \ safety. She has urged the Australian parliamentary subcommittee to ‘regulate\
    \ the heart of the business model of the platforms – the algorithms and design\
    \ features that allow disinformation and hate to be spread and for the exploitation\
    \ of personal data.’^([^(25)](#fn25))\n\n    1.  **Amazon’s AI recruiting tool**\
    \ – The tool developed for hiring by Amazon started to bias against female job\
    \ applicants.^([^(26)](#fn26))\n\n    2.  The **Australian Government’s** Online\
    \ Compliance Intervention, commonly known as Robodebt, was later judged to be\
    \ an unlawful method of automated debt assessment and recovery employed by Services\
    \ Australia as part of its Centrelink payment compliance program. The scheme aimed\
    \ to replace the manual system of calculating overpayments and issuing debt notices\
    \ to welfare recipients. The new idea was to use an automated data-matching system\
    \ that compared Centrelink records with averaged income data from the Australian\
    \ Taxation Office, which was a method found to be unlawful. It started in 2016,\
    \ and it was terminated in 2020, with the Australian Government paying $1.2 billion\
    \ in compensation as a result of a class action.^([^(27)](#fn27))\n\n    3.  **Microsoft’s**\
    \ Twitter bot named Tay, based on an ML algorithm that was meant to get smarter\
    \ the more users interacted with it, got corrupted within 24 hours from its launch\
    \ with the supply of misogynistic, racist messages from Twitter.^([^(28)](#fn28))\n\
    \n    4.  **Google’s** hate speech detector – Google’s AI tool developed to catch\
    \ hate speeches started to behave differently towards Black people.^([^(29)](#fn29))\n\
    \n        In terms of outright misuse and abuse of data, consider the following\
    \ examples:\n\n        1.  **Cambridge Analytica**. In early 2014, Cambridge Analytica,\
    \ a British political consulting firm, signed a deal with Aleksandr Kogan for\
    \ a private venture that would capitalise on the work of Michal Kosinski and his\
    \ team. Kogan created a quiz, thanks to an initiative at Facebook that allowed\
    \ third parties to access user data. Almost 300,000 users were estimated to have\
    \ taken that quiz. It later emerged that Cambridge Analytica then exploited the\
    \ data it had harvested via the quiz to access and build profiles for 87 million\
    \ Facebook users. Some claim neither Facebook nor Cambridge Analytica’s decisions\
    \ were strictly illegal. According to Julian Wheatland, COO of Cambridge Analytica\
    \ at the time, the company’s biggest mistake was believing that complying with\
    \ government regulations was enough, and thereby ignoring broader questions of\
    \ data ethics, bias and public perception.^([^(30)](#fn30))\n\n        2.  In\
    \ September 2019, **Twitter** admitted to letting advertisers access its users’\
    \ personal data to improve the targeting of marketing campaigns. Cited by the\
    \ company as an internal error,^([^(31)](#fn31))\n\n        3.  In 2020 hackers\
    \ accessed 5.2 million **Marriott** guest records including customer contact information,\
    \ personal preferences, birthdays and more. This attack succeeded because the\
    \ attackers compromised employee credentials to access a third-party application.\
    \ While more a case of data theft than abuse, it was two months before anyone\
    \ realised it had occurred, resulting in a significant breach of trust for Marriott.\n\
    \n        Interestingly, three of the leading tech players, namely IBM, Google\
    \ and Microsoft, have turned down projects due to ethical concerns. Google cloud\
    \ experts agreed not to move forward with the idea of creating AI for financial\
    \ institutions to make decisions for lending money. The project was put on hold\
    \ until the concerns regarding gender and racial biases were resolved. Microsoft,\
    \ too, limits the use of its software that mimics voice amid concerns about using\
    \ the technique for creating deep fakes. Similarly, sensing the possibility of\
    \ misuse, IBM discontinued its face recognition services altogether."
