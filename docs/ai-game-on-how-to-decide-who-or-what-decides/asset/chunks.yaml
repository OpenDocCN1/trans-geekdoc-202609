  trans: '

    我们之所以陷入这种境地，是因为企业关注的是他们想如何使用数据，而不是符合客户的最佳利益。结果是什么？是出现了大规模的集体诉讼，这可能会以一种奇怪的方式，有望迫使董事会和高管层更加关注他们的数据和人工智能。简而言之，如果一个组织收集数据，它最好有一个充分的理由这样做，一个对客户好的用例，以及卓越的数据保护。


    ## 关键是用例，笨蛋


    执行官和经理需要学会更好地提问：在用例中，客户所在在哪里？为什么这对他们有好处？我们如何保护他们，免受我们使用数据所产生的糟糕的一级、二级或三级后果？我们如何控制数据并防止其泄露到野外？如果你的专有数据在
    OpenAI 的世界中泄露，那么你的优势现在变成了每个人的优势。


    为了强调这里的一些问题，请考虑一下 OpenAI 以及正在使用的大语言模型（`LLMs`）。关于 OpenAI 的一些有用指标来自 2023 年 1 月 24
    日《澳大利亚财经评论》的引用，内容如下：


    随着每一代新 `LLMs` 的出现，参数数量一直在爆炸式增长，从 `GPT` 的 1.17 亿到 `BERT` 的 3.4 亿。作为 OpenAI 构建 `ChatGPT`
    的基础 `LLM`，`GPT-3` 拥有 1750 亿参数。谷歌的 `GLaM`（通用语言模型）拥有 1.2 万亿。


    结果：机器吸收了整个互联网的数据，权衡了事物之间的关系，并能够生成看起来是新且原创的内容。


    文章随后解释了拥有数十亿、并正向万亿级参数的 `LLMs` 仍然可以产生 AI 研究员埃米莉·班德尔（Emily Bender）描述为“随机鹦鹉”的效果。它们看起来很智能，但并不理解它们正在创造的词汇。人类在寻找意义，而目前模型在寻找模式。


    ### 机器可能已经比你更了解你，至少是了解你的消费习惯


    如果你问大多数人上个月在订阅服务上花费了多少钱，许多人会极大地低估他们支付给流媒体公司和其他机构的经常费用。或者问你的朋友最喜欢什么菜系，然后让他们查看自己的银行账单，看看过去三个月他们买最多的是什么菜系。通常，我们对真实行为的回忆可能是错误的。这是我们大脑中的一种偏见，而不是银行账单的现实。它也表明在许多情况下，银行比我们自己更了解我们。银行能利用他们拥有的数据能为客户做什么？


    想象一下，如果你去一个新城镇，走进一家餐厅，看到像你这样经常在那家餐厅吃饭的人经常点什么。


    这可能会揭示出店里最棒的食物，而不是某些随机人在充满垃圾信息和私利的网站上所陈的内容。忠诚度通常是客户满意度的衡量标准，如果银行建立了帮助和理解客户的系统，就可以在大范围内清晰看到忠诚度。


    几年前在 Quantium，他们为 `UBank` 开发了一个名为 `People Like You` 的应用程序。它使用了去标识化的银行数据，你可以在这个数据集中找到一些高度预测性的信息。我看了我邮政区和我年龄、收入相似的人的披萨店。令我惊讶的是他们都去了那家隐藏在主街旁的小披萨店，我也喜欢那里。我以为自己很特别！谷歌搜索没有发现这家餐厅，因为这个低调的地方没有投入
    `SEO` 或 `AdWords` 资金。银行数据发现了谷歌无法看到的东西——我们之行定义我们之是。


    银行几代以来一直使用相同的信用模型，即使有了新的了解客户（`KYC`）法律，银行仍然要求借款人费力回答大量他们已经知道答案的问题。你在食物上花了多少钱？你说家里每周
    200 美元。他们知道是 230 美元，但没有使用他们自己的——你自己的数据。某些银行正在发生变化，但通常被认为太难了，而且系统很旧；他们受到惯性影响，并将辛苦工作推给客户，并使用声称的行为而非真实的行为。`Netflix`
    知道我不看后现代主义艺术纪录片。在调查或焦点小组中询问人们，你会听到许多关于良好意图或道德表现的噪音，而不是真实的客户信号。


    这里是我在与组织讨论数据护栏时经常使用的一个测试：


    1. 它们合法吗？

    2. 它们符合伦理吗？

    3. 是否有人因为这个用例而损失？

    4. 对你正在使用数据的人有帮助吗？

    5. 客户同意这些数据对他们有帮助吗？

    6. 如果你所有的用例都在公共领域，这还是一个“故事”吗？


    如果调查记者发现了这个数据用例，这个计划的任何部分会让你、你的利益相关者或社会感到困扰吗？如果正在计划的内容需要避开公众审查甚至是内部审查，就不要做。用例应该是你的北极星。


    让我向你陈述一些情景，并问问你自己你感觉有多么舒服。请注意，这些显然是个人选择，会有不同的观点：


    *   你被问及你的去标识健康数据是否可以用于发现预防/治疗癌症的新方法。（听起来不错，只要我想取回数据时可以取回它，且完全没有 `PI`（个人数据被识别或获取）的风险。如果通过数据取得了突破并获得巨额财务收益，是否会与提供数据的人分成利润？）

    *   你的汽车刹车数据被用于帮助设计更好的刹车。（好，只要它不会被用于在保险理赔中针对我，或警方案件。）

    *   你的电影流媒体偏好被用于发现更多你想看的内容。（好，谢谢，只要其他人看不到我的观看偏好。）

    *   你的购物数据被用于帮助零售商为你和其他人备货。（好，只要它没有被转卖给保险，或其他可能损害我利益的其他用户。）

    *   健康数据被保险公司用于告知他们你的健康风险，以便他们增加保费。（不好。简单拒绝。）

    *   在线零售商利用你的数据显示你对高端葡萄酒有偏好，而他们对某些相同葡萄酒表现出更高价格敏感性的客户提供折扣，实际上让你处于全价付费的受割。（对客户数据的糟糕使用，因为它将其利益置于客户之上。）

    *   政府或平台使用/出售你的社交媒体数据来预测你将投票给谁，并针对你发送信息说服你投票。（我们讨厌这种，但它确实被使用了，而且政治双方都使用社交媒体来预测投票意向。最终取决于用例、数据的透明度以及谁从数据使用中受益。）


    个人对提供给各种组织的数据有着日益增长且合理的关注。简而言之，确实需要真正的价值交换来保持平衡。


    需要对数据如何被使用提供透明的通知。以糟糕的方式使用数据让客户感到不是一种可持续的策略。例如，分享我们家庭使用流媒体服务的数据，为流媒体公司提供了关于下一步制作哪些节目、修改哪些内容以及在哪里投放类似节目广告的真实见解。用户（我们家庭）至少得到了很棒的推荐，你可以认为他们还将获得可能喜欢的新内容。所以，存在某种互惠价值。

    '
- fmt: '

    However, when our data is used to create large-scale value in second-order use
    cases the matter becomes more complex. If the use of our search data shows market
    trends that enable real estate developments to outperform, where is the share
    in the upside? Should this be part of the value exchange if an entrepreneur has
    the courage to put investment at risk on that data?


    By contrast, if the data is widely available then is this just market data, like
    `Census` or other data sets, and not using the data becomes a business risk. If
    the data is not available widely, such as viewing habit data of streaming, and
    if the use case is not transparent to those whose data is shared that is another
    matter.


    Not all insights from search or other data lead to gold-plated business outcomes.
    There are examples of data-driven economic loss. The risk and reward balance needs
    consideration. If companies use precious customer data and do not give back value
    they will soon find new competitors that use customer data for better use cases
    for the customer. They will also see new business models where data privacy is
    part of the differentiation of products and services. `Apple` sees `iPhone` data
    privacy as a strong way to differentiate from other phones. Transparency and a
    data Hippocratic oath are key to staying on the right side of the data value exchange.


    As data can be stored forever, a question that should be asked is: If we store
    this data for this one purpose, then reuse it for another, who will authorise
    that use, and ensure the above scenarios are answered, and that the data Hippocratic
    oath can be kept?


    ## Data collection, use, sharing and policy


    Walid Khiari, an investment banker in Palo Alto, explained to me at breakfast
    one morning, ‘The old world was policy driving adoption. The new world is adoption
    driving policy.’


    `Uber` anyone? Over 2 million Australians had downloaded the `Uber` app and were
    actively using the service before governments had meaningful discussion about
    its impact on taxi license plates, which they had sold to taxi owners. Adoption
    is now the driver of policy in many places, illustrating how regulators are too
    often late to the party or rather society’s needs. The party may be being held
    by large tech companies that are extracting massive value out of new ways of engaging
    people. The consequences of misinformation, too much screen time and second-order
    impacts are pushed on to society.


    Adoption driving policy is not a healthy position for society to be in, and we
    need regulators to step up and get into the fast lane of tech developments. The
    best time to legislate for how the next generation of AI/data/tech companies use
    data is before it starts, not when billions of people are using it daily.


    When social media began, were any regulators ready for this new world? Which government
    departments were thinking about the trillions of data points that would flow,
    and the predictive and addictive attributes that would be available to the owners?


    Now with tools like `OpenAI` and its `ChatGPT` outputs and more, there are increasing
    levels of concern around copyright and other areas where the laws lag well behind
    the adoption cycle. If you are a writer or content creator what are the chances
    your work is in `OpenAI`? Odds are your content is now in the vast content soup
    that can be trawled and used. `Amazon` has many new book titles for sale written
    by `AI`; much of this has been derived from the `AI` looking at existing authors’
    work. *I Forced a Bot to Write This Book* is one such title.


    The current debate about whether we should pause `AI` development is a rational
    debate to be had. What it seems to miss is the use case imperative. If the use
    case is to help humanity, would we want to pause it? Or if the use case to create
    division, hatred and misinformation or other bad use cases perhaps we should pause.
    If `AI` can help identify moles that are pre-cancerous, for example, that is very
    different to use cases that lead to teen depression.


    Regulators are a long way back in the thinking here and we need more regulators
    at the `AI` planning table.


    The right to be forgotten is now law in several countries. It was only needed
    once computers could remember everything. Now we have `AI` that can detect human
    emotions, and the use of this emotional observation is open to misuse. There is
    currently no policy response to many of these `AI` advances. Developing the use
    case is key.


    Mira Murati, CTO at `OpenAI`, the company that developed `ChatGPT`, recently expressed
    her concerns about the chatbot and said that `AI` can be misused. ‘[AI] can be
    misused, or it can be used by bad actors. So, then there are questions about how
    you govern the use of this technology globally. How do you govern the use of `AI`
    in a way that’s aligned with human values?’ she asked in an interview with *Time*
    magazine. Murati added that `AI` should be regulated by the governments.


    In a Sam Harris podcast, titled ‘The Trouble with AI,’ he talks to Gary Marcus,
    bestselling author of *Rebooting AI* and founder of `Geometric Intelligence`,
    and Stuart Russell, Professor of Computer Science at Berkeley and Director of
    the Center of Human-Compatible AI. It’s a two-hour podcast and a fascinating conversation
    about `AI` challenges and where we’re at in terms of artificial general intelligence
    (AGI).


    Some key takeaways from this are:


    1. Testing what happens with `AI` on millions or billions of people is not ethical.
    We would not allow this in food or pharmaceuticals. There are regulations that
    are enforceable and risk mitigation measures in place. Yet we allow tech companies
    to do R&D in the wild with little more than reputational consequences at present.

    2. Cessation of research is very hard to enforce and apply. But it has happened
    – genetic engineers were gung-ho about improving the human gene pool 50 years
    ago, yet by the mid-1970s they had pulled back. As of now there are no human clones.
    I make the point again, it’s about the use case, as using DNA to modify cancer
    cells is happening and is not seen as a threat like creating a clone army.

    3. Views on the timeline to any real `AGI` are different. It’s clearly impossible
    to know when and if materialises. Various experts do think it will be here in
    some form and make the point that so far the rollout of `AI` has not gone smoothly
    and lack of thoughtful regulations is not a good sign for what may await in `AGI`.


    I wonder how many regulators attend South by Southwest (SXSW) to watch the birth
    of new industries, or subscribe to Crunchbase to follow where the early capital
    is being allocated and what is waiting downstream from these deals for society.
    It is time to demand more from the entrepreneurs running these businesses to ensure
    their businesses align with humanity’s interest, and to call for more from the
    regulators who will need to stay in front to protect society from bad actors and
    unintended consequences.


    There are rapidly shifting expectations about how data can be collected, used
    and shared, both from the individuals whose data it is and the companies that
    are amassing and using it to deliver services to the customer. As customers become
    more knowledgeable about the value of their data, the onus is on organisations
    to ensure it is fit for purpose and that purpose can’t be solely profit above
    the customers’ interests or those of society.


    Large ecosystems of shared data have formed into massive data lakes and increasingly
    gigantic oceans.


    Some are of the highest standards, where real thought has gone into making the
    data de-identified, privacy compliant, and encrypted to the highest standards
    attaining ISO ratings and other metrics to show compliance with GDPR standards
    and more.

    '
