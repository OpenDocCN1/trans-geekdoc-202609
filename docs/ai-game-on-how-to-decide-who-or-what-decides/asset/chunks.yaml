    6. 投入外部机构，如澳大利亚的 `St James Ethics Centre` 和 `Australian National Data Service`，或其他国家类似的备受尊敬的机构。


    ## 使用 AI 或不使用 AI 进行决策


    决策和人类偏见无处不在。在《Subliminal》一书中，`Leonard Mlodinow` 引用了一些研究，这些研究显示，目击过银行抢劫等严重犯罪的人被送往认领环节，有时甚至在犯罪发生后
    24 小时内。即使在经过强烈的视觉接触后，他们识别嫌疑人的失败率也在 30% 到 50% 之间。很多时候，人们实际上选了被安排在认领现场的警察。人类回忆信息的能力，即使在一个投入了其
    100% 认知关注的高度聚焦事件中也是很低的。你可以认为，相比武装抢劫的视频录像比目击犯罪者的回忆具有更可靠的数据。


    当你询问购物者他们为什么购买你品牌的洗衣粉时，他们的认知过程并不一定处于活跃状态，因此获得事实答案的概率很低。然而，正如我们所看到的，这些购物者调查被认为是强有力的信号。在
    `Chapter 2` 中，我们涵盖了 `Coca-Cola` 根据小型焦点小组改变其配方，这决定了产品发布的成功或失败。在 `AI: Game On` 的世界里，你可以将样本量从
    `N = 100` 扩大到 `N = all`。这对于理解客户的能力并不是小小的改变。2011 年有一项针对法官的研究——他们都是受过高等教育和培训的人员——他们针对非常简单的法律做出了截然不同的决定。该研究调查了
    `以色列法官` 在刑事案件假释听证会中的司法裁决。该篇经过同行评审论文的共同作者之一 `Jonathan Levav` 发现，法官在一天开始以及法庭程序预定休息（如午餐）后给出的判决更为宽大。该研究查看了
    8 名法官在 2009 年做出的 1000 多项裁决。他们发现，有利裁决的概率在一天开始时达到峰值，随着时间的推移从约 65% 的概率稳定下降到接近零，然后在用餐或吃零食休息后再次飙升到约
    65%。


    `Levav` 进一步指出，从批准假释转为“默认”拒绝结果的确切原因尚清楚，但论文推测，休息可能通过提供“休息、改善情绪或提高体内的葡萄糖水平”来补充心理资源。


    我们毕竟是人类，这正是问题所在。


    人类的设计并不是为了高风险、高频率的决策而设计的。我们很快就会判断机器的决策是有缺陷的，仅仅因为我们可以测量输入并观察错误。观察人类错误并不容易，因为我们倾向于将信息回溯，以解释我们为什么做出那项决策。如果同一个法官可以根据自己吃上一顿饭的时间短而根据感觉做出不同的决定，那么人类决策方面就存在问题，这需要与当今机器所做的决策进行反思，更不用说未来的机器了。


    ## 我们应该问哪些问题？


    人类的设计并不是为了高风险、高频率的决策而设计的。我们很快就会判断机器的决策是有缺陷的，仅仅因为我们可以测量输入并观察错误。观察人类错误并不容易，因为我们倾向于将信息回溯，以解释我们为什么做出那项决策。如果同一个法官可以根据自己吃上一顿饭的时间短而根据感觉做出不同的决定，那么人类决策方面就存在问题，这需要与当今机器所做的决策进行反思，更不用说未来的机器了。


    ## 在业务中寻找“答案”


    我们生活在一个世界里，如果答案存在，你只需点击一下就能找到它，因此对任何问题的答案都不再难找了。


