  trans: '


    深思熟虑的数据科学家声称他们已经发现了 AI 自学习和自提问的方法，就像人类一样，从已获得的知识中提出新问题。一组研究人员发表了名为《大语言模型可以自我提升
    Large Language Models Can Self-Improve）的论文，构建了一个可以提出一系列问题、为这些问题生成详细答案、过滤其自己的答案以获得最高质量的输出，然后在这些筛选出的答案上进行自我微调的
    LLM。


    在写作此时，已有关于 AI 事实核查的说法，也有证据表明 AI 中存在许多“事实”并非真实。它正在演变，我唯一能确定的是，这可能是我们见过的最慢的 AI 发展速度。我们最终可能会订阅
    AI 真相验证检测应用。


    随着我们数据即服务（DaaS）的支持，自动驾驶汽车是公司未来需要的新类型决策的良好类比。自动驾驶汽车需要了解与董事和执行官所需的许多高层视角：


    *   我的确切位置在哪里？

    *   我周围发生了什么（其他车辆、行人、道路施工、交通灯、环岛、汇合车道、转向车道、天气）？

    *   接下来将或可能发生什么（红灯、绿灯、箭头灯、道路上的随机行人、车辆超车、遵守让行标志的车辆）？

    *   我现在应该做什么（什么都不做，做点什么）？什么干预是下一步？


    ![Image](img/himg-105-1.jpg)


    理论上，驱动汽车决策的 AI 比人类更不容易分散，而且随着新车电脑输入的数据量不断增加，它们只会变得更好。


    当然，我们需要确保任何自动驾驶汽车都是安全的。我们对自动驾驶汽车的安全性表示担忧，我们也应该对许多糟糕的人类驾驶员表示担忧。


    下面的照片显示了自动驾驶汽车计算机系统看到的内容以及这与人类视觉的对比。我发现非常迷人的是自动驾驶汽车的认知层正在进行数十亿预测，人类驾驶员也是如此。骑自行车的人突然进入我的车道吗？这名骑车者与我见过的其他人相比如何？右侧树后会有什么？人类驾驶员可以根据他们个人的知识进行基准比较，而机器可以根据近乎无限的先例进行基准比较。前面的坑会被后面的自动驾驶汽车感知；而人类只有在撞上它时才会第一次注意到。


    ![Image](img/himg-106-1.jpg)


    ## 决策中的偏见


    所有的决策都带有偏见。我们每个人都根据自己的生活经验拥有自己的“现实”。如果你在小时候被查理王查尔斯梗格犬（Cavalier King Charles）咬过，这可能会让你以一种特别偏见的眼光看待所有查理梗格犬，可能还有所有看起来像这种品种的狗。这是一个有限的数据集（仅为
    1），它构成了最强大的参考。如果没有更多的数据，例如知道查理王查尔斯梗格犬咬的孩子是否比其他狗多，以及这是否真实（事实并非如此），那么个人偏见仅仅是个人偏见，基于个人且高度情绪化的小型数据集。消除偏见的困难之处在于开放数据以验证其是否真实，或者是否是我预先存在的信念是错误的，而不是基于我那单一样本之外的任何东西。


    下次当你与人发生分歧时，尝试这样做，并问：“可以提供什么证据来让你改变主意？”如果那个人说没有什么能让他们改变主意，那么你现在知道你进入了一场缺乏事实的意识形态辩论。


    沃伦·巴菲特据称在会议上经常问以下问题：“你曾经确定的某件事，你现在改变了主意是什么？”换句话说，你以前在哪些方面错了？所以，对你和你的同事、直属下属、你们的
    CEO/董事会的问题是：“我们在哪些方面错了？我们集体在哪些方面都错了？我们拥有哪些需要破除的神话？”


    遵循数据需要心态的转变、开放的态度和好奇心，以及更广泛的组织学习。对于每个人来说，问题应该是：可以获取什么样的数据，能让你对你所假设为真的的事实停下来并反思？


    在《预兆（The Premonition）》中，迈克尔·刘易斯讨论了健康行业中的偏见，特别提到了全球疫情。“通过算法和 AI 产生的数据偏见与人类偏见之间的区别在于，讽刺的是，人类偏见的特征没有指纹，因为它存在一个无法被看见、理解或审计的大脑中。”


    正如微软研究员乔纳森·格鲁丁（Jonathan Grudin）所指出的，“算法并不控制一切；是人创建并调整了它们。”人类可以并且在多个层面上偏向输出，从人们选择包含的数据到程序员选择如何构建算法。通过数据和
    AI，贵组织对数据的使用可以并且应该是可审计和可追踪的，这是一个治理问题。如果你在代码中编写了糟糕的结果，它最终将落到董事会面前。你的数据做了或没有做什么，现在是一项重大的董事会问题。


    有数百甚至上千个例子显示，执法政策中的数据使用被偏向特定的少数族裔或社会经济地区；工作申请的处理方式，


    日益增长的需求是确保 AI 和机器学习中的偏见挑战得到缓解，现在有专门的公司会审查你的数据集和模型。这些公司设计用于在实际部署之前运行合成数据来发现算法中的偏见，如果你在内部没有这些能力的话。账户经过审计，因此董事会更放心；现在是时候考虑数据和算法审计了。


    此外，政府对 AI 和偏见将增加监管和监督。欧盟已指派一个 AI 专家团队定义一个框架，帮助描述 AI 风险和偏见。欧盟《人工智能法案 `EU AIA`》旨在为人类对
    AI 的代理和监督提供蓝图，包括稳健性、隐私、透明度、多样性、福祉和问责制的指南。


    工作组还开发了 AI 可信度的七个关键原则，值得总结在这里，以便你可以将这些整合到你所在组织的讨论中。


    这不是一个详尽的列表，但是一个很好的起点：


    1. 人类代理与监督

    2. 技术稳健性与安全性

    3. 隐私与数据治理

    4. 透明度

    5. 多样性、非歧视与公平

    6. 社会与环境福祉

    7. `问责制（Accountability）`


    此外，公司可以在整个组织采取行动。这不仅限于数据和 AI 团队，而是一个从董事会、执行层到一线（包括所有业务部门）的全公司方法，以及对他们签约和使用的平台、模型、顾问和数据集进行的评估：


    1. 由一个多样化的团队开发模型。

    2. 理解你的底层数据集和模型。

    3. 保持透明且易于接触。

    4. 开发审查流程，以确保无害结果的严谨。

    5. 确保客户数据安全和隐私。


    '
- fmt: '

    6. Engage external organisations such as the `St James Ethics Centre` and the
    `Australian National Data Service` in Australia, or similar highly respected organisations
    in other countries.


    ## Decision-making with or without AI


    Decision-making and human bias are all around us. In the book `Subliminal`, `Leonard
    Mlodinow` cites studies where people who had witnessed serious crimes, like bank
    robberies, were sent to a line-up, sometimes within 24 hours of the crime. Their
    failure rate to recognise the suspect has ranged between 30% and 50%` even after
    strong visual contact. Many times, people actually picked police officers who
    had been put into the line-up. A human being’s ability to recall information,
    even in a highly focused event that had 100% of their cognitive focus, is low.
    The video footage of an armed hold-up holds more reliable data, you could argue,
    than the recollection of the people who saw the crime.


    When you ask a shopper why they buy your brand of washing powder, their cognitive
    processes are not necessarily fired up, and so the chances of getting a factual
    answer are low. Yet these shopper surveys are deemed to be powerful signals as
    we’ve witnessed. In `Chapter 2` we covered `Coca-Cola`’s change to its formula
    based on small focus groups, deciding the destiny of product launches or failures.
    In the world of `AI: Game On`, you can move from a sample size of `N = 100` to
    `N = all`. That is not a small change in capacity to understand your customers.
    In 2011 there was a study of judges – highly educated and trained people – making
    vastly different decisions over very simple laws. The study examined judicial
    rulings by `Israeli judges` who presided over parole hearings in criminal cases.
    One of the co-authors of the peer-reviewed paper, `Jonathan Levav`, found that
    judges gave more lenient decisions at the start of the day and immediately after
    a scheduled break in court proceedings such as lunch. The research looked at more
    than 1,000 rulings made in 2009 by eight judges. They found that the likelihood
    of a favourable ruling peaked at the beginning of the day, steadily declining
    over time from a probability of about 65% to nearly zero, before spiking back
    up to about 65% after a break for a meal or snack.


    `Levav` went on to note that the exact reason for the shift from parole approval
    to a ‘default’ outcome of denial was not clear, but the paper speculated that
    breaks may replenish mental resources by providing ‘rest, improving mood or by
    increasing glucose levels in the body’.


    We’re human after all, and that’s the point.


    Human beings are not designed for high-stakes, high-frequency decision-making.
    We are so quick to judge a machine’s decision as flawed, simply because we can
    measure the inputs and observe the errors. It is not easy to observe human errors,
    as we tend to retrofit information back into why we made the decision. If the
    same judge can make a different decision based on their feelings due to the recency
    of their last meal, we have a problem with human decision-making that needs some
    reflection against those made by machines today, without even allowing for the
    machines of tomorrow.


    ## What questions should we be asking?


    Human beings are not designed for high-stakes, high-frequency decision-making.
    We are so quick to judge a machine’s decision as flawed, simply because we can
    measure the inputs and observe the errors. It is not easy to observe human errors,
    as we tend to retrofit information back into why we made the decision. If the
    same judge can make a different decision based on their feelings due to the recency
    of their last meal, we have a problem with human decision-making that needs some
    reflection against those made by machines today, without even allowing for the
    machines of tomorrow.


    ## Finding ‘the answer’ in business


    We live in a world where if the answer exists, you can find it in one click, so
    most answers to any question are no longer hard to find.

    '
