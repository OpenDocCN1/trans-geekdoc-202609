  trans: '

    业务通过循环运行的次数越多，竞争优势就越大。能够并且已经实施这种模式的公司将变得更难追赶。亚马逊的飞轮是一个被广为提及的案例，讲述了他们为客户创造的价值越多，下一次就能如何更好地帮助他们。特斯拉关于路况的信息正在迅速增长，为他们的客户创造了更好的驾驶条件。当客户数据被捕获并为他们使用时，就产生了一种强大的飞轮效应。


    ## 决策类型


    与其他业务领域一样，执行官和董事会在涉及数据和 AI 运营方面需要做出的决策类型主要分为两类。战略性决策（类型 1）是具有影响性的、不可逆的或极难逆转的。它们是单道门，必须有条理、审慎、缓慢且经过深思熟虑做出。卖掉家产就是此类决策之一。非战略性决策（类型
    2）是可以改变且可逆转的。这些决策可以并且应该由高判断力的个人或小团队快速做出。有趣的是，杰夫·贝佐斯（Jeff Bezos）在他 1997 年的股东信中提到了这个问题，指出随着公司规模的扩大，人们倾向于让类型
    2 决策的流程变得与类型 1 决策相同，这减慢了满足客户需求的创新速度。


    如何使用 AI 以及确保客户神圣性和伦理的适用（见第 8 章）是一个战略性的类型 1 决策。一旦建立了护栏以及为了不伤害而进行的治理，那么输入 AI 运营的持续数据运营就可以变成类型
    2 决策。关于“如何决定决策”、“由谁或什么来决定”的授权至关重要。需要对 AI 产生的所有决策进行审查，以确保伦理考量不会因目标对齐的偏差而偏移。


    数据可以并且在战略性和非战略性决策中发挥良好作用。我见过一桩由数据驱动的并购交易。该公司想要扩张，他们没有通过传统的手段聘请投资银行来识别潜在目标，而是通过数据在客户行为中发现了目标公司。具体来说，我们发现
    A 公司的客户购买的产品属于目标公司 B 的相邻类别，而 B 公司正处于可状态。这是通过追踪客户来识别新创业企业，而不是在惯常嫌疑人名单中遵循投资银行的建议。


    虽然数据和 AI 可以并且应该应用于整个组织的决策过程中（即使在董事会层面），但它们目前在频频决策中最为强大有效，例如下一步向客户提供什么报价。股票交易就是一个显而易的地方，算法交易者利用数十亿信号试图在数据流中寻找阿尔法收益（alpha）。美股中约
    60–73% 的交易是由算法完成的。


    医学领域战略决策的另一个例子可以出现在结构生物学领域。确定生物分子的三维形状是现代生物学和医学发现中最困难的问题之一。“通过使用巧妙的新型机器学习技术，斯坦福大学的博士生
    Stephan Eismann 和 Raphael Townshend 在计算机科学教授 Ron Dror 的指导下，开发出了一种通过计算预测准确结构的方法，克服了这一问题。”


    与我们的决策讨论相关的一点是，研究人员并没有指定是哪些因素让结构预测变得更准确或更不准确，反而是让算法自己发现这些分子特征。他们之所以这样做是因为他们发现，提供此类知识的传统技术会引导算法倾向于某些特征，从而阻止其发现其他信息丰富的特征。他们做出了一个战略决策，让
    AI 来决定。结果令人印象深刻：


    “网络学会了寻找对分子结构形成关键的基础概念，而没有被明确告知，”其中一名研究人员说道。令人兴奋的一点是，算法显然恢复了我们认为重要的东西，但它发现了一些我们以前不知道的特征。


    ## 我们这个时代的决策是如何决定由谁或什么来决定


    应对这一挑战将成为你的组织迈向 AI：《游戏开始》（Game On）以及你的命运不可或的一部分。


    你将如何知道 AI 在类型 2 决策中被使用了？是谁批准的？监管机构是否想了解“决策即服务”中的内容？源数据是什么？它经过验证了吗？客户的成果是什么？有哪些二阶后果？


    ## 你的防御护河是什么？


    即使你采取了真正的 AI 战略，许多其他人也会这样做，并获得相同的工具可能还有相同的数据。答案和优势在于用例。谁先接触客户，谁就开始启动规模效应的新飞轮。


    人类正处于一段旅程，这让我们把越来越多的决策和行动交给机器。多年前，百货商店有电梯员，因为乘客对在没有他们的情况下乘坐电梯感到紧张。我们越来越习惯让机器每天为我们做决定。无人列车于
    20 世纪 80 年引入日本，随后是法国，现在遍布全球。无人列车的普及是一个很好的提醒，只要信任和安全不受损害，这种“新的”自动化决策能力就会很快被人们接受。


    Google 是“决策即服务”（DaaS）的先驱，它提供的价值交换可以总结为：你允许 Google 跟踪你的搜索内容，它利用意图数据，以便广告商能够针对你并在
    Google 的有利的情况下获得巨大的商业利益。母公司 Alphabet 的董事长约翰·L·亨西（John L. Hennessy）告诉 CNBC，Google
    犹豫于在产品中使用其 Bard AI，因为它“还没有真正准备好”，然而 Google 在 2023 年 2 月在市场对竞争对手 ChatGPT 产生强烈关注时发布了其
    Bard AI。Google Bard 的一次推广包含了一个事实性错误——在这一错误引起媒体关注后，Alphabet 的股价在一天内下跌了 9%。这在当时估值损失了超过
    1000 亿美元。如果数据巨头都能犯这种错误，这说明这里有真实的复杂问题需要解决，并在董事会层面需要治理。


    某些消费者不想参与这种价值交换，这应该是他们的选择。搜索市场出现了一些新的、尽管规模较小的竞争。如前提到的，我是 Andi search 的顾问，这是一种新的搜索方式。它具有高度的数据保护，且无广告、无数据跟踪，因此你的搜索不是基于争夺你注意力的广告。杰米·怀（Jeremy
    White）是 Andi search 的创始人，他告诉我：“如果你正在构建一个基于 GPT 的大语言模型系统，一切看起来都是语言问题，”但并不是所有问题都是语言问题。


    '
- fmt: '

    Thoughtful data scientists have claimed to have found ways of AI self-learning
    and self-questioning, much like a human would do, asking new questions from the
    knowledge they have acquired. Titled ‘Large Language Models Can Self-Improve’,
    a group of researchers built an LLM that can come up with a set of questions,
    generate detailed answers to those questions, filter its own answers for the most
    high-quality output, and then fine-tune itself on the curated answers.


    At the time of writing, there are claims of AI fact-checking and also evidence
    that there are a lot of ‘facts’ in AI that are not true. It’s evolving and the
    only thing I can be sure about is this is likely to be the slowest rate of AI
    development we will ever see. We may end up subscribing to AI truth verification
    detecting apps.


    The driverless car is a good analogy for the new type of decision-making that
    will be required in companies as we become enabled by DaaS. The driverless car
    needs to know much of the same high-level views required by directors and executives:


    *   Where am I, precisely?

    *   What is going on around me (other cars, pedestrians, roadworks, traffic lights,
    roundabouts, merging lanes, turning lanes, weather)?

    *   What will or might happen next (red light, green light, arrow light, random
    pedestrian on the road, car overtaking, car running a give way sign)?

    *   What should I do now (nothing, something)? What intervention is the best next
    move?


    ![Image](images/himg-105-1.jpg)


    The AI powering the decisions of the car are, in theory, much less distracted
    than humans and are only getting better with the increasing amount of data being
    fed into them by the computers on new cars.


    We need to be sure that any driverless cars are safe of course. We have due concerns
    about the driverless cars’ safety and we should also have concerns about many
    bad human drivers.


    The photo below shows what the computer systems see in a driverless car and how
    this compares to the human vision. What I find so fascinating is how the cognitive
    layers of the driverless cars are making billions of predictions, and so is the
    human driver. Will the bike rider suddenly move into my lane? How does this bike
    rider compare to others I have witnessed? What could be behind the trees to the
    right? The human driver can benchmark to what they individually know, whereas
    the machine can benchmark to a near-limitless number of precedents. A pothole
    ahead would be known by the driverless cars that follow; the human will notice
    it for the first time when they hit it.


    ![Image](images/himg-106-1.jpg)


    ## Bias in decision-making


    All decisions are made with bias. Each of us has our own ‘reality’ based on our
    lived experience. If you were bitten by a Cavalier King Charles as a child, it
    would likely make you look at all Cavaliers in a particularly biased way, and
    perhaps all dogs that look like that breed. It is a limited data set (of one)
    that frames the most powerful reference. Without a lot more data, such as knowing
    if King Charles Cavaliers bite more children than other dogs, and if that was
    true (and it is not), then individual bias is just that, individual bias, based
    on personal and highly emotional small data sets. The hard part in negating bias
    is opening up the data to verify if it’s true, or if it is my pre-existing belief
    that is wrong and not based on anything beyond my sample of one.


    Next time you are in a disagreement with someone, try this, and ask, ‘What evidence
    can be brought to bear that would make you change your mind?’ If the person says
    nothing can make them change their mind you now know you have entered an ideological
    debate devoid of facts.


    Warren Buffett is purported to ask the following question in meetings quite often.
    ‘What is it that you were once sure about that you’ve now changed your mind about?’
    In other words, what is it that you were wrong about before? So, the question
    to you and your colleagues, direct reports, your CEO/board is, ‘What are we all
    wrong about? What is it that we are collectively all wrong about, and what myths
    do we have that need to be busted?’


    Following the data requires a change of mindset, an openness and inquisitiveness
    along with wider organisational learning. For everyone the question needs to be,
    what data can be sourced that would make you pause and reflect on what you assume
    to be true?


    In The Premonition, Michael Lewis talks about biases in the health industry with
    specific reference to the global pandemic. ‘The differences between data bias,
    through algorithms and AI, and human bias is, ironically, the lot of human bias
    has no fingerprint as it is inside a head that can’t be seen, understood or audited.’


    As Jonathan Grudin, a researcher at Microsoft, noted, ‘The algorithms are not
    in control; people create and adjust them.’ Humans can and do bias the output
    at multiple levels, from the data people choose to include to how the programmer
    chooses to build the algorithm. With data and AI, your organisation’s use of data
    can and should be auditable and trackable, and that is a governance issue. If
    you code in a bad outcome it will ultimately land at the board’s feet. What your
    data does or does not do is now a material board issue.


    There are hundreds, if not thousands, of examples of bias using data from policing
    policies being skewed to specific ethnic minorities or socio-economic areas; the
    way job applications are handled,


    There is a growing need to ensure the challenges of bias in AI and machine learning
    are mitigated and there are now specialist companies that interrogate your data
    sets and models. These are designed to spot biases in algorithms by running synthetic
    data before real deployment, if you don’t have these capacities in-house. Accounts
    are audited, so the board has more comfort; it’s now time to consider a data and
    algorithmic audit.


    Separately, there is and will be more regulation and oversight by governments
    around AI and bias. The European Union has tasked a team of AI professionals to
    define a framework to help characterise AI risk and bias. The EU Artificial Intelligence
    Act `EU AIA` is intended to form a blueprint for human agency and oversight of
    AI, including guidelines for robustness, privacy, transparency, diversity, well-being
    and accountability.


    The working group has also developed seven key principles for AI trustworthiness
    that are worth summarising here so that you can incorporate these into discussions
    within your own organisation.


    This is not an exhaustive list, but it’s a good starting point:


    1. Human agency and oversight

    2. Technical robustness and safety

    3. Privacy and data governance

    4. Transparency

    5. Diversity, non-discrimination and fairness

    6. Societal and environmental well-being

    7. `Accountability`


    In addition, there are actions companies can take across the whole organisation.
    This is not limited to the data and AI teams, it’s a whole-of-company approach
    from the board and executive through to the front line including all business
    units, as well as in the assessment made of the platforms, models, consultants
    and data sets they contract and use:


    1. Have a diverse team working on the models.

    2. Understand your underlying data sets and models.

    3. Be transparent and approachable.

    4. Develop review processes to instil rigour in outcomes that do no harm.

    5. Ensure security and privacy of customer data.

