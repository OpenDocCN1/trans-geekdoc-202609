  trans: '


    在我当时工作的公司（Quantium），我们形成了这样一种观点：如果公司高管层将你派往技术团队，那是业务陷入困境的真实信号。高管层希望可以将这项关键的战略倡议委托给技术团队。今天，AI
    采用、数据使用、以客户为中心以及治理已成为许多企业的前沿，也是董事会的核心议程。


    ## 数据与 AI 战略现在就是业务战略


    数据策略现在正进入 AI 策略手册。它的演进如此迅速，产生的影响如此深远，以至于它一直是核心业务战略。


    企业现在处于这样一种状态：他们不需要业务内部独立的数据策略。他们需要一种由数据驱动、由 AI 赋能的业务战略，指导所有的战略倡议（无论是否数字化）。正如麦肯锡指出的，“未来的
    CX 项目将是整体的、预测性的、精确的并与业务结果紧密相关的。”


    在过去的 15 年里，我曾向数百位董事会成员介绍过未来几年董事会仪表盘将呈现什么样。大多数企业所运行和报告的关键指标在过去 20 年里变化很小，尽管它们的企业已经发生了巨大变化。大多数董事会报告仍然没有关注客户未来的意图和行为——即利用数据的预测性洞察。下一次当你准备董事会报告或收到一份报告时，请问自己：“在这一切中，客户处于什么位置？”看看你会得到什么回答。


    当数据变得如此易 way 且动态时，我们可以预见到不同类型的董事会和执行层讨论。客户用我们的产品做了什么？他们离开我们后去了哪里？我们做了什么导致了增长或萎缩？现在，你可以在获得许可的情况下，看到并听到你的外勤人员与客户的真实对话。这些对话可以制作成文字摘要，并进行情感分析。一些进步的公司偶尔允许一线团队请求记录与客户的对话，理由是他们认为
    CEO 应该听听这些内容。没有任何过滤是如此强大的。


    在几年前与当时思科（Cisco）主席的约翰·钱伯斯（John Chambers）交流时，他理解转型数据驱动型组织的挑战：


    困难的部分在于如何改变你的组织结构？如何改变你的文化，以便从客户结果的角度来思考？今天，你谈论的是数字化是公司业务战略或其供应链与客户交互方式中不可或缺的一部分。这不再是由技术赋能的——技术将成为公司本身。


    下面的图表是一个真实的案例研究，一家零售商利用客户行为数据来确定收购目标。这并非来自投资银行的推销，而是由客户需求驱动的收购。目标是从去标识化的银行数据中选出的，这些数据显示了购买行为。


    寻找并购目标在很大程度上仍然是一种模拟的旧式业务，主要是一群穿西装的人在午餐和咖啡时间谈论好主意。算法驱动的并购目标即将到来，它们将以数据驱动的方式审视客户契合度和其他参数。


    ![数据驱动的 M&A 活动将如何发生](img/himg-117-1.jpg)


    ### 数据驱动的 M&A 活动将如何发生


    ## 业务业务每个部分的数据使用


    营销经理的角色与 20 世纪 80 年代后期和 90 年代数据革命初期相比已完全无法认出。几十年前的营销团队花时间在长时间午餐中，与扎着马尾的创意人员讨论电视广告和杂志活动（我应该清楚——我曾是的一员，而且很有趣！）。今天，领先的营销团队和代理机构都是数据驱动的。如果你想了解数据驱动世界中的营销，请阅读西南·阿莱（Sinan
    Arai）的书《炒作机器》（The Hype Machine），他在书中探索了数据支撑的新技术和通信模式背后的科学——通过集成数字营销实现的个性化大众说服。我认识一家非常成功的保险公司，其营销总监是一位精算师，研究响应率、部署算法、在竞价机中购买受众，更像是一个以光速运行的股票彭博终端。许多公司正在使用第三方数据公司和合作来利用海量互联数据集的力量。


    19 世纪费费城的零售商约翰·瓦纳梅克（John Wanamaker）据曾说过：“我在广告上花的钱有一半浪费了；问题是我不知道是哪一半。”这就是当时对营销的看法。今天，有了实时归因，浪费可以且应该少得多，目标定位也可以变得非常精密，只要你没有被衡量和为错误的结果付费所误导。（参见脚注链接中
    Arai 的评论，其中提到数字营销的效果被过度夸大了 3 倍，有时甚至被夸大了 10 倍。）


    你可以轻松地为早餐喜欢橙汁、年龄在 45-49 岁且住在你商店 200 米内公寓里的人购买受众。但试着找出你的团队中是谁工作过度、并将在下周辞职。然而，预测此点的数据是可用的，就在
    HR 部门的服务器里，直到辞职信递到他们桌上，他们才看不到这些信息。


    随着 AI、大规模数据和预测能力被应用于这一最具有“人性”的功能——管理人员，HR 将将面临大规模变革。我对这个领域感到兴奋，并投资了一些初创公司，它们为企业提供了不同的方案，利用数据让他们的团队工作得更愉快、表现水平更高，并感到更多的联系和支持。


    该领域众多新公司之一的一位 CEO 最近对我说：“我们对 HR 领域中 AI 和分析能做的事情感到兴奋。当你观察采购、营销、新产品开发等其他部门时，我们看到
    AI 和大规模预测分析正在快速应用，但 HR 部门在许多情况下仍在使用白板和邮件。”


    由于 COVID-19 和所谓的“大辞职潮”，更好地协调和连接员工的需求变得更加紧迫。在疫情高峰期间被迫居家办公以及随后的简短封锁之后，许多员工现在要求居家办公和办公室办公结合的灵活性。我看到的一种
    AI 驱动工具将混合办公日的元数据与全员在场的工作日进行比较。他们立即发现了一些有趣的见解。小型短期项目在居家办公下完成得非常好。长期、复杂的协作项目在居家办公世界中效率很低。这些来自邮件、Slack
    频道和交付物的元数据。我们知道，对于许多公司来说，如果你不提供这种灵活性，员工就会离开。最有才员工将是那些获得最多机会的人。


    围绕数据、AI 和人类管理的真正问题是如何设计系统以确保公平、避免无意偏见，并确保它们不会变成管理监控机制。那将通往大规模辞职单程票。


    由 AI 支持的 HR 很快就能提出并回答一系列更细致的问题。例如：


    - 我们如何衡量候选人在这里学习和成长的能力？


    '
- fmt: '

    * What emotional fitness/intelligence (EQ) is key to being a leader in our organisation?

    * Which candidate will be the best hire?

    * Which candidate could be the CEO in 10–15 years’ time?

    * Which staff members need support?

    * Which staff members are at risk of overwork/burnout?

    * Which manager helps staff in ways that make them happier about their work?

    * How can we capture data about our high performers so we can predict who could
    create more of them?

    * What behaviours in the team indicate the best team leader?

    * What cultural risks can be mitigated with the use of AI data in the HR function?


    When these sorts of questions are backed into a recruitment algorithm that can
    scan LinkedIn, looking for talent that will work for the organisation, the theory
    is it can create teams that are happy and high-performing. All these sorts of
    questions exist in the data that organisations already collect; it’s likely, however,
    that the information is spread across various divisions, with specific individuals
    and not analytics-ready.


    Remember street directories? For those of you who don’t, there were books with
    maps of how to move around the city. Every car had one. It was a great business.
    Nowadays it’s predictive analytics that uses real-time location and the baseline
    of the old maps that means drivers get real-time recommendations of which streets
    to use because of a traffic incident. Similarly, HR will move to a world of predictive
    analytics and the maps most HR teams use today will look like your old street
    directory in the glovebox. These are areas where data and AI are coming fast,
    and where HR teams will see much more change. An ethically driven approach using
    the data Hippocratic oath or something similar will be necessary.


    Recruitment is being augmented with AI. Recently it was reported that Afterpay,
    Qantas, Spark NZ, Iceland Foods, Woodies (USA), among other companies, are using
    a bot called `Phai` to undertake the first interview of candidates. The `Phai`
    bot is a smart interviewer. It claims it can discover a person’s personality traits
    from their written answers to questions. The company behind this is `PredictiveHire`.
    They have adapted Google’s `Bidirectional Encoder Representations from Transformers
    (BERT)` – a natural language pre-training algorithm – using 1.3 million candidates,
    which has enabled `PredictiveHire` to accumulate a proprietary data set of 550
    million words.


    While the focus of AI and data has been on marketing, the whole organisation is
    on its way to AI: Game On from better use and deployment of data and AI, including
    procurement, logistics, operations, capex, finance and more. The CEO of a Fortune
    top 30 Australian listed company shared with me recently his view that ‘there
    is no area of this business where a data-driven approach could not lead to a significant
    commercial impact’. He cited a $30 million EBIT impact as being available pretty
    much in every process in the business from logistics, M&A, finance, ESG, procurement
    and HR to new product design and even health and safety.


    ## AI: Game On requires a culture change first


    Can you change the culture of a company to one that has a thirst for data, as
    opposed to building a data-driven company? Absolutely. Just look at the change
    that occurred at `Microsoft`. Satya Nadella radically re-engineered how `Microsoft`
    operates both with its customers and other stakeholders. `Microsoft`’s market
    capitalisation has more than tripled since they adopted this approach. Linked
    to this is Nadella’s approach to learning.


    *Presentation by Satya Nadella*


    We are in the business of meeting the unmet, unarticulated needs of customers.
    That means you need a system that finds the unmet and unarticulated needs. No
    survey can find the unarticulated clue of the customer. When I joined `Microsoft`’s
    culture at the time was hard edged, quantitative, metric driven. To find the unmet
    unarticulated needs of the customer we had to change our culture and therefore
    the metrics we were using so that we could harness the signals of the customer
    in real time.


    ## Harness the signals of the customer in real time


    Alfred Chuang, the founder and CEO of `BEA Systems` (sold to `Oracle` for $8.6
    billion) and founder of `Race Capital`, is one of the pioneers of predictive transaction
    processing. Chuang comments that ‘for businesses to remain relevant and competitive
    they need to be able to predict customer behaviours and preferences and need to
    rely on predictive transactions to automate most of their business interactions.’


    In other words, it required the move from data and AI-enhancing decisions to predicting
    outcomes and next best action. He cites `TikTok` as one of the world leaders in
    this. Its algorithm ‘sees’ what you watch and gives you more of it, and learns
    from every clip you watch.


    Alphabet has launched a company that uses AI for drug discovery built on research
    carried out by `AI Lab`. As part of this, `Google` acquired `DeepMind` in 2014
    and launched `Isomorphic Labs` with the mission to ‘reimagine the entire drug
    discovery process from the ground up. Not only does the AI analyse data but it
    also builds powerful predictive and generative models of complex biological phenomena
    that have led to breakthroughs in protein folding. One model has accurately predicted
    how the structure of proteins will fold in a matter of days, something that has
    eluded scientists for decades.’


    Xavier Shay, chief executive of neobank `Up` (acquired by `Bendigo Bank` through
    its acquisition of `Ferocia` in January 2022), comments that ‘people are now seeing
    you can get a tech experience that’s up there with Netflix and Uber \[in banking\]’.
    If you’re not afraid of `Square`, then you’re not paying attention. It’s not just
    `Square`, it’s pretty much all of the big tech players in Apple, Google, Amazon,
    and I think they all have the same game plan.’


    JPMorgan Chase recently announced that it would spend $16.7 billion on developing
    new technology to avoid being disrupted by the neobanks.


    ## Data and AI are vital to you, now


    Imagine a scenario where, say, a venue becomes much more than that. For example,
    what if a customer’s iris is scanned as part of their entry. That scan could be
    used to identify certain medical issues, ones that could be successfully treated
    because of this early awareness. The customer may find this helpful, so long as
    they know what the machine is doing on their behalf and the same data is not sent
    to anyone else.


    In this imaginary case and with the use of data that is visible, actionable, and
    transparent to the customer, the value impact of the data use can allow the venue
    operator to tap a value pool well outside of their traditional revenue lines.
    There is enormous value in the ‘product of the product’. The product is a venue
    and whatever happens in the venue, but that entry scan and the movement of high
    numbers of people can create a myriad of other large-scale impacts.

