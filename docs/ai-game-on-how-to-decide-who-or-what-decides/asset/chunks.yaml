- fmt: '

    Much of the discussion around data, AI and machine learning has focused on the
    impact on the workforce or, more specifically, the displacement of humans in the
    workplace and fear around lost occupations and jobs. This makes great headlines,
    but the realities are harder to predict. I am not saying there won’t be major
    changes in the jobs, occupations and professions of the future but technology
    has always resulted in structural adjustment that requires shifting skills and
    workplace changes. Professor Richard Baldwin at the Geneva Graduate Institute
    in Switzerland, recently said about Artificial Intelligence. “AI won’t take your
    job, It is somebody using AI that will take your job.”


    Perhaps for the next 20 years AI and machine learning seem less likely to substitute
    human intelligence, and rather they will augment it. There is ultimately a handoff
    from the machine to the human. That handoff is the Spotify playlist, the new antibiotic,
    the plane landing, the parcel delivered by the drone. So, the value comes from
    the augmentation back to humans. I like to use the term augmented for AI rather
    than artificial for just this reason. The data AI quest to create a better customer
    experience and complete the journey to a genuine understanding of the customer
    remains the key first-level priority of using data.


    > ‘Hiding within those mounds of data is the knowledge that could change the life
    of a patient or change the world.’ – Atul Butte


    At a pro bono workshop with Australia’s leading minds on pancreatic cancer, facilitated
    by Dr Norman Swan, I witnessed how data and analytics can help change the trajectory
    of medicine. Many of our leading experts on pancreatic cancer were in the room
    talking about how this most brutal of cancers is both hard to detect early and
    how and why it has one of the lowest survival rates.


    Greg Schneider, co-founder of Quantium, drew three columns on the white board.
    He said if in column 1 you had the DNA sequencing data of people who had and have
    had pancreatic cancer, then column 2 had all the medical interventions that had
    happened to this group of people in their life, and in column 3 you had all lifestyle
    factors of this group, and you linked the columns in a de-identified privacy-compliant
    way you would see new ways of understanding the disease immediately. Of course
    the people involved will need to approve their data for this use. It would show,
    for example, whether the use of antibiotics in childhood has any impact, positive
    or negative, on pancreatic cancer. Do high quantities of processed foods add any
    risk?


    What DNA characteristics make individuals more vulnerable? Correlations and possible
    causation will be revealed in the data.


    Greg knows nothing about medicine or pancreatic cancer, but a lot about how to
    use data. There was a gulp in the room as these medical minds could see how the
    data, used at scale and for the benefit of the patient, was a massive accelerant
    to the path forward for discovery of treatments and hopefully prevention.


    As large-scale genetic information becomes securely available for medical science
    the acceleration of a more personalised medicine is set to advance faster.


    The UK Biobank has an ambitious plan to sequence all life on earth. It’s a large-scale
    ambitious project. Genomic sequencing has enabled improvements in drug discovery
    and increasingly medical breakthroughs are looking more like a data and maths
    challenge. Moderna vaccines for Covid were created quickly by using the genetic
    sequences of the virus and the virus itself was never on site. It was, according
    to Francis deSouza, CEO of Illumina, ‘seen as a software problem’.


    Medicine, like most aspects of life, will be more personalised in an AI data enabled
    future.


    ## Your new segmentation strategy is a segment of one


    Many organisations use data inputs for customer segmentation or understanding
    customers’ preferences. When done at a basic level, and without human oversight,
    you can have some bizarre outcomes. As an example, let’s take King Charles and
    Ozzy Osbourne, which was shared with me by Tony Davis, one of the founders of
    Quantium.


    ![Image](images/himg-133-1.jpg)


    They were born in the same year, 1948. Both are in the high-wealth bracket, and
    spend a lot of time in the same location, London. They both like international
    travel, dogs, sports cars, fine wines, have children and have married and remarried.
    One might think they perhaps have different tastes in music but who knows? From
    a basic raw data perspective, they share a remarkable similarity. For some analytic
    engines that are based on simple metrics of age, gender, location and family status,
    they will appear as very similar, almost twins, in terms of how the simple algorithm
    sees them. Some companies whose segmentations are based on simple metrics, not
    related to real behaviours, would be sending the King of England and the king
    of heavy metal the same advertisements and the same product suggestions, no doubt
    annoying both of them. Neither would find such a scenario even remotely a good
    customer experience.


    Any segmentation that is not a segment of one and full personalisation is set
    to fail. Personalisation is now table stakes in consumer expectations. McKinsey
    agrees. They found 71% of consumers expect companies to deliver personalised interactions.
    And 76% get frustrated when this doesn’t happen. The future of business, medicine
    and most industries will be personalised, driven by data. Data is the heartbeat
    of personalisation. You cannot personalise your offering if you don’t really know
    the customer.


    In the book *The Everything Store*, Brad Stone talks about how Jeff Bezos went
    to his board two decades ago to pitch the need for personalisation of all Amazon
    touchpoints that required hundreds of data scientists. When asked by his board,
    ‘Why do you need all these data scientists?’, he responded with words to the effect
    of: ‘If we don’t personalise everything somebody else will, and then we will be
    cut off.’ He could see the future of the data-enabled business years earlier than
    most.


    In his 1999 letter to shareholders, Bezos shared his vision for Amazon to become
    ‘the everything store’: Our vision is to use this platform to build Earth’s most
    customer-centric company, a place where customers can come to find and discover
    anything and everything they might want to buy online.


    We’ll listen to customers, invent on their behalf, and personalize the store for
    each of them, all while working hard to continue to earn their trust.^


    ![Image](images/himg-135-1.jpg)


    It is not possible in this book to provide a customised journey for every different
    type of organisation or reader, but this chapter can provide a framework for how
    you can work out your own journey, whether you head a small business, are an executive
    or board member in a large corporate, not-for-profit, government agency, start-up
    or scale-up.


    ## Building a data culture


    Watch out for HiPPOs – the highest paid person’s opinion

