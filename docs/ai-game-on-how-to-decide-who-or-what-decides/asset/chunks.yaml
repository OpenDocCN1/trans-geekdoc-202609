    ## Regulation and oversight


    In November 2023, Bletchley Park in England, the iconic WW2 code-breaking centre,
    hosted the world’s top technology powers. At this meeting there was a pledge to
    jointly tackle the potentially catastrophic harms of artificial intelligence.
    Over 25 countries attended to attempt to set aside geopolitical rivalries and
    competing ideas on how to govern the rise of the machines. The US, the European
    Union, China, India and 25 other mostly Asian and Gulf countries attended to align
    on key issues relating to AI safety.


    While the focus of this chapter is always acting in the best interests of the
    customer in relation to data and AI, there is an increasingly global regulatory
    framework being developed to protect individual privacy and ownership of personal
    data. There’s still a long way to go here. We need to be hopeful that regulators
    and governments can keep up with the rapid advancement of AI and machine learning.
    They have made real progress in relation to the ownership of personal data, with
    differences depending on the country you live in.


    As a company that is capturing and utilising data through AI and machine learning,
    you’ll be developing intellectual property that can have significant value. Your
    other high-value assets, like the tangible assets, have someone in the organisation
    who knows a lot about them, where they are, how they work, what risks sit in them.
    Now that data and AI have such value, make sure the organisation can answer the
    same sort of questions about this class of assets. Here are some questions to
    start with:


    *   How does it work and create value?

    *   Is it ethically sound?

    *   Did the customer authorise the use of their data and for what purposes?

    *   What risks are incurred by storing this data?

    *   What second- or third-order consequences could come about from using the data?


    AI that is working well should be identified as IP and sit on your asset and risk
    register, as this will mean the board is aware of its value and how to protect
    it.


    If you are losing, because of a lack of innovation about AI, that fact should
    be on your risk register.


    I end this chapter with the data Hippocratic oath.


    **We will do no harm with the data we collect.** **We will not use the information
    about any human being for any purpose that makes life harder for those we are
    here to serve.** **We will respect the privacy of our customers, and not allow
    information about them to be used against them in any way.**


    With the foundation of the data Hippocratic oath in mind, it’s now time to explore
    the potential futures out there for your organisation and industry. The following
    chapters will help you understand what you need to do to become match fit, and
    become an organisation that harnesses data and AI to grow your business for the
    future or make your organisation more effective and efficient.


    ## CHAPTER TAKEAWAYS


    1.  Cybersecurity is crucial for businesses, and trust with customers is fragile,
    so companies should focus on building and maintaining trust.

    2.  Just as insurers can increase profits by helping customers stay healthy, AI
    technology can be used to create new business models in all industries that align
    with the best interests of customers.

    3.  There are rapidly changing expectations around data collection, use and sharing,
    and regulators need to get ahead of tech developments and legislate to protect
    society from bad actors.

    4.  Ethical concerns must be taken seriously by company directors.

    5.  AI technology can often make better decisions than humans, but bias exists
    in both AI and human decision-making, so we need to be empathetic and careful
    about how we develop and deploy new technology.


    __________


    # Chapter 4


    # KNOW YOUR CUSTOMER


    ‘There is absolutely no inevitability, so long as there is a willingness to contemplate
    what is happening.’ – Marshall McLuhan, Canadian philosopher


    ‘‘I believe fundamentally that organisations like ours and others will be successful
    if they solve the future problems that customers have. If they don’t, they’ll
    just go out of business.’ – Michael Dell


    *Watching streaming TV or the TV watching me*


    As of September 2023, Netflix has 247 million paid subscribers.([#fn36])


    ## Harnessing the intention and attention economy


    To win in the intention and attention economy you need data and AI-enabled systems
    that are in tune with customer needs and have the ability to spot emerging needs.
    Netflix doesn’t have a data business, it has a customer business. They can discern
    intention from their customer data and also engage you to obtain attention. Netflix
    has been built on the mantra of customer science, a form of science dedicated
    to knowing you in order to serve you. Reed Hastings, the co-founder and executive
    chairman of Netflix, has said that he hopes customer science will be his legacy.
    An AI: Game On organisation is one that is built around an ecosystem that knows
    each customer well enough to predict what they want and when and how they want
    it, to genuinely know them to serve them.


    As I write, I have a text from an office supplier asking me to rank their delivery
    of printer cartridges. Good on them for seeking feedback. But the product never
    arrived, and their systems are too broken to know it. On their website, there
    is a range of FAQs and nothing about what to do when the delivery does not arrive.
    Yet I can see presentations from the CEO on customer-centricity as their number
    one goal. Without a data spine that enables visibility into the customer’s real
    situation at a granular level, it’s just a guessing game, and rhetoric about being
    a customer-centric company is promising a standard with no chance of living up
    to it.


    They have the customer’s cash, and so now this is all the customer’s problem.
    Nice for them, but it will guarantee large-scale defection. Do their data systems
    see this link? It should and could, but if the culture of the company is like
    this one, they will be eaten alive by the companies that get this right and stay
    in tune with the real customer experience. As I ditch this poor service provider
    and aim my browser at Amazon, I feel for the employees trapped in this Australian
    domiciled business that has not figured out how to make their data spine work
    for their customers. That is on the board and CEO, and boards need to step up
    to ensure their organisations are globally competitive as we are all just one
    click away from a data-enabled company that creates fewer headaches for customers.


    Charles Darwin’s *On the Origin of Species by Means of Natural Selection* plays
    out in business too. Longevity at the top of the pack is shorter than ever before,
    as a lack of focus on the customer sees many organisations sleepwalking into Kodakville.


    Only 10.2% of the Fortune 500 companies in 1955 have remained on the list up to
    2020, which means more than 89% of the companies from 1955 have either gone bankrupt,
    merged with (or were acquired by) another firm, or they still exist but have fallen
    from the top Fortune 500 companies (ranked by total revenues) in one year or more.([#fn37])

