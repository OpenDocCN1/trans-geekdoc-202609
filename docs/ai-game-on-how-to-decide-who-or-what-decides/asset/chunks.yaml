    其他组织在暗网上运营，那里是一个通过网络犯罪和其他不法手段获取的个人信息丛林。目前有一些重大的倡议和非营利组织正在构建数据共享平台。


    `Gaia-X` 就是其中一个由欧盟和 `Gaia-X Association for Data and Cloud` 支持的数据共享项目。


    在澳大利亚，联邦政府正在投入资金，用于扩展消费者数据权利（`CDR`）规则、基础设施和技能培训，以推动人工智能、量子计算和 6G 移动等新兴技术的标准制定。它正确地认为，消费者数据权利对于促进用户在选择银行、能源或电信提供商时能够获得更强的流动性和更丰富的服务选择至关重要。


    扩展 `CDR` 的推动是更广泛提升数据能力计划的一部分，旨在促进更大规模的数据共享和资产管理。例如，`Geoscience Australia` 已获得
    4000 万美元，用于开发一份澳大利亚地理的三维数字地图谱，将关于人口、经济、就业、基础设施、健康、土地和环境的公共数据整合到单一的国家数据资产中。此外，还有一项
    1650 万美元的试点计划，旨在使政府数据资产更具可发现性。该计划将为 20%的联邦机构开发数据清单，并为公开的政府数据资产目录开发共享的数字基础设施和标准。


    政府间的数据是一项真正的挑战。澳大利亚各州政府负责州警察，所有的道路死亡人数数据都存储在州级。澳大利亚政府有兴趣理解并帮助减少交通事故，理想情况下希望将各州数据集连接起来，以形成全国性的视角。这些数据集中的细微差别是通往道路安全的关键。为了帮助减轻交通事故带来的沉重负担，我们需要关于每起事故真实原因的真实归属数据。


    道路死亡可能涉及多个因素。因素包括道路状况、事发时的天气（阳光是否直射了驾驶员的眼睛？）、车辆类型、驾驶员年龄和速度、驾驶员疲劳等。这些数据集非常丰富，如果能通过强大的分析进行关联和审查，其产出将是挽救的生命，并使基础设施支出更符合安全需求。通过共享数据来拯救生命本应是易事，但目前的数据孤岛和官僚主义让这变得非常困难。


    当你观察交通事故中捕获的数据时，它是非常原始的，我怀疑我们错过了领先指标和滞后指标。随着汽车变得越来越复杂，它们将携带更多数据，越来越像黑匣飞行记录器。这些数据在何处用于道路安全？美国已经存在一些早期的倡议，但距离规模化的真实洞察还有很长的路。如果一个驾驶员的侧视镜被撞击两次，那是一次近乎对撞，还是一次幸免的致命事故？可能是吧，但还没有数据可供分析。如果矿区的一辆卡车的后视镜被刮到，该数据在很多情况下将用作理解近乎死亡事故的一种。我们作为一个社会，需要更多地思考如何利用这类信息来帮助建立更安全的世界。这可以在符合隐私规定的情况下进行，从而保护个人。


    ## 非预期的或不符合伦理的数据使用


    数据和机器学习算法被误用和滥用的案例数不胜完——无论是故意的还是无意的。2022 年，澳大利亚政府举行了一个关于社交媒体和网络安全的议院小组委员会。`Facebook`
    吹哨人 `Frances Haugen` 被邀请提供证词。`Haugen` 此前泄露了文件，并向美国国会委员会提交了令人震惊的证词。`Haugen` 表示，公司知道支持
    `Facebook` 和 `Instagram` 算法正在散布虚假信息并伤害儿童，但高管将“天数字般的利润”置于安全之上。她敦促澳大利亚议会小组委员会“监管平台业务模式的核心——即允许虚假信息和仇恨蔓延以及剥夺个人数据的算法和设计特征”。


    1. **Amazon 的 AI 招聘工具** —— `Amazon` 为招聘开发的该工具开始对女性求职申请者产生偏见。

    2. 澳大利亚政府的自动化债务计划（通常被称为 `Robodebt`）被判定为不法。该计划由 `Services Australia` 执行，旨在通过对比
    `Centrelink` 记录与澳大利亚税务局的收入数据来计算还款。

    3. **Microsoft 的** Tay 机器人随着用户的互动而变得越来越聪明，但在发布后 24 小时内就由于腐败而产生了大量的性别歧视和种族歧视信息。

    4. **Google 的仇恨言论检测器** —— 用于捕捉仇恨言论的 AI 工具对黑人表现不同。


    在数据滥用和滥用方面，请考虑以下案例：


    1. **Cambridge Analytica**。2014 年初，英国政治咨询公司 `Cambridge Analytica` 与 `Aleksandr
    Kogan` 签署了一项交易，利用 `Michal Kosinski` 及其团队的工作。`Kogan` 得益于 `Facebook` 一项允许第三方访问用户数据的计划创建了测验。估计有
    30 万用户参加了该测验。后来发现，`Cambridge Analytica` 利用通过测验获取的数据为 8700 万 `Facebook` 用户构建了画像。一些人认为
    `Facebook` 和 `Cambridge Analytica` 的决策均非严格违法。根据当时 `Cambridge Analytica` 的首席运营官
    `Julian Wheatland`，公司最大的错误是认为遵守政府法规就足够了，从而忽视了更广泛的数据伦理、偏见和感知问题。

    2. 2019 年 9 月，**Twitter** 承认允许广告商访问其用户的个人数据以改进营销活动的投放。该公司将其归于内部错误。

    3. 2020 年，黑客访问了万豪 **Marriott** 客客记录，包括客户联系信息、个人偏好、生日等。这次攻击之所以成功是因为攻击者获取了员工凭据以访问第三方应用程序。虽然这更多是一个数据窃取案例而非滥用，但在发生两个月后人们才意识到这一点，这导致了万豪信誉的严重损害。


    有趣的是，三家领先的科技巨头 `IBM`、`Google` 和 `Microsoft` 都由于伦理考虑拒绝了某些项目。`Google` 云计算专家不同意开发用于金融机构做出贷款决策的
    AI 项目。该项目被搁置，直到性别和种族偏见问题得到解决。`Microsoft` 也限制了其模仿声音软件的使用，因为担心该技术被用于创建深度伪造（deep
    fakes）。同样，由于考虑到滥用的可能性，`IBM` 彻底终止了其面部识别服务。


