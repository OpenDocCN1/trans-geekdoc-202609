  trans: '


    然而，当我们的数据被用于在二级用例中创造大规模价值时，情况变得更加复杂。如果对我们搜索数据的使用显示出让房地产开发优于其他行业的市场趋势，那么这种收益的份额该如何分配？如果一位创业者有勇气在该数据上承担投资风险，那么这是否应该是价值交换的一部分？


    相比之下，如果数据是广泛提供的，那么它是否仅仅是像`Census`（人口普查）或其他数据集这样的市场数据，而不使用数据变成了一种商业风险？如果数据并非广泛可用（例如流媒体的观看习惯数据），且该用例对于数据共享者来说是不透明的，那么则是另一回事。


    并非所有来自搜索或其他数据的洞察都能带来金碧辉煌的业务结果。存在数据驱动的经济损失案例。风险与回报的平衡需要考虑。如果公司使用宝贵的客户数据而不回馈价值，他们很快就会发现新的竞争对手，这些对手会利用客户数据为客户提供更好的用例。他们还将看到新的业务模式，其中数据隐私成为产品和服务的差异化优势。`Apple`
    将 `iPhone` 数据隐私视为与其他手机拉开差距的有力手段。透明度和数据希波克拉底誓言是留在数据价值交换右侧的关键。


    由于数据可以被永久存储，应该问的问题是：如果我们为了一个目的存储了这些数据，然后将其用于另一个目的，由谁来授权这种使用，并确保上述场景得到解答，并确保数据希波克拉底誓言得到遵守？


    ## 数据收集、使用、共享与政策


    帕洛奥图的投资银行家 Walid Khiari 在一天早晨早餐时向我解释道：“旧世界政策驱动采用。新世界是采用驱动政策。”


    有人用 `Uber` 吗？在超过 200 万澳大利亚人下载 `Uber` 应用并积极使用该服务之前，政府尚未就其对出租车执照牌（他们已将牌照卖给了出租车主）的影响进行过实质性讨论。现在，采用在许多地方是政策的驱动因素，这说明了监管机构往往到场太晚，或者说落后于社会需求。这场“派”可能是由大型科技公司举办的，他们正通过新的人员互动方式提取海量价值。虚假信息、过度的屏幕时间以及二级影响的后果被推给了社会。


    采用驱动政策对社会来说并不是一个健康的状态，我们需要监管机构站出来，进入技术发展的快车道。为下一代 AI/数据/技术公司如何使用数据立法，最佳时机是在开始之前，而不是当数十亿每天使用它时。


    当社交媒体开始时，有任何监管机构为这个新世界做好准备吗？哪些政府部门在思考将流动的数万亿数据点，以及所有者可能拥有的预测性和成瘾性属性？


    现在，有了像 `OpenAI` 及其 `ChatGPT` 输出等工具，对版权以及法律远落后于采用周期的其他领域的担忧日益增加。如果你是一个作家或内容创作者，你的作品出现在
    `OpenAI` 中的几率有多大？概率是，你的内容现在进入了庞大的、可以被抓取和使用的“内容大汤”中。`Amazon` 有许多由 `AI` 编写的新书目待售；其中很大一部分源于
    `AI` 对现有作者作品的观察。*我强迫机器人写了这本书*（I Forced a Bot to Write This Book）就是其中一个标题。


    关于我们是否应该暂停 `AI` 发展的辩论是一个值得进行的理性辩论。它似乎忽略了用例的紧迫性。如果用例是为了帮助人类，我们会想要暂停它吗？或者如果用例是制造分裂、仇恨和虚假信息或其他不良用例，也许我们应该暂停。例如，如果
    `AI` 可以帮助识别前癌变的病灶，这与导致青少年抑郁的用例大不相同。


    监管机构在方面的思考还非常落后，我们需要在 `AI` 规划桌上有更多的监管人员。


    被遗忘权现在已成为几个国家的法律。只有在计算机可以记住一切之后，这项权利才变得需要。现在我们有了可以检测人类情绪的 `AI`，而这种情感观察的使用存在滥用风险。目前对这些许多
    `AI` 进展还没有政策回应。开发用例是关键。


    开发 `ChatGPT` 的公司 `OpenAI` CTO Mira Murati 最近对该机器人表示了担忧，并说 `AI` 可能会被滥用。“[AI]可能会被滥用，或者被坏分子利用。因此，关于如何在全球范围内治理这种技术的使用存在问题。如何以符合人类价值观的方式管理
    `AI` 的使用？”她在接受*Time*杂志采访时问道。Murati 补充说，`AI` 应该由政府进行监管。


    在一个标题为“AI 的麻烦”（The Trouble with AI）的 Sam Harris 播客中，他与《重启 AI》畅销书、`Geometric Intelligence`
    创始人 Gary Marcus 以及伯克利大学计算机科学教授、人类兼容 AI 中心主任 Stuart Russell 进行了对话。这是一个长达两小时的播客，是关于
    `AI` 挑战以及我们在通用人工智能（AGI）方面进展的迷人对话。


    以下是其中的一些关键要点：


    1. 在数百万或数十亿人测试 `AI` 的后果是不符合伦理的。我们不会在食品或药物领域允许这样做。那里有可执行的监管规定和风险缓解措施。然而，目前我们允许科技公司在野外进行研发，而除了声誉后果之外几乎没有其他。

    2. 停止研究非常难以执行和应用。但确实发生过——50 年前，基因工程师热衷于改善人类基因库，但到 20 世纪 70 年代中期，他们退缩了。目前还没有人类克隆。我再次强调，这取决于用例，因为使用
    DNA 修改癌细胞正在发生，并且并不被视为像克隆军那样的威胁。

    3. 对任何真正的 `AGI` 时间线的观点各不相同。显然无法知道它何时以及是否会出现。各种专家确实认为它将以某种形式出现，并指出到目前为止 `AI` 的推出并不顺利，缺乏深思熟虑的监管对于可能等待的
    `AGI` 来说不是一个好迹象。


    我好奇有多少监管机构参加了西南音乐节（SXSW）来观察新产业的诞生，或者订阅 `Crunchbase` 来跟踪早期资本的分配情况，以及这些交易下游对社会等待着什么。现在是时候要求这些业务的企业家提供更多了，以确保他们的业务符合人类的利益，并要求监管机构提供更多，他们需要走在前沿以保护社会免受坏分子和意外后果的影响。


    对于如何收集、使用和共享数据，预期正在快速变化，既包括数据所有者个人，也包括积累并使用数据为客户提供服务的公司。随着客户对其数据价值的了解日益深入，机构有责任确保数据符合用途，且这种用途不能仅仅是利润高于客户或社会的利益。


    共享数据的大型生态系统已形成巨大的数据湖和日益巨大的海洋。


    一些具有最高标准，在使数据去标识化、符合隐私规定和按照最高标准加密方面投入了大量努力，获得了 ISO 评级和其他指标，以证明符合 GDPR 标准等。


