    \ he asks, ‘How do you plan to stop Amazon from selling that better and cheaper\
    \ and with faster delivery than you?’ If their answer is unsatisfactory, he puts\
    \ in place share deals that bet on the decline of their stock. He was flabbergasted\
    \ that so many CEOs rarely have a satisfactory answer. ‘They give me some fluff\
    \ about customer-centric initiatives, but most have not acted in a scaled way\
    \ to put data and AI at the heart and spine of the company.’ The boards of these\
    \ organisations are in this right now and directors and executives need to make\
    \ the organisation own its purpose, its ethics and the connection between its\
