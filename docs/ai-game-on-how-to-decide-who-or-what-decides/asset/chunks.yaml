    It is not about taking risks with cyber theft, open APIs, sloppy data hygiene,
    training or cyber security. It is about data safety and alignment with a use case
    that takes you to the future before your competitors find the upside.


    It boils down to this: if you lock the data up, you lose; if you let the data
    rip, you lose.


    That is why we need leaders who are thinking about what the AI: Game On future
    is all about. With real board engagement in the space, and thoughtful customer-centric
    use cases. Get help. Just like you would with any other issue as complex as AI
    and data. Data and AI can’t be sugar-coated as easy to enable and win with in
    an ethical manner. Anyone who tells you it is easy is not doing it right.


    Be curious and foster a culture that is curious. As Albert Einstein said, ‘I have
    no special talents. I am only passionately curious.’


    The late astronomer Carl Sagan said, ‘Somewhere, something incredible is waiting
    to be known.’ And that is a great way to start a data strategy.


    ![Image](images/himg-42-1.jpg)


    In the next chapter I’ll delve into the ethics of data and AI, including who owns
    data, how companies can use it, and what you can do to protect it and share it
    if you want to. I’ll also discuss AI and the pitfalls of waiting for regulation
    to catch up.


    ## Chapter Takeaways


    1. Data is too important to be left to the data department; boards and management
    need to inform themselves.

    2. The failure of `BrisConnections` demonstrates the importance of auditable predictions
    using contemporary data science and analytics.

    3. AI is transforming healthcare and finance, increasing capability and accuracy,
    and moving towards a customer-centric approach. Other sectors are following.

    4. The Royal Commission into Misconduct in the Banking, Superannuation and Financial
    Services Industry resulted in changing the ethos to ‘let the seller beware’.

    5. An organisation’s ability to learn and translate that learning into action
    is the ultimate competitive advantage, and data analytics and AI thrive in capturing
    signals of customer needs.


    ***


    # Chapter 3: THE IMPORTANCE OF TRUST


    A letter from the Australian Institute of Company Directors (`AIDC`):


    Dear Tim,


    Today more than two thousand people were left disappointed when the stream failed
    for our LinkedIn Live launch of the new Cybersecurity Governance Principles.


    We sincerely apologise to all of those in attendance.


    This appears to have been a technical failure, and the experience was not consistent
    with the high standards you rightly expect from us. We are working with LinkedIn
    and our providers to understand this issue. A recording of the event is available
    below.


    ### Malicious links


    We also want to draw attention to suspected malicious links that may have been
    posted in the event chat during the 15 minutes before the event was cancelled.


    * These links may have led to pages requesting personal information.

    * These links were not posted by the `AICD`.

    * If you clicked on such a link and entered your details, you should contact your
    financial institution. We would be grateful if you also let us know so that we
    can support where possible.

    * If you did not, then you do not need to take any action.


    There is no connection between the links that appeared on the LinkedIn platform
    and the `AICD`’s data, which remains secure.


    While it is possible that hackers targeted the event with malicious links, there
    is no known connection between those actions and the failure of the event to stream.


    In response to this issue, we are working with the Australian Cyber Security Centre
    and LinkedIn to investigate the matter.


    ### Cybersecurity Governance Principles


    While no organisation is immune from cybersecurity risk, we are disappointed that
    the launch of the Cybersecurity Governance Principles was not able to be brought
    to you live.


    We hope you find the principles themselves to be valuable in managing security
    threats, and that the recording below provides insight into applying the principles
    in your own context.


    Some time ago I joined a director training session on cybercrime hosted by the
    Australian Institute of Company Directors (`AICD`). As you can see from the above
    letter, it didn’t go so well, as it seemed the event was pulled because of malicious
    activity. The `AICD` works hard to help directors become more professional and
    informed. They were the victims of a cyberattack. The email above was sent out
    after the failed event. When this arrived my first thought was, ‘Is this real
    or is this spam? Is it a real threat?’


    The use and misuse of data is now the topic of the day in all boardrooms that
    care about where their business is going. The old adage ‘Only two things in life
    are certain: death and taxes’ needs an update. A friend of mine in Silicon Valley
    Ramneek Gupta, suggested a new version: ‘The two things in life that are certain:
    death and a cyber breach.’


    Boards should now be asking these sorts of questions:


    * What data do we hold?

    * Who has access and why?

    * What parts of this data is mission-critical to our operation and what could
    we let go of?

    * Why do we hold it, e.g. for a regulator, for our use, innovation, other?

    * What benefit does the customer get from this?

    * How is it encrypted?

    * How is it protected?

    * How is it backed up?

    * Have we tested where the vulnerabilities are in our protection of the data?


    The irony of most of the data crimes – ransom attacks and the like – is that the
    thieves are after personal information (PI): identity data, credit cards, medical
    records, passport numbers, Medicare numbers, even information about your employer
    and the like. Yet, in many of the most powerful use cases in analytics, the engines
    don’t need `PI` to predict next best offers or to solve pain points. At the time
    of writing, Amazon’s personalisation engine has not been hacked and it’s the summary
    of billions of purchase patterns.


    As cyberattacks increase in frequency and scale there is an increasing breakdown
    in trust between companies and their customers and the community. In 2022 alone,
    here in Australia, we have witnessed major cyberattacks on `Optus`, `Medibank`,
    the `AFP`, `Vinomofo` and others.


    In her illuminating book *Who Can You Trust?: How Technology Brought Us Together
    and Why It Might Drive Us Apart*, the rapid trajectory of consumers adopting digital
    business offerings has been incredible. Think of the self-services via intuitive
    apps for the likes of `Airbnb`, `Uber`, `Waze` and `Spotify`.


    The harder place to compete is in the hybrid area, which requires great digital
    capability and human care when needed. `Apple` does this brilliantly. You can
    do so much with them digitally. However, if you get to the point where you need
    real help, you can log a callback and a human being will call you at your convenience.
    I’ve used this option a couple of times myself for more complex issues and it
    illustrates why `Apple` is one of the true leaders in customer care. They also
    have retail stores with staff who are well equipped to help customers. Not surprisingly,
    this leads to loyalty and a massive gain in their market valuation. At the time
    of writing, `Apple` was the most valuable company on the planet.

    '
