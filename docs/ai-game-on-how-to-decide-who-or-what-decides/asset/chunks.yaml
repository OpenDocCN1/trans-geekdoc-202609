  raw: 'It is hard to get an accurate view of the real number of staff working at
    OpenAI, the company that enabled the ChatGPT-3 generative work. LinkedIn in March
    2023 showed about 570 people. Think about that from a productivity perspective.
    Fewer than 1,000 people have built a tool that is changing the world at a speed
    like nothing before. Now it may prove to be a moment in time; however, its impact
    will be long-lasting in terms of what it has done to the business world and the
    public’s imagination of AI. IP and data outpacing labour and capital is evident
    in many areas and will grow from here.


    For example, the cross-sell algorithm of Amazon generates approximately 35% of
    all Amazon retail sales. That is, when you buy a book, guitar or anything on Amazon,
    and the site responds with ‘People who bought this book also bought …’, that recommendation,
    which automatically and continuously adjusts in response to ongoing customer choices,
    drives an incredible volume of new sales. In dollar terms Amazon generates $48
    billion from this algorithm.^([⁴](#fn4))


    So, it could be argued that Amazon-held IP about customers and its algorithm is
    now worth more than almost every retailer on the planet, with the exception of
    giants like Walmart. IP and data are replacing labour and capital as the cornerstone
    of value creation and directors and executives need to be aware and forearmed
    about how they take their companies into the AI: Game On age.


    While talking to a leading investment banker in the US, his thesis is to short
    companies that sell anything with a barcode. When he interviews CEOs of big retail
    companies, if their products are sold with a barcode, he asks, ‘How do you plan
    to stop Amazon from selling that better and cheaper and with faster delivery than
    you?’ If their answer is unsatisfactory, he puts in place share deals that bet
    on the decline of their stock. He was flabbergasted that so many CEOs rarely have
    a satisfactory answer. ‘They give me some fluff about customer-centric initiatives,
    but most have not acted in a scaled way to put data and AI at the heart and spine
    of the company.’ The boards of these organisations are in this right now and directors
    and executives need to make the organisation own its purpose, its ethics and the
    connection between its data-enabled spine, ethically based heart and all stakeholders.
    Lose the heart and you are a data-enabled AI pariah waiting for your media firestorm.
    Do too little and you are Kodak meets Blockbuster. Bed Bath & Beyond is a great
    case study. I know someone who worked in their analytics team in 2017. He became
    frustrated as the team leaders were too sure they had it all covered, claiming
    all this AI use, personalisation optimisation and more. Trouble was no one told
    the customers. A PowerPoint deck claiming you have this covered will not fly.


    ‘Everybody knows that the guy with the best data on their customers’ needs will
    win.’ These words were said to me in a meeting in 1997 in Seattle at Microsoft
    head office. The executive was trying to work out how to capture the signals from
    millions of customers using his product so he could design a better product for
    them. The internet was still largely dial-up, slow and clunky. Data strategy was
    not something you heard about in 1997 but these words stuck in my mind as the
    beginning of something significant.


    Imagine trying to learn, in real time, what 200 million plus people were doing
    with your product in 1997. Back then it was like saying you were working on time
    travel. This approach, then so unique, has proved to be true and essential for
    survival. Yet many organisations nearly three decades later are still working
    on how to find their data strategy from real scaled customer insights. How is
    your organisation diversifying from commoditised legacy products that will be
    challenged in the future by data AI-enabled competitors? That is what boards and
    executives need to be asking.


    The recent incredible advancements in AI will accelerate the advantages of companies
    that have powerful proprietary data sets. One of the world’s most notorious stock
    pickers Cathie Wood, claimed in February 2023, ‘We believe that the hidden gems
    that will benefit the most from artificial intelligence are those companies with
    proprietary datasets.’ They claimed Tesla as a good example due to its data on
    roads and driving behaviours. Note, this is not investment advice!


    The a16z podcast in January 2023 asked some of the Andreessen Horowitz investment
    partners for their themes on 2023. They said, ‘If a company doesn’t have an AI
    strategy, it should really be thinking about one yesterday.’ The podcast made
    the point that they see lots of 10–100x productivity in organisations’ back of
    house with AI. Procurement, finance and other areas, not just on the customer
    side. As AI use becomes table stakes you will need your own strategy to harness
    its power.


    To not ask and act on these sorts of questions is going to limit your business
    as we enter the AI: Game On world.


    Take the San Pellegrino I am drinking while writing this. Anyone can type it into
    Google, add ‘lowest price’ to their search and it will find the best offer as
    defined by Google SEO and paid ads. Strategy guru Michael Porter said, ‘Business
    needs to decide to be cheap or different’; pain comes from an undifferentiated
    offering. We are now seeing different combined with cheaper. The low price – fast
    delivery offerings of giants such as Amazon are hard to beat, and customers will
    migrate when economic benefits accrue to them, especially from a trusted provider
    that removes friction from the purchase.


    What does San Pellegrino know about its customers? It knows how many bottles in
    which sizes and flavours are made and sold in which regions by which retailers,
    but what can the company know about its customers’ habits, where they drink San
    Pellegrino, for what purpose outside of thirst? Unless they augment their own
    warehouse data they will not know what customers eat when they’re drinking it,
    how old they are, whether they’re loyal or switch with the alternative sparkling
    waters, how price sensitive they are, or how much they typically consume each
    day. Nor what impact a SodaStream in their kitchen would have on that home’s consumption.
    Is San Pellegrino mainly consumed just when entertaining? Such specific consumer
    insight from real data relies on the producer having a relationship with each
    customer, a direct line of sight to the customer via externally associated data.
    Supermarket loyalty cards were developed for this reason and do a good job if
    accompanied by great software and analytics.


    That’s why, if your business has very little interaction with or ‘signal’ from
    your customers, you should be alarmed and start devoting thought and resources
    to answering questions such as: How do I create signals directly with my customers?
    What products could I invent that will allow my customers to interact with me
    in a way that will increase customer signals, and what benefits can I provide
    to my customers from this signal? Make sure you answer this last question or you
    will be creating customer annoyance, not benefit. We are all inundated with apps,
    logins and loyalty programs all too often with nebulous value to us.'
