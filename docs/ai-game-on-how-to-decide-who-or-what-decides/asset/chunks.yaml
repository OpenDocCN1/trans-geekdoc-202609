    not see that in 2023 AI will eat software, as claimed by Sarah Wang in a recent
    podcast.^([^(14)](#fn14))


    Self-adapting algorithms (SAMs) have been around for some time and now it is common
    for code to write code. In February 2023, Microsoft claims more than 100 million
    software developers are now using GitHub Copilot. The type of tasks you aim that
    code at, and for what purpose, is increasingly going to decide your corporate
    outcomes and reputational risks. It ends up ultimately as a board responsibility,
    because it if goes wrong the directors will own the downside, perhaps more than
    they might own the upside. Increasingly, the destiny of the organisation will
    be tied to code, how this fulfils the organisation’s mission, its purpose, and
    how that all aligns with society’s expectations. It is hard to imagine for some,
    but it is the new reality.'
