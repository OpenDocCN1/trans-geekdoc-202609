- fmt: "\nToday, humans are making more and more decisions directed and augmented\
    \ by machines, and in doing so we are increasingly abdicating our decisions to\
    \ these machines. Think about your average day. Your newsfeed, drive to work or\
    \ commute on public transport, the weather, TV show recommendations, and increasingly\
    \ romantic potential partners are all outsourced to AI for many people. We hand\
    \ off decision-making frequently, already, and it’s growing fast. Some of our\
    \ decision-making here will range from good, bad to ugly, and the use case and\
    \ ethics of the providers will matter like never before. How will these boards\
    \ and executives be deciding who or what decides is going to impact every person\
    \ on the planet.\n\n## How do we decide who or what decides?\n\nA *Wired* article\
    \ in February 2023 titled ‘The Age of AI Hacking Is Closer Than You Think’ was\
    \ subtitled ‘Algorithms struggle to understand human ambiguity’. But such quirks\
    \ are a flimsy shield against the threat of artificially intelligent hackers.\n\
    \nBruce Schneier, a renowned security technologist, wrote the following:\n\n>\
    \ While a world filled with AI hackers is still a science-fiction problem, it’s\
    \ not a stupid science-fiction problem. Advances in AI are coming fast and furious,\
    \ and jumps in capability are erratic and discontinuous. Things we thought were\
    \ hard turned out to be easy, and things we think should be easy turn out to be\
    \ hard.\n> We need to start thinking about enforceable, understandable, and ethical\
    \ solutions, because if we can expect anything with AI, it’s that we’ll need those\
    \ solutions sooner than we might expect.\n\nSchneier went on to point out AI in\
    \ the hands of the wrong people can be tasked with some very nefarious tasks.\
    \ He used the example of aiming AI at tax laws looking for loopholes, resulting\
    \ in thousands of new loopholes being found. Society is simply not ready for what\
    \ could be done here. Hackiing up until now has been done by individuals – we\
    \ are entering a time when it can be done and created by machines.\n\nSome questions\
    \ to keep in mind on this journey:\n\n* When do we delegate to the machine?\n\
    * When do we step in to take 100% human control?\n* What is the data we use when\
    \ we decide to ignore the data from the machines? How are you going to audit the\
    \ training data that led to the decision?\n* Many organisations are now educating\
    \ staff to make them aware that anything that goes into OpenAI is now available\
    \ for anyone else. What is your plan to stop this drift of IP?\n* What if a disgruntled\
    \ employee of KFC put the secret 11 herbs and spices up on OpenAI? You get the\
    \ point.\n\nThere are more questions:\n\n* How do we govern the data sets of our\
    \ decisions?\n* What bias do we bring to the table or the machine?\n* How do we\
    \ assess our own bias and with what data?\n\nEric Schmidt suggests there are a\
    \ few key themes that are driving the frontier of AI.\n\n1. **Machines that can\
    \ see.** Machines see better than people, from X-rays to driverless cars, and\
    \ this computer vision is changing athlete management. Using facial recognition,\
    \ managers can use real-time analysis of their athletes during games to sharpen\
    \ training plans and help avoid injuries. Mustard, a baseball app, is one current\
    \ example that employs computer vision.\n2. **Deep learning.** One of the more\
    \ famous examples of AI in recent years was when the machine defeated the world’s\
    \ best players, `AlphaGo`.\n3. **Predictive models.** The use of AI for pharmaceutical\
    \ drugs has helped transform discovery: ‘Screening is not new, but until now,\
    \ molecules were represented as vectors. However, the new neural networks can\
    \ learn these representations automatically.’\n    * At MIT, computer scientists\
    \ and synthetic biologists achieved a very complicated experiment, using 100 million\
    \ compounds to figure out which would create a reaction for antibiotic: a new\
    \ drug called `Halicin`.\n    * The generative AI sector is thriving, with billions\
    \ of ventures forming to capitalise on `OpenAI` and other technology. Writing,\
    \ music, art, business, science and more are going to be influenced. There are\
    \ already platforms available including `Jasper`, `Simplified` and `ContentBot`.\
    \ For example, `OpenAI`’s `DALL-E 2` creates high-resolution concept art from\
    \ text commands. Regarding coding, AI is having a major impact. In November 2021,\
    \ a third of the code on `GitHub` was being written with `Copilot`, a `GPT-3`\
    \ tool that had been created only months previously.\n\nWith the size of deep\
    \ learning models increasing exponentially they will impact and transform every\
    \ part of scientific research and discovery we know.\n\nAs we head to a future\
    \ that will be enabled with data, fed into AI at increasing speed, we are going\
    \ to need real care in our governance.\n\nAs an organisation, if you start with\
    \ the premise that the system should be designed so that it optimises along the\
    \ data Hippocratic oath first, and do no harm, you will be starting in a good\
    \ place.\n"
