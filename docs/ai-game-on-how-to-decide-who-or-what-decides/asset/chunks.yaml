    # 第 7 章


    # 整个公司的核心数据


    **“为你的客户寻找产品，而不是为你的产品寻找客户。”** – 塞斯·高登（Seth Godin）


    作为 NRMA 的主席，我有幸会会了世界上许多大型汽车公司的澳大利亚首席执行官。汽车行业是一个巨型行业，是大多数人一生中第二大的开支。然而，在 `Tesla`
    之外，真实的数据使用和深层嵌入的客户互动系统尚未开发完全。大多数传统汽车制造商由于糟糕的数据策略以及外包客户关系的经销商模式，与终端客户是脱节的。


    最近，我询问了某大型日本汽车公司的首席执行官，他们是如何根据车型和地区来预测销的。他说：“我们并不真的这样做，工厂在很大程度上向我们分配品牌、型号、配置和颜色。事实上，像澳大利亚这样的国家只是日本工厂产出的末端。”我当时大大震惊，原本天真地认为这应该是一个严谨的数据驱动过程，利用分析来预测不同地区的需求以构建出总预测。但实际情况是，一万公里外的工厂在产出汽车，而对市场真实的本地需求没有任何真实数据支持。优秀的高管尽最大努力通过电子表格和/或简单的需求预测工具以及经销商请求来将汽车分配给经销商。这与
    `Amazon` 使用专利 IP 来预测其数亿客户中谁会购买其数百万产品中的每种产品相比相差甚远。


    在当今数据丰富的世界上，有一种方法可以在去标识化的概率基础上预测每个家庭对新车的需求。这可以在不使用个人信息（`PI`）的情况下完成。所有现有车辆的位置是已知的，注册数据库、经销商位置以及所有权的流转都是可知的，这些信息可以输入到购买预测中。


    可以为每个家庭创建一个购买新汽车的倾向评分。房屋的价值是车型的一个替代指标。拥有 2000 万美元海景房的人可能开着一辆 15 年的 `Mazda`，但从数学上来说，这种类型的房主更有可能拥有一豪华车。我与一位才华的数据科学家交谈，他说他可以建立一个模型，基本上回答这个问题：基于所有可用的去标识数据集，这
    10 户住宅的组合今年购买（例如）`Toyota Corolla` 的概率有多大？对所有房屋重复此操作，你就创建了该品牌汽车按地区划分的预测模型。你可以针对真实销售数据运行此模型并不断提高其性能。这使得工厂的分配变得更好，重要的是，让国内按地区的分配更具相关性。这就是
    `Walmart` 这样的零售巨头看待这一挑战的方式——使用数据来按地区、时间、季节和一天中不同时段预测其库存每件商品的需求。如果猫粮值得这样做，那么价值更高的汽车就更值得这样做。如果组织的文化不是数据驱动的创新，它最终将面临数据驱动的新入场竞争者的挑战。


    高预测性模型改变了行业的成本曲线，让客户能够在合适的地方找到他们想要的东西。


    我们正处于一个新的进化模型的节点，数据已经进化到占据了主导地位。从源头捕捉信号并使组织做出响应正是我们需要的。获取数据是一回事；创建一个能够有效响应的组织要困难得多。


    在写作此时，`Tesla` 正在向非 Tesla 车辆开放其部分充电站。对 `Tesla` 处是更多的可用充电站。其他汽车公司在很大程度上仍然与终端用户脱节。


    在他的《后疫情时代》（*Post Corona*）一书中，`Scott Galloway` 指出：“有两种基本的商业模式；第一，公司出售东西的价格高于其制造成本。`Apple`
    拿价值 400 美元的电路和玻璃，通过出色的广告赋予其地位感和性吸引力的承诺，并向我收取 1200 美元购买 iPhone。第二，公司可以赠送东西，或以低于成本的价格出售，并向其他公司收取访问其消费者的费用。”


    他的观点是有效的，我们每人为了允许使用我们的数据而与公司进行的交易都是复杂的。从最简单的的话来说，你需要确保客户获得了真正的价值，并且在这个过程中没有伤害他们。


    `Galloway` 将世界分为两类公司：一类努力保护客户数据并将数据策略视为美德的公司；另一类则是“数据游戏开始’，利用所有客户数据来提取最大价值。公司需要考虑的关键因素是数据用例、对客户的透明度以及客户从中获得了什么。


    **“如今的每家公司基本上都在做数据业务，他们将需要 AI 来文明化和消化大数据，并从中得出意义——没有 AI 的大数据是一个大大头疼的问题。”** – `Kevin
    Kelly`


    越来越多的公司将人工智能嵌入到他们的产品、服务、流程和决策中。AI 如今已从“可有更好”转变为“必不可”的技术，然而 `BCG` 在最近的一篇文章中指出，“许多公司都投资了
    AI，但只有 11% 的公司从这些投资中实现了显著价值。”


    '
- fmt: '

    In the company I was working with at the time (Quantium) we developed the view
    that if the C-suite sent you to the tech team, it was a real indicator that the
    business was in trouble. The C-suite were hoping they could delegate this key
    strategic initiative to the tech team. Today AI adoption, data use, customer-centricity
    and governance are at the forefront of many businesses and key agenda items for
    boards.


    ## Data and AI strategy are now the business strategy


    Data strategy now feeds into the AI playbook. It is evolving so fast with such
    profound consequences that it must be the central business strategy.


    Businesses are now in a place where they do not need a data strategy within their
    business. They need a business strategy, driven by data, enabled with AI that
    guides all strategic initiatives, digital or not. As McKinsey noted ‘The CX programs
    of the future will be holistic, predictive, precise and clearly tied to business
    outcomes.’


    Over the last 15 years I have presented to hundreds of board directors on what
    the boardroom dashboard will look like in the next few years. The key metrics
    most businesses run by and report to have changed little over the last 20 years,
    even though their enterprise has changed dramatically. The bulk of board reports
    still don’t focus on the future intentions and behaviours of their customers –
    that is, harnessing the predictive insights of data. Next time you are preparing
    a board report or you receive one ask, ‘Where is the customer in all this?’ and
    see what response you get.


    When data is this accessible and dynamic, we can envisage different types of board
    and executive discussions. What are the customers doing with our product? Where
    do they go when they leave us? What did we do that led to growth or contraction?
    You can now see and hear actual customer conversations with your field force with
    opt-in approval. These can be made into text summaries, and with sentiment analysis.
    There are some progressive companies that, on occasion, let their front-line team
    request to record conversations with the customer, with the explicit reason that
    they believe the CEO should hear it. No filter can very powerful.


    John Chambers, who was chairman of Cisco when I spoke with him a few years ago,
    understood the challenges of changing to a data-led organisation:


    The hard part is how do you change your organisation structure? How do you change
    your culture to be able to think in terms of outcomes for your customers? Today,
    you’re talking about digitisation being an integral part of the fabric of a company’s
    business strategy or the way it interfaces its supply chain with its customers.
    Not enabled by technology – technology will become the company.


    The chart below is a real case study where a retailer used customer behavioural
    data to frame up an acquisition target. It was not an investment bank’s pitch;
    it was an acquisition driven by customers’ needs. The target was selected from
    de-identified bank data that showed purchase behaviours.


    Finding merger targets is still largely an analogue old-school business with people
    in suits talking about good ideas over lunch and coffee in the main. Algorithmic
    merger targets are coming that look at the logic in a data-driven way around customer
    fit and other parameters.


    ![How data driven M&A activity would occur](images/himg-117-1.jpg)


    ### How data driven M&A activity would occur


    ## Data use in every part of your business


    Marketing managers’ roles are unrecognisable from what they were at the dawn of
    the data revolution back in the late 1980s and ’90s. Marketing teams from decades
    ago spent time at long lunches with ponytailed creatives talking about TV ads
    and magazine campaigns (I should know – I was part of this and it was fun!). Today,
    leading marketing teams and agencies are data-driven. If you want to understand
    marketing in a data-driven world read Sinan Arai’s book *The Hype Machine* where
    he explores the science behind the new technologies and modes of communication
    underpinned by data – personalised mass persuasion via integrated digital marketing.
    I know one highly successful insurance company where the marketing director is
    an actuary, studying response rates, deploying algorithms, buying audiences in
    a bidding machine, more like a Bloomberg terminal for stocks at the speed of light.
    Many are using third-party data houses and collaborations to harness the power
    of massive, interconnected data sets.


    Nineteenth-century Philadelphia retailer John Wanamaker supposedly said, ‘Half
    the money I spend on advertising is wasted; the trouble is I don’t know which
    half.’ This was how marketing was seen. Today, with real-time attribution, wastage
    can and should be much less and targeting can be very sophisticated, provided
    you are not being sucked in by measuring and paying for the wrong outcomes. (See
    Arai’s commentary in the footnote link about the gross overselling of the effectiveness
    of digital marketing, by a factor of three and sometimes by a factor of 10.)


    You can easily buy an audience for people who like orange juice for breakfast,
    aged 45–49 and live in an apartment within 200 metres from your shop. But try
    to find out who in your team is overworked, and will resign next week. Yet the
    data to predict this is available, sitting in a server within HR departments not
    able to see the information until the resignation hits their desk.


    HR is in for large-scale change as AI, scaled data and predictive capabilities
    are applied to this most ‘human’ of functions – managing people. I’m excited about
    this area and have invested in some early-stage companies that have different
    offerings for enterprises to use data allowing their teams to enjoy their work
    more, perform at a higher level, and feel more connected and supported.


    The CEO of one of the many new companies in this space recently said to me, ‘We
    are excited about what can be done with AI and analytics in HR. When you look
    at the other departments like procurement, marketing, new product development,
    we are seeing AI and large-scale predictive analytics being applied fast, yet
    the HR department is still using white boards and emails in many cases.’


    The need to better align and connect with employees has been exacerbated by Covid-19
    and what is known as ‘the great resignation’. After being forced to work from
    home during the height of Covid and subsequent shorter lockdowns, many employees
    are now demanding the flexibility to build in a mixture of work from home and
    in the office. One AI-driven tool I have seen compares hybrid working days’ metadata
    with days of flows where all the staff are on-site. They found some interesting
    insights right off the bat. Small short-term projects can be done with WFH very
    well. Long-term, complex collaborative projects were very unproductive in the
    WFH world. This is metadata from emails, slack channels and delivery of outputs.
    We know that for many companies if you don’ offer this flexibility, employees
    are leaving. Your most talented staff will be the ones who will get the most offers.


    The real issues around data, AI and human management are how to design systems
    to make them fair, to avoid unintended biases, and to ensure they don’t become
    a management surveillance mechanism. That will be a one-way ticket to mass resignations.


    HR supported by AI will soon be capable of asking and answering a wide range of
    more nuanced questions. For example:


    - How can we measure the candidate’s capacity to learn and thrive here?

    '
