    越来越多，我们将会看到数据驱动的资产负债表。从历史上看，每家公司股价和估值的依据都是折现现金流、内部收益率、营收增长、`P/E ratio`、`EBITDA
    margin`、`EV/EBITDA ratio`等的组合。这些都是基于关于未来收入和成本的模型。未来收入来自何处？客户！如果你真正理解客户以及他们的需求，你就能更好地预测收入，从而预测估值。这么说，如果你处于一家拥有预测、预算和业务计划的公司，你就是在预测客户的支出。然而，尽管投入了这么多精力，仍有许多公司未能关注构成未来现金流的客户行为驱动因素。这种情况正在发生变化，并将使客户预测在董事会中以新的方式受到重视。


    想象一下，如果你的业务对未来客户行为有一个更准确、更具预测性的模型


    一些世界领先的数据/AI 驱动型公司以及股东、投资者、基金经理和金融机构已经在使用一种模型。它被称为基于客户的公司估值（`CBCV`），基于关于客户的深度数据。`哈佛商业评论
    (HBR)` 提到的一篇文章提到了美国 `Revolve` 的 IPO，这是一家电子商务平台，通过精选奢侈服装、鞋子和配件来服务千禧世代和 Z 世代消费者。该
    IPO 定价为 12 亿美元，并在首日暴涨 89%，使其估值达到此前 12 个月收入的 4.5 倍，“更像是一家科技公司而不是服装公司”。


    使用数据为资产定价正在兴起——这是另一个待解决的治理问题。签署资产估值的董事需要了解使用了哪些数据以及这些数据对估值产生了什么影响。


    如果你没有遇到过 `CBCV`，也许你听过 `C3`（客户群图表）。这些图表随时间跟踪按获取群划分的收入，并显示总客户支出如何随着每个群的增长而变化。`Slack`、`Lyft`、`Dropbox`、`Farfetch`、`Backblaze`
    和 `ZooPlus` 等公司将 `C3` 图表整合到其季度、半年年度报告中，以便让股东和投资者更好地评估其未来业务。


    数据和 AI 为新忠诚度经济中的客户评估带来了更高程度的精确、问责和诊断。`Netflix`、`Verizon`、`Spotify`、`Activision`、`Blizzard`（2023
    年 10 月以 680 亿美元被 `Microsoft` 收），


    作为业务中的执行官、董事或领导者，你可能的问题是：AI 的伦理使用在哪里带来最大的竞争优势？是在产品、服务、流程、决策、新业务模式中，还是以上所有？


    AI 已经从简单的发现关系和预测趋势迁移。它现在能够通过分析你的海量数据——以及文本、语音、图像、数字内容、新闻推送、社交媒体和全球数据库——来发现（预测）未来的变化。


    在 `John Chambers`  `Cisco` 全球主席期间与其交谈，他的观点（我也表示赞同）是董事会仪表板应该关注基于客户需求的未来事件，减少回顾“后视镜”的时间，花更多时间预测组织的下一步最佳行动。上个月的静态历史数据将很快转变为实时数据的沉浸式虚拟演示——一个控制室，在那里流式数据是活的，你可以听到客户的呼声，感受到需求的强度以及市场波动的细微差别。


    未来的董事会将将不再仅仅是幻灯片，而更像是一个沉浸式的飞行模拟器，拥有实时的以客户为中心的信息。


    ## 利用 AI 作为业务转型的机会


    `BCG` 提供了一种大规模采用数据和 AI 的模型。这是一种基于来自 29 个行业和 112 个国家的 3000 名受访者的广泛研究的方法论。他们的模型关注两个核心主题：将
    AI 嵌入你的业务中，并通过三个核心构建模块：数据、处理和行动为你的运营模型做好准备。


    `BCG` 的模型提供了解锁 AI 财务收益的四步法，涉及重新想象你公司处理数据的方式，以及从试点扩展到规模的能力。该模型如下：


    1. `Discover AI` – 在关键领域启动试点。

    2. `Build AI` – 嵌入整体战略；重新想象数据的使用；投资于数据能力建设、技术、算法以及开发技术 AI 技能。

    3. `Scale AI` – 更广泛的用例和解决方案。将 AI 嵌入生产和消费端的流程和解决方案中。

    4. `Organisational learning with AI` – 为人类与 AI 之间的相互学习创造机会。


    ### 外部数据和数据生态系统


    领先 AI 公司正在利用自身数据的见，以及在伦理和数据使用护栏内第三方数据公司的数据。如果你的第一方数据不可用或无效，你可能需要其他数据集来帮助发现客户未被满足的需求。注意，第一方数据应该是你的首选，因为它是你自己的，而且通常对你的组织是唯一的。所以，如果你可以访问第一方数据，只要它是通过伦理收集的，你就应该将其视为资产。越来越多的公司基于数据与计算互联网（`IoDC`，通常被称为协作数据生态系统）建立业务。`Woolworths
    Australia` 通过与 `Quantium` 的合作实现了这一点，现在 `CBA` 和 `Telstra` 也与 `Quantium` 建立了合企业。这些允许他们自己的业务需求进行规模构建，也允许合作伙伴这样做。`Amazon
    Web Services (AWS)` 提供了这样的生态系统，`Teradata`、`Databricks`、`阿里巴巴` 和 `BaseBit` 如此，此外还有健康、教育和政府领域的重要生态系统。


    协作数据生态系统的处是巨大的。`Capgemini` 的一份报告指出，“使用七个以上数据源的组织其固定资产周转率几乎是不使用任何外部数据进行决策的组织的 14
    倍，市值是其两倍”。


    ### 你测量什么你是什么


    没有背景和清晰度的数据几乎和不看数据一样毫无用。在最近的一个播客（`Pivot`）中，这类讨论直接引导我们走向关于数据使用和影响的问题：试图解决什么问题，哪些数据集帮助你解决该问题？


    随着数据变得更加透明和易于获取，想象新的业务用例并不困难。想象一种新型保险业务，你找到你的 `LinkedIn` 朋友群，这些人的经济状况可能与你相似。你知道这些人极不可能发生欺诈，并且在很大程度上是低理赔风险。这种模型可以发展到该群组实际上成为保险的承保人的程度。当我们进入一个
    AI 驱动的个性化机器人世界时，将开发出大量使用 AI 和数据的新方法。

    '
