  trans: '


    在当今的 AI 竞技世界中，已经有工具可以根据工龄、生命周期价值、最可能的来电原因以及最佳下一次对话建议对呼叫中心的每个客户进行评分，以帮助客户。


    ## 信号与噪声以及如何识别区别


    “从客户身上学到的比从竞争对手得到的得多。”—— `Michael Dell`


    来自客户的信号是黄金，而且一直一直是实现真正以客户为中心的关键。多年前我在杂志行业工作，当时澳大利亚最成功的编辑无疑是传奇人物内内·金（Nene King）。内内，周末会花时间待在超市里，观察女性在结账处拿起“她的”杂志（如《澳大利亚妇女周刊》和《女人的日报》），并向她们问诸这样的问题，例如：你为什么拿起这本杂志？封面上的什么促使你拿起它？你正在读哪篇文章？你为什么把杂志放了回去？那是模拟的客户反馈，其核心在于她痴迷于客户，以及最初是什么促使了他们拿起杂志并随后购买或不购买。


    蒂姆·费费斯（Tim Ferriss）在 2021 年采访了 `Dell Computers` 的创始人 `Michael Dell`。


    如果你有 10,000 家零售店，并正试图预测人们将进入这些商店并购买什么，你可以拥有非常复杂的 AI 并尝试猜测这一点，但归根结底这只是猜测，你必须筹备和准备各种事情并预测销售额，而结果将是错误的。而且，在某种程度上，需求会发生变化，意外之外的事情也会发生。然而，因为你与客户直接接触，你拥有清晰的信息，而且你的需求信号的质量是完美的。


    `Michael Dell` 进一步解释了那些正在寻找新方法从客户那里获取持续信号的公司，如何能够很好地察觉不断的需求，并解码客户的未来需求。


    乐事比萨（Dominos）是另一个例子。他们希望你在他们的 App 上购买披萨，因为他们想让你点披萨变得更简单、更便宜。他们想了解更多关于你的信息（你对披萨及相关产品的偏好、居住地、电子邮件、购买偏好等）。虽然他们渴望获取这些信息，但他们需要通过增加价值来关注客户的利益；否则客户就不会使用他们的
    App 在他们那里购买。从使用 App 的体验来说，以客户为中心的体验必须对客户是好的并不断改进。否则，随着竞争对手或新进入者创造更好的客户体验，公司将面临高客户流失率。


    所以，如果你打算为你的产品/服务开发 App，或者引导人们去你的网站/呼叫中心购买和支持，你最好确保这些互动在整个体验过程中真正增加了价值，而不仅仅是为了你自己的利益/削减成本。公司需要问一个问题：这里对谁受益最大，是组织还是客户？


    旧金的一位高管向我分享了这些：“你可以利用数据做四件事”


    1. 寻找客户。

    2. 留住客户。

    3. 理解他们接下来想要从你得到什么。

    4. 针对客户未来的需求优化你的资本支出（capex）。


    这些都是任务关键的。


    让我分享一个个人经历。我在悉尼西部的偏远地区有一栋度假屋，当时使用一家名为 `Activ8me` 的卫星公司，那是一家澳大利亚的小电信运营商（公平地说，他们很棒）。但我们刚刚连接了埃隆·马斯克的
    `Starlink`。


    在拨打 `Activ8me` 取消服务后，代表办理了手续，但从未问过我为什么要取消。`Activ8me` 错过了关键的客户信号，由于 `Starlink`
    技术的更好，这项业务不幸地遭受了严重打击。代表本可以问我：“你为什么要离开？我们做了什么让你想离开？我们该如何留住你？”


    结果如何？`Starlink` 已经在蚕食澳大利亚政府基于 `NBN` 和 `Sky Muster` 的服务，正如 2022 年 1 月《澳洲财经评论》(AFR)
    的头条所示：*埃隆·马斯克的 Starlink 全球互联网侵入 NBN 领地。*


    69% 到 80% 的在线订单被遗弃（未转化），


    考虑一下这一点。在 100 个进入你的网站准备购买的人中，只有 20–30 人完成了交易。如果你能理解为什么潜在客户没有完成交易，你就可以为组织带来显著更高的收入和更好的客户体验。不仅如此，你还可以改进库存管理，这对于客户和你的底线来说都是更好的。


    对于数字购物者来说，放弃在线订单的主要原因是结账时高昂额外费用（运费占大部分），其次是无效的折扣码、设置账户的要求以及流程过长。


    我曾与一些对遗弃率进行过深入研究的公司合作。在一个案例中，很大比例的潜在客户达到了三阶段流程的第二阶段，然后放弃了购物车。所以，应该问的问题是：第二阶段出了什么问题？是要求了太多信息吗？耗时太长了吗？人们在填写信息时是否卡住了？通过提许多问题、改变流程中的元素以及使用
    AB 测试，公司能够锁定痛点。


    利用和分析数据还具有观察匿名性的益处。这被称为“霍森效应”（Hawthorne effect），人们在知道自己正被观察时行为会有所不同。在调查中，有许多偏差可能潜入或跳出来：无响应、响应偏差（以人们认为调查/采访想听的话来回答）、问题设计和顺序、光环效应等。尽管如此，观察总比不观察要好。这也是为什么查看数据（去标识的信用卡、购物偏好、订阅、会员等）要准确得多，因为你没有干预客户的行为。


    `Dell` 知道客户想要什么，因为它每天每刻都在与客户直接接触。`Michael Dell` 会看到处理能力的需求曲线每分钟/每天都在上升，并询问可以做什么：我们可以构建出什么符合客户下一个视图的内容？


    ## 数据与注意力


    72% 的所有公司都在努力改进客户体验


    最好的客户体验往往是察觉不到的，因为是无摩擦的。当你流 Netflix 剧集时，它运行良好。这种体验很好，因为你不需要说话、走路、点击或聊天，它直接播放。如果你坐着，下一集就会在无摩擦模式下播放（我们现在称之为“刷剧”）。你的业务与低摩擦竞争对手相比如何？


    '
- fmt: '

    As new ways of understanding customers evolve, the process of finding them in
    market while you have their attention for your product or service is key. In a
    world where customers are always on via social media, carpet bombing of emails
    in our inbox, or streams of interruptions with app updates, prompts, recommendations,
    makes winning in the attention economy challenging. My son for example turns on
    ad blockers on all his web services. The only time he turns off the ad blocker
    is on a site where he cares about the person or product. He allows them to receive
    some ad revenue or data from him, but it’s a conscious choice about who he allows
    to commercialise his attention.


    No one in business can escape from the truth that what you measure matters and
    that the data and metrics you put in also matter. As Andrew Chen, investor at
    Andreessen Horowitz, former executive at Uber and author of `The Cold Start Problem:
    How to Start and Scale Network Effects`, says:


    There are useful metrics, meaningless metrics, misapplied metrics. You can really
    mess it up here. I’ve been an advisor to `Dropbox` kind of and on over the years
    and one of the things they did in the early days that I thought was so interesting
    was that they actually saw themselves as a consumer company. And the reason for
    that was when they looked inside a `Dropbox` folder most were full of photos.


    What Chen went on to describe was how, although `drop box` had many customers
    using it for photo storage and sharing, what a more detailed analysis found was
    they higher-value users were sharing work flow of spreadsheets, and documents
    on multiple devices. He made the point that the metrics you measure matter and
    to make sure your strategy is aligned with real customer metrics that can be measured
    and analysed, not just counted.([([46](#fn46))


    Today, the signals (and noise) of customer behaviour are everywhere. Leaders need
    to know how to harness and understand the signal. The challenge is to have:


    1. The governance in place to ethically capture the customers’ signals.

    2. The business cases aligned with customer interest in using the customers’ signals.

    3. Operational effectiveness to deploy the learnings and actions from the customers’
    signals.

    4. The culture in the team is to be innovative with how to create more benefits
    for the customer that the customer values.


    Of course, every company has to start somewhere. To paraphrase Warren Buffett,
    ‘A good idea should scream.’ So, I suggest addressing the above points and these
    questions when anyone talks about data.


    Do you believe that increasing our understanding of our customers is a good idea,
    on the proviso that you do it in ways that are transparent to our customers as
    well as legal and ethical?


    Do you think the organisation is vulnerable if these actions are not taken? How
    can the journey start in a way that allows the organisation to hunt and kill a
    couple of quick assumptions, as that will build up confidence in how data can
    reveal what customers really want, and what else might they want in the future?


    This is the start of your AI: Game On future.


    ## CHAPTER TAKEAWAYS


    1. Data collection and customer understanding are essential for success in the
    intention and attention economy; an ethical framework is mandatory.

    2. Innovation and addressing unmet customer needs are key to creating successful
    products and services.

    3. An ethical and innovative organisational culture will add value to the customer
    experience, particularly in app development, online interactivity and new business
    models.

    4. Effective data use is essential for finding, keeping and understanding customers’
    needs and optimising towards future customer needs.

    5. Companies must predict and adapt to future customer needs to stay relevant
    in a rapidly changing business landscape as predictive capability is game changing.


    ________________


    ![Image](images/himg-80-1.jpg)


    [![Image](images/himg-81-1.jpg)](#content-toc.xhtml#pt02)


    # CHAPTER 5


    # THE COMPANY OF TOMORROW, TODAY


    ‘The future is already here – it’s just not evenly distributed.’ – William Gibson


    ## Welcome to the machine learning machine, the company of tomorrow


    AI: Game On companies will effectively have a data spine, much like the human
    spine, which supports the moving parts and vital organs, and has the soft tissue
    of nerves to allow information to flow around and through the entire system and
    back to the decision-making brain.


    ![Image](images/himg-83-1.jpg)


    In data science, it is now widely understood that the best data will beat the
    best analytics. You can have the best weather forecaster on earth looking out
    a window and when you line up their forecasting power to hundreds of satellites
    in real time, you get the point.


    The ‘whole organisation’ use of data and AI deployment is already embedded in
    the tech giants `Tesla`, `Meta`, `Google`, `Amazon`, `Alibaba`, `Tencent`, `Netflix`
    and others. There are even a few companies that have AI on their board with a
    valid vote on key policy matters!


    In 2014, Deep Knowledge Ventures, a Hong Kong venture-capital firm specialising
    in regenerative medicine, announced that it had appointed an algorithm named `VITAL`
    to its board. `VITAL` allegedly makes investment recommendations by analysing
    huge amounts of data regarding the financial situation, clinical trials and intellectual
    property of prospective companies. Like the other five board members `VITAL` gets
    to vote on whether the company makes an investment.


    There is some early evidence that the new AI tools will create more job losses
    in white-collar work than blue-collar. Machines are much closer to doing the work
    in the back end of finance and HR than they are at painting the warehouse. As
    AI advances in every aspect of corporate life, we must ask what the boardroom
    of 20 years from now look like? What skills will be needed to govern in a world
    of mass adoption of AI?


    Salesforce CEO Marc Benioff utilises data-driven analysis through an unreleased
    version of the company’s AI product, `Einstein`, to help him make better decisions.
    Einstein accompanies him to the Monday morning staff meeting where Salesforce’s
    top executives meet and discuss different regions, products and opportunities.
    Then Benioff asks one other executive for their opinion. That executive is `Einstein`,
    the AI machine. Benioff claims, ‘Einstein comes without bias.’ So, because it’s
    just based on the data, it’s a very exciting next-generation tool that he says
    has transformed him as a CEO.([([47](#fn47))


    Sure, these are early outlying use cases but there will be more over time, as
    AI capability grows and human capability is limited by the constraints of our
    capacity to consider, interpret and synthesise vast amounts of information.


    ‘Without data you’re just another person with an opinion.’ – W. Edwards Deming,
    data scientist

