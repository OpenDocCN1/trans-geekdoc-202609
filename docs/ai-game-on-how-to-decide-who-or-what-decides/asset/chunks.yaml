- fmt: '

    If the machine acts away from humanity’s best interest, it drifts into the world
    of rogue machine behaviours, which has been dystopian sci-fi bread and butter
    for generations. Some of the brightest minds have credibly called out this risk,
    from Elon Musk to the late Stephen Hawking. If the `AI`-enabled prediction machines
    cannot be understood in what and how they are predicting, it all can go wrong.
    The purpose needs to be firmly earthed in the benefits for people. The Frankenstein
    dilemma of the creation that did not obey its master could be upon us. Pretending
    this is not a possibility is naive, and working to ensure it does not occur is
    our responsibility.


    We will be facing challenges, ethics, `AI`-weaponised misinformation, illusions
    of trust in fake accounts and more. Generative AI can be a convincing parrot,
    sounding good and knowing little, if not used carefully.


    There will be new ventures that are focused on taking out misinformation, taming
    the troll farms; there will be new ideas and we need them. My son has an idea
    about how to verify human input into music and art. `Andi Search` has ways of
    showing the source documents it uses for summaries to take out the hallucinations
    that occur in some other forms of AI.


    Your business has a data asset that is not going to be found in `OpenAI`. It’s
    your propriety data to create value for your customers, stakeholders and society.


    Every industry sector, every area of science, technology, medicine, health, the
    climate, resources, culture, finance, the arts … are being impacted by data/`AI`
    and machine learning. New businesses, different business models, new approaches,
    new or different solutions are emerging every day.


    The world is a complex, dynamic and challenging place. Volatility, uncertainty,
    complexity and ambiguity (`VUCA`) are all around us and expanding in all aspects
    of life.


    AI may one day reduce some of this `VUCA`. But that is not what is here now. AI
    is adding to `VUCA` at exponential rates. AI is too big to ignore, too complex
    to fully delegate, changing too fast to be fully comprehensible. At the same time,
    business leaders are accountable for what to do with `AI`, how to plan, what ethics
    to adopt, and what use cases to pursue. Stand still and a new entrant or existing
    competitor launches a new `AI`-enabled product or service that could damage your
    business. Go too fast and you overstep what are deemed acceptable use cases.


    Businesses, society and individuals are facing much hardship. Climate change,
    large-scale income inequality, changing geopolitical forces, the war on Ukraine,
    new spheres of influence, just to name a few. Data, analytics and `AI` can and
    are being used to help solve some of these issues and in an ethical way.


    The amount of change in our world will never be this slow again. Moore’s law,
    advances in quantum computing (including the recent breakthrough by the Australian
    company `Silicon Quantum Computing` [`SQC`] that announced the world’s first integrated
    circuit manufactured at the atomic scale)


    I conclude this book with an optimistic outlook, realistic about the challenges
    we face with how `AI` will be used in our world and conscious of just how much
    is not predicable here.


    It is clear just how much there is to learn, and how no one has all the answers,
    and much of what I have tried to convey in this book is open for debate. We are
    all trying to figure out the right way to help the world adapt to the `AI`: Game
    On point in time, and in a way that works for humanity. I have seen how data/`AI`
    can be a powerful force for good. I have seen that business leaders, executives
    and entrepreneurs can play a substantive role in solving some of our largest challenges
    and, in doing so, help the people of the world live better, more fulfilled lives.


    It is also clear that if the use case is not aligned with society’s best interests
    `AI` can do real harm, potentially on a large scale. It has the power to do that
    today and that power will grow. Are we on the verge of all having personal agents
    finding truth, acting on our behalf without bias and bringing it home to us? Or
    are we heading for more `AI`-enabled misinformation? Will our health bots find
    us optimal well-being and cures for diseases? Or will there be some dystopian
    world of machines coming our way? Shakespeare tells us that the rarer action is
    in virtue than in vengeance, so we cannot assume good will prevail. It needs people
    to fight for it, it needs regulators to act. Whatever happens, your organisation
    will need to be part of this new world where it is `AI`: Game On.


    The world needs legal and ethical frameworks, viable well-understood guard rails,
    and we need leaders who have expertise in these matters. How to decide who or
    what decides is the question of our time.


    ## CHAPTER TAKEAWAYS


    1. In the same way that Marshall McLuhan claimed that the `medium is the message`
    so too is `AI` fundamentally transforming the way society communicates and interacts.

    2. Most organisations are likely to have a unique data set that can be strategically
    enhanced to create insights and predictive capability.

    3. Society should decide on levels of surveillance and data use, not just tech
    industry and professionals.

    4. The future of `AI` is unevenly distributed, and the tech giants maintain a
    significant advantage over others.

    5. While `AI` may eventually help reduce uncertainty volatility it would be wise
    to expect the pace of change will only accelerate for the foreseeable future.


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ FURTHER READING


    - `The Hype Machine: How Social Media Disrupts Our Elections, Our Economy, and
    Our Health – How We Must Adapt`, Sinan Aral, Currency, 2021.

    - `Who Can You Trust?: How Technology Brought Us Together and Why Might Drive
    Us Apart`, Rachel Botsman, Public Affairs, 2017.

    - `Post Corona: From Crisis to Opportunity`, Scott Galloway, Bantam Press, 2020.

    - `Leadering: The Ways Visionary Leaders Play Bigger`, Nancy Giordano, PBI Publishing,
    2021.

    - `Homo Deus: A Brief History of Tomorrow`, Yu Noah Harari, Harper Perennial,
    2018.

    - `The Inevitable: Understanding the 12 Technological Forces That Will Shape Our
    Future`, Kevin Kelly, Penguin, 2017.

    - `Leadership: Six Studies in World Strategy`, Henry Kissinger, Allen Lane, 2022.

    - `Select Committee on Artificial Intelligence`, Lord Clement-Jones (Chairman),
    [https://publications.parliament.uk/pa/ld201719/ldselect/ldai/100/10001.htm](https://publications.parliament.uk/pa/ld201719/ldselect/ldai/100/10001.htm).

    - `The Premonition: A Pandemic Story`, Michael Lewis, W W Norton & Company, 2021.


    ## Further listening


    - ‘PIVOT`, Scott Galloway and Kara Swisher [https://podcasts.apple.com/au/podcast/pivot/id1073226719](https://podcasts.apple.com/au/podcast/pivot/id1073226719).


    Published in 2024 by Hardie Grant Books an imprint of Hardie Grant Publishing


    Hardie Grant Books (Melbourne)


    Ground Floor, Building 1, 658 Church Street

