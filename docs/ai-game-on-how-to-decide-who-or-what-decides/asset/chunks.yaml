    当我加入 NRMA（澳大利亚最大的汽车和旅游互助机构）董事会时，存在一种长期存在的观点，认为最忠诚的客户是那些偶尔发生故障的人，他们利用传奇般的道路救援获得极大的安心，然后对服务非常满意并继续上路。NRMA
    的净推荐值（`NPS`）很高，高达 82。这类客户通常被认为是带着孩子的年轻母亲，她们在路边会感到脆弱，因此加入以寻求安全感。他们是忠诚的客户，这一切完全合逻辑。然后，我们对数据进行了一些处理。


    团队对最忠诚的客户进行了数据分析，评估了他们的故障率与其他客户的对比。他们发生故障时的等待时间有多长？现场的解决方案是什么？一旦获得数据，很明显的是，最忠实的客户根本并不经常发生故障。这只是一个假设。


    数据告诉我们，最忠实的客户还使用了 NRMA 的其他服务。因此，是这些其他服务极大地为客户自身的价值感和归属感增加了价值，正如出色的道路救援工作一样。当我们看到数据——这些客观证据后，我们向数据提出了了更多问题：他们还使用了哪些其他服务？频率如何？何时使用？他们对我们未来可能提供的哪些其他服务感兴趣？我们能预测他们的需求是什么？我们如何更好地了解他们以更好地服务他们？


    这些及其他洞察引导我们建立了围绕旅游的新策略，并因此调整了资产负债表中的很大一部分。


    这就是数据影响策略，以及策略影响数据。当资产负债表更符合客户需求时，公司就在随着客户的需求和新兴需求移动。董事会通过数据获得信息，以帮助治理未来。


    Apple 以惊人的速度占据了手表市场。Apple Watch 于 2015 年 4 月发布，第一季度销量达 420 万块。到 2020 年 12 月，流通已有
    11 亿块 Apple Watch。


    ## 替代威胁


    产品和服务的替代受到数据、`AI` 和机器学习的显著影响。


    如果你有一块 Apple Watch，你可能还有其他 Apple 产品，可能是 `iPhone`、`iPad`、`MacBook`、`HomePod`、`Apple
    TV` 或 `Apple Music`。你可能还连接了 `Spotify` 账户和健身应用，并与 `Siri` 交流。然而，将手机更换为 `Samsung`
    或其他 `Android` 手机并没有看起来那么简单，因为存在各种互操作性问题，使得与 Apple 保持长期关系更有可能，或更具粘性。更换手机的成本现在远高于
    Apple 进入市场之前。还记得黑色手机吗？


    你不需要拥有 `iPhone`；你可以拥有任何手机，如 `Samsung`、`Google Pixel`、`TCL`、`OPPO`、`Xiaomi` 等。你可以找到一部价格比
    `iPhone` 便宜 90% 的手机。数百万人对他们的 `iPhone` 异常忠诚，在新版本发布前一天晚上就开始外守。忠诚度通过数据和 `AI` 网络得到了强化，在
    Apple 的情况下则是通过关联产品应用。这就是 Apple 如此值钱的原因之一，因为更换很困难，极少数 Apple 客户想要更换。如果你所有的照片都在手机和
    `iCloud` 中，并跨设备共享，你就拥有所有的应用来无缝访问一切。Apple 是一种生活方式的实现者。


    Tesla 也是如此。如果你拥有一 `Tesla`，他们拥有你所有的驾驶信息，你成了 `Tesla` 生态系统的一部分。你有各种导航、驾驶、充电站应用连接到你的车和手机。你可能还购买了保险并获得了折扣，因为
    `Tesla` 能够提供有关你如何使用汽车、如何驾驶、在哪里驾驶等详尽信息。`Tesla` 正开始营销自己的保险。


    Apple 和 Tesla 的共同点是它们拥有真正的粉丝，并且擅长让客户感到惊喜。你听过有人像谈论 Tesla 那样谈论保险公司吗？你能诚实地说你的公司或组织也是这样做吗？


    ## 章节要点


    1. 数据是面向未来企业的骨干，最好的数据胜过最好的分析。当最好的数据遇到最好的分析时，该组织将变得不可战胜。

    2. 大型科技公司已经将 `AI` 嵌入到其运营中，赋予了他们巨大的优势，但基于 `AI` 的工具也在扩展到其他领域。

    3. 数据和 `AI` 正在改变我们招聘和奖励员工的方式，机器学习运营（`MLOps`）正在改变 `AI` 在企业中的部署。

    4. 保护客户数据至关重要，组织应该依靠数据而非假设来理解他们的客户。

    5. 真实的客户洞察可以通过分析真实的客户数据获得，企业必须谨慎不要依赖对客户的错误假设。


    ***


    # 第 6 章


    # 导航决策革命，决策即服务 (DAAS)


    **“如果我们有数据，我们就看数据。如果我们只有意见，那就听听我的吧。”** – Jim Barksdale，Netscape 前总裁兼首席执行官，Barksdale
    Group 创始人


    ![Image](img/himg-93-1.jpg)


    人们每天都会做成千上万次微型型决策。康奈尔大学的研究发现，人们仅在食物上平均每天就会做 226 次决策。


    然而，尽管经营业务的认知负荷很高，请思考这一点：我见过的零售领域部署的算法之一拥有 23 万亿个变量，每秒做出数百万次决策。这些决策随后转化为客户的建议，以及管理和员工的行动。我们正处于决策革命之中——欢迎来到决策即服务（`DaaS`）。


    '
- fmt: '

    She sent through the claim to her insurance company expecting it to be paid. The
    insurance company (a top-tier multibillion-dollar entity) rejected the claim,
    saying they needed to have the address of the at-fault driver and that without
    this information the claim would be rejected. My relative googled the person,
    found their place of work and address, offered this along with the photos, and
    the name of the witness who was prepared to go to court if needed to state the
    other driver was at fault. The insurance company again said that without the home
    address of the other driver the claim would be denied. My relative rebutted this,
    exasperated but noting that privacy laws mean that they are not meant to stalk
    the at-fault to obtain the home address. Surely the number plate and the insurance
    companies’ resources to track them down should be enough. The insurance company
    was adamant it was her responsibility to find the home address of the at-fault
    driver, so I suggested she pose the insurance company this question, as they have
    a large market share: ‘Is it possible that this number plate and name I have is
    insured by you?’The call centre person typed the details into the server and bingo!


    They knew this customer and the illusive home address of the at-fault driver was
    on their database! However, this is not all fixed.


    This should have shown up as the claim was presented, and negated 11 frustrated
    calls to the company. The same insurance company CEO talks at the AGM about their
    systems being the most advanced using algorithms and AI, saying how they knew
    great details about their customer claims, preferences and risk profiles. There
    are PR pieces from them claiming in effect ‘we use AI, machine learning to process
    our claims and automate the processes for our customers at real scale and in real
    time’. As is so often the case, when the C-suite thinks the problem is solved
    that problem multiplies as the organisation has lost sight of what it’s like to
    be a customer. In a fully AI: Game On world this whole process will look very
    different. Crash detection could grab dash cam footage and apply for your insurance
    claim in close to real time, while your AI-enabled bot fills out the forms and
    asks you to cross-check before it sends it off with your proof of what happened.


    > ‘It impossible for a man to learn what he thinks he already knows.’ – Epictetus


    Tesla is now offering car insurance based on your own real driving behaviours
    that are of course detected in the Tesla. At the time of writing, Tesla insurance
    is growing to 12 states in the USA. Their website says the process to activate
    the insurance will be one minute, so contrast that with your current insurance
    forms. We are seeing the ‘the organisation with the best use of customer data
    win again’. My sense is that all car companies, as they become much more data-driven,
    will move to use their own customers’ real driving risks to offer insurance. Instead
    of a team of actuaries trying to model out my driving risks, the car knows. It
    knows how far I drive, when, where, how I brake, how I accelerate, even near misses
    will be shown in a Tesla, and any impact will be captured through on-board cameras.
    Better data wins again, and if you are running a car insurance company, this is
    now a real challenge. Tesla is reaching into a multibillion-dollar industry adjacent
    to their core business, and leading with customer benefits and better data, a
    very powerful combination.


    MIT’s Computer Science and Artificial Intelligence Laboratory (CSAIL) and the
    Qatar Centre for Artificial Intelligence have developed a deep learning model
    that predicts very high-resolution crash risk maps.


    At a meeting I had at Microsoft in Seattle a few years ago, I was shown an AI
    application that had mapped US road fatalities, with the known data of the tragic
    incidents, plotting weather, car type, location, time of day and any other information
    that was available. The use of their AI was powerful. This sort of information
    can be used to help people lower their own personal driving risks.


    In one lifetime we have changed from human-only decisions to decisions informed
    by data and AI. Today we are seeing decisions as a service (DaaS) at the frontier
    of AI, with machines that can start to understand complex patterns, processes
    and concepts, and that can create new algorithms to seek out new patterns. They
    are increasingly self-adapting and self-learning.


    Data and AI have changed the way humans and, therefore, businesses can make decisions.
    At the heart of this is genuine human-machine interaction. What can data and AI
    help us with? What questions could and should businesses be asked and be able
    to answer? What should we turn our attention to and focus on? How do businesses
    decide who or what decides? How will your organisation think through what decisions
    you will delegate to machines and what will be the oversight of AI-generated decisions?


    AI is the first plausible challenge to human supremacy in thought. At the time
    of writing, there is no real consensus that we are about to have artificial general
    intelligence, AGI, in the immediate future that will take over human life. It
    is for now our subservient tool, albeit with rapidly growing capability and not
    without the need for regulation and guard rails. The likes of Elon Musk have some
    concerning views on what AGI could do over time and how it is possible to imagine
    a world where poor controls over the use of AGI could create catastrophic implications.
    I will not drift into over-the-horizon speculation: I will leave that for others.


    What is not fictitious is that right now, for the first time, we are at a point
    where humans have viable emerging competition for our concept of being the most
    intelligent ‘apparatus’ on the planet. Human brains evolve very slowly, while
    AI is bounding, compounding and self-adapting. `ChatGPT` and the spawning of many
    other AI tools are rapidly evolving and being discovered by millions of people
    for their capacity to write, draw and create. There are bugs, it’s not perfect
    by the way way; however, it and other systems are very likely to improve quickly,
    and won’t get tired at night, won’t suffer eye strain, they will just keep working.
    `Jasper` and `Andi search` (disclosure: I’m an investor and advisor) are good
    examples of new businesses leveraging new AI applications. There will be many
    more and the pace of acceleration is very likely to increase from here. The potential
    for large language models (`LLMs`) to help us, and also confuse and abuse our
    trust, is large. If done well it’s a boon for human productivity. If done badly,
    or worse, aimed at disrupting society, the impact could be staggering. `LLMs`
    can be customised to help or be optimized for spreading misinformation.


    Deciding how AI is deployed, governed and aligned with human dignity is the decision
    of our time and of future generations. And by ‘our’ I mean business leaders, directors
    and executives, medical researchers, regulators and ethicists as we are at the
    forefront (or should be) of implementing AI into our business models, medical
    research, laws and regulation, and global systems of finance and commerce.


    The decision-making revolution comes with great responsibility and we’ve seen
    how far behind national and global regulation has been, in many instances, in
    the data and AI race. While it might seem governments are now aware of the challenges,
    they are playing catch up with the global data/AI-enabled companies that are still
    leaping ahead.


    The major technology firms are racing ahead in AI development and deployment and
    putting application into the population at pace and without a full understanding
    of what the AI impacts are or could be. We would not allow this in medicine, food
    production or motor vehicles.

    '
