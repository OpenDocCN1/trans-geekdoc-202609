  trans: '


    她向保险公司提交了理赔申请，期待获得赔。保险公司（一家价值数十亿美元的顶级巨头企业）拒绝了理赔，称他们需要过事方司机的地址，如果没有这些信息，理赔就会被拒绝。我的亲戚在网上搜索了那个人，找到了对方的工作地点和地址，并将这些信息以及照片和证人的姓名提交（证人已准备好在需要时出庭证明另一名司机有过责任）。保险公司再次表示，如果没有对方司机的家庭地址，理赔将被拒绝。我的亲戚反驳了这一点，尽管她非常愤怒，但指出隐私法意味着他们不应该通过跟踪过事者来获取家庭地址。按理，车牌和保险公司的追踪资源应该已经足够了。保险公司坚称，找到过事司机的家庭地址是她的责任，于是我建议她向保险公司提出这个问题，因为他们拥有巨大的市场份额：“我手有的这个车牌和名字是你们公司承保的吗？”呼叫中心的人将详情输入服务器，结果宾喜！


    他们认识这个客户，而过事司机那个难以捉摸的家庭地址就在他们的数据库中！然而，这并没有完全解决问题。


    这本该在提交理赔时就显示出来，从而避免向公司打 11 次挫败的电话。同一家保险公司的 CEO 在股东大会（AGM）上谈论他们的系统利用算法和人工智能是最先进的，并说他们对客户的理赔、偏好和风险状况了如指掌。他们还有一些公关文章，声称实际上“我们使用
    AI、机器学习来在大规模和实时范围内处理理赔，并为客户实现流程自动化”。正如常发生的那样，当高管层认为问题已经解决时，问题反而会倍增，因为组织已经忘记了作为客户的感受。在一个完全
    AI 化的“游戏开始”世界里，整个过程将看起来大不相同。碰撞检测可以获取行车记录仪画面并近乎实时地申请保险理赔，而你的 AI 机器人会填写表格，并在发送你事后证明之前要求你进行交叉核对。


    > “人无法学习他认为自己已经知道的东西。” – 爱比克泰


    特斯拉现在根据你自己的真实驾驶行为提供汽车保险，而这些行为当然是在特斯拉汽车中被检测到的。在写作时，特斯拉保险已扩展到美国的 12 个州。他们的网站显示，激活保险的过程只需一分钟，将这与你目前的保险表格进行对比吧。我们正在看到“最用客户数据的组织再次获胜”。我的直觉是，所有的汽车公司随着变得更加数据驱动，将转向使用其客户的真实驾驶风险来提供保险。与其让精算师团队试图对我的驾驶风险进行建模，不如汽车自己清楚。它知道我开了多远、何时、何地、如何刹车、如何加速，在特斯拉中甚至会显示险的擦边球，任何碰撞都会通过车载摄像头捕捉。更好的数据再次获胜，如果你经营一家汽车保险公司，这现在是一项真正的挑战。特斯拉正在触及一个与其核心业务相邻的数十亿美元行业，并以客户利益和更好的数据为先导，这是一个非常强大的组合。


    麻省理工学院（MIT）计算机科学与人工智能实验室（CSAIL）和卡塔尔人工智能中心开发了一种深度学习模型，可以预测极高分辨率的碰撞风险地图。几年前我在西雅图的微软的一次会议上，我看到一个
    AI 应用，它绘制了美国道路死亡人数地图，结合已的悲剧事故数据，绘制了天气、汽车类型、地点、时间以及任何其他可用信息。他们对 AI 的使用非常强大。这类信息可以帮助人们降低自己的个人驾驶风险。


    在这一生中，我们从纯人类决策转变为由数据和 AI 驱动的决策。今天，我们正在 AI 前沿看到“决策即服务”（DaaS），机器可以开始理解复杂的模式、流程和概念，并能创建新算法来寻找新模式。它们越来越具有自适应和自学习能力。


    数据和 AI 改变了人类、因此是企业做出决策的方式。其核心是真正的人机交互。数据和 AI 能帮助我们做什么？企业应该被问并能够回答哪些问题？我们应该把注意力和焦点放在什么上？企业如何决定由谁或由什么来做决定？你的组织将如何思考哪些决策将委托给机器，而对
    AI 生成的决策将进行怎样的监督？


    AI 是人类思想主导地位面临的首个合理的挑战。在写作时，还没有真正的共识认为我们将在近期就会获得通用人工智能（AGI），并由它接管人类生活。目前它仍然是我们的从属工具，尽管其能力正在迅速增长，且并非不需要监管和护栏。像埃隆·马斯克这样的人对
    AGI 随着时间推移可能做的事有一些担忧的观点，以及如何想象一个对 AGI 使用控制不当可能导致灾难性后果的世界。我不会陷入过远的推测中：我会把那个留给别人。


    并非虚构的是，现在，第一次，我们处于一个点：人类在作为地球上最智能“装置”的理念上，有了可行的新兴竞争对手。人类大脑进化非常缓慢，而 AI 正在跨越、复合和自适应。`ChatGPT`
    以及许多其他 AI 工具的产生正在快速演变，并被数百万人因其写作、绘画和创作的能力而发现。它有 Bug，顺便说一下，这种方式并不完美；然而，它和其他系统很可能迅速改进，而且在晚上不会疲劳，眼睛不会酸，只会一直工作。`Jasper`
    和 `Andi search`（披露：我是投资者和顾问）是新企业利用新 AI 应用的良好示例。会有更多此类产品，加速速度可能会进一步增加。大语言模型（`LLMs`）帮助我们以及混淆和滥用我们信任的潜力是。如果做得好，它是人类生产力的福音。如果办得不好，或者更糟，旨在破坏社会，其影响将是惊人的。`LLMs`
    可以被定制以提供帮助，也可以为了传播虚假信息而优化。


    决定如何部署、治理 AI 并使其符合人类尊严，是我们时代以及后代人的决定。我所说的“我们”是指企业领袖、董事和执行官、医学研究人员、监管机构和伦理学家，因为我们正处于将
    AI 引入我们的业务模式、医学研究、法律法规以及全球金融和商业体系的前沿（或应该是这样的）。


    决策革命伴随着巨大的责任，我们已经看到国家和全球监管在数据和 AI 竞赛中，在许多情况下落后了多远。主要的科技公司在 AI 的开发和部署上飞跑，并快速将其应用到人群中，而没有完全理解
    AI 的影响是什么或可能是什么。我们不会在医学、食品生产或机动领域允许这样做。


