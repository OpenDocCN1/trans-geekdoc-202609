- fmt: "\nIf your organisation pushes customers to chat rooms for help with bots that\
    \ are substandard or artificially inept versus artificially intelligent, you are\
    \ on a collision course to customer churn, short sellers and, quite possibly,\
    \ your own Kodak moment. I have spent hours dealing with one of the makers of\
    \ multimedia software who push the customer to bots on complex issues that are\
    \ simply not able to be solved through a chat with a bot. The customer’s pain\
    \ point should be the moment of innovation, yet the signal is lost as they miss\
    \ the pain of customers as the frustrated customer curses the bot. Eventually,\
    \ you get handed off to what now feels like a human in the chat room. I feel for\
    \ these staff, who are probably multitasking many customers at once, as you restate\
    \ all the issues again and again. One phone call would likely solve most issues\
    \ fast and give valuable insight into the customer’s pain point, but the digital\
    \ self-services-only mantra doesn’t allow for this. Rather, it is more like artificial\
    \ ineptitude than intelligence and it will put you on a collision course with\
    \ reality. For some of these firms, the displeasure of the customer is being reflected\
    \ in the share price. The board needs to own this and accept it is on them.\n\n\
    Boards and executives need to be clear on the unintended consequences of any new\
    \ technology. Especially the extent to which it does or does not align with human\
    \ beings and societal norms. This starts with purpose and making sure people are\
    \ central in this process. As Satya Nadella, CEO of `Microsoft`, said, ‘It starts,\
    \ by the way, with design AI, you can have the human in the loop, you can have\
    \ the human on the loop or you can have the human out of the loop.’ He went on\
    \ to say in February 2023, ‘When you think about these generative AI models, remember\
    \ one thing: they are prompted to do things. The prompting comes from a human\
    \ being.’ This may change in the future as some who fear where AI is heading point\
    \ out.\n\nNadella makes the point that the pre-training is crucial. This is where\
    \ the model is made safe, and what happens at this stage will matter a great deal\
    \ in application contexts. Humans will still be responsible for deciding who or\
    \ what decides.\n\n A data AI Hippocratic oath\n\nThe Hippocratic oath is one\
    \ of the oldest binding documents in history and is still held sacred by physicians:\
    \ to treat the ill to the best of one’s ability, to preserve a patient’s privacy,\
    \ to teach the secrets of medicine to the next generation.\n\nGreg Schneider is\
    \ co-founder of `Quantium`, and he was the first person I heard talk about a data\
    \ Hippocratic oath. I think all businesses need a data Hippocratic oath. If you\
    \ are looking for a North Star to aim your data and AI ethics at, and to abide\
    \ by, here’s a starting point:\n\n1. We will do no harm with the data we collect.\n\
    2. We will not use the information about any human being for any purpose that\
    \ makes that person’s life harder.\n3. We will respect the privacy of our customers,\
    \ and not allow information on them to be used against them in any way.\n\nCustomers\
    \ are concerned about their privacy, which most people regard as sacrosanct. This\
    \ concern applies to what data a business collects, what it’s used for now and\
    \ into the future, how long it’s kept for and what, if any, third parties you\
    \ share it with. Organisations on their way to being a predictive organisation\
    \ need to protect the data collected, stored and used. They must anticipate the\
    \ future uses of the data they are collecting and only collect the data they really\
    \ need to help customers. Moreover, they must enable its removal at the customer’s\
    \ request. If you don’t undertake all these actions there may well be consequences\
    \ – personal, financial, reputational and regulatory.\n\n## Data use and misuse\n\
    \nAs data sets grow and data use cases expand so too do the possibilities for\
    \ use and misuse. The need for data ‘guard rails’ can’t be retrofitted after a\
    \ data train crash. The guard rails don’t need to be as large as `War and Peace`,\
    \ but they do need to be clear, and a data Hippocratic oath is one framework that\
    \ can help. This is where boards, senior executives and management need to go\
    \ deep. If you don’t know what the data is, how it was obtained, and what it will\
    \ be used for, you may find yourself in front of a regulator or senate committee\
    \ trying to explain it later. ‘I left that to the data department’ is not going\
    \ to fly in a witness box. What was the data department doing? Did they have a\
    \ data Hippocratic oath or other guard rails that they lived by? What second-\
    \ or third-order consequences are there in the data use, or misuse? Is this on\
    \ your risk register? Did the board bring an inquiring mind to this subject matter?\n\
    \nGovernments need to move faster in relation to regulation, to stay in front\
    \ of enforcement of data and AI use, and protecting the privacy of data from companies\
    \ with poor ethical standards, as well as pursue the prosecution of criminals\
    \ who illegally acquire data for commercial gain. Now that AI is growing at incredible\
    \ speed, regulators will need to quickly form a view and take action regarding\
    \ what is right for society.\n\nIn February 2022 Andrew Forrest, an Australian\
    \ mining magnate and philanthropist, launched criminal proceedings against the\
    \ `Meta` platform `Facebook` in an Australian court, alleging that it breached\
    \ anti-money laundering laws, and its platform is used to scam.\n\nNumerous companies\
    \ have been fined under Europe’s General Data Protection Regulations including\
    \ `Meta`, `Google`, `Amazon`, `Facebook`, `H&M`, `Enel Energia`, `British Airways`\
    \ and `Marriott`. Over the 2021–22 financial year the number of `GDPR` violations\
    \ increased 113.5% while the number of fines increased 124.9%.\n\nMisuse aside,\
    \ business leaders need to have a laser-sharp focus on the use case. If you are\
    \ giving customers choice about what data you capture in a transparent way, explain\
    \ why and what it will be used for today and tomorrow. Have a value exchange for\
    \ them that is tangible, so that a great deal of the data angst might be removed.\
    \ I don’t mind `Waze` knowing where I’m going, as the value of their traffic information\
    \ is helpful and offsets my concerns about them knowing my destination. It’s a\
    \ trade-off, my data for navigational information in return. It’s when the value\
    \ is not a fair trade that the angst arises. Beware, reputational impacts await\
    \ poor use cases.\n\nIn a recent Pivot podcast, Kara Swisher and Professor Scott\
    \ Galloway talked about Apple’s latest move into health, specifically mental health,\
    \ using data from `Apple Watches`. Swisher noted that it was possible to predict\
    \ with a higher level of accuracy signs of depression from a lack of action through\
    \ `Apple` devices. She was of the view that this was a step too far in terms of\
    \ data privacy. Galloway had the opposite view: ‘If Apple can help a customer\
    \ they should.’ He noted that his watch already told him when it was time to stand\
    \ up. Why wouldn’t it not notice that you haven’t moved much today, and that you\
    \ could be feeling bad as a consequence? That’s actually a good thing. Galloway\
    \ made the point that what you need is regulation about how the data is used because\
    \ if it’s used by the consumer who has opted in to get help that’s good. If Apple\
    \ misuses the data, they’re liable for court cases to get sued for loss, and you\
    \ need judges to enforce the privacy laws.\n"
