- pgno: 133
  md: '# 6. Layer information to help web users


    Layering is a way of dividing web information. When done well, it''s a great way
    to


    +   - keep web users from being overwhelmed by too much at once

    - help different web users get the amount of information they want on a topic


    Close to this chapter, let''s look at three typical examples of layering on web
    sites and then at two case studies that give you new ideas for using layering
    in your web site.


    # Layering from a brief description to the full article


    Many web sites entice visitors with a little bit about an article, a topic, or
    a product on the home page or on a pathway page and then provide a link that goes
    to a web page with more information. That''s layering. Figure 6-10 shows a well-done
    example of this typical layering from the BBC''s web site.


    # Layering from an information page to more on other web pages


    Information pages can also be pathways to more information – details, tangential
    information, or related topics.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_133_0.png)'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 6. Layer information to help web users


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_134_0.png)


    **6-10** This is an example of the layered architecture of web sites: home page
    → pathway page → www.bbc.com


    One of the great advantages of the web over paper is the way that you can make
    connections for people to information beyond what you want to put on your main
    page. The links can go to more details on the same page, related topics, other
    sites, calculators, lists of providers, message boards, contact forms, other online
    activities, and so on. Figure 6-11 shows just the top few sections of a page from
    the U. K. government''s site, Directgov. Several other sections the page also
    have related links after the brief paragraphs.'
