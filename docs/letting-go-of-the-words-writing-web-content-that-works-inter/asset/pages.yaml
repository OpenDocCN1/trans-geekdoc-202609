    Links can be\n\n+   - headlines and titles that are\n  - full sentences, either\
    \ statements or questions – Are smaller cars as safe as large cars? or Chocolate\
    \ – Food of the gods?\n  - phrases – Cricket: Final hit-out for Australia before\
    \ test"
