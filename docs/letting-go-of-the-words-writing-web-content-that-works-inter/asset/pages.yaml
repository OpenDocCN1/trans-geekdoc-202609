  md: '# 6. Layer information to help web users


    The linked article is now much more usable than the original journal article was.
    It has become detailed web information rather than just a paper document archived
    on the web site.


    Dusold tells me that half the pages they work on in a year are new pages and half
    are updates and reworking of old pages. That way, they continue to strive to bring
    useful layers of information to their site visitors.


    # Case Study 6-4 Opening layers on the same web page


    Layering does not have to take users from one page to another. You can keep all
    of the information on one page, layering it by opening and closing overlays on
    the same page.


    For a user group like injured workers checking on their claims for workers'' compensation,
    this type of layering solves many potential problems.


    # Think about the web users and their scenarios


    The site is for people like Joe.


