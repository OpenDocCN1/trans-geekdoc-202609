- pgno: 212
  md: '# 8. Start with the context – first things first, second things second 193


    # Case Study 8-2 Starting with the context – the topic


    Is the following paragraph instantly clear? If not, consider what you would do
    with this information if you were telling it to someone on the phone. Which part
    of this sentence would say first? What would come next? How would you break up
    the information?


    Approved fumigation with methyl bromide at normal atmospheric pressure, in accordance
    with the following procedure, upon arrival at the port of entry, is hereby prescribed
    as a condition of importation for shipments of yams.


    Slightly simplified from a U. S. Department of Agriculture regulation


    # Reversing the order


    If you were to say the content of this sentence to someone, you would probably
    reverse the order of the information. You would start with the yams because that''s
    the answer to the question, “What are we talking about?” The yams are the context,
    the topic, the connection to what the web user came looking for. The yams belong
    at the beginning, as in this suggested revision:


    > I''m importing yams. Good, this is about importing yams.


    If you are importing yams into the United States,—Context; what the reader knows
    they must be fumigated when they arrive at the port of entry.


    The approved fumigation method is to use methyl bromide at normal atmospheric
    pressure, following this procedure:


    > "Fumigation" is now "old" information because it has already been introduced.


    Now the reader expects information about the procedure and how to use the methyl
    bromide.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Learning from case study


    Once again, we see how focusing on the reader helps you write well for the web.
    When you are writing specific web content, think about the specific knowledge
    your site visitors come with.


    +   - Think about what your site visitors do and do not know.

    - Start with what they know. Introduce new information.

    - Consider using the pattern "if, then." it follows the reader''s logic and makes
    you put first things first, second seconds. (You almost always need the "if" in
    the "if clause," but you don''t actually have to write the word "then" in the
    "then clause." For example, write "if it''s raining, take an umbrella."


    The principle of ''new'', topic, ''known'' before ''new'' is sometimes also called
    ''given – new.'' See the work of linguists H. H. Clark and Susan Haviland of ''Comprehension
    and the new contract.''


    # Put the action in the verbs, not the nouns


    Much of the web is about action, and verbs are the action words. Even in essays
    and articles, you are probably talking about people doing things. Doing = action
    = verbs.


    If you bury the verb in a noun, the verb often becomes just aninteresting placeholder.
    Take the action out of the noun and put it in the verb, where it belongs.


    | | noun hiding a verb | weak verb |

    |---|---||

    | Weak sentence | The Commission''s recommendations for changes were few in number.
    |

    | Strong sentence | The Commission recommended few changes. |

    | | noun hiding a verb | weak verb | noun hiding a verb |

    | Weak sentence | Retention of these records for seven years is a requirement
    for licensees. retention → require → must retention → keep |

    | Strong sentence | Licensees must keep these records for seven years. |'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 10. Use your users’ words


    Here’s a table of the most common endings for nouns that hide verbs. Use this
    to help you keep the action in the verb and not in the nouns.


    | Look for this | As in this example | Which should be this verb |

    | -al | denial | deny |

    | -ance | maintenance | maintain, keep up |

    | -ence | concurrence | concur, agree |

    | -ment | assignment | assign |

    | -sion | transmission | transmit, send |

    | -tion | recommendation | recommend |

    | -ure | failure | fail, if you don’t |


    # 10. Use your users’ words


    **Think about your audience!** is a good mantra on every level of web writing
    – deciding what content to cover, constructing sentences and paragraphs, and choosing
    words.


    Your users may not know words that are commonplace to you. How many web users
    are likely to understand the instruction for using the Search function on the
    Express Order site in Figure 8-24?


    Some writers try to sound impressive using big words. If those big words aren’t
    ones your readers know, they won’t be impressed. They’ll give up on your web site
    and go to someone else who speaks their language.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_214_0.png)


    Figure **8-24** This search interface is likely to confuse, not most web users.'
