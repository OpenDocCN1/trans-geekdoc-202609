  md: '# Lists and tables may be better than paragraphs


    In many cases, you can take information out of sentences and make it more scannable
    with lists or tables. That''s what the next chapter is all about. Before we get
    there, however, let''s consider the last 3 of the 10 guidelines for tuning your
    sentences.


    # 8. Start with the context – first things first, second things second


    Start each paragraph with a topic sentence – a sentence that sets the context,
    that tells readers the paragraph is about.


    Even within a sentence, always set the first context. Research shows that people
    jump to act as soon as they see everything that tells them to act. They don''t
    always read to see if more information restricts them. The problem with a sentence
    like the one in 8-22, from eHow''s instructions on getting stains out of fabric.


    > For a fascinating study showing that people don''t wait for the context, see
    Dixon, 1987.


    Putting the "if" clause gives people the restricting (context) information before
    they find out how to act (8-23).


    > You''ll see the #how page that piece comes in from the next chapter on lists
    (Figures 9-18 and 9-19).


    +   6 If washing by hand, rub the salt into the stain. When pouring boiling water
    onto it from a height of 12 to 36 inches if the stain persists and if the fabric
    can tolerate high heat.


    > People may start pouring boiling water without reading the last part of the
    sentence.


    **8-22** Putting the context after the action may cause sad consequences. Research
    shows that people act without the whole sentence.


    ```

    www.ehow.com

    ```


    If the stain persists and if the fabric can tolerate high heat, pour boiling water
    onto it from a height of 12 to 36 inches.


    > Write most "if, then" sentences with the "if" clause first.


