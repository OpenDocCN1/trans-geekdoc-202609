- pgno: 88
  md: '# Writing Information,

    Not Documents


    In this chapter, we tackle three important issues:


    +   - Breaking up large documents

    - Deciding how much to put on one web page

    - PDF – yes or no?


    All three issues relate to helping people get just what they need, when they need
    it, in the amount they need, as quickly as possible.


    Right information at the right time

    in in the right amount.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_88_0.png)


    # Breaking up large documents


    Most people come to the web for information, not for a complete document. They
    don’t want the user manual; they want instructions for the task they are doing.
    They don’t want the handbook; they want the answer to specific questions. They
    want usable, manageable pieces.'
