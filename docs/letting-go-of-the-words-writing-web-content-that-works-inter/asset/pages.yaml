- pgno: 138
  md: '# Case Study 6-3


    # Summarizing archived paper documents


    Even when you know that a paper document is not going to work on the web, you
    may not have the time or resources to change it. Or you may want to keep the old
    document as it was on paper for historical, archival reasons. And, yet, you may
    also want to make the key messages in that document more accessible to your web
    users.


    What can you do? One way is to create a new, shorter first layer with the key
    messages higher in the web hierarchy and link that layer to the old document.


    That''s Laurence Dusold at the U. S. Food and Drug Administration (FDA) did when
    he developed the web site for the FDA''s Center for Food Safety and Applied Nutrition
    (CFSAN). Dusold''s team extracted the key messages from old journal articles into
    short web pages. Here''s an example from an article about knowing when fish is
    fresh:


    # How can you figure out if the fish is fresh?


    +   * The fish''s eyes should be clear and bulge a little. Only a few fish, such
    as walleye, we have naturally cloudy eyes.


    +   * Whole fish and fillets should have firm and shiny fish. Dull flesh may mean
    the fish is old. Fresh whole fish should also have bright red gills from slime.


    +   * If the flesh doesn''t spring back when pressed, the fish isn''t fresh.


    +   * There should be no darkening around the edges of the fish or brown or yellowish
    discoloration.


    +   * The fish should smell fresh and mild, not fishy or ammonia-like.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_138_0.png)


    Source: Excerpt from FDA Consumer, February 1999: Critical Steps Toward Safer
    Seafood


    The key messages from a longer article www.cfsan.fda.gov/~dms/qa-sea5.html'
  merge: -1
  img_proc: true
