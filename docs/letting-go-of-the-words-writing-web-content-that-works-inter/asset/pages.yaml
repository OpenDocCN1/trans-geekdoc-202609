    # 3. Format lists to make them work well


    The way you present lists can help or hinder people from using them easily. You
    want people to be able to connect the list with its introduction, see at a glance
    that you are giving a list, and find each list item easily. To help users do that,


    +   - eliminate the space between the introduction and the list

