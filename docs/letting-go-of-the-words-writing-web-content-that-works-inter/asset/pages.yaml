  img_proc: true
- pgno: 221
  md: '# Chapter 8 Tuning Your Sentences


    Then, we would make the process much obvious by addressing the reader directly
    and by breaking out of the three steps. For writing rules, the appropriate style
    is to tell the reader, "you must..." If we were not stating a legal requirement,
    but instead just giving instructions, the appropriate style would be imperative,
    "Fill out a ‘prior notice’ form. . . ."


    Note that the original page was a news release. The Australia Post site managers
    put it exactly as it came from the U. S. Embassy. But we can ask whether, 4 years
    later, it must stay as originally written. When can we revise it to be a better
    explanation for people who need the information?


    This is an example of how press releases live forever on web sites. I talk about
    this interesting issue in the prelude on the New Life of Press Releases.


    # What might a revised article look like?


    Here is my suggested revision.


    # Australians mailing to the United States may have to fill out a prior notice
    form

    Starting date: August 12, 2004


    The effective date is in a fragment at the top.


    The key message is in the heading.


    Must I do this?

    There is one exception: If you made the food in your home and are sending it as
    a personal gift (not for business reasons) to an individual in the United States,
    you do not have to fill out the prior notice form.

    In all situations, you must fill out the prior notice form.


    The exception comes first, so many people won''t have to read the whole page.


    The three questions give you a clear structure.


    What must I do?

    You must fill out a “prior notice” with the U.S. Food and Drug Administration
    (FDA) about the food you are sending to the U.S.

    You must do this online at http://www.access.fda.gov


    Each step gets its own parcel.


    FDA will confirm that it has received your prior notice form.

    You must take the confirmation to Australia Post when you mail your parcel.


    Why must I do this?

    The U. Bioterror Act requires FDA to have this new form. Information on the Bioterrorism
    Act is available at the FDA website at http://www.cisa.fda.gov/~dma/bibtact.html


    After rewriting the original content, we can see what information is missing.
    How will I get the confirmation from the FDA? What do I do if I don''t have a
    computer?'
