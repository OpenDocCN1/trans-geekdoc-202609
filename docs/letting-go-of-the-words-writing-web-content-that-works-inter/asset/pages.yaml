  img_proc: true
- pgno: 217
  md: '# We all read the simple, short, common words faster


    Even highly educated, sophisticated readers do best with plain English writing.
    site visitors, so words that they recognize most quickly work best. And we all
    recognize and read the most common words more quickly than less common ones. Here''s
    a very short list of just a few words to change. You can create your own much
    longer list.


    | Instead of this | try this |

    | --- | --- |

    | obtain | get |

    | prior to | before |

    | purchase | buy |

    | request | ask for |

    | subsequent | next |

    | terminate | end |

    | utilize | use |


    # Consider your broad web audience


    You may be saying: "We have special words that have specific meaning in our field.
    We have to use them." If everyone is communicating with shares with your technical
    language, then it''s fine to use it.


    But think about these facts:


    +   * Most writers greatly overestimate the knowledge and vocabulary of even their
    professional audiences. A lawyer in one specialty may not know the terminology
    of another specialty – and people coming to the web for information about wills
    or leases may not be lawyers. A doctor in one specialty may not know the terminology
    of another specialty – and many health workers are not doctors. How broad is your
    audience?


    +   * The web is almost certainly bringing you broader audience than you were
    communicating with paper. Your Internet site is available to a global audience.
    As companies go global, even sites must serve people from many countries. Many
    of your site visitors may not be native speakers of the language of your web site.


    You should offer your web content in many languages and culturally appropriate
    ways for audiences in other countries and for your own country. Localizing web
    sites is an important topic, but it is beyond the scope of this book.'
  merge: -1
  img_proc: true
