  md: 'Compare the words in two versions of information for child-asthma (Figures
    8-25 and 8-26). Both say they are meant for parents, but one uses clinical, medical
    words; the other talks in ordinary people''s words. Both have questions as headings,
    but one says, "What is the incidence of asthma?” and the other says, "How common
    is asthma in children?”


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_215_0.png)


    # ASTHMA IN CHILDREN


    What is asthma? Asthma is a chronic disorder that causes spasms of the airway
    leading to narrowing of the air passage and attacks of cough, wheeze and breathlessness.
    The spasm may occur due to exposure to allergens, chemical irritants, smoke, cold
    and exercise.


    What is the incidence of asthma? Asthma tends to affect about 10% of children
    globally. Why certain people are susceptible to asthma is still not known.


    Asthma allergy may also not be associated with eczema, allergic rhinitis and allergic
    conditions. Asthma predispositions tend to run in families with inheritance between
    40-60%. Thus, allergic predisposition may be inherited, or its manifestations
    differ between parent and child.


    What is the outcome of asthma in child? Wheezing in the 1st years on life is usually
    benign and is due to small attacks in early life. As the airway grow, these children
    may become less prone to wheezing during viral infections. However, asthma inheritance
    may persist later in life. Also severe asthma may persist in adult life.


    How does asthma present in child? In children, rather than wheezing, the cough
    is the predominant symptom. Cough may recur and may get aggravated by sleep and
    exercise.


    How is asthma diagnosed? Asthma in children is a mainly clinical diagnosis. Following
    symptoms may be suggestive of asthma:


    +   - Recurrent episodes of wheezing

    - Recurrent cough – more troublesome at night

    - Cough or wheeze after exercise

    - Breathing problems during a particular season -

    - Cough or wheeze after exposure to dust, smoke, perfume, animal fur

    - Child''s cold frequently affecting the chest and takes more than 10 days to
    resolve


    > This says it is part of the "Parent Corner"


    > Would parents ask the questions this?


    > What does "mainly a clinical diagnosis?” mean?


    > The page has some useful features: question headings, short paragraphs, and
    a bulleted list.


    Figure 8-25 This article on asthma in children is addressed to parents but uses
    doctors'' language.


    www.pediatriconcall.com'
