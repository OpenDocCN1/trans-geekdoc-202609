  md: '# Breaking Up Your Text with Headings


    As you develop your web content, think about how to help people follow the flow
    of your writing or find just the section of an article that they need. One useful
    way is to use bold or colored headings within the article.


    > Compare Figure 10-1, the iVillage page on blood pressure without any headings,
    with Figure 10-2, the Familydoctor page on the same topic with several headings.
    Which would you be more likely to read?


    # Good headings readers in many ways


    The purpose of a heading is to help communicate the content that is under the
    heading. Well-written headings in well-organized text help readers by


    +   * getting interested

    * helping them get a quick overview of what is on the page

    * setting the context for each section

    * helping them make sense of what follows

    * facilitating scanning so that they can find the section they need

    * separating sections, putting a little space on the page

    * making the information seem less dense and more readable'
