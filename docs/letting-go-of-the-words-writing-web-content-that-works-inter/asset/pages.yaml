  img_proc: true
- pgno: 26
  md: '# It''s full of examples


    I know you want examples, I''ve included lots of screen shots. (It''s smart to
    take want examples; it''s easier to understand a point if you can see it as well
    as read about it.)


    In many cases, I''ve also shown how I revise the web page. In consulting projects,
    of course, I work closely with the subject matter experts to be sure that the
    final writing is accurate and consistent with the web site''s personality and
    style. Here, I''ve shown what I might because I have not worked with every web
    site that I show in the book.


    Also, web sites change. In a few cases, the site changed while I was writing the
    book and I''ve included two sites to make a point about the change. Many more
    of the sites in this book may have changed by the time you go to look at them.
    That does not invalidate what I am showing. Old even examples can make excellent
    learning opportunities. If you see ways to improve the web writing on your site
    from any of the examples in the book, the examples will deny your job.


    # It''s based in a user-centered design process


    User-centered design is a process for creating products that work well for their
    users. When you practice user-centered design, you focus on people: their goals,
    their needs, their ways of working, and their environments. User-centered design
    means that you are using technology to help people achieve their goals in what
    that work for them.


    The concepts and processes of user-centered design flow through this book. My
    goal is to help you develop a awesome and useful web site for your audiences.
    When to talk to others, you may hear like "usability," and "plain language." To
    me, those are all names for what we are striving for. They are all part of the
    same idea; they are all aspects of user-centered design.


    # If you can start the process in several places


    If you are revising an existing website, you might want to start by finding out
    how it works for the people whom you want to use it. The best technique for finding
    out how well a site is usability testing: watching and listening while representative
    users try to find specific information or accomplish specific tasks with the web
    site.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'You should not wait until the end of a project to usability testing. In fact,
    usability testing is a great way to start your web project. Test early; test often;
    test on a small-scale, iteratively.


    I''m putting lots of information about usability testing on the book''s web site
    at www.redish.net/writingtheweb.


    Other good sources are www.usability.gov and the books by Barnum, 2002; Dumas
    and Redish, 1999, and Rubin, 1994.


    # You can jump around in the book


    A book has to be linear, but you don''t have to use it that way. The path I''ve
    set up through the book is one logical way to move: from users to scenarios to
    home pages to pathway pages to destination pages – and then we pages through overall
    design, writing, lists and tables, headings, illustrations, and links – ending
    with getting from first draft to final web.


    That may not be the most logical path for you or for your project. Feel free to
    jump around in the book. Read it once quickly now and then come back to it again
    when you have a specific question or need.


    # You can join our web community


    I hope that you will learn from Letting Go the Words and that it will answer most
    of your questions. I would also like to continue the conversation that I''m starting
    in this book. Join us on the web site at www.redish.net/writingtheweb to ask a
    question, voice an opinion, and share information about usability testing and
    other topics, and share your examples.


    # SUMMARIZING CHAPTER 1


    Here are key messages from Chapter 1:


    +   - People come to web sites to satisfy goals, to do tasks, to get answers to
    questions.

    - They come for information, for the content.

    - They don''t read much, especially before they get to the page that has the information
    they want.

    - Even on information pages, they skim and scan before they start to read.

    - They want to read only enough to meet their needs.'
  merge: -1
  img_proc: true
