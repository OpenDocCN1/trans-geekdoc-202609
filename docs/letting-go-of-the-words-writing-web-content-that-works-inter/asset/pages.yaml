- pgno: 353
  md: '# 334 Chapter 13 · Getting from Draft to Final Web Pages


    used inexpensively, and grammar rules change slowly. Pick one where the presentation
    appeals to you. They say pretty much the same thing – at least for variety of
    English (U. S., Canadian, British, etc.).


    # Don''t overuse a thesaurus – stay with a consistent set of words


    A thesaurus (a compilation of synonyms) may be useful if you are looking for just
    the right word to express a thought. But for business, technical, scientific,
    or legal writing, do not use a thesaurus to find several ways of saying the same
    thing. Once you call a “widget” a “widget,” don’t change part through to “gadget.”
    You’ll confuse your readers. You’ll make it harder to translate your content.
    And if you are writing a legal document, a judge may assume you are talking about
    two different things.


    Also, make sure you fully understand the meaning of the words you choose. Even
    if a thesaurus lists two words as synonyms, you often can''t substitute one for
    the other. Check words that are new to you in a dictionary. Play safe; use the
    short, simple English words you know.


    # If your organization has a style guide, use it


    A style guide can tell you whether your organization writes “email” or “e-mail,”
    “data base” or “database.” Remember that site visitors are likely to see your
    content and content written by others in the organization in the same style you
    visit your web site.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_353_0.png)


    # Run the spell checker but don''t rely on it


    You know that the spell checker on your computer is only checking each word against
    its internal dictionaries.


    +   - If the word is in the dictionary, the spell checker will accept it, regardless
    of whether it''s the right word in the place. (If you''ve typed “now” when you
    meant “not” or “our” when you meant “out,” you know what I mean.)

    - If the word is not in the dictionary, the spell checker will reject it, even
    if it''s the right word in the place. (On my own computer, of course, I''ve added
    my name to the dictionary; but if you try it on yours, the spell checker will
    probably want to turn Redish into “reddish” or “radish.”


    > Read this sentence aloud:

    Eye kin not sea bee tour to daze meeting.

    Spell checkers would say it is fine, but, of course, it isn''t.


    Blindly checking the spell checker''s suggestions can be very embarrassing. Even
    if you agree with the spell checker that you spelled a word'
