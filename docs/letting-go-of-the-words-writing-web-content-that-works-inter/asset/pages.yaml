- pgno: 123
  md: '# Chapter 6 · Focusing on Your Essential Messages


    Journalists and technical writers know that many readers skim the head-lines and
    the first paragraphs of articles. That’s one reason they write in “inverted pyramid”
    style – with the main point first.


    # Readership


    Top of article


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_123_0.png)


    Bottom of article


    Inverted pyramid writing style matches readership.


    # Inverted pyramid style


    Top of article


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_123_1.png)


    Bottom of article


    For many web content writers, using inverted pyramid style requires a major shift
    in thinking and writing. For school essays and reports, you may have been taught
    to write in narrative style, telling a whole story in chronological order and
    building up to the main point at the end – the conclusion. That’s not a good style
    for the workplace or for the web first. Busy web users don’t have time for that
    when they are trying to find information. They want the first conclusion.


    > Jakob Nielsen advocated inverted pyramid style since 1996. See his Alertbox
    column at www.useit.com/alertbox/9606.html


    # Inverted pyramid style


    Top of article


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_123_2.png)


    Bottom of article


    # Traditional, narrative style


    Top of article


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_123_3.png)


    Bottom of article


    Web users trying to grab and go prefer inverted pyramid style to traditional,
    narrative style.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 3. Start with the key point. Write in inverted pyramid style


    Although it may be difficult to learn to write in inverted pyramid style, it''s
    a very useful skill. Chip Scanlan says:


    Chip Scanlan''s web column on inverted pyramid style is at www.poyter.org/column-asp?id=5&aid=38693


    > (Inverted pyramid style) also an extremely useful tool for thinking and organizing
    it forces the reporter to sum up the point of the story in a single paragraph.
    Journalism worthy to master it then go on to other fields it comes in handy for
    writing everything from legal briefs to grant applications.


    If you studied writing, you may have the benefit of having already learned the
    "key message first" style. For example, Blicq and Moretti, 2001. Ron Bcq taught
    this for many years, calling it "pyramid style" rather than "inverted pyramid."
    His emphasis is the same as what I''m calling "inverted pyramid here" – focus
    on your main reader and put the key message up front.


    And, I''ll add, for writing successful pages.


    6-4, a blog article about insurance, shows a good example of inverted pyramid
    style.


    Inverted pyramid style draws readers into the material at the beginning often
    with a small story or with interesting and relevant facts. To see the impact of
    starting with information that draws the reader into the material, compare two
    versions of the same information liberty at Levels 5 and 6.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_124_0.png)


    | Insurance Planet - Health Insurance, Auto Insurance, & Life Insurance News |

