- pgno: 320
  md: '# Splash pages waste people''s time


    Wikipedia defines splash pages this way:


    A splash page of a web site is a sort of pre-home page front, usually providing
    no real information besides perhaps a note about browser requirements and sometimes
    a web counter. Often this page is graphics-intensive and used only for reasons
    of branding; sometimes it provides a choice of entry points for the site proper,
    for instance links to Macromedia Flash and HTML-only versions of the site. The
    term splash screen is used interchangeably. (en.wikipedia.org/wiki/Comics_vocabulary)


    The Wikipedia definition is in the entry for comic book. Splash pages come from
    the world of comic books. But the information-rich and ecommerce web sites that
    we are talking about are not comic books.


    Nielsen and Loranger declare: "Splash screens must die!" (2006, p. 111). I agree.
    If your users value efficiency, why make them click an extra time just to get
    into the site?


    Truly unnecessary splash pages – meant to evoke a mode or a tone – have disappeared.
    They''ve morphed in two directions – the Flash videos that I''m going to denounce
    on the next few pages and the large pictures (either static or animated) that
    I''ve already denounced several for pushing critical content far down the page.


    Only a few situations legitimate cases for a page before a site’s home page:


    +   - Canadian government sites must start with a page giving English and French
    equal treatment. (And governments of other countries with multiple official languages
    may require similar treatment.)

    - Global companies must first help site visitors find their local version of the
    company''s site.


    But governments and companies, today, are finding ways to help people avoid even
    those splash pages. If I use an external search engine to get to a Canadian government
    site, the search engine returns the correct home page (English or French) depending
    on the language of my key words. Many global companies let site visitors tell
    the site to remember their location and not show them the splash page again. Think
    innovatively of how to help your site visitors get in your content as quickly
    and easily as possible – no splash, no Flash, no extra clicks.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# You wear out your welcome

    by welcoming people too much


    Making people sit through even a short movie as prepayment for using

    your site is not a successful marketing strategy. Don''t do it.


    People who come to your site want to get in to do whatever they came to

    do. You may be unaware of how many customers are losing because

    they can''t or won''t get your introductory video.


    The site about free hearing testing in Figure 11-28 may be offering a

    g service, but finding out about it is very difficult. The site opens

    with an animated sequence that takes several seconds even at very high

    bandwidth to go from a "welcome to" message to a page of pictures that

    looks like a home page with options. But it''s not. No matter where you

    click "skip this intro," "click to enter," or on any of the pictures with

    captions), the site moves to its real home page. And that page is so busy

    it''s impossible to find anything. If you go back, thinking maybe a

    different click will take you to a content page on the topic of a specific

    picture, you have to sit through the "welcome to" movie all over again.

    Time and time again. Utter frustration!


    # People want to control

    their online experiences


    One of the guiding principles of web design is that the site visitor

    be in control of the experience. Even if you give people the option to

    "skip this introduction," many people get annoyed trying to find where

    the option is or even having to click on it.


    # Videos at the beginning are

    roadblocks for some people


    It''s not just the annoyance factor. If you make having Flash (or any

    specific technology) a requirement for entrance to your site, you are

    keeping some people from getting to your content. Not everyone has

    Flash or wants it or has time to download it at the moment when they

    are trying to get information from your site.


    The site that shows the screen in Figure 11-29 is shutting out many

    potential users.


    If people can get what they need at another site, they''re likely to just

    jump to your competition. If they need the information from you, they''ll

    have to call or write — an expensive proposition for your company and

    possibly an extremely frustrating experience for your customer.'
  merge: -1
  img_proc: true
