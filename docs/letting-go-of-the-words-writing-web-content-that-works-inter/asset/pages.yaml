  md: '# Sometimes, it’s okay to talk about the organization by name


    If policies or standards in your company or agency don''t allow you to use “we,”
    push to them to change the policies or standards. If you can’t – or if, in fact,
    it makes sense to refer to the company or agency by name – you can still write
    clear, active sentences.


    Sears could have changed some of the references in Figure 8-13 to “we,” but they
    may have repeated the name and the pronoun to emphasize that they want you to
    join the Sears team.


