  md: '# 6. Give extra information its own place


    In English, once we find the subject of the sentence (the noun or pronoun at the
    beginning), we expect to find the verb close by. If extra information takes us
    off on a tangent, we may lose track of what the sentence is all about. When the
    extra information ends, and we are back in the main sentence, we may get back
    on track – and then forget the tangential information.


    Don''t put extra "stuff" between the subject and the verb. Case Study 8-1, Untangling
    a convoluted sentence, shows you how tangled a sentence can get in web content
    and how you can untangle it.


    # Case Study 8-1 Untangling a convoluted sentence


    Do you find it easy to grab the information from the following sentence?


    > Interested persons, on or before June 15, 2007, may submit to the Hearing Clerk,
    1000 Pennsylvania Avenue, NW, Washington, DC 20000, written comments regarding
    this proposal. Faxed comments will be accepted at 202-555-1234. To submit comments
    electronically, go to this site:


    > The first sentence is 26 words – not overly long, but it has too many tangents
    in the middle.


    # Finding the underlying sentence in all these tangles


    Let''s untangle the overstuffed sentence by finding the subject, verb, and object
    of the sentence.'
  merge: -1
  img_proc: true
