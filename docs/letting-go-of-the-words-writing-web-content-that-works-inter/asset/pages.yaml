  img_proc: true
- pgno: 22
  md: '# They don’t read more because . . .


    those very quickly. They read news. They read blogs. They read on topics they
    are interested in.


    Note, however, how much of this reading is “functional.” In this book, I''m not
    talking about novels and poetry on the web. I''m talking about information-sites,
    e-commerce sites, blogs that are trying to be informative, and information parts
    of web applications and e-learning programs.


    Most users don''t come to the web to linger over the words. Most of the web are
    for gathering information or doing tasks, not for the pleasure of reading. If
    your busy users lose interest or don''t find the information relevant, they''ll
    stop reading. If they can''t find what they need quickly enough, they''ll leave
    your site and go elsewhere.


    In the study reported by Nielsen and Loranger, web users spent, average, less
    than 2 minutes before deciding to abandon a site.


    And if people don''t find your site useful, they are not likely to come back.
    The Enterprise study in the margin note on page 2 found that “66% [of the professionals
    in the study] rarely – if ever – return to a site once they''ve had a bad experience.”


    # They don’t read more because . . .


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_22_0.png)


    +   - They are too busy.

    - What they find is not relevant to what they need.

    - They are trying to answer a question. They want to get right to the answer and
    read only what they need to answer the question.

    - They are trying to do a task. They want to read only what is necessary to the
    task.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Chapter 1 · Content! Content! Content!


    +   - They are bombarded with information and sinking under information overload.


    +   - As Nielsen and Loranger (2006, 22), say, “If people carefully studied everything
    they across online, they would never get to log off and have a life.”


    # What makes writing for the web work well?


    Good web writing


    +   - is like a conversation

    - answers people''s questions

    - lets people grab and go


    # Good web writing is like a conversation


    Think of your web content as your part of a conversation – not a rambling dialogue
    but a focused conversation started by a very busy person.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_23_0.png)


    How often does someone come to your web site to ask a question: How do I . . .
    Where do I find out about . . . May I . . . .


    Caroline Jarrett''s three-layer model of forms as relationship, appearance is
    as relevant to web sites as it is to forms. See www.formsthatwork.com.


    In many cases, web sites are replacing phones. In many cases, the point of web
    content is for people to get information for themselves from your web site rather
    than calling.'
