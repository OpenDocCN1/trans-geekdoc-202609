- pgno: 367
  md: '# Appoint an owner


    As with any web content, a style guide needs an "owner." Someone must be responsible
    and accountable for writing and maintaining it. The owner might convene a committee
    that represents different groups within the organization so that there is communication
    both ways between authors/editors and the style guide owner.


    # Make it easy to create, to find, and to use


    Here are several tips for creating a usable and useful style guide:


    +   * Put it online in an easily accessible place.

    * Start small. Don''t try to write it all before you get it out there.

    * Make it organic – let it grow from authors’ and editors'' needs.

    * Use the database model that we discussed in Chapter 5. Make each topic its own
    small index card. Don''t write a book!

    * Make it easy to find topics – both by searching and by browsing.

    * Write clearly, using all the guidelines for clear web writing.

    * Do usability testing to make sure that authors and editors can find and use
    it.

    * Have an easy-to-use feedback mechanism that allows and encourages people to
    ask more questions and suggest new topics.'
