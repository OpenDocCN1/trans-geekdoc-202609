- pgno: 361
  md: 'Deliver your drafts for review with individual cover emails. Tell each reviewer


    +   * what stage the draft is at

    * what specific help you need from that reviewer

    * when you must have the reviewer back

    * to call or write to if they have questions or need to renegotiate dates


    And remind reviewers politely that you expect them to comment and suggest, not
    to rewrite. Writing the content is your job.


    # If you have specific needs, let reviewers know


    In your cover email, you may be reminding each reviewer of reviewer''s role. In
    addition, you may have specific questions for different reviewers within your
    material. Develop a way of asking that makes it obvious you have a question and
    use square brackets [], put the reviewer''s name in bold, and use a bright color
    that it stands out on the screen, in this example:


    > > Jim: Please tell me who is responsible for approving travel requests. I want
    to put the passive sentence in the original into an active sentence here. Please
    fill in the blank for me at the beginning of my sentence. Thanks.


    # Making good use of reviews


    When you get reviews back, read them carefully and with an open mind.


    # Don''t let your ego get in the way


    Reading reviews is another good time to put your ego in the drawer — cheerfully.
    Don''t get defensive about your writing. Be open to reviewers'' comments. You
    don''t have to agree with all of them. You may not have to — be able to make all
    the changes every reviewer wants. But you must read and consider them all.


    # Don''t automatically accept changes


    If you are not sure that what a reviewer recommends is correct, find out more.
    Do the research to find out what is correct.


    Reviewers may give conflicting suggestions. If their differ, you need to find
    out which facts are correct. If their conflicts are about style, work to resolve
    the differences — or to convince them of the style you are using.'
