- pgno: 160
  md: '# 6. Don''t let headings float


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_160_0.png)


    The Search box should be here. That''s where most people look for it.


    The screen ends here at 800 × 600.


    People may be misled by the spacing. They may not scroll, and then, they not find
    the Search box.


    **Figure 7-11** Think carefully how your use of space might create false bottoms
    and mislead people to think that the page is finished. sin.fi.edu/


    Don''t create false bottoms on web pages. Don''t put a horizontal line or large
    blocks of space across the page. They stop them. Check out your site on different
    size monitors, and in different resolutions, and in browsers to be sure that your
    spacing is not likely to mislead people.


    # 6. Don''t let headings float


    Space should help people see what goes with what on web pages, and one important
    relationship is that between headings and text. One of the most serious problems
    on many web pages is that the headings are the same distance from the text before
    they are from the text after them. The headings float in space, seemingly unconnected
    to the text cover.


    When headings come right on top of the text, you have no question about what text
    each heading goes. Look back at the Stanford University page in Figure 7-10 and
    notice how clear the relationship is between headings and text.'
