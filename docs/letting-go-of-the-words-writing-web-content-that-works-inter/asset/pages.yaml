    # Put search near the top – where visitors expect it


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_62_3.png)


    News


    Always put the Search near the top of the page. If your site has search capability
    (and any large site should), a Search (not just a link to another page) should
    be in the same place on every page of the site.


    > "Above the fold" for a web page is whatever the visitor sees when the page first
    opens – whatever resolution or window size that person is using.


    People have come to expect that the Search box be either at the top right or at
    the left at the top of the left navigation column. Those are good places.


    Information that is "below the fold" becomes visible only if the user scrolls
    down the page.


    A long page with the Search box at the bottom is not a good idea if the site will
    draw visitors who have small monitors, low resolution, or don''t maximize each
    window. If the Search box is below the fold, many people will assume the site
    does not have search capability. They won''t scroll to look for it.


    The phrase "above the fold" comes from print newspapers, where you see only what
    is above the fold when the paper is delivered to your door or is in a vending
    machine.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_62_4.png)


    Newspaper editors know they must put the most important and inter-esting information
    above the fold to attract people''s attention.


    Blind users who like to find the Search box very close to the top of the web page.
    Screen-readers start to read from the top of the page. If the Search box is before
    other content, blind web users get to what they need quickly.'
