  md: '# When people don''t want the whole document


    If people come to your web site for information – not for documents as a whole,
    but for only some of the information in those documents – a PDF file defeats the
    very purpose and nature of the web.


    Yes, PDF files are searchable. But people don''t want to first navigate or search
    to get the document and then search within the document. They want to navigate
    or search directly to the specific information they want. And many people don''t
    know how to search in a PDF document.


    And you, can divide up a PDF document and give it a linked table of contents that
    people know how to open the index list can jump to a specific place in the document
    – but only if you have set it up well. Most PDF files are just put up on the web,
    with no attention to internal links.


    A story: I was getting information from the web site of a government agency when
    I reached a point where I needed the physical address of one of the agency''s
    regional offices. A link on the page said it would take me to a list of the regional
    offices. What would have expected to happen by clicking that link? I expected
    a single page with a list of offices. To my surprise, Acrobat started to open.
    I waited, and one more, and a document opened that had nothing at all to do with
    regional offices. It was a report about. My first thought was "wrong link," but
    curiosity led me to at least look quickly through the document. Sure enough, an
    appendix 20 pages later was the list of regional offices I needed.


    That''s not a good use of PDF. If the link promises a list of offices, the page
    comes out of the paper document and make it a separate (not PDF) web page.


