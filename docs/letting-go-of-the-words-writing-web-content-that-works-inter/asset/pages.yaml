- pgno: 76
  md: '# People don''t want to read a lot hunting


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_76_0.png)


    This part still takes up too much space.


    The instruction is short and simple.


    The page is a list of the states and U.S. territories.


    # What can we learn from this case study?


    Here are a few-takeaways that you might find relevant:


    +   - Most people will not read a paragraph of text on a pathway page. They want
    the page to tell them what to do without having to read.

    - Using the letters of the alphabet may work well as the entry to a very long
    list of topics (like an index), but it does not work well for other uses. (People
    may not connect the letters to anything other than topics.)

    - You are in a conversation with your site visitors. Think of the message that
    the page must send to keep people on a good pathway.'
  merge: -1
  img_proc: true
