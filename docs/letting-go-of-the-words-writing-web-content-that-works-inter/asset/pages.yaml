- pgno: 24
  md: '# What makes writing for the web work?


    When site visitors come with questions, you have to provide answers.

    When site visitors come to do a task, you have to help them through the task.
    But, because you''re not there in person to lead them to the right place, give
    them to do the answer, or walk them through the steps, to build your site to do
    that in your place. You have to build your side of the conversation into the site.


    # Good web writing

    answers people''s questions


    As we''ll see in later chapters, if you think of the web as conversation, you''ll
    realize that much of your content is to answer the questions that people come
    with. You do not want an entire site to be in a section called frequently asked
    questions. You do want to think about what people wanting to know and then how
    to give them that information as concisely and clearly as possible.


    # Good web writingnlets people “grab and go”


    On the web, breaking information into pieces for different users, different topics,
    different questions, and needs helps users to the web grab just what they need
    and go to look up their next question, their next task, make a decision, get back
    to work, or whatever comes next for them. In this book, we''ll look at several
    ways to write so that busy users can grab and go. Figures 1-1 and 1-2 show you
    one example of how we can transform traditional writing into good web writing.


    NEW AIRPORTS [top]

    Proponents wishing to build a new airport must file a Notice of Landing Area Proposal
    (FAA Form 7480-1), a Landing Area Sketch, and location on a 7-1/2 minute USGS
    Quadrangle Map (usually available at your USDA Soil Conservation Service). The
    information must be submitted at least 90 days in advance of the day the work
    is to begin. Proponents must submit the Notice of Landing Area Proposal (FAA Form
    7480-1), a 7-1/2 minute quad map, and a sketch or plan showing the relationship
    of the airport to the hospital buildings, parking areas, and surrounding structures.
    The FAA will conduct aeronautical studies and issue a determination to the proponent
    - determination does not


    Figure 1-1 Paragraph style makes it very difficult to quickly grab information.


    www.faa.gov'
