  md: '12. Think about tables as answers to questions


    13. Think carefully about what to put in the left column of a table


    14. Keep tables simple


    Thinking about table width


    Thinking about table length


    Format tables on the web so that people focus on the information and not on the
    lines


    Don''t put thick lines between the columns or between the rows in a table


    Don''t center text in a table


    # Breaking Up Your Text with Headings


    Good headings help readers in many ways


    Thinking about headings also helps writers


    Don''t slap headings into old content


    Twelve guidelines for writing useful headings


    +   1. Start by outlining your content with headings


    +   2. Ask questions as headings when people come with questions


    Make them conversation Ask the question from the site visitor''s point of view


    Keep the questions short


    Consider starting with a key word for fast access and readability


    +   3. Give statement headings to convey key messages


    +   4. Use action phrase for instructions


    +   5. Use noun and noun phrase headings sparingly


    +   6. Put your visitors'' words in the headings


    +   7. Exploit the power of parallelism


    +   8. Don''t dive deep; keep to no more than two levels of headings (below the
    page title)


    +   9. Make the heading levels obvious


    +   10. Distinguishes headings from text with type size and bold or color


    +   11. Help people jump to the topic they need with same-page links


    Put-page links right under the page title


    Don''t put off-page links where people expect same-page links


    Don''t put same-page links in the left navigation column


    Link headings as you move from paper to web


    +   12. Evaluate! Read the headings to see what you have done


    # Interlude: Legal Information Can Be Understandable, Too


    Make the information legible


    Make sure your legal information prints well


    Use visitors'' words in your headings


    Avoid technical language


    Avoid archaic language


    Apply all the clear writing techniques to your legal information'
