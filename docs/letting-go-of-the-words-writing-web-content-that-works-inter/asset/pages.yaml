  img_proc: true
- pgno: 63
  md: '# Don''t make people fill out

    forms they don''t want


    Starting people on forms they want on the home page is good. However, forcing
    people to fill out forms that they don''t want – or before they are ready to give
    you the information – is likely to be counterproductive.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_63_0.png)


    Think carefully about the benefits and perils of asking for information when people
    are not ready to give it to you. If you ask too early, or you ask for too much,
    or ask for information that people have to struggle to get for, you risk losing
    more than you might gain. Consider the trade-offs. If you asking people to register
    so that you can market to them later, you lose more than you gain by having people
    leave early? If people put in fake information to get past your form, does that
    end up being a costly pain to you?


    # Sending each person on the right

    way, effectively and efficiently


    Most people want to move off the home page quickly. Even first-time visitors spend
    almost no time getting a sense of the site; they immediately try to find the link
    they need to move on.


    > In the study reported by Nielsen and Loranger, average time on the home page
    was 25 to 35 seconds! People want to get on with the task that brought them to
    the site.


    Chapter 12 is all about writing meaningful links. If that''s important for you
    right now, feel free to go there and then come back to the rest of the chapter.
    I''m going to focus on two critical guidelines about writing links to help people
    get started down a good path from the home page:


    +   - Use your site visitors'' words.

    - Don''t make people wonder which link to click on.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Use your site visitors’ words


    When people come to your web site to start a conversation with you, they have
    a topic or question in mind. They are looking for the words they have in their
    minds – words that give them confidence if they click there, they''ll get closer
    to the information they are seeking.


    To make connections between what your site visitors want and the content you have,
    you must use your words – not cute, made-up names that they do not know. Cute
    doesn''t work if it doesn''t help your site visitors know where to click.


    Use all the sources of information about your web users that get discussed in
    Chapter 2 to get their words.


    # Don’t make people wonder which link to click


    Site visitors want to think about their topic, their need – not about how you''ve
    put together your site. If people don''t feel confident that you are helping them
    get to what they need, they might not feel confident that your information is
    credible or that you are a good firm to do business with.


    The web site in Figure 3-13 might make people who come to it unsure about going
    further. Lots of other sites offer car loans and ways to invest money. Busy web
    users just go elsewhere rather than try to figure out what''s where on this site.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_64_0.png)


    **Figure 3-13** Web users don''t want to have to figure out where you''ve put
    the information they need. They want to feel comfortable and confident as they
    move through your site.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Putting it all together: A case study


    Let''s see how our five points play out in a specific case. This case study is
    of revising the portal site to all the information in all the agencies that make
    up the U. S. Department of Health and Human Services.


    # Case Study 3-1 Revising the home page of a portal


    With 12 major agencies, more than 300 programs, more than 65,000 employees, and
    an annual budget of more than $500 billion, the U. S. Department of Health and
    Human Services (HHS) is larger than many major worldwide corporations. Its agencies
    include the Centers for Disease Control and Prevention, the Centers for Medicaid
    and Medicare Services, the Food and Drug Administration, and the National Institutes
    of Health – sources of information on health and safety for people all over the
    world and on medical benefits for elderly and poor Americans.


    Each HHS agency has web sites (and subsites and subsites of those subsites). The
    main page at www.hhs.gov has to serve as a portal to all the topics on all those
    agency sites – as well as give visitors the “big picture” of what HHS does.


    A team of HHS subject matter experts, web designers, and usability specialists
    – with my help as an usability consultant – revised the site in 2002. One of our
    first steps was to do a usability test of the existing site, both to get baseline
    data against which we could later compare a revised site and to identify problems
    to address in revising the site.


    Here is the old HHS home page and what we learned from watching and listening
    as people tried to use it:'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Putting it all together: A case study


    Search was a button, and many people did not see it.


    Some people tried to search requests into a topic box. It was the only form on
    the page.


    The site didn''t use a tag line. Site visitors could not tell what the department
    does.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_66_0.png)


    This topic box held only about 35 topics, so it didn''t help most visitors.


    Visitors didn''t want news. They wanted topic-based information.


    The website was all on agency sites. This link went to a page of agency descriptions
    – but then users had to decide which agency had the topic they wanted.


    Only 1 of 16 ever clicked on the A-Z link. Most said they never noticed it.


    The logos were confusing: People thought they were ads or links to sponsors, which
    is not what they are.


    # How did the site do on our five functions?


    The site failed on all five of the functions we discussed in this chapter:


    +   - **Identifying the site, establishing the brand:** People could name the
    department from the top of the page, but they had no sense of “brand.” They didn’t
    know what topics or agencies were part of HHS.

    - **Setting the tone and personality of the site:** The news in the center of
    the home page made people feel that the site was to disseminate news, not to help
    them with information – not the tone or personality the site’s owners wanted to
    project.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Helping people get a sense of what the site is all about: With little real
    information on the home page, people could not get a sense of what they would
    find through the site.


    Letting people start key tasks immediately: Most people come to this site or try
    to find a good path to specific information. Even starting a proved impossible
    for most visitors.


    Sending each person on the right way, effectively and efficiently: In many situations,
    our usability test participants gave up trying to find a way off the home page
    toward what they were looking for.


    # What lessons did we learn?


    Here are a few of our take-aways that you might find relevant for your site:


    +   * Unless news stories are your main product, don''t make news the central
    focus of your home page. People are much more interested in your products and
    services than in who was just appointed to your staff or what speech your vice
    president gave last week.


    +   * Someone has to be in charge of the home page (and the rest of the site)
    focused on your users'' needs and your business goals. Many groups compete for
    space on the home page for their pet project. Unless someone with authority and
    a focus on the users'' interests is in charge, you may end up with tidbits scattered
    around the page like the logos on the old HHS site.


    +   * If you don''t have a Search box in an obvious place, users will assume that
    any open field is the Search box.


    +   * Users are topic-focused. Most do not know, care, how your organization is
    structured. They do not want to have to know which division has the information
    they need; they just want the information.


    +   * The number of ways to get information is much less important than how easy
    those ways are to find and use. A study that came out while we were doing this
    project rated the HHS site very usable because it had many ways of navigating
    – the A-Z list, the Select Topic box, the search function, the Agency button.
    The study was done entirely by counting features, not by watching people work
    with the site! The site had all these features, but in fact, people did not notice
    them or could not use them.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # What happened?


    After 6 months and several rounds of developing and testing prototypes, HHS launched
    the new site in October 2002. The overall information architecture and design
    have held up very well since. Here is the modified site:


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_68_0.png)'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Did it make a difference?


    The new portal allows people to get what they need much more effectively and efficiently
    than the old one did. Here are some data points from usability testing:


    | Success with the new HHS portal site (16 people each doing 12 tasks = 192 attempts)
    | |

    |---||

    | Getting off the home page onto a good path | 97 percent |

    | Getting off the next menu page still on a good path | 87 percent |

    | Completing the scenario successfully | 82 percent |


    > See Theofanos, Mulligan, and Redish, 2004, for more on changing the HHS portal
    site.


    Five of the tasks we asked people to do in the usability test of the old site
    at the beginning of the project and the usability test of the new site at the
    end of the project were exactly the same. Therefore, we can compare results for
    five tasks (We had 16 participants in each test. The tests were at different times,
    so the people were different, but they were all recruited by the same group as
    the overall pool of people and had similar demographic characteristics.)


    | Comparing the two sites on the same tasks | |

    |---||

    | Success using the original home page on five tasks | 41 percent |

    | Success using the final home page on the same five tasks | 92 percent |


    # Building your site up from the content – not only down from the home page


    Most web users who come to your site are looking for information that is a few
    clicks down in the site. If they navigate to the information, they do so by going
    down a path from the home page. But to make those paths – and your home page –
    work well, you have to build the site the other way, from the information up through
    the pathways to the home page.


    To build up from the content, you have to have some sense of the content you have
    and the content you will need for the site. Do a'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Summarizing Chapter 3


    content inventory/content analysis by listing all the content you now have on
    the site. You can use a spreadsheet to keep track of the topic, the current URL,
    who is responsible for that, and so on. You might also have a column to indicate
    whether that page should be deleted, revised, or kept as is. You can also add
    notes about content that needs to be written.


    For on doing a content inventory/content analysis, see www.usability.gov/design/inventory.html.


    You can then use card sorting to find out how your web users would organize the
    content. For a card sorting study, you create a stack of 50 to 60 cards to represent
    your content with one topic on each card. Representative users sort the cards
    into groups that are logical to them. In an “open sort,” the users also label
    the groups they create. This gives you the users’ labels for your home page. In
    a “closed card sort,” you tell the users labels you plan to use and tell them
    what topics they would like under each of your labels.


    For on card sorting, see www.usability.gov/design/cardsort.html. Also see Courage
    and Baxter, 2005, Chapter 10.


    You can get help from professional information architects in organizing the content
    of your web site.


    For more on information architecture, see Rosenfeld and Morville, 2006.


    # SUMMARIZING CHAPTER 3


    Here are key messages from Chapter 3:


    +   - Don''t expect people to read much on the home page.

    - You can make your site''s identity and brand obvious with very few words.

    - Few people will read long mission statements on your home page.

    - You set the tone and personality of your site with your choices of visual style,
    colors, graphics, typography, writing style, and words.

    - A useful home page makes it instantly what the site is about.

    - A useful home page is mostly links and short descriptions.

    - Let people start key tasks right from the home page.

    - Make sure forms are visible on small screens.

    - Put the Search box near the top, where people expect it.

    - Don''t make people fill out forms that they don''t want to fill just to get
    the information on your site.

    - Send each person on the right way, effectively and efficiently, using your site
    visitors'' words and by writing clear links.

    - Build your site from the bottom up as well as from the top down.'
  merge: -1
