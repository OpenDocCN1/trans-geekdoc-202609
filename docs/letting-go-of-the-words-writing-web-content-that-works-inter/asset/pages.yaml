- pgno: 163
  md: '# 144 Chapter 7 • Designing Your Web Pages for Easy Use


    I don''t know why I see so much text on the web where each line is centered. We
    don''t read centered text well. We expect each line of a paragraph or a related
    set of text to start at the place on the left.


    When the text is centered, our eyes have no “anchor” – no steady place to come
    back to the start of each line. So centered text is much more tiring to read than
    left-aligned text.


    Even menu items in the left or right navigation column are easier to skim when
    they are lined up on the left. Indeed, column headings in a table work better
    with the items in the column if the heading starts at the left column edge rather
    than being centered over the column. Use left-aligned, ragged right for all your
    web content.


    # 8. Set a sans serif font as the default


    Most web sites use sans serif type, such as Arial or Verdana or Tahoma. That''s
    a difference between modern web sites and what has traditionally been used for
    paper documents.


    # A brief primer on fonts and type families


    If you open the font list in your word processing program, you''ll see a long
    list of available fonts. That list could be even longer; your list shows only
    some of the hundreds of fonts that have been developed.


    All hundreds of fonts, however, fall into two major categories (plus the unusual,
    artistic fonts that you would consider only for very special situations): serif
    and sans serif.


    To appreciate the difference, look at a capital T in Times New Roman and in Tahoma.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_163_0.png)'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Serifs are the "arms" and "feet" that extend down and out on the letters of
    serif fonts. "Sans" is the French word for "without." Sans serif fonts don''t
    have the arms and feet.


    # The old record on paper


    Research with paper documents in the mid-twentieth century generally found that
    serif fonts were better for sustained reading. The explanation was that the serifs
    at the bottom of the letters draw the eye horizontally along the line of type.


    However, relying on that research for your web content may not serve your site
    visitors well. There are several reasons why research may not carry over to modern
    web content:


    +   - The research is now more than 50 years old.

    - Serif fonts were the norm then. People had little familiarity with sans serif
    fonts.

    - With just a point or two more space between lines of type ("leading” – a word
    from when printers put a plug of lead between rows of type), you can make even
    a paper document in sans serif readable.

    - Not all documents are meant for sustained reading. On the web, we break information
    into small pieces with small paragraphs, short sentences, lists, and tables.


    (An aside: Even on paper, you may want to use sans serif. Brochures, forms, and
    instructions usually do very well in sans serif. This book is printed in Trade
    Gothic, sans serif font.)


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_164_0.png)


    Researchers who work with low-vision readers recommend sans serif for both paper
    and web.


    # The new research on the web – no winner for reading speed or comprehension,
    but people prefer sans serif


    Research on web content has not shown a consistent result for reading speed or
    comprehension. Some studies found that people did better with serif fonts; others
    found that people did better with sans serif fonts; still others, that it made
    no difference.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 146 Chapter 7 Designing Your Web Pages for Easy Use


    In most of these studies, no matter what font people read fastest or comprehended
    best, people prefer sans serif. It may be familiarity; people see most sites in
    sans serif. It may be that a site in serif font looks like a paper document; it
    seems old-fashioned.


    Serif compared with sans serif is not the whole story.


    Within each of those broad categories, typefaces differ in other features, such
    as how the rounded parts of letters “b” and “d” are, how high lowercase letters
    like “x” are compared to the overall height of letters like “h,” how clearly the
    typeface distinguishes between the letter “I” and the number “1,” how close the
    letters are to each other, and so on.


    Even at the same point, different fonts take up different amounts of space on
    the screen. Try it for yourself by typing the same sentence several times and
    then changing the font but not the point size for each rendition of the sentence.


    Of course, you do not entirely control what your site visitors see. They may have
    their browser set to always show a particular font. However, as the default, select
    a highly legible sans serif font. Select one that most of your site visitors are
    likely to have available on their computers. If you choose an unusual font, most
    people will not see your pages in that font because browsers use only what the
    specific computer has available. For usability testing to make sure your default
    results in legible pages.


    # 9. Think broadly about users and their situations when setting type size


    Type size for the web is not as small an issue as type size for paper. Whatever
    you specify for type size, it may be rendered differently on a Windows machine
    and a Macintosh. It may be different on different monitors and through different
    browsers. Furthermore, your site visitors may need to adjust the size. They may
    need to enlarge it they'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 9. Think broadly about users and their situations when setting type size


    have vision problems or because they want to let someone looking over their shoulder
    also see what is we on the screen. They may want to make the type smaller to fit
    more on their screen.


    # Set the default large enough for your site visitors


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_166_0.png)


    On paper, you are probably using 12-point type as the standard. That''s a good
    idea for the web, too. It''s still more difficult to read from the screen than
    paper, so making the type at least as large as what people see on paper is a good
    idea. (A book like this one can use smaller type because it is printed at extremely
    high resolution. Typical output from a desktop printer is 600 dots per inch. Typical
    screen resolution is on the order of 100 dots per inch.)


    If your audience is predominantly teenagers or 20-somethings, you can probably
    use the equivalent of 10-point type as your default, but it is resizable for other
    site visitors. If your audience is predominantly older, you might want to set
    the default at the equivalent of 14-point type, again making it resizable.


    Many content writers, visual designers, and developers creating web sites today
    are young and have great eyesight. If that''s you, think of your parents and grandparents.
    Look around and notice how many people wear eyeglasses. Vision declines with age.
    Make the default type size large enough that people want to stay on your site
    and read your content.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Chapter 7 • Designing Your Web Pages for Easy Use


    # # Adjust your content so that you can use large enough type and get your message
    into the space you have


    On the web, we are balancing how much to say and the type size for saying it.
    If you have only a certain amount of screen real estate for your content, you
    either have to write fewer words or make the type smaller. That''s a good reason
    to let go of the words and focus on your key messages.


    # # Let people choose their own text size


    Use relative type size so that people can adjust it for their needs. For example,
    you can specify type as percentages. Headings should always be larger than the
    regular text, so you might set a level-one heading as 150 percent of the regular
    text and a level-two heading as 125 percent of the regular text. (That would be
    equivalent to having 18-point level-one headings and 15-point level-two headings
    with 12-point text. Separating levels by about 3 points well)


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_167_0.png)


    Make it easy for people to adjust the type by giving buttons on the web page.
    Many sites now do this, Wired Magazine has for several years. (See Figure 7-15.)
    Most people do not know that they can do it with the browser controls, and, even
    for those who do, the buttons are a clear indication that a site has this feature,
    a reminder that they can adjust the size, and an easy way to do it.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_167_1.png)


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_167_2.png)


    **Figure 7-15** Many sites, like this one, let people change the type size easily
    right on the web page.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Make all the text adjust, not just the main content area


    All the text on the web page should get larger or smaller adjust the type size.
    On many sites, unfortunately, the main content area adjusts with these changes,
    not the side columns of navigation and other information. But navigation is also
    critical. Don''t make people squint – or leave your site – they can''t read the
    sides of your pages. Also make sure that your page is still usable when people
    enlarge the type. For example, make sure that people get to the control of a drop-down
    box and they can still use the fields in your online forms.


    # 10. Use a fluid layout with a medium line length as default


    People not only adjust the size, they adjust the width of the window they are
    looking at. This is another huge difference between paper and the web. Monitor
    sizes vary; screen resolutions vary; how much screen space people give to each
    window. For your web pages to be readable and useful, the text must adjust and
    wrap well from line to line as people resize their windows. So set your text to
    be fluid (also called a “liquid layout”).


    However, you should consider what your web page will look like if someone just
    opens it in a full window at whatever screen resolution you are designing for,
    such as 800 × 600 or 1024 × 768. For that default, use a medium line length (50
    to 70 characters or about 8 to 10 words).


    The problem with very long lines of type is physical. People’s eyes have to move
    more to get through the line. They have to move their eyes to get back to the
    beginning of the next line, and sometimes they miss a line or go back up to a
    line they have already read. Long lines are tiring to read.


    The problem with very short lines is semantic – related to the meaning of the
    words. If the line is so short that people don''t get a whole phrase or set of
    words that go together on each line, the material is hard to understand.'
