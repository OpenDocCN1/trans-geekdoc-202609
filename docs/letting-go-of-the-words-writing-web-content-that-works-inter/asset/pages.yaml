  md: '# Use the imperative in instructions


    If you are giving hints or tips or instructions, use the imperative. That''s just
    the verb by itself without "you." For example, "Run! "Think! and "Do!" are all
    imperatives. Figure 8-5 shows you a list of imperatives tips about house hunting.


    # Here are some good house hunting tips:


    +   - Imperatives also speak directly to your site visitors.

    - Take pictures inside and outside the home.

    - Bring a spouse, family member, or friend.

    - Make sure the house fits into your budget.

    - Ask about utility and maintenance costs.

    - Think of commuting time and costs.


    Figure 8-5 These tips are easy to read and remember because they each start with
    a short, plain imperative verb.

    www.freidiemac.com


    # Use "you" rather than "he or she"


    Using "you" also has another advantage: It saves you from gender-specific writing.
    In English, the third-person singular pronouns (he, she, him, her, hers) are gender
    specific. When you use one of these pronouns, some readers will think that you
    mean only people of that gender. To avoid the perception of being exclusionary,
    avoid gender-specific writing when you are writing about or to both men and women.


    If you write "employee," "customer," or "contractor," you may have a problem referring
    to that person later in the sentence or paragraph. Workarounds, such as combining
    the two genders into "s/he" or "he or she," are awkward.


    "You" is not gender-specific. As you can see in Figure 8-6, the sentences with
    "you" or the imperative avoid the gender problem and also speak more directly
    to site visitors.


    Of course, if you are talking about a specific person, it''s fine to name the
    person and to use the appropriate gender-based pronoun to refer to that person.
    Figure 8-7 is a brief item about how well Jimmy Rollins is doing playing baseball.'
