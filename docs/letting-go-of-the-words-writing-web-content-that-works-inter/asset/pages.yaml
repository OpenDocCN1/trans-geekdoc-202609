  md: '# 2. Cut! Cut! Cut! And cut again!


    Remember most web users don''t want to read much. They want to grab information.
    The key to successful writing on the web is to let go of the words without losing
    the essential messages.


    Use the process in Checklist 6-2.


    Checklist 6-2

    Process for Cutting Down to Essential Messages

    1 Go through the steps in Checklist 6-1, Process for Selecting Web Content.

    2 If you are writing questions and answers, consider whether you have written
    the shortest, clearest questions and the shortest, clearest answers. If you are
    writing in another style, consider how well your essential messages stand out
    on the web page.

    3 Focus on the facts. Cut the flab.

    4 Focus on your site visitors and what they want to know. Cut out words that talk
    about you or the organization – unless your visitors want or need information.

    5 Put your new draft away for a day or two. Then, take it out and see if you can
    cut more without losing your essential messages.

    6 Read it out loud. Ask a colleague to read it out loud. Ask a few representative
    people from your audiences to read it out loud. Listen carefully and revise based
    on what you hear.'
  merge: -1
  img_proc: true
