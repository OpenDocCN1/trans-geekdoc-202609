- pgno: 366
  md: '# Style Guide for the ATD Web Site


    # Affect and Effect


    What is the difference?

    Most of the time, "affect" is a verb and "effect" is a noun.


    +   - Examples of "affect" and "effect"

    - This policy affects only new customers

    - This policy takes effect on January 1.

    - The effect of this change will be to reduce the time it takes to prepare web
    pages.

    - Note: You can often write a better, shorter sentence without "effect.",


    +   - Policy Template

    - Procedure Template

    - Suggest a change to the Style Guide

    - Contact Us


    Possible revisions of the examples, without "effect"

    This policy starts on January 1.

    This change will reduce the time it takes to prepare web pages.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_366_0.png)


    Figure 3-2 One entry from the style guide.


    # Don''t reinvent


    If you work in a large organization, first find out if other style guides already
    exist. If there is a corporate style guide, consider how applicable it is to your
    web site. Don''t just ignore it. Work with whoever owns it to turn it into the
    organic, online style guide you need.


    Don''t repeat the entire universe in your style guide. Many excellent general
    style guides exist for writing grammatical English. Pick one and have all the
    web writers agree to use it.


    Focus instead on what the web writers aren''t sure about or what they argue about.'
