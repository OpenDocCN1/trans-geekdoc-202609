- pgno: 30
  md: '# People!

    People!

    People!


    To create a web site that communicates well, you must think about the people you
    are communicating with. Understanding your audiences and what they need is critical
    to deciding what to write, how much to write, the vocabulary to use, and how to
    organize the content on your web site.


    # We all interpret as we read


    People aren''t just passive receptacles into which writers can pour information.
    We are all constantly interpreting what we see on the screen in light of our own
    experiences and expectations. Even when we think we share the same language, it
    isn''t entirely the same. We may not know the same words. We may have different
    meanings for the same words.


    > Oyster?? Why would I click on that to find special deals for visitors.


    I need to put more money on my Oyster card. Ah, there''s the link to Oyster.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_30_0.png)


    All of us interpret what we read in light of our own knowledge and experiences.
    (In case you don''t live in London: an Oyster card is a prepaid travel card for
    public transportation.)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Successful writers focus on their audiences


    Writing successful web content doesn''t start with typing words. It starts with
    finding out about your audiences and your needs.


    +   - Who will (or should) come to your content? What about them should you keep
    in mind when writing your web content?

    - Why do they come? What are their questions, their tasks, their stories, their
    scenarios?


    Understanding your audiences will help you write the content they need in the
    words and the way they need it.


    Understanding why your web users will help you select and organize the content
    so that it best meets both your goals and theirs.


    # Seven steps to understanding your audiences


    The rest of this chapter gives you seven steps with lots of tips for getting and
    using information about your web users and why they come to your site:


    +   1. List your major audiences.

    2. Gather information about your audiences.

    3. List major characteristics for each audience.

    4. Gather your audiences'' questions, tasks, and stories.

    5. Use your information to create personas.

    6. Include the persona''s goals and tasks.

    7. Use your information to write scenarios for your site.


    # 1. List your major audiences


    One way to list your major audiences is to ask: “How do people identify themselves
    with regard to my web content?” For example:


    +   - patients, health care professionals, researchers

    - parents, teachers, students

    - passengers, pilots, mechanics, airport operators'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 2. Gather information about your audiences 13


    Another way is to ask: “What about site visitors will help me know what content
    the web site needs and how to write that content?” This may lead to listing your
    audiences


    +   - experienced travelers, occasional travelers

    - local residents, tourists coming to town

    - lookers, bookers

    - shoppers, browsers


    Notice that when I list these user groups, I''m always referring to people – human
    beings. Don''t get caught up naming departments, institutions, or buildings as
    users of your site.


    Don''t say that you are writing for “Finance.” “Finance” may be a department with
    many people who have different jobs, different knowledge, and different needs
    from your web site.


    Don''t say you are writing for “Banks.” The bank is a building and buildings don''t
    use web sites. Are you writing for bank executives? branch managers? tellers?
    customers of the bank? Those are all different audiences and the differences on
    the site may be important. They may be looking for different content on the site.
    They may know or not know specific vocabulary that you want to use.


    # 2. Gather information about your audiences


    You can start to understand your audiences by thinking about them. But that''s
    not enough. To really understand who they are, why they come, what they need,
    and how to write web content for them, you have to know them and their realities.


    If you write your web content only on what you think your audiences are like,
    you will be writing from assumptions. If your assumptions are wrong, your content
    won''t work.


    Here are several suggestions for finding out your audiences. Try to do all them,
    the ones at the end – actually watching, listening to, and talking with your web
    users and potential users of your site – are the most useful of all.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 2 · People! People! People!


    +   - Think about your mission. Who are you supposed to serve? What are you supposed
    to help them accomplish?


    +   - Read the emails that come through your Contact Us and other feedback-lines.
    Who is writing? What are they asking?


    +   - Talk to Marketing. Whom are they targeting?


    +   - Talk to Customer Service. Who is calling with questions? What are those
    questions?


    +   - Get people who come to the site to fill out a short questionnaire. Ask people
    few questions about themselves, why they came to the site, and whether they were
    successful in finding what they came for.


    +   - Watch and listen to people.


    +   - If your site mirrors a brick-and-mortar business (e-commerce, banking and
    other financial institutions, travel, and so), spend time in the physical location
    observing and listening to customers.

    - If you are a government site, realize that government agencies often have "brick-and-mortar"
    equivalents. Spend time in a local office of the agency watching and listening
    for whatever is relevant to your web content. This might mean watching people
    come to renew their driver''s license or get a permit or sign up for benefits
    or as tax forms.

    - If you are creating an intranet, spend time observing and listening to employees
    from different areas and in different jobs.


    > For information on many techniques for understanding your web users, see Courage
    and Baxter, 2004.


    > Designing a good survey is not trivial. A good book on survey design is Dillon,
    2007.


    > For ideas on watching, listening to, and talking with people at their work,
    see Hackos and Redish, 1998.


    +   - Interview people who use or might use your web site. Use these techniques:

    - contextual interviewing (where you watch and listen as people do their own work)

    - critical interviewing (where you ask people to tell you about specific times
    that they used the site; sometimes, they can also have show you what they did)


    > For information on contextual interviewing, see Holtzblatt, Wendell, and Wood,
    2005.


    > For information on the incident technique, see the Wikipedia article on topic.


    +   - Do usability testing of the current content. Watch and listen to usability
    test participants with your web site. Ask them about themselves, their needs,
    and what they are using of.


    # 3. List major characteristics for each audience


    After you find out about the people who come (or should come) to your web site,
    list relevant characteristics for each of your user groups. Here are some categories
    to cover.


    +   - key phrases or quotes

    - experience, expertise'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 3. List major characteristics for each audience 15


    +   - emotions

    - values

    - technology

    - social and cultural environments

    - demographics (age, ability, and so on)


    # Key phrases or quotes


    If you asked your web users what they want you to keep in mind them as you write
    to them, what would they say?


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_34_0.png)


    # Experience, expertise


    Consider your site visitors'' experience and expertise in both the subject matter
    and in using the web. You may have differences here for different user groups.
    (You may also have a range of experience or expertise within a user group; note
    that, too.)


    For example, for a travel site:


    | Experienced travelers | Probably familiar with other travel sites; probably
    know how e-tickets work; may know airport codes of places they travel to frequently;
    want fast ways of working – probably need little explanation at each step |

    | Occasional travelers | May not be familiar with travel sites; may not know how
    e-tickets work; probably do not know airport codes; may need explanations at each
    step |'
  merge: -1
  img_proc: true
