- pgno: 355
  md: '336 Chapter 13 - Getting Draft to Final Web Pages


    # Share partial drafts


    If you are writing a log of web content, don''t wait until you have it all ready.
    Share one draft or part of an article if you are on the right track with level
    of detail, tone, organization, writing style, and so on. That could save you lots
    of time and grief. The earlier you learn what to change, the less effort it takes
    to make the changes.


    # Get feedback online


    In addition to traditional ways of sharing drafts (for example, emailing the draft
    or a link to the draft to distributing the draft to an internal group through
    your content management system), consider how the Internet can help you get feedback
    on your content. You can have us options, email to the webmaster, private feedback
    to the author, reviews, public comments that are really an open conversation among
    your readers, and so on. These may be moderated or not; threaded and searchable
    or not; expecting an answer back or not.


    You probably think of these as post-publication feedback; and, indeed, some of
    these feedback mechanisms become available only after your web content has been
    posted. But think of how to use them or variations of them for pre-publication
    feedback as well.


    Depending on how much you want to limit (or not) the audience for your drafts,
    you might set up


    +   - a group blog or a Yahoo! or other group for sharing drafts among a given
    set of people

    - a small Wiki for a group of people who edit each other''s writes

    - a site on which to pre-publish drafts and invite comments


    +   - Many groups put out pre-prints of their articles for discussion before the
    articles appear in formal journals. And pre-prints have been joined by e-prints
    that include papers that never become formally published. Check out arxiv.org.


    +   - The future of the web is likely to be even more interactive and conversational
    than it currently is. I see the web not only as a conversation between you and
    your site visitors (the theme of this book), but as a much larger conversation
    among many people. In the future, we may see much more public sharing of drafts
    both of web content and of material that will eventually appear in print, like
    book chapters.'
