- pgno: 46
  md: '# 7. Use your information to write scenarios for your site


    Don and Mariela Garcia had their second baby, so they need a bigger car. Don''s
    construction work is going well, but Mariela is staying home for a while, they''re
    worried about money. They''re going to need a loan to buy the new car, and they
    want a good deal.


    Mariela knows about computers and the web from the job she was doing before she
    got married. But she can only go on the web in bursts – when the children are
    napping or late at night when Don can look with her. And then they are very tired.


    They aren''t financial experts; they don''t know all the banking terms that some
    of these sites use. They''re trying to find a site with good loans that talks
    to them with words they understand.


    **Figure 2-6** A scenario for developing a bank or credit union site.


    # Everything on your web site should fulfill a scenario


    Everything on your web site should relate to at least one scenario that a real
    user might have for coming to the web site. (You do not need to have actually
    written the scenario for every piece of content, but there should be a plausible
    one that you could.)


    If no one needs or wants the information – if there is no plausible scenario for
    the content – why have it on the web site? It''s only taking up server space and
    perhaps showing up in search results where it distracts people from what they
    really need.


    # Scenarios can help you write good web content


    If your scenarios are based on watching, listening, and talking with people, they
    can help you


    +   - focus on what is important to your site visitors

    - write with their words

    - realize how goal-oriented most web users are


    As you plan your web content, always ask: Who will use it? What should I keep
    in mind about them? What story (scenario) will bring them to my web content?'
