- pgno: 327
  md: '# Chapter 12 · Writing Meaningful Links


    +   - action phrases with verbs – Contact us, Sign in, Open an account

    - category labels – usually single nouns or short phrases – News, Printers, Citizens,
    Business, Ages 4–7


    # Twelve guidelines for writing meaningful links


    Use these 12 guidelines when writing meaningful links:


    +   1. Don''t make new program and product names into links by themselves.

    2. Rethink document titles and headings that turn into links.

    3. Think ahead. Match links and page titles.

    4. Be as explicit as you can in the space you have – and make more space if you
    need it.

    5. Use action phrases for action links.

    6. Use single nouns sparingly; longer, more descriptive links often work better.

    7. Add a short description if you need – rewrite the link.

    8. Make the link meaningful – not Click here, just More.

    9. Coordinate when you have multiple, similar links.

    10. Don''t embed links if you want to stay with your information.

    11. If you use bullets with links, make them active, too.

    12. Make both unvisited and visited links obvious.


    # 1. Don''t make new program and product names into links by themselves


    Many organizations create new programs and new products with cute names. Once
    people know the name, it may make sense. It may even be memorable. But until people
    know what it means, it''s meaningless.


    Why should people click on a link if they don''t know what to expect? Remember
    that your web site must serve new people not just those already in the know.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_327_0.png)


    > Both The British Museum (Figure 12-1) and the Colorado Historical Society (Figure
    12-2) have links to something called Compass. Would you click on it on either
    site? What do you expect to find? Do you expect the same type of informa-tion
    in both cases?'
  merge: -1
  img_proc: true
