  md: '# Think about other situations in which pictures or diagrams would help people


    Travel, theater, sports events, and many other situations lend themselves to pictures
    or diagrams of exact items to help people serve themselves.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_298_0.png)


    # Help people make connections between information on paper documents and fields
    on online forms


    You can help people by showing them where on a card or paper document the information
    you want from them is located. When e-commerce sites started requiring the security
    code from credit cards as well as the number and expiration date, many sites included
    a picture of the back of the card to show where to find the code.


    The state of New Jersey sends car owners a paper document to remind them to renew
    their vehicle registration. The paper document includes a personal identification
    number (PIN) for renewing online. Many people didn''t notice the PIN and, thus,
