  md: 'Chapter 12 • Writing Meaningful Links


    As people move through web sites, the first question they ask on new page is "Did
    I get there I thought I was going?" They expect the page title to match the link
    they clicked. Matching links and page titles is the best way to reassure your
    visitors that they are on a good pathway or have gotten to the information page
    they expected.


    +   - As you write the page title, think of how the same words will work as the
    link on all the pages where the link will appear.

    - As you write links, think of how the same words will work as the page title.


