- pgno: 279
  md: 'In fact, the list was on the page; it was in the left navigation column. But
    the participants'' reaction was “I wouldn''t look there. That''s where I look
    when I think my answer isn''t on this page.” (This page is gone; the site has
    changed.)


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_279_0.png)


    # Link headings as you move from paper to web


    Providing same-page links is one of the easiest and most useful changes you can
    make if you are moving a paper document to the web. (Of course, I urge you to
    review the entire document, rethink it for the web, probably break it up even
    more than it is, and so on; but in any case, make sure that each section you make
    into a web page has useful headings and turn them into same-page links.)


    # 12. Evaluate! Read the headings to see what you have done


    How do you know if you''ve got good headings? Use this technique with both your
    old content before you revise and your new content when you have a draft.


    +   - Read just the headings on your web page – without any of the text that is
    under the headings.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Answer these questions:


    +   - Do you understand what each heading means by itself?

    - Do the headings tell a coherent story? Do they flow logically one to the next?

    - Do they successfully give you a "big picture”? Can you get the gist of all the
    information from the headings?

    - Do they年纪 different sections? If you wanted only some of the information, is
    it clear where you would go for that information?


    If you answer "no" to any of these questions, the headings are not working well.
    You may need better headings. You may need to rethink, reorganize, and rewrite
    the content.


    # SUMMARIZING CHAPTER 10


    Here are key messages from Chapter 10:


    +   - Break up your text with headings.

    - Good headings help readers in many ways.

    - Thinking about headings also helps writers.

    - Don''t slap headings into old content.

    - Start by outlining your content with headings.

    - Ask questions as headings when people come questions.

    - Make them questions people come with.

    - Think conversation. Ask the question from the site visitor''s point of view.

    - Keep the questions short.

    - Consider starting with a key word for fast access and accessibility.

    - Give statement headings to convey key messages.

    - Use action phrase headings for instructions.

    - Use noun and noun headings sparingly.

    - Put your site visitors'' words in the headings.

    - Exploit the power of parallelism.

    - Don''t dive deep; keep to no more than two levels of headings (below the page
    title).

    - Make the heading levels obvious.'
