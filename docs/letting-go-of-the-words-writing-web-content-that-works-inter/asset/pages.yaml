- pgno: 216
  md: '# Asthma and children


    Reviewed by Dr Stuart Crisp, paediatric specialist

    Last reviewed by Elizabeth Clarke, consultant paediatrician


    What is an asthma attack?

    The mucous membranes in the small branches of the airways (bronchi) swell and
    the circular muscles tighten (twitch or bronchospasm).


    More mucus is produced in the already restricted airways, which makes breathing
    difficult and causes wheezing when breathing out.


    About 12 per cent of children get asthma during their childhood.


    What symptoms can children be due to asthma?

    Small children (up to three years):


    +   - a wheezing sound when breathing out

    - coughing, wheezing or breathlessness with exercise

    - persistent coughing, not because of a cold, or only at night

    - generally feeling unwell

    - recurrent colds from which it takes a long to recover.


    Children from 3 to 15 years:


    +   - a wheezing sound when breathing out

    - prolonged coughing, especially at night

    - waking up coughing during the night or in the morning

    - inactivity or lethargy - no longer wishing to play physical games or take other
    exercise when they have enjoyed it before.


    How common is asthma in children?


    +   - Chronic asthma is the most frequent long-term children''s disease.

    - About 1 to 12 per cent of all children get chronic asthma during their childhood.

    - Approximately 15 to 20 per cent of all children will have symptoms of wheeze
    without having chronic asthma.


    What causes asthma in children?

    An acute asthma attack usually at the time of a cough and cold caused by a viral
    infection.


    This article explains asthma in ordinary language.


    The questions are in parents''s language.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_216_0.png)


    The text includes terms in parentheses after the explanation. Parents may want
    to understand these words - in the case they use them.


    The bulleted lists make easy to grasp.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_216_1.png)'
