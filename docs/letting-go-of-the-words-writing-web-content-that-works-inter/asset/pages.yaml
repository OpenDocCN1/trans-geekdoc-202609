    # Introducing Letting Go of the Words


    My goal in this book is to provide your site visitors with high-quality content
    that is easy to find and easy to understand. Letting Go of the Words is about
    planning, selecting, organizing, writing, illustrating, reviewing, and testing
    content that meets people''s needs – that gives them a successful and satisfying
    web experience.


    Let''s talk a bit about what this book is and what it is not, as well as about
    how you might work with Letting Go of the Words.


    # It''s about writing and design, not technology


    Letting Go of the Words is about strategy and tactics, not about tools. I''ll
    help you think about people who come to your web site and you write so that they
    have a successful web experience and you have a successful web site. Technology
    changes too fast to be a major part of the book – and the principles of good writing
    for the web transcend technology you use.'
