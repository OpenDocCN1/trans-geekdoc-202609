    So far, we''ve focused on web users who come into your site at the home page and
    navigate down into the site through your pathway pages to the information they
    want. Certainly, some of your site visitors do that.


    > Nielsen and Loranger (2006, 27) found that "interior pages" accounted for 60
    percent of the initial page views.


    But many web users bypass these pages. In fact, on many web sites, more users
    come through an external search engine than the home page. That''s a reality.
    You have to assume that your'
