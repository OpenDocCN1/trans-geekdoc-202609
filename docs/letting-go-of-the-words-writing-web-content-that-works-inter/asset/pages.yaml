  md: '# # Getting from Draft to Final Web Pages


    Your job as a web content writer isn''t over when you''ve first created the content.
    Whether you are a blogger, a solo author on your own web site, or part of a larger
    organization, you will have better and clearer content if you include editing,
    revising, and proofreading in your writing process. If you have colleagues and
    stakeholders, you may also need to give your drafts to them and then negotiate
    with them about what to how to say it.


    Your attitude about reviewing and revising can go a long way to make it a smooth
    and productive process. Make it fun. Make it a learning experience. As Tom Brnick
    told me to tell you when he reviewed the draft of this chapter:


    > > You should delight in feedback and getting your content just right. You should
    enjoy the surprises and discovery when people come from a different perspective
    and want something totally didn''t expect. If you''re brewing in resentment over
    having to suppress your supposedly good ideas, take the opposite perspective:
    you''re going to die of stomach ulcers. Share your ideas and love what you learn,
    not as your ideas are “shot down,” as your ideas compete in an ecology of good
    ideas and improve as a result.


    To help you get easily and successfully from first draft to final web pages, this
    chapter has six sections with lots of guidelines and tips:


    +   - Think of writing as revising sections

    - Review and edit your own work'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Chapter 13 · Getting from Draft to Final Web Pages


    +   - Ask colleagues and others to read and comment


    +   - Put your ego in the drawer – cheerfully


    +   - Work with a writing specialist or editor


    +   - Make reviews for you and your web site visitors


    # Think of writing as revising drafts


    Do you ever get writer''s block? Find it hard to sit down to write? Procrastinate
    as long as possible?


    Some people find it hard to start writing because they think that-ever they put
    down has to be perfect on the first try. Not so!


    Your first draft should not be your final draft. A good way to get over writer''s
    block is to remember that you can fix it later. Perfection is achievable, but
    you''ll get closer to it with each revision. (And you must at some point stop
    revising and meet the deadline to publish!)


    When you look at a book like this one, you see only the final result. You don''t
    see the many, drafts it went through. If you watched me for half an hour, you
    would see lots of backspacing; deleting; cutting, adding, and moving of text;
    rewriting; starting over; staring into space; trying something and rejecting it;
    and so on. Writing is actually a very messy activity.


    Successful writers read their own work. They read many times. They read it, revise
    it, read it again, revise it again, and so on. Successful writers share their
    work in draft, try their writing out with relevant audi-ences, and revise based
    on what they learn from their earlier readers.


    # Review and edit your own work


    You should be your own first editor. (But not your last editor. See the tips later
    in this chapter on getting help from others.)


    # Read what you you wrote


    If you''ve ever been embarrassed by an email you sent without reading what you
    wrote, you know how little things slip by. Your fingers may not typed what you
    thought they did. You may have left out a word – or put in an extra one. You may
    have thought you were making sense and, then, on reading it, wonder what you meant.'
