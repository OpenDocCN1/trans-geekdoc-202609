- pgno: 356
  md: '# Pay attention to the feedback


    Take advantage of all the feedback you get, before and after you publish. I''m
    focusing in this chapter on feedback before you publish your web content. But
    what you you learn about your content, your style, your level of detail, and so
    on, after you publish can help you do a better job of the next web content you
    write.


    # Work with colleagues to

    a uniform style and tone


    Many writers are part of an organization where the web site represents the organization
    and not the individuals writers. If you are in that situation, you have to make
    sure that you – and all your fellow writers in the organization – are writing
    the same way. Readers should not be able to tell who wrote what on the web site.


    # Put your ego in the

    drainer – cheerfully


    Did you bristle at that last paragraph where I said readers should not be able
    to tell who wrote on the web site? If you are writing poetry, fiction, or your
    own blog, your voice as author is a large part of what you are projecting through
    your web site or your blog. That''s fine. But if you are writing in an organizational
    setting, it''s not about you as author. It''s about communicating clearly so that
    the people who come to the web site can find what they need and understand what
    they find.


    Of course, you should take pride in your work. That pride can be in working as
    a team with colleagues to have a web site that has a consistent writing style,
    a consistent tone, a consistent vocabulary, and a consistent message.


    Don''t get into arguments about what "I" like or another "I" likes. Put your "I"
    away. Everyone else put their "I" away. Get out your personas (see Chapter 2).
    Talk about the conversation that your site comes with you and what information,
    style, tone, and vocabulary will work best as your (collective) conversational
    response.


    Put your ego in the drawer when you get reviews and feedback. Listen with an open
    mind. Don''t get defensive about your writing. That doesn''t mean you have to
    take every suggestion a reader or editor or reviewer gives you. It just means
    you have to consider it carefully. (More on this section later in this chapter
    on working with reviewers.)'
