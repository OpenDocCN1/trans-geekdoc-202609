  img_proc: true
- pgno: 259
  md: '# 2. Ask questions as headings people come with questions


    In many types of web content, questions work extremely well as head-ings. That''s
    because visitors come with questions in mind. When you write your questions as
    the headings in your web content, you acknowledge the conversation they want to
    have with.


    As I said in Chapter 1, I''m not suggesting that you make your entire site a huge
    section of frequently asked questions. That would only make it hard for people
    to find their specific question. I''m suggesting questions and answers (Q&A) as
    an appropriate writing style for many of your individual web pages, like the FamilyDoctor.org
    page that you just saw as Figure 10-2.


    In fact, Q&A is more than a writing style; it''s a fundamental viewpoint making
    a web site focus on the people who are coming with ques-tions. Of course, sometimes,
    you have to put a question in people''s minds that they may not have thought to
    ask but recognize as important when they see it on the web page.


    For example, many people wonder pandas are real bears. Seeing the Diego Zoo, "Are
    giant pandas bears?" on the San Diego Zoo''s site may draw them into finding out
    that pandas are, in fact, related to bears. And then they may keep reading the
    panda page (Figure 10-4).


    Questions make very useful headings in all these different types of docu-content:


    +   * articles

    * explanations

    * handbooks

    * introductions to manuals

    * policies

    * press releases

    * regulations

    * troubleshooting information


    (You can also use statements as headings in these same types of docu-ments, as
    you see in the panda page in Figure 10-4. I''ll talk more about statements as
    headings in Guideline 3 a little later in the chapter.)'
  merge: -1
  img_proc: true
