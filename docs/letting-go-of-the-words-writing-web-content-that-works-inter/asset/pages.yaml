- pgno: 268
  md: '# 4. Use action phrase headings for instructions


    Many of the questions that users bring to web sites are “How do I . . ?” If you
    have only one question with many other questions on a web page, it’s fine to keep
    that as a question.


    However, if you have a series of questions, all of which would start “How do I
    . . ?” people may have a hard time finding the one they want.


    | How do I set up an account? | Setting up an account |

    | How do I view my information? | Viewing your information |

    | How do I change my information? | Changing your information |

    | How do I pay online? | Paying online |

    | How do I get help? | Getting help |


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_268_0.png)


    Which set of headings is easier to scan and use?


    When you find yourself writing “how do I . . .” over and over, take away the repeated
    words and start each heading with the action word.


    Action phrases make great headings in any type of instruction: manuals, procedures,
    or help for a web application.


    Two good ways of writing action phrase headings are with gerunds (the form that
    ends in “–ing”) or with imperatives (the “Do this . . .” form of the verb).


    Instruction writers commonly use the “–ing” form when dividing web content into
    different tasks. An example would be the list of tasks in the right column of
    the table on this page. On the web, each of these headings, “Setting up an account,”
    would probably link to its own web page. And the specific steps on that page would
    probably each start with an imperative.


    The imperative works very well within a web article as a heading style for tips
    and short paragraphs of advice. Look at the example from Celestial Seasonings
    in Figure 10-10.'
  merge: -1
  img_proc: true
