  md: '# Chapter 5 — Writing Information, Not Documents


    # Weight Control and Diet


    December 2001


    # WHAT IS OBESITY?


    Stable weight depends on an even balance between energy intake from food and energy
    expenditure. For about two-thirds of expended energy, energy is used during the
    day in three ways:


    +   - As energy used during rest (basal metabolism). This accounts for most to
    maintain body functions, such as maintaining body temperature and muscle contractions
    in the heart and intestines.

    - As energy used to metabolize food (thermogenesis), accounting for about 10%
    of expended energy.

    - As energy expended during physical activity.


    When a person''s calorie intake exceeds her energy expenditure, the body stores
    the extra calories in the fat cells present in adipose tissue. These adipose cells
    function as energy reserves, and they release or contract depending on how people
    use this energy. Balancing intake and output by adopting healthy habits and regular
    exercise, fat builds up, and they may become overweight.


    # Measurement of Obesity


    Obesity is determined by measurement of body fat, not body weight. People might
    be over the weight limit for


