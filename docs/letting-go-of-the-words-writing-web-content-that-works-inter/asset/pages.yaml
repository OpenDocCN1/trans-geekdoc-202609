  md: '# Chapter 6 Focusing on Your Essential Messages


    In 2005, the National Center for Educational Statistics (NCES) released the preliminary
    findings from its 2003 National Assessment of Adult Literacy. This survey, the
    most comprehensive measure of adult literacy in the United States since the 1992
    survey, reveals how people use and understand information. The power of this survey
    is that it uses tasks that people need for success in their everyday lives—filling
    out an order or balancing a checkbook or reading a prescription label.


    The results placed participants in one of four categories and showed


    +   - 14% of the adult population (30 million people) to be at the below basic
    literacy level,

    - 29% (63 million people) at the basic level;

    - 44% (95 million people) at the intermediate level; and

    - 13% (28 million people) at the proficient level.


    In short, over 93 million people are functioning at basic or below basic literacy
    levels meaning they have limited ability "to use printed and written information
    to function in society, to achieve one''s goals, and to develop one''s knowledge
    and potential." Over 43% of Americans struggle with basic, everyday tasks that
    are often taken for granted.


