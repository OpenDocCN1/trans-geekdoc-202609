  md: '# # INTERLUDE Creating an Organic Style Guide


    As you create your web content, you and your colleagues may have questions about
    grammar, spelling, punctuation, and writing style.


    Organic = start small and let it grow as issues and arise


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_364_0.png)


    Mmm. For our content, are we writing "data base" or "database" "e-mail" "web"
    or "Web"?


    What style are we using for headings on our intranet?


    On our site, how are we writing list items? When we start each list item with
    a capital letter, and when we don''t we do that?


    # ## Use a style guide to keep the site consistent


    At any time, some aspects of every language are in transition. For example, many
    words come into English with a hyphen, like “e-mail,” and over time lose the hyphen.
    But different people and organizations are at different places in the transition.
    Still use the hyphen; others don''t. To have a consistent web site, you have to
    decide where your site is in transition.


    Remember that we discussed web sites'' personalities in Chapter 3. Organizations,
    like their web sites, have personalities and corporate cultures. (And that''s
    true for all types of organizations and communities, not only for businesses.
    Government agencies, universities, non-profits, listservs, other communities all
    have their own cultures.) Language is an important aspect of any culture. How
    formal or colloquial the language should be (“cannot” or “can''t”); what is acceptable
    usage (“each person . . they?”); how words are used (“website” or “web site?).


    A style guide can help authors and editors keep a web site consistent. In fact,
    even if you are the only author (doing a blog, perhaps), a short “cheat sheet”
    style guide may be useful. I''ve created one for this book,'
