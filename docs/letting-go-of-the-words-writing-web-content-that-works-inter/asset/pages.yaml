    # Apply all the clear writing techniques to your legal information


    You can use personal pronouns in legal information. (Consider the agreements you
    sign for credit cards, cell phones, cable service, insurance, and so on. Almost
    all of them we use "we" and "you.")


    +   In the process of or following consultation of this web site, data pertaining
    to identified or identifiable persons may be processed.


    +   When you use this web site, we may collect data about you and people you tell
    us about for example, to whom you are sending a gift. We may use that data to
    . . .


    You can write legal information with short, active sentences; with lists; and
    tables. You can break legal information into short pieces, and each piece can
