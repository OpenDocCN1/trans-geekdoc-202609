- pgno: 43
  md: '# “Users” yes or no? – a note on vocabulary


    Pruitt and Adlin, in their book on personas, advocate removing “user” from your
    vocabulary. They say not to talk generically about “users” – rather always focus
    on your specific personas by name. That’s a great idea for a specific web site
    or specific content.


    In this book, however, I need more genres. You – my audience – are so diverse
    (I hope) that you are dealing with many different types of web content for many
    different types of people. The personas for your web content differ from the personas
    for other personas by web content. What generic words should I use?


    You’ll notice that I am using “people,” “web users,” “site visitors,” and “audience.”
    I hope that all of these words work for you.


    Shortening “web users” to “users” bothers some people, so I avoid that most of
    the time. However, I prefer “user” to “reader” for most discussions of web content
    because people do not come to web sites for the pleasure of reading. They come
    to gather information. They “use” web sites; they “use” web content.


    “User” emphasizes that people come with goals, tasks, with questions. “User” helps
    us focus on the functional nature of web content and the need to help people skim,
    scan, and grab and go. “User” is not a pejorative word; it’s an accurate description
    of people interacting with web content. I hope that you use the word “user” in
    this book, you’ll read it with the friendly meaning: “person coming to my web
    site to ask a question, do a task, or see what I have to say.


    # 6. Include the persona’s goals and tasks


    The persona’s major goals and tasks for your site are an important part of your
    persona description. Figure 2-4 gives you an example for one of five personas
    developed by a web team that researches and reports on issues in agriculture and
    food production.


    # 7. Use your information to write scenarios for your site


    Scenarios are short stories that give you a good sense of the people who come
    to your site, what their lives are like, and what they want to do at your site.
    Scenarios give life to goals and tasks in the same way that personas give life
    to lots of data about your web users.


    To understand how useful story- (scenarios) can be in developing-useful and usable
    web sites, read Whitney Queensberry’s chapter in the Pruitt and Adlin book.'
  merge: -1
  img_proc: true
