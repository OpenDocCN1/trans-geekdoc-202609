  md: "# Chapter 4 - Getting There: Pathway Pages\n\nIf your part of the site is a\
    \ subsite of a subsite, you may have several home pages going back up a pathway\
    \ to the main home page. If so, label every “home” link clearly. I've watched\
    \ usability test participants feel completely lost when a click on “home” takes\
    \ them to a different home page than the one they expected.\n\nPages inside a\
    \ site that have no connection to the rest of the site expose rifts within the\
    \ organization to the outside world. They send the message to the people doing\
    \ this part of the site don't feel that they have to cooperate with the larger\
    \ community of the organization. They indicate that no one is managing the larger\
    \ organization's site with enough clout to bring everyone. The web content owner\
    \ – and the organization – and the site visitors – all lose out on the value the\
    \ web brings of connecting content in one place elsewhere on the web site.\n\n\
    # SUMMARIZING CHAPTER 4\n\nHere are key messages from Chapter 4:\n\n+   * Most\
    \ site visitors are on a hunt – a mission – and the pathway is just to get them\
    \ there.\n* People don't want to read a lot while hunting.\n* A pathway page is\
    \ like a table of contents.\n* Sometimes, short descriptions help.\n* Marketing\
