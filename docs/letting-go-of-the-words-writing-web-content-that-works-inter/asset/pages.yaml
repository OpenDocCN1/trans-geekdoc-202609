- pgno: 362
  md: '# Summarizing Chapter 13


    If you think a reviewer''s change is not in the best interests of your web users
    or will hurt rather than improve your writing, think about why the reviewer made
    the suggestion. Don''t just dismiss the comment. Think carefully before deciding
    what to do. For different reviews and different relationships between you and
    specific reviewers, what you may do is any of the next four suggestions.


    # Rewrite to avoid misunderstandings


    If a reviewer misunderstood something you wrote, you may not have stated it as
    clearly as you could. Try again. And, then, if possible, run that piece by the
    reviewer again.


    # Persuade, if you can


    If the reviews tell that you are based on different perceptions of purpose, audience,
    scenarios, or appropriate style, you may need to evangelize clear writing. Within
    the constraints of your corporate culture, push for clear web writing for legal
    and technical information. Your web users need you to do that for them. I hope
    the examples and the rationales in this book not only persuade and mentor you
    but also prove useful to you in persuading and mentoring others.


    # Negotiate, if necessary


    The teamwork that successful web sites require often involves compromises and
    negotiations. Don''t make reviews confrontational situations. Work with reviewers
    to put accurate, reliable, and clear information on your web site. Remember that
    even legal information can be legally accurate, legally sufficient, and clear
    enough to understand.


    > The Interlude titled Legal Information Can Be Understandable, Too.


    # Let reviewers know what you did and did not do


    Communicate! Communicate! Reviewers who feel that you ignored their comments in
    one round of review are less likely to give your materials a thorough review in
    the next round. Keep a summary of the changes you made and did not make, especially
    for technical, legal, and policy reviewers. If you have several rounds of review,
    include the summary from the previous round with each new round.


    # SUMMARIZING CHAPTER 13


    Here are key messages from Chapter 13:


    +   - Think of writing as revising drafts.

    - Review and edit your own work.'
