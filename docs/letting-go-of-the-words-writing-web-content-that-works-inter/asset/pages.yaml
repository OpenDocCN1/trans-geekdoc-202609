  md: '# Chapter 9 • Using Lists and Tables


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_249_0.png)


    With tables, people scan down the left column to find the situation that is relevant
    to them. Then, they move along that row to get the information they need.


    # 14. Keep tables simple


    Two-column tables are easiest to fit onto web pages and easiest for people to
    grab information from. However, sometimes you have more than two related pieces
    of information to give people for each row of a table — as in the three-column
    table about real estate in this chapter.


    How large can a table be before it becomes too much for users?


    # Thinking about table width


    Let''s talk about width first (number of columns). The web constrains us more
    than paper did.


    +   - You can''t create fold-out web pages when you can create super-wide, fold-out,
    specially printed paper documents.

    - One of the strongest findings of usability testing is how few web users notice
    a horizontal scroll bar. Anything off the right side of the screen is lost to
    almost all web users.


    For complex situations, consider asking visitors a series of questions or giving
    them a form to fill out, rather than putting all into a table.'
