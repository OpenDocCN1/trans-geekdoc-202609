- pgno: 16
  md: '# Foreword


    I have to admit when Ginny Redish first mentioned that she was thinking of doing
    a book about writing for the web, my first reaction was a sense of extreme personal
    relief.


    For years, I''d really wanted to read a great book about writing for the web,
    and for years, one hadn''t appeared. There were some very good books about it,
    but not the book I was waiting for: the one that explained writing for the web
    is really different, and why, and exactly what to do about it.


    This missing book was starting to feel like one of those puzzling gaps in the
    fabric of the universe


    Knowing Ginny, I knew immediately that she would write the book I wanted to read,
    hence my relief.


    I was also very happy to hear that she was taking it on, because I knew that a
    lot of people beside me really needed this book. After all,


    +   * Most of the book is about words. Great, but the words do almost all the
    heavy lifting.

    * Very few of the millions of sites out there can afford a full-time writer. As
    a result, most of the people (like you, perhaps) who have to write all those words
    aren''t professional writers. They (you) need help.


    ¹While Googling to try to find whether Holden Caulfield was really the first to
    raise the "Where are all the baby pigeons?" question, I came across a terrific
    answer. What you see are the babies. The babies are 12 feet tall and only come
    out at night.


    ²Years ago, I wrote a 4½-page chapter about writing for the web in Don''t Make
    Me Think! and it took me, literally, three solid weeks of 10-hour days. No kidding.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   And even for most professional writers, writing for the web is very different
    from the writing they''re used to doing. They could use some expert help, too.


    In retrospect, I shouldn''t have puzzled so much that no one had written this
    book sooner, since it requires a sort of "perfect storm":


    +   Someone who really knows her stuff. No one is more qualified than Ginny to
    do this book. As she says, "She''s forgotten more about writing and reading than
    most people will ever know." And she has a wonderful generosity of spirit that
    drives her to share freely what she knows, rather than save it for her clients
    or make it into a proprietary "method".


    +   Someone who can communicate what she knows. I''ve gone out of my way to read
    everything Ginny writes or to hear her speak whenever I can, because I I''ll learn
    something important and useful. She gets to the heart of things and explains them
    in a way that makes her readers and audiences smarter.


    +   Someone who''s willing to give up a year of her life. No matter anyone tells
    you, it takes a year of your life to write a book like this. Not just a normal
    calendar, either, but a year rudely sucked out of your life span, rather like
    the torture device in *The Princess Bride.*² And the truth is, unless you''re
    very lucky (like, lottery-ticket lucky), you''re earning pennies an hour for the
    lost year in the long run.


    Having this book – at long last – in my hands reminds me of the way Calvin Trillin
    described a miracle-fabric his wife had given him that weighed nothing yet allowed
    him to stand comfortably in the freezing cold for hours "I don''t know how much
    it cost, because it was a gift. But I have to think . . . about a million dollars."


    If you have to do any writing for the web, the advice Ginny is giving here is,
    as they say in the commercials, priceless. In the years ahead, I''m certain it''s
    going to make the web much better place to be.


    Steve Krug

    Brookline, Massachusetts


    > ²Come to think of it, a lot like the torture device in *The Princess Bride*.
    Especially for your loved ones, over the years may may have grown to seeing you
    and talking to you and having you take out the trash occasionally.'
  merge: -1
  img_proc: true
