    # Giant pandas face big problems


    Today, only 1,600 pandas survive on Earth. There are several reasons why pandas
    are endangered:


    Low reproductive rate—Pandas like to be by themselves most of the time, and they
    have very short mating season when a male


    # Make the questions people can come with


    Too often I find that writers have turned their information into questions and
    answers, but it''s still information—what they want to tell people about, not
