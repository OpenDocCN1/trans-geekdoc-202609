  md: '1. Start by outlining your content with headings 239


    +   11. Help people jump to the topic they need with same-page links.

    12. Evaluate! Read the headings to see what you have done.


    # # 1. Start by outlining your content with headings


    I''m **not** talking about formal outlining with roman numerals, letters, and
    so on. Just put down the headings in order. If you use more than one level, indent
    a bit for the second level. Then you can see the patterns you are creating at
    a glance


    (This is the same advice that I gave in Chapter 6, Checklist 6-1, where I suggested
    starting by putting down the questions that people would ask. Here I''m elaborating
    a bit to say that sometimes you will keep those questions as your outline, and
    therefore your headings. Sometimes, you''ll turn them into statements (key messages).
    If they are all “how do I . . .” questions, if you are just labeling parts, you
    will use nouns. In the rest of this chapter, you''ll explain when, why, and how
    to use each of these types of headings.)


    For example, the outline for the International Aviation Contest web page that
    I constructed in Case Study 6-1 would look like Figure 10-3.


    | Title: International Aviation Art Contest |

    | Outline (headings with second level indented) |

    | Who can enter? |

    | What is the deadline? |

    | What prizes are there? |

    | State prizes National prizes International prizes What types of poster are acceptable?
    | What will the judges look for? |

    | Who must certify that the child made the poster? |

    | Where do we send the poster? |


    **Figure 10-3** An example of an outline for a page of web content.'
