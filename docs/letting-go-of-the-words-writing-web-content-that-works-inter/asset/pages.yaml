  md: '# Short (5–10 items) is necessary for unfamiliar lists


    If the list is not one people immediately recognize, providing two or shorter
    lists may be better. Here are two ways to shorten lists:


    +   - Separate the list with a space or a short line after each logical order
    or after about five items.

    - Make several lists, giving each a heading or an introduction.


    Look again at Figure 9-2 where the 11 items are in two short lists.


    # Long may be okay for very familiar lists


    Some lists can be long because users immediately understand what is in the list
    and where the item they want. For example, a drop-down list of the U.S. states
    and territories has more than 50 entries. If the states and territories are in
    alphabetical order, however, the length of this drop-down list is not a problem
    for most people. Find the right entry quickly.


    Figure 9-3, you see how the Saint Bernard Rescue Foundation offers both a drop-down
    list and a map for people to select a state.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_227_0.png)


    Figure 9-3 If people are familiar with a specific list, which item they want,
    and know where it will appear in the list, a long list may be okay.'
