  md: '# The smoothness of the path is more important than the number of clicks (within
    reason)


    A click or two can make a more successful site. Tom Brinck and his colleagues
    at Diamond Bullet Design revised a web site through a user-centered design process,
    taking it from an internal organization focus to a user-task focus. The information
    on the new site is typically one level deeper – requires one more click – but
    less than half the time to find!


    | Task success | New version |

    |---|--|

    | 72 percent | 95 percent |

    | Average time to complete each task | 132 seconds | 50 seconds |

    | Number of clicks to get to information: On average, 1 click **more** in new
    version |


    Source: From a study by Tom Brinck and colleagues. www.ais.org/Bulletin/Dec-04-brinck.html


    # Don''t make people think


    People want to get to the right web page quickly and *efficiently*. If they have
    to stop and think about what to do at each step along the pathway, it''s not efficient
    – nor is it quick. They would rather click one or two more times than think about
    along the way.


    The wording and the guideline come from Steve Krug''s *book*, *Don''t Make Me
    Think!* (Krug, 2005).


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_84_0.png)


    # Keep people from needing the Back button


    If the pathways aren''t smooth – if people can''t find the right link to move
    forward easily – they end hopping part way down one path,'
