  md: '# Considering the site visitors'' scenarios


    The revised version also matches the order in which the site visitor needs the
    information. It matches different people''s scenarios.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_209_0.png)


    # Learning from this case study


    A sentence with many commas probably has extra information stuffed into it. This
    case study shows us how to untangle sentences like this.


    +   * Think of your web users and how and when they will use each piece of information.

    * If people need different pieces of the information at different times, separate
    those pieces.

    * Keep the main parts of the sentence (subject, verb, object) together.

    * Put the key message first.

    * Pull out extra information and make each piece its own sentence.

    * Consider using visuals, fragments, and lists where they convey the information
    quickly and accurately.'
