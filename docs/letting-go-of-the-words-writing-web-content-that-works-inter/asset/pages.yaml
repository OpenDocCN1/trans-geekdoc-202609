    # 13. Think carefully about what to put in the left column of a table


    If you think of your table as a series of “if, then” sentences, always put the
    “if” first part. Make that the left column.


    Another way to say this: When a site visitor asks a question to which first answer
    is “it depends,” that’s a clue that you need a table. What it depends on becomes
    the left column of the table. The answer to the question for each site visitor’s
    situation becomes the right column.


