- pgno: 131
  md: '# Chapter 6 · Focusing on Your Essential Messages


    But are they, in fact, marketing themselves – usually as the place to go for whatever
    they specialize in. And they succeed best when site visitors get what they want:
    reliable, credible, up-to-date, factual information that is easy to find, easy
    to understand, and easy to use. That''s more important to most site visitors than
    a mission statement, organization chart, or detailed history.


    # The web is primarily a “pull” technology; marketing specializes in “push”


    On paper, companies market by sending information to people. The company starts
    the conversation. That’s a “push” technology – the company is pushing information
    out to potential customers.


    “Push” does exist in the web world. When people register at a site, they often
    agree to receive notices that come to them in email. Many sites invite people
    to sign up for newsletters on specific topics that then also arrive “pushed” to
    them in their email.


    Most web contacts, however, are “pull” technology. People come to your web site
    on their own initiative to “pull” information from the site. As we’ve seen throughout
    this book, the web is most often used as a conversation started by the site visitor.
    If site visitors start the conversation, you must satisfy the need they care for
    first – before you try to market to them.


    Marketing departments are accustomed to thinking in terms of how to draw people
    in. On the web, your primary worry should be not to drive away the people who
    have chosen to come to your site.


    # Take advantage of “marketing moments” – market after the visitor is at least
    partially satisfied


    A “marketing moment” is a time and place on the web site when visitors are ready
    for a marketing message. A marketing moment is not meant to distract your site
    visitor. A marketing moment is a natural follow-on or complement to what site
    visitor is doing.


    The time to market on a web site is after site visitors have satisfied at least
    part of their need. Many online bookstores are particularly adept at taking advantage
    of “marketing moments,” as in the example from Barnes and Noble in Figure 6-8.


    The Founders credit union (Figure 6-9) does a great job of getting people directly
    to the facts; but then it misses the opportunity to market to them from the facts.'
