  md: 'But they want to grab that information quickly because they also want to know:


    +   - How do I keep going on the question or task that brought me here?


    Return visitors often just do a quick check to be sure they are on the right site
    and, perhaps, to see if there''s anything new and exciting they plunge further
    into the site.


    Both too little and too much can keep people from understanding the site offers.


    # A useful home page makes it instantly clear what the site is about


    Look at Figure 3-6, the 2005 home page of SBC. Is it instantly clear what their
    business is?


    Web sites must serve those who already know the company and those who do not.
    Managers and staff inside a company are often so familiar with the company''s
    history and business that they forget that other people are not. If a web site
    is going to help a company market itself success-fully, it must speak to people
    who do not know the company.


