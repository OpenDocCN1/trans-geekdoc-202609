  md: '# Don''t just slap headings into old content


    Headings can be very helpful, but they can''t save poorly written, poorly organized
    text. Going through existing content and putting in a heading every often does
    not produce a good document. That''s actually a good technique as a first step
    in revision – a way to become more familiar with the content you are working with.
    But it''s a terrible technique if you stop there.


    Whether you are writing new content or revising old content, if you find it difficult
    to write a heading for a section of text, it probably means that the section is
    not clear or covers too many points jumbled together. Clarify the content. Break
    it up into smaller sections. If you find yourself writing the same heading over
    different sections of text, it probably means that the material is not well organized.
    Reorganize it to be logical for your site visitors.


    Thanks to Caroline Jarrett for teaching me this technique of putting headings
    in old content as a first step in revision. Very important-this is just to get
    a sense of the content and to plan your vision. You will probably want to reorganize
    and rewrite the content with new headings in a new order.


    Poor, arbitrary headings may hurt web users rather than help them.


    # Twelve guidelines for writing useful headings


    In this chapter, we''ll consider these 12 guidelines to help help your web users
    with good headings:


    +   1. Start by outlining your content with headings.

    2. Ask questions as headings when people come with questions.

    3. Give statement headings to convey key messages.

    4. Use action phrase headings for instructions.

    5. Use noun and noun phrase headings sparsely.

    6. Put your site visitors'' words in the headings.

    7. Exploit the power of parallelism.

    8. Don''t dive deep; keep to no more than two levels of headings (below the page
    title).

    9. Make the heading levels obvious.

    10. Distinguished headings from text with type size and bold or color.'
  merge: -1
  img_proc: true
