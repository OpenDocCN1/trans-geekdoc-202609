- pgno: 261
  md: '# Giant pandas start small


    Age of maturity; males—6 to 7 years;

    fales—4 to 5 years

    Conservation status

    Endangered


    Giant pandas are only about the size of a stick at birth, and they areless and
    helpless. The mother gives care to her tiny cub, usually cuddling it in one paw
    and holding it close to her chest; for days after which the mother does not eat
    or drink.


    # Fun facts


    +   * They seem very quiet, yet giant pandas can roar, grow, and honk.

    * Giant pandas are technically carnivores, but they mostly eat on bamboo. They
    will eat small insects if they feel like it.

    * Like other types of bears, giant pandas are curious and playful, especially
    when they are young. Zoos provide with enrichment items like ice or sawdust, puzzles
    and balls, inside and different scent spots.

    * Giant pandas are unusually thick and heavy for their size, but they climb and
    like to swim.


    Yet despite the attention they receive from their mothers, many young pandas do
    not survive. Through captive propagation in China and other zones around the world,
    we are learning more about panda cubs and how to help them reach adulthood.


    # Bamboo is food and shelter


    Bamboo is the most important part of a panda''s life. Pandas live in cold and
    misty bamboo forests in the mountains of western China. They spend at least 12
    hours each day eating bamboo. Because bamboo is low in nutrients, pandas eat as
    much as 84 pounds (38 kilograms) daily. Pandas use their fingers and a special
    grip to use their teeth to peel off the tough outer layers to reveal the inner
    strip. Strong jaw bones and muscles help pandas crush the bamboo. Bamboo is also
    their shelter; pandas strip the leaves, stalks, and stems to build a nest with
    a flattened bottom. Bamboo leaves are also on menu; pandas strip the leaves, weal,
    and swallow them. Giant pandas also eat bark, roots, fruit, eggs, and even rodents
    and carrots. At the San Diego Zoo, pandas are fed bamboo, carrots, yams, and special
    biscuits made of grain and with all the vitamins and minerals pandas need


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_261_0.png)


    Statements (key messages) can work well with headings.


    # Vocal pandas


    Pandas make a bleating sound similar to the sound of a goat kid would make. It''s
    a friendly sound; a greeting. They don''t roar like a lion or grow like a bear.
    But they do roar and honk, huff, bark, or growl, and young cubs and squeal.


    "Vocal" is not a question or a statement. It gives us as much information as the
    statements over other sections. To match the headings around it, this could be
