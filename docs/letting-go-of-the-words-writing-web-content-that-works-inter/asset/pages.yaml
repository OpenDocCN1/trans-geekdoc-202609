  md: '# 4. Write simple, short, straightforward sentences


    Busy web users have no time to untangle long, convoluted sentences. Try to keep
    your sentences to about 10 to 20 words.


    Here are three critical tips for keeping sentences short and simple:


    +   - Cut the fluff.

    - Say it once clearly.

    - Keep each sentence to one thought – or two tightly connected thoughts.


    > If people have to read a sentence more than once to understand it, rewrite it.


    # Very short sentences are okay, too


    Sentences do not need even ten words to be meaningful and sharp. If you write
    in questions and answers, a short answer may be all that people need.


    # Fragments may also work


    The personality, tone, and style of your site may make sentence fragments acceptable
    to your readers. Consider the description of a blog in Figure 8-17. The sentence
    fragments work well here.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_204_0.png)


    A blog is a personal diary. A daily pulpit. A collaborative space. A political
    soapbox. A breaking-news outlet. A collection of links. Your private thoughts.
    Memos to the world.


    Your blog is whatever you want it to be. There are millions of them, in all shapes
    and sizes, and there are no real rules.


    **8-17** Blogger.com''s explanation of a blog.


    # Even in very serious writing, busy users need sentences they can understand
    easily


    Simple, short, and straightforward sentences are critical for serious topics.'
