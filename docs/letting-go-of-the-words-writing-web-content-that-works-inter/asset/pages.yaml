  md: '# Content!

    Content!

    Content!


    Yesterday, while on the web, I


    +   - downloaded a file

    - ordered a book

    - compared prices on a new camera I''m thinking of buying

    - read a few of my favorite blogs

    - checked the Wikipedia entry for usability

    - looked for information on a health topic for my elderly aunt


    > What did you do on the web yesterday? Were you browsing around without any goal
    or were you looking for something specific?


    Most people say "something specific." They want to send a baby gift or arrange
    a trip. They need to reorder their favorite specialty food or download a software
    upgrade. They have a question about company policy or to check the balance in
    their vacation account. They have a problem with one of their gadgets and think
    they might find help for the problem online. Or they want to see what bloggers
    are saying about the latest political turmoil. They have a goal in mind when they
    go the web.


    # People come to web sites for the content


    People come to web sites for the content that they think (or hope) is there. They
    want information that


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_20_0.png)'
