- pgno: 156
  md: 'as design progresses, more and decisions must be made that affect web content.
    The placement and space allotted for different pieces of content on each page
    type constrain what writers can do. And, writers must be involved in decisions
    about that placement and space. Decisions about font and color usually belong
    to the visual designer, but designers must work closely with content specialists
    to be certain that the choices will produce web pages that are both aesthetically
    pleasing and easy for people to skim, scan, read, and use.


    # 3. Work with templates


    At the end of the process, the final prototypes become templates for each page
    type. If you are a content writer, accept the templates with enthusiasm and use
    them.


    Templates make life much easier for everyone. You can concentrate on the information,
    knowing how it will fit into and what it will look like on the web page. Writing
    to fit the constraints of a web template can help you to let go of words, break
    information into small pieces, focus on your key messages, write good headings,
    and use all the other guide-lines in this book.


    > The other great aid for writers besides templates is a style guide. See the
    interlude in this book on Creating an Organic Style Guide.


    # 4. Use space effectively. Keep active space in your content


    Space is not just emptiness. Space is an important design element – both on paper
    and on web pages. If you are used to writing and designing for paper, however,
    you may need to think about space somewhat differ-ently for your web content.


    Most web users are still looking at screens that show much less than a typical
    sheet of paper. (Even people with monitors large enough to show an entire sheet
    of paper often don''t maximize each window.) So we want to make good use of the
    screen "real estate" that we have.


    Too little space on a web page can make information very difficult to skim, scan,
    find, and read. Too much space in the wrong places can mislead people about whether
    the page is finished and about how headings fit with the text.


    We''ll look at examples of all of these problems. But, first, I must intro-du
    the concepts of passive space and active space because the prob-lems are primarily
    related to poor use of active space.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Understand passive space

    and active space


    Information designers distinguish between passive space and active space. Passive
    space is outside of the main content area, for example, the margins on a piece
    of paper. Active space is inside the main content area, for example, the space
    between paragraphs on a piece of paper. You need active space to help readers
    both separate and group information. Figure 7-8 shows passive space and active
    space in a typical paper document, such as a draft page from this book.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_157_0.png)


    **Figure 7-8** A book page showing active space and passive space. The space between
    the bullets and the bulleted text, the space at the end of each bulleted item,
    and the space between the question mark icon and the text after it are all examples
    of active space.'
  merge: -1
  img_proc: true
