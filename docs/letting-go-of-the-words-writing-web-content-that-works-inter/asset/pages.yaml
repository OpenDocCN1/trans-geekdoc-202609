- pgno: 48
  md: '# # Starting Well:

    Home Pages


    Both you – and all those people whom you thought about, visited, observed, listened
    to, and created personas and scenarios for – want your web site to succeed.


    To have a successful experience on a web site, people have to


    +   - find what they need

    - understand what they find

    - act appropriately on that understanding


    And they have to be able to do all that in the time and effort that they think
    it is worth.


    Most of this book is about “understand what they find.” It’s mostly about writing
    destination (information) pages beyond the home page and beyond the pathway (menu,
    gallery) pages that people may have to go through their way to what they want.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Although we''ll concentrate later in the book on information pages, all web
    pages have content. Home pages have content. Pathway pages have content.


    Letting go of the words is especially important on home pages and pathway pages.
    Before we get to writing information pages further down in your site, let''s briefly
    explore home pages in this chapter and pathway pages in the next chapter.


    # # Home pages – the 10-minute mini-tour


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_49_0.png)


    Most people read very little on the home page. They want to grab the information
    they need and move on because what they need from the site is always beyond the
    home page. Home pages can be content-rich, but they must not be wordy.


    Many of your site visitors may be bypassing your home page and pathway pages by
    coming to specific information pages in your site through a search engine like
    Google.


    In the rest of this chapter, we''ll discuss five major functions of home pages:


    Nonetheless, you must set up your site for those who do start at your home page
    – or who get to your home page after looking at the information the search engine
    sent them to.


    +   * identifying the site, establishing the brand

    * setting the tone and personality of the site

    * helping people get a sense of what the site is all about

    * letting people start key tasks immediately

    * sending each person on the right way, effectively and efficiently


    We''ll see how to accomplish all without asking people to read much.


    For an analysis of many home pages, see Nielsen and Tahir, Homepage Usability,
    50 Websites Deconstructed, 2001.


    We''ll end the chapter with a brief case study of revising the home page of a
    portal site, as well as a short section on how important it is to plan'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Setting the tone and personality of the site 31


    your site from your information topics up to the home page – not only from the
    home page down to the information topics.


    # # Identifying the site, establishing the brand


    Your site''s logo, name, and tag line identify it. Don''t use a paragraph to explain
    the site. Don''t put paragraph-long mission statements on the home page. Most
    people won''t read them.


    For more on tag lines and other aspects of home pages, pathway pages, and navigation,
    see Krug. Don''t Make Me Think! 2005.


    Instead, encapsulate your company''s or organization''s mission in a memorable
    tag line – a short phrase that tells people how to think about the site.


    Consider Figure 3-1, the top of the Aspen Square Hotel''s home page. The identifying
    information works well with very few words, as people coming to this site know
    what a condominium hotel is and recognize Aspen as the famous resort in Colorado.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_50_0.png)


    **Figure 3-1** Even if you have never heard of the Aspen Square Hotel, you probably
    immediately understand what it is and where it is from the logo/name and tag line.
    www.aspensquarehotel.com


    # # Setting the tone and personality of the site


    Remember that your web site is part of a conversation. You set the tone for your
    side of the conversation by sharing the web site''s personality with your visitors.
    Indeed, different web sites have different personalities – expressed in the site''s
    visual style, colors, graphics, typography, writing style, and words.


    For an interesting paper on web sites having personalities, see Coney and Steehouder,
    2000.


    A few years ago, the U. S. Internal Revenue Service (IRS, the tax collectors)
    had a home page that looked like a tabloid newspaper (Figure 3-2).'
  merge: -1
  img_proc: true
