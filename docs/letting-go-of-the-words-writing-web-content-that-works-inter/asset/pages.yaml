- pgno: 60
  md: '# Letting people start key tasks immediately


    When people come to a web site to do a task, they usually want to start that task
    right away. Many tasks involve forms, and it''s been interesting to watch over
    the years as more and more forms come to the front of sites. If people need a
    form, putting the form on the home page is a good strategy.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_60_0.png)


    # Put forms people want right away on the home page


    For example, on travel sites what people most want to do is set up travel. That''s
    why most travel sites let people start a reservation right from the home page.
    Figure 3-11, the Scandinavian Airlines site, is an example.


    # Make sure the forms are high on the page


    If you have forms on the home page, make sure they are easy to find – high enough
    on the home page to be seen immediately. The large pictures that many sites have
    on their web pages push critical tasks and critical information far down on the
    page. These large pictures hinder people from finding the critical information
    or critical field quickly and easily. See the FedEx example in Figure 3-12.'
  merge: -1
  img_proc: true
