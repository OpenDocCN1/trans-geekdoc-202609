- pgno: 274
  md: '# 6. Put your site visitors’ words in the headings


    No matter what type of heading you write, the headings in your web content must
    make connections between what''s in your site visitor''s mind and the information
    you want to give. If you use the heading with words they don''t know, your site
    visitors may not recognize the heading is what they need.


    # 7. Exploit the power of parallelism


    In Chapter 9, you saw the power of parallelism in lists. In the same way it works
    for lists, using the same sentence structure (the same pattern) for your headings
    helps people scan and grab information from your web pages.


    +   Do It Yourself: Wallpaper

    - Everyone loves wallpaper

    - Preparation

    - Removal of wallpaper

    - Straight line marking

    - Cutting the wallpaper

    - Wallpaper soaking

    - Hang the first sheet


    +   Do It Yourself: Wallpaper

    - Getting ready

    - Preparing the walls

    - Removing old wallpaper

    - Marking a straight line

    - Cutting the wallpaper

    - Soaking the wallpaper

    - Hanging the first sheet


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_274_0.png)


    Did you find the headings on the right quicker and easier to scan and remember?


    If you use questions for your level 1 headings, make all the level 1 headings.
    If you use action phrases for your level 1 headings, make them all action phrases.
    That is, be consistent (parallel) in the style you use within the same level of
    heading in the same article (or even the same type of web content).'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'If you choose to break the pattern, do it for a good reason. I broke my pattern
    on the revised L.L. Bean web page for one heading. I did it to shock readers and
    make that point stand out. The point about keeping your gift a secret is not a
    part of the flow of the process that the other headings describe. It''s an “aside,”
    so changing the pattern there was purposeful.


    You don''t have to do all the levels in the same style. In fact, it''s a good
    idea to change the style for different levels. That''s one way to help people
    know what level each heading is at.


    # 8. Don’t dive deep; keep to no more than two levels of headings (below the page
    title)


    On the screen, you have less room to work with than on paper, so you can''t have
    as deep a hierarchy of headings in a web article as you might in a typical book
    chapter. Web articles should be much shorter than a typical essay or book chapter.
    Very long articles should be broken into different sections on different web pages.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_275_0.png)


    If you have a short article with short sections, a page title and one level of
    headings is best. If you have a long article, you probably want a page title and
    then two levels of headings. Using heading level 2 for subtopics of topics.


    Figure 10-2, the article on high blood pressure from FamilyDoctor.org, has a page
    title and one level of headings. The outline in Figure 10-3 of the web page for
    the International Aviation Art Contest has a page title and two levels of headings.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 9. Make the heading levels obvious


    Changing the way you write the different levels is one way of making clear that
    you have a hierarchy of information on the page. (The outline in Figure 10-3 has
    questions for heading level 1 and nouns for heading level 2.)


    Another way to signal heading levels is to change the format. You can show different
    levels of heading with type size or placement


    +   ** Type size.** If you are using size, always make the level 1 headings bigger
    than the level 2 headings. People associate size with hierarchy: bigger is more
    important. Make the difference noticeable – at least 2 points of type size.


    +   ** Placement.** Instead of changing size, you can indent the second-level
    or run it in the same line as the text (with the heading part in bold or color).
    The bold headings for each tip in the Celestial Seasons example in Figure 10-10
    are run-in.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_276_0.png)


    Make sure the headings get larger than the rest of the text gets larger for people
    who change the type size. You can do that by setting headings to be a percentage
    of the text type, and not an absolute size.


    # 10. Distinguish headings from text with type size and bold or color


    To make all the headings (at all levels) obvious as your site visitors come to
    each of your web pages, use bold or color.


    Whatever you choose, use it consistently, and also consider these points:


    +   Don''t use blue for headings. Save blue for links. Many web users assume that
    anything in blue is a link, even if it is not underlined.


    +   In fact, don''t use your site''s link color as a heading color. Your site
    visitors are likely to become confused between headings and links.


    +   Don''t make the only difference between heading levels be bold versus color.
    People have a hard time figuring out whether bold is more important than color
    or vice versa. You *can* combine color versus bold *and* larger size to make the
    distinction between different levels.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Avoid *italics*. They are not as effective as **bold** in indicating a heading.
    They don''t stand out as much on the screen.


    Underline a heading only if it is a link. Most web users assume that anything
    is underlined is a link.


    Avoid all capitals for the reasons we talked about in Chapter 7.


    If you use color for your headings, make sure the color is legible against the
    background of your page. Also, before you select a color for headings, reread
    the section on color-blindness in Chapter 7.


    # 11. Help people jump to the topic they need with same-page links


    If your web page has several topics with a heading over every topic, you might
    make these headings into a table of contents at the top of the page. A short table
    of contents at the top of a web page helps people


    +   * get a quick overview of what''s on the page

    * jump to a specific part of the page if they want just that part


    Figure 10-15 is a good example of same-page links from a U. K. group that is very
    concerned about making its web site easy to use. (Thanks to Tom Brinck for suggesting
    this example.)


    What do you call the headings at the top of the page? I''ve heard: "anchor links."
    "in-page links," and "same-page links." I''m calling them "same-page links" here.


    # Put same-page links right under the page title


    Watching people in usability testing, it''s striking to see how quickly they focus
    on the links when they come to a web page. If there''s a list of same-page links
    near the top of the page, they are likely to just not anything above that list
    of links.


    # Don''t put off-page links where people expect same-page links


    Remember that people bring expectations to your web pages. They expect that a
    list of links within the content area at the top of a web page will take them
    to information on that page. Meet that expectation.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 11. Help people jump to the topic they need with same-page links


    # HealthyEyes your sight is precious to us


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_278_0.png)


    Figure 15 Gathering all the headings on a web page into a set of links at the
    top of the page helps people. They can see what''s on the page and get quickly
    to one part of the page. www.healthyeyes.org.uk


    # Don’t put same-page links in the left navigation column


    Just as users don''t expect links at the top of the content area to go off the
    page, they don''t expect links in the left navigation area to stay on the page.
    The left navigation is usually other topics that may be related, that may be in
    the same section of the web site, but that are not on the same web page.


    I was doing a usability test of a web site as the first step to revising the site.
    One of the pages that participants reached a good set of questions and answers
    grouped by topic. Participants liked the questions and answers but complained
    that they had to scroll when they would have liked to jump to the topic they needed.
    Several suggested “a list of the topics at the top like you see on lots of other
    web pages."'
