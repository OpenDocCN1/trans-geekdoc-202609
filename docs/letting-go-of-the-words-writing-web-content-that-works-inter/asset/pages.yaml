- pgno: 161
  md: '# Chapter 7 - Designing Your Web Pages for Easy Use


    The headings on the web page in Figure 7-12 from a New Zealand health site, however,
    do not as well. When I show a page like this one in my workshops, people find
    lots to like about it. It''s broken into small pieces. The sentences are short.
    It has headings. But they also complain that it''s hard to know what they goes
    with. What they trouble putting the headings and text together properly.


