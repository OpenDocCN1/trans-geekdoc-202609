  md: '# Preparing Concrete for Strain Gage Bonding


    I broke the information into "why," "what," and "how."


    # Why must concrete be specially prepared?


    Concrete surfaces are usually uneven, rough, and porous. To develop a proper substrate
    for gage bonding, the concrete must have a leveling and sealing precoat of epoxy
    adhesive. By applying the epoxy, you must first prepare the concrete surface with
    a procedure that accounts for the fact that it is porous.


    # What do I need to prepare for precoating?


    You need


    +   - Conditioner A

    - Neutralizer 5A

    - gauze sponges

    - a stiff-bristled brush

    - a mild detergent solution

    - distilled water

    - a wire brush or a disc sander or a grit blaster


    The bullet list tells people what they must have ready so that they aren''t surprised
    while completing the steps.


    # How do I prepare for precoating?


    Clean the surface


    +   1. Remove contamination from oils, greases, plant growth, and other soils
    by scrubbing vigorously with a stiff-bristled brush and a mild detergent solution.

    2. Rinse the surface with clean water.

    3. Remove surface irregularities by wire brushing, disc sanding, or grit blasting.

    4. Blow or air loose from the surface.


    I divided the 12 steps into 3 logical groups: A 12-step list with no breaks is
    long.


    # Apply Conditioner A


    +   5. Apply Conditioner A generously to the surface in and around the gage area.

    6. Scrub the surface with a stiff-bristled brush.

    7. Blot contaminated Conditioner A with gauze sponges.

    8. Rinse the surface thoroughly with clean water.


    I reorganized sentences so that the action verb is always at the beginning of
    the step.


    # Apply Neutralizer 5A


    +   9. Scrub the surface with Neutralizer 5A to reduce the surface acidity.

    10. Blot with gauze sponges.

    11. Rinse with clean water.

    12. Rinse again with distilled water to remove the residual traces of water-soluble
    cleaning solutions.


    Each step is one action.


    **Figure 9-17** Think of recipes when you are giving instructions—even for information
    as technical as bonding to concrete surfaces. Isn''t it much easier to use than
    the original in Figure 9-16?


    In paragraph form, it''s just too easy to forget a step and never realize that
    you''ve done that. It''s just too easy to put down the steps in haphazard order
    and create problems for people who don''t realize they should have done something
    first until it''s too late.


