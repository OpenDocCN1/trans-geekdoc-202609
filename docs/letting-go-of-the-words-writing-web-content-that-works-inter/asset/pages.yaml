  md: 'technical language, will only make them angrier? And what will they do if the
    web content doesn''t help? Call up – cost the company more money? Write a scathing
    review on a "what should I buy" web site? Buy someone else''s product next time?


    Web content for people who are angry, frustrated, anxious, or stressed has to
