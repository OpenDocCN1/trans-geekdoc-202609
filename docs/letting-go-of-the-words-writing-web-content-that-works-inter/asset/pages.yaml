    to go on in the original article. If you think that people may want more definitions,
    include a link to an A-Z index in each definition window.


    Be wary of putting information into pop-ups. Many web users have pop-ups turned
    off.


    **Figure 6-13** shows how Traffic.com provides more information on each problem
    it has marked on the map that the site visitor is looking for.


    Bring up extra information in a rollover or a small second window that does not
    completely overlay the original window has two major advantages:


    +   - The original information and the related extra information is visible together.
    People can work with both at the same time.


    +   - The small second window is less likely to cause the problems that full-size
    second windows create for many people. Many people do not realize what has happened
    when the browser launches a new window and they cannot see their original screen.


    When you use small second windows for this type of layering, include a Close Window
    link, as the San Diego Zoo site does. For many web users, a text link or button
    reminding them to close the window is faster and easier than having to remember
    the little x in the corner.'
