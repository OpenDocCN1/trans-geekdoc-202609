- pgno: 295
  md: '# Make sure your words match what happens


    If you offer a larger picture, make sure it enlarges. If you promise other views,
    make sure that there are really other views. Otherwise, you are setting expectations
    that you don''t meet, which is likely to annoy your site visitors.


    If an extra click fulfils its promise and sometimes doesn''t, you are teasing
    your potential customers. They can''t tell when they''ll get what they want. Although
    I support the use of templates, be careful about situations in which the words
    in the template set up false expectations.


    At GapKids.com, for example, item pages (perhaps always – I haven''t checked every
    page), offer “more views.” I suspect the “more views” link is part of the item
    page template.


    Sometimes, this truly leads to other views, but sometimes it does not. Sometimes,
    all you get a slightly larger version of the same view. If you want to see the
    back of boys'' jeans, for example, you''ll get that picture with some jeans sales
    but not with others.


    Figure 11-4 is a girl''s denim jacket with a tantalizing peek through the front
    of a design on the back. But “more views” disappoints; it only leads to a slightly
    larger view of the front and no option to see the back.


    If the web writers could select among options for templates, they could provide
    more truthful expectations to their web shoppers. For Gapkids.com, the templates
    might allow writers to choose options for “See larger view,” “View details,” “View
    back” – whichever were relevant for the specific item.


    # Make sure the larger pictures are clear


    Fuzzy enlargements, such as the one in Figure 11-5 from eBags.com, may make site
    visitors wonder about other aspects of your site – and your products.'
  merge: -1
  img_proc: true
