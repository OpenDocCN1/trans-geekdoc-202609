- pgno: 120
  md: '# 2. Cut! Cut! Cut! And cut again!


    # Leave in enough to be clear


    As you write and revise web content, remember that you are conversing with real
    people. Those people bring all of their previous experience and knowledge – and
    also their lack of experience and knowledge – to understanding what you are writing.


    It is possible to cut so many words that you leave out information that people
    need in order to understand your messages. Caroline Jarrett and Whitney Quesenbery
    learned this important lesson when usability testing The Open University’s site
    website.


    Here’s the relevant piece of a web page that they were testing:


    # BSc (Honours) Psychology Code: B07


    You need: 360 points


    Level: Undergraduate


    “You need: 360 points” – short, simple, plain English words. From the writers’
    point of view, the essential message here is only “360.” The writers assumed everyone
    would understand what the rest of the words mean.


    For anyone already enrolled at the university, that assumption is probably valid.
    Students know this is saying you need to accumulate 360 course points to get an
    undergraduate degree in this field (like credits to graduate with a major at a
    U. S. university).


    But Caroline and Whitney were investigating how well the site works for newcomers
    to The Open University. And many of those people had a different understanding
    of those few simple words.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_120_0.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'For this audience, a few more words are needed. “To get a degree in field,
    you must take enough courses to earn 360 points.”


    This story illustrates how important it is to


    +   - understand what your web users know and don''t know

    - do usability testing with the web users you are focusing on


    # 3. Start with the key point. Write in inverted pyramid style


    Whatever your essential message is, put it first. Many web users read only a few
    words of a page – or of a paragraph – before deciding if it is going to be relevant
    and easy for them to get through. If they think it might not be, they may jump
    down the page to a bulleted list or to briefly try another paragraph. And that
    may be all the time and attention they''ll give to a page.


    Like many other usability specialists, I have seen that behavior with most web
    users and most web sites over many years. And now our observations have been confirmed
    with eye-tracking data. Eye-tracking captures exactly where people''s eyes go
    as they work with web pages. We can look at an individual''s pathway through a
    web page. We can accumulate data from many people and show the most common ways
    of using a specific web page.


    6-3 shows accumulated eye-tracking data (called a heat map) for a web information
    page. Notice how people looked in an F pattern – across the lines at the top of
    the information and then at the beginning of the bulleted list. Notice how, after
    the first few lines, they looked more at the beginning of lines than all the way
    across. (That''s typical skimming behavior.) Notice how readership trails off
    down the page.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_121_0.png)


    Blind web users act similarly. Blind web users scan with their ears. They listen
    to a few words before deciding to keep going. With their screen-readers, blind
    web users can jump to the next link or the next heading or the next paragraph
    – and they do so at an amazingly rapid pace.'
  merge: -1
  img_proc: true
