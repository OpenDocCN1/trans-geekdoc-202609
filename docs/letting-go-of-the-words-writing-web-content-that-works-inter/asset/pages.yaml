  md: '# # Using Illustrations Effectively 273


    Illustrations serve different purposes 273


    Picture of exact item 274


    Picture to illustrate concept or process 280


    Chart, graph, map 284


    Mood picture 287


    Nine guidelines for using illustrations effectively 290


    +   1. Don''t make people wonder what or why 291

    2. Choose an appropriate size 291

    3. Make sure small pictures are clear 291

    4. Don''t use so much space for pictures that critical content gets shoved down
    or aside 292

    5. Use illustrations to support, not hide, content 292

    6. In pictures of people, show diversity 294

    7. To represent your organization, show diversity, but be truthful 294

    8. To represent your site visitors, think broadly 295

    9. Don''t make content look like ads 296

    10. Don''t annoy people with blinking, rolling, waving, and wandering text or
    pictures 296

    11. Don''t let roll 297

    12. Don''t change content while we are on the page 298

    13. Don''t let animated animals, birds, butterflies, and so on, roam the page
    299

    14. Weigh the trade-offs for animation carefully 299

    15. Use animation where it helps – not just for show 299

    16. Don''t make people wait through splash or Flash 300

    17. Splash pages waste time by welcoming people too much 301

    18. People want to control their online experiences 302

    19. Videos at the beginning are roadblocks for some people 302

    20. Make illustrations accessible 304

    21. Make the alt text meaningful 304

    22. For purely decorative graphics, use empty alt text 305


    # # Writing Meaningful Links 307


    Twelve guidelines for writing meaningful links 308


    +   1. Don''t make new program and product names into links by themselves 308

    2. Rethink document titles and headings that turn into links 310

    3. Think ahead. Links and page titles 312

    4. Be as explicit as you can in the space you have – and make more space if you
    need it 314

    5. Use action phrases for action links 315

    6. Use single nouns sparsely; longer, more descriptive links often work better
    316

    7. Add a short description if people need it – or rewrite the link 317

    8. Make the link meaningful – not Click here, not just More 318

    9. Click here is never necessary 318

    10. More isn''t enough 320'
