  md: '# Focusing on Your Essential Messages


    In Chapters 3 and 4, we looked at home pages and pathway pages -- "getting to
    the information." In Chapter 5, we started on information pages by considering
    how to break up documents and large blocks of information into separate web pages.
    In this chapter, we''ll talk about what to put into each of those information
    pages.


    First, let''s expand our picture of how people get to your information pages.
    The top line in this new picture is the one we focused on as we discussed home
    pages and pathway pages. The other lines bring in the realities of ways people
    reach your information pages, whether we are blogging or writing content deep
    within a site.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_112_0.png)'
