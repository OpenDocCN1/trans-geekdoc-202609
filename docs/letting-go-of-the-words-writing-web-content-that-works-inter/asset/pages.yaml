- pgno: 170
  md: '# 12. Don''t underline anything but links. Use italics sparingly 151


    Using capital letters for headings and emphasis is a carry-over from typewriter
    days, when writers had very few options for varying the type of a document. You
    have better options today.


    For web sites, follow these guidelines:


    +   - Use all capitals only for a single word or short phrase in specific circumstances
    where people expect it.

    - Use **bold** or color for headings, not all capitals.

    - Use uppercase and lowercase (like normal sentences) even for important information.
    If you put a whole paragraph in capital letters to make people pay attention to
    it, you will achieve exactly the opposite. Most people will ignore it.


    The traditional explanation for why all capitals are more difficult to read is
    that the shape of a word in lowercase gives us more information than the shape
    of the same word in all capitals. The letters that stick up ("ascenders"; "descenders";
    g, p, y, for example) and the letters that go down give different shapes. Differences
    in shape are present in lowercase letters but not in capital letters.


    For other theories on why all capitals are more difficult to read, see Larson
    2004.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_170_0.png)


    # 12. Don''t underline anything but links. Use italics sparingly


    On web pages, most people assume that anything that is underlined is a link, no
    matter what color it is. Reserve underlining for links. Underlining for emphasis
    or to indicate a book title is an old-fashioned technique that comes from typewriter
    days.


    Italics have always been the way to show a book title in printed documents. Use
    that on your web pages. Otherwise, use italics sparingly. Italics work as a light
    form of emphasis, but you don''t want to overemphas too much at once. An entire
    paragraph in italics would be very hard to read.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '(There''s also a difference between a font that was designed to be italic and
    the italic versions of many typefaces, which just slope the letters of the regular
    font.)


    Don''t use italics for headings. First, they do not stand out on the page nearly
    as well as bold. Second, people do not all agree on how to put italics into a
    hierarchy in a set of headings. When I show people sets of headings all at the
    same point where one is in bold type, one is in italic type, and one is in regular
    type, people always say the bold one is the highest level – the most important.
    But then I get results as to whether the heading in italic is more important or
    less important than the heading in regular type. Use bold or for all your headings.
    Change the size and possibly the placement to show which is the more important
    level of heading.


    # 13. Provide good contrast between text and background


    In the early days of desktop publishing, we talked about the "ransom note" effect
    – with so many different fonts and colors on the page that you couldn''t tell
    what went with.


    In the early days of the web, we saw the same phenomenon – an exuberance of design
    made for colorful, but not usable, web pages. And a common problem with these
    web pages was a colored or patterned background that made the text virtually unreadable.


    Design exuberance can be wonderful – if it matches the personality of your site.
    But it has to work with and not against the content. If you want people to read
    what you are putting on the web, you have to make it legible. Legibility requires
    high contrast between text and background.


    # Keep the background clear so that the text is readable


    Patterned backgrounds obscure the text, as in Figure 7-16. Don''t do it. You defeat
    your business goals if you make the page hard to see and the text hard to read.


    # Keep the background light and the text dark


    High contrast requires a light background and dark text (or vice versa). Many
    color combinations are difficult to read because they don''t provide enough contrast
    between the text color and the background color, as you can see in Figure 7-17.'
  merge: -1
  img_proc: true
