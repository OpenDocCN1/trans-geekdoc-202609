    # STREET-WIDE DISTRICT SWEEPING PROGRAM


    **Figure 4-7** When people have no sense of the web site to which a page belongs,
    they may wonder about the credibility of the page and of the entire site. All
    pages should show the site''s global features.


    Pages like this give people no clue as to what site they are on, in that site
    they are, or how to get to the home page or anywhere else in the site. Sites with
    pages like these are losing great opportunities to share all the other wonderful
    information or products they have with site visitors who come directly from an
    external search engine.


    Every page in a site should have


    +   - the site''s logo, name, and tag line (the consistent masthead at the top
    of the page)

    - the site''s Search Box

    - the site''s global navigation (assuming it has tabs or other ways of indicating
    the major sections of the site)

    - links to relevant information within the same part of the site – and elsewhere
    on the site

    - a clear link to the home page, making it obvious what “home” that is


    It''s fine to make the logo and site name at the top active as links to the home
    page; experienced web users expect that. However, that''s not enough. You also
    need a link that says “home” for those who don''t know to click on the logo or
    name. That can be either a text link or a tab, depending on how you set up your
    site''s global navigation.'
