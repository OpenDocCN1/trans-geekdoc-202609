  md: '# # Getting There: Pathway Pages


    From home pages, let''s continue on to thinking about the content for your pathway
    pages.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_72_0.png)


    Our focus in this chapter


    The key message of this chapter is that your busy site visitors are trying to
    get to “the good stuff” – whatever they are looking for – as quickly as possible.
    They don’t want to stop and read on the way. They are still navigating. They aren’t
    “there”.


