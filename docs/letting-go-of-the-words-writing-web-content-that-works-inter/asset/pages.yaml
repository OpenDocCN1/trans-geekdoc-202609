    type of page "gallery." These pages may show a list of items or pictures of the
    options within the product category. As Spool points out, if it shows only the
    pictures, it doesn''t enough to help most web users. That can also be true if
    it lists the products by model numbers or series names.


    See Spool''s article at

    www.ie.com/articles/

    galleries.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_79_0.png)


    This list like this on a pathway page assumes that all visitors know their category
    names and which one they want.


    When you provide information to increase scent on a pathway page, put it in fragments
    or bullets – not long sentences or paragraphs. Make it useful information that
    your site visitors find helpful in deciding how to move ahead. If you write only
    marketing hype, that''s not going to be useful. If you write technical specifications
    with the pictures, think carefully about your site visitors understand the technical
    language.


    Figure 4-3, one of many gallery pages from Dell Computers'' web site, with both
