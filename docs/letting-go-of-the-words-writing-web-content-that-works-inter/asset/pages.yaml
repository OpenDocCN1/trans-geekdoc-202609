- pgno: 85
  md: '# Chapter 4 · Getting There: Pathway Pages


    back up to try another path, that down one, possibly back up again, and so on.
    Jared Spool calls this "pogo-sticking" – and both he and I find the people we
    watch utterly frustrated when they have to do this. If people use the Back button
    while trying to find information on your site, rethink your pathway pages.


    # Many people choose the first option that looks plausible


    Humans don''t act optimally. As Herbert Simon pointed out many years ago, we "satisfice."
    We trade off time for benefit – often without consciously realizing we are doing
    it. We make decisions based on what we see, without carefully exploring the options.


    Busy web users click as soon as they see a link that looks like it might work
    for what they need. And the younger your web audience, the more likely they are
    to jump to it.


    Here are some implications of the realization that many people click on the first
    link they see that they might help them:


    +   * Think carefully about the order of information on your pathway pages.

    * Put the most important information and links high on the page.

    * If you want to select one link over another, put the one you want to select
    first.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_85_0.png)


    Many web users who listen to the screen also choose the first option they hear
    sounds reasonable. Older web users, tend to be more cautious clickers, over all
    the options before choosing. If you put the most important information and the
    links most people want high on the page, you''ll be helping all your web users.


    > Edith, the persona you met in Chapter 2, is an example of an older web user
    who is a cautious clicker. For more on older adults as cautious clickers, visit
    aarp.org/olderwired/oww-resources.


