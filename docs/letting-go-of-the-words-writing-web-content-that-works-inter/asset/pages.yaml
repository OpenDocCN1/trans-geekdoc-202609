- pgno: 264
  md: '# Think conversation. Ask the question from the site visitor’s point of view


    As I wrote in Chapter 8, if you use questions as headings, write as if you were
    recording both sides of the conversation. Use “I” for the site visitor in the
    question and “you” for the site visitor in the answer.


    Which version of the question about applying for food stamps in Figure 10-5 is
    more natural? (I copied these short pieces from two different U. S. counties''
    web sites.)


    # How can a person apply for food stamps?

    You can apply ...


    Doesn''t “a person” make this feel impersonal?


    # How can I apply for food stamps?

    You can apply ...


    Write the question as if the site visitor were asking it.


    Figure 10-5 Two versions of the same information.


    # Keep the questions short


    When you use questions as headings, people often skim the question just enough
    to decide, “yes, that’s what I want to know.” After all, the real meat of the
    web content is the answer to the question and people are anxious to get to it.


    Long questions take up precious space on the web page. Also, as-headings, the
    questions are in bold or color, and large blocks of color become difficult to
    read. And – despite the power of headings – some site visitors use the headings
    only as landing spots to see where new sections start. They don’t actually read
    the headings.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Cut your questions to essentials, just as you cut your content to essentials.
