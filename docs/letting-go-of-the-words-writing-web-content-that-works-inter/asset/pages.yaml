- pgno: 359
  md: '# Chapter 13 • Getting from Draft to Final Web Pages


    +   * managers, who are accountable for the content

    * policy analysts, who make sure the messages are in line with the organization''s
    policies

    * lawyers, who make sure the messages won''t get the organization into legal trouble

    * technical staff, who check accuracy

    * editorial staff, who check consistency with style

    * publication staff, who check consistency with formatting and templates


    Of course, not all content goes through all those reviews. And you may, yourself,
    fill one of the positions in that list.


    How can you make working with reviewers (and reviewees) be a positive experience
    rather than a nerve-wracking and frustrating one? Let''s talk about reviewing
    in three stages:


    +   * setting up good reviews

    * getting useful information from reviewers

    * making good use of reviews


    # Setting up good reviews


    Good reviews start at the beginning of a web writing project – not at the end.
    When you know you have an assignment to write web content, find out who will be
    reviewing what you write.


    # Meet with the reviewers when you start the project


    Discuss and agree on


    +   * roles and responsibilities

    * the schedule for drafts

    * your plans for the content


    # Practice the doctrine of no surprise


    The sure way to get a negative reaction is to shock your reviewers by showing
    them something they do not expect and to which they can reclaim, “That’s not the
    way we work here!” Never shock your reviewers. Always work with before you deliver
    a draft that they know what to expect. Deal with any concerns they have about
    overall style or content before you give them material to review.


    > Doctrine of no surprise. Work with reviewers before giving them draft so that
    they know what to expect.'
  merge: -1
