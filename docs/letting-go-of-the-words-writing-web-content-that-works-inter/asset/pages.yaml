    # Questions and answers, use “I” and “you” for the site visitor, “we” for the
    organization


    If you follow the advice in this book, you’ll find yourself writing in question-and-answer
    style for at least some of your web content. Web writers often ask us how to use
    pronouns in these questions and answers.


    When the site visitor is asking the question, I suggest using


    +   - “I” and “my” in the question (the voice of the site visitor)

    - “you” and “your” in the answer for that same person

    - “we” and “our” for the company or agency that is answering the question'
