- pgno: 52
  md: '# Setting the tone and personality of the site


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_52_0.png)


    Deciding on the personality that you want your site to project is part of developing
    your "brand.\ Both commercial companies and government agencies need to consider
    their "corporate image", their brand. Branding and marketing specialists can help
    you decide on an appropriate brand.


    # Who decides on the site''s personality?


    If you own the site (it''s your blog; it''s your company), you decide on the tone
    and personality you want your site to have. However, if you are part of a larger
    organization, it''s not your decision alone. In fact, another division of the
    organization (for example, marketing or corporate communications) may dictate
    aspects of the site’s brand – colors, templates, and writing style.


    Don''t arbitrarily reject those decisions; there''s value to your site visitors
    in finding a consistency in personality and style across sites within a larger
    site. Always connect your site to the home page (and other parts of) the larger
    site so that people who come into the organization’s site through your part get
    the value of your belonging to that larger organization.


    Figure 3- The web site of the U.S. Internal Revenue Service in 2005.'
  merge: -1
  img_proc: true
