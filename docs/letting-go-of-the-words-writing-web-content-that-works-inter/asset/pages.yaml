- pgno: 113
  md: '# Chapter 6 • Focusing on Your Essential Messages


    What do you do when you get to information pages? Do you immediately start to
    read it all or do you first skim and


    Most people don''t jump right in and read. They skim and scan, even over information
    pages. They are deciding:


    +   - Did I get where I thought I was going?

    - Is what I''m looking for on this page?


    For users to know they''ve gotten where they want to go, links and page titles
    must match. We''ll talk about that in Chapter 12, which is all links.


    They look at the page title, and they look for headings and key words in the text.


    You''ll see examples of good headings in web writing throughout the book, and
    Chapter 10 is all about writing useful headings.


    # Six guidelines for focusing on your essential messages


    When they decide they are on the right page, most users want to focus immediately
    on the information they came to. The rest of this chapter gives you six guidelines
    to help busy users get what they need.


    +   1. Give people only what they need.

    2. Cut! Cut! Cut! And cut again!

    3. Start with the key point. Write in inverted pyramid style.

    4. Break down walls of words.

    5. Market by giving useful information.

    6. Layer for different needs.


    # Give people only what they need


    A good mantra for the web is less more.


    What do your site visitors want to know? Need to know?


    +   - Do they really care about the entire history of your project? Probably not.

    - Do they care about the detailed legal reference for your right to use them for
    information? Probably not.

    - Do they want to hear how much you welcome before you show them what you have
    to offer at what price? Probably not.


    Content may be important to you, but if it isn''t important to your site visitors,
    drop it entirely, or put it at the bottom of the page, or layer it with a link
    to another page.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '1. Give people only what they need


    How do you know what people need to know? How do you know what counts as an essential
    message?


    One good way is to use the process in Checklist 6-1.


    # Checklist 6-1

    Process for Selecting Web Content


    +   1. If you already have a draft or a previous web page, put it aside. (I know
    this is difficult, but it is the best way to rethink a web page.)


    +   2. Think about the topic from your site visitors'' point of view.


    +   3. List the questions that your site visitors ask about the topic. (It''s
    best if you actually know what they ask. Use all the sources in Chapter 2 to find
    out what your users want to know.)


    +   4. Decide which question your site visitors would ask first – and which they
    would ask next – and after that – until you have all the questions in your list
    that is logical to your site visitors.


    +   5. If you have a draft or previous web page, use it as answer the questions
    you have written down. (It''s okay to cut and paste as long as you edit what you
    paste so that it''s a good answer to the question.)


    +   If you do not have a draft or previous web page, write answers to the questions
    in your list. Just answer the question. Don''t add fluff.


    +   6. If you are working from a draft or previous web page, look over what is
    left that hasn''t gone under a question in your list. Your site visitors care
    about any of what is left? Is any of it critical, is it a question that your site
    visitors might ask so you can give them the answer.


    +   7. If you have questions in your list for which you do not have an answer,
    find the person who can answer the question and include the answer on your web
    page.


    +   8. Read your new draft. Does it flow logically?


    +   9. Discard what you have not used. If your site visitors neither care about
    the information, why include it on the web page? This may be the most difficult
    step to take, but remember that the web is about what people want and need to
    know, not about saying everything there is to on a topic.'
  merge: -1
  img_proc: true
