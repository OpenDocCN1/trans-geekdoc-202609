- pgno: 147
  md: 'Creating that appearance (designing the web page) is about more than aesthetics.
    It''s also about usability. The design of your web pages can help people find
    what they need and understand what they find. It can also hinder them.


    On successful web sites, the design and the writing style complement and support
    each other; and designers and writers must work compatibly together to accomplish
    that.


    Designers must understand the needs of the content. If you want a successful web
    site, you cannot, at the end, pour content into a design that was created without
    detailed consideration of that content.


    Content writers must work together with designers to be certain that decisions
    on space, font, color, and so on will lead to pages that allow visitors to easily
    see and read the content.


    If you are a content writer, I hope that you are working with visual designers.
    If you are a visual designer, I hope that this book makes you appreciate the importance
    of the content on the web site and that this chapter in particular makes involve
    content writers early and continuously in the design process.


    This chapter is about how to use layout, space, typography, and color to help
    people find and understand your web content.


    # Fourteen guidelines for helpful design


    Here are 14 guidelines to design pages that will help – and not hinder your site
    visitors:


    +   1. Make the page elements obvious, using patterns and alignment.

    2. Consider the entire site when planning the design.

    3. Work with templates.

    4. Use space effectively. Keep active space in your content.

    5. Beware of false bottoms.

    6. Don''t let headings float.

    7. Don''t center text.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 1. Make the page elements obvious, using patterns and alignment


    +   8. Set a sans serif font for the default.


    +   9. Use a relative type size with a default large enough to read easily.


    +   10. Use a fluid layout with a medium line length as default.


    +   11. Don''t write in all capitals.


    +   12. Don''t underline anything but links. Use italics sparingly


    +   13. Provide good contrast between text and background.


    +   14. Think about all your site visitors when you choose colors.


    # 1. Make the page elements obvious, using patterns and alignment


    Good design uses creativity to develop usable web pages. On a usable web page,
    each of the various elements of the page (logo and name, search, global navigation,
    local navigation, content, ads, and so on) instantly obvious, allowing people
    to select what they want effectively and efficiently.


    Two critical aspects of making page elements obvious are patterns and alignment.


    People are very pattern-oriented. If the Search box is in the upper right on the
    home page, we expect to see it in place on all the pages. If bulleted lists are
    slightly indented in the first few pages we look at, we expect all bulleted lists
    to be indented in the same way. We are faster at understanding how the page is
    designed and at finding the specific part we need if the patterns are obvious
    and consistent across pages.


    One of the most effective ways to create patterns that people quickly and learn
    is to have only a few places across the page where boxes or text start. When people
    complain that a site is "cluttered" or "too busy" or "hard to use," they are often
    reacting to pages where elements are not aligned well.


    Figures 7-1 through 7-4 show two different types of sites with obvious patterns
    and alignment. Figures 7-1 and 7-2 are from the web site of the investment company
    Morgan Chase.


    Figures 7-3 and 7-4 are from the web site of the New York Metropolitan Opera.
    The designs are different, but each is consistent within itself, with clear patterns
    and alignment.'
  merge: -1
  img_proc: true
