- pgno: 41
  md: '# Chapter 2 • People! People! People!


    The picture and name are critical parts of a persona description. They make a
    user profile into a persona.


    You know you have a good picture and a good name when they resonate with your
    web team. And that really happens: I was helping a team develop personas for a
    particular user group. They had all met with several people in the user group,
    although I had not. I brought 20 pictures with me of people of different gender,
    age, ethnicity, emotion in their faces, and so on. As soon as I spread out the
    pictures, they pounced on one. “That’s her!” they said. And they knew her “name,”
    too.


    Be sure to select a name and picture that make the team respect the persona. Funny
    or cute names are signs of disrespect. You must have good conversations with your
    personas to write web content that will make good conversations with your actual
    web users.


    You can buy or license stock photography, but many teams find that casual, personal
    photos are better than photos of models. Don''t use a picture of someone the team
    knows. They''ll find it too hard to talk about “Jack” if they know it''s actually
    a picture of Lisa''s brother Mike. But photos of friends or family that the team
    doesn''t know often work well. Just be sure to have the person''s permission to
    use the photo.


    # How do personas work with a web team?


    Personas become members of your web team. Figure 2-3 shows how one team keeps
    their persona in clear view as they work. They can turn to her and “ask” what
    path she would take to get to information or how she would do a task in what they
    are developing.


    Instead of talking generically about “users” for your web content, start talking
    about your personas by name.


    +   - Will Matthew be able to find this information about his insurance policy?

    - What will Edith do if she has a question about her problems with her eyesight?'
