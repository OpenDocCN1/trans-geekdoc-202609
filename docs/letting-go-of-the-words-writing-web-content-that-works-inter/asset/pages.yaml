- pgno: 154
  md: '# Checklist 7-1

    Process for creating a consistent design


    +   1. List all the types of pages the site will have, including all the different
    types of information pages and forms.


    +   2. Minimize the number of page types. For example, for an e-commerce site,
    pages with company information, pages with policies, and perhaps even pages with
    informative articles would probably work well as one page type than as three different
    page types.


    +   3. Give each page type an informative name so that the entire team can talk
    about the pages.


    +   4. For each type of page, list all the elements that will appear on that page
    type.


    +   5. Check with people who might contribute to or use the pages to be sure you
    have all the page types and all the elements for each page type.


    +   6. Plan the entire set of page types together, developing designs that work
    as broadly across page types as possible.


    +   7. Where pages need different patterns or alignment, make those as compatible
    as possible.


    # Understand the process that moves from plan to launch


    Content writers should be aware of the design process that takes a web site from
    planning to final pages. Most teams move from sketches showing the elements of
    each page type (wireframes) through several rounds of ever more finished prototypes.
    The final version of each page type becomes a template that content writers, designers,
    and coders use to develop the actual pages in the web site.


    You should be doing iterative usability testing throughout this process, with
    several versions of your prototypes.


    Figure 7-7 shows four steps (out of at least 9 or 10) in one team’s process from
    wireframe to prototype to final web page. The site is for people who are new to
    and contemplating The Open University in the U. K. Whitney Quesenberry and Caroline
    Jarrett, who were part of the project team, shared these with me, with permission
    from Ian Roddis.'
  merge: -1
  img_proc: true
