  md: '# # Tuning Up Your Sentences


    Now that you''ve planned your content, broken up your documents, decided on your
    essential messages, and designed your web pages, let''s talk about writing the
    paragraphs, sentences, and words of your web content.


    As you write, remember these three principles from Chapter 1:


    +   - Good web writing is like a conversation.

    - Good web writing answers people''s questions.

    - Good web writing lets people “grab and go.”


    As you write:


    +   - Picture the people you are talking with. If you have personas, think of
    them as you write.

    - Ask yourself: What would people ask me about this topic on the phone?

    - Reply to them as if they were on the phone.


    > You might keep photos and short descriptions of your personas on your cubicle
    corkboard or on your desk. If you are part of a team, the team might keep persona
    posters on the wall of the conference room that you use to review draft web content.


    # Writing informally is not “dumping down”


    Language changes over time. It always has. Standards for good web writing change
    over time. They always have.


    Style in nineteenth-century novels differs from style in twentieth-century novels,
    which, in turn, differs from the emerging style of twenty-first-century novels.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Similarly, people''s expectations of appropriate style for information (instructions,
    notices, short essays) have changed over time. Over the past 100 years, writing
    style for communicating useful information has become much less formal. And that
    trend is accelerating with the web.


    This is not "dumbing down"! It''s communicating clearly. It''s writing so that
    busy people can understand what you are saying the first time they read it.


    # # Ten guidelines for tuning up your sentences


    These 10 guidelines will help you write clear and effective paragraphs, sentences,
    and words:


    +   1. Talk to your site visitors. Use "you."

    2. Show that you are a person and that your organization includes people.

    3. Write in the active voice (most of the time).

    4. Write short, simple, straightforward sentences.

    5. Cut unnecessary words.

    6. Give extra information its own place.

    7. Keep paragraphs short.

    8. Start with the context – first things first, second things second.

    9. Put the action in the verbs, not the nouns.

    10. Use your web users'' words.


    > Lists and tables — great ways to tune up your sentences — get your chapter after
    this one.


    # # 1. Talk to your site visitors. Use "you"


    If you are telling people something about themselves or something that applies
    to them, talk to them. Use "you." That makes the information inviting and personal.


    You can convey serious and important messages — even legal rules and notices —
    using "you." In fact, people are much more likely to take in those messages if
    you write them with "you" because they can see themselves in the text.


    Compare Figures 8-1 and 8-2. Which version of the information about Australians
    sending food to the U. S. is easier to read? Which would you rather read? Which
    would you pay more attention to?


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_191_0.png)'
  merge: -1
  img_proc: true
