  md: '# Chapter 8 · Tuning Up Your Sentences


    Sentences in the active voice (active sentences) describe “who does what to whom.”
    In an active sentence, the person or thing doing the action (the actor) comes
    before the verb. That’s the logical word order for English sentences.


    Sentences in the passive voice (passive sentences) start with the object that
    is acted on rather than with the actor. They either put the actor after the verb
    in a “by . . .” phrase or they leave the actor entirely. Figure 8-14 gives you
    examples of active and passive sentences.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_201_0.png)


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_201_1.png)


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_201_2.png)


    **Figure 8-14** Sentences in the active voice put the actor (the “doer”) before
    the verb. In most situations, active sentences are easier to understand than passive
    sentences.


    I am not saying that every sentence must be in the active voice. When you want
    to focus on the object or when it really does not matter who is responsible for
    the action, the passive voice may be appropriate.


    When an entire web page is in the passive, people have a very hard time reading
    it. Their eyes glaze over; they lose interest. Too much of the passive voice is
    both boring and really difficult to understand.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_201_3.png)


    In a fascinating study years ago (with pages from a published document that was
    very much like the web example in Figure 8-15), the researchers asked people to
    read the pages and say everything they were thinking out loud. The people in the
    study translated what they read as'
