- pgno: 387
  md: '# GO of the

    LETTING

    Writing Web Content that Works


    # BY JANICE (GINNY) REDISH

    With a foreword by Steve Krug, author of Don''t Make Me Think!


    Redish has done her homework and created a thorough overview of the issues in
    writing for the web. Ironically, I must recommend that you read every word so
    you can find out why your customers won''t read many words on your web site—and
    what to do about it.


    There are at least twelve billion pages out there. Twelve billion voices talking,
    but saying nothing. If just 1% of those pages follow Ginny''s practical, clear
    advice, the world would be a better place. Naturally, you can follow her advice
    for 100% of your own site''s pages, so pick up a copy of Letting of the Words
    and start communicating effectively today.


    Jakob Nielsen, Principal,

    Nielsen Norman Group


    Lou Resnick, coauthor,

    Information Architecture for the World Web


    On the web, on the job or at home, we usually want to grab information and use
    it quickly. We go to the web to get answers to questions or to complete tasks—gather
    information, reading only what we need. We are all too busy to read much on the
    web.


    This book helps you write successfully for web users. It offers strategy, process,
    and tactics for creating or re-vising [revising] content for the web. It helps
    you plan, organize, write, design, and test content that will make users come
    back again and join to your site.


    Learn how to create usable and useful content for the web from the master—Ginny
    Redish. Ginny has taught and mentored hundreds of writers, information designers,
    and content owners in the principles and secrets of creating information that
    is easy to create, easy to read, and easy to use.


    This practical, informative book will help anyone creating web content do it better.


    # FEATURES


    +   - Clearly explained guidelines with full color illustrations and examples
    from actual web sites throughout the book.

    - Written in easy-to-read style with many “before” and “after”.

    - Specific guidelines for web-based press releases, legal notices, and other documents.

    - Tips on making web content accessible for people with special needs.


    GINNY (JANICE) REDISH has helped clients and colleagues communicate clearly for
    more than 20 years. For the past 10 years, her focus has been helping people create
    usable and useful websites. She is author of two classic books on usability—A
    Practical Guide to Usability Testing (with James Dumas) and User and Task Analysis
    for Interface Design (by Joann Hackos)—and is the recipient of many awards.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_387_0.png)


