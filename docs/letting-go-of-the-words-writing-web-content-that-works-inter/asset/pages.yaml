- pgno: 329
  md: '# 310 Chapter 12 Writing Meaningful Links


    Colorado site, it''s a database used by consultants in archeology and historical
    preservation. Neither site seems to be using the word in its dictionary meaning
    of an instrument for determining direction. But how would web users know any of
    this while exploring each site? And are most users curious to do that?


    Don''t start with the new name. Start with a descriptive link that is meaningful
    for your site visitors. If you want to use the name, introduce it in parentheses
    after the descriptive link or on the first content page – and show how the description
    and the name go together.


    Acronyms often cause problems. Think about the broad audience that may not know
    your acronyms. Even inside an organization, people typically don''t know all the
    organization''s acronyms. Even some of your site visitors aren''t recognizing
    the acronym, spell it out, especially in links.


    # 2. Rethink document titles and headings that turn into links


    An obscure title for a report, report section, or article causes problems both
    on paper and on the web, but the problems are far greater on the web.


    In the paper world, people have the document in hand when they see the title.
    They can scan or flip through the pages looking at internal headings, charts,
    graphs, and text to understand how the title relates to the content. On the web,
    people first see the title as a link – by itself – out of context (Figures 12-3
    and 12-4). They have to click to get more.


    If the title as a link isn''t meaningful, people who should click on it, may not.
    Result: frustrated potential readers who can''t find the information they want;
    frustrated authors whose work doesn''t get read.


    Or the opposite may happen. People may click on the link expecting something totally
    different from what they get. In the paper world, the document is distributed
    only to the audiences for whom it was written. On the web, everyone may see the
    title. It may be a web page while looking for something else. It may show up in
    a search.


    You must think not only about the people who *should* choose the link to your
    information, but also those who *should not* choose it.


    As a web content writer or editor, you may not control the titles of all the documents
    that you are turning into web pages. But take this guideline to heart and pass
    it on to the people who are writing these documents. You''ll be helping them relate
    to audiences. You''ll be helping those audiences – and the document''s non-audiences.
    You''ll be saving yourself the work of having to come up with a description to
    clarify an obscure or misleading title.'
  merge: -1
  img_proc: true
