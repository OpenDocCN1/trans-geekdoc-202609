- pgno: 75
  md: 'meant the link was not available. Their need for their birth certificate overwhelmed
    the message that the gray B was sending.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_75_0.png)


    # # What could we do to fix this page?


    We could greatly improve the page with these three actions:


    +   * Cut the prose drastically.

    * Eliminate the alphabet. It just confuses people.

    * Think about the essential message of the page. If this is a conversation, what
    must the page tell the person who comes to it?


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_75_1.png)


    # # What happened?


    The people who own this page could have solved the problem in several ways: a
    map or a drop-down box, for example. But the simplest way is a short instruction
    and a list of states – and that''s what they did.'
