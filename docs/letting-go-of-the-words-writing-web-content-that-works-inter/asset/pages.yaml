- pgno: 73
  md: 'In this chapter, we explore these eight points:


    +   - Most site visitors are on a hunt – a mission – and the pathway is just to
    get them there.


    +   - People don''t want to read a lot while hunting.


    +   - A pathway page is like a table of contents.


    +   - Sometimes, short descriptions help people.


    +   - Marketing is likely to be ignored on a pathway page.


    +   - The smoothness of the path is more important than the number of clicks (within
    reason).


    +   - Many people choose the first option that looks plausible.


    +   - Many site visitors are landing inside your site.


    This chapter is mostly about structuring pathway pages. I touch on how to write
    links here, but you''ll find more about writing links in Chapter 12.


    An information page can also be a pathway to related information or more details.
    We''ll consider those pages in the section with layering in Chapter 6.


    # Most site visitors are on a hunt – a mission – and the pathway is just to get
    them there


    Think of people trying to find the information they are looking for as bloodhounds
    on a hunt. They try to pick up the “scent” of information they are looking for
    and try to follow that “scent of information” for a successful end – the web page
    that has the information they want.


    ![image](link)

    If a link gives off “good scent,” people feel confident that they are on the way
    to what they want. As Jared Spool shows in his report Designing for the Scent
    of Information, measuring people’s confidence at each page on a pathway is a good
    way to tell if your links are working well for your users.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_73_1.png)


    See Spool, Perfetti, and Brittan on the scent of information. uie.com.


    The concept of “scent of information” comes from the work of Pirolli, Card, and
    their colleagues at Xerox’s Palo Alto Research Center (PARC).


    The Xerox PARC researchers also talk about people as information foragers – sniffing
    our way through web sites, finding what we need. It''s an excellent metaphor for
    the behavior that we commonly see in usability testing.


    # People don’t want to read a lot while hunting


    While hunting (foraging) for information, people aren’t interested in reading.
    They are too busy trying to find their “food”. They are focused on the hunt. It’s
    only when they get to the right place – when the page says “here’s the information
    you came looking for” – that they switch modes from hunting to gathering and are
    ready to read, to take in the information.


    Case Study 4-1 shows that most people want to read very little on pathway pages.'
  merge: -1
  img_proc: true
