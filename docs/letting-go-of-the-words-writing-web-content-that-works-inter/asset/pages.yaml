    # Values


    Knowing what matters to your site visitors may help you decide what content to
    include and what to focus on or emphasize in the content. Knowing their values
    may help you understand why they don''t want to read much, letting go of the words
    and writing in clear, conversational style matches their needs.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_36_0.png)


    # Technology


    What resolutions are your site visitors working at? What speeds are they connecting
    with? How steady is their connection? Do they pay for every minute they are on?
    Are some people getting your web content on small screens – on personal digital
    assistants (PDAs?) on cell phones? You''ll want to know that as you make decisions
    about your web content.


    Despite the tremendous growth of broadband, it is not universal. In many places,
    people pay for each minute of connection – they don''t have unlimited access for
    a monthly charge. Many users are still on slow connections'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'and slow computers, including many home users, older adults, and even users
    in large companies and organizations that can''t afford to update their computers
    regularly.


    Technology changes so rapidly that any statistics I put into the book would be
    quickly out of date. Instead of numbers, here are some web sites you can check
    to track the growth of broadband and other technology issues:


    +   * www.clickz.com/stats/

    * www.oecd.org (and search for broadband statistics)

    * www.upsdell.com/BrowserNews/stat-trends.htm


    # Social and cultural environments


    You should also understand where and when people come to your web content.


    +   * Are they likely to be alone or with someone else?

    * Are they likely to be in an office cubicle or at home or at the public library?

    * Are they going to be doing research on a site like yours for a long time each
    day?

    * Are they likely to be interrupted as they work with your information?

    * Are answering questions for someone else, so they might have someone on the
    phone waiting for the answer while they try to get that answer from your web content?


    All of these characteristics might be important for you to consider as you decide
    what to say and how to say it.


    # Demographics


    Age matter for your site. If you are writing content for a particular age group
    – for example, for young children or for teens – that will affect your writing
    style as well as the design of your site.


    For more older adults and the web, see articles at aarp.org/olderwiserwired.


    But age isn''t all there is to demographics. In fact, recent studies of older
    adults have shown diverse the audience of 50+ or even 65+. Even within the older
    adult audience, you have to think about differences in computer and web expertise
    (aptitude), in feelings about the web (attitude), and in ability (vision and other
    problems).'
