  md: 'Remember that we are trying to help keep busy people grab what they need. In
    most situations, people get the information from active sentences more quickly
    and more accurately than from passive sentences. And writing in the active voice
    pressures you to find out who is responsible for actions – information that your
    visitors often need to know.


    Figure 8-16 shows how we could make the web content in Figure 8-15 easy for people
    to use quickly and accurately.


    # Ordering Laboratory Supplies


    The departmental buyer in...... handles all orders for laboratory supplies. If
    you need supplies, fill out the form...... You can get the form from the buyer
    in......


    # 1. Fill out the form


    To assure that you get the correct supplies, fill out the form carefully and correctly.
    Please pay special attention to these parts of the form:


    +   - ITEM: Look up the item in the catalogs in the office. Put in both the item
    number and a specific description.

    - QUANTITY AND UNIT/SIZE: Be sure to tell us both quantity and unit/size. If you
    write "1" for quantity but don''t tell the unit / size, we won''t know if you
    want 1 piece or 1 case.

    - PRICE: You must fill out the space for price. The catalog you are ordering from
    should tell you the.


    # 2. Sign and print your name on the form


    When you have filled out all the information about the supplies you need, be sure
    to sign the form and print your name. We want to get the supplies to you, but
    if we can''t read your name, we won''t know to whom to deliver them.


    # 3. Give us your phone number and email address


    We need to know how to reach you. Please give us both a phone number and an email
    address; find email is the easiest way to contact people.


    # 4. Turn in the completed form


    Put your completed order form in the black container in The buyer will handle
    your order and notify you your supplies arrive.


    Figure 8-16 My suggestion for revising Figure 8-15.'
