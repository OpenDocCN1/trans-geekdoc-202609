- pgno: 9
  md: '# 7. Use your information to write scenarios for your site


    Scenarios tell you the conversations people want to start


    Scenarios help you understand all types of users


    Everything on your web site should fulfill a scenario


    Scenarios can help you write good web content


    # Starting Well: Home Pages


    Home pages – the 10-minute mini-tour


    Identifying the site, establishing the brand


    Setting the tone and personality of the site


    Helping people get a sense of what the site is all about


    +   - A useful home page makes it clear what the site is about


    +   - A useful home page is mostly links and short descriptions


    +   - Letting people start key tasks immediately


    +   - Put forms people right away on the home page


    +   - Make sure forms are high on the page


    +   - Put Search near the top – where visitors expect it it


    +   - Don''t make people fill forms they don''t want


    +   - Sending each person on the right way, effectively and efficiently


    +   - Use your visitors'' words


    +   - Don''t make people wonder which link to click on


    Putting it all together: A case study


    Building your site up from the content – not only down from the page


    # Getting There: Pathway Pages


    Most site visitors are on a hunt – a mission – and the pathway is just to get
    them there


    People don''t want to read a lot while hunting


    A pathway read is like a table of contents


    Sometimes, short descriptions help


    Marketing is likely to be ignored on a pathway page


    The smoothness of the path is more important than the number of clicks (within
    reason)


    +   - Don''t make people think


    +   - Keep people from needing the Back button


    +   - Many people choose the first option that looks plausible


    +   - Many site visitors are landing inside your site


    # Writing Information, Not Documents


    Breaking up large documents


    +   - Think “topic,” not “book”


    +   - Break web content into topics and subtopics


    Deciding how much to put on one web page


    +   - How much do people want in one visit? How connected is the information?'
  merge: -1
  img_proc: true
