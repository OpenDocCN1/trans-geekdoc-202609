  md: '# What can you do when reading it after it has rested?


    When you open the file after a few hours or a few days, you''ll read it with fresh
    eyes. Ask yourself:


    +   - Is this really what I want to say?

    - Can I say it more clearly? more concisely?

    - Do I need to add anything to make it clearer?

    - What can I cut?

    - Does it have the right tone?

    - Are there headings? enough headings? in the right places? in the right words?

    - Does it have extra words, missing words, typos?


    # Read it out loud


    Reading web content out loud may seem like a strange thing to do, but good writing
    has good rhythm. Good writing actually sounds good when it''s spoken. Reading
    what you''ve written out loud is a good way to find out if your sentences and
    paragraphs are short enough and if your words are clear enough. If you hesitate,
    stumble, or have to take too many breaths in one sentence, rewrite!


    # Use dictionaries, handbooks, and a style guide


    Don''t mislead, misinform, or annoy your readers by misspelling words or using
    words incorrectly. Lots of help is available – online or on your bookshelf. Use
    it.


    # Keep a dictionary (or dictionary site) handy


    Check only for spelling to be sure you are using words correctly.


    # Get a grammar handbook if you aren''t comfortable with grammar


    If you aren''t comfortable as a writer and wish you knew more about making sure
    you are writing grammatically correct sentences, go to your nearest bookstore
    and buy yourself a handbook of grammar. You can get


    For a book about punctuation that is fun to read, Eats. Shoots and Leaves, by
    Lynne Truss.


    Note that the author is British. Some of the rules she gives are not the same
    as U. S. standards.'
