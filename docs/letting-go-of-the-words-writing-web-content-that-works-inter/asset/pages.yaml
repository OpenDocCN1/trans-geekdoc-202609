- pgno: 38
  md: '![](img/2774aacc39f0f1ea3471a505c8a54bcc_38_0.png)


    Vision and other problems are not limited to older adults. In the United States,
    all federal government web sites and any site paid for with government money must
    be accessible to all. Many other countries require attention to making web works
    for everyone.


    For a list of accessibility requirements in different countries, see www.w3.org/WAI/Policy/


    # 5. Gather your audiences’ questions, tasks, and stories


    From all sources, gather lists of the questions that people expect the web site
    to answer, the tasks they need the web site to support, and the stories they tell
    about their experiences with your web site, and web sites, and in relevant non-situations.


    As you gather their questions, tasks, and stories, don''t translate! Keep the
    users'' words. One of the most important parts of gathering information from your
    audiences is understanding the words they use to describe what they want and need.
    You''ll have vocabulary to use in your web content.


    # 5. Use your information to create personas


    If you''ve done the first four steps in this chapter, you have a lot of facts
    about the people who or should come to your web site. But it may be hard to imagine
    real people in the facts you''ve gathered. Do the facts seem dry? Do they lack
    “human interest” – a real sense of the *people* your web content is?


    Alan Cooper popularized personas in design. Cooper''s books are listed in the
    bibliography.


    A great way to bring your web users “alive” for yourself and your team is to create
    personas.


    For more personas, see Pruitt and Adlin, *The Persona Lifecycle*, 2006.


    A persona is an individual with a name, a picture, and specific demographic and
    other characteristics. A persona is not a specific real person; a persona is a
    composite of characteristics of many real people.


    A persona brings together in one example the facts you''ve gathered from thinking
    about or, even better, watching and listening to the people who come to your web
    site. Your personas don''t have to be fancy. You don''t need to spend lots of
    time and money creating elaborate presentations. You do need to be true to the
    data that you have to make sure the personas represent your web users – not you.'
  merge: -1
  img_proc: true
