  md: '# 5. Market by giving useful information


    On the web, market best by giving users the factual information they want as easily
    and quickly as possible. Because web users see so much less at a time on the screen
    than on a piece of paper, there isn''t the same room for non-factual "happy talk"
    as there is in a brochure or advertising flyer. And because web users are so often
    goal-oriented, they don''t want to be distracted by information that isn''t relevant
    to gathering up all the facts.


