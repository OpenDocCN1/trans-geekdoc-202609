- pgno: 360
  md: '# Help your reviewers understand good web writing


    In discussing your plans for the content, work with the reviewers so that they
    understand


    +   * your purposes in writing the part of the web you are working on

    * the site visitors you are writing to and their relevant characteristics

    * the scenarios you expect your site visitors to have related to your content


    If your reviewers are not familiar with personas and scenarios, this might be
    a great time to introduce the concepts and to introduce your specific personas
    and their scenarios.


    If your reviewers are likely to create a different writing style than what you
    plan to, work with them so they realize the importance of an audience-focused,
    key-message-first, simple-language style. Show them samples of good writing on
    similar topics from other web sites. If examples from this book will help you
    and your reviewers, use a few (with credit, please). Create a “before” and “after”
    for even a small piece of your web content to show reviewers what you will be
    doing. Get them to express their concerns so that you can discuss those concerns
    and allay their fears.


    # Getting useful information from reviewers


    Stay in touch with your reviewers, without overdoing it.


    # Tell reviewers when the schedule changes


    Schedules change. If a change affects when you will get material to your reviewers,
    let them know. Negotiate with them on new dates. Don’t just assume they can accommodate
    every slip in the schedule.


    # Give reviewers a “heads up” a few days in advance


    Everyone on your web team is overly busy, including your reviewers. Remind them
    when you are about to send a draft.


    # Make your expectations clear


    It’s frustrating to expect a technical review and then get your copy back with
    nothing more than a few commas changed – incorrectly. You can improve your chances
    of getting what you need if you make your expectations clear.'
