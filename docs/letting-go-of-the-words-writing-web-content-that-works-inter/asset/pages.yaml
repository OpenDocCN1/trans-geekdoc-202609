  md: 'In your own country, the audiences for your web site may include many immigrants
    who speak and read your language as their second, third, or fourth language.


    # Putting it all together


    Let''s close this chapter with two case studies that bring together several of
    the guidelines. In Case Study 8-3, I apply several guidelines to a paragraph for
    doctors about getting a medical license. In Case Study 8-4, I return to the example
    that started this chapter and show you the entire page about Australians shipping
    food to the U. S.


    # Case Study 8-3 Applying several guidelines to one paragraph


    As you write or revise your web content, you will often find yourself many guidelines
    at the same time.


    Consider this paragraph from the American Medical Association''s web site. It
    is advice to doctors who are considering moving and getting licensed in a new
    area.


    > The advice starts with an implied task. It doesn''t tell the reader to do the
    task.


    When considering a licensing board for the first time, ask for a copy of its current
    licensing requirements and the average time it takes to process applications.
    This will provide the physician with a solid idea of when considering an existing
    practice or plan a move as well as with information about the potential problem
    areas to be addressed in completing an application.


    The "physician" is the person the writer is talking to. The writer has already
    spoken directly to the physician by the imperative "ask." Why not continue to
    speak directly to the physician with "you?"


    "Ask" is an imperative verb. It addresses the reader directly.


    The second sentence is 39 words long and includes several points.

    The first sentence has two points: ask for (1) requirements and (2) average time.


    The second sentence tells why to do that, but it gives the rationale for asking
    about time before the rationale for asking for the requirements.


    www.ama-assn.org/ama/pub/category/2644.html'
