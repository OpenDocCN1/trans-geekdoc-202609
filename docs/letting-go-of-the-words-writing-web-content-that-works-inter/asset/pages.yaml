    # PDF – yes or no?


    You probably already know this, but just in case . . . PDF stands for portable
    document format. PDF was invented by Adobe Systems, Inc. (www.adobe.com), as a
    way to publish documents that anyone can read, regardless of whether they are
    working in the same operating system or using the same software that the document''s
    creator worked in.


    A PDF file keeps the layout, page breaks, and fonts of the original document.
    With PDF, you can have a document that looks the same whether you send a paper
    copy to someone or that person prints it from the web.


    Anyone who has Adobe Acrobat Reader on a computer can open, and print the document.
    Most new computers today come with Acrobat Reader already installed, and Adobe
    allows free downloads of Acrobat Reader from its web site. Anyone who is comfortable
    downloading and installing software can have a copy.


    # Should you rely on PDF files for your web content?


    I’m not going to say, "Never put up a PDF file." As always, it comes down to your
    goals, your audiences, and their scenarios.


    However, realize that with most PDF files, you are providing a paper document
    on the web rather than web-based information. If the docu-'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'ment looks like a paper document or if it is large, people are likely to print
    it rather than read it on the screen. You have distributed the document; you have
    saved the printing and shipping cost; you have shifted the cost and effort of
    printing to your audiences – but you really met their needs?


    # # When might a PDF file be appropriate?


    If you are using the web to distribute journal articles or other material that
    you expect people to print and use on paper, and if your audiences are comfortable
    with PDF files, PDF may be the right way to go.


    The web is a great distribution mechanism:


    +   - Many people are now more comfortable going to a search engine than trudging
    to the library.

    - You can get the PDF whenever you want (no need to know when the library is open;
    no need to work only in the daytime).

    - A search engine may find what you want from a few keywords (no need to understand
    how the library organizes the journals; no need to go hunting through the stacks;
    no worries someone else will have already the article).

    - You can send the link to colleagues or get the document instantly because someone
    sent the link to you.

    - You can have and give access to the documents to people who might not live near
    a library or who are in countries where mail delivery is slow or unreliable.


    Distribution is the great advantage that the Internet has over paper, even for
    paper documents.


    # # When is a PDF file not appropriate?


    However, PDF documents are often not the best way to create a useful and usable
    web site. Break documents into non-PDF pieces –


    +   - when people don''t want the whole document

    - when people want to read from the screen

    - when your audiences are not comfortable with PDF files or with downloading software

    - when accessibility is an issue – and you should always consider accessibility'
