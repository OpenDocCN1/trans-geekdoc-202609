- pgno: 21
  md: '# Chapter 1 · Content! Content! Content!


    +   * answers a question or helps them complete a task

    * is easy to find and easy to understand

    * is accurate, up to date, and credible


    In a survey of business professionals, 95 percent said "that it is very or extremely
    important that the information they need to do their jobs be accessible, up-to-date,
    and easy to find on the web." www.enterpulse.com/news-051502.html#


    Information = content. In this book, I''m going to use both words “information”
    and “content” – to talk about the words and pictures that you and your team put
    on your web site.


    # Web users skim and scan


    Last time you were on the web, how much did you want to read? How quickly did
    you want to get past the home page of the site you went to?


    Did you search? How much of the search results did you read? Did you navigate?
    How much did you want to read on the pathway (menu) pages you had to go through
    to get the information you were looking for?


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_21_0.png)


    What did you do when you got to the page where you thought the information was?
    Did you start to read right away? Or did you first skim and scan?


    Most skim and scan a lot on the web. They hurry through all the navigation, wanting
    to get to the page that has what they came for. Even on the final (destination,
    information) pages, most web users skim and scan before they read.


    In a study showing that most people scan web pages, see Morse and Nielsen, 1998,
    and Nielsen, 2000.


    Most web users are very busy people who want to read only as much as they need
    to satisfy the goal that brought them to the web.


    In another study, people spent an average of 27 seconds on each web page (Nielsen
    and Loranger, 2006).


    # Web users read, but . . .


    Do people ever read on the web? Yes, of course, they do. They read links, short
    descriptions, and search results – but they want to want'
