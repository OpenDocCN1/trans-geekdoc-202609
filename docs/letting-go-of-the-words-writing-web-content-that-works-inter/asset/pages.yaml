  md: '226 Chapter 9 • Using Lists and Tables


    # Contrasting lists and tables


    Now that I have convinced you (I hope) of many good ways to use lists in your
    web content, let''s turn to tables. Tables, like lists, are a great way to let
    go of the words that don''t matter and let people get the essential information.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_245_0.png)


    Think about the difference. What is a list? What is a table? When would you use
    each?


    +   - Individual items, all in the same category of information.

    - One column.

    - If a list wraps to a second column, the second column is a continuation of the
    list. The columns are a formatting feature; they don''t show a relationship.


    +   - More than one category of information.

    - At least two columns.

    - The columns show a comparison or a relationship.


    # 10. Use tables when you have numbers to compare


    “table” whenever you have sets of numbers that relate to each other in some way.
    Compare Figure 9-23, the original version of real estate sales figures from a
    blog, with the same information put into a table (Figure 9-24).


    Breaking down the total, 2,841 sales were reported in TREB''s 28 West districts
    and averaged $305,789; 1,211 sales were reported in the 144 Central districts
    and averaged $405,182; 1,536 sales were reported in the 23 North districts and
    averaged $372,455; and 1,799 sales were reported in TREB''s 21 East districts
    and averaged $265,090.


    > It''s difficult to grab numbers from sentences – and especially difficult to
    do comparisons.


    Figure 9-23 This blog includes useful numbers, but it should be formatted as a
    table.


    ```

    toreal.blog.com/Toronto/Toronto_real_estate_update

    ```'
