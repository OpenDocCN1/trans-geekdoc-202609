    # Don''t assume full screens at high resolution


    Some users still have small screens or work at low resolution. Those of us work
    on large screens at high resolution – and I''m looking at what I''m typing on
    a 24-inch monitor at a screen resolution of 1900 × 1200 – tend to forget that
    most of the people who use what we develop aren''t working in that environment.
    Most of your site visitors are probably working at 1024 × 768, but a sizable minority
    are still using 800 × 600 screens. (Summer 2006: About 20 percent of web users
    are still at 800 × 600.)


    For up-to-date information on screen resolutions most people are using, see the
    web sites listed in Chapter 2, page 18.


    Furthermore, even sophisticated business people and research scientists don''t
    all work with small type on large screens. In a field study with employees of
    a large health information group in everyone had monitors that could display at
    1024 × 768, the client and I were surprised to see that many employees had changed
    their displays to lower resolutions or large type. They were seeing much less
    on the screen at one time than we had assumed.


    Many except users open multiple windows and lose those windows share screen space.
    Don''t maximize the windows; they are only part of your web page at one time.


    These realities are all good reasons not to use most of the upper part of a web
    page for a large picture that serves for emotional appeal. Use the space instead
    for the most important forms or information that people come to your site to get.'
