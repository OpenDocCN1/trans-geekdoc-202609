    # Be consistent; don’t mix nouns and “you” when talking about the same person


    Figure 8-3, instructions for registering for classes, people may be confused because
    one sentence talks about the "student" and the next talks about "you." If these
    are the same people, why not use "you" throughout?


    # Use appropriate nouns to talk about others


    If you are talking other people, things, or situations, use a name or description
    rather than "you." You can still keep the sentences short and active, as in Figure
    8-4.'
