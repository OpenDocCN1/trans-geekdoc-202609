  md: '# 4. Break down walls of words


    Even with inverted pyramid style, keep your paragraphs short and use bulleted
    lists. Break up the text.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_126_0.png)


    Walls are barriers. Large blocks of text that look like wall-to-wall walls are
    barriers to web users. Very short paragraphs or bullet points work best.


    If you are moving from writing for paper to writing on the web, think of the pieces
    you need as even smaller than what you would plan for a paper document. Each small
    topic needs its own heading. Each question and answer needs the question as a
    heading and the answer in short sentences or as a bulleted list.


    Case Study 6-2 shows how breaking down walls of words increased business for an
    e-commerce company.


    # Case Study 6-2: Breaking down walls of words made the difference!


    When CompareInterestRates.com tried a variety of changes to their online form,
    the only change that made a significant difference was moving from paragraphs
    of text to a bulleted list. Here''s how the original web form started:'
