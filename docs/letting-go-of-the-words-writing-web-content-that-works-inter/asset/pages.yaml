  md: '# 7. Keep paragraphs short


    Your seventh-grade teacher probably never wrote for the web. The type of writing
    that you did in school (essays, reports, stories) was different from typical writing
    for the web. For a traditional essay, you were probably taught to write with at
    least three sentences and more likely five or six sentences in each paragraph.
    That’s too long for a web paragraph.


    # On the web, a one-sentence paragraph is fine


    Keep your web paragraphs very short. On many web sites, you see paragraphs that
    have only one or two sentences each, as in Figure 8-21, reporting on a soccer
    match.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_210_0.png)


    Figure 8-21 Very short paragraphs work on the web.'
