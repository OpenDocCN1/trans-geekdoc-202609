- pgno: 292
  md: '# # Using Illustrations Effectively


    In previous chapters, we''ve talked about making information visual just by arranging
    the text: short paragraphs, short sentences, lists, tables, head-ings, and a judicious
    use of space. Illustrations (photos, drawings, charts, graphs, maps, and so on)
    are also an important part of your web content.


    As with all web content, in planning illustrations, you must think about your
    purposes, how your audiences, and why people come to your site. The first questions
    to ask as you plan for illustrations are:


    +   - What do I want to achieve by having an illustration here?

    - What type of illustration is appropriate to achieve that purpose?


    Indeed, as you go through your web content, ask yourself:


    +   - Am I drawing a picture in my head as I read this?

    - Is this difficult to explain in words?


    If so, an illustration may be appropriate to explain or expand or replace your
    other web content.


    # # Illustrations serve different purposes


    I''ve been thinking about when, how, and why different types of illustrations
    work and don''t work well on web sites. And I''ve come to realize that there''s
    a continuum of types of illustrations that serve different purposes – from representational
    to emotional. Consider Figure 11-1.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 274 Chapter 11 • Using Illustrations Effectively


    | words | picture of exact item | picture to illustrate concept or process | chart,
    graph, map | mood picture |

    |---|---|---|---||

    | | | | |


    **Figure 11-1** Your purpose in using a picture can range from purely representational
    to purely emotional (mood setting).


    Let''s explore each of the four types of illustration in the continuum in more
    detail.


    # # Picture of exact item


    The continuum starts with purely representational pictures of the exact item.
    Because these pictures are so common in e-commerce sites, I’ll start there and
    explore exact pictures in other types of web sites a few pages later in the chapter.


    If you work on an e-commerce web site, as you choose what to show in your online
    catalogue, think of illustrations as part of your conversation with customers.
    What questions do customers ask about the items? How can you take advantage of
    the web to show the answers?


    In observing web users at e-commerce sites. Jared Spool found that experienced
    hikers rejected the offerings at a site that did not show the shoes of hiking
    boots. Instead, they chose boots from REI which had pictures like the ones I’m
    showing here. Jared tells me (through email correspondence) “The REI people know
    to tip over the boots when shooting the pictures because the photographer used
    to work in the footwear department.”


    # # Think about aspects people want to see


    For hiking boots, for example, people want to see the bottoms as well as the tops,
    REI uses both static and dynamic pictures to present the parts that people want
    to see (See Figures 11-2 and 11-3).


    Not every item needs a 3D video, however. Take advantage of what the web lets
    you do, but only when doing so adds real value for your site visitors.'
