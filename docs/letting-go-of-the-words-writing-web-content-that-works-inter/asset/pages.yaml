  md: '# 10. Don''t embed links if you want people to stay with your information


    As a first step, at least short descriptions with the links to help people choose
    well. And then go beyond that. When you find that your site has several links
    that are hard to distinguish, don''t rewrite the links. Take the problem of similar
    links as the impetus to clean up the content. That probably requires collaboration
    – writers from different departments working together to produce consistent, coherent
    information for your web readers.


    # 10. Don''t embed links if you want people to stay with your information


    To this point in the chapter, we''ve focused on links on home pages and pathway
    pages, where your primary goal is helping people move on.


    Let''s turn to an issue for the information pages at the end of that pathway.
    As we discussed in the section on layering in Chapter 6, information pages also
    include links – to more details or related information.


    Recently, one of the hottest topics for one of my clients was this question: Is
    it okay to embed links in paragraphs of text or should you always put them at
    the end of the paragraph or even separate them from the other text entirely?


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_342_0.png)


    The answer, as with many questions in creating successful web sites, is that it
    depends on your purposes, your web users, and why they are coming to your web
    site.


    The point to remember is that an embedded link is always a distraction. If people
    choose to follow an embedded link, they leave their information in the middle
    of what you are saying. It''s switching conversational topics in mid-sentence.


    # If people are just browsing, embedding may be okay


    Most Wikipedia articles are full of embedded links. The page in Figure 12-16 is
    just one of thousands of examples I could have selected from Wikipedia.org.


    Does having embedded links work for Wikipedia articles because people most often
    come to Wikipedia in browsing mode? Are they eager to see how a topic branches
    and connects to many other topics?'
