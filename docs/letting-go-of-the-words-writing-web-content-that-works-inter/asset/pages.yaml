- pgno: 173
  md: 'Dark backgrounds and dark type are often very hard to distinguish. Blue text
    on red may even seem to vibrate on the screen, making that combination very hard
    on the eyes. Light colors (including light gray) are hard to see on a white background.
    Figure 7-18, an overview about asthma, shows you some of these combinations look
    on an actual web page.


    Did you notice the tag line here? It''s light gray on white.


    How difficult is it to read white on yellow or yellow on white?


    What on this is easiest to read? Isn''t it the black text on a white background?


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_173_0.png)


    Figure 7-18 High contrast between text color and color background is essential
    for legibility. If people have to struggle, they will stay on your site. aafa.org


    By far the best combination for contrast and legibility is black on a white or
    very light background. That''s what web teams are using today for parts of the
    web page that must be easy to read. It''s a smart way to go.


    # Use light text on a dark background sparingly


    Light text on a dark background is often called "reverse text." Most people find
    reverse text difficult to read, especially for sustained periods.


    Don''t use reverse text for the main content of your web site. Look again at Figures
    7-16 and 7-18. You can see how difficult reverse text is to read. (Also look at
    the case study at the end of the chapter.)'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'You can often make reverse text work for small bits on the page, if you keep
    the contrast high, the size large enough, and the font bold enough. For example,
    many designers use reverse text on tabs, as you can see in Figure 7-19, from a
    Canadian site about diabetes.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_174_0.png)


    **Figure 7-19** White type on a colored background is often used for tabs, where
    people are reading only one or two words at a time. www.diabetes.ca


    # 14. Think about all your site visitors when you choose colors


    As you choose colors, also keep in mind that different cultures attach different
    meanings to colors and be sensitive to the needs of people who are color blind.


    Above all, never let the color be the only indicator of a feature, function, or
    information. Make sure your site works in monochrome, even if you think no one
    will ever look at it without the color. Print your pages in grayscale so that
    you can check that all the page elements are obvious and readable.


    # Think about the cultural meaning of colors


    Some graphics and colors are pretty much universal. You can drive almost anywhere
    and assume that a traffic light has red, amber, and green; that red stops and
    green means go.


    Colors also evoke connotations, like calm, aggressive, soothing, cheerful, luxurious
    – and those connotations are different in different cultures. Colors are sometimes
    associated with political parties – and, again, those associations vary with the
    culture. Rather than spout a few factoids about specific colors in specific cultures,
    the best advice I can give you is to test your site with people from the different
    cultures that you want to reach.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'As seen by a person with deuteranopia, a form of red/green colorblindness.


    Some colorful hats


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_175_0.png)


    **Figure 7-20** What you see as bright and different colors may not appear that
    way to everyone else. www.vischeck.com


    # Check your colors to avoid problems for color-blind users


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_175_1.png)


    About 5 to 8 percent of males have some form of color deficiency, most often that
    they cannot distinguish red or that they cannot distinguish green. (Some women
    are colorblind, too; but the percentage is very small.)


    Consider what would happen on your web site if someone cannot tell what the items
    on the page are in red or green (in or other specific colors). The example from
    the Vischeck web site (Figure 7-20), if you only want people to see a row of hats,
    it may not matter that some people can''t tell that the hats are different colors.
    It is important that people see hats with five different colors, these colors
    won''t work for everyone.


    Selecting colors that work for the different varieties of color blindness is not
    simple. It''s not as easy as just avoiding all reds and greens. The shade of red
    or green matters can be problematic when used in combination with certain reds
    and greens.


    The best way to know if your web page is going to cause problems is to check your
    design before you finalize it. Sites like www.vischeck.com and colorfilter.wickline.org
    let you know how your web pages will look to people with different types of vision
    problems.


