    What is high blood pressure?


    +   * Printer-friendly version

    * Email this article

    * Spanish / Español


    An image that shows arteries can carry blood from your heart to your body. High
    blood pressure occurs when blood moves through your arteries at a higher pressure
    than normal.


    Return to top


    # ## What do the numbers mean?


    Blood pressure is measured in two numbers, separated by a slash when written,
    such as 120/80. You may also hear say your blood pressure is 120 over 80.


    The first number is systolic pressure. This is the peak when your heart is beating
    out. The second is diastolic pressure. It''s the pressure when your heart is filling
    with blood between beats.


    A normal blood pressure is less than 120/80. High blood pressure is if your blood
    pressure is between 120/80 and 140/90, you have something called ''hypertension''.


    Return to top


    # ## How is high blood pressure diagnosed?


    Blood pressure is measured by putting a blood pressure cuff around your arm, inflating
    the cuff and listening for the flow of blood. Your doctor will measure your blood
    pressure more than one visit to see if you have high blood pressure.


    Return to top


