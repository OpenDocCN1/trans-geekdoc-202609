- pgno: 315
  md: 'However, "serious" doesn''t always work. A colleague told me his team found
    it impossible to include a photo with a serious expression on a health care site.
    With every "serious expression" picture they tested, some people thought the person
    looked unhappy or even angry. The team ended up showing only smiles.


    Even the grouping that you evoke emotions and explanations that surprise you.
    A site for people concerned with cancer tried a photo of a man with two children.
    One test participant''s reaction was, "Oh, poor family. Did the Mom die?"


    Putting your prototype web pages in front of people and getting their reactions
    is the only way to know how the pictures you picked will be perceived. You can
    do that in focus groups or in usability testing. Which method you use, don''t
    just show the photos by themselves. Show them in the context of the web page they''ll
    be on and the other web content they''ll be. Context matters, as you''ve seen
    in the stories I''ve just told.


    # 5. Don''t make content look like ads


    Many users use "ad blindness"; they ignore anything that looks like an ad. Because
    so many sites have ads in colorful boxes in the right column, people tend to ignore
    any content on the right in colorful boxes.


    Although the bright colors on the right in Figure 11-24 from The Pension Service
    in the U. K. draw your eye, do you then ignore them and head over to the left
    instead? The Pension Service, in fact, replaced this design with one that has
    only the invitation to enlarge the text and the link to the related but different
    Directgov site on the right. You saw the new design back in Chapter 5 as Figure
    5-6.


    # 6. Don''t annoy people with blinking, rolling, waving, or wandering text or
    pictures


    Movement is eye-catching. Paying attention to movement in our peripheral vision
    was a key survival skill when we shared space with lions on the savannah. On the
    web, however, movement is just plain annoying. It takes our eyes from the task
    we are trying to do. Don''t make page elements blink or wave or roll or jump around
    gratuitously.'
