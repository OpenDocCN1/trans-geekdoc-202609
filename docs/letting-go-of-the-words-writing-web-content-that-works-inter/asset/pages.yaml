  md: "# What do we learn from this case study?\n\nThink about points as you write\
    \ your web content:\n\n+   - Put a full date on every web page. Include the year.\
    \ And, by the way, write the date with month spelled out. That's the best way\
    \ to avoid misunderstandings because people in different countries read dates\
    \ differently. As you may know, 5/1/2007 is May 1, 2007, in the United States\
    \ and January 5, 2007, in much of the rest of the world.\n- Think about the life\
    \ span of the web page. If the web page has information that will not be needed\
    \ after a certain date, revisit it when that information is no longer needed.\n\
    - In fact, have a maintenance schedule for all your web pages.\n- Think about\
    \ \"holes\" in the information. What questions people have that the information\
    \ does not answer? Get the information. You'll avoid phone calls if you do.\n\
    - Over time, turn press releases into pages of web information, if that information\
    \ is still needed.\n- Help people see very quickly if they need the information\
    \ on the page. Don't make people read a lot only to find out what they read for.\
    \ Try to state exceptions – in a positive way. Don't start with \"Except for...”\
    \ That's negative. You can always find a positive way to help people find the\
    \ information that's right for them.\n\n# SUMMARIZING CHAPTER 8\n\nHere are key\
    \ messages from Chapter 8:\n\n+   - Writing informally is not \"dumbing down\"\
    !\n- Talk to your site visitors.\n  - Be consistent, don't mix nouns and \"you\"\
    \ when talking about the same person.\n  - Use appropriate nouns to talk about\
    \ others.\n  - Use the imperative in instructions.\n  - Use \"you\" rather than\
    \ \"he or she.\\n- Show that you are a person and that your organization includes.\n\
    \  - If you are blogging, \"I\" is fine.\n- If you are writing your own articles,\
    \ \"I\" is fine."
