- pgno: 326
  md: "# Writing Meaningful Links\n\nThis book is about information on the web much\
    \ more than it is about getting around on web sites (web navigation). But navigation\
    \ is also critical.\n\nYou've seen many examples of links throughout the book,\
    \ especially in Chapter 3 on home pages, in Chapter 4 on pathway pages, and in\
