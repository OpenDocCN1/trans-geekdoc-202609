- pgno: 357
  md: '# Work with a writing specialist or editor


    In addition to your own reading, reviewing, editing, editing, proofreading – and
    trying out your writing with colleagues and your audience – you may also benefit
    from working with a writing specialist or an editor.


    Editors do many tasks, from coordinating projects to checking facts to getting
    manuscripts ready for publication (in print or online). Rather than focus on those
    aspects of an editor''s job, however, I want to talk about two specific ways in
    which writing specialists and editors can help you as a writer:


    +   - focusing on the big picture with you

    - copy editing for you


    You may want different people as your “big picture” editor and as your copy editor.
    Although some people can do both well, the two tasks require separate skills.
    Certainly, the two types of editor require separate passes through the material.


    # Have someone focus on the big picture with you


    The big picture editor focuses on audience, appropriateness of the content, overall
    organization, and coherence throughout the writing. A big picture editor should
    start by asking:


    > Professional writers always have editors to help them.


    +   - What are you trying to achieve?

    - Who are your audiences?

    - How will those people use what you are writing? What are coming to your web
    site to do? What are their scenarios?


    With the answers to those questions, the big picture editor should read and comment
    on how well you have have


    +   - made your key messages obvious

    - organized your messages for the audiences

    - shown your organization through the headings

    - written sentences that will make sense to your audiences and are easy to read

    - chosen words that your readers are likely to understand'
