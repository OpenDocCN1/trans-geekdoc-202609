  md: '# Putting it all together 201


    # New requirements for mailing food to the US


    The following media release was issued by the US Embassy in Canberra on Monday
    December 19 .


    The heading is not very informative.


    Australians planning to send food to the United States should be aware of the
    new "prior notice" requirement under the U.S. Bioterrorism Act.


    December 19 of what year?


    Here, the "person" should be passive voice.


    The new notice requires the person sending the food to electronically file a "prior
    notice" with the U.S. Food and Drug Administration. A confirmation of the FDA
    receipt of "prior notice" must be presented to Australia Post along with the parcel.
    The "prior notice" form is translatable at http://www.fda.gov/foodid.gov


    "Confirmation" and "receipt" are nouns that hide verbs.


    However, although this requirement came into effect December 12, the U.S. Food
    and Drug Administration has advised that food mailed to the United States will
    not be refused entry if the parcel does not include the "prior notice" from now
    until August 12, 2004. Australia Post has been advised of this change.


    "Must be presented" is passive voice.


    This paragraph is not needed in 2006.


    The only exception to this requirement is for food made by an individual in his/her
    home and sent by that as a personal gift (for non-business reasons) to an individual
    in the United States.


    The exception is at the bottom.


    The text of the FDA press release outlining the transitional arrangements can
    be viewed at: http://www.fda.gov/bbs/topics/NEWS/2003/NEW00995.html


    This paragraph is not needed in 2006.


    More information on the Bioterrorism Act is available at the FDA website at: http://www.fsan.fda.gov/~dms/fsbtact.html


    # What we want to fix?


    Bringing the article to date allows us to drop information that needed only in
    the transition period that ended in August 2004.


    While we are doing that, we can also make the article much easier for people to
    understand and use.


    First, we would bring the exception to the top of the article. Never make people
    read a lot only to discover that the information does not apply to them!'
