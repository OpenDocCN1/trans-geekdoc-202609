  md: 'The United States has no national registry for vital records as birth certificates.
    To get a copy of your birth certificate, you must find the right office in the
    state where you were born – although many people do not realize that.


    The U. S. has a portal site that promises to link people to the right place for
    many needs. In a usability test of that site, we gave people the scenario: "You
    need a copy of your birth certificate, and a friend said you could get to the
    right place from this site."


    At the time of the test, the portal site was called Firstgov.gov in 2006, the
    name changed to USA.gov.


    Every one of the 16 people in our usability test found the link they needed easily
    on the home page. They looked under Online Services for Citizens and Click on
    Birth and Marriage Certificates.


    That brought up this web page:


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_74_0.png)


    # What people did do on this page?


    Most people clicked on B, often several times. They did this even though they
    were sophisticated web users and all knew that gray'
