- pgno: 318
  md: '# 7. Use animation where it helps – not just for show 299


    The movement in Figure 11-26 may keep people from finding what they need elsewhere
    on the page. Moreover, the page is specifically directed at older adults – who
    may need more time to read each part than the cycling of the pictures allows them.


    # Don''t let animated animals, birds, butterflies, and so on, roam the page


    Eye-tracking studies show that people often try desperately to move away from
    animation. They want to concentrate on finding and understanding the information
    they came to the site for. When a roaming animal or bird or butterfly crosses
    the path of what they are reading, they get distracted – annoyed.


    # Weigh the trade-offs for animation carefully


    Animation is so distracting that many people cannot concentrate on anything else
    on a page where something is animated, even if the animation doesn''t intrude
    into the main content area. So you must ask: is the blinking ad or other animation
    so important that it trumps the task the web user came to do? If you don''t let
    people accomplish the tasks they came to the site to, you risk losing them as
    future site visitors. Don''t use animation to be cute. Don''t use animation just
    to live up the site. Remember that you market best by satisfying your need site
    visitors come for, not by distracting them away from their tasks.


    # 7. Use animation where it helps – not just for show


    The only good reason to use animation is when it helps explain the content. For
    example, if you want to show a process, animation may be just the right tool to
    use. The animation supports and clarifies the content.


    Learning how to tie different types of knots is clearly a candidate for animation,
    and the site Animated Knots by Grog uses motion and text together very well (Figure
    11-27).'
  merge: -1
  img_proc: true
