    # 9. Coordinate when you have multiple, similar links


    This is a guideline about not writing or rewriting links. It''s a guideline about
    using links to understand and improve the content on your site.


    Many organizations develop their web sites by hosting content owners in different
    departments post information. If the same topic is covered in different departments,
    several explanations of the same topic may show up as links on the web site. They
    may appear together on the same pathway page. They may appear all in search results.


