    web site. This set shows two of many iterations of wireframes and prototypes.
    Courtesy of The Open University team, led by Ian Rodinnis.


    # Integrate content and design from the beginning


    Every step in this process involves meshing content and design. The list of page
    elements requires decisions about content. What will the content be like on each
    page type? Will there be in-page links on information pages? If so, where should
    they go? How much information will there be about each item in the catalogue?
    How long typical headings in the content be? What patterns will the content writers
    use for their information? And so on.'
