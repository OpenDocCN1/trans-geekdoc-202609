  md: '15. Format tables on the web so that people focus on the information and not
    on the lines 231


    +   - You cannot assume that all your web users have maximized windows. Even if
    you are giving technical information, consider your audiences. Are they policy
    makers? decision makers? managers? very busy people who find it difficult to extract
    information quickly from large and complicated tables?


    Consider breaking up and complicated tables into a series of smaller, more specific
    tables. Or layer your tables—allowing web users to drill down to more details
    through links in the tables.


    For example, in my suggested revision to the shipping charges, I would use separate
    tables for different parts of the world. That would be easier for most people
    than a large matrix with information for different people in different columns.
    People have difficulty jumping over information that is not relevant to them.


    # Thinking about table length


    Let''s talk about length next (number of rows). Although most web users scroll
    vertically, a long table may be more difficult to use than a long list. A table
    shows a relationship; people must remember the column headings for a table to
    understand how the pieces of information in each row relate to each other.


    Again, consider breaking up very long tables into a series of smaller tables that
    allow you to keep the context-giving column headings close to the information.


    # 15. Format tables on the web so that people focus on the information and not
    on the lines


    The way tables look can help or hinder people from getting the information they
    need. Let''s close this chapter with two important guidelines about formatting
    tables:


    +   - Don''t put thick lines between the columns or between the rows in a table.


    +   - Don''t center text in a table.


    # Don''t put thick lines between the columns or between the rows in a table


    Making each cell of a table into a box with equal weight borders all around it
    doesn''t help your web users. People don''t use tables by'
