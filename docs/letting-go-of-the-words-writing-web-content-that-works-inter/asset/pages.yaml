- pgno: 266
  md: '# 3. Give statement headings to convey key messages 247


    +   * Am I using more words than necessary to make a connection with my site visitor?


    # Consider starting with a key word for fast access and accessibility


    Although questions work wonderfully well as headings for many types of web content,
    they have one downside. The key word in the heading is not at the beginning. If
    the question is short, sighted readers can see the key word quickly even if it
    is in the middle of the question. However, people who are listening to screen-readers
    may not get to the key word. They often skip rapidly from heading to heading,
    listening only to the first few words.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_266_0.png)


    A solution that may also help sided readers scan rapidly is to combine a key word
    with the question, as in Figure 10-8.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_266_1.png)


    Signature: Who must sign the application? Deadline: When is the application due?


    Figure 10-8 Dual headings like these help people who are scanning rapidly with
    their eyes or their ears.


    # 3. Give statement headings to convey key messages


    When you write questions as headings, you play out both sides of the conversation.
    You put the site visitor on the page with you – the site visitor asks the question:
    you answer it. When you write statements as headings, you assume the site visitor
    has asked the question. You keep your site visitors in mind and talk directly
    to them, without putting them on the page with you.


    Statement headings work well in the same types of documents as questions. With
    statement headings, you are making your key messages'
  merge: -1
  img_proc: true
