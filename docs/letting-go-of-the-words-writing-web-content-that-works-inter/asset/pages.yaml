  md: 'First, let''s make it easier just to see by increasing the contrast between
    the background and the text.


    # White-naped Cranes Grus vipio


    White-naped Cranes in northeastern Mongolia, northeastern China, and adjacent
    areas of southeastern Russia.


    Breeding habitat includes shallow wetlands and wet meadows in broad river valleys,
    along lake edges, and in lowland steppe or mixed forest-steppe areas. White-naped
    Cranes nest, root, and feed in shallow wetlands and along wetland edges, foraging
    in adjacent grasslands or farmlands. During winter on mudflats, other wetlands
    and agricultural fields, White-naped Cranes are excellent diggers. The White-naped
    Crane is often found in the company of other crane species, including Red-crowned,
    Hooded, Demoiselle, and Eurasian Cranes.


    Mated pairs of cranes, including White-naped Cran, engage in union calling, which
    is a complex and extended series of coordinated calls. The birds in a specific
    posture, usually with their heads thrown back and beaks skyward during the display.
    In White-naped Cranes, the female initiates the display and utters two calls for
    each male call. The male always lifts his wings over his back during courtship
    all while the female keeps her wings folded at her sides. All cranes in dancing
    exhibit various courtship behavior such as bowing, jumping, running, stick or
    tossing, and wing flapping. Dancing can occur at any age and is commonly associated
    with courtship, however, it is generally believed to be a normal part of motor
