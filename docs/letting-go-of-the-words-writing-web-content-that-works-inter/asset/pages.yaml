    # 5. Beware of false bottoms


    You don''t control how much of your web page any site visitor is looking at. What
    they see depends on their monitor size, screen resolution, and the size of the
    window they have open.


    And over and over in usability, I have seen people by a horizontal line or a block
    of space at the bottom of their screen. Even if the scroll bar shows there''s
    much more, the horizontal line — and even more a block of space — seems to be
    sending overwhelms the message of the scroll bar. For example, the Franklin Institute
    page in Figure 7-11 is likely to lead many people to conclude the site has no
    search function.'
