    # 5. Use noun and phrase headings sparsely


    I see a lot of nouns as headings. They work sometimes; but more often than not,
    they don''t work because visitors who know the nouns, don''t connect to the nouns,
    don''t give the same meaning the web writer did. Nouns as headings often don''t
    help either the writer or the visitor understand the flow of the writing - why
    one section comes before or after another section.


    Nouns labels; they aren''t conversational. Unlike sentences, state-ments and action
    phrases, which provide context and some explanation, a noun has to carry all the
    meaning of the heading in a single word.


    Occasionally, labels are all needed on a web page. For example, Figure 10-11 shows
    an eye-tracking picture of one person looking for tax forms'
