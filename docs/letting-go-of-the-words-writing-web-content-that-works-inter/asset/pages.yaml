- pgno: 282
  md: '# INTERLUDE Legal Information Can Be Understandable, Too


    Legal information abound on the Internet – and in intranets and extrans. Many
    websites need a page about privacy policies. Many include terms of use. Some sites
    focus on legal issues and legal documents. Letting go of the words and writing
    in plain language is as applicable to legal information as to other web content.


    Information can be legally accurate, legally sufficient, and also clear. In fact,
    these attributes support each other, and many sites now strive to write their
    legal pages in clear, simple language.


    The typical problems in legal information online can be solved without compromising
    the legal standing of the information. These problems include:


    +   - text in a small, scrollable box in small type that can''t be enlarged

    - no printer-friendly option; printing cuts off the right side of the page

    - headings that use technical computer terms, not site visitors'' language

    - technical language, clearer statements are possible

    - unnecessary, archaic legal language

    - lots of the writing problems that we saw in Chapter 8


    Ironically, some web sites have poor headings followed by good writing in their
    legal information while others have good headings followed by poor writing. Let''s
    put the good headings and good writing together to have legal information that
    works for both your site visitors and your organization''s lawyers.


    # Make the information legible


    You may think, “no one reads the legal stuff anyway, so it doesn''t matter what
    we do," but that violates the spirit and the letter of the requirement that you
    provide information about terms of use or about privacy. Instead of burying information
    in a small box that people have to scroll through, give people a link to a full
    page where they can enlarge the type if they need to.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Make sure your legal information prints well


    It surprises me that sites offer printer-friendly options for most of their information
    but not do the same on the web pages with their use or privacy policies. Why not?
    Legal information is important. People may want to print it.


    Remember that you may have site visitors in many countries and that outside of
    the United States many print on A4 paper, which is longer and narrower than the
    8½ by 11 inch paper that is the U. S. standard. Remember that your site must print
    from many different computer configurations, including old operating systems and
    browsers.


    # Use site visitors’ words in your headings


    Clear headings improve (and do not compromise) the legality of legal information.
    You can have questions or statements as headings in legal information; they are
    just as legal as noun-based headings.


    > Compare the headings in Figure Interlude 2-1 from the International Heraldic
    Tribunal and Figure Interlude 2-2 from Gap. Which set is more inviting? Which
    better matches would you want to know about a company’s privacy policies?


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_283_0.png)


    # Privacy & Cookies


    +   Log Files

    Cookies

    Newsletters

    Surveys & Contests


    Headings like "Log Files" are probably meaningless to most site visitors.


    ![](img/2774aacc39f0f1ea3471a505c8a54bcc_283_1.png)


    Figure Interlude 2-1 These headings don’t connect to the questions that most people
    have about a company’s privacy policies.


    www.ihi.com'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Avoid technical language


    What kind of information does gap.com collect?

    How does gap.com use my information?

    Does gap.com share my information with third parties?

    How do I access my information? How do I change or delete my information?

    How do I exercise my choices about receiving promotional communications?

    How does gap.com protect kids'' privacy?

    What are cookies? How does gap.com use cookies on its site?

    How do I know my order is secure?

    What about links to other websites and services?


    These are likely to be the site visitors have about your privacy policies.


    Many people won''t understand "third parties." The heading might just stop after
    "information."


    Some of these could be said more simply. "How do I exercise..." might be better
    as "How can I choose type of emails you send me?"


    Question headings are acceptable in legal information.


    Figure Interlude 2-2 These headings do a much better job of getting site visitors
    to the information they are looking for.

    www.gap.com


    # Avoid technical language


    Technical jargon isn''t needed to make information legal.


    +   - We collect information to analyze our traffic patterns.


    +   - We gather information about how visitors navigate through our site by using
    clickstream data.


    +   - We collect information to understand how people use our web site.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Avoid archaic legal language


    Many words and phrases that we find in legal information in English just seem
    to shout "This is legal stuff. You won''t understand it." Phrases like "to wit,"
    "the said example," and "heretofore" were plain language hundreds of years ago
    for people – then actually. Language changes over time. Words come into the language.
    Words leave the language. Those – and many other "legalisms" – have left our everyday
    language. We see those words is not easy for your site visitors. Leave them out
    or replace them with common English words.


    For more on writing legal information- clearly, see www.plainlanguage.gov.


    Figure Interlude 2-3 shows part of a list of words to avoid from the U. S. Federal
    Register''s Drafting Legal Documents.


    For example, the sentence with "pursuant to" and "hereinafter" in Figure Interlude
    2-4 is not necessary. Most web sites (from Italy and from other countries) don''t
    cite the law in their privacy policies.'
  merge: -1
