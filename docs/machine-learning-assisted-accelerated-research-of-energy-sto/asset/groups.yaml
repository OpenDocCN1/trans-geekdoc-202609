    图1. 本工作中用于储能性能的机器学习工作流。


    机器学习（ML）作为人工智能的一个分支，近年来在材料科学家中引起了日益关注。16–18 这种关注度的激增很大程度上归功于ML从数据集中提取有价值见解并自主改进其计算模型的能力，从而产生可显著推动材料科学领域发展的可靠结果。19
    对于材料性质预测，ML方法利用材料组成、基本元素性质或结构参数作为输入（x），将感兴趣的性质作为输出（Y），这相当于构建Y = f(x)的函数形式。20 使用训练有素的ML模型可以节省试错方法带来的时间和人力成本，加速新材料的发现，并揭示性能、组成和结构之间的潜在关系。21
    大多数已发表的工作涉及将ML方法与现有材料数据库22–24和第一性原理计算相结合，以预测材料的固有性质。25–30 然而，将ML方法与实验相结合为优化实验过程、探索物理机制以及更有效地加速新材料研究提供了一条途径。例如，Qiao等人提出了一种结合ML和有限元法（FEM）的框架，以优化复杂陶瓷零件的注塑成型工艺。31
    为了确定铁电材料最重要的描述符，He等人在包括无铅、含铅陶瓷和反铁电体在内的不同材料体系中采用了回归和分类学习，然后从46个决定铁电性的潜在描述符中筛选出三个描述符。32
    Yuan等人提出了ML自适应设计策略，以寻找具有增强储能密度或电致应变的基于BaTiO3的多组分固溶体，显著减少了识别具有更高Wrec或电致应变化合物所需的实验迭代次数。33,34
    在本工作中，提出了一种结合三种特征构建策略的ML方法，利用涵盖材料组成、表征性能和烧结工艺参数的数据构建回归模型，以预测BT-BMO陶瓷的Wrec和η。开展了系统而全面的比较分析，以严格评估这些模型的性能，并确定回归任务中最有效的策略和模型。关键特征采用多步选择方法（包括Pearson相关矩阵、重要性分析和最佳子集方法）进行严格评估。通过这些方法，在不牺牲精度的前提下降低了特征空间的维度，从而提高了模型训练的效率。此外，通过采用Shapley增量解释（SHAP）方法35，增强了模型的透明度和可理解性，揭示了模型输入和输出之间的关系，这对于理解模型的决策过程和解释结果至关重要。此外，进行了实验合成以验证模型的预测能力，证实了该方法的可靠性和实际适用性。我们的研究将ML技术与实际应用相结合，确保对BT-BMO陶瓷中Wrec和η进行稳健、可解释和可靠的估计，为实际实验场景提供有价值的见解。


    ### 实验部分


    一般来说，可以通过使用ML算法的代理模型（f）建立材料特征（x_i）与目标属性（y）之间的关系，可表示为y = f(x_i)。图1说明了用于预测储能性能的ML模型的工作流程，包括数据收集、特征构建与选择、模型建立与评估、模型解释和实验验证。


