    BT-BMO 的开发。


    ## 结论


    在本研究中，开发了结合不同特征构建策略的 ML 模型，用于预测 BT-BMO 材料体系的储能密度和效率，从而使我们能够探索材料组成、相关性能、烧结参数与储能性能之间复杂的关系。通过严谨分析，比较了用于预测
    BT-BMO 陶瓷 Wrec'' 和 η'' 的不同特征构建策略，结果表明，包含多维有用信息的特征能使机器学习模型实现更优性能。基于策略 III 建立的 Wrec''
    GBR 回归模型和 η'' LGBM 回归模型表现出高准确性。为了增强结果的可信度，我们进行了十倍交叉验证。GBR Wrec'' 模型的十倍 r2 值为 0.974，LGBM
    η'' 模型的十倍 r2 值为 0.894。这表明这些模型具有出色的预测能力，证实了其在预测中的稳健性和可靠性。为了识别最重要的特征并进一步提高训练效率，分别使用包装法为
    Wrec'' 和 η'' 预测模型寻找了最优特征子集。引入了 SHAP 方法以增强模型的可解释性，结果总体上与我们的物理

