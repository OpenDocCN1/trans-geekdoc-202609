    ## 机器学习辅助的BaTiO₃–BiMeO₃陶瓷储能性能加速研究


    Jian Liu, Peifeng Xiong, Changjiao Li, Hua Hao*, and Hanxing Liu*


    ### 摘要

    具有优异储能性能的介电材料的探索一直是材料科学领域的研究热点。开发一种能够准确预测陶瓷储能特性的技术方法，将显著加速储能材料研究的进程。在本研究中，采用机器学习方法，旨在准确预测BaTiO3–BiMeO3（BT-BMO）铁电陶瓷的储能密度（Wrec）和储能效率（η）。最初，通过查阅相关已发表文献，建立了BT-BMO块体陶瓷储能性能的数据集。基于组分元素的理化特性、相关属性信息及烧结工艺参数，构建了三种不同的特征向量空间。随后，构建了多种机器学习算法模型来训练和预测Wrec和η。对于储能密度的预测，GBR模型的10倍交叉验证决定系数（r²）和均方根误差（RMSE）分别为0.974和0.142。对于储能效率的预测，LGBM模型的10倍交叉验证r²和RMSE分别为0.894和0.068。为增强模型的可解释性，引入了Shapley增量解释方法，揭示并简要分析了影响目标性能的重要特征。最后，对未包含在数据集中的xBaTiO3–(1
    – x)Bi(Zn2/3Ta1/3)O3材料体系进行了实验合成和测试。实验结果发现与模型预测接近，从而验证了该方法的有效性。本研究提供了一种新方法，可加速具有优异储能性能的介电材料的开发。


    ![](img/156bcf868020d5f996268c9ad3226597_0_0.png)


    ### 关键词

    机器学习, BaTiO3–BiMeO3, 储能性能


    ### 引言


    作为经典的储能电子器件，介电陶瓷电容器因其高功率密度、快速充放电速率和高热稳定性而被广泛研究。1–5 然而，相对较低的储能密度限制了它们的应用。考虑到铅基陶瓷的环境问题，开发具有优异储能性能的无铅陶瓷是一个极具重要意义的问题。已知，介电材料的总能量密度（W）、可回收储能密度（Wrec）和效率（η）可通过极化-电场（P-E）滞后回线计算。6
    目前，线性介电体（LDs）、铁电体（FEs）、反铁电体（AFEs）和弛豫铁电体（RFEs）正在积极研究用于储能应用。7–11 在这些材料中，RFEs是理想的储能材料，具有高最大极化（Pmax）、中等击穿强度（Eb）和低剩余极化（Pr）。基于BaTiO3的RFE陶瓷是无铅储能介电体的主导分支之一。被公认为“弱耦合弛豫体”12的BaTiO3–BiMeO3（BT-BMO）[Me
    = Sc3+, (Mg1/2Ti1/2)3+, (Ni2/3Nb1/3)3+等]陶瓷通常表现出纤细的P-E回线，具有可忽略的Pr和高η。有报道指出，引入BMO有三个优势：（1）它降低烧结温度，抑制晶粒生长，并提高密度，从而增加材料的Eb；（2）它有助于形成极性纳米区域，增强基于BT的陶瓷的弛豫行为，从而降低其Pr；（3）Bi
    6s和O 2p轨道的杂化可以增加材料的Pmax。13–15 已广泛承认，引入适当的BMO可以增强基于BT的陶瓷的储能性能。然而，BMO组成有众多可能的元素组合，而且掺杂含量和加工参数肯定会影响最终的储能性能。通过传统的试错方法寻找合适的材料体系是一个巨大的挑战。


