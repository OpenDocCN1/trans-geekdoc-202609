    ，但当使用超过 7 个特征时，10 倍交叉验证 RMSE 会略微增加。为更好地展示不同特征子集之间的性能差异，进一步计算了不同特征子集的 10 倍交叉验证
    r² 值，并发现 4 元组到 8 元组特征集的 r² 值也呈现小幅波动；r² 值列于表 S5。为增强模型的可解释性，应在不显著影响模型精度的前提下尽可能降低特征空间的维度。因此，为后续研究选择了最佳
    4 元组特征子集。该最优 4 元组特征子集具体包括 E、ΔP、AM 和 IE。


    ### 储能效率回归模型


    用于预测储能密度的相同方法和步骤也应用于预测储能效率。六种采用不同策略的 η'' 回归模型的评估指标如图 6a–c 和表 4 所示。在此任务中，线性模型和
    SVR 模型的性能不尽理想，而 LGBM 模型表现出较好的可预测性。在策略 III 中，LGBM 模型的 r² 分数为 0.901。策略 III 的所有六个模型均优于策略
    I 和策略 II，表明通过引入实验参数相关特征可以提升模型性能。各策略中最佳模型在训练和测试上的拟合性能如图 6d–f 所示。从图中可以看出，在高值区域，预测值与测量值较为接近，而在低值区域存在若干异常点，预测值与测量值之间存在一定差异。这可能归因于训练集中低
    η'' 区域的数据量有限。大多数研究倾向于报告高储能效率的数据，导致低 η'' 区域的数据样本匮乏。由于机器学习是一种数据驱动方法，数据质量显著影响模型精度。21
    数据分布不均在一定程度上导致模型在预测储能效率时表现不佳。同样，在这部分工作中，也进行了 10 倍交叉验证和超参数优化，以提供更可靠的性能评估。详细结果载于支持信息，表
    S6–S8。


    我们生成了所有包含 1–10 个特征的 15,913 个特征子集，并使用 LGBM 模型计算它们的 10 倍交叉验证 RMSE。如图 7 所示，随着特征数量的增加，性能起初得到提升，但当使用超过
    7 个特征时，观察到 RMSE 略微增加。还为 4 元组到 8 元组的不同特征子集计算了 10 倍交叉验证 r² 值，如表 S9 所示。研究发现，使用最优
    5 元组和 7 元组特征子集时预测性能最佳，而使用 4 元组子集时性能略有下降。遵循上述相同原则，我们为后续工作选择了最优五维特征子集。最佳 5 元组特征子集为“R、DV、VEN、GS
    和 ΔP”。


    ### 模型可解释性


    在机器学习和深度学习领域，模型可解释性是一个重要课题。尽管深度神经网络和集成模型等复杂模型在预测性能方面表现出色，但由于难以解释其决策过程，它们常被视为黑盒模型。65
    Shapley 加法解释 (SHAP) 是一种旨在解决此问题的工具，通过分配特征重要性值来解释模型输出。SHAP 的核心概念源于合作博弈论中的夏普利值，用于公平分配合作中多个参与者带来的收益。35
    SHAP 方法将这一概念引入机器学习模型的解释中，以计算每个特征对模型预测结果的贡献。在本工作中，采用 SHAP 方法来解释 W_rec 和 η'' 的回归模型，从而实现对特征对目标属性影响的可视化和理解。图
    8a 和 8b 分别展示了 W_rec 和 η'' 最佳特征子集回归模型的 SHAP 蜂群摘要图。每个点对应数据集中的一个化合物，更深的红色对应更高的特征值，而更深的蓝色则表示更低的特征值。SHAP
    值使我们能够了解每个特征对模型预测结果的具体贡献。当特征值的 SHAP 值为正时，意味着该特征值对模型目标属性的预测有正面影响，反之亦然。


