    Figure 1. Workflow of machine learning for energy storage properties in this work.


    Machine learning (ML), as a branch of artificial intelligence, has attracted mounting
    attention among materials scientists in recent years.16–18 This surge in attention
    is largely due to ML’s capacity to distill valuable insights from data sets and
    autonomously refine its computational models, thereby yielding reliable results
    that can significantly advance the field of materials science.19 For predicting
    material properties, ML methods utilize the material composition, fundamental
    element properties, or structural parameter as input (x) and the properties of
    interest as output (Y), which is equivalent to building a functional form of Y
    = f(x).20 Using a well-trained ML model can save the time and labor costs incurred
    by the trial-and-error approach, accelerate the discovery of new materials, and
    reveal the underlying relationships between properties, composition, and structure.21
    Most published works involve combining ML methods with existing material databases22–24
    and first-principles calculations to predict the intrinsic properties of materials.25–30
    However, combining ML approaches with experiments provides a pathway for optimizing
    experimental processes, exploring physical mechanisms, and accelerating the research
    of novel materials more effectively. For instance, a framework combining ML and
    the finite element method (FEM) was proposed by Qiao et al. to optimize the injection
    molding process of complex ceramic parts.31 To identify the most important descriptors
    for ferroelectric materials, He et al. adopted regression and classification learning
    in different material systems including lead-free, lead-containing ceramics, and
    antiferroelectrics and then screened out three descriptors from 46 potential descriptors
    determining ferroelectricity.32 Yuan et al. proposed ML adaptive design strategies
    to find BaTiO3-based multicomponent solid solutions with enhanced energy storage
    density or electrostrain, significantly reducing the required experimental iterations
    for identifying compounds with higher Wrec or electrostrain.33,34 In this work,
    an ML approach combined with three strategies for feature construction is devised,
    utilizing data encompassing material composition, characterization properties,
    and sintering process parameters to build regression models to predict Wrec and
    η of BT-BMO ceramics. A systematic and comprehensive comparative analysis is undertaken
    to rigorously assess the performance of these models and


    identify the most effective strategy and model for regression tasks. The key features
    are subjected to rigorous evaluation employing a multistep selection method, including
    the Pearson correlation matrix, importance analysis, and the best subset method.
    Through these methods, the dimensionality of the feature space is reduced without
    sacrificing accuracy, thus enhancing the efficiency of model training. Additionally,
    the transparency and comprehensibility of the model were augmented by employing
    the Shapley additive explanation (SHAP) method,35 revealing the relationships
    between model inputs and outputs, which is critical for understanding the model’s
    decision-making process and interpreting the results. Furthermore, an experimental
    synthesis is performed to validate the predictive capabilities of the models,
    confirming the reliability and practical applicability of the method. Our research
    integrates ML techniques with a practical application, ensuring robust, interpretable,
    and reliable estimations of Wrec and η in BT-BMO ceramics, providing valuable
    insights applicable to actual experimental scenarios.


