    图 8. 基于 (a) 7 元组子集 GBR W_rec'' 蜂群回归模型和 (b) 7 元组子集 LGBM η'' 回归模型的 SHAP 蜂群摘要图。(c)
    GBR W_rec'' 模型的 E 和 ΔP SHAP 依赖图。(d) LGBM η'' 模型的 DV 和 R SHAP 依赖图。(e) GBR W_rec''
    模型的 ΔP 值 SHAP 散点图。(f) LGBM η'' 模型的 R 值 SHAP 散点图。


    (1 - x)Bi(Zn2/3Ta1/3)O3 (BT-BZT) 陶瓷已合成并表征（实验详情见支持信息）。在我们的数据集中，一些数据涉及将 Nb5+ 与其他离子一起复合掺入
    BaTiO3 的 Ti 位点。值得注意的是，Ta5+ 与 Nb5+ 具有相同的价态和离子半径（0.64 Å），但关于弛豫铁电陶瓷材料储能性能的报告有限。与
    Nb2O5（≈3.4 eV）相比，Ta2O5 具有更宽的带隙（≈4 eV），可以有效减少漏电流和能量损失，从而提高击穿场强和储能效率。44 数据集中涉及 Nb5+
    离子的大部分数据涉及其与 Zn2+ 的组合，例如 Zn2/3Nb1/3。当时，对已发表文献的检索未找到任何关于 xBaTiO3-(1 - x)Bi(Zn2/3Ta1/3)O3
    的相关数据。因此，选择了 BT-BZT 材料体系进行实验验证。将模型的预测输出与实际实验结果进行比较，以评估模型的有效性。图 9a,b 描绘了 BT-BZT
    陶瓷在 100 kV/cm 和最大电场（Eb）下的单极 P–E 回线。与其他 BT-BMO 材料体系类似，随着 BZT 的引入，P–E 回线变得纤细，呈现材料铁电性能从标准铁电向弛豫型转变的特性。W_rec''
    和 η'' 的预测结果经过数学变换以获得预测的 W_rec 和 η。不同电场下的预测输出和实际结果的比较如图 9c,d 所示，并列于表 5。模型对 Eb 表现出更高的预测精度，因为数据集中大部分数据是在


