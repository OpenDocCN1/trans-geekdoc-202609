    | XGB | 0.879 | 0.045 | 0.081 |

    | LGBM | 0.901 | 0.038 | 0.074 |


    ![](img/156bcf868020d5f996268c9ad3226597_6_1.png)


    图 7. 基于包含 1–10 个特征的所有可能子集的 LGBM 模型的十倍交叉验证 RMSE。


    从图 8a 可以观察到，影响 W_rec′ 预测模型的两个最重要特征是 E 和 ΔP，它们都是衡量电容器储能性能的重要参数。随着它们的值增大，会得到更大的
    W_rec′，这与我们的物理知识一致。图 8c,e 可视化了 E 值和 ΔP 值的趋势，以及相应的 SHAP 值。可以观察到，随着 E 值增大，ΔP 值也增大，同样，E
    的 SHAP 值也增大。当 E 值超过约 120 时，相应的 SHAP 值均为正，表明更高的施加电场更有利于实现更高的储能密度。当 ΔP 值超过 15 时，大部分相应的
    SHAP 值也为正，表明更大的 ΔP 值更可能导致更高的储能密度。


    从图 8b 可以观察到，影响 η′ 预测模型的两个最重要特征是 DV 和 R。为了更好地可视化特征与 SHAP 值之间的关系，为 LGBM η′ 模型生成了
    DV 和 R 的 SHAP 依赖图，如图 8d 所示。可以观察到，当 DV 值超过 1.81 时，倾向于使储能效率朝较低值方向变化。这意味着，为了获得具有高储能效率的基于
    BaTiO3 的陶瓷材料，有必要将价电子距离的值控制在 1.81 以下。如图 8f 所示，当离子半径的值超过 2.55 时，也会对 η′ 模型预测产生负面影响。


