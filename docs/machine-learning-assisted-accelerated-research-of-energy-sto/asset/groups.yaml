    knowledge. Using this method, we have identified the key features that influenced
    the models and conducted a brief analysis. To verify the feasibility of our method,
    the experimental validation was conducted by preparing the xBaTiO3-(1 − x)Bi(Zn2/3Ti1/3)O3
