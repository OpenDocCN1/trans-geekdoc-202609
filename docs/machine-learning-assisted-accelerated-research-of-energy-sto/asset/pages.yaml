    yet there are limited reports on the energy storage properties of relaxor ferroelectric
    ceramic materials. Compared to Nb2O5 (≈3.4 eV), Ta2O5 possesses a wider band gap
    (≈4 eV), which can effectively reduce leakage current and energy loss, thereby
    enhancing the breakdown field strength and energy storage efficiency.44 The majority
    of the data in the data set that pertain to Nb5+ ions involve its combination
