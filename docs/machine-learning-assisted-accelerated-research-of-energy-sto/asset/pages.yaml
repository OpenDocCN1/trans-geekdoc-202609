    To evaluate the performance of the regression model, the common statistical metrics
    including the coefficient of determination (r²), mean absolute error (MAE), and
    root-mean-squared error (RMSE) are used in this study, defined by eqs 6–8, respectively.


    \( r^2 = 1 - \frac{\sum_{i=1}^{n} (\hat{y}_i - y_i)^2}{\sum_{i=1}^{n} (y_i - \bar{y})^2}
    \) (6)


    \( \text{MAE} = \frac{1}{n} \sum_{i=1}^{n} |\hat{y}_i - y_i| \) (7)


    \( \text{RMSE} = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (\hat{y}_i - y_i)^2} \) (8)


    where n, y_i, \(\hat{y}_i\), and \(\bar{y}\) are the number of observations in
    the data set, the actual value, the predicted value, and the mean of actual values,
    respectively. The r² value ranges between 0 and 1, with a closer proximity to
    1 indicating higher model accuracy. The MAE and RMSE represent the difference
    between the predicted value and the actual value, and the near-zero values of
    MAE and RMSE indicate the agreement of prediction and measurement.


