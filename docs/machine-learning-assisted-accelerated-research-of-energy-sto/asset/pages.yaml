    From Figure 8a, it can be observed that the two most important features affecting
    the W_rec′ prediction model are E and ΔP, both of which are important parameters
    for measuring the energy storage performance of capacitors. As their values increase,
    a larger W_rec′ is obtained, which is consistent with our physical knowledge.
    Figure 8c,e visualizes the tendency of E values and ΔP values, as well as the
    corresponding SHAP values. It can be observed that as E values increase, ΔP values
    also increase, and similarly, the SHAP values of E also increase. When E values
    exceed approximately 120, the corresponding SHAP values are all positive, indicating
    that higher applied


    electric fields are more conducive to achieving higher energy storage densities.
    When ΔP values exceed 15, most of the corresponding SHAP values are also positive,
    suggesting that larger ΔP values are more likely to result in higher energy storage
    densities.


    From Figure 8b, it can be observed that the two most important features affecting
    the η′ prediction model are DV and R. To better visualize the relationship between
    features and SHAP values, a SHAP dependence plot of DV and R for the LGBM η′ model
    was generated, as shown in Figure 8d. It can be observed that when the value of
    DV exceeds 1.81, it tends to drive the energy storage efficiency toward lower
    values. This implies that to obtain BaTiO3-based ceramic materials with high energy
    storage efficiency, it is necessary to control the value of the valence electron
    distance to be less than 1.81. As can be seen from Figure 8f, when the value of
    the ionic radius exceeds 2.55, it will also exert a negative influence on the
    η′ model prediction.


