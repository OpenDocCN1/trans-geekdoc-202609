- pgno: 0
  md: '# Machine Learning-Assisted Accelerated Research of Energy Storage Properties
    of BaTiO₃–BiMeO₃ Ceramics


    Jian Liu, Peifeng Xiong, Changjiao Li, Hua Hao*, and Hanxing Liu*


    ABSTRACT: The exploration of dielectric materials with excellent energy storage
    properties has always been a research focus in the field of materials science.
    The development of a technical method that can accurately predict the energy storage
    characteristics of ceramics will significantly accelerate the pace of research
    into energy storage materials. In this research, a machine learning method was
    utilized with the aim of accurately predicting the energy storage density (Wrec)
    and energy storage efficiency (η) of BaTiO3–BiMeO3 (BT-BMO) ferroelectric ceramics.
    Initially, a data set was established on the energy storage properties of BT-BMO
    bulk ceramics by consulting relevant published literature. Three distinct feature
    vector spaces were constructed based on the physicochemical characteristics of
    constituent elements, related property information, and sintering process parameters.
    After that, multiple machine learning algorithm models were built to train and
    predict Wrec and η. For the prediction of energy storage density, the 10-fold
    cross-validation coefficient of determination (r2) and root-mean-squared error
    (RMSE) of the GBR model are 0.974 and 0.142, respectively. For the prediction
    of energy storage efficiency, the 10-fold cross-validation r2 and RMSE of the
    LGBM model are 0.894 and 0.068, respectively. To enhance the interpretability
    of the models, the Shapley additive explanation method was introduced, revealing
    and briefly analyzing the important features that influence the target performance.
    Finally, the material system of xBaTiO3–(1 – x)Bi(Zn2/3Ta1/3)O3, which was not
    included in the data set, was synthesized experimentally and tested. The experimental
    results were found to be close to the model''s predictions, thereby validating
    the effectiveness of the method. This study provides a new approach that could
    accelerate the development of dielectric materials with excellent energy storage
    properties.


    ![](img/156bcf868020d5f996268c9ad3226597_0_0.png)


    KEYWORDS: machine learning, BaTiO3–BiMeO3, energy storage properties


    # INTRODUCTION


    As classical energy storage electronic devices, dielectric ceramic capacitors
    have been widely studied due to their high power density, fast charge/discharge
    rate, and high thermal stability.1–5 However, the relatively low energy storage
    density restricts their applications. Considering environmental concerns of lead-based
    ceramics, the development of lead-free ceramics with excellent energy storage
    properties is an issue of great significance. As known, the total energy density
    (W), recoverable energy storage density (Wrec), and efficiency (η) of dielectric
    materials can be calculated by polarization–electric field (P–E) hysteresis loops.6
    At present, linear dielectrics (LDs), ferroelectrics (FEs), antiferroelectrics
    (AFEs), and relaxor ferroelectrics (RFEs) are actively researched for energy storage
    applications.7–11 Among these materials, RFEs are ideal for energy storage materials
    with high maximum polarization (Pmax), moderate breakdown strength (Eb), and low
    remnant polarization (Pr). BaTiO3-based RFE ceramics are one of the dominant branches
    of lead-free energy storage dielectrics. The BaTiO3–BiMeO3 (BT-BMO) [Me = Sc3+,
    (Mg1/2Ti1/2)3+, (Ni2/3Nb1/3)3+, etc.] ceramics recognized as a “weakly coupled
    relaxor”12 commonly exhibit slim P–E loops


    with negligible Pr and high η. It is reported that there are three advantages
    for BMO introduction: (1) it lowers the sintering temperature, inhibits grain
    growth, and improves density, thereby increasing Eb of materials; (2) it helps
    to form polar nanoregions, strengthening the relaxation behaviors of BT-based
    ceramics, consequently reducing their Pr; (3) the hybridization of Bi 6s and O
    2p orbitals can increase Pmax of materials.13–15 It has been widely acknowledged
    that introducing an appropriate BMO can enhance the energy storage performance
    of BT-based ceramics. Nevertheless, there are numerous possible element combinations
    for BMO composition, and also, the doping content and processing parameters will
    certainly affect the final energy storage performance. It is quite a challenge
    to find an appropriate material system by the traditional trial-and-error method.


