    # CONCLUSIONS


    In this research, ML models combined with different feature construction strategies
    were developed for predicting the energy storage density and efficiency of BT-BMO
    material systems, allowing us to explore the intricate relationships between material
    compositions, related properties, sintering parameters, and energy storage properties.
    Different feature construction strategies for predicting Wrec'' and η'' of BT-BMO
    ceramics were compared through rigorous analyses, and it


    turned out that features incorporating multidimensional useful information enable
    machine learning models to achieve superior performance. The establishment of
    the GBR regression model for Wrec'' and the LGBM regression model for η'' based
    on the strategy III exhibits high levels of accuracy. To enhance the credibility
    of the results, we have conducted a 10-fold cross-validation. The 10-fold r2 values
    for the GBR Wrec'' model is 0.974, and for the LGBM η'' model is 0.894. This demonstrates
    the outstanding predictive capability of these models, confirming their robustness
    and reliability in forecasting. To identify the most important features and further
    improve training efficiency, the wrapper method was used to find the optimal feature
    subsets for Wrec'' and η'' prediction models, respectively. The SHAP method was
    introduced to enhance the interpretability of the models, and the results were
    generally consistent with our physical'
