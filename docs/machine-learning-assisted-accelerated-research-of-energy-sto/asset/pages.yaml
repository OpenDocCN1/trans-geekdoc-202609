    # **Model Interpretability.**


    In the fields of machine learning and deep learning, model interpretability is
    an important topic. Although these complex models such as deep neural networks
    and ensemble models excel in predictive performance, they are often regarded as
    black box models due to the difficulty in explaining their decision-making processes.65
    The Shapley additive explanation (SHAP) is a tool designed to address this issue
    by allocating feature importance values to explain the model’s output. The core
    concept of SHAP originates from the Shapley value in cooperative game theory,
    which is used to fairly allocate the gains brought by multiple participants in
    a cooperation.35 The SHAP method introduces this concept into the interpretation
    of machine learning models to calculate the contribution of each feature to the
    model’s prediction results. In this work, the SHAP method is employed to interpret
    the regression models for W_rec and η'', enabling visualization and comprehension
    of the effects of features on the target properties. Figures 8a and 8b show the
    SHAP beeswarm summary plot of the best feature subset regression model for W_rec
    and η'', respectively. Each point corresponds to one compound in the data set,
    a deeper shade of red corresponds to a higher feature value, whereas a deeper
    shade of blue signifies a lower feature value. The SHAP values enable us to understand
    the specific contribution of each feature to the model’s prediction outcome. When
    the SHAP value of a feature value is positive, it means that the feature value
    has a positive impact on the prediction of the model’s target attribute, and vice
    versa.'
