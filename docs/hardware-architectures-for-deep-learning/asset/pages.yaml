    # 9.9 Policies for exploiting energy-accuracy trade-off in ICNN


    The iterative transformation of learning algorithm can be exploited to yield the
    highest accuracy while meeting deadlines or create an trade-off between computational
    complexity and accuracy. To this end, we investigate the following policies to
    explore the benefits of ICNN and its trade-offs in terms of computational complexity
    (thus energy consumption) and accuracy.


    # 9.9.1 Dynamic deadline (DD) policy for real-time applications


    Many real-time applications require fast and deadline-driven computations to operate
    safely and correctly. To speed up the CNN-based classifier, one could adapt more
    powerful resources and benefit from higher parallelism. However, solutions are
    extremely expensive in terms of hardware cost and energy requirements. ICNN, on
    the other hand, provides a cost and energy-effective solution for real-time applications.
    Each uCNN in CNN is able to produce a classification early exit upon reaching
    a scheduled deadline. For the deadline-driven applications, the ICNN classifier
    processes the image up until the uCNN iteration, which the scheduled deadline
    is reached, and subsequently a classification are made. Consequently, the accuracy
    of the detection and computational complexity is dependent on the deadline-budget
    and the number of iterations that can be completed within the scheduled deadline.
    Note that in this mode of operation, only FC layer(s) in the processed uCNN iteration
    are required to make a classification decision, and the FC layers in the previous
    iterations for availability of computation-time-budget is skipped. This is due
    to the fact that for the deadline-driven applications, we rely solely on the classification
    results from the last processed iteration.


    Algorithm 1 captures the implementation of DD policy. In this algorithm, $N$ marks
    the number of ICNN iterations. $uCNN_{CONV}(i, img)$ invokes the convolution layers
    in the $i$th uCNN with $img$ as input, returning Ofmaps from the last CNN layer
    ($O_{fu}$) and the elapsed time ($t_{CONV}$). The Ofmaps are concatenated with
    the Ofmaps of the previous iterations. Subsequently, $t_{CONV}$ is compared to
    the deadline, $t_D$, and if lower with a $t_{mrg}$ margin, the next uCNN is invoked.
    $t_{mrg}[i+1]$ accounts for the projected time of the next iteration of uCNN.
    Upon reaching the deadline, $uCNN_{FC}(i, Of)$ invokes the FC layers of the $i$th
    uCNN producing a vector of probabilities $P_r$, one for each of $lk$ layers.'
