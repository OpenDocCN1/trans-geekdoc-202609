    # 9.12 Conclusions


    In this chapter, an iterative architecture for processing CNN (ICNN) was introduced.
    As a case study, ICNN was used to break the large CNN network of AlexNet into
    a sequence of smaller networks (uCNN), each processing a subsample of the input
    image, providing the ability to terminate the classification early (when reaching
    a deadline in a real-time system or reaching a required classification accuracy
    in low-powers), or carry the classification to the next iteration (if the deadline
    in a real-time system is not reached, or classification accuracy threshold is
    not satisfied in a low-power system). ICNN enables us to explore a wide range
    of complexity versus trade-offs. To explore these trade-offs, a dynamic deadline-driven
    policy for real-time applications, a CAPP for parameter reduction and two hybrid
    pruning and TPs for simultaneous parameter and complexity reduction were introduced.
    Our simulation results show that with intelligent selection of the pruning andor
    TPs, ICNN reduces the average FLOP and parameter counts, and execution time over
    50K validation images in ImageNet database by more than 25%, 80% and 38%, with
    negligible accuracy loss. The reductions in the number of FLOP and parameter counts
    are directly translated to energy saving, motivating a power-aware CNN architecture.
    Moreover, the real-time systems could exploit the dynamic structure of the ICNN
    by reducing the execution time by up to 12× by trading off accuracy with execution
    time.


