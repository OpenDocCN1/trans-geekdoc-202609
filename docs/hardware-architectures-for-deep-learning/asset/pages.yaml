  md: '# Hardware architectures for deep learning


    low power, high throughput, and efficient memory bandwidth usage is critical to
    support large neural networks [2–7].


    In recent years, approximate computing has been considered the primary means of
    achieving such power efficiency/throughput improvement [5–7]. These methods take
    advantage of the fact that neural network is an approximate model in nature: the
    main idea is that when neural networks approximate the target algorithm rather
    than producing an exact result, arithmetic operations can relax the constraint
    of producing (and paying the latency and power costs of) exact full-precision
    results.


    In addition to approximation, a high degree of redundancy in arithmetic operations
    is another attractive property of neural networks which makes them amenable to
    computation reuse. This redundancy stems from the fact that in each round of neural
    network execution, a fixed set of input data and neuron weights are shared across
    many arithmetic operations. This feature increases the probability of finding
    repetitive arithmetic operations (which execute on the same operands) because
    many operations have already one operand in. The number of repeated operations
    can increase drastically if we consider two operations repetitive not only when
    two sets of operands match exactly, but also when they are close to be considered
    identical under a given degree of approximation.


    In this chapter, we show the power of computation reuse in reducing the power
    consumption of neural networks.


    Although computation reuse has been used in several previous low-power designs,
    our early study showed that the particular computation pattern of neural networks
    provides a unique opportunity for computation reuse to increase power efficiency
    considerably [8].


    To exploit the computation redundancy for reducing power consumption, CORN, the
    computation reuse-aware neural network accelerator is proposed. CORN eliminates
    computation redundancy by reusing the output of an arithmetic operation for subsequent
    operations with repetitive operands.


    Experimental results show that CORN can exploit the inherent computation redundancy
    and approximate nature of neural networks to reduce power consumption by 61% on
    average, compared with state-of-the-art low-power neural network accelerators.


    # 7.1 Motivation


    The most common form of neural networks consists of the multi-layer perceptron
    (MLP) model; an n-layer MLP consists of one input layer, n–2 hidden layers, and
    one output layer. All neurons in any given layer i receive the same set of inputs
    from layer i–1. Each neuron computes the dot product of the input and weight vectors
    and passes the result to an activation function (AF) to produce the final output.


    Multiplication operations account for the majority of the power consumption and
    latency of neural information processing. In an n-layer neural network with Ni
    neurons in layer i, the output of the xt neuron of layer i is sent to layer i+1
    and multiplied by the xt weight of all Ni+1 neurons at that layer, thereby is
    reused in Ni+1'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Computation reuse-aware accelerator 149


    different multiplications. If the xth weight of a neuron is equal or close to
    the xth weight of two or multiple (say $r$) neurons in that layer, one of them
    can perform the multiplication and share the result with the other $r$ neurons.


    In this case, one operand should be matched to allow computation reuse. This is
    the primary reason for higher computation reuse opportunity in neural networks,
    compared with other computational models, where two operands should be matched
    for computation reuse.


    A typical computation reuse mechanism is cache-based, in that it stores the operands
    of a new operation as the tag and index to look up the cache. CORN, however, do
    not rely on a caching mechanism; instead, it relies the offline information about
    the neural network structure to extract computation reuse form the MAC operations
    that are executing at the same cycle. In a prior work, we showed that most DSP
    applications can benefit from their coefficient-based computation pattern, in
    which one multiplication operand comes from a set of predefined coefficients,
    to reduce the cache size and lookup complexity [9].


    Also, since quantization and reducing the precision of numbers are commonly used
    techniques to degrade the cost of computations, using these methods can increase
    the chance of having repetitive weights. If instance, the weights are displayed
    in $K$ bits, the number of unique and non-repetitive weights is smaller than or
    equal to $2^K$, which enhances the efficiency of computation reuse approaches
    [10].


    The neural network characteristics of some applications are listed in Table 7.1.
    Table 7.2 shows the number of repetitive multiplications in several applications
    that are widely considered as neural network benchmarks. The table also shows
    the impact of approximation on the amount of redundant computation.


    For evaluation of computation reduction and accuracy, the 16-bit fixed-point values
    are applied by reducing the bit width of the fractional part of the numbers. As
    can be seen, the rate of redundant computation is considerable for these applications,
    and as expected, it increases with precision reduction. Due to the approximation
    property of neural networks, an acceptable-accuracy level is preserved under most
    of these reduced precisions. Accuracy is


