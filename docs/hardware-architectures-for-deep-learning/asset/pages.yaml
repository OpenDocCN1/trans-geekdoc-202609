  md: '# Chapter 10


    # Mixed-signal neuromorphic platform design for streaming biomedical signal processing


    Sandeep Pande1, Federico Corradi1, Jan Stuijt1, Siebreen Schaafsma1, and Francky
    Cathoor2,3


    Streaming biomedical signal processing platforms should offer complex real-time
    signal-processing capabilities at very low energy consumption. Low-power operation
    and compact size requirements ensure that these platforms can be employed in always-on
    wearable devices with realistic size and battery usage. The signalprocessing algorithms
    that can adapt in real time to individual patients will open new possibilities
    for the personalized health-care systems. Current biomedical signal processing
    systems lack this feature; whereas the neuromorphic computing paradigm is capable
    of offering this feature.


    This chapter presents the mixed-signal design approach for the design of neuromorphic
    platforms for the biomedical signal processing. The proposed approach combines
    algorithmic, architectural and circuit design concepts to offer a low-power neuromorphic
    platform for streaming biomedical signal processing. The platform employs state
    machines using spiking neurons (implemented on analog neuron circuits) and support
    vector machine (SVM) (implemented as software running on advanced RISC machine
    (ARM processor). A dynamic global synaptic communication network using the ultralow
