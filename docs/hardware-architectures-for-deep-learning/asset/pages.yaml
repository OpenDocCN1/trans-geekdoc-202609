  md: '# 122 Hardware architectures for deep learning


    # 6.3 Software approach for pruning


    # 6.3.1 Hard pruning


    Usually, it is believed in neural networks, weights with small magnitude contribute
    less comparing to the ones with large magnitude. Thus, most pruning approaches
    attempt to remove the small weights. Reference [11] addresses this process via
    the introduction of (hard) binary masks on top of weight tensors in the neural
    networks. By injecting the masks into the computational graph (during training),
    it sorts the weights in a layer by their absolute values and masks to zero the
    smallest magnitude until some desired sparsity level is reached. The back-propagated
    gradient will not flow through the weights where they are masked out in the forward
    pass. The final sparsity is achieved by carefully designed incremental sparsity
    training and is automated.


    Following the similar paradigm, Changpiny al. [12] apply binary masks to the weight
    tensors as well. However, such masks are channel-wise random instead of arbitrary
    locations, and the mask is predefined and remains unchanged during training.


    # 6.3.2 Soft pruning, structural sparsity, and hardware concern


    Comparing to hard pruning, soft pruning does not remove connections (weights).
    It, it prune the weight tensors via regularization, usually l1 regularization,
    which is a smooth approximation of l0 regularization. Han et al. [10] and [13]
    further pointed out that l2 regularization provides better sparse network within
    prune-retrain-prune scheme, despite that l1 regularization provides better train-prune
    accuracy. Meanwhile, structural concern is addressed by group sparsity. According
    to Wen et al. [14], sparsity regularization and connection pruning approaches,
    however, often produce nonconstructed random connectivity in DNN and thus, irregular
    memory access that adversely impacts practical acceleration in hardware platforms.
    And group lasso can provide preferred group sparsity for more efficient data access
    because group lasso can effectively zero out all weights in some groups [14].
    This is also successfully used in the RNNs [15].


    With the emergence of dedicated DNN processing platform, it is desired to propose
    sparsity that is compatible with specific hardware platform. Kang [16] propose
    a new pruning scheme reflecting the accelerator architectures, to achieve the
    same number of weights remain for each weight group (WG) corresponding to activation
    fetched simultaneously. Yu et al. [17] share the similar idea of customizing pruning
    to the underlying hardware by matching the pruned network to the data-parallel
    hardware organization, i.e., SIMD-aware pruning and node pruning.


    # 6.3.3 Questioning pruning


    Despite the merits of pruning in regards to its straightforward approach and performance
    guarantee (from the pretrained model), some works show that pruning is not'
  merge: -1
