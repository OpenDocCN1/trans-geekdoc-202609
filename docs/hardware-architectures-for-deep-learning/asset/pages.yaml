  md: '# Feedforward neural networks on massively parallel architectures


    # 3.10 Conclusion


    In this work, we demonstrated the predominant performance the Clos-based topologies
    in dealing with the multicast-based and broadcast traffic of NNs. We first showed
    that the synergy between the multicast-based multilayer communication of NNs and
    the Clos network makes this topology a proper selection for hardware implementation
    of NNs. Then, we presented ClosNN, a novel topology for NNs that modifies the
    banwidth-folded Clos. The customizations included expanding its bandwidth and
    removing its unnecessary connections with respect to the broadcast-based traffic
    of NNs. In our design, up to 128 cores can be connected by a baseline two-layered
    ClosNN. For larger structures, ClosNN can be scaled up in a modular fashion by
    connecting 128-node networks via higher levels of spine switches. The experimental
    results showed that ClosNN can offer higher throughput and lower latency than
    the mesh and the cutting edge Hierarchical topologies and can be considered an
    adaptable, performance-efficient, and scalable topology to construct large-scale
    NN accelerators.


