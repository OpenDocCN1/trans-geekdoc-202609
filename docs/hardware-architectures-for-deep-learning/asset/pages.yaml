- pgno: 335
  md: '# Hardware Architectures for Deep Learning


    This book presents and discusses innovative ideas in the design, modelling, implementation,
    and optimization of hardware platforms for neural networks.


    The rapid growth of server, desktop, and embedded applications based on deep learning
    has brought about a renaissance in interest in neural networks, with applications
    including image and speech processing, data analytics, healthcare monitoring,
    and IoT solutions. Efficient implementation of neural networks to support complex
    deep learning-based applications is a complex challenge for embedded and mobile
    computing platforms with limited computational/storage resources and a tight power
    budget. Even for cloud-scale systems it is critical to select the right hardware
    configuration based on the neural network complexity and system constraints in
    order to increase power- and performance-efficiency.


    Hardware Architectures for Deep Learning provides an overview of this new field,
    from principles to applications, for researchers, postgraduate students and engineers
    who work on learning-based services and hardware platforms.


    # About the Editors


    Masoud Daneshtalab is a tenured associate professor at Mälardalen University (MDH)
    in Sweden and an adjunct professor at Tallinn University of Technology (TalTech)
    in Estonia.


    Mehdi Modarresi is an assistant professor at the Department of Electrical and
    Computer Engineering, University of Tehran, Iran.'
