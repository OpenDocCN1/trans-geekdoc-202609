  md: '# Inverter-based memristive neuromorphic circuit 291


    a circuit. The write circuit has a limited precision which may reduce the accuracy
    of the network. In order to examine the effect of the limited write precision
    of memristors, we quantized the conductance of memristors with 4-bit precision.
    As Figure 11.14 demonstrates, the limited write precision of the memristors has
    a very small effect on the accuracy of the circuit.


    # 11.4.4.4 Combining ideal conditions


    Finally, we combined all of the previously mentioned nonlocal effects (process
    variation, limited write precision, and input noise), and measured the accuracy
    of the circuit. Figure 11.14 shows that even with considering all of these effects
    together, the accuracy of the circuit is still above 92%. Note, as mentioned earlier,
    the error of writing on memristors by employing the circuit proposed in [43] is
    below 1%. Hence, the impact of the memristor variability on the output accuracy
    of the network is negligible. Also, there are some algorithms (e.g., [54, 55])
    that could be used to decrease the effect of process variation not only in the
    memristors but also in the CMOS inverters. For example, in [55], the neurons (CMOS
    inverters) characteristics were extracted from the manufactured chip, and then
    the network weights of chip were adjusted based on the extracted information.
    Finally, to compensate the resistance shifting issue of the bias memristors, which
    is caused by their constant passing direction [56], the low-cost inline calibration
    scheme of [57] may be implemented in the programming interface.


    # 11.5 Conclusion


    In this chapter, we presented an ultra-low-power memristive neuromorphic circuit
    that may be deployed in IoT. We also proposed mixed-signal interfaces which could
    be efficiently integrated into the proposed neuromorphic circuit. The proposed
    interfaces that consisted of memristive DAC and ADC reduced the area and power
    consumption. The effectiveness of the proposed neuromorphic circuit was assessed
    under datasets from wearable sensors, air quality chemical sensors device, and
    several recognition and regression applications. The circuit level HSPICE simulations
    for the considered datasets showed that the proposed neuromorphic circuit with
    memristive crossbar and inverter-based neurons was on average 3 × 10³ times power
    efficient than its ASIC implementation counterpart in a 90-nm technology. We also
    investigated the effect of the memristor process variation and limited write precision
    on the circuit accuracy. The results revealed that the limited write accuracy
    had a small effect on the CA. Also, the classification accuracy of the circuit
    with a 20% memristor variation remained above 93%. In addition, the results of
    the HSPICE simulations of the proposed structures for ADC and DAC were 5, 267x
    and 278x smaller than those of the previously design method.'
