    # 1.4.4 CNN examples


    AlexNet is one of the well-known CNN models. It was introduced in 2012 and first
    to achieve a top-5 classification error rate of 15.4%. The network is made of
    five convolutional, Max-pooling, and dropout layers, and three fully connected
    layers. It applies ReLU for the nonlinearity functions. The network was designed
    for classification with 1,000 possible categories. AlexNet was trained on ImageNet
    data with about 15 million images by total of 22,000 categories.


