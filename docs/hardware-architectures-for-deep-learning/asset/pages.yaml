    # 8.9.1.2 Exploration strategy


    To choose optimum values of design variables, we perform design space exploration
    to estimate resource usage and runtime latency. We allow $Tn$ to vary as powers
    of two, $Tm$ takes intermediate values as well to improve DSP usage. Performance
    scales linearly with DSPs up to some power of two due to the nature of feature
    map dimensions used in CNNs, after which the gain is nominal. Designs that do
    not satisfy DSP and BRAM requirements of the FPGA board are rejected. We then
    check logic usage of designs in descending order of the highest performance and
    select the first one that satisfies the logic resource thresholds. This reduces
    the total exploration time.


