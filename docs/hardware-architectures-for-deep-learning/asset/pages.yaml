  md: '# CNN agnostic accelerator design


    for AlexNet. Authors in [14] achieve very high throughput for VGG as they optimize
    their architecture for only $3 \times 3$ filters. Additionally, they achieve good
    processing efficiency without any batching in FCLs, because VGG is highly compute.


    VGG has $20×$ more computation than AlexNet, whereas both have similar amount
    of FCL computations. Effect of this effect is also visible in FICaffe''s efficiency
    for VGG, but unlike [3], we achieve high efficiency without synthesizing RTL IPs.


    Authors in [4] propose to reduce bandwidth requirement for both CL and FCLs. These
    improvements can be attributed to use of Winograd Transformations for convolution,
    batching in FCLs and the assumption that all IFMs/OFMs for a layer can be transferred
    to on-chip machines before processing. Their approach is not automated nor scalable
    like FICaffe, as they manually fix intra-filter-parallelism and perform Winograd
    for only $3 \times 3$ filters. Also Gflop/s reported in [4] is not IEEE 754 compliant.


    Like FICaffe, authors in [6] also consider integration with Caffe but only report
    on AlexNet and VGG. Their main contribution is systematic analysis of input-major
    and weight-major choices for FCLs and is based on empirical modification to utilize
    model. Unfortunately, their PE efficiency is poor with batching and has very high
    latency/image. They leave a large gap between achievable performance as they use
    too intra-filter parallelism by unrolling filter size to $5 \times 5$. Finally,
    while the work presented in [5] does smaller filters of $1 \times 1$, do not report
    actual number of PEs and to the best of our knowledge do not achieve PE efficiency
    either. Notice that choice of FPGA impacts the final latency. A larger FPGA with
    a plethora of resource always yields a better performance. To compare different
    architectures, one may normalize the achieved latency by a available resource.


