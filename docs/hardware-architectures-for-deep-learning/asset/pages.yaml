- pgno: 18
  md: '# About the editors


    Masoud Daneshtalab is a tenured associate professor at Mälardalen University (MDH)
    in Sweden, an adjunct professor at Tallinn University of Technology (Tal-Tech)
    in Estonia, and sits on the board of directors of Euromicro. His research interests
    include interconnection networks, brain-like computing, and deep learning architectures.
    He has published over 300-refereed papers.


    Mehdi Modarresi is an assistant professor at the Department of Electrical and
    Computer Engineering, University of Tehran, Iran. He is the founder and director
    of the Parallel and Network-based Processing research laboratory at the University
    of Tehran, where he leads several industrial and research projects on deep learning-based
    embedded system design and implementation.'
