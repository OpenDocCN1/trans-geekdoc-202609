    # 6.4.4.1 Efficient inference engine


    Energy EIE is designed based on the observation that, on average, 90% of the computations
    in FC layers are ineffectual. FC layer can be considered a large MVM. EIE consists
    of multiple PEs, say $N$, each of them performing a MVM for some of the matrix
    rows. The rows are interleaved between PEs to achieve more balanced load distribution.
    Due to this way of work distribution, each PE computes $1/N$ of the resulting
    vector. Each PE stores its sub-matrix in a modified sparse column format for each
    column of the sub-matrix: (1) a vector of nonzero elements and (2) a vector of
    the distances between the elements in the first vector (up to 15). EIE compacts
    these two vectors for all the columns and put them together to make a larger vector
    containing pairs of nonzero values and distances. Since different columns have
    different numbers of nonzero elements, EIE stores another vector points to the
    beginning of each column in the large ensemble. If $p_j$ represents the beginning
    of column $j$, then $p_{j+1} - p_j$ implies the number of nonzero elements in
    this column.


    Using this format, EIE devised an architecture to perform just the effective computations.
    This architecture has two units. The central unit, CCU, that formats the input
    vector, and PEs that perform the computations (see Figure 6.9). CCU broadcasts
    nonzero input elements and their indices to each of the PEs. Each PE backlogs
    in their activation queue. If an element in the activation queue is indexed $j$,
    it must be multiplied to the beginning of each column of $j$. Every PE has an
    8B wide static random access memory (SRAM) that stores pairs of values and distances,
    as well as two pointer SRAMs that keep the pointers to the beginning and the end
    of each column''s pairs in the sparse matrix. Using these SRAMs, EIE performs
    its computations, as follows:


    +   1. It fetches the front element from the activation queue and its index, say
    $j$.

    2. It uses /j access pointer SRAM to retrieve the pointer to the beginning and
    the end of the elements of column $j$ in the sparse matrix SRAM.

    3. Using these pointers, it fetches one pair at a time, from sparse matrix SRAM,
    and multiplies the value with the activation fetched in the first step.

    4. Using the distance value in the fetched pair, EIE finds the appropriate accumulator
    and accumulates the multiplication result to it.

    5. Once all the computations are done, the accumulator values are sent to ReLU.


    EIE also improves efficiency by relying on low-precision quantization and weight
    sharing. When all of these optimizations are applied, EIE achieves 102 GOPs computation
    power for sparse FC layers, in 45 nm. This translates to three-fold TOPs computation
    power for uncompressed matrices.


    # 6.4.4.2 ZeNA


    ZeNA is a multi-cluster architecture with each cluster consisting of weight and
    activation SRAMs, multiple PEs, and an interconnect that connects the SRAMs and
    PEs together [30]. Each PE has its own local weight, activation, and partial sum
    buffer making ZeNA similar to Eiss in the data path for deep DNNs. However, ZeNA
    adds a few more items to enable zero skipping. each PE in ZeNA has'
