    Stratix V GX7 is a small-to-medium-sized FPGA with only 256 DSPs. Directly comparing
    the raw latency numbers with bigger chips does not give a clear idea of effectiveness
    of the FICaffe architecture. Therefore, in Table 8.6, we compare the latest published
    results for full AlexNet and VGG acceleration on this chip in [13]. We can see
    that FICaffe achieves more than 2\times better runtime on AlexNet and almost twice
