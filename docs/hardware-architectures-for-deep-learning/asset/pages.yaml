  md: '# 8.9.3 Architecture comparison


    FICaffe''s performance with state-of-the-art work on AlexNet and VGG Most of the
    previous works in related literature are throughput oriented and use batching
    to improve raw throughput numbers. In contrast, FICaffe optimizes the architecture
    for latency-sensitive applications and does not consider batching. While batching
    improves the throughput, it increases the latency/image. Therefore, for fairness,
    we also compare processing efficiency of PEs. Efficiency represents the percentage
    of runtime that a PE spends in performing arithmetic computations. It also normalizes
    the effects of underlying FPGA platform and the chip technology node helps compare
    the architecture on a level field. Efficiency is calculated as


    ```

    PE efficiency = \frac{Ops\ achieved /s/PE}{Throughput/#PEs MaxOps/PE/2\times freq}
    (8.27)

    ```


    Note that latency is not directly calculated from throughout. Only a lower bound
    on latency can be inferred from throughput numbers. Further, we intentionally
    do not compare performance density which is the number of operations done per
    DSP per cycle, because FICaffe does not take advantage of 2\times18 multiplications
    on a single Stratix V DSP. This is because Intel''s SDK version 16.0 (restrictions
    from Vendor BSP at that time) is not very effective at analyzing complex OpenCL
    code to use all multipliers per


