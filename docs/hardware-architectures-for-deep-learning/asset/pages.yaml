  md: '# Chapter 1


    # An introduction to artificial neural networks


    Ahmad Kalhor¹


    In this chapter, an introduction to neural networks (NNs) with an emphasis on
    classification and regression applications is presented. In this chapter, some
    preliminaries about natural and artificial neural networks (ANNs) are explained.
    Then, by giving initial concepts about classification and regression problems,
    appropriate overall structures of ANNs for such applications are explained. The
    simple structures of NNs and their limitations as well as more powerful multilayer
    and deep learning models are introduced in the next part of this chapter. Finally,
    convolutional NNs and some of their well-known developments are briefly explained.


    # 1.1 Introduction


    A conventional computing paradigm solves a problem by an algorithmic way, in which
    programs provide every step that had to be taken, in the form of deterministic
    algorithms, to carry out the tasks. In some domains, however, designing an explicit
    algorithm is not always possible (or is very difficult), particularly when system
    has to deal with situations and data that did not fit within the explicit parameters
    provided by the programmers (e.g., for recognizing emotions or answering new questions).
    Machine learning is a subset of artificial intelligence actually takes the way
    in which our brain solves these problems: learn to solve a problem by analyzing
    training examples. It trains a machine to perform a particular task using large
    amounts of data and routines that provide the ability to learn from the data.
    Deep learning is a subset of machine learning that uses DNNs to solve complex
    problems.


    A NN is a set of simple processing units, called neurons, that are arranged in
    multiple layers, through which a desired output result is generated from exogenous
    or stimulating inputs. Figure 1.1 shows a simple diagram of a NN.


    # 1.1.1 Natural NNs


    NNs have been emerged naturally in the body of animals to provide their perception
    from the environment and learn to take appropriate reactions against


