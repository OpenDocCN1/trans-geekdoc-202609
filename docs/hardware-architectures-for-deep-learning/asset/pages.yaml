    # 2.4 Conclusion


    Sequence learning is a broad field of research with many practical applications,
    from speech recognition to video classification. LSTM networks have been shown
    to be very effective to handle this special type of problems. However, implementing
    the inference for such applications can be quite challenging due to the computational
    complexity of LSTM. A pure CPU software-based implementation will have limited
    computational throughput and poor energy efficiency. While the performance of
    a software-based design may be acceptable for some applications, real-time or
    throughput-oriented applications should only rely on GPUs or hardware accelerators
    in order to get the required power/performance profiles. This chapter reviewed
    some recent proposals on hardware acceleration of RNNs. Due to the ever-increasing
    deployment of RNNs in the industry, there is a growing need for more power- and
    performance-efficient hardware accelerators.


