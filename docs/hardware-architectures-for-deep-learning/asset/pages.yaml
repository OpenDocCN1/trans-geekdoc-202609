- pgno: 105
  md: '# 80 Hardware architectures for deep learning


    speed demands. The computing requirement at a server or GPU cluster further implies
    high power and energy consumption. A promising method to overcome these shortcomings
    is designing specific hardware-based NNs to exploit the maximum degree of parallelism
    and achieve a significant reduction in processing time, power, and energy consumption.


    High computational complexity of large-scale NNs makes the conventional fixedpoint
    hardware implementations expensive, energy inefficient, and in many cases impractical
    with limited hardware resources. SC [1–3] has been recently used for lowarea and
    low-power implementation of CNNs [4–17]. This unconventional computing paradigm
    has the potential to enable fully parallel and scalable hardware design of CNNs.
    Multiplication, as an essential and costly operation in conventional fixed-point
    hardware designs of CNNs, can be implemented with simple standard AND gates in
    SC. Low-cost design of multiplication operations results in significant savings
    in hardware design of NNs. Redundant representation of data with long bit-streams
    further makes SC-based implementations of NNs tolerant to noise (i.e., bit-flips).


    Quality degradation, long processing time and energy consumption, however, are
    still the main barriers in efficient design of SC-based NNs. Random fluctuations
    in generating bit-streams and correlation between bit-streams results in approximate
    computations and quality loss in different layers of NNs. A long processing time
    is inevitable to produce acceptable results. This long processing leads to high
    energy consumption, which in most cases is higher than that of the corresponding
    conventional fixed-point binary design. Designing high accuracy energy-efficient
    SC-based NNs is still an open problem.


    Deterministic computations with stochastic bit-streams [18–20] have been recently
    introduced as an essential in the SC paradigm. By properly structuring bitstreams
    computation with SC logic can be performed deterministically. The results are
    completely accurate and the same as the results from the conventional binary designs.
    The operations must run for an exact number of cycles (i.e., the product of the
    length of input bit-streams) to guarantee producing accurate results. These methods
    were initially developed based on unary bit-streams (with first all 1s and then
    all 0s). The nature of unary-bitstreams, however, leads to a long processing time
    and so high energy consumption to produce acceptable results. These weaknesses
    the early unary bit-stream deterministic methods inefficient for applications
    that can tolerate some degrees of inaccuracy (e.g., image processing and NN designs).
    We developed a binary-unary deterministic method in [21] to mitigate the energy
    consumption issue of unary bit-stream-based designs. The method of [21] is not
    applicable to multivariate functions such as the multiplication operation.


    The early deterministic methods are revised in [22] by bringing randomization
    into bit-stream representation and replacing unary bit-streams with pseudorandom
    bit-streams. For a fixed accuracy level, by generating pseudorandom bit-streams,
    a lower processing time and a lower energy consumption were achieved to the unary
    stream-based deterministic methods. More recently, LD deterministic methods are
    proposed in [23] for fast-converging and energy-efficient processing of bit-streams
    with SC circuits.'
