    # 4.6 Experimental image database results


    We use MNIST, a standard image database for handwritten digit recognition, to
    train and test the NN. The database includes 10,000 testing and 60,000 training
    28 × 28 gray-scale images. We evaluated the efficiency of the proposed design
    by comparing it to a baseline 8-bit fixed-point implementation of the NN. Accuracy
    evaluation of both the proposed hybrid and also the fixed-baseline design was
    performed in MATLAB. Misclassification rate (one minus the classification accuracy)
    was measured for each design and multiplied by 100 to report the accuracy in percentage.
    We also implemented both designs using Verilog hardware description language for
    hardware cost comparisons. The Synopsis Design Compiler vH2013.12 is used to synthesize
    the implemented designs in 45 nm technology. The NN over the 60,000 training images
    using the 8-bit fixed-point binary design. In the inference step, we evaluate
    the performance of the NN with the 10,000 test images with the fixed-point binary
    and the proposed hybrid bit-stream-binary designs.


    For the hybrid approach, we implemented five design structures: (2–5) the proposed
    deterministic LD bit-stream-based designs with different parts of Sobol sequences
    as the required source in converting input data to bit-stream representation.
    The implemented structures only differ in the bit-stream generation part (converting
    input pixel intensities and kernel''s weights from binary to bit-stream representation)
    and the core logic to perform the multiplications and accumulations is the same
    in all structures.


    For the random bit-stream-based design, we use the MATLAB built-in random number
    generator to generate the random numbers for the bit-stream generation process.
    For the proposed deterministic LD bit-stream-based designs, we use four different
    combinations of the first four Sobol sequences from the MATLAB built-in Sobol
    sequence generator (Figure 4.3). Input test images and kernel''s weights are converted
    to their corresponding bit-stream representation by comparing them to the Sobol
    numbers from these four Sobol sequences.


