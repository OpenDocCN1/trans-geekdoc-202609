    Field-programmable gate array (FPGA) digital circuits have a large impact on the
    development of custom digital chips by enabling a designer to try design on easily
    configurable hardware. In fact, FPGAs contain programmable logic blocks that are
    based on a large number of gates and local memory, and connections between blocks
    are configurable. This reconfigurability makes it possible to realize parallel
    structures as SNNs in hardware [9–11]. The common feature of SNN architectures
    is that memory is distributed among massively parallel configurations of computational
    blocks: neurons and synapses. At present, current FPGA systems are capable of
    simulating up to 4k neurons in real time by multiplexed resources on the board
    (Virtex 6) as in [12], with the ultimate intent of simulating polychronous SNNs
    over spatiotemporal spike patterns. Another alternative to reconfigurable hardware
    for neural network is the use of custom programmable analog arrays. This approach
    is mainly pursued by a laboratory situated in Virginia. They successfully implemented
    a linear and nonlinear classifier based on a vector-matrix multiplication and
    a winner-take-all network [13]. The chip includes includes programmable amplifiers,
    adaptive filters, multipliers and gain-controlling circuits. Interestingly, the
    same approach has also applied in the field of prosthetics and audio signal processing.


    At the ETH Zürich, a research laboratory led by Prof. Giacomo Indiveri is investigating
    neuromorphic spiking networks in a low-power analog and mixed-signal implementation.
    The laboratory, among other achievements, successfully demonstrated robust learning
    mechanisms for the formation of associative memories in relatively small and configurable
    neuromorphic spiking hardware [14] that can also be used in the framework of deep
    neural networks [15]. However, these systems are still implementing a relatively
    small number of neurons (few thousands) [16] and the need of scaling up to large
    number of neurons is required to solve more complex tasks.


    In 2018, Intel Lab presented its first SNN hardware architecture implemented in
