  md: '# Hardware and software techniques for sparse deep neural networks 123


    an effective way to find efficient network structure. In more details, Liu et
    al. [18] made the following statements:


    +   1. Training a large, over-parameterized model is not necessary to obtain an
    efficient final model.

    2. Learned "important" weights of the large model are not necessarily useful for
    the small pruned model.

    3. The pruned architecture itself, rather than a set of inherited "important"
    weights, is what leads to the efficiency benefit in the final model, which suggests
    that some pruning algorithms could be seen as performing network architecture
    search.


    # 6.4 Hardware support for sparsity


    An efficient DNN accelerator design should deliver low latency and high throughput
    for both dense and optimized DNNs (both sparse and low precision). In addition,
    the accelerator''s performance should increase as the DNN gets more compressed
    (becomes more sparse). With these requirements in mind, we list some of the challenges
    and overheads in the design of a sparse DNN accelerator:


    +   * Support for sparsity increases the control logic overhead. In dense DNN
    accelerators, processing many elements (PEs) can share the same control signals
    as the operations are embarrassingly parallel. However, sparsity leads to variability
    in PE'' execution time. Therefore, each PE requires private control logic, since
    the PEs are independent to each other to some extent. In addition, in order to
    synchronize memory accesses and correctly reduce the results of PEs, some registers
    might be needed to store PE output.

    * Support for sparsity requires metadata overhead. To distinguish between zero
    and nonzero values, some additional metadata are required. The format of such
    metadata differs from one architecture to another. However, in some architectures,
    the metadata space is separate from the data space. Hence, the metadata space
    would be wasted during the execution of dense DNNs or even for low-precision DNNs.

    * Support for sparsity makes the data path more complex. In order to increase
    computation, we need to introduce some multiplexers to select the nonzero inputs
    to idle PEs, or the result of a PE to further, sparsity requires more registers
    in order to increase the efficiency. These overheads might be acceptable for floating-point
    or 16-bit fixed point PEs. However, this might translate to a much higher overhead
    for a low-precision PEs. Therefore, adopting sparsity seems less challenging for
    DNN accelerators for training than for inference, as training PE supports large
    floating-point units.


    In addition to the challenges, we should also look into the opportunities of sparsity
    methods. Figure 6.2 depicts the potential benefits of different types of sparsity
    for different layers of AlexNet [19]. As it is shown, on average half of the activations'
