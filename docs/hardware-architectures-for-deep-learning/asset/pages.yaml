    In [22], a method for training very low-precision (1-bit) neural networks is introduced.
    The so-called binary neural networks drastically reduce both memory and computational
    requirements for deployed models. With this model compression scheme, weights
    are constrained to values of +1 or –1 during training. Thus, inference computation
    includes only any addition addition and subtraction, which is simpler and more
    efficient to implement in hardware. The authors applied this technique to a three-layer
    feedforward network for MNIST classification and achieved 0.01% better prediction
    accuracy than that of a full-precision version of the model.


    In [23], an alternative approach for model binarization is proposed. This method
    constrains not only the network to binary values, but layer activations as well.
    This provides even more of an advantage for hardware implementation, as all computational
    operations involve only +1 or –1. By mapping –1 to 0, multiplyaccumulate operations
    can be replaced with XNOR and bit-count operations, which can be computed very
    quickly and efficiently in hardware. In [22], the authors applied this approach
    to a three-layer feedforward network for MNIST classification. This demonstrated
    only a 0.1% loss in prediction accuracy compared with that of the full-precision
    implementation of the model.


    Building upon previous works on model binarization, in [24] an algorithm loss-aware
    binarization is proposed. Unlike previous approaches, this algorithm directly
    minimizes training loss with respect to the binarized weights. The algorithm can
    be extended to binarizing both weights and activations using a simple sign function
    for binarizing activations. The authors experimented with a four-layer feedforward
    network for MNIST classification. Compared with the prediction accuracy of the
    full-precision version of the model, results showed a 0.01% improvement when using
    binary weights only. Unique to this work, a method for binarizing RNNs is proposed.
    An example LSTM model for text prediction is used to evaluate the method. Compared
