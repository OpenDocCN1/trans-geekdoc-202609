    The complexity/accuracy trade-off suggests that by setting high values for confidence
    thresholds, and thus higher FLOP count, the accuracy increases from T1 to T10.
    However, extensive exploration of a large set of variable TPs with ICNN yields
    the TP to be more of a Pareto optimization question, where increased accuracy
    can be achieved with lower FLOP count through intelligent tuning of the Dc values.
    instance, while the FLOP counts of T1 and T4 are significantly lower than T3 and
    T8, respectively, they yield higher accuracy.


    # 9.10.4 Context-aware pruning policy for parameter reduction


    # 9.10.4.1 Context-aware pruning policy for FC layer


    Figure 92(a) shows the overall accuracy and average parameter count for various
    FC layer pruning policies, while the table in Figure 92.2(b) captures the setting
    of the pruning policy (Pith) by listing the number of remaining classes after
    pruning the classes with low probability. The last bar shows the ICNN results
    when none of the classes are pruned in any of the iterations. P1–P8 are sorted
    based on their parameter count, with P1 having the lowest parameter count and
    P8 the highest.


    Figure 92 shows that by increasing the number of pruned classes (i.e., lower Pith)
    the accuracy drops; however, intelligent selection of the pruning policy yields
    reductions in the parameter count, with negligible accuracy loss. For instance,
    P4 yields a 17% reduction in the parameter count with negligible accuracy loss.
    It should be noted that all the images go through all the iterations in this scheme.
    Thus, the reduction in the FLOP count is due to the pruning of the last FC layer
    in each iteration.


    ![](img/e6e752b99eb1621488c89445a57e2a86_248_0.png)


    Figure 9.22 Pruning policies: (a) the accuracy and average parameter count for
    FC layers, (b) the table including the number of labels not pruned in previous
    iterations. (The first iteration uses all the 1,000 labels as there is no feedback
    from the previous iterations.)'
