    # 10.2.2 Biomedical signal processing challenges for ECG application


    ECG signals represent the electrical activity of heart, this electrical activity
    is recorded using the potential difference between a number of leads on the body.
    In hospitals, it is common to use 12 leads placed in a standard configuration,
    which provides spatiotemporal information about the heart''s activity in approximately
    three orthogonal directions; left-right, superior-inferior and anterior-posterior.
    Each of the 12 leads represents a particular orientation in space. This configuration
    gives a practical advantage to trained cardiologist, who are able to examine the
    pathophysiological processes underlying ECG traces. An ECG beat is composed of
    four complexes P, QRS, T and U. The P-wave indicates a contraction of the atrial
    rooms of the heart and it represents the depolarization of the left and right
    atrium. The QRS complex includes Q-wave, R-wave and S-wave. These three waves
    occur in a short time interval and depict the electrical impulse that quickly
    spreads through ventricles resulting in ventricular depolarization. In healthy
    adult patients, the duration of the QRS complex is usually around 0.06 and 0.1
    s. The T follows the QRS complex and implies ventricular depolarization. The T-wave
    is slightly asymmetric and the peak of the wave is shifted towards the end. When
    a T-wave occurs in the opposite direction, it is usually an indication of some
    sort of cardiac pathology. In, if a tiny wave occurs between the T and P-waves,
    it is referred to as the U-wave. However, the biological basis of the U-wave is
    still under investigation [18]. The shape and size of the complex varies according
    to the different leads from which the signal is being observed. Different features
    can then be extracted by different leads, and this makes the diagnosis of certain
    types of irregularities much easier to be detected from a particular lead. The
    majorities of arrhythmia-related diseases can be identified employing a modified
    two-lead (ML-II lead) configuration, which is also compatible with wearable devices
    mostly for its smaller form. Automated arrhythmia classification and detection
    systems are usually based on the two lead ML-II configuration and follow a few
    standards steps: (a) recording and storing the ECG, (b) filtering and preprocessing
    of the stored ECG, (c) segmentation of the various ECG complexes, (d) feature
    extraction and (e) classification. The learning of the features and the optimization
    of the various parameters of the classifier are usually carried off-line and no
    on-line adaptation or personalization is commonly exploited.


    In the specific case of ECG signal analysis for arrhythmia detection and classification,
    the second step is commonly carried out with wavelet transform, Kalman filtering
    or other signal-processing algorithms is based on reliable algorithms for the
    detection of the QRS complex [22,23]. After this segmentation stage, feature extraction
    can be achieved using one of the standard signal processing methods, which include
    filtering, embeddings and wrapper methods. Filter methods rely on the statistical
    properties of the signal and are based on correlations matrix or linear decomposition
    with independent-'
