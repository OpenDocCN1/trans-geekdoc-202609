  md: '# 166 Hardware architectures for deep learning


    # 8.3.4 Other operations


    Other operations in CNNs include using nonlinear activation on top of feature
    map, normalization, scaling, element-wise arithmetic and filter concatenation.
    Rectified Linear Unit (ReLU) function is a popular nonlinearity in CNNs for its
    effectiveness and simplicity. Krizhevsky et al. [9] proposed local response normalization
    (LRN), used along with ReLU, which has helped in alleviating vanishing problem.
    But since then, LRNs have fallen out of use and batch normalization is adopted
    with the next-generation of CNN architectures [20,21]. Therefore, we do not implement
    LRN and present results for AlexNet and GoogLeNet by skipping normalization operations.
    Apart from that, in recent architectures, filter concatenation has been used where
    OFMs from different branches of the network are concatenated to form IFM for the
    next layer. Finally, utility layers like element-wise addition and scaling are
    used to implement batch normalization and residual modules of ResNet.


    # 8.4 Optimizing parallelism sources


    The main factors that affect performance in FPGA designs are computation density
    and memory bandwidth. In OpenCL, this is exhibited by fully pipelined stall-free
    operation and translated into (1) number of multiply-accumulates (MACs) performed
    per cycle and (2) memory access stalls. The aim is to maximize the number of MAC
    operations performed every clock cycle without ever encountering memory stalls.
    We first introduce independent computations involved in convolution and explore
    specific techniques that have been studied in published literature. We derive
    conclusions and present our acceleration strategy in further sections.


    # 8.4.1 Identifying independent computations


    Same colored filters in Figure 8.2 (red and blue shades) represent one 3D convolution
    filter. All multiplications in such a 3D filter, which produces one OFM pixel,
    are independent and can be done in parallel. This is often referred to as intra-filter
    parallelism. Figure 8.3 shows all the loops involved in convolution where S denotes
    the filter stride. Intra-filter parallelism refers to simultaneous execution of
    iterations in Loops 4 and 5. Apart from that intra-channel OFM pixels can be computed
    by reusing the same weight parameters, multiplied and accumulated with different
    parts of IFMs. This is represented by simultaneous execution of iterations in
    Loops 2 and 3. Furthermore, interchannel OFM pixels can also be computed independently.
    IFM data can be potentially shared with the same pixel of a different OFM channel.
    This can be done by executing multiple iterations of Loop 1 in the same cycles.
    It is also possible to compute multiple layers in pipelined parallel fashion but
    has a large resource overhead and is generally not implemented. Therefore, the
    number of MACs/cycle depends on how many independent computations are done in
    parallel, while the memory system hierarchy used.'
