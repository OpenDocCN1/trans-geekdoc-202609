  md: '# Chapter 3


    # Feedforward neural networks on massively parallel architectures


    Reza Hojabr$^{1}$, Ahmad Khonsari$^{1,2}$, Mehdi Modarressi$^{1,2}$, and Masoud
    Daneshtalab$^{3}$


    The deployment of neural networks (NN) in modern computing systems has grown increasingly
    in recent years. The superior performance of NNs in implementing intelligent services
    has made them an efficient tool in various domains, ranging from pattern recognition
    in small intelligent handheld devices to big data analysis in large datacenters
    [1.2]. In addition to their classic applications, several prior work have shown
    that complex functions can be mimicked and replaced by NNs to speed up the computation
    at the cost of negligible inaccuracy in [3]


    Due to the complexity and high implementation cost of NNs, proper implementation
    of these compute-intensive algorithms entails a rethink of the neural processing
    platforms. Recently, customized hardware implementations of NNs have gained considerable
    attention in the semiconductor industry and this trend has led to the advent of
    efficient NN accelerators [4-6]. In the domain of smart embedded devices, emerging
    NN accelerators aim to adjust the area and power consumption subject to the limited
    area and power budget in embedded systems. On the other side, in large-scale datacenters,
    NN accelerators are required to run multiple instances of the network, which translates
    to processing millions of neurons, in parallel. As a result, software implementation
    of NNs (using GPU or CPU) is being replaced with hardware-based implementations
    using specialized accelerators.


    Motivated by the massive parallelism in the NN computations, hardware accelerators
    typically consist of multiple processing nodes to fully exploit this inherent
    parallelism efficiently. However, managing the large amount of data movements
    between the processing nodes is a major concern in designing NN hardware accelerators.
    The large amount of data movement, which results in a high inter-node traffic
    rate, stems from the computation model of NNs in the computation units, i.e.,
    neurons, are simple but are replicated in a large-scale structure, with each neuron
    having many connections to other neurons. To address the need for a parallel architecture


