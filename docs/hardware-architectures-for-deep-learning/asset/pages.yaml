  md: 'monitors, tracking devices, etc. This is achieved by equipping the physical
    objects with microcontrollers, communicational transceivers, and proper protocol
    stacks [1]. The IoT commonly relies on embedded sensors. In Figure 11.1, two possible
    approaches to send the sensory data to the client or IoT are illustrated [2,3].
    In the first approach, the raw sensory data (e.g., temperature, humidity, image
    pixels) is converted to digital form and sent to the client over the Internet.
    In the second approach, the sensory data is collected and processed in a local
    low-power processor and only summary (significant) data is transmitted over the
    Internet. While the first approach provides a more detailed information about
    the sensed environment, it is not suitable for applications where the energy and
    communication bandwidth are limited. The second approach is effective only in
    cases where the local processor has low-power (energy) consumption and can perform
    complex computational tasks (e.g., recognition).


    There are several paradigms to implement processors to be used as part of IoT
    devices. The promising architectures for IoT devices, neuromorphic processors
    have received much attention [4, 5]. Neuromorphic processors, which are energy
    efficient, high speed, and scalable, have shown a great propensity for processing
    complex tasks such as recognition, clustering, and classification. Also, neuromorphic
    circuits have tolerance to error and variability sources, which makes them efficient
    for de-v VLSI implementation [6]. In addition, by the learning capability of the
    neuromorphic circuits, it is possible to train a single multifunction sensor for
    different applications such as analyzing the combination of traffic, pollution,
    weather, and congestion sensory data [7]. The most popular neuromorphic architecture
    is the one based on the artificial neural networks (ANNs) [8]. There are two implementations
    for the ANNs which are analog and digital. The analog ANNs are often faster and
    more power efficient compared to the digital implementations [8].


    In-memory computing for accelerating ANN inference and training and the use of
