  md: '# Computation reuse-aware accelerator 155


    ![](img/e6e752b99eb1621488c89445a57e2a86_180_0.png)


    Figure 7.3 Power reduction under three accuracy loss constraints


    Figure 7.3 shows the power saving of the considered neural network accelerators
    for three given output accuracy constraint levels. The bars represent power reduction
    over the baseline architecture. We selected this iso-accuracy representation because
    get more insight into the relative performance of the models can be gained when
    they all give the same output accuracy.


    Different accuracies are obtained by changing the numerical precision of neural
    networks. We use 16-bit fixed-point numbers and the precision is reduced by truncating
    the fractional bits. In CORN, operations are done on full 16-bit fixed point numbers,
    the reduced width are used during the offline weight and input detection procedures
    only. The other methods reduce precision for the main calculation by making data
    values (for AxNN) or operations (for ApproxNN) approximate.


    As the figure indicates, CORN can reach 61% power reduction, on average, whereas
    AxNN and ApproxNN reduce power by 38% and 32%, respectively. The main source of
    this superior performance is the considerable amount of computation redundancy
    in neural networks that are effectively exploited by CORN to save power. Although
    the amount of power reduction is application-dependent, as a general trend, it
    increases for lower precisions and larger neural network sizes. Whereas the former
    trend seems obvious, the latter is mainly due to the fact that large networks
    provide a larger pool to search for repetitive weights. Hence more repetitive
    weights can be extracted potentially.


    CORN uses both weight and input redundancy extraction. We measured the effect
    of each method on power saving and observed that 12% of the average power reduction
    is due to the input redundancy elimination (up to 27% in adult workload). In some
    datasets, like FFT, two consecutive inputs are not correlated. Thus, while paying
    the overhead of comparing and storing multiplication results (that neutralize
    a portion of power reduction), they do not benefit from input-induced computation
    reuse. Therefore, we can disable the input redundancy extraction for such applications
    to eliminate its unnecessary activity.


    Input redundancy extraction is particularly beneficial for workloads that are
    inherently repetitive and periodic. In a prior work, we have shown the effectiveness'
  merge: -1
  img_proc: true
