    # 1.2 ANNs in classification and regression problems


    In this section, after giving some concepts about classification and regression
    problems, the required structure of ANN, for such applications, is explained.


    # 1.2.1 ANNs in classification problems


    Classification is the process of identifying to which set of classes a new object
    belongs. When applying ANNs to a classification problem, it is desired to learn
    network in a way that it assigns each input pattern, x to the corresponding target
    class label, l(x). In supervised learning, the learning is done by a training
    set of data containing objects whose class membership is known.


    In real-world classification problems, there are various undesirable disturbances,
    nullities, and distortions in input patterns. Thus, it is essential that the input
    space (x) is transformed to an effective feature space, z(x) where the undesirable
    nullities, disturbances, and distortions are removed. In an effective feature
    space, the feature points of each class are expected to be within a close proximity
    and (and far enough) from feature points of other classes. By carrying out the
    partitioning task based on the patterns of the classes, feature points of each
    class will be located in one or more separated regions, and hence the target labels
    can be generated. Consequently, a NN carries out classification in two steps:
    feature extraction and partitioning. Figure 1.10 shows a diagram for such a network
    applied to classification problems.


    Figure 1.11 shows a two-dimensional (2D) illustrative example indicating how a
    NN solves a classification problem. Figure 1.11 indicates, at the entrance of
    the network, Q feature points with different labels (indicated by stars, bullets,
    and squares'
