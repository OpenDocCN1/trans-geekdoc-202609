    # 9.7 Visualization


    The rate of improvement in the prediction accuracy in each iteration of ICNN depends
    on the network being able to learn distinct features in each iteration and leverage
    all features learned in the previous iterations. To illustrate how ICNN learns
    distinct features in each iteration, visualization techniques are used to present
    the features learned in different iterations.


    # 9.7.1 Background on CNN visualization


    With the increasing deployment of CNN for classification, various works have focused
    on visualizing these networks to understand how they produce accurate results.
    Specifically, it is most beneficial to visualize which features trigger each neuron.
    Understanding what each neuron is responsible for helps enhancing the performance
    of the overall network.


    The easiest way to visualize a neuron''s function is by searching for input image
    samples in the dataset that triggers the strongest response in a given neuron
    [32]. Another approach is to use deconvolution networks to project the feature
    activations back to the input pixel [33]. For this purpose, deconvolution networks
    construct layers from the image upward in an unsupervised fashion. A deconvolution
    simply reverses the forward and backward passes of convolution [34]. In [7], deconvolution
    networks were used to develop a technique that reveals the input stimuli individual
    feature maps at various layers in the model. Since then, various works have used
    the deconvolution networks for semantic segmentation [35], flow estimation [36]
    and generative modeling [37].


