  md: '# Hardware acceleration for recurrent neural networks


    the output activations are stored from one or more of the layers of the network
    which are called hidden activations. Next time an input is fed to the network,
    and the previously stored outputs are considered as additional inputs concatenated
    with the normal inputs. For example, if a hidden layer has 10 regular input nodes
    and 128 hidden nodes in the layer, it would actually receive 138 total inputs.


    A chunk of neural network $A$ with input $x_t$, and outputs $h_t$, is shown in
    Figure 2.1. In this model, information is passed from one step of the network
    to the next via a loop. This information is the hidden state, which is a representation
    of previous inputs. This iterative invocation of a layer is the main difference
    of RNNs with a normal feedforward network. In fact, the RNN can be considered
    as multiple copies of the same network replicated in time. RNN treats the hidden
    layers as successive layers (Figure 2.2, left). This structure can be unfolded
    to produce the outputs of a neuron component sequence at discrete time steps corresponding
    to the input time series (Figure 2.2, right). With this architecture, RNN has
    a strong capability of capturing the historical information embedded in the past
    elements of the input for some amount of time.


    This chained structure shows that RNNs are closely suited to lists and sequences
    of data. The unique feature of RNNs is the fact that they are able to connect
    previous information to the current layer. An example application is video processing
    in which by using previous video frames the understanding of the current frame
    may be increased. The feedback loop in the recurrent layer allows RNN maintain
    information in “memory” over time. But, it can be difficult to train standard
    RNNs to solve problems that involve learning long-temporal dependencies. This
    is because the gradient of the loss function decays exponentially with time; a
    challenge that is known as the vanishing gradient problem.


