  md: '# 156 Hardware architectures for deep learning


    of input-induced computation reuse for low-power electrocardiogram (ECG) monitoring
    in healthcare devices [15].


    Synthesis results show that CORN increases the baseline architecture''s area by
    13%. The programmable crossbar and the tables that keep the computation reuse
    information are the main sources of this area overhead. These components also
    have some power overhead that is by far less than power reduction obtained by
    computation reuse. For example, in the data analysis benchmark with 1% accuracy
    reduction, CORN increases the power consumption of the control unit and internal
    connections by 0.29 mW (from 0.10 mW of the baseline to 0.39 mW of CORN) that
    is by far less than the 0.83 mW power saving of multiplication and weight memory
    read operations (from 1.69 mW of the baseline to 0.87 mW of CORN).


    # 7.5 Conclusion and future work


    Power consumption has long been a significant concern in neural networks. In particular,
    large neural networks that implement novel machine learning techniques require
    much more computation, and hence power, than ever before.


    In this chapter, we showed that computation reuse could exploit the inherent redundancy
    in the arithmetic operations of the neural network to save power. Experimental
    results showed that computation reuse, when, eliminate up to 90% of multiplication,
    effectively reducing power consumption by 61%, on average in the presented architecture.


    The proposed computation reuse-aware design can be integrated into several state-of-the-art
    customized architectures for LSTM [16], spiking [17], and convolutional neural
    network models to further reduce power consumption. Second, we can couple computation
    reuse with existing de mapping [18, 19] and scheduling [20] algorithms toward
    developing scheduling and mapping methods for neural network. Computation reuse
    can also boost the performance of the methods that eliminate ineffective computation
    in deep learning neural networks [21]. Evaluating the impact of CORN on reliability
    [22] and customizing the CORN architecture for FPGA-based neural network implementation
    [23, 24] are the other future works in this line.


