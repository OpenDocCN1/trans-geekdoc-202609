    As illustrated, the stand-alone TP yields better run-time/accuracy trade-off compared
    to the stand-alone pruning policy. However, their combination in hybrid policy
    could lead to optimal solutions. Several optimization points for the hybrid policies
    in Figure 9.26 exhibit lower run-time compared to the stand-alone TP with the
    same accuracy. For instance, Figure 9.26 highlights a stand-alone TP and a hybrid
    policy derived by combining the same TP with pruning. Figure 9.26 shows that the
    hybrid policy reduces the classification time by 38% with only 1% accuracy loss.


    # 9.11.3.2 Deadline-driven


    Figure 9.27 shows the overall accuracy of DD policy for iterative AlexNet with
    a batch size of 1 for 50k validation images on K80 GPU for various time-budgets
    the same iterations for any given deadline. As opposed to the pruning and/or TPs,
    all the images go through the function of time-budget. It should be noted that
    higher time-budgets only increase the accuracy when it is sufficient for execution
    of the next iteration, which results in the step-like behavior observed in the
    figure.


    Unlike the thresholding and pruning policies, the DD policy only executes the
    FC layer of one iteration, more specifically the last iteration given the time-budget.
    However, the pruning and/or TPs require the FC layers of all the iterations to
    be completed to draw clear conclusion about the early termination and pruning
    of class labels.


    As a result, for higher accuracy values (i.e., high $D_{ci}$ and low $S_{th}$
