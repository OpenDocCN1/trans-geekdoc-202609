    # 8.4.2 Acceleration strategies


    The collective research efforts for CNN acceleration using FPGAs have proposed
    many approaches and present various trade-offs. Some solutions are not particularly
    effective for the next generation of deep networks and are inefficient for latency-driven
    designs. In the following discussion, we explain common design techniques and
    analyze which strategies are better suited for the latency-sensitive applications.
    We also propose novel techniques and explain how they improve the performance.


    +   Reduce weight bandwidth: Filter dimensions for any layer are mostly restricted
    to no more than 7–11, which is small enough to fit in on-chip BRAMs. The trend
    is, in fact, move toward smaller sizes of 1×1 and 3×3 filters across entire networks
    as it reduces total model size. This results in a very small overhead of weight
    communication with off-chip memory. On the other hand, IFM/OFM data traffic can
    result in large number of memory stalls and requires IFM overlapping of computation
    with data transfer, often done using dual-buffering. Unlike IFMs/OFMs, we do not
    use dual-buffering for weight data, which also eases the on-chip bandwidth requirements
    and saves BRAM resources.


    +   Inefficient intra-filter parallelism: For high flexibility targeted in FICaffe,
    we process filters in sequential manner. Concurrent computations within filters
    either make it challenging or inefficient to support wide variety of filter sizes
    and can result in idle PES. For example, Zhang et al. [6] fixed filter size to
    5 x 5 and incurred significant penalty for 3 filter layers. Similarly, in [4,7,14]
    they fixed their filter sizes to 3 x3 which does not maps well to networks with
    variety of filter sizes such as AlexNet and GoogLeNet. Therefore, we do not incorporate
    intra-filter parallelism in FICaffe. This further reduces the bandwidth requirement
    of weight buffers.


    +   Avoid intra-channel parallelism: Certain parallelization opportunities are
    inherently more efficient than others. The optimizer presented in [16] for an
    RTL accelerator results in result and intra-channel parallelism. This requires
    multiple input pixels from the same IFM channel every cycle. Since filter strides
    over IFM channels tend to overlap, to support arbitrary filter size and stride
    values,'
