    # 11.4.3 Inverter-based memristive neuromorphic circuit


    In this section, the effectiveness of the proposed inverter-based neuromorphic
    circuits under several applications is evaluated. The system-level flowchart of
    the proposed training framework is depicted in Figure 11.11. First, the mathematical
    model of the neurons (i.e., inverters) is extracted by using SPICE simulations
    for the TSMC 90-nm technology model. Then the neural network is trained using
    the neuron and crossbar models as well as considering the physical limitations
    of the neural circuit. After this phase, the extracted weights are converted to
    memristor states based on the physical characteristics of the memristor and deployed
    in the SPICE netlist. Finally, the neural circuit is simulated using SPICE simulation
    to measure the post-deployment accuracy and the circuit parameters (e.g., delay,
    power, and energy consumption).


    This circuit was employed as a neuromorphic processor in a smart sensor node MNIST
    classification [49]. The kernel part of two approximate applications from Axbench
    package [50], a time-series regression application [51] and time-series mobile
    health (MHealth) dataset [52], were chosen to be run on the neuromorphic circuit.
    Input data provided in the Axbench package, MHealth, and Air Quality dataset for
    training (80% of data samples) and testing (20% of data samples) have been used.
    In the case of MNIST application, 1,000 of 14 × 14-pixel images, which were compressed
    forms of 28 by 28 images in the MNIST database, were utilized for the training
    and testing. The MHealth dataset comprises both motion and vital signs recordings
    from ten volunteers of diverse profile while performing several


