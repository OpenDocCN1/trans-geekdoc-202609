    the memristive crossbar through the programming interface also initializes the
    input and output interfaces. The weights are written to the crossbar and the input/output
    interfaces are initialized, the programming interface is turned off and its outputs
    become float, the ANN is powered on, and normal operation mode of the circuit
    begins. The programming interface also includes switches (row and column selectors
    in Figure 11.3) to select the proper memristor to write and protect other memristors
    from unwanted write. In the rest of this section, the details of these components,
    as well as the method for training the neural network are discussed.


    # 11.3.1 Neuron circuit with memristive synapse


    Assume a neural network layer with $V_{ip}, V_{in} (i = 1, \dots, N)$ inputs and
    $w_{jip}, w_{jin}$ synaptic weights. In this neural network layer, the input of
    the $j$th neuron, is


    ```

    $net_{j} = \sum_{i=1}^{N} (V_{ip}w_{jip} + V_{in}w_{jin}) \quad (11.1)$

    ```


    Based on (11.1), we propose to consider the circuit of Figure 11.4 to implement
    a single neuron and its synaptic weights with two CMOS inverters and a column
    of the memristive crossbar. Each input of this circuit (e.g., $x_i$) is differential
    which contains inverted ($V_{in}$) and non-inverted ($V_{ip}$) signals. In this
    circuit, the voltage of the node $net_{j}$ (the input of the inverter of column
    $j$) is


    ```

    $V_{net_{j}} = \zeta \sum_{i=1}^{N} (V_{ip}\sigma_{jip} + V_{in}\sigma_{jin})
    \quad (11.2)$

    ```


    ![](img/e6e752b99eb1621488c89445a57e2a86_296_0.png)


    Figure 11.4 Implementation of synaptic weights for each neuron'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# 272 Hardware architectures for deep learning


    where $\sigma_{ij}(\sigma_{jin})$ is the conductance of the memristor located
    in non-inverted (inverted) row $i$ and column $j$, and $V_{net}$ is the voltage
    of the node net, and parameter $\zeta$ is defined by


    ```

    $$\zeta = \frac{1}{\sum_{i=1}^N(\sigma_{jip} + \sigma_{jin})} \quad (11.3)$

    ```


    Based on (11.1), two memristors are employed per weight which enables implementing
    both positive and negative weights. In the inverter-based neuromorphic circuit,
    the first inverter acts as activation function and performs the nonlinear operation
    on the weighted sum. However, because in this implementation, both positive and
    negative values of the neuron output (the input of the neuron in the next layer)
    are needed, another inverter is utilized to generate the non-inverted output ($O_p$).
    Hence, all the neurons of this structure, except the ones in the output layer,
    include two inverters. It should be noted that due to the much higher efficiency
    of the inverters compared with op-amps, the inverter-based design, even with complementarity,
    is more efficient. Since a neuron output in the output layer is considered a primary
    analog output of the network, one inverter is utilized for this neuron. In this
    chapter, the operating voltage of the inverters is $\pm V_{dd}/2$. Note that the
    bias input of the neuron may be implemented by considering an additional constant
    input for the neuron. In order to map the neural network weights to the neuromorphic
    circuit, we equate (11.1) and (11.2). Hence, the weights ($w_{jip}$ and $w_{jin}$)
    can be calculated as


    ```

    $w_{jip} = \frac{\sigma_{jip}}{\sum_{m=1}^N(\sigma_{jmp} + \sigma_{jmn})} \\nw_{jin}
    = \frac{\sigma_{jin}}{\sum_{m=1}^N(\sigma_{jmp} + \sigma_{jmn})} \quad (11.4)$

    ```


    and thus,


    ```

    $w_{jip} (\sum_{m=1}^N(\sigma_{jmp} + \sigma_{jmn})) - \sigma_{jip} = 0 \\nw_{jin}
    (\sum_{m=1}^N(\sigma_{jmp} + \sigma_{jmn})) - \sigma_{jin} = 0 \quad (11.5)$

    ```


    The value of the fabricated memristor conductance is bounded between minimum ($\sigma_{min}$)
    and maximum ($\sigma_{max}$) values. Therefore, in this work, we use the memristor
    parameters of [39] where the maximum and minimum values are 7.9 and 0.12\mu\zeta$,
    respectively, which are used when (11.5) is solved. Using (11.5) and based on
    the boundary values of the memristor conductance, one might:


    ```

    $$\sigma_{min} < w_{jip}\sum_{m=1}^N(\sigma_{jmp} + \sigma_{jmn}) < \sigma_{max}
    \\nw_{min} < w_{jin}\\sum_{m=1}^N(\sigma_{jmp} + \sigma_{jmn}) < \sigma_{max}
    \quad (11.6)$

    ```'
