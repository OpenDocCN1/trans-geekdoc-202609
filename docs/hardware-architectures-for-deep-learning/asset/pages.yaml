    # 10.2 Related work


    # 10.2.1 Mixed-signal neuromorphic architectures – brief review


    Nervous systems are a special class of distributed information processing system
    that

    processes the information in a profoundly different manner than modern computer

    technologies that are based on the von Neumann architecture. The neurobiological

    systems exploit billions of slow, inhomogeneous, noisy and limited precision elements

    (neurons and synapses) and nevertheless outperform computers in many tasks

    as speech processing, symbolic reasoning, motor control and multi-sensorial

    integration. In recent years, there is an increasing interest in exploring alternative

    computing technologies that can go beyond the von Neumann architecture. Neurmor-

    phic engineering is an active field of research in which the computational principles

    of biological systems are applied while developing artificial systems for practical

    applications, exploiting known physical properties of the silicon Complementary

    Metal-Oxide-Semiconductor (CMOS) technology or other materials and substrates.

    Within this context, many mixed-signal combinations of analog and digital implement-

    tnof neural processing elements have been proposed. That is mainly true because

    the analog nature of the part of the computation matches the low-power requirement

    and it is in line with the neurobiological counterpart.


    Some of the recent projects at the development of hardware platforms for

    large-scale neural hardware emulators. This is done with the aim of simulating
    the

    largest possible number of neurons and synapses with the lowest possible power

    budget. The spiking Neural Network Architecture (SpNNaker) project* has realized

    dig platform, based on 18 million digital processors Advanced RISC Machine

    (ARM)) into a single die that simulates parts of the human brain in real

    time. This digital system recently reached a 1 million core milestone on a single

    machine to model one billion leaky-integrate-and-fire (LIF) neurons in real time.

    The customized ARM9 chips include 18 general-purpose ARM9,† with 100 KByte

    local memory for each core (program and data) and 128 MByte shared dynamic

    random access memory used for storing synaptic weights or other internal variables.

    The cores provide a programmable platform for implementing arbitrary neuron

    models and learning algorithms, in which computation is based on a 16-bit fixed-

    point arithmetic. They are interconnected with a torus communication network which

    supplied reasonable bandwidth up to a medium scale range but when going to (many)

    millions of neurons also that torus provides strong synapse communication bandwidth

    limitations.


    *Led by Prof. Steve Furber at the University of Manchester.

    †ARM: a family of RISC-based processor designed and licensed by ARM holding. ARM9
    is a 32-bit ARM

    m processor.'
