  md: '# Chapter 7

    Computation reuse-aware accelerator for neural networks


    Hoda Mahdiani1, Alireza Khadem2, Ali Yasoubi1, Azam Ghanbari1, Mehdi Modrarresi1,3,
    and Masoud Daneshtalab4


    The ever-increasing demand for power efficiency in current deep submicron and
    nano semiconductor technologies along with rapid growth of embedded/server applications
    based on deep learning has brought about a renaissance in the hardware implementation
    of neural networks. Fast execution of neural networks using special-purpose hardware
    accelerators is an old course of research. However, neural network acceleration
    has recently gained attention, mainly due to the growing need for deep learning
    algorithms in a broad scope of applications, ranging from smart sensors to embedded
    systems and further to data analysis services in servers. Neural networks are
    the most efficient and straightforward way to implement classification and pattern
    recognition algorithms which serve as the basis of these machine learning systems.
    In addition to these traditional application domains, prior research shows that
    equipping Processing Units (CPUs) and Graphics Processing Units (GPUs) with a
    neural network unit as a universal, trainable, and approximate accelerator in
    order to implement complex functions leads to considerable power/performance benefits
    [1].


    The large size of neural networks in many recent application domains, such as
    computer vision and data analytics, poses throughput and energy-efficiency challenges
    to the underlying processing hardware. In this chapter, we show how the high computation
    redundancy in neural information processing, coupled with the inherent approximate
    nature of neural networks, can be exploited by an approximate computation-reuse
    mechanism to implement power-efficient neural network accelerators.


    State-of-the-art neural networks in many applications, such as computer vision
    and data analytics, are orders of magnitude larger than conventional simple networks
    that have long been used since the 1990s, requiring up to millions of arithmetic
    operations per input [2]. Consequently, designing neural network accelerators
    with


