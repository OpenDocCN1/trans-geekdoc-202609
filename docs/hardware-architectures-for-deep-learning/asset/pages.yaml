    a local fetch controller that has activation and weight bit-vectors to find which
    activations or weights are zero. The fetch controller calculates all the nonzero
    pairs of activation and weight and forwards them to nonzero index unit. PE data
    path picks one index per cycle and performs the corresponding MAC for the elements
    pointed by the selected index. As a result, PE performs only the nonzero MAC operations
    (see Figure 6.10).


    In each ZeNA''s cluster, PEs are divided into multiple WGs. The same PEs in different
    WGs receive the same kernels, hence working on the same OFM. However, they contribute
    to different output positions (see Figure 6.11). Note that the number of PEs might
    not be enough to cover all of the OFMs. Therefore, ZeNA divides the OFMs into
    subgroups (subWG) and executes them iteratively. This way of weight distribution,
    combined with imbalanced sparsity in both activation and weight tensors, can cause
    inefficiency. ZeNA pursues two approaches to mitigate PE underutilization: (1)
    intra-WG load balancing and (2) inter-WG load balancing. In intra-WG load balancing,
    ZeNA first sorts the OFMs based on the number of nonzero weights they have. As
    a result, the sub-WG of OFMS deploying together has an almost similar number of
    multiplications to perform. In inter-WG load balancing, ZeNA allows different
    WGs to steal weight from each other. Since all of the WGs share the same weights,
    it only needs to redirect the activations from one WG to another.


    In comparison with Eyeriss [20], ZeNA boosts by 4.4x and 5.6x for AlexNet and
    VGG-16, respectively. Although Eyeriss takes advantage of sparsity by clock gating
    the multiply-by-zero operations, ZeNA is still 25% more power efficient mostly
    because it finishes its task sooner and is able to save static power.


