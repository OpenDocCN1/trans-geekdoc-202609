    classes: (1) matrix multiplication [5,6,13–15]. (2) systolic array [16,17] and
    (3) parallel vector [1,3,4,7,18]. As can be seen, matrix-multiplication-based
    schemes overwhelmingly dominate the spectrum. It is a well-explored area where
    multi-threaded CPUs and GPUs are repurposed for the task. Implementing systolic
    arrays, on the other hand, requires careful data transfer and register sharing,
    which can absorb high amount of logic resources with OpenCL. Consequently, both
    [16,17] are RTL-designs. Finally, simultaneous parallel multiplication is a SIMD-based
    approach which is well suited for OpenCL as it reduces complexity in control plane
    and only requires replication of data plane. Moreover, there is no intercommunication
    between PEs, which eases FPGA routing. This is important for scalability as interconnect
    complexity can quickly rise with higher number of PEs for matrix multiplier and
    systolic arrays. Thus, we adopt parallel vector multiplications and design highly
    efficient PEs in this work.


    # 8.3 Network structures and operations


    CNNs have dramatically improved computer vision tasks such as object recognition,
    surveillance, image restoration and reconstruction [19]. Comparison on the comprehensive
    ImageNet dataset is one task on which recent modern networks such as SqueezeNet,
    GoogLeet and ResNet have outperformed regular feed-forward CNNs, including AlexNet
    and VGG. These complex networks have repeated structures with regular convolutional
    layers as shown in Figure 8.1. Therefore, by accelerating convolutional layer
    and FCL, along with low overhead feature concatenation, we can achieve low-latency,
    high-throughput inference for a large variety of Networks. We briefly discuss
    CNN layers and introduce the notations and abbreviations summarized in Table 8.1.


    # 8.3.1 Convolution


    Convolution layers (CLs) are one of the most compute layers in a CNN. For a given
    3D input image (2D image with channel depths), called input feature maps (IFMs),
    a 3D weighted filter is applied by point-wise multiplication with IFMs, which
    are accumulated to compute a single pixel in output feature maps (OFMs). A single
    feature map is also referred to as a channel. Weights are shared within an OFM
    channel, i.e., each pixel of an OFM is computed using the same set of filter parameters,
    while they slide across IFMs. Figure 8.2 shows all dimensional variables involved
    in a CL. CLs consist of a lot of data reuse and have alike independent computations,
    providing opportunities and trade-offs for parallelism which are explored in Section
    8.4. Weight filters are sometimes also referred to as kernels but in this chapter,
    we use kernels only to denote OpenCL kernels.


