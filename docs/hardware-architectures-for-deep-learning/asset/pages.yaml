  md: '# 84 Hardware architectures for deep learning


    in the order of numbers in the Sobol sequences leads to different interactions
    between bit-streams and producing different outputs. In this chapter, we convert
    the input data to LD deterministic Sobol-based bit-streams for accurate processing
    of data in CNNs. We experimentally show that processing these bit-streams for
    only a few cycles is sufficient to achieve the same results as the results from
    the conventional fixed-point binary counter.


    # 4.3.3 Convolutional neural networks


    CNNs are an important and common class of NNs that have proven to be very effective
    in areas as image recognition and classification. A general CNN consists of convolutional
    layers followed by some pooling and fully-connected layers. A convolutional layer
    extracts a feature map from its input by applying a set of kernels (filters) and
    by activating them when specific types of features are found in the inputs. Each
    pixel in a feature map is a convolution neuron which is obtained by convolving
    a filtersizing window and the inputs in the moving window. The activation functions
    are nonlinear transformation functions such as rectified linear units (ReLUS),
    sigmoid, and hyperbolic tangent (tanh) function which are used to extract specific
    types of features from the convolution neurons. Choosing each of these functions
    has a trade-off between performance and computational complexity. To reduce the
    dimensions of feature maps and hence mitigating the over-fitting issues, a pooling
    layer subsamples the data. There are various pooling layers such as average pooling,
    max pooling, and L2-norm pooling. The fully-connected layer fully connects its
    input to all activated neurons of its previous layer. Each neuron in the fully-connected
    layer finds dot-product (inner-product) of its inputs and corresponding weights.
    Finally, a loss function is also necessary to specify the deviation between the
    predicted and real labels in the network-training process. The loss function can
    be softmax loss, cross-entropy loss, sigmoid, or Euclidean loss in a loss layer.


    In this chapter, we focus on the dot-product operation as the basic and essential
    operation in the convolutional and fully-connected layers. We implement the first
    convolutional layer of CNN using a hybrid deterministic bit-stream dot-product
    design. We do not use bit-stream processing in the subsequent layers, since accuracy
    losses from processing bit-streams would compound and require long bit-streams
    to achieve accurate results.


    # 4.4 Related work


    SC has been used in recent years for low-area and low-power implementations of
    NNs. We point to [27] as one of the first work applying SC to N. SC has also applied
    to deep belief networks [28], radial basis function NNs [29], and the restricted
    Boltzmann machine—a type of artificial NNs [30]. An efficient implementation of
    deep NNs (DNNs) based on integral SC is proposed in [11] resulting up to 33% reduction
    in energy consumption with respect to the conventional binary radix implementation.
    SC has also been adopted for efficient implementation of DNNs in [5]'
