    # 10.1 Introduction


    Advances in biomedical sensing have enabled accurate measurement of biological
    data such as heart rate using electrocardiogram (ECG) and brain activity using
    electroencephalogram (EEG). Traditionally, these measurements are carried out
    by hospital for inpatients predicted and analyzed by physicians for deciding the
    treatment. Continuous, always-on, real-time biomedical signal processing and analysis
    has the potential for detecting the vital signatures that occur during the early
    stage of the disease. Real-time patient monitoring can help in better management
    avoiding adverse events like heart attacks and strokes. Hence, in recent years,
    there is a growing research in the area of wearable and always-on biomedical signal
    analysis platforms.


    Real-time biomedical signal processing platforms should have complex signalprocessing
    capabilities while consuming very low energy. Low-power consumption and compact
    size requirements ensure that these platforms can be integrated into wearable
    devices that can work for single battery charge. One of the desired requirements
    is the adaptive signal processing based on the individual patient data.


    Traditional signal-processing techniques implemented on custom Application Integrated
    Circuits (ASICs) can offer complex signal-processing capabilities but consume
    more power (due to their complexity) and still cannot offer the desired adaptability.
    Neuromorphic computing is a promising alternative approach to standard von Neumann
    machines for dedicated adaptive signal processing, estimation and classification
    tasks. Neuromorphic systems or hardware SNN systems emulate cognitive abilities
    of the human brain by emulating the massive, dense and complex interconnection
    of neurons and synapses, where each neuron connects to thousands of other neurons
    and communicates through short transient pulses (spikes) along synaptic links.
    Brain-based deep learning systems aim to create neural network structures with
    a large number of (or deep) layers. This massive scaling poses a challenge for
    designing the global synaptic network for the neuromorphic architectures. This
    chapter discusses a circuit-switched network realized in 3D very large scale integration
    (VLSI) implementations that offer a compact scalable efficient synaptic communication
    network. Currently, we are applying and demonstrating this for medium-size applications
    like the EEG classifier. However, our concepts are intended to scale this up to
    a much larger size, up to millions of neurons and billions of synapses, as required
    for deep learning applications. We believe the concepts exposed here are potentially
    reusable in that direction but their practical implementation is cleaver future
    work.


    The main design challenge for the realization of compact low-power biomedical
    signal processing neuromorphic platforms is efficient implementation of the following
    system elements:


    +   * neural elements, including local synaptic array

    * global synaptic communication infrastructure

    * efficient (on-line) learning techniques


    The choices we have made for these components and their motivation will be provided
    in the subsequent sections. Section 10.2 reviews various neuromorphic architectures
    and related research. The section also discusses the signal processing'
