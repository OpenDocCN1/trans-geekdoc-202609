    Authors in [8] introduced a new SC multiplication algorithm, called BISC-MVM,
    for matrix-vector multiplication. The proposed method of [8] significantly reduces
    the number of clock cycles taken in the stochastic multiplication resulting in
    significant energy consumption reduction compared to the conventional SC-based
    designs of CNNs. Authors in [12] extend the work of [8] and develop an architecture,
    called SkippyNN, that further reduces the computation time of SC-based multiplications
    in the convolutional layers of NNs. On average, SkippyNN offers 1.2× speedup and
    2.2× energy saving compared to the conventional binary implementations. A SpinCMOS-based
    stochastic NN architecture is proposed in [31] achieving a significant area, power,
    and energy consumption saving. The stochastic multiplications are performed by
    CMOS AND gates, where the sum of products is accumulated by spintronic compressor
    gates. We also refer to [6,7,90,14] as some other related works in the literature.


    Hybrid stochastic-binary designs of NNs have also been developed to reduce the
    energy consumption and improve the accuracy of bit-stream-based NNs. Lee et al.
    [4] used SC to implement the first convolutional layer of NN. The remaining layers
    were all implemented in the binary radix domain. The result was a significant
    improvement in the energy-consumption compared to conventional all-binary design
    and a better accuracy compared to prior SC designs. Hybrid stochastic-binary designs
    proposed in [5–7] use approximate parallel counter, accumulative parallel counter,
    and binary arithmetic improve the accuracy and energy-efficiency of NNs. However,
    none of these prior designs is able to guarantee achieving the same classification
    rate as the conventional fixed-point binary design. All the prior SC-based implementations
    also have some variations in producing the results (nonzero standard variation)
    and none of them are deterministic.


    # 4.5 Proposed hybrid binary-bit-stream design


    Convolutional layers, including the first layer, account for the most hardware
    area and power cost in a class of CNNs [7]. Dot-product is the basic operation
    in these layers, multiplying and accumulating the input data and the kernel''s
    weights (obtained from the training step), followed by an activation function.
    In this chapter, we use the LD bit-stream processing method of [23] for energy-efficient
    and low-cost design of the first convolutional layer. To avoid the issue of compounding
    errors over multiple layers, we limit our work to the first layer of NN.'
