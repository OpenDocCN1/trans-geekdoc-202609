    # 8.3.3 Pooling


    Pooling is also similar in structure to convolution with the main difference that
    it is usually applied to each IFM channel separately. As a result, pooling output
    has the same number of channels as input and is generally applied to reduce OFM
    size. Two types of pooling filters are commonly used, maximum and average. PLs
    have relatively low computation latency than CLs and FCLs but can result in complex
    data path as we discuss in Section 8.7.'
