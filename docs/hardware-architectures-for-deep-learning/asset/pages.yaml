    under five applications is assessed. Next, the robustness of the proposed circuit
    in the presence of weight uncertainty (which is due to the memristor parameters
    variations and stochastic write operation) is studied. Finally, the effectiveness
    of the proposed neuromorphic circuit in a range of operating voltage levels is
    evaluated. All the proposed HSPICE simulations provided in [24] and in a 90-nm
    technology. Additionally, the parasitic effects of the write circuit switches
    were considered in the simulations by adding inverters ($5\times$ larger than
    a minimum-sized inverter) to each row and column of the circuit. Note that the
    write circuit is off during the normal work of the neuromorphic circuit.


