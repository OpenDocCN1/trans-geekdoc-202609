    We use an inverter as the activation function for the neurons of the ADC network.
    This is due to its lowest power consumption and smallest delay among conventional
    implementations of the activation functions (including comparing or op-amp). It
    switches the voltage on its input equals to $(V_{dd} + V_{ss})/2$ where $V_{dd}$
    and $V_{ss}$ are the positive and negative voltages, respectively. Note that $V_{ss}$
    equals $-V_{dd}$ in the differential mode. Therefore, the biases and their corresponding
    weights can be removed since inverter imposed a bias to its switch point $(V_{dd}
    + V_{ss})/2$. Also, since the input voltage range of the LTNN in [46] is $[0,
