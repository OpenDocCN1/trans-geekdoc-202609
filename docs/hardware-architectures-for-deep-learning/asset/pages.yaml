    which may be used to obtain ideal $V_{A0}$ as


    ```

    $V_{A0ideal} = \sum_{i=0}^{n-1} \frac{V_{Di}}{2^{n-1-i}R} = \sum_{i=0}^{n-1} 2^i
    V_{Di} \quad (2^n - 1)\quad (11.13)$

    ```


    Here, the relative error between the ideal and real outputs of the DAC is expressed
    as


    ```

    $Error = \frac{V_{A0ideal}-V_{A0}}{V_{A0ideal}} = 1 - \frac{V_{A0}}{V_{A0ideal}}
    = \frac{n}{R_{Load}} - \sum_{i=0}^{n-1} \frac{1}{2^{n-1-i}R}\quad (11.14)$

    ```


    Assuming that the input error tolerance of the neural network is $\alpha$, the
    maximum value of $R$ ($R_{max}$) may be determined


    ```

    $$\frac{n}{R_{Load}} - \sum_{i=0}^{n-1} \frac{1}{2^{n-1-i}R} < \alpha$\quad (11.15)$

    ```


    Rearranging the above inequality, one finds


    ```

    $$\frac{R}{R_{Load}}(1-\alpha) < \alpha < \frac{2^n-1}{2^{n-1}R}$\quad (11.16)$

    ```


    and finally,


    ```

    $R < R_{max} = \frac{2^n-1}{2^{n-1}} \times \frac{\alpha}{n(1-\alpha)} \times
    R_{Load}$\quad (11.17)$

    ```


    Therefore, in designing the DAC, the $R$ value should be selected based on $R_{Load}$
    and $\alpha$. In the cases $R_{max}$ is smaller than the minimum resistance of
    the available memristor, we should employ memristors with minimum resistance in
    parallel. is noteworthy that due to the compactness and small layout size of the
    memristor, the overhead area of parallel memristors is much smaller than the area
    occupied by the transistors of an op-amp.


    The resistance of the binary weighted memristors grows exponentially when the
    resolution of DAC increases ($R, 2R, \dots, 2^{n-1}R$). Since the resistance of
    the memristors are limited (bounded between the maximum and minimum resistances),
    a large number of memristors may be needed. To overcome this problem, for higher
