    # 3.3 ClosNN: a customized Clos for neural network


    Typical NN accelerators are composed of several PEs connected by an on-chip interconnection
    network. In such accelerators, neurons are mapped and processed on PEs. In this
    work, we use an efficient interconnection network as the communication of these
    NN processing systems. PEs can be either a specialized hardware or a general-purpose
    CPU/GPU. In either case, however, the NN generates the same inter-core traffic
    as long as the neuron-to-core mapping is the same.


