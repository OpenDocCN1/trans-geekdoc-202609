    computational complexity. This is mainly a result of skipping the intermediate
    FC layers. On the other hand, assuming limited budget, a reliable classification
    decision could be made in the early iterations with much lower computational cost.
    Thus, ICNN is no longer limited to a one-fits-all architecture and is allowed
    to make an efficient use of the resources to make the best prediction, based on
    the requirements of each application.'
