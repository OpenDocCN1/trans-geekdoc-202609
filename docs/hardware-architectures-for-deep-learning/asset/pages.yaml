  md: 'proposed [6,9]. In these circuits, despite the critical role of ADC and DAC
    at the input/output interfaces, few prior works have specifically addressed NVM-compatible
    scalable ADC (DAC) devices. The ability to support a flexible quantization scheme
    can benefit a variety of sensor front interfaces [10]. In addition, the ADC faces
    challenges including reduced intrinsic device gain, decreased signal swing, and
    aggravated device mismatch when migrating to a smaller size technology node operating
    at a lower supply voltage [11,12]. Since DACs are used as a sub-block in the design
    of ADCs [13], all design challenges also exist for ADC including switching glitches
    and device mismatches [14,15]. Therefore, conventional ADC and DAC circuits often
    require significant manual design iterations and re-spins to meet the desired
    performance specifications for a new fabrication process [14,16].


    To address these issues, this chapter describes an inverter-based memristive neuromorphic
    circuit [17,18] for ultra-low-power IoT smart sensors. The proposed design consists
    of the following topics:


    +   (1) A neuromorphic circuit that accepts digital I/O and utilizes inverters
    as neurons and memristive crossbar as synaptic weights.

    (2) An analytical model of the inverter-based neuromorphic circuit to be utilized
    in the training phase.

    (3) A memristive DAC structure without utilizing active elements to reduce the
    power consumption and boost the performance of the neuromorphic circuit.

    (4) A scheme for merging the DAC into the neuromorphic circuit to achieve higher
    DAC resolutions.

    (5) A modified backpropagation algorithm to train the neuromorphic circuit by
    considering the circuit constraints imposed by the memristor technology.

    (6) A fast and power-efficient memristive neural network-based ADC without oscillations
    or spurius states, while it has the flexibility of converting input voltages with
    different ranges and desired resolutions.


    The rest of this chapter is organized as follows. Section 11.2 provides a comprehensive
    review of the researches and attempts on different aspects of this field for building
    an ultra-low-power memristive neuromorphic hardware. Section 11.3 discusses the
    details of the proposed neuromorphic circuit as well as DAC and ADC hardware implementations.
    The efficacy and accuracy of the proposed neuromorphic circuit is studied in Section
    11.4. Finally, the chapter is concluded in Section 11.5.


    # 11.2 Literature review


    A neural network is realized using layers of neurons connected by synapses that
    link the output of one neuron to the input of another in the following layer.
    Each neuron represents an activation function where a weight is associated with
    each synaptic connection. A prior work has shown that the memristor is a highly
    desirable circuit element that can model the plasticity of synapses [19]. In particular,
    memristors can be fabricated densely in the form of memristive crossbar arrays
    [19]. The arrays can'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 268 Hardware architectures for deep learning


    realize the synapses of an ANN by performing a weighted sum of its inputs. This
    is equivalent to a weighted lookup and matrix multiply in digital ANN alternatives.
    This implementation enjoys from low power consumption and plasticity in research
    [19].


    Memristor, as the fourth passive two-terminal electrical component, relates the
    electric charge (q) and magnetic flux (φ) [20]. Initially physically realized
    in 2008 [21] by analyzing a titanium dioxide thin film, memristors are particularly
    well suited for the design of ANNs where matrix multiplications can be performed
    by consuming ultra-low amount of power. From that time, different teams have been
    working on the development of memristor based on a variety of other materials
    (e.g., [22,23]). In general, the memristor, also known as a resistance switch,
    is an electronic device whose internal states depend on the history of its experienced
    currents and voltages. The resistance of the memristor could be altered in a range
    between a minimum (e.g., 12.5 KΩ) and maximum value (e.g., 8.3 MΩ) by applying
    voltage pulses. The amplitudes and durations of the voltage pulses determine the
    amount of change in the resistance. Generally, the amplitude of the applied voltage
    should be larger than a threshold voltage (denoted as the write threshold voltage
    of the memristor, e.g., 4 V) to alter the resistance of the memristor [24]. The
    programming of a memristor (i.c., changing its conductance) requires only a small
    amount of energy, as the device can be extremely small (<2 nm) [25], and the switching
    speed can be very fast (<1 ns) [26]. Organized into large arrays, or three-dimensionally
    (3D), the intermediate computing results (such as weights in a neural network)
    can be stored locally as conductance values in single nonvolatile memristor during
    the computation.


    Analog neurons: The activation function of the neuromorphic circuits with memristor
    crossbar could be implemented with different elements as analog comparators [27],
    operational amplifiers (op-amps) and CMOS inverters [28]. Among these implementations,
    the inverter-based network has the lowest power consumption and smallest delay
    due to its simplest structure. Table 11.1 compares the design parameters of the
    neurons in these implementations in a 90-nm technology. The reported numbers are
    achieved by simulating a single neuron with a 500 KΩ resistive load.


    Memristive multilayer network: The results of extensive numerical simulations
    reported in prior work shows that memristive neural networks would provide orders
    of magnitude higher speed-energy efficiency compared with the traditional


