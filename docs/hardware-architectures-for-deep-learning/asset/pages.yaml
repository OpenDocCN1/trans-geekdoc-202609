    # 11.3 Inverter-based memristive neuromorphic circuit


    The block diagram of a two-layer ANN implemented by the proposed memristive neuromorphic
    structure is shown in Figure 11.3. This structure comprises an input interface,
    an output interface, a programming interface, and two layers of analog inverter-based
    memristive neural network. The weights of the ANN are calculated using our proposed
    training framework which is realized using a software in an off-chip machine.
    Before the first usage of the circuit, the calculated weights are written


