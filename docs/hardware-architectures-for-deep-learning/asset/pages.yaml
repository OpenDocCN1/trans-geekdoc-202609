- pgno: 137
  md: '# 112 Hardware architectures for deep learning


    YodaNN [34], as one of the first architecture prototypes, presents a flexible,
    energy-efficient and performance-scalable accelerator design for BWTs. In this
    accelerator, weights and activations are binary and 12-bit numbers, respectively.
    By implementing and deploying latch-based standard cell memory which provides
    more energy efficiency and voltage scalability compared with SRAM, they have obtained
    energy efficiency of 61.2 tera operations per second per watt.


    In [35], an optimized FPGA-based accelerator for a nine-layer binary convolutional
    neural networks (BCNN) is presented. Since the input image is fixed point, the
    first layer processing elements are also fixed point. The design uses Lookup Tables
    (LUTs) instead of DSP8 slices to implement bitwise operations and use bitcount
    to accumulate LUT outputs. The proposed FPGA-based architecture is 8× faster and
    75× more efficient than Titan X GPU in small batch sizes. In large batch sizes,
    the proposed architecture achieves near Titan X GPU throughput and 9.5× energy
    efficiency.


    The authors in [17] presented a fully synthesizable ultra-efficient hardware accelerator,
    XNOR Neural Engine (XNE), for BNNs. It is designed in the form an IP core which
    can be integrated into a microcontroller for low-power embedded devices.


    Note that in all BNNs, the BN layer is deployed after the convolution and fully
    connected layers. Afterward, the sign function is performed. However, hardware
    accelerators typically combine the sign function and normalization together for
    simple implementation.


    For conventional CNNs, there are some methods and tool for automatic FPGA implementation.
    A well-known example is DNNWe [36] which generates a synthesizable code for FPGA
    and a scheduler software code based on the Caffe model of a CNN. There are also
    similar tools for BNNs. The first framework for BNN (either CNN or MLP), called
    FINN [37], generates fast and flexible BNN FPGA accelerators by deploying a flexible
    heterogeneous streaming architecture. Both weights and activations are in the
    form of binary numbers in FINN framework. ReNet [38] has introduced a new framework
    based on FINN that overcomes the accuracy loss of BNNs by multiple levels of residual
    binarization for activations. The number of binarization levels is determined
    based on a given accuracy threshold. The explorations of ReNet reveals that 2
    and 3 levels of binarization is often enough to get reasonable accuracy.


    # 5.5 Conclusion


    Due to the ever-increasing deployment of CNNs in embedded and handheld devices,
    neural network models with binarized and ternarized weights and activations have
    attracted considerable attention in recent years. These approaches substitute
    massive computation-intensive MAC operations with simple bitwise operations. Furthermore,
    memory storage/bandwidth demand is significantly reduced due to the low bit-width
    of the parameters. In this chapter, we presented a survey on the state-of-the-art
    BNNs and TNNs which are suitable for low-power and resource-limited embedded systems.
    We further reviewed some recent works that aim at tackling the main challenge
    of'
