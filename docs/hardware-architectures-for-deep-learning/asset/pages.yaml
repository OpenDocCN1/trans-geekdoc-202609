    # 11.3.2 Input interface (DAC)


    The input interface should convert the input signals to analog ones, hence a DAC
    is needed. There are several implementations for DAC (e.g., [36,37,40]). In order
    to reduce the power consumption while maintaining the performance, we suggest
    implementing the DAC without active components such as operational amplifier [17].
    The suggested n-bit DAC structure is depicted in Figure 11.5. In this structure,
    the voltage of the digital inputs of the DAC $(D_0 - D_{2n-1})$ are scaled and
    accumulated in the node $R_0$ through the binary weighted resistors $(R, 2R, \dots,
    2^{n-1}R)$ which could be implemented using memristors in a small area. The voltage
    of the analog output node may be found from the KCL equation:


    ```

    $$\frac{V_{AO}}{R_{Load}} + \sum_{i=0}^{n-1} \frac{V_{Di}}{2^{n-1-i}R} = 0$$ (11.10)

    ```


    where $V_{Di}$ is the voltage of the $i$-th digital input, and $R_{Load}$ is the
    equivalent load resistance of the memristive crossbar driven by the DAC. Using
    (11.10), one may calculate (real) $V_{AO}$ as


    ```

    $$\V_{AO} = \frac{\sum_{i=0}^{n-1} \frac{V_{Di}}{2^{n-1-i}R}}{R_{Load}}$$$ (11.11)

    ```


    ![](img/e6e752b99eb1621488c89445a57e2a86_299_0.png)


