    Since exploiting redundancy is costly (previous input and multiplication result
    must be stored), it is only applied to the raw input data. Input data may benefit
    from the gradual change, so it is more likely to find repetitive input in hidden
    input. Once the data is processed by the input layer, the possibility of finding
    repetitive input for hidden and output layers reduces significantly, and thereby
    the obtained power saving may not be too significant to compensate for the power
    and area overhead of input redundancy extraction circuit.


    # 7.3 Multicore core neural network implementation


    A single CORN core can host $N$ neurons with $K$ weights. As the internal structure
    of CORN indicates, all neurons must be from the same layer.


    In two cases, the storage and processing requirement of a neural network layer
    exceeds the capacity of a single core. First, when the number of weights of a
    neuron (denoted as $W$) is greater than $K$ and when the layer has more than $N$
    neurons.


    # 7.3.1 More than K weights per neuron


    This case does not need any extra processing component because the weights of
    neurons are sent serially to each multiplier. However, they need the depth of
    every weight table row to be as large as $W$. This problem can be solved by distributing
    the weights and reuse information across shadow tables (which was originally proposed
    to allow multiple layers to share a single core''s datapath). In this case, the
    tables are activated by one in the order that the weights are stored. This configuration
    involves duplicating input vector, as each core has $S$ duplicate tables, if $W$
    is still greater than the total depth of the tables, a second CORN core be used
    to host the rest $W-S \times K$ weights. Two cores process their own part independently
    and, finally of them will sum up two accumulated values to generate final neuron
    output.


    # 7.3.2 More than N neurons per layer


    Layers with more than $N$ neurons should be distributed across multiple tables
    in the same core or across multiple cores, with each core processing at most $N$
    neurons from the layer.


    In either case, the layer should be grouped into $N$-neuron clusters. To increase
    computation reuse, CORN groups neurons based on the similarity between their weights.
    The key point is that the neurons of a layer can be arranged and processed in
    any order. Taking advantage of this flexibility, clustering can be done in such
    a way that neurons with repetitive weights are grouped together. For example,
    consider the hidden layer of the neural network in Figure 7.2(a) and suppose that
    each CORN core can be allocated to at most two neurons. In this case, by mapping'
