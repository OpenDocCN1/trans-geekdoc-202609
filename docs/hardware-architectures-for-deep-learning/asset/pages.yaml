    In some applications, such as language modeling, word prediction, speech recognition,
    translation machines, and time series prediction, the sequence at which the input
    patterns are received is important and should be considered to solve the problem.
    For such applications, a memory is implemented in the NN by adding some layers
    and also modifying the direction of the flow inside the network. These modifications
    led to the emergence of RNNs. Actually, a nonlinear difference equation is trained
    on a RNN that can convey the effects of related patterns in the output.


    RNNs and their hardware implementation issues will be introduced in more detail
    in Chapter 2.


    The classic RNN models, however, suffer from the problem of vanishing gradients,
    cannot keep long-term memory [16]. To address this issue, the long short-term
    memory (LSTM) models is designed to convey effective information from previous
    steps by (1) providing an information belt within recurrent units and (2) adding
    some special gates to the model [16]. Gated recurrent unit (GRU) is another successful
    network that implements the LSTM functionality with less number of gates [17].
