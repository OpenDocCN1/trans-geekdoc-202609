    # 4.5.1 Multiplications and accumulation


    We perform the multiplication operations in the bit-stream domain. We convert
    the two inputs of each multiplication operation to corresponding bit-stream representation
    using two different Sobol sequences. Instead of costly fixed-point binary multipliers,
    multiplications are implemented using simple standard AND gates. The deterministic
    method discussed in Section 4.3.2 guarantees generating independence bit-streams
    and processing bit-streams accurately. Deterministic computation is performed
    on the generated bit-streams and the output bit-streams are converted back to
    binary radix format implicitly by accumulating them in the binary domain using
    conventional binary adders.


    Note that the correlation between the produced multiplication output bit-streams
    does not affect the accuracy of the accumulation as the accumulation step is performed
    in the binary domain. Therefore, only two different Sobol sequences are sufficient
    to convert all input data to bit-stream representation. The generated LD bit-streams
    will be reused by a number of dot-product units, minimizing the overhead of Sobol
    sequence-based bit-stream generators in the overall cost of the NN design.


    # 4.5.2 Handling negative weights


    The weight inputs of the dot-product units involve both positive and negative
    data. The common approach to support representation of negative data and performing
    signed multiplication in the stochastic domain is through extending the range
    of numbers from [0,1] to the unipolar to [-1,1] in the bipolar stochastic domain
    [2]. The bipolar processing of bit-streams, however, requires a longer time than
    the unipolar processing for a fixed accuracy. To avoid a longer latency, we then
    divide the weights in each subset to bit-stream representation assuming that they
    are all positive (taking the absolute value of the negative values). In the accumulation
    step (APC units in Figure 4.4), the multiplication outputs of “positive” and the
    “negative” subsets are first summed separately and then subtracted from each other
    to produce the final output value.


    As discussed, when multiplying two $2^N$-bit numbers, producing exact (completely
    accurate) results with the deterministic methods of processing bit-streams requires
    running the operation for $2^{2N}$ cycles. As shown in Table 4.1, performing the
    operation for fewer cycles than $2^N$ introduces inaccuracy in the produced results
    due to truncation error. However, we see in Section 4.6 that due to the inaccuracy
    tolerance of NNs, the same or even in some cases a lower misclassification rate
    than the rate of the fixed-point design can be achieved using the proposed design.


    Figure 4.4 shows our proposed bit-stream-binary hybrid design for the first convolutional
    layer of the NN. We use this design to implement the first layer of the LeNet-5
