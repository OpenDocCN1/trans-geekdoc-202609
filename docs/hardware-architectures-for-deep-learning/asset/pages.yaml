- pgno: 53
  md: '# 28 Hardware architectures for deep learning


    It is the inference stage that carries the utility of a deep learning model—it
    is what is implemented and deployed to the end user. The details of this implementation
    are determined by the application. Often, the application brings real-time requirements
    in latency and number of concurrent users. Complex models require a large amount
    of memory resources, high computation load, and high energy consumption. For all
    of these reasons, realizing a deep learning inference system can be a challenging
    task. Consequently, of the conventional software-based approach, neural networks
    are often implemented as a special-purpose hardware accelerator.


    In a cloud-based data analytics system, the benefits of augmenting servers with
    efficient neural network hardware accelerator are clear. First, faster computation
    improves system throughput, effectively lowering the number of server resources
    required to handle the workload or increasing the maximum workload system can
    handle. Second, better energy efficiency reduces the operating cost of the system.
    Some big IT companies like Google and Microsoft have begun deploying ASICs and
    FPGAs for neural networks in their data centers to enhance the performance of
    the analytics applications [5,6].


    For mobile and internet-of-things (IoT) platforms, which already come with many
    deep learning-based applications, sometimes the neural network execution may not
    be performed on the embedded device; rather, data is offloaded to a cloud server
    to be processed. However, there are many benefits with performing inference on
    the edge device instead. As example, consider Amazon Alexa, a home voice assistant
    service. Using an Alexa-enabled device, users can speak voice commands to initiate
    different services such as playing music, checking the weather, ordering food,
    and controlling other smart devices. The system processes commands by having the
    local device send a recorded voice audio to Amazon’s servers, where it is processed
    using a speech recognition algorithm [7]. If voice recognition happens on the
    device instead, there would be a number of benefits. The service provider (Amazon)
    benefits from decreased server load, and lower operating costs. The user would
    benefit from increased privacy, as only the directives from the voice commands,
    rather the raw audio, are shared with the server. Additionally, the system could
    provide limited functionality even without an Internet connection if information
    could be downloaded to the device in advance.


    This chapter focuses on the LSTM model and is concerned with the design of a high-performance
    and energy-efficient solution to implement deep learning inference.

    The chapter is organized as follows: Section 2.1 introduces Recurrent Neural Networks
    (RNNs). In this section Long Term Memory (LSTM) and Gated Recurrent Unit (GRU)
    network models are discussed as special kind of RNNs. Section 2.2 discusses inference
    acceleration with hardware. In Section 2.3, a survey on various FPGA designs is
    presented within the context of the results of previous related works and after
    which Section 2.4 completes the chapter.


    # 2.1 Recurrent neural networks


    RNNs have a strong adaptability to time series analysis because they introduce
    the concept of sequences into the structure design of the neural network units.
    In a RNN,'
  merge: -1
  img_proc: true
