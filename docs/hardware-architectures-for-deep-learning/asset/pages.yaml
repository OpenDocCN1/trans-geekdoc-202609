    # 6.5 Conclusion


    In this chapter, we have reviewed the potential of sparsity to boost the performance
    and energy efficiency of DNN accelerators. We first identified four sparse methods:
    (1) activation, (2) weight, (3) output and (4) value sparsity. We reviewed software
    techniques to prune a DNN network. Finally, we went over some of the prior works
    that leverage different methods of sparsity.


