    Our proposition is to exploit an alternative computational approach that is com-patible
    with state-of-the-art spike-based neuromorphic processors and that contrasts the
    computational models based on the Von Neumann machine. Our focus is on the development
    of computational models, in which memory and computation are co-localized in a
    massively parallel network of spiking neurons. These models can be implemented
    with the neuromorphic processors that are currently devel-opment by different
    companies and research institutions [4,17,31]. Our method is alternative as it
    employs a SNN that operates on streaming data, without the need to use buffers
    for extra signal filtering steps, without segmenting the heartbeat and without
    a clearer feature extraction method. In our approach, we directly convert ECG
    signals into digital pulses (spike trains). The ECG signal classification and
    detection problem are cast into a temporal spike patterns classification problem.
    This problem is still a major challenge in computational neuroscience and machine
    learning. Solving the problem with a massively parallel network of spiking neurons
    can have great influence on the design of the new generation of embedded electronic
    systems [32,33].


