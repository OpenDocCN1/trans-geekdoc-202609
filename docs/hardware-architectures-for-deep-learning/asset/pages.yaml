    Training an LIF neuron readout means finding the optimal synaptic weights. In
    our approach, convert every SVM into a single LIF neuron which solves a binary
    classification problem, we have constructed a pool of $k(k-1)/2 = 153$ neurons.
    The synaptic weights for a neuron can be obtained by transforming the hyperplane
    coefficients $W$ of the respective SVM. To achieve that one only needs to multiply
    the coefficients $W$ with $\phi/rho$, where $\phi$ is the LIF firing threshold.
    The membrane potential of the LIF neuron is therefore described by the following
    dot product:


    ```

    $V_{LIF}(t) = \left(\frac{\phi}{\rho}\right)W \cdot f(t)$

    ```


    The result is intuitively described as constraining the synaptic weights such
    that the membrane potential of an LIF neuron is below the firing threshold for
    patterns that are outside the desired class, and (at least for one time $t$) for
    the desired target class (see LIF neurons in Figure 10.14).


    A winner-take-all strategy on all LIF neurons can be applied as a voting scheme.
    This process ensures a complete match between classification carried by SVMs and
    a pool of LIF neurons.


