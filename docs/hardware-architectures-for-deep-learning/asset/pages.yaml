  md: '# Chapter 9

    Iterative convolutional neural network (ICNN): an iterative CNN solution for low
    power and real-time systems


    Katayoun Neshatpour¹, Houman Homayoun¹ , and Avesta Sasan¹


    With convolutional neural networks (CNN) becoming more of a commodity in the computer
    vision field, many have attempted to improve CNN in a bid to achieve better accuracy
    to a point that CNN accuracies have surpassed that of human''s capabilities. However,
    with deeper networks, the number of computations and consequently the energy needed
    per classification has grown considerably. In this chapter, an iterative approach
    is introduced, which transforms the CNN from a single feed-forward network into
    a sequence of smaller networks, each processing a subsample of each image. Each
    smaller network combines the features extracted from all the earlier networks,
    to produce classification results. Such a multistage approach allows the CNN function
    to be dynamically approximated by creating the possibility of early termination
    and performing the classification with far fewer operations compared to a conventional
    CNN.


    # 9.1 Motivation


    Powerful models have been trained using machine learning methods on large data
    sets to increase the performance of object recognition. Image recognition on a
    realistic variety of images is only possible by training on large datasets. However,
    only recently has a large set of labeled datasets become available. ImageNet [1]
    is an example of such datasets. ImageNet is an image database organized according
    to the WordNet [2] hierarchy in which each node of the hierarchy is depicted by
    hundreds and thousands of images. ImageNet includes average of over 500 images
    per node.


    While neural networks have become ubiquitous in applications, including vision,
    speech recognition and natural language processing, CNNs are designed to make
    mostly correct assumptions about the nature of images, with much fewer connections'
