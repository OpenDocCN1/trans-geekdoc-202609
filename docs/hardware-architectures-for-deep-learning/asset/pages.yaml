  md: 'On the other hand, in the ideal DAC (without loading), input/output voltage
    relation is given by


    ```

    $$\sum_{i=0}^{n-1} \frac{V_{A0ideal}-V_{Di}}{2^{n-1-i}R} = 0$\quad (11.12)$

