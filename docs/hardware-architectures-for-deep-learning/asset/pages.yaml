    For example, ICNN, as illustrated in Figure 9.14, after executing each uCNN (each
    iteration) the class probabilities are biased, dividing the classes into two sets
    of probable and improbable classes. Note that with each iteration, the set of
    probable classes reduces, as classification becomes more accurate. Hence, the
    probability of classes could be used as an effective measure to reduce computation
    in the future iterations by avoiding computation related to improbable classes
    altogether.


    # 9.8.1 Prediction rank


    We introduce prediction rank (PR) as an indicator of prediction accuracy of a
    model for each image. Consider an image with class label α. After executing a
    uCNN, all the class probabilities are sorted in descending order. The location
    of the class α in the sorted array of class probabilities is called PR. Needless
    to mention, PR can be any value from 1 to 1k, with 1 indicating the highest and
    the lowest image detection accuracy, respectively. If statistical analysis of
    the dataset for class α shows that PR is always smaller than L in all iterations,
    (1 ≤ L ≤ 1k), limiting the number of computed class probabilities in the ICNN
    to L instead of L will have no impact on the probability of detection of class
    α (i.e., L) is smaller than PR variation for class α, then by pruning the computation
    for class α we will end up with MC. Expanding this to all classes, the probability
    of MC conditioned on PR ≤ L is given by


    ```

    $P(MC|P_{th}=L)=\sum_{i=1}^{1000}P(C[i])P(PR(C[i])>L)$

    ```


    In the previous equation, $P_{th}$ is the pruning threshold, the $th$ class, PR(c[i])
    is the PR for class C[i] and L is the chosen limit for pruning. For obtaining
    the probability P(PR(C[i])>L), we define the function D as


    ```

    $D(\alpha^{C[i]}(j), L)=\begin{cases}1, & \text{if } PR(\alpha^{C[i]}(j)) > L\\
    \0, & \text{else}\end{cases}$

    ```


