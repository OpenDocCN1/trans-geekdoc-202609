    Note that we implemented $24 \times 24$ parallel $5 \times 5$ convolution engines
    to parallel process a $28 \times 28$ input image with one filter. To process this
    input image with 20 filters, we need to implement 20 copies of the implemented
    design. The bit-stream generators responsible for converting data and also the
    two Sobol number generators will be shared between more convolution engines and
    therefore the overhead cost of bit-stream generation will be further reduced.


    # 4.7 Summary


    In this chapter, we proposed a low-cost and energy-efficient design for hardware
    implementation of CNNs. LD deterministic bit-streams and simple standard AND gates
    are used to perform fast and accurate multiplication operations in the first layer
    of the NN. Compared to prior random bit-stream-based designs, the proposed design
    achieves a lower misclassification rate for the same processing time. Evaluating
    LeNet5 NN with MNIST dataset as the input, the proposed design achieved the same
    classification rate as the conventional fixed-point binary with 70% saving in
    the energy consumption of the first convolutional layer. If accepting slight inaccuracies,
    higher energy savings are also feasible by processing shorter bit-streams.


