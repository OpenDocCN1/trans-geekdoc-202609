    # 6.4.5.3 SparseNN


    There are other works using prediction to exploit output sparsity. SparseNN [33]
    deploys a lightweight runtime predictor for the output activation sparsity on
    the fly. The predictor is based on truncated singular value decomposition (SVD)
    to decompose weight matrix into two low-rank matrices. The computation complexity
    is smaller as compared to the original feedforward, also insignificant to the
    bypassed computations.


    # 6.4.5.4 CompEnd


    CompEnd [34] re-encodes the weights with inverted two''s complement so that MSB
    has a positive weight and all others have negative weight. Multiplications are
    processed serially. MSBs are computed first, as the computation progresses, the
    bit serial sum goes negative By checking the sign inversion in the intermediate
    results of the bit serial sum, this scheme can detect negative results before
    finishing the calculation of all bits. The advantage is that the off-line weight
    encoding removes the need of weight reordering as in SnaPEA.


