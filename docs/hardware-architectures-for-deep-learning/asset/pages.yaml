    # 1.1.2 Artificial neural networks


    Inspired by natural NNs, from the beginning of the twentieth century, scientists
    and engineers have intended to design ANNs in order to provide solutions for challenging
    and real-world problems in the same way as the human brain operates. These efforts
    led to the emergence of ANNs.


    The range of engineering or noneg problems solved by ANNs has been continually
    increased through time. Among different applications, classification and regression
    are more investigated by ANNs. Classification and categorizing different objects,
    images, texts, speeches, signatures, videos, and so far are performed appropriately
    by ANNs. Fault detection in industrial systems and fraud and anomaly detection
    in social and finance systems are critical examples of classification problems
    that are efficiently solved by ANNs. In regression problems, function approximation,
    simulation of natural and cosmic phenomena, time series prediction, signal recovery
    and repair are some examples that can be solved by NNs.


