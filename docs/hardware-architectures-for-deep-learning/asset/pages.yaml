  md: '# 110 Hardware architectures for deep learning


    +   The scaling factor. As mentioned in Section 5.2, XNOR-Net has deployed a scaling
    factor for both weights and activations to enhance accuracy compared to BNN. Since
    scaling factor computations are complex, [14] have proposed a method to binarize
    weights and activations without scaling factor. Actually, they substitute ReLU
    layer with PRE layer to compensate accuracy loss that may arise from the elimination
    of the scaling factor. Thus, the convolutional layer can only be performed by
    XNOR-Post.


    +   The regularizer. CNNs have deployed regularizer to obtain model generalization
    and prevent overfitting. The full-precision CNNs often use the L2 regularization
    to drive weights close to zero [14]. In the BNNs, driving weights to values near
    +1 or -1 is desirable in order to achieve minor binarization error. In [16], a
    new binarization method is proposed that is appropriate for BNNs and makes the
    weights closer to +1 and -1.


    +   Multiple binarization. BNNs have just considered {-1,1} values that are encoded
    to 1-bit values (0 and 1) during the binarization process. The technique presented
    in [16] proposes to use multiple binarizations for activations to save accuracy.
    Although m-level binarization leads to mx growth in computation, they have shown
    that with m=2 for activations (two levels of binarization), the top-5 accuracy
    of ImageNet dataset grows by 5.8%.


    +   Binarizing the last layer and improving the overall compression rate. The
    studied designs, such as XNOR-Net and BNN, only binarize the inner layers, both
    first and last layers are still full precision. Binarizing the last layer leads
    to remarkable accuracy loss and difficulties in the training process [32]. A technique
    in [16] introduces a scale layer that is inserted between the binarized layer
    and the softmax function. The scalar parameter is learnable during the phase and
    is initialized to 0.001. By adding the scale layer, the compression rate increases,
    while the accuracy loss is kept negligible.


    The method presented in [16] has increased the compression rate about 3× and also
    improves the classification accuracy about 2% on ImageNet datasets in comparison
    with XNOR-Net.


    Accurate-binary-convolution network (ABC-Net) is a two-step method that tries
    to reduce accuracy of binarization [15]. First, the real values of weights are
    approximated by a linear combination of multiple binary bases, as shown in Figure
    5.11 (left). This way, binary weights can keep close to their full-precision values.
    Second, multiple binarization activations are used for inputs to reduce information
    loss, as shown in Figure 5.11 (right).


