    # 11.4.4 Impact of unideal condition


    # 11.4.1 Process variation


    For most of the applications, the output accuracy (e.g., MSE or CA) strongly depends
    on how accurately the resistive state can be set during the actual fabrication
    since there is considerable variability in this process [43]. Thus, to show the
    effect of this uncertainty on the accuracy of the neuromorphic function, we added
    random noises to the conductance of all the memristors in the network and measured
    the network error in the presence of these changes. The varied conductance was
    defined by


    > $Conductance_{Noisy} = (1 + \sigma X) Conductance_{Normal}$ (11.38)


    where $X$ is a random number that has Gaussian distribution with standard deviation
    of $\sigma$ and mean of 0 ($X \sim N[0,1]$). For this study, the considered memristor
    variations (i.e., $\sigma$) were 5%, 10%, and 20% of the nominal values of the
    conductance and 500 Monte Carlo samples were simulated. The values of the CA and
    MSE of the network outputs in presence of memristor variation are illustrated
    in Figure 11.14. As the results show, with 20% memristor variation, the average
    MSE is still below 0.009 for all of the approximate computing applications. Also,
    the maximum CA degradation due to the considered variations for MNIST and MHealth
    applications are about 2%.'
