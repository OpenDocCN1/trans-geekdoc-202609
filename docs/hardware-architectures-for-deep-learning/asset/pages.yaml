    # 5.3 BNN optimization techniques


    The BNNs and TNNs were introduced in the previous section. The main concerns of
    these methods are to reduce the computations and memory storage demand to make
    them appropriate for power- and resource-limited devices. However, accuracy loss,
    especially in large datasets, is a major challenge in this way. Therefore, many
    works have attempted to address this issue and reduce accuracy loss. In this,
    we introduce two major innovations in this line.


    The method proposed in [14] is one of the most noticeable promising approaches
    that targets reducing the accuracy loss in BNNs on large datasets. The authors
    demonstrated that the common training methods are not suitable for BNNs due to
    their inherent properties. Instead, they propose to train BNNs with both high
    compression rate and high accuracy on large datasets via the following techniques.


    +   **The learning rate.** Generally, the rate is initialized to 0.01 for full-precision
    CNNs which is known not to be appropriate for BNNs. Actually, many weights of
    the BNNs are frequently changed and their sign changes are about orders of magnitude
    more than the full-precision CNNs. They have explored and found that for lower
    rates (like 0.0001), the sign in BNNs. Then, accuracy is significantly increased
    compared with other BNNs, especially for ImageNet dataset.'
