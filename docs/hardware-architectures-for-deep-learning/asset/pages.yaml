- pgno: 179
  md: '# 154 Hardware architectures for deep learning


    neurons, N1 and N3 to one core and N4 to another core, the number of repetitive
    weights on each core is maximized.


    Grouping the neurons of each layer with maximized computation reuse is an instance
    of the well-known clustering problem in graph theory [14]. The clustering problem
    is defined as grouping a set of objects into clusters in such a way that objects
    belong to the same cluster are more similar to each other than those in other
    clusters.


    We consider neurons as objects and the vector of weights of each neuron as its
    attribute that is used as the similarity metric. The vector of weights of two
    neurons are compared element-wise to calculate their similarity. The algorithm
    maximizes similarity in each group by placing neurons that have the greatest number
    of common weights to the same group. Thus, each cluster contains neurons with
    the most possible similarity and hence, computation reuse.


    We solve this problem by the k-means algorithm. The k-means is one of the fastest
    and simplest algorithms to solve the clustering problem. Compared with greedy
    algorithms that can find optimal solutions, the k-means algorithm explores many
    combinations of neurons in a disciplined and fast manner to approach (or ideally
    reach) to the optimal clustering. The details of the k-means algorithm can be
    found elsewhere [14]. The baseline k-means algorithm puts no restriction on cluster
    size, but we slightly modified it to return clusters with a given size.


    When this offline procedure forms the clusters, neurons of each cluster are mapped
    to the same core and are ready to process input data.


    # 7.4 Experimental results


    The benchmarks in Table 7.1 are used to evaluate CORN in terms of power consumption
    and output error (accuracy loss).


    We implement two state-of-the-art neural network accelerators for the comparison
    purpose. The first method, referred to as ApproxNN [6], uses approximate multiplier
    units to trade off accuracy for power reduction. The second method, referred to
    as AxNN [7], uses sophisticated offline processing to detect the sensitivity of
    output to each neuron and sets less precision for those neurons whom the final
    output is less sensitive.


    All considered neural networks are implemented on the baseline CORN architecture,
    but the logic related to computation reuse is disabled for AxNN and ApproxNN.
    Each CORN core can keep 16 neurons each with 16 weights (N=16, K=16), and each
    table has only one replica (two copies).


    More extensive neural networks use multiple CORN cores, connected by a network-on-chip.
    We modeled the inter-core communication power consumption based on a simple mesh
    topology.


    We have implemented a simulator for CORN in C++. The training phase of the neural
    networks is carried out by MATLAB®. RTL Verilog and used a commercial synthesis
    and power analysis tool to calculate its area and power consumption in 45 nm.'
