    transfers between DRAM and PEs, and the interconnect between PEs. SCNN has three
    main features, as follows:


    +   - Planar tiled: SCNN distributes the work between its 64 PEs in the planar
    dimension. More specifically, each PE receives and holds 1/64 of each input channel.


    +   - Input stationary: Unless IFM is too large, each PE keeps one portion of
    the input during the entire execution of the CNN layer. In multiple iterations,
    the layer sequencer broadcasts kernel values for each OFM to all the PEs. Each
    PE independently computes some pixels of those OFMs. Finally, the OFM results
    are passed through ReLU and written back to the PE’s SRAM output region (ORAM).


    +   - Cartesian product: At every cycle, a vector of I nonzero input values and
    a vector of F nonzero filter values are fetched from SRAM into each PE, and the
    $I \timestimes F$ outer product is computed. These I x F numbers contribute to
    different output positions (see Figure 6.12). In the dense case, finding the output
    position for the product results is trivial. To find the output position for the
    sparse case, SCNN loads corresponding to the input and filter values, in parallel
    with loading their value. The indices are sent to the appropriate output position
    for each product. The products are then routed to the output partial sum banks
    using a crossbar.


