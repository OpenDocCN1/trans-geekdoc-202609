- pgno: 121
  md: '# 96 Hardware architectures for deep learning


    The life cycle of CNN consists of two training and inference phases. The parameters
    of CNN are learned through examining an enormous number of training datasets during
    the training phase. Afterward in the inference phase, the trained CNN is employed
    to classify data which were never seen by the trained CNN during training phase.
    The training phase usually needs tremendous computational resources for calculating
    multiple weight-update iterations on a large dataset. Commonly, training a DNN
    model is done on a powerful computer platform and may take several hours/days
    to complete, depending on the size of the datasets. The inference phase takes
    aggressively less time compared with the training phase, but many acceleration
    methods target the inference phase, because it should be carried online on a probably
    edge device with limited resources.


    Many prior researchers have proposed CNN accelerators for reducing the volume
    of computations and memory accesses with minor accuracy loss [5,6]. Most of these
    accelerators could not still meet the power and resource constraints of devices.
    Consequently, the development of efficient models is essential due to the increasing
    demands of high-quality CNNs on power-limited embedded devices [7,8]. As an effective
    approach, several methods have employed compact CNN architectures and also different
    pruning techniques to reduce the number of operations and the model size [9–11].
    These methods are comprehensively studied in Chapter 6.


    Many researchers have employed fixed point operands in lots of floating-point
    ones to reduce computation complexity [7,12]. Further, some researchers reduce
    the precision before fixed-point operands and use few bits for representing data
    to get the so-called BNNs. In fact, they apply just 1 or 2 bits to represent operands
    to aggressively reduce computation [13,14]. Due to their low power consumption
    and low complexity, BNNs are extremely appropriate for battery-embedded systems,
    Internet of Things (IoT) platforms, and wearable devices. Despite its good power/latency
    profile, applying the BNN to large datasets, like ImageNet, leads to significant
    accuracy loss. Several works have attempted to address the issue of accuracy loss
    [15,16] and also efficient hardware implementation of BNNs [17,18]. This chapter
    aims at introducing the BNN modes, studying its challenges, and presenting the
    main solutions for these challenges.


    The rest of this chapter is organized as follows. In Section 5.2, we present the
    basic concepts of the BNN model. Some major BNN optimization techniques are discussed
    in Section 5.3. Open source frameworks for BNNs are presented in Section 5.4.
    Moreover, Section 5.4 discusses the extremely customized hardware implementation
    of BNNs. Finally, we conclude this chapter in Section 5.5.


    # 5.2 Binary neural networks


    CNNs have attained state-of-the-art performance especially in lots of computer
    vision tasks. Deep CNNs require massive amount of memory accesses and intensive
    computations in the form of fixed/floating-point MAC operations. More recently,
    by implementing a wide range of services based on computer vision in embedded'
