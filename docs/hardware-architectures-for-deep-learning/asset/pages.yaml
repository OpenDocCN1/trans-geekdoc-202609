    where $W$ is the real value weight, $W_t$ is ternar weight, $n$ is the total number
    of weights in a kernel, and $\Delta$ is the threshold parameter which adjusts
    the amount of sparsity. TWN uses the deterministic function for ternarizing weights
    and obtains appropriate threshold parameters according to (5.7). However, [24]
    has considered $\Delta = 1/3$ for simple hardware implementation.


    It is worth bearing mind that using scaling factors for the weights plays a crucial
    role in attaining proper accuracy for image classification, particularly for large
    datasets [13]. Therefore, TWN mostly use scaling factors for weights. In order
    to do that, TWN just consider $|W| > \Delta$ and remove $|W| < \Delta$ for computing
    scaling factor. Therefore, the appropriate scaling factor is the average of absolute
    $|W| > \Delta$ values which is calculated as:


    ```

    $\gamma = \frac{1}{|n_{\Delta}|} \sum_{in} |X_i| \qquad (5.8)$

    ```


    where $\gamma$ is a scaling factor and $|n_{\Delta}|$ denotes the amount of $|X|$,
    which is greater than $\Delta$. TWN has achieved near state-of-the-art results
    on MNIST, CIFAR10, and large-scale ImageNet datasets, in that the amount of accuracy
    is negligible with full-precision CNNs.


