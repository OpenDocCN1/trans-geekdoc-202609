    In problems, it only needs to consider recent information to perform the present
    task, but it is very likely for the gap between the relevant information and the
    point where it is needed to be large. When that gap grows, RNNs become unable
    to learn to connect the information, because they usually keep a short memory,
    in which long-term dependencies may not fit. This shortcoming is explored and
    analyzed in depth by [8,9]. This problem of baseline RNNs led to the emergence
    of LSTM and GRU. We will describe the basics of these models in the following
    sections.


    # 2.1.1 Long short term memory


    LSTMs are a special kind of RNN, which allows the network to capture information
    from inputs for a long time using a special hidden unit, called the LSTM cell
    [10]. LSTMs emerged as an effective and scalable model for several learning problems
    related to sequential data. Earlier RNN models for attacking problems have either
    been tailored to a specific problem or did not scale to long-time dependencies.
    LSTMs, on the other hand, are general and effective in capturing long-term temporal
    dependencies.


    All repeated neural networks have the shape of a series of repeating neural network
    modules. As shown in Figure 2.3, in a baseline RNN, these repeating modules have
    a simple structure, similar to one tanh layer.


    LSTMs inherit this chain-like structure, but implement the repeating module in
    a different and more complex way (Figure 2.4). Instead of a single neural network
    layer, there are four layers interacting in a special way. Figure 2.4 shows the
    internal structure of an LSTM and how the current instance, the middle box, interact
    with the instances at the previous and next time steps. An LSTM has a similar
    control flow as a RNN. It processes data as it propagates. The major differences
    are the operations within the LSTM cells. These operations are used to allow the
    LSTM to keep or forget information.


    Figure 2.5 shows the notations used in LSTM dataflow. Each line carries an entire
    vector, from the output of one node to the inputs of others. The circles represent
    pointwise operations, such as vector addition, while the boxes are learned neural
    network layers. A line merging indicates concatenation, whereas a line forking
    content, with each copy going to a different way.


