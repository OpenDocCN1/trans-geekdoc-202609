    Li et al. proposed an FPGA accelerator for the base RNN model in [33]. The authors
    noted that for NLP applications, the number of nodes in the output layer is much
    larger than the number of hidden-layer nodes. As such, the computation of the
    output layer is often the dominating factor in the computational complexity of
    RNNs. To balance the computational workload of processing elements in an RNN accelerator,
    the proposed architecture utilizes the network in time: the computation of the
    hidden layer is done serially, while the output layer computation for a window
    of time is done in parallel. Additionally, the authors employed two design strategies
    to optimize FPGA resources: quantize network weights to 16-bit fixed-point and
    approximate nonlinear functions using piecewise linear approximation.


    In addition to the compression method proposed in [17], Han et al. present an
    FPGA accelerator designed to operate on sparse LSTM models. The accelerator operates
    directly on a compressed model by encoding the sparse matrices in memory using
    CSC format. A control unit fetches this data from memory and schedules operations.
    Operations that do not depend on each other (e.g., the activation function of
    the input gate and the pre-activation of the forget gate) are scheduled to run
    in parallel in the accelerator. The accelerator unit is composed of multiple processing
    elements, a single element-wise unit, and a single activation function unit. Processing
    elements read from their own First-in-First-out (FIFO) queue, which is fed by
    the control unit. They contain a sparse matrix read unit, which decodes the CSC-formatted
    parameter data. Matrix-vector product accumulation accomplished via a single adder
    and buffer per processing element. The element-wise unit contains 16 multipliers
    and an adder tree. The activation unit is composed of lookup tables for hyperbolic
    tangent and sigmoid functions, both containing 2,048 samples and quantized to
    16-bit format.


    Chang et al. implement a two-layer LSTM on a Xilinx XC7C020 in [31]. The FPGA
    design contains two main subsystems: gate modules and element-wise modules. Gate
    modules perform the matrix-vector multiplication and activation function computation
    for LSTM cell gates. Element-wise modules combine gate module outputs with element-wise
    multiplication, addition, and activation functions. All weights and input are
    quantized to 16-bit fixed-point format. Activation units use piecewise linear
    approximation and can be configured at runtime to perform either the hyperbolic
    tangent or sigmoid functions. Input data is fed to gate modules from a direction
    memory access (DMA) streaming unit, which has independent streams for input and
    hidden data. To synchronize the independent input streams, gate modules have a
    sync unit that contains a FIFO. Element-wise modules also contain a sync unit
    to align the data from the gate units. Results from the element-wise module are
    written back to memory through the DMA unit.'
