    # 10.5.3 NeuRAM3 hardware platform results


    The IGZO-TFT-based synapse communication IC has been measured to function up to
    about 1 MHz. This limited speed is mainly due to the use of the non-scaled devices
    in IMEC''s ultralow leakage IGZO TFT plastic technology. As mentioned already,
    this has been decided to reduce both the fabrication cost and the related challenges
    to design this prototype. Due to the inherent nature of the spiking neuromorphic
    design paradigm, the speed requirements for the spiking neurons and related AER
    spike rates are very relaxed. around 8 kHz. In order to reduce the cost, we have
    multiplexed the 8 bits (see above) to a rate of 64 kbps on the now serial ports.
    Hence, we have quite some slack with respect to the maximal rate of 1 Mbps which
    could be achieved.


    When scaling however to larger applications which higher spike rates, such as
    streaming imaging or video sequences, we will need to increase the bandwidth.
    Frankly, that is easily achievable by parallelizing the AER spike streams. as
    already indicated in Figure 10.6 however, the amount of synapse communication
    required between the local synapse arrays will never explode in an exponential
    say for realistic and well-optimized spiking application mappings. It is not predictable
    beforehand where this communication will happen, but because of the virtual dynamic
    assignment of the activations on the segmented proposal with P parallel lanes,
    we will not face bandwidth problems as not more than P concurrent local arrays
    that are situated “close” to each other to communicate. Moreover, due to the segmented
    nature, of such array clusters can be simultaneously active on the overall architecture
    where each of these have up to P lanes available.


