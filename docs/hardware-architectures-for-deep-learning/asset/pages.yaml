    for the initial model training to reach the best results in order to avoid getting
    stuck into local minima. Once the network is fully trained, it can be compressed
    using one or more well-studied techniques, such as model compression, quantization,
    and pruning (sparsity), before being used for inference.


    Researchers have shown that dense neural networks can be pruned to a sparse without
    losing accuracy. Moreover, rectified linear unit (ReLU)-based DNNs generate sparse
    input tensors, making many of the computations in a convolutional layer ineffective.
    Exploiting this input and parameter sparsity dramatically improves the hardware
    performance, and it has already found its way into commercial products. For example,
    Cambrian announced that its server accelerators can achieve 80 TFLOPS (FP16 operations)
    with only 110 W when the sparse mode is enabled, and companies like Facebook and
    Google are considering sparsity to their accelerators'' requirements [5,6].


    In this chapter, we review some of the software and hardware techniques to make
    the dense networks sparse and use it for performance boost. First, we review different
    types of sparsity methods and how they can be achieved. Then, we discuss various
    software techniques to prune a network. Finally, we review some of the hardware
    architectures that support sparsity.


    In this chapter, the input to a convolutional and fully connected layer would
    be called input channel, input feature map, input tensor, activation, and neurons,
    interchangeably. Similar style of notations is also used for outputs. Additionally,
    kernel, parameters, weights, and synapses refer to the parameters used in a convolutional
    or fully connected layer.


    # 6.2 Different types of sparsity methods


    In general, there are four types of sparsity methods, as described next.


    +   1. Activation sparsity: Activation sparsity is a result of employing ReLU
    as a nonlinear activation function [7]. ReLU zeros out all of the negative outputs
    in a tensor, both in the inference mode and during the forward pass of model training.
    Moreover, in the backward pass of model training, ReLU avoids propagating the
    error values from neurons that had negative outcomes in the forward pass (see
    Figure 6.1). Therefore, activation sparsity exists in ReLU-based DNNs in both
    inference and training modes, and it appears in the dense DNNs as well.


    While the aforementioned feature of ReLU is an advantage for hardware optimization,
    it is essentially a weakness from the software perspective. More precisely, in
    ReLU, weights do not get updated if their corresponding outcome is negative, which
    prevents updating almost half of the weights in the model. As a result, numerous
    solutions have been proposed to use a nonzero value for neurons with negative
    outcomes while applying a linear function to the positive


    > *Pruning DNNs sometimes even helps improve the accuracy [4].'
