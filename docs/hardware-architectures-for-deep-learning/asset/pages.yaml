    # 8.1 Introduction


    Convolutional neural networks (CNNs) have been widely used in various machine-learning
    tasks such as image classification. With the growing capabilities of parallel
    and distributed computing, CNNs with billions of computations per inference can
    now be trained and deployed to solve complex image classification, object detection
    and segmentation tasks. Due to the availability of specialized computation units
    and their energy efficiency, field-programmable gate arrays (FPGAs) are well suited
    for CNNs. CNN processing is compute intensive and can become bounded by the underlying
    memory system implementation. Performance of FPGAs depends upon efficient usage
    of both on-chip digital signal processors (DSPs) and block random access memory
    (BRAMs) while keeping the logic resource usage in check. This creates challenges
    in designing highly parallel circuits and their efficient mapping of FPGAs, which
    needs to be thoroughly investigated.


    In this chapter, we study the factors impacting CNN accelerator designs on FPGAs,
    show how on-chip memory configuration affects the usage of off-chip bandwidth,
    and present a uniform memory model that effectively uses both memory systems.
    A majority of the work in the area of FPGA-based acceleration of CNNs has focused
    on maximizing the throughput [1–3]. Such implementations use batch processing
    for throughput improvement [4–6] and are mainly tailored for cloud deployment.
    However, they fall short in latency-critical applications such as autonomous driving,
    drone surveillance and interactive speech recognition. Therefore, we avoid batching
    of any kind and focus on reducing the latency for each input image. In addition,
    we use of Winograd Transformations as used in [4,7] to retain flexible support
    for various filter sizes and different CNN architectures, both [4,7] are optimized
    only for 3 × 3 filter layers and lack flexibility. Furthermore, we provide complete
    end-to-end automation, including data quantization exploration by Ristretto [8].
    The efficiency of the proposed architecture is shown by studying


