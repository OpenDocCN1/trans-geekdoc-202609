  md: '# 38 Hardware architectures for deep learning networks on graphics units


    One promising approach is to run neural networks (GPU). Containing thousands of
    processing cores, GPUs provide massive parallelism that can speed up matrix-vector
    operations by orders of magnitude. GPUs have become a popular tool in the deep
    learning community; in fact, major GPU manufacturers have begun adapting the design
    of their GPUs specifically to deep learning applications [10]. Many machine learning
    frameworks support GPUs and offer seamless GPU integration through their back-end
    computational engines. At runtime, if the engine sees that a GPU is present on
    the machine, it will automatically offload the neural computations to it. Although
    neural networks can be implemented on the GPU by writing custom CUDA code, but
    due to highly optimized GPU libraries for deep learning, such as cuDNN [15], many
    parts of the flow can now be done automatically.


    There are few disadvantages associated with the GPU-based approach. The first
    is the high cost of the device—high-end GPUs cost thousands of dollars [16]. While
    this is a non-recurring cost, it may be too high for a entry, especially for individuals.
    The main drawback is the high power usage of GPUs. For a complex neural network-based
    speech recognition algorithm, a GPU implementation could require twice the amount
    of power required by its CPU-only counterpart [17]. While total energy consumption
    for a particular task may be lower on a GPU than on a CPU, the high-power requirement
    of a GPU may be prohibitive for some platforms—especially for embedded systems.
    In order to meet performance requirements while meeting the cost and energy/power
    consumption constraints, it is often necessary to design custom hardware for accelerating
    inference.


    # 2.2.2 Hardware implementation


    In general terms, a custom hardware solution that is designed after the computation
    pattern of a specific application is called an application-specific integrated
    circuit (ASIC). In contrast with general purpose CPUs and GPUs, which are designed
    to handle a large variety of tasks, ASICs are designed to perform a specific function
    or a specific class of functions. ASICs contain only the data paths required to
    perform their specified function, and for this reason, ASICs can be highly optimized,
    in terms of computational throughput and energy efficiency. For example, a recent
    study shows that an ASIC designed for accelerating a neural network-based computer
    vision achieved 13× faster computation and 3,400× less energy consumption than
    a GPU-based solution [18].


    In general, the less variability in an algorithm, the better and simpler hardware
    implementation can be obtained. Inference in all neural network models has several
    properties that make it well-suited for a hardware-optimized implementation:


    +   1. There are a fixed number of computations performed in each forward pass
    through the network. This allows the hardware designer to choose the appropriate
    amount and type of computational units, such as adders and multipliers.


    +   2. Matrix–vector multiplications of the neural networks is easily parallelizable—each
    element of the vector product relies on a separate row of the parameter'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'matrix, and so these output terms be computed independently of one another.


    +   3. The model parameter values are fixed and known at run-time. This opens
    up the opportunity for various compression schemes and quantization approaches,
    which reduce the amount and size of the parameters in memory.


    +   4. In addition to the number of computations being fixed, the order in which
    they are performed, and thus the order in which data is accessed, can be fixed.
    Having a predictable data-access pattern allows memory operations to be optimized,
    either through the interface to off-chip DRAM or in the properties of on-chip
    SRAM.


    Once an architecture is developed, the process of designing digital hardware writing
    in a hardware description language (HDL) to describe the structure and behavior
    of a circuit. Unlike most software languages, which describe a sequential procedure
    to be executed by a CPU, an HDL adopts a concurrent model of computation, i.e.,
    describes operations being done in parallel. The process of writing and testing
    HDL can be both difficult and time-consuming, requiring a special skill set and
    domain knowledge. Because of this, designing custom hardware to accelerate inference
    carries a nonrecurring engineering cost. Additionally, once an ASIC has been fabricated,
    its design and functionality is fixed. Any modification to the design requires
    a full re-fabrication cycle and replacement of existing devices, which can be
    expensive.


    Field-programmable gate arrays (FPGAs) present a solution to hardware design that
    offers more flexibility than an ASIC. These devices contain a large, interconnected
    array of programmable units, which can be reconfigured to implement complex digital
    circuits. These programmable units are given different names in products, among
    them configurable logic blocks (CLBs) the most common. They also contain memory
    (RAM) and multiply-add units (also known as DSP units) that are connected to the
    CLBs. The architecture of a typical FPGA is shown in Figure 2.15. While they offer
    lower energy efficiency and performance than ASICs, they still significantly outperform
    CPUs and GPUs in energy efficiency (and in some cases performance). In a prior
    work, it has been shown that the FPGA-based hardware accelerator for a speech
    recognition application achieved 43× and 197× better speed and energy efficiency,
    respectively, than a CPU implementation and 3× and 14× better speed and energy
    efficiency, respectively, than a GPU implementation [17].


    The rest of this chapter will present a survey on some recent custom hardware
    accelerators for the LSTMs model.


    # 2.3 Hardware implementation of LSTMs


    Several previous studies have addressed the problem of implementing LSTM network
    inference in a hardware-friendly manner. Complete solutions to this problem should
    address three issues: reduce the amount of data and parameters by compressing
    the model, optimize the dataflow for the hardware platform, and finally optimize
    the memory usage.'
