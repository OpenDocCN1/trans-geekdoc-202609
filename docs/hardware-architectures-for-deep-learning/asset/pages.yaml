    # 10.6 Summary and conclusions


    Our main objectives in this chapter are to demonstrate that it is feasible to
    design realtime streaming biomedical platforms which enable on-line adaptive signal-processing
    capabilities for biomedical wearable systems. In order to arrive at a very low
    system energy, we have introduced mixed-signal spiking neuron circuits embedded
    in a local synapse array. That is combined with a dynamic global synapse network
    effectively supporting the spike communication between the local arrays. The latter
    enables the scalability we need to extend this platform to applications requiring
    millions of neurons and synapses.


    The architecture concepts for the global synapse network are based on the use
    of dynamic segmented bus topology, optimized for the use in the neuromorphic context.
    This approach is illustrated here for a realistic ECG application. It enables
    a high scalability with a guaranteed minimum bandwidth across all the synaptic
    routes between neurons. And it also supports a very low dynamic energy due to
    the optimized use of the segmentation. That will be further enhanced when we use
    3D technologies to realize this synapse communication fabric. In order to further
    reduce the total energy, we have used an ultralow leakage IGZO TFT technology
    combined with the proper circuit techniques.


    To enable algorithms that can adapt themselves on-line to individual patient data,
    we have extended liquid state machines. This is also demonstrated for a realistic
    wearable ECG application. These features are not achievable with current algorithms
    nor platforms.


