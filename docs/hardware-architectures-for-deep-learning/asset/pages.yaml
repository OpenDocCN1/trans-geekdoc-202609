    # 6.4.3.2 Bit-Tactical


    TCL is another proposal that targets sparsity for inner-product architecture.
    TCL is built on top of a dense architecture that performs a matrix-by-vector multiplication
    (MVM) using multiple inner product unit (IPU), in each tile (see Figure 6.6).
    A CNN layer output can be computed as series of such MVM operations. Moreover,
    multiple MVMs are needed to calculate one output neuron, hence MVM results are
    accumulated for multiple cycles. Figure 6.6 shows how each IPU computes one output
    in four cycles. As it is shown, how many multipliers are idle with weight and
    activation tensors are sparse. TCL offers two solutions to keep multipliers busy,
    thus, improving efficiency. In the first solution, if the current weight is zero,
    TCL will fetch the next nonzero weights from later cycles to the the same output.
    This approach carries weight lookahead of N, if looking ahead up to N cycles is
    permitted. Figure 6.6 (top) shows how weight lookahead of 1 can increase throughput.
    Note that fetching a weight from later cycles requires fetching its corresponding
    activations as well. Hence, lookahead of N increases activation fetch bandwidth
    by a factor of N. In addition, an N-to-1 multiplier (MUX) is needed per multiplier
    to pick the right activations. Since sparsity is known before deploying, the signals
    for these MUXs are off-line. In the second solution, TCL allows a lane to borrow
    weight from its neighbors. This approach is called lookahead and an (h+d+1)-to-1
    MUX is required per multiplier. Figure 6.7 (bottom) shows how lookahead of 1 combined
    with lookahead of 6 can improve utilization.


    According to [19], weight lookahead of 1 and lookahead of 6 can improve utilization
    by more than 60%.


    # 6.4.3.3 Neural processing unit


    Recently, researchers from Samsung proposed a hierarchical NPU that supports weight
    sparsity. (1) computes multiple output feature maps (OFMs); (2) in each OFM, it
    computes a 4x4 region; and (3) it divides input feature maps (IFMs) between multiple
    units and reduces their result, at the end.


    NPU is hierarchical. On the highest level, NPU has two cores each of which is
    responsible for half of the input channels. Inside each core, there are two data
    storage units (DSUs) that store one quarter of IFMs and their corresponding weights.
    Each core also has 12 dual MAC Arrays (dual-MAAs) with 32 multipliers and 16 sum
    registers. The 16 sum registers hold the partial sum of a 4x4 cell of one OFM.
    Each dual-maa receives two 4x4 cells and their corresponding weights.


