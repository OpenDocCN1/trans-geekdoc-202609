  md: '# An introduction to artificial neural networks


    To learn such networks, the former learning rules (developed for simple structure
    networks) cannot be applied for this model. For this purpose, it has been shown
    that applying gradient-based methods (e.g., error back propagation [7]) or evolutionary-based
    methods (such as genetic algorithms [8]) can train the network appropriately.
    In gradient-based methods, it is essential to use derivable activation functions
    as bipolar or sigmoid functions.


    # 1.3.2 Autoencoders and stacked RBMs


    To handle the case when there are correlations among different dimensions of the
    input patterns, it is required that the network input patterns to some space with
    a sufficiently lower dimension. In certain cases, if the dimension reduction is
    not applied, the partitioning and mapping of the input patterns may suffer from
    overfitting and the network misses its generalization for new incoming patterns.
    Autoencoder networks [9] and restricted Restricted Boltzmann machine (RBM) [10]
    are two networks with the data-encoding capability. In these networks, in order
    to remove correlations, a variant of nonlinear principal component analysis (PCA,
    [11]) is performed, where the null spaces are removed to get a maximum variance
    space. Figure 1.18 shows a diagram of a typical autoencoder.


    In the autoencoder model, the network includes two sequenced parts: encoding and
    decoding. The encoding part performs the dimension reduction. The decoding part
    is added to reconstruct the former inserted patterns and ensure that no information
    from input patterns is lost due to encoding.


    Another alternative network for dimension reduction is RBM. An RBM is a simple
    two-layered network (including visible and hidden layers) by which an encoding
    algorithm is performed. The model RBM is trained in a bidirectional state. Actually,
    the given input pattern (as a visible layer) should make a hidden layer with a
    lower dimension than the initial input pattern that can retrieve the initial input
    pattern. By stacking some RBMs, the dimension of the input patterns is reduced
    accordingly [12]. Figure 1.19 shows a sample RBMs encoding flow.


    To train autoencoders in an unsupervised manner, the encoding and decoding parts
