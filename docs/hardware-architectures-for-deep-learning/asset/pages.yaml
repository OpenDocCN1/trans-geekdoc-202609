    # 2.3.1 Model compression


    The first step in the design of a hardware architecture is selecting the data
    format and bit precision of the numbers, and if needed, a model compression strategy.
    This step determines the required computational elements, the memory requirements,
    and ultimately the performance and throughput of the system.


    Parameter compression can significantly reduce the memory footprint and computational
    complexity of the inference computations. Several methods have been proposed for
    neural network model compression. These methods are generally classified into
    parameter reduction and parameter quantization approaches. The former approach
    reduces the number of parameters needed to represent the model, while the latter
    reduces the number of bits needed to represent model parameters.


    The pruning technique reduces the number of parameters by removing (i.e., setting
    to zero) unnecessary weight connections. After training, model parameters with
    an absolute value below some threshold are removed. Then, the sparse model is
    retrained using the remaining connections. The retained model may be pruned and
    retrained again in order to achieve the desired level of sparsity.


    Pruning is a well-studied method in feedforward and convolutional neural networks.
    Using this technique, Han et al. demonstrated 9× and 13× reduction in number of
    parameters for two well-known convolutional networks [19]. Building upon this
    approach, Han et al. also proposed a hardware-friendly pruning method,'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Hardware acceleration for recurrent neural networks


    called load-balance aware pruning [17]. This method facilitates the distribution
    of the processing workload by constraining regions of the parameter matrices to
    contain an equal number of nonzero connections. After pruning, the memory footprint
    of the model parameters is reduced using sparse encoding methods, such as compressed
    sparse column (CSC) or compressed sparse row (CSR). Some accelerators have been
    designed to operate directly on sparse encoded models and efficiently skip zero-valued
    connections [17,18].


    Singular value decomposition (SVD) is another technique for reducing the number
    of model parameters. By keeping just the largest values, the dimensionality of
    parameter matrices can be reduced while maintaining an acceptable level of accuracy.
    In [20], SVD is applied to a fully connected layer of a convolutional network
    and achieved a compression rate of 7x with only a 0.04% loss in prediction accuracy.
    In [21], this technique is applied to a five-layer LSTM for speech processing
    and reduced the model size by 3x with only a 0.5% loss in prediction accuracy.
    An advantage of this approach is that it does not require special encoding (and
    consequently memory) to store the compressed model; this translates to simplified
    accelerator architecture because the parameter structure does not have to be decoded.


    A common technique to quantify parameters is weight sharing. With this, a small
    number of effective weight values are identified using k-means clustering. The
    cluster. After training, similar weights are identified using [19]. The centroid
    of a cluster is then chosen to be the shared weight value. The quantized model
    can then be retrained using only the shared weights. This technique allows parameter
    matrices to be stored as indices into the shared weight codebook, thus reducing
    the memory footprint. For example, a weight sharing with 32 shared weights requires
    only 5 bits to enable on-chip parameter storage in their hardware accelerator
    for fully connected layers [18]. A benefit to this approach is that it does not
    restrict the datatype of the actual weights; high-precision datatypes be used
    for computation with minimal storage requirements.


    Another quantization technique is binary (+1 or -1, this method constrains all
    weight values during training requiring only a single bit to represent. An extension
    of this technique applies the same quantization on layer activations. Various
    approaches have been proposed for training a neural network with binary weights
    and activations [22–24]. The approach detailed in [24] was applied to an LSTM
    for text prediction and resulted in better performance and performance efficiency
    with negligible loss in prediction accuracy, compared with that of the full-precision
    model. Binarization comes with significant advantages for hardware implementation.
    In a weight-only binary scheme, multiplication is reduced to a two’s complement
    operation, thus eliminating the need for expensive hardware multipliers. Weight
    and activation binary simplify hardware implementation even further, requiring
    only XNOR and bit-count operations in place of multiplicity accumulations. In
    both schemes, model parameter size is drastically reduced.


    For many deployed deep learning applications, both time and power consumption
    is off-chip memory access. Han et al. propose a three-stage model compression
    and quantization method that dramatically reduces the'
