  img_proc: true
- pgno: 122
  md: '# Binary neural networks


    devices, exploiting CNNs on the smartphones and other handheld devices are gaining
    more and more attention. Some important services include object detection and
    localization, image classification, image to text conversion, and face recognition.
    Moreover, the CNNs are also commonly used in the IoT edge devices that have limited
    memory and power budgets. Thus, decreasing the CNN computations has become an
    essential challenge.


    Generally, BNN has been proposed to eliminate MAC operations by binarizing weights
    and/or activations. In this model, only two values are deployed for weights and/or
    activations (not definitely 0 and 1). Although this approach significantly lessens
    the amount of computations, it leads to growing accuracy loss, especially for
    large datasets, ternary neural networks (TNN) are also proposed with the purpose
    of reducing accuracy loss through adding an extra state to weights or/or activations
    over the BNNs.


    In the following parts, first, we comprehensively discuss binary and ternary neural
    weight (TNN) networks with binarized and ternized weights, respectively. Afterward,
    we binarized and ternized neural networks which have outstripped previous approaches
    by applying binary and ternary activations, respectively.


    # 5.2.1 Binary and ternary weights for neural networks


    Three steps can be considered for stochastic gradient descent (SGD) process, which
    is one of the major training methods for neural networks. Step 1: Forward propagation
    that computes the units in a layer-by-layer manner and finally obtains the output
    of DNN by taking DNN input. Step 2: Backward propagation that computes the training
    objective''s gradient regarding activations of each layer by taking the DNN target.
    Backward propagation act contrary compared with forward propagation and starts
    from the top layer and goes down to the first layer. Step 3: Parameter update
    that computes the gradient with regard to each layer''s parameters and then updates
    the parameters using obtained gradients and previous values.


    The method proposed in [19] introduces an approach called BinaryConnect that constraints
    the weights just +1 or -1 values during the forward (step 1) and backward (step
    2) propagations. respectively. Generally, -1 and 1 are encoded to 0 and 1 binary
    values. Mostly, MAC operations are substituted with simple additions or subtractions.
    It should be mentioned that since parameter changes are tiny, maintaining full-precision
    weights during the parameter updates (step 3) is essential. Besides, after right
    weight update, the real value weights must be clipped within the [-1,1] interval
    to prevent growing weights.


    Selecting an efficient binarization method is one of the most critical issues
    in designing a binary network. As mentioned earlier, in the BinaryConnect, the
    real-valued weights (w) are replaced by -1 or +1. Mostly, for binarizing weights,
    deterministic and stochastic binarization functions are used which are demonstrated
    in (5.1) and (5.2), respectively:


    ```

    wb = \begin{cases} +1 & \text{if } w \ge 0, \ -1 & \text{otherwise} \end{cases}
    \quad (5.1)

    ```'
