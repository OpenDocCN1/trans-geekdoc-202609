    just prune the computations that are related to zero weights. The worst case is
    when all weights are nonzero, where all computation resources are similar to BinaryConnect.
    Sparse ternary connect (STC) [24] has introduced the ρ parameter ($0 \le ρ \le
    1$) to adjust the amount of sparsity in zero values. In this model, $N=|W| \times
    ρ$ is the number of weights in a kernel that must be zero. Therefore, STC proposes
    an architecture that is more resource-efficient compared with the previous works.


    STC has explored the design space of ρ parameter on CIFAR10 to find the appropriate
    accuracy. It has shown that the accuracy degradation is pretty negligible when
    $ρ=0.5$, hence it can drop half of the elements of the weight matrix. STC has
    deployed (5.5) and (5.6) to ternize weights during the training and test phase,
    respectively. It should be mentioned that $\Delta$ is considered $1/3$ to ensure
    simple implementations of the inference phase in hardware. Although the STC method
    leads to slight accuracy degradation, its impact on increasing the network sparsity
    reduces the computation resource from 20.07% to 44.78%.


    According to many reports, the latency of the access to different levels of the
    memory is about $4\times400\times$ greater than that of an integer operation.
    Memory access also consumes more energy than computation. NullNet [14] has introduced
    a method to eliminate the memory accesses required for the model parameters (weights)
    during the test stage. While the neural network is trained with binary activations
    and full-precision weights. Since both the inputs and outputs of all layers are
    binary, the output of a neuron can be implemented by a Boolean function. In other
    words, the dot product of neuron''s inputs is replaced with logic gates via synthesizing
    Boolean expression. Thus, there is no need to read weight parameters from memory
    during inference phase. For better understanding, an efficient realization of
    a neuron by logic gates is demonstrated in Figure 5.1.


    NullNet is evaluated on the MNIST dataset with two different neural networks including
    multilayer perceptron (MLP) and CNN. NullNet has obtained classification accuracy
    near the full-precision CNNs while reducing the amount of energy, implementation
    resources, and memory accesses considerably.


