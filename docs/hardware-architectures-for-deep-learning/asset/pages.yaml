    # 6.4.5.2 Uniform Serial Processing Element


    While zero and negative inputs to the ReLU activations capture a significant amount
    of unnecessary operations, there are other computation reduction opportunities.
    Authors in [32] extend the definition of ineffective output neurons (iEON) to
    be activations that have no influence on the subsequent layers that are “removed”
    by ReLU as well as max pooling operations. Skipping all iEON operations brings
    better performance speedup. Their proposed prediction-based scheme first computes
    higher bits of input activations and/or weights in the prediction stage in the
    rational that activation outputs are mainly dominated by the multiplication of
    the highest bits which determines the outputs to ReLU or max pooling. The prediction
    results are written into two tables (RELUTable). Minimum number of the highest
    bits required to perform predictions can be different for different layers and
    are determined. To be reuse the computation results as well as the hardware incurred
    in the prediction stage, serial multiplier architecture is used. So, regardless
    of the number of the highest bits computed in the first stage, the unified hardware
    as shown in Figure 6.14


    Serial multiplier takes multiple cycles to finish multiplication of all bits.
    This chapter introduces other dimensions of parallelism by deploying PEs to simultaneously
    process OFMs and multiple pixels in each OFM to scale the architecture. If activations
    and weights are broadcast to two dimensions of the PE array, PE idle cycles are
    unavoidably introduced due to uneven and random distribution of EONs on OFMs.
    Completely breaking data sharing dependency may memory bandwidth a bottleneck.
    To overcome this synchronization issue brought by input and weight sharing, the
    authors use only one type of data sharing in the execution stage. Weight (or kernel)
    sharing is employed when computing a convolutional layer followed by max pooling
    due to the fact that the number of OFMs is almost the same. On the other hand,
    for convolutional layers followed by ReLU activations where the number in each
    OFM varies, input sharing is employed because the total number of EONs at the
    same pixel locations is nearly the same across different OFMs. In either case,
    data loading and assignment time should be able to overlap with data processing
    time, proportional to the number of least significant bits in the execution stage
    to keep all PE’s fully used.


    ![](img/e6e752b99eb1621488c89445a57e2a86_164_0.png)


    Figure 6.14 Unified serial PE structure [32]'
