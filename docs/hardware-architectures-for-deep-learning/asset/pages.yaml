  md: '# 194 Hardware architectures for deep learning


    # 9.2 Background on CNN


    CNNs are constructed from multiple computational layers formed as directed acyclic
    graph (DAG) [8,9]. Each layer extracts an abstraction of data provided in the
    previous layer, called a feature map (fmap). Most common layers are pooling (POOL),
    convolution (CONV) and FC.


    In CONV layers, as illustrated in Figure 9.3, two-dimensional (2-D) filters slide
    over the input images/feature-maps (Ifmaps) performing convolution operation to
    extract feature characteristics from local regions and generating images/feature-maps
    (Ofmaps).


    Equation (9.1) illustrates how the CONV layer is being computed:


    ```

    $$(C-1) (R-1) (R-1)\nOf[z]u[x][y] = Bias[u] + \sum_{k=0}^{C-1} \sum_{i=0}^{R-1}
    \sum_{j=0}^{R-1} f[z][k][Ux+i][Uy+j]W[u][k][l][j]$$

    ```


    ```

    $0 \le z \le N; 0 \le u \le M; 0 \le x, y \le E; E = \frac{H-R+U}{U}$$

    ```


    where Of is the Ofmap, If is the Ifmap, W is the filter weight vector and Bias
    is a 1-D bias that is added to the results.


    Computation of CONV layer in popular CNNs accounts for more than 90% of the overall
    operations and requires a large amount of data movement and memory operations
    [10]. In addition, the large size of Ifmaps, Ofmaps and partial results, which
    are generated during the CONV processing, increases the memory requirements and
    requires large portion of the accelerator hardware


    ![](img/e6e752b99eb1621488c89445a57e2a86_219_0.png)


    Figure 9.3 Computing one CONV layer using input Ifmap/image and filters to produce
    the output (Ofmaps)'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Iterative convolutional neural network 195


    area to be dedicated to various forms of memory structures, including global buffers,

    various First in First out (FIFO) and local register files. Depending on the type
    of data

    flow, the proportion of memory requirement in different levels of memory hierarchy

    changes [11].


    After every CON layer, a nonlinear operation is applied to each Fmap pixel

    to introduce nonlinearity in the network. An example of such nonlinear operator
    is the

    rectified linear unit that replaces all negative pixel values by zero. Other nonlinear

    functions include Tanh and Sigmoid operators.


    Some other CNN architectures also require the normalization (NORM) layer;

    hover, usage of NORM layer has been reduced in CNNs [4].


    POOL layers perform down-sampling along the spatial dimensions of Fmaps

    partitioning them into a set of subregions and combining the values in each subregion

    to a single value. Max-pooling and average-pooling are examples of POOL opera-

    tors which use the maximum and the average values for each subregion, respectively.


    The outputs from the CONV and POOL layers represent high-level features of

    the input image. Each CNN includes multiple CONV, nonlinear and POOL layers

    with their outputs fed to FC layers. FC layers combine all neurons in the previous

    layer and connect them to every single neuron in the next layer. FC layers fuse
    the

    features extracted from the CONV to generate a relational representation of these

    features with respect to each class in the classifier detection set. In the last
    layer,

    a softmax classifier uses the outputs of the last FC to produce normalized class

    probabilities for various classes. Softmax classifier is a multi-class version
    of the

    binary logistic regression classifier, which produces un-normalized log probabilities

    for each class using cross-entropy loss.


    # 9.3 Optimization of CNN


    In the literature, various optimization approaches have been proposed to reduce
    the

    ational complexity and to enhance the energy-efficiency of the CNN architec-\ures,
    including Tensor decomposition and low-rank optimization [12,13], parameter

    compression and exploitation of sparsity [14], binarized neural networks [15–19],
    and

    precision reduction of weights and neurons by fixed-point tuning and quantization

    [20–24].


    Other works focus on deploying a dynamically configured structure that

    allows the complexity of CNN to be adjusted in the run-time. All of the aforementioned

    approaches are orthogonal to the dynamically configured CNN discussed in this

    chapter, which modifies the structure of the network and could be applied to iterative

    CNN (ICNN) as well. A summary of these approaches is described in the sequel.


    In [25], a dynamic approach is proposed that breaks the CNN into partial net-

    works. In this approach, based on classification confidence of partial networks,

    the active channels per layer is adjusted. This allows the CNN to be partially

    or fully deployed. While this approach reduces the computation for classification
    of

    a large number of images, the memory footprint required to keep all the intermedi-

    tate features in the case of non-satisfactory confidence results from partial
    networks'
