    The novel ideas that will be discussed in this chapter are mentioned in follows:


    +   1. We present a highly reconfigurable OpenCL accelerator architecture that
    supports all convolution filter sizes and fully connected layers (FCLs). This
    is achieved by exploring data reuse strategies with optimal loop coalescing. As
    a result, synthesized with enough resources, different CNNs can be run without
    reprogramming the FPGA. We call this cross-network support.

    2. We propose a unified memory model which is used to derive a precise analysis
    of total execution cycles. Experimental results show that our policy is highly
    accurate for both compute-bound and memory-bound layers with a maximum of 3.99%
    difference on onboard tests.

    3. We achieve a near theoretical performance efficiency of 95.8% on VGG which
    outperforms all implementations, including hand-tailored designs for specific
    CNNs. We also achieve more than 2× latency improvement over the state-of-the-art
    results on Intel’s Stratix V GXA7 FPGA.

    4. Finally, we present FCaffe, an end-to-end automated synthesizer that requires
    minimal user intervention.


    # 8.2 Brief review of efforts on FPGA-based acceleration of CNNs


    In recent years, the research community has put forth a number of efforts toward
    CNN acceleration using FPGAs. Zhang et al. [3] utilized tiling schemes and architecture
    optimization based on a outline model. They concluded off-chip memory bandwidth
    to be the primary performance bottleneck, ignoring impacts of the onchip bandwidth.
    Suda et al. [13] built regression models to predict resource usage and genetic
    algorithm to optimize runtime. They ran global optimizations to directly minimize
    the runtime. Since then, researchers have also realized the importance of on-chip
    bandwidth and sequential accesses for taking full advantage of the off-chip memory
    as access requests in continuous bursts off-chip DRAM latency. Consequently, works
    like [2] explored on-chip bandwidth by considering data requirements of parallel
    computation units, while authors in [4,6] studied the impact of stream bursts
    as well. Further, in [14], authors considered bandwidth balancing by presenting
    a code balance term, which is similar to computation-communication ratio used
    in [3], and defined as the ratio of available on-chip or off-chip bandwidth to
    maximum required accelerator bandwidth. They compare different ratios of these
    terms for both memory types to determine computation bottlenecks. While this allows
    looking at potential performance impacts due to unmatched bandwidths, they do
    not consider optimizations based on imbalance as the terms are fixed for FPGA
    platform and CNN type. Therefore, an optimization scheme that examines the complete
    impact of the implemented memory hierarchy and parallel computation units still
    needs to be explored.


    Another important problem that needs consideration is processing element (PE)
    architecture. Almost all proposed architectures can be categorized in three


