  md: '# 54 Hardware architectures for deep learning


    also the high-rate communication, the processing nodes of the accelerators are
    commonly arranged as a many-system-on-chip (SoC) connected by a network-on-chip
    (NoC) [7,8]. Each node contains one or multiple neurons. The deployment of a high-throughput
    interconnection network helps to reduce the cost of data movements between the
    neurons, enabling the accelerator nodes to approach their maximum neural information
    processing throughput. This chapter aims at introducing an efficient interconnection
    network for NN accelerators.


    Some prior work proposed NN accelerators using shared bus topology, since bus
    provides a simple and low-cost interconnection network [9,10]. Although being
    a proper solution for small-scale systems, the non-scalable power consumption
    and performance of the bus becomes a bottleneck, when the size of NN grows. Therefore,
    recent work proposed replacing bus with more scalable NoC topologies [7,8]. These
    NoCs showed promising results in handling the heavy traffic load of interlayer
    communications.


    In typical SoCs, the on-chip interconnection network plays a key contribution
    in the total latency, power consumption, and hardware cost of the system. The
    mesh topology, as the most common interconnection network topology, often delivers
    a fair performance while keeping the implementation cost relatively low. In a2D
    mesh, each node is connected to its immediate neighbors in four directions: north,
    south, east and west. The regular and layout-friendly structure of mesh makes
    it a proper topology for on-chip implementation in terms of floor planning and
    circuit-wiring. However, when the size of the network grows, the average message
    hop-count of mesh increases proportionally. Particularly, in diagonal routes,
    where a traffic flow is established from one corner to the opposite corner of
    the network, packets must travel many intermediate routers. Consequently, for
    large sizes, the number of hops translates to a substantial increase in the network
    latency.


    In addition to the hop count problem, the mesh topology suffers from poor communication
    support, when it comes to handling the multicast and broadcast traffic flows.
    The inherent layer-wise structure of NNs imposes heavy multicast and broadcast
    traffic flows. These traffic patterns are not naturally suited to the baseline
    mesh interconnections. This mismatch has been reported in several prior studies.
    For example, the authors in [11] showed that 10% broadcast traffic reduces the
    maximum throughput of mesh by 3×. To solve this problem, recent work proposed
    heuristic methods to enable the mesh network to support collective communications
    (multicast and broadcast) [11,12]. However, there is still a great gap between
    the multicast/broadcast throughput of mesh with the bandwidth demand of the NN
    accelerators. This highlights the need for developing and customizing new topologies
    with inherent multicast/broadcast support for the traffic pattern of NNs.


    In this chapter, we present ClosNN [13,14], a specialized NoC for NNs based on
    the well-known Clos topology. Clos is perhaps the most popular Multistage Interconnection
    Network (MIN) topology. Clos is used commonly as a base of switching infrastructures
    in various commercial telecommunication and network routers and switches [15].


    MINs, the most important class of indirect networks, are layer-wise interconnections
    where each layer is composed of several switches. Packets pass the network'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Feedforward neural networks on massively parallel architectures


    layer-by-layer until reaching the output layer, to which the destination nodes
    are connected. Connected to crossbar switches, MINs have lower implementation
    cost, to replace the crossbar when a large number of nodes/links be interconnected.


    To design an efficient interconnection network for NN accelerators, the first
    step is to extract the traffic characteristics of NNNs. Our observations show
    that the traffic pattern of neurons exposes three distinguishing characteristics
    as follows:


    +   - Multicast and broadcast: In feedforward multilayer NNNs, multicast and broadcast
    flows comprise the most part of the traffic, because each neuron sends its output
    to all neurons in the next layer. According to the fact that multiple neurons
    are mapped to one processing node, there are several multicast and broadcast flows
    between the nodes of an accelerator to send the output of a neuron to the nodes
    where the target neurons are mapped.

    - Predictability: The design-time predictability of these helps to improve the
    communication latency and throughput by design-time mapping and scheduling techniques.
    By considering the structure of the NN (number of layers and number of neurons
    in each layer), we can predict when a multicast or broadcast flow has to be established.

