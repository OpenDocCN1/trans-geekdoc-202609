    # 2.1.2 Gated recurrent units


    The GRU model [11] is one of the most used RNN models that can be considered a
    variation of the LSTM. Among several changes that GRU makes on the baseline LSTM,
    its major modifications are twofold. First, it combines *forget* and *input* gates
    into a single *update* gate. Second, it also merges the cell state and hidden
    state. The resulting model (Figure 2.14) is simpler than standard LSTM models.
    GRUs have two gates: reset gate and *update* gate. Reset gate determines how to
    combine new input to the previous memory and *update* gate decides what information
    to throw away and what new information to add.


    Equation (2.9) describes the behavior of this model, where $x_t, h_t, z_t, r_t$,
    and $\hat{h}_t$ represent input vector, output vector, update gate vector, rest
    gate vector, and current memory state:


