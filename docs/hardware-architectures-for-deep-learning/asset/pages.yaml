    or ternarization a form of regularization which can improve the model generalization.
    Therefore, it improves the accuracy similar to Dropout [22] and DropConnect [23].


    TWN with weights constrained to $-1, 0,$ and $+1$ are proposed to achieve high
    accuracy compared with BinaryConnect while standing good model compression rate
    [19]. It should be mentioned that 2-bit storage is required for weight, hence
    TWN achieves a model compression rates of $16 \times 0.5$, compared with the conventional
    CNNs (32-bit floating point precision) and the BinaryConnect model, respectively.
    Although TWN increases memory storage, it reduces the amount of computation that
    arises from 0 values in weights. To put it simply, 0 increases sparsity in the
    neural network and lead to eliminating computational operations.


    Similar to BinaryConnect, TWN removes all multiplications in the forward pass
    and substitutes MAC operations with additions and subtractions. Mostly, deterministic
    and stochastic ternization functions are also used for ternar weights which are
    demonstrated in (5.5) and (5.6), respectively:


    ```

    $W_t = \begin{cases} +1 & \text{if } W > \Delta, \ 0 & \text{if } |W| \le \Delta,
