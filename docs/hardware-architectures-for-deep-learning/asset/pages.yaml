    # 8.7 Library design and architecture implementation


    HLS frameworks like OpenCL provide fast design cycles, however they require more
    on-chip resources. Consequently, hybrid implementations like RTL-OpenCL [5] and
    System Verilog-OpenCL [14] have emerged in literature. We design modular OpenCL
    kernels motivated by RTL type of functionality. This gives us several advantages.
    Each OpenCL kernel runs independently which gives us full concurrency and pipelined
    parallelism. This is helpful in effective use of dual buffering and also helps
    in reducing any inter-kernel communication stalls. modularity helps us with easily
    plugging of different layers implemented as separate OpenCL kernels. A complete
    OpenCL kernel can be removed before synthesis if that function is not required
    for a particular CNN. it allows us to easily load a subset of kernels. This is
    required for cases such as when PL is not stitched directly on top of CL and must
    be computed separately, which is common in GoLeNet.


    # 8.7.1 Concurrent architecture


    Figure 8.7 shows an overview of the designed architecture. Input, weight and output
    loads/stores are loaded by their respective kernels named Load IFM, Load Weights
    and Load/Store OFM which interface to the off-chip memory controller. Buffered
    IFM random data access and flow control is provided by IFM0 Reuse and IFM1 Reuse
    kernels which implement dual-buffering. Weight data is loaded from off-chip memory
    which is simultaneously provided to computation and cached into on-chip buffers
    for reuse. Partial OFM sums are always produced and accessed in sequence, which
    allows us to structure OFM buffers as FIFOs. This reduces address-generation complexity.
    FIFO input access and output data redirection are provided by individual low'
