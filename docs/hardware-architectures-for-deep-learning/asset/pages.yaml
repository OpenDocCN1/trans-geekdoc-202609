  md: '# Iterative convolutional neural network 197


    Using ICNN requires a methodology for subsampling the input image for the use
    of each iteration. Preferably, each subsample is obtained using a different sampling
    method to push each smaller network (uCNN) to learn new features that are not
    extracted in the previous iterations. For this reason, discrete wavelet sampling
    could be applied to input images to decompose into various input sets (bands).
    The classification is then initiated by digesting the first subsampled as input
    in the first iteration. Upon completion of first computational round (uCNN), the
    classification confidence is tested. If the confidence is unsatisfactory, it could
    be progressively increased by working on additional input samples (chosen from
    remaining-bands).


    DWT provides the learning algorithm with an attractive start point in addition
    to frequency information, it preserves temporal information of an image [31].
    However, note that other sampling mechanisms could also be used for ICNN.


    The DWT of an image is calculated by passing through a series of high- and low-pass
    filters. Consider h[n] as the impulse response of the high-pass filter, and g[n]
    as the impulse response of low-pass filter. Then, each row of the image is considered
    a signal x[n]. To obtain the first order DWT transformation of the image, for
    each row of the image, the low-pass and high-pass filters are convolved with the
    image values in each row. Note that since half the frequencies of the signal (row
    of pixels) is removed by each filter, the low-pass and high-pass filters subsample
    the input signal by half the frequency.


    ```

    $y_{low}[n] = (x \times g)[n] = \sum x[k]g[2n-k]$

    ```


    ```

    $y_{high}[n] = (x \times h)[n] = \sum x[k]h[2n-k]$

    ```


    As illustrated in Figure 9.4(a), application of the DWT to each row results in
    generation of two subsampled images. Each image has the same height as the original
    image, but half the width. By placing these two images next to one another, the
    resulting image is equal to the size of the original image. The same sampling
    mechanism could now be applied in vertical direction, considering each column
    of pixel values as discrete signal x. This results generation of four sub-bands.
    Each sub-band is a subsample of the original input and is obtained using a filtering
    mechanism. If more subsamples are required, we could apply the DWT to any of the
    sub-bands hierarchically. In this work, we have used seven iterations, hence,
    we have applied a second transformation to the LL sub-band to generate four level-2
    subbands. Figure 9.4(b) shows the two resulting sub-bands by applying 2-level
    DWT to a dog image.


    A high-level representation of envisioned iterative learning algorithm by DWT
    is illustrated in Figure 9.5. Each iteration is a uCNN, which takes a new DWT
    sub-band as its input and refines the confidence of learning network. DWT, being
    a convolutional filter, could be readily computed using processing elements in
    CNN processing engine of interest or could be provided directly to each CNN.'
