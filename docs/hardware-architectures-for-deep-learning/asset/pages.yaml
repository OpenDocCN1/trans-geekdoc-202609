  md: '# 11.4.2 Output interface (ADC)


    We perform HSPICE circuit simulations to validate the functionality of the proposed
    ADC by implementing a 4-bit LTNN ADC. The analog input voltage range in this experiment
    was from -0.25 to 0.25 V (corresponding to the considered inverter-based neuromorphic
    circuit) leading to the conversion step size of 0.03125 V. In this structure the
    maximum resistance is 8× larger than the minimum resistance, whereas in the circuit
    of [37] the maximum resistance is 64× larger than the minimum resistance. This
    ratio is important because the maximum and minimum resistance of the memristors
    are limited by the physical constraints and the minimum resistance in the circuit
    should be kept high enough to prevent excessive loading on the inverters. The
    input voltage and the corresponding digital output code of the neural-based ADC
    are shown in Figure 11.10. Also, the worst-case delay for the conversation was
    3.9 ns and the average total power (including leakage and dynamic power) was 6.4
    μW for power supplies of +0.25 and -0.25 V. The power and delay measurements are
    performed using transient HSPICE simulation of the circuit by applying stepwise
