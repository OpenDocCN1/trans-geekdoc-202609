    # 11.3.3 Training scheme


    To train the neural network, we utilize a circuit aware framework where the backpropagation
    algorithm of [41] is modified to consider the physical characteristics of the
    neuromorphic circuit. The pseudo code for the proposed algorithm is given in Algorithm
    1 [18]. While the modified algorithm maintains the integrity of the gradient descent
    search in the backpropagation algorithm, it also effectively deals with the physical
    constraints in the memristive circuits, such as the limited range of memristor
    conductance.


    The backpropagation algorithm employs the gradient descent optimization approach
    to minimize a loss function and thereby determine the network weights [41]. The
    cost function (i.e., J) may be defined by


