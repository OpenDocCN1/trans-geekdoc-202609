  md: '# Chapter 5

    Binary neural networks

    Najmeh Nazari and Mostafa E. Salehi¹


    Convolutional neural networks (CNNs) are used in a spread spectrum of machine
    learning applications, such as computer vision and speech recognition. Computation
    and memory accesses are the major challenges for CNNs in resource-limited and
    low-power embedded systems. The recently proposed binary neural networks (BNNs)
    use just 1 bit for weights and/or activations instead of full-precision values,
    hence substitute complex-accumulation operations with bitwise logic operations
    to reduce the computation and memory footprint drastically. However, most B models
    come with some accuracy loss, especially in big datasets. Improving the accuracy
    of BNNs and designing efficient hardware accelerator for them are two important
    research directions that have attracted many attentions in recent years. In this
    chapter, we conduct a survey on the state-of-the-art researches on the design
    and hardware implementation of the BNN models.


    # 5.1 Introduction


    Due to the promotion of high-performance computer architectures, deep learning
    has rapidly grown to an extent that exceeds the human accuracy level [1]. A particular
    model of deep neural networks (DNNs) is the convolutional neural network (CNN)
    model that attained noticeable results in several computer vision tasks, such
    as image classification [2], and object localization and detection [3].


    CNN models were primarily designed with the aim of increasing accuracy. In fact,
    CNN models are continuously becoming more and more complicated and deeper to achieve
    more accuracy. For instance, the ResNet network exploits 50 layers and uses 25.5M
    of parameters and performs 9G multiply-accumulate (MAC) operations [4] for achieving
    94.7% top-5 classification accuracy on the ImageNet dataset. According to state-of-the-art
    researches, as CNNs go deeper and larger, they give higher accuracy, but at the
    cost of higher complexity. For instance, in [1], He al have explored the deep
    model of ResNet with 1,202 layers to give very high accuracy, but obviously, the
    model suffers from high computation and memory bandwidth demand. In almost all
    other CNN models, the massive computations and the huge amount of memory accesses
    are the major challenges of deep CNNs.


    > ¹School of Electrical and Computer Engineering, College of Engineering, University
    of Tehran, Tehran, Iran'
