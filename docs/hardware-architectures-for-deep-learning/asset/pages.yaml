  md: '# 42 Hardware architectures for deep learning


    storage requirement of model parameters allows many deep learning models to be
    stored on chip SRAM [19]. The authors show that, for a small number of example
    feedforward and convolutional networks, this method can reduce parameter storage
    requirements by 35×49 without loss in prediction accuracy. The three compression
    stages are as follows. First, pruning removes all model parameters that have an
    absolute value below some threshold. Next, parameters are quantized through sharing,
    in which weight values are binned through k-means clustering. This allows only
    the weight indices to be stored. Finally, the pruned and quantized parameters
    are stored in memory using Huffman coding.


    In [17], Han et al. present a model compression method called load-aware pruning.
    This method extends the standard pruning technique by optimizing the workload
    across parallel processing elements, resulting in reduced computation time. The
    technique works by first dividing the parameter matrix into submatrices based
    on the number of processing elements available. These submatrices are then constrained
    to have the same sparsity, such that they contain an equal number of nonzero parameters
    after pruning. The authors show that for a sample recognition model, the prediction
    performance of load-aware pruning does not differ much from that of the standard
    pruning. Linear quantization is used to further compress the model, with the fixed-point
    fraction length set by analyzing the dynamic range of each layer. The authors
    found that quantizing to 12-bits did not reduce the prediction performance from
    the 32-bit floating point model. However, 8-bit fixed point quantization caused
    prediction performance to deteriorate significantly.


    In [20], compression of fully connected layers in a convolutional network is explored
    using SVD. For example CNN model, SVD is performed on the first fully connected
    layers. The first 500 singular values are chosen. This results in a compression
    rate of 7× and a prediction accuracy loss of 0.04%. The authors also proposed
    a data quantization flow in which the fixed-point fractional length of both the
    model parameters and the layer inputs are optimized. First, the dynamic range
    of parameter matrices for each layer is analyzed in order to determine the fractional
    length which yields the smallest total error between the floating-point versions
    of the parameters. Then, the same process is applied to the input data at each
    layer. Fractional lengths are static in a single layer but dynamic-between layers.
    The authors found that for an example CNN model, 16-bit static fixed-point precision
    resulted in negligible performance loss compared with that of floating-point model.
    The 8-bit static precision resulted in significantly worse performance, but an
    8-bit dynamic precision model resulted in a performance loss of only 1.52%.


    In [21], SVD for LSTM model compression is applied. The authors present the compression
    technique for a generic recurrent network. Input and recurrent parameters for
    each layer are factored jointly to produce a projection matrix. The compression
    ratio for a given layer can then be controlled by setting the rank of the projection
    method. This method is extended to LSTM by concatenating the four-gate parameter
    matrices and treating them as a single matrix. For an example speech recognition
    model, the authors showed they were able to compress the original network to a
    third of its original size with a small degradation in accuracy.'
