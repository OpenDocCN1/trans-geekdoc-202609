    ![](img/e6e752b99eb1621488c89445a57e2a86_176_0.png)


    Figure 7.1 The architecture of a CORN core


    Each CORN core can be allocated to a single neural network layer. To allow multiple
    groups of neurons (e.g., multiple layers) the three tables in Figure 7.1 are duplicated
    share a single CORN core. COR allocates to each group of neurons its own set of
    tables, but shares the multiply-and-accumulate datapath in time. Only one table
    is active at time: a shadow table is not activated until the processing of the
    current table completes.


    If the neural network size is larger than the total storage capacity of CORN cores,
    neural network data (weights plus reuse data) should be stored in off-chip memory.
    Using multiple tables, processing the active table can be overlapped with loading
    shadow tables, effectively hiding memory latency. This work focuses on the computation
    reuse capability of CORN and memory-aware scheduling is left for future work.


    # 7.2.1 Computation reuse support for weight redundancy


    The computation reuse in the proposed architecture is enforced by two components:
    weight redundancy table (WRT) and a programmable crossbar.


    WRT keeps the reuse information. This table is filled offline: once the training
    phase is completed, the elements of each weight table column, which will be multiplied
    by the same input (precision), are examined to find repetitive weights under a
    given approximation level (precision). For each cycle, WRT keeps a $K$-bit mask
    vector to determine enabled multipliers and another $K$-element vector to determine
    which crossbar input should be connected to each crossbar output to pass right
    multiplication result to the addresses corresponding to inactivated multipliers.
    Unlike a conventional crossbar, this crossbar is capable of connecting an input
    to multiple outputs.


