  md: '# Chapter 4


    # Stochastic-binary convolutional neural networks with deterministic bit-streams


    M. Hassan Najafi¹, S. Rasoul Faraji², Bingzhe Li², David J. Lilja², and Kia Bazargan²


    # 4.1 Overview


    Stochastic computing (SC), an unconventional paradigm processing random bit-stream,
    has been used for low-cost and low-power implementation of neural networks (NNs).
    Inaccuracy of computations and long processing time have made prior SC-based designs
    of NNs inefficient compared to conventional fixed-binary radix-designs. Long random
    or pseudorandom bit-streams often need to be generated and produced to produce
    acceptable results. The long processing time leads to a significantly higher energy
    consumption than the energy of binary designs counterparts.


    Low-discrepancy (LD) bit-streams have been recently used for fast-converging and
    deterministic computation with SC circuits. In this chapter, we propose a low-cost,
    low-latency, and energy-efficient design of convolutional NNs (CNNs) based on
    LD deterministic bit-streams. Experimental results show a significant reduction
    in the energy consumption compared to previous random bit-stream-based implementations
    and the optimized fixed-point designs with no quality degradation.


    The remainder of this chapter is organized as follows: Section 4.2 introduces
    the current challenges in implementing SC-based NS and discusses the recently
    developed deterministic methods of processing LD bit-streams. In Section 4.3 presents
    necessary information on SC In Section 4.5, we describe our proposed method for
    high-quality energy-efficient design of CNNs. In Section 4.6, we evaluate the
    performance and hardware efficiency of the proposed design by hardware implementation
    of LeNet5 NN architecture. Finally, Section 4.7 summarizes this chapter.


    # 4.2 Introduction


    Large-scale NNs mainly operate on high-performance server or GPU clusters. The
    speed of these clusters, however, is not enough to keep up with current high processing


    ¹School of Computing and Informatics, University of Louisiana at Lafayette, Lafayette,
    LA, USA

    ²Department of Electrical and Computer Engineering, University of Minnesota, Twin
    Cities, MN, USA'
