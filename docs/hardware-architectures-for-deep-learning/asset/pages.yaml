  md: '# Iterative convolutional neural network 219


    Following the methodology in [5] to solve the over-fitting problem, the training
    set was augmented by reshaping images to 3 x 256 x 256 and extracting 3 x 228
    x 228 crops from each image (resulting in (228 − 256 +1)² = 841 crops). Moreover,
    the horizontal mirrors of each crop were added to the dataset (a total of 1,682
    crops per image).


    To prepare the sub-band for the ICNN, a 2-level D-D DWT was captured through the
    Haar filter [42] for each channel (i.e., R, G and B of images). The resulting
    sub-bands are four RGB images of size 3 x 57 x 57 in smaller sub-bands (corresponding
    to LL-LL, LL-LH, LL-HL and LL-HH) and three RGB images of size 3 x 114 x 114 in
    larger sub-bands (corresponding to HL, LH and HH). The seven resulting sub-bands
    allow sampling of the input bar by 7x, and as a result building the ICNN with
    seven iterations. To increase the number of iterations, the DWT depth can be increased
    or alternatively, DWT can be applied to the other sub-bands (LH, LH and HH).


    The sub-bands are stored in a lightning memory-mapped database (LMDB) [44], which
    is the database of choice when using large datasets. For the preprocessing and
    storage of images, several python package libraries, including LMDB, PyWavelets
    [44] and OpenCV, were used. Moreover, a mean image was calculated for each sub-band
    based on the training data to achieve normalization [45]. The means are subtracted
    from each image for all the sub-bands to ensure a zero mean for every feature
    pixel.


    For training the ICNN, we initialize the weights from a Gaussian distribution
    with zero mean and a standard deviation of 0.01. We start each training step with
    a learning rate of 0.01.


    For reporting the accuracy values, we evaluated the 50K images in the validation
    set of ImageNet repository. We use the FLOP count as an indicator of computational
    complexity (MFLOP is equivalent to Mega FLOP). The results for the implementation
    of policies introduced in this section is summarized next.


    # 9.10.2 Dynamic deadline policy for real-time applications


    Figure 9.18 shows the overall accuracy and FLOP count of each iteration when using
    DD policy. Each bar representing the FLOP count of its previous iteration with
    that of CONV and FC layer of iteration. The figure shows that assuming a large
    time-budget, continuing the ICNN to the last iteration still results in lower
    computational complexity (38% lower than original AlexNet) with only a 1% reduction
    in the top-5 accuracy. Note that the reduction in FLOPs in last iterations of
