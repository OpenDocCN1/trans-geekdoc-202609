    # 10.4.3 Recurrent spiking neural network


    The mixed-signal neuromorphic platform is used in the paradigm of a spiking recurrent
    neural network. The characteristic feature of recurrent SNNs that distinguish
    them from any feed-forward neural network is the connection topology that allows
    for cycling activity. The existence of cycles has a tremendous impact on the computational
    properties of the network, In fact, a recurrent SNN may develop a self-sustained
    temporal activation even in the absence of input; this is the indication of a
    type of attractor of the dynamics. In addition, when driven by external input
    signal, a recurrent neural network preserves its internal state as a nonlinear
    transformation of the input history, which is an indication of dynamical memory.
    Two main classes of recurrent neural networks exist: (a) model characterized by
    energy minimizing stochastic dynamics and symmetric connections, (b) models that
    feature a deterministic update dynamics and direct connections. The first class
    of recurrent networks is Hopfield networks [38], Boltzmann machines, but also
    the deep networks. These types of networks can be trained in unsupervised and
    supervised fashion and the typical applications for these networks are distributed
    and associative memories, data compression, of decision making, pattern classification
    [39]. In this first class of models, the network is run for a fixed period of
    time during which the dynamics of the system converges to an equilibrium state.
    The second class of recurrent neural network models usually implements nonlinear
    filters that are trained in a supervised manner. These filters are used to transform
    an input time series into an output series that is usually projected into a higher
    dimensional space than the input one. In our implementation, we took inspiration
    from the echo state network computational framework [40]. In this framework, a
    recurrent network of dynamics and in particular, a recurrent network of spiking
    neurons is generated randomly and only readout units are trained with high precision.
    This second type of neural network appearing appealing for mainly reasons: (a)
    computational models always exhibit recurrent connection pathways, providing a
    hint that these networks are powerful but at the same time are efficient because
    units are reused over, (b) the mixed-nature of the hardware is compatible with
    random connectivity properties (i.e., it is easier to control efficacy distribution
    than single value of synaptic connections in an analog hardware) and (c) it can
    be shown that these types of recurrent networks are universal approximators [41].


