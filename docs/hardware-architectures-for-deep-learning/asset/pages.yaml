    find out how the human brain models and learns the real world. Figure 1.3 shows
    the structure of a nerve cell, or neuron, which includes dendrites, cell body,
    axon, cell nucleus, and synaptic gaps [1].


    A certain neuron includes plenty of dendrites that absorb the incoming electro-chemical
    signals from adjacent neurons and accumulate them within its cell body. In the
    kernel of the cell, the accumulated signal will be compared with a threshold and
    if it is bigger than the threshold, it will activate. By neuron activation, it
    spikes and sends a chemical signal to adjacent neurons through the axon. A synaptic
    gap plays an important role in giving weights to the transformed signal between
    the axons and dendrites of connected neurons.


    There are three types of neurons in the nervous system. Sensory neurons get information
    about what is going inside and outside of the body and bring that information
    into the central nervous system (CNS), so as to be processed by the neural system.
    Interneurons connect one neuron to another and are found only in the CNS. Most
    of the interneurons are in the brain. Motor neurons get information from other
    neurons and convey commands to the muscles, organs, and glands.


    We can consider an input-output layer-based structure between the input data (stimulus)
    received by the input sensory neurons (input layer) and the data generated by
    motor neurons (output layer), the set of interneurons from the hidden layers.
    Figure 1.4 shows a simplified input-output scheme of a nervous system.


    The NN is the source of some imperative learning capabilities in the human body.
    The humankind can learn to classify all types of signals received from their senses
    including visual (seeing), auditory (hearing), tactile (touch), gustatory (taste),
    olfactory (smell), vestibular (movement), and proprioceptive (body awareness).
    They can make long and short memories about different events and senses they have
    experienced or learned in the past. They can provide skills to do more complicated
    tasks and actions, which they have learned or experienced.


    Perhaps the computational intelligence, including logic, mathematics, and inference,
    is the most significant exclusive capability of the human’s NN.'
