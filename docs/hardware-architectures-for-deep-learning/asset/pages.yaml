  md: '# 46 Hardware architectures for deep learning


    Ferreira and Fonseca proposed an FPGA accelerator for LSTM in [32]. This design
    trades off scalability and flexibility for throughput: network size is fixed at
    HDL compilation time, but weight and bias parameters are stored in on-chip RAM
    rather than imported from off-chip memory. Matrix–vector multiplication is tiled
    using counter and multiplexer logic, which saves resources at the cost of increased
    computation time (by a factor of the resource sharing ratio). Input and recurrent
    matrix–vector multiplication are calculated in parallel. Since the size of the
    input vector is often smaller than the recurrent vector size, the bias-add operation
    is performed after the input matrix–vector multiplication operation is completed,
    while the recurrent matrix–vector multiplication operation is still being completed
    in parallel. Element-wise operations are also multiplexed: there is one of a hyperbolic
    tangent, a sigmoid unit, and element-wise multiply and add. Activation functions
    are computed using second-order approximations, evaluated using Horner’s rule
    in order to save multiplier resources. All data is quantized to a signed 18-bit
    fixed-point representation to make full use of Xilinx DSP48E1 slices.


    # 2.3.3 Memory


    The memory demand, which is the physical storage of the neural network parameters,
    is an important parameter for hardware accelerator design. Many state-of-the-art
    neural network models contain hundreds of megabytes worth of parameters. This
    memory demand introduces a unique challenge for FPGA implementation of neural
    network accelerators, because on-chip memory size and I/O bandwidth are often
    limited [34]. Moreover, off-chip DRAM access requires an order of magnitude more
    energy than on-chip memory access [19]. The off-chip parameter access can also
    be a bottleneck because the speed of matrix–vector operations is often limited
    by memory access time [20]. Indeed, in LSTMs, similar to many other neural network
    models, the majority of computations is matrix–vector operations and has their
    parameter in the off-chip memory, so memory bandwidth highly affects system throughput.


    Due to the energy and access-time requirements of off-chip memory access, on-chip
    parameter storage is the optimal design choice, provided that the parameters fit
    in the limited on-chip memory capacity. For many models, compression techniques
    can shrink storage requirements to allow the entire model to be stored on-chip.
    In addition to the efficiency and performance benefits, on-chip parameter storage
    vastly simplifies the design process by eliminating the need for developing memory
    interface and buffering schemes. In the case of models compressed with sparsity
    encoding, each decoding logic is required, but the implementation of such logic
    may be simpler than implementing an external memory interface. Many hardware accelerators
    have been designed to take advantage of on-chip storage [18,32,35].


    While on-chip parameter storage is both simple to implement and more efficient
    than using off-chip memory, it is also less scalable than its counterpart. Many
    accelerators using on-chip storage have been designed to support a single model;'
