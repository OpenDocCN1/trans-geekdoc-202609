- pgno: 218
  md: '# Iterative convolutional neural network 193


    classification accuracies have surpassed that of human''s capabilities. However,
    with deeper networks and added sophistication, the number of computations needed
    for classification has grown considerably, making CNN an extremely computational
    intensive and power hungry solution.


    As a result, besides higher performance requirements, there is a need to aggressively
    reduce the power consumption of these platforms as desired platforms for vision-based
    applications are energy constrained. Adopting complex vision algorithms in many
    of mobile and handheld, embedded systems and IoT applications will not be feasible
    if energy consumption barrier is not addressed. At the same time, many of desired
    applications require real-time and short-latency response. The good news is that
    learning by nature is approximate. Neural networks are trained and proven to be
    tolerant against input noise. If learning is approximate in nature, why should
    its underlying structure be designed to be a 100% accurate? What if a little approximation
    in hardware, with little or no degradation on output, could save significant power,
    performance and area? Can we recover from additional inaccuracy of approximate
    hardware through learning? How do we identify the error-tolerant computations
    that can benefit from approximate hardware? Can we reformulate learning to provide
    more opportunities for the hardware? The goal here is to answer these questions.


    CNN is a computational and power hungry solution. However, most interesting applications
    of computer vision are in Robotics, CPS and IoT domains which on average are resource
    constrained. In addition, such applications demand real time and fast turnaround
    time (low latency). Therefore, the optimization space involves accuracy, latency,
    power and area. With this in mind, we reformulate the learning from a single feed-forward
    network to a series of smaller networks that could be traversed iteratively. 9.2
    illustrates a high-level abstraction of the approximate CNN. In iterative learning,
    each iteration works on small set of subsampled input features and enhances the
    accuracy of classification. Upon reaching an acceptable classification Ct, further
    iterations are ignored. This creates the possibility of performing the classification
    with far less operations than a conventional learning algorithm. In addition,
    first iteration(s) could provide useful feedback to the underlying hardware, managing
    the HW approximation intents. This is especially true, in addition to classification,
    we are interested in localization. This could provide us with many opportunities
    for approximation.


    ![](img/e6e752b99eb1621488c89445a57e2a86_218_0.png)


    Figure 9.2 Reformulating the CNN into an iterative solution'
