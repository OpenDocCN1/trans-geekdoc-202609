    into two phases: (1) determining the RNN model to reduce computation and storage
    subject to accuracy requirement and (2) hardware implementations of RNN model,
    including processing element design optimization and quantization.


    # 2.3.2 Datatype and Quantization


    The datatype used for hardware implementation affects many of the decisions made
    during the FPGA design process—ultimately impacting energy efficiency and processing
    throughput. While full-precision floating-point data is often used during the
    training phase, research shows that fixed-point datatypes with reduced word length
    can be used for inference with minimal loss in accuracy [25,28,29]. Besides the
    benefit of reduced memory footprint compared with floating-point datatypes, this
    quantization approach has many advantages. First, it is simple to implement using
    a linear quantization approach, and tools that automate this process are freely
    available [28]. Second, fixed-point quantization can be used in conjunction with
    a parameter-reduction compression approach, such as pruning or SVD [18,20]. Finally,
    fixed-point multiplication and addition map can be used directly to dedicated
    DSP units, such as the Xilinx DSP48 and its variants. When using a short word
    length, data can be packed such that DSP units are able to process two multiply-accumulate
    operations concurrently [30].


    When specifying a fixed-point datatype, there is a trade-off among word length,
    fractional part (the length of the decimal point), and the dynamic range. In general,
    larger words allow for higher dynamic range but at the cost of increased memory
    footprint. It can be a challenge to find a balance between reducing word length
    and maintaining computational accuracy. A simple approach is to use a static fixed-point
    representation for all datatypes. Given a large word length, an appropriately
    set fraction length can allow enough room for integer component to grow while
    maintaining an acceptable level of fractional precision. Many accelerator architectures
    have this approach due to its straightforward implementation in hardware [18,31–33].
    However, a multilayer model with a large number of parameters may have a wide
    dynamic range that is difficult to represent using a reduced word length. A solution
    to this issue is to use a dynamic range of each layer is analyzed separately to
    select an appropriate fraction length. In hardware implementation, this translates
    to extra bit shift operations between layers to align decimal points. The impact
    of dynamic fixed point on convolutional networks has been widely studied and shown
    to yield minimal loss in prediction accuracy, even'
