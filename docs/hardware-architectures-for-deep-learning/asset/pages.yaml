  md: '# Stochastic-binary convolutional neural networks


    In this chapter, we propose a hybrid bit-stream design for energy-efficient, low-cost,
    and yet accurate implementation of CNNs. We use LD deterministic streams to implement
    the first convolutional layer of the NN, as convolutional layers account for more
    than 90% of the overall hardware cost in some CNNs [7]. We explore the impact
    of using different combinations of LD sequences in generating deterministic bit-streams
    for the proposed design. Experimental results show a significant reduction in
    the energy consumption and hardware cost compared to the conventional fixed-point
    design. In contrast to prior SC and hybrid stochastic-binary designs, the proposed
    design gives the same classification rate as the fixed-point design.


    # 4.3 Background


    # 4.3.1 Stochastic computing


    SC is a reemerging computing paradigm operating on random bit-streams. Independent
    of the length (and interleaving of 0s and 1s), the ratio of the number of ones
    to the length of the bit-stream determines the value in the [0,1] interval. For
    example, 1011110010 is a representation of 0.6 in the stochastic domain. Computation
    accuracy increases with the length of the bit-stream. In contrast to conventional
    binary representation, all digits of a bit-stream have the same weight. In a noisy
    environment, faults in the high-order bits of a binary radix representation can
    produce large errors. With a stochastic representation, a single bit-flip results
    in a small error. This error tolerance scales to high error rates that multiple
    bit-flips produce only small and uniform deviations from the nominal value.


    Besides the ability of tolerate high rates of noise, implementing complex operations
    with simple hardware is another primary advantage of SC. Multiplication, as a
    costly and common operation in CNNs, can be implemented with a single standard
    AND gate in stochastic domain. As shown in Figure 4.1, an AND gate works as a
    stochastic multiplier if independent (uncorrelated) bit-streams are connected
    to its.


    To convert data from binary radix format to bit-stream representation, an unbiased
    random number from a random or pseudandom source is connected to a constant number
    (based on the target input data). The output of the comparison produces one bit
    of the stochastic stream in each cycle. A “1” is generated at the output of the
    comparator if the random number is less than the constant number. A “0” is generated
    otherwise. Figure 4.2 shows the structure of a binary-to-bit-stream converter


    ![](img/e6e752b99eb1621488c89445a57e2a86_106_0.png)


    Figure 4.1 Example of stochastic multiplication using AND gate'
