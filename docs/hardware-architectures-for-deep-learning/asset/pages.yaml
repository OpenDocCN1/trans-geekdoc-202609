    processing eight cycles (8 × 0.52 nJ). The proposed design achieves more than
    70% energy saving compared to the non-pipelined fixed-point design while preserving
    the quality of the results. Although pipelined design increases the maximum working
    frequency (reduces the critical path latency) and the throughput, it costs higher
    hardware area and power consumption, longer total end-to-end latency, and higher
    energy consumption for processing each input data.


    With the conventional random stream-based design, a significantly longer processing
    time (e.g., 64–256 cycles) is required to achieve the same classification rate
    as the fixed-point design. This longer processing time makes the prior bit-stream
    designs energy inefficient compared to the fixed-point and to the proposed hybrid
    design.


