    # 9.9.3.1 Context-aware pruning policy for FC layer


    Context-aware pruning policy (CAPP) for FC layer modifies the FC layer in the
    next uCNN classifier to skip the computation and memory transfer of parameters
    related to the classification of classes with very low probabilities.


