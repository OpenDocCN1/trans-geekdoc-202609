    # 1.2.3 Relation between classification and regression


    By imposing some constraints, a regression problem can be converted to a classification
    problem. Actually, by quantizing the output of a regression problem and considering
    each quantized level as an individual class (while there is nearness among different
    classes), a regression problem is represented as a classification problem. Assume
    that the output of the regression function is scalar, and consider that y_min
    and y_sup denote the minimum and supremum of the output, respectively. The output
    can be quantized to nC levels with equal distance ρ = (y_max - y_min)/n_C. Consequently,
    each output y^a can be indicated by label I^a ∈ {1, 2, ..., n_C}, which is computed


    ```

    I^a = label(y^a) = y_min + (I^a - 1)ρ ≤ y < y_min + I^a

    ```


    Figure 1.14 shows a simple example where the real output signal (dot line) has
    been quantized into n_c = 5 levels (solid line). From Figure 1.14, it is understood
    that the classification problem converges to a regression problem if n_C → ∞.'
