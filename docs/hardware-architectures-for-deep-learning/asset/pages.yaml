    arguments of neurons. Adaline finds a separating hyperplane between the patterns
    of two classes, when their pattern distributions are similar in shape and density.


    # 1.3.2 Multilayer and deep NNs


    Simple structure networks cannot offer any solution for the challenges and constraints
    of real-world classification or regression problems. Some major challenges are:


    +   - Patterns of each class are not necessarily linearly separable from patterns
    of other classes. In this case, the patterns are localized in some convex- or
    non-convex-shaped regions.

    - The dimension of many real-world input patterns is high and there are nonlinear
    correlations among them.

    - In real-world input patterns, there are plenty of disturbances with different
    scales

    - The input patterns of the same class have distortions in size, shape, position,
    and perspective.

    - In some cases when there are certain sequences between input patterns, the applied
    input itself may not be sufficient to determine the output of the network and
    it is necessary to consider former input patterns for getting the right output.


    The above-mentioned challenges render the input patterns insufficient for the
    partitioning and mapping purposes, and hence the NN must have a feature extraction
    part before any partitioning or mapping. This requirement led to the emergence
    of multilayer NNs and deep learning NNs.


    # 1.3.2.1 Multilayer perceptron


    To handle the case when the class patterns are not linearly separable, it is required
    to add one or two hidden layers to the NN. Actually, adding one hidden layer provides
    the required complexity to generate the label of patterns of a class, which are
    localized in a convex-shaped region. Furthermore, adding two hidden layers enables
    the network to generate label for patterns that are localized in a non-convex-shaped
    region or some isolated local regions. Figure 1.17 shows two ANNs with one hidden
    layer and two hidden layers.


    ![](img/e6e752b99eb1621488c89445a57e2a86_41_0.png)


    Figure 1.17 ANNs with (a) one hidden layer and (b) two hidden layers'
  merge: -1
