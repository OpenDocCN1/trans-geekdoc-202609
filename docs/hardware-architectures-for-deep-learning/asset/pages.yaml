  md: '# Chapter 11

    Inverter-based memristive neuromorphic circuit for ultra-low-power IoT smart applications


    Arash Fayyazi$^{1,2}$, Mohammad Ansari$^1$, Mehdi Kamal$^1$,

    Ali Afzali-Kusha$^1$, and Massoud Pedram$^2$


    Nowadays, the analysis of massive amounts of data is generally performed by remotely
    accessing large cloud computing resources. The cloud computing is however hindered
    by the security limitation, bandwidth bottleneck, and high cost. In addition,
    while unstructured multimedia data (video, audio, etc.) has straightforwardly
    recognized and processed by the human brain, conventional digital computing architecture
    has major difficulties in processing this type of data, especially in real time.
    Another major concern for data processing, especially in the case of Internet
    of Things (IoT) devices with distributive sensing and typically rely on energy
    scavenging, losing power consumption. One of the ways to deal with the cloud bottlenecks
    is to use low-power neuromorphic circuits, which are of type embedded intelligent
    circuits aimed at real-time screening and preprocessing of data before submitting
    the data to the cloud for further processing. This chapter explores ultra-low-power
    analog neuromorphic circuits for processing sensor data in the IoT devices where
    low-power, yet area-efficient computations are required. To reduce power consumption
    without losing performance, we resort to a memristive neuromorphic circuit that
    employs inverters instead of power-hungry amps. We also discuss low-power mixed-signal
    analog-to-digital converters (ADC) and digital-to-analog converters (DAC) to make
    the analog neuromorphic circuit connectable to other digital components such as
    an embedded processor. To illustrate how inverter-based memristive neuromorphic
    circuits can be exploited for reducing power and area, several case studies are
    presented.


    #  11.1 Introduction


    The Internet of Things (IoT) is a computing concept that brings Internet connectnec-
    tion to everyday life objects, such as smart thermostats, keys, wearables, health


