    # 2.2 Hardware acceleration for RNN inference


    As mentioned earlier, implementing a deep learning application is a two-step process:
    training and inference. Training is a time-consuming process that may take even
    days. However, it is one-time cost, because once a model is trained to return
    accurate output, this step is finished and will not be revisited. Inference, on
    the other hand, carries the recurring cost of the deep learning application. In
    this stage, new data is fed to the model, and only the forward pass through the
    network is computed. “Cost,” in this case carries two implications. The first
    is the actual monetary cost to the energy consumption of the system to minimize.
    It is in the best interest of the application maintainer to minimize the amount
    of energy required to compute inference because this cost is incurred every time
    the system processes a new input. The second is the inference delay that the user
    experiences. For a mobile application, for example, this means the time the user
    waits to get a response from the system.


    Most accelerators target the inference time, as it has to be done on edge devices
    or cloud-side servers every time a new input data is received. Therefore, the
    methods we review in this section are inference-time accelerators.


    # 2.2.1 Software implementation


    The most straightforward way to implement neural networks is the software-based
    approach. This strategy is appealing because it is the simplest, in terms of development
    time, design effort, and design complexity. It also provides flexibility, as a
    high-level software solution can run on any platform. The develop-debug feedback
    loop for software is short, compared with that of hardware design, so a robust
    solution can be implemented in relatively short order. When using a machine learning
    framework like Theano or TensorFlow, it is feasible to use the same code used
    for training and adapt it to implement inference. TensorFlow Lite [13] was developed
    specifically for adapting TensorFlow codes to mobile applications. The cost of
    software-based inference implementation is often low, so this approach is often
    the first to be taken by application designers—especially if there are no tight
    real-time latency constraints.


    However, for applications with low-latency and high-throughput requirements, a
    pure software-based approach may be insufficient. For a basic scalar processor,
    the computations must be performed sequentially. Modern superscalar, multicore
    processor architectures with powerful SIMD units, as well as low-level linear
    algebra libraries (such as BLAS [14]) introduce some degree to facilitate matrix–vector
    computations, but fundamentally there is a limit to computational performance
    when a pure software-based approach is taken.


    ![](img/e6e752b99eb1621488c89445a57e2a86_62_0.png)'
