    The proposed SNN architecture is illustrated in Figure 10.11. The architecture
    exploits spikes for both communication and computation, it consists of three main
    blocks.


    +   1. Two delta modulators convert the ECG input signals into digital pulses
    (i.e., spikes). The output temporal spike patterns can be thought to be produced
    by four spiking neurons (plus and minus circles in Figure 10.11).


    +   2. In a first stage, a recurrent SNN receives inputs from the delta modulators
    and performs a dimensionality expansion of the inputs via its recurrent connections.


    +   3. In a second stage, a pool of LIF neurons has been supervised to classify
    the different temporal spike patterns produced by the recurrent SNN. The spikes
    from the LIF neurons are counted and the most active class is selected.


    In the next subsection, we explain in detail all these blocks and describe the
    supervised training algorithm.


