    # 1.4.3 Learning in CNNs


    Like other classification and regression networks, a CNN consists of two major
    parts: sequential convolution and pooling layers for feature extraction, and one
    or two fully connected layers for partitioning or mapping function. In the learning
    process of a CNN, the number of convolution and pooling layers and their parameters,
    as well as the number of fully connected layers and the neuron weights are set
    and adjusted.


    In an appropriately designed and learned CNN, the sequencing of the convolutional
    and pooling layers removes the disturbances and reduces the distortions from lower
    scales to higher scales. For example, in a typical classification CNN, the former
    convolutional and pooling layers detect, scale, and extract edges and corners
    but the latter convolutional and pooling layers detect scale-skeletons with various
    sizes. Such sub-skeletons are frequent in different classes and finally will be
    revealed as the main features. For instance, Figure 1.26 shows a CNN that categorizes
    various images of cars. A set of sub-skeletons of wheels, windows, copouts, and
    so on comprises the effective features. Next, the fully-connected layers partition
    the feature space to classify objects or generate the desired output in regression
    problems.'
