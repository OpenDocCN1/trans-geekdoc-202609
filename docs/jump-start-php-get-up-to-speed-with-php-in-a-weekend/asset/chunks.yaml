    \nPHP also has operators that allow us to compare values. For example `==` checks\
    \ to see if two values are the same, `<` if a value is less than another, and\
    \ `>` if a value is greater than another.\n\nMost of the time we use these comparison\
    \ operators to write `conditional statements` (statements that may or may not\
    \ execute depending on the result of a comparison) and `loops` (statements that\
    \ execute multiple times over).\n\n### if Statement\n\nAn `if` statement consists\
    \ of a condition and one or more statements grouped as a block. If PHP evaluates\
    \ the condition and finds it to be true, then it will execute the block of statements.\
    \ If the condition is false, then PHP will skip the block. In the example below,\
    \ PHP checks to see if the value of `$a` is equal to `$b`. If so, it displays\
    \ \"A is equal to B\" on the screen:\n\n```php\n<?php\nif ($a == $b) {\n    echo\
    \ 'A is equal to B';\n}\n```\n\n### else Statement\n\nA partner to the `if` statement,\
    \ an `else` statement can directly follow an `if` statement. PHP executes the\
    \ code that makes up the `else`'s block only if it skipped that of the `if` statement.\
    \ In the example below, PHP checks to see if the value of `$a` is equal to `$b`.\
    \ If so, it displays \"A is equal to B\" on the screen: If that test fails, PHP\
    \ executes the code in the block after the else statement and prints \"A is not\
    \ equal to B\" to the screen.\n\n```php\n<?php\nif ($a == $b) {\n    echo 'A is\
    \ equal to B';\n} else {\n    echo 'A is not equal to B';\n}\n```\n\n### elseif\
    \ Statement\n\nAnother partner is the `elseif` statement. As its name suggests,\
    \ `elseif` is a combination of `if` and `else`. It has a condition, and PHP checks\
    \ the condition if the `if` condition was found to be false.\n\nMultiple `elseif`\
    \ statements can be used together to test for different conditions, and PHP checks\
    \ each one until one of the conditions is found to be true. Once a true condition\
    \ is found, PHP will skip the rest of the `elseif` statements in the chain.\n\n\
    ```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to B';\n} elseif ($a == $c)\
    \ {\n    echo 'A is equal to C';\n} elseif ($a == $d) {\n    echo 'A is equal\
    \ to D';\n} else {\n    echo 'A is not equal to anything';\n}\n```\n\n## switch\
    \ Statement\n\nIf you take a closer look at our `elseif` example you may notice\
    \ that each condition basically tests for the same thing—whether the value of\
    \ some variable is equal to the value of `$a`. PHP's `switch` statement can do\
    \ something similar, and also looks a bit less cluttered.\n\n```php\nswitch ($a)\
    \ {\n    case $b:\n        echo 'A equals B';\n        break;\n    case $c:\n\
    \        echo 'A equals C';\n        break;\n    case $d:\n        echo 'A equals\
    \ D';\n        break;\n    default:\n        echo 'A is not equal to anything';\n\
    \        break;\n}\n```\n\nIn the example above, PHP takes the value provided\
    \ at the start of the `switch` (the value of `$a`) and compares it to the value\
    \ of each `case`. The matching clause is the one that is executed. The `default`\
    \ case is executed if none of the other cases match.\n\nOnce PHP finds a matching\
    \ clause, it starts executing the code below and continues until it sees the `break`\
    \ keyword, after which it will jump to the end of the `switch` statement and merrily\
    \ continue on executing the rest of our script.\n\n### Note: Watch for the Break\n\
    \nPHP doesn't see the start of one `case` as the end of the previous `case`, which\
    \ is why the `break` keyword is necessary. This might be confusing at first, and\
    \ there will be likely times that you forget to use `break` and your scripts don't\
    \ do what you intend, so it's important to keep this in mind.\n\nThis behavior\
    \ also means that we can write code that executes for multiple cases, like so:\n\
    \n```php\nswitch ($a) {\n    case $b:\n    case $c:\n    case $d:\n        echo\
    \ 'A equals B, C, or D';\n        break;\n    default:\n        echo 'A is not\
