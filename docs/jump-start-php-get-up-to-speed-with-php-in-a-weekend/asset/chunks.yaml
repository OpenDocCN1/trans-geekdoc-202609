  trans: "\n```php\n<?php\nclass Posts {\n    public $db = '';\n    public function\
    \ __construct() {\n        $this->db = new PDO(\"mysql:host=localhost;dbname=testposts\"\
    , \n        \"dbuser\", \"dbpass\");\n        $this->db->setAttribute(PDO::ATTR_ERRMODE,\n\
    \        PDO::ERRMODE_EXCEPTION);\n        $this->index();\n    }\n    public\
    \ function index() {\n        $id = 0;\n        $posts = array();\n        $template\
    \ = '';\n        if (!empty($_GET['id'])) {\n            $id = $_GET['id'];\n\
    \        }\n        try {\n            if (!empty($id)) {\n                $query\
    \ = $this->db->prepare(\"SELECT * FROM posts \nWHERE id = ?\");\n            \
    \    $params = array($id);\n                $template = 'single-post.php';\n \
    \           } else {\n                $query = $this->db->prepare(\"SELECT * FROM\
    \ posts\");\n                $params = array();\n                $template = 'list-posts.php';\n\
    \            }\n            $query->execute($params);\n            for ($i = 0;\
    \ $row = $query->fetch(); $i++) {\n                $posts[] = array('id' => $row['id'],\
    \ 'content' =>\n$row['content']);\n            }\n        } catch (PDOException\
    \ $e) {\n            echo $e->getMessage();\n        }\n        $query->closeCursor();\n\
    \        $db = null;\n        require_once($template);\n    }\n}\n$posts = new\
    \ Posts();\n?>\n```\n\n我们在这里所做的是创建一个类 `Posts`。在开始时，我们初始化了 `PDO` MySQL 连接。接着我们进入\
    \ `index` 方法，在该方法中，我们检查 URL 是否包含一个变量，如果有，我们就从 URL 中获取它，并尝试从数据库中获取具有相同 `id` 的文章。如果没有\
    \ URL 变量，我们则直接加载数据库中的所有文章。最后，我们加载与我们执行的数据库查询相关的模板。\n\n接下来，我们需要组合好模板文件来显示从数据库中检索的数据。因此，创建两个新文件——一个命名为\
    \ `list-posts.php`，另一个命名为 `single-post.php`。在 `list-posts.php` 中添加以下代码：\n\n```html\n\
    <h1>List of Blog Posts</h1>\n<?php foreach ($posts as $post): ?>\n    <h3>Post\
    \ #<?php echo htmlspecialchars($post['id']); ?></h3>\n    <?php echo htmlspecialchars($post['content']);\
    \ ?>\n    <a href=\"http://localhost/experiments/posts.php?id=<?php echo \nhtmlspecialchars($post['id']);\
    \ ?>\">Read More</a>\n    <hr/>\n<?php endforeach; ?>\n```\n等等，我漏掉了代码块中的格式。\n\n\
    最后，在我们的 `single-post.php` 文件中这段代码：\n\n```php\n<?php foreach($posts as $post):\
    \ ?>\n    <h1>Post #<?php echo htmlspecialchars($post['id']); ?></h1>\n    <hr/>\n\
    \    <?php echo htmlspecialchars($post['content']); ?>\n    <a href=\"http://localhost/experiments/posts.php>\n\
    Back to Post List</a>\n<?php endforeach; ?>\n```\n\n现在，如果我们导航到 `posts.php` 文件，可以看到有一篇文章列表——在这种情况下是一个特定的文章，因为我们目前数据库中只有一个文章——每篇文章都有一个让我们点击“阅读更多”的链接。点击此链接将我们带到单个文章页面，并显示一个与查看完整文章列表时不同的模板。\n\
    \n这是一个非常短的示例，展示了 `$_GET` 变量如何允许我们动态加载博客文章并与数据库进行交互。我们可以轻松地将示例改为使用 `$_POST` 变量。然而，这样我们就无法共享指向单篇文章的\
    \ URL 了。相反，URL 只会将访问者引导到文章列表，他们必须自己去点击“阅读更多”链接。\n\n这个示例很好地引导我们进入本章的下一节，在下一节中，我们将扩展这段代码段以及之前的代码，并开始构建我们博客平台的核心部分。\n\
    \n## 在我们的平台上进行构建\n\n在这一节中，我们将基于刚刚创建的示例（该示例显示了带有阅读单个文章链接的文章列表）进行构建，并在我们的应用程序中运行它。\n\
    \n让我们对上面的现有代码进行细微调整。修改博客平台文件夹中 includes 目录下的 `posts.php` 文件，使构造函数看起来如下：\n\n```php\n\
    public function __construct() {\n    parent::__construct();\n    $this->comments\
    \ = new Comments();\n    if (!empty($_GET['id'])) {\n        $this->viewPost($_GET['id']);\n\
    \    } else {\n        $this->getPosts();\n    }\n}\n```\n\n通过这段代码，我们的构造函数检查是否存在名为\
    \ `id` 的 URL 变量。如果有，它将继续从该变量收集数据，并传递给 `Blog` 类中的 `viewPost()` 方法。如果没有名为 `id` 的\
    \ URL 变量，应用程序将被指示加载数据库中的所有文章。这将访问者看到我们所有的文章，然后点击链接查看特定的文章。\n\n我们对 `posts.php`\
    \ 文件所做的下一个更改是编辑 `getPosts()` 方法：\n\n```php\npublic function getPosts() {\n   \
    \ $id = 0;\n    $posts = array();\n    $template = '';\n    if (!empty($_GET['id']))\
    \ {\n        $id = $_GET['id'];\n    }\n    try {\n        if (!empty($id)) {\n\
    \            $query = $this->db->prepare(\"SELECT * FROM posts \nWHERE id = ?\"\
    );\n            $params = array($id);\n            $template = 'single-post.php';\n\
    \        } else {\n            $query = $this->db->prepare(\"SELECT * FROM posts\"\
    );\n            $params = array();\n            $template = 'list-posts.php';\n\
    \        }\n        $query->execute($params);\n        for ($i = 0; $row = $query->fetch();\
    \ $i++) {\n            $posts[] = array('id' => $row['id'], 'content' =>\n$row['content']);\n\
    \        }\n    } catch (PDOException $e) {\n        echo $e->getMessage();\n\
    \    }\n    $query->closeCursor();\n    $db = null;\n    require_once($template);\n\
    }\n```\n\n`getPosts()` 方法用于从数据库收集所有文章以创建一个列表。它使用了 `SELECT * FROM posts` 数据库查询。然后我们使用\
    \ `try` ... `catch` 异常处理器检查数据库查询是否成功。如果查询成功，我们将再次遍历从数据库返回的数组并将结果赋值给键。最后，我们加载 `list-posts.php`\
    \ 模板。\n\n### 警告：显示 PDO 错误消息\n\n像我们在示例中那样输出 PDO 错误消息，在开发期间很有帮助。然而，在生产环境中，这样做可能会带来安全风险。\n\
    \n该类的最后一步是编辑 `viewPost()` 方法：\n\n```php\npublic function viewPost($postId) {\n\
    \    $id = $postId;\n    $posts = array();\n    $template = '';\n    $query =\
    \ $this->db->prepare(\"SELECT * FROM posts WHERE id = ?\");\n    try {\n     \
    \   $query->execute(array($id));\n        for ($i = 0; $row = $query->fetch();\
    \ $i++) {\n            $posts[] = array('id' => $row['id'], 'content' =>\n$row['content']);\n\
    \        }\n    } catch (PDOException $e) {\n        echo $e->getMessage();\n\
    \    }\n    $query->closeCursor();\n    $db = null;\n    require_once($template);\n\
    }\n```\n\n"
- fmt: "\nIn the methods described above, we're loading some template files— so we\
    \ need to go ahead and create them. Now, we could build the template files from\
    \ scratch, but for the purposes of this project, we'll design and build them using\
    \ the [Twitter Bootstrap Framework](http://twitter.github.io/bootstrap/index.html).\
    \ Bootstrap is fantastic for getting web applications' UI elements up and running\
    \ incredibly quickly, freeing you to focus on the task of building the back-end\
    \ of an amazing application.\n\nIf you're comfortable with setting up Bootstrap\
    \ yourself, go ahead and implement it into the project as you see fit. If you're\
    \ unsure about the process, don't worry—copy everything from the `includes` folder\
    \ in this book's code archive, and you'll be up and running with Twitter Bootstrap\
    \ in no time.\n\nGo back to our project and create two new files in the `templates`\
    \ folder in the `frontend` folder and title them `list-posts.php` and `view-post.php`.\
    \ In `list-posts.php` add the following code:\n\n```php\n<?php require_once 'includes/temps/header.php';\
    \ ?>\n<?php foreach ($posts as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']);\
    \ ?></h3>\n        <p><?php echo implode(' ', array_slice(explode(' ', \nstrip_tags($post['content'])),\
    \ 0, 10)); ?> [...]</p>\n        <a href=\"<?php echo $this->base->url.\"/?id=\"\
    .$post['id'];\n ?>\" class=\"btn btn-primary\">Read More</a>\n    <hr/>\n<?php\
    \ endforeach; ?>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\n\
    Next, add the following code to the `view-post.php` file:\n\n```php\n<?php require_once\
    \ 'includes/temps/header.php'; ?>\n<br/>\n<a href=\"<?php echo $this->base->url;\
    \ ?>\" class=\"btn btn-primary\">\nReturn to Post List</a>\n<?php foreach ($posts\
    \ as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']); ?></h3>\n\
    \        <?php echo htmlspecialchars($post['content']); ?>\n    <hr/>\n<?php endforeach;\
    \ ?>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\nOur `list-post.php`\
    \ file loops through the numerous posts we have collected from our database, creating\
    \ a small excerpt from our post's content and creating a link to read each one.\
    \ Our `view-post.php` file displays the title and the body of content for an individual\
    \ post that's been loaded from the database.\n\nBoth `list-post.php` and `view-post.php`\
    \ should seem pretty straightforward. However, you may have noticed some unusual\
    \ and complex-looking code in the `list-posts.php` file:\n\n```php\nimplode('\
    \ ', array_slice(explode(' ', \nview-post.phpstrip_tags($post['content'])), 0,\
    \ 10));\n```\n\nThis line of code combines several different PHP functions to\
    \ strip out the first ten words of our post's content to automatically create\
    \ an excerpt string that'll be displayed in our list of posts. The `strip_tags()`\
    \ function removes any HTML tags from the content, and the `explode()` function\
    \ creates a new array and key each time the function encounters a space in the\
    \ content. Next, the `array_slice()` function is used to take the first ten keys\
    \ in our array created by the `explode()` function. The `array_slice()` function\
    \ is passed `0` to indicate it should start counting from `0` and stop counting\
    \ when it reaches `10`. In addition, it's passed the array created by the `explode()`\
    \ function. Finally we use the `implode()` function to bring those ten array values\
    \ together as a string.\n\nFor more details about these functions in PHP and an\
    \ in-depth overview of what they can be used for, check out the following resources:\n\
    \n* [http://php.net/manual/en/function.strip-tags.php](http://php.net/manual/en/function.strip-tags.php)\n\
    * [http://php.net/manual/en/function.explode.php](http://php.net/manual/en/function.explode.php)\n\
    * [http://php.net/manual/en/function.array-slice.php](http://php.net/manual/en/function.array-slice.php)\n\
    * [http://php.net/manual/en/function.implode.php](http://php.net/manual/en/function.implode.php)\n\
    \nThe next stage in our example application is to create our admin and login panels.\
    \ We'll create the latter first. Open up the `login.php` file in the `includes`\
    \ directory. It's located within our project directory's main directory. Start\
    \ by adding the following to the constructor method:\n\n```php\npublic function\
    \ __construct() {\n    $this->ksdb = new Database;\n    $this->base = (object)\
    \ '';\n    $this->base->url = \"http://\".$_SERVER['SERVER_NAME'];\n    $this->index();\n\
    }\n```\n\nIn essence, our constructor sets up the objects and variables we're\
    \ going to need throughout the class. Next we need to add to the `index()` method:\n\
    \n```php\npublic function index() {\n    if ($_SERVER['REQUEST_METHOD'] === 'POST')\
    \ {\n        $this->validateDetails();\n    } elseif (!empty($_GET['status'])\
    \ && $_GET['status'] == \n'inactive') {\n        $error = 'You have been logged\
    \ out due to inactivity.\n Please log in again.';\n    }\n    require_once 'admin/templates/loginform.php';\n\
    }\n```\n\nIn the `index()` method, we check to see whether our user has been logged\
    \ out due to inactivity. It does this by checking to see if the `inactive` URL\
    \ variable has been set. It also checks to see if form data has been passed to\
    \ it using the `POST` method and, if so, the script then assumes that a user is\
    \ trying to log in and will fire up the `validateDetails()` method to check their\
    \ login details—something we'll cover shortly. Finally, the method loads up `loginform.php`,\
    \ which is used to load the form for users to log in with.\n\nNext we move onto\
    \ the `loginSuccess()` method and the `loginFail()` method:\n\n```php\npublic\
    \ function loginSuccess() {\n    header('Location: http://' . $_SERVER['SERVER_NAME']\
    \ .\n '/admin/posts.php');\n    return;\n}\n\npublic function loginFail() {\n\
    \    return 'Your Username/Password was incorrect';\n}\n```\n\nThe `loginSuccess()`\
    \ method is used in those instances when the login is successful, and the method\
    \ redirects the user to the admin panel, and the `loginFail()` method returns\
    \ an error status (informing the user that their login was unsuccessful.)\n\n\
    For more information on the `header()` function, please see [http://php.net/manual/en/function.header.php](http://php.net/manual/en/function.header.php).\n\
    \nFinally, we'll move on to the `validateDetails()` method:\n\n```php\nprivate\
    \ function validateDetails() {\n    if (!empty($_POST['username']) && !empty($_POST['password']))\
    \ {\n        $salt = '$2a$07$R.gJb2U2N.FZ4hPp1y2CN$';\n        $password = crypt($_POST['password'],\
    \ $salt);\n        $return = array();\n        $query = $this->ksdb->db->prepare(\"\
    SELECT * FROM users WHERE\nusername = ? AND password = ?\");\n        try {\n\
    \            $query->execute(array($_POST['username'], $password));\n        \
    \    for ($i = 0; $row = $query->fetch(); $i++) {\n                $return[$i]\
    \ = array();\n                foreach ($row as $key => $rowitem) {\n         \
    \           $return[$i][$key] = $rowitem;\n                }\n            }\n\
    \        } catch (PDOException $e) {\n            echo $e->getMessage();\n   \
    \     }\n        if (!empty($return) && !empty($return[0])) {\n            $this->loginSuccess();\n\
    \        } else {\n            echo $error = $this->loginFail();\n        }\n\
    \    }\n}\n```\n\n`validateDetails()` is the core method within the `login` class,\
    \ and is where our script checks and validates the user's attempt to log in to\
    \ our blog application's admin panel. To start with, the method checks that the\
    \ script has obtained form data using the `POST` method, and checks that the `username`\
    \ and `password` keys are present in the `$_POST` superglobal variable and are\
    \ not empty, using the `empty()` function in PHP.\n"
  raw: "In the methods described above, we're loading some template files— so we need\
    \ to go ahead and create them. Now, we could build the template files from scratch,\
    \ but for the purposes of this project, we'll design and build them using the\
    \ [Twitter Bootstrap Framework](http://twitter.github.io/bootstrap/index.html).\
    \ Bootstrap is fantastic for getting web applications' UI elements up and running\
    \ incredibly quickly, freeing you to focus on the task of building the back-end\
    \ of an amazing application.\n\nIf you're comfortable with setting up Bootstrap\
    \ yourself, go ahead and implement it into the project as you see fit. If you're\
    \ unsure about the process, don't worry—copy everything from the includes folder\
    \ in this book's code archive, and you'll be up and running with Twitter Bootstrap\
    \ in no time.\n\nGo back to our project and create two new files in the templates\
    \ folder in the frontend folder and title them list-posts.php and view-post.php.\
    \ In list-posts.php add the following code:\n\n```\n<?php require_once 'includes/temps/header.php';\
    \ ?>\n<?php foreach ($posts as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']);\
    \ ?></h3>\n        <p><?php echo implode(' ', array_slice(explode(' ', \n↵strip_tags($post['content'])),\
    \ 0, 10)); ?> [...]</p>\n        <a href=\"<?php echo $this->base->url.\"/?id=\"\
    .$post['id'];\n↵ ?>\" class=\"btn btn-primary\">Read More</a>\n    <hr/>\n<?php\
    \ endforeach; ?>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\n\
    Next, add the following code to the view-post.php file:\n\n```\n<?php require_once\
    \ 'includes/temps/header.php'; ?>\n<br/>\n<a href=\"<?php echo $this->base->url;\
    \ ?>\" class=\"btn btn-primary\">\n↵Return to Post List</a>\n<?php foreach ($posts\
    \ as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']); ?></h3>\n\
    \        <?php echo htmlspecialchars($post['content']); ?>\n    <hr/>\n<?php endforeach;\
    \ ?>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\nOur `list-post.php`\
    \ file loops through the numerous posts we have collected from our database, creating\
    \ a small excerpt from our post's content and creating a link to read each one.\
    \ Our `view-post.php` file displays the title and the body of content for an individual\
    \ post that's been loaded from the database.\n\nBoth `list-post.php` and `view-post.php`\
    \ should seem pretty straightforward. However, you may have noticed some unusual\
    \ and complex-looking code in the list-posts.php file:\n\n```\nimplode(' ', array_slice(explode('\
    \ ', \nview-post.phpstrip_tags($post['content'])), 0, 10));\n```\n\nThis line\
    \ of code combines several different PHP functions to strip out the first ten\
    \ words of our post's content to automatically create an excerpt string that'll\
    \ be displayed in our list of posts. The `strip_tags()` function removes any HTML\
    \ tags from the content, and the `explode()` function creates a new array and\
    \ key each time the function encounters a space in the content. Next, the `array_slice()`\
    \ function is used to take the first ten keys in our array created by the `explode()`\
    \ function. The `array_slice()` function is passed `0` to indicate it should start\
    \ counting from `0` and stop counting when it reaches `10`. In addition, it's\
    \ passed the array created by the `explode()` function. Finally we use the `implode()`\
    \ function to bring those ten array values together as a string.\n\nFor more details\
    \ about these functions in PHP and an in-depth overview of what they can be used\
    \ for, check out the following resources:\n\n*   [http://php.net/manual/en/function.strip-tags.php](http://php.net/manual/en/function.strip-tags.php)\n\
    \n*   [http://php.net/manual/en/function.explode.php](http://php.net/manual/en/function.explode.php)\n\
    \n*   [http://php.net/manual/en/function.array-slice.php](http://php.net/manual/en/function.array-slice.php)\n\
    \n*   [http://php.net/manual/en/function.implode.php](http://php.net/manual/en/function.implode.php)\n\
    \nThe next stage in our example application is to create our admin and login panels.\
    \ We'll create the latter first. Open up the login.php file in the includes directory.\
    \ It's located within our project directory's main directory. Start by adding\
    \ the following to the constructor method:\n\n```\npublic function __construct()\
    \ {\n    $this->ksdb = new Database;\n    $this->base = (object) '';\n    $this->base->url\
    \ = \"http://\".$_SERVER['SERVER_NAME'];\n    $this->index();\n}\n```\n\nIn essence,\
    \ our constructor sets up the objects and variables we're going to need throughout\
    \ the class. Next we need to add to the `index()` method:\n\n```\npublic function\
    \ index() {\n    if ($_SERVER['REQUEST_METHOD'] === 'POST') {\n        $this->validateDetails();\n\
    \    } elseif (!empty($_GET['status']) && $_GET['status'] == \n↵'inactive') {\n\
    \        $error = 'You have been logged out due to inactivity.\n↵ Please log in\
    \ again.';\n    }\n    require_once 'admin/templates/loginform.php';\n}\n```\n\
    \nIn the `index()` method, we check to see whether our user has been logged out\
    \ due to inactivity. It does this by checking to see if the `inactive` URL variable\
    \ has been set. It also checks to see if form data has been passed to it using\
    \ the `POST` method and, if so, the script then assumes that a user is trying\
    \ to log in and will fire up the `validateDetails()` method to check their login\
    \ details—something we'll cover shortly. Finally, the method loads up `loginform.php,`which\
    \ is used to load the form for users to log in with.\n\nNext we move onto the\
    \ `loginSuccess()` method and the `loginFail()` method:\n\n```\npublic function\
    \ loginSuccess() {\n    header('Location: http://' . $_SERVER['SERVER_NAME'] .\n\
    ↵ '/admin/posts.php');\n    return;\n}\n\npublic function loginFail() {\n    return\
    \ 'Your Username/Password was incorrect';\n}\n```\n\nThe `loginSuccess()` method\
    \ is used in those instances when the login is successful, and the method redirects\
    \ the user to the admin panel, and the `loginFail()` method returns an error status\
    \ (informing the user that their login was unsuccessful.)\n\nFor more information\
    \ on the `header()` function, please see [http://php.net/manual/en/function.header.php](http://php.net/manual/en/function.header.php).\n\
    \nFinally, we'll move on to the `validateDetails()` method:\n\n```\nprivate function\
    \ validateDetails() {\n    if (!empty($_POST['username']) && !empty($_POST['password']))\
    \ {\n        $salt = '$2a$07$R.gJb2U2N.FmZ4hPp1y2CN$';\n        $password = crypt($_POST['password'],\
    \ $salt);\n        $return = array();\n        $query = $this->ksdb->db->prepare(\"\
    SELECT * FROM users WHERE \n↵username = ? AND password = ?\");\n        try {\n\
    \            $query->execute(array($_POST['username'], $password);\n         \
    \   for ($i = 0; $row = $query->fetch(); $i++) {\n                $return[$i]\
    \ = array();\n                foreach ($row as $key => $rowitem) {\n         \
    \           $return[$i][$key] = $rowitem;\n                }\n            }\n\
    \        } catch (PDOException $e) {\n            echo $e->getMessage();\n   \
    \     }\n        if (!empty($return) && !empty($return[0])) {\n            $this->loginSuccess();\n\
    \        } else {\n            echo $error = $this->loginFail();\n        }\n\
    \    }\n}\n```\n\n`validateDetails()` is the core method within the `login` class,\
    \ and is where our script checks and validates the user's attempt to log in to\
    \ our blog application's admin panel.\n\nTo start with, the method checks that\
    \ the script has obtained form data using the `POST` method, and checks that the\
    \ username and password keys are present in the `$_POST` superglobal variable\
    \ and are not empty, using the `empty()` function in PHP. If the username and\
    \ password are in the `$_POST` superglobal variable, we then create a password\
    \ [**salt**](http://en.wikipedia.org/wiki/Salt_\\(cryptography\\)) made up of\
    \ random characters and symbols used to encrypt our password. We then take the\
    \ submitted passwords from the login form, encrypt it, and then check to see if\
    \ the submitted username and encrypted password match the details stored in the\
    \ database."
