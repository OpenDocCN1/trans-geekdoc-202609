  trans: "\n总来说，cookies 应该用于存储小量信息，这些信息可以用于个性化网页的小部分以提升用户体验。它们还可以允许用户恢复之前与您的应用程序的交互，营造出他们仍处于登录状态的错。\n\
    \n### 注意：Cookies 与安全\n\n记住不要在 cookies 中存储敏感数据，因为每当请求页面时，cookies 都会被发送到 Web 服务器，并可能被精通技术的攻击者访问。\n\
    \n此外，由于 cookies 存储在用户的计算机上，我们作为开发者，在保护 cookies 方面做的其实非常有限。因此，理想情况下，cookies 只应该存储应用程序用于识别存储在数据库或其他安全存储选项中信息的数据，而不是将数据直接存储在\
    \ cookie 中。\n\n### 会话 (Sessions)\n\n会会将 cookies 的实用性与 Web 服务器的安全性和可管理性结合。与 cookie\
    \ 不同，特定的变量数据和信息不会直接存储在用户的计算机上。数据本身实际上存储在托管并处理网站或 Web 应用程序的服务器上。\n\nSessions 与我们目前看到的任何其他变量都不同，因为它们不会在浏览器请求的页面之间直接传递数据——相反，数据是从每个页面开始时启动的会话中检索的。如前所述，sessions\
    \ 使用存储在客户端计算机上的 cookie 来将正确的用户与其存储在会话中的数据识别起来。这个 cookie 不包含任何个人信息，而且除非与 Web 服务器上存储的数据进行比较，否则这些数据没有任何意义；通常它它以键的形式出现，例如\
    \ `350401be75bbb0fafd3d912a1a1d5e54`。出于这个原因，sessions 的数据安全性比单独使用 cookies 更高。\n\
    \n虽然这种在客户端计算机和服务器上同时存储数据的方法看起来可能有些笨拙，但它实际上有其优势：\n\n*   Sessions 对可以存储的数据量没有限制。这是因为\
    \ sessions 存储在服务器上，因此不会对服务器的带宽产生负面影响。\n*   由于 session 数据存储在 Web 服务器上而不是用户的计算机上，这允许你将安全精力放在\
    \ Web 服务器上，而不是应用能够适应用户浏览器存储能力的加密方法。\n\n关于 sessions 需要记住的一点是，你可以指定它们存活或活跃的时间。我们将其称为“存活时间”（time-to-live），通常配置为在用户关闭与\
    \ Web 服务器建立会话的浏览器或标签页后，会话过期或失效。例如，如果一个用户登录了社交媒体应用程序，当他们完成使用并关闭浏览器时，如果配置了此类操作，会话将自动删除该用户的数据——这是一个非常实用的功能。\n\
    \n## PHP 中的 Sessions 和 Cookies\n\n现在我们已经涵盖了使用 sessions 和 cookies 的原因以及它们之间的主要区别，是时候开始学习如何在\
    \ PHP 中实现它们了。\n\nsessions 和 cookies 都可以通过专门用于这些方法的特殊变量进行访问和加载。在 PHP 中，我们通过使用超全局变量\
    \ `$_COOKIE` 来表达使用和操作 cookie 的意图。\n\n### PHP 中的 Cookies\n\n现在我们已经知道了编写和使用 cookies\
    \ 的基础知识，我们将查看如何使用和编写 sessions。就像 cookies 一样，这种方法利用了一个特殊的超全局变量，我们通过该变量向 sessions\
    \ 分配数据并从其获取数据：`$_SESSION`。\n\n我们必须使用一些特殊的函数来设置 cookies。在我们的示例中，我们设置了 cookie 的过期时间和日期，并将其存储在第一行的\
    \ `$expire` 变量中。注意我们使用了 `time()` 函数。让我们创建一个新文件并添加以下代码：\n\n```php\n<?php\n$expire\
    \ = time() + 60 * 24 * 30;\nsetcookie(\"user\", \"Joe Public\", $expire);\nif\
    \ (isset($_COOKIE[\"user\"])) {\n    echo \"Welcome \" . $_COOKIE[\"user\"];\n\
    } else {\n    echo \"Welcome!\";\n}\n```\n\n### 重要：isset()\n\n同样重要的是，来自 cookies\
    \ 的数据会在每次页面请求时发送到服务器。如果你的脚本在发送任何 cookie 数据之前输出了 HTML，或者设置了任何要发送的 cookie 数据，PHP\
    \ 将报错。请确保在脚本开始时设置并发送 cookie 数据是非常重要的。但是你可以在脚本的后续（在 HTML 发送之后）检索 cookie 数据。这不会引发\
    \ PHP 错误（只要 cookie 存在且有数据）。强烈建议你花时间阅读[关于 PHP 中 cookies 的 SitePoint 文章](http://www.sitepoint.com/php-sessions/)\
    \ 以进一步了解。\n\n`isset()` 函数检查变量是否有值。在上面的代码中，我们使用 `$_COOKIE` 来确保 cookie 已被检测到。现在查看\
    \ `storage.php` 文件时，你会发现 `isset()` 将会-.\n"
- fmt: "\nSessions work in a similar way to cookies, but have a specific process for\
    \ assigning data that's quite different from the way a cookie's data is set. Initially,\
    \ we need to tell PHP we'd like to use a session, which we do with the `session_start()`\
    \ function. We also have the option to remove session variables individually,\
    \ and collectively, using functions such as `session_unset()` and `session_destroy()`.\
    \ Here is a basic example of how we start a session, add data to it, and retrieve\
    \ that data using the `$_SESSION` variable we spoke about earlier:\n\n```php\n\
    <?php\nsession_start();\n$_SESSION[\"username\"] = \"myusername\";\necho \"Username\
    \ = \" . htmlspecialchars($_SESSION[\"username\"]);\n```\n\nAs you can see, we\
    \ start the session, create a new session variable titled `username` and set the\
    \ string `\"myusername\"` to that variable. Finally, we display the string stored\
    \ in the session variable in the browser. This is only a basic example because,\
    \ if we were using this code in a real project, we'd actually spread it over two\
    \ files—the first starting the session and creating the `username` session variable,\
    \ and a second also starting a session, but then displaying the string stored\
    \ in the session variable.\n\nIt's important that you end a session when you've\
    \ finished using it. Despite the fact that sessions are used for temporary data\
    \ storage, they can still be vulnerable to attack. Ending a session helps to ensure\
    \ maximum security when dealing with potentially sensitive information. To do\
    \ this, we simply add the `session_destroy()` function to our code once we are\
    \ finished, like so:\n\n```php\n<?php\nsession_start();\n$_SESSION[\"username\"\
    ] = \"Username\";\necho \"Username = \" . $_SESSION[\"username\"];\nsession_destroy();\n\
    ```\n\nIt's highly recommended that you end a session once you're finished and\
    \ have no further need for it in your code, in order to stop malicious code being\
    \ injected into your PHP scripts.\n\nIf we don't want to end the session but,\
    \ instead, remove a piece of data from it, we can use the `unset()` function.\
    \ Here's an example of `unset()` in action:\n\n```php\n<?php\nsession_start();\n\
    unset($_SESSION[\"username\"]);\n```\n\nWe can also unset all sessions and their\
    \ values by using the `session_unset()` function. So, if we change our short example\
    \ from the above, we can use `session_unset()` like so:\n\n```php\n<?php\nsession_start();\n\
    session_unset();\n```\n\n### Warning: Don't Keep Sensitive Data in Sessions\n\n\
    Earlier in the chapter we discussed how cookies shouldn't be used to store sensitive\
    \ data, even temporarily. That same advice can also be applied to sessions, even\
    \ though they're considered more secure than cookies. While sessions' data is\
    \ stored on the web server and not on the user's computer, sessions can also be\
    \ a target for attackers and hackers. As such it's also recommended that you don't\
    \ use sessions to store sensitive data.\n\n## Project\n\nSo now that we've covered\
    \ the use of sessions and cookies, it's time we started filling out the shell\
    \ of our project so it becomes a fully functional blog platform. To begin with,\
    \ let's start by taking our `login.php` file in the `includes` folder, and adding\
    \ to it. We'll start by editing the `index()` method:\n\n```php\npublic function\
    \ index() {\n    if (isset($_GET['status']) && $_GET['status'] == 'logout') {\n\
    \        session_unset();\n        session_destroy();\n        $error = 'You have\
    \ been logged out. Please log in.';\n        require_once 'templates/loginform.php';\n\
    \    } elseif (!empty($_SESSION['kickstart_login'])) {\n        if ($_SERVER['REQUEST_METHOD']\
    \ === 'POST') {\n            $this->validateDetails();\n        } elseif (isset($_GET['status']))\
    \ {\n            if ($_GET['status'] == 'inactive') {\n                session_unset();\n\
    \                session_destroy();\n                $error = 'You have been logged\
    \ out due to inactivity. Please log in.';\n            }\n        }\n        require_once\
    \ 'templates/loginform.php';\n    }\n}\n```\n\nWhat we've added in `index()` is\
    \ to track how active our user is throughout the admin panel. We've also added\
    \ a logout process which will destroy their session once the user has chosen to\
    \ log out. We've also added a `if` statement to check whether the user is logged\
    \ in using the admin panel.\n\nFinally, we've added the `session_start()` function\
    \ at the top of our file to begin the session each time a user's browser requests\
    \ a page within the admin panel. Then, with the code we've added to the constructor,\
    \ our `Adminpanel` class checks first to see how active our user's been throughout\
    \ the admin panel, and if they've become idle, our application logs them out by\
    \ killing their session and returning them to the login screen. If they're still\
    \ active, the class will then check to see if the user has made a request to log\
    \ out, or if they are trying to access the admin panel directly without logging\
    \ in first. In either case, the user will be redirected back to the login screen\
    \ to log in. Finally, if the user has already logged in and has an active session,\
    \ the class will start to load up everything it needs to render the admin panel\
    \ correctly.\n\nNext, we take a quick look at the `loginSuccess()` method:\n\n\
    ```php\npublic function loginSuccess() {\n    $_SESSION['kickstart_login'] = true;\n\
    \    $_SESSION[\"timeout\"] = time();\n    header('Location: ' . $this->url .\
    \ '/posts.php');\n}\n```\n\nHere, all we've added is two session variables and\
    \ their respective data, once the user has been allowed to the admin panel. Those\
    \ are the only things we've changed in `login.php`, so next, let's take a look\
    \ at the `admin.php` file that's also in our `includes` folder. To begin with,\
    \ we're going to add to the `Adminpanel`'s constructor, as well as adding some\
    \ code at the start of our file:\n\n```php\n<?php\nsession_start();\nrequire_once\
    \ 'database.php';\nclass Adminpanel {\n    public function __construct() {\n \
    \       $inactive = 600;\n        if (isset($_SESSION[\"kickstart_login\"])) {\n\
    \            $sessionTTL = time() - $_SESSION[\"timeout\"];\n            if ($sessionTTL\
    \ > $inactive) {\n                session_unset();\n                session_destroy();\n\
    \                header(\"Location: http://\" . $_SERVER['SERVER_NAME']\n    \
    \             . \"/login.php?status=inactive\");\n            }\n        }\n \
    \       $_SESSION[\"timeout\"] = time();\n        $login = $_SESSION['kickstart_login'];\n\
    \        if (empty($login)) {\n            session_unset();\n            session_destroy();\n\
    \            header('Location: http://'.$SERVER['SERVER_NAME']\n            .'/login.php?status=loggedout');\n\
    \        } else {\n            $this->ksdb = new Database;\n            $this->base\
    \ = (object) '';\n            $this->base->url = 'http://'.$SERVER['SERVER_NAME'];\n\
    \        }\n    }\n}\n```\n\nNext, let's look at the `Posts` class, which extends\
    \ the `Adminpanel` class:\n"
