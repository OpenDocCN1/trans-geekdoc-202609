    Callum 职业是一名 Web 开发人员，同时也热爱设计。凭借在设计和开发流程方面的知识，他能够影响 Web 构建过程的两个方面。他对复杂代码功能以及美观设计与功能的的热情促使他寻找新的方法为全球客户构建、设计和优化
    Web 解决方案。


    ## 关于 SitePoint


    SitePoint 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)
    访问我们的博客、书籍、通讯报、文章和社区论坛。你将找到关于 JavaScript、PHP、Ruby、移动开发、设计等大量信息。


    ## 关于 Jump Start


    Jump Start 系列书籍为你提供对 Web 开发语言和技术的快速且实用的介绍。这些书籍通常长度约为 150 页，可以在周末内读完，让你在该主题上打下坚实的基础，并有独立实验的信心。


    ***


    致我所有的家人和朋友，感谢你们一直的支持，我爱你们。


    PHP 被认为是最流行的 Web 语言之一。从核心来看，PHP 设计的目的是帮助增强网页并使其内容动态化，但多年来 PHP 已经进化成了比这有用得多的东西。通过
    PHP，开发者可以轻松构建复杂的应用程序，例如论坛、图库等。


    在本书 **Jump Start PHP* 中，我们将教你使用 PHP 进行编写和开发的基础知识，并将引导你从构建具有动态内容的基础 PHP 网页，一直到构建交互式
    Web 应用程序。我们将解决安全、数据库交互以及为构建你的 PHP 应用程序设置开发环境等问题。


    在整个 **Jump Start PHP* 中，我们将维护一个持续的项目——一个小型但健壮的博客应用程序，它会将每章讨论的理论应用于真实的开发场景中。该项目将包含一些实用功能（显示帖子、评论和管理工具的前端），并希望有助于展示我们在书中贯讨论的概念。


    ## 谁应该读这本书


    寻求快速入门 PHP 的开发者。你需要了解 HTML 和 CSS，具有其他编程语言的经验将会有帮助。


    ## 使用的规范


    你会注意到，我们在整本书中使用了特定的排版和布局样式来表示不同类型的信息。请关注以下项目。


    ### 代码示例


    书中的代码将使用代码块显示：


    ```php

    if (condVar > someVal) {console.log("xxx")}

    ```


