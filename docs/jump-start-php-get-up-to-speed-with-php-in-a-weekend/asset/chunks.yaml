    \ is similar to a `while` loop, but with one key difference: the block of code\
    \ is executed at least once before the condition is checked.\n\n```php\n$i = 0;\n\
    do {\n    echo $i . '<br>';\n    $i++;\n} while ($i < 10);\n```\n\n### foreach\
    \ Statement\n\nThe `foreach` loop is used to iterate over the elements of an array.\
    \ It is the most convenient way to work with arrays in PHP.\n\n```php\n$colors\
