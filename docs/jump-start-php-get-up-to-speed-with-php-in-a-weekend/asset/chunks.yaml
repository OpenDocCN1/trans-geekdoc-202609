    MAMP 可能会安装两个文件夹，一个名为 MAMP，另一个名为 MAMP Pro。如果你的电脑上已经安装了 MAMP Pro，请删除此文件夹和应用程序。MAMP
    Pro 是一个付费程序，而 MAMP 是一个免费应用程序。


    完成后，你可以通过点击 MAMP 图标来启动 MAMP 程序；你将看到欢迎界面。


    ![MAMP 启动界面](img/mampslash.png)

    图 1.2. MAMP 启动界面


    在图 1.2 所示的启动界面上，你应该能在框的左侧看到两个标题标记为 `Apache Server` 和 `MySQL Server` 的图标，它们旁边都应该有一个红点。这些红点意味着它们尚未启动。要启动它们，我们需要点击
    `Start Servers` 按钮；圆点应该变为绿色。点击 `Start Servers` 按钮后，你的默认浏览器将打开并加载 MAMP 启动屏幕。


    ![MAMP 启动界面](img/mampstart.png)

    图 1.3. MAMP 启动界面


    MAMP 现在已安装。然而，它强制你使用端口 `8888` 来访问 Apache 服务器。这不像像 WAMP 那样只需在浏览器地址栏中输入 `localhost`
    访问服务器那样方便。幸运的是，这个问题有一个非常简单的解决方法。切换回 MAMP 启动界面并选择 `Preferences` 按钮。在面板顶部的小导航菜单中，应该有一个标题为
    `Ports` 的选项。


    在此窗口中，你应该能看到一个左侧有 `Apache Port` 标签的输入框。如果你将此选项从 `8888` 改为 `80`，你现在就可以通过在浏览器地址栏中简单输入
    `localhost/MAMP` 来访问 MAMP 启动屏幕了。


    ## Linux


    如果你运行的是 Ubuntu 或 Debian 等 Linux 操作系统，可以使用终端从系统仓库安装 `LAMP` 包。在 Linux 上安装本地服务器与
    Windows 或 Mac OS X 略有不同。安装方法稍微高级一些，但它在运行和管理服务器时允许提供更多的控制和自由。事实上，这种方法与用于在 Linux
    上管理和运行实时 Web 服务器的方法几乎相同。我们在这里介绍的安装示例将专门展示在 Ubuntu 上安装 `LAMP` 的步骤。


    第一步是启动终端程序，可以通过在 Dash 菜单中搜索 `Terminal`、点击 Ubuntu 侧边菜单中的第一个图标，或通过文件夹导航进入 `Applications
    > Accessories > Terminal` 来完成。


    打开终端后，你可以从在电脑上安装 Apache 开始。通过在终端中输入以下内容来实现：


    ```bash

    sudo apt-get install apache2

    ```


    按下 `Enter` 键，你的终端将开始疯狂运行，但不要惊慌，这是正常的。


    Apache 现在应该已经安装完成，你的本地服务器基础设置也将就绪。要测试这一点，打开浏览器浏览器并在地址栏中输入 `localhost`。如果安装成功，你将看到如图
    1.4 所示的“It works!”启动界面。


    ![Linux 上的 localhost](img/localhostlinux.png)

    图 1.4. Linux 上的 localhost


    现在你需要安装 PHP，请返回终端并输入：


    ```bash

    sudo apt-get install php5 libapache2-mod-php5*

    ```


    PHP 5 将连同你刚刚安装的 Apache 服务器配合工作所需的各种基础库一起安装。完成后，你必须重启 Apache 才能识别到刚刚安装了 PHP。在终端中输入以下命令：


    ```bash

    sudo service apache2 restart

    ```


    你的 Apache 服务器现在将重启，检测到你已安装 PHP，并将加载在本地服务器上运行 PHP 需要的所有库。


    现在你已经让本地服务器运行起来，并且安装了 PHP。要安装 MySQL 和 phpMyAdmin，我建议遵循[Mhabub Mamun 编写的此指南。](http://www.developmentwall.com/install-apache-php-mysql-phpmyadmin-ubuntu/4)


    最后，你可以选择启用 Apache 的 `mod_rewrite` 模块，这允许开发者通过重写请求的 URL 将用户重定向到网站的不同部分。有关启用和设置
    `mod_rewrite` 模块的完整深度指南，请参考 [ Nettuts+ 指南](http://net.tutsplus.com/tutorials/other/a-deeper-look-at-mod_rewrite-for-apache/)，该指南提供了非常详细的逐步教程。


    ## PHP 配置


    在我们深入编写一些 PHP 代码之前，让我们配置 PHP 以更好地适应我们的项目。PHP 的配置由 `php.ini` 文件决定，该文件包含了所有关于 PHP
    在我们服务器上如何运行的核心设置。你可以通过在 PHP 脚本中使用 `phpinfo()` 函数来快速查看 PHP 当前配置的概览。要这样做，请在服务器文件夹中创建一个名为
    `info.php` 的新文件，向文件中添加以下代码并保存：


    ```php

    <?php

    phpinfo();

    ```


    现在，将浏览器指向 `info.php` 文件，你应该会看到一个页面，显示一个关于我们 PHP 当前配置信息的表格，如图 1.5` 所示。


    ![phpinfo](img/phpinfo.png)

    图 1.5. phpinfo


    在这里你应该找到一个标题为 `Configuration File (php.ini) Path` 的行，这将告诉你的 `php.ini` 文件的具体位置。你可以在图
    1.5` 中看到它。`php.ini` 文件包含了许多设置，其中某些你可能永远不需要更改。然而，有一些可以更改以适应你的开发环境。对于 `php.ini`
    文件的之旅，我强烈建议阅读[为 SitePoint 写的文章](http://www.sitepoint.com/a-tour-of-phpini/)。


    ## Hello PHP


    现在你已经安装并运行了本地服务器，让我们开始编写 PHP 吧！我们首先进入 Apache 文件夹，它根据你使用的操作系统位于不同的位置：


    - 对于使用 WAMP 的 Windows 用户，打开资源管理器或我的电脑并导航到目录 `C:/Program Files/wamp/`

    - 对于使用 MAMP 的 Mac OS X 用户，打开 Finder 并导航到 `Applications > MAMP > htdocs` 以找到 MAMP
    的目录。

    - Linux 的 Web 位于 `/var/www`。许多 Linux 开发者喜欢编辑配置文件来更改使用的目录。要这样做，请参考 [Stack Overflow
    上的解决方案](http://stackoverflow.com/a/5891858)。


    一旦你找到了服务器的 Web 目录，你需要创建一个作为项目“根”的目录，所有的项目文件将放在这里。现在，创建一个名为 `my_project` 的目录。特意避免在文件夹名称中使用任何空格或大写字母，因为这将成为访问该文件夹内文件的
    URL 的。


    现在在 `my_project` 文件夹中创建一个名为 `index.php` 的新 PHP 文件。创建文件后，你需要用可以编辑 PHP 文件的文本编辑器打开它。


    ### 注意：选择文本编辑器


    我建议使用支持 PHP 语法高亮的编辑器。选择编辑器是一个非常个人的决定，因为不同的编辑器提供不同的功能；某些编辑器会配合你的编码方式，而某些则可能会产生冲突。最终，选择应该取决于哪个编辑器能让编程变得更简单、更有趣。在最终决定之前，值得尝试不同的编辑器。


    这里是一些流行的编辑器器的简短列表，包含了免费和付费编辑器的混合：


    *   [Adobe Dreamweaver](http://www.adobe.com/products/dreamweaver.html) – (Windows
    和 Mac OS X)


