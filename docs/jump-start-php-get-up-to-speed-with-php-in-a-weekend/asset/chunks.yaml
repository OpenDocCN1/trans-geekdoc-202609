    \ In the next chapter we'll be going over each of the files and their functions\
    \ in detail as we build the functionality that makes the real guts of the application.\n\
    \n## Summary\n\nIn this chapter we've seen two practices that help us keep our\
    \ code organized and manageable: OOP and templating.\n\nOOP allows developers\
    \ to write code that is organized and reusable. You'll find OOP patterns in almost\
    \ every computer programming language, so learning and mastering OOP will improve\
    \ your knowledge and skills as a developer.\n\nTemplating is another pattern that\
    \ can keep our code well organized and helps prevent front-end developers and\
    \ back-end developers from getting in each other's way.\n\nIn the [next chapter](#ch04.html\
    \ \"Chapter 4Forms\") we'll go over each of the files we created for our blogging\
    \ application and discuss their methods in detail as we build up the functionality\
    \ for the core of our application.\n\nForms are a vital part of any web application;\
    \ they're commonly used as a way for visitors to provide information to websites.\
    \ If you've done any type of HTML or web development, the chances are you've spent\
    \ at least a little time with forms—perhaps connecting them to a third-party system\
    \ for validation or processing. PHP can work with very complex forms to enable\
    \ users to submit data to be validated and processed by your application.\n\n\
    In this chapter we're going to look at the various ways PHP can collect the data\
    \ submitted from a form, and discuss how to validate it, preparing it for entry\
    \ into our MySQL database. Later on, we'll carry on building our blog platform\
    \ and will add a working admin panel.\n\n## Form Elements\n\nTo start with, let's\
    \ go over the basic elements that make up a working HTML form. Forms are built\
    \ with various HTML tags, such as `<form>`, `<input>`, `<textarea>`, `<select>`,\
    \ and `<optgroup>`, for handling data input. There are also `<label>` tags for\
    \ labeling inputs, although the data attached to these labels isn't passed through\
    \ the form when it's submitted.\n\nThe foundation of the form is an important\
    \ part of how the data is transferred from it to the processing script, so let's\
    \ take a look at the important `<form>` element attributes you should consider:\n\
    \n*   `action` – The `action` attribute sets the destination to which the form\
    \ data is submitted. The value of this attribute can be an absolute or relative\
    \ URL.\n\n*   `method` – The `method` attribute specifies how the data is sent\
    \ to the URL specified in the `action` attribute. The value of the `method` attribute\
    \ can be either `POST` or `GET`, with `GET` being the default option if this attribute\
    \ is left empty. We will discuss these options later in this chapter as they play\
    \ vital roles in processing a form's data in PHP."
