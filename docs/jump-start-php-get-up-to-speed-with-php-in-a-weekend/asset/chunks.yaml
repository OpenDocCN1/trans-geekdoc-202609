  trans: "\n\n*   最著名的编辑器之一。它提供了广泛的一键选项，并内置了 FTP 客户端。\n\n*   [Sublime Text](http://www.sublimetext.com/)\
    \ – (Windows, Mac OS X, 和 Linux)\n    *   一个免费试用的编辑器，内置了一些强大的快捷键和宏命令。\n\n* [Komodo\
    \ Edit](http://www.activestate.com/komodo-edit) – (Windows, Mac OS X, 和 Linux)\n\
    \    *   一个强大的免费编辑器，界面精美并内置 FTP 客户端。\n\n* [Coda](http://panic.com/coda/) – (Mac\
    \ OS X)\n    *   一个非常用户好的编辑器，功能非常强大。\n\n* [Notepad++](http://www.notepad-plus-plus.org/)\
    \ – (Windows)\n    *   一个非常流行的免费编辑器。\n\n一旦你选择了适合自己的编辑器，打开 `index.php`，你就可以开始向文件中写入一些\
    \ PHP 代码了。输入以下代码并保存文件：\n\n```\n<?php echo \"Hello World\"; ?>\n```\n\n让我们运行这段代码。打开网络浏览器，在浏览器的地址栏中输入\
    \ `http://localhost/my_project/index.php`。你应该看到类似于图 1.6 的内容。\n\n![Hello, world!](img/helloworld.png)\n\
    \n图 1.6. Hello, world!\n\n恭喜你！你刚刚写了第一段 PHP 代码！如你所见，代码在浏览器中显示了“Hello World”字符串，但你到底在\
    \ PHP 文件中输入了什么呢？让我们来分解一下这行代码：\n\n*   `<?php` : 这被称为起始标签。它告诉服务器随后的代码旨在解释为 PHP，服务器应该使用\
    \ PHP 引擎来渲染这些代码。每当你想在文件中使用 PHP 代码时，必须输入此标签。\n\n*   `echo \"Hello World\";` : `echo`\
    \ 是一个基础的 PHP 结构，它告诉 PHP `echo` 命令之后的内容是你希望在浏览器中显示的内容。在想要在屏幕上显示的文本周围加上引号。此外，你还在后面添加了重要的分号，表示你的\
    \ `echo` 语句结束了。\n\n*   `?>` : 这是 PHP 的结束标签，告诉服务器停止渲染 PHP 代码。结束标签并不总是需要使用的。保持代码“未闭合”可以防止意外的内容发送到浏览器中。在不需要时跳过结束标签可以避免在你开始编写更复杂的\
    \ PHP 代码时可能出现的问题。在书的后续部分，你将看到没有 PHP 结束标签的代码。该标签是有意省略的。\n\n### 重要：使用你的分号！\n\n记住在所有\
    \ PHP 语句末尾添加分号是非常重要的，因为没有分号，PHP 将不知道一个语句何时结束，下一个语句何时开始。\n\nPHP 文件还允许将 PHP 代码与普通的\
    \ HTML 结合。如果你将 PHP 和 HTML 结合在一起，就可以创建非常漂亮的网页，其中包含动态和复杂的数据，而 HTML 无法独立处理和操作这些数据。\n\
    \n这是一个 HTML 和 PHP 协同工作的快速示例：\n\n```\n<!DOCTYPE html>\n<head>\n    <title>PHP 和\
    \ HTML 协同工作</title>\n</head>\n    <body>\n      <h1><?php echo 'This is a H1 tag\
    \ with PHP data'; ?></h1>\n      <p><?php echo 'This is a P tag with PHP data\
    \ also'; ?></p>\n    </body>\n</</html> \n```\n\n如果你将 `index.php` 的内容更改为上面的示例并返回\
    \ `http://localhost/my_project/index.php`，你将在浏览器中看到 HTML 代码正确显示了所有经过 PHP 处理的代码。\n\
    \n## PHP 变量\n\n让我们更上一层，探索变量的世界。变量代表计算机内存中的一个位置，我们可以在那里临时存储位信息。我们可以将某些数据分配给变量（将数据放入内存），并在整个脚本中使用该变量。每当\
    \ PHP 在我们的代码中看到变量时，它就知道要访问它所代表的数据。分配给变量的数据可以是任何内容，从简单的文本字符串（如“Hello World”）或数字（如“1234”）到我们将介绍的更复杂的数据结构。\n\
    \n变量名始终以 `$` 符号开头。它们的名称不能包含空格，且只能包含字母（大小写）、数字和下划线。此外，`$` 之后的第一个字符必须是字母或下划线。允许的变量名可以是\
    \ `$myAwesomeVariable`，甚至是 `$my_Awesome_Variable_1`。\n\n给变量赋予有意义的名字是一个良好的习惯，这样如果另一个开发者阅读你写的代码，他们就能知道这些数据代表什么。例如，如果我们想让一个变量包含关于人名字的数据，可以将变量命名为\
    \ `$personName`。\n\n### 注意：使用驼峰命名法 (CamelCase)\n\n如果变量名包含多个单词，通常的做法是将每个单词的首字母大写。这可以提高浏览代码时的可读性。\n\
    \n让我们来看一个变量使用的示例。修改 `index.php` 如下：\n\n```php\n<?php\n$myVar = 'Hello World';\n\
    echo $myVar;\n```\n\n那么我们编写了什么？首先，我们将字符串 \"Hello World\" 分配给变量 `$myVar`。现在再次查看\
    \ index.php 文件，使其看起来如下所示：\n\n```php\n<?php\n$myVar = 'Hello World';\necho $myVar;\n\
    ```\n\n再次刷新页面，你应该会在屏幕上看到“Hello World”。这是因为我们在 `echo` 语句使用了变量 `$myVar`。\n\n"
