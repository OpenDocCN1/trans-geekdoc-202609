    \ ${'var'.$c});\n        }\n        $z=0;\n        foreach($array as $col => $data){\n\
    \            ${'var' . $z} = $data;\n            $z++;\n        }\n        $result\
    \ = $query->execute();\n        $add = $query->rowCount();\n    } catch (PDOException\
