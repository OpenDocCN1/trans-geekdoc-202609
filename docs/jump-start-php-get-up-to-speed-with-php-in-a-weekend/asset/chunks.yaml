    \nNow all we need to do is save this template and we should have a fully working\
    \ blog platform complete with comments, as shown in [Figure 5.5](#ch05.html#comments\
    \ \"Figure 5.5. Our blog, now with comments!\"). Congratulations!\n\n### Summary\n\
    \nSessions and cookies are vital when you want to add user accounts into a PHP\
    \ application. They are powerful developer tools for personalizing data displayed\
    \ in the browser, as they can quickly and effectively identity users through data\
    \ stored on the user's computer. For user accounts in applications, cookies and\
    \ sessions are vital to create logged in statuses, which we have implemented for\
    \ our admin panel in our application. However, it's important to remember the\
    \ potential security risks that come with using cookies and sessions, and it's\
    \ also important to implement code that will reduce the security risk.\n\nFor\
    \ more information on using sessions and cookies, please see the following articles:\n\
    \n*   [http://www.sitepoint.com/php-sessions/](http://www.sitepoint.com/php-sessions/)\n\
