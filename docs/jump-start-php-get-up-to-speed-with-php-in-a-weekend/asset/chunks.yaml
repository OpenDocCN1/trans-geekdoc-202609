    \ of each `case`. The matching clause is the one that is executed. The `default`\
    \ case is executed if none of the other cases match.\n\nOnce PHP finds a matching\
    \ clause, it starts executing the code below and continues until it sees the `break`\
    \ keyword, after which it will jump to the end of the `switch` statement and merrily\
    \ continue on executing the rest of our script.\n\n### Note: Watch for the Break\n\
    \nPHP doesn't see the start of one `case` as the end of the previous `case`, which\
