    \n## Arrays\n\nFor more complex ways of storing data in memory we have the option\
    \ of using an array, which represents data just like a table. Let's begin with\
    \ the table shown in [Figure 1.7](#ch01.html#arrays \"Figure 1.7. A simple array\"\
    ).\n\n![A simple array](figures/table.png)\n\nFigure 1.7. A simple array\n\nWe\
    \ can write this table as an array in PHP like so:\n\n```php\n<?php\n$myArray\
    \ = array('item1' => 'My Value'); \n```\n\nWhat we've done here is create an array\
    \ named `$myArray` by using the `array()` construct to define our value, rather\
    \ than just a string or integer. Then we added a \"key\", which we named \"item1\"\
    \ and set the value \"My value\" to that key by using the `=>` symbol. This `=>`\
    \ symbol is PHP's way of denoting that the data following the symbol will be stored\
    \ in a place in memory that can be referenced from the array by that key.\n\n\
    We can add more than one key/data pair to our array when we define it as shown\
    \ in the following:\n\n```php\n<?php\n$myArray = array('item1' => 'My Value',\
    \ 'item2' => 'Another value');\n```\n\nAnother option is that we could've created\
    \ an empty array and added our key and value later in the following manner:\n\n\
    ```php\n<?php\n$myArray = array();\n$myArray['item1'] = 'My Value';\n$myArray['item2']\
    \ = 'Another value'; \n```\n\nSince PHP 5.4, we've had the ability to use a shorthand\
    \ notation for creating an array rather than the traditional `array()`. The shorthand\
    \ approach looks like this:\n\n```php\n<?php\n$myArray = ['item1' => 'My Value',\
    \ 'item2' => 'Another value'];\n```\n\nArrays allow us to work with some very\
    \ complex data and we'll be returning to them later on in the book. In the meantime,\
    \ to check out the basic usage of arrays I recommend having a look over following\
    \ articles:\n\n*   [http://www.php.net/manual/en/language.types.array.php](http://www.php.net/manual/en/language.types.array.php)\n\
    *   [http://www.sitepoint.com/introduction-to-php-arrays/](http://www.sitepoint.com/introduction-to-php-arrays/)\n\
    *   [http://www.htmlandphp.com/beginner-php/207-introduction-to-arrays-in-php.html](http://www.htmlandphp.com/beginner-php/207-introduction-to-arrays-in-php.html)\n\
    \n## Comments\n\nWe can write comments to ourselves in our PHP code. Comments\
    \ are not processed as statements. We start a comment by using two slashes `//`\
    \ ― anything written on the same line after the slashes will be considered to\
    \ be a comment and won't processed. For example:\n\n```php\n<?php\n// this is\
    \ a PHP comment for this only\n```\n\nWe can also use `/*` to signal the beginning\
    \ of a comment that spans multiple lines ending with `*/` to mark the end. For\
    \ example:\n\n```php\n<?php\n/* this is the beginning of our PHP comment.\nIt\
    \ can go on for multiple lines until we end it. */\n```\n\nComments allow developers\
    \ to leave notes to anyone reading their code, giving insight into how it works\
    \ and making it easier to maintain. Comments also allow us to temporarily hide\
    \ segments of code (\"comment out\").\n\n## Preparing Our Project\n\nTo conclude\
    \ this chapter, let's quickly lay out the directory structure for the book's project.\
    \ We'll be developing a blog application powered purely by PHP and a MySQL database\
    \ to store all our data. For now, we need to create a new folder in our web directory\
    \ we'll call `kickstart`. Inside this directory we need to make three more directories:\
    \ one named `admin`, another named `frontend`, and the last one named `includes`\
    \ as shown in [Figure 1.8](#ch01.html#homefolders \"Figure 1.8. Our project folders\"\
    ).\n\n![Our project folders](figures/homefolders.png)\n\nFigure 1.8. Our project\
    \ folders\n\nThe `admin` directory will house the files used for the admin panel.\
    \ The `frontend` directory will hold all the files used for the public side of\
    \ the blog to work. This public side is where visitors will be able to view blog\
    \ posts. The `includes` directory is where we'll place any scripts which can be\
    \ used in both the `admin` and public section.\n\nWe also need to create a directory\
    \ inside both the `admin` and `frontend` directories named `templates`. The `templates`\
    \ directory will hold all the PHP and HTML files that will accept data from scripts\
    \ in the `includes` folder. These template files will ultimately format our data\
    \ from PHP and create the layouts that our visitors will interact with in the\
    \ front-end. Further in the book we'll go into templating in greater depth and\
    \ learn why we're using it for our project. Separating out these folders like\
    \ this is helpful because it'll help you to develop cleaner and better-organized\
    \ code.\n\n## Summary\n\nIn this chapter we've covered the basics of setting up\
    \ a web server, introduced PHP coding by displaying text, and used variables to\
    \ store data. Everything covered in this chapter is an introduction and we'll\
    \ be coming back to some of the topics we've touched on later in the book.\n\n\
    In the next chapter we'll be looking at how we can use permanent storage options\
    \ such as a database with our scripts and how we can use the visitor's browser\
    \ to store small amounts of data as well. Data is the lifeblood of PHP. In this\
    \ chapter, we'll look at one of the many options that PHP offers to developers\
    \ in terms of processing data and using permanent storage solutions—interacting\
    \ with a MySQL database. In addition, we'll briefly explore some important programming\
    \ concepts, like conditional statements and loops, which become necessary when\
    \ reading data back from a database.\n\n## Operators\n\nIn PHP, just as in almost\
    \ all programming languages, operators are used to manipulate or perform various\
    \ operations on variables and values. The most basic operator is `=`, which as\
    \ we saw in [Chapter 1](#ch01.html \"Chapter 1 Server Kick-Start\") is used to\
    \ assign a value to a variable. But there are many other powerful operators to\
    \ discover.\n\nTo begin, let's create a new file named `op_experiments.php` in\
    \ the `my_project` folder that we created previously. In this file, add the following\
    \ code:\n\n```php\n<?php\n$firstName = \"myfirstname\";\n$lastName = \"mylastname\"\
    ;\n$fullName = $firstName . $lastName;\necho $fullName;  \n```\n\nWhile most of\
    \ this code probably looks pretty straightforward, the line `$fullName = $firstName\
    \ . $lastName;` may take you slightly by surprise, especially the little period\
    \ that sits between two of the variables.\n\nThe `.` is PHP's string concatenation\
    \ operator; it joins two strings together to make one longer string. PHP takes\
    \ the string value of `$firstName`, adds the value of `$lastName` to it, and places\
    \ the result in the variable `$fullName`. When we run the script and PHP outputs\
    \ the value of `$fullName`, we will see `myfirstnamemylastname` displayed in the\
    \ browser.\n\n![The output of our experiment](figures/op_experiments.png)\n\n\
    Figure 2.1. The output of our experiment\n\nIt's not very readable though, is\
    \ it? No worries. We can easily tweak the code a little to make the output more\
    \ readable. Modify the code so it looks like the following:\n\n```php\n<?php\n\
    $firstName = \"myfirstname\";\n$lastName = \"mylastname\";\n$fullName = $firstName\
    \ . \" - \" . $lastName;\necho $fullName;\n```\n\nNow we can see the separation\
    \ between our two names when we view them in the browser. Cool.\n"
