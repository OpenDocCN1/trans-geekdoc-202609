  trans: "\n图 2.2. 添加一些空格后的输出\n\n## 条件语句\n\nPHP 同样拥有允许我们比较值的操作符。例如，`==` 用于检查两个值是否相同，`<`\
    \ 用于检查一个值是否小于另一个值，而 `>` 用于检查一个值是否大于另一个值。\n\n大多数时候，我们使用这些比较操作符来编写`条件语句`（根据比较结果可能执行也可能不执行的语句）和`循环`（执行多次的语句）。\n\
    \n### if 语句\n\n`if` 语句由一个条件和一个或多个分组为代码块的语句组成。如果 PHP 评估该条件并发现其为真，它将执行该语句块。如果条件为假，则\
    \ PHP 将跳过该块。在下例示例中，PHP 检查 `$a` 的值是否等于 `$b`。如果是，它会在屏幕上显示“A is equal to B”。\n\n\
    ```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to B';\n}\n```\n\n### else\
    \ 语句\n\n`else` 语句是 `if` 语句的伙伴，它可以直接跟在 `if` 语句后面。PHP 只有在跳过了 `if` 语句的块后，才会执行构成 `else`\
    \ 块的代码。在下例中，PHP 检查 `$a` 的值是否等于 `$b`。如果是，它会在屏幕上显示“A is equal to B”。如果该测试失败，PHP\
    \ 将执行 `else` 语句之后块的代码，并在屏幕上打印“A is not equal to B”。\n\n```php\n<?php\nif ($a ==\
    \ $b) {\n    echo 'A is equal to B';\n} else {\n    echo 'A is not equal to B';\n\
    }\n```\n\n### elseif 语句\n\n另一个伙伴是 `elseif` 语句。正如其名，`elseif` 是 `if` 和 `else` 的组合。它包含一个条件，当\
    \ `if` 条件被发现为假时，PHP 会检查该条件。\n\n多个 `elseif` 语句可以组合使用以测试不同的条件，PHP 会检查每一个条件，直到发现其中一个条件为真。一旦找到真条件，PHP\
    \ 将跳过链中剩余的 `elseif` 语句。\n\n```php\n<?php\nif ($a == $b) {\n    echo 'A is equal\
    \ to B';\n} elseif ($a == $c) {\n    echo 'A is equal to C';\n} elseif ($a ==\
    \ $d) {\n    echo 'A is equal to D';\n} else {\n    echo 'A is not equal to anything';\n\
    }\n```\n\n## switch 语句\n\n如果你仔细观察我们的 `elseif` 示例，可能会发现每个条件基本上都在测试相同的内容——即某个变量的值是否等于\
    \ `$a` 的值。PHP 的 `switch` 语句可以完成类似的操作，而且看起来没那么杂乱。\n\n```php\nswitch ($a) {\n  \
    \  case $b:\n        echo 'A equals B';\n        break;\n    case $c:\n      \
    \  echo 'A equals C';\n        break;\n    case $d:\n        echo 'A equals D';\n\
    \        break;\n    default:\n        echo 'A is not equal to anything';\n  \
    \      break;\n}\n```\n\n在上面的示例中，PHP 获取 `switch` 开始时提供的值（`$a` 的值），并将其与每个 `case`\
    \ 的值进行比较。匹配的子句将被执行。如果没有其他 `case` 匹配，则执行 `default` 情况。\n\n一旦 PHP 找到匹配的子句，它就会开始执行下面的代码并一直持续到看到\
    \ `break` 关键字，之后将跳转到 `switch` 语句的结尾，并愉快地继续执行我们脚本的其余部分。\n\n### 注意：留意 Break\n\n\
    PHP 不会将一个 `case` 的开始视为上一个 `case` 的结束，这就是为什么 `break` 关键字是必要的。这在起初可能会让人困惑，而且很可能会出现你忘记使用\
    \ `break` 导致脚本运行不符合预期的情况，因此记住这一点非常重要。\n\n这种行为也意味着我们可以编写在多个 case 下执行的代码，如下所示：\n\
    \n```php\nswitch ($a) {\n    case $b:\n    case $c:\n    case $d:\n        echo\
    \ 'A equals B, C, or D';\n        break;\n    default:\n        echo 'A is not\
    \ equal to anything';\n```\n\n循环\n\n大多数时候，我们使用这些比较操作符来编写`条件语句`（根据比较结果可能执行也可能不执行的语句）和`循环`（执行多次的语句）。\n\
    \n### if 语句\n\n`if` 语句由一个条件和一个或多个分组为代码块的语句组成。如果 PHP 评估该条件并发现其为真，它将执行该语句块。如果条件为假，则\
    \ PHP 将跳过该块。在下例示例中，PHP 检查 `$a` 的值是否等于 `$b`。如果是，它会在屏幕上显示“A is equal to B”。\n\n\
    ```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to B';\n}\n```\n\n### else\
