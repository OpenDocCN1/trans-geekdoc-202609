    Figure 4.7. The front-end of our project\"). Exciting, huh?\n\n![The front-end\
    \ of our project](figures/post.png)\n\nFigure 4.7. The front-end of our project.\n\
    \nFeel free to navigate to the project's main `index.php` file and start using\
    \ the system.\n\nIn the next chapter we will extend the admin panel further to\
    \ allow us to update existing blog posts in the database and also to delete blog\
    \ posts.\n\n## Summary\n\nForms are a vital part of any web application, enabling\
    \ users to submit data. PHP provides us with powerful tools for processing, storing\
    \ and working with the data submitted via forms. In this chapter, we've discussed\
    \ the ways PHP can collect the data submitted from a form, looked at the `POST`\
    \ and `GET` methods, and also discussed how to validate the data collected, preparing\
    \ it for entry into our `MySQL` database. We then used the form methods we had\
    \ discussed to build out our blog application.\n\nAs we've discussed, databases\
    \ are ideal for storing storing data that an application can retrieve at a later\
    \ date. There are, however, some options for storing data on a more temporary\
    \ basis with PHP. `cookies` and `sessions` are designed to hold smaller chunks\
    \ of data than would normally be held in a database. They're often used to hold\
    \ users' personal data for login functionality, for example, and to provide quick\
    \ access to user data for functionality like application profiles.\n\nThe big\
    \ difference between cookies and sessions is where the data is stored. Cookies\
    \ store data on the client's computer, while sessions store their data on the\
    \ web server. PHP can work with both cookies and sessions, and we'll take a closer\
    \ look at each of these options in detail in this chapter.\n\n## Cookies: Overview\n\
    \nHTTP requests are stateless, which means that every time a new page is requested\
    \ by a browser, data relevant to a previous request from the user isn't remembered\
    \ by the web server.\n\nFortunately we have the option to use cookies, which allow\
    \ us to store small pieces of information on a visitor's browser. This cookie\
    \ information can be loaded by a website, and used in its scripts to personalize\
    \ data, or to help create dynamic data on pages within the site.\n\nCookies are\
    \ also incredibly useful when you need to keep data between HTTP page requests.\
    \ Each cookie created in the browser is accessible only by the browser that created\
    \ it, helping to keep the information contained in it secure.\n\n### Important:\
    \ Cookies and Recent European Legislation\n\nRecently, cookies have been placed\
    \ under a blanket of doubt for web developers who live, or work with projects\
    \ that are to be deployed, in Europe. The European Union has the opinion that\
    \ cookies are being used to store too much personal information about visitors\
    \ to websites, and [new legislation](http://www.ico.org.uk/for_organisations/privacy_and_electronic_communications/the_guide/cookies)\
    \ has been put in place with the aim of making their use more transparent.\n\n\
    This legislation doesn't mean developers shouldn't use cookies, but it does mean\
    \ we're having to use them more efficiently, and only use them when their application\
    \ has a real need.\n\nThe truth is, most cookies used by websites are harmless—with\
    \ many used simply to enhance content for users based on personal information\
    \ they've readily given to the site.\n\n## Sessions: Overview\n\nUseful as they\
    \ are, cookies do have a vulnerability—because they're stored on a user's computer,\
    \ they can, in theory, be tampered with by the user or, even worse, by a virus\
    \ on the user's computer. Sessions offer an alternative to cookies and come without\
    \ the client-side security risk.\n\n`sessions` are a special form of continuity\
    \ used to store data across page requests as a user navigates during their visit\
    \ to your website. When you log into a web application, edit some content, and\
    \ log out, more often than not, a session will have been working away behind the\
    \ scenes.\n\nIt's worth noting that sessions still rely on cookies to successfully\
    \ attribute data stored in a session on the website's server to the client. To\
    \ put it another way, a cookie on the client's computer is required to identify\
    \ them each time they visit the website.\n\n## Session Vs Cookies\n\nAs you're\
    \ developing in PHP you can use both cookies and sessions without much difficulty.\
    \ Both can be accessed using very simple methods in any script. Before we dive\
    \ into any code, though, it's important to explore cookies' and sessions' unique\
    \ features to better understand when you might favor one over the other.\n\n###\
    \ Cookies\n\nThe first unique feature of cookies—as opposed to sessions—is that\
    \ we give them an expiry date. When clients leave our website or web application\
    \ and wander off to other parts of the Internet, there's a good chance that they\
    \ may return at some point. With cookies we can set an expiry date so that, when\
    \ the user does visit again, as long as the expiry date hasn't passed, information\
    \ they submitted or entered before can be displayed as if they've never away.\n\
    \nA good example of the use of expiry dates is when you log into a social media\
    \ application, like Facebook. After logging in, you might navigate to another\
    \ site. But return to Facebook within a certain time period and you may discover\
    \ that you're still logged in. The cookie provides Facebook with a piece of data\
    \ that helps it to load our profile, which improves the user experience hugely.\
    \ Giving cookies an expiry date makes this convenience to the user possible while\
    \ adding a layer of security. By obliging users to re-authenticate after a certain\
    \ period of inactivity has passed, other users are prevented from accessing the\
    \ data stored in the cookie through means of hardware hijacking.\n\nAnother feature\
    \ unique to cookies is that, each time someone visits a website that has created\
    \ a cookie on their machine, the cookie is automatically included in subsequent\
    \ HTTP requests sent by the client. With this in mind, it's important not to have\
    \ your cookies store too much data as they'll be using the web server's bandwidth.\n\
    \nCookies make data management simpler as using them doesn't require any form\
    \ of database for storing the data or the cookie. This, in turn, means you don't\
    \ need any skill or knowledge in database management to use cookies. Furthermore,\
    \ in many web programming languages, such as PHP, functionality for creating,\
    \ assigning data, and accessing cookies is already built in, so you don't have\
    \ to worry about building your own library to access them.\n"
