  trans: "\n\n关于 `while`、`for` 和 `foreach` 循环的更多信息，请参阅 [PHP 官方文档](http://www.php.net/manual/en/language.control-structures.php)\
    \ 以及以下资源：\n\n* [`www.sitepoint.com/loops/`](http://www.sitepoint.com/loops/)\n\
    * [`webcheatsheet.com/PHP/loops.php`](http://webcheatsheet.com/PHP/loops.php)\n\
    \n## 数据库、MySQL 与 PHP\n\n当我们创建一个 PHP Web 应用程序时，通常需要将脚本中创建的一些数据保存到某处，以便日后访问。数据库允许我们存储大量不同类型的数据，从大型的字母数字字符串到序列化数组。MySQL\
    \ 是目前最流行的开源数据库，它与 PHP 配合得非常好，可以用来存储我们的应用程序数据。它非常易于启动，只需要几个函数即可存储和检索数据。\n\n像 MySQL\
    \ 等传统数据库使用表、行和列来组织数据。每个表包含一组记录（用户信息、订单摘要等），表中的每行存储一条特定的记录，而每列则标识构成记录的不同数据。数据库表可以想象成图\
    \ 2.3。\n\n![数据库表](img/dbtable.png)\n\n图 2.3. 数据库表\n\n### 注意：考虑数据类型\n\n由于表中的每列只允许存储一种类型的数据，且这通常是列定义的一部分，因此提前考虑你将存储的数据的不同属性是非常重要的。\n\
    \n在继续之前，确保你已经熟悉数据库的作用和 MySQL 的基础知识。如果你对其中任何内容不确定，请阅读 [tizag.com 上的 MySQL 文章](http://www.tizag.com/mysqlTutorial)。[`www.tizag.com/mysqlTutorial`](http://www.tizag.com/mysqlTutorial)\n\
    \nPHP 中处理 MySQL 有两个扩展——`MySQLi` 和 `PDO`。我们将使用 `PDO` 扩展来连接并与 MySQL 数据库交互，因此请确保该扩展已安装并启用。打开我们在第\
    \ 1 章中编写的 `info.php` 文件，查找标题为 `PDO` 的部分，并确保 MySQL 列在启用列中。\n\n### 注意：安装 PDO 时遇到的问题\n\
    \n如果你在启用扩展时遇到问题，请查看 [PHP 手册中安装 PDO 的指南](http://php.net/manual/en/pdo.installation.php)。\n\
    \n广流行的 `phpMyAdmin` 是一个 PHP 应用程序，它让管理多个数据库变得简单。基于此，强烈建议你确保服务器上安装了 `phpMyAdmin`。我们将在本书中使用它来管理数据库。\n\
    \n要开始，我们需要使用 `phpMyAdmin` 创建一个新的空数据库。执行此操作，请在浏览器中打开安装的 `phpMyAdmin` 并登录。你会看到一个类似下面的屏幕：\n\
    \n![phpMyAdmin](img/phpmyadmin.png)\n\n图 2.4. phpMyAdmin\n\n接下来，点击顶部菜单中的 `Databases`（数据库）链接。在下一个屏幕，我们可以通过输入要使用的数据库名称来创建新数据库。对于我们的项目，让我们在文本字段中输入\
    \ \"kickstartapp\" 并点击创建按钮。\n\n![创建我们的数据库](img/createdb.png)\n\n图 2.5. 创建我们的数据库\n\
    \n### 注意：排序规则（Collation）？\n\n不要担心那个应该预选为“Collation”（排序规则）的下拉选项。这是一个更高级的功能，为了本书项目的目的，我们将坚持使用默认选项。如果你想阅读数据库排序规则类型，请参阅：\n\
    \n* [`dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html`](http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html)\n\
    * [`kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs`](https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs)\n\
    \n### 注意：命名数据库时要小心\n\n当我们创建数据库时，其名称不能包含斜杠、句号或其他文件名不允许允许的字符，并且不应包含空格。\n\n眼敏锐的人可能已经注意到，我们新创建的数据库已添加到可用数据库列表中。左侧菜单上的此列表是快捷链接的集合，我们可以用它来选择想要编辑或管理的数据库。在列表中找到新数据库\
    \ \"kickstartapp\" 并点击它。这将带我们进入一个新屏幕，它看起来非常空，且类似于图 2.6：\n\n![我们的新数据库](img/newdb.png)\n\
    \n图 2.6. 我们的新数据库\n\n这是 `phpMyAdmin` 的主区域，我们可以在这里为数据库创建表并编辑现有表。但在在此之前，我们需要创建一个用户账户，用于连接数据库并存储和提取我们的数据。\n\
    \n进入顶部菜单中的 `Privileges`（权限）选项并点击它，然后在新面板中选择 `Add User`（添加用户），如图 2.7 所示。\n\n![添加新用户](img/addnew.png)\n\
    \n图 2.7. 添加新用户\n\n现在我们只需要在 `User name`（用户名）字段中输入用户名（确保从下拉菜单中选择了使用文本字段），在 `Host`（主机）下拉菜单中选择\
    \ `local`，然后在 `password` 字段中输入密码（再次确保选择了使用文本字段）。接下来，向下滚动并确保在面板的下一个选项区域勾选了 `Grant\
    \ all privileges on database kickstartapp`。最后，在最后一个面板的 `Global privileges`（全局权限）下选择\
    \ `Check all`（全选），并点击底部的 `Add User`（添加用户）。\n\n![新用户字段](img/newuserfields.png)\n\
    \n图 2.8. 新用户字段\n\n这看起来可能有点复杂，但实际上我们所做的只是创建一个新用户并赋予该用户对 \"kickstartapp\" 执行任何操作的权限。这种设置对于用户来说是常见的，但不一定是最安全的。关于设置数据库用户的更多信息，请参阅：\n\
    \n* [`dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html`](http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html)\n\
    * [`kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs`](https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs)\n\
    \n现在我们已经设置好了用户账户，让我们在数据库中创建一个表。在我们的项目文件夹中创建一个名为 `setup.php` 的新 PHP 脚本。在该文件中以下代码，然后通过浏览器运行该文件。\n\
    \n### 注意：自定义你的代码\n\n将以下代码中的 `USERNAME` 和 `PASSWORD` 替换为你创建数据库用户时设置的用户名和密码。\n\n\
    ```php\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\",\n \"\
    USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
    try {\n    $queryStr = \"CREATE TABLE users (id INTEGER NOT NULL\nAUTO_INCREMENT\
    \ PRIMARY KEY, name VARCHAR(40), password\nVARCHAR(100), email VARCHAR(150))\"\
    ;\n    $db->query($queryStr);\n} catch (PDOException $e) {\n    echo $e->getMessage();\n\
    }\n```\n\n首先通过创建一个带有四个关键信息的 `PDO` 对象在 PHP 中连接 MySQL。第一个参数告诉 PHP 我们 MySQL 数据库的位置。在我们的情况下，这是\
    \ \"localhost\"，因为 MySQL 服务器与 PHP 运行在同一系统上。第二个参数识别我们要连接的数据库。这两个信息片段与 `mysql:`\
    \ 结合，创建一个被称为 DSN（数据源名称）的内容。第三和第四个参数简单就是数据库用户的用户名和密码。\n\n"
- fmt: "\nNext we set a feedback option for `PDO` that causes any database errors\
    \ to be treated as exceptions by PHP. With this, if anything goes wrong when MySQL\
    \ tries to execute the SQL we provide, we'll be alerted immediately, and will\
    \ be able to see what happened so we can fix it.\n\nThen we define the SQL statement\
    \ that will create the table and assign the string to the variable `$queryStr`.\
    \ Looking at the SQL, we're telling MySQL to create a new table named `users`\
    \ which we'll use to store all of the data related to both admin users and public\
    \ users for our blogging application. This is done with the `CREATE TABLE` command\
    \ followed by the definitions for the different columns we want in our table:\
    \ `id`, `name`, `password`, and `email`. Each column definition tells MySQL what\
    \ type of data the column will hold as well as any other options for that cell.\
    \ For example, the first column (`id`) will hold only integer numbers and a record\
    \ will never be allowed to have an empty value for it (`NOT NULL`).\n\nNext we\
    \ have a type of conditional statement that we haven't discussed yet: a `try`...`catch`\
    \ block. In the `try` block, we pass the `$queryStr` variable to the `query()`\
    \ method of the `PDO` object. The method takes our SQL string and sends it to\
    \ the MySQL server to be executed.\n\nPHP executes code in a `catch` block only\
    \ if there was a problem in the `try` block. That is, PHP will \"throw\" an exception\
    \ if MySQL fails to run our query (we asked for this behavior by setting `PDO::ATTR_ERRMODE`\
    \ earlier). Our `catch` block will \"catch\" the exception object which has information\
    \ we can use to troubleshoot the problem.\n\nGo ahead and access `setup.php` file\
    \ through your browser. If the screen remains blank, the query executed successfully\
    \ (we only asked PHP to output anything if there was a problem). Then head back\
    \ to phpMyAdmin and click on the database to verify that the newly created table\
    \ exists.\n\nNow let's add some data to our table! Create a new file in the project\
    \ directory named `insert.php` and add the following code to it:\n\n```php\n<?php\n\
    $db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\",\n \"USERNAME\", \"\
    PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION); \n\
    try {\n    $queryStr = \"INSERT INTO users (name, password, email) \nVALUES ('admin',\
    \ MD5('admin'), 'youremail@domain.com')\";\n    $db->query($queryStr);\n} catch\
    \ (PDOException $e) {\n    echo $e->getMessage();\n}\n```\n\nMuch of the code\
    \ is the same as before, except the SQL we're sending to MySQL is now an `INSERT\
    \ INTO` command. We're asking MySQL to create a new record in the `users` table\
    \ with the username \"admin\", a password hash, and an email address.\n\n### Note:\
    \ Using MD5\n\nNotice that for the `password` column we used the `MD5()` function\
    \ to hash the data. This is done for security reasons so that anyone who gains\
    \ unauthorized access to our database cannot easily view our users' passwords.\
    \ Never store passwords in plain text!\n\nNavigate to the `insert.php` file and\
    \ you should again hopefully see a blank page meaning the query has executed successfully,\
    \ otherwise you will see a error message giving insight into what went wrong.\
    \ Finally, let's retrieve data from the table. Create the file `getdata.php` and\
    \ add the following code:\n\n```php\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\"\
    ,\n \"USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
    \ \ntry {\n    $queryStr = \"SELECT * FROM users\";\n    $query = $db->prepare($queryStr);\n\
    \    $query->execute();\n    while ($row = $query->fetch()) {\n        echo $row['id']\
    \ . ' - ' . $row['name'] . ' - ' . $row['password'] . ' - ' . $row['email'] .\
    \ '<br>';\n    }\n    $query->close();\n} catch (PDOException $e) {\n    echo\
    \ $e->getMessage();\n}\n```\n\n### Summary\n\nIn this chapter we've covered the\
    \ basics of creating a database using phpMyAdmin, creating a table in PHP, inserting\
    \ a record, and retrieving rows of data from a table. However, this is only the\
    \ tip of the iceberg. Both MySQL and PHP go so much deeper than we've seen. For\
    \ more information on MySQL and using PHP, please see the following resources:\n\
    \n*   `http://dev.mysql.com/doc/`\n*   `http://www.sitepoint.com/migrate-from-the-mysql-extension-to-php`\n\
    *   `http://www.php.net/manual/en/book.php`\n*   `http://www.sitepoint.com/avoid-the-original-mysql-extension-1/`\n"
