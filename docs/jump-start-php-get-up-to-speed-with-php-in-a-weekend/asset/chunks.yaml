  trans: "\nOOP 看起来可能很复杂，但它实际上是一种非常直接的编程方法。要了解更多关于 OOP 底层理论的信息，请参阅 [Lorna Mitchell\
    \ 在 sitepoint.com 上关于 PHP OOP 的视频介绍](http://www.sitepoint.com/object-oriented-php-lesson-1/)。\n\
    \n# OOP 入门\n\n让我们一起写一个 OOP 示例。假设我们想在 PHP 代码中将狗表示为一个对象。我们需要编写该对象（类）的定义，用来描述狗可以做什么。\n\
    \n在你的实验文件夹中创建一个名为 `Dog.php` 的文件，并包含以下内容：\n\n```php\n<?php\nclass Dog\n{\n    public\
    \ $name;\n\n    public function __construct($name) {\n        $this->name = $name;\n\
    \    }\n\n    public function speak() {\n        return 'Woof! Woof!';\n    }\n\
    }\n```\n\n在实验文件夹中创建另一个文件 `DogTest.php`。\n\n```php\n<?php\nrequire 'Dog.php';\n\
    \n$dog = new Dog('Fido');\necho 'The dog\\'s name is: ' . $dog->name . '<br>';\n\
    echo 'The dog says: ' . $dog->speak() . '<br>';\n```\n\n在浏览器中访问 `DogTest.php`\
    \ 文件，你应该会在屏幕上看到狗的名字和汪叫声。非常棒。\n\n### 注意：从其他文件中包含代码\n\n在示例中看到的 `require` 结构——简单来说——是将外部\
    \ PHP 文件的内容导入到我们的 `DogTest.php` 文件中。它是用于从其他文件包含代码的四个结构之一，每种结构的行为略有不同：\n\n*   `include`\
    \ ― 包含文件内容。如果找不到文件或无法访问，PHP 将发出警告但会继续执行。\n*   `include_once` ― 与 `include` 相同，但\
    \ PHP 会执行额外的检查以确保文件没有被导入过。如果已经导入，则 PHP 将不会再次包含内容。\n*   `require` ― 与 `include`\
    \ 类似，但如果找不到文件，PHP 将抛出致命错误并停止执行。\n*   `require_once` ― 与 `require` 相同，但有一个额外的检查以确保内容不会被导入多次。\n\
    \n通过查看我们的 `Dog.php` 文件，我们首先注意到的是 `class` 关键字。这个关键字基本上表示接后的代码定义了一个类，该类将以随后的名称命名（在我们的案例中为\
    \ `Dog`）。一旦定义了类，我们就可以使用 `new Dog` 从它创建一个对象。\n\n方法 `__construct()` 和 `speak()`\
    \ 是类定义的一部分。`__construct` 是一个对 PHP 具有特殊含义的名字；当我们从类中创建一个新对象时，PHP 会检查是否定义了 `__construct()`\
    \ 方法。如果是，它将在创建对象实例后自动执行该方法。这使得它成为放置初始化新对象的代码的绝佳位置。\n\n### 注意：函数和方法\n\n属于类的函数被称为方法（methods）。函数和方法之间的区别不大，所以如果对你的理解有帮助，在每次看到“方法（method）”时将其想象成“函数（function）”是安全的。\n\
    \n类可以有自己的变量，这些变量帮助对象实例维护其状态，并且可以被方法访问。在上面的 `Dog.php` 示例中，行 `public $name;` 将 `$name`\
    \ 定义为类变量，或属性（property）。\n\n### 注意：变量和属性\n\n属于类的变量被称为属性（properties）。就像函数/方法一样，在你习惯\
    \ OOP 术语之前，在每次看到“属性（property）”时将其想象成“变量（variable）”是安全的。\n\n当我们在类内部编写代码时，特殊变量 `$this`\
    \ 代表对象的实例，并帮助我们解析方法。为了更好地理解这种工作，让我们更新 `DogTest.php` 文件，如下：\n\n```php\n<?php\n\
    \  require 'Dog.php';\n\n  $dog = new Dog('Fido');\n  echo 'The dog\\'s name is:\
    \ ' . $dog->name . '<br>';\n  echo 'The dog says: ' . $dog->speak() . '<br>';\n\
    \n  $fido = new Dog('Fido');\n  echo 'The dog\\'s name is: ' . $fido->name . '<br>';\n\
    \  echo 'The dog says: ' . $fido->speak() . '<br>';\n\n  $bubbles = new Dog('Bubbles');\n\
    \  echo 'The dog\\'s name is: ' . $bubbles->name . '<br>';\n  echo 'The dog says:\
    \ ' . $bubbles->speak() . '<br>';\n```\n\n（注：此处根据原文逻辑可能存在重复或断句，翻译已按原文保留）\n\n###\
    \ 提示：箭头\n\n在调用方法或属性时，你需要记住使用 `->` 运算符。\n\n## 扩展类\n\n现在你对 OOP 有了基础了解，让我们创建 `Pet`\
    \ 类。这个定义将变量和函数分组到一个逻辑单元。\n\n```php\n<?php\nclass Pet\n{\n    public $name;\n\n\
    \    public function __construct($name) {\n        $this->name = $name;\n    }\n\
    \n    public function speak() {\n        return 'nothing';\n    }\n}\n```\n\n\
    这个类与 `Dog` 类相似，所以不会太意外。让我们重写 `Dog` 类使其扩展 `Pet`。\n\n```php\n<?php\nrequire_once\
    \ 'Pet.php';\n\nclass Dog extends Pet\n{\n    public function speak() {\n    \
    \    return 'Woof! Woof!';\n    }\n\n    public function plays() {\n        return\
    \ 'fetch';\n    }\n}\n```\n\n为了好玩，让我们创建更多的动物类。创建 `Cat.php` 文件：\n\n```php\n<?php\n\
    require_once 'Pet.php';\n\nclass Cat extends Pet\n{\n    public function speak()\
    \ {\n        return 'Meow!';\n    }\n\n    public function plays() {\n       \
    \ return 'chase mice';\n    }\n}\n```\n\n...以及 `Fish.php`：\n\n```php\n<?php\n\
    require_once 'Pet.php';\n\nclass Fish extends Pet\n{\n}\n```\n\n现在让我们测试它们。创建 `PetTest.php`\
    \ 文件并包含以下代码：\n\n```php\n<?php\nrequire 'Dog.php';\nrequire 'Cat.php';\nrequire\
    \ 'Fish.php';\n\n$fido = new Dog('Fido');\necho 'The dog\\'s name is: ' . $fido->name\
    \ . '<br>';\necho 'The dog says: ' . $fido->speak() . '<br>';\necho 'The dog plays:\
    \ ' . $fido->plays() . '<br>';\n\n$mittens = new Cat('Mittens');\necho 'The cat\\\
    's name is: ' . $mittens->name . '<br>';\necho 'The cat says: ' . $mittens->speak()\
    \ . '<br>';\necho 'The cat plays: ' . $mittens->plays() . '<br>';\n\n$bubbles\
    \ = new Fish('Bubbles');\necho 'The fish\\'s name is: ' . $bubbles->name . '<br>';\n\
    echo 'The fish says: ' . $bubbles->speak() . '<br>';\n```\n\n现在事情开始变得有趣了！请继续创建定义\
    \ `Parrot` 类和 `Lizard` 类，并更新 `PetTest.php` 以创建它们的实例，显示它们的名字以及它们可能说的。\n"
- fmt: '

    When we extend a class, we are basically building one class from another. This
    creates a parent/child relationship. For example, we can say the `Dog` class is
    a child of `Pet`, and `Pet` is a parent of `Dog`. By building on previously written
    code, we don''t have to repeat ourselves by writing the same code elsewhere and,
    as a result, we''ll have better organized, more efficient code.


    Each class that represent a specific type of pets inherit the methods and properties
    from the parent `Pet` class. Consider the `Fish` class... it has no code of its
    own and inherits all of its behavior from `Pet`.


    The `Dog` and `Cat` classes, on the other hand, extend the `Pet` class but also
    override the `speak()` methods with their own version and add new functionality
    with `plays()` methods.


    ### Note: What''s With Public?


    In classes, we attach what is called a `visibility` to our objects and our methods.
    We always have three choices when assigning: `public`, `protected` or `private`.
    `public` means the class''s objects and methods can be accessed by calls from
    anywhere. `protected` means the objects and methods can only be accessed by methods
    and calls which are in the same class tree as the method or object being called.
    `private` means the methods and objects can only be accessed by the class that
    the method or object belongs to.


    For more information on visibility in classes, please check out the following
    resources:


    * [php.net/manual/en/language.oop5.visibility.php](http://php.net/manual/en/language.oop5.visibility.php)

    * [aperiplus.sourceforge.net/visibility.php](http://aperiplus.sourceforge.net/visibility.php)

    * [www.sitepoint.com/learn-object-oriented-php/](http://www.sitepoint.com/learn-object-oriented-php/)‎


    We''ve covered the very basics of using OOP in PHP above. While it can seem like
    a very complex and sophisticated coding strategy at first, it''s actually more
    like riding a bike; once you learn it, you''ll never forget it.


    OOP not only helps makes developing large and complex applications easier, but
    it''s also an approach that appears in almost every other professional programming
    language. Learning and mastering it in PHP can help you understand other programming
    languages in the future, so it''s an incredibly useful skill to have.


    From here on in, we''ll assume that you''re comfortable with OOP and the use of
    classes and objects in PHP. To aid your understanding of the topics we discussed,
    it''s recommended that you check out these links:


    * [http://codular.com/introducing-php-classes](http://codular.com/introducing-php-classes)

