- fmt: "\nAlso, it's best practice to assume that, even if they have interacted with\
    \ specifically restrictive input fields in your HTML form, users may still submit\
    \ data that's formatted incorrectly. When the data is sent to your `PHP` script\
    \ to be processed, it's important to implement some type of validating script.\n\
    \nThere are several `PHP` functions we can use for validation. The following code\
    \ example has been designed to check data that has been submitted by the user\
    \ to see if the correct data has been provided, helping to ensure that it's in\
    \ a format that can be used readily by the application:\n\n```php\n<?php\n$input\
    \ = array(); \n// this is where all of the filtered data will be stored\n\n//\
    \ an input field with the name 'number'\n// that accepts only numeric input\n\
    if (isset($_POST['number']) && is_numeric($_POST['input'])) {\n    $input['number']\
    \ = $_POST['number'];\n}\n// an input field with the name 'date' that accepts\n\
    // a dd/mm/yyyy date\nif (isset($_POST['date'])) {\n    list ($dd, $mm, $yyyy)\
    \ = explode('/', $input);\n    if (checkdate ($mm,$dd,$yyyy)) {\n        $input['date']\
    \ = $_POST['date'];\n    }\n}\n// an input field with the name 'content' that\
    \ accepts\n// arbitrary text\nif (isset($_POST['content'])) {\n    // filter out\
    \ any harmful HTML that may be in the string\n    $input['content'] = strip_tags($_POST['content']);\n\
    }\n\n// values in $input are safe to use in the application\n```\n\nIn the example\
    \ above, we inspect each of the incoming form values and place them into a new\
    \ array if they pass some basic validation checks. Those that fail are not added\
    \ to the `$input` array.\n\nThe `is_numeric()` function checks the contents of\
    \ a string and will return true only if it contains characters that make up a\
    \ number. Numeric strings consist of an optional leading sign (`+` or `-`), any\
    \ number of digits, and optionally a decimal part or exponential part.\n\nThe\
    \ `checkdate()` function checks the validity of the a given date and will return\
    \ true only if the arguments make up a valid date.\n\nFinally, `strip_tags()`\
    \ returns a string with HTML and `PHP` tags removed, leaving only basic formatting\
    \ HTML tags (such as line break `<br>` tags) and plain text.\n\nAt the end of\
    \ our validation checks, the values in `$input` can be used safely throughout\
    \ the rest of our application knowing that they're in the correct format.\n\n\
    However, forms are not the only type of data for which we need to consider implementing\
    \ validation. In the blog application we've built in this book, we've used URL\
    \ variables to load new sections of the application and execute specific scripts.\
    \ URL variables are often targeted by attackers because they're easy to manipulate\
    \ and can cause some very serious damage to apps that haven't implemented appropriate\
    \ security measures.\n\nWe've already implemented a few security validation techniques\
    \ in our application, especially where we used URL variables to dictate which\
    \ method or functionality should be executed:\n\n```\n...\nif (!empty($_GET['id'])\
    \ && is_numeric($_GET['id'])) {\n\n...\n```\n\nThis example, taken from `admin/posts.php`,\
    \ shows that we have the `is_numeric()` function in place to ensure that the application\
    \ continues to process the method inside the `if` statement only if the required\
    \ data from the URL is a number. It will ignore any other values someone may try\
    \ to pass through the URL.\n\n## Summary\n\nIn this chapter we've seen a brief\
    \ overview of `PHP` security and looked at some basic ways to avoid some of the\
    \ most common vulnerabilities.\n\n`PHP` security is a huge topic and we've only\
    \ really scratched the surface here. It's recommended that, every time you write\
    \ a new function, imagine how someone would be able to:\n\n*   gain illicit access\
    \ to any protected areas\n*   disrupt, distort, or change data that the application\
    \ is processing\n*   break, alter, or effect in any negative way the process and/or\
    \ functionality of the application\n\nIt's also always worth thinking, during\
    \ development, that a user may submit incorrect or incorrectly-formatted data\
    \ whenever user input is required. If you keep these things in mind when you develop,\
    \ you'll be able protect yourself from many of the initial security problems your\
    \ application may encounter.\n\nFor more information on implementing security\
    \ methods, functionality, and scripts into your PHP applications, please see:\n\
    \n*   `[http://www.sitepoint.com/top-10-php-security-vulnerabilities/](http://www.sitepoint.com/top-10-php-security-vulnerabilities/)`\n\
    *   `[http://www.sitepoint.com/php-security-blunders/](http://www.sitepoint.com/php-security-blunders/)`\n\
    *   `[http://www.php-security.net/](http://www.php-security.net/)`\n\n## Conclusion\n\
    \nIn this short book we've had a brief taste of `PHP` development and created\
    \ a simple blogging platform. Everything we've discussed has been carefully chosen\
    \ to help inspire you to hone your `PHP` development skills.\n\nThis book should\
    \ only be considered to be a starting point on your journey as a `PHP` developer.\
    \ A great resource for furthering your `PHP` skills is SitePoint's `PHP` channel,\
    \ `[http://www.sitepoint.com/php/](http://www.sitepoint.com/php/)`, which offers\
    \ a wide range of articles for the `PHP` developer.\n\n> The function of good\
    \ software is to make the complex appear to be simple. ― Grady Booch\n"
