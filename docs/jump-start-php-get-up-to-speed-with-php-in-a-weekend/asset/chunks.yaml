  trans: "\n接下来，我们为 `PDO` 设置一个反馈选项，使 PHP 将任何数据库错误都视为异常。这样，当 MySQL 尝试执行我们提供的 SQL 语句发生任何问题时，我们将立即收到通知，并能够看到发生了什么以便进行修复。\n\
    \n然后，我们定义了用于创建表的 SQL 语句，并将字符串赋值给变量 `$queryStr`。查看该 SQL 语句，我们正在告诉 MySQL 创建名为 `users`\
    \ 的新表，我们将其用于存储与我们博客应用程序中管理员和公共用户相关的所有数据。这是通过 `CREATE TABLE` 命令实现的，随后跟的是我们在表中所需要的不同列的定义：`id`、`name`、`password`\
    \ 和 `email`。每个列定义都告诉 MySQL 该列将存储什么类型的数据，以及该单元格的其他任何选项。例如，第一列（`id`）将只存储整数，且不允许记录该列有空值（`NOT\
    \ NULL`）。\n\n接下来，我们遇到了一种尚未讨论过的条件语句类型：`try`...`catch` 块。在 `try` 块中，我们将变量 `$queryStr`\
    \ 传递给 `PDO` 对象的 `query()` 方法。该方法接收我们的 SQL 字符串并将其发送到 MySQL 服务器执行。\n\n只有当 `try`\
    \ 块出现问题时，PHP 才会执行 `catch` 块中的代码。也就是说，如果 MySQL 运行我们的查询失败，PHP 将“抛出”异常（我们之前通过设置 `PDO::ATTR_ERRMODE`\
    \ 请求了这种行为）。我们的 `catch` 块将“捕获”异常对象，其中包含了我们可以用于排排除问题的信息。\n\n通过浏览器访问 `setup.php`\
    \ 文件。如果屏幕保持空白，说明查询执行成功（我们只要求 PHP 在出现问题时输出任何内容）。然后返回 phpMyAdmin 并点击数据库以验证新创建的表是否存在。\n\
    \n现在，让我们向表中添加一些数据吧！在项目目录下创建一个名为 `insert.php` 的新文件，并向添加以下代码：\n\n```php\n<?php\n\
    $db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\",\n \"USERNAME\", \"\
    PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION); \n\
    try {\n    $queryStr = \"INSERT INTO users (name, password, email) \nVALUES ('admin',\
    \ MD5('admin'), 'youremail@domain.com')\";\n    $db->query($queryStr);\n} catch\
    \ (PDOException $e) {\n    echo $e->getMessage();\n}\n```\n\n大部分代码与之前相同，但我们发送给\
    \ MySQL 的 SQL 现在是一个 `INSERT INTO` 命令。我们正在要求 MySQL 在 `users` 表中创建一个具有用户名 \"admin\"\
    、密码哈希和电子邮箱地址的新记录。\n\n### 注意：使用 MD5\n\n注意，对于 `password` 列，我们使用了 `MD5()` 函数对数据进行了哈希处理。这样做是为了安全考虑，以便任何未经授权访问我们数据库的人无法轻易查看我们用户的密码。永远不要以明文存储密码！\n\
    \n导航到 `insert.php` 文件，你应该再次看到一个空白页面，这意味着查询执行成功，否则你将看到一条错误消息，让你了解明哪里出了问题。最后，让我们从表中检索数据。创建文件\
    \ `getdata.php` 并添加以下代码：\n\n```php\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\"\
    ,\n \"USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
    \ \ntry {\n    $queryStr = \"SELECT * FROM users\";\n    $query = $db->prepare($queryStr);\n\
    \    $query->execute();\n    while ($row = $query->fetch()) {\n        echo $row['id']\
    \ . ' - ' . $row['name'] . ' - ' . $row['password'] . ' - ' . $row['email'] .\
    \ '<br>';\n    }\n    $query->close();\n} catch (PDOException $e) {\n    echo\
    \ $e->getMessage();\n}\n```\n\n### 总结\n\n在本章中，我们介绍了使用 phpMyAdmin 创建数据库、在 PHP 中创建表、插入记录以及从表中检索数据的基础。然而，这只是冰山一角。MySQL\
    \ 和 PHP 的深度远比我们所看到的深得多。关于 MySQL 和使用 PHP 的更多信息，请参考以下资源：\n\n*   `http://dev.mysql.com/doc/`\n\
    *   `http://www.sitepoint.com/migrate-from-the-mysql-extension-to-php`\n*   `http://www.php.net/manual/en/book.php`\n\
    *   `http://www.sitepoint.com/avoid-the-original-mysql-extension-1/`\n\n"
- fmt: "\nOOP may seem complex at first glance, but it's actually a very straightforward\
    \ approach to programming. For more information about the theory behind OOP, please\
    \ see [Lorna Mitchell's video introduction to OOP in PHP on sitepoint.com.](http://www.sitepoint.com/object-oriented-php-lesson-1/)\n\
    \n# First Steps in OOP\n\nLet's write a small OOP example together. Suppose we\
    \ want to represent a dog as an object in our PHP code. We'll need to write the\
    \ definition for the object (class) that describes what the dog can do.\n\nCreate\
    \ a new file named `Dog.php` in your experiments folder with the following content:\n\
    \n```php\n<?php\nclass Dog\n{\n    public $name;\n\n    public function __construct($name)\
    \ {\n        $this->name = $name;\n    }\n\n    public function speak() {\n  \
    \      return 'Woof! Woof!';\n    }\n}\n```\n\nLet's create another file in the\
    \ experiments folder, `DogTest.php`.\n\n```php\n<?php\nrequire 'Dog.php';\n\n\
    $dog = new Dog('Fido');\necho 'The dog\\'s name is: ' . $dog->name . '<br>';\n\
    echo 'The dog says: ' . $dog->speak() . '<br>';\n```\n\nNavigate to the `DogTest.php`\
    \ file in your browser and you should see the dog's name and barking on your screen.\
    \ Great stuff.\n\n### Note: Including Code From Other Files\n\nThe `require` construct\
    \ seen in the example above—in a nutshell—imports the contents of an external\
    \ PHP file into our `DogTest.php` file. It's one of four such constructs used\
    \ to include code from other files, each with slightly different behavior:\n\n\
    * `include` ― includes the contents of the file. If the file isn't found or is\
    \ inaccessible, PHP will issue a warning but will continue executing.\n* `include_once`\
    \ ― the same as `include`, but PHP performs an extra check to make sure the file\
    \ hasn't been imported already. If it has, then PHP will not re-include the contents.\n\
    * `require` ― similar to `include` but PHP will stop execution with a fatal error\
    \ if the file isn't found.\n* `require_once` ― the same as `require` but with\
    \ an extra check to ensure the content isn't imported more than once.\n\nTaking\
    \ a look at our `Dog.php` file, the first thing we notice is the `class` keyword.\
    \ This keyword basically states that the following code defines a class that will\
    \ be known by the name that follows it (in our case, `Dog`). Once the class is\
    \ defined, we can create an object from it using `new Dog`.\n\nThe methods `__construct()`\
    \ and `speak()` are part of the class definition. `__construct` is a name that\
    \ has special meaning to PHP; when we create a new object from the class, PHP\
    \ looks to see if a `__construct()` method is defined. If so, it will automatically\
    \ execute this method after it creates an instance of the object. This makes it\
    \ a great place to put any code that is responsible for initializing a new object.\n\
    \n### Note: Functions and Methods\n\nFunctions that belong to a class are called\
    \ methods. There's little difference between a function and a method, so it's\
    \ safe to imagine the word \"function\" every time you see \"method\" if it helps\
    \ your understanding.\n\nA class can have its own set of variables that help the\
    \ object instance maintain its state, and which are accessible to its methods.\
    \ The line `public $name;` in our `Dog.php` example above defines `$name` as a\
    \ class variable, or property.\n\n### Note: Variables and Properties\n\nVariables\
    \ that belong to a class are called properties. Like functions/methods, it's safe\
    \ to imagine the word \"variable\" every time you see \"property\" until you become\
    \ comfortable with OOP terminology.\n\nWhen we're writing code inside a class,\
    \ the special variable `$this` represents the instance of the object, and helps\
    \ us to resolve a method or property correctly. To better understand how this\
    \ works, let's update the `DogTest.php` file so it looks like this:\n\n```php\n\
    <?php\n  require 'Dog.php';\n\n  $fido = new Dog('Fido');\n  echo 'The dog\\'s\
    \ name is: ' . $fido->name . '<br>';\n  echo 'The dog says: ' . $fido->speak()\
    \ . '<br>';\n\n  $fifi = new Dog('Fifi');\n  echo 'The dog\\'s name is: ' . $fifi->name\
    \ . '<br>';\n  echo 'The dog says: ' . $fifi->speak() . '<br>';\n```\n\nWe've\
    \ changed the variable `$dog` to be named `$fido` instead, and created another\
    \ instance of a `Dog` object with the name \"Fifi\". When you run the code, you\
    \ should see both Fido and Fifi barking on your screen. But let's think about\
    \ what's happening behind the scenes here to make this work.\n\nEach object is\
    \ of the same class (`Dog`), but each is its own distinct instance with its own\
    \ data—for example, each has its own `$name` property. When the `$fido` instance\
    \ is created, the name \"Fido\" is assigned to it's `$name` variable, whereas\
    \ the name \"Fifi\" is assigned as the name of the `$fifi` instance.\n\n### Tip:\
    \ Watch the Arrows\n\nWhen calling a method or property, you need to remember\
    \ to use the `->` operator. This lets PHP know you're referencing something that\
    \ specifically belongs to the class instead of a regular variable or function\
    \ in the execution scope of the script. Keep this in mind when calling methods\
    \ or variables because calling the wrong one can\n\n## Extending Classes\n\nNow\
    \ you have a basic understanding of OOP, so let's create the `Pet` class. A definition\
    \ that groups variables and functions into a logical unit.\n\n```php\n<?php\n\
    class Pet\n{\n    public $name;\n\n    public function __construct($name) {\n\
    \        $this->name = $name;\n    }\n\n    public function speak() {\n      \
    \  return 'nothing';\n    }\n}\n```\n\nThis class is intentionally similar to\
    \ the `Dog` class, so there shouldn't be anything too surprising. Now let's re-write\
    \ the `Dog` class so it extends `Pet`.\n\n```php\n<?php\nrequire_once 'Pet.php';\n\
    \nclass Dog extends Pet\n{\n    public function speak() {\n        return 'Woof!\
    \ Woof!';\n    }\n\n    public function plays() {\n        return 'fetch';\n \
    \   }\n}\n```\n\nAnd just for fun, let's create a few more animal classes. Create\
    \ the file `Cat.php`:\n\n```php\n<?php\nrequire_once 'Pet.php';\n\nclass Cat extends\
    \ Pet\n{\n    public function speak() {\n        return 'Meow!';\n    }\n\n  \
    \  public function plays() {\n        return 'chase mice';\n    }\n}\n```\n\n\
    ... and the file `Fish.php`:\n\n```php\n<?php\nrequire_once 'Pet.php';\n\nclass\
    \ Fish extends Pet\n{\n}\n```\n\nNow let's test them out. Create the file `PetTest.php`\
    \ with the following code:\n\n```php\n<?php\nrequire 'Dog.php';\nrequire 'Cat.php';\n\
    require 'Fish.php';\n\n$fido = new Dog('Fido');\necho 'The dog\\'s name is: '\
    \ . $fido->name . '<br>';\necho 'The dog says: ' . $fido->speak() . '<br>';\n\
    echo 'The dog plays: ' . $fido->plays() . '<br>';\n\n$mittens = new Cat('Mittens');\n\
    echo 'The cat\\'s name is: ' . $mittens->name . '<br>';\necho 'The cat says: '\
    \ . $mittens->speak() . '<br>';\necho 'The cat plays: ' . $mittens->plays() .\
    \ '<br>';\n\n$bubbles = new Fish('Bubbles');\necho 'The fish\\'s name is: ' .\
    \ $bubbles->name . '<br>';\necho 'The fish says: ' . $bubbles->speak() . '<br>';\n\
    ```\n\nNow things are starting to get interesting! Go ahead and create classes\
    \ that define a `Parrot` class and a `Lizard` class, and update PetTest.php to\
    \ create an instance of each, display their names, and what they might say.\n"
