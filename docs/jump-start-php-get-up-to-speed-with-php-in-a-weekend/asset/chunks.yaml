  trans: "\n\n*   `enctype` – 此属性指定了表单数据在提交时的编码方式。然而，该属性仅在 `method` 属性被设置为 `POST`\
    \ 时生效。`enctype` 有三个可能的值：`application/x-222-form-urlencoded`、`multipart/form-data`\
    \ 和 `text/plain`。第一个选项会对表单提交的所有内容进行编码，因此所有空格都会编码为 `+`，所有其他特殊字符都将转换为 ASCII 十进制值。第二种选项不对任何表单数据进行编码。如果你的表单包含任何类型的文件上传控件或处理，这一点是关重要的。最后一种选项会将提交数据中的空格转换为\
    \ `+`，但不会编码任何特殊字符。在编写表单时应当评估这些选项，因为它们将对数据到达 `action` 属性 URL 时的状态起重要作用。\n\n有两个属性可以设置在任何表单元素上，在用\
    \ PHP 脚本处理数据时也非常重要：\n\n*   `name` – `name` 属性值是一个标识符，用于在数据发送到目标 URL 时收集数据。例如，如果我们有一个元素\
    \ `<input type=\"text\" name=\"data\" />`，用户为此输入的值将可以在服务器上的数组中可用，并可以使用数组键 `'data'`\
    \ 进行引用。\n\n*   `value` – `value` 属性用于设置表单中每个元素的信息或数据。你可以使用此属性为元素设置默认值。\n\n这里是一个使用了上述某些属性的示例表单：\n\
    \n```\n<form method=\"post\">\n    <input name=\"myField\" value=\"Hello World\"\
    \ />\n    <button type=\"submit\">submit</button>\n</form>\n```\n\n到目前为止，我们只查看了在\
    \ PHP 中使用表单时涉及的重要部分。然而，你可能会发现自己使用了一些这里未列出的属性和标签。我们讨论的元素涵盖了基础知识，如果你想获取更多关于表单的信息，请随时查看这些外部引用：\n\
    \n*   [`reference.sitepoint.com/html/elements-form`](http://reference.sitepoint.com/html/elements-form)\n\
    *   [`www.tizag.com/htmlT/forms.php`](http://www.tizag.com/htmlT/forms.php)\n\
    *   [`www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm`](http://www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm)\n\
    \n## POST 和 GET\n\n每个表单的 `method` 属性允许两个选项：`POST` 和 `GET`。如我们所知，PHP 有一些特殊的预定义变量，例如\
    \ `$_SESSION` 变量。PHP 还有另外专门用于收集 HTML 表单发送数据的预定义变量：`$_POST` 和 `$_GET`，但这些变量也可以用于其他方式——我们稍后会介绍。\n\
    \n现在，让我们通过示例来说明 `POST` 和 `GET` 之间的区别。在我们的实验文件夹中创建新文件：`form.php` 和 `collect.php`。在我们的\
    \ `form.php` 文件中添加以下代码：\n\n```html\n<html\n<<body>\n    <form method=\"post\"\
    \ action=\"collect.php\">\n        <h1>Form #1</h1>\n        <input name=\"data\"\
    \ placeholder=\"enter a string\" \ntype=\"text\" />\n        <button type=\"submit\"\
    >submit</button>\n    </form>\n    <form method=\"get\" action=\"collect.php\"\
    >\n        <h1>Form #2</h1>\n        <input name=\"data\" placeholder=\"enter\
    \ a string\" \ntype=\"text\" />\n        <button type=\"submit\">submit</button>\n\
    \    </form>\n</body>\n</html>\n```\n\n完成了吗？很好。现在请在 `collect.php` 文件中添加以下代码：\n\
    \n```php\n<?php\nif (!empty($_POST['data'])) {\n    echo 'The following string\
    \ was sent from form #1: ' . \n$_POST['data'];\n} elseif (!empty($_GET['data']))\
    \ {\n    echo 'The following string was sent from form #2: ' . \n$_GET['data'];\n\
    }\n```\n\n接下来，在浏览器中打开 `form.php`，在表单 #1 的输入框中输入内容并点击提交。你应该能看到类似 图 4.2 的内容：\n\n\
    ![向我们的表单输入数据](img/form1.png)\n\n图 4.1. 向我们的表单输入数据\n\n![提交表单的结果](img/form1submit.png)\n\
    \n图 4.2. 提交表单的结果\n\n如果你填写了表单 #2（如图 4.3 所示）并点击提交，你应该看到类似 图 4.4 的内容：\n\n![向表单 #2\
    \ 输入数据](img/form2.png)\n\n![提交表单的结果](img/form2submit.png)\n\n`POST` 和 `GET` 之间的主要区别在两个表单之间。\n\
    \n![提交表单的结果](img/form1submit.png)\n\n图 4.2. 提交表单的结果\n\n`POST` 和 `GET` 之间的主要区别在两个表单之间。\n\
    \n![提交表单的结果](img/form1submit.png)\n\n图 4.2. 提交表单的结果\n\n"
- fmt: "To begin with, let's take a quick look at `PHP_SELF`. As we've discussed,\
    \ PHP has special predefined variables, which we can use throughout our scripts\
    \ to do some very special things. A group of these variables, however, are even\
    \ more special than the rest. They're located within the `$_SERVER` array, which\
    \ hold server and execution environment information, such as headers, paths, and\
    \ script locations on the server. We can access these pieces of data just as we\
    \ would with any other array. One of the keys in the `$_SERVER` array is `PHP_SELF`,\
    \ which holds information on the current PHP file being accessed in relation to\
    \ the document root.\n\nTo see this `PHP_SELF` value in action, let's create a\
    \ new file in our experiments folder called `self.php`. In this file, add the\
    \ following code:\n\n```php\n<?php\necho $_SERVER['PHP_SELF'];\n```\n\nNow, when\
    \ you view this file in your browser, you should see the URL to the file `self.php`\
    \ relative to your server's document root.\n\nIn our case this'd be something\
    \ similar to `\"localhost/experiments/self.php\"`. We can use `'PHP_SELF'` in\
    \ our form's `action` attribute to make it submit to `self.php`, and there we\
    \ can use the `$_POST` or `$_GET` variables to check if the form has transferred\
    \ the data, and then execute code to process it further.\n\nAn example of this\
    \ would be:\n\n```php\n<?php\nif (!empty($_POST['data'])) {\n    echo 'Form has\
    \ been submitted';\n    // code to process data from form\n}\n?>\n<html>\n<body>\n\
    \    <form action=\"POST\" action=\"<?php echo $_SERVER['PHP_SELF']; ?>\">\n \
    \       <input type=\"text\" name=\"data\" type=\"text\" placeholder=\"Type in\
    \ a string here\" />\n        <button type=\"submit\">submit</button>\n    </form>\n\
    </body>\n</html>\n```\n\nWhen the form is submitted, PHP detects this and executes\
    \ the `echo` command, which displays the \"Form has been submitted\" string in\
    \ our browser. The `PHP_SELF` variable is very useful for forms that need to submit\
    \ to the same script that displays them and, upon submission, execute code to\
    \ handle the data.\n\nWhen using the `PHP_SELF` variable as your form's `action`,\
    \ it's important to use the `htmlspecialchars()` function to filter any unwanted\
    \ characters from the URL to help prevent Cross Site Scripting (XSS) attacks.\
    \ To implement this in our example above, you'd change the `form` tag to look\
    \ like:\n\n```html\n<form action=\"POST\" action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n```\n"
  raw: "To begin with, let's take a quick look at `PHP_SELF`. As we've discussed,\
    \ PHP has special predefined variables, which we can use throughout our scripts\
    \ to do some very special things. A group of these variables, however, are even\
    \ more special than the rest. They're located within the `$_SERVER` array, which\
    \ hold server and execution environment information, such as headers, paths, and\
    \ script locations on the server. We can access these pieces of data just as we\
    \ would with any other array. One of the keys in the `$_SERVER` array is `PHP_SELF`,\
    \ which holds information on the current PHP file being accessed in relation to\
    \ the document root.\n\nTo see this `PHP_SELF` value in action, let's create a\
    \ new file in our experiments folder called self.php. In this file, add the following\
    \ code:\n\n```\n<?php\necho $_SERVER['PHP_SELF'];\n```\n\nNow, when you view this\
    \ file in your browser, you should see the URL to the file self.php relative to\
    \ your server's document root.\n\nIn our case this'd be something similar to `\"\
    localhost/experiments/self.php\"`. We can use `'PHP_SELF'` in our form's `action`\
    \ attribute to make it submit to self.php, and there we can use the `$_POST` or\
    \ `$_GET` variables to check if the form has transferred the data, and then execute\
    \ code to process it further.\n\nAn example of this would be:\n\n```\n<?php\n\
    if (!empty($_POST['data'])) {\n    echo 'Form has been submitted';\n    // code\
    \ to process data from form\n}\n?>\n<html>\n<body>\n    <form action=\"POST\"\
    \ action=\"<?php echo $_SERVER\n↵['PHP_SELF']; ?>\">\n        <input type=\"text\"\
    \ name=\"data\" type=\"text\" \n↵placeholder=\"Type in a string here\" />\n  \
    \      <button type=\"submit\">submit</button>\n    </form>\n</body>\n</html>\n\
    ```\n\nWhen the form is submitted, PHP detects this and executes the `echo` command,\
    \ which displays the \"Form has been submitted\" string in our browser. The `PHP_SELF`\
    \ variable is very useful for forms that need to submit to the same script that\
    \ displays them and, upon submission, execute code to handle the data.\n\nWhen\
    \ using the `PHP_SELF` variable as your form's `action`, it's important to use\
    \ the `htmlspecialchars()` function to filter any unwanted characters from the\
    \ URL to help prevent Cross Site Scripting (XSS) attacks. To implement this in\
    \ our example above, you'd change the `form` tag to look like the following:\n\
    \n```\n<form action=\"POST\" action=\"<?php echo htmlspecialchars\n↵($_SERVER['PHP_SELF']);\
    \ ?>\">\n```\n\nFor more information on improving the security of your PHP scripts\
    \ and protecting against XSS vulnerabilities, please check out the following articles:\n\
    \n*   [http://seancoates.com/blogs/xss-woes](http://seancoates.com/blogs/xss-woes)\n\
    \n*   [http://blog.astrumfutura.com/tag/xss/](http://blog.astrumfutura.com/tag/xss/)\n\
    \n## Superglobals and $\\_REQUEST\n\n`$_POST` and `$_GET` belong to specific group\
    \ of variables known as **superglobal variables**. Superglobals are specially-defined\
    \ variables—normally arrays—that are built into PHP and can be accessed in any\
    \ script at any point. They're called superglobals because they can be accessed\
    \ anywhere, and at any time. The `$_SERVER` variable we discussed in the previous\
    \ section is also part of the superglobal family of variables, along with some\
    \ others that we haven't discussed yet.\n\nAnother member of the superglobal family\
    \ is the `$_REQUEST` variable. It's a little different from other superglobals,\
    \ such as `$_POST` and `$_GET`. Indeed, `$_REQUEST` is unusual because its keys\
    \ are created by all values generated in the current HTTP request by the user's\
    \ browser. This means that all data stored in the `$_GET` variable and the `$_POST`\
    \ variable can be accessed by `$_REQUEST`.\n\nIn addition, any data stored using\
    \ browser cookies is also stored in `$_REQUEST`. At first, you may think this\
    \ could be very useful, but it actually poses a very significant security risk,\
    \ specifically because it can access data from cookies in PHP. Having a superglobal\
    \ that can be accessed anywhere in PHP, and which can also gather cookie data\
    \ is like have a ticking time bomb sitting in your PHP code.\n\nI strongly advise\
    \ not using `$_REQUEST`, and to ensure none of your PHP code is accessing it.\
    \ This will remove the risk of malicious attacks manipulating the script accessing\
    \ the superglobal to access your users' sensitive cookie data.\n\nphp.ini is set\
    \ up by default to not include cookie data in `$_REQUEST`, but if your host has\
    \ edited PHP's php.ini configuration file, they may have changed the default setting.\
    \ It's strongly advised not to access cookie data through the `$_REQUEST` superglobal;\
    \ the safest method is to turn off access to cookie data in php.ini. For more\
    \ information on the `$_REQUEST` superglobal, including examples of it in use,\
    \ and an overview of the risks entailed in using it, please see the [PHP manual's\
    \ resource page.](http://php.net/manual/en/reserved.variables.request.php)\n\n\
    ## Forms and Databases\n\nGiven what we've discussed previously, it may seem to\
    \ you like `GET` is the bad guy, but it can actually be quite useful in a variety\
    \ of ways. As we've discussed, `GET` will pass form field values as parameters\
    \ in the URL, which, in turn, can be used by a PHP script to create dynamic data.\n\
    \nSo far, we've looked at data taken from a URL, which has been created by a form.\
    \ However we can also use `GET` without a form to generate a dynamic URL. This\
    \ can be useful in many situations. For example, if we want to load a blog post\
    \ in the front-end of our application, we can collect a post's `id` from a specifically\
    \ written URL using the `$_GET` variable, and then pass on that `id` to our script\
    \ to collect the specific post from the database.\n\nTo try this out, we first\
    \ need to open phpMyAdmin and create a new database called `testposts`, ensuring\
    \ we have selected a user from our list who's already set up in phpMyAdmin to\
    \ have full privileges to it.\n\nNext we create a new table called `posts`, which\
    \ can be done either through the PDO MySQL script, or by using phpMyAdmin.\n\n\
    Our table `posts` will only need two columns for the purposes of this example:\
    \ `id` and `content`. The `id` column should be set as the `PRIMARY` index key\
    \ with `AUTO_INCREMENT` enabled, and its type set to `INT`, while the `content`\
    \ column is set as `LONGTEXT`.\n\nOnce the table has been created, we need to\
    \ place a test post into it. Add an entry, placing some dummy copy into the `content`\
    \ column. Feel free to add some paragraph HTML tags where appropriate. A unique\
    \ id should be generated for this entry automatically.\n\n### Important: Use Basic\
    \ HTML Formatting for the Content in Your Database\n\nYou should only use basic\
    \ HTML formatting tags in your database. Complex HTML or any other browser processed\
    \ coding language can cause security issues.\n\nNow let's create a new file in\
    \ our web experiment folder called post.php. Let's imagine that we have the following\
    \ URL: `localhost/experiments/post.php?id=1` where the `id` URL variable represents\
    \ the post id. In this case, the post has an id of 1, and `experiments` is the\
    \ name of the folder where we'll be creating this example.\n\nIn our post.php\
    \ file, add the following code:"
