    \nIn our code above, we've added a new form for visitors to leave a comment on\
    \ blog post. The form will submit the data—using the post method—to itself where\
    \ our application will then be able to process the data, and save it to the database\
    \ using `addComment()`. We've also added `if` statements for each of the input\
    \ fields in the form in case the user has forgotten to fill in when they tried\
    \ to submit their comment. We also have a hidden field, which holds the post id—something\
    \ we need in order to save the comment correctly.\n\n### Note: Using Gravatar\
    \ for Avatars\n\nOne thing to note is that we have added a link to [Gravatar](http://en.gravatar.com/)\
    \ to place the user's avatar next to the comment. Gravatar is a free service,\
    \ which allows users to upload an image to an online server and attribute their\
    \ email address to it. This enables developers to code into their applications\
    \ to collect an avatar that may be connected to the user's email address.\n\n\
    The call to Gravatar server is free, and means you don't have to store images\
    \ yourself. Gravatar's goal is to provide a quick and easy solution to keep everyone's\
    \ avatars up to date. If a user doesn't have an avatar set on Gravatar, it will\
    \ return a default avatar instead. Each email address is encoded using a basic\
    \ method, so we're required to encode the user's email address using `md5`; we've\
    \ done this in our code in order to retrieve the avatar from Gravatar's servers.\n\
    \n![Our blog, now with comments!](figures/comments.png)\n\nFigure 5.5. Our blog,\
    \ now with comments!\n\nReturning to our code, at the bottom of our template,\
    \ we have a new area where users can enter data about themselves, as well as submitting\
    \ a comment to be attached and displayed on the blog post. Now all we need to\
    \ do is save this template and we should have a fully working blog platform complete\
    \ comments, as shown in [Figure 5.5](#05.html \"Figure 5.5. Our blog, now with\
    \ comments!\"). Congratulations!\n\n### Summary\n\nSessions and cookies are vital\
    \ when you want to add user accounts into a `PHP` application. They are powerful\
    \ developer tools for personalizing data displayed in the browser, as they can\
    \ quickly and effectively identify users through data stored on the user's computer.\
    \ For user accounts in applications, cookies and sessions are vital to create\
    \ logged in statuses, which we have implemented for our admin panel in our application.\
    \ However, it's important to remember the potential security risks that come with\
    \ using cookies and sessions, and it's also important to implement code that will\
    \ reduce the security risk.\n\nFor more information on using sessions and cookies,\
    \ please see the following:\n\n* [http://www.sitepoint.com/php-sessions/](http://www.sitepoint.com/php-sessions/)\n\
    * [http://www.sitepoint.com/baking-cookies-in-php/](http://www.sitepoint.com/baking-cookies-in-php/)\n\
    * [http://www.php.net/manual/en/book.session.php](http://www.php.net/manual/en/book.session.php)\n\
    * [http://php.net/manual/en/features.cookies.php](http://php.net/manual/en/features.cookies.php)\n\
    \nNow that we have a working blog platform, we're about to enter the final chapter.\
    \ There, we'll look at different areas in `PHP` where we can improve security,\
    \ and where we could potentially add parts to our blog platform were we to extend\
    \ the application's functionality and processing.\n\nTesting and security are\
    \ two of the most important elements of application development. You may be able\
    \ to create the most impressive application ever seen, but if you don't ensure\
    \ that it's bug free and secure from attackers, you're not finishing the job.\n\
    \nIn this chapter we'll be covering some basic methods to improve the security\
    \ of your `PHP` applications. It'd be impossible to cover every single possible\
    \ implementation in this short book, so it's also a good idea to check out the\
    \ extra reading resources provided to build upon the techniques covered in this\
    \ chapter.\n\n## php.ini and Security\n\nWe can start planting the seeds of sound\
    \ security before we even start to build anything in `PHP`. At the beginning of\
    \ the book, we briefly touched on the `PHP` configuration file `php.ini`. It enables\
    \ us to configure a lot of `PHP`s behaviors, such as how it handles file uploads,\
    \ performs script caching, and, of particular interest to us now, handling `PHP`s\
    \ security.\n\n### Warning: Meddle at Your Own Risk!\n\nDo not edit any settings\
    \ if you are not 100% confident about how the changes will impact your `PHP` installation.\
    \ Diving in head first and editing settings without knowing what you're doing\
    \ could result in unexpected functioning.\n\n### Note: Uneditable php.ini\n\n\
    Certain hosting providers may not let you access or edit the `php.ini` file. If\
    \ you can't access the directory in which the file is located, you should contact\
    \ your host and ask about making changes.\n"
