    \ a block of code a certain number of times. It has three parts: an initialization,\
    \ a condition, and an increment/decrement.\n\n```php\nfor ($i = 0; $i < 10; $i++)\
    \ {\n    echo $i . '<br>';\n}\n```\n\nIn the example above, `$i = 0` is the initialization,\
    \ `$i < 10` is the condition (the loop continues as long as this is true), and\
    \ `$i++` is the increment, which increases `$i` after each iteration.\n\n### while\
    \ Statement\n\nA `while` loop is used to execute a block of code as long as a\
    \ specified condition is true. It is useful when you don't know exactly how many\
    \ times the loop should run.\n\n```php\n$i = 0;\nwhile ($i < 10) {\n    echo $i\
