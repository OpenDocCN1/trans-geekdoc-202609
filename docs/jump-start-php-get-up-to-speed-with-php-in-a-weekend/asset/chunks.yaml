    </form>\n</article>\n<?php require_once('includes/temps/footer.php'); ?>\n```\n\
    \nIn our code above, we've added a brand new form for visitors to the blog to\
    \ leave a comment on a blog post. The form will submit the data—using the post\
    \ method—to itself where our application will then be able to process the data,\
    \ and save it to the database using the `addComment()` method. We've also added\
    \ `if` statements for each of the input fields in the form in case the user has\
    \ forgotten to fill in a field when they tried to submit their comment. We also\
    \ have a hidden field, which holds the id of the post—something we need in order\
    \ to save the comment to the database correctly.\n\n### Note: Using Gravatar for\
    \ User Avatars\n\nOne thing to note is that we have added a link to [Gravatar](http://en.gravatar.com/)\
    \ to place the user's avatar next to the comment. Gravatar is a free service,\
    \ which allows users to upload an avatar image to an online server and attribute\
    \ their personal email address to it. This enables developers to code into their\
    \ applications a call to the Gravatar server to collect an avatar that may be\
    \ connected to a user's email address they've been supplied with.\n\nThe call\
    \ to the Gravatar server is free, and means you don't have to store avatar images\
    \ yourself. Gravatar's goal is to provide a quick and easy solution to keep everyone's\
    \ avatars up to date and consistent. If a user doesn't have an avatar set on Gravatar,\
    \ it will return a default blank avatar instead. Each email address is encoded\
    \ using a basic method, so we're required to encode the user's email address using\
    \ md5 encryption; we've done this in our code in order to retrieve the avatar\
    \ from Gravatar's servers.\n\n ![Our blog, now with comments!](figures/comments.png)\n\
    \nFigure 5.5. Our blog, now with comments!\n\nReturning to our code, at the bottom\
    \ of our template, we have a new form area where users can enter data about themselves,\
