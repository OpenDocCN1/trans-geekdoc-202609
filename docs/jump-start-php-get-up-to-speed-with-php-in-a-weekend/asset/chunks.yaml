    \ <?php require_once '_inc/footer.php'; ?> \n```\n\n在此时，我们仅拥有一个用于输入内容的基础文本区域。稍后，我们将进一步扩展此面板，包含一个用于文章标题的区域，并将文本区域更改为更动态且易用的内容编辑器。\n\
    \n在将上述所有代码添加到 `newpost.php` 文件后，你现在应该拥有了一个可以运行的管理面板，可以在其中创建新的博客文章！\n\n我们还可以访问项目的公共（或前端）部分，查看博客文章列表，并点击单篇文章来阅读其内容，如图\
    \ 4.7 所示。很令人兴奋对吧？\n\n![我们项目的前端](img/post.png)\n\n图 4.7. 我们项目的前端。\n\n请随时导航到项目的主\
    \ `index.php` 文件并开始使用该系统。\n\n在下一章节中，我们将进一步扩展管理面板，允许我们更新数据库中现有的博客文章，并删除博客文章。\n\n\
    ## 总结\n\n表单是任何 Web 应用程序至关重要的部分，允许用户提交数据。PHP 为我们提供了强大的工具，用于处理、存储和操作通过表单提交的数据。在本章中，我们讨论了\
    \ PHP 收集表单提交数据的方法，查看了 `POST` 和 `GET` 方法，并讨论了如何验证收集到的数据，为将其输入我们的 `MySQL` 数据库做好准备。然后，我们使用了讨论过的表单方法构建了我们的博客应用程序。\n\
    \n正如我们讨论过的，数据库是存储应用程序可以在日后检索的数据的理想选择。然而，使用 PHP 还有以更临时的方式存储数据的选项。`cookies` 和 `sessions`\
    \ 设计用于存储比通常数据库中存储更小的数据块。它们通常用于存储用户登录功能的个人数据（例如），并为应用程序配置文件等功能提供用户数据的快速访问。\n\n\
    Cookies 和 sessions 之间的主要区别在于数据存储的位置。Cookies 将数据存储在客户端计算机上，而 sessions 将其数据存储在 Web\
    \ 服务器上。PHP 可以同时处理 cookies 和 sessions，我们将在本章中详细查看这些每个选项。\n\n## Cookies：概览\n\nHTTP\
    \ 请求是无状态的，这意味着每当浏览器请求新页面时，Web 服务器都不会记住与用户之前的某个请求相关的数据。\n\n幸运的是，我们有使用 cookies 的选项，它允许我们在访问者的浏览器中存储一小部分信息。这些\
    \ cookie 信息可以被网站加载，并在其脚本中使用以实现数据的个性化，或帮助在站点页面上创建动态数据。\n\n当您需要在 HTTP 页面请求之间保留数据时，Cookies\
    \ 也非常有用。在浏览器中创建的每个 cookie 仅可由创建它的浏览器访问，这有助于保持其中包含的信息安全。\n\n### 重要：Cookies 与最近的欧洲立法\n\
    \n最近，对于居住在欧洲或与要在欧洲部署的项目工作的 Web 开发人员来说，cookies 被处于疑云之中。欧盟认为 cookies 被用来存储了关于网站访问者的太多个人信息，因此已经实施了[新立法](http://www.ico.org.uk/for_organisations/privacy_and_electronic_communications/the_guide/cookies)，旨在提高其使用的透明度。\n\
    \n这项立法并不意味着开发者不应该使用 cookies，但它确实意味着我们必须更高效地使用它们，并且仅在应用有真实需求时才使用它们。\n\n事实是，网站使用的大多数\
    \ cookies 都是无害的——许多 仅用于根据用户乐意提供的个人信息来增强用户内容。\n\n## Sessions：概览\n\n尽管 cookies 很有用，但它们确实存在漏洞——因为它们存储在用户的计算机上，理论上它们可能会被用户篡改，或者更糟糕的是，被用户计算机上的病毒篡改。sessions\
    \ 提供了 cookies 的替代方案，并且不带客户端的安全风险。\n\n`sessions` 是一种特殊形式的连续性，用于在用户访问您的网站期间跨页面请求存储数据。当您登录\
    \ Web 应用程序、编辑某些内容并注销时，通常情况下，一个 session 会在后台运行。\n\n值得注意的是，sessions 仍然依赖 cookies\
    \ 来成功将存储在网站服务器上 session 中的数据归类给客户端。换句话说，用户每当访问网站时，都需要客户端计算机上的一个 cookie 来识别他们。\n\
    \n## Session 对比 Cookies\n\n在您使用 PHP 开发时，您可以很方便地同时使用 cookies 和 sessions。两者都可以使用非常简单的方法访问。不过，在深入代码之前，探索\
    \ cookies 和 sessions 的独特特性以更好地了解您何时可能倾向于使用其中一个。\n\n### Cookies\n\nCookies 与 sessions\
    \ 相比的第一个独特特性是我们为它们设置了过期时间。当客户端离开我们的网站或 Web 应用程序并游览到互联网的其他部分时，他们很有可能会返回。通过 cookies\
    \ 我们可以设置过期时间，这样当用户再次访问时，只要过期时间未到，他们之前提交或输入的信息就会像没有离开一样显示。\n\n使用过期时间的例子是您登录社交媒体应用程序（如\
    \ Facebook）。登录后，您可能会导航到另一个网站。但在特定时间范围内返回 Facebook，您可能会发现自己仍然处于登录状态。cookie 为 Facebook\
    \ 提供了此部分数据，帮助它加载我们的配置文件，从而极大地改进了用户体验。为 cookies 设置过期时间使这种便利成为可能，同时增加了一层安全性。通过强制用户在活动一段时间后重新验证身份，防止其他用户通过硬件劫持访问\
    \ cookie 中存储的数据。\n\nCookies 的另一个特性是，每当有人访问在其机器上了 cookie 的网站时，cookie 会自动包含在客户端发送的后续\
    \ HTTP 请求中。考虑到这一点，不要让 cookies 存储太多数据，因为它们会占用 Web 服务器的带宽。\n\nCookies 使数据管理更加简单，因为使用它们不需要任何任何形式的数据库。这意味着使用\
    \ cookies 不需要任何数据库管理技能。此外，在许多 Web 编程语言（如 PHP）中，创建、分配数据和访问 cookies 的功能已经内置，因此您无需担心自己编写库来访问它们。\n\
    \n"
- fmt: "\nOverall, cookies should be used to store small pieces of information that\
    \ can be used to personalize small parts of a web page to improve a user's experience.\
    \ They can also be used to allow users to resume their previous interaction with\
    \ your application, creating the illusion that they're still logged in.\n\n###\
    \ Note: Cookies and Security\n\nIt's important to remember not to store sensitive\
    \ data in cookies due to the fact they're sent to the web server each time a page\
    \ request is made, and can be accessed by tech-savvy computer attackers.\n\nIn\
    \ addition, because they're stored on the user's computer, there's very little\
    \ we, as developers, can do to protect the cookies. Because of this, cookies should\
    \ ideally only store data that can be used by an application to identify information\
    \ that's stored in databases or other secure storage options, as opposed to storing\
    \ the data in the cookie itself.\n\n### Sessions\n\nSessions combine the usefulness\
    \ of cookies with the security and manageability of the web server. Unlike with\
    \ a cookie, specific variable data and information is not directly stored on the\
    \ user's computer. The data itself is actually stored on the web server that houses\
    \ and processes the website or web application.\n\nSessions are very unlike any\
    \ other variables we have looked at so far, as they don't pass the data directly\
    \ between the pages requested by the browser—instead, the data is retrieved from\
    \ the session we initiate at the beginning of each page. As mentioned previously,\
    \ sessions use a cookie stored on the client's computer to identity the correct\
    \ user with their data stored in a session. This cookie doesn't hold any personal\
    \ information, nor does the data make any sense unless compared with the data\
    \ stored on the web server; usually it comes in the form of a key such as `350401be75bbb0fafd3d912a1a1d5e54`.\
    \ For this reason, the data security of sessions is of a higher level than when\
    \ using cookies alone.\n\nWhile this method of storing data on both the client's\
    \ computer and the server may seem a bit clumsy, it actually has its advantages:\n\
    \n* Sessions don't have a limit on the amount of data you can store in them. This\
    \ is because sessions are stored on the server so they don't impact negatively\
    \ on the server's bandwidth.\n* Because session data is stored on a web server\
    \ and not on the user's computer, this allows you to focus your security efforts\
    \ on your web server, rather than applying encryption methods which fit into the\
    \ storage capabilities of user's browser.\n\nOne thing to remember with sessions\
    \ is that you can specify how long they stay alive, or active. We call this \"\
    time-to-live\" and it's usually configured for the session to expire or die after\
    \ a user has closed the browser or tab that initiated the session with the web\
    \ server. So, for example, if a user logs into a social media application, when\
    \ they are finished using it and close their browser, the session, if configured\
    \ to do so, will automatically remove its data for that user—a very useful feature.\n\
    \n## Sessions and Cookies in PHP\n\nNow that we've covered the reasons for using\
    \ sessions and cookies, as well as the main differences between them, it's time\
    \ we start to look at how to implement them in PHP.\n\nBoth sessions and cookies\
    \ can be accessed and loaded by special variables dedicated to these particular\
    \ methods. In PHP, we express the intent to use and manipulate a cookie by using\
    \ the superglobal variable `$_COOKIE`.\n\n### Cookies in PHP\n\nNow that we know\
    \ the basics of how to write and use cookies, we're going to look at how to use\
    \ and write sessions. Just like cookies, this method makes use of a special superglobal\
    \ variable, with which we assign data to, and obtain data from, sessions: `$_SESSION`.\n\
    \nThere are special functions we must use to set cookies. In our example, we set\
    \ the expiration time and date for the cookie, and stored it in the `$expire`\
    \ variable, located in the first line. Note we have used the `time()` function.\
    \ Let's create a new file and add the following code:\n\n```php\n<?php\n$expire\
    \ = time() + 60 * 24 * 30;\nsetcookie(\"user\", \"Joe Public\", $expire);\nif\
    \ (isset($_COOKIE[\"user\"])) {\n    echo \"Welcome \" . $_COOKIE[\"user\"];\n\
    } else {\n    echo \"Welcome!\";\n}\n```\n\n### Important: isset()\n\nIt's also\
    \ important to note that data from cookies will be sent to the server on every\
    \ page request. If your script sends out HTML before your script sends out any\
    \ cookie data, or sets any cookie data to be sent to the server, PHP will throw\
    \ an error. It's important to make sure that you set and send your cookie data\
    \ at the start of your script. However, you can retrieve data from a cookie further\
    \ on in your script, after HTML has been sent. This will not throw a PHP error\
    \ (as long as the cookie exists and has data). I highly suggest you take the time\
    \ to read [my SitePoint article for further reading on cookies in PHP](http://www.sitepoint.com/php-sessions/).\n\
    \nThe `isset()` function checks if a variable has a value. In the code above,\
    \ we use `$_COOKIE` to make sure the cookie has been detected. When you now take\
    \ the `storage.php` file, you'll see that `isset()` will de-.\n"
  raw: "Overall, cookies should be used to store small pieces of information that\
    \ can be used to personalize small parts of a web page to improve a user's experience.\
    \ They can also be used to allow users to resume their previous interaction with\
    \ your application, creating the illusion that they're still logged in.\n\n###\
    \ Note: Cookies and Security\n\nIt's important to remember not to store sensitive\
    \ data in cookies due to the fact they're sent to the web server each time a page\
    \ request is made, and can be accessed by tech-savvy computer attackers.\n\nIn\
    \ addition, because they're stored on the user's computer, there's very little\
    \ we, as developers, can do to protect the cookies. Because of this, cookies should\
    \ ideally only store data that can be used by an application to identify information\
    \ that's stored in databases or other secure storage options, as opposed to storing\
    \ the data in the cookie itself.\n\n### Sessions\n\nSessions combine the usefulness\
    \ of cookies with the security and manageability of the web server. Unlike with\
    \ a cookie, specific variable data and information is not directly stored on the\
    \ user's computer. The data itself is actually stored on the web server that houses\
    \ and processes the website or web application.\n\nSessions are very unlike any\
    \ other variables we have looked at so far, as they don't pass the data directly\
    \ between the pages requested by the browser—instead, the data is retrieved from\
    \ the session we initiate at the beginning of each page. As mentioned previously,\
    \ sessions use a cookie stored on the client's computer to identity the correct\
    \ user with their data stored in a session. This cookie doesn't hold any personal\
    \ information, nor does the data make any sense unless compared with the data\
    \ stored on the web server; usually it comes in the form of a key such as `350401be75bbb0fafd3d912a1a1d5e54`.\
    \ For this reason, the data security of sessions is of a higher level than when\
    \ using cookies alone.\n\nWhile this method of storing data on both the client's\
    \ computer and the server may seem a bit clumsy, it actually has its advantages:\n\
    \n*   Sessions don't have a limit on the amount of data you can store in them.\
    \ This is because sessions are stored on the server so they don't impact negatively\
    \ on the server's bandwidth.\n\n*   Because session data is stored on a web server\
    \ and not on the user's computer, this allows you to focus your security efforts\
    \ on your web server, rather than applying encryption methods which fit into the\
    \ storage capabilities of user's browser.\n\nOne thing to remember with sessions\
    \ is that you can specify how long they stay alive, or active. We call this \"\
    time-to-live\" and it's usually configured for the session to expire or die after\
    \ a user has closed the browser or tab that initiated the session with the web\
    \ server. So, for example, if a user logs into a social media application, when\
    \ they are finished using it and close their browser, the session, if configured\
    \ to do so, will automatically remove its data for that user—a very useful feature.\n\
    \n## Sessions and Cookies in PHP\n\nNow that we've covered the reasons for using\
    \ sessions and cookies, as well as the main differences between them, it's time\
    \ we start to look at how to implement them in PHP.\n\nBoth sessions and cookies\
    \ can be accessed and loaded by special variables dedicated to these particular\
    \ methods. In PHP, we express the intent to use and manipulate a cookie by using\
    \ the superglobal variable `$_COOKIE`. Sessions are used in a similar way through\
    \ the `$_SESSION` superglobal.\n\nFirst, let's focus on writing and using cookies.\n\
    \n### Cookies in PHP\n\nThere are special functions we must use to assign data\
    \ to cookies. Let's create a new file in our experiments folder and name it storage.php.\
    \ Once this file has been created, add the following code to it:\n\n```\n<?php\n\
    $expire = time() + 60 * 60 * 24 * 30; \n↵// This equals to the time now plus 30\
    \ days in the future\nsetcookie(\"user\", \"Joe Public\", $expire);\nif (isset($_COOKIE[\"\
    user\"])) {\n    echo \"Welcome \" . $_COOKIE[\"user\"] . \"!\";\n} else {\n \
    \   echo \"Welcome guest!\";\n}\n```\n\n### Important: isset()\n\nThe `isset()`\
    \ function checks to see if a variable or element has been assigned a value. In\
    \ the code above, `isset()` will make sure a key in `$_COOKIE` has a value before\
    \ letting the `if` statement continue.\n\nIf you now take your browser and navigate\
    \ to the storage.php file, you can see that our script hasn't detected our \"\
    Joe Public\" name, and actually thinks we're a guest. This is because the cookie\
    \ is set by the `setcookie()` function—this tells PHP to set a cookie in our browser\
    \ along with the data to be stored, and the cookie's lifespan, after the PHP engine\
    \ has rendered the whole PHP script first. When we first access the script with\
    \ our code in the browser, there'll be no cookie for PHP to detect and retrieve\
    \ data from. That's because the PHP will be processed on our server. However,\
    \ the cookie is being set in our browser—that happens after the server is finished\
    \ processing our PHP script. Therefore, we won't see the cookie's data the first\
    \ time we load the page.\n\nRefresh the storage.php file, and we'll see that the\
    \ cookie's data has now been collected by PHP, and is displaying the \"Joe Public\"\
    \ data we entered into the `setcookie()` function. You may also notice that the\
    \ first argument passed into this function is the name argument, which sets the\
    \ name of the cookie. We then use this argument to tell PHP which individual cookie\
    \ we want to load in order to obtain the data we want from it. The second argument,\
    \ as we've already covered, is the data we want to store in this cookie. In our\
    \ example above, it's the string \"Joe Public\". The last argument in the function\
    \ is where we set how long we want the cookie to stay alive. Usually cookies are\
    \ required to have a lifespan set—a time and date after which the browser will\
    \ destroy them. However, it's worth remembering that cookies used by sessions\
    \ don't require a specific time-to-live date or time as theirs is controlled by\
    \ the session's time-to-live.\n\nIn our code, we set the expiration time and date\
    \ for the cookie, and stored it in the `$expire` variable, located in the first\
    \ line of our code. Note we have used the `time()` PHP function. This allows us\
    \ to obtain the time and date when our script is visited by a browser and rendered\
    \ by PHP. The `time()` function actually returns the number of seconds that have\
    \ elapsed since midnight GMT Jan 1 1970 as a number. So, instead of returning\
    \ a date in a readable format, such as \"May 14 12:50\", `time()` returns a number,\
    \ such as `1368553800`. For more information on the `time()` and `date()` functions\
    \ in PHP, please see the [PHP manual's documentation](http://php.net/manual/en/book.datetime.php).\n\
    \nIt's also important to note that data from cookies will be sent to the server\
    \ on every page request. If your script sends out HTML before your script sends\
    \ out any cookie data, or sets any cookie data to be sent to the server, PHP will\
    \ throw an error. It's important to make sure that you set and send your cookie\
    \ data at the start of your script. However, you can retrieve data from a cookie\
    \ further on in your script, after HTML has been sent to the browser. This will\
    \ not throw a PHP error (as long as the cookie exists and has data). I highly\
    \ suggest you take the time to read [my SitePoint article for further reading\
    \ on cookies in PHP](http://www.sitepoint.com/php-sessions/).\n\n### Sessions\
    \ in PHP\n\nNow that we know the basics of how to write and use cookies, we're\
    \ going to look at how to use and write sessions. Just like cookies, this method\
    \ makes use of a special superglobal variable, with which we assign data to, and\
    \ obtain data from, sessions: `$_SESSION`."
