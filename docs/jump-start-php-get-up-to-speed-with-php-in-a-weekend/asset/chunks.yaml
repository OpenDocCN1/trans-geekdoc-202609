- fmt: '

    MAMP may install two folders, one named MAMP and the other named MAMP Pro. If
    MAMP Pro is installed on your computer, remove this folder and application. MAMP
    Pro is a pay-for program, whereas MAMP is a free application.


    Once that''s done, you can start the MAMP program by clicking on the MAMP icon;
    you should be welcomed with the splash screen.


    ![The MAMP splash screen](figures/mampsplash.png)

    Figure 1.2. The MAMP splash screen


    On the splash screen, shown in [Figure 1.2](#ch01.html#mampsplash "Figure 1.2.
    The MAMP splash screen"), you should see two icons on the left-hand side of the
    box titled `Apache Server` and `MySQL Server` which should both have red dots
    next to them. These red dots mean they haven''n''t been started. To fire them
    up, we need to hit the `Start Servers` button; the dots should switch to green.
    Shortly after pressing the `Start Servers` button, your default browser should
    open and load the MAMP start screen.


    ![MAMP start screen](figures/mampstart.png)

    Figure 1.3. MAMP start screen


    MAMP is now installed. However, it forces you to use port `8888` to access the
    Apache server. This is not as nice as accessing the server simply typing `localhost`
    into the browser''s address bar, as WAMP allows. Luckily, there''s a very simple
    fix for this issue. Switch back to the MAMP splash screen and select the `Preferences`
    button. There should be an option in the small navigation menu at the top of the
    panel titled `Ports`.


    In this window you should see an input box with the label `Apache Port` to the
    left of it. If you change this option from `8888` to `80` you can now access the
    MAMP start screen by simply typing `localhost/MAMP` into your browser''s address
    bar.


    ## Linux


    If you''re running a Linux operating system such as Ubuntu or Debian, you can
    use the terminal to install the `LAMP` package from the system''s repositories.
    Installing a local server on Linux is slightly different from Windows or Mac OS
    X. The installation method is a bit more advanced, but it allows a lot more control
    and freedom when running and managing the server. In fact, the method is almost
    identical to the one used to manage and run live web servers on Linux. The installation
    example we''ll cover here will specifically show the steps for installing `LAMP`
    on Ubuntu.


    Your first step is to start the terminal program, which can be done by searching
    for `Terminal` in Dash Menu, the first icon in the Ubuntu side menu, or by heading
    to `Applications > Accessories > Terminal` via folder navigation.


    Once you have the terminal open, you can start by installing Apache on the computer.
    You do this by typing the following into the terminal:


    ```bash

    sudo apt-get install apache2

    ```


    Hit `Enter` and your terminal will start going crazy, but don''t panic, this is
    natural.


    Apache should now be installed and the basics of your local server will be set
    up. To test this, open a web browser and type `localhost` into the address bar.
    If it has installed successfully, you should be welcomed with the "It works!"
    splash screen as shown in [Figure 1.4](#ch01.html#localhostlinux "Figure 1.4.
    Localhost on Linux").


    ![Localhost on Linux](figures/localhostlinux.png)

    Figure 1.4. Localhost on Linux


    Now you''ll need to install PHP, so head back to the terminal and type:


    ```bash

    sudo apt-get install php5 libapache2-mod-php5*

    ```


    PHP 5 will be installed along with the basic libraries it needs to work alongside
    the Apache server you just installed. Once complete, you have to restart Apache
    for it to acknowledge PHP was just installed. In the terminal, type the command
    below:


    ```bash

    sudo service apache2 restart

    ```


    Your Apache server will now restart, see that you have PHP installed, and will
    load up all of the libraries needed to run PHP on your local sever.


    Now you have your local server up and running and you have PHP installed on it.
    To install MySQL and phpMyAdmin I recommend following [this guide by Mhabub Mamun.](http://www.developmentwall.com/install-apache-php-mysql-phpmyadmin-ubuntu/4)


    Finally, you have the option to enable the `mod_rewrite` module for Apache, which
    allows developers to redirect users to different sections of the website by rewriting
    the requested URLs. For a full in-depth guide for enabling and settings up the
    `mod_rewrite` module, please see [the Nettuts+ guide](http://net.tutsplus.com/tutorials/other/a-deeper-look-at-mod_rewrite-for-apache/),
    which offers a very detailed step-by-step tutorial.


    ## PHP Configuration


    Before we delve into writing some PHP code, let''s configure PHP to better suit
    our project. PHP is configured by the file `php.ini`, which holds all of the core
    settings relating to how PHP will behave on our server. You can see a quick overview
    of PHP''s current configuration by using the `phpinfo()` function in a PHP script.
    To do this, create a new file in your server folder named `info.php`, add the
    following code to the file, and save it:


    ```php

    <?php

    phpinfo();

    ```


    Now, point your browser to the `info.php` file and you should see a page that
    displays a table full of information about our PHP''s current configuration, as
    shown in [Figure 1.5](#ch01.html#phpinfo "Figure 1.5. phpinfo()").


    ![phpinfo()](figures/phpinfo.png)

    Figure 1.5. phpinfo()


    The key thing to find here is the row titled `Configuration File (php.ini) Path`
    as this will tell you exactly where your `php.ini` file is located. You can see
    that in [Figure 1.5](#ch01.html#phpinfo "Figure 1.5. phpinfo()") my `php.ini`
    file is located at `E:\wamp\bin\apache\apache2.4.2\bin\php.ini`. Your path will
    very likely be different from this, so use the `phpinfo()` function to find out
    what it is.


    The `php.ini` file contains a large amount of settings, some of which you may
    never need to change. However, there are a few which can be changed to help tailor
    PHP to suit your development style and environment. For a tour of the `php.ini`
    file, I highly recommend reading [the Tour of php.ini article I wrote for SitePoint](http://www.sitepoint.com/a-tour-of-php-ini/).


    ## Hello PHP World


    Now that you have your local server installed and running, let''s start coding
    some PHP! We''ll start by heading to Apache''s web folder, which is located in
    different places depending on which operating system you are using:


    *   For Windows users using WAMP, open up Explorer or My Computer and navigate
    to the directory at `C:/Program Files/wamp/www/`

    *   For Mac OS X using MAMP, open Finder and navigate your way to `Applications
    > MAMP > htdocs` to locate MAMP''s web directory.

    *   The web directory for Linux can be found in `/var/www`. Many Linux developers
    like to edit their server''s config file to change which directory is used for
    web files. To do this, please see the [solution on Stack Overflow](http://stackoverflow.com/a/5891858).


    Once you''ve found your server''s web directory, you need to create a directory
    to act as your project''s "root" directory where all your project files will be
    located. For now, create a directory named `my_project`. I specifically avoided
    any spaces or capital letters in the folder''s title because it will form part
    of the URL to access files in this folder.


    Now create a new PHP file called `index.php` in the `my_project` folder. Once
    this file has been created you''ll need to open it in a text editor that can edit
    PHP files.


    ### Note: Choosing a Text Editor


    I recommend that you use an editor which supports syntax highlighting for PHP.
    Choosing an editor is a very personal decision as different editors offer different
    features; some editors will complement your way of coding and some may conflict
    with it. In the end, the choice should really depend on which editor makes coding
    easier and more fun for you. It''s worth trying a few different editors before
    settling on your final choice.


    Here''s a short list of some of the more popular editors available. It contains
    a mixture of both free and paid-for editors:


    *   [Adobe Dreamweaver](http://www.adobe.com/products/dreamweaver.html) – (Windows
    and Mac OS X)

    '
