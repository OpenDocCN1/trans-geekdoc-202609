  trans: "\n\n对于我们的项目，我们将使用一个易于实现的 JavaScript Markdown 转换器和编辑器，名为 [Pagedown](http://code.google.com/p/pagedown/)。要实现该库，你需要按照顺序加载三个\
    \ Pagedown 库：`Markdown.Converter`、`Markdown.Sanitizer` 和 `Markdown.Editor`。一旦加载了这些库，通过将以下代码添加到\
    \ `header.php` 模板文件的`<head>` 标签中来初始化这些库：\n\n```\n<script>\n    (function () {\n\
    \        var converter = new Markdown.Converter();\n        var editor = new Markdown.Editor(converter);\n\
    \        editor.run();\n    }());\n</script>\n```\n\n你还需要确保你有正确的元素来加载编辑器的格式按钮，并为你的文本区域分配正确的类名，以便库能够确定在何处加载文本格式代码。此外，库还需要知道在你输入内容和进行格式化时，在何处显示文章的预览。\n\
    \n我们已经在上面的模板中添加了了这两个元素及其所需的类。让我们来看看我们添加的代码。以下是格式按钮和文本输入的代码：\n\n```\n<div class=\"\
    wmd-panel controls\">\n    <div id=\"wmd-button-bar\"></div>\n        <textarea\
    \ class=\"wmd-input\" name=\"post[content]\" \n        id=\"wmd-input\">*在此开始输入*</textarea>\n\
    </div>\n```\n\n以及预览区域的代码：\n\n```\n<section class=\"span4\" style=\"padding-left:20px;\
    \ border-left:1px \nsolid #eee;\">\n    <div id=\"wmd-preview\" class=\"wmd-panel\
    \ wmd-preview\"></div>\n</section>\n```\n\n你可以通过查找 id 和/或类名带有 `wmd` 前缀的元素来识别 Pagedown\
    \ 库需要的区域。一旦加载了这些库，你就可以开始在编辑器区域中输入你的文章内容以及一些 markdown 格式了，如图图 5.2 所示。\n\n![在文本编辑器中编写文章](img/admin_post_create.png)\n\
    \n图 5.2. 在文本编辑器中编写文章\n\n你还应该注意到我们在模板文件的顶部添加了一个名为“评论”（Comments）的新按钮。点击此新按钮将把用户带到评论管理面板，他们可以在那里查看所有添加到我们文章文章的评论，并删除他们不想在博客上显示的评论。为了让它运行起来，我们首先需要的是是在数据库中创建一个新表，用于存储用户的评论。在你的数据库中建立一个新表，如图图\
    \ 5.3 所示。\n\n![我们的评论表](img/commentstable.png)\n\n图 5.3. 我们的 `comments` 表\n\n为了让管理面板的这部分运行，让我们再次打开\
