    \n*   [http://www.php.net/manual/en/language.types.array.php](http://www.php.net/manual/en/language.types.array.php)\n\
    \n*   [http://www.sitepoint.com/introduction-to-php-arrays/](http://www.sitepoint.com/introduction-to-php-arrays/)\n\
    \n*   [http://www.htmlandphp.com/beginner-php/207-introduction-to-arrays-in-php.html](http://www.htmlandphp.com/beginner-php/207-introduction-to-arrays-in-php.html)\n\
    \n## Comments\n\nWe can write comments to ourselves in our PHP code. Comments\
    \ are not processed as statements by PHP. We start a comment by using two forward\
    \ slashes `//` ― anything written on the same line after the slashes will be considered\
    \ to be a comment and won't be processed. For example:\n\n```\n<?php\n// this\
    \ is a PHP comment for this line only\n```\n\nWe can also use `/*` to signal the\
    \ beginning of a comment that spans multiple lines ending with `*/` to mark the\
    \ end of the comment. For example:\n\n```\n<?php\n/* this is the beginning of\
    \ our PHP comment.\nIt can go on for multiple lines until we end the comment.\n\
    We will end it now. */  \n```\n\nComments allow developers to leave notes to anyone\
    \ reading their code, giving insight into how it works and making it easier to\
    \ maintain.\n\nComments also allow us to temporarily hide segments of code (\"\
    comment out\" code). We might do this with code that isn't yet complete and would\
    \ cause an error if it was processed.\n\n## Preparing Our Project\n\nTo conclude\
    \ this chapter, let's quickly lay out the directory structure for this book's\
    \ project. We'll be developing a basic blog application powered purely by PHP\
    \ and a MySQL database to store all our data, such as post content. The application\
    \ will consist of a public front-end, displaying a list of blog posts, and an\
    \ admin panel that will enable us to manage our blog's content.\n\nFor now, we\
    \ need to create a new folder in our web directory, which we'll call kickstart.\
    \ Inside this directory we need to make three more directories: one named admin,\
    \ another named frontend, and the last one named includes as shown in [Figure 1.8](#ch01.html#homefolders\
    \ \"Figure 1.8. Our project folders\").\n\n ![Our project folders](figures/homefolders.png)\n\
    \nFigure 1.8. Our project folders\n\nThe `admin` directory will house the files\
    \ used for the admin panel functionality. The frontend directory will hold all\
    \ the files used for the public side of the blog to work. This public side is\
    \ where visitors will be able to view blog posts, and the files will load the\
    \ blog data for display in the visitors' browsers. The includes directory is where\
    \ we'll place any scripts which have functionality that can be used in both the\
    \ admin section and the public section.\n\nWe also need to create a directory\
    \ inside both the admin and frontend directories named templates. The directory\
    \ templates which will hold all the PHP and HTML files that will accept data from\
    \ scripts and files in the functions folder. These template files will ultimately\
    \ format our data from PHP and create the layouts that our visitors will interact\
    \ with in the front-end. The same template files will also create the layouts\
    \ which we'll use to manage the blog in the admin section. Further on in the book\
    \ we'll go into templating in greater depth and learn why exactly we're using\
    \ it for our project.\n\nSeparating out these folders like this is helpful because\
    \ it'll help you to develop cleaner and better-organized code.\n\n## Summary\n\
    \nIn this chapter we've covered the basics of setting up a web server, introduced\
    \ PHP coding by displaying text, and used variables to store PHP data. Everything\
    \ covered in this chapter is an introduction and we'll be coming back to some\
    \ of the topics we've touched on here later in the book.\n\nIn the next chapter\
    \ we'll be looking at how we can use permanent storage options such as a database\
    \ with our scripts and how we can use the visitor's browser to store small amounts\
    \ of data as well.\n\nData is the lifeblood of PHP. In this chapter, we'll look\
    \ at one of the many options that PHP offers to developers in terms of processing\
    \ data and using permanent storage solutions—interacting with a MySQL database.\
    \ In addition, we'll briefly explore some important programming concepts, like\
    \ conditional statements and loops, which become necessary when reading data back\
    \ from a database. So get ready and roll up your sleeves; we're going to dive\
    \ deep into the world of PHP data handling!\n\n## Operators\n\nIn PHP, just as\
    \ in almost all programming languages, **operators** are used to manipulate or\
    \ perform various operations on variables and values. The most basic operator\
    \ is `=`, which as we saw in [Chapter 1](#ch01.html \"Chapter 1Server Kick-Start\"\
    ) is used to assign a value to a variable. But there are many other powerful operators\
    \ to discover.\n\nTo begin, let's create a new file named op\\_experiments.php\
    \ in the my\\_project folder that we created previously. In this file, add the\
    \ following code:\n\n```\n<?php\n$firstName = \"myfirstname\";\n$lastName = \"\
    mylastname\";\n$fullName = $firstName . $lastName;\necho $fullName;  \n```\n\n\
    While most of this code probably looks pretty straightforward, the line `$fullName\
    \ = $firstName . $lastName;` may take you slightly by surprise, especially the\
    \ little period that sits between two of the variables.\n\nThe period is PHP's\
    \ string concatenation operator; it joins two strings together to make one longer\
    \ string. PHP takes the string value of `$firstName`, adds the value of `$lastName`\
    \ to it, and places the result in the variable `$fullName`. When we run the script\
    \ and PHP outputs the value of `$fullName`, we will see `myfirstnamemylastname`\
    \ displayed in the browser.\n\n ![The output of our experiment](figures/op_experiments.png)\n\
    \nFigure 2.1. The output of our experiment\n\nIt's not very readable though, is\
