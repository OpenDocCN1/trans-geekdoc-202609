    要定位你的 `php.ini` 文件，请使用 `phpinfo()` 函数来发现它的位置。需要快速回顾一下？我们之前 第 1 章 中介绍过这一点。


    一旦你找到了正确的文件，用你的文本编辑器打开它，你将看到大量的配置选项。下面将讨论的其中几项将帮助提高应用程序的安全性。


    ### allow_url_include


    ```

    allow_url_include=Off

    ```


    默认情况下，标准的 PHP 安装将 `allow_url_include` 设置为关闭状态，但某些托管提供商可能会开启它，因此检查你的 `php.ini`
    文件是非常重要的。


    当 `allow_url_include` 关闭时，PHP 只能加载和执行存在于 Web 服务器文件系统上的其他文件。然而，如果你激活了 `allow_url_include`，你就可以通过
    URL 包含额外的文件。这看起来是一个有趣且可能实用的功能，但这样做会让你的应用程序面临恶意代码注入攻击的风险。因此，强烈建议保持此选项关闭状态。


    ### 注意：代码注入


    `code injection`（代码注入）是用于描述在未经许可的情况下将外部来源的意外代码放入 PHP 脚本的术语。关于代码注入的更多信息，请参考以下外部资源：


    *   [`www.theserverpages.com/articles/webmasters/php/security/Code_Injection_Vulnerabilities_Explained.html`](http://www.theserverpages.com/articles/webmasters/php/security/Code_Injection_Vulnerabilities_Explained.html)


    *   [`www.owasp.org/index.php/Code_Injection`](https://www.owasp.org/index.php/Code_Injection)


    另一个相关的设置为 `allow_url_fopen`，它也应该被关闭。


    ### open_basedir


    ```

    open_basedir=/path/to/web/directory

    ```


    与 `allow_url_include` Go，`open_basedir` 也可以帮助限制脚本在服务器上允许加载的文件。通过 `open_basedir`，你可以设置可以从哪个目录加载文件，并确保任何脚本都无法加载该目录之外的文件。


    攻击者可能会尝试的一种方法是访问基于 Linux 的 Web 服务器上的 `/etc/password` 文件，该文件列出了服务器上注册的用户账户。如果你的
    PHP 应用程序从 `/var/www` 运行，你可以将 `open_basedir` 设置为 `"/var/www/"`。一旦设置，`www` 目录之外的文件将无法包含在你的脚本中，从而阻止攻击者的行动。当你的应用程序上线时启用此选项，可以为你的服务器增加额外的安全级别。


    ### 错误管理


    在项目的开发阶段，让 PHP 在代码中遇到任何错误或问题时向你提供反馈是有用的。然而，一旦你的应用程序部署，你真的希望这些错误越少越其微。开发者会希望向用户隐藏
    PHP 错误消息，因为如果看到这些错误，可能会产生一种不可靠的感觉，影响客户的信心。


    重要的是，错误信息还可能暴露有关你系统配置的关键信息，黑客可以利用这些信息。PHP 的默认错误消息可能包含如应用程序的安装路径、数据库连接详情、数据库列名以及其他脚本细节（如类名、对象
    ID 和变量名）。


    为了确保这些信息对用户不可见，请将 `php.ini` 中的 `display_errors` 选项设置为 `off`。这告诉 PHP 在运行时发生错误时不要显示错误。这并不意味着
    PHP 会忽略错误——而是它不会在浏览器中显示它。


    你仍然可以告诉 PHP 将任何错误保存到特定的日志文件中，你作为应用程序开发者可以私下参考该文件。要实现这一点，请将 `error_log` 选项设置为所需错误日志文件的路径。


    开启 `log_errors` 选项也是一个好主意。这确保了 PHP 将记录错误、保存错误数据，并避免所有在屏幕上渲染错误消息的可能性。


    设置这些选项后，PHP 将为你私下创建错误日志，以便在需要时参考。


    ### 提高 Session 安全性


    正如在上一章 中讨论的，Session 是临时存储数据（例如用户是否已登录）的手段。我们在博客应用程序中使用了 Session，正如你可能已经注意到的，它们提供了实用的功能。Session
    通常只包含少量数据，但任何与获取应用程序访问相关的数据对任何攻击者或黑客来说都可能价值连城。在默认情况下，Session 存储有关你的应用程序用户的信息，并使用
    cookie 来帮助 PHP 等编程语言将每个用户与正确的会话信息匹配。遗憾的是，Session 维持了攻击者想要实现的登录状态，这使得 Session 成为黑客最有吸引力的目标之一。


    黑客尝试劫持 Session 的一种方法是访问 Session 数据本身。幸运的是，`php.ini` 再次出现，并允许我们通过 `session.save_path`
    选项更改 Session 数据存储的位置：


    ```

    session.save_path = /var/lib/php

    ```


    上面的示例是默认设置。如果你更改了位置，它将让黑客迷失方向，因为他们需要弄清楚你将 Session 数据移动到了哪里。


    重要的是，当你更改此路径时，要确保你的 Web 服务器可以对新位置进行读写操作。未能做到这一点，你的 PHP 将无法正常使用 Session。


    黑客还经常尝试通过被称为[跨站脚本](https://en.wikipedia.org/wiki/Cross-site_scripting)（简称 XSS）的技术来利用你的应用程序和服务器，这允许他们向你的应用程序注入恶意
    JavaScript 代码。Session 经常是 XSS 攻击的目标，如果成功，它们可以造成各种破坏，从键盘记录（记录所有按键）到强制显示非法广告。为了帮助防止
    XSS 攻击，你可以使用选项：


    ```

    session.cookie_httponly = 1

    ```


    当此选项设置为 `1` 时（大多数 `php.ini` 文件的默认值），将限制 JavaScript 访问 PHP 创建的 cookie。如果你不打算让 JavaScript
    使用任何 cookie 数据，强烈建议开启此选项，因为这有助于控制从客户端计算机到你的应用程序及其托管服务器的数据。


    关于 `php.ini` 内部选项以及如何让 PHP 更安全的更多信息，请参考以下来源：


    *   [`www.sitepoint.com/a-tour-of-php-ini/`](http://www.sitepoint.com/a-tour-of-php-ini/)


    *   [`php.net/manual/en/ini.php`](http://php.net/manual/en/ini.php)


    *   [`www.madirish.net/?article=229`](http://www.madirish.net/?article=229)


    ## 验证提交的数据


    PHP 应用程序最大的威胁并不是缺乏来自攻击者的保护，而是用户提交的糟糕数据的威胁。用户是故意还是无意提交错误数据通常很难判断，但格式错误的数据会损害你的应用程序。


    确保用户知道他们应该提交什么类型的数据是非常重要的。对于你提示的数据类型使用正确的输入元素，并确保标签清楚地指示预期内容。


