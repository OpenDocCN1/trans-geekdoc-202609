    \ your home computer. PHP can also be used with your own private web server, which\
    \ can then be accessed across the Internet.\n\nLocal servers on home computers\
    \ are often set up using the popular LAMP (Linux, Apache, MySQL, and PHP), MAMP\
    \ (Mac OS X, Apache, MySQL, and PHP), and WAMP (Windows, Apache, MySQL, and PHP)\
    \ stacks, all of which are available for free download.\n\nThese stacks normally\
    \ comprise of a one-click install program that installs a standard web server\
    \ setup with default configurations. This allows web developers to set up a local\
    \ environment that is almost identical to the one provided by their web hosting\
    \ company. Developers will often start building websites and applications using\
    \ a local server due to the ease with which they can access working files, and\
    \ do without the additional time and hassle of uploading files to an online server.\
    \ In addition, this method means there's no worry that development code will accidentally\
    \ leak out onto the live site, and developers can also avoid using hosting bandwidth\
    \ for file transfers.\n\n## Getting Started\n\nGetting a local server on your\
    \ home computer may seem like it could be a complex task, but it's generally fairly\
    \ simple: a one-click install. There are several options available, depending\
    \ on which operating system you use:\n\n### Windows\n\nWith Windows, you have\
    \ a choice of two popular and powerful installation programs. The first is [WAMP](http://www.wampserver.com/en/),\
    \ a Windows program that installs Apache, PHP, MySQL, and phpMyAdmin on your computer\
    \ (**phpMyAdmin** is a convenient web-based interface for working with MySQL databases).\
    \ The other is [XAMMP](http://www.apachefriends.org/en/xampp.html3) from Apache\
    \ Friends, a distribution containing Apache, MySQL, PHP, Perl, and phpMyAdmin.\n\
    \nFor the purposes of this book, we'll cover setup using WAMP only, but the setup\
    \ of XAMMP follows a similar process, if you choose to install that package instead.\n\
    \nYour first step is to [download WAMP](http://www.wampserver.com/en/#download-wrapper).\
    \ You'll be given multiple download options, so select the version that corresponds\
    \ to your computer's processor and operating system version and is \"PHP 5.4 2.4\"\
    .\n\n### Note: Which Processor Do I Have?\n\nTo find out which processor you have,\
    \ look for your \"My Computer\" icon or alternatively you can head to Control\
    \ Panel and select System from the options available. Right-click on it and look\
    \ for the option System Type which should state whether your computer uses a 32\
    \ or 64-bit operating system.\n\n### Important: Visual C++\n\nYou also need to\
    \ install Visual C++ 2010 SP1 Re distributable Package x86 or x64 on your computer.\
    \ The web page will give you links that correspond to your operating system type\
    \ (32 or 64-bit) and it's highly recommended that you download and install the\
    \ package on your computer before installing WAMP.\n\nWhen the download is complete,\
    \ run the installer program.\n\nOnce WAMP has been installed, you should see a\
    \ new icon in the Windows system tray. The icon for WAMP changes between three\
    \ different colors that represent the current status of its services:\n\n*   Red\
    \ – Both Apache and MySQL are offline. This could be because they haven't been\
    \ told to start yet or a fatal configuration issue is preventing them from starting.\n\
    \n*   Orange – One of the services failed to start. This usually indicates a minor\
    \ configuration problem, such as not loading an add-on library correctly or that\
    \ a default port is in use by another program. It's highly recommended that you\
    \ seek help from the product's help desk or forums should this happen.\n\n*  \
    \ Green – The services are running and no errors have occurred; all is good.\n\
    \nYou can left-click on the WAMP icon and you will be presented with many options\
    \ for interacting with the services. These options allow you to:\n\n*   Manage\
    \ your Apache and MySQL services\n\n*   Switch online/offline\n\n*   Install and\
    \ switch Apache, MySQL, and PHP releases\n\n*   Access your log files\n\n*   Access\
    \ your settings files\n\n*   Create aliases\n\nRight-clicking on the icon allows\
    \ you to exit the program, change the program's language, and go to help pages\
    \ located on WAMP's website. It's recommended that if you are unsure of anything\
    \ related to the WAMP stack to seek advice from the help files on the WAMP website\
    \ using the right-click option on the icon.\n\n### Tip: Port 80 Problems\n\nThe\
    \ most common issue with WAMP is that port 80 (the port used to connect to the\
    \ Apache server) may already be in use by another program. If you're running Skype\
    \ while trying to start up WAMP, for example, you may encounter this error because\
    \ Skype also uses port 80. To fix it, it's recommended that you close Skype completely\
    \ and then restart WAMP. There's a solution to this issue on [Stack Overflow](http://stackoverflow.com/a/4705033).\n\
    \nTo check that the local server is installed and configured correctly, open up\
    \ your web browser and in its address bar type `localhost` or `127.0.0.1`. You\
    \ should be greeted with the WAMP home page.\n\n ![The WAMP home page](figures/wampsplash.png)\n\
    \nFigure 1.1. The WAMP home page\n\n### Mac OS X\n\nFor Mac users, there is a\
    \ simple one-click application for setting up a local server with PHP on your\
    \ computer called MAMP. As with Windows, you can also use XAMMP, however MAMP\
    \ is the more popular choice because its development is focused on providing a\
    \ setup that's perfect for those wishing to develop websites using PHP.\n\nFirst,\
    \ you need to download the application from the [MAMP website](http://www.mamp.info/en/index.html)\
    \ and then, once the file has downloaded, open the .pkg file which should initiate\
    \ the installation process.\n\n### Note: MAMP Pro"
