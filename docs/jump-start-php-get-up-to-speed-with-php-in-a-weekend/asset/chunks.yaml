  trans: "\n在上述描述的方法中，我们正在加载一些模板文件——因此我们需要着手创建它们。现在，我们可以从零开始构建模板文件，但出于本项目的考虑，我们将使用\
    \ [Twitter Bootstrap 框架](http://twitter.github.io/bootstrap/index.html) 来设计和构建它们。Bootstrap\
    \ 非常适合让 Web 应用程序的 UI 元素快速运行起来，让你专注于构建一个优秀应用程序后端的任务。\n\n如果你擅长自己设置 Bootstrap，请根据你的需要将其实现到项目中。如果你不确定操作流程，别担心——从本书的代码归档中的\
    \ `includes` 文件夹中复制所有内容，你很快就能运行起 Twitter Bootstrap 了。\n\n回到我们的项目，在 `frontend`\
    \ 文件夹下的 `templates` 文件夹中创建两个新文件，并命名为 `list-posts.php` 和 `view-post.php`。在 `list-posts.php`\
    \ 中添加以下代码：\n\n```php\n<?php require_once 'includes/temps/header.php'; ?>\n<?php\
    \ foreach ($posts as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']);\
    \ ?></h3>\n        <p><?php echo implode(' ', array_slice(explode(' ', \nstrip_tags($post['content'])),\
    \ 0, 10)); ?> [...]</p>\n        <a href=\"<?php echo $this->base->url.\"/?id=\"\
    .$post['id'];\n ?>\" class=\"btn btn-primary\">Read More</a>\n    <hr/>\n<?php\
    \ endforeach; ?>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\n\
    接下来，在 `view-post.php` 文件中添加以下代码：\n\n```php\n<?php require_once 'includes/temps/header.php';\
    \ ?>\n<br/>\n<a href=\"<?php echo $this->base->url; ?>\" class=\"btn btn-primary\"\
    >\nReturn to Post List</a>\n<?php foreach ($posts as $post): ?>\n    <h3>Post\
    \ #<?php echo htmlspecialchars($post['id']); ?></h3>\n        <?php echo htmlspecialchars($post['content']);\
    \ ?>\n    <hr/>\n<?php endforeach; ?>\n<?php require_once 'includes/temps/footer.php';\
    \ ?>\n```\n\n我们的 `list-post.php` 文件遍历了从数据库中收集的许多文章，为文章内容创建一个短小的摘要，并创建一个指向阅读每篇文章的链接。我们的\
    \ `view-post.php` 文件显示从数据库加载的单个文章的标题和正文。\n\n`list-post.php` 和 `view-post.php`\
    \ 看起来都非常简单。然而，你可能在 `list-posts.php` 文件中注意到一些不寻常且复杂的代码：\n\n```php\nimplode(' ',\
    \ array_slice(explode(' ', \nview-post.phpstrip_tags($post['content'])), 0, 10));\n\
    ```\n\n此行代码结合了多个不同的 PHP 函数，提取出文章内容的前十个单词，以自动创建一个显示在我们的文章列表中的摘要字符串。`strip_tags()`\
    \ 函数移除内容中的任何 HTML 标签，`explode()` 函数在函数每次遇到内容中的空格时都会创建一个新数组和键。接下来，使用 `array_slice()`\
    \ 函数获取由 `explode()` 函数创建的数组中的前十个键。传递给 `array_slice()` 函数的参数 `0` 表示它应该从 `0` 开始计数，并在达到\
    \ `10` 时停止。此外，它还接收了由 `explode()` 函数创建的数组。最后，我们使用 `implode()` 函数将那十个数组值合并为一个字符串。\n\
    \n关于 PHP 中这些函数的更多细节以及它们用途的深入概述，请查看以下资源：\n\n* [`php.net/manual/en/function.strip-tags.php`](http://php.net/manual/en/function.strip-tags.php)\n\
    * [`php.net/manual/en/function.explode.php`](http://php.net/manual/en/function.explode.php)\n\
    * [`php.net/manual/en/function.array-slice.php`](http://php.net/manual/en/function.array-slice.php)\n\
    * [`php.net/manual/en/function.implode.php`](http://php.net/manual/en/function.implode.php)\n\
    \n我们示例应用程序的下一阶段是创建管理员面板和登录面板。我们将后创建。打开 `includes` 目录下的 `login.php` 文件。它位于项目目录的主目录下。从在构造方法中开始添加以下内容：\n\
    \n```php\npublic function __construct() {\n    $this->ksdb = new Database;\n \
    \   $this->base = (object) '';\n    $this->base->url = \"http://\".$_SERVER['SERVER_NAME'];\n\
    \    $this->index();\n}\n```\n\n本质上，我们的构造方法设置了在整个类中需要的对象和变量。接下来我们需要在 `index()`\
    \ 方法中添加：\n\n```php\npublic function index() {\n    if ($_SERVER['REQUEST_METHOD']\
    \ === 'POST') {\n        $this->validateDetails();\n    } elseif (!empty($_GET['status'])\
    \ && $_GET['status'] == \n'inactive') {\n        $error = 'You have been logged\
    \ out due to inactivity.\n Please log in again.';\n    }\n    require_once 'admin/loginform.php';\n\
    }\n```\n"
- fmt: "\nNow that we have our login class created, we just need to create a template\
    \ for our login form. Create a directory named `templates` in the admin folder,\
    \ and add a new PHP file called `loginform.php`.\n\n### Note: A Note on Structure\n\
    \nIt's worth taking the time to create a new header and footer template file for\
    \ the admin section. Separating the front-end header and footer template files\
    \ will save complication when differentiating between the front-end and the admin\
    \ panel. Please see the project's file structure for more details about setting\
    \ this up.\n\nIn the `loginform.php` file, add the following code:\n\n```php\n\
    <?php require_once 'includes/temps/header.php'; ?>\n<br/>\n<?php if (!empty($error)):\
    \ ?>\n    <div class=\"alert alert-error\">~<?php echo $error; ?>div>\n<?php endif;\
    \ ?>\n<br/>\n<form action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\"\nmethod=\"post\" class=\"form-horizontal offset2\">\n    <h3>Admin Login</h3>\n\
    \    <div class=\"control-group <?php echo (!empty($error)?\n'error': ''); ?>\"\
    >\n        <label class=\"control-label\" for=\"inputEmail\">Username\n</label>\n\
    \        <div class=\"controls\">\n            <input type=\"text\" name=\"username\"\
    \ id=\"inputEmail\" \nplaceholder=\"Username\">\n        </div>\n    </div>\n\
    \    <div class=\"control-group <?php echo (!empty($error)? 'error':\n'')); ?>\"\
    >\n        <label class=\"control-label\" for=\"inputPassword\">Password\n</label>\n\
    \        <div class=\"controls\">\n            <input type=\"password\" name=\"\
    password\" \nid=\"inputPassword\" placeholder=\"Password\">\n        </div>\n\
    \    </div>\n    <div class=\"control-group\">\n        <div class=\"controls\"\
    >\n            <button type=\"submit\" class=\"btn\">Sign in</button>\n      \
    \  </div>\n    </div>\n</form>\n<?php require_once 'includes/temps/footer.php';\
    \ ?>\n```\n\nIn this file, we've created a form, which prompts the user for a\
    \ username and a password to log in to the admin section of our application. When\
    \ this form is submitted, it will send its data to the same file our `login` class\
    \ will use to handle the login process. It'll then send back any errors, along\
    \ with the user, to this login file.\n\nNow that we have our login panel and login\
    \ class created, we just need to create the admin panel and its required classes.\
    \ In the includes directory again, open the file `admin.php` file and add the\
    \ following:\n\n```php\nclass Adminpanel {\n    public function __construct()\
    \ {\n        $this->ksdb = new Database;\n        $this->base = (object) '';\n\
    \        $this->base->url = \"http://\".$_SERVER['SERVER_NAME'];\n    }\n}\n```\n\
    \nHere we've added code to the constructor in the `Adminpanel` class, which contains\
    \ objects and variables we're going to use throughout the `admin.php` file. This\
    \ is the main class that the other classes in the admin file are going to extend.\n\
    \nNext, we are going to add code to the `listPosts()` method:\n\n```php\npublic\
    \ function listPosts() {\n    $posts = $return = array();\n    $query = $this->ksdb->db->prepare(\"\
    SELECT * FROM posts\");\n    try {\n        $query->execute();\n        for ($i\
    \ = 0; $row = $query->fetch(); $i++) {\n            $return[$i] = array();\n \
    \           foreach ($row as $key => $rowitem) {\n                $return[$i][$key]\
    \ = $rowitem;\n            }\n        }\n    } catch (PDOException $e) {\n   \
    \     echo $e->getMessage();\n    }\n    $posts = $return;\n    require_once 'templates/manageposts.php';\n\
    }\n```\n\nThe `listPosts()` method is almost exactly the same as the `getPosts()`\
    \ method from the `posts.php` file: We load all the posts from the posts table\
    \ in the database and check the query. If the check is OK, we get the data from\
    \ the database and add it to the `$return` array. If not, we show the database\
    \ error. Finally, we load the `manageposts.php` template file.\n\nNow, we move\
    \ onto the `addPost()` method:\n\n```php\npublic function addPost() {\n    require_once\
    \ 'templates/newpost.php';\n}\n```\n\nThis simply loads the `newpost.php` template.\n\
    \nFinally, we add to the `savePost()` method:\n\n```php\npublic function savePost()\
    \ {\n    $array = $format = $return = array();\n    if (!empty($_POST['post']))\
    \ {\n        $post = $_POST['post'];\n    }\n    if (!empty($post['content']))\
    \ {\n        $array['content'] = $post['content'];\n        $format[] = ':content';\n\
    \    }\n    $cols = $values = '';\n    $i = 0;\n    foreach ($array as $col =>\
    \ $data) {\n        if ($i == 0) {\n            $cols .= $col;\n            $values\
    \ .= $format[$i];\n        } else {\n            $cols .= ',' . $col;\n      \
    \      $values .= ',' . $format[$i];\n        }\n        $i++;\n    }\n    try\
    \ {\n        $query = $this->ksdb->db->prepare(\"INSERT INTO posts \".$cols.\"\
    ) VALUES (\".$values.\")\");\n        for($c=0;$c<$i;$c++){\n            $query->bindParam($format[$c],\
    \ $array[$c]);\n        }\n        $query->execute();\n        $add = $query->rowCount();\n\
    \    } catch (PDOException $e) {\n        echo $e->getMessage();\n    }\n    $query->closeCursor();\n\
    \    if (!empty($add)) {\n        header(\"Location: posts.php\");\n    } else\
    \ {\n        $status = array('error' => 'There has been an error saving your post.');\n\
    \    }\n}\n```\n\nThe `savePost()` method uses the PDO functionality to prepare\
    \ an `INSERT` SQL query to save data to the `posts` table. We then return a status\
    \ depending on whether the data saved or not. All we have to do now is create\
    \ a couple more templates. We'll add two PHP files to the `templates` folder.\
    \ The first file, `manageposts.php`, is where we see a list of all the posts saved\
    \ in our database, while the other, `newpost.php`, is where we have a very simple\
    \ form in which we can enter data to create a new post. In the `manageposts.php`\
    \ file, add the following code:\n\n```php\n<?php require_once '_inc/header.php';\
    \ ?>\n<a href=\"<?php echo $this->base->url; ?>/posts.php?action=create\" class=\"\
    btn btn-info\">Create Post</a>\n<table>\n    <thead>\n        <tr>\n         \
    \   <td>Post Title</td>\n            <td>Post Content</td>\n            <td>Actions</td>\n\
    \        </tr>\n    </thead>\n    <tbody>\n    <?php foreach($posts as $post):\
    \ ?>\n        <tr>\n            <td><h3>Post #<?php echo htmlspecialchars($post['id']);\
    \ ?></h3></td>\n            <td><p><?php echo implode(' ', array_slice(explode('\
    \ ', strip_tags($post['content'])), 0, 10)); ?> [...]</p></td>\n            <td>\n\
    \                <a href=\"<?php echo $this->base->url; ?>/posts.php?id=<?php\
    \ echo $post['id']; ?>&action=edit\" class=\"btn btn-primary\">Edit Post</a>\n\
    \                <a href=\"<?php echo $this->base->url; ?>/posts.php?id=<?php\
    \ echo $post['id']; ?>&action=delete\" class=\"btn btn-primary\">Delete Post</a>\n\
    \            </td>\n        </tr>\n    <?php endforeach; ?>\n    </tbody>\n</table>\n\
    <?php require_once '_inc/footer.php'; ?>\n```\n\nNext, open up the `newpost.php`\
    \ file and add the following code:\n"
