    \ PHP. However, you may find yourself using attributes and tags that haven't been\
    \ listed here. The elements we've discussed cover the basics, so if you're hungry\
    \ for more information on forms, feel free to hit up these external references:\n\
    \n*   [http://reference.sitepoint.com/html/elements-form](http://reference.sitepoint.com/html/elements-form)\n\
    \n*   [http://www.tizag.com/htmlT/forms.php](http://www.tizag.com/htmlT/forms.php)\n\
    \n*   [http://www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm](http://www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm)\n\
    \n## POST and GET\n\nEach form's `method` attribute allows only two options, `POST`\
    \ and `GET`. As we know, PHP has some special predefined variables such as the\
    \ `$_SESSION` variable. PHP also has two other predefined variables which are\
    \ designed to collect data ultimately sent by HTML forms, `$_POST` and `$_GET`,\
    \ but these variables can also be used in other ways—something we'll take a look\
    \ at later on.\n\nFor now, let's illustrate the difference between `POST` and\
    \ `GET` with an example. Create some new files in our experiments folder: form.php\
    \ and collect.php. In our form.php file, add the following code:\n\n```\n<html>\n\
    <body>\n    <form method=\"post\" action=\"collect.php\">\n        <h1>Form #1</h1>\n\
    \        <input name=\"data\" placeholder=\"enter a string\" \n↵type=\"text\"\
    \ />\n        <button type=\"submit\">submit</button>\n    </form>\n    <form\
    \ method=\"get\" action=\"collect.php\">\n        <h1>Form #2</h1>\n        <input\
    \ name=\"data\" placeholder=\"enter a string\" \n↵type=\"text\" />\n        <button\
    \ type=\"submit\">submit</button>\n    </form>\n</body>\n</html>\n```\n\nDone\
    \ that? Good. Now go ahead and add the following code to the collect.php file:\n\
    \n```\n<?php\nif (!empty($_POST['data'])) {\n    echo 'The following string was\
    \ sent from form #1: ' . \n↵$_POST['data'];\n} elseif (!empty($_GET['data']))\
    \ {\n    echo 'The following string was sent from form #2: ' . \n↵$_GET['data'];\n\
    }\n```\n\nNext, open form.php in your browser, type something into the input field\
    \ in Form #1 and hit submit. You should see something like [Figure 4.2](#ch04.html#form1out\
    \ \"Figure 4.2. The result of submitting the form\"):\n\n ![Entering data into\
    \ our form](figures/form1.png)\n\nFigure 4.1. Entering data into our form\n\n\
    \ ![The result of submitting the form](figures/form1submit.png)\n\nFigure 4.2. The\
    \ result of submitting the form\n\nIf you fill out Form #2, as shown in [Figure 4.3](#ch04.html#form2\
    \ \"Figure 4.3. Entering data into Form #2\"), and hit submit, you should see\
    \ something similar to [Figure 4.4](#ch04.html#form2submit \"Figure 4.4. The result\
    \ of submitting the form\"):\n\n ![Entering data into Form #2](figures/form2.png)\n\
    \nFigure 4.3. Entering data into Form #2\n\n ![The result of submitting the form](figures/form2submit.png)\n\
    \nFigure 4.4. The result of submitting the form\n\nThe main difference between\
    \ the two forms is shown if you look at the URL you're redirected to when you\
    \ submit Form #2—as shown in [Figure 4.5](#ch04.html#form2url \"Figure 4.5. The\
    \ URL the form redirects to after submission\").\n\n ![The URL the form redirects\
    \ to after submission](figures/form2url.png)\n\nFigure 4.5. The URL the form redirects\
    \ to after submission\n\nAs you can see, the string we entered into Form #2 has\
    \ been placed into the URL, along with some other pieces of code. This is what\
    \ we call a **URL variable** and it results from a form submitted with the `GET`\
    \ method. The `POST` method, on the other hand, sends the data between the pages\
    \ silently, behind the scenes. Using this method, the user sees no evidence of\
    \ their data, except when the string is displayed in their browser by the collect.php\
    \ file.\n\nBecause the data is present in the URL as a variable before being submitted\
    \ to the collect.php script, the `GET` method is less secure than the `POST` method.\
    \ As such, if you have hidden input fields in your form—such as identification\
    \ data or authorization data—you would want to use the `POST` method rather than\
    \ the `GET` method. In fact, in most cases when developing a web app, you will\
    \ want to use the `POST` method for transferring data. This is because, with the\
    \ `GET` method, any data can be injected into the URL variable.\n\nFor example,\
    \ if we navigate to the collect.php file in our browser, we should see a blank\
    \ screen. Now in the URL bar, after collect.php let's add `?data=hello%20world%20I%20have%20been%20injected`.\
    \ If we then load this new URL, we can see that the injected data in the URL is\
    \ being displayed on screen. Now, our example is not that alarming and may seem\
    \ kind of cool, but actually this is a tame example of a potentially risky issue.\n\
    \nImagine that we have a form that looks like [Figure 4.6](#ch04.html#scenarioform\
    \ \"Figure 4.6. A form at risk of tampering\").\n\n ![A form at risk of tampering](figures/scenarioform.png)\n\
    \nFigure 4.6. A form at risk of tampering\n\nWhen this form is submitted, it sends\
    \ data to a database. The form also contains a hidden input element that holds\
    \ data detailing the user's ID in the database. We have used a `GET` method for\
    \ this form so, when it's submitted, our browser would show a URL like:\n\n```\n\
    http://www.ourdomain.com/savedata.php?userid=1&name=user&bio=\n↵hello%20world\n\
    ```\n\nCan you see the risk? A malicious person could change the `userid` URL\
    \ variable to a different user's identifier, and alter the `name` or `bio` URL\
    \ variable. The result? That user's information will have been changed without\
    \ them authorizing it, or even knowing it's taken place.\n\n## Form Action with\
    \ PHP\n\nWe've looked at some simple examples of using forms, and the basic use\
    \ of `$_POST` and `$_GET`, but there's more to processing forms with PHP than\
    \ just these two variables."
