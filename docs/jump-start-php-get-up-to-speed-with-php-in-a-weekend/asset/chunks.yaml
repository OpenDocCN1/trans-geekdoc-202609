    \      }\n        try {\n            if (!empty($id)) {\n                $query\
    \ = $this->db->prepare(\"SELECT * FROM posts \n↵WHERE id = ?\");\n           \
    \     $params = array($id);\n                $template = 'single-post.php';\n\
    \            } else {\n                $query = $this->db->prepare(\"SELECT *\
