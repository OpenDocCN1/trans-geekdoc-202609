    \ OS X)\n\n    *   A very user-friendly editor with a wide range of functionality.\n\
    \n*   [Notepad++](http://www.notepad-plus-plus.org/) – (Windows)\n\n    *   A\
    \ very popular free editor.\n\nOnce you have chosen an editor that is right for\
    \ you, open index,php and you can start to write some PHP code to the file. Type\
    \ in the following code and then save the file:\n\n```\n<?php echo \"Hello World\"\
    ; ?>\n```\n\nLet's run this code. Open up a web browser and, in the browser's\
    \ address bar, type `http://localhost/my_project/index.php`. You should see something\
    \ similar to [Figure 1.6](#ch01.html#helloworld \"Figure 1.6. Hello, world!\"\
    ).\n\n ![Hello, world!](figures/helloworld.png)\n\nFigure 1.6. Hello, world!\n\
    \nCongratulations! You've just written your first piece of PHP code! As you can\
    \ see, the code displays the phrase \"Hello World\" in the web browser, but what\
    \ exactly have you typed into your PHP file? Let's break down our line of code:\n\
    \n*   `<?php` : This is called the opening tag. It tells your server that the\
    \ code that follows is intended to be interpreted as PHP, and that the server\
    \ should use the PHP engine to render the code. This tag must be entered every\
    \ time you want to use PHP code in your file.\n\n*   `echo \"Hello World\";` :\
    \ `echo` is a basic PHP construct which tells PHP that what follows the `echo`\
    \ command is something you want to appear in the browser. Quotation marks are\
    \ added around the text you want to display on screen. Also, you add the important\
    \ semicolon afterward which signals that your `echo` statement is finished.\n\n\
    *   `?>` : This is the closing tag for PHP and tells the server to stop rendering\
    \ PHP code. The closing tag is not always used. Leaving the code \"unclosed\"\
    \ can prevent unintended content from being sent to the browser. Skipping the\
    \ closing tag when you don't need it can avoid problems which may crop up as you\
    \ start writing more complex PHP code. Further on in this book you'll see code\
    \ that doesn't have a closing PHP tag. This tag has been omitted on purpose.\n\
    \n### Important: Use Your Semicolons!\n\nIt's very important to remember to add\
    \ a semicolon at the end of all PHP statements because PHP will not know where\
    \ one statement ends and the next statement begins without it.\n\nPHP files also\
    \ let you combine PHP code with regular HTML. If you combine PHP and HTML together\
    \ you can create really nice looking web pages that contain dynamic and complex\
    \ data, which HTML cannot process and handle on its on.\n\nHere's a quick example\
    \ of HTML and PHP working together:\n\n```\n<!DOCTYPE html>\n<head>\n    <title>PHP\
    \ and HTML working together</title>\n    </head>\n    <body>\n      <h1><?php\
    \ echo 'This is a H1 tag with PHP data'; ?></h1>\n      <p><?php echo 'This is\
    \ a P tag with PHP data also'; ?></p>\n    </body>\n</html> \n```\n\nIf you change\
    \ the contents of the index.php file to the example above and navigate back to\
    \ `http://localhost/my_project/index.php`, you'll see the HTML code display all\
    \ the code processed by PHP correctly in your browser.\n\n## PHP Variables\n\n\
    Let's take our code to the next level and explore the world of variables. A variable\
    \ represents a place in the computer's memory where we can temporarily store bits\
    \ of information. We can assign some piece of data to a variable (place the data\
    \ in memory) and use that variable throughout our script. Each time PHP sees the\
    \ variable in our code, it knows to access the data that it represents. The data\
    \ we assign to a variable can be anything from a simple string of text such as\
    \ \"Hello World\", or numbers like \"1234\", through to more complex data structures,\
    \ which we'll cover shortly.\n\nVariable names are always prefixed with the `$`\
    \ symbol. Their names cannot contain spaces and must only contain letters (lower\
    \ and upper-case), numbers, and underscores. In addition, the first character\
    \ in the name after the `$` must be a letter or an underscore. Acceptable variable\
    \ names could be `$myAwesomeVariable`, or even `$my_Awesome_Variable_1`.\n\nIt's\
    \ considered good practice to give your variables meaningful names so that if\
    \ another developer reads the code you've written they have a clue as to what\
    \ data it represents. For example, if we wanted a variable to hold data about\
    \ someone's name we could call our variable `$personName`.\n\n### Note: Use CamelCase\n\
    \nIf your variable has more than one word in its name, it's common practice to\
    \ give the start of each word a capital letter. This improves readability when\
    \ scanning through code.\n\nLet's take a look at a variable in use. Modify index.php\
    \ as follows:\n\n```\n<?php\n$myVar = 'Hello World, this is using a variable';\n\
    echo $myVar; \n```\n\nSo what have we coded here? First, we assigned a value (the\
    \ string \"Hello World, this is using a variable\") to the variable `$myVar`.\
    \ As this is the first time we have used the variable `$myVar`, it is created\
    \ automatically by PHP. Now if we write `$myVar` anywhere in the PHP script, PHP\
    \ will know to load the data we've assigned to that variable.\n\nIf you reload\
    \ the index.php file again in your browser, you should see that our string, \"\
    Hello World, this is using a variable\", is displayed.\n\nExpanding on this code,\
    \ let's go ahead and change index.php file again so it looks like this:\n\n```\n\
    <?php\n$myVar;\n$myVar = 'Hello World, this is using a variable';\necho $myVar;\n\
    $myVar = 'Goodbye World';\necho $myVar; \n```\n\nRefresh the page again and you\
    \ should see both sentences, \"Hello World, this is using a variable\" and \"\
    Goodbye World\", appear on the screen. This is because we can overwrite the data\
    \ in a variable at any time.\n\nThe example above also shows how PHP processes\
    \ and renders our code line-by-line from the top down. Our first `echo` statement\
    \ shows the first sentence because, at that point, the variable `$myVar` holds\
    \ that sentence. However, after the first `echo` statement, we overwrite it with\
    \ our second sentence. It's important to remember the \"top-down\" rule when you\
    \ are planning what you want your PHP script to do with certain pieces of data\
    \ at certain points within your script. If you overwrite a variable's data before\
    \ you plan to use it, that data will be gone and the script's output will be incorrect.\n\
    \nWe can store store more than just strings and sentences in our PHP variables;\
    \ let's have a quick look at the different types of data we can use:\n\n```\n\
    <?php\n$myVar = 0;                          // Integer\n$myVar = 3.14;       \
    \                // Float\n$myVar = \"Year to Date\";             // String\n\
    $myVar = true;                       // Boolean\n$myVar = array(250, 300, 325,\
    \ 475);  // Array  \n```\n\nIn the code above we have used a wide variety of variables\
    \ types, so let's have a quick run through them:\n\n*   Integer – Whole numbers.\
    \ These can be either positive or negative.\n\n*   Float – Numbers with decimal\
    \ places. These can also be either positive or negative.\n\n*   String – A mixture\
    \ of letters, numbers, and symbols. Strings are surrounded by quotes.\n\n*   Boolean\
    \ – One of two values: `true` or `false`. The value must not have any quotes as\
    \ this would turn it into a string.\n\n*   Array – A multi-level storage type,\
    \ similar to a table.\n\nFor a full run-down of what these types allow us to do\
    \ in PHP and examples of the amazing things we can do with them, check out a few\
    \ of these articles and tutorials:\n\n*   [http://www.php.net/manual/en/language.variables.basics.php](http://www.php.net/manual/en/language.variables.basics.php)\n\
    \n*   [http://www.sitepoint.com/variables/](http://www.sitepoint.com/variables)"
