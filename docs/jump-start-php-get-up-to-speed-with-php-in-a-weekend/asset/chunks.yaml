  trans: "\n首先，让我们快速查看一下 `PHP_SELF`。正如我们讨论过的，PHP 有一些特殊的预定义变量，我们可以在整个脚本中使用它们来完成一些非常特殊的功能。然而，其中一组变量比其他的更为特殊。它们位于\
    \ `$_SERVER` 数组中，该包含了服务器和执行环境的信息，例如标头、路径以及服务器上的脚本位置。我们可以像访问任何其他数组一样访问这些数据。`$_SERVER`\
    \ 数组的键之一就是 `PHP_SELF`，它存储了相对于文档根目录的当前访问的 PHP 文件信息。\n\n为了看到这个 `PHP_SELF` 值的实际效果，让我们在实验文件夹中创建一个名为\
    \ `self.php` 的新文件。在该文件中添加以下代码：\n\n```php\n<?php\necho $_SERVER['PHP_SELF'];\n\
    ```\n\n现在，当你在浏览器中查看此文件时，你应该能看到相对于服务器文档根目录的 `self.php` 文件的 URL。\n\n在我们的情况下，这可能是类似于\
    \ `\"localhost/experiments/self.php\"` 的内容。我们可以在表单的 `action` 属性中使用 `'PHP_SELF'`，使其提交到\
    \ `self.php`，在那里我们可以使用 `$_POST` 或 `$_GET` 变量检查表单是否传输了数据，然后执行代码进一步处理这些数据。\n\n这是一个示例：\n\
    \n```php\n<?php\nif (!empty($_POST['data'])) {\n    echo 'Form has been submitted';\n\
    \    // 处理来自表单数据的代码\n}\n?>\n<html>\n<body>\n    <form action=\"POST\" action=\"\
    <?php echo $_SERVER['PHP_SELF']; ?>\">\n        <input type=\"text\" name=\"data\"\
    \ type=\"text\" placeholder=\"Type in a string here\" />\n        <button type=\"\
    submit\">submit</button>\n    </form>\n</body>\n</html>\n```\n\n当表单被提交时，PHP 会检测到这一并并执行\
    \ `echo` 命令，这会在我们的浏览器中显示 \"Form has been submitted\" 字符串。`PHP_SELF` 变量对于那些需要提交到显示它们的同一个脚本、并在提交后执行代码处理数据的表单来说非常有用。\n\
    \n在使用 `PHP_SELF` 变量作为表单的 `action` 时，使用 `htmlspecialchars()` 函数过滤掉 URL 中任何不需要的字符非常重要，这有助于防止跨站脚本\
    \ (XSS) 攻击。要在上面的示例中实现此操作，你需要将 `form` 标签更改为：\n\n```html\n<form action=\"POST\"\
    \ action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']); ?>\">\n```\n"
- fmt: "\n```php\n<?php\nclass Posts {\n    public $db = '';\n    public function\
    \ __construct() {\n        $this->db = new PDO(\"mysql:host=localhost;dbname=testposts\"\
    , \n        \"dbuser\", \"dbpass\");\n        $this->db->setAttribute(PDO::ATTR_ERRMODE,\n\
    \        PDO::ERRMODE_EXCEPTION);\n        $this->index();\n    }\n    public\
    \ function index() {\n        $id = 0;\n        $posts = array();\n        $template\
    \ = '';\n        if (!empty($_GET['id'])) {\n            $id = $_GET['id'];\n\
    \        }\n        try {\n            if (!empty($id)) {\n                $query\
    \ = $this->db->prepare(\"SELECT * FROM posts \nWHERE id = ?\");\n            \
    \    $params = array($id);\n                $template = 'single-post.php';\n \
    \           } else {\n                $query = $this->db->prepare(\"SELECT * FROM\
    \ posts\");\n                $params = array();\n                $template = 'list-posts.php';\n\
    \            }\n            $query->execute($params);\n            for ($i = 0;\
    \ $row = $query->fetch(); $i++) {\n                $posts[] = array('id' => $row['id'],\
    \ 'content' =>\n$row['content']);\n            }\n        } catch (PDOException\
    \ $e) {\n            echo $e->getMessage();\n        }\n        $query->closeCursor();\n\
    \        $db = null;\n        require_once($template);\n    }\n}\n$posts = new\
    \ Posts();\n?>\n```\n\nWhat we've done here is is to create a new class, `Posts`.\
    \ At the start we initiated our `PDO` MySQL connection. We then move onto the\
    \ `index` method, in which we check to see if the URL has a URL variable and,\
    \ if so, we collect it from the URL, as well as attempt to collect the post with\
    \ the same `id` from our database. If there's no URL variable, we then just load\
    \ up all the posts in our database. Finally we then load the template which relates\
    \ to the database query we have executed.\n\nNext, we'll need to put together\
    \ our template files to display the data we've retrieved from the database. So\
    \ create two new files—one called `list-posts.php`, and the other `single-post.php`.\
    \ In `list-posts.php` add the following code:\n\n```html\n<h1>List of Blog Posts</h1>\n\
    <?php foreach ($posts as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']);\
    \ ?></h3>\n    <?php echo htmlspecialchars($post['content']); ?>\n    <a href=\"\
    http://localhost/experiments/posts.php?id=<?php echo \nhtmlspecialchars($post['id']);\
    \ ?>\">Read More</a>\n    <hr/>\n<?php endforeach; ?>\n```\nWait, I missed the\
    \ formatting in the code block.\n\nFinally in our `single-post.php` file add this\
    \ code:\n\n```php\n<?php foreach($posts as $post): ?>\n    <h1>Post #<?php echo\
    \ htmlspecialchars($post['id']); ?></h1>\n    <hr/>\n    <?php echo htmlspecialchars($post['content']);\
    \ ?>\n    <a href=\"http://localhost/experiments/posts.php>\nBack to Post List</a>\n\
    <?php endforeach; ?>\n```\n\nNow, if we navigate to our `posts.php` file we can\
    \ see there's a list of posts—or a single post in this case, as we currently only\
    \ have one in the database—each of which has a link for us to \"Read More\". Clicking\
    \ on this link takes us to the individual post page, and displays a different\
    \ template than the one used to view the full list of posts.\n\nThis is a very\
    \ short example, showing how the `$_GET` variable allows us to dynamically load\
    \ blog posts, and interact with our database. We could easily change the example\
    \ to use the `$_POST` variable instead. However, we wouldn't then be able to share\
    \ URLs referring to individual posts. Instead, the URL would only send visitors\
    \ to the list of posts where they must click on the \"Read More\" link themselves.\n\
    \nThis example leads us very nicely to the next section of this chapter where\
    \ we'll expand on this code snippet, along with the earlier ones, and begin to\
    \ build the real guts of our blog platform.\n\n## Building on our Platform\n\n\
    In this section, we're going to build on the example we've just created—which\
    \ displays a list of blog posts with links to read individual posts—and get that\
    \ working in our application.\n\nLet's take the existing code from above and tweak\
    \ it slightly. Modify the `posts.php` file in the includes directory our blog\
    \ platform folder so the constructor looks like this:\n\n```php\npublic function\
    \ __construct() {\n    parent::__construct();\n    $this->comments = new Comments();\n\
    \    if (!empty($_GET['id'])) {\n        $this->viewPost($_GET['id']);\n    }\
    \ else {\n        $this->getPosts();\n    }\n}\n```\n\nWith this code, our constructor\
    \ checks to see if there's a URL variable called `id.`. If there is, it proceeds\
    \ to collect the data from the variable, and pass it to the `viewPost()` method\
    \ within the `Blog` class. If there isn't a URL variable called `id`, the application\
    \ is, instead, told to load up all the posts from our database. This'll allow\
    \ visitors to see all of our posts, and then click on a link to view an individual\
    \ post.\n\nThe next change that we'll make to the `posts.php` file is to edit\
    \ is the `getPosts()` method:\n\n```php\npublic function getPosts() {\n    $id\
    \ = 0;\n    $posts = array();\n    $template = '';\n    if (!empty($_GET['id']))\
    \ {\n        $id = $_GET['id'];\n    }\n    try {\n        if (!empty($id)) {\n\
    \            $query = $this->db->prepare(\"SELECT * FROM posts \nWHERE id = ?\"\
    );\n            $params = array($id);\n            $template = 'single-post.php';\n\
    \        } else {\n            $query = $this->db->prepare(\"SELECT * FROM posts\"\
    );\n            $params = array();\n            $template = 'list-posts.php';\n\
    \        }\n        $query->execute($params);\n        for ($i = 0; $row = $query->fetch();\
    \ $i++) {\n            $posts[] = array('id' => $row['id'], 'content' =>\n$row['content']);\n\
    \        }\n    } catch (PDOException $e) {\n        echo $e->getMessage();\n\
    \    }\n    $query->closeCursor();\n    $db = null;\n    require_once($template);\n\
    }\n```\n\nThe `getPosts()` method is used to collect all the posts from the database\
    \ to create a list of them. It uses the `SELECT * FROM posts` database query.\
