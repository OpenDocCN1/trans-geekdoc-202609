    />\n        </div>\n    </</div>\n    <div class=\"control-group <?php echo (!empty($error)\
    \ ? 'error' :\n↵ ''); ?>\">\n        <label class=\"control-label\" for=\"name\"\
    >姓名</label>\n        <div class=\"controls\">\n            <input type=\"text\"\
    \ name=\"comment[fullname]\" id=\"name\" \nplaceholder=\"您的全名\"/>\n        </div>\n\
    \    </</div>\n    <div class=\"control-group <?php echo (!empty($error) ? 'error'\
    \ :\n↵ ''); ?>\">\n        <label class=\"control-label\" for=\"comment\">评论</label>\n\
    \        <div class=\"controls\">\n            <textarea id=\"comment\" name=\"\
    comment[context]\">\n</textarea>\n        </div>\n    </</div>\n    <div class=\"\
    control-group\">\n        <div class=\"controls\">\n            <button type=\"\
    submit\" class=\"btn\">提交评论\n</button>\n        </div>\n    </</div>\n</form>\n\
    </article>\n<?php require_once('includes/temps/footer.php'); ?>\n```\n\n在上面的代码中，我们添加了一个新表单，让访客可以在博客文章下发表评论。表单将使用\
    \ `post` 方法将数据提交到自身，随后我们的应用程序能够处理这些数据并使用 `addComment()` 将其保存到数据库。我们还为表单中的每个输入字段添加了\
    \ `if` 语句，以防用户在尝试提交评论时忘记填写。我们还有一个隐藏字段，用于存储文章 ID——这是我们正确保存评论所需要的内容。\n\n### 注意：使用\
    \ Gravatar 作为头像\n\n需要注意的是一点是，我们添加了指向 [Gravatar](http://en.gravatar.com/) 的链接，以便在评论旁边显示用户的头像。Gravatar\
    \ 是一项免费服务，允许用户将图像上传到在线服务器并将电子邮件地址关联到它。这使得开发者可以在应用程序中编写代码来收集可能与用户邮箱地址关联的头像。\n\n\
    调用 Gravatar 服务器是免费的，这意味着你不需要自己存储图像。Gravatar 的目标是提供一个快速方便的解决方案来更新每个人的头像。如果用户在 Gravatar\
    \ 上没有设置头像，它将返回一个默认头像。每个电子邮件地址都使用基本方法进行编码，因此我们需要使用 `md5` 对用户的邮箱地址进行编码；我们在代码中已经这样做，以便从\
    \ Gravatar 服务器获取头像。\n\n![我们的博客，现在有评论了！](img/comments.png)\n\n图 5.5。我们的博客，现在有评论了！\n\
    \n回到我们的代码，在模板的底部，我们有一个新区域，用户可以在其中输入关于自己的信息，并提交评论以附并显示在博客文章上。\n"
- fmt: '

    To locate your `php.ini` file, use the `phpinfo()` function to discover its location.
    Need a quick refresher? We did this before in [Chapter 1](#ch01.html "Chapter
    1Server Kick-Start").


    Once you''ve found the correct file, open it up in your text editor and you''ll
    see a huge amount of configuration options available. A handful of these, discussed
    below, will help improve the security of your application.


    ### allow_url_include


    ```

    allow_url_include=Off

    ```


    By default, the standard PHP installation has `allow_url_include` turned off,
    but some hosting providers may have it turned on so it''s important to check your
    `php.ini` file.


    With `allow_url_include` turned off, PHP can only load and execute other files
    that reside on the web server''s file system. However, if you activate `allow_url_include`,
    you can include additional files via URL. This may seem like an interesting and
    possibly useful feature to have turned on, but doing opens up your application
    to the possibility of malicious code injection attacks. For this reason it''s
    highly recommended that this option remains turned off.


    ### Note: Code Injection


    `code injection` is the term used to describe when unwanted code from an external
    source is placed into a PHP script without consent. For more information on code
    injection, please see these external sources:


    *   [http://www.theserverpages.com/articles/webmasters/php/security/Code_Injection_Vulnerabilities_Explained.html](http://www.theserverpages.com/articles/webmasters/php/security/Code_Injection_Vulnerabilities_Explained.html)


    *   [https://www.owasp.org/index.php/Code_Injection](https://www.owasp.org/index.php/Code_Injection)


    A related setting is `allow_url_fopen` which should also be switched off.


    ### open_basedir


    ```

    open_basedir=/path/to/web/directory

    ```


    Like `allow_url_include`, `open_basedir` can also help restrict files that scripts
    are allowed to load on the server. With `open_basedir`, you can set which directory
    files can be loaded from, and ensure that no file from outside that directory
    can be loaded in any scripts.


    One method would-be attackers attempt is to access the `/etc/password` file on
    a Linux-based web server, which lists the registered user accounts on the server.
    If your PHP application is run from `/var/www`, you can set `open_based` to `"/var/www/"`.
    Once set, files outside of the `www` directory cannot be included in your scripts,
    stopping attackers in their tracks. Enable this option when your application goes
    live to add an extra level of security to your server.


    ### Error Management


    During the development phase of a project it''s useful to have PHP give you feedback
    when it encounters any errors or problems in your code. However, once your application
    is deployed, you really want these errors to be few and far between. Developers
    will want to hide PHP error messages from the users because, if these errors are
    seen they can give a sense of unreliability that impacts customer confidence.


    Importantly, error messages can also give away vital information about your system''s
    configuration, which hackers can use to their advantage. PHP''s default error
    messages can contain information such as the application''s installation path,
    database connection details, database column names, and other script details such
    as class names, object IDs, and variable names.


    To ensure this information is hidden from users, set the `display_errors` option
    in `php.ini` to `off`. This tells PHP not to show errors during runtime when one
    occurs. It doesn''t mean that PHP will ignore the error—rather that it won''t
    display it in the browser.


    You can still tell PHP to save any errors to a special log file, which you, the
    application developer, can refer in privacy. To do this, set the `error_log` option
    to a path that''s the location of the desired error log file.


    It''s also a good idea to turn the `log_errors` option on. This ensures that PHP
    will log errors, save the error data, and avoid all possibilities of rendering
    the error messages on the screen.


    With these options set, PHP will privately create error logs for you to refer
    to when needed.


    ### Improving Session Security


    Sessions, as discussed in the [previous chapter](#ch05.html#sessions "Sessions"),
    are a means of temporarily storing data, such as whether a user is logged in or
    not. We''re using sessions in our blog application and, as you have probably noted
    already, they provide useful functionality. Sessions may often only hold a small
    amount of data, but any piece of data related to gaining access to an application
    could potentially be gold dust to any attacker or hacker. By default, sessions
    store information about your application''s users, and use cookies to help programming
    languages such as PHP match each users with the correct session information. Unfortunately,
    sessions maintain the login state that the attacker wants to achieve, which makes
    sessions one of the most attractive targets for hackers.


    One way that hackers can try to hijack a session is to access the session data
    itself. Fortunately, `php.ini` comes to the rescue again and offers us the ability
    to change the location in which the sessions data is kept through the option `session.save_path`:


    ```

    session.save_path = /var/lib/php

    ```


    The example written above is the default. If you change the location, it will
    throw hackers off the scent as they''ll need to figure out where you''ve relocated
    the session data to.


    It''s important to remember that, when you change this path, you ensure your web
    server can read and write to the new location. Fail to do this and your PHP won''t
    be able to use sessions correctly, and will throw up!


    Hackers will also often try to exploit your application and server through a technique
    known as [Cross Site Scripting](https://en.wikipedia.org/wiki/Cross-site_scripting)
    (`XSS` for short), which allows them to inject malicious JavaScript code into
    your application. Sessions are often the target in XSS attacks and, if successful,
    they can do a variety of damage, from keyboard watching (where a script notes
    down all the keys pressed, including those pressed for passwords) to forcing unauthorized
    advertisements ion your users for an attacker''s gain. To help prevent XSS attacks,
    you can use the following option:


    ```

    session.cookie_httponly = 1

    ```


    This option, when set to `1`—as is the default in most `php.ini` files—will restrict
    JavaScript from accessing cookies that have been created by PHP. It''s highly
    advised that you turn this option on if you don''t intend JavaScript to use any
    data from cookies, as it really does help to control the flow of data from the
    client''s computer to your application and the server upon which it''s hosted.


    For more information on options within `php.ini` and how to make your PHP more
    secure, please see the following sources:


    *   [http://www.sitepoint.com/a-tour-of-php-ini/](http://www.sitepoint.com/a-tour-of-php-ini/)


    *   [http://php.net/manual/en/ini.php](http://php.net/manual/en/ini.php)


    *   [http://www.madirish.net/?article=229](http://www.madirish.net/?article=229)


    ## Validating Submitted Data


    One of the biggest threats to PHP applications is not the lack of protection from
    attackers, but rather the threat of bad data submitted by users. Whether a user
    submits incorrect data on purpose or by accident is often difficult to work out,
    but incorrectly formatted data can harm your application.


    It''s important to ensure your users know what type of data they''re supposed
    to submit. Use the correct input elements for the type of data you''re prompting
    for, and make sure the labels clearly indicate what is expected.

