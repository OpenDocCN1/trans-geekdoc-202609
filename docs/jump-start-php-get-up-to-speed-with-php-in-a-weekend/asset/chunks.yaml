    \ == 'delete') {\n        $this->deleteComment();\n    } else {\n        $this->listComments();\n\
    \    }\n}\n```\n\n正如我们看到的，我们的构造函数现在检查 URL 变量 `action` 并检查它是否存在，以及它是否持有字符串 `delete`。如果是，我们的应用程序将加载\
    \ `deleteComment()` 方法；如果不是，它将加载 `listComments()` 方法。所以让我们构建这些方法，从 `listComments()`\
    \ 开始：\n\n```\npublic function listComments() {\n    // ... (后续代码)\n}\n```\n\n"
- fmt: "\n```php\npublic function viewpost($postid) {\n    $id = $postid;\n    $posts\
    \ = $this->ksdb->dbselect('posts', array('*'), array('id' \n=> $id));\n    $markdown\
    \ = new Michelf\\Markdown();\n    $posts[0]['content'] = $markdown->defaultTransform($posts[0][\n\
    'content']);\n    $postcomments = $this->comments->getcomments($posts[0]['id']);\n\
    \    $template = 'view-post.php';\n    include_once 'frontend/templates/'.$template;\n\
    }\n```\n\nWe've included the new markdown library at the start of our script,\
    \ ready for us to use when the application needs to render data in the markdown\
    \ format. We've also changed the functionality in our `getposts()` method, as\
    \ well as our `viewpost()` method, and we are now loading our `Comments` class\
    \ in our constructor.\n\nLet's start by looking a little closer at the code we've\
    \ added to the two methods. In `getposts()``, we've added a new `foreach` loop,\
    \ which will call the `commentnumber()` method in our `Comments` class. We still\
    \ need to add this method into the class, so let's keep that in mind and take\
    \ a quick look at the `viewpost()` method. Here, we're loading the `markdown`\
    \ class from the markdown library, and attributing this class to the variable\
    \ `$markdown`, turning it into an object.\n\nYou'll notice the call to the markdown\
    \ library is quite different from how we have called classes before; that is because\
    \ Michel has used a **namespace** in his library. A namespace helps to establish\
    \ a unique identifier for a class. This avoids potential clashing when two classes\
    \ are loaded with the same name. Namespacing was introduced in PHP 5.3. It's a\
    \ feature that is starting to gain popularity, as it helps to solve naming complications\
    \ when creating libraries for public use. Namespaces can be applied to classes\
    \ like so:\n\n```php\n<?php\nnamespace Project;\nclass myProject {\n    function\
    \ index() {\n        echo 'Loading a method from a class with a namespace!';\n\
    \    }\n}\n```\n\nThey're very simple to implement, but can make a huge improvement\
    \ to code interoperability. For example, the markdown PHP library is using the\
    \ namespace `Michelf`, so to load the library's class and its methods into our\
    \ scripts, we just need to have the namespace appear in our script before we call\
    \ the class. In this case, instead of writing:\n\n```php\n$markdown = new Markdown();\n\
    ```\n\nwe have to write:\n\n```php\n$markdown = new Michelf\\Markdown();\n```\n\
    \n### Note: More on Namespaces\n\nFor more information on namespaces, please see\
    \ the [PHP manual](http://php.net/manual/en/language.namespaces.php) and [this\
    \ article on SitePoint](http://www.sitepoint.com/php-namespaces/).\n\nNow that\
    \ we have our markdown PHP library implemented, we can use it to transform posts\
    \ that are written in markdown syntax into fully rendered HTML.\n\nThe last new\
    \ piece of code we've added is a call to another method in our `Comments` class,\
    \ which we've yet to code. This method is `getcomments()`, which will get our\
    \ application to load up all the comments for a specific post.\n\nLet's start\
    \ by opening up the `comments.php` file from within the \"frontend\" directory.\
    \ Amend the code as follows:\n\n```php\n<?php\nrequire_once 'frontend/posts.php';\n\
    class Comments extends Blog {\n    public function __construct() {\n        parent::__construct();\n\
    \        if ($_SERVER['REQUEST_METHOD'] === 'POST' && !empty($_POST[\n'comment']))\
    \ {\n            $this->addcomment();\n        }\n    }\n```\n\nOur constructor\
    \ for this class loads everything we need from the parent class's constructor\
    \ (which is the constructor from the `Blog` class) then checks to see if there's\
    \ a post request to submit a new comment. If there is, the application will then\
    \ fire the `addcomment()` method. This method is where we take all the data posted\
    \ from the comments form and prepare it for entry into our comments database using\
    \ the `dbadd()` method from the PDO database library.\n\n```php\npublic function\
    \ commentnumber($postid) {\n        $query = $this->ksdb->dbselect('comments',\
    \ array('*'),\n array('postid' => $postid));\n        $commentnum = count($query);\n\
    \        if ($commentnum <= 0) {\n            $commentnum = 0;\n        }\n  \
    \      return $commentnum;\n    }\n    public function getcomments($postid) {\n\
    \        return $this->ksdb->dbselect('comments', array('*'), array\narray('postid'\
    \ => $postid));\n    }\n```\n\nYou can also see we have our method `getcomments()`,\
    \ which requires that a variable containing a post id is passed to the method.\
    \ Any data that needs to be passed to a method before it can be processed correctly,\
    \ can be placed in parentheses after the method name. The method collects all\
    \ the comments attributed to a post based on the id passed to the method, and\
    \ returns them to the variable attributed when this method was called. This means\
    \ that if data is passed to the method, PHP will throw an error:\n\n```php\npublic\
    \ function addcomment() {\n        $status= '';\n        $array = $format = array();\n\
    \        if (!empty($_POST['comment'])) {\n            $comment = $_POST['comment'];\n\
    \        }\n        if (!empty($comment['fullname'])) {\n            $array['name']\
    \ = $comment['fullname'];\n            $format[] = ':fullname';\n        }\n \
    \       if (!empty($comment['email'])) {\n            $array['email'] = $comment['email'];\n\
    \            $format[] = ':email';\n        }\n        if (!empty($comment['content']))\
