    \ or variables because calling the wrong thing can cause unpredictable results\
    \ in your PHP scripts!\n\n## Extending Classes\n\nNow you have a very basic understanding\
    \ of OOP, so let's recap briefly. A class is a definition that groups variables\
    \ and functions together into a logical unit, and a specific instance in memory\
