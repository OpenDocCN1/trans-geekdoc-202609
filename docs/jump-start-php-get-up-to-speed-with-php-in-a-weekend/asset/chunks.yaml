    \ on it. To install MySQL and phpMyAdmin I recommend following [this guide by\
    \ Mhabub Mamun.](http://www.developmentwall.com/install-apache-php-mysql-phpmyadmin-ubuntu/4)\n\
    \nFinally, you have the option to enable the mod\\_rewrite module for Apache,\
    \ which allows developers to redirect users to different sections of the website\
    \ by rewriting the requested URLs. For a full in-depth guide for enabling and\
    \ settings up the mod\\_rewrite module, please see [the Nettuts+ guide](http://net.tutsplus.com/tutorials/other/a-deeper-look-at-mod_rewrite-for-apache/),\
    \ which offers a very detailed step-by-step tutorial.\n\n## PHP Configuration\n\
    \nBefore we delve into writing some PHP code, let's configure PHP to better suit\
    \ our project. PHP is configured by the file php.ini, which holds all of the core\
    \ settings relating to how PHP will behave on our server. You can see a quick\
    \ overview of PHP's current configuration by using the `phpinfo()` function in\
    \ a PHP script. To do this, create a new file in your server folder named info.php,\
    \ add the following code to the file, and save it:\n\n```\n<?php\n        phpinfo();\n\
    ```\n\nNow, point your browser to the `info.php` file and you should see a page\
    \ that displays a table full of information about our PHP's current configuration,\
    \ as shown in [Figure 1.5](#ch01.html#phpinfo \"Figure 1.5. phpinfo()\").\n\n\
    \ ![phpinfo()](figures/phpinfo.png)\n\nFigure 1.5. phpinfo()\n\nThe key thing\
    \ to find here is the row titled Configuration File (php.ini) Path as this will\
    \ tell you exactly where your php.ini file is located. You can see that in [Figure 1.5](#ch01.html#phpinfo\
    \ \"Figure 1.5. phpinfo()\") my php.ini file is located at E\\\\:wamp\\\\bin\\\
    \\apache\\\\apache2.4.2\\\\bin\\\\php.ini. Your path will very likely be different\
    \ from this, so use the `phpinfo()` function to find out what it is.\n\nThe php.ini\
    \ file contains a large amount of settings, some of which you may never need to\
    \ change. However, there are a few which can be changed to help tailor PHP to\
    \ suit your development style and environment. For a tour of the php.ini file,\
    \ I highly recommend reading [the *Tour of php.ini* article I wrote for SitePoint](http://www.sitepoint.com/a-tour-of-php-ini/).\n\
    \n## Hello PHP World\n\nNow that you have your local server installed and running,\
    \ let's start coding some PHP! We'll start by heading to Apache's web folder,\
    \ which is located in different places depending on which operating system you\
    \ are using:\n\n*   For Windows users using WAMP, open up Explorer or My Computer\
    \ and navigate to the directory located at C:/Program Files/wamp/www/\n\n*   For\
    \ Mac OS X using MAMP, open Finder and navigate your way to Applications > MAMP\
    \ > htdocs to locate MAMP's web directory.\n\n*   The web directory for Linux\
    \ can be found in `/var/www`. Many Linux developers like to edit their server's\
    \ config file to change which directory is used for web files. To do this, please\
    \ see the [solution on Stack Overflow](http://stackoverflow.com/a/5891858).\n\n\
    Once you've found your server's web directory, you need to create a directory\
    \ to act as your project's \"root\" directory where all your project files will\
    \ be located. For now, create a directory named my\\_project. I specifically avoided\
    \ any spaces or capital letters in the folder's title because it will form part\
    \ of the URL to access files in this folder.\n\nNow create a new PHP file called\
    \ index.php in the my\\_project folder. Once this file has been created you'll\
    \ need to open it in a text editor that can edit PHP files.\n\n### Note: Choosing\
    \ a Text Editor\n\nI recommend that you use an editor which supports syntax highlighting\
    \ for PHP. Choosing an editor is a very personal decision as different editors\
    \ offer different features; some editors will complement your way of coding and\
    \ some may conflict with it. In the end, the choice should really depend on which\
    \ editor makes coding easier and more fun for you. It's also worth trying a few\
    \ different editors before settling on your final choice.\n\nHere's a short list\
    \ of some of the more popular editors available. It contains a mixture of both\
    \ free and paid-for editors:\n\n*   [Adobe Dreamweaver](http://www.adobe.com/products/dreamweaver.html)\
    \ – (Windows and Mac OS X)"
