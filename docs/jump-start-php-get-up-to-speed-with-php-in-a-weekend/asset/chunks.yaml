    \    }\n}\n$posts = new Posts();\n?>\n```\n\nWhat we've done here is is to create\
    \ a new class, `Posts`. At the start we initiated our PDO MySQL connection. We\
    \ then move onto the `index` method, in which we check to see if the URL has a\
    \ URL variable and, if so, we collect it from the URL, as well as attempt to collect\
    \ the post with the same `id` from our database. If there's no URL variable, we\
    \ then just load up all the posts in our database. Finally we then load the template\
    \ which relates to the database query we have executed.\n\nNext, we'll need to\
    \ put together our template files to display the data we've retrieved from the\
    \ database. So create two new files—one called list-posts.php, and the other single-post.php.\
    \ In list-posts.php add the following code:\n\n```\n<h1>List of Blog Posts</h1>\n\
    <?php foreach ($posts as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']);\
    \ ?></h3>\n    <?php echo htmlspecialchars($post['content']); ?>\n    <a href=\"\
    http://localhost/experiments/posts.php?id=<?php echo \n↵htmlspecialchars($post['id']);\
    \ ?>\">Read More</a>\n    <hr/>\n<?php endforeach; ?>\n```\n\nFinally in our single-post.php\
    \ file add this code:\n\n```\n<?php foreach($posts as $post): ?>\n    <h1>Post\
    \ #<?php echo htmlspecialchars($post['id']); ?></h1>\n    <hr/>\n    <?php echo\
    \ htmlspecialchars($post['content']); ?>\n    <a href=\"http://localhost/experiments/posts.php>\"\
    >\n↵Back to Post List</a>\n<?php endforeach; ?>\n```\n\nNow, if we navigate to\
    \ our posts.php file we can see there's a list of posts—or a single post in this\
    \ case, as we currently only have one in the database—each of which has a link\
    \ for us to \"Read More\". Clicking on this link takes us to the individual post\
    \ page, and displays a different template than the one used to view the full list\
    \ of posts.\n\nThis is a very short example, showing how the `$_GET` variable\
    \ allows us to dynamically load blog posts, and interact with our database. We\
    \ could easily change the example to use the `$_POST` variable instead. However,\
    \ we wouldn't then be able to share URLs referring to individual posts. Instead,\
    \ the URL would only send visitors to the list of posts where they must click\
    \ on the \"Read More\" link themselves.\n\nThis example leads us very nicely to\
    \ the next section of this chapter where we'll expand on this code snippet, along\
    \ with the earlier ones, and begin to build the real guts of our blog platform.\n\
    \n## Building on our Platform\n\nIn this section, we're going to build on the\
    \ example we've just created—which displays a list of blog posts with links to\
    \ read individual posts—and get that working in our application.\n\nLet's take\
    \ the existing code from above and tweak it slightly. Modify the posts.php file\
    \ in the includes directory our blog platform folder so the constructor looks\
    \ like this:\n\n```\npublic function __construct() {\n    parent::__construct();\n\
    \    $this->comments = new Comments();\n    if (!empty($_GET['id'])) {\n     \
    \   $this->viewPost($_GET['id']);\n    } else {\n        $this->getPosts();\n\
    \    }\n}\n```\n\nWith this code, our constructor checks to see if there's a URL\
    \ variable called `id.` If there is, it proceeds to collect the data from the\
    \ variable, and pass it to the `viewPost() `method within the `Blog` class. If\
    \ there isn't a URL variable called `id`, the application is, instead, told to\
    \ load up all the posts from our database. This'll allow visitors to see all of\
    \ our posts, and then click on a link to view an individual post.\n\nThe next\
    \ change that we'll make to the `posts.php` file is to edit is the `getPosts()\
    \ `method:\n\n```\npublic function getPosts() {\n    $id = 0;\n    $posts = $return\
    \ = array();\n    $template = '';\n    $query = $this->ksdb->db->prepare(\"SELECT\
    \ * FROM posts\");\n    try {\n        $query->execute();\n        for ($i = 0;\
    \ $row = $query->fetch(); $i++) {\n            $return[$i] = array();\n      \
    \      foreach ($row as $key => $rowitem) {\n                $return[$i][$key]\
    \ = $rowitem;\n            }\n        }\n    } catch (PDOException $e) {\n   \
    \     echo $e->getMessage();\n    }\n    $posts = $return;\n    $template = 'list-posts.php';\n\
    \    include_once 'frontend/templates/' . $template;\n}\n```\n\nThe `getPosts()`\
    \ method is used to collect all the posts from the database to create a list of\
    \ them for visitors to our blog. It uses the PDO database functionality from the\
    \ `database.php` file in the includes folder. This allows us to write our own\
    \ database query through PDO. Using this method we want to load all the rows from\
    \ the `posts` table with the `SELECT * FROM posts` database query. We then use\
    \ the `try` and `catch` exception handling routine in an attempt to run the query.\
    \ If it's successful, we then loop through the array returned from the database\
    \ and add the result to a new key in the `$return` array. If it fails, we echo\
    \ the error message from PDO that tells us what's wrong with our database query.\
    \ Finally, we load the `list-posts.php` template.\n\n### Warning: Displaying PDO\
    \ Error Messages\n\nEchoing PDO error messages, as we've done in the example above,\
    \ can be helpful during development, as it'll help us track down with issues our\
    \ databse queries. However, you should definitely not echo PDO error messages\
    \ in production applications—doing so can be a security risk.\n\nThe last step\
    \ for this class is to edit the `viewPost()` method:\n\n```\npublic function viewPost($postId)\
    \ {\n    $id = $postId;\n    $posts = $return = array();\n    $template = '';\n\
    \    $query = $this->ksdb->db->prepare\n↵(\"SELECT * FROM posts WHERE id = ?\"\
    );\n    try {\n        $query->execute(array($id));\n        for ($i = 0; $row\
    \ = $query->fetch(); $i++) {\n            $return[$i] = array();\n           \
    \ foreach ($row as $key => $rowitem) {\n                $return[$i][$key] = $rowitem;\n\
    \            }\n        }\n    } catch (PDOException $e) {\n        echo $e->getMessage();\n\
    \    }\n    $posts = $return;\n    $posts[0]['content'] = $posts[0]['content'];\n\
    \    $template = 'view-post.php';\n    include_once 'frontend/templates/'.$template;\n\
    }\n```\n\nIn a nutshell, the `viewPost()` method displays individual blog posts\
    \ to our blog's visitors.Our application uses it to load the data for a particular\
    \ post, based on data from a URL variable. It requires that `$postId` is passed\
    \ to the method once it's called, which we've done with the class's constructor.\
    \ This method uses the PDO database functionality to load a specific post from\
    \ the database based on the `id` of the posts stored in the database. In addition,\
    \ our script uses a `try` ... `catch` exception handler to check if the database\
    \ query is successful. If the query is successful, we'll again loop through the\
    \ array returned from the database, and assign the data returned to a key in the\
    \ `$return` array. If it fails, we show the database error generated by PDO, as\
    \ before. Finally, we load up the `view-post.php` template.."
