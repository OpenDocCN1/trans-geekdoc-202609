- fmt: "\n* One of the most well-known editors. It provides a wide range of one-click\
    \ options and has a built-in FTP client.\n\n* [Sublime Text](http://www.sublimetext.com/)\
    \ – (Windows, Mac OS X, and Linux)\n    * A free-to-try editor which has some\
    \ powerful shortcuts and macro commands built-in.\n\n* [Komodo Edit](http://www.activestate.com/komodo-edit)\
    \ – (Windows, Mac OS X, and Linux)\n    * A powerful free editor with a slick\
    \ interface and built-in FTP client.\n\n* [Coda](http://panic.com/coda/) – (Mac\
    \ OS X)\n    * A very user-friendly editor with a wide range of functionality.\n\
    \n* [Notepad++](http://www.notepad-plus-plus.org/) – (Windows)\n    * A very popular\
    \ free editor.\n\nOnce you have chosen an editor that is right for you, open `index.php`\
    \ and you can start to write some PHP code to the file. Type in the following\
    \ code and then save the file:\n\n```\n<?php echo \"Hello World\"; ?>\n```\n\n\
    Let's run this code. Open up a web browser and, in the browser's address bar,\
    \ type `http://localhost/my_project/index.php`. You should see something similar\
    \ to [Figure 1.6](#ch01.html#helloworld \"Figure 1.6. Hello, world!\").\n\n![Hello,\
    \ world!](figures/helloworld.png)\n\nFigure 1.6. Hello, world!\n\nCongratulations!\
    \ You've just written your first piece of PHP code! As you can see, the code displays\
    \ the phrase \"Hello World\" in the web browser, but what exactly have you typed\
    \ into your PHP file? Let's break down our line of code:\n\n* `<?php` : This is\
    \ called the opening tag. It tells your server that the code that follows is intended\
    \ to be interpreted as PHP, and that the server should use the PHP engine to render\
    \ the code. This tag must be entered every time you want to use PHP code in your\
    \ file.\n\n* `echo \"Hello World\";` : `echo` is a basic PHP construct which tells\
    \ PHP that what follows the `echo` command is something you want to appear in\
    \ the browser. Quotation marks are added around the text you want to display on\
    \ screen. Also, you add the important semicolon afterward which signals that your\
    \ `echo` statement is finished.\n\n* `?>` : This is the closing tag for PHP and\
    \ tells the server to stop rendering PHP code. The closing tag is not always used.\
    \ Leaving the code \"unclosed\" can prevent unintended content from being sent\
    \ to the browser. Skipping the closing tag when you don't need it can avoid problems\
    \ which may crop up as you start writing more complex PHP code. Further on in\
    \ this book you'll see code that doesn't have a closing PHP tag. This tag has\
    \ been omitted on purpose.\n\n### Important: Use Your Semicolons!\n\nIt's very\
    \ important to remember to add a semicolon at the end of all PHP statements because\
    \ PHP will not know where one statement ends and the next statement begins without\
    \ it.\n\nPHP files also let you combine PHP code with regular HTML. If you combine\
    \ PHP and HTML together you can create really nice looking web pages that contain\
    \ dynamic and complex data, which HTML cannot process and handle on its on.\n\n\
    Here's a quick example of HTML and PHP working together:\n\n```\n<!DOCTYPE html>\n\
    <head>\n    <title>PHP and HTML working together</title>\n    </head>\n    <body>\n\
    \      <h1><?php echo 'This is a H1 tag with PHP data'; ?></h1>\n      <p><?php\
    \ echo 'This is a P tag with PHP data also'; ?></p>\n    </body>\n</html> \n```\n\
    \nIf you change the contents of the `index.php` file to the example above and\
    \ navigate back to `http://localhost/my_project/index.php`, you'll see the HTML\
    \ code display all the code processed by PHP correctly in your browser.\n\n##\
    \ PHP Variables\n\nLet's take our code to the next level and explore the world\
    \ of variables. A variable represents a place in the computer's memory where we\
    \ can temporarily store bits of information. We can assign some piece of data\
    \ to a variable (place the data in memory) and use that variable throughout our\
    \ script. Each time PHP sees the variable in our code, it knows to access the\
    \ data that it represents. The data we assign to a variable can be anything from\
    \ a simple string of text such as \"Hello World\", or numbers like \"1234\", through\
    \ to more complex data structures, which we'll cover shortly.\n\nVariable names\
    \ are always prefixed with the `$` symbol. Their names cannot contain spaces and\
    \ must only contain letters (lower and upper-case), numbers, and underscores.\
    \ In addition, the first character in the name after the `$` must be a letter\
    \ or an underscore. Acceptable variable names could be `$myAwesomeVariable`, or\
    \ even `$my_Awesome_Variable_1`.\n\nIt's considered good practice to give your\
    \ variables meaningful names so that if another developer reads the code you've\
    \ written they have a clue as to what data it represents. For example, if we wanted\
    \ a variable to hold data about someone's name we could call our variable `$personName`.\n\
    \n### Note: Use CamelCase\n\nIf your variable has more than one word in its name,\
    \ it's common practice to give the start of each word a capital letter. This improves\
    \ readability when scanning through code.\n\nLet's take a look at a variable in\
    \ use. Modify `index.php` as follows:\n\n```php\n<?php\n$myVar = 'Hello World';\n\
    echo $myVar;\n```\n\nSo what have we coded? First, we assigned a string \"Hello\
    \ World\" to the variable `$myVar`. Now we index.php file again so it looks like:\n\
    \n```php\n<?php\n$myVar = 'Hello World';\necho $myVar;\n```\n\nRefresh the page\
    \ again and you should see \"Hello World\" on the screen. This is because we used\
    \ the variable `$myVar` in the `echo` statement.\n"
