- fmt: "\n*   `enctype` – This attribute specifies how the form's data is encoded\
    \ when it's submitted. However, this attribute only comes into effect when the\
    \ `method` attribute has been set to `POST`. `enctype` has three possible values:\
    \ `application/x-222-form-urlencoded`, `multipart/form-data` and `text/plain`.\
    \ The first option encodes everything that's submitted into the form, so all spaces\
    \ are encoded to `+` and all other special characters are converted to ASCII Hex\
    \ values. The second option encodes none of the form data. This is essential if\
    \ your form has any type of file upload control or processing. The last option\
    \ will convert spaces in the submitted data to `+` but won't encode any special\
    \ characters. These options should be assessed when coding your form as they'll\
    \ play an important role in the state of the data when it arrives at the action\
    \ attribute's URL.\n\nThere are two attributes that can be set on any form element\
    \ and that are also important when processing data with PHP scripts:\n\n*   `name`\
    \ – The `name` attribute value is an identifier used to collect the data when\
    \ it's sent to the destination URL. For example, if we have the element `<input\
    \ type=\"text\" name=\"data\" />`, the value entered for it by the user becomes\
    \ available in an array on the server and can be referenced using the array key\
    \ `'data'`.\n\n*   `value` – The `value` attribute is where the information or\
    \ data for each element in the form is set. You can use this attribute to set\
    \ a default value for an element.\n\nHere's an example form using some of the\
    \ attributes outlined above:\n\n```\n<form method=\"post\">\n    <input name=\"\
    myField\" value=\"Hello World\" />\n    <button type=\"submit\">submit</button>\n\
    </form>\n```\n\nSo far we've only looked at the important parts of forms that\
    \ come into play when using them in PHP. However, you may find yourself using\
    \ attributes and tags that haven't been listed here. The elements we've discussed\
    \ cover the basics, so if you're hungry for more information on forms, feel free\
    \ to hit up these external references:\n\n*   [http://reference.sitepoint.com/html/elements-form](http://reference.sitepoint.com/html/elements-form)\n\
    *   [http://www.tizag.com/htmlT/forms.php](http://www.tizag.com/htmlT/forms.php)\n\
    *   [http://www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm](http://www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm)\n\
    \n## POST and GET\n\nEach form's `method` attribute allows only two options, `POST`\
    \ and `GET`. As we know, PHP has some special predefined variables such as the\
    \ `$_SESSION` variable. PHP also has two other predefined variables which are\
    \ designed to collect data ultimately sent by HTML forms, `$_POST` and `$_GET`,\
    \ but these variables can also be used in other ways—something we'll take a look\
    \ at later on.\n\nFor now, let's illustrate the difference between `POST` and\
    \ `GET` with an example. Create some new files in our experiments folder: `form.php`\
    \ and `collect.php`. In our `form.php` file, add the following code:\n\n```html\n\
    <html\n<body>\n    <form method=\"post\" action=\"collect.php\">\n        <h1>Form\
    \ #1</h1>\n        <input name=\"data\" placeholder=\"enter a string\" \ntype=\"\
    text\" />\n        <button type=\"submit\">submit</button>\n    </form>\n    <form\
    \ method=\"get\" action=\"collect.php\">\n        <h1>Form #2</h1>\n        <input\
    \ name=\"data\" placeholder=\"enter a string\" \ntype=\"text\" />\n        <button\
    \ type=\"submit\">submit</button>\n    </form>\n</body>\n</html>\n```\n\nDone\
    \ that? Good. Now go ahead and add the following code to the `collect.php` file:\n\
    \n```php\n<?php\nif (!empty($_POST['data'])) {\n    echo 'The following string\
    \ was sent from form #1: ' . \n$_POST['data'];\n} elseif (!empty($_GET['data']))\
    \ {\n    echo 'The following string was sent from form #2: ' . \n$_GET['data'];\n\
    }\n```\n\nNext, open `form.php` in your browser, type something into the input\
    \ field in Form #1 and hit submit. You should see something like [Figure 4.2](#ch04.html#form1out\
    \ \"Figure 4.2. The result of submitting the form\"):\n\n![Entering data into\
    \ our form](figures/form1.png)\n\nFigure 4.1. Entering data into our form\n\n\
    ![The result of submitting the form](figures/form1submit.png)\n\nFigure 4.2. The\
    \ result of submitting the form\n\nIf you fill out Form #2, as shown in [Figure\
    \ 4.3](#ch04.html#form2 \"Figure 4.3. Entering data into Form #2\"), and hit submit,\
    \ you should see something similar to [Figure 4.4](#ch04.html#form2submit \"Figure\
    \ 4.4. The result of submitting the form\"):\n\n![Entering data into Form #2](figures/form2.png)\n\
    \n![The result of submitting the form](figures/form2submit.png)\n\nThe main difference\
    \ between `POST` and `GET` is shown between the two forms.\n\n![The result of\
    \ submitting the form](figures/form1submit.png)\n\nFigure 4.2. The result of submitting\
    \ the form\n\nThe main difference between `POST` and `GET` is shown between the\
    \ two forms.\n\n![The result of submitting the form](figures/form1submit.png)\n\
    \nFigure 4.2. The result of submitting the form\n"
