  trans: '

    今天，PHP 开发主要侧重于服务器端脚本，而不是通用型脚本任务，它通常被认为是微软 ASP.NET、Apache 软件基金会的 `mod_perl` 模块以及
    Joyent 的 Node.js 等技术的竞争对手。PHP 主要用于处理复杂的数据处理，允许动态数据出现在网页上，例如数学计算、数字处理以及与数据库交互。它允许开发者将原本静态的
    HTML 内容变为对用户请求做出响应的内容，或者对存储在数据库中的永久数据执行相同的操作。


    PHP 专注于 Web 开发，这使其成为开发者创建 Web 应用程序或网站时显而易见的选择。其平缓的学习曲线让开发者能够快速开始使用 PHP 构建，而其功能的丰富性允许开发者在无需借助另一种编程语言的情况下扩展他们的项目。Digg、Etsy、Yahoo、Facebook
    和 Wikipedia 等网站都使用 PHP 来驱动其网站部分，包括与访问者相关的数据处理和处理。


    在网页中使用 PHP 的一个简单示例是使用计数器显示访问人数。数据库存储访问网页的人数，PHP 用于与该数据库交互并生成 HTML 标记以显示当前计数。PHP
    还可以用于创建大型、复杂且多级的导航类网站，这些网站具有许多嵌套页面，并通常用于驱动电子商务网站。PHP 甚至允许根据收集到的该用户的信息为访问者创建定制化体验。


    PHP 的流行还带来了一个庞大的开发者社区，他们愿意为寻求建议的人提供帮助，而且大多数情况下是免费的，此外在线和离线都有不断扩展的参考资料库。


    ## 设置


    PHP 几乎在每个共享服务器托管包中可用，它也可以与 Apache HTTP 服务器软件配合使用，在你的家庭电脑上创建一个本地 Web 服务器。PHP 还可以用于你自己的私有
    Web 服务器，然后可以通过互联网访问它。


    家庭电脑上的本地服务器通常使用流行的 `LAMP`（Linux, Apache, MySQL 和 PHP）、`MAMP`（Mac OS X, Apache,
    MySQL 和 PHP）和 `WAMP`（Windows, Apache, MySQL 和 PHP）堆栈设置，所有这些都可以免费下载。


    这些堆栈通常包含一个一键安装程序，该程序会安装带有默认配置的标准 Web 服务器设置。这允许 Web 开发者设置一个与其 Web 托管公司提供的环境几乎相同的本地环境。开发者经常使用本地服务器开始构建网站和应用程序，因为他们可以轻松访问工作文件，且无需花费额外的时间和麻烦将文件上传到在线服务器。此外，这种方法意味着不必担心开发代码意外泄露到上线站点，开发者还可以避免使用托管带宽进行文件传输。


    ## 入门


    在你的家庭电脑上获取本地服务器似乎可能是一项复杂的任务，但它通常非常简单：一键安装。根据你使用的操作系统，有几种选项可供：


    ### Windows


    在 Windows 上，你有两个流行且强大的安装程序可选择。第一个是 [WAMP](http://www.wampserver.com/en/)，这是一个在你的电脑上安装
    Apache、PHP、MySQL 和 `phpMyAdmin` 的 Windows 程序（`phpMyAdmin` 是一个用于操作 MySQL 数据库的方便基于
    Web 的界面）。另一个来自 Apache Friends 的 [XAMMP](http://www.apachefriends.org/en/xampp.html3)，这是一个包含
    Apache、MySQL、PHP、Perl 和 `phpMyAdmin` 的发行版。


    就本书而言，我们将仅介绍使用 WAMP 的设置，但如果你选择安装该软件包，XAMMP 的设置也遵循类似的过程。


    你的第一步是[下载 WAMP](http://www.wampserver.com/en/#download-wrapper)。你将获得多个下载选项，请选择与你的电脑处理器和操作系统版本相对应且为
    "PHP 5.4 2.4" 的版本。


    ### 注意：我的是什么种处理器？


    要确定你拥有什么种处理器，请查看你的“我的电脑”图标，或者你可以前往控制面板并在可用选项中选择“系统”。右键点击它并寻找 `系统类型` 选项，它应该说明你的电脑使用的是
    32 位还是 64 位操作系统。


    ### 重要：Visual C++


    你还需要在电脑上安装 Visual C++ 2010 SP1 Re-ributable Package x86 或 x64。该网页将为你提供与你的操作系统类型（32
    位或 64 位）相应的链接，强烈建议在安装 WAMP 之前先在你的电脑上下载并安装该软件包。


    下载完成后，运行安装程序。


    一旦安装了 WAMP，你应该会在 Windows 系统托中看到一个新图标。WAMP 的图标会在三种不同的颜色之间切换，代表其服务的当前状态：


    *   红色 – Apache 和 MySQL 均离线状态。这可能是因为尚未告诉它们启动，或者由于致命的配置问题阻止了它们的启动。

    *   橙色 – 其中一个服务启动失败。这通常表示存在细小的配置问题，例如未正确加载扩展库，或者默认端口被另一个程序占用。如果发生这种情况，强烈建议你向该产品的帮助台或论坛寻求帮助。

    *   绿色 – 服务正在运行且没有发生错误；一切正常。


    你可以左键点击 WAMP 图标，将看到许多与服务交互的选项。这些选项允许你：


    *   管理你的 Apache 和 MySQL 服务

    *   切换在线/离线

    *   安装并切换 Apache、MySQL 和 PHP 版本

    *   访问你的日志文件

    *   访问你的设置

    *   创建别名


    右键点击图标可以退出程序、更改程序语言并访问 WAMP 网站上的帮助页面。


    ### 提示：80 端口问题


    WAMP 最常见的问题是 80 端口（连接 Apache 服务器的端口）可能已被另一个程序占用。例如，如果你在启动 WAMP 时运行 Skype，可能会遇到此错误，因为
    Skype 也使用 80 端口。要解决这个问题，建议你完全关闭 Skype 然后重启 WAMP。该问题的解决方案可以在 [Stack Overflow](https://stackoverflow.com/a/4705033)
    上找到。


    要检查本地服务器是否安装和配置正确，打开你的浏览器并在其地址栏中输入 `localhost` 或 `127.0.0.1`。你应该看到 WAMP 的主页。


    ![WAMP 的主页](img/wplash.png)


    图 1.1. WAMP 的主页


    ### Mac OS X


    对于 Mac 用户，有一个简单的一键应用程序可以在你的电脑上设置带有 PHP 的本地服务器，称为 MAMP。与 Windows 一样，你也可以使用 XAMP，但
    MAMP 是更流行的选择，因为它的开发专注于为希望使用 PHP 开发网站的人提供完美的设置。


    首先，你需要从 [MAMP 网站](http://www.mamp.info/en/index.html) 下载应用程序，一旦文件下载完成，打开 .pkg
    文件，这将启动安装过程。


    ### 注意：MAMP Pro


