    \ to B';\n} else {\n    echo 'A is not equal to B';\n}\n```\n\n### elseif Statement\n\
    \nAnother partner is the `elseif` statement. As its name suggests, `elseif` is\
    \ a combination of `if` and `else`. It has a condition, and PHP checks the condition\
    \ if the `if` condition was found to be false.\n\nMultiple `elseif` statements\
    \ can be used together to test for different conditions, and PHP checks each one\
    \ until one of the conditions is found to be true. Once a true condition is found,\
    \ PHP will skip the rest of the `elseif` statements in the chain.\n\n```\n<?php\n\
    if ($a == $b) {\n    echo 'A is equal to B';\n} elseif ($a == $c) {\n    echo\
    \ 'A is equal to C';\n} elseif ($a == $d) {\n    echo 'A is equal to D';\n} else\
    \ {\n    echo 'A is not equal to anything';\n}\n```\n\n## switch Statement\n\n\
    If you take a closer look at our `elseif` example you may notice that each condition\
    \ basically tests for the same thing—whether the value of some variable is equal\
    \ to the value of `$a`. PHP's `switch` statement can do something similar, and\
    \ also looks a bit less cluttered.\n\n```\nswitch ($a) {\n    case $b:\n     \
    \   echo 'A equals B';\n        break;\n    case $c:\n        echo 'A equals C';\n\
    \        break;\n    case $d:\n        echo 'A equals D';\n        break;\n  \
    \  default:\n        echo 'A is not equal to anything';\n        break;\n}\n```\n\
    \nIn the example above, PHP takes the value provided at the start of the `switch`\
    \ (the value of `$a`) and compares it to the value of each `case`. The matching\
    \ clause is the one that is executed. The `default` case is executed if none of\
    \ the other cases match.\n\nOnce PHP finds a matching clause, it starts executing\
    \ the code below and continues until it sees the `break` keyword, after which\
    \ it will jump to the end of the `switch` statement and merrily continue on executing\
    \ the rest of our script.\n\n### Note: Watch for the Break\n\nPHP doesn't see\
    \ the start of one `case` as the end of the previous `case`, which is why the\
    \ `break` keyword is necessary. This might be confusing at first, and there will\
    \ be likely be times that you forget to use `break` and your scripts don't do\
    \ what you intend, so it's important to keep this in mind.\n\nThis behavior also\
    \ means that we can write code that executes for multiple cases, like so:\n\n\
    ```\nswitch ($a) {\n    case $b:\n    case $c:\n    case $d:\n        echo 'A\
    \ equals B, C, or D';\n        break;\n    default:\n        echo 'A is not equal\
    \ to anything';\n}  \n```\n\nConditional statements give us the ability to write\
    \ dynamic scripts that execute differently according to different circumstances.\
    \ I encourage you to practice writing some conditional statements of your own,\
    \ and to read the [official PHP documentation](http://www.php.net/manual/en/language.control-structures.php).\n\
    \n## Loops\n\nLoops in PHP allow us to write one set of statements and have them\
    \ execute multiple times over. For example, suppose we want to display all of\
    \ the numbers counting from 1 to 100. Of course we could write 100 lines of code,\
    \ each using `echo` to output a different number, but a better way would be to\
    \ write a loop that repeatedly executes a single `echo` statement but with a number\
    \ that increments each time until all 100 numbers are displayed.\n\n### for Loop\n\
    \nThe `for` loop is a generic looping mechanism that uses a variable to keep track\
    \ of its progress and has four main parts: variable initialization (setting a\
    \ tracking variable or counter to a known starting value), condition (PHP will\
    \ continue to execute the loop as long as this condition holds true), an increment\
    \ or decrement (adjusting the value of the counter to mark the progress of the\
    \ loop), and a block of statements to repeat over.\n\nWhile that might seem complex\
    \ and lengthy, it's really quite succinct in code, as this example shows:\n\n\
    ```\nfor ($i = 1; $i < 101; $i = $i + 1) {\n    echo $i . '<br>';\n}  \n```\n\n\
    So how does PHP execute this code? Well, it starts by setting the variable `$i`\
    \ with the value of 1. Then it looks at the condition and determines that 1 is\
    \ indeed less than 101 and executes the loop's block. The block only has one statement\
    \ in our example, `echo` which outputs \"1\" followed by an HTML line break tag.\
    \ After it executes all of the statements in the block, PHP goes back up to the\
    \ start of the `for` loop to execute the third part, `$i = $i + 1`. This has the\
    \ effect of updating our tracking variable to 2. Again the condition is checked,\
    \ 2 is less than 101, and the block is executed. This time around, `echo` outputs\
    \ the value \"2\". PHP keeps repeating the loop until `$i` reaches 101 (which\
    \ makes the condition false because the value of `$i` is then equal to, not less\
    \ than, 101) and then breaks out of the loop.\n\n### while Loop\n\n`while` loops\
    \ work in an almost identical fashion to `for` loops, with the exception being\
    \ that they only require the condition at their start. It's our responsibility\
    \ as programmers to set the initial value of our tracking variable before the\
    \ start of the loop and then adjust it within the loop's statements.\n\n```\n\
    $i = 1;\nwhile ($i < 101){\n    echo $i . '<br>';\n    $i = $i + 1;\n}  \n```\n\
    \nPHP first sets `$i` to 1 in our first statement, and then starts the `while`\
    \ loop as our second. It checks the condition (which is true) and continues to\
    \ execute the two statements that make up the loop's body; the value of `$i` is\
    \ outputted and then increased in preparation for the next round of execution.\n\
    \n### Note: Have an Escape Plan\n\nAn all-too-common mistake when working with\
    \ loops is to forget to adjust the counter. If the value never changes then the\
    \ condition will always stay true; the loop will never stop repeating! When you\
    \ write a loop, always make sure that you've a way for it to stop at some point.\n\
    \n### foreach\n\nWhere the `for` and `while` loops made use of an explicit condition,\
    \ PHP's `foreach` loop operates in a different way. It takes a multi-key variable\
    \ (an array for example) and executes a set of statements for each element.\n\n\
    ```\n$myArray = array('Hello', 'World');\nforeach ($myArray as $value) {\n   \
    \ echo $value . '<br>';\n}  \n```\n\nFor each member in the array `$myArray`,\
    \ PHP assigns its value to the `$value` variable making it available to statements\
    \ that make up the loop's body.\n\nThere's a second variation on the `foreach`\
    \ loop that's handy to know. We can also access the key of the current element\
    \ along with the value if we write it like so:\n\n```\n$myArray = array(1 => 'Hello',\
    \ 2 => 'World');\nforeach ($myArray as $key => $value) {\n    echo $key . ': '\
    \ . $value . '<br>';\n}\n```"
