    ## About Callum Hopkins


    Callum is a web developer by trade and a designer by passion. Armed with knowledge
    in both design and development processes, he is able to influence both sides of
    the web building process. His passion for complex coding functions and beautiful
    design and functionality drives him to seek out new ways to build, design and
    optimize web based solutions for clients around the world.


    ## About SitePoint


    SitePoint specializes in publishing fun, practical, and easy-to-understand content
    for web professionals. Visit [http://www.sitepoint.com/](http://www.sitepoint.com/)
    to access our blogs, books, newsletters, articles, and community forums. You’ll
    find a stack of information on JavaScript, PHP, Ruby, mobile development, design,
    and more.


    ## About Jump Start


    Jump Start books provide you with a rapid and practical introduction to web development
    languages and technologies. Typically around 150 pages in length, they can be
    read in a weekend, giving you a solid grounding in the topic and the confidence
    to experiment on your own.


    ***


    To all my family and friends, thank you for your continued support, and I love
    you all.


    PHP is considered as one of the most popular web based languages. At its core,
    PHP was designed to help enhance web pages and make their content dynamic, but
    over the years PHP has evolved in something much more useful than this. With PHP,
    developers are easily able to build complex applications, such as forums, picture
    galleries and a whole lot more.


    In this book, *Jump Start PHP*, we will teach you the basics to writing and developing
    in PHP and will guide from building basic PHP web pages with dynamic content,
    to building interactive web based applications. We''ll address issues such as
    security, database interaction and setting up developer environments for building
    your PHP applications.


    Throughout *Jump Start PHP*, we will work on an ongoing project, a small but robust
    blogging application, which will apply the theory discussed in each chapter to
    a real development scenario. This project will incorporate some useful functionality
    (a front-end to display posts, comments, and administrative tools) and will hopefully
    help to demonstrate the concepts we discuss throughout the book.


    ## Who Should Read This Book


    Developers seeking a rapid introduction to PHP. You''ll need to know HTML and
    CSS, and experience with other programming languages would be useful.


    ## Conventions Used


    You’ll notice that we’ve used certain typographic and layout styles throughout
    this book to signify different types of information. Look out for the following
    items.


    ### Code Samples


    Code in this book will be displayed using code blocks:


    ```php

    if (condVar > someVal) {console.log("xxx")}

    ```

