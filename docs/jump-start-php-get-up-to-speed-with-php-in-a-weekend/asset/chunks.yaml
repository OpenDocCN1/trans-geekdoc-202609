    \n## Templates\n\nAs we discussed in the [first chapter](#ch01.html \"Chapter\
    \ 1Server Kick-Start\"), PHP files can handle both PHP code and HTML, which makes\
    \ it ideal for introducing new coders who have experience with HTML to the world\
    \ of server-side development. But when you start building and complex applications,\
    \ mixing PHP and HTML code together can cause confusion. And in larger development\
    \ teams, there may be team members who specialize in front-end development and\
    \ those who specialize in back-end development. Mixing front-end code with back-end\
    \ code in such environments can cause complications as team members try not to\
    \ get in each others' way.\n\nTemplating allows us to separate our front-end display\
    \ logic from the data crunching processes that run on the back-end. There are\
    \ a few programming patterns built around OOP that encourage templating, the most\
    \ famous being the MVC (Model-View-Controller) architecture pattern, which appears\
    \ in several well-known frameworks, such as [CakePHP](http://cakephp.org/), [Zend\
    \ Framework](http://framework.zend.com/), and [CodeIgniter](http://ellislab.com/codeigniter).\
    \ The MVC pattern separates code into different areas of concern allowing us to\
    \ better organize our code base.\n\nThere are a few types of templating we can\
    \ perform, but the simplest relies on loading a PHP file that's mainly made up\
    \ of HTML code. The purpose of any snippet of PHP that may be interspersed around\
    \ the file is only to display the content of a variable. We set the variable elsewhere\
    \ in a PHP-only file, and then include the template for it to manage the display.\
    \ Let's look at an example.\n\nFirst, the template file would look like this:\n\
    \n```\n<?php\n<html>\n <head>\n  <title><?php echo $pageTitle; ?></title>\n </head>\n\
    \ <body>\n  <ul>\n<?php foreach ($array as $item) {?>\n   <li><?php echo $item;\
    \ ?></li>\n<?php } ?>\n  </ul>\n </body>\n</html>\n```\n\nThen, a PHP script would\
    \ set the variables and include the template, like so:\n\n```\n<?php\n$pageTitle\
    \ = 'My Template Example';\n$array = array('one', 'two', 'three');\nrequire 'path/to/template.php';\n\
    ```\n\nWhen the template is included, it inherits the scope of the calling file\
    \ and has access to all the variables, functions, classes, etc. that the calling\
    \ file possesses.\n\nThe advantages of using this method of templating are:\n\n\
    *   It's simple to implement. It doesn't require a special third-party template-rendering\
    \ library to be available to your application.\n\n*   Templates can still process\
    \ PHP. The template can still loop through arrays, call functions, etc.\n\nHowever,\
    \ there are also some negatives to using this approach:\n\n*   Front-end developers\
    \ using the templates must know PHP. Any developers working with the templates\
    \ must know PHP and how to develop in it.\n\n*   It's not true templating. Strictly\
    \ speaking, these \"templates\" are not actually templates because they're just\
    \ extra PHP files used to dictate the layout of the data within the application.\n\
    \nAn alternative to is to use special templating libraries that offer their own\
    \ syntax. They're very different from the templates we just discussed because,\
    \ in order to render the template with data, you don't use any PHP. Instead, you\
    \ use special syntax unique to the library that usually looks like a cross between\
    \ PHP and plain text. When the library renders the template, the library replaces\
    \ the special syntax with the data that it represents.\n\nOne famous example of\
    \ templating that takes this approach can be found in [Expression Engine CMS](http://ellislab.com/expressionengine),\
    \ where all the templates contain specific code blocks to display various bits\
    \ of data.\n\n```\n<?php\n<html>\n <head>\n  <title>{% pageTitle %}</title>\n\
    \ </head>\n <body>\n  <ul>\n{% if array as element %}\n   <li>{% element %}</li>\n\
    {% /if %}\n  </ul>\n </body>\n</html>\n```\n\nAdvantages to using this method\
    \ of templating are:\n\n*   There's no need to learn PHP. Front-end developers\
    \ using the templates can be given a list of code blocks to use for requesting\
    \ data from PHP, therefore removing the need to learn PHP coding and its syntax.\n\
    \n*   It uses standard HTML files. The template files can retain their traditional\
    \ HTML file extension.\n\nHowever, there are some disadvantages to using this\
    \ templating approach as well:\n\n*   A rendering library is required. You'll\
    \ need to have a third-party library to process the templates available to your\
    \ application."
