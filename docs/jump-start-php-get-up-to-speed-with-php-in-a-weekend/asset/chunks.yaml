    \ (PDOException $e) {\n    echo $e->getMessage();\n}\n```\n\nMuch of the code\
    \ is the same as before, except the SQL we're sending to MySQL is now an `INSERT\
    \ INTO` command. We're asking MySQL to create a new record in the `users` table\
    \ with the username \"admin\", a password hash, and an email address.\n\n### Note:\
    \ Using MD5\n\nNotice that for the `password` column we used the `MD5()` function\
    \ to hash the data. This is done for security reasons so that anyone who gains\
    \ unauthorized access to our database cannot easily view our users' passwords.\
    \ Never store passwords in plain text!\n\nNavigate to the insert.php file and\
    \ you should again hopefully see a blank page meaning the query has executed successfully,\
    \ otherwise you will see a error message giving insight into what went wrong.\
    \ Head back to phpMyAdmin and look inside the `users` table inside the `kickstartapp`\
    \ database by clicking on the table's name. You should see that the data has been\
    \ inserted into the table.\n\nFinally, let's retrieve data from the table in a\
    \ different PHP script. Create the file getdata.php and add the following code:\n\
    \n```\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\",\n↵ \"\
    USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
    \ \ntry {\n    $queryStr = \"SELECT * FROM users\";\n    $query = $db->prepare($queryStr);\n\
    \    $query->execute();\n    while ($row = $query->fetch()) {\n        echo $row['id']\
    \ . ' - ' . $row['name'] . ' - ' . \n↵$row['email'] . ' - ' . $row['password'];\n\
    \        echo '<br>';\n    }\n    $query->closeCursor();\n} catch (PDOException\
    \ $e) {\n    echo $e->getMessage();\n}\n```\n\nAgain, a lot of this code should\
    \ look familiar, but this time we're sending a `SELECT` command to MySQL, which\
    \ means we'll be receiving data back from the database. The command, as we've\
    \ written it, selects all columns of all of the rows in the `users` table.\n\n\
    The `prepare()` method prepares the query to be sent to the database and returns\
    \ a statement object which we assign to the variable `$query`. This statement\
    \ object has methods which we can use to access the records that are returned\
    \ by MySQL. Then the `execute()` method tells PDO to send the query to MySQL,\
    \ and we're off and running.\n\nThe statement object's `fetch()` method returns\
    \ one record from the database as an array each time it's called (each of the\
    \ columns become a member in the array, and the column names are used as keys\
    \ to access the data). When there are no more records to return, `fetch()` returns\
    \ a Boolean false.\n\nEach time the `while` loop is executed, we assign the database\
    \ record that was returned from `fetch()` to the variable `$row`, and the result\
    \ of the assignment is used as the loop's condition. When a record is returned,\
    \ PHP considers that a true condition and executes the loop's statements. When\
    \ `fetch()` returns false because there are no more records to process, PHP considers\
    \ that a false condition and stops repeating the loop.\n\nFinally, we call the\
    \ `closeCursor()` method which clears out the connection we had between PHP and\
    \ MySQL for the query and frees the memory used by PHP to receive the result set.\
    \ This method isn't always required, but it's good practice and I highly recommend\
    \ using it every time you finish receiving data from a query with PDO.\n\nIf we\
    \ take to our browser and navigate to getdata.php we should see all of the data\
    \ that's in the `users` table. If there is an error in either the PHP code or\
    \ in the SQL sent to MySQL, you'll see a message which should give you some hint\
    \ as to how to fix the issue.\n\n### Summary\n\nIn this chapter we've covered\
    \ the basics of creating a database using phpMyAdmin, creating a table in PHP\
    \ using MySQL commands, inserting a record, and retrieving rows of data from a\
    \ table. However, this is only the tip of the iceberg. Both MySQL and PHP go so\
    \ much deeper than what we've seen here. For more information on MySQL and using\
    \ MySQL with PHP, please see the following resources:\n\n*   [http://dev.mysql.com/doc/](http://dev.mysql.com/doc/)\n\
    \n*   [http://www.sitepoint.com/migrate-from-the-mysql-extension-to-pdo/](http://www.sitepoint.com/migrate-from-the-mysql-extension-to-pdo/)\n\
    \n*   [http://www.php.net/manual/en/book.pdo.php](http://www.php.net/manual/en/book.pdo.php)\n\
    \n*   [http://www.sitepoint.com/avoid-the-original-mysql-extension-1/](http://www.sitepoint.com/avoid-the-original-mysql-extension-1/)\n\
    \nIn this book, we'll be using the **Object Oriented Programming** (OOP) paradigm.\
    \ With OOP, we can create \"objects\" that combine data and the functions that\
    \ operate on that data together. Because objects in OOP collect data and the functions\
    \ that work on them in one place, we keep our code organized and can better manage\
    \ complexity as our application grows.\n\nThe code that we write to define an\
    \ object is called a **class**. One way to better understand the relationship\
    \ between classes and objects is to think of a home builder. The builder—PHP for\
    \ our purposes—follows a blueprint (a class) to build a house (an object).\n\n\
    Just as a builder can construct several houses using the same blueprint, so too\
    \ can PHP create multiple instances of an object. Each house has the same layout,\
    \ but may be painted differently and obviously will have different families living\
    \ in it. In PHP, each object created from the same class has the same functionality,\
    \ but its properties and data that \"live\" inside the object are unique to that\
    \ instance."
