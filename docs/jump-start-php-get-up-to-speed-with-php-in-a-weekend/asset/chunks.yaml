    \ it extends `Pet` and reuses its functionality.\n\n```\n<?php\nrequire_once 'Pet.php';\n\
    \nclass Dog extends Pet\n{\n    public function speak() {\n        return 'Woof!\
    \ Woof!';\n    }\n\n    public function plays() {\n        return 'fetch';\n \
    \   }\n}\n```\n\nAnd just for fun, let's create a few more animal classes. Create\
    \ the file `Cat.php`:\n\n```\n<?php\nrequire_once 'Pet.php';\n\nclass Cat extends\
    \ Pet\n{\n    public function speak() {\n        return 'Meow!';\n    }\n\n  \
    \  public function plays() {\n        return 'chase mice';\n    }\n}\n```\n\n\
    ... and the file `Fish.php`:\n\n```\n<?php\nrequire_once 'Pet.php';\n\nclass Fish\
    \ extends Pet\n{\n}\n```\n\nNow let's test them out. Create the file PetTest.php\
    \ with the following code:\n\n```\n<?php\nrequire 'Dog.php';\nrequire 'Cat.php';\n\
    require 'Fish.php';\n\n$fido = new Dog('Fido');\necho 'The dog\\'s name is: '\
    \ . $fido->name . '<br>';\necho 'The dog says: ' . $fido->speak() . '<br>';\n\
    echo 'The dog plays: ' . $fido->plays() . '<br>';\n\n$mittens = new Cat('Mittens');\n\
    echo 'The cat\\'s name is: ' . $mittens->name . '<br>';\necho 'The cat says: '\
    \ . $mittens->speak() . '<br>';\necho 'The cat plays: ' . $mittens->plays() .\
    \ '<br>';\n\n$bubbles = new Fish('Bubbles');\necho 'The fish\\'s name is: ' .\
    \ $bubbles->name . '<br>';\necho 'The fish says: ' . $bubbles->speak() . '<br>';\n\
    ```\n\nNow things are starting to get interesting! Go ahead and create classes\
    \ that define a `Parrot` class and a `Lizard` class, and update PetTest.php to\
    \ create an instance of each, display their names, and what they might say."
