    \ the definition of a `Pet` class. This will serve as a **base class**, which\
    \ we will then extend with other classes to make specific types of pets, such\
    \ as a dog, cat, fish, lizard, etc.\n\n```\n<?php\nclass Pet\n{\n    public $name;\n\
    \n    public function __construct($name) {\n        $this->name = $name;\n   \
    \ }\n\n    public function speak() {\n        return 'nothing';\n    }\n}\n```\n\
