- fmt: "\nFor our project, we're going to use an easy-to-implement JavaScript Markdown\
    \ converter and editor called [Pagedown](http://code.google.com/p/pagedown/).\
    \ To implement the library you need to load the three Pagedown libraries: `Markdown.Converter`,\
    \ `Markdown.Sanitizer` and `Markdown.Editor`, in that order. Once you have these\
    \ libraries loaded, you initialize the libraries by adding the following code\
    \ to the `<head>` tag in your `header.php` template file:\n\n```\n<script>\n \
    \   (function () {\n        var converter = new Markdown.Converter();\n      \
    \  var editor = new Markdown.Editor(converter);\n        editor.run();\n    }());\n\
    </script>\n```\n\nYou will also need to ensure you have the correct elements to\
    \ load up the editor's format buttons, as well as giving your text area the correct\
    \ class for the libraries to work out where to load the text format code. In addition,\
    \ the libraries need to know where to display the preview of your post while you\
    \ type in the content and the formatting.\n\nWe've already added both of these\
    \ elements and their required classes to the template above. let's take a look\
    \ at the code we added. Here's the code for the formatting buttons and text entry\
    \ :\n\n```\n<div class=\"wmd-panel controls\">\n    <div id=\"wmd-button-bar\"\
    ></div>\n        <textarea class=\"wmd-input\" name=\"post[content]\" \n     \
    \   id=\"wmd-input\">*Start Typing Here*</textarea>\n</div>\n```\n\nAnd the code\
    \ for the preview area:\n\n```\n<section class=\"span4\" style=\"padding-left:20px;\
    \ border-left:1px \nsolid #eee;\">\n    <div id=\"wmd-preview\" class=\"wmd-panel\
    \ wmd-preview\"></div>\n</section>\n```\n\nYou can identify which areas are required\
    \ by the Pagedown libraries by looking for elements that have the prefix `wmd`\
    \ before their ids and/or classes. Once these libraries are loaded, you should\
    \ be able to start typing your post content, as well as some markdown formatting,\
    \ into the editor area, as shown in [Figure 5.2](#ch05.html#admincreate \"Figure\
    \ 5.2. Writing a post in the text editor\").\n\n![Writing a post in the text editor](figures/admin_post_create.png)\n\
    \nFigure 5.2. Writing a post in the text editor\n\nYou should also notice that\
    \ we have a new button added to the top of the template file called Comments.\
    \ This new button, when clicked, will take the user to a comment management panel\
    \ where they can view all the comments added to our posts, as well as delete comments\
    \ they don't want on the blog. To get this running, what we need to do first is\
    \ to create a new table in our database where users' comments will be stored.\
    \ Set up a new table in your database as shown in [Figure 5.3](#ch05.html#commentstable\
    \ \"Figure 5.3. Our comments table\").\n\n![Our comments table](figures/commentstable.png)\n\
    \nFigure 5.3. Our `comments` table\n\nTo get this section of the admin panel up\
    \ and running, let's open up our `admin.php` file in the includes folder again\
    \ and amend the code to the constructor to begin with:\n\n```\npublic function\
    \ __construct() {\n    parent::__construct();\n    if (!empty($_GET['action'])\
    \ && $_GET['action'] == 'delete') {\n        $this->deleteComment();\n    } else\
    \ {\n        $this->listComments();\n    }\n}\n```\n\nAs we can see, our constructor\
    \ now checks for URL variable `action` and checks if it exists, and if it holds\
    \ the string `delete`. If so, our application will load up `deleteComment()` method,\
    \ and if not, it'll load `listComments()` method. So let's build these methods,\
    \ starting with `listComments()`:\n\n```\npublic function listComments() {\n \
    \   $comments = $return = array();\n    $query = $this->db->prepare(\"SELECT *\
    \ FROM comments\");\n    try {\n       $query->execute();\n       for ($i = 0;\
    \ $row = $query->fetch(); $i++) {\n           $return[$i] = array();\n       \
    \    foreach ($row as $key => $rowitem) {\n               $return[$i][$key] =\
    \ $rowitem;\n           }\n       }\n    } catch (PDOException $e) {\n       echo\
    \ $e->getMessage();\n    }\n    $comments = $return;\n    require_once 'templates/managecomments.php';\n\
    }\n```\n\nIn this method, our application loads up all the comments from the comments\
    \ table in our database using PDO. Once the comments are collected from the database,\
    \ they're loaded into an array with a unique key for each comment. If there's\
    \ a problem connecting to the database, or with our database query, our application\
    \ will fire back an error. Finally, the method loads up the template file `managecomments.php`.\
    \ Now we just need to create the `deleteComment()` method:\n\n```\npublic function\
    \ deleteComment() {\n    if (!empty($_GET['id']) && is_numeric($_GET['id'])) {\n\
    \        $query = \"DELETE FROM `comments` WHERE id = ?\";\n        $stmt = $this->db->prepare($query);\n\
    \        $stmt->execute(array($_GET['id']));\n        $delete = $stmt->rowCount();\n\
    \        $this->db = null;\n        if(!empty($delete) && $delete > 0){\n    \
    \        header(\"Location: \".$this->base->url.\"comments.php?delete=success\"\
    );\n        }else{\n            header(\"Location: \".$this->base->url.\"comments.php?delete=error\"\
    );\n        }\n    }\n}\n```\n\nOur `deleteComment()` method is very similar to\
    \ our `deletePost()` method from the `Posts` class except, this time, our application\
    \ is looking for the URL variable `id` to contain the id of the comment in relation\
    \ to its row in our database. We also have an `if` conditional statement to redirect\
    \ back to the admin's comments panel with the correct status message—success or\
    \ error—to let the user know if the attempt to delete a comment has worked or\
    \ not.\n\nOur next step is to create our template to list the comments in our\
    \ admin panel, which we will title `managecomments.php`. Once we've created this\
    \ file, we need to add the following code to our template:\n\n```php\n<?php require_once\
    \ '_inc/header.php'; ?>\n<a href=\"<?php echo $this->base->url . '/posts.php?action=create';\
    \ ?>\" class=\"btn-info\">Create Post</a>\n<a href=\"<?php echo $this->base->url\
    \ . '/comments.php'; ?>\" class=\"btn-info\">Comments</a>\n<table cellpadding=\"\
    10\">\n    <thead>\n        <tr>\n            <td>Commenter</td>\n           \
    \ <td>Post ID</td>\n            <td>Comment</td>\n            <td>Actions</td>\n\
    \        </tr>\n    </thead>\n    <tbody>\n    <?php foreach($comments as $comment):\
    \ ?>\n        <tr>\n            <td><h4><?php echo htmlspecialchars($comment['name']);\
    \ ?></h4></td>\n            <td><p><?php echo htmlspecialchars($comment['email']);\
    \ ?></p></td>\n            <td><p><?php echo htmlspecialchars($comment['comment']);\
    \ ?></p></td>\n            <td><a href=\"<?php echo $this->base->url . \"/comments.php?id=\"\
    \ . htmlspecialchars($comment['id']) . \"&action=delete\"; ?>\" class=\"btn btn-primary\"\
    >Delete Comment</a></td>\n        </tr>\n    <?php endforeach; ?>\n    </tbody>\n\
    </table>\n<?php require_once '_inc/footer.php'; ?>\n```\n\nWith that code added,\
    \ you should now have a working admin panel, as shown in [Figure 5.4](#ch05.html#adminpanel\
    \ \"Figure 5.4. Our admin panel in action\"). Feel free to use the admin panel\
    \ to create some posts.\n\n![Our admin panel in action](figures/admin_panel.png)\n\
    \nFigure 5.4. Our admin panel in action\n\nOnce you've finished testing your admin\
    \ panel, it's time to add the finishing touches to our blog platform, and start\
    \ creating the final functionality for the front-end section of our project.\n\
    \nFirst, we need to add a new library to our front end so that the public side\
    \ of our blog converts the markdown formatting into valid HTML. To do this, we\
    \ add Michel Fortin's [PHP markdown library](http://michelf.ca/projects/php-markdown/).\
    \ This is very easy to install and will render our markdown perfectly, plus it's\
    \ written in pure PHP, so we don't need to worry about installing additional software\
    \ on our server. We just need to call the library when we want to convert markdown\
    \ formatting to HTML.\n"
