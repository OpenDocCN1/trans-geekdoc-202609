    \n```php\nswitch ($a) {\n    case $b:\n    case $c:\n    case $d:\n        echo\
    \ 'A equals B, C, or D';\n        break;\n    default:\n        echo 'A is not\
    \ equal to anything';\n```\n\n### for 语句\n\n`for` 循环用于执行特定次数的块块。它包含三部分：初始化、条件和递增/递减。\n\
    \n```php\nfor ($i = 0; $i < 10; $i++) {\n    echo $i . '<br>';\n}\n```\n\n在上面的示例中，`$i\
    \ = 0` 是初始化，`$i < 10` 是条件（当此为真时循环继续），而 `$i++` 是递增，在每次迭代后增加 `$i`。\n\n### while\
    \ 语句\n\n`while` 循环在指定条件为真时执行代码块。它在你不知道循环应该运行多少次时非常有用。\n\n```php\n$i = 0;\nwhile\
    \ ($i < 10) {\n    echo $i . '<br>';\n    $i++;\n}\n```\n\n### do-while 语句\n\n\
    `do-while` 循环与 `while` 循环相似，但有一个关键区别：在检查条件之前，代码块至少执行一次。\n\n```php\n$i = 0;\ndo\
    \ {\n    echo $i . '<br>';\n    $i++;\n} while ($i < 10);\n```\n\n### foreach\
    \ 语句\n\n`foreach` 循环用于遍历数组的元素。它是 PHP 中处理数组最方便的方法。\n\n```php\n$colors = array(\"\
    red\", \"green\", \"blue\");\nforeach ($colors as $color) {\n    echo $color .\
    \ '<br>';\n}\n```\n\n你也可以在 `foreach` 循环中同时访问键和值：\n\n```php\n$colors = array(\"\
    a\" => \"red\", \"b\" => \"green\", \"c\" => \"blue\");\nforeach ($colors as $key\
    \ => $value) {\n    echo \"$key: $value<br>\";\n}\n```\n"
- fmt: "\nFor more information on `while`, `for`, and `foreach` loops, please see\
    \ the [PHP official documentation](http://www.php.net/manual/en/language.control-structures.php)\
    \ as well as the resources below:\n\n* [http://www.sitepoint.com/loops/](http://www.sitepoint.com/loops/)\n\
    * [http://webcheatsheet.com/PHP/loops.php](http://webcheatsheet.com/PHP/loops.php)\n\
    \n## Databases, MySQL, and PHP\n\nWhen we create a PHP web application, more often\
    \ than not we require some of the data created in our script to be saved somewhere\
    \ for future access. A database allows us to store large amounts of different\
    \ types of data, from large alphanumeric strings to serialized arrays. MySQL is\
    \ the most popular open source database available, and it works incredibly well\
    \ with PHP to store our application's data. It's very easy to get up and running\
    \ and only requires a few functions to store and retrieve data.\n\nTraditional\
    \ databases like MySQL use tables, rows, and columns to organize data. Each table\
    \ holds a set of records (user information, order summaries, etc.), each row in\
    \ a table stores a specific record, and each column identifies a different piece\
    \ of data that makes up the record. A database table can be envisioned like [Figure\
    \ 2.3](#ch02.html#dbtable \"Figure 2.3. A database table\").\n\n![A database table](figures/dbtable.png)\n\
    \nFigure 2.3. A database table\n\n### Note: Think About Data Types\n\nSince each\
    \ column in a table is only allowed to store one type of data, and this is often\
    \ part of the column's definition, it's important to think about the different\
    \ properties of the data that you'll be storing beforehand.\n\nBefore continuing,\
    \ it's important that you're familiar yourself with the purpose of databases and\
    \ the basics of MySQL. If you're unsure about any of that, please read the [MySQL\
    \ article on tizag.com](http://www.tizag.com/mysqlTutorial).[http://www.tizag.com/mysqlTutorial](http://www.tizag.com/mysqlTutorial)\n\
    \nThere are two extensions for working with MySQL in PHP—`MySQLi` and `PDO`. We're\
    \ going to use the `PDO` extension to connect to and interact with our MySQL database,\
    \ so make sure the extension is installed and enabled. Open the file `info.php`\
    \ we wrote in [Chapter 1](#ch01.html \"Chapter 1Server Kick-Start\"), look for\
    \ the section titled `PDO`, and make sure that MySQL is listed in the enabled\
    \ column.\n\n### Note: Problems Installing PDO\n\nIf you have problems enabling\
    \ the extension, check out the [PHP Manual's guide to installing PDO](http://php.net/manual/en/pdo.installation.php).\n\
    \nThe highly popular `phpMyAdmin` is a PHP application that makes managing multiple\
    \ databases a breeze. With this in mind, it's highly recommended that you make\
    \ sure `phpMyAdmin` is installed on your server. We'll be using it to manage our\
    \ database throughout this book.\n\nTo get started, we need to create a new empty\
    \ database using `phpMyAdmin`. To do this, open your installation of `phpMyAdmin`\
    \ in your browser and log in. You should be welcomed with a screen similar to\
    \ the following:\n\n![phpMyAdmin](figures/phpmyadmin.png)\n\nFigure 2.4. phpMyAdmin\n\
    \nNext, click on the `Databases` link in the top menu. In the next screen we can\
    \ create our new database by typing the name of the database we want to use. For\
    \ our project, let's type \"kickstartapp\" into the text field and hit the create\
    \ button.\n\n![Creating our databases](figures/createdb.png)\n\nFigure 2.5. Creating\
    \ our databases\n\n### Note: Collation?\n\nDon't worry about the drop-down option\
    \ which should be preselected to \"Collation\". This is a more advanced feature\
    \ and, for the purposes of the book's project, we'll be sticking to the default\
    \ options. If you'd like to read up about database collation types, please see:\n\
    \n* [http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html](http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html)\n\
    * [https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs](https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs)\n\
    \n### Note: Take Care When Naming your Databases\n\nWhen we create a database,\
    \ its name cannot contain slashes, periods, or other characters that are not permitted\
    \ in file names, and should not contain spaces.\n\nThose with a keen eye may have\
    \ noticed that our newly created database has been added to the list of accessible\
    \ databases. This list on the left-hand menu is a collection of quick links that\
    \ we can use to select which database we want to edit or manage. Find the new\
    \ database \"kickstartapp\" in the list and click on it. This will take us to\
    \ a new screen which will look fairly empty and similar to [Figure 2.6](#ch02.html#newdb\
    \ \"Figure 2.6. Our new database\"):\n\n![Our new database](figures/newdb.png)\n\
    \nFigure 2.6. Our new database\n\nThis is the main area of `phpMyAdmin` where\
    \ we can create tables and edit existing ones for our database. But before we\
    \ do this, we need to create a user account which will be used to connect to the\
    \ database and store and extract our data.\n\nHead to the `Privileges` option\
    \ in the top menu and click on it, then, in the new panel, select `Add User`,\
    \ as shown in [Figure 2.7](#ch02.html#adduser \"Figure 2.7. Adding a new user\"\
    ).\n\n![Adding a new user](figures/addnew.png)\n\nFigure 2.7. Adding a new user\n\
    \nNow we just need to enter a user name into the field `User name` (make sure\
    \ use text field is also selected from the drop-down menu), select local in the\
    \ `Host` drop-down and then enter a password into the `password` fields (again\
    \ making sure use text field is selected). Next, scroll down and make sure `Grant\
    \ all privileges on database kickstartapp` is checked in the next option area\
    \ in the panel. Finally, select `Check all` under `Global privileges` in the final\
    \ panel and hit `Add User` at the bottom of the panel.\n\n![New user fields](figures/newuserfields.png)\n\
    \nFigure 2.8. New user fields\n\nThat might seem a bit complex, but actually all\
    \ we did was create a new user and give that user the right to do anything to\
    \ \"kickstartapp\". This setup is the most common for users, but not necessarily\
    \ the most secure. You can change the user privileges to be more restrictive.\
    \ For more information on setting up database users, please see:\n\n* [http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html](http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html)\n\
    * [https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs](https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs)\n\
    \nNow that we have a user account set up, let's create a table in our database.\
    \ Create a new PHP script in our project folder named `setup.php`. In this file,\
    \ add the following code and then save and run the file through the browser.\n\
    \n### Note: Customize Your Code\n\nReplace the text `USERNAME` and `PASSWORD`\
    \ in the following code with the username and password you set when you created\
    \ your user for the database.\n\n```php\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\"\
    ,\n \"USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
    try {\n    $queryStr = \"CREATE TABLE users (id INTEGER NOT NULL\nAUTO_INCREMENT\
    \ PRIMARY KEY, name VARCHAR(40), password\nVARCHAR(100), email VARCHAR(150))\"\
    ;\n    $db->query($queryStr);\n} catch (PDOException $e) {\n    echo $e->getMessage();\n\
    }\n```\n\nFirst we connect to MySQL on PHP by creating a `PDO` object with four\
    \ key pieces of information. The first tells PHP where our MySQL database is located.\
    \ In our case, this is \"localhost\" as the MySQL server is running on the same\
    \ system that PHP is running on. The second identifies which database we want\
    \ to connect to. Together, these two bits of information are combined with `mysql:`\
    \ to create what is called a DSN, or Data Source Name. The third and fourth arguments\
    \ are simply the username and password for the database user we created.\n"
  raw: "For more information on `while`, `for`, and `foreach` loops, please see the\
    \ [PHP official documentation](http://www.php.net/manual/en/language.control-structures.php)\
    \ as well as the resources below:\n\n*   [http://www.sitepoint.com/loops/](http://www.sitepoint.com/loops/)\n\
    \n*   [http://webcheatsheet.com/PHP/loops.php](http://webcheatsheet.com/PHP/loops.php)\n\
    \n## Databases, MySQL, and PHP\n\nWhen we create a PHP web application, more often\
    \ than not we require some of the data created in our script to be saved somewhere\
    \ for future access. A database allows us to store large amounts of different\
    \ types of data, from large alphanumeric strings to serialized arrays. MySQL is\
    \ the most popular open source database available, and it works incredibly well\
    \ with PHP to store our application's data. It's very easy to get up and running\
    \ and only requires a few functions to store and retrieve data.\n\nTraditional\
    \ databases like MySQL use tables, rows, and columns to organize data. Each table\
    \ holds a set of records (user information, order summaries, etc.), each row in\
    \ a table stores a specific record, and each column identifies a different piece\
    \ of data that makes up the record. A database table can be envisioned like [Figure 2.3](#ch02.html#dbtable\
    \ \"Figure 2.3. A database table\").\n\n ![A database table](figures/dbtable.png)\n\
    \nFigure 2.3. A database table\n\n### Note: Think About Data Types\n\nSince each\
    \ column in a table is only allowed to store one type of data, and this is often\
    \ part of the column's definition, it's important to think about the different\
    \ properties of the data that you'll be storing beforehand.\n\nBefore continuing,\
    \ it's important that you're familiar yourself with the purpose of databases and\
    \ the basics of MySQL. If you're unsure about any of that, please read the [MySQL\
    \ article on tizag.com](http://www.tizag.com/mysqlTutorial).[http://www.tizag.com/mysqlTutorial](http://www.tizag.com/mysqlTutorial)\n\
    \nThere are two extensions for working with MySQL in PHP—MySQLi and PDO. We're\
    \ going to use the PDO extension to connect to and interact with our MySQL database,\
    \ so make sure the extension is installed and enabled. Open the file info.php\
    \ we wrote in [Chapter 1](#ch01.html \"Chapter 1Server Kick-Start\"), look for\
    \ the section titled PDO, and make sure that MySQL is listed in the enabled column.\n\
    \n### Note: Problems Installing PDO\n\nIf you have problems enabling the extension,\
    \ check out the [PHP Manual's guide to installing PDO](http://php.net/manual/en/pdo.installation.php).\n\
    \nThe highly popular phpMyAdmin is a PHP application that makes managing multiple\
    \ databases a breeze. With this in mind, it's highly recommended that you make\
    \ sure that phpMyAdmin is installed on your server. We'll be using it to manage\
    \ our database throughout this book.\n\nTo get started, we need to create a new\
    \ empty database using phpMyAdmin. To do this, open your installation of phpMyAdmin\
    \ in your browser and log in. You should be welcomed with a screen similar to\
    \ the following:\n\n ![phpMyAdmin](figures/phpmyadmin.png)\n\nFigure 2.4. phpMyAdmin\n\
    \nNext, click on the Databases link in the top menu. In the next screen we can\
    \ create our new database by typing the name of the database we want to use. For\
    \ our project, let's type \"kickstartapp\" into the text field and hit the create\
    \ button.\n\n ![Creating our databases](figures/createdb.png)\n\nFigure 2.5. Creating\
    \ our databases\n\n### Note: Collation?\n\nDon't worry about the drop-down option\
    \ which should be preselected to \"Collation\". This is a more advanced feature\
    \ and, for the purposes of the book's project, we'll be sticking to the default\
    \ options. If you'd like to read up about database collation types, please see:\n\
    \n*   [http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html](http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html)\n\
    \n*   [https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs](https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs)\n\
    \n### Note: Take Care When Naming your Databases\n\nWhen we create a database,\
    \ its name cannot contain slashes, periods, or other characters that are not permitted\
    \ in file names, and should not contain spaces.\n\nThose with a keen eye may have\
    \ noticed that our newly created database has been added to the list of accessible\
    \ databases. This list on the left-hand menu is a collection of quick links that\
    \ we can use to select which database we want to edit or manage. Find the new\
    \ database \"kickstartapp\" in the list and click on it. This will take us to\
    \ a new screen which will look fairly empty and similar to [Figure 2.6](#ch02.html#newdb\
    \ \"Figure 2.6. Our new database\"):\n\n ![Our new database](figures/newdb.png)\n\
    \nFigure 2.6. Our new database\n\nThis is the main area of phpMyAdmin where we\
    \ can create tables and edit existing ones for our database. But before we do\
    \ this, we need to create a user account which will be used to connect to the\
    \ database and store and extract our data.\n\nHead to the Privileges option in\
    \ the top menu and click on it, then, in the new panel, select Add User, as shown\
    \ in [Figure 2.7](#ch02.html#adduser \"Figure 2.7. Adding a new user\").\n\n ![Adding\
    \ a new user](figures/addnew.png)\n\nFigure 2.7. Adding a new user\n\nNow we just\
    \ need to enter a user name into the field User name (make sure use text field\
    \ is also selected from the drop-down menu), select local in the Host drop-down\
    \ and then enter a password into the password fields (again making sure use text\
    \ field is selected). Next, scroll down and make sure Grant all privileges on\
    \ database kickstartapp is checked in the next option area in the panel. Finally,\
    \ select Check all under Global privileges in the final panel and hit Add User\
    \ at the bottom of the panel.\n\n ![New user fields](figures/newuserfields.png)\n\
    \nFigure 2.8. New user fields\n\nThat might seem a bit complex, but actually all\
    \ we did was create a new user and then give that user the right to do anything\
    \ to the database \"kickstartapp\". This setup is the most common for users of\
    \ databases, but not necessarily the most secure. You can change the user privileges\
    \ to be more restrictive if you like. For more information on setting up database\
    \ users, please see:\n\n*   [http://dev.mysql.com/doc/refman/5.1/en/adding-users.html](http://dev.mysql.com/doc/refman/5.1/en/adding-users.html)\n\
    \n*   [https://kb.mediatemple.net/questions/788/HOWTO%3A+GRANT+privileges+in+MySQL#dv](https://kb.mediatemple.net/questions/788/HOWTO%3A+GRANT+privileges+in+MySQL#dv)\n\
    \nNow that we have a user account set up, let's create a table in our database.\
    \ Create a new PHP script in our project folder named setup.php. In this file,\
    \ add the following code and then save and run the file through the browser.\n\
    \n### Note: Customize Your Code\n\nReplace the text `USERNAME` and `PASSWORD`\
    \ in the following code with the username and password you set when you created\
    \ your user for the database.\n\n```\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\"\
    ,\n↵ \"USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
    \ \ntry {\n    $queryStr = \"CREATE TABLE users (id INTEGER NOT NULL \n↵AUTO_INCREMENT\
    \ PRIMARY KEY, name VARCHAR(40), password \n↵VARCHAR(100), email VARCHAR(150))\"\
    ;\n    $db->query($queryStr);\n} catch (PDOException $e) {\n    echo $e->getMessage();\n\
    }\n```\n\nFirst we connect to MySQL on from PHP by creating a `PDO` object with\
    \ four key pieces of information. The first tells PHP where our MySQL database\
    \ is located. In our case, this is \"localhost\" as the MySQL server is running\
    \ on the same system that PHP is running on. The second identifies which database\
    \ we want to connect to. Together, these two bits of information are combined\
    \ with `mysql:` to create what is called a **DSN**, or Data Source Name. The third\
    \ and fourth arguments are simply the username and password for the database user\
    \ we created."
