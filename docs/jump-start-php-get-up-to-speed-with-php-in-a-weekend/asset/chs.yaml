  \ `method` 属性被设置为 `POST` 时生效。`enctype` 有三个可能的值：`application/x-222-form-urlencoded`、`multipart/form-data`\
  \ 和 `text/plain`。第一个选项会对表单提交的所有内容进行编码，因此所有空格都会编码为 `+`，所有其他特殊字符都将转换为 ASCII 十进制值。第二种选项不对任何表单数据进行编码。如果你的表单包含任何类型的文件上传控件或处理，这一点是关重要的。最后一种选项会将提交数据中的空格转换为\
  \ `+`，但不会编码任何特殊字符。在编写表单时应当评估这些选项，因为它们将对数据到达 `action` 属性 URL 时的状态起重要作用。\n\n有两个属性可以设置在任何表单元素上，在用\
  \ PHP 脚本处理数据时也非常重要：\n\n*   `name` – `name` 属性值是一个标识符，用于在数据发送到目标 URL 时收集数据。例如，如果我们有一个元素\
  \ `<input type=\"text\" name=\"data\" />`，用户为此输入的值将可以在服务器上的数组中可用，并可以使用数组键 `'data'`\
  \ 进行引用。\n\n*   `value` – `value` 属性用于设置表单中每个元素的信息或数据。你可以使用此属性为元素设置默认值。\n\n这里是一个使用了上述某些属性的示例表单：\n\
  \n```\n<form method=\"post\">\n    <input name=\"myField\" value=\"Hello World\"\
  \ />\n    <button type=\"submit\">submit</button>\n</form>\n```\n\n到目前为止，我们只查看了在\
  \ PHP 中使用表单时涉及的重要部分。然而，你可能会发现自己使用了一些这里未列出的属性和标签。我们讨论的元素涵盖了基础知识，如果你想获取更多关于表单的信息，请随时查看这些外部引用：\n\
  \n*   [`reference.sitepoint.com/html/elements-form`](http://reference.sitepoint.com/html/elements-form)\n\
  *   [`www.tizag.com/htmlT/forms.php`](http://www.tizag.com/htmlT/forms.php)\n* \
  \  [`www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm`](http://www.htmlgoodies.com/tutorials/forms/article.php/3479121/So-You-Want-A-Form-Huh.htm)\n\
  \n## POST 和 GET\n\n每个表单的 `method` 属性允许两个选项：`POST` 和 `GET`。如我们所知，PHP 有一些特殊的预定义变量，例如\
  \ `$_SESSION` 变量。PHP 还有另外专门用于收集 HTML 表单发送数据的预定义变量：`$_POST` 和 `$_GET`，但这些变量也可以用于其他方式——我们稍后会介绍。\n\
  \n现在，让我们通过示例来说明 `POST` 和 `GET` 之间的区别。在我们的实验文件夹中创建新文件：`form.php` 和 `collect.php`。在我们的\
  \ `form.php` 文件中添加以下代码：\n\n```html\n<html\n<<body>\n    <form method=\"post\" action=\"\
  collect.php\">\n        <h1>Form #1</h1>\n        <input name=\"data\" placeholder=\"\
  enter a string\" \ntype=\"text\" />\n        <button type=\"submit\">submit</button>\n\
  \    </form>\n    <form method=\"get\" action=\"collect.php\">\n        <h1>Form\
  \ #2</h1>\n        <input name=\"data\" placeholder=\"enter a string\" \ntype=\"\
  text\" />\n        <button type=\"submit\">submit</button>\n    </form>\n</body>\n\
  </html>\n```\n\n完成了吗？很好。现在请在 `collect.php` 文件中添加以下代码：\n\n```php\n<?php\nif (!empty($_POST['data']))\
  \ {\n    echo 'The following string was sent from form #1: ' . \n$_POST['data'];\n\
  } elseif (!empty($_GET['data'])) {\n    echo 'The following string was sent from\
  \ form #2: ' . \n$_GET['data'];\n}\n```\n\n接下来，在浏览器中打开 `form.php`，在表单 #1 的输入框中输入内容并点击提交。你应该能看到类似\
  \ 图 4.2 的内容：\n\n![向我们的表单输入数据](img/form1.png)\n\n图 4.1. 向我们的表单输入数据\n\n![提交表单的结果](img/form1submit.png)\n\
  \n图 4.2. 提交表单的结果\n\n如果你填写了表单 #2（如图 4.3 所示）并点击提交，你应该看到类似 图 4.4 的内容：\n\n![向表单 #2 输入数据](img/form2.png)\n\
  \n![提交表单的结果](img/form2submit.png)\n\n`POST` 和 `GET` 之间的主要区别在两个表单之间。\n\n![提交表单的结果](img/form1submit.png)\n\
  \n图 4.2. 提交表单的结果\n\n`POST` 和 `GET` 之间的主要区别在两个表单之间。\n\n![提交表单的结果](img/form1submit.png)\n\
  \n图 4.2. 提交表单的结果\n\n\n\n\n首先，让我们快速查看一下 `PHP_SELF`。正如我们讨论过的，PHP 有一些特殊的预定义变量，我们可以在整个脚本中使用它们来完成一些非常特殊的功能。然而，其中一组变量比其他的更为特殊。它们位于\
  \ `$_SERVER` 数组中，该包含了服务器和执行环境的信息，例如标头、路径以及服务器上的脚本位置。我们可以像访问任何其他数组一样访问这些数据。`$_SERVER`\
  \ 数组的键之一就是 `PHP_SELF`，它存储了相对于文档根目录的当前访问的 PHP 文件信息。\n\n为了看到这个 `PHP_SELF` 值的实际效果，让我们在实验文件夹中创建一个名为\
  \ `self.php` 的新文件。在该文件中添加以下代码：\n\n```php\n<?php\necho $_SERVER['PHP_SELF'];\n```\n\
  \n现在，当你在浏览器中查看此文件时，你应该能看到相对于服务器文档根目录的 `self.php` 文件的 URL。\n\n在我们的情况下，这可能是类似于 `\"\
  localhost/experiments/self.php\"` 的内容。我们可以在表单的 `action` 属性中使用 `'PHP_SELF'`，使其提交到\
  \ `self.php`，在那里我们可以使用 `$_POST` 或 `$_GET` 变量检查表单是否传输了数据，然后执行代码进一步处理这些数据。\n\n这是一个示例：\n\
  \n```php\n<?php\nif (!empty($_POST['data'])) {\n    echo 'Form has been submitted';\n\
  \    // 处理来自表单数据的代码\n}\n?>\n<html>\n<body>\n    <form action=\"POST\" action=\"\
  <?php echo $_SERVER['PHP_SELF']; ?>\">\n        <input type=\"text\" name=\"data\"\
  \ type=\"text\" placeholder=\"Type in a string here\" />\n        <button type=\"\
  submit\">submit</button>\n    </form>\n</body>\n</html>\n```\n\n当表单被提交时，PHP 会检测到这一并并执行\
  \ `echo` 命令，这会在我们的浏览器中显示 \"Form has been submitted\" 字符串。`PHP_SELF` 变量对于那些需要提交到显示它们的同一个脚本、并在提交后执行代码处理数据的表单来说非常有用。\n\
  \n在使用 `PHP_SELF` 变量作为表单的 `action` 时，使用 `htmlspecialchars()` 函数过滤掉 URL 中任何不需要的字符非常重要，这有助于防止跨站脚本\
  \ (XSS) 攻击。要在上面的示例中实现此操作，你需要将 `form` 标签更改为：\n\n```html\n<form action=\"POST\" action=\"\
  <?php echo htmlspecialchars($_SERVER['PHP_SELF']); ?>\">\n```\n\n\n\n```php\n<?php\n\
  class Posts {\n    public $db = '';\n    public function __construct() {\n     \
  \   $this->db = new PDO(\"mysql:host=localhost;dbname=testposts\", \n        \"\
  dbuser\", \"dbpass\");\n        $this->db->setAttribute(PDO::ATTR_ERRMODE,\n   \
  \     PDO::ERRMODE_EXCEPTION);\n        $this->index();\n    }\n    public function\
  \ index() {\n        $id = 0;\n        $posts = array();\n        $template = '';\n\
  \        if (!empty($_GET['id'])) {\n            $id = $_GET['id'];\n        }\n\
  \        try {\n            if (!empty($id)) {\n                $query = $this->db->prepare(\"\
  SELECT * FROM posts \nWHERE id = ?\");\n                $params = array($id);\n\
  \                $template = 'single-post.php';\n            } else {\n        \
  \        $query = $this->db->prepare(\"SELECT * FROM posts\");\n               \
  \ $params = array();\n                $template = 'list-posts.php';\n          \
  \  }\n            $query->execute($params);\n            for ($i = 0; $row = $query->fetch();\
  \ $i++) {\n                $posts[] = array('id' => $row['id'], 'content' =>\n$row['content']);\n\
  \            }\n        } catch (PDOException $e) {\n            echo $e->getMessage();\n\
  \        }\n        $query->closeCursor();\n        $db = null;\n        require_once($template);\n\
  \    }\n}\n$posts = new Posts();\n?>\n```\n\n我们在这里所做的是创建一个类 `Posts`。在开始时，我们初始化了\
  \ `PDO` MySQL 连接。接着我们进入 `index` 方法，在该方法中，我们检查 URL 是否包含一个变量，如果有，我们就从 URL 中获取它，并尝试从数据库中获取具有相同\
  \ `id` 的文章。如果没有 URL 变量，我们则直接加载数据库中的所有文章。最后，我们加载与我们执行的数据库查询相关的模板。\n\n接下来，我们需要组合好模板文件来显示从数据库中检索的数据。因此，创建两个新文件——一个命名为\
  \ `list-posts.php`，另一个命名为 `single-post.php`。在 `list-posts.php` 中添加以下代码：\n\n```html\n\
  <h1>List of Blog Posts</h1>\n<?php foreach ($posts as $post): ?>\n    <h3>Post #<?php\
  \ echo htmlspecialchars($post['id']); ?></h3>\n    <?php echo htmlspecialchars($post['content']);\
  \ ?>\n    <a href=\"http://localhost/experiments/posts.php?id=<?php echo \nhtmlspecialchars($post['id']);\
  \ ?>\">Read More</a>\n    <hr/>\n<?php endforeach; ?>\n```\n等等，我漏掉了代码块中的格式。\n\n\
  最后，在我们的 `single-post.php` 文件中这段代码：\n\n```php\n<?php foreach($posts as $post): ?>\n\
  \    <h1>Post #<?php echo htmlspecialchars($post['id']); ?></h1>\n    <hr/>\n  \
  \  <?php echo htmlspecialchars($post['content']); ?>\n    <a href=\"http://localhost/experiments/posts.php>\n\
  Back to Post List</a>\n<?php endforeach; ?>\n```\n\n现在，如果我们导航到 `posts.php` 文件，可以看到有一篇文章列表——在这种情况下是一个特定的文章，因为我们目前数据库中只有一个文章——每篇文章都有一个让我们点击“阅读更多”的链接。点击此链接将我们带到单个文章页面，并显示一个与查看完整文章列表时不同的模板。\n\
  \n这是一个非常短的示例，展示了 `$_GET` 变量如何允许我们动态加载博客文章并与数据库进行交互。我们可以轻松地将示例改为使用 `$_POST` 变量。然而，这样我们就无法共享指向单篇文章的\
  \ URL 了。相反，URL 只会将访问者引导到文章列表，他们必须自己去点击“阅读更多”链接。\n\n这个示例很好地引导我们进入本章的下一节，在下一节中，我们将扩展这段代码段以及之前的代码，并开始构建我们博客平台的核心部分。\n\
  \n## 在我们的平台上进行构建\n\n在这一节中，我们将基于刚刚创建的示例（该示例显示了带有阅读单个文章链接的文章列表）进行构建，并在我们的应用程序中运行它。\n\
  \n让我们对上面的现有代码进行细微调整。修改博客平台文件夹中 includes 目录下的 `posts.php` 文件，使构造函数看起来如下：\n\n```php\n\
  public function __construct() {\n    parent::__construct();\n    $this->comments\
  \ = new Comments();\n    if (!empty($_GET['id'])) {\n        $this->viewPost($_GET['id']);\n\
  \    } else {\n        $this->getPosts();\n    }\n}\n```\n\n通过这段代码，我们的构造函数检查是否存在名为\
  \ `id` 的 URL 变量。如果有，它将继续从该变量收集数据，并传递给 `Blog` 类中的 `viewPost()` 方法。如果没有名为 `id` 的 URL\
  \ 变量，应用程序将被指示加载数据库中的所有文章。这将访问者看到我们所有的文章，然后点击链接查看特定的文章。\n\n我们对 `posts.php` 文件所做的下一个更改是编辑\
  \ `getPosts()` 方法：\n\n```php\npublic function getPosts() {\n    $id = 0;\n    $posts\
  \ = array();\n    $template = '';\n    if (!empty($_GET['id'])) {\n        $id =\
  \ $_GET['id'];\n    }\n    try {\n        if (!empty($id)) {\n            $query\
  \ = $this->db->prepare(\"SELECT * FROM posts \nWHERE id = ?\");\n            $params\
  \ = array($id);\n            $template = 'single-post.php';\n        } else {\n\
  \            $query = $this->db->prepare(\"SELECT * FROM posts\");\n           \
  \ $params = array();\n            $template = 'list-posts.php';\n        }\n   \
  \     $query->execute($params);\n        for ($i = 0; $row = $query->fetch(); $i++)\
  \ {\n            $posts[] = array('id' => $row['id'], 'content' =>\n$row['content']);\n\
  \        }\n    } catch (PDOException $e) {\n        echo $e->getMessage();\n  \
  \  }\n    $query->closeCursor();\n    $db = null;\n    require_once($template);\n\
  }\n```\n\n`getPosts()` 方法用于从数据库收集所有文章以创建一个列表。它使用了 `SELECT * FROM posts` 数据库查询。然后我们使用\
  \ `try` ... `catch` 异常处理器检查数据库查询是否成功。如果查询成功，我们将再次遍历从数据库返回的数组并将结果赋值给键。最后，我们加载 `list-posts.php`\
  \ 模板。\n\n### 警告：显示 PDO 错误消息\n\n像我们在示例中那样输出 PDO 错误消息，在开发期间很有帮助。然而，在生产环境中，这样做可能会带来安全风险。\n\
  \n该类的最后一步是编辑 `viewPost()` 方法：\n\n```php\npublic function viewPost($postId) {\n \
  \   $id = $postId;\n    $posts = array();\n    $template = '';\n    $query = $this->db->prepare(\"\
  SELECT * FROM posts WHERE id = ?\");\n    try {\n        $query->execute(array($id));\n\
  \        for ($i = 0; $row = $query->fetch(); $i++) {\n            $posts[] = array('id'\
  \ => $row['id'], 'content' =>\n$row['content']);\n        }\n    } catch (PDOException\
  \ $e) {\n        echo $e->getMessage();\n    }\n    $query->closeCursor();\n   \
  \ $db = null;\n    require_once($template);\n}\n```\n\n\n\n\n在上述描述的方法中，我们正在加载一些模板文件——因此我们需要着手创建它们。现在，我们可以从零开始构建模板文件，但出于本项目的考虑，我们将使用\
  \ [Twitter Bootstrap 框架](http://twitter.github.io/bootstrap/index.html) 来设计和构建它们。Bootstrap\
  \ 非常适合让 Web 应用程序的 UI 元素快速运行起来，让你专注于构建一个优秀应用程序后端的任务。\n\n如果你擅长自己设置 Bootstrap，请根据你的需要将其实现到项目中。如果你不确定操作流程，别担心——从本书的代码归档中的\
  \ `includes` 文件夹中复制所有内容，你很快就能运行起 Twitter Bootstrap 了。\n\n回到我们的项目，在 `frontend` 文件夹下的\
  \ `templates` 文件夹中创建两个新文件，并命名为 `list-posts.php` 和 `view-post.php`。在 `list-posts.php`\
  \ 中添加以下代码：\n\n```php\n<?php require_once 'includes/temps/header.php'; ?>\n<?php\
  \ foreach ($posts as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']);\
  \ ?></h3>\n        <p><?php echo implode(' ', array_slice(explode(' ', \nstrip_tags($post['content'])),\
  \ 0, 10)); ?> [...]</p>\n        <a href=\"<?php echo $this->base->url.\"/?id=\"\
  .$post['id'];\n ?>\" class=\"btn btn-primary\">Read More</a>\n    <hr/>\n<?php endforeach;\
  \ ?>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\n接下来，在 `view-post.php`\
  \ 文件中添加以下代码：\n\n```php\n<?php require_once 'includes/temps/header.php'; ?>\n<br/>\n\
  <a href=\"<?php echo $this->base->url; ?>\" class=\"btn btn-primary\">\nReturn to\
  \ Post List</a>\n<?php foreach ($posts as $post): ?>\n    <h3>Post #<?php echo htmlspecialchars($post['id']);\
  \ ?></h3>\n        <?php echo htmlspecialchars($post['content']); ?>\n    <hr/>\n\
  <?php endforeach; ?>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\n\
  我们的 `list-post.php` 文件遍历了从数据库中收集的许多文章，为文章内容创建一个短小的摘要，并创建一个指向阅读每篇文章的链接。我们的 `view-post.php`\
  \ 文件显示从数据库加载的单个文章的标题和正文。\n\n`list-post.php` 和 `view-post.php` 看起来都非常简单。然而，你可能在 `list-posts.php`\
  \ 文件中注意到一些不寻常且复杂的代码：\n\n```php\nimplode(' ', array_slice(explode(' ', \nview-post.phpstrip_tags($post['content'])),\
  \ 0, 10));\n```\n\n此行代码结合了多个不同的 PHP 函数，提取出文章内容的前十个单词，以自动创建一个显示在我们的文章列表中的摘要字符串。`strip_tags()`\
  \ 函数移除内容中的任何 HTML 标签，`explode()` 函数在函数每次遇到内容中的空格时都会创建一个新数组和键。接下来，使用 `array_slice()`\
  \ 函数获取由 `explode()` 函数创建的数组中的前十个键。传递给 `array_slice()` 函数的参数 `0` 表示它应该从 `0` 开始计数，并在达到\
  \ `10` 时停止。此外，它还接收了由 `explode()` 函数创建的数组。最后，我们使用 `implode()` 函数将那十个数组值合并为一个字符串。\n\
  \n关于 PHP 中这些函数的更多细节以及它们用途的深入概述，请查看以下资源：\n\n* [`php.net/manual/en/function.strip-tags.php`](http://php.net/manual/en/function.strip-tags.php)\n\
  * [`php.net/manual/en/function.explode.php`](http://php.net/manual/en/function.explode.php)\n\
  * [`php.net/manual/en/function.array-slice.php`](http://php.net/manual/en/function.array-slice.php)\n\
  * [`php.net/manual/en/function.implode.php`](http://php.net/manual/en/function.implode.php)\n\
  \n我们示例应用程序的下一阶段是创建管理员面板和登录面板。我们将后创建。打开 `includes` 目录下的 `login.php` 文件。它位于项目目录的主目录下。从在构造方法中开始添加以下内容：\n\
  \n```php\npublic function __construct() {\n    $this->ksdb = new Database;\n   \
  \ $this->base = (object) '';\n    $this->base->url = \"http://\".$_SERVER['SERVER_NAME'];\n\
  \    $this->index();\n}\n```\n\n本质上，我们的构造方法设置了在整个类中需要的对象和变量。接下来我们需要在 `index()` 方法中添加：\n\
  \n```php\npublic function index() {\n    if ($_SERVER['REQUEST_METHOD'] === 'POST')\
  \ {\n        $this->validateDetails();\n    } elseif (!empty($_GET['status']) &&\
  \ $_GET['status'] == \n'inactive') {\n        $error = 'You have been logged out\
  \ due to inactivity.\n Please log in again.';\n    }\n    require_once 'admin/loginform.php';\n\
  }\n```\n\n\n\n现在我们已经创建了登录类，只需要为我们的登录表单创建一个模板。在 `admin` 文件夹中创建一个名为 `templates` 的目录，并添加一个名为\
  \ `loginform.php` 的新 PHP 文件。\n\n### 注意：关于结构的说明\n\n花时间为管理后台部分创建一个新的头部（header）和页脚（footer）模板文件是值得的。将前端头部和页脚模板文件分离可以在区分前端和管理面板时减少复杂性。有关设置此内容的细节，请查看项目的文件结构。\n\
  \n在 `loginform.php` 文件中，添加以下代码：\n\n```php\n<?php require_once 'includes/temps/header.php';\
  \ ?>\n<br/>\n<?php if (!empty($error)): ?>\n    <div class=\"alert alert-error\"\
  >~<?php echo $error; ?>div>\n<?php endif; ?>\n<br/>\n<form action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
  \ ?>\"\nmethod=\"post\" class=\"form-horizontal offset2\">\n    <h3>Admin Login</h3>\n\
  \    <div class=\"control-group <?php echo (!empty($error)?\n'error': ''); ?>\"\
  >\n        <label class=\"control-label\" for=\"inputEmail\">Username\n</label>\n\
  \        <div class=\"controls\">\n            <input type=\"text\" name=\"username\"\
  \ id=\"inputEmail\" \nplaceholder=\"Username\">\n        </div>\n    </div>\n  \
  \  <div class=\"control-group <?php echo (!empty($error)? 'error':\n'')); ?>\">\n\
  \        <label class=\"control-label\" for=\"inputPassword\">Password\n</label>\n\
  \        <div class=\"controls\">\n            <input type=\"password\" name=\"\
  password\" \nid=\"inputPassword\" placeholder=\"Password\">\n        </div>\n  \
  \  </div>\n    <div class=\"control-group\">\n        <div class=\"controls\">\n\
  \            <button type=\"submit\" class=\"btn\">Sign in</button>\n        </div>\n\
  \    </>\n</form>\n<?php require_once 'includes/temps/footer.php'; ?>\n```\n\n在此文件中，我们创建了一个表单，提示用户输入用户名以登录应用程序的管理部分。当此表单被提交时，它将把数据发送到我们的\
