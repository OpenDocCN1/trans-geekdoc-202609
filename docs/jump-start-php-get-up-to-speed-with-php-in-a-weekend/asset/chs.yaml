  \ ?>\n```\n\n在上面的代码中，我们添加了一个新表单，让访客可以在博客文章下发表评论。表单将使用 `post` 方法将数据提交到自身，随后我们的应用程序能够处理这些数据并使用\
  \ `addComment()` 将其保存到数据库。我们还为表单中的每个输入字段添加了 `if` 语句，以防用户在尝试提交评论时忘记填写。我们还有一个隐藏字段，用于存储文章\
  \ ID——这是我们正确保存评论所需要的内容。\n\n### 注意：使用 Gravatar 作为头像\n\n需要注意的是一点是，我们添加了指向 [Gravatar](http://en.gravatar.com/)\
  \ 的链接，以便在评论旁边显示用户的头像。Gravatar 是一项免费服务，允许用户将图像上传到在线服务器并将电子邮件地址关联到它。这使得开发者可以在应用程序中编写代码来收集可能与用户邮箱地址关联的头像。\n\
  \n调用 Gravatar 服务器是免费的，这意味着你不需要自己存储图像。Gravatar 的目标是提供一个快速方便的解决方案来更新每个人的头像。如果用户在 Gravatar\
  \ 上没有设置头像，它将返回一个默认头像。每个电子邮件地址都使用基本方法进行编码，因此我们需要使用 `md5` 对用户的邮箱地址进行编码；我们在代码中已经这样做，以便从\
  \ Gravatar 服务器获取头像。\n\n![我们的博客，现在有评论了！](img/comments.png)\n\n图 5.5。我们的博客，现在有评论了！\n\
  \n回到我们的代码，在模板的底部，我们有一个新区域，用户可以在其中输入关于自己的信息，并提交评论以附并显示在博客文章上。\n\n\n\n\n要定位你的 `php.ini`\
  \ 文件，请使用 `phpinfo()` 函数来发现它的位置。需要快速回顾一下？我们之前 第 1 章 中介绍过这一点。\n\n一旦你找到了正确的文件，用你的文本编辑器打开它，你将看到大量的配置选项。下面将讨论的其中几项将帮助提高应用程序的安全性。\n\
  \n### allow_url_include\n\n```\nallow_url_include=Off\n```\n\n默认情况下，标准的 PHP 安装将\
  \ `allow_url_include` 设置为关闭状态，但某些托管提供商可能会开启它，因此检查你的 `php.ini` 文件是非常重要的。\n\n当 `allow_url_include`\
  \ 关闭时，PHP 只能加载和执行存在于 Web 服务器文件系统上的其他文件。然而，如果你激活了 `allow_url_include`，你就可以通过 URL\
  \ 包含额外的文件。这看起来是一个有趣且可能实用的功能，但这样做会让你的应用程序面临恶意代码注入攻击的风险。因此，强烈建议保持此选项关闭状态。\n\n### 注意：代码注入\n\
  \n`code injection`（代码注入）是用于描述在未经许可的情况下将外部来源的意外代码放入 PHP 脚本的术语。关于代码注入的更多信息，请参考以下外部资源：\n\
  \n*   [`www.theserverpages.com/articles/webmasters/php/security/Code_Injection_Vulnerabilities_Explained.html`](http://www.theserverpages.com/articles/webmasters/php/security/Code_Injection_Vulnerabilities_Explained.html)\n\
  \n*   [`www.owasp.org/index.php/Code_Injection`](https://www.owasp.org/index.php/Code_Injection)\n\
  \n另一个相关的设置为 `allow_url_fopen`，它也应该被关闭。\n\n### open_basedir\n\n```\nopen_basedir=/path/to/web/directory\n\
  ```\n\n与 `allow_url_include` Go，`open_basedir` 也可以帮助限制脚本在服务器上允许加载的文件。通过 `open_basedir`，你可以设置可以从哪个目录加载文件，并确保任何脚本都无法加载该目录之外的文件。\n\
  \n攻击者可能会尝试的一种方法是访问基于 Linux 的 Web 服务器上的 `/etc/password` 文件，该文件列出了服务器上注册的用户账户。如果你的\
  \ PHP 应用程序从 `/var/www` 运行，你可以将 `open_basedir` 设置为 `\"/var/www/\"`。一旦设置，`www` 目录之外的文件将无法包含在你的脚本中，从而阻止攻击者的行动。当你的应用程序上线时启用此选项，可以为你的服务器增加额外的安全级别。\n\
  \n### 错误管理\n\n在项目的开发阶段，让 PHP 在代码中遇到任何错误或问题时向你提供反馈是有用的。然而，一旦你的应用程序部署，你真的希望这些错误越少越其微。开发者会希望向用户隐藏\
  \ PHP 错误消息，因为如果看到这些错误，可能会产生一种不可靠的感觉，影响客户的信心。\n\n重要的是，错误信息还可能暴露有关你系统配置的关键信息，黑客可以利用这些信息。PHP\
  \ 的默认错误消息可能包含如应用程序的安装路径、数据库连接详情、数据库列名以及其他脚本细节（如类名、对象 ID 和变量名）。\n\n为了确保这些信息对用户不可见，请将\
  \ `php.ini` 中的 `display_errors` 选项设置为 `off`。这告诉 PHP 在运行时发生错误时不要显示错误。这并不意味着 PHP 会忽略错误——而是它不会在浏览器中显示它。\n\
  \n你仍然可以告诉 PHP 将任何错误保存到特定的日志文件中，你作为应用程序开发者可以私下参考该文件。要实现这一点，请将 `error_log` 选项设置为所需错误日志文件的路径。\n\
  \n开启 `log_errors` 选项也是一个好主意。这确保了 PHP 将记录错误、保存错误数据，并避免所有在屏幕上渲染错误消息的可能性。\n\n设置这些选项后，PHP\
  \ 将为你私下创建错误日志，以便在需要时参考。\n\n### 提高 Session 安全性\n\n正如在上一章 中讨论的，Session 是临时存储数据（例如用户是否已登录）的手段。我们在博客应用程序中使用了\
  \ Session，正如你可能已经注意到的，它们提供了实用的功能。Session 通常只包含少量数据，但任何与获取应用程序访问相关的数据对任何攻击者或黑客来说都可能价值连城。在默认情况下，Session\
  \ 存储有关你的应用程序用户的信息，并使用 cookie 来帮助 PHP 等编程语言将每个用户与正确的会话信息匹配。遗憾的是，Session 维持了攻击者想要实现的登录状态，这使得\
  \ Session 成为黑客最有吸引力的目标之一。\n\n黑客尝试劫持 Session 的一种方法是访问 Session 数据本身。幸运的是，`php.ini`\
  \ 再次出现，并允许我们通过 `session.save_path` 选项更改 Session 数据存储的位置：\n\n```\nsession.save_path\
  \ = /var/lib/php\n```\n\n上面的示例是默认设置。如果你更改了位置，它将让黑客迷失方向，因为他们需要弄清楚你将 Session 数据移动到了哪里。\n\
  \n重要的是，当你更改此路径时，要确保你的 Web 服务器可以对新位置进行读写操作。未能做到这一点，你的 PHP 将无法正常使用 Session。\n\n黑客还经常尝试通过被称为[跨站脚本](https://en.wikipedia.org/wiki/Cross-site_scripting)（简称\
  \ XSS）的技术来利用你的应用程序和服务器，这允许他们向你的应用程序注入恶意 JavaScript 代码。Session 经常是 XSS 攻击的目标，如果成功，它们可以造成各种破坏，从键盘记录（记录所有按键）到强制显示非法广告。为了帮助防止\
  \ XSS 攻击，你可以使用选项：\n\n```\nsession.cookie_httponly = 1\n```\n\n当此选项设置为 `1` 时（大多数\
  \ `php.ini` 文件的默认值），将限制 JavaScript 访问 PHP 创建的 cookie。如果你不打算让 JavaScript 使用任何 cookie\
  \ 数据，强烈建议开启此选项，因为这有助于控制从客户端计算机到你的应用程序及其托管服务器的数据。\n\n关于 `php.ini` 内部选项以及如何让 PHP 更安全的更多信息，请参考以下来源：\n\
  \n*   [`www.sitepoint.com/a-tour-of-php-ini/`](http://www.sitepoint.com/a-tour-of-php-ini/)\n\
  \n*   [`php.net/manual/en/ini.php`](http://php.net/manual/en/ini.php)\n\n*   [`www.madirish.net/?article=229`](http://www.madirish.net/?article=229)\n\
  \n## 验证提交的数据\n\nPHP 应用程序最大的威胁并不是缺乏来自攻击者的保护，而是用户提交的糟糕数据的威胁。用户是故意还是无意提交错误数据通常很难判断，但格式错误的数据会损害你的应用程序。\n\
  \n确保用户知道他们应该提交什么类型的数据是非常重要的。对于你提示的数据类型使用正确的输入元素，并确保标签清楚地指示预期内容。\n\n\n\n\n此外，最佳实践是假设即户户已经在你的\
  \ HTML 表单中交互过具有特定限制的输入字段，他们仍可能提交格式不正确的数据。当数据被发送到你的 `PHP` 脚本进行处理时，实现某种类型的验证脚本是非常重要的。\n\
  \n有几个 `PHP` 函数可以用于验证。下面的代码示例旨在检查用户提交的数据，以其是否提供了正确的数据，从而帮助确保其处于应用程序可以直接使用的格式：\n\n\
  ```php\n<?php\n$input = array(); \n// 此处将存储所有过滤后的数据\n\n// 名称为 'number' 的输入字段\n//\
  \ 仅接受数字输入\nif (isset($_POST['number']) && is_numeric($_POST['input'])) {\n    $input['number']\
  \ = $_POST['number'];\n}\n// 名称为 'date' 的输入字段，接受\n// dd/mm/yyyy 格式的日期\nif (isset($_POST['date']))\
  \ {\n    list ($dd, $mm, $yyyy) = explode('/', $input);\n    if (checkdate ($mm,$dd,$yyyy))\
  \ {\n        $input['date'] = $_POST['date'];\n    }\n}\n// 名称为 'content' 的输入字段，接受\n\
  // 任意文本\nif (isset($_POST['content'])) {\n    // 过滤掉字符串中可能任何有害 HTML\n    $input['content']\
  \ = strip_tags($_POST['content']);\n}\n\n// $input 中的值在应用程序中使用是安全的\n```\n\n在上面的示例中，我们内部检查了每个传入的表单值，如果它们通过了某些基础验证检查，就会将其放入一个新数组中。失败的项不会被添加到\
  \ `$input` 数组。\n\n`is_numeric()` 函数检查字符串的内容，只有当它包含组成数字的字符时，才会返回 true。数字字符串由一个可选的前导符号（`+`\
  \ 或 `-`）、任意数量的数字以及可选的小数部分或指数部分组成。\n\n`checkdate()` 函数检查给定日期的有效性，只有当参数构成一个有效日期时，才会返回\
  \ true。\n\n最后，`strip_tags()` 返回一个删除了 HTML 和 `PHP` 标签的字符串，只留下基础格式的 HTML 标签（例如换行符\
  \ `<br>` 标签）和纯文本。\n\n在完成验证检查后，可以安全地在应用程序的其余部分使用 `$input` 中的值，并知道它们处于正确的格式。\n\n然而，表单并不是我们需要考虑实现验证唯一的数据类型。在本书构建的博客应用程序中，我们使用了\
  \ URL 变量来加载应用程序的新部分并执行特定脚本。URL 变量通常是攻击者的目标，因为它们很容易被，并且会对实施适当安全措施的应用程序造成非常严重的损害。\n\
  \n我们已经在应用程序中实现了一些安全验证技术，特别是在使用 URL 变量来决定应该执行何种方法或功能的地方：\n\n```\n...\nif (!empty($_GET['id'])\
  \ && is_numeric($_GET['id'])) {\n\n...\n```\n\n这个示例取自 `admin/posts.php`，显示我们已经有了\
  \ `is_numeric()` 函数，以确保只有当来自 URL 的数据为数字时，应用程序才会继续处理 `if` 语句内部的方法。它将忽略任何人可能尝试通过 URL\
  \ 传递的其他值。\n\n## 总结\n\n在本章中，我们对 `PHP` 安全性进行了简要概述，并查看了一些避免最常见漏洞的基本方法。\n\n`PHP` 安全是一个巨大的课题，我们在这里只是触及一角。建议每当你编写一个新函数时，想象一下某人将如何能够：\n\
  \n*   非法访问任何受保护的区域\n*   破坏、扭曲或更改应用程序正在处理的数据\n*   破坏、更改或以任何负面方式影响应用程序的过程和/或功能\n\n\
  在开发过程中，始终值得考虑的是每当需要用户输入时，用户都可能提交错误或格式错误的数据。如果你在开发时记住这些，你将能够保护自己免受应用程序可能遇到的许多初始安全问题。\n\
  \n关于在 PHP 应用程序中实现安全方法、功能和脚本的更多信息，请参：\n\n*   `[`www.sitepoint.com/top-10-php-security-vulnerabilities/`](http://www.sitepoint.com/top-10-php-security-vulnerabilities/)`\n\
  *   `[`www.sitepoint.com/php-security-blunders/`](http://www.sitepoint.com/php-security-blunders/)`\n\
  *   `[`www.php-security.net/`](http://www.php-security.net/)`\n\n## 结论\n\n在这本短书中，我们简短地体验了\
  \ `PHP` 开发并创建了一个简单的博客平台。我们讨论过的所有都是经过仔细挑选，旨在启发你精进你的 `PHP` 开发技能。\n\n这本书应该仅被视为你 `PHP`\
  \ 开发者之旅的起点。进一步提高 `PHP` 技能的极佳资源是 SitePoint 的 `PHP` 频道，`[`www.sitepoint.com/php/`](http://www.sitepoint.com/php/)`，它为\
  \ PHP 开发者提供了丰富的文章。\n\n> 优秀软件的功能是让复杂变得简单。 ― Grady Booch\n\n"
