  \ 文件并开始使用该系统。\n\n在下一章节中，我们将进一步扩展管理面板，允许我们更新数据库中现有的博客文章，并删除博客文章。\n\n## 总结\n\n表单是任何\
  \ Web 应用程序至关重要的部分，允许用户提交数据。PHP 为我们提供了强大的工具，用于处理、存储和操作通过表单提交的数据。在本章中，我们讨论了 PHP 收集表单提交数据的方法，查看了\
  \ `POST` 和 `GET` 方法，并讨论了如何验证收集到的数据，为将其输入我们的 `MySQL` 数据库做好准备。然后，我们使用了讨论过的表单方法构建了我们的博客应用程序。\n\
  \n正如我们讨论过的，数据库是存储应用程序可以在日后检索的数据的理想选择。然而，使用 PHP 还有以更临时的方式存储数据的选项。`cookies` 和 `sessions`\
  \ 设计用于存储比通常数据库中存储更小的数据块。它们通常用于存储用户登录功能的个人数据（例如），并为应用程序配置文件等功能提供用户数据的快速访问。\n\nCookies\
  \ 和 sessions 之间的主要区别在于数据存储的位置。Cookies 将数据存储在客户端计算机上，而 sessions 将其数据存储在 Web 服务器上。PHP\
  \ 可以同时处理 cookies 和 sessions，我们将在本章中详细查看这些每个选项。\n\n## Cookies：概览\n\nHTTP 请求是无状态的，这意味着每当浏览器请求新页面时，Web\
  \ 服务器都不会记住与用户之前的某个请求相关的数据。\n\n幸运的是，我们有使用 cookies 的选项，它允许我们在访问者的浏览器中存储一小部分信息。这些 cookie\
  \ 信息可以被网站加载，并在其脚本中使用以实现数据的个性化，或帮助在站点页面上创建动态数据。\n\n当您需要在 HTTP 页面请求之间保留数据时，Cookies\
  \ 也非常有用。在浏览器中创建的每个 cookie 仅可由创建它的浏览器访问，这有助于保持其中包含的信息安全。\n\n### 重要：Cookies 与最近的欧洲立法\n\
  \n最近，对于居住在欧洲或与要在欧洲部署的项目工作的 Web 开发人员来说，cookies 被处于疑云之中。欧盟认为 cookies 被用来存储了关于网站访问者的太多个人信息，因此已经实施了[新立法](http://www.ico.org.uk/for_organisations/privacy_and_electronic_communications/the_guide/cookies)，旨在提高其使用的透明度。\n\
  \n这项立法并不意味着开发者不应该使用 cookies，但它确实意味着我们必须更高效地使用它们，并且仅在应用有真实需求时才使用它们。\n\n事实是，网站使用的大多数\
  \ cookies 都是无害的——许多 仅用于根据用户乐意提供的个人信息来增强用户内容。\n\n## Sessions：概览\n\n尽管 cookies 很有用，但它们确实存在漏洞——因为它们存储在用户的计算机上，理论上它们可能会被用户篡改，或者更糟糕的是，被用户计算机上的病毒篡改。sessions\
  \ 提供了 cookies 的替代方案，并且不带客户端的安全风险。\n\n`sessions` 是一种特殊形式的连续性，用于在用户访问您的网站期间跨页面请求存储数据。当您登录\
  \ Web 应用程序、编辑某些内容并注销时，通常情况下，一个 session 会在后台运行。\n\n值得注意的是，sessions 仍然依赖 cookies 来成功将存储在网站服务器上\
  \ session 中的数据归类给客户端。换句话说，用户每当访问网站时，都需要客户端计算机上的一个 cookie 来识别他们。\n\n## Session 对比\
  \ Cookies\n\n在您使用 PHP 开发时，您可以很方便地同时使用 cookies 和 sessions。两者都可以使用非常简单的方法访问。不过，在深入代码之前，探索\
  \ cookies 和 sessions 的独特特性以更好地了解您何时可能倾向于使用其中一个。\n\n### Cookies\n\nCookies 与 sessions\
  \ 相比的第一个独特特性是我们为它们设置了过期时间。当客户端离开我们的网站或 Web 应用程序并游览到互联网的其他部分时，他们很有可能会返回。通过 cookies\
  \ 我们可以设置过期时间，这样当用户再次访问时，只要过期时间未到，他们之前提交或输入的信息就会像没有离开一样显示。\n\n使用过期时间的例子是您登录社交媒体应用程序（如\
  \ Facebook）。登录后，您可能会导航到另一个网站。但在特定时间范围内返回 Facebook，您可能会发现自己仍然处于登录状态。cookie 为 Facebook\
  \ 提供了此部分数据，帮助它加载我们的配置文件，从而极大地改进了用户体验。为 cookies 设置过期时间使这种便利成为可能，同时增加了一层安全性。通过强制用户在活动一段时间后重新验证身份，防止其他用户通过硬件劫持访问\
  \ cookie 中存储的数据。\n\nCookies 的另一个特性是，每当有人访问在其机器上了 cookie 的网站时，cookie 会自动包含在客户端发送的后续\
  \ HTTP 请求中。考虑到这一点，不要让 cookies 存储太多数据，因为它们会占用 Web 服务器的带宽。\n\nCookies 使数据管理更加简单，因为使用它们不需要任何任何形式的数据库。这意味着使用\
  \ cookies 不需要任何数据库管理技能。此外，在许多 Web 编程语言（如 PHP）中，创建、分配数据和访问 cookies 的功能已经内置，因此您无需担心自己编写库来访问它们。\n\
  \n\n\n\n总来说，cookies 应该用于存储小量信息，这些信息可以用于个性化网页的小部分以提升用户体验。它们还可以允许用户恢复之前与您的应用程序的交互，营造出他们仍处于登录状态的错。\n\
  \n### 注意：Cookies 与安全\n\n记住不要在 cookies 中存储敏感数据，因为每当请求页面时，cookies 都会被发送到 Web 服务器，并可能被精通技术的攻击者访问。\n\
  \n此外，由于 cookies 存储在用户的计算机上，我们作为开发者，在保护 cookies 方面做的其实非常有限。因此，理想情况下，cookies 只应该存储应用程序用于识别存储在数据库或其他安全存储选项中信息的数据，而不是将数据直接存储在\
  \ cookie 中。\n\n### 会话 (Sessions)\n\n会会将 cookies 的实用性与 Web 服务器的安全性和可管理性结合。与 cookie\
  \ 不同，特定的变量数据和信息不会直接存储在用户的计算机上。数据本身实际上存储在托管并处理网站或 Web 应用程序的服务器上。\n\nSessions 与我们目前看到的任何其他变量都不同，因为它们不会在浏览器请求的页面之间直接传递数据——相反，数据是从每个页面开始时启动的会话中检索的。如前所述，sessions\
  \ 使用存储在客户端计算机上的 cookie 来将正确的用户与其存储在会话中的数据识别起来。这个 cookie 不包含任何个人信息，而且除非与 Web 服务器上存储的数据进行比较，否则这些数据没有任何意义；通常它它以键的形式出现，例如\
  \ `350401be75bbb0fafd3d912a1a1d5e54`。出于这个原因，sessions 的数据安全性比单独使用 cookies 更高。\n\n\
  虽然这种在客户端计算机和服务器上同时存储数据的方法看起来可能有些笨拙，但它实际上有其优势：\n\n*   Sessions 对可以存储的数据量没有限制。这是因为\
  \ sessions 存储在服务器上，因此不会对服务器的带宽产生负面影响。\n*   由于 session 数据存储在 Web 服务器上而不是用户的计算机上，这允许你将安全精力放在\
  \ Web 服务器上，而不是应用能够适应用户浏览器存储能力的加密方法。\n\n关于 sessions 需要记住的一点是，你可以指定它们存活或活跃的时间。我们将其称为“存活时间”（time-to-live），通常配置为在用户关闭与\
  \ Web 服务器建立会话的浏览器或标签页后，会话过期或失效。例如，如果一个用户登录了社交媒体应用程序，当他们完成使用并关闭浏览器时，如果配置了此类操作，会话将自动删除该用户的数据——这是一个非常实用的功能。\n\
  \n## PHP 中的 Sessions 和 Cookies\n\n现在我们已经涵盖了使用 sessions 和 cookies 的原因以及它们之间的主要区别，是时候开始学习如何在\
  \ PHP 中实现它们了。\n\nsessions 和 cookies 都可以通过专门用于这些方法的特殊变量进行访问和加载。在 PHP 中，我们通过使用超全局变量\
  \ `$_COOKIE` 来表达使用和操作 cookie 的意图。\n\n### PHP 中的 Cookies\n\n现在我们已经知道了编写和使用 cookies\
  \ 的基础知识，我们将查看如何使用和编写 sessions。就像 cookies 一样，这种方法利用了一个特殊的超全局变量，我们通过该变量向 sessions\
  \ 分配数据并从其获取数据：`$_SESSION`。\n\n我们必须使用一些特殊的函数来设置 cookies。在我们的示例中，我们设置了 cookie 的过期时间和日期，并将其存储在第一行的\
  \ `$expire` 变量中。注意我们使用了 `time()` 函数。让我们创建一个新文件并添加以下代码：\n\n```php\n<?php\n$expire\
  \ = time() + 60 * 24 * 30;\nsetcookie(\"user\", \"Joe Public\", $expire);\nif (isset($_COOKIE[\"\
  user\"])) {\n    echo \"Welcome \" . $_COOKIE[\"user\"];\n} else {\n    echo \"\
  Welcome!\";\n}\n```\n\n### 重要：isset()\n\n同样重要的是，来自 cookies 的数据会在每次页面请求时发送到服务器。如果你的脚本在发送任何\
  \ cookie 数据之前输出了 HTML，或者设置了任何要发送的 cookie 数据，PHP 将报错。请确保在脚本开始时设置并发送 cookie 数据是非常重要的。但是你可以在脚本的后续（在\
  \ HTML 发送之后）检索 cookie 数据。这不会引发 PHP 错误（只要 cookie 存在且有数据）。强烈建议你花时间阅读[关于 PHP 中 cookies\
  \ 的 SitePoint 文章](http://www.sitepoint.com/php-sessions/) 以进一步了解。\n\n`isset()` 函数检查变量是否有值。在上面的代码中，我们使用\
  \ `$_COOKIE` 来确保 cookie 已被检测到。现在查看 `storage.php` 文件时，你会发现 `isset()` 将会-.\n\n\n\n\
  会话（Sessions）的工作原理类似于 cookie，但在分配数据方面有一有一个特定的过程，这与设置 cookie 数据的方式非常不同。最初，我们需要告诉 PHP\
  \ 我们想使用会话，我们通过 `session_start()` 函数来实现这一点。我们还可以选择单独地或批量地移除会话变量，这可以通过如 `session_unset()`\
  \ 和 `session_destroy()` 等函数完成。这里有一个基础示例，展示了我们如何启动会话、向其中添加数据，并使用之前介绍过的 `$_SESSION`\
  \ 变量获取这些数据：\n\n```php\n<?php\nsession_start();\n$_SESSION[\"username\"] = \"myusername\"\
  ;\necho \"Username = \" . htmlspecialchars($_SESSION[\"username\"]);\n```\n\n如你所见，我们启动会话，创建一个名为\
  \ `username` 的新会话变量，并将字符串 `\"myusername\"` 赋值给该变量。最后，我们在浏览器中显示存储在会话变量中的字符串。这只是一个基础示例，因为如果我们在实际项目中使用这段代码，实际上会将其分布在两个文件中——第一个文件启动会话并创建\
  \ `username` 会话变量，第二个文件也启动会话，但随后显示会话变量中存储的字符串。\n\n在使用完会话后将其结束是非常重要的。尽管会话被用于临时数据存储，但它们仍然容易受到攻击。在处理可能敏感的信息时，结束会话有助于确保最大的安全性。要做到这一点，我们只需要在完成后简单地向代码中添加\
  \ `session_destroy()` 函数，如下：\n\n```php\n<?php\nsession_start();\n$_SESSION[\"username\"\
  ] = \"Username\";\necho \"Username = \" . $_SESSION[\"username\"];\nsession_destroy();\n\
  ```\n\n强烈建议在完成工作且代码中不再需要该会话时将其结束，以防止恶意代码被注入到你的 PHP 脚本中。\n\n如果我们不想不想结束会话，而是想从其中移除某部分数据，可以使用\
  \ `unset()` 函数。这里是 `unset()` 的用法示例：\n\n```php\n<?php\nsession_start();\nunset($_SESSION[\"\
  username\"]);\n```\n\n我们还可以使用 `session_unset()` 函数清除所有会话及其值。因此，如果我们修改上面的简短示例，可以这样使用\
  \ `session_unset()`：\n\n```php\n<?php\nsession_start();\nsession_unset();\n```\n\
  \n### 警告：不要在会话中保留敏感数据\n\n在本章前面的部分，我们讨论了为什么不使用 cookie 存储敏感数据（即使是临时的）。同样的建议也适用于会话，尽管它们被认为比\
  \ cookie 更安全。虽然会话数据存储在 Web 服务器上而不是用户的计算机上，但会话也可能是攻击者和黑客的目标。因此，也建议你不要使用会话存储敏感数据。\n\
  \n## 项目\n\n现在我们已经涵盖了会话和 cookie 的使用，是时候开始填充我们项目的外壳，使其成为一个功能完整的博客平台了。首先，让我们从 `includes`\
  \ 文件夹中的 `login.php` 文件开始，并对其进行添加。我们将从编辑 `index()` 方法开始：\n\n```php\npublic function\
  \ index() {\n    if (isset($_GET['status']) && $_GET['status'] == 'logout') {\n\
  \        session_unset();\n        session_destroy();\n        $error = '您已注销。请登录。';\n\
  \        require_once 'templates/loginform.php';\n    } elseif (!empty($_SESSION['kickstart_login']))\
  \ {\n        if ($_SERVER['REQUEST_METHOD'] === 'POST') {\n            $this->validateDetails();\n\
  \        } elseif (isset($_GET['status'])) {\n            if ($_GET['status'] ==\
  \ 'inactive') {\n                session_unset();\n                session_destroy();\n\
  \            }\n        }\n        require_once 'templates/loginform.php';\n   \
  \ }\n}\n```\n\n我们在 `index()` 中添加的是为了跟踪用户在整个管理面板中的活跃状态。我们在构造函数中添加了注销流程，当用户选择注销时销毁会话。我们还添加了\
  \ `if` 语句来检查用户是否已登录。最后，我们在文件顶部添加了 `session_start()`，以便在用户请求管理面板内的页面时启动会话。如果用户仍然活跃，`Adminpanel`\
  \ 类将首先检查用户是否在未登录的情况下直接访问管理面板。无论何种情况，用户都将被重定向回登录页面。最后，如果用户已经登录并拥有活动会话，类将开始加载渲染管理面板所需的所有内容。\n\
  \n接下来，让我们快速查看 `loginSuccess()` 方法：\n\n```php\npublic function loginSuccess() {\n\
