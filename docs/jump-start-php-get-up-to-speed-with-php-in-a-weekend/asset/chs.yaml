  \ 检查 `$a` 的值是否等于 `$b`。如果是，它会在屏幕上显示“A is equal to B”。如果该测试失败，PHP 将执行 `else` 语句之后块的代码，并在屏幕上打印“A\
  \ is not equal to B”。\n\n```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to\
  \ B';\n} else {\n    echo 'A is not equal to B';\n}\n```\n\n### elseif 语句 \n\n另一个伙伴是\
  \ `elseif` 语句。正如其名，`elseif` 是 `if` 和 `else` 的组合。它包含一个条件，当 `if` 条件被发现为假时，PHP 会检查该条件。\n\
  \n多个 `elseif` 语句可以组合使用以测试不同的条件，PHP 会检查每一个条件，直到发现其中一个条件为真。一旦找到真条件，PHP 将跳过链中剩余的 `elseif`\
  \ 语句。\n\n```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to B';\n} elseif ($a\
  \ == $c) {\n    echo 'A is equal to C';\n} elseif ($a == $d) {\n    echo 'A is equal\
  \ to D';\n} else {\n    echo 'A is not equal to anything';\n}\n```\n\n## switch\
  \ 语句 \n\n如果你仔细观察我们的 `elseif` 示例，可能会发现每个条件基本上都在测试相同的内容——即某个变量的值是否等于 `$a` 的值。PHP 的\
  \ `switch` 语句可以完成类似的操作，而且看起来没那么杂乱。\n\n```php\nswitch ($a) {\n    case $b:\n    \
  \    echo 'A equals B';\n        break;\n    case $c:\n        echo 'A equals C';\n\
  \        break;\n    case $d:\n        echo 'A equals D';\n        break;\n    default:\n\
  \        echo 'A is not equal to anything';\n        break;\n}\n```\n\n在上面的示例中，PHP\
  \ 获取 `switch` 开始时提供的值（`$a` 的值），并将其与每个 `case` 的值进行比较。匹配的子句将被执行。如果没有其他 `case` 匹配，则执行\
  \ `default` 情况。\n\n一旦 PHP 找到匹配的子句，它就会开始执行下面的代码并一直持续到看到 `break` 关键字，之后将跳转到 `switch`\
  \ 语句的结尾，并愉快地继续执行我们脚本的其余部分。\n\n### 注意：留意 Break \n\nPHP 不会将一个 `case` 的开始视为上一个 `case`\
  \ 的结束，这就是为什么 `break` 关键字是必要的。这在起初可能会让人困惑，而且很可能会出现你忘记使用 `break` 导致脚本运行不符合预期的情况，因此记住这一点非常重要。\n\
  \n这种行为也意味着我们可以编写在多个 case 下执行的代码，如下所示：\n\n```php\nswitch ($a) {\n    case $b:\n \
  \   case $c:\n    case $d:\n        echo 'A equals B, C, or D';\n        break;\n\
  \    default:\n        echo 'A is not equal to anything';\n```\n\n## for 语句\n\n\
  `for` 循环用于执行特定次数的块块。它包含三部分：初始化、条件和递增/递减。\n\n```php\nfor ($i = 0; $i < 10; $i++)\
  \ {\n    echo $i . '<br>';\n}\n```\n\n在上面的示例中，`$i = 0` 是初始化，`$i < 10` 是条件（当此为真时循环继续），而\
  \ `$i++` 是递增，在每次迭代后增加 `$i`。\n\n### while 语句\n\n`while` 循环在指定条件为真时执行代码块。它在你不知道循环应该运行多少次时非常有用。\n\
  \n```php\n$i = 0;\nwhile ($i < 10) {\n    echo $i . '<br>';\n    $i++;\n}\n```\n\
  \n### do-while 语句\n\n`do-while` 循环与 `while` 循环相似，但有一个关键区别：在检查条件之前，代码块至少执行一次。\n\n\
  ```php\n$i = 0;\ndo {\n    echo $i . '<br>';\n    $i++;\n} while ($i < 10);\n```\n\
  \n### foreach 语句\n\n`foreach` 循环用于遍历数组的元素。它是 PHP 中处理数组最方便的方法。\n\n```php\n$colors\
  \ = array(\"red\", \"green\", \"blue\");\nforeach ($colors as $color) {\n    echo\
  \ $color . '<br>';\n}\n```\n\n你也可以在 `foreach` 循环中同时访问键和值：\n\n```php\n$colors = array(\"\
  a\" => \"red\", \"b\" => \"green\", \"c\" => \"blue\");\nforeach ($colors as $key\
  \ => $value) {\n    echo \"$key: $value<br>\";\n}\n```\n\n\n\n\n关于 `while`、`for`\
  \ 和 `foreach` 循环的更多信息，请参阅 [PHP 官方文档](http://www.php.net/manual/en/language.control-structures.php)\
  \ 以及以下资源：\n\n* [`www.sitepoint.com/loops/`](http://www.sitepoint.com/loops/)\n*\
  \ [`webcheatsheet.com/PHP/loops.php`](http://webcheatsheet.com/PHP/loops.php)\n\n\
  ## 数据库、MySQL 与 PHP\n\n当我们创建一个 PHP Web 应用程序时，通常需要将脚本中创建的一些数据保存到某处，以便日后访问。数据库允许我们存储大量不同类型的数据，从大型的字母数字字符串到序列化数组。MySQL\
  \ 是目前最流行的开源数据库，它与 PHP 配合得非常好，可以用来存储我们的应用程序数据。它非常易于启动，只需要几个函数即可存储和检索数据。\n\n像 MySQL\
  \ 等传统数据库使用表、行和列来组织数据。每个表包含一组记录（用户信息、订单摘要等），表中的每行存储一条特定的记录，而每列则标识构成记录的不同数据。数据库表可以想象成图\
  \ 2.3。\n\n![数据库表](img/dbtable.png)\n\n图 2.3. 数据库表\n\n### 注意：考虑数据类型\n\n由于表中的每列只允许存储一种类型的数据，且这通常是列定义的一部分，因此提前考虑你将存储的数据的不同属性是非常重要的。\n\
  \n在继续之前，确保你已经熟悉数据库的作用和 MySQL 的基础知识。如果你对其中任何内容不确定，请阅读 [tizag.com 上的 MySQL 文章](http://www.tizag.com/mysqlTutorial)。[`www.tizag.com/mysqlTutorial`](http://www.tizag.com/mysqlTutorial)\n\
  \nPHP 中处理 MySQL 有两个扩展——`MySQLi` 和 `PDO`。我们将使用 `PDO` 扩展来连接并与 MySQL 数据库交互，因此请确保该扩展已安装并启用。打开我们在第\
  \ 1 章中编写的 `info.php` 文件，查找标题为 `PDO` 的部分，并确保 MySQL 列在启用列中。\n\n### 注意：安装 PDO 时遇到的问题\n\
  \n如果你在启用扩展时遇到问题，请查看 [PHP 手册中安装 PDO 的指南](http://php.net/manual/en/pdo.installation.php)。\n\
  \n广流行的 `phpMyAdmin` 是一个 PHP 应用程序，它让管理多个数据库变得简单。基于此，强烈建议你确保服务器上安装了 `phpMyAdmin`。我们将在本书中使用它来管理数据库。\n\
  \n要开始，我们需要使用 `phpMyAdmin` 创建一个新的空数据库。执行此操作，请在浏览器中打开安装的 `phpMyAdmin` 并登录。你会看到一个类似下面的屏幕：\n\
  \n![phpMyAdmin](img/phpmyadmin.png)\n\n图 2.4. phpMyAdmin\n\n接下来，点击顶部菜单中的 `Databases`（数据库）链接。在下一个屏幕，我们可以通过输入要使用的数据库名称来创建新数据库。对于我们的项目，让我们在文本字段中输入\
  \ \"kickstartapp\" 并点击创建按钮。\n\n![创建我们的数据库](img/createdb.png)\n\n图 2.5. 创建我们的数据库\n\
  \n### 注意：排序规则（Collation）？\n\n不要担心那个应该预选为“Collation”（排序规则）的下拉选项。这是一个更高级的功能，为了本书项目的目的，我们将坚持使用默认选项。如果你想阅读数据库排序规则类型，请参阅：\n\
  \n* [`dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html`](http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html)\n\
  * [`kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs`](https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs)\n\
  \n### 注意：命名数据库时要小心\n\n当我们创建数据库时，其名称不能包含斜杠、句号或其他文件名不允许允许的字符，并且不应包含空格。\n\n眼敏锐的人可能已经注意到，我们新创建的数据库已添加到可用数据库列表中。左侧菜单上的此列表是快捷链接的集合，我们可以用它来选择想要编辑或管理的数据库。在列表中找到新数据库\
  \ \"kickstartapp\" 并点击它。这将带我们进入一个新屏幕，它看起来非常空，且类似于图 2.6：\n\n![我们的新数据库](img/newdb.png)\n\
  \n图 2.6. 我们的新数据库\n\n这是 `phpMyAdmin` 的主区域，我们可以在这里为数据库创建表并编辑现有表。但在在此之前，我们需要创建一个用户账户，用于连接数据库并存储和提取我们的数据。\n\
  \n进入顶部菜单中的 `Privileges`（权限）选项并点击它，然后在新面板中选择 `Add User`（添加用户），如图 2.7 所示。\n\n![添加新用户](img/addnew.png)\n\
  \n图 2.7. 添加新用户\n\n现在我们只需要在 `User name`（用户名）字段中输入用户名（确保从下拉菜单中选择了使用文本字段），在 `Host`（主机）下拉菜单中选择\
  \ `local`，然后在 `password` 字段中输入密码（再次确保选择了使用文本字段）。接下来，向下滚动并确保在面板的下一个选项区域勾选了 `Grant\
  \ all privileges on database kickstartapp`。最后，在最后一个面板的 `Global privileges`（全局权限）下选择\
  \ `Check all`（全选），并点击底部的 `Add User`（添加用户）。\n\n![新用户字段](img/newuserfields.png)\n\n\
  图 2.8. 新用户字段\n\n这看起来可能有点复杂，但实际上我们所做的只是创建一个新用户并赋予该用户对 \"kickstartapp\" 执行任何操作的权限。这种设置对于用户来说是常见的，但不一定是最安全的。关于设置数据库用户的更多信息，请参阅：\n\
  \n* [`dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html`](http://dev.mysql.com/doc/refman/5.0/en/charset-collation-implementations.html)\n\
  * [`kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs`](https://kb.mediatemple.net/questions/138/Default+MySQL+character+set+and+collation#gs)\n\
  \n现在我们已经设置好了用户账户，让我们在数据库中创建一个表。在我们的项目文件夹中创建一个名为 `setup.php` 的新 PHP 脚本。在该文件中以下代码，然后通过浏览器运行该文件。\n\
  \n### 注意：自定义你的代码\n\n将以下代码中的 `USERNAME` 和 `PASSWORD` 替换为你创建数据库用户时设置的用户名和密码。\n\n```php\n\
  <?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\",\n \"USERNAME\"\
  , \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  try {\n    $queryStr = \"CREATE TABLE users (id INTEGER NOT NULL\nAUTO_INCREMENT\
  \ PRIMARY KEY, name VARCHAR(40), password\nVARCHAR(100), email VARCHAR(150))\";\n\
  \    $db->query($queryStr);\n} catch (PDOException $e) {\n    echo $e->getMessage();\n\
  }\n```\n\n首先通过创建一个带有四个关键信息的 `PDO` 对象在 PHP 中连接 MySQL。第一个参数告诉 PHP 我们 MySQL 数据库的位置。在我们的情况下，这是\
  \ \"localhost\"，因为 MySQL 服务器与 PHP 运行在同一系统上。第二个参数识别我们要连接的数据库。这两个信息片段与 `mysql:` 结合，创建一个被称为\
  \ DSN（数据源名称）的内容。第三和第四个参数简单就是数据库用户的用户名和密码。\n\n\n\n\n接下来，我们为 `PDO` 设置一个反馈选项，使 PHP\
  \ 将任何数据库错误都视为异常。这样，当 MySQL 尝试执行我们提供的 SQL 语句发生任何问题时，我们将立即收到通知，并能够看到发生了什么以便进行修复。\n\
  \n然后，我们定义了用于创建表的 SQL 语句，并将字符串赋值给变量 `$queryStr`。查看该 SQL 语句，我们正在告诉 MySQL 创建名为 `users`\
  \ 的新表，我们将其用于存储与我们博客应用程序中管理员和公共用户相关的所有数据。这是通过 `CREATE TABLE` 命令实现的，随后跟的是我们在表中所需要的不同列的定义：`id`、`name`、`password`\
  \ 和 `email`。每个列定义都告诉 MySQL 该列将存储什么类型的数据，以及该单元格的其他任何选项。例如，第一列（`id`）将只存储整数，且不允许记录该列有空值（`NOT\
  \ NULL`）。\n\n接下来，我们遇到了一种尚未讨论过的条件语句类型：`try`...`catch` 块。在 `try` 块中，我们将变量 `$queryStr`\
  \ 传递给 `PDO` 对象的 `query()` 方法。该方法接收我们的 SQL 字符串并将其发送到 MySQL 服务器执行。\n\n只有当 `try` 块出现问题时，PHP\
  \ 才会执行 `catch` 块中的代码。也就是说，如果 MySQL 运行我们的查询失败，PHP 将“抛出”异常（我们之前通过设置 `PDO::ATTR_ERRMODE`\
  \ 请求了这种行为）。我们的 `catch` 块将“捕获”异常对象，其中包含了我们可以用于排排除问题的信息。\n\n通过浏览器访问 `setup.php` 文件。如果屏幕保持空白，说明查询执行成功（我们只要求\
  \ PHP 在出现问题时输出任何内容）。然后返回 phpMyAdmin 并点击数据库以验证新创建的表是否存在。\n\n现在，让我们向表中添加一些数据吧！在项目目录下创建一个名为\
  \ `insert.php` 的新文件，并向添加以下代码：\n\n```php\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\"\
  ,\n \"USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
  \ \ntry {\n    $queryStr = \"INSERT INTO users (name, password, email) \nVALUES\
  \ ('admin', MD5('admin'), 'youremail@domain.com')\";\n    $db->query($queryStr);\n\
  } catch (PDOException $e) {\n    echo $e->getMessage();\n}\n```\n\n大部分代码与之前相同，但我们发送给\
  \ MySQL 的 SQL 现在是一个 `INSERT INTO` 命令。我们正在要求 MySQL 在 `users` 表中创建一个具有用户名 \"admin\"\
  、密码哈希和电子邮箱地址的新记录。\n\n### 注意：使用 MD5\n\n注意，对于 `password` 列，我们使用了 `MD5()` 函数对数据进行了哈希处理。这样做是为了安全考虑，以便任何未经授权访问我们数据库的人无法轻易查看我们用户的密码。永远不要以明文存储密码！\n\
  \n导航到 `insert.php` 文件，你应该再次看到一个空白页面，这意味着查询执行成功，否则你将看到一条错误消息，让你了解明哪里出了问题。最后，让我们从表中检索数据。创建文件\
  \ `getdata.php` 并添加以下代码：\n\n```php\n<?php\n$db = new PDO(\"mysql:host=localhost;dbname=kickstartapp\"\
  ,\n \"USERNAME\", \"PASSWORD\");\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
  \ \ntry {\n    $queryStr = \"SELECT * FROM users\";\n    $query = $db->prepare($queryStr);\n\
  \    $query->execute();\n    while ($row = $query->fetch()) {\n        echo $row['id']\
  \ . ' - ' . $row['name'] . ' - ' . $row['password'] . ' - ' . $row['email'] . '<br>';\n\
  \    }\n    $query->close();\n} catch (PDOException $e) {\n    echo $e->getMessage();\n\
  }\n```\n\n## 总结\n\n在本章中，我们介绍了使用 phpMyAdmin 创建数据库、在 PHP 中创建表、插入记录以及从表中检索数据的基础。然而，这只是冰山一角。MySQL\
  \ 和 PHP 的深度远比我们所看到的深得多。关于 MySQL 和使用 PHP 的更多信息，请参考以下资源：\n\n*   `http://dev.mysql.com/doc/`\n\
  *   `http://www.sitepoint.com/migrate-from-the-mysql-extension-to-php`\n*   `http://www.php.net/manual/en/book.php`\n\
  *   `http://www.sitepoint.com/avoid-the-original-mysql-extension-1/`\n\n\n\n\nOOP\
  \ 看起来可能很复杂，但它实际上是一种非常直接的编程方法。要了解更多关于 OOP 底层理论的信息，请参阅 [Lorna Mitchell 在 sitepoint.com\
  \ 上关于 PHP OOP 的视频介绍](http://www.sitepoint.com/object-oriented-php-lesson-1/)。\n\n\
  ## OOP 入门\n\n让我们一起写一个 OOP 示例。假设我们想在 PHP 代码中将狗表示为一个对象。我们需要编写该对象（类）的定义，用来描述狗可以做什么。\n\
  \n在你的实验文件夹中创建一个名为 `Dog.php` 的文件，并包含以下内容：\n\n```php\n<?php\nclass Dog\n{\n    public\
  \ $name;\n\n    public function __construct($name) {\n        $this->name = $name;\n\
  \    }\n\n    public function speak() {\n        return 'Woof! Woof!';\n    }\n\
  }\n```\n\n在实验文件夹中创建另一个文件 `DogTest.php`。\n\n```php\n<?php\nrequire 'Dog.php';\n\n\
  $dog = new Dog('Fido');\necho 'The dog\\'s name is: ' . $dog->name . '<br>';\necho\
  \ 'The dog says: ' . $dog->speak() . '<br>';\n```\n\n在浏览器中访问 `DogTest.php` 文件，你应该会在屏幕上看到狗的名字和汪叫声。非常棒。\n\
  \n### 注意：从其他文件中包含代码\n\n在示例中看到的 `require` 结构——简单来说——是将外部 PHP 文件的内容导入到我们的 `DogTest.php`\
  \ 文件中。它是用于从其他文件包含代码的四个结构之一，每种结构的行为略有不同：\n\n*   `include` ― 包含文件内容。如果找不到文件或无法访问，PHP\
  \ 将发出警告但会继续执行。\n*   `include_once` ― 与 `include` 相同，但 PHP 会执行额外的检查以确保文件没有被导入过。如果已经导入，则\
  \ PHP 将不会再次包含内容。\n*   `require` ― 与 `include` 类似，但如果找不到文件，PHP 将抛出致命错误并停止执行。\n* \
  \  `require_once` ― 与 `require` 相同，但有一个额外的检查以确保内容不会被导入多次。\n\n通过查看我们的 `Dog.php` 文件，我们首先注意到的是\
  \ `class` 关键字。这个关键字基本上表示接后的代码定义了一个类，该类将以随后的名称命名（在我们的案例中为 `Dog`）。一旦定义了类，我们就可以使用 `new\
  \ Dog` 从它创建一个对象。\n\n方法 `__construct()` 和 `speak()` 是类定义的一部分。`__construct` 是一个对 PHP\
  \ 具有特殊含义的名字；当我们从类中创建一个新对象时，PHP 会检查是否定义了 `__construct()` 方法。如果是，它将在创建对象实例后自动执行该方法。这使得它成为放置初始化新对象的代码的绝佳位置。\n\
  \n### 注意：函数和方法\n\n属于类的函数被称为方法（methods）。函数和方法之间的区别不大，所以如果对你的理解有帮助，在每次看到“方法（method）”时将其想象成“函数（function）”是安全的。\n\
  \n类可以有自己的变量，这些变量帮助对象实例维护其状态，并且可以被方法访问。在上面的 `Dog.php` 示例中，行 `public $name;` 将 `$name`\
  \ 定义为类变量，或属性（property）。\n\n### 注意：变量和属性\n\n属于类的变量被称为属性（properties）。就像函数/方法一样，在你习惯\
  \ OOP 术语之前，在每次看到“属性（property）”时将其想象成“变量（variable）”是安全的。\n\n当我们在类内部编写代码时，特殊变量 `$this`\
  \ 代表对象的实例，并帮助我们解析方法。为了更好地理解这种工作，让我们更新 `DogTest.php` 文件，如下：\n\n```php\n<?php\n  require\
  \ 'Dog.php';\n\n  $dog = new Dog('Fido');\n  echo 'The dog\\'s name is: ' . $dog->name\
  \ . '<br>';\n  echo 'The dog says: ' . $dog->speak() . '<br>';\n\n  $fido = new\
  \ Dog('Fido');\n  echo 'The dog\\'s name is: ' . $fido->name . '<br>';\n  echo 'The\
  \ dog says: ' . $fido->speak() . '<br>';\n\n  $bubbles = new Dog('Bubbles');\n \
  \ echo 'The dog\\'s name is: ' . $bubbles->name . '<br>';\n  echo 'The dog says:\
  \ ' . $bubbles->speak() . '<br>';\n```\n\n（注：此处根据原文逻辑可能存在重复或断句，翻译已按原文保留）\n\n###\
  \ 提示：箭头\n\n在调用方法或属性时，你需要记住使用 `->` 运算符。\n\n## 扩展类\n\n现在你对 OOP 有了基础了解，让我们创建 `Pet`\
  \ 类。这个定义将变量和函数分组到一个逻辑单元。\n\n```php\n<?php\nclass Pet\n{\n    public $name;\n\n \
  \   public function __construct($name) {\n        $this->name = $name;\n    }\n\n\
  \    public function speak() {\n        return 'nothing';\n    }\n}\n```\n\n这个类与\
  \ `Dog` 类相似，所以不会太意外。让我们重写 `Dog` 类使其扩展 `Pet`。\n\n```php\n<?php\nrequire_once 'Pet.php';\n\
  \nclass Dog extends Pet\n{\n    public function speak() {\n        return 'Woof!\
  \ Woof!';\n    }\n\n    public function plays() {\n        return 'fetch';\n   \
  \ }\n}\n```\n\n为了好玩，让我们创建更多的动物类。创建 `Cat.php` 文件：\n\n```php\n<?php\nrequire_once\
  \ 'Pet.php';\n\nclass Cat extends Pet\n{\n    public function speak() {\n      \
  \  return 'Meow!';\n    }\n\n    public function plays() {\n        return 'chase\
  \ mice';\n    }\n}\n```\n\n...以及 `Fish.php`：\n\n```php\n<?php\nrequire_once 'Pet.php';\n\
  \nclass Fish extends Pet\n{\n}\n```\n\n现在让我们测试它们。创建 `PetTest.php` 文件并包含以下代码：\n\n\
  ```php\n<?php\nrequire 'Dog.php';\nrequire 'Cat.php';\nrequire 'Fish.php';\n\n$fido\
  \ = new Dog('Fido');\necho 'The dog\\'s name is: ' . $fido->name . '<br>';\necho\
  \ 'The dog says: ' . $fido->speak() . '<br>';\necho 'The dog plays: ' . $fido->plays()\
  \ . '<br>';\n\n$mittens = new Cat('Mittens');\necho 'The cat\\'s name is: ' . $mittens->name\
  \ . '<br>';\necho 'The cat says: ' . $mittens->speak() . '<br>';\necho 'The cat\
  \ plays: ' . $mittens->plays() . '<br>';\n\n$bubbles = new Fish('Bubbles');\necho\
  \ 'The fish\\'s name is: ' . $bubbles->name . '<br>';\necho 'The fish says: ' .\
  \ $bubbles->speak() . '<br>';\n```\n\n现在事情开始变得有趣了！请继续创建定义 `Parrot` 类和 `Lizard` 类，并更新\
  \ `PetTest.php` 以创建它们的实例，显示它们的名字以及它们可能说的。\n\n\n\n\n当我们扩展一个类时，基本上我们是从另一个类中构建一个类。这创建了父/子关系。例如，我们可以说\
  \ `Dog` 类是 `Pet` 的子类，而 `Pet` 是 `Dog` 的父类。通过在之前编写的代码的基础上进行构建，我们不需要在其他地方编写相同的代码来重复自己，因此，我们将拥有更有组织、更高效的代码。\n\
  \n每个代表特定类型宠物的类都继承父类 `Pet` 的方法和属性。考虑 `Fish` 类……它没有自己的代码，并从 `Pet` 继承了所有的行为。\n\n另一方面，`Dog`\
  \ 和 `Cat` 类扩展了 `Pet` 类，但用它们自己的版本重写了 `speak()` 方法，并通过 `plays()` 方法添加了新功能。\n\n###\
  \ 注意：Public（公共）是怎么回事？\n\n在类中，我们为对象和方法附加了所谓的`可见性`（visibility）。在赋值时，我们始终有三个选择：`public`、`protected`\
  \ 或 `private`。`public` 意味着类的对象和方法可以从任何地方调用访问。`protected` 意味着对象和方法只能由与被调用方法或对象处于同一类树中的方法和调用访问。`private`\
  \ 意味着方法和对象只能由该方法或对象所属的类访问。\n\n有关类中可见性的更多信息，请查看以下资源：\n\n* [php.net/manual/en/language.oop5.visibility.php](http://php.net/manual/en/language.oop5.visibility.php)\n\
  * [aperiplus.sourceforge.net/visibility.php](http://aperiplus.sourceforge.net/visibility.php)\n\
  * [www.sitepoint.com/learn-object-oriented-php/](http://www.sitepoint.com/learn-object-oriented-php/)‎\n\
  \n我们在上面涵盖了在 PHP 中使用 OOP 的非常基础的内容。虽然初看起来是一个非常复杂且高级编码策略，但它实际上更像骑自行车；一旦你学会了，你就永远不会忘记。\n\
  \nOOP 不仅有助于开发大型复杂应用程序变得更容易，它还是出现在几乎每种其他编程语言中的方法。在 PHP 中学习并掌握它可以帮助你未来理解其他编程语言，因此是一项非常有用的技能。\n\
