  \n多个 `elseif` 语句可以组合使用以测试不同的条件，PHP 会检查每一个条件，直到发现其中一个条件为真。一旦找到真条件，PHP 将跳过链中剩余的 `elseif`\
  \ 语句。\n\n```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to B';\n} elseif ($a\
  \ == $c) {\n    echo 'A is equal to C';\n} elseif ($a == $d) {\n    echo 'A is equal\
  \ to D';\n} else {\n    echo 'A is not equal to anything';\n}\n```\n\n## switch\
  \ 语句 \n\n如果你仔细观察我们的 `elseif` 示例，可能会发现每个条件基本上都在测试相同的内容——即某个变量的值是否等于 `$a` 的值。PHP 的\
  \ `switch` 语句可以完成类似的操作，而且看起来没那么杂乱。\n\n```php\nswitch ($a) {\n    case $b:\n    \
  \    echo 'A equals B';\n        break;\n    case $c:\n        echo 'A equals C';\n\
