  \n这种行为也意味着我们可以编写在多个 case 下执行的代码，如下所示：\n\n```php\nswitch ($a) {\n    case $b:\n \
  \   case $c:\n    case $d:\n        echo 'A equals B, C, or D';\n        break;\n\
  \    default:\n        echo 'A is not equal to anything';\n```\n\n循环\n\n大多数时候，我们使用这些比较操作符来编写`条件语句`（根据比较结果可能执行也可能不执行的语句）和`循环`（执行多次的语句）。\n\
