- "# PHP 入门指南：在周末内快速掌握 PHP\n\n\n\n\n\n![SitePoint®](img/sitepoint-logo-2012.png)\n\
  \n\n## 作者：CALLUM HOPKINS\n\n\n作者 Callum Hopkins\n\n\n\n\n\n\n\n\n\n![SitePoint®](img/sitepoint-logo-2012.png)\n\
  \n\n\n\n\n***\n\n## 关于 Callum Hopkins\n\nCallum 职业是一名 Web 开发人员，同时也热爱设计。凭借在设计和开发流程方面的知识，他能够影响\
  \ Web 构建过程的两个方面。他对复杂代码功能以及美观设计与功能的的热情促使他寻找新的方法为全球客户构建、设计和优化 Web 解决方案。\n\n## 关于 SitePoint\n\
  \nSitePoint 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
  \ 访问我们的博客、书籍、通讯报、文章和社区论坛。你将找到关于 JavaScript、PHP、Ruby、移动开发、设计等大量信息。\n\n## 关于 Jump\
  \ Start\n\nJump Start 系列书籍为你提供对 Web 开发语言和技术的快速且实用的介绍。这些书籍通常长度约为 150 页，可以在周末内读完，让你在该主题上打下坚实的基础，并有独立实验的信心。\n\
  \n***\n\n致我所有的家人和朋友，感谢你们一直的支持，我爱你们。\n\nPHP 被认为是最流行的 Web 语言之一。从核心来看，PHP 设计的目的是帮助增强网页并使其内容动态化，但多年来\
  \ PHP 已经进化成了比这有用得多的东西。通过 PHP，开发者可以轻松构建复杂的应用程序，例如论坛、图库等。\n\n在本书 **Jump Start PHP*\
  \ 中，我们将教你使用 PHP 进行编写和开发的基础知识，并将引导你从构建具有动态内容的基础 PHP 网页，一直到构建交互式 Web 应用程序。我们将解决安全、数据库交互以及为构建你的\
  \ PHP 应用程序设置开发环境等问题。\n\n在整个 **Jump Start PHP* 中，我们将维护一个持续的项目——一个小型但健壮的博客应用程序，它会将每章讨论的理论应用于真实的开发场景中。该项目将包含一些实用功能（显示帖子、评论和管理工具的前端），并希望有助于展示我们在书中贯讨论的概念。\n\
  \n## 谁应该读这本书\n\n寻求快速入门 PHP 的开发者。你需要了解 HTML 和 CSS，具有其他编程语言的经验将会有帮助。\n\n## 使用的规范\n\
  \n你会注意到，我们在整本书中使用了特定的排版和布局样式来表示不同类型的信息。请关注以下项目。\n\n### 代码示例\n\n书中的代码将使用代码块显示：\n\n\
  ```php\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\n今天，PHP 开发主要侧重于服务器端脚本，而不是通用型脚本任务，它通常被认为是微软\
  \ ASP.NET、Apache 软件基金会的 `mod_perl` 模块以及 Joyent 的 Node.js 等技术的竞争对手。PHP 主要用于处理复杂的数据处理，允许动态数据出现在网页上，例如数学计算、数字处理以及与数据库交互。它允许开发者将原本静态的\
  \ HTML 内容变为对用户请求做出响应的内容，或者对存储在数据库中的永久数据执行相同的操作。\n\nPHP 专注于 Web 开发，这使其成为开发者创建 Web\
  \ 应用程序或网站时显而易见的选择。其平缓的学习曲线让开发者能够快速开始使用 PHP 构建，而其功能的丰富性允许开发者在无需借助另一种编程语言的情况下扩展他们的项目。Digg、Etsy、Yahoo、Facebook\
  \ 和 Wikipedia 等网站都使用 PHP 来驱动其网站部分，包括与访问者相关的数据处理和处理。\n\n在网页中使用 PHP 的一个简单示例是使用计数器显示访问人数。数据库存储访问网页的人数，PHP\
  \ 用于与该数据库交互并生成 HTML 标记以显示当前计数。PHP 还可以用于创建大型、复杂且多级的导航类网站，这些网站具有许多嵌套页面，并通常用于驱动电子商务网站。PHP\
  \ 甚至允许根据收集到的该用户的信息为访问者创建定制化体验。\n\nPHP 的流行还带来了一个庞大的开发者社区，他们愿意为寻求建议的人提供帮助，而且大多数情况下是免费的，此外在线和离线都有不断扩展的参考资料库。\n\
  \n## 设置\n\nPHP 几乎在每个共享服务器托管包中可用，它也可以与 Apache HTTP 服务器软件配合使用，在你的家庭电脑上创建一个本地 Web 服务器。PHP\
  \ 还可以用于你自己的私有 Web 服务器，然后可以通过互联网访问它。\n\n家庭电脑上的本地服务器通常使用流行的 `LAMP`（Linux, Apache,\
  \ MySQL 和 PHP）、`MAMP`（Mac OS X, Apache, MySQL 和 PHP）和 `WAMP`（Windows, Apache, MySQL\
  \ 和 PHP）堆栈设置，所有这些都可以免费下载。\n\n这些堆栈通常包含一个一键安装程序，该程序会安装带有默认配置的标准 Web 服务器设置。这允许 Web\
  \ 开发者设置一个与其 Web 托管公司提供的环境几乎相同的本地环境。开发者经常使用本地服务器开始构建网站和应用程序，因为他们可以轻松访问工作文件，且无需花费额外的时间和麻烦将文件上传到在线服务器。此外，这种方法意味着不必担心开发代码意外泄露到上线站点，开发者还可以避免使用托管带宽进行文件传输。\n\
  \n## 入门\n\n在你的家庭电脑上获取本地服务器似乎可能是一项复杂的任务，但它通常非常简单：一键安装。根据你使用的操作系统，有几种选项可供：\n\n###\
  \ Windows\n\n在 Windows 上，你有两个流行且强大的安装程序可选择。第一个是 [WAMP](http://www.wampserver.com/en/)，这是一个在你的电脑上安装\
  \ Apache、PHP、MySQL 和 `phpMyAdmin` 的 Windows 程序（`phpMyAdmin` 是一个用于操作 MySQL 数据库的方便基于\
  \ Web 的界面）。另一个来自 Apache Friends 的 [XAMMP](http://www.apachefriends.org/en/xampp.html3)，这是一个包含\
  \ Apache、MySQL、PHP、Perl 和 `phpMyAdmin` 的发行版。\n\n就本书而言，我们将仅介绍使用 WAMP 的设置，但如果你选择安装该软件包，XAMMP\
  \ 的设置也遵循类似的过程。\n\n你的第一步是[下载 WAMP](http://www.wampserver.com/en/#download-wrapper)。你将获得多个下载选项，请选择与你的电脑处理器和操作系统版本相对应且为\
  \ \"PHP 5.4 2.4\" 的版本。\n\n### 注意：我的是什么种处理器？\n\n要确定你拥有什么种处理器，请查看你的“我的电脑”图标，或者你可以前往控制面板并在可用选项中选择“系统”。右键点击它并寻找\
  \ `系统类型` 选项，它应该说明你的电脑使用的是 32 位还是 64 位操作系统。\n\n### 重要：Visual C++\n\n你还需要在电脑上安装 Visual\
  \ C++ 2010 SP1 Re-ributable Package x86 或 x64。该网页将为你提供与你的操作系统类型（32 位或 64 位）相应的链接，强烈建议在安装\
  \ WAMP 之前先在你的电脑上下载并安装该软件包。\n\n下载完成后，运行安装程序。\n\n一旦安装了 WAMP，你应该会在 Windows 系统托中看到一个新图标。WAMP\
  \ 的图标会在三种不同的颜色之间切换，代表其服务的当前状态：\n\n*   红色 – Apache 和 MySQL 均离线状态。这可能是因为尚未告诉它们启动，或者由于致命的配置问题阻止了它们的启动。\n\
  *   橙色 – 其中一个服务启动失败。这通常表示存在细小的配置问题，例如未正确加载扩展库，或者默认端口被另一个程序占用。如果发生这种情况，强烈建议你向该产品的帮助台或论坛寻求帮助。\n\
  *   绿色 – 服务正在运行且没有发生错误；一切正常。\n\n你可以左键点击 WAMP 图标，将看到许多与服务交互的选项。这些选项允许你：\n\n*   管理你的\
  \ Apache 和 MySQL 服务\n*   切换在线/离线\n*   安装并切换 Apache、MySQL 和 PHP 版本\n*   访问你的日志文件\n\
  *   访问你的设置\n*   创建别名\n\n右键点击图标可以退出程序、更改程序语言并访问 WAMP 网站上的帮助页面。\n\n### 提示：80 端口问题\n\
  \nWAMP 最常见的问题是 80 端口（连接 Apache 服务器的端口）可能已被另一个程序占用。例如，如果你在启动 WAMP 时运行 Skype，可能会遇到此错误，因为\
  \ Skype 也使用 80 端口。要解决这个问题，建议你完全关闭 Skype 然后重启 WAMP。该问题的解决方案可以在 [Stack Overflow](https://stackoverflow.com/a/4705033)\
  \ 上找到。\n\n要检查本地服务器是否安装和配置正确，打开你的浏览器并在其地址栏中输入 `localhost` 或 `127.0.0.1`。你应该看到 WAMP\
  \ 的主页。\n\n![WAMP 的主页](img/wplash.png)\n\n图 1.1. WAMP 的主页\n\n### Mac OS X\n\n对于 Mac\
  \ 用户，有一个简单的一键应用程序可以在你的电脑上设置带有 PHP 的本地服务器，称为 MAMP。与 Windows 一样，你也可以使用 XAMP，但 MAMP\
  \ 是更流行的选择，因为它的开发专注于为希望使用 PHP 开发网站的人提供完美的设置。\n\n首先，你需要从 [MAMP 网站](http://www.mamp.info/en/index.html)\
  \ 下载应用程序，一旦文件下载完成，打开 .pkg 文件，这将启动安装过程。\n\n### 注意：MAMP Pro\n\n\n\n\n\nMAMP 可能会安装两个文件夹，一个名为\
  \ MAMP，另一个名为 MAMP Pro。如果你的电脑上已经安装了 MAMP Pro，请删除此文件夹和应用程序。MAMP Pro 是一个付费程序，而 MAMP\
  \ 是一个免费应用程序。\n\n完成后，你可以通过点击 MAMP 图标来启动 MAMP 程序；你将看到欢迎界面。\n\n![MAMP 启动界面](img/mampslash.png)\n\
  图 1.2. MAMP 启动界面\n\n在图 1.2 所示的启动界面上，你应该能在框的左侧看到两个标题标记为 `Apache Server` 和 `MySQL\
  \ Server` 的图标，它们旁边都应该有一个红点。这些红点意味着它们尚未启动。要启动它们，我们需要点击 `Start Servers` 按钮；圆点应该变为绿色。点击\
  \ `Start Servers` 按钮后，你的默认浏览器将打开并加载 MAMP 启动屏幕。\n\n![MAMP 启动界面](img/mampstart.png)\n\
  图 1.3. MAMP 启动界面\n\nMAMP 现在已安装。然而，它强制你使用端口 `8888` 来访问 Apache 服务器。这不像像 WAMP 那样只需在浏览器地址栏中输入\
  \ `localhost` 访问服务器那样方便。幸运的是，这个问题有一个非常简单的解决方法。切换回 MAMP 启动界面并选择 `Preferences` 按钮。在面板顶部的小导航菜单中，应该有一个标题为\
  \ `Ports` 的选项。\n\n在此窗口中，你应该能看到一个左侧有 `Apache Port` 标签的输入框。如果你将此选项从 `8888` 改为 `80`，你现在就可以通过在浏览器地址栏中简单输入\
  \ `localhost/MAMP` 来访问 MAMP 启动屏幕了。\n\n## Linux\n\n如果你运行的是 Ubuntu 或 Debian 等 Linux\
  \ 操作系统，可以使用终端从系统仓库安装 `LAMP` 包。在 Linux 上安装本地服务器与 Windows 或 Mac OS X 略有不同。安装方法稍微高级一些，但它在运行和管理服务器时允许提供更多的控制和自由。事实上，这种方法与用于在\
  \ Linux 上管理和运行实时 Web 服务器的方法几乎相同。我们在这里介绍的安装示例将专门展示在 Ubuntu 上安装 `LAMP` 的步骤。\n\n第一步是启动终端程序，可以通过在\
  \ Dash 菜单中搜索 `Terminal`、点击 Ubuntu 侧边菜单中的第一个图标，或通过文件夹导航进入 `Applications > Accessories\
  \ > Terminal` 来完成。\n\n打开终端后，你可以从在电脑上安装 Apache 开始。通过在终端中输入以下内容来实现：\n\n```bash\nsudo\
  \ apt-get install apache2\n```\n\n按下 `Enter` 键，你的终端将开始疯狂运行，但不要惊慌，这是正常的。\n\nApache\
  \ 现在应该已经安装完成，你的本地服务器基础设置也将就绪。要测试这一点，打开浏览器浏览器并在地址栏中输入 `localhost`。如果安装成功，你将看到如图 1.4\
  \ 所示的“It works!”启动界面。\n\n![Linux 上的 localhost](img/localhostlinux.png)\n图 1.4. Linux\
  \ 上的 localhost\n\n现在你需要安装 PHP，请返回终端并输入：\n\n```bash\nsudo apt-get install php5 libapache2-mod-php5*\n\
  ```\n\nPHP 5 将连同你刚刚安装的 Apache 服务器配合工作所需的各种基础库一起安装。完成后，你必须重启 Apache 才能识别到刚刚安装了 PHP。在终端中输入以下命令：\n\
  \n```bash\nsudo service apache2 restart\n```\n\n你的 Apache 服务器现在将重启，检测到你已安装 PHP，并将加载在本地服务器上运行\
  \ PHP 需要的所有库。\n\n现在你已经让本地服务器运行起来，并且安装了 PHP。要安装 MySQL 和 phpMyAdmin，我建议遵循[Mhabub Mamun\
  \ 编写的此指南。](http://www.developmentwall.com/install-apache-php-mysql-phpmyadmin-ubuntu/4)\n\
  \n最后，你可以选择启用 Apache 的 `mod_rewrite` 模块，这允许开发者通过重写请求的 URL 将用户重定向到网站的不同部分。有关启用和设置\
  \ `mod_rewrite` 模块的完整深度指南，请参考 [ Nettuts+ 指南](http://net.tutsplus.com/tutorials/other/a-deeper-look-at-mod_rewrite-for-apache/)，该指南提供了非常详细的逐步教程。\n\
  \n## PHP 配置\n\n在我们深入编写一些 PHP 代码之前，让我们配置 PHP 以更好地适应我们的项目。PHP 的配置由 `php.ini` 文件决定，该文件包含了所有关于\
  \ PHP 在我们服务器上如何运行的核心设置。你可以通过在 PHP 脚本中使用 `phpinfo()` 函数来快速查看 PHP 当前配置的概览。要这样做，请在服务器文件夹中创建一个名为\
  \ `info.php` 的新文件，向文件中添加以下代码并保存：\n\n```php\n<?php\nphpinfo();\n```\n\n现在，将浏览器指向\
  \ `info.php` 文件，你应该会看到一个页面，显示一个关于我们 PHP 当前配置信息的表格，如图 1.5` 所示。\n\n![phpinfo](img/phpinfo.png)\n\
  图 1.5. phpinfo\n\n在这里你应该找到一个标题为 `Configuration File (php.ini) Path` 的行，这将告诉你的 `php.ini`\
  \ 文件的具体位置。你可以在图 1.5` 中看到它。`php.ini` 文件包含了许多设置，其中某些你可能永远不需要更改。然而，有一些可以更改以适应你的开发环境。对于\
  \ `php.ini` 文件的之旅，我强烈建议阅读[为 SitePoint 写的文章](http://www.sitepoint.com/a-tour-of-phpini/)。\n\
  \n## Hello PHP\n\n现在你已经安装并运行了本地服务器，让我们开始编写 PHP 吧！我们首先进入 Apache 文件夹，它根据你使用的操作系统位于不同的位置：\n\
  \n- 对于使用 WAMP 的 Windows 用户，打开资源管理器或我的电脑并导航到目录 `C:/Program Files/wamp/`\n- 对于使用 MAMP\
  \ 的 Mac OS X 用户，打开 Finder 并导航到 `Applications > MAMP > htdocs` 以找到 MAMP 的目录。\n- Linux\
  \ 的 Web 位于 `/var/www`。许多 Linux 开发者喜欢编辑配置文件来更改使用的目录。要这样做，请参考 [Stack Overflow 上的解决方案](http://stackoverflow.com/a/5891858)。\n\
  \n一旦你找到了服务器的 Web 目录，你需要创建一个作为项目“根”的目录，所有的项目文件将放在这里。现在，创建一个名为 `my_project` 的目录。特意避免在文件夹名称中使用任何空格或大写字母，因为这将成为访问该文件夹内文件的\
  \ URL 的。\n\n现在在 `my_project` 文件夹中创建一个名为 `index.php` 的新 PHP 文件。创建文件后，你需要用可以编辑 PHP\
  \ 文件的文本编辑器打开它。\n\n### 注意：选择文本编辑器\n\n我建议使用支持 PHP 语法高亮的编辑器。选择编辑器是一个非常个人的决定，因为不同的编辑器提供不同的功能；某些编辑器会配合你的编码方式，而某些则可能会产生冲突。最终，选择应该取决于哪个编辑器能让编程变得更简单、更有趣。在最终决定之前，值得尝试不同的编辑器。\n\
  \n这里是一些流行的编辑器器的简短列表，包含了免费和付费编辑器的混合：\n\n*   [Adobe Dreamweaver](http://www.adobe.com/products/dreamweaver.html)\
  \ – (Windows 和 Mac OS X)\n\n\n\n\n\n*   最著名的编辑器之一。它提供了广泛的一键选项，并内置了 FTP 客户端。\n\n\
  *   [Sublime Text](http://www.sublimetext.com/) – (Windows, Mac OS X, 和 Linux)\n\
  \    *   一个免费试用的编辑器，内置了一些强大的快捷键和宏命令。\n\n* [Komodo Edit](http://www.activestate.com/komodo-edit)\
  \ – (Windows, Mac OS X, 和 Linux)\n    *   一个强大的免费编辑器，界面精美并内置 FTP 客户端。\n\n* [Coda](http://panic.com/coda/)\
  \ – (Mac OS X)\n    *   一个非常用户好的编辑器，功能非常强大。\n\n* [Notepad++](http://www.notepad-plus-plus.org/)\
  \ – (Windows)\n    *   一个非常流行的免费编辑器。\n\n一旦你选择了适合自己的编辑器，打开 `index.php`，你就可以开始向文件中写入一些\
  \ PHP 代码了。输入以下代码并保存文件：\n\n```\n<?php echo \"Hello World\"; ?>\n```\n\n让我们运行这段代码。打开网络浏览器，在浏览器的地址栏中输入\
  \ `http://localhost/my_project/index.php`。你应该看到类似于图 1.6 的内容。\n\n![Hello, world!](img/helloworld.png)\n\
  \n图 1.6. Hello, world!\n\n恭喜你！你刚刚写了第一段 PHP 代码！如你所见，代码在浏览器中显示了“Hello World”字符串，但你到底在\
  \ PHP 文件中输入了什么呢？让我们来分解一下这行代码：\n\n*   `<?php` : 这被称为起始标签。它告诉服务器随后的代码旨在解释为 PHP，服务器应该使用\
  \ PHP 引擎来渲染这些代码。每当你想在文件中使用 PHP 代码时，必须输入此标签。\n\n*   `echo \"Hello World\";` : `echo`\
  \ 是一个基础的 PHP 结构，它告诉 PHP `echo` 命令之后的内容是你希望在浏览器中显示的内容。在想要在屏幕上显示的文本周围加上引号。此外，你还在后面添加了重要的分号，表示你的\
  \ `echo` 语句结束了。\n\n*   `?>` : 这是 PHP 的结束标签，告诉服务器停止渲染 PHP 代码。结束标签并不总是需要使用的。保持代码“未闭合”可以防止意外的内容发送到浏览器中。在不需要时跳过结束标签可以避免在你开始编写更复杂的\
  \ PHP 代码时可能出现的问题。在书的后续部分，你将看到没有 PHP 结束标签的代码。该标签是有意省略的。\n\n### 重要：使用你的分号！\n\n记住在所有\
  \ PHP 语句末尾添加分号是非常重要的，因为没有分号，PHP 将不知道一个语句何时结束，下一个语句何时开始。\n\nPHP 文件还允许将 PHP 代码与普通的\
  \ HTML 结合。如果你将 PHP 和 HTML 结合在一起，就可以创建非常漂亮的网页，其中包含动态和复杂的数据，而 HTML 无法独立处理和操作这些数据。\n\
  \n这是一个 HTML 和 PHP 协同工作的快速示例：\n\n```\n<!DOCTYPE html>\n<head>\n    <title>PHP 和 HTML\
  \ 协同工作</title>\n</head>\n    <body>\n      <h1><?php echo 'This is a H1 tag with\
  \ PHP data'; ?></h1>\n      <p><?php echo 'This is a P tag with PHP data also';\
  \ ?></p>\n    </body>\n</</html> \n```\n\n如果你将 `index.php` 的内容更改为上面的示例并返回 `http://localhost/my_project/index.php`，你将在浏览器中看到\
  \ HTML 代码正确显示了所有经过 PHP 处理的代码。\n\n## PHP 变量\n\n让我们更上一层，探索变量的世界。变量代表计算机内存中的一个位置，我们可以在那里临时存储位信息。我们可以将某些数据分配给变量（将数据放入内存），并在整个脚本中使用该变量。每当\
  \ PHP 在我们的代码中看到变量时，它就知道要访问它所代表的数据。分配给变量的数据可以是任何内容，从简单的文本字符串（如“Hello World”）或数字（如“1234”）到我们将介绍的更复杂的数据结构。\n\
  \n变量名始终以 `$` 符号开头。它们的名称不能包含空格，且只能包含字母（大小写）、数字和下划线。此外，`$` 之后的第一个字符必须是字母或下划线。允许的变量名可以是\
  \ `$myAwesomeVariable`，甚至是 `$my_Awesome_Variable_1`。\n\n给变量赋予有意义的名字是一个良好的习惯，这样如果另一个开发者阅读你写的代码，他们就能知道这些数据代表什么。例如，如果我们想让一个变量包含关于人名字的数据，可以将变量命名为\
  \ `$personName`。\n\n### 注意：使用驼峰命名法 (CamelCase)\n\n如果变量名包含多个单词，通常的做法是将每个单词的首字母大写。这可以提高浏览代码时的可读性。\n\
  \n让我们来看一个变量使用的示例。修改 `index.php` 如下：\n\n```php\n<?php\n$myVar = 'Hello World';\n\
  echo $myVar;\n```\n\n那么我们编写了什么？首先，我们将字符串 \"Hello World\" 分配给变量 `$myVar`。现在再次查看 index.php\
  \ 文件，使其看起来如下所示：\n\n```php\n<?php\n$myVar = 'Hello World';\necho $myVar;\n```\n\n\
  再次刷新页面，你应该会在屏幕上看到“Hello World”。这是因为我们在 `echo` 语句使用了变量 `$myVar`。\n\n\n\n\n\n*   [`goldhat.ca/blog/php-beginner-lesson-using-variables`](http://goldhat.ca/blog/php-beginner-lesson-using-variables)\n\
  \n## 数组 (Arrays)\n\n对于内存中更复杂的数据存储方式，我们可以选择数组，它像表格一样表示数据。让我们从图 1.7 所示的表格开始。\n\n![A\
  \ simple array](img/table.png)\n\n图 1.7. 一个简单的数组\n\n我们可以像下面这样在 PHP 中将此表写为数组：\n\n\
  ```php\n<?php\n$myArray = array('item1' => 'My Value'); \n```\n\n我们在这里做的是通过 `array()`\
  \ 构造函数创建一个名为 `$myArray` 的数组，用它定义我们的值，而不仅仅是一个字符串或整数。然后，我们添加了一个“键（key）”，我们将其命名为 \"\
  item1\"，并使用 `=>` 符号为该键设置了值 \"My value\"。这个 `=>` 符号是 PHP 用来表示符号之后的数据将存储在内存中的某个位置，该位置可以通过该键从数组引用。\n\
  \n在定义数组时，我们可以像下面所示向数组中添加多个键/数据对：\n\n```php\n<?php\n$myArray = array('item1' => 'My\
  \ Value', 'item2' => 'Another value');\n```\n\n另一个选项是，我们可以创建一个空数组，并按照下面的方式稍后添加键和值：\n\
  \n```php\n<?php\n$myArray = array();\n$myArray['item1'] = 'My Value';\n$myArray['item2']\
  \ = 'Another value'; \n```\n\n从 PHP 5.4 开始，我们已经有了使用简写表示法创建数组的能力，而不是传统的 `array()`。简写方法如下：\n\
  \n```php\n<?php\n$myArray = ['item1' => 'My Value', 'item2' => 'Another value'];\n\
  ```\n\n数组允许我们处理一些非常复杂的数据，我们将在书的后面部分重新回到它们。在此期间，为了检查数组的基本用法，我建议查看以下文章：\n\n*   [`www.php.net/manual/en/language.types.array.php`](http://www.php.net/manual/en/language.types.array.php)\n\
  *   [`www.sitepoint.com/introduction-to-php-arrays/`](http://www.sitepoint.com/introduction-to-php-arrays/)\n\
  *   [`www.htmlandphp.com/beginner-php/207-introduction-to-arrays-in-php.html`](http://www.htmlandphp.com/beginner-php/207-introduction-to-arrays-in-php.html)\n\
  \n## 注释 (Comments)\n\n我们可以在 PHP 代码中为自己编写注释。注释不会被当作语句处理。我们使用两个斜杠 `//` 开始注释 —— 在斜杠后同一行中编写任何内容都将被视为注释且不会被处理。例如：\n\
  \n```php\n<?php\n// this is a PHP comment for this only\n```\n\n我们还可以使用 `/*` 来标记跨多行注释的开始，并用\
  \ `*/` 标记结束。例如：\n\n```php\n<?php\n/* this is the beginning of our PHP comment.\n\
  It can go on for multiple lines until we end it. */\n```\n\n注释允许开发者为任何阅读代码的人留下笔记，提供关于代码运行方式的见解并使其更容易维护。注释还允许我们临时隐藏代码段（“注释掉”）。\n\
  \n## 准备我们的项目 (Preparing Our Project)\n\n在结束本章之前，让我们快速列出本书项目的目录结构。我们将开发一个完全由 PHP\
  \ 和 MySQL 数据库驱动的博客应用程序，用于存储我们所有的数据。现在，我们需要在 Web 目录中创建一个新文件夹，命名为 `kickstart`。在该目录下，我们需要再创建三个目录：一个命名为\
  \ `admin`，另一个命名为 `frontend`，最后一个命名为 `includes`，如图 1.8 所示。\n\n![Our project folders](img/homefolders.png)\n\
  \n图 1.8. 我们的项目文件夹\n\n`admin` 目录将存放管理面板的文件。`frontend` 目录将包含博客公开端运行的所有文件。这个公开端是访问者查看博客文章的地方。`includes`\
  \ 目录是我们放置任何可以在 `admin` 和公共部分都使用的脚本的地方。\n\n我们还需要在 `admin` 和 `frontend` 目录内部各创建一个名为\
  \ `templates` 的目录。`templates` 目录将包含所有接收 `includes` 文件夹中脚本数据的 PHP 和 HTML 文件。这些模板文件最终将格式化来自\
  \ PHP 的数据，并创建访问者前端交互的布局。在书的后面，我们将更深入地探讨模板，并学习我们为什么在项目中使用它。这样分离这些文件夹非常有帮助，因为它将帮助你编写更整洁、组织更好的代码。\n\
  \n## 总结 (Summary)\n\n在本章中，我们涵盖了设置 Web 服务器的基础知识，通过显示文本引入了 PHP 编码，并使用了变量来存储数据。本章涵盖的所有内容都是介绍，我们将在书的后面回到触过的一些主题。\n\
  \n在下一章中，我们将研究如何使用持久存储选项如数据库来配合脚本，以及如何使用访问者的浏览器存储少量数据。此外，我们将简要探索一些重要的编程概念，如条件语句和循环，这些从数据库读取数据时是必要的。\n\
  \n## 运算符 (Operators)\n\n在 PHP 中，就像几乎所有的编程语言一样，运算符用于对变量和值进行处理或操作。最基本的运算符是 `=`，正如我们在第\
  \ 1 章中看到的，它被用于向变量赋值。但还有许多其他强大的运算符等待发现。\n\n首先，让我们在之前创建的 `my_project` 文件夹创建一个名为 `op_experiments.php`\
  \ 的新文件。在该文件中添加以下代码：\n\n```php\n<?php\n$firstName = \"myfirstname\";\n$lastName =\
  \ \"mylastname\";\n$fullName = $firstName . $lastName;\necho $fullName;  \n```\n\
  \n虽然这段代码的大部分看起来相当直观，但 `$fullName = $firstName . $lastName;` 这一行可能会让你感到意外，尤其是两个变量之间的那个点。\n\
  \n`.` 是 PHP 的字符串连接运算符；它将两个字符串连接成一个更长的字符串。PHP 获取 `$firstName` 的字符串值，加上 `$lastName`\
  \ 的值，并将结果放入变量 `$fullName` 中。当我们运行脚本 PHP 输出 `$fullName` 的值时，我们将在浏览器中看到 `myfirstnamemylastname`。\n\
  \n![The output of our experiment](img/op_experiments.png)\n\n图 2.1. 我们的输出\n\n不过这并不很易读，不是吗？别担心。我们可以轻松微调代码使输出更具可读性。修改代码使其看起来如下：\n\
  \n```php\n<?php\n$firstName = \"myfirstname\";\n$lastName = \"mylastname\";\n$fullName\
  \ = $firstName . \" - \" . $lastName;\necho $fullName;\n```\n\n现在我们可以在浏览器中查看它们时，可以看到两个名字之间的间隔。酷酷。\n\
  \n\n\n\n图 2.2. 添加一些空格后的输出\n\n## 条件语句\n\nPHP 同样拥有允许我们比较值的操作符。例如，`==` 用于检查两个值是否相同，`<`\
  \ 用于检查一个值是否小于另一个值，而 `>` 用于检查一个值是否大于另一个值。\n\n大多数时候，我们使用这些比较操作符来编写`条件语句`（根据比较结果可能执行也可能不执行的语句）和`循环`（执行多次的语句）。\n\
  \n### if 语句\n\n`if` 语句由一个条件和一个或多个分组为代码块的语句组成。如果 PHP 评估该条件并发现其为真，它将执行该语句块。如果条件为假，则\
  \ PHP 将跳过该块。在下例示例中，PHP 检查 `$a` 的值是否等于 `$b`。如果是，它会在屏幕上显示“A is equal to B”。\n\n```php\n\
  <?php\nif ($a == $b) {\n    echo 'A is equal to B';\n}\n```\n\n### else 语句\n\n`else`\
  \ 语句是 `if` 语句的伙伴，它可以直接跟在 `if` 语句后面。PHP 只有在跳过了 `if` 语句的块后，才会执行构成 `else` 块的代码。在下例中，PHP\
  \ 检查 `$a` 的值是否等于 `$b`。如果是，它会在屏幕上显示“A is equal to B”。如果该测试失败，PHP 将执行 `else` 语句之后块的代码，并在屏幕上打印“A\
  \ is not equal to B”。\n\n```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to\
  \ B';\n} else {\n    echo 'A is not equal to B';\n}\n```\n\n### elseif 语句\n\n另一个伙伴是\
  \ `elseif` 语句。正如其名，`elseif` 是 `if` 和 `else` 的组合。它包含一个条件，当 `if` 条件被发现为假时，PHP 会检查该条件。\n\
  \n多个 `elseif` 语句可以组合使用以测试不同的条件，PHP 会检查每一个条件，直到发现其中一个条件为真。一旦找到真条件，PHP 将跳过链中剩余的 `elseif`\
  \ 语句。\n\n```php\n<?php\nif ($a == $b) {\n    echo 'A is equal to B';\n} elseif ($a\
  \ == $c) {\n    echo 'A is equal to C';\n} elseif ($a == $d) {\n    echo 'A is equal\
  \ to D';\n} else {\n    echo 'A is not equal to anything';\n}\n```\n\n## switch\
  \ 语句\n\n如果你仔细观察我们的 `elseif` 示例，可能会发现每个条件基本上都在测试相同的内容——即某个变量的值是否等于 `$a` 的值。PHP 的\
  \ `switch` 语句可以完成类似的操作，而且看起来没那么杂乱。\n\n```php\nswitch ($a) {\n    case $b:\n    \
  \    echo 'A equals B';\n        break;\n    case $c:\n        echo 'A equals C';\n\
  \        break;\n    case $d:\n        echo 'A equals D';\n        break;\n    default:\n\
  \        echo 'A is not equal to anything';\n        break;\n}\n```\n\n在上面的示例中，PHP\
  \ 获取 `switch` 开始时提供的值（`$a` 的值），并将其与每个 `case` 的值进行比较。匹配的子句将被执行。如果没有其他 `case` 匹配，则执行\
  \ `default` 情况。\n\n一旦 PHP 找到匹配的子句，它就会开始执行下面的代码并一直持续到看到 `break` 关键字，之后将跳转到 `switch`\
  \ 语句的结尾，并愉快地继续执行我们脚本的其余部分。\n\n### 注意：留意 Break\n\nPHP 不会将一个 `case` 的开始视为上一个 `case`\
  \ 的结束，这就是为什么 `break` 关键字是必要的。这在起初可能会让人困惑，而且很可能会出现你忘记使用 `break` 导致脚本运行不符合预期的情况，因此记住这一点非常重要。\n\
  \n这种行为也意味着我们可以编写在多个 case 下执行的代码，如下所示：\n\n```php\nswitch ($a) {\n    case $b:\n \
  \   case $c:\n    case $d:\n        echo 'A equals B, C, or D';\n        break;\n\
  \    default:\n        echo 'A is not equal to anything';\n```\n\n循环\n\n大多数时候，我们使用这些比较操作符来编写`条件语句`（根据比较结果可能执行也可能不执行的语句）和`循环`（执行多次的语句）。\n\
