  \ = 'error';\n        }\n        header('http://localhost/kickstart/?id=' . $comment['postid']);\n\
  \    }\n}\n```\n\n我们还有 `commentnumber()` 方法，它要求在执行之前向它传递一个文章 ID。它统计传递给方法的文章的所有评论，并返回这个数字。\n\
  \n现在我们已经运行了 `Comments` 类。我们只需要做的是微调 `list-posts.php` 模板，以显示我们的文章有多少条评论——以及文章的新标题——并在\
