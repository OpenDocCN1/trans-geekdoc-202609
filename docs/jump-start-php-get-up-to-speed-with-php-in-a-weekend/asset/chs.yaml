  \    }\n}\n```\n\n正如我们看到的，我们的构造函数现在检查 URL 变量 `action` 并检查它是否存在，以及它是否持有字符串 `delete`。如果是，我们的应用程序将加载\
  \ `deleteComment()` 方法；如果不是，它将加载 `listComments()` 方法。所以让我们构建这些方法，从 `listComments()`\
  \ 开始：\n\n```\npublic function listComments() {\n    // ... (后续代码)\n}\n```\n\n\n\n\
  \n\n```php\npublic function viewpost($postid) {\n    $id = $postid;\n    $posts\
  \ = $this->ksdb->dbselect('posts', array('*'), array('id' \n=> $id));\n    $markdown\
  \ = new Michelf\\Markdown();\n    $posts[0]['content'] = $markdown->defaultTransform($posts[0][\n\
  'content']);\n    $postcomments = $this->comments->getcomments($posts[0]['id']);\n\
  \    $template = 'view-post.php';\n    include_once 'frontend/templates/'.$template;\n\
  }\n```\n\n我们已经在脚本开头引入了新的 markdown 库，准备在应用程序需要以 markdown 格式渲染数据时使用它。我们还更改了 `getposts()`\
  \ 方法以及 `viewpost()` 方法的功能，并且我们现在于构造函数中加载 `Comments` 类。\n\n让我们先仔细观察一下我们在这两个方法中添加的代码。在\
  \ `getposts()` 中，我们添加了一个新的 `foreach` 循环，它将调用我们 `Comments` 类中的 `commentnumber()`\
  \ 方法。我们还需要将该方法添加到类中，所以请记住这一点，并快速查看 `viewpost()` 方法。在这里，我们正在从 markdown 库加载 `markdown`\
  \ 类，并将此类赋值给变量 `$markdown`，使其变成一个对象。\n\n你会发现调用 markdown 库的方式与我们以前调用类的方式非常不同；这是因为\
  \ Michel 在他的库中使用了**命名空间（namespace）**。命名空间有助于为类建立唯一的标识符。这避免了当两个同名类被加载时可能发生的冲突。命名空间是在\
  \ PHP 5.3 中引入的。这是一个开始变得流行的特性，因为它有助于解决创建供公共使用的库时出现的命名复杂性问题。命名空间可以这样应用于类：\n\n```php\n\
  <?php\nnamespace Project;\nclass myProject {\n    function index() {\n        echo\
  \ 'Loading a method from a class with a namespace!';\n    }\n}\n```\n\n它们的实现非常简单，但可以对代码的互操作产生巨大的改进。例如，markdown\
  \ PHP 库使用命名空间 `Michelf`，因此为了将库的类及其方法加载到我们的脚本中，我们只需要在调用类之前在脚本中让命名空间出现。在这种情况下，我们不需要写：\n\
  \n```php\n$markdown = new Markdown();\n```\n\n而是必须写：\n\n```php\n$markdown = new\
  \ Michelf\\Markdown();\n```\n\n### 注意：更多关于命名空间\n\n关于命名空间的更多信息，请参阅 [PHP 手册](http://php.net/manual/en/language.namespaces.php)\
  \ 和 [SitePoint 上的这篇文章](http://www.sitepoint.com/php-namespaces/)。\n\n现在我们已经实现了 markdown\
  \ PHP 库，可以使用它将用 markdown 语法编写的文章转换为完全渲染的 HTML。\n\n我们添加的最后一段新代码是对我们 `Comments` 类中另一个方法的调用，我们还没有编写该方法。该方法是\
  \ `getcomments()`，它将让应用程序加载特定文章的所有评论。\n\n让我们从 \"frontend\" 目录打开 `comments.php` 文件。按如下修改代码：\n\
  \n```php\n<?php\nrequire_once 'frontend/posts.php';\nclass Comments extends Blog\
