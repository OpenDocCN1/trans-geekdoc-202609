  \n除了为用户添加了一个可以为帖子插入标题的额外字段外，我们还更改了他们输入内容的文本区域；我们更改它使其变成了一个支持 markdown 的输入字段。对于不熟悉\
  \ [markdown](http://daringfireball.net/projects/markdown/) 的人来说，它是一种简单的纯文本标记语法，旨在易于为内容添加格式。markdown\
  \ 引擎随后会将内容转换为有效的 HTML 格式。\n\n\n\n\n\n对于我们的项目，我们将使用一个易于实现的 JavaScript Markdown 转换器和编辑器，名为\
  \ [Pagedown](http://code.google.com/p/pagedown/)。要实现该库，你需要按照顺序加载三个 Pagedown 库：`Markdown.Converter`、`Markdown.Sanitizer`\
  \ 和 `Markdown.Editor`。一旦加载了这些库，通过将以下代码添加到 `header.php` 模板文件的`<head>` 标签中来初始化这些库：\n\
  \n```\n<script>\n    (function () {\n        var converter = new Markdown.Converter();\n\
  \        var editor = new Markdown.Editor(converter);\n        editor.run();\n \
  \   }());\n</script>\n```\n\n你还需要确保你有正确的元素来加载编辑器的格式按钮，并为你的文本区域分配正确的类名，以便库能够确定在何处加载文本格式代码。此外，库还需要知道在你输入内容和进行格式化时，在何处显示文章的预览。\n\
  \n我们已经在上面的模板中添加了了这两个元素及其所需的类。让我们来看看我们添加的代码。以下是格式按钮和文本输入的代码：\n\n```\n<div class=\"\
