- raw: "What did Bitcoin go through during its initial stages of creation?\n\nThe\
    \ proof cited by the magazine includes the fact that the name Satoshi literally\
    \ gave birth to Dorian. He graduated from Cal Poly University as a physicist and\
    \ worked as a systems engineer for secret military projects and as a computer\
    \ engineer for corporations in electronics and financial information services.\
    \ \"Nakamoto also has libertarian tendencies and encouraged his daughter to have\
    \ a business \"not under the thumb of the government.\" And when he was first\
    \ questioned about Bitcoin, Nakamoto mistakenly believed it was a query about\
    \ one of the classified projects he did for U.S. military contractors and said:\
    \ I'm not interested in that anymore, and I can't talk about it. It was handed\
    \ over to other individuals.\n\nJanuary 2009\n\nLess than three months later,\
    \ by mining the first block of Bitcoin, Nakamoto announced the official beginning\
    \ of the crypto-currency universe. Nakamoto was given 50 Bitcoins for approving\
    \ the first transaction, the beneficiary of which was Hal Finney called the Genesis\
    \ Block of Bitcoin. The momentum for the digital currency was formally underway,\
    \ with transactions officially registered and the Bitcoin network legitimized.\n\
    \nMarch 2010\n\nMore than a year after official trade, in the form of the now-discontinued\
    \ BitcoinMarket.com, the first crypto currency trading market was introduced.\
    \ On a Bitcoin forum, a consumer who wanted to begin treating Bitcoin as a currency\
    \ that people might share with each other and exchange for dollars suggested this\
    \ groundbreaking growth. Traders could potentially gauge the worth of a single\
    \ Bitcoin, originally priced at fractions of a penny.\n\nMay 2010\n\nLaszlo Hanyecz\
    \ reported the first purchase of products using Bitcoin with the first digital\
    \ currency trading market set up and rising at an encouraging pace. Hanyecz bought\
    \ two Papa John's pizzas for 10,000 Bitcoin on May 22, 2010, an amount estimated\
    \ at $80 million in 2018. The validity of the crypto currency has further solidified\
    \ this day. It has since then been annually celebrated as Bitcoin Pizza Day.\n\
    \nFebruary – June (2011)\n\nAt this point, when other trading markets took center\
    \ stage, including the notorious Mt. Gox market, BitcoinMarket.com was becoming\
    \ more irrelevant. February marked the first time that, as its value began to\
    \ soar, Bitcoin hit parity with the US dollar. Throughout the year, competing\
    \ crypto currencies have also started to emerge.\n\nIn June, when hackers stole\
    \ 2,000 Bitcoins, the first crypto currency attack occurred on Mt. Gox. The market\
    \ continued to rise in notoriety and holdings amid the hack.\n\nThe year 2013\n\
    \nTwo years fast forward, and Mt. Gox is easily the world's biggest currency market.\
    \ The market accounted for more than 70 percent of all Bitcoin trades at its peak\
    \ in 2013, according to Investopedia. Although excitement soared, the exchange's\
    \ extreme notoriety still provided hackers with a golden chance.\n\nFebruary 2014\n\
    \nMt. Gox went from being the biggest Bitcoin exchange in the world to bankrupt\
    \ in the space of a month. The exchange was the victim of the most important hack\
    \ in the history of crypto currencies. Hackers looted from Mt. Gox consumers an\
    \ astronomical 744,408 Bitcoins, as well as an additional 100,000 from the exchange\
    \ itself. The valuation was $460 million at the time. Consequently, in the coming\
    \ months, the hack forced Bitcoin's worth to nosedive by 50 percent. Although\
    \ the value of the crypto currency subsequently returned to its pre-attack metrics,\
    \ the hack itself highlighted the need for stronger security measures.\n\nJuly\
    \ 2015\n\nAs Bitcoin and rival crypto currencies were still recovering from the\
    \ hack's shock, a new crypto currency was introduced, carrying another degree\
    \ of protection with it. The Ethereum network was established to exchange the\
    \ ether crypto currency as a platform. The network made the use of smart contracts\
    \ common, cryptographic software that makes it much easier to promote credible\
    \ transactions without a third party at all being present. The Ethereum network,\
    \ along with its smart contracts, is now used by multiple crypto currencies in\
    \ the form of ERC-20 tokens in the world of crypto currencies. ERC-20 tokens vary\
    \ in the sense that they are assets generated by the smart contracts of the Ethereum\
    \ network, whereas Bitcoin and other crypto coins have their own blockchain and\
    \ thus coexist with the blockchain of Ethereum.\n\nPresent \n\nSince then, advances\
    \ in the crypto-currency environment have persisted, and there are currently more\
    \ than 2,000 tradable crypto-currencies. With its latest market-wide assessment\
    \ hitting $ 128 billion in April 2020, Bitcoin appears to rule supreme. In terms\
    \ of market capitalization, the digital currencies XRP-US $8 billion and Ethereum-US\
    \ $19 billion stands above the other three crypto currencies.\n\n# Chapter 4:\
    \ What is Blockchain?\n\n![Blockchain Technology : The Beginning of a New Era\
    \ in Traceability | VISIOTT](Images/image00218.jpeg)\n\nThe blockchain is a data\
    \ recording mechanism that makes it difficult or impossible to modify, hack, or\
    \ cheat the system. A blockchain is basically a digital transaction ledger that\
    \ is duplicated and spread on the blockchain throughout the whole network of computing\
    \ systems. Each block in the chain includes a number of transactions, and a record\
    \ of that transaction is added to the ledger of every party every time a new transaction\
    \ happens on the blockchain. Distributed Ledger Technology is defined as a shared\
    \ network operated by many users (DLT). The blockchain is a type of DLT in which\
    \ an immutable cryptographic signature called a hash is registered in transactions.\
    \ This suggests that if one block of one chain was altered, it would be automatically\
    \ obvious that it had been corrupted. They would have to change every block in\
    \ the chain through all the distributed iterations of the chain if hackers were\
    \ to corrupt a blockchain structure. As blocks are attached to the chain, block\
    \ chains such as Bitcoin and Ethereum are actively and continuously increasing,\
    \ which greatly contributes to the stability of the ledger. The blockchain carries\
    \ the promise of transactional openness for companies, the potential to build\
    \ stable, real-time contact networks with collaborators worldwide to facilitate\
    \ everything from supply chains to payment networks to real estate transactions\
    \ to the exchange of health data. Current speculation around this comparatively\
    \ modern technology is real because DLT is basically a new model for the exchange\
    \ of information; computer providers and businesses have not surprisingly raced\
    \ to learn how to use distributed ledger technology (DLT) to save time and administrative\
    \ costs.\n\n## 4.1 The future of blockchain technology\n\nOne of the most talked-about\
    \ developments in the industry right now is the blockchain. From finance and cyber\
    \ security through intellectual property and healthcare, Block Chain Tech has\
    \ the ability to force big improvements and generate new markets across industries.\
    \ A blockchain is a shared archive that is open to multiple people as an electronically\
    \ distributed ledger or registry of documents. To register, process, and validate\
    \ any transaction, block chains use cryptography, making them stable, permanent,\
    \ and transparent. Two general block chain groups exist:\n\n*   Permissionless,\
    \ to be entered by anyone\n\n*   Permissioned, which allows participants to be\
    \ approved by the member or organization that oversees it (this category is further\
    \ divided into private and community blockchain networks)\n\n### 4.1.1 Who is\
    \ using block chain already?\n\nThe most well-known instance of blockchain technology\
    \ is Bitcoin, but a rising number of early adopters are entering it. Microsoft,\
    \ Goldman Sachs, Visa and Deloitte, for example, are investing in ventures in\
    \ the blockchain. And organizations that operate on services focused on the blockchain\
    \ include:\n\n*   To control copyrights, Spotify"
