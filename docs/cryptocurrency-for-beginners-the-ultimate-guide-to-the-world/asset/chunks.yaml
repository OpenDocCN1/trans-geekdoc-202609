    ## 4.3 Cardano


    Cardano is a decentralized cryptocurrency platform that is one of the world''s
    first accessible and peer-reviewed networks. Its goal is to provide enhanced features
    via a scientific and research-based method. Output Data Hong Kong founded Cardano,
    headed by creator Charles Hoskinson, who''s one of the numerous co-founders of
    Ether and has worked on Ethereum and Bitshares Classic. They tasked academics
    and professionals from various educational institutions with examining Cardano''s
    protocol early on.


    ![As the FOMO-Driven Rally in Cardano&#39;s ADA Coin Reaches a Fever Pitch, Expect
    a Correction](Images/image00195.jpeg)The fundamental goal was to develop a 3rd
    platform that could facilitate smart contract implementation while addressing
    the scale challenges plaguing Bitcoin, the first-generation currency. It''s no
    surprise that many experts predict Cardano will eventually replace Ether, a second-generation
    currency, provided it lives up to its promises. The Cardano Settling Layer (CSL)
    and the Control Layer, respectively, are used to settle transactions and smart
    contracts in Cardano. The Ouroboros proof-of-stake method lies at the core of
    Cardano. Cardano''s protocol is less energy-intensive and less expensive than
    proof-of-work systems.


    The Pros of Investing In Cardano


    Knowing the benefits of buying in Cardano is critical in determining if ADA is
    just a good and possibly successful investment for you. Even if there are more
    advantages than disadvantages, this does not imply you should assess them quantitatively;
    some disadvantages may exceed numerous advantages. So, let''s look at some of
    the advantages of owning Cardano.


    Academic backing:


    As previously said, Cardano has the advantage of being one of the few currencies
    that has been studied by academics, who have given it high marks. In addition,
    numerous academics work with IOHK and produce articles on what they think the
    project should do next to enhance Cardano. This offers Cardano a level of trust
    that other currencies lack, and it''s also incredibly valuable for individuals
    who want to know more about it.


    Great development team:


    Cardano, founded by Ethereum co-founders Charles Changing existing and Jeremy
    Wood, garnered a lot of traction following its formal release in 2017. Cardano
    is also a participant in guaranteeing the protocol is free of flaws. Cardano evaluated
    numerous protocols and designed a sophisticated blockchain to avoid flaws and
    hackers.


    Cardano uses multiple layers:


    *   It''s one of Cardano''s primary benefits.

    *   It also enables modifications to be made without disrupting payments or transactions.

    *   Cardano provides infinite scalability and rapid transactions by creating a
    settlements layer and a computing layer.


    The Cons of Investing in Cardano


    While Cardano offers several compelling benefits over other currencies, investors
    and traders should be aware of the drawbacks of buying in ADA before choosing.


    Investing in Cardano, like any other investment, is not without risk. Investing
    in Cardano has several major drawbacks:


    Cardano wants to implement a voting system:


    Though having an open system of voting where modifications may be offered and
    voted on is enticing, there is one potential disadvantage because token holders
    aren''t always tech-savvy and might vote for an irrational conclusion.


    Cardano is still in development:


    Despite its reputation as an "academic blockchain" that has undergone extensive
    scrutiny and testing, Cardano is still in its early stages of development. This
    is perhaps the most important reason to avoid Cardano. Cardano takes a little
    time to grow, even as it tries to stay up with competition and technological breakthroughs.
    As a result, Cardano has already been losing ground to Ethereum and EOS for some
    time, as it still lacks unfinished contract and token specifications. Cardano
    is still focusing on scalability, and whereas cryptos like Ripple can handle 1,000
    operations per second, Pascal can only potentially process 257 transactions per
    second.


    Indeed, Cardano is lagging well behind where it was, with several delays in the
    past pushing back releases. Cardano lacks contract, and dApp features are possibly
    the most concerning of all. While we said that the Goguen update should be coming
    soon to bring these features, this is absolutely a con until it is realized since
    we cannot depend on these promises until it is implemented.


    This is a huge worry since these are the main things we''ve all been anticipating!
    (This means Cardano might be a viable Ethereum alternative. It fuels concerns
    that the majority of Cardano''s worth is built on hype. They claim to be the greatest
    in research articles but don''t provide much proof to back it up. Investing in
    Cardano is, however, mainly speculative until they produce.


    Issues with its synchronizations between ledgers:


    Even though Cardano has created a unique method, some opponents believe that Cardano''s
    assumptions about the ability of ledgers to be synced at any given moment in time
    are impractical for a global network.


    Many experts believe it is still feasible to do double-spending or 51 percent
    assaults on the system. For example, input endorsers may approve identical transactions
    from two different slot leaders.


    ## 4.4 Myths about Cryptocurrency


    The universe of cryptocurrencies has flourished in recent years due to the asset''s
    incredible profits. However, their meteoric growth, fueled by Bitcoin, has spawned
    a slew of myths that may or may not be genuine. Here are some typical cryptocurrency
    misconceptions.


    Government can ban and stop cryptocurrencies.


    It is feasible for governments to order financial institutions to cease dealing
    with cryptocurrency or any companies that deal with them, but it is practically
    hard to outright prohibit cryptocurrencies from existence. Cryptocurrency transactions
    are no more complicated than sending an email, and anybody who has internet access
    can do them with ease.


    Governments have been apprehensive of the dangers involved with cryptocurrency
    because they want to exert more authority over anything that could be deemed a
    viable currency in the first place. However, a growing number of countries have
    shown a readiness to approach cryptocurrency with an inquisitive attitude in recent
    years.


    Cryptocurrencies are used to support criminal, terrorist, and drug-related operations.


    ![Down the Rabbit Hole: A Cryptocurrency Primer | CFA Institute Enterprising Investor](Images/image00196.jpeg)Cryptocurrencies,
    like currency and the financial system, may be used for malicious reasons. The
    fallacy, on the other hand, is that cryptocurrencies are a haven for illegal conduct.
    Per a Chainalysis analysis, illegal activity accounted for $10 billion, or 1%,
    of all cryptocurrency the year before, down from nearly $20 billion, or 2%, in
    2019.


    Cryptocurrency transactions are also entirely anonymous, which is a fallacy. And
    also, are all transactions accessible just on a blockchain network, but government
    authorities are generally sophisticated enough to penetrate the cloak of anonymity
    provided by bitcoin transactions.


    Governments and commercial enterprises may use crypto forensics services like
    Coinfirm, for example. Furthermore, tighter rules are projected to substantially
    restrict criminal activity in crypto by increasing KYC standards in all nations.


    Blockchain has only one demonstrable use case: cryptocurrencies.

