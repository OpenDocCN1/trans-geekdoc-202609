    \ investor Mark Cuban. The site, which is built on the Ethereum and Zilliqa blockchains,\
    \ is coupled with MetaMask, which allows buyers to create cryptocurrency wallets.\
    \ Free \"gasless\" NFTs, short-run printing series, and regular transaction-based\
    \ things are all options for creators. Buyers can purchase featured things or\
