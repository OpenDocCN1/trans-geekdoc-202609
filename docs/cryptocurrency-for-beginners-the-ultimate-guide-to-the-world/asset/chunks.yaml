  trans: '

    # 一个新投资者经常忽视的技术指标是交易量。了解投资者正在交易多少资金可能帮助你发现特定项目的活跃情况。通常，一个正在增长的市场会有交易量的增加。5 月份，Stellar
    Lumens（X.L.M.）的交易量有所增加，这表明该加密货币的广泛吸引力。X.L.M.在 5 月份结束时以 8.79 亿美元收盘，略高于上个月的 14.9
    亿美元的收盘价。X.L.M.在 5 月份上涨，达到 2021 年 5 月 10 日星期一的纪录高位$0.78。5 月份观察到的交易量包括 30.20 亿美元、20.60
    亿美元、48.80 亿美元、45.00 亿美元和 67.20 亿美元，这些交易量按日期顺序并未特定排列。这表明交易商和投资者对该资产的高度关注。


    # 长期投资者，尤其是对冲基金等投资机构，通常回避交易量不足的公司。基于这句话，长期持有 X.L.M.的投资者正坚持持有他们的投资，希望价格会上涨。因此，虚拟货币的交易活动一直在稳步增长。


    ## 改善日常使用率


    # 每天，Stellar 都会处理数百万笔交易。X.L.M.的活动计数达到了 251 万，总计$212.05 百万美元。这对于尚未被数百万互联网零售商作为支付方式使用的加密货币来说，特别令人瞩目。这应该能说服你作为交易者或投资者认为投资
    Stellar 是值得的，因为数百万个人定期使用这种数字资产。


    ## 投资 Stellar 的缺点


    # 你可能会因为只关注资产的特性而损失大部分，甚至全部的资金。让我们快速了解一下在投资 Stellar 之前应该知道的缺点。


    # 与其他团队相比，Stellar 团队相对较小。


    # 截至 2020 年底，Ripple 有 548 名员工。Stellar 实验测试组在 2021 年 10 月有 115 名员工。这为 Ripple 这家直接竞争对手在广告、开发和区块链解决方案用于解决传统日常交易方法方面的竞争力提供了优势。


    ## 面临来自 Ripple 的强劲竞争


    # X.L.M.的交易验证与 X.R.P.的交易验证不同。Stellar 比 Ripple 更去中心化，这是加密圈的常识。因此，两个跨境支付网络都服务于集中化的金融机构。潜在消费者可能会考虑在日常运营中使用
    Ripple 的软件解决方案，因为 Ripple 的 X.R.P.代币更为集中化，已为数百家金融机构提供服务。这归功于 Ripple 的先发优势以及庞大的合作伙伴名单。


    # Stellar 正在努力追赶。也许这就是为什么 Stellar 实验测试组在 2021 年 1 月与乌克兰政府达成去中心化数字货币协议，向全球发出强烈信号。


    # 无法获得与其独特特征相匹配的估值。


    # X.L.M.于 2018 年 1 月 4 日触及$0.9381 的历史最高点，这一事实难以理解。这表明 X.L.M.在超过三年内未测试$0.9 区域。与此同时，比特币和以太坊的价值已几乎涨幅
    1000%。这引发了加密货币专家和专业人士对该资产能否实现$1、$5 或$10 价格目标的疑虑。你只能希望 X.L.M.的价格在未来显著上涨。目前它交易价格低于一分钱，要让其价值与
    B、b、D.O.T.和 LINK 等代币相匹配需要重大创新。


    ## 3.3  Neo


    # N.E.O.是代币及其运行的网络名称。与 Ethereum 允许用户构建去中心化应用和智能合约的方式类似，该网络也提供此功能。N.E.O.与其他加密货币的区别在于，其系统目前受到权威机构的管理，该机构要求用户在网络上验证身份。


    # N.E.O.是开源、去中心化的区块链平台和加密货币，它是第一个采用区块链技术和数字身份来数字化资产、通过合约自动化信息资产转移，并通过分布式网络实现“智能经济”的平台。


    ## Neo 区块链平台的优势


    ![NEO 价格在中美洲正面评价后超过$8 - CryptoMode](img/image00191.jpeg)


    - N.E.O.的通用轻量虚拟机，即 NeoVM，允许使用任何编程语言。N.E.O.架构提供的虚拟机高效、安全且可扩展，同时也支持构建去中心化应用（DApps）。N.E.O.平台的最佳特性是
    G.A.S.，它可以被描述为 N.E.O.的资产对。因此，N.E.O.持有者将获得 G.A.S.，这是持有 N.E.O.的分红。它根据公式分配。如果你在钱包中持有
    N.E.O.，你每天都会收到 G.A.S.。


    - 数字资产、数字身份和智能合约是“智能经济”的一部分。N.E.O.的一个卖点就是其智能经济。它与其他加密货币，特别是 Ethereum，有着显著区别。它将在网络上数字化资产，一旦数字化，它们将保留在网络上并受益于去中心化、透明、信任、可追溯性，以及任何人都能识别资产的特性。


    - 其“汽油”（Petrol）成本在最近几个月大幅上涨，为持有 N.E.O.提供了良好的存储激励。如果你持有 100 个 NEO，每年将收到 0.03411
    个 Gas。一个框架只有在有成功运行的项目时才能有效；N.E.O.生态系统中已有许多成功的项目，这些项目以各自方式对 N.E.O.产生积极影响。


    - 任何拥有资产的公司、个人或其他实体都可以注册数字身份。它基于数字证书（PKI）（PKI）系统。开发者可以利用智能合约使整个基础设施运作。与 Ethereum
    不同，N.E.O.不要求你学习不同的编程语言来编写智能合约。因此，任何程序员都可以轻松上手，在 N.E.O.平台上构建智能市场。


    - NEX 是一个有希望的 NEO 基于项目，它是一个去中心化交易所和支付解决方案，运行在 N.E.O.上。在注册用户的流程开始之前，它已经存在，而首次销售计划于今年晚些时候进行。N.E.O.与
    OnChain 有着有意义的联系；对于那些与其具有相似意图的人，N.E.O.作为 D.N.A. — OnChain 的系统的基石发挥作用。


    ## Neo 区块链平台的缺点


    # 尽管 N.E.O.由于其中国根源而在亚洲非常流行，但它在西方世界仍然未知。N.E.O.面临着像 Ethereum 和 E.O.S.这样的大型竞争对手，后者拥有忠实的追随者和在加密社区中建立的良好声誉。由于新竞争对手不断出现，N.E.O.必须努力赢得市场。


    # 尽管中国严格的政府结构支持 N.E.O.，但其技术选择可能受政治影响。N.E.O.高度集中化，开发者控制了几乎所有的代币，且短期内是否会发生变化尚不清楚。


    # N.E.O.是否是一个好的投资？


    '
