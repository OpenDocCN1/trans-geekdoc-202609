    \ a variety of real-world applications, but are they a technology for the future?\
    \ It's difficult to predict if NFTs will become more commonly employed in the\
    \ future. Clearly, there is a lot of interest in them right now, and they have\
    \ a lot of potential benefits. However, the technology is still in its early stages,\
    \ and there are a number of obstacles to overcome. Many of these new industries\
    \ are looking for qualified workers, so knowing the fundamentals could help you\
    \ advance in your career. NFTs are a fascinating element of popular culture, whether\
    \ they're the future or not.\n\n### 6.5.1 Future Collectibles\n\nnon-fungible\
    \ tokens were the craze in the art world earlier this year. However, fresh research\
    \ indicates that the NFT craze is receding. According to Nonfungible, overall\
    \ revenues dropped from a seven-day high of $176 million on May 9 to only $8.7\
    \ million on June 15. As a result, volumes are essentially back to where they\
    \ were at the beginning of 2021. According to Gauthier Zuppinger, chief operating\
    \ officer of Nonfungible, one of the key causes for the dramatic dip in the NFT\
    \ market was a fast surge and collapse in sales of new crypto collectible items\
    \ called MeeBits — developed by the founders of CryptoPunks. The point is, whenever\
    \ you witness such a rapid spike in any trend, you'll also see a relative fall,\
    \ which indicates a market stabilization. The digital collectibles mania, according\
    \ to Geoff Osler, CEO and co-founder of NFT app S! NG, was likely fueled by \"\
    pent-up demand\" from riches earned through growing cryptocurrency values, and\
    \ the market now appears to be settling in line with a decrease in crypto markets.\n\
    \n## 6.6 What’s next for NFTs?\n\nNFT proponents do not believe the market's latest\
    \ slump is the end of the road. The market's treatment of high-profile NFTs as\
    \ speculative assets was clear when they sold for millions of dollars. The more\
    \ pressing question for NFTs is their long-term worth, which is expected to be\
    \ substantial. Ordinary people will spend more and more of their time — and thus\
    \ money — in virtual environments as augmented & virtual reality technology improves.\n\
    \n### 6.6.1 Ethereum and the future of NFT\n\nNFT's exponential rise in 2021 can\
    \ be attributed to Ethereum. The possibilities for what NFT technology can provide\
    \ culture and commerce are apparent, as is the global thirst for it. Now is the\
    \ moment for NFT technology—and the blockchain that powers it—to expand its capabilities.\
    \ The majority of NFT traffic currently occurs and originates on Ethereum, according\
    \ to the current state of affairs. NFTs were born on Ethereum and will continue\
    \ to play a significant role in the future, even if there are several chains.\
    \ As a result, Ethereum compatibility is critical for new ecosystems. NFT systems\
    \ should continue to be EVM compatible, allowing them to be used with Ethereum\
    \ wallets such as Metamask. This is also one of the reasons why the Polkadot ecosystem\
    \ is so powerful: it allows you to start developing your product with a multichain\
    \ future in mind. For a variety of reasons, Ethereum allows NFTs to function.\
    \ It's easy to prove ownership history because transaction history, as well as\
    \ token information, is publicly verifiable. Furthermore, after a transaction\
    \ is confirmed, manipulating the data to \"steal\" ownership is nearly impossible.\
    \ Furthermore, trading NFTs can be done peer-to-peer without the use of platforms\
    \ that take huge commissions as compensation. The \"backend\" of all Ethereum\
    \ products is the same. To put it another way, all Ethereum products can communicate\
    \ with one another, making NFTs transferable across products. You can easily purchase\
    \ an NFT on one product and sell it on another. You can list your NFTs on several\
    \ items at once as a creator, and each product would have the most up-to-date\
    \ details. Finally, because Ethereum does not go down, your tokens would always\
    \ be available for sale.\n\n### 6.6.2 Environmentally positive crypto\n\nAccording\
    \ to recent studies, Ethereum uses 44.94 terawatt-hours of electrical energy every\
    \ year, which is similar to the power output of entire countries. Chains like\
    \ Polkadot, Kusama, and Unique Network use a consensus method that is built to\
    \ accommodate clean solutions and \"green NFTs\" because the computational power\
    \ required is so low. Blame the power generators, not the technology; we have\
    \ renewable energy that refuses to be adopted, which has nothing to do with NFTs.\
    \ NFTs are becoming more popular, which means they're being scrutinized more closely\
    \ - particularly in terms of their carbon footprint. We must recognize that NFTs\
    \ do not increase Ethereum's carbon footprint directly. Ethereum's present method\
    \ of keeping your dollars & assets secure is energy-intensive, but it's about\
    \ to get better. When Ethereum's carbon footprint is enhanced, it will be 99.95%\
    \ lower, making it more energy-efficient, unlike many existing industries. \n\n\
    ### 6.6.3 Co investing in art and luxury collectibles\n"
  trans: '

    Mintable 是一个双向市场，用于购买和出售 NFT，类似于 eBay，由 Marc Benioff 的 Time Ventures 和亿万富翁投资者
    Mark Cuban 支持。该站点基于以太坊和 Zilliqa 区块链构建，并与 MetaMask 结合，使用户可以创建加密货币钱包。免费的“燃料费”（gasless）NFT、短期打印系列以及常规交易选项均为创作者提供。买家在创建个人资料并加载钱包后，可浏览特色商品或参与拍卖，获胜者会通过电子邮件通知。


    ### 6.4.8 Axie Infinity


    Axie Infinity 是一款受宝可梦启发的电子游戏，玩家在其中收集卡通生物、与其他玩家对战，并建立农场王国。该游戏由越南初创公司 Sky Mavis
    开发。2021 年 9 月 18 日至 10 月 18 日，Axie Infinity 的月活跃用户数在其网站上平均超过 2300 万。NFT 用于加密角色和土地地块。收藏家和玩家可以在在线市场上购买它们，部分虚拟地产地块的价格超过
    2 万美元，动物价格则达到数百美元。


    ### 6.4.9 So rare


    So rare 是一个基于加密货币的幻想足球联赛，球迷可以以 NFT 形式购买球员卡片，并在线比赛中使用它们。该平台拥有 180 家授权俱乐部，包括美职赛（Major
    League Soccer）球队，所有交易均在以太坊上进行。虽然球迷可以通过购买低价数字球员加入幻想联赛，但特殊 NFT 项具有得分倍率，使其在竞争中占优。例如，12
    月份，里昂 1 号球员基利安·姆巴佩（Kylian Mbappe）的稀有卡片以 65,000 美元售出。So rare 于 12 月获得了 6.8 亿美元的
    Series B 融资，由 SoftBank 的 Vision Fund 2 投资，据 TechCrunch 报道，估值达 43 亿美元。


    ### 6.4.10 Venly


    Venly 的点对点 NFT 市场已进入 beta 阶段，用户基数超过 20 万，使用户无需先获取比特币即可创建、购买和出售游戏角色、武器和收藏品。用户可通过链接数字钱包，在区块链游戏如
    The Sandbox、Ethermon 和 Vulcan Verse 中买卖资产。该与区块链无关的市场现已通过与 Polygon 的合作，支持以美元（US
    dollars）通过 PayPal 进行支付，Polygon 是一个用于连接以太坊兼容区块链网络和像 Binance 等加密货币交易所的开发框架。


    ### 6.5 NFTs future


    我们已经看到非同质化代币（NFT）具有多种现实应用，但它们是未来的技术吗？预测 NFT 是否会在未来更广泛地被采用并不容易。目前，它们受到大量关注，并拥有巨大的潜在收益。然而，该技术仍处于起步阶段，面临诸多需要克服的障碍。许多新兴行业正在寻找合格员工，掌握基础知识可能有助于你在职业生涯中获得提升。NFT
    是流行文化的一个有趣元素，无论它们是未来还是现在。


    #### 6.5.1 Future Collectibles


    非同质化代币在本年度早些时候艺术界掀起了热潮，但最新研究表明，NFT 热潮正在回落。根据 Nonfungible 数据，整体收入从 5 月 9 日的七天高点
    1.76 亿美元下降至 6 月 15 日的 870 万美元。因此，交易量基本回到 2021 年初的水平。Nonfungible 的首席运营官 Gauthier
    Zuppinger 表示，NFT 市场的巨幅下跌主要原因是新型加密收藏品 MeeBits（由 CryptoPunks 创始人开发）的快速增长与迅速崩盘。关键在于，任何趋势的快速上升都会伴随相应的下降，这表明市场正在趋于稳定。数字收藏品的狂热，据
    S! NG（NFT 应用）首席执行官兼联合创始人 Geoff Osler 所说，很可能是由“滞后需求”推动的，即因加密货币价值增长而积累的财富，而如今随着加密市场的下降，市场正回归正常。


    ### 6.6 What’s next for NFTs?


    NFT 倡导者不认为市场的最新低迷是终点。高价值 NFT 被视为投机资产的表现，已在数百万美元的交易中显现。NFT 更关心的问题是其长期价值，这预计将相当可观。随着增强现实（AR）和虚拟现实（VR）技术的进步，普通人将在虚拟环境中花费更多时间，进而花费更多金钱。


    #### 6.6.1 Ethereum and the future of NFT


    2021 年 NFT 的指数级增长归功于以太坊。NFT 能为文化和商业带来的可能性显而易见，全球对其的需求也旺盛。现在正是 NFT 技术及其底层区块链扩展能力的时机。当前
    NFT 流量的大部分发生并发源于以太坊。NFT 诞生于以太坊，并将在未来继续发挥重要作用，尽管存在多条链。因此，以太坊兼容性对新生态系统至关重要。NFT 系统应继续保持
    EVM 兼容性，以便与以太坊钱包（如 Metamask）协同工作。这也是 Polkadot 生态强大的原因：它允许你以多链未来为设计目标开发产品。出于多种原因，以太坊使
    NFT 能够运行。它能够轻松验证所有权历史，因为交易记录和代币信息均可公开验证。此外，交易确认后，篡改数据以“窃取”所有权几乎不可能。再者，NFT 可通过点对点方式交易，无需依赖收取高额佣金的平台。以太坊所有产品的“后端”相同。换句话说，所有以太坊产品可以相互通信，使
    NFT 跨产品可转移。你可以在一个产品上购买 NFT，然后在另一个产品上出售。作为创作者，你可以同时在多个项目上列出你的 NFT，每个产品都会显示最新信息。最后，由于以太坊不会宕机，你的代币始终可以出售。


    #### 6.6.2 Environmentally positive crypto


    研究显示，以太坊每年消耗 44.94 太瓦时电能，相当于整个国家的总发电量。Polkadot、Kusama 和 Unique Network 等链采用的共识机制旨在支持清洁解决方案和“绿色
    NFT”，因为所需的计算能力极低。责任在于能源生成者，而非技术；我们拥有可再生能源却未被采用，这与 NFT 无关。NFT 的普及度提升使其碳足迹受到更多关注，尤其是在环保方面。我们必须认识到，NFT
    并不直接增加以太坊的碳足迹。以太坊目前保障资产安全的方式能耗巨大，但即将改善。当以太坊的碳足迹得到优化后，其能耗将下降 99.95%，使其更加节能，与许多现有行业形成鲜明对比。


    #### 6.6.3 Co investing in art and luxury collectibles


