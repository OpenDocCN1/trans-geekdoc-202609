  trans: '

    -   一个团队将在蜂巢投票通过后承担一个提议的项目。这些团队最初很简单：开发、推广和支持。随着改进提案数量和社区的增长，新团队会形成。一个团队最多由八人组成，作为一个小组共同工作。除此之外，你需要组建一个新的项目团队。这被称为蜂巢结构团队，它将贡献社区划分为更小的子群体，人们会根据需要加入或离开团队。因此，每个团队都有自己的预算和由社区任命的协调员。团队形成后即为自给自足。除了社区范围内的智能投票公投外，没有其他控制结构。蜂巢结构团队是一群致力于项目的社区成员，他们每天都在项目上工作。个人将由团队雇佣。如果社区成员无法承诺加入团队，他们将以更非正式的方式为智能蜂巢做出贡献。


    ### 3.5.4 Flooz


    ![Flooz.com 是九十年代末期科技热潮的典型代表，该热潮在 2001 年结束。Flooz 被比作可以通过促销活动累积或直接从 Flooz 中央平台购买的优惠券或航空里程碑，是商户在仍然相对年轻的互联网上接受支付的数字工具。Flooz
    在为期三年的经营期间筹集了高达 3500 万美元的风险资本，押注于商户对新颖支付方式的需求。Flooz 在广告宣传上没有花钱，甚至邀请喜剧演员惠·戈德伯格参与了一系列电视广告。尽管势头强劲，Flooz
    仍未能吸引大量用户和商户，其平台的非法活动最终导致公司失败。到 2001 年 8 月，随着投资者支持的迅速流失以及平台涉嫌非法活动的指控，公司的衰亡加速。据
    2001 年《纽约时报》报道，俄罗斯犯罪团伙被怀疑利用被盗信用卡购买在线货币并洗钱，从而引发联邦调查。据 Flooz 源称，约 30 万美元被盗。在欺诈指控浮出水面后，Flooz
    在未能找到买家的情况下关闭了业务。### 3.5.5 DigiCash![How To Get Your DigiCash Card? - YouTube](img/image00206.jpeg)


    DigiCash 是一家成立于 1990 年代的数字货币公司，曾接近成为全球成功。但它因内部矛盾和缺乏动力而未能成为广泛使用的在线支付系统。David Chaum，ecash
    系统的创建者，是密码学协议的先驱。1990 年成立的 DigiCash 支持 Cyberbucks，这是一种为用户提供匿名性并为接受它的商户提供安全的数字货币。自由派及其他人士支持一种国际在线货币，以超越政府控制，据
    2003 年《卫报》报告，DigiCash 得到了支持。DigiCash 以支持多种支付规模（尤其是微支付）而著称。在货币交易方面，该系统使用电子邮件系统，报告称交易员进行非市场交易。据当时报道，现金流不足以及公司员工与管理层之间的摩擦是
    DigiCash 失败的原因之一。尽管与主要银行和信用卡公司进行了高层谈判，但该项目未能签订重大交易以确保其在日益数字化的金融领域中的生存。例如，花旗银行曾长期就整合项目进行谈判，但此后转向其他业务。Chaum
    于 1996 年离开公司，两年后公司申请破产。


    ### 3.5.6 B-Money


    Wei Dai 提出了 B-money，这是一个早期的“匿名、分布式电子现金系统”提案。当 Satoshi Nakamoto 创建世界闻名的 Bitcoin
    时，他提到了 B-money。Wei Dai 是华盛顿大学的毕业生，于 1998 年首次提出 B-money，旨在创建一个免费的在线金融系统。该系统旨在防止任何人征税或强制他人做任何事。因此，很少有人会记得
    B-Money，它于 1998 年首次公开，距离比特币出现已超过十年。尽管 Wei Dai（Wei Da）也希望创建一种匿名且分布式的货币发行方式，但 B-money
    在技术上与比特币截然不同。技术文档（链接）（所谓的“白皮书”）包含了与现代加密货币相同的基本原则，旨在加速 B-money 的实现。预计“数字别名”能够通过去中心化网络发送和接收资金，并能在不涉及第三方的情况下执行彼此之间的合约。第一个协议提议使用工作量证明函数来创建货币。Dai
    的 B-Money 在密码朋克邮件列表关于 Hashcash（第一个对称工作量证明函数）的讨论中提出，该列表在前一年五月（1997 年）也刊登了相关内容。比特币在铸造硬币时使用
    Hashcash 成本函数作为工作量证明，这与 B-money 提案一致。在 B-money 中，资金通过向所有参与者传输交易来转移，所有参与者都记录彼此的账户。可以与第三方达成具备偿债可能性的合约。如果未达成一致，各方会广播有利于自身的论点或证据，每位参与者在自己的账户中计算赔偿或罚款。账户仅由部分参与者——“服务器”——保留，这些账户必须公开，参与者通过向大量服务器查询来验证其余额。参与者还确保货币供应不被通胀。要成为服务器，必须提供抵押品，若服务器被证实不诚实，抵押品将被没收。另一种创建货币的方法涉及一种竞价机制，参与者竞价解决已知复杂度的计算问题。遗憾的是，B-Money
    项目自白皮书实施以来一直停滞不前。


    ### 3.5.7 Paypal


    ![Pakistan&#39;s finance secretary inquires &#39;Why doesn&#39;t PayPal work in
    Pakistan?&#39; - Economy.pk](img/image00207.gif)


    PayPal（PYPL）是一家真正的电子商务巨头，拥有光明的未来和忠诚的用户群体，预计随着更多年轻人接受数字支付平台，其用户基数将继续增长。公司盈利，2018
    年收入超过 150 亿美元，业务遍及全球，平台支持 100 种货币，覆盖 200 多个全球市场。尽管在利润丰厚的电子商务支付市场面临激烈竞争，但普遍认为 PayPal
    将继续成长并主导数字支付空间，这是扩大的业务和消费者技术市场中最有利可图的细分市场之一。

