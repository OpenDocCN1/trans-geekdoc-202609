- raw: "Dr. Douglas Jackson and Barry K. Downey founded E-gold in 1996 as a private\
    \ digital currency that allowed members of their website to transfer gold instantly\
    \ using modern technology. E-gold differs from previous alternatives to federal\
    \ currency in that it is entirely digital in nature, and transactions are completely\
    \ irreversible. Despite the fact that the website was most likely started with\
    \ good intentions, it quickly turned into a haven for criminals. Money launderers,\
    \ identity thieves, fraudulent \"financial\" investors, and purchasers of child\
    \ pornography all used E-gold because the gold transfers were irreversible. Moreover,\
    \ the irreversibility of E-gold transactions meant that if one's account was hacked,\
    \ there was no recourse. E-corporate gold's governance realized the website was\
    \ being used for major illegal activities by 2006 and began blocking accounts.\
    \ \"E-gold operates legally but does not condone persons attempting to use e-gold\
    \ for criminal activity,\" said CEO Douglas Jackson in a statement. E-gold has\
    \ a long history of working with law enforcement agencies in the United States\
    \ and around the world, providing data and investigative support in response to\
    \ legitimate requests.\" In 2007, the US government ordered E-gold to block several\
    \ E-gold accounts that were providing services similar to E-gold before indicting\
    \ E-gold for a variety of criminal offenses. The main argument against E-gold\
    \ was that it did not go far enough to prevent illegal activity by failing to\
    \ implement a mechanism that prevented fraudulent users from simply creating new\
    \ accounts as well as transferring their E-gold to them. E-gold was also unlicensed\
    \ money transmitting business, despite the fact that it was not actually transferring\
    \ money. Money-transmitting businesses in the United States are required by law\
    \ to obtain a license, which includes keeping certain legal information on the\
    \ users who create accounts. As a result, e-creators golds were found guilty of\
    \ similar charges, including conspiracy. However, the legal ramifications for\
    \ the company and corporate governance were minor, and E-gold was able to reach\
    \ an agreement with the federal government, which allowed legitimate users to\
    \ withdraw funds from their accounts, similar to how online poker players can\
    \ do. E-gold is still operational today, but it no longer accepts new accounts\
    \ or e-gold transfers from one user to another.\n\n### 3.5.10 Hash-Cash\n\n![](Images/image00210.jpeg)\n\
    \nHash-cash was a forerunner to digital money. It was Satoshi's inspiration for\
    \ Bitcoin's proof-of-work implementation. We must first deal with Hash-cash in\
    \ order to comprehend Bitcoin's consensus mechanism and proof-of-work. Adam Back\
    \ created hash-cash in 1997 as a way of preventing email spam. Email spam was\
    \ an annoyance to anyone with an email account, even in 1997. This was due to\
    \ a fundamental problem, according to Adam Back: all you had to do to email someone\
    \ was send a few packets to a mail server. They made the decision to charge for\
    \ emails. Sending an email was so cheap that it was practically free. Even though\
    \ honest users only send a few emails per day, spammers can send tens of millions\
    \ at little or no cost. Consider how much it would cost to send an email for a\
    \ penny. This is fine for a regular user who has a few pennies to spare each day.\
    \ Spammers, on the other hand, would have to pay millions of pennies, effectively\
    \ ending their spam campaigns. You'll notice that this is a little backward: charging\
    \ a penny per email presupposes the existence of digital pennies with which to\
    \ pay. But there was no such solution, which is why we needed Bitcoin. So, how\
    \ could Hashcash make spammers pay a virtual penny? The answer lies in Hashcash's\
    \ core concept, which is now also present in Bitcoin: proof-of-work.\n\nHashcash's\
    \ proof-of-work\n\nThe proof-of-work in Hashcash is pretty straightforward. The\
    \ mail server first designates a difficulty level, which is a number that indicates\
    \ how difficult the PoW must be. The default value is twenty. In Hashcash, the\
    \ proof of work is to generate a message whose SHA-1 hash digest begins with 20\
    \ zeros in binary. How do you make a hash digest with a prefix that you specify?\
    \ Remember that you shouldn't really be able to predict the output of a cryptographic\
    \ hash function any better than chance. You don't have a choice but to force it.\
    \ To solve this PoW, simply try different inputs till one of them has a sufficient\
    \ number of 0s in front of it.\n\n### 3.5.11 Ethereum\n\n![Cryptocurrency prices\
    \ today: Bitcoin gains over 4%, Ethereum surges more than 8% - Times of India](Images/image00211.jpeg)\n\
    \nEthereum is a shared blockchain open-source framework and has its own crypto\
    \ currency, Ether. As a forum for many other crypto currencies and for the application\
    \ of decentralized intelligent contracts, ETH functions. In a 2013 white paper\
    \ by Vitalik Buterin, Ethereum was first described. In summer 2014, Buterin secured\
    \ support, along with other co-founders, for the project at a public online crowd\
    \ sale and formally launched on July 30, 2015, the block chain. Ethereum itself\
    \ is expected to become a digital forum for open apps that allows users worldwide\
    \ to write and manage censorship, downtime and fraud-resistant apps.\n\nHistory\
    \ of Ethereum\n\nEthereum has eight co-founders. This is a large number for a\
    \ crypto project. They first met on June 7, 2014, in Zug, Switzerland.\n\n•      \
    \ Russian-Canadian Vitalik Buterin wrote the initial white paper that first identified\
    \ Ethereum in 2013 and still works on developing the network to this day. Just\
    \ before ETH, Buterin co-founded & wrote for the Bitcoin Magazine news website.\n\
    \n•       British programmer Gavin Wood is possibly the second most influential\
    \ co-founder of ETH.\n\n•       Among the other co-founders of Ethereum are\n\n\
    •       Anthony Di Iorio, who underwrote the project during the early stage of\
    \ creation\n\n•       Charles Hoskinson, who played the principal role in creating\
    \ the Swiss-based Ethereum Foundation as well as its legal structure\n\n•      \
    \ Mihai Alise, who provided assistance in creating the Ethereum Foundation\n\n\
    •       Joseph Lubin, a Canadian entrepreneur who helped finance Ethereum during\
    \ its early days\n\n•       Amir Chetrit, who helped co-found Ethereum but walked\
    \ away from it early into the development\n\nReasons behind the uniqueness of\
    \ Ethereum \n\nEthereum has pioneered the idea of a blockchain smart contract\
    \ network. Smart contracts are computer systems that immediately perform the activities\
    \ required to satisfy an arrangement between multiple parties on the internet.\
    \ They were built to reduce the need for trusted intermediates between contractors,\
    \ thereby lowering transaction costs while also increasing transaction efficiency.\
    \ Ethereum’s principal breakthrough was developing a network that allowed it to\
    \ conduct smart contracts using the blockchain, which further strengthens the\
    \ already existing advantages of smart contract technology. Ethereum’s blockchain\
    \ was built as a sort of one machine for the whole world. In addition to various\
    \ smart contracts, Ethereum’s blockchain is able to host other crypto currencies,\
    \ dubbed “tokens. In reality, this has been the most common use for the ETH platform\
    \ so far.\n\nWhere Can You Buy Ethereum (ETH)?\n\nSince Ethereum is the second\
    \ biggest cryptocurrency after Bitcoin consequently, ETH trading pairs are mentioned\
    \ on almost all major exchanges. Amongst the main markets are:\n\n*   [Binance](https://coinmarketcap.com/exchanges/binance/)\n\
    \n*   [Coinbase Pro](https://coinmarketcap.com/exchanges/coinbase-pro/)\n\n* \
    \  [OKEx](https://coinmarketcap.com/exchanges/okex/)\n\n*   [Kraken](https://coinmarketcap.com/exchanges/kraken/)\n\
    \n*   [Huobi Global](https://coinmarketcap.com/exchanges/huobi-global/)\n\nEthereum\
    \ ecosystem"
