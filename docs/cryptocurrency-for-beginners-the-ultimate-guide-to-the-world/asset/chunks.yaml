- raw: 'It can be deduced from what has been mentioned above that the medium of exchange
    has evolved over time from the exchange of goods for goods to the use of metallic
    coins, gold-backed currencies, paper currencies, and digital currencies. Each
    exchange system has its own set of benefits and drawbacks. Cryptocurrencies, also
    known as virtual currencies, are digital currencies created and used by private
    individuals or groups. Cryptocurrencies are classified as alternative currencies
    because they are not regulated by national governments. These are financial exchange
    mediums that exist outside the scope of state monetary policy. Bitcoin (BTC) is
    the most well-known and widely used cryptocurrency. However, there are hundreds
    of cryptocurrencies, and new ones emerge every month. To distinguish themselves
