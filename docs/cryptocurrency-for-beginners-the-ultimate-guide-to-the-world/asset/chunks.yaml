  trans: '

    -   [法定货币](https://en.wikipedia.org/wiki/Fiat_currency)通常不需要实物商品的支持，是第二种货币形式。相反，供求关系和人们对其价值的信心决定了法定货币的价值。法定货币是一种没有固有价值的货币，通常由政府立法确立为法定货币。货币在历史上依赖于金银等实物资源，但法定货币依赖于经济的信用。法定货币的价值取决于供求关系，作为消费货币和代表货币的替代品，它被采用。商品货币来源于像银和金等贵金属，而代表货币是一种可以兑换商品的凭证。由于金是有限资源，快速增长的经济不总是能开采足够的金来支持货币供应的需求。在繁荣的经济中，对金提供货币价值的需求极其低效，尤其是当其价值实际上是由人们的感知产生的。法定货币是人们对价值感知的象征，是创造货币的基石。一个增长的经济显然在为它和其他经济生产其他有用的物品。经济越大，其资本的感知（以及日益增长的）需求就越大，反之亦然。人们的感知必须得到一个能提供人们所需商品和服务的经济支持。例如，1971
    年，美国美元脱离金本位，美元不再可兑换金，金价不再与美元挂钩。这表明当时可以印制比实际可用的金更多的纸币。如果经济放缓，美元的价值将通过国内通货膨胀和国际汇率下跌而降低。美国经济的崩溃将使全球陷入
    bleak（阴郁）的金融时代，但许多其他国家和机构正在竭尽全力确保这不会发生。然而，正如通货膨胀所决定的，货币（不仅仅是美元，大多数货币）的价值仅仅由其购买力决定。这就是为什么仅仅印制新的钱不会产生一个国家的收入。货币是通过一种持续的关系产生的——真实、具体的物体、我们对它们的需求以及我们对其价值的抽象信念。货币之所以有价值，是因为我们喜欢它，但我们想要它是因为它能换取我们喜欢的产品或服务。公元
    1000 年左右，中国是第一个使用法定货币的国家，该货币 eventually（最终）传播到世界其他地区。当美国总统理查德·尼克松签署一项法律，禁止将美元兑换成金时，它在
    20 世纪变得非常著名。许多国家仍然使用基于纸张的法定货币，这些货币仅作为支付手段。与依赖实物商品的标准货币不同，法定货币无法兑换或赎回。它本质上是毫无价值的，由国家的命令使用。政府必须保护它免受伪造，并负责任地维护货币供应，以使法定货币有效。


    ### 2.2.1 历史


    在 10 世纪，法定货币在中国出现，主要在元、唐、宋和明朝的统治时期。唐朝（618-907）对金属货币的强烈需求超过了贵金属的供应。人们熟悉使用信用状，纸张或纸条很容易被接受。由于缺乏硬币，人们转而使用纸币。在宋朝（960-1276）期间，铁勒川地区（Tchetchuan）蓬勃发展的行业导致铜钱短缺。商人开始发行由现金储备担保的私人纸条，因此第一张法定纸币随之发行。在元朝（1276-1367），纸币成为唯一的法定货币，铸币权授予财政部。在明朝（1368-1644），纸币的发行被授予财政部。18
    世纪，西方开始使用纸币。美洲殖民地、大陆会议和法国继续发行信用券以支付费用。各地区政府发行的纸条由持有者用于支付当局的税款。由于通货膨胀的风险，大量发行信用券引发了一些争议。在新英格兰和卡罗来纳等国家，纸币大幅贬值，随着纸币价值的下降，商品价格上涨。在战争时期，国家转向法定货币以保护黄金和银等贵金属的价值。例如，美国内战期间，美国联邦政府转向一种被称为“绿背”（Greenbacks）的法定货币形式。在此期间，政府暂停了纸币兑换金或银的兑现权。政府和银行在
    19 世纪初承诺，将硬币和纸币兑换成其名义商品。然而，美国内战的高昂费用和恢复经济的需求迫使政府终止兑现。根据布雷顿森林协议，一盎司黄金的价值被定为 35
    美元。然而，1971 年，美国总统理查德·尼克松推出了一系列经济措施，包括取消美元直接兑换金的权利，原因是金储备的下降。此后，大多数国家采用了可以相互兑换的主要货币的法定货币。


    ### 2.2.2 法定货币如何运作


    法定货币不依赖于任何实际资产，而是依赖于投资者的信心和政府的声明。纸币作为购买力的储存媒介，并作为以物易物的替代方案。它帮助消费者，正如以物易物的情况一样，无需以产品换产品，就能购买他们需要的商品和服务。由于其存储购买力的能力，个人可以方便地进行规划并建立专业化的经济活动。例如，一家专注于手机组装的公司会购买新设备，招聘并支付工人，并进军其他领域。法定货币的价值取决于一个国家经济的运作方式、国家的治理方式以及这些变量对利率的影响。一个政治不稳定的国家可能会出现经济衰弱和油价通胀，使得个人无法进口他们需要的商品。当公众足够相信货币作为购买力的存储媒介的能力时，法定货币运作良好。它也必须得到政府的全面信用支持，这为其提供了声明，并将其作为合法货币用于财务交易。


    ### 2.2.3 法定货币的优势和劣势


    '
