    区块链技术是一种存储数据的方式，使其难以或不可能被篡改、黑客攻击或欺诈。区块链是一个交易数字记录的日志，该记录在区块链的完整网络中的计算机系统上被复制并分发。链上的每个区块包含若干笔交易，每当数据库发生新操作时，该事件记录会添加到每个参与者的账本中。分布式账本是由多方管理的去中心化数据库。区块链是一种分布式账本技术，信息通过哈希（hash）记录，哈希是一种不可更改的电子签名。


    比特币自 2008 年其微小的起步到 2017 年的最高价格，一直带领投资者和全球其他人经历了一段曲折的旅程。它上涨、下跌、反弹，然后在短短十年内再次上涨。比特币基于经济思想和市场效率原则。它是一种不由单一实体拥有、安全、国际、可互换、流动且供应有限的财产。由于需求高且供应几乎恒定，价格涨幅异常迅速，吸引了更多投资者。有人认为比特币的曲折历程为当今数百种其他加密货币在金融和投资用途中被使用铺平了道路。这就是比特币的作用。


    像 Bitfinex 和 Coinbase 这样的指导网络和虚拟货币是购买加密货币的地方。今年早些时候，投资应用 Robinhood 推出了购买多种热门货币的功能，包括比特币、狗狗币和以太坊，且无需支付主流交易所高额费用。即使是加密货币新手今天也能轻松上手。以前有些复杂，但现在非常简单。开设银行账户并将其与信用卡关联很容易。但请记住，购买单个加密货币就像在股市上购买单只股票。将所有投资集中在一项资产上会让你面临比将资金分散到数百甚至数千种证券（如共同基金或市场基金）更大的风险。遗憾的是，加密货币目前供应稀缺。


    随着越来越多的投资者将加密货币视为其投资组合的有价值补充，加密货币的全球知名度持续上升。在 2017 年和 2018 年 ICO（首次代币发行）的崩溃之后，那些吓退了采用者，近期出现了动力回升，这得益于两种新工具的推出：NFT
    和 DeFi。从 Cryptocurrencies 到狗狗币和 Tether，数十种不同的加密货币使得进入加密世界变得困难。以下是按市值排名的前十大比特币，帮助你理清思路。


    实施关键的妥协政策也至关重要。制定一套规定，明确在加密密钥及其持有者被盗时应采取什么措施，有助于限制风险和损失。此外，还需要数据 sterilization（数据清除）政策。由于数据在删除后仍可能残留在电子内容中，必须确保员工了解相关风险。通过授权合格人员使用能够在退役设备（如服务器、硬盘驱动器和便携式存储）上安全执行数据清除的技术，可以防止信息泄露。


    在加密货币领域运营的组织也必须保持频繁的准备金证明以满足合规要求。审计追踪也是极其有用的工具，用于追踪意外安全问题的产生并迅速解决异常，以恢复信息系统的一致性。不要浪费时间去追逐廉价的“羊毛”（Lambos）或私人飞机的幻想。许多加密领域的
    inexperienced（ inexperienced 保留原文）创业者购买低价币种，抱有大额获利的期望。这是一个非常典型的陷阱。影响币价的因素有多个，其中两个主要因素是流通供应和币的现实价值。


    对数字货币失去信心：由于其胚胎阶段的特性，数字货币充满风险。想从数字货币的短期或长期持有中获利的投机者涌入在线平台。加密货币不依赖银行系统、国内或国际组织、资产或其他信用形式，其价值完全由市场参与者在交易所对它们的定价决定，因此信心丧失可能导致价值下跌。


    据预测，加密货币将在 2030 年占全国货币的 25%，这意味着全球大部分地区将开始信任比特币作为支付手段。它将被更多商家和消费者所熟知，并保持其波动性，意味着价格预计像过去几年一样会波动。


    第 1 章：加密货币、区块链和比特币的基础


    加密货币在过去几年 popularity（ popularity 保留原文）显著提升，截至 2018 年已有超过 1,600 种可供使用，且数量仍在稳步增长。因此，区块链开发人员的需求也随之增加。区块链工程师的薪酬反映了其高度认可度：全栈开发人员的平均年薪超过
    112,000 美元。甚至有一个专门的网页 devoted（ devoted 保留原文）于比特币职位招聘。加密货币是一种数字或虚拟货币，设计用于作为交易手段。它的运作方式类似于现实货币，但没有实体形态，并依赖于加密技术来运行。新单位只有在满足特定条件时才能被创造，因为加密货币运行自由且自主，无需银行或中央机构。比特币的上限为
    2100 万枚，超过此数量后不再生成。


    加密货币作为在线交易支付方式日益普及。在将美元、欧元、英镑或其他传统货币转换为比特币（最受欢迎的加密货币）之前，了解加密货币及其相关风险是至关重要的。使用加密货币时有哪些危险？尽管加密货币仍是新概念，但其市场十分波动。由于加密货币无需银行或其他相关方参与治理，它们通常缺乏保险，且转换为法定货币（fiat
    cash）较为困难。此外，由于加密货币是无形资产，它们像其他无形技术资产一样易受黑客攻击。最后，由于你将加密货币投资存储在虚拟钱包中，一旦失去对钱包的访问权，你将失去全部加密货币投资。


    '
