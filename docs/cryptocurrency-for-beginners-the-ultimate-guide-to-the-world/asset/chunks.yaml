    ### 6.5.1 未来的收藏品


    ## 6.6 NFTs 接下来会如何发展？


    ### 6.6.1 以太坊与 NFT 的未来


    ### 6.6.2 环保型加密货币


    ### 6.6.3 共同投资艺术品和奢侈品收藏品


    ## 结论


    最新引起大众关注的加密货币热潮是 NFT。当佳士得拍卖行以天价 6930 万美元售出第一幅 NFT 艺术品时，全世界的目光便聚焦于 NFT。数字艺术家 Beeple
    为该项目创作了一组照片拼贴。能够保存任何数字内容（如艺术品、动画 GIF、音乐和视频游戏素材）的概念被称为“非同质化代币”。它是非同质化的，意味着它是独一无二的。NFT
    将数字艺术品和其他有价值的资产转化为唯一、不可辨认的资产，并以区块链为基础进行简单交易。对于许多艺术家、歌手、网红和其他人来说，回报显著，投资者愿意为数字图片的
    NFT 复制品支付高额现金。例如，一段勒布朗·詹姆斯扣篮的视频以超过 20 万美元的价格售出，而一段十岁的“Nyan Cat”GIF 则以 60 万美元售出。NFT
    已经存在很长时间。Crypto Kitties 是一个基于以太坊区块链的数字交易游戏，允许用户购买和交易独特的虚拟猫，这些猫不仅唯一无二，而且存储在区块链上。这是最早的
    NFT 之一。NFT 吸引了喜欢购买独立创作者作品的消费者。其他人则被拥有可能被任何人复制的数字资产的前景所吸引。新近致富的加密货币百万富翁和亿万富翁，渴望分散其比特币持仓并增加其在加密生态系统中的参与度，似乎推动了
    NFT 最近的高额价格记录。比特币彼此相同，可以互换。然而，并非所有 NFT 都一样。NFT 可用于在区块链上购买、出售和追踪独特数字资产的所有权。区块链是一种数字数据库，用于存储数据。在比特币等加密货币系统中，区块链以安全且去中心化的方式记录交易。区块链技术确保所有数据尽可能安全。去中心化区块链的数据是不可变的，这意味着它无法被修改。这意味着所有比特币交易都将永久记录并在任何人都可以查看的情况下保存。Twitter
    创始人杰克·多西的第一条推文以 290 万美元的价格卖给一位不愿透露身份的竞拍者。尽管多西仍然拥有该推文，但购买者实际上拥有它，就像拥有签名一样。一个独特的
    NFT，比如真实艺术品，或者许多复制品中的一种，如交易卡，都是可行的。区块链跟踪谁拥有文件。简单来说，它就像拥有艺术品、签名或几乎任何其他东西的数字版本。本书涵盖了
    NFT 的工作原理、区块链、智能合约、比特币等加密货币的历史（包括 Smart cash、Flloz、Digicash、B-Money、BitGold、PayPal、E-Gold、Hash-Cash、Bitcoin）、加密资产使用激增的原因、如何开始创建、购买和出售
    NFT、如何成为加密艺术家、合法市场、新的 NFT 市场等更多内容。了解 NFT 是什么以及如何在您的生活中使用它们。

