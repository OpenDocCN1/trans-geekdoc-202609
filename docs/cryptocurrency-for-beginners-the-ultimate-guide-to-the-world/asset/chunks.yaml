    Although Ripple has an indigenous crypto currency, `XRP`, IOUs processing is more
    about a network than the crypto currency itself. The currency does not exist to
    store and exchange value as a medium but rather as a token to protect the network
    from spam. Unlike Bitcoin and Ethereum, Ripple has no mining because all the coins
    are pre‑mined already. As a number of banks have entered the Ripple network, Ripple
    has seen tremendous importance in the financial room. Ripple (`XRP`) is a real‑time
    gross settlement (RTGS) system that functions as a money transfer, currency exchange,
    and remittance network. It was developed by Ripple Labs Inc. in the United States
    and validated by independent servers before being released in 2012. `XRP` is the
    name of the cryptocurrency that is traded (a cryptocurrency). `XRP` can be exchanged
    for almost any other currency, allowing users to avoid the long lines at banks.
    Cryptocurrency, on the other hand, is comparatively volatile, meaning that its
    value can fluctuate. A financial advisor can assist you in determining what your
    overall investment strategy should be.


    **What Is Ripple (XRP)?**


    In contrast to other forms of cryptocurrency like Bitcoin and Ethereum, Ripple
    is made up of a "hash tree" rather than a blockchain. Because there are a finite
    number of coins – 100 billion – `XRP` cannot be mined. Cryptocurrency is built
    on blockchain technology. It''s a type of database that groups information into
    groups or blocks. Each new piece of information is added after a newly added block
    is combined into a new block, which is then added to the chain. A Block chain,
    as the name suggests, divides data into blocks that are linked together. Ripple
    is similar to blockchain in that transactions are processed by multiple nodes.
    The payment process entails someone sending a transaction, the information is
    given a single value and sent to a shared public database, validating servers
    or nodes sharing the information, and the transaction is authorized and processed
    if separate servers report a match. Because it does not involve proof of work,
    the system is not comparable to Bitcoin. In Bitcoin, a miner on the Bitcoin blockchain
    is required to complete a complex equation to show the work before the acceptance
    of the block into the chain. The Ripple model, on the other hand, is consensus‑based.
    The transaction is cleared once there is agreement. As a result, the Ripple network
    could indeed process 1,500 transactions per second, whilst Bitcoin can only handle
    three to six transactions per second, and Ethereum can only handle 15 transactions
    per second. Despite the fact that it is not identical to the blockchain system,
    the Ripple process is relatively efficient and quick, which is one of the main
    reasons banks and major payment systems are considering and experimenting with
    Ripple. Furthermore, Ripple isn''t exactly decentralized in the same way that
    Ethereum is. Ripple can technically control which servers are accepted onto the
    network because the developers do have control over a mechanism that protects
    the system from malicious operators (making it a central authority). As a result,
    some argue that `XRP` isn''t a true or standard cryptocurrency.


    ### 3.5.13 Tether


    ![](Images/image00213.jpeg)


    `Tether` is a fiat‑collateralized stable coin that allows users to transact with
    blockchain‑based assets while avoiding price volatility. `Tether` is mainly issued
    on the Ethereum as well as Bitcoin blockchains and is pegged to US Dollars in
    bank accounts at a 1:1 ratio.


    **History**


    `Tether` (`USDT`), formerly known as "Realcoin," is a cryptocurrency that aims
    to maintain a fixed 1:1 exchange rate with the US dollar. It was founded in July
    2014 by Brock Pierce, Craig Sellars, and Reeve Collins. Built on Mastercoin (Omni),
    a protocol layer for Bitcoin that introduced the stablecoin concept to the world
    in 2012, `Tether` was one of the first stablecoins created. `Tether` is the most
    widely used stable coin today, having pioneered what is now known as a fiat‑collateralized
    stablecoin model. `Tether` was created to address two critical issues with existing
    cryptocurrencies: high volatility as well as fiat currency‑to‑cryptocurrency convertibility.
    `Tether` was created to address these perceived issues by creating a cryptocurrency
    that is fully backed 1:1 by bank deposits of US dollars. `USDT` tokens are represented
    as ERC‑20 tokens on Ethereum, while `Tether` uses the Omni layer to represent
    `USDT` tokens on Bitcoin. While the tokens themselves operate on a decentralized
    network, `Tether` Ltd, based in Hong Kong, is solely responsible for the creation
    and redemption of tokens, as well as the 1:1 deposit backing. `USDT` has been
    primarily used by exchanges as a substitute for fiat currencies, reducing or eliminating
    the need for external banking relationships. `Tether` has always been the subject
    of controversy since its inception in 2014, owing to the company''s failure to
    provide audited financial statements demonstrating adequate reserves to back `USDT`.
    `Tether` has a history of not disclosing its banking relationships, only doing
    so recently in November 2018 to quell concerns about its solvency raised by Bitfinex,
    an associated crypto exchange. `Tether` updated its disclosure statement in March
    2019, claiming that its tokens are no longer fully backed by US dollar deposits.
    `Tether` is now 100 percent backed by reserves, which include traditional currency
    as well as cash equivalents, as well as other assets and receivables from `Tether`''s
    loans to third parties, including affiliated entities, from time to time.


