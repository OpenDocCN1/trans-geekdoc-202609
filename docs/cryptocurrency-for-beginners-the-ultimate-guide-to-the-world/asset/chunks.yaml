- raw: "Crypto Art is a relatively new phenomenon, and most people are unaware of\
    \ it. As a result, one of the goals of the NFT platforms is to create Communities\
    \ that allow artists, collectors, and digital professionals to connect, discuss,\
    \ train, and stay up to date on new technologies, trends, and market developments.\
    \ The community's buzzword is \"collaboration,\" and this spirit is bolstered\
    \ by the focus solely on art: artists are frequently anonymous or use pseudonyms,\
    \ and gender, ethnicity, and social status are not revealed. Art Rights, a platform\
    \ for the management and certification of works of art using Blockchain technology,\
    \ is one of the tools available to help artists, including Crypto Artists. The\
    \ Art Concierge, the largest community of artists, collectors, and professionals\
    \ in the art world, is one of the services provided by the platform.\n\n# Chapter\
    \ 5: What is NFT and Key Concepts?\n\n![NFT Kya Hain: Salman Khan to McDonald&#39;s,\
    \ all are Launching NFTs. Should you Invest in Crypto Tokens?](Images/image00221.jpeg)\n\
    \nYou've probably heard of terms like Bitcoin, blockchain, and, more recently,\
    \ NFTs if you've been following the tech news lately. Artists and collectors alike\
    \ have been drawn to news items of multi-million-dollar auctions for digital assets.\
    \ But what exactly are NFTs? And how do they function? We'll learn about NFTs,\
    \ their key concepts, how they work, NFTs and blockchain, and more in this chapter.\
    \ We'll look at the basics of non-fungible tokens, the technology behind them,\
    \ and how they're used in everyday life in this chapter. We'll also go over some\
    \ of the skills and knowledge you'll need to participate.\n\n## 5.1 What is NFT?\
    \ \n\nNFTs are unique assets that provide collectors and gamers complete control\
    \ over their digital items. Let's start with some definitions of fundamental terms.\
    \ We'll need some background knowledge to grasp what NFTs are and how they work.\n\
    \nNFTs (non-fungible tokens) are digital assets that may be used to represent\
    \ a variety of tangible and intangible goods, such as collector virtual real estate,\
    \ sports cards, and digital shoes. One of the most important benefits of a digital\
    \ collectible over a tangible collectible like a Pokemon card or a rare minted\
    \ coin is that each NFT includes unique information that identifies it from the\
    \ others and can be easily verified. Fake collectibles are worthless to manufacture\
    \ and distribute since each item can be traced back to the original issuer. Money\
    \ is a fungible asset in economics. It is divided into units that may be traded\
    \ easily without losing or gaining value (for instance, a £20 for two £10s). Gold,\
    \ bitcoins, and stocks, to mention a few, are fungible assets. A non-fungible\
    \ asset, on the other hand, is a one-of-a-kind item such as a painting, a home,\
    \ or a trading card. Even though an artwork can be photographed or replicated,\
    \ it is still the original, and reproductions do not have the same value as the\
    \ original. The blockchain stores NFTs, which are digital data units. Each non-fungible\
    \ token serves as a certificate of authenticity. It establishes the fact that\
    \ a digital thing is one-of-a-kind and cannot be copied. Because of the cryptographic\
    \ techniques that make the blockchain unique, an NFT can never be edited, altered,\
    \ or stolen.\n\n## 5.2 NFTs key concepts\n\nNon-fungible tokens, or NFTs, are\
    \ digital content elements connected to the blockchain, the digital ledger that\
    \ supports cryptocurrencies such as bitcoin and ethereum. Those assets, unlike\
    \ NFTs, are fungible, meaning they can be replaced or exchanged for another identical\
    \ one of the same value, much like a dollar bill. NFTs, on the other hand, are\
    \ one-of-a-kind and non-interchangeable, which means that no two NFTs are identical.\
    \ Consider Pokémon cards, rare coins, or a pair of limited-edition Jordans: NFTs\
    \ create scarcity among otherwise infinitely accessible commodities, accompanied\
    \ by a certificate of authenticity. NFTs may be used to buy and sell GIFs, tweets,\
    \ virtual trade cards, photos of physical objects, video game skins, virtual real\
    \ estate, and other digital artwork.\n\n## 5.3 How do NFTs work?\n\nAs compared\
    \ to other cryptocurrencies, NFTs are not instantly exchangeable because none\
    \ of the two identical NFTs exist despite belonging to the same platform, collection\
    \ or game. You can consider them as festival passes. Each ticket contains information\
    \ such as the purchaser's name, the date and the venue of the event. This information\
    \ makes it difficult to exchange festival tickets. \n\n### 5.3.1 How to buy NFTs\n\
    \nIn principle, any digital image might be purchased as an NFT. However, especially\
    \ if you're a newbie, there are a few things to bear in mind while acquiring one.\
    \ You'll need to pick a marketplace to purchase from, a digital wallet to keep\
    \ your cryptocurrency in, and the cryptocurrency you'll need to execute the transaction.\
    \ Some of the most prominent NFT markets are OpenSea, Mintable, Nifty Gateway,\
    \ and Rarible.\n\n### 5.3.2 How to sell NFTs?\n\nNFTs are also sold in marketplaces;\
    \ however, the method varies by platform. Basically, you'll post your work to\
    \ a marketplace and then follow the procedures to convert it to an NFT. You'll\
    \ be able to enter details like a work description and pricing suggestions. The\
    \ majority of NFTs are bought with ethereum, but they can also be acquired with\
    \ other ERC-20 tokens like WAX and Flow.\n\n### 5.3.3 How to create an NFT? \n\
    \nAn NFT can be created by anyone. All you'll need is a digital wallet, a little\
    \ ethereum buy, and access to an NFT marketplace where you can upload and convert\
    \ your work into an NFT or crypto art. You might well be interested in producing\
    \ NFTs for your work if you're an aspiring digital artist. Fortunately, there\
    \ are various platforms that can assist you in getting started. The process is\
    \ rather simple in general, and the various platforms will walk you through it.\
    \ However, there may be a few things you should be aware of before you begin.\
    \ NFTs are built on top of and supported by a specific blockchain. The Ethereum\
    \ blockchain is now the most popular for non-fungible tokens. You'll need a bitcoin\
    \ wallet and cryptocurrency to get started. Currently, ether is the most extensively\
    \ utilized (ETH). On an NFT marketplace, you can generate and sell digital assets.\
    \ The Ethereum-based OpenSea platform is very popular.\n\n## 5.4 NFT and block\
    \ chain\n\nThere are several different types of blockchain technology available\
    \ today. Some blockchains were created to cater to the needs of a small group\
    \ of people with limited access to the network. So, where do NFTs fit into the\
    \ blockchain world? A blockchain, remember, is a piece of software that acts as\
    \ a distributed ledger across nodes in a communications network. Its immutability\
    \ sets it apart from other online databases or trading platforms: we may trade\
    \ digital assets peer to peer, and no one can change or erase those transactions\
    \ without the agreement of a majority of the network. That's a huge bonus when\
    \ it comes to the Internet. Each token in an NFT represents a one-of-a-kind item.\
    \ You couldn't expect anyone to notice if you replaced an Andrew Wyeth painting\
    \ with Mike Winkelmann's art in a contract. NFTs cover a wide range of unique\
    \ assets, including birth and death certificates, property deeds, and the identities\
    \ of Internet of Things objects. While the CryptoKitties (the first NFT craze)\
    \ bubble may have burst, the excitement surrounding the auction of Beeple's work\
    \ demonstrated the potential of NFTs. It's a field of value creation where your\
    \ only limitations are your imagination, technical skill, and marketing, accounting,\
    \ and legal backing.\n\nDiscovering NFT"
