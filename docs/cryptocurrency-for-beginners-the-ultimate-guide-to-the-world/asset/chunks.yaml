  trans: "\nBCH，或称 Bitcoin Cash，是一種加密貨幣，它是以比特幣的永久分叉（permanent fork）而創建的。\n\nBitcoin\
    \ Cash 是為了解決比特幣社群內部關於貨幣技術運作方式的爭議而創建的，特別是在交易需求增加的情況下。它可以每天處理高達兩百萬筆交易，因為其區塊大小上限提升至\
    \ 8 MB。較大的區塊大小使得 Bitcoin Cash 能以每秒更多的交易量來處理付款，並且降低交易費用。這是為了回應比特幣網路似乎無法處理的交易數量不斷上升的情況。\n\
    \n加密貨幣作為由中央機構不發行、作為交換媒介的數位資產，旨在提供安全與匿名性。利用去中心化技術，將可理解的資料轉換為複雜且幾乎不可破解的加密代碼。這使得使用者能夠安全付款並追蹤其資金。Bitcoin\
    \ Cash 是比特幣的分叉，其創建的主要目的之一是解決比特幣社群對於技術運作方式的爭議，特別是在交易需求增加的情況下。把這次永久分叉視為分叉點的同一位置，但未來會有所不同。由於這是一個意外策劃的硬分叉，結果是意外產生的，因而創建了\
    \ Bitcoin Cash。很多人最初誤以為這是一個對抗性的、由使用者啟動的軟分叉威脅。相反，Bitcoin Cash 會長久存在。它是與原有區塊鏈的永久斷裂。為了提升交易容量，新區塊鏈進行了分叉。這也是為了回應比特幣基礎設施無法處理的交易數量增加的情況。這個爭議性的舉動讓所有人感到驚訝，因為區塊鏈分叉可能會產生競爭性資產。Bitcoin\
    \ Cash 使用與比特幣不同的技術協議，並且在分叉時引入了更新的共識規則，使其能夠擴展。與比特幣相比，Bitcoin Cash 在以下幾方面有所差異，其主要目標是打造人人可及的「健全」貨幣。\n\
    \n首先，Bitcoin Cash 的區塊大小上限參數較大。它可以每天處理高達兩百萬筆交易，因為其 8 MB 的區塊大小上限提升。較大的區塊大小使得它每秒能處理更多交易，這意味著付款會更快完成，交易費用也會降低。Bitcoin\
    \ Cash 的交易簽名略有不同，因為引入了全新的 SigHash 類型，提供重放保護與刪除保護，並提升硬體錢包的安全性。quadratic hashing\
    \ 的問題也被解決。\n\nBitcoin Cash 還引入了 Emergency Difficulty Adjustment（EDA）功能，讓礦工可以更快速、更有效地調整工作證明的難度。這意味著礦工可以順利從比特幣傳統鏈遷移，同時使用者不會受到算力波動的影響。Bitcoin\
    \ Cash 缺少「以手續費替換」功能，且其開發是分散式的，多個獨立的開發團隊提供軟體實作。這使得它無法被單一實體控制，從而免受政治或社會動盪的影響。在其存在的年份裡，Bitcoin\
    \ Cash 網路獲得了大量基礎設施支持，越來越多的商家、錢包提供商和交易所宣佈對這種新加密貨幣的支持。\n\n### 3.5.15 Litecoin\n\n\
    ![Litecoin Climbs 11% In Rally By Investing.com](img/image00215.jpeg)\n\n在比特幣之後，Litecoin\
    \ 之一是最早的加密貨幣，而比特幣被稱為「數位黃金」，Litecoin 則被視為「銀」。擁有更大的代幣單位與一套革命性的挖礦演算法，Litecoin 是一個突破性的、比比特幣更輕盈的替代方案，適合作為比特幣的小兄弟。它促使許多其他加密貨幣使用其代碼基礎，但設計得更輕量。Dogecoin\
    \ 和 Feathercoin 都是其例子。儘管在比特幣之後，Litecoin 曾一度未能找到真正的使用案例並失去第二大排名，但它仍持續被廣泛追蹤與交易，若比特幣失效，它會被視為替代品而被囤積。\n\
    \n### 3.5.16 EOS \n\n![EOS Coin: Blockchain Review, EOS Wallet, ICO – BitcoinWiki](img/image00216.jpeg)\n\
    \nEOS 是一個去中心化的區塊鏈平台，用於開發、部署與執行商業應用或 dApp。EOS 於 2018 年 6 月在 Block.one 透過首次幣值發行（ICO）籌集了\
    \ 41 億美元的加密貨幣後正式上線。EOS 也是該公司開發的開源軟體名稱。在網路上，EOS 加密貨幣代幣作為支付系統使用。\n\n#### 什麼是 EOS？\n\
    \nEOS 提供核心功能，讓公司與個人能夠像開發網頁應用一樣創建區塊鏈應用。EOS 提供安全的存取與驗證、權限管理、資料主機、使用管理，以及 dApp 與網際網路的通訊。EOS\
    \ 由一套開發工具套件支援，旨在讓應用開發變得更加輕鬆。EOS 由兩大主要組件組成：EOS.IO 軟體與 EOS 代幣。使用網路資源並建置與執行 dApp\
    \ 的開發者只需持有 EOS 代幣，而非直接花費它們。未在使用中的代幣持有者可以將其頻寬或算力租借給正在執行應用的參與者。EOS 創立人是 Dan Larimer，他同時也是\
    \ Bitshares 與 Steem 的創始人。目前 EOS 由 Block.one 公司擁有。\n\n### 3.5.17 Bitcoin \n\n![The\
    \ Top 10 Risks Of Bitcoin Investing (And How To Avoid Them)](img/image00217.jpeg)\n\
    \n以下是與比特幣相關的時間線事件：\n\n**初始失敗**\n\n雖然加密貨幣在 2009 年才開始正式挖礦，但在此之前，已有多次嘗試建立數位貨幣的嘗試。1998\
    \ 年，兩位加密貨幣先驅 Wei Dai 與 Nick Szabo 發表了關於去中心化貨幣的構想，他們的方案都圍繞著用數位貨幣取代傳統金融系統的低效，例如紙幣與硬幣的製作與流通。雖然這些提案未曾實現，但多過十年後，這兩位又成為早期加密貨幣的採用者。比特幣的誕生正是這些早期失敗之後的結果。\n\
    \n**2008 年 10 月**\n\n加密貨幣領域的開端發生在一份由「Satoshi Nakamoto」這個人或團體所發表的白皮書《A Peer-to-Peer\
    \ Electronic Cash System》（比特幣：點對點電子現金系統）時。該白皮書闡述了比特幣的概念，並說明它與傳統金融體系相當，同時引入了區塊鏈技術，首次解決了數位貨幣的關鍵缺失。\n\
    \n**尋找 Satoshi Nakamoto 的真實身份**\n\n比特幣創造者的真實身份是當今世界最大的謎之一。多年來，出現了多種理論，認為他是時間旅行者、外星人、失控的人工智慧，或是\
    \ NSA、CIA、黑道的掩護。Satoshi Nakamoto 是一個假名，用來隱藏其真實身份。人們對他自稱是日本人感到懷疑，因為他出生於 1975 年\
    \ 4 月 5 日，目前居住於日本，且具備流利的英語能力，工作時間更符合英國時區。這使得他被懷疑其國籍與工作時間的匹配度。\n\n"
