  trans: '

    组织在加密货币领域必须保持频繁的准备金证明以满足合规要求。审计追踪也是一个极其有用的工具，用于确定意外安全问题的成因，并迅速解决异常情况，以恢复信息系统的一致性。


    **持续评估**


    贵组织的信息系统的构建者和维护者无疑在技术上极为娴熟、知识丰富且经验丰富。即便是最优秀的心脏医生，也会寻求另一位专家的客观诊断。引入独立专家来发现潜在危害并控制问题，可能帮助您避免员工常常忽视或低估的比特币系统问题。


    **结论**


    随着加密货币作为在线交易支付方式的普及度提升，熟悉加密货币并了解其使用风险已成为在将美元、欧元、英镑或其他传统货币转换为比特币（最受欢迎的加密货币）符号之前的必要步骤。在使用加密货币时，潜在的危险有哪些？尽管加密货币仍属新概念，其数字货币市场却异常波动。由于加密货币无需银行或其他相关方参与治理，它们通常缺乏保险，且难以转换为法定货币。此外，由于加密货币是无形创新资产，它们同样容易像其他无形技术资产一样被黑客攻击。最后，由于您将加密货币投资存储在虚拟钱包中，一旦失去对钱包的访问权限，您将失去全部加密货币投资。


    尽管大多数人将加密货币投资视作股票或贵金属等其他资产的投资方式，您仍可使用加密货币购买传统商品和服务。虽然加密货币是一个新颖且引人入胜的资产类别，但投资于它们可能极具风险，因为需要进行广泛研究以理解每个系统的运作机制。Satoshi
    Nakamoto 首次在题为“Bitcoin: An end-to-end Electronic Cash System”的论文中提出比特币作为一种端到端电子现金系统。“数字支付系统依赖密码学证据而非信任”，Nakamoto
    表示。此类密码学证据体现为区块链上经验证并记录的交易。


    在加密货币领域，世界呈现两极分化。一方面，比尔·盖茨、阿尔·戈尔、拉塞尔·布兰德等倡导者认为加密货币优于传统货币。另一方面，像华盛顿·盖茨、保罗·克鲁曼、斯蒂文·施勒等人则持反对意见。克鲁曼和施勒均为诺贝尔经济学奖得主，他们视加密货币为庞氏骗局以及犯罪活动的工具。未来将出现监管与匿名性的冲突。由于部分加密货币与恐怖活动关联，政府可能希望对其运行进行控制。另一方面，加密货币高度强调用户保持匿名。


    区块链技术是一种存储数据的方法，使其难以或不可能被篡改、黑客攻击或欺诈。区块链是一份数字交易日志，该日志在区块链的完整计算机网络中被复制并分发。链条上的每个区块包含若干交易，每当数据库发生新操作时，相应的记录会加入每位参与者的账本。分布式账本是一种去中心化的数据库，由多个管理者维护。区块链是一种分布式账本技术，信息通过哈希（一种不可篡改的电子签名）进行记录。


    比特币自 2008 年的微小起步到 2017 年的价格高峰，带领投资者和全球大众经历了一段曲折的旅程。它在十年内多次上涨、下跌、反弹，随后又再次上涨。比特币基于经济学思想和市场效率原则。它是一种不受任何单一实体所有、安全、国际化、可互换、具备流动性且供应有限的资产。由于需求高企且供应近乎恒定，价格涨幅异常迅速，吸引了更多投资者。有人认为比特币的曲折历程为当今数百种其他加密货币的出现及其在金融和投资用途中的应用铺平了道路。这就是比特币的作用。


    您可以在像 Bitfinex 和 Coinbase 这样的孵化网络和虚拟货币平台购买加密货币。今年早些时候，Robinhood 的投资应用程序引入了在不支付主流交易所高额费用的情况下购买多种热门数字货币（包括比特币、狗狗币和以太坊）的功能。即使是加密货币新手今天也能轻松上手。过去这过程相对复杂，但如今已变得相当简单。开设银行账户并将其与信用卡绑定非常直接。但请记住，购买单个加密货币相当于在股市中购买单只股票；将所有资金集中在一项资产上会使您面临比分散投资于数百甚至数千种证券（如共同基金或市场基金）更大的风险。遗憾的是，加密货币目前仍属于稀缺资源。


    随着越来越多的投资者将加密货币视为投资组合的理想补充，加密货币的全球知名度持续走高。在 2017 年和 2018 年 ICO  collapse（ICO 于
    2017 年和 2018 年崩盘）震惊了采用者之后，最近几个月出现了新的动力——由两种新工具：NFT（非同质化代币）和 DeFi（去中心化金融）推动。目前已有数十种加密货币，从比特币到狗狗币、泰泰币（Tether）不等，初入加密世界颇具挑战。以下是按市值（即流通中所有币的总价值）排序的前十大比特币，帮助您快速定位。


    据预测，加密货币到 2030 年将占全国货币的 25%，这意味着全球大部分地区将开始信任比特币作为交易手段。它将在商家和消费者中获得更广泛认可，并保持其波动性，意味着价格预计将像过去几年一样随波动。同时，必须制定关键的妥协政策。建立一套明确的程序，规定当加密密钥及其持有者被盗时应采取的行动，有助于限制风险和损失。此外，还需要数据
    sterilization（数据清理）政策。由于数据在擦除后仍可能残留在电子内容中，必须确保员工了解相关风险。通过为合格人员提供在退役设备（如服务器、硬盘驱动器和便携式存储）上执行安全数据清除的技术，可以防止信息泄露。


    组织在加密货币领域必须保持频繁的准备金证明以满足合规要求。审计追踪也是一个极其有用的工具，用于确定意外安全问题的成因，并迅速解决异常情况，以恢复信息系统的一致性。请不要浪费时间在追逐廉价“便士”并幻想购买豪车或私人飞机的幻想中。许多加密领域的新手创业者会购买低价币种，期望获得大额利润。这正是一种非常常见的陷阱。影响币价的因素有多个，其中两大主要因素是：流通供应量和币的真实世界价值。


