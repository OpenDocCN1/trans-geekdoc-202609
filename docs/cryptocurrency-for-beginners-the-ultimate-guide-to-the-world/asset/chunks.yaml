    it even harder to counterfeit or double-spend. It operates through decentralized
    blockchain technology-based networks, which are basically a database that is stored
    through a computing network. Crypto currencies are not distributed by a central
    bank or government, which frees them from the impediment of government interference
    or abuse. Digital money''s history dates back to the internet''s inception. In
    the early days, there were challenges in getting the community to support the
    use of digital currency; but as people get more familiar with technology and the
    technology itself gets simpler and safer, more people are now eager to use digital
    money. PayPal is considered one of the first popular enterprises to introduce
    to mass adoption the concept of easy-to-use automated financial transactions.
