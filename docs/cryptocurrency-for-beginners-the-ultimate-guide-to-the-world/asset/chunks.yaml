- raw: 'One cannot fully comprehend the gold’s actual purpose without looking back
    at the onset of the gold market. The history of gold began in 3000 B.C. It was
    the time when the early Egyptians started making jewelry. This wasn''t till 560
    B.C. that gold began to be used as a medium of exchange. Merchants at the period
    were seeking a means to create a standardized, readily transportable form of money
    that would make the trade process easier and more efficient. Although gold jewelry
    was generally acknowledged and recognized at the time, the invention of a gold
    coin stamped with a seal looked to be the answer. Gold''s prominence grew rapidly
    following its introduction as a form of money in Europe and the United Kingdom,
    with artifacts from the Greek and Roman empires prominently displayed in museums
    all over the world. In 1066, the United Kingdom was likewise establishing its
    metal-based coinage. The value of all types of British currency, such as the pound,
    shillings, and pence, was based on the quantity of gold (or silver) they represented.
    Gold eventually became a symbol of riches across Europe, Asia, Africa, and the
    Americas.


    ### 1.2.6 Bimetallic standard of the US


    In 1792, the United States government maintained its gold legacy by creating a
    bimetallic standard. Every monetary unit in the United States had to be supported
    by either gold or silver, according to the bimetallic standard. For example, one
    dollar was worth 24.75 grains of gold at the time. This meant that the coins used
    as money were just representations of the central bank''s gold (or silver) holdings.
    This gold standard, however, did not continue indefinitely. Several important
    events in the early 1900s contributed to gold''s demise from the monetary system.
    The issue of promissory notes began in 1913, following the formation of the Federal
    Reserve (the present-day mirror copy of paper money). On-demand, these promissory
    notes could be easily redeemed in gold. The United States government received
    the right to all gold coins in circulation as a result of the Gold Reserve Act
    of 1934, allowing it to stop minting new gold coins. In a nutshell, this legislation
    established the notion that gold or gold coins were no longer required to serve
    as money. As a result, the United States abandoned the gold standard in 1971.
    It was at this time that its currency lost its gold backing.


    ### 1.2.7 Modern economy and gold


    Although gold is no longer used to underpin the US dollar (or any other global
    currency), it still has value in today''s culture. It is crucial to the global
    economy at all times. By focusing just on the balance sheets of central banks
    and other financial institutions, such as the International Monetary Fund, we
    may readily verify this argument. Approximately one-fifth of the world''s supply
    of above-ground gold is held by these organizations as of today. Moreover, some
    central banks have prudently increased their gold reserves. This underscores their
    fears about the global economy''s long-term viability.


    ### 1.2.8 Gold helps to preserve wealth


    The primary reason for gold''s relevance in the modern economy is that it has
    demonstrated exceptional performance in the successful preservation of wealth
    over a lengthy period of time spanning many generations. Paper-denominated currencies,
    on the other hand, cannot make the same claim. Let''s look at an example to assist
    us to comprehend what we''re talking about: In the early 1970s, one ounce of gold
    was worth $35. Assume you had the option of keeping either an ounce of gold or
    merely the $35 at the moment. Both gold and the dollar, in fact, would purchase
    you the same items, such as a brand new tailor-made business suit or a sporty
    bicycle. In contrast, if you had an ounce of gold today and converted it to today''s
    pricing, you''d be able to buy a whole new suit with it, but the same cannot be
    said for the $35. In reality, if you had elected to keep the $35 instead of the
    one ounce of gold, you would have lost a significant sum of money. This is mostly
    due to the fact that the value of gold increased while the value of the dollar
    decreased due to inflation.


    ### 1.2.9 Gold is secure


    As seen by the unabating tensions in the Middle East, Africa, South Asia, and
    elsewhere, the current world''s economic climate is becoming increasingly dependent
    on and determined by regional and political stability. It is for this reason that
    investors have a natural affinity for gold and regard it as a secure investment,
    particularly when political and economic instability are prevalent. An examination
    of history indicates that it has been polluted by the demise of dynasties, military
    and political coups, and the resulting currency collapse. During these times,
    gold investors were successful in safeguarding their riches and, in some cases,
    using the commodity to flee the economic and political chaos. As a result, whenever
    there are news events that hint at global economic turmoil, investors turn to
    gold as a safe haven.


    ### 1.2.10 Use of gold for diversifying investment


    In general, gold is seen as a great way to diversify one''s portfolio. Regardless
    of whether your concerns are connected to inflation, wealth protection, or a sinking
    US currency, gold has shown to be a profitable investment alternative that may
    add a diverse component to your investment portfolio. Gold, on the other hand,
    is unrelated to stocks, bonds, or real estate if your goal is just diversity.


    ### 1.2.11 Evolution of gold


    Gold has evolved over time as a consequence of three primary transitions: first,
    it became the global standard as a medium of exchange; second, an international
    banking system was built around it, with paper money fully convertible into gold;
    and third, convertibility into gold ceased in 1971, and gold was replaced by a
    pure fiat money system. The benefits of gold, on the other hand, have not altered
    in the 40 years since the world switched to a fiat money system. Governments discourage
    the use of gold as money for their citizens, but they trade in it through their
    central banks and treasuries, according to the financial world. There are confirmed
    claims that the US Treasury holds 261 mm ounces of gold. In 2012, the Fed''s assets
    were projected to reach 13.5 million ounces. India and China, through their central
    banks, have been buying gold at an alarming rate in recent months. As a result,
    in less than a year, they have boosted their gold holdings from 156 metric tons
    to more than 400 metric tons. This is a significant departure from the government''s
    long-term dumping of gold equities during the last four or five decades. Even
    the International Monetary Fund (IMF) has lately overturned a long-standing policy
    of gold liquidation by purchasing 44 metric tons. Of course, gold ownership is
    a worldwide phenomenon. As a result, gold prices are influenced not just by the
    Federal Reserve of the United States but also by the actions of other central
    banks across the world. The ECB is widely expected to have to "print" as a last
    resort in order to rescue the euro. If this is the case, the impact of E.U. printing
    will exacerbate the current currency wars, as no country wants a strong currency.
    Until now, the European Union has been wary about printing money. If they become
    a major player in the currency wars, they will just add gasoline to the fire by
    speeding up global money issuance and lowering gold''s put value. Gold, unlike
    many other assets, does not produce income or even promises to provide money at
    any point in the future. As a result, any profit from gold is solely based on
    its price fluctuation.


    ### 1.2.12 Issuance of credit by banks against gold coins'
