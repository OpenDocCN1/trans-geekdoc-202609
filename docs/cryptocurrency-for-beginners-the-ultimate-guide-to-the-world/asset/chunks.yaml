  trans: '

    Ethereum 区块链栈由多个模块组成。核心是运行在点对点 Ethereum 网络上的 Ethereum 区块链。此外，还有一个 Ethereum 客户端，运行在节点上，并通过点对点
    Ethereum 网络与区块链同步并本地存储，提供挖矿、账户管理等多种功能。本地区块链副本会定期与网络同步。另一个方面是 web3.js 库，它通过远程过程调用（RPC）接口实现与
    geth 客户端的交互。


    下面是以太坊区块链中所有高层级元素的列表：


    `Keys and addresses`


    `Accounts`


    `Transactions and messages`


    `Ether crypto currency/tokens`


    `The EVM`


    `Smart contracts`


    以太坊 vs. 比特币


    以太坊与比特币完全不同，它们的目标看似截然不同。


    实际上，其他加密货币与比特币和以太坊相比，以太坊与比特币的关系更为密切。例如，莱特币（Litecoin）更像比特币，而 NEO 更像以太坊。


    比较加密货币


    当你看到以太坊 vs. 比特币时，会发现它们的目标差异巨大。但从市场数据来看，两者的差距很小——比特币的市值为 1473 亿美元，而以太坊的市值为 842
    亿美元。


    以下是比特币和以太坊的部分功能和事实：


    比特币特点


    以下是比特币的主要特点：


    * 2009 年推出，BTC 是第一个使用区块链技术的加密货币


    * 比特币是数字货币


    * 旨在解决全球金融挑战


    * 比特币无需第三方（如 PayPal 或银行）


    * 作为传统货币的替代品开发


    * 用于手动购买，包括购买商品/服务或收款


    * 高度流动性，可快速将比特币转换为现金


    * 比特币交易只需几分钟完成


    以太坊特点


    以下是以太坊的主要特点：


    • 2015 年推出，以太坊区块链常被称作区块链 2.0


    • 智能合约用于编程转账


    • 智能合约在多种结构中消除了第三方的需求，而不仅仅是金融


    • 提供开发智能合约应用（即去中心化应用 dApps）的平台


    • 提供编程语言 Solidity，用于开发 dApps


    • Ether 是代币，驱动以太坊区块铭的转账


    • Ether 高度流动


    • 以太坊转账仅需秒级完成


    主要差异


    让我们来看以太坊与比特币的关键差异。


    概念


    想到比特币，就想到数字货币；想到以太坊，就想到智能合约。


    目的


    比特币是价值存储，也是转移资金的手段。以太坊也是转移资金的手段，但仅在特定情况下发生。


    以太坊还作为构建 dApps/智能合约的框架，使其能够发行代表价值的代币。这些代币除数字货币外，可代表任何价值，从而区别于比特币。


    交易


    比特币交易是手动的；而以太坊交易是自动且可编程的。


    交易速度


    以太坊的区块时间仅为秒级（交易速度），而比特币的区块时间为分钟级。


    * Ether 设计用于以太坊网络的强力交易（即 gas）。


    * 现实购买价值基于比特币，因此被视为货币。


    代币供应


    比特币最多限定 21,000,000 枚，这为存储价值创造了供需平衡，非常适合作为价值储存。以太坊则没有上限，Ether 的发行持续进行，但其供应量会随时间大幅下降。


    年龄


    以太坊比比特币晚 6 年推出，并且技术更为先进。


    智能合约


    智能合约是去中心化的工具。以太坊率先在以太坊 vs. 比特币的争论中推出了智能合约。智能合约是运行在以太坊区块链上的代码（函数）和数据（条件）的集合，存储在特定地址。智能合约是以太坊的一种账户，具有余额，并可通过网络传输转账。它们不是由个人操作，而是以编程方式在网络中分布式运行。用户账户通过满足智能合约定义的目的来与智能合约交互。智能合约可以通过代码自动执行规则，如标准合同。要编写并部署智能合约，只需会编程并拥有足够的
    ETH。智能合约由区块链驱动，使开发者能够构建永不下线且无法被第三方修改的应用。可以将智能合约想象为拥有房产：传统上需要律师和经纪人等第三方，而智能合约在满足条件后即可直接完成所有权转移。


    总结


    以太坊的目标是运行永不下线且不可更改的去中心化智能合约应用，提供开发者使用的平台和编程语言。比特币的功能则大相径庭，它作为一种共享价值存储 —  — 点对点数字货币，用于金融交易，并消除支付技术中的第三方需求。总之，以太坊与比特币的关键区别在于是否运行智能合约。比特币不支持智能合约，仅依赖手动支付技术。两者各有优势：比特币代币供应有限且更具流动性，而以太坊硬件更先进且应用更丰富。与其他区块链网络不同，以太坊具备可编程性，这种可定制功能使开发者能够解决从数字身份和匿名性到企业所有权和数据保护等问题。


