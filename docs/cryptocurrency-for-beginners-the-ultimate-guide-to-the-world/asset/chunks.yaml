    \ in Cardano&#39;s ADA Coin Reaches a Fever Pitch, Expect a Correction](img/image00195.jpeg)Cardano\
    \ 的核心目标是构建第三代平台，以实现智能合约功能，同时解决比特币（第一代货币）所面临的扩展性挑战。这并不令人惊讶，许多专家预测只要 Cardano 兑现其承诺，它终将取代以太坊（第二代货币）。Cardano\
    \ 的结算层（CSL）和控制层分别用于结算交易和智能合约。Ouroboros 证明-of-权益（proof-of-stake）方法位于 Cardano 的核心。与工作量证明系统相比，Cardano\
    \ 的协议更节能、更低成本。\n\n**Cardano 投资的优势**\n\n了解购买 Cardano 的好处对于判断 ADA 是否是一个好的、可能成功的投资至关重要。即使优势多于劣势，也不意味着应当量化衡量；一些劣势可能超过众多优势。因此，让我们来看看拥有\
    \ Cardano 的一些优势。\n\n**学术支持**：\n\n如前所述，Cardano 是少数几个被学术界研究并给予高度评价的货币之一。许多学者与 IOHK\
    \ 合作，撰写关于项目下一步如何提升 Cardano 的文章。这为 Cardano 提供了其他货币所缺乏的信任度，也对想更深入了解它的个人非常有价值。\n\n\
    **强大的开发团队**：\n\nCardano 由以太坊联合创始人 Charles Changing 及 Jeremy Wood 创立，于 2017 年正式发布后获得大量关注。Cardano\
    \ 也参与确保协议无缺陷。它评估了众多协议，并设计了复杂的区块链以避免缺陷和黑客攻击。\n\nCardano 采用多层架构：\n\n*   这是 Cardano\
    \ 的主要优势之一。\n*   同时也允许在不中断支付或交易的前提下进行修改。\n*   通过构建结算层和计算层，Cardano 实现了无限扩展性和快速交易。\n\
    \n**Cardano 投资的劣势**\n\n尽管 Cardano 相较于其他货币拥有诸多吸引人的优势，投资者和交易者在购买 ADA 前仍需了解其缺点。\n\
    \n与任何投资一样，投资 Cardano 并非没有风险。以下为主要缺点：\n\n*   **Cardano 计划实施投票系统**：\n    虽然开放式投票让持有者可以提议并投票修改颇具吸引力，但潜在缺点在于持有者未必技术熟练，可能投票支持非理性的结论。\n\
    \n*   **Cardano 仍在开发中**：\n    虽然 Cardano 被誉为“学术区块链”，经历了广泛的审查与测试，但它仍处于发展的早期阶段。这或许是避免\
    \ Cardano 的最重要原因。即便在竞争与技术突破之间，Cardano 也需要时间成长。它已长期落后于以太坊和 EOS，因为缺乏完整的合约与代币规范。Cardano\
    \ 仍专注于扩展性，而像 Ripple 这样的加密货币可处理 1,000 笔每秒交易，Pascal 仅能潜在处理 257 笔交易/秒。\n\n*   **Cardano\
    \ 进展迟缓**：\n    过去多次延期导致发布推迟，Cardano 缺乏合约及 dApp 功能，这最令人担忧。虽然承诺不久后的 Goguen 更新将带来这些功能，但这仍是一个缺点，直至实现为止，我们无法依赖这些承诺。\n\
    \n*   **账本同步问题**：\n    虽然 Cardano 采用了独特方法，但部分批评者认为其假设账本随时可在全局网络中同步的前提在现实中不切实际。\n\
    \n*   **双重支出或 51% 攻击风险**：\n    许多专家认为仍可对系统进行双重支出或 51% 攻击。例如，输入背书人可能批准来自两个不同区块引导者的相同交易。\n\
    \n## 4.4 加密货币的神话\n\n加密货币在近年来因其惊人的收益而迅速发展，但受比特币推动的指数级增长也孕育了众多或真或假的神话。以下是一些常见的加密货币误区。\n\
    \n**政府可以禁止并停止加密货币**：\n\n政府可以要求金融机构停止处理加密货币或与其交易的公司，但实际禁止加密货币的存在极其困难。加密货币交易与发送电子邮件的难度相近，任何拥有网络的人都能轻松进行。\n\
    \n**政府对加密货币持谨慎态度**：\n\n政府担忧加密货币的潜在风险，希望对可能被视为可行货币的事物拥有更多控制权。然而，近年来越来越多国家表现出愿意以好奇心态对待加密货币的立场。\n\
    \n**加密货币助长犯罪、恐怖主义和毒品活动**：\n\n![Down the Rabbit Hole: A Cryptocurrency Primer |\
    \ CFA Institute Enterprising Investor](img/image00196.jpeg)加密货币如同传统货币和金融体系，可能被用于恶意目的。但其作为非法行为温床的观点是错误的。根据\
    \ Chainalysis 分析，非法活动占比从 2019 年的 2%（约 $200 亿美元）下降至去年的 1%（约 $100 亿美元）。\n\n**加密货币交易完全匿名，这是一个谬误**：\n\
    \n虽然区块链上的交易看似匿名，但政府机构足以渗透比特币交易所提供的隐私保护。许多企业提供加密货币取证服务（如 Coinfirm），更严格的监管预计将通过提升全球\
    \ KYC 标准来大幅遏制犯罪活动。\n\n**区块链只有一个可验证的用例：加密货币**：\n\n"
