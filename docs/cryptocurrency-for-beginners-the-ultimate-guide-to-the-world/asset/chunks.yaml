    Blockchain technology is a method of storing data in such a manner that it is
    hard or impossible to alter, hack, or defraud it. A blockchain is a digital log
    of transactions that is copied and distributed throughout the blockchain''s complete
    network of computer systems. Each block on the chain comprises a number of trades,
    and each time a new action takes place on the database, a note of that event is
    added to the Ledger of each participant. Distributed Ledger is a decentralized
    database that is administered by various people. Blockchain is a sort of distributed
    ledger technology in which information is recorded using a hash, which is an immutable
    electronic signature.


    Bitcoins have led investors and the rest of the globe on a wild journey from its
    small start in 2008 to its price high in 2017. It''s risen, fallen, rallied, and
