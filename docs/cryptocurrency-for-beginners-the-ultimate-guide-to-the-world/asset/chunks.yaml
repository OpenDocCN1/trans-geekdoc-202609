- raw: "Early banks proposed a solution to this problem by storing these coins with\
    \ a guarantee of return. These deposits were then used by the early banks to offer\
    \ loans. Banks began paying interest to depositors to motivate more people to\
    \ invest. Banknotes were introduced in this way. Banks gave depositors a slip\
    \ that listed the amount as well as the weight of gold they had deposited. The\
    \ government began printing the first currency notes to control the flow of these\
    \ notes.\n\n### 1.2.13 Modern online credit\n\nPurchase something from a retailer\
    \ and provide your credit card information. The retailer interacts with the bank,\
    \ credit card company, and other businesses. Paypal is an exception. It acts as\
    \ a middleman between you and the retailer. You give Paypal your credit card information,\
    \ and Paypal ratifies the transaction and pays the retailer. You are not required\
    \ to provide the seller with credit card information. In this regard, Apple Pay\
    \ is similar. While many people are hesitant to provide credit card information\
    \ online, we do so anyway. Its use also leads to a lot of costly fraud.\n\n# Chapter\
    \ 2: Money as Medium of Exchange\n\n![Money Exchange Purchase PNG, SVG Clip art\
    \ for Web - Download Clip Art, PNG Icon Arts](Images/image00200.jpeg)\n\nIn modern\
    \ times, paper currency is the most widely used medium of exchange. Fiat money\
    \ is made up of paper notes. To put it another way, their face and intrinsic values\
    \ aren't the same. Fiat money is defined as a government-issued currency that\
    \ is not backed by physical assets such as silver or gold. It is in contrast to\
    \ commodity money, which has its own value. There are several advantages to using\
    \ paper currency. The government can issue paper currency notes at a low cost\
    \ because their intrinsic value is much lower than their face value. They are\
    \ also simple to store due to their light weight, durability, and portability.\
    \ They are perfectly safe to carry and store than gold coins. Paper currencies,\
    \ unlike coins, are not good or bad; they are all the same. By regulating the\
    \ supply of paper currency, the issuing authority can keep its value stable. The\
    \ regulating authority has the power to increase and decrease its quantity. As\
    \ a result, its supply can be described as elastic. The disadvantages of paper\
    \ currency, on the other hand, cannot be overlooked. Governments issue these currencies,\
    \ which are controlled by a central bank. Legitimate investors lose their money\
    \ deposited in banks during liquidity crises and bank runs. The government issuing\
    \ of too many currencies can lead to inflationary pressures. Inflation occurs\
    \ when the overall price level rises, resulting in a decrease in the value of\
    \ money. Paper money is not indestructible; it can be harmed by floods, fires,\
    \ insects, and other natural disasters.\n\n## 2.1 Money as a medium of exchange\n\
    \nMoney is commonly recognized in a given country as a means for payment for goods\
    \ and services and payment of debts. Nearly all modern money systems are based\
    \ on fiat currency. Economies depend on the exchanging of goods and services for\
    \ money. Money, where it comes from and what it is worth, is described by economists.\
    \ Given below are the multifarious characteristics of money. \n\nCharacteristics\
    \ of Money\n\nMoney has three characteristics, according to the economists:-\n\
    \n*   Means of Payment\n\n*   Unit of Account\n\n*   Store of Value\n\n### 2.1.1\
    \ What actually is money?\n\nMeans of Payment is the most important characteristic\
    \ of money out of its three widely recognized characteristics that have been listed\
    \ above. The value and worth of money for society are only gauged through its\
    \ acceptance by the general population as a means of payment that is unconditional.\
    \ Money makes it easy for people to work in coordination for their common good.\
    \ Listed below are many practical definitions of money. Money is:\n\n*   Creature\
    \ of the law\n\n*   Not tangible wealth in itself\n\n*   A power to obtain wealth\n\
    \n*   A token\n\n*   A symbol of wealth\n\n*   An abstract social power based\
    \ on law\n\n*   What government accepts in taxes\n\n*   A medium of exchange\n\
    \n*   It is legally enforced by the government\n\n*   Is an exchange medium greatly\
    \ accepted by the People?\n\nMoney’s worth as an exchange medium exists because\
    \ of its acceptability by the people. Money is legally enforced by Government.\
    \ During this enforcement, the Government acts on behalf of the People.\n\n###\
    \ 2.1.2 Use of money as a medium of exchange \n\nPeople used to barter to purchase\
    \ the services and goods they wanted before the establishment of a means of trade,\
    \ i.e., money. Two people, each owning certain commodities that the other desired,\
    \ will enter into a trade agreement. However, early forms of bartering do not\
    \ have the divisibility and transferability that ultimately makes trading successful.\
    \ For example, if anyone has cows but wants bananas, they have to seek someone\
    \ who has an appetite for beef, not just bananas. What if the person meets someone\
    \ who wants meat and no bananas and is only willing to deliver potatoes? Such\
    \ a person must seek someone that has bananas but also needs potatoes in order\
    \ to get meat. It is tiring, confusing, and costly to lack the transferability\
    \ of bartering for goods. But that's not where the complications end; even if\
    \ the person meets someone to exchange beef for bananas with, they might not think\
    \ a whole cow is worth a bunch of bananas. Such a transaction involves an agreement\
    \ to be made and a way to decide how many bananas would be enough to buy a certain\
    \ portion of the cow.\n\nCommodity capital has addressed these issues. Money from\
    \ goods is a form of good that serves as a currency. For instance, American colonists\
    \ made use of dried corn and beaver pelts in transactions in the early part of\
    \ the 17th and 18th centuries. These goods, having generally recognized values,\
    \ were used to purchase and sell other items. There were some features of the\
    \ goods that were used for trade: they were highly sought-after goods and, thus,\
    \ expensive, but they were also compact, durable and easily stored.\n\nA precious\
    \ metal like gold is another more refined type of commodity money. For decades,\
    \ before the 1970s, gold was used to significantly boost paper money. For example,\
    \ in the case of the U.S. dollar, this means that foreign countries were willing\
    \ to take their currencies and trade them with the United States at a specified\
    \ rate for gold. This exchange was executed with the United States Federal Reserve.\
    \ What's fascinating is that gold is valuable simply because people like it, unlike\
    \ dried corn and beaver pelts (which can be used for food and clothes, respectively).\
    \ You can't consume gold because it won't hold you warm at night; however, most\
    \ people think it's wonderful, and they realize others think it's magnificent,\
    \ too. It's not particularly helpful. Yes, gold has value. Gold acts as a tangible\
    \ symbol of wealth because of the perceptions of people. As a symbol of something\
    \ with utility, this association between money and gold gives insight into how\
    \ money acquires its worth.\n\n## 2.2 Fiat or Physical Money"
