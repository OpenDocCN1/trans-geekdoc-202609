  trans: '

    一不能在不回顾金市开端的情况下完全理解黄金的实际目的。黄金的历史可以追溯到公元前 3000 年。当时，早期的埃及人开始制作首饰。直到公元前 560 年，黄金才开始被用作交换媒介。该时期的商人正在寻找一种标准化、易于携带的货币形式，以便简化并提高贸易过程的效率。虽然当时黄金首饰普遍被认可和接受，但铸有印章的黄金硬币的发明似乎是答案。黄金在被引入欧洲和英国作为货币形式后迅速走红，希腊和罗马帝国的文物在全球博物馆中显著展出。1066
    年，英国同样在建立以金属为基础的货币体系。英国所有类型货币（如英镑、先令和便士）的价值都基于它们所代表的黄金（或白银）的数量。黄金最终在欧洲、亚洲、非洲和美洲成为财富的象征。


    ### 1.2.6 美国双金属本位制


    1792 年，美国政府通过建立双金属本位制保持其金本位传统。根据双金属本位制，美国的每一种货币单位必须由黄金或白银支持。例如，当时一美元等于 24.75 粒黄金。这意味着用作货币的硬币仅仅是中央银行黄金（或白银）储备的象征。然而，这种金本位制并未长久维持。早期
    1900 年代的几个重要事件促成了金从货币体系中的衰落。1913 年，随着联邦储备系统（现代纸币的镜像）的成立，有价券的问题开始出现。这些有价券可随时在金上兑现。1934
    年，美国政府通过《金条法案》获得了流通中所有金币的权利，从而停止了新金币的铸造。简而言之，这部法律确立了金或金币不再是作为货币所必需的观念。因此，美国于 1971
    年放弃了金本位制，其货币不再有金本位支撑。


    ### 1.2.7 现代经济与黄金


    尽管黄金不再用于支撑美元（或任何其他全球货币），它在当今文化中仍具有价值。它对全球经济始终至关重要。仅通过查看中央银行和其他金融机构（如国际货币基金组织）的资产负债表，我们就能轻易验证这一论点。截至目前，大约五分之一的地上黄金储备被这些机构持有。此外，一些中央银行已谨慎地增加其黄金储备，这凸显了他们对全球经济长期可持续性的担忧。


    ### 1.2.8 黄金帮助保值


    黄金在现代经济中的重要性主要源于其在跨越多代人、长期保值方面表现出的卓越成绩。相比之下，以纸币计价的货币无法做出同样的主张。让我们通过一个例子来帮助理解：在
    20 世纪 70 年代初，一盎司黄金价值为 35 美元。假设你有选择权，要么保留一盎司黄金，要么仅保留 35 美元。实际上，黄金和美元在当时都能购买相同的商品，如定制商业西装或运动自行车。然而，如果你今天拥有一盎司黄金并按当前价格换算，你可以购买全新西装，而同样的
    35 美元则无法购买到相同的东西。事实上，如果你选择保留 35 美元而不是一盎司黄金，你会损失大量金钱。这主要是因为黄金价值上升，而美元价值因通胀而下降。


    ### 1.2.9 黄金是安全的


    正如中东、非洲、南亚及其他地区持续的紧张局势所示，当前世界的经济环境日益依赖于和受制于地区和政治稳定。因此，投资者自然倾向于黄金，将其视为一种安全的投资，尤其是在出现政治和经济不稳定时。历史
    examination 表明，它曾受到王朝衰落、军事和政治政变以及随之而来的货币崩溃的影响。在这些时期，黄金投资者成功地保护了他们的财富，甚至在某些情况下利用该商品逃离经济和政治动荡。因此，每当出现暗示全球经济动荡的新闻事件时，投资者便会转向黄金作为避风港。


    ### 1.2.10 利用黄金进行投资组合多元化


    总体而言，黄金被视为多元化投资组合的绝佳方式。无论你的顾虑是通胀、财富保护，还是美元价值下跌，黄金已被证明是一项盈利的投资选择，可以为你的投资组合添加多样化的元素。如果你的目标仅是多元化，黄金与股票、债券或房地产无关。


    ### 1.2.11 黄金的演变


    黄金的演变源于三个主要转变：首先，它成为全球支付手段；其次，围绕它建立了国际银行体系，纸币完全可兑换为黄金；第三，1971 年可兑换性终止，黄金被纯纸币体系取代。然而，黄金的优势在世界转向纸币体系
    40 年后并未改变。政府劝阻公民使用黄金作为货币，但它们通过中央银行和国库进行交易。已确认美国财政部持有 261 万盎司黄金。2012 年，美联储的资产规模预计将达到
    1350 万盎司。印度和中国通过其央行在最近几个月来大量购买黄金。因此，不到一年时间，它们的黄金储备就从 156 公吨增加到 400 多公吨。这与过去四五十年政府长期抛售黄金资产的做法形成鲜明对比。国际货币基金组织（IMF）最近也打破了长期的黄金抛售政策，购入
    44 公吨。当然，黄金拥有权是全球性的现象。因此，黄金价格不仅受美国联邦储备系统的影响，也受全球各央行的行动影响。欧洲央行（ECB）通常被认为会在最后一刻“印钞”以救助欧元。如果这是真的话，欧元区的印钞将加剧当前的货币战争，因为没有国家希望其货币过于强势。至今，欧盟对印钞持谨慎态度。如果欧盟成为货币战争的主要参与者，它将通过加速全球货币发行并降低黄金的“保值”价值，火上浇油。与许多其他资产不同，黄金在其整个生命周期内不产生收入，甚至不承诺在未来提供金钱。因此，黄金的任何利润完全取决于其价格波动。


    ### 1.2.12 银行对金币发行信贷


