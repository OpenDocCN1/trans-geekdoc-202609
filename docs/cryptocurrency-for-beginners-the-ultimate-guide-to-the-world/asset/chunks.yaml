    ### 3.1 Ripple


    Ripple is a platform for peer-to-peer financial transfers and virtual money. The
    platform is an open-sourced protocol that allows two parties to conduct transactions
    quickly and cheaply. From fiat currencies like sterling to cryptocurrencies and
    air miles, any sort of cash may be traded on the site. The ripple token (X.R.P.),
    which is convertible with any cash or digital asset, may also be utilized on the
    platform. On the other hand, it is not reliant on the ripple network. To transfer
    money, a party does not need X.R.P. As a result, the worth of Ripple lies not
    in the X.R.P. coin but the network''s capacity to swiftly move assets throughout
    the globe.


    The network competes with established payment methods, such as Swift. Rather than
    operating as a substitute for current payment systems or a direct rival to fiat
    money, as other cryptocurrencies such as bitcoin aspire to achieve, it may support
    a variety of payments throughout RippleNet. The concept of Ripple was initially
    proposed in 2004, but it wasn''t widely adopted until 2013. Jed McCaleb encouraged
    a lot of shareholders to participate in the network. Chris Larsen was also one
    of those angel investors, and he is regarded as one of the wealthiest cryptocurrency
    investors. There are certain advantages and disadvantages to consider before selecting
    whether or not to utilize Ripple as a person or a company.


    #### Advantages of Ripple


    ![Price of world&#39;s 3rd largest cryptocurrency XRP crashes after lawsuit |
    Business Standard News](Images/image00189.jpeg) Ripple''s mission is to solve
    issues and open doors. People usually have to wait weeks for cross-border transactions,
    depending on the payment and the involved parties. Ripple''s solutions aim to
    save costs while also improving speed and efficiency. RippleNet also has a large
    number of participants. Thus the answer is not unusual. According to the increasing
    network phenomenon, the more conventional organizations that join Ripple''s solution,
    the larger the influence Ripple will have in the future.


    #### Downsides of Ripple


    Ripple is attempting to establish itself with a competitor to SWIFT, the industry
    leader, in a congested financial technology field. In the conventional world,
    altering the status quo may be difficult, time-consuming, and eventually need
    transitions and accompanying education. Ripple has rivals in the crypto realm,
    like Stellar and SWIFT. Even while Ripple has the first-mover advantage, it must
    continue innovating and expanding its network.


    Because the crypto business is so young compared to conventional finance, regulation
    has been hazy. Should regulatory agencies just apply existing conventional rules
    and standards to the crypto realm, or should they design new laws that better
    match this innovation? One example of these regulatory difficulties is the S.E.C.''s
    suit against Ripple.


    ### 3.2 Stellar


    Stellar is a distributed ledger technology-based payment mechanism. It enables
    cross-border payments between any two currencies in a matter of seconds. It resembles
    other blockchain-based cryptocurrencies in many respects. Inflation is the only
    other way for X.L.M. to be created. To accommodate for economic growth and lost
    Lumens, the Lumen generation rate has a set yearly inflation rate of 1%. Fresh
    Lumens are manufactured and awarded every week using a direct voting system.


    ![What you need to know about Stellar, the altcoin that&#39;s out of this world
    | StormGain](Images/image00190.jpeg)


    #### How Does Stellar Blockchain Work?


    Like every blockchain technology, the Stellar network adds transactions to a shared
    and decentralized public ledger. The "Stellar Consensus Protocol," which is based
    on the Federal Byzantine Agreement (F.B.A.), is used by Stellar (S.C.P.). S.C.P.
    allows for faster transactions at cheaper costs by allowing everybody on the network
    to agree on the authenticity of a transaction in a matter of seconds. Each participant
    (referred to as a node) that assists in adding events to the global ledger chooses
    his or her mini-network of other trustworthy participants. Quorum Slices are the
    name for these small networks. As long as Consensus Slices overlap, the Stellar
    network can swiftly establish agreement on legitimate transactions and add them
    to the ledger.


    #### The Pros of Investing in Stellar


    A quick look at several crypto finance websites reveals bullish predictions for
    Stellar''s future (X.L.M.). Most analysts believe that X.L.M. is a good investment
    for both teachers and student traders, and investors. Let''s look at the positive
    aspects of X.L.M. to see if it''s a good investment.


    ##### Free of Cases with Regulatory Bodies


    Despite a close working relationship with Ripples, Stellar has avoided legal disputes
    with regulatory authorities. He is also the founder of Ripple and Stellar, two
    companies he founded with his brother Jed McCaleb. This is one of the primary
    reasons why Stellar and Ripples have many similarities and just a few significant
    differences. Therefore, the recent surge in the price of X.R.P. has had little
    effect on X.L.M., which has maintained its independence in terms of demanding
    a price on its own rather than as a fork of the first-mover of cross-border transactions.
    A lack of dispute or regulatory action brightens the future of a technological
