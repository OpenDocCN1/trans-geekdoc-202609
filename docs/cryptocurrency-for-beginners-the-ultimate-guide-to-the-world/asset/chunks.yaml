  fmt: '

    The Ethereum blockchain stack comprises multiple modules. At heart, there is the
    Ethereum blockchain operating on the peer-to-peer Ethereum network. Furthermore,
    there''s an Ethereum client that operates on the nodes and links to the p-to-p
    Ethereum network from where block chain can be downloaded and stored locally.
    It provides multiple functions, like mining and account management. A local copy
    of the blockchain is then synchronized periodically with the network. Another
    aspect is the web3.js library that enables contact with the geth client through
    the Remote Procedure Call (RPC) interface. A list of all high-level elements present
    in the Ethereum blockchain contains the following:


    `Keys and addresses`


    `Accounts`


    `Transactions and messages`


    `Ether crypto currency/tokens`


    `The EVM`


    `Smart contracts`


    Ethereum vs. Bitcoin


    Ethereum and Bitcoin are entirely different from one another. They seem to have
    very different goals in mind.


    In reality, other crypto currencies relate a lot more to Bitcoin and Ethereum
    than Ethereum and Bitcoin compared to each other. For instance, Litecoin is much
    more like Bitcoin than Ethereum is, and NEO is more like Ethereum than Bitcoin
    is.


    Comparing the Crypto currencies


    When you glance at Ethereum vs. Bitcoin, you will see that their aims are widely
    divergent. Looking at their market figures, however, the gap is very minimal —
    Bitcoin’s market capitalization stands at $147.3b in contrast to Ethereum’s market
    capitalization of $84.2b.


    Now take a look at a few of the functionality and facts of Bitcoin and Ethereum.


    Bitcoin Features


    Listed below are the salient features of Bitcoin.


    *   Introduced in 2009, BTC was the very first crypto currency that made use of Blockchain
    technology


    *   Bitcoin is a digital money


    *   It seeks to address the challenges of global finance


    *   Bitcoin does not require a third party, like PayPal or a bank


    *   Developed as an alternative to regular currencies


    *   Used for manual purchases, including buying goods/services or collecting money


    *   It is highly liquid, which means you can quickly turn Bitcoin into cash


    *   It takes minutes to complete Bitcoin transactions


    Ethereum Features


    Listed below are the salient features of Ethereum.


    •  Launched in 2015, Ethereum’s blockchain commonly recognized synonym is Blockchain
    2.0


    •  Smart contracts program the transfers


    •  Its smart contracts remove the need for third parties in multiple structures,
    not just financial ones


    •  It offers a forum to develop smart-contract applications (known as dApps)


    •  It offers a programming language, named Solidity, to develop the dApps with


    •  Ether is the currency; it drives transfers on the Ethereum blockchain


    •  Ether is extremely liquid


    •  Ethereum’s transfers take seconds to complete


    Major differences


    Let’s look at the key differences between Ethereum and Bitcoin.


    Their concepts


    When you think of Bitcoin, think about digital money. When you think of Ethereum,
    think about smart contracts.


    Their purposes


    Bitcoin is a store of value, and a means to transfer money to others. Ethereum
    is also a means to give money to others, but only when such incidents happen.


    Ethereum also varies by acting as a building framework for dApps/smart contracts,
    which enable it to submit tokens that reflect values. These values can be anything
    other than digital currency, rendering it different from Bitcoin.


    Their transactions


    Bitcoin’s transactions are manual. On the other hand, Ethereum’s transactions
    are automatic and programmable.


    The speed of the transactions


    Block time of Ethereum is only seconds (transaction speed). However, the block
    time of Bitcoin is minutes.


    *   Ether is built for the power transaction of the Ethereum Network – assume
    this to be gas.


    *   The value of real-world purchases is based on Bitcoin. So it is considered
    as currency.


    Their coin supply


    Bitcoin is limited to only 21,000,000 coins. This generates supply and demand,
    which is ideal for a store of value. Ethereum, however, is not limited. The output
    of Ether is persistent. The supply of Ether will drop down a lot over time.


    Their ages


    Ethereum is 6 years newer in contrast to Bitcoin. Moreover, it is further advanced.


    Smart contracts


    Smart contracts are a decentralized instrument. Ethereum was the one that launched
    smart contracts into the world in the war against Ethereum vs. Bitcoin. With smart
    contracts, when a deal happens, you will set conditions. A smart contract is software
    that is running on the blockchain of Ethereum. This is a set of code (its functions)
    and data (its condition) stored in the Ethereum block chain at a certain address.
    Smart contracts are a form of an account of Ethereum. This ensures that they have
    a balance, and transfers can be transmitted through the network. They are, however,
    not operated by a person but rather distributed and run as programmed on the network.
    User accounts will then communicate with a smart contract by transactions that
    fulfill a smart contract-defined purpose. Smart contracts can define and automatically
    execute rules through a code, like a standard contract. All should write and deploy
    a smart contract to the network. You just need to know how to code and have enough
    ETH to deploy the contract in a smart contract language. Since smart Ethereum
    contracts are driven by the blockchain, developers may design applications that
    are never offline and therefore cannot be edited by third parties. One good way
    to think about smart contracts is to think about owning a home. Normally, third
    parties such as a lawyer and a broker would be needed. The possession of the house
    is immediately submitted after a prerequisite has been fulfilled with a smart
    contract.


    Bottom line


    Ethereum’s aim is to deliver and run decentralized smart-contract applications
    powered by blockchain technologies that do not go offline and cannot be changed.
    It provides developers with a forum and programming language to develop the applications
    on. Bitcoin’s function, however, is largely different. It functions as a shared
    store of value — a p-to-p digital currency used for financial transactions. It
    removes the need for third parties in payment technology. In conclusion, the key
    distinctions that distinguish Ethereum vs. Bitcoin are their aims and their definitions.
    Often, Ethereum’s blockchain runs smart contracts. Bitcoin doesn’t and instead
    only relies on manual payment technology. It’s clear that there are advantages
    to using both Bitcoin and Ethereum. Bitcoin has smaller coin availability and
    is more liquid than Ethereum, but Ethereum has improved hardware and has more
    applications than Bitcoin would. Unlike several other block chain networks, Ethereum
    is programmable. This customizable functionality has allowed developers to solve
    problems ranging from digital identity and anonymity to corporate ownership and
    data protection.


    ### 3.5.12 Ripple (XRP)


