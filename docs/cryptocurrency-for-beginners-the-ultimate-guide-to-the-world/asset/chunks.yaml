    和 DeFi——的推出所推动。加密货币种类繁多，从加密货币到狗狗币和 Tether，让初学者难以入门。以下是按市值排序的前十大比特币，即目前流通中所有硬币的总价值，以帮助你理清思路。Ripple
    是一个用于点对点金融转账和虚拟货币的平台。该平台是一个开源协议，允许两方快速且低成本地进行交易。从英镑等法币到加密货币和空中里程碑，任何类型的现金都可以在该网站上交易。XRP
    代币（X.R.P.）可与任何现金或数字资产兑换，也可以在该平台上使用。另一方面，它并不依赖于 Ripple 网络。转账时，双方无需 XRP。因此，Ripple
    的价值不在于 XRP 硬币，而在于其网络快速在全球范围内移动资产的能力。


    ![Most Popular Types of Cryptocurrency | NextAdvisor with TIME](img/image00188.jpeg)


    Stellar 是一种基于分布式账本技术的支付机制。它能够在几秒钟内完成任意两种货币之间的跨境支付。它在许多方面与其他基于区块链的加密货币相似。XLM 的唯一其他创造方式是通货膨胀。为适应经济增长和损失的
    Lumen，Lumen 的年通货膨胀率设定为 1%。每周通过直接投票系统生产并奖励新的 Lumen。


    ![What you need to know about Stellar, the altcoin that''s out of this world |
    StormGain](img/image00190.jpeg)


    ### 3.1 Ripple


    Ripple 是一个用于点对点金融转账和虚拟货币的平台。该平台是一个开源协议，允许两方快速且低成本地进行交易。从英镑等法币到加密货币和空中里程碑，任何类型的现金都可以在该网站上交易。XRP
    代币（X.R.P.）可与任何现金或数字资产兑换，也可以在该平台上使用。另一方面，它并不依赖于 Ripple 网络。转账时，双方无需 XRP。因此，Ripple
    的价值不在于 XRP 硬币，而在于其网络快速在全球范围内移动资产的能力。


    网络与传统支付方式（如 SWIFT）竞争。与其他加密货币（如比特币）旨在取代现有支付系统或与法币直接竞争的目标不同，RippleNet 支持多种支付方式。Ripple
    的概念最初于 2004 年提出，但直到 2013 年才广泛采用。Jed McCaleb 鼓励许多投资者参与该网络。Chris Larsen 也是其中一位天使投资人，被认为是加密货币投资者中最富有的之一。在选择个人或公司是否使用
    Ripple 之前，需要权衡其优缺点。


    #### Ripple 的优势


    ![Price of world&#39;s 3rd largest cryptocurrency XRP crashes after lawsuit |
    Business Standard News](img/image00189.jpeg) Ripple 的使命是解决问题并开辟新机遇。人们通常需要数周时间完成跨境交易，具体取决于支付方式和相关方。Ripple
    的解决方案旨在降低成本，同时提高速度和效率。RippleNet 拥有大量参与者。因此，这并不奇怪。根据网络效应的增加现象，加入 Ripple 解决方案的传统组织越多，Ripple
    在未来的影响力也越大。


    #### Ripple 的缺点


    Ripple 试图在拥挤的金融科技领域中与 SWIFT 这一行业领导者竞争。在传统世界中，改变现状可能困难、耗时，最终需要过渡和相应的教育。Ripple 在加密货币领域面临竞争对手，如
    Stellar 和 SWIFT。尽管 Ripple 拥有先发优势，但必须持续创新并扩展其网络。


    由于加密货币行业比传统金融更为年轻，监管环境模糊。监管机构是否应将现有的传统规则和标准直接应用于加密货币领域，还是应设计更贴合这一创新的新法律？一个典型的监管困难例子是
    SEC 对 Ripple 的诉讼。


    ### 3.2 Stellar


    Stellar 是一种基于分布式账本技术的支付机制。它能够在几秒钟内完成任意两种货币之间的跨境支付。它在许多方面与其他基于区块链的加密货币相似。XLM 的唯一其他创造方式是通货膨胀。为适应经济增长和损失的
    Lumen，Lumen 的年通货膨胀率设定为 1%。每周通过直接投票系统生产并奖励新的 Lumen。


    #### Stellar 区块链的工作原理


    与所有区块链技术一样，Stellar 网络将交易添加到共享且去中心化的公共账本中。Stellar 使用基于联邦拜占庭协议（F.B.A.）的“Stellar
    共识协议”（S.C.P.）。S.C.P.通过在几秒钟内让网络中的每个人对交易的真实性达成一致，从而实现更快的交易和更低的成本。协助将事件添加到全球账本的每个参与者（称为节点）会选择一组可信的其他参与者组成的小网络。这些小网络被称为
    Quorum Slices。只要 Consensus Slices 有重叠，Stellar 网络就能迅速达成一致并将合法交易添加到账本中。


    #### 投资 Stellar 的优势


    对几家加密货币金融网站进行快速浏览，可以看到对 Stellar 未来（X.L.M.）的看涨预测。大多数分析师认为 X.L.M.是教师、学生交易者以及投资者的良好投资选择。让我们来看看
    X.L.M.的积极方面，以判断它是否是一个好的投资。


    ##### 无监管争议


    尽管与 Ripple 有密切的合作关系，Stellar 仍避免与监管机构发生法律争议。其创始人 Jed McCaleb 同时创立了 Ripple 和 Stellar
    两家公司。这也是 Stellar 和 Ripple 相似之处众多、差异较少的主要原因。因此，XRP 最近的价格上涨对 X.L.M.影响甚微，后者保持了独立性，能够按自身定价而非作为首发跨境交易的分叉代币。缺乏争议或监管行动为技术企业的未来增添了光明前景，并通过提升其价值对其股价产生积极影响。


