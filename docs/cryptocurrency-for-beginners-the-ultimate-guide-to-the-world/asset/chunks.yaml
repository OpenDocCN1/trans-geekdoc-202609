- raw: "Although PayPal's history isn't particularly lengthy, there have been numerous\
    \ ebbs, flows, and tipping points throughout the company's two-decade-plus existence.\
    \ When technology entrepreneurs Peter Thiel and Max Levchin founded PayPal in\
    \ 1998, it wasn't even called PayPal. Confinity was the company's original name,\
    \ and it was founded on the premise of providing consumers and businesses with\
    \ low-cost, almost effortless digital payments. As the internet's grip on global\
    \ consumers tightened, the company wisely targeted an underserved market: banking\
    \ and payments. The founders' concept was simple and effective: persuade customers\
    \ to share their email addresses, banking information, and credit card numbers\
    \ in exchange for quick, low-cost payments. Within three years of opening its\
    \ doors, the company had processed more than $3 billion in payments from 10.2\
    \ million individual consumers as well as 2.6 million commercial customers. After\
    \ deciding to focus solely on payments made over the internet, the founders changed\
    \ their name to PayPal two years later. Thiel and Levchin cleverly exploited a\
    \ gap in the payments market, when no one was really concentrating on a digital\
    \ payment platform for consumers and businesses, a gap that the duo brilliantly\
    \ exploited as PayPal took off at the turn of the century.\n\nPayPal timeline\n\
    \nPayPal's growth trajectory accelerated in its early years, and the company soon\
    \ set some impressive growth benchmarks.\n\nAugust 1998\n\nAfter giving a speech\
    \ on global market opportunities at Stanford University, Peter Thiel meets Max\
    \ Levchin. They came up with the concept of digital wallets later that year.\n\
    \nDecember 1998\n\nPayPal is established.\n\nOctober 1999\n\nEmail-based payment\
    \ technology is produced by the company’s engineer.\n\nJanuary 2000\n\nPayPal's\
    \ founders and managers noticed that end-users were asking commercial partners\
    \ as well as other buyers to sign up for PayPal in order to facilitate faster\
    \ payments. PayPal paved the way for eBay payments on the site almost immediately,\
    \ boosting PayPal's user base significantly.\n\nMarch 2000\n\nPayPal surpasses\
    \ the one million customer target.\n\nJune 2001\n\nThe founders replace the Confinity\
    \ name with its official name PayPal.\n\nFebruary 2002\n\nWith the issuance of\
    \ new company stock, PayPal (PYPL-Nasdaq) goes public. The IPO is a success, with\
    \ PayPal stock rising by more than 50% and closing at $20 per share on its first\
    \ day of trading.\n\nOctober 2002\n\nIn a much-touted \"marriage\" between digital\
    \ auction as well as online payment services, PayPal is sold to eBay for $1.5\
    \ billion.\n\nFebruary 2006\n\nPayPal crosses one hundred million end-user accounts.\n\
    \nApril 2006\n\nPayPal launches PayPal Mobile, a new mobile payment platform that\
    \ allows customers to pay with PayPal from their smartphones.\n\nDecember 2008\n\
    \nPayPal moves close to the one hundred million user accounts user mark.\n\nSeptember\
    \ 2013\n\nPayPal pays $800 million for Braintree Systems, the payments gateway\
    \ company that was owned by Venmo, an online payment competitor.\n\nJuly 2015\n\
    \n[Paypal buys Xoom](https://fortune.com/2015/07/01/paypal-acquires-money-transfer-firm-xoom-for-890-million/),\
    \ a digital money transfer firm, for $890 million. This enables the company to\
    \ accelerate the handling of international payments.\n\nFebruary 2017\n\nPayPal\
    \ launches its first peer-to-peer payment system. This helped the company establish\
    \ a solid foothold in the emerging P2P marketplace.\n\nPresent\n\nThe company\
    \ has begun to delve deep into the lucrative but volatile cryptocurrency market,\
    \ concentrating on the technology's underlying Blockchain platform and avoiding\
    \ Bitcoin - at least for now. In addition, the company is expanding its presence\
    \ in India, a key global market, by hiring 1,200 new company technology specialists\
    \ to concentrate on mobile as well as other merging payment technologies in India.\
    \ It also announces a partnership with Facebook (FB) - Get Facebook, Inc. Class\
    \ A Report Marketplace, which company officials believe has the potential to outperform\
    \ its long-time partner eBay in terms of financial performance. Overall, investors\
    \ and analysts see PayPal as a leading player in the digital payments sector,\
    \ and despite fierce competition from fintech companies and major global banks\
    \ for the same customers, the company appears well-positioned for financial growth\
    \ in the future, with a rising share price a near-certainty.\n\n### 3.5.8 Bit\
    \ Gold\n\n![](Images/image00208.jpeg)\n\nOne of the first attempts at developing\
    \ decentralized virtual money was Bit Gold, which was conceived by blockchain\
    \ pioneer Nick Szabo in 1998. Despite the fact that Szabo's bit-gold project was\
    \ never realized, it is widely considered as Satoshi Nakamoto's bitcoin protocol's\
    \ precursor. In fact, the bit-gold and bitcoin protocols are so similar that some\
    \ have suggested that Szabo is Satoshi Nakamoto, the anonymous bitcoin developer,\
    \ but Szabo has denied this. Bit gold achieves decentralization by combining cryptography\
    \ and mining techniques. These elements include time-stamped blocks that are maintained\
    \ in a title registry and created using proof-of-work (PoW) strings. According\
    \ to Szabo, he proposed a decentralized PoW function that could be \"securely\
    \ kept, transmitted, and assayed with minimum trust.\"\n\nUnderstanding Bit Gold\n\
    \nBitcoin and bit-gold have a lot in common, especially when it comes to the technologies\
    \ that process transactions and keep the decentralized network safe. A user will\
    \ have to employ processing power to solve a cryptographic challenge in the bit\
    \ gold structure. All solved puzzles are communicated across a Byzantine Fault\
    \ Tolerant (BFT) peer-to-peer network, and the problem solver's public key is\
    \ allocated to them. The details of the transaction are kept in a title register.\
    \ In the consensus system, it is analogous to a blockchain in that it offers an\
    \ immutable record of and order for transactions that have occurred). The bit\
    \ gold scheme proposed by Szabo is non-fungible. This implies that various quantities\
    \ of bit gold must be merged to produce a single transaction. Rather than a centralized\
    \ authority managing its levers, the bit gold relies on a decentralized and distributed\
    \ system of trust amongst the numerous nodes—or participating computers—that make\
    \ up its network.\n\nHow is Bit Gold different from Bitcoin? \n\nDespite the parallels\
    \ between bit-gold and bitcoin, the two initiatives have several fundamental distinctions.\
    \ According to Szabo, the difficulty of mining bit gold will alter over time.\
    \ It wouldn't inherently get easier or harder, but there would be peaks and troughs\
    \ in the quantity of bit gold that could be produced at certain periods. Bitcoin,\
    \ on the other hand, is designed to increase the difficulty of mining bitcoin\
    \ over time. (Bitcoins have a finite quantity as well.) More significantly, unlike\
    \ bitcoin, bit gold was never intended to be utilized as a medium of exchange.\
    \ Bit gold was designed as a reserve currency for a different sort of electronic\
    \ money. In the days before fiat money, bit gold was intended to serve as tangible\
    \ reserves.\n\nGoals of Bit Gold \n\nSzabo claims that bit gold was invented to\
    \ alleviate inefficiencies in the existing banking system. According to Szabo,\
    \ parties must invest a large level of confidence in order for transactions to\
    \ take effect in the traditional financial system. When customers and financial\
    \ institutions trade through trust-based systems, they are unfortunately prone\
    \ to fraud and theft. In reality, the banking system's history of repeated losses,\
    \ as well as the large cost of fraudulent activity and walled design, motivated\
    \ Szabo to propose bit gold, a more trustless approach for trading.\n\n### 3.5.9\
    \ E-Gold\n\n![](Images/image00209.jpeg)"
