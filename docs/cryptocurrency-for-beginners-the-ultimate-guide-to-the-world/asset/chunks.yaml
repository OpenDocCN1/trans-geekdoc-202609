    ### 3.5.2 SmartHive & SmartVoting


    ![](Images/image00203.jpeg)


    The SmartCash community says that a cryptocurrency with a "core" team is inefficient
    and corrupt in the long run. The fear is that the founders will place a higher
    priority on making money than creating an open and low-cost platform. With the
    rise of ICOs and increasing token allocations for founding teams, we''ve seen
    this play out. These central organizations can become bureaucratic, hard to react
    to, and prioritize conflicting goals. Conversely, SmartCash recommends a governance
    model based on the self-organization of ants and bees. The goal is to create a
    hive where people can work on specific projects in small groups. There''s a case
    to be made that this disjointed approach will end up being less efficient than
    the Foundation/core team approach it seeks to replace. Self-governing teams, on
    the other hand, are thought to be more agile and productive than guided development,
    according to the community. Voting rights will be granted to all SMART token holders.
    One token equals one vote. Anyone can submit proposals to the hive for evaluation
    and voting using this so-called SmartVoting system. The goal is to create a bottom-up
    management system in which projects are funded by the SmartHive fund. Moreover,
    the hive members are compensated for completing proposals. SmartHive is the project''s
    lifeblood, and it''s designed to keep the project running indefinitely. This structure
    has sparked grassroots support from a group of die-hard fans who are passionate
    about the project. Every block reward from SmartCash is used to fund future development
    projects. To date, the fund has amassed a value of more than $250 million.


    ### 3.5.3 Hive Structuring Teams


    ![Hive Teams - SmartCash The Business Focused Cryptocurrency](Images/image00204.jpeg)

    '
  trans: '

    加密货币基于一种名为区块链的分布式账本。理解区块链技术可以帮助你认识到它对数字货币的力量为何如此重要。所谓的“区块”是由加密数据块组成的。所谓的“链”指的是公共数据库，其中区块被按顺序存储并相互链接。区块链中的每个区块都有自己独特的代码，用于区分它与其他所有区块。这种唯一代码被称为哈希值。被添加到区块链的数据块是按时间顺序依次添加的。在最后一个区块创建后，会生成一个新区块，并为其分配自己的唯一哈希值。区块链中的账本和/或数据库在全球范围内同时分布，涉及成千上万台计算机，在以太坊和比特币的情况下，甚至达到数百万台计算机。假设有人想伪造链上的一块数据。在这种情况下，他们必须从某个时间点向前修改所有区块，并更新持有区块链账本副本的所有计算机。理论上这是可能的，但所需的金钱和影响力使得这几乎变得不可能。


    ### 3.3.3 加密货币交易保密


    传统的政府发行货币允许你进行私密交易，或使用实物现金在人前进行支付。纸币、金属币、布币以及塑料货币占流通中法币总量的很小一部分。大额现金取款会被中央机构（如政府或金融监管机构）迅速发现并调查。加密货币是一个独特的概念。要检测两个人或公司之间的交易，需要精心设计的数学方法，这大多在人们的背后进行。虽然交易账本或交易列表可以被全世界任何人查看，但进行加密货币交易的双方更加私密。加密货币按定义在数字钱包中以电子方式持有。拥有钱包私钥的所有者即为货币的所有者。货币主要在用户匿名的钱包之间以数字方式交换。


    ### 3.3.4 加密货币安全随时间与价值而增长


    黑客必须掌控“共识”网络中超过一半的计算机。所有接收区块链或分布式账本副本的计算机构成共识网络。对于比特币或以太坊等更成熟的加密货币，其网络规模庞大，几乎不可能发动攻击。因为加密货币网络在早期规模较小，所以获取多数控制更容易。


    ## 3.5 加密货币的历史


    自 2009 年比特币问世以来，加密货币领域全球范围内呈指数级增长。最初是一个未经验证的概念，如今被普遍视为货币的未来。数千种其他加密货币在比特币兴起之前及之后加入并随后失败。尽管比特币仍然是最受欢迎的加密货币，且大多数相似加密货币的非投机性影响微乎其微，投资者和消费者仍应留意其他加密货币。以下是当今最常见的加密货币列表。


    * `Smart cash`


    * `Follow`


    * `Digicash`


    * `B-Money`


    * `Paypal`


    * `BitGold`


    * `E-Gold`


    * `Hash-Cash`


    * `Ethereum`


    * `XRP`


    * `Tether`


    * `Bitcoin Cash`


    * `Litecoin`


    * `EOS`


    ### 3.5.1 Smart cash


    ![Welcome - SmartCash The Business Focused Cryptocurrency](img/image00202.jpeg)


    SmartCash 是一种基于零现金的、由社区驱动的加密货币。其愿景是实现商户采用，因此优先考虑隐私和快速交易。该项目的核心特点是反对中央权威，从而放弃了核心团队。该货币与
    Dash 类似，旨在通过快速、私密的货币获得广泛采用。由于使用主节点并依赖 Dash 基金会，Dash 被视为一种相对中心化的货币。基金会、核心团队和集中化矿工是
    SmartCash 希望规避的概念。相反，SmartCash 引入了多种去中心化治理和开发特性，并大力投资社区驱动的开发。因此，SmartCash 逐渐走红。虽然它不如
    Dash 知名，也不及 Zcash 和 Monero 等其他私密支付平台出名，但它为匿名、不可追踪且可用的加密货币提供了独特视角。传统加密货币（如比特币）仅激励矿工，忽视了其他贡献者（如开发者、推广者）。SmartCash
    是一个由社区驱动的加密货币，重视开发和社区。已将 29% 的区块奖励用于支持 SmartHive 社区提案及 Hive 团队。SmartMining 是 SmartCash
    的新功能，用于防止矿工攻击。任何拥有电脑和一台或多台显卡的人都可以参与矿工。Keccak 矿算法的 ASIC 尚未开发，预计很长时间内也不会出现。


    ### 3.5.2 SmartHive & SmartVoting


    ![](img/image00203.jpeg)


    SmartCash 社区认为，拥有“核心”团队的加密货币在长期来看是低效且腐败的。担忧是创始人会更关注赚钱，而非构建开放且低成本的平台。随着 ICO 的兴起以及创始团队的代币分配增加，这一现象屡见不鲜。这些集中化组织可能变得官僚化、反应迟钝，并优先考虑冲突的目标。相反，SmartCash
    主张基于蚂蚁和蜜蜂自我组织的治理模式。目标是创建一个小团体可开展特定项目的蜂巢，从而形成自下而上的管理体系。虽然这种分散的方式可能不如它试图取代的基金会/核心团队方法高效，但社区认为自治团队更具灵活性和生产力。投票权将授予所有
    SMART 代币持有者，一枚代币等于一票。任何人都可以通过所谓的 SmartVoting 系统提交提案供蜂巢评估和投票。目标是构建一种自下而上的管理体系，项目由
    SmartHive 基金资助，且蜂巢成员在完成提案后将获得报酬。SmartHive 是项目的生命线，设计用于确保项目永续运行。这一结构已获得一群热情的死忠粉丝的草根支持。每个区块奖励都用于资助未来的开发项目。截至目前，该基金已累计价值超过
    2.5 亿美元。


    ### 3.5.3 Hive Structuring Teams


    ![Hive Teams - SmartCash The Business Focused Cryptocurrency](img/image00204.jpeg)

