- raw: 'A team will take on a proposed project after the hive votes to endorse it.
    These teams are straightforward at first: development, outreach, and support.
    New teams form as the number of improvement proposals and the community grows.
    A team consists of up to eight people who work together as a small group. Aside
    from that, you''ll need to form a new project team. This is known as Hive Structuring
    Teams, and it divides the contributing community into smaller subgroups, with
    people joining and leaving teams as needed. So every team has its own budget and
    a team coordinator appointed by the community. The team is self-contained once
    it has been formed. Aside from a community-wide SmartVoting referendum, there
    is no control structure in place. The Hive Structuring Teams are a group of dedicated
    community members who work on the project on a daily basis. Individuals will be
    employed by the teams. If community members are unable to commit to joining a
    team, there will be less formal ways for them to contribute to the SmartHive.


    ### 3.5.4 Flooz


    ![](Images/image00205.gif)


    Flooz.com was a poster child for the late-nineties tech boom, which petered out
    by 2001. Flooz was compared to coupons or airline miles that could be accumulated
    through promotional campaigns or purchased directly from Flooz''s central platform
    as a digital tool for merchants accepting payment on the still relatively young
    Internet. Flooz raised up to $35 million in venture capital over the course of
    its three years in business, betting on merchant demand for new and exciting payment
    mechanisms. Flooz spent no money on its advertising campaign, even enlisting the
    help of comedienne Whoopi Goldberg for a series of TV commercials. Despite the
    momentum, Flooz reportedly ended in failure to attract a large number of users
    and merchants, and the company''s platform''s criminal activities would ultimately
    prove too much for it. By August 2001, the company''s demise had been hastened
    by rapidly declining investor support as well as allegations of criminal activity
    on its platform. According to a 2001 New York Times report, Russian criminal groups
    are suspected of using stolen credit cards to buy online currency and launder
    illicit funds, prompting a federal investigation. An approximate $300,000 was
    stolen, according to a Flooz source. Shortly after the fraud allegations surfaced,
    Flooz shut down after failing to find a buyer.


    ### 3.5.5 DigiCash


    ![How To Get Your DigiCash Card? - YouTube](Images/image00206.jpeg)


    DigiCash, a digital currency company founded in the 1990s, came close to becoming
    a global success. DigiCash, on the other hand, failed due to a combination of
    internal strife and a lack of ignition, which prevented it from becoming a widely
    used online payment system. David Chaum, the creator of the ecash system, is a
    pioneer in cryptographic protocols. DigiCash, which was formed in 1990, supported
    cyberbucks, a digital currency that provided anonymity to users and security to
    merchants who accepted it. Libertarians and others backed an international online
    currency that could transcend government control backed DigiCash, according to
    a 2003 report by The Guardian. DigiCash was notable for allowing a diverse range
    of payment sizes, particularly micropayments. For currency trading, the system
    used an email mailing system, and reports suggest that traders engaged in off-market
    transactions. According to reports from the time, a lack of cash flow, as well
    as friction between the company''s employees and leadership, were among the reasons
    for DigiCash''s demise. Despite promising high-level talks with major banks and
    credit cards, the venture was unable to secure a major deal that would ensure
    its survival in an increasingly digitized financial sector. Citibank, for example,
    has been in long-running talks about an integration project, but the bank has
    since shifted its focus to other ventures. Chaum left the company in 1996, and
    two years later, it filed for bankruptcy.


    ### 3.5.6 B-Money


    Wei Dai came up with B-money as an early proposal for an "anonymous, distributed
    electronic cash system." Satoshi Nakamoto made a reference to B-money when he
    created the world-famous Bitcoin. B-money was first offered in 1998 by Wei Dai,
    a graduate of Washington University. His plan was to create a free online financial
    system. So that no one can impose taxes or compel people to do anything, few people
    will remember B-Money, which was first introduced to the public in 1998, more
    than ten years before bitcoins. B-Money, on the other hand, is very different
    from bitcoins, despite the fact that the creator of the first, Wei Da (Wei Da),
    also wanted to create an unnamed and distributed method of issuing coins. Technical
    documents (link) (the so-called "white paper") containing the same basic principles
    as modern cryptocurrency were published to speed up the implementation of B-money.
    The "digital aliases" are expected to be able to send as well as receive money
    through a decentralized network, as well as ensure the execution of contracts
    between themselves without the involvement of a third party. The use of a proof
    of work function as a means of creating money is proposed in the first protocol.
    Dai''s B-Money was proposed in the context of cypherpunks mailing-list discussions
    about Hashcash, the first symmetric proof-of-work function, which was also printed
    on the same mailing list the previous year - in May 1997. (Bitcoin uses the hashcash
    cost function as the proof-of-work during coin minting, just like the B-money
    proposal.) Money is transferred in B-Money by transmitting the transaction to
    all participants, who all keep track of each other''s accounts. Contracts with
    the possibility of reparation in the event of default can be made with a third
    party agreeing to act as arbitrator. If no agreement is reached, each party broadcasts
    arguments or evidence in its favor, and each participant calculates the reparations/fines
    in his own account. The accounts can be kept only by a subset of participants,
    the "servers". These accounts are necessary to be published, and the participants
    who do exchanges verify their balances by asking a large number of them in the
    second protocol. The participants also make sure the money supply isn''t inflated.
    To become a server, you must post a bond, which is forfeited if the server is
    found to be dishonest. An alternative method of creating money is proposed, involving
    an auction in which participants bid on the solution of known-complexity computational
    problems. Regretfully, the B-Money project has remained stuck since the white
    paper was implemented.


    ### 3.5.7 Paypal


    ![Pakistan&#39;s finance secretary inquires &#39;Why doesn&#39;t PayPal work in
    Pakistan?&#39; - Economy.pk](Images/image00207.gif)


    PayPal (PYPL) is a true e-commerce behemoth with a bright future and a devoted
    user base that is expected to grow as more young people embrace the digital-payment
    platform. The company is profitable, with revenue exceeding $15 billion in 2018,
    and truly global in scope, with the platform supporting 100 currencies in over
    200 global markets. The conventional wisdom is that PayPal will continue to grow
    and dominate the digital payment space, despite increased competition for a share
    of the lucrative e-commerce payments market - one of the most lucrative in an
    expanding business and consumer technology market.


    The History of PayPal'
