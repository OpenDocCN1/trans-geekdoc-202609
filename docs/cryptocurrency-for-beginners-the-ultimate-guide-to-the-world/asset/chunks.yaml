  trans: '

    虽然 PayPal 的历史并不长，但在公司成立二十多年的历史中，仍经历了众多起伏和转折点。1998 年，当技术企业家 Peter Thiel 和 Max Levchin
    创立 PayPal 时，它甚至还不叫 PayPal，最初名为 Confinity，其理念是为消费者和企业提供低成本、几乎无需费力的数字支付。随着互联网在全球消费者中的影响力日益增强，公司明智地瞄准了未被满足的市场——银行和支付领域。创始人的概念简单而有效：通过说服客户在交换快速、低成本支付的前提下，分享他们的电子邮件地址、银行信息和信用卡号码。公司刚成立三年，便已处理了来自
    1020 万个人消费者和 260 万家庭客户的超过 30 亿美元的支付。随后，创始人决定专注于互联网上的支付，两年后将公司名称改为 PayPal。Thiel
    和 Levchin 巧妙利用了支付市场的一个空白——当时没有人专注于面向消费者和企业的数字支付平台，而这两人成功填补了这一空白，使 PayPal 在本世纪初迅速崛起。


    PayPal 时间线


    PayPal 的增长轨迹在早期就迅速加速，公司很快树立了一些令人印象深刻的增长基准。


    1998 年 8 月


    在斯坦福大学发表全球市场机遇演讲后，Peter Thiel 与 Max Levchin 相遇。他们在同年提出了数字钱包的概念。


    1998 年 12 月


    PayPal 成立。


    1999 年 10 月


    公司工程师生产了基于电子邮件的支付技术。


    2000 年 1 月


    PayPal 的创始人和管理层注意到，最终用户在向商业合作伙伴以及其他买家请求时，也希望签署 PayPal 以便加快支付速度。PayPal 迅速在 eBay
    站点上铺平道路，显著扩大了用户基数。


    2000 年 3 月


    PayPal 超过了一百万客户的目标。


    2001 年 6 月


    创始人将 Confinity 名称改为正式名称 PayPal。


    2002 年 2 月


    在发行新公司股票后，PayPal（PYPL-Nasdaq）上市。IPO 取得成功，股价在首日交易时上涨超过 50%，收盘价为每股 20 美元。


    2002 年 10 月


    在备受炒作的“数字竞 auction”与在线支付服务的“婚姻”之间，PayPal 被 eBay 以 15 亿美元的价格收购。


    2006 年 2 月


    PayPal 跨越一亿用户账户的里程碑。


    2006 年 4 月


    PayPal 推出 PayPal Mobile，这是一个新的移动支付平台，允许客户通过智能手机使用 PayPal 进行支付。


    2008 年 12 月


    PayPal 接近一亿用户账户的目标。


    2013 年 9 月


    PayPal 以 8 亿美元收购了 Braintree Systems，这是一家支付网关公司，也是 Venmo（在线支付竞争对手）的所有者。


    2015 年 7 月


    [Paypal buys Xoom](https://fortune.com/2015/07/01/paypal-acquires-money-transfer-firm-xoom-for-890-million/)，一家数字钱转公司，价格为
    8.9 亿美元。这使公司能够加速国际支付的处理。


    2017 年 2 月


    PayPal 推出其首个点对点支付系统，这帮助公司在新兴的 P2P 市场中立足。


    当前


    公司开始深入探索有利但波动性大的加密货币市场，专注于其底层区块链平台，暂时避免比特币。此外，公司正通过招聘 1,200 名新的技术专家，在印度——一个关键全球市场——专注于移动及其他新兴支付技术。公司还宣布与
    Facebook（FB）合作，Get Facebook, Inc. Class A Report Marketplace，官员们相信该合作有潜力在财务表现上超越其长期合作伙伴
    eBay。


    总体而言，投资者和分析人员视 PayPal 为数字支付领域的领先参与者，尽管它面临着金融科技公司和大型全球银行的激烈竞争，但公司似乎已为未来的财务增长做好准备，股价持续上涨几乎是必然的。


    ### 3.5.8 Bit Gold


    ![](img/image00208.jpeg)


    比特金（Bit Gold）是区块链先驱 Nick Szabo 在 1998 年构思的去中心化虚拟货币的早期尝试之一，尽管 Szabo 的比特金项目从未实现，但它被普遍认为是
    Satoshi Nakamoto 比特币协议的前身。事实上，比特金与比特币的协议相似到如此程度，甚至有人推测 Szabo 就是神秘的比特币开发者 Satoshi
    Nakamoto，但 Szabo 已否认了这一指控。比特金通过结合密码学和矿工技术实现去中心化。其包括时间戳区块（在标题登记册中维护）以及使用工作量证明（PoW）字符串创建的元素。Szabo
    表示，他提出了一种去中心化的 PoW 函数，能够“以最小信任的方式安全存储、传输和验证”。


    #### 理解比特金


    比特币和比特金在处理交易的技术以及保护去中心化网络方面有很多共同点。用户需要消耗计算能力来解决比特金结构中的密码学挑战。所有已解谜的结果会在拜占庭容错（BFT）对等网络中通信，且解题者的公钥被分配给其。交易细节保存在标题登记册中。在共识系统中，它类似于区块链，提供了不可篡改的交易记录及其顺序。Szabo
    提出的比特金方案是非同质化的，这意味着必须合并多个比特金数量才能生成单个交易。它不依赖于中心化机构管理其杠杆，而是依靠网络中众多节点（参与计算的计算机）之间的去中心化、分布式信任。


    #### 比特金与比特币的区别


    尽管比特金与比特币之间存在相似之处，但两者在根本上有几个显著区别。Szabo 表示，比特金的矿工难度会随时间变化，不会单纯变得更易或更难，而是在特定时期会出现产出峰值和低谷。相比之下，比特币的设计是让矿工难度随时间逐渐增加（比特币数量有限）。更重要的区别在于，比特金从未打算作为流通媒介使用；它被设计为另一种电子货币的准备金。在法币出现之前，比特金本应作为实物储备使用。


    #### 比特金的目标


    Szabo 声称比特金的发明旨在缓解传统银行系统的低效。根据 Szabo，传统金融体系在交易生效前必须建立高度信任，而这种信任体系容易受到欺诈和盗窃的侵害。当客户与金融机构通过基于信任的系统进行交易时，往往面临欺诈和盗窃风险。实际的银行系统历史上屡次出现损失，且欺诈成本高昂，这种“封闭”设计激励
    Szabo 提出比特金——一种更少依赖信任的交易方式。


