  trans: "\nDr. Douglas Jackson 和 Barry K. Downey 于 1996 年创立了 E-gold，作为一种私人数字货币，允许其网站成员使用现代技术即时转移黄金。E-gold\
    \ 与之前的联邦货币替代方案不同，其本质上完全是数字化的，交易完全不可逆。尽管该网站很可能最初是出于良好的意图而建立，但它很快便沦为犯罪分子的聚集地。洗钱者、身份窃贼、欺诈性“金融”投资者以及购买儿童色情制品的人都使用了\
    \ E-gold，因为黄金转账是不可逆的。此外，E-gold 交易的不可逆性意味着如果账户被入侵，受害者没有任何补救办法。E-corporate gold\
    \ 的治理在 2006 年意识到该网站正被用于重大非法活动，并开始封锁账户。“E-gold 合法运营，但不容许任何人试图利用 E-gold 进行犯罪活动，”CEO\
    \ 兼创始人 Douglas Jackson 在一份声明中表示。E-gold 与美国及全球的执法机构有着长期的合作历史，在收到合法请求时提供数据和调查支持。2007\
    \ 年，美国政府下令 E-gold 封锁多个提供类似 E-gold 服务的账户，随后因多项刑事罪名对 E-gold 提起起诉。反对 E-gold 的主要论点是，它未能实施机制防止欺诈用户仅通过创建新账户并转移其\
    \ E-gold 来逃避监管。E-gold 也是一家未经许可的货币传输业务，尽管它实际上并未转移真实货币。在美国，货币传输业务必须依法获得牌照，并保存用户的特定法律信息。因此，e-creators\
    \ golds 被判类似的罪名，包括共谋。然而，对公司及其治理的法律后果微乎其微，E-gold 与联邦政府达成协议，允许合法用户从账户中提取资金，类似于在线扑克玩家的操作方式。E-gold\
    \ 至今仍在运营，但已不再接受新账户或用户之间的 E-gold 转账。\n\n### 3.5.10 Hash-Cash\n\n![](img/image00210.jpeg)\n\
    \nHash-cash 是数字货币的前身。它是 Satoshi 启发比特币工作量证明（proof-of-work）实现的灵感来源。为了理解比特币的共识机制和工作量证明，我们必须先掌握\
    \ Hash-cash。Adam Back 在 1997 年创建了 Hash-cash，目的是防止电子邮件垃圾邮件。即使在 1997 年，电子邮件垃圾邮件也困扰着所有拥有电子邮件账户的人。这是因为基本问题在于，发送一封邮件只需向邮件服务器发送少量数据包。为了让发送者付费，Back\
    \ 决定对电子邮件收费。发送电子邮件的成本极低，几乎是免费的。虽然诚实用户每天只发送少量邮件，但垃圾邮件发送者可以毫不成本地发送数百万甚至数亿封邮件。如果每封邮件收费一分钱，这对普通用户来说微不足道，但对垃圾邮件发送者来说，费用将高达数百万美元，从而有效遏制垃圾邮件活动。你会发现这似乎有些反直觉：每封邮件收取一分钱的前提是必须拥有数字硬币来支付。但当时缺乏这种解决方案，因此才需要比特币。那么，Hashcash\
    \ 如何让垃圾邮件发送者支付“虚拟硬币”呢？答案在于 Hashcash 的核心概念——工作量证明（proof-of-work），这一概念如今也已融入比特币。\n\
    \nHashcash 的工作量证明\n\nHashcash 的工作量证明非常直接。邮件服务器首先设定一个难度级别，这是一个数值，表示工作量证明（PoW）需要达到的难度。默认值为二十。在\
    \ Hashcash 中，工作量证明是生成一条消息，其 SHA-1 哈希值在二进制中以 20 个 0 开头。如何生成带有指定前缀的哈希值？请记住，你不能比随机猜测更准确地预测加密散列函数的输出。你别无选择，只能不断尝试不同的输入，直到找到满足前缀条件的输入。\n\
    \n### 3.5.11 Ethereum\n\n![Cryptocurrency prices today: Bitcoin gains over 4%,\
    \ Ethereum surges more than 8% - Times of India](img/image00211.jpeg)\n\nEthereum\
    \ 是一个共享的开源区块链框架，拥有自己的加密货币 Ether。它作为许多其他加密货币以及去中心化智能合约的论坛，充当了核心作用。2013 年 Vitalik\
    \ Buterin 的白皮书首次描述了 Ethereum。2014 年夏季，Buterin 获得了其他联合创始人的支持，并在公开的线上众筹活动中正式启动，正式发布时间为\
    \ 2015 年 7 月 30 日。Ethereum 本身预计将成为面向开放应用的数字论坛，使用户能够在全球范围内编写和管理具有抗审查性、抗停机和抗欺诈的应用程序。\n\
    \nEthereum 的历史\n\nEthereum 拥有八位联合创始人，这个数字对加密货币项目来说相当庞大。他们最初于 2014 年 6 月 7 日在瑞士苏黎世首次会面。\n\
    \n-   俄罗斯-加拿大裔 Vitalik Buterin 于 2013 年撰写了最初的白皮书，首次提出了 Ethereum 的概念，并至今仍在持续开发该网络。在\
    \ ETH 之前，他还创立并为比特币杂志（Bitcoin Magazine）撰写文章。\n\n-   英国程序员 Gavin Wood 可能是继 Buterin\
    \ 之后对 ETH 影响最大的联合创始人。\n\n-   其余 Ethereum 联合创始人包括：\n\n    -   Anthony Di Iorio，他在项目早期阶段为其提供了资金支持。\n\
    \n    -   Charles Hoskinson，他在创建以瑞士为基地的 Ethereum 基金会及其法律结构方面发挥了主要作用。\n\n    -\
    \   Mihai Alise，他协助创建了 Ethereum 基金会。\n\n    -   Joseph Lubin，一位加拿大企业家，他在 Ethereum\
    \ 初期为其融资。\n\n    -   Amir Chetrit，他帮助创立了 Ethereum，但早期便离开开发。\n\nEthereum 独特性的原因\n\
    \nEthereum 首创了区块链智能合约网络的概念。智能合约是能够自动在互联网上执行多方协议所需操作的计算系统。它们的设计旨在降低中介的信任需求，从而降低交易成本并提高交易效率。Ethereum\
    \ 的核心突破在于构建了一个全球统一的机器，能够利用区块链运行智能合约，进一步强化了智能合约技术的既有优势。Ethereum 的区块链被设计为一种面向全球的单一机器。除了多种智能合约外，Ethereum\
    \ 区块链还能托管其他加密货币，统称为“代币”。实际上，这已是 ETH 平台迄今为止最常见的使用方式。\n\n在哪里可以购买 Ethereum（ETH）？\n\
    \n由于 Ethereum 是继比特币之后第二大加密货币，ETH 交易对几乎在所有主要交易所上都有提及。主要市场包括：\n\n*   [Binance](https://coinmarketcap.com/exchanges/binance/)\n\
    \n*   [Coinbase Pro](https://coinmarketcap.com/exchanges/coinbase-pro/)\n\n* \
    \  [OKEx](https://coinmarketcap.com/exchanges/okex/)\n\n*   [Kraken](https://coinmarketcap.com/exchanges/kraken/)\n\
    \n*   [Huobi Global](https://coinmarketcap.com/exchanges/huobi-global/)\n\nEthereum\
    \ 生态系统\n"
