  trans: "\n你可以通过用比特币兑换礼品卡来规避现有限制，直到加密货币获得更广泛的认可。例如，你可以在 eGifter 网站上使用比特币购买 Dunkin、Target、Itunes\
    \ 等企业和餐厅的礼品券。在进行购买时，你可能需要将比特币加载到一张借记卡上。Payment method card 是一种借记卡，它能将数字货币转换为现金用于消费，目前在美国有提供。但使用该卡和进行现金提现会产生相应的费用。\n\
    \n加密货币可能会取代股票和债券作为投资工具。最著名的加密货币比特币是一种安全、去中心化的货币，已发展成为与黄金相当的价值储存手段，甚至被称为“数字黄金”。\n\
    \n1.4 什么是密码学？\n\n密码学是通过使用加密和解密技术，在面对恶意第三方（即试图窃取你的信息或窃听你对话的第三方）的情况下保护通信的手段。密码学所采用的计算算法包括\
    \ SHA-256（比特币所使用的哈希方法）、公钥（类似于用户的公开信息，可供所有人共享）以及私钥（类似于用户的电子签名，需保持私密）。\n\n比特币交易与密码学\n\
    \n一次典型的比特币交易通常包括你想转账给谁以及要发送多少比特币。随后，该数据会通过哈希方法进行处理。比特币使用 SHA-256 算法，如前所述。输出随后使用用户的私钥进行签名，从而唯一标识用户。经加密签名的输出随后在网络中由其他用户进行验证。使用发送者的公钥即可完成此验证。\n\
    \n矿工是检查交易真实性的用户。该交易连同其他许多交易一起上传到网络中，数据随后无法被修改。\n\n1.5 以太坊 vs. 比特币\n\n你现在已经明白，比特币是一种基于区块链技术的去中心化数字货币，通过端到端网络进行交易。以太坊网络接受以太币（Ether），这是另一种重要的数字货币。以太坊网络是一个用于构建和部署基于区块链技术的去中心化应用的可访问平台。\n\
    \n**差异**\n\n比特币是一种数字货币，可用于向他人转账，其运作方式与现实中的现金非常相似。在以太坊平台上，以太币作为货币使用，同时也可用于现实世界的交易。比特币交易是机械执行的，意味着你需要在需要时自行完成交易。而以太币的交易可以手动或自动进行——它们是程序化的，仅在满足特定条件时才会发生。比特币交易大约需要\
    \ 10 分钟完成，这相当于数字化签署一块砖块的时间；而以太币交易大约只需 20 秒即可完成。\n\n可存在的比特币数量上限为 2100 万枚，预计到 2140\
    \ 年将达到此数量。以太币预计将长期存在，且上限为 1 亿枚。比特币用于商品或服务的交换，而以太币利用区块链技术在满足特定条件时触发交易。最终，比特币使用\
    \ SHA-256 算法，而以太坊使用 ethash 方法。自 2020 年 5 月起，1 比特币价值为 8741.81 美元，而 1 以太币价值为 190.00\
    \ 美元。\n\n**相似之处**\n\n目前，比特币和以太坊是最受欢迎且价值最高的加密货币。两者都采用区块链技术，在区块这个容器中记录事件，并形成不可篡改的区块链。钱币通过工作量证明（proof\
    \ of work）机制进行挖矿，即在将区块添加到网络前解决数学难题。最后，比特币和以太币（Ether）都在全球广泛使用。\n\n1.6 加密货币的未来\n\
    \n在加密货币领域，世界明显分裂为两派。一方面，比尔·盖茨、阿尔·戈尔、拉塞尔·布兰德等支持者认为加密货币优于传统货币。另一方面，反对者包括沃伦·盖茨、保罗·克鲁曼和斯蒂文·舒勒等。克鲁曼和舒勒均为诺贝尔经济学奖得主，他们认为加密货币是一场庞氏骗局，并是犯罪活动的工具。\n\
    \n未来将出现监管与匿名性的冲突。由于部分加密货币与恐怖主义活动有关，政府可能希望对其运作进行控制。但加密货币本身高度重视用户匿名性。\n\n据预测，加密货币到\
    \ 2030 年将占全国货币的 25%，意味着全球将有大量人群开始将比特币视为交易手段。它将逐渐被商家和消费者所熟知，并保持其波动性，意味着价格预计像近年来一样会随时间变化。\n\
    \n1.7 区块链\n\n区块链技术是一种以难以篡改、黑客攻击或欺诈的方式存储数据的方法。区块链是一个交易的数字日志，该日志在区块链的完整计算机网络中被复制并分发。每个区块包含若干笔交易，每当在数据库中发生新操作时，该事件会记录到每个参与者的账本中。\n\
    \n![Will 2020 Be The Year Cryptocurrency And Blockchain Becomes Operational?](img/image00180.jpeg)分布式账本是由多方管理的去中心化数据库。区块链是一种分布式账本技术，信息通过哈希（即不可更改的电子签名）进行记录。\n\
    \n**分布式账本技术的属性**\n\n- **Secure（安全）**  \n  每条记录单独加密。\n\n- **Immutable（不可变）**  \n\
    \  经验证的记录一旦确认，即不可撤销且无法修改。\n\n- **Programmable（可编程）**  \n  区块链可编程（如智能合约等）。\n\n\
    - **Unanimous（一致）**  \n  每条记录的合法性需经所有网络参与者一致认可。\n\n- **Anonymous（匿名）**  \n  参与者的身份为匿名或伪名。\n\
    \n- **Timestamped（带时间戳）**  \n  每个区块包含交易的时间戳。\n\n- **Distributed（分布式）**  \n  为实现全透明，所有网络成员共享同一账本。\n\
    \n这意味着，如果链中任何一个区块被修改，将立即显示链已被篡改。黑客若想破坏区块链系统，必须修改链中所有区块在所有分布式副本上的对应区块。\n\n随着新区块不断添加到区块链，像加密货币等区块链持续扩展，账本的完整性得到显著提升。\n\
    \n**区块链技术的热度**\n\n过去，人们曾多次尝试创建数字货币，但均未成功。\n\n最迫切的问题是信任问题：如何相信如果有人发明新货币 X 美元，他不会为自己发放一百万美元或窃取你的\
    \ X 美元？\n\n比特币通过区块链解决了这一问题——区块链是一种数据库形式。传统数据库（如 SQL 数据库）由掌控大部分数据的个人或机构管理，可随意修改数据。而区块链独特之处在于没有中心控制者，而是由使用它的个人共同运行。比特币无法被伪造、黑客攻击或双重消费，因此持有者可以确信其价值。\n\
    \n"
