  trans: '

    与基于商品的货币不同，如黄金、铜和银等，法定货币最显著的特点是其价值的稳定性。随着政府和银行介入以保护其经济免受经济周期的常规波动影响，法定货币在 20 世纪广泛使用。由于每日市场波动和偶尔的衰退，基于商品的货币变得波动性很大。中央银行在需要时会印刷或保留纸币，从而获得对资金流动、利率和流动性的更大控制权。例如，联邦储备系统对货币供需的管理帮助其应对
    2008 年全球金融危机，通过对美国金融体系和全球经济造成更大损害来应对。全球金融危机表明，尽管法定货币被视为一种更具韧性的货币，能够在衰退期间提供缓冲，但货币供应受联邦储备系统调控，这仍不足以阻止危机的爆发。黄金的供应受限，使其比供应无限的法定货币更稳定。


    ## 2.3 测量货币


    但到底有多少货币在流通，以及它以何种形式存在，这是经济学家和投资者用来判断通胀或通缩是否存在的问题。为了便于测量，货币被划分为三类。通过将下面三类加在一起，我们得到一个国家的货币供应量或一个经济体内的总货币量。


    *   第一类货币-M1


    *   第二类货币-M2


    *   第三类货币-M3


    ### 2.3.1 货币的起源


    关于货币起源，有三种主要理论：


    货币是为了交易目的而创造的


    为了交易，大多数经济学家认为货币之所以出现，是因为它比以物易货更具灵活性。这意味着货币本身是一种有价值的资产，如古代文明中的牲畜，后来按重量计量的金银，最终是金银硬币。如果不了解这是对金属货币根源的解释，否则牲畜就不符合这种定义。此外，金属货币的出现应伴随高度的增长，这意味着承认私有财产而非部落财产，暗示对合同的承认和法律结构的遵守。同时，牲畜更容易被视为货币，因为原始文化可以轻易赋予价值，而无需法律结构。


    货币是为了社会目的而创造的


    第二种理论认为，为了社会原因，货币被创造，例如新娘价格或为部落中被另一族杀害或伤害的人支付的赎金。


    货币是为了宗教目的而创造的


    第三种理论认为，货币是为了宗教目的而创造的。在其著作《神圣黄金》中，Bernard Lam 指出，货币的根源在于东方的寺庙。它被用作向神明的强制性祭品，以及祭司的报酬。


    黄金的货币化


    公元前 1500 年和 1000 年，以重量计量的交换媒介从牲畜标准转变为金。在将金转化为货币的过程中，寺庙发挥了重要作用。多年来，金银在寺庙中积累。为了装饰用途，需要大量金银。寺庙大量收集金银的事实很可能是决定将其货币化的关键因素。理论认为，祭司们希望通过货币化消耗部分过剩的金银，例如他们可能估算一头牛价值
    130 克金。祭司们因提供诸如指导种植作物等服务而被支付，并制定了这些服务的固定费用。祭司们通过任意决定计算金的价值的理论与货币起源的交易理论相矛盾，这表明金的价值是由开采和铸造金的工作量决定的，而非任意赋值。


    历史上的货币


    基于这三种假设，可以想象在古代爱尔兰和希腊，牛是常见的货币单位。在那个时代，一名奴役的少女在两个古代文明中价值 3-4 头牛。人们很容易给一头牛定价：它的年龄、可能生的小牛数量、可能产的牛奶量、皮和肉的价值、粪便的价值、血统等。但如何给
    130 粒金子定价，这似乎是古代时期金币的正常重量？祭司拥有公众的权威，且拥有大量金银，他们计算服务费用，并在货币化金银时可以将其价值与货币的正常计价单位——牛——进行比较。西方社会关于货币起源的假设中，更合理的解释是货币是为了宗教目的而产生的。祭司通过法令赋予货币价值。因此，以重量计的金或银是第一种法定货币形式，它既具有支付手段的功能，也兼具商品属性。


    亚里士多德，希腊哲学家（公元前 384 年–公元前 322 年）


    显然，亚里士多德在公元前 4 世纪已经抓住了资本的本质，距今将近 2500 年。货币不是资产，像黄金或银一样，它不能被开采。像小麦或大麦一样，货币也不是可以收割的农作物。货币也不是牛或山羊等动物。货币的本质在于它是一种法律的发明。货币是法律的产物。希腊语中“货币”一词是“nomisma”，意为法律或约束性传统。亚里士多德将货币描述为一种抽象的法律力量，为了公共利益，它被公开监管。


    货币是政府的第四支柱


    政治科学中提到的三个政府分支是：行政、立法和司法。Stephen Zarlenga 在《被遗忘的金融科学》中强有力且有说服力地主张，还有一个被称为“货币权力”的第四支柱。货币权力是任何国家发行货币的权威。该术语由马丁·范·布鲁恩（第
    8 任美国总统，1782–1862）创造。Stephen Zarlenga 强调“货币力量”是所有政府分支中最强大的，并为货币改革作出了最大贡献。其不为人知的事实导致了社会的显著扭曲和腐败。


    ## 2.4 新型货币


    近年来，人们尝试建立新型货币，这些货币不受银行或政府的监管。然而，它们应具备与传统货币相同的特征，如稀缺但易于携带和转移，依此类推。加密货币，也称为数字货币，满足所有这些条件。比特币是一种基于区块链技术的加密货币，交易由一群人而非单个个体进行验证。比特币等加密货币的缺点是货币控制再次集中在少数个人手中。因此，去中心化的目标尚未完全实现。


    总结

    '
