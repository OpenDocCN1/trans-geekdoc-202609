  trans: '

    N.E.O. 是 2018 年表现不佳的加密货币资产之一，其价格在 9 月和 10 月大幅下跌。然而，由于其在中国的良好位置，它仍值得作为一种投资工具考虑。得益于其快速的交易和来自中国政府的支持，N.E.O.
    正在吸引更多的机构投资者。当加密货币市场开始波动时，我们不会感到惊讶，因为 N.E.O. 在这几个月里已经是表现最好的资产。


    3.4 最佳加密货币投资


    随着越来越多的投资者将加密货币视为他们投资组合的理想补充，加密货币的全球知名度正在持续提升。在 2017 年和 2018 年 I.C.O. 陷入困境后，导致采用者恐慌，近期动力重新燃起，得益于两种新工具的推出：NFTs
    和 DeFi。加密货币种类繁多，从比特币到狗狗币和泰泰币不等，初入加密世界的新手感到困惑。以下是按市值排序的前十大比特币，帮助您理清思路。随着前进，还有许多可能带来丰厚回报的机会。


    比特币


    比特币是市场规模最大的加密货币，也是最成熟的价值存储工具，是每位加密投资者的必备资产。比特币于 1 月 3 日庆祝其 13 周岁生日，市值约为 9000 亿美元。它是唯一拥有美国市场基金跟踪其波动的数字货币，并占据加密货币总市场约
    40%。BTC 是其类别中最成熟的加密货币，是加密货币新手的强制性投资。特斯拉和 MicroStrategy 等公司在其资产负债表上持有 BTC。比特币是最知名的加密货币，自
    2009 年创立以来已进入第 13 年。


    比特币是按市值计算全球最值钱的加密货币，交易使用基于区块链的解决方案，该区块链是去中心化数据库，记录全球超过 15000 台计算机上的交易和余额。


    比特币凭借其韧性和长期信誉，可能在 2022 年成为热门投资。


    Solana


    与比特币不同，Solana 解决了以太坊巨大的交易成本问题。由于以太坊的“燃料费用”，即使是小额交易也变得经济上不可行；而 Solana 的费用仅为以太坊费用的极小部分。Solana
    与以太坊一样，旨在成为去中心化金融（DeFi）的顶级平台，消除对金融中介和传统金融机构（如银行、经纪商、集中化交易所等）的需求。Solana 于 2020
    年推出，市值占比 modest 但正在增长，其代币价值从 2021 年初的 1.51 美元上涨至同年末的 160 美元。


    以太坊


    尽管以太坊的市值低于比特币，但它占据全球市场约 20%，在影响力上可能正逼近比特币。原因在于它不仅是价值存储，还提供其他功能，且全球最广泛使用的区块链。以太坊的原生代币
    Ether（ETH）是优质加密货币选择，因为它支持智能合约、非同质化代币（NFT）及其他加密货币。当它从工作证明转向权益证明协议时，ETH 将比比特币更节能，消除验证区块链所需的高能耗计算操作。


    狗狗币（DOGE）


    狗狗币以其作为笑话代币的起源而闻名，但这并不妨碍它在加密世界中获得认可。狗狗币和柴犬币（Chia Inu）均位列全球估值前 15 名。其投资吸引力的主要原因是埃隆·马斯克（Elon
    Musk）是其拥护者，而非仅仅是讽刺者——他在 2021 年狗狗币狂飙期间曾被传言支持，且在与 Lex Fridman 的早期播客中明确表达立场。鉴于其在加密圈的影响力，狗狗币尚未出现显著涨价尚属意外。若主流媒体效仿马斯克的热情，或该“
    erratic billionaire” 公开再次表达对该货币的喜爱，狗狗币可能出现短期涨幅。


    Polkadot


    ![Winning Parachains Begin Producing Blocks on Polkadot | Bitcoinist.com](img/image00192.jpeg)在让开发者构建智能合约和应用方面，Polkadot
    与以太坊极为相似，并有望在未来一年显著提升功能性。


    Polygon


    Helix 在过去一年飙升约 100 倍。M.A.T.I.C. 市值为 170 亿美元，位列前 15 名，自 2022 年初起仍是优质加密货币选择之一。Polygon
    致力于实现与 Yearn. Finance 类似的广泛采用，但方式不同：通过构建更具可扩展性的区块链。其技术旨在扩展以太坊，并允许理论上无限数量的去中心化应用（dApps）在其上运行。约
    72% 的 Polygon 总供应量（十亿枚代币）已流通。


    Yearn. finance（Y.F.I.）


    Yearn. Finance（简称 Y.F.I.）是近期备受关注的代币，市值达数十亿美元，价格在最近一年波动范围在 18,566 至 93,435 美元之间。它是按市值第
    80 大的加密货币，当前价格超过 38,000 美元。其目标是通过最优收益挖矿，向非技术性创业者和用户开放 Ciency（可能是指金融）领域。


    去中心化金融（DeFi）


    Yearn. Finance 承诺更快速为用户提供服务，其前景令人期待。整个行业必将随时间增长，但该领域仍技术性较强，像 Yearn. Finance 这类帮助用户更易上手的工具必将拥有光明未来。短期内，Y.F.I.
    在 12 月和 1 月的表现优于多数加密货币，涨幅超过 20%，而其他多数在此期间大幅下跌。


    Binance Coin


    由于处理纳斯达克加密资产更快更便宜，市场活动将进一步增多，进而影响交易价格；全球最大交易所的原生代币可能在 2022 年出现显著增长。


    Cardano（A.D.A.）


    Cardano 以其最早采用权益证明验证机制而闻名，与比特币等需要竞争性解题的系统不同，该方案通过消除交易验证中的竞争性计算，降低交易时间、能耗及环境影响。Cardano
    与以太坊类似，使用其原生代币 A.D.A. 实现智能合约和去中心化应用。


    与其他主要加密货币相比，Cardano 的 A.D.A. 代币增长较为缓慢。2017 年 A.D.A. 价格为 0.02 美元，截至 2022 年 1 月
    3 日，当前价格为 1.34 美元，涨幅达 6600%。


    Tether（U.S.D.T.）


