  trans: "\n即使在当下，也没有人明确知道 Satoshi 是谁或曾是谁。除了讨论、猜测和——可能不可避免的——阴谋理论之外，这一问题还伴随着大量的猜测和阴谋理论。阴谋理论层出不穷，从比特币是埃隆·马斯克（Elon\
    \ Musk）的作品，或是谷歌（Alphabet）或诸如安全机构等情报组织的一个高度隐蔽的高级项目，到比特币本身就是一个“灰色工程项目”（skunk work）不等。还有人说它是一个“后门项目”（trapdoor\
    \ project），当它规模足够大时，会被一直暗中等待超过十年的恶意集团接管。\n\n比特币的价值更本质性，而非其价格历史。正如一位作者所说：“有两种长期争议的观点得到证据支持：第一，货币是一种像其他商品一样的产品；第二，金钱可能是市场过程的副产品（并且）‘金钱真正不是金钱，直到它被认可为税收支付’这一概念已被加密货币——尤其是比特币——基本上根本消除了，尽管它正在不断发展为存储价值和计价单位的角色。”\
    \ \n\n**Bitcoin Tomorrow（比特币明日）**\n\n那么，比特币的未来会怎样呢？答案不确定，但 Furo 认为它将是一个“明亮而充满活力”的地方。“创新、成本效益和透明的投资工具即将面世，将使比特币投资变得更加普及，”他强调。这种获取渠道的水平可与传统市场相比肩。请记住，任何投资——尤其是前沿投资——都不无风险。从比特币的历史可以看出，一旦上涨，它同样可能下跌，甚至下跌得很快。\n\
    \n**比特币的优缺点**\n\n在当今时代，无论你在经济谱系中处于何种位置——是偏好实物现金的传统主义者，还是投资狂热者——你几乎肯定已经听说过加密货币，甚至可能了解到它们的一些利弊。加密货币在近年来的\
    \ popularity 增长迅猛，截至 2021 年 3 月，美国约有 14% 的人口持有某种形式的比特币。此外，美国约有 4600 万人拥有比特币。\n\
    \n比特币是最知名且使用最广泛的加密货币，也是新手可以尝试进入加密货币投资的起点。因此，如果你在想“比特币值得投资吗？”或“比特币是否是个好投资？”，了解比特币的优缺点将帮助你做出更明智的决定。\n\
    \n**比特币的优势**\n\n尽管比特币于 2009 年推出，它仍被视为一种新型货币，且充斥着许多误解。了解比特币的优势将帮助你判断它是否适合你的投资组合。\n\
    \n**用户匿名性与透明性**\n\n比特币用户通过数字标识符和公钥进行识别，虽然并非完全匿名，但这消除了公开监控，使得交易难以追溯到个人。尽管交易始终公开可见，提供了透明度，区块链技术确保其防欺诈。此外，作为账户持有者，你唯一知道自己拥有多少比特币。\n\
    \n即使私钥钱包地址公开，你也可以创建新钱包以获得更高的保护和匿名性。与传统金融系统不同，传统系统中私人信息可能会从银行泄露，而比特币交易无需额外个人信息，从而提升用户隐私。\n\
    \n**可及性与流动性**\n\n加密货币（比特币亦然）的一个吸引人的特点是几乎没有边界。比特币具有高度可及和适应性的优势。发送比特币到其他用户只需几分钟，可用于购买越来越多接受它的商家和服务。这使得跨境支付和货币兑换变得轻松，并且费用低或几乎为零。比特币随时可以出售。\n\
    \n**独立于中央当局**\n\n比特币是一种去中心化货币，意味着它不受任何单一国家央行的控制。因此，你的比特币不易被冻结或被当局要求交出。此外，比特币没有实际可行的税收方式。由于价格不受政府政策影响，这在理论上为人们提供了对金钱的独立与自由。总体而言，加密货币用户认为这是比特币最重要的优势之一。\n\
    \n**比特币的缺点**\n\n尽管比特币发展迅速且用户数量不断增加，但仍有若干缺点需要注意，尤其是如果你在考虑是否投资加密货币时。正如许多金融决策一样，拥有更多信息有助于你做出更明智的判断，决定比特币是否值得投资。\n\
    \n**无政府监管**\n\n虽然去中心化是加密货币的优势，但它也可以被视为比特币的缺点，因为它意味着比特币投资缺乏监管。与受央行控制的货币不同，比特币缺乏法律保护，且往往不可逆，使其易受欺诈。\n\
    \n比特币去中心化的另一个缺点是没有保证最低价值。如果大量投资者决定停止使用比特币进行交易，其价值可能暴跌，严重影响持有大量比特币的用户。\n\n**波动性**\n\
    \n比特币的供应上限为 2100 万枚，这是由 Satoshi Nakamoto 设定的，因此有人认为比特币极为稀缺。Satoshi Nakamoto 是比特币的创建者，这既使比特币珍贵，也导致其价值波动，因为价格是唯一能够保证需求的参数。\n\
    \n此外，还有其他因素影响比特币的波动性，如引发投资者负面情绪的头条新闻、对加密货币未来价值和用途的不确定性，以及数据安全泄露。\n\n**不可逆性**\n\
    \n另一个缺点是安全性不足，比特币交易匿名且未受监管。由于比特币交易不可逆且最终确定，一旦发送错误金额或凭证，便无法更改。\n\n此外，还有资金损失的风险。许多比特币用户选择将资金存储在加密货币中，如果私钥丢失，资产将面临风险。硬盘损坏、恶意软件污染数据或钱包，或仅仅几分钟内，你的资金可能全部消失。\n\
    \n**第 2 章：如何投资加密货币和替代币**\n\n任何非比特币的加密货币都称为替代币（altcoin）。替代币是指除比特币之外的加密货币或代币，例如\
    \ Solana、Cardano、Polkadot 和 Uniswap。由于比特币是全球最知名且最成熟的加密货币，一些人称其为“主加密货币”。比特币拥有最大的市值，即已发行的加密货币实际数量相对于其他加密货币的总量。然而，全球已有数千种不同的加密货币，每种都有其价值和用途。继续阅读，了解更多关于加密货币的信息，包括如何购买以及它们是否逻辑上符合你的虚拟货币组合。\
    \ \n"
