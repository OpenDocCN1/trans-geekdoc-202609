    to develop digital money previously, and all had failed until the creation of
    bitcoin in 2008.


    What’s special about bitcoin? 


    Bitcoin is dispersed throughout a network of computers rather than a centralized
    set of servers like those used by conventional institutions. All activities are
    processed on a permission less blockchain known as "blockchain," which is essentially
    a long list that can never be modified. While bitcoin has made a name for itself
    as a digital currency, many crypto initiatives are using blockchain technology
    to disrupt existing sectors in various ways, from social networking to file storage.
    Inside the blockchain industry, the term token is also used. These aren''t the
    kind of tokens you''d find at an arcade. Instead, these currencies are blockchain-based
    digital assets that may be used from money to a digital item or service.


    Why do cryptocurrencies have any value?


    It''s all about supply and demand, which is purposely constrained for many large
    cryptos. A token''s value will grow if it can attract users. As a result, if there
    is a demand for bitcoin as a means of transferring financial value, its value
    is likely to rise. Real-world assets, like property investment or a gallon of
    gas, may also be linked to digital tokens, and their value can be derived from
    them. The most high-profile crypto transactions, on the other hand, have been
    the most bizarre, such as when someone bought $170,000 for just a token depicting
    a digital cat.


    How do you buy cryptocurrency?


    You''ll likely want to select a crypto exchange since it''s the most common technique.
    These let you acquire cryptocurrency with your fiat money and exchange between
    various forms of crypto. Digital currencies come in many forms and sizes, so deciding
    which one to use isn''t always easy. Make sure your selected exchange enables
    you to buy the cryptocurrency tokens you''re interested in as well as convert
    between fiat currencies. You should also consider the transaction costs charged
    by exchanges, if any, and make sure you''re okay paying them.


    Why should you care?


    You''ll undoubtedly wonder if cryptocurrencies are a good investment following
    this introduction. While your response will be based on your investment objectives
    and risk tolerance, keep in mind that the industry is in its infancy - which means
    it''s mostly regulated – so prices may fluctuate drastically. However, cryptocurrency
    supporters argue that it’s potential as an "inflation hedge" and a currency with
    its own right are two reasons why digital currencies would likely grow in value
    shortly.


    What else do you need to know?


    The most crucial thing to understand about cryptography is that it boils down
    to having both secret keys. A public key is similar to an email address in that
    it is shared in order to transmit and receive payments. You should not ever reveal
    your private key, just as you would never disclose your email password. This is
    because your private key is what lets you really access your money.

    '
  trans: '

    所有这些都意味着，尽管投资莱特币（Litecoin）有某些优势——例如，该货币具有高流动性，且已存在十年——但它也存在显著缺点。


    优点


    可靠性：在核心技术方面，莱特币投资者可以安心，因为该加密货币是最早诞生的之一，是以比特币网络为分叉（fork）创建的。LTC 与比特币一样，是开源且去中心化的加密货币。


    创建者查理·李（Charlie Lee）是一名计算机科学家，他曾在 Alphabet（谷歌的母公司）任职，目前在 Coinbase 工作。他并非懒惰的人。李的最初目标是打造莱特币——比特币的“银”，而比特币则是“金”。


    流动性：莱特币如今是市值前十的加密货币，市值达 116 亿美元。得益于其规模，莱特币拥有高度的可见度和流动性，日均交易量超过 200 万枚。


    鉴于加密货币市场的剧烈波动性，流动性至关重要。若缺乏足够流动性，单笔交易可能导致加密货币价值崩盘。相反，莱特币投资者无需担心变现时的流动性问题。


    性能：李想要改进比特币，因此莱特币相较于比特币具备多项优势。比特币交易平均确认时间略低于 9 分钟（Coinbase 数据），而莱特币交易确认时间约为 2.5
    分钟。由于速度更快，莱特币在长期可扩展性方面可能更具优势。


    此外，莱特币交易费用远低于比特币。比特币交易平均费用约为 4.38 美元，而莱特币交易费用约为 0.026 美元（2.6 美分）每笔。


    2.5 如何投资加密货币


    您可以通过辅导网络和像 Bitfinex、Coinbase 这类虚拟货币平台购买加密货币。今年早些时候，投资应用 Robinhood 推出了购买多种热门货币（包括比特币、狗狗币和以太坊）的功能，且无需支付主流交易所高额费用。即使是加密货币新手也能轻松上手。过去操作较为复杂，但如今已十分简便——只需建立银行账户并将其与信用卡绑定即可。


    ![2,040 Altcoin Stock Photos, Pictures &amp; Royalty-Free Images - iStock](img/image00187.jpeg)
    不过，请记住，购买单一加密货币类似于在股市中购买单只股票。将所有资金集中在一项资产上，比通过像共同基金或市场基金那样分散投资于数百甚至数千种证券更易暴露于风险。遗憾的是，当前加密货币的数量相对稀缺。


    是否应该投资加密货币？


    专家们对此意见不一。部分金融专家建议避免投资加密货币，因为它属于纯粹投机性资产，价格波动大。例如，比特币在 2020 年几乎三倍增值，年底价格超过 28,900
    美元；2021 年初至 4 月，其价格超过四倍；但到 7 月，所有涨幅均被抹去；随后又在 11 月 10 日创下 68,190 美元的历史高点，随后回落至约
    46,010 美元。这说明加密货币极具波动性、不可预测，价值会频繁波动。


    与政府背书的法币（如美元）相比，加密货币更应谨慎对待。法币的价值取决于当前持有量及其面临的损失风险。让我们稳步前行。若债券是传统戴帽子的绅士，股票是电话叭嘴的急躁推销者，那么加密货币则是穿连帽衫、在课堂后方编程、绘制重金属专辑封面的年轻人。尽管加密货币已存在超过十年，但直到
    2017 年价格飞涨才广为人知。加密货币使用户能够在无需中央机构批准的情况下进行支付或信息交易。早期许多尝试开发数字货币的方案均失败，直到 2008 年比特币的诞生才得以改变局面。


    比特币有何特殊之处？


    比特币分布在全球数台计算机网络中，而非像传统机构那样依赖中心化服务器。所有交易均在“无需授权的区块链”（blockchain）上处理，这是一种不可篡改的长账本。虽然比特币以数字货币闻名，但众多加密项目正利用区块链技术颠覆传统行业，从社交网络到文件存储等领域。在区块链行业中，"代币"（token）一词也常被使用。这里的代币并非游乐场的代币，而是基于区块链的数字资产，可用于代表金钱、数字商品或服务。


    加密货币为何具有价值？


    这完全取决于供需关系，而许多大型加密货币的供应被人为限制。若代币能吸引用户，其价值将随之上升。因此，若比特币被视作价值转移的工具，其价值很可能上涨。真实资产（如房地产或一加仑汽油）也可与数字代币挂钩，其价值可来源于这些资产。最引人注目的加密交易之一是有人以
    170,000 美元购入一枚代表数字猫的代币。


    如何购买加密货币？


    您可能会选择加密交易所，因为这是最常见的方式。交易所让您用法币购买加密货币，并可在不同加密资产之间进行兑换。加密货币种类繁多，选择哪一款并不总是容易。请确保所选交易所支持您感兴趣的代币，并允许法币兑换。同时，请关注交易所收取的交易费用，并确认您能接受这些费用。


    为什么需要关注？


    您肯定会思考加密货币是否值得投资。您的回答将取决于个人投资目标和风险承受能力，但请记住，该行业仍处于起步阶段——因此监管相对不完善，价格可能剧烈波动。不过，加密货币支持者认为，它作为“通胀对冲”工具以及拥有独立价值的货币，两点表明数字货币价值将在不久的将来显著提升。


    还需要了解什么？


    了解密码学的最重要一点是：它关乎拥有**两把密钥**。公钥类似于电子邮件地址，用于接收和发送付款，而私钥则如同电子邮件密码，切勿泄露。私钥决定了您真正控制资金的权限，若泄露，后果严重。


