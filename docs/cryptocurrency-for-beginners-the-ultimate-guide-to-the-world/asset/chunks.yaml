  trans: '

    -   [加密市场和数字资产在一般情况下是无形且不可见的，但关注、保管和控制是企业面临的最紧迫的问题。加密保管机构之间正在激烈地进行一场标准之争，争论谁能提供最大的股东保护标准，并计划如何保管，这与传统银行业面临的虚拟和真实安全问题相似。基于许多高调且高价值的加密盗窃事件，推荐的安全程序不断被生成。最富有的加密投资者使用存放在实际金库和避难所的冷存储设备来保护他们无形的财富。并非每个加密投资者都能负担这种程度的保护，正如并非每项加密投资都是一种威胁，大多数都受到新的关注、保管和控制规则的约束。由于缺乏关于安全和财务保障的基本“底线”，例如像
    FDIC 这样的网络存款保险公司，投资者在首损基础上面临风险，这使得他们容易受到损失。


    **人为错误（以及遗忘）**


    由于资产类别的抽象特性，人为错误和甚至令人困惑的密码遗忘可能导致加密货币财富的完全损失。并非每个人都像 50 Cent 那样幸运，他在只忘记为一张专辑发布比特币后，发现了
    800 万美元的比特币奖金。被锁定、硬件丢失或遭遇“地质灾害”（如洒咖啡）的威胁足以导致损失——更不用说比特币价格波动带来的买家悔恨风险了。在币鲸（大额持有者）这一范围内，重要资产持有者的高调性和公众地位可能使他们面临如绑架、勒索和敲诈等直接安全威胁。一队购买兰博基尼（Lambos）并不会提供足够的谨慎来避免成为目标。


    **技术风险**


    许多文章都在讨论比特币矿工的计算难度和能源消耗，以解释加密货币的一些技术限制。在假设复杂结构会以复杂方式失败的前提下，这种计算成本也可能产生相反的效果，对资产类别构成重大威胁。真正去中心化的区块链系统因其内在的灾难和风险保护，提供了中央数据库所不具备的保护。然而，并非所有加密货币或代币都遵循相同的路径。因此，投资者应警惕许多项目所宣称的技术风险和去中心化声明，因为并非所有加密算法都同等出色。


    **(不安全)避风港**


    缺乏监管、财务、税务和法律方面对加密货币及整个资产类别的协作与透明度，是另一个主要风险。鉴于该行业的相对新颖以及“监管追赶”通常质量差且滞后的特点，这也是可以预见的。确实，全球大多数监管机构直到
    2017 年比特币 spectacular 走红后才开始制定对加密货币的判断。随后，各国政府和司法管辖区纷纷发起“加密土地抢夺”，争夺成为潜在投资者和企业的首选地。正如国际经济市场一样，协调与一致性可以在很大程度上避免系统性和琐碎的风险，同时提升整体市场稳定性。


    **与分叉的内战**


    最后，虽然许多加密富豪正在长期思考这项投资工具对世界的积极影响，但分叉（fork）带来的战争威胁——可能导致加密货币共识分裂，削弱市场份额、估值和采用——始终存在。标准争论时有爆发，最著名的是比特币现金（Bitcoin
    Cash）的推出。尽管在对称加密中讨论的是一个由盲目模块化信任主导、没有中央化权威的世界，但值得注意的是，大型虚拟货币持有者的市政政府（类似教皇选举或国际金融公司（IFC
    (BIS)）），可以影响市场，试图左右后果和价格波动。小人物可能在大鲸鱼（大额持有者）的冲击下被吞没或捕获，就像在实际鲸鱼的后遗症中一样。


    加密货币市场之所以有收益，正是因为存在风险。无数新进入者看到这是一场由新技术驱动的财富创造浪潮，无论是巨大的传统机构觉醒到区块链潜力，还是初创团队致力于构建挑战现状的去中心化未来。了解进入这场潮汐的风险将有助于加密货币的长期前景，并扩大其在风险厌恶型早期采用者之外的普及度。


    竞争风险很高，因为公司必须调整并扩展其产品以包含所有支付传输，这需要对现有系统和基础设施进行重大调整。此外，这些系统变更需要定期保持更新，并且必须与公司的交付系统以及各种第三方供应商的系统保持兼容。


    税务风险显著，因为美国公民可能通过将资金以不寻常方式存放在海外来规避税务要求（如 FBAR 申报）。无论是有意还是无意，使这些规避行为得以实施的机构可能面临处罚和/或罚款。货币转换或翻译以及相关指示的
    filing 可能会产生额外的公司义务。


    加密货币将长期存在，随着技术的进步。公众接受和信任这种货币将需要一些时间，但风险将保持不变，有些风险可能比以前更为严重和高，既针对货币本身，也针对相关公司。


    5.2 降低风险


    加密货币本质上是神秘的；名字也说明了这一点。如果你遵循华盛顿·巴菲特的建议，永远不要投资于你不了解的公司，那么很难为购买一种由数学而非黄金构成的货币提供理由。


    然而，很难忽视某些加密货币的惊人表现：比特币的价格从 2020 年 3 月的不到 5 万美元，已上涨至目前的 6 万美元以上。


    对于那些谨慎且有兴趣的交易者，以下是几种在不直接购买的情况下获得加密货币敞口的方法，以及如果决定购买后如何降低风险。


    我们是否已经到达比特币热潮的巅峰？当然，我们已经到达，因为很少有事物像数字货币那样在最近几个月经历了如此巨大的增长，尤其是比特币在 4 月突破 6 万美元的关口。然而，围绕加密货币领域的波动性和不可预测性让许多人保持距离并感到恐惧。但冲动仍在继续，部分原因是讨论的影响。专家指出，区块链将长期存在，尽管在可预见的未来它不会完全取代传统货币。


    因此，如果你被吸引去投资比特币，但因为担心风险而尚未行动，让我们来探讨如何降低亏损的概率。


    以下是一些降低风险的策略：


    **保持警惕**


    首先，比特币交易所并不安全。由于缺乏明确的标准或监管，上网浏览时存在大量被骗的机会。钱一旦离开你的控制，就无法追回。因此，在采取任何行动时必须时刻保持高度警惕。阅读其他人被骗的情形，以免重蹈覆辙。


    **持续评估市场**


