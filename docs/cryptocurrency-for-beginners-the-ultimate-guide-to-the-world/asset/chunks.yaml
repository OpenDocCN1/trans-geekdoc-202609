  trans: '

    虽然 Ripple 拥有一种原生加密货币 `XRP`，但 `IOU` 的处理更多是关于网络本身而非该加密货币。该货币的设计初衷并非作为价值存储和交换媒介，而是作为一种防止垃圾邮件的网络保护令牌。与比特币和以太坊不同，Ripple
    没有挖矿，因为所有硬币已经预先挖好。随着不少银行加入了 Ripple 网络，Ripple 在金融领域显得尤为重要。Ripple (`XRP`) 是一种实时全额结算（RTGS）系统，兼具钱款转账、货币兑换和汇款网络的功能。它由美国的
    Ripple Labs Inc. 开发，并在 2012 年通过独立服务器验证后发布。`XRP` 是可交易的加密货币名称。`XRP` 可以兑换几乎任何其他货币，使用户可以避免在银行排队的长时间等待。相比之下，加密货币的波动性更大，意味着其价值可能会剧烈波动。财务顾问可以帮助你确定整体投资策略应如何制定。


    **What Is Ripple (XRP)?**


    与比特币和以太坊等其他加密货币不同，Ripple 采用“散列树”结构而非区块链。由于硬币数量有限 —  — 1000 亿枚 —  — `XRP` 不能被挖矿。加密货币基于区块链技术，是一种将信息分组为块的数据库。每条新信息在新块合并后加入链条。区块链顾名思义，将数据分块并将其链接在一起。Ripple
    与区块链相似之处在于交易由多个节点处理。支付过程包括发送方提交交易，信息被赋予单一数值后写入共享公共数据库，验证服务器或节点共享该信息，若多个独立服务器报告匹配则交易获准并处理。由于不涉及工作证明，系统不像比特币那样。比特币中，矿工需要解决复杂的方程以证明工作量后，区块才能加入链条。相反，Ripple
    的模型是基于共识的，交易在达成一致后即可清算。因此，Ripple 网络每秒可处理约 1500 笔交易，而比特币仅能处理 3～6 笔，以太坊约 15 笔。尽管它并非完全相同的区块链系统，但
    Ripple 的处理效率和速度较高，这也是银行和大型支付系统考虑并尝试使用 Ripple 的主要原因。此外，Ripple 并非像以太坊那样完全去中心化。开发者拥有控制哪些服务器被纳入网络的机制，以防止恶意操作者（即拥有中心化权威）。因此，有人认为
    `XRP` 并不是真正的或标准的加密货币。


    ### 3.5.13 Tether


    ![](img/image00213.jpeg)


    `Tether` 是一种由法币担保的稳定币，使用户在区块链资产之间进行交易时避免价格波动。`Tether` 主要在以太坊和比特币区块链上发行，并以 1:1
    的比例与银行账户中的美元挂钩。


    **History**


    `Tether` (`USDT`)，原名 “Realcoin”，是一款旨在保持与美元 1:1 固定汇率的加密货币。它于 2014 年 7 月由 Brock
    Pierce、Craig Sellars 和 Reeve Collins 共同创立。`Tether` 建立在 Mastercoin（Omni）协议层上，这是一种为比特币引入稳定币概念的协议，该概念于
    2012 年被提出。`Tether` 是当时诞生的第一批稳定币之一，也是目前使用最广泛的稳定币，开创了法币担保稳定币模式。`Tether` 诞生是为了解决现有加密货币的两个关键问题：高波动性以及法币与加密货币的可兑换性。它通过创建一款完全由美元银行存款
    1:1  backing 的加密货币来应对这些问题。`USDT` 代币在以太坊上以 ERC‑20 形式存在，而在比特币上则通过 Omni 层表示。虽然代币本身在去中心化网络上运行，`Tether
    Ltd`（位于香港）唯一负责代币的创建与赎回以及 1:1 存款 backing。`USDT` 主要被交易所用作法币的替代品，从而减少或消除对外部银行关系的需求。自
    2014 年创立以来，`Tether` 一直备受争议，主要原因是公司未能提供经审计的财务报表，证明其拥有足够的准备金支撑 `USDT`。`Tether` 长期未披露其银行合作关系，直到
    2018 年 11 月才因 Bitfinex（关联的加密交易所）的担忧而公开这些关系以平息溶剂性疑虑。`Tether` 在 2019 年 3 月更新披露声明，称其代币不再完全由美元存款
    backing。如今，`Tether` 完全由准备金支撑，准备金包括传统货币、现金等价物，以及 `Tether` 向第三方（包括关联实体）提供的贷款及应收款项等资产。


    ### 3.5.14 Bitcoin Cash


    ![Bitwage Launches Bitcoin Cash Payrolls](img/image00214.jpeg)

