  trans: '

    考虑你的头发、武器、盔甲、宠物和角色作为非功能代币（NFT），你可以升级并出售它们。也许你拥有一个极其稀有的物品，随着用户群体的扩大，更多人希望拥有它。人们在游戏行业投入了数十亿美元，尽管把钱投入游戏通常被视为“沉没成本”。如果他们能在市场上升级和出售这些
    NFT，代表他们投入的时间，他们为什么不愿意花钱呢？


    ### 6.3.4 TCG - 更多游戏


    交易卡游戏（TCG）尤其适合，因为卡牌游戏的目的是与他人竞争和交易。宝可梦、Hearthstone、尤尤和魔法：收集者都是在全球拥有数百万收藏家和玩家的流行游戏。我们都见过像喷火龙这样的稀有卡片在现实世界中能卖出高价。Splinterlands
    和 Gods Unchained 正在为这条道路铺平道路。


    ### 6.3.5 收藏品


    收藏品市场巨大。CryptoPunks 已经以 100 万美元或更高的价格售出，而 CryptoKitties 风靡一时。即使在数字时代，拥有感和想要拥有具有标志性事物的愿望依然强烈。


    ### 6.3.6 体育收藏品


    随着知名企业和球员的参与，NBA Top Shot 的销售额已超过 1 亿美元。这些 NFT 不仅用于收藏；它们还可以用于各种活动。事实上，这些 NFT 可以用于构建整个体育游戏生态系统。


    ### 6.3.7 域名


    域名 .eth 和 .crypto 价格高昂。人们利用它们来替换支付地址、直接使用 Twitter 账号付款，甚至未来托管网站。此外，任何可以持有的东西都可以是（NFT），那么域名为什么不可以呢？


    ### 6.3.8 De-FI


    NFT 也可以应用于去中心化金融（De-FI）并取得成功。例如 Bond 等项目允许你使用 NFT 免费交易加密货币。NFT 将在各种区块链基础的去中心化金融应用中被使用和应用。


    ### 6.3.9 数字化实物商品


    这是一种既有实体成分，又附带 NFT 的实物商品。两者都是独特的资产。例如，Metafactory 销售带有 NFT 的个性化卫衣，该 NFT 可用于 Cryptovoxels。Headspace
    也如此操作，部分其 NFT 可在 Decentraland 看到。


    ### 6.3.10 虚拟场景


    NFT 可用于创建整个虚拟建筑和游戏。Metazoan 是一个令人惊叹的项目，允许 Decentraland 土地所有者购买并部署游戏、建筑和增强功能。如果你真的想在你的房产上举办聚会，但不想支付
    4000 美元的开发费用，为什么不租用一个周末，只需 200 美元呢？随着区块链虚拟世界的扩展，这一概念具有巨大的潜力。


    ### 6.3.11 虚拟汽车


    为什么不能在虚拟世界中拥有虚拟汽车、飞机和船只作为 NFT？一些人已售出数字汽车，价格高达数百 ETH。随着区块链虚拟世界的发展，对高级交通和探索工具的需求也将随之增长。CryptoMotors、F1
    Delta Time 和 Battle Racers 已经探索过这一方向。


    ### 6.4 合法和新的 NFT 市场


    NFT 是一种独一无二、无法替代的物品。大多数 NFT 现在都是数字化的。这使得创作者能够向粉丝提供稀有且独特的内容。例如，一些 NFT 是数字艺术品，它们的收藏方式与多年来收藏实物画作一样。这些
    NFT 中有些已售出天文数额。第一批 NFT 是以太坊区块链的一部分，该区块链包含额外的电力数据以区分它们。NTFS 也被其他区块链支持。由于不同 NFT
    使用不同的区块链技术，并非所有 NFT 市场都交易所有类型的 NFT。创作者通常会根据是否支持特定 NFT 标准来选择 NFT 市场。ERC-721 和 ERC-1155
    是迄今为止产生的以太坊标准的两种。竞争对手 Binance 后来开发了 BEP-721 和 BEP-1155 规范。由于这两种标准允许将多个 NFT 打包在一起进行交易，它们与原始“721”规范有所不同。大多数
    NFT 平台要求购买者拥有数字钱包，并使用加密货币支付购买费用。


    ### 6.4.1 [OpenSea](https://opensea.io?ref=0x4509a6dd84e88fd0d894726abb036d98e411c966)


    OpenSea 声称是全球最大的 NFT 市场。非同质化代币包括艺术品、抗审查域名、虚拟世界、交易卡、体育和收藏品。还包括基于 ERC721 和 ERC1155
    的资产。


    ### 6.4.2 [Rarible](https://rarible.com/)


    Rarible 是一个社区 NFT 市场，使用 RARI 代币作为其“所有权”代币，这是一个 ERC-20 代币。Rarible 向在 NFT 市场上活跃购买或出售的用户发放
    RARI 代币。该平台每周发放 75,000 RARI。在平台上，艺术资产受到高度重视。


    ### 6.4.3 [super rare](https://superrare.co/)


    Super rare 主要是消费者购买和出售独一无二、限量版数字艺术品的市场。每件艺术品都由网络艺术家生成，并作为加密收藏品数字商品被代币化，你可以拥有并交易它。它将自己定义为
    Instagram 和 Christie''s 之间的混合体，为在互联网上与艺术、文化和收藏互动提供了新方式。SuperRare 上的每件艺术品都是数字收藏品，一个加密并记录在区块链上的数字对象。除了市场，SuperRare
    还构建了一个社交网络。数字收藏品非常适合社交环境，因为它们拥有明确的所有权记录。


    ### 6.4.4 [Foundation](https://foundation.app/)


    Foundation 是一个小众平台，汇集了数字创新者、加密原生用户和收藏家，以推动文化发展。它被称为“新创意经济”。主要关注数字艺术。2020 年 8 月，他们发布了开放征集，邀请创作者使用加密货币并探索价值的概念，这是他们网站上第一篇博客的内容。创作者被邀请进行破坏、破坏和扭曲创作价值的尝试。当
    NFT 在 Foundation 上交易时，艺术家将获得二级交易价值的 10%，即当收藏家以更高价格转售其作品时，艺术家将获得销售额的 10%。


    ### 6.4.5 [AtomicMarket](https://wax.atomicmarket.io/)


    AtomicMarket 是一个 NFT 智能合约市场，拥有共享流动性，被许多网站使用。在一个市场上发布的内容在所有其他交易所上也都可见，这称为共享流动性。它是
    Atomic Assets 市场的 NFT 市场，Atomic Assets 是基于 eosio 网络的非同质化代币标准。Atomic Asset 标准可用于代币化和生成数字资产，以及在
    Atomic Assets 市场上购买、交易和拍卖资产。在 AtomicMarket 上，你可以将自己的 NFT 发布出售，也可以浏览现有的列表。知名收藏的
    NFT 会带有验证标记，便于辨认真实 NFT。恶意收藏会被列入黑名单。


    ### 6.4.6 [KnownOrigin](https://knownorigin.io/)


    KnownOrigin 是一个在线市场，你可以在这里找到并购买稀有的数字艺术品。KnownOrigin 上的每件数字艺术品都是真实且独一无二的。创作者可以使用该站展示作品并出售给重视真实性的收藏家。以太坊区块链保护了它。创作者可以将数字艺术品上传到
    KnownOrigin 画廊，格式为 jpg 或 Gif 文件，所有文件均存储在 IPFS 上。


