  trans: '

    Crypto Art 是一个相对新的现象，大多数人都不了解它。因此，NFT 平台的目标之一是创建社区，让艺术家、收藏家和数字专业人士能够连接、讨论、培训，并及时了解新技术、趋势和市场发展。社区的口号是“协作”，这种精神因专注于艺术而得到加强：艺术家通常匿名或使用化名，性别、种族和社会地位不被揭示。Art
    Rights 是一个利用区块链技术管理和认证艺术作品的平台，是帮助艺术家（包括 Crypto Artists）的工具之一。Art Concierge 是艺术界最大的艺术家、收藏家和专业人士社区，也是该平台提供的服务之一。


    # Chapter 5: What is NFT and Key Concepts?


    ![NFT Kya Hain: Salman Khan to McDonald''s, all are Launching NFTs. Should you
    Invest in Crypto Tokens?](img/image00221.jpeg)


    你可能已经听说过比特币、区块链，以及最近在科技新闻中看到的 NFT。艺术家和收藏家都被数百万美元天价数字资产拍卖的新闻吸引。但 NFT 究竟是什么？它们是如何工作的？我们将在本章中了解
    NFT、关键概念、工作原理、NFT 与区块链以及更多内容。本章将介绍非同质化代币的基础、其背后的技术以及在日常生活中的应用。我们还将介绍参与其中所需的技能和知识。


    ## 5.1 What is NFT?


    NFTs 是独特的资产，为收藏家和玩家提供了对其数字资产的完全控制权。让我们先定义一些基本术语。我们需要一些背景知识才能理解 NFT 是什么以及它们是如何工作的。


    NFT（非同质化代币）是数字资产，可以用来代表各种有形和无形的商品，例如收藏家的虚拟房地产、体育卡片、数字鞋子。数字收藏品的一个重要优势是，与像宝可梦卡片或稀有铸造硬币等有形收藏品相比，每个
    NFT 都包含唯一的信息，可以轻松验证。伪造的收藏品无法制造和分发，因为每件商品都可以追溯到原始发行者。在经济学中，货币是一种可分割的资产。它可以被轻松交换而不损失或增加价值（例如，一张
    £20 可以兑换成两张 £10）。金条、比特币和股票都是可分割的资产。相反，非同质化资产是独一无二的，例如一幅画、一栋房子或一张交易卡。即使一幅画可以被拍照或复制，它仍然是原件，复制品的价值不等于原件。区块链存储
    NFT，这些是数字数据单元。每个非同质化代币都充当真实性证书，证明数字资产是独一件且不可复制。由于区块链的加密技术，NFT 永远无法被编辑、篡改或盗用。


    ## 5.2 NFTs key concepts


    非同质化代币（NFT）是连接到区块链的数字内容元素，区块链是比特币和以太坊等加密货币的数字账本。与 NFT 相比，其他资产是可分割的，意味着它们可以被另一份相同价值的相同项所替换，例如一张美元钞票。相反，NFT
    是唯一且不可交换的，意味着没有两个 NFT 是相同的。考虑宝可梦卡片、稀有硬币或限量版乔丹鞋：NFT 在原本无限供应的商品中创造稀缺性，并附带真实性证书。NFT
    可用于购买和出售 GIF、推特、虚拟收藏卡、实物照片、视频游戏皮肤、虚拟房地产和其他数字艺术品。


    ## 5.3 How do NFTs work?


    与其他加密货币相比，NFT 不能直接交换，因为即使属于同一平台、收藏或游戏，也不可能存在两个完全相同的 NFT。你可以把它们看作节日通行证。每张通行证包含购买者姓名、活动日期和场地等信息，这些信息使得通行证难以交换。


    ### 5.3.1 How to buy NFTs


    原则上，任何数字图像都可以作为 NFT 购买。但是，尤其是对于新手来说，在购买时需要注意几点。你需要选择一个市场平台来购买，一个数字钱包来存储加密货币，以及执行交易所需的加密货币。一些最知名的
    NFT 市场包括 OpenSea、Mintable、Nifty Gateway 和 Rarible。


    ### 5.3.2 How to sell NFTs?


    NFT 也在市场平台上销售；但具体方法因平台而异。基本上，你需要在市场上发布你的作品，然后按照平台的流程将其转换为 NFT。你可以输入作品描述和定价建议。大多数
    NFT 是用以太坊（ethereum）购买的，但也可以使用其他 ERC-20 代币，如 WAX 和 Flow。


    ### 5.3.3 How to create an NFT?


    任何人都可以创建 NFT。你只需要一个数字钱包、少量以太坊以及访问 NFT 市场平台的权限，在那里你可以上传并将你的作品转换为 NFT 或加密艺术。如果你是有志成为数字艺术家，可能会想制作
    NFT 来展示你的作品。幸运的是，有很多平台可以帮助你入门。整体流程相对简单，各个平台都会一步步指导你。但在这开始之前，你可能需要了解一些事项。NFT 建立在特定区块链之上并受其支持。以太坊区块链是非同质化代币最流行的选择。你需要一个比特币钱包和加密货币来开始。目前，以太币（ETH）是使用最广泛的。


    ## 5.4 NFT and block chain


    目前有多种区块链技术可供选择。有些区块链是为满足少数人群体的需求而创建的，它们的访问权限有限。那么 NFT 在区块链世界中处于什么位置？区块链是一种在通信网络节点中分布式存储的软件，充当分布式账本。其不可篡改性使其区别于其他在线数据库或交易平台：你可以在点对点网络中交易数字资产，且无需多数网络节点同意即可更改或删除这些交易。这是互联网的一大优势。每个
    NFT 中的代币代表一件独一无二的物品。你不太可能注意到在合同中用 Mike Winkelmann 的作品替换 Andrew Wyeth 的画作。NFT 涵盖广泛的独特资产，包括出生和死亡证明、产权证书以及物联网设备的身份。虽然
    CryptoKitties（第一个 NFT 热潮）的热潮已消退，但 Beeple 作品拍卖的兴奋展示了 NFT 的潜力。这是一个价值创造领域，你的想象力、技术技能以及营销、会计和法律支持是唯一的限制。


    Discovering NFT

