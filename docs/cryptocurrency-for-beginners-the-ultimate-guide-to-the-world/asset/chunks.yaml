  trans: '

    # 尽管 NFT 在数字金融生态系统中仍是“光彩夺目”的新宠，但其实用性和市值尚未实现。NFT 必须在中市场环境中进行展示和提供，而非仅限于奢侈品或高端机会，才能实现其面向普通消费者的潜力。普通消费者需要获取信息、搜索、比较并购买的能力。买家旅程的发现阶段至关重要，别忘了冲动购买的力量。这很可能导致
    NFT 市场更加专注于特定用例。OpenSea 是最早的 NFT 市场之一，正在快速增长。2021 年 OpenSea 的交易量增长了 12,000% 以上，6
    月单月即完成了 1500 万美元的 NFT 交易。如果不计其他好消息，其用户基数在六个月内从 315 人增长到 14,520 人，推动公司在 8 月达到 30
    亿美元的月度 NFT 交易额。所有这些都是 NFT 及整个数字金融行业的好消息，但专用市场无法像阿里巴巴这样具有国际知名度的强大企业那样快速推动行业发展。因此，阿里巴巴最近的公告极具吸引力。


    **智能合约**


    智能合约用于分配所有权并管理 NFT 的可转让性。当某人生成或铸造 NFT 时，他们执行的是遵循多种标准（如 ERC-721）的智能合约代码。这些数据存储在区块链上，即
    NFT 的处理方式。以非同质化代币（NFT）的形式，智能合约已对大众产生了显著影响。2021 年第一季度，NFT 消费超过 20 亿美元，同比增长 2,100%。


    **数字资产**


    简单来说，数字资产是指以数字形式存在并具备使用（复制、拥有复制权、复制、修改）能力的任何事物。文档、音视频信息、照片以及其他相关数字数据等均属于数字资产。


    ## 5.5 NFTs vs. Cryptocurrency


    必须明确加密货币与非同质化代币（NFT）的区别。尽管两者均基于区块链技术，但其根本差异有助于我们理解 NFT 的工作方式。主要差异源于加密货币是可互换的——例如，可用一种比特币兑换另一种比特币。而
    NFT 不可如此交换。非同质化代币关联唯一的数字资产，无法与其他代币互换。NFT 与加密货币的主要区别在于，NFT 是唯一的实物数字资产的唯一代表，无法相互交换；而加密货币因价值稳定，可相互交换。加密货币和
    NFT 都是去中心化的，由其运行社区治理。它们可通过数字公共账本访问，使所有交易透明。


    ## 5.6 NFT vs. Bitcoin


    虽然 NFT 使用比特币等加密货币的相同技术，但两者的相似之处到此为止。比特币可相互交换且价值相同——一卢比永远等于一卢比，一枚比特币永远等于另一枚比特币，不论其与其他货币的价格波动如何。NFT
    则不然。每个 NFT（虚拟资产）都带有不可复制的数字签名，因编码原因无法完全复制。


    ## 5.7 NFT 的优缺点


    以下列出 NFT 的一些潜在优缺点：


    ### 5.7.1 NFT 的优点


    NFT 的优势包括：


    **安全性**


    NFT 可在安全透明的环境中交易。NFT 作为不可篡改的数字签名，为收藏者提供了极高的信任度。这种保障也延伸至艺术品的未来遗产。区块链保护数字作品免受审查和物理损坏，但仍需谨慎存储。区块链技术还能让全球大额资金安全、公开地转移。NFT
    保证了独特资产的真实性、唯一性和所有权，正如区块链构建的信任协议使数字货币得以建立。


    **价值升值**


    实物贵重物品（如艺术品）有着悠久的增值历史，数字艺术也可能如此。


    **买卖渠道扩大**


    将数字资产作为 NFT 进行买卖，让你接触到远比以往更庞大的买家和卖家群体。


    **赋予创作者所有权**


    当内容创作者开发数字资产时，NFT 让他们不仅能证明真实性，还能从中获利。这对广为流传的表情包创作者而言可能是一笔巨大的收入来源。


    **独特且可收藏**


    许多爱好者热衷于获得独一无二或极罕见的物品。数字收藏品，尤其是数字资产，借助 NFT 获益匪浅，因为它为真实性增添了额外层。


    **不可篡改**


    非同质化代币基于区块链，永不更改、删除或替换。这在证明数字内容的来源或真实性时是宝贵属性。


    **可组合性**


    NFT 最令人兴奋的方面之一是它们可被视为互相连接的乐高积木。这意味着设计师可以推出基于已有 NFT 成功的 NFT，任何 NFT 项目都可视为更大、互联生态系统的模块。


    **可包含智能合约**


    智能合约是区块链技术的另一令人兴奋特性。它们能在满足特定条件时执行指令。因此，带有智能合约的 NFT 可在二次销售时向艺术家支付部分收益。艺术家和制作方可通过“智能合约”——即嵌入区块链的代码指令序列——在作品被后续使用或转售时获得报酬。


    ### 5.7.2 NFT 的缺点


    NFT 的缺点包括：


    **本质上具有投机性**


    核心问题是 NFT 是否具有真实价值。它们是长期投资还是短暂风潮？目前，NFT 的唯一估值标准是其情感属性。


    **数字资产可被复制**


    拥有 NFT 的数字资产所有权并不排除他人复制该资产。艺术品可被复制粘贴，GIF 可被分享数百次，视频可被广泛传播。拥有 NFT 并不赋予你对资产的控制权，它仅是所有权证明。


    **环境成本**


    像以太坊和比特币等区块链加密货币的环境影响受到广泛关注。将数据写入区块链需要大量计算能力。区块链资产的长期可行性是一个主要顾虑。


    **易被盗**


    尽管 NFT 背后的技术极其安全，但许多交易所和平台并不安全，导致 NFT 因安全漏洞被盗的案例屡见不鲜。


    **因需求下降而价值贬值**


    许多 NFT 是不动产且自带无收入功能，其价值依赖于主观指标（如买家需求）。因此，极高的价格难以长期维持，NFT 可能出现显著价值下跌。


    **可持续性存疑**


    '
