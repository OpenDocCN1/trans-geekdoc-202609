  trans: '

    任何人们可以收集和收藏的实物，从精致的瓷器到酒瓶、从稀有手稿到复古汽车——以及介于两者之间的所有物品——都是收藏品。这些“可触碰的资产”被收藏家收藏是因为他们喜欢它们。投资者持有它们是抱有它们的价值会随时间增长的期望。正如任何投资一样，没有保证能确定哪些会升值，哪些不会。由于其多样性，收藏品是一个特别意想不到的群体。当像
    Beanie Babies 这样炒作的事物一年内飙升，下一年又几乎完全失去价值时，往往是那些看似最易被丢弃的物品价格却急剧上涨。有兴趣的收藏家应该通过创建自己的加密钱包并购买一些低价作品来了解
    NFT。理解这种媒介本身的作用，就像理解艺术品是如何被收藏和投资的一样。SuperRare 上的每件作品都不贵；价格从 41 美元到数十万美元不等。该网站还通过指导用户创建钱包、购买以太坊以及下标订单，简化了开始收藏的步骤。十年后人们仍会回到它，引用它，观看它，并试图理解它。由于加密货币市场表现不如许多相信的那样，价格可能会再次下跌。不过，艺术史将回顾这一时期，认为它很重要，因为许多艺术家将
    NFT 作为其艺术语言的媒介。现在投资，你可能正在购买一件历史作品——尽管你可能无法把它挂在墙上。


    # Conclusion


    从最基本的层面来看，非同质化代币（NFT）是一种独特且可验证的数字资产，可在创作者与购买者之间进行交易。其唯一性是区分 NFT 与其他数字资产的关键属性。`NFT`
    不能像美元钞票或股票那样进行替换，但它拥有独立的价值。NFT 所代表的属性——通常是数字化的，如原创艺术作品或数字纪念品——决定了 NFT 的价值。NFT
    不总是包含该数字属性，但它指向其在区块链上的位置。就像演唱会门票或房地产交易一样，NFT 反映了其所代表的物品的价值。NFT 不是加密货币，但它基于以太坊和类似比特币的技术。NFT
    同样在区块链上维护，这与加密货币相同，能够确认其唯一标识和所有权。此外，区块链记录了所有涉及 NFT 及其代表资产的交易。大量 NFT 位于以太坊区块链上。艺术家、歌手、运动员、名人等都喜欢
    NFT，因为它们为直接向粉丝营销其商品提供了全新且独特的机会，如 GIF、meme 和 tweet。艺术家还可以在 NFT 被转让给新所有者时，在代码中设定未来收入。画廊将新一代收藏家视为潜在市场。NFT
    技术自 2014 年起存在，但直到现在才在现实世界中得到验证。由于 NFT 基于区块链，它们的用途可能不仅限于艺术和收藏品，还包括视频游戏、时尚、汽车所有权、房地产等。智能合约的加入理论上可以提升效率和安全性。然而，NFT
    市场仍处于起步阶段。此外，权利、所有权、知识产权等问题尚未得到充分研究。你应通过阅读关于 NFT 的书籍来保持知识更新，其中一本你最近已经完成阅读。

