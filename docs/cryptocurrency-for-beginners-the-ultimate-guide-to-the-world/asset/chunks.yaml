    understand what digital currency is. Crypto currencies decentralize currencies
    in very basic words so that the money is not regulated by the government. However,
    without a single agency, it becomes a challenge to check transfers and stop double-spending.
    That is when the culture of cryptographers comes into play. Crypto currency transactions
    are effectively distributed to the whole network through cryptography and blockchain,
    rather than checking a transaction via a centralized third party. In an open-source
    network, this public ledger tracks all transactions, empowering anyone to see
    transactions. Transactions are only done when by solving a cryptographic puzzle,
    crypto currency miners validate the transaction. In crypto-currencies, by legitimizing
    transfers, miners operate as a third party, close to the government, in regular
    currency transactions. Crypto miners are, however, paid with crypto from the network
    itself instead of taking a share of the trade and the money of the participants.
