- raw: "BCH, or Bitcoin Cash, is a cryptocurrency that was created as a permanent\
    \ fork of Bitcoin. Bitcoin Cash was created to address disagreements within the\
    \ Bitcoin community about how the currency's technology should operate, particularly\
    \ in light of increased demand. It can process up to two million transactions\
    \ per day with its increased block size limit of 8MB. BCH's larger block size\
    \ enables it to process more transactions per second. This means that payments\
    \ will be processed more quickly, and fees will be reduced. This is in response\
    \ to the allegedly increasing number of transactions that the Bitcoin infrastructure\
    \ has been unable to handle. Cryptocurrency, as a digital asset used as a medium\
    \ of exchange that is not issued by a central authority, is designed to be secure\
    \ and anonymous. Using decentralized technology converts understandable data into\
    \ complex, virtually unsolvable encrypted code. It enables users to make secure\
    \ payments and keep track of their funds. Bitcoin Cash is a fork of bitcoin, and\
    \ one of the main reasons for its creation was to address disagreements within\
    \ the Bitcoin community about how the currency's technology should operate, especially\
    \ in light of increased demand. Consider this permanent fork as being the same\
    \ at the point of division but diverging in the future. Because it was an unexpectedly\
    \ orchestrated scheme, the hard fork that resulted in the creation of Bitcoin\
    \ Cash was unexpected. Many people initially mistook it for a threat against a\
    \ hostile and aggressive user-activated soft fork. Bitcoin Cash, on the other\
    \ hand, is here to stay. It's a permanent break from the previous blockchain.\
    \ In order to increase transaction capacity, the new blockchain forked off. This\
    \ is in response to the allegedly increasing number of transactions that the Bitcoin\
    \ infrastructure has been unable to handle. Everyone was taken aback by this controversial\
    \ move because when a blockchain forks, it can result in competing assets. Bitcoin\
    \ Cash was built using a different set of technological protocols than Bitcoin.\
    \ Bitcoin cash had newer consensus rules because it forked off from the Bitcoin\
    \ blockchain ledger, allowing it to scale. Bitcoin Cash differs from Bitcoin in\
    \ several ways, with the primary goal of creating sound money that is accessible\
    \ to everyone. To begin with, compared to Bitcoin, Bitcoin Cash has a larger block\
    \ size limit parameter. It can process up to two million transactions per day\
    \ with its increased block size limit of 8MB. BCH's larger block size enables\
    \ it to process more transactions per second. This means that payments will be\
    \ processed more quickly, and fees will be reduced. Bitcoin Cash transaction signatures\
    \ differ slightly because a brand-new SigHash type provides replay and wipeout\
    \ protection as well as improved hardware wallet security. The problem of quadratic\
    \ hashing is also solved. Bitcoin Cash also has a new feature called Emergency\
    \ Difficulty Adjustment (EDA). This allows you to adjust the proof-of-work difficulty\
    \ more quickly and effectively. This means miners can easily transition away from\
    \ the legacy Bitcoin chain while ensuring that users are not affected by hash\
    \ rate fluctuations. Bitcoin Cash lacks the \"replace by fee\" feature, and its\
    \ development is decentralized, with multiple independent development teams providing\
    \ software implementations. This means it can't be controlled by a single entity,\
    \ making it immune to political or social upheavals. During its years of existence,\
    \ the Bitcoin Cash network has seen a lot of infrastructure support, with more\
    \ merchants, wallet providers, and exchanges announcing their growing support\
    \ of the new cryptocurrency.\n\n### 3.5.15 Litecoin\n\n![Litecoin Climbs 11% In\
    \ Rally By Investing.com](Images/image00215.jpeg)\n\nAfter Bitcoin, Litecoin was\
    \ one of the first crypto coins, and the digital gold Bitcoin was branded as silver.\
    \ With a bigger token and a revolutionary mining algorithm, Litecoin was a true\
    \ breakthrough quicker than Bitcoin, better suited to be Bitcoin's smaller sibling.\
    \ It encouraged the advent of many other crypto currencies that used its codebase\
    \ but made it lighter, even more so. Dogecoin or Feathercoin are examples. Although\
    \ after Bitcoin, Litecoin struggled to find a real use case and lost its second\
    \ spot, it is still extensively pursued and traded, and if Bitcoin fails, it is\
    \ hoarded as a replacement.\n\n### 3.5.16 EOS \n\n![EOS Coin: Blockchain Review,\
    \ EOS Wallet, ICO – BitcoinWiki](Images/image00216.jpeg)\n\nEOS is a decentralized\
    \ blockchain-based platform for developing, hosting, and running business applications\
    \ or dApps. EOS was launched in June 2018 after Block. one raised $4.1 billion\
    \ in cryptocurrency through an initial coin offering. EOS is the name of the open-source\
    \ software developed by this company. On the network, EOS cryptocurrency tokens\
    \ are used as a payment system.\n\nWhat is EOS?\n\nEOS provides core functionality\
    \ that enables companies and individuals to create blockchain-based applications\
    \ in the same way that web-based applications are created. EOS provides secure\
    \ access as well as authentication, permissions, data hosting, usage management,\
    \ as well as dApp-to-Internet communication. EOS is backed by a web toolkit store\
    \ that aims to make app development as painless as possible. EOS is made up of\
    \ two main components: the EOS.IO software and EOS tokens. To use network resources\
    \ and build and run DApps, a developer-only needs to hold EOS coins rather than\
    \ spend them. Token holders who do not have any apps running can rent or allocate\
    \ their bandwidth to other participants who do. EOS was founded by Dan Larimer,\
    \ who is also the founder and creator of well-known platforms such as Bitshares\
    \ and Steem. It is currently owned by the block. One company.\n\n### 3.5.17 Bitcoin\
    \ \n\n![The Top 10 Risks Of Bitcoin Investing (And How To Avoid Them)](Images/image00217.jpeg)\n\
    \nGiven below is a chronological state of events related to Bitcoin.\n\nInitial\
    \ Failure\n\nAlthough cryptocurrencies were not legally mined until 2009, in previous\
    \ years, there were other attempts to set up a digital currency. In 1998, two\
    \ founders of cryptocurrencies, Wei Dai and Nick Szabo published ideas on the\
    \ prospect of currency decentralization. Both of their proposals revolved around\
    \ digital currencies as a means to replace conventional financial system inefficiencies,\
    \ such as spending money on paper and coin currency formation. Although no proposal\
    \ came to fruition, more than a decade later, both Dai and Szabo became early\
    \ cryptocurrency adapters. The first true cryptocurrency’s creation, Bitcoin,\
    \ was a result of these initial failures.\n\nOctober 2008  \n\nThe world of crypto\
    \ currency started when a white paper Bitcoin was published by a \n\nperson or\
    \ group of people: A Peer-to-Peer Electronic Cash System under the pseudonym of\
    \ Satoshi Nakamoto. This publication explained what Bitcoin is why it is equivalent\
    \ to conventional financial schemes, and by introducing the blockchain to the\
    \ world, it appeared to fix the missing piece in digital currencies for the first\
    \ time. The paper by Nakamoto followed up on some of the early concepts that struggled\
    \ to appear a decade ago and became, as we know it, the base for crypto currencies.\n\
    \nDiscovering the identity of Satoshi Nakamoto \n\nThe actual identity of Bitcoin's\
    \ inventor is one of the biggest mysteries of the contemporary world. Over the\
    \ years, several theories about who Satoshi Nakamoto is have surfaced, including\
    \ that he is a time traveler, a space alien, a rogue artificial intelligence,\
    \ or a front for the NSA, CIA, and Yakuza. Satoshi Nakamoto is a pseudonym chosen\
    \ by the person as a name who invented Bitcoin to hide their true identity. People\
    \ doubt his claim to be Japanese, as he was born on April 5, 1975, and currently\
    \ resides in Japan. This is owing to his native-level mastery of the English language\
    \ and his desire for working hours more matched with those in the United Kingdom. "
