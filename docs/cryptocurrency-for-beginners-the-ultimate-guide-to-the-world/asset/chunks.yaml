- raw: "Unlike commodity-based currency, such as gold, copper and silver, the most\
    \ significant aspect of fiat money is the stability of its value. As governments\
    \ and banks stepped in to shield their economies from the regular busts of the\
    \ economic cycle, the use of fiat money became widespread in the 20th century.\
    \ Because of the daily market cycle and occasional recessions, commodity-based\
    \ currencies became volatile. Central banks will, if they will need, print or\
    \ retain paper currency, allowing them greater power over the flow of capital,\
    \ interest rates, and liquidity. For instance, the management of money supply\
    \ and demand by the Federal Reserve helped it to handle the 2008 Global Financial\
    \ Crisis by inflicting more damage to the U.S. financial system and the global\
    \ economy. The global financial crisis showed otherwise, although fiat money is\
    \ seen as a more robust currency that can provide a cushion against recessions.\
    \ While the money supply is regulated by the Federal Reserve, it was not enough\
    \ to avert the unfolding of the crisis. The restricted supply of gold renders\
    \ it a more stable currency as compared to fiat money that has an infinite supply.\n\
    \n## 2.3 Measurement of Money\n\nBut how much money is out there, exactly, and\
    \ what are the forms it takes? This question is asked by economists and investors\
    \ to determine if inflation or deflation exists. To make it definable for measurement\
    \ purposes, money is separated into three categories. We arrive at the money supply\
    \ of a country or the total amount of money within an economy by adding the under-mentioned\
    \ three categories together.\n\n*   First Money Category-M1\n\n*   Second Money\
    \ Category-M2\n\n*   Third Money Category-M3\n\n### 2.3.1 The Origin of Money\
    \ \n\nThere are three major theories with regard to the origin of money:\n\nMoney\
    \ was created for trading purposes\n\nFor trade purposes, most economists believe\
    \ that money evolved because it was more flexible in contrast to bartering. This\
    \ meant that currency was in itself a precious asset, such as cattle in ancient\
    \ civilizations, gold and silver by weight later, and gold and silver coins eventually.\
    \ All this sounds fair enough when you know that it is an attempt to explain the\
    \ roots of metallic currency; otherwise, cattle don't fall into this definition\
    \ of metallic money. Moreover, a high degree of growth would be expected through\
    \ metallic money: it would suggest an acknowledgment of private property in contrast\
    \ to tribal property: it would imply recognition of contracts and compliance by\
    \ a legal structure. At the same time, cattle are much easier to be recognized\
    \ as money since it is easy for a primitive culture to value, to unilaterally\
    \ impose a value without a legal structure.\n\nMoney was created for social purposes\n\
    \nThe second theory says that for social reasons, money was created, such as fixing\
    \ a bride's price or blood money for someone killed or wounded by another tribe.\n\
    \nMoney was created for religious purposes\n\nThe third theory says that money\
    \ was created for religious purposes. In his book Holy Gold, Bernard Lam notes\
    \ that the root of money was in the Eastern temples. It was used as the mandated\
    \ sacrifice to the gods and for the priests' payment.\n\nThe monetization of gold\n\
    \nAround 1500 BC and 1000 BC, by weight standard, the medium of exchange changed\
    \ from a cattle standard to gold. In transforming gold into money, the temples\
    \ played a major role. Gold and silver have accumulated in the temples over the\
    \ years. For decorative purposes, so much was needed. The fact that so much gold\
    \ was collected by the temples must have been a key factor behind the decision\
    \ to turn it into money or monetize it. The theory is that by monetizing it, the\
    \ priests would have wanted to use up some of this excess gold: they may have\
    \ estimated, for example, that 1 cow was worth 130 grams of gold. The priests\
    \ must have been paid for their services overtime, such as guidance on where to\
    \ grow crops, and would have come up with a standard fee for these services. The\
    \ theory that by using arbitrary decisions, the priests calculated the value of\
    \ gold contradicts the origin of money trading, which suggests that the value\
    \ of gold was determined by the tasks performed in mining it and shaping it into\
    \ a regular unit of money.\n\nMoney through ages\n\nApplying reasoning to these\
    \ three hypotheses, one can imagine how a cow was a common unit of money in ancient\
    \ Ireland and Greece. In those times, one slave girl was worth 3-4 cows in both\
    \ these two ancient civilizations. It is easy to value a cow; how old the cow\
    \ is, how many calves the cow is likely to have; how much milk the cow is likely\
    \ to produce; the value of its hide and beef, its manure, its pedigree, etc. But\
    \ how do you value, say, 130 grains of gold, which seems to have been the normal\
    \ weight of a gold monetary unit in ancient times? The priests had the authority\
    \ in the general public; they had an ample supply of gold; they calculated the\
    \ price for their services; and when they wanted to monetize gold, they could\
    \ determine its worth in comparison to the price of the normal unit of account\
    \ of money than in nature, which was a cow. The hypothesis of the origin of money\
    \ in western society that makes more sense is that money was produced for religious\
    \ reasons. Money was given worth by order by the temples' priests. Therefore money,\
    \ in the form of gold or silver by weight, was the first fiat currency. It had\
    \ meaning both as a form of payment and even as a commodity.\n\nAristotle, Greek\
    \ Philosopher (384 BC – 322 BC)\n\nClearly, Aristotle grasped the essence of capital\
    \ in the 4th century BC, nearly 2,500 years ago. Money is not an asset, and like\
    \ gold or silver, it cannot be mined. Money, like wheat or barley, is not a crop\
    \ to be harvested. Money is not a cow or a goat-like animal. Money's essence is\
    \ that it is a lawful invention. A creature of the law is money. The Greek word\
    \ for money is 'nomisma,' which means the statute or binding tradition. Aristotle\
    \ described money as an abstract legal force which for the common good, was publicly\
    \ regulated.\n\nMoney is the fourth branch of Government\n\nThree branches of\
    \ government are alluded to by political scientists: the Executive, the Legislature\
    \ and the Judiciary. Stephen Zarlenga claims persuasively and cogently in The\
    \ Forgotten Science of Finance' that there is a fourth branch of government called\
    \ The Money Power (whether we know it or not). Money Power is the authority in\
    \ any given country to issue money. This term was invented by Martin Van Buren\
    \ (8th US President, 1782–1862). In specifically mentioning that The Money Force\
    \ is by far the strongest of all government branches, Stephen Zarlenga has made\
    \ the biggest contribution to monetary reform. The fact that this is not typically\
    \ known as such has contributed to a pronounced distortion of society and corruption.\n\
    \n## 2.4 New Types of Currencies\n\nAttempts have been made in recent years to\
    \ establish new types of currency that are not regulated by banks or governments.\
    \ It should, however, have the same characteristics as currency, such as being\
    \ scarce but easy to carry and transfer, and so on. Cryptocurrencies, also known\
    \ as digital currencies, meet all of these criteria. Bitcoin is an example of\
    \ a cryptocurrency that is based on the blockchain method, in which transactions\
    \ are verified by a group of people rather than a single person. The disadvantage\
    \ of cryptocurrencies like bitcoins is that currency control is once again concentrated\
    \ in the hands of a few individuals. As a result, the goal of decentralization\
    \ has not been fully realized.\n\nBottom line"
