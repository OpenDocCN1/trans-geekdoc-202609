- raw: "The life of every person is full of pleasant and unpleasant experiences. Pleasant\
    \ experiences are a logical result of successful achievements in life. These achievements\
    \ gratify your inner self, are construed as remarkable events and are consequently\
    \ registered as highs in your life. However, life does not offer or guarantee\
    \ success in all of its quests. It has unpleasant surprises in its repertoire\
    \ for every person. Therefore, you have to taste the bitterness of failure during\
    \ the span of life. These failures, contrary to successful achievements, are marked\
    \ or registered as lows in your life. Likewise, the mood of a person is also subject\
    \ to highs and lows. These highs and lows of mood are typically characterized\
    \ as mood swings. These swings in mood or crests (highs) and troughs (lows) are\
    \ incredibly conspicuous and striking features of nature too. In fact, nature\
    \ owes its astounding and enthralling beauty to its frequently changing features\
    \ and scenarios. After all, it is the changing seasons that provide a splash of\
    \ color and embellishment to nature. This change or anticipation of imminent change,\
    \ contrary to a mundane environment or a stereotype task, offers a score of learning\
    \ and grooming opportunities. New challenges and frequently changing conditions\
    \ or scenarios help you to train and prepare for complex situations. The premise\
    \ behind all investment decisions is to generate money in a smart and efficient\
    \ manner while keeping the risk factors to the minimum. You, as a prudent investor,\
    \ have to make a decision to select the best investment opportunity from the available\
    \ options. You, being the investor, will be guided in your quest by researching\
    \ for answers to different critical questions like what investment option offers\
    \ the most secure return with regard to Investment Time, where that particular\
    \ investment option is currently in its Business Cycle, and when is the best time\
    \ for committing the Investment Amount? Prices, as mentioned above, do not move\
    \ in a straight line and the price activity is shaped by scores of factors stemming\
    \ from changes in political and industrial policies to frequent shifts in international\
    \ business supply and demand factors. This standard operating procedure is usually\
    \ also followed in the Capital and Currency Markets with the addition of another\
    \ crucial factor that attempts to seek and investigate the reasons behind such\
    \ an investment decision. Succinctly, an investment decision in the popular NFTs\
    \ revolves around the same. An investment or trading decision, no matter how smart,\
    \ could result in the wiping of funds if not exquisitely timed. Besides, you also\
    \ have to address and define the risk factor and profit objective. All investments\
    \ are made in pursuit of profit. The profit objective has to be ascertained at\
    \ the time of investment or trading decision to help you exit successfully from\
    \ the market. \n\n## 1.1 Medium of exchange and its evolution\n\nThe term \"medium\
    \ of exchange\" refers to an instrument that facilitates the exchange of goods\
    \ as well as services between individuals or parties. Paper currency is currently\
    \ the most widely used medium of exchange. The medium of exchange can be defined\
    \ simply as anything that is ubiquitously used in the exchange of goods or services.\
    \ A medium of exchange, in other words, is something that is commonly used in\
    \ the buying and selling of products and services. However, there are some prerequisites\
    \ that must be met before an instrument can be used as a medium of exchange. Everyone\
    \ must be on board with the instrument. It will be impossible to facilitate the\
    \ sale and purchase of goods and services if an instrument is not widely accepted.\
    \ It should also serve as a measure of value. Accounting is made easier with a\
    \ standard of value.\n\n## 1.2 Evolution phases\n\nThe concept of a medium of\
    \ exchange has been around for since long. Now we will describe in detail that\
    \ how the instrument has evolved over time.\n\n### 1.2.1 Barter System\n\nThe\
    \ barter system is the oldest system with regard to a medium of exchange. Mesopotamians\
    \ are thought to have introduced it around 6,000 BC. Services and goods were exchanged\
    \ in this system. As a medium, there was no separate tool. Rather, goods and services\
    \ served as the instruments. Despite the fact that this system was quite straightforward,\
    \ it had a number of flaws. To begin with, the barter system necessitated locating\
    \ a party with products of equal value, which was not always possible. Second,\
    \ obtaining an exchange rate for all of the commodities was nearly impossible.\
    \ Third, it was unable to develop the economy due to the scarcity of products.\
    \ Fourth, because the comparable value of products was not always available, this\
    \ system was virtually impossible to follow. Because of these flaws, the barter\
    \ system fell out of favor, and the concept of currency was born.\n\n![Money as\
    \ A Medium of Exchange - Edusaint](Images/image00199.gif)\n\n### 1.2.2 Introduction\
    \ of cowry shells as a medium of exchange\n\nCowry shells were used as coins in\
    \ 1,200 BC to overcome the shortcomings of the barter system. These shells were\
    \ small, convenient, and long-lasting, and they couldn't be forged. However, they\
    \ were too readily available, making them too easy to obtain and eroding their\
    \ value.\n\n### 1.2.3 Gold metals as a medium of exchange\n\nTo address this issue,\
    \ it was suggested that a medium be discovered that was both unique and hard to\
    \ forge. Because metals met this requirement, metal coins were created. To serve\
    \ as a medium, small gold coins were minted. The weights of these coins represented\
    \ their value. The use of precious metals had the disadvantage of not being readily\
    \ available in every location. There was also an increased risk of theft.\n\n\
    ### 1.2.4 A comparative analysis of gold and money\n\nJohn Maynard Keynes described\
    \ gold as the “barbarous relic.” He was alluding to the fact, based on his belief\
    \ and analysis, that gold’s usefulness and its value are antiquated. It was in\
    \ 1971 when [Nixon took the world off of the gold standard](http://www.youtube.com/watch?v=MrBlD1AbvAo),\
    \ proclaiming, “We’re all Keynesians now.” Milton Friedman once famously said,\
    \ “Money is what money does.” This means that anything can be classified as money\
    \ provided; it can be used as a medium of exchange. Convicts, for example, often\
    \ trade cigarettes for goods and services, so in prison, cigarettes are money.\
    \ Likewise, for most of human history, gold has been a medium of exchange. In\
    \ today's economy, paper cash is the preferred form of payment. Some argue that\
    \ the sole advantage of gold is that it is a substance that is utilized in jewelry.\
    \ The opposing camp, on the other hand, claims that gold is a unique asset with\
    \ a variety of inherent attributes that make it vital for investors to maintain\
    \ in their portfolios. The question is whether or not the gold is still valuable.\
    \ Gold is unquestionably associated with money. Surprisingly, governments all\
    \ around the globe own substantial amounts of gold and have recently begun to\
    \ increase their gold holdings. The question is: If gold is not money, why would\
    \ they own it all? If the answer is “yes,” then what is its value? The overwhelming\
    \ evidence from the past suggests that gold was used and was useful as a medium\
    \ of exchange, as elaborated below:\n\n### 1.2.5 Gold’s brief history"
