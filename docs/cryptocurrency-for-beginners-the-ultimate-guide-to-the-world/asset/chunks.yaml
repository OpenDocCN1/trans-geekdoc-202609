- raw: 'Fiat money, which typically does not need support from a physical commodity,
    is the second form of money. Instead, supply and demand and the confidence of
    people in its worth set the value of fiat currencies. A Fiat currency is a currency
    that does not have any inherent worth and is usually established by government
    legislation as a legal tender. Currencies have historically been dependent on
    physical resources such as gold and silver, but fiat currency is dependent on
    the economy''s credit. The value of fiat money relies on supply and demand, and
    as an alternative to consumer money and representative money, it was adopted.
    Commodity money is derived from precious metals like silver and gold, while representative
    money is a claim that can be redeemed for a commodity. Fiat money evolved because
    gold was a finite resource, and fast-growing economies could not always mine enough
    gold to support their demands for currency supply. The need for gold to offer
    money value is extremely inefficient for a booming economy, particularly when
    its value is really generated by the perceptions of people. Fiat money is the
    token of the perception of value by people, the cornerstone for the creation of
    money. A growing economy is evidently succeeding in generating other useful items
    for it and other economies. The bigger the economy, the more perceived (and increasingly
    sought after) its capital would be and vice versa. The perceptions of people,
    though, must be backed by an economy that can deliver the goods and services that
    individuals require. In 1971, for instance, the U.S. dollar was withdrawn from
    the gold standard, the dollar was no more redeemable in gold, and the gold price
    was no longer set against any dollar value. This suggested that it was now possible
    to produce more paper money than the gold that was available to back it. The U.S.
    dollar''s value would decrease both domestically through inflation and globally
    through currency exchange rates if the economy slows. The U.S. economy''s implosion
    would send the globe into a bleak financial age, but many other nations and institutions
    are striving relentlessly to make sure it never does. Still, as determined by
    inflation, the value of a currency (not only the dollar but most currencies) is
    decided simply by its buying power. That''s why merely printing new money won''t
    produce a country''s income. Money is generated through a sort of constant relationship
    between objects that are true, concrete, our appetite for them and our abstract
    belief in what has worth. Money is good because we like it, but we just want it
    because it will get us a product or service that we like. China, around 1000 AD,
    was the first nation to use fiat money, and the currency eventually spread to
    other countries around the world. When US President Richard Nixon enacted a bill
    that prevented the converting of the U.S. dollar into gold, it became famous in
    the 20th century. Many nations still use paper-based fiat currencies that function
    only as a mode of payment. Unlike standard currencies dependent on commodities,
    it is not possible to exchange or reclaim fiat currencies. It is inherently worthless
    and is used by the order of the state. The government must safeguard it against
    counterfeiting and maintain the money supply responsibly in order for a fiat currency
    to be effective.


    ### 2.2.1 History of Fiat Money


    In the 10th century, Fiat money emerged from China, primarily in the dynasties
    of the Yuan, Tang, Song, and Ming. There was a strong demand for metallic currency
    in the Tang Dynasty (618-907) that surpassed the availability of precious metals.
    The individuals were acquainted with the use of credit slips, and paper or paper
    drafts were readily accepted by them. A lack of coins caused people to turn from
    coins to notes. There was a thriving industry in the Tchetchuan area during the
    Song Dynasty (960-1276), which led to a lack of copper money. Traders began issuing
    private notes backed by a cash reserve, and the first legal tender was thus issued.
    In the Yuan Dynasty (1276-1367), paper money became the only legal tender, and
    the issuance of notes was granted to the Ministry of Finance during the Ming Dynasty
    (1368-1644). In the 18th Century, the West began using paper currency. The American
    colonies, the Continental Congress and France, continued to issue bills of credit
    that were used to make payments. Notes were issued by the regional governments
    that the holders would use to pay the authorities'' taxes. Because of the risks
    of inflation, the issuance of so many credit bills produced some controversy.
    The bills depreciated significantly in some countries, such as New England and
    the Carolinas, and as the bills lost value, there was an increase in commodity
    prices. Countries shift to fiat currencies during conflicts to preserve the worth
    of precious metals such as gold and silver. For instance, during the American
    Civil War, the United States Federal Government switched to a form of fiat currency
    referred to as "Greenbacks." During this war, the government suspended the convertibility
    of its paper money to gold or silver. The government and banks had pledged in
    the early 20th century to facilitate the conversion of coins and notes into their
    nominal commodity. The high expenses of the American Civil War and the need to
    restore the economy, however, forced the government to terminate the redemption.
    The value of one troy ounce of gold was set, by the Bretton Woods Deal, at 35
    United States dollars. In 1971, however, the President of the United States, Richard
    Nixon, launched a variety of economic measures, including the cancellation of
    the direct convertibility of dollars into gold owing to the decline in gold reserves.
    Since then, fiat currencies that are exchangeable between major currencies have
    been adopted by most countries.


    ### 2.2.2 How Does Fiat Money Work


    The Fiat currency is not backed by any actual asset but by its investors'' confidence
    and by a government declaration. Paper money serves as a buying power''s storage
    medium and an alternative to the barter method. It helps consumers, as was the
    case with barter trading, to purchase goods and services that they need without
    having to trade product for product. Because of its capacity to store buying power,
    individuals can conveniently make plans and build specialized economic activities.
    A company concerned with cell phone assembly, for example, will purchase new appliances,
    recruit and pay workers, and spread into other areas. The value of fiat money
    depends on how the economy of a nation works, how the country rules itself and
    the effects on interest rates of these variables. It is possible that a nation
    with political instability would have a weakening economy and inflated oil prices,
    making it impossible for individuals to import goods if they would need them.
    When the public has enough faith in the ability of the currency to serve as a
    storage medium for buying power, a fiat currency works well. It must also be backed
    up by the government''s full credit, which gives a declaration and prints it as
    a legal tender for financial transactions.


    ### 2.2.3 Advantages and Disadvantages of Fiat Currency'
