    ## 6.4 Legitimate and New NFT marketplaces


    NFTs are one-of-a-kind objects that can''t be replaced with anything else. The
    majority of NFTs are now digital. This makes it particularly simple for creators
    to deliver something rare and distinctive to their fans. Some NFTs, for instance,
    are digital artworks, which are now being collected in the same way that collectors
    have been collecting actual paintings for years. And some of these NFTs have fetched
    astronomical sums. The first NFTs were part of the Ethereum blockchain, which
    holds additional electrical data to identify them from each other. NTFS is now
    supported by other blockchains as well. Because different NFTs use different blockchain
    technologies, not all NFT marketplaces transact all types of NFTs. NFT marketplaces
    are frequently chosen by creators based on whether or not they support a specific
    NFC token standard. ERC-721 and ERC-1155 are the two Ethereum standards that have
    been produced so far. Binance, a competitor, has since developed BEP-721 and BEP-1155
    specifications. Because they allow several NFTs to be bunched and transacted together,
    the two standards diverge from the original "721" specifications. Most NFT platforms
    require purchasers to have a digital wallet and pay for their purchases using
    cryptocurrency.


    ### 6.4.1 [OpenSea](https://opensea.io?ref=0x4509a6dd84e88fd0d894726abb036d98e411c966)


    OpenSea claims to be the largest NFT marketplace in the world. Non-fungible tokens
    include art, censorship-resistant domain names, virtual worlds, trading cards,
    sports, and collectibles. Assets based on ERC721 and ERC1155 are also included.


    ### 6.4.2 [Rarible](https://rarible.com/)


    Rarible is a society NFT marketplace that employs the RARI token as its "ownership"
    token, which is an ERC-20 token. Rarible gives the RARI token to active users
    that buy or sell on the NFT marketplace. It delivers 75,000 RARI every week. On
    the platform, art assets are given great attention.


    ### 6.4.3 [super rare](https://superrare.co/)


    Super rare is primarily a marketplace for consumers to buy and sell one-of-a-kind,
    limited-edition digital artworks. Each piece of art is generated by a network
    artist and tokenized as a crypto-collectible digital commodity that you can own
    and trade. They define themselves as a cross between Instagram and Christie''s,
    providing a new way to engage with art, culture, and collecting on the internet.
    Each piece of art on SuperRare is a digital collectible, a digital object that
    is encrypted and monitored on the blockchain. On top of the marketplace, SuperRare
    has constructed a social network. Digital collectibles are ideal for a social
    setting since they have a clear record of ownership.


    ### 6.4.4 [Foundation](https://foundation.app/)


    Foundation is a niche platform that brings together digital innovators, crypto
    natives, and collectors to advance culture. It''s dubbed the "new creative economy."
    It is mostly concerned with digital art. In August 2020, they launched an open
    call for creators to work with crypto and explore the concept of value in their
    first blog post on their website. The creators were invited to hack, sabotage,
    and distort the value of creative work. When an NFT trades on Foundation, the
    artist receives 10% of the secondary transaction value, i.e., when a collector
    resells their work to someone else for a better price, the artist receives 10%
    of the sales value.


    ### 6.4.5 [AtomicMarket](https://wax.atomicmarket.io/)


    AtomicMarket is an NFT market smart contract with shared liquidity that is used
    by numerous websites. Everything posted on one market appears on all other exchanges,
    which is known as shared liquidity. It''s a marketplace for Atomic Assets, a non-fungible
    token standard based on the eosio network. The Atomic Asset standard can be used
    to tokenize and generate digital assets, as well as to purchase, trade, and auction
    assets on the Atomic Assets marketplace. On the AtomicMarket, you can both put
    your own NFTs for sale and explore existing listings. NFTs from well-known collections
    are marked with a verification tick, making it easier to identify genuine NFTs.
    Collections that are malicious are placed on a blacklist.


    ### 6.4.6 [KnownOrigin](https://knownorigin.io/)


    KnownOrigin is an online marketplace where you can find and purchase rare digital
    artwork. Every piece of digital art on KnownOrigin is genuine and one-of-a-kind.
    Creators can utilize the site to show off their work and sell it to collectors
    that value authenticity. The Ethereum blockchain protects it. Creators can upload
    digital artwork to the KnownOrigin gallery as a jpg or Gif file, with all files
    stored on IPFS.


