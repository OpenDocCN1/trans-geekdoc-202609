- - '##'
  - 5.4 NFT and block chain
- - '#'
  - 尽管 NFT 在数字金融生态系统中仍是“光彩夺目”的新宠，但其实用性和市值尚未实现。NFT 必须在中市场环境中进行展示和提供，而非仅限于奢侈品或高端机会，才能实现其面向普通消费者的潜力。普通消费者需要获取信息、搜索、比较并购买的能力。买家旅程的发现阶段至关重要，别忘了冲动购买的力量。这很可能导致
    NFT 市场更加专注于特定用例。OpenSea 是最早的 NFT 市场之一，正在快速增长。2021 年 OpenSea 的交易量增长了 12,000% 以上，6
    月单月即完成了 1500 万美元的 NFT 交易。如果不计其他好消息，其用户基数在六个月内从 315 人增长到 14,520 人，推动公司在 8 月达到 30
    亿美元的月度 NFT 交易额。所有这些都是 NFT 及整个数字金融行业的好消息，但专用市场无法像阿里巴巴这样具有国际知名度的强大企业那样快速推动行业发展。因此，阿里巴巴最近的公告极具吸引力。
