- pgno: 89
  md: 'In Figure 3.2, the five meta-functions of “learning is a journey” are presented
    as categories which subsume hundreds of specific metaphors. They give generalized
    insights into holistic views of language learning based on Chinese cultures of
    learning. The meta-functions related to metaphors for teachers can be compared
    for different nuances between those of participants in China (Jin & Cortazzi 2020),
    Malaysia (Cortazzi & Jin 2020b), and Iran (Cortazzi et al. 2015). In Figure 3.2,
    we list examples (quoting metaphor sources and entailments) to show meta-functions
    common to both the “learning journey” and “language teachers” who guide students
    in their journeys.


    For curriculum and learning theorists, learning has different major functions:
    some cognitive functions centrally relate to knowledge and understanding; some
    affective functions relate to student emotions and motivation; social and cultural
    functions relate to living in society and transmission and innovation within cultural
    heritages. Some theorists seek to combine cognitive, affective, social, and cultural
    foundations of learning (Illeris 2016, 2018; Joyce et al. 2008; Wells & Claxton
    2002) and some theorists add ethical, moral, and spiritual dimensions (Bigger
    & Brown 2012; Eaude 2008; Lucas & Claxton 2010; Lucas et al. 2013) and argue for
    the role of aesthetics (Abbs 2012) as part of embodied learning


    ![](img/5148f48c5f0c46f3e824e5080bd81aae_89_0.png)


    Figure 3.2 Teachers Guide Chinese Students’ Journeys of Learning, as Expressed
