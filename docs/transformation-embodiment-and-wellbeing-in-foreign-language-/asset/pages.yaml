- pgno: 61
  md: 'resistance—it sees it as something that must be recognized and managed. And
    because resistance and engagement are considered emergent properties—they are
    a reaction to the challenges of learning—they are not thought to reside within
    the learner as a finite or essential quality. And while it’s recognized by specialists
    that motivation is dynamic (Dörnyei et al. 2015), it’s not uncommon for teachers
    and learners to talk about “having” or “losing” motivation. In contrast to this,
    the adjustment perspective emphasizes the idea that motivation is a dynamic process—a
    state which can be nurtured in an ongoing way—rather than something that is solely
    within the learner.


    # Surface, Deep, and Mixed States


    Because approach and avoidance motivation involve distinct motivational systems
    (Rutherford & Lindell 2011), the adjustment perspective on offer here accepts
    that resistance and engagement can and do co-exist—learners may feel both a desire
    to learn yet resist the demands of learning as well. Shaules (2007) has explored
    these mixed states as they relate to cross-cultural adaptation. He describes sojourners
    who are happy to adapt to surface elements of life in a foreign country—food,
    transportation systems—but who resist deeper elements of change (e.g., they don’t
    learn the local language; are critical of local cultural values). He describes
    this as mixed state because it involves contradictory reactions to adaptive demands—often
    surface adaptation together with deeper forms of resistance. This is captured
    in the quip of one British sojourner who declared “I love France but I hate the
    French.” Presumably, loving “France” relates to the wine, food, and forms of French
    culture, whereas “the French” referred to deeper elements of French cultural norms
    and communication styles.


    Such comments are not uncommon with language learners, as when we hear I love
    Italian but I hate my Italian class. This perspective also helps explain why learners
    may say one thing (I want to be a fluent English speaker) but do another (I never
    to my homework). This hints at the complexity of this adjustment dynamic, in which
    openness to and interest in learning (engagement) often coexists with aversive
    responses (resistance) to the challenges of learning. Those with the greatest
    desire to learn may even feel frustration more acutely due to slow progress. Learners
    may consciously think of the FL as important and fun (surface engagement), yet
    also feel frustration and a lack of desire to make effort or practice (deep resistance).
    The psychological dynamic of these complex motivational states can be represented
    as in Figure 2.2.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/5148f48c5f0c46f3e824e5080bd81aae_62_0.png)


    **Figure 2.2**  Surface and Deep Resistance and Engagement


    # A Case Study in Adjustment and Transformation


    Using terminology like *resistance*, *adaptive demands* and *psychological adjustment*
    may create the impression of extreme emotional states or intense psychological
    disruption. Often, however, the dynamic of resistance and engagement operates
    at subtle levels of the self. One example of this played out recently over the
    loudspeakers on Tokyo subways. One of the companies running the subway system
    decided to change its policy regarding in-train announcements in English (Iki
    2021). Rather than using automatic recordings of “native” speakers, train conductors
    were encouraged to announce coming stops in English themselves. The decision was
    based on feedback from foreign customers, who felt that “perfect” recorded announcements
    implied that train'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'staff couldn’t be approached in English. Even rudimentary interactions in English
    were reassuring to international travelers.


    According to news reports, the policy at first met with resistance from conductors
    who felt their English was inadequate for the transmission of such important information.
    To overcome this hesitation, the company did not rely on English-language training
    or mandate change. Instead, it took a more purely psychological approach, creating
    a peer-based information campaign focused on changing how the conductors perceived
    using English. Conductors who had already made the switch to using English on
    the job shared their experiences, including the positive interactions they had
    with foreign passengers. Instead of talking about English in terms of information
    which had to be transmitted “correctly,” it was presented as a way to help appreciative
    passengers—something conductors could brag to their grandchildren about. Thanks
    to this campaign, increasing numbers made the switch and reported satisfaction
    in using English in their work.


    While not a research study, this story illustrates the different elements highlighted
    by the adjustment perspective, and also serves to show how the adjustment process
    can result in a transformative learning experience.


    # Adaptive Demands and the Leap into the Unknown


    By asking conductors to begin making train announcements in English, the company
    was placing adaptive demands on them. Conductors faced a choice—either to continue
    to use Japanese or take the leap into the unknown of attempting to use English.
    Using English was a new experience for many conductors, and we can imagine that
    they felt pressured and uncertain about how to handle the request. The adaptive
    demands, in this case, relate to the psychological pressure that is experienced
    when faced with such choices. This reminds us that attempting to use a foreign
    language—even for linguistically “simple” tasks (e.g., making train announcements)—can
    have important psychological consequences. Even rudimentary foreign language use
    can be highly stressful and/or deeply meaningful. From the transformative perspective,
    conceiving of a linguistic task as “simple” because it requires only limited linguistic
    knowledge is fundamentally misconceived. Similarly, learners in the classroom
    setting face a series of choices each time they walk into the classroom, are given
    a homework assignment, called on in class, or put into a pair for language practice.
    They too must decide how much to invest in this leap into the foreign unknown
    of using a new language.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '**Resistance.** The hesitation of at least some of the conductors also reveals
    a natural tendency to *resist* the uncertainty, vulnerability, and responsibility
    (the psychological demands) of using a foreign language. Resistance is not necessarily
    experienced as a strong emotional reaction—it could simply be felt as a reluctance
    to try new things, a distaste for doing homework, or the hesitation to fully engage
    in a practice activity. Given that resistance is the equivalent of a self-protection
    mechanism to adaptive stresses, lowering resistance requires providing support
    and security. In this case, conductors were not forced to use English against
    their will by company policy. Instead, they had the example of their colleagues
    as role models and were encouraged to see how meaningful English use could be.
    A more heavy-handed approach (e.g., mandatory trainings) might have *increased*
    resistance to English.


    **Engagement.** If resistance is a form of psychological self-protection, then
    engagement is an opening up to the challenges of learning. This requires, most
    fundamentally, that learners find the endeavor meaningful. This story reminds
    us of the psychological importance of creating opportunities for meaningful use
    of the language. In this case, conductors were encouraged to see English announcements
    as a way to provide an important service to customers, and to take on a challenge
    that they could be proud of. Having meaningful learning contexts (in this case,
    real-life train announcements) may increase both the potential stresses of language
    use, but also the potential rewards. Because of this, attempting to create a psychologically
    “neutral” environment in the classroom, or trying simply to make activities “fun,”
    might not increase engagement much if the effort is not connected to meaningful
    outcomes.


    **Transformation.** The experience of the conductors reminds us that FLL involves
    a change to the experience of the self—it is an act of *becoming* a foreign language
    user, not simply a skill that must be perfected. This highlights the difference
    between mental effort—memorizing the phrases needed to make train stop announcements—and
    the psychological *adjustment* necessary to integrate language into one’s sense
    of self (e.g., feeling comfortable using English to announce train stops). Assumptions
    about learning also influence how we experience the learning process. Japan is
    well-known for its exam-driven approach to foreign language education. Because
    of this, conductors were more likely to think of language learning in terms of
    “correct” usage and “perfect” pronunciation. By shifting their perception of language
    use, the information campaign opened them up to a different experience of language
    use. From the adjustment perspective, this “different experience” is a transformational
    element'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'of foreign language learning—an evolution and development in the way that the
    foreign language is experienced, and by extension the degree to which it is increasingly
    experienced as a natural element of the self.


    # Pedagogical Reflections


    For this author, embracing the idea that the language learning involved a process
    of psychological adjustment took time. For many years, I taught intercultural
    communication as one subject and thought of the English teaching I did as largely
    separate. I researched the adaptive processes of long-term expatriates but did
    not relate that to what I did in the FL classroom. At a given moment, however,
    I realized that the psychological resistance to foreignness I encountered when
    studying cross-cultural adaptation was remarkably similar to the motivational
    struggles that my language students were facing. Long-term expatriates who failed
    to learn the local language spoke of language learning in terms that were remarkably
    similar to “unmotivated” students of English at my university. Often, they said
    that it was very important, yet found it difficult to become deeply engaged in
    learning. They resolved to make future progress yet often seemed stuck or discouraged.
    Typically, these struggling learners had only a superficial sense for how language
    learning could benefit them. They often spoke of it in transactional terms (English
    as a way to get things done, travel more effectively, advance in one’s career).
    They regularly made self-critical comments, such as I’m a terrible language learner
    or I know I shouldn’t be so lazy.


    # Language Learning as a Journey


    These realizations had a gradual but significant impact on my pedagogical choices.
    I started speaking of language learning as a developmental journey that must be
    navigated, rather than a set of skills which must be accumulated (see also Chapter
    3, this volume). I place an emphasis on awareness activities that help learners
    become aware of, and thus better manage, their personal reactions to the challenges
    of that journey. I may, for example, begin the semester with activities in which
    learners reflected on their “relationship with English” by plotting their negative
    and positive feelings/experiences on a graph (Figure 2.3). This and other reflection
    activities encouraged them to actively manage their feelings and frustrations,
    and to see resistance to the challenges of language learning'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/5148f48c5f0c46f3e824e5080bd81aae_66_0.png)


    Figure 2.3 Plotting Language Learning as a Journey of Positive and Negative Feelings


    as a normal part of the learning process. Activities that made learners nervous
    (e.g., giving presentations in front of their peers) were described in terms of
    getting comfortable as an English user—like a mock tournament that helps us get
    ready to use the FL out in the world. I did not focus on trying to get students
    to have “fun” (e.g., by playing games). Instead, I increasingly emphasized FLL
    as a life choice and a challenging journey on which the challenges go hand in
    hand with its satisfactions.


    The adjustment perspective has helped me make sense of the complex motivational
    states in my students that I previously found contradictory—e.g., having good
    intentions yet failing to try hard; liking a foreign language but feeling like
    a failure as a learner. I have come to believe that negative learning experiences
    are not simply a momentary anxiety response. Resistance is a form of psychological
    self-protection that can turn off learners to language learning long term. It
    can also make learners become self-critical—blaming themselves for their failures
    (e.g., I’m terrible at English; I’m a lazy student). When this happens, the language
    learning process has brought about destructive change rather than positive transformative.
    Ideally, helping learners recognize that resistance is a natural part of the learning
    process may help them gain autonomy and self-efficacy, something that is an important
    element of the transformative learning experience (Little 2021). Also I now less
    often speak of motivation in binary terms (e.g., motivated vs. unmotivated) or
    of learners “having” or “losing” motivation—as though it was an object or precious
    substance.'
