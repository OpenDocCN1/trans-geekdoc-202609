  md: '# Humanistic Motivation and Transformative

    Language Engagement


    Zi Wang


    # Introduction


    Against the backdrop of globalization, the field of language education has witnessed
    increasing ascendence of instrumentalist views of language and language learning
    propelled by neoliberal ideologies associated with global capitalism. In the global
    economy, there is the tendency for a person to be perceived as a bundle of skills
    and for language to be commodified as a soft skill and seen as a form of capital
    (Heller 2010; Holborow 2012). Such a neoliberal emphasis on the value of a language
    “in terms of its usefulness in achieving specific utilitarian goals, such as access
    to economic development or social mobility” (Wee 2008: 32) has given rise to market-driven
    language education agendas (Leung & Scarino 2016) and marginalized humanistic
    approaches toward language education. The marginalization has the potential to
    constrain our thinking about the transformative potential of language learning
    and the fact that many language learners and teachers are motivated to achieve
    more than just the acquisition of skills (e.g., Muir 2020; Pinner & Sampson 2021;
    Ushioda 2020).


    Indeed, the field of language education has seen a growing number of calls for
    more humanistic understandings of language learning that see the learner as a
    whole person and recognize the potential for students to experience personal growth
    (e.g., Kramsch 2009; Leaver et al. 2021; Leung & Scarino 2016; Ros i Solé 2016;
    Shaules 2019; The Douglas Fir Group 2016).


    Recently, motivation research has also come to place more emphasis on taking a
    humanistic view, which involves understanding the subjective world'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'of the language learner and the ways that learning motivations are shaped by
    learners’ personal understandings of language as a means for self-transformation
    and personal growth in multiple dimensions of life (e.g., Clarke & Hennig 2013;
    Harvey 2017; Ushioda 2011; Wang et al. 2021). Such a view helps illuminate how
    learners make sense of their engagement with various aspects of the language learning
    process (Dörnyei 2019) and dynamically shape and regulate their language learning
    motivation in relation to their broader life motivation (Harvey 2017). From a
    pedagogical viewpoint, motivation research carried out within a humanistic view
    also has the potential to provide implications for teachers who aim to create
    learning environments which encourage learner motivation and self-transformation
    (Ushioda 2017). Therefore, this chapter adopts a broadly humanistic perspective
    to answer the following questions and discuss pedagogical implications:


    +   1. How do learners experience transformation in their language engagement?

    +   2. How is learners’ language learning motivation influenced by their transformative
    experience?


    It is worth noting that engagement is used in this chapter as a broad term to
    refer to a person’s personal and subjective experience of language-mediated tasks
    and activities, which is line with Dörnyei’s (2019) understanding of language
    learning experience from an engagement perspective.


    # Taking a Humanistic View of Language Learning Motivation


    In this section, I discuss a number of humanistically oriented perspectives and
    concepts in language learning motivation. One key defining element of a humanistic
    view of motivation is an understanding of the learner as a “thinking and feeling
    human being with an identity, a personality, a unique history and background”
    (Ushioda 2009: 220), as captured within Ushioda’s person-in-context relational
    view of emergent motivation. This view recognizes that learners can make personalized
    use of a language such as “to expand and express our identity or sense of self…
    to… broaden our experiences and horizons…” (Ushioda 2011: 204). In this sense,
    it foregrounds the centrality of learner agency, individual meaning making, and
    the potential for learners to experience a growth orientation that goes beyond
    satisfying instrumental goals. “Investment” is an additional concept that has
    humanistic resonance: it refers to'
