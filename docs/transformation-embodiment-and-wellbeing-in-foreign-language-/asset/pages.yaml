- pgno: 128
  md: 'learning, thereby leading to deeper processing. This stands in contrast to
    a surface approach to learning in which students are simply instructed to identify
    and memorize “details” such as rules. As mentioned at the outset of this chapter,
    teaching grammar at surface levels (i.e., by having students memorize rules and
    practice using the target language through mechanical drills) has been the dominant
    practice in L2 classrooms (Tyler 2012). Although interest in applying a task-based
    approach is increasing, the presentation of grammatical structures still tends
    to revolve around rules and exceptions. CL, on the other hand, treats grammar
    as meaningful, central to language use, and therefore providing more comprehensive
    and revealing grammatical accounts (Langacker 2008). A CL approach equips students
    with analytical tools that can point students to the underlying meaning and function
    of a given grammatical construction in naturally occurring discourse (Tyler 2012).
    As such, it helps students construct and convey meaning as opportunity to use
    the target language arises.


    As elaborated above, cognitive linguists maintain that language reflects general
    cognitive processes, and conceptual meaning has grounding in humans’ bodily experience
    and interaction with their socio-physical world. Thus, CL theories have been considered
    as some of the first theories that support the notion of embodied cognition in
    cognitive science (Barsalou 2008). This notion holds that “our bodies” movements
    through and interactions with their immediate physical environment influence the
    ways in which our minds operate (Giovanelli 2015: 43). Most linguistic structures
    are not seen as arbitrary; rather, they are motivated by “recurring patterns of
    embodied experience (i.e., image schemas), which are often metaphorically extended”
    (Gibbs 2005: 12). If language is motivated, the use of a given linguistic construction
    can be explained meaningfully. We have seen above how periphrastic causative constructions
    can be accounted for, and why a certain periphrastic causative can mean a certain
    thing, which distinguishes it from the other periphrastic causatives. The question
    is then how do language teachers engage their students with these constructions?
    If we recognize the embodied nature of cognition, our instruction should employ
    embodied learning activities.


    Embodied learning activities refer to activities that make use of speech, bodily
    movement, and physical visualization (Giovanelli 2015). These three features can
    serve as learning resources that can help students to make and express meaning
    in the classroom. Using the body for language learning has received empirical
    backing from research in neuroscience and cognitive science'
  merge: -1
  img_proc: true
- pgno: 129
  md: '(Macedonia & Mueller 2016; Macedonia 2019). As listed in Atkinson (2010), some
    important findings of research in those two fields include:


    +   - The brain areas responsible for language get activated during sensorimotor
    experience (Bonda et al. 1994)

    +   - Brain “motor regions” activate when we read action words that refer to our
    body parts (e.g., kicking, licking, and picking) (Hauk et al. 2004)

    +   - A sub-set of neurons that are activated when we do a physical action is
    also activated when we perceive someone doing the same action, a phenomena referred
    to as “mirror neurons” (Gallese & Goldman 1998; Rizzolatti & Craighero 2004)

    +   - Embodiment effects are present in memory (Glenberg 1997)

    +   - Embodied experience with objects helps us understand them (Carlson & Kenny
    2005)


    The notion that the body can play an important role in learning would not be something
    new to many language teachers. Many teachers will have used role-plays and drama
    activities in their language classrooms. In those activities, they teach gestures
    that L2 speakers use to enhance communication and encourage their students to
    incorporate gestures into their L2 speech. Another way to use gesture in the classroom
    is to utilize a technique called total physical response (TPR) (Asher 1988). However,
    Littlemore (2009) points out that TPR has not been used to teach abstract grammatical
    concepts and is not a communicative approach. There needs to be a pedagogy that
    utilizes CL-informed gesture to learn abstract concepts and can be combined with
    a more communicative approach such as Task-based Language Teaching.


    Such a pedagogy has been developed by Jean-Rémi Lapaire, a French cognitive linguist.
    He developed a kinesic approach to learning abstract grammatical concepts called
    kinegrams (Lapaire 2007). He argues that grammatical concepts contain perceptual
    and motoric equivalents that can give rise to meaningful imagistic-kinetic representations.
    The imagistic-kinetic representations of a certain grammatical concept can be
    expressed through metaphoric gestures referred to as kinegrams. Through this kinegrammatic
    approach, inherently abstract grammatical concepts are given concrete shape, making
    them “graspable” by learners. According to Giovanelli (2015), the kinegrammatic
    approach is an instance of what Holme (2012) refers to as “actual embodied experience”
    as kinegrams allow learners to experience conceptual meaning through active'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'physical movement. Giovanelli (2015) adds that learners could also benefit
    from visualization strategies such as diagrams and pictures that externalize concepts.
    In this way, learners get “virtual embodied experiences,” as opposed to “actual
    embodied experiences” (Giovanelli 2015: 54).


    # Creating Embodied Learning Activities to Teach English Causatives


    The embodied learning activities for teaching and learning English causatives
    that I will present here optimally use the body and the eye. That is, following
    the embodied learning activities that Giovanelli (2015) proposes for teaching
    other grammatical concepts, they utilize learners’ physical movement (actual embodied
    learning activities) and visual perception through diagrams and pictures (virtual
    embodied learning activities).


    As the notion of action chain is a basic cognitive concept of causatives, in teaching
    periphrastic causatives, teachers should begin with it first. In fact, the virtual
    embodied learning activities proposed in this chapter will utilize the diagrams
    in Figures 5.3b and 5.3c. Given the embodied nature of the notion, any actual
    embodied learning activity that highlights the transfer of energy from one entity
    to another is appropriate for teaching the concept. In the classroom, the teacher
    could briefly explain to the students that human language has strong bases in
    how we perceive and experience the socio-physical world, and to better understand
    the meaning and function of a linguistic structure, we should first understand
    the physical concept underlying the structure. The teacher, then, could make use
    of readily available resources in the school to introduce the concept of action
    chain. For instance, the teacher could demonstrate a domino effect by putting
    a row of three books upright, with a gap separating each book. After pushing the
    first book with a finger, the subsequent book in line will be knocked over, hitting
    the last book and causing all the books to fall to the ground. The teacher then
    presents the diagram in Figure 5.1 and points out that the teacher is the head
    and the tail is the ground. The teacher introduces the concept of action chain
    and explains that the energy comes from the head, transferred to the first book
