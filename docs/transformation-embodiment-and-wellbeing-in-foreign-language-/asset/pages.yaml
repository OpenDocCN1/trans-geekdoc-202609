- pgno: 42
  md: 'Analysis and other progressive classroom learning practices, Dr. Moskowitz
    helped reshape traditional graduate school classes [for future language teachers]
    into personal, participatory, and student-centered exercises. And she did it,
    former students said, with a unique blend of determination and compassion.” The
    Flanders system tracks quantitative and qualitative influences of teachers’ verbal
    behaviors and the overall classroom climate. In my view, Moskowitz brought the
    brightness of her heart and mind to warm every classroom she entered and each
    teacher’s life she touched.


    Many language educators working today in different parts of the world share the
    ideals of Rogers, Stevick, and Moskowitz. Humanistic approaches to language education
    have resulted in colorful metaphors about language teachers: therapist, counselor,
    loving parent, gardener, suggester, liberator, facilitator, reflective listener,
    nurturer of souls, and assistant to language students as they burst their cocoons
    (Cortazzi & Jin 1996; Stevick 1982, 1990, 1996, 1990; Underhill 1989). Breen (1985)
    described language teachers and students as students as inhabitants of intricately
    complex “coral gardens,” which they are exploring together. In a humanistic study,
    Oxford (2001) reported students’ positive metaphors by which they described their
    favorite language teachers.


    # Contemplative-Reflective Learning


    Transformative and holistic-experiential and holistic-humanistic education are
    fed by contemplative-reflective learning, also known as active reflection, contemplative
    practices, and contemplative inquiry. Emotions, particularly based on discrepancy
    and anomaly, can be a catalyst for reflective learning. Boud, Keogh, and Walker
    (1985) defined reflection as a general term for cognitive and emotional activities
    in which people engage to consider their experiences and come to new understandings.
    Boud is known for initiating the “Boud Reflection Model.”


    Contemplative learning encourages the learner’s transformation, for which critical
    thinking (usually a critique of grave societal problems) is inadequate. Contemplative
    learning can include meditating with deep and slow breath, being mindful and present,
    using creative visualization, and adopting a sense of humility, gratitude, love,
    and respect for all beings and all things (Culham & Lin 2020; Zajonc 2009). In
    fact, Zajonc discussed meditation in contemplative learning as “knowing that becomes
    love.” Additionally, contemplative learning can involve mental imagery, prayer,
    and walking in nature. Journaling is a written way to be contemplative, expressing
    emotions and thoughts about'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'challenges to established identity patterns. Like journaling, contemplative
    poetry can reveal a range of emotions, such as grief, joy, contentment, anger,
    and disillusionment. Contemplative learning can also include participating in
    drama, art, and storytelling; conducting rituals and ceremonies; dancing spiritually;
    and reflecting mindfully with yoga or tai chi (Burggraf & Grossenbacher 2007;
    Oxford 2016; Zajonc 2009). Additionally, contemplative learning can involve art,
    such as painting, drawing, and collage; reflecting on colors, shapes, images,
    and symbols; and discussing experience of the artistic creation process (Malchiodi
    2007; Meyer et al. 2018).


    Both students and teachers can experience contemplative learning intentionally
    in a walking meditation (see the Rainbow Walk, Olivero et al. 2021). Freer forms
    of contemplation-reflection can involve engaging in unguided walks without any
    particular goals except being alone (or with a partner) and quietly reflecting.
    Contemplative learning can involve compassion: sending compassion to oneself;
    sending compassion to a beloved person to people in a different place or holding
    different ideas, or to every being around the world. All these contemplative/reflective
    experiences have been used in my courses and other’s courses in language teacher
    education.


    Vygotsky, whom we met in the section on transformative learning, was devoted to
    the concept of “seeing again” but instead of using “reflection,” he employed the
    metaphor of “refraction.” Veresov and Fleer (2016) maintained that refraction
    rather than reflection denotes an essential difference in how the environment
    functions in psychological development. They explain that reflection involves
    light waves following a direct linear path between the eyes of a viewer and a
    reflective surface such as glass, with the reflection returning to the viewer’s
    eyes, without distortion. Refraction, in contrast, occurs as light passes through
    a medium, such as a prism, and is distorted according to its refractive index;
    specifically, light waves are bent, and images are not reflected but undergo change.
    For Veresov and Fleer (2016), Vygotsky’s interest in refraction suggested that
    he believed the environment stimulates psychological development but does not
    determine it.


    For Vygotsky, I assume, reflection would indeed have connoted a deterministic
    role of the environment, but he contended instead that the environment is refracted—imbued
    with meaning, assigned relevance—by individuals according to their psychology,
    not merely reflected uniformly in the mind. Veresov and Fleer (2016) argued that
    to understand this relation requires taking account of “what I am experiencing”
    (the ontological) and “how I am experiencing it,” that is, my experience of the
    experience (p. 2). I add that for any given person, differences'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'in interpretation of “what I am experiencing” and “how I am experiencing it”
    can vary dramatically depending on many internal factors, which can fluctuate.


    Contemplative learning is transformational in helping learners reflect on (or
    to use Vygotsky’s words, “refract,” as with a prism) a different culture. Reflection
    and refraction fit deep linguaculture learning experiences when the learner processes
    these experiences afterward in speech or writing in the deep linguaculture being
    learned.


    # Conclusion


    This chapter has discussed deep linguaculture learning in three potential modes.
    The first mode is *transformative learning* (Cranton 2009; Dirkx 2012; Mezirow
    1981; Vygotsky 1978). Transformative learning changes our minds and hearts. It
    transforms who we believe we are and expands us in new, positive directions, though
    not without some growing pains as we grow and change. Ideally, transformative
    learning can move us cognitively, emotionally, and socially as we engage in deep
    linguaculture learning. The second mode is *holistic learning*, with its overlapping
    emphases: *holistic-experiential* (e.g., Dewey 1933; Maslow 1971) and *holistic-humanistic*
    (Moskowitz 1978; Rogers 1969; Stevick 1990). Holistic learning involves the whole
    being and fits deep linguaculture learning well. It is not tantamount to a 1,000-piece
    picture puzzle; instead, it is a deep, vast, guided journey on which learners
    discover the linguaculture and themselves. In holistic education, students can
    learn together with their teachers; experience unconditional positive regard;
    have a taste of the infinite in a peak experience and then engage in deep discussions
    about it; and feel the sacramental beauty of the spaces where deep linguaculture
    learning occurs; and can become more richly human and whole. The third mode is
    *contemplative-reflective* (Oxford 2016; Zajonc 2009), in which learners and teachers
    discover how contemplation, refraction/reflection, meditation, art, music, and
    movement can deepen human understanding and draw everything we have learned into
    the internally evolving linguaculture and accompanying self-awareness. These three
    broad learning orientations provide full-bodied, profound, and enjoyable experiences
    of deep linguaculture learning. In such experiences, a community grows and explores
    the linguaculture together. Participants become richer, fuller beings.


    As mentioned in the Introduction, this chapter’s ethical compass points away from
    a belief that individual wellbeing is enough. We live on a globalized planet.
    We are part of the whole world, and it is part of us. Deep linguaculture learning'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'tells us that we do not totally consist of our job or our family, though they
    are crucially important. We are on a journey in which the wellbeing of all—not
    just a handful of individuals—is important. In the types of linguaculture learning
    described in this chapter, wellbeing is an assemblage, a holistic experience that
    cannot be broken into little pieces (Atkinson 2013). It belongs to all. Wellbeing,
    like deep linguaculture education, is not just for one or two of us, or for just
    our community, our nation, or our hemisphere. In principle, the deep linguaculture
    education, like unconditional positive regard, is the right of everyone, because
    we share the same humanity. We can help this principle become a daily reality
    as we enable students to increasingly embody and share deeply the linguaculture
    they are learning. We can enable communities around the world to adopt deep linguaculture
    education, although this will require much work.


    We can connect philosophically, psychologically, and socially with the world through
    caring about the wellbeing of all and through embracing and embodying deep linguaculture
    education. To promote wellbeing for everyone, we need to offer in deep linguaculture
    education (and in all other areas of life) what we ourselves want to receive:
    respect, honesty, justice, compassion, love, kindness, wisdom, empathy, gratitude,
    caring, and sharing. Decades ago, I thought that Moskowitz’s (1978) book title,
    *Caring and Sharing in the Foreign Language Class*, was a little too sweet for
    my taste. Now I know that “caring and sharing” make possible deep linguaculture
    learning and teaching as part of the wellbeing process. Deeply learning or teaching
    a linguaculture, including its people, places, colors, sounds, layers, and textures
    (not avoiding the scars of history), is part of the wellbeing process. Both deep
    linguaculture education and wellbeing are forces that this jittery and sometimes
    desperate planet needs. These forces can bring people together in new ways, introduce
    us to our best selves, and provide hope for greater peace.


    # Acknowledgments


    I am profoundly grateful to Joseph Shaules and Troy McConachy for inviting me
