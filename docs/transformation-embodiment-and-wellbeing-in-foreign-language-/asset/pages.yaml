  img_proc: true
- pgno: 226
  md: '# Activity 3: My Self-confidence Booster Anthem


    Music has the power to transport our souls to unimagined places. Music and songs
    have helped language teachers to present vocabulary and grammar, to build classroom
    routines, to break the ice, to develop intercultural competence, among others.
    Likewise, as Prado et al. (2021: 113) have expressed “environments rich with symbols,
    images, art, music, poetry and stories [...] enable a connection between our conscious
    world and unconscious self.”


    Music and lyrics accompany us at all times, it helps generate pleasant emotions
    and boosts wellbeing (Murphey 2014 in Gregersen 2016); more so when we need inspiration
    to accomplish our aims. Student teachers in the practicum can benefit from music,
    as it can act as a transmitter or catalyst of message and emotions (Fonseca-Mora
    & Machancoses 2016).


    **Purpose:** To downregulate student teachers’ unpleasant emotions and increase
    positivity by boosting self-confidence and experiencing joy.


    **Procedures:** This activity involves the use of music and art to create an inspirational
    anthem based on a selection of already published songs and to design an art collage
    (see pictures below).


    +   1. Discuss with student teachers the role of music in their lives, if they
    have favorite songs, when they listen to those songs, what they are about, if
    they can sing or play an instrument, etc. Announce there will be a project related
    to music the following class. For that purpose, ask them to select between three
    and five lyrics of their favorite motivational songs at home, and to save them
    on their phones (or make sure they have access to them) and print the lyrics in
    colored paper to take them to class.

    +   2. Once back in class, engage student teachers in a discussion about the value
    of music as a source of inspiration and how music can help us in the midst of
    stressful times.

    +      Ask student teachers which songs they selected and why. Play instrumental
    music in the background while student teachers read the lyrics for themselves.

    +   3. Once they have read all their songs, tell student teachers to create their
    own inspirational anthem (Figure 9.1) based on the lyrics from the songs they
    have just read. They should choose lines or stanzas from each song to create their
    own inspirational anthem. They can work individually, in pairs or groups and they
    should feel free to modify the lyrics to suit the message they wish to convey.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/5148f48c5f0c46f3e824e5080bd81aae_227_0.png)


    Figure 9.1 Creation Process of the Self-confidence Booster Anthem


    +   4. Once the anthem is ready, provide student teachers with color pencils,
    brushes, scissors and all the materials needed to create a collage.

    +   5. a. Ask student teachers to share their productions with the whole class
    and display their works of art on the wall.

    +      b. Get student teachers to tell the rest about some of the lines in their
    inspirational anthem and what they mean to them.


    **Follow-up:** Show student teachers’ work on social media and invite everybody
    in class to *like* each other’s’ publications and comment on them.


    **Techy option:** Tell student teachers to propose one inspirational song each,
    create a Spotify open playlist for the course and name it. Each year new songs
    are added by the teacher educators and student teachers to be used in class for
    activities as the ones proposed.


    For this activity we suggest student teachers listen to the following songs for
    inspiration: “Fireworks” by K. Perry, “Born This Way” by Lady Gaga, “Brave” by
    S. Bareilles, “Know Your Worth” by D. Khalid, “When You Believe” by W. Houston
    and “Adventure of a Lifetime” by Coldplay.


    # Activity 4: Look Back, You’ve Made It so Far …


    Focusing on what we have accomplished and on our successes can empower us and
    help us strengthen our wellbeing. A large body of research has shown that students’
    appraisal of past accomplishments and the amount of satisfaction they experience
    will significantly determine how they approach future learning (Dörnyei & Muir
    2019). Encouraging positive retrospective'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'reflection upon accomplishments can play an important role in increasing positivity
    (Helgesen 2016).


    In general, students do not take the time to reflect on their successes and tend
    to lose sight of them as they move from one task to another in their academic
    lives. Taking the time to savor one’s accomplishments could stimulate students
    to increase pleasant emotions such as optimism and pride.


    **Purpose:** to focus on accomplishments and to savor them.


    **Procedures:** In this activity, student teachers have the opportunity to acknowledge
    and reflect on their successes and share them with the whole class.


    +   1. As student teachers enter the classroom, give them a warm welcome playing
    an audio file with the sound effects of applause and cheer. See how they react.

    +   2. Explain to student teachers that you organized such a welcome to congratulate
    them on their academic accomplishments so far. Open the floor for discussion on
    the power of taking the time to focus on achievements as it can help them enhance
    motivation, and a sense of control and pride, among other aspects.

    +   3. Draw a chart on the board and ask student teachers to write down what they
    see as their main academic accomplishments to date. Guide student teachers to
    include successes related to different aspects, including academic, emotional,
    and social.

    +   4. Get student teachers to reflect on how much they have accomplished and
    how this makes them feel. Ask them about the processes they have followed to reach
    their goals. Then, discuss the idea that it is the means by which they arrive
    at those goals that is of paramount importance.

    +   5. Invite student teachers to congratulate each other face to face or in writing.
    In this way you will give every student teacher in the class the chance to savor
    their accomplishments.


    **Follow-up:** Talk about the future achievements student teachers would like
    to accomplish. Prompt them to focus on concrete, feasible actions they can do
    to achieve them. Encourage student teachers to be positive, optimistic, and hopeful.


    **Techy option:** At the end of the activity, student teachers can congratulate
    each other through text messages, make a phone call or video call, or write a
    nice message on social media.


