- pgno: 154
  md: 'through an emphasis on active physical and affective engagement (Bräuer 2002;
    Crutchfield & Schewe 2017; Fleming 1998).


    However, as the constructed dialogues of Shakespeare’s dramas are very different
    from, for example, those of McConachy’s (2018) contextual analysis activities,
    it is important to address how Shakespeare is suited to intercultural language
    education. As Liddicoat and Scarino (2013: 95) point out, the authenticity of
    resources is not simply a question of whether they are “real” examples of everyday,
    contemporary language use—which Shakespeare certainly is not—but depends on “a
    dynamic interaction between the resources, their use, and the learning that they
    are designed to produce.” Consequently, active approaches to Shakespeare for intercultural
    language education harness and respond to particular qualities of Shakespeare’s
    texts in interactional, intercultural ways. So, while Shakespeare’s works are
    fictional and were composed at a historical distance, the integration of language
    and local action is fundamental to their use in active approaches. As Kao and
    O’Neill (1998: 4) have written in their influential work on process drama and
    second language learning:


    > Drama does things with words. It introduces language as an essential and authentic
    method of communication. Drama sustains interactions between students within the
    target language, creating a world of social roles and relations in which the learner
    is an active participant.


    Thus, although Shakespeare’s dramatic texts involve heightened situations that
    might be assumed to be historically and culturally remote, through processes of
    embodied enactment and interpretation learners explore many of the same elements
    they would in an activity such as contextual analysis. Specifically, the activities
    illustrated below involve active exploration of linguistic choices (of Shakespeare
    and the characters/speakers), potential sociocultural influences on these choices
    (in terms of both the dramatic context within the play, and the context in which
    it was written), and the consequences of these choices (for the characters, performers,
    and spectators).


    Furthermore, the beauty and strangeness of Shakespeare’s language itself offers
    possibilities for teaching English from an intercultural perspective. For Pulverness
    (2014), a certain estrangement is inevitable when encountering and learning (about)
    other languages and cultures. As a consequence, he advocates the use of literary
    texts as an effective way of working through this, by exploring the sense of estrangement
    in relation to the “foreign” and challenging taken-for-granted assumptions about
    the “familiar.” Drawing on *ostranenie* (Остранение), the notion of *defamiliarization*
    developed by Russian formalist critics in the early twentieth'
