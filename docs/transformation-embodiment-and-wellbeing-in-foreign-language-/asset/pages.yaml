  md: 'to how people think and act. So exploring alternative metaphors can lead teachers
    to focus on different ways of thinking about language learning: some metaphors
    are familiar, some are overlooked, others offer refreshing insights. Metaphors
    can orientate us to lines of action, so when teachers have a variety of metaphors
    of “learning” in mind, they can shift frames to adapt flexibly to different learners
    and changing contexts. When teachers draw on learners’ own metaphors, they can
    empower learners by starting from familiar ground. When teachers help learners
    to expand the range and depth of an available repertoire of considered metaphors,
    they are likely expanding learners’ understanding about language learning.


    The “journey of language learning” is a key metaphor, self-chosen by many of our
    research participants, expressed in their own voices. As an advance summary, we
    briefly elaborate the “journey” in a mosaic of related images which are central
    to many learners’ conceptualizations. The “journey” is more than a process of
    acquiring and refining skills, although linguistic skills are inherently part
    of the picture. Our data obtained from many learners—and teachers—suggest that
    the journey involves visualized movement, progression, change, and often transformation
    of the whole person. It involves personal cultivation, nurturing, and growth.
    For success, it demands apparently endless striving through patient and persistent
    efforts. These determined efforts are vital for learners to survive many threats
    to wellbeing, to emerge as winners in a context which some see as a competitive
    marathon or a journey of war. For most, with teacher guidance and care, the journey
    is onwards and upwards to realize goals of excellence and attain heavenly ideals.
    For some, the journey seems like misery, torture, or a punishing descent into
    hell. For many, exercising a strong will, working hard continuously and maintaining
    self-belief in attaining eventual success will, they think, carry them forward.
    Their destination is imagined as a bright future of success to find a treasure
    of wealth, happiness, and fulfilled dreams.


    Such conceptions by Chinese participants are elaborated in “journeys of learning”
    with corresponding teachers’ roles (see Jin & Cortazzi 2011, 2020). In the following
    sections, we report a remarkable range and depth of conceptions of learning. Some
    features of these metaphors are also seen to be common in our studies in Malaysia
    (Cortazzi & Jin 2020b) and Iran (Cortazzi et al. 2015), which suggest some metaphors
    are apparently widespread, but we also see culturally specific nuances (e.g.,
    in our data, language learning as “making war” or “fighting a battle” is mentioned
    in far more frequently and with greater elaboration in Lebanon than in China,
    Iran, or Malaysia).'
