- pgno: 20
  md: '# Aims and Organization of This Volume


    This volume introduces pedagogical approaches and empirical studies that emphasize
    embodied engagement with language, the transformative potential of the language
    learning experience, and the importance of learner and teacher wellbeing. Chapters
    in this volume consider the enactment of deep learning from diverse theoretical
    perspectives, including positive psychology, embodied cognition, cognitive linguistics,
    motivational theory, literary theory, and moral psychology. Each chapter provides
    concrete discussion of ways that these theoretical perspectives can inform educators’
    approaches to deep learning, supported by critical synthesis of relevant theoretical
    literature, analysis of empirical data, or examples from particular teaching contexts.
    These diverse viewpoints are offered as a way to stimulate discussion of the many
    forms of pedagogy that can encourage deeper learning experiences.


    The volume opens with a chapter by Rebecca Oxford which explores the nature of
    deep linguaculture learning in relation to key theories and theorists within three
    learning traditions: transformative learning, holistic learning, and contemplative-reflective
    learning. Oxford argues that each of these modes is valuable for deep linguaculture
    learning and emphasizes the need for the notion of wellbeing, both of individual
    learners and society at large, to act as an ethical framework for foreign language
    education. She argues that deep linguaculture learning helps develop the inner
    talents and strengths of learners, as well as inner wells of resilience. By creating
    communities of support, respect, and care, pedagogy focused on deep forms of learning
    fosters transformation not only in the learner, but also in the world at large.
    In this way, the transformative elements of learning are intimately related to
    the wellbeing of the learner and humanity more broadly.


    In Chapter 2, Joseph Shaules highlights the Janus-faced nature of foreign language
    learning, arguing for the need to recognize the potential for language learning
    to be both psychologically challenging and rewarding. The chapter argues that
    the psychological challenges and rewards of FL learning are intimately related,
    and that cross-cultural adjustment theory provides a useful theoretical lens for
    understanding this interrelationship. In this view, the adaptive demands generated
    by the experience of foreignness in language learning are similar to the psychological
    dynamic of cross-cultural adaptation. Learners react to these demands in motivational
    terms—by resisting and/or engaging with the learning process. The chapter seeks
    to normalize a view of language learning as involving'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'both engagement and resistance, and argues that transformative learning outcomes
    depend on how learners and teachers manage adaptive demands.


    The third chapter, co-authored by Martin Cortazzi and Lixian Jin, considers the
    significance of language learners’ metaphoric conceptualizations of language learning
    and how these provide insights into the deeply meaningful and embodied nature
    of the learning experience from the viewpoint of students and teachers themselves.
    The authors draw on an extensive corpus of metaphors provided by Chinese learners
    and teachers of English to highlight cognitive, affective, socio-cultural, moral-spiritual,
    and aesthetic dimensions of learning, which they argue present a challenge to
    the view of language learning as the acquisition of skills. The chapter particularly
    highlights key metaphors revealing concepts of teacher cultivation, nurturing
    student wellbeing with care and concern, and students own change and transformation
    of the self. This exploration sheds light on the many ways that learners make
    sense of their language learning journey, the embodied nature of their own metaphoric
    understanding, and the psychological import that they imbue it with.


    In the fourth chapter, Zi Wang puts forward a humanistic understanding of language
    learning motivation based on the experiences of Chinese learners of English and
    Japanese. The chapter highlights the potential for instrumentalist ideologies
    of language and language learning to obscure the possibilities for more humanistic
    goals in SLA research. It goes on to synthesize a number of key concepts in motivation
    research that are aligned with a broadly humanistic understanding of language
    learning. The data from Chinese learners shows that what the author terms “humanistic
    motivation” was emergent in learners’ language engagement as they experienced
    a sense of personal growth in academic, aesthetic, and ethical domains. This contributed
    to increased self-awareness and helped transform learners’ perceptions of themselves
    and their relationship with these languages. The chapter concludes with suggestions
    for how teachers can foster humanistic motivation in their own learners.


    In Chapter 5, David Wijaya presents an approach to developing understanding of
    English causative constructions that draws on insights from cognitive linguistics
    and embodied cognition. This chapter calls for recognition of the close links
    between linguistic knowledge, bodily experience and bodily perception, and argues
    that embodied learning activities provide a potentially powerful way of promoting
    deep learning. The chapter offers a theoretical conceptualization of periphrastic
    causative constructions informed by cognitive linguistics and suggests how this
    could be fused with what the author sees as a deep approach'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'to learning grammar. It seeks to move beyond the conceptualization of grammar
    as primarily a structural system governed by rules and abstract properties. The
    chapter presents a number of concrete pedagogical strategies that could be employed
    by teachers to teach causatives and other aspects of grammar in order to promote
    deep learning.


    Chapter 6, written by Duncan Lees, argues that while using Shakespearean texts
    in the English classroom might seem impractical or counterproductive according
    to the instrumentalist logic of much foreign language education, their very “strangeness”
    can actually help teachers to encourage deeper learning. The chapter outlines
    a pedagogy that combines the collaborative, embodied, and playful techniques of
    active or “rehearsal room” approaches to Shakespeare with an intercultural perspective
    on language teaching and learning. Through practical examples drawn from the author’s
    own classes with learners of English at universities in China and the UK, it shows
    how the processes of (de)familiarization and mediation involved encourage learners
    to reflect more deeply not only on Shakespeare’s “strange” language, but also
    on their own linguistic and cultural assumptions and identities. This reflection
    encourages a richer, more meaningful engagement with the learning process as learners
    explore English learning as an intercultural experience.


    In Chapter 7, Chantelle Warner looks at deep learning from the perspective of
    aesthetic experience and reader response in the German language classroom. While
    in linguistics “transactional” often denotes instrumental language use, in the
    reader response theories of Louise Rosenblatt it describes instead a deep, aesthetic
    relationship between reader and text. Using this tension as a starting point,
    this chapter explores the potential of a transactional approach to second language
    literacy in enabling learners to relate their aesthetic experiences to their emergent
    sense of themselves as multilingual subjects (Kramsch 2009). It argues that aesthetic
    reading can impact learner wellbeing in unexpected and transformational ways.
    A central focus of this discussion is a case study involving a creative writing
    composition in which the learner explores how her story and experiences intersect
    with the narratives she had read in class. The chapter concludes with tentative
    pedagogical principles for transactional literacy in language-culture teaching.


    Chapter 8, authored by Troy McConachy, looks at the phenomenon of “pragmatic resistance,”
    which is a term that represents learners’ aversive reactions to target language
    pragmatic norms. Drawing on the author’s own experience, published examples, and
    insights from moral psychology, the chapter argues for the need to see pragmatic
    resistance and pragmatic decision-making more'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'broadly as an embodied phenomenon that is closely tied to individuals’ intuitions
    about socially and morally desirable behavior. Whereas much existing work in the
    field tends to emphasize learners’ rational decision-making as a basis for agency,
    this chapter posits an important role for moral emotions, particularly what are
    known as “other-condemning emotions” and “self-conscious emotions” in how language
    learners perceive and evaluate the appropriateness of language use in context.
    It argues for the importance of creating space for learners to explore difficult
    emotions triggered by language use that seemingly violates their own felt sense
    of right and wrong communicative behavior. The chapter then proposes a number
    of pedagogical strategies which promote mindful observation of bodily sensations,
    emotions, and thoughts that lead to negative evaluations of pragmatic differences.


    The final chapter of the volume, co-authored by María Matilde Olivero, María Celina
    Barbeito and Adelina Sánchez Centeno, highlights the value of incorporating positive
    psychology activities based on holistic learning approaches into language teacher
    education programs as a way of enhancing teachers’ emotion regulation and wellbeing.
    The chapter first reviews recent theoretical trends and empirical research on
    wellbeing and emotion regulation in language education as well as on holistic
    learning. This serves to frame the activities that are described next and to elucidate
    their underlying principles. It argues that in order for teachers to experience
    wellbeing throughout their careers and to care for the wellbeing of their language
    learners, it is paramount to incorporate a focus on wellbeing in language teacher
    education programs. It then offers several positive psychology-based activities
    that have been used in language teacher education courses with the purpose of
    helping future teachers regulate their emotions and enhance their wellbeing while
    learning to teach a foreign language.


    As a whole, this collection of chapters challenges language teachers and teacher
    trainers to question instrumentalist views of language learning, to recognize
    the deeply impactful nature of the language learning experience, and to consider
    how language pedagogy can contribute to the development of the learner as a whole
    person. Each of them is informed by a view of language learning as an embodied,
    transformative process with powerful psychological consequences. Naturally, there
    are many roads to deep learning—each reflecting particular teaching contexts and
    the unique experiences and abilities of each educator. By reflecting on the various
    perspectives found in this volume, it is hoped that readers will be inspired to
    explore different aspects of the deep learning experience and contribute to an
    ongoing discussion of how to make FL learning the powerful, life-changing experience
    it has the potential to be.'
