- pgno: 119
  md: '# Developing Embodied Learning Activities to Teach English Causatives


    David Wijaya


    # Introduction


    Grammar teaching and learning in the second language (L2) classroom is often associated
    with the teacher dictating a set of prescriptive rules of target grammatical structures
    along with a list of exceptions to the rules (Tyler 2012). This practice is an
    application of the generative approach to language which views language as a structural
    system whose rules and properties are largely abstract and arbitrary. The generative
    approach also posits that there is an innate language acquisition device in the
    human mind that is responsible for language acquisition, whilst being disassociated
    from the rest of cognition (Chomsky 1965). This view of language learning suggests
    that language acquisition happens as a result of changes in the learner’s internal
    mental state, and grammar teaching that incorporates explanations of abstract
    linguistic rules may help shape learners’ underlying linguistic competence (White
    2015; Whong et al. 2013).


    Undoubtedly, some rules are quite straightforward and could therefore be relatively
    easy for teachers to introduce and for learners to learn. Consider, for instance,
    the rule for the English simple past tense which states that this tense, regularly
    expressed by the verb ending -ed, is used when we talk about completed past events.
    However, some other grammatical features have multiple, complex, and less straightforward
    rules such as English articles, prepositions, and modals. Further, even grammatical
    structures that seem to have straightforward rules such as the simple past tense
    have uses that seem to defy the rule. For instance, the notion of completed action
    in the past may be conveyed through the simple'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'present tense to create a sense of immediacy (e.g., *I was on the bus to my
    school when someone suddenly snatches my phone from my pocket*), whereas the simple
    past tense form may be used to refer to a present fact to produce a special communicative
    effect (e.g., *I’m sorry, what was your name again?*) (Radden & Dirven 2007).


    Whilst attempting to cover all the rules and exceptions relating to a given grammatical
    feature explicitly is likely to ensure exhaustive treatment of grammatical items,
    it also becomes more difficult to present a coherent picture of how rules are
    connected to each other. Consequently, teaching could become tedious and ineffective
    as learners are cognitively overloaded with this kind of learning task.


    In contrast, there is currently increasing interest in embodied views of language
    and language learning that offer a deeper and potentially more productive way
    to learn L2 grammar (e.g., De Knop 2020; Giovanelli 2015; Süner & Roche 2021).
    Central to embodied views of language learning is the idea that linguistic knowledge
    is intimately related to our bodily movements and perception, and thus learning
    a new language can be optimized by utilizing our bodies and perceptual senses.
    Such a view is particularly prominent within the field of Cognitive Linguistics
    (CL), which serves as the main theoretical inspiration in this chapter. Given
    its emphasis on embodied meaning, this chapter argues that CL analyses of linguistic
    meanings can be used to support embodied learning activities in the L2 classroom
    and help create the potential for deep learning. The chapter considers the utility
    of a CL-inspired embodied approach to teaching and learning L2 grammatical constructions
    and aims to show that such an approach is effective. Taking English periphrastic
    causative constructions as the target constructions, I shall explore how these
    constructions can be taught using embodied learning activities.


    # Cognitive Linguistics (CL) as an Embodied Approach to Language


    CL posits that language mirrors our cognitive processes, our highly social nature,
    and our ordinary interaction and experience with the physical world, pointing
    to the idea of embodied meaning (Tyler 2012). For example, usage such as “*John
    is at the peak of his career*” and *Megan will rise to the top in that company*
    has both social and physical basis: “status is correlated with social power and
    (physical) power is UP” (Lakoff & Johnson 1980: 17). CL also holds that language
    is'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'usage-based. This means that language is not innate or genetically endowed;
    rather, it is learnt through experience as it occurs in a context of use (Ortega
    et al. 2016; Tyler 2012). By emphasizing meaning and language in use, CL treats
    linguistic constructions as a range of grammatical choices that language speakers
    use to achieve communication goals in context (Giovanelli 2015; Wijaya & Hidarto
    2018). These core characteristics present CL as an appealing descriptive pedagogical
    grammar (Giovanelli 2015) and arguably a deep approach to learning grammar as
    CL offers “more comprehensive, revealing, and descriptively adequate” semantic
    accounts that can inform L2 grammar instruction (Langacker 2008: 8). CL-grounded
    embodied instruction can also make grammar teaching and learning more engaging
    as learners are encouraged to use their bodies and eyes to construct meaning in
    the L2. As will be elaborated below, engagement with meaning is characteristic
    of a deep approach to learning (Smith & Colby 2007).


    In what follows, I will first consider the concept of causation and provide an
    overview of English periphrastic causatives from a CL perspective. I will then
    discuss how CL can be a basis for developing a deep approach to learning grammar
    and how CL theories are compatible with the notion of embodied cognition. Following
    this discussion, I will propose a series of embodied learning activities which
    utilize bodily movements and visuals and which English teachers can use to promote
    a deeper understanding of the target constructions. Finally, I will present a
    brief quantitative report on an experimental study that suggests the potential
    effectiveness of an embodied approach to instructing causatives and thus lend
    weight to applications of a CL-inspired embodied approach to L2 grammar teaching
    and learning.


    # The Notion of Causation


    As we go through our daily lives, we often directly and intentionally manipulate
    objects around us to bring about expected changes of state in the objects, such
    as shortening a skirt, opening a door. This act is often referred to as causation,
    a basic concept that we always apply to domains of activity in order to function
    successfully as humans in the socio-physical world (Lakoff & Johnson 1980). This
    concept is so fundamental that it is an integral part of the underlying structure
    of human language (Baron 1973). Causation is expressed in a wide range of constructions
    in many languages. In English, for example, we say, “The tailor shortened my black
    trousers,” “I tore my black'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'trousers,” and “I had the tailor repair my black trousers.” These sentences
    are all termed as “causative constructions.” In English language teaching (ELT),
    the first two types of sentences, which are labelled as a morphological causative
    construction and a lexical causative construction, respectively, are usually taught
    as vocabulary items and instances of simple past tense. The third sentence is
    a syntactic periphrastic causative construction that consists of a causative verb
    (e.g., *make*, *have*, and *get*) that controls a complement clause (e.g., bare
    infinitive and *to*-infinitive), and is taught as a grammatical structure.


    A periphrastic causative conveys the idea that a CAUSER does something to a CAUSEE
    to generate an EFFECT. This construction is arguably more complex than the other
    two types of causative construction as it involves knowledge of which causative
    verb to use, and how to construct the complement in order to convey what causation
    has actually occurred. This complexity poses great difficulty to even advanced
    second language (L2) learners (Gilquin 2010, 2016; Wijaya & Winstin 2021). For
    instance, how would we explain to our L2 students the differences among the following
    sentences?


    +   1. My dad had me clean the bathroom.

    +   2. My dad made me clean the bathroom.

    +   3. My dad made me cry.

    +   4. My dad got me to clean the bathroom.


    First language (L1) speakers of English intuitively know that the sentences are
    different in meaning from each other but explaining what each sentence means and
    how it differs from the others to L2 learners of English could be challenging.
    Many materials developers and ELT practitioners in general are aware of this and
    have proposed definitions and rules of causative constructions. However, the definitions
    and rules commonly found in ELT resources are less than comprehensive and accurate,
    and are mostly concerned with the structural patterns, with very little attention
    given to what each causative verb means and when to use them (Gilquin 2010). For
    instance, in explaining how the three verbs are not identical in meaning, Azar
    and Hagen (2016) state that *make* is used if the causee has no option because
    of the causer’s insistence, *have* is used if the causer asks the causee to do
    it, and *get* is used if the causer is able to persuade the causee. The meaning
    description provided for *make* might be helpful to understand sentence (1). However,
    it cannot be used to explain sentence (3), which is a more frequently used *make*
    construction (Gilquin 2010). The meaning descriptions for *have* and *get* are
    obscure and may lead learners to (wrongly) assume that to'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'decide which of the two verbs to use, they only need to observe if the causer
    had to provide a good reason to cause the causee to perform an action, which may
    not always be the case. Azar and Hagen (2016) also assert that there is little
    or no meaning difference between the passive causatives *get* and *have*, disregarding
    the pragmatic aspects and lexical preferences of the two causative verbs. An equally
    important limitation lies in the way these constructions are represented: the
    sole use of language in communicating explanations. As will be shown and elaborated
    later, periphrastic causatives carry abstract conceptual meaning. Therefore, exclusive
    reliance on verbal descriptions or rules limits students’ learning experience,
    and this will result in either simplistic or inadequate knowledge of the constructions
    in question.


    # CL Accounts of English Causative Constructions


    As introduced earlier in the chapter, CL posits that the language we use reflects
    our cognitive processes and interaction with the socio-physical world. Cognitive
    linguists maintain that periphrastic causatives are a linguistic realization of
    a cognitive concept referred to as the action chain. This concept “reflects a
    transmission of energy from an entity (human being, animal, concrete, object,
    abstract concept, etc.) to one or several entities” (Gilquin 2010: 61). An action
    chain has a head, which is the source of energy. The head transmits the energy
    to another entity, which then transmits the energy to another entity until the
    energy reaches the tail, where the transmission of energy stops (Langacker 1991).
    Figure 5.1 illustrates the notion of action chain.


    This can be exemplified through sentence (5). In this sentence, David is the head
    and acts as an agent that initiates the energy transfer. The energy is first transferred
    to a stone, which corresponds to the role of an instrument. The energy from the
    stone is then transferred to Goliath, who has the role of a patient and consumes
    the energy through his dying. This action chain, represented by the diagram in
    Figure 5.2, can be realized through other constructions such as sentences (6)
    and (7).


    ![](img/5148f48c5f0c46f3e824e5080bd81aae_123_0.png)'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/5148f48c5f0c46f3e824e5080bd81aae_124_0.png)


    # Figure 5.2 Linguistic Realization of an Action Chain (adapted from Gilquin 2010)


    +   5. David killed Goliath with a stone.

    +   6. David used a stone to kill Goliath.

    +   7. David threw a stone at Goliath and Goliath died.


    A periphrastic causative extends an action chain by adding another link and, in
    the case of sentence (5), the original source of energy could be included, as
    in (8). The periphrastic causative sentence is illustrated by Figure 5.3a. In
    (8), the head and the original source of energy is God, whereas David receives
    the energy. Additionally, as pointed out by Gilquin (2010), sentences like (8)
    can be construed as involving two different events, viz. “causing” and “killing,”
    as illustrated by Figure 5.3b. The action chain in Figure 5.3b represents “a sequence
    of separate, but causally related events, as indicated by the imbricate boxes”
    (Gilquin 2010: 64). In the first event, the head, God, with its energy initiates
    the process of energy transfer that affects David, and in the second event, as
    a consequence of the first one, David kills Goliath (the jagged arrow signifies
    the consummation of energy by Goliath, that is the tail of the action chain).
    Gilquin (2010) also notes that causation can be conceptualized differently through
    a two-element action chain, where the transfer of energy only occurs between CAUSER
    and CAUSEE (see Figure 5.3c). In sentence (9), the “dying” component is construed
    as more prominent than it would otherwise be.


    +   8. God caused David to kill Goliath.

    +   9. David caused Goliath to die.


    Further, cognitive linguists hold that constructions that are structurally different
    must also differ in their meanings and functions, a principle known as “Principle
    of No Synonymy” (Goldberg 1995), and thus should be considered individually (Gilquin
    2010). This is certainly the case with periphrastic causatives that have been
    traditionally suggested as fundamentally synonymous in meaning as they arise from
    the same deep structures (Brame 1976). By following the Principle of No Synonymy,
    cognitive linguists are able to account for the structural and semantic aspects
    that differentiate the constructions from each other.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/5148f48c5f0c46f3e824e5080bd81aae_125_0.png)


    # Figure 5.3 An Action Chain of Causativization (adapted from Gilquin 2010: 65)


    Applying the natural semantic metalanguage approach to English periphrastic causatives,
    Wierzbicka (2006) argues that every verb in the constructions reflects the emphasis
    on preserving personal autonomy in interpersonal relationships that is a core
    characteristic of Anglo culture. That is, the choice of causative verbs depends
    on how a person''s personal autonomy is treated and on how the power relationship
    between CAUSER and CAUSEE is conceived. Even in hierarchical relationships where
    causal events often occur (e.g., the one between a waiter and a customer, the
    one between a parent and a child, and the one between a boss and a subordinate),
    the CAUSEE''s personal autonomy should not be neglected. In this kind of relationship,
    the CAUSEE acknowledges that they have to be willing and ready to take the CAUSER''s
    instruction or directions, and the CAUSER, despite having authority over the CAUSEE,
    has to recognize the CAUSEE''s personal autonomy. In other words, although the
    CAUSEE would not say, “I don’t want to do it” to the CAUSER who has expressed
    their will, the CAUSEE cannot be expected to do whatever the CAUSER wants the
    CAUSEE to do. This kind of relationship is implied by causative have, as exemplified
    in sentence (10). On the other hand, in a situation where the CAUSER has no such
    power or authority over the CAUSEE, the CAUSER is aware of the possibility of
    the CAUSEE refusing to do the CAUSER''s will. Therefore, the CAUSER needs to do
    something to influence the CAUSEE. If that is successful, the CAUSEE willingly
    carries out the CAUSER''s will. This is what is implied by causative'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'get and exemplified in sentence (11). In some situations, personal autonomy
    is abrogated by the CAUSER, resulting in the CAUSEE feeling under pressure and
    unwillingly perform something the CAUSER wants the CAUSEE to do. This sort of
    situation is captured by causative make and illustrated in sentence (12).


    +   10. The boss had her secretary arrange her schedule for tomorrow.

    +   11. I got my cousin to take me to the airport.

    +   12. The robber made the boy give him his money.


    Although revealing, these analyses are focused only on interpersonal causatives.
    Additionally, register is not considered in these analyses. That is, it is not
    mentioned whether a certain causative verb occurs more frequently in writing or
    in speech. Analyzing naturally produced language data, Gilquin (2010) agrees that
    causative make expresses coercion, as in sentence (12). However, she also found
    that it is mostly used to convey that something happens to the CAUSEE independent
    of its will. The CAUSEE can be either an animate or inanimate object, as illustrated
    in sentences (13) and (14).


    Further, she found the causative get conveys difficulty and effort. This explains
    why sentence (11) is felicitous: the CAUSER (i.e., I) needs to make effort to
    persuade the CAUSEE to perform his will. Sentence (15) may serve as a clearer
    example where it is noticeable that the CAUSER expresses their effort and difficulty
    through the word manage. Sentence 17 also conveys the same meaning since doing
    homework requires effort. Causative have, on the other hand, often refers to professional
    service involving payment, as exemplified in sentences (16) and (18). She also
    found that causatives get and have (as in sentences 17 and 18) often occur with
    a past participle in informal speech and rarely in writing.


    +   13. That movie made me cry.

    +   14. Let’s make it happen!

    +   15. We managed to get him to share his cooking secret.

    +   16. We had Barbara, who is an architect, build this lovely house.

    +   17. I’ll try to get my homework done tonight.

    +   18. My mom always has her nails done at that nail salon.


    The differences in syntax (i.e., complementation and passivization) also entail
    meaning and functional differences. Levshina, Geeraerts, and Speelman (2013) observe
    that the different complements “reflect different degrees of integration of the
    causing and caused events” (p. 829). A present participle indicates that the caused
    event is construed to remain for some time (or be in progress) after it is'
  merge: -1
