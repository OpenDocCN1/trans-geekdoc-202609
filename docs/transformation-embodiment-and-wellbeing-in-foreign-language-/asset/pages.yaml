- pgno: 147
  md: 'These shared principles translate into practices that emphasize the teaching
    of Shakespeare as a collaborative, playful, physical endeavor. Tables and chairs
    are often pushed back, signalling the transformation of the classroom into a rehearsal
    room (Banks 2014; RSC 2013), a stage, or even a “theatrical laboratory” (Stredder
    2009: 8). Accordingly, students and teachers become more like actors and directors,
    albeit with an emphasis on learner-centered collaborative exploration. This sees
    the focus shift from the teacher-director, to the student-actors as “co-owners”
    and “doers” (Stredder 2009: 11). The teacher thus becomes a knowledgeable “enabler
    and fellow explorer” (RSC 2013: 9), allowing learners to ask questions and actively
    create meanings. Typically this is done through activities that put the text “on
    its feet” to be explored using playful techniques, which borrow from the professional
    rehearsal room. As well as reimagining the classroom and the roles within it,
    this approach also implies a different attitude to Shakespeare. Gibson (1998:
    7) insisted that Shakespeare’s plays should be presented to learners as “scripts,”
    not “texts,” because while the latter “implies authority, reverence, certainty,”
    the former “suggests a provisionality and incompleteness that anticipates and
    requires imaginative, dramatic enactment for completion.” For the most influential
    proponents of this tradition, such an approach restores the dramatic element to
    the study of plays that were written to be performed, in ways that more textual
    and/or historical approaches arguably cannot. These methods are “active,” therefore,
    not only physically, but because they give students agency over the text, as they
    respond to Shakespeare emotionally, intellectually, and imaginatively.


    The techniques associated with this tradition have in many cases been developed
    through years of artistic and educational practice, but Winston (2015) has set
    out a theoretical rationale for the RSC’s “rehearsal room” approach, which is
    broadly applicable to the tradition as a whole. He organizes this around five
    areas of learning—*learning through playing, through experience, through the body,
    through beauty and learning together*—which will now be briefly elucidated with
    reference to this chapter’s focus on language education:


    +   - *Learning through playing:* Winston (2015: 76) notes that play is often
    dismissed as “pleasurable and therefore not difficult or challenging,” and as
    “not serious and therefore not to be taken seriously.” He contrasts this with
    how scholars such as Johan Huizinga and Richard Schechner have emphasized play’s
    importance as a fundamental aspect of life, which can be deeply serious and meaningful.
    Significantly, Winston gives particular attention to Cook’s (2000) work on language
    play, which argues that,'
