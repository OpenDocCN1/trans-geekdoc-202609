  img_proc: true
- pgno: 161
  md: 'will help them understand why Constance, in her grief, appears to be embracing
    the thought of death, and as a pattern emerges, learners may also be able to work
    out the gist of some of the more unfamiliar terms (realising, for example, that
    “sound” before “rottenness” is likely to be positive in this context). From here,
    and especially if there are any disagreements over what learners identify as positive
    or negative, a discussion can be developed about the importance of context, and
    interpersonal and intercultural factors, in interpreting meaning.


    *Imaging/playing with delivery:* Individually or in small groups, learners take
    a short stretch of the speech, and pick one word from each line that they think
    is the most striking, either in meaning or in sound. They then need to say their
    chosen words in an appropriately exaggerated way and devise bold physical gestures
    to match. When ready, learners share their words and gestures as a “highlight
    reel” with the group. From here, learners can move to reading the whole speech,
    while playing with the sounds of the words in various ways (e.g., by exaggerating
    the vowels or consonants) and noticing what stands out when they do this. As this
    is drama, and both Shakespeare and Constance are trying to make an impact, learners
    should be encouraged to make their delivery and movements as big as possible,
    really hitting the vivid line-ending words and using the series of lines that
    begin with “And” to keep building the drama. The two “O” sounds can be especially
    enjoyable to work with. Learners can experiment with different ways of passing
    the sound to one another, playing with and comparing the pragmatic consequences
    of different lengths, pitches, and intonations in English and other languages
    they speak. As with Example 1, this could easily be built by the learners into
    a collaborative, non-naturalistic performance piece. Alternatively, learners could
    respond with a piece of creative writing that plays with the sounds of different
    words and/or makes a different kind of sense through the juxtaposition of apparently
    contradictory words and images.


    # Conclusion


