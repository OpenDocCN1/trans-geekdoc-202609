- pgno: 179
  md: 'expansion of Rosenblatt''s theories has identified as *deferent* reading. Deferent
    reading focuses on meaning *finding* rather than meaning *making*, and thus takes
    the form of a kind of a didactic game of hide and seek. Deferent reading does
    often include affective or emotive responses, Hogue Smith notes; however, these
    are less aesthetic and more accurately anesthetic, in that reading becomes an
    emotionally numbing process. The emphasis is on performing an accepted reading
    on not on the students’ experience. This also shuts of space for the kinds of
    meaningful *symbolic struggles* (Warner & Richardson 2017) that can contribute
    to the development of symbolic competence, by enabling learners to explore in
    revealed something happening that was in excess of my pedagogical models and learning
    objectives, but which was intimately connected to literacy as lived experience.
    For Klara the experience of reading and creatively writing in response to the
    cluster of literary texts seemed to allow her to not only engage in some oppositional
    practice (Kramsch & Nolden 1994) vis-a-vis the symbolic meanings of the *Ostalgie*
    texts but also to weave in very personal, emotional experiences pertinent to her
    life in that moment by exploiting affect worlds and ethical values that were not
    her own. The ability to respond in creative writing, rather than being pushed
    to rationalize her responses immediately using the structural logic of a literary
    analysis, also allowed her to explore the colliding affect worlds of text and
    life before having to talk about them, for as Prior notes, “thinking or talking
    about emotions is not the same as having them” (2019: 519).


    Reflecting back, even without the knowledge of Klara’s mother’s illness, I wish
    I had asked questions that would have helped me to discover whether she had wholesale
    rejected the feelings of ambivalence expressed by the narrators in the texts we
    read, in favor of a more comfortable and familiar affect world in which East Germany
    is oppressive and dark. Following Rosenblatt’s arguments about ethics and the
    democratic potential of reading again, this could have allowed me to not only
    validate Klara’s response to the readings, but to use that as more of an opportunity
    to consider what it might mean to experience life,'
