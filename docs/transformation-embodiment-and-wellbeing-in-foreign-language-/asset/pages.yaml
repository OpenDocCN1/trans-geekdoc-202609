    of deep linguaculture learning with them. For me, it has been wonderful to enjoy
    this “newer world” with them. Thank you for caring and for sharing your guidance,
    as well as your great patience. I give my utmost appreciation to my dear husband
    Clifford Stocking, whose tolerance of my writing schedule knows no bounds.'
