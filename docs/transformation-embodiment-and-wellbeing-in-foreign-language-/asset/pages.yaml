  md: '# Exploring the Effect of Embodied Learning Activities on

    Learning Causatives


    Like any other instructional approaches, embodied approaches to language teaching
    and learning also deserve to be subject to empirical scrutiny. From a theoretical
    perspective, research on the effect of embodied learning activities on the learning
    of particular grammatical constructions is still scarce, and therefore such research
    would add to the body of literature on the effectiveness of embodied approaches.
    From a practical point of view, findings from research could help with teacher
    buy-in and encourage teachers to reconsider their view of language and how languages
    are learned. Therefore, in this section, I will present a summary of an experimental
    study that I conducted to explore the utility of embodied learning activities
    in instructing the target constructions to Indonesian EFL learners.


    As mentioned above, periphrastic causatives pose immense challenge to English
    L2 learners due to their semantic and syntactic complexities. Wijaya and Winston’s
    (2021) study on Indonesian EFL learners’ knowledge and use of causative constructions
    showed that learners had difficulty in using causatives *have* and *get* and in
    producing the complements. Learners also generally struggled to demonstrate sufficient
    explicit knowledge of the constructions that could have helped them choose the
    felicitous causative verbs and produce the correct complement. It also suggested
    that EFL learners might benefit from CL-grounded grammar instruction on these
    causatives. This became the basis of a collaboration with a separate colleague
    to design such grammar instruction for high-school students at a private school
    in Jakarta, Indonesia, and test its effectiveness (Novita & Wijaya 2018).


    The research question was primarily concerned with the effect of CL-grounded explicit
    instruction on Indonesian EFL learners’ performance on their production of causative
    constructions as measured by an immediate post-test and a delayed post-test. Participants
    were thirty-one twelfth grade high school students aged 16 to 18. As an instructional
    intervention, we provided them with a teacher-fronted explanation presented on
    PowerPoint slides and pedagogical tasks spread over 4 × 45 minutes. The PowerPoint
    slides consisted of cartoon illustrations that represent the diagrams and kinegrams
    shown above, brief statements of the meanings, and example sentences. The explanation
    of each causative was followed by a comprehension-based and a production-based
    tasks. The pre-test was conducted a day prior to the treatment, the immediate
    post-test was administered immediately after the treatment, and the delayed post-test
    was'
