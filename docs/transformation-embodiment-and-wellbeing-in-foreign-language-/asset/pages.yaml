- pgno: 167
  md: '# Toward a Transactional Theory for the Language-Culture Classroom: Rosenblatt’s
    Reader Response in Dialogue with Contemporary Second Language and Literacy Studies


    Within fields of applied linguistics, literacy studies, and language education,
    Louise Rosenblatt is most often cited for her distinction between “efferent” and
    “aesthetic” reading—a pair of concepts which too often get shorthanded as reading
    for information and reading for pleasure. Within literary studies—the discipline
    in which she led her career—Rosenblatt has (until relatively recently) been overlooked
    almost completely. In a contribution to a 2007 volume of *College English* focusing
    on Rosenblatt and the “Ethical Turn in Literary Studies,” Elizabeth Flynn suggested
    that this might be because Rosenblatt committed a dual faux-pas—she was both interested
    in pedagogy and she was a woman at a time when literary theory was almost the
    exclusive domain of men. Over the last decade—in part in connection with emerging
    interest in ethics and affect—her work has been the object of renewed interest.
    For example, the 2019 theme for the annual convention of the Modern Language Association
    (the largest professional organization for scholars of language and literature
    in North America), “Beyond Text and Transaction,” deliberately played off of one
    of her core concepts, “the textual transaction.”


    Rosenblatt’s interest in pedagogy was an extension of her literary theory, at
    the center of which was a critique of tendencies to treat the text first and foremost
    as an object. This, she argued, can lead to impoverished efferent modes of reading
    literary texts; to read literature qua literature requires instead an aesthetic
    transaction. By working out why they respond to a literary work in the way that
    they do, Rosenblatt argued, readers can clarify their values and share in the
    values of others. Allowing space for aesthetic response in our approach to literary
    texts can thus be the basis for ethical activity—which she, fueled by anti-authoritarian
    sentiments rooted in the post-Second World War time period, associated with democratic
    education (comp. Vytniorgu 2018).


    In cursory citations of efferent and aesthetic reading, it often gets overlooked
    that Rosenblatt’s theories of literary reading are deeply ecological—in ways that
    resonate with sociocultural and social semiotic models within applied linguistics
    (e.g., Byrnes et al. 2006; Levine 2020; van Lier 2004; comp. Leander et al. 2017)
    and in ways that might augment models of second language literacy. Leo van Lier,
    whose book *The Ecology and Semiotics of Language Learning* has been seminal in
    discussions of ecological approaches to language teaching and learning, described
    the self in an ecological understanding of language as “not just a detached observer
    taking in the world through the window of the mind,”'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'but […] an ongoing project of establishing one’s place in the world” (2004:
    115). In a comparable observation, Rosenblatt argued that language should not
    be seen as “a self-contained, ungrounded, ready-made code of signifier and signifieds,
    but as embodied in transactions between individuals and their social and natural
    context” (1986: 123). Within these contexts, we are constantly engaged in “choosing
    activity”; in the event of reading, the reader consciously or unconsciously chooses
    a stance, a “selective attitude,” “bringing certain aspects into the center of
    attention and pushing others into the fringes.” (Rosenblatt 1988: 5). Rosenblatt
    conceptualized this push and pull of attention along a dynamic continuum of efferent
    and aesthetic, depending on whether attention is more focused on what is to be
    done when the reading ends (efferent) or whether the reader welcomes into awareness
    the sensations, images, feelings, and ideas evoked through reading (aesthetic).
    When transposed into pedagogical practice, the former might prioritize reading
    for information or for the names, dates, and plot highlights that characterize
    literary study guides and Wikipedia articles; only through aesthetic reading can
    more transformative learning take place.


    Reader response theories in general and those of Rosenblatt more specifically
    are sometimes cast as a sort of solipsism or hyper-personalization that feels
    at odds with contemporary theories of interculturality and literacy, where the
    social and cultural nature of meaning making is emphasized (e.g., Kern 2000; Kramsch
    1993; Liddicoat & Scarino 2013).¹ Contemporary multiliteracies theories, which
    have had a significant influence on North American language-culture teaching over
    the last two decades (e.g., Allen & Paesani 2010; Paesani et al. 2015), offer
    a framework for reconceptualizing the connections between personal aesthetic response
    and sociocultural practices of meaning making as *design*. This notion, originally
    proposed by the New London Group (1996) and inspired heavily by M.A.K. Halliday’s
    social semiotics, treats language and other modes of communication as dynamic
    resources, *Available Designs*, for meaning making. These undergo constant changes
    through acts of *Designing* as language users attempt to achieve their own purposes
    in new contexts. *Designing* leads to the emergence of the *Redesigned*, new meanings
    through which the world and the meaning maker alike are transformed (New London
    Group 1996: 73–6). *Design* is intended to foreground the creative, generative
    potential of language, while also providing a framework for conceptualizing the
    recurrent, conventionalized ways in which many available designs are taken up
    in practice.


    Rosenblatt’s model of transactional reading is not incompatible with this notion
    of design, although it also diverges in scope and focus in some key ways. For
    Rosenblatt one’s individual, personal response should be the beginning, not'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'the entirety of the transactional process and she is critical of extreme forms
    of subjectivism; deep aesthetic reading needs to be conscientious and responsible,
    maintaining an attentiveness to the intentions of the author of a text. We assume,
    after all, that as (compare Council of Europe 2018).


    Rosenblatt described this kind of aesthetic reading experience as “a reciprocal,
    mutually defining relationship in which the elements or parts are aspects or phases
    of a total situation or event” (Rosenblatt 1986: 122–3). Aesthetic reading is
    thus not just pleasure reading nor is some kind of solipsistic response in which
    readers impose their meaning on a text, rather it is a complex process of evocation
    and response, in which we as readers


    > … respond to the very story or poem that we are evoking during the transaction
    with the text. In order to shape the work, we draw on our reservoir of past experience
    with people and the world, our past inner linkage of words and things, our past
    encounters with spoken or written texts. We listen to the sound of words in the
    inner ear; we lend our sensations, our emotions, our sense of being alive, to
    the new experience which, we feel, corresponds to the text. We participate in
    the story, we identify with characters, we share their conflicts and their feelings.
    At the same time there is a stream of responses being generated. There may be
    a sense of pleasure in our own creative activity, an awareness of pleasant or
    awkward sound and movement in the words, a feeling of approval or disapproval
    of the characters and their behavior. We may be aware of a contrast between the
    assumptions or expectations about life that we brought to the reading and the
    attitudes, moral codes, social situations we are living through in the world created
    in transaction with the text (1982: 270).


    This “interanimating” (Rosenblatt 1978: 53) relationship between the text and
    the reader is what inspired her to choose the term “transaction” instead of “interaction,”
    which she felt suggests that these are two discrete entities. Also for this reason,
    she cautioned against imposing the interpretations of *professional readers*,
    such as critics and scholars, or pushing students to move too quickly'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'to an abstracted *reading*, which can cut short the “sensed, felt, thought
    nature of evocation” (p. 135). The initial encounter with the text is vital for
    Rosenblatt, because, unlike the critic or scholar, the readers’ “primary subject
    matter is the web of feelings, sensations, images, ideas” woven between them and
    the text (1978: 137; see also Flynn 2007: 65).


    Rosenblatt’s commitment to the centrality of the lived experience of reading anticipates
    the more recent critiques of design approaches from within literacy studies (e.g.,
    Leander & Boldt 2013; Pahl & Rowsell 2020), as well as poststructuralist theories
    of affect within applied linguists (e.g., Kong 2019; Prior 2019). While noting
    the value of multiliteracies frameworks for expanding the scope of literacy and
    language education, Kevin Leander and Gail Boldt’s (2013) critical re-reading
    of the New London Group’s (1996) influential manifesto takes issue with the hyper-rationality
    often implied in the design metaphor on the basis that literacy-related activity
    is often not projected toward some textual end point or clearly defined purpose
    but “as living its life in the ongoing present, forming relations and connections
    across signs, objects, and bodies in often unexpected ways” (p. 26). Leander and
    Boldt argue further that literacy activity “is saturated with affect and emotion;
    that it creates and is fed by an ongoing series of affective intensities that
    are different from the rational control of meanings and forms” (p. 26). Literary
    studies scholar, Christian Ehret, draws on non-representational theory to suggest
    that literacy events have major and minor keys; whereas the former relates to
    “the structural tendency that organizes itself according to predetermined definitions
    of value,” (Manning 2016: 1; cited in Ehret: 567) such as designs, the latter
    “produces transformations that are primarily felt” (p. 571). Ehret’s overarching
    argument is that we as scholars and educators of language and literacy must work
    to attend to both. This idea of keying is a potentially helpful heuristic for
    both recognizing that much of what constitutes a literacy event is emergent and
    undirected, there is also a push and pull between these feelings and affects and
    the structures of value shaped by our social histories of reading, including those
    of the classroom.


    Rosenblatt’s transactional readers are responsive in the moment, but they are
    also self-aware and reflective, which is where the potential for ethical learning
    enters. By helping individual readers to work out why they evoked a literary work
    the way they did and spurring them to talk to others about their experiences with
    the same text it is not only reader response, but readerly responsibility that
    is fostered through the kinds of awareness at play in aesthetic reading and this
    (for Rosenblatt) is the ethical potential of literature, because it enables us
    to (at least provisionally) participate in the needs, aspirations, and affective
    dispositions'
