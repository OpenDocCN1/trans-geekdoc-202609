- pgno: 27
  md: '# Deep Lingualculture Learning in Transformative, Holistic, and Contemplative-Reflective
    Forms


    Rebecca L. Oxford


    # Introduction


    The purpose of this chapter is to explore transformative, holistic (holistic-experiential
    and holistic-humanistic, which overlap greatly), and contemplative-reflective
    learning approaches. These contribute to *deep lingualculture learning*, to use
    Shaules’ (2019) term. *Lingualculture* is the integration of language and culture
    (see Risager 2020). Our original lingualculture is the surrounding in which we
    live and move and have our being, and that original lingualculture is also inside
    us, shaping what we think, do, and feel. Unfortunately, many language teachers,
    language program administrators, and heads of schools, universities, and institutes
    think that learners need (or at least will accept) years of disembodied language
    instruction with a few sprinkles of cultural knowledge added to liven up the proceedings.
    Nevertheless, what learners really need, ultimately, is the full-bodied experience
    of deep lingualculture learning, in which the language and culture are both honored
    and united.


    This chapter argues that deep lingualculture learning ultimately aims to contribute
    not only to individual learner wellbeing but also to the wellbeing of others and
    of society at large. I believe such learning can create communities of support,
    respect, and care; foster transformation in the learner and the world; address
    the whole learner; offer astounding experiences of language and culture, increasingly
    called lingualculture; and constantly provide reflection opportunities. In the
    process, the learner discovers unexpected inner talents and strengths. Challenges
    arise, fear or confusion emerges, and'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'difficulty is in the air, yet the learner finds inner wells of resilience.
    None of this is done in isolation or loneliness. Much of the magic comes from
    relationships.


    Ethically speaking, deep linguacultural learning should aim to enhance the wellbeing
    of learners and all others involved. Martin Seligman (2011: 16), the father of
    positive psychology, created the acronym PERMA to summarize his version of wellbeing:
    positive emotion, engagement, (positive) _relationships_, _meaning_, and _accomplishment_.
    PERMA is oriented to the wellbeing of an individual who engaged in some effort,
    has relationships with people, and seeks meaning, positive emotions, and accomplishment.
    PERMA offers a snapshot of personal wellbeing, and that’s fine; yet to me it does
    not overtly signal deep concern for others’ wellbeing, without which my own wellbeing
    cannot be complete. PERMA is the child of an individualist culture, as I am. Providing
    a balance to the individualistic focus is the South African tradition of _ubuntu_,
    which roughly means, “I can only be human through you” or “I am because we are.”
    As explained by Archbishop Emeritus Desmond Tutu (1999), “_Ubuntu_ […] speaks
    of the very essence of being human[:] … generous, … hospitable, … friendly and
    caring and compassionate…. It is to say, ‘My humanity is caught up, is inextricably
    bound up, in yours.’ We belong in a bundle of life. We say, ‘A person is a person
    through other persons’” (p. 196). Individualistic cultural views of wellbeing
    are not wrong, but the spirit of _ubuntu_ adds some necessary notes to the symphony.
    Linguaculture learning can be especially valuable for bringing people together
    in that _ubuntu_ spirit.


    In this chapter, deep linguaculture learning—deeply learning a linguaculture that
    is not one’s own—is associated with a conception of wellbeing that means much
    more than one’s own personal wellbeing. Here, the definition of _wellbeing_ means
    caring about all people; giving compassion others and ourselves; listening mindfully,
    cherishing family and friends, and being kind to all; engaging in and/or supporting
    deep learning of any kind; exploring meaningfully; being curious; being increasingly
    flexible and willing to learn. Wellbeing for deep linguaculture learning also
    means participating in new ways of communicating and thinking; being open to new
    ideas; understanding that emotion and cognition are inseparable, as are language
    and culture. For some people, the above elements of wellbeing are obvious, but
    these elements do not seem to be on everyone’s radar screen. However, anyone can
    work to develop these potentials and burnish them with use. Deep linguacultural
    learning can be a central part of this wellbeing process, and therein lies one
    of the greatest adventures of a lifetime.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The chapter first of all considers the nature of deep learning of linguaculture,
    and then goes on to highlight theories and theorists that have offered different
    perspectives on transformative learning, holistic-experiential/holistic-humanistic
    learning, and contemplative-reflective learning.


    # Theoretical Exploration


    # More on Deep Learning of Linguaculture


    The idea that learning of linguaculture can be meaningfully understood through
    the notion of “deep learning” has been put forward recently by Joseph Shaules
    (2019), in an attempt to find common ground between language learning and culture
    learning. Shaules (2019) defined deep learning as “the process of embodying complex
    domains of socio-cognitive knowledge” (9). He made a distinction between explicit,
    conceptual surface learning (memorizing letters, sounds, words, sentences, and
    grammatical patterns, typically unconnected with a cultural context) to deep (intuitive,
    implicit) linguaculture learning. Through deep learning and with an attitude of
    engagement, the person’s social, cultural, and linguistic boundaries enlarge.
    I believe this provides opportunities to encounter and interpret new perspectives,
    ideas, lifeways, and communications; expand social interactions and form new bonds;
    uncover personal strengths and emergent identities; and better understand one’s
    original linguaculture while deeply learning the new linguaculture.


    Language is part of culture and is simultaneously a crucial vehicle through which
    culture is expressed. All forms of language—spoken, written, para-verbal (e.g.,
    voice tone, pitch, and pacing), and nonverbal (e.g., gestures and gaze)—embody
    culture. Art, music, and dance are often called “languages,” and they, too, embody
    and express culture. Though a constant process of rich, stimulating encounters
    with aspects of linguaculture, the learner intuits—implicitly knows—the astounding
    complexity and depth of linguaculture. Language and culture are virtually unconnected
    in surface learning, but they become increasingly integrated at the deeper levels
    of implicit, intuitive learning (Shaules 2019). Consider this analogy. At the
    level of surface knowledge, language, and culture are like two islands in the
    ocean: separate, far distanced, not interacting. Each would look distorted or
    misshapen if seen from above. However, if divers go deeper and deeper into the
    waters of the ocean, they discover what had been hidden at the surface. At the
    level of deep knowledge, ocean divers encounter'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'brilliantly colored, lustrous, thick webs of knowledge. These webs are wrapped
    and woven together so tightly that they seem to comprise a deep, underwater continent
    of linguculture, in which language and culture are fully integrated, interwoven,
    inseparable, indivisible.


    Merely adding culture objectives to existing language objectives does not lead
    to deep linguaculture learning (Shaules 2019); it risks creating long lists of
    impossible-to-meet objectives. If the hope is to integrate language and culture,
    none of the following is sufficient: tacking culture lessons onto language lessons
    and hoping for the best; planning for one day of culture learning to every four
    days of language learning; or piling up random layers of surface-level culture
    knowledge and language knowledge for no particular purpose. In a university Russian
    class, we gained extremely superficial knowledge of Russian words. Rote-memorizing
    culture facts was avoided, but the only course requirement was memorizing alphabetized
    sets of pages from an immense Russian-English dictionary and being tested each
    week, without any opportunity to use the memorized words. That resulted in the
    pile-up of surface-level knowledge, which perished rapidly without use. The random
    display of things to memorize would have been even larger if the teacher had additionally
    added context-free culture facts to memorize.


    As per Shaules (2019), deep linguaculture learning involves a process of psychological
    adjustment, with learning triggered by adaptive demands. Many pressures occur
    all at once. Learners encounter the seeming strangeness of the language and the
    demands to internalize the new system of communication as soon as possible while
    simultaneously trying to adapt culturally and psychologically. Shaules (this volume)
    argues that these adaptive demands on the learner generate the potential for both
    resistance and engagement. Resistance can be characterized by a rejection of the
    learning experience as a whole or by more ambivalent motivational states. Resistance
    can also take the form of a psychological aversion toward particular features
    of language (McConachy, this volume). These ideas about resistance make a connection
    between the adaptive demands discussed by Shaules’ chapter (this volume), and
    the current chapter’s focus on wellbeing. When the learner is able to successfully
    negotiate and adapt to new experiences of foreignness and overcome the urge to
    retreat, the possibility for transformation and wellbeing emerges. The idea is
    that we need to recognize the potential for foreign linguaculture learning to
    be useful and psychologically challenging and to therefore place learner wellbeing
    at the forefront. This is a view which strongly resonates with my own.


    Deep linguaculture learning can be usefully conceptualized in terms of its emphasis
    on learner transformation, its commitment to the holistic and'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'experiential nature of learning, and its recognition of the need for contemplation
    (also known as reflection) as a key part of learning. As presented in Figure 1.1,
    deep linguaculture learning has important points of connection with these three
    different, yet overlapping, traditions of learning. Whilst these have come about
    through their own historical and theoretical trajectories, all have the potential
    to offer significant insights into the nature of deep linguaculture learning.
    In the following sections, I am to deal with each of them in turn, highlighting
    key theorists and other relevant work along the way.


    There are similarities among these dimensions of learning. The differences are
    often in emphasis and details, with the purposes being similar. For instance,
    Shaules’ (2019, 2020) works on deep linguaculture learning frequently refer to
    the other terms. Anthologies about transformative language learning and teaching
    (Leaver et al. 2021) and transformative learning (Cranton & Taylor 2012) employ
    words like experiential, holistic, deep, and reflective. Each learning approach
    has its own flavor, with certain flavors, compared with others, appealing to some
    learners and teachers more than to others. I turn first of all to transformative
    learning.


    ![](img/5148f48c5f0c46f3e824e5080bd81aae_31_0.png)


    # **Figure 1.1**  Three Overlapping Approaches to Deep Linguaculture Learning'
