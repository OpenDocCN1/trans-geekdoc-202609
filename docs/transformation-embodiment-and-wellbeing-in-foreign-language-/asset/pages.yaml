  md: '“embodied experiences, emotional resonances, and moral imaginings” (2006: 251)
    and for this reason, Kramsch argues that symbolic competence “ought to be nourished
    by a literary imagination at all levels of the language curriculum” (2006: 251).
    This echoes Rosenblatt’s claims that personal response can serve as a matrix for
    analyzing the social cultural influences on a reader, and furthermore suggests
    that aesthetic experiences such as those evoked during transactional literacy
