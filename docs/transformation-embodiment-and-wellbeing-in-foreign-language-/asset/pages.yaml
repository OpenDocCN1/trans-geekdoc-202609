    given a week after the treatment. The tests consisted of several tasks (i.e.,
    a fill-in task, a free production task, and a judgment task); however, in the
    interest of space, only the results of the fill-in task in which participants
    had to complete twelve sentences with the correct causative verb and the correct
    complement will be presented. All the sentences in the tests were adapted from
    the Corpus of Contemporary American to ensure that the causative constructions
    were naturally produced by English L1 speakers.


    Results showed that participants experienced gains on the immediate post-test
    and delayed post-test (see Table 5.1). A one-way repeated measures ANOVA run on
    the pre-test, post-test, and delayed post-test indicated that there was a significant
    difference among the three tests, *F*(2, 60) = 10.471, *p* = .000, partial η²
    = .259, a medium effect size. Post-hoc tests using Bonferroni’s correction revealed
    that there was a significant difference between the pre-test and the immediate
    post-test (*p* = .030), and between the pre-test and the delayed post-test (*p*
    = .000). No significant difference was observed between the immediate post-test
    and the delayed post-test (*p* = .456).


    These findings suggested that the visual presentation of the embodied effectively
    helped learners process new information regarding causative constructions. The
    pedagogic tasks further helped them intuitively grasp the target constructions.
    To increase leverage for optimal embodied learning experience, teachers could
    combine the virtual presentation with activities that emphasize learner movement
    and investigate its potential by means of a pre-test and a post-test. Teachers
    could then explore students’ perception toward this embodied approach to learning
    grammar through a questionnaire on their learning experience.


    # Conclusion


    The chapter has argued that CL analyses of embodied linguistic meanings could
    be developed into embodied learning activities that would encourage learners to
    make and engage with meanings through embodied experience,'
