  md: 'middle). Knowing Klara’s frustration with the *Ostalgie* literature on the
    basis that it felt too unserious, I also found it intriguing that she had chosen
    to write a tragedy, and one that allowed her to incorporate her expanding repertoire
    of linguistic and cultural knowledge into a likely more familiar narrative of
    the Berlin Wall as a mechanism for imprisonment constructed by a malevolent state.
    The premise of Klara’s story, that a teenager who is a citizen of West Germany
    would be held captive by the Berlin Wall was historically implausible, but seemed
    to create an opportunity for Klara to make sense of her aesthetic responses to
    the readings from the class. In this way, the creative writing provided an opportunity
    for transactional literacy as part of a series of interconnected aesthetic events.


    A little more than a year after the course had ended, I re-encountered Klara’s
    composition, when sorting through various learning artifacts from this course
    as part of a research study. Although Klara had not been a student in my class
    again, we had stayed in touch enough for me to know that she moved back to the
    city an hour away from our campus to live with her family. I reached out to ask
    if she remembered writing this story and why she had chosen to write what she
    did. She responded in an email, in which she affirmed that she remembered this
    assignment quite clearly and went on to share the following:


    > > This time in my life was particularly hard, my mom had cancer and that put
    a kind of depressing overtone to a lot of my writing . . . I re-read the one you
    sent, and I have half a mind to correct it, lol.

    > >

    > > German helped me get out of my depression [...]

    > >

    > > I had really not known anything about the Berlin Wall, but thinking about
    that period of time, I had wondered what I would do if I was separated from my
    family for good instead of me just being a city away from them; not knowing how
    they were doing, not knowing if I’d ever see them again. And I think that’s what
    prompted the story. If I was young and I wanted it that badly for that many years,
    would I try to do it; no matter what the costs?


    This was a dimension of Klara’s experiences with the readings that I had not been
    privy to during the class. Despite giving an impression of being outspoken and
    forthcoming, Klara had not shared anything of what was happening with her family
    life with me or in class. But this had also been a part of her aesthetic experience
    of the readings from the class including the *Ostalgie* texts. The narratives
    seemed to create an affective space of imagination within which she was able to
    experience feelings that were both familiar and defamiliarized. As she described
    it, writing the story enabled for Klara something like what Ehret describes as
