  md: 'competitively in Britain in English-medium contexts alongside life-long users
    of English. Learning is “a long-running marathon,” “a grueling competition: you
    can win only by training hard, with patience, determination and confidence”; “in
    this competition race, everyone tries their best to be first: if you give up learning
    just for one day, you’ll fall behind others.” The metaphors emphasize student
    needs for endurance, a strong-will, and endless determination to maintain an unceasing
    effort “to overtake others and surpass them on the road.” The highly selective
    competition for educational opportunities through English is symbolized by quoting
    a saying: “Learning English is an army crossing a dangerous river over a one-log
    bridge”: “On this bridge you just have only the one direction and must keep going
    this way or you will fall off.”


    A salient feature of the journey is the envisaged successful destination. Many
    learners imagine “a bright future in a job” by “crossing the bridge to success,”
    “to real the ideal end-point, the climax of success,” “the road to success, full
    of tears and mirth; the process is bitter, the result is sweet.” This is “the
    process to enrich yourself,” “you can climb from a lower social position to a
    higher one,” “to realize your dreams.” The “bridge” is further characterized as
    “the bridge between the past and the future,” “a bridge for students from the
    countryside to come out of the mountains and create a nice life,” “the bridge
    between a dream and reality, connecting ideals and reality.” For other Chinese
    students in Britain, what matters is the process of the learning journey, “the
    result is not so important, I enjoy the process of travelling”; “we enjoy the
    process of the journey, not the destination we arrive at.”


    # Learners: Transformation of the Self and Growth


    Our dataset shows that many students see the learning journey as a process of
    self-change and developing self-knowledge based on accessing truth. Learning is
    “to walk forward on the road of pursuing truth,” “the path to change your life,
    the way to get wisdom.” For some, this “way” or “path” may have philosophical
    or spiritual resonances of Chinese heritage worldviews within Taoist, Confucian,
    Buddhist, and Islamic traditions. In metaphors, students assert: “the way of learning
    is the process of seeking oneself,” “the way to know your true self,” “the path
    to our heart,” “the way to perfect oneself.” This may feature enlightenment: “the
    sudden comprehension that you have are like the flowers that bloom suddenly in
    your heart.” It may recall features of Confucian traditions of teaching (Jin &
    Cortazzi 2008, 2020): it is “a walk along the road travelled by our ancestors,”
    because “teachers help us grow up healthily in the edification of Confucianism.”'
