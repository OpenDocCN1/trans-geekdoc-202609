    The multiliteracies-inspired curriculum of the course was structured around three
    topics, which were each linked to a particular genre family (see Table 7.1). The
    readings for each unit related to the theme, but also were selected as models
    of the genre or aspects thereof. For example, the second unit—where the lesson
    at the center of this study was situated—included examples of narratives in multiple
    modalities and in a variety of forms including poetry, prose, film, and recorded
    testimony. The primary assessments were three literacy-based tasks completed across
    multiple drafts: a descriptive text, a narrative, and an argumentative essay.
    The readings from the corresponding unit served as models for designing each of
    these compositions, but the connection to the theme was more implicit. This was
    intentional in order to allow enough openness in the tasks for students to have
    some freedom in what they wrote, while also providing them with enough reflection
    on the kinds of available designs that might be relevant, e.g., past tense verbs,
    causal adverbs, and temporal expressions in a narrative. Additionally, students
    were asked to write a more informal response to each text read or viewed for the
    class in a journal, which was assessed based on completion every two weeks. Students
    were sometimes given suggested writing prompts for these journals, but they were
    envisioned as a space where to respond more freely to the readings, while also
    giving the instructors a chance to dialogue a little with each student’s thoughts—since
    this was otherwise not easily afforded by the large size of the class (twenty-two
    students).


    While the stated objectives of the course were organized around specific available
    designs, i.e., those related to the three genre families associated with each
    unit, both my co-teacher and I had extensive discussions throughout the semester
    about how to also make space for student responses to the texts. Rather than foregrounding
    the historical context or dominant readings, as is often done in second language-culture
    textbooks (see Gramling & Warner 2011; Warner 2014), we tried to promote an iterative
    process of reading, where discussions of the students’ first responses and evocations
    were guided toward questions that allowed the students to revisit the text with
    new forms of self-awareness. For example, in the second unit, which will be the
    focus of this case study, students were provided with a digital version of the
    text that included hyperlinked explications and intertextual references related
    to some of the cultural allusions in the text but were encouraged to consult these
    only when so moved during the first reading. In class, as questions about the
    context and how we might interpret the narrators’ actions within that cultural-historical
    moment arose, students'
