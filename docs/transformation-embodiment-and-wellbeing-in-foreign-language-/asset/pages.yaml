    speaker''s words can be turned into active, collaborative explorations of intercultural
    meaning-making. Of course, stretches of dialogue or short scenes can also work
    extremely well, and the use of techniques such as “Five Point Chase,” “One-Word
    Dialogues,” and “Scene Studies” (RSC 2013: 293–7) opens up further possibilities
    for exploring intercultural interactions. However, whether an extract features
    the words of one speaker or several, this chapter has'
