  md: '# Example 3: “No, I defy all counsel, all redress”


    # CONSTANCE


    > No, I defy all counsel, all redress,

    > But that which ends all counsel, true redress,

    > Death, death; O amiable lovely death:

    > Thou odoriferous stench: sound rottenness:

    > Arise forth from the couch of lasting night,

    > Thou hate and terror to prosperity,

    > And I will kiss thy detestable bones,

    > And put my eyeballs in thy vaulty brows,

    > And ring these fingers with thy household worms,

    > And stop this gap of breath with fulsome dust,

    > And be a carrion monster like thyself:

    > Come, grin on me, and I will think thou smil’st

    > And buss thee as thy wife: misery’s love,

    > O, come to me!


    (KJ 3.3.23–36)


    *General notes:* This extract, in which Constance refuses to be mollified over
    Arthur’s fate, is actually what prompts the cardinal to call her mad in Example
    2. The two can be used together or independently, but if presented in this reverse
    order, this extract’s strange, gruesome juxtapositions can really surprise learners
    who have been examining the logic of the extract above. In the following activities,
    learners are encouraged to enjoy playing with the sound and feel of strange and
    unfamiliar words, and to reflect on how the sense and meaning made through language
    depend on much more than what the words literally mean.


    *Initial readthrough:* For these exercises it is crucial that learners speak and
    hear the words—whether in a circle or pairs/small groups—rather than reading silently.
    This will help them hear certain repetitions (e.g., “death,” “redress”), and certain
    things that stand out as vivid or surprising (“kiss,” “monster,” “worms,” etc.).
    Learners can then call out other words that seem to match these, building up a
    fuller picture of the extract. You can also ask if they can work out, from the
    context, which word is an archaism for “kiss” (“buss”).


    *Exploring polarities:* After a couple of readthroughs, learners will likely have
    noticed some odd juxtapositions of words, sometimes in a single oxymoron (e.g.,
    “amiable lovely death”). These apparent contradictions can be explored by learners
    giving a thumbs up/thumbs down when they hear clearly positive/negative words.
    This'
