- pgno: 149
  md: 'of Mark Johnson (2008), who, he writes, “rejects the idea of a disembodied
    mind and situates bodily experience and higher propositional thinking along the
    same continuum rather than seeing them as fundamentally different” (Winston 2015:
    84). In drama, as in life, meaning-making is an intellectual *and* physical endeavor,
    which is felt with and expressed through our bodies—something that drama can bring
    to language learning (Piazzoli 2018).


    +   - *Learning through experience:* Experience is hugely important within this
    pedagogical tradition, in ways that often recall the ideas of John Dewey (e.g.,
    1916, 1938). Neelands and O’Hanlon (2011: 240), for example, propose that engaging
    with Shakespeare’s works should be a “double entitlement”—both cultural and curricular—that
    opens possibilities for Shakespeare to be “a source of pleasure” for learners,
    and “a reference point for understanding the complexities of their own and other
    lives.” Such possibilities, they stress, should be “life-long and life-wide,”
    as school should be about more than narrow instrumental aims related to assessment
    and employability (ibid.). Here, “experience” refers not merely to learners being
    taught about or discussing situations that commonly occur in everyday life (e.g.,
    in the world of work), but to the “genuine situation of experience” (Dewey 1916:
    167) they can encounter in meaningful educational interactions. Such experiences
    occur through activities that allow learners to actively engage in tasks that
    matter—aesthetically, emotionally, intellectually—and that they can bring to a
    satisfying conclusion through their own acts of experimentation and interpretation.

    +   - *Learning through beauty:* Following Dewey’s (1916) distinction between
    everyday experiences and those that are singular and significant, Winston (2015:
    81) argues that “[w]hat turns *any* experience into *an* experience—into something
    memorable, intrinsically worthwhile, satisfying and rewarding in itself—is its
    aesthetic quality.” In *Beauty and Education*, Winston had already written that
    “[t]o engage with Shakespeare’s dramatic poetry is to experience the expressive
    power of language at its most intense and beautiful” (2010: 102), but this is
    not simply through learners coming into contact with something beautiful and/or
    sublime in a Kantian sense. In active approaches, the aesthetic and formal qualities
    of Shakespeare are not merely noticed, but dynamically experienced through physical,
    playful engagement in a cooperative atmosphere, which lessens the hold of self-consciousness
    and individual preoccupations, marking the experience out from run-of-the-mill
    everyday life.'
