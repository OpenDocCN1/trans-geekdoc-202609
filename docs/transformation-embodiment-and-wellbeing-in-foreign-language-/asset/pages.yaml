- pgno: 146
  md: "that harness and explore affective, embodied, and imaginative engagements with\
    \ Shakespeare’s language. Specifically, this chapter draws on a tradition of what\
    \ are known as active, creative, or rehearsal room approaches (Banks 2014; Gibson\
    \ 1998; RSC 2013; Stredder 2009), which the following section introduces.\n\n\
    # Overview of Active Shakespeare Pedagogy\n\nAs Banks (2014) and Olive (2015)\
    \ have pointed out, “active” techniques for Shakespeare involving performance\
    \ elements were advocated as far back as the first two decades of the twentieth\
    \ century. However, the pedagogy now known broadly as “active” approaches to Shakespeare\
    \ is most commonly associated with Rex Gibson (1998), whose Shakespeare and Schools\
    \ project had a huge impact on the teaching of Shakespeare within British education\
    \ (Winston 2015). Gibson’s influence can be seen in a number of guides for teachers\
    \ that have proved popular in the UK, especially Stredder’s The North Face of\
    \ Shakespeare (2009), The RSC Shakespeare Toolkit for Teachers (2013), and Banks’s\
    \ Creative Shakespeare (2014), which outlines Shakespeare’s Globe’s version of\
    \ active methods. Given the extent of his influence, it is useful to quote Gibson’s\
    \ original definition:\n\n> Active methods comprise a wide range of expressive,\
    \ creative and physical activities. They recognise that Shakespeare wrote his\
    \ plays for performance, and that his scripts are completed by enactment of some\
    \ kind. The dramatic context demands classroom practices that are the antithesis\
    \ of methods in which students sit passively, without intellectual or emotional\
    \ engagement.\n> \n> (1998: xii)\n\nDespite some variation in individual and institutional\
    \ practices, and alternative names such as “rehearsal room” or “creative” approaches,\
    \ all the aforementioned texts echo Gibson’s belief in the importance of enacting—rather\
    \ than just reading—the plays. This does not, however, mean that the aim is always\
    \ to produce performances that will be viewed by an audience beyond the classroom.\
    \ Instead, various “expressive, creative and physical activities” (Gibson 1998:\
    \ xii) are advocated to help students engage with and understand Shakespeare as\
    \ they play out, and play with, his texts. Finally, and most contentiously, all\
    \ present this approach as an improvement on a generalized vision of deskbound,\
    \ teacher-centered, literary critical teaching of Shakespeare, which is seen as\
    \ reinforcing the idea that Shakespeare is “as indifferent and unscaleable” as\
    \ an icy mountain peak (Stredder 2009: 3)."
