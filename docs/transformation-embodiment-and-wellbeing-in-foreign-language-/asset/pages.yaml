- pgno: 181
  md: 'together with the exploration of the cultural and historical context, we were
    able to encourage different kinds of relationships to the different values, perceptions,
    feelings, and experiences those growing up in East Germany may have had. Klara’s
    short story shows how difficult this can be; she in effect tries to consolidate
    some of the new information she has gleaned into a more familiar narrative. But
    had I not asked her about the decision to write this story, I would have missed
    that this was also evoked through the incommensurability of the satirical, laconic
    affect worlds of the literary texts and her feelings at the time. I might have
    been inclined to focus only on what she got wrong, i.e., the implausibility of
    the initial premise, and my own feelings about American tendencies to turn stories
    from East Germany into tragedies. To respond to aesthetic experiences in the flow
    of pedagogical activities, educators will need to develop practices of listening
    and to tune into their own aesthetic responses, both to the assigned readings
    and to the students’ contributions, so that we can be open to complexity of transactional
    literacy. We must also begin to articulate connections between transactional reading
    and more competence-oriented goals of our curricula, such as those represented
    by the new CEFR descriptors related to literary reading, while recognizing that
    we cannot conflate aesthetic response with “reading for leisure” or “analysis
    of creative text” (compare Council of Europe 2018). At the same time, we must
    also be okay with not always knowing what our students are feeling in relation
    to a text. Klara shared these personal details with me in an act of trust, but
    students cannot be obligated to divulge intimate details of their lives that are
    part of the experience of their reading. This makes it all the more important
    that educators also keep an openness to the personal and impersonal forces that
    produce literacy events, even when we cannot always know them ourselves.


    In conclusion, taking aesthetic response seriously as a part of language-culture
    learning and in a way that acknowledges learners as whole humans does not require
    that we abandon completely the attention to available designs or communicative
    functions that often shape our curricula and learning objectives, but it does
    ask that we infuse the activities that help our learners to realize these forms
    of learning with space for movement, for learners and ourselves to be moved through
    thoughts, feelings, and relations that are shared and unshared, and for meaning
    making to be as much in the moment-to-moment experiences of living in relation
    to texts as in the destination.'
