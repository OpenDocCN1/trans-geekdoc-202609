- pgno: 90
  md: '(Bresler 2004). In parallel, humanistic orientations specific to language teaching,
    as well as positive psychology, emphasize conjoining cognition and emotions for
    learner wellbeing and whole-person development (Arnold 1999; Gabryś-Barker et
    al. 2016; MacIntyre et al. 2016), which are further linked to cultural shifts
    and transformative learning (Leaver et al. 2021; Shaules 2019). However, these
    meta-functions in Figure 3.2 are specifically part of the conceptualization of
    language learning, or “*journeys of learning,*” they are held by student and teacher
    participants in China, most of whom are unlikely to be familiar with these ideas
    of “Western” curriculum theorists or whole-person language teaching scholarship.


    # Applications toward Developing Cultures of Learning in Synergy


    Our suggestions for applications are framed within a cultures of learning approach
    aimed at developing an enhanced synergy. In this view, a learner-centered approach
    must attend seriously to learners’ ideas about learning, known here through their
    metaphors (students presumably already learn about teachers’ professional concepts
    of language learning—implicitly through activities, if not explicitly through
    explanations). The cultures of learning approach is reciprocal; it seeks to engage
    teachers and students in a mutual endeavor to learn more about each other’s perspectives
    on learning, exemplified here through metaphor viewpoints.


    > “Cultural synergy” is a concept for pedagogic interaction in internationalized
    and multicultural language learning contexts. This means more than recognizing
    or respecting differing cultures, communities, and practices of learning (Cortazzi
    & Jin 2002; Jin & Cortazzi 1995, 2020). It is learning-centered in that it constitutes
    *learning about learning* from the cultural perspectives of participants. Metaphors
    give insight into this. Students learn about language learning from teachers (or
    from fellow learners). Reciprocally, teachers can learn more about learning by
    attending explicitly to students’ cultures of learning, both as a point of professional
    development and for practical pedagogy. Teachers might use their own metaphors
    to explain clearly how they expect learners to learn, and the ways in which they
    themselves teach, with an informed rationale. Similarly, students are encouraged
    to share metaphors to show their particular visions of learning portrayed in journeys
    of learning. Making and sharing metaphors provides a practical vehicle to do this.
    Synergy recognizes mutual accommodation between participants (but not necessarily
    accommodating half-way) to attain a more holistic harmony.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Synergy implies developing repertoires of metaphors for learning, derived from
    groups of learners, teachers, and others. Synergy highlights ways in which cultural
    interaction engenders something new that is more than the sum of the separate
    parts. In this sense, internationally, learners and teachers can develop conceptualizations
    of learning and teaching through metaphors from China (and vice versa for Chinese
    conceptualizations drawing on others’ metaphors). Thus, if teachers and learners
    interact with these metaphors, they can ask: What insights and implications are
    there for us in the cultures of learning shown in Chinese participants’ metaphors?
    Can we engage positively with these ideas to extend our own repertoires of metaphors
    within our cultures of learning?


    # Pedagogical Suggestions


    Teachers, teacher trainers, and language educators can use metaphors to reflect
    systematically on the question of “What is language learning?” They can examine
    their own metaphors for journeys of learning and teacher roles within such journeys.
    Their metaphors might be personal (to the individual), or professional (as encountered
    in training), or research-based (as disseminated through theories of language
    learning and pedagogy), or institutional (as found in official documents and reports
    or as heard in collegial discussion), or cultural (as investigated here). The
    examples here encourage imaginative elaboration of metaphors through entailments
    and the clustering of metaphors. Particular questions might arise from evident
    features of learning journeys: how can student difficulties and suffering be alleviated?
    How can teachers try to ensure the practical realization of student ideas and
    ideals?


    Teachers can ascertain the learning journey metaphors held by their own students,
    or related metaphor conceptualizations (about language in general or particular
    foreign languages, about specific language skills, or about given communities
    of language speakers and contexts). Teachers can select some key metaphors (language
    learning is “crossing a bridge,” “climbing a mountain,” or “sailing a boat”) and
    ask students what they think most people would understand by these; what difference
    does it make if we think about learning through these metaphors; what feelings
    or social and cultural implications are involved? The examples presented here
    might serve as stimuli for metaphor-making in class, which engages students’ imagination
    and creativity. Students might find this easier if they draw their journey of
    learning, or make posters, or cartoons, or construct a personal time-line, with
    notes on appropriate stages, depicted people, contexts, and emotional “highs and
    lows.”'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Features of journeys of language learning might be discussed in class, using
    examples from the Figures presented here. Students in groups might engage in a
    mini-task to interview a few members of the public who speak another language
    about “learning a foreign language is a journey.” Interviewers ask which languages
    people have learned and what their experience was like, and especially what people
    understand by the journey metaphor. Related questions might be “Is foreign language
    learning a journey through hell to heaven? Is it a journey towards fulfilling
    your dreams? How does it help you to become a better person?” The results are
    then put together to make posters or electronic presentations with oral commentary
    and conclusions. Similarly, pre-service or novice teachers might make collaborative
    charts based on enquiries with students and their personal-professional experience.
    A major aim of the above is to consider the implications of clusters of metaphors
    and to compare and evaluate features which recognize strengths and limitations
    within familiar contexts and their application to other contexts internationally.
    Ethnic and minority group students, or those from international contexts, should
    find their voices are especially valued in such activities.


    The model of five metaphors with the associated metaphor elaborations merits reflection,
    further research, and imaginative application. It can be “a tool” (or “a textile
    loom,” a framework for weaving multi-colored fabrics) for reflection on the language
    curriculum and specific programs. These surely include cognitive, affective, social-cultural
    elements, but how far do moral-spiritual and aesthetic functions fit in? Could
    all five be more integrated and better-balanced for more holistic and transformative
    language learning? In applied linguistics programs at university level, metaphor
    functions might be taken into account with reference to textbook and materials
    design, levels, and stages of language learning. What might follow if a moral-spiritual
    or aesthetic dimension receives emphasis? How would a teacher relate forthcoming
    teaching of given materials to a holistic perspective for student wellbeing? The
    model can be extended to examining local contexts, international comparisons,
    and expanding the five meta-functions with geographical, historical, political,
    or economic meta-functions.


    From the learning journey metaphors, in a synergetic approach, both students and
    teachers, locally and internationally, can learn from cultures of learning by
    gaining knowledge about them. Understanding how others learn culturally is part
    of a holistic view of learning. Classroom participants often learn implicitly
    with cultures of learning, sometimes peripherally, but this can be made more explicit
    by discussing key practices through metaphors. Since there are many'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'ways to learn, teachers and students can develop a repertoire of ways from
    professional sources and from indigenous and other cultural pedagogies to learn
    *through* different cultures of learning. This may happen for international students
    studying abroad or with international teachers working in different cultural contexts.
    “Cultural synergy” therefore implies that teachers and learners can develop repertoires
    of ways of teaching and learning which extend and complement previously enacted
    ways. Close attention to metaphors of learning journeys can be one practical approach
    toward this.


    # Conclusion


    The metaphors shared here cumulatively help to broaden conceptualizations of language
    learning. They suggest a series of alternative ways to envisage what learning
    a foreign language is like and how it feels for Chinese students and teachers
    or wider international contexts. The metaphors provide resource materials for
    teacher reflection and potential professional development in teacher discussion
    groups. For a learner-responsive pedagogy, it is vital to know *about* and know
    more *through* learners’ and teachers’ metaphors. Sharing teacher and learner
    metaphors can move us toward cultural synergy to inform interaction and influence
    practices which encompass ideas, ideals, and imagination. The study here contributes
    specific metaphor examples for teaching metaphor within a cognitive linguistic
    approach to classroom pedagogy (Holme 2009), but this can be made deeper and broader
    through five meta-functions. The metaphor meta-functions identified here apply
    to many features and facets of language learning—an insight which, shared with
    learners, may promote learners’ confidence to engage with and talk about more
    holistically oriented learning. It is worth exploring how far language learning
    students understand, appreciate, and develop the involvement of their cognition,
    emotion, social-cultural, moral-spiritual, and aesthetic competences. Teachers
    can ask students about their metaphors through elicitation and share their own.
    Teachers, together, might use metaphors to make explicit the cultures of learning
    in their institution before they engage learners more explicitly within the institution
    for more conscious metacognitive engagement. Thus, knowledge and understanding
    of metaphors and meta-functions can contribute as key models of cultures of learning
    to develop practices of cultural synergy. This takes journeys of learning further,
    with many more metaphor paths to explore.'
