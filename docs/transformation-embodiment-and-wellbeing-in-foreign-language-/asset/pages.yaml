  md: '# Exploring Pragmatic Resistance and Moral Emotions in Foreign Language Learning


    Troy McConachy


    # Introduction


    In recent years, research on the learning of second language pragmatics has placed
    increased emphasis on the learner’s subjective experience of coming to understand
    and use a second language (Eslami et al. 2014; Ishihara 2010, 2017, 2019a, b;
    Ishihara & Tarone 2009; McConachy 2018). In contrast to research approaches that
    aim to compare how learners’ pragmatic performance compares to “native speakers”
    of the second language, this line of research aims to shed light on how language
    learners themselves interpret and evaluate issues of language use, context, and
    interpersonal relations within a multilingual and intercultural frame (McConachy
    & Liddicoat 2022). An important theoretical premise in much of this work is that
    the learning of a pragmatics deeply engages the whole person as a social and moral
    being. Many of the pragmatic features and speech acts that tend to receive attention
    in instructional contexts, such as greetings, requests, apologies, compliments,
    offers, are not only central to the construction and maintenance of interpersonal
    relations but are also central to the enactment of individual and social identities
    and speakers’ embodied sense of socially and morally appropriate behavior (Garcés-Conejos
    Blitvich & Kádár 2021; McConachy 2018). Pragmatic decisions such as which request
    form to use, how to respond to a compliment, whether/how to greet strangers or
    not, and whether/how to express disagreement, etc. are fundamentally dependent
    on (unconscious) assumptions about dimensions of social relationships such as
    distance, hierarchy, power, or gender, attitudes such as respect, and broader
    values such as equality or fairness. This means that the experience of learning
    the pragmatics of an additional language can present a challenge to learners’'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'sense of socially and morally desirable linguistic behavior within different
    roles, relationships, and contexts, as well as their own sense of comfort as a
    language user (Ishihara 2019a; Ishihara & Porcellatto 2022; McConachy 2018).


    In the literature, the notion of “pragmatic resistance” has come to refer to instances
    in which language learners seek to strategically depart from L2 pragmatic norms
    due to the perception that the norms are incongruent with elements of their own
    subjectivity, including cultural identities or deep-rooted assumptions about the
    social world and sense of right behavior (e.g., Gomez-Laich 2016; Ishihara 2009,
    2017, 2019a; Ishihara & Tarone 2009; McConachy 2018; Siegal 1996). Whilst much
    work tends to look at pragmatic resistance in terms of learners’ rational decision
    making and agency vis-à-vis their own language use, this chapter will focus more
    on the emotional side of pragmatic resistance, specifically the aversive emotional
    reactions that feed into learners’ pragmatic decision making. As I will discuss
    in this chapter, the emotional side of pragmatic resistance is important not only
    because it relates to learner agency but because it has the potential to lead
    to negative evaluations of linguistic and cultural difference and can be difficult
    for learners to manage. I will argue that pragmatic decision making—including
    the decision to strategically depart from target language norms—is not a purely
    rational process but is rather an embodied process anchored in learners’ felt
    sense of right and wrong social behavior and thus triggers complex evaluative
    processes with cognitive, emotional, and somatic dimensions. I draw on research
    at the intersections of pragmatics and moral psychology which offers insights
    into the role of moral emotions in the evaluation of behavior and suggest ways
    that teachers could engage their learners in exploration of moral emotions as
    a part of learning pragmatics.


    # The Phenomenon of Pragmatic Resistance


    Research on pragmatic resistance has helped to foreground the fact that the learning
    of a second language is not simply a process of simply remembering linguistic
    rules, acquiring new cognitive representations, and forming new linguistic habits;
    it is a complex process that engages the learners’ felt sense of being a legitimate
    social actor as well as deep-rooted assumptions about social relationships and
    notions of appropriate language use in context. It has shown that language learners
    can experience aversion to following a wide range of pragmatic features in an
    L2, including personal pronouns (Liddicoat 2006), politeness'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'routines (Ishihara 2010), honorifics (McConachy & Fujino 2022; Siegal 1996),
    conversational routines (Davis 2007), request realization sequences (Eslami et
    al. 2014), refusals (Al-Issa 2003), and others. As such pragmatic aspects are
    closely linked to conceptualization of the interpersonal realm and the enactment
    of social practices by which individuals and groups maintain relations, cross-linguistic
    pragmatic differences can be felt as highly consequential for learners’ sense
    of self and positioning vis-à-vis others.


    One notable trend in the literature is that pragmatic resistance tends to be positioned
    as an agentive act—and sometimes an act of protest—in the face of pragmatic norms
    that the individual deems to be personally undesirable or even problematic. From
    a behavioral perspective, pragmatic resistance can take various forms, such as
    acts of omission (not carrying out expected pragmatic behaviors) or through following
    L1 pragmatic norms or hybrid alternatives. For example, the Jordanian learners
    of English in Ali-Issa’s (2003) study seemed to perceive that the common pragmatic
    strategies for refusing an invitation, request, or offer of help in English would
    not normally allow for the same elaborate expression of deference toward the other,
    vagueness of reason for refusal, or incorporation of religious references that
    they felt were important to them in Arabic. This is indicative of the range of
    studies into pragmatic resistance in the sense that resistance stems from the
    perception of a mismatch between the sense of symbolic self that learners wish
    to convey and the target language resources perceived to be available (Kramsch
    2011).


    Ishihara (2019a) suggests that “[t]hrough pragmatic resistance, learners exercise
    agency and negotiate their culturally hybrid subjectivity in the uniquely crafted
    third space (Bhabha 1994), a metaphoric place for ‘a discursive subject position’
    culturally diverse speakers construct in interaction” (p. 623). In other words,
    pragmatic resistance occurs in a zone of tension between the normative structures
    and understandings of the social world that underpin L2 pragmatic norms and the
    learners’ own sense of agency to make self-directed linguistic decisions. The
    literature, thus, tends to be sympathetic to the idea that it is legitimate for
    learners to flout pragmatic norms if they feel that these norms are out of sync
    with the image of themselves that they wish to maintain and the identity positions
    they wish to carve out in relation to those in their social sphere. In this sense,
    pragmatic resistance tends to be regarded as a relatively normal and common (yet
    relatively under-researched) phenomenon that arises out of the need for the learner
    to sustain a sense of being oneself within different languages.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'It should be noted that scholars who argue for the importance of learners’
    agency in determining their own pragmatic decisions generally do not advocate
    ignorance of L2 pragmatic norms. In fact, awareness of pragmatic norms is seen
    as an important element in making informed decisions (House 2008; Ishihara 2019b;
    Koutlaki & Eslami 2018; Liddicoat & McConachy 2019; McConachy 2018; van Compernolle
    & Williams 2013). Ishihara (2019a) is careful to distinguish pragmatic resistance
    from negative pragmatic transfer in that the former implies intentionality on
    behalf of the learner to consciously choose how one interacts and thus requires
    awareness of the interactional options. van Compernolle (2016) argues that learners’
    agency as a language user is shaped partly by their awareness of “recognizable
    patterns of meaning and language within a given community” (p. 63) and learners’
    own intent to create a particular kind of meaning. In this sense, agency is enhanced
    when learners have a clearer understanding of the meaning potential of pragmatic
    forms in a range of contexts. This is not a matter of internalizing overly simplistic
    pragmatic rules of thumb but is rather linked to learners’ ability to reflect
    on different dimensions of interpersonal relations such as formality and distance.
    From an intercultural perspective, Liddicoat and McConachy (2019) argue that agency
    is dependent not on learners’ awareness of L2 pragmatic norms in a narrow sense
    but on their capacity for interpreting the meaning-making potential of linguistic
    forms from multiple cultural perspectives and for recognizing how different assumptions
    about social relationships can lead to different perceptions of linguistic in/appropriateness.
    In this sense, they underscore the importance of learners’ having reflexive awareness
    of their own assumptions and the ability to recognize different interpretations
    as potentially valid. Whilst the authors above are coming from different theoretical
    perspectives, they all emphasize the role of conscious understanding of pragmatic
    norms and learners’ ability to think about how they want to position themselves.


    Given the emphasis in the existing literature on analytical processes and seemingly
    rational consideration of preferable courses of action, what tends to be less
    explicitly theorized is the role of emotion in how learners perceive and react
    to pragmatic differences. This is an important topic beginning to attract attention
    in interdisciplinary work at the interface of pragmatics and moral psychology
    (e.g., Spencer-Oatey & Xing 2019; Spencer-Oatey & Kádár 2021). Before delving
    into such theoretical territory, it is first of all useful to look at a number
    of examples of pragmatic resistance in order to foreground different aspects of
    learners’ embodied engagement with difference.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Illustrative Examples of Pragmatic Resistance


    As an accessible entry point for exploring the phenomenon of pragmatic resistance,
    I will present two examples of pragmatic resistance from Anglo-background learners
    of Japanese, one of which comes from my own experience as a learner and user of
    L2 Japanese.


    # Pragmatic Resistance to Pronouns: The Case of “Watashi”


    This reflection relates to my experience of resistance to the first-person pronoun—*watashi*
    (I) in Japanese. Although this is a versatile pronoun which is commonly used by
    both men and women, its predominant use as a neutral pronoun in professional contexts
    makes it the pronoun least capable of indexing a distinctly masculine identity.
    Interestingly, when I first began my language learning journey just before my
    teens, I did not think anything special about *watashi*—I saw it simply as the
    way to say “I” in Japanese. At a time when I still mainly saw languages as codes,
    these were just roughly interchangeable parts for expressing the same thing. It
    was not until I was majoring in Japanese at university in Australia and using
    it as a language of communication with Japanese friends in my hometown that I
    realized I struggled to refer to myself with this word. I was much more comfortable
    with the two other first-person pronouns commonly used by men; namely, *ore* and
    *boku*. The former is the most casual or perhaps “rough” way to say “I,” while
    the latter is somewhere in between *ore* and *watashi*. Clearly, this was not
    a grammatical issue.


    From a phenomenological perspective, the resistance I experienced to *watashi*
    is hard to explain, as it was not something I understood conceptually at that
    point. It was, rather, that the act of referring to myself with this “word” when
    I wanted to express an idea, preference, or stance made me feel awkward and squirmy.
    This word seemed to bring into being a persona which was detached from my usual
    way of “feeling myself” inside language. It felt colorless and stiff, even effeminate.
    It robbed from me my ability to present myself as the laid-back Aussie surfer
    that I thought I was (at that time). To refer to myself as *watashi* would be
    taking myself too seriously and to not be “cool.” This would be out of sync with
    the “vibe” amongst my Japanese surfer friends whom I was interacting with on an
    almost daily basis and who had become my primary reference point for understanding
    the reality of Japanese language beyond what they tell you in the textbook. Even
    after several years of living in Japan and understanding that'
  merge: -1
  img_proc: true
- pgno: 192
  md: '*watashi* was the normal way to refer to oneself in professional contexts,
    I had real trouble using it. Even though I knew that “ore” was completely inappropriate
    in a professional context, I would let it slip out during the first few years
    in Japan. In fact, often I knew I was doing it.


    My own avoidance of *watashi* was certainly conscious and deliberate at particular
    points, though this was almost always accompanied by a sense of guilt for choosing
    a pronoun (i.e., *boku* or *ore*) whilst knowing that this risked upsetting my
    Japanese interlocutors, who were frequently my superiors. It is also potentially
    true that, my unconventional use of pronouns, combined with my status as a “foreigner,”
    contributed to the construction of a hybrid subjectivity and distinct subject
    position (Ishihara 2019b). After all, my interlocutors may not have always expected
    my language use to be “nativelike.” I also realize that my resistance to *watashi*
    occurred at an emotional level—in fact, as a form of aversion with aesthetic and
    somatic features—long before I started to rationalize that it might be due to
    specific aspects of my own identity, more specifically, attachments to a self-concept
    and notions of masculinity rooted in Aussie surf culture. What this means, essentially,
    is that my decision making was not really based on a sense of agency derived from
    conscious, rational understanding. It was primarily based on an embodied aversive
    reaction based on my, admittedly partial, understanding of the nuances of the
    Japanese pronoun system at that time. It was not until I had taken on my first
    role as an instructor working within the university system that I gradually managed
    to use *watashi* without a sense of awkwardness, as I had probably internalized
    a better understanding of Japanese role relations and the indexical potential
    of pronouns by then, and had been away from Australia for six years.


    # **Pragmatic Resistance to Japanese Honorifics: The Example of “Tim”**


    I now turn to a second example which similarly relates to the learning of Japanese
    by another Anglo background learner, as reported in Ishihara & Tarone (2009).
    This example involves “Tim” an Anglo-American learner who had been learning Japanese
    for three years in total and had lived in Japan for eighteen months. Ishihara
    and Tarone (2009) report that although Tim had initially reported being very motivated
    to speak like a Japanese person and had been immersed in Japanese cultural practices
    such as martial arts, he later experienced resistance to the Japanese politeness
    system, particularly honorifics (*keigo*). Referring to initial encounters with
    Japanese politeness, he commented in an email to the researchers that:'
  merge: -1
  img_proc: true
- pgno: 193
  md: '> I didn''t know how to use it, and then I would get upset, because we would
    go out with my friends, and we would bump into like their older friends, and they
    had to speak keigo to them, and they were kind of treated like little children
    and I was like, this is, you know, this isn''t proper. And I didn''t learn.


    As can be seen here, Tim reports aversion to Japanese keigo not only in relation
    to his own language use but more generally in relation to the language use of
    others as well. He seems to be uncomfortable with the idea that relatively minor
    age differences should necessitate the choice of distinct language forms to indicate
    relative position in a vertical hierarchy. What is interesting in the first quote
    is that he experiences pragmatic norms as a moral issue—“this isn''t proper”—and
    that he personally becomes upset at observing others interacting in their native
    language. Below, Tim''s resistance is expressed from the viewpoint of his own
    language use, where he associates linguistic distinctions with the erection of
    communicative and relational barriers.


    > In using keigo, I feel that I am placing a wall between whoever I am addressing,
    and myself. This wall causes me to feel uncomfortable when speaking and I become
    unable to fully express myself... in Japanese the level of language difference
    is so great that it can cause someone not to be heard.


    Tim communicates a sense of discomfort and powerlessness, seemingly wanting for
    communication to take place on a more horizontal plain where each interactant
    has equal footing. Tim''s pragmatic resistance, thus, is associated with a denial
    of the validity of L2 pragmatic norms and a moral objection to (perceived) overemphasis
    on linguistically marked hierarchical distinctions. His reactions seem to be predicated
    on egalitarian assumptions about social relationships that lead to negative judgments
    of Japanese politeness practices.


    # Pragmatic Judgments and Morality within an Embodied Perspective


    Although space limitations prevent detailed presentation of more examples, those
    above help illuminate the fact that the experience of learning pragmatics can
    present a challenge not only to learners’ rational, conceptual understanding of
    self, and others but more fundamentally to their felt sense of being a social'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'actor and intuitive judgments about in/appropriate behavior. As Kramsch (2009)
    has highlighted in her work, “language elicits subjective responses in the speakers
    themselves: emotions, memories, fantasies, projections, identifications. Because
    it is not only a code but also a meaning-making system, language constructs the
    historical sedimentation of meanings that we call ‘selves’” (p. 2). Thus, the
    process by which learners decide how they want to interact in the L2 and whether
    or not—or to what extent—they wish to follow particular L2 pragmatic norms is
    fundamentally an embodied one. This is to say that it evokes not only rational
    processes of sense-making but also aesthetic sensibilities, bodily responses,
    and emotionally driven judgments about right and wrong.


    Even aspects of language that might seem relatively simple from a grammatical
    perspective such as personal pronouns or verb endings used to index politeness
    can become entangled with deep-rooted emotional attachments to the symbolic expression
    of the self. Importantly, this attachment to the familiar has consequences for
    how language learners perceive and evaluate pragmatic and broader cultural differences.
    It is for this reason that McConachy and Liddicoat (2022) argue for recognition
    that pragmatics learning “involves dealing with the adaptive demands of needing
    to carry out social acts through language in ways which may conflict with one’s
    existing identity or assumptions about social relationships, and thus it involves
    learning to manage potentially ethnocentric judgments towards new pragmatic behaviours
    and people” (p. 10).


    Recently, research at the intersections of pragmatics and moral psychology has
    contributed to understanding of the relationship between perceptions of linguistic
    behavior and moral evaluations (e.g., Culpeper 2014; Kádár & Haugh 2013; McConachy
    2018, 2019, 2021; Spencer-Oatey & Xing 2019; Spencer-Oatey & Kádár 2021). Moral
    psychologists Turner and Stets (2006) explain that “morality ultimately revolves
    around evaluative codes that specify what is right or wrong, good or bad, acceptable
    or unacceptable” (p. 544). Further, they suggest “that ‘any cultural code is moral
    to the extent that it carries evaluative elements that specify what is good-bad,
    right-wrong, and proper-improper” (p. 546, italics in original). Pragmatics researchers
    have similarly highlighted the fact that individuals tend to evaluate the communicative
    behavior and perceived characteristics of themselves and other people in terms
    of valenced categories such as polite/impolite, sincere/insincere, modest/immodest.
    Further, when asked to justify their evaluations as such, individuals will tend
    to appeal to notions with moral overtones such as “proper behavior,” “politeness,”
    “fairness,” “dignity,” “care,” “respect,” particularly when it is perceived that
    pragmatic norms'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'have been violated (e.g., Kádár 2020; Sharifian & Tayebi 2017; Spencer-Oatey
    & Kádár 2021).


    In their work on pragmatics and moral evaluations, Spencer-Oatey and Kádár (2021)
    have drawn attention to the fact that although evaluations of the appropriateness
    of language use can involve a conscious, rational component, they frequently take
    the form of snap judgments that stem from emotional reactions triggered by the
    experience of difference. They thus draw attention to the utility of dual process
    models of cognition to explain how evaluations occur. In the field of moral psychology,
    dual process accounts of cognition have developed to highlight the respective
    roles played by intuitive forms of cognition, which are closely linked with emotional
    and somatic experience, and more rational forms of cognition in moral judgments
    (e.g., Haidt 2012; Kahneman 2011). For example, Haidt’s social intuitionist model
    of cognition invokes the metaphor of an elephant and a rider to characterize the
    relationship between intuitive (elephant) and rational (rider) forms of cognition
    and the role they play in moral judgments. Haidt argues that moral judgments are
    most frequently informed by moral intuitions and the experience of emotion rather
    than rational thought processes.


    Whilst there is not necessarily universal agreement about the precise theoretical
    understanding of notions such as “emotion” or “feeling,” one key feature of emotions
    is that they represent an internal appraisal of a situation. That is, emotions
    are a kind of evaluative reaction, often accompanied by physiological responses,
    to an event or circumstances in the immediate environment and to the individual’s
    own thought processes (Myers 2004). In this sense, Haidt (2012) argues that emotions
    are not independent of cognition but central to it. He suggests that although
    the rider (rational mind) has the illusion of being in control, its actual role
    is to defend and justify the movements of the elephant (intuitions). This is in
    line with Kahneman’s (2011) view of cognition which emphasizes a distinction between
    intuitive, automatic forms of cognition (System 1) and more conscious, rational
    forms of cognition (System 2). In essence, the rational mind attempts to make
    sense of experiences and reactions filtered through the body and affect.


    Dual process models of cognition as described above provide theoretical support
    for the idea that evaluations of L2 pragmatic behaviors, particularly those that
    involve aversive reactions on behalf of the learner, are closely associated with
    intuitive judgments driven by the experience of emotion (Spencer-Oatey & Kádár
    2021). This is not to deny that judgments are also subject to rationalization
    but rather to point out that more recognition is needed of emotional drivers'
  merge: -1
  img_proc: true
