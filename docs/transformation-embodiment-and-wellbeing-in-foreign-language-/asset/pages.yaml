  md: '# Overview of the Study


    This chapter draws on data from a larger longitudinal qualitative dataset collected
    as part of my doctoral project which aimed to investigate learners’ motivational
    experiences in multilingual learning. This involved three rounds of in-depth semi-structured
    interviews (from September 2018 to July 2019) and monthly online communication
    (from September 2018 and still ongoing) with nineteen Chinese university students
    who were majoring in Japanese while continuing to study English. They were in
    their late teens or early twenties during the period of data collection. In the
    interviews, the participants were asked about their language choice, language
    perceptions, language engagement experience and life plans, and also asked to
    plot their motivational trajectories on a blank graph with the *x* axis being
    time and *y* axis being level of motivation from 0 to 10, to stimulate their retrospection
    and facilitate their narration of their personal experience (Henry 2015). A metaphor,
    or rather simile, elicitation task “Learning Japanese is like…, because…” was
    also used in the final round of interview as a supplementary means to approach
    the participants’ perspectives and beliefs (Cameron & Low 1999). In the online
    communication, the participants were asked monthly to rate their current language
    learning motivations from 0 to 10 and briefly explain why, which allowed them
    some space for real-time introspection. The interviews were audio-recorded, transcribed
    verbatim, and analyzed together with the communication data.


    A narrative analysis approach was adopted to look at the content of learners’
    subjective experience and look for salient themes in their stories (Barkhuizen
    2015; Duff 2017). I read the data several times carefully and noted the pattern;
    for participants whose Japanese learning motivation emerged out of their language
    engagement, they also experienced personal transformation(s) of some sort in the
    process. In the course of analysis, I identified themes in relation to types of
    language engagement experience, namely language engagement as academic experience,
    as aesthetic experience, and as ethical experience. Then I examined and triangulated
    the data concerning their language engagement experience specifically to co-construct
    a narrative of the emergence of motivation along with the personal transformations.
    For this chapter, I selected three participants Xiaotang, Xiaoming, and Cheng
    Yuanyi (pseudonyms) as the focal cases, because their personal stories work as
    powerful illustrations of the transformative potential of language learning. Below
    I include a vignette for each participant to'
