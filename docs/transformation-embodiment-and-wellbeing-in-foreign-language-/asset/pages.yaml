  md: '# Reader Response, Aesthetics, and Deep Learning in the German Language-Culture
    Classroom


    Chantelle Warner


    # Introduction


    Drawing from a range of theoretical and empirical perspectives, scholars in second
    language and culture teaching have, with increasing insistence, emphasized the
    importance of meaningful experiences for deep learning (e.g., Dubreil & Thorne
    2017). Within the context of these discussions, the predominance of “transactional”
    language use that has been a hallmark of proficiency-oriented and communicative
    language teaching for the past few decades (e.g., NCSSFL and ACTFL 2017; Council
    of Europe 2001) has been subject to ever-increasing criticism (e.g., Byrnes et
    al. 2010; see also Allen & Paesani 2010: 121–2; Warner & Dupuy 2018). “Transactional”
    is here typically understood in something like Brown and Yule’s (1983) sense of
    language in the service of information exchange, and it contrasts and complements
    the other primary function, the interactional, i.e., language use for the maintenance
    and negotiation of social relationships. The intrinsically social nature of language
    has been emphasized within frameworks of language education that propose alternatives
    to the primacy of transactional, typically oral language use as the goal and measure
    of learning. These include most notably those informed by sociocultural theory,
    with its roots in the theories of Lev Vygotsky (e.g., Lantolf & Thorne 2006; Levine
    2020), and social semiotics as inspired by the linguistic models of M.A.K. Halliday
    (e.g., Byrnes 2007). Both theories foreground socialization and semioticization
    in language use and learning. As one of the primary semiotic (read: meaning making)
    systems through which humans make sense of the world and their roles and relationships
    with others within it, these approaches'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'argue, language mediates our experiences, ideas, and relationships in profound
    ways. Coincidentally, something like this complexity is captured by the notion
    of “transaction” as conceptualized by a scholar working in literary studies rather
    than linguistics; for Louise Rosenblatt “transactional reading” involves a unique,
    potentially aesthetic experience in which the reader and text continuously act
    and are acted upon by each other.


    This chapter takes this tension between “transactional” language use and “transactional
    reading” as a point of departure for theorizing the importance of aesthetic dimensions
    of language and literacy learning that are often neglected (it is argued) in predominant
    models based in communicative, sociocultural, and social semiotic frameworks.
    Such attention to aesthetics has already been implied within contemporary design
    approaches to second language literacy, which emphasize the “creative human processes”
    (Kern 2015: 2; see also Allen 2018) involved in making meaning from the material,
    social, and individual semiotic resources available. Drawing from Rosenblatt’s
    theories of reader response and working with a case study from an intermediate
    German language-culture class at a US university, I propose that centering transactional
    reading and aesthetic response as part of an approach to second language literacy
    can enable language educators to realize the pedagogical desideratum of going
    beyond “transactional” (read: propositional) meanings by connecting other functions
    of language deliberately with affect and ethics. This is envisioned as part of
    an approach to second language-culture education that sees learners as not only
    potential social actors who can “do things with words,” but as reflective languagers
    (Phipps & Gonzales 2004) who are attentive to how different ways of making meaning
    afford them alternative ways of being in the world. And reading and writing of
    literary texts is a vital part of kind of transformational learning.


    In the sections that follow, I begin by outlining the aspects of Rosenblatt’s
    reader response model that are most important for this discussion of transactional
    reading in the language-culture classroom and draw connections between these theories
    and relevant discussions within the fields of applied linguistics and language
    education. I then use the case of a student, Klara, and her responses to a cluster
    of texts she read as part of a unit in an intermediate German language-culture
    course in order to illustrate how aesthetic reading can impact learner wellbeing
    in unexpected and transformational ways. A central focus of this discussion will
    be a creative writing composition written by Klara, through which she explored
    how her story and experiences intersected with the narratives she had read in
    class. Finally, I will conclude with some suggestions for how transactional literacy
    can be a part of educators’ pedagogical practices in language and culture teaching.'
