  md: '# Notes


    1 This conceptual tension is put clearly into practice in the most recent addenda
    to the Common European Framework, published in a companion volume in 2018. The
    new descriptors include a scale for “reading as a leisure activity” (2018: 65),
    a scale for “expressing a personal response to creative texts (including literature)”
    (2018: 206–7), and one for “analysis and criticism of creative text (including
    literature)” (2018: 208). The latter two scales are focused on the communicative
    expression of reader responses and do provide possible guidelines for how to connect
    transactional literacy to other kinds of proficiency-oriented competencies; however,
    there is an implicit assumption that these activities are distinct from “pleasure,”
    which is the primary form of aesthetic response acknowledged in the first scale.
    As is often the case in scholarship on affect in second language teaching and
