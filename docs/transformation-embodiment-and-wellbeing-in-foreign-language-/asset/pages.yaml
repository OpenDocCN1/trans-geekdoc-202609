  img_proc: true
- pgno: 171
  md: 'of other personalities—those of the characters in the text and those of other
    readers—and to potentially develop a deeper awareness of our own.


    Rosenblatt’s discussion of the democratic potential of aesthetic reading anticipates
    some aspects of the critical pedagogical frameworks and social justice orientations
    found within contemporary educational discourse, but also reflects the concerns
    and biases of the historical moment within which she wrote. Noting its subversive
    potential, Suzanne Keen leans heavily on Rosenblatt’s transactional theory to
    develop her model of narrative empathy, arguing that “intersectional axes of identity”
    play an important role in reader response (2013: 53)—although she also notes that
    Rosenblatt’s commitment to individual reading does not prevent her from often
    postulating readers who are seemingly without race or class, and we might also
    add that their genders are diverse only within a binary (Keen 2013: 59). This
    is at least in part a symptom of her time; Rosenblatt’s provocation that readers
    need not be “ideal” or “educated” and they certainly do not need to be male literary
    critics was a provocation in itself.


    Despite these blind spots, Rosenblatt remained devoted to an idea of cultural
    plurality, which she believed could be fostered through aesthetically oriented
    education. Literature was for her a way for “aiding us to understand ourselves
    and others, for widening our horizons to include temperaments and cultures different
    from our own, for helping us to clarify our conflicts in values, for illuminating
    our world” (1982: 276). Thus, although Rosenblatt, as an English literature scholar
    in an English dominant country, does not directly address the particularities
    of second language and culture learning, aspects of her model of transactional
    reading are readily adaptable for the transcultural space of the second language-culture
    classroom and even resonate with theories of interculturality, such as those of
    Claire Kramsch. In her early work, Kramsch proposed the notion of third place,
    a place that preserves diversity—“of styles, purposes, and interests” (1993: 247)—as
    an alternative to models on intercultural competence, where differences are often
    treated as something to be overcome. The reflexivity enabled through the insider/outsider
    status of the language learner, Kramsch argued, allows for a mode of participation
    that is different from the sort of foreign visitor status often evoked within
    language pedagogy that prioritizes appropriateness. In Kramsch’s more recent work,
    the notion of third place is extended into the concept of symbolic competence,
    which is discourse-based, historically grounded, aesthetically sensitive, and
    that takes into account the actual, the imagined, and the virtual worlds in which
    we live (Kramsch 2011: 354). Symbolic competence much more clearly directs the
    reflective potential of the third place toward capacities related to'
