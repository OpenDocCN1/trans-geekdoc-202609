  md: 'herself (I, me). As the reading continues, ask who else is being referred to,
    and ask volunteers to stand in for the other characters who will be pointed at
    when mentioned. Help clarify the two sides: England (Blanche’s uncle, King John,
    and grandmother (grandam)) versus France (Blanche’s husband and father(in-law)).
    Divide the group into two, and have one learner read out Blanche’s part, moving
    quickly between England and France as appropriate. This will visually illustrate
    Blanche’s dilemma, and dramatize the delivery, as the breathing of the learner
    playing Blanche alters with their movement. In groups comfortable with physical
    contact, each army can literally “ha[ve] a hand,” forcing the learner-as-Blanche
    to struggle free as they try to address the different characters (while another
    student holds up their script for them). If time allows, this can become a short
    performance, with learners deciding how lines are allocated (individually, chorally?)
    and delivered (spoken, chanted, sung?), and what movement and physical arrangements
    are used. (Note the aim is not to perform the speech as it would typically be
    done on stage.)


    # Example 2: “Thou art not holy to belie me so”


    # CONSTANCE


    > Thou art not holy to belie me so:

    > I am not mad: this hair I tear is mine:

    > My name is Constance: I was Geoffrey’s wife:

    > Young Arthur is my son, and he is lost:

    > I am not mad: I would to heaven I were!

    > For then, tis like I should forget myself:

    > O, if I could, what grief should I forget!

    > Preach some philosophy to make me mad,

    > And thou shalt be canonized, cardinal;

    > For, being not mad, but sensible of grief,

    > My reasonable part produces reason

    > How I may be delivered of these woes,

    > And teaches me to kill or hang myself:

    > If I were mad, I should forget my son,

    > Or madly think a babe of clouts were he:

    > I am not mad: too well, too well I feel

    > The different plague of each calamity.


    (KJ 3.3.45–61)'
