  md: 'English: the idea of something being “foreign, alien, from abroad” (Crystal
    & Crystal 2002: 425). While today “strange” does not have quite the same connotations,
    Shakespeare’s language itself has come to be associated with a certain foreignness.
    Despite the relative closeness of the English of Shakespeare’s time and that of
    today, even those who speak English as a first language often perceive Shakespeare
    as archaic and alien—technically the same language, but experientially foreign
    (Blank 2014). This perception, coupled with Shakespeare’s high cultural status,
    can make his language a source of anxiety and bafflement for students in Anglophone
    countries—especially those whose cultural and linguistic backgrounds mean they
    already have a complex relationship with English (Esponosa 2016). For learners
    of English as a Foreign Language (EFL) the challenge can seem even greater, and
    the rewards even less clear. With dominant modes of foreign language education
    emphasizing instrumental goals related to communicative efficiency and employability
    (Ros-i-Solé 2016), studying centuries-old dramatic literature might seem impractical
    and counterproductive. If Shakespeare’s English is strange for those who supposedly
    live in that language, why inflict it on students for whom English is already
    foreign?


    But is it necessarily a bad thing for languages—or anything else—to be strange?
    In Shakespeare’s time, in addition to conveying foreignness or distance, the word
    “strange” had a host of other meanings that, by the Jacobean period, were used
    for a range of creative and cultural purposes (Davies 2021). Indeed, David and
    Ben Crystal’s *Shakespeare’s Words* lists no fewer than nine different senses
    of “strange,” including some with positive connotations: “rare, singular, exceptional”
    and “special, particular, very great” (2002: 424–5). This chapter contends that,
    in the context of foreign language education, it is also not a bad thing for languages
    to be, or be made, strange. Whether in the contemporary sense of being unfamiliar,
    or the early modern senses of being both foreign and special, this chapter argues
    that if Shakespeare’s language is “strange,” then this can actually help to encourage
    deeper learning in the English language classroom. It does so by outlining a pedagogy
    that draws on what are variously called active, creative, or rehearsal room approaches
    to Shakespeare (Banks 2014; Gibson 1998; RSC 2013; Stredder 2009), and combining
    these with an intercultural perspective on language teaching and learning (Liddicoat
    & Scarino 2013; McConachy 2018).


    After introducing Shakespeare’s language in context and the theoretical underpinnings
    of the chapter’s pedagogical inspirations, practical examples are given from my
    own classes with learners of English at universities in China and the UK. These
    examples demonstrate the fundamentally social and embodied'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'nature of this approach, as students experience the excitement of Shakespeare’s
    dramatic language by collaboratively playing with, interpreting, and enacting
    speeches from another of Shakespeare’s histories, King John. Such engagement is
    also inherently intercultural, as processes of (de)familiarization and mediation
    encourage learners to reflect more deeply on their linguistic and cultural assumptions
    and identities. Consequently, it can be used to foster a form of deep learning
    that goes beyond the instrumental acquisition of linguistic and cultural “facts”
    that are to be deployed in narrowly defined communicative contexts, and that is
    instead concerned with a more holistic, transformative engagement with meaning-making
    in all its complexity. Rather than being remote or abstract, Shakespeare’s “strange”
    language thus becomes a vehicle through which English learners can acknowledge
    their emotions and inner lives, and reflect on their understandings of themselves
    and others.


    # Shakespeare’s Language in Context


    The idea that Shakespeare’s language not only merits special attention but also
    requires specialist knowledge to be fully understood has a long history. From
    Abbott’s 1869 A Shakespearian Grammar to more recent examples (e.g., Blake 2002;
    Crystal 2008; Crystal 2016; Crystal & Crystal 2002; Johnson 2014; Kermode 2000;
    Magnusson with Schalkwyk 2019), numerous books have offered everything from general
    explorations of Shakespeare’s language, to guides specifically covering grammar,
    pronunciation, and vocabulary. However, Culpeper & Archer (2020: 191) have argued
    that much of this writing exhibits something of a “split personality,” addressing
    linguistic and literary perspectives, but in practice often privileging one over
    the other. In historical terms, the basic biographical outlines of Shakespeare’s
    life—he was born in 1564 and died in 1616—position him as a user of what is now
    called Early Modern English (EME). However, when people today refer to Shakespeare’s
    language they are typically referring to the language found in his plays and poems.
    If, as Culpeper and Archer argue, adequately addressing the linguistic and the
    literary is a challenge for scholars, it also seems a formidable barrier to using
    Shakespeare in EFL contexts. At its most instrumental, mainstream EFL privileges
    practical English, of the sort that is supposedly encountered—and is therefore
    useful—in everyday situations. Defining the “useful” and the “everyday” can actually
    be very contentious, given the drastically different socioeconomic and cultural
    situations of the world’s EFL learners. However, it is true that few learners
    will'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'actively *need* to be able to write speeches or poems in EME in their educational
    and working lives. Fewer still will need to know what to say when confronted by
    witches (*Macbeth*) or fairies (*A Midsummer Night’s Dream*), let alone when announcing
    that they have baked their enemy’s sons into a pie (*Titus Andronicus*). This
    fact is reflected in a question raised whenever I begin Shakespeare sessions with
    my MA TESOL students: “What’s the point of teaching learners such out-of-date,
    impractical language?”


    However understandable such reservations are, they make assumptions about both
    Shakespeare’s language and EFL teaching that merit further examination. Certainly,
    the idea that Shakespeare’s language is outdated—and therefore more difficult
    and less practical than today’s English—needs to be explored. In strictly historical
    terms, and certainly when compared to Old and Middle English, EME is technically
    not *that* different from the English of today. In light of this, Crystal and
    Crystal (2002) argue that there are many passages in Shakespeare in which the
    vocabulary is almost identical to that of today’s English, and even more where
    unfamiliar terms are easily understandable in context. Just such a stretch can
    be found in one of the excerpts from *King John* that is used later in this chapter
    (see Example 2):


    > > I am not mad: this hair I tear is mine:

    > > My name is Constance: I was Geoffrey’s wife:

    > > Young Arthur is my son, and he is lost: (*KJ* 3.3.46–8)


    There is nothing difficult here in terms of syntax or vocabulary, and nothing
    “strange” in the sense of being foreign or unfamiliar. The final “lost” may not
    operate as literally as the words in the rest of the extract, but the fact that
    Constance is talking about her son possibly being dead—rather than just having
    lost his way—becomes clear in the context of the scene. In any case, this sense
    of “lost” is still current in English, and would be a perfectly reasonable thing
    to teach EFL learners of an appropriate level. An example like this demonstrates
    Crystal and Crystal’s contention that there is plenty in Shakespeare that is no
    more difficult than, nor much different to, English as it is used today.


    However, while there might be good pedagogical arguments for presenting, and perhaps
    even surprising, learners with stretches of Shakespeare that seem easier and more
    familiar than they might be anticipating, it is necessary to acknowledge that
    their experiences will not always be so seamless. Indeed, while it was easy to
    cherry-pick the above example from the extracts chosen for this chapter, there
    is much within them—and within Shakespeare as a whole—that'
