- pgno: 145
  md: 'seems more obviously difficult, and more strange. Certainly, many of the things
    that Murphy et al. (2020) found that students, including EFL learners, identify
    as difficult in Shakespeare—including archaisms, contractions, and complicated
    lexis—occur in this chapter’s extracts. The line before the short stretch above,
    for example, reads “Thou art not holy to belie me so” (KJ 3.3.45), using EME forms
    of both you (thou) and are (art). The speech then continues with EME contractions
    (“’tis” for it is), modals (“shalt” for shall) and items of vocabulary that are
    highly culturally specific (“thou shalt be canonized, cardinal”), or archaic (“clouts”
    for cloths or rags). If anything, the other extracts I have chosen contain even
    more obvious examples of the difficult and the strange, including complicated
    and archaic vocabulary, deliberately unsettling imagery, and words that lexically
    or orthographically do not look like English at all (“adieu” and “[A]ssurèd” in
    Example 1). As their ideas stretch across multiple lines, the syntax also becomes
    more complex and even convoluted.


    Therefore, although Crystal and Crystal (2002: xii) contend that there are “very
    few passages in Shakespeare where the combination of alien grammar and vocabulary
    makes the text comparable to it being in a foreign language,” this may be true
    in only a technical, rather than an experiential, sense (Blank 2014, 2018). This
    undoubtedly adds another dimension to the reception of Shakespeare by EFL learners,
    such as the participant in one of my workshops at a Chinese university who commented
    that “Shakespeare’s language is a foreign language in foreign language.”


    Faced with such a situation, the most obvious response might be simply to avoid
    using Shakespeare with EFL learners. And yet the student quoted above made their
    comment in the course of discussing how much they enjoyed tackling Shakespeare
    in English—which included enjoying the challenge this posed, and the satisfaction
    they felt at being able to rise to this challenge. Similarly, Murphy et al. (2020)
    do not conclude that students’ experiences of difficulty mean that Shakespeare
    has no place in EFL teaching. Instead, they recommend a “mixed pedagogical approach”
    to teaching Shakespeare, which incorporates corpus-based elements alongside more
    common “textual, contextual and performance aspects” (2020: 22). Crucially, they
    stress that the use of corpus-based activities in the classroom is predicated
    on the “active involvement of learners, treating language in a contextualized
    fashion and focussing on the language itself” (2020: 2). It is this “active involvement
    of learners” that this chapter will focus on, as a way of making a virtue out
    of having EFL learners engage with language that can seem difficult, and strange.
    However, the emphasis here will not be on corpus methods, but on what Murphy et
    al. refer to as “performance” aspects'
