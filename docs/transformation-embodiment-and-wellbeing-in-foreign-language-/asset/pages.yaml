  md: 'associated with the success and failures experienced in learning journeys.
    This spatial orientation and directionality of movement is extended emotionally
    and spiritually: “heaven” is a learning destination ahead, a higher positive place
    or condition; “hell” is negative, down below, an experience of learning to be
    endured or avoided. Some metaphors have sacred implications. They reflect how
    learning is “a ladder, a way leading to heaven but also to hell,” “it’s a road
    with thorns, the road to paradise, it’s too painful for us to walk forward but
    at the end of the road there’s a paradise filled with flowers,” “it’s a pilgrimage:
    the road is too long and painstaking, but you may arrive at a holy place in the
    end.”


    The body-image of intense physical movement is represented in 176 “climbing” metaphors:
    “language learning is climbing a mountain.” Students elaborate this in their entailments:
    “you have to strive to move forward,” “as you step forward, it means you are improving,”
    “with each small step you reach a new height,” “we climb higher and higher towards
    the peak of knowledge.” Embodiment is evident in the movement, directionality,
    and the felt image of physical climbing. This is easily overlooked in metaphors
    in daily life: the images are cognitively held in language to express abstractions
    (Littlemore 2019). This commonly expressed cognition complements the literal embodiment
    in language classrooms which has been researched by examining in detail participant’s
    gaze, gesture, facial expression, and physical movement in interaction (Hall &
    Looney 2019). The “mountain climbing” metaphors stress the need for persistent
    physical effort, “we can only reach the summit with great effort”; “sometimes
    you go forward, sometimes backwards, but we just need to climb unremittingly.”
    However, this is a compelling worthwhile activity: “if you give up in the middle
    you will get nothing,” “it is difficult but you must do it,” “when you get to
    the top with so much sweat, you know it is really worth it.” Both the process
    and result are associated with salient emotions, “climbing with both hardship
    and happiness”; “the process of climbing is bitter but the happiness you get after
    you arrive at the top cannot be substituted.” The language learner who keeps “climbing”
    progressively obtains a panoramic vision, “the higher you are, the more beautiful
    the scenery you’ll see.”


    While “journey” and “travel” metaphors for learning seem common among language
    learners elsewhere, a particular metaphor has strong resonances for Chinese students:
    for fifty-three participants, “Learning is sailing against the current.” Again,
    this expresses physical movement with a forward upstream direction but, crucially,
    it depicts the learners’ hard, unceasing effort “rowing” against opposing forces
    which threaten to overwhelm those who do not work hard for immediate improvement.
