- pgno: 201
  md: "The practice of mindfulness aims to center attention on present-moment experience\
    \ and to help regulate perception by observing thoughts, feelings, and bodily\
    \ sensations. As Feldman and Kuyken (2019) explain, “[b]odily sensations, feelings,\
    \ mental states, and present-moment experience are perceived and held in awareness\
    \ where they can be explored with attitudes of curiosity, patience, and kindness”\
    \ (pp. 12–3). This is designed to counteract the tendency of the analytical mind\
    \ to divert attention away from the present moment and the immediacy of embodied\
    \ experience. The aim is not to judge the analytical mind for doing so, but rather\
    \ to observe its tendencies and to gradually bring it back to the present moment\
    \ of experience within an overall spirit of kindness toward oneself and others.\n\
    \nFeldman and Kuyken (2019) present a four-component model of experience that\
    \ is useful for promoting mindfulness practice. They suggest it is useful for\
    \ individuals to draw attention to the following: bodily sensations, emotions,\
    \ thoughts, and conscious appraisals, behavioral impulses, and behaviors. The\
    \ purpose in doing so is not to recognize these elements as separate but to gradually\
    \ realize their interconnectedness. They explain:\n\n> We can see how our thoughts\
    \ shape our emotions and bodily sensations; we can see how our bodily states,\
    \ particularly fatigue, shape our thinking and emotions; we can see how behavioural\
    \ impulses are associated with emotion and body states; we can see how emotion\
    \ shapes our thoughts and behavior.\n> \n> (p. 47)\n\nIn connection to pragmatics,\
    \ McConachy (2018) has also argued for the importance of learners becoming mindful\
    \ of their own emotional reactions when experiencing a sense of resistance or\
    \ dissonance.\n\n... one of the important ways in which reflection works is by\
    \ helping learners focus on the nature of their own emotional reactions, to identify\
    \ the reaction, and to attempt to identify where the reaction is coming from.\
    \ The initial object of noticing is an emotional charge—such as experience of\
    \ “discomfort” or “strangeness”—and the act of reflection helps the learner more\
    \ consciously recognize—i.e. notice—the emotion, label it, and thereby bring it\
    \ under more conscious attentional control so that external triggers can be explored.\n\
    \n(p. 157)\n\nIn this formulation, thus, the goal is to first of all become aware\
    \ of one’s own internal emotional experience—even if it is barely perceptible\
    \ initially—then work to more clearly perceive the emotional experience and explore\
    \ its origins."
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Although it is not indicated in the quote above, this should be understood
    as a non-judgmental “observing” of one’s own internal experience that seeks to
    accept the experience as it is, with any bodily sensations (Feldman & Kuyken 2019).
    This focus and awareness on the reality of inner experience provides a foundation
    of self-awareness that can then be extended to a consideration of the inner experiences
    of others. Here, mindfulness shifts from an intrapersonal to an interpersonal
    focus. This is broadly similar to Ting-Toomey’s (2015) understanding of mindfulness
    as applied to intercultural interaction, which places emphasis not only on attending
    to internal experience but also to the necessity of openness, flexibility, and
    empathy toward the emotional states and perceptions of others. Similarly, McConachy
    and Spencer-Oatey (2020) suggest that “mindfulness entails noticing, attending,
    being aware, seeking out, creating, and using empathy in relation to (a) the situational
    context and (b) the assumptions, ideas, mental categories and emotions of self
    and others” (p. 411).


    It is within such a conception that there are clear parallels between mindfulness
    and metapragmatic awareness, and it is indeed unlikely to be fruitful to suggest
    a clear division. As a general understanding it might be said that whereas metapragmatic
    awareness is frequently associated with analytical understanding of pragmatic
    norms and sociocultural assumptions, mindfulness is anchored most fundamentally
    in immediate, pre-analytical internal reactions of the individual. It is a non-judgmental
    observing of the “what” in order to understand its nature before turning toward
    the “why.” Mindfulness may be considered a more grounded observing and noticing
    of internal experience that acts as a helpful complement to the more analytical
    and abstract thinking characteristic of metapragmatic awareness, though there
    are points of overlap.


    In the next section, I outline a number of pedagogical suggestions that teachers
    could use to engage their learners in mindful exploration of their own pragmatic
    judgments.


    # Pedagogical Strategies for Exploring Embodied Reactions and Evaluative Judgments


    Whilst language learners are liable to encounter a wide range of emotions in learning
    and using the pragmatics of a foreign language, the focus of the pedagogical suggestions
    here is on exploring moral emotions through mindfulness (see Chapter 9 for applications
    of mindfulness in teacher'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'education). It is important to note that in the suggestions below, mindfulness
    is first exercised in relation to the learner’s own internal experience and is
    oriented toward non-judgmental observation. This is used as a foundation of self-awareness
    that allows for a gradual broadening out of attention toward communicative scenarios
    and the potential viewpoints of other speakers.


    # Exercising Mindfulness in Pragmatic Judgment Tasks


    One useful way of helping learners explore their evaluative reactions toward aspects
    of L2 pragmatics is by setting simple pragmatic judgment tasks. Pragmatic judgment
    tasks have long been in the toolkit of language teachers and L2 pragmatics researchers
    who aim to help learners think about the in/appropriateness of linguistic choices
    in particular contexts. In contrast to discourse completion tasks, which usually
    require some form of production on behalf of the learner, pragmatic judgment tasks
    usually just require that learners consider the scenario that is presented to
    them. Below, I present a number of scenarios that would potentially tap into learners’
    other-condemning emotions (i.e., anger, disgust, condemnation) or self-conscious
    emotions (i.e., shame, guilt), though this of course depends on the backgrounds
    of the learners and their individual personalities to some extent. Whereas Scenarios
    A and B are constructed in the third person and might allow for a degree of detachment,
    Scenarios C and D are written in a way to foreground the imagined involvement
    of the individual reading/listening to the scenario.


    # *Scenario A*


    Upon being complimented by a teacher for achieving the highest score in a class
    test, Student X responds to the news by saying, “Excellent! I guess I worked harder
    than everyone else.”


    # *Scenario B*


    A student experiences influenza in the week leading up to an assignment deadline
    and sends a polite email to the teacher asking for an extension. The teacher rejects
    the request by saying, “You should always anticipate that these things might happen.
    It’s your responsibility to submit your work on time.”'
  merge: -1
  img_proc: true
- pgno: 204
  md: "# *Scenario C*\n\nYou are sitting on a crowded train and decide to offer your\
    \ seat to an elderly passenger who has just boarded. You say, “Hi, please have\
    \ a seat. I don’t need to sit.” The elderly passenger says, “Actually, I don’t\
    \ need to sit either. Do I look that old?!”\n\n# *Scenario D*\n\nYou arrive late\
    \ for an important work meeting. After the meeting, you approach your boss to\
    \ explain. You briefly apologize and then try to explain in as much detail as\
    \ possible why you were late and that you really didn’t mean to be late. Your\
    \ boss says, “You spend too much time explaining. I don’t like excuses.”\n\nIn\
    \ working with such scenarios (or similar ones constructed by the class teacher),\
    \ one challenge is not jumping immediately into an analysis of the scenario itself.\
    \ Rather, the initial aim here is for learners to mindfully observe their own\
    \ embodied reactions to being presented to the scenarios. Students could be told\
    \ that they will be presented with a scenario and that they are encouraged to\
    \ direct attention to their immediate internal reactions to the scenario, particularly\
    \ emotions and bodily sensations. They can be encouraged to simply observe their\
    \ own reactions. After a while, students could be asked to individually consider\
    \ questions as follows, even if they don’t voice an answer or are encouraged to\
    \ write something down privately. This helps bring reflective attention to aspects\
    \ of their experience.\n\n+   Q) What did you feel when you heard this scenario?\n\
    +   \n+   Q) Did you feel this sensation in any particular part of your body?\n\
    +   \n+   Q) What thoughts accompanied this feeling?\n\nOnce learners have spent\
    \ some time tuning into their individual reactions, the teacher may wish to then\
    \ help learners turn their attention more toward the scenario itself and the relationship\
    \ with their own internal reactions. These are sample questions which might be\
    \ conducive to this aim, and which could be provided for individual consideration\
    \ or discussion with other students.\n\n+   Q) What do you think about (character)’s\
    \ reaction in this scenario?\n+   \n+   Q) Do you think it is reasonable? Why?\
    \ Why not?\n+   \n+   Q) What thoughts and feelings do you think the people had\
    \ in this situation? Why?\n+   \n+   Q) What adjectives would you use to describe\
    \ the people in this situation? Why?\n+   \n+   Q) How would you react in this\
    \ situation? Why?"
  merge: -1
  img_proc: true
- pgno: 205
  md: "In the questions above, attention shifts to incorporate more of a focus on\
    \ others’ reactions, and learners are also encouraged to take a personal stance\
    \ on what has happened in the scenario. They are encouraged to explicitly evaluate\
    \ actions or attitudes and to consider what they themselves would do in this situation.\
    \ Thus, there is a transition from mindful observation of one’s own reactions\
    \ to more analytical and evaluative engagement. A final sequence of questioning\
    \ might then encourage learners to explore the interface between their own immediate\
    \ reactions and their evaluation of the scenarios.\n\n+   Q) When you heard/read\
    \ the scenario, how long did it take you to have an emotional reaction to it?\n\
    +   \n+   Q) Did this reaction change as you paid attention to it? What happened?\n\
    +   \n+   Q) How did analyzing the scenario affect the way you felt?\n\nAlthough\
    \ such questioning might initially be difficult for learners to answer, they can\
    \ help draw attention to the embodied nature of pragmatic judgments and the fact\
    \ that we are very quick to generate evaluative reactions to communicative scenarios.\n\
    \nIn presenting these suggestions for engaging students in mindful observation\
    \ and reflection, it is not assumed that learners’ consideration of these scenarios\
    \ would necessarily end here. As argued in much of the previous work on (meta)\
    \ pragmatic awareness, there is an important role for questioning which helps\
    \ learners think more explicitly about pragmatic strategies across languages and\
    \ cultures (e.g., requesting, thanking, complimenting) and for digging deeper\
    \ into their own contextual expectations, assumptions about social relationships,\
    \ and values (see McConachy & Spencer-Oatey 2020). The initial work to tune in\
    \ to one’s own embodied reactions is an essential complement to this more analytically\
    \ oriented work and abstract thinking.\n\n# Pragmatic Resistance Exploration Task\n\
    \nWhereas pragmatic judgment tasks allow for evaluation of scenarios and learners’\
    \ exploration of their own reactions from a relatively “distanced” perspective,\
    \ what I suggest below would aim to help learners identify and explore aspects\
    \ of L2 pragmatics they are uncomfortable adopting. Students’ exploration of their\
    \ own pragmatic resistance is something that could be encouraged right from early\
    \ stages of learning but is particularly relevant when learners begin"
  merge: -1
  img_proc: true
- pgno: 206
  md: 'engaging in productive use of language—i.e., using the language to represent
    their own subjectivity and accomplish relational tasks. What I mean here is that
    it is important to explore any feelings of discomfort or identity dissonance that
    arise when engaging in new communicative practices or exploring relatively unfamiliar
    pragmatic features. This is especially important for those learners who spend
    time immersed in an L2 environment, such as study abroad. During periods of study
    abroad, it is highly likely that learners will experience pragmatic differences
    as more intense in terms of their own embodied experience of foreignness and more
    consequential from an identity point of view (e.g., Devlin 2018; McConachy & Fujino
    2022).


    Here, again, the initial aim is for learners to engage in mindful exploration
    of their own reactions as a starting point. I present a sequence of processes
    by which learners can begin to explore their own embodied experience of particular
    L2 pragmatic features. The process starts from identification of the particular
    pragmatic feature that a learner feels uncomfortable about (e.g., compliment responses,
    refusal strategies, pronouns). This part of the process is particularly important,
    and some time can be spent silently bringing aspects of emotional experience to
    attention and mapping them onto a particular linguistic feature or interactional
    behavior. As it might be difficult for learners to explain in detail, the next
    description stage involves them in labelling their own emotion and the context
    in which they experience it. The use of adjectives (e.g., angry, disappointed)
    helps to signal emotional valence. This is then followed by description of the
    intensity of emotional arousal. Finally, there is exploration of two main interfaces:
    feeling/thought and feeling/body. Examples are given below in italics.


    +   - Identifying the pragmatic trigger (object of pragmatic resistance)

    +     *I don’t feel positive about the pronoun “watashi” in Japanese.*

    +   - Describing the emotion and context

    +     *I feel angry/disappointed when I see people using honorifics to others
    who are only slightly older.*

    +   - Describing the intensity of the feeling

    +     *It makes me really uncomfortable.*

    +   - Exploring the feeling/thought interface

    +     *When I have these feelings, I tend to think that I don’t want to learn
    Japanese.*

    +   - Exploring the feeling/body interface

    +     *I feel a sense of disappointment in my chest/throat/whole body.*'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'It is important when following the sequence of processes above that the focus
    remains as much as possible on the learners’ internal experience and the aim of
    developing insight into their own patterns of reactivity. In other words, this
    is a non-judgmental process aimed at developing self-awareness. Once some time
    has been spent developing this foundation, teachers might wish to move onto analytical
    and reflective questions or tasks that help learners interpret their thoughts
    and feelings and why they might react this way. As suggested above, learners can
    also be encouraged to extend the attitude of non-judgment to other L2 speakers
    and to consider the logic behind different pragmatic behaviors.


    # Conclusion


    In this chapter, I have argued for the need to more explicitly theorize the emotional
    dimensions of pragmatic resistance and pragmatic judgments more broadly. In line
    with recent research at the intersections of pragmatics and moral psychology,
    I have argued that the learning of pragmatics can present a challenge to the learners’
    felt sense of right behavior—whether that means “right” in terms of personal fit
    or “right” in terms of deeper social and moral judgments. Whereas much of the
    existing work on pragmatic resistance tends to place emphasis on rational decision-making
    and learners’ agency to determine their own courses of communicative action and
    ways of constructing a symbolic self, it is crucial to acknowledge that the pragmatic
    decision making that helps constitute agency is mediated by learners’ embodied
    reactions to difference. That is, it is not a rational process of “selection”
    but is rather a psychologically consequential process that is tied up with how
    learners perceive and react to challenges to their felt sense of “appropriate”
    language use. From a theoretical viewpoint, it is important for more interdisciplinary
    investigation into the emotional and somatic aspects of learning pragmatics and
    how learners’ evaluations of pragmatics shape their learning trajectory and potential.
    From a practical viewpoint, acknowledging that the learning of pragmatics engages
    learners at deep levels of self and can trigger aversive reactions necessitates
    a turn toward a humanistic pedagogy of wellbeing. As teachers, our aim is not
    simply to help our learners become more effective communicators, it is also to
    help them become more mindful of their evaluations of self and others and more
    adept at regulating their own reactions.'
  merge: -1
  img_proc: true
