    # Klara’s Story: A Case of Creative Fiction as Reader Response from the German
    Classroom


    At the time of this case study, Klara was an undergraduate student in a fifth-semester
    German as a second language classroom taught at a large public university in the
    US American Southwest. The course was typically described as intermediate/advanced,
    because it included both students who had come directly from the basic language
    sequence, i.e., the first two years of instruction or who had tested in from high
    school and students who had spent the summer before in an intensive study abroad
    program, as Klara had done. Although there was a range of proficiency levels and
    experiences represented in the class, the students were overwhelmingly majoring
    or minoring in German at this point. Klara at'
