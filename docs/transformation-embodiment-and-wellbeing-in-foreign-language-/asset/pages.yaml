- pgno: 213
  md: '# Positive Psychology Activities for Promoting Emotion Regulation and Wellbeing
    in Language Teacher Education


    María Matilde Olivero, María Celina Barbeito, and Adelina Sánchez Centeno


    # Introduction


    Research has documented that being a (pre-service) language teacher is a highly
    emotional experience (e.g., Dewaele et al. 2019; Hiver 2016; Gkonou & Mercer 2017;
    Kostoulas & Lämmerer 2020; MacIntyre et al. 2020). For example, it has been shown
    that negative emotions are often experienced due to heavy workload, poor interpersonal
    relationships among members in an institution, insecurities related to language
    and teaching techniques, and differences between what (pre-service) teachers envision
    and reality, among other things. Such conditions tend to trigger unpleasant emotions
    that, if not properly regulated, might lead to unfavorable outcomes, such as high
    levels of stress and job dissatisfaction. However, (pre-service) teachers can
    also experience positive emotions as a result of joyful experiences related to
    their work, often accompanied by the use of conscious strategies to enhance positivity
    (Gkonou et al. 2020).


    In recognition of the emotional nature of language teaching, the field of language
    teacher education has started to pay closer attention to the role of emotions.
    Although language teacher education has traditionally been largely cognitive in
    nature, there is increasing interest in holistic approaches that aim to develop
    the cognitive, emotional, and social aspects of the person in an integrated way
    (e.g., Barbeito & Sánchez Centeno 2021; Burns 2017; Helgesen 2017; Olivero et
    al. 2021; Olivero 2017; Olivero & Oxford 2019; Oxford 2017). In other words, holistic
    approaches aim to strategically engage multiple dimensions of the self and promote
    holistic learning that enhances the wellbeing of student'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'teachers. Holistic approaches that integrate positive psychology-based pedagogy,
    for example, can help future teachers increase positivity and regulate unpleasant
    emotions, resulting in greater optimism as well as the development of resilience
    and empathy, among other attributes (e.g., Mercer 2016; Olivero 2017). Positive
    psychology-based practices are also intended to enhance participants’ wellbeing
    (Gregersen & MacIntyre 2021), which can lead to helping future teachers flourish
    and have a more meaningful journey in their teacher education programs.


    In this chapter we highlight the value of incorporating positive psychology activities
    based on holistic learning approaches into language teacher education programs
    as a way of enhancing emotion regulation and wellbeing. The chapter first presents
    the theoretical background on wellbeing and emotion regulation in language education
    as well as on holistic learning, which serves to frame the activities that are
    described next and to elucidate their underlying principles. The chapter offers
    a sample of positive psychology-based activities that have been used in language
    teacher education courses with the purpose of helping future teachers regulate
    their emotions and enhance their wellbeing while learning to teach a foreign language.
    In closing, the chapter discusses implications for second language teacher education
    (SLTE) that relate to the need to prepare future teachers to flourish.


    # Wellbeing and Positive Psychology


    Wellbeing entails being satisfied with one’s life, and is influenced by interrelated
    factors at personal, professional, and contextual levels (Mercer & Gregersen 2020).
    According to Holmes (2005), individuals experience four interrelated kinds of
    wellbeing; physical (being in good physical health); emotional (being able to
    produce positive emotions and thoughts and adapt in stressful situations); mental
    (being able to realize one’s own potential and cope with normal stresses); and
    spiritual (finding a sense of deep purpose and meaning in life).


    Positive psychology is a well-known subfield of psychology for understanding wellbeing.
    It is the study of human strengths and virtues that lead people to flourish (Seligman
    & Csikszentmihalyi 2000). Unlike traditional psychology, which focuses on the
    root causes of mental disorders and emotional distress, positive psychology centers
    on the positives that help people increase their wellbeing. This relatively new
    subfield of psychology, whose origins date back to 1998, is closely linked to
    humanistic psychology but with greater emphasis on empirical research (MacIntyre
    & Mercer 2014).'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Positive psychology intends to enhance individuals’ wellbeing. One influential
    approach to doing so is the PERMA model (Seligman 2011), which emphasizes the
    notion of *flourishing* by increasing positive emotion (P), engagement (E), positive
    relationships (R), meaning (M), and accomplishment (A). *Positive emotion* is
    associated with the importance of feeling well, and it involves a wide variety
    of pleasant emotions, such as pride, hope, joy, serenity, among others. As understood
    in the PERMA model, *engagement* refers to reaching a state of flow by being fully
    immersed in a task. *Relationships* relates to having and maintaining quality
    relationships. Another key component within positive psychology is *Meaning*,
    which entails living a purposeful life and doing relevant activities. *Accomplishment*,
    the last factor of the PERMA model, emphasizes the importance of experiencing
    and recognizing our achievements and successes. Based on this model, the interaction
    of positivity within positive emotion, engagement, relationships, meaning, and
    accomplishment leads to wellbeing (Mercer & Gregersen 2020). From its origin,
    positive psychology has aimed at addressing three main areas, including the function
    of emotions, positive individual characteristics, and the institutions that influence
    people’s wellbeing (MacIntyre & Mercer 2014).


    In the last decade, positive psychology has had an increasing influence in the
    field of foreign language education. The pioneering work by MacIntyre and Gregersen
    (2012) on the broadening and narrowing functions of positive and negative emotions
    has led the way to various theoretical, empirical, and intervention-based works
    that have appeared in the following years (e.g., Dewaele et al. 2019; Fresacher
    2016; Gabryś-Barker 2016; Gregersen et al. 2020; Helgesen 2019; MacIntyre & Ayers-Glassey
    2021; MacIntyre & Mercer 2014; MacIntyre et al. 2019; Oxford 2016).


    # Positive Psychology in Language Teacher Education


    The key positive psychology components of the PERMA model have been explored in
    the field of language education to increase the wellbeing of learners, teachers,
    and student teachers. Among the plethora of reasons why it is important to develop
    positivity in language teacher education courses is that it can help increase
    optimism in pre-service teachers, foster resilience and hope (Hiver 2016), and
    increase inner peace (Barbeito & Sanchez Centeno 2021; Olivero 2017). Moreover,
    the development of positive emotion can lead to better reasoning and performance
    by promoting innovative thought and action'
  merge: -1
  img_proc: true
- pgno: 216
  md: '(Oxford 2015). Positivity can also help relieve tensions and teachers’ ability
    to cope with anxiety (Gregersen et al. 2016; Mercer & Gregersen 2020), as well
    as establish a harmonious learning atmosphere by fostering quality relationships
    between teacher and students and among students (Gkonou & Mercer 2017; Mercer
    2016).


    Engagement is a construct that is gaining increased attention in the field of
    language education (e.g., Edstrom 2015; Hiver et al. 2021; Mercer & Dörnyei 2020;
    Svalberg 2018). Whereas the PERMA model defines engagement with achieving a state
    of flow, scholars in the field of language education have related engagement more
    specifically to commitment and active participation in learning. Mercer (2019)
    states that there are key psychological aspects that are important for learner
    engagement to take place, including developing a sense of competence for mastering
    goals and succeeding; enhancing self-regulation and agency; helping learners identify
    the meaningful purpose of learning a language and engaging in tasks; and promoting
    a sense of belonging to the classroom, based on quality relationships with the
    teacher and peers.


    Because of increasing recognition that quality relationships between teacher and
    students are highly beneficial for learning to take place, this construct has
    also been a matter of investigation in language education. Although studies are
    still scarce, a growing interest in quality relationships can be observed in the
    second language acquisition (SLA) literature. Gkonou and Mercer (2018), for example,
    found that socio-emotionally competent language teachers work hard at developing
    quality relationships with their students, and do so by being empathetic, sensitive
    to students’ needs and emotions, establishing a relationship of mutual respect,
    and by creating an atmosphere of trust. In addition, a study has indicated that
    language teachers construct positive relationships with their students with the
    purpose of helping them cope with language anxiety (Gkonou & Miller 2019).


    Meaning, the extent to which people find a purpose and make sense of their life,
    has been emphasized in humanistic teaching approaches within the field of language
    teaching (Stevick 1990). For Stevick, it is paramount to embrace teaching approaches
    that focus on learners’ attributes and through which language learners can relate
    what they learn with real life. Oxford and Cuéllar (2014) have used learner narratives
    to help language learners make meaning of their learning experiences. Holistic
    approaches, which will be discussed in depth later in this chapter, have been
    found to be highly meaningful and transformative in the context of language teacher
    education (Olivero 2017; Olivero & Oxford 2019; also Chapter 1, this volume) as
    they have led to a change in future teachers’ emotions, beliefs, and identities,
    thereby facilitating teacher development.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'In their recent book on teacher wellbeing, Mercer and Gregersen (2020) claim
    that ways in which language teachers can get a sense of accomplishment include
    engaging in a new project, innovating in the classroom, celebrating (small) work-related
    successes, and being involved in professional development activities. Moreover,
    they state that in order to be able to experience the positive emotions that emerge
    from accomplishing tasks, teachers can engage in *savoring*, which means being
    aware of the good things that happen to us (positive experiences, feelings, among
    others). Savoring helps teachers not only be conscious of the accomplishments
    in the present but also in the past as a way of generating positivity toward the
    future.


    As has been described above, positive psychology has gained prominence in foreign
    language pedagogy intended to enhance language learners’ and teachers’ wellbeing.
    An important aspect to highlight is that in order for teachers to experience wellbeing
    throughout their careers and to care for the wellbeing of their language learners,
    it seems paramount to incorporate content and approaches that focus on wellbeing
    in language teacher education programs. In addition, it seems sensible to incorporate
    wellbeing during language teacher preparation due to the complexities involved
    in learning to teach a foreign language. An important part of addressing wellbeing
    in language teacher education is emotion regulation, which is discussed in the
    next section of this chapter.


    # Emotion Regulation in Language Teacher Education


    Teaching is an experience loaded with emotions, often unpleasant and difficult
    to manage. It is known to be a stressful job due to, among other aspects, the
    difficulty in achieving balance between private and professional life, low-paid
    jobs, and new demands as education becomes complex (Day & Gu 2010). In addition,
    it seems clear that teachers’ emotions, together with their beliefs and attitudes,
    tend to have a direct impact on the classroom. In recognition of the important
    role that emotions play in teachers’ performance and wellbeing, there has been
    an increased interest in emotions and emotion regulation in the field of teacher
    education in the last decades.


    Apart from the general reasons stated above that illustrate the need to focus
    on emotions in teacher education, there are stressors that are specific to language
    learning and teaching, which highlight the need to pay attention to emotion in
    the context of language teacher education. Such stressors include insecurity related
    to language ability; having to cope with language learners’ emotional'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'struggles; varied levels of proficiency within the same group of learners;
    and difficulties associated with the intercultural aspects of teaching, among
    others (MacIntyre et al. 2020).


    One way in which language teachers can better cope with the emotional challenges
    of their profession and experience greater wellbeing is by learning to regulate
    their emotions. Emotion regulation occurs when “emotions are felt to be undesirable,
    and therefore individuals consciously try to avoid painful feelings and seek out
    pleasant ones, protect the feelings of others, and feign an emotion” (Gkonou et
    al. 2021: 33). Gross’s (2014) theory of emotion regulation describes the process
    through which a person tries to upregulate positive emotions in order to increase
    their strength and duration and downregulate negative ones to reduce the effects
    of unpleasant experiences and the reactions that can result from such events.


    Due to the multidimensional nature of emotions, Gross (2002: 282) states that
    emotion regulation involves changes in the “latency, rise time, magnitude, duration,
    and offset of responses in behavioral, experiential, or physiological domains.”
    Gross (2014) proposes different types of emotion regulation. *Situation selection*
    implies taking actions that would be conducive to experiencing a situation that
    might trigger positive emotions. Another broad type of emotion regulation is *situation
    modification*, which implies modifying an external situation to change its emotional
    effect. *Attentional deployment* implies distracting one’s attention and directing
    it toward a specific situation to manage often unpleasant emotions. A fourth type
    of emotion regulation is referred to as *cognitive change* or reappraisal, which
    means reframing, modifying the way one thinks about a situation. Finally, *response
    modulation* implies trying to regulate the reactions that result from emotionally
    charged situations, including deep breathing, counting to ten before reacting,
    among others.


    Different scholars in the field of language teacher education have emphasized
    the value of emotion regulation strategies when learning to teach and teaching
    a second language. Gregersen, MacIntyre, and Macmillan (2020), for example, explored
    language teachers’ workplace stress when working abroad. Through a case study,
    they investigated the effects of a positive psychology cognitive reappraisal strategy
    (*Finding Silver Linings*) that is intended to reduce the often-unpleasant impact
    of stress. The *Finding Silver Linings* intervention has been shown to function
    as a useful type of emotion regulation for language teachers. Moreover, in their
    model of teacher resilience used to study pre-service teachers at an Austrian
    university, Kostoulas and Lämmerer (2020) explain how emotion regulation strategies,
    among other factors, help pre-service teachers develop an adaptive resilience
    system, which could lead to positive professional outcomes.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Gkonou, Olivero, and Oxford (2021) have proposed a framework for teaching important
    competencies to enhance peacebuilding, which include emotion regulation. They
    argue that language teacher education programs should prepare future teachers
    to develop ethnocultural empathy, intercultural understanding, cognitive flexibility,
    and emotion regulation, which can be done through specific activities based on
    holistic teaching approaches, including positive psychology-based interventions.


    We, the authors of this chapter, have worked on different projects that involve
    the use of emotion regulation strategies in the context of language teacher education
    and acknowledge the difficulties student teachers face when attempting to regulate
    their emotions. Such projects have consisted of pedagogical interventions carried
    out in phonetics, teaching methods, and practicum courses of a foreign language
    teacher education program with the aim of helping future language teachers develop
    tools to regulate their emotions associated with learning to teach a foreign language.
    Olivero (2017) has found that *inner peace activities*, which are language activities
    intended to increase inner harmony, have helped pre-service teachers downregulate
    unpleasant emotions, such as fear and insecurity, experienced during the practicum.
    At the same time, *inner peace activities* have allowed practicum students to
    increase their positivity during their teaching practices, which has led them
    to be more innovative and strengthen the relationships with their students (Olivero
    2017; Olivero & Oxford 2019). Barbeito and Sánchez Centeno (2021) highlight the
    importance of teaching emotion regulation strategies in the initial stages of
    teacher preparation. More specifically, they emphasize the value of incorporating
    positive psychology-based activities to help future teachers cope with the difficulties
    encountered when having to produce orally in the phonetics class and to have a
    more joyful experience throughout the course.


    As we have discussed, emotion regulation is paramount for cultivating wellbeing.
    Having conceptualized emotion regulation and discussed its importance in the field
    of language teacher education, let us now turn our attention to a teaching approach
    that is useful for addressing wellbeing in language teacher education.


    # Holistic Learning in Language (Teacher) Education


    Holistic learning refers to an educational approach that intends to develop the
    whole person. In other words, it focuses on the cognitive, emotional, social,
    cultural, and spiritual aspects of the learner (Olivero & Oxford 2019; Oxford,'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'this volume). Holistic learning approaches are based on deep reflection and
    inner work, they engage the learner in personally meaningful experience, they
    are embodied, contextualized, intuitive, creative (Oxford et al. 2021), and they
    focus on a concern for love, peace, and justice (Miller et al. 2018).


    There are various forms of holistic education, such as contemplative, embodied,
    transformative, experiential, and deep learning (Oxford & Olivero 2019). Through
    contemplative learning the learner develops the inner self through contemplation
    and deep reflection. Common techniques in contemplative learning are yoga, meditation,
    and journaling, among others. Embodied learning aims at enhancing learning through
    emotional work and practical experiences. Embodied practices involve not only
    intellectual work but also learning with one’s body and spirit. Transformative
    learning also intends to develop the learner’s whole self and does so by helping
    learners reflect on and modify their beliefs, emotions, and behaviors. Experiential
    learning offers opportunities to learn through concrete experiences and by reflecting
    on them.


    Another form of learning that centers on learning holistically is deep learning
    (Shaules 2019: 60). In his recent book, he defines deep learning as “the integration
    of complex skills into the intuitive mind in a process that is meaningful and
    engaging for learners.” Deep learning is based on personally meaningful experience,
    it is a whole person approach intended to foster development and growth. Shaules
    (2019) claims that language pedagogy should be based on the recognition that learning
    a language involves both attentive and intuitive mental processes that must work
    in tandem. Deep learning is seen as an embodied process that can facilitate engagement,
    a state of flow, and transformation of the self.


    In the field of language education, research on holistic learning is still scarce.
    One of the reasons is that language teacher education has traditionally neglected
    holistic practices (Olivero & Oxford 2019), in spite of the fact that holistic
    learning has been established in the field for decades (Stevick 1990). This is
    an issue not unique to language teacher education but also exists in general higher
    education, which has tended to embrace mainly cognitive approaches, often not
    recognizing the important role that other aspects of the self (such as emotional
    and social) play in education (Bai et al. 2013; London 2013). The strong focus
    on cognition has characterized language teacher programs around the world, which
    has led language teachers to replicate similar practices in their own classroom
    once they become in-service teachers (Johnson & Golombek 2016). Given that language
    teaching involves cognitive, social, and emotional'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'aspects, incorporating holistic approaches into language teacher education
    seems highly reasonable.


    The incorporation of holistic forms of education in language teacher education
    has recently grown (e.g., Barbeito & Sánchez Centeno 2021; Burns 2017; Helgesen
    2017; Olivero 2017; Olivero et al 2021; Olivero & Oxford 2019; Oxford 2017). It
    has been demonstrated that holistic language education enhances wellbeing, positivity,
    creativity, teacher development, and helps strengthen important human virtues
    (Olivero & Oxford 2019). In language (teacher) education, holistic approaches
    can be used to develop learners’ (and future teachers’) cognitions, emotions,
    and identities together with their language competencies. For example, holistic
    learning techniques such as journaling and creative writing involve reflecting
    with words. Non-verbal forms of reflection can also be fostered in the classroom
    through techniques such as visualization and meditation. Moreover, various forms
    of art can be used in the classroom including singing, painting, drawing, and
    dancing with the purpose of reflecting on different aspects of the self. Non-verbal
    language activities can be combined with verbal language ones.


    When future teachers experience holistic learning activities throughout their
    language teacher education programs in a gradual and systematic way, it is likely
    that the content, the competencies, and the techniques involved in such activities
    will become part of their pedagogical content knowledge (Shulman 1986), which
    would help them incorporate similar practices in their own classrooms once they
    start teaching. In the next section of this chapter, we describe a sample of positive
    psychology activities based on holistic learning approaches that can be used in
    language (teacher) education. Such activities are intended to foster wellbeing
    and emotion regulation and help future teachers thrive throughout their programs
    and in their profession.


    # Positive Psychology Activities for

    Language (Teacher) Education


    The positive psychology activities described in this section aim at helping future
    language teachers enhance their wellbeing and emotion regulation while learning
    to teach a foreign language. The activities were designed to be integrated into
    regular coursework of language teacher education courses. In recent years, we
    have used the activities in practicum courses of the undergraduate English as
    a Foreign Language teacher education program at the National University of Río'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Cuarto, in Argentina. It is important to note that the empirical evidence of
    the effectiveness of such activities in this program is still under investigation.


    The activities involve learning through reflection on experience, and aim at developing
    the cognitive, emotional, and social aspects of the self. When learning experientially
    student teachers are given the possibility to undergo personally meaningful experiences
    related to wellbeing and emotion regulation through embodiment, that is by having
    concrete opportunities to employ strategies for self-regulation and ways of enhancing
    their wellbeing, which they can later incorporate into their teaching practice.
    Through reflection student teachers can confirm, shape, modify their beliefs and
    emotions, as well as identify how the activities proposed relate to their actions
    as future teachers and to their overall professional identities. Reflecting on
    experience facilitates the transformation of the self.


    In order to better guide the reader, the four activities proposed follow the same
    organizational pattern. Each activity begins with (a) a brief introduction with
    the theoretical rationale, followed by (b) the main purpose of the activity, and
    (c) a detailed description of the procedures. We have also included optional (d)
    follow-up tasks that teacher educators can incorporate in order to extend learning
    opportunities as well as (e) tasks that involve the use of technology.


    Although these activities were used with student teachers taking practicum courses,
    they can be adapted to other language teacher education courses, including literature,
    teaching methodology, phonetics, and foreign language, among others. Moreover,
    these activities can be easily adjusted to other contexts, such as language classrooms
    or professional development courses. We trust that the readers of this chapter
    who are interested in the activities proposed below will employ their creativity
    and take a critical stance in order to adjust them to the different variables
    of their specific teaching contexts.


    # Activity 1: Building Positive Relationships


    Relationships are vital to successful classrooms (Gkonou & Mercer 2018). Building
    quality relationships and a sense of community in the language classroom mostly
    depends on the teachers’ willingness to build connections with their students.
    Much of the interaction that takes place in a classroom occurs nonverbally. Gregersen
    and McIntyre (2021: 44) state that “many of the cues that enrich meaning, convey
    emotion and augment learning in the target language'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'are embedded in nonverbal communication.” An effective way of establishing
    deep connections with students is by engaging in small talk, listening attentively
    and making eye contact, if culturally appropriate.


    In the authors’ experience, during their teaching practice student teachers are
    so concerned with following the planned stages of their lessons, that they tend
    to overlook taking the time to generate a positive, caring environment and bond
    with their students, which can certainly be a common practice for many educators.
    Experiencing a deep connection between teacher educator and student teachers in
    the practicum lessons, and later reflecting on how this is achieved, can lead
    to a more natural and effortless implementation of these valuable procedures once
    they start teaching.


    **Purpose:** To develop quality relationships with students and strengthen mutual
    respect.


    **Procedures:** In this activity, we encourage student teachers to acknowledge
    that both verbal and non-verbal communication are essential to establish deep
    connections in the classroom.


    +   1. Enter the classroom and take five minutes to engage in genuine and mindful
    conversation with the student teachers, responding with interest to what they
    say, through both verbal and non-verbal language. As a teacher educator, you should
    aim at creating a sense of community and a safe place for students, characteristic
    of positive and healthy interpersonal relationships.

    +   2. After some weeks of incorporating these actions as a routine when starting
    the lesson, prompt discussion of what you do when you start the lesson every day.
    Ask student teachers to express how they feel about that classroom routine. Tell
    them they will take turns to start the following lessons in the same way so as
    to see whether they feel confident to proceed in such a way, and whether it suits
    their teaching style. Invite student teachers to try this activity in their own
    classrooms when practicing teaching.

    +   3. When student teachers plan their lessons, encourage them to include a section
    at the beginning of their lesson plan to incorporate this routine.

    +   4. After student teachers teach their practice lessons in their assigned settings,
    ask them to reflect on their own emotions and students’ responses to this routine,
    and share with the whole class.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '**Follow-up:** Ask student teachers to write about their experiences in a journal.
    Ideas for prompts include: a) a specific description of the routine they implemented
    to start their lessons; b) their own emotions experienced during the implementation;
    c) the effect it had on students, among others.


    **Techy option:** Building quality relationships with students can be more difficult
    in virtual classrooms. Taking time to chat with students and listen attentively
    to what they say is very important and can help both teachers and students transcend
    the screen and feel connected. In order to strengthen your relationships with
    students you can also pretend to shake hands, use the chat box to send greeting
    emojis, count down and make a hi five to the camera, and send virtual hugs.


    # Activity 2: Deadlines and Lifelines


    “All the domains of your life, both inside and outside the workplace, are integral
    to how satisfied, content and happy you are” (Mercer & Gregersen 2020: 12). When
    teachers intentionally seek to be in a positive state, their minds will “broaden”
    (Fredrickson 2001) and their wellbeing will increase; they will be more creative,
    open-minded and able to connect with themselves and others.


    Student teachers often feel overwhelmed by their everyday routine and cannot find
    the occasion to have a self-care moment. One reason why this might happen is because
    self-care does not have a place in their schedule, which is often packed with
    deadlines. The word deadline formerly referred to ‘a boundary around a military
    prison beyond which a prisoner could not venture without risk of being shot by
    the guards’ (collinsdictionary.com). This historical meaning might depict the
    frantic lives teachers have. Even though teachers cannot omit deadlines, they
    can deliberately assign an opening and add a lifeline right after a deadline.


    What do we mean by lifelines? They are self-care moments, i.e., activities we
    enjoy doing and which remind us that we should try to keep or reestablish a healthy
    balance between academic and personal life. It is important to treasure these
    self-care moments and to commit to them as we do with deadlines. Enjoying self-care
    moments after meeting deadlines also serves as a way of celebrating accomplishments,
    which is an important aspect for understanding wellbeing.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '**Purpose:** to focus on reestablishing academic and personal balance and celebrating
    academic successes.


    **Procedures:** In this activity we encourage student teachers to consciously
    plan mindful self-care moments during busy times and reflect on the importance
    of keeping a healthy academic/personal balance.


    +   1. Ask student teachers to take a screen capture or a picture of their schedules
    and to share them with the rest of the class. You can also participate in this
    activity as a practicum teacher and show your own schedule.

    +   2. Ask student teachers about their daily routines. Then, discuss what deadlines
    mean and imply.

    +   3. Introduce the concept *lifelines*: Tell student teachers they are self-care
    moments that can be done after they accomplish tasks and meet deadlines. For example,
    taking a fifteen-minute break with no phones or laptop and drinking a glass of
    water mindfully, in complete silence. Focus on the fact that balance is conceived
    differently by each person and that the frequency and type of self-care moment
    selected should work for each person (Mercer & Gregersen 2020).

    +   4. With the whole class, create a self-care checklist with activities that
    the student teachers would like to do and that are feasible. Ask student teachers
    to share their choices to inspire their classmates.

    +   5. Get student teachers to reflect on the importance of finding openings in
    their calendars to schedule brief conscious activities to reestablish academic
    and personal balance and celebrate academic successes. Invite student teachers
    to take action by inserting these self-care activities into their schedules and
    meeting the *lifelines*.


    **Follow-up:** The following week, ask student teachers whether they were able
    to take their self-care moments and how they felt. Encourage them to savor the
    positive, relaxing moments they could experience during their breaks and to “protect
    them just as if they were important meetings” (Mercer & Gregersen 2020: 155).


    **Techy option:** If student teachers express difficulties in remembering to take
    self-care moments, they suggest setting a lifeline alarm in their cellphones.
    In this way, they will eventually get used to incorporating these breaks into
    their routine. You can also encourage them to make a self-care schedule for a
    specific week or month using their favorite app and to share it with the rest
    of the class or on social media among their friends.'
