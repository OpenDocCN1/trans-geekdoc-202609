- pgno: 74
  md: '(e.g., Hutchison & Waters 1987). With such knowledge teachers are in a stronger
    position to relate pedagogically to student attitudes toward language learning
    and to build on the evident ideas which learners already have.


    In this chapter, we aim to elaborate the significance of learners’ views of language
    learning based on thousands of analyzed metaphors about “journeys of learning.”
    These are elicited from sets of Chinese participants as learners and advanced
    users of English: in schools, in universities in China, as international students
    in Britain, as well as teachers of English in Chinese universities. The chapter
    also elaborates a model of five “meta-functions”—cognitive, affective, socio-cultural,
    moral-spiritual, aesthetic—derived here from the sets of Chinese participants’
    metaphors. Unlike similar functions mentioned in educational philosophy or curriculum
    theories, these are significant because they are derived inductively, bottom-up,
    from hundreds of students and teachers.


    The chapter will focus on learners’ conceptualizations of foreign language learning
    with three main purposes in mind. It will show that language learning for participants
    is cognitive, social, and emotional, but it also has moral and aesthetic features
    which all together represent a holistic view of language learning which engages
    the whole person. First, the metaphors show a range of characteristics that reflect
    students’ perspectives of their language learning experiences (including hardship
    and many mixed emotions of a journey) and qualities held to be necessary for success
    (such as patience and persistence in making constant efforts, and determination
    to overcome difficulties). Parallel to this are teachers’ roles as characterized
    in journey metaphors (for instance to show care and concern for student wellbeing,
    to cultivate and nurture students’ whole development and serve as an all-round
    guide). Such examples may help teachers reflect on their own context and develop
    similar qualities and roles for students. Teachers may reflect on both these and
    on their own metaphors and consider how such notions may enrich their own language
    teaching.


    Second, we show how a metaphor analysis can be applied to ascertain conceptualizations
    of learning. Through details of clusters of metaphors related to journeys of learning,
    teachers are encouraged to explore related metaphors with students. The metaphors
    analyzed here may offer information, insights, and imagination for students to
    make explicit their own ideas, experiences, and expectations about journeys of
    learning. Such an activity can be framed by a cultures of learning approach in
    which teachers and learners reciprocally develop their own and each other’s repertoires
    of cultural views of learning and teaching, moving toward a cultural synergy.'
