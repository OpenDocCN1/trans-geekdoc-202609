  img_proc: true
- pgno: 113
  md: '# Encouraging Humanistic Motivation


    It might seem, from the three stories presented in this chapter, that the emergence
    of a learner''s humanistic motivation is based on their idiosyncratic life experience
    and that there is not much teachers can do about it. It is true that motivation
    cannot be engineered or forced, because such humanistic motivation is emergent,
    as is presented and discussed previously. However, a closer look at the three
    stories indicates that personal reflections are at the heart of learners’ transformative
    experience and humanistic motivation (Leung & Scarino 2016; Muir 2020; Ros i Solé
    2016), which teachers can utilize to encourage the emergence of humanistic motivation.


    Xiaotang was aware of the positive impact of her self-reflection on her motivation
    throughout her university experience. When she reflected on her participation
    in the research in the last interview, she said: “if you just keep doing something,
    you might go in the wrong direction, but if you reflect, you will suddenly realize
    that I shouldn’t do that and can change my direction in time. It helps.” Her retrospective
    and introspective self-reflection was initiated and facilitated by her participation
    in this study (Lamb 2018), as she explicitly commented in the last interview:


    > 16. In the past, I would not analyze in such details. Through this research,
    I needed to think carefully and retrospect carefully. Afterwards I would go back
    and reflect if I needed to regulate my learning and things like that.


    For Xiaoming and Cheng Yuanyi, while their transformations presented in their
    stories happened in their early adolescent years, they still pointed to the role
    of the ongoing reflections in enhancing their self-understanding. Xiaoming commented
    that participation in the study “was a way to let me know myself” and Cheng Yuanyi
    also commented on his participation:


    > 17. Sometimes something happened and I didn’t pay much attention and thus didn’t
    realize its influence on me, but when you asked, I would think about it and realize
    maybe that really (had influence). I would have an understanding of myself, including
    the influence of some things on me. I can’t say it (my participation) has really
    made a difference (to me), but is there anything more delightful than understanding
    oneself?


    Therefore, it seems that allowing learners some time and space for personal reflection
    and meaning making could help encourage humanistic motivation.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Teachers who are interested in including self-reflection in their teaching
    need to make it clear to learners that this is a non-judgmental and non-evaluative
    space for learners to be themselves. Learners need to know that they will not
    be judged or evaluated for how they feel and what they think to open up in their
    self-reflection. This would be extremely helpful for students who are in a transitional
    stage when they are likely to experience struggles in their personal life and/or
    academic progress, as is the case with the three participants in this chapter.
    Their motivational journeys and personal transformations were accompanied by both
    positive and negative emotions and feelings within and outside the classroom,
    such as frustration, disappointment, (un)happiness, loneliness, and feeling touched
    and pleased. While positive emotions make people better learners and increase
    motivation (Helgesen 2016), it is also important for teachers to normalize the
    presence of and acknowledge the potential of negative emotions experienced within
    the classroom and beyond (See also Chapter 1, this volume). By doing this, teachers
    may be able to help facilitate learners’ transition in a way that also facilitates
    the emergence of humanistic motivation.


    From the three participants’ stories, it can be seen that personal reflections
    that give rise to humanistic motivation in language learning are not restricted
    to language learning activities. Rather, those reflections center around learners
    themselves, such as their life histories, feelings and emotions, competences,
    personalities, aspirations and identities, thus allowing them to synthesize a
    personal perspective. While students should be given the time and space to focus
    their reflection on themselves in their own ways, teachers could use the following
    set of questions as a starting point for learners’ personal reflections:


    +   1. What is my personal story with the language?

    +   2. How has language learning influenced my personal growth and development?

    +   3. How am I feeling now (as a person with multiple roles including a language
    learner)? Why am I feeling this way?


    Questions 1) and 2) aim to elicit learners’ retrospection on their language engagement
    histories and invite them to construct their own narratives or stories to make
    their life experience personally meaningful (Barkhuizen 2015; Kramsch 2009). Since
    language engagement is a potentially subversive and empowering experience (Ros
    i Solé 2016), the two questions would hopefully contribute to learners’ realization
    of their past transformation(s) facilitated by language engagement and/or awareness
    of its transformative potential. Question 3) encourages learners to think about
    their current experience as a language'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'learner and as a person with other roles and to explore their relationship
    with various aspects of language learning process (Dörnyei 2019, 2020). This can
    be also used as a point of reference and comparison for future reflections, hopefully
    contributing to their development of self-understanding.


    Time commitment of personal reflections can be of concern especially to teachers
    in formal education settings, and the frequency of personal reflections is indeed
    one thing worth deliberating on. To illustrate, although Xiaotang found reflections
    to be helpful, she considered the weekly reflection assignment in her speaking
    module to be “too frequent” and “boring” and less frequent reflections (one in-depth
    interview every four or five months) to be “more meaningful.” The takeaway message
    for teachers is that it is not the amount of time but the depth of thinking that
    matters in encouraging humanistic motivation among learners.


    # Conclusion


    In the chapter, by analyzing the three learner stories, I have highlighted that
    humanistic motivation emerges from language learners’ experience of transformation
    as learners associate language learning with understanding their own competences,
    desires, and identities. The findings not only echo the call for a more humanistic
    view of motivation, but also shed light on the motivational power of transformative
    language engagement. Looked at from a humanistic perspective, learners’ motivation
    to learn a language is linked to their motivation to develop self-awareness and
    achieve personal growth. This chapter also provides implications for language
    teachers to help cultivate learners’ humanistic motivation through engaging them
    in personal reflections.


    # Notes


    +   1. *Natsume''s Book of Friends* tells the journey of a teenager Takashi Natsume,
    who has the ability to see spirits and is isolated by his peers, to return the
    contracts in his grandmother''s notebook to the spirits.

    +   2. *Akame ga Kill!* tells a story of a young boy who joins an assassin group
    to fight against the corrupt empire.

    +   3. In *Yosuga no Sora*, the male protagonist has a romantic relationship with
    his twin sister.

    +   4. *Sword Art Online* tells the story of a teenage boy fighting to beat the
    game when he and other players are trapped in virtual reality simulation.'
