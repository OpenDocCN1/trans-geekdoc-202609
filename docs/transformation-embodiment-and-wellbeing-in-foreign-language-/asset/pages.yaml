    # Teachers: Caring for Learner Wellbeing


    Many further metaphors focus on how teachers show a humanistic concern for student
    wellbeing. Essentially, such metaphors frame language teaching as “to cultivate
    the person” (in Chinese, “yu ren,” “teach the person”). Thus, “a teacher is a
    parent” in ninety metaphors: “a nice parent: who offers me great care, concerned
    for our growth, demanding us to learn seriously,” “a kind-hearted mother: she
    instructs our study and cares about our thought,” and “our sacred mother, who
    gives us warmth and strength when we feel lonely.”


    More generally, “a teacher is a friend” in 132 metaphors: evidently this is similar
    to a parental caring and sharing relationship. It has strong social and emotional
    functions. To expect teachers to be “friendly” is common everywhere; however,
    for Chinese participants the teacher as “a friend” shows greater closeness with
    a warm sharing of heart-to-heart feelings and being a role model who cultivates
    the whole person. Students explain: “My teacher is a friend who cares about students
    and guides them, who shares happiness with them, caring about our health.” “Teachers
    share joy and sorrow with us; they communicate'
