- pgno: 75
  md: 'Third, we show how many students (and teachers) in China already have holistic,
    humane ideas, and ideals which emphasize personal and social growth through foreign
    language learning (see also Chapter 4 of this volume). These emerge strongly in
    their metaphors. Some metaphors express learning as related to bodily experience,
    other metaphors relate to learning in the head, heart, and soul. To generalize
    these features, we outline a model of five meta-functions which are derived from
    the participants’ metaphors of journeys of learning. The model as a holistic conceptualization
    of journeys of language learning can be applied to language teaching generally
    or provide a framework for teacher training and professional development.


    In the sections following, we first outline the concept of cultures of learning
    and the related idea of cultural synergy, which we see as a framework for investigating
    metaphors and for metaphor teaching and learning activities. We then present some
    introductory ideas about metaphors and an overview to indicate what journey metaphors
    tell us. This is followed by a section showing a brief rationale for a metaphor
    approach, with details of participants and the metaphor analysis related to journeys
    of learning. Subsequent sections explore the journey metaphors to show metaphors
    as embodiment reflecting travel experience and other characteristics emerging
    from the metaphor data, including how learners see a transformation of the self
    and features of their holistic growth, and how teachers show care and concern
    as “a friend,” “parent,” or “cultivator.” The model of five meta-functions is
    outlined with metaphor examples; these are seen further in Figures 3.1 and 3.2.
    The chapter concludes with possible directions for teacher reflection to engage
    further with conceptualizations of learning through metaphors. We suggest mini-tasks
    for students (and teachers) to gain insights and inspiration through metaphors.
    The chapter thus provides material for professional development through which
    teachers can reflect on whether and how these detailed features of learning journeys
    are part of their current practices or might be included in future teaching.


    # Understanding Cultures of Learning


    The term “culture of learning” can refer in a general way to students’ cultural
    background toward learning or, within an institution, to a particular ethos of
    designed practices for learning, perhaps with a learner-centered focus. However,
    the emphasis here is on how learning is culturally constructed (Yuan & Xie 2013).
    This means that cultural practices for learning are built'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'up gradually, usually implicitly, through family and community socialization
    practices. For example, learning can be predominantly through observation and
    imitation, or through listening to stories and proverbs. These ways may differ
    from institutional expectations in schools and colleges. Hence, in different communities,
    students may have distinct cultural preferences for ways of knowing and ways of
    speaking (including marked preferences for how to learn a foreign language). Recognizing
    this, many teachers now make efforts toward recognizing and involving indigenous
    pedagogies in order to develop culturally responsive teaching practices. This
    is a direction for professional development for teachers with aboriginal learners
    in Australia (Craven 1999), Maori students in New Zealand (Metger 2015; Pihama
    et al. 2015) and among Native American groups in the United States (Cazden et
    al. 1985), and Canada (Battiste & Barman 1995; Canadian Council on Learning 2009).
    These indigenous pedagogies favored by learners often give particular importance
    to metaphors, images, and symbols as media for significant learning; beyond classroom
    skills they emphasize learning as a holistic process for individual and community
    wellbeing.


    In the context of language learning, the notion of “culture of learning” provides
    a framework for understanding learners’ (or teachers’) preferred classroom practices
    and culturally taken-for-granted beliefs relating to ways of learning, communicating,
    interacting, and evaluating what happens in classrooms. As shown in our work with
    Chinese learners (e.g., Cortazzi & Jin 1996; Jin & Cortazzi 1993, 1998), a culture
    of learning may be shared—or not—between teachers and most learners. For example,
    some Chinese learners may not share “Western” language teachers’ expectations
    for classroom interaction, questioning and discussion, or even ideas about what
    characterizes “good” teachers or learners. A further issue is that students and
    teachers can be largely unaware of each other’s cultures of learning, or feel
    unappreciative and uncomfortable about them (Cortazzi & Jin 1996, 2002). By articulating
    the assumptions and expectations associated with different cultures of learning,
    we can counter perceived stereotypes of “Chinese” students as passive, relatively
    quiet and apparently unquestioning, who reportedly engage little in classroom
    interaction in the ways expected by “Western” teachers (Yuan & Xie 2013). Thus,
    we ascertain the inside views of Chinese and other cultures of learning (Cortazzi
    & Jin 2002; Jin & Cortazzi 2008, 2019).


    The “cultures of learning” concept is increasingly important in contexts of diversity
    and internationalization when language learners and teachers'
