- pgno: 111
  md: '# Emergence of Humanistic Motivation


    The three stories presented in this chapter suggest that learners’ experiences
    of language engagement go beyond the L2 learning experience defined predominantly
    within the formal education setting (Dörnyei 2009, 2019, 2020). Xiaotang’s experiences
    of both failures and successes in exams, both negative and positive teacher feedback
    and peer comparison, are instances of learner engagement in the immediate formal
    language learning environment. Xiaoming’s and Cheng Yuanyi’s stories show that
    language learning also takes place outside the classroom in a learner’s day-to-day
    life and learner engagement with Japanese-mediated cultural products outside formal
    education can fuel motivation. In the case of this study, such informal language
    engagement is made possible largely by the salient presence of the Japanese language
    and its cultural products in China, in particular the popularity of Japanese anime
    and manga (Hashimoto 2018). The three participants’ data also demonstrate the
    multi-facetedness and transformative potential of language engagement (Dörnyei
    2019): their involvement in the academic, aesthetic, and ethical aspects of language
    engagement afforded their experiences of transformations in their self-confidence,
    self-understanding, and self-identity.


    The self-transformations experienced in aspects of language engagement interact
    with language learning motivation through the mediation of learners’ changing
    perceptions of themselves and their relations with language. The transformations
    of the three participants presented in this chapter were related to Japanese engagement
    in one way or another and thus to some extent changed their personalized perceptions
    of Japanese. The academic aspect of language engagement involves learning for
    academic purposes in formal education, which can pose challenges as well as provide
    transformative opportunities for learners. For instance, while engaged in formal
    Japanese learning, Xiaotang transformed her self-confidence not only in the academic
    domain but also in the global domain, which led her to realize that Japanese is
    not only a subject of study but also a means for her to be distinctive. The aesthetic
    experience includes artistically appreciating language in its own form or as part
    of culture and/or making use of its expressive function (Kramsch 2009; Ros i Solé
    2016). The ethical language engagement involves learning about values and ethics
    presented in foreign-language-mediated cultural products. For learners like Xiaoming
    and Cheng Yuanyi, cultural products such as Japanese anime and'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'literature provide them with a platform to find emotional and social support
    and engage with the language aesthetically and ethically. In the platform as a
    third space, they can shuttle between the perceived self and the presented other
    through engagement in their emotional, cognitive, and social experiences as multilingual
    subjects (Kramsch 2009); construct and re-construct their (imagined) identities
    (Norton & Pavlenko 2019); and experience learning motivation as part of their
    maturation and self-formation (Clarke & Henning 2013; Harvey 2017). Language engagement
    can be particularly transformative when learners are in a transitional stage where
    their views of their self and their social positioning are challenged. This was
    the case with all the three stories presented in this chapter: when they experienced
    self-transformations, Xiaotang was in her transition from secondary education
    to tertiary education and Xiaoming and Cheng Yuanyi were in their transition from
    junior high to senior high. Having had such transformative experiences, learners
    tend to see language learning as “a means … to transform themselves in multiple
    domains—intellectual, emotional and spiritual” (Clarke & Henning 2013: 86). It
    is worth pointing out that although I presented three stories each of which focuses
    on one dimension of language engagement, the different dimensions are not mutually
    exclusive but are in fact interconnected and overlapped with one another.


    Through reflecting on language and language learning in their transformative experience,
    learners develop a humanistic orientation in their motivation that emerges from
    or is enriched by their language engagement. In other words, learners’ language
    learning motivation is oriented toward the humanistic value of language, or more
    specifically the transformative potential of language engagement to boost self-confidence,
    enhance self-understanding, and socially position themselves. Learners’ awareness
    of the transformative potential of language learning emerges from their language
    engagement and generates motivation for further continued conscious engagement,
    demonstrating the motivational role of transformative power as a means and as
    a goal (The Douglas Fir Group 2016). By focusing on what is meaningful to learners
    and their lives, humanistic motivation incorporates their social identity goals
    (Norton 2013; Wang et al. 2021), ideological becoming (Harvey 2017), ethical formation
    (Clarke & Hennig 2013), and much more in terms of their personal development.
    In the next section, I explore pedagogical implications regarding the role of
    personal reflections in encouraging humanistic motivation in language learning.'
