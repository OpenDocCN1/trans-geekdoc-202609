  md: '*I am running now, so fast, but is it not fast enough. Where should my story
    begin? I was a child, I was? No, that is not my story. It was the August 14ᵗʰ,
    1961 and I was in the house of my friend.*


    In the next few lines, it becomes clear that the young, male narrator was visiting
    a friend in East Germany, when the wall went up and he was stuck there. He approached
    an “officer” and asked for assistance but was turned away.


    Ich hatte kein Pass, keine Mutter, kein vater, und keine Schwester. Ich war ein
    Kind hinder dem eisernen Vorhang.


    *I had no passport, no mother, no father, and no sister. I was behind the iron
    curtain.*


    The narrator then describes how he was accepted into the home of his friend but
    missed his family. He attends school there, where she is learning Russian and
    has to attend Monday through Saturday—details about everyday life in East Germany
    that Klara had encountered in the readings. The narrator then sunk deeper and
    deeper into depression, as life became a boring cycle, “Schule, junge Pioneers
    … und dann?” (school, Young Pioneers … and then?). Finally, in an act of desperation,
    he decides to jump.


    Es war der 13. August 1964, ich bin nun 15 Jahre alt. Ich stand, ich wartete,
    ich dachte über meine Mutter und meinen Vater und meine Schwester, ich hatte für
    nichts zu leben. Ich lief. Jetzt laufe ich gerade, Ich springe über die erste
    Wand. Ich sehe die zweite Wand. Ich springe und ich höre einen Schuss und ich
    kann meine Beine fühlen nicht. Ich vermisse meine Eltern und meine Schwester.
    Ich habe für nichts zu leben.


    *It was the 13. August 1964, I am now 15 years old. I stood, I waited, I thought
    about my mother and my father and my sister, I had nothing to love for. I ran.
    Now I am running. I jump over the first wall. I see the second wall. I jump and
    I hear a shot and I cannot feel my legs. I miss my parents and my sister. I have
    nothing to live for.*


    Klara’s composition was striking to me at the time in a few ways. First, it bears
    nothing that, based on the metalanguage related to genres and the available designs
    that are associated with personal recounts we had used to articulate the learning
    objectives of this unit, Klara had clearly fulfilled the assignment and had shown
    substantial mastery over the lexico-grammatical forms related to narratives, which
    had been the focus of this part of the course. She also demonstrated cultural-historical
    knowledge in her description of school and recognition that the narrator would
    have to jump not once but twice to cross the Berlin Wall (which was in actuality
    two walls with a strip of land down the'
