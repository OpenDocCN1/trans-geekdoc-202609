    # Conclusion


    Klara, like many students in the class, experienced an initial frustration with
    the *Ostalgie* texts, because they included many illusions that were opaque to
    her as someone who grew up in a different time and place and because they did
    not fit the more familiar tragic narratives of East Germany during the time of
    the Berlin Wall. Comprehension and historicist models for teaching literature
    in the language-culture classroom might compel us to address these complaints
    by helping the learners to understand how an ideal (i.e., native speaking) reader
    might have made sense of these works. For example, we might try to supply pertinent
    information about the cultural context of *Ostalgie* upfront and maybe talk about
    the reception of these works in German-speaking spaces. There is nothing inherently
    wrong with this approach; however, with Rosenblatt’s help, we might think about
    what stances and positionalities we are affording learners as we decide how best
    to bring in these contexts and perspectives.


    A learner might gain new knowledge about the historical context of East Germany,
    if we focus on explicating aspects of everyday life in the text, which they might
    find unfamiliar or confounding. But in privileging a more efferent stance over
    an aesthetic one, what might get lost is the ways in which *Ostalgie* is somewhat
    exclusionary and subversive by design, exactly because it offers an alternative
    insiderliness those who likewise counted the days until they could graduate from
    the *Junge Pioniere* or who celebrated important milestones with difficult to
    acquire Western treats from the *KaDeWe* in West Berlin, which stands in contrast
    to the normalizing effects of reunification. We must ask ourselves whether, in
    our attempts to help learners more readily comprehend the text and overcome those
    aspects of the text that make them feel excluded, do we destine them to miss out
    on the fun, the thrill, and yes the frustrations that come from entering into
    spaces that were not built to fit them? By framing interpretation as a predetermined
    place learners need to get to with the right information often results in a third
    reading stance, which Cheryl Hogue Smith (2012) in her'
