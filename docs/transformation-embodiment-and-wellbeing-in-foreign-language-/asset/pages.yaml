  md: '# Holistic Views of Language Learning in

    Metaphoric Conceptualizations


    Martin Cortazzi & Lixian Jin


    # Introduction


    For effective language teaching and teacher professional development, the ability
    of language teachers to reflect on their own personal conceptions of “language
    learning” and how their learners’ conceptions and expectations may differ from
    their own is crucial. Student conceptions of learning may be quite different from
    influential concepts and theories derived from the psychology of language learning
    or second language acquisition (e.g., Cook 2016; Ellis & Shintani 2014; Mitchell
    et al. 2019; van Patten et al. 2020). In particular, notions of learning and teaching
    inspired by Western SLA research and popular methodologies may contrast with “cultures
    of learning” in other parts of the world, which have their own preferred ways
    of learning, sets of expectations, experiences, and preferred patterns of classroom
    engagement (Jin & Cortazzi 2019). As we have argued in previous work, recognition
    that the conceptualization and enactment of learning and teaching are culturally
    variable generates the need for *learning-centered* approaches (e.g., Cortazzi
    & Jin 1996, 2002; Jin & Cortazzi 1998, 2019) in which emphasis is placed on learning
    from and consciously extending repertoires of cultural ways of learning.


    Often research orientations to language learning are top-down, taking theory toward
    practice, and even specific accounts of conceptualizations of language learning
    (e.g., Seedhouse et al. 2010) rarely actually ask learners themselves about this,
    although this could yield a complementary bottom-up view. Without some knowledge
    of how learners conceive of language learning as part of the beliefs and values
    which they bring to classroom interaction, it is difficult to adopt a truly learner-centered
    (e.g., Nunan 1984) or learning-centered approach'
