- pgno: 68
  md: '# Conclusion


    This chapter has discussed the psychology of FLL from the perspective of adjustment
    and transformation. The implications of the views expressed here relate to multiple
    areas of concern in FLL—the psychology of learning, learner wellbeing, motivation,
    autonomy and efficacy, language (learning) awareness, foreign language identity,
    and so on. It is hoped that the ideas presented here can stimulate discussion
    about the value of a more holistic, embodied, and growth-oriented view of the
    learner. As a philosophical stance, it''s easy to agree that FLL can and should
    lead to learner growth and transformative experiences. Yet this creates pedagogical
    challenges as well. It forces us to take into account the learner in all their
    complexity and take responsibility for the psychological impact of the learning
    experience. It reminds us that FLL is no more and no less than a life challenge
    and that we owe it to learners to treat it as such.


