  md: 'and a leader of their moral virtues.” A bilingual poster reminds everyone that
    teachers are “guides”: “Strengthen the professional ethics of teachers: be a guider
    for students’ characters, for student’s knowledge, for students’ innovative thinking,
    for students’ dedication”; “Be a good teacher with ideals and beliefs, moral sentiments,
    knowledge, and a benevolent heart.”


    These four points illustrate the strong alignments of the metaphors discussed
    here with more recent socio-cultural ideas within foreign language education in
    China, e.g., to develop student attitudes, personalities, values, and qualities
    of character (Liu & Wu 2015).


    # Facing Adversity in Competitive Journeys toward a Destination


    Further details of learning journeys give insights into how these Chinese participants
    think and feel about language learning. The participating English teachers in
    China see the journey of learning as “an endless road,” “the boundary is ever-increasing,”
    “the more you learn, the less you see the end.” Many students echo this: language
    learning is “a journey that can never end”; “no matter how high you climb there
    is more to climb.” Teachers (as ex-students) recognize the hardship and toil of
    learning journeys: “you will face many difficulties and obstacles, risks, twists
    and dangers,” “you may find treasures or you may lose everything, including your
    life.” Students agree and elaborate the emotions: “We’re walking on a road of
    thorns, we get bloodstained and depressed through loneliness but we can hear the
    leisurely birds singing and see the yearned-for rising sun,” “it’s the unique
    road of overcoming adversity and becoming a genius, it is hard and dangerous,
    there are no short cuts.”


    Participants, both students and teachers, reiterate the need for persistence despite
    difficulties; they emphasize how learners must continue determined efforts to
    overcome obstacles. Teachers advise: “You always conquer one difficulty then another
    comes; keep going, it takes a lot of effort but it is worth struggling”; “diligence
    is the path to the mountain of knowledge.” Again, students elaborate emotionally:
    “it is months of enduring hardships, waking in the clouds, walking in the fog,
    walking in the desert, you must have persistence until you reach the sunshine,”
    “you must spare no effort, it needs unremitting efforts,” “our attitude determines
    the result—you have to stick to working hard to make your dream come true.”


    Chinese students often portray learning as a fierce competition, “there are always
    many competitors around you and people are always rushing to the goal.” Chinese
    school students confirm this, facing the notoriously competitive “gaokao” national
    university entrance exam; so do Chinese students studying'
