  img_proc: true
- pgno: 150
  md: 'Encompassing learning through playing, experience, beauty, and the body, as
    well as learning together, Winston’s (2015) theoretical rationale thus resonates
    strongly with deep learning as conceived in this chapter, as something concerned
    with students’ emotions, inner lives, and transformative potential.


    This pedagogical approach has, however, attracted various criticisms (Olive 2015),
    including some that specifically target its playful, physical nature (McLuskie
    2009). Some of these critiques are essentially only relevant to academic Shakespeare
    studies, rather than Shakespeare in EFL contexts, but two reservations expressed
    by Murphy et al. (2020) are important to address here. The first is that what
    they call “performance” methods are extremely time-consuming. This can certainly
    be true, and, as a result, extracurricular or occasional active Shakespeare sessions
    can be a good option in highly time-pressured and test-oriented learning contexts
    (Coles 2009). A second issue raised by Murphy et al. (2020) is that performance-oriented
    approaches neglect the texts themselves. McLuskie (2009: 131) makes a similar
    point about active approaches in schools, claiming that they can “produce exciting
    educational experiences” but ones that are only tangentially related to Shakespeare,
    and may be insufficiently rigorous for use at more advanced levels. It is true
    that a few techniques associated with active methods deal only indirectly with
    text, but Gibson (1998), Banks (2014), and Stredder (2009) all stress the fundamental
    importance of learners engaging with Shakespeare’s language. The performative
    elements of active approaches are there to facilitate this engagement, and, certainly,
    all the activities shared below involve exploring and interpreting the language
    of Shakespeare’s texts—albeit through physical, expressive means, rather than
    more conventional analysis. On that note, it is important to consider what goals
    such analysis might have. Murphy et al. (2020) stress that the play-text, in all
    its contextual, historical, and literary complexity, should be the primary object
    of analysis (in their case of the stylistic kind). However, language educators
    are under no such obligation. They do need to understand the language, literary
    devices, and context of extracts they are using, but a sustained literary and/or
    historical analysis of an entire play-text need not be the goal. Indeed, as is
    argued below, isolated extracts from Shakespeare can serve as “authentic” materials
    for language education, providing opportunities for learners to engage emotionally,
    physically, and imaginatively with beautiful, dramatic, strange language (Cheng
    & Winston 2011). The next section outlines how this can be done in ways that incorporate
    an intercultural perspective on language teaching and learning.'
