  md: '# Contributors


    **María Celina Barbeito** is Associate Professor and Researcher at the National
    University of Río Cuarto, Argentina. She is a teacher in the English Teacher Education
    Program and Director of the Master’s in Applied Linguistics program. She holds
    an M.A. in TESOL from the University of Arizona, USA. Celina has almost thirty-years’
    experience as a teacher, trainer, and researcher in the areas of learning strategies,
    beliefs, and emotions. She is currently interested in finding ways to help future
    English as a Foreign Language teachers enhance their wellbeing through the lenses
    of positive psychology.


    **Martin Cortazzi** is Visiting Professor at the Department of Applied Linguistics,
    the University of Warwick, UK and at the City University of Macau, China. He has
    taught in primary and secondary schools and in universities, and trained teachers
    in all these contexts internationally. His research and over 200 publications
    focus on developing innovative qualitative research methods; applying linguistics
    in education and language teaching; cultures of learning and intercultural communication;
    and English language teaching materials.


    **Lixian Jin** is Chair Professor in Applied Linguistics and Dean of Faculty of
    Humanities and Social Sciences at City University of Macau, China, after being
    Chair Professor and having worked at University of Nottingham Ningbo China for
    over four years and at a British university for twenty-three years. She has been
    awarded research grants and led many international research teams to study intercultural
    communication in leadership and business contexts. She has developed qualitative
    research methods to explore insights from participants. Her over 200 publications
    focus on researching cultures of learning, intercultural communication, metaphor,
    and narrative analysis and bilingual clinical assessments.


    **Duncan Lees** is Assistant Professor in Applied Linguistics at the University
    of Warwick, UK, where he teaches a variety of courses relating to intercultural
    communication. His PhD on Shakespeare in Chinese higher education was funded by
    the Economic and Social Research Council, and drew on the thirteen'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'years he spent teaching literature and drama at a university in southern China.
    His research interests include drama and intercultural language education, ethnomethodology/conversation
    analysis, and intercultural pragmatics.


    **Troy McConachy** is Associate Professor in Applied Linguistics at University
    of Warwick, UK. His research focuses on intercultural learning in language education,
    particularly from the viewpoint of awareness, identity, ideologies and representations,
    and teacher education. He has published widely in international journals such
    as ELT Journal, Language Awareness, Journal of International and Intercultural
    Communication, Journal of Intercultural Communication Research, and Intercultural
    Education. He is Editor-in-Chief of the journal Intercultural Communication Education
    and co-editor of Cambridge Elements in Intercultural Communication.


    **María Matilde Olivero** is Second Language Teacher Educator and Researcher at
    the National University of Río Cuarto, Argentina. Her main research interests
    include affective factors and peacebuilding approaches in language education,
    and teacher wellbeing. Matilde obtained her PhD in second language acquisition
    at the University of South Florida, USA. For the past years she has worked hard
    to expand the field of peacebuilding in language education through theoretical
    models, empirical research, and the design of teaching materials. Matilde has
    published extensively in her areas of expertise. She has recently co-edited Peacebuilding
    in Language Education: Innovations in Theory and Practice.


    **Rebecca L. Oxford** (Professor Emerita and Distinguished Scholar-Teacher, the
    University of Maryland, USA) is a language learning specialist, peace specialist,
    educational psychologist, speaker (forty-three countries), and former language
    teacher. Of her fifteen books, seven concern language learning and five concern
    peace and spirituality themes. Her 2021 book is *Peacebuilding in Language Education*
    (Oxford, Olivero, Harrison, and Gregerson). With Jing Lin and others, she co-edits
    two book series: Spirituality, Religion, and Education and Transforming Education
    for the Future. She co-edited the sixty-nine-volume Tapestry series for ESL/EFL
    teaching and is a published poet and amateur artist.


    **Adelina Sánchez Centeno** is an English as a Foreign Language teacher and researcher
    at the National University of Río Cuarto, Argentina, where she has worked since
    2003. She holds an M.A. in applied linguistics from the same university. Her research
    explores beliefs and emotions about oral corrective'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'feedback in EFL contexts and the impact of students’ emotion self-regulation
    strategies on their language learning process. She has published papers, co-authored
    book chapters, and participated in national and international conferences. Adelina
    is currently working on a research project that involves the design and implementation
    of positive psychology-based classroom interventions to help future EFL teachers
    increase their wellbeing.


    **Joseph Shaules** is Specially Appointed Professor at Keio University, Tokyo,
    Japan, and Director of the Japan Intercultural Institute. He also teaches in the
    Tsuda University Graduate Program in TESOL. His research and publications focus
    on cross-cultural adaptation, intercultural education, culture and cognition,
    the psychology of intercultural experiences, and linguaculture learning. Books
    include *Language, Culture and The Embodied Mind* (2019); *The Intercultural Mind*
    (2015); *Deep Culture* (2007). He is the host of The Deep Culture Podcast.


    **Zi Wang** is currently Internationalization Coordinator at the University of
    Warwick, UK. Her research interests include motivation, language learning, and
    multilingualism. Her PhD project investigated Chinese learners’ motivation to
    learn English and Japanese. She has published on language learning and translation
    studies. Her most recent first-authored publication is *Negotiating Identity Tensions
    in Multilingual Learning in China: A Situated Perspective on Language Learning
    Motivation and Multilingual Identity* (2021).


    **Chantelle Warner** is Associate Professor of German Studies and a faculty affiliate
    of Second Language Acquisition and Teaching at the University of Arizona, USA.
    Since 2014, she has directed the German Language Program. She also co-directs
    the Center for Educational Resources in Culture, Language and Literacy (CERCLL),
    a National Language Resource Center at the University of Arizona. Dr. Warner’s
    research focuses on affective, experiential, and aesthetic dimensions of language
    use and learning, foreign language literacy development, pedagogical stylistics,
    and critical multilingualism studies, and she has published and presented widely
    across these areas. Her current book project argues for an expansion of models
    of literacy development and related pedagogies in second language teaching and
    learning to better integrate not only a wider range practices and modalities,
    but also different aesthetic and feeling rules that tacitly shape our responses
    to different language uses.


    **David Wijaya** is a PhD candidate in Applied Linguistics in the School of Languages
    and Cultures, University of Queensland, Australia. His research'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'interests include applied Cognitive Linguistics, embodied pedagogy, thinking
    for speaking, second language Indonesian, and teachers’ technological, pedagogical,
    and content knowledge (TPACK). He has published on applied Cognitive Linguistics
    (2018, 2021) and teachers’ technological, pedagogical, and content knowledge (TPACK)
    (2021). His most recent publications are: *Exploring Language Teachers’ Lesson
    Planning for Corpus-based Language Teaching: A Focus on Developing TPACK for Corpora
    and DDL* (2021) and *Investigating Indonesian EFL Learners’ Knowledge and Use
    of English Periphrastic Causative Constructions* (2021).'
