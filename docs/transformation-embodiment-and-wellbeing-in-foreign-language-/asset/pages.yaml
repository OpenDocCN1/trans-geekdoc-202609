- pgno: 51
  md: '# # Language Learning as a Transformative

    # Experience of Resistance, Adjustment,

    # and Change


    Joseph Shaules


    # ## Introduction


    Foreign language learning (FLL) is a psychologically powerful, potentially life-changing
    experience. We see students get “hooked” on a new language; we see this lead to
    eye-opening foreign experiences and even a new sense of self. For some learners,
    FLL becomes a personal quest—a journey of discovery, transformation, and growth.
    At the same time, negative experiences are also common. Language practice is often
    stressful and learners often get frustrated, anxious, and flustered. This psychological
    impact on learners is both situational and cumulative—they have moment-by-moment
    affective responses—pleasure, interest, anxiety, curiosity, frustration—as well
    as long-term reactions to the process overall (Dewaele 2011). At the extremes,
    FLL may be a life-affirming adventure or something to be reviled.


    These contrasting outcomes remind us of the high emotional and psychological stakes
    that FLL has for learner’s wellbeing (Dewaele et al. 2019). For their part, educators
    face a dual challenge—helping learners manage what can be a stressful learning
    process, while also finding ways to help them experience FLL as an intrinsically
    rewarding endeavor. This dualism of challenge and reward speaks to what Dewaele
    and MacIntyre (2014) refer to as the “Janus-faced” psychological nature of FLL:
    it can be both anxiety producing and enjoyable; it can be stressful but carries
    within it the potential for enriching our lives. As educators, we need to help
    learners successfully navigate this psychological terrain of discouragement and
    promise.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'This chapter presents a theoretical perspective that helps make sense of the
    Janus-faced psychology of FLL—the interrelated nature of its psychological challenges
    and rewards. It also seeks to encourage a view of FLL as a transformative experience.
    This refers most foundationally to the idea that FLL is not psychologically neutral—it
    involves a process of inner change and development in which learners must respond
    to the adaptive demands imposed by the experience of foreignness. FLL involves
    *adaptive* demands in the sense that the learner needs to modify mental habits
    and one’s way of relating to the world. In essence, the psychological challenges
    and rewards of FLL are similar in important ways to the adjustment challenges
    faced by sojourners in a foreign environment. Having a positive learning experience
    that promotes growth and wellbeing is largely dependent on the learner’s ability
    to successfully adjust to those demands.


    This argument is informed by adjustment psychology, which seeks to understand
    the psychological responses to stressors and change. Adjustment psychology helps
    us understand how challenging experiences can lead not only to stress but also
    to growth and development (Matsumoto et al. 2006). This relates to a key premise
    of this chapter—that FLL is potentially both stressful and rewarding because it
    is psychologically disruptive—it involves changing deeply embodied habits of mind,
    behavior, and self. This chapter will draw on insights from the psychology of
    cross-cultural adjustment (CCA) to argue that the process of deep learning involved
    with FLL affects us at multiple levels of mind and self (Shaules 2019) and can
    trigger *resistance* (a psychological protective mechanism) and/or *engagement*
    (curiosity and openness to change). Importantly, the psychology of CCA teaches
    us that psychological resistance is a natural (though not desirable) reaction
    to experiencing foreignness (Shaules 2007).


    The adjustment perspective can help us understand ways in which FLL can be experienced
    as transformational. As with adapting to life in a different country, integrating
    foreign elements into the self involves an evolution of experience (Bennett 1993).
    What felt alien, uncomfortable or threatening, becomes understandable and useful—a
    creative extension of the self (Shaules 2007). It may result in us developing
    a new sense of self as a foreign language user (Kramsch 2009). This transformation
    is complex—involving various aspects of the self; intellectual, emotional, somatic—yet
    is experienced holistically and intuitively. One develops a *feeling* for using
    a new language; one has *a-ha moments* of insight about cultural patterns or linguistic
    usage; one feels increasingly *comfortable* using the language, or increasingly
    *oneself* in interactions that previously felt'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'awkward; or most simply, one feels “into” learning the language. Because this
    process is largely intuitive, however, learners may not consciously notice these
    subtle yet complex inner dynamics. Resistance to these adaptive demands may be
    construed simply as “not being motivated” and engagement and growth may be described
    simply as being “fascinated” with the language. Often, learners are not accustomed
    to thinking of FLL in terms of a meaningful personal challenge or the opportunity
    to have new experiences. They may have little sense for what they are getting
    into—how much time, commitment, and frustration is involved, or the potential
    for profound growth, exploration, and change. The adjustment perspective provides
    us with an approach to talking about FLL in these terms.


    # Language Learning as a Transformative Experience


    An important starting point for understanding the stresses and growth potential
    of FLL is transformative learning (TL) theory. It was first articulated in detail
    by Jack Mezirow, an educator who became interested in the shifts in perspective
    experienced by women who chose to re-enter education (Mezirow 2000). Central to
    his work is the idea that when previously held assumptions, beliefs, and values
    are called into question, learners may undergo a paradigmatic shift in perception.
    Mezirow contrasts *informative learning* (changes in what we know) with *transformative
    learning* (changes in how we know). This is often discussed in terms of changes
    to one’s frame of reference—shifts that occur as learners “revise their habits
    of mind” due to a disorienting dilemma and/or process of reflection and questioning.
    These shifts are transformative because learners are not only gaining new knowledge,
    “they are reinterpreting their sense of self in relation to the world” (Cranton
    2016: 302). TL theory has also been influenced by the sociopolitical perspective
    of Paulo Freire, who saw pedagogy in terms of raising consciousness and fighting
    oppression (Freire 2000).


    The TL approach has attracted the attention of foreign language educators. Leaver
    et al. (2021b) explore “the application of transformative principles to the study
    and teaching of world languages” (p. 1) and Leaver (2021) argues that TL is part
    of an emerging paradigm shift in FL education. Traditionally, language learning
    was thought about in terms of *transmission*—an information-based approach focused
    on knowing about language. More recently, this paradigm has shifted to *transaction*
    with an emphasis on skills and the ability to use language in real life. Leaver
    describes *transformation* as the next (emerging) paradigm in which pedagogy “causes
    the learner to change in some way—thinking, behavior,'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'acceptance of the other, values, mindset, and/or emotion” (p. 15). Oxford (2021)
    argues that TL is “shaking the foundations” of foreign language education and
    calls for an integrated view of cognition and emotion that can lead to peak experiences
    of self-actualization. Others have explored TL in FLL in terms of curriculum design
    (Cambell 2021), cultural transformation and intercultural competence (Garza 2021),
    immersion programs (Davidson et al. 2021), learner autonomy (Little 2021), and
    faculty development (Nykos 2021).


    Theorizing about transformative learning often focuses on shifts in our experience
    of the world. That shift can involve different aspects of perception and the self:
    cognitive (e.g., how we conceptualize or think about something), emotional (e.g.,
    how we react to a situation, or construe what we feel), sociopolitical (e.g.,
    how we see issues of social justice), identity (e.g., how we experience or represent
    the self) (Cranton 2016; Leaver et al. 2021a). One common thread to much scholarship
    in TL as it relates to FLL is an emphasis on shifts in learners’ sociopolitical
    perspective or consciousness. This has led to ambitious forms of pedagogy that
    emphasize authentic and unadapted materials, immersive in-country experiences,
    highly individualized programs, textbook-free classrooms, and fluid workspaces
    that lend themselves to scenario-based instruction, real-life experiences, and
    simulations (Leaver et al. 2021a). TL in FL education often treats language learning
    as an opportunity for critical reflection and shifts in learner perceptions. This
    is broadly in line with an interest in global citizenship and using language learning
    to encourage a critical perspective regarding issues of globalization and diversity
    (Byram et al. 2017). In short, the “transformation” that is taking place is often
    assumed to relate to an increased socio-political awareness or consciousness.


    # Transformation as an Embodied Process


    This chapter takes the position that the nature of transformation in FLL goes
    significantly beyond a cognitive reframing. Rather, the embodied nature of language
    means that the learning of a new language has the potential to contribute to a
    complex recalibration of sensorial experience (new ways of thinking, feeling,
    sensing, and perceiving) and adjustments to the experience of self in the world;
    we must change our behavior, interact differently and relate to others in ways
    which take into account foreign norms, values, views of the world. We don’t simply
    add to our behavioral repertoire; we must change deeply integrated habits of mind,
    feeling, behavior, and self. Scholarship in transformative learning often emphasizes
    epistemological breakthroughs—e.g., gaining a higher level of social'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'or political consciousness. The adjustment perspective, on the other hand,
    sees transformation as a long-term disruptive process of ongoing, inner challenge,
    growth, and change. It requires more than a new frame of reference or critical
    perspective. It can be rewarding but is often stressful and can lead to positive,
    negative, and mixed outcomes.


    The adjustment perspective emphasizes the responsibility of educators to help
    learners navigate the stresses and rewards of learning. This is particularly important
    because learners are often only vaguely aware of the transformative nature of
    FLL. As Paul (2014) points out, new experiences change our understanding of the
    world in ways that we cannot predict. In particular, any experience that involves
    adaptive change affects us in unpredictable ways: going back to school later in
    life, moving to a foreign country, having a child, adopting new religious beliefs,
    or taking up a new career. This frequently involves a “transformative choice”
    in which an individual decides to, essentially, take a leap into the unknown.
    He points out that the individual doesn’t know the value of a new experience until
    they’ve had it—their “pre-experience information is dramatically incomplete (p.
    49)”—yet they must still make a decision to move ahead. In the case of FLL, learners
    are being asked to invest themselves heavily in a long-term process of effortful
    change, yet it can be difficult or impossible to imagine what it feels like to
    succeed (how it feels, for example, to be bilingual). Thus, learners may be naïve
    about the time, effort, and adjustment involved and largely unaware of the potential
    for growth and satisfaction.


    Within FLL scholarship more broadly, the transformative elements of the FLL experience
    are talked about in a variety of ways. Often, they are discussed in the context
    of learner identity—ways in which learning a foreign language involves expanding
    one’s sense of self as an FL user (Kramsch 2009; Norton 2013), and of becoming
    an increasingly intercultural or multicultural person (Byram et al. 2017; Risager
    2006). A willingness and desire to embrace a new sense of self is often seen as
    a critical element of language learning motivation (Clarke & Hennig 2013; Dörnyei
    & Ushioda 2009) and is seen as being closely related to learner autonomy (Murray
    et al. 2011). More generally, it’s commonly understood that FLL is experienced
    as successful when it feels meaningful to the learner (Ros i Solé 2016). There
    is also scholarship which focuses specifically on transformative learning experiences
    in the context of FL education (Leaver et al. 2021a). Although much of this scholarship
    does not use the term “transformation” per se, it is widely recognized that FLL
    has a psychological impact and can affect learners at deep levels of the self.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# The Psychology of FLL and Adjustment


    The adjustment perspective builds on recent scholarship that emphasizes the psychology
    of learning (Dörnyei & Ryan 2015). There has been a trend away from seeing FLL
    as primarily a mental process that happens “in one’s head” to a more embodied
    and psychologically complex view. This has included interest in the role of emotion
    in language learning (Dewaele 2019) and on the psychological wellbeing of the
    learner overall (Mercer 2021). It has included an exploration of how to decrease
    learner anxiety (Toyama & Yamazaki 2021) as well as how to increase learner engagement
    (Hiver et al. 2021). There has also been increased interest in applying insights
    from positive psychology to FL education (Dewaele et al. 2019). The field of positive
    psychology originated as a move away from a focus on pathology and toward an attempt
    to understand positive states, such as the experience of flow (Csikszentmihalyi
    1997), as well as happiness and wellbeing (Seligman 2012). Educators have drawn
    on this to explore flow in the FL classroom (Egbert 2003) as well as ways in which
    the psychological insights from positive psychology can be applied to pedagogy
    (Helgesen 2019; Macintyre et al. 2019).


    There has been significant interest in the psychologically challenging aspects
    of FLL, such as learner anxiety (Toyama & Yamazaki 2021), which is seen as the
    apprehension that results from learners not being proficient in the target language
    (Trang et al. 2013). For many individuals, language learning is anxiety inducing
    and this has been shown to inhibit linguistic achievement (Dewaele 2011). Dewaele
    and MacIntyre (2014) found that levels of anxiety remained high at the lower and
    intermediate ability levels, and only dropped off sharply for advanced learners,
    with a corresponding increase in language enjoyment. Older learners also reported
    lower levels of anxiety. This suggests a years-long process of dealing with anxiety
    as part of language learning. These stresses have also been explored from a humanistic
    perspective as well. Earl Stevick, for example, discusses the ways in which language
    learning can lead to feelings of being ignorant, powerless, and constantly evaluated,
    which can threaten a learner’s sense of self-worth (Stevick 1980). Charles Curran
    (1972), a Catholic priest and counseling specialist who worked with the psychologist
    Carl Rogers, developed a counseling-learning approach to FL pedagogy. He saw the
    teacher’s role as that of a counselor, and the student as the psychological client.
    He sought to use counseling techniques and take into account the learner’s feelings
    about the learning experience.


    As Carl Rogers recognized, helping learners manage stress and have positive learning
    experiences require that educators take on something of a'
  merge: -1
  img_proc: true
