- pgno: 79
  md: '# Metaphor Analysis for Understanding “Journeys of Learning”


    Metaphor expressions are commonplace in ordinary language and in educational discourse,
    frequently occurring in classroom teaching and teacher discussions about language
    teaching. In the next sections, we highlight key findings from large metaphor
    datasets obtained from foreign language students and teachers in China. These
    include 3,325 metaphors for “learning” from 1,081 students of English in China,
    mostly given in English, supplemented with 471 metaphors from 258 experienced
    Chinese teachers of English, with 623 metaphors from 303 Chinese students studying
    in Britain, and 283 metaphors from 144 students in Chinese schools. These are
    complemented with findings from analyses of 3,465 metaphors for “teachers” from
    1,781 Chinese students, and 541 metaphors from 258 Chinese teachers. As shown
    below, the metaphor data illustrated here align closely with public ideas about
    learning in China, as part of Chinese cultures of learning.


    The method used to analyze these metaphors extends recognized practices in cognitive
    linguistics but with socio-cultural applications to language pedagogy (see Cortazzi
    & Jin 2020a, b; Jin & Cortazzi 2020). In the metaphor expression “Learning is
    a journey” the hard-to-pin down concept of “learning” (known as the “target”)
    is compared to the familiar experience of “a journey” (the “source” of the comparison).
    We ask students (or sometimes teachers) to complete proforma sentences, like “Learning
    is…,” using their own metaphors to express their own ideas without further prompting.
    In responding, participants have a completely open choice: some say “learning
    is a butterfly” or “a bottomless well.” The participant explanations (known as
    “entailments”) are equally open-ended: there is an enormous choice of appropriate
    reasons for metaphors. Metaphors are concise comparisons, often with different
    interpretations in entailments (“the bottomless well” might be an endless source
    of life-giving water or a dry prison for a person who falls in). Rather than impose
    outside interpretations, we ask participants to explain their own metaphors by
    giving their own reasons. Our metaphor analysis attends closely to patterns of
    the sources and entailments, and provides representative quotes in participant’s
    own words to maintain their own voices.


    Eliciting metaphor data is parallel to getting responses in questionnaires or
    interviews, but often participants making their own metaphors are more involved
    emotionally and imaginatively. Students’ metaphors may be commonplace, conventional,
    or creative and deliberative. However, the metaphors are not arbitrary, nor simply
    decorative devices. Metaphors are held to relate intimately'
