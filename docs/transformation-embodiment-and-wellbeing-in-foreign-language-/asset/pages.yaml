- pgno: 197
  md: 'aspects of language use which could trigger the moral emotion of disgust, such
    as forms of person reference that are perceived to position one person as inferior
    to another (e.g., personal pronouns, honorifics), lack of expected display of
    humility (e.g., through orientation to compliment responses), lack of expected
    display of gratitude (e.g., omission of thanking forms), egregious forms of verbal
    aggression (e.g., harsh criticism), and more.


    It can be noted in Tim’s example above that he experienced Japanese politeness
    practices he witnessed as a moral violation—they were not simply different but
    “wrong.” It can also be seen that it was this felt reaction that made him not
    want to learn. This is in line with research in moral psychology which suggests
    that different other-condemning emotions tend to lead to different behavioral
    responses. Specifically, it is thought that whereas anger results in approach
    behaviors, disgust and contempt tend to result in avoidance (Ford et al. 2018;
    Hutcherson & Gross 2011). Therefore, the emotion of disgust is closely linked
    to psychological resistance and serves to generate avoidance motivation.


    In my own case of pragmatic resistance introduced above, although I did not experience
    Japanese personal pronouns as morally problematic in a general sense, (in hindsight)
    I probably did experience a mild disgust reaction to the pronoun watashi when
    I was personally in a context where I was expected to use it to refer to myself.
    It seemed to have a feminine character that I did not want to express, and this
    was something that surfaced through felt experience rather than conscious understanding
    initially. The Japanese pronoun system became quite an inconvenience, and I admit
    that I did wonder why it needed to be so complex. In essence, my perceptions were
    ethnocentric. Not only were they grounded in my sense of lived experience and
    own subjectivity, they were (again, in hindsight) based on relatively limited
    understanding of the complexity of the Japanese pronoun system and the capacity
    for each pronoun to index a wide range of meanings. In line with the literature,
    it is true that I exercised my agency as a language user, but this was inevitably
    within the framework of relatively limited understanding and was constrained by
    the tendency to impose understandings of language and gender from my own experiences
    as an English speaker growing up in a masculine surfing sub-culture in Australia.
    A further aspect to mention is that this agency was not necessarily accompanied
    by a sense of emotional ease or clarity. Negotiating my own use of Japanese pronouns
    with awareness that I was deviating from pragmatic norms and cultural expectations
    plagued me with a sense of guilt. After all, it was I—the new foreigner in the
    workplace—that was making linguistic decisions that could make others uncomfortable.
    It is in this area that research on moral emotions can again be useful.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'As can be seen listed above, emotions such as shame and guilt are regarded
    as the “self-conscious emotions” that help regulate moral behavior. Although the
    literature on pragmatic resistance tends to emphasize positive aspects of learner
    agency and decision making, it is unlikely that the experience of knowingly going
    against pragmatic norms is without some degree of emotional ambivalence or sense
    of guilt or shame. Particularly in contexts where there is a need to establish
    oneself as a legitimate social actor in a new cultural environment, pragmatic
    decisions can be hugely consequential not only for expressing one’s own subjectivity
    but also for showing respect for local ways of doing things and building interpersonal
    connections (McConachy & Fujino 2022). If learners are motivated to establish
    meaningful social connections through the medium of an L2 yet experience aversion
    to particular communicative practices essential for establishing these connections,
    they are likely to experience conflicting motivational pulls, as well as guilt
    or shame due to not meeting expectations. In dealing with these emotions, individuals
    can either accept the burden of these emotions themselves, or they can displace
    them onto others. As with the experience of disgust, what this means is that if
    individuals experience a sense of shame or guilt due to struggling to interact
    in the way that they want, it can also generate the defensive tendency to denigrate
    the language or speakers of the language. Thus, attempts to avoid experiencing
    self-conscious emotions take the form of “attribution, expectation states, repression,
    displacement, or projection that transmute the initial arousal of an emotion like
    shame into anger, fear, disgust, and hatred” (Turner & Stets 2006: 544). Thus,
    individuals seek to normalize their own reactions as being connected to the natural
    order of things and to distance the other as unusual or problematic.


    Although existing work on pragmatic resistance tends to downplay the possible
    role of ethnocentrism in how language learners perceive and react to L2 pragmatic
    aspects they find problematic, it is important to acknowledge the power of moral
    emotions to generate aversive reactions which may be difficult for learners to
    manage. The discussion above is not intended to deny the important role of agency
    in becoming an L2 speaker but is rather to acknowledge that decisions about how
    to interact are informed by learners’ felt experience of language use and are
    likely to be particularly mediated by moral emotions which can lead to defensive
    or ethnocentric reactions. This means that there is work to be done in the classroom
    to help learners identify and understand the nature of such emotions and how they
    inform their judgments about pragmatic features and practices.'
