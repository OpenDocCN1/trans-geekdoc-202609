  md: 'history, and language quite differently. At the same time, only by leaving
    room for an aesthetic experience and for the expression thereof within the context
    of the class could I begin to ask these questions, that is only by moments of
    “difference, surprise, and unfolding that follow along paths that are not rational
    or linear or obviously critical or political” (Leander & Boldt 2013: 22, 44) and
    that therefore potentially depart from our curricular designs. In the tension
    between these two, transactional literacy offers language-culture educators the
    potential for fostering in students not only *criticals that it does and the different
    feelings and responses it may evoke in others as part of an aesthetic dialogue.


    For scholars and practitioners of language and culture teaching, transactional
    literacy poses two main questions for us to continue to consider:


    +   1. *How do we make space for aesthetic response within the other constraints
    and obligations of our classrooms and curricula?* Here we can think of Ehret’s
    discussion of major and minor keys. If the learning objectives, for example those
    related to narrative designs in the focal case from the German classroom, correspond
    to the major keys, how do we make sure that these are both salient and not in
    danger of silencing those minor keys? Some possible answers are suggested from
    this case study, such as providing opportunities for students to have and then
    to reflect on their responses at various stages and through both spoken activities
    (e.g., in-class discussion, digital social reading) and written activities (e.g.,
    journaling, creative writing) and validating these responses by treating them
    as part of a constellation of possible effects and experiences. Prevalent and
    professional interpretations are a part of this constellation, but if these are
    presented as corrective, this encourages a deferent rather than an aesthetic reading
    stance. This involves openness in how learning activities are structured, which
    leads into the second question.

    +   2. *How do we as educators respond when opportunities for transactional literacy
    arise unexpectedly, in the flow of activity, and in some moments in ways that
    are not directly commensurable with the learning objectives of the course?* Klara’s
    story suggests that this requires above all a willingness to listen. Had my co-teacher
    and I scolded or corrected the students’ feelings of discomfort with the East
    German narratives, we likely would have reduced their contributions to deferent
    readings. By weaving their responses'
