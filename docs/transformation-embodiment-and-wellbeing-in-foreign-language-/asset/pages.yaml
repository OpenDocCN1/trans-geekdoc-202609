- pgno: 159
  md: '*General notes:* In this extract, Constance, the widow of King John''s brother,
    fears for the life of her son, Arthur, who is seen as a rival for the throne.
    Here she is responding to a cardinal who accuses her of uttering madness. The
    first seven lines of this extract provide a relatively simple contrast to Example
    1, so for some groups it could even be cut to just this first section.


    *Reading in a circle:* In a circle, with scripts in their left hands, each person
    reads one word (later one line) to the person on their right, touching their shoulder
    and making eye contact (if appropriate). This emphasizes the urgency of what Constance
    is conveying, as learners collaboratively produce the entire speech. It also helps
    the teacher to overhear anything that is causing difficulties so that it can be
    sensitively addressed between readthroughs, rather than identified as anyone''s
    “mistake.” The starting point and direction can be changed if necessary. After
    several readthroughs, ask what words learners have heard repeated (both “mad”
    and “grief” are prominent) and how they think Constance is using them.


    *Tackling unfamiliar words:* In the circle, or in pairs/smaller groups, learners
    identify unfamiliar words, and see what interpretations they can come up with
    based on context, and their existing linguistic resources. Some words will need
    to be explained (e.g., “babe of clouts” (ragdoll), “canonized”), but learners
    will hopefully work out “thou” (you), “art” (are), “shalt” (shall) and “tis” (it
    is), helping them make more sense of this and other Shakespearean texts. (The
    aim with all of these example activities is for learners to explore and play with
    the language first, with explanations and definitions coming later as necessary,
    in order to avoid them becoming dictionary driven exercises.)


    *Punctuation shift/walking the punctuation:* Learners spread out, reading the
    speech at low volume while walking around the room, turning ninety degrees when
    they reach a comma, and one-hundred-and-eighty degrees for all other punctuation
    marks. At some points they will have full- or multi-line utterances before turning,
    and at others just a single “O.” Doing this, learners physically follow the internal
    logic of Constance’s speech, helping them interpret her arguments about madness
    and grief, and understand her emotions. (Learners should be told that the punctuation
    in modern editions is not Shakespeare’s, but has been mediated by scribes, printers,
    and successive generations of editors. However, with a well-chosen speech—including
    real life political addresses—this can be a very productive activity.)'
