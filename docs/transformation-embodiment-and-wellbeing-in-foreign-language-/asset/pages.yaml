  md: 'tried to illustrate how the strangeness of Shakespeare’s dramatic language—its
    unfamiliarity and difference, but also its rare beauty and power—can be used to
    facilitate interactional, intercultural learning in EFL contexts. Rather than
    teaching linguistic and cultural “facts” designed to be useful in narrowly defined
    communicative contexts, this approach seeks a deeper learning that engages the
    emotions and the intellect, and helps learners reflect on, and develop their understandings
    of other people, cultures, and languages—and themselves. This deeper learning
    can be achieved through combining active approaches (Banks 2014; Gibson 1998;
    RSC 2013; Stredder 2009), which teach Shakespeare as a collaborative, playful,
    physical endeavor, with principles, and practices for intercultural language education
    (Liddicoat & Scarino 2013), through which learners actively engage in multi-layered
    processes of interpreting and negotiating meaning in interaction. Together, these
    approaches place the learner at the center of powerful educational experiences,
    which stimulate affective, physical, and intellectual responses, and address learners’
    identities within, and beyond, the classroom. In the extract from Shakespeare’s
    Henry VIII which opened this chapter, Queen Katherine fears that a “strange tongue”
    will make her seem more alien, and her cause less sympathetic. As a result she
    wants to communicate in English instead, a language she has come to know intimately
    having “lived in” it. In Katherine’s precarious situation this is understandable,
    but we do not have to take the same attitude when it comes to language education.
    An interactional, intercultural approach to Shakespeare can remind us that, just
    as the languages we already live in can be made strange—both unfamiliar and wondrous—we
    can also find excitement and recognition as we start to live in and through languages
    that might seem “foreign” to us, but may not remain so.


