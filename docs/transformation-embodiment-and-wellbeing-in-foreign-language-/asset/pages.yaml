  md: "Liddicoat and Scarino’s five principles for teaching and learning languages\
    \ from an intercultural perspective—*active construction, making connections,\
    \ social interaction, reflection,* and *responsibility*—converge in multiple ways\
    \ with the general principles of active approaches to Shakespeare:\n\n+   - *Active\
    \ construction:* This principle refers to how learners make sense of languages\
    \ and cultures they are encountering, through “purposeful, active engagement in\
    \ interpreting and creating meaning in interaction with others,” in a process\
    \ of “continuous development ass—positive and negative—that learners must recognize,\
    \ before reflecting upon why they have reacted in a particular way. Emotional\
    \ responses are also integral to learning through play in Winston’s (2015) rationale,\
    \ as well as to how educational encounters become significant experiences, distinct\
    \ from the unreflective character of everyday life.\n+   \n+   - *Responsibility:*\
    \ Just as a moral dimension is identifiable in active approaches to Shakespeare\
    \ that view the company or ensemble as modelling a way of being in society, intercultural\
    \ language education is seen as helping"
  merge: -1
  img_proc: true
- pgno: 153
  md: 'to model an ethical way of “being in diversity” (Liddicoat 2013). In keeping
    with its learner-centered principles, this places a responsibility on learners
    to develop and act with intercultural sensitivity and understanding well beyond
    the classroom.


    These five principles are put into practice through a series of interconnected
    processes: noticing, comparing, reflecting, and interacting (Liddicoat & Scarino
    2013). Elements of these will be apparent in the exercises illustrated below,
    but a key point to reiterate here is the role that interpretation plays in this
    view of intercultural language education, and of communication more widely (Crutchfield
    & Schewe 2017). Drawing on the work of Wittgenstein (1953), Liddicoat and Scarino
    (2013: 48) argue that learning and communication are language games that fundamentally
    rely on interpretation, and in which “language is integrated with action in order
    to achieve local aims.” The same word(s) can be used to do very different things
    by different people in different contexts—something that is crucial for language
    learners to be alert to, but that is not always adequately addressed by the narrowly
    prescriptive linguistic formulae found in certain types of EFL teaching and materials.
    The emphasis on making, interpreting, and negotiating meaning as being grounded
    in the social world finds another expression in McConachy’s (2018) application
    of an intercultural perspective to the exploration of pragmatics in foreign language
    education. He stresses that a key part of a learner’s development of an intercultural
    perspective on language use is their “ability to view language use as a form of
    social action and reflect on the ways in which meanings and impressions are constructed
    and negotiated among speakers” (2018: 57).


    One method McConachy proposes for achieving this is an activity he calls contextual
    analysis, which involves learners collaboratively analysing constructed conversational
    dialogues, considering the speakers’ linguistic choices, potential sociocultural
    influences on these choices, and the consequences of these choices in their interactional
    context. As such, this activity exemplifies Liddicoat and Scarino’s (2013) practices
    for intercultural learning—noticing, comparing, reflecting, and interacting—and
    their five principles for teaching and learning languages from an intercultural
    perspective. Consequently, it also exemplifies how intercultural language education
    can involve a form of deep learning that accommodates identities and understandings
    beyond the classroom, as learners actively engage in rich, multi-layered processes
    of meaning-making. In work on the uses of performance-based approaches in intercultural
    education, this learner-centered and deeply interpretive perspective is further
    enhanced'
