  md: '# A Holistic Model of Metaphors


    Figure 3.1 provides an overall visual representation of a holistic model of learning
    journeys based on the evidence presented, with many other metaphors in datasets.
    This integrates participants’ ideas of the purposes, destinations, and characteristics
    of the journey, together with the qualities students need, and the emotions experienced.
    As can be seen in Figure 3.1, participants view learning as not only being cognitive,
    social, and emotional, but also as having moral and aesthetic features. Viewed
    collectively, these represent a holistic view of learning which engages the whole
    person (see also Chapter 4, this volume).


    The holistic roles of teachers in these journeys emerge strongly. In addition
    to being “a friend” concerned with learner “wellbeing” (as above), a teacher is
    “a guide” in 137 metaphors. Cognitively, one teacher explains: “a teacher is a
    guide in the ocean of knowledge, guiding us in the future direction, taking us
    to the light, cultivating the professions and explaining problems.” Another teacher
    adds a moral function of modelling learning and exemplifying knowledge, “teachers
    guide our methods of learning, tireless, giving us basic knowledge, teaching skills,
    in everyday life they should be a model using their own behaviour to motivate
    all of us, therefore they should have high ability, knowledge and skills is required
    in their language teaching profession and having a high moral standard is required,
    too.” Other teachers elaborate; “A teacher is a navigator of life, when we feel
    confused they will lead us to the right direction without forgetting to protect
    us”; “as a tourist guide, this is an important but difficult role especially for
    an English teacher, a guide taking us to the destination, a runner leading us,
    to pass on values and guide us professionally towards an honourable future, telling
    us how to be upright people.” Some students in such “tour guide” metaphors clarify
    socio-cultural and aesthetic functions: “Language teachers are tour guides: they
    take us to many beautiful views in different countries and cultures”; “they teach
    students much about society and how to survive”; “they lead students to enjoy
    the beauty of knowledge … to enjoy the beautiful scenery of life”; “they take
    us to the beauty spots and leave it to ourselves to feel beauty.” As guides, some
    language teachers seem explicit about cultures of learning; they teach students
    how to learn, “they always enlighten their students to think and learn; as a navigator
    they guide us to find the right path of learning despite the mass of knowledge;
    they can conduct us to find our own way of learning.” In combinations of such
    meta-functions (see Figure 3.2), a whole-person pedagogy is implied: “A language
    teacher is a navigator: they guide us to the correct road and to happiness in
    life, they not only help us in our studies but teach us how to be a well-educated
    person as well.”'
