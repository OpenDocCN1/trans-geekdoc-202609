- pgno: 137
  md: 'making CL-grounded embodied learning activities a deep approach to learning.
    Such activities have the potential to make grammar teaching and learning more
    meaningful, engaging, and rewarding as they can effectively help learners acquire
    the target linguistic constructions. While this chapter focuses on causative constructions,
    applied cognitive linguists have analyzed many other English grammatical constructions,
    offering semantic accounts that ELT professionals would find insightful (see Tyler
    et al. 2010). Further, these insightful accounts could be delivered to students
    in the form of embodied learning activities. A main challenge is to create embodied
    learning activities that fully retain the underlying meanings and functions identified
    by the theoretical models and are practicable in the L2 classroom. One way to
    overcome this challenge is to develop an understanding of the target meanings,
    identify gestures, bodily movements, and visuals that best represent the target
    grammatical concepts, turn them into learning activities, and test them out in
    the classroom. This chapter has explored such a procedure and thus represents
    a progressive approach markedly different from those which rely on verbal memorization
    of abstract linguistic rules.


    To be sure, our view of language and language learning guides our pedagogical
    practices. Given the increasing evidence that language reflects humans’ experience
    of their socio-physical surroundings and that bodily engagement is useful for
    learning, particularly language learning, grammar pedagogy should strive toward
    a more embodied view that is conducive to deeper, more meaningful and intuitive
    forms of learning.


