- pgno: 33
  md: '# Mezirow''s Approach to Transformative Learning


    Jack Mezirow’s cognitive-analytic approach unintentionally, intrinsically supports
    Socrates’ statement, “The unexamined life is not worth living,” though this was
    not a maxim used by Mezirow. Individual transformative learning à la Mezirow involves
    numerous rational phases, with the initial phase always being a disorienting dilemma,
    a real problem or crisis in the life of a person that eventually, through phases,
    causes the rethinking of the person’s unexamined meaning schemes or beliefs. This
    transformation aids the individual in gradually generating new perspectives that
    have been rationally, analytically, closely examined as a means of guiding actions.
    These transformed beliefs might not be the same for everyone, but they are to
    be consciously chosen, meaningful, and useful for shaping actions in the person’s
    context.


    At first, Mezirow described the phases as random and nonsequential, with phase-skipping
    possible by the individual (1978) and with the aim of transforming individuals’
    unexamined perspectives, as noted above. In the next decade, Mezirow (1981) settled
    on his favored approach, which included ten sequential, required phases, still
    involving constant rational analysis.


    These are the ten phases in the perspective transformation as Mezirow delineated
    them in 1981: experiencing a disorienting dilemma or crisis, examining one’s own
    assumptions, critically assessing the assumptions, recognizing dissatisfaction
    and its sources, exploring alternatives (i.e., new role options), planning a course
    of action, acquiring new knowledge, trying out new roles, building competence,
    and integrating the new perspective into one’s life (Baumgartner 2012). As stated
    by Baumgartner, Mezirow’s approach was criticized because it (1) was overly rational,
    ignoring emotions (except for anxiety) and intuition; (2) portrayed a unitary
    identity rather than recognizing an individual’s multiple identities; and (3)
    failed to critically recognize an individual’s social context, including ideologies,
    power, race, gender, and class. His response (Mezirow 2006) was to continue to
    ignore emotions and intuitions, though he stated that they might be considered;
    and to ignore social context as being political, though he said his transformative
    phases could become a basis for taking social action. In other words, Mezirow
    made no discernable, criticism-related changes in his approach. Furthermore, as
    noted by Oxford (2021), Mezirow’s approach was clearly oriented to individualist
    cultures supporting personal autonomy, and the approach ignored Freire’s (1970/2018)
    concept of collectivist cultures’ group-based, liberatory autonomy.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'I used Mezirow’s model in two master’s degree courses for EFL/ESL teacher education
    (see Oxford 2021). In these classes, culture was not treated as an add-on; I encouraged
    the future teachers to see language and culture as integrated, though I did not
    know the terms *linguaculture* or *deep linguaculture learning*. One of the master’s
    courses was teaching EFL/ESL literacy, i.e., reading and writing but with aural/oral
    involvement. The other master’s class focused on how to teach adult EFL/ESL learners.
    Both classes appreciated the disorienting dilemma in Mezirow’s approach, because
    all students had experienced prior crises that they wanted to discuss. However,
    beyond the disorienting dilemma, only a subset of these future teachers found
    Mezirow’s heavily rational, analytic, sequential approach to be overwhelmingly
    attractive. In my master’s classes, this subset of “concrete-sequential” learners
    had to combine some of the model’s phases because there was insufficient time
    to go slowly through all ten phases. A few highly enthusiastic members of this
    subset independently decided to interview current or former EFL/ESL adult learners
    from different countries about those learners’ crisis-induced transformations.


    # Dirkx’s Approach to Transformative Learning


    The intuitive students in the same EFL/ESL teacher education classes preferred
    non-analytical, less sequential learning, so they were thrilled with Dirkx’s emotional-integrative
    (imaginal) approach. Dirkx (2012) was influenced by Jung’s (1957–79) depth psychology,
    which emphasizes relational, emotional, and largely unconscious individual issues
    and interpersonal, social interactions. Jung’s psychology and hence Dirkx’s transformative
    approach emphasize the personal unconscious and the transpersonal (collective)
    unconscious, which can both become conscious at the stage of individuation. Individuation,
    which not everyone achieves, involves becoming a transformed, integrated, unique
    person who can understand and reflect on personal, social, cultural, and universal
    memories and myths.


    Dirkx’s approach stresses transformative, “emotional soul work,” because to him
    emotions are the “messengers of the soul.” His approach encompasses imaginatively
    elaborating the meaning of emotions in one’s life, not using reason to dissect
    emotions (Dirkx 2001; see also the discussion among Dirkx, Mezirow, and Cranton).
    He contended that the soul can be awakened, nurtured, and expressed in the classroom
    and even in cooperative online settings. Is the process ineffable and indescribable?
    No, because the subject matter and readings of assigned texts can stimulate dynamic
    discussion and engagement that brings submerged images, symbols, and emotions
    into the light. After such a discussion, the facilitator or'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'teacher helps the students to debrief in four steps. The first step asks individual
    students to consider what was emotionally meaningful in the discussion and why;
    then to notice and describe an emotion-filled image that arose from the unconscious
    during the discussion; and next to identify the context, people, and relationships
    in the image. The second step is associating current experiences, especially in
    the group discussion, with similar past experiences when the image arose, thus
    leading to understanding the private myth of the individual. The third step is
    using popular culture, literature, and mythology to amplify the meaning of the
    original image, thus expanding the image from the personal to the transpersonal,
    collective myth. Finally, the fourth step engages the student in personifying
    the myth-bearing mage and then interacting with it in a two-way communication,
    which can be a written dialogue or an “empty-chair” roleplay between the person
    and the image to uncover the image’s collective (including cultural) meaning.
    In sum, Dirkx’s emotional-integrative (imaginal), depth-psychology approach uses
    emotion and imagery to move from the personal to the collective/cultural. Like
    Mezirow’s approach, Dirkx’s approach does not embody a critical theory of society’s
    current ills, but unlike Mezirow’s model, Dirkx’s smoothly leads individuals from
    a personal focus into the broad and deep cultural context. This growth occurs
    in small, supportive groups.


    The majestic psychospirituality of Dirkx’s “emotional soul work” has a major association
    with deep linguaculture learning through the life and writings of Earl Stevick
    (1923–2013), whose work is primarily called holistic-humanistic (see later). Stevick
    (1990) wrote about the “sacramental” teaching of language and culture and the
    “sacred space” (classrooms) where it occurs. He was a well-known leader in the
    international humanistic language teaching movement. He worked for many years
    for the US Foreign Service Institute, part of the Department of State, where he
    wrote curricula for less commonly taught languages and helped ensure that diplomats
    would be as proficient as possible in the language and culture (now we would call
    it the linguaculture) of their next posting before arriving there. Among his many
    language teaching books are Humanism in Language Teaching (1990), Teaching Languages:
    A Way and Ways (1982), and Memory, Meaning and Method: A View of Language Teaching
    (1996). The confluence of emotion and cognition and of social relations and individualism
    made Stevick’s examples of transformative teaching extremely powerful. Praise
    for him as a deeply wise language-and-culture teacher is abundant (see, e.g.,
    Arnold & Murphey 2013). Aside from all his normal work, Stevick took time to mentor
    budding scholars like me. I benefitted from his gracious, detailed feedback on
    my first book (Oxford 1990).'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Other concepts and processes that could correlate well with Dirkx’s approach
    are mindful, empathic listening (Oxford 2020); deep education and radical amazement
    in Creation Spirituality (Oxford 2016), and pedagogy of the heart (Culham et al.
    2019). Merriam and Bierema (2014) explained that education can include connections
    to self, to others, to the world, and to a higher being, a statement that Dirkx
    and Stevick would have approved of.


    # Vygotsky’s Link to Transformative Learning


    Lev Vygotsky (1978) considered himself a historical-cultural theorist. Others
    saw him as a child development specialist. Still others crowned him (long after
    his tragic death at age 37) as the first of the sociocultural theorists. For this
    chapter, Vygotsky can be considered a theorist of transformative-mediated learning.
    Vygotsky’s learning model began with his research on child development, but it
    is relevant to transformative learning in all age groups. This model involves
    “mediated learning” with a more capable (more skilled, more knowledgeable) person
    as the mediator (guide), who strongly regulates or guides the learner at first,
    gradually releases that control when the learner needs less, and finally cedes
    control entirely when the learner is ready to self-regulate. Mediated learning
    does not involve smoothly shifting from one stage to another; instead, it involves
    several significant transformations or transitions from stage to stage across
    what Vygotsky (1978) called the “zone of proximal development” (ZPD). The ZPD
    is the metaphorical range of learning space that the individual can transit, first
    with assistance and later without it. The ZPD defines those functions that have
    not yet matured but are in the process of maturation.


    In addition to the ZPD metaphor, Vygotsky used at least two other important metaphors
    to describe the developmental transformation process. One of these was the speech
    metaphor. The learner starts out being greatly dependent on the more capable person
    as mediator, who guides the learner through “social speech” interactions. In the
    next stage, the learner becomes somewhat more independent by using egocentric
    speech (oral self-guiding), while still partially needing the mediator. Transformation
    becomes complete by the third stage, when the learner self-regulates by means
    of the inner voice (private speech). Vygotsky also used a horticultural metaphor
    for the learner’s transformation (Vygotsky 1978). In the first stage, the mediator-guide
    sows the seeds of the learner’s development, but the seeds are hidden in the ground.
    Though transformation has begun, nothing yet can be seen. Transformation becomes
    evident in the second stage, when the “buds” and “flowers” show themselves but
    have not matured. At the third stage, the plant has matured so that the “fruits
    of development” are obvious.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'These metaphors of learning, growth, and development are relevant to linguaculture
    learning. Surface learning occurs when the mediator-guide is in charge. At that
    point, language and culture probably seem very different from each other, and
    the learner is busy trying to do what the mediator, or teacher, wants the learner
    to do. The mediator helps the learner become more self-reliant, and eventually
    the learner, in Vygotsky’s metaphors, becomes self-regulating, mature, and fruitful.
    When I compare Vygotsky’s developmental, transformative learning model with Shaules’
    developmental, transformational, “surface-to-deep learning” linguaculture model,
    I see that the Vygotsky’s learner at the self-regulating stage has much in common
    with Shaules’ learner, in whom the linguaculture is implicitly, intuitively present
    and embodied.


    Vygotsky’s model describes the transformation of individuals through social mediation.
    His concepts of mediation (by a person or by books and other cultural “signs”
    and tools) have been socially, culturally, and educationally important; unfortunately,
    he did not live to see this happen. Thus, began the mediated learning movement,
    in both face-to-face and digital learning. Doolittle (1997) described Vygotsky’s
    idea of the ZPD, in which the learner is guided by another until able to become
    self-regulated, as a foundation for cooperative learning. Vygotsky’s writings
    became the basis for much subsequent work in sociocultural learning theories (e.g.,
    John-Steiner & Mahn 1996; Kozulin 2002), and has had wide resonance in a range
    of disciplines. As Newman (2021: 4) explains:


    > The work of Vygotsky is widely used in teacher education and other education-related
    literature, in discussion of sociocultural perspectives, and in relation to themes
    such as second language acquisition, the teaching of mathematics, and approaches
    to teaching and learning.


    This was true at the universities where I taught. Vygotsky became a transformative
    folk hero to many future language teachers over my 35 years as a teacher educator.
    He was more popular than most other theorists in my classes in SLA and methods
    for language teaching. Although some of his very advanced theories were difficult,
    many of his ideas had profound effects. Future teachers (my students) readily
    grasped the ZPD construct and the transformation from social speech to private/inner
    speech (self-regulation). They were pleased to know that scaffolding, the practice
    of giving just the right amount and right kind of assistance and removing it bit
    by bit as the learner no longer needed it, was very similar to what Vygotsky described
    as the task of the “more capable other” (the teacher or mediator).'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# **More Transformative Sources**


    Jones and Richards’ (2016) book, *Creativity in Language Teaching*, explained
    that creativity offers a transformation in agency (a person’s will, intent, and
    capacity to achieve specific, socially situated goals). The authors argued that
    creativity is not only transformative but is also central for language learning
    and teaching; that it is a potential of everyone, not just exceptional people;
    that it occurs in innovative use of language in regular discourse in authentic
    situations, not just in cleverness in artificial settings; and that it requires
    social interconnections through collaboration and “learning conversation.” The
    book by Jones and Rivers depicted transformational creativity in language skills,
    in voices from the classroom, in multicultural texts, in technology use for language
    teaching, in narrative inquiry for language education, and as resistance. The
    anthology titled *Transformative Eco-Education for Human and Planetary Survival*
    (Oxford & Lin 2011) contains a wide range of transformative learning activities
    adaptable to language education.


    # **Holistic-Experiential Learning and Holistic-Humanistic Learning**


    Holistic learning focuses on the whole person: cognitive, emotional, spiritual,
    physical, and social. Balance, peace, and positivity are products of holistic
    learning. It is participatory, creative, reflective, intuitive, spontaneous, and
    frequently artful (music, play, ritual). Holistic learning is described as the
    curriculum of character (Leggo 2018); the pedagogy of love and cultivation of
    the ability of the heart (Culham et al. 2019); and the combination of deep reflection
    and inner work, personally meaningful experience, and conscious concern for love,
    caring, peace, and justice (Miller et al. 2019). As Maslow (1971) described, holistic
    learning also offers the possibility of “peak experiences,” resulting in a “cognition
    of being… [and] technology of happiness,” as well as insight, transcendence, and
    self-actualization (p. 169).


    # *John Dewey*


    *Experience and Education*, John Dewey’s 1938 book, is an excellent explanation
    of what he, as a philosopher and educator, meant by deep, embodied, experiential
    learning. To my knowledge, he did not use the term “deep learning,” although his
    writings exhibit something very much like deep learning. Dewey’s importance is
    highlighted in Shaules’ (2019) book on deep learning.


    For Dewey, human beings learn through a transformative approach that is experiential,
    hands-on, holistic, experimental (not necessarily in the laboratory'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'sense), and life-relevant. In his view, experience refers to the organism’s
    embodied, physical, and mental self in meaningful interchanges with its physical
    and social environment. In Dewey’s influential, experiential approach, students
    reflect on their experiences within self-and-environment interactions in order
    to grow and learn. Thus, experiential learning also entails an element of contemplative-reflective
    learning. Having a merely unreflective experience does not foster learning, in
    Dewey’s view. I add that experience without contemplation-reflection can only
    shallowly aid remembering of something experienced and is not an aid to new cognition.
    Moreover, I contend that experience *sans* contemplation-reflection can bring
    emotions like foreboding, anger, sorrow, guilt, shame, pleasure, joy, contentment,
    excitement, or curiosity, but only a shadowy feeling or weak remnant of the experience
    stays.


    Although Dewey is not famous for comments on emotion and reflection, two comments
    are very enlightening. According to Dewey (1933: 100, quoted by Felten et al.
    2006), structured reflection helps learning arise from the chaos of experience:
    “The function of reflection is to bring about a new situation in which the difficulty
    is resolved, the confusion cleared away, the trouble smoothed out, and the question
    it puts is answered.” Dewey (1934: 42 in Felten et al.) also said, “Emotion is
    the moving and cementing force. It selects what is congruous and dyes what it
    selected with its colour, thereby giving qualitative unity to material externally
    disparate and dissimilar.” More information about Dewey’s ideas concerning emotion
    is found in Solymosi and Shook (2014).


    For Dewey, not only is reflection needed, but also learners need to feel ownership
    and a sense of control over circumstances and situations of learning. He felt
    that project work is an ideal for promoting learning goals, as well as goals of
    independent thinking and experimentation. In his educational philosophy, teachers
    and students would learn together experientially on projects. Project-based learning
    was Dewey’s favorite form of holistic-experiential learning. He felt that projects
    should involve active exploration of real-world challenges and problems over significant
    periods, leading to deep knowledge, independent thinking, experimentation, and
    good works for communities and society. Beckett and Slater’s (2020) edited volume
    showed that project-based language learning (PBLL) positively influenced language
    learning and development, discourse, engagement, collaborative learning skills,
    and many other aspects of language learning. The book includes PBLL case studies
    from many contexts and world regions. For instance, the book indicates that PBLL
    was successful in relation to translanguaging, advanced language learning, co-learning
    of linguistics, and technology-enhanced PBLL.'
