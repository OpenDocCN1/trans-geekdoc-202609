- pgno: 58
  md: 'These demands are psychologically challenging because they involve adjusting
    habits of mind and self in ways that can make us feel uncomfortable, vulnerable,
    and incompetent. We must, in effect, construct a foreign language self even as
    we are stripped of our normal socio-communicative abilities. From this perspective,
    the FL classroom is, in psychologically important ways, the equivalent of spending
    time in a foreign land. Being deprived of the familiar patterns of communication
    and self that we normally rely on without thinking, and facing the need to internalize
    new ones, creates adaptive stresses. In short, it’s not necessary to go abroad
    to experience a process of psychological adjustment—the psychologically demanding
    nature of FLL triggers it as well.


    Thinking about FLL in terms of adjustment highlights the foreignness inherent
    in language learning. While the linguistic and cultural distance between languages
    can vary greatly, learning a new language is—to a greater or lesser degree—a foreign
    experience. While the term foreign may sound pejorative, Shaules (2017) argues
    that foreignness—referring to something that interferes with or is at odds with
    normal functioning—is precisely what learners must deal with as they make the
    psychological adjustments necessary to learn a new language. They must experiment
    with the unfamiliar—produce new sounds, search for words, arrange their thoughts
    in new ways, make countless mistakes and suffer through awkward interactions.
    This perspective is consistent with the notion of linguaculture, the idea that
    language and culture are part of a larger whole (Risager 2015), and thus using
    a new language requires navigating unfamiliar cultural terrain as well. A new
    language is not simply a value-neutral code or information system, it is experienced
    as something foreign because it is at odds with the usual habits of mind and self.
    In line with this, Gardner (2010) argues that learning a foreign language is unlike
    any other subject in school because it involves integrating elements of another
    cultural community into one’s repertoire of the self—it is a foreign experience.


    For some people, the words “foreign language learning” are associated mostly with
    a mental experience of linguistic processing—the ability to decipher and internalize
    a linguistic code. Those who (implicitly or explicitly) accept this view are more
    likely to see the outcomes of learning in instrumental terms. It may be harder
    to see that FLL has consequences far beyond the manipulation of linguistic patterns—it
    involves the integrating of a new “system of mind” and developing linguistic and
    social multi-competences, such as the ability to shift between different styles
    of communication or cultural worldviews (Cook & Li 2016). The psychological impact
    of multilingualism has also been associated'
