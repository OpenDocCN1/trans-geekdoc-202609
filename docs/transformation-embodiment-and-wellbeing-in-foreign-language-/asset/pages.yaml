    level German language-culture class provides an example of how transactional reading
    can play out in an instructed language class in unexpected ways. Whereas many
    of the contemporary studies of affect and literacy are based on ethnographic data,
    often from outside of the classroom, I will rely on Klara’s course work, my notes,
