    pragmatic decision making, and many instances of pragmatic resistance, are tied
    up with individuals’ intuitive, moralized reactions to difference and the need
    to “defend” one’s existing ways of to actions which are perceived to be associated
    with harm, unfairness, and disloyalty (Chapman 2018). In this sense, depending
    on the language and culture, there are many
