  md: "the notion of the “anti-ou\uFEFFght-to self” in which the learner “is motivated\
    \ by the opposite of what the external pressures demand” which reflects a *Don’t\
    \ tell me what to do!* attitude toward learning (Thompson 2017: 39).\n\nThere\
    \ is, of course, also a positive face of Janus. Foreignness can also spark interest\
    \ and curiosity—as when we are stimulated or fascinated by foreign experiences,\
    \ or get “hooked” on learning a new language. For some, this process of adjustment\
    \ will feel stimulating and eye-opening—it will lead to more active *engagement*\
    \ with learning (Hiver et al. 2021; Mercer & Dörnyei 2020). Engagement is associated\
    \ with approach motivation (Rutherford & Lindell 2011), a seeking of something\
    \ that is perceived to have value. It can also be seen as a form of integrative\
    \ motivation (Gardner 2010), which is associated with a desire to take into the\
    \ self the characteristics of a foreign language. From the adjustment perspective,\
    \ engagement is related to cross-cultural adaptation, when a sojourner modifies\
    \ aspects of the self to be in better alignment with the cultural patterns of\
    \ a foreign environment (Shaules 2007). In everyday terms, we might simply say\
    \ that a learner is “into,” interested in, or motivated by the language they are\
    \ learning.\n\nThe dual nature of engagement and resistance can be represented\
    \ as in Figure 2.1. The psychological demands of FLL (its adaptive demands) are\
    \ disruptive and provoke resistance and/or engagement as the learner adjusts to\
    \ these demands. This reflects the idea that FLL is fundamentally not a psychologically\
    \ neutral process and implies that negative reactions to the demands of learning\
    \ are to be expected. This represents an important assumption, since learners\
    \ may feel that they *should* always be motivated to study and learn, even though\
    \ it’s difficult or impossible to always stay engaged. The adjustment view normalizes\n\
    \n![](img/5148f48c5f0c46f3e824e5080bd81aae_60_0.png)\n\n**Figure 2.1** The Two\
    \ Faces of Janus—Resistance and Engagement"
