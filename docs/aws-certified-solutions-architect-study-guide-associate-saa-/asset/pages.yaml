- pgno: 130
  md: '# Chapter 5 • Databases


    # TABLE 5.3 The Employees table


    | Employee ID (Number) | Department (String) | Last Name (String) | First Name
    (String) | Birthdate (Date) |

    |---|---|---|---|--|

    | 101 | 10 | Smith | Charlotte | 7-16-87 |

    | 102 | 20 | Colson | Thomas | 7-4-00 |


    In this relationship, the Departments table is the *parent table*, and the Employees
    table is the *child table*. Each value in the Department column in the Employees
    table refers to the Department ID in the Departments table. Notice that the data
    type for the Department column is still a string. Although you could change the
    data type to a number, it''s not necessary. The Department ID in the Departments
    table is called the *primary key*, and must be unique in the table so that it
    can uniquely identify a row. The Employees table refers to this as a *foreign
    key*.


    You must define primary and foreign keys so that the database knows how columns
    in different tables are related. The database will enforce *foreign key constraints*
    to ensure that when a child table refers to a foreign key, it also exists in the
    parent.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_130_0.png)


    When it comes to databases, the terminology is inconsistent. You may find that
    different database implementations use different terms to describe the same concept.


    # Structured Query Language


    You use the *Structured Query Language* (SQL) with relational databases to store
    and query data and perform database maintenance tasks. For this reason, relational
    databases are often called SQL databases.


    SQL statements differ slightly depending on the specific relational database management
    system (RDBMS) you''re using. As an AWS architect, you don''t need to know SQL,
    as all programming languages have libraries that construct SQL statements and
    interact with the database. But when dealing with AWS-managed database offerings,
    you do need to understand the concepts behind a few common SQL terms.


    # Querying Data


    The SELECT statement is used to query data from a SQL database. It allows you
    to query based on the value in any column, as well as specify the specific columns
    you want the database to return. Thanks to the predictable structure of tables
    and the enforcement of foreign key constraints, you can use a JOIN clause with
    a SELECT statement to join data from different tables.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Storing Data


    The INSERT statement allows you to insert data directly into a table. If you need
    to load a large number of records, you can use the COPY command to copy data from
    a properly-formatted file into the table you specify.


    # Online Transaction Processing vs. Online Analytic Processing


    Depending on its configuration, a relational database can fall into one of two
    categories: online transaction processing (OLTP) or online analytic processing
    (OLAP).


    # OLTP


    OLTP databases are suited to applications that read and write data frequently,
    on the order of multiple times per second. They are optimized for fast queries,
    and those queries need to be regular and predictable. Depending on the size of
    the database and its performance requirements, OLTP database may have intense
    memory requirements so that it can store frequently accessed portions of tables
    in memory for quick access. Generally, a single server with ample memory and compute
    power handles all writes to an OLTP database. An OLTP database would be a good
    candidate for backing an online ordering system that processes hundreds of orders
    a minute.


    # OLAP


    OLAP databases are optimized for complex queries against large data sets. As a
    result, OLAP databases tend to have heavy compute and storage requirements. In
    data warehousing applications, it''s common to aggregate multiple OLTP databases
    into a single OLAP database. For example, in an OLTP database for an employee
    management system, employee data may be spread across multiple tables. At regular
    intervals, a data warehouse would aggregate these tables into a single table in
    an OLAP database. This makes it easier to write queries against the data and reduces
    the amount of time to process such a query. With a large OLAP database, it''s
    common for multiple database servers to share the computational load of complex
    queries. In a process partitioning, each server gets a portion of the database
    for which it is responsible.


    # Amazon Relational Database Service


    The Amazon Relational Database Service (RDS) is a managed database service that
    lets you run relational databases in the cloud. RDS takes care of setting up the
    database system, performing backups, ensuring high availability, and patching
    the database software and the underlying operating system. RDS also makes it easy
    to recover from database failures, restore data, and scale your databases to achieve
    the level of performing and availability your application requires.'
  merge: -1
  img_proc: true
