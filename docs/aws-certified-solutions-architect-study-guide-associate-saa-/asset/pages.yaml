  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_156_0.png)


    # Introduction


    Your AWS resources are probably your company''s crown jewels, so you definitely
    don''t want to leave them unprotected. But you also can''t lock them down so tightly
    that even your admins and customers can''t get in.


    Finding the perfect balance is possible. Getting there will have a lot to do with
    the way you authenticate user requests to confirm they''re legitimate and then
    authorize no less than the exact access they''ll need. On AWS, authentication
    and authorization are primarily handled by Identity and Access Management (IAM).


    In this chapter, you''re going to learn about IAM identities—which are sometimes
    described as principals. An identity represents an AWS user or a role. Roles are
    identities that can be temporarily assigned to an application, service, user,
    or group.


    Identities can also be federated. That is, users or applications without AWS accounts
    can be authenticated and given temporary access to AWS resources using an external
    service such as Kerberos, Microsoft Active Directory, or the Lightweight Directory
    Access Protocol (LDAP).


    Identities are controlled by attaching policies that precisely define the way
    they''ll be to interact with all the resources in your AWS account. You can attach
    policies to either principals (identity-based policies) or resources (resource-based
    policies). This chapter will describe the following:


    +   * Creating policies to closely control how your principals can do on your
    account

    * Managing the various kinds of keys or tokens used by principals to prove their
    identities

    * Providing single-solutions for integrating IAM with external providers using
    identity federation

    * Implementing best practices for configuring accounts and roles to properly secure
    your resources'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# IAM Identities


    The identity that comes with every new AWS account is the root user. By default,
    root has full rights over all the services and resources associated with your
    account. This makes sense since there would otherwise be no way for you to get
    things done with the services On the other hand, having everything in the hands
    of this user makes root an attractive target for hackers: they only need to get
    the root password or access keys to compromise the entire account.


    To reduce your exposure to this vulnerability, AWS suggests that you highly protect
    your root account and delegate specific powers for day-to-day operations to other
    users. Figure 6.1 shows the checklist of recommended actions in the Security Status
    section of your account''s IAM home page.


    **FIGURE 6.1** Security Status checklist from the IAM page of an AWS account


    | IAM Resources | Roles: 1 |

    | --- | --- |

    | Users: 0 | Identity Providers: 0 |

    | Groups: 0 | |

    | Customer Managed Policies: 0 | |

    | Security Status | |

    | 0 out of 5 complete |

    | ⚠️ Delete your root access keys |

    | ⚠️ Activate MFA on your root account |

    | ⚠️ Create individual IAM users |

    | ⚠️ Use groups to assign permissions |

    | ⚠️ Apply an IAM password policy |


    Understanding how—and why—you can satisfy these recommendations is an important
    first step for successfully managing your AWS account.


    # IAM Policies


    Your first job should be understand how policies are used to control the behavior
    of IAM identities. An IAM policy is a document that identifies one or more actions
    as they relate to one or more AWS resources. Finally, the policy document determines
    the effect permitted by the action on the resource. The value of an effect will
    be either Allow or Deny.


    A policy might, for instance, allow (the) the creation of buckets (the action)
    within S3 (the resource). Of course, the way resources and actions are defined
    will vary according to the particular service you''re working with.'
  merge: -1
