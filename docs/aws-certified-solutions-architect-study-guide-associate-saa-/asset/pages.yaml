    # # Introduction


    By this point in the book, you should have a pretty good feel for the way the
    basic AWS services are used to deploy and manage your applications. And, from
    reading Chapter 9, “The Reliability Pillar,” you should also now understand how
    to respond to failures.


    This chapter will teach you the design principles that''ll help you squeeze the
    most performance possible out of your cloud resources. It''s not enough to just
    make sure everything is running: getting full value from AWS requires that you
    leverage the features that set the cloud apart from legacy environments. For the
    purposes of this chapter, those will include the ability to:


    +   - Quickly launch test environments to experiment and measure performance.

    - Quickly and automatically scale operations up and down to meet changing demand.

    - Abstract your operations by using managed services to automate infrastructure
    provisioning.

    - Automate the use of container and serverless technologies in response to external
    events.

    - Automate the deployment of complex, full-stack infrastructure through scripts
    and templates.

    - Understand and optimize operations based on the smart consumption of system
    data.


    # # Optimizing Performance for the Core AWS Services


    Through the book''s earlier chapters, you experienced the power and flexibility
    of Amazon''s compute, storage, database, and networking services. You''ve seen
    how to tune, launch, and administ those tools to support your applications, and
    you''re aware of some the many configuration options that come built-in with the
    platform.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Optimizing Performance for the Core AWS Services


    In this section, you''ll take all that knowledge to the next level. You''ll explore
    the ways you can apply some key design principles to solve—and prevent—real-world
    performance problems.


    # Compute


    What, ultimately, the goal of all “compute” services? To quickly and efficiently
    apply some kind of compute resource to a workload demand. The key there is “some
    kind of,” as acknowledges acknowledges not every problem is addressed by the same
    kind of compute resource. To get it right, you''ll need to put together the right
    blend of functionality and power.


    # EC2 Instance Types


    As you saw in Chapter 2, “Amazon Elastic Compute Cloud and Amazon Elastic Block
    Store,” the performance you''ll get from a particular EC2 instance type is defined
    by a number of configuration variables. Your job, when building your deployment,
    is to match the instance type you choose as closely as possible to the workload
    you expect to face. Of course, you can always change the type of a running instance
    if necessary or just add more of the same.


    Table 10.1 lists the configuration parameters available to help you select the
    instance type that''s most compatible with your workload. Parameters define the
    resources allocated to an instance built from a particular type and the hardware
    capabilities of the underlying hardware.


    # TABLE 10.1 Instance type parameter descriptions


    | Instance Parameter | Description |

    | --- | --- |

    | ECUs | EC2 compute units—useful for comparing the compute power of one instance
    type to another |

    | vCPUs | The number of virtual CPUs allotted an instance built from this instance
    type |

    | Physical Processor | The processor family (e.g., Intel Xeon E52676v3) used by
    the host server |

    | Clock Speed | The clock speed used by a host server |

    | Memory | The amount of RAM allotted to an instance built from this instance
    type |

    | Instance Storage | The size of the local (ephemeral) instance store volume used
    by this instance type |'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# TABLE 10.1 Instance type parameter descriptions (continued)


    | Instance Parameter | Description |

    |---|---|n| EBS-Optimized Available | Whether such an instance can be configured
    to use EBS optimization for dedicated I/O throughput |

    | Network Performance | The data transfer rate allowed to instances built from
    this instance type |

    | IPv6 Support | Whether IPv6 addressing support is available |

    | Processor Architecture | Whether the hardware server uses a 32- or 64-bit processor
    |

    | Intel AES-NI | Whether the hardware uses Advanced Encryption Standard-New Instructions
    (AES-NI) encryption instruction set |

    | Intel AVX | Whether the hardware uses a floating-point instruction set for improved
    graphics/analytics performance |

    | Intel Turbo | Whether the hardware host can benefit from short-term performance
    boosts |


    # Auto Scaling


    Can''t get everything you need from a single EC2 instance? Then feel free to scale
    out. Scaling (or scaling *horizontally* as it''s sometimes called) involves supporting
    application demand by adding new resources that run identical workloads in parallel
    with existing instances.


    A typical scale-out scenario would involve a single EC2 instance hosting an e-commerce
    web server that''s struggling to keep up with rising customer demand. The account
    administrators could take a snapshot of the EBS volume attached to the existing
    instance and use it to generate an image for private EC2 AMI. They could then
    launch multiple instances using the AMI they created and use a load balancer to
    intelligently deliver customer traffic across the parallel instances (You''ll
    learn more about load balancing a bit later in this chapter).


    That''s, *Auto Scaling* is an AWS tool that can be configured to automatically
    launch or shut instances to meet changing demand. As demand rises, consuming a
    predefined percentage of your instance''s resources, EC2 will automatically launch
