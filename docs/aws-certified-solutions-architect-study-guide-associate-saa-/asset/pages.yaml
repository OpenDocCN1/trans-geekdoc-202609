    approach. You simply throw more resources at your database instance and don''t
    have to make any changes to your application or databases.


    Scaling horizontally, also known as scaling out, entails creating additional database
    instances called read replicas. All database engines except for Oracle and Microsoft
    SQL Server support read replicas. Aurora supports a specific type of read replica
    called Aurora replicas.


    A read replica is another database instance that scales against the database.
    A read replica takes some of the query load off the master instance, which remains
    solely responsible for writing data to the database. Read replicas are useful
    for read-heavy applications.


