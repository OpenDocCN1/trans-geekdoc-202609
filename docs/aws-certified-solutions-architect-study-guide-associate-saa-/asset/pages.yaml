    Create the widget.


    +   7. Once you''ve added all the widgets and metrics you''ll need to monitor,
    click Save Dashboard.


    From now on, whenever you browse to CloudWatch, you''ll be able to retrieve and
    view this Dashboard with all of its metrics. Keep in mind that, outside of the
    Free Tier, a single Dashboard will cost $3 per month.


    # Optimizing Data Operations


    Moving data efficiently is pretty much the whole when it comes to successful applications.
    Your code could be a thing of great beauty, but if everything goes down while
    you''re waiting for a weak connection, then it''s mostly wasted effort.


    Sometimes you can''t control the network connection you''re working with, and
    sometimes you can''t reduce the volume of data in play. But it''s usually possible
    to apply some clever data management tricks to speed things up noticeably. Data
    caching, sharding, compression, and decoupling are good examples of the tricks
    you can use, so let''s talk about how they work on AWS.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Caching


    Does your application provide lots of frequently accessed data like a product
    catalog or other media that''s kept in your S3 buckets or a relational database?
    So, why not move copies of the data closer to your clients?


    A caching solution does just. If an object is to be requested repeatedly, a copy
    can be written to system memory on a server—or a purpose-built cache database—from
    which it can be retrieved much quicker. Subsequent requests for that data will
    see the cached copy rather than having to wait for the time it would take to read
    from the source. The cached copy will remain the authoritative version until its
    maximum time to live (TTL) is reached, at which point it will be flushed and replaced
    by an updated version that''s read from the data source.


    # Amazon ElasticCache


    An ElasticCache cluster consists of one or more nodes. As Figure 10.3 illustrates,
    a node is a compute instance—built from an EC2 instance you select—that does the
    actual work of processing and serving data to your clients. The number of nodes
    and the particular type you choose depend on the demands your clients are likely
    to place on the application. Finding the ideal configuration combination that''s
    best for your needs will require some of the same considerations you''d use to
    provide for any EC2 workload.


    > **FIGURE 10.3** A typical ElasticCache configuration with an ElasticCache cluster
    containing two cache nodes serving data for front-end EC2 instances


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_268_0.png)


    ElasticCache clusters can be created using one of two engines: Memcached or Redis.
    Memcached can be simpler to configure and deploy, is easily scalable, and because
    it works with multiple threads, can run faster. However, because it reads and
    writes only objects (blobs) as in-memory key-value data stores, Memcached isn''t
    always flexible enough to meet the needs of all projects.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Chapter 10 ■ The Performance Efficiency Pillar


    Redis, on the other hand, supports more complex data types such as strings, lists,
    and sets. Data can also be persisted to a disk, making it possible to snapshot
    data for later recovery. Redis lets you sort and rank data, allowing you to support,
    say, an online gaming application that maintains a leaderboard ranking the top
    users. The fact that both Redis and Memcached available makes it possible to use
    Redis to maintain session caching, potentially improving performance.


    Typically, ElasticCache will make the current version of both Redis and Memcached
    available, along with a few previous versions. This makes it possible to support
    a wide range of caching needs possible. Once your ElasticCache cluster is running,
    you can retrieve its endpoint from the ElasticCache Dashboard and connect to the
    cluster for your application. For a WordPress instance, for example, this can
    be as simple as adding a single line to the wp-config.php file containing something
    like the following syntax:


    ```

    define(''WP_REDIS_HOST'', ''your_cluster.name.amazonaws.com'');

    ```


    You can enjoy the benefits of caching without using ElasticCache. For some cases,
    you might want to save some money and simply run a reverse Varnish on your actual
    EC2 instance.


    # Other Caching Solutions


    Besides caching at the application level, you can also achieve performance gains
    using broadly similar techniques on the data in your database.


    As you saw in Chapter 5, you can add as many as five replicas to a running database
    in RDS (RDS Aurora instances can have as many as 15). Read replicas are available
    for MySQL, PostgreSQL, and Aurora. The replica will be an actual copy of the original
    but will be read-only. By routing some of your traffic to the replica, you lighten
    the load on the source database, improving response times for both. In addition
    to performance benefits you can also, if necessary, promote a replica to your
    primary database should the original fail.


    Effectively, a replica is a kind of cache that leverages relatively cheap storage
    overhead to provide and highly available copies of your data. Another type of
    caching—which you saw in Chapter 8—is CloudFront. As you''ll remember, a CloudDistribution
    can cache copies of S3-based media on edge locations spread across the world and
    serve requests from the copy located closest to the client.


    # Partitioning/Sharding


    Traffic volume on your RDS database can increase to the point that a single instance
    simply can''t handle it. While vertical scaling may not be an option, horizontal
    scaling partitioning (or sharding) can make a big difference. While not as simple
    as the read-only read replicas discussed, partitioning can be configured by adding
    appropriate logic to the application layer so client requests are directed to
    the right endpoints.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Summary


    Sending data in real time through Amazon Kinesis Streams—using the Amazon DynamoDB
    Streams Kinesis Adapter—lets you process streams of data records in DynamoDB databases.
    Kinesis organizes records into shards that contain data along with critical meta
    information. If one shard hits a limit, the workload can be further distributed
    by subdividing into multiple shards.


    It''s highly scalable and fully managed, Kinesis streams maintain real-time performance
    and, by extension, can have a significant impact on overall data processing performance.


    # Compression


    If bandwidth is a finite resource and it''s not practical to reduce the volume
    of data you''re regularly transferring, there''s still hope. You can either reduce
    the size of your data or bypass the network with its built-in limits altogether.


    How do you reduce data size? By borrowing a solution, once upon a time, was a
    necessary part of working with expensive and limited storage space. Are you old
    enough to remember how we used to fix a full operating system with our program
    and work files up to a 10 MB drive? Disk compression.


    Storage is no longer a serious problem, but network transfers are. You can, therefore,
    stretch the value you get from your network connections by compressing your data
    before sending it. This is something that can be incorporated into your application
    code. It also used directly within some AWS services. CloudFront, for instance,
    can be configured to automatically compress the files sent to request clients,
    greatly reducing download times.


    By bypassing the network? You can ask Amazon to send you a physical petabyte-sized
    device called a Snowflake. You copy your archives onto the encrypted device and
    ship it back to Amazon. Within a short time, your data will be uploaded to S3.


    # Summary


    The performance and availability of EC2 instances can be improved by choosing
    the right instance type and provisioning by many instances as necessary through
    Auto Scaling. Compute workloads can sometimes be more effectively delivered through
    serverless (Lambda) or container (Docker/ECS) models.


    Access EBS volume-based data and data reliability can be enhanced by configuring
    RAID across. Cross-region replication and S3 transfer acceleration can improve
    S3 data administration.


    Carefully configuring details such as schemas, indexes, views, option groups,
    and parameter groups can improve the performance of your RDS databases. For manually
    hosted databases, latency issues can be addressed through volume class (magnetic
    versus SSD) and IOPS level; durability is improved through replication; and scalability
    can be manually configured.'
  merge: -1
  img_proc: true
