  md: '# # Answers to Assessment Test


    +   1. B. The Business plan offers access to a support API, but the Developer
    plan does not. See Chapter 1 for more information.


    +   2. B. Customers are responsible for managing the network configuration of
    EC2 instances. AWS is responsible for the physical network infrastructure. See
    Chapter 1 for more information.


    +   3. C. Simple Queue Service (SQS) allows for event-driven messaging within
    distributed systems that can decouple when coordinating the discrete steps of
    a larger process. See Chapter 1 for more information.


    +   4. A. The dedicated host option lets you know the number of physical CPU sockets
    and cores on a host. See Chapter 2 for more information.


    +   5. B. An elastic IP address will not change. A public IP address attached
    to an instance will change if the instance is stopped, as would happen when changing
    the instance type. See Chapter 2 for more information.


    +   6. A. A Quick Start AMI is independent of the instance type. See Chapter 2
    for more information.


    +   7. D. With SSE-C you provide your own keys for Amazon to decrypt and encrypt
    your data. AWS doesn''t persistently store the keys. See Chapter 3 for more information.


    +   8. A. Durability corresponds to an average expected loss of objects stored
    on S3, including objects you delete. Availability measures the amount of time
    S3 will be available to let you retrieve those objects. See Chapter 3 for more
    information.


    +   9. B. S3 uses a read-after-write consistency for new objects, so you can upload
    an object to S3, it''s immediately available. See Chapter 3 for more information.


    +   10. C. You can''t change the primary CIDR for a VPC, so you must create a
    new one to connect to your network network. See Chapter 4 for more information.


    +   11. B. An EC2 instance can access the Internet from a private subnet it uses
    a NAT gateway or NAT instance. See Chapter 4 for more information.


    +   12. A. The definition of a public subnet is a subnet that has a default route
    pointing to an Internet gateway as a target. Otherwise, it''s a private subnet.
    See Chapter 4 for more information.


    +   13. C. DynamoDB is a key-value store that can be used to store items up to
    400 KB in size. See Chapter 5 for more information.


    +   14. A. You can create a global secondary index for an existing table at any
    time. You can create a local secondary index only when you create the table. See
    Chapter 5 for more information.'
  merge: -1
  img_proc: true
