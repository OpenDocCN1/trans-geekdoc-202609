    # Building Serverless Applications with Lambda


    As an AWS architect you don''t need to know how to program, it''s important to
    understand how serverless applications run on Lambda differ from executables that
    run on EC2 instances. Lambda allows you to create a function written in one of
    a variety of languages, including the following:


    +   * C#n* Go

    * Java

    * JavaScript

    * PowerShell

    * Python


    Lambda functions are useful for performing intermittent tasks that don''t warrant
    keeping a running EC2 instance around. For example, you can create a Lambda function
    that retrieves an image from an S3 source bucket, resizes it, and then uploads
    the processed'
