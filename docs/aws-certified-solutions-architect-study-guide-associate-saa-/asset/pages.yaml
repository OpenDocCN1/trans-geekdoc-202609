    # Instance Lifecycle


    The state of a running EC2 instance can be managed in a number of ways. Terminating
    an instance will shut down and cause its resources to be reallocated to the general
    AWS pool.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_62_0.png)


    > This, in most cases, destroy all data kept on the primary storage. The exception
    to this would be an Elastic Block Store (EBS) volume that has been set to persist
    after its instance is terminated.


    If your instance is not needed for some time but don’t want to terminate it, you
    can save money by simply stopping it and restarting it when it’s needed again.
    The data on an EBS volume in this case will not be lost, although that would not
    be true for an instance volume.


    Later in this chapter, you’ll learn about both EBS and instance volumes and the
    ways they work with EC2 instances.


    You should be aware that a stopped instance has been using a nonpersistent IP
    address most likely be assigned a different address when it’s restarted. If you
    need a predictable IP address that can survive restarts, allocate an Elastic IP
    address and associate it with your instance.


    You can edit an instance’s security group (which I discuss later in this chapter)
