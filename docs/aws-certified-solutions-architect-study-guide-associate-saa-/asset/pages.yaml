    # Run Command


    While automation enables you to automate tasks against your AWS resources, Run
    Commands let you execute tasks on your managed instances that would otherwise
    require logging in or using a third-party tool to execute a custom script.


    Systems Manager accomplishes this via an agent installed on your EC2 and on-premises
    managed instances. The Systems Manager is installed on all Windows Server and
    Linux AMIs.


    By default, Systems Manager does not have permissions to do anything on the instances.
    You first need to attach an instance profile role that contains the permissions
    in AmazonEC2RoleForSSM policy.


    AWS offers a variety of preconfigured command documents for Linux and Windows
    instances; for example the AWS-InstallApplication document installs software on
    Windows, and the AWS-RunShellScript document allows you execute arbitrary shell
    scripts against Linux instances. Other documents include tasks such as restarting
    a Windows service or installing the DeployAgent.


    You can target instances by tag or select them individually. With automation,
    you may use rate limiting to control how many instances you target at once.


    # Session Manager


    Session Manager lets you achieve interactive bash and PowerShell access to your
    Linux and Windows instances, respectively, without having to open inbound ports
    on a security group or network ACL or even having your instances in a public subnet.
    You don''t need to set up a bastion host or worry about SSH keys. All Linux versions
    and Windows Server 2008 R2 from 2016 are supported.


    You open a session using the web console or CLI. You must first install the Session
    Manager plugin on your local machine to use the AWS CLI to start a session. The
    Session Manager SDK has libraries for developers to create custom applications
    that connect to instances. This is useful if you want to integrate an existing
    configuration management system with your instances without opening ports in a
    security group or network ACL.


    Connections made via Session Manager are secured using TLS 1.2. Session Manager
    can keep a log of all logins in CloudTrail and store a record of commands within
    a session in an S3 bucket.


    # Patch Manager


    Patch Manager helps you automate the patching of your Linux and Windows instances.
    It doesn''t support all operating systems supported by other Systems Manager features
    but does support the following:


    +   * All Amazon Linux versions

    * CentOS/RHEL 6.5–7

    * SUSE Linux Enterprise Server 12.0–12.9'
