  md: '# Chapter 6 • Authentication and Authorization—AWS Identity


    user authentication, while AWS Key Management Service (KMS), AWS Secrets Manager,
    and AWS CloudHSM simplify the administration of encryption keys and authentication
    secrets.


    # Amazon Cognito


    Cognito provides mobile and web developers with two important functions.


    +   - Through Cognito''s user pools, you can add sign-up and sign-in to your applications.

    - Through Cognito''s identity pools, you can give your users temporary, controlled
    access to other services in your AWS account.


    Building a new user pool involves how you want your users to identify themselves
    when they sign up (attributes such as address or birth date) and email address).
    You can also set minimum requirements for password complexity, multifactor authentication,
    and email verification.


    When you set up an identity pool, you define the pool from which your users can
    come (using Cognito, AWS, federated, or unauthenticated identities). You then
    create and assign an IAM role to connect the pool; any user whose identity matches
    your definition will have access to the resources specified in the pool.


    # AWS Managed Microsoft AD


    Managed Microsoft AD is actually accessed through the AWS Directory Service, as
    are a number of directory tools like Amazon Cloud Directory and Cognito. ( Directory
    is a way to store and retrieve hierarchical data like an organization''s users
    or hardware devices.) What the Directory Service tools share in common is the
    ability to handle large stores of data and integrate them into AWS operations.


    Technically, Managed Microsoft AD is called Directory Service for Microsoft Active
    Directory. While whatever you refer to it, the goal is to have Active Directory
    control the way Microsoft SharePoint, NET, and SQL Server-based workloads running
    in your VPC connect to AWS resources. It''s also possible to connect your AWS
    services to an on-premises Microsoft Active Directory using AD Connector.


    Managed Microsoft AD controllers run in two VPC availability zones. As a managed
    service, AWS takes care of all necessary infrastructure administration, including
    data replication and software updates.


    # AWS Single Sign-On


    Single sign-on (SSO) allows you to provide users with streamlined authentication
    and authorization through an existing Microsoft Active Directory configured within
    AWS Directory Service. The service works across multiple AWS accounts within AWS
    Organizations. SSO also supports access to popular applications such as Salesforce,
    Box, and Office 365 in order to custom apps that support Security Assertion Markup
    Language (SAML) 2.0.'
  merge: -1
