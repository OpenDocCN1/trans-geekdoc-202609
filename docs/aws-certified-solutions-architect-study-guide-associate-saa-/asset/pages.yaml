    # # Exam Essentials


    **Understand why EC2 instance types are defined.** Each EC2 instance type is designed
    to serve a different function. You should be familiar with the individual parameters
    that are used to measure the way each type performs.


    **Understand Auto Scaling.** The best way to efficiently meeting demands on your
    application is to automate the process of provisioning and launching new resources
    as demand grows and shutting down unused resources as demand drops. Auto Scaling
    is the way AWS manages this functionality for EC.


    **Understand the value of serverless and container computing comparing with EC2**
    By reducing the underlying resource footprint of your service, serverless functions,
    such as those offered through AWS Lambda, and clusters of Docker containers (offered
    through AWS ECS) can provide more responsive and cost-effective solutions. You
    should understand which model will work best for a given use case.


    **Understand how to optimize storage performance and reliability.** Data stored
    on EBS volumes (using RAID) or in S3 buckets (using cross-region replication)
    can be replicated for greater durability and/performance. You can also enable
    faster transfers in and out of S3 buckets by S3 transfer acceleration or CloudFront.


    **Understand how to optimize database performance.** The performance, reliability,
    and costs you''ll experience running a database on AWS will depend on the choices
    you make.'
