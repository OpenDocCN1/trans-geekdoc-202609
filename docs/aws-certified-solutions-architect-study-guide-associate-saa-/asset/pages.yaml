  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_55_0.png)


    # # Introduction


    The ultimate focus of a traditional data center/server room is its precious servers.
    But, to make those servers useful, you''ll need to add racks, power supplies,
    cabling, switches, fire-walls, and cooling.


    AWS Elastic Compute Cloud (EC2) is designed to replicate the data center/server
    room experience as closely as possible. At the center of all it is the EC2 virtual
    server, known as an instance. But, like the local server room I just described,
    EC2 provides a range of tools meant to support and enhance your instance''s operations.


    This chapter will explore the tools and practices used to fully leverage the power
    of the EC2 ecosystem:


    +   - Provisioning an EC2 instance with the right hardware resources for your
    project

    - Configuring the right operating system for your application needs

    - Building a secure and effective network environment for your instance

    - Adding scripts to run as the instance boots to support (or start) for your application

    - Choosing the best EC2 pricing model for your needs

    - Understanding how to manage and leverage the EC2 instance lifecycle

    - Choosing the right storage drive type for your needs

    - Securing your EC2 resources using key pairs, security groups, and Identity and
    Access Management (IAM) roles

    - Accessing your instance as an administrator or end-user client


    # # EC2 Instances


    An EC2 instance may only be a virtualized and abstracted subset of a physical
    server, but it behaves just like the real thing. It''ll have access to storage,
    memory, and a network interface, and its primary drive will come with a fresh
    and clean operating system running.


    It''s up to you decide what hardware resources you want your instance to have,
    what operating system and software stack you''d like it to run, and ultimately,
    how much you''ll pay for it. Let''s see how that works.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Provisioning Your Instance


    You configure your instance''s operating system and software stack, hardware specs
    (the CPU power, memory, primary storage, and network performance), and environment
    before launching it. The OS is defined by the Amazon Machine Image (AMI) you choose,
    and the hardware follows the instance type.


    # EC2 Amazon Machine Images


    An AMI is just a template document that contains information telling EC2 what
    OS and application software to include on the root data volume of the instance
    it''s about to launch. There are four kinds of AMIs:


    +   * Amazon Quick Start AMIs Amazon Quick Start AMIs appear at the top of the
    list in the console when you start the process of launching a new instance. The
    Quick Start AMIs are popular choices and include various versions of Linux or
    Windows Server OSs and some specialties for performing common operations (like
    deep learning and database). AMIs are up-to-date and officially supported.


    +   * AWS Marketplace AMIs AMIs from the AWS Marketplace are official, production-ready
    images provided by industry vendors like SAP and Cisco.


    +   * Community AMIs There are more than 100,000 images available as Community
    AMIs. Many of these AMIs are created and maintained by independent vendors and
    are usually built to meet a specific need. This is a good catalog to search if
    you''re planning an application build on a combination of software resources.


    +   * Private AMIs You can also store images created from your own instance deployments
    as private AMIs. Would you want to do that? You might, for instance, want the
    ability to scale up the number of instances you''ve got running to meet growing
    demand. Having a reliable image as an AMI makes autoscaling easy. You can also
    share images as AMI or import VMs from your local infrastructure (by way of AWS
    S3) using the AWS VM Import/Export tool.


    A particular AMI will be available in a single region—although there will often
    be images with identical functionality in all regions. Keep this in mind as you
    plan your deployments: invoking the ID of an AMI in one region while working within
    a different region will fail.


    | An Important Note Billing |

    | Beside the normal charges for running an EC2 instance, your AWS account also
    be billed hourly amounts or license fees for the use of the AMI software itself.
    Although vendors make every effort to clearly display the charges for their AMIs,
    it''s your responsibility to accept and honor those charges. |'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Instance Types


    AWS allocates hardware resources to your instances according to the instance type—or
    hardware profile—select. The particular workload you''re planning for your instance
    will determine the type you choose. The ideal is to balance cost against your
    need for compute power, memory, and storage space. Ideally, you''ll find a type
    that offers exactly the amount of each to satisfy your application and budget.


    Should your needs change over time, you can easily move to a different instance
    type by stopping your instance, editing its type, and starting it up again.


    As listed in Table 2.1, there are currently more than 75 instance types organized
    into instance families, although AWS frequently updates their selection. You can
    view the most recent collection at https://aws.amazon.com/ec2/instance-types/.


    # TABLE 2.1 EC2 instance type family and their top-level designations


    | Instance Family | Types |

    |---|---|

    | General purpose | T3, T2, M5, M4 |

    | Compute optimized | C5, C4 |

    | Memory optimized | X1e, X1, R5, R4, z1d |

    | Accelerated computing | P3, P2, G3, F1 |

    | Storage optimized | H1, D2 |


    **General Purpose** The General Purpose family includes T3, T2, M5, and M4 types,
    which all provide to a balance of compute, memory, and network resources. T2 instances,
    for instance, range from the t2.nano with one virtual CPU (vCPU) and half a gigabyte
    of memory all the way to the t2.xlarge with eight vCPUs and 32 GB of memory. Because
    it''s Free Tier-eligible, the t2.micro is often a good choice for experimenting.
    But there''s nothing stopping you from using it for light-weight websites and
    development-related services.


    > T2s are burstable, which means you can accumulate CPU credits when your instance
    is underutilized that can be applied during high-demand periods in the form of
    higher CPU performance.


    M5 and M4 instances are recommended for many small and midsize data-centric operations.
    Unlike T2, which requires EBS virtual volumes for storage, some M* instances with
    their own instance storage drives that are physically attached to the host server.
    M5 types range from m5.large (2 vCPUs and 6 GB of memory) to the monstrous m5.24xlarge
    (96 vCPUs and 382 GB of memory).'
  merge: -1
  img_proc: true
