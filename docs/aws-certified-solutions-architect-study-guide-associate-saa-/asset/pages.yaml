    +   * User data can consist of a few simple commands to install a web server and
    populate its web root, or it can be a sophisticated script setting the instance
    up as a working node within a Puppet Enterprise-driven platform.


    # Instance Pricing


    Use EC2 instances can be purchased using one of three models.

    For always-deployments that you expect to run for less than 12 months, you''ll
    normally pay for each hour your instance is running through the on-demand model.
    On-demand is the most flexible way to use EC2 resources since you are able to
    control how much you pay by stopping and starting instances to your need. But,
    per hour, it is also the most expensive.


    If you''re planning to keep the lights burning 24/7 for more than a year, you''ll
    enjoy a significant discount by purchasing a reserve instance—generally over a
    commitment between one and three years. You can pay up front for the term of a
    reserve instance, or for incrementally higher rates, partially up front and the
    rest in monthly charges or entirely through monthly charges. Table 2.2 gives you
    a sense of how costs change between models. These estimates assume a Linux platform,
    all-front payments, and default tenancy. Actual costs may vary over time and between
    regions.


    # TABLE 2.2 Pricing estimates on-demand with reserve costs


    | Instance Type | Pricing Model | Cost/Hour | Cost/Year |

    |---|---|---||}{

    | t2.micro | On-demand | $0.0058 | $50.81 |

    | t2.micro | Reserve (three-year term) | | $38.33 |

    | g3.4xlarge | On-demand | $1.14 | $9986.40 |

    | g3.4xlarge | Reserve (three-year term) | | $4432.56 |


    For workloads that can withstand unexpected disruption (like computation-intensive
    genome research applications), purchasing instances on Amazon''s Spot market can
    save you a lot of money. The idea is you enter a maximum dollar-value bid for
    an instance type running in a particular region. The next time an instance in
    that region becomes available at a per-hour rate that''s equal to below your bid,
    it''ll be launched using the AMI and launch template you specified. Once up, the
    instance will keep running until you stop'
