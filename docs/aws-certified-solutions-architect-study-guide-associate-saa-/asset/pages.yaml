    # CodeDeploy


    CodeDeploy is a service that can deploy applications to EC2 or on-premises instances.

    You can use CodeDeploy to deploy binary executables, scripts, web assets, images,
    and

    anything you can store in an S3 bucket or GitHub repository. You can also use

    CodeDeploy to deploy Lambda functions. CodeDeploy offers a number of advantages
    over

    manual deployments, including the following:


    +   * Simultaneous deployment to multiple instances or servers

    * Automatic rollback if all deployment errors'
