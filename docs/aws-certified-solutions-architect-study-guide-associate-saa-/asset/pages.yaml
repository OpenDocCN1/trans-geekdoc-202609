    # NAT Gateway


    A NAT gateway is a NAT device managed by AWS. Like an Internet gateway, it''s
    a one-fits-all resource. It doesn''t come in a variety of flavors, and there''s
    nothing to manage or access. It automatically scales to accommodate your bandwidth
    requirements. You set it and forget it.


    When you create a NAT gateway, you must assign it an EIP. A NAT gateway can reside
    in only one subnet, which must be a public subnet for it to access the Internet.
    AWS selects'
