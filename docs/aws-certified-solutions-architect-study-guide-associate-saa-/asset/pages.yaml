  md: '# Introduction


    Studying for any certification always involves deciding how much of your studying
    should be practical hands-on experience and how much should simply memorizing
    facts and figures. Between the two of us, we''ve taken more than 20 different
    IT certification exams, so we know how important it is to use your time wisely.
    We''ve designed this book to help you discover your strengths and weaknesses on
    the AWS platform so that you can focus your efforts properly. Whether you''ve
    been working with AWS for a long time or you''re relatively new to it, we encourage
    you to carefully read this book from cover to cover.


    Passing the AWS Certified Solutions Architect – Associate exam requires understanding
    the components and operation of the core AWS services as how those services interact
    with each other. Read through the official documentation for the various AWS services.
    Amazon offers HTML, PDF, and Kindle documentation for many of them. Use this book
    as a guide to identify your strengths and weaknesses so that you can focus your
    efforts properly.


    Hands-on experience is crucial for each exam. Each chapter in this AWS Certified
    Solutions Study Guide: Associate SAA-C01 Exam, Second Edition contains hands-on
    exercises that you should complete during or immediately after reading the chapter.
    It''s vital to ensure that the exercises don''t cover every possible scenario
    for AWS service. In fact, it''s quite the opposite. The exercises provide you
    with a foundation to build on. Use them as your starting point, but don''t be
    afraid to venture out on your own. Feel free to match the variables and scenarios
    you might encounter in your organization. Keep in mind that some of the exercises
    and figures use the AWS web console, which is in constant flux. As such, screenshots
    and step-by-step details of exercises may change. Use these eventualities to dig
    into the AWS online documentation and browse around the web console on your own.
    Also remember that although you can complete many of the exercises within the
    bounds of the AWS Free Tier, getting enough to pass the exam will likely require
    you to spend some money. But it''s money well spent, getting certified is an investment
    in your career and your future.


    Each chapter reviews questions to thoroughly test your understanding of the services
    and concepts covered in that chapter. They also test your ability to integrate
