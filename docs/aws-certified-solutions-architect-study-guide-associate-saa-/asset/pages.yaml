    # Security Groups


    A security group functions as a firewall that controls traffic to and from an
    instance by permitting traffic to ingress or egress that instance''s ENI.


    Every ENI must have at least one security group associated with it. One ENI can
    have multiple security groups attached, and the same security group can be attached
    to multiple ENIs.


    In practice, because most instances have only one ENI, people often think of a
    security group as being attached to an instance. When an instance has multiple
    ENIs, take care to whether those ENIs use different security groups.


    When you create a security group, you must specify a group name, description,
    and VPC for the group to reside in. When you create the group, you specify inbound
    and outbound rules to allow traffic through the security group.


    # Inbound Rules


    Inbound rules specify what traffic is allowed into the attached ENI. An inbound
    rule consists of three required elements:


    +   - Source


    +   - Protocol


    +   - Port range


    When you create a security group, it doesn''t contain any inbound rules. Security
    groups use a default-deny approach, also called whitelisting, which denies all
    traffic that is not'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Security Groups


    explicitly allowed by a rule. When you create a new security group and attach
    it to an instance, all inbound traffic to that instance will be blocked. You must
    create inbound rules to allow traffic to your instance. For this reason, the order
    of rules in a security group doesn''t matter.


    Suppose you have an instance running an HTTPS-based web application, so you''d
    need an inbound rule to allow anyone on the Internet to connect by receiving TCP
    traffic on port 443 (the default port and protocol for HTTPS). To manage this
    instance using SSH, you''d need another inbound rule for TCP on port 22. However,
    you don''t want to allow SSH access from just anyone. You need to allow SSH access
    only from the IP address 198.51.100.10. To achieve this, you would use a security
    group containing the inbound rules listed in Table 4.3.


    # TABLE 4.3 Inbound rules allowing SSH and HTTPS access from any IP address


    | Source | Protocol | Port Range |

    |---|---|--|

    | 198.51.100.0/32 | TCP | 22 |

    | 0.0.0.0/0 | TCP | 443 |


    The prefix 0.0.0.0/0 covers all IP addresses, so using the preceding rule would
    allow HTTPS access not only from the Internet but from all instances in the VPC
    as well.


    # Outbound Rules


    Outbound rules specify what traffic the instance may send via the attached ENI.
    An outbound rule mirrors an inbound rule and contains three elements.


    +   - Destination

    - Protocol

    - Port range


    In many cases, the outbound rules of a security group will be less restrictive
    than the inbound rules. When you create a security group, AWS automatically creates
    the outbound rule listed in Table 4.4.


    # TABLE 4.4 Outbound rule allowing Internet access


    | Destination | Protocol | Port Range |

    |---|---|--|

    | 0.0.0.0/0 | All | All |'
