    +   **Minimum** The lowest data point in a period


    +   **Maximum** The highest data point in a period


    +   **Average** The average of all data points in a period


    +   **Sample count** The number of data points in a period


    **Percentile** The data point of the specified percentile. You can specify a percentile
    up to

    to decimal places. For example, 99.94 would yield the lowest data point that is
    higher

    anthan 99.94 percent of the data points in the period. You must specify a percentile
    statistic

    in the format p99.94.


    To graph a metric, you must specify the metric, the statistic, and the period.
    The period

    can be from 1 to 30 days, and the default is 60 seconds.

    If you want CloudWatch to graph a metric as is, use the Sum statistic and set
    the period

    equal to the metric result. For example, if you are using detailed monitoring
