    # Amazon Redshift


    Redshift is a managed warehouse solution designed for OLAP databases. Although
    it''s based on PostgreSQL, it''s not part of RDS. Redshift uses columnar storage,
    meaning it stores the values for a column close together. This improves storage
    density and efficiency and makes it faster to query data from individual columns.
    Redshift supports ODBC and JDBC connectors.


    Redshift uses compression encodings to reduce the amount of space each column
    takes up in storage. You can apply compression manually on a column-by-column
    basis. Or if you use the COPY command to import data from a file into a Redshift
