    # Infrastructure Automation


    One of the greatest benefits of virtualization is the ability to describe your
    resources within a script. Every service, object, and process within the Amazon
    cloud can be managed using textual abstractions, allowing for an Infrastructure
    as Code environment.


    You''ve already seen this kind of administration through the many AWS CLI examples
    in this book. Building on the CLI and SDK foundations, sophisticated operations
    can be heavily automated using both native AWS and third-party tools.


    # CloudFormation


    You can represent infrastructure stacks using AWS CloudFormation. CloudFormation
    templates are JSON or YAML-formatted text files that define the complete inventory
    of AWS resources you would like to run as part of a particular project.


    CloudFormation templates are easy to copy or export to reliably re-create resource
    stacks elsewhere. This lets you design an environment to test a beta version of
    your application and then create identical environments for staging and production.
    Dynamic change can be incorporated into templates type by parameterizing key values.
    This way, you can specify, say, one VPC or instance type for your test environment
    and a different profile for production. Templates can be created in multiple ways.


    +   * Using the browser-drag-and-drop interface


    +   * Working with prebuilt sample templates defining popular environments such
    as a LAMP web server or WordPress instance


    +   * Manually writing and uploading a template document'
