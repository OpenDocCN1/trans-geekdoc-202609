    Patch Manager uses baselines to define which available patches to install, as
    well as whether the patches differ or require approval.

    AWS offers default baselines that differ according to operating system but include
    patches that are security-related, critical, important, or required. Patch baselines
    for all operating systems except Ubuntu automatically approve these patches after
