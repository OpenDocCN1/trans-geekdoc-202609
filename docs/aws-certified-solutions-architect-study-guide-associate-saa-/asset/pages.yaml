    > > NOTE A stack policy cannot prevent a principal from updating a resource directly,

    deleting a resource, or deleting an entire stack. If you need to control principals
    who can modify a stack or resource, you should use IAM policies.


    CloudFormation doesn''t preemptively check whether an update will violate a stack
    policy. If you need to update a stack in ways that are prevented by the stack
    policy, CloudFormation will still attempt to update the stack. The update will
    fail only when CloudFormation attempts to perform an update prohibited by the
    stack policy. Therefore, when updating a stack, it''s important to verify that
    the update succeeded. Don''t just start the update and walk away.


    # Overriding Stack Policies


    You can temporarily override a stack policy when doing a direct update. When you
    perform a direct update, you can specify a stack policy that overrides the existing
    one. CloudFormation will apply the updated policy during the update. Once the
    update is complete, CloudFormation will revert to the original policy.


    # CodeCommit


    Git (https://git-scm.com) is a free and open-source version control system invented
    by Linus Tords to facilitate collaborative software development projects. However,
    people often use Git to store and track a variety of file-based assets, including
    source code, scripts, documents, and binary files. Git stores these files in a
    repository, colloquially referred to as a repo.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 304 Chapter 13 ■ The Operational Excellence Pillar


    The AWS CodeCommit service hosts private Git-based repositories for version-con-trolled
    files, including code, documents, and binary files. CodeCommit provides advantages
    over other private Git repositories, including the following:


    +   - Encryption at transit using an AWS-managed key in KMS

    - Encryption in transit using HTTPS or SSH

    - No size limitation for repositories

    - 2 GB size limitation for a single file

    - Integration with other AWS services


    A repository and S3 have some things in common. They both store files and provide
    automated versioning, allowing you to revert to a previous version of a deleted
    or over-written file. Git tracks changes to individual files using a process called
    *differencing*, allowing you to see what changed in each file, when it changed.
    It also allows you to create additional *branches*, which are essentially snapshots
    of an entity. For example, you could take an existing source code repository,
    create a new branch, and experiment on that without any problems in the original
    or master branch.


    # Creating a Repository


    You create a repository in CodeCommit using the AWS management console or the
    AWS CLI. It is always empty. You can add files to the repository in three ways:


    +   - Upload files using the CodeCommit management console.

    - Use Git to clone the empty repository locally, add files to it, commit those
    changes, and then push changes to CodeCommit.

    - Use Git to push an existing local repository to CodeCommit.


    # Repository Security


    CodeCommit uses IAM policies to control access to repositories. To help you control
    access to your repositories, AWS provides three managed policies. Each of the
    following policies allows access to all CodeCommit repositories using both the
    AWS Management Console and Git.


    **AWSCommitFullAccess** This policy provides unrestricted access to CodeCommit.
    This is the policy you''d generally assign to repository administrators.


    **AWSCommitPowerUser** This policy provides full access to CodeCommit repositories
    but does not allow the delete to repositories. This is the policy you''d assign
    to users who need both read and write access to repositories.


    **AWSCommitReadReadOnly** This grants read-only access to CodeCommit repositories.


    If you want to restrict access to a specific repository, you can copy one of these
    policies to your own customer-managed policy and specify the ARN of the repository.'
  merge: -1
  img_proc: true
- pgno: 333
  md: "# Interacting with a Repository Using Git\n\nMost users will interact with\
    \ a CodeCommit repository via the Git command-line interface, which you can download\
    \ from https://git-scm.com. Many integrated development environments (IDEs) such\
    \ as Eclipse, IntelliJ, Visual Studio, and Xcode provide their user-friendly Git-based\
    \ tools.\n\nOnly IAM principals interact with a CodeCommit repository. AWS recommends\
    \ generating a Git username and password for each IAM user from the management\
    \ console. You can generate up to two Git credentials per user. CodeCommit doesn't\
    \ use resource-based policies, it doesn't allow anonymous access to repositories.\n\
    \nIf you don't want to configure IAM users or if you need to grant repository\
    \ access to a federated user or application, you can grant repository access to\
    \ a role. You can't assign Git credentials to a role, so you must configure Git\
    \ to use the AWS CLI Credential Helper to obtain credentials that Git can use.\n\
    \nGit-based connections to CodeCommit must be encrypted using either HTTPS or\
