- pgno: 110
  md: '# 78 Chapter 4 ■ Amazon Virtual Private Cloud


    The main purpose of this rule is to allow the instance to access the Internet
    and other AWS resources. You may delete this rule, but if you do, the security
    group won''t permit your instance to access the Internet or anything else!


    # Sources and Destinations


    The source or destination in a rule can be any CIDR or the resource ID of a security
    group. If you specify a security group as the source or destination, any instance
    with that security group attached will be allowed by the rule. This makes it easy
    to allow instances to communicate with each other by simply assigning the same
    security group to all of them.


    # Stateful Firewall


    A security group acts as a stateful firewall. Stateful means that when a security
    group allows traffic to pass in one direction, it intelligently allows traffic
    in the opposite direction. For instance, when you allow inbound HTTPS access to
    an instance from a client on the Internet, the security group automatically allows
    reply traffic from the instance to the client.


    # Default Security Group


    Each VPC contains a default security group that you can''t delete. You don''t
    have to use it, but if you do, you can modify its rules to suit your needs. Alternatively,
    you may opt to create your own custom group and use it instead. Complete Exercise
    4.5 to practice creating a custom security group.


    # EXERCISE 4.5


    # Create a Custom Security Group


    In this exercise, you''ll create a new security group that allows SSH, HTTP, and
    HTTPS access from any IP address.


    +   1. From the EC2 or VPC dashboard, click Security Groups.

    2. Click Create Security Group.

    3. Assign the security group a name, and select the VPC you''ve used in previous
    exercises.

    4. Under the Inbound tab, click Add Rule.

    5. Add rules to allow SSH, HTTP, and HTTPS access from any IP address.

    6. Click Create.'
