    # VPCs


    Private clouds (VPCs) are easy-to-use AWS network organizers and great tools for
    organizing your infrastructure. Because it''s so easy to isolate the instances
    in one VPC from whatever you have running, you might want to create a new VPC
    for each one of your projects or stages. For example, you might have one VPC for
    early application development, another for testing, and a third for production
    (see Figure 2.1).


    FIGURE 2.1 A multi-VPC infrastructure for a development environment


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_59_0.png)


    Adding a simple VPC that doesn''t incorporate a NAT gateway (https://docs.aws.amazon.com/AmazonVPC/Latest/UserGuide/vpc-nat-gateway.html)
    or VPN access (https://docs.aws.amazon.com/AmazonVPC/Latest/UserGuide/vpc_vpn.html)
    doesn''t cost you anything. You''ll learn more about this in Chapter 4, “Amazon
    Virtual Private Cloud."


    # Tenancy


    When launching an EC2 instance, you''ll have the opportunity to choose a tenancy
    model. The default setting is shared tenancy, where your instance will run on
    a virtual machine on a physical server that concurrently hosting other instances.
    Other instances might well be owned and operated by other AWS customers, although
    the possibility of any kind of insecure interaction between instances is remote.


    To meet special regulatory requirements, your organization''s instances might
    need an extra level of isolation. The Dedicated Instance option ensures that your
    instance will run on its own dedicated physical server. This means that it won''t
    be sharing the server with resources owned by a different customer account. The
    Dedicated Host option allows you to actually identify and control the physical
    server you''ve been assigned to meet more restrictive requirements'
