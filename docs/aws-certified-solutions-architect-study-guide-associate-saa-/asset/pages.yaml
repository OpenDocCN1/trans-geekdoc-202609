    > You may be forgiven for wondering why giving a user AdministratorAccess policy
    is safer than leaving your root account in active service. After all, both seem
    to have complete control over all your resources, right? Wrong, because there
    are powers that even an AdministratorAccess holder doesn''t, having the ability
    to create or delete account-wise budgets and enable MFA Delete on an S3 bucket.


