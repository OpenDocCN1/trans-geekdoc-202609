  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_100_0.png)


    # # Introduction


    Amazon''s Virtual Private Cloud service provides the networking layer of EC2.
    A VPC is a virtual network that can contain EC2 instances as well as network resources
    for other AWS services. By default, every VPC is isolated from all other networks.
    You can, however, connect your VPC to other networks, including the Internet and
    other VPCs.


    In addition to EC2, VPCs are fundamental to many AWS services, so understanding
    how they work is fundamental to your success on the exam and as an AWS architect.
    Don''t assume you can ignore VPCs because you''re not using EC2.


    A VPC can exist only within an AWS region. When you create a VPC in a region,
    it won''t show up in any other regions. You can have multiple VPCs and create
    multiple VPCs in a single region. I''ll start assuming only one VPC in one region.
    Later, I''ll consider considerations for multiple VPCs.


    If you''re familiar with the components of a traditional network, you''ll find
    many VPC components to be familiar. But although VPCs function like a traditional
    TCP/IP network, they are scalable, allowing you to expand and extend your network
    without having to add physical hardware. To make this scalability possible, some
    components that you''d find in a traditional network—such as routers, switches,
    and VLANs—don''t exist in VPCs. Instead, they''re abstracted into software functions
    and called by different names.


    # # VPC CIDR Blocks


    Like a traditional network, a VPC consists of at least one range of contiguous
    IP addresses. This address range is represented as a *Classless interdomain routing*
    (CIDR) block. The CIDR block determines which IP addresses may be assigned to
    instances and other resources within the VPC. You must assign a CIDR block when
    creating a VPC.


    There are different ways to represent a range of IP addresses. The shortest way
    is by CIDR notation, sometimes called *slash notation*. For example, the CIDR
    172.16.0.0/16 includes all addresses from 172.16.0.0 to 172.16.255.255—a total
    of 65,536 addresses!


    You may also hear the CIDR block referred to as an *IP prefix*. The /16 portion
    the CIDR is the *prefix length*. The prefix length of a VPC CIDR can range from
    /16 to /28. There''s an inverse relationship between the prefix length and the
    number of IP addresses'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'in the CIDR. The smaller prefix length, the greater the number of IP addresses
    in the CIDR. A /28 prefix length gives you only 16 addresses.


    The acronym IP refers to Internet Protocol version 4 or IPv4. Valid IPv4 prefix
    lengths from /0 to /32. Although you can specify any IP range for your VPC CIDR,
    it''s best to use in the RFC 1918 range to avoid conflicts with public Internet
    addresses.


    +   - 10.0.0.0–10.255.255.255

    - 172.16.0.0–172.31.255.255 (172.16.0.0/12)

    - 192.168.0.0–192.168.255.255 (192.168.0.0/16)


    If you plan on connecting your VPC to another network—whether on-premises network
    or another VPC—be sure the VPC CIDR you choose doesn''t overlap with addresses
    used in the other network.


    You can''t change the primary CIDR block, so think carefully about your address
    requirements before creating a VPC.


    # Secondary CIDR Blocks


    You may optionally secondary CIDR blocks for a VPC after you''ve created it. These
    blocks must come from either the same address range as the primary or a publicly
    routable range, but they must not overlap with the primary or other secondary
    blocks. For example, if your VPC''s primary CIDR 172.16.0.0/16, you may specify
    a secondary CIDR of 172.17.0.0/16. But you may not specify 192.168.0.0/16.


    If you think might ever need a secondary CIDR, be careful about your choice of
    primary CIDR. If you choose 192.168.0.0/16 as your primary CIDR, you won''t be
    able to create a secondary CIDR using any of the RFC 1918 ranges.


    # IPv6 CIDR Blocks


    You may let assign an IPv6 CIDR to your VPC. Unlike the primary CIDR, which is
    an IP prefix of your choice, you can''t choose your IPv6 CIDR. Instead, AWS assigns
    one to your VPC at request. The IPv6 CIDR will be publicly routable prefix from
    the global unicast IPv6 address space. For example, AWS may assign you the CIDR
    2600:f1f8::80/56. Note that the prefix length of an IPv6 CIDR is always /56. Complete
    Exercise 4.1 to create your own VPC.


    **EXERCISE 4.1**


    # Create a New VPC


    Create a VPC with the primary CIDR 172.16.0.0/16.


    To complete this exercise using the AWS Command Line Interface, enter the following
    command:


    ```

    aws ec2 create-vpc-cidr-block 172.16.0.0/16

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Subnets


    A subnet is a logical container within a VPC that holds your EC2 instances. A
    subnet lets you isolate instances from each other, control how traffic flows to
    and from your instances, and lets you organize them by function. For example,
    you can create a subnet for web servers that need to be accessible from the Internet
    and another subnet for database servers that only the web instances can access.
    In concept, subnets are similar to virtual LANs (VLANs) in a traditional network.


    Every instance must exist within a subnet. Once you create an instance in a subnet,
    you can''t move it. You can, however, terminate it and create a different instance
    in another subnet. By extension, this also means you can''t move an instance from
    one VPC to another.


    # Subnet CIDR Blocks


    Each subnet has its own CIDR block that must be a subset of the VPC CIDR that
    it resides in. For example, if your VPC has a CIDR of 172.16.0.0/16, one of your
    subnets may have a CIDR of 172.16.100.0/24. This range covers 172.16.100.0–172.16.100.255,
    which yields a total of 256 addresses.


    AWS reserves the first and last IP addresses in every subnet. You can''t assign
    these addresses to instances. Assuming a subnet CIDR of 172.16.100.0/24, the following
    addresses would be reserved:


    +   - 172.16.100.0–172.16.100.253

    - 172.16.100.255


    The restrictions on prefix lengths for a subnet CIDR are the same as VPC CIDRs.
    Subnet blocks in a single VPC can''t overlap with each other. Also, once you assign
    a CIDR to a subnet, you can''t change it.


    It''s possible for a subnet and VPC to share the same CIDR. This is uncommon and
    won''t leave you room for additional subnets. More commonly, each subnet''s prefix
    length will be longer than the VPC''s to allow multiple subnets to exist in the
    same VPC.


    A subnet can''t have multiple CIDRs. Unlike a VPC that can have secondary CIDRs,
    a subnet can have only one. However, if a VPC has a primary CIDR and a secondary
    CIDR, your subnet''s CIDR can be derived from either. For example, if your VPC
    has the primary CIDR of 172.16.0.0/16 and a secondary CIDR of 172.17.0.0/16, a
    subnet in that VPC could be 172.17.12.0/24, as it''s derived from the secondary
    VPC CIDR.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Availability Zones


    A subnet can exist within only one availability zone (AZ, or zone for short),
    which is roughly analogous to a relatively small geographic location such as a
    data center. Although zones in an AWS region are connected, they are designed
    so that a failure in one zone doesn''t cause a failure in another.


    You can achieve resiliency for your applications by creating two subnets in different
    availability zones and spreading your instances across those zones. Table 4.1
    provides an example of two subnets in different availability zones.


    # TABLE 4.1 Subnets in different availability zones


    | Subnet | Availability Zone | Instance |

    | web-subnet1 | us-east-1a | web1 |

    | web-subnet2 | us-east-1b | web2 |


    In this example, if the us-east-1a zone fails, the instance web1 will fail because
    it''s in that zone. But web2, which is in the us-east-1b zone, will remain available.

    HHaving subnets in different availability zones is not a requirement. You can
    place all of your subnets in the same zone, but keep in mind that if that zone
    fails, all instances in subnets will fail as well. Refer to Figure 4.1 for an
    example of two instances in different availability zones.


    # FIGURE 4.1 VPC with subnets and instances


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_103_0.png)


    Complete Exercise 4.2 to practice creating a subnet.'
  merge: -1
  img_proc: true
