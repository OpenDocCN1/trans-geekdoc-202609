  md: '# Amazon Relational Database Service 101


    Depending on the edition you choose, Aurora is compatible with PostgreSQL and
    MySQL import and export tools and snapshots. Aurora is designed to let you seamlessly
    migrate from an existing deployment that uses either of those open source databases.
    For MySQL-compatible editions, Aurora supports only the InnoDB storage engine.
    Also, the Aurora Backtrack feature for MySQL lets you, within a matter of seconds,
    restore your database to any point in time within the last 72 hours.


    Microsoft SQL Server RDS offers multiple SQL Server versions: 2008 R2, 2012, 2014,
    2016, and 2017. For the edition, you can choose Express, Web, Standard, and Enterprise.
    The variety of flavors makes it possible to migrate an existing SQL Server database
    from an on-prem deployment to RDS without having to perform any database upgrades.


    # Licensing Considerations


    RDS provides two models for licensing the database engine software you run. The
    license included model covers the cost of the license in the pricing for RDS instance.
    The bring your own license (BYOL) model requires you to obtain a license for the
    database engine you


    License Included MariaDB and MySQL use the GNU General Public License (GPL) v2.0,
    and PostgreSQL uses the PostgreSQL license, all of which allow for free use of
    respective software.


    All versions and editions of Microsoft SQL Server that run on RDS include a license,
    as do Oracle Database Standard Edition One (SE1) and Standard Edition Two (SE2).


    Bring Your Own License The following Oracle database editions allow you to bring
    your own license:


    +   - Enterprise Edition (EE)

    - Standard Edition (SE)

    - Standard Edition One (SE1)

    - Standard Edition Two (SE2)


    # Database Option Groups


    Database engines offer various features to help you manage your databases and
    improve security. Option groups let you specify these features—called options—and
    apply them to one or more instances. Options require more memory, make sure your
    instances have ample memory and enable only the options you need.


    The options available for a database option group depend on the engine. Microsoft
    SQL Server and Oracle offer transparent data encryption (TDE), which causes the
    engine to encrypt data before writing it to storage. MySQL and MariaDB offer an
    audit plugin that lets you log logons and queries run against your databases.'
