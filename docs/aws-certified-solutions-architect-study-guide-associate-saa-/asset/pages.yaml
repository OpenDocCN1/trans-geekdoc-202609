- pgno: 223
  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_223_0.png)


    # # Introduction


    Reliability—sometimes called resiliency—is the ability of an application to avoid
    failure and recover from it quickly when it occurs. The degree of reliability
    your application will achieve is proportional to the amount of effort you put
    into the design front, as well as the money you spend to operate it. Achieving
    a high degree of reliability for your application is not a trivial matter and
    entails significant cost and complexity. Therefore, before begin architecting
    your AWS deployment, you have to decide how much reliability you need. The reliability
    of an application is quantified in terms of availability—the percentage of time
    the application is performing as expected.


    Once you decide how much availability you need, you can begin designing in part
    on the AWS environment. The level of availability your application can achieve
    depends on availability of the AWS resources it uses, including networking, compute,
    and storage. As you might expect, AWS resources aren''t going to be available
    100 percent of the time. They''ll fail, so how you plan for and handle these inevitable
    failures when they happen will have a significant impact on your application''s
    availability.


    In this chapter, you will learn how to design your AWS environment to tolerate
    failures so that the failure of an instance or even an entire availability zone
    doesn''t cause your application to become unavailable. You''ll also learn how
    to recover from unavoidable failures. If all of your application''s instances
    go down or if your application crashes because of a bug, security breach, database
    corruption, or just human error, you''ll know how to recover quickly.


    # # Calculating Availability


    A common way of quantifying and expressing reliability is in terms of availability.
    Availability is the percentage of time an application is working as expected.
    Note that "working as expected" implies that you have a certain expectation of
    how the application should work.


    Generally, you want application availability to be very high, 99 percent or greater.
    Table 9.1 lists the relationship between percentage availability and the amount
    of time an application is unavailable during the year.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Calculating Availability


    **TABLE 9.1** The relationship between annual availability percentage and time
    unavailable


    | Availability Percentage | Time Unavailable |

    |---|---|

    | 99% | 3 days, 15 hours, 39 minutes |

    | 99.9% | 8 hours, 45 minutes |

    | 99.95% | 4 hours, 22 minutes |

    | 99.99% | 52 minutes |

    | 99.999% | 5 minutes |


    You may hear availability measured in nines. For example, “2 nines” is 99 percent,
    “3 nines” is 99.9 percent, and so on. Some call 99.95 “3-1/2 nines,” which isn’t
    quite correct, but it’s easier and less confusing than saying “3 and 5/9 nines!


    # Availability Differences in Traditional vs. Cloud-Native Applications


    As an AWS architect you must understand how application design decisions affect
    reliability. The applications you run in the cloud will fall into one of two broad
    categories: traditional or cloud-native.


    # Traditional Applications


    Traditional applications are those written to run on and use the capabilities
    of traditional Linux or Windows servers. To deploy such an application on AWS,
    you’ll need to run it on one or more EC2 instances. If the application uses a
    database, you’ll need to run and manage your own database software on an EC2 instance
    or use the AWS-managed equivalent. If your application requires a relational database,
    you can use Amazon Relational Database Service (RDS). If it uses a nonrelational
    database like Redux, you can use ElastiCache for Redis. Traditional applications
    operate same whether they’re running on the cloud or in a data center. If you
    can “lift and shift” an application from the data center to the cloud without
    making any changes to the application code, then it’s a traditional application.


    Suppose you have a application running on a single EC2 instance backed by a multi-availability
    zone (AZ) RDS deployment. The application availability depends on the availability
    of both the EC2 instance and the RDS instance. Both of these are hard dependencies.
    To calculate the total availability of the application, you simply multiply the
    availability of hard dependencies. AWS advertises the availability of the EC2
    service in a region as 99.9 percent, and multi-AZ RDS as 99.95 percent. If you
    multiply these together (.9999 × .9995), you get 99.94 percent, which is about
    5 hours and 15 minutes of downtime per year.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Chapter 9 • The Reliability Pillar


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_225_0.png)


    You might wonder why you''d use RDS with an availability of 99.95 percent when
    you could run your own database on the EC2 service, which has 99.99 percent availability.
    The reason is that the 99.99 percent availability for EC2 refers to the EC2 instance
    itself, not to whatever database software you may have running on it. In contrast,
    the 99.95 percent availability RDS refers to the availability of the database.


    To increase availability, you can use redundant components. Let''s start with
    EC2. Suppose that instead of one EC2 instance, you use two EC2 instances in a
    different availability zone. Each EC2 instance runs the application, and an load
    balancer (ALB) connects to the instances in a target group. If the application
    on one instance fails or if the EC2 instance fails, the ALB will route connections
    to the remaining healthy instance. In this sense, the EC2 instances are redundant.
    To calculate the availability of these redundant components, you take 100 percent
    product of the instance failure rate. If the availability of an EC2 instance is
    99.99 percent then the failure rate of that instance is .01 percent. To calculate
    the availability for two EC2 instances, it would be follows:


    +   100% – (0.01% × 0.01%) = 99.999999%


    This is less than one second!


    But that''s for EC2. You also have to consider the database. The database represents
    a hard dependency, so you must multiply the database''s availability—99.95 percent—by
    the availability of the EC2 instances—99.999999 percent. The product would be
    about 99.949 percent, which is about 4 hours and 22 minutes of downtime a year.
    That''s not a big improvement. Notice that because the RDS instance is a hard
    dependency and its availability is 99.95 percent, you would not be able to do
    better this level of availability without introducing a redundant database. In
    this chapter, let''s show you how to do that.


    # Cloud-Native Applications


    Cloud-native applications are written to use the resources of a specific cloud
    platform like AWS. These may be serverless applications written to use Lambda
    functions. They may run on EC2 instances and store objects in S3 or DynamoDB instead
    of relational database for storing data. This is especially likely if the application
    requires low-latency access to data stored in a non relational format such as
    JavaScript Object (JSON). DynamoDB is also a popular choice for storing session
    state.


    Suppose you have an application on a single EC2 instance—just as a traditional
    app would—but is designed to use DynamoDB for database storage. In a single region,
    DynamoDB has an availability of 99.99 percent. Again, EC2 also has an availability
    of 99.99 percent. So considering these two factors, the total application availability
    is follows:


    +   99.99% x 99.99% = 99.98%


    This is about 1 hour and 45 minutes of downtime per year. Much better!'
