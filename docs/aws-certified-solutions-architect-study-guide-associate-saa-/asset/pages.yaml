- pgno: 328
  md: "# EXERCISE 13.1 (continued)\n\n5. Run the following AWS CLI command:\n\n```\n\
    aws cloudformation create-stack --stack-name web-stack --template-url\n[URL of\
    \ the web-stack.json template] --parameters ParameterKey=KeyName,\nParameterValue=[the\
    \ name of your SSH keypair] --capabilities CAPABILITY_\nNAMED_IAM\n```\n\n6. CloudFormation\
    \ will begin to create the web stack and the nested stack.\nnEnter the following\
