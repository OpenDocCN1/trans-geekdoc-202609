  md: '# Infrastructure Automation


    # 233


    The four AWS services that make up their Developer Tools (described together at
    https://aws.amazon.com/tools/) can facilitate CI/CD through an integrated environment
    for source code version control, application builds and testing, and then the
    final push to production—either within AWS or wherever it needs to go.


    # AWS CodeCommit


    CodeCommit is a Git-compatible code repository where you can safely store and
    access your code. CodeCommit is not GitHub or GitLab! It''s for several reasons:
    CodeCommit is deeply integrated into the AWS environment, because you can apply
    granular access control through AWS IAM, and as an AWS service, CodeCommit is
    highly scalable.


    # AWS CodeBuild


    When team members are ready to commit new code versions, you''d ideally want their
    updates to be compiled and run within your test environment immediately. Maintaining
    a build server 24/7 and configuring it with access permissions appropriate for
    each member of your team can be an expensive and complicated process.


    CodeBuild is a fully managed, virtualized build server that is scalable. That
    means it can handle as many resource-hungry builds and builds as you can throw
    at it, but it will cost you only for the time you''re actually using. CodeBuild
    will respond to a commit by compiling, testing, and packaging your code


    CodeBuild can handle code from S3, CodeCommit, Bitbucket, GitHub, and GitHub Enterprise,
    and it''s comfortable with Java, Python, Node.js, Ruby, Go, Android, .NET Core
    for Linux, and Docker.


    # AWS CodeDeploy


    You use CodeDeploy to pull code from either CodeCommit or your own build server
    and push it to applications running on Amazon EC2 or AWS Lambda. EC2 instances—organized
    into deployment groups—are controlled by an installed agent that regularly polls
    the CodeDeploy service for pending applications. Revisions are executed based
    on the instructions in an application specification (AppSpec) file, which maps
    the code, source files, and scripts that make up your deployment targets.


    # AWS CodePipeline


    CodePipeline is a kind of orchestration that can automatically manage all parts
    of your CI/CD process. As an example, the service can monitor CodeCommit (or a
    third-party service like GitHub) for updates; push the new code through the build
    process using tools like CodeBuild, Jenkins, and TeamCity; then deploy the revision
    using AWS services like CodeDeploy, Elastic Beanstalk, and CloudFormation.


    Figure 10.2 illustrates the role played by each of the AWS Developer Tools in
    a typical CI/CD deployment system.'
