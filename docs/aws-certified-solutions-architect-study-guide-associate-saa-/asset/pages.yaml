  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_278_0.png)


    # # Introduction


    The primary goal of information security is to protect data, which of course entails
    protect-ing resources that store and provide access to that data. To effectively
    protect data, there are three elements of the data you need to ensure: confidentiality,
    integrity, and availability.


    **Confidentiality** The only people or systems that can access data are those
    authorized to access it. Encryption and access control lists (ACLs) are two common
    mechanisms for enforcing confidentiality.


    **Integrity** The data has not been maliciously or accidentally changed. Cryptographic
    hash-ing and logging provide two ways to validate the integrity of data.


    **Availability** The data is available to those who need it when they need it.
    Although the data itself may be safe and sound, if an attacker carries out a denial-of-service
    (DoS) attack to prevent access to the data, then the data is not available to
    those who need it.


    In this chapter, you''ll learn how to apply security controls to every system
    that touches your data—storage, compute, and networking—to ensure the confidentiality,
    integrity, and availability of your data throughout its lifecycle.


    # # Identity and Access Management


    Your AWS credentials let you log into the AWS management console, manage services,
    view and edit resources, and so. Security in AWS begins with the foundation of
    identity, which is managed by the Identity and Access Management (IAM) service.
    Because your AWS credentials are the keys to the kingdom, the first order of business
    is to protect them from accidental exposure and unauthorized use. The second step
    is to ensure that users have only the permissions they need, and no more.


    # # Protecting AWS Credentials


    With some exceptions, if anyone is to interact with your AWS resources, they must
    be authenticated using a set of credentials. An entity that can take an action
    on an AWS'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Identity and Access Management 249


    resource is called a principal. You''ll sometimes see a principal also referred
    to as an identity. A principal can include the following:


    +   - The root user

    - An IAM user

    - An IAM role


    The root user has unrestricted access to your AWS account, so it''s a best practice
    to avoid using it for administrative tasks. Instead, create an IAM user and attach
    the AdministratorAccess AWS managed policy. For a detailed guide on securing the
    root user and creating an IAM user, refer to Exercise 6.1 in Chapter 6, “AWS Identity
    and Access Management”.


    Another crucial step in securing the root user is enable multifactor authentication
    (MFA). When you enable MFA, in addition to entering a username and password to
    log into the account, you must also enter a one-time passcode. This one-time passcode
    is generated by a physical or virtual MFA device, which is just an application
    you can install on your smartphone. When enabling MFA on the root account, losing
    your MFA device means being unable to log in as the root user? If this happens,
    you will need to contact Support to get back in.


    For IAM users, you can choose to enforce a password policy to ensure that all
    IAM users with access to the AWS Management Console have a secure password. A
    password policy can require any or all of the following:


    +   - Password complexity requirements such as minimum length, the use of lower
    and uppercase, numbers, and nonalphanumeric characters

    - Password expiration

    - Requiring an administrator to reset an expired password


    When you are an IAM user, you can choose to give that user AWS Management Console
    access, programmatic access, or both. AWS Management Console access requires a
    username and password. You may optionally assign an MFA token that the user must
    possess to sign in. Programmatic access via the AWS API, command-line interface
    (CLI), or an SDK requires an access key ID and secret access key.


    # Fine-Grained Authorization


    A fundamental concept in information security is the principle of least privilege.
    You should give IAM principals only to the resources they need and no more. By
    following this principle, you limit the impact that compromised credentials or
    malicious users can have on your AWS resources. You achieve tight control over
    your IAM principals through the use of policies.


    IAM principals have no permissions by default. In other words, simply creating
    an IAM user or role doesn''t grant any ability to do anything in your AWS account.
    IAM users and roles derive their permissions only from IAM policies. An IAM policy
    is effectively an ACL.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'You define the permissions a principal has by associating the principal with
    one or more policies. A policy contains one or more permission statements. Each
    permission statement consists of, at minimum, four elements.


    Effect The effect can be allow or deny. The effect controls whether to allow or
    deny action on a resource.


    Action/Operation Each AWS service has a set of actions or operations that it can
    perform on its resources. For example, the EC2 service includes a RunInstances
    action that creates a new instance.


    Resource An action may require you to specify one or more resources. For example,
    the EC2 RunInstances action requires an Amazon Image (AMI) ID. By specifying a
    resource in a permission statement, you can restrict access on a per-resource
    basis. For example, you can specify an AMI ID so that the RunInstances operation
    can be performed using only that specified image.


    Condition You may specify conditions that must be met for the permission to be
    granted. For example, you can allow only users from a particular IP address to
    perform the specified action. you can also require multifactor authentication
    or impose time-based restrictions on an action can be performed.


    Remember that an IAM group is not a principal. It''s not possible to perform actions
    under the auspices of a group in the way you would rule.


    # AWS Managed Policies


    AWS provides hundreds of prepackaged policies called AWS managed policies. These
    cover a variety of permissions commonly required by job roles, including network
    administrators, database administrators (DBAs), and security auditors. AWS updates
    these policies periodically to include new services.


    # Customer Managed Policies


    A customer managed policy is a stand-alone policy that you can create and attach
    to principals in your AWS account. When you update a Customer Managed Policy,
    the changes immediately apply to all of the principals that the policy is attached
    to. Also, IAM doesn''t overwrite your existing policy but creates a new version
    and maintains the last five versions you can revert if needed.


    # Inline Policies


    An inline policy is a set of permissions that are embedded in an IAM principal
    or group. Unlike AWS and customer managed policies that exist independently of
    any principals, an inline policy is a part of the principal itself. Inline policies
    are useful when you want to ensure a policy is not inadvertently attached to the
    wrong principal.'
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Permissions Boundaries\n\nWhen you attach a policy to a principal to grant\
    \ principal access, the policy is called a permissions policy. However, you can\
    \ also use a policy to define permissions boundaries. Permissions boundaries let\
    \ you limit the maximum permissions an IAM principal can be assigned. Permissions\
    \ boundaries prevent you from accidentally giving a user too many permissions\
    \ by inadvertently attaching the wrong permissions policy. You can set permissions\
    \ boundaries for a principal by selecting a managed policy that defines the maximum\
    \ permissions for the principal. For example, you may create the following policy\
    \ that allows all actions for the EC2 service and then attach this policy to an\
    \ IAM user as a permissions boundary:\n\n```\n{\n  \"Version\": \"2012-10-17\"\
    ,\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\":\
    \ \"ec2::*\",\n      \"Resource\": \"*\"\n    }\n  ]\n}\n```\n\nIf you then attach\
    \ the user AdministratorAccess policy—which grants full access to all AWS services—the\
    \ user will still be able to perform actions in EC2. The permissions boundaries\
    \ limit the user to performing only those actions laid out in the permissions\
    \ boundary policy. Complete Exercise 11.1 to create an IAM user whose permissions\
    \ are limited by a permissions boundary policy.\n\nEXERCISE 11.1\n\n# Create a\
    \ Limited Administrative User\n\nIn this exercise, you'll create an IAM user with\
    \ limited administrative privileges. You'll use policy boundary permissions to\
    \ allow the user to perform only actions in the EC2 service.\n\n+   1. Create\
    \ a customer managed policy called LimitedAdminPolicyBoundary. Populate the policy\
    \ document with the following content:\n\n```\n{\n  \"Version\": \"2012-10-17\"\
    ,\n  \"Statement\": [\n    {\n}\n```"
