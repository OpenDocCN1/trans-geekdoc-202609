  md: '# Configuring Instance Behavior


    You can optionally execute EC commands on your instance as it boots by pointing
    to user data in your instance configuration (this is sometimes known as bootstrapping).
    Whether you specify the data via the console configuration process or by using
    the --user-data argument with the AWS CLI, you can have script files running your
