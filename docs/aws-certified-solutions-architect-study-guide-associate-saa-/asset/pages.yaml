    # # Presigned URLs


    If you want to provide temporary access to an object that''s otherwise private,
    you can generate a presigned URL. The URL will be usable for a specified period
    of time, after which it will become invalid. You can build presigned URL generation
    into your code to provide object access programmatically.


    The following AWS CLI command will return a URL that the required authentication
    string becomes invalid after 10 minutes (600 seconds). The default expiration
    time is 3,600 seconds (one hour).


    ```

    aws s3 presign s3://MyBucketName/PrivateObject --expires-in 600

    ```


    Try it yourself with Exercise 3.3.


    # EXERCISE 3.3


    # Generate and Use a Presigned URL


    +   1. Use the complete URL of a private object in an S3 bucket belonging to you
    to generate a presigned URL using a variation of this command:

    aws s3 presign s3://MyBucketName/PrivateObject --expires-in 600


    +   2. Copy the full URL from the command output, from a browser''s that not logged
    into your AWS account, to open the file.


    +   3. Wait for the URL to expire and try again. This time, it should not work.


    # # Static Website Hosting


    S3 buckets can be used to host the HTML files for static websites. A website is
    static when the system services used to render web pages and scripts are all client
    rather than server-based. This architecture permits simple and clean HTML code
    that''s designed to be executed by the client browser. S3, because it''s an inexpensive
    yet reliable platform, it is an excellent hosting environment for sites. When
    an S3 bucket is configured for static hosting, traffic directed at the bucket''s
    URL can be automatically made to load a specified root document, usually index.html.
    Users can click links within HTML pages to be sent to the target page or media
    resource. Error handling and redirects can also be incorporated into the profile.'
