  md: '# Chapter 3 Amazon Simple Storage Service and Amazon Glacier Storage


    To reduce the risk of data loss or aborted uploads, AWS recommends that you use
    a feature called Multipart Upload for any object larger than 100 MB.


    As the name suggests, Multipart Upload breaks a large object into multiple smaller
    parts and transmits them individually to their S3 target. If one transmission
    should fail, it can be repeated without impacting the others.


    Multipart Upload will be used automatically when the upload is initiated by the
    AWS high-level CLI or API, but you will need to manually break up if you''re working
    with a low-level API.


    An programming interface (API) is a programmatic interface through which operations
    can be run through code or from the command line. AWS maintains APIs as the primary
    method of automation for each of its services. AWS provides low-level APIs for
    cases when S3 uploads require hands-on customization, and provides high-level
    APIs for operations that can be more easily automated. This page contains specifics:


    ```

    https://docs.aws.amazon.com/AmazonS3/latest/dev/uploadusingmpu.

    ```


    Work through Exercise 3.1 and create your own bucket.


    # EXERCISE 3.1


    # Create a New S3 Bucket and Upload a File


    +   1. From the AWS S3 Dashboard Overview page create a new bucket and use either
    the Dashboard or the AWS CLI s3 cp localfile.txt s3://bucketname/ to upload one
    or more files, giving public access to the object.


    +   2. From the file''s Overview in the S3 Dashboard (displayed when the bucket
    name is clicked), copy its public link, paste it into the URL field of a browser
    that''s logged into your AWS account, and confirm that you can open the file.


    # Encryption


    Unless it''s intended to be publicly available—perhaps as part of a website—data
    stored on S3 should always be encrypted. You can use encryption keys to protect
    your data while it''s at rest within S3 and by using only Amazon''s encryption
    API endpoints for data transfers—protect data during its journeys to S3 and other
    locations.


    Data can be protected using either server-side or client-side encryption.


    # Server-Side Encryption


    The “server-side” here is the S3 platform, and it involves AWS encrypt your data
    objects as they''re save to disk and decrypt when you send properly authenticated
    requests for retrieval.


    You can use one of three encryption options:


    +   Server-Side Encryption with Amazon S3-Managed Keys (SSE-S3), where AWS uses
    its own enterprise-standard keys to manage every step of the encryption and decryption
    process'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# S3 Durability and Availability 51


    +   - Server-Side Encryption with AWS KMS-Managed Keys (SSE-KMS), where beyond
    the SSE-S3 features, the use of an envelope key is added along with a full audit
    trail for tracking key usage. You can optionally import your own keys to the AWS
    service.


    +   - Server-Side Encryption with Customer-Provided Keys (SSE-C), which lets you
    provide your own keys for S3 to apply to your encryption


    # Client-Side Encryption


    It''s possible to encrypt data before it''s transferred to S3. This can be done
    using an AWS KMS-Managed Customer Master Key (CMK), which produces a unique key
    for each object before it''s uploaded. You can also use a Client-Side Master Key,
    which you provide through the Amazon S3 encryption client.


    Server-side encryption can greatly reduce the complexity of the process and is
    often preferred. Nevertheless, in some cases, your company (or regulatory oversight)
    might require that you maintain full control over your encryption keys, leaving
    client-side as the only option.


    # Logging


    Tracking S3 to event logs is disabled by default—S3 buckets can see a lot of activity,
    and not every user justifies the log data that S3 can generate.


    When enabling logging, you''ll need to specify a source bucket (the bucket activity
    you''re tracking) and a target bucket (the bucket to which you''d like the logs
    saved). Optionally, you can also specify delimiters and prefixes to make it easier
    to identify and organize logs from multiple source buckets that are saved to a
    single target bucket.


    S3-generated logs, which sometimes only appear after a short delay, will contain
    basic operation details, including:


    +   - The account and IP address of the requester


    +   - The source bucket name


    +   - The action that was requested (GET, PUT, etc.)


    +   - The time the request was issued


    +   - The response status (including error code)


    S3 buckets are used by other AWS services—including CloudWatch and CloudTrail—to
    store their logs or other objects (like EBS Snapshots).


    # S3 Durability and Availability


    S3 offers more than one class of storage for your objects. The class you choose
    will depend on how critical it is that the data survives no matter what (durability),
    how quickly you might need to retrieve it (availability), and how much money you
    have to spend.'
