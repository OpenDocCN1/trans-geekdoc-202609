- pgno: 204
  md: '# Zones and Zone Files


    A zone (or hosted zone as Route 53 calls it) is a subset of a DNS domain. A zone
    file is a text file that describes the way resources within the zone should be
    mapped to DNS addresses within the domain. The file consists of resource records
    containing the data fields listed in Table 8.1.


    TABLE 8.1 The data categories contained in a resource record from a zone file


    | Directive | Purpose |

    | --- | --- |

    | Name | The domain or subdomain name being defined |

    | TTL | The time to live before the record expires |

    | Record Class | The namespace for this record—usually IN (Internet) |

    | Record Type | The record type defined by this record (A, CNAME, etc.) |


    This following is a typical resource record defining the name server (NS) of the
    example.com domain as an Internet record (IN) with a one-hour TTL (1h) whose value
    is ns-750.awsdns-30.net.:


    ```

    example.com 1h IN NS ns-750.awsdns-30.net.

    ```


    # Record Types


    The record type you enter in a zone file''s resource record will determine how
    the record''s data is formatted and how it should be used. There are currently
    around 40 types in active, but Table 8.2 explains only the common ones that also
    happen to be offered by Route 53.


    TABLE 8.2 Some common DNS record types


    | Type | Function |

    | --- | --- |

    | A | Maps a hostname to an IPv4 address |

    | CNAME | Canonical name—allows you to define one hostname as an alias for another
    |

    | MX | Mail exchange—maps a domain to specified message transfer agents |

    | AAAA | Maps a hostname to an IPv6 IP address |'
  merge: -1
  img_proc: true
