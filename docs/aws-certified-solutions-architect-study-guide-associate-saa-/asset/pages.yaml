    # Summary


    Automation is certainly nothing new. System administrators have been writing scripts
    for decades to automate common (and often mundane) tasks. But in the cloud, automation
    can be extended to infrastructure deployments as well. Because of the flexibility
    of cloud infrastructure, the line between infrastructure—which has traditionally
    been static—and operations is becoming blurred. In the cloud, deploying infrastructure
    and operating it are essentially the same thing.


    Despite this, there are things to keep in mind. Because the infrastructure belongs
    to AWS, you have to use the AWS console, CLI, or SDKs to configure it. You can
    automate this using CloudFormation, or you can write your own scripts. Conversely,
    when it comes to configuring the operating system and applications running on
    instances, you can write scripts and use your own tool, or you can use the AWS
    provides services, namely, the AWS Developer Tools and Systems Manager. The combination
    of scripts, tools, and services is you to use to, but as an AWS architect, you
    need to understand all options available to you and how they fit together.


