- pgno: 324
  md: "![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_324_0.png)\n\n# Introduction\n\nOperations\
    \ include the ongoing activities required to keep your applications running smoothly\
    \ and securely on AWS. Achieving operational excellence requires automating some\
    \ or all of the tasks that support your organization's workloads, goals, and compliance\
    \ requirements.\n\nThe key prerequisite to automating is to define your infrastructure\
    \ and operations as annotated code. Unlike manual tasks, which can be time-consuming\
    \ and are prone to human error, tasks embodied in code are repeatable and can\
    \ be carried out rapidly. It's also easier to track code changes and repurpose\
    \ it for testing and experimentation. For us humans, annotated code functions\
    \ as de facto documentation of your infrastructure configurations and operational\
    \ workflows.\n\nIn this chapter, you'll learn how to leverage the following AWS\
    \ services to automate the deployment and operation of your AWS resources:\n\n\
    +   - CloudFormation\n- AWS Developer Tools, which include the following:\n  -\
    \ CodeCommit\n  - CodeDeploy\n  - CodePipeline\n- AWS Systems Manager\n\n# CloudFormation\n\
    \nAs learned in Chapter 10, \"The Performance Efficiency Pillar,\" CloudFormation\
    \ uses templates to let you simultaneously deploy, configure, and document your\
    \ infrastructure as code. Because CloudFormation templates are code, you can store\
    \ them in a version-controlled repository as you would any other. The resources\
    \ defined by a template compose a stack. When you create a stack, you must give\
    \ it a name that's unique within the account.\n\nOne advantage of CloudFormation\
    \ is that you can use the same template to build multiple identical environments.\
    \ For example, you can use a single template to define and deploy"
  merge: -1
  img_proc: true
- pgno: 325
  md: "two different stacks for an application, one for production and another for\
    \ development.\nThis would ensure both environments are alike as possible.\n\n\
    In this section, we will consider two templates: network-stack.json and web-stack.json.\n\
    To download these templates, visit https://www.wiley.com/go/sybesttestprep, follow\
    \ the instructions to log in, and then click to the resource page for this book.\n\
    \n# Creating Stacks\n\nIn a CloudFormation template, you define your resources\
    \ in the Resources section of the template.\nWe give each resource an identifier\
    \ called a logical ID. For example, the following snippet of the network-stack.json\
    \ template defines a VPC with the logical ID of PublicVPC:\n\n```\n\"Resources\"\
    : {\n  \"PublicVPC\": {\n    \"Type\": \"AWS::EC2::VPC\",\n    \"Properties\"\
    : {\n      \"EnableDnsSupport\": \"true\",\n      \"EnableDnsHostnames\": \"true\"\
    ,\n      \"CidrBlock\": \"10.0.0.0/16\"\n    }\n  }\n}\n```\n\nThe logical ID,\
    \ also sometimes called the logical name, must be unique within a template. The\
    \ VPC created by CloudFormation will have a VPC ID, such as VPC-038049405677fb48,\
    \ also known as the physical ID.\n\nCloudFormation can read templates only from\
    \ an S3 bucket. You can keep your templates anywhere, but for CloudFormation,\
    \ they must be in an S3 bucket. To create a stack Network using a template stored\
    \ in an S3 bucket, you can issue the AWS command-line interface (CLI) command\
    \ in the following format:\n\n```\naws cloudformation create-stack --stack-name\
    \ Network --template-url\n://s3.amazonaws.com/cf-templates-c23z8b2yvbmp-us-east-1/network-stack.json\n\
    ```\n\nYou can optionally define parameters in a template. A parameter allows\
    \ you pass custom values to your stack when you create it, as opposed to hard-coding\
    \ values into the template.\nFor instance, instead of hard-coding the Classless\
    \ Interdomain Routing (CIDR) block into a template that creates a VPC, you can\
    \ define a parameter that will prompt for a CIDR when creating the stack.\n\n\
    > Stack names and logical IDs are case-sensitive.\n\n![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_325_0.png)"
  merge: -1
  img_proc: true
- pgno: 326
  md: "# Deleting Stacks\n\nYou can delete a stack from the web console or the AWS\
    \ command-line interface (CLI). For instance, delete the stack named Network,\
    \ issue the following command:\n\n```\naws cloudformation delete-stack --stack-name\
    \ Network\n```\n\nIf termination protection is not enabled on the stack, CloudFormation\
    \ will immediately delete the stack and all resources that were created by it.\n\
    \n# Using Multiple Stacks\n\nYou don't have to define all of your AWS infrastructure\
    \ in a single stack. Instead, you can break your infrastructure across different\
    \ stacks. A best practice is to organize stacks by lifecycle and ownership. For\
    \ example, the network team may create a stack named Network to define the infrastructure\
    \ for a web-based application. The network infrastructure would include a private\
    \ virtual cloud (VPC), subnets, Internet gateway, and a route table. The development\
    \ team may create a stack named Web to define the runtime environment, including\
    \ a launch template, Auto Scaling group, application load balancer, IAM roles,\
    \ instance profile, and a security group. Each of these teams can maintain their\
    \ own stack.\n\nWhen using multiple stacks with related resources, it's common\
    \ to pass values from one stack to another. For example, an application balancer\
    \ in the Web stack needs the logical ID of the VPC in the Network stack. You therefore\
    \ need to pass the VPC's logical ID from the Network stack to the Web stack. There\
    \ are two ways to accomplish this: using nested stacks and exporting stack output\
    \ values.\n\n# Nesting Stacks\n\nBecause CloudFormation stacks are AWS resources,\
    \ you can configure a template to create additional stacks. These additional stacks\
    \ are called nested stacks, and the stack that creates them is called the parent\
    \ stack. To see how this works, we'll consider the network-stack.json and web-stack.json\
    \ templates.\n\nIn the template for the Web (web-stack.json), you'd define the\
    \ template for the Network stack as a resource, as shown by the following snippet:\n\
    \n```\n\"Resources\": {\n  \"NetworkStack\": {\n    \"Type\": \"AWS::CloudFormation::Stack\"\
    ,\n    \"Properties\": {\n      \"TemplateURL\": \"https://s3.amazonaws.com/cf-templates-c23z8b2vpmbb-us-east-1/network-stack.json\"\
    \n    }\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 327
  md: "The logical ID of the stack is NetworkStack, the TemplateURL indicates the\
    \ location of the template in S3. When you create the Web stack, CloudFormation\
    \ will also automatically create the Network stack first.\n\nThe templates for\
    \ your nested stacks can contain an Outputs section where you define values you\
    \ want to pass to the parent stack. You can reference these values in the template\
    \ for the parent stack. For example, the network-stack.json template defines an\
    \ output with the logical VPCID and the value of the VPC's physical ID, as shown\
    \ in the following snippet:\n\n```\n\"Outputs\": {\n  \"VPCID\": {\n    \"Description\"\
    : \"VPC ID\",\n    \"Value\": {\n      \"Ref\": \"PublicVPC\"\n    }\n}\n```\n\
    \nThe Ref intrinsic function returns the ID of the PublicVPC. The parent web-stack.json\
    \ template can reference this value using the Fn::GetAtt intrinsic function, as\
    \ shown in the following snippet from the Resources section:\n\n```\n\"ALTargetGroup\"\
    : {\n  \"Type\": \"AWS::ElasticBalancingV2::TargetGroup\",\n  \"Properties\":\
    \ {\n    \"VpcId\": { \"Fn::GetAtt\": [ \"NetworkStack\", \"Outputs.VPCID\" ]\
    \ }\n  }}\n```\n\nFollow the steps in Exercise 13.1 to create a nested stack.\n\
    \n# EXERCISE 13.1\n\n# Create a Nested Stack\n\nIn this exercise, you'll create\
    \ a nested stack that creates an EC2 Auto Scaling group and the supporting network\
    \ infrastructure. To complete this exercise, you'll need to know the name of a\
    \ secure shell (SSH) key pair in the region you're using.\n\n+   1. Visit https://www.wiley.com/go/gobytestprep\
    \ and click Resources. Download the web-stack.json and network-stack.json CloudFormation\
    \ templates.\n2. Create an S3 bucket and upload the network-stack.json template\
    \ to the bucket.\n3. Edit the web-stack.json template and locate the NetworkStack\
    \ resource. Change the TemplateURL value to the URL of the network-stack.json\
    \ template in S3.\n4. Upload the web-stack.json template to the S3 bucket you\
    \ used in step 2."
