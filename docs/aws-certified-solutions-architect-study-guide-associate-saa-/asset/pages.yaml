    # ## RAID-Optimized EBS Volumes


    You can optimize the performance and reliability of your disk-based data using
    a Redundant Array of Independent Disks (RAID). This is something admins have been
    doing in the data center for many years, but some RAID configurations can make
    a big difference when applied to EBS disks in the AWS cloud.


    RAID works by combining the space of multiple drives into a single logical device
    and then spreading/replicating your data across the entire array. The RAID 0 standard
    involves striping, where data is segmented and stored more than one device, allowing
    concurrent operations to bypass a single disk''s access limitations. This can
    greatly speed up IO performance for transaction-heavy operations like databases.
    RAID 0 does not add durability,


    RAID 1 creates mirrored sets of data on multiple volumes. Traditional RAID 1 arrays
    don''t use striping or parity, they won''t provide improved performance, but they
    do make your data more reliable since the failure of a single volume would not
    be catastrophic.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Chapter 10 ■ The Performance Efficiency Pillar


    RAID 1 is common for scenarios where data durability is critical and enhanced
    performance is not necessary.


    RAID 5 and RAID 6 configurations can combine both performance and reliability
    features, but to reduce IOPS consumption considerations, they''re not recommended
    by AWS. AWS does not recommend using RAID-configured volumes as instance drives
    since the failure of any single drive can leave the instance unbootable.


    Setting up a RAID array involves creating at least two EBS volumes of the same
    size and IOPS settings and attaching them to a running instance. You then use
    traditional OS tools on the instance—mdadm on Linux and diskpart on Windows—to
    configure the volumes for RAID. Make sure that the EC2 instance you are working
    with has enough to handle the extra load.


    # S3 Cross-Region Replication


    Even though S3 is a global service, the data in your buckets has to exist within
    a physical AWS region. Now, since your data is to a single region, there will
    be times when, for regulatory or performance considerations, you''ll want “boots”
    on the ground in more than one place. Use region replication to minimize latency
    for geographically dispersed clients or to increase reliability and durability.


    When configured, S3 Cross-Region Replication (CRR) will automatically sync contents
    of a bucket in one region to a second region. You set up CRR by creating a replication
    rule for your source bucket (meaning the bucket whose contents are replicated).
    You can choose to have all objects in your source replicated or only those matching
    a specified prefix.


    The replication rule must also define a destination bucket (meaning the bucket
    to which your replicated objects will be sent). The destination can be a bucket
    in a different region in your account, or even one from a different account.


    Once enabled, copies of objects saved to the source bucket will be created in
    the destination bucket. When an object is deleted from the source bucket, it will
    similarly disappear from the destination (unless versioning is enabled on the
    destination bucket). Exercise 10.2 will guide you through the process of syncing
    two buckets through CRR.


