    Table 3.2 illustrates the availability guarantees for all S3 classes.


    # TABLE 3.2 Guaranteed availability standards for all S3 storage


    | Availability guarantee | S3 Standard | S3 Standard-IA | S3 One Zone-IA | Reduced
