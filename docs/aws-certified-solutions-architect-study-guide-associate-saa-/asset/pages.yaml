  md: '# EXERCISE 4.2


    # Create a New Subnet


    Create a subnet in the VPC you created earlier. Choose an availability zone and
    assign the CIDR block 172.16.100.0/24.


    To complete this using the following AWS Command Line Interface commands, you''ll
