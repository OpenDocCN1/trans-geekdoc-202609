    # Roles


    IAM role is a temporary identity that a user or service seeking access to your
    account resources can request. This kind of authorization can solve lot of logistical
    problems.

    You might have users who occasionally need to shut down and restart EC2 instances
    after an update. To prevent accidental shutdowns, you''d rather not normally have
    power. The way sudo works on Linux or macOS machine—the run command syntax on
    Windows—can allow you to assume an authorizing role for as long as it''s needed

    You might also want to grant users from another AWS account—or users who sign
    in using a federated authentication service—access to resources on this account.
    An IAM role (which default expires after 12 hours) is often the best mechanism
    for making this work.

    You create a role by defining the trusted entity you want access to. There are
    four categories of trusted entity: AWS service; another AWS account (identified
    by account ID); a web identity that authenticates using a login with Amazon, Amazon
    Cognito, Facebook, or Google; and SAML 2.0 federation with a SAML provider you
    define separately.

    Once your entity is defined, you give it permissions by creating and attaching
    your own policy document or assigning one or more preset IAM policies. When a
    trusted entity assumes its new role, AWS issues a time-limited security token
    using the AWS


    Token Service (STS).


    # Authentication Tools


    AWS provides a wide range of tools to meet many user and resource management needs
    as possible. The IAM functionality that you''ve already seen is only part of the
    story. The Amazon Cognito, AWS Managed Microsoft AD, and AWS Single Sign-On services
    are for handling'
