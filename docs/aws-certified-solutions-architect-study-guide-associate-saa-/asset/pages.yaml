- pgno: 111
  md: '# Network Access Control Lists


    Like a security group, a network access list (NACL) functions as a firewall in
    that it contains inbound and outbound rules to allow traffic based on a source
    or destination CIDR, protocol, and port. Also, each VPC has a default NACL that
    can''t be deleted. But the similarities end there.


    A NACL differs from a security group in many respects. Instead of being attached
    to an ENI, a NACL is attached to a subnet. The NACL associated with a subnet controls
    what traffic may enter or exit that subnet. This means multiple NACLs can be used
    to control traffic between instances in the same subnet. If you want to, you have
    to use security groups.


    A subnet can have only one NACL associated with it. When you create a new subnet
    in a VPC, the VPC''s default NACL is associated with the subnet by default. You
    can modify the default NACL, or you can create a new one and associate it with
    the subnet. You can also associate a subnet with multiple NACLs, provided those
    subnets are all in the same VPC as the VPC.


    Unlike a security group, which is stateful, a NACL is stateless, meaning that
    it doesn''t track the state of connections passing through it. This is much like
    an access control list (ACL) on a traditional switch or router. The stateless
    nature of the NACL is why each one is preconfigured with rules to allow all inbound
    and outbound traffic, as discussed in the following sections.


    # Inbound Rules


    Inbound rules determine what traffic is allowed to ingress the subnet. Each rule
    contains the following elements:


    +   - Rule number

    - Protocol

    - Port range

    - Source

    - Action


    The default NACL for a VPC with IPv6 CIDR blocks comes prepopulated with the inbound
    rules listed in Table 4.5.


    TABLE 4.5 Default NACL inbound rules


    | Rule Number | Protocol | Port Range | Source | Action |

    |---|---|---|---||

    | 100 | All | All | 0.0.0.0/0 | Allow |

    | * | All | All | 0.0.0.0/0 | Deny |'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'NACL rules are processed in ascending order of the rule number. Rule 100 is
    the lowest-numbered rule, so it allows all traffic from any source. You can delete
    or modify this rule or create additional rules before or after it. For example,
    if you wanted to block only HTTP (TCP port 80), you could add the following:


    | Rule Number | Protocol | Port Range | Source | Action |

    |---|---|---|---||

    | 90 | TCP | 80 | 0.0.0.0/0 | Deny |


    This denies all TCP traffic with a destination port of 80. Because it''s the lowest-numbered
    rule in the list, it gets processed first. Any traffic not matching this rule
    would be processed by rule 100, which allows all traffic.


    The last rule in Table 4.5 is the default rule. It''s designated by an asterisk
    (*) instead of a number and is always the last rule in the list. You can''t delete
    or otherwise change the default rule. The default rule allows NACL to deny any
    traffic that isn''t explicitly allowed by any of the preceding rules. Complete
    Exercise 4.6 to create a custom NACL.


    # EXERCISE 4.6


    # Create an Inbound Rule to Allow Access from Any IP Address


    NACL rule order matters! Create a new NACL and attach it to the subnet you used
    in Exercise 4.3.


    +   1. In the VPC Dashboard, click Network ACLs.

    2. Click Create ACL.

    3. Select the VPC you used in previous exercises.

    4. Select the NACL and click the Inbound Rules.

    5. If you launched a Linux instance, add an inbound rule numbered 100 to allow
    SSH (TCP port 22) access from any IP address. If you launched a Windows instance,
    add an inbound rule to allow RDP (TCP port 3389) access from any IP address.

    6. Remove any rules that allow other inbound traffic.

    7. Connect to the instance and remain connected.

    8. Now add another inbound rule numbered 90 that denies all traffic. Your connection
    to the instance should drop.


    # Outbound Rules


    As you might expect, the outbound NACL rules follow an almost identical format
    as the inbound rules. Each rule contains the following elements:


    +   * Rule number

    * Protocol'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Network Access Control Lists


    +   * Port range

    * Destination

    * Action


    Each default NACL with the outbound rules listed in Table 4.6. Notice that the
    rules are identical to the default inbound rules except for the Destination element.


    # ### TABLE 4.6 Default NACL outbound rules


    | Rule Number | Protocol | Port Range | Destination | Action |

    |---|---|---|---|--|

    | 100 | All | All | 0.0.0.0/0 | Allow |

    | * | All | All | 0.0.0.0/0 | Deny |


    In many cases you will need these rules whether you use the default NACL or a
    custom. Because a NACL is stateless, it won''t automatically return traffic. Therefore,
    if you use HTTPS traffic with an inbound rule, you must explicitly permit the
    return traffic using an outbound rule. In this case, rule 100 permits the return
    traffic.

    If you need to restrict access from the subnet—to block Internet access, for example—you
    will need to create an outbound rule to return traffic over ephemeral ports. Ephemeral
    ports are reserved for TCP or UDP ports that listen for reply traffic on. On an
    example, when a client sends an HTTPS request to your instance over TCP port 80,
    that client may listen for a reply on TCP port 36034. Your NACL''s outbound rules
    must allow traffic to the subnet on TCP port 36034.

    The range of ephemeral ports varies by operating system. Modern operating systems
    use ephemeral ports in the range of 49152–65535, but don''t assume that only this
    range will be sufficient. For TCP ports may differ from the range for UDP, and
    older or customized systems use a different range altogether. To maintain compatibility,
    do not restrict outbound traffic using a NACL. Use a security group instead.

    If your VPC includes IPv6 CIDR, AWS will automatically add inbound and outbound
    rules to permit IPv6 traffic.


    # ## Using Network Access Control Lists and Security Groups


    You may want to use a NACL in addition to a security group so that you aren''t
    dependent upon users to specify the correct security group when they launch an
    instance. Because a NACL is applied to the subnet, the rules of the NACL apply
    to all traffic ingressing and egressing the subnet, regardless of how the security
    groups are configured.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'When you make a change to a NACL or security group rule, that change takes
    effect immediately (practically, within several seconds). Avoid changing security
    groups and NACLs simultaneously. If your changes don''t work as expected, it can
    become difficult to identify the problem with a security group or NACL. Complete
    your changes on one before moving to the other. Additionally, be cautious about
    making changes when there are active connections to an instance, as an incorrectly
    ordered NACL or missing security group rule can terminate those connections. Refer
    to Exercise 4.5 for a demonstration.


    Note that in NACL rule you can specify a CIDR only as the source or destination.
    This is unlike a security group wherein you can specify any security group for
    the source or destination.


    # Public IP Addresses


    A public IP address is reachable over the public Internet. This is in contrast
    to RFC 1918 addresses, which cannot be routed over the Internet but can be routed
    within private networks.


    You need a public IP address for an instance if you want to directly connect to
    it via the Internet. You may also give an instance a public IP address if you
    want to have outbound-only Internet access. You don''t need a public IP address
    for your instances to communicate with each other within the VPC infrastructure,
    as instance-to-instance communication happens using private IP addresses.


    When you launch an instance into a subnet, you can choose to automatically assign
    it a public IP. This is convenient, but there are a couple of potential downsides
    to this approach. First, if you forget to choose this option when you launch the
    instance, you cannot go back and have AWS automatically assign a public IP later.
    Also, when you stop or restart the instance, you will lose the public IP. If you
    stop and restart the instance, it will receive a different public IP.


    Even if you don''t plan to stop your instance, keep in mind that AWS may perform
    maintenance events that cause your instance to restart. If this happens, your
    IP address will change.


    If your instance doesn''t need to maintain the same IP address for a long period
    of time, this approach may be acceptable. If not, you may opt instead for an elastic
    IP address.


    # Elastic IP Addresses


    An elastic IP address (EIP) is a type of public IP address that AWS allocates
    to your account when you request it. Once AWS allocates an EIP to your account,
    you have exclusive use of that address until you manually release it. Outside
    of AWS, there''s no noticeable difference between an EIP and an automatically
    assigned public IP.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Network Address Translation 83


    When you initially allocate an EIP, it is not bound to any instance. Instead,
    you must associate it with an EIP around to different ENIs, although you can associate
    it with only one ENI at a time. Once you associate an EIP with an ENI, it will
    remain associate for the life of the ENI or you disassociate it.


    If you associate an EIP to an ENI that already has an automatically assigned public
    IP address located, AWS will replace the public IP address with the EIP. Complete
    Exercise 4.7 to practice allocating and using an EIP.


    # EXERCISE 4.7


    # Allocate and use an Elastic EIP address


    Allocate an elastic EIP address and associate it with the instance you created
    earlier.


    +   1. In the VPC Dashboard, click Elastic IPs.

    2. Click Allocate New Address.

    3. Click Allocate.

    4. Click the EIP, and under the Actions menu, click Associate Address.

    5. Select the instance you created earlier.

    6. Click Associate. The instance original public IP address should change to the
    EIP.


    # Network Address Translation


    When you associate an ENI with a public IP address, the ENI maintains its private
    IP address. Associating a public IP with an ENI does not reconfigure the ENI with
    a new address. Instead, the Internet gateway maps the public IP address to the
    ENI''s private IP address using a process called network address translation (NAT).


    When an instance with a public IP connects to a host on the Internet, the host
    sees the traffic originating from the instance''s public IP. For example, assume
    an instance with a private IP address 172.31.7.10 is associated with the EIP 35.168.241.48.
    When the instance attempts to send a packet to the Internet 198.51.100.11, it
    will send the following packet to the Internet gateway:


    | Source IP Address | Destination IP Address |

    |---|---|

    | 172.31.7.10 | 35.168.241.48 |


    The Internet gateway will translate this packet to change the source IP address
    to the instance''s public IP address. The translated packet, which the Internet
    gateway forwards to the host, looks like this:'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Source IP Address    Destination IP Address


    35.168.241.48    198.51.100.11


    Likewise, when a host on the Internet sends a packet to the instance''s EIP, the
    Internet gateway will perform network address translation on the incoming packet.
    The packet that reaches the Internet gateway from the Internet host will look
    like this:


    Source IP Address    Destination IP Address


    198.51.100.21    35.168.241.48


    The Internet gateway will translate this packet, replacing the destination IP
    address with the instance''s private IP address, as follows:


    Source IP Address    Destination IP Address


    198.51.100.21    172.31.7.10


    Network address translation occurs automatically at the Internet gateway when
    an instance has a public IP address. You can''t change this behavior. Network
    address translation as described here is also called one-to-one NAT because one
    private IP address gets mapped to one public IP address.


    # Network Address Translation Devices


    Although network address translation occurs at the Internet gateway, there are
    two other resources that can also perform NAT.


    +   - NAT gateway

    - NAT instance


    AWS calls these NAT devices. The purpose of a NAT device is to allow an instance
    to access the Internet while preventing hosts on the Internet from reaching the
    instance directly. This is useful when an instance needs to go out to the Internet
    to fetch updates or upload data but does not need to service requests from clients.
    When you use a NAT device, the instance needing Internet access does not have
    a public IP address allocated to it. Incidentallyally, this makes it impossible
    for hosts on the Internet to reach it directly. Instead, only the NAT device is
    configured with a public IP. Additionally, the NAT device has an interface in
    a public subnet. Refer to Table 4.7 for an example.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# TABLE 4.7 IP address configuration when using a NAT device


    | Name | Subnet | Private IP | Public IP |

    | --- | --- | --- | --- |

    | db1 | Private | 172.31.7.11 | None |

    | db2 | Private | 172.31.7.12 | None |

    | NAT device | Public | 172.31.8.10 | 18.209.220.180 |


    When db1 sends a packet to a host on the Internet with the address 198.51.100.11,
    the packet must first go to the NAT device. The NAT device translates the packet
    as follows:


    | Original Packet''s Source IP | Original Packet''s Destination IP | Translated
    Packet''s Source IP Address | Translated Packet''s Destination IP |

    | --- | --- | --- | --- |

    | 172.31.7.11 (db1) | 198.51.100.11 | 172.31.8.10 (NAT device) | 198.51.100.11
    |


    The NAT device then takes the translated packet and forwards it to the Internet
    gateway. The NAT gateway performs NAT translation on this packet as follows:


    | NAT Device Packet''s Source IP | NAT Device Packet''s Destination IP | Translated
    Packet''s Source IP Address | Translate Packet''s Destination IP |

    | --- | --- | --- | --- |

    | 172.31.8.10 (NAT device) | 198.51.100.11 | 18.209.220.180 (NAT device''s EIP)
    | 198.51.100.11 |


    Multiple instances can use the same NAT device, sharing the same public IP address
    for outbound connections. The function that NAT devices perform is also called
    port address translation (PAT).


    # Configuring Route Tables to Use NAT Devices


    Instances that use the NAT must send Internet-bound traffic to it, while the NAT
    device must send Internet-bound traffic to an Internet gateway. Hence, the NAT
    device and the instances that use it must use different routes. Furthermore, the
    NAT device must also use different routes hence must reside in separate subnets.


    Refer to Table 4.7 again. Notice that the instances reside in the Private subnet,
    and the NAT device is in the Public subnet. The default routes for these subnets
    would follow the pattern in Table 4.8.'
