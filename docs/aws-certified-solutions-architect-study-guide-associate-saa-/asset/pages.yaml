    In this exercise, you''ll create an Internet gateway and attach it to the VPC
    you used in the previous exercises.


    +   1. In the VPC Dashboard, click Internet Gateways.

    2. Click the Create Internet Gateway button.

    3. Click Create.

    4. Select the Internet gateway you just created, and under the Actions menu, click
    Attach to VPC.'
