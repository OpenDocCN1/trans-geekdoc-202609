  md: '# FIGURE 9.2 Scheduled action setting the desired capacity to 4 every Friday


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_235_0.png)


    This action will run every Friday, setting the desired capacity to 4, prior to
    the anticipated increased load.

    Note that you can combine scheduled actions with dynamic scaling policies. For
    example, if you are running an e-commerce site, you may use a scheduled action
    to increase the maximum group size during busy shopping seasons and rely on dynamic
    scaling policies to increase the desired capacity as needed.


    # Data Backup and Recovery


    As you learned in Chapter 2, “Chapter 3, “Amazon Simple Storage Service and Amazon
    Glacier Storage,” AWS offers several different data storage options. Although
    Amazon takes great pains to ensure the durability of your data stored on these
    services, data loss is always a possibility. AWS offers several options to help
    you store your data in a resilient manner as well as maintain-backs to recover
    when the inevitable data loss occurs.


    # S3


    All S3 storage classes except One Zone-Infrequent Access distribute objects across
    multiple availability zones. To avoid data loss from the failure of a single availability
    zone, be sure to use one of the other storage classes.


    To guard against deletion and data corruption, enable S3 versioning. With versioning
    enabled, S3 never overwrites or deletes an object. Instead, modifying an object
    creates a'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Data Backup and Recovery


    new version of it that can revert to if needed. Also, instead of deleting an object,
    S3 inserts a delete marker and removes the object from the view. The object and
    all of its versions still exist.


    To protect your data against multiple availability zone failures—the failure of
    an entire region—you can enable cross-region replication from a source bucket
    in one region and destination bucket in another. Once enabled, S3 will synchronously
    copy every object from the source bucket to the destination. Note cross-region
    replication requires versioning to be enabled on both buckets. Also, deletes on
    the source bucket don''t get replicated.


    # Elastic File System


    AWS Elastic File System (EFS) provides a managed Network File System (NFS) that
    can be shared among EC2 instances or on-premises servers. EFS files are stored
    across multiple zones in a region, allowing you to withstand an availability zone
    failure.


    EFS doesn''t come with versioning or native backup/restore capability. To protect
    against data loss and corruption, you can back up individual files to an S3 bucket
    or other EFS filesystem in the same region.


    # Elastic Block Storage


    EBS automatically replicates volumes across multiple availability zones in a region
    so they''re resilient to a single availability zone failure. Even so, data corruption
    is always a possibility.


    One of the easiest ways to back up an EBS volume is to take a snapshot of it.
    EBS snapshots across multiple availability zones in S3. You can either create
    a snapshot manually or use the Amazon Data Lifecycle Manager to automatically
    create a snapshot at regular intervals. To use the Amazon Lifecycle Manager, you
    create a Snapshot Policy and specify an interval of 12 or 24 hours, as well as
    a snapshot creation time. You also must specify the number of automatic snapshots
    to retain, up to 1,000 snapshots.


    One important but overlooked piece of data that gets stored on EBS is application
    logs. An application may create log files on the instance it''s running, but if
    the instance crashes or disconnects those files won''t be able to tell you what
    went wrong. And if EC2 Auto Scaling terminates an instance and its EBS volume
    along with it, log files stored locally are gone permanently. CloudWatch Logs
    can collect and store application logs from an instance in real time, letting
    you search and analyze them even after the instance is gone.


    # Database Resiliency


    When it comes to protecting your databases, your options vary depending on whether
    you''re using a relational database or DynamoDB.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'If you''re running your own relational database server, you can use the database
    engine''s native capability to back up the database to a file. You can then store
    the file in S3 or Glacier for safekeeping. Restoring a database depends on the
    particulars of the database you''re running but generally involves copying the
    backup file back to the destination instance and running an import process to
    copy the contents of the backup file into the database.


    If you''re using Amazon Relational Database Service (RDS), you always have the
    option of taking a simple database snapshot. Restoring from a database snapshot
    can take several minutes and always creates a new database instance.


    For additional resiliency, you can use a multi-AZ RDS deployment that maintains
    a primary instance in one availability zone and a standby instance in another.
    RDS replicates data synchronously from the primary to the standby. If the primary
    instance fails because of an instance or availability zone failure, RDS automatically
    fails over to the secondary.


    For maximum resiliency, use Amazon Aurora with multiple replicas. Aurora stores
    your database across three different availability zones. If the primary instance
    fails, it will fail over to one of the Aurora replicas. Aurora is the only RDS
    offering that lets you up to 15 replicas, which is more than enough to have one
    in each availability zone!


    DynamoDB stores tables across multiple availability zones, which in addition to
    giving you low-latency performance provides additional protection against an availability
    zone failure. For additional resiliency, you can use DynamoDB global tables to
    replicate your tables to different regions. You can also configure point-in-time
    recovery to automatically take backups of your DynamoDB tables. Point-in-time
    recovery lets you restore your DynamoDB tables to any point in time from 35 days
    until 5 minutes before the current time.


    # Creating a Resilient Network


    All of your AWS resources depend on the network, so designing your network properly
    is critical. When it comes to network design, there are two different elements
    to consider: your virtual private cloud (VPC) design and how users will connect
    to your resources within your VPC.


    # VPC Design Considerations


    When creating a VPC, make sure you choose a sufficiently large classless interdomain
    routing (CIDR) block to provide enough IP addresses to assign to your resources.
    The more redundancy you build in your AWS deployment, the more IP addresses you''ll
    need. When you scale out by adding more resources, you must have enough IP addresses
    to assign to those additional resources.'
  merge: -1
