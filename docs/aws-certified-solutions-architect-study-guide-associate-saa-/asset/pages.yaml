- pgno: 242
  md: 'If you do choose failover, you''ll need to do two things. First, you''ll change
    the Route 53 service resource to redirect users to the ALB in the standby region.
    Second, you''ll need to promote the read replica in the passive region to be the
    new primary database instance.


    # Availability Calculation


    Failures requiring manual intervention should be rare and would probably involve
    either a failure of the active region that requires failover to the passive region
    or database corruption that requires restoring from a snapshot. Assuming two failures
    a year, each equates to 40 minutes of downtime per year. That equates to over
    99.99% availability.


    Software and operating system updates require no downtime. When you need to do
    an update, you simply provide more instances alongside the existing ones. You
    upgrade the new instances and then gracefully migrate users to the new instances.
    In the event an upgrade breaks the application, directing users back to the original
    instances is trivial and quick.


    # Summary


    When it comes to maximizing availability, avoiding failure in the first place
    is job one. To avoid catastrophic application failures, run your application on
    multiple EC2 instances in different availability zones and distribute the load
    across such instances as much possible using an application balancer. If one instance
    or even an availability zone fails, ALB will route users from the failed instances,
    and your application will continue to be available.


    Another way to avoid application failures is to not overload individual instances.
    This is where EC2 Auto Scaling comes in. By implementing scaling policies, you
    can ensure you have enough instances to handle increased demand.


    But failures are inevitable, so the next highest priority is to recover from them
    when they occur. When you create an Auto Scaling group, Auto Scaling will ensure
    you always have a minimum number of healthy instances. When an instance becomes
    unhealthy, Auto Scaling will terminate and replace it.


    One potential cause of application failures is lost or corrupt data. Take advantage
    of automatic S3 versioning, cross-region replication, and EBS snapshots to keep
    backups of your application''s important data. For the database, use multi-AZ
    RDS and automated database instance snapshots to keep up-to-date copies of your
    database stored safely multiple availability zones.


