- pgno: 90
  md: 'Netflix, there are important differences. Glacier, for example, supports archives
    as large as 40 TB rather than the 5 TB limit in S3. Its archives are encrypted
    by default, while encryption on S3 is an option you need to select; and S3’s “human-readable”
    key names, Glacier archives are machine-generated IDs.


    But the biggest difference is the time it takes to retrieve your data. Getting
    the objects in an existing Glacier archive can take a number of hours, compared
    to nearly instant access from S3. That last feature really defines the purpose
    of Glacier: to provide inexpensive long-term storage for data that will be needed
    only in unusual and infrequent circumstances.


    Glacier does offer Expedited retrievals getting your data in minutes rather than
    hours. Expedited will incur a premium charge.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_90_0.png)


    In the context of Glacier, the term archive is used to describe an object like
    a document, video, or a TAR or ZIP file. Archives are stored in vaults—the Glacier
    equivalent of S3’s buckets. Glacier names do not have to be globally unique.


    # Storage Pricing


    Give you a sense of what S3 and Glacier might cost you, here’s a typical usage
    scenario. Imagine you make weekly backups of your company sales data that generate
    5 GB archives. You decide to maintain each archive in the S3 Standard Storage
    and Requests class for its first 30 days and then convert it to S3 One Zone (S3
    Zone-IA), where it will remain for 90 more days. At the end of 120 days, you will
    move your archives again, then to Glacier, where it will be kept for another 730
    days (two years) and then deleted.


    Once your rotation is in full swing, you’ll have a steady total of (approximately)
    20 GB in S3 Standard, 65 GB in One Zone-IA, and 520 GB in Glacier. Table 3.3 shows
    what storage will cost in the US East region at current rates at the time of writing.


    TABLE 3.3 Sample storage costs for data in the US East region


    | Class | Storage Amount | Rate/GB/Month | Cost/Month |

    |---|---|---|--|\| Standard | 20 GB | $0.023 | $0.46 |

    | One Zone-IA | 65 GB | $0.01 | $0.65 |

    | Glacier | 520 GB | $0.004 | $2.08 |

    | Total | | | $3.19 |'
