    # Roles


    A role is an IAM principal that doesn''t have a password or access key. Like any
    other IAM principal, a role may have permissions policies and a permissions boundary
    associated with it. An IAM user or AWS resource can assume a role and inherit
    the permissions associated with that role.


    Roles are particularly useful for allowing applications on EC2 instances to access
    AWS resources without having an access key. For example, if you''re running an
    application that requires access to DynamoDB, you can create a role that contains
    a permissions policy granting the appropriate access to DynamoDB. Such a permissions
    policy may look like:


