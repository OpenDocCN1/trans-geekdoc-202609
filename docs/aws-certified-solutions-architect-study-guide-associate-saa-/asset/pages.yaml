  md: '# Chapter 12 ■ The Cost Optimization Pillar


    shutdowns. As just you did with RIs, let''s look at the details. I will begin
    with a few important definitions.


    +   - Spot Price—The current going rate for spot instances of a given set of launch
    specifications (type, region, and profile values). Spot prices can rise or fall
    without warning, forcing a running instance to shut down.


    +   - Instance Interruption—You can choose one of three ways for EC2 to react
    when your maximum price is exceeded by the spot price: Terminate (permanently
    delete all associated resources and volumes), Stop (possible only when you''re
    using an EBS-backed AMI), and Hibernate.


    +   - Instance Pool—All unused EC2 instances matching a set of specifications.
    Spot fleets are drawn from matching spot instance pools.


    +   - Spot Fleet—A collection of spot instances (including on-demand instances)
    is launched to meet a spot fleet request. A spot fleet can be made up of instances
    using multiple launch definitions from multiple spot instance pools.


    +   - Request Type—When you configure a request from the Request Instances page,
    you are offered three requests: Request (a one-time instance request), Request
    And Maintain (to maintain target capacity using a fleet), and Reserve For Duration
    (request an uninterrupted instance for six or months).


    You can configure your request for spot instances from the EC2 Dashboard. Use
    the Request Instances page to set details such as your total capacity (the maximum
    instances or vCPUs you are running), the AMI and instance type you launched, whether
