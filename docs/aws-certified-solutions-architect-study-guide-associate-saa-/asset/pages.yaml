    # # Database Engines


    A database engine is simply the software that stores, organizes, and retrieves
    data in a database. Each database instance runs only one database engine. RDS
    offers the following six database engines to choose from:


    MySQL MySQL is for OLTP applications such as blogs and commerce. RDS offers the
    latest MySQL Community Edition, including 5.5, 5.6, and 5.7. MySQL offers two
    storage engines—MyISAM and InnoDB—but you use the latter as it''s the only one
    compatible with RDS-managed automatic backups.


    MariaDBDB is a drop-in binary replacement for MySQL. It was created over concerns
    about MySQL''s future after Oracle acquired the company it developed. RDS offers
    many versions of MariaDB, ranging from 10.0.17 to 10.2. MariaDB supports the XtraDB
    and InnoDB storage engines, which AWS recommends using the latter for maximum
    compatibility with RDS.


    Oracle Oracle is one of the most widely deployed relational database management
    systems. Some applications expressly require an Oracle database. RDS provides
    the following Oracle Database editions:


    +   * Standard Edition One (SE1)

    * Standard Edition Two (SE2)

    * Standard Edition (SE)

    * Enterprise Edition (EE)


    PostgreSQL PostgreSQL advertises itself as the most Oracle-compatible open source
    database. This is a good choice when you in-house applications that were developed
    for Oracle but want to keep costs down. RDS offers versions of PostgreSQL ranging
    from 9.32-R1 to 10.4-R1.


    Amazon Aurora Aurora is Amazon''s drop-in binary replacement for MySQL and PostgreSQL.
    Aurora offers better performance than both by using a virtualized storage layer
    that reduces the number of writes to the underlying storage. It provides three


    +   * MySQL 5.6-compatible

    * MySQL 5.7-compatible

    * PostgreSQL-compatible'
