    when creating a table. All items in a table must include a primary key but can
    otherwise have different attributes. Nonrelational—also called no-SQL databases—store
    unstructured data.


    **Know the database engines RDS supports.** RDS supports all of the most popular
    databases—MySQL, MariaDB, Oracle, PostgreSQL, Amazon Aurora, and Microsoft SQL
    Server. Understand the difference between the bring-your-own-license and licensed-included
    licensing models. Know which database engines support licensing models.


    Be able to select the right instance class and storage type give specific requirements.
    Memory and storage tend to be the constraining factors for relational databases,
    it''s crucial that you know how to choose the right instance class and storage
    type based on the performance needs of a database. Know the three instance classes:
    standard, memory, optimized. Also know how to relate to the different storage
    types: general-purpose SSD (gp2), provisioned IOPS SSD (io1), and magnetic.


    **Understand the differences between multi-AZ and replicas.** Both multi-AZ and
    replicas involve creating additional database instances, but there are some key
    differences. A replica can service queries, while a standby deployment in a multi-AZ
    cannot. A master instance asynchronously replicates data to replicas, while in
    a multi-AZ configuration, the primary instance synchronously replicates data to
    the standby. Understand how Aurora replicas work and how Aurora multi-AZ differs
    from multi-AZ with other database engines.


    **Be able to determine the appropriate primary key for a DynamoDB table.** DynamoDB
    tables give you two options for a primary key: A simple primary key consists of
    a partition key and contains a single value. DynamoDB distributes items across
    partitions based on the partition key. When using a simple primary key, the partition
    key must be unique. A composite primary key consists of a partition key and a
    sort key. The partition key does not have to be unique, but the combination of
    the partition key and the sort key.


    **Know how DynamoDB throughput works.** When you create a table, you must specify
    throughput in write capacity units and read capacity units. How many read capacity
    units depends on two things: whether the read is strongly or eventually consistent
    and how much data you read within one second. For an item of up to 4 KB in size,
    one strongly consistent read consumes one read capacity unit. Eventually consistent
    reads consume half of that. When it comes to write, one write capacity unit lets
    you write up to one 1 KB per second.'
