- pgno: 119
  md: '# VPC Peering


    a private IP address from the subnet and assigns it to the NAT gateway. For redundancy,
    you may create additional NAT gateways in different availability zones.


    After creating a NAT gateway, you must create a default route to direct Internet-bound
    traffic through your NAT gateway. The target you specify will be the NAT gateway
    ID, which follows the format nat-0750b9c8de7e59f. If you use multiple NAT gateways,
    you can create multiple default routes, each pointing to a different NAT gateway
    as the target.


    Because a NAT gateway doesn''t use an ENI, you can''t apply a security group to
    it. You can, however, apply a NACL to the subnet that it resides in.


    # NAT Instance


    A NAT instance is a normal EC2 instance that uses a preconfigured Linux-based
    AMI. You have to perform the same steps to launch it as you would any other instance.
    Functions just like a NAT gateway in respects, but there are some key differences.


    Unlike a NAT gateway, a NAT instance doesn''t automatically scale to accommodate
    increased bandwidth requirements. Therefore, it''s important that you select an
    appropriate instance type. If you choose an instance type that''s too small, you
    must upgrade to a larger instance type.


    Also, a NAT instance has an ENI, so you must apply a security group to it. You
    must also remember to assign it a public IP address. Lastly, you must disable
    the sourcedestination check on the NAT instance''s ENI. This allows the NAT instance
    to receive traffic addressed to an IP other than its own, and it also allows the
    instance to send traffic using a source IP that it doesn''t own.


    One advantage of a NAT instance is that you can use it as a bastion host, sometimes
    called a jump host, to connect to instances that don''t have a public IP. You
    can''t do this with a NAT gateway.


    You must create a default route to direct Internet-bound traffic to the NAT instance.
    The target of the default route will be the NAT instance''s ID, which follows
    the format i-0a1674fe5671dcb90.


    If you want to guard against instance or availability zones fails, it''s not as
    simple as just spinning up another NAT instance. You cannot create multiple default
    routes pointing to different NAT instances. If you need this level of resiliency,
    you''re better off using NAT gateways instance.


    # VPC Peering


    You can configure VPC peering to allow instances in one VPC to communicate with
    VPCs in another over the private AWS network. You may want to do this if you have
    instances in different regions that need to communicate. You may also want to
    connect your instances to another AWS customer''s instances.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'To enable VPC peering, you must set up a VPC peering connection between two
    VPCs. A VPC peering connection is a point-to-point connection between two and
    only two VPCs. You can have at most one peering connection between a pair of VPCs.
    Also, peered VPCs must not have overlapping CIDR blocks.


    With one exception, a peering connection allows only instance-to-instance communication.
    This means that in one VPC can use the peering connection only to connect to another
    instance in the peered VPC. You cannot use it to share Internet gateways or NAT
    devices. You can, however, use it to share a Network Load Balancer (NLB).


    If you have more than two VPCs you need to connect, you must create a peering
    connection between each pair. You cannot daisy-chain VPC peering connections together
    and route through them. This configuration allows transitive routing.


    To use a peering connection, you must create new routes in both VPCs to allow
    traffic to travel in both directions. For each route, the destination prefix should
    exist within the destination VPC. The target of each route must be the peering
    connection''s identifier, which begins with pcx-. Refer to Table 4.9 for examples
    of two routes you would create to enable peering between a pair of VPCs.


    # TABLE 4.9 Routes for VPC peering


    | Source VPC CIDR | Destination VPC CIDR | Target |

    |---|---|--|

    | 172.31.0.0/16 | 10.0.0.0/16 | pcx-067881cf1122b09dc |

    | 10.0.0.0/16 | 172.31.0.0/16 | pcx-067881cf1122b09dc |


    Notice that the routes are mirrors of each other. Again, this is to allow traffic
    in both directions. The destination CIDR doesn''t exactly match that of the destination
    VPC. If you want to enable peering only between subnets, you can specify the subnet
    CIDR instead.


    Inter-region VPC peering is not available for some AWS regions. Peering connections
    between regions have a maximum transmission unit (MTU) of 1500 bytes and do not
    support IPv6.


    # Summary


    The Virtual Private Cloud service provides the networking foundation for EC2 and
    other AWS services. AWS abstracts some networking components in such a way that
    their configuration is easier than in a traditional network, but you still need
    to have a solid grasp of networking fundamentals to architect VPCs.


    In each region, AWS automatically provides a default VPC with default subnets,
    a main route table, a default security group, and a default NACL. Many use a default
    VPC for a'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Exam Essentials


    long time without ever having to configure a VPC from scratch. This makes it all
    the more important that you as an AWS architect understand how to configure a
    virtual network infrastructure from scratch. There''s a good chance you won''t
    be allowed to modify an infrastructure that was built on top of a default VPC.
    Instead, you may be tasked with migrating it from the ground up—troubleshooting
    various issues along the way. Practice what you''ve learned in this chapter until
    creating fully functional VPCs becomes second nature to you.


    In a traditional network, you''re free to reconfigure server IP addresses, move
    them to different subsets, and move them to different physical locations. You
    have tremendous flexibility to change what you please. When creating a VPC, you
    don''t have that luxury. You must carefully plan your entire infrastructure up
    front, not just your network. It''s crucial that you understand how all the VPC
    and EC2 instances fit together.


    You begin by defining a IP address range for the VPC and representing it as a
    CIDR. The primary CIDR should be sufficiently large to accommodate all of your
    instances, but small enough to leave room for a secondary CIDR.


    After that, you divy up your VPC CIDR into subsets. Because a subnet is a container
    that resides in only one availability zone, you must make up-front decisions about
    where to place your instances. Once you create an instance in a subnet, you can''t
    move it.


    Prior to launching instances, you need to configure security groups, as every
    instance''s ENI must have at least one. One area where you do some flexibility
    is with network access control lists. You can associate a NACL with a subnet at
    any time or forgo NACLs altogether.


    If you want instances to be accessible to the Internet, you must provision an
    Internet gateway, create a default route, and assign public IP addresses. Those
    are the basics. If you choose to use a NAT gateway instance or a VPC peering connection,
    you''ll have to modify multiple route tables.


    # Exam Essentials


    Be able to determine the correct prefix length for a CIDR block based on the number
    of IP addresses you need in a VPC or subnet. Allowed prefix lengths range from
    /16 to /28. The longer the prefix length, the fewer of IP addresses you''ll have
    available.


    Understand the significance of a subnet. A subnet is a logical container that
    holds EC2 instances. Each subnet has a CIDR block derived from the CIDR of the
    VPC that it resides in. An instance in the subnet must take its private IP address
    from the subnet''s CIDR. AWS reserves the first four and last IP addresses in
    every subnet.


    Know the impact of an availability zone failure. If a zone fails, every subnet
    in that zone—and every instance in that subnet—will fail. To tolerate a zone failure,
    build redundancy into your instance deployments by spreading them across different
    zones.'
  merge: -1
  img_proc: true
