    # High Availability (Multi-AZ)


    To keep your database continuously available in the event of a database instance
    outage, you can deploy multiple database instances in different availability zones
    using RDS calls a multi-AZ deployment. In a multi-AZ deployment, you have a primary
    database instance in one availability zone that handles and writes to the database,
    and you have a standby database instance in a different availability zone. If
    the primary instance experiences an outage, it will failover to the standby instance,
    usually within minutes. Here are a few possible causes for a database instance
    outage:


    +   - Availability zone outage

    - Changing a database instance type

    - Patching of the instance''s operating system


    You can configure multi-AZ when you create a database instance or later. All engines
    support multi-AZ but implement it differently.

    If you enable multi-AZ after creating your instance, you''ll experience a significant
    performance hit, so be sure to do it during a maintenance window.


    # Multi-AZ with Oracle, PostgreSQL, MariaDB, MySQL, and Microsoft SQL Server


    In this multi-AZ deployment, all instances must reside in the same region. RDS
    synchronously replicates data from the primary to the standby instance. This replication
    can introduce latency, so be sure to use EBS-optimized instances and provided
    IOPS SSD storage.


    The standby instance is not a read replica and cannot serve read traffic. Your
    application connects to the endpoint name for the primary. When a failover occurs,
    RDS changes the DNS record of the endpoint to point to the standby. The only thing
    your application has is to reconnect to the endpoint.


    If using your own license model for Oracle, you must possess a license for both
    the primary and standby instances.'
