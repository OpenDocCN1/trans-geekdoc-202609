  md: '# Third-Party Automation Solutions


    Of course you can create your own infrastructure automation scripts using Bash
    and Windows PowerShell. Such scripts can connect directly to your AWS account
    and launch, manipulate, and delete resource stacks.


    Besides Bash and PowerShell scripts, third-party configuration management tools
    such as Puppet, Chef, and Ansible can be used to manage AWS infrastructure. Beyond
    simply defining and launching resource stacks, these managers can also actively
    engage with your deployments through operations such as configuration enforcement
    (continuously ensuring your resources aren''t drifting away from their configurations),
    version control (to ensure your code and software packages are kept up-to-date),
    and change management.


    The value of configuration management tools for cloud deployments is obvious that
    AWS has a managed service dedicated entirely to integrating Chef and Puppet tools:
    AWS OpsWorks.


    # AWS OpsWorks: Chef


    Using OpsWorks, you can build an infrastructure controlled by Chef by adding a
    stack (a container for EC2 instances and more layers). Layers are the definitions
    that add functionality to your stack. A stack might include a Node.js app layer
    along with a load balancer, an Amazon EC2 Container Service (ECS) cluster, or
    an RDS database instance. Chef recipes for managing your infrastructure can also
    be added as layers.


    OpsWorks deployments also include one or more apps. An app points to the application
    code you want to install on the instances running in your stack with some metadata
    providing accessibility to a remote code repository.


    # AWS OpsWorks: Puppet


    Firing up OpsWorks for Puppet Enterprise will allow you to launch an EC2 instance
    as a Puppet Master server, configure the R10K environment and module toolset,
    and give it access to your remote code. Once a server is running and you''ve logged
    in using the provided credentials, you''ll be ready to begin deploying your application
    to Puppet nodes.


    Your OpsWorks experience will probably be more successful if you''re already familiar
    with administering Chef or Puppet locally.


    # Continuous Integration and Continuous Deployment


    If your organization''s application is built from the code written by multiple
    developers and if you regularly update your application, you''re probably already
    using some kind of continuous integration and continuous deployment (CI/CD) process.
    CI/CD seeks to automate the workflow that moves a project from source code, through
    compiling (the build), and on to deployment. The goal is to provide a reliable,
    fast, and bug-free way to stay on top of application change.'
