    # EC2 Reserved Instances


    You learned about purchasing reserved instances (RIs) for 24/7 compute needs lasting
    at least 12 months in Chapter 2. But spending a few extra minutes on some of the
    details will help you make smarter and more effective choices.

    The basics are straightforward: you can have AWS set lower-cost, long-term compute
    pay for "purchasing" something called a reserved instance; instead, you''re just
    buying the right to use a regular EC2 instance. You can also purchase an instance
    through the Amazon EC2 Reserved Instance Marketplace, where you effectively take
    the time remaining on a reserved instance owned by other AWS users who changed
    their usage plans. Just as you would launching a new EC2 instance, you select
    an RI that matches the configuration details you''re after. Therefore, you''ll
    search by name (default or dedicated), instance type, and platform (choosing from
    OSs including Linux, SUSE, RHEL, Windows Server, and Microsoft SQL Server).

    However, exactly much you''ll save on your instance and how much flexibility you''ll
    get depends on decisions you make upfront. You can, for example, pay a bit more
    for a Convertible RI that will allow you to exchange your instance as long as
    the new instance has equal or greater value than the original. Convertible RI
    provides a discount up to 50 percent less than on-demand. A Standard RI can save
    up to 75 percent off on-demand, while, obviously, locking you in for the duration
    of the term to the instance profile you initially selected.

    Optionally, you can also specify a single availability zone, or for a cost premium,
    maintain the flexibility to run your RI in any AZ within your selected region.

    You can schedule an RI to launch within a specified recurring time window. You
    purchase on a schedule from the Scheduled Instances link in the EC2 Dashboard
    (rather than the regular Reserved Instances link).

    Finally, you can pay for your RI using any one of three payment options: Upfront
    (the lowest price), Partial Upfront, and No Upfront (billed hourly).


