  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_307_0.png)


    # # Introduction


    Through the previous chapters of this book you''ve explored many AWS cost planning
    basics. In Chapter 3, “Amazon Simple Storage Service and Amazon Glacier Storage,”
    for instance, you learned how to leverage different data storage classes to ensure
    the instant access you need for your newer data using, the S3 Standard class until
    you find the perfect stack for your application. The lower costs available for
    high-latency, long-term storage (using S3 Reduced Redundancy or Glacier) of older
    objects.


    You''re no doubt familiar with the Free Tier available on AWS accounts until your
    first year. The Free Tier makes it possible to experiment with light versions
    of just any combination of AWS resources until you find the perfect stack for
    your application. Used right, the tier can help you build excellent solutions
    architect skills without costing anything. Don''t be shy: use it.


    But you''re not quite there yet.


    Even if you do everything right and design the perfect, multiered, scalable, and
    highly available environment, it''ll be a complete waste if even it ends costing
    you up too much. No plan is complete without a solid cost assessment. And even
    if you did make it all happen for the right price, you are sure nothing expensive
    has accidentally been left running on any of the accounts under your control or
    haven''t been compromised by hackers?


    The best protection from unpleasant surprises is through understanding how you''re
    billed for using AWS services, how you can deploy resources in the most cost-effective
    way, and how you can automate cost event alerting protocols.


    That''s what you''ll learn about here.


    # # Planning, Tracking, and Controlling Costs


    The place to find account-level financial information is the Billing and Cost
    Management Dashboard, which is accessed via the My Billing Dashboard link in the
    drop-down menu at the top of the console. That''s where you can view past bills,
    manage credits, and'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Planning, Tracking, and Controlling Costs 279


    enter your tax registration information. The page also includes a quick visual
    overview of the current month''s cost activities.


    Right now, however, you''re more interested in how Billing and Cost Management
    Dashboard also links you to tools you''ll use to monitor and control your AWS
    spending. The precise function of these tools—and even the names AWS give them—will
    probably change over time. Their overall goal is clear: to provide deep insight
    into what your running resources are costing and how you can track them.


    # AWS Budgets


    The Preferences link you to a simple page where you choose the way you''d like
    to consume billing information. You can tell AWS to send ongoing billing reports
    to an S3 bucket you specify. You can also have AWS email billing alerts created
    through each Amazon CloudWatch Alerts (as you see in Chapter 7, "CloudTrail, CloudWatch,
    and AWS Config") or the newer AWS Budgets.


    Budgets are meant to track your ongoing resource-related costs and alert you if
    you projected usage levels outside of a predefined threshold. You, could, have
    an email alerting you when the total quarterly costs of transferring S3-based
    data between regions rise above a certain amount. Or you could create a budget
    to tell you when the volume of outbound data transferred to the Internet from
    Demand EC2 instances running in a specified AWS region exceeds, say, 100GB.


    You can create and apply allocation tags to your resources and use them as budgets.
    This will limit your alerts to only those resources belonging to a particular
    class. You could use this kind of filtering to track only staging or development
    environments, but not production.


    You activate and manage tags from the Cost Allocation Tags page, which is accessed
    by clicking the Cost Allocation link in Billing. User-defined tags can be created
    and managed using the Tag Editor accessed through the Resource Groups drop-down
    menu in the AWS Console. You use that page to find active resources as EC2 instances
    and S3 buckets and can create/or edit tags for those resources. Note the following:


    +   - Tags can take up to 24 hours before they apply in the Billing and Cost Management
    Dashboard.


    +   - Tags cannot be applied to resources that were launched before the tags were
    created.


    You''re allowed two free budgets per account. Subsequent tags will cost $0.02
    per month.


    You configure a budget by defining whether you want to track resource cost, usage,
    or to be sure you''re getting optimal value from your EC2 resource instances—instance
    utilization or instance coverage. You can narrow the scope of a budget by filtering
    it using parameters such as services, regions, tags, and usage type. Notification
    triggers are defined when thresholds are met (for instance, "Forecast usage is
    greater than 80 percent of the budgeted amount") and are sent to Simple Notification
    Service (SNS) or email addresses.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Exercise 12.1 shows you how to configure a simple budget to protect an account
    from unexpected, unauthorized, and expensive activity.


    # EXERCISE 12.1


    # Create an AWS Budget to Send an Alert


    +   1. Click the Budget link in the Billing and Cost Management console and then
    click Create Budget.

    2. Select the Cost budget option and select your budget.

    3. Give your budget a name (something descriptive like “Monthly-Limit” might work
