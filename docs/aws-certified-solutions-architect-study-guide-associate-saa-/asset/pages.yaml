    # Auto Scaling


    You''ve already learned about efficiently increasing your compute resources to
    meet demand using Auto Scaling. But don''t forget that an Auto Scaling configuration
    should also be set to scale your instances down as demand drops. You do this by
    configuring the scaler to decrease the group size when average usage of your instances
    drops below a threshold. This can make a big difference to your costs and is one
    of the greatest benefits of the entire compute cloud model.


    # Elastic Block Store Lifecycle Manager


    The EBS volumes attached to your EC2 instances are well protected by replication,
    like all technology, there''s no guarantee that nothing will ever happen. The
    best practice has always been to back up your volumes by making snapshots, but
    adding a new snapshot few hours can, over time, add up to some intimidating costs.


    The obvious solution is to delete old snapshots, leaving fewer copies online.
    Since, you''re not likely to get around to regularly doing that on your own, you''re
    better off automating. The Lifecycle Manager (accessed through the EC2 Dashboard)
    lets you create a rotation policy where you set the frequency at which new snapshots
    will be created and the maximum number of snapshots to retain.


    # Summary


    AWS budgets can be created to watch all or selected areas of your account usage
    and alert when you costs approach thresholds. You can use cost allocation tags
    to efficiently focus your budgets on subsets of your running resources.


    You can track historical billing costs, rates, and product attributes using both
    Cost Explorer and Cost and Usage Reports. Reports, however, is designed for the
    kind of big data analytics needed by particular large-scale operations.'
