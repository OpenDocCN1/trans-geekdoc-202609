- pgno: 336
  md: '# 308 Chapter 13 ■ The Operational Excellence Pillar


    +   - Centralized monitoring and control of deployments

    - Deployment of multiple applications at once


    # The CodeDeploy Agent


    The CodeDeploy agent is a service that runs on your Linux or Windows instances
    performs the hands-on work of deploying the application onto an instance. You
    can install the CodeDeploy agent on EC2 instance at launch using a Userdata script
    or you can bake it into an AMI. You can also use AWS Systems Manager to install
    it automatically. You''ll learn about Systems Manager later in the chapter.


    # Deployments


    To deploy an application using CodeDeploy, you must create a deployment that defines
    the compute platform, which can be EC2/On-premises or Lambda, and the location
    of the application source files. CodeDeploy currently only supports deployments
    from S3 or GitHub. CodeDeploy doesn''t automatically perform deployments. If you
    want to automate deployments, you can use CodePipeline, which we''ll cover later
    in the chapter.


    # Deployment Groups


    Prior to creating a deployment, you must create a deployment group to define which
    instances CodeDeploy will deploy your application to. A deployment group on an
    EC2 Auto Scaling group, EC2 instance tags, or on-premises instance tags.


    # Deployment Types


    When creating a deployment group for EC2 or on-premises instances, you must specify
    a deployment type. CodeDeploy gives you the following two deployment types to
    give you control over how you deploy your applications.


    # In-Place Deployment


    With an in-place deployment you deploy the application to existing instances.
    In-place deployments are useful for initial deployments to instances that don''t
    already have the application. These instances can be stand-alone, or in the case
    of EC2 instances, part of an Auto Scaling group.


    On each instance, the application is stopped and upgraded (if applicable) and
    then restarted. If the instance is behind an elastic load balancer, the balancer
    is deregistered before the application is stopped and then reristered to the load
    balancer after the deployment to the instances. Although an elastic load balancer
    isn''t required to perform an in-place deployment, having one already set allows
    CodeDeploy to prevent traffic from going to instances that are in the middle of
    a deployment.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Blue/Green Deployment


    A blue/green deployment is used to upgrade an existing application with minimal
    interruption. With Lambda deployments, CodeDeploy deploys a new version of a Lambda
    function and automatically shifts traffic to the new version. Lambda deployments
    always use the blue/green deployment type.


    In a blue/green deployment against EC2 instances, the instances in the deployment
    group remain untouched. A new set of instances is created to keep CodeDeploy deploys
    the application.


    Blue/green deployments require an Application, Classic, or Network Load balancer.
    CodeDeploy registers the instances to the load balancer''s group after a successful
    deployment. At the same time, instances in the original environment are deregistered
    from the target group.


    Now if you''re using an Auto Scaling group, CodeDeploy will create a new Auto
    Scaling group with the same configuration as the original. CodeDeploy will not
    modify the minimum, maximum, or desired capacity settings for an Auto Scaling
    group.


    You can choose to terminate the original instances or keep them running. You may
    choose to keep them running if you need them available for testing or forensic
    analysis.


    # Deployment Configurations


    When creating your deployment group, you must also select a deployment configuration.
    The deployment configuration defines the number of instances CodeDeploy simultaneously
    deploys to, and how many instances the deployment must succeed for the entire
    deployment to be considered successful. The effect of a deployment configuration
    differs based on the deployment type. There are three preconfigured deployment
    configurations you can choose from: OneATime, HalfATime, and AllAtOnce.


    # OneATime


    For in-place and blue/green deployments, if the deployment group has more than
    one instance, CodeDeploy must successfully deploy the application to one instance
    before moving to the next. The overall deployment succeeds if the application
    is deployed successfully to all but the last instance. For example, if the deployment
    succeeds to the first two instances in a group of three, the entire deployment
    succeeds. If the deployment fails any instance but the last one, the entire deployment
    fails.


    If the deployment group has only one instance, the overall deployment succeeds
    only if the deployment to the instance succeeds.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 310 Chapter 13 ■ The Operational Excellence Pillar


    For blue/green deployments, CodeDeploy reroutes traffic to each instance as deployment
    succeeds on the instance. If unable to reroute traffic to any instance except
    the last one, the entire deployment fails.


    # HalfAtTime


    For in-place and blue/green deployments, CodeDeploy will deploy up to half of
    the instances in the deployment group before moving on to the remaining instances.
    The entire deployment succeeds only if deployment to at least half of the instances
    succeeds.


    For blue/green deployments, CodeDeploy must be able to reroute traffic to at least
    half of the new instances for the entire deployment to succeed.


    # AllAtOnce


    For in-place and blue/green deployments, CodeDeploy simultaneously deploys the
    application to as many instances as possible. If the application is deployed to
    at least one instance, the entire deployment succeeds.


    For blue/green deployments, the entire deployment succeeds if CodeDeploy reroutes
    traffic to at least one new instance.


    # Custom Deployment Configurations


    You can also create custom deployment configurations. This is useful if you want
    to customize how many instances CodeDeploy attempts to deploy simultaneously.
    The deployment must complete successfully on these instances before CodeDeploy
    moves onto the remaining instances in the deployment group. Hence, the value you
    specify when creating a custom deployment configuration is called the number of
    healthy instances. The number of healthy instances can be a percentage of all
    instances or a number of instances.


    # Lifecycle Events


    An instance deployment is divided into lifecycle events, which include stopping
    the application (if applicable), installing prerequisites, installing the instance,
    and validating the application. During some of these lifecycle events, you can
    have the agent execute a lifecycle hook, which is a script of your choosing. The
    following are all the lifecycle events during which you can have the agent automatically
    run a script:


    ApplicationStop You can use this hook to gracefully stop an application prior
    to an inplace deployment. You can also use it to perform cleanup tasks. This event
    occurs prior to the agent copying any application files from your repository.
    This event doesn''t occur on original instances in a blue/green deployment, nor
    does it occur the first time you deploy to an instance.


    BeforeInstall This event occurs after the agent copies the application files to
    a temporary location on the instance, but before it copies them to their final
    location. If your application'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'files require some manipulation, such as decryption or the insertion of a unique
    identifier, this would be the hook to use.


    **AfterInstall** Once the agent copies your application files to their final destination,
    you can perform further needed tasks such as setting file permissions.


    **ApplicationStart** Use this hook to start your application. For example, on
    a Linux instance running on an Apache web server, this may be as simple as running
    a script that executes systemctl httpd start command.


    **ValidateService** Here you can check that the application is working as expected.
    For instance, you may check that it''s generating log files or if it''s established
    a connection to a backend database. This is the final event for in-place deployments
    that don''t use an elastic load balancer.


    **BeforeBlockTraffic** With an in-place deployment using an elastic load balancer,
    this event occurs once, before the instance is unregistered.


    **AfterBlockTraffic** This event occurs after the instance is unregistered from
    an elastic load balancer. You may use this hook to wait for user sessions or in-process
    transfers to complete.


    **BeforeAllowTraffic** For deployments using an elastic load balancer, this event
    occurs after the application is installed and validated. You may use this hook
    to perform any tasks needed to warm up the application or otherwise prepare to
    accept traffic.


    **AfterAllowTraffic** This is the final event for deployments using an elastic
    load balancer.

    Notice that not all of these lifecycle events can occur on all instances in a
    blue/green deployment. The BeforeBlockTraffic event, for example, wouldn''t occur
    on a replacement instance since it makes no sense for CodeDeploy to unregister
    a replacement instance from a load balancer during a deployment.

    Each script run a lifecycle event must complete successfully before CodeDeploy
    will allow the deployment to the next event. By default, the agent will wait one
    hour for the script to complete before it considers the instance deployment failed.
    You can optionally set the timeout to a lower value, as shown in the following
    section.


    # The Application Specification File


    The application specification file defines where the agent should copy the application
    files onto your instance and what scripts should run during the deployment process.
    You must place the file in the root of your application repository and name it
    appspec.yml. It consists of the following sections:


    **Version** Currently the only allowed version of the AppSpec file is 0.0.


    **OS** Because the CodeDeploy agent works only on Linux and Windows, you must
    specify one of these as the operating system.'
  merge: -1
  img_proc: true
