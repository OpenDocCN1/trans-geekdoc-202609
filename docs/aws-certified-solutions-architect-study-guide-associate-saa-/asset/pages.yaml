- pgno: 68
  md: '# Securing Your EC2 Instance


    You''ll use the 169.254.169.254 IP for the command no matter what your instance
    public or private IPs happen to be.


    Entries ending with a trailing slash (/) contain further subtles of information
    that can be displayed by curl. Adding a data type to curl command will then return
    the information you''re after. This example displays the role of the security
    groups used by the instance:


    ```

    $ curl http://169.254.169.254/latest/meta-data/

    security-groups launch-wizard-1

    ```


    # Securing Your EC2 Instance


    You are responsible for configuring appropriate and effective access controls
    to protect your EC2 instances from unauthorized use. Broadly speaking, AWS provides
    four tools to help you with this task: security groups, Identity and Access Management
    (IAM) roles, network address translation (NAT) instances, and key pairs.


    # Security Groups


    An EC2 security group plays the role of a firewall. By default, a security group
    will deny all incoming traffic. You define group behavior by setting policy rules
    that will either block or allow specified traffic types. From that point, any
    data coming into or leaving the perimeter will be measured against those rules
    and processed accordingly.


    Traffic is assessed by examining its source and destination, the network port
    it''s targeting, and the protocol it''s set to. A packet that uses TCP on the
    SSH port 22 could, for instance, only be allowed to a particular instance if its
    source IP address matches the local public IP used by computers in your office.
    Lets you open SSH access on your instance without having to worry about anything
    outside your company getting in.


    Using security groups, you can easily create sophisticated rule sets to manage
    access to your services. You could, say open a website to the whole world while
    blocking your backend servers to everyone besides members of your team.


    If necessary, you can update your security group rules or apply to multiple instances.


    > Security groups control traffic at the instance level. However, AWS also provides
    you with network access control lists (NACLs) that are associated with entire
    subnets rather than individual instances. Chapter 4, "Amazon Virtual Private Cloud,"
    discusses both security groups and NACLs.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# IAM Roles


    You can also access to AWS resources—including EC2 instances—through the use of
    IAM roles. You define an IAM role by giving it permissions to perform actions
    on specified services or resources within your AWS account. When a particular
    role is assigned to a user or resource, they''ll gain access to whichever resources
    were included in the role policies.


    Using roles, you can give a limited number of entities (other resources or users)
    exclusive access to your EC2 instances. But you can also assign an IAM role to
    an EC2 instance so that processes running within it can access the external tools—like
    an RDS database instance—it needs to do its work.


    You''ll learn more about IAM in Chapter 6, "Authentication and Authorization—AWS
    Identity and Access Management."


    # NAT Devices


    Sometimes you''ll need to configure an EC2 instance without a public IP address
    to limit its exposure to the network. Naturally, that it won''t have any connectivity.
    But that can present a problem because you''ll still need to give limited Internet
    access so it can receive security patches and software updates.


    One solution is to route traffic through your private instance and the Internet
    through a special device. AWS gives you two ways to do that: a NAT instance and
    a NAT gateway (see Figure 2,2). They''ll both do the job, but since a NAT gateway
    is a managed service, it doesn''t require that you manually launch and maintain
    an instance. Both approaches incur monthly charges.


    FIGURE 2.2 A NAT gateway providing network access to resources in private subnets


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_69_0.png)


    NAT routing will be discussed at greater length in Chapter 4.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Key Pairs


    As any professional administrator will know, remote login sessions on your running
    instances should never be initiated over unencrypted plain-text connections. To
    ensure properly secured sessions, you''ll need to generate a key pair, the public
    key to your EC2 server, and save its private half to your local machine. If you''re
    working with a Windows AMI, you''ll need the private key to retrieve the password
    you''ll need to authenticate into your instance. For a Linux AMI, the private
    key will allow you to open an SSH session.

    Each key pair AWS generates for you will remain within its original region and
    available for use with newly launched instances unless you delete.. should delete
    the AWS copy in your event key if it is lost or exposed. Be careful before messing
    with your keys: your access to an instance might depend on it.


    # Other EC2-Related Services


    This section will briefly introduce you to a few more EC2 features. Some of these
    won''t necessarily play a large role in the solutions architect exam but could
    definitely come handy for you in your work at some point. Others are only touched
    on here but will be examined in greater detail later in the book.


    # AWS Systems Manager


    Systems Manager Services (available through the AWS console) is a collection of
    tools for monitoring and managing the resources you have running in the AWS cloud
    and in your own on-premises infrastructure. Through the Systems Manager portal,
    you can organize your AWS resources into resource groups, various visualization
    tools for insights into the health and behavior of your operations, directly execute
    commands or launch tasks remotely without having to log on, automate patching
    and other lifecycle events, and manage service parameters and access secrets.


    # Placement Groups


    Placement groups are useful for multiple EC2 instances that require exceptionally
    low-latency network interconnectivity. There are two placement group strategies.


    +   - Cluster groups launch each associated instance within a single availability
    zone within close physical proximity to each other.

    - Spread groups separate instances physically across hardware to reduce the risk
    of failure-related data or service loss.


    # AWS Elastic Beanstalk


    Elastic Beanstalk lets you upload your application code and define a few parameters,
    and AWS will configure, launch, and maintain all the infrastructure necessary
    to keep it running.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Chapter 2 • Amazon Elastic Cloud and Amazon Elastic Block Store


    That might include EC2 load-balanced and autoscaled instances, RDS database instances,
    and all the network plumbing you would otherwise have built yourself.


    Compatible languages and platforms include .NET, Java, Node.js, Python, Docker.
    Elastic Beanstalk adds no charges for the running infrastructure itself.


    # Amazon Elastic Container Service and AWS Fargate


    Running Docker container-based applications at scale is the kind of thing that''s
    a natural fit for a cloud platform like AWS. Once upon a time, if you wanted to
    get done, you''d have to fire up one or more robust EC2 instances and manually
    provision them as your Docker hosts.


    With Amazon Elastic Container Service (ECS), however, AWS lets you launch a prebuilt
    Docker host instance and define the way your Docker containers to behave (as a
    task), and ECS will make it all happen. The containers will exist within an infrastructure
    that''s automated and fully integrated with your AWS resources.


    The recently released Fargate tool further abstracts the ECS configuration process,
    removing the need for you to run and configure instances for your containers.
    With Fargate, all you need to do package your application and set your environment
    requirements.


    # AWS Lambda


    "Serverless" applications are powered by programming code that runs on servers—just
    not under the control of the application servers. Instead, code can be configured
    to run when AWS''s Lambda servers are triggered by preset events.


    Lambda allows you to instantly perform any operation on demand at most any time
    without having to provision and pay for always-on servers.


    # VM Import/Export


    VM Import/Export allows you to move virtual machine images back and forth between
    your on-premises VMware environment and your AWS account (via an S3 bucket). This
    can make it much simpler to manage hybrid environments and efficiently migrate
    workloads up to the AWS cloud.


    # Elastic Load Balancing and Auto Scaling


    A load balancer directs user requests between multiple EC2 instances to more efficiently
    distribute server resources and improve user experience. Autoscaling will react
    to preset thresholds by automatically increasing or decreasing the number of EC2
    instances you have running to match demand.


    Both Elastic Load Balancing (ELB) and Auto Scaling can be closely integrated with
    your EC2 infrastructure, making for simple and seamless operation.'
  merge: -1
  img_proc: true
