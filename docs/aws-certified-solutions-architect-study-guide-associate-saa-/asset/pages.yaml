- pgno: 47
  md: '# AWS Reliability and Compliance


    Because low-latency access is so important, certain AWS services are offered from
    design-ated edge network locations. These services include Amazon CloudFront,
    Amazon Route 53, AWS Firewall Manager, AWS Shield, and AWS WAF. For a complete
    and up-to-date list of available locations, see https://www.amazon.com/about-aws/global-infrastructure/regional-product-services.


    Physical data centers are exposed within availability zones. There might be half
    dozen availability zones within a region, identified using names like us-east-1.


    You organize your resources from a particular region within one or more private
    clouds (VPCs). A VPC is effectively a network address space within which you can
    create network subnets and associate them with particular availability zones.
    When configured properly, this architecture can provide effective resource isolation
    and durable replication.


    # AWS Reliability and Compliance


    AWS has a lot of the regulatory, legal, and security groundwork covered before
    you launch your first service.


    AWS has invested significant planning and funds into resources and expertise relating
    to infrastructure administration. Its highly protected and secretive data centers,
    layers of redundancy, and carefully developed best-practice protocols would be
    difficult or even impossible for a large enterprise to replicate.


    Where applicable, resources on the AWS platform are compliant with dozens of national
    and international standards, frameworks, and certifications, including ISO 9001,
    FedRAMP, NIST, and GDPR. (See https://aws.amazon.com/compliance/programs/ for
    more information.)


    # The AWS Shared Responsibility Model


    Of course, these guarantees cover only the AWS platform. The way you use AWS resources
    is your business—and therefore your responsibility. So, it''s important to be
    familiar with the AWS Shared Responsibility Model.


    AWS guarantees the secure and uninterrupted operation of its “cloud.” That means
    physical servers, storage devices, networking infrastructure, and managed services.
    AWS customers, as illustrated in Figure 1.3, are responsible for whatever happens
    within cloud. This covers the security and operation of installed operating systems,
    client-side data, the movement of data across networks, end-user authentication
    and access, and customer data.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '14 Chapter 1 • Introduction to Cloud Computing and AWS


    # FIGURE 1.3 The AWS Shared Responsibility Model


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_48_0.png)


    # The AWS Service Level Agreement


    By "guarantee," AWS does not mean service disruptions or security breaches will
    never occur. Days may stop spinning, major electricity systems may fail, and natural
    disasters may happen. When something goes wrong, AWS will provide service credits
    to reimburse for their direct losses whenever uptime falls below a defined threshold.
    Of course, that will not help you recover customer confidence or business loss.


    The exact percentage of the guarantee will differ according to service. The service
    level agreement (SLA) rate for AWS EC2, for instance, is set to 99.99 percent—meaning
    that you can expect your EC2 instances, ECS containers, and EBS storage devices
    to be available for all around four minutes of each month.


    The important thing to remember is that it''s not if things will fail when. Build
    your applications to be geographically dispersed and fault tolerant so that when
    things break, your users will hardly notice.


    # Working with AWS


    Whatever AWS services you choose to run, you''ll need a way to manage them all.
    The browser-based management console is an excellent way to introduce yourself
    to a service''s features and how it will perform in the real world. There are
    few AWS administration tasks that you can''t do from the console, which provides
    plenty of useful visualizations and helpful documentation. But as you become more
    familiar with the ways things work, and especially as your AWS deployments become
    more complex, you''ll probably find yourself getting more of your serious work
    away from the console.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Working with AWS


    # The AWS CLI


    The AWS Command Line Interface (CLI) lets you run complex AWS operations from
    your local command line. Once you get the hang of how it works, you will discover
    that it can make things much simpler and more efficient.


    As an example, you will need to launch a half-dozen EC2 instances to make up a
    microservices environment. Each instance is meant to play a separate role and
    therefore will require a subtly different provisioning process. Clicking through
    window after window to launch the instances from the console can quickly become
    tedious and time-consuming, especially if you find yourself repeating the task
    every few days. But the whole process can alternatively be incorporated into a
    simple script that you can run from your local terminal or PowerShell interface
    using the AWS CLI.


    Installing and configuring the AWS CLI on Linux, Windows, or macOS machines is
    not hard at all, but the details might change depending on your platform. For
    the most-to-date instructions, see https://docs.aws.amazon.com/cli/latest/userguide/install.html.


    # AWS SDKs


    If you want to incorporate AWS resources into your application code, you will
    need to use an AWS software development kit (SDK) for the language you''re working
    with. AWS currently offers SDKs for many languages including Java, .NET, and Python,
    and a number of mobile SDKs that include Android and iOS. There are also toolkits
    available for Eclipse, Visual Studio, and VSTS.


    > You can see a full overview of AWS developer tools at https://aws.amazon.com/tools/.


    # Technical Support and Online Resources


    Things won''t always go smoothly for AWS just as it is everywhere else in life.
    Sooner or later, you will need some kind of technical or account support. There''s
    a variety of types of support, and you should understand what''s available.


    One of the first things you''ll need to decide when you create a new AWS account
    is which support you''d like. Your business needs and budget will determine the
    way you answer this question.


    # Support Plans


    The basic plan is free with every AWS account access to customer service, with
    documentation, white papers, and the support forum. Customer service covers billing
    and account support issues.


    The Developer plan starts at $29/month and adds access for one account holder
    to a Cloud Support associate along limited general guidance and “system impaired”
    response.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Chapter 1 ■ Introduction to Cloud Computing and AWS


    $100/month (and up), the Business plan will deliver faster guaranteed response
    times to unlimited users for help with "impaired" systems, personal guidance and
    troubleshootings, and a support API.


    Finally, Enterprise support plans cover all of the other features, plus direct
    access to AWS solutions architects for operational and design reviews, your own
    technical account manager, and something just like a concierge. For complex, mission-critical
    deployments, these benefits can make a big difference. But they''ll cost you at
    least $15,000 each month.


    You can read more about AWS support plans at https://aws.amazon.com/premiumsupport/compare-plans.


    # Other Support Resources


    There''s plenty of self-serve support available outside of the official support
    plans.


    +   * AWS community help forums are open to anyone with a valid AWS account (https://forums.aws.amazon.com).


    +   * Extensive and well-maintained AWS documentation is available at https://aws.amazon.com/documentation.


    +   * The AWS Well-Architected page (https://aws.amazon.com/architecture/well-architected/)
    is a hub that links to some valuable white papers and documentation addressing
    best practices for cloud deployment design.


    # Summary


    Cloud computing is built on the ability to efficiently divide physical resources
    into smaller but flexible virtual units. These units can be "rented" by businesses
    on a pay-as-you-go basis and used to satisfy just any networked application and/or
    workflow needs in an affordable, scalable, and elastic way.


    Amazon Web Services provides reliable and secure resources that are replicated
    and globally across a growing number of regions and availability zones. AWS infrastructure
    is designed to be compliant with best-practice and regulatory standards—although
    the Shared Responsibility Model explains where you take place within the cloud.


    The growing family of AWS services covers just any daily needs you can imagine,
    with core services addressing compute, networking, database, storage, security,
    and application management and integration needs.


    You manage your AWS resources from the management console, with the AWS CLI, or
    through code generated using an AWS SDK.


    Technical and account support is available through support plans and through documentation
    and help. AWS also makes white papers and developer guides available for free
    as Kindle books. You can access them at this address:


    https://www.amazon.com/default/e/B00TR6MVQ6/ref=dp_by_line_cont_ebook_1?redirectedFromKindleDb=true'
