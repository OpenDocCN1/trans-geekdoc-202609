    be installed during a maintenance window that you specify. Alternatively, you
    can forego a maintenance window and patch your instances immediately. Patch Manager
    executes the AWSRunPatchBaseline document to perform patching.


    # State Manager


    While Patch Manager can ensure your instances are all at the same patch level,
    State Manager is a configuration management tool that ensures your instances have
    the software you want them to and are configured in the way you define. More generally,
    State Manager can automatically run command and policy documents against your
    instances, either one time only or on a schedule. For example, you may want to
    install antivirus software on your instances and then take a state inventory.


    To use State Manager, you must create an *association* that defines the document
    parameters you want to pass to, the target instances, and the schedule. Once you
    create an association, State Manager will immediately execute it against the target
    instances. Otherwise, it will follow the schedule.


    There is currently only one document you can use with State Manager: AWS-GatherSoftwareInventory.
    This document defines what specific metadata to collect from your instances. Despite
    the name, in addition to collecting software inventory, you can also collect network
    configurations, file information, CPU information, and, for Windows, registry
