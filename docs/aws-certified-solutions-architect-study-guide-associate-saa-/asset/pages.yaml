    # Enforcing Service-Level Protection


    In addition to defining identity-based policies to control access to resources,
    some AWS services allow you to define resource-based policies. For example, S3
    offers optional bucket policies that control access to objects or entire buckets.
    The Key Management Service (KMS) requires you to define a key policy to specify
    the administrators and users of it. SNS topics have resource policies to control
    who may publish messages or subscribe to a topic, as well as which delivery policies
    they may use. Simple Queue Service (SQS) and queues use resource-based policies
    to control who can send and receive messages from a queue.


    Notice that users without AWS credentials to consume the AWS services that offer
    resource-based policies. For example, an end user of an application may receive
    an SNS notification via email, even though they don''t have an AWS account. An
    anonymous user on the Internet may download a publicly accessible object stored
    in an S3 bucket. Resource-based policies give you control that you wouldn''t have
    with identity-based policies alone. With identity-based policies, use the principle
    of least privilege when creating resource-policies.


    # Detective Controls


    AWS offers a number of detective controls that can keep a record of the events
    that occur in your AWS environment, as well as alert you to security incidents
    or potential threats.


    # CloudTrail


    It''s important to carefully think about what you want to log and how you''ll
    use the information contained in those logs. CloudTrail can log activities on
    your AWS account. But before configuring CloudTrail, you need to decide the scope
    of the logging, including whether to log any of the following:


    +   - Management events, data events, or both


    +   - Read-only events, write-only events, or both'
