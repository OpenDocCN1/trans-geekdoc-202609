    # Instance Store Volumes


    Unlike EBS volumes, store volumes are ephemeral. This means that when the instances
    they are attached to shut down, their data is potentially lost. So, would you
    want to keep your data on an instance store volume more than EBS?


    +   - Instance store are SSDs that are physically attached to the server hosting
    your instance and connected via a fast NVMe interface.

    - The use of instance store volumes is included in the price of the instance itself.

    - Instance store volumes work well for deployment models where instances are launched
    to fill short-term roles (as part of autoscaling groups, for instance), import
    data from external sources, and are, effectively, disposable.


    Whether one or more instance store volumes are available for your instance will
    depend on the instance type you choose. This is an important consideration to
    take into account when planning your deployment.


    Even with all the benefits of EBS and instance storage, it''s worth noting that
    there will be cases where you are much better off keeping large data sets outside
    of EC2 altogether. For many cases, Amazon''s S3 service can be a dramatically
    less expensive way to store files or even databases that are nevertheless instantly
    available for compute operations.


    You''ll learn more about this in Chapter 3, "Amazon Simple Storage Service and
    Amazon Glacier Storage."


