  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_174_0.png)


    # Introduction


    CloudTrail, CloudWatch, and AWS Config are three AWS services that can help you
    ensure the continuing health, performance, and security of your AWS resources
    and applications. These services collectively help you keep an eye on your AWS
    environment by performing the following operational tasks:


    **Tracking Performance** Understanding how your AWS resources are performing can
    tell you if they''re powerful enough to handle the load you''re throwing at them
    or if you need to scale up or out. By tracking performance over time, you can
    identify spikes in usage and determine whether those are temporarily exhausting
    your resources. For example, if an EC2 instance maxes out its utilization during
    times of high usage, you may need to upgrade to a larger instance type or add
    more instances.


    **Detecting Application Problems** Some application problems may be latent and
    hidden or unreported by users. Checking application logs for warnings or errors
    can alert you to latent problems early. For example, the *exceptions* or *warning*
    in a log may indicate a data corruption, a timeout, or other issue that needs
    to be investigated before it results in a catastrophic failure.


    **Detecting Security Problems** Users having excessive permissions—or worse, access-ing
    resources they''re not supposed to—pose a security risk. Tracking user activities
    and auditing users can help you reduce your risk and improve your security posture.


    **Logging Events** Maintaining a log of every single action that occurs against
    your AWS resources can be invaluable in troubleshooting and security investigations.
    Problems and breaches are inevitable and sometimes go undiscovered until months
    later. Having a detailed record of what was did and when can help you understand
    the cause, impact, and scope of an issue. Just as importantly, you can use this
    information to prevent the problem in the future.


    **Maintaining an Inventory of AWS Resources** Understanding your existing resources,
    how they''re configured, and their relationships and dependencies can help you
    understand how proposed changes will impact your current environment. Maintaining
    an up-to-date inventory can also help you ensure compliance with baselines your
    organization adopted. Tracking your resource configurations over time makes it
    easy to satisfy auditing'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'requirements that demand documentation on how a resource was configured at
    a point in time in the past.


    CloudTrail, CloudWatch, and AWS Config are separate services that can be configured
    independently. They can also work together to provide a comprehensive monitoring
    solution for your AWS resources, and even on-premises servers.


    +   * CloudTrail keeps detailed logs of every event read or write action that
    occurs against your AWS resources, giving you a trail that includes what, who
    did it, when, and even their IP address.


    +   * CloudWatch collects numeric metrics from AWS and non-AWS resources such
    as on-premises servers. It also collects and stores logs from files and lets you
    search them easily, and provides alerts that can send you a notification or take
    action when a metric crosses a threshold.


    +   * AWS Config tracks how your resources are configured and how they change
    over time. You can view how your resources are related to one another and how
    they were configured at any time in the past. You can also compare your resource
    configurations against a baseline that you define and AWS Config alert you when
    a resource falls out of compliance.


    # CloudTrail


    An event is a record of an action that a principal performs against an AWS resource.
    CloudTrail logs read and write actions against AWS services in your account, giving
    you a detailed record of the action, the resource affected and its region, who
    performed the action, and when.


    CloudTrail logs both API and non-API actions. Non-API actions include logging
    into the management console. API actions include launching an instance, creating
    a bucket in S3, and creating a virtual cloud cloud (VPC). These are API events
    regardless of whether they''re performed in the AWS management console, with the
    AWS Command Line Interface, with an AWS SDK, or by another AWS service. CloudTrail
    classifies events into management and data events.


    # Management Events


    Management events include operations that a principal executes (or attempts to
    execute) against an AWS resource. AWS also calls management events control plane
    operations. Management events are further grouped into write-only and read-only
    events. Write-only events include operations that modify or hit resources. The
    RunInstances API operation may create a new EC2 instance and would be logged,
    regardless of whether the call was successful. Write-only events also include
    logging into the management console as the root or an IAM user. CloudTrail does
    not log unsuccessful root logins. Read-only events include API operations that
    read resources but can''t make changes, such as the DescribeInstances API operation
    that returns a list of EC2 instances.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Data Events


    Data events track two types of data plane operations that tend to be high volume:
    S3 object-level activity and Lambda function executions. For S3 object-level operations,
    CloudTrail distinguishes read-only and write-only events. GetObject is a read-only,
    while DeleteObject and PutObject are write-only events.


    # Event History


    By default, CloudTrail logs 90 days of management events and stores them in a
    viewable, searchable, and downloadable database called the event history. The
    event history does not include data events.


    CloudTrail creates a separate event history for each region containing the activities
    that occurred in that region. But events for global services such as IAM and Route
    53 are included in the event history of every region.


    # Trails


    If you want to store more than 90 days of event history or if you want to customize
    the types of events CloudTrail logs—for example, by specifying specific services
    or actions,you can create a trail.


    A trail records records specified events and delivers them as CloudTrail logs
    to an S3 bucket of your choice. A log file contains one or more log entries in
    JavaScript Object Notation (JSON) format. A log entry represents a single action
    against a resource and includes detailed information about the action including,
    but not limited to, the following:


    +   **eventTime** The date and time of the action, given in universal coordinated
    time (UTC). Log entries in a log are sorted by timestamp, but events with the
    same timestamp are not necessarily in the order in which the events occurred.


    +   **userId** Detailed information about the principal that initiated the request.
    This may include the type of principal (e.g., IAM role or user), its Amazon resource
    name (ARN), and IAM username.


    +   **eventSource** The global endpoint of the service against which the action
    was taken


    +   **eventName** The name of the API operation


    +   **awsRegion** The region resource is located in. For global services, this
    is always us-east-1.


    +   **sourceIPAddress** The IP address of the requester


    # Creating a Trail


    You can choose to log events from a single region or all regions. If you apply
    the trail to all regions, then whenever AWS launches a new region, they''ll automatically
    add it to your trail.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'You can create up to five trails for a single region. A trail that applies
    to all regions will count against this limit in each region. For example, if you
    create a trail in us-east-1 and then create another trail that applies to all
    regions, CloudTrail will consider you to have two trails in the us-east-1 region.


    After creating a trail, it can take up to 15 minutes between the time CloudTrail
    logs an event and the time it writes a log file to the S3 bucket.


    # # Logging Management and Data Events


    When you create a trail, you can choose whether to log management events, data
    events, or both. If you log management events, you must choose whether to log
    read-only events, write-only events, or both. This allows you to log read-only
    and write-only events to separate trails. Exercise 7.1 to create a trail that
    logs write-only events in all regions.


    EXERCISE 7.1


    # # Create a Trail


    In this exercise, you will configure CloudTrail to log write-only management events
    in all regions.


    +   1. Browse to the CloudTrail console and click Trails.


    +   2. Click the Create Trail button.


    +   3. Under Trail Name, enter a trail name of your choice. Names must be at least
    three characters and can''t contain spaces.


    +   4. For Apply To All Regions, select Yes.


    +   5. Under the Management Events heading, for Read/Write Events, select Write-only.


    +   6. Under the Storage location heading, for New S3 Bucket, select Yes. Remember
    that bucket names must be globally unique.


    +   7. Click the button.


    If you create a trail using the web console and log management events, the trail
    will automatically log global service events in the us-east-1 region. This means
    that if you create multiple trails using the web console, global events will be
    logged to each trail. To avoid duplicate events, you can disable global service
    events on an existing trail using the AWS CLI command cloudtrail update-trail
    --name mytrail --no-include-global-service-events. Alternatively, if a trail is
    configured to log to all regions and you reconfigure it to log only a single region,
    CloudTrail will disable global event logging for that trail. Another option is
    to forego the web console and create your trails using the AWS CLI, including
    the --no-include-global-service-events flag.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Chapter 7 • CloudTrail, CloudWatch, and AWS Config


    If you create a single-region trail to log data events, you can log only Lambda
    functions that exist in that region. If you create a trail that applies to all
    regions, you can log Lambda functions in any region. You''re limited to selecting
    a total of 250 individual objects per trail, including Lambda functions and S3
    buckets and prefixes. If you have more than 250 objects, you can instruct CloudTrail
    to log all Lambda functions or all S3 buckets.


    > NOTE Don''t log data events on the bucket that is storing your CloudTrail logs.
    Doing so would create an infinite loop!


    # Log File Integrity Validation


    CloudTrail provides a means to ensure that no log files were modified or deleted
    after creation. During quiet periods of no activity, it assures that no log files
    were delivered, as opposed to being delivered and maliciously deleted. This is
    useful in forensic investigations where someone with access to the S3 bucket may
    have tampered with the log file. For example, when an attacker hacks into a system,
    it is common for them to delete or modify log files to cover their tracks.


    With log integrity validation, every CloudTrail delivers a log file to the S3
    bucket, includes a cryptographic hash of the file. This hash is a unique value
    derived from the contents of the log file itself. If any byte of the log file
    changes, the hash changes. Make it easy to detect. Every hour, CloudTrail creates
    a separate file called a digest file that contains the cryptographic hashes of
    all log files delivered within the last hour. CloudTrail places this file in the
    same bucket as the log files but in a separate folder. This allows you to set
    different permissions on the folder containing the digest file to protect from
    deletion. CloudTrail also cryptographically signs the digest file using a private
    key that varies by region and places the signature in the S3 object metadata.


    Each digest file also contains a hash of the previous digest file, if it exists.
    If there are no events to log during a long period, CloudTrail creates a digest
    file. This lets you know that no log files were delivered during the period.


    You can validate the integrity of CloudTrail log and digest files using the AWS
    CLI. You must specify the ARN of the trail and a start time. The AWS CLI will
    validate all log files from the starting time to the present. For example, to
    validate all log files from January 1, 2018, to the present, issue the following
    command: cloudtrail validate-logs --trail-arn arn:aws:cloudtrail:us-east-1:account-id:trail/ben-trail
    --start-time 2018-01-01T00:00:00


    > NOTE By default, log files are encrypted using Amazon server-side encryption
    with Amazon S3-managed encryption keys (SSE-S3). For additional security, you
    can choose instead to use server-side encryption with AWS KMS-managed keys (SSE-KMS)
    for log files. The customer master key (CMK) you must use in the same region as
    the bucket. Digest files are always encrypted with SSE-S3.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# CloudWatch


    CloudWatch functions as a metric repository that lets you collect, retrieve, and
    graph numeric performance metrics from AWS and non-AWS resources. All AWS resources
    automatically send their metrics to CloudWatch. These metrics include EC2 CPU
    utilization, EBS volume read and write IOPS, S3 buckets, and DynamoDB consumed
    capacity units. Optionally, you can send custom metrics to CloudWatch from your
    applications and on-premises servers. CloudWatch Alarms send you a notification
    or take an action based on the value of these metrics. CloudWatch lets you collect,
    store, view, and search logs from AWS and non-AWS resources. You can also extract
    metrics from logs, such as the number of errors logged by an application or the
    number of bytes sent by a web server.


    # CloudWatch Metrics


    CloudWatch organizes metrics into namespaces. Metrics from AWS services are stored
    in AWS namespaces and use the format AWS/Service to allow for easy classification
    of metrics. For example, EC2 is the namespace for EC2, and AWS/S3 is the namespace
    for S3

    You can think of a namespace as a container for metrics. Namespaces help prevent
    confusion of metrics with similar names. For example, CloudWatch stores the metric
    from the Relational Database Service (RDS) in the AWS/RDS namespace, where the
    EBS metric VolumeWrite goes in the AWS/EBS namespace. You can create custom namespaces
    for custom metrics. For example, you may store metrics from an Apache web server
    under the custom namespace Apache. Metrics exist only in the region where they
    were created.


    A metric functions as a variable and contains a time-ordered set of data points.
    Each data point contains a timestamp, a value, and optionally a unit of measure.
    Each metric is uniquely defined by a name-pair that distinguishes metrics with
    the same name and namespace from one another. For example, if you have multiple
    EC2 instances, CloudWatch creates a CPU metric in the AWS/EC2 namespace for each
    instance. To uniquely identify each metric, AWS assigns it a dimension named InstanceId
    with the value of the instance''s resource identifier.


    # Basic and Detailed Monitoring


    How frequently an AWS service sends metrics to CloudWatch depends on the monitoring
    type the service uses. Most services support basic monitoring, and some support
    basic monitoring and detailed monitoring.


    Basic monitoring sends metrics to CloudWatch every five minutes. EC2 provides
    basic monitoring by default. EBS uses basic monitoring for gp2 volumes.\EC2 collects
    metrics every minute but only sends the five-minute average to CloudWatch. How
    EC2 sends data points to CloudWatch depends on the hypervisor. For instances using'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'the Xen hypervisor, EC2 publishes metrics at the end of the five-minute interval.
    For example, between 13:00 and 13:05 an EC2 instance has the following CPUUtilization
    metric measured in percent: 25, 50, 75, 80, and 10. The average CPUUtilization
    over the five-minute interval is 48. EC2 sends the CPUUtilization metric to CloudWatch
    with a timestamp of 13:00 and a value of 48.


    For instances using the Nitro hypervisor, EC2 sends a data point during a five-minute
    period, but a data point is a rolling average. For example, at 13:00, EC2 records
    a data point for the CPUUtilization metric with a value of 25. EC2 sends this
    data point to CloudWatch with a timestamp of 13:00. At 13:01, EC2 records another
    data point with a value of 50.7. It averages this new data point with the previous
    to get a value of 37.5. It then sends this new data point to CloudWatch, but with
    a timestamp of 13:00. The process continues for the rest of the five-minute interval.


    Services that use detailed monitoring metrics to CloudWatch every minute. More
    than 70 services support detailed monitoring including EC2, EBS, DynamoDB, ECS,
    and Lambda. EBS provides detailed monitoring for iol volumes.


    # Regular and High-Resolution Metrics


    The metrics generated by AWS services have a resolution of no less than one minute.
    For example, a measurement of CPUUtilization taken at 14:00:28 would have a timestamp
    of 14:00. These are called regular-resolution metrics. For some AWS services,
    such as EBS, CloudWatch stores metrics at a five-minute resolution. For example,
    if EBS delivers a VolumeBytes metric at 21:34, CloudWatch would record that metric
    with a timestamp of 21:30.


    CloudWatch can store custom metrics up to one second resolution. Metrics with
    a resolution less than one minute are high-resolution metrics. You can create
    your own custom metrics using the PutMetricData API operation. By publishing a
    custom metric, you can specify the timestamp to be up to two weeks in the past
    or up to two hours into the future. If you don''t specify a timestamp, CloudWatch
    creates one based on the time it received the metric.


    # Expiration


    You can delete metrics in CloudWatch. Metrics expire automatically, and when a
    metric expires depends on its resolution. Over time, CloudWatch aggregates higher-resolution
    metrics into lower-resolution.


    A high-resolution metric is stored for three hours. After this, all the data points
    from each minute-long period are aggregated into a single data point at one-minute
    resolution. The high-resolution data points simultaneously expire and are deleted.
    After 15 days, data points stored at one-minute resolution are aggregated into
    a single data point stored at five-minute resolution. These metrics are retained
    for 63 days. At the end of this retention period, 12 days data points from each
    metric are aggregated into a single 1-hour resolution metric and retained for
    15 months.


    To understand how this works, consider a VolumeBytes metric stored at five-minute
    resolution. CloudWatch will store the metric at this resolution for 63 days, after
    which'
