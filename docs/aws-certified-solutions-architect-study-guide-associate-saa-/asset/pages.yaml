- pgno: 214
  md: '# Summary


    The DNS system manages Internet resource addressing through two top-level name
    spaces: the Internet Protocol (IP addresses) and the domain hierarchy. The Internet
    Corporation for Assigned Names and Numbers (ICANN) administrates name servers
    and name registrars (like Route 53) through registry operators (like VerisSign).


    A fully qualified domain name consists of a TLD (like org or com) and an SLD (like
    amazon). FQDNs are also given a trailing dot representing "root".


    DNS configuration details are organized as hosted zones, where resource record
    sets control the way you want inbound traffic to direct. That behavior can be
    defined through any one of a record types like A, CNAME, and MX. and a list of
    servers to which requests can be directed.


    A newly created Route 53 zone will contain a start of authority (SOA) record set.
    You''ll need to create at least one record so Route 53 will know from which domain
    name to expect requests.


    Route 53 can be configured to regularly monitor the status of your resources using
    health checks. Besides alerting you to problems, health checks can also be integrated
    with Route 53 routing policies to improve application availability.


    Weighted routing policies direct traffic among multiple parallel resources proportionally
    according to their ability to handle it.


    Latency routing policies send traffic to multiple resources to provide the lowest-latency
    service possible.


    Failover routing monitors a resource and, on failure, reroutes subsequent traffic
    to a backup resource.


    Geolocation routing asesses the location of a request source and directs responses
    to appropriate resources.


    Amazon CloudFront is a CDN that caches content at edge locations to provide low-latency
    delivery of websites and digital media.


    # Exam Essentials


    Understand how DNS services enable predictable and reliable network communication.
    DNS registration ensures that domain names are globally unique and accessible.
    Domain requests are resolved using name servers—both local and remote.


    Understand DNS naming conventions. You should be familiar with "parsing" domain
    names. Each the TLD, SLD, and subdomain/host sections will be read by DNS clients
    in a predictable way.


    Be familiar with the key DNS record types. Recognize the function of key record
    types, including A and AAAA (address records for IPv4 and IPv6), CNAME (canonical
    name or alias), MX (mail exchange record), NS (name server record), and SOA (start
    of authority record).'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Be familiar with Route 53 routing policies. Recognize the function of key routing
    policies, including simple (for single resources), weighted (routing among multiple
    resources by percentage), latency (low-latency content delivery), failover (incorporate
    backup resources for higher availability), and geolocation (respond to end user''s
    location).


    Understand how to create a CloudFront distribution. CloudFront distributions can
    be configured to deliver content through low-latency, geographically-based content
    to end users.'
