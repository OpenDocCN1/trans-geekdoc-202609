  md: '# EXERCISE 2.6 (continued)


    +   - Some resources can''t be deleted because they''re in use by other resources.
    A snapshot taken by a private AMI is one example. You''ll need to shut down in
    the right order.


    +   - When you''re logged into your AWS account, you can check out your Billing
    And Cost Management Dashboard in the console (https://console.aws.amazon.com/billing/).
    This Dashboard will show you whether, taking into account your current resource
    usage, you stand to run up a bill in the current month.


    # Summary


    The base software that runs on an EC2 instance is defined by your choice of Amazon
    Machine Image and your user data at launch time, and the hardware profile is the
    product of an instance type. A tenancy setting determines whether your instance
    will share a physical host with other instances.


    As with all your AWS resources, it''s important to give your EC2 instances easily
    identifiable tags that conform to a system-wide naming convention. There are limits
    to the resources you''ll be allowed to launch within a single region and account-wide.
    Should you hit your limit, you can gain access to additional resources.


    If you plan to run an instance for a year or longer, you can save a significant
    amount of money over paying for on-demand by purchasing a reserve instance. If
    your workload can withstand unexpected shutdowns, then a spot instance could make
    some sense.


    There are four kinds of Elastic Block Store volumes: two high IOPS and low-latency
    SSD types and two traditional hard drives. Your workload and budget will inform
    your choice. In addition, EC2 instance types come with ephemeral store volumes
    that offer faster data access but whose data is lost when the instance is shut
    down.


    All EC2 instances are given at least one private IP address, and should they require
    Internet access, they can also be given a nonpublic public IP. If you require
    a permanent public IP, you can assign an Elastic IP to the instance.


    You secure to your EC2 instances using software firewalls known as security groups
    and can open secure and limited access through IAM roles, NAT instances or NAT
    gateways, and key pairs.


    # Exam Essentials


    Understand how to provision and launch an EC2 instance. You''ll need to select
    the right AMI and instance type, configure a security group, add any extra volumes
    that might be needed, point to any necessary user data and scripts, and, ideally,
    tag all the elements descriptive values.'
