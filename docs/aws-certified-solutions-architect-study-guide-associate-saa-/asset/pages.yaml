    # Reviewing and Optimizing Infrastructure Configurations


    If you want to achieve and maintain high-performance standards for your applications,
    you''ll need solid insights into how they''re going. To get those insights, you''ll
    need to establish a protocol for monitoring change. Your monitoring should have
    these four goals:


    +   * Watch for changes to your resource configurations. Whether a change occurred
    through the intervention of a member of your admin team or through an unauthorized
    hacker, it''s important to find out and assess the implications. The AWS Config
    service—discussed in Chapter 7, “CloudTrail, CloudWatch, and AWS Config”—should
    give you all the information you need to start.


    +   * Watch AWS announcements of changes to your services. Amazon is a busy company,
    and it regularly releases updates to existing services and entirely new services.
    To be sure your current configuration is the best for your needs, keep up with
    the latest available features and functionality. One way to do that is by watching
    the AWS Release Notes page (https://www.amazon.com/reasenotes/). You can subscribe
    to update alerts through the AWS Email Preference Center (https://pages.aws.cloud/communication-preferences.html).


    +   * Passively monitor the performance and availability of your application.
    Passive monitoring is primarily concerned with analyzing historical events to
    understand what—anything went wrong and how such failures can be avoided. The
    most important tool for this kind of monitoring is system logs. On AWS, the richest
    source of log data is CloudWatch, as you learned in Chapter 7.


    +   * Actively test the performance and availability of your application to proactively
    identify—and fix—potential problems before they cause any damage. This will usually
    involve load testing.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Reviewing and Optimizing Infrastructure Configurations


    # 235


    # Load Testing


    One particularly useful form of active infrastructure monitoring is load—or stress—testing.
    The idea is to subject your infrastructure to simulated workloads and carefully
    observe how it handles the stress. You can try to devise some method of yours
    that will generate enough traffic of the right kind to create a useful simulation,
    and there are plenty of third-party tools available to do it for you. Search the
    AWS Marketplace site (https://amazon.com/marketplace) for load testing.


    In many cases—you don''t prevent active users from accessing your application
    normal—you run your stress tests against some kind of test environment that''s
    configured to run at production scale. Orchestration tools like CloudFront, for
    containers, Amazon Elastic Compute Service (EC2), can be useful for building such
    an environment. Your might not respond the same way to requests from different
    parts of the world. So you should try to simulate traffic from multiple geographical
    origins into your testing.


    Make sure that your testing doesn''t break any AWS usage rules. Before launching
    some kinds of vulnerability or penetration tests against your infrastructure,
    you need to request explicit permission from AWS. You can find out more on Amazon''s
    Vulnerability and Penetration Testing page: https://aws.amazon.com/security/penetration-testing.


    Of course, don''t forget to set CloudWatch in advance so you can capture the results
    of your tests. To get the best out of your testing, it''s important to establish
    performance baselines and consistent key performance indicators (KPIs) so you''ll
    have an objective set of standards to compare your results. Knowing your aggregate
    cost per request or time to first byte, for instance, will give important context
    to what your testing returns.


    # Visualization


    All the active and passive testing in the world won''t do any good if you don''t
    have a user-friendly way to consume the data it produces. As you saw in Chapter
    7, you can trigger notifications when preset performance thresholds are exceeded.
    Having key team members receive Simple Notification Service (SNS) messages or
    email alerts about abnormal events can be an effective way to make your monitoring
    data count.


    In many cases, there''s no replacement for good, old-fashioned charts and graphs.
    AWS services have built-in visualizations. With an instance selected in the EC2
    Instances Dashboard, as an example, you can click the Monitoring tab in the lower
    half of the screen and view a dozen or metrics rendered as data charts.


    But the place where you''ll get the greatest visualization bang for your buck
    is in CloudWatch Dashboards. CloudWatch lets you create multiple Dashboards. As
    you''ll see when you work through Exercise 10.6, a Dashboard can contain multiple
    widgets, each of which can be defined to display a customized combination of metrics
    from individual AWS services. Keeping a well-designed Dashboard open in a browser
    tab where you can check it from time to time is potentially a useful monitoring
    strategy.'
  merge: -1
  img_proc: true
