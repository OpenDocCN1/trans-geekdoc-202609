    # Other Storage-Related Services


    It''s worth being aware of some other storage-related AWS services that, while
    perhaps not as common as the ones you''ve seen, can make a big difference for
    the right deployment.


    # Amazon Elastic File System


    The Elastic File System (EFS) provides automatically scalable and shareable file
    storage. EFS-based files are designed to be accessed from within a virtual private
    cloud (VPC) via Network File System (NFS) mounts on EC2 instances or from your
    on-premises servers through AWS Direct Connect. The objective is to make it easy
    to enable secure, low-latency, and durable file sharing among multiple instances.


    # AWS Storage Gateway


    Integrating the backup and archiving needs of your local operations with cloud
    storage services can be complicated. AWS Storage Gateway provides software gateway
    appliances (based on VMware ESXI, Microsoft Hyper-V, or EC2 images) with multiple
    connectivity interfaces. Local devices can connect to the appliance as though
    it''s a physical backup device like a tape drive, while the data is saved to AWS
    platforms like S3 and EBS.


