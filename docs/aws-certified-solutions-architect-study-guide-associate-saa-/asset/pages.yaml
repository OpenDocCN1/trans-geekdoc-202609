- pgno: 144
  md: '# Querying Data


    The trade-off for having flexibility to store unstructured data comes in terms
    of being more limited in your queries. Nonrelational databases are optimized for
    queries based on the primary key. Queries against other attributes are slower,
    nonrelational databases inappropriate for complex or arbitrary queries. Prior
    to creating a table, you need to understand the exact queries you''re going to
    need to perform against the data. Consider the following item:


    | Key | Type | Value |

    | --- | --- | --- |

    | Employee ID (primary key) | Number | 101 |

    | Department | String | Information technology |

    | Last Name | String | Smith |

    | First Name | String | Charlotte |


    If you wanted to list every department that has an employee named Charlotte, it
    would be difficult to obtain using a nonational database. Because items are sorted
    by Employee ID, the system would have to scan through every item to locate all
    items that have an attribute First Name with a value of Charlotte. And because
    the data in each item is unstructured, it may require searching through every
    attribute. It would then have to determine which of these items contain a Department
    attribute. Such a query would be slow and computationally expensive.


    # Types of Nonrelational Databases


    You may have nonrelational databases divided into categories such as key-value
    stores, document-oriented stores, and graph databases. But all nonrelational databases
    are key-value store databases.


    A document-oriented store is a particular application of a nonrelational database
    that analyzes the contents of a document stored as a value and extracts metadata
    from it.

    A graph database analyzes relationships between attributes in different items.
    This is different than a relational database that enforces relationships between
    records. A graph database discovers these relationships in unstructured data.


    # DynamoDB


    DynamoDB is a managed relational database service that can handle thousands of
    reads and writes per second. It achieves this level of performance by spreading
    your data across multiple partitions. A partition is an allocation of storage
    for a table, and it''s backed by solid-state drives in multiple availability zones.'
