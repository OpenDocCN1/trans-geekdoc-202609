  md: '# Auto Scaling groups


    An Auto Scaling group is a group of EC2 instances that Auto Scaling manages. When
    creating an Auto Scaling group, you must first specify either the launch configuration
    or launch template you created. When you create an auto scaling group, you must
    specify how many running instances you want Auto Scaling to provision and maintain
    using the launch configuration or template you created. Specifically, you have
    to specify the minimum and maximum size of the Auto Scaling group. You may optionally
    set the desired number of instances you want Auto Scaling to provision and maintain.


    **Minimum** Auto Scaling will ensure the number of healthy instances never goes
    below the minimum. If you set this to zero, Auto Scaling will not spawn any instances
    and terminate any running instances in the group.


    **Maximum** Auto Scaling will make sure the number of healthy instances never
    exceeds this. This might seem strange, but remember that AWS imposes service limits
    on how many instances you can run simultaneously. Setting your maximum to less
    than equal to your limit ensures you never exceed it.


    **Desired capacity** The desired capacity is an optional setting that must lie
    within the minimum and maximum values. If you do not specify a desired capacity,
    Auto Scaling will launch the number of instances as the minimum value. If you
    specify a desired capacity, Auto Scaling will add or terminate instances to stay
    at the desired capacity. For example, if you set the minimum to 1, and desired
    capacity to 10, then Auto Scaling will create 4 instances. If one of those instances
    gets terminated—example, because of human action or a host crash—Auto Scaling
    will replace it to maintain the desired capacity of 4. In the web console, desired
    capacity is also called the group size.


    # Specifying an Application Load Balancer Target Group


    If you use an application balancer to distribute traffic to instances in your
    Auto Scaling group, just plug in the name of the ALB target group when creating
    the Auto Scaling group. Whenever Auto Scaling creates a new instance, it will
    automatically add it to the ALB target group.


    # Health Checks Against Application Instances


    When you create an Auto Scaling group, Auto Scaling will strive to maintain the
    minimum number of instances, or the desired number if you''ve specified. If an
    instance becomes unhealthy, Auto Scaling will terminate and replace it.


    By default, Auto Scaling determines an instance''s health based on EC2 health
    checks. Recall from Chapter 7, “CloudTrail, CloudWatch, and AWS Config,” that
    EC2 automatically performs system and instance status checks. These checks monitor
    for instance problems such as memory exhaustion, filesystem corruption, or an
    incorrect network or startup'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Chapter 9 ■ The Reliability Pillar


    configuration, and system problems that require AWS involvement to repair. Although
    these checks can catch a variety of instance and host-related problems, they won''t
    necessarily application-specific problems.


    If you''re using an load balancer to route traffic to your instances, you can
    configure health checks for the load balancer''s target group. Target group health
    checks can check for HTTP response codes from 200 to 499. You can then configure
    your Auto Scaling group to use the results of these health checks to determine
    if an instance is healthy.


    If an instance fails the ALB health check, it will route traffic away from the
    failed instance, ensuring users don''t reach it. At the same time, Auto Scaling
    will remove the instance, create a replacement, and add the new instance to the
    load balancer''s group. The load balancer will then route traffic to the new instance.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_231_0.png)


    A good design practice is to have a few recovery actions that work for a variety
    of circumstances. An instance may crash due to memory condition, a bug, a deleted
    file, or an isolated network failure, but terminating and replacing the instance
    using Auto Scaling resolves all these cases. There''s no need to come up with
    a separate recovery action for each case when simply re-creating the instance
    solves all of them.


    # Auto Scaling Options


    Once you create an Auto Scaling group, you can leave it and it will continue to
    maintain the minimum or desired number of instances indefinitely. However, maintaining
    the current number of instances is just one option. Auto Scaling provides several
    other options to scale out the number of instances to meet demand.


    # Manual Scaling


    If you change the minimum, desired, or maximum values at any time after creating
    the group, Auto Scaling will immediately adjust. For example, if you have the
    desired capacity to 2 and change it to 4, Auto Scaling will launch two more instances.
    If you have four instances and set the desired capacity to 2, Auto Scaling will
    terminate two instances. Think of the desired capacity as a thermostat!


    # Dynamic Scaling Policies


    Most AWS-managed resources are elastic; that is, they automatically accommodate
    increased load. Some examples include S3, load balancers, Internet gateways, and
    network address (NAT) gateways. Regardless of how much traffic you through them,
    AWS is responsible for ensuring they remain available while continuing to perform
    well. But when it comes to EC2 instances, you''re responsible for ensuring they''re
    powerful and plentiful enough to meet demand.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# EC2 Auto Scaling


    Running out of instance resources—be it CPU utilization, memory, or disk space—will
    almost result in the failure of whatever you''re running on. To ensure that the
    instances never become overburdened, dynamic scaling policies automatically provision
    more instances before they hit point. Auto Scaling generates the following aggregate
    metrics for all instances within the group:


    +   - Aggregate CPU utilization

    - Average request count per target

    - Average network bytes in

    - Average network bytes out


    You''re not limited to using these native metrics. You can also use metric filters
    to extract metrics from CloudWatch logs and use those. As an example, your application
    generate logs that indicate how long it takes to complete a process. If the process
    takes too long, you could use Auto Scaling spin up new instances.


    Dynamic scaling policies by monitoring a CloudWatch alarm and scaling out—by increasing
    the capacity—when the alarm is breaching. There are three dynamic scaling policies
    to choose from: simple, step, and target.


    # Simple Scaling Policies


    With a simple scaling policy, whenever the metric rises above the threshold, Auto
    Scaling simply increases the desired capacity. How much it increases the capacity,
    however, depends on which of the adjustment policies you choose:


    ChangeCapacity Increases the capacity by a specified amount. For instance, you
    start with a desired capacity of 4 and then have an Auto Scaling 2 when the load
    increases.


    ExactCapacity Sets the capacity to a specific value, regardless of the current
    value. For example, suppose the desired capacity is 4. You are set a policy to
    change the value to 6 when the load increases.


    PercentChangeCapacity Increases the capacity by a percentage of the current amount.
    If the current capacity is 4 and you specify the percent change in capacity as
    50 percent, then Auto Scaling will bump the desired capacity to 6.


    For example, suppose you have four instances and create a simple scaling policy
    that specifies a PercentChangeadjustment of 50 percent. When the monitored alarm
    triggers, Auto Scaling will increment the desired capacity by 2, which will in
    turn add 2 instances to the auto scaling group, giving a total of 6.


    After Scaling completes the adjustment, it waits a cooldown period before executing
    the policy again, even if the alarm is still breaching. The default cooldown is
    300 seconds, but you can set it as high as you want or as low as 0—disabling it.
    Note that if an instance is unhealthy, Auto Scaling will not wait for the cooldown
    period before replacing the unhealthy instance.


    Referring to the preceding example, suppose after the scaling adjustment completes
    and the cooldown period expires, the monitored alarm drops below the threshold.
    At this point,'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Chapter 9 ■ The Reliability Pillar


    the desired capacity is 6. If the alarm triggers again, the simple scaling action
    will execute again and. Keep in mind that Auto Scaling will never increase the
    desired capacity beyond the group''s maximum setting.


    # Step Scaling Policies


    If the demand on your application is rapidly increasing, a simple scaling policy
    may not provide enough instances quickly enough. Using a step scaling policy,
    you can then add instances based on how the aggregate metric exceeds the threshold.


    To illustrate, suppose your group starts out with four instances. You want to
    add more instances to the group as the average CPU utilization of the group increases.
    When the hits 50 percent, you want to add two more instances. When it goes over
    60 percent, you want to add four more instances.


    You''d first create a CloudWatch Alarm to monitor the average CPU utilization
    and set the alarm to 50 percent, since this is the utilization level at which
    you want to start increasing the desired capacity.


    You''d then specify at least one step adjustment. Each step adjustment consists
    of the following:


    +   - A lower bound

    - An upper bound

    - The adjustment type

    - The amount by which to increase the desired capacity


    The upper and lower bound define a range that the metric has to fall within for
    the step to execute. Suppose for the first step you set a lower bound of 50 and
    an upper bound of 60, with ChangeInCapacity adjustment of 2. When the alarm triggers,
    Auto Scaling will consider the metric value of the group''s average CPU utilization.
    Suppose it''s 55 percent. Because 55 is between 50 and 60, Auto Scaling will execute
    the action specified in this step, which is to add two instances to the desired
    capacity.


    Suppose that you create another step with a lower bound of 60 and an upper bound
    of infinity. If the ChangeInCapacity adjustment of 4 increases the average CPU
    utilization to 62 percent, Auto Scaling will note that 60 <= infinity and will
    execute the action for this step, adding 4 instances to the desired capacity.


    You might be what would happen if the utilization were 60 percent. Step ranges
    cannot overlap. A metric of 60 percent would fall within the lower bound of the
    second step.


    With a step policy, you can optionally specify a warm-up time, which is how long
    Auto Scaling will wait until considering the metrics of newly added instances.
    The default warm up time is 300 seconds. Note that there are no cooldown periods
    in step scaling policies.


    # Target Tracking Policies


    If step scaling policies are too involved for your taste, you can instead use
    target tracking policies. If you select a metric and target value, and Auto Scaling
    will create a CloudWatch Alarm and a scaling policy to adjust the number of instances
    to keep the metric near target.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# EC2 Auto Scaling


    The metric you choose must change proportionally to the load. Metrics like include
    average CPU utilization for the group and request count per target. Aggregate
    metrics like the total request count for the ALB don''t change proportionally
    to the load on an individual instance and aren''t appropriate for use in a target
    tracking policy.


    Note that in addition to scaling out, target tracking will also scale in deleting
    instances to maintain the metric value. If you don''t want this behavior, you
    can disable scaling in. Also, with a step scaling policy, you can optionally specify
    a warm-up time.


    # Scheduled Actions


    Scheduled actions are useful if you have a predictable load pattern and want to
    adjust your capacity proactively, ensuring you have enough instances before demand
    hits.


    When you create a scheduled action, you must specify the following:


    +   - A minimum, maximum, or desired capacity value

    - A start date and time


    You may optionally set the schedule to recur at regular intervals, which is useful
    if you have a repeating load pattern. You can also set an end time, after which
    the scheduled policy gets deleted.


    To illustrate how you might use a scheduled action, suppose you normally run two
    instances in your Auto Scaling group during the week. But on Friday, things get
    busy, and you''ll need four instances to keep up. You''d start by creating a scheduled
    action that sets the desired capacity to 2 and recurs every Saturday, as shown
    in Figure 9.1.


    > FIGURE 9.1 Scheduled action setting the desired capacity to 2 every Saturday


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_234_0.png)


    The start date is January 5, 2019, which is a Saturday. To handle the Friday spike,
    you could create another weekly recurring policy to set the desired capacity to
    4, as shown in Figure 9.2.'
