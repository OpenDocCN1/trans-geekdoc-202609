    \n7. To delete the stacks, run the following command:\n\n```\naws cloudformation\
    \ delete-stack --stack-name web-stack\n```\n\n# Exporting Stack Output Values\n\
    \nIf you want to share information with stacks outside of a nested hierarchy,\
    \ you can selectively\nexport a stack output value by defining it in the Export\
    \ field of the Output section, as follows:\n\n```\n\"Outputs\": {\n  \"VPCID\"\
    : {\n    \"Description\": \"VPC ID\",\n    \"Value\": {\n      \"Ref\": \"PublicVPC\"\
    \n    },\n    \"Export\": {\n      \"Name\": {\n        \"Fn::Sub\": \"${AWS::StackName}-VPCID\"\
