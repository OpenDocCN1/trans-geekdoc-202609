  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_201_0.png)


    # Introduction


    Making your cloud resources accessible to the people and machines that will consume
    them is just as important as creating them in the first place. Facilitating network
    access to your content generally has three goals: availability, speed, and accurately
    getting the right content to your users.


    The Domain Name System (DNS) is primarily concerned with making your resources
    available across a network using a human-readable name. The Internet''s DNS infrastructure
    ensures that content living behind IP addresses can be reliably associated with
    human-readable domain names—like amazon.com.


    Amazon''s Route 53 is built to manage domain services, but it can also have a
    significant impact on the precision and speed with which these resources are delivered.


    CloudFront, Amazon''s global content delivery network (CDN), can take both speed
    and accuracy a few steps further.


    You''re going to learn how AWS addresses all three of those functions in the chapter.


    # The Domain Name System


    DNS is responsible for mapping human-readable domain names (like example.com)
    to the machine-readable IP addresses (like 93.184.216.34) they represent.


    When you launch a new network-facing service on AWS—or anywhere else—and want
    it to make it accessible through a readable name, you need to satisfy some configuration
    requirements. Before you can learn to do that, it''s important to be familiar
    with the basic concepts on which name services are built.


    In this section, we''ll define the key elements of DNS infrastructure, particularly
    the way they''re used within Amazon Route 53.


    # Namespaces


    The addressing structure organizing the billions of objects making the Internet
    is managed through naming conventions. If, for instance, there was more than one
    website'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# The Domain Name System


    called amazon.com or more one resource identified by the IP address 205.251.242.103,
    then things would quickly get chaotic. So, there''s got to be a reliable, top-down
    administration.


    The Internet naming system is maintained within the domain name hierarchy namespace,
    which controls the use of human-readable names. It''s a hierarchy in sense that
    the Internet can be segmented into multiple smaller namespaces through the assignment
    of blocks of public or private IP addresses or through the use of top-level domains
    (TLDs).


    Both the Internet Protocol and the domain name hierarchy are administered through
    the Internet Corporation for Assigned Names and Numbers (ICANN).


    # Name Servers


    Associating a domain name like amazon.com with its actual IP address is the job
    of a name server. All computers will have a simple name server database available
    locally. That database might contain entries associating hostnames (like localhost)
    with an appropriate IP address. The following code is an example of the /etc/hosts
    file from a typical Linux machine. It includes a line that allows you to enter
    fileserver.com in your browser to open the home page of a web server running within
    the network with the IP 192.168.1.5.


    ```

    127.0.0.1 localhost

    127.0.0.1 MyMachine

    192.168.1.5 fileserver.com

    ```


    ```

    # The following lines are desirable for IPv6 capable hosts

    ::1 ip6-loopback

    fe0::1 ip6-local

    ff0::0 ip6-multicastprefix

    02::1 ip6-allnodes

    ff0::2 ip6-allrouters

    ```


    If a query is unsatisfied by a local name server, it will be forwarded to one
    of the external DNS name servers specified in your computer''s network interface
    configuration. Such a configuration might point to a public DNS server like Google''s
    8.8.8.8 or OpenDNS at 208.67.222.222. Their job is to provide an IP address matching
    the domain name you entered so your application (a web browser, for instance)
    can complete your request.


    # Domains and Domain Names


    In terms of Internet addressing, a domain is one or more servers, data repositories,
    or other digital resources identified by a single domain name. A domain name is
    a name that''s been registered for the domain that''s used to direct network requests
    to the domain''s resources.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Domain Registration


    Top-level servers must be aware of a new domain name before they can respond to
    related queries. Propagating domain name data among name servers is the job of
    a domain name registrar. Registrars work with registry operators like VerisSo
    that domain registrations should be globally authoritative. Among its other roles,
    Amazon Route 53 acts as a domain name registrar.


    # Domain Layers


    A name is made up of multiple parts. The rightmost text of every address like
    .com or .org indicates the top-level domain (TLD). The name to the left of the
    TLD (the amazon part of amazon.com) is called the second-level domain (SLD). This
    SLD designation also refer to the unique second-level domains used by some countries
    like .co.uk which are used for UK-based businesses.


    A subdomain identifies a subset of a domain''s resources. Web and some students
    from the administration department of a college, for instance, might use the administration
    .school.edu name. Dean,administration@school.edu might be a valid email address,
    while administration.school.edu/apply.pdf could point to a file kept in the web
    root directory of the administration.school.edu server.


    www.school.edu, api.school.edu, and ftp.school.edu are all common examples of
    subdomains (sometimes referred to as hosts).


    FIGURE 8.1 A simple DNS domain broken down to its parts


    | aws.amazon.com |

    | SLD | TLD |

    | Subdomain |


    # Fully Qualified Domain Names


    Based on the default DNS settings on many systems, the system''s default domain
    name will be automatically appended when resolving partial domain names. As an
    example, a request for workstation may be resolved as workstation.localhost. If,
    however, you need to request a domain name is, without anything being appended
    to it, you''ll need to use a fully qualified domain name (FQDN).


    An FQDN has the absolute location of the domain including, a subdomain and the
    TLD. In addition, convention will often require a trailing dot after the TLD—which
    represents the domain root—to confirm that this is, indeed, an FQDN. Addresses
    in DNS zone files, for instance, will fail without a trailing dot. Here''s how
    that might look:


    administration.school.edu.'
