  md: '![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_128_0.png)


    # # Introduction


    A database allows an application to store, organize, and quickly retrieve data.
    Although you could use flat files to store data, they become increasingly slow
    to search as the amount of data grows. By relying on the database to perform these
    tasks, developers are free to focus on the application without having to directly
    interact with a filesystem to store and retrieve data.


    Consequently, the availability and performance of a database-backed application
    depend on the database you choose and how you configure it. Databases come in
    two flavors: relational and nonrelational. Each of these differs in the way it
    stores, organizes, and lets you retrieve data, so the type of database you choose
    depends on the needs of the application.


    In this chapter, you''ll learn the differences between these two database types
    and how to select the right one for your application. You''ll also learn how to
    use the managed database services that AWS provides to get the level of performance
    and reliability that your applications require, as well as how to protect your
    data and recover it in the event of a database failure.


    This chapter will introduce three different managed database services provided
    by AWS:


    +   - Relational database service (RDS)

    - Redshift

    - DynamoDB


    # # Relational Databases


    A relational database contains at least one table, which you can visualize as
    a spreadsheet with columns and rows. In a relational database table, columns may
    also be called attributes, and rows may also be called records or tuples.


    # # Columns and Attributes


    Before you add data to a relational database, you must redefine each column''s
    name and data types it can accept. Columns are ordered, and you can''t change
    the order after you create the table. The ordering creates a relationship between
    attributes in the table, which is where the term relational database comes from.
    Refer to Table 5.1 for an example of a relational database table containing employee
    records.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# TABLE 5.1 The Employees table


    | Employee ID (Number) | Department (String) | Last Name (String) | First Name
    (String) | Birthdate (Date) |

    |---|---|---|---|--|

    | 101 | Information technology | Smith | Charlotte | 7-16-87 |

    | 102 | Marketing | Colson | Thomas | 7-4-00 |


    Data must match the type defined under each column. For example, the Employee
    ID is not a letter, because it is defined as a numeric data type. One advantage
    of a relational database is that you don''t have to understand front how you''re
    going to query the data. As long as the data is in a consistent format, you can
    craft queries to get the data you want. This makes these relational databases
    good for applications that need to query data in arbitrary columns and customize
    how that is presented. For example, you could query the database to return the
    birthdate of every employee whose first name is Charlotte.


    You can add columns to a table after creating it. You can also delete columns,
    deleting a column entails deleting all of the data stored under the column. If
    you delete the First Name column, it will remove first name for all employees
    in the table.


    # Using Multiple Tables


    Storing all data in a single table can lead to unnecessary duplication, needlessly
    increasing the size of the database and making queries slower. Hence, it''s common
    for applications to use multiple related tables. Using the preceding example,
    if 50 employees work in the information technology department, the string “Information
    technology” appears in the table 50 times—once for each record. To avoid this
    wasted space, you may create a separate table to hold department names, as shown
    in Table 5.2.


    # TABLE 5.2 The Departments table


    | Department ID (Number) | Department Name (String) |

    |---|--|

    | 10 | Information technology |

    | 20 | Marketing |


    Instead of putting the department names in every employee record, you would create
    a single record for each department in the Departments table. The Employees table
    would then refer to each department using the Department ID, as shown in Table
    5.3.'
