    Go to http://www.wiley.com/go/sybystestprep to register and gain access to this
    comprehensive study tool package.


    # Register and Access the Online Test Bank


    To register your book and get access to the online test bank, follow these steps:


    +   1. Go to bit.ly/SybexTest.

    2. Select your book from the list.

    3. Complete the required registration information including answering the security
    verification book ownership. You will be emailed a pin code.

    4. Go to http://www.wiley.com/go/sybystestprep and find your book on that page
    and click the “Register or Login” link under your book.

    5. If you already have an account at testbanks.wiley.com, login and then click
    the “Redeem Access Code” button to add your new book with the pin code you received.
    If you don''t have an account already, create a new account and use the PIN code
    you received.


