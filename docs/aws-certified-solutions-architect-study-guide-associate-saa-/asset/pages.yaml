  md: "# Access Control\n\nOut of the box, new S3 buckets and objects will be fully\
    \ accessible to your account but to no other S3 accounts or external visitors.\
    \ You can strategically open up access at the bucket and object levels using access\
    \ control list (ACL) rules, finer-grained S3 bucket policies, or Identity and\
    \ Access Management (IAM) policies.\n\nThere is more than a little overlap between\
    \ these three approaches. In fact, ACLs are reality leftovers from before IAM.\
    \ As a rule, Amazon recommends applying S3 bucket policies or IAM policies instead\
    \ of ACLs.\n\nS3 bucket policies—which are formatted as JSON text and attached\
    \ to your S3 bucket—will make sense for cases where you want to control access\
    \ to a single S3 bucket for multiple accounts and users. On the other hand, IAM\
    \ policies—because they exist at the account level within IAM—will probably make\
    \ sense when you are trying to control the way individuals and roles access multiple\
    \ resources, including S3.\n\nThe following code is an example of an S3 bucket\
    \ policy that allows both the root user and the user Steve from the specified\
    \ S3 account to access the S3 MyBucket bucket and its contents. Both users are\
    \ considered principals within this rule.\n\n```\n{\n  \"Version\": \"2012-10-17\"\
    ,\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\"\
    : {\n        \"AWS\": [\"arn:aws:iam:xxxxxxxxxxxx:root\",\n\"arn:aws:iam:xxxxxxxxxxxx:user/Steve\"\
    ]\n      },\n      \"Action\": \"s3:*\",\n      \"Resource\": [\n        \"arn:aws:s3:::MyBucket\"\
    ,\n        \"arn:aws:s3:::MyBucket/*\"\n      ]\n    }\n  ]\n}\n```\n\nYou can\
    \ also limit access within bucket policies by specifying time of day or source\
    \ CIDR IP address blocks.\n\nWhen it's attached to an IAM entity (a user, group,\
    \ or role), the following IAM policy will accomplish the same thing as the previous\
    \ S3 bucket policy:\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
    :[{\n    \"Effect\": \"Allow\",\n```"
