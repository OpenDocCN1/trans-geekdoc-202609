    # Groups


    Creating individual users with just the permissions they''ll need to perform their
    duties can be a secure and efficient way to manage operations. As your account
    becomes busier and more complex, it can also become a nightmare to manage.


    Say, for you''ve some level of access to half a dozen admins and a number of developers.
    Manually assigning appropriate access policies to each user can be time-consuming.
    But imagine how much you you will have to update permissions across the entire
    team—perhaps applying one set of changes for just the developers and another for
    the admins.


    The solution for such scenarios is to create a separate IAM group for each class
    of user and associate each of your users with the group that fits their job description.
    You could create one group for developers, another for admins, and a third for
    your team.


    Now, when you need to make changes to a particular class''s access profile, rather
    than having to edit each user account, you just update the appropriate group.
    If you''re adding an Elastic Beanstalk workload, you can open it up for the entire
    developers'' group with a single action. If you''re no longer running your video
    content through Amazon Elastic Transcoder, you can remove access from the design
    group.'
