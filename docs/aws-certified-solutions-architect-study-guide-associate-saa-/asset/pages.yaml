    # S3 and Glacier


    AWS provides a different way to access data stored on S3 or Glacier: Select. The
    feature lets you apply SQL-like queries to objects so that only relevant data
    from within is retrieved, permitting significantly more efficient and cost-effective
    operations.

    One use case involve large CSV files containing sales and inventory data from
    multiple retail stores. Your company''s marketing team might need to periodically
    analyze only sales data and only from certain stores. Using Select, they''ll be
    able to retrieve exactly the data they need—a fraction of the full data set—while
    bypassing the bandwidth and cost overhead associated with downloading the whole
    thing.


    # Amazon Glacier


    At first glance, Glacier looks bit like just another S3 storage class. After all,
    like most S3 classes, Glacier guarantees 99.999999999 percent durability and,
    as you''ve seen, can be incorporated into lifecycle configurations.'
