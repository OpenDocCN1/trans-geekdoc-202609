    # # Maximizing Server Density


    You have a keen interest in getting the most out of a server instance—whether
    it''s for an application running on EC2 or a database with AWS Relational Database
    Service (RDS). Matching your workload to the right instance type can make a big
    difference not only in performance but also in overall cost.


    The M5 instance family, for instance, is optimized to take advantage of the higher
    core counts on Intel Xeon processors. You can typically pack multiple resource-hungry
    workloads onto a single, high-end M5 instance (like the m5.24xlarge), potentially
    requiring fewer instances overall. Similarly, the high-performing and parallel
    processing NVIDIA K80 GPU cores, enhanced networking, and default EBS optimization
    of a single P2 instance can often replace multiple instances of other families
    for high-demand analytics and machine learning workloads.


