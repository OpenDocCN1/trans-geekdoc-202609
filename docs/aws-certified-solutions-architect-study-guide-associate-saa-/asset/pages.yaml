- pgno: 240
  md: 'process. Once you decide to recover, you''ll use your CloudFormation template
    to build a new instance, which takes about 10 minutes. Lastly, you''ll restore
    the database, which takes about 30 minutes. The total downtime for each failure—or
    your recovery time objective (RTO)—is 70 minutes. Note that the recovery point
    (RPO) you can expect depends on how you''re backing up the database. In this case,
    assume that your application will suffer one failure every quarter. That''s a
    total downtime of 280 minutes, or about 4.6 hours.


    However, that''s just for failures. You also need to consider application and
    operating updates. Assuming that outages occur 6 times a year and require 4 hours
    of downtime each, that additional downtime of 24 hours per year. Adding all the
    numbers together, failures and updates, the total downtime per year is about 28.6
    hours or 1.19 days. That''s 99.7 percent availability!

    Although it''s tempting to round 99.6 percent to 99.9 percent, keep in mind that
    the difference between those numbers is more than seven hours per year. Providing
    inflated numbers, even if you''re honestly rounding up, can come back to bite
    you if those numbers turn out to be out of line with the application''s actual
    availability. Remember that your availability calculations are only good as the
    assumptions you make about the frequency and duration of failures and scheduled
    outages. When it comes to availability, err on the side of caution and round down!
    Following that advice, the expected availability of the application is 99 percent.


    # Designing for 99.9 Percent Availability


    When designing for 99.9 percent availability, downtime isn''t the end of the world,
    but it''s pretty close. You can tolerate 9 hours a day, but anything beyond is
    going to be a problem. To achieve 99.9 percent availability, you''ll use a distributed
    application design.


    The application itself will run on multiple instances in availability zones in
    a single region. You''ll configure an ALB to proxy traffic from users to individual
    instances and perform health checks against those instances. You''ll create a
    template to install the application web server and copy over application files
    from a centralized repository.

    You''ll create an Auto Scaling group to ensure you always have at least six running
    instances (two in each).


    Why six instances? Suppose you need four application instances to handle peak
    demand. To withstand the loss of one zone, having two instances in each zone ensures
    they can handle 50 percent of the peak demand. That way, if one zone fails—taking
    two instances with it—the remaining two zones have four instances, which is enough
    to handle 100 percent of the load.


    # Recovery Process


    For most failures, recovery will be automatic. You''ll configure the Auto Scaling
    group to use the ALB''s target health checks to determine the health of each instance.
    If an instance fails, the ALB will route traffic away from it, and Auto Scaling
    will terminate the failed instance and create a new one.'
