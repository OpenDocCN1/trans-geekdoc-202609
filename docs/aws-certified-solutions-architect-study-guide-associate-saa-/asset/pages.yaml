    Taking a snapshot suspends all I/O operations for a few seconds, unless you''re
    using multi-AZ with a database engine other than Microsoft SQL Server. Be sure
    to take your snapshots during off-peak times.


    When considering your backup and recovery needs, there are two metrics you should
