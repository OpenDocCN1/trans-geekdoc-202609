- pgno: 134
  md: '# Database Instance Classes


    When launching a database instance, you must decide how processing power, memory,
    network bandwidth, and disk throughput it needs. RDS offers a variety of database
    instance classes to meet the diverse needs of different databases. If you get
    it wrong or if your needs change, you can switch your instance to a different
    class. RDS divides database instance classes into the following three types.


    # Standard


    Standard instance classes meet the needs of most databases. The latest-generation
    instance class is db.m4, which provides up to:


    +   * 256 GB memory

    * 64 vCPU

    * 25 Gbps network bandwidth

    * 10,000 Mbps (1,280 Mbps) disk throughput


    # Memory Optimized


    Memory-optimized instance classes are for databases that have hefty performance
    requirements. Providing more memory to a database allows it to store more data
    in memory, which can result in faster query times. The latest-generation instance
    class is db.x1e, and provides up to:


    +   * 3,904 GB memory

    * 128 vCPU

    * 25 Gbps network bandwidth

    * 14,000 Mbps (1,750 Mbps) disk throughput


    Database instances use EBS storage. Both the standard and memory-optimized instance
    classes are EBS-optimized, meaning they provide dedicated bandwidth for transfers
    to and from EBS storage.


    # Burst Capable (Burstable)


    Burstable instances are for development, test, and other nonproduction databases.
    The only burstable instance class available is db.t2, and it gives you up to:


    +   * 32 GB memory

    * 8 vCPU


    AWS indicates that the network performance is “moderate,” which in most cases
    corresponds to less than 1 Gbps. AWS doesn''t provide stats on disk throughput,
    but you shouldn''t expect to get more than 3,200 Mbps (400 Mbps).'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Storage


    Selecting the right storage for your database instance is about more than just
    ensuring you have enough disk space. You also have to decide how fast the storage
    must be to meet the performance requirements of your database-backed application.


    # Understanding Input/Output Operations Per Second


    AWS measures storage performance in input/output operations per second (IOPS).
    All things being equal, the more IOPS you can have, the faster your database can
    store and retrieve data.

    RDS allocates you a number of IOPS depending on the type of storage you select,
    and you can’ exceed this threshold. The speed of your database storage is limited
    by the number of IOPS allocated to it.


    MySQL and Maria have a page size of 16 KB. Writing 16 KB of data would constitute
    one I/O operation. PostgreSQL, and Microsoft Server use a page size of 8 KB. Writing
    16 KB of data using one of these engines would consume two I/O operations. The
    larger the page size, the more data you can transfer in a single I/O operation.


    Assuming a 16 KB page size, suppose your database need to read 102,400 KB (100
    MB) of data every second. To achieve this level of performance, your database
    would be able to read 6,400 16 KB pages every second. Because each page counts
    as one I/O operation, your storage and instance class need to be able to sustain
    6,400 IOPS. Notice the inverse relationship between IOPS and page size: The larger
    your page size, the fewer IOPS you need to achieve the level of throughput.


    > Things get interesting when you move beyond a 32 KB page size. If your database
    engine writes more than 32 KB in a single I/O operation, AWS counts that more
    than one I/O operation. For example, reading or writing a 64 KB page write would
    count as two I/O operations. A 128 KB page write would count as four I/O operations.


    The number of IOPS you can achieve depends on the type of storage you select.
    RDS offers the following three types of storage.


    # General-Purpose SSD


    For most databases, general-purpose SSD (gp2) storage is sufficient. It''s fast,
    giving single-digit millisecond latency. You can allocate a volume of up to 16
    TB. For each gigabyte of data that you need to allocate, a volume, RDS allocates
    a baseline performance of three IOPS, up to a total of 10,000 IOPS per volume.
    A 20 GB volume would get 60 IOPS, while a 100 GB volume would get 300 IOPS. This
    means that the larger your volume, the better performance you''ll get. Note that
    the minimum storage volume you can create


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'depends on the database engine. SQL Server Enterprise and Standard, it''s 200
    GB, and for all others, it''s 20 GB.


    The maximum throughput the gp2 storage type offers is 1,280 Mbps (160 Mbps). To
    achieve this, two things have to fall into place. First, you must support a disk
    throughput of at least that much. For example, the db.m4.4xl instance class has
    a maximum throughput of 2,000 Mbps, so it would suffice. Also, you must allocate
    a sufficient number of IOPS to support this throughput. Suppose you''re running
    MariaDB with a page size of 16 KB (12 KB or 0.128 MB). To determine the number
    of IOPS you''ll need to sustain 1,280 MB disk throughput, you divide the bandwidth
    by the page size, as follows:


    1280 Mbps/0.128 Mb = 10,000 IOPS


    To achieve 1,280 Mbps disk throughput to a volume, you would need 10,000 IOPS
    allocated. Note that this is the maximum of IOPS possible with gp2. To achieve
    this your volume would have to be 3,333.3 GB or about 3.4 TB.

    If you think might occasionally need to burst to 3,000 IOPS, but don''t need a
    lot of storage, don''t have to over-allocate storage to get your desired number
    of IOPS. Volumes smaller than 1 TB can temporarily burst to 3,000 IOPS. The duration
    of the burst is determined by the following formula:


    Burst duration seconds = (Credit balance)/3,000 - 3 * (storage size in GB)]


    When you initialize a database instance, you get a credit balance of 5,400,000
    IOPS. When your instance uses IOPS above and its baseline, it will dip into your
    credit balance. Once the credit balance is depleted, you can no longer burst.
    For example, with a 200 GB volume, the burst duration would be 2,250 seconds or
    37.5 minutes.

    The credit balance is replenished at a rate of one baseline IOPS every second.
    For example, if you have a 200 GB volume with a baseline IOPS of 600, your credit
    balance increases by 600 IOPS per second, up to the maximum of 5,400,000.

    To get practice with these concepts, complete Exercise 5.1 to create an instance
    using gp2 storage.


