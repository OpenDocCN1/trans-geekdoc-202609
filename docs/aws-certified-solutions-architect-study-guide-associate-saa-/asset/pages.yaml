- pgno: 145
  md: '# Partition and Hash Keys


    When you create a table, you must specify a primary key and a data type. Because
    the primary key uniquely identifies an item in the table, its value must be unique
    within the table. There are two types of partition keys you can create.


    A partition key, also known as a hash key, is a primary key that contains a single
    value. When you use only a partition key as a primary key, it''s called a simple
    primary key. Good candidates for a partition key would be an email address, a
    unique username, or even a randomly generated identifier. A partition key can
    store no more than 2,048 B.


    A primary key can also be a combination of two values: a partition key and sort(range)
    key. This is called a composite primary key. The partition key doesn''t have to
    be unique, but the combination of the partition key and sort key must be unique.
    For example, a person''s last name could be the partition key, while the first
    name could be the sort key. Using this approach, you could use the following values
    for a composite primary key for a table:


    | Last name (partition key) | First name (sort Key) |

    |---|---|

    | Lewis | Clive |

    | Lewis | Warren |

    | Williams | Warren |


    Neither the last name Lewis nor the first name Warren is unique in the table.
    But combining the partition and sort keys creates a unique primary key. DynamoDB
    distributes your items across partitions based on the partition key. Using the
    preceding example, DynamoDB items with the last name Lewis would all be stored
    on the same partition. DynamoDB would arrange the items in ascending order by
    the sort key. Note that a sort key can store more than 1,024 B.


    When a load of read or write activity occurs against an item, the partition exists
    is said to be a hot partition. This can negatively affect performance. To avoid
    hot partitions, try to make your partition keys as unique as possible. For example,
    if you''re storing log entries, the current date as a partition key will result
    in a different hot partition every day. Instead, you may consider using a timestamp
    that changes frequently.


    # Attributes and Items


    Each key-value pair pairs an attribute, one or more attributes make up an item.
    DynamoDB can store an item size up to 400 KB, which is roughly equivalent to 50,000
    English words!


    At a minimum, every item contains a primary key and corresponding value. When
    you create an attribute, you must define the data type. Data types fall into the
    following three categories:


    Scalar A scalar data type can have only one value. The string data type can store
    up to 400 KB of Unicode data with UTF-8 encoding. A string must always be greater
    than zero.'
