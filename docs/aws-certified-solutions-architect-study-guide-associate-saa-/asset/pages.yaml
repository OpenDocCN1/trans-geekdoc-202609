    \ the name of the stack.\n\nAny template in the same account and region can then\
    \ import the value using the\nFn::ImportValue intrinsic function, as follows:\n\
    \n```\n\"ALTargetGroup\": {\n  \"Type\": \"AWS::ElasticLoadBalancingV2::TargetGroup\"\
    ,\n  \"Properties\": {\n    \"VpcId\": {\\ \"Fn::ImportValue\": {\\ \"Fn::Sub\"\
    : \"${NetworkStackName}-VPCID\" } }\n  }\n}\n```"
