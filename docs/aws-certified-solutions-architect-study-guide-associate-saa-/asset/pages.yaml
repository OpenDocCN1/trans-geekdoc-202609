- pgno: 158
  md: "# Chapter 6 • Authentication and Authorization—AWS Identity\n\nIAM provides\
    \ hundreds of preset policies that can be viewed from the Policies page that's\
    \ accessed from the IAM Dashboard using key words to narrow down your search.\
    \ You can also create your own policy using the tools available through the Create\
    \ policy page in the Dashboard or by manually crafting your JSON-formatted text.\n\
    \nThe following is a JSON AdministratorAccess policy document from the IAM Dashboard\
    \ interface. Note how it allows the identity holding the policy to perform any\
    \ (*) action on your account.\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"\
    Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"*\",\n\
    \      \"Resource\": \"*\"\n    }\n  ]\n}\n```\n\nAny action that's not explicitly\
    \ allowed by a policy will be denied. But wait, if all actions are implicitly\
    \ denied, why would you ever need to explicitly invoke \"Deny\" within a policy?\
    \ Such policies could be useful in cases where a user requires access to most—but\
    \ not all—resources within a domain. \"Deny\" can single out exactly those resources\
    \ that remain off-limits.\n\nWhen you associate a policy document with an IAM\
    \ identity, that identity will now be bound to the policy's powers and limitations.\
    \ A single IAM policy can be associated with any number of identities, and a single\
    \ identity can have as many as 10 managed policies (no greater than 6,144 characters)\
    \ attached to it.\n\nThis raises the potential for trouble: what happens if two\
    \ policies are associated with a single identity conflict? What if, for instance,\
    \ one policy permits a user to create new S3 buckets and the second forbids it?\
    \ AWS resolves such conflicts by denying the action in question.\n\nYou should\
    \ also bear in mind that, in general, an explicit deny effect will always rule\
    \ over all.\n\n# User and Root Accounts\n\nThe best way to protect your root account\
    \ is to lock it down by doing the following:\n\n+   - Delete any access keys associated\
    \ with root.\n- Assign a long and complex password and store it in a secure password\
    \ vault.\n- Enable multifactor authentication (MFA) for the root account.\n- Wherever\
    \ possible, do not use root to perform administration operations."
  merge: -1
