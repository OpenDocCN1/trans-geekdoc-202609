- pgno: 80
  md: '# Introduction


    Amazon Simple Storage Service (S3) is where individuals, applications, and a long
    list of AWS services keep their data. It''s an excellent platform for the following:


    +   - Maintaining backup archives, log files, and disaster recovery images


    +   - Running analytics on big data at rest


    +   - Hosting static websites


    S3 provides inexpensive and reliable storage that can, if necessary, be closely
    integrated with operations running within or external to AWS.


    This isn''t the same as the operating system volumes you learned about in the
    previous chapter: those are kept on the block volumes driving your EC2 instances.
    S3, by contrast, provides a space for effectively unlimited object storage.


    What''s the difference between object storage and block storage? With block-level
    storage, data on a raw physical storage device is divided into individual blocks
    whose use is managed by a file system. NTFS is a common file system used by Windows,
    while Linux uses Btrfs or ext4.


    In the file system, on the behalf of the installed OS, S3 is responsible for allocating
    space for the files and data that are saved to the underlying device and for providing
    access whenever the OS needs to read some data.


    An object storage like S3, on the other hand, provides what you can think of as
    a flat surface on to store your data. This simple design avoids some of the OS-related
    complications of block storage and allows easy access to any amount of professionally
    designed and maintained storage capacity.


    When you write to S3, they are stored along up to 2 KB of metadata. The data is
    made up of keys that establish system details like data permissions and the appearance
    of a file system location within nested buckets.


    Through the rest of this chapter, you are going to learn the following:


    +   - How S3 objects are saved, managed, and accessed


    +   - How to choose from among the various classes of storage to get the right
    balance of durability, availability, and cost


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# S3 Service Architecture


    +   - How to manage long-term data storage lifecycles by incorporating Amazon
    Glacier into your design

    - What other AWS services exist to help you with your data storage and access
    operations


    # S3 Service Architecture


    You organize your S3 files into buckets. By default, you''re allowed to create
    as many 100 buckets for each of your AWS accounts. As with other AWS services,
    you can ask AWS to raise that limit.


    Although an S3 bucket and its contents exist within only a single AWS region,
    the name you choose for your bucket must be globally unique within the entire
    S3 system. There is some logic to this: you''ll often find your data located in
    a particular geographical region to satisfy operational or regulatory needs. But
    at the same time, being able to reference a bucket without having to specify its
    region the process.


    Here is the URL you would use to access a file `filename` in a bucket called `bucketname`
    over HTTP:


    ```

    https://s3.amazonaws.com/bucketname/filename

    ```


    Naturally, this assumes you''ll be able to satisfy the object''s permissions requirements.
    This is how that same file would be addressed by the AWS CLI:


    ```

    s3://bucketname/filename

    ```


    # Prefixes and Delimiters


    As you''ve seen, S3 stores objects within a bucket on a flat surface without subfolder
    hierarchies. However, you can use prefixes and delimiters to give your buckets
    the *appearance* of a more structured organization.


    A prefix is a common string that indicates an organization level. For example,
    the word contracts following the delimiter / would tell S3 to treat a file with
    a name contracts/acme.pdf as an object that should be grouped together a second
    file named contracts/dynamic.pdf.


    S3 recognizes folder/directory structures as they''re uploaded and emulates their
    hierarchical design within the bucket, automatically converting slashes to delimiters.
    That''s why you''ll see the correct folders whenever you view your S3-based objects
    through the console or the API.


    # Working with Large Objects


    While there''s no theoretical limit to the total amount of data you can store
    within a bucket, a single object may be no larger than 5 TB. *Individual uploads*
    can be no larger than 5 GB.'
