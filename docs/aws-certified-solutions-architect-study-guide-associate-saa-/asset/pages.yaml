- pgno: 212
  md: '# Amazon CloudFront


    As you''ve seen, Route 53 can be used to optimize the way DNS requests are processed.
    Amazon''s global content delivery network (CDN) CloudFront can also help solve
    one of the primary problems addressed by Route 53: getting your content into the
    hands of your users as quickly as possible.


    A CDN maintains a network of physical edge locations placed geographically close
    to the end users who request content. When you configure the way you want your
    content delivered—as part of what AWS calls a CloudFront distribution—you define
    how you want your content distributed through that network and how it should be
    delivered to your users.


    How do your users "know" to address your requests to your CloudFront endpoint
    rather than getting it directly from your resources? Normally, they don''t. When
    you use Route 53 to configure your domain to direct DNS requests to the CloudFront
    distribution, users will be automatically routed appropriately.


    When a request is made, CloudFront assesses the user''s location and calculates
    which endpoint will be able to deliver the content with the lowest latency. If
    this is the first time content has been requested through the endpoint, the content
    will be copied from the origin server (or EC2 server instance, perhaps, or the
    contents of an S3 bucket). Delivery of subsequent requests will—because the cached
    copy is still stored at the endpoint—be much faster.


    The kind of CloudFront distribution you create will depend on the kind of media
    you''re providing. For web pages and graphic content, you''ll select a Web distribution.
    For video content that''s stored in S3 buckets that can use Adobe''s Real-Time
    Messaging Protocol (RTMP), CloudFront''s RTMP distribution makes most sense.


    As you saw in Chapter 3, when you configure your distribution, you''ll have the
    option of adding a free AWS Certificate Manager (ACM) SSL/TLS encryption certificate
    to your distribution. This will protect your content as it moves between CloudFront
    and your users'' devices from network sniffers and man-in-middle attacks.


    CloudFront currently supports three categories of content origin, described in
    Table 8.3.


    # TABLE 8.3 Permitted CloudFront origins


    | Category | Description |

    | :--- | :--- |

    | Amazon S3 bucket | Any accessible S3 bucket |

    | AWS MediaPackage channel endpoint | Video packaging and origination |

    | AWS MediaStoreContainer endpoint | Media-optimized storage service |'
  merge: -1
  img_proc: true
