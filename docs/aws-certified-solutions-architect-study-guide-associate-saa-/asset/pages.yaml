    # IPv6 CIDR Blocks


    If you''ve allocated an IPv6 CIDR to your VPC, you can assign IPv6 CIDRs to subnets
    within that VPC. The prefix length for an IPv6 subnet is fixed at /64. If your
    VPC''s IPv6 CIDR is 2600:1f8:2551:8900/56, you can assign a subnet the CIDR 2600:1f8:2551:8900/64
    through 2600:1f8:2551:89BF/64.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_104_0.png)


    > You must assign an IPv4 CIDR block to a subnet, even if you have no plans to
    use it.


    # Elastic Network Interfaces


    An elastic network interface (ENI) allows an instance to communicate with other
    network resources including AWS services, other instances, on-premises servers,
    and the Internet. It also makes possible for you to connect to the operating system
    running on your instance to manage it. As the names suggest, an ENI performs the
    same basic function as a physical server, although ENIs have more restrictions
    on how you can configure them.


    Every instance must have a primary network interface (also known as the primary
    ENI), which is connected to only one subnet. This is the reason you have to specify
    a subnet when launching an instance. You cannot remove the primary ENI from an
    instance.


    # Primary and Secondary Private IP Addresses


    Each instance must have a primary private IP address from the range specified
    by the subnet. The primary private IP address is bound to the primary ENI of the
    instance. You cannot change or remove this address, but you can assign secondary
    private IP addresses Any secondary addresses must come from the same subnet that
    the ENI is attached to.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'It''s possible to attach additional ENIs to an instance. Those ENIs may be
    in a differ- subnet, but they must be in the same availability zone as the instance.
    As always, addresses associated with the ENI must come from the subnet to which
    it is attached.


    # Attaching Elastic Network Interfaces


    An EC2 instance exists independently of an instance. You can create an ENI first
    and attach it to an instance later. For example, you can create an ENI in one
    subnet and then attach it to an instance as the primary ENI when you launch the
    instance. If you disable the Delete Termination attribute of the ENI, you can
    terminate the instance without deleting the ENI. You can also associate the ENI
    with another instance.


    You can also associate an existing ENI and attach it to an existing instance as
    a secondary ENI. This lets you redirect traffic from a failed instance to a working
    instance by detach- the ENI from the failed instance and reattaching it to the
    working instance. Complete Exercise 4.3 to practice creating an ENI and attaching
    it to an instance.


    # EXERCISE 4.3


    # Create and Attach a Primary ENI


    Create an ENI in the subnet of your choice.


    +   1. In the EC2 web console, look under the Network & Security section and click
    Network Interfaces.

    2. Click Create Network Interface.

    3. Specify the subnet in which to create the ENI, and select the default security
    group.

    4. Launch an instance into the subnet, attaching the ENI as the primary ENI.


    # Internet Gateways


    An Internet gateway gives instances the ability to receive a public IP address,
    connect to the Internet, and receive requests from the Internet.


    When you create a VPC, it does not have an Internet gateway associated with it.
    You must create an Internet gateway and associate it with a VPC manually. You
    can associate only one Internet gateway with a VPC. But you may create multiple
    Internet gateways and associate each with a different VPC.


    An Internet gateway is somewhat analogous to an Internet router you may install
    on-premises. In AWS, an Internet gateway doesn''t behave exactly like a router.
    In a traditional network, you configure your core router with a default gateway
    IP address pointing to the Internet router to give your servers access to the
    Internet. An Internet gateway, however, doesn''t have a management IP address
    or network'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Chapter 4 ■ Amazon Virtual Private Cloud


    interface. Instead, AWS identifies an Internet gateway by its resource ID, which
    begins with igw- followed by an alphanumeric string. To create an Internet gateway,
    you must create a default route in a route table that points to the Internet gateway
    as a target.


    # Route Tables


    Configurable virtual routers do not exist as VPC resources. Instead, the VPC infrastructure
    implements IP routing as a software function, and AWS calls this function an implied
    router (sometimes called an implicit router). This means there is no virtual router
    on which to configure IP addresses or dynamic routing protocols. Rather, you only
    have to manage the route table the implied router uses.


    Each route table consists of one or more routes and at least one subnet association.
    Think of a route table as connected to multiple subnets in the same way a traditional
    router would. When you create a VPC, AWS automatically creates a default route
    called the main route table and associates it with every subnet in VPC. You can
    use the main route table or create a custom that you can manually associate with
    one or more subnets.


    If you do not explicitly associate a subnet with a route table you''ve created,
    AWS will implicitly associate it with the main route table. A subnet cannot exist
    without a route table association.


    # Routes


    Routes determine how to forward traffic from instances within the subnets associated
    with the route table. IP routing is destination-based, meaning that routing decisions
    are based only on the IP address, not the source.


    When you create a route, you must provide the following elements:


    +   - Destination

    - Target


    The destination must be an IP prefix in CIDR notation. The target must be an AWS
    network resource such as an Internet gateway or an ENI. It cannot be a CIDR.

    Every route table contains a local route that allows instances in different subnets
    to communicate with each other. Table 4.2 shows what this route would look like
    in a VPC with the CIDR 172.31.0.0/16.


    # TABLE 4.2 The local route


    | Destination | Target |

    |---|---|

    | 172.31.0.0/16 | Local |'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The local route is the only mandatory route that exists in every route table.
    It''s what allows communication between instances in the same VPC. Because there
    are no routes for any other IP prefixes, any traffic destined for an address outside
    of the VPC CIDR range will get dropped.


    # # The Default Route


    To enable Internet access for your instances, you must create a default route
    pointing to the Internet gateway. After adding a default route, you would end
    up with this:


    | Destination | Target |

    | --- | --- |

    | 172.31.0.0/16 | igw-0e538022a0fdc318 |

    | 0.0.0.0/0 | |


    The 0.0.0.0/0 prefix encompasses all IP addresses, including those of the Internet.
    It iss always listed as the destination in a default route. Any subnet that is
    associated with a route table containing a default route to an Internet gateway
    is called a *public subnet*. This subnet does not have a default route


    Notice that the 0.0.0.0/0 and 172.31.0.0/16 prefixes overlap. When deciding where
    to route traffic, the implied router will route based on the closest match. Suppose
    an instance sends a packet to the Internet address 198.51.100.50. Because 198.51.100.50
    does not match the 172.31.0.0/16 prefix the implied router will use the default
    route and send the packet to the Internet gateway.


    AWS documentation speaks of one implied router per VPC. It''s important to understand
    that the implied router doesn''t actually exist as a discrete resource. It''s
    an abstraction of an IP routing function. Nevertheless, you may find it to think
    of each route table as a separate route. Follow the steps in Exercise 4.4 to create
    an Internet gateway and a default route.


    # EXERCISE 4.4


