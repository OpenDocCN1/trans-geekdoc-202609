  md: '# Nonrelational (No-SQL) Databases


    If your cluster contains more than one compute node, Redshift also includes a
    leader node to coordinate communication among the compute nodes, as well as to
    communicate with clients. A leader node doesn''t incur any additional charges.


    # Data Distribution Styles


    Rows in a Redshift database are distributed across compute nodes. How the data
    is depends on the distribution style. In EVEN distribution, the leader node spreads
    the data out evenly across all compute nodes. This is the default style. KEY distribution
    spreads the data according to the value in a single column. Columns with the same
    value are stored on the same node. In the ALL distribution, every table is distributed
    to every compute node.


    # Nonrelational (No-SQL) Databases


    Nonrelational databases are designed to consistently handle tens of thousands
    of transactions per second. Although they can store the same data you find in
    a relational database, they''re optimized for so-called unstructured data. Unstructured
    data is an unfortunate term, as all data you store in any database has some structure.
    A more accurate description would be unstructured. The data you store in a nonrelational
    database can vary in structure, and that can change over time.


    Nonrelational and relational databases have many elements in common. Nonrelational
    databases—also known as no-SQL databases—consist of collections that are confusing
    sometimes called tables. Within a table, you store items, which are similar to
    rows or tuples in a relational database. Each item consists of at least one attribute,
    which is analogue to a column in a SQL database. An attribute consists of a unique
    name called a key, data type, and value. Attributes are sometimes called key-value
    pairs.


    # Storing Data


    One of the biggest differences between relational and nonrelational database is
    that nonrelational databases are schemaless and don''t require all items to have
    the same attributes. Each item requires a primary attribute whose value must be
    unique within the table. The purpose of the primary key is to identify an item
    and provide a value by which to sort items. Nonrelational databases are flexible
    when it comes to the type of data you can store. With the exception of the primary
    key, you don''t have to define attributes when you create a table. You create
    attributes on the fly when you create or modify an item. These attributes are
    unordered and have no relation to each other, which''re nonrelational.


    Nonrelational databases do not give you a way to split data across tables and
    merge it together at query time. Therefore, an application will generally keep
    all of its data in one table. This can lead to the duplication of data, which
    in large database can incur substantial storage costs.'
