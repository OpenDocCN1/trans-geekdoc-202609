    # # EC2 Storage Volumes


    Storage drives (or volumes as they’re described in AWS documentation) are for
    the most part virtualized spaces carved out of larger physical drives. To the
    OS on your instance, all volumes present themselves exactly as they were normal
    physical drives. But there’s actually more than one kind of AWS volume, and it’s
    important to understand how each type works.


    # # Elastic Block Store Volumes


    You can attach as many Elastic Block Store (EBS) volumes to your instance as you
    like and use them just as you would have hard drives, flash drives, or USB drives
    with your physical server. And with physical drives, the type of EBS volume you
    choose will have an impact on both performance and cost.


    The AWS SLA guarantees the reliability of the data you store on its EBS volumes
    (promoting at 99.99% availability), so you don’t have to worry about failure.
    When an EBS drive fails, its data has already been duplicated and will probably
    be brought back online before anyone notices a problem. So, practically, the only
    thing that you consider is how quickly and efficiently you can access your data.


    There are currently four EBS volume types, two using solid-state (SSD) technologies
    and two using the older spinning hard drives (HDDs). The performance of each volume
    type is measured in IOPS/volume (where IOPS means input/output operations per
    second).


    # # EBS-Provisioned IOPS SSD


    If your applications require intense rates of I/O operations, you should consider
    provisioned IOPS, which provides a maximum IOPS/volume of 32,000 and a maximum
    throughput/volume of 500 MB/s. Provisioned IOPS–which is referred to as EBS Optimized–can
    cost $0.12/GB/month in addition to $0.06/provisioned IOPS.


    # # EBS-General-Purpose SSD


    For most regular workloads that, ideally, deliver low-latency performance, general-purpose
    SSDs will work well. You’ll get a maximum of 10,000 IOPS/volume, and it’ll cost
    $0.10/GB/month. For reference, a general-purpose SSD used as a typical 8 GB drive
    for a Linux instance would, at current rates, cost $9.60/year.'
