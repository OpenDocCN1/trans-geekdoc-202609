  md: '# Chapter 10 ■ The Performance Efficiency Pillar


    High-bandwidth EC2 instance types can also make a significant difference. When
    manually enabled on a compatible instance type, enhanced networking functionality
    can give you network speeds of up to 25 Gbps. There are two enhanced networking
    technologies: Intel E2599 Virtual Function (VF) interface, which can be accessed
    on instance types including, C3, C4, and R3; and Elastic Network Adapter (ENA),
    which is available on types including G3, H1, and R5.


    On the following web page, AWS provides clear instructions for enabling enhanced
    networking from various flavors of the Linux server OS:


    ```

    https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/enhanced-networking.html

    ```


    But perhaps the most important networking technology of all is load balancing.
    Sooner or later that you''ll find yourself needing multiple instances of your
    application to keep up with demand. Adding resources to help out a popular app
    is great, but how are your customers going to find all those new servers? They
    won''t all end up fighting their way into the poor, overloaded server they''ve
    always used?


    A load balancer is a software service that sits in front of your infrastructure
    and answering incoming requests for content. Whether you use a DNS server like
    Route 53 or CloudFront, the idea is to associate a domain (like example.com) with
    the address used by your load balancer rather than to any one of your application
    servers.


    When the balancer receives a request, it will, as illustrated in Figure 10.1,
    route it to any of your backend application servers and make sure that the response
    is sent back to the original client. When you add or remove servers, you only
    need to update the load balancer software with the addressing and availability
    status changes, and your customers won''t be the wiser.


