    # ## Eventually Consistent Data


    It''s important to bear in mind that S3 replicates data across multiple locations.
    As a result, there might be brief delays while updates to existing objects propagate
    across the system. Uploading a new version of a file or alternatively, deleting
    an old file could result in one reflecting the new version with another unaware
    of any changes.


    To ensure there''s never a conflict between versions of a single object—which
    could lead to serious data and application corruption—you should treat your data
    according to an Eventually Consistent Standard. That is, you should expect a delay
    (usually just two seconds or less) and design your operations accordingly.


    Because there is the risk of corruption, S3 provides read-write consistency for
    the creation (PUT) of new objects.


    # # S3 Object Lifecycle


    Many of the S3 workloads you launch will probably involve backup archives. But
    the thing about backup archives is, when properly designed, they''re usually followed
    by many backup archives. Maintaining some previous archive versions is critical,
    and you''ll also want to retire and delete old versions to keep a lid on your
    storage costs.

    S3 lets you automate this with its versioning and lifecycle features.


    # ## Versioning


    Within many file systems, saving a file using the same name and location as a
    pre-existing file will overwrite the original object. That ensures you''ll always
    have the most recent version available, but you will lose access to older versions—including
    versions that were overwritten by mistake.


    By default, objects on S3 work the same way. But if you enable versioning at the
    bucket, then overriting copies of an object will be saved and remain accessible
    indefinitely. This solves the problem of accidentally losing data, but it replaces
    it with the potential for archive bloat. Here''s lifecycle management can help.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Lifecycle Management


    You can configure lifecycle rules for a bucket that will automatically transition
    an object''s storage class after a set number of days. You might, for instance,
    new objects remain in the S3 Standard class for their first 30 days after they''ve
    moved to the cheaper One Zone IA for another 30 days. If regulatory compliance
    requires that you maintain older versions, your files could be moved to the low-cost,
    long-term storage Glacier for 365 days before being permanently deleted.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_86_0.png)


    > You can optionally use prefixes to apply lifecycle rules to certain objects
    within a bucket. You should also be aware that there are minimum times (30 days,
    for instance) an object must remain within one class before it can be moved. In
    addition, you cannot transition directly from S3 Standard to Redundancy.


    Try it yourself with Exercise 3.2.


    # EXERCISE 3.2


    # Enable Versioning and Lifecycle Management for an S3 Bucket


    +   1. Edit a bucket''s properties to enable versioning.

    2. Upload a file to bucket, edit the copy on your local computer, and upload the
    new copy (keeping the filename). If you''re working with a static website, make
    sure you give the new file permissions allowing public access.

    3. With the contents of the bucket displayed in the Dashboard, select Show Versions.
    You should now see two versions of your file.

    4. Add a couple of directories to files to your bucket.

    5. From the Management tab, select Lifecycle and specify a tag that matches the
    directory name of one of the directories you uploaded.

    6. Add a lifecycle rule by adding transitions and configuring the transition timing
    (in days) and for each object.


    You''ll need to be patient to test this configuration because the minimum lag
    between transitions is 30 days.


    # Accessing S3 Objects


    If you didn''t think you''d ever need your data, you wouldn''t go to the trouble
    of saving it to S3. So, you''ll need to understand how to access your S3-hosted
    objects, and as important, how to restrict access to only those requests that
    match your business and security needs.'
  merge: -1
  img_proc: true
