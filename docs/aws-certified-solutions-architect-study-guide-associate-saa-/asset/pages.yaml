  md: '# Chapter 9 ■ The Reliability Pillar


    image to a destination bucket. When a new image is uploaded to the source bucket,
    S3 triggers the Lambda function. You''re billed only for the time the function
    runs.


    Lambda executes functions using a highly available distributed computing platform.
    Unlike EC2 instance, which can fail or be stopped or terminated, Lambdas is always
    available.


    # Know Your Limits


    Although one the big selling points of the cloud is the ability to grow with you,
    cloud capacity is not unlimited. AWS imposes limits to prevent accidentally or
    intentionally consuming all resources, resulting in a denial of service for other
    customers. The limits depend on the service and include things like network throughput,
    S3 PUT requests per second, the number of instances per region, the number of
    elastic IP addresses per region, and so on. Many of these limits can be increased
    upon request.


    Use the AWS Trusted Advisor to see service limits apply to your account. You may
    also consider CloudWatch Alarms to let you know when you''re getting close to
    hitting a limit you can react to avoid hitting it. Avoiding hitting a limit may
    require requesting by contacting AWS support, adding another availability zone,
    or even shifting some of the load to another region.


    # Increasing Availability


    The availability you''ve looked at so far are based only on the availability of
    AWS services. The actual availability of your application could be worse. There
    are many things that can impact availability. For example, your app can crash,
    perhaps because of a bug, memory leak, or data corruption.


    The best way to maximize availability is to avoid failure in the first place.
    Instead of having a single instance hosting we use multiple instances and spread
    them out across different availability zones. This way, failure of a single instance
    or even an availability zone won''t render your application unavailable. Rather
    than depending on one instance to be highly available, distributed application
    design designs the work across multiple instances that are not dependent on one
    another.


    But that''s not the whole story. If an instance fails, the other instances have
    to pick up the load. If enough instances fail, only a few instances will be serving
    a lot of traffic, resulting in poor performance and leaving the remaining instances
    also crashing. Therefore you need to react to re-create instances when such a
    crash occurs.


    Another issue that could arise is that increased demand could place such a load
    on your instances that they become unusable, or even crash altogether. An advantage
    of using a distributed application design is that it makes easier to add capacity
    nondisruptively. Instead of having to upgrade to a more powerful instance class,
    which requires downtime, you simply add more instances. When you have a distributed
    system, getting resources just involves scaling out—adding more of the same.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# EC2 Auto Scaling


    The EC2 Auto Scaling service offers a way to avoid application failure and recover
    from it when it happens. Auto Scaling works by provisioning and starting on your
    behalf a specified number of EC2 instances. It can dynamically add more instances
    to keep up with increased demand. When an instance fails or gets terminated, Auto
    Scaling will automatically replace it.


    EC2 Auto Scaling uses either a launch configuration or a launch template to automatically
    configure the instances it launches. Both perform the same basic function of defining
    the basic configuration parameters of the instance as well as what scripts (if
    any) run on it. Launch configurations have been around for a while and are more
    familiar to you if you''ve been using AWS for a while. You''re also more likely
    to encounter them if you''re going into an AWS environment. Launch templates are
    newer and are what AWS recommends. You''ll learn about both, but which one to
    use is up to you.


    # Launch Configurations


    When you create an instance, you have to specify any configuration parameters,
    including an Amazon Machine Image (AMI), instance type, SSH key pair, security
    group, instance profile, block device mapping, which it''s EBS optimized, placement
    tenancy, and User Data, as well as custom scripts to install and configure your
    application. A launch configuration is essentially a named document that contains
    the same information you''d need when provisioning an instance.


    You can create a launch configuration from an existing EC2 instance. Auto Scaling
    will copy the settings from the instance, but you can customize them as needed.
    You can also create a launch configuration from scratch.


    Launch configurations are for use only with EC2 Auto Scaling, meaning you can''t
    manually launch an instance using a launch configuration. Also, once you create
    a launch configuration, you can''t modify it. If you want to change any of the
    settings, you have to create an entirely new launch configuration.


    # Launch Templates


    Launch templates are similar to launch configurations in that you can specify
    the same settings. But the uses for launch templates are more versatile. You can
    use a launch template with Auto Scaling, but you can also use it for spinning
    up one-off EC2 instances or creating a Spot fleet.


    Launch templates are also versioned, allowing you to change them after creation.
    Any time you need to make changes to a launch template, you create a new version
    of it. AWS keeps all versions, and you can flip back and forth between versions
    as needed. This makes it easier to track your launch template changes over time.
    Complete Exercise 9.1 to create your own launch template.'
  merge: -1
  img_proc: true
