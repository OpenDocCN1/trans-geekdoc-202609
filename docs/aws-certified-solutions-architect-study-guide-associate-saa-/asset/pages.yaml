    | NAPTR | Name Authority Pointer—allows regex-based domain name rewriting |

    | CAA | Certification Authority Authorization—establishes authority to issue security
    certificates for a domain |

    | NS | Identifies a name server to be used by a zone |

    | SOA | Start of authority—Defines a zone’s authoritative meta information |


    # Alias Records


    It’s also possible to route traffic from one domain to another using an alias
    record. While the use of alias records has not been standardized across providers,
    Route 53 makes them available within record sets, allowing you to connect directly
    with network-facing resources running on AWS.


    # Amazon Route 53


    With those DNS basics out of the way, it’s time to turn our attention back to
    AWS. Route 53 provides more than just basic DNS services. In fact, it focuses
    on four distinct areas: domain registration, DNS management, availability monitoring
    (health checks), and routing policies (traffic management).

    In you’re curious, the “53” in Route 53 reflects the fact that DNS traffic uses
    network port 53 to do its job.


    # Domain Registration


    While there’s nothing stopping you from registering your domains through any ICANN-ac
    registrar—like GoDaddy—you can just easily use Route 53. For'
