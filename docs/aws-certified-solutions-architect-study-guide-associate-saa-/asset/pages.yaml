- pgno: 238
  md: '# Designing for Availability


    When creating your subnets, leave enough unused space within the CIDR to add additional
    subnets later. This is important for a couple of reasons. First, AWS occasionally
    adds additional availability zones to a region. By leaving additional space, you
    can take advantage of new availability zones. Your availability requirements may
    call for only one availability zone today, but it doesn''t hurt to leave room
    in case you change. Second, even if you never need an additional availability
    zone, you may still need a subnet to manage your resources for security or ease
    of management. When you separate an application''s components into multiple subnets,
    it''s called a multi-tier architecture.


    Leave plenty of space in each subnet. Naturally, having more instances will consume
    IP addresses. Leave enough free space in each subnet for resources to use as demand
    grows. If any of your instances have multiple IP addresses, take that into account.
    Also, remember that EC2 instances are the only resources that consume space. Consider
    Elastic Load Balancing interfaces, database instances, and VPC interface endpoints.


    # External Connectivity


    Your application''s availability is dependent on the availability of the network
    users use to access it. The definition of availability is that your application
    is working as expected. If your users can''t connect to it because of a network
    issue, your application is unavailable, to them, even if it''s healthy and operating
    normally. Therefore, the method users use to connect to the AWS cloud needs to
    meet your availability requirements.


    The most common way to connect to AWS is via the Internet, which is generally
    reliable, but speed and latency can be unpredictable. If getting to your application
    is painful slowly, you may consider it to be unavailable.


    To get around a slow Internet pipe or for mission-critical applications, you may
    choose to use Direct Connect, either as a primary connection to AWS or as a backup.
    If you need a fast and reliable connection to AWS—such as if you''re pushing a
    lot of data—Direct Connect offers access speeds of 1 or 10 Gbps with consistent
    latency. As a secondary connection, if you use the Internet to reach your AWS
    resources, you can get through using Direct Connect.


    If you''re going to use Direct Connect, VPC peering, or a VPN connection to an
    external network, make sure your VPC addresses don''t overlap with those used
    in the external network. Also, be sure to leave enough room to assign IP addresses
    to virtual private gateways and Direct Connect private virtual interfaces.


    # Designing for Availability


    Understanding all of the different factors that go into architecting for reliability
    is important. But as an AWS architect, you need to be able to start with an availability
    requirement and design a solution that meets it. In this section, you''ll learn
    how to start with a set of'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Chapter 9 ■ The Reliability Pillar


    application requirements and design different AWS infrastructures to meet three
    common availability percentages: 99 percent, 99.9 percent, and 99.99 percent.


    As you might expect, there''s a proportional relationship between availability,
    complexity, and cost. The higher the availability, the more resources you''re
    going to need to provision, which adds more complexity and, of course, more cost.
    Although most organizations want as an AWS architect must strike a balance between
    availability and cost. Designs with lower availability may appear, from a technical
    standpoint, to be finer. But at the end of the day, the needs and priorities of
    the organization are what matter.


    In the following scenarios, you''ll architect a solution for a web-based payroll
    application that runs as a single executable on a Linux EC2 instance. The web
    connection connects to a backend SQL database for storing data. Static web assets
    are stored in a public S3 bucket. Users connect to the application by browsing
    to a public domain name that is hosted on Route 53.


    # Designing for 99 Percent Availability


    In the first scenario, you''re aiming for 99 percent availability, or about 3.5
    days of downtime year. Downtime is an inconvenience but not the end of the world.


    In this case, you''ll create a single EC2 instance to run both the application
    and a self-hosted SQL database. For backing up, you''ll run a script to automatically
    back up the database to an S3 bucket with versioning enabled. To keep data under
    control, you''ll configure S3 lifecycle policies to move older backups to the
    Glacier storage class. To alert users during outages, configure a Route 53 health
    check to monitor the health of the application by checking for an HTTP 200 OK
    status code. Create a Route 53 failover record to direct users to the application
    when the health check passes and to a static web page when it doesn''t. The static
    web page can be stored in either a public S3 bucket configured for website hosting
    or a CloudFront distribution.


    # Recovery Process


    It''s important to test your recovery processes regularly so that you know they
    work and how long they take. Don''t just create a SQL dump and upload it to an
    S3 bucket. Regularly bring up a new instance and practice restoring a backup to
    it.


    To quickly build or rebuild your combination application/database instance, use
    CloudFormation to do the heavy lifting for you. Create a CloudFormation template
    to create a new instance, install and configure the web and database servers,
    copy application files from a repository, and set security groups. The CloudFormation
    template serves two purposes: rebuilding quickly in case of an instance failure
    and creating a throwaway instance for practicing database restores and testing
    application updates.


    # Availability Calculation


    When it comes to estimating availability, you''re going to make some assumptions.
    Each failure will require 30 minutes to analyze and decide whether to initiate
    your recovery'
