- pgno: 211
  md: '# Traffic Flow


    Route 53 Traffic Flow is a console-based graphic interface that allows you to
    visualize complex combinations of routing policies as you build them. Figure 8.2
    shows what a Traffic Flow configuration can look like.


    # FIGURE 8.2 A sample Traffic Flow policy


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_211_0.png)


    https://console.aws.com/route53/trafficflow/home/#


    Because it seamlessly integrates routing policies with all the possible resource
    endpoints associated with your AWS account, Traffic Flow can make it simpler to
    quickly build a sophisticated routing structure. You can also use and customize
    routing templates.


    Traffic Flow offers a routing policy that, as of the time of writing, is not available
    as a regular Route 53 policy: Geoproximity Routing. Geoproximity gives you the
    precision of geolocation routing but at a far finer level. Geoproximity routing
    rules can specify geographic areas by their relationship to either a particular
    longitude and latitude or to an AWS region. In both cases, setting a bias score
    will define how widely beyond your endpoint you want to apply your rule.'
