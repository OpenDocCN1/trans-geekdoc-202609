  md: 'Obviously, not all of these items will be relevant to all of your users.


    # # Access Keys


    Access keys provide authentication for programmatic or CLI-based access. Rather
    than having to find a way for your application to input a traditional username
    and password, you can make your local environment aware of the access key ID and
    secret access key. Using that information, your application or command can pass
    authentication data along with each request.


    You learned about access keys in action in Chapter 2, "Amazon Elastic Compute
    Cloud and Amazon Elastic Block Store." You should also become familiar with the
    AWS access key lifecycle and how it should be managed.


    # # Deactivating Unused Keys


    Each access key is a potential source of account vulnerability. Audit the keys
    associated with each of your users from time to time, and if you can confirm that
    any of these keys are not currently being used, deactivate them. If you have no
    plans to use them in the future, delete them altogether.


    # # Key Rotation


    Best practices require that you regularly retire older access keys because the
    longer a key has in use, the greater the chance that it has been compromised.
    Therefore, it makes good sense to set a limit—perhaps 30 days—beyond which keys
    must be deleted and replaced by new ones.


    Key rotation is automated for IAM roles used by EC2 resources to access other
    AWS services. But if your keys are designated for your own applications, things
    can be more complicated. A good idea is to follow this protocol:


    +   1. Generate a new access key for each of your users. Users can also be given
    the ability to manage their own keys.


    +   2. Update your application settings to point to the new keys.


    +   3. Deactivate (but don''t delete) the old keys.


    +   4. Monitor your applications for a few days to make sure all the updates were
    successful. The CLI command


    ```

    aws iam get-access-key-last-used --access-key-id ABCDEFGHIJKLMNOP

    can be used to determine whether any applications are still using an old key.

    ```


    +   5. When you''re sure you have everything, delete the old keys.


    Key rotation can be enforced by including rotation in the password policy associated
    with your IAM user accounts.

    Exercise 6.3 can guide you through a simple access key lifecycle.'
  merge: -1
  img_proc: true
