- pgno: 21
  md: '# xxvi


    # Introduction


    The AWS Certified Solutions Architect Study Guide: Associate SAA-C01 Exam, Second
    Edition is divided into two parts: “The Core AWS Services” and “The Well-Architected
    Framework.”


    # Part I, “The Core AWS Services”


    The first part of the book dives deep into each of the core AWS services. These
    services include ones you probably already have at least a familiarity with: Elastic
    Compute Cloud (EC2), Virtual Private Cloud (VPC), Identity and Access Management
    (IAM), Route 53, and Simple Storage Service (S3), to just name a few.


    Some AWS services seem to serve similar or nearly identical purposes. You’ll learn
    about the subtle but important differences between seemingly similar services
    and, most importantly, when to use each.


    # Part II, “The Well-Architected Framework”


    The second part of the book is a set of best practices and principles aimed at
    helping you design, implement, and operate systems in the cloud. Part II focuses
    on the following five pillars of good design:


    +   - Reliability


    +   - Performance efficiency


    +   - Security


    +   - Cost optimization


    +   - Operational excellence


    Each chapter of Part II revis the core AWS services in light of a different pillar.
    Also, because not every AWS service is large enough to warrant its own chapter,
    Part II simultaneously introduces other services that, although less known, may
    still show up on the exam.


    Achieving the right balance among these pillars is a key skill you need to develop
    as a solutions architect. Prior to beginning Part II, we encourage you to peruse
    the Well-Architected Framework white paper, which is available for download at
    https://d0.awsstat.com/whitepapers/architecture/AWS_Well-Architected_Framework.pdf.


    # What Does This Book Cover?


    This book covers what you need to know to prepare for the Amazon Web Services
    (AWS) Certified Solutions Architect – Associate exam:


    Chapter 1: Introduction to Cloud Computing and AWS This chapter overviews the
    AWS Cloud computing platform and its core services and concepts.'
  merge: -1
  img_proc: true
