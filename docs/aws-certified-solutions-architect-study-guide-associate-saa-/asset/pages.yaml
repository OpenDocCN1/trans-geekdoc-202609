- pgno: 6
  md: '# About the Authors


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_6_0.png)


    **David Clinton** is a Linux server admin who has worked with IT infrastructure
    in both academic and enterprise environments. He has authored books—including
    Learn Amazon Web Services in a Month of Lunches (Manning Publications, 2017) and
    Linux in Action (Manning Publications, 2018)—and created more than 15 video courses
    teaching Amazon Web Services and Linux administration, server virtualization,
    and IT security for Pluralsight.


    In a "previous life," David spent 20 years as a high school teacher. He currently
    lives in Toronto, Canada, with his wife and family and can be reached through
    his website: https://bootstrap-it.com.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_6_1.png)


    **Ben Piper**, a native of Augusta, Georgia, is an IT consultant who works with
    clients in the Georgia-Carolina area. He has created more than 20 training courses
    covering Amazon Web Services, Cisco routing and switching, Puppet configuration
    management, and Windows Server Administration. He''s also the author of Learn
    Cisco Network Administration in a Month of Lunches (Manning Publications, 2017).
    Over the years he has designed, implemented, and maintained a variety of technologies
    including VMware vSphere, Citrix XenApp, XenServer, NetScaler, and Cisco network
    infrastructure. You can contact Ben by visiting his website: https://benpiper.com.'
  merge: -1
  img_proc: true
