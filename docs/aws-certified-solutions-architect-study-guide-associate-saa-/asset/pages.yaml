  md: '# Acknowledgments


    We would like to thank the following people who helped us create this AWS Certified
    Solutions Architect Study Guide: Associate SAA-C01 Exam, Second Edition.


    First, a special thanks to our friends at Wiley. Kenyon Brown, senior acquisitions
    editor, got the ball rolling on this project and push to get this book published
    quickly. His experience and guidance throughout the project was critical. Kathi
    Duggan, development editor, helped us push this book forward by keeping us accountable
    to her deadlines. Her edits made many of the technical parts of this book more
    readable. Thanks also to Katie Wisor, production manager; Christine O''Connor,
    production editor; Pete Gaughan, content enablement manager; and Nancy Carrasco,
    proofreader.


    John Mueller reviewed the chapters and questions for technical accuracy. Not only
    did his comments and suggestions make this book more accurate, he also provided
    additional ideas for the chapter review questions to make them more challenging
    and relevant to the exam. Thanks also go to Sara Perrott and Shlomo Swidler for
    providing technical proofreading.


    Lastly, the authors would like to thank each other!'
