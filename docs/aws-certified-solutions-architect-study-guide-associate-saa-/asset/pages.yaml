- pgno: 341
  md: '# CodePipeline


    CodePipeline lets you automate the different stages of your software development
    and release process. These stages are often implemented using continuous integration
    (CI) and continuous delivery (CD) workflows or pipelines. Continuous integration
    (CI) and continuous delivery (CD) are different but related concepts.


    # Continuous Integration


    Continuous integration is a method whereby developers use a version control system
    such as Git to regularly submit or check in their changes to a common repository.
    This first stage of the pipeline is the source stage.


    Depending on the application, a build system may compile the code or build it
    into a binary file, such as an executable, AMI, or container image. This is called
    the build stage. One goal of integration is to ensure that the code developers
    adding to the repository as expected and meets the requirements of the application.
    Thus, the build stage may include unit tests, such as verifying that a function
    given a certain input returns the correct output. If a change to it causes something
    to break, the developer can learn of the error and fix it early. Not all applications
    require a build stage. For example, a web-based application using an interpreted
    language like PHP doesn''t need to be compiled.


    # Continuous Delivery


    Continuous delivery incorporates elements of the continuous integration process
    but also deploys the application to production. A goal of continuous delivery
    is to allow frequent updates to an application while minimizing the risk of failure.
    To do this, continuous pipelines usually include a test stage. As with the build
    stage, the actions performed in test depend on the application. Testing a web
    application may involve deploying it to a test server and verifying that the web
    pages display the correct content. On the other hand, testing a Linux executable
    that you plan to release publicly may deploying it to test servers running a variety
    of Linux distributions and versions.


    The final stage is deployment in which the application is deployed to production.
    Although continuous delivery can be fully automated without requiring human intervention,
    it''s common to require manual approval before releasing an application to production.
    You can also schedule releases to occur regularly or during downtime times as
    maintenance windows.


    Because continuous integration and continuous delivery overlap, you''ll often
    see them combined into one for the term CI/CD pipeline. Keep in mind that though
    a CI/CD pipeline includes every stage from source to deployment, that doesn''t
    mean you have to deploy to production every time you make a change. You can add
    logic'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'to require a manual approval before deployment. Or you can disable transitions
    from one stage to the next. For instance, you may disable the transition from
    the test stage to the deployment stage until you''re actually ready to deploy.


    # Creating the Pipeline


    Every CodeDeploy pipeline must include at least two stages and can have up to
    10. Within each stage, you must define at least one task or action to occur during
    the stage. An action can be one of the following types:


    +   - Source

    - Build

    - Test

    - Approval

    - Deploy

    - Invoke


    CodePipeline integrates with other AWS and third-party providers to perform the
    actions. You can have at least one action in the same stage, and can not include
    any other types of actions. They can run sequentially or in parallel. For example,
    during your testing stage you can have two separate test actions that execute
    concurrently. Note that different action types can occur in the same stage. For
    instance, you can build and test actions in the same stage.


    # Source


    The action type specifies the source of your application files. The first stage
    of a pipeline must include at least one action and can include any other types
    of actions. Valid providers for the source type are CodeCommit, S3, or GitHub.


    If you specify CodeCommit or S3, you must also specify the ARN of a repository
    or bucket. AWS can use CloudWatch to detect when a change is made to the repository
    or bucket. Alternatively, you can have CodePipeline periodically poll for changes.

    To add a GitHub repository as a source, you will have to grant CodePipeline permission
    to access your repositories. Whenever you update the repository, GitHub creates
    a webhook that notifies CodePipeline of the change.


    # Build


    Not all applications require build actions. An interpreted language such as those
    used in shell scripts and declarative code such as CloudFormation templates doesn''t
    require compilation. However, noncompiled languages may benefit from a build stage
    that analyzes the code for syntax errors and style.


    The build action can use AWS CodeBuild as well as third-party providers CloudBuild,
    Jenkins, Solano CI, and TeamCity. AWS CodeBuild is a managed build service that
    lets you compile source code and perform unit tests. CodeBuild offers on-demand'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'build environments for a variety of programming languages, saving you from
    having to cre- nate and manage your own build servers.


    # Test


    The test action can also use AWS CodeBuild as a provider. For testing against
    smart- phone platforms, AWS DeviceFarm offers testing services for Android iOS
    and web appli- cations. Other supported providers are BlazeMeter, Ghost Inspector,
    HPE StormRunner halts. NovaLoad, and Runscope.


    # Approval


    The approval action type includes only one action: manual approval. When pipeline
    execu- tion reaches this, it awaits manual approval before continuing to the next
    stage. If there''s no manual approval within seven days, the action is denied,
    and pipeline execution halts. You can optionally send an SNS notification, which
    includes a link to approve or deny the request and may include a URL for the approval
    to review.


    # Deploy


    For deployment, CodePipeline offers integrations with CodeDeploy, CloudFormation,
    Elastic Container Service, Elastic Beanst, OpsWorks Stands, Service Catalog, and
    ZebiaLabs.


    Recall that CodeDeploy doesn''t let you specify CodeCommit repository for your
    application files. But you can specify CodeCommit as the provider for the source
    action and CodeDeploy as the provider for the Deploy action.


    # Invoke


    If you want to run a custom Lambda function as part of your pipeline, you can
    invoke it using the invoke action type. For example, you can write a function
    to create an EBS snap-shot, perform application testing, can use unused resources,
    and so on.


    > At least one stage must have an action that''s not a source action type.


    # Artifacts


    When you create a pipeline, you must specify an S3 bucket to store the files used
    during different stages of the pipeline. CodePipeline compresses these files into
    a ZIP file called an artifact. Different actions in the pipeline can take as an
    input, generate it as an output, or both.


    The first stage in your pipeline must include a source action specifying the location
    of your application files. When your pipeline runs, CodePipeline compresses the
    files to create a source artifact.'
  merge: -1
  img_proc: true
