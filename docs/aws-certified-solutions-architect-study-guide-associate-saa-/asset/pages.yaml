- pgno: 194
  md: '# Managed and Custom Rules


    In addition to monitoring resources changes, AWS Config lets you specify rules
    to define the optimal baseline configuration for your resources. AWS Config also
    provides custom-defined rules that cover a variety of common scenarios. For example,
    you may need to verify that CloudTrail is enabled, that every EC2 instance has
    an alarm tracking the CPUUtilization metric, that EBS volumes are encrypted, or
    that multifactor authentication (MFA) is enabled for the root account. If any
    resources are noncompliant, AWS Config flags them and generates an SNS notification.


    When you activate a rule, AWS Config immediately checks monitored resources against
    the rules to determine whether they are compliant. After that, it often reeval
    resources based on how the rule is configured. A reevaluation can be triggered
    by configuration changes or periodically. Periodic checks can occur every hour
    or every 3, 6, 12, or 24 hours. Note that if you turn off the configuration recorder,
    periodic rules will continue to run.


    # Summary


    You must configure CloudWatch and AWS Config before they can begin monitoring
    your resources. CloudTrail automatically logs only the last 90 days of management
    events even if you don''t configure it. It''s therefore a good idea to configure
    these services early in your AWS deployment.


    CloudWatch, CloudTrail, and AWS Config serve different purposes, and it''s important
    to know the differences among them and when each is appropriate for a given use
    case.


    CloudWatch tracks performance metrics and can take some action in response to
    those metrics. It can also collect and consolidate logs from multiple sources
    for storage and searching, as well as extract metrics from them.


    CloudTrail keeps a detailed record of activities performed on your AWS account
    for security or auditing purposes. You can choose to log read-only or write-only
    management or data events.


    AWS Config records resource configurations and relationships past, present, and
    future. You can look back in time to see how a resource was configured at any
    point. AWS Config can also compare current resource configurations against rules
    to ensure you''re compliant with whatever baseline you define.


    # Exam Essentials


    Know how to configure the different features of CloudWatch. CloudWatch receives
    and stores performance metrics from various AWS services. You can also send custom
    metrics to CloudWatch. You can configure alarms to take one or more actions based
    on'
