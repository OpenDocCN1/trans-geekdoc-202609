  img_proc: true
- pgno: 84
  md: '# Durability


    S3 measures durability as a percentage. For instance, the 99.999999999 percent
    durability guarantee for most S3 classes and Amazon Glacier is as follows:


    > “. corresponds to an average expected loss of 0.0000000001 of objects. For example,
    if you store 10,000,000 objects with Amazon S3, you can expect on average to incur
    a loss of a single object every 10,000 years.”


    Source: https://aws.amazon.com/s3/faqs


    In other words, realistically, there’s pretty much no that you can possibly lose
    data stored on one of the S3/Glacier platforms because of infrastructure failure.
    However, it would be irresponsible to rely on your S3 classes as the buckets only
    of important data. After, there’s a real chance that a misconfiguration, account
    lockout, or unexpected extra could permanently block access to your data. And,
    as crazy as it might sound right, it’s not unthinkable that AWS could go out of
    business. Kodak and Blockbuster Video once dominated their industries, right?


    The high durability rates delivered by S3 are largely because they automatically
    replicate your data across at least three availability zones. That means even
    if an entire AWS facility was suddenly wiped off the map, copies of your data
    would be restored from a different zone.


    There are, two storage classes that aren’t quite resilient. Amazon S3 Zone-Infrequent
    Access (S3 Zone-IA), as the name suggests, stores data in only a single availability
    zone. Reduced Redundancy Storage (RRS) is rated to get up to 99.9 percent durability
    (because it’s replicated across fewer servers than other classes). You can balance
    increased/decreased durability against other features like availability and cost
    to get the balance that’s right for you. All S3 durability levels are shown in
    Table 3.1


    # TABLE 3.1 Guaranteed reliability standards for S3


    | S3 Standard | S3 Standard-IA | S3 One Zone-IA | Reduced Redundancy |

    |---|---|---|---||

    | Durability guarantee | 99.999999999% | 99.999999999% | 99.999999999% | 99.99%
    |

    | Concurrent facility fault tolerance | 2 | 2 | 1 | 1 |


    # Availability


    Object availability is also measured as a percentage, this time, it’s the percentage
    you can expect given object to be instantly available on request through the course
    of a full year. The Amazon S3 Standard class, for example, guarantees that your
    data will be ready whenever you need it (meaning; when it is available) for 99.99%
    of the year. That there will be less than nine hours each year of down time. If
    you feel down-time has exceeded that'
  merge: -1
