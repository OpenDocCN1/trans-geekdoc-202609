- pgno: 185
  md: '# CloudWatch Logs and Log Groups


    CloudWatch stores log events that are records of activity recorded by an application
    or AWS resource. For CloudWatch Logs to understand a log event, the event must
    contain a timestamp and a UTF-8 encoded event message.

    CloudWatch Logs stores log events from the same source in a log stream. For example,
    if you have multiple instances running a web server that generates access logs,
    each instance would send that log to CloudTrail or a separate stream. You can
    manually delete log streams, but not individual log events.


    CloudWatch organizes logs into log groups. A stream must exist in only one log
    group. To organize log streams, you can place them in the same log group. There''s
    no limit to the number of streams in a group.


    You may define the retention settings for a log group, choosing to keep log events
    from 1 day to 10 years or indefinitely, which is the default setting. The retention
    settings apply to all log streams in a log group. You can manually export a log
    group to an S3 bucket for archiving.


    # Metric Filters


    You can use metric filters to extract data from logs in a log group to create
    CloudWatch metrics. You can create a metric filter to track the occurrences of
    a string at a position in a log file. For example, you might want to track the
    occurrence of 404 Not Found errors in an Apache web server application. You would
    create a metric filter to track the number of times the "404" appears in the HTTP
    status code of the log. Every time CloudWatch receives a log event that matches
    the filter, it increments a custom metric. You might name this metric HTTP404Errors
    and store it in the custom Apache namespace. Of course, you can then graph this
    metric in CloudWatch.


    Metric values must be numeric to extract a numeric value, such as the number of
    bytes transferred in, and store that in a metric. You can''t use a metric filter
    to extract a non-numeric string, such as an IP address, from a log and store it
    as a metric. You can, however, increment a metric when the metric filter matches
    a specific string.


    Metric filters apply to log groups, and you can create a metric filter only after
    creating the group. Metric filters are not retroactive and will not generate metrics
    based on log events that CloudWatch recorded before the filter''s creation.


    # CloudWatch Agent


    The CloudWatch Agent collects logs from EC2 instances and on-premises servers
    running Linux or Windows operating systems. The agent can also collect performance
    metrics, including metrics that EC2 does not natively produce, such as memory
    utilization. Metrics generated by the agent are custom and stored in a custom
    namespace that you specify.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Sending CloudTrail Logs to CloudWatch Logs


    You can configure CloudTrail to send a trail log to a CloudWatch Logs stream.
    This lets you search and extract metrics from your trail logs. Remember that CloudTrail
    generates trail logs in JSON format and stores them in an S3 bucket of your choice,
    but it doesn''t provide a way to search them. CloudWatch understands JSON format
    and makes it easy to search for specific events. To search for failed console
    logs, you would filter the log using the following syntax:


    ```

    {$eventSource = "signin.amazonaws.com" && $.responseElements.consoleLogin = "Failure"}

    ```


    You must specify a log group and an IAM role to use. CloudTrail can create the
    role for you and then assume the role to create the log group. CloudTrail then
    begins delivering new trail logs to CloudWatch Logs. Delivery is instant, and
    it can take a few minutes before trail logs show up in CloudWatch Logs. Complete
    Exercise 7.3 to configure your existing CloudTrail to deliver trail logs to CloudWatch
    Logs.


    CloudTrail does not send log events larger 256 KB to CloudWatch Logs. Hence, a
    single RunInstances call to launch 500 instances would exceed this limit. Therefore,
    make sure you break up large requests if you want them to be available in CloudWatch
    Logs.


    # EXERCISE 7.3


    # Deliver CloudTrail Logs to CloudWatch Logs


    In this exercise, you will reconfigure the trail you created in Exercise 7.1 to
    stream events captured by CloudTrail to CloudWatch Logs.


    +   1. Browse to the CloudTrail console and click Trails.

    2. Click the name of the trail you created in Exercise 7.1.

    3. Under the heading CloudWatch Logs, click the Configure button.

    4. CloudTrail prompts you to use a New or Existing Log Group. It should automatically
    populate this field with CloudTrail/DefaultLogGroup. You may stick with this or
    enter a name of your choice.

    5. Click the Continue button.

    6. CloudTrail will take you to a new screen prompting you to allow it to assume
    an IAM role that will give it permissions to stream logs to CloudWatch Logs. Click
    the Allow button.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# CloudWatch Alarms


    A CloudWatch alarm watches over a single metric and performs an action based on
    its value over a period of time. The action CloudWatch takes can include things
    such as sending an email notification, rebooting an instance, or executing an
    Auto Scaling.

    to create an alarm, you first define the metric you want to monitor. In the same
    way CloudWatch doesn''t graph metrics directly but graph statistics over a period,
    CloudWatch alarms does not monitor metrics directly. Instead, it performs statistical
    analysis of a metric over time and monitors the results. This is called data point
    to monitor.


    # Data Point to Monitor


    Suppose you want to monitor the average of the AWS/EBS VolumeReadOps over a 15-minute
    period. The metric has a resolution of 5 minutes. You would choose Average for
    the statistic and 15 minutes for the period. Every 15 minutes CloudWatch would
    take three data points—every five minutes—and average them together to generate
    a single data point to monitor.


    > You should set the period equal to or greater than the resolution of the metric.
    If you set a lower period, such as one minute, CloudWatch will look for a data
    point every minute, but because the metric updates only every five minutes, it
    will count four of the five metrics as missing. This will result in the alarm
    not working properly.


    If you use a percentile for the statistic, you must also select whether to ignore
    data points until the alarm collects a statistically significant number of data
    points. What constitutes statistically significant depends on percentile. If you
    set the percentile to .5 (p50) or greater, you may need 10/(1-percentile) data
    points to have a statistically significant sample. For example, if you use the
    p80 statistic, a statistically significant number of data points would be 10/(1-.8)
    or 50. If the percentile is less than .5 (like p25), you''d need 10/.25) or 40
    data points. If you choose to ignore data points before you have a statistically
    significant sampling, CloudWatch will not evaluate any of them. In other words,
    your alarm will be effectively disabled.


    # Threshold


    The threshold is the value data point to monitor must meet or cross to indicate
    something is wrong. You define it by specifying a value and a condition. If you
    want to trigger an alarm when CPUUtilization meets or exceeds 50 percent, you
    would set the threshold for that alarm to >= 50. Or if you want to know when CPUCreditBalance
    falls below 800, you would set the threshold to < 800.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Alarm States


    An alarm can be in one of the three following states at any given time:


    ALARM Data points to alarm have crossed and remained past a defined threshold
    for a period of time.


    OK Data points to alarm have not crossed and remained past a defined threshold
    for a period of time.


    INSUFFICIENT_DATA The alarm has not collected enough data to determine whether
    the data points to alarm have crossed a threshold.


    New alarms always start out in an INSUFFICIENT_DATA state. It''s important to
    remember that an alarm state doesn''t necessarily indicate a problem, and an OK
    state doesn''t necessarily indicate the absence of a problem. Alarm tracks only
    whether the data points to alarm have crossed and remained past a threshold for
    a period of time.


    # Data Points to Alarm and Evaluation Period


    The period of time data point to monitor must remain crossing the threshold to
    trigger an alarm state change depends on the data points to alarm. For example,
    if the period is five minutes and the data points to alarm is three, the data
    points to monitor must cross and remain crossing the threshold for 5 minutes before
    the alarm goes into an alarm state.


    There are cases where you may want to trigger the alarm if a data point to monitor
    crosses the threshold periodically but not remain it. For this, you can set an
    evaluation period that is to or greater than the data points to alarm. Suppose
    you want to trigger an alarm if the data point to monitor the threshold for three
    out of five data points. You would set the evaluation period to 5. The alarm would
    trigger if any three of the five data points exceed the threshold. The exceeding
    values don''t have to be consecutive. This is called an m out of n, where m is
    the data point to and n is the evaluation period. The evaluation period can''t
    exceed 24 hours.


    To give an illustration, let''s say an alarm with a threshold of >= 40. The data
    points to alarm is 2, and the evaluation period is 3. Now CloudWatch evaluates
    the following three consecutive data points: 46, 39, and 41. Two of the three
    data points exceed the threshold, so the alarm will transition to the ALARM state.


    Following that, CloudWatch evaluates the consecutive data points 45, 30, and 25.
    Two of the three data points fall below the threshold, so the alarm transitions
    to an OK state. Notice that CloudWatch must evaluate three data points (the evaluation
    period) before it changes the alarm state.


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_188_0.png)


    When monitoring metrics for EC2 instances using the Nitro hypervisor, make sure
    the evaluation period is at least 2. Triggering an alarm based on a single data
    point may result in false positives because of the way EC2 delivers metrics to
    CloudWatch.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Missing Data


    Missing data can occur during an evaluation period. This may happen if you detach
    an EBS volume from or stop an instance. CloudWatch offers the following four options
    for how it evaluates periods with missing data:


    **As Missing** treats this period missing data as if it never happened. For instance,
    if over periods the data points are 41, no data, 50, and 25, CloudWatch will remove
    the period with no data from consideration. If the evaluation period is 3, it
    will evaluate only three periods with the missing data as occurring in the evaluation
    period. This is the default setting.


    **Not Breaking** Missing data points are treated as not breaching the threshold.
    Consider three out of four alarm with a threshold <40, given the same data points:
    41, no data, 50, and 25. Even though two values are breaching, the alarm would
    not trigger because the missing data is assumed to be not breaching.


    **Breaching** CloudWatch treats missing data as breaching the threshold. Using
    the preceding illustration, the alarm would trigger, as three of the four values
    would exceed the threshold.


    **Ignore** The alarm does not change state until it receives the number of consecutive
    data points specified in the data points alarm setting.


    # Actions


    You can configure an alarm to take an action when it transitions to a given state.
    You''re not limited to just when an alarm goes into an ALARM state. You can also
    have CloudWatch take an action when the alarm transitions to an OK state. This
    is useful if you want to receive a notification when CPU utilization is abnormally
    high and another returns to normal. You can also trigger an action when an alarm
    monitoring goes into an INSUFFICIENT_DATA state, which may occur when the instance
    shuts down. You can choose from the following actions:


    **Notification Using Simple Notification Service** The Simple Notification Service
    (SNS) uses communication channels called topics. A topic allows a sender or publisher
    to send a notification to one or more subscribers.


    A subscribes of a protocol and an endpoint. The endpoint can be HTTP, HTTPS, Simple
    Queue Service (SQS), Lambda, a mobile push notification, email, email-JSON, or
    short message service (SMS). The endpoint depends on the protocol. In the case
    of email-JSON, the endpoint would be an email address. In the case of SQS, it
    would be a queue. The endpoint for HTTP or HTTPS would be a URL.


    When creating an alarm action, you specify an SNS topic. When the alarm triggers,
    SNS takes care of relaying the notification to the subscribers of the topic.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Auto Scaling Action


    If you''re using Auto Scaling, you can create a simple Auto Scaling policy to
    add or remove instances. The policy must exist before you can select it as an
    alarm action.


    EC2 Action You can stop, terminate, reboot, or recover an instance in response
    to an alarm state change. You might choose to monitor the AWS/EC2 StatusCheckFailed
    metric, which returns 1 if there''s a problem with the instance, as memory exhaustion,
    system corruption, or incorrect network or startup configuration. Issues could
    be corrected by rebooting the instance.


    You might also monitor the StatusCheckFailed_System metric, which returns 1 when
    there''s a problem that requires AWS involvement to repair, such as a loss of
    connectivity or power, hypervisor problems, or hardware failure. In response to
    this, the recover action migrates the instance to a new host and restarts with
    the same settings. In-memory data is lost during this process.


    EC2 actions are available only if the metric you''re monitoring includes the InstanceId
    as a dimension, as the alarm you specify will take place that instance. Using
    an EC2 action requires a service-linked role named AWSServiceRoleForCloudWatchEvents,
    CloudWatch can create events when you create the alarm.


    Although a single alarm can have multiple actions, it will take actions only transition
    to a single state that you specify when configuring the alarm. You cannot, for
    instance, set one action when an alarm transitions to an ALARM state and another
    action when it transitions to an OK state. Instead, you''d have to create two
    separate alarms.


    # AWS Config


    AWS Config tracks how your resources are configured at a point in time. Resources
    are entities that you can configure and manage using the management console, AWS
    CLI, or AWS SDKs. Think of AWS Config as a time machine. You can use it to see
    what a resource configuration looked like some point in the past versus what it
    looks like now.


    It can also show how your resources are related to one another so that you can
    see how a change in one resource might impact another. For instance, you create
    an EBS volume, attach it to an instance, and then later detach it. You can use
    AWS Config to see not exactly when you created the volume but when it was attached
    and detached from the instance.


    CloudTrail logs events, and CloudWatch can alert, but only AWS Config gives you
    a holistic view of your resources and how they were configured at any point in
    time. AWS Config can help you with the following objectives:


    Security AWS Config can notify you whenever a resource configuration changes,
    alerting you to potential breaches. You can also see what users had permissions
    at a given time.


    Easy Audit Reports You can provide a configuration snapshot report from any point
    in time.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Troubleshooting You can analyze configurations around the time the problem
    started. AWS Config makes it easy to spot misconfigurations and how a problem
    in one resource might impact another.


    Change Management AWS Config lets you see how a potential change to one resource
    could impact another. For example, if you plan change a security group, you can
    use AWS Config to quickly see all instances that use it.


    # The Configuration Recorder


    The configuration recorder is the workhorse of AWS Config. It discovers your existing
    resources, how they''re configured, monitors for changes, and tracks changes over
    time. By default, it monitors all items in the region you configure it. If you
    don''t want to monitor all resources of global services such as IAM. You can select
    specific resource types to monitor, such as EC2 instances, IAM users, S3 buckets,
    or DynamoDB tables. You can have only one configuration recorder per region.


    # Configuration Items


    The configuration recorder generates a configuration item for each resource. The
    configuration item contains the specific settings for a resource at a point in
    time, as well as the resource type, its ARN, and when it was created. The configuration
    item also includes the resource''s relationships to other resources. For example,
    a configuration item for an EBS volume would include the instance ID of the instance
    it was attached to the time it was created. AWS Config maintains configuration
    items for every resource it tracks, even after the resource is deleted. Configuration
    items are stored internally by AWS Config, and you can''t delete them manually.


    # Configuration History


    AWS Config uses configuration items to build a configuration history for each
    resource. A configuration history is a collection of configuration items for a
    given resource over time. A configuration history includes details about the resources,
    such as when it was created, how it was configured at different points in time,
    and when it was deleted, if applicable. It includes any API logged by CloudTrail.


    Every six hours in which a change occurs to a resource, AWS Config delivers a
    configuration history file to an S3 bucket that you choose. The S3 bucket is part
    of what AWS calls the delivery channel. Files are grouped by resource type. The
    configuration history for all EC2 instances goes into one file, while history
    for EBS volumes into another. The files are timestamped and kept in separate folders
    by date. You can also view configuration history directly from the AWS Config
    console. You can optionally add an SNS topic to the delivery channel to have AWS
    Config notify you immediately whenever there''s a change to a resource.'
  merge: -1
  img_proc: true
- pgno: 192
  md: "# Configuration Snapshots\n\nA configuration snapshot is a collection of all\
    \ configuration items from a given point in time. Think of a configuration snapshot\
    \ as a configuration backup for all monitored resources in your account.\n\nUsing\
    \ the AWS CLI you have AWS Config deliver a configuration snapshot to the bucket\
    \ defined in your delivery channel. By default, the delivery channel is named\
    \ default, so to deliver a configuration snapshot, you would manually issue the\
    \ following command:\n\n```\naws configservice deliver-config-snapshot --delivery-channel-name\
    \ default\n```\n\nAWS Config can automatically deliver a configuration snapshot\
    \ to the delivery channel at regular intervals. You cannot set automatic delivery\
    \ of in the console but must configure this using the CLI. To do this, you must\
    \ also specify a JSON file containing at minimum the following items:\n\n+   -\
    \ Delivery channel name (default)\n- S3 bucket name\n- Delivery frequency of the\
    \ configuration snapshot\n\nThe file may also optionally contain an SNS ARN. Let's\
    \ refer to the following file deliveryChannel.json:\n\n```\n{\n  \"name\": \"\
    default\",\n  \"s3BucketName\": \"my-config-bucket-us-east-1\",\n  \"snsTopicARN\"\
    : \"arn:aws:sns:us-east-1:account-id:config-topic\",\n  \"configSnapshotProperties\"\
    : {\n    \"deliveryFrequency\": \"TwentyFourHours\"\n  }\n}\n```\n\nThe delivery\
    \ frequency can be every hour or every 24, 12, 6, or 3 hours. To reconfigure the\
    \ delivery channel according to the settings in the deliveryChannel.json file,\
    \ you'd issue the following command:\n\n```\naws configservice put-delivery-channel\
    \ --delivery-channel file://deliveryChannel.json\n```\n\nTo verify that the configuration\
    \ change succeeded, issue the following command:\n\n```\naws configservice describe-delivery-channels\n\
    ```\n\nIf the output matches the configuration settings in the file, then the\
    \ configuration change was successful."
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Monitoring Changes


    The configuration recorder generates at least one new configuration item every
    time a resource is created, changed, or deleted. Each new item is added to the
    configuration history for the resource as well as the configuration history for
    the account.


    A change to one resource will trigger a new configuration item for not only the
    changed resource but also related resources. For instance, removing a rule in
    a security group causes the configuration recorder to create a new item for the
    security group and every instance that uses that security group.


    Although you can''t delete configuration items manually, you can configure AWS
    Config to keep configuration items between 30 days to 7 years. Seven years is
    the default. Note that the retention period does not apply to the configuration
    history and configuration snapshot files AWS Config delivers to S3.


    # Starting and Stopping the Configuration Recorder


    You can start the configuration recorder at any time using the web console or
    the CLI. During the time the configuration recorder is stopped, it doesn''t monitor
    or record changes. But it does retain configuration items. To stop it using the
    following CLI command, you must specify the configuration recorder''s name, which
    is default.


    ```

    aws configservice stop-configuration-recorder --configuration-recorder-name default

    ```


    To start the recorder, issue the following command:


    ```

    aws configservice start-configuration-recorder --configuration-recorder-name default

    ```


    # Recording Software Inventory


    AWS Config can record software inventory changes on EC2 instances and on-premises
    servers. This includes the following:


    +   * Applications

    * AWS components like the CLI and SDKs

    * The name and version of the operating system

    * IP address, gateway, and subnet mask

    * Firewall configuration

    * Windows updates


    To have AWS Config track these changes, you must enable inventory collection for
    the server using the EC2 Systems Manager. You also must ensure AWS Config monitors
    the SSM: ManagedInstanceInventory resource type.'
