- pgno: 272
  md: 'How should you configure your underlying storage? Should you go with the managed
    RDS, build your database on an EC2 instance, or choose Redshift or a third-party
    integration for data warehouse management?


    **When and how to use a load balancer.** Load balancers direct incoming client
    requests among multiple backend servers. This allows for scalable and reliable
    application delivery, as failing or overloaded instances can be automatically
    replaced or supported by others. Load balancing of one sort of another is a critical
    component of many—if not most—EC2 and RDS workloads.


    **Understand the value and function of infrastructure automation tools.** CloudFormation
    templates can be used to define and then automatically provision and launch complex
    resource stacks in multiple environments. Similarly, third-party solutions like
    Chef and Puppet can be deployed through AWS OpsWorks to script environments. Continuous
    integration and continuous deployment processes can also be managed through AWS
    developer tools.


    **Understand the importance of infrastructure monitoring and the tools available
    for the job.** It''s critically important to stay on top of changes and performance
    trends within your infrastructure. Active load simulation testing is an important
    ongoing component of your administration process, as is visualizing the data that''s
    produced using tools like CloudWatch Dashboards.


    **Understand how caching can be used to improve performance.** ElastiCache and
    CloudFront are two services that replicate data and store it to make it quickly
    available to consuming clients. ElastiCache can use either Memcached or Redis—you
    should know which will work best for a given workload.'
