  md: '# EC2 Instances


    Compute Optimized For more demanding web servers and high-end machine learning
    workloads, you''ll choose from the Compute Optimized family that includes C5 and
    C4 types. C5 machines—currently available from the c5.large to the c5.18large—give
    you as much as 3.5 GHz of processor speed and strong network bandwidth.


    Memory Optimized Memory Optimized instances work well for intensive database,
    data analysis, and caching operations. The X1e, X1, and R4 types are available
    with as much as 3 terabytes of DRAM-based and low-latency SSD storage volumes
    attached.


    Accelerated Computing You can achieve higher-performing general-purpose graphics
    unit (GPU) from the P3, P2, G3, and F1 types in the Accelerated Computing group.
    These instances use various generations of high-end NVIDIA GPUs or, from the F1
    instances, a Xilinx UltraScale+fieldprogrammable gate array (FPGA—if you don''t
    know what that is, you probably don''t need it). Accelerated Computing instances
    are recommended for demanding workloads such as 3D visualizations and rendering,
    financial analysis, and computational fluid dynamics.


    Storage Optimized The H1, I3, and D2 types typically make up the Storage Optimized
    family that have large, low-latency instance storage volumes—large as 16 TB (or,
    in the case of D2, up to 48 TB of slower HDD storage). These instances work well
    with distributed file systems and heavyweight data processing applications.


    The specification details and instance type names will frequently change as AWS
    continues to leverage new technologies to support its customers'' growing demands.
    But it''s important to be familiar with the instance type families and the naming
    conventions AWS uses to identify them.


    # Configuring an Environment for Your Instance


    Deciding where your EC2 instance will live is as important as choosing a performance
    configuration. Here, there are three primary details to get right: geographic
    region, virtual cloud (VPC), and tenancy model.


    # AWS Regions


    As you learned earlier, AWS servers are housed in data centers around the world
    and organized by geographical region. You''ll generally want to launch an EC2
    instance in the region that is physically closest to the majority of your customers
    or if you''re working with data that subject to legal restrictions, within a jurisdiction
    that meets your compliance needs. EC2 resources can be managed only when you''re
    ''located within'' their region. You set the active region in the console with
    the drop-down menu at the top of the page and through default configuration values
    in the AWS CLI or your SDK. You can update your CLI configuration by running aws
    configure.


    Bear in mind that the costs and functionality of services and features may vary
    between regions. It''s always a good idea to consider the most-to-date documentation.'
