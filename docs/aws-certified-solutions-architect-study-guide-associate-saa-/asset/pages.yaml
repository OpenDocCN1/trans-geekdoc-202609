  md: '# AmazonGuardDuty


    AmazonGuardDuty analyzes VPC flow logs, CloudTrail management event logs, and
    Route 53 DNS query logs, looking for known malicious IP addresses, domain names,
    and potentially malicious activity.


    You do not need to stream any logs to CloudWatch Logs for GuardDuty to be able
    to analyze them.


    When GuardDuty detects a potential security problem, it creates a finding, which
    is a notification that details the questionable activity. GuardDuty displays the
    finding in the GuardDuty console and also delivers the finding to CloudWatch Events.
    You can configure an SNS notification to send an alert or take an action in such
    an event. Findings are classified according to the ostensible purpose of the threat,
    which can be one of the following types:


    +   * Backdoor This indicates an EC2 instance has been compromised by malware
    that may be used to send spam or participate in distributed denial-of-service
    (DDoS) attacks. This finding may be triggered when the instance communicates on
    TCP port 25 or when it resolves the domain name of a known command-and-control
    server to coordinate DDoS


    +   * Behavior This indicates an EC2 instance is communicating on a protocol and
    port that does not normally does or is sending an abnormally large amount of traffic
    to an external host.


    +   * Cryptocurrency An EC2 instance is exhibiting network activity indicating
    that it''s operating at a Bitcoin node. It may be, sending, receiving, or mining
    Bitcoin.


    +   * Pentest A system running Kali, a popular distribution used for penetration
    testing, is making API calls against your AWS resources.


    +   * Persistence An IAM user with prior history of how so modified your user
    or resource permissions, security groups, routes, or network access control lists.


    +   * Recon This indicates a reconnaissance attack that may be underway. Behavior
    can trigger a finding that may also include a known malicious IP address addressing
    an EC2 instance on a port that is not blocked by a security group or network access
    control list. Reconnaissance can also include a malicious IAM attempting to invoke
    an API call against a resource in your AWS account. Another trigger is an IAM
    user with no history of doing so to enumerate security groups, network access
    control lists, AWS resources, and IAM user permissions.


    +   * ResourceConsumption This indicates that an IAM user has launched an EC2
    instance, despite having no history of doing so.


    +   * Stealth A password policy was weakened, CloudTrail logging was disabled
    or modified, or CloudTrail logs were deleted.


    +   * Trojan An EC2 instance is exhibiting behavior that indicates a Trojan may
    be installed. A Trojan is a malicious program that can send data from your AWS
    environment to an attacker or provide a way for an attacker to collect or store
    stolen data on your instance.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Detective Controls


    UnauthorizedAccess Indicates a possible unauthorized attempt to access your AWS
    resources via an API or console login. This finding type may also indicate some
    attempting to brute force a secure shell (SSH) or Remote Desktop Protocol (RDP)
    session.


    Notice that every finding relates to the inappropriate use of AWS credentials
    or the presence of malware on an EC2 instance. For example, in Figure 11.6, GuardDuty
    has detected network activity indicative of malware attempting to communicate
    with a command-and-control server, which is a server run by an attacker to coordinate
    various types of attacks.


    # **FIGURE 11.6** GuardDuty showing a possible malware infection


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_295_0.png)


    Remediating this finding might involve identifying and removing the malware or
    simply terminating the instance and creating a new one.


    In the case of the potentially inappropriate use of AWS credentials, remediation
    would include first contacting the authorized author of credentials to find out
    whether the activity was legitimate. If the credentials were used by an unauthorized
    party, then you would immediately revoke the compromised credentials and issue
    new ones.


    # # Amazon Inspector


    Amazon Inspector is an agent-based service that looks for vulnerabilities on your
    EC2 instances. When GuardDuty looks for security threats by inspecting network
    traffic and from your instances, the Inspector agent runs an assessment on the
    instance and analyzes its network, filesystem, and process activity. Inspector
    determines whether threats or vulnerabilities exist by comparing the collected
    data against one or more rules packages. Inspector offers five rules packages:


    **Common Vulnerabilities and Exposures** Common Vulnerabilities and Exposures
    (CVEs) are common vulnerabilities found in publicly released software, which includes
    both commercial and open source software for both Linux and Windows.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Chapter 11 ■ The Security Pillar


    Center for Internet Security Benchmarks These include security best practices
    for Linux and Windows operating system configurations.


    Security Best Practices These rules are a subset of the Center for Internet Security
    Benchmarks, providing a handful of rules against Linux instances only. Issues
    that these rules look include root access over SSH, lack of a secure password
    policy, and insecure permissions on system directories.


    Runtime Behavior Analysis detects the use of secure client and server protocols,
    used listening TCP ports, and on Linux systems, inappropriate file permissions
    and ownership.


    Network Reachability These rules detect network configurations that make resources
    in your VPC vulnerable. Some examples include having an instance in a public subnet
    or running an application on a well-known port.


    After an assessment run, Inspector generates a list of findings classified by
    the severity levels:


    +   * High—The issue should be resolved immediately.

    * Medium—The issue should be resolved at the next possible opportunity.

    * Low—The issue should be resolved at your convenience.

    * Informational—This indicates a security detail that isn''t likely to result
    in your system being compromised. Nevertheless, you may want to address it on
    your organization''s requirements.


    Note that the high, medium, and low severity levels indicate an issue is likely
    to result in a compromise of the confidentiality, integrity, or availability of
    information. Figure 11.7 shows a finding with a severity level of medium.


    # FIGURE 11.7 Inspector Finding showing that root users can log in via SSH


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_296_0.png)


    Once you resolve any outstanding security vulnerabilities on an instance, you
    can create a new AMI from that instance and go it forward when provisioning new
    instances.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Protecting Network Boundaries


    The network can be the first line of defense against attacks. All AWS services
    depend on the network, so when designing your AWS infrastructure, you should consider
    how your AWS resources will communicate with one another, with external resources,
    and with users.


    Many AWS services have public endpoints that are accessible via the Internet.
    The responsibility of AWS to manage the network security of these endpoints and
    protect them from attacks. However, you can control network access to and from
    the resources in your VPCs, such as EC2 instances, RDS instances, and elastic
    load balancers.


    # Network Access Control Lists and Security Groups


    Each resource within a VPC must reside within a subnet. Network access control
    lists define what traffic is allowed to and from a subnet. Security groups provide
    granular control of traffic to and individual resources, such as instances and
    elastic load balancer listeners. You should configure your security groups and
    network access control lists to allow traffic to and from your AWS resources using
    the protocols and ports required. If your security requirements call for it, you
    may also need to restrict communication to specific IP ranges


    Consider which of resources need to be accessible from the Internet. A VPC must
    have an Internet gateway for resources in the VPC to access the Internet. Also,
    each route table attached to each subnet must have a default route to the Internet
    gateway as. If you''re running a multipier application with instances that do
    not need Internet access—such as database servers—consider placing them in a separate
    subnet that permits traffic to and from the specific resources the instance needs
    to communicate with. With an added precaution, ensure the route table subnet is
    associated with doesn''t have a default route.


    # AWS Web Application Firewall


    The Web Application Firewall (WAF) monitors HTTP and HTTPS requests to an application
    load balancer or CloudFront distribution. WAF protects your applications from
    exploits that could result in a denial of service or unauthorized access to your
    application.


    Unlike network control lists and security groups, which allow or deny access based
    solely on a source IP address or port and protocol, WAF lets you inspect traffic
    for malicious activity, including injection of malicious scripts using cross-site
    scripting attacks, SQL statements used in SQL injection attacks, and abnormally
    long query strings. WAF can block these requests so that they never reach your
    application.


    WAF can also block traffic from source IP address patterns or geographic location.
    You can create a Lambda function to check a list of known malicious IP addresses
    and add them to a WAF block list. You can also create a Lambda function to analyze
    web server logs and identify IP addresses that generate bad or excessive requests
    indicative of an HTTP flood attack and add those addresses to a block list.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# AWS Shield


    Internet-facing applications running on AWS are of necessity vulnerable to DDoS
    attacks. AWS Shield is a service that helps protect your applications from such
    an attack. AWS Shield comes in two flavors.


    AWS Shield Standard Defends against common layer 3 and 4 DDoS attacks such as
    SYN flood and UDP reflection attacks. Shield Standard is automatically activated
    for all customers.


    AWS Shield Advanced Provides the protection as Shield Shield but also includes
    protection against layer 7 attacks, such as HTTP flood attacks that overwhelm
    applications with HTTP GET or POST requests. To obtain layer 7 protection for
    EC2 instance, it must have an elastic IP address. You also get attack notifications,
    forensic reports, and 24/7 assistance from the AWS DDoS response team. AWS WAF
    is included at no charge.


    Shield mitigates 99 percent of attacks in five minutes or less. It mitigates attacks
    against CloudFront and Route 53 less than one second and Elastic Load Balancing
    in less five minutes. Shield usually mitigates all other attacks in less than
    20 minutes.


    # Data Encryption


    Encrypting data ensures the confidentiality of data by preventing those without
    the correct key from decrypting and reading it. As a side effect, encryption also
    makes it infeasible for someone to modify the original data once it''s encrypted.


    Data can exist in one of two states: at rest, sitting on a storage medium such
    as an EBS volume or S3 bucket, and in transit across the network. When you encrypt
    data according to


    # Data at Rest


    How you encrypt data at rest depends on where it''s stored. On AWS, the bulk of
    your data will probably reside in S3, Elastic Block Store (EBS) volumes, or an
    Elastic File System (EFS) or a Relational Database Service (RDS) database. Each
    of these services integrates with KMS and gives you the option of using your own
    customer-managed master key (CMK) or an AWS-managed master key.


    When you use your CMK, you can configure key policies to control who may use the
    key to encrypt and decrypt data. You can also rotate, disable, and revoke keys.
    Using a customer-managed CMK gives you maximum control over your data.


    An AWS-managed CMK automatically rotates once a year. You can''t disable, or revoke
    it. You can view existing CMKs and create new ones by browsing to the Encryption
    Keys link in the IAM Dashboard.


    Most AWS services offer encryption of data at rest using KMS-managed keys, although
    a few including DynamoDB support only AWS-managed keys. That enabling encryption
    for some services such as CloudWatch Logs requires using the AWS CLI.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# S3


    If your data is stored in an S3 bucket, you have a number of encryption options.


    +   - Server-side encryption with S3-managed Keys (SSE-S3)

    - Server-side encryption with KMS-managed keys (SSE-KMS)

    - Server-side encryption with customer-provided keys (SSE-C)

    - Client-side encryption


    Remember that encryption applies per object, it''s possible to have a bucket containing
    objects using different encryption options or no encryption at all. Applying default
    encryption at the bucket level does not automatically encrypt existing objects
    in the bucket but only those created moving forward.


    # Elastic Block Store


    You can encrypt an EBS volume using a KMS-managed key. You can encrypt a volume
    when you initialize it. However, you cannot directly decrypt a volume created
    from an unencrypted snapshot or unencrypted AMI. You must first create a snapshot
    of the unencrypted volume and then encrypt the snapshot. To encrypt an existing
    unencrypted volume, follow the steps in Exercise 11.4.


    # EXERCISE 11.4


    # Encrypt an EBS Volume


    For this exercise, you will encrypt an unencrypted volume attached to a running
    EC2 instance.


    +   1. Create an EC2 instance from an unencrypted snapshot or AMI. If you already
    have one you can bear part with, which you may use that.

    2. At the EC2 Dashboard, click Volumes in the left-side menu.

    3. Select the volume attached to your instance.

    4. Under the Actions menu, click Create Snapshot. EBS will begin creating an unencrypted
    snapshot of the volume.

    5. On the left side menu, click Snapshots. Wait for the snapshot to complete.

    6. Select the snapshot and under the Actions menu, click Copy.

    7. Check the Encrypt This Snapshot checkbox.

    8. Next to the KMS Key dropdown, select the KMS key you''d like to use to encrypt
    the snapshot. You can use your own customer master key, or the default aws/ebs
    key.

    9. Click the Copy button. EBS begin creating an encrypted copy of the snapshot.
    The larger the volume, the longer the encryption process takes. A good rule of
    thumb is about 3 gigabytes per minute.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# EXERCISE 11.4 (continued)


    +   10. Select the encrypted snapshot and under the Actions menu, click Create
    Volume.


    +   11. Choose the volume type, size, and availability zone, which can be different
    than the original volume.


    +   12. Click the Create Volume button. The new volume will be encrypted using
    the same key that was used to encrypt the snapshot.


    You can now detach the decrypted volume from your instance and attach the encrypted
    volume.


    When you copy a snapshot, you have the option of choosing the destination region.
    The key you use to encrypt the destination snapshot must exist in the destination
    region.


    # Elastic File System


    You can enable encryption for an EFS filesystem when you create it. EFS encryption
    uses KMS master keys to encrypt files, and an EFS-managed key to encrypt filesystem
    metadata, such as file and directory names.


    # Data in Transit


    Encrypting data in transit is enabled through the use of a Transport Layer Security
    (TLS) certificate. You can use the Amazon Certificate Manager (ACM) to generate
    a TLS certificate and install it on an Application Load Balancer or a CloudFront
    distribution. Refer to Exercise 8.4 in Chapter 8, "The Domain Name System and
    Network Routing: Amazon Route 53 and Amazon CloudFront," for instructions on creating
    a TLS encryption certificate and installing it on a CloudFront distribution.


    Keep in mind that you cannot export the private key for a TLS certificate generated
    by ACM. This means you can''t install the certificate directly on an EC2 instance
    or on-premise server. You can, however, import an existing TLS certificate and
    key into ACM. The certificate must be valid and not expired when you import it.
    To use an imported certificate with CloudFront, you must import it into the us-east-1
    region.


    # Summary


    Effective security controls necessarily add more complexity to your deployment
    and will occasionally cause things to break. By implementing security at every
    level, you will resolve the issues as you go. By the time you''re done, you''ll
    be starting with an effective security posture. From that point on, it will be
    much easier to mitigate vulnerabilities and threats as they trickle'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Exam Essentials 271


    It’s fine to be a little lax when initially configuring a service to make sure
    everything works as expected, but as soon as you do, be sure to implement your
    security controls. Follow the principle of least privilege, using IAM and resource-based
    policies and network controls. Configure logging early to make troubleshooting
    easier. Set encryption prior to going live so that data is never sent or stored
    in the clear. Implement notifications for every event you know immediately when
    a misconfiguration, attack, or error occurs. Finally, automate as much as possible
    using Auto Scaling, CloudFormation, and preconfigured AMIs. Automation allows
    you to recover more quickly from an incident. It also reduces human intervention,
    minimizing the chances of mistakes.


    # Exam Essentials


    Be able to configure permissions policies. Permissions policies are the foundation
    of identity and resource-based policies. Understand the difference between these
    policies and be able to understand and create them. Identity-based policies are
    attached to an IAM principal such as a user or role. Resource-based policies apply
    to a resource and dont include the "principal" element.


    Know how permissions boundaries interact with permissions policies. Permissions
    boundaries define the maximum permissions an IAM principal can have. You set boundaries
    on a per-identity by attaching a managed policy that defines them.


    Understand roles and trust policies. A role is a set of permissions that an IAM
    user, AWS service, or federated user can acquire by assuming that role. Trust
    policies are resource-based policies that define who can assume the role and under
    what conditions.


    Know your options for collecting, searching, and analyzing logs. CloudWatch Logs
    consolidate logs from multiple sources, including CloudTrail, VPC logs, DNS query
    logs, and logs generated by your application. You can search logs from CloudWatch
    Logs using filter patterns. For logs stored in S3, you can use Athena to search
    them using SQL queries.


    Be able to identify use cases for GuardDuty, Inspector, and WAF. GuardDuty analyzes
    various logs looking for signs of an attack. Inspector uses an agent to inspect
    your EC2 instances for vulnerabilities. Shield identifies and blocks well-known
    network-based attacks as they occur. WAF allows you to configure custom rules
    to block suspicious or undesirable traffic.


    Understand how KMS works. Know how to create customer master keys and set key
    policies. A key policy defines the key users—IAM principals who can use a key
    to encrypt and decrypt data. A key policy also defines the administrators of a
    key—those who can enable and disable it. Key administrators can also modify the
    key policy.'
  merge: -1
  img_proc: true
