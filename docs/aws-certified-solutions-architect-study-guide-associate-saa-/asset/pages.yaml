    # Stack Updates


    If you need to reconfigure a resource in a stack, the best way is to modify the
    resource configuration in the source template and then perform a direct update
    or create a change set.


    # Direct Update


    To perform a direct update, upload the updated template. CloudFormation will ask
    you to enter any parameters of the template. CloudFormation will deploy the changes
    immediately, modifying only the resources that changed in the template.


    # Change Set


    If you want to understand exactly what changes CloudFormation will make, create
    a change set. Submit the updated template, and once you create the change set,
    CloudFormation will display a list of every resource it will add, remove, or modify.
    You can choose to execute the change set to make the changes immediately, delete
    the change set, or do nothing. You can create multiple change sets using different
    templates, compare them, and then choose which one to execute. This is useful
    if you want to compare multiple configurations without having to create a new
    stack each time.


    > You can also use change sets to create new stacks.


    # Update Behavior


    How CloudFormation updates a resource depends on the update behavior of the resource''s
    property that you are updating. Update behaviors can be one of the following:


    **Update with No Interruption** The resource is updated with no interruption and
    without changing its physical ID. For example, changing the IAM instance profile
    attached to an EC2 instance doesn''t require an interruption to the instance.


    **Update with Some Interruption** The resource encounters a momentary interruption
    but retains its physical ID. This happens when, for example, you change the instance
    type for an EBS-backed EC2 instance.


    **Replacement** CloudFormation creates a new resource with a new physical ID.
    It then points dependent resources to the new resource and deletes the original
    resource. For example, if you change the availability zone for an instance defined
    in a template, CloudFormation will create a new instance in the availability zone
    defined in the updated template and then delete the original instance.'
  merge: -1
  img_proc: true
- pgno: 330
  md: "# Preventing Updates to Specific Resources\n\nTo prevent specific resources\
    \ in a stack from being modified by a stack update, you can create a stack policy\
    \ when you create the stack. If you want to modify a stack policy or apply one\
    \ to an existing stack, you can do so using the AWS CLI. You can't remove a stack\
    \ policy.\n\nA stack policy follows the same format as other resource policies\
    \ and consists of the same Effect, Action, Principal, Resource, and Condition\
    \ elements. The Effect functions the same as in other resource policies, but the\
    \ Action, Principal, Resource, and Condition elements differ as follows:\n\nAction\
    \ The action must be one of the following:\n\n+   * Update:Modify Allows updates\
    \ to the specific resource only if the update will modify and not replace or delete\
    \ the resource\n\n+   * Update:Replace Allows updates to the specific resource\
    \ only if the update will replace the resource\n\n+   * Update:Delete Allows updates\
    \ to the specific resource only if the update will delete the resource\n\n+  \
    \ * Update:* Allows all update actions\n\nPrincipal The principal must always\
    \ be the wildcard (*). You can't specify any other principal.\n\nResource This\
    \ specifies the logical ID of the resource to which the policy applies. You must\
    \ prefix this with the text LogicalResourceId.\n\nCondition This specifies the\
    \ resource types, such as AWS::EC2::VPC. You can use wildcards to specify multiple\
    \ resource types within a service, such as AWS::EC2::* to match all EC2 resources.\
    \ If you use a wildcard, you must use the StringLike condition. Otherwise, you\
    \ can use the StringEquals condition.\n\nThe following stack policy document allows\
    \ all stack updates except for those that replace the PublicVPC resource. Such\
    \ an update would include changing the VPC CIDR.\n\n```\n{\n  \"Statement\" :\
    \ [\n    {\n      \"Effect\" : \"Allow\",\n      \"Action\" : \"Update:*\",\n\
    \      \"Principal\" : \"*\",\n      \"Resource\" : \"*\"\n    }\n  ]\n}\n```"
  merge: -1
  img_proc: true
