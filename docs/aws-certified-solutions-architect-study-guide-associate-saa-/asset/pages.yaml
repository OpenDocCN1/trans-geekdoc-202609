  md: '# Introduction xxvii


    Chapter 2: Amazon Elastic Compute Cloud and Amazon Elastic Block Store This chapter
    covers EC2 instances—the virtual machines that you can use for Linux and Windows
    workloads on AWS. It also covers the Elastic Block Store service that EC2 instances
    depend on persistent data storage.


    Chapter 3: Amazon Simple Storage Service and Amazon Glacier Storage In this chapter,
    you''ll learn about Simple Storage Service (S3) and Glacier, which provide unlimited
    storage and retrieval for AWS services, your applications, and the Internet.


    Chapter 4: Amazon Virtual Private Cloud This chapter explains Amazon Virtual Private
    Cloud (Amazon VPC), a virtual network that contains network resources for AWS
    services.


    Chapter 5: Databases In this chapter you''ll learn about some managed data services
    offered by AWS, including Relational Database Service (RDS), DynamoDB, and Redshift.


    Chapter 6: AWS Identity and Access Management This chapter covers AWS Identity
    and Access Management (IAM), which provides the primary means for protecting the
    AWS resources in your account.


    Chapter 7: CloudTrail, CloudWatch, and AWS Config In this chapter, you''ll learn
    how to monitor, and audit your AWS resources.


    Chapter 8: The Domain Name System and Network Routing: Amazon Route 53 and Amazon
    CloudFront This chapter focuses on the domain name system (DNS) and Route 53,
    the service that provides public and private DNS hosting for internal AWS resources
    and the Internet. It covers CloudFront, Amazon''s global content delivery network.


    Chapter 9: The Reliability Pillar This chapter will show you how to architect
    and integrate AWS services to achieve a high level of reliability for your applications.
    You''ll learn how to plan around and recover from inevitable outages to keep your
    systems up and running.


    Chapter 10: The Performance Efficiency Pillar This chapter covers how to build
    highly performing systems and use the AWS elastic infrastructure to rapidly up
    and to meet peak demand.


    Chapter 11: The Security Pillar In this chapter you''ll learn how to use encryption
    and security controls to protect the confidentiality, integrity, and availability
    of your data and systems on AWS. You''ll also learn about the various security
    services such as GuardDuty, Inspector, Shield, and Web Application Firewall.


    Chapter 12: The Cost Optimization Pillar This chapter will show you how to estimate
    and control your costs in the cloud.


    Chapter 13: The Operational Excellence Pillar In this chapter, you''ll learn how
    to keep your systems running smoothly on AWS. You''ll learn how to implement a
    DevOps mind-set using CloudFormation, Systems Manager, and the AWS Developer Tools.'
