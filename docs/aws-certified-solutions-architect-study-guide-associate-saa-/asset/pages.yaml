    recover and resume processing after a failure, the recovery point objective (RPO)
    is the maximum period of acceptable data loss. Consider your own RTO and RPO requirements
    when choosing your RDS options.


    When you restore from a snapshot, RDS restores it to a new instance. The time
    to restore a snapshot can take several minutes, depending on its size. The more
    provisioned IOPS you allocate to your new instance, the faster the recovery time.


    # Automated Snapshots


    RDS automatically creates snapshots of your instances daily during a 30-minute
    backup window. You can control this window or let RDS choose it for you. Because
    taking a snapshot impacts performance, choose a time when your database is least
    busy. Let RDS randomly select a 30-minute window within an 8-hour block that varies
    by region.


    Enabling automated enables point-in-time recovery, which archives database changes
    to S3 every 5 minutes. In the event of a failure, you will lose up to five minutes''
    worth of data. Restoring to a point-in-time can take hours, depending on how much
    data is in the transaction log.


    RDS keeps automated snapshots for a limited period of time and deletes them. You
    can choose a retention period between 1 day and 35 days. The default is 7 days.
