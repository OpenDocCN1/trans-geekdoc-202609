- pgno: 260
  md: '# Optimizing Performance for the Core AWS Services


    A load balancer within EC2 automates most of the process for you. Because the
    service is scalable, you don''t need to worry about unexpected and violent traffic
    patterns, and you can deploy complex relationships that leverage the unique features
    of your particular application infrastructure.


    Originally, a single EC2 load balancer type would handle HTTP, HTTPS, TCP TCP.
    While Classic Load Balancer is still available, it has been deprecated. Besides
    the Classic, Elastic Load Balancing service offers two separate load balancers:
    the Application Load Balancer for HTTP and HTTPS and the Network Load Balancer
    for TCP traffic. The new load balancer types come with a number of functions unavailable
    to the Classic version, including the ability to register targets outside the
    VPC and for containerized applications.


    The Application Load Balancer operates at the application layer (7 of the Open
    System Interconnection model). Layer 7 protocols permit host and path-based routing,
    which means you can use this load balancer to route traffic among multiple services
    of microservice or tiered architectures.


    The Network Load Balancer functions at lower layer (TCP). Network load balancers
    are built to manage high volumes and traffic spikes and are tightly integrated
    with auto scaling, the Elastic Cloud Service and CloudFormation. TCP balancers
    should also be used for applications that don''t use HTTP or HTTPS for their internal
    communications and for AWS managed Private Network (VPN) connections.


    Try it yourself: Exercise 10.4 will guide you through configuring and deploying
