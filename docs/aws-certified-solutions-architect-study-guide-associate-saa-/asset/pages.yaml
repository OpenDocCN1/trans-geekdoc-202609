  md: '# Auditing Resource Configurations with AWS Config


    In monitoring events, your overall security strategy should include monitoring
    the configuration of your AWS resources. AWS Config can alert you when a resource
    configuration in your AWS account changes. It can also compare your resource configurations
    against a baseline and alert you when the configuration deviates from it, which
    is useful for validating that you''re in compliance with organizational and regulatory
    requirements.


    To compare your resource configurations against a desired baseline, you can implement
    AWS Config rules. In a busy AWS environment where configuration changes are occurring
    frequently, it''s important to determine which changes require further investigation.
    AWS Config Rules define you which configuration states are abnormal or suspicious
    so that you can focus on analyzing and, if necessary, remediating them. AWS offers
    a variety of managed rules to cover such scenarios. For example, the ec2-volume-inuse-check
    rule looks for EBS volumes that aren''t attached to any instance. With this rule,
    if you create an EBS volume and do not attach it to any instance, AWS Config will
    report the volume as noncompliant, as shown in Figure 11.3.


    # FIGURE 11.3 AWS Config showing an EBS volume as noncompliant


    ![](img/a3b306efdfb1d7ec7f50f28de1a65ccf_292_0.png)


    Note that the rule gives you the compliance status of the resource. Suppose an
    IT auditor needs to see which EBS instances were previously attached to what.
    Although you could derive this information from CloudTrail logs, it would be difficult
    and time-consuming. You would have to carefully sift through the CloudTrail logs,
    paying attention to every AttachVolume and DetachVolume operation. Imagine how
    much more cumbersome this process would be if you had to do that for hundreds
    of instances! Instead, you could use AWS Config to view the configuration timeline
    for the resource, as shown in Figure 11.4.'
