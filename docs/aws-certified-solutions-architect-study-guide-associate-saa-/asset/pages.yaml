- pgno: 208
  md: 'Simple will make it possible to associate your policy with a health check.
    A health check, which you create, configure, and name separately, will regularly
    test the resource that''s represented by your record set to confirm it''s healthy.

    If everything''s OK, Route 53 will continue routing traffic to it. But if a preset
    number of tests fail without an acceptable response, Route 53 will assume the
    resource is offline and will redirect traffic to a backup resource. Exercise 8.2
    illustrates how you can configure a health check that you can use with record
    sets.


