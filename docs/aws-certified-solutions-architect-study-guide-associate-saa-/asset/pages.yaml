- pgno: 241
  md: '# Chapter 9 • The Reliability Pillar


    For the database, you''ll use a multi-AZ RDS instance. If the primary database
    instance fails (perhaps because of an entire availability zone failure), RDS will
    failover to the secondary instance in a different zone. You''ll also configure
    database instance snapshots to guard against database corruption. Enabling automated
    snapshots also enables point-in-time recovery, reducing your RPO to as little
    as five minutes.


    # Availability Calculation


    Thanks to the resilience of the redundant, distributed architecture, expect only
    two unplanned outage events per year, 60 minutes each. Software and operating
    system updates occur 10 times a year and last 15 minutes each. Adding up the numbers,
    you get a total of 270 minutes or 4.5 hours per year. That''s 99.95% availability!
    Again, to be conservative, you want to round down to 99.9 percent.


    # Designing for 99.99% Percent Availability


    Mission-critical applications, those that generate a lot of revenue or have a
    significant impact on human life, must be able to tolerate multiple component
    failures without having to allocate additional resources.


    AWS gets pains to isolate zone failures. However, there''s always the possibility
    that multiple zones in a single region can fail simultaneously. To protect against
    these regional disruptions, you''ll simultaneously run application instances in
    two different regions, an active region and a passive region. Just as the preceding
    scenario, you''ll use Auto Scaling to provision the instances into multiple availability
    zones in each region and ensure that each can handle 50 percent of the peak load.

    The primary and secondary database instances must run in the same region. RDS
    doesn''t currently allow you to have a primary database instance in one region
    and secondary in another. Therefore, there''s no way to failover from one region
    to the other without the potential for data loss.


    But you have another option. If you use the MySQL or MariaDB database engine,
    you can create a multi-AZ read replica in a different region. You then asynchronously
    replicate data from one region to the other. With this option, there''s a delay
    between the time data is written to the primary and the time it''s replicated
    to the replica. Therefore, if the primary database instance fails before the replication
    has completed, you may lose data. For example, a replication lag of 10 minutes,
    you may lose 10 minutes of data.


    # Recovery Process


    As the preceding example, for an application or database instance failure isolated
    to the active region, or even for an entire availability zone failure, recovery
    is automatic. But regional failures require some manual intervention.


    +   - Users will access application instances only in the active region until
    region fails. You''ll create a CloudWatch Alarm to monitor the health of the ALB
    in the active region. If the ALB in the active region fails its health check,
    you must then decide whether failover to the passive region.'
