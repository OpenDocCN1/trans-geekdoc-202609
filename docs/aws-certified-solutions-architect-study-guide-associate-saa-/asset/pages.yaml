    # CloudWatch Logs


    CloudWatch Logs is a feature of CloudWatch that collects logs from AWS and non-AWS
    sources, stores them, and lets you search for and extract custom metrics from
    them. Some common uses for CloudWatch Logs include receiving CloudTrail logs,
    collecting application logs an instance, and logging Route 5 DNS queries.'
