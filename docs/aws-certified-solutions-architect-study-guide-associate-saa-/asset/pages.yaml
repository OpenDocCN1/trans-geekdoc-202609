    domains that will be associated with AWS infrastructure, using Route 53 for registration
    can in fact help simplify your operations.


    You can transfer registration of an existing domain from your current registrar
    by unlocking the domain transfer setting in the registrar''s admin interface and
    requesting an authorization code. You''ll supply that code to Route 53 when you''re
    ready to do the transfer. If you''d prefer to leave your domain with its current
    registrar, you can use Route 53 to manage your DNS configuration. Simply copy
    the name server addresses included in your Route 53 record set and paste them
    as the name server values for your registrar''s admin interface.


    # DNS Management


    However you registered your site name, until you find some way to connect your
    domain with the resources it''s supposed to represent, it doesn''t you lot of
    good. On Route 53, the way you create and configure a hosted zone determines what
    your users will be shown when they invoke your domain name in a browser, client,
    or programmatically.


    Within Route 53, rather than importing a preconfigured zone file (which is certainly
    an option), you''ll automatically configure your hosted zones directly via the
    console or Route 53 CLI.


    When you create a new hosted zone and enter your domain name, you''ll need to
    tell Route 53 whether you would like this to be publicly or privately hosted.
    If you want your resources to be accessible to external users (which is true of
