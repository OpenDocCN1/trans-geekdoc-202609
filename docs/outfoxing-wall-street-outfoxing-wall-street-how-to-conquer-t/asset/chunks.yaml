    it does have some drawbacks. For one, it is difficult to know when to buy and
    when to sell, and it can be tempting to hold onto a losing investment for too
    long in the hopes that it will eventually rebound. In this way, "buy and hold"
    becomes “buy and fold” - investors buy in and then fold, finding it impossible
    to hold on through a deep decline.


