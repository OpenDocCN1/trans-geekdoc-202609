    正如你刚刚学到的，趋势跟踪是一种识别并遵循特定资产或市场当前趋势的交易策略。遵循这一策略的交易者旨在通过在价格上涨时买入、价格下跌时卖出来获取利润。现实世界中有许多趋势跟踪的实际应用案例，历史上一些最成功的交易者已经使用这种策略获得了丰硕的利润。


    趋势跟踪的一个真实世界案例是 `Richard Dennis` 使用的交易策略。`Dennis` 是一位非常成功的交易者，他因名远亚洲地在短短 10 年内将
    `$1,600` 的投资变成了 `$200 亿`。他使用了一种趋势跟踪策略，该策略包括在`55-day new high`时买入，在`20-day new
    low`时卖出。


    `Dennis` 的策略在捕捉主要市场趋势期间的利润方面非常有效。通过在`55-day new high`时买入，他能够在资产或市场价格持续上涨时获取利润。通过在`20-day
    new low`时卖出，他能够在趋势最终反转时限制亏损。


    趋势跟踪的另一个真实世界案例是 `S&P 500`，它是美国股市表现的常用基准。作为该策略中使用的七行代码的一部分，如果今天的价格高于`80 trading
    days ago` 时的价格，则认为 `S&P 500` 处于上升趋势。如果今天的价格低于`80 trading days ago` 的 `S&P 500`
    价格，则它被认为处于下降趋势。


    ![](img/00010.jpeg)


    这种简单的趋势跟踪策略在捕捉主要市场趋势的利润方面可能非常有效。例如，如果 `S&P 500` 已经处于上升趋势很一段时间，遵循这一策略的交易者将继续持有仓位，并可能随着趋势的持续而获得巨额利润。


    然而，值得注意的是，趋势跟踪并不总是成功的。趋势可能会反转或进入震荡行情，这可能导致继续遵循趋势的交易者遭受亏损。这就是均值回归技术可以发挥用场的地方。


    均值回归是一种补充性的交易策略，涉及识别资产或市场何时过买或过卖，然后根据价格最终将回归其平均值的预期来进行交易。通过将均值回归技术与趋势跟踪相结合，交易者有可能最大化利润并实现长期成功。


    在下一章中，我们将更详细地讨论均值回归技术以及它们如何与趋势跟踪结合使用来实现利润最大化。通过理解和实施这些策略，交易者有望在市场中获得巨大的利润并长期成功。


    # 第 4 章：均值回归：趋势跟踪的补充


    ## 什么是均值回归及其工作原理


    均值回归是一种交易策略，涉及识别资产或市场何时过买或过卖，然后根据价格最终将回归其平均值的预期来进行交易。该策略假设资产价格会随着时间的推移向其平均价格移动，这意味着交易者可以通过低买高卖来获利。


    许多成功的交易者已经使用均值回归技术获得了丰硕的利润。例如，`Renaissance Technologies` 的创始人 `Jim Simons` 是历史上最成功的交易者之一，估计净值超过
    `$23 亿`。他的交易策略基于数学模型和均值回归技术的结合。


    另一个使用均值回归技术的成功交易者是 `Larry Hite`，他是对冲基金 `Mint Investment Management` 的联合创始人。`Hite`
    的交易策略基于趋势跟踪和均值回归技术的结合，这帮助他的基金实现了超过`30%` 的年收益率。


    均值回归背后的基本思想是价格倾向于围绕中心值波动，这个中心值被称为`mean`或平均价格。当资产价格偏离平均值太远时，就会被认为过买或过卖。均值回归交易者寻找这些机会，以便在回归平均值时获取利润。


    实施均值回归的方法有很多，但一种常用方法是使用技术指标来识别资产何时过买或过卖。例如，相对强度指数（`RSI`）是一种用于识别资产过买或过卖的常用技术指标。`RSI`
    的范围从 `0` 到 `100`，高于 `70` 的通常被认为过买，而低于 $30$ 则被认为过卖。


    遵循均值回归技术的交易者可能会利用 `RSI` 来寻找卖出买买资产或买卖卖的机会。例如，如果某只股票的 `RSI` 高于 `70`，交易者可能会预期价格将回归平均值而卖出。同样，如果股票的
    `RSI` 低于 `30`，交易者可能会预期价格将反弹而买入。


    另一种过时的均值回归方法是使用基本面分析来识别资产何时高估或低估。例如，交易者可能会查看公司的市盈率（`P/E ratio`）来判断其股票是否高估或低估。如果
    `P/E ratio` 高于其历史平均水平或行业平均 `P/E ratio`，则股票可能被认为高估，交易者可能会考虑卖出。


    总而言，均值回归是一种强大的交易策略，可用于广泛的市场捕捉利润。使用均值回归技术的交易者需要耐心和纪律，因为资产回归其平均值需要时间。然而，通过识别低买高卖的机会，交易者有望在市场中获得巨大的利润并长期成功。


    ## 该策略如何使用均值回归


    七行代码策略是一种结合了趋势跟踪和均值回归技术来识别买卖机会的交易策略。具体而言，该策略利用均值回归来识别资产价格何时过买或过卖，并可能回归其平均值。


    当 `S&P 500 ETF`（`SPY`）的价格低于 `80 trading days ago` 的价格时，该策略的均值回归部分会被触发。这表明价格在持续期间下跌并可能过卖，意味着现在是考虑买入
    `SPY` 的良好时机，然后迅速退出。


    一旦策略的均值回归部分被触发，当 `6` 日指数移动平均线（`EMA`）跌破 `5` 日简单移动平均线（`SMA`）时，策略将寻求买入 `SPY`。这一信号表明资产交易价格低于其近期价格并可能过卖，表明这可能是买入的良好时机。


    ![](img/00011.jpeg)


    大多数交易者认为这种交叉会给出卖出信号。然而，七行代码策略利用均值回归意识到，有时市场会过度反应并将价格推得过低，从而产生低买的机会。


