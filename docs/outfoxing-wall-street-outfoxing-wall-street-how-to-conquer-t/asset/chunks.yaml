    现货定价（Spot pricing）是金融领域的一个规则改变者。它让企业能够以极小的成本获得超级计算机的力量。金融界正处于一个激动的时期，我们迫不及待地看到未来。


    机器学习和超级计算机在交易中的作用改变了金融业。使用机器学习的对冲基金通过分析海量数据、识别模式并基于这些数据进行预测，获得了竞争优势。`Renaissance
    Technologies`、`Bridgewater Associates` 和 `Two Sigma Investments` 等对冲基金的成功证明了这些技术的威力。云计算和现货定价的兴起，使得像我这样规模较小的公司也能使用这些先进工具，这使该行业进入了一个令人兴奋的时代。


    # 理解七行代码的意义


    在交易策略方面，存在一个常见的误区，认为策略越复杂越有效。然而，事实是，表现最好且持续时间最长的策略往往是最简单的。这就是**奥卡姆剃刀**（`Occam''s
    Razor`）大显身手的地方。


    `奥卡姆剃刀`是一个哲学原则，指出：当对一个现象有多种解释时，最简单的解释通常是正确的。这一原则也适用于交易策略，其中最简单的策略往往是最有效的。


    其原因在于，简单的策略更容易理解，也更容易执行。这意味着交易者更有可能坚持策略，出错的概率也较低。简单策略也不容易对历史数据产生过拟合（overfit），这意味着它们在未来更有可能表现良好。


    简单交易策略的一个例子是趋势跟踪。这种策略涉及在资产上升趋势时买入，在下降趋势时卖出。这种策略只需几行代码即可实现，易于理解和执行。这里有一个使用七行代码策略顺应趋势的例子：


    ![](img/00007.jpeg)


    另一个简单交易策略的例子是均值回归策略。该策略涉及在资产低于平均价格时买入，在高于平均价格时卖出。这种策略同样只需要几行代码即可实现。


    ![](img/00008.jpeg)


    交易策略的关键不在于其复杂性，而在于其产生一致结果的能力。这就是回测（backtesting）的重要性所在。回测涉及在历史数据上对交易策略进行测试，看看其在过去的表现如何。这可以给交易者提供策略未来表现的参考。


    需要注意的是，简单的交易策略并不总是最好的策略。在某些情况下，可能需要更复杂的策略。例如，在高度波动的市场中，可能需要复杂的策略来考虑价格的快速变化。


    然而，在大多数情况下，表现最好且持续时间最长的策略是简单的。这与大多数交易者的想法背道而驰，因为他们通常认为策略必须复杂才能有效。这种误区可能导致交易者投入大量精和精力在最终表现不佳的策略上。


    理解七行代码的意义在交易世界非常重要。简单策略通常是表现最好、持续时间最长的策略，因为它们更容易理解、更容易执行，并且不容易对历史数据过拟合。`奥卡姆剃刀`是一个可以应用于交易策略的重要原则，即最简单的解释通常是正确的。


    # 第二章：交易 ETF：股票 vs  债券


    ## ETF 的优缺点


    `ETFs`（`交易所交易基金`）近年来已成为一种流行的投资工具，这是有缘故的。与共同基金相比，它们具有许多优势，包括更低的费用、更高的灵活性和更高的税务效率。然而，像任何投资一样，它们也有需要考虑的缺点。在本节中，我们将探讨
    `ETFs` 的优缺点。


    ### ETF 的优点


    1. **低费用**：`ETFs` 最大的优势之一是与共同基金相比费用较低。`ETFs` 通常是被动管理的，费用较低。例如，`Vanguard S&P 500
    ETF`（`VOO`）的费用率为 `0.03%`，而平均水平为 `0.64%`。

    2. **灵活性更高**：`ETFs` 在交易方面比共同基金更灵活。`ETFs` 可以像`stock` 一样全天候交易。这使得投资者更容易买卖并利用市场机会。

    3. **多元化**：`ETFs` 让投资者可以通过单笔投资获得多元化的证券组合。这有助于降低风险并提高长期回报。例如，`iShares Core MSCI
    EAFE ETF`（`IEFA`）提供了对广泛国际股票的敞口。

    4. **税务效率**：`ETFs` 通常比共同基金更具税务效率。这是因为 `ETFs` 的周转率较低，且结构允许实物赎回（in-kind redemptions）。这意味着
    `ETF` 可以通过转移底层证券而不是卖出它们来赎回份额。这有助于将资本利得税降至最低。


    近年来，`ETFs` 的人气飙升，投资者越来越多地将这些工具作为一种成本效益高、低维护的方式来获取广泛资产的敞口。这一趋势特别显著的一个领域是期货领域，在那里
    `ETFs` 正在日益取代传统的期货合约。


    `ETFs` 优于期货合约的主要优势之一是它们对个人投资者更容易获得。期货合约通常需要大量的预先投资，在某些情况下甚至需要一个 `7-figure` 的账户才能参与。这种高准入门槛长期以来一直是小型投资者的主要障碍，导致他们实际上被排除在期货市场之外。


    相比之下，`ETFs` 获得容易得多，最低投资要求低，且不需要专门的交易账户。这使得它们成为所有规模投资者的理想期货合约的替代方案，包括那些希望获得特定市场或资产类别敞口的账户规模较小的投资者。


