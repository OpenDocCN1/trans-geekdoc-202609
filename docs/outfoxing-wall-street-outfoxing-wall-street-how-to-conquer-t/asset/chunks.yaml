    ## 7) 如果放入 `v1` 的较小值大于“慢速”5 周期移动平均线，那么是时候“卖出”并进入 `TLT` 了。


    第 6 行是最令人困惑的，所以让我们解决这个问题。


    假设标普 500 指数正在像落石一样下跌，因此 `SPY` 80 个周期前的价格为 500。“快速”的 6 周期指数移动平均线值为 310。第 6 行中的最小数字现在将是“快速”的
    `EMA`。现在我们很有可能看到这两条平均线频繁交叉。


    ![](img/00015.jpeg)


    现在假设 `SPY` 处于爆发模式。`SPY` 80 个周期前的价格远低于 380，而 `SPY` 的当前价格为 400。“快速”的 `EMA` 将位于当前价格
    400 附近。这意味着 `SPY` 的价格将是第 6 行中的最低数字。结论是：在“快速” `EMA` 低于 `SPY` 的 80 天价格之前，无法产生卖出信号。那是趋势被认为结束、均值回归交易开始的时候。


