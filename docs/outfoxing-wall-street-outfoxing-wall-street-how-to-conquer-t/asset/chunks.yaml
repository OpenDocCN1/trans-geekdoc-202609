    ## 6) Now the exponential moving average is compared to the price of `SPY` 80
    days ago. Which is smaller? Place that value into `v1`


    ## 7) If the smaller value that was put into `v1` is greater than the “slow” 5-period
    moving average, then it’s time to “sell” and get into `TLT`.


    Line number 6 is the most confusing, so let’s address that.


    Let say that the S&P 500 has been falling like a rock, so the price of `SPY` 80-periods
    ago is 500. The value of the “fast” 6-period exponential moving average is 310.
    The smallest number in line 6 will now be the “fast” `EMA`. Now it’s very much
    possible that we’ll see the two averages cross each other quite often.


    ![](images/00015.jpeg)


    Now let’s say that `SPY` is in blastoff mode. The price of `SPY` 80-periods ago
    is way down at 380, and the current price of `SPY` is 400. The “fast“ `EMA` will
    be somewhere near the current price of 400. That means the price of `SPY` will
    be the lowest number in line 6. Bottom line: no sell signal can be generated until
    the “fast” `EMA` is below the 80-day price of `SPY`. That’s when the trend is
    considered over, and the mean reversion trades begin.


    But, let''s be real, following a plan can be boring. That''s why it''s important
