    ## Chapter 6: Trading Systems vs Chart Patterns


    ### Debunking the pseudoscience of chart patterns


    After decades in the trading world, I was frustrated with the hype surrounding
    chart patterns. It''s a well-known concept that traders use chart patterns to
    make trading decisions. But I always had a nagging feeling that the whole thing
    was just pseudoscience – because it never seemed like any two chartist came up
    with the same answers.


    That''s when I decided to put it to the test. I invested a significant amount
    of money in building a supercomputer network and brought together a team of experts
    to help me analyze every chart pattern in existence. I wanted to see if there
    was any real science behind the hype.


    We spent 18 months analyzing every chart pattern with our supercomputer. It was
    an exhaustive effort. We considered every possible variable, including the frequency
    of the pattern, the time frame it appeared in, and what exactly defines a “top”
    and “bottom.” We looked at billions of chart patterns to see if there was any
    predictive power in them.


    And what did we find? Well, it was disappointing. We found that chart patterns
    had no predictive power. None. There was no pattern that had a statistically significant
    ability to predict market movements.


    This was a bit of a shock for us. We had hoped to find something that would help
    traders make better decisions. But we had to face the truth: chart patterns are
    pseudoscience. They might look impressive, but they don''t actually predict anything.
    Chart patterns are mostly random. The human brain is a pattern recognition machine,
    and will see patterns in random things like clouds or vegetation. This is known
    as pareidolia.


    This discovery was a significant turning point for me. It helped me understand
    that in the world of trading, you need to base your decisions on data and analysis,
    not on guesswork or superstition.


    Of course, there are still those who swear by chart patterns. They say they''ve
    made money using them. Even a broken clock is wrong twice a day. But as for me
    and my team, we''ll stick with the data. We believe that the only way to succeed
    in trading is by relying on solid research and analysis.


    So, the next time someone tries to sell you on a chart pattern, just remember:
    it''s pseudoscience because it is not repeatable. You could lock 100 chart technicians
    in a room. When they come out, they’d have 100 different answers. Stick to the
    data, and you''ll be much better off in the long run.

