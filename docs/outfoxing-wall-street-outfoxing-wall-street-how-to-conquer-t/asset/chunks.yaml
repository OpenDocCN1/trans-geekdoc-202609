    2) 现在变量 `se0` 被赋值为该数字


    3) `V0` 等于 5 日简单平均线。这被认为是“慢”移动平均线


    4) `V2` 被赋值为平滑值为 3 的 6 日指数平均线值。这被认为是“快”移动平均线，尽管它的计算周期更长。这是指数平均线的反应更快。


