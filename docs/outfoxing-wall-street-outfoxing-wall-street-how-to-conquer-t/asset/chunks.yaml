    当 `6-day EMA` 穿过 `5-day SMA` 之上，策略卖出。这一信号表明资产的交易价格高于其近期价格，可能处于过度买状态，意味着可能是卖出的良好时机。当这种情况发生时，策略会卖出
    `SPY` 并买入长期美国国债 (`TLT`)。这是因为当 `S&P 500` 价格下跌时，`TLT` 的价格往往会上涨，使其成为对冲股市潜在下跌的良好对冲工具。


