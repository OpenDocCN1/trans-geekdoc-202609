    As a veteran trader, I can attest to the emotional roller coaster that comes with
    discretionary trading. I''ve experienced the high highs and low lows, and it''s
    not an easy journey. In fact, I blew out three trading accounts before I realized
    that a systematic approach was the key to success.


    With a systematic trading approach, you take the emotion out of trading. You don''t
    have to make decisions based on gut feelings or hunches. Instead, you have a set
    of rules that you follow consistently. This takes the guesswork out of trading
    and makes it much easier to stick to your plan.


    ### Benefits of Systematic Trading


    One of the biggest benefits of a systematic trading approach is that it helps
    you avoid emotional biases. When you''re trading based on emotions, you''re more
    likely to make decisions that aren''t in your best interest. Fear and greed can
    cloud your judgment and lead you to make impulsive decisions. With a systematic
    approach, you''re less likely to make these mistakes.


    Another benefit of a systematic trading approach is that it helps you manage risk.
    By having a set of rules that you follow consistently, you can limit your downside
    risk. You can set stop-loss orders that automatically trigger when a trade goes
    against you. This helps you avoid big losses and protects your trading account.


    A systematic trading approach also allows you to backtest your strategy. This
    means you can see how your strategy would have performed in the past. You can
    analyze historical data and see how your strategy would have done in different
    market conditions. This can help you refine your strategy and make it more effective.


    In addition to these benefits, a systematic trading approach can also help you
    avoid overtrading. When you''re trading based on emotions, you may be tempted
    to enter and exit trades more frequently than you should. This can lead to higher
    transaction costs and lower profits. With a systematic approach, you have a set
    of rules that tell you when to enter and exit trades, so you''re less likely to
    overtrade.


    Overall, a systematic trading approach can help you become a more disciplined
    and successful trader. It takes the emotion out of trading, helps you manage risk,
    and allows you to backtest your strategy. With a systematic approach, you can
    avoid the emotional roller coaster that comes with discretionary trading and achieve
    more consistent results.


    ### Why relying on intuition can be detrimental to investment success


    ![](images/00014.jpeg)


    Earl Nightingale, the famous American author and motivational speaker, once said
    that one of the keys to success is to look at what the majority is doing and simply
    do the opposite. This can be particularly applicable to investment success, where
    intuition and emotions can often lead to costly mistakes.


    For instance, many traders rely on intuition and gut feelings to make investment
    decisions. They may feel that a certain stock is going to go up, or that the market
    is going to crash, based on a hunch or a feeling. However, relying on intuition
    in this way can be detrimental to investment success.


    The reason for this is that our intuition and emotions are often influenced by
    biases and emotions, which can cloud our judgment and lead to irrational decision-making.
    For instance, we may be influenced by the latest news headlines or by the opinions
    of others, rather than relying on objective data and analysis.


    A great example of this is the use of moving averages in trading. Many traders
    will sell when a moving average crosses below another one, as they believe this
    signals a downtrend in the market. However, as we’ve already discussed, this can
    be a great time to buy into a mean reversion trade. This is an example of how
    intuition can fail.


    ### Chapter 7: Applying the Simple Strategy


    #### How to implement the strategy in practice


    Benjamin Franklin once said, "If you fail to plan, you are planning to fail."
    This quote is especially true in the world of trading, where having a plan can
    mean the difference between success and failure. The beauty of this strategy is
    that it takes the emotion out of trading. It''s exactly what you need to follow.


    Don''t let the fact that it''s only seven lines of code fool you. This strategy
    has been backtested and proven to work. To implement this strategy, you need to
    have a brokerage account set up for trading. That''s it. No need to spend a lot
    of money on expensive software or hire a team of experts. You can use free online
    software or excel to calculate the moving averages.


    The strategy is easy to follow. If the close in SPY is less than the close 80
    days ago, then stocks are in a downtrend and you should look for mean reversion
    trades. You buy `SPY` when the 6-day exponential moving average crosses below
    the 5-day simple moving, and you sell `SPY` and buy `TLT` when the exponential
    moving average crosses above the simple moving average. It''s that easy. You don''t
    have to think about what to do next or second-guess yourself. Just follow the
    plan.


    I’m over-simplifying just a bit here because I want you to grasp the main concepts.
    Now we’ll go over each line of code and what it means. Remember: The supercomputer
    wrote this strategy in C code. It’s a bit counter-intuitive because I told the
    A.I to create a strategy that’s very profitable in as few lines of code as possible.
    Occam’s Razor. So bear with me as I explain what each line of code means.


    ```

    // (Code block would go here based on the logic described)

    ```


    ![](images/00005.jpeg)


    1) This first line of code looks for the price of SPY 80 days ago.


    2) Now variable `se0` is assigned that number


    3) `V0` is equal to the 5-day simple moving. This is considered the “slow” moving
    average


    4) `V2` is assigned the value of the 6-period exponential moving average with
    a smoothing of 3. This is considered the “fast” moving average even though it’s
    calculated over a longer period. That’s because exponential averages react faster.


    5) `V1` is now assigned the value of the 6-period exponential moving average

