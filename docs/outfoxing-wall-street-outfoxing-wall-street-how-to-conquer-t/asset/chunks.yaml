    As you just learned, trend following is a trading strategy that involves identifying
    and following the current trend of a particular asset or market. Traders who follow
    this strategy aim to capture profits by buying when prices are increasing and
    selling when prices are decreasing. There are many real-world examples of trend
    following in action, and some of the most successful traders in history have used
    this strategy to achieve significant profits.


    One real-world example of trend following in action is the trading strategy used
    by `Richard Dennis`. `Dennis` was a highly successful trader who famously turned
    a `$1,600` investment into `$200 million` in just 10 years. He used a trend following
    strategy that involved buying on a `55-day new high` and selling on a `20-day
    new low`.


    `Dennis`s strategy was highly effective in capturing profits during major market
    trends. By buying on a `55-day new high`, he was able to capture profits as the
    price of the asset or market continued to increase. And by selling on a `20-day
    new low`, he was able to limit his losses when the trend eventually reversed.


    Another real-world example of trend following in action is the `S&P 500`, which
    is a popular benchmark for the performance of the US stock market. As part of
    the seven lines of code used in this strategy, the `S&P 500` is considered to
    be in an uptrend if today''s price is greater than `80 trading days ago`. If today
    is less than the price of the `S&P 500` `80 trading days ago`, then it is considered
    to be in a down trend.


    ![](images/00010.jpeg)


    This simple trend following strategy can be highly effective in capturing profits
    during major market trends. For example, if the `S&P 500` has been in an uptrend
    for an extended period of time, traders who follow this strategy would continue
    to hold their positions and potentially capture significant profits as the trend
    continues.


    However, it''s worth noting that trend following isn''t always successful. There
    are times when the trend may reverse or become range-bound, which can lead to
    losses for traders who continue to follow the trend. This is where mean reversion
    techniques can come into play.


    Mean reversion is a complementary trading strategy that involves identifying when
    an asset or market is overbought or oversold and then making trades based on the
    expectation that the price will eventually revert back to its mean. By combining
    mean reversion techniques with trend following, traders can potentially maximize
    their profits and achieve long-term success.


    In the next chapter, we''ll discuss mean reversion techniques in more detail and
    how they can be used in conjunction with trend following to maximize profits.
    By understanding and implementing these strategies, traders can potentially achieve
    significant profits and long-term success in the markets.


    # Chapter 4: Mean Reversion: A Complement to Trend Following


    ## What is mean reversion and how it works


    Mean reversion is a trading strategy that involves identifying when an asset or
    market is overbought or oversold and then making trades based on the expectation
    that the price will eventually revert back to its mean. This strategy assumes
    that the price of an asset will move back towards its average price over time,
    which means that traders can potentially profit by buying low and selling high.


    Many successful traders have used mean reversion techniques to achieve significant
    profits. For example, `Jim Simons`, the founder of `Renaissance Technologies`,
    is one of the most successful traders in history, with an estimated net worth
    of over `$23 billion`. His trading strategies are based on a combination of mathematical
    models and mean reversion techniques.


    Another successful trader who has used mean reversion techniques is `Larry Hite`,
    who co-founded the hedge fund `Mint Investment Management`. `Hite`''s trading
    strategies are based on a combination of trend following and mean reversion techniques,
    which have helped him achieve average annual returns of over `30%` for his funds.


    The basic idea behind mean reversion is that prices tend to fluctuate around a
    central value, which is known as the `mean` or `average price`. When the price
    of an asset moves too far away from this average price, it is considered to be
    overbought or oversold. Traders who follow mean reversion techniques look for
    these opportunities to buy or sell an asset in order to capture profits as the
    price reverts back to its mean.


    There are many different ways to implement mean reversion techniques, but one
    common approach is to use technical indicators to identify when an asset is overbought
    or oversold. For example, the `Relative Strength Index` (`RSI`) is a popular technical
    indicator that is used to identify when an asset is overbought or oversold. The
    `RSI` ranges from `0` to `100`, and a reading above `70` is generally considered
    to be overbought, while a reading below `30` is considered to be oversold.


    Traders who follow mean reversion techniques might use the `RSI` to identify opportunities
    to sell an asset that is overbought or buy an asset that is oversold. For example,
    if the `RSI` for a particular stock is above `70`, a trader might sell with the
    expectation that the price will eventually revert to its mean. Similarly, if the
    `RSI` for a stock is below `30`, a trader might buy with the expectation that
    the price will rebound.


    Another perhaps dated approach to mean reversion is to use fundamental analysis
    to identify when an asset is overvalued or undervalued. For example, a trader
    might look at a company''s `price-to-earnings ratio` (`P/E ratio`) to determine
    whether its stock is overvalued or undervalued. If the `P/E ratio` is higher than
    its historical average or the average `P/E ratio` for its industry, the stock
    might be considered overvalued and a trader might look to sell.


    Overall, mean reversion is a powerful trading strategy that can be used to capture
    profits in a wide range of markets. Traders who use mean reversion techniques
    need to be patient and disciplined, as it can take time for an asset to revert
    back to its mean. However, by identifying opportunities to buy low and sell high,
    traders can potentially achieve significant profits and long-term success in the
    markets.


    ## How this strategy uses mean reversion


    The seven lines of code strategy is a trading strategy that uses both trend following
    and mean reversion techniques to identify opportunities to buy and sell assets.
    Specifically, the strategy uses mean reversion to identify when the price of an
    asset is overbought or oversold and is likely to revert back to its mean.


    The mean reversion component of the strategy is triggered when the price of the
    `S&P 500 ETF` (`SPY`) is lower than it was `80 trading days ago`. This indicates
    that the price has fallen over a sustained period and may be oversold, meaning
    that it is a good time to consider buying `SPY`, and then getting out quickly.


    Once the mean reversion component of the strategy is triggered, the strategy looks
    to buy `SPY` when a `6-day exponential moving average` (`EMA`) crosses below the
    `5-day simple moving average` (`SMA`). This is a signal that the asset is trading
    at a discount to its recent price and may be oversold, indicating that it could
    be a good time to buy.


    ![](images/00011.jpeg)


    Most traders believe that a crossover like this would give a sell signal. However,
    the seven lines of code strategy uses mean reversion to recognize that sometimes
    the market can overreact and push prices too low, leading to an opportunity to
    buy low.

