  ## 第一章：简单交易策略的诞生


  ## 策略是如何产生的……


  作为一名拥有 26 年经验的资深交易员，我非常激动能分享我们创新交易策略背后的传奇故事。我的旅程始于一个梦想：创建一个能够持续优于市场的交易系统。但我知道我不能依靠直觉或猜测。我必须找到一种利用尖端技术和数据的方法，开发一种经得起时间考验的策略。


  那时，我开始探索机器学习和人工智能的潜力。我和我的团队相信，这项技术拥有改变我们交易方式的力量。然而，我们也知道要建立一个能够处理所需复杂数据分析的系统需要投入大量的时间、精力和资源。


  我们首先从各种来源收集海量数据，包括各种资产类别的价格数据和全球资金流数据。数据的庞大程度令人难以置信，我们知道我们需要一台强大的机器来分析这一切。因此，我投入了
  400 万美元在云端构建了一个超级计算机网络，它将机器学习从零开始自动设计交易策略。


  我们的编程团队已经在该项目上工作了五年多，并且仍在持续投入，开发使这一愿景变为现实所需的算法并设计架构。这段旅程是长期且充满挑战的，但我比任何时候都更期待这项技术的潜力。


  我们创建的这台机器昵称为“老大”（The Boss），它利用数据用 `C` 代码编写交易策略。这些策略基于简单却强大的数学公式。就像爱因斯坦的相对论方程：`E=
  MC²` 简单而强大。当以正确的方式结合在一起时，它们就能构建出终极盈利策略。这台机器在不断学习并适应市场。它监控策略的表现并根据需要进行调整。


  结果简直不可惊讶。该交易策略持续优于市场，在过去的 20 年里平均年收益达到 19%。在许多策略和基金经理甚至难以跟上市场平均水平的领域中，这是一项不可思议的成就。但让我们的`7
  行策略`真正独特之处在于它是它是如此简单。


  该策略只有七行计算机代码。它简单到任何人都可以遵循。我想创建一个易于理解、易于执行的策略。我相信每个人都应该享受到我们策略带来的处，而不仅仅是专业交易员。


  该策略不是基于直觉或猜测，而是基于硬性数据和数学模型。我为创造了一个基于严谨分析并能随时间不断学习和改进的系统而感到自豪。但最令我兴奋的是，这个策略对所有人来说都是触手可及的。


  作为一个资深交易员，我知道市场是多么不可预测。但我也知道技术变革金融业的潜力是巨大的。这种交易策略只是将金融数据与技术相结合时无限可能的开始。


  创建这一交易策略的历程是漫长、充满挑战且持续不断的。但结果是惊人的。机器学习与金融的结合产生了一种持续优于市场的策略。我看到这项技术变革整个行业的潜力感到非常激动，并为成为这场革命的一员感到自豪。我相信这只是一个开始，我很期待这项技术未来将带我们走向何方。


  ## 发现交易未公开的力量：机器学习和超级计算机如何彻底改变规则


  金融行业已通过交易中使用机器学习和超级计算机发生了转型。这些技术让对冲基金了处理海量数据、分析数据并以以前不可能的准确度进行预测的能力。结果，使用这些先进工具的对冲基金已经赚了数十亿美元，许多已家喻户晓。


  使用机器学习最著名的对冲基金之一是`Renaissance Technologies（文艺复科技），它由数学家`James Simons（詹姆斯·西蒙斯）创立。`Renaissance
  Technologies`利用各种机器学习技术分析金融数据并创建交易策略。该公司非常成功，在过去的 30 年里，扣除费用前的平均年收益率为 66%。`Renaissance
  Technologies''`的成功让`Simons`成为世界上最富有的人之一，估计净值达 250 亿美元。


  另一个使用机器学习的对冲基金是`Bridgewater Associates（桥水亚洲），它由`Ray Dalio（雷·达利欧）`创立。`Bridgewater
  Associates`使用一个名为“系统智能实验室”（Systematized Intelligence Lab）的工具，利用机器学习分析金融数据并创建交易策略。该公司非常成功，在过去的
  20 年里平均年收益率为 12%。`Dalio''`的成功让他成为世界上富有的人之一，估计净值达 200 亿美元。


  `Two Sigma Investments（双西投资）`是另一个使用机器学习的对冲基金。该公司由`David Siegel（大卫·西格尔）`和`John Overdeck（约翰·奥弗德）`创立，已成为全球最大的对冲基金之一。`Two
  Sigma Investments`结合机器学习和人类知识分析金融数据并创建交易策略。该公司非常成功，在过去的 20 年里平均年收益率为 30%。


  这些对冲基金的成功证明了机器学习和超级计算机在交易中的力量。这些技术赋予了对冲基金分析海量数据并创建持续优于市场策略的能力。在过去，设计超级计算机的成本高达数千万美元，使得除了最富有的对冲基金外，其他公司难以负担。然而，云计算的兴起使得较小公司能够以极小的成本访问超级计算机的力量。


  云计算使得公司能够以现货价格率租赁超级计算机，这种价格远低于常规费率。这使得即使是更小的公司也能与大公司竞争。短时间租赁超级计算机的能力意味着公司可以在最需要的时候使用这些先进工具的力量，而无需做出长期承诺。





  现货定价（Spot pricing）是金融领域的一个规则改变者。它让企业能够以极小的成本获得超级计算机的力量。金融界正处于一个激动的时期，我们迫不及待地看到未来。


  机器学习和超级计算机在交易中的作用改变了金融业。使用机器学习的对冲基金通过分析海量数据、识别模式并基于这些数据进行预测，获得了竞争优势。`Renaissance
  Technologies`、`Bridgewater Associates` 和 `Two Sigma Investments` 等对冲基金的成功证明了这些技术的威力。云计算和现货定价的兴起，使得像我这样规模较小的公司也能使用这些先进工具，这使该行业进入了一个令人兴奋的时代。


  ### 理解七行代码的意义


  在交易策略方面，存在一个常见的误区，认为策略越复杂越有效。然而，事实是，表现最好且持续时间最长的策略往往是最简单的。这就是**奥卡姆剃刀**（`Occam''s
  Razor`）大显身手的地方。


  `奥卡姆剃刀`是一个哲学原则，指出：当对一个现象有多种解释时，最简单的解释通常是正确的。这一原则也适用于交易策略，其中最简单的策略往往是最有效的。


  其原因在于，简单的策略更容易理解，也更容易执行。这意味着交易者更有可能坚持策略，出错的概率也较低。简单策略也不容易对历史数据产生过拟合（overfit），这意味着它们在未来更有可能表现良好。


  简单交易策略的一个例子是趋势跟踪。这种策略涉及在资产上升趋势时买入，在下降趋势时卖出。这种策略只需几行代码即可实现，易于理解和执行。这里有一个使用七行代码策略顺应趋势的例子：


  ![](img/00007.jpeg)


  另一个简单交易策略的例子是均值回归策略。该策略涉及在资产低于平均价格时买入，在高于平均价格时卖出。这种策略同样只需要几行代码即可实现。


  ![](img/00008.jpeg)


  交易策略的关键不在于其复杂性，而在于其产生一致结果的能力。这就是回测（backtesting）的重要性所在。回测涉及在历史数据上对交易策略进行测试，看看其在过去的表现如何。这可以给交易者提供策略未来表现的参考。


  需要注意的是，简单的交易策略并不总是最好的策略。在某些情况下，可能需要更复杂的策略。例如，在高度波动的市场中，可能需要复杂的策略来考虑价格的快速变化。


  然而，在大多数情况下，表现最好且持续时间最长的策略是简单的。这与大多数交易者的想法背道而驰，因为他们通常认为策略必须复杂才能有效。这种误区可能导致交易者投入大量精和精力在最终表现不佳的策略上。


  理解七行代码的意义在交易世界非常重要。简单策略通常是表现最好、持续时间最长的策略，因为它们更容易理解、更容易执行，并且不容易对历史数据过拟合。`奥卡姆剃刀`是一个可以应用于交易策略的重要原则，即最简单的解释通常是正确的。


  # 第二章：交易 ETF：股票 vs  债券


  ## ETF 的优缺点


  `ETFs`（`交易所交易基金`）近年来已成为一种流行的投资工具，这是有缘故的。与共同基金相比，它们具有许多优势，包括更低的费用、更高的灵活性和更高的税务效率。然而，像任何投资一样，它们也有需要考虑的缺点。在本节中，我们将探讨
  `ETFs` 的优缺点。


  ### ETF 的优点


  1. **低费用**：`ETFs` 最大的优势之一是与共同基金相比费用较低。`ETFs` 通常是被动管理的，费用较低。例如，`Vanguard S&P 500
  ETF`（`VOO`）的费用率为 `0.03%`，而平均水平为 `0.64%`。

  2. **灵活性更高**：`ETFs` 在交易方面比共同基金更灵活。`ETFs` 可以像`stock` 一样全天候交易。这使得投资者更容易买卖并利用市场机会。

  3. **多元化**：`ETFs` 让投资者可以通过单笔投资获得多元化的证券组合。这有助于降低风险并提高长期回报。例如，`iShares Core MSCI EAFE
  ETF`（`IEFA`）提供了对广泛国际股票的敞口。

  4. **税务效率**：`ETFs` 通常比共同基金更具税务效率。这是因为 `ETFs` 的周转率较低，且结构允许实物赎回（in-kind redemptions）。这意味着
  `ETF` 可以通过转移底层证券而不是卖出它们来赎回份额。这有助于将资本利得税降至最低。


  近年来，`ETFs` 的人气飙升，投资者越来越多地将这些工具作为一种成本效益高、低维护的方式来获取广泛资产的敞口。这一趋势特别显著的一个领域是期货领域，在那里
  `ETFs` 正在日益取代传统的期货合约。


  `ETFs` 优于期货合约的主要优势之一是它们对个人投资者更容易获得。期货合约通常需要大量的预先投资，在某些情况下甚至需要一个 `7-figure` 的账户才能参与。这种高准入门槛长期以来一直是小型投资者的主要障碍，导致他们实际上被排除在期货市场之外。


  相比之下，`ETFs` 获得容易得多，最低投资要求低，且不需要专门的交易账户。这使得它们成为所有规模投资者的理想期货合约的替代方案，包括那些希望获得特定市场或资产类别敞口的账户规模较小的投资者。





  总的来说，ETF 的日益普及使得个人投资者能够参与比以往任何时候都要广泛的市场资产类别，而不需要巨额的交易账户或专业知识。因此，对于希望实现投资组合多元化并获得不同市场和资产类别风险敞口的投资者来说，ETF
  已成为一个日益具有吸引力的选择。


  ## 交易 ETF 的缺点


  1. **交易成本**：虽然 ETF 的费用低于共同基金，但它们确实存在与买卖份额相关的交易成本。这些成本可能会累积，特别是对于频繁交易的投资者而言，尤是如此。在评估
  ETF 的总费用时，考虑这些成本是重要的。

  2. **跟踪误差**：ETF 设计用于跟踪指数或特定基准。然而，由于费用、股息和其他成本等因素，可能会产生跟踪误差。这会导致 ETF 的收益偏离其旨在跟踪的基准。

  3. **市场波动性**：与任何投资一样，ETF 也受到市场波动的影响。在市场动期间，ETF 的价值可能会大幅下降。例如，`SPDR S&P 500 ETF`
  (`SPY`) 在 2020 年 3 月的市场低迷期间价值大幅下跌。

  4. **缺乏主动管理**：虽然低费用是 ETF 的优势，但它们也缺乏共同基金提供的主动管理（也许这应该被归入“优势”类别中）。这意味着投资者负责自己做出投资决策并监控其投资表现。对于某些偏好专业化管理的投资者来说，这可能是一个缺点。

  5. **欧洲法律**：最近，美国许多 ETF 对于欧盟公民来说并不易于交易。在某些地区，你必须是合格投资者，这看起来似乎很愚蠢。我们的许多欧洲客户只需将他们的收入证明进行公证并提交给经纪人即可。


  ## 结论


  与传统的共同基金相比，ETF 具有许多优势，包括更低的费用、更高的灵活性、多元化和税收效率。ETF 还作为期货市场的替代方案。然而，它们也有一些需要考虑的缺点，例如交易成本、跟踪误差、市场波动性和缺乏主动管理。最终，投资者在决定是否投资
  ETF 或其他投资工具之前，评估自己的投资目标和风险承受能力至关重要。通过权衡交易 ETF 的优缺点，投资者可以做出明智的决策并构建最适合他们需求的投资组合。


  ### 为什么在该策略中选择股票和债券 ETF


  该策略之所以选择股票和债券 ETF，主要原因在于股票和债券之间的反相关性。这种现象从 20 世纪 80 年代就被观察到，至今如此。当一个市场上涨时，另一个市场通常会下跌。这意味着投资者通过同时投资股票和债券可以在牛市和熊市中盈利。以下是
  `S&P 500` (`SPY`) 和长期债券 (`TLT`) 日收益率之间的相关性图。线的负斜率意味着它们通常向相反的方向移动：


  ![](img/00009.jpeg)


  图表来源：https://rpubs.com/GMR_NYC/921400


  例如，在经济不确定的时期，投资者往往涌入债券市场作为避险投资。这导致债券市场上涨，而股市市场可能下跌。相反，在经济增长时期，投资者倾向于撤出债券并更多地投资股票。这导致股市市场上涨，而债券市场可能下跌。


  通过 ETF 同时投资股票和债券，投资者可以利用这些反相关性，潜在地减少整体风险并增加潜在收益。这是这种方法所用策略的基础。


  ### 股票和债券 ETF 的益处


  除了股票和债券之间的反相关性外，投资 ETF 还有许多其他益处。核心益处之一是可以交易单一 ETF，以提供对广泛股票或债券的敞口。例如，`SPDR S&P 500
  ETF` (`SPY`) 跟踪 `S&P 500` 的表现，这是一个包含 500 只大盘股的广泛基准。这为投资者提供了在单次投资中获得多样化股票配置的机会。


  同样，`iShares 20+ Year Treasury Bond ETF` (`TLT`) 提供广泛长期美国国债的敞口。这可以帮助投资者实现投资组合多元化并可能降低风险。


  投资 ETF 的另一个益处是与主动管理的共同基金相比，费用更低。ETF 通常是被动管理的，这意味着它们跟踪特定的指数或基准。这导致了更低的费用，有助于增加投资者长期的潜在收益。


  最后，ETF 是高流动性投资品，这意味着它们可以在交易所全天候进行买卖。这为投资者提供了更大的灵活性，以及能够快速利用市场机会的能力。


  ## 结论


  在该策略中使用股票和债券 ETF 是基于这两个市场之间的反相关性。通过在股票和债券之间切换，投资者可以潜在地减少其整体风险并增加潜在收益。此外，ETF 还提供了许多其他益处，如低费用、多元化流动性。当结合稳健的投资策略使用时，股票和债券
  ETF 对于新手和资深投资者来说都是明智的投资选择。因此，请考虑用代码 "SPY" 代表 `S&P 500`，用 "TLT" 代表长期美国国债，从今天开始利用
  ETF 投资的优势吧。


  ### 多元化的作用


  多元化是投资和交易中的核心概念，指的是将投资分散到不同的资产中以降低风险。多元化的基本思想是，通过投资多种资产，你可以最大限度地减少单项投资对你的投资组合的影响。这意味着如果某项资产或市场表现不佳，你仍然拥有其他表现良好的投资，有助于平衡你的整体收益。


  在交易世界，多元化尤为重要，因为任何单笔交易或投资都可能带来高水平的风险。未能对投资组合进行多元化的交易者可能面临高风险，特别是当他们重注于单一市场或证券时。这可能导致巨大的损失并对其整体投资组合造成重大打击。


  ### 多元化的益处


  多元化的核心益处之一是它可以帮助降低投资组合的风险。通过投资多种不同的资产，你本质上是将风险分散在不同的市场和行业中。这意味着如果某项资产或市场遭遇低迷，你的整体投资组合受到影响可能会较小。这有助于随着时间的推移平滑收益，并可能减少投资组合的波动性。


  多元化的另一个益处是它可以提供获得更高回报的机会。通过投资多种不同的资产，你不限于单一市场或证券的表现。这意味着你可以潜在地从多个市场的强劲表现中受益，同时保护你的投资组合免受重大损失。




  例如，一个仅投资于科技股的交易者在科技板块出现低迷时，可能会面临巨大的风险。然而，一个通过投资多种资产（如黄金、债券和大宗商品）来实现投资组合多元化的交易者，可能在降低整体风险敞口的同时，获得更高的回报。


  ## 多元化策略


  交易者可以使用多种不同的策略来实现投资组合的多样化。一种通的策略是投资股票、债券和现金的组合。这种方法有助于将风险分散到不同的资产类别中，对于寻求更稳定、长期投资的交易者来说可能特别有利。


  另一种策略是投资于多个市场，例如国际股票和债券。这有助于将风险分散到不同的国家和地区，对于希望从新兴市场的增长机会中获利的交易者来说可能特别有利。


  一些交易者还可能通过投资替代资产（如房地产、大宗商品或加密货币）来实现投资组合的多样化。这类资产可以提供独特的优势和多元化机会，但也可能面临更大的波动性和风险。


  我喜欢的做法是在广泛的市场中建立策略，并同时交易所有的策略。这就是获得超平滑回报的秘诀。当一个策略走势时，其他策略会反向运行。


  ## 多元化的挑战


  虽然多元化通常被认为是成功交易的关键方面，但交易者在尝试实现投资组合多元化时可能会面临一些挑战。其中一个挑战是潜在的投资重叠。例如，如果交易者投资了多只科技股，当科技板块出现低迷时，他们可能仍然面临巨大的风险。


  更糟糕的是，在熊市期间当股票普遍下跌时，几乎所有股票都倾向于相互相关。这意味着股票之间的多元化几乎毫无意义，因为即使是表现良好的股票也可能因为整体市场状况而遭受重大损失。


  在这样的情况下，拥有包含不同资产类型（如债券、大宗商品或房地产、加密货币等替代投资）的多元化投资组合的投资者，可能表现得更好。这是因为不同的资产类别与股市的相关性水平不同，而某些资产实际上可能从股市的低迷中获益。


  然而，需要注意的是，多元化从长期来看仍然非常重要。相关性可能会随着时间而变化，多元化的投资组合可以帮助最小化风险并实现更好的长期回报。此外，并非所有的熊市都是等等的，某些股票在低迷期间可能仍然表现得相对良好。


  此外，值得注意的是，股票之间的相关性并不总是很高。在市市或低波动时期，股票的相关性可能没有在熊市期间那么大。在这样的市场条件下，多元化仍然是一个实用的策略。


  另一个挑战是潜在的过度多元化。虽然多元化有助于降低风险，但投资过多的资产或市场也会降低获得高回报的潜力。这是因为如果投资组合被分散得太薄，多元化的收益可能会被稀释。


  多元化是成功交易的关键组成。通过将风险分散到不同的资产和市场，交易者可能会减少他们的整体风险敞口并从更高的回报中获益。然而，多元化也具有挑战性，交易者必须仔细考虑他们的投资目标和策略，以实现风险与回报的平衡。通过理解多元化的作用并制定稳健的多元化策略，交易者可以建立更有韧性的投资组合。


  ## 第三章：趋势跟踪的力量


  ### 什么是趋势跟踪及其原理


  趋势跟踪是一种流行的交易策略，涉及分析资产和市场的当前趋势，并尝试尽可能跟随该趋势。趋势跟踪的核心是一个非常简单的概念：已经上涨的往往会继续上涨。下跌的往往会持续下跌。确定趋势可能涉及多种技术指标，包括移动平均线和动量指标。


  趋势跟踪的一个关键益处是它可以帮助交易者在主要市场趋势中捕捉巨额利润。例如，在 20 世纪 90 年代末和 21 世纪初，能够识别并跟踪科技股趋势的交易者，在板块飙升时捕捉了巨额利润。同样，在
  21 世纪 10 年代后期识别并跟踪加密货币趋势的交易者也能捕捉巨额利润。


  有几位著名的趋势跟踪巨星利用该策略取得了巨大的成功。一个例子是 Michael Marcus，他在十年内将一个 3 万美元的交易账户变成了 8000 万美元。另一个例子是
  Ed Seykota，他曾多年实现超过 50%的年收益。另一位著名的趋势跟踪交易者是 Richard Dennis，他著名地在 20 世纪 80 年代训练了一群被称为“乌龟”的新手交易者。这些交易者利用趋势跟踪策略取得了巨大的成功，据报道有些人的年化收益超过了
  100%。我曾受过原始“乌龟”的指导，并在转向机器学习之前学到了很多。尽管趋势跟踪取得了许多成功，但仍然受到一些分析师和新闻媒体的批评和忽视。每隔几年，新闻似乎就会声称趋势跟踪已经“死亡”或不再具有意义。然而，历史证明，趋势跟踪从长期来看是一个非常成功且获利的策略。事实上，我在我的书《放松的投资者》（*The
  Relaxed Investor*）中证明了趋势跟踪的力量，书中分析了追溯到 1926 年的动量轮动策略的表现。这一分析证明，与趋势跟踪密切相关的动量策略在长期内持续优于大盘。


  动量策略的基本思想是，在过去表现良好的资产在不久的将来可能继续表现良好。通过识别并投资这些资产，交易者可能会在趋势持续时捕捉到巨额利润。






  正如你刚刚学到的，趋势跟踪是一种识别并遵循特定资产或市场当前趋势的交易策略。遵循这一策略的交易者旨在通过在价格上涨时买入、价格下跌时卖出来获取利润。现实世界中有许多趋势跟踪的实际应用案例，历史上一些最成功的交易者已经使用这种策略获得了丰硕的利润。


  趋势跟踪的一个真实世界案例是 `Richard Dennis` 使用的交易策略。`Dennis` 是一位非常成功的交易者，他因名远亚洲地在短短 10 年内将 `$1,600`
  的投资变成了 `$200 亿`。他使用了一种趋势跟踪策略，该策略包括在`55-day new high`时买入，在`20-day new low`时卖出。


  `Dennis` 的策略在捕捉主要市场趋势期间的利润方面非常有效。通过在`55-day new high`时买入，他能够在资产或市场价格持续上涨时获取利润。通过在`20-day
  new low`时卖出，他能够在趋势最终反转时限制亏损。


  趋势跟踪的另一个真实世界案例是 `S&P 500`，它是美国股市表现的常用基准。作为该策略中使用的七行代码的一部分，如果今天的价格高于`80 trading days
  ago` 时的价格，则认为 `S&P 500` 处于上升趋势。如果今天的价格低于`80 trading days ago` 的 `S&P 500` 价格，则它被认为处于下降趋势。


  ![](img/00010.jpeg)


  这种简单的趋势跟踪策略在捕捉主要市场趋势的利润方面可能非常有效。例如，如果 `S&P 500` 已经处于上升趋势很一段时间，遵循这一策略的交易者将继续持有仓位，并可能随着趋势的持续而获得巨额利润。


  然而，值得注意的是，趋势跟踪并不总是成功的。趋势可能会反转或进入震荡行情，这可能导致继续遵循趋势的交易者遭受亏损。这就是均值回归技术可以发挥用场的地方。


  均值回归是一种补充性的交易策略，涉及识别资产或市场何时过买或过卖，然后根据价格最终将回归其平均值的预期来进行交易。通过将均值回归技术与趋势跟踪相结合，交易者有可能最大化利润并实现长期成功。


  在下一章中，我们将更详细地讨论均值回归技术以及它们如何与趋势跟踪结合使用来实现利润最大化。通过理解和实施这些策略，交易者有望在市场中获得巨大的利润并长期成功。


  # 第 4 章：均值回归：趋势跟踪的补充


  ## 什么是均值回归及其工作原理


  均值回归是一种交易策略，涉及识别资产或市场何时过买或过卖，然后根据价格最终将回归其平均值的预期来进行交易。该策略假设资产价格会随着时间的推移向其平均价格移动，这意味着交易者可以通过低买高卖来获利。


  许多成功的交易者已经使用均值回归技术获得了丰硕的利润。例如，`Renaissance Technologies` 的创始人 `Jim Simons` 是历史上最成功的交易者之一，估计净值超过
  `$23 亿`。他的交易策略基于数学模型和均值回归技术的结合。


  另一个使用均值回归技术的成功交易者是 `Larry Hite`，他是对冲基金 `Mint Investment Management` 的联合创始人。`Hite`
  的交易策略基于趋势跟踪和均值回归技术的结合，这帮助他的基金实现了超过`30%` 的年收益率。


  均值回归背后的基本思想是价格倾向于围绕中心值波动，这个中心值被称为`mean`或平均价格。当资产价格偏离平均值太远时，就会被认为过买或过卖。均值回归交易者寻找这些机会，以便在回归平均值时获取利润。


  实施均值回归的方法有很多，但一种常用方法是使用技术指标来识别资产何时过买或过卖。例如，相对强度指数（`RSI`）是一种用于识别资产过买或过卖的常用技术指标。`RSI`
  的范围从 `0` 到 `100`，高于 `70` 的通常被认为过买，而低于 $30$ 则被认为过卖。


  遵循均值回归技术的交易者可能会利用 `RSI` 来寻找卖出买买资产或买卖卖的机会。例如，如果某只股票的 `RSI` 高于 `70`，交易者可能会预期价格将回归平均值而卖出。同样，如果股票的
  `RSI` 低于 `30`，交易者可能会预期价格将反弹而买入。


  另一种过时的均值回归方法是使用基本面分析来识别资产何时高估或低估。例如，交易者可能会查看公司的市盈率（`P/E ratio`）来判断其股票是否高估或低估。如果
  `P/E ratio` 高于其历史平均水平或行业平均 `P/E ratio`，则股票可能被认为高估，交易者可能会考虑卖出。


  总而言，均值回归是一种强大的交易策略，可用于广泛的市场捕捉利润。使用均值回归技术的交易者需要耐心和纪律，因为资产回归其平均值需要时间。然而，通过识别低买高卖的机会，交易者有望在市场中获得巨大的利润并长期成功。


  ### 该策略如何使用均值回归


  七行代码策略是一种结合了趋势跟踪和均值回归技术来识别买卖机会的交易策略。具体而言，该策略利用均值回归来识别资产价格何时过买或过卖，并可能回归其平均值。


  当 `S&P 500 ETF`（`SPY`）的价格低于 `80 trading days ago` 的价格时，该策略的均值回归部分会被触发。这表明价格在持续期间下跌并可能过卖，意味着现在是考虑买入
  `SPY` 的良好时机，然后迅速退出。


  一旦策略的均值回归部分被触发，当 `6` 日指数移动平均线（`EMA`）跌破 `5` 日简单移动平均线（`SMA`）时，策略将寻求买入 `SPY`。这一信号表明资产交易价格低于其近期价格并可能过卖，表明这可能是买入的良好时机。


  ![](img/00011.jpeg)


  大多数交易者认为这种交叉会给出卖出信号。然而，七行代码策略利用均值回归意识到，有时市场会过度反应并将价格推得过低，从而产生低买的机会。





  当 `6-day EMA` 穿过 `5-day SMA` 之上，策略卖出。这一信号表明资产的交易价格高于其近期价格，可能处于过度买状态，意味着可能是卖出的良好时机。当这种情况发生时，策略会卖出
  `SPY` 并买入长期美国国债 (`TLT`)。这是因为当 `S&P 500` 价格下跌时，`TLT` 的价格往往会上涨，使其成为对冲股市潜在下跌的良好对冲工具。


  ![](img/00012.jpeg)


  “七行代码”策略对均值回归的使用，使交易者能够利用由情绪、情感和流动性问题驱动的市场波动，而非基本面因素。通过识别价格何时可能回归其均值，交易者可以就何时买卖资产做出明智的决策，即使在波动的市场中也可能产生利润。


  简单来说，该策略寻求在资产价格低于其近期价格时买入，在高于其近期价格时卖出。这是基于价格会随着时间推移倾向于回归均值的观点，允许交易者从短期市场波动中获利。


  ## 结合趋势跟踪与均值回归的优势


  “七行代码”交易策略是趋势跟踪和均值回归技术的结合，这为交易者提供了显著的收益。该策略利用趋势跟踪来识别市场趋势，利用均值回归来捕捉市场的短期波动。通过结合这两种方法，该策略能够以比其他交易策略更低的波动产生持续的收益。


  结合趋势跟踪和均值回归的主要优点之一是，它可以帮助交易者实现更平衡的投资组合。趋势跟踪在识别长期市场趋势方面有效，允许交易者在持续期间内获得收益。然而，当市场反转趋势时，这种方法也可能导致损失。通过引入均值回归技术，交易者可以利用短期市场波动来产生利润，同时在熊市中限制亏损。


  “七行代码”策略已被证明在长期内可以带来持续收益。自 2000 年以来，该策略的平均年收益率达到 19%，显著优于 `S&P 500`。这很大程度上归于该策略在牛市中捕捉收益的能力，同时在熊市中限制亏损。例如，在
  2008 年，当 `S&P 500` 下跌了 37%时，该策略上涨了 23%，证明了其即使在最具挑战性的市场条件下也能产生利润的能力。


  结合趋势跟踪和均值回归的另一个优点是它可以帮助降低投资组合的波动性。“七行代码”策略的波动率仅为买入持有策略的一半，这有助于限制市场波动对交易者投资组合的影响。对于寻求长期产生持续收益的交易者来说，这尤为重要。


  结合趋势跟踪和均值回归的优势不仅限于七行代码策略，还适用于广泛的交易策略。通过在交易方法中结合这两种技术，交易者可以实现更平衡、更多元化的投资组合，同时以更低的波动产生持续的收益。


  简单来说，“七行代码”策略结合了两种有效的交易技术——趋势跟踪和均值回归——以在长期产生持续的收益。


