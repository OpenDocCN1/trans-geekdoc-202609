  ### 平均收益与风险管理


  股市是不可预测的，因此拥有一种能够帮助你管理风险并最大化收益的交易策略至关重要。在本章中，我们将查看“七行代码”策略使用的风险管理技术，以及它们是如何助力成功的。


  该策略最关键的方面之一是识别市场何时处于上升或下降趋势的能力。正如我们之前提到的，该策略结合趋势跟踪和均值回归技术来识别这些趋势。


  当 `S&P 500` 处于上升趋势时，该策略不使用紧凑止损。这意味着它不会在市场小跌时卖出——否则交易者将过早退出。这与《股票操盘手回忆录》中传奇交易员 Old
  Turkey 采用的方法相似。Old Turkey 以其长期眼光和在任何情况下都持有股票的能力而闻名。他经常说“这是牛市，你知道的”，并且即使在价格大幅下跌时也拒绝卖出股票。




  然而，“七行代码策略”也使用了风险管理技术，以确保交易者不会长时间持有亏损的头寸。当标普 500 指数处于下降趋势时，该策略寻求小额收益，而不是试图持有头寸以期待趋势反转。


  平均而言，该策略每笔交易的收益为 `1.3%`，平均持仓时间为 15 天。这意味着该策略在市场处于下降趋势时能够快速获利，从而限制潜在的损失。相比之下，在上涨趋势期间，该策略愿意顺应市场波动，并利用潜在收益。


  该策略中使用的趋势跟踪和均值回归结合是实现这些结果的关键。通过遵循趋势，交易者可以识别进入市场和持有头寸的最佳时机。但通过同时使用均值回归技术，交易者可以在市场处于趋势时利用小额收益，并避免重大损失。


  该策略每笔交易 `1.3%` 的平均收益看起来并不多，但随着时间的推移，这些收益会累积。如果你投资了 `$10,000` 并且每笔交易获得 `1.3%` 的收益，五年后你将拥有超过
  `$15,000`。与大盘表现（年平均收益约为 `9%`）相比，这是一笔可观的收益。


  该策略的风险管理技术也有助于限制潜在损失。在市场处于上涨趋势时不使用紧凑止损，交易者可以避免被过早地洗出市场。这意味着他们可以持有头寸，等待市场反弹，因为市场反避免地会反弹。


  总的来说，七行代码策略在管理风险的同时获得稳健回报方面非常有效。通过结合趋势跟踪、均值回归技术并使用风险管理策略，交易者可以利用牛市和熊市市场，最终获得更大的长期成功。


  ## 与其他投资策略的比较


  投资股市可能会令人生畏，特别是对于那些在该领域没有多少经验的新投资者来说。为了让投资更易于参与，人们开发了许多简单的投资策略。其中一种策略就是七行代码策略，它利用机器学习根据趋势跟踪和均值回归技术来生成交易信号。


  为了更好地了解七行代码策略与其他简单投资策略的比较，让我们仔细观察最常用的技术之一：“买入持有”。


  “买入持有”是一种简单的投资策略，投资者买入股票或基金并长期持有（通常是几年甚至几十年），而不考虑市场波动。这种策略背后的想法是，从长期来看，股市往往会上增长，因此长期持有投资的投资者将从这种增长中中获益。


  虽然“买入持有”看起来是一个简单直接且低风险的投资策略，但它确实有一些缺点。首先，很难知道何时买入和何时卖出，而且人们往往倾向于长时间持有一项亏损的投资，以希望它最终能反弹。通过这种方式，“买入持有”变成了“买入并认输”（buy
  and fold）——投资者买入后就认输了，发现无法在深跌中坚持。


  相比之下，七行代码策略结合了趋势跟踪和均值回归技术来生成交易信号，旨在实现利润最大化的同时最小化风险。通过根据市场趋势和移动买卖 `SPY` 和 `TLT` 等
  ETF，该策略可以快速适应变化的市场状况，实现收益最大化并减少损失。


  在比较七行代码策略与其他简单投资策略的收益时，有几个关键因素需要考虑。一个重要因素是风险。虽然“买入持有”看起来是一种低风险策略，但从长期来看，它是有风险的，特别是当投资者长时间持有亏损的投资时。相比之下，七行代码策略通过适应市场状况来管理风险。


  另一个重要因素是收益。虽然“买入持有”看起来是一个低风险策略，但从长期来看它是有风险的，特别是如果投资者长时间持有亏损的投资时。例如，七行代码策略在过去二十年的年平均收益为
  `19%`，这比许多策略要高得多。


  总之，虽然“买入持有”看起来是一个简单且低风险的投资策略，但它确实存在缺点。标普 500 的年平均收益约为 `3%`。


  ## 第 6 章：交易系统对比图表


  ### 揭秘图表的伪科学


  在交易领域工作了多年后，我对围绕图表的炒作感到非常沮丧。这是一个广为人知的概念，交易者利用图表做出交易决策。但我一直觉得这整件事都是伪科学。


  于是，我决定对其进行测试。我投入了大量资金建立超级计算机网络，并组建了一支专家团队帮助我分析每一个图表。我想看看这些炒作背后是否有真正的科学。


  我们花了 18 个月的时间用超级计算机分析了每一个图表。这是一项巨大的工程。我们考虑了所有可能的变量，包括模式出现的频率、出现的时间框架，以及什么是“顶部”和“底部”。我们查看了数以亿计的图表，看看它们是否存在预测能力。


  我们发现了什么呢？结果令人失望。我们发现图表没有任何预测能力。完全没有任何一种模式具有统计学意义的预测市场波动的能力。


  这对我们来说是一个不小的震惊。我们曾希望发现一些帮助交易者做出更好决策的方法。但我们必须面对事实：图表是伪科学。它们看起来可能很厉害，但实际上无法预测任何事情。图表大多是随机的。人类的大脑是一个模式识别机器，会在云或植物等随机事物中看到模式。这被称为空想性。


  这一发现对我来说是一个重要的转折点。它帮助我理解，在交易世界中你需要根据数据和分析来做出决策，而不是根据猜测或迷信。


  当然，仍然有很多坚信图表的人。他们说自己利用图表赚过钱。即使是坏掉的钟也会准两次。但对于我和我的团队来说，我们将坚持数据。我们相信，交易成功的唯一途径是依靠可靠的研究和分析。


  所以，下次当有人向你推销某种图表策略时，请记住：它是伪科学，因为它是不可重复的。你可以把 100 个图表技师关在一个房间里。当他们出来时，会有 100 个不同的答案。坚持数据，从长远来看你会好得多。






  作为一名资深交易员，我可以证明主量化交易所带来的情感过山车。我曾经历过巅峰，也经历过低谷，这并不是一段易程的旅程。事实上，在意识到系统化方法是成功的关键之前，我已经爆仓了三个交易账户。


  通过系统化的交易方法，你可以将情绪从交易中剥离出来。你不需要根据直觉或预感来做决策。相反，你有一套可以持续执行的规则。这消除了交易中的猜测成分，并使你坚持执行计划变得容易得多。


  ### 系统化交易的优势


  系统化交易方法最大的处处之一是它能帮助你避免情绪偏见。当你根据情绪进行交易时，更有可能做出不符合自身利益的决定。恐惧和贪婪会蒙蔽你的判断，导致你做出冲动决策。通过系统化方法，你犯这些错误的概率会更小。


  系统化交易方法的另一个优点是它能帮助你管理风险。通过持续地执行一套规则，你可以限制下行风险。你可以设置止损单，当交易违背你的意愿时自动触发。这可以帮助你避免巨损并保护你的交易账户。


  系统化交易方法还允许你对策略进行回测。这意味着你可以看到你的策略在过去表现如何。你可以分析历史数据，看看策略在不同市场条件下的表现。这可以帮助你完善策略并使其更有效。


  除了这些优点之外，系统化交易方法还可以帮助你避免过度交易。当你根据情绪交易时，你可能会受到诱惑，比应该更频繁地进入和退出交易。这可能导致更高的交易成本和较低的利润。通过系统化方法，你有一套规则告诉你在何时进入和退出交易，因此你不太可能过度交易。


  总而言之，系统化交易方法可以帮助你成为一个更有纪律、更成功的交易员。它消除了交易中的情绪，帮助你管理风险，并允许你对策略进行回测。通过系统化方法，你可以避免主量化交易带来的情感过山车，获得更持续的结果。


  ### 为什么依赖直觉对投资成功是有害的


  ![](img/00014.jpeg)


  著名的美国作家、励志演讲家欧尔·奈廷（Earl Nightingale）曾说，成功的关键之一是观察大多数人在做什么，并简单地做相反的事。这对于投资成功特别适用，因为直觉和情绪往往会导致昂贵的错误。


  例如，许多交易员依赖直觉和感性认识来做出投资决策。他们可能根据某种预感或感觉，认为某只股票将会上涨，或者市场将会崩盘。然而，像这样依赖直觉对投资成功是有害的。


  其原因在于，我们的直觉和情绪往往受到偏见和情感的影响，这些会蒙蔽我们的判断并导致非理性的决策。例如，我们可能会受到最新新闻头条或他人意见的影响，而不是依赖客观数据和分析。


  这方面一个很好的例子是在交易中使用移动平均线线。许多交易员会在移动平均线跌破另一条移动平均线时卖出，因为他们认为这标志着市场的下降趋势。然而，正如我们已经讨论过的，这可能是进行均值回归交易的绝佳时机。这就是直觉失效的一个例子。


