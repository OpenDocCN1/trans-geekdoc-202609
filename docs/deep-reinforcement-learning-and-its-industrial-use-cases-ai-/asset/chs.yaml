  \n### 4.6.3 结果\n\n如图 4.3(c)所示，智能体的重新训练大约需要 150 次实例才能完成集成。此外，集成之后，完成每个实例的关键阶段相互合并了，如图\
  \ 4.3(d)所示。图 4.2(c)展示了具有不同初始目标位置实例的结束帧。智能体能够在接近目标时管理夹持器的移动，并在三个目标位置上都将夹持器的姿态切换到抓取的最优配置。根据手动干预控制，我们定性地研究了追踪的抓取轨迹与控制器进度之间的关系，如图\
  \ 4.3(b)所示。\n\n这表明抓取方向可能类似于控制器的轨迹。为了验证所提议的解决方案，我们进行了单项评估。图 4.2(a)展示了如何评估任务。首先，夹持器需要理解初始位置的组件并将其推向\
  \ 2 号位置。随后将抓取设备重置为朝向 A 区域内的某一姿态。估计方法同样遵循，将目标物体从 2 号点移动到 3 号点，然后返回 1 号点。参与者被指示连续执行九次程序。对于评估，确定了标准执行器行程路径\
  \ `M` 和完成任务所需的时间 `T`。表 4.1 总结了评估结果。结果发现，建议的框架缩短了 58.7% 的移动时间和近 19.1% 的完成时长。\n\n\
