  \ [15].\n\n# Li, Z., & Xia, Y. (2020)\n在尝试评估疾病进展和治疗方案时，可靠且自动的淋巴结标记至关重要。由于淋巴结形态差异巨大以及获取逐像素注释的困难，淋巴结识别是一项艰难的任务。\n\
  \n由于实体瘤评价标准（`RECIST`）注释可以显示淋巴结的位置、尺寸和大小，并在医疗机构库中可用，因此可用于对上述分类工作进行弱监督学习 [10].\n\n\
