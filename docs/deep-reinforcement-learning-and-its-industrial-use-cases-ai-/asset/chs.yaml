  \ (12.81)\n\n在此类别中，数据的增益率由两个参数决定：环境中的位置。### 12.6 长短期记忆多层感知器神经网络（LSTM-MLNN）\n\n此外，可以使用所提方法观察\
  \ LSTM MLPNN 获取最合适的单元值。LSTM 解决了神经网络在误差传播时出现的梯度消失问题。细胞中的单元被称为“门（gates）”，负责控制信息的流动。网络状态通过额外的输入和输出得到了增强。输入门调节信息如何进入以及如何处理，基于\
  \ sigmoid 函数。输出门控制输出。神经网络权重通过反向传播（BP）算法进行优化。它们通过在时间步细胞中存储信息来实现。每个门通过 sigmoid 和 tanh\
  \ 层产生输出值。MLNN 是由一个或多个隐藏层组成的神经网络，能够实现数据输入、计算神经元和存储神经元。\n\n图 12.6 展示了 MLPNN 的架构图。此外，提出的\
  \ MLPNN 取决于每层的神经元数量和每层的类型（见下）。\n\n![图 12.6 MLPNN 架构图](img/fig12_6.jpg)\n\n**图 12.6**\
