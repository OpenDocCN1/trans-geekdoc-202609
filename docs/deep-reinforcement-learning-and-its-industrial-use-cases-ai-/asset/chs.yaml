  \ 5, 254-259, 2023, doi: 10.47392/irjash.2023.S34.\n\n\n\n\n健康问题和疾病的增加使人类生活变得非常危险和严重。在这种情况下，类风湿性关节炎（RA）是一种影响免疫系统并损害心血管和心脏等器官的慢性疾病。主要问题是疾病属性没有显示出疾病症状，且包含多种特征维度。为了解决这个问题，我们提出应用基于\
  \ UNET 门控卷积神经网络（UNET-CNN）的蜜蜂搜寻者优化 SVM 特征选择（HSFO-SVM）来更早地预测症状。使用`C-score`和`交叉验证`对\
  \ RA 数据集进行规范化。基于决策边界评估疾病影响风险评分（`DIRS`）。在`DIRS`的支持，蜜蜂搜寻者创建特征网结构以寻找关系特征边界。它通过支持向量成员规则函数进行选择。使用卷积神经网络将特征集逻辑地处理到`UNET`门控单元中。为了平衡测试样本下的偏置权重训练，分类器按类输入特征簇。分类单元最终确定风险边界特征限制，按类对患者的风险进行分类。所提系统的预测准确率高达\
  \ 96%，召回率达到 95.2%，F 值为 94.6%，以 3.5% 的低错误率和短时间产生了高性能。所提分类器比以前的方法具有更好的预测，实现了高 RA 预测准确率。\n\
  \n**关键词：** 优化、特征选择、神经网络、人工智能、类风湿性关节炎、高血压\n\n## 14.1 引言\n\n在现代快餐世界，健康事实和疾病正变得越来越普遍。对各种疾病和事实的关注通过疾病发现影响人类生活。由于特征条件，识别独特的疾病属性非常困难。类风湿性关节炎（`RA`-取向疾病）是最致命的疾病，会导致猝死并影响心脏。瓣膜病可导致心血管瓣损伤，高血压会导致左心室肥大。由于人工智能进行数据分析，识别疾病的本质非常困难。毕竟，人工智能实现了识别风险的优化需求。\n\
  \n有几种常见的结构受类风湿性关节炎（`RA`）的影响，这是一种影响多个器官的慢性、衰性、自身免疫和炎症疾病。它发生在免疫系统无法区分细胞和组织时。`ANFIS`\
  \ 模型用于预测人类受试者的 `RA`。一种综合方法使该技术能够以 93.5% 的准确率准确识别人类类风湿性关节炎。人类通过寻找 12 种症状来诊断 `RA`，包括年龄、僵硬、关节功能障碍、`ESR`、`CRP`、白细胞和尿酸，这些都可以反映在其他体液中。本文将\
  \ `ANFIS` 与其他分类方法如`朴素贝叶`、`Bagging` 和 `KNN` 方法进行了比较。\n\n`ANN` 是理解大脑如何处理和执行信息的强大工具，这就是为什么它的灵感来自生物神经系统。`AI`\
  \ 和 `ML` 在研究和医疗领域的应用包括各种疾病的诊断、慢性疾病的管理、医疗服务的提供以及药物和医药的诊断。患有风湿性疾病的人比任何其他类型的疾病的人都多，通常被称为肌肉骨骼疼痛。这些疾病干扰了日常活动。识别对风湿性疾病敏感的人对生活质量至关重要。它为所有年龄段的人设计；然而，女性更青睐。这种疾病的许多症状与其他疾病相似，因此发现它具有挑战性。此外，诊断工具昂贵且复杂。为了研究类风湿性关节炎，机器学习算法通过四个参数预测\
  \ `RA`。不久，人工智能（`AI`）将增强风湿性疾病的预后。\n\n当今世界上最常见的死原因是心脏病。心脏状况已成为今天现代世界关注的问题。现在每分钟就有人因心脏问题住院并去世。现在要在疾病早期预测疾病极具挑战性。机器学习可以为医疗行业提供精确且早的疾病诊断。利用传统的机器学习方法，我们的目标是寻找数据集中不同变量之间的相关性。我们希望利用这些连接来准确预测心脏病的可能性。结果表明，与其他机器学习算法相比，`random\
  \ forest` 在更短的时间内提供了更高的准确率。\n\n`Python` 使用 `random forest` 算法或 `ML` 算法处理数据集。这种技术根据早先就诊的患者记录预测未来并避免死亡。本研究证明，`random\
  \ forest` 方法作为一种在心脏病预测中提供良好结果的成熟机器学习技术，可用于预测系统。可以读取包含患者记录的 `CSV` 文件数据。数据访问随后进行手术，创建一个功能性心肌阶段。更高的效率和精密度、更好的适应性和更高的成功率都是所提方法的优点。\n\
  \n我们迫切需要开发一种早期检测心肌梗死症状和预防 `RA` 的技术，因为普通人无法定期进行像 `ECG` 这样复杂的测试，因此需要一种确定心脏病可能的简单且准确的技术。在全球范围内，心血管疾病被确定为死亡因之一，占所有死亡人数的四分之一。在根据临床数据预测心血管疾病方面，临床数据分析具有挑战性。利用\
  \ `ML` 和 `NN` 利用医疗行业产生的海量数据来做出更好的决策和预测具有巨大的潜力。正如我们所证明的，现代机器学习模型使用了许多特征。本研究侧重于通过机器学习技术增强预测系统的心血管疾病预测特征。\n\
  \n\n\n创建另一种预测性设备，用于识别抑制免疫反应的减轻表位和减轻炎症的镇静表位。第一组肽进行编码是因为采用了三层表示（氨基酸腐蚀连接、位置评分网格、物理化学性质以及改进技术、数据提取和调查）。我们提出了一种组件选择模型，使用多种元素提取模型从不同的元素表述构建各种基础分类器[1]]。可以从去模糊策略库中选择一系列去噪策略，以评估该框架的准确性和可靠性。在咨询专家后，将收集的信息通过审查过程整合在一起，结果呈现为假性阳性和误导性阴性。最极端的结果显示，所提框架与阿育吠陀大师的结果相符。应用/增强：所提框架将指导专家为患者安排药物和药品。这个基于疑虑的框架将作为阿育吠陀和吠陀专家的学习设备[2]]。主要问题是疾病属性没有显示疾病症状，而症状包含各种特征维度。研究贡献在于通过应用蜜蜂寻路者优化\
  \ SVM 特征选择（`HSFO-SVM`）结合 `UNET-门控卷积神经网络`（`UNET-CNN`）提前预测症状，在特征选择和分类的支持下以高精度率有效识别\
  \ RA 疾病。\n\n### 14.1.1 研究的创新性\n\n* 本文旨在使用 `UNET CNN` 算法提高 RA 疾病的预测准确性。使用 `C-score`\
  \ 和`交叉验证`对 RA 数据集进行归一化。\n* 疾病影响风险评分 (`DIRS`) 根据决策边界进行评估。在 `DIRS` 支持下，`Honey Scout\
  \ Forager` 创建特征网结构以寻找关系特征边界。它通过`支持向量成员规则函数`选择这些特征。\n* 特征集被逻辑化处理为 `UNET-CNN-门控`单元，然后使用卷积神经网络对其进行分类。为了平衡测试样本下的偏置权重训练，分类器按类消耗特征簇。\n\
  * 为了对风险进行分类并设定风险边界，分类单元提出了应对风险类别的特征限制。\n* 该系统识别出的特征是那些位于不变医学边界之间的特征，以确定病因。\n* 从标准医学库中收集\
  \ `RH-A` 数据集，根据优化技术评估结果。使用`confusion 矩阵`进行测试和训练以验证结果。\n\n### 14.2 相关工作\n\n通过比较各种离散技术的结果来检查框架的精确性和真实性。使用研究策略收集信息，在与专家讨论后，结果被强调为明显的和虚假的。所提技术产生的巨大结果与阿育吠陀大师的效果相对应。应用/升级：所提框架将指导医生为他们的患者定制治疗方案。这个灵活的框架是阿育吠陀和吠陀专家的学习工具[3]]。\n\
  \n类风性关节炎是那些原因不明的感染之一。调查临床信息提取有助于疾病早期分析和治疗。提出了另一种名为 `CS-Lift` 的定位计算，它利用`鸟类搜索计算`呈现`AdaBoost\
  \ 计算`。试验结果显示，`CS-Lift` 计算在预测类风性关节疼痛的准确性上适用于 `Adaboost`[4]]。引入了一种处理滤泡淋瘤排列的方法。该排序等级根据给定的属性作为信息数据，例如阶段、分期组、生长大小和执行状态。该排列显示了淋瘤在患者体内扩散有多快，这对于专家治疗疾病至关重要。所提框架是一个多目标多面感知器\
  \ (`MLP`)，它利用`支持向量机`对具有许多位进行排序，例如线性、二次和径向基前提能力 (`RBF`)，它将信息分组为特定的滤泡水平[5]]。\n\n本文对比了临床档案突出的各种表述，例如患者指示术语、显著性概念标识符、词组和双元组亮点。在所有工作集和各种工作任务确定条件下，都执行了最高水平的性能评估[6]]。所提算法对于\
  \ `TGA 逃逸`的随机性题是至关重要的。此外，由于健康能力的复杂性和遗传算法中模型表述限制的限制，`DGA` 解决了该问题。利用 `MNIST` 信息的试验结果带来了\
  \ 75.3% 的准确计算。如果幸运使用了 `dropout 计算`，准确性为 41.4%。`DGA` 已证明优于单纯的投降[7]]。\n\n骨边界通过功能形状模型进行表征。这提供了一个骨形状和周围设计的的可测量模型。关节位置通过表面特征的邻域直接规划识别。我们研究了五只\
  \ RA 手的放射图像。共定位仪准确率为 92%。此外，程序化探索减少了对熟练工人的需求。此外，远程检查和处方是可行的[8]]。\n\n显性元素通过直接假设部分分析从预处理信息中分离。元素提取限制取决于排列。分类器能力从基础中提取。输入信息经过组织和分类。排列由具有特性的神经精神引导执行。计算——这种排列给出了高准确率。可以从分组信息集合中毫不费力地检测感染。提供了各种类型关节炎症的数据。因此，它有助于预测和识别关节疼痛[9]]。\n\
  \n\n\n使用 `LSTM` 模型进行的预测（准确率为 82.38%）与使用 `SVM` 模型进行的预测（准确率为 79.48%）之间存在显著差异。例如，在区域\
  \ 2 中，`LSTM` 的最高准确率为 98.89%，而直 `SVM` 达到的最高准确率水平为 80% [13]。在机械化框架下，所有包裹方案的正常表征准确率分别为\
  \ 95.08% 和 93.47%。手动框架的精度分别为 94.06% 和 92.02%。与手动赌博评估策略相比，机械化 ML 评分在所有墙方面得出的 98.05%\
  \ 和 97.53% [14]。\n\n所提出的 `fluffy BLS` 对一些知名的排列和复发模型进行了评估，并与几个先进的平滑丝滑脑模型进行了比较。结果表明，`fluffy\
  \ BLS` 优于所涉及的其他模型。此外，与神经-fluffy 模型相比，`fluffy BLS` 具有模糊指南较少和准备时间更短的优势，这在某些方面对标准爆炸问题是有利的\
  \ [15]。Taguchi 的探索性计划策略有效地关注了其客户特定边界的理想混合。仿真中使用多面感知器和所提出的动态网络模型（`DNM`）对 14 个点进行测试，包括表征、估计和期望。考虑到所提学习计算的结果，我们认为所提方法可能在准备\
  \ `DNMs` 方面表现良好 [16]。\n\n该设备的精度水平达到了 90%，结果与临床专家的评估一致。考虑到实践中的实际结果，我们认为所提出的选择辅助设备可以帮助全科医生（GPs）对\
  \ RA 患者进行准确且合理的诊断。通过这种方式降低了误诊或延迟的风险，并防止患者病情恶化到越尖端的阶段 [17]。由于基于衰减的转换多目标优化计算（情感），多目标流优化在过去\
  \ 5 年中变得极为流行。根据最近的研究，其充分性主要取决于帕累托前沿（`PF`）设计，这些设计已被证明是有效的。这种现象有几个原因。其中一个是基准和子问题计划框架无法很好地适应衰减策略内问题的各种属性\
  \ [18]。\n\n带有 `CFW` 的 `NB` 已在许多测试中显示优于 `NB`，并对任何剩余的尖端、突出权重通道进行相关性比较，以找出哪一个最准确。与\
  \ `NB` 优化的特定权重容器相比，`CFW` 的基本优势是其低计算复杂性（不需要查询）和其模型的直观性。此外，我们将 `CFW` 应用于消息排序并取得了显著改进\
  \ [19]。通过人工智能和物联网应用彻底改变医疗保健，对人工智能对医疗保健和临床生产力的意义产生更优越的理解。这将使我们能够进一步开发我们的成果。它侧重于全面且完整的\
  \ AI 前言。涵盖了患者考虑、数字实际框架和远程医疗等观点，这一精英资产对于院长负责人、临床专家、政府部门、高等教育学生、教师、策展人、专家和老师是独特的 [20]。\n\
  \n分类器组合系统是分类器的集合，其结果通过加权计算单独组合。这通常是为了防止患者变得极端。此外，对于质量表征，利用了 `DNCM-ICSA` 计算。分析了最近开发的分类器的结果，与包括准确率、召回率、F\
  \ 值和精确率在内的测量保持一致 [21]。本文还调查了 2015 年左右分布的传统 AI 策略及其在诊断这些疾病中的应用。表格区分了开放问题和研究空白。我们认为深度学习将帮助产生专家和学者来预测病程、制定治疗方案并评估它们的潜在优势\
  \ [22]。机器先进作为一种人工意识领域正越来越多地应用于医学，以帮助患者和医生。开发信息索引为利用过去经验的 AI 策略提供了极佳的基础 [23]。\n\n\
  对于临床医生来说，手动评估不同的 `SNPs` 和基因关联非常耗时。这项研究利用基于 AI 的事实信息来识别关节炎症对老年人上位相互作用的影响，调查了到目前为止开发的额外事实\
  \ AI 和进阶策略。还检查了计算模型及其探索性结果 [24]。医疗保健中的人工智能是一个通用术语，用于描述使用 AI 程序和计算，或人工脑（模拟智能），来模仿个人在检查和理解临床和医疗服务信息方面的判断力。通过提供更好的分析、治疗或预测疾病的方法来构建或超越人类能力。特别是，模拟智能是计算机程序仅根据给出的信息就能获得估算结论的能力\
  \ [25]。理解准确的药物灵感、陷阱和限制对于理解和应用这些技术至关重要。获得个人和患者信任的重要性是可以认识的，但人工脑的发展（必须通过人类干预或通过扩展人工智能领域的系统来实现）需要建立背景\
  \ [26]。\n\n\n\n\nML 和 DL 专业的信息环境由两个阶段组成——即学习阶段和预测阶段——其基于基于 AI 的 `Outfit Logical\
  \ Methodology`（`MLEAA`）。学习阶段由 `Hadoop` 中的图表减少系统处理，元素信誉处于期望阶段。所提 `MLEAA` 方法的预测期包含三个独特的计算方法：`AbaBoost`、`SVM`\
  \ 和 `ANN`，最后的期望值根据投票策略进行确定。这对于检测类风湿性关节痛的早期迹象和提高测试结果极有帮助 [28]。为了使用这些集成分类器估估计分类器的基本参数，使用了\
  \ `k-NN` 和具有任意值的 `weights`。作为安排的一部分，对信息执行 10 折交叉验证，并使用 `accuracy`、`exactness` 和相关性倒数顺序等执行措施来评估你的工作。这些指标的优点与基础均值以及一些聚集分类器进行了对比。这种增强方法查看了基分类器与集成分类器之间的比较，产生了关键的改进\
  \ [29]。\n\n## 14.2.1 挑战与问题识别因素\n\n- 一个主要问题是 `RA` 病表现出的属性与医学观察中的特征发现不同，因此难以识别该疾病的本质及其症状。\n\
  - 特征维度增加：`RA` 数据集包含更多离群的特征依赖形式，这导致了较低的精确率。大多数现有系统未能识别 `RA` 的特征关系边际因子来识别疾病风险，导致了较低的准确率。\n\
  - 大多数由于错误率引起的偏差调整导致了低的学习水平和低 `F1 score`，这增加了误报率。\n- 由于维度因素，寻找特征支持权重更为复杂，因为考虑更多特征会导致分类准确率和精确率较低，且随着时间复杂度增加，召回率\
  \ `F1 score` 随之提高。\n\n## 14.3 基于 LSTM-门控卷积神经网络 (LSTMG-CNN) 的 HSFO-SVM\n\n类风湿性关节炎\
  \ (`RA`) 是最常见的心脏疾病之一。这种疾病主要影响呼吸系统和心脏组织。然而，`RA` 最常见的疾病是心力衰竭，这是一种心脏功能的严重疾病。心力衰竭是一种臭名昭著的危险疾病。这种疾病影响每一个人，当我们处于异常状态时，心脏功能会发生变化，因此人必须住院。需要进行许多研究来确定这种疾病的严重性。下面是所提心脏病预测系统的图\
  \ 14.1，特别是基于 `RA` 的心脏病。\n\n为此，应该收集相关数据并采用分类方法。为此，应该完成预处理、特征选择和分类。通过预处理标签页，它们在显示之前被归一化。使用\
  \ `C-score` 和 `cross-fold validation` 方法进行预处理。它使用 `Honey Scout Forager Optimized\
  \ SVM Feature` 方法为 `Honey Scout Forager` 模型选择特征。`LSTMG-CNN` 方法也用于分类应用以及其他分类应用。\n\
