  脑中是导致猝死并影响人类本性的最致命袭击。由于每个患者可能有不同的侧重点，在疾病的初始阶段分析症状具有挑战性。由于脑中风是全球范围内第二大死因，通过接受及时治疗可以防止脑中风的影响。早期中风检测可以控制并减轻严重程度和死亡率。症状的原因可能包括头痛、高血压、呕吐、瘫痪、类风湿关节炎和嗜睡。需要进行有效的数据分析以检查特征依赖关系并根据数据诊断每个功能。一种有效的方法使用机器学习（ML）算法识别风险变量。关键问题是支持疾病分类的特征维度。随着维度和假阳性率增加，识别和分类准确性下降。对疾病发生率进行加权调整以扩展特征范围，会导致具有高偏差的不精确分类。为了解决这个问题，我们必须开发一种自动特征选择和分类系统来分析疾病特征。这将准确地检测早期脑中风。在研究中，我们开发了一种基于决策树优化布谷鸟搜索（`DTOCS`）特征选择和长短期记忆门控多层感知器神经网络（`LSTM-gated\
  \ MLPNN`）的优化机器学习系统。最后，分类器更早地识别患者风险并采取必要行动。首先，我们从 Kaggle 收集了脑中风检测的数据集。其次，数据经过转换和归一化，以使用实际医学边界进行处理。此外，遗传特征序列算法（`GFSA`）估计脑影响标准化评分。适应度评估计算易感因子（`DPF`）。然后\
  \ `DTOCS` 算法选择急性特征以缓解维度比例。此外，通过所提方法获取处理逻辑单元的最大值，可以观察 `LSTM-gated MLPNN` 分析的部分。为了提高脑中风识别准确性，`LSTM`\
  \ 找到支持风险识别类的最重要特征权重，以提高分类准确性。它按类别对实际特征阈值进行分组。它为每个阈值创建一个类并减少无关特征的偏差。这增加了 `MLPNN`\
  \ 中的实际影响因子。分类器的性能可以使用……评估。\n\n**关键词：** 特征选择、分类、神经网络、数据转换、适应度函数、机器学习、脑中风\n\n## 12.1\
  \ 引言\n\n在现代世界的主要死因中，中风对公共健康构成了巨大威胁。脑血管血管意外（`CVA`）是目前最常见的事故之一。此外，像中风这样的医学紧急情况需要立即关注。世界卫生组织（`WHO`）将血管功能不全归类为导致中风和严重损伤的疾病。根据根本原因，中风的性质可以是缺血性的或出血性的。遗憾的是，随着世界人口的增长，这种疾病的死亡和发病率预计将增加。然而，许多工具使用\
  \ Cox 比例风险模型预测，中风可以通过早期治疗和良好的预后得到预防。`WHO` 估计每 4 到 5 分钟有一人死亡，每年有 1500 万人遭受中风。\n\n\
  健康对每个人的生活至关重要，需要一个记录系统来跟踪疾病数据及其关系。此外，可以实施患者病例摘要、临床医疗记录和其他手动维护的记录来跟踪多个信息。通过检查受影响个体，已确定了多种与中风相关的风险因素。许多研究使用这些因素来预测中风。\n\
  \n中风损害大脑并导致死亡。此外，当发生脑衰或中风等循环问题时，人们会在几年内死亡或永久残疾。范围内，中风是仅于缺血性心脏病的第二大死因。脑中风还与代谢障碍、肥胖、高血压和抑郁有关。此外，缺血性中风分为两类：脑梗死、中风。此外，这些是由于缺血性中风脑血管收缩引起的。手动诊断有几个缺点，包括耗时性长和需要多位专家。人工智能（`AI`）技术通过减少由于医疗错误导致的死亡率、时间和成本，在医学诊断中发挥着至关重要的作用。\n\
  \n\n\n\n此外，这些脑血管疾病导致了无法治愈的发病率增加。其他许多因素也会导致中风，例如体重增加、过度吸烟饮酒、久坐生活方式和压力。遭受过中风的个人可能会经历抽作，这可能导致沟通困难、突然的肌肉无力和记忆障碍。在缺血性中风中，血块阻塞脑部血流，导致血流量减少并死亡。在缺血性中风后，患者可能会发生中风出血，这会导致严重的并发症。如果血管破裂并流向附近的脑组织，身体其他部分的僵硬会导致中风。血管状况（包括脑震、高血压、动脉瘤、动脉畸形和出血性疾病）通常会导致出血性中风\
  \ [5]。\n\n在大多数情况下，脑中风是通过严重的疾病特征识别的，这使得疾病在受影响阶段更加危险。主要问题是早期风险的预测和识别，这对于预防至关重要，因此，根据疾病发现分析显著特征边界对于早期诊断治疗至关重要。通过使用深度学习选择特征并分类中风风险，该研究为中风的早期识别做出了贡献。使用\
  \ `LSTM-gated multi-perceptron neural networks` 通过降低特征维度对疾病相关症状进行分类。结果表明，所提系统通过从\
  \ Kaggle 收集的脑中风数据集实现了准确率。为了使用实际医学边界处理数据，我们通过转换和归一化对数据进行了预处理。此外，通过 `GFSA` 方法计算并归一化了脑损伤评分。`TPF`\
  \ 方法也可以通过引入适应评估来计算。此外，`DTOCS` 方法可用于选择关键特征进行降维。此外，我们开发了一种方法，利用 `LSTM-gated MLPNN`\
  \ 分类器快速分析疾病特征并准确检测中风。通过估计临床边缘特征指标的方差可以增强此 `LSTM` 方法的性能。这是通过根据准确的特征范围对其进行分组实现的。`MLPNN`\
  \ 方法为每个阈值生成类别，减少无关特征的偏置权重，从而增加分类器中实际疾病的影响系数。因此，可以根据分类器在准确性、敏感性、错误率、`FPR` 和 `FNR`\
  \ 方面的性能，评估所提方法与其他流程相关的准确性改进情况。\n\n本节讨论了通过预处理、归一化评分适应评估、特征选择和分类提高脑中风准确性的框架，如图图 12.1\n\
  \n图 12.1 脑中风检测架构图。\n\n## 12.2 文献综述\n\n建议可以通过多种方式提出和探索 `ML` 技术，包括泛化能力和预测准确率指标。然而，这是一个重大的全球问题，具有的健康和经济影响\
  \ [6]。空间忽略（S.N.）的时空谱表征新方法可以使基于 `BCI` 的 `EEG` 更好地检测 `S.N.`，尽管存在上述重大的全球性问题，但可以通过对对侧病变的视觉刺激产生\
  \ `EEG` 响应来实现 [7]。这种新方法建议，通过引入对对侧病变视觉刺激的 `EEG` 响应，可以模拟左侧和右侧偏瘫，尽管存在上述重大的全球性问题 [7]。（等等，检查文本是否存在重复：“偏瘫可以通过引入\
  \ `EEG` 响应来模拟……”）。这种新方法建议，通过引入对对侧病变视觉刺激的 `EEG` 响应可以模拟左侧和右侧偏瘫…… [8]。中风患者进行了多项研究，说明了步行性能、双重认知和运动任务对脑功能的新颖影响\
  \ [17]。在多个场合证明，基于不完整的生理数据和类别差异使用 `ML` 方法预测脑瘫是可能的 [18]。`ML` 算法根据个体的生理疾病和医学报告计算中风的可能性\
  \ [19]。医学领域通过使用深度学习 (`DL`) 模型可以节省时间并提高准确性。此外，113 篇分析论文可以在不同的学术数据库中发表 [20]。\n\n新方法讨论了开发自动化中风预测算法以实现早期干预。实施准确有效的预测系统正变得越来越重要\
  \ [21]。此外，通过病变检测和分割跟踪中风，以根据特定标准获得关键见解 [20]。目标是根据其用性和可比性，将先进的中风 `ML` 技术分为四个类 [22]。此外，他们描述了一种决策树学习\
  \ (`D.T.`) 方法，有助于识别中风特征进行分类 [23]。\n\n\n\n\n最近的一项研究表明，天线阵列的整个 `S-matrix` 可以使用原型测量，并可以通过幻影笔将幻影放置在各种预定义的位置\
  \ [25]。这种新方法提出了两阶段技术，根据在整个头部收集的微波散射数据，对出血性或缺血性中风进行实际分组和定位 [26]。此外，这些研究人员提出了初步实验，以验证使用\
  \ `DBIM-TwIST` 算法的 `MWT` 方法进行中风检测和分类 [27]。该健康监测系统可实时预测老年人在日常行走期间的中风先兆。然而，在利用各种医疗服务的同时预测健康疾病和疾病的实时模型正获得越来越多的关注\
  \ [28]。所提方法允许基于实时生物信号和 `AI` 方法开发中风预测系统，以辅助诊断 [29]。\n\n此外，这些系统可以根据`牛津郡社区中风计划 (SCSP)`系统将中风分为三类\
  \ [30]，提出了一种模糊分级分割算法来检测缺血性中风病变，同时解决病变大小和形状差异带来的挑战 [31]。为了解决这些问题，可以使用混合特征选择为二维数据集开发分类学习模型\
  \ [32]。此外，还实施了改进的试验启动门控策略，以选择合适或不适当的试验开始时间点 [33]。此外，这些可能需要使用基于胶的头部模型，模拟脑组织和目标，以模拟出血性或缺血性中风类型\
  \ [34]。\n\n提高患者健康信息的计算机能力需要安全可靠性 [35]。这种新型天线设计具有 `4 × 4` 辐射贴片，以及通过串行和并行传输线对称扩展的开放\
  \ U 型槽 [36]。基于 `LBE` 范式，所提多步方法非常适用于各种阶段和时间限制下的有效临床诊断 [37]。这种新方法提供了使用 `MWT` 进行中风早期检测和监测的实验性手持系统的详细结果\
  \ [38]。这种新方法建议，这些标记物可以用于开发预测中风概率的不同 `ML` 模型 [39]。\n\n## 12.2.1 问题描述\n\n*   大脑血流问题以及血流中断会对个人健康产生严重后果，包括残疾，在某些情况下甚至会导致死亡。\n\
  *   中风是一种严重的医疗状况，大脑中的动脉破裂会导致对大脑的永久性损伤，并最终由于破裂动脉造成的永久性损害导致功能丧失。\n*   各种血管和神经系统事件可能导致缺血性中风中的脑组织受损。\n\
  *   如今，`MRI` 测试既昂贵又耗时，使得中风的诊断和预测具有很大挑战性。\n*   由于中风病灶通常在形状、大小和位置上非常复杂，因此自动检测它们非常困难。\n\
  \n## 12.3 建议的方法\n\n这种提出的 `LSTM-gated MLPNN` 方法能够快速分析疾病特征并利用分类准确诊断脑中风，因此，我们首先从 `Kaggle`\
  \ 数据集中收集脑中风数据以确定其准确性。然后，对数据进行转换和标准化，以使用实际临床范围处理数据。此外，他们操纵 `GFSA` 方法来计算归一化的脑影响评分。通过适应度评估确定\
  \ `DPF` 方法。此外，使用 `DTOCS` 选择关键特征以减少长横比。\n\n此外，所提出的 `LSTM-gated MLPNN` 方法评估了医疗边缘之间特征测量的变化，并按类别对实际特征阈值进行分组。此外，`LSTM`\
  \ 可以带有门控单元以获取 `MLPNN` 最准确的值，并通过处理逻辑单元观察分析评估的选定部分。在图 12.2 中，`LSTM gate MLPNN` 方法的架构图说明了门控单元如何帮助实现\
  \ `LSTM` 并实现 `MLPNN` 的最优值。通过处理逻辑单元，这种方法进一步允许检测分析评估的选定部分。\n\n### 12.3.1 数据收集\n\n\
  中风是由于大脑血流不足导致脑细胞死亡的结果。中风在性质上可以分类为缺血性或出血性。缺血性中风发生在血流减少时，而出血性中风发生在发生出血时。无论人患的是哪种类型的中风，都会导致大脑停止正常运行。中风根据症状分类，例如身体一侧运动或感觉的丧失。这些症状包括说话或理解困难、头晕和盲视，都是中风的症状。这些症状通常在中风发生后出现。短暂性缺血性发作\
  \ (`TIAs`) 有两种类型：持续 `1 to 2 h` 的短暂性缺血性发作和短暂性小中风。\n\n![图 12.2 所提 LSTM-gated MLPNN\
  \ 方法的架构图](img/fig12_2.jpg)\n\n图 12.2 所提 LSTM-gated MLPNN 方法的架构图。\n\n除了中风的明显症状外，出血性中风还可能导致严重的头痛。长期并发症包括肺炎和尿液控制缺失。高血压极大增加了中风风险。心房颤是一种由于高脂血、吸烟、肥胖、糖尿病和\
  \ `TIA` 史导致心脏无法正确保持节奏的情况。血管阻塞通常会导致中风，尽管存在其他较少的原因。出血性中风可导致出血直接进入大脑或脑膜之间的空间。如果破裂，可能会发生脑动脉瘤。此外，中风可以通过手术纠正。功能丧失的治疗可以在脑损伤类别下更好地处理，并建议作为中风康复。图\
  \ 12.3 描述了脑中风数据集的架构。\n\n### 12.3.2 预处理\n\n\n\n\n在此预处理部分中，根据实际医学边界对数据进行转换和归一化处理。预处理是优化和有效利用数据的关键步骤。此外，准确性、操作性和可靠性是数据质量的特征。数据转换和归一化是数据预处理的关键阶段。数据传输即使在噪声数据中也能检测缺失项并纠正错误。数据集成是指合并来自各种源的数据以创建一个互连且统一的数据集。数据还原描述了减少详细数据的过程。此外，冗余是预处理型数据集成中最大的问题之一。如前所述，冗余是数据集成中的一个关键问题。冗余发生有几个原因，例如属性命名、一致性和属性的来源。数据转换涉及将数据转换为适用于挖掘目的的格式。此外，数据归一化可以进行预处理和定义，以提取患者症状、风险变量、中风分类和类型预测等参数。通过归一化每个矩阵元素，使频率维度上的每个通道能量相等。此外，已证明传输的数据具有宽动态范围散射参数，能够为特定频率建立复杂的散射矩阵模型。可以应用复对数函数来降低归一化方差值。归一化技术也可用于准备数据。数值列值可以重标到\
  \ 0 到 1 的固定比例。此外，当需要调整均值为 0 且标准差为 1 的数据集时，数据归一化非常有用。ML 建模通常在分析之前需要对数据进行归一化。如果将数值列中的值转换为恒定比例，对数据集进行归一化并无，保持信息完整且不失真数据集的标准范围。因此，从平衡实际临床边界数据以提高准确性的角度来看，预处理是有意义的。\n\
  \n![图 12.3 中风数据集。](img/fig12_3.jpg)\n\n**图 12.3**](#c12.xhtml#figi12_3) 中风数据集。\n\
