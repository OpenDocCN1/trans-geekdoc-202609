  \n\n\n\n理解蛋白质中特定氨基酸残基与配体分子之间的联系，取决于正确识别蛋白质-配体相互作用中的结合构象。这种知识对于确定结合能和亲和力至关重要。分子对接等传统方法由于计算限制，往往无法预测生物学相关的结合构象。该方法不需要预先定义蛋白质中的活性位点\
  \ [29]。`GraphCNNs`被提出作为`3D CNNs`分子表示的替代方案，具有计算优势。该方法结合了节点和空间特征。选择`DDPG`作为强化学习（RL）算法，但可能会遇到收敛问题。离散化连续状态空间或使用其他\
  \ RL 模型如`DDQN`或`TD3`是潜在的替代方案。实现涉及在多种病毒蛋白-配体复合物上训练模型，验证 RL 识别活性位点的能力，并评估原子特征的重要性。考虑到将配体特性和残基特性特征编码到算法中。该方法通过提出一种基于\
  \ RL 的方法来自动确定合适的配体构象和结合位点，消除了定位蛋白口袋和网格布局等手动工作的需求。抗病毒蛋白-配体复合物是初始重点，并可能扩展到基于大量数据集训练的更动态的框架。\n\
  \n### 9.2.4 结合肽生成\n\n由于`MHC Class I`蛋白具有独特的肽库，它们对免疫疗法至关重要。然而，体外研究无法描述数百种`MHC Class\
  \ I`蛋白的结合基序，因此需要一种扩展且有效的替代方法。`PepPPO`（肽类近端策略优化）旨在生成与`MHC Class I`蛋白相互作用的结合肽 [30]]。对于数千种人类`MHC\
  \ Class I`蛋白高效确定了结合基序，显示出与实验推导基序的高度相似性。该方法通过 RL 创建肽来解决了实验数据稀缺的问题。`PepPPO`通过逐步氨基酸突变优化随机初始肽，直到根据`MHCflurry2.0`预测它们能与特定的\
  \ MHC 蛋白正向结合 [31]]。`PepPPO`产生的结合肽与通过实验获得的基序表现出强相关性。它们具有强度和鲁棒性等属性，持续从不同的初始肽中出现，证明了`PepPPO`的可靠性。此外，这些基序对于快速筛选人类`MHC\
  \ Class I`蛋白（即新抗原）有效，无论是否有实验数据`PepPPO`在生成高质量结合肽方面优于其他方法，使其成为基于肽的疫苗开发和免疫学研究中前景良好的工具。\n\
  \n为了评估`PepPPO`的效能，创建并对比了五个基准模型。这些技术在产生 30 种 MHC 蛋白合格肽方面的有效性见表 9.5，该表分为具有实验数据的常见\
  \ MHC 和没有实验数据的稀有 MHC。无论使用或不使用多样性促进缓冲区，`PepPPO`在合格肽百分比、平均呈递分和最高呈递分方面优于其他方法。对于常见 MHC，`PepPPO`的表现明显优于次优模型`sPWM`，证明了其在合格肽中识别更多模式的能力。在稀有\
  \ MHC 的情况下，`PepPPO`的效果显著优于`sPWM`，表明在可用合格肽不足的情况下它更具韧性。数据显示了 30 种 MHC 蛋白的均值和标准差值。列显示的内容如下：“Percentage\
  \ (%)”术语表示所有创建肽中合格肽的比例，“Average score”表示平均呈递分，“Maximum score”表示最高呈递分。加粗显示表示最高百分比\
  \ (%)值。从`PepPPO`产生的肽中检索到的基序显示出鲁棒性，并与实验推导的基序良好对齐。这些模式对于常见和不常见的人类等位基因都是有用的，其在直肠癌快速新抗原筛选中的成功应用证明了这一点。这具有精准医学中快速新抗原筛选技术进展的潜力。\n\
