  \ (9.4) \n\n许多学习策略，包括 `MonteCarlo`、`temporal difference` 和 `state– action–reward–state–action\
  \ (SARSA)`，涵盖了无模型策略评估和改进过程的各个方面 \\[3\\]。由于现实世界 `RL` 问题中的状态动作空间通常很大，为每个可能的状态保留一个不同的值函数是不现实的。为了在这些复杂的环境中泛化值函数，需要函数近似技术。通过为给定的状态-动作对\
  \ `(s, a)` 计算一个函数，指定为 ![ModifyingAbove upper Q With caret](img/equ9_181_3.png)<math\
  \ display=\"inline\"><mover accent=\"true\"><mi>Q</mi><mo>&#x005E;</mo></mover></math>\
  \ 并表示为 ![ModifyingAbove upper Q With caret dot left-parenthesis s comma a comma\
  \ w right-parenthesis almost-equals upper Q Superscript Baseline left-parenthesis\
  \ s comma a right-parenthesis equals x left-parenthesis s comma a Superscript upper\
  \ T Baseline w right-parenthesis](img/equ9_181_3.png)`(s, a, w)` ≈ `π*(s, a) = x(s,\
  \ a^T, w)`\n\n\n\n\n\n此外，当尝试通过神经网络设计较浅的深度卷积（CNN）解决问题时，Q 函数的近似可能会导致不稳定性和发散问题。随后，可以通过经验回放（experience\
  \ replay）等方法解决此类问题。\n\n双路 DQN（double DQN）是 DQN 方法的一种更复杂版本 [10]，它使用双 Q 学习算法 [11]\
  \ 来处理 DQN 的过度估计问题。DQN 同时学习两组值函数，并随机分配经验来更新其中一组。因此，存在两组不同的权重，其中一组在每次更新时选择贪婪策略，另一组则选择其对应的值。此外，深度强化学习（DRL）领域还有许多其他著名算法，包括异步优势参与者-评论网络（A3C）、带经验回放的\
  \ AC、对抗网络 DQN（dueling network DQN）、连续 DQN、异步 N 步 Q 学习、深度 SARSA 和深度确定性策略梯度 [8]。\n\
  \n## 9.2 生物信息学中的学习方法及其在医疗健康和生物医学研究中的应用\n\n### 9.2.1 蛋白质折叠\n\nFoldit [12] 巧妙地将蛋白质折叠转化为一种在线益智视频游戏，通过众包解决方案利用玩家的直觉和创造力来解决蛋白质折叠的计算挑战。玩家的创造力和集体努力对酶的设计和结构阐明做出了贡献。Foldit\
  \ 的简单性、竞争性以及数据驱动的改进将蛋白质折叠转变为一项易于参与、大众驱动的科学活动，参与者超过了 46 万名。\n\n另一种，DeepFoldit [13]\
  \ 利用最新的 DRL 神经网络从氨基酸序列建模蛋白质三级结构（见图 9.1）。该 CNN 架构用于构建智能体，并使用带经验回放的 Q 学习。它的灵感源于 Flappy\
  \ Bird 的实现 [3]。最初，智能体对环境的理解有限，且只有少数潜在动作。智能体通过探索环境快速获得对游戏动态的感知，这种探索始于随机执行动作，并由每个动作后产生的成本驱动。\n\
  \nRosetta 算法被用作黑箱问题，智能体通过考虑能量差作为输入来学习蛋白质折叠的最优策略。它力最小能量（最大化得分）的同时惩罚能量增长。通过训练周期，智能体为不同的蛋白质演化策略。平均奖励引导模型选择，并对参数进行微调以获得最佳性能。智能体采用\
  \ CNN 和 Q 学习进行决策，确保在蛋白质折叠任务中高效适应并最大化未来奖励。\n\n![9.1 模型架构，其中 ISi = 层 i 的输入大小，RFSi\
  \ = 层 i 的感受野大小，CLDi = 卷积层 i 的深度，ND = 全层大小，输出为动作之一。](img/fig9_1.jpg)\n\n**图 9.1**\
  \ 模型架构，其中 `IS[i]` = 层 `i` 的输入大小，`RFS[i]` = 层 `i` 的感受野大小，`CLD[i]` = 卷积层 `i` 的深度，`ND`\
  \ = 全层大小，输出为动作之一。\n\n总体而言，该研究结果表明了 DeepFoldit（一种 DRL 框架）在蛋白质折叠游戏 Foldit 中的应用。它尚未完全达到超人类水平，但其在\
  \ 200 步限制内改进蛋白质结构的能力是令人鼓舞的。研究讨论了某些困难，例如使用“缩小”序列和蛋白质替换来处理分子填满整个窗口的情况。作者提出，可以使用连续动作强化学习来提高蛋白质折叠的韧性和灵活性。他们探讨了并行化和超参数优化作为增加训练效率的方法，并强调了\
  \ DeepFoldit 如何将 Foldit 的易用性与 DRL 的强大性相结合。\n\n### 9.2.2 蛋白质对接\n\nDRLCOMPLEX [14]\
  \ 利用 3D 原子坐标和它们的 2D 链间接触作为输入，通过自对弈几何重建建模蛋白质复合物结构。在动作空间中，为智能体设计了六个动作，涉及沿 x、y、z 轴的平移和旋转，以调整一条蛋白质链在\
  \ 3D 中相对于另一链的位置。训练涉及与环境的持续交互，根据网络的最高预测值或根据 `ϵ`-贪婪策略随机选择动作。经验回放存储了智能体的经验（`S, A, R,\
  \ S0`）用于训练。从当前状态到目标状态（`S` 和 `S*`）的转换用于根据二聚体的真实或预测结构来计算即时奖励。目标网络（`Q[target]`）通过提供动作的参考\
  \ Q 值来辅助训练，每 `k` 步更新一次。这些参考 Q 值包含了即时奖励和预测的未来值，并使用了折扣因子 `γ`。它在同源和异源二聚体蛋白质复合物数据集上经过严格评估，在真实接触方面实现了高准确性，并证明了其对接触预测准确性的依赖。当使用预测接触时，DRLCOMPLEX\
  \ 的表现具有竞争性，优于模拟退火、马尔可夫链蒙特卡洛（MC）、梯度下降（GD）、晶学和核共振系统（CNS）等其他优化方法，使其成为药物发现领域前景良好的进展。\n\
  \n实验使用了两个著名的蛋白质二聚体数据集进行模型评估：CASP CAPRI，包含 28 个同源二聚体 [15]；以及 Std 32，包含 32 个异源二聚体\
  \ [16]。对于两个数据集，展示了 DRLCOMPLEX、GD 和 CNS 的 RMSD、TM-score、`f[nat]`、`I_RMSD` 和 `L_RMSD`\
  \ 平均值。评估使用了真实的接触和三级结构，并对结果加粗。RMSD、I_RMSD 和 L_RMSD 的单位为 Å。根据 Std32 异源二聚体，表 9.1 显示了算法的性能。DRLCOMPLEX\
  \ 在理想情况下（表 9.1）除 `f[nat]` 外的所有评估指标上均表现更好。RMSD 的差异显著。表 9.2 表明了方法在 CASP CAPRI 同源二聚体数据集上的平均性能。在所有评估标准上，DRLCOMPLEX\
  \ 通常优于或等于其他预测器，GD 紧随其后。惊讶的是，在 28 个目标中的 10 个中，DRLCOMPLEX 获得了完美的 1.0 `f[nat]` 分，证明了其高精度的四级结构能力。当给定理想输入时，DRLCOMPLEX\
  \ 可以可靠地重建二聚体蛋白质的四级结构，其平均 `f[nat]` 为 99.05% 证明了这一点。DRLCOMPLEX 在生成高质量模型方面取得了成功，并利用强化学习修改蛋白质位置，特别是在给定精确链间作用的情况下。此外，它还能生成合理的模型。即使在挑战性环境中，DRLCOMPLEX\
  \ 也能以先进的精度重建蛋白质二聚体结构。增强 DRLCOMPLEX 预测准确性并促进深度算法在药物研发中应用的一种方法是在蛋白质二聚体上对其进行预训练。\n\n\
  **表 9.1** DRLCOMPLEX、GD、MC 和 CNS 在 Std 32 数据集上的性能指标。\n\n\n\n\n\n| 方法 | TMscore (↑)\
