  \ PPO 通过利用各种模型来理解适应性的不同方面，解决了奖励估计的权衡问题，并使用最合适且准确的策略。尽管在大规模基准测试中显示出优越性，但 DyNA PPO\
  \ 的实用性仍需通过湿实验验证。此外，用于蛋白质设计的预训练生成模型可以通过强化学习（RL）进行改进，正如通过基于策略的 RL Tuning RNN 以生成理想化合物所示。这项研究对于缓解蛋白质生成模型常见的灾难性遗忘问题提供了宝贵的见解\
  \ [41]。\n\n![图 9.2 基于 DRL 的蛋白质设计，代理根据其策略和当前状态确定后续阶段的氨基酸变异以选择下一个动作。](img/fig9_2)\n\
  \n**图 9.2** 基于 DRL 的蛋白质设计，代理根据其策略和当前状态确定后续阶段的氨基酸变异以选择下一个动作。\n\n通过三个模拟昂贵湿实验的计算机模拟（in\
  \ silico）优化场景，我们将 DyNA PPO 与其他方法进行了对比。此外，还进行了消融实验以增强对 DyNA PPO 功能的理解。对比了无模型策略优化（PPO）和基于模型的优化（DyNA\
  \ PPO），以及 DbAs、RegEvolution (RegEvol)、FBGAN、Bayesopt GP (BO-GP) 和随机方法（请参见表 9.7）。根据某轮内建议序列的累积最大奖励\
  \ `f(x)` 计算优化性能。作为一个统计指标，累积最大奖励曲线下的面积总结了优化性能。每轮建议序列之间的平均对汉明距离用于衡量序列多样性，对于已知最优解的问题，我们报告了找到全局最优解的比例。50\
  \ 个不同的随机种子来重复这些实验。\n\n### 9.2 药物发现与开发\n\n用于蛋白质设计的预训练生成模型可以通过强化学习（RL）进行改进，正如通过基于策略的\
  \ RL Tuning RNN 以生成理想化合物所示。这项研究对于缓解蛋白质生成模型常见的灾难性遗忘问题提供了宝贵的见解 [41]。\n\n41.\n\n\n\n\
  \n我们发现，在比较实验数据和预测数据时，Tm 的估计变值为 42°C，log *P*的均方根误差（RMSE）为 0.9。有趣的是，这种准确性表明作者的方法在预测外部数据集的特征方面是成功的，但略低于使用交叉验证开发的类似定量结构-性质关系（QSPR）模型。这进一步证明了该方法产生的分子分子具有预期的和理想的特征。\n\
  \n## 9.3 在生物学数据中的应用\n\n### 9.3.1 组学数据\n\n研究人员还尝试将强化学习（RL）和二元粒子群优化（BPSO）结合，作为替代复杂且耗时的实验方法，用于预测细菌基因组中的操子\
  \ [44]。它利用*大肠杆菌*中的基因间距离、代谢途径参与情况和基因长度比例来创建一个基于 RL 的适应度函数，展示了其在三个基因组上的预测性能。RL 被用于\
  \ `BioAgent` 系统以提高生物序列注释的精确性 [45]。RL 可能被用于根据反馈和奖励信号迭代改进注释过程。具有挑战性的片段组装问题（包括 DNA\
  \ 和蛋白质）在生物信息学中至关重要。它引入了一种使用 `Q-learning` 代理的新型基于 RL 的模型 [46]，展示了前景的性能和改进 DNA 片段组装技术的潜力。一种结合\
  \ RL 与文本挖掘方法的构建蛋白质-蛋白质相互作用网络的混合方法，旨在更好地理解复杂的生物功能 [47]。RL 可能在优化这些网络的构建中发挥了作用。利用 PubMed\
  \ 数据，该方法被应用于列腺癌研究，证明了其有效性并揭示了无标度网络特征。然而，事实证明，有了领域知识，即使是简单的机器学习方法也可以优于深度学习技术 [48]。\n\
  \n### 9.3.2 医学影像\n\n使用 RL 来确定列腺的位置和体积已用于经直肠超声图像的分割 [49]。在这种背景下，RL 可能在优化分割过程中发挥了作用，以准确识别和勾勒超声图像中列腺的边界。通过使用\
  \ RL，分割算法可能学会了根据反馈信号做出决策或调整，最终提高了列腺位置和体积估计的准确性。这一应用展示了 RL 如何用于医学影像任务，以增强对复杂医学数据的分析和解释。一种\
  \ `DRL` 方法被创建用于通过磁共振成像识别乳腺病变，导致准确性显著提高并大幅缩短了检测时间。\n\n该方法引入了一种使用 `DRL` 的新方法，通过利用各种参数（包括来自医学扫描仪数据库的参数）来优化医学图像采集。基于信任区域策略优化的\
  \ `DRL` 技术用于分类和分割关节手术动作。深度 RL 和基于 `actor–critic` 的方法用于解决解剖标点的检测问题。早期展示了改进 MRI、超声和\
  \ CT 图像准确性和速度。对于 CT 图像中的实时 3D 标点检测，另一种方法建议使用多尺度 `DQN`，并在海量数据集上进行了测试。此外，研究还关注了不完整体积数据中的解剖结构检测，并在大型\
  \ CT 体积数据集上进行了评估。一种方法采用 `DQN` 进行 3D 图像采集的自动视图规划，在不同的 MRI 平面上实现了高准确性。另一种方法讨论了一种用于在体积场景中主动定位对象的\
  \ `DRL` 方法，而另一种方法则利用 `DQN` 检测各种医学图像数据集中的多个标点。此外，最近的研究提出了统一的端到端 `DRL` 技术，用于 3D 医学体积特定任务，如血管中心线追踪、多模态图像注册和图像注册。这些创新显著增强了不同应用中的医学影像和分析\
  \ [50]。\n\n### 9.3.3 脑/体机接口\n\n脑机接口（BMI）的研究已发现 RL 的用途，特别是在控制机器人或假肢设备方面。为了将神经活动映射到预期行为，研究人员使用带有\
  \ `TD(λ)` 的协同适应 BMI 将神经活动映射到意图行为，允许个体通过脑信号控制设备 [51]。`Actor–critic` 技术已被应用于共生 BMI\
  \ 系统，其中大脑和机器共同工作以实现所需的动作或移动 [52]。为了产生更准确的 BMI 控制模型，建立了一个专注于猴子从心外伸展任务的测试平台 [53]。通过将脑状态转换为假肢设备的动作，Hebbian\
  \ RL 方法被用于创建自适应控制 [54]。在多步目标导向跟踪任务中，利用 `Q(λ)` 技术创建了用于皮层脉冲无监督解码的 BMI 系统 [55]。为了在较长时间内提供稳定的性能，创建了只需少量训练即可适应脑活动显著变化的自适应\
  \ BMI。它们频繁使用 `AC` 架构 [56]。量化注意力门控内核 RL 被用于将状态-动作空间作为近似，以实现脑状态到动作的有效非线性映射 [57]。此外，为了远程控制机器人设备，BMI\
  \ 可以通过互联网发送由虚构运动诱发的 EEG 信号 [58]。此外，整合了贝叶斯模型和 RL 来选择动态阈值，提高了恢复性 BMI 系统的性能 [59]。\n\
  \n## 9.4 医疗保健中的自适应治疗方法\n\n自适应治疗方法（ATA）由一系列决策规则组成，根据不断变化的患者数据个性化治疗，整合了诊断测试结果、遗传信息和人口统计学细节等数据，符合个性化医疗的范式。它们在随时间变化的设置中管理慢性疾病特别有价值。顺序多分配随机试验（SMART）方法允许在每个决策层级进行因果推断，并可创建\
  \ ATA [60]。SMART 涉及一系列随机观察和治疗，患者根据其对之前治疗的反应在每个阶段进行重新随机化。常见目标包括比较预定义的 ATA 并寻找最佳方案。\n\
  \n\n\n多项研究利用 `RL` 方法优化了各种医疗状况（包括癫痫和精神分裂症）的 `ATAs`。这些 `ATAs` 根据不断变化的患者数据实现个性化治疗决策。为了减少癫痫的发作持续时间和和频率，研究人员结合\
  \ `fitted Q-iteration` 策略和极随机树改进了深脑刺激技术 [61]。一种基于 `RL` 的方法 [62] 被用于发现减轻精神分裂症症状的最佳\
  \ `ATAs`，并通过 `PANSS` 评分（阳性与阴性症状量）随时间进行监测。该研究使用了 SMART 研究的数据，并通过回归学习 `Q-function`，该策略采用了\
  \ `fitted Q-iteration` 方法。Ertefaie *et al.* 利用包括精神分裂症患者在内的 SMART 试验信息，针对残差分析引入了\
  \ `Q-learning` 的改进 [63]。此外，当 `fitted Q-iteration` 方法与多个奖励函数结合时，可以用于为精神分裂症治疗创建高效的\
  \ `DTR`。\n\n败血症是一种可能致命的感染，是全球健康关注的重要问题，个性化治疗策略对于其管理至关重要。近期研究探索了 `RL` 在开发个性化败血症治疗中的应用。这些研究利用可用数据集中的患者数据，研究了基于\
  \ `TD-learning` 和就地策略迭代的 `RL` 智能体的临床治疗策略。研究人员旨在学习一种优化策略以提高患者生存率，并将其与记录的临床决策进行性能评估\
  \ [64]。在其他研究中，采用了 `DRL` 和连续状态空间模型来评估最佳败血症治疗，强调了 `RL` 在为个体患者定制干预措施方面的潜力。此外，神经网络和\
  \ `proximal policy optimization` 被用于败血症患者的治疗，凸显了 `RL` 技术在医疗保健应用中的多功能性 [65]。这些调查强调了人们对利用\
  \ `RL` 改善败血症治疗结果并减轻其全球影响日益增长的兴趣。\n\n许多研究重点关注个性化癌症治疗，进行了一项先进癌症试验模拟，采用 `Q-learning`\
  \ 开发了根据个体患者特征和不同治疗反应的亚群不断调整剂量的 `ATAs`。在另一项研究中，使用强化学习框架来寻找个性化的肺癌治疗方案 [66]。最佳策略通过\
  \ `Q-learning` 从纵向患者轨迹中推导出，同时考虑了疗效与毒性之间的权衡。一种 `DRL` 方法被确定白血病患者的最佳治疗方案，利用特定时间范围内收集的医学数据来最大限度地减少移植物抗主疾病的风险\
  \ [67]。此外，Jalalimanesh *et al.* 解决了个性化放疗剂量计算的挑战，并利用 `Q-learning` 根据肿瘤生长阶段定制放射剂量，强调了个性化放疗策略在癌症治疗中的重要性\
  \ [68]。\n\n`RL` 方法已在治疗贫血中找到应用，特别是在血液透析患者中。从医学记录中，使用 `Q-learning` 算法选择了肾性贫血的理想治疗方案。引入了一种交互式\
  \ `Q-learning` 模型来开发和优化 `ATAs`，并使用抑郁症研究的数据进行了演示。此外，Vincent *et al.* 专注于通过 `fitted\
  \ Q-iteration` 优化促红细胞生成素治疗，以管理血液透析患者的贫血 [69]。建议采用结合 `Q-learning` 和结果权重学习的混合方法，以确定\
  \ SMART 试验中的哪些 `ATSs` 对治疗注意力缺陷、重度抑郁症和多动障碍等行为障碍最有效 [70]。此外，提出了一种基于 `Monte Carlo`\
  \ 和值迭代方法的在线选择框架，以缩短医疗问题患者的典型恢复时间 [71]。`RL` 方法证明在增强各种医疗状况的治疗策略方面非常有价值 [71]。\n\n对于选择\
  \ HIV 疗法，建议采用结合专家技术和 `Bayesian RL` 的混合策略。该策略考虑了患者数据的多样性并适应各种患者状况 [72]。同时，另一种方法利用\
  \ `policy gradient method` 通过考虑抗 HIV 药物选择与治疗结果之间的因果因素来改进 HIV 管理 `ATAs`。\n\n该研究探索了使用\
  \ `RL` 进行自适应医疗治疗的三个不同挑战 [69]。它解决了帕金森病电刺激技术设计的问题，处理了癫痫治疗电刺激的优化，并通过将分次调度制定为 `MDP`，为细胞群体对癌症放疗的反应创建了一个不同的模型。此外，Song\
  \ *et al.* 引入了一种名为 `penalized Q-learning` 的新方法来优化 `ATAs`，并在专注于抑郁症治疗的临床试验研究中评估了其性能\
  \ [73]。这些化的 `RL` 方法继续推进各个医疗保健领域的自适应医疗治疗。\n\n## 9.5 医疗保健与生物医学研究中的诊断工具\n\n生物标志物是用于评估各种生物或生理过程、疾病状态或对治疗反应的可测量指标。生物标志物在疾病诊断、预后和监测以及指导治疗决策方面起着至关重要的作用。它们被应用于肿瘤学、心脏病学、神经科学等医学领域，以改善患者护理和结果。\n\
  \n这项研究承认了肠道微生物对肥胖的显著影响，但强调了在不同地区寻找一致标志物以及为肥胖管理提供个性化干预的挑战。为了解决这个问题，研究引入了一种应用于五个不同国家人类粪便宏基因组的新型\
  \ `ML` 框架。它首先通过综合特征选择方法识别标志物，然后使用深度强化学习微调肠道微生物以达到健康状态。研究强调了 `DDPG` 算法在优化此类生物标志物丰度方面的有效性\
  \ [74]。\n\n鉴于其能够识别与该患者群体遭受的严重认知和情感处理障碍相关的脑活动变化，功能成像范式作为精神分裂症研究的标志物具有巨大潜力。为了确定长期记忆研究最有前景的功能成像标志物，认知神经科学治疗增强认知研究（CNTRICS）计划选择了关系编码与检索、项目编码与检索以及强化学习作为其关键的长期记忆构建因子\
  \ [75]。\n\n\n\nMaier *et al.* 研究了医疗行业中模型驱动的精确剂量计算和贝叶斯数据同化（`DA`）的使用。`RL` 在医疗行业中被广泛应用，但主要集中在临床试验设计，而不是药代动力学和药效动力学中最有效的剂量。基于模型的\
  \ `RL` 通过在不可预测的情境下通过模拟来教授最优动作，减少了治疗期间对实时计算的需求。由 `RL` 引导的给药通过利用复杂的学习技术（特别是树特定的上置置信界和蒙特卡洛树搜索）来优化剂量决策。由\
  \ `DA-RL` 引导的给药利用患者特异性的药物监测数据，结合 `RL` 和 `DA` 以产生一种灵活且易于理解的剂量策略 [76]。\n\n阿尔茨海默病是一项全球健康挑战，需要改进基于人群的检测和管理策略。目前的视网膜成像通过评估与脑退化相关的视网膜结构变化，显示出非侵入性阿尔茨海默病筛查的潜力。此外，`DL`\
  \ 的进展和 `DRL` 的出现表明，视网膜成像与自动化阿尔茨海默病预测具有潜在协同效应。本综述探讨了 `DRL` 在阿尔茨海默研究视网膜成像中的应用，讨论了其检测和预后能力。它还涉及挑战和机遇，例如定义奖励函数、标准化成像实践以及确保临床整合的数据可用性\
  \ [77]。生物标志物还可以包括 `RL` 智能体的行为特征，例如响应时间、动作序列或在特定条件下对某些动作的偏好。\n\n## 9.6 深度强化学习在医疗和生物医学应用中的范围\n\
  \n上一节提供了关于医疗和生物医学领域利用 `RL` 和 `DRL` 的历史发展和持续进展的全面概述。它展示了 `RL` 和 `DRL` 已应用的多种医疗场景，标志着显著的成就。然而，这些研究许多主要采用了现有的\
  \ `RL` 和 `DRL` 方法，而没有解决某些关键挑战，导致了常见的局限性。本节深入探讨当前研究中尚未解决的挑战，涵盖了 `RL` 和 `DRL` 的各个方面：状态、动作和奖励的表述；从全局模型中学习；以及策略评估。此外，它还涉及了经典\
  \ `RL` 和 `DRL` 的基础理论问题，即信用分配问题和探索与利用权衡。通过解决这些挑战，可以释放 `RL` 和 `DRL` 在医疗应用中进一步增强的潜力，有望提供更有效且稳健的解决方案。\n\
  \n### 9.6.1 状态和动作空间\n\n在将 `RL` 和 `DRL` 应用医疗的第一阶段，必须收集医疗数据、预处理并将其汇总为可管理的状态表示，这些表示整合了影响治疗选择和结果的相关混杂因素。定义适当的状态表示是复杂的，包括确定详细程度、轨迹持续时间和关键混杂因素。深度神经网络和其他可以以原始格式输入医疗数据的函数近似方法（这在研究中很常用）可能无法准确表示变化的变量或未检测到的混杂因素。为了解决这些问题，需要复杂的表示技术，如因果概率推理网络，它可以处理噪声、缺失或截敏的数据并模拟因果关系。\n\
  \n此外，制定动作至关重要。虽然大多数研究侧重于动作空间的离散化，但医疗中的许多情况需要连续或多维动作。向连续给药转变对于精准医学至关重要。通过 actor–critic\
  \ 和策略搜索等方法实现连续控制方面已取得进展，特别是来自机器人控制领域。然而，在大空间或无限空间中选择动作仍然具有挑战性，特别是考虑到样本复杂度。通过创建有效的方法可以提高\
  \ `RL` 和 `DRL` 应用于医疗的能力。\n\n蛋白质相关任务通常涉及高维状态空间，每个维度对应一个蛋白质特征。有效表示这些状态具有挑战性，因为用于蛋白质结构和序列的生物数据可能是稀疏、有噪声或不完整的。蛋白质是动态的，会随温度、pH\
  \ 和配体结合等因素的变化而改变。在状态表示中捕捉这种动态性是复杂的，需要对状态转换进行建模。蛋白质结构是多尺度的，从原子作用到整体折叠。在状态表示中决定正确的详细水平对于避免计算效率低下或信息丢失挑战。设计蛋白质或预测其结构通常涉及离散决策，如选择氨基酸或修改结构特征。定义有意义的动作可能是复杂的，因为单个动作可能会以复杂的方式相互作用。在动作制定中平衡多个目标（如稳定性、结合亲力和溶解度）是复杂的，需要考虑如何结合或优先考虑这些目标。探索不同结构可能性至关重要，但将其与利用策略相平衡具有挑战性，特别是在关于动作结果的信息有限的情况下。将领域特定的生物学知识纳入动作空间可能是困难的，因为需要编码复杂的生物化学原理和相互作用。基于动作评估蛋白质设计或预测结构的质量可能是计算密集型的，并可能依赖于外部模拟或实验，使得向学习智能体提供及时反馈具有挑战性。\n\
  \n\n\n\n在蛋白质相关的任务（如设计、结构预测、对接和药物设计）中，由于预期功能或上下文的不同，并没有唯一的正确答案。这种复杂性使得定义精确的奖励函数具有挑战性，因为可能存在多个有效解决方案。这些任务通常涉及相互竞争的目标，例如同时优化稳定性、结合亲力和溶解性。在单个奖励函数中平衡这些目标是非常复杂的，因为某方面的改进可能会以牺牲其他方面为代价。蛋白质具有复杂的折叠模式和动态行为，使得在奖励函数中捕捉这些复杂细节成为了一项艰巨的任务，特别是考虑到巨大的构象可能性。\n\
  \n评估蛋白质设计或结构的质量在计算上可能是昂贵的，而且反馈是稀疏的。`-` `sparse rewards`（稀疏奖励）会减慢学习过程。蛋白质质量评估的主观性带来了挑战，专家对于什么是“良好的蛋白质”意见不一。这种主观性阻碍了通用接受奖励函数的创建。用于训练\
  \ `RL` 智能体的数据有限且质量参不齐，进一步使问题变得复杂，因为高质量的蛋白质结构或设计可能非常稀缺。蛋白质任务的目标可能会演变，需要奖励函数进行调整以反映不断变化的目标和见解。从专家知识或历史数据推断奖励函数可能会引入偏差，将新蛋白质或新泛化是一项非同寻常的任务。蛋白质任务中的高维状态空间为定义有效的奖励函数带来了挑战，并可能遭受维度灾难的影响，碍学习。为了应对这些挑战，研究人员使用了领域知识、数据驱动的方法和专门的\
  \ `RL` 技术。他们可能还会探索替代的奖励方案，例如基于排序的奖励和多目标优化方法。深度强化学习和生成模型的进展为蛋白质相关任务贡献了更有效的解决方案。\n\
  \n### 9.6.3 策略 (Policy)\n\n确定策略价值的过程（也称为离策略评估问题）在医疗健康行业至关重要。这是因为由于成本高昂、治疗风险或伦理考量，直接通过实验在目标人群中评估策略的性能通常是不可行的。因此，在实际临床情况中使用学习到的策略之前，预测它们在历史数据上的运行情况至关重要。\n\
  \n尽管 `RL` 已为离策略估计器产生了若干值得关注的采样技术和策略以平衡偏差与方差，但诸如 `sparse rewards` 以及 `RL` 模型与医学专家之间显著的策略差异等问题，可能会使得这些估计器在医疗环境中的直接应用变得不可靠。由于对状态表示的处理不当、分配给基于采样的估计器的权重差异以及临时测量中的混杂变量，对治疗策略的评估可能不准确甚至具有误导性。从数据中行为策略估计的准确性，以及近似行为策略模型下的动作概率能够恰当反映事实，对于离策略评估的质量至关重要。\n\
  \n在许多实际应用中，特别是生物信息学或医疗健康领域，获取有意义且频繁的奖励来评估策略性能可能是挑战性的。这种稀疏性使得难以向学习智能体提供及时且信息丰富的反馈。许多应用中的状态空间是高维的，包含许多变量或特征。在这些空间中评估策略性能需要高效的方法在广阔且复杂的状态空间中探索并评估动作质量。环境会随时间变化，这意味着策略的有效性可能会随着条件的演变而变化。这种动态性质要求对策略进行持续评估和适应，以确保其相关性和性能。策略评估通常涉及估计器，而在这些估计器的偏差和方差之间取得正确的平衡是挑战性的。减少偏差可能会增加方差，`vice\
  \ versa`（反之亦然），使得获得准确的评估变得困难。当使用由另一个策略收集的数据评估策略（离策略）时，会产生策略差异和重要性采样相关的问题。确保行为策略准确代表数据并确保重要性采样过程可靠，是一项复杂的任务。\n\
  \n### 9.6.4 模型训练 (Model Training)\n\n与无模型方法相比，样本效率可以提高基于模型方法的效能。随着学习过程进行，基于模型的方法动态地学习转换函数和奖励函数。文献对于医疗健康行业中使用基于模型的\
  \ `RL` 方法的研究较少。目前使用的许多基于模型的 `RL` 算法适用于在具有离散状态空间的狭域领域运行的智能体。这与医疗领域通常涉及多维连续的状态和动作。修改基于模型的技术以便类连续、大规模环境中有效运行存在额外的困难。\n\
  \n通过创建系统的有限表示，医疗系统中的模型学习操作可以比现有的 `RL` 算法高效得多，实现智能探索和高效规划。\n\n### 9.6.5 探索 (Exploration)\n\
  \n探索行为是 `RL` 的关键部分。`-greedy` 技术和许多其他基于启发式的探索策略被用于许多实时学习 (`RL`) 应用中。这些技术已取得一些成功，但在处理医疗情况下复杂的动力学和广泛的状态或动作空间时，它们通常是不够的。它们可能导致巨大的样本复杂度，或者性能远低于理想。\n\
  \n当只有部分状态空间可见时，这个问题变得更加明显。在这些情况下，天真地探索整个空间是极低效的。这种问题在连续状态和动作空间中被放大，正如 HIV 治疗等案例所示，健康状态的吸引盆明显小于不健康状态。传统的探索方法在对整个空间进行长期探索后，在实现性能改进或生成有意义的治疗策略方面仍显示出局限。在高维设置中有效探索，迫切需要能够随着学习者的改变而改变或利用性能指标的探索策略。\n\
  \n### 9.6.6 信用分配 (Credit Assignment)\n\n\n\n\n\n在强化学习（RL）中，信用分配问题（credit assignment\
  \ problem）对于确定哪些动作负责学习结果至关重要。这一挑战在医疗领域尤为突出，因为医疗治疗的效果具有多样性且往往存在延迟。传统的强化学习方法使用启发式方法，如资格足迹（后向视图）或折扣因子（前向视图）来解决这一问题。然而，这些简化的启发式方法往往难以模拟医疗领域复杂的相互作用。例如，将某些行为（如午后服用胰岛素或清晨锻炼）与\
  \ 1 型糖尿病患者的血糖管理联系起来可能是挑战性的，因为这两者都可能影响血糖，并在稍后导致低血糖。这种挑战要求对医疗领域随时间变化的因果关系进行建模，并将其整合到学习过程中。关于因果解释和推理的广泛文献为改进强化学习算法中的因果推理提供了宝贵的工具\
  \ [78]。当生成因果假设来解释或预测观测到的事件时，它可以提高学习性能，并产生更具解释性和说明性的学习策略。\n\n## 9.7 结论\n\n深度强化学习（DRL）在生物和医学领域展现了巨大前景，为复杂问题提供了创新的解决方案。它从数据中学习最优策略的能力使其成为各种应用中的宝贵工具，包括药物发现、蛋白质折叠、个性化治疗方案和疾病诊断。DRL\
  \ 处理高维、噪声和复杂生物数据的能力允许研究人员和临床医生提取有意义的见解。在精准医疗中，它根据个体患者调整治疗方案，优化治疗结果。此外，DRL 通过加速搜索具有治疗潜力的化合物加速了药物发现。虽然\
  \ DRL 为最优决策提供了稳健的数学基础，但由于医疗数据的复杂性，将这些解决方案直接应用于医疗保健是十分复杂的。临床决策具有独特特征，需要定制的 DRL 方法来应对真实的医疗挑战。挑战依然存在，包括需要稳健的奖励函数构建、复杂的状态和动作表示以及医疗应用中的伦理考量。确保基于\
  \ DRL 的模型的安全性和解释性仍然是首要任务。当前方法中有几个未被充分探索的视角值得高度关注：开发更具解释性的 DRL 模型、增强迁移学习能力、解决数据受限的挑战，以及在确保环境智能医疗系统中体内应用的安全、可靠和有效的前提下，使现有的\
  \ DRL 方法适应无处不在的数据。DRL 在生物医学和医疗领域的应用处于计算机科学与医学的交汇点。尽管关注程度少于深度学习和传统机器学习等其他研究范式，但由于理论进展和实际需求，DRL\
  \ 正在受到关注。DRL 在变革生物学和医学方面具有巨大前景。尽管存在现有挑战，算法和计算资源的不断进步正推动 DRL 对这些关键领域的持续贡献，最终改善人类的健康和福祉。研究社区将从本综述对这一不断增长的范式的基础、方法、困难和新发现的系统性理解中受益。\n\
