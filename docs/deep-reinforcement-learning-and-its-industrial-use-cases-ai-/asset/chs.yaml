  \ \\sigma''_T(v)) + \\mathbb{G}(u_s, \\sigma''_s(v)) + \\sum_{a \\neq T, a \\neq\
  \ s} \\mathbb{G}(u_a, \\sigma''_a(v)) \\\\\n= \\mathbb{G}(u_T, \\sigma'_s(v)) +\
  \ \\mathbb{G}(u_s, \\sigma'_T(v)) + \\sum_{a \\neq T, a \\neq s} \\mathbb{G}(u_a,\
  \ \\sigma'_a(v)) \\\\\n= \\mathbb{G}(u_T, \\sigma'_P(v)) + \\mathbb{G}(u_s, \\sigma'_T(v))\
  \ + \\sum_{a \\neq T, a \\neq s} \\mathbb{G}(u_a, \\sigma'_a(v)) \\\\\n= \\mathbb{G}(u_s,\
  \ \\sigma'_T(v)) + \\sum_{a \\neq T, a \\neq s} \\mathbb{G}(u_a, \\sigma'_a(v))\
  \ \\\\\n\\leq \\mathbb{G}(u_s, u_T) + \\mathbb{G}(T, \\sigma'_T(v)) + \\sum_{a \\\
  neq T, a \\neq s} \\mathbb{G}(u_a, \\sigma'_a(v)) \\quad (\\text{三角不等式}) \\\\\n\
  = \\mathbb{G}(u_s, u_P) + \\mathbb{G}(T, \\sigma'_T(v)) + \\sum_{a \\neq T, a \\\
  neq s} \\mathbb{G}(u_a, \\sigma'_a(v)) \\\\\n= \\mathbb{G}(u_s, \\sigma'_s(v)) +\
  \ \\mathbb{G}(u_T, \\sigma'_T(v)) + \\sum_{a \\neq T, a \\neq s} \\mathbb{G}(u_a,\
  \ \\sigma'_a(v)) \\\\\n\\\\\n\\sum_{a=1}^{L} \\mathbb{G}(u_a, \\sigma'_a(v)) \\\
  leq \\sum_{a=1}^{L} \\mathbb{G}(u_a, \\sigma_a(v)) \\quad \\forall \\sigma \\in\
  \ \\sum_{a=1}^{L}\n$$\n\n(12.34)\n\n\n\n评估可行性的最优排列，并如公式 12.35 所示，其中 `ρ` 为离散矩阵。\n\
