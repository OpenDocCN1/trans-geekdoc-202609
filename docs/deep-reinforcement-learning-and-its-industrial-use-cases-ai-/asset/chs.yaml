  \n## 14.5 结论\n\n类风湿性关节炎（RA）疾病预测和分类以寻找疾病的准确性，使用 `HSFO` 方法预处理以过滤数据集，基于 `SVM` 的数据集优化和选择过程，最后使用基于\
  \ `UNET-CNN` 的算法进行分类。提议的系统展示了 `94.6%` 的 F 指数、`96.2%` 的精确率、`95.2%` 的召回率以及高达 `96%`\
  \ 的预测准确率。具有 `3.5%` 的时间复杂度和低误率，性能强。为了获得高预测准确率，建议的分类器应优于早期的技术。提议系统的准确率显示在结果部分，使用了多种比较技术来突出所实现的性能。最后，提议的算法由\
  \ `UNET-CNN` 算法产生了最高的准确率。\n\n# 参考文献\n\n1. Zhang, J., Zhang, Z., Pu, L., Tang, J.,\
