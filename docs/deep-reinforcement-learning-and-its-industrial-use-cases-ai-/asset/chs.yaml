  \n### 6.2.9 其他领域的区块链与智能合约\n\nRui Xie *et al.* \\[98\\]在他们的论文中提出了一种为高校级创新和竞赛构建基于区块链和智能合约证书系统的方法。Rifat\
  \ Sonmez *et al.* \\[99\\]设计并开发了一种基于 BIM 的智能合约支付管理系统，以升级建筑任务的传统进度支付方法。建议的方法已在一个真实的建筑项目中用于演示该技术。Abdul\
  \ Wahab *et al.* \\[100\\]提出了 `BCT-SmContract`，使用一种自动化程序，利用区块链在建筑项目的若干参与者之间建立合同协议。通过使用区块链技术和智能合约，本文概述了一种\
  \ \\[101\\]用于建筑现场信息管理的框架。使用这种方法，为各种数据构建了许多自治智能合约。它保证了系统能够在不中断服务的情况下动态安装新的智能合约，这使得扩展场景成为可能。建议的系统\
  \ \\[102\\]同时使用了公有链和联盟链技术，通过 SC 促进谈判、信用发行和信用交易。实验结果表明，建议的塑料信用系统在资源需求和系统维护方面可以轻量化运行，正如系统性能分析所示。Rowaid\
  \ Ibrahim *et al.* \\[103\\]展示了一个构建在托管于新型加密货币区块链的可编程智能合约原型生态系统。该原型的目标是确保建筑行业以去中心化、经济独立的方式运行。Debashis\
  \ Das *et al.* \\[104\\]提出了一种车联网通信系统（BVHS），以提高车辆安全和车辆间交换数据的机密性。\n\n## 6.3 回顾的批判性分析\n\
  \n\n\n\n文献检索使用了 Scopus 和 Google Scholar 数据库，因为大多数高质量期刊都被这两个数据库涵盖。关键词为智能合约、区块链与数字身份、区块链与金融安全、区块链与供应链管理、区块链与保险、区块链与临床试验、区块链与农业、区块链与房地产、区块链与教育与研究、区块链与建筑、区块链与加密货币，共检索到\
  \ 3259 篇论文。在筛选标题和摘要后，共排除了 2947 篇论文。在应用排除标准——论文质量较差、区块链改进、安全性改进、加密货币挖掘、区块链可扩展性问题以及无显著贡献的综述性工作后——检索到\
  \ 246 篇文章。再次根据全文审查应用排除标准，排除与研究不相关且缺失原型的论文。最终，检索并纳入 104 篇论文作为参考文献，并在图 6.2 中描述。\n\n\
