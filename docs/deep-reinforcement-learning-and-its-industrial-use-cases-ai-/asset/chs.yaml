  \ R. Hoffman *et al.* \\[86\\]展示了一系列用例场景，利用该技术的固有特性，说明了区块链在科学出版领域的适用性。Tim K. Mackey\
  \ *et al.* \\[87\\]提出了一种旨在利用区块链技术彻底新科学出版的范式。所有上述概念（包括我们自己的提议）在接受和实施方面都面临着挑战。因此，它们需要更多的测试、评审以及与科学界的协作参与才能得以有效实施。在科学出版领域，Janowicz\
