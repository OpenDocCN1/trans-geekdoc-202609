  \ College of Engineering，电子与电信电工程系*\n\n## 摘要\n\n深度强化学习（DRL）算法已成为深度学习与强化学习的关键交叉领域，为各个领域中挑战性的决策问题提供了解决方案。摘要介绍了强化学习的基本思想，即智能体通过与环境交互来学习最大化累积奖励信号的过程。随后，摘要讨论了深度学习策略的使用，强调了神经网络如何使表示和近似复杂的状态-动作映射成为可能。一种著名的\
  \ DRL 方法是 `Q-learning`，它计算动作值，其扩展方法 `DQN` 则使用深度神经网络来估计值。摘要概述了重大的算法进展，包括深度 Q 网络（`DQN`）、信任区域策略优化（`TRPO`）、近端策略优化（`PPO`）等，并概述了它们独特的运行机制、优点和缺点。在多智能体场景下，DRL\
  \ 被扩展以处理智能体之间的协作和对抗交互。此外，摘要还讨论了 DRL 情况下的奖励结构、迁移学习以及探索与利用的权衡。近端策略优化（`PPO`）和信任区域策略优化（`TRPO`）是直接学习动作策略的策略梯度方法的示例。`A2C`\
  \ 和 `A3C` 是两种结合价值函数估计和策略优化的著名演员-评论（actor-critical）技术。跨领域应用的示例包括机器人、游戏、自动驾驶汽车、金融和医疗保健。摘要解释了\
  \ DRL 算法如何实现突破性成就，在挑战性情况下表现优于人类。摘要还强调了样本效率低、稳定性和泛化性等持续存在的问题，这些问题推动了持续的研究。深度强化学习（DRL）在游戏、机器人、医疗保健、自动驾驶、语言理解等多个领域确实取得了卓越成就。\n\
  \n**关键词：** 深度强化学习、深度学习、基于价值的方法、基于策略的方法\n\n## 3.1 引言\n\n一种名为强化学习的机器学习方法专注于软件智能体在特定设置下需要采取的适当行动。这种神经网络学习方法展示了如何在几个阶段中最大化特定参数或完成具有挑战性的目标。强化学习（RL）是机器学习和人工智能（AI）的子领域。该学习方法包括与环境的交互并从中学习，以最大化累积奖励信号。强化学习的一个基本方面是试错概念。强化学习智能体（`RL`）在动态环境中执行一系列任务，并接收以`reward\
  \ function`为表示的奖励和惩罚形式的反馈，以便从经验中学习。通过收集的经验，AI 智能体应该能够最大化以累积奖励形式呈现的多个目标。寻找最优路径，或寻找能最大化预测累积奖励的状态与动作之间的映射，是智能体的主要目标。\n\
  \n强化学习（`RL`）是三种机器学习范式之一，它超越了监督学习和无监督学习。它使用扮演人类专色的智能体执行任务。RL 通过与世界交互、观察发生的情况并对结果做出反应来从经验中学习，而不是需要标注数据。图\
  \ 3.1 说明了如何使用马尔可夫决策过程（`MDP`）来解释强化学习。每个环境由`state` 表示，它捕捉了那里的当前状况。\n\n### 3.1.1 强化学习是如何工作的？\n\
  \n假设你想教你的狗一种新技能。由于狗听不懂人类语言（包括英语），我们无法指导它。相反，我们使用另一种方法 [1]。\n\n狗在我们模拟的情况下进行多次尝试反应。如果狗的答案是我们想要的，我们就会给它喂肉。结果，狗现在会以更大的热情以类似的方式行动，希望在进入相同情况时能获得更多的食物奖励。这就像狗如何*通过*奖励体验来学习“做什么”的\
  \ [2]。\n\n![图 3.1 通用强化学习模型的动作-奖励反馈循环](img/fig3_1.jpg)\n\n**图 3.1** 通用强化学习模型的动作-奖励反馈循环。\n\
  \n## 3.2 强化学习算法\n\n\n\n\n\n一种名为强化学习（RL）的机器学习范式使智能体能够与其环境交互，并以顺序做出决策，以最大化累积奖励信号。根据问题、复杂程度以及可用资源，实现强化学习算法有多种方法。强化学习算法可以通过三种方法之一来实现。\n\
  \n### 3.2.1 基于值的算法\n\n基于价值的强化学习算法侧重于确定给定上下文范围内各种状态或状态-动作对的相对重要性。这些算法的主要目标是识别一个价值函数，用于衡量智能体留在特定状态或在该状态下采取特定动作的收益。然后，智能体利用该价值函数来指导决策，使其预期累积奖励最大化。\n\
  \n### 3.2.1.1 Q-Learning\n\n根据智能体的当前状态，Q 学习作为一种无模型、基于值的离线策略（off-policy）技术，将决定最佳行动方案。质量（Quality）由字母“Q”表示。活动对优化潜在收益的意义由其质量指示。基于模型的算法使用转移函数和奖励函数评估最佳策略并构建模型。相反，无模型算法通过经验学习其动作的影响，而不需要转移和奖励函数。基于价值的方法教导价值函数去识别更有价值的状态并采取适当的行动。基于策略的解决方案则显式地指示策略在特定条件下应该做什么。\n\
  \n例如，为了到达目标，机器人必须穿过迷宫。那里有地雷，所以机器人每次只能移动一个方格。踩到地雷的机器人会被摧毁。机器人必须在最短时间内到达位置，如图 3.2\
  \ 所示。\n\n![图 3.2 机器人行驶最短路线并到达目的地。](img/fig3_2.jpg)\n\n图 3.2 机器人行驶最短路线并到达目的地。\n\n\
  奖励和评分的机制如下：机器人每移动一次丢失十分。只要可行，机器人将沿着最短路线旅行到达目的地。如果机器人踩到地雷并丢失 100 分，则游戏失败。如果机器人获得能量，它将获得\
  \ 1 分。如果机器人到达终点，它将获得 100 分。\n\n##### a. Q 表\n\nQ 表是一种直观的查找表，用于计算在每种情况下采取行动所能获得的最大预期未来奖励。简单来说；此图将向我们在每种状态下应该做什么。\n\
  \n图 3.3 展示了每个非边缘方格将存在不同数量的动作。特定状态下的机器人可以向左、右、上或下移动。状态和动作分别由 Q 表的行和列表示，如图 3.4 所示。\n\
  \n![图 3.3 机器人的状态和动作。](img/fig3_3.jpg)\n\n图 3.3 机器人的状态和动作。\n\n![图 3.4 动作的数量。](img/fig3_4.jpg)\n\
  \n图 3.4 动作的数量。\n\nQ 表代表机器人在该点采取的任何动作的最大预期未来奖励。这是一个迭代过程，因为我们必须在每次迭代中改进 Q 表。\n\n#####\
  \ b. Q 函数\n\n状态 `s`和动作 `a`是`Q-function`所需的两个输入，该函数应用了图 3.5 所示的贝尔曼方程。\n\n我们可以使用之前的方法获取表格单元格的\
  \ Q 值。Q 表初始值为零。`Q-function`不断地修改表中的`Q-values`，以给我们提供逐渐越来越准确的近似值。现在让我们检查更新过程。\n\n\
  ##### c. Q 学习算法流程\n\n首先，将构建一个 Q 表。有`n`列，其中`n`代表活动的数量。有`m`行，其中`m`是状态的数量。初始时，所有值将设置为零，如图\
  \ 3.6 所示。\n\n在我们的机器人示例中有四个动作（`a=4`）和五个状态（`s=5`）。因此，将构建一个四列五行的表格。\n\n步骤 2 和 3 是选择并执行活动。\n\
