  # 15 在 Unity 环境中使用强化学习训练 AI 智能体\n\n**Geetika Munjal**^(**1**) **与 Monika Lamba**^(**2**★)\n\
  \n*¹ 印度北方普拉德邦州诺提大学, Noida, Uttar Pradesh*\n*² Northcap 大学, Gurugram, Haryana, 印度*\n\
  \n## 摘要\n本文利用强化学习技术开发了一种能够在虚拟环境中执行任务的智能 AI 智能体。本章旨在演示如何利用机器学习和人工智能方法将 AI 智能体部署到各种场景中，从而有效应对广泛挑战。通过使用\
  \ AI 智能体，消除了为多样化环境中遇到的每个独特问题单独开发智能体的需求。这种方法将 AI 智能体转变为可以经过训练并适应场景的实体，使其能够有效解决每个情况下提出的特定问题。AI\
  \ 智能体的利用增强了动态环境中的韧性和适应性，从而优化资源配置（包括时间、金钱和能量）并促进人类创新。为了实现这一目标，使用的工具包括 `Unity 3D Engine`、`Python`\
  \ 编程语言、`PyTorch` 框架以及 `ML agents`。\n\n**关键词：** 强化学习、AI 智能体、机器学习、人工智能、unity、环境\n\n\
  ## 15.1 引言\n机器学习有一个强化学习的子领域。教会机器学习模型按顺序执行动作或选择路径的技术被称为强化学习。其核心在于教会机器学习模型按顺序执行动作或选择路径。\n\
  \n\n\n\n\n上述工具和资源的整合创建了一个强大的工具包，在各个领域表现出色。`Unity 3D Engine` 以其在游戏开发中的多功能性而闻名，提供了一个直观的界面，并通过其丰富的商店提供了大量的资源集。`Python`\
  \ 是一种被广泛使用且易于阅读的编程语言，以其多功能性和来自大型支持社区的优势脱颖而出。`PyTorch` 以其在机器学习中的动态能力而闻名，增强了该工具包处理复杂数据驱动任务的实力。`ML\
  \ agents` 无缝集成到 `Unity` 环境中，带来了训练智能智能体的能力，进一步扩展了工具包的实用性。这些工具的紧密结合形成了一个具有广泛适用性的多功能基础，将其影响扩展到许多不同的领域。\n\
  \n在游戏开发这一动态变化的领域中，这种综合组合——包括在构建沉浸式体验方面具有多功能性的 `Unity 3D`、具有灵活脚本编写能力的 `Python`、用于动态机器学习的\
  \ `PyTorch` 以及用于智能角色开发的如 `ML agents` 等 AI 智能体——为创建引人入胜且交互性的虚拟世界奠定了基础。同时，这一强大工具包的效用超越了游戏领域，深入了高级机器学习项目的复杂领地。\n\
  \n在机器学习的背景下，`PyTorch` 的动态能力结合 `Python` 的适应性，为研究人员和实践者探索和创新提供了一个稳健的环境。这一全面的基础不仅满足了游戏开发的创意复杂性，还为解决尖端机器学习工作中固有的复杂性提供了坚实的基础。\n\
  \n`Unity 3D` 面向游戏开发和内容创作人员，提供了一个创建 2D、3D、`AR` 和 `VR` 多样体验的平台。`Python` 以其多功能性著名，吸引了广泛的读者，包括程序员、开发者和数据科学家，应用于\
  \ Web 开发、数据科学和人工智能。`PyTorch` 专为机器学习研究人员和实践者定制，其动态框架脱颖而出，特别是在深度学习实验中。如 `ML agents`\
  \ 等无缝嵌入 `Unity` 的 AI 智能体满足了寻求创建智能非玩家角色（NPC）的游戏开发者以及在各种任务中使用机器学习的研究人员的需求，强调了其适应性和学习能力。每种工具都有独特的受众，共同涵盖了游戏开发、通用编程、数据科学和高级机器学习应用，反映了创意和技术追求的多样化格局。\n\
  \n本章描述了如何使用 `Unity 3D` 为各种目标和环境设计并编写规则，开发 AI 智能体并利用强化学习。\n\n## 15.2 文献综述\n\n为了利用代表长期目标的数值性能衡量标准，系统被教授如何使用强化学习范式进行自我管理。`RL`\
  \ 和 `SL` 在根本上是不同的，因为学习者只接收到预测的部分反馈。此外，预测可能会改变受控系统未来的运行方式，从而产生长期影响。通过使用强化学习可以理解学习算法的优缺点。由于它可以解决广泛的现实问题（包括人工智能、运筹学和控制工程领域的问题），`RL`\
  \ 正在获得大量的关注。本章重点关注建立在动态规划稳健概念之上的 `RL` 算法。将列出一份相当全面的学习相关困难清单，定义关键术语，提供大量的前沿算法，并研究每种算法的理论优势和局限性。\n\
  \n泛化概念是深度强化学习中的关键问题 `[21]`。为此，深度 `RL` 的新进展将无疑推动区分显算法的当前趋势，以便将其整合到特定的神经网络并进行端到端训练。结果是算法可能会产生更丰富、更智能的结构，更适合在高层次的抽象上进行推理，使其能够处理比现在更广泛的应用。尽管在时间抽象方面仍需许多工作，但智能结构可以用于分层学习。\n\
  \n深度学习的引入显而易见提高了 `ML` 多个领域的水平，包括目标检测、语音识别和语言翻译等任务 `[3, 6, 10]`。\n\n## 15.3 机器学习\n\
  \n`ML` 主要由 Arthur Samuel 在 1959 年引入。Arthur Samuel 表示，“人工智能^c 赋予了计算机在无需显式编程的情况下进行学习的能力”。因此，`ML`\
  \ 现在可以被指称为使计算机在不接触到显式编程的情况下具有学习能力的研究领域。通过赋予计算机学习的能力（正如该领域的名称所示），机器学习（`ML`）帮助它们变得更像人类。与预期相反，`ML`\
  \ 正被积极地应用于比人们想象多多的语境中。\n\n### 15.3.1 机器学习的分类\n\n可以使用三个大类对 `ML` 实现进行广泛分类（图 15.1）。该分类将根据信号或响应的性质应用于各种学习方法。因此，下面讨论这些分类。\n\
  \n#### 15.3.1.1 监督学习\n\n算法从先获取的验证数据以及与之相关的目标响应（这些可以是字符串标签或数值的形式）中学习，以便在面对类似的新条件时预测出正确的反应。\n\
  \n![图 15.1 不同类型的机器学习技术](img/fig15_1.jpg)\n\n**图 15.1** 不同类型的机器学习技术。\n\n#### 15.3.1.2\
  \ 无监督学习\n\n算法从没有任何随附响应的原始数据中学习，允许算法自行发现数据模式。这些算法的主要目标是重构数据以使其更有价值。\n\n#### 15.3.1.3\
  \ 强化学习\n\n向算法提供没有特定标签的数据，以及根据所需解决方案提供的正面或负面反馈。这一过程主要涉及算法本身负责做决策并对这些选择产生影响的应用。\n\n\
  机器学习不同分类之间的差异如 `表 15.1](#c15.xhtml#tab15_1)` 所示。存在另一种学习形式，虽然尚未被定义或采用，但谁知道未来它可能会变成一个广阔的研究领域。这种学习方法被称为半监督学习。这是在向向算法提供不完整的训练数据的情况下。训练集是不完整的是因为缺少部分目标输出。\n\
  \n### 15.3.2 基于预期输出分类\n\n在考虑系统的预期输出时，为机器学习任务增加另一个标准。\n\n**表 15.1** 监督学习、无监督和强化机器学习的对比。\n\
  \n|  || 强化学习 `[11]` || 监督机器学习 `[9]` || 无监督机器学习 `[10]` |\n\n| --- | --- | --- | ---\
  \ |\n\n\n\n\n\n| 动机 | 学习一系列动作 | 确定结果 | 发现底层规律 |\n| --- | --- | --- | --- |\n| 依据\
  \ | 侧重于与环境交互 | 侧重于通过标记数据进行学习 | 侧重于通过无指导的无标记数据进行学习 |\n| 数据类型 | 无预定义数据 | 有标记 | 无标记数据\
  \ |\n| 监督 | 无 | 额外 | 无 |\n| 示例 | `Q-Learning`, `SARSA` 等 | `SVM`, `KNN`, `logistic\
  \ regression` 等 | `K-means`, `Apriori` 等 |\n| 应用 | 自主驾驶卡片、游戏等 | 销售预测、风险评估等 | 异常检测、推荐系统等\
  \ |\n\n### 15.3.2.1 分类\n\n这是当输入被分为多个标签，且系统必须创建一个模型，将其中一个或多个标签与未知输入关联起来的情况。\n\n###\
  \ 15.3.2.2 回归\n\n这是输出是连续的而非离散的情况。\n\n### 15.3.2.3 聚类\n\n这是将一组输入划分为一组标签的情况。然而，与分类不同，这些标签在处理之前是未知的。\n\
  \n### 15.3.3 人工智能\n\n人工智能是赋予某个事物“智能”特征的过程。人类有必要创建和完善 AI 的原因如下：\n\n* 目标是创建能够向用户教学、建模、解释并提供建议的专家系统。\n\
  * 通过将它们应用于计算机友好的算法，辅助机器以人类相同的方式解决复杂问题。\n\n根据智能的传统定义，一个实体必须具备学习、推理、解决问题、感知和拥有语言智能的能力。然而，为了解决我们最具挑战性的问题，人工智能创造了大量模拟这些能力的工具。其中一些工具是语言、概率推理方法、神经网络、搜索与优化、逻辑、分类器和概率学习方法。自动驾驶汽车、医疗诊断、艺术创作、数学定理证明、搜索引擎引擎、游戏、垃圾邮件过滤、虚拟助手、照片图像识别、司法决策预测以及定向在线广告，都是\
  \ AI 在现实世界应用的示例。\n\n## 15.4 Unity\n\nUnity Technologies 创建了 Unity，这是一个多平台游戏开发引擎。它于\
  \ 2005 年 6 月在苹果公司的 WDC（全球开发者大会）上作为 Mac OS X 专用游戏引擎发布 [3]。然而，随着时间的推移，增加了其他平台的原生支持。目前（自\
  \ 2018 年以来），该引擎已扩展到适用于 Windows、Linux、Android 在内的 25 多个不同平台。在基于 `Unity Engine` 开发项目时，需要注意以下协作工作创建一个极具创造力且功能强大的工作空间的组件：\n\
  \n### 15.4.1 Unity Hub\n\n这是一个独立的程序，简化了查找、下载和处理 `Unity Projects` 以及应用程序的方法。\n\n\
  ### 15.4.2 Unity Editor\n\n它由多个子窗口组成，每个窗口都有不同的用途。最常用的是：`Project Browser`（项目）、`Inspector`（检查器）、`Game\
  \ View`（游戏视图）和 `Hierarchy`（层级面板）。\n\n### 15.4.3 Inspector\n\n它显示每个 `Game Object`\
  \ 的具体细节和修改内容。创建者可以在这里更改值以获得游戏的最佳体验。`Inspector` 显示了附加到对象上的所有组件（例如脚本、`Colliders`、`Sound`\
  \ 和 `Physics`）。\n\n### 15.4.4 Game View\n\n它提供了完整的反馈，帮助开发者测试他们的改进，而无需等待构建并在目标平台上执行他们的项目。\n\
  \n### 15.4.5 Scene View\n\n这是设计游戏的屏幕。规划者能够从构建视图中拖放资产。熟悉的 3D 句柄控制和网格对齐功能允许用户将项目放置在理想位置的像素级精度。\n\
  \n### 15.4.6 Hierarchy\n\n`Hierarchy` 窗口包含了当前场景中所有项目的列表。每当场景中插入一个项目时，此列表就会定期更改。在这个窗口中，开发者将通过将一个对象移动到另一个对象上方来委派父级或子级。这实现了场景内\
  \ `Game Objects` 的嵌套和结构化。\n\n![图 15.2 环境概览](img/fig15_2.jpg)\n\n图 15.2 环境概览。\n\n\
  ![图 15.3 在 unity 中选择对象](img/fig15_3.jpg)\n\n图 15.3 在 unity 中选择对象。\n\n### 15.4.7\
  \ Project Window\n\n`Project` 窗口显示你所有的项目相关文件，它是程序内搜索和定位材料以及其他项目数据的主要方式。\n\n图 15.2\
  \ 和 15.3 分别显示了 Unity 中的环境概览和对象选择。\n\n## 15.5 强化学习与监督学习\n\n有少数参数可以区分强化学习和更常用的监督学习，以便在给定的上下文中能更清晰地理解强化学习的定义\
  \ [4]。下面讨论了这些参数：\n\n* 决策样式：对于 `Reinforcement Learning` 中的决策，过程本身有助于我们做出决策。\n* 作用机制：`Reinforcement\
  \ Learning` 通常的工作范式基于与环境交互的各种方式。另一方面，谈到监督学习，其工作范式基于现有的示例或样本数据。\n* 决策依赖：在 `Reinforcement\
  \ Learning` 的情况下，决策是相互依赖的。因此，理想情况下我们为所有决策标记标签。另一方面，在 `SL` 中，选择是相互独立的，所以理想情况下要为每个决策提供标签。\n\
  * 适用场景：`Reinforcement Learning` 最适合在人机交互盛行的 AI 领域。另一方面，对于监督学习，它最适用于与协作软件运行的情况。\n\
  \n强化学习的一个相关应用示例是制作国际象棋 AI 玩家。监督学习的一个相关用例示例是训练用于目标识别的 AI 代理。\n\n\n\n\n\n此处的“模型”指的是对各种环境动力学进行计算机模拟的表示。换句话说，模型试图确定从当前状态\
  \ `s0` 和动作 `A` 转移到下一个连续状态 `s1` 的概率 `T(s1\\(s0, A)\\)`。如果转移概率被有效学习，那么考虑到当前状态和活动，智能体将确切地知道进入特定状态的概率有多大\
  \ \\[7, 8]。\n\n另一方面，无模型（model-free）算法主要依赖于试错学习来更新其已有的知识。正如此，这些算法不需要额外的存储来容纳动作和状态的所有可能组合。\n\
