  \ | 画面良好 |\n\n## 15.6 模型\n\n此处的“模型”指的是对各种环境动力学进行计算机模拟的表示。换句话说，模型试图确定从当前状态 `s0` 和动作\
  \ `A` 转移到下一个连续状态 `s1` 的概率 `T(s1\\(s0, A)\\)`。如果转移概率被有效学习，那么考虑到当前状态和活动，智能体将确切地知道进入特定状态的概率有多大\
  \ \\[7, 8]。\n\n另一方面，无模型（model-free）算法主要依赖于试错学习来更新其已有的知识。正如此，这些算法不需要额外的存储来容纳动作和状态的所有可能组合。\n\
  \n强化学习的理论比较见表 15.2。表 15.3 描述了虚幻引擎（Unreal Engine）与 Unity 引擎之间的差异。\n\n## 15.6 提议的模型\n\
  \n强化学习是属于机器学习范畴下的众多概念之一。它可以被描述为关于采取合适的动作以在特定环境中获取奖励。强化学习目前正被各种机器和软件用于产生最可能的决策、行为或路径。在\
  \ `SL` 概念中，智能体数据是可以访问的。\n\n如果转移概率被有效学习，那么考虑到当前状态和活动，智能体将确切地知道进入特定状态的概率有多大 \\[7,\
  \ 8]。\n\n### 15.6.1 设置环境\n\nUnity 的集成开发环境（IDE）支持三种编程语言：Boo、C# 和 JavaScript。开发者可以根据喜好使用这些语言中的任何一种。在本章中，我们使用\
  \ C# 应用。\n\n### 15.6.2 为智能体创建目标\n\n目标创建的过程是非常重要的，因为它概述了我们创建的环境的实际目的。目标可以被描述为智能体为了实现其目的而采取的结果或目标。创建目标是一个双管齐下的过程：是在环境中创建模型（可以是区域、对象甚至是点或空间），另一个是编写和分配脚本以告知环境该对象是目标。\n\
  \n### 15.6.3 奖励驱动行为\n\n强化学习的核心是交互。智能体与环境进行交互，并在观察选择结果后根据奖励调整行为。强化学习的一个基本原理基于这种试错学习的范式，该范式源于行为心理学\
  \ \\[10\\]。\n\n通用术语定义如下：\n\n1.  动作 (A)：它是智能体可以采取的所有可能的决策/步骤\n2.  状态 (S)：它是环境中存在的当前状态。\n\
  \n\n\n\n3. **奖励 (Reward I)**：它是环境返回的即时反馈，用于分析之前执行的操作产生的后果。\n\n4. **策略 (Policy (π))**：它是智能体根据当前状态决定下一个动作时遵循的策略。\n\
  \n5. **价值 (Value (V))**：它是预测的长期回报，即总奖励（经过折扣后），与短期奖励 `R` 相比。`Vπ(s)` 可以定义为在策略 `π`\
  \ 下当前状态的预测长期回报。\n\n6. **Q 值 (Q-value)**：Q 值，也称为动作值，与`价值 (Value)` 相似，但不同之处它考虑了一个额外的参数，即当前动作\
  \ `a`。`Qπ(s, a)` 指的是在策略 `π` 下采取动作 `a` 后当前状态 `s` 的长期回报。\n\n## 15.7 马尔可夫决策过程\n\n强化学习可以形式化为马尔可夫决策过程\
  \ (MDP)，它包含：\n\n* “`S` 是状态的集合，加上 `p` 是初始状态 `(s0)` 的分布”\n* “一系列动作 `A`。”\n* “`T(st+1|st,at)`\
  \ 转移动力学，将 `t` 时刻的状态-动作对映射到 `t+1` 时刻的状态分布。”\n* “`R(st, at, st +1)` 是即时/瞬时奖励函数。”\n\
  * “一个折扣因子 `γ` ∈ `[0,1]`，值越小越强调快速奖励 [11]。”\n\n## 15.8 基于模型的强化学习\n\n在谈论基于模型的强化学习时，众所周知表达转移动力学\
  \ `p(st+1|st, at)` 会让事情变得方便。模型就是这些动力学所在。基于模型的方法是研究转移动力学的算法，这些动力学决定了在当前状态 `s(t)`\
  \ 执行给定动作后将是哪个状态。当这种情况发生时，方法将决定如何选择动作。坦率地说，这类算法研究系统动力学模型，并利用最优控制来选择动作。从最优控制的研究中，基于模型的强化学习应运而出。通常，使用`高斯过程\
  \ (Gaussian process)` 和`贝叶斯网络 (Bayesian network)` 等模型构建特定问题，然后使用机器学习技术或最优控制技术求解，例如`模型预测控制\
  \ (MPC)`、`线性二次调节器 (LQR)` 和`线性二次高斯控制` [12]。\n\n## 15.9 实验结果\n\n该项目的最终结果是一个综合且完整的应用程序，它可以在不同配置和规格的系统上独立运行。应用程序主要由两个环境组成，我们可以实时访问并观察它们。\n\
  \n这两个环境各自分独立地具有两种用户访问的模式：\n\n* 第一种是本项目的重点，即观察一个训练过的 AI 智能体在行动，重复完成我们为它设定的目标。\n*\
  \ 第二种是让用户代入智能体，亲眼看到它的行为。\n\n\n\n\n玩家控制模式的环境要小得多，仅包含一个区域，且每当玩家完成目标时该区域就会重置。此区域与用于训练我们智能体的其他区域完全相同。相机直接放置在玩家`Agent`上，目标块位于该处，然后将其推入如图\
  \ 15.14 所示的绿色区域内。\n\n### 15.9.5 走廊环境截图\n\n让我们快速查看一下区域的可移动空间。绿色区域代表目标区域区域，而可以移动的区域是智能体和目标块生成的地方。它被深灰色区域中的浅灰色墙包围（如图\
  \ 15.15 所示）。\n\n这里的蓝色样式化立方体代表我们的智能体或玩家立方体，它的任务是观察白色立方体上的图像（该图像代表我们的目标图像，`O`或`X`），记住它，然后向两个绿色区域之一移动，该区域是对应于图\
  \ 15.16 所示图像的目标区域。\n\n![Figure 15.14 Screenshot of the player-controlled PushBlock.](img/fig15_14.jpg)\n\
  \nFigure 15.14 玩家控制的推块截图。\n\n![Figure 15.15 Overview of the hallway environment.](img/fig15_15.jpg)\n\
  \nFigure 15.15 走廊环境概览。\n\n存在 16 个这样的区域，整齐地排列在 8×2 的网格中，每个区域包含（如图 15.17 所示）：\n\n\
  *   灰色区域（可移动区域）\n*   2 个绿色区域（目标区域）\n*   蓝色立方体（智能体或玩家）\n*   白色立方体（目标图像显示器）\n\n![Figure\
  \ 15.16 Screenshot of the agent and the target images.](img/fig15_16.jpg)\n\nFigure\
  \ 15.16 智能体和目标图像截图。\n\n![Figure 15.17 Overview of training the agent in multiple\
  \ scenarios.](img/fig15_17.jpg)\n\nFigure 15.17 在多种场景下训练智能体的概览。\n\n这样做是为了对我们运行的模拟提供更准确、更精确的描述，以便我们获得可能场景的整体视图。同时运行多个场景还能让\
  \ AI 智能体更加健壮，从而增加其成功完成给定任务的机会。\n\n玩家控制模式的环境要小得多，仅包含一个区域，每当玩家完成目标时该区域就会重置。此区域与我们用于训练智能体的其他区域完全相同。相机直接放置在玩家智能体上，从那里观察给定图像并向正确答案导航，即正确的图像显示如图\
  \ 15.18 所示。\n\n![Figure 15.18 Screenshot of the player-controlled hallway.](img/fig15_18.jpg)\n\
  \nFigure 15.18 玩家控制的走廊截图。\n\n### 15.10 结论\n\n借助 `Python`、`PyTorch` 和 `Unity Engine`，建议的模型旨在创建一个智能体，该智能体可以通过强化学习被训练以在\
  \ `3D` 环境中执行任务。卫生、生物医学、农业和其他应用领域将从这种能够在各种条件下以很少或无输入导航并执行活动的智能体中大大获益。分配给智能体的任务将得到成功完成，人类的工作量将显著减少。这种技术在全球范围内各行业可能有无数种用途。世界受益于这项研究，而且提高生活水平迫切需要它。其优势是突破性的，但这项研究仍处于非常幼的阶段，在现实世界实现此类内容之前还需要更多工作。该项目作为对现实世界将发生事情的介绍：人工智能将变得更加强大，接管琐事任务，并以人类所希望的更高效的方式执行它们。\n\
