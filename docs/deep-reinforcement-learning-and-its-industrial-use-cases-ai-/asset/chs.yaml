  \ (11.2)\n\n对二维高斯函数进行采样以获取高斯核系数。其中分布的标准差为 `σ`。假设分布的均值为 `0`。为了将连续的高斯函数保存为离散像素，必须初始对它们进行离散化处理。二维分布通过高斯滤波器实现为点扩散函数以运行。通过将图像与二维高斯分布函数卷积可以实现这一目标。高斯函数必须经过离散近似。这可能需要使用无限大的卷积核，因为高斯分布并非处处为零。\n\
  \n光线不佳且含有大量噪声的图像可以通过高斯模糊来减少这些噪声。高斯滤波器是一种非均匀低通滤波器。随着远离内核中心，内核系数会逐渐减小。中心像素的权重比外部像素更大。较大的值产生更宽的峰值（更明显的模糊）。在滤波后的图像阈值中，可以看到分割圆盘区域。使用灰色阈值来去除背景。\n\
  \n当血糖水平失衡时，视网膜中的血管发生病变性改变，会导致糖尿病视网膜病变。血管扩张并完全充满液体。在视网膜外部，在许多情况下可能会出现异常血管。使用正常和灰色级别图像的平均值作为阈值处理的基础。\n\
