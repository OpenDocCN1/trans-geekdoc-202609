  \ (11.1)\n\n当分布的标准差为 σ 时。这预测了分布的均值为零。在处理照片时，他们必须使用二维高斯函数。该方程仅仅是两个 1D（一维）高斯函数的联合，对应每一个可能的方向。\n\
