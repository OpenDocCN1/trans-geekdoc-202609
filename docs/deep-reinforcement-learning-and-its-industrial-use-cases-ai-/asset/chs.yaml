  \ | **0.37** | 99.03 | 0.35 | **0.82** |\n| MC | 0.96 | 1.21 | 78.45 | 1.61 | 2.89\
  \ |\n| CNS | 0.92 | 2.00 | 73.45 | 3.92 | 4.68 |\n\n`RL-MLZerD` [17]——这种创新方法采用 RL\
  \ 来构建多个蛋白复合物，解决了难以捕捉的四级结构挑战。`RL-MLZerD` 将多链复合物的组装视为一个阶段（episode），利用 RL 选择并整合成对对接模型。它通过分析\
  \ `RL` 路径在预测组装顺序方面表现出色。`RL-MLZerD` 展示了卓越的性能，对于具有三到五链的蛋白复合物，其表现优于现有方法（但在 `AlphaFold-Multimer`\
  \ 优的未结合对接中除外）。它能高效地识别正确的对接姿态，结合和未结合对接的平均 `RMSD` 分别达到 2.50 Å 和 6.30 Å，超过了 `CombDock`\
  \ [18] 和 `Multi-LZerD` [19]。在结合案例中，它的性能优于 `ColabFold` [20] 并与 `AlphaFold-Multimer`\
  \ 竞争。`RL-MLZerD` 采用了一种独特的两步流程：使用 `LZerD` 生成成对诱饵，根据 `C`[`*α*]` `RMSD` 对其进行聚类，并使用\
  \ `GOAP` [21]、`DFIRE` [22] 和 `ITScorePro` [23] 进行排名。基于 `RL` 的多次对接是在每个亚基单元对中排名最高的诱饵构成的池中进行的。\n\
  \n### 9.2.3 蛋白-配体结合\n\n在构建高效的 `RL` 方法时存在更大的复杂性，因为采样和评分都需要诸如蛋白-配体对接，而不仅仅是使用深度学习来分别处理这两个方面。目前极少有基于\
  \ `RL` 的 `DL` 模型用于蛋白-配体对接姿态预测 [24]，许多 `DRL` 研究侧重于离子位置预测。基于 `DRL` 的开发方法使用的刚性对接方法会将配体随机放置在远离蛋白的位置。在\
  \ `DRL` 框架中有两个模型：使用两个模型来评估预测结合位点的充分性：i) 参与者模型（actor model），结构为 `ProDCoNN`（使用卷积神经网络进行蛋白设计）[25]；ii)\
  \ 评价者模型（critic model），其架构与参与者模型相似 [26]。该工作侧重于为单原子和小多原子配体创建特异性模型，研究了使用 `RL` 解决蛋白-配体对接问题的可行性。这些模型在基于结构的药物开发过程中可能会有所帮助。为了进一步增强模型的稳健性和性能，建议使用来自额外来源（如\
  \ `Binding MOAD`，所有数据库之母）的更广泛的数据集来训练模型 [27]。\n\n在构建一个处理蛋白-配体对接的高效 `RL` 方法时，采样和评分都需要被考虑，而不仅仅是使用深度学习来分别处理这两个方面。目前极少有基于\
