  ]></mo></mrow></math>\n\n这一阶段可以通过采用迭代策略评估或求解控制价值函数的线性方程来完成。\n\n### 策略改进\n改进阶段的目标是在接收到针对当前策略的的操作后，通过在每个状态内选择增强的动作来提升策略。改进后的策略通过选择在每个状态下增加预期总和的策略来产生。在所有情况下，表达式为\
  \ `s = argmax[T(m, b, m')(R(m, b, m') + V(m')]`。\n\n### 策略迭代\n策略评估和策略开发步骤构成了策略迭代方法，该方法不断迭代直到收敛。可以使用以下基本步骤分解该算法：\n\
  \n步骤 1：初始化随机策略。\n步骤 2：策略分析：对于当前策略，必须计算价值函数 `V(m)`。\n步骤 3：策略开发：通过选择增加每个状态预期收益的策略来更新策略。\n\
  步骤 4：持续迭代，直到策略稳定且不再对策略进行任何修改。\n步骤 5：智能体可以使用此策略最大化其累积奖励，直到策略达到收敛点，此时它即为最佳策略。在理解环境动力学（`T`\
  \ 和 `R`）的情况下，策略迭代保证了马尔可夫决策过程（MDP）的理想策略及相应的价值函数。然而，在移动区域类似于价值迭代的情况下，它可能涉及计算成本。\n\n\
  ### Q-learning\n智能体不需要显式地理解环境的动力学即可在该环境中获取最佳策略。这种被称为 Q-learning 的无模型学习方法被用于实现成功。Q-learning\
  \ 的核心思想是构建动作价值操作，缩写为 `Q(m, b)`，它展示了参与者在状态 `m` 下执行动作 `b` 然后追求最有利的动作时可以获得的预期奖励。以下是关于定性学习技术的一些通用描述。\n\
  \n#### Q 值更新\nQ-learning 涉及改变与状态-动作组合相关的标量值，同时考虑所获得的奖励以及连续状态-动作组合产生的 Q 值。这种更新 Q\
  \ 值的过程使用了贝尔曼公式：\n\n![upper Q left-parenthesis m comma b right-parenthesis equals\
  \ upper Q left-parenthesis m comma b right-parenthesis plus asterisk left-bracket\
  \ R left-parenthesis m comma b m Superscript Baseline right-parenthesis plus bracket\
  \ upper Q left-parenthesis prime comma b Superscript Baseline right-parenthesis\
  \ minus upper Q left-parenthesis m comma b right-parenthesis) bracket](img/equ8_156_1.png)<math\
  \ display=\"inline\"><mi>Q</mi><mo stretchy=\"false\">(</mo><mi>m</mi><mo>,</mo><mi>b</mi><mo\
  \ stretchy=\"false\">)</mo><mo>=</mo><mi>Q</mi><mo stretchy=\"false\">(</mo><mi>m</mi><mo>,</mo><mi>b</mi><mo\
  \ stretchy=\"false\">)</mo><mo>+</mo><mo>&#x22C6;</mo><mi>max</mi><mrow><mo>\\[</mo><mrow><mi>R</mi><mo\
  \ stretchy=\"false\">(</mo><mi>m</mi><mo>,</mo><mi>b</mi><mo>,</mo><mi>m'</mi><mo>&#x2032;</mo></msup></mo></mo>+</mo><mo>&#x22C6;</mo><mi>Q</mi><mo\
  \ stretchy=\"false\">(</mo><mi>m'</mi><mo>,</mo><mi>b</mi><mo>&#x2032;</mo></msup></mo></mo></mo></mo></math></math\n\
  \n该方程的元素是当前状态 `m`、在该状态内选择的动作以及结果状态 `m’`。`R(m, b, m')` 代表了瞬时收益，而学习率（一个较小的正值）调节了输入信息的影响。此外，折扣因子被赋予了一个较大的正值。\n\
  \n### 探索与利用\n为了确保智能体彻底检查环境以追求最佳行动方案，Q-learning 在探索与利用之间取得了平衡。该算法利用诸如 `ε-greedy 策略`\
  \ 的探索技术，以 `ε` 的概率随机选择动作，而选择具有最大 Q 值选项的概率为 `1-ε`。\n\n### Q-learning 算法\n作为一种离策略（off-policy）技术，Q-learning\
  \ 算法可以在不受所应用策略的限制的情况下学习最佳 Q 值。以下列表总结了 Q-learning 算法的关键步骤：\n\n步骤 1：Q 值函数 `Q(s, a)`\
  \ 中的所有状态-动作对都应赋予任意初始值。\n步骤 2：继续执行以下操作，直到收敛或达到预定的回合数：\n1. 注意当前状态。\n2. 使用探索技术（如 `ε-greedy`）根据\
  \ Q 值选择动作 `(a)`。\n3. 在环境中执行步骤 `(a)`。\n4. 注意结果 `(R)` 和后续状态 `(s')`。\n5. 更新 Q 值方程以反映当前状态-动作对。\n\
  6. 将当前状态 `(s)` 替换为后续状态 `(s')`。\n步骤 3：使用 Q 值创建最佳策略 `π(s)`，当 Q 值函数收敛或智能体获得学习经验后，该策略会在每个具有最佳\
  \ Q 值的位置选择行动方案。\n\n\n\n\n\n![upper Q left-parenthesis m comma b right-parenthesis\
  \ equals upper Q left-parenthesis m comma b right-parenthesis plus alpha Superscript\
