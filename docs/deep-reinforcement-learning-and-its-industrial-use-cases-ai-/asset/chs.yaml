  \ 7.8 倍，证明了其在不同学术、工业和临床蛋白质设计中的潜力。\n\n该技术对从低适应度池中选择的五个初始序列每个进行了五次实验。最高分加粗显示，最大值是这五次重复的平均累计最大值。均值也通过对`TAPE`先验检查的五次重复产生的前\
