  \ stretchy=\"false\">)</mo><mo>+</mo><msup><mi>&#x03B1;</mi><mo>&#x22C6;</mo></msup><mrow><mo>\\\
  </mo><mrow><mi>R</mi><mrow><mo>(</mo><mrow><mi>m</mi><mo>,</mo><mi>b</mi><mo>mo><msup><mi>m</mi><mo>&#x2032;</mo></msup></mrow><mo>)</mo></mrow><mo>+</mo><msup><mi>&#x03B3;</mi><mo>&#x22C6;</mo></msup><mi>Q</mi><mrow><mo>(</mo><mrow><msup><mi>m</mi><mo>&#x2032;</mo></msup><mo>,</mo><msup><mi>b</mi><mo>&#x2032;</mo></msup></mrow><mo)</mo></mrow><mo>&#x2212</mo><mi>Q</mi><mo\
  \ stretchy=\"false\">(</mo><mi>m</mi><mo>,</mo><mi>b</mi>\n\n构成以下公式的组成部分：`formula`\
  \ 是当前状态；`b` 是当前状态下采取的动作；`m` 是采取动作后获得的状态；`b’` 是基于现有策略选择的后续动作。获得的即时激励由 `R(m, b, m′)`\
  \ 表示，以及学习率和折扣因子。\n\n## 2. 探索与利用\nSARSA 以一种与 Q-learning 可的方式结合了探索与利用的权衡。该代理采用被称为“$\\\
  epsilon$-greedy 策略”的策略，以固定频率（`e`）随机分配操作，然后选择 Q 值最大的事件，预期结果为 `(1- e)`。\n\n## 3. SARSA\
  \ 算法\nSARSA 算法的关键步骤如下：\n\n#### 步骤 1\n对于每个状态-动作组合，随机初始化 Q 值函数 `Q(m, b)`。\n\n####\
  \ 步骤 2\n持续执行这些动作直到收敛或达到预定的次数：\n1. 记录现有状态 (`m`)。\n2. 考虑当前的 Q 值，使用探索策略（如 `e-greedy`）选择要采取的路线\
  \ (`b`)。\n3. 在环境中执行动作 (`b`)。\n4. 密切关注结果 (`m′`) 和奖励 (`R`)。\n5. 使用当前的 Q 值，利用当前策略（如\
  \ `e-greedy` 方法）决定下一个动作 (`b′`)。\n6. SARSA Q 值修改公式允许对该特定状态-动作对的 Q 值进行修改。\n7. 当从之前的情况转移到后续情况时，更新当前状态。\n\
  \n#### 步骤 3\n当 Q 值函数收敛或参与者通过预定义的片段积累了足够的经验时，使用 Q 值来构建理想策略，标记为 `π⋆(s)`，它在每情况下都选择\
  \ Q 值最高的程序。\n\n当学习代理的策略需要频繁更改时，SARSA 作为一种同策略（on-policy）技术非常有用 [[6]。然而，在某些情况下，它的收敛速度比\
  \ Q-learning 慢，并且对探索率 (`ε`) 敏感。\n\n## 5) 深度 Q 网络 (DQN)\n深度 Q 网络 (DQN) 通过将大型神经网络与\
  \ Q-learning 策略融合，提出了一种革命性的强化学习技术。DQN 由 DeepMind 引入。在处理巨大且连续的空间时，传统的 Q-learning\
  \ 存在严重问题，而 DQN 试图解决这些问题。\n\n### Q 值函数近似\n在传统的 Q-learning 中，利用 Q 表存储 Q 值。然而，对于海量或连续的位置，这种策略是不可行的。DQN\
  \ 使用神经系统进行近似。\n\n### 经验回放\nDQN 采用被称为“经验回放”的方法来增加一致性。代理通过交互收集元组 `(state, action,\
  \ reward, next state)` 的经验。此类事件记录在回放记忆中 [7]。通过播放缓冲，打破了后续事件之间的关联。\n\n### 目标网络\n虽然此目标系统中使用的权重与\
  \ Q 网络中的权重相同，但它们是固定的。在整个训练阶段，目标网络的权重会定期进行调整。这种策略不仅让学习过程更加稳定，还减少了 Q-learning 经常面临的“移动目标”问题。\n\
  \n### 损失函数和梯度下降\nDQN 中使用的损失参数是均方误差 (MSE) 损失，它是由 Q 网络生成的预测 Q 值与从目标网络接收的预期 Q 值计算出的。然后，在网络训练期间进行下降优化以尽可能地减少这种损失。\n\
  \n### 探索与利用\n在训练的初期，DQN 仍然需要一种搜索方法来有效处理发现与提取之间的关系。广泛使用的策略被称为 epsilon-greedy 过程，其中代理以\
  \ `ε` 的预期结果随机选择任意响应，并以 `(1-ε)` 的概率交替选择路线。\n\n## 6) 渐进策略演员-评论家\n一种用于强化学习的被称为演员-评论家（actor-critic）技术的神经网络结合了价值驱动和基于策略策略的优点。评论家（critic）负责估计与所获策略相关的价值函数（即预期的累积奖励），演员（actor）负责学习策略（即将想法转化为动作），它们构成了各种策略的关键组成部分。\n\
  \n\n\n\n\n## 1. 基于策略和价值的学习\n策略通过基于策略的方法直接学习，其目标是最大化给定条件下预测的累积收益。为了更新策略参数，它们经常采用策略梯度（policy\
  \ gradients）等策略。在以如 `Q-education` 和 `DNs` 为核心的价值方法中，价值乘积 `V(m)` 或动作值关系 `Q(m, b)`\
  \ 是近似值，随后根据这些近似值形成规则（例如使用贪婪技术）。\n\n## 2. 演员（Actor）\n正如在 actor-critic（演员-评论家）中，学习规则是\
  \ actor 的责任。动作的概率分布是以世界状态为起点生成的。从规则表示的实现上通常以具有可编程参数的神经网络的形式出现。actor 想要最大化期望累积奖励；因此，它使用梯度上升法根据已收到的奖励来修改其参数。\n\
  \n## 3. 评论家（Critic）\n在 actor-critic 框架中使用的价值函数是根据当前策略定义的特定状态相关的预测累积奖励的投影。作为输入，critic\
  \ 会生成一个对当前情况的估算值 [9]。这通常通过使用另一个具有可编程设置的神经网络来实现，该网络作为价值函数的表示。critic 的主要目标是减少训练期间获得的实际激励与预测值之间的平均方差。\n\
  \n## 4. 优势函数（Advantage function）\n优势函数是 actor-critic 方法的一个重要部分，它提供了一个衡量活动相对于标准动作路径改进或下降程度的指标。该函数是由于状态效用方程与动作效用方程之间的差异而被发现的。\n\
  \n![Benefits left-parenthesis m comma b right-parenthesis equals upper Q left-parenthesis\
  \ m comma b right-parenthesis minus upper V left-parenthesis m right-parenthesis](img/equ8_160_1.png)<math\
  \ display=\"inline\"><mtext>&#x00A0;Benefits&#x00A0;</mtext><mo stretchy=\"false\"\
  >(</mo><mi>m</mi><mo>,</mo><mi>b</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>Q</mi><mo\
  \ stretchy=\"false\">(</mo><mi>m</mi><mo>,</mo><mi>b</mi><mo stretchy=\"false\"\
  >)</mo><mo>&#x2212;</mo><mi>V</mi><mo stretchy=\"false\">(</mo><mi>m</mi><mo stretchy=\"\
  false\">)</mo></math> \n\n优势函数计算了与 actor 更新的主要方向源相关的利润程度，这是发生在定义阶段内的一种行为。\n\n##\
  \ 5. Actor-critic 算法\n构成 actor-critic 算法的基本步骤描述如下：\n\n- 步骤 1：为 actor 和 critic 神经网络分配随机权重。\n\
  - 步骤 2：与环境交互，收集经验并确定奖励。\n- 步骤 3：同时使用奖励和 critic 的近似值计算优势函数。\n- 步骤 4：通过减少奖励真实价值与期望值之间的平均平方差来更新\
  \ critic 网络。\n- 步骤 5：使用优势函数来指导在预测总奖励上进行梯度上升，以改变 actor 网络。\n- 步骤 6：继续执行步骤 2 到 5，直到收敛或达到预定的回合数。\n\
  \n特别是，由于 actor-critic 方法能够熟练地权衡勘探和提取资源的益处，它们在涉及连续动作空间和高维状态空间的场景中非常有帮助。\n\n## 7.\
  \ 近端策略优化（PPO）\n强化学习（RL）策略优化的最新技术方法是近端策略优化（PPO）。由于 PPO 的易用性、稳定性以及在挑战性情况下训练深度神经网络规则的效率，OpenAI\
  \ 的研究人员于 2017 首次引入了它 [10]。特别是由于它们能够巧妙地权衡勘探和提取资源的益处，actor-critic 方法在涉及连续动作空间和高维状态空间的场景中非常有帮助。\n\
  \n### 7.1 策略梯度\n基于预测累积奖励，这些算法通过梯度上升调整策略，并在连续动作空间中表现良好。\n\n### 7.2 替代目标函数（Surrogate\
  \ function）\nPPO 的基本概念是使用替代目标函数。裁剪（clipping）确保策略更新不会偏离原始策略太远。\n\n### 7.3 近端策略优化目标（PPO）\n\
  近端策略优化目标可以如下描述，用于每个数据阶段：\n\n（公式所示）\n\nPPO 目标函数包含优势函数 `N(theta)`，其中 `theta` 代表策略参数，`r(theta)`\
  \ 表示新旧策略在特定状态下动作的概率比，而 `A` 表示观测活动的优越程度。控制裁剪机制的超参数也是 `N(theta)`，它代表 PPO 目标函数。\n\n\
  ### 7.4 裁剪替代目标（Clipped surrogate objective）\nPPO 目标函数的裁剪操作确保策略更新限制在一个范围内。它防止策略发生剧烈变化，从而保持稳定的学习过程。\n\
  \n\n\n\n\n# 8) 深度确定性策略梯度（DDPG）的梯度计算\n\n深度确定性策略梯度（DDPG）是一种离线策略序贯决策制定技术，它通过深化深度 Q\
  \ 网络（DQN）的思想，有效地调节了连续动作空间。DDPG 由 Google DeepMind 的研究人员在 2016 年的论文中提出，已广泛应用于各种连续控制领域，包括机器人控制、自动运输和无人机导航。通过将演员-评论家（actor-critic）技术与深度神经网络的优势相结合，DDPG\
  \ 擅长近似每个动作值系统和规则 [12]。深度确定性策略梯度算法的工作原理详见下文。\n\n1. **Actor-critic 架构**：DDPG 采用由两个神经网络组成的\
  \ actor-critic 架构。\n2. **Actor 网络**：Actor 网络使用当前状态作为输入生成连续动作值。其目标是创建一个确定性策略，该策略可以将状态转换为匹配的动作，并适用于连续动作空间。\n\
  3. **Critic 网络**：Critic 网络使用当前条件和相关动作作为参数，近似动作值函数 `Q(s, a)`（代表在状态“s”中执行动作“a”的预期累计奖励）。\n\
  4. **离线策略学习（Off-policy learning）**：DDPG 是一种对比算法，这意味着它维护一个单独的目标策略（更新频率较低的 actor 策略），并从使用不同策略（通常是探索策略）收集的经验中学习。这种非传统策略提高了样本效率并保持了学习过程的稳定。\n\
  5. **回放缓冲区（Replay buffer）**：在回放缓冲区中，DDPG 类似于 DQN 保存了经验。智能体在内存中保留这些事件。它们在与环境交互期间以元组形式收集（state,\
  \ action,状态）。训练期间随机抽取经验的小批量样本以关联相似经验并减少偏差。\n6. **目标网络**：DDPG 使用 actor 和 critic 目标网络提高了学习的稳定性。这些目标网络的更新频率与核心网络一样较低。参与者的目标系统开发目标动作，而\
  \ critic 目标网络在训练期间投影目标 Q 值 [13]。目标网络的权重通常通过与主网络对象的插值来更新，这有助于稳定教学阶段。\n7. **搜索技术**：DDPG\
  \ 使用通常添加到 actor 输出的辅助噪声来高效地探索动作空间。为了促进探索并保持动作空间的平滑，它经常用于引入 Ornstein-Uhlenbeck 噪声。\n\
  8. **DDPG 算法**：DDPG 算法由几个关键步骤组成：\n\n- **步骤 1**：用随机权重初始化 actor、critic 以及对应的目标网络。\n\
  - **步骤 2**：与环境交互，收集经验，然后将其存储在回放缓冲区中。\n- **步骤 3**：每次从回放缓冲区中取出几次交互数据。\n- **步骤 4**：利用均方误差损失（通过从\
  \ critic 目标网络获取的目标 Q 值计算得出）更新 critic 网络。\n- **步骤 5**：利用 critic 网络对 actor 设置的梯度来更改\
  \ actor 网络。通过此过程，鼓励 actor 采取能够最大化估计 Q 值的动作。\n- **步骤 6**：通过定期将目标网络的权重插值到主网络的权重中，来更新目标网络。\n\
  - **步骤 7**：在达到收敛或预设回合数之前，根据需要重复步骤 2 到 6。\n\nDDPG 已成功应用于许多需要精确控制的困难任务，并被证明在连续动作空间中特别有效\
  \ [14]。DDPG 的 actor-critic 设计与离线策略学习的结合在处理连续控制问题时具有显著优势，因为它使用了记录循环并结合了目标网络。\n\n\
  # 9) 置信区域策略优化（TRPO）\n\n置信区域策略优化（TRPO）是强化学习（RL）中一种广受欢迎的策略优化方法。它由 OpenAI 的人员在 2015\
  \ 年作为近端策略优化（PPO）方法的改进而引入。TRPO 解决了传统策略梯度方法的缺点，例如它们对策略更新步长的敏感性以及对复杂超参数调优的需求。通过维护一个置信区域，TRPO\
  \ 提供了一种有原则的策略更新方法，确保更新在最大化预期累计收益的同时，尽可能贴近当前策略。以下是置信区域策略优化算法的概述。\n\n1. **使用策略梯度的方法**：策略梯度方法通过建立状态与动作之间的关系来直接最大化预测的累计奖励。预期的奖励结果（通常使用蒙特卡洛采样或自助法计算）用于指导这些系统中的梯度上升过程，以理解规则。\n\
  2. **置信区域策略优化**：置信区域策略优化（TRPO）的主要目标是在留在置信区域的同时更新现有策略。由于它们保证了新策略与旧策略保持相当相似，TRPO 的策略更新限制使得学习过程更加稳定并增加了样本效率。\n\
  3. **目标函数**：TRPO 的目标函数是基于新策略的预测回报（或预测的累计奖励），该函数受近期策略与当前策略之间最大 KL 散度的约束。在比较两个策略的概率分布时，使用\
  \ KL 散度来维持置信区域标准。\n4. **代理目标（Surrogate objective）**：TRPO 利用代理目标函数来处理 KL 散度的限制。该函数在近似原始目标的同时，确保策略更新留在置信区域内。利用共轭梯度法等优化方法可以获得代理目标。\n\
  5. **线性搜索（Line search）**：在利用替代目标计算策略更新后，TRPO 执行路径查询，以确定在保持置信区域内最大化预期累计奖励的理想步长 [15]。线性搜索有助于确保策略调整是合理的且不会显著损害性能。\n\
  6. **TRPO 算法**：置信区域策略优化方法的初始阶段如下：\n\n- **步骤 1**：随机初始化策略参数。\n- **步骤 2**：与世界交互，收集经验并确定奖励。\n\
  - **步骤 3**：使用蒙特卡洛采样或自助法计算每个状态-动作对的预期回报（预期累计奖励）。\n- **步骤 4**：计算代理目标并在留在置信区域内更新策略。\n\
  - **步骤 5**：使用线性搜索确定策略更新的最佳步长。\n- **步骤 6**：无限重复步骤 2 到 5 直直到收敛。\n\n\n\n\nTRPO 特别适用于高维动作空间的设置，并在多种强化学习（RL）任务中展示了令人鼓舞的结果。然而，对线性搜索的需求以及有限优化问题的解决可能会导致计算开销高昂。因此，TRPO\
  \ 得到了改进以提供更有效的算法，例如近端策略优化（PPO），它在保持置信区域优化原则的同时，对大规模强化学习任务更具实用。\n\n## 8.2 强化学习基础\n\
  \n### 8.2.1 深度学习的定义\n为了使用监督或无监督方法获取数据表示，机器学习中一种被称为深度学习的方法利用了人工神经网络，特别是深度神经网络。为了让神经网络能够获取结构化的信息表示，它们需要包含许多层，因此有了深度学习中的“深”这一词。\n\
  \n### 8.2.2 深度学习的要素\n深度学习是机器学习的一个子领域，使用人工神经网络来建模和解决复杂问题。以下列表包含了深度学习的核心要素：\n\n构成深度学习基本骨架的神经网络由人工神经网络组成。它们模仿人类脑中生物神经元的组织和运行方式。人工神经网络通过分层和连接人工神经元来构建\
  \ [16]。层中的每个人工神经元对其输入进行快速计算，然后将结果传递给下一层。为了从数据中派导出有意义的表示，在训练过程中，轴关系的能力会被修改。\n\n*\
  \   **层 (Layers)**：包含若干层的神经网络负责输入数据的处理和转换。典型的深度学习模型中层主要有三类。\n*   **数据输入层 (Data input\
  \ layer)**：在此层首先接收数据。\n*   **隐藏层 (Hidden layers)**：复杂特征和表示的学习通过中间层完成，这些层位于输入和输出层之间。\n\
  *   **输出层 (Output layer)**：输出层最后一最后一，负责产生模型的预测。\n*   **激活函数 (Activation functions)**：为了让神经网络能够识别复杂的数据模式和相关性，激活函数为系统增加了非线性。线性整流单元\
  \ (`ReLU`)、`sigmoid`、`tanh` 和 `softmax`（用于分类）是典型的激活函数。\n*   **损失函数 (Loss functions)**：使用损失函数计算目标输出的实际值与期望值之间的差距，有时被称为代价函数或目标函数。随着网络在整个训练过程中更新参数，它起到了指导作用。根据具体的任务，`cross-entropy`\
  \ 或均方误差 (`MSE`) 分别可用于分类或回归。\n*   **优化算法 (Optimization algorithms)**：通过优化方法修改神经网络的权重和偏置，训练深度学习模型以最小化减小的值。深度学习中一种常见的优化策略是\
  \ `gradient descent` 及其变体，如 `stochastic gradient descent` 和 `Adam`。\n*   **反向传播\
  \ (Backpropagation)**：训练深度神经网络需要使用反向传播技术。通过优化过程，为了修改模型的设置，它生成损失值相对于这些特征的斜率。\n* \
  \  **正则化 (Regularization)**：如果模型在初始信息上表现良好，在新信息上表现不佳，则被认为过拟合。使用正则化方法可以避免未知信息 [17]。`L1`\
  \ 和 `L2` 正则化、`dropout` 和批量归一化（batch normalization）是典型的深度学习正则化技术。\n\n#### 8.2.2.1\
  \ 不同类型的深度学习网络\n\n**a) 前馈神经网络 (FNN)**：深度学习网络的基础架构体现了前馈神经网络 (`FNN`)，也称为多层感知器 (`MLP`)。它是一种特殊的人工神经网络，其中节点（神经元）之间的连接形成有向无环图，这意味着数据只向一个方向流动——从输入到输出——而不涉及任何循环或反馈连接。在多个隐藏层的帮助下，网络学习将输入数据映射到相应的期望输出，用于分类和回归等监督学习任务。\n\
  \n下面更详细地描述了神经网络的前馈框架：\n\n*   **输入层 (Input layer)**：进入系统的数据由数据输入层中的突触表示。由于每个神经元对应于输入数据中的一个特征，因此输入层的维度影响了存在神经元的数量。\n\
  *   **隐藏层 (Hidden layers)**：输入层和输出层之间的隐藏层数量可能从一个到多个不等。每个隐藏层中存在许多单元（或互连接的神经元），这些单元与前一层和后层的神经元形成连接。这些连接具有在训练期间发现的相关偏置和权重。\n\
  *   **激活函数 (Activation functions)**：隐藏层内部利用激活技术为系统引入不规则性，通过将这些函数应用于每个神经元的输出来实现。线性整流单元\
  \ (`ReLU`)、`sigmoid` 和 `tanh` 是一些常用的激活函数 [18]。得益于非线性激活函数，神经网络可以学习输入中复杂的表示和模式。\n\
  *   **输出层 (Output layer)**：神经网络的最终预测或输出由结果阶段的神经元产生。分类相关任务或回归任务产生的类别数或输出值相应地决定了输出区域晶体管（单元）的数量。\n\
  *   **正向传播 (Forward pass)**：系统在正向传播期间接收输入数据并逐级计算事件直到到达最终层。输出层的决定性激活显示了神经网络的预期结果。\n\
  *   **损失函数 (Loss function)**：使用损失函数来确定目标输出与期望输出之间的差异。根据目标，可能会选择特定的损失函数；为了确定目标输出与期望输出之间的差异，使用了损失函数。\n\
  *   **反向传播与训练 (Backpropagation and training)**：反向传播是一种建立人工大脑优点的优化方法。每当使用反向传播时，都会计算损失函数关于网络参数的梯度，然后使用随机梯度下降\
  \ (`SGD`) 等优化技术进行调整。\n\n前馈神经网络是强大且灵活的模型，在各种应用中取得了卓越成功。它们对于涉及时间序列或序列数据的任务效果较差，因为它们难以捕捉时间依赖和序列模式。循环神经网络\
  \ (`RNN`) 及其变体经常被用于此类任务。\n\n**b) 卷积神经网络 (CNN)**：计算机视觉任务（包括图像识别、物体识别和图像分割）领域大幅增加了卷积神经网络（深度学习方法的一种）的使用。由于它们在这些项目中的卓越表现，CNN\
  \ 现在是许多尖端计算机视觉系统的不可或缺的一部分。\n\n\n\n\n- **卷积层**：`CNN` 的核心部分是神经层，它是它的基本构建单元。卷积层在输入图像上滑动，同时使用一组滤波器（有时称为卷积核），计算滤波器权重与输入的小局部区域之间的点积\
  \ [19]。这种技术类似于通过卷积操作将滤波器应用于图像，它创建了一个特征图，旨在突出输入图像中显著的结构和模式。\n\n- **激活函数**：通过在卷积过程之后应用激活函数（通常为\
  \ `ReLU`），网络获得了了非线性能力。`ReLU`（整流线性单元）被用于通过抵消所有负值，使 `CNNs` 能够识别数据中复杂的非线性模式。\n\n- **池化层**：池化层通过降低特征图的空间精度来实现，这显著减少了计算工作量并降低了过拟合风险。常见的池化技术包括在有限区域内选择最大值的**最大池化**，以及建立小区域内数据平均值的**池化**。\n\
  \n- **全连接层**：`CNNs` 在几层卷积和池化层之后，通常使用一个或多个全连接层。这些较深的层产生了用于分类等任务的输出概率。它们通过连接每个神经元并展平高维特征图来实现这一点。\n\
  \n- **参数共享**：参数交换是 `CNNs` 的主要优势之一。整个输入图像都经过同一组滤波器，这使得网络能够快速获取平移不变特征。通过共享参数，`CNNs`\
  \ 变得具有计算效率，并大大减少了参数数量。\n\n- **反向传播训练**：训练 `CNNs` 使用的方法与训练其他深度学习模型相同。在训练期间，使用 `Adam\
  \ optimization` 或在线梯度下降（`SGD`）等方法，根据损失函数相对于网络变量的梯度来修改权重。\n\n- **迁移学习和训练模型**：训练 `CNNs`\
  \ 通常需要大量数据，这可能是一个耗时且昂贵的计算过程。人员使用微调和迁移学习等方法来解决这个问题 [20]。这种方法建立在 `ImageNet` 等大型数据集上开发的预训练模型的基础上，然后使用特定特定任务的小型数据集对其进行微调。\n\
  \n- **结构**：已经提出了多种 `CNN` 结构，包括 `LeNet`、`AlexNet`、`VGG`、`ResNet`、`Inception` 等。这些架构的深度、宽度和设计决策各不相同，它们在各种计算机视觉任务中都展现了潜力。\n\
  \n随着在增强其性能、可解释性和泛化能力方面的持续努力，它们仍然是一个活跃的研究领域。\n\n### c) RNN\n\n`RNNs` 是专门为处理时间、文本、音频和不同序列数据格式而创建的深度学习模型。与前馈神经网络不同，`RNNs`\
  \ 具有反馈连接，能够考虑序列信息的特殊特性，使其处理不同长度的序列并保留对先前数据的记忆 [21]。由于其记忆特性，`RNNs` 是需要理解时间依赖关系和序列模式应用的良好选择。循环神经网络描述如下。\n\
  \n- **循环连接**：由于 `RNNs` 具有循环连接，每个隐藏层... \n\n- **时间展开**：在训练期间，`RNNs` 经常被展开以处理不同长度的序列。\n\
  \n- **LSTM 和 GRU**：标准 `RNNs` 在捕获长期依赖关系方面面临挑战 [22]。`LSTM` 和 `GRU` 是为了解决这个问题而创建的变体。\n\
  \n- **双向 RNN**：`Bidirectional RNNs` 从正向和反向方向分析序列... \n\n- **RNN 的应用**：\n    1. 语音识别、情感分析、文本生成和机器翻译只是自然语言处理中\
  \ `RNNs` 证明其有效性的众多任务之一。\n    2. 股市预测、异常检测和使用时间序列进行预测。\n    3. 机器人运动规划和管理被称为机器人学。\n\
  \    4. 识别视频中的动作并为其创建字幕。\n\n- **训练 RNN**：`BPTT` 算法是训练 `RNNs` 的梯度优化算法之一。然而，梯度消失/爆炸问题可能会使\
  \ `RNNs` 的训练变得困难。\n\n- **堆叠 RNN 层**：`RNNs` 可以“堆叠”，或从下到上构建，以捕捉序列数据中更复杂的模式。在某种程度上类似于深度前馈网络，堆叠\
  \ `RNNs` 实现了时间表示的层次化。\n\n- **挑战**：`RNNs` 难以处理远距离依赖关系，并且需要在海量数据上进行训练。处理长序列的成本可能很高。\n\
  \n尽管存在这些困难，`RNNs` 仍然是建模序列数据的有效工具。得益于注意力机制和 Transformer 模型，深度学习中的序列建模已经不断进化。\n\n\
  ### d) LSTM\n\n`RNNs` 是一种特定的脑网络，而 `LSTMs` 是另一种。它的创建是为了解决标准 `RNN` 的梯度消失和爆炸问题。自从 1997\
  \ 年由 Hochreiter 和 Schmidhuber 引入以来，`LSTMs` 已成为处理序列数据的深度学习模型中的关键组件...（后文略）\n\n- **结构**：`LSTM`\
  \ 单元比传统 `RNNs` 中的简单神经元更复杂，构成了 `LSTMs`。每个 `LSTM` 单元包含三个主要组件。\n\n- **细胞状态 (c\\_t)**：细胞状态作为内存组件实现了\
  \ `LSTMs` 对数据的长期存储。通过使用门控方法，它可以选择性地添加或移除信息。\n\n- **输入门 (i\\_t)**：来自输入门 (`i\\_t`)\
  \ 的数据调节了细胞阶段的隐藏状态和当前摄取。\n\n- **遗忘门 (f\\_t)**：上一个细胞状态中需要删除的信息由遗忘门 (`f\\_t`) 决定，使\
  \ `LSTM` 能够丢弃不需要的数据。\n\n\n\n\n\n- 门控机制：输入门和遗忘门使用 sigmoid 激活函数实现，产生 0 到 1 之间的值。这些参数调节了单元当前状态下应输入或擦除的数据量。当值较高（接近\
  \ 1）时，信息可以自由移动；而当值较低（接近 0）时，知识无法被修改。\n- 输出门 (`o_t`)：生成的门决定了单元状态中的哪些元素将同时包含在当前的隐藏状态和\
  \ `LSTM` 的输出中。通过采用 sigmoid 激活函数，从单元阶段到隐藏状态的知识流由生成的门进行控制。\n- 训练：`LSTMs` 与传统的 `RNNs`\
  \ 一样使用 BPTT 方法训练。在训练阶段计算损失函数计算梯度并用于修改 `LSTM` 的参数。\n- 长期依赖：通过仔细选择在长时间内应该存储在单元状态中的数据，`LSTMs`\
  \ 设计能够识别系列数据中的深层连接 [24]。对于自然语言处理等任务，理解一个词的语境可能需要考虑分散在短句中的词，这种能力是至关重要的。\n- 应用：涉及序列数据的各种应用在\
  \ `LSTMs` 上取得了成功，包括：\n    1. 自然语言处理：语言建模、机器翻译、情感分析和文本生成。\n    2. 时间序列分析：使用时间序列分析进行预测、异常识别和财务预测。\n\
  \    3. 语音识别：声学建模和语音转文本系统是语音识别的例子。\n    4. 视频分析：识别视频动作并添加字幕。\n\n将 `LSTMs` 与传统的 `RNNs`\
  \ 比较，表明前者在收集序列数据中的长期依赖和维持上下文方面明显更好。尽管如此，由于处理极长序列可能困难，它们可能需要精细的超参数调整以获得最佳性能。门控循环单元\
  \ (`GRUs`) 是 `LSTM` 的一种类型，提供更简单的架构提供相当的能力，在某些情况下可能更有效。\n\n### e) GRU：循环神经网络 (`RNN`)\
  \ 架构族包括门控循环单元 (`GRUs`)，它们与 `LSTM` 网络相当。它们为解决梯度消失问题以及处理序列数据内部的远程依赖提供了解决方案。Cho *et\
  \ al.* 于 2014 年发布了 `GRUs`，由于它们非常适合各种序列建模问题且易于使用，变得越来越流行。`GRUs` 是 `LSTM` 的变体，参数更少，这增加了它们的计算效率并有助于训练。以下是门控循环单元的描述：：\n\
  \n- 结构：`GRUs` 的构建与 `LSTMs` 类似，它们拥有一个能够在不同时间尺度上存储信息的内存单元。`GRU` 单元的要素元素包括：\n- 隐藏状态\
  \ (`h_t`)：隐藏状态包含了来自此时刻输入的数据和之前隐藏的内容，该状态代表了 `GRU` 单元的输出。\n- 更新门 (`z_t`)：更新门控制需要实现到当前隐藏状态中的新输入分量，以及应该保留的先验隐藏状态量。\n\
  - 重置门 (`r_t`)：重置按钮确定了在考虑输入内容时，应该忽略的上一个循环的无意识状态量。\n- 门控机制：`GRUs` 使用类似于 `LSTM` 的门控机制来调节信息流。更新门和重置门使用\
  \ sigmoid 激活函数，支持 0 到 1 之间的值 [25]。得益于这些门对隐藏状态的选择性更新和重置，`GRU` 可以更成功地检测长期依赖。\n- 训练：与其他\
  \ `RNN` 类型的训练方式类似，`GRUs` 通过 BPTT 进行训练。为了在整个过程中更新 `GRU` 的参数，必须通过考虑梯度函数来计算梯度。\n- 简单高效：`GRUs`\
  \ 比 `LSTMs` 设计更快且参数更少，这增加了它们的计算效率并使其更容易训练。当资源稀缺或开发具有许多重复部分的复杂模型时，`GRUs` 可以是一个明智的选择。\n\
  - 应用：`GRUs` 在涉及序列建模的各种任务中显示出有效，例如：\n    1. 自然语言处理：自动翻译、情感评估、文本生成和语言建模都是自然语言处理的例子。\n\
  \    2. 语音识别：语音助手、语音转文本软件和声学建模都属于语音识别。\n    3. 时间序列分析：时间序列分析：预测、发现异常和财务预测。视频动作识别和视频字幕。\n\
  \    4. 视频分析：动作识别和视频字幕。\n- 将 `GRUs` 与 `LSTMs` 比较：可以看出尽管两者旨在解决长期依赖，但 `GRUs` 的架构更简单，通常需要的参数更少，这使得它们在计算上更有效。在计算成本最小的情况下，`GRUs`\
  \ 有时可以达到与 `LSTMs` 相当的水平。\n\n`GRUs` 在识别序列依赖方面在易用性、有效性和效率之间取得了平衡。对于序列数据建模，它们是经常用于各种深度学习应用中的关键工具。与任何神经网络架构一样，在\
  \ `GRUs` 和 `LSTMs` 之间的选择可能会受到特定目标、数据集以及以及可用资源的影响。\n\n### f) GAN：2014 年，Ian Good\
  \ Fellow 及其同事引入了深度学习技术的 `GAN` 组。通过能够创建包括照片、音频、视频和文本在内的真实数据样本，`GANs` 改变了生成模型领域。`GAN`\
  \ 运行的基本原理是在博弈论结构内训练一个引擎和一个判别器系统。在这种情况下，判别器的任务是区分真实样本和伪造样本，而生成器的目标是提供真实的数据样本 [26]。这概括了\
  \ `GANs` 的基本概念。\n\n#### 架构\n\n- 生成器：反应器网络从来自简单分布（如高斯分布）的无规则噪声源产生人工数据样本（如图像）。它通过将随机噪声转换为有用的表示，逐渐获得了合成紧密反映真实数据分布样本的能力。\n\
  - 判别器：判别器网络使用真实数据样本（来自真实数据分布）以及生成器产生的样本作为输入。通过给真实数据更高的概率并产生较低概率的数据，它学会了如何区分真实样本和伪造样本。\n\
  - 训练过程：在 `GAN` 训练过程中，生成器和检测器参与一个在线极小极大博弈。而生成器试图最大化判别器将假样本误认为真实样本的可能性。为了提供更具欺骗性的数据样本，对生成器进行了修改。\n\
  - 通过减少分类错误，判别器进行更新，以更准确地区分真实和生成的数据。\n\n\n\n\n\n*   重复训练过程，直到生成器产生的高质量数据样本，使得判别器无法从真实数据中区分出来。\n\
  *   损失函数：通常使用判别器将生成样本接受为真实数据的负对数似然来定义生成器的损失。最大化该损失会促使生成器产生更高真实性的样本。\n*   与正确分类生成的样本和真实样本相关的负对数似然相乘，以计算判别器的损失\
  \ [27]。通过最小化该损失，可以提高判别器区分生成样本和真实样本的能力。\n*   挑战：训练 GAN（生成对抗网络）可能困难且不稳定。在训练过程中，必须仔细平衡合成器（synthesizer）和评论家（critic），学习过程偶尔会经历模式崩溃或发散。\n\
  *   模式崩溃：当生成器只产生有限的数据样本时就会发生，未能捕捉到真实数据分布中存在的多样性。\n\n## 应用\n\n*   GAN 用于许多不同的领域，例如：\n\
  *   图像生成：使用图像生成创建高分辨率、写实的图像。\n*   图像到图像翻译：将图像从一个领域转换为另一个领域的过程（例如，将草画图转换为真实的图片）。\n\
  *   风格迁移：将创意风格迁移到图片或电影中。\n*   超分辨率：增强图像分辨率。\n*   数据增强：扩展训练数据集。\n*   文本生成图像：根据文字描述创建视觉效果。\n\
  *   视频生成：利用随机噪声制作真实的视频。\n\n生成对抗网络作为一种开发准确数据样本的强大方法，极大地推动了生成模型科学的发展。在众多领域生产多样化且顶级的内容方面，它们取得了卓越成就。然而，为了进一步增强其性能，对其训练和稳定性的研究仍在进行中。\n\
  \n## 8.3 深度学习与强化学习的结合\n\n### 8.3.1 深度强化学习\n\n深度强化学习（deep RL）将深度神经网络的强大表达能力与试错学习方法相结合。在深度\
  \ RL 中，可以使用函数近似器估计价值函数（`V`）和 Q 函数（`Q`）。这些近似器的示例包括神经网络。由于其具有处理多维和连续事件以及事件位置的能力，它适用于要求性很高的现实应用。\n\
  \n通过将强化学习（RL）与深度学习（DL）相结合，在复杂和高维任务中的实际应用成为可能，这极大地推进了人工智能的发展 [28]。RL 算法中的价值函数或策略由深度学习（特别是大规模神经网络）表示，作为函数的近似器。在许多领域，这种\
  \ RL 和 DL 的结合特别高效。以下是将 RL 与 DL 结合的一些示例。\n\n*   深度 Q 网络（DQNs）：DQNs 利用深度学习网络，在使用 `Q-learning`\
  \ 时考虑动作值函数。当 DQN 用于玩 Atari 2600 游戏等挑战性活动时，它可以成功地收集并学习与离散动作区域相关的 Q 值。\n*   深度确定性策略梯度（DDPG）：连续动作空间的策略需要估计动作值、策略函数，DDPG\
  \ 使用 DNNs。得益于演员-评论家（actor-critic）架构和深度学习，DDPG 可以有效地管理高维动作空间。\n*   带有神经网络的策略梯度：在近端策略优化（PPO）和信任区域策略优化（TRPO）等策略梯度方法中，使用使用神经网络来通过函数近似器描述策略。为了在困难的情况下学习复杂的策略，这些技术利用了深度学习的表达能力。\n\
  *   演员-评论家方法：这些技术整合了基于策略和基于价值的学习。在大多数情况下，深度神经网络作为评论家的表示。当角色在学习规则时，评论家正在评估价值系统 [29]。通过相互增强的影响，这种双重策略改进了稳定性和学习。\n\
  *   用于 RL 的深度神经网络拓扑：研究人员正在利用深度学习（DL）作为近似函数的背景下，研究专门为强化学习任务设计的不同深度神经网络拓扑。例如，在 RL\
  \ 中，递归神经网络（RNNs）已处理顺序和序列数据。\n*   迁移学习和预训练的进展：迁移学习和预训练等深度学习方法已应用于 RL，以利用从相似活动或语境中获得的知识。这种策略增强了\
  \ RL 智能体的泛化和采样效率。\n*   分层强化学习：分层强化学习（HRL）使用深度学习来学习可以长时间引导智能体行为的高级策略或替代方案。深度神经网络使用学到的这些高级规则，为智能体提供了一种更层次化、更系统的方法来解决挑战性问题。\n\
  *   表示学习：深度学习已应用于 RL 中的表示学习，其中神经网络被训练以从未处理的感官输入中提取有价值的表示。利用这些获得的表示可以增加智能体的性能并减少状态空间的维度。\n\
  \n强化学习与深度学习的融合为解决跨多个领域的复杂问题开启了新机会。它加速了许多实际领域的发展，包括机器人、自主系统、游戏、自然语言处理等。由于合并 RL 和\
  \ DL 带来的困难，样本效率、稳定性和安全学习仍然是重要的研究课题。\n\n### 8.3.2 深度强化学习的复杂性问题\n\nDRL 已证明自己非常擅长各种任务，例如引导机器人、自动驾驶和导航具有挑战性的视频游戏等。若要取得成功并广泛应用，学术界和从业人员需要解决它提出的许多问题。应对深度强化学习面临着许多重大挑战。\n\
  \n*   样本效率：为了减少学习所需的环境接触次数，提高样本效率至关重要。训练深度强化学习（DRL）智能体通常需要大量数据，这在现实生活中可能耗费金和时间。\n\
  *   探索与利用的权衡：探索（尝试不同的方法以发现更有效的策略）与利用（使用已知良好的策略进行利用）之间的平衡是挑战性的。智能体需要充分的探索以找到最优策略，而不是陷入局部最优。\n\
  *   奖励函数设计：适当奖励函数的开发对于深度强化学习（DRL）的有效性关关。奖励函数必须提供有意义的反馈，引导智能体实现目标。稀疏或设计不当的奖励函数可能会导致学习困难或次优策略。\n\
  *   信用分配：在具有延迟奖励的任务中，确定哪些动作贡献了特定的奖励是挑战性的 [30]。准确地将信用分配给相关动作对于有效的学习至关重要。\n\n\n\n\n\
  \n# 深度强化学习中的挑战\n\n* **泛化性**：深度强化学习（DRL）算法可能难以有效泛化到未见状态和任务。对特定训练场景的过拟合以及适应新环境的困难可能会限制代理在实际应用中的性能。\n\
  * **高维空间中的动作探索**：在需要多维度动作区域的场景中，有效探索的挑战变得越来越困难。从大量的可能性中选择合适的动作可能涉及大量的计算量，并需要专门的探索技术。\n\
  * **收敛性与稳定性**：深度强化学习中的深度神经网络训练可能是不稳定的。参数发散或不收敛可能导致糟糕的解决方案。为了保证稳定且收敛的学习，充分的初始化、正则化和学习率调度等策略至关重要。\n\
  * **超参数调优**：深度强化学习：学习过程中经常涉及许多超参数，包括学习率、网络设计、探索率等。这些超参数的微调通常需要投入大量的时间和金钱才能获得最佳性能。\n\
  * **健康与安全**：深度强化学习智能体的安全运行是现实应用中的一个主要问题。一个巨大的困难（特别是在安全至关重要的背景下）是确保强化学习智能体的行为恰当，不参与不或危险的行为。\n\
  * **样本复杂度**：在具有高维状态空间的复杂系统中，识别有效的策略可能需要大量的样本，这会延长学习时间并增加计算成本。为了克服这些障碍，有必要将算法改进与有效的探索方法、改进的奖励工程、迁移学习以及领域知识相结合，使深度强化学习在实际应用中更加耐用、有用且具扩展性。\n\
  \n## 结论\n\n在本章中，深度和强化学习原理构成了现代人工智能的基石，为解决不同领域的复杂问题提供了无与伦比的能力。深度学习从海量数据集中提取复杂模式的能力彻底改变了图像识别、自然语言处理和自主系统等。另一方面，强化学习为动态环境下的智能决策开启了大门，应用涵盖了从机器人到金融的领域。此外，它还强调了与深度强化学习技术部署相关的伦理考虑和社会影响的重要性。随着我们的进步，深入理解这些原理对于推动人工智能研究和应用的边界至关重要。通过利用从这些探索中获得的见解，研究人员和从业者可以利用深度和强化学习的变革性潜力来解决紧迫挑战，并在日益由\
  \ AI 驱动的世界中推动创新。\n\n# 参考文献\n\n1. Buduma, N., Buduma, N., Papa, J., *Fundamentals\
