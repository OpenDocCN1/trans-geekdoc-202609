  \ (12.61)\n\n在本节中，可以通过优化不同的交叉类型来实现归一化评分。可以基于此优化特征层的网络权重。\n\n### 12.3.5 决策树优化的布谷搜索\
  \ (DTOCS)\n\n此外，我们使用 DTOCS 方法选择关键特征并降维。决策树（DTs）是用于数据分类、回归以及在数据选择特征的监督学习技术。这些分类器的结构类似于树，内部节点表示数据集特征，分支表示决策规则，叶子节点描述最终决策。为了管理数据集，可以将其划分为子集以创建决策树。虽然树是组织数据的有效方式，但它们不能作为患者示例。每个数据集属于不同的类别；因此，该方法是监督学习而非无监督学习。采用相同的对齐方法可以帮助利用收集的信息构建树，从而进一步改进。数据有四种主要类型：连续、离散、抽象和易于预测。这些数据类型总是易读的。\n\
  \nDT 有两个部分：端节点和叶子节点。DT 很容易识别，因为它模拟了人类创建现实对象的阶段。数据集中的预测准确性通过评估所有 DT 的平均值，来确定特定特征的存在取决于其他区域。这有助于将对象分类到特定的类别。最后，DT\
  \ 有两部分：解析数据的端节点和提供结果的叶子节点。沿树路径，每个节点测试的结果为分类模型提供了足够的信息来确定其类型。OCS 方法由速度优化公式驱动，能够迭代探索解空间。OCS\
  \ 旨在通过复制、选择和排列技术寻找优化问题的最优答案。该过程从固定数量的布谷鸟蛋开始，这些蛋可以近似生成。算法使用莱维飞行（Levy flight）技术创建新的解，以避免陷入局部最优。布谷鸟类生物偶尔产下一个蛋，然后将其掉进它选择的巢中。\n\
  \n对最不必要的巢位置进行蛋搜索并将其排除在进一步计算之外。这些巢在一系列不著名的巢中找到，是其他分析的遗留。布谷鸟蛋提供了一种新的解决方案。像布谷鸟蛋的新账户将提供一种技术先进的解决方案来取代旧集合并提供最先进方案。同样，巢中蛋的质量是方案的适应度函数。布谷鸟试图通过模仿外观、颜色、斑点和大小来融入巢中已有的蛋。如果这不起作用，宿鸟将意识到该蛋不属于它们。否则，下一代布谷鸟策略将成功。DT\
  \ 的基本结构如图 12.4 所示，其叶子节点分为部分：前者解析数据，后者产生结果。沿树路径，每个节点测试的结果为分类模型提供了足够的信息。\n\n![Figure12.4](img/equ12_284.png)\
