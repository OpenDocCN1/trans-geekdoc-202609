  \ `DCNNs`，这可能是少数标记良好的照片与来自任意数量数据集的许多弱标注图像的混合。这项工作研究了 `EM` 算法在训练语义模型中的应用，特别在处理有限数据时非常有效\
  \ [11]。\n\nZhou, S. K. *et al.* (2021): 深度强化学习（`DRL`）利用深度神经网络的计算能力结合强化框架来学习一组最大化预期奖励的响应。`DRL`\
  \ 在医疗领域的应用分为三类：(i) 参数化图像分析任务，如点识别、目标定位；(ii) 优化相关的任务，如超参数调优、决策和神经框架搜索；(iii) 服务组合，如差异化教学\
  \ [20]。\n\nJabbar, M. A. *et al.* (2021): 医疗保健与人工智能（`AI`）以及 `AI` 对医学领域的影响，包括对深度学习在医学记录、基因组学和检测中的健康信息学应用的深入检查\
