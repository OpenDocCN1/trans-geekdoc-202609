  \ `MWT`、`LBE` 和 `FES`）相比，其准确率低于 52%。然而，所提出的 `LSTM gate MLPNN` 方法准确率提高了高达 73%。\n\n\
  使用所提出的 `LSTM Gates MLPNN` 方法可以获得脑卒风检测准确性的 `F1-score` 分析估计，如图图 12.9 所示。基于这些数据，可以从数据集中收集并在训练和测试的基础上进行处理，以获得脑侧化的准确率。可以使用此分析\
  \ `F1 score`。此外，所提出的 `LSTM Gates MLPNN` 方法的准确率提高到 78%。然而，与建议的方法相比，文献分析确定的 `LBE`、`FES`\
  \ 和 `MWT` 方法的准确率低于 55%。\n\n![图 12.7 敏感性分析。](img/fig12_7.jpg)\n图 12.7 敏感性分析。\n\n\
