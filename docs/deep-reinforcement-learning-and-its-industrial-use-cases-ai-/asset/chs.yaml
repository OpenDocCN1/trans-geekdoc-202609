  \ displaystyle=\"true\"><msubsup><mo>&#x2211;</mo><mrow><mi>k</mo><mo>=</mo><mn>0</mn></mrow><mi>&#x221E;</mi></msubsup><mrow><msup><mi>&#03D2;</mi><mi>k</mi></msup><msub><mi>r</mi><mrow><mi>t</mi><mo>+</mo><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mrow><mo>|</mo><mrow><msub>s</mi><mi>t</msub></mrow></mrow><mo>=</mo><mi>s</mi><mo>,</mo><msub>a</mi><mi>t</msub></mrow></mstyle><mo>=</mo><mi>a</mi></mrow><mo>)</mo></mrow><mo>.</mo></mrow></math>\n\
  ```\n(9.2)\n\n\n\n\n\n这种结构化的方法允许我们系统地分析和解决 `RL` 问题，为在动态和不确定环境中的明智决策提供基础。为了在 `MDP`\
  \ 中实现最优策略，`DP` 可以通过初始化一个初始策略并通过迭代（`policy iteration`）来逐步完善它，或者从一个任意的值函数开始，确定最佳行动方案及其价值，并对改进后的状态值函数或动作值函数的估计进行迭代细化，这被称为\
