  \n图 3.8 Q(s, a)函数。\n\n### 3.2.1.2 深度 Q 网络 (DQN)\n\n这种方法不是使用二维数组，而是使用神经网络。由于无法对其未知的状态进行值估计和更新，Q\
  \ 学习智能体无法做到这一点。换句话说，如果出现完全未知的情况，普通的 Q 学习将无法预测。此外，Q 学习在动态规划技术中使用二维数组。因此，为了在 DQN 中改进值的计算，使用神经网络代替数组。卷积神经网络（CNN）由层组成，每层都有多个内核（函数）以不同的方式覆盖图像。维度为`3\
  \ × N × N`的输入图像在应用卷积层时可能会产生许多卷积图，每个图具有相同的内核权重。在处理图像时，CNN 的性能优于任何类似的 DNN（基于 MLP 的深度神经网络），能够产生相当的精度，因为只需要优化一个向量，每个层的内核权重保持不变，但\
  \ CNN 的输出是多维张量，无法直接进入回归（值估计）或分类模型。为了将数据输入用于分类的`Soft-Max 激活层`或用于回归的`线性激活层`，CNN 最后一个卷积层连接到一个或多个扁化层。选择分类概率最高的类别（`argmax`），这是`Soft-Max\
  \ 激活层`为每个需要分类的类别产生的输出，是最佳行动方案。\n\n\n\n\n\n图 3.9 描述了动作值函数，它将环境条件与每个可能动作的预期回报（即未来奖励的总和）连接起来，该函数通过神经网络\
  \ `DQNs` 进行近似。`DQN` 的目标是发现最佳动作路径或策略，该策略将使每个状态的预期回报最大化。为了训练 `DQN`，智能通过通过动作、获得奖励和获取反馈与环境进行交互。这些经验被智能体存储在内存缓冲区中，它利用这些经验定期更新\
  \ `DQN`。经验回放（Experience replay）是一种通过从内存缓冲区随机采样一组经验来更新 `DQN` 的技术。这一过程可以稳定学习过程，并允许智能体从更广泛的事件中汲取教训。\n\
  \n![图 3.9 Deep Q 网络 [3]。](images/fig3_9.jpg)\n\n图 3.9 Deep Q 网络 [3].\n\n### 3.2.1.3\
  \ Double DQN\n\n“DQN” 方法存在一个缺陷，即 `Q-values` 高估了智能体的实际回报，从而高估了真实奖励。解决此问题的简单方法是将动作选择与评估分离，正如\
  \ `double DQN` 算法的作者建议的那样 [3]。他们对贝尔曼方程进行了修改，而不是使用与 `DQN` 方法相同的方程：\n\n![upper Q left-parenthesis\
