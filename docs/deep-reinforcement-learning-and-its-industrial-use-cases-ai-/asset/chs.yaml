  \ ML/DL 易受到恶意尝试的影响 [12].\n\n# Han, J. *et al.* (2018)\n对象的数字分割是计算机视觉领域一项至关重要但具有挑战性的任务。使用深度学习强化框架，该挑战被作为马尔可夫决策过程进行研究，模型通过训练来分离物体区域。\n\
  \n分割学习代理很难实现，因为分割是一个在实践上连续的决策过程，涉及从种子像素到整个物体掩码的大量代理和动作阶段。为了解决这个问题，碎片代理的学习收缩为切割代理的学习，后者仅有少数动作单元，并可以在几步动作中组合在一起\
  \ [7].\n\n# Zhang, Y. D. *et al.* (2021)\n深度学习在识别疾病和理解医疗数据方面不断增强的能力将赋能医生并加速临床环境下的决策。近年来，现代医疗设备的使用和医疗治疗的计算机化导致了大量生物数据的产生。这些新问题、需求，以及新型\
  \ AI 方法和用于数据处理、分析和模拟的计算模型对于理解生物过程至关重要，已在概述 [19].\n\n# Alaniz, S. (2018)\n通过一种能够竞争无模型方法（特别是\
  \ `DQN`）的强化代理构建基于模型的学习可能性已得到研究。利用深度神经网络的网络和蒙特卡洛树搜索的版本来增强这种代理。\n\n实验表明，学习有意义的模型比训练\
  \ Q 值所需的样本少得多。由于蒙特卡洛搜索代理使用树搜索来确定最有效的行为，它执行动作的时间比深度 Q 网络要长。因此，该方法在获取训练成本极高的情况下非常有吸引力\
