  \n1. *\n*通讯作者：*kikeerika@gmail.com\n\n\n\n\n\n*   `Policy (π)`: 个体在做出判断时使用的策略或映射。\n\
  *   `Reward (r)`: 用来衡量智能体所采取动作有效性的指标。\n*   `Value function (V(s))`: 价值函数，决定智能体从特定状态可能获得的潜在长期收益。\n\
  *   `Q-function (Q(s, a))`: Q 函数，决定在特定情况下执行某项活动的预期总收益。\n\n### 8.1.2 马尔可夫决策过程 (MDP)\
  \ 过程\n\n在结果不明确的情况下，使用马尔可夫决策过程（MDP）对决策进行数学建模。它由状态、操作、转移概率和收益组成，有助于对模糊情况下的顺序操作进行分析和优化。它包含激励活动、减价变量、概率运算变化、多个状态和多个步骤。图\
  \ 8.1 显示了马尔可夫决策过程。\n\n![图 8.1 马尔可夫决策过程。](img/fig8_1.jpg)\n\n图 8.1 马尔可夫决策过程。\n\n\
  MDP 的主要元素包括以下内容：\n\n*   `Situations (S)`: 自动机制可能遇到的每个潜在状态或配置的受限集合。\n*   `Actions\
  \ (A)`: 个体在种情况下可以采取的决策和反应的受限集合。\n*   `Transition probability function (P)`: 决定了执行特定动作时状态发生变化的可能性。换句话说，它描述了环境的动力学特性。\n\
  *   `Reward function (R)`: 收益函数，将每个状态-动作对转换为数值奖励，显示智能体在特定条件下执行特定动作的直接收益或损失。\n* \
  \  `Discount factor (γ)`: 一个处于 0 到 1 之间的数字，权衡当前收益与未来收益的重要性。智能体可以决定优先考虑长期规划还是短期收益。\n\
  \n目标是确定合适的 MDP 作为一种课程策略，随着时间的推移增加整体优势 \\[1\\]。`Q-learning`、规则修正和重要性循环只是用于解决 MDP\
  \ 并决定智能体追求的最佳行动方案的强化学习技术之一。MDP 经常应用于许多不同领域，包括机器人学、自动系统、游戏、金融和医疗保健，用于表示涉及不确定性和顺序交互的决策问题。\n\
  \n1) `Value function`: 价值函数。重要性变量（`V`）计算参与者在执行特定策略时，从特定条件下可以获得的预期累计优势。正式上，它被称为：\n\
