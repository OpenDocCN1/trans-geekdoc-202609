  \ stretchy=\"false\">(</mo><mi>x</mi><mo>,mo><mi>y</mi><mo stretchy=\"false\">)</mo><mo>&#x2264;</mo><mi>T</mi><mi>L</mi></mrow></mtd></mtr></mtable></mrow><mo>}</mo></mrow></mrow></math>\n\
  ```\n(11.5)\n\n在移除血管后，深度强化学习（DRL）适用于许多应用程序，因为通过接受原始数据（如 `pixels`）作为输入，减少了预定义环境的需求。通过这种抽象层，可以创建深度强化学习算法，使其具有通用性，并允许相同模型应用于检测和分类。传统的强化学习（RL）算法无法解决高维\
  \ MDP 状态，例如来自摄像的图像或机器人的原始传感器流，这些状态在许多现实决策问题中存在。通过将策略 `π(a/s)` 或其他学习函数表示为神经网络，并创建在该环境中运行良好的专门算法，深度强化学习方法利用深度学习来解决此类\
  \ MDP（马尔可夫决策过程）。DRL 非常适合需要顺序决策的问题——即一系列相互影响的决策。渗变检测和分类是最具挑战性的任务之一，准确分类这些渗变至关重要。在这里，使用\
  \ DRL 来检测和分类糖尿病视网膜病变。主要目标是非常有效地检测和分类不同阶段的 DR。为了这一目的，使用了 DRL。深度强化学习（DRL）用于以低成本确保准确的结果。算法阶段所示图\
  \ 11.2：\n\n算法步骤：\n\n1. 获取数据集\n2. 对收集的数据进行预处理\n3. 对数据进行训练、验证和测试\n\n    ![Figure 11.2\
  \ Algorithm.](img/fig11_2.jpg)\n\n    **图 11.2** 算法。\n\n4. 删除不必要的特征\n5. 血管特征提取\n\
  6. 异常检测与分割\n7. 使用 DRL 进行分类\n\n\n\n\n在该方法中，使用了来自 Kaggle 的糖尿病视网膜病检测数据集。该数据集的图像包含噪声。为了消除噪声，使用了图像处理技术。然后将数据分为三类，包括训练数据、验证数据和测试数据。“眼球”区域外的某些像素可能通过随机角度旋转进行变换，使其像素值大于\
  \ 7。结果是消除了多余特征。为每张上采样的图像创建一个圆，以图像的中心为圆心，半径等于图像边长的一半。然后，将圆外的像素值置为 0。采样图像中不必要的区域被移除，从而获得了圆形眼部区域的上采样图像。特征提取技术利用了能量因子和同质性决定因子。\n\
  \n最后，DRL 分类器检测并将糖尿病视网膜病分为四种不同的类型：正常、中度、早期和严重，如下：在糖尿病视网膜病早期，视网膜血管壁变薄。有时会渗漏或向视网膜内渗出液体和血液的小型突起从血管壁上突出。视网膜组织可能会增大，导致白斑。\n\
  \n在中度水平，小血管继续生长，阻碍了视网膜获取血液并防止了适当营养。该疾病更严重的类型是增生性糖尿病视网膜病变 (PDR)。循环问题现在导致视网膜缺氧。填充玻璃体、视网膜和玻璃体胶的胶状液体导致了细小血管的形成。\n\
  \n通过这种方式，对不同的 DR 阶段进行分类。如果检测到疾病并在经过适当分类后，将给出诊断。结果是视力损失大大减少。使用假阳性、真阳性、假阴性和真阴性的混淆矩阵特征，准确率、精确率、敏感性、特异性和\
  \ f1 分数来验证提供技术的性能。以下是混淆矩阵参数的描述：\n\n- **真阳性 (TP)**：TP 结果表示模型正确分类了 DR 疾病。\n- **真阴性\
  \ (TN)**：TN 结果表示模型准确识别出不存在 DR。\n- **假阳性 (FP)**：当模型错误地分类 DR 时，结果为假阳性。\n- **假阴性 (FN)**：当模型误判\
  \ DR 的存在性时，会产生假阴性结果。\n\n### 准确率 (Accuracy)\n预测的总数，正确预测的数量。使用下所示方程，还可以从正性和负性的角度评估二分类的准确率：\n\
