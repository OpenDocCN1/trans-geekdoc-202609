    # ### 3.3.2 RQ2: How do \(\alpha\) and \(\gamma\) affect the attacks'' effectiveness?


    Adversaries pay attention to \(\alpha\) and \(\gamma\), which are under their
    control and can be tuned to make attacks more effective. The results in Table
    2 and Table 3 show that by adding more fake projects, one can increase the hit
    ratio by both systems.


    For example, with LibRec, for (\(\alpha\)=5%, k=10, \(\gamma\)=6) HR@10 is 0.273;
    and for (\(\alpha\)=10%, k=10, \(\gamma\)=6) the corresponding hitting ratio HR@10
    is 0.418. Similarly, with CrossRec (cf. Table 3), for (\(\alpha\)=5%, k=20, \(\gamma\)=6),
    HR@10 is 0.207, while the hit ratio HR@10 for \(\alpha\)=10% reaches a value of
    0.457. The maximum hit ratio is obtained, i.e., HR@15 = 0.530 when \(\gamma\)
    =6 and k=20. For CrossRec, the hit ratio decreases when \(\gamma\) > 6, this means
    that an attacker should use a small \(\gamma\) to get a higher hit ratio. For
    LibRec, the maximum HR@15 is 0.670 and obtained when \(\gamma\)=10.


    We ran LibRec and CrossRec in two modes, i.e., with and without fake projects,
    and realized that there is almost no difference in their success rate. Due to
    space limit, we report only the differences as average SR@N in two modes, which
    is 2.6% and 2% for LibRec and CrossRec, respectively.


    This implies that the inadvertent inclusion of fake projects in the recommendation
    is difficult to notice, and cannot be detected by simply looking at variations
    in the accuracy values.


    > By adding more fake projects (\(\alpha\)), attackers can increase the number
    of infected clients in both systems. A small \(\gamma\) is more dangerous to CrossRec,
    while a large \(\gamma\) causes more harm to LibRec.


    # ### 3.4 Discussions


    This subsection discusses the perspective of an attacker who wants to *compromise
    the security of a system (marked with \(\times\))*, and that of an administrator
    who *defends the system against hostile attempts (marked with \(\checkmark\))*
    .


    While in the evaluation we performed only push attacks, the same methodology can
    be applied to conduct nuke attacks, i.e., removing a useful library from the recommendations
    (\(\times\)). Moreover, we tried with only one malicious library, however the
    evaluation can easily be extended to a set of libraries.


    We considered different settings for LibRec and CrossRec, and this aims at studying
    the systems'' capability in various conditions. In practice, an attacker may not
    be aware of such design, what matters is how she populates fake projects so that
    the malicious library will be recommended (\(\times\)), regardless of the systems''
    configurations.


    To simplify the evaluation, we generated fake projects at the metadata level,
    i.e., we assume that all projects have been successfully fetched from GitHub.4
    In practice, it is necessary to plant these projects in GitHub to make them appear
    as legitimate (\(\times\)). In fact,


    such an incident has been recently reported, where hundreds of GitHub repositories
    promoting malware apps have been discovered.5 To our knowledge, research conducted
    to combat this type of abuse is still in its infancy [27].


    Aiming for credible sources, a recommender usually chooses to crawl only from
    repositories with a considerably large number of stars and/or forks, or whatever
    criterion a recommender uses for selecting its training set (\(\checkmark\)) [21].
    In this case, an attacker may need to disguise a planted project by falsifying
    this information, e.g., by starring and forking with forged accounts (\(\times\)).
    Thus, there is a need for mechanisms to detect this type of fabrication (\(\checkmark\)).


    To penetrate a system, the introduction of a library is just the first step. The
    second step is to trick developers into invoking the library by calling its functions.
    Thus, an adversary needs also to steer API or code recommenders (\(\times\)),
    e.g., the ones recently published [8, 22, 29]. We conjecture that a technique
    similar to what described in Section 3.2 can be used for injecting toxic APIs.


    # ## 4 RELATED WORK


    The topic of AML has garnered attention from the research community in recent
    years. In image classification, several adversarial techniques have been introduced
    to add perturbations to images [9, 20], which are then correctly recognized by
    humans. However, DNNs are prone to these attacks as they fail to classify the
    croated images.


    For recommender systems, there are various studies about AML [7, 11, 16]. Recently,
    Anelli et al. [1] present an attempt to use shilling attack [32] to manipulate
    a collaborative-filtering recommender system operated with Linked Data. In our
    work, we performed similar push attacks on CrossRec which runs with data from
    GitHub. However, we need to devise our own method to curate fake projects.


    Wang and Han [36] propose an improvement of the Bayesian personalized ranking
    (BPR) technique by exploiting the adversarial training-based mean strategy (AT-MBPR)
    in the domain of collaborative-filtering-based recommender systems. By exploiting
    user''s ratings, the underpinning MBPR model extract and classify user''s feedback
    into three categories. After, the algorithm injects adversarial perturbations
    in the initial training data to construct a noisy dataset. An iterative process
    then optimizes the objective function.


    Various approaches have been proposed to defend recommender systems against attacks
    [16]. An attack-agnostic detection model was developed [4] based on reinforcement
    learning (RL). The model exploits an attention classifier to distinguish adversarial
    examples from the normal ones by measuring the probability that input data suffers
    from perturbations.


    # ## 5 CONCLUSION AND FUTURE WORK


    In this paper, we presented an initial investigation of the topic of AML in RSSE.
    While RSSE suggesting libraries and API calls have gained momentum, we showed
    how they can be susceptible to adversarial attacks with bogus input data. By spoiling
    the tools'' recommendation list, the attack paves the way for unauthorized access
    to software clients.


    As future work, we plan to devise and evaluate effective countermeasures that
    can ward off attacks tailored to RSSE. This will be done by studying learning
    algorithms being aware of adversarial'
