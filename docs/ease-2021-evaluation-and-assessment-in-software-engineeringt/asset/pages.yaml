    # ## 1 INTRODUCTION


    To cope with their everyday programming tasks, developers access and browse various
    information sources [5]. Given the abundance


    of sources of formal and informal documentation, the problem is not the lack of
    information, but, instead, its overload [18, 19]. Recently, many studies have
    been conducted to develop methods and tools — recommender systems for software
    engineering (RSSE) — to provide developers with automated assistance [10, 21,
    25]


    The development of RSSE encompasses several phases including the design of the
    underpinning algorithms or the reuse of existing ones. Machine Learning (ML) techniques
    are amongst the natural choices that developers take when new recommender systems
    have to be conceived [26]. This means, for example, that the recommendation of
    code elements (snippets or APIs) is learned from existing code bases or informal
    documentation. As a result, the quality of the recommendation depends on the quality
    of the underlying data, whose noisiness has been previously reported [14].


    Even worse, online data used to train recommenders can be exploited for malicious
    purposes. Adversarial Machine Learning [13, 34] (AML) is a field of study that
    focuses on security issues in ML systems and, specifically, in recommender systems
    too [7]. Research has been done to identify probable threats and seek out adequate
    countermeasures [1, 36]. For example, Anelli et al. [1] use shilling attack [32]
    to manipulate a collaborative-filtering recommender system operated with Linked
    Data. Also, Wang and Han [36] propose an improvement of the Bayesian personalized
    ranking technique by exploiting the adversarial training-based mean strategy in
    collaborative filtering-based recommender systems.


    To protect a system against threats, in the first place, it is necessary to be
    knowledgeable of various types of adversary activities [16]. Such activities generate
    perturbations to deceive and disrupt systems by causing a malfunction, compromising
    their recommendation capabilities.


    The ultimate aim of these attacks is to manipulate target items, thus creating
    either a negative or positive influence on the final recommendations [11], depending
    on the attacker’s intention. For instance, in image classification, an attacker
    crafts an input image by adding non-random noise in a way that it will be falsely
    classified by ML models, whilst still being properly recognized by humans [20].
    As an example, a panda was recognized as a ribbon by cutting-edge deep neural
    networks once the input image had been padded with noise, meanwhile humans still
    correctly perceived the panda from the forged image [9].


    AML has been studied in a wide range of domains, e.g., online shopping systems
    [16] or image classification [20], and addresses'
