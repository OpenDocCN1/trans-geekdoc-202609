    We come across the following question: “Which libraries should be chosen as fillers,
    so that the fake project will be incorporated into the recommendation?” In fact,
    recommenders heavily rely on similarity [30], thus we come up with the selection
    of popular libraries as fillers. Our intuition is that, a fake project with libraries
    widely used by projects is likely to get attention from the recommendation engine.
    A list of libraries in the training data is selected and sorted in descending
    order of the number of caller projects. A certain number of the top popular libraries
    is then randomly selected.


    On the attacker’s side, α is the ratio of fake projects to the total number of
    projects (in %); γ is the number of fillers. For LibRec and CrossRec, k is the
    number of similar projects and N is the cut-off value for the ranked list of recommendations
    [21, 33]. We conducted experiments using ten-fold cross-validation on a dataset
    used in our previous work [21] with 1,200 projects and 13,497 libraries. For a
    testing project, we randomly split its libraries into two equal parts, the first
    part is used as a query, while the second one is ground-truth data. To measure
    the effectiveness of the push attacks, we use Hit ratio HR@N, defined as the ratio
    of projects being recommended with lib* to the total number of testing projects
    [1]. To measure the accuracy, we use success rate SR@N, i.e., the ratio of projects
    getting at least a matched library (the size of the intersection of the recommended
    list with the ground-truth data is larger than 0) to the number of testing projects.
    We experimented with α={5%, 10%} as attack size; k={5, 10, 15, 20}; γ={3, 4, 6,
    8, 10} as fillers’ size. The calibration of these parameters allows us to simulate
    stress tests, aiming to investigate the systems’ resilience under different working
    conditions.


    +   • **RQ1**: _Are LibRec and CrossRec prone to push attacks?_ By experimenting
    the two systems on a real dataset collected from GitHub, we are interested in
    understanding if the push attacks pose a threat to them.


    +   • **RQ2**: _How do α and γ affect the attacks’ effectiveness?_ Both parameters
    can be tuned by attackers. Thus, it is also important to see how the parameters
    impact on the efficacy of the attacks. By varying the parameters, we study the
    influence on the recommendation outcomes of both systems.


    # 3.3 Experimental results


    We answer the research questions by referring to Table 2 and Table 3. LibRec does
    not work on projects with a small number of libraries, this is why there are no
    results for γ=3. Instead, we can run CrossRec with any γ > 0.


    # 3.3.1 RQ1: Are LibRec and CrossRec prone to push attacks? According to Table
    2, we see that regardless of the internal configuration of both systems (i.e.,
    k and N), the push attacks always succeed in injecting lib* to projects. In general,
    an attack becomes more effective when a larger value of k is used. We analyze
    the results obtained by running the tools as follows.


    With α=5%, for LibRec, we can see that the system recommends the malicious library
    at different hit ratios. For instance, with γ=4, k=5 we get HR@10 of 0.154, and
    the hit ratio gradually increases when we use a larger number of libraries. Given
    that 10 libraries are used, HR@10 reaches 0.219. Moreover, the hit ratio also
    increases alongside k i.e., the number of neighbor projects used for recommendations.
    Remarkably, when k=20, we get a hit ratio HR@10 of 0.637. Similarly, CrossRec
    also recommends the malicious library by all the experimental settings.


    As we have shown in Section 3.1, developers would voluntarily adopt the recommended
    libraries, especially when the fake library is disguised with a typosquatting
    name, and the ranked list is short, e.g., N=10 or N=15. The adoption of a phoney
    library indeed poses a threat to the system under development. Altogether, we
    conclude that adversarial attacks to library recommender systems are highly probable,
    and we should neither underestimate nor neglect them.'
