    > > API recommendation. MAPO [38] recommends API patterns by extracting API related
    information from the developer''s context. The resulting data is clustered and
    ranked according to their similarity with the client code. In this respect, the
    system can be fooled with malicious code intentionally inserted into similar projects.
    Wang et al. propose UP-Miner [35] exploiting SeqSim and BIDE to mine from source
    code. Since UP-Miner relies on a similarity measure, it may recommend to developers
    malicious code embedded in projects disguised as similar. DeepAPI [10] generates
    relevant API sequences starting from a natural language query. It employs an RNN
    Encoder-Decoder to encode words in context vectors used to train the model. As
    the corpus is collected from GitHub projects, a hostile user can easily inject
    perturbations during the data gathering phase, i.e., feeding the system with interfered
    projects. PAM [8] has been proposed to extract relevant API patterns from client
    code by using the structural Expectation-Maximization (EM) algorithm to infer
    the most probable items. The mined API patterns are then ranked according to their
    probability. Push and nuke attacks could easily modify the final ranking obtained
    by the tool, i.e., operating on terms'' occurrences to favor or defame a certain
    pattern. FINE-GRAPE [29] delivers relevant APIs by relying on the history of the
    related files. It parses GitHub projects, discovers, and ranks the relevant API
    calls according to their history, i.e., methods, annotations, and classes from
    every API version. FINE-GRAPE is prone to manipulations which forge an artificial
    history of API calls in GitHub projects. FOCUS [22] suggests APIs by encoding
    projects in a tensor and using a collaborative-filtering technique. Since it works
    on data mined from similar projects, FOCUS is not immune from poisoning attacks,
    i.e., an adversary can create fake projects with toxic APIs and pose them as legitimate
    to trick FOCUS into recommending these calls.


    # 3 PROOF OF CONCEPT


    We report a preliminary investigation into the implication of AML on two existing
    RSSE. The study has been conducted on two library recommenders, i.e., LibRec [33]
    and CrossRec [21] (cf. Table 1). Such tools are chosen due to the following reasons.
    LibRec is a well-established tool, considered to be the first library recommender
    system. CrossRec is a more recent approach, which has been shown to outperform
    LibRec. Both tools have the replication package available, 12 allowing us to fully
    make use of the available source code and tailor it to the study needs.


    # 3.1 Problem statement


    We consider a scenario in which, when developing new software, programmers rely
    on a recommender system to find and use in their code third-party libraries that
    offer the desired features. For instan ce, the developer is searching for libraries
    for parsing JSON documents and the system should be able to suggest those that
    are used by similar projects. We simulate an attacker attempting


    to inject a honeypy library with malicious code (e.g., by referring to the previous
    example, a malicious JSON parser), let it be lib*, into the active projects. Given
    that, under normal circumstances, the systems would never recommend lib*, since
    the library has not been invoked anywhere. To this end, we forcefully favor lib*
    push attacks (cf. Section 2.1), so that, in the end, the library will be suggested
    to projects.


    While in many cases experienced developers would simply rely on well-known libraries,
    sometimes a malicious library, which is properly documented (i.e., providing useful
    features), and (artificially) upvoted, may still be adopted by some. Moreover,
    while our evaluation in this paper is limited to library recommendation, a similar
    attack scenario could happen for recommenders that suggest code snippets, e.g.,
    MUSE [17], PAM [8], or FOCUS [22, 23].


    The name lib* has been chosen for illustration purposes only, so as to facilitate
    the reading. In practice, to avoid being detected, an attacker probably gives
    the library a copycat name, i.e., one that closely resembles a popular library,
    aiming to disguise it better. In fact, typosquatting has been reported in recent
    work [6], and this indeed suggests an evident threat to the adoption of libraries.
    For instance, a malicious library has been named as “jellyfish” to deceive developers
    into believing it “jellyfish”, the authentic library.3 In this way, developers
    would adopt the disguised library without hesitation, once it has been suggested
    by recommenders.


    > Summary

    > Altogether, this is to stress that the risk of being fooled by malicious libraries
    in practice is present. As such, software developers who use recommender systems
    may suffer if the issue of dealing with this type of attack is not adequately
    studied.


    # 3.2 Study design and dataset


    Both LibRec and CrossRec suggest to active projects, i.e., the ones under development,
    by searching for libraries from the most similar projects in the training data
    [21].


    ![](img/76d243b52f833e9ce35dc69d50c47b91_2_0.png)


    Figure 1: Manipulation of library usages for a fake project.


    When LibRec and CrossRec learn from existing projects to provide recommendations,
    they treat a project''s library usage as a vector, whose each entry corresponds
    to a library: 1 means that the library is included in the project, 0 otherwise
    [21, 33]. To attack a recommender, there are various approaches to populate ratings
    for fake user profiles [3, 16]. Unfortunately, they cannot be directly applied
    to forge projects, since they deal with multi-level ratings, while in library
    recommendation there are only two ratings (0 and 1). Thus, to create a training
    set for the LibRec and CrossRec tools, we have to devise a new method to produce
    fake projects as follows. A project''s vector is divided into two independent
    parts, namely filler libraries and target library (cf. Fig. 1). We fill in the
    former with a set of libraries from training data, while the latter is set to
    lib*. This aims to achieve two goals: (i) making the fake project be similar to
    active projects; and (ii) boosting the presence of lib*.'
