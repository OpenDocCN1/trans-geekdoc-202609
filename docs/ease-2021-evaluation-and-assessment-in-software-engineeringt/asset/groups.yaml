    | | CrossRec [21] | JSS | 2020 | GitHub |

    | | LibSeek [12] | TSE | 2020 | Google Play, GitHub, MVN |

    | API rec. | MAPO [38] | ECOOP | 2009 | SourceForge |

    | | UF-Miner [35] | MSR | 2013 | Microsoft Codebase |

    | | DeepAPI [10] | ESEC/FSE | 2016 | GitHub |

