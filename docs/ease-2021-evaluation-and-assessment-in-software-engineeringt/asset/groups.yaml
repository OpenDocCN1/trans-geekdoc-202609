    \ [16]。此类活动生成扰动以欺骗和干扰系统，导致故障，损害其推荐能力。\n\n这些攻击的最终目标是操纵目标项目，从而对最终推荐产生负面或正面影响 [11]，具体取决于攻击者的意图。例如，在图像分类中，攻击者通过添加非随机噪声来构造输入图像，使其被\
