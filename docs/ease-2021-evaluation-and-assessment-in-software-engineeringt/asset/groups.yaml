    \n## 摘要\n\n近年来，我们目睹了机器学习算法在多个领域（包括软件工程推荐系统（RSSE）的开发）中应用的显著增加。尽管研究人员专注于底层机器学习技术以提高推荐准确性，但鲜有关注使此类系统对恶意数据具有强健性和韧性。通过操纵算法的训练集，即大型开源软件（OSS）仓库，有可能使推荐系统易受对抗性攻击。本文对对抗机器学习及其对RSSE可能产生的影响进行了初步调查。作为概念验证，我们展示了被操纵数据的存在对两个最先进的推荐系统结果的负面影响程度，这两个系统向开发者推荐第三方库。我们的工作旨在提高软件工程社区对对抗技术及其影响的认识。我们还建议为推荐系统配备学习规避对抗活动的能力。\n\
    \n## 关键词\n\n推荐系统，对抗机器学习\n\n### ACM 参考格式：\n\nPhuong T. Nguyen, Davide Di Ruscio,\
    \ Juri Di Rocco, Claudio Di Sepio, and Massimiliano Di Penta. 2021. Adversarial\
    \ Machine Learning On the Resilience of Third-party Library Recommender Systems.\
    \ In Evaluation and Assessment in Software Engineering (EASE 2021), June 21–23,\
    \ 2021, Trondheim, Norway. ACM, New York, NY, USA, 7 pages. https://doi.org/10.1145/3463274.3463809\n\
    \n## 1 引言\n\n为应对日常编程任务，开发者访问和浏览各种信息来源 [5]。鉴于正式和非正式文档来源的丰富，问题不在于信息缺乏，而在于信息过载 [18,\
    \ 19]。最近，许多研究已开展以开发方法和工具——软件工程推荐系统（RSSE）——为开发者提供自动化辅助 [10, 21, 25]。\n\nRSSE 的开发涵盖多个阶段，包括底层算法的设计或现有算法的复用。机器学习（ML）技术是开发者在构思新推荐系统时的自然选择之一\
    \ [26]。这意味着，例如，代码元素（代码片段或 API）的推荐是从现有代码库或非正式文档中学习的。因此，推荐质量取决于底层数据的质量，其噪声问题此前已有报告\
    \ [14]。\n\n更糟糕的是，用于训练推荐系统的在线数据可能被用于恶意目的。对抗机器学习 [13, 34]（AML）是一门研究 ML 系统（特别是推荐系统）中安全问题的领域\
    \ [7]。研究已致力于识别可能的威胁并寻求适当的对策 [1, 36]。例如，Anelli 等人 [1] 使用诱导攻击 [32] 来操纵基于链接数据运行的协同过滤推荐系统。此外，Wang\
