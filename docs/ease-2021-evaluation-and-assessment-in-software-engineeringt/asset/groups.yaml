    > 即使采用简单的伪造，LibRec 和 CrossRec 的鲁棒性也会受到严重损害。两个系统都会向开发者推荐恶意库，一旦被调用，就会使软件客户端面临风险。


    ### 3.3.2 RQ2: \(\alpha\) 和 \(\gamma\) 如何影响攻击的有效性？


    攻击者关注 \(\alpha\) 和 \(\gamma\)，这两个参数在其控制之下，可以进行调整以使攻击更有效。表 2 和表 3 的结果表明，通过添加更多虚假项目，可以提高两个系统的命中率。


    例如，对于 LibRec，当 (\(\alpha\)=5%, k=10, \(\gamma\)=6) 时，HR@10 为 0.273；而当 (\(\alpha\)=10%,
    k=10, \(\gamma\)=6) 时，相应的命中率 HR@10 为 0.418。同样，对于 CrossRec（参见表 3），当 (\(\alpha\)=5%,
    k=20, \(\gamma\)=6) 时，HR@10 为 0.207，而 \(\alpha\)=10% 时的命中率 HR@10 达到 0.457。当 \(\gamma\)=6
    且 k=20 时，获得最大命中率，即 HR@15 = 0.530。对于 CrossRec，当 \(\gamma\) > 6 时，命中率会下降，这意味着攻击者应使用较小的
    \(\gamma\) 以获得更高的命中率。对于 LibRec，最大 HR@15 为 0.670，在 \(\gamma\)=10 时获得。


    我们以两种模式运行了 LibRec 和 CrossRec，即带有虚假项目和不带有虚假项目，并发现它们的成功率几乎没有差异。由于篇幅限制，我们仅报告两种模式下的平均
    SR@N 差异，LibRec 和 CrossRec 分别为 2.6% 和 2%。


    这意味着，推荐中无意中包含虚假项目很难被察觉，仅通过查看准确率的变化也无法检测出来。


    > 通过添加更多虚假项目（\(\alpha\)），攻击者可以增加两个系统中受感染客户端的数量。较小的 \(\gamma\) 对 CrossRec 更危险，而较大的
    \(\gamma\) 对 LibRec 造成的危害更大。


    ### 3.4 讨论


    本小节讨论了试图 *破坏系统安全（标记为 \(\times\)）* 的攻击者的视角，以及 *防御系统免受敌对攻击（标记为 \(\checkmark\)）*
    的管理员的视角。


    尽管在评估中我们仅执行了推送攻击，但相同的方法论可以应用于实施核攻击，即从推荐中移除一个有用的库（\(\times\)）。此外，我们仅尝试了一个恶意库，但评估可以轻松扩展到一组库。


    我们考虑了 LibRec 和 CrossRec 的不同设置，旨在研究系统在各种条件下的能力。在实践中，攻击者可能不知道这种设计，重要的是她如何填充虚假项目，以便恶意库会被推荐（\(\times\)），而不考虑系统的配置。


    为了简化评估，我们在元数据层面生成了虚假项目，即假设所有项目都已成功从 GitHub 获取。4 在实践中，有必要将这些项目植入 GitHub，使其看起来合法（\(\times\)）。事实上，此类事件最近已被报告，其中数百个推广恶意软件应用的
    GitHub 仓库被发现。5 据我们所知，针对此类滥用行为的研究仍处于起步阶段 [27]。


    为了寻找可信来源，推荐系统通常选择仅从拥有大量星标和/或分叉的仓库中爬取，或者使用推荐系统为选择其训练集所采用的任何标准（\(\checkmark\)）[21]。在这种情况下，攻击者可能需要通过伪造这些信息来伪装植入的项目，例如，使用伪造账户进行星标和分叉（\(\times\)）。因此，需要机制来检测此类伪造（\(\checkmark\)）。


    要渗透系统，引入库只是第一步。第二步是诱骗开发者通过调用其函数来调用该库。因此，攻击者还需要操纵 API 或代码推荐系统（\(\times\)），例如最近发表的
    [8, 22, 29]。我们推测，第 3.2 节中描述的类似技术可用于注入有毒 API。


    ## 4 相关工作


    近年来，对抗机器学习（AML）话题已引起研究界的广泛关注。在图像分类中，引入了多种对抗技术来向图像添加扰动 [9, 20]，这些图像随后会被人类正确识别。然而，DNN
    容易受到这些攻击，因为它们无法对裁剪后的图像进行分类。


    对于推荐系统，已有关于 AML 的各种研究 [7, 11, 16]。最近，Anelli 等人 [1] 提出了一种使用刷量攻击 [32] 来操纵基于链接数据运行的协同过滤推荐系统的尝试。在我们的工作中，我们对使用
    GitHub 数据运行的 CrossRec 执行了类似的推送攻击。然而，我们需要设计自己的方法来策划虚假项目。


    Wang 和 Han [36] 提出了一种改进的贝叶斯个性化排序（BPR）技术，通过在基于协同过滤的推荐系统领域利用基于对抗训练的平均策略（AT-MBPR）。通过利用用户评分，底层
    MBPR 模型提取并将用户反馈分为三类。之后，算法在初始训练数据中注入对抗扰动以构建噪声数据集。然后，一个迭代过程优化目标函数。


    已提出多种方法来防御推荐系统免受攻击 [16]。开发了一种基于强化学习（RL）的攻击无关检测模型 [4]。该模型利用注意力分类器，通过测量输入数据遭受扰动的概率，来区分对抗样本和正常样本。


    ## 5 结论与未来工作


    本文对 RSSE 中 AML 话题进行了初步调查。尽管推荐库和 API 调用的 RSSE 已获得动力，但我们展示了它们如何容易受到虚假输入数据的对抗攻击。通过破坏工具的推荐列表，攻击为未经授权访问软件客户端铺平了道路。


    作为未来工作，我们计划设计和评估有效的对策，以抵御针对 RSSE 定制的攻击。这将通过研究对对抗攻击具有感知能力并能捕获它们的学习算法来实现。此外，对抗尝试应转化为训练过程的特征，即，RSSE
    不仅应从有用模式中学习，还应能够学习如何避免敌对模式。除了利用 GitHub 的推荐系统外，我们还计划调查利用 Stack Overflow (SO) 等问答论坛讨论的
    RSSE 在多大程度上容易受到对抗攻击。例如，Prompter [25] 利用开发者在 IDE 中编写的代码和注释来推荐 SO 上的相关帖子。如果有人在 SO
    帖子中隐藏恶意代码，基于 SO 的推荐系统可能会受到攻击，尽管审核和投票机制可能会使此类攻击更具挑战性。我们计划调查的另一条研究线与用于 API 推荐和代码补全的在线学习系统有关。我们计划评估此类推荐系统在多大程度上容易受到对抗攻击，并识别可能的对策以减轻相关后果。


