    both risks and countermeasures. To the best of our knowledge, even though AML
    is gaining much attention in the software engineering domain, e.g., in testing
    and applications of DNNs [31], AML has not been investigated in the context of
    RSSE yet.


    In this paper, we report the first study on threats that cause harm or danger
    to RSSE suggesting third-party libraries and API function calls. We select these
    two types of recommendations as they are representative of scenarios in which
    _(i)_ the recommendation is learned from OSS repositories; and _(ii)_ the outcome
    of a malicious recommendation, e.g., the usage of a library or an API, can result
    in severe security holes [2].


    Based on thorough observations and on the analysis of the existing literature,
    we realized that most of the efforts to improve RSSE have been made to enhance
    their accuracy. As far as we can see, no work has investigated the problem of
    using intentionally falsified data to compromise recommender systems’ capabilities,
    as well as conceptualizing countermeasures. In this respect, our work is the first
    one that brings in the issue of AML in RSSE.


    Most RSSE heavily rely on open data sources, such as GitHub, the Maven Central
    Repository, or Stack Overflow, which can be steered by adversaries [37]. In other
    words, these systems are vulnerable to attacks equipped with forged input data.
    Therefore, there is the need for comprehending the likely threats, with the ultimate
    aim of conceiving counteractions to increase the resilience of RSSE.


    We first provide an overview of state-of-the-art API and third-party library recommenders,
    discussing how they could be potentially affected by AML. Through a literature
    search from premier venues in Software Engineering for adversarial techniques,
    we show that there are considerably evident threats to RSSE. Then, we perform
    a preliminary examination of two existing systems for recommending third-party
    libraries. The experimental results reveal a worrying outcome: by a simple manipulation,
    we can seamlessly spoil the final recommendations, putting software software clients
    at risk.


    +   This paper makes the following contributions:

    +   - A discussion on the possible adversarial attacks to state-of-the-art RSSE
    for third-party libraries and API calls;

    +   - A preliminary evaluation on two library recommender systems to perturb their
    recommendations.


    **Structure.** Section 2 provides background notions about adversarial attacks
    and their effects on RSSE. Section 3 reports an initial evaluation on two RSSE.
    Section 4 makes an overview of related work, while Section 5 outlines future work
    and concludes the paper.


    # ## 2 ATTACKS AND THREATS TO RSSE


    In the following subsections, we first (Section 2.1) provide an overview of various
    types of attacks to recommender systems, and then (Section 2.2) review state-of-the-art
    RSSE suggesting third-party libraries and API function calls, while analyzing
    the AML threats they might be exposed to.


    # ### 2.1 Classification of attacks


    Attacks to recommender systems are classified into two main categories as follows
    [7]:


    +   - **Poisoning attacks** spoil an ML model by falsifying the input data;


    +   - **Evasion attacks** attempt to avoid being detected by hiding malicious
    contents, which then will be classified as legitimate by ML models.


    With poisoning attacks, there are two possible interventions:


    +   - **Push attacks** favor the targeted items, thus increasing the possibility
    of being recommended;


    +   - In contrast, **nuke attacks** try to downgrade/defame the targeted items
    [1, 16], compelling them to disappear from the recommendation list.


    In the scope of this paper, we focus on poisoning attacks as they are easy to
    conduct, yet effective. The remaining attacks are left to our future work.


    # ### 2.2 Potential risks to RSSE for mining libraries and API calls


    We review notable RSSE that support the development of software projects by delivering
    third-party libraries and API calls. Table 1 lists the systems according to their
    functionality in chronological order. By studying their internal design, we discuss
    possible vulnerabilities according to the previously-given categorization of attacks.


    > **Library recommendation.** LibRec [33] recommends libraries using a combination
    of rule mining and a collaborative-filtering technique to mine libraries from
    projects similar to the one being developed. LibCUP [28] suggests libraries that
    have strong ties by using a clustering approach to identify and recommend co-usage
    patterns. LibD [15] provides libraries to Android apps using a clustering technique.
    First, it decompiles applications to build a control flow graph of packages, classes,
    and methods belonging to the projects. Then, the graph is used to extract features,
    and grouped by a similarity function. Ouni _et al_. propose LibFinder [24], providing
    libraries based on a multi-objective search-based algorithm. Being built with
    a collaborative-filtering technique, CrossRec extracts libraries from similar
    projects [21]. LibSeek [12] relies on a matrix factorization technique to deliver
    relevant libraries for mobile apps, obtained by collecting neighborhood information,
    i.e., characteristics of similar libraries.


    As it can be seen, all the considered systems leverage open sources, e.g., GitHub
    or Android markets, for training. Moreover, they mine libraries using similarity-based
    measures, either a similarity function, or a clustering technique. Thus, they
    are exposed to perturbations with malicious content hidden in OSS projects. We
    therefore conjecture that, by fabricating projects with bogus data, attackers
    can favor (push attack) or defame (nuke attack) a library [1, 7, 32]. In other
    words, they can make a good/useful library'
