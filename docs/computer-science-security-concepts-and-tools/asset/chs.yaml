- "# 计算机科学安全：概念与工具\n\n\n\n\n\n17. 用户协议\n\n\n    - 表 6.4. 非对称密钥加密\n\n\n\n\n\n\n纪念我的父母，致我的儿子\
  \ Mohamed Bairam 和 Iyed，致我的女儿以及世界上所有和平与自由的支持者\n\n\n\n\n\n\n\n\n\n\n\n| --- | ---\
  \ |\n| AH | 认证报头 |\n| CLI | 命令行接口 |\n| DMZ | 非军事化区 |\n| DSA | 数字签名算法 |\n| H-IDS\
  \ | 基于主机的入侵检测系统 |\n| IDS | 入侵检测系统 |\n\n\n\n\n\n\n\n\n\n# 引言\n\n从古代起，人类就一直在寻求安全，并对此给予高度重视，这种重视源于保护自己免受外部因素影响的需求。\n\
  \n随着计算机的出现及其全面发展，安全问题变得显而易见：这是一个全新的多方面问题，影响着计算机领域的所有活动领域、用户和设备。\n\n安全包含许多方面：\n\n\
  * – 第一个方面涉及能量层面。它包括提供和维护计算机系统正常运行所需的必要能量。\n* – 第二个方面涉及物理层面。它包括从物理上确保计算机系统位置和物质基础设施的安全，例如电缆和无线通信系统、用于互连、传输和安全的中间设备（`repeaters`、`hubs`、`switches`、`routers`、`firewalls`\
  \ 等），以及工作站和服务器的终端处理设备。物理安全使计算机系统免受自然因素（如洪水和火灾）和人为因素（如盗窃）的威胁。\n* – 第三个方面是计算机安全特有的方面，与前两个适用于任何需要能量和关键材料所有权的工业领域不同。该方面的目标是解决与计算机技术相关的特定安全问题，一方面确保安全使用并防止未经授权的访问，另一方面保护专有软件和数据免受任何未经授权的使用。\n\
  \n尽管目前还没有彻底的、现成的安全解决方案，但它们仍在持续开发。然而，它们对于解决安全问题来说始终是不够的。我们面临着一场持续的战斗：一方是负责安全的人员，另一方是攻击者、黑客和入侵者。\n\
  \n这场战斗体现在双方各自的工作组中，例如 `Anonymous` 组织组以及关注安全的国际组织也是如此。\n\n攻击者从不停止寻找和识别缺陷，创建适当的攻击手段来利用相关漏洞，并克服有时部署的防御措施。\n\
  \n这一挑战要求另一方投入资源，使我们能够动员人力资源，以应对威胁计算机系统安全的攻击和各种恶意行为。近年来，人们发明并不断开发了多种安全方法——组织、智能、物质和软件等方面，在数量和质量上都在不断提高。\n\
  \n安全构成了一项非常重要的挑战，尽管在大多数情况下它由于无知而被忽视。应对这一挑战并非易事，因为缺乏彻底的解决方案或清晰准确的应用方法。保证最低安全的唯一途径是结合多种社会、文化和技术措施。尽管如此，这些安全措施仍然是动态的并取决于具体情况。我们需要一种技术智能，以便对正在使用的安全规则进行持续修改和修正。\n\
  \n专家和外部力量的干预是定义和演变安全规则的具有重大价值的步骤。这种干预可以是贯穿整个公司的安全审计，也可以是专家在为 `SMEs/SMIs`（中小企业/中小工业）咨询期间的直接干预。\n\
  \n必须应用许多通用建议以确保达到必要的最低要求：\n\n* – 第一，安全部门或团队必须为公司配置组织架构，并分配该部门或团队的负责人，该负责人必须负责安全政策。\n\
  * – 第二，公司必须对所有员工实施安全意识计划，以最大限度地减少与人为错误相关的风险。\n* – 第三，应定期进行安全审计，在漏洞被利用之前识别并修补。\n\
  * – 最后，必须开发并测试一个稳健的事件响应计划，以确保在发生安全漏洞时能够快速恢复。\n\n\n\n\n各种形式的攻击不断层涌出现。事实上，统计数据已经了威胁计算机系统的危险程度以及由此导致的材料浪费。这两个方面毫无疑问都使安全成为一个至关重要的问题，也是一项不可或缺的需求。\n\
  \n面对这些问题，我们必须在安全方面投入资金，一方面是为了建立一种特定的文化，另一方面是为了建立技术解决方案。前者主要涉及计算机用户，而不考虑计算机如何被使用或用户的知识水平（无论这些知识是通过课程、培训、论坛、手册还是海报获得的）。后者涉及计算机系统本身，通过建立安全防护措施和技术解决方案来解决。\n\
  \n计算机系统的安全性包含许多方面，从提供电源到物理控制，最后到访问管理和软件安全防护措施。它特别关注信息以及操纵信息的实体。后者是最重要的部分，也是安全通常被简化的领域，可以分为四个必须满足的要素，以确认计算机系统是否安全。\n\
  \n## 1.2. 安全的原因\n\n随着计算机的大规模演进和使用的社会化，计算机安全多年来一直处于核心。促进计算机安全作为一个重要课题出现的原因可以分为两个大类：第一是技术性的，与服务和技术本身有关；第二是社会性的，与计算机的大规模、多样化和通用化有关。\n\
  \n### 1.2.1. 技术问题\n\n计算的发展尽管具有优势，但一直被恶意用于威胁安全。安全起初被忽视，但为了面对新出现的问题并避免被黑客利用，安全变得至关重要。\n\
  \n#### 1.2.1.1. 软件工程的发展\n\n软件工程经历了一场巨大的演变，其标志是使用了大量的编程语言和开发技术，这些技术以某种方式被集成在大多数软件软件包中；我们可以以\
  \ `Microsoft Office` 为例，它允许用户开发宏（这是被称为“宏病毒”的病毒的基础，它会感染 Office 文档）。\n\n随着时间的推移，用户获得了越来越多的编程专业知识。编程机会和专业知识的大规模发展被用于不诚的目的是，在某些情况下用于创建攻击软件（分析工具、扫描工具）或注入入侵工具（病毒、蠕虫等）。\n\
  \n如今，攻击工具在互联网上随处可见。终端用户可以获取它们，且使用时不需要具备任何资质。它们有多种形式（Web 应用程序、图形应用程序等）。此外，缺乏经验的用户无法将它们与合法应用程序区分开来，并由于无知或疏忽而启动它们，危及自身系统的安全。许多坏习惯加剧了这一问题。\n\
  \n#### 1.2.1.2. 网络的发展\n\n我们正在经历网络传播的大发展，这促进了通信和信息传输。这些机会和服务可能被入侵者滥用以攻击或交换可疑信息。\n\
  \n网络带来的缺点是两个因素的副产品。第一个是网络在许多领域的大量使用，使得尽管存在许多差异也能相互连接。第二个涉及网络技术本身，它基于 `TCP/IP`（传输控制协议和互联网协议），该协议尽管简单高效，但在允许终端用户访问各种工具和服务方面存在许多漏洞。\n\
  \n#### 使用**\n\n目前，我们正处于计算和电信技术的革命时代。得益于网络的泛滥，信息可以在几分之一秒钟内从世界的一端传到另一端，而 `Internet`\
  \ 在其中起着最重要的角色。因此，计算机不是孤立的；它每天与成千上万台计算机通信，并显式或隐式地执行成千上万个对其正常运行可能恶意的程序。这种危险由于配件（尤其是外部驱动器）的使用而加剧。\n\
  \n网络代表着危险的信息公路，被黑客和攻击程序利用并促进通信。住在孤立的房子里很困难，而为那里修路的行为让生活更方便，同时也方便了劫匪的攻击。\n\n####\
  \ 技术统一性 (TCP/IP)\n\n`Internet` 的出现和普及促进了 `TCP/IP` 协议族的使用，即使在本地（内域网）也是如此。由于每个人都熟悉\
  \ `TCP/IP` 服务和协议，这意味着可能创建针对 `TCP/IP` 内部已知漏洞的攻击。我们现在看到了技术的统一性，尽管这对计算的整体发展有益，但它创造了一个可以被入侵者利用的缺口，他们可以专注于开发针对\
  \ `TCP/IP` 且适用于攻击任何网络节点的攻击工具。\n\n`TCP/IP` 是冷战期间为美国国防部 (`DoD`) 创建的。当时的目标是部署一种健壮的通信系统，该系统能够在关键情况下工作，即使部分损坏也能运行。建议的解决方案是一个具有“终端智能”的系统，这与安全原则相矛盾，因为它将大量功能置于终端用户的触及范围内。随着\
  \ `Internet` 的普及，由于缺乏通用的解决方案，安全问题变得日益严峻。\n\n### 1.2.2. 社会因素\n\n社会因素与技术因素同样重要，因为我们还看到了一个具有自身特征、与现实世界并行发展的虚拟世界。产生了一些新术语，例如网络犯罪、网络欺凌等——这些术语反映了虚拟世界固有的问题和特征，特别是发生在社交网络中的特征。\n\
  \n我们现在谈论的是计算文化的普及和移动设备的广泛使用，这些被视为人人都可以使用的普通工具。相反，这导致了连接设备的环境（`IoT` 和 `IoE`）。缺乏管理规则或公司安全准则有助于信息的传播：因此我们可以谈论社会工程。\n\
  \n#### 1.2.2.1. 信息社会\n\n由于计算文化的普及和 `Internet` 的广泛使用，我们现在是信息社会的一部分，离开它就无法生存。“信息社会”这一术语指的是信息技术发挥核心作用的社会。\n\
  \n#### 1.2.2.2. 社会工程\n\n社会工程技术的使用提供了从安全主管和管理员处提取机密的方法。\n\n“社会工程”在法语中仍被称为“心理破坏”，是一种利用一个或多个人的信任来获取机密的做法^(1)。\n\
  \n这种攻击可以面对面进行，也可以通过社交网络和其他通信手段进行。受害者通常是计算机网络管理员。\n\n\n\n\n\n### 1.3.1. 攻击的被动/主动分类\n\
  \n导致安全受到威胁的攻击可分为两类：被动和主动，取决于它们的影响以及对通信过程的参与程度。我们也可以将其称为侦察攻击和访问攻击。\n\n#### 1.3.1.1\
  \ 被动攻击（侦察攻击）\n\n被动攻击也称为侦察攻击，由被动观察信息或其特征组成，无论信息是在计算机内部还是通过网络传输。这种攻击可以通过一系列嗅探器或观察者来实现。这类软件在互联网上非常容易找到，它们一方面可以利用许多漏洞来扫描系统和网络的特征及配置，另一方面可以分析流量以提取信息。\n\
  \n侦察攻击可以通过一系列基本动作实现：\n\n- 向目标的初始请求；\n- 对目标进行扫描；\n- 扫描 IP 地址；\n- 扫描漏洞；\n- 工具利用（适当的嗅探器）。\n\
  \n我们可以引用以下嗅探器作为示例：`Wireshark`、`WinPcap`、`SiteSniffer`、`SocketSniffer`、`Packetetyzer`、`PacketViewer`、`CommView`。\n\
  \n我们可以区分许多场景：\n\n- 用户：这发生在特定通信的参与者身份被发现时。\n- 消息间隔时间：这发生在消息频率被发现时，从而允许识别应用程序的性质（交互式等）。\n\
  - 信息本身：这是最严重的一种攻击，即通信信息的内容。\n\n#### 1.3.1.2 主动攻击（访问攻击）\n\n主动攻击也称为访问攻击，由对信息和/或通信过程采取行动组成，因此比被动攻击更严重。它涉及数据或消息的修改、进入网络设备或干扰系统的正常运行。\n\
  \n访问攻击的主要目标包括：\n\n- 收集数据；\n- 获取访问权限；\n- 授予更大的访问权限。\n\n我们可以区分不同的场景：\n\n- 欺骗连接：这发生在在没有连接权限的情况下与服务器建立连接时。这种连接允许攻击者像是账户所有者一样进行更改。他们可以删除文档、更改配置等。\n\
  - 拒绝服务：这发生在一个或多个授权用户被阻止访问服务时。它包括攻击服务器并使其离线，从而瘫痪所有访问。这种攻击被称为 `DoS`（拒绝服务）。我们也可以称之为\
  \ `DDoS`（分布式拒绝服务），这是当主计算机成功控制了大量计算机并利用它们攻击受害者使其离线时发生的攻击。\n- 消息篡改：这通过在稍后重新插入之前捕获某些消息来修改消息顺序。\n\
  - 通信中断/延迟：这发生在黑客成功停止连接或延迟消息访问和传输时。\n- 消息内容的修改/泄露：最严重的行为，由修改或公开发送消息的内容组成。\n- 端口重定向：这泛指重定向流量或将响应、操作或命令重定向到第三方未经授权的计算机。\n\
  - 中间人：这允许第三方在通信的两个实体之间介入的攻击，而后者毫无察。\n- 缓冲区溢出：这种攻击由利用缓冲区容量（在编写较弱的语言如 `C` 中是可能的），目的是在内存中放置精心的代码并导致系统或网络故障。\n\
  - IP、MAC、DHCP 欺骗：这种攻击允许利用授权计算机的身份（`IP address`、`MAC`）进行攻击或重定向信息。\n- 数据丢失：代表了最昂贵的攻击，因为一旦丢失，数据就需要巨大的努力才能恢复并恢复到原有水平，这在大多数情况下是无效的，并可能给公司带来非常严重的财务影响。导致数据丢失的漏洞点包括：\n\
  \n- 邮件访问/非安全网页邮箱；\n- 未经检查的外围设备；\n- 云存储；\n- 可移动式介质；\n- 不满足最小安全要求的适当访问检查。\n\n### 1.3.2.\
  \ 攻击的直接/间接分类\n\n在互联网上，攻击可以利用其自身的身份或资源直接针对目标，也可以隐藏在中间人之后，在某些情况下使用后者的身份和/或资源。\n\n\
  #### 1.3.2.1 直接攻击\n\n这是简单的攻击，也是最容易检测的。它由使用目标自身的身份（`IP address`、`MAC address`）和资源（`memory`、`CPU`\
  \ 和硬盘）向目标发起攻击请求组成，如图 1.1 所示。这些攻击变得越来越稀有，因为最严重的黑客寻求隐藏自己或获取进一步的能力，由于用户已经开发了检测直接发起攻击连接的方法。\n\
  \n![图 1.1. 直接攻击]\n\n#### 1.3.2.2 间接攻击\n\n这是最复杂且最难追踪的攻击。有两种：\n\n- 第一种攻击是反弹攻击，指的是为了其身份或资源而被利用的中间计算机。\n\
  - 第二种攻击是响应攻击，利用服务器作为中间计算机来攻击第三台计算机。\n\n##### 1.3.2.2.1 反弹攻击\n\n黑客试图控制中间计算机（通常通常具有更好的资源），如[图\
  \ 1.2]所示。它将被用于创建一个反弹，使得受害者的身份和资源被用于攻击其计算机，导致真实攻击者无法以任何方式识别。我们称之为链式攻击。这种类型攻击的新变体基于三个或多个链式攻击，在这种情况下，我们处理的是两个或多个反弹。反弹本身是一个受害者，尽管它是攻击最终受害者的起点。\n\
  \n![图 1.2. 通过反弹实施的间接攻击]\n\n##### 1.3.2.2.2 响应攻击\n\n攻击者向服务器发送请求，其方式是将响应发送到第三台计算机，如[图\
  \ 1.3]所示。攻击涉及第三台计算机，因为它接收了它未请求的响应，这种响应可能会引入错误、抑制其功能、迫使其做出不当反应，甚至导致其退出服务。\n\n![图\
  \ 1.3. 通过响应实施的间接攻击]\n\n响应攻击必然通过一个不会本身被攻击的服务器进行，而反弹攻击则表现为两个链式攻击。\n\n\n\n\n\n黑客从未停止过识别或制造系统和网络漏洞，在这里我们将展示几个示例。\n\
  \n### 1.3.3.1. SQL 注入\n\n在通过以下 SQL 请求进行身份验证的情况下，这允许用户在没有密码的情况下连接：\n\n如果用户在登录处输入\
  \ \"`a OR 1=1 #`”并在密码处输入任何内容，则请求将变为：\n\n该请求仍然有效，`#` 将其后的内容作为注释。对于使用 Jomla 开发的网站，使用单引号（`’`）也会破坏身份验证。\n\
  \n### 1.3.3.2. TCP SYN\n\nTCP 连接通过三个步骤完成（三次握手），如图 1.4 所示。发起通信的计算机发送一个请求 `SYN` 连接的请求；接收请求的计算机发送一个\
  \ `ACK SYN C+1` 确认，以及 `SEQ S` 序列号，并开始计时，等待对该 `ACK SEQ S+1` 序列号的确认。\n\n如果发起连接的计算机在超时结束时没有发送最后一条消息（`ACK\
  \ SEQ S+1`），另一台计算机将创建一个包含不同连接上下文的大数据文件。如果未完成 TCP 连接的数量增加，内存将被耗尽，被攻击的计算机将停止服务。在这种情况下，我们称之为\
  \ TCP SYN 攻击。\n\n\n**图 1.4.** TCP SYN 攻击\n\n### 1.3.3.3. 缓冲区溢出\n\n这是一个非常高效但极其复杂的攻击。它通过向缓冲区中写入比其大小更大的信息来注入程序，从而覆盖代码并插入有助于控制被攻击程序的序列。\n\
  \n缓冲区溢出错误既不会在编译期间出现，也不会在执行执行期间系统性地出现。当缓冲区预留空间之外的内存被另一个变量使用时，它会导致崩溃。所使用的内存甚至可能对应整个操作系统。\n\
  \n### 1.3.3.4. 邮件炸弹\n\n如果电子邮件账户受到不同的信息轰炸，就会发生这种攻击，在某些情况下，这些信息会自动发送到联系人列表中出现的电子邮件地址。\n\
  \n### 1.3.4. 统计数据\n\n在本节中，我们仅满足于提供来自 `CompTIA`（计算技术行业协会）统计^(2) 获取的一些关键数据：\n\n* –\
  \ 52% 的损害是由人为错误造成的（人为因素是最大的，这需要意识性培训）。\n* – 80% 的攻击由员工、特别是前员工实施，由于由于疏忽或不负责任（员工合同应考虑责任条款）。\n\
  \n攻击造成的破坏可以分为如下：\n\n* – 44% 的损害表现为浪费时间；\n* – 16% 的损害表现为软件损毁；\n* – 16% 的损害表现为信息丢失。\n\
  \n至于入侵，我们可以给出以下示例：\n\n* – MyDoom 在 2004 年在美国造成了 3800 万美元的损失；\n* – SirCam 在美国造成了\
  \ 115 万美元的损失；\n* – CodeRed 在美国造成了 262 万美元的损失（在九小时内有 250,000 台计算机系统受感染）；\n* – Himda\
  \ 在美国造成了 6.3 亿美元的损失。\n\n## 1.4. 安全目标\n\n统计数据表明，人为因素以疏忽或无知的形式在产生和强化安全漏洞方面具有重要性；这与交通事故的情况相同。由于这个原因，很大一部分安全问题源于人为因素。\n\
