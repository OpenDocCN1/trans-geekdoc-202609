  \n# 2.2. 弱性\n\n## 2.1. 引言\n\n哈希值在某种程度上代表了一种签名，因为原始消息的任何变化都会产生不同的哈希值，这允许检测到对安全实体的任何更改，并因此确认其完整性。在许多可用哈希算法中，最重要的是\
  \ `MD5`（16 字节）和 `SHA1`（20 字节）。\n\n\n\n\n\n1980 年，ARPANet 被分为两个不同的网络：一个是军事用网络（`MILNET`：军事网络，后成为\
  \ `DDN`：国防数据网络），另一个是供大学使用的网络（`NFSNet`：国家科学基金会网络），这是军事部门将其留给了民用领域。构建者的想法是实现去中心化的计算。\n\
  \n1983 年 1 月 1 日，ARPANet 引入了 `TCP/IP`，这成为了互联网的基础。在成为行业不可或缺的一部分之前，它经历了相当大的演变；它也随之带来了安全问题，而这一问题正变得日益重要。\n\
  \n学术界是互联网发展的种子。安全问题最初在在那里出现，但鉴于所共享的信息并不关键，因此未被视为辩论和研究的主。\n\n互联网得到了极大发展，这推动了业界广泛将其作为一种通信手段。鉴于人们会发送关键信息，且互联网用户日益增加、多样化且匿名化，安全问题现在已变得严重。在这一阶段，已经无法回回头；互联网已成为不可避免的必然选择，我们必须找到安全解决方案。\n\
  \n### 2.2.3 互联网与分析能力\n\n在不同的安全服务中，机密性脱颖而出。它会被针对信息以及用户的简单间谍软件所质疑。这种行为之后可能会伴随着修改信息甚至是配置的干预。通过正确的软件，可以实现监视和干预。\n\
  \n### 2.2.3.1 扫描工具\n\n扫描工具是覆盖系统和网络的监控软件。这些工具能够识别计算系统或网络中的实体，例如物理地址和电子地址、名称、开放端口、包括补丁和漏洞在内的操作系统、应用程序、注册表、使用的协议、互连的设备以及不同的配置。\n\
  \n互联网上存在大量的扫描工具，攻击者和间谍可以轻松地下载并利用，这使得扫描行为变得平庸无奇且触手可及。这使得系统和计算机网络的安全面临风险，使访问变得更容易，从而允许识别出系统和网络的局限性和弱点。这让黑客能够编写并启动针对性的攻击，以利用观察到的漏洞。\n\
  \n暴露在扫描之下的计算机系统将呈现出巨大的弱点，因为它会被攻击者和网络观察者监控，这些人可能决定采取行动并对系统和/网络的配置提出质疑。\n\n### 2.2.3.2\
  \ 分析工具（嗅探器）\n\n这些工具允许我们分析和/或修改关于计算机系统的信息。被监视的信息可能存在计算机上，也可能通过网络传播。扫描器分为两类：被动式和主动式：\n\
  \n- `被动扫描器`（用于侦察）仅限于监视信息，而不干预并进行修改。这是一种被动攻击。\n- `主动扫描器`（用于访问）会更新信息，这会导致错误的引入、配置的更改、信息的丢失等。\n\
  \n如前所述，在互联网上存在大量的扫描软件，包括被动的主动的。攻击者可以轻松访问这些工具以观察流量和网络节点处保存的信息，有时通过未经授权的更新来损害它们。互联网上可用的一些嗅探器包括\
  \ `Wireshark`、`MSN Sniffer`、`ICQ Monitor Sniffer`、`Link Sniffer`、`EtherDetect`、`Jitbit\
  \ Network` 和 `EffeTech http Sniffer`。\n\n## 2.3 恶意软件和入侵工具导致的缺陷\n\n恶意软件（Malware），有时被称为有害软件，是一种其目的是在未经受感染计算机用户同意的情况下，对计算机系统造成危害的程序。\n\
  \n目前，这类软件种类繁多，很大一部分可以在互联网上找到。恶意软件可以是病毒、蠕虫、特洛伊马或其他威胁。我们可以将间谍软件与键盘记录器（key loggers）、根内核（rootkits）等区分开。\n\
  \n### 2.3.1 病毒\n\n这些是直接入侵最著名的工具。这类程序的真实名称是自我复制代码，但类比医学领域，它被命名为“病毒”。\n\n病毒的产量随着时间的推移逐渐增加。第一个病毒出现在巴基斯坦，大约在\
  \ 20 世纪 80 年代由 Amjed 兄弟创建。\n\n病毒可以执行各种操作，从发送不希望的消息到格式化磁盘。它可以更新系统或网络的配置，甚至破坏系统、通信设备和装置。\n\
  \n#### 2.3.1.1 定义\n\n病毒是一种自我复制（复制自身）的小型程序，旨在感染其他程序并导致信息的破坏。\n\n#### 2.3.1.2 特性\n\
  \n病毒具有两个内在特性：\n\n- 自我复制；\n- 破坏信息。\n\n第一个特性反映了病毒从一个地方到另一个地方、改变存储介、磁盘、计算机等，无需任何干预或外部协助即可复制自身的能力。\n\
  \n第二个特性反映了这段代码的恶意能力，它会导致数据、程序、配置等受到破坏。\n\n如果病毒允许精确定义的行为，它可以获得其他特性，使其能够隐藏并抵抗系统防护。我们可以区分两种主要特性：变异和多态。\n\
  \n###### 变异\n\n病毒被称为变异的，如果它创建了多个版本（我们称为变体），这些变体在执行的痕迹上有所不同。这种病毒难以验证，因为它在不改变形式或行为的情况下改变外观。\n\
  \n###### 多态\n\n病毒被认为是多态的，如果它以多种形式存在并以多种文件格式呈现（`.exe`、`.bat`、`.sys`）。它像变色龙一样：与其环境融合。这种特性允许病毒改变其特征，使得检测任务变得日益困难。\n\
  \n#### 2.3.1.3 不同形式\n\n病毒有七类主要家族：\n\n- `玩笑类`（Joke）：这种病毒出现的唯一目的是骚扰用户。\n- `虚假报警类`（False\
  \ alarm）：在这种情况下，病毒显示不存在的安全问题或虚拟系统问题。\n- `测试类`（Test）：这种类型的病毒通过向用户提问来监视和发现某些关键信息。\n\
  - `宏类`（Macro）：在这种情况下，我们说的是宏病毒，即基于宏的病毒。这是一种专门 Microsoft Microsoft 应用程序的病毒类型，发生在创建了破坏信息并自我复制的宏时。\n\
  - `批处理类`（Batch）：以批处理文件（`.bat`）形式存在的病毒。\n- `可执行类`（Executable）：以可执行文件或动态链接库（`.exe`\
  \ 或 `.dll`）形式存在的病毒。\n- `系统类`（System）：以系统文件（`.sys` 或 `.vxd`）形式存在的病毒。\n\n#### 2.3.1.4\
  \ 示例\n\n##### 2.3.1.4.1 Klez\n\nKlez 病毒出现在 2002 年初，指的是不断出现的新病毒变体（`Klez.e`、`Klez.g`、`Klez.h`、`Klez.i`、`Klez.k`等）。它利用四种传播模式：\n\
  \n- 网页；\n- 共享文件夹；\n- Microsoft IIS 服务器的漏洞；\n- 文件交换。\n\n\n\n\n\n特别是，它会影响在 Windows\
  \ 95、98、Millennium、NT4、2000 和 XP 操作系统上运行 Microsoft Outlook 的用户，以及 Microsoft Internet\
  \ Explorer 的用户。\n\nKlez 病毒会获取存储在 Microsoft Outlook、Eudora 和即时消息软件（`ICQ`）中的联系人地址列表，然后使用其自己的\
  \ SMTP 服务器向所有接收者发送电子邮件。\n\n因此，Klez 病毒能够生成正文为空的邮件，其主题是从百个左右预定义主题中随机选择的，并向此邮件添加一个包含病毒变体的可执行附件。\n\
  \n#### 2.3.1.4. Magistr\n\nMagistr 病毒是一种多态形蠕虫（即一种通过网络自我传播且其形式，更准确地说说是其特征会不断修改的病毒），它通过电子邮件进行传播。它特别影响在\
  \ Windows 95、98、Millennium 和 2000 操作系统上使用 Microsoft Outlook、Eudora 和 Netscape 消息客户端的用户。\n\
  \nMagistr 病毒会寻找系统中的联系人列表文件（Outlook 和 Eudora 客户端分别使用 `.WAB` 和 `.DBX`/`.MBX` 扩展名），以便选择消息的接收者。\n\
  \nMagistr 蠕虫发送的消息的主题和正文是从受感染计算机驱动器上找到的文件随机摘取的。Magistr 病毒会在消息中添加自身的副本，文件名包含 `.com`、`.bat`、`.pif`、`.exe`\
  \ 或 `.vbs` 等扩展名（或双扩展名）。它还可能删除 CMOS、BIOS 或硬盘中包含的所有信息。\n\n因此，它可以对系统和存储在上面的信息造成严重破坏。此外，它能够通过\
  \ `WM_QUIT` 命令禁用个人防火墙 ZoneAlarm。\n\n#### 2.3.2. 蠕虫\n\n蠕虫是一种通过网络自我传播的入侵工具。它是一种网络病毒，其主要特征与它通过网络传播的方式有关。\n\
  \n##### 2.3.2.1. 影响\n\n目前，蠕虫主要通过电子邮件（特别是通过 Outlook 消息客户端）进行复制，这归功于附件中包含指令，这些指令训练联系人列表中的所有电子邮件地址被收集，以便向所有这些接收者发送副本。\n\
  \n大多数情况下，这些蠕虫是脚本（通常为 `VBScript`）或作为附件发送的可执行文件，一旦接收者点击附件文件就会启动。\n\n##### 2.3.2.2.\
  \ 预防方法\n\n通过这种方式，所有可以被操作系统执行或解释的文件都可能感染计算机。通过对作为附件发送的文件保持怀疑态度，可以很容易保护自己免受蠕虫感染。\n\
  \n特别包含以下扩展名的文件是潜在的感染源：\n\n386, ACE, ACM, ACV, ARC, ARJ, ASD, ASP, AVB, AX, BAT,\
  \ BIN, BOO, BTM, CAB, CDR, CHM, CLA, CLASS, CMD, CNV, COM, CPL, CPT, CSC, CSS, DLL,\
  \ DOC, DOT DRV, DVB, DWG, EML, EXE, FON, GMS, GVB, HLP, HTA, HTM, HTML, HTT, INF,\
  \ INI, JS, JSE, LNK, MDB, MHT, MHTM, MHTML, MPD, MPP, MPT, MSG, MSI, MSO, NWS, OBD,\
  \ OBJ, OBT, OBZ, OCX, OFT, OV?, PCI, PIF, PL, POT, PPT, PRC, PWZ, QPW, RAR, SBF,\
  \ SCR, SH, SHB, SHS, SHTML, SHW, SMM, SYS, TAR.GZ, TD0, TGZ, TLB, TSK, TSP, TT6,\
  \ VBE, VBS, VBX, VOM, VS?, VWP, VXE, VXD, WBK, WBT, WIZ, WK?, WPC, WPD, WML, WSC,\
  \ WSH, XML, XLS, XLT, ZIP.\n\n在 Windows 下，建议禁用“隐藏已知类型的扩展名”功能，因为该功能可能会误导用户判断文件真实的扩展名。因此，扩展名为\
  \ `.jpg.vbs` 的文件可能会显示为扩展名为 `.jpg` 的文件。\n\n#### 2.3.3. 垃圾邮件\n\n这是一种与电子邮件相关的入侵工具，以不受欢迎的消息的形式出现。\n\
  \n垃圾邮件占电子邮件流量的约 90%，它由发送大量电子邮件（通常用于广告，也称为“垃圾邮件”）给大量未请求过此类广告的人，从而使邮件服务器和收件箱塞满无用的、未经请求且通常具有误导性的广告。垃圾邮件目前占全球流通邮件总量的近一半。\n\
  \n自 2003 年以来进行的近期调查显示，垃圾邮件的传播占全球邮件总数的大部分。\n\n##### 2.3.3.1. 影响\n\n垃圾邮件带来了许多影响：\n\
  \n* – 浪费用户的时间（以及金钱），他们必须更频繁地整理邮件并清理收件箱；\n* – 在多条垃圾邮件中“隐藏”了重要消息的风险；\n* – 通过具有吸引力但显然虚假的报价“腐蚀”不知情的用户；\n\
  * – 通过带有色情、政治或宗教广告的消息造成道德侵犯；\n* – 浪费网络带宽，它无意义地消耗带宽，垄占了带宽的大部分。\n\n##### 2.3.3.2.\
  \ 预防方法\n\n应对垃圾邮件应采取的适当措施是：\n\n* 不要回复垃圾邮件（不要威胁它们），这只会使情况恶化，并向垃圾邮件者确认你确实在接收此类邮件。\n\
  * 配置你的电子邮件客户端，由于某些邮件软件和 Web 邮箱允许我们屏蔽某些发送者。此外，某些邮件客户端会自动删除此类类型的邮件。\n* 不要向可疑的表单提供你的电子邮件地址，因为这会让垃圾邮件者获得这些地址，其中一些用于讨论组。\n\
  \n#### 2.3.4. 软件炸弹\n\n这是一种突然发生的隐藏入侵。\n\n它是一种在系统事件（启动、启动特定程序等）或根据预设计划开始的程序。一个很好的例子是切尔诺贝攻击，它在切尔诺贝核事故发生的日期启动。\n\
  \n#### 2.3.5. 木马\n\n这这也是间接入侵。它比病毒更复杂、更严重。它的用途与网络有关。\n\n##### 2.3.5.1. 定义\n\n这是一个隐藏在另一个程序内部并打开端口的程序。它允许在用户不知的情况下控制计算机、执行程序并启动命令。\n\
  \n木马本身并不执行任何恶意操作，但它通过打开端口允许其他实体共享或修改信息。\n\n\n\n\n间谍软件（Software that spies, or spyware）是一种恶意软件，它将自己安装在计算机或移动设备中，目的是收集并传输有关其安装环境的信息，且通常在用户不知情的情况下进行。这类类型软件的兴起与互联网的发展密切相关，互联网充当了传输信息的媒介。\n\
  \n间谍软件是旨在发现用户浏览习惯的软件。它通常与从互联网下载的较小免费软件或通过邮件接收的软件一起安装，通常随计算机一起启动并执行后台任务，占用部分系统资源。它的核心功能是尽可能地收集有关计算机用户浏览习惯（甚至包括购买行为）的信息，以创建详细的用户画像。\n\
  \n在浏览器允许激活此类选项的情况下，某些间谍软件使用 `cookies` 来收集与特定用户相关的数据。\n\n以这种方式创建的用户画像在用户不知情且因此没有获得高级权限的情况下，被用于发送定向广告（例如修改显示的页面、添加链接），甚至以包含电子邮件营销合格潜在客户的文件形式进行出售。\n\
  \n示例：– `Adayairespy`, `AdwarePunisher`, `AdwareSheriff`, `AlphaCleaner`, `AVGold`,\
  \ `BargainBuddy`, `BraveSentry`, `MalwareWipe`, `PestTrap`, `PSGuard`, `Quicknavigate.com`,\
  \ `Security iGuard`, `Smitfraud`, `SpyAxe`, `SpyGuard`, `SpyHeal`, `SpySheriff`,\
  \ `Spyware Soft Stop`, `Spyware Vanisher`, `SpywareQuake`, `SpywareSheriff`, `Startsearches.net`,\
  \ `UpdateSearches.com`, `Virtual Maid`, `Win32.puper`, `WinHound`\n\n### 2.3.7.\
  \ 键盘记录器 (Keylogger)\n\n键盘记录器是一种间谍软件或电子化监视计算机用户的外设备。该工具的目的是监视用户的私人计算机使用情况。\n\n键盘记录器是一种在用户不知情的情况下保存键盘输入按键的配置。\n\
  \n某些键盘记录器能够记录访问过的页面 URL、已查看或发送的电子邮件、已打开的文件，有时甚至可以创建一个回溯所有计算机活动的视频。\n\n由于键盘记录器会保存键盘的所有击键，它们对于试图获取工作站用户密码的怀有非法意的人可能有用。这意味着，在使用不安全的计算机（如公司、学校或公共场所的开放访问工作站）时，需要特别注意。\n\
  \n### 2.3.8. 广告软件 (Adware)\n\n广告软件是一种恶意软件，它会让用户淹没在无尽的广告窗口中，这些窗口对设备存在潜在危险。它允许其编辑产生广告收入，并且通常在用户不知情的情况下，与各种免费下载的开放访问软件一起安装。\n\
  \n示例：– `1ClickDownloader`, `4-you.net` Search, `7search`, `AnywhereMe Toolbar`,\
  \ `Arcade Safari`, `Auto-Lyrics`, `AutoCompletePro Toolbar`, `BigSeekPro Toolbar`,\
  \ `Blekko Search`, `Boby Lyrics`, `Bomlabio`, `Bonanza`, `BrandProfiles`, `Browse\
  \ for the Cause`, `Browse to Save`, `BrowseBeyond`, `BrowseFox`, `BrowserSeek Search`,\
  \ `Btosjs Info`, `Bubble Dock`, `Bueno Search`, `Buify`\n\n### 2.3.9. 其他恶意软件\n\n\
  除了介绍的主要恶意软件类型外，还有其他示例：\n\n*   `勒索软件 (Ransomware)`：是一种劫人质的恶意软件。\n*   `恐吓软件 (Scareware)`：这种恶意软件确实存在。\n\
  *   `网络钓鱼 (Phishing)`：是欺诈者使用的一种技术。\n*   `根基包 (Rootkits)`：也被称为是一类最严重且最复杂的软件集合。\n\n\
  ### 2.3.10. 侵入工具对比\n\n侵入工具呈现出多种相似之处；然而，它们具有某些差异，这些差异在表 2.2 中进行了总结，该表提供了每个工具的内在特性。\n\
  \n![表 2.2 侵入工具对比](img/py3.jpg)\n\n## 2.4. 结论\n\n尽管 TCP/IP 设置简单，但存在许多漏洞；由于应用广泛，有必要投入安全投入以避免或至少减少所产生的问题。\n\
  \nTCP/IP 容易受到互联网上常见的扫描和分析工具的影响。使用扫描或分析工具是攻击前的必要步骤。\n\n这些漏洞便利了侵入工具的传播和攻击。\n\n# 3\
  \ 身份验证技术与工具\n\n## 3.1. 引言\n\n身份验证是安全最基础的方面。它涉及访问权限的定义，并在出现问题时识别来源。它允许对各种本地和远程服务进行控制和限制。\n\
  \n身份验证通过三种可能的技术实现：\n\n1.  `我有 (I have)`：与拥有一个代表身份证明的物体有关。\n2.  `我知 (I know)`：与知道一个秘密组合有关，即密码。\n\
  \n\n\n\n- – 第三种技术被称为“我是（I am）”，它是最形式的认证形式，因为它依赖于被认证用户的个人特征（指纹、语音等）。\n\n在某些场景下，可以结合多种技术以获得更高的安全性，银行卡就是这种情况（“我有（I\
  \ have）卡片和“我知道”密码）。\n\n密码必须满足某些数量的标准，以防止其泄露，因为泄露可能会对系统或需要安全的实体造成不可弥回的损害。它还必须具有有限的生命周期。\n\
  \n为了以受控和集化的方式确保认证，发明了 `AAA` 服务，以提供若干种互补功能，同时提供身份验证和访问日志。\n\n作为一种安全服务的认证可以通过 `Telnet`\
  \ 和 `SSH` 协议在网络设备上提供，而无需任何 `AAA` 服务器。这种认证方法包含了对用于访问安全配置本身的账户数据库的限制。正因如此，`AAA` 服务器的配置可以解决上述缺陷，并提供两个额外功能，即授权（authorization）和可审计性（accountability），因此称为\
  \ `AAA`。\n\n`AAA` 服务可以使用仅用于身份验证的本地数据库，也可以使用远程数据库来提供三种服务：身份验证、授权和可审计性。`AAA` 有两种可能的模式：本地或服务器。\n\
  \n## 3.2. 认证的理论概念\n\n为了避免混淆，我们必须区分认证（authentication）和身份识别（identification），这两个术具有不同的含义，代表了安全的两个互补方面。这两个方面可以以耦合或分离的方式提供。\n\
  \n### 3.2.1 身份识别\n\n这是通过展示身份将我们与其他区分开来的行为，可以是名称、`IP` 地址、物理地址或 `MAC 地址` 的形式。任何用作识别的内容在特定上下文中必须是唯一的，以便能够区分，例如登录或任何其他用户身份。\n\
  \n### 3.2.2 认证\n\n这是通过多种技术进行的身份证明，是一种确保展示身份的实体确实是目标实体的方法。\n\n## 3.3. 认证的不同类型\n\n\
  根据被认证实体及其在网络中的位置，有两种不同类型的认证：本地认证和认证。\n\n### 3.3.1 本地服务认证\n\n访问本地服务最常用的认证方法是通过登录名和密码。登录名用于身份识别是唯一的，密码用于认证是秘密的。\n\
  \n密码必须具有某些特征：\n\n- – 它必须具有合理的长度，这取决于要保护实体的重要性。\n- – 它必须包含一定数量的多样内容（大写字母、小写字母和特殊字符）。\n\
  - – 应避免简单的密码。\n- – 应避免使用字典中的密码。\n- – 应避免过于复杂且在不通过物理或电子介质记录的情况下难以记忆的密码。\n- – 应根据其重要性和使用情况定期修改密码。\n\
  - – 密码不应用于多个账户（电子邮件、信用卡等）。\n\n一个良好密码的现实示例是 `teurn@dior2C)21`（一个来自短语“ordinateur2021”的密码，其中\
  \ `ordinateur` 是法语中“计算机”的意思。音节“or”、“di”、“na”、“teur”被倒置了，`@` 代替了 `a`，`0` 被序列 `C)`\
  \ 替换，这是一个复杂且易记的密码，不需要数字或物理转抄）。\n\n为了避免任何基于试错的欺诈连接，连接系统要求输入密钥（以图像形式出现），以确保提供的登录名和密码是手动输入的。\n\
  \n某些认证系统可能受到 `SQL injection` 攻击的影响。这些攻击允许绕过所需的密码，因为如果包含用于注释的特殊字符（`#` 或 `'` 等），就可以被忽略。\n\
  \n### 3.3.2 网络认证\n\n为了访问远程服务，每个用户必须经过认证。认证所需的密码绝不能以明文形式在网络上发送。事实上，任何在网络中传输的信息都可以被观察者（嗅探器）捕获，这是要克服的最大挑战。\n\
  \n#### 3.3.2.1 远程认证的问题\n\n通过网络访问远程服务时，最常见且最简单的认证形式是通过网络以明文发送登录名和密码，如图 3.1 所示。这种技术同时提供了身份识别和认证。直到\
  \ 21 世纪的前几年，大量的网页邮件客户端都是这种情况。\n\n![图 3.1. 明文登录和密码认证](img/fig3-1.jpg)\n\n图 3.1. 明文登录和密码认证\n\
  \n通过使用网络分析仪，很容易检测到密码，这使得安全性受到了质疑。因此，为了在网络上安全地认证，有必要避免这种技术以及通过网络发送明文密码。\n\n#### 3.3.2.2\
  \ 基于挑战消息的远程认证\n\n这首先识别身份，然后通过对服务器发送的随机挑战消息应用哈希函数的结果来对其认证。它通过几个阶段完成：\n\n- – 客户端发送登录名到服务器进行识别。\n\
  - – 服务器验证登录名的有效性。\n- – 在识别有效的情况下，服务器随机生成挑战消息并发送给客户端。\n- – 客户端根据以下三个元素生成链：登录名、密码和挑战消息。然后，对生成的链应用相应的哈希函数，计算出发送给服务器的新链。\n\
  - – 服务器使用相同的哈希函数对相同的组合（登录名、记忆的密码和发送的挑战消息）重新计算。然后将结果与客户端发送的信息进行比较。如果相同，则客户端通过认证。\n\
  \n每次连接使用不同的挑战消息防止了哈希码在后的欺诈认证中被重用。\n\n监控网络的黑客可以获取登录名、挑战消息和哈希码。然而，这些参数不足以提取密码，即使已知组合不同元素（登录名、密码、挑战消息）的公式以及所使用的哈希函数。\n\
  \n![图 3.2. 挑战消息认证](img/fig3-2.jpg)\n\n图 3.2. 挑战消息认证\n\n#### 3.3.2.3 基于单次密码的远程认证\n\
  \n这种技术被称为“一次性密码”，也基于对哈希函数的使用。它根据以下条件将连接的密码更改另一个：\n\n- – 密码使用一个根密码生成，该密码将是最后一个使用的密码。\n\
  - – 已使用的密码来自随后的密码。\n- – 已使用的密码在任何情况下都不允许后后要使用的任何密码被确定。\n\n\n\n\n给定哈希函数 `H` 和一个非常大的整数\
  \ `n`，仅使用一个选定的根密码，就可以通过 `n+1` 次身份验证：\n\n- – 第一次验证是通过对根密码应用 `n` 次 `H` 函数后得到的密码完成的。\n\
  - – 第二次验证是通过对根密码应用 `(n-1)` 次 `H` 函数得到的密码完成的。\n- – 等等。\n- – 第 `n` 次验证是通过对根密码仅应用一次\
  \ `H` 函数得到的密码完成的。\n- – 最后一次验证是使用根密码完成的。\n\n![图 3.3 使用一次性密码进行身份验证](img/fig3-3.jpg)\n\
  \n**图 3.3.** *一次性密码进行身份验证*\n\n能够获取所有已使用密码的网络观察者将无法将它们用于任何欺诈性验证，也无法确定用户选定的根密码。\n\n\
  ### 3.3.2.4. *Telnet 和 SSH*\n\nTelnet 和 `SSH` 是两种用于连接远程计算机的网络协议。我们可以使用终端模拟器连接到网络内的此系统或通过互联网连接，并使用远程命令控制系统。\n\
  \nTelnet 是一种用于远程访问服务器或某些设备（路由器、交换机等）的协议，其密码以明文形式通过网络发送，这使得网络用户或嗅探器有可能捕获密码并用于潜在的欺诈活动。\n\
  \n`SSH` 是安全壳（secure shell）的缩写，是一种类似但更安全的协议，因为密码无法通过网络被捕获。\n\n在 Cisco 设备上，可以使用以下配置限制对\
