  \ `R` 时过滤授权的计算机：\n\n## 4.2.2.3. 命名 ACL 的配置\n\n命名 ACL（配置 IPv6 的唯一选项）的配置通过名称识别 ACL，同时指定它是标准\
  \ ACL 还是扩展 ACL。\n\n通用语法为：\n\n对于标准 ACL，通过使用具有以下语法的命令添加过滤规则：\n\n示例如下：\n\n`ACE`（访问控制条目）规则根据以\
