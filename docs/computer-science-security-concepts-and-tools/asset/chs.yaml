  \ 之间的数字是标准 ACL，在 `3000` 到 `3999` 之间的数字是扩展 ACL。\n* 当基于名称创建 ACL 时，必须指定 ACL 名称。可以指定数字或\
  \ ACL 类型。如果未指定命名 ACL 数字，系统将自动分配命名 ACL 数字。\n\n使用相应范围内的数字或管理员选择的名称创建 ACL 的通用语法为：\n\
