  \n如果我们想创建一个包含所有 Web 流量的 class-map，则配置如下：\n\n* – 使用命令“`policy-map type inspect <policy-map-name>`”定义动作：此命令指定识别相关流量的\
  \ class-map，并选择所应用的动作（丢弃、通过或检查）。\n* – 使用命令“`zone-pair security <zone-pair-name>\
  \ source <zone-sec-name> destination <zone-sec-name>`”识别区域对，并使用命令“`service-policy\
