  \ 协议的远程访问：\n\n`SSH` 协议的远程访问可以通过以下配置进行限制：\n\n## 3.4. AAA 服务\n\n`AAA` 是认证（Authentication）、授权（Authorization）和计费（Accounting）的缩写。\n\
  \n*身份验证（Authentication）*是一个允许验证身份的功能，其目的是限制对定义良好的系统的访问。它回答“你是谁？”的问题。\n\n*授权（Authorization）*是一个确定经过验证的实体可以访问的服务的功能，其目标是限制访问权限。它回答“你拥有什么权限？”的问题。\n\
  \n*计费（Accounting）*是一个允许记录所有活动（访问和完成的任务）的功能，其目的是确保任何可能的后续分析的可追溯性。它回答“你做了什么？”的问题。\n\
  \n`AAA` 可以本地配置，也可以基于托管在远程服务器上的认证数据进行配置。\n\n### 3.4.1. *本地 AAA*\n\n本地 `AAA` 允许一种功能，即身份验证。\n\
  \n本地模式下的 `AAA` 认证由以下步骤组成：\n\n- – 用户与设备建立连接。\n- – 设备向用户询问用户名和密码，通过在本地数据库中验证这些信息来验证用户。\n\
  \n较小型的网络必须配置本地 `AAA` 认证。某些网络允许一个或两个路由器为有限的用户提供访问。这种方法使用存储在路由器上的本地用户名和密码。系统管理员必须通过指定每个可能登录用户的用户名和密码配置来填充本地安全数据库。\n\
  \n本地 `AAA` 身份验证方法类似于使用本地连接命令。`AAA` 还提供了配置身份验证记录方法的方法。\n\n#### 3.4.1.1. *本地 AAA 身份验证配置*\n\
  \n在 Cisco 路由器上，本地模式下的 `AAA` 认证包括创建用户、激活 `AAA` 服务以及指定本地数据库（区分大小写）作为默认登录认证列表的方法：\n\
  \n也可以使用本地数据库加上密码 `enable` 并固定该方法的应用字段（用于远程 `SSH` 访问）来创建一个命名的身份验证方法：\n\n身份验证方法配置的通用语法为：\n\
  \n可以应用的本地方法有：\n\n- – *enable*：包括使用密码 `enable` 进行身份验证；\n- – *local*：包括使用本地用户数据库进行身身份验证；\n\
  - – *local-case*：包括使用本地用户数据库（区分大小写）进行身份验证；\n- – *none*：不使用身份验证。\n\n在华为路由器上，本地模式下的\
  \ `AAA` 认证配置包括激活 `AAA` 服务、创建用户、创建认证蓝图并使用以下命令指定其为对设备的远程访问：\n\n### 3.4.2. *服务器 AAA*\n\
  \n服务器 `AAA` 认证由以下步骤组成，如图 3.4 所示：\n\n- – 用户与设备建立连接。\n- – 设备向用户询问用户名和密码。\n- – 设备将用户名和密码传输到服务器。\n\
  - – 服务器根据其数据库验证用户。\n\n![图 3.4. AAA 认证](img/fig3-4.jpg)\n\n**图 3.4.** AAA 认证\n\n\
