  \n## 1.10. 结论\n\n计算机安全目前被认为是此处讨论问题的解决方案，正如统计所示。弱点和漏洞众多且多样，涵盖了计算的每一个层面，从设备到软件，从基础设施和结构到用户和管理员。\n\
  \n计算机安全允许我们涵盖许多领域，并规划组织、文化和技术解决方案，以为各种弱点和漏洞提供解决方案元素。\n\n安全的目标是确保计算机系统保持正常的运行状态，它涉及到多个外部和内部要点，涉及物理和软件、物质和人类等。\n\
