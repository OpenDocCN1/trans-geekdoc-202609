  \ `192.168.10.0/24` 的计算机访问 Web 流量：http（端口 80）和 https（端口 443）：\n\n## 4.2.3.3. 二层\
  \ ACL\n\n二层 ACL 被分配 4000 到 4999 范围内的数字，其过滤规则基于连接层信息，包括源 MAC 地址、源 VLAN 标识 ID、二层协议类型和目的\
  \ MAC 地址。\n\n华为二层 ACL 的配置语法为：\n\nACL 也可以另一种方式定义，即为其赋予一个名称。在这种情况下，必须指定 ACL 的类型（在此情况下为链路），或赋予它一个\
  \ 4000 到 3999 范围内的数字。\n\n## 4.3. 防火墙\n\n防火墙是软件（用于路由器或终端设备：如 PC、服务器、工作站）或物理设备，它可以保护计算机、网络或子网的。。\n\
  \n防火墙有三个主要功能：过滤、追踪以及在某些情况下是网络地址转换（NAT）。\n\n### 4.3.1. 过滤功能\n\n该功能通过通过 MAC 地址、IP\
  \ 地址、Web 地址（URL）、端口号、协议等过滤访问该实体的实体，从而隔离待保护的实体。\n\n可以应用许多规则：\n\n* – 拒绝某些实体并允许其他（默认允许访问）是“乐观”策略；\n\
  * – 允许某些实体并拒绝其他（默认阻止访问）是“悲观”策略；\n* – 允许用户在过程中决定授权还是拒绝某个实体，是“交互式”策略。\n\n过滤策略以及过滤器必须由管理员选择并定期更新。防火墙的强度取决于其过滤配置的精确性和准确性。\n\
  \n根据要过滤的实体，过滤有两种模式，即高层或低层过滤。\n\n我们还可以根据其工作方式将过滤器分为两种类型，即带状态或不带状态。\n\n#### 4.3.1.1.\
  \ 低层过滤\n\n也称为数据包过滤，它允许根据数据包的主要特征进行过滤，有时甚至是帧帧：\n\n* – 源/目的 MAC 地址；\n* – 源/目的 IP 地址；\n\
  * – 协议（IP、ICMP、UDP、TCP 等）；\n* – 源/目的端口等。\n\n#### 4.3.1.2. 高层过滤\n\n也称为应用过滤甚至内容过滤，它涉及应用和\
  \ Web 页面。这是一种基于高层参数的过滤器：\n\n* – 执行、网络访问、访问应用程序的注册表日志，称为应用过滤；\n* – URL 地址，称为 URL\
  \ 过滤；\n* – Web 页面中存在的关键词列表，称为内容过滤。\n\n#### 4.3.1.3. 无状态过滤\n\n无状态过滤由仅基于被过滤实体相关信息的过滤器组成，与其状态或进度无关。尽管这种过滤是浅层次的，但它不会占用大量的\
  \ CPU 和内存资源。\n\n#### 4.3.1.4. 状态过滤\n\n状态过滤由在内存中维护不同会话的上下文组成。在这种情况下，可以动态修改过滤规则。这的一个很好的例子是：授权对从网络内部初始化连接的响应的数据包，并拒绝来自网络外部连接尝试的数据包，如图所示。\n\
  \n![images/fig4-1.jpg]\n\n**图 4.1.** 支持状态过滤的防火墙。此图的彩色版本请参阅 [www.iste.co.uk/zaidoun/computer.zip](http://www.iste.co.uk/zaidoun/computer.zip)\n\
  \n### 4.3.2. 追踪与 NAT 的功能\n\n为了识别攻击源，必须记录所有访问事件和访问尝试。这样产生的信息称为日志。管理员必须频繁检查日志以识别攻击源并分析通信状态。\n\
  \n这种记录不同活动的每日日志对于管理员是必要的，他们可以手动分析或使用适当的工具检测任何未经的访问或访问尝试。\n\nNAT 是网络地址转换（Network\
  \ Address Translation）的缩写。它是保护网络的路由器或防火墙功能。它在外部通信期间隐藏本地 IP 地址（私有地址），并将其替换为公网地址。\n\
  \n![images/fig4-2.jpg]\n\n**图 4.2.** 使用代理的数据移动\n\n地址转换有两种方式：静态和动态。静态地址转换（一对一）在私有地址和公网地址之间建立对应。动态地址转换（N\
  \ 对 M，M<N）包括根据需要分配公网地址（来自地址池）。还使用端口池（PAT：端口地址转换）来识别来自外部的数据包，因为一个公网地址可以分配给多个计算机。\n\
  \nNAT 是一种比代理更先进的技术。代理（如图 4.2 所示）是为用户转发应用程序（http）的中间设备。应用程序的使用仅对代理开放，工作站必须通过代理。\n\
  \n### 4.3.3. 防火墙架构\n\n防火墙的通用架构如图 4.3 所示。\n\n![images/fig4-3.jpg]\n\n**图 4.3.** 防火墙架构\n\
  \n该安全解决方案由三部分组成：\n\n* – 拦截器；\n* – 引擎；\n* – 配置界面。\n\n这允许对两种数据形式进行修改：\n\n* – 列表；\n\
  * – 日志。\n\n#### 4.3.3.1. 拦截器\n\n这是一个低层系统组件，允许捕获数据包、帧或实体并对其应用决策。该组件负责检测和执行操作。它以系统进程的形式存在，必须具有必要的权限，以便能够在关键时刻采取行动并防止相关实体的任何突破行为。\n\
  \n#### 4.3.3.2. 引擎\n\n这是一个高层组件，负责分析管理员设置的通用过滤器集，并根据特征决定对实体采取什么行动。\n\n\n\n\n防火墙的配置表现为一组不同的过滤器列表，这些过滤器既复杂又互补，这意味着相应的操作既不直观也不易于识别。这种特性需要进行更深层次的分析，以解决对定义良好的实体进行过滤的任务。这是引擎的核心功能。\n\
  \n### 4.3.3.3. 配置接口\n这允许管理员选择合适的过滤器。接口有两种类型：通过管理控制台（`CLI`：命令行界面）显示文本形式，或通过用户友图形界面（`GUI`：图形用户界面）显示图形形式。第一个选项需要具有专业知识的管理员。\n\
  \n### 4.3.3.4. 过滤器数据库\n这是一个包含防火墙配置的数据库。过滤器是通用的定义，引擎负责定义从最具体到最通用的优先级顺序。所应用的操作取决于相关实体、情况以及防火墙内部使用的通用策略。\n\
  \n### 4.3.3.5. 日志\n这些是防火墙保存的访问记录、访问尝试记录以及任何与防火墙相关的其他事件的记录。这些记录按系统日期和时间进行归档，以便管理员可以使用它们来识别特定的问题。\n\
  \n### 4.3.4. 防火墙工作原理\n拦截飞行员捕获实体（数据包、应用程序等）并将其特征（源、目的地等）发送给引擎，引擎通过寻找适用于该实体的过滤器来确定操作（授权、拒绝等）。可用的过滤器组由管理员在配置期间选择。\n\
  \n![图 4.4. 防火墙过滤](img/fig4-4.jpg)\n\n**图 4.4.** 防火墙过滤\n\n### 4.3.5. 防火墙分类\n防火墙有两种可能的分类类型。第一种分类是根据相对于\
  \ `TCP/IP` 栈的过滤级别，第二种是根据动作作用范围，即防火墙需要保护的部分。\n\n#### 4.3.5.1. 按动作级别过滤\n这种分类回答了问题：过滤发生在哪个级别？\n\
  \n第一种情况我们称为数据包过滤或低级过滤，另一种情况则我们称为应用过滤或高级级过滤。\n\n##### 数据包防火墙\n在此类防火墙中，要过滤的实体是数据包，有时是帧。它在\
  \ OSI 模型的第 2、3 和 4 层运行。\n\n针对以下内容进行过滤：\n* – 物理源和目的地址（`@MAC`）；\n* – 逻辑源和目的地址（`@IP`）；\n\
  * – 使用的协议（`IP`、`ICMP`、`TCP`、`UDP`、`SLIP`、`PPP` 等）；\n* – 源和目的端口等。\n\n##### 应用防火墙\n\
  在此类防火墙中，要过滤的实体是应用程序。它在 OSI 模型的第 7 层运行。\n\n针对以下内容进行过滤：\n* – Web 流量（`URL`、关键词、cookie\
  \ 等）；\n* – 应用程序权限（执行、网络访问、日志访问、磁盘访问等）。\n\n#### 4.3.5.2. 按动作作用范围过滤\n这种分类回答了问题：防火墙正在保护什么？\n\
  \n第一代防火墙是为了保护网络（`Intranet`）免受外部（`Internet`）的攻击，因为后者被认为是攻击的主要来源。随着时间的推移，统计显示 80%\
  \ 的攻击来自内部。保护计算机的防火墙似乎是解决方案。\n\n为了避免与 PC 防火墙相关的配置困难，分布式防火墙由代理程序和一个管理服务器组成。\n\n#####\
  \ 经典防火墙\n任何保护网络的物理防火墙都被认为是经典防火墙。我们也将其称为箱式防火墙。该设备用于受保护的本地网络与潜在攻击源外部网络（`Internet`）之间。\n\
  \n##### PC 防火墙\n这是保护计算机并防止他人受该计算机攻击的软件。这种新一代防火墙之所以存在，是因为统计显示 80%的攻击来自内部源。PC 防火墙在家庭中作为防病毒使用，`Internet`\
  \ 上有很多免费版本可用。\n\n##### 分布式防火墙\n这是一种新的网络解决方案，使用集中式配置保护不同的计算机。每台计算机都有一个作为 PC 防火墙的过滤代理，其配置来自负责日志的中央计算机。管理员不需要逐台计算机地重新配置和分析日志，也不需要将此任务交给用户（用户并不一定接受过相关培训）。\n\
  \n### 4.3.6. 状态防火墙\n状态防火墙是一种根据网络连接状态提供过滤的防火墙。其目标是保护本地网络免受任何外部访问尝试（来自 `Internet`）。此功能允许区分作为内部请求响应的数据包（授权）和从外部发起的新连接数据包（拒绝）。为此，防火墙检查从本地网络发起的流量，以便了解如何区分内部请求的响应与其余进入流量，并确定应应用什么操作。\n\
  \n通过 Cisco 路由器（更新为支持防火墙的 `IOS`）的一种可能实现是基于 `ACLs`。方法如下：\n* – 选择内部和外部接口。\n\n例如，用于内部接口的\
  \ `GigabitEthernet 0/0`；用于外部接口的 `Serial 0/0/0`。\n* – 为每个接口配置 `ACLs`。\n\n例如，一个阻止来自任何外部接口进入流量的\
  \ `ACL`：\n\n或者，例如，一个允许来自任何外部接口授权流量的 `ACL`：\n* – 定义检查规则。\n\n例如，创建一个检查规则：\n* – 将检查规则应用到接口。\n\
  \n例如，将检查规则应用到来自任何内部接口的进入流量：\n\n### 4.3.7. 基于区域的防火墙\n`ZPF` 或基于区域的策略防火墙是一种提供灵活配置的防火墙，它独立于\
  \ `ACLs` 和物理接口。\n\n#### 4.3.7.1. 区域概念的通用介绍\n这种新的配置类型将接口分配给安全区域，并将防火墙策略应用于这些区域中流过的流量，包括：\n\
  * – 确定区域；\n* – 建立区域间策略；\n* – 开发物理基础设施；\n* – 识别区域内的子组并合并流量需求。\n\nCisco `IOS ZPF`\
  \ 可以采取三种操作之一：\n* – *Inspect*（检查）：允许使用带状态 `IOS` 对数据包进行检查。\n* – *Drop*（丢弃）：类似于 `ACL`\
  \ 中的 `deny` 命令，删除数据包。提供日志选项记录被拒绝的数据包。\n* *Pass*（通过）：类似于 `ACL` 中的 `permit` 命令，授权数据包。成功的操作不跟踪流量中连接或会话的状态。\n\
  \n可以创建两个或多个区域，物理接口可能也可能不受区域影响；一个名为自区域（self-zone）的特定区域对应路由器本身，包含了分配给这些接口的所有 IP 地址。\n\
  \n在创建安全区域后，管理员可以创建区域对，然后对部分或全部这些区域对进行安全性测试。\n\n\n\n应用于接口间流量的动作（通过 PASS、丢弃 DROP 或检查\
  \ INSPECT），如表 4.2](#c04.xhtml#tab4-2) 所示，一方面取决于源和目的，另一方面则取决于 ZPF 防火墙的配置，在这种情况下，取决于上述区域之间是否存在一对区域对，或者是否存在一个将应用于所选区域对的安全策略。\n\
