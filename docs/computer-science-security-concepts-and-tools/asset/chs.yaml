  \ `RADIUS` 授权作为授权模式配置授权协议：\n\n### 3.5. 结论\n\n认证无论是本地还是通过网络进行的，必须通过选择可靠的密码并使用避免明文发送密码的技术以安全的方式完成。\n\
  \n认证通常与完整性配对。我们所说的“真实性（Authenticity）”一方面确保了发送者或生成者的身份，另一方面确保了所发送或生成性的有效性。\n\n我们在本章中讨论的\
  \ `AAA` 服务允许以系统化和模块化的方式管理不同设备和服务，并跟踪所有这些活动。在不同设备上配置这些服务是一项非常重要的安全措施，但管理层通常会忽视这一点，转而采用局限且过时的认证方法。\n\
  \n# 4 访问控制技术、ACL 与防火墙工具\n\n## 4.1 引言\n\n网络流量在很大范围内不断增长，使得路由器传输信息的负载越来越困难，数据量也越来越庞大。此外，这些信息中很大一部分是由黑客和未经授权的实体控制的寄生元素。对此的适当解决方案是过滤流量，只允许合法方通过网络进行通信，这一方面限制了处理的数据量，另一方面消除了潜在的攻击源。这些过滤器可以配置在路由器上，并命名为\
  \ `ACLs`（访问控制列表）。\n\n为了保护公司内的关键位置（实验室、控制室等），必须对其进行隔离并记录对该位置的访问。在计算机领域，保护系统的措施是类似的，通过防火墙实现，使其能够被隔离并跟踪访问情况。防火墙是最重要的安全工具；它是任何安全措施中的关键元素。此外，防火墙原理（特别是过滤原理）存在于许多安全工具中，在这里，即网络连接设备（路由器、三层交换机）以\
  \ `ACLs` 的形式存在。\n\n## 4.2 访问控制列表\n\n`ACL` 是 access control list（访问控制列表）的缩写；它是一组有序的过滤器，称为访问控制条目（ACE），应用于通过路由器的\
  \ `LAN/WAN` 接口进入或离开的流量。\n\n`ACLs` 允许根据用户定义的标准过滤数据包。它确保数据包在进入或离开路由器接口时根据以下因素进行过滤：\n\
  \n* – 源 IP；\n* – 目的 IP；\n* – 源端口；\n* – 目的端口；\n* – 协议：`IP`、`TCP`、`UDP`、`ICMP` 等。\n\
  \n访问控制列表是一种路由器配置脚本，根据其报头中规定的标准，控制数据包甚至帧是否被授权或被拒绝通过。它们还被用于选择要通过其他方法分析、传输或处理的流量类型。\n\
  \n在路由器内部，只能有一个 `ACL`，根据以下标准定义：\n\n* – 协议（`IPv4`、`IPv6`）；\n* – 接口（`GigabitEthernet/0`）；\n\
  * – 方向\n\n### 4.2.1 ACL 分类\n\n访问控制列表根据其类型、结构以及 ACL 的定义方式进行分类。`ACL` 的定义可以是编号的或命名的。\n\
  \n#### 4.2.1.1 入站/出站 ACL\n\n访问控制列表可以应用于入站或出站流量。\n\n* – 入站 ACL：数据包在进入路由器接口之前进行处理。如果匹配，则根据其匹配的规则执行\
  \ 4.2.1.1 2  的，将第一个匹配的 `ACL` 规则应用到数据包。\n* – 出站 ACL：数据包在离开路由器接口之前进行处理。\n\n#### 4.2.1.2\
  \ 标准/扩展 ACL\n\n访问控制列表有两种主要类型，取决于过滤的标准：\n\n* – 标准访问控制列表：仅基于 IP 源过滤。华为设备使用基础类型。\n\
  * – 扩展访问控制列表：基于 IP 中的任何字段（`TCP`、`UDP`）。华为设备使用高级类型。\n\n对于华为设备，还可以根据 MAC 地址定义 `ACLs`；这是二层\
  \ ACL。\n\n#### 4.2.1.3 编号/命名 ACL\n\n在 `ACL` 定义中，可以给它命名，也可以使用编号。我们区分：\n\n* – 编号 ACL：通过选择的数字标识\
  \ ACL。对于 Cisco，数字允许的 ACL 类型如下：\n* (1–99) 和 (1300–1999)：标准访问控制列表；\n* (100–199) 和\
  \ (2000–2699)：扩展访问控制列表。\n对于华为，数字允许的 ACL 类型如下：\n* 2000–2999：基础访问控制列表；\n* 3000–3999：高级访问控制列表；\n\
  * 4000–4999：二层访问控制列表。\n\n* – 命名 ACL：通过选择的名称标识 ACL 并指示其类型（标准或扩展）：\n* 名称可以包含字母和数字；\n\
  * 建议使用大写字母；\n* 名称不能包含空格或标点符号；必须以字母开头；\n* 访问控制列表中的条目可以添加或删除。\n\n### 4.2.2 Cisco ACL\
  \ 配置\n\n访问控制列表是一组有序的授权或拒绝指令，称为访问控制条目。\n\n当网络流量通过配置了访问控制列表的接口时，路由器会将数据包中的信息与 `ACL`\
  \ 中的每条规则进行比较。第一个对应的 `ACE` 所指定的的操作应用于该数据包。\n\n#### 4.2.2.1 通用掩码\n\n`IPv4` 访问控制条目包含通用掩码来过滤\
  \ `IPv4` 地址。\n\n通用掩码采用 `IPv4` 地址的形式，其组成的比特位解释如下：\n\n* – 位为 0：允许建立与对应 IP 地址中该位的值的对应关系；\n\
  * – 位为 1：允许忽略对应 IP 地址中该位的值。\n\n\n\n\n\n作为 IP 地址 `192.168.1.1.` 的通用掩码示例，我们可以区分：\n\
  \n* `0.0.0.255`：允许忽略最后一个字节，从而允许接受来自网络 `192.168.1.0/24` 的所有地址；\n* `0.0.0.7`：允许忽略最后三个位，从而允许接受来自网络\
  \ `192.168.0/29` 的所有地址；\n* `0.0.0.254`：允许忽略最后一个字节的前七位，从而允许接受来自网络 `192.168.1.0/24`\
  \ 的所有偶数地址；\n* `0.0.0.0`：允许对位进行完全对应验证（不忽略任何位），从而只允许接受地址 `192.168.1.1`；\n* `255.255.255.255`：允许忽略所有位，从而接受所有\
  \ IP 地址。\n\n仅允许接受一个地址的通用掩码 `0.0.0.0`可以用单词 `host` 替换。\n\n允许接受所有地址的通用掩码 `255.255.255.255`可以用单词\
  \ `any` 替换。\n\n## 4.2.2.2. 数字 ACL 的配置\n\n分配给 ACL 的数字表示所涉及 ACL 的类型：\n\n* 1 到 99 以及\
  \ 1300 到 1999：`标准 ACL (standard ACLs)`；\n* 100 到 199 以及 2000 到 2699：`扩展 ACL (extended\
  \ ACLs)`。\n\n通用语法为：\n\n作为标准 ACL 的示例：\n\n* `ACL 10` 授权源地址来自网络 `192.168.1.0/24` 的数据包；\n\
  * `ACL 11` 仅授权源地址为 `192.168.2.1` 或 `192.168.3.254` 的数据包；\n* `ACL 12` 拒绝来自所有源地址的数据包的访问。\n\
  \n扩展 ACL 根据协议（IP、TCP、UDP、ICMP 等）、源 IP 地址、目的地址甚至包括源和目的端口、TCP 和 UDP 提供过滤。一个很好的说明是：\n\
  \n* `ACL 100` 允许源地址属于网络 `192.168.1.0/24` 的 TCP 段授权，代表 Web 流量（相对于端口 `80`，在 ACL 配置中可用\
  \ `www` ）；\n* `ACL 101` 允许阻塞所有 IP 流量；\n* `ACL 102` 允许授权所有指向计算机 `192.168.4.100` 的\
  \ UDP 流量（端口 `49` 对应 `TACACS+` 服务）。\n\nACL 末尾会添加一个隐含条目以阻止所有其他流量。\n\n一旦配置了 ACL，管理员必须指定其位置（路由器的接口或接入线路）以应用它。标准\
  \ ACL 尽可能靠近目的地应用，而扩展 ACL 则尽可能靠近源端应用。\n\n使用 `ip access-group` 命令在接口上应用 ACL，语法如下：\n\
