  \ 在美国造成了 6.3 亿美元的损失。\n\n## 1.4. 安全目标\n\n统计数据表明，人为因素以疏忽或无知的形式在产生和强化安全漏洞方面具有重要性；这与交通事故的情况相同。由于这个原因，很大一部分安全问题源于人为因素。\n\
  \n（注：原文提供的文本在 1.4 标题后似乎被截断或存在重复，此处翻译已涵盖所给的所有文本内容。）\n\n\n\n\n组织安全的目的是试图对负责安全的结构和组织进行验证，包括备用技术单元、管理员和安全代理。它还允许对公司内部的安全投资进行验证，包括培训课程，以及通过章程、海报和管理规定建立必要的安全文化等步骤。其他点也属于安全的这一方面，例如备份规则以及公司内部发生事件的处置。\n\
  \n## 1.5.2.2. 基础设施安全\n\n基础设施安全涵盖了安全的众多要素：\n\n* – 电缆；\n* – 办公区域；\n* – 服务器位置；\n* –\
  \ 存档存储；\n* – 技术办公室；\n* – 服务器机柜；\n* – 计算中心；\n* – 居家办公场所。\n\n这一部分涉及物理层面。它试图从物理上保护计算机设备和基础设施及其位置的安全。对于位置而言，安全策略取决于不同位置的重要性和内容。由于服务器对整个计算机系统很重要，它们受益于特定的安全策略。居家办公场所代表了一个弱点，需要不容忽视的特定安全措施。\n\
  \n物理安全防止自然因素和人为因素的影响，可以通过以下方式确保：\n\n* – 烟雾探测器；\n* – 水浸探测器；\n* – 运动探测器；\n* – 监控摄像头；\n\
  * – 考勤系统（卡片、指纹等）。\n\n## 1.5.3. 软件安全\n\n软件安全涉及软件和系统资产，这些资产必须使用密码、访问限制、根据其重要性和机密程度对文档进行电子分类来保护。这是计算机安全的基础方面，其核心内容由\
  \ `OSI 2 (ISO 7498-2)` 标准定义。\n\n安全涉及任何计算机系统（网络、工作站、服务器等），以及操作系统和应用程序。\n\n### 1.5.3.1\
  \ 网络安全\n\n网络是计算领域的关键要素，正如此如此它们是攻击者的潜在目标。这意味着需要安全投入，以便采取过滤、访问检查和基础设施保护等措施。\n\n不同的网络设备涉及安全，例如：\n\
  \n* – 调制解调器；\n* – 交换机 (`VLAN`、端口安全）；\n* – 防火墙；\n* – 路由器 (`ACL`）；\n* – 访问点。\n\n网络安全允许将远程访问限制在不同的段和网络设备。\n\
  \n### 1.5.3.2 系统安全\n\n操作系统是计算系统软件部分的基础元素。然而，每个操作系统无论多新，都包含攻击者可以利用的漏洞。考虑到其广泛的使用，`Microsoft\
  \ Windows` 系统是一个常见目标。\n\n安全的这一方面还涉及电话和传真标准，因为它们可能被用作破坏安全的未经授权路径。\n\n### 1.5.3.3\
  \ 应用安全\n\n不同的软件和应用程序并非免受批评，并导致了攻击者总能识别的众多弱点，尽管开发者定期提供补丁以添加必要的纠正措施。此外，发起的攻击是针对特定软件的。因此，不同的软件需要特定的安全预防措施和防范。代表潜在目标的软件类包括：\n\
  \n* – Web 服务；\n* – 电子邮件服务；\n* – 数据服务。\n\n### 1.5.3.4 数据安全\n\n尽管软件具有极性意义，但数据的丢失或更改会对计算机系统产生破坏性影响。因此，必须预见必要的安全措施（通常是一系列多样且互补的机制），以保护数据免受未经授权的泄露或修改。\n\
  \n统计表明，攻击造成的大部分损害由于数据丢失。数据安全包括许多措施：\n\n* – 完整性控制；\n* – 加密；\n* – 数据服务器冗余；\n* – 数据库安全；\n\
  * – 数据可用性。\n\n## 1.6. 安全规范化\n\n安全已成为一项重要挑战，为了避免任何混乱或分歧，规范化是解决方案；这需要定义必要的术语，以及不同的需求和解决方案。\n\
  \n### 1.6.1 基础问题和总体介绍\n\n为了解决分歧问题并为安全提供坚实且结构良好的基础，最近创建了一个标准。它是 `ISO 7498-2:1989`\
  \ 标准，是安全架构的 `OSI` 模型的第二部分。该国际标准由 `ISO/TC 97` 技术委员会创建。\n\n国际电信联盟 (`ITU`) 创建了 `X.800`\
  \ 标准，为开放系统提供了一套安全架构标准。\n\n### 1.6.2 ISO 7498-2 标准\n\n为了解决开放系统之间的安全通信，`ISO 7498-2`\
  \ 的第二部分于 1989 年发布。它：\n\n* – 对参考模型可以提供的安全服务和相关机制进行了通用描述；\n* – 定义了服务和机制可以在 `OSI` 架构的何处提供。\n\
  \n为基础参考模型的每一层都识别了基本的安全服务和机制及其适当的位置。此外，还识别了基础参考模型中安全服务与机制之间的架构关系。在终端、设施和组织中可能需要补充安全措施。这些措施适用于不同的背景。确定需要哪些安全服务来负责这些补充安全措施超出了该国际标准的适用范围。\n\
  \n`OSI` 安全功能仅涉及通信路由的可见方面，允许终端之间相互完成安全信息传输。`OSI` 安全不涉及终端系统、设施和组织内部的必要安全措施，除非这些措施对\
  \ `OSI` 中可见的安全系统的选择和置置产生影响。这些安全方面可以规范化，但无法在 `OSI` 标准框架内进行。\n\n\n\n\n* `Capacity`（令牌）：作为资源标识符使用的令牌，拥有该令牌即意味着拥有该资源的访问权限。\n\
  * `Path`（路径）：用于传输信息的传输通路。\n* `Cryptogram (ciphered text)`（密文）：通过使用加密获得的数据。结果数据的语义内容是不可理解的。\n\
  \n密文可以重新插入到新的加密中以产生`superencryption`（超加密）。\n* `Plain text`（明文）：语义可理解的清晰数据。\n* `Confidentiality`（机密性）：信息的一种属性，即不提供给或共享未经授权的人、用户或进程。\n\
  * `Identity document`（身份证明）：用于建立用户声明身份的传输数据。\n* `Cryptographic analysis`（密码分析）：对密码系统和/或其进出进行分析，以推导出秘密变量和/或敏感信息（包括`plain\
  \ text`）。\n* `Value of the cryptographic check`（密码校验值）：通过对数据单元进行密码转换（参见`cryptography`）获得的信息。\n\
  \n控制值可以通过一个或多个步骤获得，来自一个使用密钥和数据单元的数学函数。它允许我们验证数据单元的完整性。\n* `Cryptography`（密码学）：包括转换信息的原理、手段和方法的学科，其目标是隐藏其内容、防止其修改不被察觉和/或防止其未经授权的使用。\n\
  \n密码学决定了加密和解密方法。针对密码学原理、手段和攻击被称为密码分析。\n* `Data integrity`（数据完整性）：保证数据未以未经授权的方式被修改或破坏的属性。\n\
  * `Data source authentication`（数据源认证）：确认接收数据的源确实是所声明的源。\n* `Decryption`（解密）：可逆加密的反向操作。\n\
  * `Denial of service`（拒绝服务）：授权用户无法访问资源，或为关键操作的处理引入延迟。\n* `Electronic signature`（电子签名）：添加到信息单元的数据，或对数据单元进行密码转换，允许接收者证明数据单元的来源和完整性，防止伪造（例如防止接收者伪造）。\n\
  * `Encryption`（加密）：对数据进行密码转换（参见`cryptography`），产生`cryptogram`。\n\n加密可以是不可逆的。在这种情况下，相应的解密无法完成；哈希函数就是此类情况。\n\
  * `End-to-end encryption`（端到端加密）：在源端内部或端点级别对数据进行`encryption`；相应的`decryption`只能在目的端内部或端点级别进行。\n\
  * `Identity-based security policy`（基于身份的安全策略）：基于用户、一组用户或代表用户行为的实体的身份和/或属性的安全规则；这些规则也可以基于它们寻求访问的资源/对象的身份和/或属性。\n\
  * `Key`（密钥）：一组用于`encryption`和`decryption`操作的符号。\n* `Key management`（密钥管理）：按照`security\
  \ policy`对密钥进行产生、存储、分配、消除、存档和应用。\n* `Link encryption (link by link)`（链路加密）：对系统中每条链路进行`encryption`的特殊应用。\n\
  \n链路加密意味着信息在通过中继实体时以明文形式呈现。\n* `Modification detection`（修改检测）：用于检测信息单元发生修改（无论是意外还是故意的）的机制。\n\
  * `Dissembling`（伪装）：一个实体假装另一个实体。\n* `Notarization`（公证）：由安全的第三方保存数据，允许在日后验证其准确性（内容、来源、日期、交付）。\n\
  * `Passive threat`（被动威胁）：在不修改系统状态的情况下，未经授权共享信息的威胁。\n* `Password`（密码）：机密认证信息，通常由字符链组成。\n\
  * `Homologous entity authentication`（同源实体认证）：确认关联中的同源实体确实是声明的实体。\n* `Physical security`（物理安全）：为确保资源不受故意或意外威胁而采取的措施。\n\
  * `Privacy`（隐私）：个人控制或处理与其相关的可能被收集或存储的信息权利，以及他们对于向谁以及共享这些信息的人的权利。\n\n鉴于此术语与隐私法有关，它可能不够精确，除非出于安全需求，否则应避免使用它。\n\
  * `Repudiation`（否认）：实体之一通过完全或部分地否认参与交换的行为。\n* `Router control`（路由控制）：在路由过程中应用规则，以选择或避免某些网络。\n\
  * `Rule-based security policy`（基于规则的安全策略）：基于用户、一组用户或代表用户行为的实体的身份和/或属性的安全规则。这些规则也可以基于它们寻求访问的资源/对象的身份和/或属性。\n\
  * `Security audit`（安全审计）：对系统保存的活动进行独立审查和检查，以确保符合策略、检测安全漏洞并对控制建议适当的修改。\n* `Security\
  \ audit record`（安全审计记录）：有助于安全审计的收集数据。\n* `Security certificate`（安全证书）：与资源相关的标记，用于命名或指定该资源的安全属性（资源可以是一个信息单元）。标记和/或与资源的关联可以是隐式的或显式的。\n\
  * `Security policy`（安全策略）：用于提供安全的标准组。\n\n完整的安全策略涵盖了 OSI 之外的主题。\n* `Security service`（安全服务）：开放系统组提供的服务，保证系统和信息传输的安全。\n\
  * `Selective protection of fields`（字段选择保护）：对发送消息中某些特定字段的保护。\n* `Sensitivity`（敏感性）：反映资源价值或重要性的特征，在某些情况下反映其脆弱性。\n\
  * `Threat`（威胁）：对安全的潜在违反。\n* `Traffic analysis`（流量分析）：通过观察数据流（存在、不存在、数量、方向、频率）推断信息。\n\
  * `Data flow confidentiality`（数据流机密性）：提供流量分析保护的机密性服务。\n* `Padding`（填充）：在数据单元产生寄生通信实例、寄生信息单元和/或寄生数据。\n\
  * `Confidence functionality`（确认功能）：关于某些标准（如安全策略定义的标准）的预期功能。\n\n## 1.7. 安全服务\n\n\
  我们说的`security service`是指必须满足的安全需求。如果一个计算机系统满足了被称为安全服务的主要条件，则该系统被认为是安全的：\n\n* `authentication`（认证）：数据源；实体之间；\n\
  * `confidentiality`（机密性）：数据的；流量的；\n* `integrity`（完整性）：数据的；流量的；\n* `non-repudiation`（不可否认性）：源的；接收者的；\n\
  * `access control`（访问控制）；\n* `service availability`（服务可用性）；\n* `traceability`（可追溯性）。\n\
  \n认证和完整性可以归类为“authenticity”（真实性）一术语。\n\n\n\n\n这些服务适用于存储在本地、正在处理中或通过网络传输的系统实体和/或信息。\n\
  \n确保公司内部计算机的安全必然包含提供上述提到的不同需求。取决于流量的性质和所处理信息的类型，某些服务比其他服务更为关重要。系统和网络管理员，更广泛地说，安全管理员，必须在满足不同的安全服务时定义优先级。优先级可能会根据情况而改变。\n\
  \n对一项或多项安全服务的任何违反或威胁，都将会对相关系统或公司的安全带来威胁。\n\n### 1.7.1. 身份验证（Authentication）\n\n\
  身份识别（Identification）用于标记或从其他实体中区分出一个，而身份验证是身份的证明；它的作用是确保相关实体确实是刚刚声明身份的那个实体。\n\n\
  说出“我是 X”的行为是一种识别；随后必须跟一种证明我们确实是“X”的手段，这就是身份验证。\n\n基础验证有许多类型，即：我所知的（I know）、我拥（I\
  \ have）和我是（I am）。它们可以单独设置，也可以结合使用。\n\n#### 1.7.1.1 我知道（I know）\n\n这是最简单且最为人知的方法。它通过一组秘密字符组合来验证我们的身份；这就是与登录关联的密码。登录是唯一的，并作为识别。密码是秘密的并作为身份验证。\n\
  \n密码必须满足一组规则以避免任何形式的共享或暴力破解，并能抵御入侵尝试。因此，密码必须满足以下规则：\n\n* – 非平凡的（如 abc, qwerty, 123\
  \ 等）；\n* – 不至于复杂到难以记忆的；\n* – 绝不出现在任何物理位置（纸张、笔记本等）或数字位置（文件、电子邮件等）；\n* – 不源自字典；\n\
  * – 不对应于个人特征（姓氏、名字、车牌号等）；\n* – 不重复使用两次（Facebook 账号、邮箱账号等）；\n* – 大写字母、小写字母、数字和特殊字符的组合；\n\
  * – 定期修改以限制其使用时长。\n\n选择密码的良好做法是从字典中选择一个单词或来自另一种语言（如阿拉伯语）的单词，并使用拉丁字母将其公式化，甚至可以使用数字（例如\
  \ 3a55alem），并确保使用明显的拼写错误（例如用 conbuter 代替 computer）或倒置音节（例如用 terpucom 代替 computer）。\n\
  \n#### 1.7.1.2 我拥有（I have）\n\n在这种场景下，身份验证通过拥有私有的物理对象来保证。芯片卡可以作为一种检查人员的手段。\n\n这种方法是最原始且最易于使用的；它存在某些盲点，这些与将相关对象交给他人的可能性有关。\n\
  \n对于允许公司外部人员使用访客证进入私有区域的身份验证，情况如此。\n\n对于银行卡，我们有两个顺序的身份验证手段：我拥有（卡片）和我知道（密码）。\n\n\
  #### 1.7.1.3 我是（I am）\n\n这是最强大的身份验证手段。它与人的某些个人特征相关，例如数字指纹（我们称之为生物识别验证）或眼睛或手的特征（形状、温度等）。\n\
  \n这种方法可以用于控制场所或关键区域的访问。它对于计算机或系统的身份验证也有用。\n\n### 1.7.2. 机密性（Confidentiality）\n\n\
  这是确保所处理的信息不被任何未经授权的第三方实体泄露的行为。它是防止关键信息传播的保护措施，使用加密技术，使信息对其他非相关实体不可读且不可理解。\n\n###\
  \ 1.7.3. 完整性（Integrity）\n\n这是防止所处理信息被修改的保护。它是检测信息块是否发生修改（无论多么简单）的手段，使用哈希技术，该技术包括生成一个唯一且依赖于相关信息的代表性消息。\n\
  \n### 1.7.4. 非否认性（Non-repudiation）\n\n这是保证信息传输中的任何通信双方（发送者或接收者）都无法否认该交易的行为。\n\n\
  ### 1.7.5. 可追溯性与访问控制（Traceability and access control）\n\n可追溯性意味着能够敏感计算机资源的访问（连接时间、操作列表等）。访问控制包括限制对不同的硬件和软件共享访问。\n\
  \n### 1.7.6. 服务可用性（Service availability）\n\n这是维护服务正常运行的行为，以满足所有场景下授权用户的请求。它是通过措施和技术检测并中和外部实体中断服务的尝试，从而保护服务器本身。\n\
  \n## 1.8. 安全机制（Security mechanisms）\n\n我们所的安全机制是指定义良好的措施或技术，允许提供一项或多项安全服务。\n\n计算机安全机制是提供安全服务的手段。ISO\
  \ 7498-2 标准允许我们指定：\n\n* – 使用共享密钥的加密；\n* – 使用私钥/公钥的加密；\n* – 使用哈希函数的数据完整性；\n* – 身份验证；\n\
  * – 访问控制；\n* – 数字签名；\n* – 公证。\n\n### 1.8.1. 加密（Encryption）\n\n加密是一项使用了几个世纪的技术。它涉及对文本进行修改使其不可理解，除了生成它的人之外。处理这一主题的数学分支称为密码学。这种机制允许提供机密性服务。\n\
  \n加密基于两种基本技术：替换（字母与数字之间的对应关系）和位移（也称为凯撒密码，它允许以循环的方式替换字母）。\n\n自出现以来，这种机制经历了几次演进：最初，第一代解决方案基于一种用于加密以及解密的算法。然后，新一代加密解决方案使用了对称密钥（在凯撒密码中为位移值）。该密钥用于加密和解密。最后，非对称加密被创建了。这涉及一对用于加密和解密的密钥，目的是为了避免共享问题，这是前两代加密的安全性弱点。\n\
  \n我们可以引用以下加密算法作为示例：`DES`、`3DES`、`AES`、`RSA`、`Blowfish` 等。\n\n加密从未是绝对必要的解决方案，因为任何密文都可以通过分析来获取相应的明文。我们称之为密码分析，它是一种基于语言统计的技术。作为一个例子，我们可以想到图灵在二战期间的工作，由于图灵的密码分析机器，盟军发现了敌人总发送给部队的军事信息的明文。\n\
  \n### 1.8.2. 完整性检查（Integrity check）\n\n完整性检查是基于哈希算法的机制，允许提供完整性服务。\n\n哈希算法是一种非双射函数，生成一个唯一的、固定大小的链，即一个由变长度链生成的哈希值。后者可以是数据包、消息、网页或其他内容；它是证明自身完整性的东西。\n\
  \n\n\n\n哈希值在某种程度上代表了一种签名，因为原始消息的任何变化都会产生不同的哈希值，这允许检测到对安全实体的任何更改，并因此确认其完整性。在许多可用哈希算法中，最重要的是\
  \ `MD5`（16 字节）和 `SHA1`（20 字节）。\n\n### 1.8.3. 访问检查\n\n访问检查是提供身份验证服务的机制。身份验证技术可以分为三大类，分别与持有物、对实体的认知或个人特征（生物识别、语音等）相关联。\n\
  \n身份验证对于确保对任何服务的本地或远程访问是必要的；它是限制访问和识别责任的最好方法。\n\n最常用的身份验证技术是基于密码的。这种技术要求对密码的选择、寿命和使用施加限制条件，而密码是任何计算机系统的关键要素和核心要素。\n\
  \n### 1.8.4. 电子签名\n\n数字签名（有时称为电子签名）是一种机制，它类似于纸质文档上的手写签名，能够保证电子文档的完整性并验证其作者。数字签名机制必须：\n\
  \n* – 允许文档阅读者识别签署的个人或公司；\n* – 保证文档在作者签名之时与阅读者查看之时之间没有被篡改过。\n\n### 1.8.5. 公证\n\n\
  电子公证是对电子文档演变过程中不同步骤的认证，其目的是：\n\n* – 保证双方交换的电子消息的内容、来源、日期和目的地；\n* – 安全地存档数字文档。\n\n\
  电子公证允许电子交换的证据被验证和存储，并允许受信任的经过认证的第三方对其进行电子存储（就像公证员一样）。由于这种技术为监控和存档交易（无论发送还是接收）提供了不同的机制（数据的完整性、来源、日期和目的地），因此它提高了了交换和电子存储的安全性。\n\
  \n## 1.9. 良好实践\n\n可以通过良好的实践来确保计算机安全，这些实践可以减轻安全风险，并使攻击变得越来越困难。习惯和技术方面的良好实践包括：\n\n\
  * – 制定一份书面安全策略；\n* – 对员工进行有关社会工程风险的培训，并制定通过电话、电子邮件甚至面对面验证其身份的策略；\n* – 对系统进行物理访问检查；\n\
  * – 使用强密码并定期更换；\n* – 对敏感信息进行加密并用密码保护；\n* – 限制操作系统的连接权限；\n* – 开发安全设备和软件；\n* – 定期保存并测试保存的文档；\n\
  * – 禁用未使用的服务和端口；\n* – 通过每周或每天安装补丁来保持更新，以避免缓冲区溢出和由于权限提升导致的攻击；\n* – 定期计划安全审计以测试网络和系统，并确保实施这些审计提出的建议。\n\
  \n## 1.10. 结论\n\n计算机安全目前被认为是此处讨论问题的解决方案，正如统计所示。弱点和漏洞众多且多样，涵盖了计算的每一个层面，从设备到软件，从基础设施和结构到用户和管理员。\n\
  \n计算机安全允许我们涵盖许多领域，并规划组织、文化和技术解决方案，以为各种弱点和漏洞提供解决方案元素。\n\n安全的目标是确保计算机系统保持正常的运行状态，它涉及到多个外部和内部要点，涉及物理和软件、物质和人类等。\n\
  \n严格意义上，计算机安全的技术方面可以归结为神奇术语 `ACID`，这是一个法语缩写，代表了要保证正常运行需要满足的四点：身份验证、机密性、完整性和 `Disponibilité`（即可用性）。但为了验证这些点，我们必须熟悉弱点和漏洞。\n\
