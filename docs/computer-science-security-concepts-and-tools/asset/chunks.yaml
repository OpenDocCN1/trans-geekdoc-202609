- raw: "### 1.3.1. *Passive/active classification of attacks*\n\nThe attacks that\
    \ allow security to be called into question can be classified into two types:\
    \ passive and active, depending on their impact and the degree of involvement\
    \ in the communication process. We can also speak of reconnaissance attacks and\
    \ access attacks.\n\n#### 1.3.1.1. *Passive attack (reconnaissance attack)*\n\n\
    The passive attack, also called the reconnaissance attack, consists of passively\
    \ observing information or its characteristics, whether it is inside a computer\
    \ or being transferred through a network. This attack can be led through a family\
    \ of software called sniffers or network observers. These kinds of software are\
    \ very easy to find on the Internet, and they allow, on the one hand, the characteristics\
    \ and configurations of systems and networks to be scanned by exploiting the many\
    \ faults and vulnerabilities in the systems and networks, and on the other hand,\
    \ traffic to be analyzed so the flux of information can be extracted.\n\nThe reconnaissance\
    \ attack can be implemented through a set of elementary actions:\n\n*   – initial\
    \ request to the target;\n\n*   – ping sweep of the target network;\n\n*   – scan\
    \ port for active IP addresses;\n\n*   – scan for flaws;\n\n*   – exploitation\
    \ of tools (appropriate sniffers and malware).\n\nWe can cite the following sniffers\
    \ by way of example: Wireshark, WinPcap, WebSiteSniffer, SocketSniff, SmartSniff,\
    \ Packetyzer, PacketViewer, PacketMon, CommView and IP Sniffer.\n\nWe can distinguish\
    \ numerous scenarios:\n\n*   – *Discovery of users*: this occurs when the identities\
    \ of the participants in a particular communication are discovered.\n\n*   – *Discovery\
    \ of inter-message duration*: this occurs when the frequency of messages is discovered,\
    \ which allows the nature of the application to be identified (interactive, etc.).\n\
    \n*   – *Discovery of information itself*: this is the discovery of the contents\
    \ of communicated information. It is the most serious kind of passive attack.\n\
    \n#### 1.3.1.2. *Active attack (access attack)*\n\nAn active attack, also known\
    \ as an access attack, consists of acting upon information and/or the communication\
    \ process, and is therefore more serious than a passive attack. It involves the\
    \ modification of data or messages, entering the network equipment or perturbing\
    \ the proper functioning of the system and network.\n\nThe primary objectives\
    \ in an access attack include:\n\n*   – gathering data;\n\n*   – gaining access;\n\
    \n*   – granting greater access privileges.\n\nWe can distinguish different scenarios:\n\
    \n*   – *Fraudulent connection*: this occurs when a connection is established\
    \ with a server without the right to connect. This connection allows the attacker\
    \ to make changes as if they were the owner of the account. They can erase documents,\
    \ change the configuration, etc.\n\n*   – *Denial of service*: this occurs when\
    \ one or more authorized users are prevented from accessing a service. It consists\
    \ of attacking the server and making it go offline, which paralyzes all access.\
    \ This kind of attack is known as a DoS (Denial of Service). We can also speak\
    \ of DDoS (Distributed DoS), which is an attack that happens when a principal\
    \ computer manages to take control of numerous computers and uses them to attack\
    \ victims so that they go offline.\n\n*   – *Message alteration*: this consists\
    \ of modifying the order of messages by capturing some of them before reinserting\
    \ them later.\n\n*   – *Interruptions/delays in communication*: this happens when\
    \ a hacker manages to stop a connection or delay message access and transmission.\n\
    \n*   – *Modification/disclosure of message content*: the most serious act, which\
    \ consists of modifying or publicizing the content of sent messages.\n\n*   –\
    \ *Port redirection*: this consists of redirecting traffic in a general manner\
    \ or redirecting a response, operation or command to a third-party, unauthorized\
    \ computer.\n\n*   – *Man-in-the-middle*: this is an attack that allows a third\
    \ party to intercede between two entities in communication, without the latter\
    \ being aware.\n\n*   – *Buffer overflow*: this attack consists of exploiting\
    \ the buffer capacity, possible in a weakly written language such as C, with the\
    \ purpose of placing a well-chosen code within the memory and creating a system\
    \ or network failure.\n\n*   – *IP, MAC, DHCP spoofing*: this attack allows the\
    \ identity of an authorized computer (IP address, MAC) to be exploited for an\
    \ attack or to redirect information.\n\n*   – *Loss of data*: this represents\
    \ the most expensive attack, given that once lost, data requires an enormous effort\
    \ to be recuperated and restored to the same level, which is not efficient in\
    \ the majority of cases and can cause very serious financial repercussions for\
    \ a company. The points of vulnerability that can facilitate the loss of data\
    \ are:\n\n*   – email access/non-secure webmail;\n\n*   – unchecked peripherals;\n\
    \n*   – cloud storage;\n\n*   – detachable media;\n\n*   – inappropriate access\
    \ check that does not satisfy the minimal requirement for security.\n\n### 1.3.2.\
    \ *Direct/indirect classification of attacks*\n\nOn the Internet, an attack can\
    \ directly target a victim with their own identity or resources, or can hide behind\
    \ an intermediary, in some cases using the latter’s identity and/or resources.\n\
    \n#### 1.3.2.1. Direct attack\n\nThis is the simplest attack and also the easiest\
    \ to detect. It consists of launching an attack request on a victim using their\
    \ own identity (IP address, MAC address) and resources (memory, CPU and hard drive),\
    \ as illustrated in [Figure 1.1](#c01.xhtml#fig1-1). These have become more and\
    \ more rare, with the most serious hackers seeking to hide themselves or gain\
    \ further abilities, given that users have developed ways to detect attack connections\
    \ that are launched directly.\n\n ![Figure 1.1. Direct attack](images/fig1-1.jpg)\n\
    \n[**Figure 1.1.**](#c01.xhtml#ifig1-1) *Direct attack*\n\n#### 1.3.2.2. *Indirect\
    \ attack*\n\nThis is the most complex attack and the most difficult to track.\
    \ There are two kinds:\n\n*   – The first attack is by rebound, which refers to\
    \ an intermediary computer that is used for its identity or resources in an attack.\n\
    \n*   – The second attack is by response, which exploits a server as if it were\
    \ an intermediary computer to attack a third one.\n\n##### 1.3.2.2.1. Rebound\n\
    \nThe pirate tries to take control of the intermediary computer, which generally\
    \ has better resources, as illustrated in [Figure 1.2](#c01.xhtml#fig1-2). It\
    \ will be used to create a rebound such that the identity and the resources of\
    \ the victim are used to attack their computer, so that the real attacker cannot\
    \ be identified in any way. We speak of two attacks in a chain. New variations\
    \ on attacks of this kind are based on three or more chain attacks, and in this\
    \ scenario, we are dealing with two or more rebounds. The rebound is itself a\
    \ victim, even though it is the starting point for the attack that targets the\
    \ final victim.\n\nIt is for this reason that we must not neglect the security\
    \ of a computer just because it has no use; such a computer could be used as a\
    \ rebound, especially in a case where it can provide ample resources.\n\n![Figure\
    \ 1.2. Indirect attack by rebound](images/fig1-2.jpg)\n\n[**Figure 1.2.**](#c01.xhtml#ifig1-2)\
    \ *Indirect attack by rebound*\n\n##### 1.3.2.2.2. Response\n\nThe attacker sends\
    \ a request to a server in such a way that they send the response to a third computer,\
    \ as illustrated in [Figure 1.3](#c01.xhtml#fig1-3). The attack concerns the third\
    \ computer insofar as it receives a response that it did not solicit and which\
    \ can introduce an error, inhibit its functioning, oblige it to react through\
    \ misconduct or even take it out of service.\n\n![Figure 1.3. Indirect attack\
    \ by responding](images/fig1-3.jpg)\n\n[**Figure 1.3.**](#c01.xhtml#ifig1-3) *Indirect\
    \ attack by responding*\n\nThe attack by response is necessarily done through\
    \ a server that will not be attacked itself, whereas the rebound attack manifests\
    \ itself as two attacks in a chain.\n\n### 1.3.3. *Examples of attacks*"
