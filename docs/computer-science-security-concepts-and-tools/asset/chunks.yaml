    在仅有一个 LAN 分支的情况下，我们有一个包含所有内部设备的唯一物理段。我们选择通过 `VLANs`（虚拟局域网）进行软件分段。共有三种 VLAN 技术。


    使用物理端口的 VLAN 技术将交换机的每个端口分配给一个 `VLAN`（通过数字识别）。这是最简单但最僵化的方案，因为计算机可能会通过更改连接端口面临改变虚拟段的风险。


    使用 `MAC address` 的 VLAN 技术提供了端口级安全性，并为每个端口分配固定的 `MAC address`。此外，它会学习并创建虚拟分段（`DMZ`
    等），从而模拟物理分段的分布。


    表 4.3 显示了防火墙在三个分段与互联网之间应用的通用过滤策略，每种策略都是相互对应的。


    ![表 4.3. 单防火墙下 DMZ 实现中的流量过滤](img/py2.jpg)


    **表 4.3.** *单防火墙 DMZ 实现中的流量过滤*


    #### 4.4.1.2. 双防火墙拓扑


    DMZ 分段界于两个防火墙之间：一个外部防火墙用于过滤互联网与本地网络之间的流量，另一个内部防火墙则进一步过滤安全区域内的流量，这使得该区域的访问变得更加困难（因为需要通过两个防火墙）。


    ![图 4.6. 双防火墙下的防火墙实现](img/fig4-6.jpg)


    **图 4.6.** *双防火墙下的防火墙实现*


    ## 4.5 结论


    物理和虚拟层面的访问控制是必要的安全措施，它可以减少欺诈访问的风险，并允许对所有连接和连接尝试进行监控。这通过软件组件 `ACLs` 和防火墙实现了这一功能。


    `ACLs` 是控制和限制网络流量的一种初级方法。它们为计算系统提供了物理和虚拟双重安全性。这在许多层次提供了多样化的静态和动态过滤功能。尽管它们重要且高效，但这种原则的演进是通过使用名为防火墙的专用设备来实现的。


    防火墙是公司不可或缺的安全解决方案。使用物理防火墙对于保障公司范围的远程访问是必要的，而使用虚拟防火墙仍然是保护不同服务器、工作站以及公司物理和虚拟资产的必要措施。然而，防火墙如果不与其他解决方案（如防病毒软件和
    `IDS`）结合，永远无法解决安全问题。


    # 5 入侵检测的技术与工具


    ## 5.1 引言


    病毒是最严重、最广泛且为人知的入侵类型。每天都会产生大量的恶意软件，尤其是病毒。对于这类问题，需要一种保护工具，因此杀毒软件作为一种特定的安全解决方案被开发出来。


    防火墙是一种限制攻击概率的通用安全解决方案，而杀毒软件是一种旨在保护计算机免受病毒侵害的特定安全解决方案。然而，这两种解决方案在保证计算机系统安全性方面仍然存在局。因此，必须使用入侵检测系统来确保安全，并克服防火墙和杀毒软件的局限。这是一种更复杂的解决方案，利用多种手段来检测和消毒入侵工具。


    ## 5.2 杀毒软件


    防火墙是一种限制攻击概率的通用安全解决方案，而杀毒软件是一种旨在保护计算机免受病毒侵害的特定安全解决方案。然而，这两种解决方案在保证计算机系统安全性方面仍然存在限制。因此，必须使用入侵检测系统来确保安全，并克服防火墙和杀毒软件的局限性。这是一种更复杂的解决方案，利用多种手段来检测和消毒入侵工具。


    ### 5.2.1 杀毒软件的功能


    杀毒软件是用于检测、隔离和破坏以下内容的软件：


    - **检测**：它使用多种方法识别病毒。

    - **隔离**：它隔离感染文件以保护计算机。

    - **破坏**：它删除与病毒的文件。


    ### 5.2.2 检测方法


    第一代杀毒软件仅限于已知病毒，而现在它们已变得越来越智能。


    #### 5.2.2.1 已知病毒检测


    已知病毒可以通过特征进行检测。这是病毒库的功能。


    #### 5.2.2.2 未知病毒检测


    未知病毒的检测是一项挑战任务，基于以下技术：


    - **行为分析**：涉及根据行为检测病毒。

    - **完整性控制**：涉及检查程序的更改。

    - **多级通用检测**：这是一种基于特征的复杂技术。


    ### 5.2.3 杀毒软件采取的操作


    尽管使用杀毒软件不需要专业知识，但它需要一些基础任务：


    - **分析**：用户可以显式请求对磁盘、外部驱动器或文件进行分析。

    - **更新**：用户必须定期下载以包含新病毒。


    ### 5.2.4 杀毒软件组件


    杀毒软件由四部分组成：


    - **扫描器**：按需分析计算机指定区域的文件。

    - **监控**：在访问文件时进行简要分析。

    - **病毒库**：由不同已知病毒特征组组成的数据库。

    - **日志**：由用于保存历史、活动和操作的记录组成。


    ### 5.2.5 杀毒软件与防火墙的对比


    杀毒软件作为特定解决方案，可以与通用解决方案防火墙进行对比，如表 5.1 所示。


