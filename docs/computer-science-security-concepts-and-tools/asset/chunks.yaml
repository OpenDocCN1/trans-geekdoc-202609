    \ message provides a different hash code, which allows for the detection of any\
    \ change to the secure entity, and consequently confirms its integrity. Of the\
    \ many hash algorithms that are available, the most important are MD5 (16 bytes)\
    \ and SHA1 (20 bytes).\n\n### 1.8.3. *Access check*\n\nAn access check is the\
    \ mechanism allowing for the provision of an authentication service. Authentication\
    \ techniques can be classified into three large families tied to possession, knowledge\
