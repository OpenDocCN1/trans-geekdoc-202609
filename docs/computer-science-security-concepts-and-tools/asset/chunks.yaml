    ## 5.3. 入侵检测系统


    入侵检测系统（IDS）是一种用于识别被分析对象（网络或主机）中异常或可疑活动的防御机制。因此，它能够提供有关成功入侵以及失败尝试的知识。IDS 经过了显著的演变，包含了多种形式，主体形式，并可以在多个层级上运行。


    ### 5.3.1. IDS 的目的


    IDS 确保识别环境中的所有入侵行为，并及时对这些行为提供通知。


    IDS 是一种基于多种且互补技术的监控系统。它必须通报任何检测到的结果，以便在正确的时刻做出反应，并找到必要的补救或预防措施，从而规避或化解攻击。


    ### 5.3.2. IDS 的组件与功能


    IDS 由许多元素组成：


    *   `Production stack`（生产栈）：它由系统平台在大多数网络操作中的一组集成 `TCP/IP` 模块组成。它能检测 `IPv4` 和 `IPv6`
    的入侵和外泄。

    *   `Service stack`（服务栈）：它由系统平台服务和支持中的一组集成模块组成。它能检测 `IPv4` 的入侵和外泄，并作为生产栈的第一道响应。

    *   `IDS task`（IDS 任务）：这是处理由 `production stack` 和 `service stack` 生成事件的组件。

    *   `Graphic interface`（图形界面）：它允许从审计记录中实现事件可视化。

    *   `IDS notification`（IDS 通知）：这是通过电子邮件发送消息的告警组件。

    *   `Audit record`（审计记录）：它维护日志。


    IDS 组件及其运行的环境如图 5.1 所示。


    IDS 的工作方式如下：


    *   当 `production stack` 或 `service stack` 检测到高级入侵或外泄时，它会向 `IDS task` 发送一个事件事件。

    *   `IDS task` 按照顺序逐个获取事件，并确保每个事件都对应于一个条件（来自端口表）。`IDS task` 还会维护有关入侵和外泄事件的统计数据。

    *   IDS 对超出策略文件中设置的阈值的事件发出通知。

    *   如果发生事件通知，则会在审计日志中创建一个入侵监控记录。

    *   IDS 图形展示来自审计日志文件夹的入侵事件。

    *   如果在 `IDS properties page` 中配置了电子邮件和通知消息，`IDS notification` 将向指定地址发送电子邮件并向消息文件发送消息。


    ![图 5.1. IDS 组件与功能](img/fig5-1.jpg)


    **图 5.1.** IDS 组件与功能


    ### 5.3.3. IDS 分类


    IDS 可以根据作用范围（计算机或网络）或保护层级（简单检测或检测/预防）进行分类。


    #### 5.3.3.1. 按作用范围分类


    根据需要保护的对象是计算机还是网络，我们区分了 `H-IDS`（基于主机的入侵检测系统）和 `N-IDS`（基于网络的入侵检测系统）。


    ###### H-IDS


    H-IDS，或计算机入侵检测系统，是专门监控设备和操作系统的 IDS。`H-IDS` 收集设备或操作系统提供的信息。为此，有不同的方法：特征码和行为。


    `H-IDS` 的行为类似于系统主机上的守护进程或标准服务，通过将其与标准进行比较来检测可疑活动。如果活动与标准差异很大，则会生成告警。计算机可以通过多种方式进行监控：


    *   `computer activity`：进程的数量和列表、用户、使用的资源等；

    *   `user activity`：连接的时间和持续时间、使用的命令、发送的消息、启动的程序、超出预定义范围的使用等；

    *   `malicious activity`：由蠕虫、病毒或木马产生的恶意活动。


    另一类型的 `H-IDS` 寻找系统内核中的入侵以及其中进行的任何修改。这种技术被称为 `protocol analysis`，这是一种不需要搜索特征数据库的技术。


    ###### N-IDS


    N-IDS，或基于网络的入侵检测系统，是专门监控网络安全状态的 IDS。`N-IDS` 分析可以分为三个通用部分：捕获、特征和告警。


    *   `Capture`（捕获）：实时捕获网络流量。大多数 `N-IDS` 使用名为 `libpcap` 的标准数据包获库，该库在大多数平台上可用。

    *   `Signatures`（特征）：这是一个攻击特征库（按上下文分类），其使用方式类似于杀毒软件。因此，当 `N-IDS` 熟悉攻击时它是高效的，当不熟悉时它是低效的。商业和免费工具已经演进到提供特征个性化，这允许处理仅已知部分元素的攻击。基于特征的工具需要更频繁的更新。

    *   `Alerts`（告警）：这些通常以日志的形式保存。存在一种组织这些的标准。`IDMEF`（入侵检测消息格式）在 `RFC4765` 中描述。这种格式允许
    IDS 关注其包含的内容。


    ### 5.3.4. IDS/IPS 示例


    在本节中，我们将介绍一些提供开源或商业解决方案的 `IDS` 示例。每个的优点、缺点和分类将得到解释。


    #### 5.3.4.1. Snort


    `Snort` 是一个免费的 `IDS/IPS`^(1)。它提供几种模式：


    *   `Listening mode`（监听模式）：以嗅探模式启动 `Snort`，以便观察由 `IDS` 识别的数据包。


    '
