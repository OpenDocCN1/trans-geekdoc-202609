    区块链技术在本章中已经介绍，它通常用于保护传感器与物联网（IoT）网络节点之间的交易和通信。由于传感器是关键实体，且在能量和配置方面的资源最少，因此需要通过一种分布式且自主的解决方案来保护。


    该技术可以通过以下方式解决物联网面临的许多安全和信任挑战：


    *   监控传感器数据并防止恶意数据；

    *   为物联网设备提供身份识别、认证和数据的安全传输；

    *   允许物联网传感器之间进行安全、直接的数据交换，而无需中介机构；

    *   通过分布式账本消除物联网生态系统中的单点故障；

    *   由于没有中介设备，通过更低的运行成本简化物联网的部署；

    *   通过区块链对物联网设备进行寻址，提供持久的历史记录。


    ## 7.4 结论


    SDN 作为一种基于虚拟化的网络解决方案，通过使用软件解决方案使其管理、行政甚至安全性变得更加灵活。随着虚拟化技术和云计算的演进，SDN 将日益促进控制服务和任务的自动化，用于管理涵盖监控和过滤功能的网络，提供更好的安全性。


    访问控制通过使用多种编程语言的脚本和程序来确保。加密和完整性验证可以使用区块链来保证。


    鉴于世界变得越来越连接，每天都有大量新人员和大约五倍数量物体相互连接，并参与产生海量数据。


    传感器在物理和能量层面，以及微软件和应用方面面临安全方面的局限性和挑战。


    安全性可以通过一系列措施来确保，包括物理安全、能量自主和使用区块链的访问控制，以及过滤技术和传统安全。


