    ## 6.3. IPSec


    IPSec provides authentication of IP packets via the `AH` protocol and confidentiality
    of data via the `ESP` protocol.


    The IPSec protocol is applicable in two modes, the transport mode and the tunnel
    mode. The first is the simpler mode that only concerns the data, while the second
    secures the entire IP packet (header and data). We speak of IP in IP encapsulation.
    The tunnel mode is used, among other things, as a basic technique for implementing
    VPNs.


    The family of IPSec protocols includes two complementary techniques, `AH` and
    `ESP`. These manage both the implementation of numerous encryption algorithms
    (`DES`, `3DES`, `Blowfish`, `RSA`, etc.) and hashing (`MD5`, `SHA1`, etc.). The
    configuration of an IPSec communication determines the appropriate choice of algorithms
    to be used. IPSec was defined by the IETF as a chain of 40 `RFCs` that detail
    all aspects of the protocol. Moreover, IPSec is automatically integrated with
    `IPv6`.


    IPSec uses the notion of a security association (`SA`) to define usage and the
    security parameters to apply for different parties.


    An IPSec security association is a structure of data whose function is to record
    all of the security parameters associated with a communication. Since an `SA`
    is unidirectional, two `SAs` are needed to protect a communication in both directions.


    ### 6.3.1. AH


    `AH`, or Authentication Header, is a protocol that provides authentication and
    guarantees the integrity of IP packets. It is applicable in transport mode and
    tunnel mode.


    The `AH` protocol offers the following security services:

    * – integrity in non-connected mode;

    * – authentication of data;

    * – anti-replay (optional).


    ### 6.3.2. ESP


    `ESP`, or Encapsulating Security Payload, is an IPSec protocol that provides confidentiality
    and can offer authentication, ensure the integrity of data and the anti-repudiation
    of sessions. It is applicable in transport mode and tunnel mode.


    The `ESP` protocol offers the following security services:

    * – confidentiality;

    * – protection against traffic analysis;

    * – integrity in non-connected mode (like `AH`);

    * – authentication of data (like `AH`);

    * – anti-replay (like `AH`).


    `ESP` indeed covers the services offered by `AH`.


    ### 6.3.3. Different IPSec modes


    Security can involve only the IP packet data or it can apply to the entirety of
    the packet (header and data). We can distinguish two application modes for IPSec,
    transport and tunnel mode.


    #### 6.3.3.1. Transport mode


    This ensures the security of the IP packet data. Transport mode is the default
    mode of IPSec and is used for end-to-end communications (communications between
    a client and a server). When transport mode is used, IPSec only encrypts the IP
    payload. Transport mode provides protection for the IP payload via an `AH` or
    `ESP` header.


    #### 6.3.3.2. Tunnel mode


    This offers security for the IP packet (header and data). When IPSec tunnel mode
    is used, IPSec encrypts the IP header and payload.


    Tunnel mode offers protection for the entirety of the IP packet by considering
    it an `AH` or `ESP` payload. In tunnel mode, a complete IP packet is encapsulated
    with an `AH` or `ESP` header and a supplementary IP header. The IP addresses for
    the exterior IP header are the endpoints of the tunnel, while those for the encapsulated
    IP header are the real source and destination addresses.


    IPSec tunnel mode is useful for protecting traffic between different networks
    when the traffic must pass through an unapproved intermediary network. It is used
    especially for interoperability with gateway and terminal systems that do not
    accept IPSec connections.


    Tunnel mode can be used in the following configurations:

    * – gateway to gateway;

    * – server to gateway;

    * – server to server.


    ### 6.3.4. Different IPSec implementations


    Since it appeared, the family of IPSec protocols has been overhauled many times.
    There is a huge divergence between versions. From a practical standpoint, IPSec
    is a relatively difficult protocol to implement, on the one hand due to its intrinsic
    complexity, and on the other hand due to its interactions with common processes.
    Because of this, there are three variants of the implementations:


    * – *modification of the kernel stack*: this is the most direct method and probably
    the most complicated. This method is applicable to all types of entities (hosts
    and gateways);

    * – *Bump-In-The-Stack (BITS)*: consists of separating IPSec processing from the
    usual IP stack (hence the name). Nevertheless, certain elements must be modified
    in this stack, such as the fragmentation and reassembly of packets. Additionally,
    the kernel remains intact in this type. (hosts and gateways).

    * – *Bump-In-The-Wire (BITW)*: this consists of setting IPSec processing aside,
    and thus the code, in a dedicated space placed upstream from the network (hence
    its name), outside of the computer. This kind of location can be a specific “box”,
    firewall, router, etc. Depending on its type, this method will not apply to all
    kinds of hosts.


    ### 6.3.5. Different IPSec encapsulations


    This section will present the different possible transformations of the IP packet
    during the application of each of these techniques (`AH` and `ESP`) in each mode
    (transport and tunnel).


    #### 6.3.5.1. AH in transport mode


    AH in transport mode consists of authenticating the IP packet data. This task
    requires the addition of an `AH` header to the other part of the packet, while
    keeping the header of the original packet intact.


    ![Figure 6.7. AH encapsulation in transport mode](images/fig6-7.jpg)


    **Figure 6.7.** *AH encapsulation in transport mode*


    #### 6.3.5.2. ESP in transport mode


    ESP in transport mode consists of encrypting the IP packet data. This task requires
    the addition of an `ESP` header and ESP footer to the data, while keeping the
    original header of the packet intact.


    The resulting data, now composed of the added `ESP` header and the original data,
    will be authenticated. The encryption and authentication also concern a part of
    the footer.


    ![Figure 6.8. ESP encapsulation in transport mode](images/fig6-8.jpg)


    **Figure 6.8.** *ESP encapsulation in transport mode*


    #### 6.3.5.3. AH-ESP in transport mode

