- raw: '*   – *External users*: these are composed of consultants and security auditors
    participating in audits within the company or assisting with the resolution of
    a precise security problem, or any other external collaborator in the field of
    computing.


    #### 8.3.2.2. *Security policy steps*


    The establishment and application of a security policy goes through several steps,
    which are defined as follows:


    *   – designate a computer security manager who will be in charge of creating,
    applying and updating the security policy;


    *   – define the perimeter and objectives of the computer security policy, in
    order to limit the field of application of this policy and be able to evaluate
    its impacts and influences for better efficiency;


    *   – analyze the existing equipment and software, and maintain an updated register
    of all of the elements making up the computer system. This register is important
    during modifications of components of the computer configuration. In the case
    of an incident, it can help IT teams find the origin of the problem and identify
    responsibilities;


    *   – analyze computing risks in terms of possible damage and the probability
    that an incident will occur;


    *   – determine the necessary means for reducing risks and taking charge of incidents,
    or for managing continuous activity;


    *   – write a computing charter for all collaborators;


    *   – communicate the computer security policy, with all of its details and procedures,
    to all users within the company.


    ### 8.3.3. *Elements of a security policy*


    For a security policy to be efficient and applicable, it must be composed of several
    complementary elements that cover different hierarchical levels of the company.


    #### 8.3.3.1. *Governance policy*


    The importance of computer security demands a high-level intervention in a company
    with the purpose of increasing the efficiency of decision-making and action-taking.


    To satisfy this requirement, a security manager and security committee are necessary.


    The security manager reports to the management of computer services, fulfilling
    the following tasks and abilities:


    *   – they can send alerts to general management;


    *   – they have the logistical and financial means and the necessary authority
    to complete tasks;


    *   – they can define and apply the security policy in direct cooperation with
    the members of the security committee;


    *   – they must periodically prepare a report with a security inventory.


    The security committee includes and brings together the pertinent actors of a
    company, that is, all of the directors. It is led by the security manager and
    ensures technical vigilance and creates a culture of cyber security.


    #### 8.3.3.2. *Technical policy*


    The technical section of the security policy covers technical domains. It varies
    depending on the material and software assets installed, and the degree of criticality
    of the information that is dealt with.


    A technical security policy is composed of a group of technical measures and solutions
    for saving, filtering, monitoring and follow-up. The distinct areas are as follows:


    *   – establishment of anti-malware software such as antivirus, antispam and antispyware,
    with the necessary updates and patches;


    *   – deployment of filtering solutions using routers and firewalls;


    *   – development and application of a saving policy;


    *   – development of specific solutions to apply depending on installed services.


    #### 8.3.3.3. *End-user policy*


    The section on security culture is of capital importance. It must be addressed
    to all personnel without neglecting any of the end-users. The end-user is anyone
    with access to the computer system and represents an important link in the chain
    of computer security and the policy to be established.


    The user must be sensitized and informed via targeted training sessions, posters
    and charters, which must be adhered to.


    ## 8.4. Norms, directives and procedures


    Several norms and standards can be used when conducting an audit or following
    up on its results and impacts, as well as in establishing a computer security
    policy:


    *   – *family of ISO 20000 norms*: ISO 20000-1 and ISO 20000-2 norms are standards
    describing the management processes for efficient delivery of computer services
    to a company and its clients. These respect ITIL requirements^([6](#c08.xhtml#fn6));


    *   – *family of ISO 27000/ISMS norms*: establishment, use, updating and management
    of a computer security policy, or information security management systems (ISMS);


    *   – *ISO/FDIS 31000 norm*: risk management;


    *   – *ISO/IEC 38500 norm*: computer security governance;


    *   – *British Standards Institution BS 25999-1 norms*: BCM, practice codes;


    *   – *British Standards Institution BS 25999-2 norms*: BCM, specifications.


    ### 8.4.1. *ISO 27000 norm*


    The ISO 27000 series of norms was specifically reserved by the ISO for questions
    of information security. The 27000 series includes a range of individual norms
    and documents. A certain number of them have already been published.


    *   – *ISO 27001*: this is the specification of an information security management
    system (ISMS) that replaced the former BS7799-2 norm.


    *   – *ISO 27002*: this is the standard number of the 27000 series that was at
    the origin of the ISO 17799 norm (formerly known as BS7799-1).


    *   – *ISO 27003*: this will be the official number of a norm meant to offer suggestions
    for establishing an ISMS (IS management system).


    *   – *ISO 27004*: this norm covers measures and metrics for managing information
    security systems, including the controls suggested in ISO 27002.


    *   – *ISO 27005*: this ISO norm is independent of the methodology for managing
    risks connected with information security.


    *   – *ISO 27006*: this norm offers guidelines for accrediting organizations that
    offer an ISMS certification.


    ### 8.4.2. *ISO/FDIS 31000 norm*


    ISO 31000 designates a family of norms for managing risks, codified by the international
    organization for normalization. The objective of the ISO 31000 norm is to offer
    the principles and guidelines for risk management, as well as the processes for
    establishing it strategically and operationally. It does not seek to promote the
    uniformity of risk management in organizations, but rather to harmonize the multitude
    of existing approaches, standards and methodologies for risk management.


    Currently, the ISO 31000 family includes:


    *   – ISO 31000:2018, Risk management, Principles and Guidelines;


    *   – ISO/CEI 31010:2009, Risk Management, Risk Evaluation Techniques;


    *   – ISO Guide 73:2009, Risk Management, Vocabulary.


    ### 8.4.3. *ISO/IEC 38500 norm*


    ISO/IEC 38500 is the international norm for the governance of information technology
    by companies. It is the first official norm for computer governance.


    This norm concerns the governance of management processes related to information
    and communication services used by an organization. These processes can be controlled
    by computer specialists in an organization or by external service providers.


    ## 8.5. Conclusion


    Security audits are necessary for securing computer systems, but they remain insufficient;
    they must be completed and heeded by technological monitoring throughout a company,
    in order to follow the daily state of security through audit and surveillance
    tools, and through a strictly cooperative relationship with appropriate organizations.


    The security audit constitutes an important step for the survival of a company.
    It provides a constructive external critique by experts in the domain. This task,
    required by law, is beneficial for a company seeking to protect its computing
    assets.


    A security policy, well-defined and correctly applied, is the finishing touch
    to the security measures and activities taken by users. It covers organizational
    and technical aspects and creates a culture that protects the company from risks
    and threats.'
