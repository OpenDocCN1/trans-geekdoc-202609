    - – The third technique, called “I am”, is the strongest form of authentication
    insofar as it is dependent on a personal characteristic of the user being authenticated
    (fingerprint, speech, etc.).


    In certain scenarios, numerous techniques can be combined for better security,
    which is the case with banking cards (“I have” the card and “I know” the code).


    The password must require a certain number of criteria in order to prevent it
    from being disclosed, which would potentially cause irreparable damage to the
    system or the entity requiring security. It must also have a limited lifetime.


    In order to ensure authentication in a controlled and centralized way, `AAA` services
    were invented to offer a certain number of complementary functions that provide
    both authentication and an access log.


    Authentication as a security service can be offered on network equipment via `Telnet`
    and `SSH` protocols, without any need for an `AAA` server. This method of authentication
    includes limits on the database of accounts that can be used to access the security
    configuration itself. Because of this, the configuration of an `AAA` server allows
    the deficiencies described above to be resolved and provides two additional functionalities,
    namely authorization and accountability, hence `AAA`.


    An `AAA` service can use a local database, used only for authentication, or a
    remote database used to provide the three services: authentication, authorization
    and accountability. There are two possible modes of `AAA`: local or on a server.


    ## 3.2. Theoretical concepts of authentication


    In order to avoid confusion, we must distinguish authentication from identification,
    two terms with different meanings and representing two complementary aspects of
    security. These two aspects can be provided in a coupled or separate manner.


    ### 3.2.1 Identification


    This is the act of distinguishing ourselves from others by presenting our identity,
    which can be in the form of a name, an `IP` address, a physical address or a `MAC
    address`. Whatever is used as identification must be unique in its context in
    order to be able to distinguish it, as is the case of a login or any other user
    identity.


    ### 3.2.2 Authentication


    This is proof of identity through numerous techniques and is a way of guaranteeing
    that the entity presenting an identification is indeed the entity in question.


    ## 3.3. Different types of authentications


    Depending on the entity to be authenticated and its place in the network, there
    are two different types of authentications, local and remote.


    ### 3.3.1 Local service authentication


    To access local services, the most commonly used means of authentication is via
    a login and password. The login is unique for purposes of identification and the
    password is secret for purposes of authentication.


    A password must possess a certain number of characteristics:


    - – It must be of reasonable size, which depends on the importance of the entity
    to secure.

    - – It must include a certain amount of varied content (capital and lowercase
    letters and special characters).

    - – Simple passwords should be avoided.

    - – Passwords from the dictionary should be avoided.

    - – Overly complex passwords that are difficult to memorize without having to
    write them down somewhere physical or electronic should be avoided.

    - – Passwords should be modified periodically according to their importance and
    use.

    - – Passwords should not be used for more than one account (email, credit card,
    etc.).


    A realistic example of a good password is `teurn@dior2C)21` (a password from the
    phrase “ordinateur2021”, `ordinateur` being French for “computer”. The syllables
    “or”, “di”, “na”, “teur” are inverted, `@` is used in the place of `a` and the
    number `0` is replaced by the sequence `C)` , a complex password that is easy
    to remember without needing to transcribe it digitally or physically).


    In order to avoid any fraudulent connection based on trial and error, connection
    systems require a key to be entered (which appears in the form of an image) to
    ensure that the login and password provided were manually entered.


    Certain authentication systems can be vulnerable to `SQL injection` attacks. These
    allow the required password to be circumvented since it can be ignored if it contains
    a special character that is used for comments (`#` or `''` and others).


    ### 3.3.2 Network authentication


    In order to access a remote service, each user must be authenticated. The password
    required for authentication must never be sent as plain text on the network. Indeed,
    any information circulating through the network can be captured by an observer
    (sniffer), and is the biggest challenge to overcome.


    #### 3.3.2.1 Issues with remote authentication


    When accessing a remote service through a network, the most common form of authentication
    as well as the easiest is to send a login and password in plain text through the
    network, as presented in [Figure 3.1](#c03.xhtml#fig3-1). This technique provides
    both identification and authentication. This was the case for a wide array of
    webmail clients until the first years of the 21st century.


    ![Figure 3.1. Authentication by login and password in plain text](images/fig3-1.jpg)


    [Figure 3.1.](#c03.xhtml#ifig3-1) Authentication by login and password in plain
    text


    By using a network analyzer, it became easy to detect a password, which called
    security into question. Because of this, in order to authenticate securely over
    a network it became necessary to avoid using this technique and sending a password
    in plain text through the network.


    #### 3.3.2.2 Remote authentication by challenge message


    This consists of identifying someone first, and then authenticating that person
    by using the result of a hash function applied to a combination of the login,
    the password and a random challenge message sent via the server during authentication.
    It is accomplished in several phases.


    - – A client sends their login to the server to identify themselves.

    - – The server verifies the validity of the login.

    - – In the case of a valid identification, the server randomly generates a challenge
    message and sends it to the client.

    - – The client generates a chain of characters based on the following three elements:
    the login, the password and the challenge message. Then, applying an appropriate
    hash function to the chain generated in this way, it calculates a new chain that
    will be sent to the server.

    - – The server recreates the calculation using the same hash function applied
    to the same combination (login, associated password memorized by the server and
    the challenge message sent to the client). It then compares the result to the
    information that the client sent. If they are the same, the client will be authenticated.


    The use of a different challenge message from one connection to the next prevents
    the hash code from being reused in a fraudulent authentication later on.


    A hacker who watches the network can manage to detect the login, the challenge
    message and the hash code. These parameters are not enough to extract the password,
    however, even in the case where the formula combining the different elements (login,
    password, challenge message) and the hash function being used are known.


    ![Figure 3.2. Challenge message authentication](images/fig3-2.jpg)


    Figure 3.2. Challenge message authentication


    #### 3.3.2.3 Remote authentication by single-use password


    Called a “one-time password”, this technique is also based on the use of a hash
    function. It consists of changing the password of a connection to another one
    according to the following conditions:


    - – Passwords are generated using a root password that will be the last one used.

    - – A password that has already been used comes from the password that will follow.

    - – Passwords that have already been used cannot, under any circumstances, allow
    for any passwords that will be used ulteriorly to be determined.

