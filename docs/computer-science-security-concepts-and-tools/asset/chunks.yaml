- raw: "*   – The third technique, called “I am”, is the strongest form of authentication\
    \ insofar as it is dependent on a personal characteristic of the user being authenticated\
    \ (fingerprint, speech, etc.).\n\nIn certain scenarios, numerous techniques can\
    \ be combined for better security, which is the case with banking cards (“I have”\
    \ the card and “I know” the code).\n\nThe password must require a certain number\
    \ of criteria in order to prevent it from being disclosed, which would potentially\
    \ cause irreparable damage to the system or the entity requiring security. It\
    \ must also have a limited lifetime.\n\nIn order to ensure authentication in a\
