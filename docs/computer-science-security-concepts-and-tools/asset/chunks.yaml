    through the relay entities.

    * `Modification detection`: a mechanism used to detect modifications, whether
    accidental or intentional, of a unit of information.

    * `Dissembling`: when one entity pretends to be another.

    * `Notarization`: saving data with a secure third party, allowing the verification
    of its exactitude (content, origin, date, delivery) at a later date.

    * `Passive threat`: the threat of unauthorized sharing of information without
    the state of the system being modified.

    * `Password`: confidential authentication information, usually composed of a chain
    of characters.

    * `Homologous entity authentication`: confirmation that a homologous entity of
    an association is indeed the declared entity.

    * `Physical security`: the measures taken to ensure the protection of resources
    from deliberate or accidental threats.

    * `Privacy`: the right of individuals to control or act on information concerning
    them, which can be collected or stored, as well as their rights regarding the
    people through whom and to whom this information can be shared.


    Given that this term is tied to privacy law, it cannot be very precise, and its
