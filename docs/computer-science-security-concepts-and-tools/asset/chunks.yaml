- raw: 'Hackers never stop identifying or creating weaknesses in systems and networks,
    and here we will present a few examples.


    #### 1.3.3.1. *SQL injection*


    This allows the user to connect without the password in a case where authentication
    is done via the following SQL request:


    If the user introduces “`a OR 1=1 #`” as a login and anything as the password,
    the request becomes:


    A request which is still valid, the `#` returns what follows as a comment. The
    use of the apostrophe (‘) also breaks the authentication in the case of websites
    developed using Jomla.


    #### 1.3.3.2. *TCP SYN*


    A TCP connection is made in three steps (three-hand shake), as indicated in [Figure
    1.4](#c01.xhtml#fig1-4). The computer that initiates the communication sends a
    request asking for a SYN C connection; the computer receiving the request sends
    an ACK SYN C+1 acknowledgment, as well as the SEQ S number sequence, and starts
    a Time Out while waiting for the acknowledgment of this ACK SEQ S+1 number sequence.


    In the case where the computer that initiates the connection does not send the
    last message (ACK SEQ S+1) at the end of the Time Out, the other computer creates
    a large data file containing the context of the different connections. If the
    number of incomplete TCP connections goes up, the memory will be used up and the
    computer being attacked will go out of service. In this scenario, we speak of
    a TCP SYN attack.


    ![Figure 1.4. TCP SYN attack](images/fig1-4.jpg)


    [**Figure 1.4.**](#c01.xhtml#ifig1-4) *TCP SYN attack*


    #### 1.3.3.3. *Buffer overflow*


    This is a very efficient but incredibly complex attack. It consists of injecting
    a program by writing more information into a buffer than its size, in order to
    overwrite the code and insert sequences that are useful for taking control of
    the program being attacked.


    The buffer overflow error does not appear during the compilation nor systematically
    during the execution. It causes a crash in the case where the memory outside of
    the space reserved for buffering is being used by another variable. The memory
    used can even correspond to the entire operating system.


    #### 1.3.3.4. *Mail bombing*


    This kind of attack occurs if an email account is bombarded by different messages
    that can, in some scenarios, be sent automatically to email addresses appearing
    in a contact list.


    ### 1.3.4. *Some statistics*


    In this section, we will content ourselves with providing just a few key figures
    from the statistics obtained by the *CompTIA* (Computing Technology Industry)
    association^([2](#c01.xhtml#fn2)):


    *   – 52% of damage is caused by human error (the human factor is the biggest,
    which requires sensibility training).


    *   – 80% of attacks are done by employees and especially ex-employees, either
    by negligence or by irresponsibility (employee contracts should take responsibility
    clauses into account).


    The destruction from attacks can be divided as follows:


    *   – 44% of the damage takes the form of wasted time;


    *   – 16% of the damage occurs as ruined software;


    *   – 16% of the damage takes the form of lost information.


    As for intrusions, we can give the following examples:


    *   – MyDoom caused $38 million worth of losses in the USA in 2004;


    *   – SirCam caused $1.15 million worth of losses in the USA;


    *   – CodeRed caused $2.62 million worth of losses in the USA (250,000 infected
    computer systems in less than nine hours);


    *   – Himda caused $635 million worth of losses in the USA.


    ## 1.4. Security objectives


    Statistics have shown the importance of the human factor in the form of negligence
    or ignorance for the generation and reinforcement of security weaknesses; this
    is the same as in the case of car accidents. Because of this, a large part of
    the investment in questions of security is aimed at the user to teach and sensibilize
    them. Additionally, it is necessary to put technical security solutions in place.


    The objective of any security measure consists of mitigating the risks created
    by the security weaknesses, in order to minimize the attacks that exploit them,
    given that hackers always discover security weaknesses within networks, systems
    and applications.


    There is no longer a radical, blanket security solution; there is only *mitigation*.


    ### 1.4.1. *Establishing a culture*


    The human factor must always constitute the central axis of any investment. For
    security, it is clearly the most important element, given the weaknesses it can
    cause.


    Establishing a security culture consists of making users more sensitive and aware
    of their responsibilities through several mechanisms:


    *   – hold training sessions for all users of computing tools, without betting
    on their ignorance as a security measure;


    *   – formulate, require signatures and follow a contract regarding use of material
    resources and software, as well as data and documents;


    *   – establish a team in the company to manage security problems and sensibilize
    personnel using posters, clauses that should be signed, identity control measures,
    etc.


    ### 1.4.2. *Establishing technical solutions*


    This is the technical part of security. It consists of finding solutions and establishing
    the appropriate security equipment and software. Its purpose is to prevent:


    *   – the unauthorized spread of information;


    *   – the unauthorized modification of information;


    *   – the unauthorized use of resources.


    These security measures are generally the result of an investigation led by security
    experts within the company. It is the job of a security audit or a consultant,
    as required by law.


    ## 1.5. Security fields


    Computer security covers numerous complimentary fields that include the following
    aspects: energy, physics, organization, environment, etc.:


    *   – the evaluation of risks;


    *   – security rules;


    *   – organization of security information;


    *   – asset management (software and data);


    *   – human resources security;


    *   – physical and environmental security;


    *   – management of communications and operations;


    *   – acquisition, development and maintenance of information systems;


    *   – access checks;


    *   – managements of incidents concerning information security;


    *   – conformity.


    Security in the most general sense can concern numerous elements as varied as
    any, but we can distinguish three principal areas of security, namely, energetic,
    physical and software.


    ### 1.5.1. *Energy security*


    In the case of a complex computer system with real-time services, it is necessary
    to have servers on standby and automatic back-ups. Because of this, a simple electric
    outage can cause considerable damage. In this scenario, it would be necessary
    to launch groups of generators or inverters for the purpose of having an energy
    source that lasts and is independent of the sector that can be subject to periodic
    blackouts. We speak of energy security.


    ### 1.5.2. *Organizational and physical security*


    The computer system, as reduced as it may be, risks being physically affected
    by human and/or natural means; we can cite, as examples, fires, floods, theft,
    etc.


    Physical security consists of taking measures to control and physically isolate
    the system. It exists in two forms: high-level security concerns the organizational
    part and manages the different physical security strategies. Infrastructure security
    tries to physically secure computer equipment.


    #### 1.5.2.1. *High-level security*


    High-level security covers numerous security elements:


    *   – organization;


    *   – security structure;


    *   – personnel;


    *   – management of saves;


    *   – incident management.'
