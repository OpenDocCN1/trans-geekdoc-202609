    Cisco ACI 是一种基于规则提供自动化的 SDN 解决方案；规则的自动化扩展到所有工作站，包括虚拟机、物理服务器和容器。


    Cisco 采取了与 VMware 相相反的方法：它不是从设备中提取智能，而是通过这种方法让设备变得更加智能。


    Cisco ACI 允许网络管理员创建服务质量模型并将其应用于单个应用程序。如果某个应用程序在任何时候都需要优越的带宽优先级（例如语音系统），就可以创建一个模型来确保这种优先级。随后，该模型可以用于所有其他具有相同需求的应用程序。


    通过这种创建自动化模型的过程，Cisco ACI 创造了一个与传统软件定义网络具有相同优势、但策略完全不同的环境。


    ## 7.3. IoT/IoE 安全


    鉴于物联网/万物物联网（IoE）正在不断演进并代表了任何计算机系统的大部分，它们需要被安全保护，目标是防止任何未经授权的使用，并中和任何渗透和攻击服务、应用程序以及基础设施的尝试。


    所有这些特性在每个层面都带来了若干挑战，这使得通过各种技术（包括通用和特定技术）来实现安全变得至关重要。


    ### 7.3.1. 传感器网络


    在一个每个人都连接的世界里，连接对象的数量远大于人类——是其五到六倍。传感器网络由对象组成，一旦经过适当编程，它们就能够自动评估数据（即使是海量数据）并修改处理过程。智能城市就是一个很好的例子，它利用传感器的智能来自动化的处理一系列市政服务，涉及交通、停车、水务、电力和燃气消耗控制以及其他各种设施和基础设施。我们还可以提到配备了不同特定传感器、摄像头、GPS
    和计算机辅助服务的自动驾驶汽车。


    #### 7.3.1.1. 传感器网的特征和要求


    物联网（IoT）是数百万设备和智能传感器连接到互联网。传感器网络产生数据、实现自动化处理并需要被安全保护。


    物联网产生的数据量非常大。例如，一辆自动驾驶汽车每天可以产生 4,000 吉字节 (GB) 的数据，一个智能家居每周可以产生高达 1 GB 的数据。


    这些以大数据形式存储和管理的数据在管理、安全、冗余、分析和访问方面存在着问题。


    物联网开启了一个全新的世界，其中以前需要人工干预的任务现在可以实现自动化，特别是那些必须在危险条件下执行或重复性的任务。


    #### 7.3.1.2. 物联网/IoE 应用领域


    物联网/IoE 的使用涵盖许多应用领域，例如：


    * – 智能家居；

    * – 智能建筑；

    * – 智能工厂；

    * – 智能城市；

    * – 智能网络（道路、电力、供水、卫生、通信）；

    * – 智能汽车；

    * – 商店和服务管理；

    * – 医学和外科诊断；

    * – 空中海军控制的自动驾驶与监控。


    ### 7.3.2. 物联网的安全问题


    随着物联网/IoE 遍布全球，出现了新的且多样化的安全挑战，导致在此环境中发起特定的攻击。


    #### 7.3.2.1. 物联网的安全挑战


    由于以下原因，传感器网络在保护连接到物联网设备方面面临特定挑战：


    * – 设备数量的增加：互连传感器和智能设备的数量呈指数级增长，从而增加了攻击风险；

    * – 设备位置的多样化：连接到物联网的某些设备可以与物理世界交互；

    * – 更新的困难：带有传感器的物联网设备可能位于偏远和/或难以的地方，这使得干预或配置变得复杂；

    * – 无线通信系统的使用：这种技术便利了访问，从而增加了对传感器和物联网服务攻击的可能性。


    物联网网络的漏洞各不相同，从弱或不存在身份验证到集成的未安全服务器，再到安全性很低的应用程序，导致黑客可以相对容易地突破访问限制。


    用户可以下载运行在远程设备、系统或云端的 Web 客户端，以便访问和读取物联网服务和系统上的电子邮件，这使得它们容易受到与其他任何计算机相同的攻击。


    在长期使用许多物联网设备——带有旧的或过时的操作系统，或者未按照材料和软件安全规范创建的错误配置——使得它们变得脆弱并成为攻击目标，这构成了安全问题方面的一项重大挑战。


    #### 7.3.2.2. 物联网的安全攻击


    物联网攻击可以分类为以下各种类型：


    * – 外围层级攻击：硬件漏洞、受限设备的物理漏洞、微软件漏洞；

    * – 通信层攻击：IP、TCP、UDP 和 ICMP 漏洞；

    * – 应用层攻击：本地应用程序漏洞，以及 Web 和云应用程序的漏洞。


    受限设备通常被放置在遥远的地方，很难确保物理安全。


    潜在的硬件漏洞包括：


    * – 设备被盗；

    * – 设备的物理损坏；

    * – 设备停用和电源抑制；

    * – 通信中断、电缆断开或其他形式的干扰。


    微软件的漏洞包括：


    * – 未更新的默认登录。在连接物联网设备到互联网之前，修改用户名和密码以符合严格标准是很；

    * – 分布式拒绝服务攻击 (DDoS)

    * – 未用补丁修复的过时微软件；

    * – 缓冲区溢出攻击；

    * – 安装后门。


    常见的 TCP/IP 攻击有：


    * – DoS 攻击：攻击者试图防止用户访问信息或服务；

    * – DDoS 攻击：这类似于 DoS 攻击，但包含了来自许多源计算机的同时协调攻击；

    * – ICMP 攻击：攻击者使用 echo ICMP（互联网控制消息协议）数据包发现受保护网络上的子网络和主机，产生 DoS 溢出攻击并修改主机的路由表；

    * – 地址接管攻击：攻击者在数据包中放置源 IP 地址以伪装成不同的源，通过让目标认为数据包来自合法源来欺骗对方；

    * – 中间人攻击 (MITM)：攻击者将自己置于源地之间，以透明的方式观察、捕获并控制通信。他们可以通过仅检查捕获的数据包进行间谍，或者在将数据包传递给原始目的地之前对其进行修改；

    * – 会话劫持：攻击者只能访问物理网络，因此他们使用中间人攻击来获取有效令牌（token）以帮助他们访问 Web 服务器。


    ### 7.3.3. 区块链：一种物联网安全解决方案


