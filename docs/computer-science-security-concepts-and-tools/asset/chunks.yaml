    当协议类型为 `ICMP` 时，命令格式为：


    当协议类型为 `TCP` 时，命令格式为：


    当协议类型为 `UDP` 时，命令格式为：


    当协议类型为 `GRE`、`IGMP`、`IP`、`IPINIP` 或 `OSPF` 时，命令格式为：


    为了高级命名 ACL 的示例，我们将创建一个访问控制列表，应用于进入 `GigabitEthernet 0/0` 接口的流量，并仅允许来自网络 `192.168.10.0/24`
    的计算机访问 Web 流量：http（端口 80）和 https（端口 443）：


    ## 4.2.3.3. 二层 ACL


    二层 ACL 被分配 4000 到 4999 范围内的数字，其过滤规则基于连接层信息，包括源 MAC 地址、源 VLAN 标识 ID、二层协议类型和目的 MAC
    地址。


    华为二层 ACL 的配置语法为：


    ACL 也可以另一种方式定义，即为其赋予一个名称。在这种情况下，必须指定 ACL 的类型（在此情况下为链路），或赋予它一个 4000 到 3999 范围内的数字。


    ## 4.3. 防火墙


    防火墙是软件（用于路由器或终端设备：如 PC、服务器、工作站）或物理设备，它可以保护计算机、网络或子网的。。


    防火墙有三个主要功能：过滤、追踪以及在某些情况下是网络地址转换（NAT）。


    ### 4.3.1. 过滤功能


    该功能通过通过 MAC 地址、IP 地址、Web 地址（URL）、端口号、协议等过滤访问该实体的实体，从而隔离待保护的实体。


    可以应用许多规则：


    * – 拒绝某些实体并允许其他（默认允许访问）是“乐观”策略；

    * – 允许某些实体并拒绝其他（默认阻止访问）是“悲观”策略；

    * – 允许用户在过程中决定授权还是拒绝某个实体，是“交互式”策略。


    过滤策略以及过滤器必须由管理员选择并定期更新。防火墙的强度取决于其过滤配置的精确性和准确性。


    根据要过滤的实体，过滤有两种模式，即高层或低层过滤。


    我们还可以根据其工作方式将过滤器分为两种类型，即带状态或不带状态。


    #### 4.3.1.1. 低层过滤


    也称为数据包过滤，它允许根据数据包的主要特征进行过滤，有时甚至是帧帧：


    * – 源/目的 MAC 地址；

    * – 源/目的 IP 地址；

    * – 协议（IP、ICMP、UDP、TCP 等）；

    * – 源/目的端口等。


    #### 4.3.1.2. 高层过滤


    也称为应用过滤甚至内容过滤，它涉及应用和 Web 页面。这是一种基于高层参数的过滤器：


    * – 执行、网络访问、访问应用程序的注册表日志，称为应用过滤；

    * – URL 地址，称为 URL 过滤；

    * – Web 页面中存在的关键词列表，称为内容过滤。


    #### 4.3.1.3. 无状态过滤


    无状态过滤由仅基于被过滤实体相关信息的过滤器组成，与其状态或进度无关。尽管这种过滤是浅层次的，但它不会占用大量的 CPU 和内存资源。


    #### 4.3.1.4. 状态过滤


    状态过滤由在内存中维护不同会话的上下文组成。在这种情况下，可以动态修改过滤规则。这的一个很好的例子是：授权对从网络内部初始化连接的响应的数据包，并拒绝来自网络外部连接尝试的数据包，如图所示。


    ![images/fig4-1.jpg]


    **图 4.1.** 支持状态过滤的防火墙。此图的彩色版本请参阅 [www.iste.co.uk/zaidoun/computer.zip](http://www.iste.co.uk/zaidoun/computer.zip)


    ### 4.3.2. 追踪与 NAT 的功能


    为了识别攻击源，必须记录所有访问事件和访问尝试。这样产生的信息称为日志。管理员必须频繁检查日志以识别攻击源并分析通信状态。


    这种记录不同活动的每日日志对于管理员是必要的，他们可以手动分析或使用适当的工具检测任何未经的访问或访问尝试。


    NAT 是网络地址转换（Network Address Translation）的缩写。它是保护网络的路由器或防火墙功能。它在外部通信期间隐藏本地 IP 地址（私有地址），并将其替换为公网地址。


    ![images/fig4-2.jpg]


    **图 4.2.** 使用代理的数据移动


    地址转换有两种方式：静态和动态。静态地址转换（一对一）在私有地址和公网地址之间建立对应。动态地址转换（N 对 M，M<N）包括根据需要分配公网地址（来自地址池）。还使用端口池（PAT：端口地址转换）来识别来自外部的数据包，因为一个公网地址可以分配给多个计算机。


    NAT 是一种比代理更先进的技术。代理（如图 4.2 所示）是为用户转发应用程序（http）的中间设备。应用程序的使用仅对代理开放，工作站必须通过代理。


    ### 4.3.3. 防火墙架构


    防火墙的通用架构如图 4.3 所示。


    ![images/fig4-3.jpg]


    **图 4.3.** 防火墙架构


    该安全解决方案由三部分组成：


    * – 拦截器；

    * – 引擎；

    * – 配置界面。


    这允许对两种数据形式进行修改：


    * – 列表；

    * – 日志。


    #### 4.3.3.1. 拦截器


    这是一个低层系统组件，允许捕获数据包、帧或实体并对其应用决策。该组件负责检测和执行操作。它以系统进程的形式存在，必须具有必要的权限，以便能够在关键时刻采取行动并防止相关实体的任何突破行为。


    #### 4.3.3.2. 引擎


    这是一个高层组件，负责分析管理员设置的通用过滤器集，并根据特征决定对实体采取什么行动。


