    # 8 安全管理


    ## 8.1 引言


    计算机安全已成为公司、机构以及个人非常重要的课题。因此，世界上大多数国家已经颁布了法律文本来规范这一领域，并定义在保护计算机系统时应采取的解决方案和措施，这些系统是公司及个体的骨干和重要资产。


    安全审计是公司生存和存在的必要法律及经济要求，也是对其声誉和影响力的保障。这是一项由安全专家领导的定期任务，旨在识别安全漏洞和故障，并提供相应的解决方案和建议。因此，产生了一门新的学科，即安全顾问或审计师。


    审计分为三个必要的阶段。第一步涉及组织和物理方面，负责识别结构性和物理漏洞。然后，第二步致力于技术方面，包括发现各个层面的安全故障并为这些问题提供必要的解决方案。最后，必须通过渗透测试，该测试包括对我们自己的系统进行一系列攻击，以评估其健壮性。


    在家庭领域以及公司层面，有必要制定安全策略，目标是限制风险、缓解攻击并提高安全解决方案的效率。安全策略涵盖多个维度，干预多个层级，并要求不同的参与者对其进行适当应用。


    为了制定安全策略，首先必须测试现状并评估现有的安全水平。


    安全策略的制定和执行由一个安全经理领导的指导委员会管理。一旦策略制定，根据现有的规范和标准以及识别出的对接人员，其应用将需要定义指令和程序，以促进其实施和效率。


    ## 8.2 安全审计


    安全审计在许多国家是法律要求的，对于公司克服攻击和安全故障的挑战是必要的。


    ### 8.2.1 目标


    安全是一个非常特殊且专业的问题，在任何情况下都无法通过内部或公司人员解决。他们的专业知识可能有限，这可能阻止他们正确地识别和修复问题。审计必须首先警告用户，并在识别故障后，必须以建议的形式提供应对这些问题的解决方案和措施。


    ### 8.2.1.1 安全文化


    安全本质上是一种文化，公司人员必须具备这种文化的文化，以便在面对潜在攻击时保持警觉、安全并表现得当。


    审计必须关注安全，并通过识别坏习惯，让管理层、代理和客户意识到安全问题。这种文化可以通过组织形式、海报、章程以及限制物理和计算机访问的控制措施来呈现。


    ### 8.2.1.2 建立技术安全解决方案


    在识别出安全故障后，审计团队必须尝试为这些问题寻找解决方案。解决方案必须涵盖几个方面：


    *   局域网的拓扑结构和互连性；

    *   互联网连接；

    *   操作系统；

    *   正在使用的应用程序；

    *   当前的认证手段。


    ### 8.2.2 审计行动图


    审计期间的行动图总结如下所示。


    ![Figure 8.1. Action diagram in an audit](img/fig8-1.jpg)


    **图 8.1.** 审计行动图


    第一阶段致力于任务的记录和准备，对参与者、对接人员、情况、局限和义务进行精确清晰的定义。


    第二阶段是严格意义上的审计，即使用适当通用和特定工具（包括技术和其他工具）进行现场干预。


    最后，在第三阶段，审计团队专注于结果分析和报告的编写。


    公司不应局限于获得审计后将报告置在一边。实施所提出的建议非常重要，特别是当报告获得权威部门认可时。


    #### 计算和/或安全服务的结构


    大多数公司忽视计算和安全，因为它们被视为辅助工作的工具，其本身并不是生产单元。针对计算采取的措施是许多非专业用户的产物。因此，在每次咨询之后，有必要创建、重构、丰富并确保计算服务和/安全部门的独立性。


    #### 培训


    对于人员的发展，培训活动是必要的。审计必须提供公司内部安全知识的指标，培训投资应基于这一指标。


    #### 建立安全解决方案


    这是在安全咨询后实施的技术方面。它涵盖了几个领域：


    *   互联网连接；

    *   防病毒软件；

    *   防火墙；

    *   加密；

    *   认证。


    ### 8.2.3 组织和物理审计


    也称为高级审计，通过通过分析组织和物理漏洞来评估风险。


    #### 8.2.3.1 目标


