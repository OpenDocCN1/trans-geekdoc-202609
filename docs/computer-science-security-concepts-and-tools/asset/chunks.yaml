  trans: '


    这些服务适用于存储在本地、正在处理中或通过网络传输的系统实体和/或信息。


    确保公司内部计算机的安全必然包含提供上述提到的不同需求。取决于流量的性质和所处理信息的类型，某些服务比其他服务更为关重要。系统和网络管理员，更广泛地说，安全管理员，必须在满足不同的安全服务时定义优先级。优先级可能会根据情况而改变。


    对一项或多项安全服务的任何违反或威胁，都将会对相关系统或公司的安全带来威胁。


    ### 1.7.1. 身份验证（Authentication）


    身份识别（Identification）用于标记或从其他实体中区分出一个，而身份验证是身份的证明；它的作用是确保相关实体确实是刚刚声明身份的那个实体。


    说出“我是 X”的行为是一种识别；随后必须跟一种证明我们确实是“X”的手段，这就是身份验证。


    基础验证有许多类型，即：我所知的（I know）、我拥（I have）和我是（I am）。它们可以单独设置，也可以结合使用。


    #### 1.7.1.1 我知道（I know）


    这是最简单且最为人知的方法。它通过一组秘密字符组合来验证我们的身份；这就是与登录关联的密码。登录是唯一的，并作为识别。密码是秘密的并作为身份验证。


    密码必须满足一组规则以避免任何形式的共享或暴力破解，并能抵御入侵尝试。因此，密码必须满足以下规则：


    * – 非平凡的（如 abc, qwerty, 123 等）；

    * – 不至于复杂到难以记忆的；

    * – 绝不出现在任何物理位置（纸张、笔记本等）或数字位置（文件、电子邮件等）；

    * – 不源自字典；

    * – 不对应于个人特征（姓氏、名字、车牌号等）；

    * – 不重复使用两次（Facebook 账号、邮箱账号等）；

    * – 大写字母、小写字母、数字和特殊字符的组合；

    * – 定期修改以限制其使用时长。


    选择密码的良好做法是从字典中选择一个单词或来自另一种语言（如阿拉伯语）的单词，并使用拉丁字母将其公式化，甚至可以使用数字（例如 3a55alem），并确保使用明显的拼写错误（例如用
    conbuter 代替 computer）或倒置音节（例如用 terpucom 代替 computer）。


    #### 1.7.1.2 我拥有（I have）


    在这种场景下，身份验证通过拥有私有的物理对象来保证。芯片卡可以作为一种检查人员的手段。


    这种方法是最原始且最易于使用的；它存在某些盲点，这些与将相关对象交给他人的可能性有关。


    对于允许公司外部人员使用访客证进入私有区域的身份验证，情况如此。


    对于银行卡，我们有两个顺序的身份验证手段：我拥有（卡片）和我知道（密码）。


    #### 1.7.1.3 我是（I am）


    这是最强大的身份验证手段。它与人的某些个人特征相关，例如数字指纹（我们称之为生物识别验证）或眼睛或手的特征（形状、温度等）。


    这种方法可以用于控制场所或关键区域的访问。它对于计算机或系统的身份验证也有用。


    ### 1.7.2. 机密性（Confidentiality）


    这是确保所处理的信息不被任何未经授权的第三方实体泄露的行为。它是防止关键信息传播的保护措施，使用加密技术，使信息对其他非相关实体不可读且不可理解。


    ### 1.7.3. 完整性（Integrity）


    这是防止所处理信息被修改的保护。它是检测信息块是否发生修改（无论多么简单）的手段，使用哈希技术，该技术包括生成一个唯一且依赖于相关信息的代表性消息。


    ### 1.7.4. 非否认性（Non-repudiation）


    这是保证信息传输中的任何通信双方（发送者或接收者）都无法否认该交易的行为。


    ### 1.7.5. 可追溯性与访问控制（Traceability and access control）


    可追溯性意味着能够敏感计算机资源的访问（连接时间、操作列表等）。访问控制包括限制对不同的硬件和软件共享访问。


    ### 1.7.6. 服务可用性（Service availability）


    这是维护服务正常运行的行为，以满足所有场景下授权用户的请求。它是通过措施和技术检测并中和外部实体中断服务的尝试，从而保护服务器本身。


    ## 1.8. 安全机制（Security mechanisms）


    我们所的安全机制是指定义良好的措施或技术，允许提供一项或多项安全服务。


    计算机安全机制是提供安全服务的手段。ISO 7498-2 标准允许我们指定：


    * – 使用共享密钥的加密；

    * – 使用私钥/公钥的加密；

    * – 使用哈希函数的数据完整性；

    * – 身份验证；

    * – 访问控制；

    * – 数字签名；

    * – 公证。


    ### 1.8.1. 加密（Encryption）


    加密是一项使用了几个世纪的技术。它涉及对文本进行修改使其不可理解，除了生成它的人之外。处理这一主题的数学分支称为密码学。这种机制允许提供机密性服务。


    加密基于两种基本技术：替换（字母与数字之间的对应关系）和位移（也称为凯撒密码，它允许以循环的方式替换字母）。


    自出现以来，这种机制经历了几次演进：最初，第一代解决方案基于一种用于加密以及解密的算法。然后，新一代加密解决方案使用了对称密钥（在凯撒密码中为位移值）。该密钥用于加密和解密。最后，非对称加密被创建了。这涉及一对用于加密和解密的密钥，目的是为了避免共享问题，这是前两代加密的安全性弱点。


    我们可以引用以下加密算法作为示例：`DES`、`3DES`、`AES`、`RSA`、`Blowfish` 等。


    加密从未是绝对必要的解决方案，因为任何密文都可以通过分析来获取相应的明文。我们称之为密码分析，它是一种基于语言统计的技术。作为一个例子，我们可以想到图灵在二战期间的工作，由于图灵的密码分析机器，盟军发现了敌人总发送给部队的军事信息的明文。


    ### 1.8.2. 完整性检查（Integrity check）


    完整性检查是基于哈希算法的机制，允许提供完整性服务。


    哈希算法是一种非双射函数，生成一个唯一的、固定大小的链，即一个由变长度链生成的哈希值。后者可以是数据包、消息、网页或其他内容；它是证明自身完整性的东西。


    '
