    * – `data modeling language`: Yang;

    * – `markup language`: XML.


    ### 7.2.3 SDN 组件


    SDN 的组件分为三层，构成了其架构。


    最重要的组件是 `SDN controller`（SDN 控制器），它是控制层的一部分。其他组件进一步分为两层，即数据层中的节点和应用层（即管理层）的高组件。


    #### 7.2.3.1 网络节点


    这些组件仅提供数据传输功能，无论路由功能或 SDN 控制器提供的虚拟控制。


    数据包根据 `FIB`（转发信息基础）和邻接表中所包含的信息直接传输到数据层，而无需寻求控制层，控制层负责在延迟时间内更新 `FIB`。


    #### 7.2.3.2 SDN 控制器


    这是 SDN 控制层中的一种设备，作为可编程的自动化点，用于管理、配置和修复物理及虚拟网络基础架构。因此，集中式控制器管理数据流、增强安全性并提供其他服务，使得每个节点只需负责传输数据。


    `SDN controller` 集成了网络智能，是 SDN 的大脑。可以配置一个或多个控制器。如果仅使用一个控制器，我们称控制在物理上是集中的；而使用多个控制器时，控制在物理上是分布的，在这种情况下控制器可以协同工作（集中式软件）或相互独立运行（具有分布式软件）。也可以存在混合型
    SDN 控制器。


    `SDN controller` 可以通过不同的方式配置，例如使用 Web 模式、`CLI`（命令行界面）模式或如 `Python` 等高级编程语言。


    #### 7.2.3.3 高级组件


    这些组件对于执行控制 `SDN controller` 的脚本和程序是必要的，以便能够更新配置并部署新的安全和优化功能。


    ### 7.2.4 SDN 中的安全问题


    由于其独特的架构，SDN 面临着不同的安全挑战。它受到多种特定攻击的影响。


    #### 7.2.4.1 SDN 中的安全攻击


    SDN 可能会成为黑客的嗅探目标，黑客利用收集的信息发起访问攻击，如被称为“黑洞攻击”的 `DoS`，或使用恶意代码，被称为“虫洞攻击”。`Sybil attack`（女巫攻击）通过添加条目来影响网络流量而触发。


    其他攻击主要存在于物联网（IoT）平台上，例如由频率干扰引起的阻塞攻击和由过度耗引起的资源耗尽攻击。


    在另一种情况下，攻击者可以伪装成欺诈邻居，触发恶意的洪泛攻击（hello flood attack）。


    #### 7.2.4.2 SDN 中的安全挑战


    鉴于 SDN 识别出的安全问题与传统网络不同，其安全挑战也不同。


    首先，SDN 中的数据流大于传统网络。控制数据由 `SDN controllers` 发送以管理通信。如果这些数据通过网络以明文发送，可能会被黑客捕获。这一漏洞是一个巨大的威胁并构成了严重的挑战。


    其次，需要提供访问控制解决方案来过滤通过不同接口的数据流。


    第三，必须缓解 `DoS` 和 `DDoS` 攻击以确保 SDN 的可用性。


    第四，必须使用适当的安全规则和访问控制系统限制访问。


    最后，`SDN controllers` 需要安全措施来提供适应性、一致性和依赖性。后者的放置和同步构成了一个非常重要的挑战。


    ### 7.2.5 SDN 的安全解决方案


    由于这类网络是由软件定义的，安全解决方案通常以软件的形式存在，我们称之为软件定义安全（`SDSec`）。安全解决方案必须主要基于系统的大脑 `SDN controller`，必须通过防火墙和
    `IDS/IPS` 进行高强度防护，以缓解 `DoS` 和 `DDoS` 攻击带来的风险。访问控制系统、认证系统、加密和虚拟化系统与网络功能（特别是 `NFV`
    网络功能虚拟化）区别开。


    在 SDN 中，可以使用多种防御策略来应用安全解决方案并缓解攻击：


    * – 基于规则的防御策略以动态方式定义，并使用系统属性和网络统计；

    * – 自动学习防御策略检测攻击并生成安全规则；

    * – 移动目标防御策略通过比传统网络安全中的蜜罐技术或 `DMZ` 来定义，使攻击面对黑客不可识别；

    * – 协作/分布式防御策略共享网络威胁并协作制定防御策略。


    #### 7.2.5.1 SDN 安全需求


    在 SDN 环境中，SDN 的安全性必须无处不在。SDN 安全必须集成到架构中，并作为服务提供，以保护所有连接资源和信息的可用性、完整性和机密性。


    在架构内部，必须执行以下操作：


    * 保护控制器：如果 `SDN controller` 离线（例如由于 `DDoS` 攻击），网络也会消失，这意味着必须维护 `SDN controller`
    的可用性。

    * 调查和补救：发生事件时，确定发生了什么、修复它、报告它并为未来建立防护至关重要。

    * 建立信任：保护整个网络中的通信至关重要。这意味着 `SDN controller`、下载在上面的应用程序以及它管理的外围设备必须是受信任的实体，并应按预期方式工作。

    * 保护控制器的访问：鉴于它是决策的中心，对 `SDN controller` 的访问必须严格控制。


    SDN 安全解决方案将解决上述至少一个挑战。


    #### 7.2.5.2 区块链：一种 SDN 安全解决方案


    区块链是一个不断增长的区块记录列表，通过密码学进行连接和保护。区块链使用以下元素：


    * – 数字签名；

    * – 分布式账本；

    * – 用于达成共识的算法；

    * – 每个区块包含上一个区块的哈希值，形成链，即区块链。


    这种技术是加密的一种高效且可靠的解决方案，主要通过南向接口（Southbound interface）实现，该接口是 SDN 的主动脉，传输 `SDN controllers`
    生成的信息并应用于基础设施节点。通过这种方式，黑客无法捕获并以欺诈手段更改信息，或攻击源头（在此处为 `SDN controller`）。


    #### 7.2.5.3 基于应用的基础设施 (ACI)


    SDN 的安全必须从设计之初就集成，并为服务的自动化提供支持。


    由于 SDN 能够提供更易设置、管理和修复的可靠网络服务，其目标是将威胁检测和响应的时间尺度从几天或几周缩短到几分钟或几小时，同时最大化操作员工具的反应能力。


    思科 `ACI`（以应用为中心的基础设施）解决方案是一个框架，应用程序引导网络的行为^(1)。


    '
