- raw: 'These types of tests cover the different areas of security and their results
    make up an inventory of the computer system, which will be the starting point
    for defining and formulating a security policy.


    #### 8.3.1.2. *Security test tools*


    To provide an efficient evaluation, we should use different types of free software,
    the same ones used by hackers and attackers.


    The most commonly used tools are:


    *   – Nmap/Zenmap;


    *   – SuperScan;


    *   – SIEM;


    *   – GFI LANguard;


    *   – Tripwire;


    *   – Nessus;


    *   – L0phtCrack;


    *   – Metaspoilt.


    ###### Nmap/Zenmap


    Nmap, short for Network Mapper, is a free and open-source tool used for discovering
    networks and security audits^([2](#c08.xhtml#fn2)). Many system and network administrators
    also find it useful for tasks, such as network inventories, calendar management
    for service updates and monitoring the availability of the host or service. Nmap
    uses raw IP packets in an innovative way to determine which hosts are available
    on the network, which services (name and application version) these hosts offer,
    which operating systems (and versions of the operating systems) they use, what
    kind of packet filters or firewalls are being used and dozens of other characteristics.
    It was conceived to analyze large networks quickly, but works very well for unique
    hosts. Nmap works on all the principal computer operating systems, and official
    binary packages are available for Linux, Windows and Mac OS X. In addition to
    the traditional executable line command Nmap, the later version includes an advanced
    graphic interface and a Results Viewer (Zenmap), a flexible tool for data transfer,
    redirection and debugging (Ncat), a tool for comparing analysis results (Ndiff)
    and a tool for generating packets and response analysis (Nping).


    Nmap has the following characteristics:


    *   – *Flexible*: it takes charge of dozens of advanced techniques to map out
    networks filled with IP filters, firewalls, routers and other obstacles. This
    includes numerous mechanisms for analyzing ports (TCP and UDP), detecting operating
    systems, versions, ping sweeps and so on.


    *   – *Powerful*: Nmap has been used to analyze enormous networks with literally
    hundreds of thousands of computers.


    *   – *Portable*: most operating systems are supported, namely, Linux, Microsoft
    Windows, FreeBSD, OpenBSD, Solaris, IRIX, Mac OS X, HP-UX, NetBSD, Sun OS, Amiga
    and so on.


    *   – *Easy*: traditional versions of line command are available in addition to
    graphic versions (GUI) using binaries for those who do not wish to compile Nmap
    from sources.


    *   – *Free*: the principal objective of the Nmap project is to contribute to
    making the Internet a bit more secure and offer administrators, auditors and hackers
    an advanced tool for exploring networks. Nmap is available for free download,
    and is also delivered with a complete source code that can be modified and redistributed
    according to the license terms.


    Zenmap is the official graphic interface of the security scanner, Nmap. It is
    a free and open-source multi-platform application (Linux, Windows, Mac OS X, BSD,
    etc.) that makes Nmap easy to use for beginners, all while providing advanced
    functions for experienced Nmap users. Frequently used analyses can be recorded
    as profiles to facilitate repeated execution. The results of the saved analyses
    can be compared to each other to see how they differ.


    ###### GFI LANguard


    GFI LANguard is the award-winning network analysis and security software used
    by more than 20,000 clients^([3](#c08.xhtml#fn3)). GFI LANguard analyzes networks
    and ports to detect and repair vulnerabilities with minimal management.


    Any network administrator must individually manage vulnerability issues, patches
    and audits, sometimes using several products. With GFI LANguard, these three keystones
    of vulnerability can be managed with just one software program.


    GFI LANguard provides a complete image of an installation network and helps maintain
    the network secure, easily and efficiently.


    ###### Tripwire


    Tripwire is integrity control software that ensures that sensitive files on a
    computer are not modified without it creating an alert^([4](#c08.xhtml#fn4)).
    To do this, the software creates a database (or a reference table for simpler
    cases) containing the digital signature (hash) of files that the administrator
    wishes to keep an eye on. During the integrity control phase, Tripwire recalculates
    the digital signature of each file to be monitored and verifies that this signature
    corresponds to the one calculated at the time the database was created. If the
    two signatures do not correspond, Tripwire sends an alert.


    Monitored files can be classified according to different degrees of criticality.
    Tripwire can be rather complex to configure because files and configurations are
    encrypted. The alerts sent after the files are modified can be sent via email.


    ###### Nessus


    Nessus is a computer security tool^([5](#c08.xhtml#fn5)). It signals potential
    or clear weaknesses on tested computers. This includes, among others, services
    vulnerable to attacks that would allow control to be taken of the computer, sensitive
    information to be accessed, and service to be denied.


    Nessus works with Unix and Windows; its last version was 8.4.0, published on May
    14, 2019.


    It is widely used by users and computer system administrators. It is generally
    used by security managers and auditors.


    Nessus detects live computers on a network, sweeps open doors, identifies active
    services and their versions, and then attempts various attacks.


    Nessus is divided in two parts: nessusd, which is a daemon (service) executing
    requests and communication with the target, and nessus, which is a client application
    that recovers data and shows the result.


    This division is classic, with the daemon running with advanced privileges (root),
    while the graphic interface, more complex and thus vulnerable, runs under the
    identity of an unprivileged user. The tests are played out using plugins; some
    are compiled in C, but most are written in the script language NASL (Nessus Attack
    Scripting Language).


    Nessus is a network security scanner capable of detecting weaknesses that can
    be exploited locally; as well as remotely, by either:


    *   – identifying a version number in a banner, but this process is limited to
    one particular class of weaknesses: network service weaknesses that can only be
    exploited locally; or


    *   – acquiring the list of software or packets installed on the computer being
    tested and comparing it to the patches published by editors.


    ### 8.3.2. *Security policy development*


    A security policy that appears as a well-defined action plan composed of a group
    of measures guarantees a minimal level of security. This policy covers all aspects
    and calls on many interlocutors at various levels. It must foresee measures to
    take and people to alert in case an organizational failure or a technical intrusion
    is detected.


    The principal objective, namely maintaining a level of security, comes through
    the establishment of a culture and technical security solutions.


    The first sub-objective is ensured through training sessions, charters, posters,
    sports, alerts and so on.


    The second sub-objective covers policies, archives, monitoring, analysis, filtering,
    updates, alerts and so on.


    Once defined, a security policy must be formulated and written before being distributed
    and applied.


    #### 8.3.2.1. *Security policy interlocutors*


    For the development and establishment of a security policy, numerous actors can
    be called upon:


    *   – *Security manager*: this is an individual charged with developing and updating
    the security policy.


    *   – *Committee of collaborators*: this is a team of diverse specialists in the
    company that can help the security manager develop, apply, monitor and update
    the security policy.


    *   – *Users*: these are the personnel making use of and accessing computer services.'
