    # 8 Security Management


    ## 8.1 Introduction


    Computer security has become a very important subject for companies and institutions,
    as well as individuals. Because of this, numerous legal texts have been enacted
    in most of the world’s countries to structure this area and define solutions and
    measures to adopt when securing computer systems, which constitute the backbone
    and a valuable asset for companies, as well as individuals.


    A security audit is a necessary legal and economic legal requirement for the survival
    and existence of the company, as well as for its reputation and influence. It
    is a periodic task led by security experts to identify security vulnerabilities
    and faults, along with the appropriate solutions and recommendations. A new discipline
    has thus been developed, that of the security consultant or auditor.


    An audit goes through three necessary stages. The first step concerns the organizational
    and physical aspect. It identifies structural and physical vulnerabilities. Then,
    the second step is devoted to the technical aspect. It consists of uncovering
    security faults at various levels and providing the necessary solutions for such
    problems. Finally, the intrusive test must be passed, which consists of bombarding
    our own system with a series of attacks to evaluate how robust it is.


    In the domestic sphere, as well as at the company level, it is necessary to plan
    a security policy with the objective of limiting risks, attenuating attacks and
    increasing the efficiency of security solutions. A security policy covers several
    axes, intervenes at several levels and calls on different actors to apply it appropriately.


    In order to develop a security policy, it is necessary to first test the state
    of things and evaluate the existing level of security.


    The development and follow-through of a security policy is governed by a piloting
    committee led by a security manager. Once the policy is developed, depending on
    the existing norms and standards and the identified interlocutors, its application
    will require the definition of directives and procedures that will facilitate
    its implementation and efficiency.


    ## 8.2 Security audits


    A security audit, required by law in many countries, is necessary for a company
    to overcome the challenges of attacks and security failures.


    ### 8.2.1 Objectives


    Security presents a very specific and specialized problem that can under no circumstances
    be resolved internally or by company personnel. Their expertise may be limited,
    which could prevent them from properly identifying and fixing the problem. An
    audit must warn users first, and after the identification of faults, must then
    provide solutions and measures to face them, in the form of recommendations.


    ### 8.2.1.1 Creating a security culture


    Security is a culture above all, and the personnel of a company must have a minimum
    of this culture if they are to remain aware, secure and behave appropriately when
    faced with potential attacks.


    An audit must focus on security and make the management, agents and clients aware
    of the issue of security by identifying bad habits. This culture can be presented
    through organizations, posters, charters and control measures limiting physical
    and computer access.


    ### 8.2.1.2 Establishing technical security solutions


    After identifying security faults, the audit team must try to find solutions for
    such problems. The solutions must cover several aspects:


    *   topology and the interconnections of the local network;

    *   Internet connection;

    *   operating systems;

    *   applications in use;

    *   current means for authentication.


    ### 8.2.2 Audit action diagram


    The action diagram during an audit is summarized in the following figure.


    ![Figure 8.1. Action diagram in an audit](images/fig8-1.jpg)


    **Figure 8.1.** Action diagram in an audit


    The first phase is devoted to the documentation and preparation of the task, with
    a precise and clear definition of the actors, interlocutors, circumstances, limits
    and obligations.


    The second phase is the audit in the strictest sense, the on-site intervention
    using the appropriate generic and specific tools, both technical and otherwise.


    Finally, during the third phase, the audit team focuses on the analysis of the
    results and the writing of a report.


    Companies should not limit themselves to getting audits and then leaving the report
    to one side. It is important to apply the recommendations made, especially when
    the report is validated by authorized authorities.


    #### Structure of computing and/or security services


    Most companies neglect computing and security insofar as it serves as a tool facilitating
    the work and is not in of itself a productive unit. The measures taken for computing
    are the product of numerous users who are not specialists in the field. For this
    reason, following every consultation, it is necessary create, restructure, enrich
    and ensure the independence of computing services and/or the security unit.


    #### Training


    For personnel development, training activities are necessary. The audit must provide
    an indicator regarding security knowledge within a company, and the investment
    in training should be based on this indicator.


    #### Establishing security solutions


    This is the technical aspect to implement after a security consultation. It covers
    several areas:


    *   Internet connection;

    *   antivirus;

    *   firewall;

    *   encryption;

    *   authentication.


    ### 8.2.3 Organizational and physical audit


    Also called a high-level audit, this estimates risk by analyzing organizational
    and physical vulnerabilities.


