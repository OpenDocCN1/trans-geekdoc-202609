- raw: "In the case of only one LAN branch, we have a unique physical segment containing\
    \ all the internal equipment. We opt for software segmentation via VLANs (virtual\
    \ local area network). There are three VLAN technologies.\n\nThe VLAN technology\
    \ using a physical port attributes each port of a switch to a VLAN (identified\
    \ by its number). This is the simplest but most rigid option in the sense that\
    \ a computer risks changing the virtual segment by changing the connection port.\n\
    \nThe VLAN technology using a MAC address offers security by port and assigns\
    \ a fixed MAC address to each port. Otherwise, it learns and creates virtual segments\
    \ (DMZ, etc.), which allows it to emulate a physical distribution of segments.\n\
    \n[Table 4.3](#c04.xhtml#tab4-3) shows the general filtering policies applied\
    \ by the firewall between the three segments and the Internet, each one with respect\
    \ to the others.\n\n![Table 4.3. Traffic filtering in DMZ implementation with\
    \ one firewall](images/py2.jpg)\n\n[**Table 4.3.**](#c04.xhtml#itab4-3) *Traffic\
    \ filtering in DMZ implementation with one firewall*\n\n#### 4.4.1.2. *Topology\
    \ with two firewalls*\n\nThe segment for the DMZ is demarcated between two firewalls,\
    \ one external firewall that filters traffic between the Internet and the local\
    \ network, and one internal firewall that filters the traffic in the secured part\
    \ even more, which makes access to that part even more difficult (by passing via\
    \ two firewalls).\n\n ![Figure 4.6. Firewall implementation with two firewalls](images/fig4-6.jpg)\n\
    \n**Figure 4.6.** *Firewall implementation with two firewalls*\n\n## 4.5. Conclusion\n\
    \nControlling access physically as well as virtually is a necessary security measure\
    \ that reduces the risk of fraudulent access and allows all connections and connection\
    \ attempts to be monitored. This is provided, as a software component, by ACLs\
    \ and firewalls.\n\nACLs are a primitive method of controlling and limiting network\
    \ traffic. They provide a level of both physical and virtual security to the computing\
    \ system. This offers diverse static and dynamic filtering functions at many levels.\
    \ Although they are important and efficient, an evolution of this principle was\
    \ developed using dedicated equipment called a firewall.\n\nFirewalls are an indispensable\
    \ security solution for a company. The use of a physical firewall is necessary\
    \ to secure company-wide remote access, while the use of virtual firewalls remains\
    \ a necessary security measure to secure different servers and workstations, as\
    \ well as the physical and virtual assets of a company. However, a firewall can\
    \ never resolve the problem of security without being combined with other solutions,\
    \ such as antivirus software and IDS.\n\n# 5  \n\nTechniques and Tools for Detecting\
    \ Intrusions\n\n## 5.1. Introduction\n\nViruses are the most serious, widespread\
    \ and well-known kind of intrusion. A large number of malwares, especially viruses,\
    \ are produced every day. For this kind of problem, a protection tool is necessary,\
    \ hence antiviruses have been developed as a specific security solution.\n\nFirewalls\
    \ are a general security solution that limits the probability of attacks, whereas\
    \ antiviruses are a specific security solution whose objective is to protect computers\
    \ from the virus. However, these two solutions remain limited in guaranteeing\
    \ the security of a computer system. Therefore, the use of an intrusion detection\
    \ system is necessary to ensure security, as well as to overcome the insufficiencies\
    \ of both the firewall and the antivirus. It is a more complex solution that uses\
    \ diverse means to detect and disinfect intrusion tools.\n\n## 5.2. Antivirus\n\
    \nThis is software that detects, isolates and destroys viruses on hard drives,\
    \ external drives and memory.\n\n### 5.2.1. *Functions of an antivirus*\n\nAn\
    \ antivirus has three functions: detection, isolation and destruction\n\n*   –\
    \ *Detection*: an antivirus must be able to detect known viruses by analyzing\
    \ files and searching for their signatures. In some cases, it can detect unknown\
    \ viruses using heuristics and by their behavior.\n\n*   – *Isolation*: this involves\
    \ quarantining a virus or an infected program to prevent it from either reproducing\
    \ or damaging the computer system.\n\n*   – *Destruction*: files related to the\
    \ virus are deleted to limit its reproduction and propagation.\n\n### 5.2.2. *Methods\
    \ for detecting a virus*\n\nThe first generations of antiviruses were limited\
    \ to only known viruses by searching for the viral base, whereas new generations\
    \ have become increasingly intelligent in detecting viruses, even if their signatures\
    \ are not found in the viral base, by using techniques from industrial research.\n\
    \n#### 5.2.2.1. *Detection of known viruses*\n\nKnown viruses can be detected\
    \ using their signature, which is a chain of characters that represents the virus\
    \ (which is the result of a hash function). This emphasizes the need for regular\
    \ updates in order to include the signatures of new viruses for their detection.\n\
    \n#### 5.2.2.2. *Detection of unknown viruses*\n\nThe detection of unknown viruses\
    \ is a difficult and inefficient task, which is based on a collection of complementary\
    \ methods as follows:\n\n*   – *Behavioral analysis*: this involves detecting\
    \ viral behavior within programs, for example, the appearance of parasitic files\
    \ or the loss of data.\n\n*   – *Integrity control*: this involves saving the\
    \ signatures of different programs and applications in a computer and periodically\
    \ inspecting changes that can occur due to a virus attack.\n\n*   – *Multi-level\
    \ generic detection*: this is a rather complicated technique for detecting polymorphous\
    \ viruses whose signature changes in form.\n\n### 5.2.3. *Actions taken by an\
    \ antivirus*\n\nEven though the use of an antivirus does not require expertise,\
    \ it does require some basic tasks for it to work properly.\n\n*   – *Analysis*:\
    \ the user can, at any moment, explicitly request for an analysis of the disk,\
    \ an external drive or a file to specifically detect whether it contains a virus.\n\
    \n*   – *Updates*: the user must periodically download updates in order for new\
    \ viruses to be taken into account. A delay of one day can mean the absence of\
    \ protection from many viruses. When the antivirus is being installed, an update\
    \ must be performed because it will only account for the viruses known up to the\
    \ date it was put on the market. If it appeared one year ago, it will not provide\
    \ protection against several thousand viruses.\n\n### 5.2.4. *Antivirus components*\n\
    \nAn antivirus is made up of four parts: a scanner, a monitor, a viral base and\
    \ a log.\n\n*   – *Scanner*: it analyzes files on demand in a designated area\
    \ of a computer. It must be efficient, and given its complexity, it uses a large\
    \ amount of resources. This is an exhaustive analysis responding to an explicit\
    \ request by the user. The analysis encompasses files, saves, the register log\
    \ and, in some cases, the memory content, in order to detect and destroy memory-resident\
    \ viruses.\n\n*   – *Monitor*: it analyzes files briefly as they are accessed.\
    \ It must be quick and uses the minimum amount of resources in order to stop viruses\
    \ immediately without blocking the computer. It covers four principal activities:\
    \ email, the Web, downloading and the system.\n\n*   – *Viral base*: this is a\
    \ database composed of groups of signatures for different known viruses. Periodic\
    \ updates are needed to expand the database with new viruses that have just been\
    \ developed. The updates can be done either online with an Internet connection\
    \ or offline by executing the appropriate patch.\n\n*   – *Log*: this is composed\
    \ of different records used to save the history, activities and actions taken\
    \ by the antivirus.\n\n### 5.2.5. *Antivirus and firewall comparison*\n\nAn antivirus,\
    \ which is a specific solution, can be compared with a firewall, which is a general\
    \ solution, as presented in [Table 5.1](#c05.xhtml#tab5-1).\n\n ![Table 5.1. Comparison\
    \ between an antivirus and a firewall](images/tn1.jpg)\n\n[**Table 5.1.**](#c05.xhtml#itab5-1)\
    \ *Comparison between an antivirus and a firewall*"
