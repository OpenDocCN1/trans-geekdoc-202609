    ## 6.5. 结论


    加密是一种非常高效的技术，可以确保网络应用程序交换的本地信息或消息的机密性和/或认证性。如果没有低级加密，这种解决方案是不够的。这就是 IPSec 协议的目的，它是
    TCP/IP 的一个版本，在数据包层级提供机密性和/或认证性。


    IPSec 的出现无疑是缓解 TCP/IP 缺陷和漏洞的一种激进解决方案。鉴于实现方式的多样性和不兼容性，其使用仍然较为谨慎。


    IPSec 在数据包层级应用加密技术，创建一个安全的协议栈，该协议栈可以用于高层创建 VPN。


    VPN 使用简单的隧道原理，即通过加密进行安全封装。它基于大量的开放技术和私有技术。这种多样化的丰富性为建立 VPN 隧道提供了更广阔的选择。它提供了对公司数据的灵活访问，并将安全性扩展到供应商、客户、居家办公人员等。这种技术结合“云计算”等虚拟化技术，使得访问变得随处可见，同时确保了安全性。


    # 7. 安全、SDN 和物联网中的新挑战与趋势


    ## 7.1. 引言


    如今，传统的网络架构正在被遗弃，这损害了新技术，其中我们可以提到 SDN（软件定义网络）。这种新技术具有不同的特性和架构，与传统网络相比可能会导致不同的攻击。这种场景呈现了特定的挑战，需要适当的安全解决方案。


    SDN 架构的开发目的是使网络虚拟化。它通过将控制面板从每个外围设备移动到中央网络实体（称为 SDN 控制器）来进行控制和规则生成，实现了虚拟化。


    事实上，智能对象开始主所有领域，通过网络相互连接并日益向智能化和自动化演进。这种重大的演进在各级安全挑战方面都带来了局限性。这些特定的挑战需要适当的安全解决方案。由于连接的智能对象及其提供的自动化为黑客提供了关键的控制点和间谍点，这种网络是潜在的入侵目标。这些漏洞使得安全在物联网/IoT/IoE
    中尤为重要。


    ## 7.2. SDN 安全


    网络正逐渐向自动化和虚拟化迁移，这为 SDN 特有的安全新趋势开启了大门。


    ### 7.2.1. SDN 的总体描述


    SDN 技术是一种网络架构方法，允许将数据（有用流量）与控制（网络管理流量）分离。SDN 架构由三层组成，通过接口分离，通过接口发送控制和管理信息。


    与传统网络相比，SDN 具有特定的功能。它们提供了一种集中式架构，即网络流量由中央网络实体管理，该实体被称为 SDN 控制器。


    事实上，智能对象开始主所有领域（此处略）。


    SDN 控制器通过 `Southbound` 接口与基础设施层通信。此外，它通过 `Northbound` 接口与管理层及应用进行通信。


    SDN 可以使用 `Java`、`Python`、`C` 等高级编程语言进行脚本管理。


    两种功能即集中化和可编程性使得 SDN 成为一个使用虚拟化机制和工具管理的灵活网络。


    这些功能意味着 SDN 面临不同的攻击，产生不同的漏洞并提供不同的安全解决方案。安全挑战与传统网络不同。


    SDN 可以与云计算协作，用于存储规则和策略。在云安全中，SDN 控制器使用云服务来创建规则。


    ### 7.2.2. SDN 架构


    SDN 架构由三层层次结构组成，如图 7.1 所示。


    ![图 7.1. SDN 架构](img/fig7-1.jpg)


    [图 7.1.] SDN 架构


    定义 SDN 架构的层的功能和组件如下：


    * 基础设施或数据层：底层，由交换机/路由器、工作站和传感器等设备和网络节点组成。它被称为传输层或数据平面，该层连接外围设备的网络端口。设备的数据平面传输并转发流量。

    * 控制层：中间层，包含最重要的组件 SDN 控制器。它被称为控制平面，被认为是系统的大脑。控制平面是做出传输决策的地方。发送到控制平面的信息由网络节点处理。

    * 应用层：顶层，可选的。它包括控制应用程序的高级设备以及管理和管理脚本。

