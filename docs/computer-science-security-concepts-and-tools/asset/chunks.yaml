  trans: '


    组织安全的目的是试图对负责安全的结构和组织进行验证，包括备用技术单元、管理员和安全代理。它还允许对公司内部的安全投资进行验证，包括培训课程，以及通过章程、海报和管理规定建立必要的安全文化等步骤。其他点也属于安全的这一方面，例如备份规则以及公司内部发生事件的处置。


    ## 1.5.2.2. 基础设施安全


    基础设施安全涵盖了安全的众多要素：


    * – 电缆；

    * – 办公区域；

    * – 服务器位置；

    * – 存档存储；

    * – 技术办公室；

    * – 服务器机柜；

    * – 计算中心；

    * – 居家办公场所。


    这一部分涉及物理层面。它试图从物理上保护计算机设备和基础设施及其位置的安全。对于位置而言，安全策略取决于不同位置的重要性和内容。由于服务器对整个计算机系统很重要，它们受益于特定的安全策略。居家办公场所代表了一个弱点，需要不容忽视的特定安全措施。


    物理安全防止自然因素和人为因素的影响，可以通过以下方式确保：


    * – 烟雾探测器；

    * – 水浸探测器；

    * – 运动探测器；

    * – 监控摄像头；

    * – 考勤系统（卡片、指纹等）。


    ## 1.5.3. 软件安全


    软件安全涉及软件和系统资产，这些资产必须使用密码、访问限制、根据其重要性和机密程度对文档进行电子分类来保护。这是计算机安全的基础方面，其核心内容由 `OSI
    2 (ISO 7498-2)` 标准定义。


    安全涉及任何计算机系统（网络、工作站、服务器等），以及操作系统和应用程序。


    ### 1.5.3.1 网络安全


    网络是计算领域的关键要素，正如此如此它们是攻击者的潜在目标。这意味着需要安全投入，以便采取过滤、访问检查和基础设施保护等措施。


    不同的网络设备涉及安全，例如：


    * – 调制解调器；

    * – 交换机 (`VLAN`、端口安全）；

    * – 防火墙；

    * – 路由器 (`ACL`）；

    * – 访问点。


    网络安全允许将远程访问限制在不同的段和网络设备。


    ### 1.5.3.2 系统安全


    操作系统是计算系统软件部分的基础元素。然而，每个操作系统无论多新，都包含攻击者可以利用的漏洞。考虑到其广泛的使用，`Microsoft Windows` 系统是一个常见目标。


    安全的这一方面还涉及电话和传真标准，因为它们可能被用作破坏安全的未经授权路径。


    ### 1.5.3.3 应用安全


    不同的软件和应用程序并非免受批评，并导致了攻击者总能识别的众多弱点，尽管开发者定期提供补丁以添加必要的纠正措施。此外，发起的攻击是针对特定软件的。因此，不同的软件需要特定的安全预防措施和防范。代表潜在目标的软件类包括：


    * – Web 服务；

    * – 电子邮件服务；

    * – 数据服务。


    ### 1.5.3.4 数据安全


    尽管软件具有极性意义，但数据的丢失或更改会对计算机系统产生破坏性影响。因此，必须预见必要的安全措施（通常是一系列多样且互补的机制），以保护数据免受未经授权的泄露或修改。


    统计表明，攻击造成的大部分损害由于数据丢失。数据安全包括许多措施：


    * – 完整性控制；

    * – 加密；

    * – 数据服务器冗余；

    * – 数据库安全；

    * – 数据可用性。


    ## 1.6. 安全规范化


    安全已成为一项重要挑战，为了避免任何混乱或分歧，规范化是解决方案；这需要定义必要的术语，以及不同的需求和解决方案。


    ### 1.6.1 基础问题和总体介绍


    为了解决分歧问题并为安全提供坚实且结构良好的基础，最近创建了一个标准。它是 `ISO 7498-2:1989` 标准，是安全架构的 `OSI` 模型的第二部分。该国际标准由
    `ISO/TC 97` 技术委员会创建。


    国际电信联盟 (`ITU`) 创建了 `X.800` 标准，为开放系统提供了一套安全架构标准。


    ### 1.6.2 ISO 7498-2 标准


    为了解决开放系统之间的安全通信，`ISO 7498-2` 的第二部分于 1989 年发布。它：


    * – 对参考模型可以提供的安全服务和相关机制进行了通用描述；

    * – 定义了服务和机制可以在 `OSI` 架构的何处提供。


    为基础参考模型的每一层都识别了基本的安全服务和机制及其适当的位置。此外，还识别了基础参考模型中安全服务与机制之间的架构关系。在终端、设施和组织中可能需要补充安全措施。这些措施适用于不同的背景。确定需要哪些安全服务来负责这些补充安全措施超出了该国际标准的适用范围。


    `OSI` 安全功能仅涉及通信路由的可见方面，允许终端之间相互完成安全信息传输。`OSI` 安全不涉及终端系统、设施和组织内部的必要安全措施，除非这些措施对
    `OSI` 中可见的安全系统的选择和置置产生影响。这些安全方面可以规范化，但无法在 `OSI` 标准框架内进行。


