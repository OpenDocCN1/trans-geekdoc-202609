    * `Capacity`: a token used as an identifier for a resource, such that the possession
    of the token gives access rights to this resource.

    * `Path`: a pathway used to transfer information.

    * `Cryptogram (ciphered text)`: data obtained through the use of encryption. The
    semantic content of resulting data is incomprehensible.


    A cryptogram can be reinserted into a new encryption to produce a `superencryption`.

    * `Plain text`: intelligible data whose semantics are understandable.

    * `Confidentiality`: a property of information that is neither available nor shared
    with unauthorized people, users or processes.

    * `Identity document`: transferred data used to establish the declared identity
    of a user.

    * `Cryptographic analysis`: the analysis of a cryptographic system and/or its
    comings and goings, in order to deduce the confidential variables and/or sensitive
    information (including the `plain text`).

    * `Value of the cryptographic check`: the information obtained via a cryptographic
    transformation (see `cryptography`) on a unit of data.


    The control value can be obtained in one or more steps and comes from a mathematical
    function that uses the key and a unit of data. It allows us to verify the integrity
    of the unit of data.

    * `Cryptography`: the discipline, including the principles, means and methods
    for transforming information, with the objective of hiding its content, preventing
    its modification from remaining undetected and/or preventing its unauthorized
    use.


    Cryptography determines encryption and decryption methods. An attack aimed at
    the principles, means and methods of cryptography is called a cryptographic analysis.

    * `Data integrity`: a property guaranteeing that data has not been modified or
    destroyed in an unauthorized fashion.

    * `Data source authentication`: confirmation that the source of received data
    is indeed the one that has been declared.

    * `Decryption`: the inverse operation of a reversible encryption.

    * `Denial of service`: the inability to access resources for authorized users
    or the introduction of a delay for the processing of critical operations.

    * `Electronic signature`: data added to a unit of information, or the cryptographic
    transformation of a unit of data, allowing the recipient to prove the source and
    integrity of the unit of data, protecting against counterfeits (by the recipient,
    for example).

    * `Encryption`: the cryptographic transformation (see `cryptography`) of data,
    producing a `cryptogram`.


    Encryption can be irreversible. In this case, the corresponding decryption cannot
    be completed; this is the case for a hash function.

    * `End-to-end encryption`: `encryption` of data within, or at the level of the
    endpoint source; the corresponding `decryption` can only be made within, or at
    the level of the destination endpoint.

    * `Identity-based security policy`: security rules based on the identities and/or
    the attributes of users, a group of users or entities acting in the name of users;
    these can also be based on the identities/and or attributes of resources/objects
    to which they seek access.

