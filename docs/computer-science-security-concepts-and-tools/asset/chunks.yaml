    ## 4.3. Firewall


    A firewall is software (for a router or terminal equipment: PC, server, workstation)
    or physical equipment that allows a computer, network or sub-network to be secured.


    A firewall has three principal functions: filtering, tracing and in some cases,
    network address translation (NAT).


    ### 4.3.1. *Filtering function*


    This function isolates the entity that is to be secured by filtering the entities
    that access it through the MAC address, IP address, Web address (URL), port number,
    protocol, etc.


    Numerous rules can be applied:


    *   – denying some and authorizing the rest (allowing access by default) is an
    “optimistic” policy;


    *   – authorizing some and denying the rest (preventing access by default) is
    a “pessimistic” policy;


    *   – allowing the user to decide along the way whether to authorize or deny an
    entity is an interactive policy.


    The filtering policy as well as the filters must be chosen by the administrator
    and updated periodically. The strength of a firewall depends on the precision
    and exactitude of its filtering configuration.


    Depending on the entity to filter, there are two modes for filtering, either at
    a high or low level.


    We can also distinguish two types of filters by the way they function, either
    with or without states.


    #### 4.3.1.1. *Low-level filtering*


    Also called packet filtering, this allows packets to be filtered and sometimes
    even frames depending on their principal characteristics:


    *   – source/destination MAC address;


    *   – source/destination IP address;


    *   – protocol (IP, ICMP, UDP, TCP, etc.);


    *   – source/destination port, etc.


    #### 4.3.1.2. *High-level filtering*


    Also called application filtering or even content filtering, this concerns applications
    and Web pages. It is a kind of filter based on high-level parameters:


    *   – execution, network access, access to the register log for applications,
    called application filtering;


    *   – URL addresses, called URL filtering;


    *   – list of key words present in the Web page, called content filtering.


    #### 4.3.1.3. *Stateless filtering*


    Stateless filtering consists of filters based only on information concerning the
    entity to be filtered, independently of its state or progress. Even though it
    is superficial, this filtering does not take up many resources from the CPU and
    memory.


    #### 4.3.1.4. *Stateful filtering*


    Stateful filtering consists of maintaining the context of different sessions in
    the memory. It is possible in this case to dynamically modify the filtering rules.
    A good illustration of this is the authorization of packets that are responses
    to connections initialized from within the network and for packets coming from
    a connection attempt from outside the network to be refused, as illustrated in
    the following figure.


    ![Figure 4.1. Firewall supporting stateful filtering. For a color version of this
    figure, see www.iste.co.uk/zaidoun/computer.zip](images/fig4-1.jpg)


    **Figure 4.1.** *Firewall supporting stateful filtering. For a color version of
    this figure, see [www.iste.co.uk/zaidoun/computer.zip](http://www.iste.co.uk/zaidoun/computer.zip)*


    ### 4.3.2. *Functionalities of tracing and NAT*


    In order to identify a source of attack, it is necessary to record all access
    events and attempts at access. The information that is generated in this way is
    called the log. The administrator must frequently check the log to identify sources
    of attack and analyze the state of communication.


    This daily log of different activities is necessary for the administrator, who
    can analyze them manually or by using appropriate tools to detect any unauthorized
    access or access attempts.


    NAT is the acronym for network address translation. It is a router or firewall
    function that secures a network. It hides local IP addresses (private addresses)
    during external communication (on the Internet) and replaces them with public
    addresses. The purpose is to protect certain computers that are inaccessible directly
    from the exterior, save routable IP addresses and facilitate network maintenance.


    ![Figure 4.2. Movement of data with a proxy](images/fig4-2.jpg)


    [**Figure 4.2.**](#c04.xhtml#ifig4-2) *Movement of data with a proxy*


    There are two ways of translating addresses, static and dynamic. The static translation
    of addresses (one-to-one) creates a correspondence between a private address and
    a public address. The dynamic translation of addresses (N-to-M with M<N) consists
    in attributing public addresses (from an address pool) as needed. Port pools are
    also used (PAT: port address translation) to identify the relevant internal address
    when a packet comes from the exterior, since an external address could be allocated
    to numerous computers.


    NAT is a more evolved technique than using a proxy. A proxy, as shown in [Figure
    4.2](#c04.xhtml#fig4-2), is an intermediary that relays an application (http)
    to its users. The use of the application is only open to the proxy and workstations
    must go through the proxy.


    ### 4.3.3. *Firewall architecture*


    The general architecture of a firewall is depicted in [Figure 4.3](#c04.xhtml#fig4-3).


    ![Figure 4.3. Firewall architecture](images/fig4-3.jpg)


    [**Figure 4.3.**](#c04.xhtml#ifig4-3) *Firewall architecture*


    This security solution is composed of three parts:


    *   – interception pilot;


    *   – engine;


    *   – configuration interface.


    This allows two data forms to be altered:


    *   – filter list;


    *   – daily logs.


    #### 4.3.3.1. *Interception pilot*


    This is a lower-level system component that allows packets, frames or entities
    to be captured and for decisions to be applied to them. This component is responsible
    for the detection and application of an action. It takes the form of a system
    process that must have the necessary privileges, which allows it to act at the
    key moment and avoid any actions of the entity in question to get through.


    #### 4.3.3.2. *Engine*


    This is a higher-level component that analyzes the set of filters (generic) set
    up by the administrator and decides what action should be applied to an entity
    depending on its characteristics.'
