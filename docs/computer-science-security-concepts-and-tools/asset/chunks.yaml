    - **数据包日志模式 (Packet log mode)**：此模式记录 IDS 网络上循环的数据包。它通过对感兴趣的操作进行记录，本质上提供了一个地址簿，允许将日志限制在某些标准上。

    - **入侵检测模式 (Intrusion detection mode)**：IDS 模式允许 Snort 在拦截包检测到连续字符帧时，根据配置文件定义的规则采取特定操作。


    Snort 提供的警报有多种。例如，我们可以要求 Snort 重定向所有关于标准出站流量的报警，以便观察攻击的演变。


    Snort 能够采取某些行为以拒绝对特定 IP 地址的访问，例如当该 IP 地址尝试进入网络时。在这种情况下，IDS 可以与防火墙交互以更新其访问规则，并防止与潜在黑客的接触。


    ### 5.3.4.2. Cisco IOS IPS


    设置此类 IPS 需要以下步骤：


    - 在 Cisco 网站上找到合适的 IPS。下载 `IOS IPS` 文件。

    - 在 `Flash` 中创建 `IOS IPS` 配置目录。

    - 配置 `IOS IPS` 加密密钥。

    - 激活 `IOS IPS`。

    - 将 `IOS IPS` 签名包加载到路由器上。从适当的 `FTP server` 下载并拷贝签名包。


    ## 5.4. 结论


    杀毒软件虽然是一种特定的解决方案，但是保护计算机系统必不可少的工具。目前，现代安全解决方案允许许多安全工具整合在一个应用程序中，例如防病毒、反垃圾邮件、反间谍软件、反恶意软件以及防火墙功能（即过滤和跟踪）。


    IDS 无论多么复杂，都是确保计算机或网络系统安全的必要解决方案。与其他工具结合，它们可以减少攻击的影响。


    用户通常会将 IDS 与杀毒软件混淆而忽视它们，尽管两者实际上提供了互补的服务。IDS 更加先进且更加复杂，在关键系统中使用它们是不可避免的，尽管对于家庭用途它们仍然是可选的。


