    ![图 6.9. AH-ESP 传输模式封装](img/fig6-9.jpg)


    **图 6.9.** *传输模式下的 AH-ESP 封装*


    ### 6.3.5.4. 隧道模式下的 AH


    隧道模式下的 AH 包括对整个 IP 数据包（报头和数据）进行认证。此任务需要添加一个 `AH` 头部和一个新的 `IP` 头部，以形成具有不同特征的新数据包。


    ![图 6.10. AH 隧道模式封装](img/fig6-10.jpg)


    **图 6.10.** *隧道模式下的 AH 封装*


    ### 6.3.5.5. 隧道模式下的 ESP


    隧道模式下的 ESP 包括对整个 IP 数据包（报头和数据）进行加密。此任务需要添加一个 `ESP` 头部和一个新的 `IP` 头部，以创建一个具有不同特征的新数据包。


    生成的的数据包数据由添加的 `ESP` 头部和整个原始数据包组成并经过认证。


    加密和认证还涉及底部的部分。


    ![图 6.11. ESP 隧道模式封装](img/fig6-11.jpg)


    **图 6.11.** *隧道模式下的 ESP 封装*


    ### 6.3.5.6. 隧道模式下的 AH-ESP


    隧道模式下的 AH-ESP 包括首先使用 `ESP` 协议对整个 IP 数据包（报头和数据）进行加密，然后应用 `AH` 协议在最后生成一个新的 `IP`
    数据包。


    ![图 6.12. AH-ESP 隧道模式封装](img/fig6-12.jpg)


    **图 6.12.** *隧道模式下的 AH-ESP 封装*


    ### 6.3.6. IKE 协议


    IKE 是 Internet Key Exchange（互联网密钥交换）的缩写，是一种用于交换密钥和协商安全参数的协议。它在双方之间（在这种情况下是隧道的端点）建立安全关联（SAs）。


    `SA` 是一组单向安全参数，包含了认证、加密和完整性控制的算法。


    `SAs` 可以手动更改或通过 `ISAKMP` 协议进行更改。`ISAKMP`（互联网安全关联和密钥管理协议）用于 `SAs` 及其相关参数的协商、建立、修改和删除。它定义了通过
    `SA` 对创建和管理认证的数据包程序和格式，以及生成密钥的技术。


    IKE 包含两个阶段：


    - 阶段 1：在验证身份之前，使用 `DH`（Diffie–Hellman）协议建立用于创建隧道和交换密钥的 `ISAKMP` 规则；

    - 阶段 2：建立通过隧道以安全方式传输流量的 `IPSec` 规则。


    ## 6.4. VPN


    VPN 是 Virtual Private Network（虚拟专用网络）的缩写。这是指利用公共资源以安全的方式工作，使用加密技术就像使用私有网络一样。


    ### 6.4.1. 问题与依据


    如果有人想连接位于不同地理位置的同一家公司（银行、保险等）的站点，有两种解决方案：公共选项或私有选项。


    第一种方案是使用 Internet 进行通信。这是一种廉价的方案，但由于网络与许多其他参与者共享，因此也是不安全的。


    第二种方案是使用专用连接。这是一种完全私有的、因此是安全的设施，但它非常昂贵。


    面对这种选择，VPN 在安全性和成本方面似乎是最佳的连接解决方案。


    ### 6.4.2. VPN 原理


    VPN 的建立包括使用使用隧道通过 Internet 进行通信，而不是使用专用连接。


    隧道为数据提供了安全保障，同时也提供了用户身份。我们谈论的是 `IP` 封装中的 `IP`。生成的新的 `IP` 数据包以通过隧道在 Internet 上通信的本地网络路由器的
    `WAN` 地址作为源地址。


    VPN 基于一种被称为隧道协议的协议，即允许数据从 VPN 的一端传输到另一端并受到加密算法保护的协议。


    “隧道”一词被用来象征这样一个事实：在 VPN 的入口和出口之间，数据是加密的，因此对于位于 VPN 两个端点之间的任何人来说通常是不可理解的，就像数据通过隧道通过一样。此外，创建隧道还意味着在相同的
    OSI 模型层级将一个协议封装在另一个协议中（例如 `IP` 在 `IPSec` 中）。在两台计算机之间建立 VPN 的情况下，我们将加密进入数据的元素称为
    `VPN client`，将出口解密数据的元素称为 `VPN server`（或更通用的，远程服务器）。


    当私有网络外的系统（游民客户端、机构或在家工作的人）希望连接到公司网络时，情况如下：


    - 数据包（包含数据）由 `VPN client` 加密（使用两个双方在建立 VPN 隧道时选择的算法）并最终进行签名；

    - 它们通过传输网络（通常是 Internet）传输；

    - 它们被 `VPN server` 接收，服务器对其进行解密、处理并检查所需的验证是否正确。


    ### 6.4.3. 不同类型的 VPN


    根据使用 VPN 的端点，分为两种：站点到 VPN（site-to-site VPN）和远程访问 VPN（remote access VPN）。


    #### 6.4.3.1. 站点到 VPN


    这种设置通过在路由器之间配置 VPN 来连接两个地理位置不同站点的网络，路由器在两个站点都具有连接 Internet 的接口。


    这种技术的良好应用是连接任何公司的两个或多个机构，无论是它们之间，还是连接到中心站点。这种类型的 VPN 隧道也可以用于连接供应商与客户。


    这种 VPN 可以是既安全又廉价的理想解决方案，以确保公司与其他站点位置的完全互连性。


    #### 6.4.3.2. 远程访问 VPN


    这是一种通过 Internet 从游民用户或家庭工作站到地理远端网络的安全连接。这种技术为方便远程工作提供了替代方案，或者允许孤立的用户连接到公司，而不会损害安全性，并免受黑客或网络海盗的攻击。


    这种 VPN 允许公司连接其远程合作者，这些合作者反将以更低的成本和完全的安全与公司共享服务。


    ### 6.4.4. 不同的隧道协议


    VPN 隧道可以基于许多协议：


    - `PPTP (点对点隧道协议)`：由 Microsoft、3Com、Acend、US Robotics 和 ECI Telematics 开发的二层级协议；

    - `L2F (链路层转转发)`：由 Cisco Systems、Nortel 和 Shiva 开发的二层级协议；

    - `L2TP (链路层隧道协议)`：是 IETF（RFC 3931）工作的成果，结合了 `PPTP` 和 `L2F` 的功能。这是一个依赖于 `PPP`
    的二层级协议；

    - `IPSec (IP 安全)`：基于 IETF 工作，为 `IP` 网络传输加密数据；

    - `SSL/TLS (安全套接层/传输层安全)`：它提供了一种非常好的隧道解决方案。该方案的优势是使用 Web 浏览器作为 `VPN client`；

    - `SSH (安全外)`：最初被认为是 telnet 的安全替代品，它提供了隧道 TCP 连接的可能性，从而为受保护网络上的服务提供安全访问，无需创建虚拟专用网络。


    ### 6.4.5. 站点到 VPN IPSec 配置


    让我们示例在 `CLI` 模式（命令行界面）下配置一个站点到 VPN IPSec VPN，以适用于 图 6.13 所示的网络配置。


