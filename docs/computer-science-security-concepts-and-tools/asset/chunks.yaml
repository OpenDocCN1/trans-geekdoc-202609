    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ |\n\n| **Q** || **A** || **W** || **X** || **S** || **Z** || **E** || **D**\
    \ || **C** || **V** || **F** || **R** || **T** || **G** || **B** || **N** || **H**\
    \ || **Y** || **U** || **J** || **K** || **I** || **O** || **L** || **M** || **P**\
    \ |\n\n“COMPUTERSECURITY” ![images](images/py1.jpg)“WBTNKJSYUSWKYCJM”\n\n####\
    \ 6.2.1.2. *Shifts*\n\nThis involves associating each character with a corresponding\
    \ character according to an interval of a chosen number, which is called the step.\
    \ We call this Caesar’s cipher, an ancient encryption technique using mono-alphabetic\
    \ substitution. The step is a sort of key, since the knowledge of this number\
    \ allows the cryptogram to be entirely determined during encryption, and inversely,\
    \ the corresponding plain text during decryption.\n\nEXAMPLE.– Interval of 2\n\
    \n“COMPUTERSECURITY” → “EQORWVGTUGEWTKVA”\n\nIn addition to these two basic techniques,\
    \ other multi-alphabetic substitution techniques make encryption stronger. The\
    \ plain text can undergo different transformations in advance or throughout the\
    \ encryption process.\n\n### 6.2.2. *Cryptoanalysis*\n\nEncryption, however strong\
    \ it may be, is not above all criticism insofar as it can be compromised and the\
    \ hacker can obtain the plain text using an encrypted text, without knowing anything\
    \ about the encryption technique used. Turing’s efforts during World War II are\
