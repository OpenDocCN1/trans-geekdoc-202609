  trans: '

    防火墙的配置表现为一组不同的过滤器列表，这些过滤器既复杂又互补，这意味着相应的操作既不直观也不易于识别。这种特性需要进行更深层次的分析，以解决对定义良好的实体进行过滤的任务。这是引擎的核心功能。


    ### 4.3.3.3. 配置接口

    这允许管理员选择合适的过滤器。接口有两种类型：通过管理控制台（`CLI`：命令行界面）显示文本形式，或通过用户友图形界面（`GUI`：图形用户界面）显示图形形式。第一个选项需要具有专业知识的管理员。


    ### 4.3.3.4. 过滤器数据库

    这是一个包含防火墙配置的数据库。过滤器是通用的定义，引擎负责定义从最具体到最通用的优先级顺序。所应用的操作取决于相关实体、情况以及防火墙内部使用的通用策略。


    ### 4.3.3.5. 日志

    这些是防火墙保存的访问记录、访问尝试记录以及任何与防火墙相关的其他事件的记录。这些记录按系统日期和时间进行归档，以便管理员可以使用它们来识别特定的问题。


    ### 4.3.4. 防火墙工作原理

    拦截飞行员捕获实体（数据包、应用程序等）并将其特征（源、目的地等）发送给引擎，引擎通过寻找适用于该实体的过滤器来确定操作（授权、拒绝等）。可用的过滤器组由管理员在配置期间选择。


    ![图 4.4. 防火墙过滤](img/fig4-4.jpg)


    **图 4.4.** 防火墙过滤


    ### 4.3.5. 防火墙分类

    防火墙有两种可能的分类类型。第一种分类是根据相对于 `TCP/IP` 栈的过滤级别，第二种是根据动作作用范围，即防火墙需要保护的部分。


    #### 4.3.5.1. 按动作级别过滤

    这种分类回答了问题：过滤发生在哪个级别？


    第一种情况我们称为数据包过滤或低级过滤，另一种情况则我们称为应用过滤或高级级过滤。


    ##### 数据包防火墙

    在此类防火墙中，要过滤的实体是数据包，有时是帧。它在 OSI 模型的第 2、3 和 4 层运行。


    针对以下内容进行过滤：

    * – 物理源和目的地址（`@MAC`）；

    * – 逻辑源和目的地址（`@IP`）；

    * – 使用的协议（`IP`、`ICMP`、`TCP`、`UDP`、`SLIP`、`PPP` 等）；

    * – 源和目的端口等。


    ##### 应用防火墙

    在此类防火墙中，要过滤的实体是应用程序。它在 OSI 模型的第 7 层运行。


    针对以下内容进行过滤：

    * – Web 流量（`URL`、关键词、cookie 等）；

    * – 应用程序权限（执行、网络访问、日志访问、磁盘访问等）。


    #### 4.3.5.2. 按动作作用范围过滤

    这种分类回答了问题：防火墙正在保护什么？


    第一代防火墙是为了保护网络（`Intranet`）免受外部（`Internet`）的攻击，因为后者被认为是攻击的主要来源。随着时间的推移，统计显示 80%
    的攻击来自内部。保护计算机的防火墙似乎是解决方案。


    为了避免与 PC 防火墙相关的配置困难，分布式防火墙由代理程序和一个管理服务器组成。


    ##### 经典防火墙

    任何保护网络的物理防火墙都被认为是经典防火墙。我们也将其称为箱式防火墙。该设备用于受保护的本地网络与潜在攻击源外部网络（`Internet`）之间。


    ##### PC 防火墙

    这是保护计算机并防止他人受该计算机攻击的软件。这种新一代防火墙之所以存在，是因为统计显示 80%的攻击来自内部源。PC 防火墙在家庭中作为防病毒使用，`Internet`
    上有很多免费版本可用。


    ##### 分布式防火墙

    这是一种新的网络解决方案，使用集中式配置保护不同的计算机。每台计算机都有一个作为 PC 防火墙的过滤代理，其配置来自负责日志的中央计算机。管理员不需要逐台计算机地重新配置和分析日志，也不需要将此任务交给用户（用户并不一定接受过相关培训）。


    ### 4.3.6. 状态防火墙

    状态防火墙是一种根据网络连接状态提供过滤的防火墙。其目标是保护本地网络免受任何外部访问尝试（来自 `Internet`）。此功能允许区分作为内部请求响应的数据包（授权）和从外部发起的新连接数据包（拒绝）。为此，防火墙检查从本地网络发起的流量，以便了解如何区分内部请求的响应与其余进入流量，并确定应应用什么操作。


    通过 Cisco 路由器（更新为支持防火墙的 `IOS`）的一种可能实现是基于 `ACLs`。方法如下：

    * – 选择内部和外部接口。


    例如，用于内部接口的 `GigabitEthernet 0/0`；用于外部接口的 `Serial 0/0/0`。

    * – 为每个接口配置 `ACLs`。


    例如，一个阻止来自任何外部接口进入流量的 `ACL`：


    或者，例如，一个允许来自任何外部接口授权流量的 `ACL`：

    * – 定义检查规则。


    例如，创建一个检查规则：

    * – 将检查规则应用到接口。


    例如，将检查规则应用到来自任何内部接口的进入流量：


    ### 4.3.7. 基于区域的防火墙

    `ZPF` 或基于区域的策略防火墙是一种提供灵活配置的防火墙，它独立于 `ACLs` 和物理接口。


    #### 4.3.7.1. 区域概念的通用介绍

    这种新的配置类型将接口分配给安全区域，并将防火墙策略应用于这些区域中流过的流量，包括：

    * – 确定区域；

    * – 建立区域间策略；

    * – 开发物理基础设施；

    * – 识别区域内的子组并合并流量需求。


    Cisco `IOS ZPF` 可以采取三种操作之一：

    * – *Inspect*（检查）：允许使用带状态 `IOS` 对数据包进行检查。

    * – *Drop*（丢弃）：类似于 `ACL` 中的 `deny` 命令，删除数据包。提供日志选项记录被拒绝的数据包。

    * *Pass*（通过）：类似于 `ACL` 中的 `permit` 命令，授权数据包。成功的操作不跟踪流量中连接或会话的状态。


    可以创建两个或多个区域，物理接口可能也可能不受区域影响；一个名为自区域（self-zone）的特定区域对应路由器本身，包含了分配给这些接口的所有 IP 地址。


    在创建安全区域后，管理员可以创建区域对，然后对部分或全部这些区域对进行安全性测试。

