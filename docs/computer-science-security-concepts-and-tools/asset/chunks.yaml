- raw: 'In particular, it affects users of Microsoft Outlook on the operating systems
    Windows 95, 98, Millennium, NT4, 2000 and XP, as well as users of Microsoft Internet
    Explorer.


    The Klez virus obtains the list of addresses stored as contacts in Microsoft Outlook,
    Eudora and instant messaging software (ICQ), and then sends an email to all the
    recipients using its own SMTP server.


    The Klez virus is thus able to generate emails with an empty body and whose subject
    is chosen randomly among a selection of a hundred or so predefined themes, and
    adds an executable attachment to this email containing a variant of the virus.


    ##### 2.3.1.4.2. Magistr


    The Magistr virus is a polymorphous worm (i.e. a virus that propagates itself
    through the network and whose form, or more exactly its signature, modifies itself
    continuously) that propagates itself using email. It especially affects users
    of the messaging clients Microsoft Outlook, Eudora and Netscape under the operating
    systems Windows 95, 98, Millennium and 2000.


    The Magistr virus seeks contact list files that are stored in the system (with
    .WAB and .DBX/.MBX extensions for clients of Outlook and Eudora, respectively)
    in order to select the recipients of the message.


    The subject and body of the message sent by the Magistr worm are chosen randomly
    by taking an excerpt from a file found on the infected computer’s drive. The Magistr
    virus adds a copy of itself to the message with a name containing an extension
    (or a double extension) like .com, .bat, .pif, .exe or .vbs. It can also potentially
    erase all of the information contained in the CMOS, the BIOS or in the hard disk.


    It can thus cause serious damage to the system and the information stored on it.
    Moreover, it is capable of deactivating the personal firewall ZoneAlarm using
    the WM\_QUIT command.


    ### 2.3.2. *Worms*


    A worm is an intrusion tool that propagates itself through the network. It is
    a network virus whose primary characteristic is tied to the way in which it propagates
    through the network.


    #### 2.3.2.1. *Effects*


    Currently, worms mostly replicate themselves using emails (and notably with the
    messaging client Outlook) thanks to the attached files containing instructions
    that train all of the email addresses contained in the contact list to be collected
    so that copies can be sent to all of these recipients.


    Most of the time, these worms are scripts (generally VBScript) or executable files
    sent as an attachment that initiates once the recipient clicks on the attached
    file.


    #### 2.3.2.2. *Prevention methods*


    In this way, all files that are executable or interpretable by the operating system
    can potentially infect a computer. It is simple to protect ourselves from an infection
    by a worm by being distrustful of files sent as attachments.


    Files containing the following extensions in particular are potential sources
    of infection:


    386, ACE, ACM, ACV, ARC, ARJ, ASD, ASP, AVB, AX, BAT, BIN, BOO, BTM, CAB, CDR,
    CHM, CLA, CLASS, CMD, CNV, COM, CPL, CPT, CSC, CSS, DLL, DOC, DOT DRV, DVB, DWG,
    EML, EXE, FON, GMS, GVB, HLP, HTA, HTM, HTML, HTT, INF, INI, JS, JSE, LNK, MDB,
    MHT, MHTM, MHTML, MPD, MPP, MPT, MSG, MSI, MSO, NWS, OBD, OBJ, OBT, OBZ, OCX,
    OFT, OV?, PCI, PIF, PL, POT, PPT, PRC, PWZ, QPW, RAR, SBF, SCR, SH, SHB, SHS,
    SHTML, SHW, SMM, SYS, TAR.GZ, TD0, TGZ, TLB, TSK, TSP, TT6, VBE, VBS, VBX, VOM,
    VS?, VWP, VXE, VXD, WBK, WBT, WIZ, WK?, WPC, WPD, WML, WSC, WSH, XML, XLS, XLT,
    ZIP.


    Under Windows, it is recommended that the “mask extensions” function be deactivated
    because this function can mislead a user regarding the real extension of a file.
    So, a file with the extension .jpg.vbs could appear as a file with a .jpg extension.


    ### 2.3.3. *Spam*


    This is an intrusion tool tied to an email, presenting itself in the form of an
    undesirable message.


    Spamming, which constitutes approximately 90% of email traffic, consists of sending
    out emails in massive amounts, generally for advertising (also called “junk mail”)
    to a large number of people who have not asked for this kind of advertising to
    be sent, thus filling message servers and inboxes with useless, unsolicited and
    usually misleading advertisements. Spammed emails currently constitute almost
    half of all emails circulating throughout the globe.


    Recent surveys taken since 2003 show that the propagation of spam represents the
    greater part of the total number of emails worldwide.


    #### 2.3.3.1. *Effects*


    Spam brings about numerous effects:


    *   – a waste of time (and thus money) for users, who must sort their email and
    clean out their inboxes more frequently;


    *   – the risk of overlooking an important message, “hidden” among multiple spam
    messages;


    *   – the “corruption” of unaware users with attractive but naturally fake offers;


    *   – moral offenses, via messages with sexual, political or religious advertisements;


    *   – a waste of the network bandwidth, which it uselessly consumes, monopolizing
    a large part of the bandwidth.


    #### 2.3.3.2. *Prevention methods*


    The proper measures that we should take to counteract spam are:


    *   – Do not respond to spam messages (do not threaten them, etc.), for that would
    only make matters worse since it would confirm to spammers that you are indeed
    receiving their emails, and also that you are receptive to this type of message.


    *   – Configure your email client, given that messaging software and webmail services
    sometimes allow us to block certain undesirable senders. Moreover, certain messaging
    clients systematically delete the emails in question.


    *   – Do not give your email address on dubious web forms because many of these
    websites provide these addresses to spammers. It would even be useful to have
    two or more email addresses, one of which is reserved for online identification
    and discussion groups.


    ### 2.3.4. *Software bomb*


    This is a case of hidden intrusion that starts suddenly.


    It is a program that begins after a system event (startup, starting a particular
    program, etc.) or even according to a preestablished schedule. A good illustration
    of this is the Chernobyl attack tool, which starts up on the same date of the
    Chernobyl nuclear catastrophe.


    ### 2.3.5. *Trojan horse*


    This is an indirect intrusion too. It is more complex and more serious than a
    virus. Its use is tied to the network.


    #### 2.3.5.1. *Definition*


    This is a program that hides inside another program and opens ports. It allows
    someone to take control of a computer, execute programs and start commands without
    the user knowing.


    A Trojan horse in and of itself does not do anything malicious, but it allows
    other entities to share information and/or modify it by opening ports through
    the network.


    #### 2.3.5.2. *Symptoms*


    An infection by a Trojan horse causes numerous symptoms, of which we can mention
    the following:


    *   – uncontrollable movement of the mouse;


    *   – opening and closing of windows;


    *   – abnormal activity in the modem or any other connection equipment, reflecting
    abnormal traffic on the network;


    *   – loss of control of the computer.


    #### 2.3.5.3. *Examples*


    [Table 2.1](#c02.xhtml#tab2-1) presents known examples of Trojan horses with the
    relevant ports that they manage to open without the knowledge of the user, creating
    hidden communication pathways.


    [**Table 2.1.**](#c02.xhtml#itab2-1) *Examples of Trojans and relevant ports*


    | **Trojan** || **Port** || **Trojan** || **Port** |


    | --- | --- | --- | --- |


    | TransScout || 2002 || SpySender || 1807 |


    | TransScout || 2003 || Shockrave || 1981 |


    | TransScout || 2004 || BackDoor || 1999 |


    | TransScout || 2005 || TransScout || 1999 |


    | Ripper || 2023 || TransScout || 2000 |


    | Bugs || 2115 || TransScout || 2001 |


    | HVL Rat5 || 2283 || Trojan Cow || 2001 |


    | Striker || 2565 ||   ||   |


    ### 2.3.6. *Spyware*'
