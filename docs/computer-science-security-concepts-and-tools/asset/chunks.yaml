  trans: '


    -   外部用户：这些用户由参与公司审计或协助解决特定安全问题的顾问和安全审计员，以及计算领域的任何其他外部合作伙伴组成。


    ### 8.3.2.2. 安全策略步骤


    安全策略的建立和应用经过几个步骤，具体定义如下：


    -   指定一名计算机安全管理员，负责安全策略的制定、实施和更新；

    -   定义计算机安全策略的范范围和目标，以限制该策略的应用范围，并能够评估其产生的影响和作用，以提高效率；

    -   分析现有的设备和软件，并维护一份构成计算机系统的所有元素的更新注册表。该注册表在修改计算机配置的组件时至关重要。在发生事故时，它可以帮助 IT 团队找到问题根源并确定责任；

    -   从可能的损害和事故发生的概率方面分析计算风险；

    -   确定降低风险和处理事故或管理持续活动的必要手段；

    -   为所有合作者编写计算机章程；

    -   向公司内的所有用户传达计算机安全策略及其所有细节和程序。


    ### 8.3.3. 安全策略的要素


    为了使安全策略既有效又适用，它必须由几个互补的要素组成，涵盖公司的不同层次结构。


    #### 8.3.3.1. 治理策略


    计算机安全的重要性要求公司进行高层干预，目的是提高决策和行动的效率。


    为了满足这一要求，安全管理员和安全委员会是必须的。


    安全管理员向计算机服务管理层汇报，履行以下任务并具备能力：


    -   他们可以向高级管理层发送警报；

    -   他们拥有完成任务所需的后勤、财务手段和权限；

    -   他们可以在与安全委员会成员直接合作的情况下，定义并实施安全策略；

    -   他们必须定期准备一份包含安全清单的报告。


    安全委员会包含并汇集了公司相关的利益相关者，即所有董事。它由安全管理员领导，确保技术警惕并建立网络安全文化。


    #### 8.3.3.2. 技术策略


    安全策略的技术部分涵盖了技术领域。它取决于所安装的硬件和软件资产，以及所处理信息的关键程度。


    技术安全策略由一组用于备份、过滤、监控和跟进的技术措施和解决方案组成。不同领域如下：


    -   建立反恶意软件软件（如反病毒、反垃圾邮件和反间谍软件），并进行必要的更新和补丁；

    -   使用路由器和防火墙部署过滤解决方案；

    -   开发和实施备份策略；

    -   根据已安装的服务开发特定的解决方案。


    #### 8.3.3.3. 终端用户策略


    安全文化部分具有至关重要的意义。它必须面向所有人员，不能忽略任何一个终端用户。终端用户是指任何可以访问计算机系统的人，是计算机安全链和待建立策略中的重要一环。


    必须通过针对性的培训课程、海报和章程对用户进行意识培养和告知，且这些内容必须被遵守。


    ## 8.4. 规范、指令和程序


    在进行审计或跟进其结果和影响，以及在建立计算机安全策略时，可以使用多项规范和标准：


    -   ISO 20000 规范族：ISO 20000-1 和 ISO 20000-2 规范是描述为公司及其客户高效交付计算机服务的管理过程的标准。这些遵循了
    ITIL`要求^(6)；

    -   ISO 27000/ISMS 规范族：计算机安全策略或信息安全管理系统（ISMS）的建立、使用、更新和管理；

    -   ISO/FDIS 31000 规范：风险管理；

    -   ISO/IEC 38500 规范：计算机安全治理；

    -   英国标准 BS 25999-1 规范：业务连续管理（BCM）实践代码；

    -   英国标准 BS 25999-2 规范：BCM 规范。


    ### 8.4.1. ISO 27000 规范


    ISO 27000 系列规范是 ISO 专门针对信息安全问题的。27000 系列包含一系列一系列的规范和文档。其中许多已经发布。


    -   ISO 27001：这是信息安全管理系统（ISMS）的规范，取代了之前的 BS7799-2 规范。

    -   ISO 27002：这是 27000 系列中的标准号，它是 ISO 17799 规范（以前称为 BS7799-1）的起源。

    -   ISO 27003：这将是为建立 ISMS（信息管理系统）提供建议的规范正式编号。

    -   ISO 27004：该规范涵盖了管理信息安全的措施和指标，包括 ISO 27002 中建议的控制措施。

    -   ISO 27005：这项 ISO 规范独立于与信息安全相关的风险管理方法。

    -   ISO 27006：该规范为提供 ISMS 认证的机构提供了指南。


    ### 8.4.2. ISO/FDIS 31000 规范


    ISO 31000 指的是由国际标准化组织编制的一系列风险管理规范。ISO 31000 规范的目标是为风险管理提供原则和指南，以及从战略和操作上建立风险管理的过程。它并不寻求促进组织内部风险管理的统一，而是为了协调现有的多种风险管理方法、标准和方法论。


    目前，ISO 31000 族包括：


    -   ISO 31000:2018，风险管理，原则和指南；

    -   ISO/CEI 31010:2009，风险管理，风险评估技术；

    -   ISO Guide 73:2009，风险管理，术语。


    ### 8.4.3. ISO/IEC 38500 规范


    ISO/IEC 38500 是公司治理信息技术的国际规范。它是计算机治理的第一项正式规范。


    该规范涉及组织使用的信息和通信服务相关的管理过程治理。这些过程可以由组织内的计算机专家或外部服务提供商进行控制。


    ## 8.5. 结论


    安全审计对于确保计算机安全是必要的，但它们仍然够够；它们必须通过公司内部的技术监控来完成和执行，通过审计和监控工具以及与相关机构的严格合作关系来跟进日常安全状况。


