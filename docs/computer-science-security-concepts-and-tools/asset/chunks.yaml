    ## 5.3. Intrusion detection systems


    An intrusion detection system (IDS) is a mechanism meant to identify abnormal
    or suspect activities in the analyzed object (a network or a host). It thus provides
    knowledge of successful intrusions as well as failed attempts. IDSs, which have
    gone through considerable evolutions, include many forms and can act at many levels.


    ### 5.3.1. IDS purposes


    An IDS ensures the identification of all intrusive behavior in an environment
    and promptly provides a notification of this behavior.


    An IDS is a monitoring system based on varied and complementary techniques. It
    must announce any detections it makes in order to be able to react at the right
    moment and find the necessary remedy or prevention measures so that the attack
    can be evaded or deactivated.


    ### 5.3.2. IDS components and functions


    An IDS is made up of many elements:


    *   `Production stack`: this consists of a group of integrated `TCP/IP` modules
    in the majority of network operations on the system platform. It detects `IPv4`
    and `IPv6` intrusions and extrusions.

    *   `Service stack`: this consists of a group of integrated modules in the service
    and support of the system platform. It detects `IPv4` intrusions and extrusions
    and is the first response to the production stack.

    *   `IDS task`: this is the component that treats events generated by the `production
    stack` and the `service stack`.

    *   `Graphic interface`: this allows the events to be visualized from an audit
    record.

    *   `IDS notification`: this is the alert component that sends messages via email.

    *   `Audit record`: this maintains the log.


    IDS components and the environment in which they operate are presented in [Figure
    5.1](#c05.xhtml#fig5-1).


    The IDS works in the following manner:


    *   When the `production stack` or the `service stack` detects an advanced intrusion
    or an extrusion, it sends an event to the `IDS task`.

    *   The `IDS task` takes events in order one by one and ensures that each event
    corresponds to one condition (from the port table). The `IDS task` also maintains
    statistics on intrusion and extrusion events.

    *   The IDS gives notifications of events that go beyond the thresholds set in
    the strategy files.

    *   If there is a notification of an event, an intrusion surveillance record is
    created in the audit log.

    *   The IDS graphic presents intrusion events from the audit log folders.

    *   If an email and a notification message have been configured in the `IDS properties
    page`, the `IDS notification` will send an email to the specified address and
    a message to a message file.


    ![Figure 5.1. IDS components and functions](images/fig5-1.jpg)


    [**Figure 5.1.**](#c05.xhtml#ifig5-1) IDS components and functions


    ### 5.3.3. IDS classification


    IDSs can be classified according to either the field of action (computer or network)
    or the level of protection (simple detection or prevention).


    #### 5.3.3.1. Classification by field of action


    Depending on what needs to be secured, a computer or a network, we distinguish
    an `H-IDS` (Host-based IDS) and an `N-IDS` (Network-based IDS).


    ###### H-IDS


    H-IDSs, or computer intrusion detection systems, are IDSs dedicated to monitoring
    equipment and operating systems. An `H-IDS` gathers information provided to it
    by the equipment or the operating system. For this purpose, there are different
    approaches: signatures and behavior.


    An `H-IDS` behaves like a daemon or a standard service on a system host that detects
    suspicious activity by comparing it to a norm. If the activity is very different
    from the norm, an alert is generated. The computer can be monitored in various
    ways:


    *   `computer activity`: number and lists of processes, users, resources used,
    etc.;

    *   `user activity`: times and duration of connections, commands used, messages
    sent, programs started, usage beyond a predefined perimeter, etc.;

    *   `malicious activity` by a worm, virus or Trojan horse.


    Another type of `H-IDS` seeks out intrusions in the system kernel and any modifications
    made therein. This technique is called `protocol analysis`, a technique that does
    not require searching a signature database.


    ###### N-IDS


    N-IDSs, or network-based intrusion detection systems, are IDSs dedicated to monitoring
    the security state of a network. `N-IDS` analysis can be divided into three general
    subsections: capture, signatures and alerts.


    *   `Capture`: this captures network traffic in real time. Most `N-IDSs` use a
    standard capture packet library called `libpcap`, which is available on most platforms.

    *   `Signatures`: this is a library of attack signatures (classified by context)
    used in a manner similar to an antivirus. Thus, an `N-IDS` is efficient when it
    is familiar with the attack, but inefficient when it is not. Commercial and free
    tools have evolved to provide signature personalization, which allows attacks
    of which only one part of the elements is known to be dealt with. Tools based
    on signatures require more regular updates.

    *   `Alerts`: these are generally saved in the form of a log. A norm exists for
    organizing the content so that different security elements can be altered. This
    format is called the `IDMEF` (Intrusion Detection Message Exchange Format), described
    in the `RFC4765`. The `IDMEF` offers an infrastructure so that the IDS does not
    have to send alerts. This allows the IDS to focus on describing the information
    it contains without having to record it for later user visualization.


    The `N-IDS` has the advantage of being a system in real time, which means attacks
    targeting numerous computers at once can be discovered. The disadvantage is the
    high rate of false positives generated.


    #### 5.3.3.2. Classification by level of protection


    Intrusion management systems can provide detection and/or prevention. There are
    three families of systems: `IDS`, `IPS` and `IDS/IPS`.


    ###### IDS


    This is the simplest form insofar as it only provides detection. The mechanism
    identifies abnormal or suspicious activity on the analyzed object (a network or
    host) and thus provides knowledge of intrusions on a company.


    ###### IPS


    An `IPS`, or intrusion prevention system, is a mechanism that protects systems
    from intrusions. IT is evolved from the `IDS` and provides both detection and
    prevention. It has the same detection role as an `IDS` except that the system
    can take steps to diminish the risk of impact. The `IPS` is an active `IDS` that
    detects automatic scanning, and can block ports.


    ###### IDS/IPS


    This is a new generation of `IDS/IPS`, which are hybrid detection/prevention solutions
    for intrusions in a computer and network.


    #### 5.3.3.3. Comparison between different types of IDS/IPS


    [Table 5.2](#c05.xhtml#tab5-2) presents a comparison between the `H-IPS` and `N-IPS`
    by presenting their advantages and disadvantages.


    [**Table 5.2.**](#c05.xhtml#itab5-2) Advantages and disadvantages of the H-IPS/N-IPS


    | | **Advantages** | **Disadvantages** |

    | --- | --- | --- |

    | **Host-based IPS** | – Provides specific protection for the computer – Offers
    high-level protection for the operating system and applications – Protects the
    computer after messages are decrypted | – Depends on the operating system – Requires
    installation on all computers |

    | **Network-based IPS** | – Provides better cost – Is independent from the operating
    system | – Is incapable of analyzing encrypted traffic – Must stop malicious traffic
    before it reaches computers |


    ### 5.3.4. Examples of IDS/IPS


    In this section, we will present some examples of the `IDS` or `IPS` that can
    offer open-source or commercial solutions. Each of its advantages, weaknesses
    and classifications will be explained.


    #### 5.3.4.1. Snort


    `Snort` is a free `IDS/IPS`^([1](#c05.xhtml#fn1)). It offers several modes:


    *   `Listening mode`: this starts `Snort` in a sniffer mode so the packets identified
    by an `IDS` can be observed.

    '
