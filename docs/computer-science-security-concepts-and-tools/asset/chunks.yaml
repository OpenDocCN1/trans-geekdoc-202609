    ## 6.5. Conclusion


    Encryption is a very efficient technique that ensures confidentiality and/or authentication
    of local information or messages exchanged by network applications. Such a solution
    is insufficient without low-level encryption. That is the purpose of the IPSec
    protocol, which is a version of the TCP/IP that offers confidentiality and/or
    authentication at the packet level.


    The appearance of IPSec was without a doubt a radical solution for mitigating
    the faults and vulnerabilities of TCP/IP. Its use remains timid, given the diversity
    and incompatibility of implementations.


    IPSec applies encryption techniques at the level of the packet to create a secure
    protocol stack that can be used at high levels to create VPNs.


    VPNs use the simple principle of the tunnel, which is a secure encapsulation by
    encryption. It is based on a large panoply of open and proprietary technologies.
    The richness of this diversification offers a greater panoply of choices for establishing
    VPN tunnels. It offers flexible access to company data and extends security to
    the supplier, client, home worker, etc. This technique, coupled with virtualization
    techniques such as “cloud computing”, makes access commonplace, all the while
    ensuring security.


    # 7. New Challenges and Trends in Security, SDN and IoT


    ## 7.1. Introduction


    Nowadays, the classical architecture of networks is being left behind, to the
    detriment of new technologies, among which we can mention the SDN (software-defined
    network). The new technology has different characteristics and architectures that
    can cause different attacks compared to traditional networks. This scenario presents
    specific challenges that require appropriate security solutions.


    The SDN architecture was developed with the aim of making a network virtual. It
    makes the control panel virtual by moving it from each peripheral device to a
    central network entity for control and rule generation, called the SDN controller.


    Indeed, smart objects are beginning to dominate all areas, connected to one another
    via a network and evolving increasingly towards intelligence and automation. This
    considerable evolution presents limitations with respect to security challenges
    at every level. These specific challenges demand appropriate security solutions.
    This kind of network is a potential target for intrusion insofar as the connected
    smart objects and the automation they offer provide pirates with key control and
    spy points. These vulnerabilities make security especially important in the IoT/IoE.


    ## 7.2. SDN security


    Networks are progressively migrating towards automation and virtualization, which
    opens the door to a new trend in security that is specific to SDNs.


    ### 7.2.1. General description of an SDN


    SDN technology is a network architecture approach that allows data (useful traffic)
    to be separated from control (network management traffic). The SDN architecture
    is made up of three layers, separated by interfaces through which control and
    management information is sent.


    SDNs have specific functions compared to traditional networks. They offer a centralized
    architecture in the sense that network traffic is managed by a central device
    called the SDN controller. It communicates with the infrastructure layer containing
    different network components via a communication interface called `Southbound`.
    Moreover, it communicates with the management layer containing administrative
    and supervisory devices and applications via a communication interface called
    `Northbound`.


    The SDN can be managed by scripts and programs written in advanced programming
    languages such as `Java`, `Python`, `C` and `P4`.


    Two functions, namely centralization and programmability, make the SDN a flexible
    network that is easy to manage using virtualization mechanisms and tools.


    These functions mean that the SDN incites different attacks, presents different
    vulnerabilities and offers different security solutions. Security challenges are
    very different from those in traditional networks.


    The SDN can be managed in collaboration with a cloud computing solution, which
    is used to store rules and policies. In cloud-based security, the SDN controller
    uses the security actions of cloud services to create traffic rules.


    ### 7.2.2. SDN architecture


    The architecture of an SDN is made up of three hierarchical layers, as shown in
    [Figure 7.1](#c07.xhtml#fig7-1).


    ![Figure 7.1. SDN architecture](images/fig7-1.jpg)


    [Figure 7.1.](#c07.xhtml#if7-1) SDN architecture


    The functions and components of the layers that define the architecture of an
    SDN are as follows.


    * – Infrastructure or data level: this is the lower layer, which is made up of
    equipment and network nodes such as the switch/router, workstations and sensors.
    This is also called the transmission or data plane, and this layer refers to the
    switching that connects different network ports on a peripheral. The data plane
    for each peripheral device transmits and advances traffic.

    * – Control level: this is the middle layer, which contains the most important
    component, the SDN controller. This is also called the control plane, which is
    considered the brain of the system. The control plane is the location where transmission
    decisions are made. Information sent to the control plane is processed by network
    nodes.

    * – Application level: this is the top layer, which is optional. It includes advanced
    equipment that control applications along with management and administrative scripts.


    This architecture includes four different types of interfaces.


    * – `Southbound`: this is used by the controller to communicate with the data
    layer.

    * – `Northbound`: this is used by the controller to communicate with the application
    layer.

    * – `Eastbound`: this is used by the controller to communicate with other controllers
    in the same SDN.

    * – `Westbound`: this is used by the controller to communicate with equipment
    in another traditional network.


    In order to program networks and make them virtual, various options are available:


    * – protocols: `OpenFlow`, `NETCONF`, `RESTCONF`, etc.

    * – programming languages: `C`, `C++`, `Java`, etc.

    * – script languages: `Python`, `Lua`, etc.

