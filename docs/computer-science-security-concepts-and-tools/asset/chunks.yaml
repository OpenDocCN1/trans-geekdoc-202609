- raw: 'These services apply to system entities and/or information that is stored
    locally, in the middle of being processed or gets transmitted through a network.


    Ensuring computer security within a company necessarily consists of providing
    the different needs mentioned above. Certain services appear more critical than
    others, depending on the nature of traffic and the information being manipulated.
    The system and network administrator, and more generally, the security manager,
    must define priorities in satisfying different security services. A priority can
    change depending on the circumstances.


    Any violation or threat to one or numerous security services necessarily brings
    a threat to the security of the system or company in question.


    ### 1.7.1. *Authentication*


    Contrary to identification, which serves to mark or otherwise distinguish an entity
    among others, authentication is a proof of identity; it serves to ensure that
    the entity in question is really the entity that just identified itself.


    The act of saying that “I am X” is an identification; this must be followed by
    a means for proving that we are really “X”, which is authentication.


    There are numerous types of basic authentication, namely: I know, I have and I
    am. They can be set up individually or coupled.


    #### 1.7.1.1. *I know*


    This is the simplest and most well-known method. It consists of authenticating
    ourselves via a secret combination of characters; this is the password associated
    with a login. The login is unique and serves as identification. The password is
    secret and serves as authentication.


    A password must satisfy a group of rules in order to avoid any kind of sharing
    or brute force, and withstand attempts at intrusion. As such, a password must
    satisfy the following rules:


    *   – non-trivial (abc, qwerty, 123, etc.);


    *   – not so complicated that it is difficult to learn;


    *   – should never appear anywhere physically (piece of paper, notebook, etc.)
    or digitally (file, email, etc.);


    *   – does not come from a dictionary;


    *   – does not correspond to a personal characteristic (last name, first name,
    license plate number, etc.);


    *   – is not used twice (Facebook account, email account, etc.);


    *   – a combination of capital letters, lowercase letters, numbers and special
    characters;


    *   – periodically modified in order to limit how long it is used for.


    A good practice for choosing a password is to choose a word from the dictionary
    or that comes from another language (such as Arabic) and formulate it using Latin
    letters, or perhaps even numbers (e.g. 3a55alem), making sure to use obvious spelling
    errors (e.g. conbuter for computer) or inverted syllables (e.g. terpucom for computer).


    #### 1.7.1.2. *I have*


    Authentication in this scenario is guaranteed by the possession of a private physical
    object. Microchipped cards can be used as a means of checking personnel.


    This method is the most primitive and easiest to use; it presents some blind spots
    tied to the possibility of being able to give the object in question to someone
    else.


    This is the case for authentication that allows access to a private locale using
    a visitor’s badge for people from outside a company.


    For bank cards, we have two means of authentication in sequence: I have (the card)
    and I know (the code).


    #### 1.7.1.3. *I am*


    This is the strongest means of authentication. It is tied to some of the personal
    characteristics of a person, such as a digital imprint (we speak of biometric
    authentication) or characteristics of the eyes or a hand (form, heat, etc.).


    Such a method can be used to control access to places or critical locales. It
    is also useful for authentication on a computer or system.


    ### 1.7.2. *Confidentiality*


    This is the act of ensuring that manipulated information does not get divulged
    by any unauthorized third-party entity. It is a protection against the spread
    of critical information, using the technique of encryption, in order to make the
    information illegible and incomprehensible by other, non-relevant entities.


    ### 1.7.3. *Integrity*


    This is a protection against the modification of manipulated information. It is
    a means of detecting whether a block of information has undergone a modification,
    however simple, using hash techniques, which consist of generating a representative
    message that is unique and dependent on the information in question.


    ### 1.7.4. *Non-repudiation*


    This is the act of guaranteeing that none of the correspondents (sender or recipient)
    in the transmission of information will be able to deny the transaction.


    ### 1.7.5. *Traceability and access control*


    Traceability consists of being able to follow access to sensitive computer resources
    (time of connection, list of actions, etc.). Access control consists of limiting
    access to different shared resources, both material and software.


    ### 1.7.6. *Service availability*


    This is the act of maintaining the proper functioning of a service, in order to
    satisfy the requests of authorized users in all scenarios. It is a protection
    of the server itself via measures and techniques that detect and neutralize attempts
    by external entities to interrupt service.


    ## 1.8. Security mechanisms


    By *security mechanisms*, we mean a well-defined measure or technique allowing
    one or more security services to be provided.


    Computer security mechanisms are the means allowing for the provision of security
    services. The ISO 7498-2 norm allows us to specify:


    *   – encryption using shared a key;


    *   – encryption using a private/public keys;


    *   – integrity of data with a hash function;


    *   – authentication;


    *   – access control;


    *   – digital signature;


    *   – notarization.


    ### 1.8.1. *Encryption*


    Encryption is a technique that has been used for centuries. It entails the modification
    of a text to make it incomprehensible, except for the person who generated it.
    The branch of mathematics that deals with this subject is called cryptography.
    This mechanism allows confidentiality services to be provided.


    Encryption is based on two basic techniques: substitution (a table of correspondences
    between letters and numbers) and shift, also known as the Caesar cipher, which
    allows letters to be substituted in a circular manner.


    Since its appearance, this mechanism has gone through several evolutions: to begin
    with, the first solutions were based on the choice of an algorithm that would
    be used for encryption, as well as for decryption. Then, a new generation of encryption
    solutions used a symmetrical key (the shift value in the case of the Caesar cipher).
    This key would be used for both encryption and decryption. Finally, encryption
    with asymmetrical keys was created. This entails a pair of keys used for encryption
    and decryption, with the purpose of avoiding the problem of sharing, which is
    the security weakness in the case of the first two generations of encryption.


    We can cite the following encryption algorithms as examples: DES, 3DES, AES, RSA,
    Blowfish, etc.


    Encryption was never an absolutely necessary solution insofar as any cryptogram
    can be analyzed to obtain the corresponding plain text. We speak of cryptoanalysis,
    which is a technique based on linguistic statistics. As an example, we can think
    of Turing’s work during World War II, which allowed the Allies to find the plain
    texts of military messages sent by the enemy’s governors to their troops, thanks
    to Turing’s cryptoanalysis machine.


    ### 1.8.2. *Integrity check*


    An integrity check is a mechanism based on the hash algorithm that allows integrity
    service to be provided.


    A hash algorithm is a non-bijective function that generates a chain with a unique,
    fixed size, in other words a hash code made from a chain of variable length. The
    latter can be a packet, message, web page or other; it is the thing that proves
    its integrity.'
