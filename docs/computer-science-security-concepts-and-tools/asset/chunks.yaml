    AH-ESP in tunnel mode consists of first encrypting the IP packet data using the
    `ESP` protocol, then applying the `AH` protocol and finally putting the original
    header of the IP packet back.


    ![Figure 6.9. AH-ESP encapsulation in transport mode](images/fig6-9.jpg)


    **Figure 6.9.** *AH-ESP encapsulation in transport mode*


    ### 6.3.5.4. AH in tunnel mode


    AH in tunnel mode consists of authenticating the entire IP packet (header and
    data). This task requires the addition of an `AH` header and a new `IP` header
    to form a new packet with different characteristics.


    ![Figure 6.10. AH encapsulation in tunnel mode](images/fig6-10.jpg)


    **Figure 6.10.** *AH encapsulation in tunnel mode*


    ### 6.3.5.5. ESP in tunnel mode


    ESP in tunnel mode consists of encrypting the entire IP packet (header and data).
    This task requires the addition of an `ESP` header and a new `IP` header to create
    a new packet with different characteristics.


    The resulting packet data made up of the added `ESP` header and the entire original
    packet gets authenticated.


    The encryption and authentication also concern a part of the footer.


    ![Figure 6.11. ESP encapsulation in tunnel mode](images/fig6-11.jpg)


    **Figure 6.11.** *ESP encapsulation in tunnel mode*


    ### 6.3.5.6. AH-ESP in tunnel mode


    AH-ESP in tunnel mode consists of first encrypting the entire IP packet (header
    and data) using the `ESP` protocol and then applying the `AH` protocol to generate
    a new `IP` packet at the end.


    ![Figure 6.12. AH-ESP encapsulation in tunnel mode](images/fig6-12.jpg)


    **Figure 6.12.** *AH-ESP encapsulation in tunnel mode*


    ### 6.3.6. IKE protocol


    IKE is the acronym for Internet Key Exchange, a protocol for exchanging keys and
    negotiating security parameters. It establishes SAs (Security Associations) between
    partners, in this case the extremities of the tunnel.


    `SA` is a group of unidirectional security parameters that englobe algorithms
    for authentication, encryption and integrity control.


    `SAs` can be altered manually or via the `ISAKMP` protocol. `ISAKMP` (Internet
    Security Association and Key Management Protocol) is used for the negotiation,
    establishment, modification and deletion of `SAs` and associated parameters. It
    defines the procedures and format of packets for creating and managing authentication
    by `SA` pairs and the techniques for generating keys.


    IKE includes two phases:


    - phase 1: the `ISAKMP` rules for creating a tunnel and exchanging keys are established
    using the `DH` (Diffie–Hellman) protocol before verifying identities;

    - phase 2: the `IPSec` rules for transmitting traffic in a secure fashion through
    the tunnel are established.


    ## 6.4. VPNs


    VPN is the acronym for Virtual Private Network. This is when public resources
    are used to work in a secure fashion, using encryption as if it were a private
    network.


    ### 6.4.1. Issues and justifications


    If someone wants to connect sites from one company (bank, insurance, etc.) in
    different geographical locations, two solutions are possible: a public or a private
    option.


    The first solution consists of using the Internet to communicate. This is an inexpensive
    solution, but also un-secured since the network is shared with a myriad of other
    actors.


    The second solution consists of using specialized connections. This is a completely
    private and therefore secure infrastructure, but it is very expensive.


    Faced with this choice, VPN appears to be the optimal connection solution in terms
    of security and cost.


    ### 6.4.2. VPN principles


    The establishment of a VPN consists of using tunnels to communicate via the Internet
    instead of using specialized connections.


    A tunnel provides security for data, as well as the identity of users. We speak
    of `IP` in `IP` encapsulation. The new `IP` packet generated has the `WAN` addresses
    of local network routers communicating on the Internet via the tunnel as the source
    and destination.


    VPN is based on a protocol, called the tunneling protocol, that is, a protocol
    allowing data to go from one end of the VPN to the other to be secured by cryptographic
    algorithms.


    The term tunnel is used to symbolize the fact that between the entry and exit
    of the VPN, data is encrypted and thus normally incomprehensible for any person
    situated between the two extremities of the VPN, as if the data was passing through
    a tunnel. Moreover, to create a tunnel also means encapsulating a protocol within
    a protocol at the same OSI model level (e.g. `IP` in `IPSec`). In the case of
    a VPN established between two computers, we call the element encrypting the entering
    data the `VPN client` and the element decrypting the data at the exit the `VPN
    server` (or more generally, the remote server).


    This is the case when a system outside of a private network (nomad client, agency,
    or someone working from home) wishes to connect to the company’s network and:


    - the packets (which contain data) are encrypted by the `VPN client` (using the
    algorithm selected by the two interlocutors when establishing a VPN tunnel) and
    eventually signed;

    - they are transmitted via a transporter network (usually the Internet);

    - they are received by the `VPN server`, which decrypts them, processes them and
    checks that the required verifications are correct.


    ### 6.4.3. Different types of VPNs


    Based on the extremities using a VPN, there are two types: site-to-site VPN and
    remote access VPN.


    #### 6.4.3.1. Site-to-site VPN


    This is a setup that connects two networks from two geographically distinct sites
    via the configuration of a VPN between the routers, the interface with which the
    Internet connection is made at both sites.


    A good application of this is the connection of two or more agencies from any
    company, either among themselves or to the central site. This kind of VPN tunnel
    can also be used to connect a supplier with a client.


    This kind of VPN can be an optimal solution, both secure and inexpensive, to ensure
    the total interconnectivity of a company with other site locations.


    #### 6.4.3.2. Remote access VPN


    This is a secure connection via the Internet from a nomad user or home workstation
    to a geographically distant network. This technique offers an alternative for
    facilitating remote work or allowing isolated users to connect to a company without
    compromising security and remaining safe from attacks by hackers or network pirates.


    This kind of VPN allows a company to connect its remote collaborators, who will
    in turn share services with the company for lower costs and with full security.


    ### 6.4.4. Different tunneling protocols


    VPN tunnels can be based on numerous protocols:


    - `PPTP (Point-to-Point Tunneling Protocol)`: a level 2 protocol developed by
    Microsoft, 3Com, Acend, US Robotics and ECI Telematics;

    - `L2F (Layer Two Forwarding)`: a level 2 protocol developed by Cisco Systems,
    Nortel and Shiva;

    - `L2TP (Layer Two Tunneling Protocol)`: the product of work done by the IETF
    (RFC 3931) to combine the functions of `PPTP` and `L2F`. This is a level 2 protocol
    dependent on `PPP`;

    - `IPSec (IP Secured)`: a level 3 protocol, based on work by the IETF, transmitting
    encrypted data for `IP` networks;

    - `SSL/TLS (Secure Sockets Layer/Transport Layer Security)`: it provides a very
    good tunneling solution. The advantage of this solution is that it uses a Web
    browser as the `VPN client`;

    - `SSH (Secure Shell)`: initially considered the secure replacement for telnet,
    it offers the possibility of tunneling TCP connections, thus providing secure
    access to services offered on a protected network, without creating a virtual
    private network.


    ### 6.4.5. Site-to-site IPSec VPN configuration


    Let us configure, for example, a site-to-site IPSec VPN in `CLI` mode (Command
    Line Interface) to the network configuration depicted in [Figure 6.13](#c06.xhtml#fig6-13).


    ![Figure 6.13. Example of a site-to-site IPSec VPN](images/fig6-13.jpg)


    **Figure 6.13.** *Example of a site-to-site IPSec VPN*

