    ## 6.3. IPSec


    IPSec 通过 `AH` 协议提供 IP 数据包的认证，通过 `ESP` 协议提供数据的机密性。


    IPSec 协议适用于两种模式：传输模式（transport mode）和隧道模式（tunnel mode）。前者是较简单的模式，只关注数据；而后者保护整个
    IP 数据包（报部和数据）。我们称之为 IP 中的 IP 封装。隧道模式被用作实现 VPN 的基本技术等。


    IPSec 协议族包含两种互补的技术：`AH` 和 `ESP`。它们管理着多种加密算法（`DES`、`3DES`、`Blowfish`、`RSA` 等）以及哈希（`MD5`、`SHA1`
    等）的实现。IPSec 通信的配置决定了使用的适当算法选择。IPSec 由 IETF 定义为 40 个 `RFC` 组成的链，详细说明了协议的所有方面。此外，IPSec
    与 `IPv6` 自动集成。


    IPSec 使用安全关联（`SA`）的概念来定义不同双方的用法和应用的安全参数。


    IPSec 安全关联是一个数据结构，其功能是记录与通信相关的所有安全参数。由于 `SA` 是单向的，因此需要两个 `SA` 来保护双向的通信。


    ### 6.3.1. AH


    `AH`，或称认证头（Authentication Header），是一种提供认证并保证 IP 数据包完整性的协议。它适用于传输模式和隧道模式。


    `AH` 协议提供以下安全服务：

    * – 非连接模式下的完整性；

    * – 数据的认证；

    * – 防重放（可选）。


    ### 6.3.2. ESP


    `ESP`，或称封装安全载荷（Encapsulating Security Payload），是一种 IPSec 协议，提供机密性并可以提供认证、确保数据完整性和会话的不可否赖性。它适用于传输模式和隧道模式。


    `ESP` 协议提供以下安全服务：

    * – 机密性；

    * – 防止流量分析；

    * – 非连接模式下的完整性（类似于 `AH`）；

    * – 数据的认证（类似于 `AH`）；

    * – 防重放（类似于 `AH`）。


    `ESP` 确实涵盖了 `AH` 提供的服务。


    ### 6.3.3. 不同的 IPSec 模式


    安全性可以仅涉及 IP 数据包数据，也可以应用于整个数据包（头部和数据）。我们可以将 IPSec 分为两种应用模式：传输模式和隧道模式。


    #### 6.3.3.1. 传输模式


    这确保了 IP 数据包数据的安全性。传输模式是 IPSec 的默认模式，用于端端通信（客户端和服务器之间的通信）。当使用传输模式时，IPSec 只加密 IP
    负载荷。传输模式通过 `AH` 或 `ESP` 头部为 IP 负载荷提供保护。


    #### 6.3.3.2. 隧道模式


    这为 IP 数据包（头部和数据）提供安全性。当使用 IPSec 隧道模式时，IPSec 会加密 IP 头部负载荷。


    隧道模式通过将整个 IP 数据包视为 `AH` 或 `ESP` 负载荷，为整个 IP 数据包提供保护。在隧道模式中，完整的 IP 数据包被封装在 `AH`
    或 `ESP` 头部以及一个额外的 IP 头部中。外部 IP 头部的 IP 地址是端点地址。

    '
