    ### 1.3.1. 攻击的被动/主动分类


    导致安全受到威胁的攻击可分为两类：被动和主动，取决于它们的影响以及对通信过程的参与程度。我们也可以将其称为侦察攻击和访问攻击。


    #### 1.3.1.1 被动攻击（侦察攻击）


    被动攻击也称为侦察攻击，由被动观察信息或其特征组成，无论信息是在计算机内部还是通过网络传输。这种攻击可以通过一系列嗅探器或观察者来实现。这类软件在互联网上非常容易找到，它们一方面可以利用许多漏洞来扫描系统和网络的特征及配置，另一方面可以分析流量以提取信息。


    侦察攻击可以通过一系列基本动作实现：


    - 向目标的初始请求；

    - 对目标进行扫描；

    - 扫描 IP 地址；

    - 扫描漏洞；

    - 工具利用（适当的嗅探器）。


    我们可以引用以下嗅探器作为示例：`Wireshark`、`WinPcap`、`SiteSniffer`、`SocketSniffer`、`Packetetyzer`、`PacketViewer`、`CommView`。


    我们可以区分许多场景：


    - 用户：这发生在特定通信的参与者身份被发现时。

    - 消息间隔时间：这发生在消息频率被发现时，从而允许识别应用程序的性质（交互式等）。

    - 信息本身：这是最严重的一种攻击，即通信信息的内容。


    #### 1.3.1.2 主动攻击（访问攻击）


    主动攻击也称为访问攻击，由对信息和/或通信过程采取行动组成，因此比被动攻击更严重。它涉及数据或消息的修改、进入网络设备或干扰系统的正常运行。


    访问攻击的主要目标包括：


    - 收集数据；

    - 获取访问权限；

    - 授予更大的访问权限。


    我们可以区分不同的场景：


    - 欺骗连接：这发生在在没有连接权限的情况下与服务器建立连接时。这种连接允许攻击者像是账户所有者一样进行更改。他们可以删除文档、更改配置等。

    - 拒绝服务：这发生在一个或多个授权用户被阻止访问服务时。它包括攻击服务器并使其离线，从而瘫痪所有访问。这种攻击被称为 `DoS`（拒绝服务）。我们也可以称之为
    `DDoS`（分布式拒绝服务），这是当主计算机成功控制了大量计算机并利用它们攻击受害者使其离线时发生的攻击。

    - 消息篡改：这通过在稍后重新插入之前捕获某些消息来修改消息顺序。

    - 通信中断/延迟：这发生在黑客成功停止连接或延迟消息访问和传输时。

    - 消息内容的修改/泄露：最严重的行为，由修改或公开发送消息的内容组成。

    - 端口重定向：这泛指重定向流量或将响应、操作或命令重定向到第三方未经授权的计算机。

    - 中间人：这允许第三方在通信的两个实体之间介入的攻击，而后者毫无察。

    - 缓冲区溢出：这种攻击由利用缓冲区容量（在编写较弱的语言如 `C` 中是可能的），目的是在内存中放置精心的代码并导致系统或网络故障。

    - IP、MAC、DHCP 欺骗：这种攻击允许利用授权计算机的身份（`IP address`、`MAC`）进行攻击或重定向信息。

    - 数据丢失：代表了最昂贵的攻击，因为一旦丢失，数据就需要巨大的努力才能恢复并恢复到原有水平，这在大多数情况下是无效的，并可能给公司带来非常严重的财务影响。导致数据丢失的漏洞点包括：


    - 邮件访问/非安全网页邮箱；

    - 未经检查的外围设备；

    - 云存储；

    - 可移动式介质；

    - 不满足最小安全要求的适当访问检查。


    ### 1.3.2. 攻击的直接/间接分类


    在互联网上，攻击可以利用其自身的身份或资源直接针对目标，也可以隐藏在中间人之后，在某些情况下使用后者的身份和/或资源。


    #### 1.3.2.1 直接攻击


    这是简单的攻击，也是最容易检测的。它由使用目标自身的身份（`IP address`、`MAC address`）和资源（`memory`、`CPU` 和硬盘）向目标发起攻击请求组成，如图
    1.1 所示。这些攻击变得越来越稀有，因为最严重的黑客寻求隐藏自己或获取进一步的能力，由于用户已经开发了检测直接发起攻击连接的方法。


    ![图 1.1. 直接攻击]


    #### 1.3.2.2 间接攻击


    这是最复杂且最难追踪的攻击。有两种：


    - 第一种攻击是反弹攻击，指的是为了其身份或资源而被利用的中间计算机。

    - 第二种攻击是响应攻击，利用服务器作为中间计算机来攻击第三台计算机。


    ##### 1.3.2.2.1 反弹攻击


    黑客试图控制中间计算机（通常通常具有更好的资源），如[图 1.2]所示。它将被用于创建一个反弹，使得受害者的身份和资源被用于攻击其计算机，导致真实攻击者无法以任何方式识别。我们称之为链式攻击。这种类型攻击的新变体基于三个或多个链式攻击，在这种情况下，我们处理的是两个或多个反弹。反弹本身是一个受害者，尽管它是攻击最终受害者的起点。


    ![图 1.2. 通过反弹实施的间接攻击]


    ##### 1.3.2.2.2 响应攻击


    攻击者向服务器发送请求，其方式是将响应发送到第三台计算机，如[图 1.3]所示。攻击涉及第三台计算机，因为它接收了它未请求的响应，这种响应可能会引入错误、抑制其功能、迫使其做出不当反应，甚至导致其退出服务。


    ![图 1.3. 通过响应实施的间接攻击]


    响应攻击必然通过一个不会本身被攻击的服务器进行，而反弹攻击则表现为两个链式攻击。


