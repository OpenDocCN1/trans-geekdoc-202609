    # Introduction


    Since antiquity, humans have sought security for themselves, reserving great importance
    for this need, an importance that is justified by the need to protect themselves
    against external factors.


    With the appearance of computing and its full expansion, the problem of security
    is evident: it is a new multifaceted problem that affects all areas of activity,
    users and equipment involved in the field of computing.


    Security includes numerous facets:


    * – The first facet concerns the energetic aspect. It consists of providing and
    maintaining the necessary energy for the proper functioning of the computer system.

    * – The second facet deals with the physical aspect. It consists of physically
    securing the location and material infrastructure of the computer system, such
    as the cable and wireless systems of communication, the intermediary equipment
    for interconnection, transmission and security (`repeaters`, `hubs`, `switches`,
    `routers`, `firewalls`, etc.), as well as terminal processing equipment for both
    workstations and servers. Physical security allows the computer system to be secured
    against natural factors, such as flooding and fires, and human factors, such as
    theft.

    * – The third facet is an aspect specific to computer security, contrary to the
    first two which are applicable to any industrial field that requires energy and
    ownership of critical materials. The objective of this facet is to resolve specific
    security problems related to computer technology, in order to guarantee secure
    use and prevent unauthorized access, on the one hand, and protect proprietary
    software and data against any unauthorized use, on the other hand.


    Even though no radical, ready-made security solutions exist, they continue to
    be developed. However, they always remain insufficient for resolving security
    problems. We are faced with a continuous battle between those responsible for
    security, on the one hand, and those who attack, hack and intrude, on the other
    hand.


    This battle manifests itself in the working groups on each side, which is the
    case for the group `Anonymous` and international organizations that take an interest
    in security.


    Attackers never cease to seek and identify faults, create appropriate means of
    attack to exploit the vulnerabilities in question and overcome the countermeasures
    that can sometimes be deployed.


    This challenge requires an investment from the other side that allows us to mobilize
    human material resources, in order to face attacks and diverse malicious actions
    that threaten the security of a computer system. Numerous approaches to security
    – organizational, intellectual, material and software – have been invented and
    continuously developed, both in quantity and quality, in recent years.


    Security constitutes a very important challenge, although it is neglected due
    to ignorance in most cases. Rising to this challenge is not a simple task because
    there is a lack of a radical solution or a clear and exact approach to its application.
    The only way to guarantee minimal security is through the combination of numerous
    social, cultural and technical measures. Nevertheless, these security measures
    remain dynamic and depend on the circumstances. We are faced with the need for
    a form of technological intelligence that allows the necessary modifications and
    corrections to be made continuously to the security rules in use.


    The intervention of experts and external parties is a valuable step of capital
    importance in the definition and evolution of security rules. This intervention
    can take the form of security audits that take place throughout a company, or
    a direct intervention by experts during consultations for `SMEs/SMIs` (Small and
    Medium Enterprises/Small and Medium Industries).


    Numerous general recommendations must be applied to guarantee the necessary minimum
    with respect to security:


    * – First, the security service or team must configure an organigram for the company,
    while allocating the head of this service or team, who must be responsible for
    the security policies.

    * – Second, the company must implement a security awareness program for all employees
    to minimize the risks associated with human error.

    * – Third, regular security audits should be conducted to identify and patch vulnerabilities
    before they can be exploited.

    * – Finally, a robust incident response plan must be developed and tested to ensure
    a quick recovery in the event of a security breach.

