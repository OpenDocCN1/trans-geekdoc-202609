- raw: 'Numerous variations of attacks continue to appear periodically. In fact, statistics
    have shown the volume of danger that threatens computer systems and the resulting
    material waste. Both of these aspects, without a doubt, make security a question
    of capital importance and an indispensable necessity.


    Faced with these problems, we must invest in security with the goal of creating
    a particular culture on the one hand and establishing technological solutions
    on the other. The former principally concerns the user of the computer, disregarding
    how the computer is being used or the user’s knowledge, whether gained through
    courses, trainings, forums, manuals or posters. The latter concerns the computer
    system itself, addressed by establishing security measures and technical solutions.


    The security of a computer system includes numerous aspects, from providing energy
    to physical control, and finally, the management of access and software security
    measures. It particularly concerns information and the entities who manipulate
    it. The latter, the most important and the area in which security usually gets
    simplified, can be classified into four points that must be satisfied to confirm
    whether a computer system is secure or not.


    ## 1.2. Reasons for security


    Computer security has taken prominence for many years now, following the massive
    evolution of computers and the socialization of their use. The reasons that favored
    the appearance of computer security as an important subject can be divided into
    two large subsections: the first is technical and related to services and the
    technology itself; the second is social and tied to the massive, diversified and
    generalized use of computers.


    ### 1.2.1. *Technical issues*


    The development of computing, despite its advantages, has been used maliciously
    to threaten security. Security was initially neglected, but became necessary to
    face fresh problems and avoid exploitation by hackers.


    #### 1.2.1.1. *Development of software engineering*


    Software engineering has experienced a great evolution marked by the use of numerous
    programming languages and development techniques that are integrated in the majority
    of software packages in one way or another; we can cite Microsoft Office as an
    example, as it allows a user to develop macros (the basis for the virus known
    as a macro-virus, that infects Office documents).


    Over time, users have acquired more and more expertise in programming. This massive
    development in programming opportunities and expertise has been exploited for
    dishonest ends, in certain cases to create attack software (analysis tools, scanning
    tools) or inject tools for intrusion (viruses, worms, etc.).


    Nowadays, attack tools are readily available on the Internet. They are accessible
    to end users and do not require any qualification from them for use. They take
    many forms (web applications, graphic applications, etc.). Additionally, an inexperienced
    user cannot distinguish them from legitimate applications and may launch them
    due to ignorance or negligence, jeopardizing the security of their own system.
    Numerous bad habits encourage this problem.


    #### 1.2.1.2. *Development of networks*


    We are experiencing a great development in the spread of networks, which encourages
    communication and information transfer. Such opportunities and services can be
    misused by intruders to attack or exchange suspicious information.


    The disadvantages caused by networks are the byproduct of two factors. The first
    is the massive use of networks in many areas, which allows everyone to be connected
    despite their many differences. The second concerns network technology itself,
    which is based on TCP/IP (Transmission Control Protocol and Internet Protocol),
    a protocol that despite its simplicity and efficiency, presents numerous faults
    insofar as it allows end users to access a large variety of tools and services.


    ###### Use


    Currently, we are in an era of revolution in computing and telecommunication technology.
    Information can cross from one end of the world to the other in a few fractions
    of a second thanks to the proliferation of networks, in which the Internet plays
    the most important role. Because of this, a computer is not isolated; it communicates
    with thousands of other computers every day and either explicitly or implicitly
    executes thousands of programs that could be malicious for its proper functioning.
    This danger is reinforced by the use of accessories, and especially external drives.


    Networks represent dangerous information highways, used by hackers and attack
    programs, and facilitate communication. Life in an isolated house is difficult,
    and the act of creating a road to it makes life easier, as well as attacks by
    robbers.


    ###### Technological uniformity (TCP/IP)


    The appearance and proliferation of the Internet favored the use of the TCP/IP
    family of protocols, even locally (Intranet). Insofar as the TCP/IP services and
    protocols are known by everyone, this implies the possibility of creating an attack
    that targets the known faults within TCP/IP. We are now seeing technological uniformity,
    and even though that is beneficial for the development of computing in general,
    it creates an opening that can be exploited by intruders, who can focus on developing
    attack tools that are specific to TCP/IP and useful in attacking any network node.


    TCP/IP was created for the American Department of Defense (DoD) during the Cold
    War. The objective at the time was to deploy a robust communication system that
    could work in critical circumstances, and even if it was partially deteriorated.
    The proposed solution was a system with “intelligence at the terminals”, which
    is contradictory to the principle of security, since it puts a large selection
    of functions within reach of end users. With the proliferation of the Internet,
    the problem of security became more and more imposing given the lack of a blanket
    solution.


    ### 1.2.2. *Social factors*


    Social factors are as important as technical factors, given that we are also seeing
    a virtual world with all of its own characteristics developed in parallel to the
    real world. A new jargon has been created, for example, cybercriminal, cyber-bullying,
    etc. – terms that reflect the problems and characteristics inherent to the virtual
    world and that take place in social networks in particular.


    We now speak of an information society marked by the proliferation of computing
    culture and the massive use of computers and mobile devices, which are considered
    banal tools accessible to everyone. In turn, this has generated an environment
    of connected objects (IoT and IoE). The absence of rules to manage it or security
    charters for companies to follow facilitates the spread of information: we can
    thus also speak of social engineering.


    #### 1.2.2.1. *Information society*


    With the proliferation and the expanded use of computers and the Internet, we
    are now part of an information society, outside of which no one can exist. The
    expression “information society” designates a society in which information technologies
    play a central role.


    #### 1.2.2.2. *Social engineering*


    The use of social engineering technology offers a way to extract confidential
    information from security directors and administrators.


    “Social engineering”, still called “psychological subversion” in French, is a
    practice that consists of taking advantage of one or several people’s trust with
    the principal objective of obtaining confidential information^([1](#c01.xhtml#fn1)).


    This attack can be carried out directly and in person, or through social networks
    and other means of communication. The victims are generally administrators of
    computer networks.


    ## 1.3. Security attacks


    There are two possible classifications of attacks. The first classification is
    based on the nature of the act itself (passive or active). The second classification
    is based on the means of attack (direct or indirect).'
