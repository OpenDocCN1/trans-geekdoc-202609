    ### 1.3.1. Passive/active classification of attacks


    The attacks that allow security to be question can be classified into two types:
    passive and active, depending on their impact and the degree of involvement in
    the communication process. We can also speak of reconnaissance attacks and access
    attacks.


    #### 1.3.1.1 Passive attack (reconnaissance attack)


    The passive attack, also called reconnaissance attack, consists of passively observing
    information or its characteristics, whether inside a computer or being transferred
    through a network. This attack can be led through family of sniffers or observers.
    These kinds of software are very easy to find on the Internet, and they allow,
    on one hand, the characteristics and configurations of systems and networks to
    be scanned by exploiting the many faults and on other hand, traffic to be analyzed
    so information can be extracted.


    The reconnaissance attack can be implemented through set of elementary actions:


    - initial request to the target;

    - sweep of the target;

    - scan for IP addresses;

    - scan for flaws;

    - exploitation of tools (appropriate sniffers).


    We can cite following sniffers by way example: `Wireshark`, `WinPcap`, `SiteSniffer`,
    `SocketSniffer`, `Packetetyzer`, `PacketViewer`, `CommView`.


    We can distinguish numerous scenarios:


    - users: this occurs when the identities of participants in a particular communication
    are discovered.

    - inter-message duration: this occurs when the frequency of messages is discovered,
    which allows the nature of the application to be identified (interactive, etc.).

    - information itself: this is the most serious kind of attack, the contents of
    communicated information.


    #### 1.3.1.2 Active attack (access attack)


    An active attack, also known as access attack, consists of acting upon information
    and/or the communication process, and is therefore more serious than passive attack.
    It involves the modification of data or messages, entering the network equipment
    or perturbing the proper functioning of the system.


    The primary objectives in access attack include:


    - gathering data;

    - gaining access;

    - granting greater access privileges.


    We can distinguish different scenarios:


    - fraudulent connection: this occurs when a connection is established with a server
    without the right to connect. This connection allows the attacker to make changes
    as if they were the owner of the account. They can erase documents, change the
    configuration, etc.

    - denial of service: this occurs when one or more authorized users are prevented
    from accessing a service. It consists of attacking the server and making it offline,
    which paralyzes all access. This kind of attack is known as `DoS` (Denial of Service).
    We can also speak of `DDoS` (Distributed DoS), which is an attack that happens
    when principal computer manages to take control of numerous computers and uses
    them to attack victims so that they go offline.

    - message alteration: this consists of modifying the order of messages by capturing
    some of them before reinserting them later.

    - interruptions/delays in communication: this happens when hacker manages to stop
    a connection or delay message access and transmission.

    - modification/disclosure of message content: the most serious act, which consists
    of modifying or publicizing the content of sent messages.

    - port redirection: this consists of redirecting traffic in a general manner or
    redirecting a response, operation or command to a third-party, unauthorized computer.

    - man-in-the-middle: this is an attack that allows a third party to intercede
    between two entities in communication, without the latter being aware.

    - buffer overflow: this attack consists of exploiting the buffer capacity, possible
    in a weakly written language such as `C`, with the purpose of placing a well-chosen
    code within the memory and creating a system or network failure.

    - IP, MAC, DHCP spoofing: this attack allows the identity of an authorized computer
    (`IP address`, `MAC`) to be exploited for an attack or to redirect information.

    - loss of data: this represents the most expensive attack, given that once lost,
    data requires an enormous effort to be recuperated and restored to the same level,
    which is not efficient in the majority of cases and can cause very serious financial
    repercussions for a company. The points of vulnerability that can facilitate the
    loss of data are:


    - email access/non-secure webmail;

    - unchecked peripherals;

    - cloud storage;

    - detachable media;

    - inappropriate access check that does not satisfy the minimal requirement for
    security.


    ### 1.3.2 Direct/indirect classification of attacks


    On the Internet, an attack can directly target a victim with their own identity
    or resources, or can hide behind an intermediary, in some cases using the latter’s
    identity and/or resources.


    #### 1.3.2.1 Direct attack


    This is the simplest attack and also the easiest to detect. It consists of launching
    an attack request on a victim using their own identity (`IP address`, `MAC address`)
    and resources (`memory`, `CPU` and hard drive), as illustrated in [Figure 1.1](#fig-1).
    These have become more and more rare, with the most serious hackers seeking to
    hide themselves or gain further abilities, given that users have developed ways
    to detect attack connections that are launched directly.


    ![Figure 1.1. Direct attack]


    #### 1.3.2.2 Indirect attack


    This is the most complex attack and the most difficult to track. There are two
    kinds:


    - The first attack is by rebound, which refers to an intermediary computer that
    is used for its identity or resources in an attack.

    - The second attack is by response, which exploits a server as if it were an intermediary
    computer to attack a third one.


    ##### 1.3.2.2.1 Rebound


    The pirate tries to take control of the intermediary computer, which generally
    has better resources, as illustrated in [Figure 1.2]. It will be used to create
    a rebound such that the identity and the resources of the victim are used to attack
    their computer, so that the real attacker cannot be identified in any way. We
    speak of two attacks in a chain. New variations on attacks of this kind are based
    on three or more chain attacks, and in this scenario, we are dealing with two
    or more rebounds. The rebound is itself a victim, even though it is the starting
    point for the attack that targets the final victim.


    ![Figure 1.2. Indirect attack by rebound]


    ##### 1.3.2.2.2. Response


    The attacker sends a request to a server in such a way that they send the response
    to a third computer, as illustrated in [Figure 1.3]. The attack concerns the third
    computer insofar as it receives a response that it did not solicit and which can
    introduce an error, inhibit its functioning, oblige it to react through misconduct
    or even take it out of service.


    ![Figure 1.3. Indirect attack by responding]


    The attack by response is necessarily done through a server that will not be attacked
    itself, whereas the rebound attack manifests itself as two attacks in a chain.

