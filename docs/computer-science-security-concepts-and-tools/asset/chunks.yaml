    密码分析使用了许多基于语言统计特征的机制（例如，“ing”在英语文本中重复次数为 4%，“tion”在法语文本中重复次数为 2% 等），或基于信息中常用的句子和表达方式。目前，鉴于计算机的性能，它们可以被用于系统性的试错。


    黑客可以通过多种方式进行操作：


    * – 对密文提出假设，并利用手头对应的明文来解密另一段以相同方式加密的目标密文；

    * – 对特定文本进行加密，以确定所涉及加密技术的某些特征；

    * – 检查密文中字母的重复情况以寻找密钥。这是频率分析，一种针对单文字替换加密的攻击方法；

    * – 计算密文中字母重复的概率。这被称为碰撞分析；

    * – 将列表中的所有单词作为密钥进行测试。这是字典分析或暴力破解；

    * – 对加密方法的内部结构进行线性近似。这是线性密码分析；

    * – 稍微修改待加密文本的明文，并从统计角度分析加密方法的结构。这是差异密码分析；

    * – 结合后两种方法进行差分线性密码分析。


    ## 6.2.2.2 加密鲁棒性测量


    从理论上讲，只要有足够的时间材料，密码分析总能找到密文的明文。任何信息的保密期限都是有限的。加密算法的鲁棒性通过密码分析所需的时间衡量，该时间必须远高于信息的有效期（即信息必须保持保密的时间）。


    政治甚至军事信息具有理论上的有效期，因此产生了对某种加密技术的需求：这种技术的理论上所需的密码分析时间超过了相关信息的有效期，从而使任何加密消息的泄露毫无意义。


    ## 6.2.3 密码学的演进


    计算和传输技术的演进带来了新的挑战：机密性。加密似乎是这一挑战的解决方案。后者在整个历史过程中一直经历了演变。在接下来的章节中，我们将检查一些最重要的几代。


    ### 6.2.3.1 共享密钥算法


    这一代是最早开发的加密解决方案之一。一个很好的说明是建立一个字符与对应替换字符之间的对应表。该表必须对他人保密，以确保机密性。


    #### 原理


    它由选择一种如图 6.2 所示的算法组成，该算法在两个或多个人之间共享，并在相关方之间保持秘密。该算法既用于解密也用于加密。


    ![图 6.2. 共享密钥算法加密](img/fig6-2.jpg)


    图 6.2 共享密钥算法加密


    ### 局限性


    这种加密解决方案包含某些疏漏：


    * – 选择算法并评估其强度的困难；

    * – 算法共享的问题，这非常复杂因此难以记忆，且寿命很长，容易随着时间的推移而泄露。


    ### 6.2.3.2 共享对称密钥算法


    鉴于上一代确定的局限性，这一代应运而生。其想法是让密钥成为与用户选择的密码相关的哈希码。这种方法是密码学领域的一场革命，现在已经开发了许多此类算法。


    #### 原理


    使用前一种方法固有的问题促成了这种技术的出现，它由使用已知且经过仔细选择的算法，并将该算法的每次使用连接到一个由两个用户秘密且共享的密钥（例如凯撒密码中的步骤）组成。它用于加密和解密（对称性），如图
    6.3 所示。此类算法的示例包括 `DES`、`3DES` 和 `Blowfish`。


    ![图 6.3. 共享对称密钥加密。如需此图彩色版，请访问 www.iste.co.uk/zaidoun/computer.zip](img/fig6-3.jpg)


    图 6.3 共享对称密钥加密。如需此图彩色版，请访问 [www.iste.co.uk/zaidoun/computer.zip](http://www.iste.co.uk/zaidoun/computer.zip)


    #### 示例


    * – `DES`: 数据加密标准，自 1977 年起，使用 56 位密钥。

    * – `3DES`：`DES`的变体，使用三个不同密钥的三重复（`A-B-C` 168 位）或两个不同密钥（`A-B-A` 112 位）。

    * – `RC2`、`RC4`、`RC5`：这些使用高达 1024 位的密钥。

    * – `Blowfish`。

    * – `IDEA`: 数据加密算法。

    * – `AES`: 高级加密标准，自 2001 年起。


    #### 局限性


    这种技术也有局限性，但比第一种不极端：


    * – 密钥共享的问题，这有利于被发现并要求定期修改；


    ### 6.2.3.3 非对称密钥算法


    在前两代中，主要问题是共享（算法或密钥）。事实上，共享某物会创建一个矛盾的场景，因为共享会引发双方之间的怀疑。有必要找到一种完全消除共享需求的解决方案；这是通过使用基于密钥对而非单一密钥选择的算法实现的。


    #### 原理


    这种技术的开发是为了解决之前使用的共享问题，作为新一代的后续。每次使用都关联一对密钥（`k1` 和 `k2`），使得如果使用其中一个密钥加密，则只有第二个密钥可以解密，反之亦然：（`Dk1)
    = X` 和 `Dk2) = X`）。


    其想法是给每个用户提供一对密钥，其中一个被指定为私钥，另一个被指定为大家的公钥，如图 6.4 所示。


    ![图 6.4. 非对称密钥加密。如需此图彩色版，请访问 www.iste.co.uk/zaidoun/computer.zip](img/fig6-4.jpg)


    图 6.4 非对称密钥加密。如需此图彩色版，请访问 www.iste.co.uk/zaidoun/computer.zip


    #### 示例


    * – `RSA`: Rivest–Shamir–Adleman。该算法由 Ronald Rivest、Adi Shamir 和 Leonard Adleman
    在 1977 年描述。基于密钥对的使用，其中一个公钥用于加密（或验证），另一个私钥用于解密（或签名）机密数据。

    * – `DSA`: 数字签名算法。这是一种带有公钥的签名算法。私钥用于生成称为签名的数字值；公钥用于验证该签名。


    #### 局限性


    这种解决方案非常复杂，尽管它避免了共享问题。此外，还提出了关于公钥信任的问题。


    ### 6.2.4 证书概念


    证书为密钥分配问题提供了解决方案。证书是一种数字文档，确保公钥与相关人员或实体关联。它包含以下信息：


    * – 公钥；

    * – 所有者姓名；


