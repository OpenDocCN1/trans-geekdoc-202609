    bad structures or a bad division of labor and responsibilities among the participants.


    The second stage is devoted to physical security through a critique of physical
    access to computing system sites.


    #### 8.2.3.2. *Utilities and implementation*


    The discovery of organizational and physical vulnerabilities is done through appropriate
    questionnaires for management, agents and clients, covering various aspects.


    We can also use known models that offer a database of questionnaires related to
    many topics, and that can be adapted depending on the context of the audited company.
    This produces statistics and security indicators.


    There are two possible approaches: ascending and descending.


    *   – *Descending approach*: this is a systematic, complete approach, but takes
    a long time to implement.


    *   – *Ascending approach*: this is an intuitive, incomplete approach whose implementation
    is fast, but has certain oversights in terms of precision.


    ### 8.2.4. *Technical audit*


    Also called a low-level audit, this identifies technical vulnerabilities (in systems
    and networks). This part requires expertise from the auditors that covers multiple
    areas. There are several aspects that require auditing:


    *   – network topology;


    *   – system resistance;


    *   – servers;


    *   – connection equipment;


    *   – network applications;


    *   – SGBDs and databases;


    *   – messaging systems;


    *   – specific applications.


    #### 8.2.4.1. *Objectives*


    This is the most important part, providing an audit of systems and computer applications
    by finding technical vulnerabilities and faults, on the one hand, and formulating
    appropriate technical recommendations, on the other hand.


    A technical audit requires auditors with a minimum of expertise who will discuss
    issues with administrators and security managers by way of questionnaires and
    discussions, as well as the use of appropriate tools for systems, services and
    applications.


    The tools used vary depending on the context and importance of the computer service
    and its content in terms of equipment and deployed solutions, data traffic, services
    and functions provided.


    #### 8.2.4.2. *Implementation tools*


    Many computing tools can be used for a technical audit. The most appropriate tools
    are free software, the very same tools used by hackers and attackers.


    Examples of these tools are as follows:


    *   – *Nessus*: this is a tool that discovers security faults in a network or
    segment of network.


    *   – *NMAP*: this is a tool that identifies open doors in a network, sub-network
    or computer.


    *   – *LANguard*: this is a tool that detects patches, shares, open doors, unused
    user accounts and missing service packs.


    ### 8.2.5. *Intrusive test*


    This is a simulation of attacks that tests the strength of a computer system and
    its response to attacks. It consists of using attack tools and observing the way
    the system reacts. The intrusive test must be programmed carefully to avoid perturbing
    proper functioning.


    ### 8.2.6. *Audit methodologies*


    There are several audit methodologies that can be adapted during an audit.


    #### 8.2.6.1. *ISO 17799*


    Descended from the British BS 7799 norm, the ISO 17799 norm provides guidelines
    and recommendations for managing security^([1](#c08.xhtml#fn1)).


    The ISO 17799 norm thus offers a model for identifying and implementing solutions
    for the following risks:


    *   – *Security policy*: this writes and disseminates the company security policy.


    *   – *Security organization*: this defines roles and responsibilities, and also
    takes control of partners and outside activity.


    *   – *Asset classification and control*: this takes inventory of company assets
    and defines how critical they are and their associated risk.


    *   – *Personnel security*: this consists of hiring, training and security sensitivity
    training.


    *   – *Physical and environmental security*: this consists of security perimeters
    and an inventory of security equipment.


    *   – *Communication and operation management*: this consists of procedures in
    case of an accident, recovery plans, definition of service levels and recovery
    times.


    *   – *Access control*: this consists of establishing access controls at different
    levels (systems, networks, buildings, etc.).


    *   – *System development and maintenance*: this takes into account security notions
    in systems from conception to maintenance.


    *   – *Business continuity planning*: this consists of definitions of availability
    needs, recovery times and emergency exercises.


    *   – *Compliance*: this consists of respecting author rights, legislation and
    the rules of the company.


    #### 8.2.6.2. *MARION*


    The MARION method (acronym for the French equivalent of Methodology of Analysis
    of Computing Risks Oriented by Level) is an audit methodology that, as its name
    suggests, evaluates the level of security in a company (the risks) by way of moderated
    questionnaires that provide indicators in the form of notes on different topics
    related to security.


    The level of security is evaluated following 27 indicators divided into six themes,
    each given a score of 0 to 4, with level 3 being the level to reach if we are
    to have what is considered adequate security. The method is based on questionnaires
    focusing on precise areas. The questionnaires must allow vulnerabilities specific
    to the company in all areas of security to be evaluated.


    The group of indicators is evaluated using several hundreds of questions, whose
    responses are moderated (the moderations evolving along with the updates to the
    method).


    The themes are as follows:


    *   – organizational security;


    *   – physical security;


    *   – continuity;


    *   – computer organization;


    *   – computer security and use;


    *   – application security.


    #### 8.2.6.3. *MEHARI*


    MEHARI (acronym for the French equivalent of Harmonized Method of Risk Analysis)
    is derived from two other risk analysis methods, MARION and MELISA. This method
    was developed and kept in France by CLUSIF, the French Security Club for Information
    Systems. MEHARI is one of the most commonly used methods of risk analysis today.
    This method appears to be a veritable tool kit for computer system security, identifying
    risks within an organization in various ways. This tool kit is made up of several
    modules which, independently of the selected security method, provide in particular:


    *   – an analysis of security stakes (by describing the types of feared malfunctions),
    and a classification of resources and information following the three basic tenets
    of security: confidentiality, integrity and availability;


    *   – an audit of security services to evaluate the efficiency of each, its control
    and to summarize vulnerabilities;


    *   – an analysis of risky situations, providing an evaluation of possibilities
    and intrinsic impacts, as well as risk attenuation factors, and finally, an indicator
    of risk gravity.


    ## 8.3. Security policy demonstration


    A security policy, written and published, must be established in any organization
    making use of a large- or medium-sized computer system. It requires a test to
    validate and measure the requirements and the existing levels of security.


    ### 8.3.1. *Security test and evaluation*


    Tests and evaluations are a necessary first step before proceeding to the formulation
    of a security policy. Security tests take many forms and use diverse and targeted
    tools.


    #### 8.3.1.1. *Security test types*


    Security tests are used to verify the strength of a computer system and identify
    weaknesses and limits. These tests fall into the following categories:


    *   – penetration test;


    *   – network analysis;


    *   – vulnerability analysis;


    *   – password cracking;


    *   – examination of records;


    *   – integrity control;


    *   – virus detection.'
