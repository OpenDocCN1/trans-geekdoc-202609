- raw: 'In 1980, ARPANet was divided into two distinct networks, one was military
    (MILNET: Military Network, which would become the DDN: Defense Data Network) and
    the other was for universities (NFSNet: National Science Foundation Network),
    which the military left to the civilian sphere. The idea of the builders was to
    have decentralized computing.


    On January 1, 1983, ARPANet adopted TCP/IP, which would become the basis of the
    Internet, which underwent considerable evolutions before becoming integral to
    the industry; it brought with it the problem of security, which has become increasingly
    relevant.


    Academia was the seed in which the Internet developed. The problem of security
    began to appear there but given that the information being shared was not critical,
    it was not considered a subject of debate and research.


    The Internet developed considerably, which pushed the industry to adopt it widely
    as a means of communication. Given that people send critical information and that
    Internet users are ever more numerous, diverse and anonymous, the security problem
    has now become serious. At this stage, it has become impossible to backtrack;
    the Internet is an unavoidable necessity, and we must find security solutions.


    ### 2.2.3. *The Internet and the ability to analyze*


    Among the different security services, confidentiality stands out. It can be called
    into question by simple spyware targeting information as well as users. This act
    can be followed by an intervention that modifies the information or even the configuration.
    Spying and intervention can be accomplished with the right software.


    #### 2.2.3.1. *Scanning tools*


    Scanning tools are surveillance software covering the system and the network.
    They are tools that enable the identification of entities within a computing system
    or a network such as physical and electronic addresses, names, open ports, operating
    systems including patches and weaknesses, applications, registries, protocols
    used, interconnected equipment, and different configurations.


    There is a large panoply of scanning tools available on the Internet that can
    be easily downloaded and exploited by attackers and spies, which makes the act
    of scanning banal and easily within reach. This puts the security of systems and
    computer networks at risk, making access easier, which in turn allows the limits
    and weaknesses of systems and networks to be identified. This then puts hackers
    in a position to program and launch targeted attacks that exploit the observed
    vulnerabilities.


    A computer system exposed to scans will present a great weakness since it will
    be surveilled by attackers and network observers who can decide to act and call
    the configuration of the system and/or network into question.


    #### 2.2.3.2. *Analysis tools (sniffers)*


    These are tools that allow us to analyze and/or modify information about a computer
    system. The spied information can either reside on the computers or circulate
    through the network. There are two families of scanners: passive and active:


    *   – A *passive scanner* (for reconnaissance) limits itself to spying on information
    without stepping in to modify it. This is a passive attack.


    *   – An *active scanner* (for access) updates information, which allows errors
    to be introduced, the configuration to be changed, information to be lost, etc.


    As mentioned, on the Internet, there is a vast panoply of scanning software, both
    passive and active. These tools are easily accessed by attackers to observe traffic
    and saved information at network nodes, compromising it at times through unauthorized
    updates. Some of the sniffers available on the Internet are Wireshark, MSN Sniffer,
    ICQ Monitor Sniffer, Link Sniffer, EtherDetect, Jitbit Network, and EffeTech http
    Sniffer.


    ## 2.3. Weaknesses due to malware and intrusion tools


    Malware, or malicious software, sometimes called harmful software, is a program
    developed with the purpose of causing harm to a computer system without the consent
    of the user whose computer is infected.


    Currently, there is a wide array of this kind of software, of which a large part
    can be found on the Internet. Malware can be a virus, a worm, a Trojan horse,
    as well as other threats. We can distinguish spyware from key loggers and rootkits,
    etc.


    ### 2.3.1. *Viruses*


    These are the most well-known tools for direct intrusion. The real name given
    to this type of program is the self-replicating code, but by analogy with the
    field of medicine, the word “virus” has been given to it.


    The production of viruses has gradually increased over time. The first virus appeared
    in Pakistan and was created by the Amjed brothers in the 1980s, approximately.


    A virus can execute various actions, ranging from an undesirable message to reformatting
    the disk. It can update the configuration of systems or networks and even compromise
    systems, communication equipment and devices.


    #### 2.3.1.1. *Definition*


    A virus is a small program that self-replicates (copies itself) in order to infect
    other programs and cause the destruction of information.


    #### 2.3.1.2. *Characteristics*


    A virus has two intrinsic characteristics:


    *   – self-replication;


    *   – the destruction of information.


    The first characteristic reflects the capacity of a virus to copy itself from
    one place to another, to change repertoire, disk, computer, etc., without any
    intervention or external assistance.


    The second characteristic reflects the malicious capacity of this piece of code
    that causes data, programs, configurations, etc. to be compromised.


    A virus can gain other characteristics if it allows for a precisely defined behavior
    that acquires supplementary capacities, making it able to hide and resist system
    protections. We can distinguish two principal characteristics: mutation and polymorphism.


    ###### Mutation


    A virus is called a mutant if it creates numerous versions of itself (we speak
    of variants) that differ in their behavior, namely the messages shown the execution
    traces. Such a virus is difficult to verify since it changes in appearance without
    changing either form or action, which allows it to maintain its signature.


    ###### Polymorphism


    A virus is considered polymorphous if it exists in numerous forms and presents
    itself with numerous file formats (.exe, .bat, .sys). It is like a chameleon:
    it takes a form that blends with the repertoire where it exists. Such a characteristic
    allows the virus to change its signature, which makes the task of detection by
    appropriate systems increasingly difficult.


    #### 2.3.1.3. *Different forms*


    There are seven principal families of viruses:


    *   – *Joke*: this kind of virus makes nonsensical messages appear with the sole
    purpose of annoying the user.


    *   – *False alarm*: in this scenario, the virus displays alarm messages to announce
    non-existent security problems or virtual system problems.


    *   – *Test*: this type of virus allows certain critical information to be spied
    on and discovered by asking users questions.


    *   – *Macro*: in this scenario, we speak of macro-viruses, that is, viruses based
    on macros. It is a type of virus that is particular to Microsoft (Office) applications,
    occurring when a macro that destroys information and reproduces itself is created.


    *   – *Batch*: these are viruses in the form of batch files (.bat).


    *   – *Executable*: these are viruses in the form of executable files or dynamic
    libraries (.exe or .dll).


    *   – *System*: these are viruses in the form of system files (.sys or .vxd).


    #### 2.3.1.4. *Examples*^([1](#c02.xhtml#fn1))


    ##### 2.3.1.4.1. Klez


    The Klez virus, which appeared at the start of 2002, refers to new variants of
    the virus that keep appearing (Klez.e, Klez.g, Klez.h, Klez.i, Klez.k, etc.).
    It uses four modes of propagation:


    *   – the Web;


    *   – shared folders;


    *   – the weaknesses of Microsoft IIS servers;


    *   – the exchange of files.'
