  trans: '

    * `Capacity`（令牌）：作为资源标识符使用的令牌，拥有该令牌即意味着拥有该资源的访问权限。

    * `Path`（路径）：用于传输信息的传输通路。

    * `Cryptogram (ciphered text)`（密文）：通过使用加密获得的数据。结果数据的语义内容是不可理解的。


    密文可以重新插入到新的加密中以产生`superencryption`（超加密）。

    * `Plain text`（明文）：语义可理解的清晰数据。

    * `Confidentiality`（机密性）：信息的一种属性，即不提供给或共享未经授权的人、用户或进程。

    * `Identity document`（身份证明）：用于建立用户声明身份的传输数据。

    * `Cryptographic analysis`（密码分析）：对密码系统和/或其进出进行分析，以推导出秘密变量和/或敏感信息（包括`plain text`）。

    * `Value of the cryptographic check`（密码校验值）：通过对数据单元进行密码转换（参见`cryptography`）获得的信息。


    控制值可以通过一个或多个步骤获得，来自一个使用密钥和数据单元的数学函数。它允许我们验证数据单元的完整性。

    * `Cryptography`（密码学）：包括转换信息的原理、手段和方法的学科，其目标是隐藏其内容、防止其修改不被察觉和/或防止其未经授权的使用。


    密码学决定了加密和解密方法。针对密码学原理、手段和攻击被称为密码分析。

    * `Data integrity`（数据完整性）：保证数据未以未经授权的方式被修改或破坏的属性。

    * `Data source authentication`（数据源认证）：确认接收数据的源确实是所声明的源。

    * `Decryption`（解密）：可逆加密的反向操作。

    * `Denial of service`（拒绝服务）：授权用户无法访问资源，或为关键操作的处理引入延迟。

    * `Electronic signature`（电子签名）：添加到信息单元的数据，或对数据单元进行密码转换，允许接收者证明数据单元的来源和完整性，防止伪造（例如防止接收者伪造）。

    * `Encryption`（加密）：对数据进行密码转换（参见`cryptography`），产生`cryptogram`。


    加密可以是不可逆的。在这种情况下，相应的解密无法完成；哈希函数就是此类情况。

    * `End-to-end encryption`（端到端加密）：在源端内部或端点级别对数据进行`encryption`；相应的`decryption`只能在目的端内部或端点级别进行。

    * `Identity-based security policy`（基于身份的安全策略）：基于用户、一组用户或代表用户行为的实体的身份和/或属性的安全规则；这些规则也可以基于它们寻求访问的资源/对象的身份和/或属性。

    * `Key`（密钥）：一组用于`encryption`和`decryption`操作的符号。

    * `Key management`（密钥管理）：按照`security policy`对密钥进行产生、存储、分配、消除、存档和应用。

    * `Link encryption (link by link)`（链路加密）：对系统中每条链路进行`encryption`的特殊应用。


    链路加密意味着信息在通过中继实体时以明文形式呈现。

    * `Modification detection`（修改检测）：用于检测信息单元发生修改（无论是意外还是故意的）的机制。

    * `Dissembling`（伪装）：一个实体假装另一个实体。

    * `Notarization`（公证）：由安全的第三方保存数据，允许在日后验证其准确性（内容、来源、日期、交付）。

    * `Passive threat`（被动威胁）：在不修改系统状态的情况下，未经授权共享信息的威胁。

    * `Password`（密码）：机密认证信息，通常由字符链组成。

    * `Homologous entity authentication`（同源实体认证）：确认关联中的同源实体确实是声明的实体。

    * `Physical security`（物理安全）：为确保资源不受故意或意外威胁而采取的措施。

    * `Privacy`（隐私）：个人控制或处理与其相关的可能被收集或存储的信息权利，以及他们对于向谁以及共享这些信息的人的权利。


    鉴于此术语与隐私法有关，它可能不够精确，除非出于安全需求，否则应避免使用它。

    * `Repudiation`（否认）：实体之一通过完全或部分地否认参与交换的行为。

    * `Router control`（路由控制）：在路由过程中应用规则，以选择或避免某些网络。

    * `Rule-based security policy`（基于规则的安全策略）：基于用户、一组用户或代表用户行为的实体的身份和/或属性的安全规则。这些规则也可以基于它们寻求访问的资源/对象的身份和/或属性。

    * `Security audit`（安全审计）：对系统保存的活动进行独立审查和检查，以确保符合策略、检测安全漏洞并对控制建议适当的修改。

    * `Security audit record`（安全审计记录）：有助于安全审计的收集数据。

    * `Security certificate`（安全证书）：与资源相关的标记，用于命名或指定该资源的安全属性（资源可以是一个信息单元）。标记和/或与资源的关联可以是隐式的或显式的。

    * `Security policy`（安全策略）：用于提供安全的标准组。


    完整的安全策略涵盖了 OSI 之外的主题。

    * `Security service`（安全服务）：开放系统组提供的服务，保证系统和信息传输的安全。

    * `Selective protection of fields`（字段选择保护）：对发送消息中某些特定字段的保护。

    * `Sensitivity`（敏感性）：反映资源价值或重要性的特征，在某些情况下反映其脆弱性。

    * `Threat`（威胁）：对安全的潜在违反。

    * `Traffic analysis`（流量分析）：通过观察数据流（存在、不存在、数量、方向、频率）推断信息。

    * `Data flow confidentiality`（数据流机密性）：提供流量分析保护的机密性服务。

    * `Padding`（填充）：在数据单元产生寄生通信实例、寄生信息单元和/或寄生数据。

    * `Confidence functionality`（确认功能）：关于某些标准（如安全策略定义的标准）的预期功能。


    ## 1.7. 安全服务


    我们说的`security service`是指必须满足的安全需求。如果一个计算机系统满足了被称为安全服务的主要条件，则该系统被认为是安全的：


    * `authentication`（认证）：数据源；实体之间；

    * `confidentiality`（机密性）：数据的；流量的；

    * `integrity`（完整性）：数据的；流量的；

    * `non-repudiation`（不可否认性）：源的；接收者的；

    * `access control`（访问控制）；

    * `service availability`（服务可用性）；

    * `traceability`（可追溯性）。


    认证和完整性可以归类为“authenticity”（真实性）一术语。

    '
