    给定哈希函数 `H` 和一个非常大的整数 `n`，仅使用一个选定的根密码，就可以通过 `n+1` 次身份验证：


    - – 第一次验证是通过对根密码应用 `n` 次 `H` 函数后得到的密码完成的。

    - – 第二次验证是通过对根密码应用 `(n-1)` 次 `H` 函数得到的密码完成的。

    - – 等等。

    - – 第 `n` 次验证是通过对根密码仅应用一次 `H` 函数得到的密码完成的。

    - – 最后一次验证是使用根密码完成的。


