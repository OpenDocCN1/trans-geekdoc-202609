    ## 3.4. AAA service


    AAA is the acronym for authentication, authorization and accounting.


    *Authentication* is a function that allows an identity to be validated, with the
    objective of limiting access to a well-defined system. It responds to the question,
    “Who are you?”


    *Authorization* is a function that determines the services which an authenticated
    entity may access, again with the objective of limiting access rights. It responds
    to the question “What rights do you have?”


    *Accounting* is a function that allows all activity (access and completed tasks)
    to be recorded, with the objective of ensuring traceability for any possible subsequent
    analyses. It responds to the question “What have you done?”


    AAA can be configured locally or based on authentication data hosted on a remote
    server.


    ### 3.4.1. *Local AAA*


    Local AAA allows for only one function, which is authentication.


    AAA authentication in the local mode is composed of the following steps:


    *   – The user establishes a connection with the equipment.


    *   – The equipment asks the user for a username and a password, authenticating
    the user by verifying this in a local database.


    Local AAA authentication must be configured for smaller-sized networks. There
    are networks that allow one or two routers to provide access to a limited number
    of users. This method uses local usernames and passwords stored on a router. The
    system administrator must fill in the local security database by specifying the
    username and password profiles for each user who may log in.


    The local AAA method of authentication is similar to using the local connection
    command. AAA also provides a means for configuring the methods of recording authentication.


    #### 3.4.1.1. *Local AAA authentication configuration*


    On a Cisco router, AAA authentication in local mode consists of creating users,
    activating the AAA service and specifying the local database (case-sensitive)
    as a method for the default list of authentication logins:


    It is also possible to create a named authentication method using the local database
    plus the password “enable” and fixing the application field for this method (remote
    SSH access):


    The general syntax of the configuration for an authentication method is:


    The local methods that can be applied are:


    *   – *enable*: this consists of using the password “enable” for authentication;


    *   – *local*: this consists of using the local database of users for authentication;


    *   – *local-case*: this consists of using the local database of users (case-sensitive)
    for authentication;


    *   – *none*: no authentication used.


    On a Huawei router, the AAA authentication configuration in local mode consists
    of activating the AAA service, creating users, creating an authentication blueprint
    and specifying that it is in the local mode:


    This method of authentication can be used for remote access to equipment, for
    example, using:


    ### 3.4.2. *Server AAA*


    Server AAA authentication is composed of the following steps, as shown in [Figure
    3.4](#c03.xhtml#fig3-4):


    *   – The user establishes a connection with the equipment (1).


    *   – The equipment asks the user for a username and password (2).


    *   – The equipment transmits the username and password to a server (3).


