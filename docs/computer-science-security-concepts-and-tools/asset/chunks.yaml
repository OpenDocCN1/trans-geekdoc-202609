    ### 4.3.8. *Firewall examples*


    This section will present an example of a physical firewall and two examples of
    software firewalls.


    #### 4.3.8.1. *Cisco PIX*


    Cisco PIX (private internet exchange) is the box firewall from the company Cisco
    Systems.


    The range of Cisco PIX combines robust firewall and VPN functions as well as intelligent
    network services in one compact and reliable platform. Cisco PIX can be configured
    using either a console cable or via Web or Telnet access from the network. It
    is also possible to connect from a telephone line using a modem.


    #### 4.3.8.2. *Iptables*


    Iptables is a freely accessible software on Linux that a system administrator
    can use to configure chains and rules in the firewall of a central computer (which
    is made of Netfilter modules).


    Different programs are used depending on the selected protocol: Iptables is used
    for the IPv4 protocol, Ipt6tables for IPv6, Arptables for ARP (Address Resolution
    Protocol) or Ebtables for Ethernet frames.


    This type of modification must be restricted to system administrators. As a result,
    access to a root account is needed to use it. Other users are barred from using
    the program.


    On the majority of Linux versions, Iptables can be started with the command “/usr/sbin/iptables”;
    this is documented in the manual pages of iptables and ip6tables, which can be
    consulted via the commands “man iptables” or “man ip6tables”.


    Iptables is also frequently used to refer to low-level components (kernel level).
    X\_tables is the name of the central module, which is more general, and which
    contains the shared code for the four protocols. This is also the module that
    provides extension APIs. As a result, X\_tables refers to the entire firewall
    in general usage (IPv4, IPv6, arp, eb).


    #### 4.3.8.3. *ISA server*


    An ISA (Internet Security and Acceleration) Server is a Microsoft firewall; it
    is a company server firewall with extendable cache for the Web. It offers security
    functions by strategy, for the acceleration and management of network connections.
    ISA servers have two intertwined modes: a multi-level firewall server and a high-performance
    cache server for the Web. The firewall provides:


    *   – filtering by packet, circuit and application levels;


    *   – states analysis to examine the data going through the firewall;


    *   – control of the access strategy and traffic routing.


    The cache improves the performance of the network and the final user experience
    by storing frequently-used Web content. The firewall or cache services can be
    deployed separately on dedicated servers or integrated on one computer.


    #### 4.3.8.4. *Cisco ASA firewall*


    The Cisco Adaptive Security Appliance (ASA) provides a complete and tested firewall
    alternative. It offers superior upgrade possibilities, a large array of technological
    solutions and security that is both efficient and permanent, created to respond
    to the needs of a great variety of uses.


    ASA supports many services (routing, AAA, etc.) in addition to the firewall function.
    It makes use of a specific syntax, which is different from that used in other
    Cisco equipment. Moreover, ACLs in ASAs are defined and applied by using different
    commands from those used by routers.


    Cisco has recently started to sell different models of its firewall, for example:
    ASA 5505, ASA 5506-X, ASA 5512-X, ASA 5525-x, ASA 5555-X, etc. in addition to
    its ASA module in the form of a card that can be inserted into another compatible
    system.


    ASA can be used via different types of architecture and can make use of the Active
    Directory service from Microsoft. It can moreover be used to create a DMZ zone.


    ## 4.4. The concept of a DMZ


    DMZ is the acronym for a demilitarized zone. It is part of a local network containing
    services that are accessible to the outside, such as a Web service. It is a zone
    that is monitored but without the strong filtering of the rest of the more secure
    local network.


    The usefulness of the DMZ is to isolate the services that are visible outside
    of the rest of the network with the purpose of defining a different filtering
    policy with a stateful firewall filter. Any traffic initiated outside gets authorized
    for the DMZ and denied for the rest of the network; in the other direction, only
    the outgoing traffic from the secured part gets authorized.


    ### 4.4.1. *Implementation of topologies*


    There are two possible ways to create a DMZ topology. The first is done by creating
    the DMZ as a branch of the firewall. The second consists of demarcating a DMZ
    between two firewalls (internal and external).


    #### 4.4.1.1. *Topology with one firewall*


    The DMZ segment is attached to a branch of the LAN that is independent of the
    firewall (some firewalls come with a branch reserved for the DMZ).


    In the case where the firewall only allows one LAN entry, we opt for VLAN technology
    to separate the DMZ from the rest of the local network. We can also separate the
    secured area in numerous physical or virtual (VLAN) segments with the objective
    of defining different security policies. This is what happens, for example, when
    separating internal services from workstations.


    ![Figure 4.5. DMZ implementation with one firewall](images/fig4-5.jpg)


    **Figure 4.5.** *DMZ implementation with one firewall*'
