- raw: "The configuration of the HWTACACS server is done with the following commands:\n\
    \nThe activation of the HWTACACS authentication consists of creating an authentication\
    \ blueprint named AUTH-T and configuring the authentication protocol to use HWTACACS\
    \ authentication as the active mode of authentication:\n\n#### 3.4.2.3. *AAA server\
    \ authorization and accounting configuration*\n\nAuthorization is a means of granting\
    \ or denying authenticated users access to certain zones and programs on the network,\
    \ unlike authentication, which guarantees that a device or a final user is legitimate.\n\
    \nTACACS+/HWTACACS allows for the separation of authentication from authorization,\
    \ while RADIUS does not separate authentication from authorization.\n\nUnder Cisco,\
    \ the general syntax of the configuration of an authorization method is as follows:\n\
    \nAnd that of an accountability method is as follows:\n\nFor example, an authorization\
    \ and accounting method can be created using the following commands with the RADIUS\
    \ and TACACS+ protocols, respectively:\n\nUnder Huawei, the creation of an authorization\
    \ blueprint named AUTHORIZ-T is followed by the configuration of the authorization\
    \ protocol using HWTACACS authorization as the mode of authorization:\n\nThe creation\
    \ of an accounting blueprint named ACCT-R is followed by the authorization protocol\
    \ using the RADIUS authorization as the mode of authorization:\n\n## 3.5. Conclusion\n\
    \nAuthentication, whether it is local or through the network, must be done in\
    \ a secure manner by choosing a viable password and using techniques that avoid\
    \ sending the password in plain text.\n\nAuthentication is generally paired with\
    \ integrity. We speak of authenticity, which ensures both the identity of the\
    \ sender or generator, on the one hand, and the validity of the information sent\
    \ or generated, on the other.\n\nThe AAA service that we have discussed in this\
    \ chapter allows for access to different equipment and services to be managed\
    \ in a methodical and modular way, keeping track of all of these activities. The\
    \ configuration of these services on different equipment is a very important security\
    \ measure that is generally neglected by management in favor of limited and outdated\
    \ methods of authentication.\n\n# 4  \n\nTechniques and Tools for Controlling\
    \ Access, ACL and Firewalls\n\n## 4.1. Introduction\n\nNetwork traffic is always\
    \ increasing in large measure and making the load on routers moving information\
    \ around more and more difficult, and the quantity of data more and more voluminous.\
    \ Moreover, a large part of this information constitutes parasitic elements controlled\
    \ by hackers and unauthorized entities. The appropriate solution for this is to\
    \ filter traffic and only allow legitimate parties to communicate through a network,\
    \ which on the one hand limits the quantity of data processed, and on the other\
    \ hand, eliminates potential sources of attack. These filters can be configured\
    \ on routers and are named ACLs (access control lists).\n\nTo protect a critical\
    \ location (laboratory, control room, etc.) in a company, it must be isolated\
    \ and access to the location must be logged. In computing, measures for securing\
    \ a system are similar and are done through a firewall that allows it to be isolated\
    \ and for access to be tracked. A firewall is the most important security tool;\
    \ it is the key element in any security measure. Moreover, the principle of firewalling\
    \ and more specifically, filtering, is present in numerous security tools, and\
    \ here, in the network connection equipment (Router, Level 3 Switch) in the form\
    \ of ACLs.\n\n## 4.2. Access control list\n\nACL is the acronym for access control\
    \ list; it is a list of ordered filters called access control entry, which is\
    \ applied to traffic leaving or entering through the LAN/WAN interface of a router.\n\
    \nACLs allow packets to be filtered following the criteria defined by the user.\
    \ It ensures that packets are filtered as they enter or leave a router interface\
    \ depending on:\n\n*   – source IP;\n\n*   – destination IP;\n\n*   – source port;\n\
    \n*   – destination port;\n\n*   – protocol: IP, TCP, UDP, ICMP, etc.\n\nAn access\
    \ control list is a router configuration script that controls whether packets\
    \ and even frames are authorized or refused passage, following the criteria stipulated\
    \ in their header. They are also used to select the type of traffic to be analyzed,\
    \ transmitted or processed via other methods.\n\nWithin the router, only one ACL\
    \ can be defined per protocol, per interface and per direction:\n\n*   – protocol\
    \ (IPv4, IPv6);\n\n*   – interface (GigabitEthernet0/0, etc.);\n\n*   – direction\
    \ (incoming or outgoing traffic).\n\n### 4.2.1. *ACL classification*\n\nThere\
    \ are three possible classifications for ACLs, and these depend on the direction\
    \ of traffic being managed by the ACL, on the type of ACL itself (its structure\
    \ and complexity) and on the way the ACL is defined (numbered or named).\n\n####\
    \ 4.2.1.1. *Incoming/outgoing ACL*\n\nAccess control lists can apply to incoming\
    \ or outgoing traffic.\n\n*   – *Incoming access control lists*: incoming packets\
    \ are processed before being routed to the outgoing interface. An incoming access\
    \ control list is efficient because it reduces the routing load in case the packet\
    \ is abandoned. If the packet is authorized after the tests, it is routed.\n\n\
    *   – *Outgoing access control lists*: incoming packets are routed to the outgoing\
    \ interface and then processed via the outgoing access list.\n\n#### 4.2.1.2.\
    \ *Standard/extended ACL*\n\nThere are two principal ACLs, defined by the criteria\
    \ which used to control routing. We distinguish:\n\n*   – *Standard access control\
    \ lists*: these allow filters based only on IP sources. Basic nomenclature is\
    \ used for Huawei equipment.\n\n*   – *Extended access control lists*: these allow\
    \ filters based on almost any field in IP, TCP and UDP headers. Advanced nomenclature\
    \ is used for Huawei equipment.\n\nFor Huawei routers, it is also possible to\
    \ define ACLs according to the MAC address; this is a layer 2 ACL.\n\n#### 4.2.1.3.\
    \ *Numbered/named ACL*\n\nIn an ACL definition, a name can be given to it, or\
    \ a number can be given instead. We distinguish:\n\n*   – *Numbered ACL*: the\
    \ ACL is identified by a number chosen while defining it.\n\nFor Cisco, the number\
    \ allows the type of ACL to be identified as follows:\n\n*   \\- (1–99) and (1300–1999):\
    \ standard IP access control list;\n\n*   \\- (100–199) and (2000–2699): extended\
    \ IP access control list.\n\nFor Huawei, the number allows the type of ACL to\
    \ be identified as follows:\n\n*   \\- 2000–2999: basic IP access control list;\n\
    \n*   \\- 3000–3999: advanced access control list;\n\n*   \\- 4000–4999: layer\
    \ 2 access control list.\n\n*   – *Named ACL*: the ACL is identified by a name\
    \ chosen while defining it and by indicating the type (standard or extended):\
    \ \n\n    *   \\- names can include alphanumeric characters;\n\n    *   \\- it\
    \ is recommended that the name be written in capital letters;\n\n    *   \\- the\
    \ names cannot contain spaces or punctuation marks; they must begin with a letter;\n\
    \n    *   \\- entries in the access control list can be added or deleted.\n\n\
    ### 4.2.2. *ACL configuration in Cisco*\n\nAn access control list is a sequential\
    \ and ordered group of authorization or refusal instructions, called access control\
    \ entries (ACE).\n\nWhen network traffic crosses an interface configured with\
    \ an access control list, the router compares information figuring in the packet\
    \ to each rule in the ACL. The action specified by the first corresponding ACE\
    \ is applied to the packet in question.\n\n#### 4.2.2.1. *Generic mask*\n\nAn\
    \ IPv4 access control entry includes the use of a generic mask to filter IPv4\
    \ addresses.\n\nA generic mask takes the form of an IPv4 address, and the bits\
