- raw: 'Cisco ACI is an SDN solution that provides automation based on rules; the
    automation of the rules is extended to all workstations, including virtual computers,
    physical servers and containers.


    Cisco adopted the opposite approach to that of VMware: instead of taking intelligence
    from the equipment, this approach makes the equipment more intelligent.


    Cisco ACI allows a network administrator to create quality service models and
    to apply them to individual applications. If a certain application requires a
    superior bandwidth priority at any moment, as in a vocal system, a model can be
    created to assure this priority. The same model can then be used for all other
    applications with the same needs.


    As a result of this process of creating automated models, Cisco ACI creates an
    environment that has the same advantages as a network defined by traditional software,
    but with a completely different strategy.


    ## 7.3. IoT/IoE security


    Given that the IoT/IoE are continually evolving and represent the greater part
    of any computer system, they need to be secured with the objective of preventing
    any unauthorized use and neutralizing any attempt to infiltrate and attack services,
    applications and infrastructures.


    All of these characteristics present several challenges at every level, which
    makes it essential to have security via various techniques, both generic and specific.


    ### 7.3.1. *Sensor networks*


    In a world where everyone is connected, the number of connected objects is far
    greater – five or six times as many – than the number of people. Sensor networks
    are composed of objects and once they are appropriately programmed, they are capable
    of automating the evaluation of data (even in great quantities) and modifying
    processing processes. A good illustration of this is smart cities, which make
    use of the intelligence of sensors to automate a wide array of municipal services
    tied to traffic, parking, control of water, electric and gas consumption, and
    various other installations and infrastructures. We can also point to self-driving
    cars with different specific sensors, cameras, GPS and computer-assisted services.


    #### 7.3.1.1. *Characteristics and requirements of sensor networks*


    The Internet of Things (IoT) is the connection of millions of devices and smart
    sensors connected to the Internet. Sensor networks generate data, automate processing
    and need to be secured.


    The data generated by the IoT is very high in volume. For example, a self-driving
    car can generate 4,000 gigabytes (Go) of data per day, and a smart home can produce
    up to 1 Go of data per week.


    This data, stored and managed in the form of Big Data, poses problems in terms
    of management, security, redundancy, analytics and access.


    The IoT opens an entirely new world in which tasks that previously required human
    intervention can now be automated, notably tasks that must be carried out in dangerous
    conditions or repetitive tasks.


    #### 7.3.1.2. *Application domains for the IoT/IoE*


    The use of the IoT/IoE covers many areas of application, for example:


    *   – smart homes;


    *   – smart buildings;


    *   – smart factories;


    *   – smart cities;


    *   – smart networks (roads, electricity, water supply, sanitation, communication);


    *   – smart cars;


    *   – management of stores and services;


    *   – medical and surgical diagnostics;


    *   – autopiloting and monitoring of air and naval control.


    ### 7.3.2. *Security issues in the IoT*


    With the IoT/IoE spreading throughout the world, new and diverse security challenges
    have arisen that result in specific attacks which can be launched in these kinds
    of environments.


    #### 7.3.2.1. *Security challenges for the IoT*


    Sensor networks present specific challenges concerning the protection of devices
    connected to the IoT due to:


    *   – *the increase in the number of devices*: the number of interconnected sensors
    and smart devices increases in an exponential manner, which in turn increases
    the risk of attack;


    *   – *the diversification of device locations*: certain devices connected to
    the IoT can interact with the physical world;


    *   – *the difficulties of updates*: IoT devices with sensors can be found in
    faraway and/or inaccessible places, which makes interventions or configurations
    complicated;


    *   – *the use of wireless communication systems*: this technology facilitates
    access and thus makes attacks on sensors and IoT services more likely.


    The vulnerabilities of IoT networks vary from weak or non-existent authentication
    to integrated non-secured servers, and to applications with little security that
    allow hackers to break through access limitations with relative ease.


    A user can download web clients functioning on remote devices and systems or on
    the cloud in order to access and read email on IoT services and systems, which
    makes them vulnerable to the same attacks as any other computer.


    The use of many IoT devices over a long period of time – with old or outdated
    operating systems or misconfigurations having not been created following material
    and software security norms – make them vulnerable and the target of attacks,
    which constitutes a major challenge in security matters.


    #### 7.3.2.2. *Security attacks in the IoT*


    IoT attacks can be classified into various types as follows:


    *   – *peripheral-level attacks*: material vulnerabilities, physical vulnerabilities
    of constrained devices, vulnerabilities of micro-software;


    *   – *communication-level attacks*: IP, TCP, UDP and ICMP vulnerabilities;


    *   – *application-level attacks*: vulnerability of local applications, as well
    as web and cloud applications.


    The constrained devices are often placed in faraway places where it becomes hard
    to ensure physical security.


    The potential material vulnerabilities can include:


    *   – theft of the device;


    *   – physical damage to the device;


    *   – deactivation of the device and suppression of the energy source;


    *   – deactivation of the communication, disconnection of cables or other forms
    of disruption.


    The vulnerabilities of micro-software are:


    *   – default connection logins that are not updated. It is important that user
    names and passwords be modified to respond to strict criteria before connecting
    an IoT device to the Internet;


    *   – attacks by distributed denial-of-service (DDoS);


    *   – outdated micro-software that has not been fixed with a patch;


    *   – buffer overflow attacks;


    *   – installation of a backdoor.


    The most common TCP/IP attacks are:


    *   – *DoS attacks*: perpetrators try to prevent legitimate users from accessing
    information or services;


    *   – *DDoS attacks*: this is similar to a DoS attack, but includes a simultaneous
    and coordinated attack from numerous source computers;


    *   – *ICMP attacks*: perpetrators use echo ICMP (internet control message protocol)
    packets to discover sub-networks and hosts on a protected network to generate
    DoS overflow attacks and to modify the routing tables of hosts;


    *   – *address takeover attacks*: perpetrators put the source IP address in a
    packet to appear as a different source, tricking the destination by making it
    believe that the packet came from a legitimate source;


    *   – *man-in-the-middle attack (MITM)*: perpetrators place themselves between
    a source and a destination in order to watch, capture and control communication
    in a transparent manner. They can spy by only inspecting captured packets or modify
    the packets before passing them to their original destination;


    *   – *session diversion*: perpetrators only have access to the physical network
    so they use an MITM attack to command a valid token to help them access a web
    server.


    ### 7.3.3. *Blockchain: an IoT security solution*'
