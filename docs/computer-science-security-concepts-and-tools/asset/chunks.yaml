    \n# 6  \n\nTechniques and Tools for Encryption, IPSec and VPN\n\n## 6.1. Introduction\n\
    \nEncryption is a very old technique used to ensure the confidentiality of information\
    \ both locally and through a network. Since it appeared, it has undergone many\
    \ evolutions. Nevertheless, this technique does not escape every attempt at infiltration\
    \ by hackers. Its importance is measured by the time needed to crack the code.\n\
    \nEncryption, a branch of mathematics, is not linked to computer science. It has\
    \ been used for several centuries, either strictly in the context of war or during\
    \ the transmission of critical information. Historically, many events have occurred\
    \ and many plans have been foiled simply because a third party decoded an encryption,\
    \ as was the case in World War II, when defeats were caused by the interception\
    \ of the encryption mechanism.\n\nCurrently, encryption has become a necessity\
    \ and continues to play a role in all areas and fields of activity. It has become\
    \ a necessary and inevitable measure in the process of securing any activity.\n\
    \nNumerous encryption techniques have been developed and affect the TCP/IP inference\
    \ model in many ways; for example, SSL in application layers and IPSec in network\
    \ and transport layers. These techniques provide authentication and/or the confidentiality\
    \ of IP packets, or their content only.\n\nVPNs are a very widespread communication\
    \ solution because they offer two advantages: limited cost and strong security.\
    \ The use of VPNs continues to spread as an alternative solution for specialized\
    \ connections, and especially for communications that do not require a large bandwidth.\
    \ An example of this would be the interconnection of different agencies within\
    \ one company with multiple sites in different locations, working from home or\
    \ any other company access via the Internet.\n\nVPNs are a tunnel mode application\
    \ of IPSec or any other tunneling protocol, which allows encrypted information\
    \ that cannot be decrypted by a third party to be sent over the infrastructure\
    \ of a public network.\n\n## 6.2. Encryption techniques\n\nWith the appearance\
    \ of computing and the proliferation of network use, notable for the easy access\
    \ to information it provides, it is indeed possible to access information saved\
    \ on computers, as well as information that gets sent over the network without\
    \ any hindrance. Cryptography has been used for centuries to send critical information\
    \ between leaders and individuals, especially in circumstances of war.\n\nEncryption\
    \ is a security mechanism of capital importance. It ensures confidentiality and\
    \ prevents passive attacks.\n\nIt is summarized in [Figure 6.1](#c06.xhtml#fig6-1).\n\
    \n![Figure 6.1. Principles of encryption/decryption](images/fig6-1.jpg)\n\n[**Figure\
    \ 6.1.**](#c06.xhtml#ifig6-1) *Principles of encryption/decryption*\n\n*   – Encryption\
    \ is the act of obtaining a ciphered text from a plain text by using the necessary\
    \ tools. It is the modification of a plain text, making it incomprehensible to\
    \ a third party.\n\n*   – Decryption is the inverse operation, which is performed\
    \ using the necessary tools.\n\n### 6.2.1. *Basic principles of encryption*\n\n\
    Encryption consists of finding ways to obtain a cryptogram based on a text that\
    \ is to be secured. It is a reversible action so that the corresponding plain\
    \ text can be obtained during the decryption process.\n\nEncryption is based on\
    \ two, basic, complementary techniques; they can be applied numerous times one\
    \ after another to make the encryption stronger.\n\n#### 6.2.1.1. *Substitution*\n\
    \nThis is a primitive technique of manual mono-alphabetic substitution. It associates\
    \ each character with a different character. The two parties agree on this correspondence,\
    \ which needs to be formulated and memorized by both parties.\n\nEXAMPLE.–\n\n\
    | **A** || **B** || **C** || **D** || **E** || **F** || **G** || **H** || **I**\
    \ || **J** || **K** || **L** || **M** || **N** || **O** || **P** || **Q** || **R**\
