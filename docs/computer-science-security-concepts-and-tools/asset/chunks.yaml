- raw: 'Given H, a hash function, and n, a very large whole number, it is possible
    to be authenticated n+1 times by using just one chosen password root:


    *   – The first authentication is completed using a password arrived at by applying
    the H function n times to the root password.


    *   – The second authentication is completed using the password arrived at by
    applying the H function (n-1) times to the root password.


    *   – etc.


    *   – The nth authentication is completed using the password arrived at by applying
    the H function to the root password only once.


    *   – The last authentication is completed using the root password.


    ![Figure 3.3. Authentication by a one-time-use password](images/fig3-3.jpg)


    **Figure 3.3.** *Authentication by a one-time-use password*


    A network observer who has managed to obtain all of the passwords already used
    will not be able to use them for any fraudulent authentication or to determine
    the root password chosen by the user.


    #### 3.3.2.4. *Telnet and SSH*


    Telnet and SSH are two network protocols that are used to connect to a remote
    computer. We connect either to this system within a network using terminal emulators
    or on the Internet, controlling the system with remote commands.


    Telnet is a protocol to remotely access a server or some equipment (router, switch,
    etc.) whose password is sent as plain text through the network, giving a network
    user or a sniffer the possibility of capturing it and using it for potentially
    fraudulent activity.


    SSH, the acronym for secure shell, is a similar but more secure protocol insofar
    as the password cannot be captured via the network.


    With Cisco equipment, it is possible to limit remote access to the Telnet protocol
    using the following configuration:


    Remote access to the SSH protocol can be limited via the following configuration:


