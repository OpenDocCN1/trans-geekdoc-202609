    哈希值在某种程度上代表了一种签名，因为原始消息的任何变化都会产生不同的哈希值，这允许检测到对安全实体的任何更改，并因此确认其完整性。在许多可用哈希算法中，最重要的是
    `MD5`（16 字节）和 `SHA1`（20 字节）。


    ### 1.8.3. 访问检查


    访问检查是提供身份验证服务的机制。身份验证技术可以分为三大类，分别与持有物、对实体的认知或个人特征（生物识别、语音等）相关联。


    身份验证对于确保对任何服务的本地或远程访问是必要的；它是限制访问和识别责任的最好方法。


    最常用的身份验证技术是基于密码的。这种技术要求对密码的选择、寿命和使用施加限制条件，而密码是任何计算机系统的关键要素和核心要素。


    ### 1.8.4. 电子签名


    数字签名（有时称为电子签名）是一种机制，它类似于纸质文档上的手写签名，能够保证电子文档的完整性并验证其作者。数字签名机制必须：


    * – 允许文档阅读者识别签署的个人或公司；

    * – 保证文档在作者签名之时与阅读者查看之时之间没有被篡改过。


    ### 1.8.5. 公证


    电子公证是对电子文档演变过程中不同步骤的认证，其目的是：


    * – 保证双方交换的电子消息的内容、来源、日期和目的地；

    * – 安全地存档数字文档。


    电子公证允许电子交换的证据被验证和存储，并允许受信任的经过认证的第三方对其进行电子存储（就像公证员一样）。由于这种技术为监控和存档交易（无论发送还是接收）提供了不同的机制（数据的完整性、来源、日期和目的地），因此它提高了了交换和电子存储的安全性。


    ## 1.9. 良好实践


    可以通过良好的实践来确保计算机安全，这些实践可以减轻安全风险，并使攻击变得越来越困难。习惯和技术方面的良好实践包括：


    * – 制定一份书面安全策略；

    * – 对员工进行有关社会工程风险的培训，并制定通过电话、电子邮件甚至面对面验证其身份的策略；

    * – 对系统进行物理访问检查；

    * – 使用强密码并定期更换；

    * – 对敏感信息进行加密并用密码保护；

    * – 限制操作系统的连接权限；

    * – 开发安全设备和软件；

    * – 定期保存并测试保存的文档；

    * – 禁用未使用的服务和端口；

    * – 通过每周或每天安装补丁来保持更新，以避免缓冲区溢出和由于权限提升导致的攻击；

    * – 定期计划安全审计以测试网络和系统，并确保实施这些审计提出的建议。


    ## 1.10. 结论


    计算机安全目前被认为是此处讨论问题的解决方案，正如统计所示。弱点和漏洞众多且多样，涵盖了计算的每一个层面，从设备到软件，从基础设施和结构到用户和管理员。


    计算机安全允许我们涵盖许多领域，并规划组织、文化和技术解决方案，以为各种弱点和漏洞提供解决方案元素。


    安全的目标是确保计算机系统保持正常的运行状态，它涉及到多个外部和内部要点，涉及物理和软件、物质和人类等。


    严格意义上，计算机安全的技术方面可以归结为神奇术语 `ACID`，这是一个法语缩写，代表了要保证正常运行需要满足的四点：身份验证、机密性、完整性和 `Disponibilité`（即可用性）。但为了验证这些点，我们必须熟悉弱点和漏洞。


    1. Magali Jakusic – [www.securite.teamlog.com](http://www.securite.teamlog.com)

    2. [www.securite.teamlog.com](http://www.securite.teamlog.com)

    3. [www.securite.teamlog.com](http://www.securite.teamlog.com)


