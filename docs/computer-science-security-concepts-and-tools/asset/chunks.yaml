- raw: 'The purpose of organizational security is to try to validate structures and
    organizations responsible for security, including standby technological units,
    administrators and security agents. It also allows for the verification of investments
    in security within companies, including training sessions and steps towards creating
    the necessary security culture using charters, posters and management rules. Other
    points fall into this aspect of security, such as the rules on backup and the
    management of incidents that occur within the company.


    #### 1.5.2.2. *Infrastructure security*


    Infrastructure security covers numerous elements of security:


    *   – cables;


    *   – offices;


    *   – server location;


    *   – archive storage;


    *   – technical offices;


    *   – server cabinets;


    *   – calculation center;


    *   – home working sites.


    This aspect concerns the physical part. It tries to physically secure computer
    equipment and infrastructure, as well as their locations. With regard to the locations,
    the security policies depend on the importance and content of the different locations.
    Servers benefit from a specific security policy, given their importance for the
    entire computer system. The home working sites represent a weakness and require
    specific security measures that are not to be ignored.


    Physical security protects against natural and human factors and can be ensured
    through:


    *   – smoke detectors;


    *   – water detectors;


    *   – movement detectors;


    *   – surveillance cameras;


    *   – clocking-in systems (card, fingerprint, etc.).


    ### 1.5.3. *Software security*


    Software security concerns software and system assets that must be secured using
    passwords, limitations on access, electronic classification of documents depending
    on their importance and degree of confidentiality. This is the fundamental aspect
    of computer security and what it comes down to is defined by the OSI 2 (ISO 7498-2)
    norm.


    Security concerns any computer system (network, workstation, server, etc.), as
    well as operating systems and applications.


    #### 1.5.3.1. *Network security*


    Networks are the key element in the field of computing, and because of this, they
    are a potential target for attackers. This implies the need for a security investment
    allowing measures such as filtering, access checks and infrastructure protection
    to be taken.


    Different network devices are involved in security, as is the case with:


    *   – modems;


    *   – switches (VLAN, port security);


    *   – firewalls;


    *   – routers (ACL);


    *   – access points.


    Network security allows remote access to be limited to different segments and
    network devices.


    #### 1.5.3.2. *Systems security*


    Operating systems are the basic element of the software part of a computing system.
    Each operating system, however recent, contains vulnerabilities that can be used
    by attackers. Microsoft Windows systems in particular are a common target, given
    their widespread use.


    This aspect of security also concerns telephonic and fax standards because they
    can be used as an unauthorized pathway for disrupting security.


    #### 1.5.3.3. *Application security*


    Different software and applications are not above all criticism and cause numerous
    weaknesses that attackers are always able to identify, despite the patches that
    developers regularly provide to add the necessary correctives. Additionally, the
    attacks waged are specific to the software in question. Because of this, specific
    security precautions and preventions are necessary for different software. The
    classes of software that represent potential targets are:


    *   – web services;


    *   – email services;


    *   – data services.


    #### 1.5.3.4. *Data security*


    Even though software is of capital importance, the loss or alteration of data
    can have damaging effects on a computing system. It is therefore necessary to
    foresee the requisite security measures, typically a series of varied and complementary
    mechanisms, in order to protect data against unauthorized leaks or modifications.


    Statistics have shown that a large part of the damage caused by attacks is due
    to the loss of data. Data security includes numerous measures:


    *   – integrity control;


    *   – encryption;


    *   – data server redundancy;


    *   – database security;


    *   – data availability.


    ## 1.6. Normalization of security


    Security has become an important challenge, and in order to avoid any confusion
    or divergence, normalization is the solution; this requires defining the necessary
    terminology, as well as the different requirements and solutions.


    ### 1.6.1. *Fundamental issues and general presentation*


    In order to fix the issue of divergence and provide security with a solid and
    well-structured foundation, a standard has recently been created. It is the ISO
    7498-2:1989 norm, which is part 2 of the OSI model for security architecture^([3](#c01.xhtml#fn3)).
    The international norm was created by the ISO/TC 97 technical committee.


    The International Telecommunication Union (ITU) created the X.800 norm, providing
    a standard of security architecture for open systems.


    ### 1.6.2. *ISO 7498-2 norm*


    In order to address secure communications between open systems, the second part
    of the ISO 7498-2 was published in 1989. It:


    *   – gives a general description of security services and the associated mechanisms
    that can be provided by the reference model;


    *   – defines where services and mechanisms can be provided in the OSI architecture.


    Basic security services and mechanisms, and their appropriate locations are identified
    for every layer of the basic reference model. Moreover, architectural relationships
    between security services and mechanisms in the basic reference model are identified.
    Supplementary security measures can be necessary at endpoints, in installations
    and organizations. These measures are applicable in different contexts. Defining
    which security services are needed to take charge of these supplementary security
    measures lies outside of the field of application of this international norm.


    The OSI security functions only concern the visible aspects of a communication
    route that allows endpoints to complete secure transfers of information amongst
    themselves. OSI security does not deal with the necessary security measures within
    the endpoint systems, installations and organizations, except when these measures
    have an effect on the choice and placement of security systems that are visible
    in the OSI. These aspects of security can be normalized, but not within the framework
    of OSI norms.


    The current part of the ISO 7498 completes the concepts and principles defined
    in the ISO 7498-1, without modifying them. ISO 7498 provides the definitions of
    the following terms, which are applicable to the field of security:


    *   – *Vulnerability*: a weakness or deficiency of the system or network that
    can be exploited or not.


    *   – *Attack*: a malicious action allowing for the exploitation of a weakness.


    *   – *Access control*: a precaution taken against the unauthorized use of a resource;
    this includes the precautions taken against the use of a resource in an unauthorized
    way.


    *   – *Access control list*: a list of entities authorized to access a resource;
    this list includes access rights tied to the entities.


    *   – *Accountability*: a property guaranteeing that the actions of an entity
    cannot be attributed to anyone except that entity.


    *   – *Active threat*: the unauthorized and deliberate threat of modification
    to the state of the system.


    *   – *Authentication information*: the information used to establish the validity
    of a declared identity.


    *   – *Authentication exchange*: a mechanism whose purpose is to guarantee the
    identity of a user by information exchange.


    *   – *Authorization*: the attribution of rights, including the permission to
    access the access rights data.


    *   – *Availability*: a property of being available and usable on demand by an
    authorized entity.'
