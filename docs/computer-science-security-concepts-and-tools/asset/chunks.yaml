  trans: '


    这些类型的测试涵盖了不同的安全领域，其结果构成了计算机系统的清单，这将是定义和制定安全策略的起点。


    ### 8.3.1.2. 安全测试工具


    为了提供高效的评估，我们应该使用不同类型的免费软件，即黑客和攻击者使用的相同工具。


    最常用的工具包括：


    * – `Nmap/Zenmap`

    * – `SuperScan`

    * – `SIEM`

    * – `GFI LANguard`

    * – `Tripwire`

    * – `Nessus`

    * – `L0phtCrack`

    * – `Metaspoilt`


    #### Nmap/Zenmap


    `Nmap` 是 `Network Mapper` 的缩，是一种用于网络发现和安全审计的免费开源工具。许多系统和网络管理员也发现它对于某些任务有用，例如网络清单、服务更新的日历管理以及主机或服务的可用监控。`Nmap`
    以创新的方式使用原始 IP 数据包来确定网络上哪些主机可用、这些主机提供哪些服务（名称和应用版本）、它们使用什么操作系统（以及操作系统版本）、正在使用什么种包过滤器或防火墙以及数十种其他特征。它的设计目标是快速分析大型网络，但对于单个主机也效果非常好。`Nmap`
    适用于所有主要的计算机操作系统，并提供了适用于 Linux、Windows 和 Mac OS X 的官方二进制包。除了传统的命令行执行文件 `Nmap` 外，后续版本还包含一个高级图形界面和结果查看器（`Zenmap`）、用于数据传输、重定向和调试的灵活工具（`Ncat`）、用于比较分析结果的工具（`Ndiff`）以及生成包和响应分析的工具（`Nping`）。


    `Nmap` 具有以下特点：


    * – 灵活：它采用数十先进技术来映射充满 IP 过滤器、防火墙、路由器和其他障碍的网络。这包括分析端口（`TCP` 和 `UDP`）、检测操作系统、版本、ping
    扫描等多种机制。

    * – 强大：`Nmap` 已被用于分析拥有数十万台计算机的庞大网络。

    * – 可移植：支持大多数操作系统，即 Linux、Microsoft Windows、`FreeBSD`、`OpenBSD`、Solaris、`IRIX`、Mac
    OS X、HP-UX、NetBSD、Sun OS、Amiga 等。

    * – 简单：对于不希望从源码编译 `Nmap` 的用户，除了使用二进制文件的图形界面（GUI），还有传统的命令行版本。

    * – 免费：`Nmap` 项目的主要目标是帮助互联网变得更安全，并为管理员、审计员和黑客提供一种探索网络的先进工具。`Nmap` 可以免费下载，并附带完整的源代码，可以根据许可条款进行修改和分发。


    `Zenmap` 是安全扫描器 `Nmap` 的官方图形界面。它是一个免费开源的多平台应用程序（Linux、Windows、Mac OS X、`BSD` 等），让初学者能够轻松使用
    `Nmap`，同时为丰富的 `Nmap` 用户提供高级功能。常用的分析可以记录为配置文件以便重复执行。保存的分析结果可以相互比较，以查看它们的差异。


    #### GFI LANguard


    `GFI LANguard` 是一款获奖的网络分析和安全软件，被超过 20,000 个客户使用。`GFI LANguard` 分析网络和端口以以最小的管理成本检测并修复漏洞。


    任何网络管理员必须单独管理漏洞问题、补丁和审计，有时需要使用多个产品。通过 `GFI LANguard`，这三个漏洞的关键要素只需一个软件程序即可管理。


    `GFI LANguard` 提供了安装网络的完整映像，帮助轻松、高效地维护网络安全。


    #### Tripwire


    `Tripwire` 是一种完整性控制软件，确保计算机上的敏感文件在不创建警报的情况下被修改。为了实现这一点，该软件创建一个数据库（或针对简单情况的参考表），包含管理员希望监控的文件数字签名（哈希值）。在完整性控制阶段，`Tripwire`
    会重新计算每个被监控文件的数字签名，并验证该签名是否与创建数据库时计算的签名对应。如果两个签名不对应，`Tripwire` 将发送警报。


    监控的文件可以根据不同的重要程度进行分类。`Tripwire` 的配置可能相当复杂，因为文件和配置是加密的。文件修改后发送警报可以通过电子邮件发送。


    #### Nessus


    `Nessus` 是一种计算机安全工具。它会标记测试计算机上潜在或明显的弱点。这包括易受攻击的服务，这些攻击允许接管计算机、访问敏感信息以及拒绝服务。


    `Nessus` 适用于 Unix 和 Windows；其最后一个版本是 `8.4.0`，于 2019 年 5 月 14 日发布。


    它被用户和计算机系统管理员广泛使用通常由安全经理和审计员使用。


    `Nessus` 检测网络上的活动计算机，扫描开放端口，识别活动服务及其版本，然后尝试各种攻击。


    `Nessus` 分为两个部分：`nessusd` 是一个执行请求并与目标通信的守护进程（服务），而 `nessus` 是一个恢复数据并显示结果的客户端应用程序。


    这种划分方式是经典的做法，守护进程以高级权限（`root`）运行，而更复杂且容易产生漏洞的图形界面以非特权用户的身份运行。测试使用插件进行；某些用 `C`
    语言编译，但大多数用脚本语言 `NASL`（Nessus 攻击脚本语言）编写。`Nessus` 是一种网络安全扫描器，能够检测可以在本地利用的漏洞，还可以通过远程检测：


    * 识别 banner 中的版本号，但此过程仅限于一类特定的漏洞：只能在本地利用的网络服务漏洞；或


    * 获取被测试计算机上安装的软件或包列表，并将其与编辑发布的补丁进行对比。


