    Software that spies, or spyware, is malicious software that installs itself in
    a computer or mobile device with the purpose of collecting and transferring information
    about the environment in which it is installed, very often without the user knowing.
    The rise of this type of software is strongly tied to that of the Internet, which
    serves as its means for transmitting information.


    Spyware is software intended to discover the navigating habits of a user. Installed
    at the same time as smaller, free software downloaded off the Internet or received
    via email, spyware generally starts up with the computer and executes background
    tasks, appropriating a part of the system’s resources. Its essential function
    is to collect as much information as possible about the navigating habits (or
    even purchases) of the computer’s user in order to make a detailed user profile.


    Certain spyware uses `cookies` to collect data relative to certain users in the
    case where browsers allow such options to be activated.


    Profiles created in this way, without the knowledge of the user and thus without
    advanced permission, are then used to send targeted advertising (e.g. modifications
    to pages shown, the addition of links), or are even sold in the form of files
    containing qualified prospects for email campaigns.


    EXAMPLES.– `Adayairespy`, `AdwarePunisher`, `AdwareSheriff`, `AlphaCleaner`, `AVGold`,
    `BargainBuddy`, `BraveSentry`, `MalwareWipe`, `PestTrap`, `PSGuard`, `Quicknavigate.com`,
    `Security iGuard`, `Smitfraud`, `SpyAxe`, `SpyGuard`, `SpyHeal`, `SpySheriff`,
    `Spyware Soft Stop`, `Spyware Vanisher`, `SpywareQuake`, `SpywareSheriff`, `Startsearches.net`,
    `UpdateSearches.com`, `Virtual Maid`, `Win32.puper`, `WinHound`


    ### 2.3.7. Keylogger


    A keylogger is spyware or a peripheral that electronically spies on the user of
    a computer. The purpose of this tool is to spy on a user’s private computer use.


    A keylogger is a configuration in charge of saving the typed keys of a keyboard
    without the knowledge of the user.


    Certain keyloggers are capable of recording the URLs of pages visited, emails
    that have been viewed or sent, files that have been opened and at times can even
    create a video that retraces all computer activity.


    Insofar as keyloggers save all the keystrokes of a keyboard, they can be useful
    to people with illicit intentions, seeking the passwords of users at a workstation.
    This means that particular attention is therefore needed when using a computer
    that is not secure (an open access workstation at a company, a school or a public
    space).


    ### 2.3.8. Adware


    Adware is a type of malicious software that drowns a user in endless advertising
    windows that are potentially dangerous for the device. It allows its editor to
    generate advertising revenue and is generally installed along with different kinds
    of open-access software available for free download, and without the knowledge
    of the user.


    EXAMPLES.– `1ClickDownloader`, `4-you.net` Search, `7search`, `AnywhereMe Toolbar`,
    `Arcade Safari`, `Auto-Lyrics`, `AutoCompletePro Toolbar`, `BigSeekPro Toolbar`,
    `Blekko Search`, `Boby Lyrics`, `Bomlabio`, `Bonanza`, `BrandProfiles`, `Browse
    for the Cause`, `Browse to Save`, `BrowseBeyond`, `BrowseFox`, `BrowserSeek Search`,
    `Btosjs Info`, `Bubble Dock`, `Bueno Search`, `Buify`


    ### 2.3.9. Other malware


    In addition to the principal types of malware already presented, there are other
    examples:


    *   `Ransomware`: is malicious software that takes hostage.

    *   `Scareware`: this kind of malicious software exists.

    *   `Phishing`: is a technique used by fraudsters.

    *   `Rootkits`: also known as, is an ensemble of software that are the most serious
    and most complex tools.


    ### 2.3.10. Comparison of intrusion tools


    Intrusion tools present a diverse array of similarities; however, they have certain
    differences that are summarized in Table 2.2, which provides their intrinsic characteristics,
    the nature of each tool.


    ![Table 2.2. Comparison of intrusion tools](images/py3.jpg)


    ## 2.4. Conclusion


    Even though it is simple to set up, TCP/IP comes with numerous weaknesses; given
    its widespread use, it is necessary to invest in security in order to avoid or
    least minimize the problems presented.


    TCP/IP is vulnerable to scanning and analysis tools that are widely available
    on the Internet. The use of a scanning or analysis tool is a necessary step before
    proceeding to an attack.


    Such weaknesses facilitate both the propagation of and attacks by intrusion tools.
    Intrusion tools and malware are, in a general sense, attack programs created to
    perturb the proper functioning of a system. There are currently four families
    of intrusion tools (virus, Trojan horse, worm, software bomb), but hybrid intrusion
    tools can exist as well; these act according to the characteristics of numerous
    families at the same time and are the most serious and most complex.


    The development of software engineering has also facilitated the creation of spyware
    tools that are controlled by the intruder.


    # 3 Authentication Techniques and Tools


    ## 3.1. Introduction


    Authentication is the most fundamental aspect of security. It entails the definition
    of access rights and the identification of the source of an attack in the case
    of a problem. It allows access to various local and remote services to be controlled
    and limited.


    Authentication is accomplished through three possible techniques:


    1.  `I have`: is tied to the possession of an object that represents a proof of
    identity.

    2.  `I know`: is tied to the knowledge of a secret combination which is the password.

