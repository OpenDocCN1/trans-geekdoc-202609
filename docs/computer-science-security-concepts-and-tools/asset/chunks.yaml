    ## 1.7. Security services


    By `security service`, we mean a security need that must be satisfied. A computer
    system is qualified as secure if it satisfies the principal conditions known as
    security services:


    * `authentication`: origin of data; between entities;

    * `confidentiality`: of data; of traffic;

    * `integrity`: of data; of traffic;

    * `non-repudiation`: of the origin; of the recipient;

    * `access control`;

    * `service availability`;

    * `traceability`.


    Authentication and integrity can be grouped together in the term authenticity.

