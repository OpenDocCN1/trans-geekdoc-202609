- raw: 'The configuration of the firewall appears as a list of different filters,
    both complex and complimentary, which means the appropriate action is not intuitive
    nor easy to identify. Such a characteristic requires a deeper analysis to be able
    to resolve the task of filtering a well-defined entity. This is the principal
    function of the engine.


    #### 4.3.3.3. *Configuration interface*


    This allows the administrator to choose appropriate filters. There are two types
    of interfaces, appearing as either text through an administrative console (CLI:
    command line interface) or graphics through a user-friendly graphic interface
    (GUI: graphic user interface). The first option requires an administrator with
    expertise.


    #### 4.3.3.4. *Filter database*


    This is a database that contains the configuration of the firewall. The filters
    are defined generically, and the engine is in charge of defining the order of
    priority going from the most specific to the most general. The action applied
    is determined from the entities in question, the circumstances and the general
    policy in use within the firewall.


    #### 4.3.3.5. *Logs*


    These are the records of access and access attempts saved by the firewall and
    any other event concerning the firewall. The records are archived (by system date
    and time) so the administrator can use them to identify a well-defined problem.


    ### 4.3.4. *How a firewall works*


    The interception pilot captures the entity (packet, application, etc.) and sends
    its characteristics (source, destination, etc.) to the engine, which determines
    the action (authorize, deny, etc.) by seeking the filter to apply to this entity.
    The group of applicable filters is chosen by the administrator during configuration.


    ![Figure 4.4. Firewall filtering](images/fig4-4.jpg)


    **Figure 4.4.** *Firewall filtering*


    ### 4.3.5. *Firewall classifications*


    There are two possible types of classification for firewalls. The first classification
    is according to the level of filtering with respect to the TCP/IP stack, and the
    second with respect to the field of action, that is, the part that needs to be
    secured by the firewall.


    #### 4.3.5.1. *Filtering by level of action*


    This classification responds to the question: at what level does the filtering
    occur?


    We speak of packet filtering or low-level filtering in the first case and applied
    filtering or high-level filtering in the other case.


    ###### Packet firewall


    In this class of firewalls, the entity that is to be filtered is the packet or
    sometimes the frame. It comes into play at levels 2, 3 and 4 of the OSI model.


    These are filtered with respect to:


    *   – physical source and destination addresses (@MAC);


    *   – logical source and destination addresses (@IP);


    *   – protocols used (IP, ICMP, TCP, UDP, SLIP, PPP, etc.);


    *   – source and destination port numbers, etc.


    ###### Application firewall


    In this class of firewalls, the entity that is to be filtered is the application.
    This comes into play at level 7 of the OSI model.


    Applications are filtered with respect to:


    *   – Web traffic (URL, keywords, cookies, etc.);


    *   – application rights (execution, network access, log access, disk access,
    etc.).


    #### 4.3.5.2. *Filtering by field of action*


    This classification responds to the question: what is the firewall securing?


    The first generations of firewalls were made to secure a network (Intranet) from
    the outside (Internet) given that the latter was considered the principal source
    of attacks. Over time, statistics have shown that 80% of attacks come from within.
    Firewalls that secure a computer appeared to be the solution.


    In order to avoid configuration difficulties related to PC firewalls, distributed
    firewalls were composed of agents and an administration server.


    ###### Classic firewall


    Any physical firewall that secures a network is considered a classic firewall.
    We also speak of box firewalls. This equipment is used between the local network
    to be protected and the external network (Internet), the potential source of attack.


    ###### PC firewall


    This is software that secures a computer and secures others from it. The reason
    for the existence of this new generation of firewalls comes from the fact that
    statistics have shown that 80% of attacks come from an internal source. The PC
    firewall is used as an antivirus in homes, and there are numerous versions available
    for free on the Internet.


    ###### Distributed firewall


    This is a recent network solution that secures different computers using a centralized
    configuration. There is a filtering agent for each computer that functions as
    a PC firewall and whose configuration comes from the central computer in charge
    of collecting the log. The administrator does not need to go computer-by-computer
    to reconfigure and analyze the log, nor do they have to leave this task to the
    user, who is not necessarily trained to do this.


    ### 4.3.6. *Stateful firewall*


    A stateful firewall is a firewall that provides filtering based on the state of
    the network connection. The objective is to secure the local network against any
    exterior access attempt (from the Internet). This function allows for a distinction
    between packets that are part of a response to an internal request (authorized)
    and a packet from a new connection initiated from the outside (denied). For this,
    the firewall inspects traffic initiated from the local network so it can know
    how to distinguish the response to an internal request from the rest of the entering
    traffic and determine which action should be applied.


    One possible implementation through a Cisco router (IOS updated to support the
    firewall) is based on ACLs. This is done by:


    *   – Choosing internal and external interfaces.


    For example, GigabitEthernet 0/0 for the internal interface; Serial 0/0/0 for
    the external interface.


    *   – Configuring the ACLs for each interface.


    For example, an ACL blocking entering traffic from any external interface:


    Or, for example, an ACL allowing authorized entering traffic from any external
    interface to be defined:


    *   – Defining the inspection rules.


    For example, creating an inspection rule:


    *   – Applying the inspection rule to an interface.


    For example, applying the inspection rule to entering traffic from any internal
    interface:


    ### 4.3.7. *Zone-based firewall*


    A ZPF, or zone-based policy firewall is a firewall that provides a flexible configuration
    that is independent of the ACLs and physical interfaces.


    #### 4.3.7.1. *General presentation of the notion of zones*


    This new type of configuration in which interfaces are attributed to security
    zones and the firewall strategy is applied to traffic circulating in these zones
    consists of:


    *   – determining zones;


    *   – establishing an inter-zone policy;


    *   – developing a physical infrastructure;


    *   – identifying subgroups within zones and combining traffic requirements.


    The Cisco IOS ZPF can take one of three actions:


    *   – *Inspect*: this allows the packets to be inspected with stateful Cisco IOS.


    *   – *Drop*: analogous to the command “deny” in an ACL, this deletes a packet.
    A daily log option is available to record rejected packets.


    *   – *Pass*: analogous to the command “permit” in an ACL, this authorizes a packet.
    The successful action does not follow the state of connections or sessions in
    the traffic.


    It is possible to create two or more zones, and a physical interface may or may
    not be affected by a zone; a specific zone called a self-zone corresponds to the
    router itself and contains all the IP addresses attributed to these interfaces.


    Once the security zones have been created, the administrator can create pairs
    of zones and then test the security for some or all of these pairs of zones.'
