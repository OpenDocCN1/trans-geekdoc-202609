- raw: "Software that spies, or spyware, is malicious software that installs itself\
    \ in a computer or mobile device with the purpose of collecting and transferring\
    \ information about the environment in which it is installed, very often without\
    \ the user knowing. The rise of this type of software is strongly tied to that\
    \ of the Internet, which serves as its means for transmitting information.\n\n\
    Spyware is software intended to discover the navigating habits of a user. Installed\
    \ at the same time as smaller, free software downloaded off the Internet or received\
    \ via email, spyware generally starts up with the computer and executes background\
    \ tasks, appropriating a part of the system’s resources. Its essential function\
    \ is to collect as much information as possible about the navigating habits (or\
    \ even purchases) of the computer’s user in order to make a detailed user profile.\n\
    \nCertain spyware uses cookies to collect data relative to certain users in the\
    \ case where browsers allow such options to be activated.\n\nProfiles created\
    \ in this way, without the knowledge of the user and thus without advanced permission,\
    \ are then used to send targeted advertising (e.g. modifications to pages shown,\
    \ the addition of links), or are even sold in the form of files containing qualified\
    \ prospects for email campaigns.\n\nEXAMPLES.– Adayairespy, AdwarePunisher, AdwareSheriff,\
    \ AlphaCleaner, AVGold, BargainBuddy, BraveSentry, MalwareWipe, PestTrap, PSGuard,\
    \ [Quicknavigate.com](http://Quicknavigate.com), Security iGuard, Smitfraud, SpyAxe,\
    \ SpyGuard, SpyHeal, SpySheriff, Spyware Soft Stop, Spyware Vanisher, SpywareQuake,\
    \ SpywareSheriff, [Startsearches.net](http://Startsearches.net), [UpdateSearches.com](http://UpdateSearches.com),\
    \ Virtual Maid, Win32.puper, WinHound\n\n### 2.3.7. *Keylogger*\n\nA keylogger\
    \ is spyware or a peripheral that electronically spies on the user of a computer.\
    \ The purpose of this tool is to spy on a user’s private computer use.\n\nA keylogger\
    \ is a configuration in charge of saving the typed keys of a keyboard without\
    \ the knowledge of the user.\n\nCertain keyloggers are capable of recording the\
    \ URLs of pages visited, emails that have been viewed or sent, files that have\
    \ been opened and at times can even create a video that retraces all computer\
    \ activity.\n\nInsofar as keyloggers save all the keystrokes of a keyboard, they\
    \ can be useful to people with illicit intentions, seeking the passwords of users\
    \ at a workstation. This means that particular attention is therefore needed when\
    \ using a computer that is not secure (an open access workstation at a company,\
    \ a school or a public space).\n\n### 2.3.8. *Adware*\n\nAdware is a type of malicious\
    \ software that drowns a user in endless advertising windows that are potentially\
    \ dangerous for the device. It allows its editor to generate advertising revenue\
    \ and is generally installed along with different kinds of open-access software\
    \ available for free download, and without the knowledge of the user.\n\nEXAMPLES.–\
    \ 1ClickDownloader, [4-you.net](http://4-you.net) Search, 7search, AnywhereMe\
    \ Toolbar, Arcade Safari, Auto-Lyrics, AutoCompletePro Toolbar, BigSeekPro Toolbar,\
    \ Blekko Search, Boby Lyrics, Bomlabio, Bonanza, BrandProfiles, Browse for the\
    \ Cause, Browse to Save, BrowseBeyond, BrowseFox, BrowserSeek Search, Btosjs Info,\
    \ Bubble Dock, Bueno Search, Buify, BuscaID Search, BuumpMe, Buzzdock, BuzzSearch,\
    \ Certified Toolbar, ChatZum, Clickorati, Conduit Search, ContinueToSave, CoolLyrics,\
    \ Coupon Alert Toolbar, Coupon Cactus, Coupon Caddy, Coupon Chaser, Coupon Companion,\
    \ Coupon Genie, Coupon Locker, Coupon Matcher, Coupon Pigeon, Coupon Printer,\
    \ Coupon Samurai, Coupon Server, Coupon Slider, Findwide Search, First Address\
    \ Bar, Gigantic Savings, Ginyas Companion, Glarysoft Toolbar, Glindorus, GlobaSearch,\
    \ Goong Search, GoOnSearch, Govome Search, GreyGray, Guffins Toolbar, Hot Search\
    \ Toolbar, Hotspot Shield, Ievbz Search, iLivid Search, Illoxum, iMesh Toolbar,\
    \ IMinent Toolbar, Infomash Search, Kozaka, Lyrics Bot, Lyrics-Fan, LyricsSing,\
    \ Nav-Links, Oyodomo.\n\n### 2.3.9. *Other malware*\n\nIn addition to the principal\
    \ types of malware already presented here, there are other examples of this kind\
    \ of malicious software that are always evolving and appearing as new types.\n\
    \n*   – *Ransomware*: ransom software, ransomware or extortion software is malicious\
    \ software that takes hostage of personal information and/or systems. The release\
    \ of this data/system depends on the payment of a sum of money (usually in bitcoin)\
    \ called a ransom.\n\n*   – *Scareware*: part of a class of malicious software\
    \ that includes fake security software, ransomware and other fraudulent software\
    \ that suggests paying to download fake software.\n\n*   – *Phishing*: also known\
    \ as swindling, this is a technique used by fraudsters to obtain personal information\
    \ with the objective of stealing an identity.\n\n*   – *Rootkits*: also called\
    \ an “activity dissimulator tool”, “furtive malware”, or even a “hacker’s administrator\
    \ toolkit” and sometimes a “kit”, is an ensemble of techniques implemented by\
    \ one or more pieces of software, with the objective of obtaining and prolonging\
    \ (usually unauthorized) access to a computer in the most furtive way possible.\n\
    \n### 2.3.10. *Comparison of intrusion tools*\n\nIntrusion tools present a diverse\
    \ array of similarities; however, they have certain differences that are summarized\
    \ in [Table 2.2](#c02.xhtml#tab2-2), which provides their intrinsic characteristics,\
    \ the nature of the action in question and the symptoms of each tool.\n\n![Table\
    \ 2.2. Comparison of different intrusion tools](images/py3.jpg)\n\n[**Table 2.2.**](#c02.xhtml#itab2-2)\
    \ *Comparison of different intrusion tools*\n\n## 2.4. Conclusion\n\nEven though\
    \ it is simple to set up, TCP/IP comes with numerous security weaknesses; given\
    \ its widespread use, it is necessary to invest in security in order to avoid\
    \ or at least minimize the problems presented.\n\nTCP/IP is vulnerable to scanning\
    \ and analysis tools that are widely available to end-users and exist in various\
    \ forms on the Internet. The use of a scanning or analysis tool is a necessary\
    \ step before proceeding to an attack.\n\nSuch weaknesses facilitate both the\
    \ propagation of and attacks by intrusion tools. Intrusion tools and malware are,\
    \ in a general sense, attack programs created to perturb the proper functioning\
    \ of a system. There are currently four families of intrusion tools (virus, Trojan\
    \ horse, worm, software bomb), but hybrid intrusion tools can exist as well; these\
    \ act according to the characteristics of numerous families at the same time and\
    \ are the most serious and most complex tools.\n\nThe development of software\
    \ engineering has also facilitated the creation of spyware tools that are controlled\
    \ by the intruder.\n\n1.  [1](#c02.xhtml#rfn1) [http://virus.wikidot.com](http://virus.wikidot.com).\n\
    \n# 3  \n\nAuthentication Techniques and Tools\n\n## 3.1. Introduction\n\nAuthentication\
    \ is the most fundamental aspect of security. It entails the definition of access\
    \ rights and the identification of the source of an attack in the case of a problem.\
    \ It allows access to various local and remote services to be controlled and limited.\
    \ Authentication is a key mechanism of security since it constitutes the first\
    \ barrier of security against potential attacks. The most important challenge\
    \ for an attacker with authentication is to find the password that allows them\
    \ to do what they want and thus compromise the system in question.\n\nAuthentication\
    \ is accomplished through three possible techniques:\n\n*   – The first technique,\
    \ called “I have”, is tied to the possession of an object that represents a proof\
    \ of identity. This is the case with a badge or a card. This technique is most\
    \ often used to ensure physical security and control access to critical locales.\n\
    \n*   – The second technique, called “I know”, is tied to the knowledge of a secret\
    \ combination which is the password. This is the most common method of providing\
    \ authentication for a computing system."
