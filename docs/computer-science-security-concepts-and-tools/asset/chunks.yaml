    The hash code represents a signature insofar, as any change in the original message
    provides a different hash code, which allows for the detection of any change to
    the secure entity, and consequently confirms its integrity. Of the many hash algorithms
    that are available, the most important are `MD5` (16 bytes) and `SHA1` (20 bytes).


    ### 1.8.3. Access check


    An access check is the mechanism allowing for the provision of an authentication
    service. Authentication techniques can be classified into three large families
    tied to possession, knowledge of an entity or personal characteristics (biometric,
    speech, etc.).


    Authentication is necessary to ensure local or distant access to any service;
    it is the best way to limit access and identify responsibilities.


    The most commonly used authentication technique is the one based on passwords.
    Such a technique requires that conditions be put on the choice, lifetime and usage
    of a password, which is the key element and a critical element of any computer
    system.


    ### 1.8.4. Electronic signature


    A digital signature (sometimes called an electronic signature) is a mechanism
    that guarantees the integrity of an electronic document and authenticates its
    author, by analogy with the handwritten signature on a paper document. A mechanism
    for digital signatures must:


    * – allow the reader of a document to identify the person or company that made
    the signature;

    * – guarantee that the document has not been altered between the moment when the
    author signed it and the moment when the reader looked at it.


    ### 1.8.5. Notarization


    Electronic notarization is the certification of different steps in the evolution
    of an electronic document, with the aim to:


    * – guarantee the contents, origin, date and destination of an electronic message
    between two parties in an exchange;

    * – securely archive digital documents.


    Electronic notarization allows evidence of electronic exchanges to be verified
    and stored, and for a trusted, certified third party to store them electronically
    (as with a notary). This technique improves the security of exchanges and electronic
    storage due to the fact that it offers different mechanisms for monitoring and
    archiving transactions, whether sent or received (integrity, origin, date and
    destination of data).


    ## 1.9. Good practices


    Computer security can be ensured through good practices that attenuate security
    risks and make attacks ever more difficult to carry out. Good practices in terms
    of habits and technology include:


    * – coming up with a written security policy;

    * – training employees with regard to social engineering risks and developing
    strategies to validate their identities over the phone, email, or even in person;

    * – physical access checks for systems;

    * – using strong passwords and changing them regularly;

    * – encrypting sensitive information and protecting it with passwords;

    * – limiting connection privileges to the operating system;

    * – developing security devices and software;

    * – saving documents and testing saved documents regularly;

    * – deactivating unused services and ports;

    * – keeping patches updated by installing them every week or every day, in order
    to avoid buffer overflow and attacks due to privilege escalation;

    * – periodically planning security audits to test the network and systems, and
    making sure to apply the recommendations that come from these.


    ## 1.10. Conclusion


    Computer security is currently considered as the solution to the problems discussed
    here, as illustrated by statistics. Weaknesses and vulnerabilities are numerous
    and varied, and they cover every level of computing, from devices to software,
    from infrastructures and structures to users and administrators.


    Computer security allows us to cover numerous fields and plan organizational,
    cultural and technical solutions, in order to give the elements of solutions for
    the varied weaknesses and vulnerabilities.


    Security, whose objective is to ensure a computer system remains in proper working
    order, touches upon several external and internal points, physically and in software,
    material and human, etc.


    The technical aspect of computer security in the strict sense comes down to the
    magic term `ACID`, a French acronym for the four points to satisfy if you want
    to guarantee proper functioning: authentication, confidentiality, integrity, and
    `Disponibilité` or availability. But in order to verify these points, we must
    be familiar with the weakness and vulnerabilities.


    1. Magali Jakusic – [www.securite.teamlog.com](http://www.securite.teamlog.com).

    2. [www.comptia.org](http://www.comptia.org).

    3. [http://www.iso.org](http://www.iso.org).


    # 2. Security Weaknesses


    ## 2.1. Introduction


    `TCP/IP` is the default norm that appeared as a normalization of something that
    already existed, `ARPA-Net`, without any modification or consideration of numerous
    points, and in this case, security measures.


    Moreover, given both its simplicity and the exponential development of the Internet,
    `TCP/IP` was most frequently used and established itself as the norm. Indeed,
    it is rare or even impossible for a computer engineer to find a norm other than
    `TCP/IP`.


    The history of `TCP/IP` is that of the Internet or even of its ancestor, `ARPANet`.
    The Internet, however, due to its history and the circumstances of its appearance,
    became the distributed solution. We speak of “intelligence at the limits”, and
    this is the principal reason behind all of the weaknesses discussed, given that
    advanced and complex functions are made available to the final user.


    The use of `TCP/IP` locally (Intranet) presents the same security weaknesses,
    or even more serious ones, given the restricted size and ease of information sharing.


    The considerable progress made in the field of computer engineering facilitated
    the appearance of malicious programs, or `malware`, and intrusion tools that allow
    information to be destroyed, configurations to be modified, the system to be put
    out of order, etc., whether directly or indirectly, by facilitating access to
    a computer or even by diminishing its resources.


    The physical and non-physical destruction caused by `malware` is always increasing,
    presenting repercussions on computing systems and requiring ever greater efforts
    and time for the restoration of proper functioning to systems after an attack.


    ## 2.2. Weakness in the TCP/IP


    `TCP/IP`, used widely, is a family of protocols that, given its history and through
    its very structure, is very vulnerable to attacks.


    ### 2.2.1. ARPANet, the ancestor of the Internet


    `ARPANet` is the acronym for Advanced Research Projects Agency Network, a private
    network used by the American army.


    `ARPANet` was developed in the context of the Cold War as a means of private communication
    for the `DoD`. At the time, the objective was to have a network that could work
    even if it was partially damaged by a possible attack. It was necessary to eliminate
    the centralization of communication, as was the case in other military strategies.


    `ARPANet` is, on the one hand, a private communication network that was entirely
    under the control of the American army, and, on the other hand, a distributed
    solution. The distribution was of both the functionality and the tools. There
    was no central controlling it; the only guarantee at the time was its private
    nature, which is no longer the case today due to the Internet, which has become
    an uncontrollable public communication network, the access to which cannot be
    managed nor limited by anyone.


    ### 2.2.2. The Internet and security problems


    The problem of security appeared with distribution, but it was neglected because
    all of the nodes in the `ARPANet` were under control.


    In 1974, `TCP/IP` was created to make the `ARPANet` uniform; the system is still
    in use today.

