    ### 7.2.3. *SDN components*


    The components of an SDN are divided into three layers, making up its architecture.


    The most important component is the SDN controller, which is part of the control
    layer. Other components are further divided into two layers, namely the nodes
    in the data layer and the advanced components in the application layer, which
    is the management layer.


    #### 7.2.3.1. *Network nodes*


    These components only provide the function of transmitting data, regardless of
    the routing function or the virtual control provided by the SDN controller.


    Packets are transmitted directly into the data layer based on the information
    contained in the FIB (forwarding information base) and the adjacency table, without
    having to resort to the control layer, which is in charge of updating the FIB
    in deferred time.


    #### 7.2.3.2. *SDN controller*


    This is a device in the SDN control layer that serves as a programmable automation
    point for managing, configuring and repairing physical and virtual network infrastructures.
    Thus, the centralized controller manages data flow, reinforces security and provides
    other services so that each node can be in charge of only transmitting data.


    The SDN controller, in which the intelligence of the network is centralized, is
    the brain of the SDN. One or more controllers can be configured. With just one
    controller, we speak of control being physically centralized, whereas with numerous
    controllers, control is physically distributed and, in this case, the controllers
    can function together (centralized software) or independently of each other and
    those with distributed software. It is also possible to have hybrid SDN controllers.


    An SDN controller can be configured differently, for example by using the web
    mode, CLI (command line interface) mode or an advanced programming language such
    as Python.


    #### 7.2.3.3. *High-level components*


    These components are necessary for executing scripts and programs that control
    the SDN controller so that the configuration can be updated and new security and
    optimization functions can be deployed.


    ### 7.2.4. *Security issues in SDNs*


    Because of its distinct architecture, the SDN faces different security challenges.
    It is affected by a variety of specific attacks.


    #### 7.2.4.1. *Security attacks in SDNs*


    The SDN can be the target of sniffing by hackers who exploit gathered information
    to launch access attacks such as DoS, called black hole attacks, or to use malicious
    codes, called wormhole attacks. The Sybil attack is triggered by adding entries
    to affect network traffic.


    Other attacks mainly exist on IoT platforms, such as jamming attacks caused by
    frequency interference and resource exhaustion attacks caused by excessive energy
    consumption.


    In another situation, an attacker can appear as a fraudulent neighbor who can
    trigger a malicious hello flood attack.


    #### 7.2.4.2. *Security challenges in SDNs*


    Given that the security issues identified for an SDN are different from those
    of the traditional network, the security challenges are not the same.


    First, data flow in the SDN is greater than in a traditional network. The control
    data is sent by SDN controllers in order to manage communication. If this data
    is sent in plain text via the network, it can be captured by hackers. This vulnerability
    is a big threat and poses a serious challenge.


    Second, it is necessary to provide an access control solution to filter the flow
    of data passing through different interfaces.


    Third, DoS and DDoS attacks must be attenuated to ensure SDN availability.


    Fourth, access must be limited by using appropriate security rules and access
    control systems.


    Finally, SDN controllers require security measures to provide adaptability, coherence
    and dependency. The placement and synchronization of the latter constitute a very
    important challenge.


    ### 7.2.5. *Security solutions for SDNs*


    Since this type of network is defined by software, security solutions generally
    take the form of software, which we call software-defined security (SDSec). Security
    solutions must be mainly based on the SDN controller, the brain of the setup,
    which must be highly secured via firewalls and IDS/IPS to attenuate the risks
    created by DoS and DDoS attacks. Access control systems, authentication systems,
    encryption and virtualization systems are distinguished from network functions
    and especially NFV (network function virtualization)


    In the SDN, numerous defense strategies can be used to apply security solutions
    and attenuate attacks:


    *   – a defense strategy based on rules is defined in a dynamic manner and uses
    system properties and network statistics;


    *   – an automatic learning defense strategy detects attacks and generates security
    rules;


    *   – a moving target defense strategy is defined by analogy with the honey pot
    technique or the DMZ in the security of traditional networks, making the surface
    of the attack unrecognizable to hackers;


    *   – a collaborative/distributed defense strategy shares cyber threats and plans
    a defense policy collaboratively.


    #### 7.2.5.1. *SDN security requirements*


    In SDN environments, security of the SDN must be ever-present. SDN security must
    be integrated in the architecture as well as provided as a service to protect
    the availability, integrity and confidentiality of all connected resources and
    information.


    Within the architecture, it is necessary to do the following.


    *   – Protect the controller: if the SDN controller is out of service (e.g. due
    to a DDoS attack), the network also disappears, which means the availability of
    the SDN controller must be maintained.


    *   – Investigate and remedy: when an incident occurs, it is important to determine
    what happened, fix it, report it, and build protection against it for the future.


    *   – Establish confidence: it is essential to protect communications throughout
    the network. This means that the SDN controller, the applications downloaded on
    it and the peripheral devices it manages must all be trusted entities that should
    work as they are meant to.


    *   – Secure access to the controller: given it is the centralized location for
    decision-making, access to the SDN controller must be strictly controlled.


    SDN security solutions will address at least one of the above challenges.


    #### 7.2.5.2. *Blockchain: an SDN security solution*


    Blockchain is a constantly growing list of records in the form of blocks. These
    blocks are connected and secured using cryptography. A blockchain uses the following
    elements:


    *   – digital signatures;


    *   – decentralized register;


    *   – an algorithm to reach a consensus;


    *   – each block contains the hash of the previous block, making a chain of blocks
    called the blockchain.


    This technique is an efficient and reliable solution for encrypting communication,
    principally via the Southbound interface, which is the principal artery of the
    SDN insofar as it carries control information generated by SDN controllers and
    applies it via the nodes of the infrastructure layer. In this way, it becomes
    impossible for hackers to capture control information and then either alter it
    in a fraudulent manner or attack the source, in this case the SDN controller,
    which is the brain of this technology.


    #### 7.2.5.3. *Cisco infrastructure based on applications (ACI)*


    Security in an SDN must be integrated from its conception and deployed for the
    automation of different services.


    Insofar as the SDN can offer reliable network services that are faster and easier
    to set up, manage and fix, the objective is to reduce the scale of time for threat,
    detection and response from days or weeks to minutes or hours, all the while maximizing
    the ability of the operator’s tools to react and attenuate.


    The solution offered by Cisco ACI (application centric infrastructure) is a framework
    in which the applications guide the behavior of the network^([1](#c07.xhtml#fn1)).'
