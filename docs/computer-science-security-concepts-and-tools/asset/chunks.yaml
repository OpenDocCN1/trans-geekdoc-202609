    Cryptoanalysis uses many mechanisms based on linguistic statistics (e.g. “ing”
    is repeated in 4% of an English text, “tion” is repeated in 2% of a French text,
    etc.), or on sentences and expressions that are commonly used in messages. Currently,
    given the power of computers, they can be used in systematic trial and error.


    A hacker can proceed in numerous ways:


    * – extract hypotheses about an encrypted text, for which the corresponding plain
    text is at hand to decode the encryption of another targeted text encrypted in
    the same way;

    * – encrypt a particular text in order to determine certain characteristics of
    the encryption technique in question;

    * – examine the repetitions of letters in the cryptogram in order to find the
    key. This is frequential analysis, an attack that targets the encryption via mono-alphabetic
    substitution;

    * – calculate the probability of repetitions of letters in the cryptogram. This
    is analysis by coincidence;

    * – test all of the words in a list as a key. This is dictionary analysis or brute
    force hacking;

    * – make a linear approximation of the internal structure of the encryption method.
    This is linear cryptoanalysis;

    * – slightly modify the plain text of a text for encryption and statistically
    analyze the structure of the encryption method. This is differential cryptoanalysis;

    * – combine the last two methods for differential-linear cryptoanalysis.


    ## 6.2.2.2 Measuring encryption robustness


    Cryptoanalysis theoretically always manages to find the plain text of an encrypted
    text, given sufficient time and material. Any information has a limited life span
    of confidentiality. The robustness of an encryption algorithm is measured by the
    time needed for cryptoanalysis, which must be well above the duration of validity
    of the information (the time during which the information must remain confidential).


    Political or even military information has a theoretical duration of validity,
    and because of this, a need arose for an encryption technique for which the theoretically
    necessary duration of cryptoanalysis surpasses the duration of validity for the
    information in question, making the exposure of any encrypted message pointless.


    ## 6.2.3 Evolution of cryptography


    The evolution of computing and transmission techniques created a new challenge:
    confidentiality. Encryption appears to be the solution to this challenge. The
    latter has always undergone evolutions throughout its history. In the following
    section, we will examine some of the most important generations.


    ### 6.2.3.1 Shared secret algorithm


    This generation was among the first encryption solutions to have been developed.
    A good illustration of this is to make a table of correspondence between characters
    and their replacement. This table must remain hidden from others to ensure confidentiality.


    #### Principle


    It consists of choosing an algorithm, as presented in [Figure 6.2](#c06.xhtml#fig6-2),
    shared between two or more people and which remains a secret among the relevant
    parties. This algorithm is used for both decryption and encryption.


    ![Figure 6.2. Encryption by shared secret algorithm](images/fig6-2.jpg)


    [Figure 6.2.](#c06.xhtml#ifig6-2) Encryption by shared secret algorithm


    ### Limits


    This encryption solution contains a certain number of oversights:


    * – the difficulty of choosing an algorithm and evaluating its strength;

    * – the problem of sharing the algorithm, something which is complex and thus
    difficult to memorize, and that has a long lifetime, which facilitates its disclosure
    over time.


    ### 6.2.3.2 Shared symmetrical key algorithm


    Given the limits identified regarding the previous generation, this generation
    has appeared in response. The idea is to have the key be a hash code associated
    with a password chosen by the user. This approach is a revolution in the field
    of cryptography, and numerous algorithms of this type have now been developed.


    #### Principle


    The problems inherent to the use of the preceding method favored the appearance
    of this technique, which consists of using known and carefully selected algorithms
    and connecting each use of this algorithm to a key that is secret and shared by
    both users (e.g. the step in the Caesar cipher). It is used for both the encryption
    and decryption (symmetry), as presented in [Figure 6.3](#c06.xhtml#fig6-3). Examples
    of this kind of algorithm include `DES`, `3DES` and `Blowfish`.


    ![Figure 6.3. Encryption by shared symmetrical key. For a color version of this
    figure, see www.iste.co.uk/zaidoun/computer.zip](images/fig6-3.jpg)


    [Figure 6.3.](#c06.xhtml#ifig6-3) Encryption by shared symmetrical key. For a
    color version of this figure, see [www.iste.co.uk/zaidoun/computer.zip](http://www.iste.co.uk/zaidoun/computer.zip)


    #### Examples


    * – `DES`: Data Encryption Standard, since 1977, uses a key with 56 bits.

    * – `3DES`: a variant of `DES` with three repetitions of three different keys
    (`A-B-C` 168 bits) or with two different keys (`A-B-A` 112 bits).

    * – `RC2`, `RC4`, `RC5`: these use keys up to 1,024 bits.

    * – `Blowfish`.

    * – `IDEA`: International Data Encryption Algorithm.

    * – `AES`: Advanced Encryption Standard, since 2001.


    #### Limits


    This technique also has limits, but these are less extreme than the first:


    * – the problem of sharing the key, which facilitates its discovery and demands
    it be periodically modified;


    ### 6.2.3.3 Asymmetrical key algorithms


    In the two previous generations, the major problem was that of sharing (the algorithm
    or the key). Indeed, sharing something creates a paradoxical scenario, given that
    sharing facilitates doubt between two parties. It became necessary to find a solution
    that completely eliminated the need to share; this was done with algorithms whose
    use was based on the choice of a pair of keys, rather than just one.


    #### Principle


    This technique was developed to resolve the problem of sharing, identified for
    previously used, as a follow-up to the new generation. A pair of keys (`k1` and
    `k2`) is associated with each use, such that if one key is used to encrypt, only
    the second key can decrypt, and vice versa: (`D[k1](E[k2](X)) = X` and `D[k2](E[k1](X))
    = X`).


    The idea consists of giving each user a pair of keys, one of which is designated
    as the secret, private key and the other is designated as the public key for everyone,
    as shown in [Figure 6.4](#c06.xhtml#fig6-4).


    ![Figure 6.4. Encryption by asymmetrical keys. For a color version of this figure,
    see www.iste.co.uk/zaidoun/computer.zip](images/fig6-4.jpg)


    [Figure 6.4.](#c06.xhtml#ifig6-4) Encryption by asymmetrical keys. For a color
    version of this figure, see www.iste.co.uk/zaidoun/computer.zip


    #### Examples


    * – `RSA`: Rivest–Shamir–Adleman. This algorithm was described in 1977 by Ronald
    Rivest, Adi Shamir and Leonard Adleman. It is based on the use of a pair of keys
    made up of one public key for encrypting (respectively, verified) and one private
    key for decrypting (respectively, signed) confidential data.

    * – `DSA`: Digital Signature Algorithm. This is a signature algorithm with a public
    key. The private key is used to generate a digital value called a signature; the
    public key is used to verify this signature.


    #### Limits


    This solution is complex, even though it avoids the problem of sharing. Moreover,
    the issue of trust regarding the public key is raised.


    ### 6.2.4 The concept of certificates


    Certificates offer a solution to the problem of key distribution. A certificate
    is a digital document that provides assurance that a public key is associated
    with the relevant person or entity. It includes the following information:


    * – the public key;

    * – the owner’s name;

