    In the case of only one LAN branch, we have a unique physical segment containing
    all the internal equipment. We opt for software segmentation via `VLANs` (virtual
    local area network). There are three VLAN technologies.


    The VLAN technology using a physical port attributes each port of a switch to
    a `VLAN` (identified by its number). This is the simplest but most rigid option
    in the sense that a computer risks changing the virtual segment by changing the
    connection port.


    The VLAN technology using a `MAC address` offers security by port and assigns
    a fixed `MAC address` to each port. Otherwise, it learns and creates virtual segments
    (`DMZ`, etc.), which allows it to emulate a physical distribution of segments.


    [Table 4.3](#c04.xhtml#tab4-3) shows the general filtering policies applied by
    the firewall between the three segments and the Internet, each one with respect
    to the others.


    ![Table 4.3. Traffic filtering in DMZ implementation with one firewall](images/py2.jpg)


    [**Table 4.3.**](#c04.xhtml#itab4-3) *Traffic filtering in DMZ implementation
    with one firewall*


    #### 4.4.1.2. Topology with two firewalls


    The segment for the DMZ is demarcated between two firewalls, one external firewall
    that filters traffic between the Internet and the local network, and one internal
    firewall that filters the traffic in the secured part even more, which makes access
    to that part even more difficult (by passing via two firewalls).


    ![Figure 4.6. Firewall implementation with two firewalls](images/fig4-6.jpg)


    **Figure 4.6.** *Firewall implementation with two firewalls*


    ## 4.5 Conclusion


    Controlling access physically as well as virtually is a necessary security measure
    that reduces the risk of fraudulent access and allows all connections and connection
    attempts to be monitored. This is provided, as a software component, by `ACLs`
    and firewalls.


    `ACLs` are a primitive method of controlling and limiting network traffic. They
    provide a level of both physical and virtual security to the computing system.
    This offers diverse static and dynamic filtering functions at many levels. Although
    they are important and efficient, an evolution of this principle was developed
    using dedicated equipment called a firewall.


    Firewalls are an indispensable security solution for a company. The use of a physical
    firewall is necessary to secure company-wide remote access, while the use of virtual
    firewalls remains a necessary security measure to secure different servers and
    workstations, as well as the physical and virtual assets of a company. However,
    a firewall can never resolve the problem of security without being combined with
    other solutions, such as antivirus software and `IDS`.


    # 5 Techniques and Tools for Detecting Intrusions


    ## 5.1 Introduction


    Viruses are the most serious, widespread and well-known kind of intrusion. A large
    number of malwares, especially viruses, are produced every day. For this kind
    of problem, a protection tool is necessary, hence antiviruses have been developed
    as a specific security solution.


    Firewalls are a general security solution that limits the probability of attacks,
    whereas antiviruses are a specific security solution whose objective is to protect
    computers from the virus. However, these two solutions remain limited in guaranteeing
    the security of a computer system. Therefore, the use of an intrusion detection
    system is necessary to ensure security, as well as to overcome the insufficiencies
    of both the firewall and the antivirus. It is a more complex solution that uses
    diverse means to detect and disinfect intrusion tools.


    ## 5.2 Antivirus


    Firewalls are a general security solution that limits the probability of attacks,
    whereas antiviruses are a specific security solution whose objective is to protect
    computers from the virus. However, these two solutions remain limited in guaranteeing
    the security of a computer system. Therefore, the use of an intrusion detection
    system is necessary to ensure security, as well as to overcome the insufficiencies
    of both the firewall and the antivirus. It is a more complex solution that uses
    diverse means to detect and disinfect intrusion tools.


    ### 5.2.1 Functions of an antivirus


    An antivirus is software that detects, isolates and destroys:


    - **Detection**: It identifies viruses using various methods.

    - **Isolation**: It quarantines infected files to prevent the computer.

    - **Destruction**: It deletes files related to viruses.


    ### 5.2.2 Methods for detecting


    The first generations of antiviruses were limited to only known viruses, whereas
    they have become increasingly intelligent.


    #### 5.2.2.1 Detection of known viruses


    Known viruses can be detected using signatures. This is a function of the viral
    base.


    #### 5.2.2.2 Detection of unknown viruses


    The detection of unknown viruses is a difficult task, based on techniques:


    - **Behavioral analysis**: This involves detecting viruses based on their behavior.

    - **Integrity control**: This involves inspecting changes in programs.

    - **Multi-level generic detection**: This is a complicated technique based on
    signatures.


    ### 5.2.3 Actions taken by an antivirus


    Even though the use of an antivirus does not require expertise, it does require
    basic tasks:


    - **Analysis**: The user can explicitly request an analysis of the disk, external
    drive or a file.

    - **Updates**: The user must periodically download updates to include new viruses.


    ### 5.2.4 Antivirus components


    An antivirus is made up of four parts:


    - **Scanner**: Analyzes files on demand in a designated area of computer.

    - **Monitor**: Analyzes files briefly as they are accessed.

    - **Viral base**: A database composed of groups of signatures for different known
    viruses.

    - **Log**: Composed of records used to save the history, activities and actions.


    ### 5.2.5 Antivirus and firewall comparison


    An antivirus, which is a specific solution, can be compared with a firewall, which
    is a general solution, as presented in [Table 5.1](#c04.xhtml#tab4-3).


    ![Table 4.3. Traffic filtering in DMZ implementation with one firewall](images/py2.jpg)


    [**Table 4.3.**](#c04.xhtml#itab4-3) *Traffic filtering in DMZ implementation
    with one firewall*

