    | VPN || Virtual Private Network |\n\n# Introduction\n\nSince antiquity, humans\
    \ have sought security for themselves, reserving great importance for this need,\
    \ an importance that is justified by the need to protect themselves against external\
    \ factors.\n\nWith the appearance of computing and its full expansion, the problem\
    \ of security is evident: it is a new multifaceted problem that affects all areas\
    \ of activity, users and equipment involved in the field of computing.\n\nSecurity\
    \ includes numerous facets:\n\n*   – The first facet concerns the energetic aspect.\
    \ It consists of providing and maintaining the necessary energy for the proper\
    \ functioning of the computer system.\n\n*   – The second facet deals with the\
    \ physical aspect. It consists of physically securing the location and material\
    \ infrastructure of the computer system, such as the cable and wireless systems\
    \ of communication, the intermediary equipment for interconnection, transmission\
    \ and security (repeaters, hubs, switches, routers, firewalls, etc.), as well\
    \ as terminal processing equipment for both workstations and servers. Physical\
    \ security allows the computer system to be secured against natural factors, such\
    \ as flooding and fires, and human factors, such as theft.\n\n*   – The third\
    \ facet is an aspect specific to computer security, contrary to the first two\
    \ which are applicable to any industrial field that requires energy and ownership\
    \ of critical materials. The objective of this facet is to resolve specific security\
    \ problems related to computer technology, in order to guarantee secure use and\
    \ prevent unauthorized access, on the one hand, and protect proprietary software\
    \ and data against any unauthorized use, on the other hand.\n\nEven though no\
    \ radical, ready-made security solutions exist, they continue to be developed.\
    \ However, they always remain insufficient for resolving security problems. We\
    \ are faced with a continuous battle between those responsible for security, on\
    \ the one hand, and those who attack, hack and intrude, on the other hand.\n\n\
    This battle manifests itself in the working groups on each side, which is the\
    \ case for the group “Anonymous” and international organizations that take an\
    \ interest in security.\n\nAttackers never cease to seek and identify faults,\
    \ create appropriate means of attack to exploit the vulnerabilities in question\
    \ and overcome the countermeasures that can sometimes be deployed.\n\nThis challenge\
    \ requires an investment from the other side that allows us to mobilize human\
    \ material resources, in order to face attacks and diverse malicious actions that\
    \ threaten the security of a computer system. Numerous approaches to security\
    \ – organizational, intellectual, material and software – have been invented and\
    \ continuously developed, both in quantity and quality, in recent years.\n\nSecurity\
    \ constitutes a very important challenge, although it is neglected due to ignorance\
    \ in most cases. Rising to this challenge is not a simple task because there is\
    \ a lack of a radical solution or a clear and exact approach to its application.\
    \ The only way to guarantee minimal security is through the combination of numerous\
    \ social, cultural and technical measures. Nevertheless, these security measures\
    \ remain dynamic and depend on the circumstances. We are faced with the need for\
    \ a form of technological intelligence that allows the necessary modifications\
    \ and corrections to be made continuously to the security rules in use.\n\nThe\
    \ intervention of experts and external parties is a valuable step of capital importance\
    \ in the definition and evolution of security rules. This intervention can take\
    \ the form of security audits that take place throughout a company, or a direct\
    \ intervention by experts during consultations for SMEs/SMIs (Small and Medium\
    \ Enterprises/Small and Medium Industries).\n\nNumerous general recommendations\
    \ must be applied to guarantee the necessary minimum with respect to security:\n\
    \n*   – First, the security service or team must configure an organigram for the\
    \ company, while allocating the head of this service or team, who must have a\
    \ minimum level of knowledge in matters of security, with the necessary power\
    \ and logistical facilities for intervention.\n\n*   – Moreover, betting on the\
    \ ignorance of agents and users has never been a security measure. What is needed\
    \ is the establishment of a culture in matters of security through cycles of well-planned\
    \ training that addresses all personnel (managers and agents), on the one hand,\
    \ and the planning of charters and displays, on the other hand.\n\n*   – Finally,\
    \ we must apply the necessary technical security measures, depending on the company’s\
    \ software assets, by using the appropriate equipment and software, as well as\
    \ applying security measures. It should be pointed out that the latter recommendation,\
    \ although of capital importance, can be called into question and even be useless\
    \ if the first two recommendations are disregarded for one reason or another.\n\
    \nThe problem of security is not a purely professional concern that only involves\
    \ companies and institutions; it is first and foremost a social question that\
    \ concerns families and society in a general sense. Indeed, the use of software\
    \ and Internet access permeates society and presents many challenges, especially\
    \ for children who can access any information and be influenced by social networks\
    \ without any supervision from their parents. To rise to this challenge, whose\
    \ gravity is not negligible, two basic measures are necessary, cultural and technical,\
    \ through sensibility tasks in the home, schools and the media, in addition to\
    \ the development of appropriate parental control software.\n\nThis book presents\
    \ numerous subjects related to security:\n\n*   – First, the crux of the issue\
    \ of security will be identified, and its importance, as well as the pertinent\
    \ services and mechanisms will be detailed.\n\n*   – Then, security faults and\
    \ problems will be identified, including those that are cultural and human, as\
    \ well as the material and technical issues.\n\n*   – Next, security solutions\
    \ at a technical and organizational level, namely antivirus, firewalls, IDSs (Intrusion\
    \ Detection Systems), and different techniques to control access, authentication\
    \ and encryption, will be specified.\n\n*   – Moreover, the specific security\
    \ at the level of SDN (Software-Defined Networks) and IoT/IoE (Internet of Things/Internet\
    \ of Everything) sensor networks will be addressed by way of the specificity of\
    \ these technologies.\n\n*   – Finally, this work will be completed by a section\
    \ covering the management of security and, in particular, audit security, as well\
    \ as the establishment of security rules.\n\n# 1  \n\nGeneral Concepts in Security\n\
    \n## 1.1. Introduction\n\nThe recent massive evolutions in computing and communication\
    \ technology have produced certain side effects, namely security problems.\n\n\
    Indeed, the use of networks facilitates communication and likewise, the spread\
    \ of tools for attack and coordination among hackers. This is exactly the case\
    \ in the development of road networks and modes of transportation that cause problems\
    \ related to accidents and require investment in highway safety. Moreover, accumulated\
    \ expertise from the development of software has been exploited for the development\
    \ of malware.\n\nSecurity attacks can be classified in two ways. The first classification\
    \ is subdivided by the effect of the attack: either passive attacks, also called\
    \ reconnaissance attacks, which consist of observing and divulging information\
    \ via a third party, or active attacks, also known as access attacks, which are\
    \ characterized by malicious acts that create doubt over information, users and\
    \ communication channels. The second classification is subdivided by the means\
    \ of attack: a direct attack using one’s own resources and identity or an indirect\
    \ attack that passes through other intermediary computers."
