    特别是，它会影响在 Windows 95、98、Millennium、NT4、2000 和 XP 操作系统上运行 Microsoft Outlook 的用户，以及
    Microsoft Internet Explorer 的用户。


    Klez 病毒会获取存储在 Microsoft Outlook、Eudora 和即时消息软件（`ICQ`）中的联系人地址列表，然后使用其自己的 SMTP 服务器向所有接收者发送电子邮件。


    因此，Klez 病毒能够生成正文为空的邮件，其主题是从百个左右预定义主题中随机选择的，并向此邮件添加一个包含病毒变体的可执行附件。


    #### 2.3.1.4. Magistr


    Magistr 病毒是一种多态形蠕虫（即一种通过网络自我传播且其形式，更准确地说说是其特征会不断修改的病毒），它通过电子邮件进行传播。它特别影响在 Windows
    95、98、Millennium 和 2000 操作系统上使用 Microsoft Outlook、Eudora 和 Netscape 消息客户端的用户。


    Magistr 病毒会寻找系统中的联系人列表文件（Outlook 和 Eudora 客户端分别使用 `.WAB` 和 `.DBX`/`.MBX` 扩展名），以便选择消息的接收者。


    Magistr 蠕虫发送的消息的主题和正文是从受感染计算机驱动器上找到的文件随机摘取的。Magistr 病毒会在消息中添加自身的副本，文件名包含 `.com`、`.bat`、`.pif`、`.exe`
    或 `.vbs` 等扩展名（或双扩展名）。它还可能删除 CMOS、BIOS 或硬盘中包含的所有信息。


    因此，它可以对系统和存储在上面的信息造成严重破坏。此外，它能够通过 `WM_QUIT` 命令禁用个人防火墙 ZoneAlarm。


    #### 2.3.2. 蠕虫


    蠕虫是一种通过网络自我传播的入侵工具。它是一种网络病毒，其主要特征与它通过网络传播的方式有关。


    ##### 2.3.2.1. 影响


    目前，蠕虫主要通过电子邮件（特别是通过 Outlook 消息客户端）进行复制，这归功于附件中包含指令，这些指令训练联系人列表中的所有电子邮件地址被收集，以便向所有这些接收者发送副本。


    大多数情况下，这些蠕虫是脚本（通常为 `VBScript`）或作为附件发送的可执行文件，一旦接收者点击附件文件就会启动。


    ##### 2.3.2.2. 预防方法


    通过这种方式，所有可以被操作系统执行或解释的文件都可能感染计算机。通过对作为附件发送的文件保持怀疑态度，可以很容易保护自己免受蠕虫感染。


    特别包含以下扩展名的文件是潜在的感染源：


    386, ACE, ACM, ACV, ARC, ARJ, ASD, ASP, AVB, AX, BAT, BIN, BOO, BTM, CAB, CDR,
    CHM, CLA, CLASS, CMD, CNV, COM, CPL, CPT, CSC, CSS, DLL, DOC, DOT DRV, DVB, DWG,
    EML, EXE, FON, GMS, GVB, HLP, HTA, HTM, HTML, HTT, INF, INI, JS, JSE, LNK, MDB,
    MHT, MHTM, MHTML, MPD, MPP, MPT, MSG, MSI, MSO, NWS, OBD, OBJ, OBT, OBZ, OCX,
    OFT, OV?, PCI, PIF, PL, POT, PPT, PRC, PWZ, QPW, RAR, SBF, SCR, SH, SHB, SHS,
    SHTML, SHW, SMM, SYS, TAR.GZ, TD0, TGZ, TLB, TSK, TSP, TT6, VBE, VBS, VBX, VOM,
    VS?, VWP, VXE, VXD, WBK, WBT, WIZ, WK?, WPC, WPD, WML, WSC, WSH, XML, XLS, XLT,
    ZIP.


    在 Windows 下，建议禁用“隐藏已知类型的扩展名”功能，因为该功能可能会误导用户判断文件真实的扩展名。因此，扩展名为 `.jpg.vbs` 的文件可能会显示为扩展名为
    `.jpg` 的文件。


    #### 2.3.3. 垃圾邮件


    这是一种与电子邮件相关的入侵工具，以不受欢迎的消息的形式出现。


    垃圾邮件占电子邮件流量的约 90%，它由发送大量电子邮件（通常用于广告，也称为“垃圾邮件”）给大量未请求过此类广告的人，从而使邮件服务器和收件箱塞满无用的、未经请求且通常具有误导性的广告。垃圾邮件目前占全球流通邮件总量的近一半。


    自 2003 年以来进行的近期调查显示，垃圾邮件的传播占全球邮件总数的大部分。


    ##### 2.3.3.1. 影响


    垃圾邮件带来了许多影响：


    * – 浪费用户的时间（以及金钱），他们必须更频繁地整理邮件并清理收件箱；

    * – 在多条垃圾邮件中“隐藏”了重要消息的风险；

    * – 通过具有吸引力但显然虚假的报价“腐蚀”不知情的用户；

    * – 通过带有色情、政治或宗教广告的消息造成道德侵犯；

    * – 浪费网络带宽，它无意义地消耗带宽，垄占了带宽的大部分。


    ##### 2.3.3.2. 预防方法


    应对垃圾邮件应采取的适当措施是：


    * 不要回复垃圾邮件（不要威胁它们），这只会使情况恶化，并向垃圾邮件者确认你确实在接收此类邮件。

    * 配置你的电子邮件客户端，由于某些邮件软件和 Web 邮箱允许我们屏蔽某些发送者。此外，某些邮件客户端会自动删除此类类型的邮件。

    * 不要向可疑的表单提供你的电子邮件地址，因为这会让垃圾邮件者获得这些地址，其中一些用于讨论组。


    #### 2.3.4. 软件炸弹


    这是一种突然发生的隐藏入侵。


    它是一种在系统事件（启动、启动特定程序等）或根据预设计划开始的程序。一个很好的例子是切尔诺贝攻击，它在切尔诺贝核事故发生的日期启动。


    #### 2.3.5. 木马


    这这也是间接入侵。它比病毒更复杂、更严重。它的用途与网络有关。


    ##### 2.3.5.1. 定义


    这是一个隐藏在另一个程序内部并打开端口的程序。它允许在用户不知的情况下控制计算机、执行程序并启动命令。


    木马本身并不执行任何恶意操作，但它通过打开端口允许其他实体共享或修改信息。


