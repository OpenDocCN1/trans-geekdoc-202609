- raw: "## 5.3. Intrusion detection systems\n\nAn intrusion detection system (IDS)\
    \ is a mechanism meant to identify abnormal or suspect activities in the analyzed\
    \ object (a network or a host). It thus provides knowledge of successful intrusions\
    \ as well as failed attempts. IDSs, which have gone through considerable evolutions,\
    \ include many forms and can act at many levels.\n\n### 5.3.1. *IDS purposes*\n\
    \nAn IDS ensures the identification of all intrusive behavior in an environment\
    \ and promptly provides a notification of this behavior.\n\nAn IDS is a monitoring\
    \ system based on varied and complementary techniques. It must announce any detections\
    \ it makes in order to be able to react at the right moment and find the necessary\
    \ remedy or prevention measures so that the attack can be evaded or deactivated.\n\
    \n### 5.3.2. *IDS components and functions*\n\nAn IDS is made up of many elements:\n\
    \n*   – *Production stack*: this consists of a group of integrated TCP/IP modules\
    \ in the majority of network operations on the system platform. It detects IPv4\
    \ and IPv6 intrusions and extrusions.\n\n*   – *Service stack*: this consists\
    \ of a group of integrated modules in the service and support of the system platform.\
    \ It detects IPv4 intrusions and extrusions and is the first response to the production\
    \ stack.\n\n*   – *IDS task*: this is the component that treats events generated\
    \ by the production stack and the service stack.\n\n*   – *Graphic interface*:\
    \ this allows the events to be visualized from an audit record.\n\n*   – *IDS\
    \ notification*: this is the alert component that sends messages via email.\n\n\
    *   – *Audit record*: this maintains the log.\n\nIDS components and the environment\
    \ in which they operate are presented in [Figure 5.1](#c05.xhtml#fig5-1).\n\n\
    The IDS works in the following manner:\n\n*   – When the production stack or the\
    \ service stack detects an advanced intrusion or an extrusion, it sends an event\
    \ to the IDS task.\n\n*   – The IDS task takes events in order one by one and\
    \ ensures that each event corresponds to one condition (from the port table).\
    \ The IDS task also maintains statistics on intrusion and extrusion events.\n\n\
    *   – The IDS gives notifications of events that go beyond the thresholds set\
    \ in the strategy files.\n\n*   – If there is a notification of an event, an intrusion\
    \ surveillance record is created in the audit log.\n\n*   – The IDS graphic presents\
    \ intrusion events from the audit log folders.\n\n*   – If an email and a notification\
    \ message have been configured in the IDS properties page, the IDS notification\
    \ will send an email to the specified address and a message to a message file.\n\
    \n ![Figure 5.1. IDS components and functions](images/fig5-1.jpg)\n\n[**Figure\
    \ 5.1.**](#c05.xhtml#ifig5-1) *IDS components and functions*\n\n### 5.3.3. *IDS\
    \ classification*\n\nIDSs can be classified according to either the field of action\
    \ (computer or network) or the level of protection (simple detection or prevention).\n\
    \n#### 5.3.3.1. *Classification by field of action*\n\nDepending on what needs\
    \ to be secured, a computer or a network, we distinguish an H-IDS (Host-based\
    \ IDS) and an N-IDS (Network-based IDS).\n\n###### H-IDS\n\nH-IDSs, or computer\
    \ intrusion detection systems, are IDSs dedicated to monitoring equipment and\
    \ operating systems. An H-IDS gathers information provided to it by the equipment\
    \ or the operating system. For this purpose, there are different approaches: signatures\
    \ and behavior.\n\nAn H-IDS behaves like a daemon or a standard service on a system\
    \ host that detects suspicious activity by comparing it to a norm. If the activity\
    \ is very different from the norm, an alert is generated. The computer can be\
    \ monitored in various ways:\n\n*   – *computer activity*: number and lists of\
    \ processes, users, resources used, etc.;\n\n*   – *user activity*: times and\
    \ duration of connections, commands used, messages sent, programs started, usage\
    \ beyond a predefined perimeter, etc.;\n\n*   – *malicious activity* by a worm,\
    \ virus or Trojan horse.\n\nAnother type of H-IDS seeks out intrusions in the\
    \ system kernel and any modifications made therein. This technique is called protocol\
    \ analysis, a technique that does not require searching a signature database.\n\
    \n###### N-IDS\n\nN-IDSs, or network-based intrusion detection systems, are IDSs\
    \ dedicated to monitoring the security state of a network. N-IDS analysis can\
    \ be divided into three general subsections: capture, signatures and alerts.\n\
    \n*   – *Capture*: this captures network traffic in real time. Most N-IDSs use\
    \ a standard capture packet library called libpcap, which is available on most\
    \ platforms.\n\n*   – *Signatures*: this is a library of attack signatures (classified\
    \ by context) used in a manner similar to an antivirus. Thus, an N-IDS is efficient\
    \ when it is familiar with the attack, but inefficient when it is not. Commercial\
    \ and free tools have evolved to provide signature personalization, which allows\
    \ attacks of which only one part of the elements is known to be dealt with. Tools\
    \ based on signatures require more regular updates.\n\n*   – *Alerts*: these are\
    \ generally saved in the form of a log. A norm exists for organizing the content\
    \ so that different security elements can be altered. This format is called the\
    \ IDMEF (Intrusion Detection Message Exchange Format), described in the RFC4765.\
    \ The IDMEF offers an infrastructure so that the IDS does not have to send alerts.\
    \ This allows the IDS to focus on describing the information it contains without\
    \ having to record it for later user visualization.\n\nThe N-IDS has the advantage\
    \ of being a system in real time, which means attacks targeting numerous computers\
    \ at once can be discovered. The disadvantage is the high rate of false positives\
    \ generated.\n\n#### 5.3.3.2. *Classification by level of protection*\n\nIntrusion\
    \ management systems can provide detection and/or prevention. There are three\
    \ families of systems: IDS, IPS and IDS/IPS.\n\n###### IDS\n\nThis is the simplest\
    \ form insofar as it only provides detection. The mechanism identifies an abnormal\
    \ or suspicious activity on the analyzed object (a network or host) and thus provides\
    \ the knowledge of intrusion attempts on a company.\n\n###### IPS\n\nAn IPS, or\
    \ intrusion prevention system, is a mechanism that protects systems from intrusions.\
    \ IT is evolved from the IDS and provides both detection and prevention. It has\
    \ the same detection role as an IDS except that the system can take steps to diminish\
    \ the risk of impact from an attack. The IPS is an active IDS that detects automatic\
    \ scanning, and can automatically block ports.\n\n###### IDS/IPS\n\nThis is a\
    \ new generation of IDS/IPS, which are hybrid detection/prevention solutions for\
    \ intrusions in a computer and network.\n\n#### 5.3.3.3. *Comparison between different\
    \ types of IDS/IPS*\n\n[Table 5.2](#c05.xhtml#tab5-2) presents a comparison between\
    \ the H-IPS and the N-IPS by presenting their advantages and disadvantages.\n\n\
    [**Table 5.2.**](#c05.xhtml#itab5-2) *Advantages and disadvantages of the H-IPS/N-IPS*\n\
    \n|  || **Advantages** || **Disadvantages** |\n\n| --- | --- | --- |\n\n| **Host-based\
    \ IPS** || – Provides specific protection for the computer  \n\n– Offers high-level\
    \ protection for the operating system and applications  \n\n– Protects the computer\
    \ after messages are decrypted || – Depends on the operating system  \n\n– Requires\
    \ installation on all computers |\n\n| **Network-based IPS** || – Provides better\
    \ cost  \n\n– Is independent from the operating system || – Is incapable of analyzing\
