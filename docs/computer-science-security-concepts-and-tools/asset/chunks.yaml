    # 4 Techniques and Tools for Controlling Access, ACL and Firewalls


    ## 4.1 Introduction


    Network traffic is always increasing in large measure and making the load on routers
    moving information around more and more difficult, and the quantity of data more
    and more voluminous. Moreover, a large part of this information constitutes parasitic
    elements controlled by hackers and unauthorized entities. The appropriate solution
    for this is to filter traffic and only allow legitimate parties to communicate
    through a network, which on the one hand limits the quantity of data processed,
    and on the other hand eliminates potential sources of attack. These filters can
    be configured on routers and are named `ACLs` (access control lists).


    To protect a critical location (laboratory, control room, etc.) in a company,
    it must be isolated and access to the location must be logged. In computing, measures
    for securing a system are similar and are done through a firewall that allows
    it to be isolated and for access to be tracked. A firewall is the most important
    security tool; it is the key element in any security measure. Moreover, the principle
    of firewalling and more specifically, filtering, is present in numerous security
    tools, and here, in the network connection equipment (Router, Level 3 Switch)
    in the form of `ACLs`.


    ## 4.2 Access control list


    `ACL` is the acronym for access control list; it is a list of ordered filters
    called access control entry, which is applied to traffic leaving or entering through
    the `LAN/WAN` interface of a router.


    `ACLs` allow packets to be filtered following the criteria defined by the user.
    It ensures that packets are filtered as they enter or leave a router interface
    depending on:


    * – source IP;

    * – destination IP;

    * – source port;

    * – destination port;

    * – protocol: `IP`, `TCP`, `UDP`, `ICMP`, etc.


    An access control list is a router configuration script that controls whether
    packets and even frames are authorized or refused passage, following the criteria
    stipulated in their header. They are also used to select the type of traffic to
    be analyzed, transmitted or processed via other methods.


    Within the router, only one `ACL` can be defined per protocol, per interface and
    per direction:


    * – protocol (`IPv4`, `IPv6`);

    * – interface (`GigabitEthernet0/0`, etc.);

    * – direction (incoming or outgoing traffic).


    ### 4.2.1 ACL classification


    There are three possible classifications for `ACLs`, and these depend on the direction
    of traffic being managed by the `ACL`, on the type of ACL itself (its structure
    and complexity) and on the way the ACL is defined (numbered or named).


    #### 4.2.1.1 Incoming/outgoing ACL


    Access control lists can apply to incoming or outgoing traffic.


    * – `Incoming access control lists`: incoming packets are processed before being
    routed to the outgoing interface. An incoming access control list is efficient
    because it reduces the routing load in case the packet is abandoned. If the packet
    is authorized after the tests, it is routed.

    * – `Outgoing access control lists`: incoming packets are routed to the outgoing
    interface and then processed via the outgoing access list.


    #### 4.2.1.2 Standard/extended ACL


    There are two principal `ACLs`, defined by the criteria which used to control
    routing. We distinguish:


    * – `Standard access control lists`: these allow filters based only on IP sources.
    Basic nomenclature is used for Huawei equipment.

    * – `Extended access control lists`: these allow filters based on almost any field
    in `IP`, `TCP` and `UDP` headers. Advanced nomenclature is used for Huawei equipment.


    For Huawei routers, it is also possible to define `ACLs` according to the MAC
    address; this is a layer 2 `ACL`.


    #### 4.2.1.3 Numbered/named ACL


    In an `ACL` definition, a name can be given to it, or a number can be given instead.
    We distinguish:


    * – `Numbered ACL`: the ACL is identified by a number chosen while defining it.
    For Cisco, the number allows the type of ACL to be identified as follows:

    * – (1–99) and (1300–1999): standard access control list;

    * – (100–199) and (2000–2699): extended access control list.

    For Huawei, the number allows the type of ACL to be identified as follows:

    * – 2000–2999: basic access control list;

    * – 3000–3999: advanced access control list;

    * – 4000–4999: layer 2 access control list.


    * – `Named ACL`: the ACL is identified by a name chosen while defining it and
    by indicating the type (standard or extended):

    * – names can include alphanumeric characters;

    * – it is recommended that the name be written in capital letters;

    * – the names cannot contain spaces or punctuation marks; they must begin with
    a letter;

    * – entries in the access control list can be added or deleted.


    ### 4.2.2 ACL configuration in Cisco


    An access control list is a sequential and ordered group of authorization or refusal
    instructions, called access control entries (`ACE`).


    When network traffic crosses an interface configured with an access control list,
    the router compares information figuring in the packet to each rule in the `ACL`.
    The action specified by the first corresponding `ACE` is applied to the packet
    in question.


    #### 4.2.2.1 Generic mask


    An `IPv4` access control entry includes the use of a generic mask to filter `IPv4`
    addresses.


    A generic mask takes the form of an `IPv4` address, and the bits that constitute
    it are interpreted as follows:


    * – a bit at 0: this allows for the establishment of a correspondence to the value
    of the bit at the corresponding IP address;

    * – a bit at 1: this allows the value of the bit at the corresponding IP address
    to be ignored.

