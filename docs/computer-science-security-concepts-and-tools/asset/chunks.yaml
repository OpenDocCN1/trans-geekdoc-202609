    第二阶段专注于物理安全，通过对计算系统场地的物理访问进行批判来实现。


    ### 8.2.3.2. 工具与实施


    通过针对管理层、代理和客户的适当问卷来发现组织和物理漏洞，这些问卷涵盖了各个方面。


    我们还可以使用已知的模型，这些模型提供了与许多主题相关的问卷数据库，并可以根据审计公司的背景进行调整。这可以产生统计数据和安全指标。


    有两种可能的方法：升序法和降序法。


    * – `降序方法`：这是一种系统性、完整的方法，但实施耗时较长。

    * – `升序方法`：这是一种直观、不完全的方法，实施速度快，但在精确性存在某些疏漏。


    ### 8.2.4. 技术审计


    也称为低级审计，用于识别技术漏洞（系统和网络中的）。这部分要求审计人员具备涵盖多个领域的专业知识。有几个方面需要审计：


    * – 网络拓扑；

    * – 系统抗性；


    * – 服务器；

    * – 连接设备；

    * – 网络应用；

    * – SGBDS 和数据库；

    * – 消息系统；

    * – 特定应用。


    #### 8.2.4.1. 目标


    这是最重要的部分，一方面通过发现技术漏洞和故障，对系统和计算机应用程序进行审计；另一方面，通过制定适当的技术建议。


    技术审计要求审计人员具有最低的专业知识，他们将通过问卷和讨论与管理员及安全经理讨论问题，并使用适用于系统、服务和应用的适当工具。


    使用的工具取决于计算机服务的背景、重要性，以及其在设备和部署解决方案、数据流量、所提供的服务和功能方面的内容。


    #### 8.2.4.2. 实施工具


    许多计算工具可以用于技术审计。最合适的工具是免费软件，即黑客和攻击者使用的相同工具。


    这些工具的示例如下：


    * – `Nessus`：这是一个发现网络或网络分段中安全缺陷的工具。

    * – `NMAP`：这是一个识别网络、子网络或计算机开放端口的工具。

    * – `LANguard`：这是一个检测补丁、共享、开放端口、未使用用户账户和缺失服务包的工具。


    ### 8.2.5. 侵入测试


    这是一种攻击模拟，用于测试计算机系统的强度及其对攻击的响应。它包含使用攻击工具并观察系统的反应方式。侵入测试必须仔细编写，以避免干扰正常运行。


    ### 8.2.6. 审计方法


    有几种审计方法可以在审计期间进行灵活调整。


    #### 8.2.6.1. ISO 17799


    ISO 17799 标准源自英国 BS 7799 规范，它为安全管理提供了指南和建议。


    因此，ISO 17799 标准为识别和实施以下风险的解决方案提供模型：


    * – `安全策略`：编写并分发公司安全策略。

    * – `安全组织`：定义角色和职责，并对合作伙伴和外部活动进行控制。

    * – `资产分类与控制`：对公司资产进行盘点，并定义其关键性以及相关的风险。

    * – `人员安全`：包括招聘、入职和安全敏感性培训。

    * – `物理和环境安全`：包括安全边界和安全设备盘点。

    * – `通信与运营管理`：包括事故处理程序、恢复计划、服务水平定义和恢复时间。

    * – `访问控制`：包括在不同层次（系统、网络、建筑等）建立访问控制。

    * – `系统开发与维护`：考虑从设计到维护整个系统中的安全概念。

    * – `业务连续性计划`：包括可用性需求定义、恢复时间和应急演练。

    * – `合规性`：包括遵守版权、法律和公司章程。


    #### 8.2.6.2. MARION


    MARION 方法（法语“按分级计算机风险分析方法”的缩写）是一种审计方法，正如名称所示，它通过受控问卷来评估公司的安全水平（风险），这些问卷以与安全相关的不同主题的评分形式提供指标。


    安全水平的根据分为六个主题的 27 个指标进行评估，每个主题给出 0 到 4 分，如果我们要达到被认为充分的安全水平，则需要达到 3 分。该方法基于关注精确领域的问卷。问卷必须允许对公司所有安全领域的特定漏洞进行评估。


    指标组通过数百个问题进行评估，这些问题的回答是受控的（受控随方法的更新而演变）。


    主题如下：


    * – 组织安全；

    * – 物理安全；

    * – 连续性；

    * – 计算机组织；

    * – 计算机安全与使用；

    * – 应用安全。


    #### 8.2.6.3. MEHARI


    MEHARI（法语“协调风险分析方法”的缩写）源于另外两种风险分析方法 MARION 和 MELISA。该方法由法国信息系统安全俱乐部 CLUSIF 在法国开发并维护。MEHARI
    是目前最常用的风险分析方法之一。该方法似乎是一套真正的计算机系统安全工具箱，能够以各种方式识别组织内部的风险。该工具箱由多个模块组成，无论采用何种安全方法，它们特别提供：


    * – 安全利益分析（通过描述担忧的故障类型），并根据安全三大要素（机密性、完整性和可用性）对资源和信息进行分类；

    * – 安全服务审计，评估其效率、控制情况并总结漏洞；

    * – 风险情势分析，提供可能性和内在影响的评估，以及风险缓解因子，最后是风险严重程度指标。


    ## 8.3. 安全策略演示


    一份编写并发布的安全策略必须在任何使用大型或中计算机系统的组织中建立。它需要测试来验证和衡量需求以及现有的安全水平。


    ### 8.3.1. 安全测试与评估


    测试和评估是制定安全策略之前的必要步骤。安全测试有多种形式，并使用多种针对性的工具。


    #### 8.3.1.1. 安全测试类型


    安全测试用于验证计算机系统的强度并识别弱和局限。这些测试分为以下几类：


    * – 渗透测试；

    * – 网络分析；

    * – 漏洞分析；

    * – 密码破解；

    * – 记录检查；

    * – 完整性控制；

    * – 病毒检测。


    '
