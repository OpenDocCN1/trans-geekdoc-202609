  我们需要配置 [EntityManager](http://www.doctrine-project.org/projects/orm.html)。\n\n使用\
  \ [EntityManager](http://www.doctrine-project.org/projects/orm.html)。\n\n使用 [EntityManager](http://www.doctrine-project.org/projects/orm.html)\
  \ 来处理... \n\n(注：原文文本后半部分存在大量重复的单词和错误的拼接，译文已提取核心技术意点并剔除冗余重复。)\n\n[content]\n(此处为混乱部分的修复性翻译建议)\n\
  \n\n\n\n```php\n// src/Persistence/Doctrine/Repository/OrderRepository.php\n\nnamespace\
  \ CleanPhp\\Invoicer\\Persistence\\Doctrine\\Repository;\n\nuse CleanPhp\\Invoicer\\\
  Domain\\Repository\\OrderRepositoryInterface;\nuse Doctrine\\ORM\\Query\\Expr\\\
  Join;\n\nclass OrderRepository extends AbstractDoctrineRepository\n  implements\
  \ OrderRepositoryInterface {\n\n  protected $entityClass = 'CleanPhp\\Invoicer\\\
  Domain\\Entity\\Order';\n\n  public function getUninvoicedOrders() {\n    $builder\
  \ = $this->entityManager->createQueryBuilder()\n      ->select('o')\n      ->from($this->entityClass,\
  \ 'o')\n      ->leftJoin(\n        'CleanPhp\\Invoicer\\Domain\\Entity\\Invoice',\n\
  \        'i',\n        Join::WITH,\n        'i.order = o'\n      )\n      ->where('i.id\
  \ IS NULL');\n\n    return $builder->getQuery()->getResult();\n  }\n}\n```\n\n`OrderRepositoryInterface`\
  \ 指定了一个额外方法用于获取所有没有发票的订单，因此我们使用 Doctrine 的 `QueryBuilder` 类实现了该功能，它允许我们对实体对象定义查询。注意，这与对数据库架构进行查询略有不同：我们使用的是领域语言，而不是数据库语言。这种查询语言被称为\
  \ [Doctrine 查询语言 (DQL)](http://doctrine-orm.readthedocs.org/en/latest/reference/dql-doctrine-query-language.html)。\n\
  \n如果你对更多细节感兴趣，Doctrine 为 `QueryBuilder` 类提供了[详细文档](http://doctrine-orm.readthedocs.org/en/latest/reference/query-builder.html)。\n\
  \n## 发票存储库 (Invoice Repository)\n\n`InvoiceRepository` 是另一个不需要进一步自定义的简单子类：\n\n```php\n\
  // src src/Persistence/Doctrine/Repository/InvoiceRepository.php\n\nnamespace CleanPhp\\\
  Invoicer\\Persistence\\Doctrine\\Repository;\n\nuse CleanPhp\\Invoicer\\Domain\\\
  Repository\\InvoiceRepositoryInterface;\n\nclass InvoiceRepository extends AbstractDoctrineRepository\n\
  \  implements InvoiceRepositoryInterface {\n\n  protected $entityClass = 'CleanPhp\\\
  Invoicer\\Domain\\Entity\\Invoice';\n}\n```\n\n## 实体映射 (Entity Mapping)\n\nDoctrine\
  \ 依赖于[映射文件](http://doctrine-orm.readthedocs.org/en/latest/reference/basic-mapping.html)\
  \ 来获取有关数据库架构的信息以及如何将该架构映射到实体对象。Doctrine 是“约定优于配置”的范例。其他的 ORM，特别是那些使用 [ActiveRecord](http://www.martinfowler.com/eaaCatalog/activeRecord.html)\
  \ 模式的 ORM，需要的配置要少得多，但对数据库做出了深层次的假设。\n\n我们可以使用三种方法来生成这些映射：\n\n1. 实体本身上的 DocBlock\
  \ 类注解\n2. XML 映射文件\n3. YAML 映射文件\n\n第一种选项显然是最常见的，甚至是 [Symfony 推荐的标准](http://symfony.com/doc/current/best_practices/business-logic.html#doctrine-mapping-information)。第二种选项是给超级企业级开发人员的，而第三种将我们将采用的方法。\n\
  \n我不使用 DocBlocks 有两个原因：\n\n*   它将持久化信息泄露到了领域层，而领域层不应该关心数据是如何被持久化的\n*   它使得代码依赖注释才能正常运行。我坚信注释不应该对代码在运行时的行为产生直接影响。\n\
  \n如果 PHP 真的在语言中实现了真正的注解，第二个抱怨就会消失了，但目前，对我来说，这是一个巨大的代码异味（code smell）。\n\n我不使用 XML\
  \ 有一个原因：它是 XML。\n\n不过，真的，请采用你认为最好的方法。在宏观来看这只是微小问题，而且三种方法中的任何一种都不会影响存储库的工作方式。\n\n\
  我们将这些映射文件存储在 `Persistence/Doctrine/Mapping` 文件夹中。\n\n### Customers.dcm.yml\n\n该文件\
  \ `CleanPhp.Invoicer.Domain.Entity.Customer.dcm.yml` 规定了 `Customer` 实体的映射信息：\n\n\
  ```yaml\nCleanPhp\\Invoicer\\Domain\\Entity\\Customer:\n  type: entity\n  table:\
  \ customers\n  id:\n    id:\n      type: bigint\n      generator:\n        strategy:\
  \ IDENTITY\n  fields:\n    name:\n      length: 100\n    email:\n      length: 50\n\
  ```\n\n### Order.dcm.yml\n\n该文件 `CleanPhp.Invoicer.Domain.Entity.Order.dcm.yml`\
  \ 规定了 `Order` 实体的映射信息：\n\n```yaml\nCleanPhp\\Invoicer\\Domain\\Entity\\Order:\n\
  \  type: entity\n  table: orders\n  id:\n    id:\n      type: bigint\n      generator:\n\
  \        strategy: IDENTITY\n  fields:\n    name:\n      length: 100\n    email:\n\
  \      length: 50\n```\n\n### Invoice.dcm.yml\n\n该文件 `CleanPhp.Invoicer.Domain.Entity.Invoice.dcm.yml`\
  \ 规定了 `Invoice` 实体的映射信息：\n\n```yaml\nCleanPhp\\Invoicer\\Domain\\Entity\\Invoice:\n\
  \  type: entity\n  table: invoices\n  id:\n    id:\n      type: bigint\n      generator:\n\
  \        strategy: IDENTITY\n  fields:\n    name:\n      length: 100\n    email:\n\
  \      length: 50\n```\n\n## 集成 Zend Framework 和 Doctrine\n\n下一步是让 Zend Framework\
  \ 和 Doctrine 协同工作。得益于 [DoctrineORMModule](https://github.com/doctrine/orm-module)（由\
  \ Doctrine 团队编写的集成这两个项目的模块），这似乎非常简单。\n\n我们将通过 Composer 获取最新版本：\n\n```bash\ncomposer\
  \ require doctrine/orm-module\n```\n\nDoctrineOrmModule 会带上它所有必要的依赖。现在我们只需要在 Zend\
  \ Framework 中配置该模块就可以使用了。\n\n我们要做的第一件事是启用 DoctrineORMModule 和 DoctrineModule（DoctrineORMModule\
  \ 的依赖）：\n\n```php\n// config/application.config.php\n\nreturn [\n  'modules' =>\
  \ [\n    'DoctrineModule',\n    'DoctrineORMModule',\n    'Application',\n  ],\n\
  \  // ...\n];\n```\n\n接下来，我们将全局配置文件来定义 Doctrine 设置的基础，包括使用哪种映射驱动、在哪里查找实体以及在哪里查找映射文件：\n\
  \n```php\n// config/autoload/db.global.php\n\nreturn [\n  'doctrine' => [\n    'driver'\
  \ => [\n      'orm_driver' => [\n        'class' => 'Doctrine\\ORM\\Mapping\\Driver\\\
  YamlDriver',\n        'cache' => 'array',\n        'paths' => [\n          realpath(__DIR__\
  \ . '/../../src/Domain/Entity'),\n          realpath(__DIR__ . '/../../src/Persistence/Doctrine/Mapping')\n\
  \        ],\n      ],\n      'orm_default' => [\n        'drivers' => ['CleanPhp\\\
  Invoicer\\Domain\\Entity' => 'orm_driver']\n      ]\n    ],\n  ],\n];\n```\n\n我们还会修改\
  \ `db.local.php` 文件来为 DoctrineModule 设置数据库连接信息。这些与之前的信息相同，只是稍微微调以符合 DoctrineModule\
  \ 期望的格式：\n\n```php\n// config/autoload/db.local.php\n\nreturn [\n  'doctrine' =>\
  \ [\n    'connection' => [\n      'orm_default' => [\n        'driverClass' => 'Doctrine\\\
  DBAL\\Driver\\PDOSqlite\\Driver',\n        'params' => [\n          'path' => __DIR__\
  \ . '/../../data/database.db',\n        ]\n      ]\n    ],\n  ],\n];\n```\n\n###\
  \ 注入新的存储库\n\n剩下的工作就是开始使用 Doctrine。我们希望将这些新的存储库注入到控制器中，以便它们开始使用它们。\n\n\n\n\n\n与其在服务配置中放入一堆重复代码，我们将创建一个\
  \ Zend `ServiceManager` 工厂，它将负责实例化所有的 Repository（仓库）。\n\n```\n// src/Persistence/Doctrine/Repository/RepositoryFactory;\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Doctrine\\Repository;\n\nuse RuntimeException;\n\
  use Zend\\ServiceManager\\FactoryInterface;\nuse Zend\\ServiceManager\\ServiceLocatorInterface;\n\
  \nclass RepositoryFactory implements FactoryInterface {\n  public function createService(ServiceLocatorInterface\
  \ $sl) {\n    $class = func_get_arg(2);\n    $class = 'CleanPhp\\Invoicer\\Persistence\\\
  Doctrine\\Repository\\\\' . $class;\n\n    if (class_exists($class, true)) {\n \
  \     return new $class(\n        $sl->get('Doctrine\\ORM\\EntityManager')\n   \
  \   );\n    }\n\n    throw new RuntimeException(\n      'Unknown Repository requested:\
  \ ' . $class\n    );\n  }\n}\n```\n\n该工厂只需对传递的服务定位器键名进行字符串替换（得益于 ZF2，它隐藏在 `func_get_args()`\
  \ 中），将其规范化为请求的仓库的全限定命名空间，实例化结果类并返回实例化的对象。\n\n如果工厂找不到请求的仓库的类，它将抛出一个 `RuntimeException`。\n\
  \n接下来，我们将在服务配置中添加几项，以便在请求任何新的 Doctrine-base 仓库时使用此 `RepositoryFactory`：\n\n```\n\
  // config/autoload/global.php\n\nreturn [\n  'service_config' => [\n    'factories'\
  \ => [\n      'OrderHydrator' => function ($sm) {\n        return new OrderHydrator(\n\
  \          new ClassMethods(),\n          $sm->get('CustomerRepository')\n     \
  \   );\n      },\n      'CustomerRepository' =>\n        'CleanPhp\\Invoicer\\Persistence\\\
  Doctrine\\Repository\\RepositoryFactory',\n      'InvoiceRepository' =>\n      \
  \  'CleanPhp\\Invoicer\\Persistence\\Doctrine\\Repository\\RepositoryFactory',\n\
  \      'OrderRepository' =>\n        'CleanPhp\\Invoicer\\Persistence\\Doctrine\\\
  Repository\\RepositoryFactory',\n    ]\n  ]\n];\n```\n\n最后，我们将更新控制器配置，将这些新仓库注入到控制器中：\n\
  \n```\n// module/Application/config/module.config.php\n\nreturn [\n  // ...\n  'controllers'\
  \ => [\n     'invokables' => [\n       'Application\\Controller\\Index' =>\n   \
  \      'Application\\Controller\\IndexController'\n     ],\n     'factories' =>\
  \ [\n       'Application\\Controller\\Customers' => function ($sm) {\n         return\
  \ new \\Application\\Controller\\CustomersController(\n           $sm->getServiceLocator()->get('CustomerRepository'),\n\
  \           new CustomerInputFilter(),\n           new ClassMethods()\n        \
  \ );\n       },\n       'Application\\Controller\\Invoices' => function ($sm) {\n\
  \         return new \\Application\\Controller\\InvoicesController(\n          \
  \ $sm->getServiceLocator()->get('InvoiceRepository'),\n           $sm->getServiceLocator()->get('OrderRepository'),\n\
  \           new InvoicingService(\n             $sm->getServiceLocator()->get('OrderRepository'),\n\
  \             new InvoiceFactory()\n           )\n         );\n       },\n     \
  \  'Application\\Controller\\Orders' => function ($sm) {\n         return new \\\
  Application\\Controller\\OrdersController(\n           $sm->getServiceLocator()->get('OrderRepository'),\n\
  \           $sm->getServiceLocator()->get('CustomerRepository'),\n           new\
  \ OrderInputFilter(),\n           $sm->getServiceLocator()->get('OrderHydrator')\n\
  \         );\n       },\n     ],\n  ],\n  // ...\n];\n```\n\n| ![generic\\_inbar](img/leanpub_git.png)\
  \ || 这里是将代码提交到版本控制的好地方。如果你只是在阅读，但想看到代码的运行，可以检出标签 11-doctrine-integration：\n\n```\n\
  git clone https://github.com/mrkrstphr/cleanphp-example.git\ngit checkout 11-doctrine-integration\n\
  ```\n\n |\n\n| --- | --- |\n\n### 更新 Hydrators\n\n我们需要对持久层进行的最后一次更新是更新 hydrators\
  \ 以配合 Doctrine。Doctrine 处理实际的注水（hydration）得很好。事实上，我们不再需要 `InvoiceHydrator` 了。我们可以直接删除它，这意味着我们也可以删除构建的\
  \ `DateStrategy` 策略。\n\n我们还将对 `OrderHydrator` 进行一些更新，首先从规范开始：\n\n```\n// specs/hydrator/order.spec.php\n\
  \nuse CleanPhp\\Invoicer\\Domain\\Entity\\Customer;\nuse CleanPhp\\Invoicer\\Domain\\\
  Entity\\Order;\nuse CleanPhp\\Invoicer\\Persistence\\Hydrator\\OrderHydrator;\n\
  use Zend\\Stdlib\\Hydrator\\ClassMethods;\n\ndescribe('Persistence\\Hydrator\\OrderHydrator',\
  \ function () {\n  beforeEach(function() {\n    $this->repository = $this->getProphet()->prophesize(\n\
  \      'CleanPhp\\Invoicer\\Domain\\Repository\\CustomerRepositoryInterface'\n \
  \   );\n    $this->hydrator = new OrderHydrator(\n      new ClassMethods(),\n  \
  \    $this->repository->reveal()\n    );\n  });\n\n  describe('->hydrate()', function\
  \ () {\n    it('should perform basic hydration of attributes', function () {\n \
  \     $data = [\n        'id' => 100,\n        'order_number' => '20150101-019',\n\
  \        'description' => 'simple order',\n        'total' => 5000\n      ];\n\n\
  \      $order = new Order();\n      $this->hydrator->hydrate($data, $order);\n\n\
  \      expect($order->getId())->to->equal(100);\n      expect($order->getOrderNumber())->to->equal('20150101-019');\n\
  \      expect($order->getDescription())->to->equal('simple order');\n      expect($order->getTotal())->to->equal(5000);\n\
  \    });\n\n    it('should hydrate the embedded customer data', function () {\n\
  \      $data = ['customer' => ['id' => 20]];\n      $order = new Order();\n\n  \
  \    $this->repository->getById(20)->willReturn((new Customer())->setId(20));\n\
  \      $this->hydrator->hydrate($data, $order);\n\n      assert(\n        $data['customer']['id']\
  \ === $order->getCustomer()->getId(),\n        'id does not match'\n      );\n \
  \   });\n  });\n\n  describe('->extract()', function () {\n    // ...\n  });\n});\n\
  ```\n\n我们删除了 *should hydrate a Customer entity on the Order* 测试例，并更新了 *should hydrate\
  \ the embedded* 测试例，以便使用仓库来查询 Customer。\n\n我们不需要通过 `customer_id` 对 Customer 进行注水，因为那不是\
  \ Doctrine 提供数据的方式，Doctrine 会替我们处理注水。\n\n由于 Doctrine 的 `UnitOfWork` 需要知道所有现有实体，否则它会尝试重新插入，我们更新了\
  \ hydrator 在遇到 ID 时查询 customer。解决此问题的另一种方法是使用 `EntityManager::merge()` 方法让 Doctrine\
  \ 感知实体。\n\n让我们对 `OrderHydrator` 相应的相应的更改：\n\n```\n// src/Persistence/Hydrator/OrderHydrator.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Hydrator;\n\nuse CleanPhp\\Invoicer\\\
  Domain\\Entity\\Order;\nuse CleanPhp\\Invoicer\\Domain\\Repository\\CustomerRepositoryInterface;\n\
  use Zend\\Stdlib\\Hydrator\\HydratorInterface;\n\nclass OrderHydrator implements\
  \ HydratorInterface {\n  // ...\n\n  public function hydrate(array $data, $order)\
  \ {\n    if (isset($data['customer'])\n    && isset($data['customer']['id'])) {\n\
  \      $data['customer'] = $this->customerRepository->getById(\n        $data['customer']['id']\n\
  \      );\n    }\n    return $this->wrappedHydrator->hydrate(\n      $data,\n  \
  \    $order\n    );\n  }\n}\n```\n\n现在如果我们开始在应用程序中点击，它应该能够继续工作！从 UI 和交互的角度来看，似乎没有发生变化。但在底层，我们正在使用完全不同的数据库架构。\n\
  \n这非常强大。\n\n| ![generic\\_inbar](img/leanpub_git.png) || 这里是将代码提交到版本控制的好地方。如果你只是在阅读，但想看到代码的运行，可以检出标签\
  \ 12-doctrine-hydrators：\n\n```\ngit clone https://github.com/mrkrstphr/cleanphp-example.git\n\
  git checkout 12-doctrine-hydrators\n```\n\n |\n\n| --- | --- |\n\n### Summary\n\n\
  \n\n\n该应用程序现在使用 `Doctrine` 作为其底层数据库抽象层。在此过程中，我们没有修改任何应用程序代码，因为应用程序代码仅依赖于接口和依赖注入。由于注入的内容按照预期方式工作，应用程序继续运行，无需进一步修改。\n\
  \n我们还获得了一个好处，只需要编写更少的代码即可实现数据库交互。在大多数情况下，我们只是简单地代理给 Doctrine 的 `EntityManager` 来为我们完成工作。\n\
  \n## 切换到 Laravel\n\n在下一次实验中，我们将尝试一项更大的任务。目前为止，我们一直使用 `Zend Framework 2` 作为应用程序的控制器服务+视图层。`Zend\
  \ Framework 2` 非常棒，如果不是过于复杂的话，但每个人似乎都喜欢 `Laravel`，所以让我们也顺势而为吧。\n\n应用层是我们应用程序中最大的部分。在实际应用程序中，它将包含几十个控制器、数百个视图，以及许多许多路由和配置。\n\
  \n从直以来，我们的目标一直是尽可能减少依赖框架。这就是我们领域模型和领域服务层的初衷。\n\n虽然我们必须重写或至少调整所有的控制器和视图，但不应该触碰任何领域、持久化和业务逻辑。如果在切换框架的过程中发现自己正在涉入这些层，那么我们做得非常错误。\n\
  \n让我们开始吧。\n\n### 设置 Laravel\n\n让我们从设置一个新的新的 `Laravel` 项目开始。一旦下载了源代码，我们将现有的核心代码（位于\
  \ `src/`）移动到 Laravel 项目中。\n\n在大多数情况下，我们将遵循官方的 [Laravel 文档](http://laravel.com/docs)。\n\
  \n我们先在 `cleanphp-laravel` 处创建一个新的 `Laravel` 项目，然后运行 `artisan fresh` 命令来清除一些不需要的脚手架：\n\
  \n```\ncomposer create-project laravel/laravel --prefer-dist cleanphp-laravel\n\
  cd cleanphp-laravel\nphp artisan fresh\n```\n\n接下来，我们将从原始项目中拷贝一些代码，首先是 `.git` 目录以保留源码控制历史，以及\
  \ `src/` 和 `specs/` 目录，还有 Peridot 配置文件 `peridot.php`。\n\n我们将 `src/` 重命名为 `core/`（没有什么特别的理由，除了\
  \ `src` 是“source”的缩写，而且在这个目录之外我们有很多源代码）：\n\n```\ncp -R ../cleanphp-example/.git\
  \ .\ncp -R ../cleanphp-example/src ../cleanphp-example/specs \\\n  ../cleanphp-example/peridot.php\
  \ .\ngit mv src core\n```\n\n我们还在 `composer.json` 的 `autoload` 部分添加一个条目，以自动加载 `core/`\
  \ 目录中的代码：\n\n```json\n\"autoload\": {\n  \"classmap\": [\n    \"database\"\n  ],\n\
  \  \"psr-4\": {\n    \"App\\\\\": \"app/\",\n    \"CleanPhp\\\\Invoicer\\\\\": \"\
  core/\"\n  }\n},\n```\n\n这要求我们重新加载 `Composer` 自动加载器，使其包含此新条目的自动加载规范：\n\n```\ncomposer\
  \ dump-autoload\n```\n\n我们还想把数据库也带过来：\n\n```\ncp -R ../cleanphp-example/data/database.db\
  \ storage/database.db\ngit mv data/database.db storage/database.db\n```\n\n接下来，从旧项目中获取\
  \ `application.css` 文件并移动过去，同时移除 Laravel 默认自带的一些 CSS 和字体：\n\n```\nmkdir public/css\n\
  cp ../cleanphp-example/public/css/application.css public/css/\nrm -rf public/css/app.css\
  \ public/favicon.ico public/fonts\n```\n\n如果我们运行 `git status`，我们会看到由于移动了这些东西，我们的源码控制变得一团糟。让我们添加一些重要的\
  \ Laravel 代码，并移除我们不再需要的 ZF2 东西：\n\n```\ngit add .gitignore app/ artisan bootstrap/\
  \ \\\n  composer.* config/ public/index.php resources/ \\\n  server.php storage/\n\
  \ngit rm -rf data/ init_autoloader.php module/\n```\n\n现在，这个 Laravel 应用程序应该准备好让我们开始从\
  \ ZF2 项目中迁移一些代码了。让我们启动开发服务器并在浏览器中查看：\n\n```\nphp artisan serve\n```\n\n如果我们在浏览器中访问\
  \ `http://localhost:8000`，我们应该看到 Laravel 的欢迎页面。\n\n如果你再次运行 `git status`，你会发现我们仍然有一些未提交的文件。我们可以暂时忽略它们，或者直接把它们删掉。\n\
  \n我们的最后一步是重新安装 Peridot 并验证我们的测试规范（specs）是否仍然通过：\n\n```\ncomposer require --dev peridot-php/peridot\
  \ peridot-php/leo \\\n  peridot-php/peridot-watcher-plugin peridot-php/peridot-prophecy-plugin\n\
  ```\n\n运行 Peridot：\n\n```\n./vendor/bin/peridot specs/\n```\n\n哎！看来我们的测试由于缺少 ZF2\
  \ 依赖而失败了。我们稍后会修复它。\n\n| ![generic\\_inbar](img/leanpub_git.png) || 这将是将代码提交到源码控制的好地方。如果你只是在阅读，但想看代码运行的效果，可以检出标签\
  \ 13-laravel-setup：\n\n```\ngit clone https://github.com/mrkrphr/cleanphp-example.git\n\
  git checkout 13-laravel-setup\n```\n\n |\n\n| --- | --- |\n\n### 设置仪表板\n\n默认情况下，Laravel\
  \ 设置了一个位于的 `WelcomeController`\n\n\n\n\n`app/Http/Controllers/WelcomeController.php`。将其重命名为\
  \ `DashboardController.php` 并修改其内容：\n\n```\n// app/Http/Controllers/DashboardController.php\n\
  \nnamespace App\\Http\\Controllers;\n\nclass DashboardController extends Controller\
  \ {\n  public function indexAction() {\n    return view('dashboard');\n  }\n}\n\
  ```\n\n我们还将 `resources/views/welcome.blade.php` 模板文件移动到 `dashboard.blade.php`，并从之前的代码中复制我们的\
  \ `dashboard.phtml`：\n\n```\n@extends('layouts.layout')\n\n@section('content')\n\
  <div class=\"jumbotron\">\n  <h1>Welcome to CleanPhp Invoicer!</h1>\n  <p>\n   \
  \ 这是《The Clean Architecture in PHP》书的案例研究项目，\n    这是一本关于编写优秀 PHP 代码的书。\n  </p>\n\
  \  <p>\n    <a href=\"https://leanpub.com/cleanphp\" class=\"btn btn-primary\">\n\
  \      查看书籍</a>\n  </p>\n</div>\n@stop\n```\n\nLaravel 附带了一个名为 [Blade](http://laravel.com/docs/templates)\
  \ 的模板引擎。在上面的示例中，我们有一个 Blade 模板扩展了另一个名为 `layouts.layout` 的模板，这将是整体布局。接下来，我们定义了一个名为\
  \ `content` 的部分，其中包含模板的实际内容。\n\n现在让我们创建布局，这样我们就能看到 Blade 是如何合并这两者的。我们将将其放在 `resources/views/layouts/layout.blade.php`：\n\
  \n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n\
  \  <title>CleanPhp</title>\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\
  >\n  <link href=\"//maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css\"\
  \n    media=\"screen\" rel=\"stylesheet\" type=\"text/css\">\n  <link href=\"/css/application.css\"\
  \ media=\"screen\"\n    rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n\
  <nav class=\"navbar navbar-default navbar-fixed-top\" role=\"navigation\">\n  <div\
  \ class=\"container\">\n    <div class=\"navbar-header\">\n      <a class=\"navbar-brand\"\
  \ href=\"/\">CleanPhp</a>\n    </div>\n    <div class=\"collapse navbar-collapse\"\
  >\n      <ul class=\"nav navbar-nav\">\n        <li>\n          <a href=\"/customers\"\
  >Customers</a>\n        </li>\n        <li>\n          <a href=\"/orders\">Orders</a>\n\
  \        </li>\n        <li>\n          <a href=\"/invoices\">Invoices</a>\n   \
  \     </li>\n      </ul>\n    </div>\n  </div>\n</nav>\n<div class=\"container\"\
  >\n  <?php if (Session::has('success')): ?>\n  <div class=\"alert alert-success\"\
  ><?= Session::get('success') ?></div>\n  <?php endif; ?>\n  @yield('content')\n\
  \  <hr>\n  <footer>\n    <p>I'm the footer.</p>\n  </footer>\n</div>\n</body>\n\
  </html>\n```\n\n这个布局文件与我们在 ZF2 中的布局大部分相同。我们正在使用 Blade 在特定位置渲染名为 `content` 的区域，该区域是在我们的\
  \ `dashboard.blade.php` 模板文件中定义的。从今后的每个模板都将定义这个 `content` 部分。\n\n我们还使用了 Laravel\
  \ 的 `Session` 门面从会话中获取数据，特别是我们需要向用户提示某些很棒的事情发生时的闪存消息（flash message）（我们稍后在开始处理其他控制器时会介绍）。\n\
  \n最后我们需要更新的是仪表板的路由。Laravel 路由存储在 `app/Http/routes.php` 文件中。目前定义的唯一路由仍然指向已失效的 `WelcomeController`。让我们修复它：\n\
  \n```\nRoute::get('/', 'DashboardController@indexAction');\n```\n\n现在，我们正在指示 Laravel\
  \ 在对 `/` 发送 GET 请求时渲染 `DashboardController::indexAction()`。\n\n在浏览器中尝试一下。你应该能看到我们美妙的仪表板重新运行了！\n\
  \n| ![generic\\_inbar](img/leanpub_git.png) || 这将是你提交代码到源码控制系统的好地方。如果你只是在阅读，但想看到代码的运行情况，可以检标签\
  \ 15-laravel-dashboard：\n\n```\ngit clone https://github.com/mrkrstphr/cleanphp-example.git\n\
  git checkout 15-laravel-dashboard\n``` |\n\n| --- | --- |\n\n### 客户管理\n\n现在让我们转向管理客户。这次我们从定义\
  \ `CustomersController` 需要的路由开始：\n\n```\n// app/Http/routes.php\n\n// ...\n\nRoute::get('/customers',\
  \ 'CustomersController@indexAction');\nRoute::match(\n  ['get', 'post'],\n  '/customers/new',\n\
  \  'CustomersController@newOrEditAction'\n);\nRoute::match(\n  ['get', 'post'],\n\
  \  '/customers/edit/{id}',\n  'CustomersController@newOrEditAction'\n);\n```\n\n\
  这些新路由设置了我们在 Zend Framework 中规划的动作。所以让我们复制我们的 `CustomersController`：\n\n```\n// app/Http/Controllers/CustomersController.php\n\
  \nnamespace App\\Http\\Controllers;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse Illuminate\\Routing\\Controller;\n\nclass CustomersController\
  \ extends Controller {\n  private $customerRepository;\n\n  public function __construct(\n\
  \    CustomerRepositoryInterface $customerRepository\n  ) {\n    $this->customerRepository\
  \ = $customerRepository;\n  }\n\n  public function indexAction() {\n    $customers\
  \ = $this->customerRepository->getAll();\n    return view('customers/index', ['customers'\
  \ => $customers]);\n  }\n\n  // ...\n}\n```\n\n这个基础控制器看起来和在 ZF2 中几乎几乎一样，尽管缺少了一些内容（目前如此）。Laravel\
  \ 附带了一个非常强大的 [Service Container](http://laravel.com/docs/container)，它可以很好地处理依赖注入。当\
  \ `CustomersController` 被实例化时，它会自动会在容器中搜索 `CustomerRepositoryInterface`，如果找到则加载它。如果没有找到，它将尝试实例化接口。\n\
  \n所以我们接做的下一件事是为 `CustomerRepositoryInterface` 获取一个入口。我们将在 `app/Providers/AppServiceProvider.php`\
  \ 文件中执行：\n\n```\n// app/Providers/AppServiceProvider.php\n\nnamespace App\\Providers;\n\
  \nuse CleanPhp\\Invoicer\\Domain\\Repository\\CustomerRepositoryInterface;\nuse\
  \ CleanPhp\\Invoicer\\Persistence\\Doctrine\\Repository\\CustomerRepository;\nuse\
  \ Illuminate\\Support\\ServiceProvider;\n\nclass AppServiceProvider extends ServiceProvider\
  \ {\n  public function register() {\n    $this->app->bind(\n      CustomerRepositoryInterface::class,\n\
  \      function ($app) {\n        return new CustomerRepository(\n          $app['Doctrine\\\
  ORM\\EntityManagerInterface']\n        );\n      }\n    );\n  }\n}\n```\n\n我们使用\
  \ `CustomerRepositoryInterface` 的完全限定命名空间向服务管理器绑定了一个项，并使用了对象的 `::class` 关键字（如果我们重构并重命名该类，就不必担心基于字符串的引用）。调用时，该项将返回一个实例化的\
  \ `CustomerRepository`，并传递 Doctrine 的 `EntityManager` 实例，它来自我们之前设置的 Doctrine Provider。\n\
  \n这就是我们实例化控制器所需的所有工作。Laravel 会处理剩下的部分！\n\n让我们继续创建客户列表。\n\n#### 客户列表\n\n我们先从客户列表（`/customers`\
  \ 路由，对应 `indexAction()`）开始。\n\n在 `CustomersController` 中添加我们的 `indexAction()`：\n\
  \n```\npublic function indexAction() {\n  $customers = $this->customerRepository->getAll();\n\
  \  return view('customers/index', ['customers' => $customers]);\n}\n```\n\n就像在 ZF2\
  \ 中一样，我们从 `CustomersRepository` 获取所有客户并将它们传递给视图。我们正在使用 Laravel 的 `view()` 辅助函数定义要渲染的模板以及提供给它的数据。\n\
  \n让我们创建视图 `resources/views/customers/index.blade.php`：\n\n\n\n` 标签内仅包含了一段 PHP 模板代码，而没有包含需要翻译的“重新排版后的文本”部分的英文内容。\n\
  \n根据您的要求，我为您翻译了**示例中对应的逻辑描述部分**。如果您有完整的文本需要翻译，请重新提供。\n\n以下是针对您提供的代码描述部分的翻译：\n\n\
  [content]\n\n#### 模板 `customers.blade.php`\n\n就像在 `dashboard.blade.php` 中一样，我们声明此模板扩展了\
  \ `layouts/layout.blade.php`，并定义了一个名为“content”的区块，包含我们的实际视图。\n\n新新之处在于使用了 Blade\
  \ 模板语法。我们没有使用 `echo` 语句，而是将想要打印的变量包裹在 `{{{ }}}` 中，这是 Laravel 的转义和输出语法。这通过过滤用户输入数据保护我们免受\
  \ XSS 注入。\n\n现在，如果我们导航到 `Customers` 页面或手动访问 `/customers`，我们应该看到一个填充了客户信息的网格。\n\n\
  #### 添加和编辑客户\n\n接下来，我们将重新创建添加和编辑客户的能力。为了实现这一点，我们需要更多的依赖，即我们的 `CustomerInputFilter`\
  \ 和 `Customer` 对象填充器（hydrator）。\n\n这些类存在于我们的 `core/` 目录，但它们依赖于某些 Zend Framework\
  \ 库。开发 ZF2 时，我们特意将这些类放在 `src/` 目录中，而不是 `module/` 目录结构中，以便我们可以重用它们。\n\nZF2 组织为组件集合。具体来说，我们需要\
  \ `Zend InputFilter` 和 `Zend StdLib`（包含填充器类）组件。遗憾的是，ZF2 的模块化并没有它声称的程度。这两个库实际上依赖于\
  \ `Zend ServiceManager` 和 `Zend I18N` 库，但它们没有在 `composer.json` 文件的 `require` 块中声明这一点。\n\
  \n这完全是胡扯。我们需要引入所有的库：\n\n```\ncomposer require zendframework/zend-inputfilter \\\n\
  \  zendframework/zend-servicemanager \\\n  zendframework/zend-i18n \\\n  zendframework/zend-stdlib\n\
  ```\n\n一旦我们的 Laravel 应用运行起来，我们可能希望重构这些组件，以使用 Laravel 对应的替代品。\n\n此时的另一个好处是，有了这些依赖项，我们的\
  \ Peridot 测试现在应该可以通过：\n\n```\n./vendor/bin/peridot specs\n```\n\n现在我们有了这些依赖项，可以将它们注入到\
  \ `CustomersController` 的构造函数中：\n\n```php\n// app/Http/Controllers/CustomersController.php\n\
  \nnamespace App\\Http\\Controllers;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse CleanPhp\\Invoicer\\Service\\InputFilter\\CustomerInputFilter;\n\
  use Zend\\Stdlib\\Hydrator\\HydratorInterface;\n\nclass CustomersController extends\
  \ Controller {\n  protected $customerRepository;\n  protected $inputFilter;\n  protected\
  \ $hydrator;\n\n  public function __construct(\n    CustomerRepositoryInterface\
  \ $customerRepository,\n    CustomerInputFilter $inputFilter,\n    HydratorInterface\
  \ $hydrator\n  ) {\n    $this->customerRepository = $customerRepository;\n    $this->inputFilter\
  \ = $inputFilter;\n    $this->hydrator = $hydrator;\n  }\n\n  // ...\n}\n```\n\n\
  Laravel 知道直接实例化 `CustomerInputFilter`，但它无法实例化接口，因此我们需要告诉它如何处理 `HydratorInterface`。让我们指示它实例化\
  \ Zend 的 `ClassMethods` 填充器来满足此依赖：\n\n```php\nuse Zend\\Stdlib\\Hydrator\\ClassMethods;\n\
  use Zend\\Stdlib\\Hydrator\\HydratorInterface;\n\nclass AppServiceProvider extends\
  \ ServiceProvider {\n  public function register() {\n    $this->app->bind(HydratorInterface::class,\
  \ function ($app) {\n      return new ClassMethods();\n    });\n\n    // ...\n \
  \ }\n}\n```\n\n现在当面对对 `HydratorInterface` 的请求时，Laravel 将直接实例化 `ClassMethods`。\n\n\
  让我们实现 `newOrEditAction()`：\n\n```php\n// app/Http/Controllers/CustomersController.php\n\
  \npublic function newOrEditAction(Request $request, $id = '') {\n  $viewModel =\
  \ [];\n\n  $customer = $id ? $this->customerRepository->getById($id) : new Customer();\n\
  \n  if ($request->getMethod() == 'POST') {\n    $this->inputFilter->setData($request->request->all());\n\
  \n    if ($this->inputFilter->isValid()) {\n      $this->hydrator->hydrate(\n  \
  \      $this->inputFilter->getValues(),\n        $customer\n      );\n\n      $this->customerRepository\n\
  \        ->begin()\n        ->persist($customer)\n        ->commit();\n\n      Session::flash('success',\
  \ 'Customer Saved');\n\n      return new RedirectResponse(\n        '/customers/'\
  \ . $customer->getId()\n      );\n    } else {\n      $viewModel['error'] = $this->inputFilter->getMessages();\n\
  \    }\n  }\n\n  $viewModel['customer'] = $customer;\n\n  return view\n```\n\n这里有很多工作要做，但它与\
  \ ZF2 代码几乎相同：\n\n1. 我们设置了 `customers.blade.php` 模板。\n2. 使用 `view()` 辅助函数传递 `$viewModel`\
  \ 数组。\n3. 如果有 ID，利用 `CustomerRepository` 获取它。\n4. 如果请求是 `GET`，实例化 `Customer` 对象。\n\
  5. 如果请求是 `POST`，使用 `CustomerInputFilter` 处理数据。\n6. 如果输入有效，填充 `$customer`，使用 `Session`\
  \ Facade 设置消息，并跳转到编辑页面。\n7. 如果输入无效，将验证错误存储在 `$viewModel` 中。\n\n为了让这些生效，我们需要在控制器顶部添加几个\
  \ `use` 语句（我建议按字母排序）：\n\n```php\nuse CleanPhp\\Invoicer\\Domain\\Entity\\Customer;\n\
  use Illuminate\\Http\\Request;\nuse Illuminate\\Support\\Facades\\Session;\nuse\
  \ Symfony\\Component\\HttpFoundation\\RedirectResponse;\n```\n\n现在，我们自然需要设置模板文件\
  \ `customers/new-edit.blade.php`：\n\n\n\n\n\n再次，我们仍然使用 Blade 模板语言，但在其他方面，此模板几乎与我们的\
  \ ZF2 项目完全一致。\n\n一些不同之处：\n\n1. 我们设置了 [CSRF](https://www.owasp.org/index.php/Cross-Site_Request_Forgery_%28CSRF%29)\
  \ 令牌，以便 Laravel 能够验证 POST 请求是真实的。\n2. 我们使用了局部模板（partial）而不是视图助手（view helper）来显示特定元素的验证错误消息。\n\
  \n为了让这些功能生效，我们需要设置该局部模板，现在让我们开始吧：\n\n```\n<!-- resources/views/validation-errors.blade.php\
  \ -->\n\n<?php if ($errors): $errors = \\Vnn\\Keyper\\Keyper::create($errors) ?>\n\
  <?php if ($errors->get($name)): ?>\n<div class=\"alert alert-danger\">\n    <?=\
  \ implode('. ', $errors->get($name)) ?>\n</div\n<?php endif; ?>\n<?php endif; ?>\n\
  ```\n\n正如我们在 ZF2 ViewHelper 中所做的那样，我们正在使用 `Keyper` 来轻松地检查嵌套错误消息。如果输入有任何错误消息，我们将用句号将它们连接起来然后使用一些\
  \ Bootstrap 样式对其进行美化格式。\n\n让我们确保已经安装了 `Keyper` 以运行此功能：\n\n```\ncomposer require\
  \ vnn/keyper\n```\n\n完成这一步后，我们现在再次拥有添加和编辑客户（Customers）的能力！\n\n| ![generic\\_inbar](img/leanpub_git.png)\
