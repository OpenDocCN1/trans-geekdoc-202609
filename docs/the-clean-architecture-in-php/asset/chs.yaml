  ``` |\n\n## Doctrine 2\n\n我们有一个使用 Zend Framework 2 编写的、运行良好的应用程序，它满足了我们的业务需求。假设由于某种原因，我们想尝试不同的方法来与数据库交互。也许我们正准备扩大规模并添加更多功能，并决定我们需要更简单的解决方案来与数据库交互。\n\
