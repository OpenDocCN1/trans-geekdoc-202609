  | --- | ---\n\n## 创建客户\n\n在我们的 HTML 中，我们有一个创建客户的按钮，引导用户进入 `/new`。让我们开始构建我们的操作操作。\n\
  \n### newAction()\n\n让我们开始构建 `newAction()` 以及对应的视图文件：\n\n```\n// modules/Application/src/Application/Controller/CustomersController.php\n\
  \nnamespace Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse Zend\\Mvc\\Controller\\AbstractActionController;\n\
  \nclass CustomersController extends AbstractActionController {\n  // ...\n\n  public\
  \ function newAction() {\n\n  }\n}\n```\n\n这个简单的控制器操作就是我们最初需要的。让我们构建我们的视图：\n\n```\n\
  <!-- module/Application/views/application/customers/new.phtml -->\n\n<div class=\"\
  page-header clearfix\">\n  <h2>New Customer</h2>\n</div>\n\n<form role=\"form\"\
  \ action=\"\" method=\"post\">\n  <div class=\"form-group\">\n    <label for=\"\
  name\">Name:</label>\n    <input type=\"text\" class=\"form-control\" name=\"name\"\
  \ id=\"name\"\n      placeholder=\"Enter Name\">\n  </div>\n  <div class=\"form-group\"\
  >\n    <label for=\"email\">Email:</label>\n    <input type=\"text\" class=\"form-control\"\
  \ name=\"email\" id=\"email\"\n      placeholder=\"Enter Email\">\n  </div>\n  <button\
  \ type=\"submit\" class=\"btn btn-primary\">Save</button>\n</form>\n```\n\n接下来，我们需要更新我们的路由来处理\
  \ `/customers/new`：\n\n```\n// module/Application/config/module.config.php\n\nreturn\
  \ [\n  'router' => [\n    'routes' => [\n      // ...\n      'customers' => [\n\
  \        // ...\n        'may_terminate' => true,\n        'child_routes' => [\n\
  \          'create' => [\n            'type' => 'Segment',\n            'options'\
  \ => [\n              'route' => '/new',\n              'defaults' => [\n      \
  \          'action' => 'new',\n              ],\n            ]\n          ],\n \
  \       ]\n      ],\n      // ...\n    ],\n  ],\n  // ...\n];\n```\n\n这个简单的子路由将结合父路由的\
  \ `/customers` 和子路由的 `/new`，从而产生我们的 `/customers/new` 路由，这将指向 `CustomersController`\
  \ 的 `newAction()`。\n\n## CustomerInputFilter\n\n我们将使用 Zend 的 `InputFilter` 来验证和清理我们的输入。你可以在[他们的文档中阅读更多关于\
  \ Zend Input Filters 的信息](http://framework.zend.com/manual/current/en/modules/zend.input-filter.intro.html)，但本质上，它们提供了一组用于验证和清理输入数据的类。\n\
  \n\n\n\n我们将 `InputFilters` 放入 `src/` 目录，因为当我们决定切换掉 Zend Framework 时，将希望使用它们。否则，我们不得不为验证输入数据构建一套全新的解决方案，虽然这也可以行，但如果不需要同时做那件事的话未免会更好。\n\
  \n我们将从编写一个规格说明（spec）开始，描述我们想要的行为。首先，我们需要一个即将创建的新的 `CustomerInputFilter` 实例来进行测试：\n\
  \n```php\n// specs/input-filter/customer.spec.php\n\nuse CleanPhp\\Invoicer\\Service\\\
  InputFilter\\CustomerInputFilter;\n\ndescribe('InputFilter\\Customer', function\
  \ () {\n  beforeEach(function () {\n      $this->inputFilter = new CustomerInputFilter();\n\
  \  });\n\n  describe('->isValid()', function () {\n    // ...\n  });\n});\n```\n\
  \n我们将关注测试 `isValid()` 方法，Zend 通过该方法来判断 `InputFilter` 的数据是否有效。我们还将使用 `setData()`\
  \ 方法为 `InputFilter` 提供一些测试数据。\n\n让我们从测试客户名称的有效性开始：\n\n```php\nit('should require\
  \ a name', function () {\n  $isValid = $this->inputFilter->isValid();\n\n  $error\
  \ = [\n    'isEmpty' => 'Value is required and can\\'t be empty'\n  ];\n\n  $messages\
  \ = $this->inputFilter\n    ->getMessages()['name'];\n\n  expect($isValid)->to->equal(false);\n\
  \  expect($messages)->to->equal($error);\n});\n```\n\n最后，我们将测试电子邮件地址的有效性。在这里，我们并不特别担心\
  \ ZF2 在我们提供无效数据时返回的精确消息，只要我们收到了某种错误数组而不是 `null` 即可：\n\n```php\nit('should require\
  \ an email', function () {\n  $isValid = $this->inputFilter->isValid();\n\n  $error\
  \ = [\n    'isEmpty' => 'Value is required and can\\'t be empty'\n  ];\n\n  $messages\
  \ = $this->inputFilter\n    ->getMessages()['email'];\n\n  expect($isValid)->to->equal(false);\n\
  \  expect($messages)->to->equal($error);\n});\n\nit('should require a valid email',\
  \ function () {\n  $scenarios = [\n    [\n      'value' => 'bob',\n      'errors'\
  \ => []\n    ],\n    [\n      'value' => 'bob@bob',\n      'errors' => []\n    ],\n\
  \    [\n      'value' => 'bob@bob.com',\n      'errors' => null\n    ]\n  ];\n\n\
  \  foreach ($scenarios as $scenario) {\n    $this->inputFilter->setData([\n    \
  \  'email' => $scenario['value']\n    ])->isValid();\n\n    $messages = $this->inputFilter\n\
  \      ->getMessages()['email'];\n\n    if (is_array($messages)) {\n      expect($messages)->to->be->a('array');\n\
  \      expect($messages)->to->not->be->empty();\n    } else {\n      expect($messages)->to->be->null();\n\
  \    }\n  }\n});\n```\n\n| 如果我们想更完整地测试有效电子邮件的 RFC，可以向测试的 `$scenarios` 列表添加一些更健壮的数据，但我们也可以\
  \ ZF2 能够很好地处理所有情况。我们只需要确保我们的 `CustomerInputFilter` 正确设置了验证规则。 |\n\n现在，让我们为客户数据编写一个新的\
  \ `InputFilter` 类：\n\n```php\n// src/Service/InputFilter/CustomerInputFilter.php\n\
  \nnamespace CleanPhp\\Invoicer\\Service\\InputFilter;\n\nuse Zend\\InputFilter\\\
  Input;\nuse Zend\\InputFilter\\InputFilter;\nuse Zend\\Validator\\EmailAddress;\n\
  \nclass CustomerInputFilter extends InputFilter {\n  public function __construct()\
  \ {\n    $name = (new Input('name'))\n      ->setRequired(true);\n\n    $email =\
  \ (new Input('email'))\n      ->setRequired(true);\n    $email->getValidatorChain()->attach(\n\
  \      new EmailAddress()\n    );\n\n    $this->add($name);\n    $this->add($email);\n\
  \  }\n}\n```\n\n### 发布客户数据\n\n我们的下一步是在 `CustomersController` 中利用这个 `CustomerInputFilter`。我们希望只在接收到\
  \ `POST` 请求时执行此操作，并且如果收到验证错误，应该将这些错误反馈给用户。让我们从编写预期行为的规格开始。\n\n首先，我们需要在测试中向 `CustomersController`\
  \ 注入 `CustomerInputFilter` 实例：\n\n```php\n// module/Application/src/Application/Controller/CustomersController.php\n\
  \nnamespace Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse CleanPhp\\Invoicer\\Service\\InputFilter\\CustomerInputFilter;\n\
  use Zend\\Mvc\\Controller\\AbstractActionController;\n\nclass CustomersController\
  \ extends AbstractActionController {\n  protected $customerRepository;\n  protected\
  \ $inputFilter;\n\n  public function __construct(\n    CustomerRepositoryInterface\
  \ $customers,\n    CustomerInputFilter $inputFilter\n  ) {\n    $this->customerRepository\
  \ = $customers;\n    $this->inputFilter = $inputFilter;\n  }\n\n  // ...\n}\n```\n\
  \n现在我们可以更新 `newAction()` 来处理 `POST` 请求：\n\n```php\n// module/Application/src/Application/Controller/CustomersController.php\n\
  \nnamespace Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse CleanPhp\\Invoicer\\Service\\InputFilter\\CustomerInputFilter;\n\
  use Zend\\Mvc\\Controller\\AbstractActionController;\n\nclass CustomersController\
  \ extends AbstractActionController {\n  protected $customerRepository;\n  protected\
  \ $inputFilter;\n\n  public function __construct(\n    CustomerRepositoryInterface\
  \ $customers,\n    CustomerInputFilter $inputFilter\n  ) {\n    $this->customerRepository\
  \ = $customers;\n    $this->inputFilter = $inputFilter;\n  }\n\n  // ...\n\n  public\
  \ function newAction() {\n    if ($this->getRequest()->isPost()) {\n      $this->inputFilter->setData($this->params()->fromPost());\n\
  \      if ($this->inputFilter->isValid()) {\n\n      } else {\n\n      }\n    }\n\
  \  }\n}\n```\n\n首先，我们确定请求是否为 `POST`。如果是，我们为 `InputFilter` 提供数据，然后检查 `InputFilter`\
  \ 是否有效，我们有两个剩余需要实现的路径：\n\n1. 数据有效\n2. 数据无效\n\n当数据有效时，我们希望将其持久化到存储库。然而然而来自 `POST`\
  \ 的数据是一个巨大的数组。我们需要用数据填充一个 `Customer` 对象。为了这一点，我们需要向控制器注入 `HydratorInterface` 实例：\n\
  \n```php\n// module/Application/src/Application/Controller/CustomersController.php\n\
  \nnamespace Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse CleanPhp\\Invoicer\\Service\\InputFilter\\CustomerInputFilter;\n\
  use Zend\\Mvc\\Controller\\AbstractActionController;\nuse Zend\\StdLib\\Hydrator\\\
  HydratorInterface;\n\nclass CustomersController extends AbstractActionController\
  \ {\n  protected $customerRepository;\n  protected $inputFilter;\n  protected $hydrator;\n\
  \n  public function __construct(\n    CustomerRepositoryInterface $customers,\n\
  \    CustomerInputFilter $inputFilter,\n    HydratorInterface $hydrator\n  ) {\n\
  \    $this->customerRepository = $customers;\n    $this->inputFilter = $inputFilter;\n\
  \    $this->hydrator = $hydrator;\n  }\n\n  // ...\n}\n```\n\n我们还需要更新控制器配置，以注入 `CustomersController`\
  \ 需要的这些对象：\n\n```php\n// module/Application/config/module.config.php\n\nuse CleanPhp\\\
  Invoicer\\Service\\InputFilter\\CustomerInputFilter;\nuse Zend\\Stdlib\\Hydrator\\\
  ClassMethods;\n\nreturn [\n  // ...\n  'controllers' => [\n    'invokables' => [\n\
  \      'Application\\Controller\\Index' =>\n        'Application\\Controller\\IndexController'\n\
  \    ],\n    'factories' => [\n      'Application\\Controller\\Customers' => function\
  \ ($sm) {\n        return new \\Application\\Controller\\CustomersController(\n\
  \          $sm->getServiceLocator()->get('CustomerTable'),\n          new CustomerInputFilter(),\n\
  \          new ClassMethods()\n        );\n      },\n    ],\n  ],\n\n  // ...\n\
  ];\n```\n\n接下来，我们将使用 hydrator 构建一个 `Customer` 对象，然后使用我们的 `CustomerRepository` 持久该客户对象：\n\
  \n```php\npublic function newAction() {\n  if ($this->getRequest()->isPost()) {\n\
  \    $this->inputFilter->setData($this->params()->fromPost());\n    if ($this->inputFilter->isValid())\
  \ {\n      $customer = $this->hydrator->hydrate(\n        $this->inputFilter->getValues(),\n\
  \        new Customer()\n      );\n\n      $this->customerRepository->begin()\n\
  \        ->persist($customer)\n        ->commit();\n    } else {\n\n      }\n  \
  \  }\n  }\n}\n```\n\n\n\n我们还需要在文件顶部为 `Customer` 类添加一个 `use` 语句。\n\n此时，我们可以在浏览器中输入一个新的\
  \ `Customer` 并将其持久化到数据库。但之后，用户会被重定向回“新建客户”页面，没有任何提示显示保存成功。\n\n让我们添加一个到 `/customers`\
  \ 页面的重定向，并添加一条闪消息（flash message）提醒他们保存成功：\n\n```php\npublic function newAction()\
  \ {\n  if ($this->getRequest()->isPost()) {\n    $this->inputFilter->setData($this->params()->fromPost());\n\
  \    if ($this->inputFilter->isValid()) {\n      // ...\n\n      $this->flashMessenger()->addSuccessMessage('Customer\
  \ Saved');\n      $this->redirect()->toUrl('/customers');\n    } else {\n\n    }\n\
  \  }\n}\n```\n\n如果你在浏览器中尝试，现在你应该会被重定向到 `/customers` 页面。为了显示闪消息，我们需要设置 `layout.phtml`\
  \ 文件来渲染闪消息。Zend 提供了一个[辅助程序](http://framework.zend.com/manual/current/en/modules/zend.view.helpers.flash-messenger.html)来轻松显示这些闪消息，但它看起来非常糟糕。我们将创建一个自己的部分文件（partial\
  \ file）来渲染它们，然后将其包含在 `layout.phtml` 文件中。\n\n```php\n<!-- view/application/partials/flash-messages.phtml\
  \ -->\n<?php\n$flash = $this->flashMessenger();\n$flash->setMessageOpenFormat('<div%s\
  \ role=\"alert\">\n   <button type=\"button\" class=\"close\"\n     data-dismiss=\"\
  alert\" aria-label=\"Close\">\n     <span aria-hidden=\"true\">&times;</span>\n\
  \   </button>\n   <div>')\n  ->setMessageSeparatorString('</div><div>')\n  ->setMessageCloseString('</div></div>');\n\
  ?>\n\n<?= $this->flashMessenger()->render(\n  'success',\n  ['alert', 'alert-dismissible',\
  \ 'alert-success']\n) ?>\n```\n\n这对现有的 Zend 辅助程序进行样式初始化，然后使用该辅助程序生成消息。\n\n让我们将其包含在\
  \ `layout.phtml` 文件中：\n\n```html\n<!-- ... ->\n<div class=\"container\">\n  <?=\
  \ $this->partial('application/partials/flash-messages') ?>\n  <?= $this->content;\
  \ ?>\n  <hr>\n  <footer>\n    <p>I'm the footer.</p>\n  </footer>\n</div>\n<!--\
  \ ... -->\n```\n\n现在，当我们创建新客户时，我们的闪消息就应该被渲染出来了。\n\n### 处理验证错误\n\n当 `InputFilter->isValid()`\
  \ 失败时，我们希望做两件事：填充（hydrate）并返回一个带有提交数据的 `Customer` 对象，以便将其持久化到表单中；并返回验证错误消息，以便显示给用户。\n\
  \n我们将使用已经注入的 `HydratorInterface`，但这次，我们不再填充来自 `InputFilter` 的清洗后的数据，而是直接填充提交的数据：\n\
  \n```php\npublic function newAction() {\n  $viewModel = new ViewModel();\n  $customer\
  \ = new Customer();\n\n  if ($this->getRequest()->isPost()) {\n    $this->inputFilter->setData($this->params()->fromPost());\n\
  \n    if ($this->inputFilter->isValid()) {\n      $this->hydrator->hydrate(\n  \
  \      $this->inputFilter->getValues(),\n        $customer\n      );\n\n      $this->customerRepository->begin()\n\
  \        ->persist($customer)\n        ->commit();\n\n      $this->flashMessenger()->addSuccessMessage('Customer\
  \ Saved');\n      $this->redirect()->toUrl('/customers');\n    } else {\n      $this->hydrator->hydrate(\n\
  \        $this->params()->fromPost(),\n        $customer\n      );\n    }\n  }\n\
  \n  $viewModel->setVariable('customer', $customer);\n\n  return $viewModel;\n}\n\
  ```\n\n不要忘记在文件顶部添加 `Zend\\View\\Model\\ViewModel` 的 `use` 语句。\n\n### 视图辅助程序 (View\
  \ Helpers)\n\nZend Framework 中的视图辅助程序是可复用的类，可以接受数据并生成 HTML。只要在服务管理器中正确配置，ZF2 就会在视图中使用它们时处理它们的实例化。\n\
  \n使用视图辅助程序涉及在视图中的 `$this` 对象上调用它们的名称：\n\n```php\n<?= $this->helperName('some data')\
  \ ?>\n```\n\n我们将创建一个视图辅助程序来帮助显示返回给视图的消息。我们的视图辅助程序将位于 `module/Application/src/View/Helper`\
  \ 目录下，并命名为 `ValidationErrors.php`：\n\n```php\nnamespace Application\\View\\Helper;\n\
  \nuse Zend\\View\\Helper\\AbstractHelper;\n\nclass ValidationErrors extends AbstractHelper\
  \ {\n  public function __invoke($element) {\n    if ($errors = $this->getErrors($element))\
  \ {\n      return '<div class=\"alert alert-danger\">' .\n        implode('. ',\
  \ $errors) .\n      '</div>';\n    }\n\n    return '';\n  }\n\n  protected function\
  \ getErrors($element) {\n    if (!isset($this->getView()->errors)) {\n      return\
  \ false;\n    }\n\n    $errors = $this->getView()->errors;\n\n    if (isset($errors[$element]))\
  \ {\n      return $errors[$element];\n    }\n\n    return false;\n  }\n}\n```\n\n\
  接下来，我们需要通过 `module.config.php` 中的服务定位器配置让 Zend 知道这个视图辅助程序：\n\n```php\nreturn [\n\
  \  // ...\n  'view_helpers' => [\n    'invokables' => [\n      'validationErrors'\
  \ => 'Application\\View\\Helper\\ValidationErrors',\n    ]\n  ],\n  // ...\n];\n\
  ```\n\n最后，我们可以更新视图文件以使用这个新的辅助程序，并显示每个字段的任何验证错误消息。\n\n\n\n\n```php\n<!-- module/Application/view/application/customers/new.phtml\
  \ -->\n<div class=\"page-header clearfix\">\n  <h2>New Customer</h2>\n</div\n\n\
  <form role=\"form\" action=\"\" method=\"post\">\n  <div class=\"form-group\">\n\
  \    <label for=\"name\">Name:</label>\n    <input type=\"text\" class=\"form-control\"\
  \ name=\"name\" id=\"name\"\n      placeholder=\"Enter Name\" value=\"<?= $this->customer->getName()\
  \ ?>\">\n    <?= $this->validationErrors('name') ?>\n  </div>\n  <div class=\"form-group\"\
  >\n    <label for=\"email\">Email:</label>\n    <input type=\"text\" class=\"form-control\"\
  \ name=\"email\" id=\"email\"\n      placeholder=\"Enter Email\" value=\"<?= $this->customer->getEmail()\
  \ ?>\">\n    <?= $this->validationErrors('email') ?>\n  </div>\n  <button type=\"\
  submit\" class=\"btn btn-primary\">Save</button>\n</form>\n```\n\n如果我们现在在不带任何数据的情况下提交表单，或者提交不符合我们验证要求的数据（例如无效的电子邮件），我们应该会在每个字段下方渲染验证错误消息。我们输入的任何数据也应该保留在输入字段中。\n\
  \n| ![generic\\_inbar](img/leanpub_git.png) || 这将是你将代码提交到源码控制的好地方。如果你只是在阅读，但想看到代码的运行，可以检出标签\
  \ 06-creating-customers： |\n\n```\ngit clone https://github.com/mrkrstphr/cleanphp-example.git\n\
  git checkout 06-creating-customers\n```\n\n### 编辑客户\n\n我们的下一步是实现对现有客户的编辑。由于这段代码与我们创建客户的代码非常相似，我们将使用相同的\
  \ action 并对其进行稍微修改，以处理新客户和现有客户。\n\n让我们首先开始将 `newAction()` 重构为 `newOrEditAction()`，并在继续之前确保它仍然可以工作。让我们从\
  \ `CustomersController` 开始：\n\n```php\n// module/Application/src/Application/Controller/CustomersController.php\n\
  \n// ...\n\nclass CustomersController extends AbstractActionController {\n  // ...\n\
  \n  public function newOrEditAction() {\n    // ...\n  }\n}\n```\n\n接下来，我们将更新路由配置以指向这个新的\
  \ action，并顺便添加编辑 action：\n\n```php\n// module/Application/config/module.config.php\n\
  \nreturn [\n  'router' => [\n    'routes' => [\n      // ...\n\n      'customers'\
  \ => [\n        'type' => 'Segment',\n        'options' => [/* ... */],\n      \
  \  'may_terminate' => true,\n        'child_routes' => [\n          'new' => [\n\
  \            'type' => 'Segment',\n            'options' => [\n              'route'\
  \ => '/new',\n              'constraints' => [\n                'id' => '[0-9]+',\n\
  \              ],\n              'defaults' => [\n                'action' => 'new-or-edit',\n\
  \              ],\n            ]\n          ],\n          'edit' => [\n        \
  \    'type' => 'Segment',\n            'options' => [\n              'route' =>\
  \ '/edit/:id',\n              'constraints' => [\n                'id' => '[0-9]+',\n\
  \              ],\n              'defaults' => [\n                'action' => 'new-or-edit',\n\
  \              ],\n            ]\n          ],\n        ]\n      ],\n\n      //\
  \ ...\n    ],\n  ],\n];\n```\n\n最后，让我们重命名我们的 `view/application/customers/new-or-edit.phtml`\
  \ 文件为 `module/Application/view/application/customers/new-or-edit.phtml`。此时，我们的*创建客户*按钮和\
  \ action 应该仍然可以工作。如果我们点击 `indexAction()` 中某行的 id，我们也应该在浏览器中得到一个表单，只是缺少我们的数据。让我们修复它。\n\
  \n我们要做的第一件事是检查通过 URL 传递的 ID。如果有 ID，我们应该从 `CustomerRepository` 获取一个 `Customer` 对象。如果没有\
  \ ID，我们应该实例化一个新的 `Customer`。\n\n`Customer` 对象将使用该 ID 获取：\n\n```php\n$id = $this->params()->fromRoute('id');\n\
  if ($id) {\n    $customer = $this->customerRepository->find($id);\n} else {\n  \
  \  $customer = new Customer();\n}\n```\n\n（注：原文后续包含大量重复且碎片化的句子，已根据提供的代码片段清理了逻辑流。）\n\
  \n\n\n\n如果你刷新页面，你应该看到一个空的网格！如果我们手动在数据库中放入几条订单，我们应该能看到一些数据出现。并且有一个巨大的错误，因为我们正尝试访问与\
  \ `Order` 关联的 `Customer`，但我们实际上并没有对它进行填充（hydrate）。\n\n这就是我们开始看到 ZF2 `Data Table\
  \ Gateway` 陷阱的地方。但为了完成任务，让我们继续吧。\n\n### 填充关联的 Customer\n\n为了填充与 `Order` 关联的 `Customer`，我们必须构建一个自定义的填充器（hydrator）。为此，我们只需封装我们已经在使用的\
  \ Zend `ClassMethods` 填充器，并为其添加一些额外的功能。\n\n我们将从编写一个规格说明测试（spec）来描述我们需要的功能开始：\n\n\
  ```php\n// specs/hydrator/order.spec.php\n\nuse CleanPhp\\Invoicer\\Domain\\Entity\\\
  Order;\nuse CleanPhp\\Invoicer\\Persistence\\Hydrator\\OrderHydrator;\nuse Zend\\\
  Stdlib\\Hydrator\\ClassMethods;\n\ndescribe('Persistence\\Hydrator\\OrderHydrator',\
  \ function () {\n  beforeEach(function() {\n    $this->hydrator = new OrderHydrator(new\
  \ ClassMethods());\n  });\n\n  describe('->hydrate()', function () {\n    it('should\
  \ perform basic hydration of attributes', function () {\n      $data = [\n     \
  \   'id' => 100,\n        'order_number' => '20150101-019',\n        'description'\
  \ => 'simple order',\n        'total' => 500\n      ];\n\n      $order = new Order();\n\
  \      $this->hydrator->hydrate($data, $order);\n\n      expect($order->getId())->to->equal(100);\n\
  \      expect($order->getOrderNumber())->to->equal('20150101-019');\n      expect($order->getDescription())->to->equal('simple\
  \ order');\n      expect($order->getTotal())->to->equal(500);\n    });\n  });\n\
  });\n```\n\n第一个测试用例是确保我们的 `OrderHydrator` 对我们的标量值执行基础填充。我们将这项工作交给 `ClassMethods`\
  \ 填充器，因为在这方面它表现很好。接下来，我们需要处理在 `Order` 上持久化 `Customer` 对象的用例：\n\n```php\nuse CleanPhp\\\
  Invoicer\\Domain\\Entity\\Customer;\nuse CleanPhp\\Invoicer\\Domain\\Entity\\Order;\n\
  use CleanPhp\\Invoicer\\Persistence\\Hydrator\\OrderHydrator;\nuse Zend\\Stdlib\\\
  Hydrator\\ClassMethods;\n\ndescribe('Persistence\\Hydrator\\OrderHydrator', function\
  \ () {\n  beforeEach(function() {\n    $this->repository = $this->getProphet()->prophesize(\n\
  \      'CleanPhp\\Invoicer\\Domain\\Repository\\CustomerRepositoryInterface'\n \
  \   );\n    $this->hydrator = new OrderHydrator(\n      new ClassMethods(),\n  \
  \    $this->repository->reveal()\n    );\n  });\n\n  describe('->hydrate()', function\
  \ () {\n    // ...\n\n    it('should hydrate a entity on the Order', function ()\
  \ {\n      $data = [\n        'customer_id' => 500\n      ];\n\n      $customer\
  \ = (new Customer())->setId(500);\n      $order = new Order();\n\n      $this->repository->getById(500\n\
  \        ->shouldCalled()\n        ->willReturn($customer);\n\n      $this->hydrator->hydrate($data,\
  \ $order);\n\n      expect($order->getCustomer())->to->equal($customer);\n\n   \
  \   $this->getProphet()->checkPredictions();\n    });\n  });\n});\n```\n\n我们为填充器添加了一个\
  \ `CustomerRepositoryInterface` 实例的依赖。当我们在正在填充的数据中找到 `customer_id` 值时，我们将使用它来查询客户记录。现在它是被模拟（mocked）并注入到构造函数中的。我们的测试通过检查\
  \ `$order->getCustomer()` 的值并确保它与我们模拟 `CustomerRepository` 返回的客户相同，从而正确验证了这一点。\n\
  \n现在构建这个类并让我们的测试运行起来！\n\n```php\n// src/Persistence/Hydrator/OrderHydrator.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Hydrator;\n\nuse CleanPhp\\Invoicer\\\
  Domain\\Repository\\CustomerRepositoryInterface;\nuse Zend\\Stdlib\\Hydrator\\HydratorInterface;\n\
  \nclass OrderHydrator implements HydratorInterface {\n  protected $wrappedHydrator;\n\
  \  protected $customerRepository;\n\n  public function __construct(\n    HydratorInterface\
  \ $wrappedHydrator,\n    CustomerRepositoryInterface $customerRepository\n  ) {\n\
  \    $this->wrappedHydrator = $wrappedHydrator;\n    $this->customerRepository =\
  \ $customerRepository;\n  }\n\n  public function extract($object) { }\n\n  public\
  \ function hydrate(array $data, $order) {\n    $this->wrappedHydrator->hydrate($data,\
  \ $order);\n\n    if (isset($data['customer_id'])) {\n      $order->setCustomer(\n\
  \        $this->customerRepository->getById($data['customer_id'])\n      );\n  \
  \  }\n\n    return $order;\n  }\n}\n```\n\n这个简单的功能工作方式正如我们在测试中规划的那样。我们使用 `ClassMethods()`\
  \ 填充器为我们完成大部分工作。当存在 `customer_id` 值时，我们查询 `CustomerRepository` 获取该客户，并将其设置在 `Order`\
  \ 对象上。\n\n\n\n\n另一种方案是为 `/view/:id` 添加一个显式的子路由。无论哪种方式，如果用户导航到不存在的子路由（例如 `/orders/steal-all-the-gold`），都会导致\
  \ 404 错误。\n\n```php\n// module/Application/config/module.config.php\n\nreturn [\n\
  \  // ...\n  'router' =>\n    'routes' => [\n      // ...\n      'orders' => [\n\
  \        'type' => 'Segment',\n        'options' => [\n          'route' => '/orders[/:action[/:id]]',\n\
  \          'defaults' => [\n            'controller' => 'Application\\Controller\\\
  Orders',\n            'action' => 'index',\n          ],\n        ],\n      ],\n\
  \      // ...\n    ],\n  ]\n];\n```\n\n现在，我们需要在 `OrdersController` 中编写控制器动作来处理此路由：\n\
  \n```php\npublic function viewAction() {\n  $id = $this->params()->fromRoute('id');\n\
  \  $order = $this->orderRepository->getById($id);\n\n  return [\n    'order' =>\
  \ $order\n  ];\n}\n```\n\n`viewAction()` 非常简单：我们从路由参数中获取 ID，从注入到控制器的 `$orderRepository`\
  \ 中查询该 `Order`，并将其返回给视图。\n\n最后，我们需要一个视图文件来显示我们的订单数据：\n\n```html\n<!-- module/Application/views/application/orders/view.phtml\
  \ -->\n<div class=\"page-header clearfix\">\n  <h2>订单 # #<?= $this->escapeHtml($this->order->getOrderNumber())\
  \ ?></h2>\n</div>\n\n<table class=\"table table-striped\">\n  <thead>\n    <tr>\n\
  \      <th colspan=\"2\">订单详情</th>\n    </tr>\n  </thead>\n  <tr>\n    <th>客户：</th>\n\
  \    <td>\n      <a href=\"/customers/edit/<?=\n        $this->escapeHtmlAttr($this->order->getCustomer()->getId())\
  \ ?>\">\n        <?= $this->escapeHtml($this->order->getCustomer()->getName()) ?></a>\n\
  \    </td>\n  </tr>\n  <tr>\n    <th>描述：</th>\n    <td><?= $this->escapeHtml($this->order->getDescription())\
  \ ?></td>\n  </tr>\n  <tr>\n    <th>总计：</th>\n    <td>$ <?= number_format($this->order->getTotal(),\
  \ 2) ?></td>\n  </tr>\n</table>\n```\n\n这个简单的视图只是使用表格列出我们 `Order` 的详情，并提供一个返回 `Customer`\
  \ 记录的链接。它非常简单。但当我们导航到一个数据库中不存在的 ID 时会发生什么？我们将得到巨大的错误。\n\n让我们通过抛出 404 来处理这种情况：\n\n\
  ```php\n$order = $this->orderRepository->getById($id);\n\nif (!$order) {\n  $this->getResponse()->setStatusCode(404);\n\
  \  return null;\n}\n```\n\n如果我们没有获取到 `Order` 对象（而是获取了 `null`），我们只需获取对象上存储的响应，将其设置为\
  \ 404 并返回（以停止处理）。我们可以在浏览器中通过访问不存在的订单 ID 来检查这一点。\n\n### 创建订单\n\n创建 `Order` 的过程与创建\
  \ `Customer` 非常相似。我们首先为我们的 `OrderFilter` 编写一个规范（spec），我们将用它来验证这些数据：\n\n```php\n\
  // specs/input-filter/order.spec.php\n\nuse CleanPhp\\Invoicer\\Service\\InputFilter\\\
  OrderFilter;\n\ndescribe('InputFilter\\Order', function () {\n  beforeEach(function\
  \ () {\n    $this->inputFilter = new OrderFilter();\n  });\n\n  describe('isValid()',\
  \ function () {\n    // ...\n  });\n});\n```\n\n我们只是在设置新的 `OrderFilter` 实例，以便在规范中使用它。我们必须测试\
  \ `isValid()` 块中的每个元素，因此让我们从测试 `customer_id` 开始：\n\n```php\nit('should require a\
  \ customer', function () {\n  $isValid = $this->inputFilter->isValid();\n\n  $error\
  \ = [\n    'id' => 'Value is required and can’t empty'\n  ];\n\n  $customer = $this->inputFilter\n\
  \    ->getMessages()['customer'];\n\n  expect($isValid)->to->equal(false);\n  expect($customer)->to->equal($error);\n\
  });\n```\n\n对于 `customer_id`，我们只感兴趣确保它已被提供。在将来，我们也可以并且应该验证所提供的值确实是一个客户。当我们构建表单时，我们将不再使用数据库值（`customer_id`），而是将使用关联关系，这意味着我们将通过\
  \ POST 数据查找 `customer[id]`，因此我们的输入过滤器将把 `customer` 视为一个数组。我们在这里使用 Zend 框架中 `Required`\
  \ 验证器的逻辑进行测试。显然，如果我们以后切换了库，将必须更新规范以符合它们提供的格式。\n\n接下来是 `orderNumber`：\n\n```php\n\
  it('should require an order number', function () {\n  $isValid = $this->inputFilter->isValid();\n\
  \n  $error = [\n    'isEmpty' => 'Value is required and can’t empty'\n  ];\n\n \
  \ $orderNo = $this->inputFilter\n    ->getMessages()['orderNumber'];\n\n  expect($isValid)->to->equal(false);\n\
  \  expect($orderNo)->to->equal($error);\n});\n```\n\n在这里，我们只是在验证 `orderNumber` 值是否已被提供。同样，我们使用的是领域语言\
  \ `orderNumber`，而不是数据库列 `order_number`。我们还想确保它符合正好 13 个字符长度的限制条件：\n\n```php\nit('should\
  \ require order numbers be 13 chars', function () {\n  $scenarios = [\n    [\n \
  \     'value' => '124',\n      'errors' => [\n        'stringLengthShort' =>\n \
  \         'The input is less than 13 characters long'\n      ]\n    ],\n    [\n\
  \      'value' => '20001020-0123XR',\n      'errors' => [\n        'stringLengthLong'\
  \ =>\n          'The input is more than 13 characters long'\n      ]\n    ],\n \
  \   [\n      'value' => '200407171841',\n      'errors' => null\n    ]\n  ];\n\n\
  \  foreach ($scenarios as $scenario) {\n    $this->inputFilter = new OrderFilter();\n\
  \    $this->inputFilter->setData([\n      'orderNumber' => $scenario['value']\n\
  \    ])->isValid();\n\n    $messages = $this->inputFilter\n      ->getMessages()['orderNumber'];\n\
  \n    expect($messages)->to->equal($scenario['errors']);\n  }\n});\n```\n\nenarios\
  \ 变量列出了不同的场景，以及在每种场景下预期的错误。接下来，我们将测试 `description`：\n\n```php\nit('should require\
  \ a description', function () {\n  $isValid = $this->inputFilter->isValid();\n\n\
  \  $error = [\n    'isEmpty' => 'Value is required and can’t empty'\n  ];\n\n  $messages\
  \ = $this->inputFilter\n    ->getMessages()['description'];\n\n  expect($isValid)->to->equal(false);\n\
  \  expect($messages)->to->equal($error);\n});\n```\n\n最后，我们将测试 `total`，并确保它是浮点数值：\n\
  \n```php\nit('should require a total', function () {\n  $isValid = $this->inputFilter->isValid();\n\
  \n  $error = [\n    'isEmpty' => 'Value is required and can’t empty'\n  ];\n\n \
  \ $messages = $this->inputFilter\n    ->getMessages()['total'];\n\n  expect($isValid)->to->equal(false);\n\
  \  expect($messages)->to->equal($error);\n});\n\nit('should require total to be\
  \ a float value', function () {\n  $scenarios = [\n    [\n      'value' => 124,\n\
  \      'errors' => null\n    ],\n    [\n      'value' => 'asdf',\n      'errors'\
  \ => [\n          'notFloat' =>\n            'The input does not appear to be a\
  \ float'\n      ]\n    ],\n    [\n      'value' => 99.99,\n      'errors' => null\n\
  \    ]\n  ];\n\n  foreach ($scenarios as $scenario) {\n    $this->inputFilter =\
  \ new OrderFilter();\n    $this->inputFilter->setData([\n      'total' => $scenario['value']\n\
  \    ])->isValid();\n\n    $messages = $this->inputFilter\n      ->getMessages()['total'];\n\
  \n    expect($messages)->to->equal($scenario['errors']);\n  }\n});\n```\n\n我们再次提供了一组场景列表，并检查每一个场景，以确保我们获得预期的错误信息，或者在输入有效的情况下没有错误信息。现在我们已经定义了规范，让我们开始编写输入过滤器吧：\n\
  \n\n\n\n```\n// src/Service/InputFilter/OrderInputFilter.php\n\nnamespace CleanPhp\\\
  Invoicer\\Service\\InputFilter;\n\nuse Zend\\I18n\\Validator\\IsFloat;\nuse Zend\\\
  InputFilter\\Input;\nuse Zend\\InputFilter\\InputFilter;\nuse Zend\\Validator\\\
  StringLength;\n\nclass OrderInputFilter extends InputFilter {\n  public function\
  \ __construct() {\n    $customer = (new InputFilter());\n    $id = (new Input('id'))\n\
  \      ->setRequired(true);\n    $customer->add($id);\n\n    $orderNumber = (new\
  \ Input('orderNumber'))\n      ->setRequired(true);\n    $orderNumber->getValidatorChain()->attach(\n\
  \      new StringLength(['min' => 13, 'max' => 13])\n    );\n\n    $description\
  \ = (new Input('description'))\n      ->setRequired(true);\n\n    $total = (new\
  \ Input('total'))\n       ->setRequired(true);\n    $total->getValidatorChain()->attach(new\
  \ IsFloat());\n\n    $this->add($customer, 'customer');\n    $this->add($orderNumber);\n\
  \    $this->add($description);\n    $this->add($total);\n  }\n}\n```\n\n这些验证规则与我们在测试中指定的匹配，在有了这些代码后测试应该能够通过。\n\
  \n这里唯一值得注意的特殊之处是，我们为 `customer[id]` 嵌套了一个 `InputFilter`，并将 `$customer` 过滤器作为名为 `customer`\
  \ 的 `InputFilter` 添加进去，这样 Zend 就能理解我们在 POST 中返回的嵌套数据并对其进行正确的验证。\n\n### OrdersController::newAction()\n\
  \n现在我们已经有了 `OrderInputFilter`，可以开始编写 `OrdersController` 中的 `newAction()` 方法了。\n\n\
  在创建新订单时，我们需要向视图提供一个客户（Customers）列表，以便用户选择该订单属于哪个客户。为了实现，我们必须向控制器中注入 `CustomerRepositoryInterface`\
  \ 的实例。\n\n```\n// module/Application/src/Application/Controller/OrdersController.php\n\
  \nnamespace Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse CleanPhp\\Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\n\
  use Zend\\Mvc\\Controller\\AbstractActionController;\n\nclass OrdersController extends\
  \ AbstractActionController {\n  protected $orderRepository;\n  protected $customerRepository;\n\
  \n  public function __construct(\n    OrderRepositoryInterface $orderRepository,\n\
  \    CustomerRepositoryInterface $customerRepository\n  ) {\n    $this->orderRepository\
  \ = $orderRepository;\n    $this->customerRepository = $customerRepository;\n  }\n\
  \n  // ...\n}\n```\n\n我们需要更新控制器配置，以传递一个 `CustomerRepositoryInterface` 实例：\n\n```\n\
  // module/Application/config/module.config.php\n\nreturn [\n  // ...\n  'controllers'\
  \ => [\n    // ...\n\n    'factories' => [\n      // ...\n      'Application\\Controller\\\
  Orders' => function ($sm) {\n        return new \\Application\\Controller\\OrdersController(\n\
  \          $sm->getServiceLocator()->get('OrderTable'),\n          $sm->getServiceLocator()->get('CustomerTable')\n\
  \        );\n      },\n    ],\n  ],\n  // ...\n];\n```\n\n现在我们有了 `CustomerRepositoryInterface`\
  \ 的实例，可以使用它来为视图提供客户列表以供选择并创建订单：\n\n```php\npublic function newAction() {\n  $viewModel\
  \ = new ViewModel();\n  $order = new Order();\n\n  $viewModel->setVariable(\n  \
  \  'customers',\n    $this->customerRepository->getAll()\n  );\n  $viewModel->setVariable('order',\
  \ $order);\n\n  return $viewModel;\n}\n```\n\n这应该是让 GET 操作正常工作所需的最少代码。别忘了为 `Zend\\\
  View\\ViewModel` 类添加一些 `use` 语句，创建 `new.phtml` 文件：\n\n```html\n<!-- module/Application/view/orders/new.phtml\
  \ -->\n<div class=\"page-header\">\n  <h2>创建订单</h2>\n</div>\n\n<form role=\"form\"\
  \ action=\"\" method=\"post\">\n  <div class=\"form-group\">\n    <label for=\"\
  customer_id\">客户:</label>\n    <select class=\"form-control\" name=\"customer[id]\"\
  \ id=\"customer_id\">\n      <option value\"></option>\n      <?php foreach ($customers\
  \ as $customer): ?>\n      <option value=\"<?= $this->escapeHtml($customer->getId())\
  \ ?>\"\n        <?= $order->getCustomer() == $customer ? 'selected' : '' ?>>\n \
  \       <?= $this->escapeHtml($customer->getName()) ?>\n      </option>\n      <?php\
  \ endforeach; ?>\n    </select>\n  </div>\n  <div class=\"form-group\">\n    <label\
  \ for=\"orderNumber\">订单编号:</label>\n    <input type=\"text\" class=\"form-control\"\
  \ name=\"orderNumber\"\n      id=\"orderNumber\" placeholder=\"订单编号\"\n      value=\"\
  <?= $this->escapeHtml($order->getOrderNumber()) ?>\">\n  </div>\n  <div class=\"\
  form-group\">\n    <label for=\"description\">描述:</label>\n    <input type=\"text\"\
  \ class=\"form-control\" name=\"description\"\n      id=\"description\" placeholder=\"\
  描述\"\n      value=\"<?= $this->escapeHtml($order->getDescription()) ?>\">\n  </div>\n\
  \  <div class=\"form-group\">\n    <label for=\"total\">总金额:</label>\n    <input\
  \ type=\"text\" class=\"form-control\" name=\"total\"\n      id=\"total\" placeholder=\"\
  总金额\"\n      value=\"<?= $this->escapeHtml($order->getTotal()) ?>\">\n  </div>\n\
  \  <button type=\"submit\" class=\"btn btn-primary\">保存</button>\n</form>\n```\n\
  \n我们使用由 `ViewModel` 提供的 `$order` 对象来填充表单。当然，此时我们还没有数据来填充客户下拉框。如果我们在浏览器中访问 `/orders/new`，将会看到我们的工作。当我们点击“保存”按钮时，页面看起来是一样的。可能是时候处理\
  \ POST 数据了。\n\n### 处理 POST 数据\n\n为了方便保存数据，我们需要向控制器注入我们的 `OrderInputFilter` 实例以便验证\
  \ POST 数据，并注入一个 `OrderHydrator` 实例来填充数据：\n\n```php\n// module/Application/src/Application/Controller/OrdersController.php\n\
  \nnamespace Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Entity\\\
  Order;\nuse CleanPhp\\Invoicer\\Domain\\Repository\\CustomerRepositoryInterface;\n\
  use CleanPhp\\Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\nuse CleanPhp\\\
  Invoicer\\Persistence\\Hydrator\\OrderHydrator;\nuse CleanPhp\\Invoicer\\Service\\\
  InputFilter\\OrderInputFilter;\nuse Zend\\Mvc\\Controller\\AbstractActionController;\n\
  use Zend\\View\\Model\\ViewModel;\n\nclass OrdersController extends AbstractActionController\
  \ {\n  protected $orderRepository;\n  protected $customerRepository;\n  protected\
  \ $inputFilter;\n  protected $hydrator;\n\n  public function __construct(\n    OrderRepositoryInterface\
  \ $orderRepository,\n    CustomerRepositoryInterface $customerRepository,\n    OrderInputFilter\
  \ $inputFilter,\n    OrderHydrator $hydrator\n  ) {\n    $this->orderRepository\
  \ = $orderRepository;\n    $this->customerRepository = $customerRepository;\n  \
  \  $this->inputFilter = $inputFilter;\n    $this->hydrator = $hydrator;\n  }\n\n\
  \  // ...\n}\n```\n\n如果这看起来注入到控制器中的内容太多，那可能确实如此。解决方案是将此控制器拆分为多个职责更小、操作更少的控制器。或者你也可以研究不同的模式，例如\
  \ Paul Jones 的 [Action-Domain-Responder](https://github.com/pmjones/adr)。目前，我将坚持这个控制器。\n\
  \n接下来，让我们更新 `controllers` 配置以注入一个 `OrderInputFilter`：\n\n\n\n\n\n```php\n// module/Application/config/module.config.php\n\
  \nuse CleanPhp\\Invoicer\\Service\\InputFilter\\OrderInputFilter;\n\nreturn [\n\
  \  // ...\n  'controllers' => [\n    'invokables' => [\n      'Application\\Controller\\\
  Index' =>\n        'Application\\Controller\\IndexController'\n    ],\n    'factories'\
  \ => [\n      // ...\n      'Application\\Controller\\Orders' => function ($sm)\
  \ {\n        return new \\Application\\Controller\\OrdersController(\n         \
  \ $sm->getServiceLocator()->get('OrderTable'),\n          $sm->getServiceLocator()->get('CustomerTable'),\n\
  \          new OrderInputFilter(),\n          $sm->getServiceLocator()->get('OrderHydrator')\n\
  \        );\n      },\n    ],\n  ],\n  // ...\n];\n```\n\n现在我们的 `OrdersController`\
  \ 已经拥有了运行所需的所有组件。让我们更新 `newAction()` 以利用这些组件来处理提交的数据：\n\n```php\npublic function\
  \ newAction() {\n  $viewModel = new ViewModel();\n  $order = new Order();\n\n  if\
  \ ($this->getRequest()->isPost()) {\n      $this->inputFilter\n        ->setData($this->params()->fromPost());\n\
  \n      if ($this->inputFilter->isValid()) {\n        $order = $this->hydrator->hydrate(\n\
  \          $this->inputFilter->getValues(),\n          $order\n        );\n\n  \
  \      $this->orderRepository->begin()\n            ->persist($order)\n        \
  \    ->commit();\n\n        $this->flashMessenger()->addSuccessMessage('Order Created');\n\
  \        $this->redirect()->toUrl('/orders/view/' . $order->getId());\n      } else\
  \ {\n        $this->hydrator->hydrate(\n          $this->params()->fromPost(),\n\
  \          $order\n        );\n        $viewModel->setVariable(\n          'errors',\n\
  \          $this->inputFilter->getMessages()\n        );\n      }\n  }\n\n  $viewModel->setVariable(\n\
  \    'customers',\n    $this->customerRepository->getAll()\n  );\n  $viewModel->setVariable('order',\
  \ $order);\n\n  return $viewModel;\n}\n```\n\n这与我们在 `CustomersController` 中 `newOrEditAction()`\
  \ 的工作方式非常相似。\n\n我们检查请求是否为 `POST`。如果是，我们用来自表单的数据加载 `OrderInputFilter`，然后检查这些数据是否有效。如果有效，我们用过滤后的值填充化一个\
  \ `Order` 对象，将其持久化到 `OrderRepository` 中，然后存储一条闪消息（flash message）并重定向到视图页面。\n\n如果数据无效，我们再次填充化一个客户对象（这次使用原始的\
  \ POST 数据），并将验证错误存储在模型中，以便在视图中渲染。\n\n接下来，我们需要更新 `OrderHydrator`，使其能够处理通过 POST 数据发送的\
  \ `customer[id]`。当遇到这些数据时，我们希望实例化一个新的 `Customer` 对象并设置 ID。\n\n让我们更新测试规范（spec）来处理此情况：\n\
  \n```php\n// specs/hydrator/order-hydrator.spec.php\n\n// ...\n\ndescribe('Persistence\\\
  Hydrator\\OrderHydrator', function () {\n  // ...\n\n  describe('->hydrate()', function\
  \ () {\n    // ...\n\n    it('should hydrate the embedded customer data', function\
  \ () {\n      $data = ['customer' => ['id' => 20]];\n      $order = new Order();\n\
  \n      $this->hydrator->hydrate($data, $order);\n\n      assert(\n        $data['customer']['id']\
  \ === $order->getId(),\n        'id does not match'\n      );\n    });\n  });\n\
  });\n```\n\n让我们更新 `OrderHydrator` 来满足这一需求：\n\n```php\n// src/Persistence/Hydrator/OrderHydrator.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence;\n\nuse CleanPhp\\Invoicer\\Domain\\\
  Entity\\Order;\nuse CleanPhp\\Invoicer\\Domain\\Repository\\CustomerRepository;\n\
  use Zend\\Hydrator\\HydratorInterface;\n\nclass OrderHydrator implements HydratorInterface\
  \ {\n  protected $wrappedHydrator;\n  protected $repository;\n\n  public function\
  \ __construct(\n    HydratorInterface $wrappedHydrator,\n    CustomerRepository\
  \ $repository\n   {\n    $this->wrappedHydrator = $wrappedHydrator;\n    $this->repository\
  \ = $repository;\n  }\n\n  public function hydrate(array $data, $object) {\n   \
  \ $this->wrappedHydrator->hydrate($data, $object);\n\n    if (isset($data['customer']))\
  \ {\n      $customer = $this->repository->getById($data['customer']['id']);\n  \
  \    if ($customer) {\n        $object->setCustomer($customer);\n      }\n    }\n\
  \n    return $object;\n  }\n\n  public function extract($object) {\n    $data =\
  \ $this->wrappedHydrator->extract($object);\n\n    if (isset($object->getCustomer()))\
  \ {\n      $data['customer_id'] = $object->getCustomer()->getId();\n      unset($data['customer']);\n\
  \    }\n\n    return $data;\n  }\n}\n```\n\n\n\n\n接下来，我们需要在服务定位器（service locator）中注册\
  \ `InvoiceController`：\n\n```\n// module/Application/config/module.config.php\n\n\
  return [\n  // ..\n  'controllers' => [\n    // ...\n    'factories' => [\n    \
  \  // ...\n      'Application\\Controller\\Invoices' => function ($sm) {\n     \
  \   return new \\Application\\Controller\\InvoicesController   \n          $sm->getServiceLocator()->get('InvoiceTable')\n\
  \        );\n      }\n    ],\n  ],\n];\n```\n\n这些都是标准操作。现在我们为视图文件定义 `InvoiceTable`：\n\
  \n让我们通过提供视图文件来完成 `indexAction()`：\n\n```html\n<div class=\"page-header clearfix\"\
  >\n  <h2 class=\"pull-left\">Invoices</h2>\n  <a href=\"/invoices/generate\"\n \
  \   class=\"btn btn-success pull-right\">\n    Generate Invoices</a>\n</div>\n\n\
  <table class=\"table table-striped clearfix\">\n  <thead>\n    <tr>\n      <th>#</th>\n\
  \      <th>Order Number</th>\n      <th>Invoice Date</th>\n      <th>Customer</th>\n\
  \      <th>Description</th>\n      <th class=\"text-right\">Total</th>\n    </tr>\n\
  \  </thead>\n  <?php foreach ($this->invoices as $invoice): ?>\n    <tr>\n     \
  \ <td>\n        <a href=\"/invoices/view/<?=\n          $this->escapeHtmlAttr($invoice->getId())\
  \ ?>\">\n          <?= $this->escapeHtml($invoice->getId()) ?>a\n      </td>\n \
  \     <td>\n        <?= $invoice->getInvoiceDate()->format('m/d/Y') ?>\n      </td>\n\
  \      <td>\n        <?= $this->escapeHtml($invoice->getOrder()->getOrderNumber())\
  \ ?>\n      </td>\n      <td>\n        <a href=\"/customers/edit/<?=\n         \
  \ $this->escapeHtmlAttr(\n            $invoice->getOrder()->getCustomer()->getId()\n\
  \          ) ?>\">\n          <?= $this->escapeHtml(\n            $invoice->getOrder()->getCustomer()->getName()\n\
  \          ) ?>a\n      </td>\n      <td>\n        <?= $this->escapeHtml($invoice->getOrder()->getDescription())\
  \ ?>\n      </td>\n      <td class=\"text-right\">\n        $ <?= number_format($invoice->getTotal(),\
  \ 2) ?>\n      </td>\n    </tr>\n  <?php endforeach; ?>\n</table>\n```\n\n如果在浏览器中访问\
  \ `/invoices`，我们应该能看到新的、漂亮的空表格。如果我们手动在数据库中创建一些发票并再次刷新，会得到一个巨大的错误。Zend 返回的是 `invoice_date`\
  \ 的简单字符串表示，而不是填充后的（hydrated）`DateTime` 对象，因此我们现在需要创建一个 `InvoiceHydrator`。\n\n###\
  \ 发票填充 (Invoice Hydration)\n\n我们对发票填充有两个特殊需求，这些需求超出了 Zend 标准 `ClassMethods` 填充化器的范畴：\n\
  \n1.  我们需要能够填充一个 `DateTime` 对象，因为我们将 `Invoice::$invoiceDate` 属性设置为了 `DateTime` 的实例。遗憾的是，Zend\
  \ 并没有提供任何魔法方法让我们直接对这些内置对象进行填充。\n2.  我们需要能够填充关联的 `Invoice->$order` `Order` 关系，这样我们就可以在查看发票的页面上做一些酷操作，例如显示该发票属于哪个订单。\n\
  \n为了处理 `DateTime` 问题，我们将编写一个[填充策略（hydration strategy)](http://framework.zend.com/manual/current/en/modules/zend.stdlib.hydrator.strategy.html)\
  \ 类来处理它。Zend 的填充化器内置了策略的概念。这些策略可以添加到填充化器的实例中，以告诉填充化器如何处理特定属性。\n\n这种方法也让我们对任何其他 `DateTime`\
  \ 属性复用这种逻辑。我们将扩展 `Zend\\Stdlib\\Hydrator\\Strategy\\DefaultStrategy` 类，它提供了可扩展的\
  \ `extract()` 和 `hydrate()` 方法。\n\n让我们为该策略定义一个规范：\n\n```php\n// specs/hydrator/strategy/date.php\n\
  \nuse CleanPhp\\Invoicer\\Persistence\\Hydrator\\Strategy\\DateStrategy;\n\ndescribe('Peristence\\\
  Hydrator\\Strategy\\DateStrategy', function () {\n  beforeEach(function () {\n \
  \   $this->strategy = new DateStrategy();\n  });\n\n  describe('->hydrate()', function\
  \ () {\n    it('应该将字符串转换为 DateTime 对象', function () {\n      $value = '2014-12-26';\n\
  \      $obj = $this->strategy->hydrate($value);\n\n      assert($obj->format('Y-m-d')\
  \ === $value);\n    });\n  });\n\n  describe('->extract()', function () {\n    it('应该将\
  \ DateTime 对象转换为字符串', function () {\n      $value = new DateTime('2014-12-28');\n\
  \      $string = $this->strategy->extract($value);\n\n      assert($string === $value->format('Y-m-d'));\n\
  \    });\n  });\n});\n```\n\n我们期望 `hydrate()` 方法会接受日期字符串表示并转换为正确的 `DateTime` 对象，并期望\
  \ `extract()` 执行相反操作，将 `DateTime` 对象转换为日期字符串表示。现在来编写实际类：\n\n```php\n// src/Persistence/Hydrator/Strategy/DateStrategy.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Hydrator\\Strategy;\n\nuse DateTime;\n\
  use Zend\\Stdlib\\Hydrator\\Strategy\\DefaultStrategy;\n\nclass DateStrategy extends\
  \ DefaultStrategy {\n  public function hydrate($value) {\n    if (is_string($value))\
  \ {\n      $value = new DateTime($value);\n    }\n\n    return $value;\n  }\n\n\
  \  public function extract($value) {\n    if ($value instanceof DateTime) {\n  \
  \    $value = $value->format('Y-m-d');\n    }\n\n    return $value;\n  }\n}\n```\n\
  \n这样我们的代码就符合规范了。这非常简单。现在让我们为实际的 `InvoiceHydrator` 编写规范并确定它是如何工作的。我们将从 `extract()`\
  \ 方法开始：\n\n```php\n// specs/hydrator/invoice.spec.php\n\nuse CleanPhp\\Invoicer\\\
  Domain\\Entity\\Invoice;\n\ndescribe('Persistence\\Hydrator\\InvoiceHydrator', function\
  \ () {\n  describe('->extract()', function () {\n    it('应该对对象进行简单提取', function\
  \ () {\n      $invoice = new Invoice();\n      $invoice->setTotal(300.14);\n\n \
  \     $data = $this->hydrator->extract($invoice);\n\n      expect($data['total'])->toequal(300.14);\n\
  \    });\n\n    it('应该将 DateTime 对象提取为字符串', function () {\n      $invoiceDate =\
  \ new \\DateTime();\n      $invoice = new Invoice();\n      $invoice->setInvoiceDate($invoiceDate);\n\
  \n      $data = $this->hydrator->extract($invoice);\n\n      expect($data['invoice_date'])->toequal($invoiceDate->format('Y-m-d'));\n\
  \    });\n  });\n\n  describe('->hydrate()', function () {\n    it('应该对对象进行简单填充',\
  \ function () {\n      $data = ['total' => 300.14];\n      $invoice = new Invoice();\n\
  \      $this->hydrator->hydrate($data, $invoice);\n\n      expect($invoice->getTotal())->toequal(300.14);\n\
  \    });\n\n    it('应该填充一个 DateTime 对象', function () {\n      $data = ['invoice_date'\
  \ => '2014-12-13'];\n      $invoice = new Invoice();\n      $this->hydrator->hydrate($data,\
  \ $invoice);\n\n      expect($invoice->getInvoiceDate()->format('Y-m-d'))->toequal($data['invoice_date']);\n\
  \    });\n  });\n});\n```\n\n我们正在进行填充化器应该执行四个测试：\n\n1. 对所有属性进行简单提取\n2. 对 `invoice_date`\
  \ 属性进行 DateTime 提取\n3. 对所有属性进行简单填充\n4. 对 `invoice_date` 属性进行 DateTime 填充\n\n为了实现这一点，我们将依赖包装\
  \ Zend 的 `ClassMethods` 填充化器实例，就像我们处理 `OrderHydrator` 时所做，因此设置一个 `beforeEach()`\
  \ 条件为我们准备填充化器实例：\n\n```php\n// specs/hydrator/invoice.spec.php\n\nuse CleanPhp\\\
  Invoicer\\Domain\\Entity\\Invoice;\nuse CleanPhp\\Invoicer\\Persistence\\Hydrator\\\
  InvoiceHydrator;\nuse Zend\\Stdlib\\Hydrator\\ClassMethods;\n\ndescribe('Persistence\\\
  Hydrator\\InvoiceHydrator', function () {\n  beforeEach(function () {\n    $this->hydrator\
  \ = new InvoiceHydrator(new ClassMethods());\n  });\n\n  // ...\n});\n```\n\n\n\n\
  \n```php\n// src/Persistence/Hydrator/InvoiceHydrator.php\n\nnamespace CleanPhp\\\
  Invoicer\\Persistence\\Hydrator;\n\nuse CleanPhp\\Invoicer\\Persistence\\Hydrator\\\
  Strategy\\DateStrategy;\nuse Zend\\Stdlib\\Hydrator\\ClassMethods;\nuse Zend\\Stdlib\\\
  Hydrator\\HydratorInterface;\n\nclass InvoiceHydrator implements HydratorInterface\
  \ {\n  protected $wrappedHydrator;\n\n  public function __construct(ClassMethods\
  \ $wrappedHydrator) {\n    $this->wrappedHydrator = $wrappedHydrator;\n    $this->wrappedHydrator->addStrategy(\n\
  \      'invoice_date',\n      new DateStrategy()\n    );\n  }\n\n  public function\
  \ extract($object) {\n    return $this->wrappedHydrator->extract($object);\n  }\n\
  \n  public function hydrate(array $data, $object) {\n    return $this->wrappedHydrator->hydrate($data,\
  \ $object);\n  }\n}\n```\n\n首先，在构造函数中，我们将 `DateStrategy` 绑定到 `$wrappedHydrator`\
  \ 的 `invoice_date` 列上，这样当化器遇到 `invoice_date` 属性时，就会使用该策略。\n\n对于 `extract()` 和 `hydrate()`，我们只是简单将工作交给\
  \ Zend 的 `ClassMethods` 化器并返回结果，因为知道它会在合适的时候使用我们的 `DateStrategy`。\n\n现在，让我们处理 `Order`\
  \ 的实体化。让我们从编写测试规范开始：\n\n```php\n// specs/hydrator/invoice.spec.php\n\n// ...\nuse\
  \ CleanPhp\\Invoicer\\Domain\\Entity\\Order;\n// ...\n\ndescribe('Persistence\\\
  Hydrator\\InvoiceHydrator', function () {\n  beforeEach(function () {\n    $this->repository\
  \ = $this->getProphet()\n      ->prophesize(\n        'CleanPhp\\Invoicer\\Domain\\\
  Repository\\\\' .\n        'OrderRepositoryInterface'\n      );\n    $this->hydrator\
  \ = new InvoiceHydrator(\n      new ClassMethods(),\n      $this->repository->reveal()\n\
  \    );\n  });\n\n  describe('->extract()', function () {\n    // ...\n\n    it('should\
  \ extract the order object', function () {\n      $invoice = new Invoice();\n  \
  \    $invoice->setOrder((new Order())->setId(14));\n\n      $data = $this->hydrator->extract($invoice);\n\
  \n      expect($data['order_id'])\n        ->to->equal($invoice->getOrder()->getId());\n\
  \    });\n  });\n\n\n  describe('->hydrate()', function () {\n    // ...\n\n   \
  \ it('should hydrate an Order entity on the Invoice', function () {\n      $data\
  \ = ['order_id' => 500];\n\n      $order = (new Order())->setId(500);\n      $invoice\
  \ = new Invoice();\n\n      $this->repository->getById(500)\n        ->shouldBeCalled()\n\
  \        ->willReturn($order);\n\n      $this->hydrator->hydrate($data, $invoice);\n\
  \n      expect($invoice->getOrder())->to->equal($order);\n\n      $this->getProphet()->checkPredictions();\n\
  \    });\n\n    it('should hydrate the embedded order data', function () {\n   \
  \   $data = ['order' => ['id' => 20]];\n      $invoice = new Invoice();\n\n    \
  \  $this->hydrator->hydrate($data, $invoice);\n\n      expect($invoice->getOrder()->getId())->to->equal($data['order']['id']);\n\
  \    });\n  });\n});\n```\n\n我们做的第一件事是将 `OrderRepositoryInterface` 实例注入到 `InvoiceHydrator`\
  \ 中，以便它在实体化时查询必要的 `Order`。接下来，我们为 `extract()` 和 `hydrate()` 添加了几个场景。\n\n对于 `extract()`，我们想要确保如果\
  \ `Invoice` 上有一个 `Order`，我们提取出的数据应该包含一个 `order_id` 键，其值为 `Order` 对象的 `$id`。\n\n\
  对于 `hydrate()`，我们测试了两点：\n\n1. 如果存在 `order_id`，我们应该从数据库查询该 `Order` 并将其赋值给 `Invoice`。\n\
  \n2. 如果存在嵌套的 `order[id]`，我们应该用该数据实体化一个 `Order` 对象并将其赋值给 `Invoice`。\n\n更新我们的化器：\n\
  \n```php\n// src/Persistence/Hydrator/InvoiceHydrator.php\n\nnamespace CleanPhp\\\
  Invoicer\\Persistence\\Hydrator;\n\nuse CleanPhp\\Invoicer\\Domain\\Entity\\Order;\n\
  use CleanPhp\\Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\nuse CleanPhp\\\
  Invoicer\\Persistence\\Hydrator\\Strategy\\DateStrategy;\nuse Zend\\Stdlib\\Hydrator\\\
  HydratorInterface;\n\nclass InvoiceHydrator implements HydratorInterface {\n  protected\
  \ $wrappedHydrator;\n  private $orderRepository;\n\n  public function __construct(\n\
  \    HydratorInterface $wrappedHydrator,\n    OrderRepositoryInterface $orderRepository\n\
  \  ) {\n    $this->wrappedHydrator = $wrappedHydrator;\n    $this->wrappedHydrator->addStrategy(\n\
  \      'invoice_date',\n      new DateStrategy()\n    );\n    $this->orderRepository\
  \ = $orderRepository;\n  }\n\n  public function extract($object) {\n    $data =\
  \ $this->wrappedHydrator->extract($object);\n\n    if (array_key_exists('order',\
  \ $data) &&\n      !empty($data['order'])) {\n\n      $data['order_id'] = $data['order']->id();\n\
  \    }\n\n    return $data;\n  }\n\n  public function hydrate(array $data, $object)\
  \ {\n    if (isset($data['order_id'])) {\n      $order = $this->orderRepository->getById($data['order_id']);\n\
  \      $object->setOrder($order);\n    } elseif (isset($data['order']['id'])) {\n\
  \      $order = (new Order())->setId($data['order']['id']);\n      $object->setOrder($order);\n\
  \    }\n\n    return $this->wrappedHydrator->hydrate($data, $object);\n  }\n}\n\
  ```\n\n最后，我们需要在服务管理器中更新 `InvoiceTable` 的定义以使用新的：\n\n```php\n// config/autoload/global.php\n\
  \nreturn [\n  // ...\n  'InvoiceHydrator' => function ($sm) {\n    return new InvoiceHydrator(\n\
  \      new ClassMethods(),\n      $sm->get('OrderRepository')\n    );\n  },\n  //\
  \ ...\n  'InvoiceTable' => function($sm) {\n    $factory = new TableFactory();\n\
  \    $hydrator = $sm->get('InvoiceHydrator');\n\n    return new InvoiceTable(\n\
  \      $factory->createGateway(\n         $sm->get('Zend\\Db\\Adapter'),\n     \
  \    $hydrator,\n         new Invoice(),\n         'invoices'\n      ),\n      $hydrator\n\
  \    );\n  },\n  // ...\n];\n```\n\n因此我们定义了 `InvoiceHydrator` 的新条目以获取化器，然后更新 `InvoiceTable`\
  \ 条目使用它。\n\n如果我们刷新索引页面，现在应该能在网格中看到数据（假设你手动输入了一些）。我们所有的测试规范都通过了。\n\n我们做到了！\n\n####\
  \ 生成发票\n\n创建发票将与创建客户和创建订单不同。我们不是为用户提供输入发票数据的表单，而是使用 `OrderRepository::getUnvoicedOrders()`\
  \ 方法查找未开票的订单。\n\n对于 UI，点击“生成发票”按钮时，我们将显示一个所有可开票订单的页面。在底部，我们将包含另一个“生成发票”按钮，它将带我们进入另一个操作来实际生成这些发票。\n\
  \n最后，完成发票生成后，我们将引导用户进入发票已生成的视图。\n\n我们要做的第一件事是赋予 `invoices` 路由更大的自由度，以处理控制器中提供的任何操作，就像我们对\
  \ `orders` 执行的那样：\n\n```php\n// module/Application/config/module.config.php\n\n\
  return [\n  // ...\n  'router' => [\n    'routes' => [\n      // ...\n      'invoices'\
  \ => [\n        'type' => 'Segment',\n        'options' => [\n          'route'\
  \ => '/invoices[/:action[/:id]]',\n          'defaults' => [\n            'controller'\
  \ => 'Application\\Controller\\Invoices',\n            'action' => 'index',\n  \
  \        ],\n        ],\n      ],\n    ],\n  ],\n  // ...\n];\n```\n\n为了让我们的 `InvoicesController`\
  \ 获取未开票订单列表，它需要 `OrderRepositoryInterface` 的实例，因此让我们更新控制器以指定这一点：\n\n\n\n\n\n```php\n\
  // module/Application/src/Application/Controller/InvoicesController.php\n\nnamespace\
  \ Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\InvoiceRepositoryInterface;\n\
  use CleanPhp\\Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\nuse Zend\\\
  Mvc\\Controller\\AbstractActionController;\n\nclass InvoicesController extends AbstractActionController\
  \ {\n  protected $invoiceRepository;\n  protected $orderRepository;\n\n  public\
  \ function __construct(\n    InvoiceRepositoryInterface $invoices,\n    OrderRepositoryInterface\
  \ $orders\n  ) {\n    $this->invoiceRepository = $invoices;\n    $this->orderRepository\
  \ = $orders;\n  }\n\n  // ...\n}\n```\n\n当然，为了做到这一点，我们需要更新控制器配置以传入接口的实例：\n\n```php\n\
  // ...\n\nreturn [\n  // ...\n  'controllers' => [\n    // ...\n    'factories'\
  \ => [\n      // ...\n      'Application\\Controller\\Invoices' => function ($sm)\
  \ {\n        return new \\Application\\Controller\\InvoicesController(\n       \
  \   $sm->getServiceLocator()->get('InvoiceTable'),\n          $sm->getServiceLocator()->get('OrderTable')\n\
  \        );\n      },\n      // ...\n    ],\n  ],\n  // ...\n];\n```\n\n现在我们来编写初始\
  \ action，它将向用户展示未开票的订单列表：\n\n```php\npublic function generateAction() {\n  return\
  \ [\n    'orders' => $this->orderRepository->getUninvoicedOrders()\n  ];\n}\n```\n\
  \n这个简单的 action 仅仅返回未开票的订单。仅此而已，没有更多。\n\n让我们构建视图：\n\n```phtml\n<!-- view/application/invoices/generate.phtml\
  \ -->\n\n<h2>生成新发票</h2>\n\n<p>\n  以下订单可供发票开票处理。\n</p>\n\n<?php if (empty($this->orders)):\
  \ ?>\n<p class=\"alert alert-info\">\n  没有可供开票的订单。\n</p>\n<?php else: ?>\n<table\
  \ class=\"table table-striped clearfix\">\n  <thead>\n    <tr>\n      <th>#</th>\n\
  \      <th>订单号</th>\n      <th>客户</th>\n      <th>描述</th>\n      <th class=\"text-right\"\
  >总额</th>\n    </tr>\n  </thead>\n  <?php foreach ($this->orders as $order): ?>\n\
  \    <tr>\n      <td>\n        <a href=\"/orders/view/<?= $this->escapeHtmlAttr($order->getId())\
  \ ?>\">\n          <?= $this->escapeHtml($order->getId()) ?>a\n      </td>\n   \
  \   <td><?= $this->escapeHtml($order->getOrderNumber()) ?></td>\n      <td>\n  \
  \      <a href=\"/customers/edit/<?=\n          $this->escapeHtmlAttr($order->getCustomer()->getId())\
  \ ?>\">\n          <?= $this->escapeHtml($order->getCustomer()->getName()) ?>a\n\
  \      </td>\n      <td><?= $this->escapeHtml($order->getDescription()) ?></td>\n\
  \      <td class=\"text-right\">\n        $ <?= number_format($order->getTotal(),\
  \ 2) ?>\n      </td>\n    </tr>\n  <?php endforeach; ?>\n</table>\n\n<form action=\"\
  /invoices/generate-process\" method=\"post\" class=\"text-center\">\n    <button\
  \ type=\"submit\" class=\"btn btn-primary\">生成发票</button>\n</form>\n<?php endif;\
  \ ?>\n```\n\n这个简单的视图首先检查我们是否有任何订单，如果没有，则显示一条提示信息。如果有订单，我们就会遍历它们并在表格中显示出来，就像我们在索引\
  \ 视图中做的那样。\n\n| ![generic\\_inbar](img/leanpub_lightbulb-o.png) || 我们的订单表格与订单索引视图中的表格完全相同。更好的解决方案是将此代码存储在单独的视图文件中，并使用\
  \ Zend 的[部分视图助手](http://framework.zend.com/manual/current/en/modules/zend.view.helpers.partial.html)\
  \ 加载它。尝试一下吧。 |\n| --- | --- |\n\n接下来，我们将实现 `OrderRepository` 的 `getUninvoicedOrders()`\
  \ 方法：\n\n```php\n// src/Persistence/Zend/DataTable/OrderTable.php\n\nnamespace CleanPhp\\\
  Invoicer\\Persistence\\Zend\\DataTable;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  OrderRepositoryInterface;\n\nclass OrderTable extends AbstractDataTable\n  implements\
  \ OrderRepositoryInterface\n{\n  public function getUninvoicedOrders() {\n    return\
  \ $this->gateway->select(\n      'id NOT IN(SELECT order_id FROM invoices)'\n  \
  \  );\n  }\n}\n```\n\n此方法简单地返回所有 ID 不在 `invoices` 表中的订单。\n\n如果我们在浏览器中访问 `/invoices/generate`，应该能看到列出所有可开票订单的视图。\n\
  \n接下来，我们将考虑实现第二个 *生成发票* 按钮。首先，我们需要更新 `InvoiceController` 以接受我们在几个章节前编写的 `InvoicingService`\
  \ 实例：\n\n```php\nnamespace Application\\Controller;\n\nimportuse CleanPhp\\Invoicer\\\
  Domain\\Repository\\InvoiceRepositoryInterface;\nuse CleanPhp\\Invoicer\\Domain\\\
  Repository\\OrderRepositoryInterface;\nuse Zend\\Mvc\\Controller\\AbstractActionController;\n\
  \nclass InvoicesController extends AbstractActionController {\n  protected $invoiceRepository;\n\
  \  protected $orderRepository;\n  protected $invoicing;\n\n  public function __construct(\n\
  \    InvoiceRepositoryInterface $invoices,\n    OrderRepositoryInterface $orders,\n\
  \    InvoicingService $invoicing\n  ) {\n    $this->invoiceRepository = $invoices;\n\
  \    $this->orderRepository = $orders;\n    $this->invoicing = $invoicing;\n  }\n\
  \n  // ...\n```\n\n当然，我们需要修改控制器以使其正常工作：\n\n```php\nreturn [\n  // ...\n  'controllers'\
  \ => [\n    // ...\n    'factories' => [\n      // ...\n      'Application\\Controller\\\
  Invoices' => function ($sm) {\n        return new \\Application\\Controller\\InvoicesController(\n\
  \          $sm->getServiceLocator()->get('InvoiceTable'),\n          $sm->getServiceLocator()->get('OrderTable'),\n\
  \          $sm->getServiceLocator()->get('InvoicingService')\n        );\n     \
  \ },\n      // ...\n    ],\n  ],\n  // ...\n];\n```\n\n我们将在 `generateAction()` 中此\
  \ `InvoicingService`：\n\n```php\npublic function generateAction() {\n  $invoices\
  \ = $this->invoicing->generateInvoices();\n\n  $this->invoiceRepository->begin();\n\
  \n  foreach ($invoices as $invoice) {\n    $this->invoiceRepository->persist($invoice);\n\
  \  }\n\n  $this->invoiceRepository->commit();\n\n  return [\n    'invoices' => $invoices\n\
  \  ];\n}\n```\n\n在这里，我们遍历由 `InvoicingService` 生成的发票并将其持久化到 `InvoiceRepository`。最后，我们将生成的发票列表返回给视图。\n\
  \n说起视图，让我们创建一个：\n\n```phtml\n<div class=\"page-header\">\n  <h2>生成的发票</h2>\n</div>\n\
  \n<?php if (empty($this->invoices)): ?>\n<p class=\"text-center\">\n  <em>没有生成任何发票。</em>\n\
  </p>\n<?php else: ?>\n<table class=\"table-striped\">\n  <thead>\n    <tr>\n   \
  \   <th>#</th>\n      <th>订单号</th>\n      <th>发票日期</th>\n      <th>客户</th>\n   \
  \   <th>描述</th>\n      <th class=\"text-right\">总额</th>\n    </tr>\n  </thead>\n\
  \  <?php foreach ($this->invoices as $invoice): ?>\n    <tr>\n      <td>\n     \
  \   <a href=\"/invoices/view/<?= $this->escapeHtmlAttr($invoice->getId()) ?>\">\n\
  \          <?= $this->escapeHtml($invoice->getId()) ?>a\n      </td>\n      <td>\n\
  \        <?= $invoice->getInvoiceDate()->format('m/d/Y') ?>\n      </td>\n     \
  \ <td>\n        <?= $this->escapeHtml($invoice->getOrder()->getOrderNumber()) ?>\n\
  \      </td>\n      <td>\n        <a href=\"/customers/edit/<?=\n          $this->escapeHtmlAttr(\n\
  \            $invoice->getOrder()->getCustomer()->getId()\n          ) ?>\">\n \
  \         <?= $this->escapeHtml(\n            $invoice->getOrder()->getCustomer()->getName()\n\
  \          ) ?>a\n      </td>\n      <td>\n        <?= $this->escapeHtml($invoice->getOrder()->getDescription())\
  \ ?>\n      </td>\n      <td class=\"text-right\">\n        $ <?= number_format($invoice->getTotal(),\
  \ 2) ?>\n      </td>\n    </tr>\n  <?php endforeach; ?>\n</table>\n<?php endif;\
  \ ?>\n```\n\n此视图将向用户展示在发票运行期间生成的所有发票。它看起来和我们的发票索引视图完全一样。\n\n\n\n\n\n| ![generic\\\
  _inbar](img/leanpub_lightbulb-o.png) || 我们的发票表格与发票索引视图中的表格完全相同。更好的解决方案是将此代码存储在单独的视图文件中，并使用\
  \ Zend 的 [部分视图辅助器](http://framework.zend.com/manual/current/en/modules/zend.view.helpers.partial.html)\
  \ 来加载它。尝试一下。 |\n\n我们要做的最后一个事情是设置我们的 View Invoice 动作。\n\n## 查看发票\n\n让我们创建一个 `viewAction()`。我们将借鉴\
