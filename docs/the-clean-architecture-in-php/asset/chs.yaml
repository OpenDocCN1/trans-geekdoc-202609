  ```\n\n |\n\n| --- | --- |\n\n### 发票管理\n\n和之前一样，让我们先从路由开始：\n\n```php\n// app/Http/routes.php\n\
  \n// ...\n\nRoute::get('/invoices', 'InvoicesController@indexAction');\nRoute::get('/invoices/view/{id}',\
  \ 'InvoicesController@viewAction');\nRoute::get('/invoices/new', 'InvoicesController@newAction');\n\
  Route::post('/invoices/generate', 'InvoicesController@generateAction');\n```\n\n\
  并写出我们的 `InvoicesController`：\n\n```php\nnamespace App\\Http\\Controllers;\n\nuse\
  \ CleanPhp\\Invoicer\\Domain\\Repository\\InvoiceRepositoryInterface;\nuse CleanPhp\\\
  Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\nuse CleanPhp\\Invoicer\\\
  Domain\\Service\\InvoicingService;\n\nclass InvoicesController extends Controller\
  \ {\n  protected $invoiceRepository;\n  protected $orderRepository;\n  protected\
  \ $invoicing;\n\n  public function __construct(\n    InvoiceRepositoryInterface\
  \ $invoices,\n    OrderRepositoryInterface $orders,\n    InvoicingService $invoicing\n\
  \  ) {\n    $this->invoiceRepository = $invoices;\n    $this->orderRepository =\
  \ $orders;\n    $this->invoicing = $invoicing;\n  }\n}\n```\n\n我们还需要让 Laravel 知道为\
  \ `InvoiceRepositoryInterface` 实例化什么：\n\n```php\n// app/Providers/AppServiceProvider.php\n\
  public function register() {\n  // ...\n\n  $this->app->bind(\n    InvoiceRepositoryInterface::class,\n\
  \    function ($app) {\n      return new InvoiceRepository(\n        $app['Doctrine\\\
  ORM\\EntityManagerInterface']\n      );\n    }\n  );\n}\n```\n\n别忘记文件顶部的两个新的 `use`\
  \ 语句：\n\n```php\nuse CleanPhp\\Invoicer\\Domain\\Repository\\InvoiceRepositoryInterface;\n\
  use CleanPhp\\Invoicer\\Persistence\\Doctrine\\Repository\\InvoiceRepository;\n\
  ```\n\n#### 列出发票\n\n`indexAction()` 看起来非常眼：\n\n```php\n// app/Http/Controllers/InvoicesController.php\n\
  \npublic function indexAction() {\n  $invoices = $this->invoiceRepository->getAll();\n\
  \  return view('invoices/index', ['invoices' => $invoices]);\n}\n```\n\n以及视图文件：\n\
  \n```html\n<!-- resources/views/invoices/index.blade.php -->\n\n@extends('layouts.layout')\n\
