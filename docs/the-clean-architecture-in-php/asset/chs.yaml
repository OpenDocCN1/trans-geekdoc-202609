  composer require --dev peridot-php/peridot-prophecy-plugin\n```\n\n然后将其添加到到我们的 `peridot.php`\
  \ 文件中：\n\n```php\n// peridot.php\n\nuse Evenement\\EventEmitterInterface;\nuse Peridot\\\
  Plugin\\Prophecy\\ProphecyPlugin;\nuse Peridot\\Plugin\\Watcher\\WatcherPlugin;\n\
  \nreturn function(EventEmitterInterface $emitter) {\n  $watcher = new WatcherPlugin($emitter);\n\
  \  $watcher->track(__DIR__ . '/src');\n\n  new ProphecyPlugin($emitter);\n};\n```\n\
  \n现在，我们可以编写一个 `beforeEach()` 块，它将在每个测试之前执行，为我们构建一个模拟的 `OrderRepositoryInterface`：\n\
  \n```php\n// specs/domain/service/invoice-factory.spec.php\n\ndescribe('InvoicingService',\
  \ function () {\n  describe('->generateInvoices()', function () {\n    beforeEach(function\
  \ () {\n      $this->repository = $this->getProphet()->prophesize(\n        'CleanPhp\\\
  Invoicer\\Domain\\Repository\\OrderRepositoryInterface'\n      );\n    });\n   \
  \ // ...\n  });\n});\n```\n\n当我们需要时，`$this->repository` 将持有模拟仓库的实例。现在我们可以完成第一个测试了：\n\
  \n```php\nit('应该查询仓库以获取未开票的 Orders', function () {\n  $this->repository->getUninvoicedOrders()->shouldBeCalled();\n\
  \  $service = new InvoicingService($this->repository->reveal());\n  $service->generateInvoices();\n\
  });\n```\n\n我们在这里测试的是，当调用 `generateInvoices()` 方法时，我们预期 `InvoicingService` 会调用 `OrderRepositoryInterface`\
  \ 的 `getUninvoicedOrders()` 方法。\n\n我们还想添加一个 `afterEach()` 块来告诉 Prophecy 检查它所做的断言（例如\
  \ `shouldBeCalled()`），否则它将不知道确切何时安全地检查该断言。我们可以在 `afterEach()` 中这样做是为了方便自己，但实际上我们可以将其添加到任何地方：\n\
  \n```php\nafterEach(function () {\n  $this->getProphet()->check();\n});\n```\n\n\
  我们的测试当然是失败的，因为代码还没有设置以满足测试的预期，所以让我们定稿 `InvoicingService`：\n\n```php\n// src/Domain/Service/InvoicingService.php\n\
  \nnamespace CleanPhp\\Invoicer\\Domain\\Service;\n\nuse CleanPhp\\Invoicer\\Domain\\\
  Factory\\InvoiceFactory;\nuse CleanPhp\\Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\n\
  \nclass InvoicingService{\n  protected $orderRepository;\n  protected $invoiceFactory;\n\
  \n  public function __construct(\n    OrderRepositoryInterface $orderRepository,\n\
  \    InvoiceFactory $invoiceFactory\n  ) {\n    $this->orderRepository = $orderRepository;\n\
  \    $this->invoiceFactory = $invoiceFactory;\n  }\n\n  public function generateInvoices()\
  \ {\n    $orders = $this->orderRepository->getUninvoicedOrders();\n\n    $invoices\
  \ = [];\n\n    foreach ($orders as $order) {\n      $invoices[] = $this->invoiceFactory->createFromOrder($order);\n\
  \    }\n\n    return $invoices;\n  }\n}\n```\n\n\n\n\n\n我们现在在构造函数中接收一个 `InvoiceFactory`\
  \ 实例，并在遍历 `getUninvoicedOrders()` 的结果时使用它为每个 `Order` 创建 `Invoice`。完成后，我们返回此集合。这与我们在测试中定义的行为完全一致。\n\
  \n我们的测试通过了，我们的服务现在已经完成。\n\n| ![tip](img/leanpub_key.png) || 这里是将你的代码提交到版本控制的好地方。如果你只是在阅读，但想看到代码的运行情况，可以检出标签\
  \ 02-domain-services： |\n\n```\ngit clone https://github.com/mrkrstphr/cleanphp-example.git\n\
  git checkout 02-domain-services\n``` |\n\n| --- | --- |\n\n### 总结\n\n到此，我们应用程序的领域部分结束了。应用的领域模型和领域层是其他一切工作的核心。它们包含了我们的业务逻辑，这部分代码不会因为我们决定使用哪些库或框架，或者我们选择如何持久化数据库而改变。\n\
  \n存在于这两个层之外的所有内容都将利用它们来完成应用程序的目标。\n\n我们现在准备好开始构建应用程序的前端部分了！\n\n# Zend Framework\
  \ 2 设置\n\n我们将开始使用 Zend Framework 2 构建我们的项目。ZF2 是 Zend Framework 的第二次迭代，是一个模块化的、基于事件的框架，拥有一套丰富的库。至少从示例应用程序来看，它是一个支持各种数据库系统的\
  \ MVC 框架。\n\n虽然 ZF2 并不是我首选的框架，但它可能是人们在第一次寻找框架时会遇到的之一，特别是由于一个错误的假设，认为它实际上可能得到了 PHP\
  \ 本身的认可或关联。这种误解可能源于这样一个事实：目前 PHP 的运行时被称为 Zend Engine，而启动它的两个核心人物 Andi Gutmans 和\
  \ Zeev Suraski（Zeev + Andi = Zend）后来成立了一家名为 Zend Technologies 的公司，该公司负责 Zend Framework。\n\
  \n无论如何，Zend Framework 并不与 PHP 直接关联，也不受 PHP 认可。\n\n## 使用 Composer 安装\n\n我们在上一章节中安装了\
  \ Composer 来设置自动加载器。现在，我们将使用它来下载并配置 ZF Skeleton 应用程序。由于你不能将 git 仓库克隆到现有的非空目录，我们需要稍微“耍个滑”来让它工作。\n\
  \n我们将在与之前的 `cleanphp/` 目录不同的目录中创建我们的 ZF Skeleton 应用程序：\n\n```\ncd /path/to/your/preferred/www\n\
  composer create-project \\\n  --repository-url=\"http://packages.zendframework.com\"\
  \ \\\n  -sdev zendframework/skeleton-application \\\n  cleanphp-skeleton\n```\n\n\
  此命令会询问你是否想要“移除现有的 VCS 历史”。当询问出现时，输入“Y”来移除 `.git` 目录。\n\n你现在应该有了一个 ZF2 Skeleton 应用程序的工作副本。进入\
  \ `public/` 目录并启动 PHP 的内置 Web 服务器：\n\n```\ncd cleanphp-skeleton\nphp -S localhost:1337\
  \ -t public\n```\n\n在 浏览器中访问 `http://localhost:1337/`，你就能看到结果了！\n\n### 合并代码库\n\n\
  现在我们有两个独立的项目，所以我们需要将 ZF2 特有的代码移动到我们的 `cleanphp/` 目录。在两个 `cleanphp*` 目录的父目录下执行如下操作：\n\
  \n```\ncp -R cleanphp-skeleton/config \\\n  cleanphp-skeleton/data \\\n  cleanphp-skeleton/public\
  \ \\\n  cleanphp-skeleton/module \\\n  cleanphp-skeleton/init_autoloader.php \\\n\
  \  cleanphp/\n```\n\n我们还想确保在该项目中通过 Composer 安装了 Zend Framework：\n\n```bash\ncomposer\
  \ require zendframework/zendframework\n```\n\n现在我们可以删除 `cleanphp-skeleton/` 目录了：\n\
  \n```\nrm -rf cleanphp-skeleton/\n```\n\n那操作感觉很不舒服又笨拙，所以让我们开始使用 ZF2 吧！\n\n## 清理骨架\n\
  \n现在是时候让 ZF2 骨架服从我们的意愿了。我们只需要快速做一些外观上的调整，把 ZF2 的品牌去掉。\n\n首先，用以下内容替换 `module/Application/view/layout/layout.phtml`：\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>CleanPhp</title>\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\
  >\n  <link href=\"//maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.css\"\
  \ \n    media=\"screen\" rel=\"stylesheet\" type=\"text/css\">\n  <link href=\"\
  /css/application.css\" media=\"screen\" \n    rel=\"stylesheet\" type=\"text/css\"\
  >\n</head>\n<body>\n<nav class=\"navbar navbar-default navbar-fixed-top\" role=\"\
  navigation\">\n  <div class=\"container\">\n    <div class=\"navbar-header\">\n\
  \      <a class=\"navbar-brand\" href=\"/\">CleanPhp</a>\n    </div>\n    <div class=\"\
  collapse navbar-collapse\">\n      <ul class=\"nav navbar-nav\">\n        <li>\n\
  \          <a href=\"/customers\">Customers</a>\n        </li>\n        <li>\n \
  \         <a href=\"/orders\">Orders</a>\n        </li>\n        <li>\n        \
  \  <a href=\"/invoices\">Invoices</a>\n        </li>\n      </ul>\n    </div>\n\
  \  </div>\n</nav>\n<div class=\"container\">\n  <?= $this->content; ?>\n  <hr>\n\
  \  <footer>\n    <p>I'm the footer.</p>\n  </footer>\n</div>\n</body>\n</html>\n\
  ```\n\n在这里，我们抛弃了大量的 ZF2 视图助手和布局，并选择使用 CDN 提供的 Bootstrap 版本。我们可以完全删除 `public/css`、`public/fonts`、`public/img`\
  \ 和 `public/js` 文件夹。\n\n我们在页头中定义了一些指向未来页面的链接。让我们在 Zend Framework 中为这些页面设置路由：\n\n\
  ```php\n// module/Application/config/module.config.php\n\nreturn [\n  // ...\n \
  \ 'router' => [\n    'routes' => [\n      'home' => [\n        'type' => 'Zend\\\
  Mvc\\Router\\Http\\Literal',\n        'options' => [\n          'route' => '/',\n\
  \          'defaults' => [\n            'controller' => 'Application\\Controller\\\
  Index',\n            'action' => 'index',\n          ],\n        ],\n      ],\n\
  \      'customers' => [\n        'type' => 'Segment',\n        'options' => [\n\
  \          'route' => '/customers',\n          'defaults' => [\n            'controller'\
  \ => 'Application\\Controller\\Customers',\n            'action' => 'index',\n \
  \         ],\n        ],\n      ],\n      'orders' => [\n        'type' => 'Segment',\n\
  \        'options' => [\n          'route' => '/orders',\n          'defaults' =>\
  \ [\n            'controller' => 'Application\\Controller\\Orders',\n          \
  \  'action' => 'index',\n          ],\n        ],\n      ],\n      'invoices' =>\
  \ [\n        'type' => 'Segment',\n        'options' => [\n          'route' =>\
  \ '/invoices',\n          'defaults' => [\n            'controller' => 'Application\\\
  Controller\\Invoices',\n            'action' => 'index',\n          ],\n       \
  \ ],\n      ],\n    ],\n  ],\n  // ...\n];\n```\n\n现在用通用的内容替换 `module/Application/views/application/index/index.phtml`\
  \ 文件，而不是 ZF2 的广告：\n\n```html\n<div class=\"jumbotron\">\n  <h1>Welcome to CleanPhp\
  \ Invoicer!</h1>\n  <p>\n    这是《Clean Architecture in PHP》一书案例研究项目，\n    一本关于编写优秀\
  \ PHP 代码的书。\n  </p>\n  <p>\n    <a href=\"https://leanpub.com/cleanphp\" class=\"\
  btn btn-primary\">\n      Check out the Book\n    </a>\n  </p>\n</div>\n```\n\n\
  现在它变成这本书书的广告了。真不错！不过，看起来有点不对，所以让我们添加我们的 `public/css/application.css` 文件来修复它：\n\n\
  ```css\nbody {padding-top: 70px; padding-bottom: 40px}\n.navbar-brand {font-weight:\
  \ bold}\ndiv.page-header {margin-top: 0; padding-top: 0}\ndiv.page-header h2 {margin-top:\
  \ 0; padding-top: 0}\n```\n\n我们现在准备好开始使用 Zend Framework 配置我们的数据库了。\n\n\n\n\n\n```\n\
  git clone https://github.com/mrkrstphr/cleanphp-example.git\ngit checkout 03-base-zf2\n\
  ```\n\n# 设置我们的数据库\n\n为了设置数据库并在 Zend Framework 中使用它，我们将遵循 [ZF2 入门](http://framework.zend.com/manual/current/en/user-guide/database-and-models.html)\
  \ 指南，以确保我们的操作符合 Zend 的规范。我对我们正在做的操作解释将会非常简练，如果你感兴趣，请参考该指南以获取更多细节。\n\n让我们从创建数据库开始。在这些示例中，我将使用\
  \ `sqlite3` 数据库，因为它配置极其简单（至少在 Unix/Linux 环境下是如此），如果你是 `MySQL` 或 `PostgreSQL` 的粉丝并想使用其中之一，那也非常完美。\n\
  \n- 如果你使用 Debian/Ubuntu，安装 `sqlite` 简单如下：\n```\nsudo apt-get install sqlite3 php5-sqlite\n\
  ```\n- 在 Mac OS X 上，你可以使用 [Homebrew](http://brew.sh/) 安装 sqlite。\n\n让我们通过命令行快速创建数据库，我们将它创建在\
  \ `data/database.db`：\n\n```\nsqlite3 data/database.db\n```\n\n我们现在处于 `sqlite3`\
  \ 命令行应用程序中。我们可以轻松地在这里输入 SQL 查询并运行它们。让我们创建表：\n\n```\nCREATE TABLE customers (\n \
  \ id integer PRIMARY KEY,\n  name varchar(100) NOT NULL,\n  email varchar(100) NOT\
  \ NULL\n);\n\nCREATE TABLE orders (\n  id integer PRIMARY KEY,\n  customer_id int\
  \ REFERENCES customers(id) NOT NULL,\n  order_number varchar(20) NOT NULL,\n  description\
  \ text NOT NULL,\n  total float NOT NULL\n);\n\nCREATE TABLE invoices (\n  id integer\
  \ PRIMARY KEY,\n  order_id int REFERENCES orders(id) NOT NULL,\n  invoice_date date\
  \ NOT NULL,\n  total float NOT NULL\n);\n```\n\n你可以运行 `.tables` 命令来查看新创建的表，或者运行\
  \ `.schema` 查看架构定义。\n\n现在让我们为我们的 `customers` 表填充几行测试数据：\n\n```\nINSERT INTO customers(name,\
  \ email) VALUES('Acme Corp', 'ap@acme.com');\nINSERT INTO customers(name, email)\
  \ VALUES('ABC Company', 'invoices@abc.com');\n```\n\n## 连接数据库\n\n我们希望 ZF2 应用能够连接到此数据库。Zend\
  \ Framework 有了一组位于 `config/autoload` 内的配置文件，这些文件在应用程序运行时会自动加载。如果文件以 `local.php`\
  \ 结尾，则它特定于该本地环境。如果文件以 `global.php` 结尾，则它是应用程序特定的，而不是环境特定的。\n\n在 `config/autoload`\
  \ 中创建一个 `db.local.php` 文件来存放我们的数据库配置：\n\n```\nreturn [\n  'db' => [\n    'driver'\
  \ => 'Pdo_Sqlite',\n    'database' => __DIR__ . '/../../data/database.db',\n  ],\n\
  ];\n```\n\n这告诉 ZF2，对于我们的数据库，我们想要使用 `pdo_Sqlite` 驱动，并且数据库文件位于 `data/database.db`。\n\
  \n- 任何 `*.local.php` 文件都不应该提交到源码控制。相反，你应该提交 `*.local.php.dist`，并说明如何设置该配置文件。这可以防止数据库密码等敏感信息提交到源码控制并可能导致泄露。\n\
  \n现在我们已经完成了告诉 ZF2 如何与我们的数据库通信的所有工作。现在我们只需要写一些代码来实现。\n\n## 表网关模式\n\nZend Framework\
  \ 2 使用表网关模式（Table Gateway Pattern），我们之前在 设计模式入门 中简要提到过。表数据网关：单个对象充当表的网关，处理所有行的检索和持久化。这种模式在\
  \ Martin Fowler 的 [企业应用模式](http://martinfowler.com/eaa.html) 中有非常详细的描述。\n\n本质上，我们将有一个对象即数据表（Data\
  \ Table），代表对我们实体类的所有操作。我们将让这些类实现我们的 `RepositoryInterface`，以便它们能够履行所需的约。\n\n我们将所有这些文件放在\
  \ `src/Persistence/Zend` 目录下作为我们的 Zend 持久化层。让我们从 `DataTable/` 目录下的 `AbstractDataTable`\
  \ 类开始，它将定义我们的通用操作，我们的其他 `DataTable` 类可以继承这些操作：\n\n```\n// src/Persistence/Zend/DataTable/AbstractDataTable.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Zend\\DataTable;\n\nuse CleanPhp\\\
  Invoicer\\Domain\\AbstractEntity;\nuse CleanPhp\\Invoicer\\Domain\\RepositoryInterface;\n\
  use Zend\\Db\\TableGateway\\TableGateway;\nuse Zend\\Stdlib\\Hydrator\\HydratorInterface;\n\
  \nabstract class AbstractDataTable implements RepositoryInterface {\n  protected\
  \ $gateway;\n  protected $hydrator;\n\n  public function __construct(\n    TableGateway\
  \ $gateway,\n    HydratorInterface $hydrator\n  ) {\n    $this->gateway = $gateway;\n\
  \    $this->hydrator = $hydrator;\n  }\n\n  public function getById($id) {\n   \
  \ $result = $this->gateway\n      ->select(['id' => intval($id)])\n      ->current();\n\
  \n      return $result ? $result : false;\n  }\n\n  public function getAll() {\n\
  \    $resultSet = $this->gateway->select();\n    return $resultSet;\n  }\n\n  public\
  \ function persist(AbstractEntity $entity) {\n    $data = $this->hydrator->extract($entity);\n\
  \n    if ($this->hasIdentity($entity)) {\n      $this->gateway->update($data, ['id'\
  \ => $entity->getId()]);\n    } else {\n      $this->gateway->insert($data);\n \
  \     $entity->setId($this->gateway->getLastInsertValue());\n    }\n\n    return\
  \ $this;\n  }\n\n  public function begin() {\n    $this->gateway->getAdapter()\n\
  \      ->getDriver()->beginTransaction();\n    return $this;\n  }\n\n  public function\
  \ commit() {\n    $this->gateway->getAdapter()\n      ->getDriver()->commit();\n\
  \    return $this;\n  }\n\n  protected function hasIdentity(AbstractEntity $entity)\
  \ {\n    return !empty($entity->getId());\n  }\n}\n```\n\n我们正在定义基础数据库操作 - 即 `RepositoryInterface`\
  \ 要求的、其他存储库可以继承的操作。这些方法大多是对 `TableGateway` 的封装（我们稍后会看看）。\n\n我们这里唯一有趣的部分是 `hasIdentity`\
  \ 方法，它粗略地判断我们的实体是否已经持久化，以便我们知道我们是在执行 `insert` 还是 `update` 操作。我们在这里依赖于 ID 的存在，这并不总是有效。目前来说足够了。\n\
  \n### TableGateway\n\n`AbstractDataTable` 需要的第一个东西是 `TableGateway` 实例。`TableGateway`\
  \ 是 Zend 的主力，负责处理所有数据库的繁重工作。正如查看 `AbstractDataTable` 所示，我们所有的操作都依赖于它的某个方法。\n\n我们本质上将使用\
  \ Zend 的具体实现，只需配置适用于我们自己的表。我们会在考虑实际实例化 `DataTable` 时再定义它们。\n\n### Hydrators\n\n\
  第二个想要注入到 `AbstractDataTable` 中的东西是 Zend `HydratorInterface` 的实例。填充化器（Hydrator）负责填充一个对象，即用值填充它的属性。在我们案例中，我们是从数据数组转换为填充后的实体（例如提交的表单数据）。\n\
  \nZend 的填充化器还负责数据提取，这是填充的相反：我们从填充后的对象提取数据并将其存储为数组形式，这对于 Zend 的数据库更新操作是必要的。你可以在上面的\
  \ `persist` 方法中看到它是如何使用的。\n\n\n\n\n在大多数情况下，我们将使用 Zend 提供的名为 `ClassMethods` 的填充化器（hydrator）。该填充化器会扫描对象的\
  \ set 和 get 方法，并利用这些方法来决定如何填充（hydrate）或提取（extract）该对象。\n\n例如，如果一个对象有一个 `setAmount()`\
  \ 方法，填充化器将会在数组中查找 `amount` 键，如果找到，会将该键的值传递给 `setAmount()` 方法，以便将该信息填充到对象中。\n\n同样，如果一个对象有一个\
  \ `getAmount()` 方法，填充化器会调用它获取值，并在结果数组中添加一个元素，其键为 `amount`，值为 `getAmount()` 返回的值。\n\
  \n在某些情况下，我们将直接使用 `ClassMethods` 填充化器。在其他情况下，我们将封装此填充化器以为其提供一些额外功能。\n\n#### Customer\
  \ DataTable\n\n让我们定义我们的 `CustomerTable` 实现类：\n\n```php\n// src/Persistence/Zend/DataTable/CustomerTable.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Zend\\DataTable;\n\nuse CleanPhp\\\
  Invoicer\\Domain\\Repository\\CustomerRepositoryInterface;\n\nclass CustomerTable\
  \ extends AbstractDataTable\n  implements CustomerRepositoryInterface\n{\n}\n```\n\
  \n`CustomerTable` 类简单地实现了 `AbstractDataTable` 类。由于 `CustomerRepositoryInterface`\
  \ 没有定义任何额外功能，我们可以直接使用 `AbstractDataTable`。\n\n#### Order DataTable\n\n我们的 `OrderTable`\
  \ 看起来与 `CustomerTable` 几乎相同：\n\n```php\n// src/Persistence/Zend/DataTable/OrderTable.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Zend\\DataTable;\n\nuse CleanPhp\\\
  Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\n\nclass OrderTable extends\
  \ AbstractDataTable\n    implements OrderRepositoryInterface\n{\n    public function\
  \ getUninvoicedOrders()\n    {\n        return [];\n    }\n}\n```\n\n我们的 `OrderRepositoryInterface`\
  \ 定义了一个其他接口都不具备的额外方法：`getUninvoicedOrders()`。我们会在开始使用该功能后后再考虑定义它。\n\n#### Invoice\
  \ DataTable\n\n最后是 `InvoiceTable`，同样如此：\n\n```php\n// src/Persistence/Zend/DataTable/InvoiceTable.php\n\
  \nnamespace CleanPhp\\Invoicer\\Persistence\\Zend\\DataTable;\n\nuse CleanPhp\\\
  Invoicer\\Domain\\Repository\\InvoiceRepositoryInterface;\n\nclass InvoiceTable\
  \ extends AbstractDataTable\n  implements InvoiceRepositoryInterface\n{\n}\n```\n\
  \n### Table Gateway Factory\n\n我们的数据表（Data Tables）需要注入一个为特定模型配置的 `TableGateway`\
  \ 实例。在 ZF 入门文档中，他们为定义的每个数据表定义了一个 `TableGateway`。我们将通过编写工厂来动态创建一个：\n\n```php\n//\
  \ src/Persistence/Zend/TableGateway/TableGatewayFactory.php\n\nnamespace CleanPhp\\\
  Invoicer\\Persistence\\Zend\\TableGateway;\n\nuse Zend\\Db\\Adapter\\Adapter;\n\
  use Zend\\Db\\ResultSet\\HydratingResultSet;\nuse Zend\\Db\\TableGateway\\TableGateway;\n\
  use Zend\\Stdlib\\Hydrator\\HydratorInterface;\n\nclass TableGatewayFactory {\n\
  \  public function createGateway(\n     Adapter $dbAdapter,\n     HydratorInterface\
  \ $hydrator,\n     $object,\n     $table\n  ) {\n    $resultSet = new HydratingResultSet($hydrator,\
  \ $object);\n    return new TableGateway($table, $dbAdapter, null, $resultSet);\n\
  \  }\n}\n```\n\n我们的工厂需要一个 Zend 适配器实例（我们稍后会配置它），以及一个使用的填充化器实例。最后，它接受一个代表数据表的对象实例以及存储数据的表名。\n\
  \n关于此工作原理的更多信息，请参阅 [Zend 入门指南](http://framework.zend.com/manual/current/en/user-guide/database-and-models)。\n\
  \n#### Configuring Zend Framework\n\n设置数据库的最后一步是配置 Zend Framework 使用这些新的数据表。让我们从在服务中定义\
  \ `CustomerTable` 开始。我们将在 `global.php` 配置中定义它，尽管在实际应用程序中我们可能会找到更好的位置：\n\n```php\n\
  // config/autoload/global.php\n\nuse CleanPhp\\Invoicer\\Domain\\Entity\\Customer;\n\
  use CleanPhp\\Invoicer\\Persistence\\Zend\\DataTable\\CustomerTable;\nuse CleanPhp\\\
  Invoicer\\Persistence\\Zend\\TableGateway\\TableGatewayFactory;\nuse Zend\\Stdlib\\\
  Hydrator\\ClassMethods;\n\nreturn [\n  'service_manager' => [\n    'factories' =>\
  \ [\n      'CustomerTable' => function($sm) {\n        $factory = new TableGatewayFactory();\n\
  \        $hydrator = new ClassMethods();\n        \n        return new CustomerTable(\n\
  \          $factory->createGateway(\n            $sm->get('Zend\\Db\\Adapter\\Adapter'),\n\
  \            $hydrator,\n            new Customer(),\n            'customers'\n\
  \          ),\n          $hydrator\n        );\n      },\n    ]\n  ]\n];\n```\n\n\
  我们使用 `TableGatewayFactory` 创建 `TableGateway` 实例并提供给 `CustomerTable`。我们还传递了 `ClassMethods`\
  \ 填充化器实例，以及 `Customer` 对象和 `customers` 表名。\n\n\n\n\n现在我们已经配置好并准备好运行 `Z Framework`，同时数据库也已设置并配置完毕，我们可以开始实际使用它了。\n\
  \n让我们从客户管理开始。我们已经定义了一个路由，但当我们导航到该路由时，将会收到来自 `ZF2` 的一个悲伤的错误消息：\n\n> 发生 404 错误未找到页面。请求的控制器无法映射到现有控制器类。\n\
  \n> 控制器: ApplicationControllerCustomers（解析为无效的控制器类或别名: ApplicationControllerCustomers）无可用异常\n\
  \n这是很合理的，因为我们定义了一个指向 `Customers` 控制器的路由，但并没有花精力创建那个控制器。所以，让我们创建它吧。\n\n### 客户管理\n\
  \n让我们开始构建我们的 `CustomersController::indexAction()`，它将显示所有客户的网格。\n\n| ![generic\\\
  _inbar](img/leanpub_frown-o.png) || 我花费了大量时间试图弄如何在 Zend Framework 中对控制器进行单元测试。我打算直说：这是不可能的。根据操作的不同，你需要引导或模拟（mock）四个到四十四种不同的服务、插件等。Zend\
  \ 提供了一个关于测试其控制器的[很好的教程](http://framework.zend.com/manual/2.0/en/user-guide/unit-testing.html)。他们称其为单元测试，但只有当他们指的是整个\
  \ ZF2 生态系统作为一个单元时，这才是真的。因此，我将忽略这些控制器的测试。如果是在现实生活中，我会硬着头皮编写集成测试（这也很重要）。但为了这本书，那太不值得精力了。\
  \ |\n| --- | --- |\n\n让我们开始编写我们的 `indexAction()`：\n\n```\n// modules/Application/src/Application/Controller/CustomersController.php\n\
  \nnamespace Application\\Controller;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse Zend\\Mvc\\Controller\\AbstractActionController;\n\
  \nclass CustomersController extends AbstractActionController {\n  public $customerRepository;\n\
  \n  public function __construct(\n    CustomerRepositoryInterface $customers\n \
  \ ) {\n    $this->customerRepository = $customers;\n  }\n\n  public function indexAction()\
  \ {\n    return [\n      'customers' => $this->customerRepository->getAll()\n  \
  \  ];\n  }\n}\n```\n\n我们有一个新的 `CustomersController` 类，带有一个 `indexAction()` 方法。注入了一个\
  \ `CustomerRepositoryInterface` 实例，稍后由该操作用来调用 `getAll()` 方法。我们将该方法的结果在一个数组中返回，键名为\
  \ `customers`。\n\n现在我们需要适当的视图来表示 `indexAction()`，我们应该能在屏幕上看到我们的数据。让我们把视图文件放进去：\n\
  \n```\n<!-- module/Application/views/application/customers/index.phtml -->\n\n<div\
  \ class=\"page-header clearfix\">\n  <h2 class=\"pull-left\">Customers</h2>\n  <a\
  \ href=\"/customers/new\" class=\"btn btn-success pull-right\">\n    Create Customer</a>\n\
  </div>\n\n<table class=\"table\">\n  <thead>\n    <tr>\n      <th>#</th>\n     \
  \ <th>Name</th>\n      <th>Email</th>\n    </tr>\n </head>\n <?php foreach ($this->customers\
  \ as $customer): ?>\n    <tr>\n      <td>\n        <a href=\"/customers/edit/<?=\
  \ $customer->getId() ?>\">\n          <?= $customer->getId() ?></a>\n      </td>\n\
  \      <td><?= $customer->getName() ?></td>\n      <td><?= $customer->getEmail()\
  \ ?></td>\n    </tr>\n  <?php endforeach; ?>\n</table>\n```\n\n最后，我们需要配置 ZF2 让它知道\
  \ `CustomersController` 就是我们在路由中引用的 `Customers` 控制器。即使我们在路由中调用它为 `CustomersController`，ZF2\
  \ 仍然不知道我们在说什么，因为这里的字符串仅仅是控制器服务定位器内部的键。\n\n在模块配置文件的 `controllers` 部分，我们将为我们的新控制器添加一个条目：\n\
  \n```\n// module/Application/config/module.config.php\n\nreturn [\n  // ...\n  'controllers'\
  \ => [\n    'invokables' => [\n      'Application\\Controller\\Index' =>\n     \
  \   'Application\\Controller\\IndexController'\n    ],\n    'factories' => [\n \
  \     'Application\\Controller\\Customers' => function ($sm) {\n        return new\
  \ \\Application\\Controller\\CustomersController(\n          $sm->getServiceLocator()->get('CustomerTable')\n\
  \        );\n      },\n    ],\n  ],\n  // ...\n];\n```\n\n与主 `IndexController` 不同，这个\
  \ `CustomersController` 条目将作为工厂注册到 ZF，这样它就不仅仅是直接实例化，而是允许我们嵌入关于其如何实例化的逻辑，从而允许我们注入正确的依赖项。我们使用上一章中定义的\
  \ `CustomerTable` 条目来获取我们的客户数据表，它实现了 `CustomerRepositoryInterface` 并满足了 `CustomersController`\
  \ 构造函数上的类型提示。\n\n所以现在，如果我们在亲爱的浏览器中导航到 `/customers`，我们应该能看到从 sqlite 数据库中渲染的所有客户在屏幕上。成功了！\n\
