  ``` |\n\n| --- | --- |\n\n### 下一步工作\n\n如果这是一个真实项目，我会建议以下几点：\n\n1. 测试这个应用层。彻底地测试它。这些很可能是集成测试或全系统测试，因为在任何框架中（除非是\
  \ `Silex` 之类的），对控制器进行单元测试几乎是不可能的。\n2. 放弃 ZF2 组件并使用 Laravel 对应的替代品。ZF2 并不是基于组件的，无论他们如何努力伪装，我们被迫为了使用框架的两个小部分而把整个厨房带进来。\n\
  3. 完全拥抱 Blade，或者不要用。在示例中我们算是用了一半。我倾向于不使用 blade；它感觉很奇怪。\n\n### 总结\n\n这是一项大量的工作。很多机械的工作。如果我们在真实的大型应用程序中从\
  \ ZF2 切换到 Laravel，工作量会大得多。\n\n这可行吗？正如我们在这里看到的，绝对可行，但这是一项巨大的工程。它肯定会导致旧系统中不存在的 Bug\
  \ 和问题——尤其是因为我们没有为这一层编写任何测试。由于测试这一层可能非常复杂，我没有将其包含在本书书中。然而，为每一层都建立全套测试将极大有助于在过程早期检测并修复问题。\n\
  \n切换框架是极其费力的。请务必慎之之，并在前期花费大量时间评估你的框架选择，以便希望永远不需要切换。此外，要智能地编写代码并倾向于高度解耦的组件。从长远来看，这会让你的应用程序变得更好。\n\
