  \ DocBlock 狂热者感到太受刺眼，我诚恳地道歉。\n\n## 作者\n\n我叫 Kristopher Wilson。我从 2000 年开始开发 PHP。我和我的妻子以及四只猫住在密歇根州的大急拉比德市。我是\
  \ Grand Rapids Developers (GrPhpDev) 组的创始人之一，并深度参与社区的组织、教学和学习。\n\n## 组织\n\n本书从讨论如何组织应用程序开始。以至于我绝对希望有一位经验丰富、知识渊深的开发者负责我的项目。代码的问题在于，良好的代码——即那些能够实现其功能、几乎或没有缺陷、能够长期生存并发挥其作用、且易于修改的代码——是非常难以完成的。\n\
