  git clone https://github.com/mrkrstphr/cleanphp-example.git\ngit checkout 16-laravel-customers\n\
  ``` |\n\n### 订单管理\n\n让我们继续处理订单（Orders）。同样，我们将首先定义路由，这些路由是从我们的 ZF2 应用提取并适配的：\n\n\
  ```\n// app/Http/routes.php\n\n// ...\n\nRoute::get('/orders', 'OrdersController@indexAction');\n\
  Route::match(['get', 'post'], '/orders/new', 'OrdersController@newAction');\nRoute::get('/orders/view/{id}',\
  \ 'OrdersController@viewAction');\n```\n\n我们将从 `indexAction()` 开始。\n\n#### 订单列表\n\
  \n让我们创建 `OrdersController` 及其的 `indexAction()` 方法：\n\n```\n// app/Http/Controllers/OrdersController.php\n\
  \nnamespace App\\Http\\Controllers;\n\nuse CleanPhp\\Invoicer\\Domain\\Repository\\\
  CustomerRepositoryInterface;\nuse CleanPhp\\Invoicer\\Domain\\Repository\\OrderRepositoryInterface;\n\
  use CleanPhp\\Invoicer\\Persistence\\Hydrator\\OrderHydrator;\nuse CleanPhp\\Invoicer\\\
  Service\\InputFilter\\OrderInputFilter;\n\nclass OrdersController extends Controller\
  \ {\n  protected $orderRepository;\n  protected $customerRepository;\n  protected\
  \ $inputFilter;\n  protected $hydrator;\n\n  public function __construct(\n    OrderRepositoryInterface\
  \ $orderRepository,\n    CustomerRepositoryInterface $customerRepository,\n    OrderInputFilter\
  \ $inputFilter,\n    OrderHydrator $hydrator\n  ) {\n    $this->orderRepository\
  \ = $orderRepository;\n    $this->customerRepository = $customerRepository;\n  \
  \  $this->inputFilter = $inputFilter;\n    $this->hydrator = $hydrator;\n  }\n\n\
  \  public function indexAction() {\n    $orders = $this->orderRepository->getAll();\n\
  \    return view('orders/index', ['orders' => $orders]);\n  }\n}\n```\n\n再次，我们必须告知\
  \ Laravel 为 `CustomerRepositoryInterface` 实例化哪个具体类：\n\n```\n// app/Providers/AppServiceProvider.php\n\
  \npublic function register() {\n  // ...\n\n  $this->app->bind(\n    OrderRepositoryInterface::class,\n\
  \    function ($app) {\n      return new OrderRepository(\n        $app['Doctrine\\\
  ORM\\EntityManagerInterface']\n      );\n    }\n  );\n```\n\n同时确保在顶部加入正确的 `use`\
  \ 语句：\n\n```\nuse CleanPhp\\Invoicer\\Domain\\Repository\\OrderRepository;\nuse\
  \ CleanPhp\\Invoicer\\Persistence\\Doctrine\\OrderRepository;\n```\n\n最后，添加我们的订单索引文件：\n\
  \n```\n<!-- resources/views/orders/index.blade.php -->\n\n@extends('layouts.layout')\n\
  \n@section('content')\n<div class=\"page-header clearfix\">\n  <h2 class=\"pull-left\"\
  >Orders</h2>\n  <a href=\"/orders/new\" class=\"btn btn-success pull-right\">Create\
  \ Order</a>\n</div>\n\n<table class=\"table table-striped\">\n  <thead>\n    <tr>\n\
  \      <th>#</th>\n      <th>Order Number</th>\n      <th>Customer</th>\n      <th>Description</th>\n\
  \      <th class=\"text-right\">Total</th>\n    </tr>\n  </thead>\n  @foreach ($orders\
  \ as $order)\n  <tr>\n    <td>\n      <a href=\"/orders/view/{{ $order->getId()\
  \ }}\">{{ $order->getId() }}</a>\n    </td>\n    <td>{{ $order->getOrderNumber()\
  \ }}</td>\n    <td>\n      <a href=\"/customers/edit/{{ $order->getCustomer()->getId()\
  \ }}\">{{ $order->getCustomer()->getName() }}</a>\n    </td>\n    <td>{{ $order->getDescription()\
  \ }}</td>\n    <td class=\"text-right\">{{ number_format($order->getTotal(), 2)\
  \ }}</td>\n  </tr>\n  @endforeach\n</table>\n@stop\n```\n\n现在我们有了列出订单的能力。\n\n####\
  \ 查看订单\n\n列出订单很简单，查看订单也同样简单。让我们从控制器方法开始：\n\n```php\n// app/Http/Controllers/OrdersController.php\n\
  \npublic function viewAction($id) {\n  $order = $this->orderRepository->getById($id);\n\
  \n  if (!$order) {\n    return new Response('', 404);\n  }\n\n  return view('orders/view',\
  \ ['order' => $order]);\n}\n```\n\n我们引入了新对象 `Response`，确保在文件顶部添加它的 `use` 语句：\n\n\
  ```php\nuse Illuminate\\Http\\Response;\n```\n\n然后进入模板：\n\n```php\n<!-- resources/views/orders/view.blade.php\
  \ -->\n\n@extends('layouts.layout')\n\n@section('content')\n<div class=\"page-header\
  \ clearfix\">\n  <h2>Order {{ $order->getOrderNumber() }}</h2>\n</div>\n\n<table\
  \ class=\"table table-striped\">\n  <thead>\n    <tr>\n      <th>Customer</th>\n\
  \      <th>Description</th>\n      <th class=\"text-right\">Total</th>\n    </tr>\n\
  \  </thead>\n  <tr>\n    <td>\n      <a href=\"/customers/edit/{{ $order->getCustomer()->getId()\
  \ }}\">{{ $order->getCustomer()->getName() }}</a>\n    </td>\n    <td>{{ $order->getDescription()\
  \ }}</td>\n    <td class=\"text-right\">{{ number_format($order->getTotal(), 2)\
  \ }}</td>\n  </tr>\n</table>\n@stop\n```\n\n基本上和我们一直在做的内容一样。它运行运行！\n\n#### 添加订单\n\
  \n现在让我们处理添加订单。控制器方法：\n\n```php\n// app/Http/Controllers/OrdersController.php\n\n\
  public function newAction(Request $request) {\n  $viewModel = [];\n  $order = new\
  \ Order();\n\n  if ($request->getMethod() == 'POST') {\n    $this->inputFilter\n\
  \      ->setData($request->request->all());\n\n    if ($this->inputFilter->isValid())\
  \ {\n      $order = $this->hydrator->hydrate(\n        $this->inputFilter->getValues(),\n\
  \        $order\n      );\n\n      $this->orderRepository\n        ->begin()\n \
  \       ->persist($order)\n        ->commit();\n\n      Session::flash('success',\
  \ 'Order Saved');\n      return new RedirectResponse(\n        '/orders/view/' .\
  \ $order->getId()\n      );\n    } else {\n      $this->hydrator->hydrate(\n   \
  \     $request->request->all(),\n        $order\n      );\n      $viewModel['error']\
  \ = $this->inputFilter->getMessages();\n    }\n  }\n\n  $viewModel['customers']\
  \ = $this->customerRepository->getAll();\n  $viewModel['order'] = $order;\n\n  return\
  \ view('orders/new', $viewModel);\n}\n```\n\n此操作与 `CustomersController::newOrEditAction()`\
  \ 几乎完全相同，如果你想了解发生了什么，请去检查该章节。我们添加的唯一新是查询客户列表，以便用户选择订单属于哪个客户。\n\n我们在这里添加了相当的新对象，所以将它们添加到\
