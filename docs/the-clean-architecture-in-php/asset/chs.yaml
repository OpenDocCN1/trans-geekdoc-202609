  \       <td>\n          <a href=\"/customers/edit/{{{ $invoice->getCustomer()->getId()}}}\"\
  >{{ $invoice->getCustomer()->getName() }}</a>\n        </td>\n        <td>{{{ $invoice->getDescription()}}}</td>\n\
