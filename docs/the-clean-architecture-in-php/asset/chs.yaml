  \ endforeach; ?>\n  </tbody>\n</table>\n\n<form action=\"/invoices/generate\" method=\"\
  post\" class=\"text-center\">\n  <input type=\"hidden\" name=\"_token\" value=\"\
  <?= csrf_token(); ?>\">\n\n  <button type=\"submit\" class=\"btn btn-primary\">生成发票</button>\n\
  </form>\n<?php endif; ?>\n@stop\n```\n\n该视图显示未开票的订单（如果有），并提供了一个用于为这些订单生成发票的按钮。\n\
  \n现在让我们来实现该操作：\n\n\n\n\n\n```php\n// app/Http/Controllers/InvoicesController.php\n\
  \npublic function generateAction() {\n  $invoices = $this->invoicing->generateInvoices();\n\
  \n  $this->invoiceRepository->begin();\n\n  foreach ($invoices as $invoice) {\n\
  \    $this->invoiceRepository->persist($invoice);\n  }\n\n  $this->invoiceRepository->commit();\n\
  \n  return view('invoices/generate', ['invoices' => $invoices]);\n}\n```\n\n这和本章中的所有代码一样，直接取自\
  \ ZF2 项目，并针对 Laravel 进行了微调。让我们来完成视图部分，它显示了生成的发票列表：\n\n```php\n<!-- resources/views/invoices/generate.blade.php\
  \ -->\n\n@extends('layouts.layout')\n\n@section('content')\n<div class=\"page-header\"\
