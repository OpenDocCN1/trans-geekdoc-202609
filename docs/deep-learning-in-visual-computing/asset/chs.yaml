  ### 烧伤深度分析


  识别烧伤并将其与健康皮肤及其他皮肤相关损伤区分开来，是确保烧伤存在并进而进行后续调查的第一步。由于当今医院中的图像采集设备，每天都在积累大量的临床烧伤图像，并由人类视觉系统进行处理。然而，由于人类易疲劳的天性，此类图像的解读容易出错。


  烧伤的早期识别和烧伤深度的精确评估对患者的损伤管理至关重要，从而确保能尽早决定是否需要手术干预。烧伤深度评估很重要，因为它有助于预测已识别烧伤创面的潜在愈合时间，从而使适当的治疗能够尽早进行。愈合周期长的烧伤，如浅二度和深二度烧伤，如果能被早期识别，就可以尽早治疗，从而最大限度地减少因评估延迟导致的进一步并发症。虽然临床上容易识别浅一度和全层烧伤，但机器学习算法能否用于区分浅二度烧伤和全层烧伤呢？





  ### 皮肤烧伤评估与分类


  皮肤是内脏器官的第一道防线；因此，必须保护皮肤，并确保有效诊断以应对任何潜在威胁。烧伤会破坏皮肤提供的这种保护功能，并允许微生物不必要地流入体内。此外，皮肤受到的损伤程度取决于烧伤的严重程度。是仅影响表皮层，还是延伸至真皮和皮下组织等内层？人们已努力提供检测皮肤疾病和损伤（如癌症）的有效手段。因此，我们相信机器也可用于提供高精度和高准确度的烧伤急救评估，因为人工判断被认为具有主观性，精度仅为
  40–80%。


  #### 临床评估方法


  临床评估是诊断烧伤最常用的方法。研究发现，人工判断具有主观性，且不同外科医生的准确度各不相同。该方法的主观性被确定存在两个常见问题——高估和低估。高估烧伤程度可能使患者接受不必要的植皮/手术，而低估烧伤程度则与住院延迟增加以及患者面临高感染风险的可能性有关。组织学评估与临床判断相比相当准确；然而，其局限于活检部位，且可能使患者面临感染风险，因此不适用。此外，活检非常痛苦。另一种被最广泛接受的烧伤评估方法是使用激光多普勒成像（`LDI`），与临床手段相比，其本质是客观的而非主观的。它通过测量真皮灌注来评估烧伤。与组织学评估相比，采用
  `LDI` 的优势之一是其无创特性。文献 [[5]](#14_ch7.xhtml#r7_5) 报告的一项研究表明，`LDI` 评估烧伤愈合时间的精度高达约 90%。但它是一种非常昂贵的设备，需要专业知识才能操作，且与愈合时间相关，而非烧伤深度的评估。


  #### 机器学习方法


  基于监督机器学习，烧伤图像可被分类为不同类别。一个包含 140 张使用数码相机拍摄图像的数据集被分为三类烧伤度（一度、二度和三度）。作为预处理步骤，作者将 `RGB`
  图像转换为灰度图，并使用直方图均衡化增强图像对比度，然后将图像裁剪为 90×90 像素大小。使用 `k-近邻算法 (k-NN)` 作为分类器。获得的结果显示，正确分类一度、二度和三度皮肤烧伤的准确率分别为
  65.5%、82.5% 和 75%。然而，该研究伴随高达约 25% 的诊断错误 [[7]](#14_ch7.xhtml#r7_7)。


  此外，文献 [[8]](#14_ch7.xhtml#r7_8) 的作者指出，当地医疗中心曾有报告病例，护士不得不打电话给远程的医疗专业人员，描述烧伤损伤的物理特征以进行诊断。同样，将化学烧伤图像分类为一度、二度或三度也是可行的。数据使用分辨率为
  1000 万像素的相机采集；总共仅采集了 120 张图像，每类烧伤 40 张。图像首先通过裁剪至 90×90 像素进行预处理；提取均值、离散余弦变换（`DCT`）、偏度和峰度等特征用于分类，获得了略显满意的结果，平均准确率为
  88.33%。


  而且，文献 [[9]](#14_ch7.xhtml#r7_9) 的作者强调了为烧伤患者提供急救评估的必要性，特别是在缺乏训练有素的医疗专业人员的当地医疗中心。他们提出了一种利用心理物理学实验和多维标度分析（`MDS`）来识别和分类可自发愈合的烧伤与需要植皮的烧伤的技术。他们使用
  20 张图像记录了 79.73% 的准确率。使用人类视觉系统进行此类评估令人担忧的部分是习服误差，即呈现不不同样本时倾向于产生相同结果的倾向，这可能是由于人类的主观性质导致的。


  文献 [[10]](#14_ch7.xhtml#r7_10) 的作者从互联网、书籍和医院直接拍摄等不同来源获取烧伤图像。这些图像通过转换为 90×90 像素值进行处理，并提取颜色特征用于训练分类算法。使用模板匹配（`TM`）、`k-近邻算法
  (k-NN)` 和支持向量机（`SVM`）分类器分别获得了 66%、75% 和 90% 的效率。


  文献 [[11]](#14_ch7.xhtml#r7_11) 开展了深色皮肤类型烧伤的诊断研究。该研究旨在寻找经验丰富的医务人员识别深色皮肤类型烧伤的有效性。数据使用三星
  Galaxy SIII mini 从南非西开普省四家不同医院收集。这些图像呈现给医生，他们能够以平均 67.5% 和 66.0% 的准确率成功诊断烧伤的面积和深度。然而，该研究仅关注烧伤识别，而非其分类。


  综上所述，大多数被回顾的研究使用传统方法提取特征或使用浅层网络。在本章的实验部分，使用了一种具有更好计算效率的更深层网络，配合相对更多的图像，以获得在区分临床烧伤图像方面的改进结果。采用更深层神经网络是为了确保提取更多相关特征，从而使其拥有更多可区分的参数。使用更多的数据图像可避免过拟合问题，从而使算法能很好地泛化到未见数据。


  #### 结果评估


  烧伤图像经患者完全同意后直接在医院拍摄，共获得 34 张不同烧伤类别的图像，随后通过翻转、缩放和旋转进行增强，共得到 660 张全层烧伤图像。此外，浅表烧伤（一度烧伤）图像主要通过互联网搜索晒伤图像获得。成功生成
  46 张浅表烧伤图像，随后增强至 660 张。同样，将 660 张健康皮肤图像纳入研究。所有图像在特征提取和分类前均调整为 224×224 大小。这样，所有图像将具有相同尺寸，符合
  `ResNet` 所需的标准图像尺寸。


  前述实验受残差网络（`ResNet`）架构性能的启发；因此，使用了该模型的低层权重（不包括最后一层）作为滤波器，与 2D 图像卷积以提取特征。随后，将特征输入线性支持向量机。简而言之，该方法简单而强大：利用完全训练好的最先进神经网络的滤波器将原始图像像素转换为稠密特征；然后，`SVM`
  将特征分类为非烧伤、浅表烧伤和全层烧伤。





  ### 交叉验证与结果


  为确保无偏验证，采用了 k 折交叉验证技术，将数据均等地分为 k 个部分。交叉验证 (CV) 是一种评估学习算法的统计手段 [9]。训练和验证由子样本完成。使用了一种特殊的
  k 折（其中 `k = 10`）交叉验证，其中 `k-1` 用于训练，剩余的分割用于验证（测试）。迭代持续进行，直到所有子样本用尽，以这种方式每个子样本都被用于训练和测试，最后所有测试的平均值给出结果。


