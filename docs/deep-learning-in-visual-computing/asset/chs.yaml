  # 第六章：鼻子与种族


  鼻子是面部最核心的特征，已知其同时表现出性别和种族差异。它是一个鲁棒的特征，不随表情变化，且包含深度信息。在本章中，我们将展示如何利用深度学习通过鼻子图像进行二分类种族识别。我们通过一系列实验来演示这一点，这些实验使用了预训练的深度学习模型（如
  `ResNet-50`、`ResNet-101`、`ResNet-152`、`VGG-Face`、`VGG-16` 和 `VGG-19`）进行特征提取，并使用线性
  `Support Vector Machine`（支持向量机）进行分类。


  ### 简介


  面部形态在不同种族和族群间表现出巨大差异，这是公认的事实。这在面部上部区域（包括鼻子和眼睛）尤为明显。从这个意义上说，鼻子是最具定义性和最核心的特征之一。鼻部测量学包含若干参数，用于描述鼻子的形状和位置。大量人类测量学研究将鼻子作为独立特征进行了深入探讨。例如，眼部测量学描述了直接或从照片中获取眼部区域外部测量值的过程。这些信息可用于建立人口研究中表面解剖结构及眼部周围区域的种族和族群差异。


  面部外观的种族差异显著。从本质上讲，生理构成取决于一个人的种族。在视觉计算领域，面部特征是关键信息来源，这是公认的。人脸识别系统依赖面部属性辅助识别，这也是该领域成为研究最热门的领域之一的原因。虽然面部提供了与年龄、性别和种族相关的人口统计信息，但种族仍然是基于图像的分类任务中最不变的特征。





  众所周知，鼻子是一种在种族和族群间表现出显著差异的特征。鼻子也是面部的主要特征之一，对面部美学以及种族和/或族群倾向有着重要贡献。过去，已有大量研究表明不同种族个体的鼻宽测量值存在显著差异。例如，研究人员调查了土耳其裔男性和女性的鼻部人体测量特征[[1]](#13_ch6.xhtml#r6_1)。他们研究了
  115 名年龄在 18 至 30 岁之间的成年人，共识别并测量了 14 个鼻部参数。他们研究的一项主要发现是，鼻部形状存在显著差异，这不仅能区分性别，还能区分族群本身。


  因此，人鼻是面部最居中且最突出的特征。使用鼻部图像作为基于图像分类的主要特征有几个优势。首先，鼻部形状对面部表情变化带来的改变具有鲁棒性。它也不受胡须影响。此外，人体测量学研究显示，鼻部形状和大小在性别和族群上均存在差异。个体鼻部外观的稳定性以及鼻部形状随时间推移的不变性，凸显了这一表面特征对识别的重要性。


  多年来，多种机器学习算法在不同任务下均尝试过族群分类任务。例如，使用`线性判别分析 (LDA)`可以表明，从包含 263 名受试者 2,630 张图像的数据库进行族群分类，在二分类（亚裔与非亚裔）任务中准确率超过
  96%。同样，可以使用`Gabor 小波`特征和`视网膜采样`来获取最具信息量的特征。在此，研究人员使用`支持向量机`将特征分为三类，即亚裔、非裔和欧裔。研究人员分别达到了
  96%、94%和 93%的准确率[[2]](#13_ch6.xhtml#r6_2)。


  Roomi 等人[[3]](#13_ch6.xhtml#r6_3)使用`Viola-Jones 算法`进行人脸检测，随后提取肤色、唇色和归一化额头区域等特征用于种族分类。研究中分类的三大人种为高加索人种、尼格罗人种和蒙古人种。作者提出，这三大人类群体的区分在历史上已为人类学家所公认，并在头部形状、肤色、嘴唇和发质等方面表现出差异。


  对于肤色提取，人脸图像从 RGB 色彩空间转换为`YCbCr`色彩空间，每个像素被归类为“皮肤”或“非皮肤”。特征提交通过使用`Sobel 边缘检测`投影边缘图来完成。在由
  Yale 和 FERET 图像数据库创建的数据集上，作者报告了高加索人种、尼格罗人种和蒙古人种 81%的准确率。


  Yewenberg 等人[[4]](#13_ch6.xhtml#r6_4)在`人脸属性数据集 (FAD)`上研究了除年龄、性别和情绪等特征外的族群分类。作者使用预训练的`CNN`模型`AlexNet`进行基线实验，并将结果与其新颖的`地标增强
  CNN (LACNN)`进行比较。测试族群（白人）使用`AlexNet`准确分类率为 82.7%，而`LACNN`将性能准确率略微提升至 83.35%。该研究凸显了`CNN`架构的优势以及使用大型多样化数据集的有效性。


  虽然族群分类任务已使用全脸图像进行过研究，但仅有少量文献探讨了眼睛和鼻子等面部特征用于族群分类的鲁棒性。例如，Qiu 等人[[5]](#13_ch6.xhtml#r6_5)提出了一种从虹膜图像确定族群（亚裔与非亚裔）的模型。


  类似地，鼻子也被证明是一种高效的生物特征[[6]](#13_ch6.xhtml#r6_6)。然而，鼻部相关文献有限。Lv 等人[[7]](#13_ch6.xhtml#r6_7)引入了一种新型`3D
  鼻部形状网络`分类器用于性别和族群分类。构建`3D 鼻部形状网络`需要一种从鼻部获取测量值的方法，以确定给定数据集中不同鼻子间的距离，然后将图像聚类成组。利用鼻部聚类结果，构建
  3D 鼻模型。使用`Bosphorus3D`人脸图像数据库和`FRGC2.0`，作者报告了亚裔族群 89.2%、白人族群 87.4%的分类准确率。


  Drira 及其同事[[8]](#13_ch6.xhtml#r6_8)也报告了关于使用 3D 鼻部形状信息的类似研究。Song 等人[[9]](#13_ch6.xhtml#r6_9)研究将鼻部皮肤毛孔的数量和位置作为生物特征进行提取。报告了
  88.07%的性能准确率，研究表明鼻部毛孔是生物识别的一个有前景的途径。


  Zehngut 等人[[10]](#13_ch6.xhtml#r6_10)研究了基于图像的鼻部生物特征确定身份信息的可行性。此处进行了两类实验。它们是：（1）使用
  NIST 的`人脸识别大赛 (FRGC)`数据库（含 12,776 张图像）比较全脸和鼻部生物特征；（2）使用`AR Face`数据库（含 3,288 张图像）比较遮挡人脸图像下的全脸和鼻部生物特征。基于`最优权衡合成判别函数
  (OTSDF)`滤波器，使用`核类依赖特征分析 (KCFA)`提取判别性鼻部特征。


  因此，利用鼻部图像（包括鼻部毛孔等特征方面）进行人口统计学（族群）识别已被证明是成功的。鼻子是一种鲁棒且具判别力的特征，文献综述证明了其可靠性。


  在本章中，重点关注作为人口统计学特征的族群，其可见于鼻部，旨在演示如何使用一系列基于`残差神经网络 (ResNet)`和`VGG-Face`的预训练机器学习算法进行一系列实验。我们提出的方法论中使用的预训练模型包括：（1）`VGG-Face`，（2）`VGG-16`，（3）`VGG-19`。使用的`残差神经网络
  (ResNet)`包括：（1）`ResNet-50`，（2）`ResNet-101`，（3）`ResNet-152`。


  对于此处的讨论，我们将族群定义为一个人的文化和祖先背景。从全脸图像中裁剪出的鼻部图像，根据特定选择标准（将在即将到来的特征数据库部分讨论）被分为巴基斯坦裔或非巴基斯坦裔。


  所提出的族群分类方法包含 2 个组件：（i）使用`VGG-Face`、`VGG-16`、`VGG-19`、`ResNet-50`、`ResNet-101`和`ResNet-152`的权重进行特征提取；（ii）使用线性`支持向量机
  (SVM)`算法作为二分类过程进行族群分类。


  ### 问题定义


  族群分类任务是基于已知类别成员资格的训练数据集，识别新观测值属于哪个子人口集合。考虑一个包含`N`张人脸图像的人脸图像数据集`F`，如下所示：


  ```

  F = {f[1], f[2], ..., f[N-1], f[N]}, (6.1)

  ```




  ### 二元种族分类


  这是一个二元种族分类 $E$，旨在尽可能准确地区分给定种族 $E[p]$ 与不属于该种族的另一人 $E[NP]$。假设 $x$ 代表属于一张人脸图像的多个数据点或特征。然而，在现实场景中，种族分类的输入数据可以基于全脸或部分人脸图像。在这种情况下，我们可以探索用于种族分类的全脸特征
  $x^F$ 和部分人脸特征 $x^{(PF)}$。手工设计特征和深度学习特征均被纳入训练。该种族分类问题可定义为：


  $$H(x) = \theta[0] + \theta[1]x, \quad x = x^{(F)} \cup x^{(PF)}, \tag{6.2}$$


  其中 $H(x)$ 为预测函数，$\theta[0]$ 和 $\theta[1]$ 为常数值。目标应是找到 $\theta[0]$ 和 $\theta[1]$
  的最佳值，使预测器表现尽可能好。通过训练样本对预测器 $H(x)$ 进行优化。对于每个训练样本，我们都有一个输入值 $x_{train}$，其对应的输出 $y$
  预先已知。我们计算已知正确值 $y$ 与我们的预测值 $h(x_{train})$ 之间的差异。


  有了足够的训练样本，这些差异提供了一种衡量 $H(x)$ “不准确度”的有效方法。然后，我们可以通过调整 $\theta[0]$ 和 $\theta[1]$ 的值来微调
  $H(x)$，使其“错误更少”。此过程重复进行，直到系统收敛于 $\theta[0]$ 和 $\theta[1]$ 的最佳值。


  #### 数据集


  巴基斯坦人脸数据库由英国布拉德福德大学的研究人员开发。从巴基斯坦人脸数据库中选取了 100 张巴基斯坦人图像和 100 张非巴基斯坦人图像。每张图像的种族是通过要求参与者自我认定其种族来确定的。对于巴基斯坦裔参与者，入选标准取决于其父母双方是否均为巴基斯坦族裔。


  所有面部图像均使用 Photoshop CS6 在鼻部区域周围进行裁剪，以生成包含多样化鼻部区域的子数据集，如图 6.1 所示。为保留所有相关信息，确保完整裁剪了整个鼻子，清晰地显示出鼻梁、鼻尖以及鼻翼（鼻孔）。


  ![图 6.1：使用 Adobe Photoshop CS6 处理后的鼻部图像示例。（所用图像已根据英国布拉德福德大学批准的伦理规范及参知情同意进行复现。）](img/fig6_1_B.jpg)


  图 6.1： 使用 Adobe Photoshop CS6 处理后的鼻部图像示例。（所用图像已根据英国布拉德福德大学批准的伦理规范及参与者知情同意进行复现。）


  #### 方法论


  我们的方法是使用六个预训练机器学习模型提取鼻部特征：三个基于 VGG 的模型和三个基于深度学习的模型。所用模型包括 `VGG-Face`、`VGG-16`、`VGG-19`、`ResNet-50`、`ResNet-101`
  和 `ResNet-152`，随后使用线性支持向量机进行判别性二分类。在以下数据集上总共进行了八组实验：

  1. 2,200 个孤立鼻部裁剪图

  2. 1,200 个孤立眼部和鼻部裁剪图

  3. 1,200 个孤立鼻部和嘴部裁剪图

  4. 1,200 个孤立嘴部和眼部裁剪图


  ##### 数据预处理


  实验中使用的所有图像均调整为 224 × 224 像素，以确保符合预训练模型的输入标准。此外，还对训练数据进行了数据增强，旋转角度包括向右 10 度、向左 10
  度、90°、180° 和 270°，以及随机裁剪。这使得原始数据量至少增加了十二倍。


  ##### 特征提取


  各 ResNet 模型最后一个池化层的激活值被用于特征表示。


  总共使用 `ResNet-50`、`ResNet-101` 和 `ResNet-152` 神经网络，每个实验检索了三组特征。我们决定排除全连接层（`FC`）的最后一个输出层，因为该层是在一组不同的数据（即物体）上训练的，而当前使用的是面部特征。此外，研究证明深度神经网络的较低层足以学习通用特征。


  相应地，对于使用 `VGG-Face`、`VGG-16` 和 `VGG-19` 模型的 VGG 特征表示，我们使用了中间的全连接层（`FC7`），而舍弃了 `FC6`
  和 `FC8`。


  ##### 分类


  在分别使用 `VGG-Face`、`VGG-16`、`VGG-19`、`ResNet-50`、`ResNet-101` 和 `ResNet-152` 模型进行基于机器学习的特征提取后，采用线性分类器进行两类种族分类。


  支持向量机（SVM）是一种监督机器学习模型，其功能是识别一个超平面，以最佳方式对给定数据空间中的数据点进行分类。已发表的文献表明，SVM 是一种强大的二分类器，通过定义两类数据之间的最佳分离超平面来工作。


  SVM 算法通过定义两类数据之间的最佳分离超平面对数据进行分类，这通常涉及解决一个优化问题。给定一个训练集：


  $$\{(x_i, y_i)\}_{1 \le i \le n}, \quad x_i \in \mathbb{R}^d, \quad y_i \in \{+1,
  -1\}, \tag{6.3}$$


  SVM 通过求解以下问题找到最优超平面：


  $$

  \begin{cases}

  \min_{w,b} \frac{1}{2}\| w \|² \\

  \text{subject to } y_i(w \cdot x + b) \ge 1

  \end{cases} \tag{6.4}

  $$


  对于 $i = 1, \dots, n$ 个观测值，其中权重 $w$ 和偏置 $b$ 在训练过程中学习得到。分类器的学习使得 $y_i \in \{+1, -1\}$，其中
  $+1$ 表示标记为巴基斯坦人的图像，$-1$ 表示非巴基斯坦人图像。采用 k 折交叉验证技术来评估预训练模型的性能。


  #### 实验结果


  通过使用三个预训练深度学习模型 `ResNet-50`、`ResNet-101` 和 `ResNet-152` 从图像中提取特征，我们在包含 2,200 张鼻部图像的数据集上（实验
  1），实现了巴基斯坦鼻部二分类准确率超过 90%，如表 6.1 所示。


  相比之下，使用三个基于 VGG 的模型（即 `VGG-Face`、`VGG-16` 和 `VGG-19`）进行的实验，其结果彼此差异较大，且与 ResNet 模型相比本质上较低。性能准确率可直接与
  ResNet 模型相比较，并证明了 VGG 的准确率低于 ResNet 的发现。这可能归因于 ResNet 模型被归类为极深度学习模型，其架构不同，据报道能产生更高的准确率。


  **表 6.1：** 使用残差神经网络对巴基斯坦鼻部图像进行二分类的性能准确率。


  | 特征提取模型 | 分类器 |

  | :--- | :--- |

  | | 线性支持向量机 (SVM) |

  | **ResNet-50** | 94.1% |

  | **ResNet-101** | 93.4% |

  | **ResNet-152** | 93.6% |


  **表 6.2：** 使用 VGG 模型对巴基斯坦鼻部图像进行二分类的性能准确率。


  | 特征提取模型 | 分类器 |

  | :--- | :--- |

  | | 线性支持向量机 (SVM) |

  | **VGG-16** | 90.8% |

  | **VGG-19** | 87.5% |

  | **VGG-Face** | 79.9% |


  然而，如表 6.2 所示，`VGG-16` 在二分类任务中表现优于 `VGG-Face` 和 `VGG-19`。






  #### 使用孤立面部特征裁剪的额外实验


  进行了使用孤立面部特征裁剪的额外实验，以确定特征组合是否影响性能准确率。所使用的特征组合包括：(1) 眼睛和鼻子，(2) 鼻子和嘴巴，以及 (3) 嘴巴和眼睛，如表
  6.3 所示。


  从孤立特征组合中获得的结果表明，平均而言，鼻子和嘴巴的特征产生最高结果 (85.63%)。此外，对于所有测试的预训练模型，鼻子和嘴巴的特征组合始终产生最高的性能准确率。


  紧随其后的是嘴巴和眼睛以及眼睛和鼻子的组合，平均准确率分别为 82.56% 和 81.55%。结果表明，内部特征（即眼睛、鼻子和嘴巴）提供了可靠的信息，以区分巴基斯坦面孔和非巴基斯坦面孔。重要的是，报告的结果与提出眼睛、鼻子和嘴巴在确定人类种族方面很重要的文献一致。


  ##### 性能指标


  为了确定所获结果的有效性，计算了灵敏度和特异度等性能指标。灵敏度是正确分类的正例值 (`TPR`)，特异度是正确拒绝的负例值 (`TNR`)。通过结合灵敏度和特异度，报告了分类算法的总体性能准确率。数值的可视化表示以接收者操作特征
  (`ROC`) 图的形式显示。


