  在本章中，我们展示了如何通过实证研究各种深度迁移学习策略以分析病理组织学图像。实验表明，在微调网络策略下，`AlexNet` 和 `ResNet` 架构产生了表现最佳的模型。`SVM`
  分类器是在特征提取器策略中表现最好的，其次是 `RF`。`AlexNet` 和 `ResNet101` 模型适合我们的图像数据集。


