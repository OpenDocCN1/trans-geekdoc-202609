  #### 使用 FaceNet 的识别实验


  FaceNet 模型的主要优势之一是它能够仅使用包含 128 个特征的简单嵌入实现极高的分类准确率。在 LFW 数据集和 YouTube Faces DB 上进行的人脸实验表明识别率非常高，即在
  LFW 数据集上实现了 98.87% 的识别准确率，而在 YouTube Faces DB 上实现了 95.18% 的识别准确率。关键在于，这两个数据集都包含在不同光照、姿态、遮挡和年龄条件下拍摄的人脸。尽管如此，FaceNet
  在识别任务上的表现仍令人印象深刻。


  ### 基于局部人脸的深度人脸识别


  基于深度学习领域已开展的大量人脸识别工作，很明显，当查询图像为正面全脸时，许多最先进的算法能提供人脸识别的人类水平准确率。例如，上文讨论的 FaceNet 模型，使用正面人脸图像进行人脸识别时提供了令人印象深刻的准确率。


  然而，在许多实际场景中，完整人脸可能无法作为数据集中的探针图像或比较图像获得。在此，我们讨论如何进一步推进基于深度学习的方法，使此类模型能够成功地仅凭局部信息识别人脸。实现这一点可以为深度学习模型超越人类水平的人脸识别提供潜力。


  正如前几章所讨论的，一般来说，如今部署 CNN 有多种方式。这些包括从头训练网络、微调现有模型，或使用来自预训练模型的现成 CNN 特征。后者被称为迁移学习。





  值得注意的是，从头训练 CNN 需要海量数据，这通常是一项极具挑战性的任务，例如，从头训练 `FaceNet` 模型需要数百万张人脸图像和数百小时的计算时间。另一方面，微调涉及将基础网络前几层学到的权重迁移到目标网络中。然后，目标网络即可使用新数据集进行训练。


  在此，我们将展示如何利用预训练的 `VGG-F` 模型进行特征提取以实现人脸特征编码，以及如何使用余弦相似度度量或线性 `SVM` 度量进行分类，从而实现从局部人脸的高效人脸识别。


  ### VGG-Face 模型


  正如上一章所述，`VGG-F` 模型是人脸识别领域最流行、应用最广泛的预训练 CNN 模型之一，由牛津视觉几何组开发。该模型在包含 260 多万张人脸图像、超过
  2600 个不同身份的大型数据集上进行了训练。`VGG-F` 的架构由 38 层组成，从输入层延伸至输出层。作为固定标准，输入应为 224 × 224 尺寸的彩色图像，作为预处理步骤，通常会从输入图像计算平均值。


  总体而言，`VGG-F` 包含十三个卷积层，每层都拥有一组特殊的混合参数。每组卷积层包含 5 个最大池化层和 15 个修正线性单元（`ReLU`）。随后是三个全连接层（`FC`），分别命名为
  `FC6`、`FC7` 和 `FC8`。前两层各有 4096 个通道，而 `FC8` 有 2622 个通道，用于对 2622 个身份进行分类。最后一层是分类器，即
  `Softmax` 层，其功能是对图像进行分类。`VGG-F` 的架构如图 4.3 所示。


  ![图 4.3：VGG-Face 模型基本架构示意图。](img/fig4_3_B.jpg)


  图 4.3： VGG-Face 模型基本架构示意图。


  ##### 特征提取


  给定一张输入图像 `X[0]`，可将其表示为张量 `X[0] ∈ R^(HWD)`，其中 `H` 为图像高度，`W` 为宽度，`D` 代表颜色通道。CNN 的预训练层
  `L` 可表示为一系列函数：`g[L] = f[1] → f[2] → ⋯ → f[L]`。


  设 `X[1], X[2], ..., X[n]` 为网络中每层的输出。则第 `i` 个中间层的输出可由函数 `f[i]` 和学习到的权重 `w` 计算得出，即
  `X[i] = fi`。


  众所周知，CNN 通过训练阶段学习特征，随后利用这些特征对图像进行分类。每个卷积（`conv`）层学习不同的特征。例如，某层可能学习图像的边缘和颜色等实体，而更复杂的特征可能在更深层学到。例如，`conv`
  层的输出包含众多被称为通道的二维数组。在 `VGG-F` 中，共有 37 层，其中 13 个为卷积层，其余层在 `ReLU`、池化、全连接和 `softmax`
  之间混合。然而，将 `conv5_3` 层应用于输入图像后，该层拥有 512 个大小为 3 × 3 的滤波器，可提取用于分类的特征。通过检查该层的激活值，可获得主要特征，如图
  4.4 所示，其中展示了特征样本。


  ![图 4.4：从 VGG-Face 模型 conv5_3 层检索到的特征示例。](img/fig4_4_B.jpg)


  图 4.4： 从 VGG-Face 模型 conv5_3 层检索到的特征示例。


  为确定 `VGG-F` 模型中最适合人脸特征提取的层，必须进行多次试错实验。我们测试了第 34 层至第 37 层。在实验中我们也尝试了其他层，但最佳结果来自第
  34 层。值得注意的是，该层为全连接层，位于 CNN 末端，意味着提取的特征代表整张人脸。


  第 34 层的特征源自应用 `ReLU6` 后的全连接层 `FC7`，输出为 4096 维向量。推荐第 34 层为最佳层的理由，源于我们进行的大量人脸识别测试：在训练和测试均使用正脸图像的情况下，识别率达到了
  100%。通过特征提取进行训练和测试的完整流程在图 4.5 中进一步描述。


  ![图 4.5：解释如何从人脸数据提取特征的算法](img/fig4_5_B.jpg)


  图 4.5： 解释如何从人脸数据提取特征的算法


  ### 特征分类


  分类的目标之一是根据预测特征，建立类别标签分布的简要模型。分类技术有多种，即决策树、K 近邻（`kNN`）和 `SVM`。


  `SVM` 是一种监督机器学习算法，可用于二分类和多分类问题。`SVM` 专注于通过超平面识别“边界”以将数据分离为不同类别。最大化边界通过在分离超平面之间创建尽可能大的距离，降低了预期泛化误差的上界。显然，`SVM`
  擅长解决二分类问题。在本文描述的所有实验中，我们均使用线性 `SVM` 基于一对一（`OVO`）方法解决多分类问题。这也称为成对分类。`OVO` 分解为给定的
  `n` 个类别构建 `n(n − 1)/2` 个二元分类器。最终决策时，采用纠错码（`ECC`）组合方法决定如何组合各个分类器。


  假设我们有一个训练数据集 `(x[i], y[i])`，可使用线性 `SVM`，使得：


  $$

  \underset{w \in R^{d}}{\text{min}}\frac{1}{2}\left\| w \right\|^{2} + C{\sum\limits_{i}^{N}{\max\left(
  {0,1 - y_{i}w^{T}x_{i}} \right)}}, \tag{4.2}

  $$


  其中 `w` 为权重向量，`N` 为类别数量，`C` 为误差与边界之间的权衡参数。


  此外，也可利用余弦相似度（`CS`）进行分类。余弦相似度是两个非零向量之间的度量。它利用内积空间测量两向量夹角的余弦值。可使用欧几里得点积公式计算余弦相似度，即：


  `a ⋅ b = ‖a‖‖b‖cos θ`， (4.3)


  其中 `a` 和 `b` 为两个向量，`θ` 为它们之间的夹角。


  利用模或长度（即向量 `x = [x[1], x[2], x[3], ..., x[n]]` 的欧几里得范数或欧几里得长度），相似度 `S` 可按以下公式计算：


  `‖x‖ = √(x₁² + x₂² + x₃² + ... + xₙ²)`， (4.4)


  $$

  \begin{array}{l}

  S = \cos\theta = \frac{A \cdot B}{\left\| A \right\|\left\| B \right\|}, \\

  \quad = \frac{\sum_{i = 1}^{n}{A_{i}B_{i}}}{\sqrt{\sum_{i = 1}^{n}A_{i}^{2}}\sqrt{\sum_{i
  = 1}^{n}B_{i}^{2}}},

  \end{array} \tag{4.5}

  $$


  其中 `A` 和 `B` 为两个向量。


  为进行分类，可通过使用公式 4.6 和 4.7 计算 `CS`，找到测试图像 `test[im]` 与训练图像 `trainingⁿ[im]` 之间的最小“距离”，即：


  `M[CS] = min(dist(test[im], training[im]ⁿ))`， (4.6)




  其中 `im` 为图像编号，`n` 为训练集中的总图像数，且


  $$CS\left( {test\_{im},training\_{im}^{n}} \right) = \frac{\sum\_{j = 1}^{m}{training\_{jm}^{i}test\_{im}}}{\sqrt{\sum\_{j
  = 1}^{m}{training\_{jm}^{i2}}}\sqrt{\sum\_{j = 1}^{m}{test\_{im}^{2}}}}$$ (4.7)


  其中 `m` 为向量的长度。


  ### 实验


  利用上述公式，此处讨论了一些实验，展示了 VGG-F 在部分人脸条件下的人脸识别任务中的表现与性能。为开展这项工作，我们使用了两个流行人脸数据集（即 FEI 和
  LFW）中的人脸图像。两个数据库中的所有图像均经过裁剪，利用级联目标检测器提取人脸及内部面部特征，以尽可能去除背景。然而，对于背景极其复杂的某些图像（如 LFW
  数据库中的情况），我们手动裁剪了这些图像中的人脸。为训练目的，每个主体 70% 的图像被用于训练，并通过填充和翻转等操作进行了增强。剩余 30% 的图像在各情况下均用于测试。


  #### 实验 1


  在本实验中，使用 FEI 数据集，为人脸的每个部分生成了十个测试集。因此每个数据集包含 600 张图像。选取的人脸部分包括眼睛、鼻子、右脸颊、嘴巴和额头。此外，还生成了仅含眼睛和鼻子、下半张脸、上半张脸、右半张脸、四分之三张脸以及全脸的图像。图
  4.6 展示了每种图像的样本。


  ![图 4.6：来自 FEI 数据集典型人脸的各部分人脸样本。](img/fig4_6_B.jpg)


  图 4.6： 来自 FEI 数据集典型人脸的各部分人脸样本。


  在利用 VGG-F 模型从所有测试数据库中提取特征后，应用 SVM 单独调查各部分的识别率。正如 图 4.7 所示图表中可见，最高百分比出现在全脸识别中，达到
  100%，四分之三脸也达到 100%。在下半张脸时，比例逐渐下降至约 50%，且这一下降趋势持续至右脸颊处的近 0.5%。


  #### 实验 2


  本实验旨在探究人脸旋转对识别的影响。此处生成了 18 个独立数据集，每个数据集包含 600 张图像。这些数据集被命名为 R10、R20、R30... R180
  等。符号 R 表示施加的旋转角度（度）。图 4.8 展示了部分旋转人脸的样本。


  同前一实验一样，所有图像的特征均由 VGG-F 模型提取，并由 SVM 进行测试。产生最佳识别效果的角度为 10°、20° 和 30°，这些角度下的识别率分别为
  100%、100% 和约 97%。另一方面，在 50° 时识别率逐渐下降至约 27%，并持续下降至倒置人脸（180°）时的 1%。图 4.9 展示了各角度下的识别率。


  ![图 4.7：FEI 人脸数据的部分人脸识别率（%）。](img/fig4_7_B.jpg)


  图 4.7： FEI 人脸数据的部分人脸识别率（%）。


  ![图 4.8：10° 至 180° 旋转人脸的样本。](img/fig4_8_B.jpg)


  图 4.8： 10° 至 180° 旋转人脸的样本。


  #### 实验 3


  在本实验中，使用了九个缩放人脸测试集（缩放 10、缩放 20、缩放 30、...、缩放 90）。此外，每个测试集包含 600 张图像，所有图像均单独测试，以找出机器在何种缩放程度下会识别失败，以及何种程度具有良好的识别率。图
  4.10 展示了缩放人脸的样本。


  ![图 4.9：来自 FEI 数据库的带旋转部分人脸识别率（%）。](img/fig4_9_B.jpg)


  图 4.9： 来自 FEI 数据库的带旋转部分人脸识别率（%）。


  ![图 4.10：缩放人脸的样本。](img/fig4_10_B.jpg)


  图 4.10： 缩放人脸的样本。


  在利用 VGG-F 模型提取所有人脸特征并使用线性 SVM 对所有人脸进行分类后，得出以下结果：最高识别率分别出现在缩放 10°、20° 和 30°，均为 100%。在缩放角度
  50° 时，该百分比略微下降至约 97%。另一方面，在 60° 时识别率逐渐下降至约 46%。相反，在缩放 70、80 和 90 时，识别比例达到近 0.5%。


  #### 实验 4


  在本实验中，根据 FEI 数据集中的人脸生成了十二个测试集，每个测试对应人脸的特定部分。此次训练同时使用了全脸和部分人脸。测试的人脸部分包括眼睛、鼻子、右脸颊、嘴巴和额头。此外，还生成了仅使用眼睛和鼻子、下半张脸、上半张脸、右半张脸、四分之三张脸以及全脸的图像。


  在从 VGG-Face 模型提取特征后，应用了不含部分的 CS（CS-Wo）和不含部分的线性 SVM（SVM-Wo，含 19900 个二分类器），以单独调查各面部部分的识别率。使用全脸和四分之三脸时达到最高识别率，因为两种分类器均实现了
  100% 的识别率。然而，使用右半脸和上半脸时，SVM-Wo 的识别率开始略微下降，但在 CS-Wo 情况下，识别率保持在 100%。同样，随着接近下半张脸，SVM-Wo
  的识别率进一步下降至约 50%，CS-Wo 约为 60%。这一下降趋势持续至右脸颊处的近 0.5%。


  为测量使用人脸部分时的识别率，我们重复了上述过程，但这次也将单个面部部分加入训练集。此时识别率显著提高。例如，右脸颊的结果先前近 0%，使用两种分类器后识别率提高至
  15%。又如，眼睛和鼻子组合特征的识别率先前 SVM-W 为 22%，CS-W 为 40%，而在此情况下，SVM-W 识别率提高至约 57%，CS-W 高达 90%。不过我们注意到，并非所有识别率都稳步上升。某些情况下，SVM-W
  结果略有下降。例如，测试下半张脸时观察到识别率轻微下降，从 53% 降至 51%。相比之下，CS-W 方法产生了显著改进；例如，眼睛和鼻子组合的识别率从 40%
  提升至 90%。


  #### 实验 5


  在本实验中，根据 LFW 数据集中的人脸生成了十二个测试集，每个测试对应人脸的特定部分——同样在训练中同时使用了全脸和部分人脸。测试的人脸部分包括眼睛、鼻子、右脸颊、嘴巴和额头。此外，还生成了仅使用眼睛和鼻子、下半张脸、上半张脸、右半张脸、四分之三张脸以及全脸的图像。





  从 `VGGF` 模型提取的所有特征均被输入到两个分类器（`SVM` 和 `CS`）中，这两个分类器均在两种实验条件下进行了测试，即训练时不包含面部局部（`SVM-Wo`
  和 `CS-Wo`）以及训练时包含面部局部（`SVM-W` 和 `CS-W`）。为了研究各面部局部的识别率，每个分类器都被单独应用。在不包含面部局部的情况下，总体上
  `CS-Wo` 在大多数面部区域的表现优于 `SVM-Wo`。右脸颊、嘴巴、前额和鼻子的识别率较低，两个分类器均约为 1%。相比之下，面部局部（如眼睛）的识别率显著提高，使用
  `CS-Wo` 时达到了 40%。我们注意到，随着面部比例的增加，识别率也显著提高，3/4 脸和全脸的最佳识别率达到了 100%。同样，在所有测试案例中，我们均观察到
  `CS` 优于 `SVM`。


  与之前的实验类似，我们使用面部局部和相同的分类器重复了所有测试，但这次我们将面部局部添加到了训练集中（`SVM-W` 和 `CS-W`）。结果如图 4.11 所示，使用
  `SVM-W` 时识别率有显著提高。例如，右脸颊的识别率原本约为 1%，现在几乎达到了 10%。在考虑嘴巴、前额和鼻子时，我们也观察到两个分类器的识别率均有轻微提高。随着面部比例的增加，使用
  `CS-W` 时识别率也显著提高，眼睛区域达到了 70%，而非约 42%。然而，使用 `SVM-W` 时未出现这种提高（识别率为 7%）。此外，对于眼睛和鼻子被遮挡、底部、顶部和右半部分被遮挡的图像，使用
  `CS-W` 时识别率显著提高，但 3/4 脸的识别率略微下降，从约 94% 降至 93.5%。


  ![图 4.11：基于面部局部使用两种分类器（SVM 和 CS）在 LFW 数据集图像上的识别率（%）。测试刺激包括训练阶段包含和不包含单个面部局部的条件。](img/fig4_11_B.jpg)


  图 4.11： 基于面部局部使用两种分类器：`SVM` 和 `CS`，在 LFW 数据集图像上的识别率（%）。测试刺激包括训练阶段包含和不包含单个面部局部的条件。


  ### 讨论


  在本章中，我们讨论了深度学习如何用于人脸识别。特别是，我们讨论了当完整面部信息可用时，`FaceNet` 模型如何用于识别。我们还展示了 `VGG-Face`
  模型提取特征以及支持向量机 `SVMs` 进行分类，在部分人脸识别上的表现。现有基于机器的人脸识别算法在部分面部数据（如遮挡人脸、旋转人脸或缩小人脸）作为线索的情况下表现良好，这在视觉计算领域仍是一项具有挑战性的任务。然而，所呈现的实验演示了如何利用深度学习通过部分面部线索进行人脸识别。因此，给定部分面部数据，我们展示了如何使用流行的
  CNN（如 `VGG-F` 模型）进行特征提取。我们还展示了如何应用基于流行的 `SVMs` 和 `CS` 的分类器来执行人脸识别任务。


  在部分人脸上使用 `VGG-Face` 模型的结果显示，面部小局部的识别率较低，尤其是脸颊和前额。在眼睛区域，识别率略有提高，但在眼睛和鼻子两者结合时，识别效果更好。从下半脸开始，识别率急剧提高。对于旋转，在十度时机器仍保持完全识别，随着角度逐渐增加，观察到识别率下降，直到在
  180 度倒置人脸时达到 0.3333。在缩放人脸图像上，识别结果与人脸旋转获得的结果非常相似，通过 60% 的缩放，识别率下降到 36%，并持续下降直到达到
  0.5%。


  对于特征提取，使用了第 34 层。此外，应用不同的层来决定哪些特征可用于分类以产生最佳结果。该层位于 `VGG-Face` 模型的前两个全连接层 `FC6` 和
  `FC7` 之间，可生成一个 4096 维的向量。对于分类目的，应用了最流行的分类器，即支持向量机 `SVMs`。`SVM` 是一种数据分类技术，可用于分类和回归挑战。`SVM`
  有不同类型，线性和非线性，本工作中使用线性 `SVM` 通过将所有图像拟合到分类器中来分离数据。


  在本章中，我们讨论了一组使用部分面部数据进行人脸识别的实验。我们的结果表明，无论眼睛、鼻子或嘴巴等显著面部特征的性质如何，随着面部比例变小，识别率均较差。然而，我们注意到即使在基于机器的人脸识别中，眼睛似乎比其他单个面部特征携带更多的识别线索。此外，就旋转人脸而言，我们注意到最好避免高度旋转的人脸（例如旋转角度在
  110° 和 120° 之间的人脸），因为无论是否将旋转人脸纳入训练数据，它们在识别任务中的表现都非常差。在缩小人脸的情况下，同样建议不要使用高度缩小的人脸（例如缩小到
  70% 到 90% 的人脸）作为探针。最后，我们注意到与线性和核 `SVMs` 相比，`CS` 度量极大地提高了分类性能。


