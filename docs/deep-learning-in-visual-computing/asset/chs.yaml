  尽管图像数据集规模较小，但结果显示不同模型间均具有良好的准确率。`AlexNet` 模型实现了高度成功的分类，准确率达 `98.25%`，紧随其后的是 `ResNet50`
  和 `ResNet101` 模型，准确率分别为 `97.89%` 和 `96.84%`。但 `VGG16`、`VGG19`、`GoogLeNet` 和 `IncV3`
  的分类准确率接近，分别为 `95.44%`、`95.79%`、`95.09%` 和 `93.33%`，而 `IncResNet` 模型表现最差。


  在比较八种方法的时间性能时，值得注意的是 Series Network 比 DAG Network 更快。`AlexNet` 速度最快，训练仅需 `15` 分钟，其次是
  `VGG16`、`VGG19`、`GoogLeNet` 和 `ResNet50`。然而，`IncV2`、`ResNet101` 和 `IncResNetV3`
  耗时较长（测试环境为 `2.2 GHz` 双核 `i7 CPU` 计算机）。


  结果表明，`AlexNet`、`ResNet50` 和 `ResNet101` 的精确度没有显著差异。它们的正确分类率接近且较高，分别为 `98.74%`、`98.73%`
  和 `98.72%`。尽管 `IncResNet` 模型的准确率和精确率与其他模型相比最差，但它拥有最高的灵敏度（召回率）。


  因此，我们展示了 `AlexNet`、`VGG16`、`VGG19`、`GoogleNet`、`IncV3`、`ResNet50`、`ResNet101` 和
  `IncResNetV2` 等流行模型在组织病理学图像数据集上使用微调策略时的表现。`AlexNet` 和 `ResNet` 模型被发现比其他模型更准确、精确和可靠。它们的灵敏度范围在
  `99.00%` 到 `97.00%` 之间。


  关于评估，三个实验中的分类器均根据准确率的标准性能标准进行评估。为评估各种方法，训练和测试使用了相同的图像。比较采用两次 `10` 折交叉验证进行。对于每次交叉验证，基于九折训练样本，通过参数空间中的网格搜索计算每个特征集的性能值。因此，每次交叉验证的数值可能略有不同，报告的是平均最优值。


  重要的是要强调，目前尚无共识认为微调策略优于现成特征提取策略。就性能而言，在生物医学成像领域，这两种策略尚未进行彻底比较，也没有共识表明哪种更好。生物医学领域的一些研究表明微调优于现成特征。然而，这并不完全具有决定性。此外，正如所述，微调比使用现成特征计算量更大，且涉及处理更多超参数。而现成特征方法从
  CNN 提取特征通常较快，仅需调整最终分类器的超参数，这通常可通过交叉验证高效完成。


  本研究在考虑 `VGG-16` 结果时的另一个关键观察是特定 FC 层错误预测的数量。在该模型使用 SVM 产生的 `57` 个错误预测中，`36` 个来自 FC
  层 `34`，`17` 个来自 FC 层 `35`（原文逻辑疑似有误，此处保留原文数字对应关系）。该模型仅在使用 FC 层 `35` 配合 SVM 时实现了 `100%`
  的性能准确率，FC 层 `35` 和 SVM 相比其他层提供了略好的结果。尽管无法确认使用特定 FC 层是否存在潜在联系，但这是一个值得探索的领域。此外，本项目中使用的不同层也是一个关注点。模型中的层与图像的特定特征相关，用于将图像转换为一组有意义的数字。然而，哪一层对应何种特征仍在研究中。对层的更多了解有助于回答为何某些层（FC
  层 `35`）表现优于其他层（FC 层 `34`）。






  不同全连接层（FC 层）的结果也可用于评估识别肿瘤和非肿瘤图像的能力。信息从 `VGG-Face` 模型中提取并输入到一个新算法中。为确保软件不会直接生成 `VGG-Face`
  模型的结果，FC 层 36 被用作最后一个 FC 层。如果靠近 `VGG-Face` 模型最后一层（FC 层 37）的 FC 层表现更好，则表明当图像特征提取位置非常接近最后一层（该层更专门针对人脸）时，软件表现更好。然而，如果离最后一层较远的
  FC 层表现更好，则可以假设这些层学习到了更通用的信息，因此人脸识别算法可以成功用于任何其他图像，如肿瘤图像。由于 FC 层 36 被用作软件的最后一层，研究中的所有
  12 个结果均证实，人脸识别算法可用于成功识别肿瘤和非肿瘤图像。然而，应注意到 FC 层 33 和 35 的表现优于 FC 层 36，这表明在人脸识别算法中使用较低的
  FC 层能产生更好的结果。


  深度学习方法已被证明在各种用途的学习中极为有效。它们与大多数机器学习模型不同。然而，大多数模型强调学习复杂的分类器，而 CNN 则强调学习复杂的特征。确实，网络的所有层都有助于提取和学习日益复杂的特征。输出层除外，它基于这些特征充当一个相对简单的分类器。


  另一方面，CNN 通常需要大型数据集进行训练；这就是为什么近期的方法趋向于使用在大型图像数据集上预训练的现有模型的迁移学习策略。CNN 可高效用于迁移学习，即网络可在源任务（如
  `ImageNet` 数据集）上训练，然后在目标任务（如组织病理学图像数据集）上复用。这些训练好的模型可进一步针对新数据集进行微调以获得更好的拟合，或从其激活层提取特征以馈送分类器。


  正如文献所述，迁移学习技术非常有用，特别是在目标任务的数据稀缺时。因此，组织病理学领域已研究深度迁移学习以克服数据稀缺问题。本质上有两种迁移学习策略，即使用从预训练网络中提取的现成特征，以及针对手头任务微调预训练网络。CNN
  的泛化特性使其特征可迁移到其他应用，这鼓励研究人员将迁移学习用于组织学图像。正如所解释的，这些特征也被用于训练单独的分类器进行预测，当没有足够的数据集从头训练
  CNN 时，这特别有用。


