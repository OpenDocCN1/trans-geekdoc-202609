  真阴性 (TN) 是某类的实际数据，并被预测为该类。同样，真阴性是不属于某类的实际数据类别，并被预测为不属于该类，例如正常皮肤被预测为正常。当某类数据为阴性但被算法预测为阳性时，称为假阳性。但当数据为阳性而被算法预测为阴性时，则为假阴性。


