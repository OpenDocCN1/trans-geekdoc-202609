  # 第 9 章：用于心电图分析的深度迁移学习模型


  心脏病发作或心肌梗死（MI）是常见的心脏疾病之一。当心脏的一条或多条冠状动脉阻塞时就会发生。早期检测 MI 对于降低不断上升的死亡率至关重要。目前，心脏病专家使用心电图（ECG）作为一种诊断监测工具，可揭示
  MI 信号。然而，并非所有 MI 信号都稳定，且可能含有噪声，因此手动检测或观察这些信号可能具有挑战性。此外，手动分析大量 ECG 信号数据既繁琐又耗时。因此，需要开发高效的方法来自动分析
  ECG 数据，以实现准确诊断。在本章中，我们将展示基于深度学习的解决方案如何帮助应对这一挑战。我们将展示如何使用两种迁移学习技术重新训练预训练的 `VGG-16`
  模型，以获得两个新网络，即 `VGG-MI1` 和 `VGG-MI2`。具体而言，我们相应地修改了 `VGG-16` 的最后一层和 `VGG-Net` 模型的最终层，以满足我们的需求。此外，我们将展示如何向模型引入各种函数以减少过拟合。在
  `VGG-MI2` 中，选择模型的一层作为 ECG 图像的特征描述符，以描述一些基本特征。因此，在本章中，我们将展示如何开发一种用于心电图分析的准确工具，以实现
  MI 的高效诊断。


  ### 简介


  冠心病是全球人类死亡的主要原因之一。每年有超过 1770 万人死于心血管相关疾病。心脏病发作占此类死亡的 70%以上 [[1]](#16_ch9.xhtml#r9_1)。心脏病发作的主要原因是血液在心脏冠状动脉内流动能力不足，导致一种称为心肌梗死（MI）的医疗状况。


  心脏的功能高度依赖于氧合血液在其内部的循环，以滋养动脉和心肌。当冠状动脉严重阻塞，导致营养和富氧血液供应不足时，就会发生 MI。通常，在检测到 MI 活动开始后一小时内可能发生猝死
  [[2]](#16_ch9.xhtml#r9_2)。因此，定期监测可疑对象的心律以了解心脏状况并预防 MI 的发生变得至关重要。


  心电图（ECG）分析是提供诊断 MI 充分信息的方法之一。其他标准检查包括诊断性磁共振成像（MRI）和超声心动图。然而，ECG 分析是提供 MI 准确诊断最高效且最具成本效益的方法。此外，它通常通过人工方式完成，即合格的临床医生必须进行视觉检查以做出诊断。然而，这一过程可能繁琐、耗时且容易出错。因此，使用高效的基于计算机的方法来协助解决这一问题似乎是可行的。


  过去，研究人员尝试使用基于视觉计算的技术来解决这一问题。例如，Sadhukhan 等人 [[3]](#16_ch9.xhtml#r9_3) 尝试通过图像处理工具分析
  ECG 信号的谐波相位分布，以量化 MI 程度，准确率达 95.6% [[3]](#16_ch9.xhtml#r9_3)。Jayachandran 等人利用小波及其多重分辨率特性从
  ECG 信号中检测 MI，准确率为 96.1% [[4]](#16_ch9.xhtml#r9_4)。Dohare 等人利用支持向量机（SVM）分类器分析 ECG
  信号，在 MI 诊断中达到了 96.66%的准确率。同样，Arif 等人实现了 k 近邻（kNN）分类器以提取 ECG 信号的时域特征，从而检测和定位 MI 信号
  [[5]](#16_ch9.xhtml#r9_5)，在 MI 检测中达到了 99.9%的准确率。






  ### 机器学习作为图像和信号分析的流行方法


  机器学习作为图像和信号分析的流行方法，已被用于尝试分析近期学术文献中报道的来自心脏的心电图（ECG）信号。然而，许多方法基于小规模、计算密集型的机器学习模型以及特征提取/分类。因此，模型过拟合和计算效率低下的问题常被报告。深度学习在此领域的应用前景似乎十分广阔。因此，本文旨在探索并展示这一可能性。


  也有多种方法被提出，通过对心电图信号进行数字分析来检测心肌梗死（MI）[6]。然而，基于 CNN 的先前工作中，鲜有用于 MI 检测的。例如，Wu 等人[7]
  利用 Softmax 回归作为多类分类器进行心电图信号分析。在此框架中，他们引入了离散小波变换，从而能够学习信号中的特征。通过这种构建，他们证明了以 99.82%
  的准确率对心电图信号进行 MI 分类是可行的。同样，Acharya 等人[8] 利用一个手工设计的 11 层一维 CNN 并结合降噪滤波器，实现了 93.53%
  的 MI 检测准确率。Liu 等人[9] 提出了一种称为多特征分支 CNN (MFB-CNN) 的方法用于 MI 检测，准确率达到 98.79%。然而，在所有这些工作中，研究人员均使用了大尺寸卷积滤波器，导致计算成本高昂。这些工作中许多也表明，他们的实验是在小规模心电图数据集上进行的，这往往会导致特异性和敏感性数值偏低。


  ### 迁移学习模型


  此处，我们讨论一种深度迁移学习架构，可成功用于分析心电图信号，以实现心肌梗死的自动诊断。该模型基于 `VGG-16` 基础架构并进行了多项增强。此处讨论的模型有两种形式，即
  `VGG-MI1`（一种新的网络结构）和 `VGG-MI2`（可用于从心电图信号图像中提取特征）。


  因此，利用预训练的 `VGG-16`，我们获得了两个新网络——`VGG-MI1` 和 `VGG-MI2`——它们在第一层卷积层中采用较小的滤波器尺寸，且池化层数量也较少。这使得新模型在计算上更加高效。此外，`VGG-16`
  中的 1000 单元 Softmax 被更简单的 2 单元 Softmax 层所取代。因此，新模型的输出是二元的，适合于此处处理的心电图信号分析。


  表 9.1 提供了所提议 CNN 模型中各层的详细信息。此处包含卷积层、池化层，随后是两个全连接层，输入为图像格式的信号（128 × 128 × 1）。最大池化层使我们能够控制计算复杂度，并有助于解决过拟合问题。此外，通过为各层提供适当的
  ReLU 激活函数，也向模型引入了非线性，即：


  ```

  f(x) = max(0, x), (9.1)

  ```


  其中 `x` 被视为神经元的输入。


  为了同时降低噪声和计算成本，在第一层卷积层中也可采用 3 × 3 滤波器，而非常用的较大滤波器（如 5 × 5 或 10 × 10）。此外，为避免训练阶段过拟合，在网络的全连接层中采用了
  Dropout 技术[10]。未对卷积层应用 Dropout，因为与激活层相比，这些层的参数数量相对较少。


  为进一步优化所提议的 CNN 架构，此处我们使用了两个具有增强迁移学习的子网络。我们将 VGG 模型最后的 1000 单元 Softmax 层替换为 2 单元
  Softmax 层，称为 `VGG-MI1`。`VGG-MI1` 的详细信息如图 9.1 所示。然后我们选择预训练模型第二个全连接层的输出，该输出包含特征描述符。该网络称为
  `VGG-MI2`，如图 9.2 所示。除了替换最后的 1000 单元 Softmax 层外，我们在 `VGG-MI1` 的设计中还修改了标准 VGG 模型的各种功能。这有助于克服过拟合问题并提高分类准确率。


  表 9.1 ：所提议 VGG-MI 的架构。


  | 层号 | 类型 | 核大小 | 核数量 | 步长 | 输入尺寸 |

  | --- | --- | --- | --- | --- | --- |

  | 第 1 层 | Conv1 | 3 × 3 | 64 | 1 | 128 × 128 × 1 |

  | 第 2 层 | Conv2 | 3 × 3 | 64 | 1 | 128 × 128 × 64 |

  | 第 3 层 | Pool | 2 × 2 | | 2 | 128 × 128 × 64 |

  | 第 4 层 | Conv3 | 3 × 3 | 128 | 1 | 64 × 64 × 64 |

  | 第 5 层 | Conv4 | 3 × 3 | 128 | 1 | 64 × 64 × 128 |

  | 第 6 层 | Pool | 2 x 2 | | 2 | 64 × 64 × 128 |

  | 第 7 层 | Conv5 | 3 × 3 | 256 | 1 | 32 × 32 × 128 |

  | 第 8 层 | Conv6 | 3 × 3 | 256 | 1 | 32 × 32 × 256 |

  | 第 9 层 | Pool | 2 × 2 | | 2 | 32 × 32 × 256 |

  | 第 10 层 | Full | | 2048 | | 16 × 16 × 256 |

  | 第 11 层 | Full | | 2048-dropout | | 2048 |

  | 第 12 层 | Soft | | 2 | | 2048 |


  ![图 9.2 所提议 VGG-MI2 模型的架构。](img/fig9_2_B.jpg)


  图 9.2 所提议 VGG-MI2 模型的架构。


  ### 训练


  要训练 `VGG-MI1` 模型，可采用带有小批量的随机梯度下降（SGD）方法。这些小批量的大小可以为 5，并可通过动量函数进行增强。此外，网络滤波器的权重可使用随机采样进行初始化。此处，对于随机采样，使用了标准差为
  0.01、均值为零的高斯分布。此外，超参数设置为学习率为 0.001。权重衰减参数设为 0.0005。表 9.2 显示了可用于所提议 CNN 模型的各种参数。使用这些设置，可以按给定的轮数（epochs）进行
  CNN 的训练和测试——通常 50 个轮数足以获得一个准确的网络。


  表 9.2 我们模型中最重要的 VGG 参数。


  | 参数 | 数值 |

  | --- | --- |

  | 学习率 | 0.001 |

  | 标准差 | 0.01 |

  | 均值 | 0 |

  | 权重衰减 | 0.0005 |

  | 轮数 | 50 |

  | 小批量大小 | 5 个样本 |


  要训练 `VGG-MI2` 模型，可使用 Q-高斯多类支持向量机（QG-MSVM）分类器[11]，其定义如下：


  ```

  K(x, x_i) = (1 + (q - 1) / ((3 - q) * sigma²) * ||x - x_i||²)^(1 / (1 - q)), (9.2)

  ```


  其中 `q` 为实值参数。此外，`ı` 为高斯分布的实值标准方差，每个 `x[i] ∈ R[p]` 均为 p 维实向量。在不同的设置中，QG-MSVM 曾用于指纹分类，并显示出优于
  SVM 核函数的有效性。因此，我们修改了 QG-MSVM，使其可用于如下设置：`1 / sigma²` 设为 0.5，`q` 设为 1.5。


  #### 所用数据集






  ### 测试 CNN 模型准确性


  为了测试所提 CNN 模型的准确性，我们在模型上运行了 PTB 数据集的数据。该数据集广泛应用于 MI 研究。PTB 数据集包含 290 例受试者的 549 份
  EEG 记录，其中 28% 为女性，72% 为男性。受试者年龄范围为 17 至 87 岁。在 549 例受试者中，有 368 例临床确诊为 MI。在本文讨论的实验中，使用了
  2 秒时长的 Lead II ECG 信号。共使用了 21,092 个正常 ECG 拍和 80,364 个 MI ECG 拍。此处，每个双拍信号均表示为一个 128
  × 128 的灰度图像。图 9.3 展示了正常和确诊 MI 信号在 2 秒内的样本图像。


  因此，通过将每个 ECG 信号绘制为单个 128 × 128 的灰度图像，原始 EEG 信号被转换为二维 ECG 图像。这样做是为了确保模型中的卷积层和池化层得到充分利用，从而获得更好的计算效率和准确性。此外，使用图像有助于数据增强——这是增强深度学习网络训练数据集时常需的一步。


  ![图 9.3 正常和 MI ECG 信号样本。](img/fig9_3_B.jpg)


  图 9.3 正常和 MI ECG 信号样本。


  #### 数据增强


  对于数据增强，我们将每张图像分成 9 张较小的图像，使每张小图代表原图的 75%。因此，我们从四个角各提取一张图像，从左侧、右侧、底部中心和顶部中心各提取一张。随后，将增强后的图像调整大小，使其同样为
  128 × 128。因此，通过所提出的增强步骤，我们将数据集扩充了 10 倍。


  #### 性能测量


  为验证模型，我们在每个完成的训练轮次后对 CNN 模型进行了测试。数据被分为三部分——60% 用于训练，30% 用于验证，10% 用于测试。此外，我们采用了十折交叉验证方法，即在每一折评估系统性能，并将所有十折的平均值计算为系统的最终性能。


  CNN 模型的结果可通过四种场景呈现。在最佳场景下，我们可以查看无噪声的 MI 信号，并在训练数据上采用增强技术。第二种场景下，我们处理无噪声的 MI 信号且不使用增强技术。第三种场景（即最差情况），我们处理有噪声的
  MI 信号并在训练数据上使用增强技术。第四种场景下，我们处理有噪声的 MI 信号且不使用增强技术。可以针对所有这些场景计算准确率、灵敏度、精确率和特异性指标，并对比所提子模型（`VGG-MI1`
  和 `VGG-MI2`）与标准模型（如 `VGG` 和 `AlexNet`）的性能。


