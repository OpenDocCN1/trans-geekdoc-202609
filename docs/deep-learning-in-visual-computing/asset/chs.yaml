  #### 实验设置


  八个预训练的 CNN 网络被用于输入四个分类器，性能结果见 表 8.4。对于每个分类器，均使用不同八个预训练 CNN 的全连接层提取的特征进行训练。分类器使用线性函数作为核函数，并采用序列最小优化方法寻找分离超平面。我们将其平均核大小设置为
