  # 第 3 章：视觉计算的深度学习模型


  深度学习旨在利用多层处理单元（神经元）来模拟和学习数据集中的复杂排列，以像人脑一样识别它们。深度学习算法通过操纵与神经元相关的参数以产生所需输出，利用一系列重复或多个人工神经元来学习非常复杂的数据。正如上一章所述，深度学习是一个具有多个隐藏层的神经网络。这可以与人类通过应用智能来解决复杂问题的思维方式相关联。同样，深度学习通过使用深层来找出给定分类问题的高效解决方案来实现这一点。






  ### 深度学习与卷积神经网络


  深度学习在图像和视频分析、目标跟踪、人体动作识别、图像风格化和人脸识别等多个应用领域均获得了成功的认可。其当下的流行归功于计算能力的增强，如图形处理单元的出现、硬件成本的降低以及网络连接速度的提升。此外，深度学习的流行还得益于可用于训练和测试算法的海量数据。深度学习在视觉计算问题中取得主要成功，源于高效卷积神经网络的出现。基于此，近期已有大量预训练模型可供使用。


  #### 卷积神经网络


  近年来，卷积神经网络（CNN）在视觉计算领域产生了重大影响。这归功于其利用非线性多层架构学习复杂特征的能力。尽管起源于 1990 年代初期，但由于假设基于梯度下降的特征提取将因相关优化问题目标函数中的局部极小值而总是过拟合，CNN
  曾被研究界摒弃。然而，其在 2012 年 ImageNet 竞赛中的卓越成功改变了这种悲观看法。如今，最先进的深度模型被用于几乎所有视觉计算应用，包括但不限于检测、识别、分类和信息检索。


  ##### 监督学习与前馈网络


  监督学习是机器学习最常见的形式之一。为理解该概念，请考虑构建一个将纸币分类为真钞或伪钞的系统这一问题。首先会收集大量图像数据集（真钞和假钞），然后在训练时，向机器展示一张照片及其类别，机器随后以两个分数的形式产生输出，每个类别一个分数。理想情况下，如果机器给目标类别打出最高分，则假定其输出良好。然而，我们几乎可以肯定机器在训练前无法产生此类输出。幸运的是，可以通过计算代价函数来跟踪机器在训练时的性能，该函数衡量机器输出与目标分数之间的差异（误差）。为减小误差，机器随即扰动其内部可调参数。通常这些参数被称为权重，它们定义了从输入到输出的映射。展示图像、估算分数、与目标比较并调整权重的这一训练过程会迭代进行，直到达到零误差或极小的可接受误差。一旦训练完成，机器的权重便具有了智能值，可用于将新的（未见过的）纸币图像以最小误差映射到某一类别。上述场景解释了前馈神经网络的基本工作原理。


  ##### 现成特征提取与迁移学习


  有趣的是，研究表明 CNN 能高效学习通用视觉特征。因此，这些特征可直接配合简单分类器来解决视觉计算问题。这种被称为现成特征提取的方法，已被多位研究者用于在视觉计算任务中取得有希望的结果。研究者建议，与其从头训练
  CNN，不如将迁移学习作为解决视觉计算任务的首选方法。同样，一些研究表明，对于图像数量较少的数据集，现成特征提取技术优于从头训练网络。


  ##### 网络架构与训练动态


  正如上一章所讨论的，如图 3.1 所示的神经网络，只有经过训练才能执行分类纸币这一认知任务。在图 3.1 的示例中，网络有 2 个输入、2 个包含 4 个神经元的隐藏层和
  2 个输出，因此它有 (2² × 2² × 2²) = 12 个连接。因此，每个连接都有一个权重。正如上述示例所述，训练涉及基于输出误差对权重进行迭代微调。显然，第
  `l` 层的每个神经元都连接到第 `l` – 1 层每个神经元的输出。这当然是全连接神经网络（NN）的关键属性，因为一层的输出成为下一层的输入，所以称为前馈 NN。传入输入并获得预测输出称为前向传播。这涉及计算每个隐藏层神经元的总净输入，将结果通过非线性（激活）函数，然后对下一层神经元重复该过程。


  ![图 3.1 前馈人工神经网络。](img/fig3_1_B.jpg)


  图 3.1 前馈人工神经网络。


  ##### 激活函数与反向传播


  CNN 中使用过各种激活函数。如今，线性修正单元（ReLU）是最流行的激活函数，它只是一个简单的阶跃函数 `f(z) = max(z,0)`。在反向传播过程中，权重被调整以最小化误差。这是通过一种称为反向传播的技术实现的。该过程通过反向计算，得出误差关于权重的偏导数。该计算指示了由于权重发生微小变化而导致误差减小的幅度。随后，权重沿计算梯度的相反方向进行调整。调整权重后，输出误差发生变化，因此在下一次迭代前，必须重新计算偏导数。由于神经网络涉及大量参数，算法往往会过拟合——一种模型在训练数据集上表现极佳（分类误差最小），却无法在新的未见数据集上泛化的现象。避免过拟合的方法包括使用大规模训练数据集、在验证集性能开始变差时立即停止训练、正则化和
  Dropout。


  ##### CNN 的数学公式


  就像前馈神经网络一样，CNN 可以定义为由一系列更简单的函数 `p` 组成的函数 `q`，使得


  ```

  q = p[l]∘p[l−1]∘⋯∘p[1], (3.1)

  ```


  其中每个函数 `p` 定义了前一层输入 `x[l−1]` 到其输出 `x[l]` 的映射，表示为


  ```

  x[l] = f(Σw[l]x[l−1] + b), (3.2)

  ```


  其中 `f` 为激活函数，`w[l]` 为权重，`b` 为偏置。


  ##### CNN 架构原则


  因此，卷积神经网络（CNN）是一种考虑输入数据空间结构的人工神经网络。为确保平移和扭曲不变性，CNN 结合了三个架构思想——共享权重、局部感受野和空间或时间亚采样。权重共享是指在空间中应用重复的（共享）神经元瓦片的过程。这导致待优化参数减少，从而提高学习效率。由于将神经元连接到上一层所有神经元不切实际，尤其是在大维度数据（如图像）中，局部感受野确保神经元仅连接到输入体积中的局部区域。亚采样和局部平均通过降低特征图分辨率来提高算法效率，从而降低输出对平移和扭曲的敏感性。总体而言，CNN
  呈现 3D 结构张量形状，具有 W × H × D 维度，其中 W（宽度）和 H（高度）为空间维度，D 为特征维度。具体而言，CNN 的结构使其最适合图像、语音和时间序列任务。更具体地说，该算法因用于将权重应用于输入的卷积运算而得名。





  #### CNN 最早于 20 世纪 90 年代被发现


  然而，遗憾的是，尽管它们在文档识别方面取得了突破，但由于人们假设神经网络将始终过拟合或陷入局部极小值，研究人员便弃之不顾。然而，研究表明，优化问题搜索空间中局部极小值的存在并不一定是个大问题。当局部极小值仅是微弱非最优时，性能差异仅受轻微影响。此外，避免局部极小值的一种常规方法是扰动算法的稳定性，使其突然跳出局部最优。通过逐渐并重复地增加和减小学习率来改变学习率，会降低算法的稳定性，从而赋予算法跳出局部最优的能力。此外，随机梯度下降（`SGD`）优化算法也引入了某种噪声或随机性，这有助于算法从局部极小值中跳出。从本质上讲，当今
  CNN 与 90 年代 CNN 之间显著的差异包括：极大规模数据集（如 `ImageNet`）的可用性，`GPU` 并行处理能力带来的更快计算速度，训练开始时初始化权重的先进技术，以及用于区分激活函数的简单易用方法。


  #### CNN 的架构


  典型 CNN 的结构由多层组成，这些层大致分为三类。它们分别是卷积层（`CONV`）、下采样层（`POOL`）和全连接层（`FC`）。此外，激活函数在架构中也可被视为一层。通常，上述层的组合会以特定方式排列，其唯一目标是将网络的输入转换为一种能够产生输出的有用表示。


  ##### 卷积层


  这是 CNN 的基本构建模块。如前所述，其名称源于数学（卷积）算子。该层计算神经元权重与输入体积一小区域之间的标量积。神经元排列成二维滤波器/核的堆栈，延伸至输入体积的深度。因此它们是三维结构的。在前向传播期间，每个核在输入体积的宽度和高度上进行卷积，以生成二维特征图，如图
  3.2 所示。因此，这些特征图是每个空间位置卷积操作的输出。与前馈神经网络相比，此处滤波器代表神经元，当它们遇到边缘等视觉特征时会被激活。正如之前讨论的，CNN
  使用局部连接来降低复杂度。因此，每个神经元连接到一个局部区域，其空间维度由称为感受野的滤波器大小定义，且其深度始终等于输入体积的深度。


  ![图 3.2 卷积操作示例。](img/fig3_2_B.jpg)


  图 3.2 卷积操作示例。


  因此，对于 `256 × 256 × 3` 的输入图像，如果感受野为 `3 × 3`，则 `CONV` 层中的每个神经元将共有 `3 × 3 × 3 = 27`
  个连接和 1 个偏置参数。显然，连接在空间上是局部的，但在输入深度方向上是全连接的。随后，特征图（即输出）的大小通过三个超参数计算得出——深度、零填充和步幅。深度指部署的滤波器数量。滤波器越多，检索到的信息越多，因为每个滤波器都学会寻找特定特征。步幅定义了滤波器在输入上滑动的模式，`S
  = 1` 意味着滤波器每次沿输入移动一个像素。零填充定义了围绕输入体积放置的零像素数量，以保持输出体积的空间大小。可以使用以下公式计算输出的空间大小：


  ```

  O = { (I - F + 2P) / S } + 1, (3.3)

  ```


  其中 `I` 是输入的空间大小，`F` 是滤波器大小，`P` 是零填充数，`S` 是步幅。因此，如果应用于大小为 `[224 × 224 × 3]` 的输入图像，并假设神经元的感受野大小为
  `3 × 3`，深度 `K = 64`，步幅 `S = 1`，零填充 `P=1`，则得到 `(224 - 3 + 2) / 1 + 1 = 224.` 这意味着该特定
  `CONV` 层的输出体积大小为 `[224 × 224 × 64]`。因此，将有 `224 × 224 × 64 = 3211264` 个神经元，每个神经元具有
  `3 × 3 × 3 = 27` 个权重和 1 个偏置。有趣的是，与其拥有 `3211264 × 27` 个权重和 `3211264` 个偏置，权重共享的概念使得同一切片上的所有神经元共享相同的权重和偏置。因此，权重和偏置的数量大幅减少至
  1728 和 64。


  ##### 激活函数


  如前所述，在神经网络中，激活函数在向神经元输出引入非线性方面起着重要作用。引入这种非线性使神经网络成为通用函数逼近器，从而赋予其理解各种关系类型的能力。CNN
  最有效且最常用的激活函数是线性修正单元（`RELU`）。这涉及零阈值函数的逐元素应用，`f(x) = max(o, x)`，其中 `x` 是神经元的输入。与其他激活函数相比，使用
  ReLU 的 CNN 训练速度快数倍。激活层不会给其输入引入额外参数。此外，它不会改变输入的维度。在架构中，激活层放在每个 `CONV` 层之后。此外，拥有多个
  `FC` 层的网络也会部署它，最后一个全连接层除外。


  ##### 池化层


  池化层通常插入在连续的 `CONV` 层之间。其主要功能是持续减少参数数量，并通过减小特征图的空间大小来降低网络的计算复杂度。因此，它们汇总相邻神经元的输出。对于特征图的每个二维切片，最常见的池化操作类型称为
  `MAX-POOLING`，通常取每个 `2 × 2` 区域的最大值，从而丢弃 75% 的激活值，如图 3.3 所示。


  因此，池化操作不引入新参数。相反，它导致特征图的第一和第二维度收缩。该操作接受两个参数：步幅 `S` 和空间维度 `F`。因此，池化操作将特征图从 `W[1]
  × H[1] × D` 降维至 `W[2] × H[2] × D` 维度。此处 `W[2]` 和 `H[2]` 通过以下公式计算：


  ```

  W_2 = (W_1 - F) / S + 1, H_2 = (H_1 - F) / S + 1. (3.4)

  ```


  有趣的是，该操作引入了相对于弹性畸变的平移不变性。


  ##### 全连接层


  全连接层拥有与前一层激活值全连接的神经元，与 `CONV` 和 `POOL` 层不同，`FC` 具有二维维度。它们通常被配置为输出网络的预测标签/类别。因此 `FC`
  通常是网络的最后一层。在赢得 2012 年 ImageNet 大规模视觉识别挑战赛（`ILSVRC`）的工作中，使用了 3 个 `FC` 层，从那时起这已成为大多数研究人员的经验法则。直观地讲，在计算结束时展平三维特征图，为我们解释学习到的空间不变特征提供了途径。


  研究人员最常用的排列方式从图像输入层开始，以 `FC`（决策）层结束，在这两者之间是重复堆叠的 `CONV-RELU` 层，后跟 `POOL` 层，然后是几个
  `FC-RELU` 层。这种分层模式可用数学方式描述为：




  $$

  \begin{array}{l}

  \left. INPUT \Rightarrow N\left\{ M\left( CONV \Rightarrow RELU \right) \Rightarrow
  POOL \right\} \right. \\

  \left. \text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}\text{?}
  \Rightarrow K\left( FC \Rightarrow RELU \right) \Rightarrow FC. \right.

  \end{array}

  $$


  ![图 3.3 步长为 2 的 2 × 2 滤波器最大池化。](img/fig3_3_B.jpg)


  图 3.3 步长为 2 的 2 × 2 滤波器最大池化。


  通常，`POOL` 之前出现的 `CONV-RELU` 层数量在 `0 < N < 4` 范围内，而变量 `M` 和 `K` 的组合通常大于 1。一个典型的例子是流行的
  VGG16 模型。


  #### CNN 训练方法


  一般来说，部署 CNN 有三种方式——从头训练网络、微调现有模型，或使用现成的 CNN 特征。后两种方法被称为迁移学习。由于从头训练 CNN 涉及使用反向传播算法自动学习数百万个参数，这种方法需要海量数据，通常以百万计。更甚者，CNN
  这种贪婪的数据特性随之要求巨大的计算能力。此外，该过程还涉及多个超参数的调整。因此，人们很少从头训练整个网络。


  微调涉及将基础网络前几层学到的权重迁移到目标网络，然后使用新数据集继续反向传播。因此，目标网络使用新数据集针对特定任务进行训练，这通常不同于基础网络的任务。当新数据集中等规模（数万到数十万）且与基础网络的数据集差异很大时，推荐使用微调。利用旧网络的权重进行初始化有助于反向传播算法，从而实现相对快速的更具体特征的自动学习。


  在数据集较小（例如只有几百个样本）的情况下，即使微调权重也可能导致过拟合。然而，由于 CNN 能高效学习通用图像特征，因此可以直接使用训练好的网络作为固定特征提取器。因此，通过将新数据投影到预训练网络特定层的激活值上来提取特征。随后，学到的表示被输入简单的分类器以解决手头的任务。这种被称为现成特征提取的方法已被多位研究人员用于取得有希望的结果。


  数据增强是解决深度神经网络遇到的过拟合问题的最简单方法。该技术通过翻转（产生镜像）和旋转原始图像等改变图像方向的各种技术，人为地扩大数据集规模，从而产生新图像。这确保学习算法从大量不同方向的数据中学习特征。


  #### 深度 CNN 模型


  深度 CNN 在 ImageNet 数据库的一个子集上进行训练，该数据库用于 ImageNet 大规模视觉识别挑战赛 (ILSVRC)。这些模型在超过一百万张图像上训练，可将图像分类为
  1000 个物体类别。主要有两类模型。一类是层按顺序排列的串行网络模型，如 AlexNet 和 VGG 架构。另一类是有向无环图 (DAG) 模型，其层按有向无环图排列。它们具有更复杂的架构，其中层从多个层接收输入并向多个层输出。例如包括
  GoogleNet、Inception、ResNet 和 IncResNet 架构。我们现在考虑以下架构作为微调策略的模型。


  ##### VGG


  VGG 由牛津大学视觉几何组提出。VGG16 指具有 16 个权重层的 VGG 模型，而 VGG19 指具有 19 个权重层的 VGG 模型。它与 AlexNet
  架构相似，但拥有更多卷积层。VGG16 有 13 个卷积层，而 VGG19 有 16 个卷积层，两者之后均跟随修正线性单元和池化层，以及三个全连接层。所有卷积层均使用小型
  3 × 3 滤波器，网络仅执行 2 × 2 池化。


  VGG 架构的感受野大小为 224 × 224。输出层为 Softmax，对 1000 个类别进行预测。从输入层到最后一个最大池化层是模型的特征提取部分。网络的其余部分包含模型的分类部分。


  VGG 是一个公开可用的模型，使用 2622 个独特主体的 260 万张人脸图像进行训练。该模型配置为接受固定尺寸的 `[224 × 224 × 3]` RGB
  图像作为输入，作为一种预处理形式。所有使用的图像均经过中心归一化。网络由 13 个卷积层堆叠而成，滤波器具有统一的 3 × 3 感受野尺寸和固定的 1 像素卷积步长。如图
  3.4 所示，这些卷积层组之后跟随五个最大池化层。最后，卷积层之后跟随三个全连接层：`FC6`、`FC7` 和 `FC8`。前两个有 4096 个通道，而 `FC8`
  有 2622 个通道，用于对 2622 个身份进行分类。除了中心归一化，模型的实现还结合了 2D 对齐。


  ![图 3.4 VGG-Face 模型架构。](img/fig3_4_B.jpg)


  图 3.4 VGG-Face 模型架构。


  给定一个表示为张量 `X[0] ∈ ℝ^H^× ^W^ × ^D^` 的输入图像 `X[0]`，其中 `H` 为图像高度，`W` 为宽度，`D` 为颜色通道，以及一个表示为函数序列
  `q[L] = p[1] → p[2] → ⋯ p[L]` 的预训练 `L` 层 ConvNet。为了充分研究和评估哪一层产生最佳年龄描述符，VGG-Face
  模型的五个层的激活值——最后两个卷积层（`conv52`、`conv5_3`）、最后一个最大池化层（`pool5`）以及前两个全连接层 `FC6` 和 `FC7`——被用作单独的特征通道。层的选择仅限于顶层
  5 层，因为更深层会产生极高的维度，即使降维后也不会带来显著增益。


  由于提取特征的维度很大，从 `FC7` 中的 4096 到 `conv5_2` 中的 100352 不等，因此需要减小特征规模，从而去除冗余信息。此外，对于 `n`
  个观测值和 `p` 个特征，当 `p > n` 时回归估计不明确，这是一个众所周知的事实。


  ##### AlexNet


  AlexNet 是使 CNN 流行起来的 ImageNet 2012 挑战赛的获胜者。它包含五个卷积和池化层以及三个全连接层，包括局部响应归一化 (ReLU)
  层和 Dropout 层。它在 227 × 227 × 3 的输入图像上运行，这些图像从 256 × 256 图像中随机裁剪而来。特征提取部分被视为从输入层到最后一个最大池化层，而分类部分被视为网络的其余部分。


  ##### GoogLeNet




  该模型包含 22 层、9 个 Inception 单元，最后在输出前还有一个全连接层。Inception 模块由两层和 6 个卷积块组成，是 GoogLeNet
  的核心组件。它是在 ILSVRC2014 数据集上训练的。它使用所谓的 Inception 模块，该模块由多个并行的卷积核组成，处理相同的输入，并在不同尺度上连接特征。此外，池化操作提取的特征也由
  Inception 模块连接。使用 Inception 模块，GoogLeNet 能够在有限的计算成本下实现高准确率。


  ##### Inception-v3


  Inception 比 GoogLeNet 更大、更深、更慢，但在原始 ILSVRC 数据集上更准确。它是一个 48 层的深度模型，由多个卷积层和池化层组成，其输出被连接在一起。它处理
  229 × 229 × 3 的输入图像。它从全连接架构迁移到了稀疏连接架构。通过引入 1 × 1 分解卷积神经网络并后接线性整流单元，它具有了更强的非线性能力。此外，还采用了
  3 × 3 卷积层。辅助 logits 结合了平均池化、1 × 1 卷积、全连接层和 Softmax 激活函数，用于保留低层细节特征，并解决最后几层中的梯度消失问题。


  ##### ResNet


  残差网络架构由微软开发。ResNet 的连接方式使得训练更深的网络成为可能。ResNet-50 深 50 层，ResNet-101 深 101 层。它处理 224
  × 224 × 3 的输入图像。残差网络旨在增加网络深度，同时避免影响结果的问题。残差网络的核心思想基于在层之间引入恒等函数。在传统网络中，层之间存在非线性函数
  `y = H(x)`（底层映射），如图 3.5 左侧所示。在残差网络中，我们有一个新的非线性函数 `y = F(x) + id(x) = F(x) + x`。这里
  `F(x)` 是残差，如图 3.5 所示。


  ![图 3.5 典型 CNN 和 ResNet 架构的捷径连接。](img/fig3_5_B.jpg)


  图 3.5 典型 CNN 和 ResNet 架构的捷径连接。


  这种修改（称为捷径连接）允许重要信息从前一层传递到后续层。这样做避免了梯度消失问题（在如此深的网络训练中，许多神经元变得无用）。残差网络的优势在于，它们能够在不增加待优化参数数量的情况下增加网络深度，从而加速极深网络的训练速度。它们还减轻了梯度消失问题的影响，从而提高了获得的准确率。


  ##### Inception-ResNet


  Inception-ResNet 将 GoogLeNet 的高效 Inception 模块与 ResNet 的残差连接相结合。Inception-ResNet-v2
  深 164 层。它处理 229 × 229 × 3 的输入图像。它是 Inception V3 模型的一个变体，借鉴了上一节提到的微软 ResNet 网络文章中的一些思想。残差连接包含模型中的捷径，正如前面提到的，允许研究人员训练更深、性能更好的网络。这也使得
  Inception 模块得到了显著简化。


  #### 标准性能指标


  神经网络的性能可以根据标准性能术语进行评估，如真阳性 (TP)、假阳性 (FP)、真阴性 (TN)、假阴性 (FN)、准确率 (ACC)、精确率 (P) 和灵敏度
  (S)。标准性能指标按以下公式计算。


  准确率评估分类器的整体有效性，即：


  ```

  Accuracy = (TP + TN) / (TP + FN + FP + TN). (3.5)

  ```


  灵敏度评估分类器识别正标签的有效性，即：


  ```

  Sensitivity (Recall) = TP / (TP + FN). (3.6)

  ```


  精确率评估数据标签与分类器给出的正标签的一致性，即：


  ```

  Precision = TP / (TP + FP). (3.7)

  ```


  这四个分类器构成了一个混淆矩阵，如图 3.6 所示，适用于二分类情况。


  ![图 3.6 二分类的混淆矩阵。](img/fig3_6_B.jpg)


  图 3.6 二分类的混淆矩阵。


  交叉验证确保训练期间使用的数据不参与测试阶段。然而，最终每个单独的数据都将以特定方式同时用于训练和测试。例如，在交叉验证技术中，数据集被分成若干折，例如 k 折，其中
  k 代表折数或分割数。在训练阶段，使用 k-1 折来训练算法或模型，剩下的那一折被保留用于测试。这个过程重复 k 次，直到所有折都被用于训练和测试，但在每次迭代中，测试折中的任何元素都不会同时出现在训练折中。


  #### 总结与讨论


  深度学习模拟并学习复杂数据集中可能存在的特征，使用多层处理单元来识别它们，就像人脑一样。最近，卷积神经网络在视觉计算领域产生了重大影响。


  在视觉应用中，主要使用的深度学习模型是 CNN。CNN 模型的工作方式与许多其他学习模型截然不同，因为它们受到人类学习信息的生物过程的启发。


  CNN 的架构由卷积层组成，这些层将多个滤波器应用于数据（例如图像）上，以获得一系列卷积特征图。它们还包含池化层，用于对这些特征图进行下采样。这些卷积层和池化层通常由一个或多个全连接层和一个
  Softmax 输出层终止。全连接层与前一层和后续层相连。最后一层称为输出层，通常根据类别拥有神经元，每个类别由一个神经元表示。最后，最后一层通常执行 Softmax
  操作，值最高的类别被模型选为预测结果。


  通过反向传播和更新函数，CNN 可以学习各层的滤波器，而神经元层间的权重是全连接层中学习的目标函数。因此，利用反向传播，权重得到更新，网络不断迭代，直到在给定阈值下产生准确的输出。通常使用多个轮次来训练
  CNN，因为这能得到一组良好、可泛化的学习滤波器和权重。


  训练通常通过将数据分为三个子集来进行，其中训练集用于训练，验证集在训练期间用于检查模型在未见样本上的准确性，最后，测试集在训练后用于验证模型的性能。





  ### 迁移学习


  迁移学习是一种利用某一领域已学习算法并将其概念应用于另一领域的技术。当用于训练新算法的数据稀缺时，通常会采用此方法。机器学习基于这样一个假设：新任务的学习是从零开始的，但在某些领域这在技术上是不可能的。例如，在医疗保健领域，由于隐私问题，数据的可用性受到高度限制。因此，获取足够的数据来训练机器学习算法并对其进行测试可能非常困难。因此，迁移学习为将所获知识应用于现成数据不足的领域提供了一条途径。


