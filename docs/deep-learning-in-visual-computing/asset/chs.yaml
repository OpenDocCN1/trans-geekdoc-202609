  曲线。真正例率 (`TPR`) 是数据被正确识别的情况的值。假正例率 (`FPR`) 是数据被错误识别为正例的情况的值。


  ##### 与现有工作的比较


  根据表 6.1，`ResNet-50` 达到了 94.1% 的性能准确率，紧随其后的是 `ResNet-152` 和 `ResNet-101`，分类准确率分别为
  93.6% 和 93.4%。ResNet 模型之间性能的接近性与其他人的结果一致。考虑到架构深度的显著增加，50/101/152 层 ResNet 产生了高且准确的结果。


  由于我们的刺激材料（即孤立鼻子数据库）的新颖性以及我们方法的特异性（仅基于鼻子信息进行种族判定），很难将此处的结果直接与他人的工作进行比较。尽管如此，结果表明与
  Lv 等人 [[7]](#13_ch6.xhtml#r6_7) 利用 3D 鼻子形状分类器呈现的结果相比，准确率更高。他们报告亚裔种族分类为 89.2%，白人种族分类为
  87.4%。


  此外，此处的结果支持这样的观点：鼻子是判定巴基斯坦种族的有用特征。这与其他人进行的类似基于机器学习的实验结果一据。


  据我们所知，使用 ResNet 和 VGG 特征，此前从未利用鼻子作为孤立特征来解决二元种族分类任务。所有 8 个实验的结果确立了所测试的深度学习算法优于基于
  VGG 的模型。我们认为这是由于此类模型的深层架构。此外，考虑到与鼻子相关的多样性和性二态性，在人类难以对面部种族进行分类并区分巴基斯坦和非巴基斯坦鼻子的情况下，深度学习方法可能证明能够提供人类视觉系统无法获得的信息。


  ### 结论


  在本章中，我们解决了身体面部特征（特别是鼻子）的种族分类问题。使用南亚巴基斯坦种族的鼻子图像新数据集，研究了二分类任务。提取了 `ResNet` 和 `VGG`
  特征并输入到线性支持向量机 (`SVM`) 分类器中。`ResNet-50` 发现的性能准确率为 94.1%，而 `VGG-16` 对鼻子图像的分类准确率为 90.8%。我们的结果是新颖的，因为巴基斯坦鼻子的种族分类此前从未被尝试过。






  在这里，我们研究了鼻子作为南亚巴基斯坦人口种族标志的独特性。结果表明，非常深度的学习算法在孤立面部特征图像的分类上表现优异——特别是基于 `VGG` 的模型。此处呈现的结果推进了当前对种族判定的理解，因为据我们所知，基于单一特征（特别是鼻子）利用深度学习算法对巴基斯坦面部进行种族分类的尝试此前从未进行过。此外，关于将鼻子生物特征特征用于识别的证据有限。


