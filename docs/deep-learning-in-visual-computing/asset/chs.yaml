  ### 结论


  本章详细讨论的提出的深度学习模型，可被视为一种用于心脏疾病自动检测和分析的高效机制。此处采用的新颖方法是利用现有 `VGG` 模型的结构并对其进行修改，以获得两个子模型，即
  `VGG-MI1` 和 `VGG-MI2`。


  为测试提出的模型，我们利用了来自 `PTB` 数据集的 `ECG` 信号，并将其转换为灰度图像。图像经过增强，使数据集扩展了 10 倍。基于上述数据集的模型实验表明，提出的
  `CNN` 框架准确且高效。事实上，结果显示我们使用 `VGG-MI2` 达到了 99.22% 的准确率。此外，我们报告使用 `VGG-MI2` 时灵敏度为 99.15%，特异性为
  99.49%。看来即使在最坏情况下，结果也能达到 97.24% 的准确率。此外，我们报告在 `VGG-MI2` 上灵敏度为 97.13%，特异性为 96.53%。据我们所知，这似乎是该领域当前的最先进水平，展示了深度学习模型在用于诊断目的的基于信号的优化图像分析中的优势。


