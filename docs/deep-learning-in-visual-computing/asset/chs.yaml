  ### 模型准确性评估


  正如表 9.7 和表 9.8 所示，对于 `VGG-MI1`，准确率、灵敏度和特异性分别为 99.02%、98.76% 和 99.17%。这是在无噪声 ECG
  信号片段且启用数据增强的情况下实现的。同样，对于 `VGG-MI2`，准确率、灵敏度和特异性分别为 99.22%、99.15% 和 99.49%。因此，我们可以得出结论：`VGG-MI2`
  的性能略优于 `VGG-MI1` 子模型。这是因为 `VGG-MI2` 模型中引入的 `QG-MSVM` 分类器似乎在提高分类准确率方面发挥了重要作用。此外，我们注意到，无论是否进行数据增强，`VGG-MI2`
  的性能均优于 `VGG-MI1` 子模型。在表 9.9 中，我们展示了此处提出的两个子模型与标准 `VGG` 和 `AlexNet` 的对比研究。


