  #### 相关工作对比


  部分地，有许多方法被应用于分析 `ECG` 信号以进行 `MI` 检测。例如，Sun 等人 [[12]](#16_ch9.xhtml#r9_12) 提出了一种基于多实例学习的自动
  `MI` 检测系统。据报告，他们使用 `kNN` 集成作为分类器，获得的灵敏度和特异性分别为 92.30% 和 88.10%。同样，Sharma 等人 [[13]](#16_ch9.xhtml#r9_13)
  提出了一种基于多尺度能量和特征空间的 `MI` 检测技术，使用 `SVM` 分类器时准确率、灵敏度和特异性分别为 96%、93% 和 99%；使用 `kNN`
  分类器时分别为 81%、85% 和 87%。然而，值得注意的是，大多数此类工作要么利用有限的数据集来验证结果，也不具备计算优势。因此，此处提出的基于深度学习的方法似乎更具吸引力。


