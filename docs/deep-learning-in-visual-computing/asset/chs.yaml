  ## 第 10 章 通过深度学习推进视觉计算


  在过去几年中，深度学习领域取得了大量积极进展。这波发展浪潮当然也波及到了视觉计算领域。从基础图像处理任务到视觉分析，视觉计算领域从深度学习的浪潮中获益匪浅。在深度学习技术中，卷积神经网络（`CNNs`）已被广泛研究并应用于解决与视觉计算相关的问题。随着数据的爆炸式增长、复杂预训练`CNN`网络和模型的可用性，以及将某一领域的解决方案或模型改编以解决其他领域挑战的便利性，深度学习已成为解决视觉计算中极具挑战性任务的事实标准和首选。


  除了前几章提供的关键示例外，还可以举出更多例子来说明深度学习作为驱动力在视觉计算中的蓬勃发展。这里我们概述更多示例，以展示深度学习在视觉计算中的应用。


  ### 视觉检测与跟踪


  从自然场景中检测物体是视觉计算中的一个重要问题，目前仍未得到充分解决。例如，为了使自动驾驶汽车能够高效行驶，快速、准确地跟踪各种物体至关重要。将`CNNs`用于视频帧中的物体检测和跟踪可追溯到
  20 世纪 90 年代。当时的主要挑战是缺乏训练数据和训练好的模型，此外还有有限的计算能力。然而，自 2012 年以来，`CNNs`在 ImageNet 挑战赛中展现出的巨大成功，已将深度学习推向了该领域学术研究实验室的前沿。


  在视频帧物体检测方面，早期工作建立在跨图像识别合适的滑动窗口基础上，以便`CNN`分类器能够返回目标信息。然而在许多情况下，由于背景的复杂性，滑动窗口的数量可能变得相当大，导致计算复杂度随之增加。


  目前一种常见且相当成功的基于`CNN`的物体检测方法是所谓的基于区域的`CNN`（`R-CNN`）。顾名思义，`R-CNN`的任务是以较小规模、基于区域的方法（定义为独立类别）来检查给定的视频帧。因此，在一个给定的`CNN`中，可能多达
  2000 个类别定义独立区域，随后可使用支持向量机（`SVMs`）或余弦相似度（`CS`）度量进行分类。基于空间信息的池化和多区域增强语义分割技术等其他方法也最近被引入。


  一个较新的物体检测框架示例是`YOLO`（You Only Look Once）框架。这是一个基于单一管道的预训练模型，可执行检测并为多个物体返回预测类别。因此，`YOLO`似乎仅将一个神经网络应用于整幅图像。它通过仅使用一次前向传播迭代来实现这一点，仅需“看一眼”即可识别物体。随后，它自动将图像划分为较小的区域。基于指定的边界框，它可以分配给定物体属于该区域的概率。最终结果可通过各边界框的权重计算得出最终概率。与其他一些`CNNs`（如`VGG`）不同，`YOLO`可实时运行，在物体检测问题中提供高准确性。


  ### 姿态识别


  姿态估计涉及了解场景中个体的朝向。姿态估计有许多现实应用。这些包括理解人的生理学和身体运动、作为生物识别技术的步态分析，以及设计外观逼真的机器人。


  就深度学习而言，`DeepPose`是将深度学习应用于从视频片段估计姿态的最早应用之一。`DeepPose`使用基于`CNN`的回归来分析关节坐标。该模型本身是一个源自`VGG-19`模型的级联
  7 层`CNN`，其中每个身体关节均被表示，组合起来即可估计完整姿态。


  类似地，`Mask RCNN`是一种基于深度学习的模型，它同时使用语义分割和实例分割来预测姿态。该方法首先使用`CNN`从图像中提取多个特征图。这些特征图随后用于获取边界框，进而用于分割并最终进行预测。`Mask
  RCNN`本质上是一种用于预测的自顶向下方法，即首先检测关键关节点，然后估计人的最终姿态。


  至于物体跟踪，它严重依赖表示机制，其中目标物体可能处于具有挑战性的环境中。视角变化、光照变化以及物体运动过程中的遮挡增加了巨大挑战。许多类型的`CNNs`已被提出用于物体跟踪。


  例如在检测器和跟踪器模型中，待跟踪物体的特征是在离线学习的。`CNNs`的架构本身通过不变性得到增强。在这里，空间和时间信息均可被学习，随后执行跟踪。





  其他技术包括使用 CNN 进行视觉跟踪，即为每个 CNN 训练特定的内核来训练多个 CNN。这使得各个 CNN 能够偏向于物体的特定部分或待跟踪场景的特定部分。同样，带有目标特定显著性图的自定义
  CNN 以及生成式目标外观模型最近也很流行。


  #### 动作识别


  使用深度学习技术分析视频的主要挑战在于，视频本身既是空间实体也是时间实体。CNN 等深度学习方法通常旨在以特定预选尺寸的图像形式表示二维信号。时间维度的引入使得
  CNN 更难处理该问题。尽管如此，深度学习方法表现良好，并已展现出其在基于视频输入的动作识别任务中的优势。


  研究人员尝试解决时间维度的一种方法是引入 3D CNN，即将网络也扩展到时间维度。研究人员利用的其他方法包括融合方法，即推导出不同的特征图并将它们融合以获得最终分类。同样，将光流等传统方法与
  CNN 特征相结合，以及引入将 CNN 与其他类型机器学习模块相结合的新型学习算法，也已被采用。


  ### 图像处理与分类


  高效的图像处理和分类方法及技术是解决许多视觉计算问题的关键要素。因此，适用于图像处理的许多合适方法和技术已存在数十年。然而，图像处理和分类的突破发生在 2012
  年，当时 `AlexNet` 在大规模视觉识别挑战赛 2012 (`ILSVRC2012`) 中取得了最佳分类性能。该挑战旨在分析和推断 `ImageNet`
  数据集中 10,000,000 张人工标注图像所描绘的 10,000 多个物体类别的照片内容。核心任务是正确识别图像中存在的主要物体。


  与许多现代 CNN 一样，`AlexNet` 通过使用高效的数据滤波器以及在网络中为标记类别引入层级类别来工作。这使得网络能够用更少的示例进行训练，却能取得显著更高的准确结果。从那时起，许多
  CNN 架构被提出，采用树状的类别结构，以便更好地理解和利用不同类别之间的关系，实现高效准确的分类。


  同样，基于 CNN 的子类别分类技术最近变得流行。在这种架构中，它们采用粗到精的分类方法，为所用的分类技术增加了效率。在这样的方案中，网络的部分本身可以在物体的部分上进行训练，从而实现更好的识别。例如，我们之前展示过如何使用面部的各个部分来训练人脸识别算法，从而使算法更加准确和高效。过去几年利用物体部分进行的研究表明，在训练期间向
  CNN 添加局部层面特征，总体上能提高准确性。


  随着基本的二值图像分类问题通过深度学习技术的应用得以解决，最近的重点已转移到创建能够在单一实体中承担关键图像处理和分类任务的流水线。例如，可以创建一种 CNN
  架构，使其在网络内部专门具备用于局部操作和分割的功能，然后再进行类别分类。


  同样，研究人员正尝试应用视觉注意力聚焦型 CNN，它们能在更详细的层面上执行分类。例如，网络的一部分可以在补丁级别上更重点地关注相关图像，而网络的另一部分可以在更精细的层面上观察物体。然后可以将这些层面结合起来，以获得物体分类的高准确度。


  #### 场景标注


  场景标注技术是识别物体内的语义类别并自动分析给定场景，即对于室外场景，可能需要能够自动识别天空、树木、植物以及场景中可能存在的任何野生动物。


  深度学习因其执行稳健场景标注的能力而流行。相关的 CNN 可以对场景建模，以便识别并正确标注给定场景中的多个类别。多尺度 CNN 常被视为在尝试解决场景标注复杂性方面发挥关键作用。其他方法包括训练
  CNN 进行基于补丁的分类。


  利用预训练模型（如 `AlexNet`）进行基于语义的物体分割以用于场景标注中的分类，已取得很大成功。在这种尝试中，通常可以使用 `AlexNet` 特征提取场景中物体图像的深度特征，并使用
  `SVM` 进行分类。使用预训练模型的优势在于重新训练所需的数据集较小，但泛化能力依然存在。


  #### 视觉显著性检测


  视觉显著性检测的任务是模拟人类视觉系统以理解复杂场景。显著性检测的主要目标是提出一个计算机模型，能够成功定位视频序列中与运动相关的显著物体。这显然是一个时空问题。多上下文信息是视觉显著性预测中的关键先验，CNN
  通常擅长处理此类问题。


  用于视觉显著性检测的常见 CNN 技术涉及将问题分解为两个较简单的问题，即分别处理局部和全局显著性上下文。例如，一个精心设计的 CNN 模型可以在像素级别分配局部显著性值，而基于深度全连接前馈网络可以在全局上下文中应用物体级信息。


  到目前为止，大多数基于深度学习的视频显著性检测方法都尝试设计和训练单独的网络来解决此问题。例如，利用编码器-解码器网络类型模型来解决此问题很常见。在这里，编码器网络可用于从输入视频中提取
  3D 深度特征，而解码器网络可计算显著性。


  ### 讨论


  深度学习已开始解决视觉计算中许多具有挑战性的问题。多年来，我们见证了深度学习占据中心舞台，成为解决视觉计算领域出现的基本挑战的主要既定技术。尽管我们看到了这种在众多应用和令人印象深刻的结果方面相当显著的发展，但在许多方面，这些发展是渐进的。例如，让我们以自动文本识别为例，它通常被称为光学字符识别
  (`OCR`)，拥有悠久的历史。




  ### 传统与现代 OCR 环境


  传统上，OCR 在光照良好且环境整洁的受限环境中执行。然而，现实世界要复杂得多。例如，在恶劣天气条件下读取高速行驶汽车的车牌就是一个非常现实的问题。此类问题需要非传统的计算技术。通常在非受限环境中，存在大量不可控的外观变化。然而，现代深度学习方法（如
  CNN）提供的丰富特征表征能力可用于解决此问题。在典型的文本检测与识别任务中，有两个基本阶段：检测阶段和识别阶段。如今，这两个阶段均可通过 CNN 得到充分解决。


  通常，对于文本识别任务，CNN 模型会学习裁剪文本补丁和非文本补丁，以便它们能被成功区分。检测到的文本随后可映射到网络架构中的特定滤波器。通常会利用多尺度图像金字塔为此目的服务。其他技术涉及通过极值稳定区域（MSER）获取候选区域，随后由网络进行过滤。至于识别阶段，CNN
  可利用适当训练的 Softmax 分类器提取丰富的视觉特征。


  #### OCR 简史


  1917 年，18 岁的伦敦盲人 Mary Jameson 演示了 Optophone——一种可扫描文本（大约每分钟一个词）以产生盲人可解读音调的设备。那可能是
  OCR 的开端。快进 75 年至 1992 年，我们有了 Newton MessagePad，它承诺能执行手写识别。从商业角度来看，它生命周期短暂且以失败告终。然而，通过对图像处理的持续研究，技术以快速步伐不断改进。如今，我们或多或少拥有了能在极度非受限条件下识别任意语言中任意数量字母的技术。其中很大部分依赖于深度学习作为关键的支撑技术。


