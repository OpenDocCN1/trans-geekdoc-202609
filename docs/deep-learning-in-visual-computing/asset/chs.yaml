  ## 第 5 章 利用深度学习从人脸图像进行年龄估计


  一个人的年龄始终是身份的重要属性。同样，年龄也是社交互动的重要因素。人脸及其物理特征是促进预测一个人年龄的重要要素。因此，通过数值分析从人脸进行年龄估计在许多潜在应用中大有可为，例如开发智能人机界面，以及提高交通、安防和医疗等各个领域的安全性与防护。在本章中，我们将讨论如何进行基于计算机的年龄估计。更具体地说，我们将探讨如何利用深度学习从个人的人脸图像中进行年龄估计。我们将展示如何利用基于现有预训练深度学习模型的迁移学习方法，从人脸图像中进行特征提取和分类，从而准确预测个人的年龄。本章将讨论深度学习方法论、实验设置及结果的详细情况。


  ### 简介


  在最近几十年里，随着对自动化识别和监控系统需求的增长，分析人脸已成为视觉计算领域的一个重要研究课题。人脸分析的例子包括检测、人脸识别、性别分类、面部表情识别，以及同样重要的面部年龄估计。能够从照片中自动预测某人的年龄，在许多应用领域都具有关键优势。这些领域包括：基于年龄的访问控制、刑侦中的年龄估计、自适应年龄的定向营销、客户关系管理、娱乐推荐系统的开发、软生物特征识别、定向广告、智能监控、互联网访问控制、种族分类和社交媒体分析。


  例如，使用烟草自动售货机给吸烟者带来了极大的便利。然而，提供售货机服务也伴随着代价，即必须限制未成年人从售货机购买烟草制品的能力。同样，这一原则适用于许多其他领域，例如根据一个人的年龄提供对受限区域和网站的访问权限。此外，自动年龄估计工具将极大地辅助信息检索任务。例如，互联网拥有数十亿张照片，被公认为世界上最大的图像数据库。尽管视觉资源丰富，但在万维网上寻找图像并非易事。自动图像检索在管理社交网络站点以完成许多关键任务（如标记个人和估计年龄组）方面发挥着重要作用。借助高效的年龄估计，例如从互联网检索图像可以变得更加轻松和智能。


  同样，目前存在许多用于年龄增长模拟的系统，例如协助寻找失踪人员。年龄合成算法的精度通常根据两个要素进行评估：其保持受试者身份的程度，以及其生成符合预测年龄的真实人脸的能力。评估后者最合适的方式是通过年龄估计，而前者则使用适当的图像相似度度量进行评估。此外，由于年龄增长算法是数据驱动的，准确的年龄估计算法可能有助于爬取大型数据集中的照片，以帮助寻找失踪人员。


  因此，总的来说，算法自动估计年龄的任务在目标是在无先验知识的情况下确定个人年龄的应用中非常有用。然而，从人脸图像估计年龄是一项相当复杂的任务。为此，在算法的帮助下，我们可以认为给定年龄的人属于若干类别中的某一类。与人脸检测或性别估计相比，这个问题复杂得多，因为后者被归类为涉及二分类的问题。由于不同种族、性别和生活方式的人衰老方式截然不同，这一问题变得更加复杂。因此，一个人的生活条件、生活方式和健康质量都在定义其生理年龄方面起着至关重要的作用。此外，从照片进行自动年龄估计还面临着人脸分析在二分类场景（如人脸检测或性别分类）中已存在的挑战。这些挑战包括头部姿态变化、遮挡、面部表情和光照条件。


  因此，在深度学习之前的时代，研究人员将人脸特征分为局部、全局和混合形式。其他人则利用图像表示机制进行年龄建模，利用了主动外观模型（`AAM`）。此类模型被广泛用于从训练图像中学习形状和纹理特征，这些训练图像使用主成分分析、相关滤波器和随机森林（`Random
  Forests`）等实体进行降维。


  与许多视觉计算相关问题一样，针对从个人人脸照片自动估计年龄的问题，已经提出了许多计算机辅助算法解决方案。通常，此类方法基于两步。第一步涉及从图像中提取特征，而第二步则进行某种形式的学习以估计年龄。例如，可以利用人脸的测量模型和皱纹模式进行年龄估计。传统的图像处理工具（如`AAM`）可用于提取和比较眼睛、脸颊和额头周围的显著特征。其他方法如线性判别分析（`LDA`）、k
  近邻算法（`kNN`）、局部二值模式（`LBP`）和 Gabor 小波、模糊逻辑及支持向量机（`SVMs`）也可用于基于图像分类的年龄估计。然而，像许多其他使用此类低维图像分析工具的图像分析应用一样，最终解决方案往往不可扩展且不够鲁棒。因此，研究人员转向深度学习，以寻求年龄估计问题的鲁棒解决方案。


  ### 用于年龄估计的深度卷积神经网络


  在最近一段时间里，深度卷积神经网络（`CNNs`）在从照片进行年龄估计任务上表现出了卓越的性能。这一进步宣告了长期以来在该领域使用的大多数传统图像处理技术的终结。正如前文所强调的，这些过时的技术主要依赖手工设计和硬编码的特征，容易出错，并面临计算准确性相关的问题。


  利用`CNN`进行年龄估计任务的一种常见机制是使用预训练模型之一，如`VGG`和`GoogleNet`。其他架构如有向无环图 CNN（`DAG-CNN`）也被使用。`DAG`简单来说是一种前馈`CNN`，由卷积层、多输出层（`ReLU`）、归一化层和池化层组成。通常，`ReLU`层连接到一个平均池化层，然后进行归一化，馈送到一个计算具有若干输出的内积的全连接层。输出被发送到合适的
  Softmax 函数进行最终分类。


  ### 常用数据集





  ### 年龄估计：数据集、性能指标与 VGG 模型方法


  #### 年龄估计的数据集


  为了衡量年龄估计算法的效率，需要对各种算法进行适当的训练和测试。数据集中图像的期望质量也必须满足某些标准，即姿态、光照和纹理等条件的变化应较小。数据集必须能代表性别、种族和年龄范围。应有足够的面部图像以对开发的算法进行有意义的训练和测试。此处我们将讨论一些可供研究人员测试和验证其算法的常用数据集。


  1.  **MORPH 数据集** [[1]](#12_ch5.xhtml#r5_1) 是用于面部年龄估计和面部年龄合成研究的大型常用面部数据库。该数据集包含两个相册。相册
  1 包含 1,690 张面部图像，提供了个体的年龄、种族、性别、身高和体重。相册 2 包含 78,207 张图像，年龄范围为 15 至 80 岁，具有面部表情、光照和分辨率的变化。可以说，MORPH
  是从事面部年龄估计研究的研究人员中最流行的数据集。


  2.  **FERET 数据集** [[2]](#12_ch5.xhtml#r5_2) 包含 1,199 名不同年龄个体的 14,126 张灰度面部图像。图像本身在姿态、种族和性别方面存在变化。图像的整体质量普遍较好，因为它们似乎是在受控环境下采集的。


  3.  **FG-NET 数据集** [[3]](#12_ch5.xhtml#r5_3) 包含 1,002 张彩色和灰度图像，年龄混合范围从婴儿到老年人。数据具有充分的种族变化，并带有受试者实际年龄的标签信息。图像间的视觉质量不一致，且存在各种光照、姿态和背景变化以及其他类型的噪声。


  4.  **PAL 数据集** [[4]](#12_ch5.xhtml#r5_4) 包含 1,142 张年龄范围为 19 至 93 岁的面部图像，其中男性 225
  名，女性 350 名。总体而言，该数据集中的图像具有良好的分辨率。


  5.  **跨年龄名人数据集** [[5]](#12_ch5.xhtml#r5_5) 包含从互联网收集的 2,000 位名人的图像。该数据集的图像质量存在差异，在某些情况下，年龄可能是估计值而非名人的实际年龄。


  6.  **外观年龄估计 (LAP) 数据集** [[6]](#12_ch5.xhtml#r5_6) 由 7,591 张不同年龄、种族和性别的图像组成，这些图像是在非受控环境下拍摄的。图像由人工观察者标注，利用观察者评估的统计均值和标准差对图像进行标记。


  ##### 性能指标


  年龄估计算法的性能可以通过多种技术进行衡量。常用的技术包括平均绝对误差 (MAE) 和累积得分 (CS)。


  **MAE** 定义为预测年龄与实际年龄之间误差的总和除以数据集中的测试图像数量：


  ```

  MAE = (1/N) * Σ |s₁ᵏ - s₂ᵏ|  (5.1)

  ```


  其中 `N` 指测试样本的数量，`s₁` 指样本 `k` 的实际年龄，`s₂` 指同一样本的估计年龄。


  **累积得分 (CS)** 由 MAE 衍生而来，计算绝对误差小于指定年数的测试图像的比例。因此，CS 定义为：


  ```

  CS = (nᴸ / N) × 100%  (5.2)

  ```


  其中 `nᴸ` 指误差小于特定年数 `L` 的测试样本数量。


  #### 使用 VGG 模型进行年龄估计


  如前所述，`VGG-16` 是一个公开可用的模型，使用 262 万张 2,622 个独特主体的面部图像进行训练。该模型配置为接受固定尺寸 `[224 × 224
  × 3]` 的 RGB 图像作为输入，作为一种预处理形式，所有使用的图像均经过中心归一化。网络由 13 个卷积层堆叠而成，滤波器具有统一的 `3 × 3` 感受野和固定的
  1 像素卷积步长。这些卷积层后跟随五个最大池化层。最后，`CONV` 层后接三个全连接层：`FC6`、`FC7` 和 `FC8`。前两层有 4,096 个通道，而
  `FC8` 有 2,622 个通道，可用于对 2,622 个身份进行分类。


  ##### 特征提取


  对于面部表征，使用 `VGG-Face` 模型不同层的权重来提取深度特征。然后在使用回归进行年龄估计之前，降低生成特征的维度。给定一个表示为张量 `X₀ ∈ ℝ^(H
  × W × D)` 的输入图像 `X₀`，其中 `H` 是图像高度，`W` 是宽度，`D` 是颜色通道，以及一个表示为一系列函数 `qₗ = p₁ → p₂ →
  ... pₗ` 的预训练 `L` 层 `ConvNet`。为了充分研究和评估哪一层产生最佳年龄描述符，`VGG-Face` 模型的最后两个卷积层 (`conv5_2`,
  `conv5_3`)、最后一个最大池化层 (`pool5`) 以及前两个全连接层 `FC6` 和 `FC7` 的激活值被用作单独的特征通道。层的选择仅限于前 5
  层，因为更深层会产生极大的维度，即使在降维后也不会带来显著增益。


  ##### 降维与回归


  由于提取特征的维度较大，从 `FC7` 的 4,097 到 `conv5_2` 的 100,352 不等，因此需要减小特征规模，从而去除冗余信息。此外，对于 `n`
  个观测值和 `p` 个特征，当 `p > n` 时，回归估计未定义，这是一个众所周知的事实。研究人员通常使用 `PCA` 进行降维。然而，`PCA` 存在明显的问题，一个更好的替代方案通常是偏最小二乘回归
  (`PLS`)，它可以同时应用于降维和回归。因此，提取的特征 `X` 与年龄向量 `Y` 之间的关系可以表述为：


  ```

  Y = Xβ^(PLS) + b  (5.3)

  ```


  其中 `b` 是截距。


  ##### 年龄估计


  为了估计年龄，将使用 `VGG` 模型不同层提取的特征进行比较，以确定深度网络的哪些权重包含最优的年龄信息。为增强技术的特异性，所有图像首先可裁剪为 `224
  × 224` 的尺寸，然后部署数据预处理步骤。最后，提取的特征可输入偏最小二乘算法 (`PLS`) 进行年龄预测。


  #### 使用 FGNET 数据集的实验


  给定来自 `FGNET` 数据集的一组图像，可使用地标标注对其进行对齐。此外，可移除其背景以提高图像纯度。此后，可进行数据增强。这是训练阶段用于增加数据量的常用技术。增强结果是每张图像通过随机裁剪和扭曲至平均形状生成了
  7 张额外图像，如 图 5.1 所示。


  通过利用 [[5]](#12_ch5.xhtml#r5_5) 中描述的程序，可进行五组估计。每组估计可通过使用 `VGG-Face` 模型的五个层之一（即 `conv5_2`、`conv5_3`、`pool5`、`FC6`
  或 `FC7` 层）提取特征来执行。






  ### 评估估计过程的性能


  为了评估估计过程的性能，可以使用两个指标：`MAE` 和 `CS`。表 5.1 中五种 CNN 特征性能的比较显示，`conv5_2` 激活值产生了最小的估计误差。显然，随着层级向上移动，性能会下降。这表明，从中间层激活值学习的通用特征比后期层（更专门用于人脸识别问题）包含更多的年龄信息。`PLS`
  的降维能力也很显著，它将数千个特征减少到仅 18 个潜在变量。


