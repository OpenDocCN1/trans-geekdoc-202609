  ## 第 8 章 基于组织病理图像的深度学习癌症诊断方法


  在本章中，我们展示了一个深度迁移学习的示例。我们演示了如何利用深度迁移学习策略，作为克服数字病理学领域中遇到的肿瘤自动化诊断挑战的一种途径。通过若干实验，研究了用于图像分类的两种深度迁移学习策略。第一种策略是使用由预训练权重初始化的网络，并在新数据集上对其进行部分重新训练；第二种策略则是从预训练的
  CNN 中提取特征，而不重新训练网络，并将这些特征用于训练第三方分类器。实验旨在比较基于深度迁移学习策略的不同 CNN 在从组织病理图像中对头颈部鳞状细胞癌（SCC）肿瘤进行分类方面的性能。共使用了
  1,424 张组织病理图像来检测切片中的肿瘤细胞。在性能方面，这两种策略均在组织病理图像上进行了彻底的比较。


  在此，我们比较了基于迁移学习并通过微调网络的不同 CNN 的性能。我们展示了八种不同 CNN——AlexNet、VGG16、VGG 19、GoogLeNet、Inception-V3、ResNet-50、ResNet-101
  和 InceptionResNet-V2——的实验结果。这是通过微调这些预训练的 CNN，并替换为 1000 个类别配置的全连接层来完成的。新增用于二分类的层，然后在头颈部鳞状细胞癌（HNSCC）肿瘤图像上对其进行部分重新训练。


  ### 简介


  在病理实验室中，组织被切片、染色并装载在玻璃载玻片上，随后放入数字扫描仪进行全切片成像（WSI），并可在不同放大倍数下进行可视化。得益于医学扫描技术的进步，有可能生成大量数字玻璃切片，这些切片通过扫描系统，且可包含多种不同的染色技术和不同种类的组织。因此，组织外观的多样性及其数量要求一种高效的计算机视觉方法，这是组织病理图像分析中最困难的挑战。组织外观的多样性主要源于组织制备和染色过程条件的差异。另一个挑战是缺乏数字化切片的标注数据。确实，这些标注需要专家病理学家完成，因此难以获取。


  与此同时，基于深度学习技术的计算机辅助诊断（CAD）方法近期在数字病理学领域产生了显著影响，极大地提升了自然图像识别的性能。数字病理学的持续发展使得自动化图像分析方法能够辅助病理学家完成此类任务，并提高定量评估的可靠性。


  #### 病理学中的计算机辅助诊断


  多年来，病理服务发生了显著变化，呈现出从传统病理方法向数字病理学显著转变的趋势。这种变化在国家和国际层面均有观察到。在英国，许多病理学领域的数字技术使用率不断上升。组织病理学等专业部门越来越多地利用数字图像，并结合条形码工具（用于标记和识别样本）等其他数字系统，以提高效率。此外，由于数字技术的本质允许国际协作（这通常因患者和病理学家的地理分布而变得必要），这种变化也在国际层面被观察到。


  有几个因素促成了从传统病理学向数字病理学这一显著转变；即病理工作量的增加和病理工作人员的减少。英国癌症研究机构报告称，人口老龄化对病理工作量产生了重大影响。人口老龄化与癌症发病率之间存在显著关联。自
  2009 年以来，全科医生转诊的疑似癌症病例数量每年增加了 16%。此外，世界卫生组织（WHO）在 2012 年报告称，估计有 1400 万新增癌症病例，预计未来二十年将再增加
  70%，从而加大了对病理服务的压力。


  随着对病理服务需求的增加，病理工作人员却在大幅减少。这同样可以在国家和国际层面观察到。英国癌症研究机构的报告指出，由于培训病理学家数量的减少，未来十年病理服务将受到重大影响。美国的研究也发现了类似结果。例如，在美国，预计未来
  20 年工作病理学家的数量将大幅减少，降至每 10 万例病例仅 3.7 名病理学家。新入职病理学家数量与退休病理学家数量之间存在失衡。预计到 2021 年退休人数将激增，而入职人数仍保持低位。


  由于工作病理学家数量的减少，传统病理方法（通常涉及邮寄玻璃切片进行会诊）会显著影响周转时间，即影响患者接收实验室结果所需的时间。因此，对更快、更高效的诊断方法（如计算机辅助诊断）的需求已成为重点关注领域。






  ### CAD：计算机辅助检测


  CAD，也称为计算机辅助检测，是利用计算机算法协助解读医学图像。计算机算法涉及多个步骤，如图像处理、图像特征分析和数据分类。特征在图像处理中起着至关重要的作用。特征被定义为图像的单一可测量特征。为获取特征，第一步是对图像进行预处理程序，如调整大小。随后进行特征提取（图像特征分析）方法以获取特征。然后利用这些特征来识别和分类图像。特征提取是一个庞大的研究领域，也是图像分类前的关键步骤。


  多年来，CAD 越来越受欢迎，在疾病诊断中发挥着重要作用。在放射学领域，CAD 技术的兴起尤为明显，该领域目前面临着与病理学相似的挑战。放射学服务的需求显著增加，而放射科医生的数量却显著减少。通常需要双重审核以确保诊断的准确性和精确性；然而，由于放射科医生数量有限及成本影响，这并非可行之选，从而解释了
  CAD 技术兴起的原因。


  尽管取得了这些积极成果，但在 CAD 系统能完全融入临床实践之前，仍需考虑多个因素。这些因素包括：能否提供快速准确的结果、提高医护人员的绩效和效率、实施成本低、以及节省时间。目前，极少有
  CAD 系统满足上述要求；因此，它们被用作提供“第二意见”的手段，而非诊断的主要依据。


  ### 深度学习的应用


  目前，将深度学习技术应用于癌症诊断的工作已大量开展。可复现性是该方法的一大优势。能够详细分析整张切片，而非局限于狭窄的特定感兴趣区域，这也是一大优势。研究表明，深度学习算法利用
  `CNNs`（卷积神经网络，一类受大脑结构和功能启发的深度学习架构）可达到人类病理学家级别的准确率。据报道，用于 CAD 的深度学习方法在生物医学图像分析方面显著优于传统机器学习方法。与传统机器学习方法相比，深度学习方法避免了主观用户偏差，因为它不需要手动提取肿瘤的特定视觉特征。此外，它在分类前不需要大量的预处理、分割和特征提取。例如，以图像块而非特征向量作为输入，可基于图像块的特征进行分类。该过程从大量训练图像块中学习图像块特征的模式。`CNN`
  的输出是不同类别的得分，得分最高的类别被视为分类结果。显然，深度学习方法通过自动化的分层特征提取和多层分类，在视觉任务中已超越人类表现，可应用于利用肿瘤组织切片进行癌症诊断。


  虽然深度学习算法在各种机器学习应用中取得了最先进的结果，但在生物医学领域的实施仍面临诸多挑战。首先，训练深层 `CNN` 需要大量标注图像来学习数百万个参数，但目前生物医学领域缺乏这些标注图像。此外，解读生物医学数据需要专家组织病理学家。因此，这既昂贵、耗时，又受观察者差异影响。其次，使用有限的训练数据训练深层
  `CNNs` 会导致“过拟合”，特征无法在数据上良好泛化。当数据包含图像外观的高变异性时，过拟合问题严重，这在生物医学领域通常是常态。最后，从头训练深层 `CNNs`
  需要高算力、大量内存资源和时间，因此此类方法在生物医学领域存在实际局限性。


  研究表明，`CNNs` 可高效用于深度迁移学习。在这种情况下，网络可使用源任务进行训练，然后在目标任务上复用。当目标任务的数据稀缺时，此技术非常有用。因此，生物医学成像界已研究深度迁移学习以克服数据稀缺问题。迁移学习技术旨在复用从大量标注源数据集学到的图像表示，应用于第二个目标数据集。迁移学习技术被证明是克服目标数据集标注数据有限时过拟合问题的有用工具。


  例如，可为图像分类定义两种迁移学习策略：针对新任务微调预训练网络，或使用从预训练网络提取的现成特征。第一种策略是使用用预训练权重初始化的网络，并在目标任务上部分重新训练；第二种策略则使用从源任务学到的特征而不重新训练网络，并将其用于训练第三方分类器。Decaf
  和 Overfeat 完成了一些最早利用现成特征提取网络应对有限学习样本的工作。同样，著名的 `AlexNet` 架构被用于提取通用特征，随后由 `支持向量机
  (SVM)` 或 `随机森林 (RF)` 等其他方法用于最终分类。更具体地说，微调也已被研究并与从头训练的网络进行比较。分类器在各种组织病理学图像数据集上使用现成特征进行训练。这些数据集包括乳腺癌、淋巴结、细胞核和组织纹理。


  本文展示了如何利用 `CNNs` 迁移学习的特性，对组织病理学图像中的头颈部进行分类。在我们的组织病理学图像数据集上进行了三个实验。实验中实现了八种不同的 `CNN`
  架构用于 `HNSCC` 分类。


  ### 图像数据集


  本报告使用的数据集来源于布拉德福德大学伦理组织部门。样本采集自 2010-2012 年期间对头颈部肿瘤患者实施的手术。这些肿瘤为鳞状细胞癌 (`SCC`)。所有切片均按标准实验室方案制备，包括福尔马林固定和新鲜冻结
  (`FF`) 组织石蜡包埋，随后切制 3-5 微米厚切片，染色并封片。


  所有样本切片均经苏木精和伊红 (`H&E`) 染色。玻璃切片使用飞利浦超高速扫描仪在 40 倍放大倍率下扫描，配备高分辨率图像传感器（0.25 µm/像素）。数字病理图像通过飞利浦影像管理系统进行可视化。图
  8.1 展示了二分类示例，顶行代表正常组织学图像类，底行代表 `HNSCC` 肿瘤图像类。


  共获得 1,424 张组织病理学图像。这些图像以 `jpeg` 压缩格式存储。图像为 40X 放大倍率，未放大至其他级别。


  ![图 8.1：二分类肿瘤图像示例。](img/fig8_1_B.jpg)






  图 8.1： 二分类肿瘤图像示例。


  ### 数据


  机器学习领域的一个常见问题是缺乏足量的训练数据。解决该问题的方法之一是所谓的数据增强。图像增强通过人工方式创建训练图像。这通常通过不同的处理方式或多种处理的组合来完成，例如随机旋转、平移、剪切和翻转。当训练数据非常少时，它是提升深度网络性能的有用工具。数据增强是获取足够多样化样本并从图像中学习深度网络的基础步骤。这是由于不同类别间图像数量的差异，并包含了随机缩放、旋转、裁剪和翻转等方法。图像增强在深度学习中的重要性在于从图像中获取足够多的不同样本，以训练
  CNN。深度神经网络需要大量的训练数据，以有意义的方式调整其权重并取得良好性能。


  数据增强是获取足够多样化样本并从图像中学习深度网络的关键步骤。小规模训练数据集可能导致网络过拟合。通常，所需数据量远大于实际可获取的数据量；这在生物医学数据中尤为明显。在这种情况下，数据增强将用于通过修改现有数据集来生成额外的人工数据。


  ### 分类方法


  本节解释了第 1 个实验的方法论。预训练 CNN 的最后三层配置为 1000 个类别。因此，必须对这些层进行微调，以适应新的二分类问题（HNSCC 肿瘤和正常组织学）。为实现这一点，从预训练
  CNN 中提取了除最后三层以外的所有层，然后对它们进行重新训练以对头颈肿瘤进行分类。因此，在不断更新最后三层的同时，保留了 CNN 的权重。图 8.2 展示了如何将此方法论应用于
  `VGG-16` 模型的示例。


  如前所述，我们总共取了 1,424 张图像，通过根据图像输入层的大小调整图像尺寸，将其输入 CNN 模型。`AlexNet` 模型要求输入图像尺寸为 `227
  x 227 x 3`，其中 3 为颜色通道数。`VGG`、`GoogLeNet` 和 `ResNet` 架构要求输入图像尺寸为 `224 x 224 x 3`，而
  `Incv3` 和 `IncResNet` 模型要求输入图像尺寸为 `229 x 229 x 3`。之后，图像被随机划分为 80% 的训练集（1,140 张图像）和
  20% 的测试集（285 张图像），随后进行了旋转（90、180 和 270 度）、水平左右翻转和垂直翻转。沿图像裁剪了尺寸为 `32 x 32` 的小重叠补丁。数据增强通常有助于防止网络过拟合和记忆训练图像的确切细节。


  对于迁移学习，除最后一层全连接层外，源模型的所有层均被复制到目标网络中。然后修改最后的全连接层，以使模型适应我们的二分类 HNSCC 分类任务。为了使新层比迁移层学习得更快，可以为全连接层增加学习率因子，并将初始学习率设为
  `.0001`。


  ![图 8.2：在 VGG-16 上如何进行微调的示意图。](img/fig8_2_B.jpg)


  图 8.2： 在 VGG-16 上如何进行微调的示意图。


  对于网络训练，所有网络模型均训练了 15 个周期，批量大小为 128。训练采用带动量的随机梯度下降，动量设为 0.90。此处，初始学习率设为 0.0001 作为起点，并在每次更新后递减。程序每三次迭代验证一次网络，并选定
  120 次迭代为最大迭代数。为进行公平比较，不同方法使用相同的训练集和测试集进行训练和测试。不同深度学习模型实现的统计性能测量结果汇总于表 8.1。


  ### 现成特征提取


  现成特征提取策略是一种利用预训练网络提取学习到的特征，然后用它们训练第三方分类器的方法，无需在训练上消耗时间和精力。此处，用于执行分类的四种常见机器学习算法包括支持向量机（`SVM`）、k-近邻（`kNN`）、随机森林（`RF`）或全连接单层感知机（`FC`）。深度学习模型被用于构建这些机器学习分类器。


  此处我们解释如何从 CNN 全连接层的激活层提取判别特征，然后用它们训练 SVM 分类器，如 `SVM`、`kNN` 和 `RF`，以解决分类问题（HNSCC
  肿瘤和正常组织学）。判别特征也可以从 CNN 不同层的激活层提取，然后用于训练 SVM 分类器。图 8.3 描述了如何进行现成特征提取。特征从 `VGG-16`
  模型的最后一层连接层（`FC8`）提取。图像数据集被输入分类器以对其进行训练。


  #### 实验 1


  `SVM` 分类器是一类极受欢迎且研究深入的监督学习模型，可用于线性和非线性分类任务。在该实现中，核函数用于将数据点映射到特征空间。核函数在分类过程中起重要作用，因此该实验考察线性函数或高斯函数（也称为径向基函数
  `RBF`）哪个更适合我们的应用。表 8.2 显示了从实验中获得的结果。


  #### 实验 2


  `AlexNet`、`VGG16` 和 `VGG19` 架构包含三个全连接层，分别为具有 4096 个节点（特征）的 `FC6` 和 `FC7`，以及最终 Softmax
  分类器之前具有 1000 个节点（特征）的 `FC8`。请注意，Softmax 将 `fc8` 归一化为 CNN 的概率标签向量。在此归一化之前，`FC8` 可被解释为用于分类的重要特征向量。由于每一层代表不同的一组抽象特征，选择最有助于构建高性能分类器的一层非常重要。因此，在该实验中，我们考察哪一层更适合我们的应用。表
