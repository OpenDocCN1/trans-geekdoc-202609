  ### 基于深度学习的年龄估计技术的进一步示例


  在上文中，我们讨论了如何执行深度学习模型以从照片中进行年龄估计。这仍然是一个非常活跃的研究领域。过去十年左右，该领域已有大量工作。这里我们简要概述其他一些使用深度学习进行年龄估计的技术方法。


  Dong 等人在该领域完成了一项著名的工作。他们提出了一种用于从人脸图像进行年龄估计的端到端 CNN 系统 [[7]](#12_ch5.xhtml#r5_7)。该方法在
  MORPH2 数据集上实现了 3.63 年的平均 `MAE` 值。他们的 CNN 模型通过深度学习的端到端系统直接从图像估计年龄。所有模型参数均为学习得到，而非手工设计。同样，Yang
  等人 [[8]](#12_ch5.xhtml#r5_8) 使用三层 `ScatNet` 进行特征提取，利用 `PCA` 降低特征维度。`ScatNet` 凭借其深度卷积网络表明，它可以在
  MORPH 数据集上实现 3.49 的 `MAE` 值。Wang 等人的工作表明，结合支持向量回归（`SVR`）的 CNN 模型可用于年龄估计的模式学习，实现了类似的
  `MAE` 值 [[9]](#12_ch5.xhtml#r5_9)。


  Rothe 等人 [[10]](#12_ch5.xhtml#r5_10) 提出了一种称为深度表观年龄期望（`DEX`）的深度年龄估计方法。`DEX` 方法通过将图像分类为多个年龄组，然后使用
  `Softmax` 计算年龄的最终预测，从照片中预测估计年龄。`DEX` 在 MORPH2 和 FG-NET 上分别实现了 3.25 年和 4.63 年的 `MEA`
  值。此外，`DEX` 在 MORPH2 和 FG-NET 上分别实现了 2.68 年和 3.09 年的 `MEA` 值。在某些情况下，`DEX` 所基于的 CNN
  模型无法估计肤色较深和佩戴眼镜的个体的面部图像。


  同样，Niu 等人 [[11]](#12_ch5.xhtml#r5_11) 利用有序排序 CNN（`OR-CNN`）方法将原始年龄估计问题转化为涉及二分类的较小子问题集，并通过
  `Softmax` 分类器进行增强。因此，使用每个年龄组的二元有序年龄标签进行了必要的 CNN 训练。然后，有序回归被转化为子问题，每个子问题被分配给 CNN
  的输入层。使用 `OR-CNN` 进行的实验表明，可以在 MORPH 数据集上实现 3.27 年的 `MEA` 值。此外，Wang 等人研究了一种基于深度学习的新特征提取方法
  [24]。他们使用 CNN 提取特征，使用支持向量回归（`SVR`）学习衰老模式。他们不关心性别和种族的影响，仅使用年龄信息。此外，Chang 和 Chen 在大型数据集
  MORPH Album 2 上将 `MEA` 降低到 3.74 年，并优于比较方法 [[12]](#12_ch5.xhtml#r5_12)。他们提出了一种基于有序回归的年龄排序方法
  `CSOHR`。他们未考虑中性面部表情的变化，而这会影响年龄估计。


  最近，Liu 等人提出了一个基于散射变换进行特征提取的非常轻量级框架 [[13]](#12_ch5.xhtml#r5_13)。然后他们利用 `SVM` 进行年龄分类。该框架由三个关键步骤组成：(1)
  性别分类，(2) 基于性别分类检测年龄标签，(3) 从年龄标签确定年龄值。基于该方法的实验表明，与之前的技术相比，它可以在 FG-NET 数据集上实现 3.92
  年的降低 `MAE` 值。继这项工作之后，Taheri 等人通过他们的 `DAG-VGG-16` 和 `DAG-GoogleNet` CNN 表明，可以在 Morph
  数据集上实现 2.81 的分类准确率 `MEA` [[14]](#12_ch5.xhtml#r5_14)。他们利用面部的多尺度特征并将其融合。这些特征包括在每个
  CNN 层上使用手工参数。同样，一些研究表明，将种族和性别等额外学习信息纳入 CNN 模型可以获得更优越的结果。例如，`RAGN` 方法 [[15]](#12_ch5.xhtml#r5_15)
  展示了一种包含三个网络的集成结构，用于确定年龄、性别和种族以进行特征定义和分类。这些技术结合极限学习机，证明可以在 Morph-II 上实现 2.61 年的 `MEA`
  值。


  ### 讨论





  ### 深度学习在年龄估计中的应用：总结与挑战


  从本章呈现的材料来看，深度学习在从面部图像估计年龄方面具有显著优势。大量实验结果表明，深度学习能够达到人类水平的准确性——在某些情况下甚至能超越人类，从照片中准确推断一个人的年龄。


  例如，我们已经证明，使用预训练 `CNN` 的权重进行面部特征提取对年龄估计是有价值的。利用 `VGG-Face` 模型不同层的激活值，我们可以看到在 `FGNET`
  和 `Morph Album II` 数据库上均能获得良好结果。同时的降维能力（如使用 `PLS`）表明，无需从头训练 `CNN` 也能获得极具前景的结果。本章讨论的大量基于深度学习的年龄估计结果清楚地显示了其相较于传统图像分类和分析的优越性。


  尽管在性能上占优，深度学习仍面临需要进一步研究和开发的问题与障碍。任何 `CNN` 通常计算量巨大——尤其是在训练阶段。`CNN` 还需要对训练数据进行仔细的准备和处理。流行的
  `CNN`（如 `VGG` 和 `GoogLeNet`）特征繁多，往往需要降维策略。为此，可以将散射变换、迁移学习和序数排序学习等技术与基础 `CNN` 模型相结合，以确保准确性和计算效率。


