  ## 第 1 章 简介


  2017 年 9 月，苹果发布了 iPhone X。随之而来的是 Face ID——苹果基于人脸识别的先进生物识别系统，嵌入在手机的硬件和软件之中。不久之后，我弄到了一部
  iPhone X。要使用人脸识别作为身份识别系统——并借此访问各种 App，包括让我登录银行账户的 App——我首先必须录入我的人脸。录入过程涉及遵循一组简单的说明，我需要以特定的姿势和角度将面部呈现在手机摄像头前。在录入人脸几分钟内，我就能开始享受只需看一眼手机即可解锁并使用的便利。


  再说另一个故事。几年前，我和当时 4 岁的儿子在当地公园散步。孩子们凭借其娇小的身材、大大的眼睛、圆嘟嘟的脸颊，以及脸上流露出的天真与活力，似乎天生就能吸引大人的注意和喜爱。当我们沿着公园的一条小路漫步时，遇到一位中年妇女，她短暂地停下脚步，冲我儿子说“你好”，并报以一个社交性的微笑。我儿子礼貌地回了招呼。从那以后，我们经常在公园见到她，并互致问候。我儿子大概永远不会忘记她的脸。人类处理最常见的视觉对象是人脸。人大脑拥有处理人脸、识别人脸的惊人能力——往往在第一眼看到某张脸后几十年仍能认出。


  在人脑如何区分人脸与基于算法的人脸识别系统（如苹果的 Face ID）如何工作之间，可以找到一个关键的相似之处。对人类而言，识别人脸是一项微不足道的任务。尽管所有人脸都相似——拥有两只眼睛、一个鼻子和一张嘴，且排列方式一致——我们仍能在许多不同的角度和光照条件下识别和辨认人脸，且往往轻而易举。据信，人类通过模板匹配过程进行图像识别，感知到的物体（例如人脸）以一组真正代表特定物体的离散特征形式存储在长时记忆中。当呈现一个新物体时，其特征可以与长时记忆中现有的特征进行比较，以检索最佳匹配。因此，可以确定两个不同的过程：第一个是学习过程，大脑通过特征教会自己认识特定物体。例如，在我儿子在公园的故事中，他的大脑学习了他在公园遇到的那位女士的面部。然后，在第二个过程中，输入的人脸与存储的人脸模板进行比较，以找到精确匹配。





  有趣的是，Apple 的 Face ID 识别和区分面部的方式，与我们人类在大脑中识别和辨认面部的方式非常相似。在注册阶段，Face ID 从不同位置和角度读取面部，并最终将面部的物理特征转换为数学表征——通常每张面部对应几百个浮点数。在识别过程中，手机上的红外传感器读取面部，计算与该面部对应的数学表征，并与存储的模板面部进行“距离维度”的比较。同样可以看出，就像大脑一样，面部匹配系统首先学习面部特征，然后将其与模板面部进行比对，以查看是否存在匹配，从而验证给定的准确性阈值。


  无论是在计算机世界还是在人类大脑中，物体识别背后的基本思想都是信息压缩，或是从数据中自动形成有用的表征。从根本上说，我们可以将这种表征学习的过程称为深度学习。一个很好的例子是我们表示原子结构的常用方式，如图
  1.1 所示。虽然原子包含围绕由质子和中子组成的原子核运动的电子，但其结构绝不像图 1.1 所示那样具有确定的形态。事实上，电子在任意给定时刻的位置从来不是可预测的，我们只能获得其围绕原子核位置的概率估计。然而，如图
  1.1 所示呈现原子结构，有助于我们形成关于原子、分子和宏观物质的一份表征学习认知。


  ![图 1.1：碳原子的结构表征。](img/fig1_1_B.jpg)


  图 1.1： 碳原子的结构表征。


  从宏观层面来看，深度神经网络由编码器和解码器组成。编码器的功能是在数据中寻找有用的模式，并形成一种表征学习的形式。同样，解码器的功能是从表征中生成高分辨率数据，其中生成的数据是新的样本或表达性知识。从根本上说，这就是深度学习的工作原理。


  随着强大计算工具和传感器数据的近期爆发式增长，深度学习已成为机器学习的核心工具。深度学习已在广泛的领域和多样的场景中得到应用。虚拟助手（如 Siri 和 Alexa）、生物特征面部识别、聊天机器人、图像分析工具和计算机辅助诊断系统，均由深度学习辅助的模型和算法积极驱动。事实上，得益于深度学习算法的爆发式发展和预训练深度学习模型的可用性，整个人工智能领域最近已占据了中心舞台。此外，视觉计算领域的许多问题正通过深度学习方法和工具得到解决。从基础的图像分析任务到复杂的疾病诊断实践，深度学习在几乎所有与视觉计算相关的问题中都扮演了核心角色。因此，有必要编写一本专门阐述视觉计算领域深度学习积累知识与最新发展的书籍。


  本书概述了应用于视觉计算领域问题的深度学习方法与技术。本书的第一部分致力于阐释深度学习——从基本概念到构建深度学习模型的机制。本书涵盖了足够的深度学习理论，以便读者掌握深度学习的基本要素。为了补充深度学习的理论与知识，本书还涵盖了若干实际案例，演示如何在视觉计算领域成功应用深度学习。


  ## 第 2 章 深度学习的基础


  本章提供了关于深度学习的简要入门材料。我们提供了理解深度学习所必须牢记的基本概念和技术，视角是尝试解决视觉计算中的问题。


  ### 简介


  人工智能（AI）被定义为一种使机器或算法能够模仿人类行为的技术。人工智能的大部分引擎由机器学习（ML）的方法和技术驱动，深度学习是其中的一部分。深度学习使计算模型能够通过一种模仿人类大脑感知和理解多模态信息的方式来学习和表征数据。尽管深度学习直到最近才变得非常流行，但它的历史相当悠久。


  深度学习是一种机器算法通过示例进行学习的机制。它是一种获得模型最优配置的机制，从而能从一组输入数据中获得期望的输出。从数学角度来看，可以将此过程视为获得期望函数
  `g(y[1], y[2],..., y[n])` 以映射输入函数 `f(x[1], x[2],..., x[m])`。存在多种获取此类关系的方法——从线性近似到利用复杂的非线性形式。通常，与物理定律或现象相关的变量之间的显式数学关系可以被构建出来。例如，如果我们采用著名的牛顿第二运动定律，该定律指出施加在质量为
  `m` 的物体上的力 `F` 是 `m` 与加速度的乘积，而加速度是物体速度变化的速率。这可以简单地表述为线性关系 `F = ma`。因此，给定 `m` 和 `a`
  的输入值，人们可以轻松预测必须施加的力。同样，如果我们采用爱因斯坦著名的方程 `E = mc²`，我们可以看到物质 `m` 的能量与光速 `c` 之间存在非线性关系。


  对于选定的一组物理现象，以及更直接的现实生活情境，可以推断出变量间的此类相关性，并可将其显式地以线性或非线性形式写出。然而，现实世界的许多问题过于复杂或过于动态，无法找到相关变量之间此类显式的关系。




  考虑系统输入与输出之间的关系，如图 2.1 所示。图 2.1(a)中所示的输入输出关系显然是线性的，可以使用形式为 `F(x) = ax + b` 的函数进行建模，其中
  `a` 和 `b` 是模型空间中的特征值（或参数）。在某种意义上，具有特定值 `a` 和 `b` 的函数 `F(x)` 能够紧密拟合图 2.1(a)中的数据集，这就是一个学习好的模型。如果模型的输入输出模式现在发生变化，如图
  2.1(b)所示，线性模型将不再有效。然而，我们可以求助于形式为 `F(x) = ax³ + bx² + cx + d` 或 `F(x) = Ce^(Ax)`
  的模型（其中 `a`、`b`、`c`、`d`、`C` 和 `A` 是相应非线性模型的参数），这将更适合对图 2.1(b)所示的数据进行建模。


  尽管线性和非线性模型适合对简单数据集进行建模，但对于实际应用，这种函数式建模很难获得。例如，对于像在图像中识别苹果这样的视觉计算任务，寻找能够映射苹果图像的像素线性组合是不可能的。即使使用简单的非线性函数组合，这样的任务也可能令人望而生畏，因为可能需要处理数量巨大且经常相互冲突的参数。因此，必须寻找一种通用方法，通过该方法可以对适用于实际应用的复杂和多维数据集进行建模。这是机器学习，特别是深度学习技术，能够帮助我们的一个领域。此类模型可以接收足够大的数据作为输入并对其进行处理，利用高层信息或知识提取数据中的一般模式。它们旨在模仿人类推断物体以及从物体中提取知识的方式。因此，教会机器了解世界的一个合理途径是模仿人脑——特别是神经元如何利用数据进行学习和推断。


  ![Figure 2.1: Illustration of the structure of a perceptron and how it functions.](img/fig2_1_B.jpg)


  **图 2.1：** 感知机结构及其工作原理示意图。


  ### 感知机


  第一个受大脑神经元启发的机器学习计算模型，由 Warren McColloch 和 Walter Pitts 提出，他们二人在 1940 年代从事计算神经科学领域的工作。他们想了解人脑如何利用相互连接的神经元产生复杂的模式。他们试图将其作为提出的感知机模型的基础，该模型最初由
  Rosenblatt 于 1958 年提出，当时他在康奈尔航空实验室工作。


  McColloch 和 Pitts 的感知机是一个基于生物神经元工作原理的数学模型。神经元是大脑中相互连接的神经细胞，统称为神经网络。它们通过电信号和化学信号处理和传递信息。当细胞膜两侧的离子浓度发生变化而产生动作电位时，生物神经元就会受到刺激。通常，细胞外空间钠离子浓度较高，而细胞内空间钾离子浓度较高。在动作电位期间，离子在神经元膜上来回传输，引起电变化，从而传递神经冲动。


  与人类神经元的功能类似，感知机神经模型接收一系列输入信号 `x[1]`、`x[2]`、`x[3]`，这些信号要么是兴奋性的，要么是抑制性的。信号可以通过 `w[1]`、`w[2]`、`w[3]`
  进行加权，以便根据需要调整其影响。最后，计算加权和。如果输入信号的加权和达到选定的阈值，模型输出 1，否则输出 0。因此，模型通过执行加权和，基于输入信号（即
  `x[1]`、`x[2]`、`x[3]`）做出输出决策，进而生成二进制输出（即 0 或 1），如图 2.2 所示。


  感知机是一种分类技术，可广泛用于视觉计算应用，例如计算机视觉和图像识别。假设我们有一张图片，希望算法告诉我们这张图片是不是苹果，可以使用分类来实现。输入可以是图像的像素，感知机的权重可以通过苹果数据集得出，输出将是一个二元分类，告诉我们输入图像是否为苹果。然而，就像函数一样，单个神经元非常有限，许多现实世界的问题无法用二元分类器解决。因此，感知机的思想可以扩展到人工神经网络（ANN），其中多个神经元可以连接在一起。


  ![Figure 2.2: Illustration of the structure of a perceptron and how it functions.](img/fig2_2_B.jpg)


  **图 2.2：** 感知机结构及其工作原理示意图。


  ### 人工神经网络


  本质上，ANN 是由单个感知机组成的集合，形成一个神经元网络，连接在一起以实现网络各部分的并行信号处理。感知机单元之间包含权重，以控制彼此的影响。图 2.3 展示了
  ANN 的基本结构布局。ANN 的一个关键组件是位于网络输入和输出之间的隐藏层。隐藏层有助于为输入分配非线性权重并将其导向输出，即它们有助于将非线性数学函数应用于网络的特定部分以产生期望的最终输出。这些函数通常被称为激活函数。例如，在人脸检测任务中，一个隐藏层可以调整为识别输入图像中的眼睛，另一个可以调整为识别鼻子，依此类推。整个网络随后可以识别输入图像中人脸的存在。


  ![Figure 2.3: Representation of a multilayer neural network with a hidden layer.](img/fig2_3_B.jpg)


  **图 2.3：** 具有隐藏层的多层神经网络示意图。


  具体而言，在基于多层感知机概念的 ANN 中，每个神经元都连接到前一层和后一层的神经元。输入层和输出层之间的连接由若干隐藏层定义，这些隐藏层由激活函数连接。激活函数
  `A` 通常采用以下形式：


  ```

  A = F(∑_{i=1}^{n} w_i x_i + b), (2.1)

  ```


  其中，`w[i]` 是分配给神经元 `i` 的权重，`b` 是偏置值，`n` 是神经元的数量。输入数据定义输入层中神经元的数量。在激活函数的帮助下，隐藏层执行多次特征提取以进行分类。最后，所有隐藏层提供一个特征集作为输出。输出层神经元的数量等同于输入数据可被划分的类别数量。输出的准确性，即输入属于给定类别的概率，通过损失函数（也称为
  Softmax）来衡量。





  ### 神经网络激活函数与偏置


  激活函数本身可以采取特定形式，尽管这在很大程度上不应过于重要。人工神经网络（ANN）中常用的激活函数形式包括：


  *   线性函数：`F(x) = ax`

  *   修正线性单元：`F(x) = max(0, x)`

  *   双曲正切：`F(x) = tan(x)`

  *   Logistic 函数：`F(x) = 1 / (1 + e^x)`

  *   反正切：`F(x) = 1 / (1 + tan(x))`


  同样，在网络中，每个神经元都会添加一个偏置，通常是一个二进制值。偏置单元是奇异的，因为它们不连接到前一层。偏置函数使激活函数能够沿给定方向（例如右、左、上、下）激活。在模型中引入偏置增加了其灵活性，确保模型能按预期进行训练。


  ### 反向传播与损失函数


  一旦神经网络构建完成（包含初始权重），误差函数会告诉我们模型距离所需的期望预测有多远。为了高效获取网络权重的最优值，可以执行**反向传播**。反向传播算法包含几个阶段：


  1.  使用初始权重排列，模型生成初始预测。

  2.  计算误差函数。

  3.  算法计算误差相对于各个权重的变化率，以便迭代地进行误差最小化。


  这些在反向传播算法中回溯权重并更新它们的迭代或优化运行，通常被称为**轮次**。


  因此，神经网络接收输入数据并将输入通过网络传递到输出。网络必须通过损失函数 `S` 评估其表现，例如均方误差：


  ```

  S = 1/n * Σ(i=1 to n) (Y_i¹ - Y_i²)²  (2.2)

  ```


  此处，`Y_i¹` 代表期望输出，`Y_i²` 代表网络的预测结果。通过使用反向传播的一系列迭代，网络调整其权重和偏置以确保损失函数最小化。因此，从输入开始，通过一系列权重和偏置的调整，网络产生期望输出。简而言之，ANN
  是一个建模给定输入与期望输出之间关系的优化系统。


  ### 超参数调优


  为解决给定任务而设计 ANN 通常不是一个简单直接的过程。它需要仔细的思考和实验。输入的选择、隐藏层的数量、激活函数的选择、Softmax 的性质、优化算法的选择以及训练网络的轮次数，所有这些都需要慎重考虑。这个过程被称为**超参数调优**。


  ### 多层感知机的局限性


  多层感知机模型在为预测建模提供良好近似方面表现出色。值得注意的是，这些模型的本质意味着各层是全连接的，即每个感知器都连接到其他每个感知器。因此，对于视觉计算相关问题（需求主要涉及像素域中的图像），参数数量会呈指数级快速增长。此外，这类模型不能有效编码空间信息，这往往使它们难以用于解决常见的视觉计算问题。为克服这些问题，研究人员提出了更复杂的模型。因此，流行的**卷积神经网络（CNN）**模型成为视觉计算领域的当前宠儿。


  #### 卷积神经网络


  CNN 是一种三维网络结构，其中一层的神经元并不总是连接到下一层的神经元。每层中的神经元负责分析数据较小部分的特定功能。因此，CNN 首先执行**卷积**，涉及扫描输入数据的一个小部分以创建特定映射。第二步涉及**池化**，旨在降低特征的维度。在图像的情况下，卷积操作扫描图像并分析图像的小部分以生成特征集。池化操作随后在保留关键信息的同时将此特征集减少到可管理的数量。


  因此，CNN 可以解释为层的组合，每层负责不同的任务，如卷积或池化。此类网络通过允许图像作为输入通过，然后经过包含卷积、池化和其他全连接层的一组层，最终提供单个类别的输出，该类别属于图像可能的类别集合，如图
  2.4 所示。


  最初引入 CNN 时，它们与普通神经网络有相似之处，主要包含持有可学习权重和偏置的神经元。每个神经元通常接收多个输入，执行点积，最后可选择跟随一个非线性函数。与普通人工神经网络一样，CNN
  也在最后一层拥有损失函数（如 Softmax）。此外，用于学习普通神经网络的方法仍适用于 CNN。


  ![Figure 2.4: Illustration of the generic structure of a convolutional neural network.](img/fig2_4_B.jpg)


  **图 2.4：** 卷积神经网络通用结构示意图。


  近年来，CNN 的发展随着每年的推移不断提升整体能力，提出了更复杂、计算需求更高的网络模型。最近，ImageNet 挑战赛的顶尖模型是 **Inception-v4**
  模型架构，它通过使用 75 个可训练层，在 ImageNet 挑战赛上实现了 3.08% 的顶部错误率，超越了之前在图像分类中称霸的 ResNet 和 GoogLeNet。然而，最新最先进模型的缺点之一是训练运行时间不断增加。


  因此，CNN 中的一层会有在三个维度（宽度、高度和深度）上排列的神经元。CNN 通常包含按不同顺序和数量堆叠的不同层类型，以产生最佳架构。这些层包括：


  *   **卷积层**：包含多个滤波器，用于从图像数据中提取特征。

  *   **池化层**：对数据执行下采样，以专注于最相关的模式。

  *   **全连接层**：连接在网络末端，赋予网络对数据样本进行分类的能力。


  最后，在大多数网络结构的末端，通常会添加一个 **Softmax 分类器** 以提供输出类别。


  ### 迁移学习


  在深度学习中，模型定义和模型训练通常是一项繁重的任务。深度学习往往非常“贪婪”地需要数据。因此，对于初始模型训练，大型数据集至关重要——然而，解决这一问题的一种方法是利用一种称为**迁移学习**的技术。迁移学习使为一个任务训练的模型能够适应另一个任务，而无需完全重新训练原始模型。


  传统机器学习算法通常使用在先前收集的训练数据上训练的统计模板对未来数据进行预测。自 1995 年以来，迁移学习研究吸引了越来越多的兴趣和关注，曾使用过许多名称，如“学会学习”、“知识迁移”、“归纳迁移”、“多任务学习”、“上下文敏感学习”、“基于知识的归纳偏置”以及“增量/累积学习”。目前，迁移学习方法似乎在视觉计算相关文献中无处不在。






  ### 深度学习中的迁移学习


  正如深度学习领域已知的那样，使用迁移学习的原因是为了改进学习。这是通过利用源任务的知识来实现的。通常，很少有人倾向于从头构建和训练整个卷积神经网络，主要是因为不常见或不容易找到具有足够规模的、所需数据类型的数据集。同时，在大规模数据集（如
  ImageNet）上训练 CNN，然后将该 CNN 用作感兴趣任务的初始化或固定特征提取器，这种做法更为常见。


  ### 分类方案


  CNN 通常由一个包含许多层的分布式网络组成。这些层负责特征提取。最后一层是 Softmax，负责实际的分类。这赋予了 CNN 训练特征提取的独特能力，而不是将特征定义留给预先确定。从
  CNN 不同层提取的这些特征也被用来训练单独的分类器，例如支持向量机 (SVM)、k 近邻 (kNN) 和随机森林 (RF) 以进行预测。


  #### 支持向量机 (SVM)


  **支持向量机** (SVM) 是一种分类模型。该模型旨在找到具有最大“间隔”将数据分离为不同类别的超平面，即位于超平面两侧的最近点之间的距离被最大化。如果数据是可分的，在数据空间中放置超平面的问题就简化了。通常数据可能不可分，因此必须在数学上定义数据点落在超平面“错误”一侧的惩罚。令
  `C` 定义超参数，它代表允许错误分类点的权重有多大。然后，较大的 `C` 会严重惩罚错误分类的点，同时鼓励更贴合训练数据的超平面。另一方面，较小的 `C` 允许更多的错误分类点，希望这能产生一个更具泛化能力的分类器。因此，参数
  `C` 是克服 SVM 过拟合的主要工具，通常通过验证来确定。SVM 有三种核函数 `K`，它们将输入数据转换到另一个欧几里得空间。核函数可以是线性的、非线性的，也可以是高斯的（使用径向基函数）。


  #### k 近邻 (kNN)


  **k 近邻** (kNN) 是一种相对简单的分类模型，它使用已知数据集对新数据进行分类。新数据点根据其 `k` 个最近邻中占多数的类别进行分类。其背后的思想很简单。例如，同一类别的点应该具有相似的特征。因此，同一类别点的特征应该彼此足够相似。因此，这些点应该“靠近”同一类别的其他点。这里的“邻近性”指的是特征空间中点的位置以及它们之间的距离。距离通常使用欧几里得距离来度量。当
  `k` 值较高时，分类更能抵抗离群数据点的影响。因此 `k` 代表一个可用于有效验证的超参数。这些分类器简单直观。然而，它们往往难以扩展，因为分类需要为每个待考虑的新数据点重新访问所有数据点。此外，分类器必须拥有所有训练数据点的先验知识才能对新数据点进行分类。自然地，这导致需要大量内存来存储所有训练数据以及分类协议。


  #### 随机森林 (RF)


  **随机森林** (RF) 是一种创建一组决策树的分类方法。这些树是从主训练集中随机选择的子集。然后它汇总来自不同决策树的投票来决定测试对象的最终类别。RF 是一种流行的集成方法。它使用装袋技术，该技术涉及通过从树的内部节点中排名最高的测试中选择和随机选择测试集来生成新的训练数据集。它需要很少的参数调整，并可用于自然地对特征重要性进行排序。RF
  在大型数据集上运行高效，并报告准确的分类性能。这些特性使 RF 成为机器学习中流行的分类算法。


  ### 总结


  与针对物理模型的显式编程不同，深度学习有助于生成计算系统，从数据中提取模式和知识。这与人类大脑识别和推断模式以进行复杂决策的方式非常相似。深度学习提供了一个计算框架，用于根据给定的一组输入数据获得所需的输出。


  感知机是机器学习单元的简单形式。它可以非常高效地对复杂函数进行线性逼近。类似地，人工神经网络基于一组感知机，包含输入层、输出层和隐藏层，所有层通过权重、激活函数和偏置连接。人工神经网络可以帮助将非线性数学函数单元纳入系统，从而使用较小的特征集准确逼近输入数据。凭借其基于特征的输出，它可以协助图像分析任务，并已被证明在视觉计算应用中很有用。然而，传统的基于多感知机的人工神经网络的一个缺点是，对于人脸识别等复杂任务，特征参数的数量可能变得非常大，导致网络在计算上变得低效。


  卷积神经网络目前是视觉计算应用的事实标准机器学习技术。这已被证明在许多领域都很有用，并在解决具有挑战性的任务中展现了其优势，例如赢得许多 ImageNet 竞赛。该网络是稀疏连接的，而不是全连接的，拥有相对较少的权重。凭借卷积和池化功能以及网络的松散连接性，它比传统的基于多感知机的网络具有优势。因此，它非常适合模式识别和匹配，因此已被证明非常擅长解决许多具有挑战性的视觉计算相关问题。


