  ## 第 7 章 利用深度学习分析皮肤烧伤


  虽令人惊讶，但人体皮肤烧伤是全球常见的死亡原因之一。每年有成千上万的人遭受烧伤及烧伤相关损伤。记录显示，全球每年因烧伤相关损伤记录在案的死亡人数约为 265,000
  人 [[1]](#14_ch7.xhtml#r7_1)。烧伤的主要原因包括火焰、热液体、化学品、电以及日光辐射。因此，皮肤烧伤问题已变得严重。准确识别烧伤损伤对于给予正确的药物治疗至关重要。


  烧伤损伤可能极其痛苦，这取决于身体组织受影响的程度。仅影响皮肤表层的烧伤比影响深层组织的烧伤要简单得多。皮肤是人体最大的器官，身体大面积烧伤的间接后果将直接影响身体调节热量、合成维生素
  D 以及抵抗感染的能力。


  烧伤评估至关重要，因为这能提供烧伤是否会自愈或可能需要手术的洞察。目视检查（称为临床评估）是识别烧伤最常用的方法，但因该技术准确率低而引发担忧。此外，大多数烧伤中心缺乏医疗专业人员，且缺乏辅助诊断工具，使成千上万的人处于危险之中。[[2]](#14_ch7.xhtml#r7_2)
  的研究表明，烧伤严重程度的错误识别会导致评估不佳。作者 [[2]](#14_ch7.xhtml#r7_2) 指出，当阳性烧伤损伤因外科医生的视觉感知被错误分类时，可能导致不必要的手术，或延长患者住院时间。同样，作者
  [[2]](#14_ch7.xhtml#r7_2) 将临床评估描述为一种诊断烧伤的无效手段，因为其最大准确率小于或等于 75%。


  研究表明，诊断烧伤的一个关键方面在很大程度上依赖于经验丰富的医生和护士。此外，经验丰富的烧伤临床医生每天面对烧伤患者时都面临着挑战，例如正确识别需要植皮和不需要植皮的烧伤。问题在于可能将浅度烧伤和深度烧伤误诊。影响肉质并损伤肌肉的深度烧伤伤是大多数情况下需要植皮的类型。如果低估烧伤程度且未提供正确治疗，可能导致不可逆的并发症，使细菌和其他感染污染烧伤创面。最坏的情况下，这可能导致生命丧失。同样，高估烧伤程度可能导致不必要的治疗，引起不必要的植皮和其他无关治疗。


  根据 [[3]](#14_ch7.xhtml#r7_3) 的说法，即使对于经验丰富的外科医生，准确的烧伤深度评估也是一项具有挑战性的任务，但非常重要。据报道，经验丰富的外科医生进行烧伤深度评估的准确率为
  60-75%。因此，据报道激光多普勒成像是比热成像和活力染料更适合烧伤诊断的最佳技术。然而，采用 LDI 的基础因素是成本和便携性问题。






  ### 烧伤皮肤与健康皮肤的鉴别


  这里我们讨论如何采用深度学习方法对烧伤皮肤进行分析，以鉴别健康皮肤和烧伤。我们展示了如何使用一个完全训练好的卷积神经网络（`CNN`）来提取有用特征，随后将这些特征输入支持向量机（`SVM`）算法进行分类。在本例中，我们展示了如何使用两种变体深度
  `CNN` 架构（即 `ResNet101` 和 `ResNet152`）从二维彩色图像中提取特征。


  微软亚洲研究院（`MRA`）提出的残差 `CNN` 提出了一种残差网络，该网络在 2015 年 ImageNet 大规模视觉识别挑战赛（`ILSVRC`）分类任务中以
  3.57% 的错误率夺冠。该网络的独特之处在于残差连接（快捷连接）。因此，通过将前一层的输入与较低层的输出相加，得到的值再通过激活函数，作为网络下一层的输入。这使得堆叠更多层、提高准确率的网络成为可能。每隔几个堆叠层采用一次跳跃连接，用一条标记为快捷连接的有向线表示，如
  图 1 所示。在数学上，我们得到：


  *y* = *f*(*z*) + (*z*) = *f*(*z*) + *z*。 (7.1)


  其中 (*z*) 是一条快捷路径，允许梯度得以保持，并允许使用更多堆叠层更快地训练网络；*f*(*z*) 是卷积层的输出，即权重来源的那一层。残差网络包含两部分，即主路径部分和快捷路径部分。主路径部分由常规卷积层和激活（`ReLU`）层组成，而快捷路径部分是直接连接到输出的输入。此外，激活函数是在快捷路径的输出与主路径的输出相加之后应用的。因此，


  *y*′ = *σ*(*f*(*z*) + *z*) = *σ*(*y*), (7.2)


  其中 *σ*(*y*) 是逐元素运算后的激活操作（非线性）。


  残差网络的通用形式有 18、34、50、101 和 152 层。对于此处讨论的图像分析，可以使用这种架构及其 101 层变体。由于模型是预训练的，可以采用迁移学习来规避计算复杂度。


  如前所述，`SVM` 是一种学习算法，主要用于数据集的分类、回归和异常检测任务。它通过寻找一个最优分离超平面（`OSH`）来工作，该超平面作为边界将两类数据分开。这是通过解决一个优化问题来实现的。作为一种监督学习算法，它基于一组标记的训练数据学习对未见数据进行分类。因此，训练阶段用于构建模型，之后，通过计算模型（权重）与图像数据特征的点积，将新的未见数据映射到两个学习到的类别之一。


  #### 图像获取与预处理


  烧伤图像直接从医院的患者身上采集，此外还通过互联网搜索获取。共采集了 600 张人体皮肤烧伤图像和 200 张健康皮肤图像（正常皮肤）。在 600 张烧伤图像中，200
  张被识别并标记为一度烧伤图像，200 张为二度烧伤图像，剩余部分为三度烧伤图像。所有图像在特征提取和分类前均调整为 224×224 的大小。这样，所有图像将具有相同的尺寸，符合
  `ResNet` 所需的标准图像尺寸。图 7.1 展示了数据集中一张烧伤图像的示例。


  ![图 7.1：数据集中一张烧伤图像的示例。](img/fig7_1_B.jpg)


