  6.3 展示了基于 VGG 的模型（即 `VGG-Face`、`VGG-16` 和 `VGG-19`）的 `ROC`。


  图 6.2 展示了使用三种深度学习算法：`ResNet-50`、`ResNet-101` 和 `ResNet-152` 进行鼻子图像实验的 `ROC`。所有三个模型表现相似（即在
  > 90% 的区域内），这由性能线位于坐标轴左侧的位置描绘。尽管 `ResNet-101` 似乎准确率较低，但其曲线下面积 (`AUC`) 为 0.9773，展示了具有竞争力的性能。这表明即使面部细节有限（即仅鼻子图像），深层架构也足以捕捉种族特征。


  此外，图 6.3 展示了使用 VGG 特征进行孤立鼻子图像的 `ROC`。与在非面部图像上训练的 ResNet 模型不同，基于 VGG 的模型专门在面部数据集上训练。从
  `ROC` 曲线可以明显看出，`VGG-16` 优于其他两个模型，且 `VGG-19` 优于 `VGG-Face`。这种结果令人惊讶，特别是考虑到它们是在面部方面进行训练的。在比较两条
  `ROC` 曲线时，这种情况尤为明显；深度神经网络提取相关信息，特别是在面部细节非常少的情况下，能产生高性能准确率，相比之下 VGG 基础模型则不然。


