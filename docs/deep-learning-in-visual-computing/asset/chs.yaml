  #### 结果评估


  对于图像的特征提取，可以使用上述的 `ResNet` 架构。此外，为了验证结果的有效性，采用 k 折交叉验证，将数据等分为 *k* 份。交叉验证（`CV`）是一种评估学习算法的统计方法
  [9]。训练和验证由这些子样本完成。使用了一种特殊的 k 折（其中 *k* = 10）交叉验证，其中 *k* – 1 份用于训练，剩余的一份用于验证（测试）。迭代持续进行直到所有子样本用尽，以这种方式使得每个子样本既用于训练也用于所有测试的。


