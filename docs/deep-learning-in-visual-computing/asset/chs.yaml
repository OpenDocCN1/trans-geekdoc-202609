  ### 流行 CNN 模型的对比


  在此，我们考虑其他流行模型在特征提取和分类方面的实现，以对比它们在烧伤皮肤识别任务中的有效性。除了前文讨论的 ResNet 模型结果外，我们还选取了 VGG-16
  和 GoogLeNet。表 7.5 中显示的结果展示了用于对三种不同预训练模型提取特征进行分类的两个分类器。


  首先，使用 GoogLeNet 预训练模型进行特征提取，并将这些特征输入到两种不同的监督分类算法（LSVM 和 DT）中。从分类器获得的分类结果显示，LSVM
  优于 DT。两者的性能准确率分别约为 99.3% 和 92.3%。此外，尽管使用相同的数据集进行训练和评估，DT 分类器在准确率方面仍落后于 LSVM，错误率约为
  7%。


  同样，在对 ResNet152 预训练模型提取的特征进行分类时，如表 6 所示，LSVM 记录的分类准确率约为 98.5%，而 DT 达到了 93.4%。在这种情况下，DT
  与 LSVM 产生的错误率差异约为 5.1%。当两个分类器在 VGG-16 模型提取的特征上进行训练时，也适用相同的直觉。LSVM 达到了 94.5% 的性能准确率，而
  DT 达到了 92.6%，LSVM 以 1.9% 的性能差异领先。


