    4) Dispersion Layer: The layers of data dispersion provide a technique that helps
    prevent overfitting the network. To avoid overfitting, the dispersion layer deactivates
    dReLU training units. Some units are returned to the network, with all their input
    and output. In the proposed model, 4 layers with a dispersion of 0.25 and the
    last with a dispersion of 0 are used.


    5) Layer: The dense layers that we use in the network with ReLU activation, except
    for the last. We have two neurons that recognize the rest of the network''s mapping
    and produces the necessary output to classify the images, and its activation is
    done by the Softmax function. We use this function because it can convert any
    real numbers into a vector of probabilities. In our context, the probabilities
    correspond to the possibility that an input image belongs to a specific class.


    # D. Training


    Some pre-trained models assist in the initialization of the network values. However,
    in this work, training was performed


    from scratch, i.e., no pre-trained models were used, and the weights of the convolutional
    filters were randomly started at the beginning of each training. We obtained the
    best result with 100 training seasons.


    An essential step that serves a lot of attention is selecting input for training.
    We had a limited amount of images to train a deep model. CNNs are efficient in
    learning with a large amount of input data. Therefore, observing the number of
    images available for training, we adopted rotation as an alternative:


    +   1) Data augmentation: The 500 images with exudate''s were rotated 10 times,
    starting with degree 0, which represents the original image and adding 30 degrees
    to the expensive iteration, 5000 images. The 546 images, without the presence
    of exudates, were rotated 9 times, adding 30 degrees to the iteration, 4914 images.


    Figure 6 shows what our image looked after we applied the rotations. Figure 6(a)
    is the image without the rotation. The images of 6(b) and Figure 6(c) show the
    result after applying 30 and 60 degrees, respectively; at the end of this stage,
    the new set has 9914 images.


    From the set of images, we divided them into training (70%), validation (10%)
    and test (20%). Randomly divided so that images from both classes are present
    in all sets.


    # E. Evaluation of results


    Statistical metrics used in CAD systems such as sensitivity (Sens), specificity
    (Spec), and accuracy (Acc), to validate the results. These metrics were used using
    a confusion matrix. The matrix is formed by four values, where the main diagonal
    shows the values correctly classified, as shown in Figure 7.


    The VP value represents the numbers of images classified as exudates; FP, the
    number of images classified as exudates but do not have exudates; FN, the number
    of images classified as healthy, but have exudates; and VN represents the number
    of images correctly classified without signs of DR, that is, health. Sensitivity
    (Sens), evaluates the test''s ability to detect the disease when it is present.
