    # C. Convolutional Network


    CNN''s are type of Artificial Neural Networks based on hierarchical feedforward
    architectures that connect different levels of convolution and maximum grouping
    layers. Each layer operates at itself to produce a change of representations for
    the layers used.


    Neural Networks can be used to help and save people, as solve complex problems
    in districts of real life. They can learn and model relationships between data
    and outputs. So, CNN''s can improve decisions in different applications, computer
    vision and others. There are factors that motivate the use of Convolutional Networks
    in different branches of computing, and in our case, it is not


    There are two factors, which we consider, and which motivate the use of Convolutional
    Networks in different branches of computing. The first is that architectures can
    be easily implemented, just needing to know the field of vision, where we can
    use deep learning for pattern recognition will be applied


    Other factor is that they are automatically trained; this makes it possible to
    show the training set in different classes. She can find important results and
    obtain the ideal performance to perform such task.


    # III. Method


    Our method consists of: i) acquisition of the dataset, images; ii) pre-processing
    on the images, by the data increase. To model and implement the CNN architecture,
    which need some adjustment until the best result is obtained; iii) train the model;
    iv) we classified the set of test images. Figure 1 describes a summary of the
    steps of the methodology.


    # A. Image Acquisition


    The MESSIDOR [16] image database is a public database created to facilitate studies
    for computer-assisted diagnosis. The dataset contains a medical diagnosis for
    each eye, but no manual annotation on the images, as the lesions'' contours or
    departments acquired the image.


    Along with images, a file is provided containing the respective diagnosis of DR
    for each. Anomalies are differentiated by degree of DR. The grade ranges from
    0 to 3, where 0 means there are no signs of DR, and 2 and 3 show some of exudates
    and hemorrhages.


    Figure 2 shows the image of the retina optic disc with exudates, and Figure 3
    without the presence of exudates.


    We selected a total of 2 thousand images. For the development of this work, 1046
    images were selected from this set. 500 images with the presence of exudates and
    546 images without signs of DR. Level 1 images were not used, as their diagnosis
    refers to microaneurysms, not applied to this work.


    # B. Pre-processing


    The data set is initially available in the dimensions of 140x960, 224x2048, and
    234x1536. To scale all images, we applied a crop and resize to 46-pixel squares,
    so that regions that relate to the retina are not cut. Parallel to this step,
    all images are converted from RGB to grayscale. It is interesting to note that
    unlike the works presented here, this was the only type of pre-processing applied
    to the images.


    The intention is to normalize the data that will be passed to train the network.


    +   1) Convolution: The first part of our network is the convolutional layers.
    In Figure 4, for part 1, 2, 3 and 4 the convolutional layers have 16, 32, 64 and
    128 filters, and are activated with the Rectified Linear Unit (ReLU).


    +   2) Maximum Pooling: The negative part of the convolution is the excessive
    increase of data. To decrease this, we apply a top pooling layer of size 2x2 after
    two convolutional layers. Group 4 of the 9 weights of the filters in the network
    can reduce the amount of data in the network.


    +   3) Normalization: The distribution of the inputs after each layer during training,
    as the previous layers parameters, making training stronger. We propose a method
    that incorporates the normalization of this data into the normalization for each
    training stage. Batch normalization allows us to use much higher learning rates
    and to be careful with startup and training problems from occurring.


