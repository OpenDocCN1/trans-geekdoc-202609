  md: '# # Automatic Diagnostic of the Presence of Exudates in Retinal Images Using
    Deep Learning


    Deuismar D. Sousa¹, Antonio O. de Carvalho Filho¹, Ricardo A. L. Rabelo², Joel
    J. P. C. Rodrigues²,,³


    ¹Federal University of Piauí (UFPI), Picos – PI, Brazil

    ²University of Piauí (UFPI), Teresina – PI, Brazil

    ³Instituto de Telecomacoes, Portugal


    {deuismar, antonio, recasouza}@ufpi.edu.br; joeljr@ieee.org


    **Abstract—** Diabetes is one of the fastest-growing chronic diseases that affects
    vision. Diabetic retinopathy, a complication of diabetes, and if not treated properly,
    can lead to blindness. Early diagnosis of diabetic retinopathy has no cure, but
    if detected in early stages, there is a hope that the patient will not reach blindness.
    Detection of retinal exudates is essential. We proposed deep learning model with
    a Convolutional Neural Network to detect exudates with or absence. The results
    are around 99.52% sensitivity, 100% specificity, and 99.76% accuracy for 1,608
    images. Thus, the authors propose a method that can integrate a system.


    Index Terms—** Automatic Diagnosis, August, Exudates, Diabetic Retinopathy


    # ## I. INTRODUCTION


    Diabetic is a chronic metabolic disease characterized by high blood glucose levels.
    This condition can damage blood vessels, eyes, kidneys, and nerves [1]. According
    to the Brazilian Diabetic Society, Latin America have more than 26 million people
    with diabetes in 2017 and 45 million by 2045. It is estimated that in 3 people
    1 people have Diabetic Retinopathy (DR). DR is a complication of diabetes and
    is characterized by lesions on the retina of individuals with diabetes for more
    than ten years.


    Proliferative and non-proliferative stages of DR are [2]. The non-proliferative
    stage is the first signs of DR and is characterized by aneurysms, hemorrhage,
    and exudates in the retina [3]. The proliferative stage occurs at a more advanced
    stage of DR and presents with severe visual loss. With the diagnosis of DR in
    its non-proliferative stage, there is high chance that the patient will not reach
    total blindness.


    The manual diagnosis of exudates'' presence in the retina is a time-consuming
    process since it requires time and effort on the part of the professional. Demanding
    a set of effective rules can cause tiredness to the specialist, leaving him prone
    to mistakes that may be costly [5]. Thus, automating your diagnosis can save time,
    provide fast and accurate results, in addition to assisting ophthalmologists in


    making the test decision process or acting as a form of screening [6].


    In recent years, there has been a growing interest in the development and use
    of image processing techniques. The main objectives are to increase the accuracy
    of the diagnosis and provide a second opinion to doctors. As an alternative to
    assist in imaging, Computer Assisted Systems (CAD) [7].


    Today AI makes great strides in solving problems that have bothered the artificial
    intelligence community for best many years. It has proven to be good at deciphering
    complex structures in highly complex data and can be applied in several different
    contexts. Deep learning methods are capable of transforming raw neural networks.


    We used a deep learning model with retinal images. The result is the ability to
    classify exudates in retinal images, providing a second opinion to specialists
    and decreasing their efforts.


    This work includes the design and implementation of a deep learning model based
    on Convolutional Neural Networks (CNN) and the application of network data to
    algorithms, followed by applying normalization to make them standard size, in
    equal dimensions and the same color field, before using a parameter iteration.
    The application of the network, on one hand, is to handle the output data before
    extracting the next layer. We also include the method


