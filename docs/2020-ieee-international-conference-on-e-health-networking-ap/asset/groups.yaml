    一些预训练模型有助于网络值的初始化。然而，在这项工作中，训练是从零开始的，即没有使用预训练模型，卷积滤波器的权重在每次训练开始时都是随机初始化的。我们通过
    100 个训练训练周期获得了最佳结果。


    一个备受关注的必要步骤是选择训练输入。我们用于训练深度模型的图像数量有限。卷积神经网络（CNN）在学习大量输入数据方面非常高效。因此，观察到可训练的图像数量，我们采用了旋转作为替代方案：


