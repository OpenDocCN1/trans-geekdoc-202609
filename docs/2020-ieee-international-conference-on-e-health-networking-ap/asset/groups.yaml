    \n图 2 显示带有渗出的视网膜盘图像，图 3 显示没有渗出的。我们总共选取了两千张图像。在工作的开发中，我们从集中选取了 1046 张图像。500 张带有渗出的图像，546\
    \ 张没有视网膜病变。等级 1 的图像未被使用，因为它们的诊断涉及微动脉瘤，未应用于本工作。\n\n### B. 预处理\n\n数据集初始可用尺寸为 140x960、224x2048\
    \ 和 234x1536。为了缩放所有图像，我们应用了裁剪并调整为 46 像素的正方形，以便视网膜区域不被切割。与此步骤并行，所有图像从 RGB 转换为灰度。\n\
    \n其目的是对传递给训练网络的层的数据进行归一化。\n\n- 卷积：我们网络的第一部分是卷积层。在图 4 中，部分 1、 2、 3 和 4 的卷积层分别有\
    \ 16、32, 64 和 128 个卷积核，并使用整流线性单元 (ReLU) 激活。\n- 最大池化：卷积的负面影响是数据的过度增加。为了减少这一点，我们在每两个卷积层之后应用\
    \ 2x2 大小的最大池化层。网络中 9 个滤波器中的 4 组可以减少网络数据量。\n- 归一化：训练期间每层之后输入的分布，作为前一层参数的结果，使训练更稳健。我们提出了一种方法，将这种数据的归一化整合到每个训练阶段的归一化中。批归一化允许我们使用高得学习率，并防止启动和训练问题的出现。\n\
    \n"
