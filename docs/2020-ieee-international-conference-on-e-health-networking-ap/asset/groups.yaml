    97.27%。在第五次实验中，每次卷积后都添加了归一化层。测试集的准确率为 99.76%。所有测试都抑制了适应新数据的能力。


    与其他工作的比较是一项微妙的任务，因为使用的技术、相同的基础和训练案例可以定义。因此，这里的比较仅考虑定量值，以显示提出的方法与其他相关文献的比较。


