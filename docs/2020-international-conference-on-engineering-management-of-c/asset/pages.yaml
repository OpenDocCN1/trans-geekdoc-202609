    # III. UNSTRUCTURED DEFECT DETECTING METHODS


    An automated system should be used to identify types of cracks, which assesses
    the severity and content of such cracks. Each crack can be different in shape,
    size, color, orientation. In addition, different features of the road pavement
    lead to a significant change in the background of the image. The random background,
    along with shadows and objects, makes the identification process extremely difficult.
    Therefore identification of road pavement defects requires the development of
    computer vision and machine learning algorithms.


    Another crack detection is finding the minimum path, which is the path between
    the nodes of the graph. Methods have also been proposed on the principle of a
    minimal path that finds an optimal solution without losing topology [9]. By selecting
    endpoints on cracks and detecting a minimum on a global scale [14]. These methods
    use the distinctive features of cracks as they are computationally efficient for
    their practical applications.


    With the development of machine learning, methods have been proposed to focus
    on feature extraction and use supervised learning to distinguish between images
    with a crack [1]. One of the best methods uses AdaBoost to describe what is a
    crack in images [13]. A new descriptor based on local features can represent the
    characteristics of cracks. The performance of these methods is high, but very
    dependent on the conditions recovered. It is difficult to find suitable features
    for all conditions.


    Deep road pavement defects in an image is difficult for computer vision because
    of many reasons. First, the camera is positioned in such a way that captures images
    from the passenger''s point of view. Second, damaged sections of the road do not
    differ in color from the background and do not easily distinguished compared to
    objects such as vehicles and humans on the road, so they cannot be easily segmented.
    In annotation,


    method has been developed with a sliding window, allowing to divide the image
    into N-blocks, which determines whether a given section of the image contains
    a crack or not [13]. In addition, neural networks determines whether a single
    pixel belongs to a crack based on local image information. However, the method
    ignores the spatial relationships between the pixels and overestimates the width
    of.'
