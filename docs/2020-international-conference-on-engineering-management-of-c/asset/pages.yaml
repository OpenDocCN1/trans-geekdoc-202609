    # III. ALTERN RECOGNITION APPROACH


    It should also be considered a detection method using a multilayer perceptron
    using LBP preprocessing. For this, the Sklearn library was used with 50 neurons
    in the hidden layer and 2 neurons in the output layer, a maximum of 1000 iterations
    were set for training. The training was carried out the basis of the images presented
    above image, preprocessing is carried out by LBP operators. LBP is an operator
    that operates as a binary number, depending on the intensity of the image pixels.
    An important feature is invariant to image brightness in various conditions. Different
    images have various changes in absolute value, colors, brightness, texture elements.
    But the initial relations between the nearest values are subject to changes. The
    principle of operation is to take the central pixel as a threshold and compare
    its brightness with values in the neighborhood. If the value is greater than the
    threshold, then the result is set to 1, or 0.


    ![](img/7e552bee7be7ea346d7eed66f3f5219a_5_1.png)


    Fig. 9. Detection by a feed forward network with LBP operator.


    # IX. CONCLUSION


    Through the analysis we found that most crack detection algorithms on the basis
    of image features do not achieve optimal performance in terms of accuracy and
    speed, which can be explained in the following two aspects. First, the LBP features
    are not suitable for complex backgrounds and multilayer extraction of pixels is
    efficient and this allows to skip defects. With massive image region data, the
    traditional classification is computationally expensive and very sensitive to
    noise. In order to solve the aforementioned problems, we developed developed models
    and detection methodologies using the Local Binary Patterns operator LBP was used
    to compare with VGG -net, which allowed to extract fine texture details. As a
    result, the disadvantages were identified:


    ```

    s(x) = \begin{cases} x \ge 0 \ 0, x < 0 \end{cases}

    LBP_{pq} = \sum_{p=0}^{L-1} s(g_p - g_q) \cdot 2^p$

    ```


    The resulting number, depending on the neighborhood of the pixels, can take eight-bit
    binary code created. Further based on these data, a histogram is constructed on
    the basis of which our network is trained. So, it is assumed that it is possible
    to extract small details of the image and on its basis to train the neural network,
    the result is shown below in the figure. The concept is based on work on the detection
    of cracks in concrete.


