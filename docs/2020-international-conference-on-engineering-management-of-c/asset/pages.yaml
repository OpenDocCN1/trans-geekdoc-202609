  md: '# # Methods for Recognizing Unstructured Road Maintenance Objects Using Deep
    Learning Algorithms


    M. Gorodichev, M. Moseva, Kh. Dhabraililov

    Moscow Technical University of Communications and Informatics

    Moscow, Russia

    g.gorodichev@mtuci.ru; mmoseva@yandex.ru;

