    # $F(x) = max(x)$


    This type of network has an advantage, it reduces the number of parameters necessary
    for training, which brings flexibility. The signed filters can generalize without
    loss of information by training a group reduces the number of features at each
    level. This redundancy allows you to deal with the problem of catastrophic forgetting.


    The dropped nodes are randomly selected at each step of the gradient descent.
    The basic principle is that the network will be forced to avoid "co-adaptation."
    In short, we will explain what coadaptation is and how it arises in deep networks.
    A deep network has many neurons. Then other neurons in the network will quickly
    depend on this particular neuron for information. This will make the network less
    sensitive to the functions learned by this neuron, which may represent the deviation
    of the dataset, instead of learning the general rule.


    Another important function is softmax.


    ```

    $out = \frac{e^{net_i}}{\sum e^{net_j}}$

    ```


    The softmax compresses the output of each block so that it is in range of 0 and
    1, just like a sigmoid function but the output was converted to it. The output
    of the softmax function is equivalent to the probability that any of the classes
    is. Mathematically, the softmax function is shown above, where $i$ is the output
    index (if you have 10 outputs, then there are 10 classes). Softmax is used in
    neural networks to represent the probability distribution of the predicted classes.


    Dropout prevents this type of co-adaptation, because it will no longer be possible
    to depend on the presence of specific neurons during training. As such, other
    neurons will be forced to "relax" and learn useful ideas. A theoretical argument
    follows that this practice does not allow the network to memorize data; with loss
    losses no longer taper rapidly to 0 for very deep networks. Then, dropout allows
    the network to generalize well on unseen test data for a wide range of datasets,
    which is one of the reasons that dropout is a recognized powerful invention, and
    not just bringing force. It is because dropout makes it much noisier and thus
    more useful predictions. We will explain how to properly dropout for training
    and predicting. There is also an introduced method to tune the set activation
    to a coefficient without using dropout. Dropout modifies the network for testing,
    without scaling $q$ the neuron until returns values are higher than during training.


