    # IV. THEORETICAL ASPECTS OF AUTOMATED SYSTEM FOR DETECTING FEATURES


    The main component of the convolutional neural network is convolution. Convolution
    is on two real arguments, generating a third function. The convolution turns on
    filters for each layer of the image. Also, the convolution layer has a convolution
    kernel. The convolution kernel is an Nx matrix. The following is the convolution
    operation formula


    ```

    $x_{ij}^l = \sum_{m=0}^{\infty} \sum_{n=0}^{\infty} w_{mn}^l \cdot y_{i-m,j-n}^{l-1}
    + b_{ij}^l$

    ```


    ```

    $i \in (0, \dots, N), j \in (0, \dots, M)$

    ```


    Here subscripts $i, j, b$ are the indices of the elements in the matrices, and
    $l$ is the value of the stride step. The superscripts 1 and -1 are the indices
    of the network layers.


    $x^l$ - the output of some previous function, or the input of the network; $y^l$
    - $x^l$ after passing the activation function (for example, ReLU or sigmoid);
    the item about the activation function will be a bit later;


    $w^l$ - convolution kernel; $b^l$ - bias; $x^l$ - result of a convolution operation.


    That is, operations take place separately for each element $i, j$ of the matrix
    $x$ whose dimension is $(N, M)$. The convolution layer has a small number of parameters
    that are configured when training the neural network. With a 100x100 image having
    3 channels, with a 3x3 kernel for each of 6 channels it will have $9 * 3 * 6 =
    162$ parameters for training.


    hyphenation of the input, highlighting important features. Transfer invariance
    means that if the input is a small amount, the values of most pooled outputs will
    not change. This important property is necessary for ensuring the existence of
    a fact and its location.


    After convolutional networks a fully connected layer acts as a connection for
    the next layer. Typically, a fully connected network is a multi-layer perceptron.
    In most cases, in such a network, each neuron is connected to all neurons of the
    next layer. Such a network is shown in the figure 2.


    ![](img/7e552bee7be7ea346d7eed66f3f5219a_2_0.png)


    Fig. 2. Feed forward network


    For such networks the activation function is calculated as shown below.


    ```

    $net_i = \sum_{i=0}^{n} w_i x_i\ny_i = f(net_i)$

    ```


    Important in deep and convolutional networks is the activation function. If the
    behavior of the model is close to linear, then it is easier to train. Such activation
    function used in hidden and convolutional layers is ReLU (Rectified Linear Unit).


    ![](img/7e552bee7be7ea346d7eed66f3f5219a_2_1.png)


    Fig. 3. ReLU activation function


    ![](img/7e552bee7be7ea346d7eed66f3f5219a_2_2.png)


    Fig. 1. Pooling operation


    The pooling layer is a non-linear deformation of the feature map, a group of pixels
    is compressed to one pixel, and a non-linear transformation occurs. Pooling creates
    disjoint regions and each is compressed to one pixel, after which a pixel is selected
    with the maximum value. The pooling layer is usually placed after the convolution
    layer, but before the next convolution layer. Pooling makes it possible to invariant
    the representation of relatively small


    ReLU is differentiable at all points except x=0. Features of ReLU: it''s easy
    to optimize, since it is very similar to linear function. The only difference
    between a linear unit and a rectified unit is that a rectified unit yields zero
    through half its area.'
