    # 基于深度学习算法识别非结构化道路维护对象的方法


    M. Gorodichev, M. Moseva, Kh. Dhabraililov

    莫斯科通信信息技术大学

    俄罗斯莫斯科

    g.gorodichev@mtuci.ru; mmoseva@yandex.ru;

    hizazmullin@mail.ru


    R. Gematudinov

    莫斯科汽车与道路建设国家技术大学

    俄罗斯莫斯科

    Rinatag86@mail.ru


    **摘要—** 本工作致力于研究路面裂缝算法，并开发了一种基于计算机视觉和神经网络的自动缺陷检测系统。文章对缺陷进行了分类，并对形成它们的可能原因进行了分类。对该领域相关研究表明，卷积神经网络和前馈网络这些解决方案被用作裂缝分类的第一步。


    *关键词—* 神经网络，裂缝检测，深度学习，裂缝分类，道路检测，卷积网络


    道路系统作为基础设施的重要组成部分，发挥着至关重要的经济作用。建设新道路的成本极其昂贵，优化路面损坏阶段要效率高得多。因此，维护的目标是防止实际发生坍塌。此外，道路状况影响人身安全。如今俄罗斯面临着路面质量问题。由于路面质量较差，每年都有人死亡。根据俄罗斯联邦2017年上半年的国家报告，由于道路网络状况和布置不当，发生了60330起交通事故，其中6992人死亡，8056人受伤。道路质量影响使用周期，在过了这段时期后就会变得无法承受。覆盖状况、维修时间、车道特定区域的处理——这一切都很重要，正如俄罗斯国家统计局的数据，俄罗斯道路总长度达到166万公里，其中116万公里可行驶。2017年，俄罗斯投入使用了230公公里新建和重建的道路。根据2017年的结果，符合法规要求的联邦公路占比达到77.8%。


    根据单车道道路（第一类）的维护应用标准，每年的成本为8006卢布/公里，维修费用为470万卢布/公里，然而有1200万公里道路处于严重损坏状态，这些道路中70%需要更多工作，超过50%的道路需要加固路面，并确保轮子与道路之间必要的粘附系数。


    为了解决这个问题，建立了许多现代道路实验室。实验室的任务是使用高分辨率设备、三维扫描仪、陀螺仪集成定位系统和其他传感器评估道路状况。实验室捕捉图像后，检查由操作员手动进行。专家在手动模式下选择对象，例如标记长度、路边缘、路面裂缝和其他特征。结果表明，这是一个耗时的过程，该过程的自动化具有很高的现实意义。需要注意的是，由于人为因素，许多缺陷被忽略。


    ## II. 裂缝类型分类


    裂缝有几种类型，但主要分为三类：横向裂缝、纵向裂缝和网状裂缝 [1]。路面每年以一种方式进行维修。检测裂缝并对其进行分类非常重要。横向裂缝垂直于路面中心线。它们通常由温度变化引起。其他原因是由于路基纵向力。网状裂缝由于路面疲劳形成，是沥青路面疲劳和不稳定性共同的结果。


    裂缝宽度是评估路面的重要标准，大多数国家和联邦机构都使用这一指标。宽度允许您评估裂缝的类型和严重程度。表I展示了三种类型的裂缝及其特征。宽度和长度在评估裂缝时至关重要。无论是覆盖状况、维修时间还是车道特定区域的处理——这一切都很重要，正如俄罗斯国家统计局的数据，俄罗斯道路总长度达到166万公里，其中116万公里可行驶。2017年，俄罗斯投入使用了230公里新建和重建的道路。根据2017年的结果，符合法规要求的联邦公路占比达到77.8%。


    根据单车道道路（第一类）的维护应用标准，每年的成本为8006卢布/公里，维修费用为470万卢布/公里，然而有1200万公里道路处于严重损坏状态，这些道路中70%需要更多工作，超过50%的道路需要加固路面，并确保轮子与道路之间必要的粘附系数。


    为了解决这个问题，建立了许多现代道路实验室。实验室的任务是使用高分辨率设备、三维扫描仪、陀螺仪集成定位系统和其他传感器评估道路状况。实验室捕捉图像后，检查由操作员手动进行。专家在手动模式下选择对象，例如标记长度、路边缘、路面裂缝和其他特征。结果表明，这是一个耗时的过程，该过程的自动化具有很高的现实意义。需要注意的是，由于人为因素，许多缺陷被忽略。


    裂缝有几种类型，但主要分为三类：横向裂缝、纵向裂缝和网状裂缝 [1]。路面每年以一种方式进行维修。检测裂缝并对其进行分类非常重要。横向裂缝垂直于路面中心线。它们通常由温度变化引起。其他原因是由于路基纵向力。网状裂缝由于路面疲劳形成，是沥青路面疲劳和不稳定性共同的结果。


    裂缝宽度是评估路面的重要标准，大多数国家和联邦机构都使用这一指标。宽度允许您评估裂缝的类型和严重程度。表I展示了三种类型的裂缝及其特征。宽度和长度在评估裂缝时至关重要。


    表 I 裂缝严重程度分类


    | 裂缝类型 | 宽度 (m) | 长度 (m) |

    | --- | --- | --- |

    | 弱 | < 6 | 35 |

    | 中 | < 6 | > 35 |

    | 重 | 6-19 | 35 |

    | | > 19 | < 15 |

    | | > 15 | - |


    纵向裂缝代表沿轴线方向的路面材料延伸断裂。裂缝破坏的分类如表II所示。宽度和长度在评估裂缝时至关重要。


    表 II 路面破坏分类


    | 裂缝类型 | 宽度 (m) | 长度 (m) |

    | --- | --- | --- |

    | 弱 | < 6 | 35 |

    | 中 | < 6 | > 35 |

    | 重 | 6-19 | 35 |

    | | > 19 | < 15 |

    | | > 15 | - |


    斜向交叉裂缝（网状裂缝）是相对于轴线成角的路面连续破坏。


    ## III. 非结构化缺陷检测方法


    需要使用自动系统来识别裂缝类型，并评估其严重程度内容。每种裂缝在形状、尺寸和方向上都可能不同。此外，路面的不同特征会导致背景发生显著变化。随机背景以及物体使得识别过程极其困难。因此，路面缺陷的识别需要计算机视觉和机器学习的发展。


    另一种裂缝检测是寻找最小路径，即图中节点之间的路径。还提出了基于最小路径原理的方法，可以在不丢失拓扑结构的情况下找到最优解 [9]。通过选择裂缝端点并在全局范围内进行检测
    [14]。这些方法利用裂缝的独特特征，因为它们在实际应用中计算效率很高。


