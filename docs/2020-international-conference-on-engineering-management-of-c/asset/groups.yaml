    下方展示了不同分类器的检测结果。


    图 7. 负样本图像示例


    ![](img/7e552bee7be7ea346d7eed66f3f5219a_5_0.png)


    在本项目中，我们使用了基于 VGG 拓扑结构的混合网络。

    3x3 的卷积步感受野能够检测图像中细微的细节。在 VGG 网络中，三个 3x3 卷积连续进行，而不进行下采样。

    特征图的数量逐渐增加，形成一个现象级的向量，以供全连接网络进行进一步训练。神经网络的深度为 16 层或 19 层，这使其具有良好的泛化能力。


    图 8. 卷积神经网络检测


    ## III. 替代识别方法


    还应该考虑一种使用 LBP（局部二值模式）预处理的多层感知器检测方法。为此，我们使用了 Sklearn 库，其中隐藏层设置了 50 个神经元，输出层设置了
    2 个神经元，训练的最大迭代次数设置为 1000 次。训练基于上述图像进行，并由 LBP 算子进行预处理。LBP 是一种根据图像像素强度以二进制数形式进行操作的算子。它一个重要的特点是对于各种条件下的图像亮度具有不变性。不同的图像在绝对值、颜色、亮度和纹理元素上会有各种变化，但邻近值之间的初始关系不受变化影响。其工作原理是以中心像素为阈值，将其亮度与邻域内的值进行比较。如果值大于阈值，则结果设为1，否则为0。


    ![](img/7e552bee7be7ea346d7eed66f3f5219a_5_1.png)


    图 9. 使用带有 LBP 算子的前馈传播网络进行检测的结果。


    ## IX. 结论


    通过分析，我们发现大多数基于图像特征的裂缝检测算法在准确性和速度方面未能达到最佳性能，这可以从以下两个方面进行解释：首先，LBP 特征不适用于复杂背景，且像素的多层提取是高效的，这会导致跳过缺陷。对于大量的图像区域数据，传统的分类计算开销大且对噪声非常敏感。为了解决上述问题，我们开发了模型和检测方法，使用局部二值模式
    LBP 算子与 VGG-net 进行比较，从而提取精细的纹理细节。结果，识别出了以下缺点：


    ```

    s(x) = \begin{cases} x \ge 0 \\ 0, x < 0 \end{cases}

    LBP_{pq} = \sum_{p=0}^{L-1} s(g_p - g_q) \cdot 2^p$

    ```


    生成的数值取决于像素的邻域，可以创建出8位二进制码。进一步基于这些数据构建直方图，并在此基础上训练我们的网络。因此，假设可以提取图像的微小细节并在此基础上训练神经网络，结果如图所示。该概念基于混凝土裂缝检测的研究。


    - 1. 训练图像不足，数量太少。

    - 2. 图像噪声多且太暗。


    提出了以下方法来改进这些模型：增加训练图像的数量以供该建议的验证，并在新数据集上进行训练。该数据集具有更复杂的纹理以及较暗的背景。


    为了改进第二个模型，建议将 LBP 和 HOG（方向梯度）结合起来。这种方法允许我们突出裂缝区域的特征，以及纹理特征（允许我们选择局部模式边界）和特征（允许我们选择方向梯度的突出显示）。通过结合这些额外功能，图像的表示特征更加丰富，并进一步抑制了噪声干扰。提供的方法可用于第一步的检测，第二步进行图像分类。


