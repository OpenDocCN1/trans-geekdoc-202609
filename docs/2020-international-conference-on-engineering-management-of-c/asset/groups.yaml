    # # Methods for Recognizing Unstructured Road Maintenance Objects Using Deep Learning
    Algorithms


    M. Gorodichev, M. Moseva, Kh. Dhabraililov

    Moscow Technical University of Communications and Informatics

    Moscow, Russia

    g.gorodichev@mtuci.ru; mmoseva@yandex.ru;

    hizazmullin@mail.ru


    R. Gematudinov

    Moscow Automobile and Road Construction State

    Technical University

    Moscow, Russia

    Rinatag86@mail.ru


    **Abstract—** This work is devoted to the study of crack algorithms in the roadway,
    and the development of a system of automatic defect detection using computer vision
    and neural network. The article provides a classification of defects, as well
    as a classification of the possible causes of their formation. A review of the
    work related to this problem area shows that convolutional neural network and
    a feed forward network. These solutions are used as a first step of crack classification.


    *Keywords—* neural network, crack detection, deep learning, crack classification,
    road detection, convolutional network


    The road system as a vital component of the infrastructure, plays a critical-economic
    role. The cost of building new roads is extremely expensive, it is much more efficient
    to optimize the stages of damage of the road surface. Thus, the goal of maintenance
    is to prevent collapse at the time of reality. In addition, the condition of the
    road affects human safety. Today in Russia there is a problem associated with
    the quality of the road surface. Due to poor quality-road pavement people are
    dying every year. According to the State Report for first half of 2017 in the
    Russian Federation, due to unsatisfactory conditions and arrangement of the road
    network, there were 60330 traffic accidents, in which 6992 people died and 8056
    were injured. The road quality affects the period of operation and after this
    period becomes unbearable. Whether conditions of coverage, timing repairs, the
    treatment of a particular area of the carriageway—all this is important according
    Rosstat, the total length of roads in Russia reaches 1.66 million km, of which
    1.16 million km are driven. In 2017, 230 km of new built and reconstructed roads
    were commissioned in Russia. According to the results of 2017, share of federal
    highways that meet regulatory requirements reaches 77.8%.


    According to the applied standards for the maintenance of a single-lane road (first
    category), it costs 8006 rubles / km per year, repairs - 4.7 million rubles /
    km, however 12 million km are in significant condition mode, 70% of these roads
    require more work, more than 50% of these roads need to be reinforced with pavement,
    and to ensure necessary coefficient of adhesion of the wheel to the road.


    To solve this problem, modern road laboratories are created. The task of the laboratory
    is to assess the condition of the roadway with high-resolution equipment, three-dimensional
    scanners, a gyro-integrated positioning system, and other sensors. The laboratories
    capture images the examination takes place manually by the operator. The specialist
    in manual mode selects objects, such as marking length, road edge, road surface
    cracks and other features. As a result, it is clear that this is a laborious procedure,
    the automation of this process is very relevant. It should be noted that the human
    factor, many defects are overlooked.


    # II. CRACK TYPE CLASSIFICATION


    There are several types of cracks, but they are mainly divided into three groups:
    transverse, longitudinal and alligator cracks [1]. Each year of pavement is repaired
    in one way. It is very important to detect crack and classify them. Transverse
    cracks are perpendicular to the center line of the road surface. They are usually
    caused by thermal changes. Other reasons are due to base-longitudinal forces.
    Alligator cracks are formed due to road surface fatigue, by the combination of
    fatigue and instability of asphalt pavement.


    Crack width is an important measure for assessing pavement, and most state and
    federal agencies use this option.'
