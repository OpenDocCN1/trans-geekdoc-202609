    ![](img/b37ab3c0b0e8ecc504cdf93a1b444c50_9_0.png)


    图 6。显示了披露者在五点 Likert 量量表上对陈述表示不同程度同意的频率。


    对于解释。然而，通过解决受访者提出的局限性，该指标仍有改进空间。这种空间在图 5 中也显而易见，该图显示回答涵盖了广泛范围。满意度的提高可能是因为现有解决方案缺乏解释的深度和细节。这种可能性也从访谈者的反馈中得到了加强，我们访谈者针对某些功能和整体满意度收集了这些反馈。


    满意度。回答速度方面有改进空间，导致了更强的整体认同。


    性能。同时，我们衡量了当前实验与 MLX1 的感知性能。三位受访者向我们询问了他们 MLX1 以及添加 Anchor 组件的体验，该组件允许特征和标签的组合。这得到了调查的进一步支持，我们得出结论：与目前的泛化方法相比，MLX1
    对感知性能有积极影响。


    尽管如此，我们可以说，MLX1 系统使用了使个体具有解释性和透明性的技术，在与其日常用户的信任和易用性方面取得了统计学上的显著改进。评审人员表示，与当前方法相比，使用
    MLX1 的体验改进程度略有不同。


    ## 4.2. 演示结果


    统计显著性。为了测试 MLX1 是否改进了我们的用户体验，我们进行了参数检验以调查结果是否具有统计学意义。根据 Norman (Norman, 2010)，参数检验在我们的情况下具有优势，因为我们拥有
    Likert 型量表且样本量较小。按照 Boone 和 Boone (2012) 的建议，我们对 Likert 量表上的每个特征类型陈述使用了 t 检验。通过问卷性能衡量了
    MLX1 与当前系统相比是否积极改善了用户体验。我们将 H0 设置为由于 ML 导致当前系统没有改进。将 Likert 量表解释为间隔尺度，我们观察到 m
    = 3.6，s = 0.86，导致 t 值为 2.5839，p 值为 0.01367。这表明在使用 MLX 生成的解释时，体验有统计学上的显著提高。


    为 MLX2 了两次演示。在其中一次中，我们演示了将 MLX2 的 Anchor 组件结合 CBS 数据用于潜在的人口统计学分析。CBS 数据包含基于 100
    米乘以 100 米地理基础的聚合数据，提供了（包括其他）关于居民的数据信息。参与者同意 MLX2 的 Anchor 组件将非常有用，如果进一步开发，可以被不同部门轻松使用。该实验将涵盖库的使用案例，使用
    Web 界面，并更好地增强结果展示。决定这将引导工具的发展，从研究输出的可能性开始。


    HI（人机交互）评估。通过评估用户体验、满意度和感知性能这三个部分，我们现在看到了第一个假设得到了证实。对住房贷款欺诈模型 MLX2 的反应是压倒性的积极。几个陈述具有较高的同意分布度，如图
    6 所示。受访者还表示有改进空间，特别涉及解释。


    - 示例：尽管三个库都是使用住房贷款欺诈模型和案例开发的，但科学家要求提供具体的示例。这反映了向利益相关者展示更广泛应用的需求。

    - 具体阈值：MLX2 为数据科学家提供了间接影响和公平性量的识别，但反馈建议对演示期间为科学家收集的四点进行重要性排序，以及标准差。


    | 反馈点 | 平均分 (1-5) | 标准差 |

    | :--- | :--- | :--- |

    | 清晰的重要性 | 4.25 | 0.50 |

    | 具体阈值 | 4 | 0.81 |

    | 清晰的指令 | 4.5 | 1.00 |

    | 选择措施 | 3.75 | |


    除了演示之外，科学家表示清晰的指令是有效的，能够根据自己的需求适应系统提供的示例。数据科学家可以接触更有可能使用 MLX2 提供的全局解释的利益相关者。这种方法确保了为了有效部署
    AI 而整体培训计划。


    - 选择措施：Aequitas 提供了多种公平性衡量，科学家要求对这些提供额外的解释和信息，以便他们选择最符合其应用的公平性衡量。这四个主要点被收集到一份问卷中，由参加演示会议的科学家填写。


    H2：ML 具有全局解释性且无偏偏的技术。表 2 表明，当问题可以解决时，MLX2 可以成为支持其量化全局解释性、信任、工作重要性和要求的巨大资产。科学家强调了理解他们所需的模型的重要性，其优先级高于理清内部流程和平衡
    AI 的系统。


    在从演示会议收集结果后，我们可以确认第二个假设。这些点被转换为问卷，按重要性分发在演示会议中。查看表中显示的重要性量表，我们可以推断出清晰的指令是最关键的，其次是使用示例和针对公平组的数据处理。表格还显示了需要操作说明排名最高。排名和标准差显示了通过为数据科学家添加操作说明以及提供示例，可以在多大程度上解决使用
    AI 的不确定性。根据这些反馈，我们开发并更新了工作说明，并得到了组织的认可。最重要的点是解决公平性措施的具体阈值的重要性，也具有较大的标准差。在数据中，数据科学家表示清晰的阈值和措施可以极大地帮助他们填写
    PID 并证明初始化或适应 ML 模型是有用的。公平性衡量这一点标准差最小，为 0.05，意味着数据科学家在很大程度上对此表示同意。


    H2 评估。通过从科学家收集的反馈以及来自法律和合规官员收集的数据中，我们可以得出“如果”工具、回测和解释非常有用的结论。科学家们认为数据科学家的工作流将提高他们的效率和案例。这将促进将新模型或适应模型投入生产的流程。这些点涵盖了工作流的不同方面，正如演示会议的参与者所示。参与者对
    MLX2 表现出兴趣，并解决公平性和透明度的适当阈值设置。他们发现使用工作工具有助于改进和简化部署 ML 工具的流程。这为 ML 具有全局解释性和可用性提供了清晰的技术，供任何组织简化涉及和平衡
    AI 的流程，特别是通过由于 Aequitas 公平性衡量和措施产生的 PID。


