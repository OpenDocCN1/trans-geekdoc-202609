    Mehrabi et al. (2021) review types of bias and fairness definitions.


    Consider two aspects of detecting bias in machine learning: data and bias. When
    training a model that is biased, using an unbiased or biased data set, it is important
    to put into place techniques to challenge and identify the bias. Secondly, in
    instances where the data set does not contain bias, the training process may introduce
    features, such as gender or race. Catan and Hao (2020) review the importance of
    these features for detecting bias, as well as increasing fairness; we used this
    as a starting point to explore possible techniques in both data and model.


    Besides techniques for global interpretability that produce feature weights or
