    ## 2.5 机器学习模型的验收


    在组织中引入项目启动文档（PID）是该组织项目可解释性要求之一。每个新的机器学习模型-PID 都包含关于偏见与歧视、可解释性以及涉及的伦理问题的的章节。在采取开发新模型或更新现有模型的任何步骤之前，它必须获得数据隐私官、合规和风险部门的接受；随后，这些将通过对所用数据的处理活动记录（ROPA）进行覆盖，并由合规部门进行审查。内部特定的指南和开发方法必须经过财务部门的批准。


    此外，该组织有兴趣使用自动化系统来量化偏见和歧视，并对决策过程获得洞察。此外，MLX1 系统的开发是为了确定模型是否对某些人口群体存在偏见。我们的 MLX2
    系统旨在支持一种通用的方法，将可解释性和偏见纳入项目启动文档中。这使得组织在接受新模型时能够简化内部流程。


    ## 3. 方法


    本节涵盖了 MLX1 和 MLX2 两个系统的设计，以及它们如何融入上一节所述的组织业务背景和模型流程。此外，它还描述了系统的开发以及其功能的演示。最后，我们概述了这两者的验证方法。


    ### 3.1. 逻辑设计


    局部可解释性系统涉及为被标记为高风险的应用生成解释。在图 1 中，我们看到了应用在分类后的不同处理方式。如果应用被分类为高风险，则将其转交给审核员进行审核，之后给出解释。审核员在通常操作之前会先对解释进行解读，以确保模型决策得到验证。这确保了模型决策不会在审核员做出自己的决定后受到其影响。如果应用未被判定为高风险，另一条路径遵循审核员的正常评估。根据他们的决定，申请将继续或停止。如果审核员识别出风险，审核员会将贷款申请提交给反欺诈部门，由他们对申请和决策进行更深入的研究。如果证实存在欺诈，则将其返回组织。然而，如果申请人被请求者拒绝，反欺诈官对怀疑的解决在最初拒绝申请是有效的。该决定可以申诉，支持对欺诈的怀疑但并未定性地证明它。


    MLX1 简单地替换了目前生成解释的方法（目前是使用简单的决策规则）。它还对模型做出的决策提供了更好的洞察，识别出那些支持模型（或无风险）指示的因素。鉴于预计审核员花费
    5 分钟来评估模型解释，可以这样解释其结构，以使得这种时间仍然受到限制。


    组织的内部流程需要通过提供全局可解释性和偏见检测来启动新的 AI 项目。MLX2 的设计旨在帮助组织确保模型不含偏见，并提供决策过程的概览。


    目前，对模型使用的所有数据的 ROPA 结果被用于确保模型是免费的，但偏见的识别仍然困难。通过识别和量化偏见，PID 得到了数据科学家的帮助，而这些工作在模型构建之前已获得合规、法律和风险部门的批准。PID
    的任何元素都可能导致偏见的识别和量化变得不明确，PID 中的这些结果可以在未来的所有案例中简化 AI 项目的流程。


    MLX1 和 MLX2 提供以下两点：首先，MLX1 允许局部可解释性，为贷款审核员提供了深入受局部可解释性和偏见检测影响的单个贷款申请决策过程的机会，使系统能够使用并集成现有的偏见模型，并对其行为获得整体洞察。


    鉴此，我们决定使用 SHAP (Lundberg & Lee 2017) 进行局部可解释性，因为它能够让贷款审核员对受局部可解释性和偏见检测影响的模型决策结果产生洞察。SHAP
    方法可以显示哪些特征对结果有大或小的影响，从而对模型行为产生洞察。SHAP 是基于内核的聚合解释，TreeSHAP 是基于树的特定解释。


    我们发现 Kernel 在所有案例中生成局部解释的运行时间很慢，TreeSHAP 能够以合理的时间生成。TreeSHAP 的复杂度为 $O(T^L)$ (Lundberg
    et al. 2020)。在这个案例中，我们发现 Kernel 在所有案例中生成局部解释的运行时间很慢，TreeSHAP 能够以合理的时间生成。TreeSHAP
    快得多。由于 SHAP 的重要性，我们需要运行一次，我们想要使用 SHAP 和 TreeSHAP，因为它们产生了不同的重要排名。为此，我们比较了排名前 5
    的特征，这些是在我们的 MLX 系统中使用的特征。在实践中，这种功能差异对系统没有影响。


