    # 机器学习应用 10 (2022) 100406


    内容列表可参阅 ScienceDirect


    # 机器学习应用


    期刊主页：www.elsevier.com/locate/mlwa


    # 提高抵押贷款行业机器学习应用的信任度与公平性


    W. van Zetten *, G.J. Ramackers, H.H. Hoos

    LIACS, 荷兰莱顿大学, Nieuw Bosch 1, Leiden, 2333 CA, The Netherlands


    # 文章信息


    # 摘要


    * **关键词**

    * 可解释人工智能

    * 可解释机器学习

    * 公平的人工智能

    * 偏偏检测


    机器学习在应用中的整合为许多机构提高效率提供了可能。然而，此类系统的部署往往由于对决策形成缺乏洞察而受到阻，导致了人们对信任和公平性的担忧。在本文中，我们调查了可解释人工智能（AI）组件在机器学习应用中缓解这些问题能做出多大贡献。作为该研究的一部分，我们针对大型机构用于抵押贷款欺诈检测的现有机器学习模型开发了
    AI 功能。部署了全局和局部解释技术，以支持欺诈检测专家利用模型进行日常工作。此外，开发了第二个实现解释技术的系统以支持管理流程。我们进行了一项大规模对照实验来衡量这两个系统的有效性，定性和定量评估均表明，增加
    AI 功能显著提高了用户对模型的信任度。结果发现，实施全局解释的 AI 系统大大提高了人们对合规性和公平性方面执行流程能力的信心。特别是，识别出了针对某些人口统计群体的偏见，并通过缓解策略消除了这些偏见。


    # 1. 引言


    人工智能正在被应用于广泛的领域，扩大了 AI 应用的范围及其对我们日常生活的程度。这些系统在医疗保健、教育、娱乐和金融等多个领域发挥着重要作用。AI 系统，或更具体说是机器学习（ML）软件，在人类无法检测解决给定问题的模式的情况下，可以实现高精度的预测。


    某些系统对某些人口统计群体存在不公平的偏见。有助于了解此类不透明决策过程并确保系统做出公平决策的方法是广泛的研究。从机器学习中学习可以产生关于目标领域的知识，而确保系统在决策过程中是不偏见且公平的，是金融领域机器学习和
    AI 系统伦理应用的要求。


    # 1.1. 问题陈述


    部署高性能机器学习系统的一个权衡是，它们往往是非常不透明的，以至于精确决策是由系统做出的，使用户很难理解为什么会获得特定的结果。这种无法检查决策过程的能力会导致许多问题。首先，验证过程的结果是可辩护的，且它遵循一条令人信服的思维路径是非常关重要的。


    机器学习经常被用于的一个方面是处理欺诈风险。一个大案例是荷兰系统风险指示（SRRI），它与大量的的人口统计数据相关，并用于识别潜在的欺诈人员。由于该过程需要被公平地考虑，加上被标记为潜在欺诈者对行业产生了巨大影响，导致该系统在使用了多年后于
    2020 年被禁止使用（van Dijk et al., 2020）。


    保险公司和银行使用机器学习来估算贷款申请人、个人贷款以及抵押贷款申请人的欺诈风险。应用这些系统的机构希望确保系统不会受到意外偏见的影响，以帮助他们遵守反歧视法；这些机构必须避免基于机器学习系统的预测来做出自动化决策。


    本指南以及其他指南源自《保险公司伦理框架》，该框架是由保险部门根据欧盟委员会的人工智能高级专家小组设立的保证审查机制（Verband van Verzekeraars,
    2021）。


    > * 通讯作者

    > 邮箱：wvanzetten@elsevier.com (W. van Zetten), g.j.ramackers@liacs.leiden.nl (G.J.
    Ramackers), hh@H. Hoos).


    https://doi.org/10.1016/j.jmlwa.2022.100406

    收稿 2022 年 5 月 20 日（作者）。修订稿 2022 年 7 月 5 日；接收 2022 年 8 月 29 日

    2666-8275 © 2022 作者。由 Elsevier 出版。根据 CC BY 许可开放访问（http://creativecommons.org/licenses/by/4.0）。


    # 1.2. 假设


    在本文，我们对一家大型荷兰保险公司（下文称为“该机构”）进行了广泛的评估和案例研究。该机构提供不同领域的各种寿险和非寿险，并利用机器学习进行欺诈检测、风险定价和承保。我们的目标是进一步改进
    AI 的使用，以应对监管机构的要求。为了实现这一目标，我们希望有一组工具可以帮助数据科学家解释他们使用的模型，验证决策过程，并调查和证明给定模型的公平性。此外，该机构需要解释个人结果的方法，以及让黑盒模型解释决策过程的方法。此外，该机构要求我们对机器学习的模型进行评估，因为这对员工和经理理解机器学习的预测至关重要。


    在本文中，我们关注可解释人工智能系统的开发，由于本研究提出的建议有助于机构实施可解释且不偏见的机器学习，我们设定了假设：


    - 1. 可解释人工智能系统有助于机构实施可解释且不偏见的机器学习。

    - 2. 可解释的机器学习模型有助于数据科学家解释他们使用的模型，验证决策过程，并调查和证明给定模型的公平性。


    # 1.3. 方法论


    在本文，我们对一家大型荷兰保险公司（下文称为“该机构”）进行了广泛的评估和案例研究。该机构提供不同领域的各种寿险和非寿险，并利用机器学习进行欺诈检测、风险定价和承保。我们的目标是进一步改进
    AI 的使用，以应对监管机构的要求。为了实现这一目标，我们希望有一组工具可以帮助数据科学家解释他们使用的模型，验证决策过程，并调查和证明给定模型的公平性。此外，该机构需要解释个人结果的方法，以及让黑盒模型解释决策过程的方法。此外，该机构要求我们对机器学习的模型进行评估，因为这对员工和经理理解机器学习的预测至关重要。


    '
