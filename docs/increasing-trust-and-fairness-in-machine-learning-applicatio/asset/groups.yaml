    (17) 在不考虑基本权利的情况下，如果数据驱动应用中的不公平差异无法避免，评审员将不会使用该应用。


    MLX2 中使用的所有库都用于涵盖《项目启动文档》（Project Initiation Document），并开发包含这些库输出内容的评估。此外，MLX2
    帮助组织遵循这些准则。


    (20) 为了使用数据驱动应用，用户必须监控多样性和包容性，特别是对于可能因偏见而面临被排除或处于劣势的群体。


    MLX2 中的 Aequitas 帮助数据科学家以及法律、合规和风险官员评估人口统计群体可能的偏见率，前提是这些信息根据 GDPR 法规是可用且可访问的。评估表明，在可能的情况下将以这种方式使用
    Aequitas。


    (21) 用户在对客户群体做出决策时，将监控使用数据驱动应用的影响。


    与 Genio 类似，Aequitas（在 MLX2 中）将通过比较人口统计群体的假阳性率（FPR）来评估数据驱动应用的公平性。可以通过输入带有聚合数据库邮政编码的数据来实现缓解。该工具可以通过
    FPR 差异来评估公平性指标。


    (23) 用户将为 AI 应用程序和数据源建立内部控制和问责制度。


    该问责制度在两个 MLX 系统开发之前就已经建立。然而，MLX2 中包含的工具将包含在本份规范的主文——《项目启动文档》中。MLX2 中库的输出必须满足某些标准，以执行内部控制。


    (24) 保险公司通过数据驱动应用提高了高管和内部审计师的知识。Aequitas（在 MLX2 中）的使用适用于高管和审计师的解读，这在向高级法律、风险和合规官员的演示中得到了证明。这一方从简单的视觉化图中获益。


    (25) 数据驱动应用的使用确保了在使用《项目启动文档》和该文档的验收过程后有充分的持续跟踪；组织同意在本文档中使用 MLX2 组件，以进一步加强相关利益相关者对可能风险的认知。


    (26) 保险公司针对每个数据驱动应用对直接利益相关者进行风险和影响评估。


    《项目启动文档》的建立遵循了这些以及其他的准则。通过使用 Aequitas（在 MLX2 中），模型将根据迁移背景和多样性群体的差异，扩展对脆弱人口统计群体潜在影响的见解，以及每个应用在该评估中的风险。


    针对风险、法律和合规经理的组织部门引起了大量讨论，参与者表示对系统中偏见的理解以及如何进行测试越深入越好。因此，我们可以说，MLX 和 MLX2 采用的解释不仅改进了用户体验并简化了内部流程，还帮助组织调整流程以符合伦理准则。


    ## 5. 结论与未来工作


    在这项工作中，我们评估了事后（post-hoc）、无关技术在增强机器学习模型可解释性方面的有效性。我们将所有技术视为全局解释技术，并报告了两个主要发现：


    - 1. 允许预测透明化的技术可以提高 ML 工具对日常用户的信任度、满意度和可用性。

    - 2. 使 ML 具有全局可解释性以及消除歧视性偏见的技术使组织能够缓解。


    我们的研究结果与荷兰的一家大型金融机构合作得到了验证。文中展示了一个使用模型估计抵押贷款欺诈风险的案例研究。该模型产生欺诈案件的每日报告，并附带关于为何将其标记为高风险的解释。高风险案件经过评审，并重点关注解释中提到的因素。在此项工作之前，该组织使用简单的基于规则的系统，仅展示可能特征的子集。在我们的工作中，我们使用
    SHAP 和 Aequitas 的自动化方法取代了它，提供了包含所有可能特征的详细解释，并在未来进行改进。


    实施这些局部解释技术的可解释 AI 系统被称为 MLX1，已用于对 11 名欺诈专的深度研究和短期访谈。调查捕捉了对透明度、可用性和性能变化的感知。这三项指标允许衡量
    MLX1 是否改进了评审员使用现有抵押贷款欺诈检测 AI 模型的工作方式。结果发现，MLX1 在三个指标上均实现了统计学上的显著改进。


    第二个可解释 AI 系统（MLX2）基于 WhatIf 工具、BoxAuditing 和 Aequitas，专注于市场响应的全局解释。它旨在通过量化（测量）偏见为做出投资决策提供见解。此外，还为数据科学家提供了带有库的说明和示例。这些技术通过增强的数据分类任务执行，以测试在此方面对偏见建模的可能性。


    这系列全局解释技术已向数据科学家以及风险、法律和合规部门的代表演示，它帮助组织解决了与模型构建和管理有关的问题。


    此外，我们认为在该工作中开发的的可解释 AI 系统还帮助组织遵守有关保险行业伦理使用机器学习的准则，提高了《保险行业伦理准则》中所述的问责制质量。这使得组织能够对
    AI 系统建立人类控制，解决潜在的透明度问题。


    总而言之，我们的研究结果证明了可解释技术在实践中的益处。实施和验证的机会


