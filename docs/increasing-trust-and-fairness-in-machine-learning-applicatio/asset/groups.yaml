    # Machine Learning with Applications 10 (2022) 100406


    Contents lists available at ScienceDirect


    # Machine Learning with Applications


    journal homepage: www.elsevier.com/locate/mlwa


    # Increasing trust and fairness in machine learning applications within the mortgage
    industry


    W. van Zetten *, G.J. Ramackers, H.H. Hoos

    LIACS, Leiden University, Nieuw Bosch 1, Leiden, 2333 CA, The Netherlands


    # ARTICLE INFO


    # ABSTRACT


    * * Keywords

    * Explainable artificial intelligence

    * Interpretable machine learning

    * Fair artificial intelligence

    * Bias detection


    The integration of machine learning in applications provides opportunities for
    increased efficiency in many organizations. The deployment of such systems is
    often hampered by the lack of insight into how decisions are reached, resulting
    in concerns about trust and fairness. In this article, we investigate what the
    extent of explainable AI components to ML applications can contribute to alleviating
    these issues. As part of this research, AI functionality was developed for an
    existing ML model used for mortgage fraud detection at a large institution. The
    global and local explanation techniques were deployed to support the day-to-day
    work of fraud detection experts with the model. In addition, a second system implementing
    explanation techniques was developed to support the management process. A large-scale
    controlled experiment was carried out to measure the effectiveness of the two
    systems, both qualitative and quantitative assessment showed that the addition
    of AI functionality resulted in a significant increase in trust in the model by
    its users. The AI system implementing global explanation was found to considerably
    increase confidence in the ability to perform the processes on compliance and
    fairness. In particular, bias detection towards certain demographic groups was
    identified and removal of such biases achieved with a mitigation strategy.


    # 1. Introduction


    Artificial Intelligence is being deployed in a broad range of applications, increasing
    the scope of AI applications and the degree to which they affect our daily lives.
    These systems play important roles across various sectors, including healthcare,
    education, entertainment and finance. AI systems, or more specifically machine
    learning (ML), software can achieve high precision in prediction where humans
    are unable to detect the patterns to solve a given problem.


    Some systems are unfairly biased towards certain demographics. Methods that can
    help gain insight into such opaque decision processes and ensure systems make
    fair decisions are extensive research. Learning from machine learning could produce
    knowledge of the target domains, and ensuring systems are unbiased and fair the
    decision process is a requirement for the ethical application of machine learning,
    and AI systems in finance.


    # 1.1. Problem statement


    A trade-off in the deployment of high-performance ML systems is that they are
    often so opaque that the exact decision is made by the system, making it very
    difficult for users to understand why a specific result was obtained. Many problems
    arise from this inability to examine the decision process. Firstly, it is important
    to validate that the outcome of the process is defensible, and that it follows
    a compelling path of thought.


    One frequently used for machine learning is in addressing the risk of fraud. A
    large case is the Dutch System Risk Indication (SRRI), which is linked to a large
    amount of demographic data and used to identify potentially fraudulent individuals.
    The requirements for the process to be fairly considered, combined with the fact
    that being marked as a potential fraudster had great impact on the industry, caused
    the system to be prohibited in 2020, after having been in use for many years (van
    Dijk et al., 2020).


    Insurers and banks use ML to estimate the risk of fraud with loan applicants,
    personal loans as well as mortgages. Organizations applying these systems want
    to ensure that the systems do not suffer from unintended bias, helping them adhere
    to anti-discrimination laws, these organisations must refrain from making automated
    decisions based on predictions from the ML system.


    This guideline, as well as others, from the Ethical Framework for Insurers, a
    guaranteed review setup by the Department of Insurers based on the High-Level
    Expert Group on Artificial Intelligence addressing the European Commission (Verband
    van Verzekeraars, 2021).


    > * Corresponding

    > E-mail: wvanzetten@elsevier.com (W. van Zetten), g.j.ramackers@liacs.leidenuniv.nl
    (G.J. Ramackers), hh@H.H. Hoos).


    https://doi.org/10.1016/j.jmlwa.2022.100406

    Received 20 May 2022 (The Authors). Received in revised form 5 July 2022; Accepted
    29 August 2022

    2666-8275 © 2022 The Authors. Published by Elsevier Ltd. This is an open access
    article under the CC BY license (http://creativecommons.org/licenses/by/4.0).


    # 1.2. Hypotheses


    In this article, we present an extensive evaluation and case study with a large
    Dutch insurer, hereafter referred to as "the organisation". The organisation offers
    life and non-life insurance for various products and services in different areas;
    it uses ML for fraud detection, risk pricing and underwriting. Our goal is to
    further improve its use of AI, in order to address the obligations set out by
    regulators. In order to achieve this, we would like to have a set of tools that
    help data scientists explain the models they use, to validate the decision process,
    and investigate and demonstrate the fairness of a given model. Furthermore, the
    organisation requires methods to explain the individual outcomes and for models
    with black box structures to explain the decision making process. Also, the organisation
    requires us to evaluate the interpretability of models using ML, as it is crucial
    for employees and managers to understand the predictions made by ML.


    In this paper, we focus on the development of explainable AI systems and instructions
    proposed in this research helps organisations implement interpretable and unbiased
    ML, we set the following hypotheses:


    - 1. Explainable AI systems help organisations implement interpretable and unbiased
    ML.

    - 2. Interpretable ML models help data scientists explain the models they use,
    validate the decision process, and investigate and demonstrate the fairness of
    a given model.


    # 1.3. Methodology


    In this article, we present an extensive evaluation and case study with a large
    Dutch insurer, hereafter referred to as "the organisation". The organisation offers
    life and non-life insurance for various products and services in different areas;
    it uses ML for fraud detection, risk pricing and underwriting. Our goal is to
    further improve its use of AI, in order to address the obligations set out by
    regulators. In order to achieve this, we would like to have a set of tools that
    help data scientists explain the models they use, to validate the decision process,
    and investigate and demonstrate the fairness of a given model. Furthermore, the
    organisation requires methods to explain the individual outcomes and for models
    with black box structures to explain the decision making process. Also, the organisation
    requires us to evaluate the interpretability of models using ML, as it is crucial
    for employees and managers to understand the predictions made by ML.

