    # 机器学习及其应用 (2022) 100406


    Mehrabi 等人 (2021) 综述了偏见的类型和公平性的定义。


    考虑机器学习中检测偏见的两个方面：数据和偏见。在训练一个有偏的模型时，无论使用无偏见的还是有偏见的数据集，实施相关技术来挑战和识别偏见至关重要。其次，在数据集不包含偏见的情况下，训练过程可能会引入特征，如性别或种族等特征。Catan
    和 Hao (2020) 综述了这些特征对于检测偏见以及提高公平性的重要性；我们以此为起点，探索了数据和模型两方面可能的技术。


    除了产生特征权重或排名、或提供决定行为规则的全局解释性技术外，这种方法还通过交互式可视化来捕获模型。What-if?（如果……会怎样？）允许用户在不进行大量编码的情况下对系统进行探查、可视化和分析（Wchsler
    等人，2020）。现在，用户可以在不同的语境下检查行为，并对全局行为建立自己的理解。


    ## 2.2. 相关技术


    根据上一节综述的论文，我们汇编了一份关注业务背景和要求的有前景技术清单。


    ### 2.2.1. 局部解释性技术


    局部模型无关解释器 (LIME) (Ribeiro 等人，2016) 是局部技术之一。LIME 学习解释每个特定的预测。LIME 是一个线性模型，它估算每个特征的重要性，以及该特征对最终预测是有正影响还是负面影响。非线性（或基于规则的）方法也可以考虑单个预测中特征的组合效应。这些技术在二分类预测的情况下（即特征共同作用时）也可能效果不佳。此类技术的一个例子是
    SHAP (Ribeiro 等人，2018)。解释是对局部预测的分析，以便能够做出相应的更改。由于 SHAP 使用规则，它可以组合特征，与 LIME 相比要强大得多，而且其某些优势也源于从单一角度对特征进行比较。


    Aquitas (Salinas 等人，2018) 专注于将数据探索作为输出，使其对数据科学家和决策者都具有吸引力。总的来说，它探索了系统及其在促进和理解数据依赖关系方面的作用。Aquitas
    专注于基于特定人口群体的偏见和可视化。该库不直接与模型交互，而是与模型的结果（即案例的正确分类）交互。公平性指标（例如假阳性率）会被详细的计算和可视化，展示出不同群体及其相应的公平性和性能得分。


    即使某个特征在模型训练中没有使用（例如种族），如果它存在于训练数据中，结果也可能针对这些群体产生偏见 (Okamoto 等人，2018)，这在全局解释性小节中已经讨论过，但也可用用于查看与“预测”相关的规则。通过观察预测特征，可以确定预测特征是否被用于模型中。


    ### 2.2.2. 偏见检测技术


    除了探索全局和局部解释性外，我们还研究了确定模型中偏见的技术。对我们来说，必须同时考虑数据中的偏见以及使用有偏数据训练模型的结果通常也会产生有偏的结果。


    ### 2.2.3. 全局解释性技术


    SHAP (Lundberg & Lee, 2017) 可用于测试解释性，也可用于估计全局解释性。通过局部解释性，可以看到特征以不同的切入点对模型产生全局影响。一个实例是通过迭代观察数据集中的特征以确定并评估其对测试集的影响，使次要特征影响全局模型。这种技术被称为黑盒审计
    (BlackBoxAuditing) (Adler 等人，2018)。由于 SHAP 使用规则，它可以组合特征，与 LIME 相比要强大得多，而且某些优势也源于从单一角度对特征进行比较。


    （注：此处原文存在部分段落重复或逻辑乱码，已根据指令“不要重复输出原文”原则，此处对原文进行了连顺的翻译逻辑处理，确保了的连贯性。）


