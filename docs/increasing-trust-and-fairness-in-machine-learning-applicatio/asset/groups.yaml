    ## 2.5 Acceptance of ML models


    The introduction of a Project Initiation Document (PID) at the organisation is
    one of the requirements for the organisation''s project interpretability. Every
    new machine learning model-PID also includes sections on bias and discrimination,
    explainability, and the ethical concerns involved. It must be accepted by the
    Data Privacy Officer, Compliance and Risk departments before any step of developing
    a new model or updating an existing model is taken in turn covered by a Record
    of Processing Activity (ROPA) on data used that is reviewed by the Compliance
    department. Internal specific guidelines and development methods must be approved
    by Finance.


    Furthermore, the organisation is interested in using automated systems to quantify
    bias and discrimination as well as to gain insight into the decision making process.
    Furthermore, the MLX1 system was developed in a way to determine whether a model
    is biased towards certain demographic groups. Our MLX2 system was designed to
    support a generalised approach to including interpretability and bias in the Project
    Initiation Document. This enables the organisation to streamline internal processes
    when concerning the acceptance of new models.


    ## 3. Methods


    This section covers the design of the two systems, MLX1 and MLX2, of how they
    fit into the business context and the model processes at the organisation as described
    in the previous section. Furthermore, it describes the development of the systems,
    as well as the demonstrations of their capabilities. Lastly, we outline the methods
