    \n# ARTICLE INFO\n\n# ABSTRACT\n\n+   * Keywords\n* Explainable artificial intelligence\n\
    * Interpretable machine learning\n* Fair artificial intelligence\n* Bias detection\n\
    \nThe integration of machine learning in applications provides opportunities for\
    \ increased efficiency in many organizations. The deployment of such systems is\
    \ often hampered by the lack of insight into how decisions are reached, resulting\
    \ in about trust and fairness. In this article, we investigate what the extent\
    \ of explainable AI components to ML applications can contribute to alleviating\
    \ these issues. As part of this research, AI functionality was developed for an\
    \ existing ML model used for mortgage fraud detection at a large institution.\
    \ The global and local explanation techniques were deployed to support the day-to-day\
    \ work of fraud detection experts with the model. In addition, a second system\
    \ implementing explanation techniques was developed to support the management\
    \ process. A large-scale controlled experiment was carried out to measure the\
    \ effectiveness of the two systems, both qualitative and quantitative assessment\
    \ showed that the addition of AI functionality resulted in a significant increase\
    \ in trust in the model by its users. The AI system implementing global explanation\
    \ was found to considerably increase confidence in the ability to perform the\
    \ processes on compliance and fairness. In particular, bias detection towards\
    \ certain demographic groups was identified and removal of such biases achieved\
