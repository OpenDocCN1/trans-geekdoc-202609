  md: '# 2.5 Acceptance of ML models


    The introduction of a Project Initiation Document (PID) at the organisation is
    one of the requirements for the organisation''s project interpretability. Every
    new machine learning model-PID also includes sections on bias and discrimination,
    explainability, and the ethical concerns involved. It must be accepted by the
    Data Privacy Officer, Compliance and Risk departments before any step of developing
    a new model or updating an existing model is taken in turn covered by a Record
    of Processing Activity (ROPA) on data used that is reviewed by the Compliance
    department. Internal specific guidelines and development methods must be approved
    by Finance.


    Furthermore, the organisation is interested in using automated systems to quantify
    bias and discrimination as well as to gain insight into the decision making process.
    Furthermore, the MLX system was developed in a way to determine whether a model
    is biased towards certain demographic groups. Our MLX2 system was designed to
    support a generalised approach to including interpretability and bias in the Project
    Initiation Document. This enables the organisation to streamline internal processes
    when concerning the acceptance of new models.


    # 3. Methods


    This section covers the design of the two systems, MLX1 and MLX2, of how they
    fit into the business context and the model processes at the organisation as described
    in the previous section. Furthermore, it describes the development of the systems,
    as well as the demonstrations of their capabilities. Lastly, we outline the methods
    for validation of both.


    # 3.1. Logical design


    The system for local interpretability involves generating explanations for applications
    that have been flagged as high risk. In Fig. 1 we see the different ways for an
    application after it has been classified. If an application is classified as high
    risk then it is passed to the reviewer for review, after which the explanation
    is presented. A reviewer first interprets the explanation before they would normally,
    to ensure the model decision is verified. This ensures that the model decision
    is not influenced by the reviewer after they have made their own, decision. The
    other path follows the normal assessment by a reviewer, if the application has
    not been judged as a high risk. Based on their decision, the application proceeds
    or stops. If a risk is identified by a reviewer, the mortgage application is passed
    onto the anti-fraud department by the reviewer, who do in more research into the
    application and the decision. If the fraud is proven, it is returned to the organisation.
    However, resolution of suspicion by the anti-fraud officer is valid to reject
    the application at first, if the applicant is rejected by the requester. The decision
    is subject to an appeal, supporting the fraud suspicion but not conclusively proving
    it


    The MLX1 simply replaces the current method for generating the explanation, which
    in the current situation is using simple


    decision rules. It also gives better insight into the decision made by the model,
    identifying those that support the model (or no risk) indication. Given that the
    reviewers are expected to spend 5 minutes evaluating the model explanation, can
    be taken to explain the structure in such a way that this time can limit is still


