    A second explainable AI system (MLX2) focused on global explanation of the market
    response, based on the What tool, BoxAuditing and Aequitas. It aims to provide
    insight into making investment decisions by allowing for quantitative (measuring)
    bias. In addition, instructions and examples were provided to the data scientists
    with the libraries. The techniques were executed with augmented data classification
    tasks to test for the possibility to model bias in this regard.


    This collection of global explanation techniques was demonstrated to data scientists
    and representatives from risk, legal and compliance departments, and it also helped
    the organisation to address concerns concerned with the construction and administration
    of models.


    Furthermore, we conclude that the explainable AI systems developed in this work
    have also helped the organisation in adhering to guidelines regarding the ethical
    use of machine learning in the insurance industry, improving accountability and
    quality as expressed in the Ethical Guidelines for the Insurance Industry. This
    enables the organisation to establish human control over AI systems, addressing
    potential transparency issues.


    Overall, the findings of our research demonstrate the benefits of interpretable
    techniques in practice. The opportunity to implement and validate our systems
    in a business environment, with a wide range of stakeholders, from learners to
    others clearly demonstrates that these libraries render ML systems easier to interpret
    and critically assess.


    Finally, number of practical observations we made while deploying explainable
    AI in a real-world setting. Developing an explainable AI in a business environment
    requires significant time, effort and expertise, as we need to curate the data
    set to select the top 15 most important features for our model.


    Furthermore, experts do not want all the possible explained by ML technique; in
    our case, detailed explanations were provided to the reviewers of models in order
    to identify potential bias. As a result, we requested a prototype system that
    was based on part of the explanations, generated, comparisons to variants and
    the data features, in order to provide experts with additional insights.


    Our implementation of MLXI showed that users experience a higher level of trust
    using AI systems more than MLXI without. However, when implementing business processes
    that guard against bias, users found to have their own concerns. Our readers encountered
    the oversight required by the Ethical Guidelines. In the mortgage application
    context, reviewers were required to verify and confirm every single risk indicator
    identified by the model and considered the model decisions and insights, but not
    blindly copy.


    There are several limitations to our research that should be addressed. In the
    fact that we used only when suspected fraud was detected, as well as limited to
    reviewers, mean that the fact performance or potential of a more subjective implementation
    that adds more statistically based explanations, remains untreated.


    Other limitations could arise when the methodology introduced in our work is used
    in practice, for example the added computation time of KernelSHAP in the case
    of a more complex architecture or data privacy laws making it impossible to aggregate
    data with results to mitigate bias.


    Further areas for future work include comparing MLXI for explanations against
    a baseline providing a textual evaluation. Evaluating the Anchor component MLXI
    against manual group of results might provide insights as the reviewers presented
    with the mapping grouping having differing reactions. Furthermore, developing
    a method to quantify the trust in gains and debits, and allow for a comparison
    between the model variant that was built in this research, and a more subjective
    variant of MLXI context.


    The research presented in this paper allowed the organisation to improve the acceptance
    and effectiveness of their ML models, by providing a new method for better understanding
    models. Furthermore, the paper presented an approach to test unbiased bias and
    distribution, in a bidirectional stream relating results model acceptance and
    decision. Both methods presented are designed to clarify the potential fraud risk
    domain, improving model bias and testing with AI models in high impact applications.


