    # 1.2. Hypotheses


    In this article, we present an extensive evaluation and case study with a large
    Dutch insurer, hereafter referred to as "the organisation". The organisation offers
    life and non-life insurance for various products and services in different areas;
    it uses ML for fraud detection, risk pricing and underwriting. Our goal is to
    further improve its use of AI, in order to address the obligations set out by
    regulators. In order to achieve this, we would like to have a set of tools that
    help data scientists explain the models they use, to validate the decision process,
    and investigate and demonstrate the fairness of a given model. Furthermore, the
    organisation requires methods to explain the individual outcomes and for models
    with black box structures to explain the decision making process. Also, the organisation
    requires us to evaluate the interpretability of models using ML, as it is crucial
    for employees and managers to understand the predictions made by ML.


    In this paper, we focus on the development of explainable AI systems and instructions
    proposed in this research helps organisations implement interpretable and unbiased
    ML systems, we set the following hypotheses:


    +   1. Techniques for individual predictions to be interpretable and transparent
    increase trust, and usability of ML models with their users.


    +   2. Techniques for ML to be globally interpretable and demonstrably free of
    discriminatory bias enables streamline internal processes concerning fair and
    balanced AI.


    # 1.3. Methodology


    Our study presented here researches design, by designing two prototype AI systems
    jointly with the organisation. By researching existing techniques in the domain
    of AI research, we selected a set of techniques and combine them to provide interpretability
    for the organisation to achieve the goals described. We evaluate the techniques
    identified through existing AI at the organisation, how effective these techniques
    are, and what should be considered for their implementation.


    We propose two prototype systems. The first of these focuses on implementing operational
    explainability, granting users insight into the individual predictions generated
    by a model. In literature this is known as local interpretability. This first
    system will benefit from being locally interpretable. Our second system focuses
    on bias detection, granting insight factors into the overall behaviour of the
    ML model, and testing the fairness for a given model. This allows for a model
    to be fair and unbiased, which is known as global interpretability. This system
    will be called MLX2. These two systems allow for an organisation to gain insight
    into the behaviour of ML models on


    a micro-level, as well as to ensure that an ML system is demonstrably free of
    bias.


    MLX1 was validated in cooperation with a group of 11 mortgage application agents,
    who work with an ML model assessing applications on daily basis. A short survey
    revealed high satisfaction and satisfactory performance. We validated it with
    a second survey, in cooperation with data scientists, specifically focusing on
    the use of their system in development and process, and also with experts from
    Legal, Compliance and Risk departments, to evaluate the interpretability and insights
    gained from using it. The results showed that the system was accepted in every
    new and existing ML model in their use.


    The result of our study presented here is an evaluation of techniques for the
    given problem, implementation and considerations in a practical scenario.


    # 2. Background


    The background for this work is determined by the business context, namely and
    regulations to which the organisation must adhere, as well as guidelines to be
    met. Research in the field of transferable machine learning has produced a range
    of techniques that can be used by our prototype systems.


    # 2.1. Research in AI


    In recent years, the field of interpretable machine learning and bias detection
    has seen enormous growth. Some of these focus on the effect of interpretability
    in its application areas and the interactions with users, using user trust and
    model adaptation (Doran et al., 2018; Hoffmann et al., 2019). Another subset of
    research focuses on developing techniques to gain insight into machine learning
    models (Rudin et al., 2019). Another is focused on developing machine learning
    models that are interpretable, by creating methods to develop a separate layer
    that explains the interpretability of black-box models (Lipton et al., 2016).
    In this paper, we focus on model-specific techniques, as it that we develop and
    address the problem of models from being limited to a certain type of ML.


    Interpretable machine learning is a subset of explainable AI, with many surveys
    seeking to give an overview of interpretability in machine learning models. Our
    paper goes more deeply into the different views and perspectives with explainable
    AI (Doran et al., 2018). Yet other people investigate the impact of explainable
    models people have used and what they perceive about them (Gill et al., 2019).
    After several years of applications, or by classification of relevant techniques,
    Roscher et al. (2020) specifically highlights the application of interpretable
    machine learning for scientific research, considering existing research and applications
    of interpretation. Based on byys and Ardell (2024) and Guid et al. (2019) with
    the reasons listed above, we agree that in order to satisfy the interpretable
    machine learning aspect of AI, it is necessary to consider both local and global
    interpretability. Local interpretability includes techniques that help grant insight
    into the considerations made by the model in a specific case, often identifying
    the most important features used. Global interpretability techniques focus on
    building an overall understanding of the decision making process of the model,
    examining features that are most important and most used when judging new cases.'
