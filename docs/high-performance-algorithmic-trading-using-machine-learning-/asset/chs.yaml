  表 9.1：铜价格\n\n当使用 `ruptures` 进行金融时间序列分析（如股价 CPD）时，在分析前格式化数据主要有两种选择。你可以输入原始序列（例如收盘价），或输入原始序列的增量来分析序列的变化。以下是一些选择最佳方案的提示：\n\
  \n*   **在价格与增量之间选择**：\n    *   **使用价格增量 (`P(t) - P(t-1)`)**：此方法涉及将连续价格的差值输入模型。当你关注波动率的变化，或寻找收益率的变化而非绝对价格水平的变化时，此方法特别有用。该方法对价格变化显著偏离常态的时期敏感，这可能预示着市场机制或波动率的变化。\n\
  \    *   **使用直接价格 (`P(t)`)**：或者，你可以直接将股价输入模型。当你关注检测价格水平的偏移（如长期趋势或价格的突然跳变）时，此方法可能更合适。直接价格可凸显不同类型的结构性断裂，如与资产内在价值相关而非其波动率相关的断裂。\n\
  \n\n\n### 选择方法\n\n#### 针对波动率变化\n如果您的主要兴趣在于检测波动率或交易量的变化，使用增量更为合适。这种格式能更直接地揭示价格变动强度发生变化的时期，这是波动率转移的常见指标。\n\
  \n#### 针对价格水平变化\n如果您更关心识别资产价格水平的转移（例如，检测因外部事件导致的股价突然跳涨，或预示新趋势的渐进式转移），使用直接价格更为合适。\n\
  \n就我们而言，我们正在探索该库检测波动率变化的能力。因此，我们按如下方式计算价格增量。这行代码提取移除缺失值后清洗过的价格增量值：\n\n```\ndata\
  \ = df['Close'].diff().dropna().values\n```\n\n然后，我们将这些增量（`data`）输入到 CPD 算法中。可用的三个核函数分别是\
  \ `linear`、`rbf` 和 `cosine`。\n\n每个核函数为分析信号提供了一种独特的方法，提供了选择最适合您数据的方法的灵活性。我们可以启动一个循环来测试各种核函数值，并通过可视化检查结果\
  \ 4 以确定最有效的选项：\n\n```\nimport ruptures as rpt\n\nfor i, kernel in enumerate(['linear',\
  \ 'rbf', 'cosine']):\n    algo = rpt.KernelCPD(kernel=kernel, min_size=10)\n   \
  \ algo.fit(data)\n    result = algo.predict(pen=1e-3)\n```\n\n以下是将不同核模型应用于数据的结果：顶部图表显示使用\
  \ `linear` 核的结果，中部图表使用径向基函数（`rbf`）核，底部图表使用 `cosine` 核。\n\n每个图表均用垂直虚线标示识别出的变点，从而可以比较每种核类型如何影响\
  \ CPD 的准确性和灵敏度，如下所示：\n\n![](img/fig-9-4.png)\n\n根据图表，可分析以下要点以确定最佳选择：\n\n- **检测的清晰度**：三种核模型似乎都成功识别了显著变点。然而，`linear`\
  \ 和 `cosine` 核显示的变点过渡更为陡峭，这可能意味着对 CPD 事件的检测更为确定。\n- **信号频率**：`rbf` 核呈现略微嘈杂的信号，峰值更为频繁，这可能导致更高的误报\
  \ 5 检测率，或检测到某些应用中不太相关的微小变化。\n- **变点精度**：`linear` 和 `cosine` 核似乎在常规波动和真实变点之间提供了更清晰的区分，表明精度更高，这对于突破建模中准确的\
  \ CPD 至关重要。\n- **简单性与可解释性**：`linear` 核因其简单性，往往需要调整的参数更少，且更具可解释性，这在实际应用中通常具有优势。\n\
  \n总之，所采用的每种技术都一致地将关键转折点识别为 CPD 事件。虽然所有技术均有效，但 `linear` 和 `cosine` 核在定位 CPD 方面表现出略高的精度和准确性。鉴于其清晰精准的\
  \ CPD 表现，它们可能是突破建模中 CPD 的更好选择。\n\n为了进一步分析检测到的变点，我们需要进行详细评估以了解每个变化的显著性。这涉及统计检验——一个略显技术性的过程——旨在将真实的市场行为变化与误报（被误认为信号的噪声）区分开来。虽然此步骤需要一定的统计学理解，但它对于评估\
  \ CPD 算法识别的转折点的可靠性至关重要。尽管这有助于深入理解，读者若跳过此部分也不会影响对整体上下文的把握。\n\n### 评估分割质量\n\n利用 Ljung-Box\
  \ 统计量（一种残差自相关度量），我们可以使用既定的统计检验方法来验证每个变点。\n\n模型识别出潜在变点后，我们根据这些检测到的断点 6 对信号进行分段。对每个分段，将统计检验应用于残差——即观测值与模型预测值之间的差值——以检查自相关性。如果残差独立分布（无自相关），则表明模型已有效捕捉了主要变点\
  \ 7。反之，显著的自相关可能表明遗漏了一些变点，或某些检测到的点可能是误报。\n\n以下代码基于 `statsmodels` 库 8 中 Ljung-Box\
  \ 统计量的实现：\n\n```\nfrom statsmodels.stats.diagnostic import acorr_ljungbox\n\n####\
  \ 根据检测到的断点对信号分段并分析残差\nfor i, bkpt in enumerate(result[:-1]):\n    segment = data[result[i-1]:bkpt]\n\
  \n    # 假设零假设下的模型为常数（分段均值）\n    residuals = segment - np.mean(segment)\n\n    #\
  \ 对每个分段进行 Ljung-Box 检验\n    df_test_stat = acorr_ljungbox(residuals, lags=[max_lags],\
  \ return_df=True)\n    p_val = df_test_stat.loc[df_test_stat.index[-1], 'lb_pvalue']\n\
  \n    print(f\"Segment {i+1} (index pos: {bkpt})| Ljung-Box test p-value: {p_val}\"\
  )\n\n    # 结果解读\n    if p_val < 0.05:\n        print(\"Significant autocorrelation\
  \ detected in residuals -> poor CPD.\\n\")\n```\n\n该代码输出以下结果：\n\n```\nSegment 1\
  \ (index position: 10)| Ljung-Box test p-value: 0.6132004582354784\nSegment 2 (index\
  \ position: 25)| Ljung-Box test p-value: 0.7610265642130016\nSegment 3 (index position:\
  \ 35)| Ljung-Box test p-value: 0.5437320316542755\n...\nSegment 8 (index position:\
  \ 97)| Ljung-Box test p-value: 0.028073716949534897\nSignificant autocorrelation\
  \ detected in residuals -> poor CPD.\nSegment 9 (index position: 107)| Ljung-Box\
  \ test p-value: 0.7441227622887603\n...\nSegment 11 (index position: 134)| Ljung-Box\
  \ test p-value: 0.02712131034835348\nSignificant autocorrelation detected in residuals\
  \ -> poor CPD.\n...\nSegment 18 (index position: 226)| Ljung-Box test p-value: 0.9391197784597746\n\
  ```\n\n对于 `cosine` 核算法，分段 #8 和分段 #11 被错误地识别为变点。这些分段的底层分布未表现出显著变化，它们被检测为变点很可能是由于误报或检测算法中的错误。\n\
  \n对于其他变点，算法似乎正确检测到了未来铜价增量序列中的断点。下图显示了通过统计检验接受的 CPD（垂直实线）和被拒绝的 CPD（垂直虚线）：\n\n![](img/fig-9-5.png)\n\
  \n我们对分析库获得的这一初步结果感到满意。我们已检测、识别并根据统计显著性对变点和转移进行了排序，从而清晰地了解了每个变点的强度。\n\n然而，我们可以通过以下问题进一步探索数据：所有分段\
  \ 9 是否同质，还是可以根据其特征归类为不同的群组？我们能否识别出具有相似特征的分段簇，从而将它们归类为天然家族？\n\n## 序列聚类\n\n### 聚类的数据准备\n\
  \n\n\n\n\n#### 数据预处理与聚类分析\n\n在应用聚类算法之前，我们需要准备数据。该过程的第一步是预处理我们的序列和片段。这涉及两个关键步骤：填充序列以确保其长度统一，以及标准化片段以防止任何单个特征主导分析。我们将首先对序列应用填充。\n\
  \n### 序列填充\n\n在序列数据的语境下，填充是指向序列添加额外值以使其达到统一长度的过程。当处理长度各异的序列时，这通常是必要的，因为许多机器学习算法要求固定长度的输入数据。如果没有填充，长度不同的序列将与这些算法不兼容。此外，如果序列长度不同，模型可能会偏向较长的序列，从而导致结果不准确。\n\
  \n以下是标准化（`pad_sequences`）输入片段（`seqs` 是序列列表）的代码，确保它们都具有统一长度 10：\n\n```python\nfrom\
  \ keras.preprocessing.sequence import pad_sequences\n\npadded_seqs = pad_sequences(seqs,\
  \ padding='post', dtype='float32')\n```\n\n在确保长度统一后，我们需要在统计学上标准化输入片段。为此，我们应用标准缩放器（`StandardScaler()`\
  \ 函数），它将所有输入转换为具有相似的尺度，其特征是零均值和单位标准差。\n\n此步骤（`scaler.fit_transform`）使机器学习算法能够更轻松地比较不同的序列，从而促进发现反复出现的模式：\n\
  \n```python\nfrom sklearn.preprocessing import StandardScaler\n\n#### padded_seqs:\
  \ 填充后的序列数组\nscaler = StandardScaler()\n\n#### 标准化序列\nseqs_scaled = scaler.fit_transform(padded_seqs.reshape(len(padded_seqs),\
  \ -1))\n```\n\n### 使用 UMAP 进行降维\n\n在聚类之前，我们应用一个关键的预处理步骤：降维。经验表明，这能改善复杂金融数据的分析。我们将使用统一流形逼近与投影算法（UMAP），该算法以在降低维度的同时保留局部数据结构而闻名。\n\
  \n#### 应用 UMAP\n\n现在我们的数据已标准化，本可以继续进行聚类。然而，根据我在金融数据分析方面的经验，通常有必要细化数据以使其更易于分析。为此，我们将使用一种保留数据局部结构的降维技术，称为\
  \ UMAP11。我们已在 第 6 章“使用特征提升模型能力”中介绍过该算法。通过应用 UMAP，我们可以将复杂的高维数据提炼为更易管理的低维表示，称为投影（通常为一维或二维）。该算法确保在投影步骤中保留相邻数据点之间的关系，因此原本靠近的数据点在投影后仍然靠近。\n\
  \n此步骤简化了数据并保留了其固有特征，UMAP 以惊人的精度完成了这一壮举：\n\n```python\nfrom umap import UMAP\n\n\
  trsf = UMAP(n_neighbors=2, min_dist=0.1, n_components=2)\nseqs_reduced = trsf.fit_transform(seqs_scaled)\n\
  ```\n\n通过 UMAP 降维，我们现在可以对相似序列进行分组。使用 kMeans，我们将识别数据中的模式和结构。\n\n### 使用 KMeans 对序列进行聚类\n\
  \n经过 UMAP 变换的数据被输入聚类算法，该算法将相似的数据点分组在一起。本质上，我们分析的不是原始数据，而是经过 UMAP 变换的数据，这使得模式识别和聚类更加有效。\n\
  \n繁重的工作由 UMAP 完成，它将复杂数据投影到低维空间，同时保留其基本特征。这为 k-Means 聚类算法根据点之间的接近程度对其进行分组奠定了基础。\n\
  \n简而言之，k-Means 是一种无监督算法，它根据数据点的相似性将它们分组到簇中，使我们能够识别数据中的自然族群。它通过迭代优化簇分配来工作，直到数据点被分组成共享共同特征的连贯簇。\n\
  \n通过这样做，k-Means 提供了一种发掘数据中隐藏模式和结构的方法，使我们能够更好地理解和描述数据点之间的潜在关系：\n\n```python\n####\
  \ CLUSTERING (聚类)\nn_clusters = 4\nclst = KMeans(n_clusters=n_clusters, n_init='auto')\n\
  clusters = clst.fit_predict(seqs_reduced)\n```\n\n下图展示了将 k-Means 聚类应用于经过 UMAP 变换的数据的结果，显示了分成四个不同簇的分组情况。\n\
  \n我们根据点在原始列表中的顺序用标签标注点，并用独特的颜色和标签（16）高亮显示最后一个（最近的）子序列，如下所示：\n\n![](img/fig-9-6.png)\n\
  \n该图显示了序列按其固有群组分类的情况，每个群组用不同颜色表示。例如，前两个序列（0 和 1）和最新的一个（“last sequence”）被聚类在一起，由分配给该组的橙色指示。\n\
  \n虽然这个聚类序列的散点图提供了它们如何相互作用的有用可视化，但它缺少一个关键维度：时间。为了充分捕捉这些序列的动态，我们需要将时间维度纳入图表。我们将不再根据序列间的相对位置定位，而是根据它们在时间中的出现顺序重新排序。\n\
  \n在下图中，我们将显示由聚类算法标记的每个序列，按其在时间尺度上的正确位置排列，从而提供对其关系的更全面理解：\n\n![](img/fig-9-7.png)\n\
  \n该图显示了分为四个簇的铜期货收盘价，每个簇用不同颜色表示：`['orange': 标记为 '0', 'purple': 标记为 '1', 'green':\
  \ 标记为 '2', 'blue': 标记为 '3']`。算法将每个簇识别为一个独特的状态，其特征是各自独特的动态和行为。\n\n### 解读聚类\n\n算法识别出的簇揭示了复杂的动态，这将允许我们指导对市场动态的解读和分析。\n\
  \n具体而言，我们需要执行以下步骤：\n\n1.  从其底层动态的角度刻画每个簇，揭示定义每个状态的独特模式和行为。\n2.  检查序列的时间顺序排列，寻求理解每种类型的序列相对于其他序列出现是否存在特定顺序。\n\
  3.  最后，我们将探索从该分析获得的见解是否可用于预测在最后观察到的序列（标记为“orange”，编号 16，簇“0”）之后可能发生的下一个序列类型。\n\n\
  让我们从第一步 12 开始，即从其底层动态的角度刻画每个簇。我们可以观察到以下事实：\n\n- **“橙色”区域（标记为“0”）**：这些片段通常代表铜价相对稳定或微小波动的时期。\n\
  - **“紫色”区域（标记为“1”）**：这些时期显示波动率增加或价格上涨的趋势。\n- **“绿色”区域（标记为“2”）**：这些片段的特征是显著波动，可能表明市场不确定性或修正阶段。\n\
  - **“蓝色”区域（标记为“3”）**：这些时期也显示出波动性并伴有明显峰值，可能暗示对外部市场影响或投机交易的反应性变动。这些时期也明显呈现下降趋势。\n\n\
  \n\n\n让我们现在来审视第二步，即序列的时间顺序排列。紫色区域（标记为“1”）和蓝色区域（标记为“3”）均显示出波动性，但其价格峰值和谷值的频率有所不同。紫色区域可能代表市场事件的酝酿期或趋势变化的预期期，而蓝色区域可能表明波动后的余波或稳定期。这种细化有助于不仅理解波动性的存在，还理解其潜在成因，且被认为代表稳定性的市场周期定位，偶尔可能预示着更剧烈的波动期（如过渡到紫色和绿色区域所示），暗示它们可能是重大市场波动前的宁静。\n\
  \n识别这些模式有助于预测未来趋势，并根据这些稳定期后的历史市场行为识别潜在的投资或交易机会。\n\n要回答最后一点，即基于观察到的模式预测簇序列中下一个可能的状态。我们首先需要分析不同簇之间的转换，并理解这些状态底层的市场动态。从分析中观察序列，似乎存在一种循环模式，即稳定期（橙色“0”区域）往往先于波动期（紫色“1”和绿色“2”区域）。此外，在经历显著波动（蓝色“3”和绿色“2”区域）后，会回归到更稳定或波动较小的时期（橙色“0”区域）。\n\
  \n我们可以将这些见解总结为以下状态序列：\n\n稳定性状态（橙色“0”区域）-> 波动性（紫色“1”或绿色“2”）-> 稳定性（橙色“0”）\n\nCPD 是一种强大的技术，用于发掘金融时间序列数据中的隐藏模式和异常。通过理解\
  \ CPD 的原理、方法和应用，您可以在市场中获得竞争优势，优化交易策略，并改进相关的风险管理实践。\n\n## 结论\n\n在本章结束时，我们获得了将无监督学习技术应用于金融数据并分析模式的实用技能，这些模式往往超出了传统数据科学的范畴。我们探索了\
  \ CPD，这是一种识别市场行为中状态转换的强大工具，涵盖了在线和离线方法，学会了将有意义的变化与噪音区分开来。\n\n除了检测之外，我们还应用了 UMAP 进行降维，将高维序列提炼为结构化表征，从而使\
  \ k-means 聚类能够将金融数据分割为不同的阶段。但我们走得更远：我们没有仅仅依赖标准的 CPD 技术，而是训练了一种架构，该架构集成了 CPD 检测、非线性映射和聚类，创建了一种讲故事的方法来捕捉市场动态。\n\
  \n这种结构化方法能够直观地理解金融序列，并通过分析整个市场走势而非孤立事件来帮助预测未来趋势。最终，我们开发了一套完整的数据驱动策略，它通过结合无监督学习和模式识别，超越了传统统计方法，以预判金融市场的演变。\n\
  \n在探索了聚类和 CPD 之后，我们现在转向无监督学习的另一个关键方面：模式匹配。金融市场充满了反复出现的结构，识别它们可以提供战略优势。\n\n在下一章中，我们将介绍距离矩阵和递归图，这是可视化和量化时间序列动态的重要工具。我们还将研究矩阵轮廓，这是一种在金融数据中发掘隐藏模式和检测异常的强大方法。这些技术将帮助我们远远超越静态聚类，迈向动态模式识别，增强我们识别、比较和利用市场行为的能力。\n\
