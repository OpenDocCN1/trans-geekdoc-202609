  \n##### Fundamental data\n\n基本面数据涉及特定公司及其财务表现的信息。这包括每股收益（EPS）、市盈率（P/E）、净资产收益率（ROE）、股息、营收增长以及无数其他因素。通过分析这些数据，交易者可以对公司的未来表现及其股价可能的走向做出明智的预测。\n\
  \n这些类型的数据与算法交易之间的关系至关重要。经济学家和传统投资者几十年来一直使用此类数据做出投资决策。然而，算法交易将其推向了新的高度，利用系统化方法挖掘这些数据中可能显现的模式和趋势。\n\
  \n经济和基本面数据可以通过多种方式访问和处理。许多金融数据提供商提供应用程序编程接口（API），允许交易者直接访问实时或历史数据。此类提供商的例子包括 Yahoo\
  \ Finance 和 Quandl，我们已经一起体验过。不过，其他数据服务仍通过其 API 提供基本面数据。\n\n##### Tiingo Fundamental\
