  \n### 第 3 章：优化交易系统、指标与自动化报告\n\n## 简介\n\n本章重点介绍如何优化交易系统以实现最大性能。通过利用 `Hyperopt` 等高级工具，交易者可以增强策略、尝试新方法，并发掘有价值的见解以改进模型。\n\
  \n指标的选择起着至关重要的作用，它指导交易者做出明智的决策。有效的风险管理和深思熟虑的指标选择对于全面评估模型和实现长期成功至关重要。\n\n此外，通过 Python\
  \ 库实现的自动化报告，能够高效地将交易数据转化为可执行的洞察。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 设计交易系统\n- 改进交易系统\n\
  - 选择交易系统指标\n- 自动化交易报告\n\n## 目标\n\n我们的主要重点在于设计和完善算法交易策略。我们的旅程始于选择一个分类器，该分类器负责熟练预测未来收益。\n\
  \n本章旨在通过利用分类器的能力、优化超参数以增强策略的稳健性、使用详细的风险和绩效指标分析策略表现，以及通过行业标准报告工具展示发现，为交易系统建立坚实的基础。\n\
  \n## 设计交易系统\n\n本章将重点关注针对未来 K 线进行分类的算法。我们的旅程将涵盖整个流程，从数据获取到最终报告一个经过学习和评估的模型，该模型以其绩效和风险指标为特征。\n\
  \n路线图包括以下内容：\n\n- 准备数据\n- 进行特征工程\n- 使用竞争性模型集合进行训练\n- 通过绩效和风险指标评估模型\n- 综合报告\n\n###\
  \ 准备数据\n\n关于分析数据的一句话。我们选择使用微软（`MSFT` 代码）的数据作为研究基础，数据以 5 天为间隔记录，总共积累了 5000 天。报价间隔\
  \ 5 天使我们能够探索周级别的时间跨度。数据源来自 Yahoo! Finance 库，我们已经多次使用过它。\n\n下图展示了这些数据：\n\n![](img/fig-3-1.png)\n\
  \n#### 进行特征工程\n\n在此过程中，我们按顺序执行两个关键操作：\n\n- `create_lag_past_values()`：此函数用前几个周期的滞后价格值扩充数据框。对于每一列价格（OHLC），都会添加一列包含这些滞后值的新列。这些新列的命名约定是在原始列名后附加一个表示滞后周期的后缀。例如，`_1`\
  \ 表示滞后一期，`_2` 表示滞后两期，以此类推 1。\n- `return_past_values()`：此函数将所有价格数据转换为连续收益率。对于每一列价格，都会引入一列对应的收益率。这些新列通过在原始列名后附加后缀\
  \ `_ret` 进行恰当命名。\n\n这两个操作结合在一起，融合了滞后值并计算收益率，构成了我们的特征工程步骤。这准备了我们的分析算法将用来预测未来收益率的模式。我们将在第\
  \ 6 章《利用特征提升模型能力》（Chapter 6）中更深入地了解这一关键阶段，该章节专门致力于特征工程。\n\n##### 特征相关性\n\n在算法交易领域，理解特征相关性至关重要。相关特征会向数据中引入冗余，导致过拟合，并降低模型的泛化能力。\n\
  \n当算法遇到反映相似信息的特征时，可能会赋予这些交织在一起的特征过高的重要性，从而扭曲结果。这对于线性模型（如线性回归）和基于树的算法（如决策树和随机森林）尤为重要，因为在这些模型中，相关特征可能导致特征重要性出现偏差或虚高。为了确保稳健性并保持模型预测能力的完整性，识别并消除高度相关的特征至关重要，从而精简输入并提高模型效率。\n\
  \n#### 检测并消除相关特征\n\n传统的皮尔逊相关系数仅能洞察线性关系，可能会遗漏非线性关联。此时引入斯皮尔曼等级相关系数，它能识别单调关系，以及互信息，它能捕捉线性和非线性依赖。这些替代指标至关重要，因为现实世界的金融数据通常表现出非线性行为。Scikit-learn\
  \ 提供了 `VarianceThreshold` 和 `SelectKBest` 等特征选择工具，以及用于可视化检查的 `correlation_matrix`。此外，`feature-engine`2\
  \ 等库还提供了处理相关变量的高级技术。采用这些策略并多样化相关性指标，可确保模型接收到最具信息量、非冗余的输入，从而优化其预测潜力。\n\n以下代码显示了在消除相关特征阶段之前的相关性矩阵：\n\
  \n```python\nimport seaborn as sns\n\n##### Calculate the correlation matrix for\
  \ the features\ncorrelation_matrix = df_lag.corr()\n\n##### Create a mask for the\
  \ upper triangle of the correlation matrix\nmask = np.triu(np.ones_like(correlation_matrix,\
  \ dtype=bool))\n\n##### Plot the correlation matrix\nplt.figure(figsize=(15, 10))\n\
  sns.heatmap(correlation_matrix, mask=mask, cmap='coolwarm', vmax=1, vmin=-1, center=0,\
  \ annot=False, fmt=\".2f\")\nplt.title('Correlation Matrix of Features')\nplt.show()\n\
  ```\n\n![](img/fig-3-2.png)\n\n相关性矩阵突出了数据集中特征间的关系，红色渐变表示强正相关。高度相关的特征（由红色区域指示）提供了冗余信息。这些高度相关的变量被移除以减少多重共线性，并提高模型的可解释性和效率。\n\
  \n让我们继续进行剪枝算法，该算法旨在消除相关性超过允许值（阈值 0.9）的特征：\n\n```python\n##### Identify features\
  \ that are highly correlated\nto_drop = []\n\nfor i in range(len(correlation_matrix.columns)):\n\
  \    for j in range(i):\n        if abs(correlation_matrix.iloc[i, j]) > 0.9:\n\
  \            colname = correlation_matrix.columns[i]\n            if colname not\
  \ in to_drop and not colname.endswith('_ret'):\n                to_drop.append(colname)\n\
  \n##### Drop the highly correlated features\ndf_lag.drop(columns=to_drop, inplace=True)\n\
  ```\n\n通过前文讨论的相关特征矩阵来检验剪枝效果。即使仍存在一些相关性痕迹，我们可以在下图中看到，剩余的相关性比之前观察到的要可接受得多：\n\n![](img/fig-3-3.png)\n\
  \n#### 缺失值与目标列\n\n借助 Pandas 这样现代且强大的库，处理缺失值变成了一项快速简便的例行工作。\n\n\n\n然后我们定义将要作为学习预测目标的列：\n\
  \n```python\n##### 提前 'lag_predict' 步进行预测\nlag_predict = 1\n\n##### 提前 'lag_predict'\
  \ 步进行预测\ndf_lag.dropna(inplace=True)\n\n##### 对次日收益进行分类 (shift = -1)：负收益 -> -1；正收益\
  \ -> +1\ndf_lag['target'] = np.where(df_lag['Close_ret'].shift(-lag_predict) >=\
  \ 0, 1, -1)\n```\n\n上一行代码可能是最重要的代码之一。它定义了我们要处理的问题类别（即分类问题，世界状态根据收益符号为 +1 或 -1），并指定了要学习预测的目标列（`target`）。\n\
  \n该列包含次日的收益（`shift(-1)` 函数），我们将利用当天的信息对其进行预测。这是经典的“单步向前”预测。\n\n### 数据集划分与缩放\n\n\
  我们将目标变量放入 `y`（输入）变量，其余特征放入 `X`（输出）变量：\n\n```python\nfrom sklearn.model_selection\
  \ import train_test_split\n\ny = df_lag.pop('target')\nX = df_lag.copy()\nX_train,\
  \ X_test, y_train, y_test = train_test_split(X, y, shuffle=False)\n```\n\n完成此步骤后，我们可以对数据进行重新缩放。对于不熟悉该概念的人来说，重新缩放可确保所有数据列处于一致的尺度上，从而简化算法的分析过程。特别是，详述交易量的列与通常仅变动几个百分点的收益列相比，其尺度可能差异巨大：\n\
  \n```python\nfrom sklearn.preprocessing import StandardScaler\n\nsclr = StandardScaler()\n\
  X_train_tr = sclr.fit_transform(X_train)\nX_test_tr = sclr.transform(X_test)\n```\n\
  \n我们现在准备好训练一个分类器来区分正收益和负收益。对于初始方法，我们选择易于训练的分类器，旨在将开发时间降至最低。我们的目标是获得一个或多个可供优化的优秀分类器。\n\
  \n在算法分类器领域，有几个算法作为基础支柱脱颖而出，每个都有其独特的优势和底层原理：\n\n*   **线性判别分析 (LDA)**：LDA 将数据点投影到一条线上，旨在最大化类别间的分离度。它稳健且常被使用。\n\
  *   **二次判别分析 (QDA)**：作为 LDA 的“兄弟算法”，QDA 允许类别间存在二次边界，当类别具有不同的协方差结构时，它提供了灵活性。\n* \
  \  **逻辑回归**：尽管名为“回归”，但它是一种分类算法。它对给定实例属于特定类别的概率进行建模，使其在二分类任务中特别有效。\n*   **决策树 (DT)**：顾名思义，DT\
  \ 通过提出一系列问题来做决策。它们直观、可视化，且能捕捉非线性关系。我们已在 第 2 章《数据源、回测与前向测试》中尝试过该算法。\n*   **随机森林 (RF)**：决策树的集成模型，RF\
  \ 汇总其输出。与单棵决策树相比，这通常能带来更高的准确性并减少过拟合。\n*   **朴素贝叶斯**：基于贝叶斯定理，它假设特征相互独立，使其在处理大型数据集时特别高效。\n\
  \n由于这些算法具有良好的可解释性、易于实现且历史表现有效，它们是极佳的起点。导入与算法定义代码如下：\n\n```python\nfrom sklearn.discriminant_analysis\
  \ import (LinearDiscriminantAnalysis as LDA, QuadraticDiscriminantAnalysis as QDA)\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn.linear_model import\
  \ LogisticRegression\nfrom sklearn.naive_bayes import GaussianNB\nfrom sklearn.ensemble\
  \ import RandomForestClassifier, VotingClassifier\n\nclf1 = LDA()\nclf2 = QDA()\n\
  clf3 = RandomForestClassifier()\nclf4 = GaussianNB()\nclf5 = LogisticRegression()\n\
  clf7 = DecisionTreeClassifier()\n\nlst_clf = [('lda', clf1), ('qda', clf2), ('nb',\
  \ clf4), ('lr', clf5), ('rf', clf3), ('dt', clf7)]\n```\n\n我们对列表 `lst_clf` 中的所有算法运行训练（`fit`）：\n\
  \n```python\nfor tpl in lst_clf:\n    clf_base = tpl[1]\n    clf_name = tpl[0]\n\
  \    clf_base.fit(X_train, y_train)\n    clf_sc = np.round(clf_base.score(X_test,\
  \ y_test), 2)\n    print(f\"classifier {clf_name} -> accuracy score = {clf_sc}\"\
  )\n```\n\n以下是在测试集上测得的所有算法的全局准确率得分（`clf_base.score`）：\n\n*   classifier lda -> accuracy\
  \ score = 0.51\n*   classifier qda -> accuracy score = 0.43\n*   classifier nb ->\
  \ accuracy score = 0.59\n*   classifier lr -> accuracy score = 0.49\n*   classifier\
  \ rf -> accuracy score = 0.55\n*   classifier dt -> accuracy score = 0.49\n\n#####\
  \ 特征选择\n\n在初步迭代之后，我们旨在通过特征选择来提高预测准确性。该阶段识别（排序变量）并仅保留最有影响力的特征（`k_best`）。在保守策略中，目标是用更少的特征实现相似的预测能力；而在更激进的策略中，则旨在利用精简后的特征集提升性能。\n\
  \n为何优先减少特征？精简的特征集简化了模型的任务，从而带来更高的准确性和更直接的后续实现。\n\n此选择基于决策树算法开发过程中计算出的得分（`clf_base.feature_importances_`）：\n\
  \n```python\nsorted = np.argsort(clf_base.feature_importances_)\nk_besk = int(40/100\
  \ * len(sorted))\nX_train.iloc[:, sorted[-k_besk:]].columns\ncolumns_to_drop = X_train.columns[sorted[:-k_besk]]\n\
  \n#### 仅保留 k_best 个特征\nX_train = X_train.drop(columns=columns_to_drop)\nX_test =\
  \ X_test.drop(columns=columns_to_drop)\n```\n\n以下是在测试集上使用选定的 `k_best` 特征测得的所有算法的全局准确率得分：\n\
  \n*   classifier lda -> accuracy score = 0.58\n*   classifier qda -> accuracy score\
  \ = 0.55\n*   classifier nb -> accuracy score = 0.56\n*   classifier lr -> accuracy\
  \ score = 0.58\n*   classifier rf -> accuracy score = 0.57\n*   classifier dt ->\
  \ accuracy score = 0.53\n\n这两个步骤的结果为特征选择在模型性能中的重要性提供了宝贵的见解：\n\n*   **使用所有特征时的初始表现：**\n\
  \    *   朴素贝叶斯 (NB) 以 0.59 的最高准确率脱颖而出，表明该模型的底层假设可能非常适合原始特征集。\n    *   LDA 和逻辑回归\
  \ (LR) 这两种线性分类器显示出约 0.50 的相似性能。\n    *   QDA 表现显著不佳，准确率仅为 0.43，暗示潜在的过拟合或数据不适合二次边界。\n\
  \    *   RF 表现尚可，准确率为 0.55，而其简化版 DT 得分为 0.49。\n*   **特征选择后的表现：**\n    *   所有分类器的准确率均有提升，凸显了选择相关特征的价值。\n\
  \    *   LDA 和 LR 显著跃升至 0.58，强化了降维有助于线性模型这一观点。考虑到两种算法都旨在线性分离数据（尽管方法论不同），它们性能相似并不令人惊讶。\n\
  \    *   QDA 也有显著改善，表明原本包含的某些特征可能引入了噪声。\n    *   RF 和 DT 都从特征选择中受益，RF 仍优于 DT，突显了集成方法的价值。\n\
  \    *   NB 尽管初始表现优异，但准确率略有下降。这可能是由于减少了模型最初认为有价值的某些特征。\n\n特征选择被证明至关重要。所有模型在仅保留前\
  \ 40% 的特征后性能均有提升，这证明了使用相关预测因子的重要性。\n\n## 改进交易系统\n\n\n\n\n### 通过自适应参数搜索提升模型性能\n\n\
  在之前的讨论中，我们涉及了使用 SKlearn 的 `GridSearchCV` 来锁定我们量化基本面策略中随机森林的最优超参数（见第 2 章，数据馈送、回测与前向测试）。我们强调了这一阶段在基于机器学习开发交易策略中的重要性。我们建议更进一步，探索自适应方法。\n\
  \n虽然 `GridSearchCV` 提供了对超参数组合的系统性探索，但它可能不是最高效或甚至不是最有效的解决方案。此时，`HyperOpt`3 登场了，这是一个专为超参数调优设计的更细致的工具。\n\
  \n`HyperOpt` 的真正优势在于其自适应搜索过程。它不再穷尽地搜索预定义的超参数列表，而是采用概率方法。它使用一种称为序列模型优化的技术。该方法利用概率模型\
  \ 4 对目标函数（在我们的案例中是模型的性能）进行建模，然后基于此模型选择新的超参数进行测试。其核心思想是聚焦于看似有前景的超参数区域，而不是随机分散或预定义的网格（如下图所示）：\n\
  \n![](img/fig-3-4.png)\n\n- **搜索方法的差异**：多项基准研究凸显了 `HyperOpt` 的高效性。一个关键观察是其收敛于最优超参数的速度比传统的网格搜索甚至随机搜索更快。虽然\
  \ `RandomSearch` 引入了随机性，可能有助于更多样化地探索超参数空间，但 `HyperOpt` 通过智能且自适应地导航该空间，带来了战略性的方法。本质上，`HyperOpt`\
  \ 提供了探索（尝试新的超参数区域）与利用（在找到的最佳超参数周围细化）的结合。这种由其底层概率模型指导的平衡，往往能在更少的迭代次数下带来比其他技术更准确的结果。\n\
  \n- **基于 HyperOpt 的搜索框架**：为了简化我们的方法，我们将在一个统一框架内同时评估所有算法。这种统一的方法不仅简化了代码库，还增强了其清晰度和可维护性。\n\
  \n该流程可归纳为以下步骤：\n\n1. 首先导入所需的库和方法。\n2. 构建需要优化的目标函数。该函数将接收一个分类器作为参数。我们的策略是遍历选定的分类器，逐个将它们传递给该函数。值得注意的是，我们正在最小化一个特定指标（有关召回率性能指标的深入讨论，请参阅第\
  \ 2 章，数据馈送、回测与前向测试），因此目标函数中带有负号。\n3. 使用 Python 字典勾勒搜索空间。此步骤提供了巨大的创作空间。可以选择局限于一组预定义值的受控搜索，也可以进行更广泛的探索。\n\
  4. 启动搜索过程。\n5. 汇总并展示结果。\n6. 最后，将这些最优超参数注入回分类器中。\n\n代码如下：\n\n#### 步骤 1：导入库\n\n```\n\
  from hyperopt import fmin, tpe, hp, STATUS_OK, Trials\nfrom sklearn.model_selection\
  \ import cross_val_score\n```\n\n#### 步骤 2：定义目标函数\n\n```\n##### 定义目标函数，接收分类器类型作为参数\n\
  def objective(params):\n    classifier_type = params['classifier']\n    if classifier_type\
  \ == 'lr':\n        clf = LogisticRegression(**params['lr'])\n    elif classifier_type\
  \ == 'dt':\n        clf = DecisionTreeClassifier(**params['dt'])\n    elif classifier_type\
  \ == 'rf':\n        clf = RandomForestClassifier(**params['rf'])\n    # 为其他分类器添加更多\
  \ elif 条件\n    score = -np.mean(cross_val_score(clf, X_train, y_train, cv=5, n_jobs=-1,\
  \ scoring='recall'))\n    return {'loss': score, 'status': STATUS_OK}\n```\n\n####\
  \ 步骤 3：定义搜索空间\n\n```\n##### 定义超参数的搜索空间\nspace = {\n    'classifier': hp.choice('classifier',\
  \ ['lr', 'rf', 'dt']),\n    'lr': {  # 逻辑回归的超参数\n        'penalty': hp.choice('penalty',\
  \ ['l2']),\n        'C': hp.loguniform('C', -5, 5),\n    },\n    'rf': {\n     \
  \   'n_estimators': hp.choice('n_estimators', range(100, 1000, 50))\n    },\n  \
  \  'dt': {'max_depth': hp.choice('max_depth', [5, 10])}\n    # 为不同分类器添加更多超参数\n}\n\
  ```\n\n与我们分析中的其他分类器不同，`LDA` 和 `QDA` 没有需要调优的超参数。\n\n#### 步骤 4：执行优化\n\n```\n#####\
  \ 创建一个 Trials 对象以跟踪优化过程\ntrials = Trials()\n##### 使用 fmin 运行优化\nbest = fmin(fn=objective,\
  \ space=space, algo=tpe.suggest, max_evals=5, trials=trials)\n```\n\n#### 步骤 5：报告结果\n\
  \n```\nfrom hyperopt import space_eval\nprint(best)  # 找到的最佳超参数\n```\n\n```\n100%|██████████|\
  \ 5/5 [00:25<00:00, 5.16s/trial, best loss: -0.6352158390133074]\n{'C': 20.908013685132712,\
  \ 'classifier': 1, 'max_depth': 0, 'n_estimators': 1, 'penalty': 0}\n```\n\n```\n\
  print(space_eval(space, best)['classifier'])\nprint(space_eval(space, best)['lr'])\n\
  print(space_eval(space, best)['lr']['C'])\nprint(space_eval(space, best)['rf'])\n\
  print(space_eval(space, best)['dt'])\n```\n\n```\nlr\n{'C': 109.96023525188563,\
  \ 'penalty': 'l2'}\n109.96023525188563\n{'n_estimators': 100}\n{'max_depth': 10}\n\
  ```\n\n#### 步骤 6：将最佳参数注入分类器\n\n```\n##### 将优化参数注入各分类器\nlst_clf_opt = []\nfor tpl\
  \ in lst_clf:\n    tpl0 = tpl[0]\n    tpl1 = tpl[1]\n    if tpl0 == 'rf':\n    \
  \    tpl1 = RandomForestClassifier(space_eval(space, best)['rf']['n_estimators'])\n\
  \    elif tpl0 == 'lr':\n        C = space_eval(space, best)['lr']['C']\n      \
  \  penalty = space_eval(space, best)['lr']['penalty']\n        tpl1 = LogisticRegression(C=C,\
  \ penalty=penalty)\n    elif tpl0 == 'dt':\n        m_depth = space_eval(space,\
  \ best)['dt']['max_depth']\n        tpl1 = DecisionTreeClassifier(max_depth=m_depth)\n\
  \    lst_clf_opt.append((tpl0, tpl1))\n```\n\n然后我们将合并这些模型以创建一个集成模型。\n\n## 集成建模\n\
  \n单个分类器无论调优得多精细，往往都有其局限性。它们各自提供独特的视角，但它们能否协作得更好？集成建模的理念类似于从独奏音乐家中组建一支交响乐团。虽然小提琴或小号独奏能奏出优美的乐章，但它们的合奏能提供更丰富、更和谐的体验。\n\
  \n前述代码片段体现了这一理念。它从优化单个分类器开始。我们探索了各种分类器（如 `RF`、`LR` 和 `DT`）的超参数，并确定了它们的最佳配置。这一优化过程确保了每个模型在纳入集成前都处于最佳性能状态。\n\
  \n一旦优化完成，这些分类器便通过 Scikit-Learn 的 `VotingClassifier` 融合成一个紧密的集成模型。此处的“投票”一词十分贴切；集成中的每个模型对结果各投一票，最终决策基于多数表决的民主原则。\n\
  \n集成方法 5，尤其是此处使用的硬投票技术，充分发挥了每个单独模型的优势，弥补了它们各自的弱点，往往能产生一个更稳健、更精准的预测系统。\n\n请注意，在以下代码中，使用\
  \ scikit-learn 实现此方法是多么容易；我们只需传入一个分类器列表（`lst_clf_opt`），其余一切由 API 自动处理：\n\n```\n\
  ### 混合算法：投票分类器\n```\n\n\n\n\n\n```python\nclf_blend = VotingClassifier(voting='hard',\
  \ estimators=lst_clf_opt)\n\nclf_blend.fit(X_train, y_train)\n\nclf_blend.score(X_test,\
  \ y_test)\n```\n\n我们现已完成第二阶段，即对每个预测器进行微调并协调其集体运作。让我们来看看以下结果：\n\n| | precision |\
  \ recall | f1-score | support |\n|---|---|---|---|---|\n| -1 | 0.44 | 0.15 | 0.22\
  \ | 103 |\n| 1 | 0.59 | 0.87 | 0.70 | 146 |\n| accuracy | | | 0.57 | 249 |\n| macro\
  \ avg | 0.52 | 0.51 | 0.46 | 249 |\n| weighted avg | 0.53 | 0.57 | 0.50 | 249 |\n\
  \n总之，精确率为 59% 对比 44%，模型在识别 1 类（正收益）方面表现远优于 -1 类（负收益），1 类的召回率高达 87%。然而，其对 -1 类的精确率有待提高。此外，我们的系统不会持续用新数据更新。考虑到我们正用一个基于四年前数据训练的系统来评估\
  \ 2023 年的数据。这种方法有助于衡量系统的韧性。\n\n##### 权益曲线\n\n要可视化策略的权益曲线，我们只需加入一些额外要素。具体而言，我们必须考虑经纪费用（通常每笔交易约\
  \ 3 个基点）以及多头和空头交易的收益：\n\n```python\n### broker fee in basis point\nfee = 3 / 100\
  \ / 100\n\nstop_loss = -4 / 100\n\ntarget_ret = df_lag.loc[y_test.index, 'Close_ret'].shift(-lag_predict)\n\
  \n### Calculate cumulative returns for long trades (+1 predictions)\nlong_returns\
  \ = np.where(pred_blend == 1, target_ret, 0)\n\n### apply stop loss\nlong_returns\
  \ = np.where(long_returns < stop_loss, stop_loss, long_returns)\n\ncumulative_long_returns\
  \ = np.cumsum(long_returns)\n\n### Calculate cumulative returns for short trades\
  \ (-1 predictions)\nshort_returns = np.where(pred_blend == -1, -target_ret, 0) \
  \ # We inverse the returns for short trades\n\n### apply stop loss\nshort_returns\
  \ = np.where(short_returns < stop_loss, stop_loss, short_returns)\n\ncumulative_short_returns\
  \ = np.cumsum(short_returns)\n\n### pay fee each time position change (detect with\
  \ np.diff)\nbrk_fee = np.where(np.diff(pred_blend) != 0, fee, 0)\n\n### adjust dimension\
  \ with pad (add one element (zero), at the beginning)\nbrk_fee = np.pad(brk_fee,\
  \ pad_width=(1, 0))\n```\n\n![](img/fig-3-5.png)\n\n该策略看起来非常有趣。绿线代表我们的策略，虚线代表买入持有（B&H）策略\
  \ 6。此外，我们可以轻松应用更保守的止损策略，以平滑此类低频策略（周频）不可避免的回撤。\n\n作为最终评估，我们实施了与微软日线股份相同的策略，结合了元策略\
  \ 7，正如第一章所详述。结果显示如下：\n\n采用堆叠分类器的机器学习策略，在时间线的很大一部分中似乎优于 B&H 策略。这表明 `ML` 模型成功捕捉并预测了价格走势。\n\
  \n![](img/fig-3-6.png)\n\n与 B&H 和 ML 策略相比，元策略显示出显著的超额表现。这表明元策略可能利用了额外信息，或采用了更动态的交易方法，使其能把握更多交易机会并更有效地管理风险。该策略脱颖而出，成为最有效的策略，表明在此背景下策略组合可带来卓越表现。\n\
  \n我们对所取得的成果感到满意。事实上，该策略从周频过渡到日频毫无困难。\n\n我们现在将利用现代风险管理的适当工具，对此进行严格检验。\n\n## 交易系统指标的选择\n\
  \n策略的成功不仅关乎更高的收益。它关乎理解所承担的风险、收益的持续性，以及共同描绘出全面绩效图景的各个其他侧面。\n\n本节探讨评估交易策略的本质，从年化收益等基础指标过渡到\
  \ `CAGR`、`VaR` 和 `Sharpe ratio` 等专业衡量标准。最后，你将掌握每个指标的意义、理想基准及其相互作用。\n\n### 策略评估指标的排序标准\n\
  \n交易策略评估要求系统性分析，以产生有价值的见解和有意义的比较。绩效指标涵盖从基本衡量到复杂的机构指标，各自服务于特定的分析需求。\n\n按类别理解以下指标，有助于投资者选择与其目标和风险偏好相匹配的评估方法：\n\
  \n- **基础**：提供策略绩效整体感知的指标，适合所有层级的投资者\n- **风险调整收益**：考量为实现收益所承担风险的指标。这能区分收益相同但风险截然不同的策略\n\
  - **回撤**：围绕理解损失幅度和持续时间的指标\n- **统计显著性**：评估策略绩效是否可能归因于运气的指标\n- **风险指标**：提供策略可能面临的尾部风险和极端事件洞察的指标\n\
  - **一致性与稳定性**：分析策略收益随时间变化的一致性和稳定性的指标\n- **专业**：机构投资者常用于深度分析和剖析策略绩效的高级指标\n\n### 评估交易策略的统计指标列表\n\
  \n以下统计指标代表了策略评估的关键量化工具，按复杂度和用途组织。每个指标揭示交易绩效的不同侧面，从基础指标开始，经风险调整衡量，终于机构级分析。\n\n- **基础统计**\n\
  \  - **总收益**：策略的总体收益\n  - **年化收益**：平均每年收益\n  - **波动率（标准差）**：收益的离散程度\n\n- **风险调整收益**\n\
  \  - **夏普比率**：每单位总风险所实现的收益\n  - **索提诺比率**：每单位下行风险所实现的收益\n  - **卡尔马比率**：年化收益与最大回撤之比\n\
  \n- **回撤**\n  - **最大回撤**：从峰值到谷值的最大跌幅\n  - **平均回撤**：所有回撤的平均值\n  - **回撤持续时间**：从回撤中恢复所需的时间长度\n\
  \n- **统计显著性**\n  - **T 统计量**：评估策略收益在统计上是否显著不同于零\n  - **P 值**：观测收益归因于偶然的概率\n\n- **风险指标**\n\
  \  - **风险价值**：在给定概率下不被超过的最大损失\n  - **条件风险价值**：给定损失超过 `VaR` 时的预期损失\n  - **偏度**：衡量收益分布的不对称性\n\
  \  - **峰度**：衡量尾部风险或极端收益\n\n- **一致性与稳定性**\n  - **胜率**：盈利交易的百分比\n  - **平均盈亏比**：盈利交易的平均利润与亏损交易的平均亏损之比\n\
  \  - **盈亏比**：总盈利与总亏损之比\n\n- **专业**\n  - **Omega 比率**：收益与下行风险之比\n  - **信息比率**：主动收益与主动风险之比\n\
  \  - **Beta 系数**：策略对市场波动的敏感度\n  - **Alpha 系数**：调整 Beta 后的超额收益\n  - **R 平方**：策略跟随市场的紧密程度\n\
  \  - **特雷诺比率**：超额收益与 Beta 之比\n  - **复合年增长率 (CAGR)**：提供恒定收益率的几何级数比率\n  - **下行标准差**：负收益的波动率\n\
  \  - **上行潜力**：衡量收益分布的上行空间\n\n\n\n\n\n## 风险管理指标与自动化交易报告\n\n### 风险管理指标\n\n#### 关键指标定义\n\
  \n- **活跃份额**：策略偏离基准的程度\n- **跟踪误差**：相对于基准的离散度\n- **杠杆**：用于为策略资产提供资金的债务金额\n\n####\
  \ 可接受的基准\n\n| 指标 | 基准 |\n|--------|-----------|\n| **总收益** | 为正较好，但取决于持续时间和承担的风险\
  \ |\n| **年化收益** | >10% 优，5%-10% 可接受，<5% 需复核 |\n| **波动率** | 取决于策略；通常越低越好 |\n| **夏普比率**\
  \ | >1.5 很好，1-1.5 好，<1 需复核 |\n| **索提诺、卡尔马比率** | >2 很好，1-2 好，<1 需复核 |\n| **最大回撤**\
  \ | <10% 很好，10%-20% 可接受，>20% 差 |\n| **T 统计量** | >2 表示统计显著性 |\n| **P 值** | <0.05\
  \ 表示统计显著性 |\n| **VaR, CVaR** | 越低越好 |\n| **偏度** | 接近 0 为正态；偏正为佳（偏负表示下行尾部风险） |\n\
  | **峰度** | <3 为佳；>3 表示肥尾 |\n| **胜率** | >60% 好，50%-60% 一般，<50% 差 |\n| **平均盈利与平均亏损比率**\
  \ | >2 很好，1-2 好，<1 差 |\n| **盈亏比** | >2 很好，1.5-2 好，<1.5 一般 |\n| **Omega、信息、特雷诺比率**\
  \ | 越高越好 |\n\n全面审视了风险管理指标后，我们现在将其付诸实践。通过计算我们系统的这些指标，可以确保进行彻底的评估。\n\n### 自动化交易报告\n\
  \n我们将利用以下库（按使用难度升序排列）来实现这一点：\n\n- **Ffn**：Python 金融函数库，提供了一种直观快捷的方法来可视化收益和统计指标。\n\
  - **Empyrical**：由 Quantopian 开发的通用金融风险指标，基于 `pyfolio` 构建，提供深度的风险、收益和分析指标。\n- **QuantStats**：量化投资组合分析库，提供一套全面的工具用于分析表现、可视化结果以及对比各类统计基准。\n\
  \n#### Python 金融函数库\n\n`ffn`[¹³⁶] 是一个包含许多实用函数的库，适用于从事量化金融工作的人员。它站在巨人的肩膀上（`Pandas`、`Numpy`、`Scipy`\
  \ 等），提供了大量工具，涵盖绩效衡量与评估、绘图以及常见数据转换。\n\n首先按如下方式安装并导入该库：\n\n```bash\n!pip install -q\
  \ ffn\n```\n\n```python\nimport ffn\n\n##### 从 Yahoo! Finance 下载价格数据。默认情况下，\n#####\
  \ 将使用调整后收盘价。\nsymbol = 'MSFT'\nprices = ffn.get(symbol, start='2010-01-01')\n```\n\
  \n然后按如下方式计算统计数据：\n\n```python\nstats = ffn.calc_stats(pd.Series(np.cumprod(1 + long_returns\
  \ - brk_fee), index=X_test.index))\nprint(stats.display())\n```\n\n该指令首先给出上一节所述的基本统计数据，从收益率到回撤：\n\
  \n```\nStats for None from 2018-10-11 00:00:00-04:00 - 2023-09-28 00:00:00-04:00\n\
  Annual risk-free rate considered: 0.00%\n\nSummary:\nTotal Return    Sharpe    CAGR\
  \      Max Drawdown\n--------------  --------  ------    ------------\n-       \
  \        2.28      59.89%    -14.65%\n\nAnnualized Returns:\nmtd     3m      6m\
  \       ytd      1y       3y       5y       10y      incep.\n------  -----   ------\
  \   ------   ------   ------   ------   -----    ------\n-5.07%  0.45%   24.40%\
  \   46.23%   62.54%   43.79%   59.89%   -        59.89%\n```\n\n接着是风险指标和详细回撤统计：\n\
  \n```\nPeriodic:\n          daily    monthly    yearly\n------    ------   --------\
  \   ------\nsharpe    2.28     2.44       1.65\nmean      49.40%   48.66%     59.46%\n\
  vol       21.68%   19.98%     36.11%\nskew      2.03     0.82       0.77\nkurt \
  \     12.43    1.62       1.66\nbest      14.19%   23.82%     115.00%\nworst   \
  \  -2.03%   -6.07%     15.96%\n\nDrawdowns:\nmax       avg      # days\n-------\
  \   ------   --------\n-14.65%   -1.93%   10.35\n```\n\n然后是一致性和稳定性：\n\n```\nMisc:\n\
  ---------------   -------\navg. up month     5.77%\navg. down month   -3.43%\nup\
  \ year %         100.00%\n12m up %          100.00%\n---------------   -------\n\
  ```\n\n以下回撤可视化图描绘了权益峰值以来的累计下跌，揭示了策略在不利时期的资本保全特征。回撤的时间分布和深度提供了关于风险敞口模式和恢复动态的关键洞察，这些可能无法仅从汇总绩效指标中显现。\n\
  \n```python\nax = stats.prices.to_drawdown_series().plot(grid=True, title='maxDrawDown')\n\
  ```\n\n![回撤可视化](img/fig-3-7.png)\n\n我们将使用上一节详述的基准深入分析这些指标。这一步对于确定我们的下一步行动至关重要。\n\
  \n#### 策略分析\n\n- **总收益**：正的 CAGR 表明收益为正。\n- **年化收益**：达到 59.89%，表现良好，远高于 >10% 的基准。\n\
  - **波动率**：该策略在日度基础上表现出 21.68% 的波动率，月度基础上为 19.98%。这属于中等水平，但通常越低越好。\n- **夏普比率**：2.28\
  \ 的数值表现良好，表明策略具有强劲的风险调整后收益。\n- **最大回撤**：为 -14.65%，属于可接受范围，但接近可接受范围的上限。这意味着策略在最差时期经历了从峰值到谷值\
  \ 14.65% 的下跌。\n- **偏度**：日度 2.03 和月度 0.82 的正偏度表明，策略获得大额正收益的概率高于获得大额负收益的概率。\n- **峰度**：数值高于\
  \ 3（日度 12.43 和月度 1.62）表明策略可能呈现肥尾分布或极端事件发生的可能性更高，预示着额外风险。\n- **回撤**：平均回撤为 -1.93%，持续\
  \ 10.35 天，表现相当不错。这意味着在达到新高之前，从峰值回落的平均幅度小于 2%。\n- **一致性与稳定性**：平均上涨月份为 5.77%，平均下跌月份为\
  \ -3.43%，显示出不错的一致性。100% 的上涨年份和 12 个月上涨百分比非常出色，表明策略多年来持续带来正收益。\n\n总之，该策略展现出强劲的风险调整后收益，具有较高的夏普比率和年化收益。虽然峰度和最大回撤存在一定风险，但持续为正的年度收益和较高的夏普比率表明该策略具有鲁棒性。\n\
  \n让我们继续了解下一个库。\n\n#### 通用金融风险指标库\n\n`Empyrical`[¹³⁵] 由 Quantopian 开发，基于 `Pyfolio`\
  \ 构建，提供深度的风险、收益和分析指标。\n\n照常按如下方式安装并导入：\n\n```bash\n!pip install -q empyrical\n```\n\
  \n然后按如下方式计算各项统计数据：\n\n```python\nfrom empyrical import max_drawdown, annual_return,\
  \ sharpe_ratio, sortino_ratio\n\n##### 计算最大回撤\nmax_drawdown(long_returns - brk_fee)\n\
  ##### -0.1428624776295528\n\ndrawdown = max_drawdown(long_returns - brk_fee)\nann_return\
  \ = annual_return(long_returns - brk_fee)\nsharpe = sharpe_ratio(long_returns -\
  \ brk_fee)\nsortino = sortino_ratio(long_returns - brk_fee)\n\nprint(f\"Maximum\
  \ Drawdown: {drawdown:.2%}\")\nprint(f\"Annual Return: {ann_return:.2%}\")\nprint(f\"\
  Sharpe Ratio: {sharpe:.2f}\")\nprint(f\"Sortino Ratio: {sortino:.2f}\")\n```\n\n\
  ```\nMaximum Drawdown: -14.65%\nAnnual Return: 59.96%\nSharpe Ratio: 2.28\nSortino\
  \ Ratio: 4.52\n```\n\n与前一个库一样，易用性方面没有特别的困难。我们对风险管理库的探索最后一个库也将是这种情况。\n\n#### QuantStat\
  \ 分析库\n\n\n\n\n\n##### QuantStats\n\n[QuantStats[10]](#chap03.xhtml#footnote-134)\
  \ 是一个 Python 库，用于执行投资组合画像分析，通过提供深度分析和风险指标，帮助量化分析师和投资组合经理更好地了解其表现。该库构建在 `pandas`\
  \ 和 `numpy` 等行业标准库之上，利用机构级指标简化了交易后分析。它是性能分析的“瑞士军刀”，消除了对多个分散工具的需求。\n\nQuantStats\
  \ 由 3 个主要模块组成：\n\n*   `quantstats.stats` 用于计算各种性能指标，如夏普比率、胜率、波动率等。\n*   `quantstats.plots`\
  \ 用于可视化表现、回撤、滚动统计、月度收益等。\n*   `quantstats.reports` 用于生成指标报告、批量绘图，并创建可保存为 HTML 文件的\
  \ tear sheet（摘要报告）。\n\n```python\n!pip install -q quantstats\n\nimport quantstats\
  \ as qs\n\n##### Input : Pandas Series with an equity curve compounded\nserie_long_trades\
  \ = pd.Series(np.cumprod(1 + long_returns - brk_fee), index=X_test.index)\n\nserie_long_trades.head(3)\n\
  \nserie_long_trades.index = serie_long_trades.index.tz_convert('America/New_York')\n\
  ```\n\n##### quantstats.stats\n\n该计算引擎可计算 70 多项基本指标，涵盖从基础比率到复杂的风险调整衡量标准。该模块在内部处理时间序列操作，仅需您的原始收益作为输入，如下所示：\n\
  \n```python\nprint('sharpe : ', qs.stats.sharpe(serie_long_trades))\nprint('sortino\
  \ : ', qs.stats.sortino(serie_long_trades))\nprint('mdd : ', qs.stats.max_drawdown(serie_long_trades))\n\
  ```\n\n```text\nsharpe : 2.2766106559178523\nsortino : 4.521295932898164\nmdd :\
  \ -1.0\n```\n\n##### Quantstats.plots\n\n该模块生成出版级可视化图表，重点关注关键性能方面和风险指标。每个图表均设计用于即时模式识别，这对于策略比较和风险监控特别有用，如下所示：\n\
  \n```python\nimport warnings\nimport logging\n\n##### ignore matplotlib warnings\
  \ (concerning fonts)\nwarnings.simplefilter(action='ignore', category=FutureWarning)\n\
  warnings.simplefilter(action='ignore', category=UserWarning)\nlogging.getLogger('matplotlib.font_manager').disabled\
  \ = True\n\nqs.plots.snapshot(serie_long_trades, benchmark=symbol, title='Machine\
  \ Learning Strategy', show=True)\n```\n\n![](img/fig-3-8.png)\n\n高收益源于该工具采用的复利机制。\n\
  \n我们将最好的留在最后。如果您不熟悉 QuantStats，我们建议您尝试运行此命令。报告（HTML 文件）非常丰富详尽。总而言之，这三个风险管理库为我们提供了免费访问专业工具的机会。\n\
  \n##### Quantstats.reports\n\n该模块自动生成专业的 tear sheet（摘要报告），类似于对冲基金使用的报告，将指标和图表相结合。HTML\
  \ 输出便于与利益相关者共享，同时保持交互性。\n\n```python\nqs.reports.html(serie_long_trades, output=symbol\
  \ + '-rapport.html')\n```\n\n然后您需要浏览硬盘，在笔记本所在位置找到 HTML 文件。下图是该文件的一个片段：\n\n![](img/fig-3-9.png)\n\
