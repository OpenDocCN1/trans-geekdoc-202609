  \ 和 `Ford Motor Company` 等公司彼此靠近，反映了它们在汽车领域的共同关注点，其他公司以此类推。\n\n这种可视化为交易员和经济学家提供了一个独特视角，基于从网页中提取和计算的底层特征对公司进行聚类。它可用于识别传统金融分析无法触及的板块和公司群体。这些要素可为投资组合多元化策略提供参考。\n\
  \n现在我们已将文章转换为数值向量（嵌入），我们可以灵活地对该数据执行各种计算。具体而言，由于这些向量代表了每家公司的本质，我们将在下一节对它们应用算术运算，包括比较和相似度测量，为基于这些测量的即将到来的投资组合构建做准备。\n\
  \n## 构建相似度矩阵\n\n我们构建公司间的相似度矩阵。它使我们能够根据其网页内容量化不同文章（从而也是不同公司）之间的关联程度。\n\n\n\n### 相似性矩阵与聚类分析\n\
  \n在进行此计算之前，我们通过一个包含四个元素的简单示例（car、cat、dog 和 flower）来说明相似性矩阵的概念。这些术语中的每一个都由其各自的词嵌入表示（下图左侧），然后我们直接基于这些嵌入使用余弦相似度方法计算相似性矩阵（下图右侧）。如果两个向量（代表单词、句子或公司）指向同一方向，则它们非常相似（余弦相似度接近\
  \ 1）。如果它们指向相反方向，则它们完全不同（余弦相似度 = -1）。简单来说，它检查两个事物在含义上对齐的程度，而不仅仅是比较原始数字。\n\n下图展示了词向量如何与相似度分数相关联，以及向量空间中的语义距离与相似度分数之间的反比关系\
  \ 11：\n\n![](img/fig-11-5.png)\n\n我们可以看到，dog 和 cat 共享许多共同概念（宠物、哺乳动物分类等），因此具有非常高的相似度分数（0.98）。另一方面，car\
  \ 和 flower 没有任何共同点，因此其分数（-0.35）反映了这种语义距离。\n\n基于余弦距离的相似性矩阵具有巨大优势，如衡量资产间语义相似性的能力。它比协方差矩阵（广泛用于投资组合构建）对异常值的敏感度更低。它能捕捉非线性关系，且比相关系数随时间更稳定。\n\
  \n现在让我们考虑将其应用于标普 500 公司。计算公司间相似性矩阵的过程以相同方式重复。我们从将每个公司表示为向量（公司嵌入）开始。然后，我们使用余弦相似度公式相互比较这些向量，以衡量它们的相似程度。结果是一个对称矩阵，其中每个单元格显示两个项目之间的相似度分数，表明它们基于向量表示的关联程度。\n\
  \n我们不手动执行这些计算；而是使用高级库 `Scikit-learn` 来处理相似度计算，如余弦距离。\n\n在以下代码中，`cosine_similarity`\
  \ 函数以嵌入（`df_embeddings`）作为输入并输出相似性矩阵：\n\n```python\nfrom sklearn.metrics.pairwise\
  \ import cosine_similarity\n\ncosine_sim_matrix = cosine_similarity(df_embeddings.T)\n\
  \ndf_cos_sim = pd.DataFrame(cosine_sim_matrix,\n                          index=df_embeddings.columns,\n\
  \                          columns=df_embeddings.columns)\n\ndf_cos_sim.iloc[:6,\
  \ :6]\n```\n\n它输出相似性矩阵的摘录（前六个元素）：\n\n| | | 3M | Accenture | AMD | American_Airlines\
  \ | Apple | AT&T |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 3M | |\
  \ 1.000000 | 0.911221 | 0.754084 | 0.854462 | 0.900515 | 0.882236 |\n| Accenture\
  \ | | 0.911221 | 1.000000 | 0.728500 | 0.893048 | 0.902334 | 0.919001 |\n| AMD |\
  \ | 0.754084 | 0.728500 | 1.000000 | 0.654434 | 0.842097 | 0.713088 |\n| American_Airlines_Group\
  \ | | 0.854462 | 0.893048 | 0.654434 | 1.000000 | 0.831370 | 0.898130 |\n| Apple_Inc.\
  \ | | 0.900515 | 0.902334 | 0.842097 | 0.831370 | 1.000000 | 0.880814 |\n| AT&T\
  \ | | 0.882236 | 0.919001 | 0.713088 | 0.898130 | 0.880814 | 1.000000 |\n\n**表 11.5：相似性矩阵**\n\
  \n以下代码给出了基于余弦相似度与 AMD 最相似的顶级公司：\n\n```python\n#### pick a label\nlbl = df_cos_sim.columns[2]\n\
  print('similarities for: ', lbl)\ndf_cos_sim.loc[lbl].sort_values(ascending=False)[1:5]\n\
  ```\n\n前面的代码给出以下输出：\n\n```\nsimilarities for: AMD\nIntel                   0.947384\n\
  Nvidia                  0.941569\nTexas_Instruments       0.850835\nApple_Inc. \
  \             0.842249\n```\n\nIntel 和 Nvidia 最接近，表明它们的文本嵌入与 AMD 具有显著相似性，其次是 Texas\
  \ Instruments 和 Apple。这些公司是半导体行业的主要参与者，这解释了高相似度分数。相似性矩阵正确地表明，它们的业务描述、市场角色和技术重点密切相关。这似乎是绘制公司关系图谱和识别行业格局中集群的有效工具。\n\
  \n为了验证余弦相似性矩阵的有效性，我们检查 Goldman Sachs 的格局以查找任何异常：\n\n```python\nlbl = 'Goldman_Sachs'\n\
  print(lbl)\npprint(df_cos_sim.loc[lbl].sort_values(ascending=False)[1:5])\n```\n\
  \n上述代码的输出如下：\n\n```\nGoldman_Sachs\nCitigroup               0.981535\nMorgan_Stanley\
  \          0.969291\nBerkshire_Hathaway      0.927531\nAccenture               0.921569\n\
  ```\n\n结果显示与 Citigroup、Morgan Stanley 和 Berkshire Hathaway 高度相似，这些都是主要金融机构。Accenture\
  \ 也显示出强相似性，可能是由于其在金融咨询中的重大参与，表明相似性矩阵准确捕捉了金融部门内的关系。\n\n相似性矩阵是识别个别公司间邻近性的宝贵工具。然而，为了更有效地可视化\
  \ 30 家精选标普 500 公司之间的关系，我们可以使用更强大的工具：聚类热图和树图。\n\n### 构建聚类热图\n\n聚类热图不仅可视化相似性，还为整个格局增加了结构化视角。它根据公司的邻近性自动对所有公司进行排序，创建层次聚类，揭示公司间的潜在结构和关系，使识别具有相似特征的板块和群体变得更容易。源自维基百科页面的聚类热图和树图（见下一节“构建树图”）灵感来自\
  \ Gautier Marti 的优秀博客文章，地址为：https://gmarti.gitlab.io/quant/2023/05/07/wikipedia-network-companies-sentence-transformers.html。\n\
  \n此代码输出聚类热图：\n\n```python\nimport seaborn as sns\n\nsns.clustermap(df_cos_sim)\n\
  ```\n\n与相似性矩阵不同，聚类热图根据公司的相似性对其进行排名，并将它们组织成层次聚类，正如我们在下图中所见：\n\n![](img/fig-11-6.png)\n\
  \n颜色渐变表示不同程度的相似性，关系密切的公司形成鲜明的聚类。\n\n具体而言，例如在前图中，Goldman Sachs 和 Morgan Stanley 在聚类热图中定位非常接近，反映了它们的强相似性。两家公司都在投资银行和金融服务行业运营，它们在聚类热图上的邻近性表明，描述其活动的页面讨论了重叠的主题，如金融市场、投资策略和全球经济影响。\n\
  \n在层次结构中向上移动一级，Goldman Sachs 和 Morgan Stanley 与 Citigroup 和 Berkshire Hathaway 形成聚类。这种分组是合乎逻辑的，因为这些公司也是金融部门的关键参与者。Citigroup\
  \ 凭借其广泛的全球银行业务，以及 Berkshire Hathaway 凭借其重大的金融投资，在对金融市场和全球经济的影响方面与 Goldman Sachs\
  \ 和 Morgan Stanley 共享共同主题。\n\n在下一个层次级别，这个金融集群与 IBM 和 Accenture 合并，这两家公司分别以其在技术和咨询服务中的参与而闻名。这种联系在于它们共同专注于提供高级业务和金融解决方案。该集群扩展以纳入为金融部门提供基本服务和解决方案的公司。\n\
  \n#### 通过相似性分析发掘隐藏联系\n\n\n\n\n##### 基于文本嵌入的金融分析\n\n在金融分析中，公司通常根据传统分类（如行业板块或收入来源）进行分组。然而，基于文本的嵌入和相似性分析使我们能够发掘超越简单行业标签的关系。通过分析不同来源中对公司的描述，我们可以根据市场定位、品牌影响力、商业策略和客户参与度等共同主题，发现意想不到的联系。\n\
  \n这种方法在投资组合构建中尤为宝贵，因为理解公司间隐藏的相似性有助于风险分散、因子投资和替代聚类方法。我们不再仅仅依赖预定义的行业类别，而是可以利用数据驱动的关系来构建投资策略。\n\
  \n###### 示例：航空公司与消费品牌的联系\n\n以下示例演示了这一概念的实际应用。通过检查公司嵌入的聚类图，我们可以看到看似无关的公司如何根据文本来源中的描述共享有意义的特征。\n\
  \n我们现在将以美国航空和联合航空为例，说明嵌入和相似性分析如何发掘不那么明显的联系：\n\n![](img/fig-11-7.png)\n\n正如我们在前面的聚类图放大视图中所见，这两家航空公司（美国航空和联合航空）在聚类图中位置非常接近，反映了它们共同的行业和商业模式。然而，当我们向上移动层级时，它们却与星巴克、百事公司和可口可乐公司聚在一起。乍一看这可能令人惊讶，但它凸显了这些公司尽管处于不同行业，却共享全球品牌影响力、客户服务和消费者参与度等共同主题。\n\
  \n随着我们进一步向上移动层级，聚类范围扩大，纳入了耐克和万豪国际等其他主要消费品牌。这种更广泛的分组表明，虽然美国航空和联合航空是航空公司，但其市场策略和全球运营的描述方式，与面向消费者的公司的描述方式有显著重叠。\n\
  \n该例证表明，先进的机器学习算法（公司嵌入结合相似性分析）能够揭示意想不到的联系，发掘传统分析无法察觉且超越显而易见的行业联系的隐藏关系。\n\n### 构建树图\n\
  \n在考察了相似性矩阵和聚类图提供的信息后，我们现在可以关注另一个有效工具：源自距离矩阵的树图结构。\n\n与指示实体间亲疏程度的相似性矩阵不同，`距离矩阵`\
  \ 强调差异，使我们能够构建一种树结构，以直观地展示公司间的相对距离。这种方法提供了数据集内关系的另一种视角，基于文本数据揭示公司彼此间的相对定位。\n\n在以下代码中，我们使用\
  \ `NetworkX` 库将输入数据（`distance_matrix`）处理成预期的树结构：\n\n```python\nimport networkx as\
  \ nx\n\ndistance_matrix = 1 - df_cos_sim\n\ngraph = nx.from_numpy_array(distance_matrix.values)\n\
  \n#### 计算最小生成树\nmst = nx.minimum_spanning_tree(graph)\n```\n\n`NetworkX` 还提供了用于可视化树图的必要工具（`nx.draw`）：\n\
  \n![](img/fig-11-8-spanning-tree-V3-0.png)\n\n该树图基于源自`距离矩阵`的差异性，直观地展示了公司间的关系。公司间的每条连接（边）显示了它们之间的距离。这种结构告知我们公司间最重要的连接和路径，基于从其网络文章中提取的文本数据，提供了一个清晰且层级分明的视图，展示了这些实体在更广泛背景下是如何关联的。\n\
  \n我们使用的是`最小生成树`（MST）图。它以最小的总边权重连接所有节点（在本例中为公司），确保无环路且仅突出显示最关键的连接。MST 在显示树图方面的实用性在于，它通过聚焦于最重要的关系，简化了高度复杂的网络，减少了完全连接图中因不太重要的连接而产生的视觉混乱。这使得识别数据中的关键聚类和路径变得更加容易，提供了整体结构的简洁视图。\n\
  \n我们将探讨数据结构（公司嵌入、相似性矩阵和树图）如何被用于构建一个最优分散的投资组合——完全基于从网页中提取的文本洞察。这种方法展示了机器学习如何在不依赖传统数值价格数据的情况下，提取有意义的金融信号。\n\
  \n### 投资组合构建\n\n投资组合方法比专注于单笔交易更有趣，因为它允许跨一组多样化资产管理风险和收益，优化整体表现，而非依赖单一头寸的成败。通过跨不同资产类别和行业进行分散投资，投资组合构建降低了任何单一资产表现不佳对整体组合的影响。我们将在下一节探讨该技术的一个示例，其中采用优化算法等方法来构建投资组合。\n\
  \n#### 基于相似性矩阵配置的优势\n\n利用相似性矩阵进行投资组合构建，能够识别相关性较低的资产，促进分散投资，帮助在最大化潜在收益的同时最小化风险。此外，基于相似性矩阵的投资组合选择根据语义关系识别真正多元化的资产；它发掘非显而易见的分散化机会，并能更快适应不断变化的市场条件。其相较于传统\
  \ `Markowitz` 优化的优势在于，它能够纳入我们无法通过其他方式获取的定性信息（新闻、报告或情绪）。它比历史收益更具前瞻性，可能对市场机制变化更具鲁棒性，并能识别相关性分析遗漏的分散化机会。\n\
  \n##### 通过差异性排序最大化资产多样性\n\n我们编写一个函数（`select_and_rank_dissimilar_pairs`），根据资产对的差异程度对其进行识别和排序。通过突出显示差异最大的资产对，它通过聚焦于真正独特的资产，实现了针对性的投资组合构建。`select_and_rank_dissimilar_pairs`\
  \ 函数的关键在于，为每家公司找到与其最不相似的另一家公司（使用 `NumPy` 的 `argmin` 函数），代码如下：\n\n```python\nmin_indices\
  \ = np.argmin(similarity_matrix, axis=1)\n```\n\n随后，以相似性矩阵为输入执行该函数，生成一份差异最大的公司列表：\n\
  \n```python\ntop_n_pair = 3\nlst_dissim = select_and_rank_dissimilar_pairs(df_cos_sim.values,\
  \ df_cos_sim.columns, top_n_pair)\nprint(lst_dissim)\n```\n\n完整代码返回一组彼此差异最大的多元化股票代码对：\n\
  \n```text\n['MAR', 'YUM', 'MS', 'AMD']\n```\n\n以下是给定股票代码对应的公司：\n\n- `MAR`：万豪国际\n\
  - `YUM`：百胜餐饮集团\n- `MS`：摩根士丹利\n- `AMD`：超威半导体\n\n我们利用树图评估这些公司是否存在差异，方法是判断它们的位置是否彼此足够遥远。我们在下图中高亮显示了它们的位置：\n\
  \n![](img/fig-11-9-spanning-tree-V3-1.png)\n\n\n\n\n在最小生成树（MST）结构中，被识别为最不相似的公司彼此间距离较远，突显了它们缺乏相似性。这表明基于图的方法能够有效凸显公司间的结构性差异，而不局限于传统的行业分类。\n\
  \n展望未来，我们可以设想这些技术将有更广泛的应用，即投资组合选择可直接从图中进行，利用公司嵌入中编码的关系。这将提供一种数据驱动的多元化策略，自动识别相似度最低的公司，以优化风险分散。\n\
  \n完成上述检查后，使用所选不相似资产的归一化历史价格 15 来计算投资组合随时间的价值变化，并为投资组合中的每项资产分配等权重，如下所示：\n\n```python\n\
  ###### portfolio with most dissimilar assets\n\nnormalized_data = data[lst_dissim]\
  \ / data[lst_dissim].iloc[0]\n\nportfolio_dissim = np.sum(normalized_data * np.ones(len(lst_dissim))\
  \ * 1/len(lst_dissim), axis=1)\n```\n\n该代码通过归一化所选最不相似资产的历史价格并为每项资产分配相等的权重，构建了一个等权重投资组合。现在，我们将其表现与更广泛的等权重投资组合进行比较，以评估该选择策略的影响。\n\
  \n##### 与等权重投资组合的比较\n\n接下来，我们展示投资组合随时间变化的价值及其自然基准——即由我们从一开始就分析的三十家标普 500 成分股组成的等权重投资组合：\n\
  \n![](img/fig-11-10-most-dissim-5-comp.png)\n\n图表显示，由最不相似公司构建的投资组合（红线）随时间推移表现优于等权重标普\
  \ 500 投资组合（黑线），尤其是在市场强势时期。然而，它也经历了更高的波动率，反映了其高度集中于高度不相关资产的特性。为进一步优化该策略，实施止损机制有助于在下跌期间控制风险，而将投资组合扩展至最初的四家公司之外则可改善多元化程度，在保持持有不相似资产优势的同时，潜在地带来更稳定的收益。\n\
  \n虽然识别四个不相似资产提供了一种简单的多元化方法，但它可能无法完全捕捉整个资产宇宙内的复杂关系。为解决这一问题，我们现在将把相似度矩阵的用法扩展到一种更复杂的方法中。\n\
  \n#### 分层风险平价配置\n\nHRP（分层风险平价）是一种近期出现的、复杂且创新的投资组合优化技术，它解决了部分基于传统协方差矩阵方法的局限性。与严重依赖预期收益且对估计误差敏感的传统方法不同，HRP\
  \ 主要关注投资组合的风险结构。它利用分层聚类根据资产的相似性对其进行分组，创建一个树状结构来表示不同投资之间的关系。这种分层方法使 HRP 能够同时考虑单个资产的风险以及不同资产簇之间的风险关系。通过配置风险而非资本，HRP\
  \ 旨在创建对估计误差和市场变化具有鲁棒性的、充分多元化的投资组合。\n\n从机器学习的角度来看，HRP 本质上是一种应用于投资组合优化的无监督机器学习方法。\n\
  \n##### HRP 作为一种无监督算法\n\nHRP16 不依赖预定义的标签或目标结果，而是从数据中发现内在的风险结构。通过使用分层聚类这一无监督技术，HRP\
  \ 根据资产的相似性自主对资产进行分组，从而在无需显式收益预测或预定义资产分类的情况下，发掘投资组合中的多层次关系。\n\n在本节中，我们将探讨 HRP 如何与聚类热图可视化相契合，揭示用于投资组合优化的底层结构。\n\
  \n##### 将 HRP 与聚类热图关联\n\n聚类热图可视化类似于 HRP；两种方法均基于相似性对资产进行分组。正如我们在“构建聚类热图”部分所见，聚类热图将资产分入可用树状结构展示的簇中。这展示了资产间的分层关系，有助于识别多元化机会并降低投资组合构建中的集中风险。\n\
  \nHRP 利用此结构来分配投资组合权重。这确保了同一簇内的资产不会主导投资组合，从而改善了多元化效果。HRP 用于确定簇和分配权重的过程，类似于聚类热图中簇的形成与展示方式。\n\
  \n##### 构建 HRP 投资组合\n\n我们将使用一个名为 Riskfolio-Lib17 的现代分析工具库来构建 HRP 投资组合。它处理复杂的计算，使任何量化交易员无需深入了解底层数学原理即可从中受益。\n\
  \n首先安装并导入所需的库：\n\n```bash\n!pip3 install -q riskfolio-lib\n```\n\n```python\nimport\
  \ riskfolio as rp\n```\n\n然后，基于分层聚类构建并优化投资组合。使用相似度数据（`df_cos_sim`）初始化分层聚类投资组合，并设置为最优投资组合：\n\
  \n```python\nport = rp.HCPortfolio(returns=df_cos_sim)\n```\n\n上述代码运行优化过程并输出期望的最优权重（`w`）：\n\
  \n```python\nw = port.optimization(model=model,\n                      codependence=codependence,\n\
  \                      rm=rm,\n                      rf=rf,\n                  \
  \    linkage=linkage,\n                      max_k=max_k,\n                    \
  \  leaf_order=leaf_order)\n```\n\nRiskFolio-Lib 还支持可视化工具，并在计算分配权重时将其披露：\n\n![](img/fig-11-11.png)\n\
  \n投资组合分布在不同板块，使其面向经济的不同领域：\n\n*   **科技**：甲骨文、英伟达和超威半导体代表科技板块。该板块展现出高潜在收益，但伴随波动性。\n\
  *   **可选消费**：星巴克反映消费支出趋势。该板块对经济周期敏感。\n*   **日常消费**：可口可乐以其稳定性和无论经济状况如何均保持的稳定需求而闻名。它为投资组合增加了防御性属性。\n\
  *   **能源**：哈里伯顿（能源板块主要参与者），提供了对全球能源价格（石油和天然气）及地缘政治因素的敞口。\n*   **金融**：花旗、高盛、伯克希尔哈撒韦和摩根士丹利代表金融板块。该板块的表现与利率和经济增长密切相关。\n\
  \n我们在 MST 图中高亮显示所选资产，如下所示：\n\n![](img/fig-11-12-spanning-tree-V3-2.png)\n\n正如我们所见，所选资产分布在\
  \ MST 的远端分支上，确认了基于其文本衍生嵌入，它们在结构上是不相似的。这强化了这样一个观点：投资组合多元化可以直接从图中实现，而无需依赖传统的板块标签。科技股聚集在一起，而金融股形成独立的群体，反映了它们共同的行业特征。星巴克和可口可乐虽属不同行业，但因全球品牌建设和消费者参与等共同主题而位置较近。哈里伯顿则独树一帜，凸显了其在能源板块的独特角色。\n\
  \nMST 结构直观地确认了投资组合由网络中相距甚远的资产组成，确保了低相似性和强多元化。这展示了机器学习和文本嵌入如何通过识别传统指标之外的关系，直接指导资产选择。\n\
  \n\n\n在下图中，我们将 HRP 投资组合与等权重投资组合进行对比，明确目标是超越中性的等权重方法：\n\n![](img/fig-11-13-hrp-portfolio-10-companies.png)\n\
  \n图表显示，在观察期内，HRP 投资组合显著优于等权重投资组合。HRP 投资组合在市场上涨期间表现出更高的增长，反映了利用文本数据进行投资组合构建的有效性。这种表现表明，与中性等权重方法相比，这是一种更有利可图的投资策略。\n\
  \n##### 基于夏普指标的权重分配\n\n我们仅基于从互联网页面的文本分析（公司嵌入和距离）中提取的相似性矩阵构建了 HRP 投资组合，使投资组合直接与这些页面的底层内容相关联。将这种基于\
  \ NLP 的投资组合与以资产收益为中心的传统金融方法进行比较将非常有价值。\n\n为此，我们在训练阶段后构建了一个旨在最大化下一期夏普比率的投资组合，模型在该阶段识别出实现这一目标的表现最佳资产，具体步骤如下：\n\
  \n1. 算法训练约四年（2020 年至 2023 年底）。它代表数据集的 80%（`data`）：\n\n   `idx_train = int(80/100\
  \ * data.shape[0])`\n\n2. 我们计算该时期的收益率（`ret`），以便在后续步骤中输入优化算法：\n\n   `ret = data.iloc[:idx_train].pct_change().fillna(0)`\n\
  \n   `print(f'Training end @ {data.iloc[idx_train].name}')`\n\n3. 代码输出如下：\n\n  \
  \ Training end @ 2023-11-10 00:00:00\n\n4. 设置投资组合目标，即最小化风险（方差）并最大化夏普比率：\n\n   ```python\n\
  \   # Building the portfolio object\n   port = rp.Portfolio(returns = ret)\n   rf\
  \ = 0  # Risk free rate\n   port.rf = rf\n\n   # Calculate expected returns and\
  \ covariance\n   port.assets_stats(method_mu='hist', method_cov='hist')\n\n   #\
  \ Set up optimization parameters\n   #'MV' # Minimum Variance and max sharpe ratio:\n\
  \   port.rm = 'MV'\n   port.obj = 'Sharpe'\n   ```\n\n5. 运行优化并创建条形图（权重最大的六个资产）：\n\
  \n   `w_sharpe = port.optimization(model='Classic')`\n\n训练完成后，我们识别并显示权重最大的资产，突出投资组合中最具影响力的公司，如下所示：\n\
  \n![](img/fig-11-14.png)\n\n条形图显示了为实现预期的风险调整后收益（最大化夏普比率）而分配给每个资产的投资组合权重。最大权重分配给\
  \ Schlumberger (SLB)、Nvidia 和 Oracle (ORCL)。这些是模型在训练期间识别出的首选候选资产。\n\n其他资产如 IBM、百事可乐\
  \ (PEP) 和菲利普莫里斯 (PM) 也被纳入，但权重较小，反映了它们对投资组合整体预期表现的相对贡献。这种分布表明模型倾向于混合科技、能源和消费必需品板块，以平衡增长与稳定性。\n\
  \n与 HRP 投资组合相比，权重更大，导致投资组合分散度较低，更集中于一小部分资产。\n\n让我们将该投资组合与仅基于文本信息的 HRP 投资组合进行比较。与\
  \ HRP 投资组合相比，权重更大，导致投资组合分散度较低，更集中于一小部分资产。\n\n在下图中，我们将这两个投资组合置于 MST 结构中以进行直接可视化对比。HRP\
  \ 分配以资产名称周围的框表示，而资产名称周围的星号表示最大夏普比率分配：\n\n![](img/fig-11-15-spanning-tree-V3-3.png)\n\
  \n最大夏普比率投资组合更加集中，少数资产权重较高，而 HRP 投资组合则更广泛地分散，利用文本相似性进行分散化。MST 可视化突出了这种对比：HRP 分配分布在不同行业，而最大夏普比率分配倾向于聚集在少数选定的高收益资产周围。这强化了风险调整后收益与分散化之间的权衡，HRP\
  \ 提供更广泛的敞口，而最大夏普比率则倾向于效率而非平衡。\n\n我们现在将分析权益曲线，以比较两个投资组合随时间变化的风险收益概况，评估其收益、波动率和分散化效果，如下所示：\n\
  \n![](img/fig-11-16-max-sharpe-portfolio.png)\n\n图表对比了基于文本分析构建的 HRP 投资组合（蓝线）与基于金融收益的最大夏普比率投资组合（红线）在测试期内的表现。最大夏普比率投资组合显示出略高的增长，优于\
  \ HRP 投资组合和等权重投资组合（黑线）。这表明，建立在维基百科文本分析基础上的 HRP 方法是一个有力的竞争者，提供了一种分散化的、数据驱动的替代方案，能有效捕捉资产关系并降低风险。\n\
  \n尽管表现更优，HRP 权益曲线与我们的 MST 树分析一致。最大夏普比率投资组合更加集中、分散度较低，导致最大回撤较高。\n\n## 结论\n\n在本章结束时，我们介绍了先进的无监督\
  \ NLP 驱动投资组合构建，展示了纯文本数据如何转化为有意义的金融洞察。利用公司嵌入、相似性矩阵和基于图的结构，我们构建了超越传统数值数据的替代资产配置策略。\n\
