  \n# 第 9 章：交易中的无监督学习方法\n\n## 简介\n\n交易依赖于识别金融数据中的模式和趋势以指导投资决策。虽然监督学习预测特定结果，但无监督学习擅长揭示隐藏的结构和关系。本章探讨无监督学习在交易中的应用，重点关注两项关键技术：变点检测（CPD）和聚类。\n\
  \nCPD 涉及识别时间序列底层动态中的突然变化或转移，而聚类则能对数据中的相似序列或模式进行分组。本章旨在通过理论解释、实践示例和现实应用相结合的方式，为交易中的无监督学习方法提供全面且原创的介绍。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 变点检测简介\n- CPD 的挑战、局限性与应用\n- 使用 ChangeFinder 库进行在线\
  \ CPD\n- 使用 ruptures 库进行离线 CPD\n- 序列聚类\n\n## 目标\n\n读完本章后，您将获得无监督分析方法的实用技能，从而具备发掘金融数据中隐藏模式和统计结构的能力。您将学会像市场分析师一样思考，分析资产的底层动态，构建数据驱动的交易策略。\n\
  \n通过实操技术，您将识别市场反转和重大转变的关键时刻，应用统计过滤将关键事件与噪音分离，并构建有意义的事件序列。\n\n您还将发展聚类算法方面的专业知识，以对市场行为进行分类，并将金融数据分割为不同的阶段。这些洞察将改善您的交易决策和策略开发。\n\
  \n## 变点检测简介\n\n识别市场趋势、波动率和底层动态的变化至关重要。实现这一目标最有效的方法之一是 CPD，这是一种旨在检测时间序列数据中突变或异常的统计技术。CPD\
  \ 是发掘隐藏模式、优化交易策略和改进风险管理的重要工具。\n\n在本简介的以下章节中，我们将介绍 CPD，讨论其类型、方法、算法，并探讨其挑战和局限性。\n\n\
  ### 定义变点\n\n\n\n\n#### CPD 识别时间序列中数据统计特性发生显著变化的时刻\n\n在金融市场中，这些变化点预示着由投资者情绪、监管政策或意外事件驱动的机制转换。检测它们使交易者能够调整策略、管理风险并抓住机遇。\n\
  \n### 关键挑战在于将真实的转换与噪声区分开来\n\n我们如何区分永久性的市场转换与暂时性的波动？金融数据充满噪声，这使得模型很容易过拟合到无关的模式上。新闻事件和高频交易可能触发短暂的波动，而这些波动并不反映结构性转换。目标是快速识别真实的变化，理想情况下是在市场完全调整之前实时识别。尽早识别真实转换的能力使交易者能够占据有利位置，并在机遇出现时加以利用。\n\
  \n实现这一目标的关键步骤是根据目标是实时适应还是回顾性分析，选择合适的 CPD 方法。\n\n### CPD 的类型\n\nCPD 主要分为两大类：在线检测和离线检测。在线\
  \ CPD 涉及对数据流的实时监控，以在变化发生时检测变化；而离线[¹] CPD 则侧重于分析历史数据，以回顾性地识别变化点。离线 CPD 用于交易策略回测、算法性能评估以及识别历史数据中的循环模式。\n\
  \n### 方法与算法\n\nCPD 包含多种方法和算法，各有优劣。参数化方法假设数据服从特定分布，并利用统计检验来检测分布参数的变化。非参数化方法不依赖预定义的分布，而是使用经验度量，如密度估计或聚类算法。机器学习方法应用先进技术来识别数据中的复杂模式和转换，这是本书的主要关注点。混合方法整合多种方法，以发挥其优势并规避其局限性。\n\
  \n### CPD 的挑战、局限性与应用\n\n虽然 CPD 是一个强大的工具，但也伴随着挑战和局限性。数据质量是一个关键因素，因为 CPD 对缺失值和噪声高度敏感，异常值需要谨慎处理以避免虚假的变化点。模型选择是另一个挑战，因为选择错误的\
  \ CPD 方法或算法可能会产生误导性结果。结果解读也起着关键作用，需要对底层数据和市场动态有扎实的理解，才能准确分析检测到的变化。\n\nCPD 在金融领域有着广泛的应用，包括：\n\
  \n- 趋势检测：识别市场趋势的变化，以优化交易策略和仓位规模\n- 波动率建模：检测波动率的变化，以改进风险管理和期权定价\n- 异常检测：识别金融数据中的异常模式或离群值，以发现潜在的欺诈或错误\n\
  - 投资组合优化：利用 CPD 识别资产相关性的变化并优化投资组合构建\n\n如前所述，CPD 算法主要有两种类型：在线和离线方法。我们将从在线 CPD 开始探讨。\n\
  \n## 使用 ChangeFinder 库进行在线 CPD\n\nChangeFinder 是一种统计算法，旨在在线检测变化点和异常。在 CPD 的语境下，在线是指在数据实时接收时检测变化的方法。\n\
  \nChangeFinder 采用以下两阶段方法：\n\n- 平滑与概率密度估计：算法首先对数据应用平滑过程以减少噪声，并估计数据的底层概率分布。这通常通过统计模型（`自回归积分滑动平均模型\
  \ (ARIMA)`）来实现，有助于理解数据随时间的正常行为。\n- 变化点得分计算：在概率密度估计之后，ChangeFinder 为时间序列中的每个点计算一个得分，该得分衡量每个点的数据偏离模型预测的程度。该得分源自当前模型与包含更新数据点的新估计模型之间的似然比。\n\
  \n随着时间序列的推进，ChangeFinder 根据新数据持续更新模型并重新计算得分。当得分超过预定阈值时，即检测到变化点，表明生成该时间序列的底层过程可能发生了显著变化。\n\
  \n下面是一个使用模拟时间序列的示例，其中变化点的位置已知，用于测试算法能否准确检测。\n\n让我们模拟两个变化点（`change_point_1` 和 `change_point_2`），分别位于\
  \ 250 和 300 处。在这两个点之后，我们突然增加序列的变异性（标准差），以明确指示机制的转换：\n\n```\nn = 500\nchange_point_1\
  \ = 250\nchange_point_2 = 300\nstdev = 1\nmult = 3\ndata = np.concatenate([np.random.normal(0,\
  \ stdev, change_point_1),\n np.random.normal(0, mult * stdev , change_point_2 -\
  \ change_point_1),\n np.random.normal(0, 3 * mult * stdev , n - change_point_2 )])\n\
  ```\n\n下图清晰地展示了三个不同的阶段，预设的变化点位于 250 和 300 处（虚线垂直线）。变异性的突然飙升显而易见，我们想测试算法能否准确检测到这些变化：\n\
  \n![](img/fig-9-1.png)\n\n我们将这些增量（`data`）输入 CPD 算法，以计算序列中每个点的异常得分，如前所述。最高的得分为 CPD\
  \ 提供了明确的信号：\n\n```\nimport changefinder\n\n### 初始化 changefinder 函数\ncf = changefinder.ChangeFinder(r\
  \ = 0.2)\n\n### 计算得分以检测变化点\nscores = [cf.update(p) for p in data]\n```\n\n在上述设置指令中，`r`\
  \ 是随机模型的遗忘因子，通常在 0 和 1 之间。较小的值使模型对近期变化更敏感。其他参数[²]均设为默认值。\n\n异常得分通过 `cf.update()`\
  \ 函数实时更新，如代码所示，算法处理每个新数据点，以评估其与以往数据相比的正常性。\n\n我们现在可以验证 CPD 算法是否准确识别了正确的变化点。在 ChangeFinder\
  \ 库中，变化点通过异常得分的峰值来识别。因此，我们的任务是定位数据中极值的位置（`np.argsort(scores)`）：\n\n```\nprint('True\
  \ Change Point at position :',change_point_1)\ncpd = np.argsort(scores)[-1]\nprint('CPD\
  \ detected at position:',cpd)\n```\n\n```\nTrue Change Point at position : 250\n\
  CPD detected at position: 255\n```\n\nCPD 算法成功检测到了两个连续的变化点（下图中的 CPD#1 和 CPD#2），尽管检测前存在轻微的延迟。\n\
  \n这种滞后是预期内的，原因是数据的窗口化切片，如下所示：\n\n![](img/fig-9-2.png)\n\nChangeFinder 算法在任何实时监控系统中都特别有用，因为在这些系统中识别突发变化对于及时决策至关重要。现在，让我们继续探索使用离线库的\
  \ CPD 方法。\n\n## 使用 ruptures 库进行离线 CPD\n\nRuptures 是一个用于离线 CPD 的 Python 库。尽管由于其坚定的离线性质存在这一限制，ruptures\
  \ 仍是初次探索 CPD 算法的首选库。\n\n[¹]: chap09.xhtml#footnote-062\n[²]: chap09.xhtml#footnote-061\n\
  \n\n\n本包提供了用于非平稳信号分析与分割的方法。“非平稳”是指其统计特性（如均值和方差）随时间变化的数据。检测这些变化正是我们分析的目标。实现的算法包括针对各种参数和非参数模型的精确检测与近似检测。就我们的\
  \ CPD 目的而言，我们将重点关注非参数 3 核方法。\n\nCPD 的核心思想是找到使特定代价函数最小化的变点，该函数衡量分割后的信号与数据的拟合程度。\n\
  \n当变点数量已知时，你可以通过求解特定的优化问题来找到最佳分割。如果你不知道变点的数量，可以使用惩罚项来平衡拟合优度与分割的复杂度。\n\n## 核 CPD\
  \ 方法简介\n\n在 CPD 和机器学习的语境下，核是一种函数，用于度量变换特征空间中两个数据点之间的相似性或关系。得益于核技巧，核使算法能够在更高维的空间中运行，而无需显式计算数据在该空间中的坐标。这听起来可能很高深，但这只是一种通过从不同视角分析信号，使\
  \ CPD 更强大、更通用的方法。这种方法对于识别在原始空间中不可线性分离的数据模式或结构特别有用。\n\n核方法可通过评估数据点间关系随时间的变化来检测变点。通过应用核函数，可以度量时间序列片段之间的相似性。相似性度量的显著变化可能预示着数据中存在结构性断裂或变点。在实践中，核\
  \ CPD 等算法利用这一概念，对比潜在变点前后的数据片段，以识别发生显著变化的位置。\n\n### 检测变点\n\n识别时间序列中变点发生位置的过程，涉及分析数据以精确定位其属性（如均值、方差、趋势或模式）发生显著变化的位置。对比潜在变点前后的数据片段是该分析中的关键策略。\n\
  \n通常按以下步骤进行：\n\n*   **分割**：时间序列被划分为多个片段，依据可以是固定间隔、滑动窗口，或使用提出潜在分割点的算法。选择这些片段的原则是：假设每个片段内部在统计上是齐性的，但与相邻片段不同。\n\
  *   **对比**：针对每个潜在变点，对比该点前后紧邻的数据片段。这种对比可以基于距离度量。\n\n在基于核的方法中，核函数计算片段在核空间中的相似性（或距离）。相似性的显著变化表明存在潜在变点。\n\
  \n### 核 CPD 与传统方法的对比\n\n将基于核的 CPD 与传统方法进行对比，可发现若干优势。核方法擅长捕捉数据中复杂的非线性关系，而传统线性方法往往会忽略这些关系，从而增强了其分析复杂时间序列的能力。此外，由于可用的核函数种类繁多（如线性、多项式或径向基函数），核\
  \ CPD 的灵活性得以增强，分析师可根据数据的具体特性定制检测过程。某些核方法还提供了计算效率，使其能比穷举搜索方法更有效地处理大型数据集。\n\n总体而言，核方法为\
  \ CPD 提供了一种强大且灵活的方法，能够发掘传统线性技术可能遗漏的时间序列数据中的复杂模式。\n\n尽管有这些优势，核方法用于 CPD 也有一个显著缺点：在其标准形式下，它们依赖潜在变点前后的数据，以评估片段间的相似性或差异性。\n\
  \n### 核方法的缺点\n\n核方法用于 CPD 时，在其标准形式下，确实依赖潜在变点前后的信息来评估片段间的相似性或差异性。这种方法通常需要对整个时间序列进行回顾性分析，以识别发生显著偏移的位置，这使得在未来数据点尚不可用的实时场景中难以直接应用。\n\
  \n然而，通过某些调整，可以将这些方法改造用于在线或实时分析。\n\n## 核 CPD 的应用\n\n在本节中，我们将探讨 CPD 技术的应用。该分析旨在演示\
  \ CPD 如何发掘市场动态随时间的显著变化。具体而言，我们将分析铜期货合约的月度收盘价。\n\nYahoo Finance 代码为 `HG=F`：\n\n```\n\
  asset = 'HG=F'\nstart_date = '2000-01-01'\nend_date = '2024-04-25'\n```\n\n我们首先下载数据：\n\
  \n```\n### 月度频率\ndf = yf.download(asset, start=start_date, end=end_date, interval='1mo')\n\
