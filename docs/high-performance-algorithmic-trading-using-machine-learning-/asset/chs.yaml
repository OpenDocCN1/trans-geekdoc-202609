  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   回测和交易库\n*   使用 BackTrader 实施策略\n*   风险管理\n\n##\
  \ 目标\n\n本章重点关注基于 Python 的平台及其在运行高级交易策略中的关键作用。我们首先介绍用于回测和执行的最有效算法交易库，重点介绍其功能和优势。在此过程中，我们将概述选择最适合您交易需求的库和\
  \ API 时需要考虑的关键因素。\n\n奠定这一基础后，我们将转向 `BackTrader` 的实际应用。本章随后将介绍管理算法订单的基础知识，并深入探讨如何使用该引擎运行回测。风险管理也将是重点关注领域。接下来，我们将探讨评估性能和改进策略。最后，我们将把讨论扩展到多资产策略。\n\
  \n## 回测和交易库\n\n用于算法交易和回测的 Python 平台为交易者提供了广泛的库，每个库都提供不同的工具和功能。`BackTrader[1]` 凭借其多功能性和易用性脱颖而出，成为新手和资深交易者的首选。\n\
  \n它包含稳健算法策略所需的所有关键要素，包括订单类型、管理、监控、风险控制、止损和止盈。此外，`BackTrader` 支持实盘交易。\n\n`Zipline[2]`\
  \ 是驱动 Quantopian IDE 的开源回测引擎，可在本地运行，并可适配虚拟环境和 Docker 容器。它继承了 Quantopian 的广泛功能，但允许集成自定义数据集，以实现更个性化的回测场景。`Zipline`\
  \ 提供详细的回测数据，便于多样化的可视化应用。尽管 `Zipline` 于 2017 年停止提供实盘交易功能，但 `Zipline-live` 项目继续通过\
  \ InteractiveBrokers 支持实盘交易，保持了与原始 `Zipline` 相当的功能集。\n\n另一方面，`PyAlgoTrade[3]` 以其对多资产交易的强力支持而脱颖而出。它允许添加多个数据源和可变时间框架，满足管理多元化投资组合交易者的需求。对于寻求实时数据源的用户，`PyAlgoTrade`\
  \ 提供符合高频交易需求的解决方案。\n\n\n\n\n此外，`Alpaca`4 凭借其现代化方法，提供了与券商的无缝接口，弥合了策略开发与实盘执行之间的差距。这使其成为重视直接市场接入和实时交易能力的交易者的理想选择。\n\
  \n不得不提`QuantRocket`5，这是一个为`InteractiveBrokers`6 用户量身定制的平台，支持外汇和美股的回测与实盘交易。其独特之处在于适应性强，既支持其专有的`Moonshot`引擎，也支持用户自选的第三方引擎。`QuantRocket`没有采用传统的集成开发环境（IDE），而是利用`Jupyter\
  \ notebooks`创建同等环境。该服务采用订阅制。\n\n### 选择合适库和 API 的标准\n\n要确定最适合您算法交易需求的库，重要的是根据特定标准对其进行评估，这些标准涵盖了回测和实盘交易的多样化需求：\n\
  \n*   **易于实现**：评估库的直观程度和用户友好性，考虑其文档质量和社区支持水平。同时，也要考虑您对该库编程语言的熟悉程度。\n*   **适应性**：确定库在允许自定义和扩展方面的灵活性。它能否轻松适应您交易策略的独特需求？\n\
  *   **券商集成**：评估库与各券商的兼容性，特别是如果您偏好或已与特定券商建立关系。\n*   **多资产交易**：分析库处理多样化资产类别（股票、外汇、大宗商品、加密货币、ETF、债券）的能力。\n\
  *   **执行速度**：考虑库的计算效率，较高的速度对高频交易策略有显著优势，但对低频策略（小时级、日级或周级）则不构成顾虑。\n*   **社区与开发者支持**：强大的社区和开发者支持对于故障排查和提升库功能极具价值。\n\
  *   **成本**：考虑使用库的相关成本，因为某些库可能需要订阅或存在隐性费用。\n*   **数据处理与存储**：查看库如何管理数据源、历史数据访问和数据存储，这对回测和实盘交易都至关重要。\n\
  *   **风险管理工具**：确保库包含或支持集成高级风险管理工具和指标。\n*   **绩效指标与报告**：生成详细报告和获取全面绩效指标的能力对于分析策略有效性必不可少。\n\
  \n根据这些标准，我们可以对这些库进行如下排序：\n\n1.  **BackTrader**：适应性极强，适合初学者和经验丰富的交易者，支持多券商和多数据源，但复杂策略的执行速度可能较慢。\n\
  2.  **Zipline**：提供稳健的数据处理，适合股票市场，但券商集成较少，主要专注于回测而非实盘交易。\n3.  **QuantConnect**：多资产交易表现优异，提供高速执行和广泛的券商集成，但学习曲线可能较陡峭。\n\
  4.  **PyAlgoTrade**：适合教学用途和简单直接的策略，因其复杂度低、开销小，但缺乏复杂策略开发所需的高级功能。\n5.  **Alpaca**：以其面向算法交易的零佣金券商服务著称，提供现代化、对开发者友好的平台，可与许多工具无缝集成，实现流畅的实盘交易能力。\n\
  \n通过根据指定标准比较这些库，交易者可以根据其回测和实盘执行的具体需求做出明智决策，确保与其算法交易系统在战略上契合。\n\n## 使用 BackTrader\
  \ 实现策略\n\n正如上一节所述，`BackTrader`是实现和回测算法策略的首选库。因此，我们将借助该库共同探索构成系统化策略执行的关键要素。\n\n`BackTrader`是一个稳健的事件驱动回测框架，使交易者能精准构建和测试策略。其设计旨在对交易生命周期中的市场事件（从订单提交到执行和结算）做出反应。这种设置模拟了实盘交易环境，为策略开发和验证提供了稳健平台。通过处理各类市场数据和事件，`BackTrader`促进了交易策略的逼真模拟，这对于在真实场景部署前识别潜在问题和优化性能至关重要。\n\
  \n让我们首先看一下使用 `BackTrader` 实现策略的路线图。\n\n### BackTrader 回测指南\n\n本节探讨使用 `BackTrader`\
  \ 实现策略的结构化路线图，将流程分解为可执行步骤。在 `BackTrader` 中实现交易策略是一个结构化过程，包含以下步骤：\n\n1.  **导入库**：首先导入必要的\
  \ Python 库，包括 `BackTrader` 和您可能需要的任何数据库。\n2.  **定义策略**：在 `BackTrader` 中创建 `bt.Strategy`\
  \ 的子类。这是您定义参数、初始化指标和设置交易逻辑的地方。\n3.  **初始化指标（可选）**：在策略子类中，初始化您将使用的任何指标，如移动平均线。\n\
  4.  **设置交易逻辑**：使用 `__init__` 等方法设置策略，使用 `next` 定义每个传入数据点执行的逻辑。\n5.  **创建 Cerebro\
  \ 引擎**：实例化一个 `Cerebro` 对象，这是 `BackTrader` 处理回测工作流的核心引擎。\n6.  **添加数据源**：向 `Cerebro`\
  \ 引擎添加市场数据。数据来源可以是实时或历史数据（CSV 文件、Pandas 数据框等）。\n7.  **向 Cerebro 添加策略**：使用 `addstrategy`\
  \ 将您定义的策略附加到 `Cerebro` 引擎。\n8.  **设置初始资金和券商参数（可选）**：定义初始资金和券商参数，如佣金、滑点等。\n9.  **运行回测**：在\
  \ `Cerebro` 实例上使用 `run` 方法执行回测。\n10. **分析结果（可选）**：回测运行后，您可以分析结果、提取绩效指标，或使用 `cerebro.plot()`\
  \ 绘制绩效图表。\n11. **优化（可选）**：您可以通过调整参数并通过 `Cerebro` 引擎运行策略来优化策略，以查看这些变化如何影响性能。\n\n\
  遵循这种结构化方法，即使有一定编程经验的初学者也能成功使用 `BackTrader` 回测其交易策略。我们将在后续章节讨论所有这些阶段的具体示例。\n\n作为序言，让我们看看基于机器学习算法的策略与不使用机器学习的系统化策略有何不同。\n\
  \n### 使用 BackTrader 编写机器学习策略\n\n我们选择采用机器学习驱动的策略，而非依赖技术指标或类似方法。有兴趣探索此类方法的读者，可在 `BackTrader`\
  \ 官方网站找到大量资源 7。我们在 `BackTrader` 环境中的重点是利用机器学习模型的输出及其预测，并模拟后续事件，本质上是将这些预测转化为实实在在的盈亏结果。\n\
  \n\n\n\n#### 基于机器学习的策略在 BackTrader 中的实现\n\n基于机器学习的策略编码方法不同于传统方法（如 `Moving Average\
  \ Crossover` 移动平均线交叉）。我们不再编码具体的交易规则，而是获得一个预测向量，范围从简单的买入或卖出信号到更复杂的方案，这些都必须在 BackTrader\
  \ 模拟环境中被解读并转化为可执行的订单。这种转变强调了算法的预测输出作为交易决策背后的驱动力。\n\n与这一点相关的要素（从预测到订单）属于我们在本节开头给出的分步指南中的第\
  \ 2 阶段（定义策略）。稍后我们将详细介绍这一点并编写相应的代码。\n\n##### 导入库并设置\n\n让我们从导入和安装必要库的第一步开始。首先是 BackTrader：\n\
  \n```bash\npip install -q backtrader[plotting]\n```\n\n```python\nimport numpy as\
  \ np\nimport pandas as pd\nimport yfinance as yf\nimport matplotlib.pyplot as plt\n\
  ```\n\n我们使用宝洁公司（PG）连续十天的日线数据初始化数据源（`df`）。为了演示基于机器学习的交易策略回测，我们使用随机数生成器（`np.random.choice`）模拟预测。虽然这些虚拟预测用于演示回测流程，但它们可以被机器学习模型的预测所替代：\n\
  \n```python\nsymbol = 'PG'\nticker = yf.Ticker(symbol)\ndf = ticker.history(period='10d',\
  \ interval='1d')\n\n###### 模拟预测，倾向于 70% 的概率为 '1'（'买入'）和 30% 的概率为 '-1'（'卖出'）\npred_dumb\
  \ = np.random.choice([-1, 1], size=df.shape[0], p=[0.3, 0.7])\n\n###### 在数据框中插入新列以跟踪预测\n\
  df['custom'] = pred_dumb\n```\n\n此时，我们拥有了价格以及与之对应的买入/卖出决策。\n\n##### 在事件驱动环境中定义策略\n\
  \n在 BackTrader 中创建 `bt.Strategy` 的子类。这是你定义参数、初始化指标和设置交易逻辑的地方。\n\n以下是一个名为 `CustomSignalStrategy`\
  \ 的示例，包含当需要时管理订单流（发送和接收后续通知）所需的基本方法：\n\n```python\n###### 定义自定义策略\nclass CustomSignalStrategy(bt.Strategy):\n\
  \n    def __init__(self):\n        # 策略开始时调用一次，用于声明指标和变量\n        pass\n\n    def\
  \ log(self, txt, dt=None):\n        # 实用方法，使用可选的日期时间（dt）戳记录给定文本\n        pass\n\n\
  \    def next(self):\n        # 数据集中每个数据点（K 线）调用一次。这是执行主要策略逻辑的地方。\n        pass\n\
  \n    def notify_order(self, order):\n        # 每当订单状态发生变化时调用。可用于订单确认、取消或拒绝。\n \
  \       pass\n```\n\n剩下的就是用我们想要回测的交易系统特有的逻辑，填充并完成这些方法（`__init__`、`log`、`notify_order`\
  \ 和 `next`）的代码。我们将为每个方法逐一完成。\n\n`__init__` 方法负责处理机器学习算法提供的预测，作为初步设置。它访问位于 `self.datas[0].custom`\
  \ 中的策略（买入/卖出）信号。变量 `custom_signal` 随后被设置为引用最新的信号（队列最前端）：\n\n```python\ndef __init__(self):\n\
  \    # 'custom' 信号 <- 预测\n    self.custom_signal = self.datas[0].custom\n```\n\n\
  `log` 函数负责在每次执行时显示一个日期（`dt`）和一段文本（`txt` 参数）：\n\n```python\ndef log(self, txt, dt=None):\n\
  \    ''' 日志记录函数 '''\n    dt = dt or self.datas[0].datetime.date(0)\n    print('%s,\
  \ %s' % (dt.isoformat(), txt))\n```\n\n##### 设置交易逻辑\n\n在事件驱动编程框架内，我们编写由特定事件触发的方法。操作流程由这些事件的顺序引导。对于\
  \ `next` 方法，相关事件是新 K 线或价格更新的到来。\n\n以下方法会为数据集中的每个数据点调用，这是策略核心逻辑展开的关键时刻。在这里，我们根据从\
  \ `self.custom_signal` 接收到的信号，管理并发送交易订单，区分买入和卖出类型。\n\n提供的代码片段展示了如何根据传入信号执行买入或卖出订单：\n\
  \n```python\ndef next(self):\n    # 逻辑：金字塔式加仓\n    if self.custom_signal[0] == 1:\n\
  \        self.buy()\n    elif self.custom_signal[0] == -1:\n        self.sell()\n\
  ```\n\n交易策略种类繁多。其中一个例子是反转策略，即每当信号发生变化时，持仓在多头和空头之间交替，同时保持目标金融工具数量不变。\n\nBackTrader\
  \ 通过 `order_target_size` 方法简化了这一过程，该方法允许交易者轻松设置固定仓位大小。该方法属于功能多样的 `order_target_xxx`\
  \ 系列，允许交易者以多种方式定义其期望的投资组合目标：\n\n- `order_target_size`：特定资产的股份或合约数量。\n- `order_target_value`：资产在投资组合中的货币价值。\n\
  - `order_target_percentage`：分配给资产的当前投资组合价值的百分比。\n\n```python\ndef next(self):\n\
  \    if self.custom_signal[0] == 1:\n        self.order = self.order_target_size(target=1)\n\
  \    elif self.custom_signal[0] == -1:\n        self.order = self.order_target_size(target=-1)\n\
  ```\n\n最后，关于策略实现，我们应该提及 `notify_order` 方法。在 BackTrader 中，`notify_order()` 方法用于拦截有关订单状态的消息。当下达订单时，它会在其生命周期中经历多个状态（如\
  \ Created 已创建、Submitted 已提交、Accepted 已接受），`notify_order()` 会在每次状态变化时提供更新。\n\n`notify_order()`\
  \ 用于在订单状态变化时采取适当行动，例如记录事件、更新策略状态，或处理订单完成或失败的情况。它是 BackTrader 策略逻辑的重要组成部分，使开发者能够管理订单流并根据需要响应事件：\n\
  \n```python\ndef notify_order(self, order):\n    if order.status in [order.Submitted,\
  \ order.Accepted]:\n        # 买入/卖出订单已提交/被经纪商接受 - 无需操作\n        return\n\n    #\
  \ 检查订单是否已完成\n    if order.status in [order.Completed]:\n        if order.isbuy():\n\
  \            self.log('BUY EXECUTED, Price: %.2f, Size: %d' % (order.executed.price,\
  \ self.getposition().size))\n        elif order.issell():\n            self.log('SELL\
  \ EXECUTED, Price: %.2f, Size: %d' % (order.executed.price, self.getposition().size))\n\
  \        self.bar_executed = len(self)\n\n    # 注意：如果现金不足，经纪商可能会拒绝订单\n    elif order.status\
  \ in [order.Canceled, order.Margin, order.Rejected]:\n        self.log('Order Canceled/Margin/Rejected')\n\
  \n    # 记录：无挂单\n    self.order = None\n```\n\n##### 创建 Cerebro 引擎\n\n以下代码（`init_cerebro_before_run`）作为设置\
  \ BackTrader \"Cerebro\" 引擎的核对清单，确保从数据集成到执行细节的所有必要组件都已正确配置。\n\n这种准备对于随后将数据和策略（`CustomSignalStrategy`）添加到引擎中、进入执行阶段至关重要：\n\
  \n```python\n###### 子类化 PandasData 数据源以将 'custom' 作为额外行包含在内\nclass CustomPandasData(bt.feeds.PandasData):\n\
  \    lines = ('custom',)\n    params = (('custom', -1),)\n\ncash = 100000\n\ndef\
  \ init_cerebro_before_run():\n    # 使用自定义数据源将数据加载到 BackTrader\n    data = CustomPandasData(dataname=df)\n\
  \n    # 创建一个新的 Cerebro 引擎\n    cerebro = bt.Cerebro()\n\n    # 在开盘/收盘时开仓/平仓（信号后的下一根\
  \ K 线）\n    cerebro.cheat_on_close = False\n\n    # 向引擎添加数据源\n    cerebro.adddata(data)\n\
  \n    # 向引擎添加策略\n    cerebro.addstrategy(CustomSignalStrategy)\n```\n\n\n\n\n\n\
  ###### 设置我们期望的初始资金\n\n```python\ncerebro.broker.set_cash(cash)\n```\n\n###### 打印初始资金\n\
  \n```python\nprint('Starting Portfolio Value: %.2f' % cerebro.broker.getvalue())\n\
  ```\n\n```python\nreturn cerebro\n```\n\n```python\ncerebro = init_cerebro_before_run()\n\
  ```\n\n该初始化代码的结果为：\n\n```text\nStarting Portfolio Value: 100000.00\n```\n\n######\
  \ 运行回测\n\n剩下的就是激活 Cerebro 的回测引擎，让它管理操作序列：\n\n```python\n###### 运行回测\nresults = cerebro.run()\n\
  ```\n\n这给出了以下订单序列：\n\n```text\n2023-10-23, SELL EXECUTED, Price: 147.86, Size: -1\n\
  2023-10-24, BUY EXECUTED, Price: 148.12, Size: 1\n2023-11-02, SELL EXECUTED, Price:\
  \ 149.54, Size: -1\n```\n\n```python\n###### 打印最终资金\nprint('Ending Portfolio Value:\
  \ %.2f' % cerebro.broker.getvalue())\n```\n\n```text\nEnding Portfolio Value: 99999.74\n\
  ```\n\n下表列出了该期间的价格和信号，透明地展示了策略将如何对市场变化和预测信号做出反应：\n\n| Date | Open | Close | custom\
