  \ necessary time budget=7s.\n[flaml.automl.logger: 02-27 23:51:27] {2391} INFO -\
  \ at 0.4s, estimator lgbm's best error=0.4972, best estimator lgbm's best error=0.4972\n\
  [flaml.automl.logger: 02-27 23:51:27] {2218} INFO - iteration 1, current learner\
