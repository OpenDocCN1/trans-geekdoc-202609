  \ * 100.0}%\")\n```\n\n```\nAccuracy: 81.52350081037277%\n```\n\n我们还打印混淆矩阵和分类报告，如下所示：\n\
  \n```\nprint(confusion_matrix(y_test, pred))\nprint()\nprint(classification_report(y_test,\
