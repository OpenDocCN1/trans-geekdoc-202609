  \n# 第 10 章\n\n**基于模式匹配的无监督学习**\n\n## 简介\n\n在本章中，我们专注于无监督学习技术的实际应用，使用模式匹配方法及其检测模式、反复出现的主题或独特异常的能力。我们首先考察基本的无监督技术，如距离矩阵（DM）和递归图（RP），它们用于可视化和量化时间序列数据的动态。这些方法使我们能够发掘金融数据中可能被忽视的隐藏模式和结构。此外，我们将探索矩阵轮廓的用途，这是一种用于模式匹配的强大工具，允许在时间序列数据中识别反复出现的模式和离群值。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 理解无监督学习\n- 递归图和距离矩阵简介\n- 基于递归图和距离矩阵的交易\n- 模式匹配\n\
  \n## 目标\n\n本章旨在巩固我们在上一章开始学习的无监督技术知识，并指导读者掌握使用矩阵轮廓进行模式匹配，包括如何计算和解读它以识别金融数据中的反复出现的模式（主题）和异常（不和谐模式）。此外，我们将了解如何将源自矩阵轮廓递归图的特征集成到机器学习模型中，以预测市场趋势并增强交易策略。而且，我们将涵盖这些无监督学习方法在真实金融数据中的实际应用，这将通过演示来展示，提供关于如何在算法交易系统中实施这些技术的见解。\n\
  \n## 理解无监督学习\n\n无监督学习是一种机器学习类型，其中算法从未标记的数据中学习模式和关系。与在标记数据上训练算法以进行预测的监督学习不同，无监督学习不依赖预定义的标签或结果。相反，它发掘数据本身中的隐藏结构、关系和模式。\n\
  \n无监督学习的力量在于其识别数据中新颖且意外见解的能力。在算法交易的背景下，无监督学习可以帮助交易员和分析师发现使用传统分析方法可能不明显的隐藏趋势、异常和相关性。\n\
  \n### 无监督学习技术\n\n无监督学习包含多种技术。以下是一些与算法交易相关的关键无监督学习技术：\n\n- 聚类，这是第 9 章《交易中的无监督学习方法》的主题，涉及根据数据点的特征将相似的数据点分组到簇中。该技术对于识别\
  \ 1 在一起、发掘定义该输入的底层模式和关系非常有用。\n\n- 降维技术，如主成分分析（PCA），通过减少特征数量同时保留关键信息来简化复杂数据。这在交易中特别有用，因为高维数据可能令人望而生畏。有关此技术的详细信息，请参阅第\
  \ 6 章《通过特征提升模型能力》。\n\n\n\n• 异常检测技术用于识别不符合预期行为的异常模式。在交易中，这有助于检测异常值或异常市场活动，例如识别可能预示重大市场事件的突然价格变动。有关该技术的详细信息，请参阅第\
  \ 12 章，高级无监督学习、异常检测和关联规则。\n\n• 关联规则有助于发现交易数据中不同变量之间的关系。该技术可用于识别不同资产或指标之间隐藏的相关性，从而辅助交易决策。有关该强大但未被充分利用的交易技术的实现，请参阅第\
  \ 12 章，高级无监督学习、异常检测和关联规则。\n\n• 独立成分分析（ICA）是一种将多变量信号分离为可加的、独立的非高斯成分的计算方法。在交易中，ICA\
  \ 可用于将混合信号分离为独立来源，例如分离影响股价的不同因素，这有助于理解潜在的市场动态。我们在此不再深入探讨该主题，但感兴趣的读者可参考优秀的 Scikit-learn\
  \ 文档：https://scikit-learn.org/stable/modules/decomposition.html#ica。\n\n• 模式匹配涉及在交易数据中识别特定模式。本技术在本章最后一部分有详细描述。\n\
  \n• 递归图是一种图形化表示，用于分析动力系统中的模式、结构和状态的递归。它本质上是一张图，显示动力系统轨迹重访同一区域的实例。递归图揭示的模式可以指示动力学行为中的周期性、混沌或其他隐藏结构。本技术在本章最后一部分有详细描述。\n\
  \n理解这些技术引出了无监督学习在算法交易中的相关性，在这些原则被应用于识别隐藏模式和结构。\n\n### 无监督学习与算法交易的相关性\n\n无监督学习技术可以通过揭示数据中通过传统分析方法可能不明显的隐藏模式和关系，来识别新颖的交易机会。此外，它们有助于开发相似交易日\
  \ 2 的聚类交易策略、检测异常，以及发现不同资产或指标之间的相关性。增强风险管理是另一优势，因为无监督学习可以识别交易数据中的潜在风险和异常，使交易者能够采取主动措施加以缓解。此外，无监督学习可以通过识别可用于开发系统化交易策略的模式和关系，促进交易决策的自动化。\n\
  \n无监督学习技术远远超出了算法交易的范畴，对于在任何领域开发高性能 AI 系统至关重要。\n\n### 无监督学习的重要性\n\n让我们将讨论扩展到算法交易之外的更广泛背景。Yann\
  \ LeCun3 一贯强调无监督学习对推进 AI 系统的重要性。他认为，机器获取常识并像人类学习一样发展对世界的真实理解至关重要。LeCun 提出，通过无监督方法学习世界模型是构建人类水平\
  \ AI 的关键。这种方法将使机器能够通过观察学习关于世界如何运作的大量背景知识，且只需极少的任务特定训练。\n\n无监督学习可能成为未来 AI 系统的主流技术，这些系统能够从原始、未标记的数据中学习，从而产生更接近人类认知的稳健且适应性强的智能。\n\
  \n研究人员认为，当前的监督学习方法虽然在特定领域取得了成功，但在泛化和获取常识知识的能力方面受到限制。\n\n我们现在将关注点转向通过模式匹配和模式检测应用这些见解的具体应用。在本章其余部分，我们将详细探讨在无监督学习技术列表中简要提到的两种技术。我们从递归图（RP）和距离矩阵\
  \ 4（DM）开始，最后以模式匹配结束。\n\n## 递归图和距离矩阵简介\n\n为了探索和理解 RP 和 DM，我们首先回答三个基本问题：什么是 RP？它有什么用？如何计算？在建立这些基础知识后，我们将继续使用\
  \ RP 和 DM 作为机器学习算法的特征。\n\n### 理解递归图\n\nRP 是由 Eckmann5 等人引入的一种工具，用于可视化动力系统的时间依赖行为和时间稳定性。\n\
  \n自然过程通常表现出独特的递归行为，例如季节循环中看到的周期性或不规则的循环模式。生物系统也表现出行为模式和活动动态，如蚁群中观察到的那些。\n\nRP 绘制系统重访大致相同状态的次数，突出显示数据中的模式和结构。RP\
  \ 上的每个点代表一个时间对，其中时间 的状态接近时间 的状态，接近程度由选定的阈值定义。\n\n### RP 的功能\n\nRP 对于检测仅从原始时间序列中可能不明显的隐藏周期性、非平稳性和数据中的动态变化非常有价值。其应用范围涵盖物理学、天文学、金融学和神经科学，为复杂系统的动态和稳定性提供见解。通过分析图中的对角线或簇等模式，数据科学家可以推断递归的性质和系统动态，包括混沌和规则周期。\n\
  \n### 计算递归图\n\n计算 RP 的第一步是生成 DM，它量化了时间序列中所有点之间的成对距离。DM 是时间序列中每个点与其他所有点在距离方面关系的全面快照。\n\
  \n要创建 RP 和 DM，我们需要遵循以下步骤：\n\n1. 选择 DM：选择一个合适的度量（例如欧几里得或曼哈顿）来衡量时间序列中点之间的距离。该度量决定了点在相空间中彼此有多近。\n\
  \n2. 计算 DM6：矩阵 DM 提供了时间序列所有点对之间距离的可视化表示。\n\n3. 设置阈值：确定一个阈值 7，它决定了点之间必须有多近才能被视为递归。\n\
  \n4. 构建递归矩阵 8：创建一个二值矩阵，其中每个元素定义为，如果 则为 ，否则为 0。R = 1 表示时间 和 时的状态相似。重要的是要注意，系统很少会回到完全相同的过去状态。相反，生成的矩阵以可视化方式表示时间序列重访相似状态的实例。\n\
  \n以下是计算 DM 和 RP 的完整函数：\n\n```python\n# Function to create a Distance Matrix and\
  \ a recurrence plot \ndef dist_matrix_rec_plot(data, threshold=0.1):\n    # Calculate\
  \ the distance matrix\n    dist_matrix = np.abs(data[:, None] - data[None, :])\n\
  \    # Create the recurrence plot using the threshold\n    rp = dist_matrix <= threshold\n\
  \    return rp , dist_matrix\n```\n\nDM 突出了基于距离的模式，而 RP 揭示了时间递归。\n\n### RP 和 DM\
  \ 示例\n\n\n\n#### 线性函数\n\n我们将从简单的模拟时间序列开始，演示 DM（距离矩阵）和 RP（递归图）如何帮助可视化数据中固有的周期、趋势和混沌行为等模式。这将帮助我们理解如何同时解读\
  \ DM 和 RP。\n\n#### 线性函数\n\n我们将从线性函数开始：\n\n该函数及其关联的 DM 和 RP 图如下：\n\n![](img/fig-10-1.png)\n\
  \n对于线性函数和阈值 0.2，图中显示了一条从左下到右上的单条对角线。这代表了恒等线，其中每个点都与自身完美递归。\n\n对于 RP 图，配色方案如下：黑色表示系统状态递归，即点之间的距离低于阈值；白色表示非递归状态，即距离超过阈值。\n\
  \nDM 显示了一个梯度模式，代表较短和较长的距离。对角线为零，代表点与自身之间无距离。远离对角线时，距离线性增加，形成逐渐对称的模式。这反映了线性函数恒定的变化率，没有周期性或复杂模式。\n\
  \n其他模式的缺失表明没有周期性行为或复杂动态，反映了线性函数简单、一致的本质。\n\n为了进一步理解 RP 和 DM 的解读，我们现在检查一个分段函数，它比之前的线性函数提供了更多复杂性。\n\
  \n#### 分段函数\n\n分段函数是指在其定义域的不同区间由不同表达式或公式定义的函数。线性函数和分段函数可以被视为金融资产时间序列的简化趋势。\n\n以下代码定义了一个分段函数，其中函数对\
  \ `t <= 3` 的值遵循一条规则，对其他点遵循另一条规则：\n\n```python\ndef piecewise_function(t):\n    return\
  \ np.where(t <= 3, t, -t + 6)\n```\n\n以下是与该函数关联的 DM 和 RP：\n\n![](img/fig-10-2.png)\n\
  \n该分段线性函数的 RP 显示了一个独特的 X 形模式。该模式反映了在峰值处相遇的两个线性段。从左下到右上的对角线代表点递归回自身。中间交叉的额外对角线突出了函数围绕其峰值的对称性。\n\
  \nDM 显示了一个蝴蝶状模式。深色对角线代表每个点与自身之间的零距离。其他区域显示时间序列两端点之间的最大距离。V 形深色区域反映了函数的峰值，附近的点具有较小的距离。\n\
  \n这两个图都有效地捕捉了函数的关键特征：其线性结构、对称性以及明显峰值的存在。\n\n现在，让我们了解周期性循环将如何影响 DM 和 RP。\n\n####\
  \ 周期函数\n\n在本节中，我们探讨周期性循环如何影响 DM 和 RP。通过分析周期函数，我们可以观察到其重复性质如何在这些可视化中反映出来。\n\n以下是周期函数的表示图：\n\
  \n![](img/fig-10-3.png)\n\n正弦函数的 RP 显示了线条和形状的独特模式，这对于周期函数是典型的。以下是如何解读此图：从左下到右上运行的对角线是显示完美递归的恒等线。图中重复的\
  \ X 状模式是波浪性质的特征。这些线上的每个点表示波浪在不同时间的递归。\n\n该模式的含义如下：\n\n- 对角线上不同高距离区域之间的周期性间隔表明正弦函数的规则周期性。这些间隔对应于函数一致的振幅和频率，反映了相似状态以规则间隔重新出现。\n\
  - 中心线周围的对称性反映了正弦波随时间的对称性质。\n\n#### 周期线性函数\n\n为了完成对金融市场中简化动态表示的分析，以下是线性趋势与（阻尼）振荡相结合的\
  \ DM 和 RP：\n\n![](img/fig-10-4.png)\n\n对于 RP，主对角线外的重复黑点和短对角线段表明周期性地返回相似状态，反映了阻尼振荡。模式的递归显示了系统如何由于阻尼效应，以逐渐减弱的强度周期性地重访相似状态。与简单的周期函数相比，这增加了递归结构的复杂性。\n\
  \n对于 DM 图，沿对角线及平行于对角线的交替条带表明线性趋势和阻尼振荡的综合效应。振荡模式在周期性条带中可见，反映了叠加在线性趋势上的振荡分量的规则递归。\n\
  \n现在我们已经掌握了趋势、周期模式及这些元素组合的解读规则，我们将把它们应用于分析金融资产的典型随机游走路径。\n\n#### 股票价格\n\n作为股票，我们选择\
  \ Reliance（信实工业），按市值计算是最大的印度股票（约 2500 亿美元）。该集团业务涉及能源、石化、纺织、自然资源、零售和电信。\n\n以下是其股价的\
  \ DM 和 RP：\n\n![](img/fig-10-5.png)\n\n对于 RP，对角线外的分散模式显示了复杂的动态。密集黑点区域表明股票重访相似状态的时期。这些聚类暗示了重复的股价行为。RP\
  \ 揭示了 Reliance 股票同时表现出趋势和递归行为，表明在整体运动中周期性地重访某些价格水平。\n\n对于 DM 图，交替条带代表价格相似性随时间的变化。交叉模式和交替条带的存在表明相似性波动，既有紧密相关的价格，也有较大的价格变动。我们可以推断\
  \ Reliance 股票经历了稳定期，并穿插着显著的价格变化。DM 有助于识别股票何时处于相似价格区间，何时经历了大幅偏离。\n\n尽管如此，DM 在整个区域显示出不同的阴影，这表明时间序列在不同时间的值之间的差异存在波动。这种阴影的变化暗示了随机行为，因为时间序列不遵循严格统一的变化模式。这进一步表明该序列不以规律、可预测的方式重复其值。相反，它显示出更随机的变化，这是随机过程的典型特征。矩阵其余部分多变且不一致的阴影表明，虽然存在总体趋势，但从一点到另一点的确切变化是不可预测的。\n\
  \n所有这些模式为动态系统提供了有价值的见解；然而，直观地解读它们需要经验和专业知识。接下来，我们将研究如何通过 RP 或 DM 提取直接的数值量化。\n\n\
  ## 基于递归图和距离矩阵的交易\n\n分析 RP 的一种更客观的方法是递归量化分析（RQA），这是一种非线性数据分析技术，用于量化动态系统中递归的数量和持续时间。RQA\
  \ 简化了直观解读 RP 和 DM 的挑战，是将它们用作机器学习算法特征的关键步骤。\n\n### 递归量化分析简介\n\n\n\n已经开发出了若干 RQA 指标，包括递归点百分比（递归率）、对角线平均长度以及最长对角线长度等。这些指标对于表征和比较不同类型的\
  \ RP 很有用。例如，研究人员 9 从肌电图 10 数据中计算 RQA 指标，并将它们作为特征用于训练 `Support Vector Machine` 分类器，以检测正常和异常的神经肌肉疾病。\n\
  \n我们可以将金融资产价格视为一个动态系统。因此，我们将从利用源自 RP 和 DM 的 RQA 这一前沿科学研究中汲取灵感，以获取洞见。要使用 RQA 评估时间序列中的随机性和可预测性，最重要的两个指标是递归率和确定性。\n\
  \n以下是这些指标的解释：\n\n* **递归率：** `RR` 是递归图中递归点（即低于特定阈值距离的点）所占的比例。它量化了递归图的密度，并给出了系统中状态重复的总体概念。高\
  \ `RR` 表明状态频繁递归，暗示随机性较低。而低 `RR` 表明递归不频繁，暗示随机性较高。\n\n* **确定性：** `DET` 测量在递归图中形成长度至少达到给定值的对角线的递归点的比例。它反映了时间序列的可预测性。高\
  \ `DET` 表明行为更具可预测性且随机性更低，因为系统以确定性方式演变。低 `DET` 暗示更具随机性或复杂性的行为，可预测性较低。\n\n这两个统计量（`RR`\
  \ 和 `DET`），连同它们的乘积和比率，提供了一种评估动态信息的方法（例如量化趋势和随机性）。\n\n例如，对先前介绍的模拟动态（线性、周期性和阻尼振荡）以及信实工业股票价格计算这些统计量，得到以下结果：\n\
  \n| 动态类型 | 递归率 | 确定性 | 乘积 (RR x DET) | 比率 (DET / RR) |\n| --- | --- | --- | ---\
  \ | --- |\n| 线性 | 0.069 | 49.638 | 3.415 | 721.484 |\n| 周期性 | 0.190 | 21.586 | 4.093\
  \ | 113.850 |\n| 阻尼 | 0.158 | 76.379 | 12.075 | 483.131 |\n| 收盘价 | 0.035 | 14.644\
  \ | 0.519 | 413.525 |\n\n表 10.1：确定性与随机动态的 RQA\n\n对于线性动态，`RR` 和 `DET` 暗示低递归性但具有中等可预测性。对于周期性（正弦）动态，`RR`\
  \ 较高，表明具有周期性行为典型的更频繁递归。`DET` 较低，暗示循环模式中的可预测性较低。对于信实工业的股票价格，`RR` 和 `DET` 暗示低递归性和中等可预测性。乘积和比率凸显了股票价格的高变异性和随机性。\n\
  \nRP 和 DM 矩阵，连同衍生的 RQA 统计量，能否为机器学习算法预测市场走势提供足够信息？如果可以，这些基于递归的表征如何改进预测模型？\n\n在下一节中，我们将探讨如何将\
  \ RP、DM 和 RQA 作为特征进行整合，以增强交易模型的预测能力。\n\n### RP 作为交易系统的特征\n\n如果我们将 RP、DM 和 RQA 作为特征纳入机器学习算法会怎样？在本节中，我们将解释并演示如何有效地结合无监督和有监督技术。这种方法很有价值，因为它利用了\
  \ DM 以无监督方式捕捉复杂关系的优势。然后，有监督分类器学习基于这些丰富的无监督特征进行预测。这种结合能产生更稳健、更可解释的模型，特别是在底层结构复杂的金融数据中。\n\
  \n为了理解如何将 RP 和 DM 融入机器学习流程，我们将从一个基础基准开始。通过建立一个简单而有效的基础，我们可以在探索更高级技术之前，评估在机器学习框架中使用\
  \ RP 和 DM 的可行性。\n\n#### 基于基准的方法\n\n基准方法包含寻找使用 DM 或 RP 训练机器学习算法（无论是无监督还是有监督算法）所需的最小必要步骤。如果成功，这种基准方法提供了巨大的改进空间。基准代表最简单的版本，旨在证明其提供稳定收益（夏普比率\
  \ > 0.5）的能力，而非达到最先进的结果。如果基准被证明有效，则有许多方法可以增强和扩充这一初步尝试。\n\n以下是迭代初始信号、在每个时间步计算初始 DM、随后衍生\
  \ RQA 统计量，并将这些二维矩阵转换为适合标准 ML 算法训练的数据结构的最小步骤：\n\n![](img/fig-10-6.png)\n\n如前图所述，在机器学习中使用\
  \ RP 和 DM 的操作序列如下：\n\n1. **数据转换：** 为每个时间步计算 DM 并衍生 RQA 统计量。遍历初始信号，滑动浏览时间序列数据以生成多个时间步。\n\
  2. **标注 11：** 为每个矩阵创建一个标签（分类或回归）。\n3. **展平：** 转换二维矩阵。将衍生的统计量和矩阵转换为一维展平特征向量或与标准机器学习算法兼容的数据结构。\n\
  4. **训练 ML 算法：** 使用这些数据结构训练分类或回归模型。\n\n在以下章节中，我们将仔细研究这些阶段中的每一个，并通过一种资产来实现它们。为了将我们的方法论付诸实践，我们将其应用于一种真实的金融资产。我们选择的资产是\
  \ Teucrium 玉米 ETF 基金，代码为 `CORN`：\n\n![](img/fig-10-7.png)\n\n它是一种在 NYSE Arca 交易的商品交易所交易基金\
  \ (ETF)。该基金旨在跟踪玉米期货价格，为投资者提供了一种便捷的方式来获得玉米市场的敞口，而无需直接参与期货交易。现在我们有了数据集，可以开始分析的初始阶段。\n\
  \n#### 数据转换\n\n首先，我们指定选择哪种矩阵，RP 还是 DM，因为这一选择将影响后续结果。RP 分析的一个局限性是需要指定一个阈值，这可能难以确定。当前方法依赖于局部启发式规则，即根据单个\
  \ RP 设定阈值。然而，在分析多个图时，这可能导致结果不一致。\n\n为克服这一问题，我们利用嵌入在 DM 中的信息。这种方法消除了对阈值的需求，并允许更直接地分析每对子序列之间的距离。\n\
  \n我们采用窗口法从收盘价时间序列中提取小片段，如下图所示：\n\n![](img/fig-10-8.png)\n\n一个滑动窗口 12 (`window`)\
  \ 浏览时间序列 (`series`)，从每个片段提取值并发送它们以计算该特定片段的 DM (`distance_matrix`)：\n\n```\ndef create_distance_matrix(series,\
  \ window_size:\n    matrices = []\n    for i in range(len(series) - window_size\
  \ + 1):\n        window = series[i:i+window_size]\n        distance_matrix = np.abs(window[:,\
  \ None] - window[None, :])\n        matrices.append(distance_matrix)\n    return\
  \ matrices\n```\n\n前述代码使用滑动窗口方法从时间序列中提取连续片段，并为每个片段计算 DM。这有助于捕捉每个窗口内时间序列的局部结构。\n\n\
  #### 标注\n\n\n\n如果我们执行监督学习任务，则必须提供标签。在监督学习中，作为特征的每个 DM 都对应一个待学习的特定目标。无监督 DM 既可用于监督环境，也可用于无监督环境，并可集成到交易中的各种学习范式中。\n\
  \n以下代码定义了监督学习任务所需的标签。既然我们决定预测市场走势，则使用价格变动的方向：正值表示向上运动，负值表示向下运动：\n\n```\n##### Create\
  \ labels\nlabels = np.sign(np.diff(close_prices[window_size - 1:]))\nlabels[labels\
  \ == 0] = -1\n```\n\n在将 DM 输入机器学习模型之前，我们首先将其拆分为训练集和测试集，然后将其展平为一维数组以便正确摄入。\n\n####\
  \ 拆分与展平\n\n拆分步骤是自本书开篇以来我们始终坚持应用的必要步骤，它要求将 DM 拆分为训练集和测试集。\n\n```\n##### Split into\
  \ train and test sets\ntrain_matrices, test_matrices, train_labels, test_labels\
  \ = train_test_split(\n    distance_matrices[:-1], labels, test_size=0.2, shuffle=False)\n\
  ```\n\n这为学习提供了结构化的输入和相应的目标。分离后，这两个集合（训练集和测试集）被展平为一维结构（数组），以供机器学习算法摄入：\n\n![](img/fig-10-9.png)\n\
  \n如前图所示，每个 DM（来自训练集和测试集）均被转换为一维数组：\n\n```\ntrain_matrices_flat = np.array([matrix.flatten()\
  \ for matrix in train_matrices])\ntest_matrices_flat = np.array([matrix.flatten()\
  \ for matrix in test_matrices])\n```\n\n原创且非传统的特征工程至此完成。此时，我们继续进行在训练集上训练机器学习算法并在测试集上对其进行评估的传统步骤。\n\
  \n#### 训练机器学习算法\n\n正如我们已经陈述和解释的那样，基线需要一种算法来证明概念验证：即使是基本的机器学习算法（例如 `LogisticRegression`）也能学习我们拥有的特征并提供一致的预测。这是寻找最佳算法的初步步骤。数据结构（`train_matrices_flat`）形态良好，且已在上一步骤中准备就绪。剩下的就是实例化分类器并进行训练（`fit`），以基于无监督\
  \ DM 特征预测（`predict`）我们的目标：\n\n```\nfrom sklearn.linear_model import LogisticRegression\n\
  \nclf = LogisticRegression(max_iter=1000, solver='liblinear')\nclf.fit(train_matrices_flat,\
  \ train_labels)\ntest_predictions = clf.predict(test_matrices_flat)\n```\n\n####\
  \ 评估基线\n\n现在让我们看看基线模型的表现。我们知道要计算的指标。最初，混淆矩阵和 Scikit-Learn 分类报告（`classification_report`）将提供评估该机器学习算法预测收益符号能力所需的所有信息：\n\
  \n```\n##### Print detailed classification report\nprint(classification_report(test_labels,\
  \ test_predictions))\n```\n\n分类报告：\n\n| | precision | recall | f1-score | support\
  \ |\n| --- | --- | --- | --- | --- |\n| -1.0 | 0.56 | 0.61 | 0.58 | 41 |\n| 1.0\
  \ | 0.43 | 0.38 | 0.40 | 32 |\n| accuracy | | | 0.51 | 73 |\n| macro avg | 0.49\
  \ | 0.49 | 0.49 | 73 |\n| weighted avg | 0.50 | 0.51 | 0.50 | 73 |\n\n对于类别 `-1.0`，精确率为\
  \ 0.56，意味着 56% 的预测负收益是正确的。召回率为 0.61，意味着 61% 的实际负收益被正确识别，同理分析也适用于正类别。\n\n模型在预测负收益方面优于正收益，这由负类别\
  \ `-1.0` 更高的精确率、召回率和 F1 分数表明。这些结果表明有很大的改进空间，特别是在正收益的预测方面。进一步的调优以及引入额外特征或更复杂的算法可能会提高性能。为了进一步评估其有效性，我们现在将对基线模型进行回测，以评估其在买卖金融决策方面的表现。\n\
  \n#### 回测基线算法\n\n通过使用相同的代码对未见过的测试集数据进行回测，利用基线算法生成预测，并模拟包含 3 个基点交易成本的投资，我们获得了以下权益曲线：\n\
  \n![](img/fig-10-10.png)\n\n这些性能指标总结了我们的策略在回测期间的有效性。相关指标如下：\n\n- 初始资金：$100000\n\
  - 最终资金：$120580\n- 年化收益率（0.3 年）：71.0%\n- 夏普比率：2.1\n\n结果表明表现良好，具有较高的年化收益率，且夏普比率显示了有利的风险调整后收益。虽然基线方法提供了一个起点，但有几种方法可以提高其性能。\n\
  \n#### 改进基线版本\n\n关于特征，分类器仅见过 DM，而未见过任何收盘价。纳入收盘价（或 OHLC 数据的任何组合）将是一个好主意。此外，还有许多其他有趣的特征可提供给\
  \ ML 算法，详见 第 6 章 *利用特征提升模型能力*。\n\n正如 第 7 章 *交易的高级机器学习模型* 所讨论的，我们应该探索比基线所用的基本逻辑回归更先进的方法，如提升、装袋、集成和投票算法。我们还可以利用自动化方法，如\
  \ 第 8 章 *交易策略的 AutoML 与低代码* 所述，来改进特征工程。自动化特征工程库可以简化相关特征的创建过程，AutoML 平台则自动化了为给定数据集和问题选择最佳机器学习算法的过程。\n\
  \n在对 DM 和 RP 有了扎实理解后，我们现在转向另一种称为模式匹配的无监督技术，它允许我们识别和提取数据中的有意义模式。\n\n### 模式匹配\n\n\
  模式匹配是指在数据集中识别相似模式的过程。它有助于发现重复序列或异常。例如，在量化金融中，模式匹配可以检测不同股票间相似的价格走势，从而辅助预测未来价格趋势。存在许多模式匹配方法，其中最强大的包括：动态时间规整（DTW）、隐马尔可夫模型（HMM）、傅里叶变换（FT）和矩阵剖面。在简要介绍演示\
  \ DTW 后，我们将简要介绍 HMM 和 FT 方法，但重点详细探讨后者。\n\n安装所需库后，以下代码演示了 DTW 如何通过测量两个时间序列间的相似性来帮助模式匹配，即使它们在速度或时间上有所变化：\n\
  \n```\n!pip -q install fastdtw\n\nfrom fastdtw import fastdtw\nfrom scipy.spatial.distance\
  \ import euclidean\n\n### Create two time series time_series_1 and time_series_2\
  \ with oscillations\n### Compute DTW distance\ndistance, path = fastdtw(time_series_1,\
  \ time_series_2, dist=lambda x, y: euclidean(x.flatten(), y.flatten()))\n\nfor (map1,\
  \ map2) in path:\n    plt.arrow(map1, time_series_1[map1], map2 - map1, time_series_2[map2]\
  \ - time_series_1[map1], color='black', length_includes_head=True, head_width=0.05)\n\
  ```\n\n下图展示了 DTW 如何灵活调整序列，即使模式不同步或长度不同也能对齐。这使其在检测时间序列数据中的相似模式时非常有用，即使存在时间差异：\n\n\
  ![](img/fig-10-11.png)\n\n\n\n连接时间序列的线条展示了对齐情况，有助于理解 DTW 路径。此示例演示了 DTW 如何匹配复杂的振荡时间序列，即使存在相位偏移和噪声。\n\
  \n我们将简要介绍另外三种主要方法并进行对比。\n\nHMM 通过将时间序列数据建模为具有概率转移的状态序列来辅助模式匹配。它们可以识别隐藏状态及其转移，有效捕捉时间模式，并允许识别数据中复杂的重复序列。与矩阵剖面模式匹配方法相比，HMM\
  \ 的调优更为复杂。\n\n用于模式匹配的 FT 涉及将时间序列转换到频域以识别和比较周期性模式。FT 可以检测数据不同部分之间的相似性和重复周期，但 FT 在捕捉非平稳模式和局部异常方面存在局限。\n\
  \n我们不详细描述 FT 或 HMM，因为使用最先进的库（如下一节介绍的库）进行现代模式识别，既更强大又更灵活。它能处理大型数据集，适应动态结构，并提供对时间序列模式更丰富的洞察。\n\
  \n矩阵剖面模式匹配涉及识别并排序时间序列中最相似的子序列。在下一节中，我们将此技术同时应用于归一化价差和资产价格，从而检测价格变动中的重复模式及偏离历史均值的情况。\n\
  \n### 使用矩阵剖面进行快速模式匹配\n\n矩阵剖面是实现模式匹配的关键数据结构。它计算时间序列中所有子序列之间的距离，创建一个突出显示重复模式和异常区域的剖面。这使得识别和分析数据中的相似序列变得更加容易。我们使用一个名为\
  \ Stumpy 的 Python 库，它是计算矩阵剖面的高度优化实现，很可能是该领域最好的工具。这种方法超越了常用的简化实现。Stumpy 采用先进的数学技术，提供了一个高效的库，能够处理大数据、高频交易和海量实时数据流。\n\
  \n我们现在将对该工具进行首次实操探索，以实践其功能。以下代码安装并导入 Stumpy：\n\n```\n!pip -q install stumpy\nimport\
  \ stumpy\n```\n\n我们将使用来自 Yahoo Finance 的比特币（BTC 代码）日收盘价时间序列进行实验，涵盖 2015 年至 2024\
  \ 年期间：\n\n![](img/fig-10-12.png)\n\n在以下章节中，我们将使用矩阵剖面首先探索相似性，然后识别时间序列数据中的特定模式。\n\n\
  #### 使用矩阵剖面查找相似性和异常\n\n本节探讨矩阵剖面。我们将计算剖面并识别关键模式、主题（相似序列）和异常（不相似序列）。引入归一化是为了通过关注形状而非尺度来优化比较。\n\
  \n最后，您将看到这种方法如何揭示金融数据中的隐藏结构，辅助模式识别和预测，具体步骤如下：\n\n1. 第一步是定义用于分析的窗口长度（`m`）：`m = 640`\n\
  2. 第二步是计算矩阵剖面，它将包含整个时间序列中所有子序列之间的距离信息，如下所示：\n\n```\nts = df.iloc[-1500:]['Close']\n\
  mp = stumpy.stump(ts, m)\nplt.plot(mp[:, 0])\n```\n\n下图展示了矩阵剖面：\n\n![](img/fig-10-13.png)\n\
  \n所示的矩阵剖面图展示了收盘价中子序列的相似性。矩阵剖面中较低的距离值（如索引 200 和索引 800 附近的值）表示子序列彼此相似，提示存在主题或重复模式。\n\
  \n另一方面，较高的峰值（如图中位于索引 237 处的峰值）表示与时间序列任何其他部分都不太相似的子序列，可能凸显独特或异常事件。虚线可能标记检测到主题或异常的重要点。\n\
  \n之后，我们可以根据目标提取相应的子序列对：寻找距离最小的最相似对（称为主题），并识别距离最大的最不相似对（称为异常）。配对按距离递增顺序排序。\n\n要识别最不相似的配对，我们在矩阵剖面中寻找距离最大的子序列以识别最不相似的配对。以下代码提取并定位时间序列中的此异常：\n\
  \n```\nmotif_idx_1 = np.argsort(mp[:, 0])[-1]\nprint(f\"The discord is located at\
  \ index {motif_idx_1}\")\ndiscord_idx = mp[motif_idx_1, 1]\n```\n\n以下输出显示了后续代码的结果，突出了时间序列中识别出的异常：\n\
  \n```\nThe discord is located at index 237\n```\n\n此代码已识别出矩阵剖面中所有子序列中最大的异常。对应的子序列（位于索引\
  \ `motif_idx_1` 和 `discord_idx`）在下图中高亮显示：\n\n![](img/fig-10-14.png)\n\n与简单的相似度度量不同，异常检测不依赖于序列长度相同或完美对齐。相反，它对它们进行标准化以进行最佳比较，确保捕捉到最有意义的差异，无论时间序列中的尺度或位置如何。\n\
  \n相反，第一个索引（`motif_idx_2`）代表最小距离，指示最相似的配对（主题）：\n\n```\nmotif_idx_2 = np.argsort(mp[:,\
  \ 0])[0]\nnearest_idx = mp[motif_idx_2, 1]\nprint(f\"The motif is located at index\
  \ {nearest_idx}\")\n```\n\n以下是上述代码块的输出：\n\n```\nThe motif is located at index 830\n\
  ```\n\n此代码已识别出所有序列中最大的主题。对应的序列在下图中高亮显示：\n\n![](img/fig-10-15.png)\n\n主题检测与异常检测一样，对序列进行标准化以确保最佳比较。这使得它能够识别数据中有意义的重复，无论其位置或确切尺度如何。\n\
  \n如上所述，由于提取的模式不同时发生，很难充分理解它们的相似或不相似程度。例如，最相似的序列可能相隔数年。对于表现得像气泡一样的比特币等资产，这一点尤为重要。为了校正这种影响，我们必须对子序列进行归一化。归一化序列允许更精确的比较，减少尺度差异的影响，并专注于形状和模式的相似性或差异。\n\
  \n归一化通过以下代码完成：\n\n```\ndf_norm = stumpy.core.z_norm(df['Close'].values)\n```\n\n\
  下图比较了归一化后的异常和主题子序列：\n\n![](img/fig-10-16.png)\n\n左侧的异常图显示了两个最不相似的子序列。尽管经过归一化，这些子序列在形状和趋势上仍显示出明显差异，表明这些时期时间序列行为存在显著分歧。右侧的主题图展示了最相似的子序列。这些子序列在整体形状和模式上非常相似，反映了时间序列数据中的重复行为。这对于金融背景下的模式识别或预测可能特别有价值。\n\
  \n\n\n\n##### 使用矩阵剖面搜索模式\n\n利用矩阵剖面，我们可以在时间序列中搜索与特定关注模式最相似的子序列。例如，我们应识别过去最接近 16 最后\
  \ 80 天数据的时期。通过将最后几天设为参考序列，矩阵剖面可以识别整个时间序列中的相似模式，从而让我们识别出可能预示未来趋势的过去事件。该技术对于预测或识别与特定市场状况相符的数据中的关键特征特别有用。\n\
  \n值得注意的是，我们的分析是使用归一化价差 z-score 进行的，这是一种在第 1 章《算法交易与机器学习概览》中详细描述并在后续章节中讨论的归一化技术。提醒一下，z-score17\
  \ 代表收盘价与移动平均线之间的价差，以标准差形式表示。这种方法提供了监控 z-score 价差有助于识别资产价格显著偏离其历史平均值的时期，从而发出超买或超卖信号。较高的正\
  \ z-score 表明价格相对于其历史表现异常高，暗示可能出现均值回归或回调；而较低的负 z-score 则表明相反情况。交易者利用此信息来预判反转或确认趋势强度，从而改进进出场时机。\n\
  \n为了增强此分析，我们利用矩阵剖面识别历史数据中的相似序列，从而检测可能预示盈利交易机会的循环模式。我们将使用矩阵剖面在整个历史数据中识别最相似的序列（模式匹配）。\n\
  \n为应用此概念，我们在定义的窗口上计算滚动均值和标准差。这使我们能够计算 z-score，基于局部趋势对收盘价进行标准化。\n\n以下代码执行这些计算：\n\n\
  ```\nwindow = 20\n\ndf['rolling_mean'] = df['Close'].rolling(window=window).mean()\n\
  \ndf['rolling_std'] = df['Close'].rolling(window=window).std()\n\n##### 计算 z-score\n\
  df['z_score'] = (df['Close'] - df['rolling_mean']) / df['rolling_std']\n```\n\n\
  下图展示了比特币过去十年的 z-score 计算结果：\n\n![](img/fig-10-17.png)\n\n高亮显示的序列代表最后 80 天，我们将其用作查询（`Q_df`），以在整个历史数据中搜索相似模式。\n\
  \n以下是定义此查询搜索的代码：\n\n```\nlength_hint = 80\n\n##### 定位待搜索序列的起始位置\nidx_begin_query\
  \ = df.shape[0] - length_hint\n\n##### Q 查询（搜索什么）和 T 目标（在哪里搜索）：\nT_df = df.iloc[:idx_begin_query]['z_score']\n\
  Q_df = df.iloc[idx_begin_query:]['z_score']\n\nprint(f'query to search begin at\
  \ position : ', df.iloc[idx_begin_query].name)\n```\n\n上述代码的输出如下：\n\n```\nquery\
  \ to search begin at position : 2024-01-08 00:00:00\n```\n\n接下来，我们将使用以下代码计算矩阵剖面：\n\
  \n```\ndistance_profile = stumpy.core.mass(Q_df, T_df)\n```\n\n然后我们在下图中绘制矩阵剖面：\n\
  \n![](img/fig-10-18.png)\n\n低谷（表示最小距离）代表所有循环模式的位置，而峰值（表示最大距离）代表异常模式。\n\n在下图中，我们将查询（以红色显示的比特币时间序列最后\
  \ 80 天）与使用矩阵剖面识别出的最相似的过去模式进行比较：\n\n![](img/fig-10-19.png)\n\n在所示图表中，我们有查询序列以及在历史数据中使用矩阵剖面识别出的最近邻子序列。细线代表第二和第三近的匹配（邻居）。正如我们所见，最近邻紧密跟踪查询序列，表明过去曾出现过非常相似的模式。这表明时间序列中可能存在循环行为，这对预测或分析可能有价值。\n\
  \n第二和第三近邻虽然相似度稍低，但仍遵循查询的总体趋势，提供了额外的背景信息和模式匹配的置信度。这种方法不仅让我们能够识别相似模式，还能比较多个实例，以了解这些模式随时间变化的多样性和稳健性。矩阵剖面技术结合\
  \ z-score 归一化，使跨不同时间段和市场条件的模式比较与分析变得更加容易。\n\n这种方法对于检测循环行为或模式特别有用，例如识别市场行为与近期趋势相似的过去时期。一旦找到最相似的模式，即可对其进行分析，以获得对潜在未来走势的洞察。\n\
  \n在下图中，匹配子序列的可视化表示有助于识别历史数据中的关注区域：\n\n![](img/fig-10-20.png)\n\n在该图中，我们再次展示了查询及其邻居。有趣的是，时间顺序与循环模式的搜索完全无关；事实上，最近的序列并非最相似的。\n\
  \n最近邻显示出与近期趋势的最高相似性，暗示市场行为可能重复。其他两个邻居相似度稍低，但仍显示出与查询匹配的可识别模式。\n\n这些可视化有助于理解时间序列中的过去事件如何与当前趋势相关联。通过识别这些相似时期，我们可以基于历史模式获得对潜在未来走势的洞察。发现此类循环模式并了解市场在类似过去情况下的反应能力，对金融市场预测极具价值。\n\
  \n在下图中，我们展示了历史数据中与查询模式最匹配的各个子序列：\n\n![](img/fig-10-21.png)\n\n跨不同年份的片段集中表明，相似的市场行为在过去曾多次发生。此可视化让我们能够了解这些相似模式出现的频率和时间。\n\
  \n## 结论\n\n本章演示了无监督学习技术在量化交易中的实际应用，重点介绍了 DM、RP 和矩阵剖面等非正统、最先进且原创的工具。这些方法被成熟的专业交易员广泛使用，却被大多数人忽视，为金融市场提供了独特的优势。它们检测时间序列数据中循环模式和异常的能力，提供了对市场行为的更深层洞察，并允许交易者进行不盲从大众的交易。\n\
  \n通过将这些技术集成到机器学习模型中，交易者可以提高市场趋势预测的精度，并开发更稳健的交易策略。除了单纯识别时间序列数据中的结构外，这些方法还允许基于模式的交易，有助于发掘传统指标往往错过的隐藏市场动态。理解主题模式和异常，能够创造出独特、非共识的策略，使其区别于主流方法。\n\
  \n这些洞察保持了相对于大多数人使用的传统策略的独特优势。\n\n\n\n\n我们现在将重点转向另一种未被充分利用但极具潜力的方法：利用自然语言处理（NLP）分析金融文本。虽然大多数量化策略仅依赖价格等数值数据，但现代机器学习技术使我们能够从金融新闻、报告和文本信息中提取有价值的交易洞察。\n\
  \n在下一章中，我们将探讨如何处理和构建基于文本的金融数据，绘制公司间的关系图谱，并以一种能增强决策能力的方式可视化这些关联。我们还将演示如何将这些洞察直接应用于投资组合构建，为分散投资和风险管理提供超越传统基于价格方法的全新视角。\n\
