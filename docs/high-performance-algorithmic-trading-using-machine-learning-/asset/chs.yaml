  \n# 第 8 章\n\n**面向交易策略的 AutoML 和低代码**\n\n## 简介\n\n基于机器学习开发交易算法需要广泛的领域知识，不仅涉及金融，还涉及统计和机器学习技术。这种双重要求是该领域许多专业人士的重要准入障碍。然而，自动化机器学习（AutoML）和低代码平台的出现已经开始彻底改变这一领域，提供了强大的工具，使复杂交易策略的开发民主化。\n\
  \n低代码和 AutoML 平台显著降低了开发机器学习模型的准入门槛，使其能被更广泛的受众使用，包括那些没有深厚编程背景的人。这与普及先进数据分析和模型开发工具的主题非常契合，特别是在金融交易策略的背景下，用户群体可以从高技术的数据科学家到编码经验有限的金融分析师。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n• AutoML 和低代码简介\n\n• 全球宏观建模\n\n• 手工算法作为基准\n\n• AutoML\
  \ 的核心组件\n\n• 与手动方法的结果对比\n\n## 目标\n\n\n\n\n## AutoML 和低代码平台\n\nAutoML 和低代码平台并未引入新方法；相反，它们简化并自动化了机器学习流程的关键组件。\n\
  \n本章将探讨这些工具如何高效优化 第 6 章 *利用特征提升模型能力* 中涵盖的技术、第 7 章 *用于交易的高级机器学习模型* 中的模型选择与集成方法，以及\
  \ 第 3 章 *优化交易系统、指标与自动化报告* 中的超参数优化。\n\n读完本章后，读者将能够使用 AutoML 和低代码平台开发高效且自动化的交易策略。他们将对全球宏观建模有扎实的理解，并具备将宏观经济特征纳入预测模型的能力。此外，他们将学会使用\
  \ AutoML 工具自动化关键的机器学习流程，如特征工程、模型选择、超参数调优和评估。最后，他们将能够实现并对比使用传统方法开发的交易策略与使用最先进的 AutoML\
  \ 和低代码框架开发的策略，从而获得一种更具适应性和可扩展性的算法交易方法。\n\n### AutoML 和低代码简介\n\nAutoML 完全自动化了模型选择、训练和优化这些繁琐且复杂的过程。该过程涵盖从数据预处理和特征选择到超参数调优和模型验证的所有环节。\n\
  \n低代码平台通过最大程度减少大量编码的需求来简化开发流程。与完全依赖图形用户界面进行应用开发的 `no-code`[¹] 平台不同，低代码平台需要一定的编码量，但显著降低了构建模型所需的复杂性和代码量。因此得名“低代码”。它们使模型开发更快捷，也让编程技能有限的人员更容易上手。\n\
  \n在讨论低代码与 AutoML 工具的区别时，一个常见的困惑来源是两者之间的重叠。虽然它们似乎需要不同程度的编码，但这种区别可能变得模糊。当你开始使用 AutoML\
  \ 库自定义选项时，你实际上正在向低代码开发迈进。另一方面，如果你使用低代码库时不指定任何选项，而是让工具自行决策，那么你就在接近 AutoML 的功能。因此，最好将低代码和\
  \ AutoML 工具视为一系列互补且重叠的解决方案的光谱，而非纠结于用来描述它们的标签。重点应放在理解如何有效使用这些工具上，而不是它们的标签上。\n\n###\
  \ 全球宏观建模\n\n我们展示的数据集为：CBOE 10 年期美债利率指数，代码为 `^TNX`。该期货合约代表美国 10 年期债务，在全球广泛交易，作为从政府债务到企业债务等各类债券交易的基准。\n\
  \n下图直观展示了该合约，突显其历史走势与趋势：\n\n![](img/fig-8-1.png)\n\n我们首先收集该合约的历史数据，随后使用 `Scikit-learn`\
  \ 执行一个简单的建模练习。此初始建模的结果将作为后续使用 AutoML 和低代码平台进行分析的基准。\n\n我们的目标是利用机器学习复制对冲基金经理使用的一种策略，即全球宏观策略。该策略涉及在考虑基本面宏观经济驱动因素（如通货膨胀、商品周期、GDP\
  \ 增长及其他相关因素）的前提下，分析和预测金融资产的走势。\n\n宏观策略师的主要关注点在于理解宏观经济变量对资产价格的影响，以做出明智的投资决策。机器学习可通过将宏观经济变量作为特征来预测美国\
  \ 10 年期国债收益率，从而协助这一工作。\n\n#### 宏观经济特征\n\n将 10 年期国债收益率[²] 预测作为回归任务，涉及选择被认为会影响利率的输入变量。这些变量包括经济指标、金融市场数据和其他宏观经济因素的组合。\n\
  \n用于预测 10 年期国债收益率的变量列表。我们列出了每个特征的雅虎财经代码，并简要说明其与债券收益率的相关性：\n\n- **标普 500 指数** (代码：`SPY`)：反映整体股市表现\n\
  - **道琼斯工业平均指数** (`DJI`)：经济前景的晴雨表\n- **罗素 2000 指数** (`IWM`)：衡量小盘股表现\n- **黄金价格** (`GC=F`)：金价可能与经济信心呈反比关系\n\
  - **原油价格** (`CL=F`)：油价可反映通胀预期\n- **铜价** (`HG=F`)：因其广泛的工业用途而具备预测经济趋势的能力\n- **白银价格**\
  \ (`SI=F`)：类似黄金，但工业用途更多\n- **美元指数** (`DX-Y.NYB`)：美元兑一篮子货币的强弱会影响国债收益率\n- **欧元兑美元汇率**\
  \ (`EURUSD=X`)：反映欧元对美元的强弱，影响国际投资流向\n- **日元** (`JPY=X`)：日元是另一种避险货币；其汇率影响美国债券收益率\n\
  - **VIX - CBOE 波动率指数** (`VIX`)：市场的恐慌指标；波动率上升导致收益率下降，因投资者寻求债券避险\n- **高收益公司债** (`HYG`)：高收益债券反映风险承受能力并影响国债收益率\n\
  - **投资级公司债** (`LQD`)：展示更安全的企业债务表现，是国债的直接竞争对手\n- **房地产投资信托指数** (`VNQ`)：REIT 表现反映房地产市场健康状况和通胀预期\n\
  - **消费者价格指数 (CPI) 代理（通过 ETF 如：通胀保值国债 (TIP)）**：作为通胀预期的代理指标\n- **联邦基金利率** (通过 `^IRX`\
  \ 等代理指标)：美联储设定的短期利率直接影响国债收益率\n\n首先，我们使用雅虎财经 API 获取所需特征。接着，使用 `Pandas` 库计算这些特征的百分比变化。最后，构建相关性矩阵以直观展示这些关键宏观经济驱动因素与我们主要预测目标——10\
  \ 年期国债收益率——之间的经济关系。\n\n这一过程使我们能更好地理解影响 10 年期国债收益率的因素，如下图所示：\n\n![](img/fig-8-2-corr.png)\n\
  \n相关性图提供了不同资产类别相对于 10 年期美国国债收益率（第一列中用 `Close_ret` 表示）变动关系的洞见。\n\n- **负相关**（图中小圆点\
  \ `'.'`）：黄金 (`GC=F_Close`) 等金属属于此类。黄金被视为不产生利息的避险资产。当债券收益率上升时，持有黄金的机会成本增加，因为投资者无需承担持有非生息资产的风险即可获得更高收益。白银和铜遵循类似模式，但铜\
  \ (`HG=F_Close`) 还受工业需求影响，这会影响其与债券收益率的相关性。\n\n与 `HYG`（高收益债券）和 `LQD`（投资级债券）的负相关反映了市场风险情绪，因为收益率上升通常会推低公司债券价格。公司债与国债之间利差的扩大具体化了信用风险，凸显了政府借贷成本与私营企业借贷成本之间的差异。\n\
  \n[¹]: 原文脚注引用。\n[²]: 原文脚注引用。\n\n\n\n\n• 正相关（图中较大的“O”）：在货币背景下，较高的债券收益率会增强本国货币，因为它吸引寻求更高回报的外国投资，影响\
  \ `EURUSD` (`EURUSD=X_Close`) 和 `JPY` (`JPY=X_Close`) 等货币对。\n\n我们的目标是利用这些宏观经济变量预测两天前的收益率（`ahead\
  \ = 2`），并制定能够利用这些预测的交易策略：\n\n```\nahead = 2\n\ndf['target'] = df['Close'].shift(-ahead)\n\
  ```\n\n### 手工算法作为基准\n\n在本节中，我们旨在进行一项基础且稳健的基准测试，以比较 AutoML 和低代码 API 所有结果。我们的目标不是探索复杂方法以取得卓越成果，而是建立一个可靠的比较基准。这将使我们能够评估每种方法（AutoML\
  \ 和低代码）的性能，并根据它们的相对优势和劣势做出明智决策。\n\n此次比较的一个关键原则是奥卡姆剃刀原则，即除非更复杂的方法展现出明显优势，否则应优先选择更简单的模型。如果复杂的\
  \ AutoML 或低代码解决方案无法超越快速的基准回归，则不予考虑，因为其增加的复杂性无法证明其使用的合理性。这确保了模型选择在性能指标和计算效率之间取得平衡，保持了算法交易实用且有效的方法。\n\
  \n#### LASSO\n\n最小绝对收缩和选择算子（LASSO）算法因其内在的正则化能力，是基准测试的绝佳选择。通过引入正则化，L3￼ 允许选择一份简洁的重要特征清单，这有利于在使用线性算法的回归分析初期取得可靠结果：\n\
  \n```\nfrom sklearn.linear_model import LassoCV\n```\n\n`X` 包含宏观经济特征，`y` 包含我们旨在学习预测的目标值：\n\
  \n```\ny = df.pop('target')\n\nX = df.copy()\n\nX_train , X_test , y_train , y_test\
  \ = train_test_split(X , y , shuffle = True)\n\nrgr = LassoCV()\n\nrgr.fit(X_train\
  \ , y_train)\n```\n\n结果如下：\n\n```\nfrom sklearn.metrics import mean_squared_error\n\
  \nprint('RMSE = ',np.sqrt(mean_squared_error(pred , y_test)))\n\nprint(np.round(rgr.score(X_test\
  \ , y_test),3))\n```\n\n```\nRMSE = 0.54\n\n0.397\n```\n\n正如预期的那样，结果尚可但不算出色。指标损失均方根误差（RMSE）表明，收益率预测误差的标准差约为\
  \ 0.54，这意味着例如实际收益率为 2.0 时，预测值可能在 1.54 到 2.54 之间。\n\n关于 R2 分数，其范围为 -1 到 +1，+1 表示完美预测，分数越高越好。我们的分数约为\
  \ 0.4，虽然不算灾难性，但明显低于最佳可能结果。\n\n下图展示了预测值与真实值的对比：\n\n![](img/fig-8-3.png)\n\n紧贴完美拟合对角线的预测值通常表示与真实值高度一致。然而，在本例中，未观察到这种理想的一致性。\n\
  \n下图证实了这一点：\n\n![](img/fig-8-4.png)\n\n预测值遵循真实值的总体趋势，表明模型已捕捉到数据中的潜在模式。在接下来的章节中，我们将看到自动化方法（AutoML\
  \ 和低代码）是否能提高这些预测的精度，并做得比我们简要分析更好。\n\n## AutoML 的核心组件\n\n让我们探讨如何自动处理机器学习项目的复杂任务（特征工程与选择、算法选择、超参数优化和模型评估），所采用的方法、其计算需求，以及结果与我们手动方法的对比。\n\
  \n### 特征工程与选择\n\n特征工程涉及从原始数据创建新输入变量以提高模型预测能力。相比之下，特征选择侧重于选择最相关的特征以提高效率并减少过拟合。这些过程对构建高性能模型至关重要，因为它们决定了输入算法的信息内容。\n\
  \n关于特征工程与选择技术的详细探讨，第 6 章“利用特征提升模型能力”专门讨论此主题。在此，我们将使用自动化工具来简化流程，并将其与传统手动方法进行比较。\n\
  \n我们可以使用专为自动化特征工程设计的库来简化相关特征的创建。\n\n#### 使用 Feature-engine 进行特征工程\n\n我们从 Feature-engine4\
  \ 开始，这是一个拥有多种转换器的 Python 库，用于为机器学习模型设计特征和选择特征。\n\n以下命令安装该库：\n\n```\n!pip install\
  \ -q feature-engine\n```\n\n其余代码很简单，本质上涉及选择一组特征子集（`variables=[...]`）并对其应用特定变换（`func\
  \ = [...]`）。这些变换旨在通过创建捕捉数据关系和模式的新特征来提高预测能力。`MathFeatures` 对选定变量应用数学运算（如求和、乘积、平均值），而\
  \ `RelativeFeatures` 和 `CyclicalFeatures` 有助于捕捉数据中的相对变化和季节性模式。\n\n以下代码演示了如何应用这些变换：\n\
  \n```\nfrom feature_engine.creation import MathFeatures , RelativeFeatures , CyclicalFeatures\n\
  \nmf = MathFeatures(variables=['Open_ret', 'High_ret', 'Low_ret', 'Close_ret'] ,\
  \ func = [\"sum\",\"prod\",\"mean\"])\n```\n\n定义转换器（`mf`）后，将其应用于包含初始化阶段提供的指定特征集（`['Open_ret','High_ret','Low_ret','Close_ret']`）的\
  \ DataFrame（`df`）：\n\n```\ndf_feat = mf.fit_transform(df)\n```\n\n指定的变换列（最后三列，`df_feat.iloc[:,-3:]`）通过\
  \ `pd.concat()` 与其余特征合并：\n\n```\ndf = pd.concat([df , df_feat.iloc[:,-3:]] , axis\
  \ = 1)\n```\n\n随后，对一组新特征应用额外的变换 5，从而自动创建了数千个工程特征，本例中恰好为 1332 个：\n\n```\ndf.info()\n\
  ```\n\n```\n<class 'pandas.core.frame.DataFrame'>\nDatetimeIndex: 2668 entries,\
  \ 2010-01-05 to 2022-03-01\nColumns: 1332 entries, Open to High_ret_add_High_ret\n\
  ```\n\n在本节中，我们使用 Feature-engine 自动化特征工程，利用数学变换从现有特征创建新特征。这些变换扩展了我们的数据集，以捕捉更多可提高预测性能的复杂关系。通过应用这些方法，我们生成了大量工程特征，为更高级的模型开发奠定了基础。\n\
  \n接下来，我们将探索 autofeat，另一个专为自动化特征工程和选择设计的强大库。虽然 Feature-engine 侧重于结构化变换，但 autofeat\
  \ 将特征选择与工程相结合，通过自动识别最相关变量来帮助优化数据集。\n\n#### 使用 autofeat 进行特征工程与选择\n\n我们现在使用 autofeat6，一个同样致力于自动化特征工程和选择的库。我们在以下代码中安装\
  \ autofeat 库并进行初始化：\n\n```\n!pip3 install -q autofeat\n```\n\n我们使用要执行的特征工程步骤数（`feateng_steps`）初始化\
  \ autofeat 模型：\n\n```\nauto_feat = AutoFeatRegressor(verbose=1, feateng_steps =\
  \ 1)\n```\n\n\n\n然后，我们在选定的数据集上拟合模型。此步骤将生成新特征并为我们的模型选择最佳特征：\n\n```\nX_train_feat\
  \ = auto_feat.fit_transform(X_train[['Open_ret','High_ret','Low_ret','Close_ret']]\
  \ , y_train)\n```\n\n[featsel] 正在缩放数据...完成。\n\n然后，使用应用于训练集的相同转换和特征工程步骤来转换测试集（`X_test`）：\n\
  \n```\nX_test_feat = auto_feat.transform(X_test[['Open_ret','High_ret','Low_ret','Close_ret']])\n\
  ```\n\n我们检查自动生成并选定的列：\n\n```\n##### columns from AUTO features engineering :\nlst\
  \ = list(set(X_train_feat.columns) - set(X_train.columns))\nlst\n```\n\n```\n['Abs(High_ret)',\
  \ 'High_ret**2', 'Open_ret**3', 'Close_ret**2',\n '1/High_ret', 'Abs(Close_ret)',\
  \ 'Abs(Open_ret)','Abs(Low_ret)', 'Open_ret**2']\n```\n\n选定的列经过了各种数学函数的应用，产生了许多潜在特征。库\
  \ `autofeat` 随后缩小了这一大量新创建特征的范围，仅保留那些具有预测能力并能预测结果的特征。\n\n### 算法选择\n\nAutoML 平台实现了算法选择的自动化，即为给定数据集和问题选择最佳机器学习算法的过程。这通常通过搜索策略的组合来实现，例如网格搜索、随机搜索，或更复杂的方法，如用于\
  \ `auto-SkLearn`7 工具的贝叶斯优化，或用于 `TPOT`8 的遗传编程。\n\nAutoML 平台根据预定义指标，针对数据集评估从线性模型到复杂集成方法的多种算法，以确定哪种算法产生最有希望的结果。\n\
  \n这种从简单到更复杂模型的逐步推进是机器学习开发的基本原则。我们在第 5 章《交易系统的监督学习》和第 7 章《交易的高级机器学习模型》中遵循了相同的方法，首先介绍简单的线性模型（如逻辑回归），然后在后续章节中增加复杂度。这一迭代过程将持续直到达到所需的性能水平。\n\
  \n机器学习从业者广泛使用这种方法论，且与前文讨论的奥卡姆剃刀原则一致。AutoML 平台通过系统地自动化搜索过程来封装这种方法，从更简单的模型开始，仅在必要时增加复杂度。通过这种方式，它们在保持可解释性、计算效率和预测性能之间平衡的同时，简化了模型开发。\n\
  \nAutoML 和复杂的低代码平台 9 为用户提供了简化的界面以启动算法选择过程。用户可以指定其问题类型（例如分类、回归等），并让平台推荐或自动选择要尝试的最佳算法，将对深度编程和机器学习知识的需求降至近乎为零。\n\
  \n#### 使用 FLAML 进行 AutoML\n\n此类高级 AutoML API 的一个完美示例是微软研究院开发的快速 AutoML 与调优库 (10)。\n\
  \n在微软研究院网站上，`FLAML` 被介绍为一个用于高效自动化机器学习和 AI 操作的轻量级 Python 库。它基于大语言模型、机器学习模型等自动化工作流，并优化其性能。\n\
  \n(https://microsoft.github.io/FLAML)\n\n在以下代码中，我们安装该库，然后定义我们要解决的问题类型（`task= “regression\"\
  `），提供数据，并指定该过程允许的时间预算（`time_budget`，单位为秒）。时间预算设定了 AutoML 搜索最佳模型的时长上限，确保在预定义的时间范围内平衡计算效率与模型性能：\n\
  \n```\n!pip install -q flaml\n\nfrom flaml import AutoML\n\nautoml = AutoML()\n\n\
  automl.fit(X_train, y_train, task=\"regression\", time_budget=60)\n```\n\n执行此代码使\
  \ AutoML 引擎能够探索和评估各种复杂算法（如 `XGBoost`、`LightGBM`、`extra_tree` 和 `RandomForestRegressor`），以在遵守指定时间限制（本例中为一分钟）的前提下，为我们的挑战找到最有效的解决方案。\n\
  \n生成的输出如下：\n\n```\n[flaml.automl.logger: 02-27 23:51:27] {1679} INFO - task = regression\n\
