  - 总盈亏：1138014.42\n- 平均每笔交易收益：580.62\n\n我们的统计套利系统给出了令人鼓舞的结果，这与 Ed Thorp 提供的信息一致：\n\
  \n![](img/fig-1-1.png)\n\n现在我们已经实现了统计套利的逻辑，让我们看看系统化交易（统计套利属于此类）与自由裁量交易之间的区别，以充分了解这两种主要投资方法的优缺点。\n\
  \n## 自由裁量交易 vs. 系统化交易\n\n系统化交易涉及使用计算机算法，基于预定义的规则和标准做出交易决策。这种方法消除了交易决策中的情绪偏见和主观性，提供了客观性。然而，系统化交易在独特情境或市场条件突变时可能存在局限性，因为预定义的规则和算法可能并不总能捕捉或适应这些变化。您必须牢记这一局限性。即使是最复杂的系统化规则，在完全前所未有且极不可能发生的情况下，也很可能会过时且失效。\n\
  \n另一方面，自由裁量交易依赖个人交易员或团队的技能来做出交易决策。这种方法能在应对独特的市场情境或市场条件的突然变化时提供更大的灵活性。\n\n关于系统化策略是否优于自由裁量策略，没有确定的答案，因为这取决于多种因素，包括市场条件、所采用的具体策略以及个人交易员或团队的技能。一些研究表明，结合这两种方法可以带来诸如改善投资组合多元化和在整个市场周期中实现更稳健的风险管理等益处。\n\
  \n就我们而言，在本书的剩余部分我们将讨论系统化交易。在了解了系统化交易背后的动机后，我们现在将探讨算法交易中采用的核心策略。\n\n## 算法策略的主要类型\n\
  \n当我们步入系统化交易的领域时，了解系统化交易的主要方法及其区别至关重要。我们将概述统计套利策略，详述在基础设施（所需设备）和理论背景方面最具代表性且最易上手的策略。\n\
  \n### 动量与趋势跟踪策略\n\n该策略旨在利用现有市场趋势的延续，买入呈上升趋势的证券，卖出呈下降趋势的证券。这可能是最知名且最直观的策略。\n\n在本例中，系统化交易策略将利用上升趋势（图\
  \ 1.2 中的红线）。为此，您必须足够早地识别趋势以加以利用，并区分虚假信号（数量最多）和真实机会。\n\n![](img/fig-1-2.png)\n\n\
  ##### 统计套利\n\n该策略涉及使用统计建模来识别和利用市场低效性。统计套利的两大主要策略是配对交易和均值回归。\n\n##### 配对交易\n\n20\
  \ 世纪 80 年代末，配对交易在摩根士丹利兴起，由 Nunzio Tartaglia 及其团队主导。后来，团队成员创立了知名对冲基金，如 PDT Partners\
  \ 和 D.E. Shaw，最终创建了 Sigma。配对交易已成为一种流行且复杂的策略。然而，随着市场演变和技术进步，套利机会变得更加稀缺，利润空间也更窄。为了适应，行业进行了升级，在经历一段衰退期后，人们对配对交易的兴趣再次高涨，并伴随着先进方法的开发和亟需的变革。我们将在本段解释基本原理，而不深入最新研究的细节。\n\
  \n配对交易策略涉及识别历史上具有强**相关性**7 的资产对，然后利用它们之间暂时的价格背离。算法计算两个资产（或更多）之间的价差，并主要基于穿越预定义的阈值和水平来生成交易信号。\n\
  \n实施配对交易策略需要匹配相反（多头和空头）的仓位：\n\n![](img/fig-1-3.png)\n\n配对交易策略分为三个阶段：\n\n- 首先，您需要在股票中识别该配对。这是配对选择阶段。\n\
  - 在第二阶段，我们需要对价差进行建模，最后。\n- 处理给出我们干预策略的交易规则。\n\n所有这些要点均在参考文献中列出的参考著作中有详细介绍。\n\n这里，我们展示可用于配对交易策略的这三个阶段的计算要素。这将帮助您理解逻辑和事件顺序。在上图中，系统化配对交易策略将利用福特汽车和通用汽车（GM）之间的关系。确实，这两只股票的波动似乎是同步的。\n\
  \n这表明福特和通用汽车的股票受共同经济因素同时影响而呈**相关性**。\n\n这种策略将这对股票视为一个资产。这在上图中有所体现，图表的第一象限给出了配对的演变，第二象限给出了两只个股之间的价差（）。然后，根据以下计算对价差进行**标准化**8：。\n\
  \n触发交易决策的阈值和水平可以通过基于 z-score 的基本统计计算来识别，如下所示。\n\n\n\n##### 统计套利策略实现总结\n\n以下是导致该结果的操作总结。详细信息和\
  \ Python 源代码可在 GitHub 笔记本中找到。操作序列如下：如有必要，安装 Yahoo Finance 库（`yfinance`）。接着，我们请求\
  \ FORD 和 GM 股票过去 900 天的报价历史，并将其存储在名为 `s1` 和 `s2` 的 Pandas 数组（DataFrame）中。\n\n```python\n\
  try:\n    import yfinance as yf\nexcept ModuleNotFoundError as e:\n    !pip install\
  \ -q yfinance\n    import yfinance as yf\n\ncompanies = ['FORD', 'GM']\ntickers\
  \ = yf.Tickers(companies)\ntickers_hist = tickers.history(period='900d', interval='1d')\n\
  s1 = tickers_hist['Close']['FORD']\ns2 = tickers_hist['Close']['GM']\n```\n\n然后，使用上述提到的\
  \ Z-score 公式对价差进行标准化，以便更容易地解释百分位数：\n\n```python\nimport numpy as np\n\ntmp = s2\
  \ - s1\nspread = (tmp - np.mean(tmp)) / np.std(tmp)\n```\n\n为两只股票之间的价差计算的 Z-score9\
  \ 量化了价差值偏离其均值的程度，具体如下：\n\n![](img/fig-1-4.png)\n\nZ-score 为 0 表示价差处于其均值，而正负 Z-score\
  \ 分别表示高于和低于均值的偏离。标准化价差的波动如 图 1.3 下象限所示。\n\nZ-score 分布的第 5 和第 95 百分位数作为识别配对交易潜在交易机会的阈值。我们将这些百分位数标记在\
  \ 图 1.4 上，该图表示所研究历史时期内价差值的统计分布。\n\n```python\nquantile = [0.05, .25, .50, .75, 0.95]\n\
  qtl = np.quantile(spread, quantile)\nqtl\n# array([-1.52366456, -0.66268085, -0.2051237,\
  \  0.88300426,  1.62259108])\n```\n\n当 Z-score 穿越这些阈值（第 5 或第 95 百分位）时可执行交易，这表明价差极度偏离均值并存在潜在的均值回归机会。第\
  \ 5 百分位给出了价差值，使得 5% 的计算价差值低于它。上述 Python 脚本告诉我们该值为 -1.52。\n\n这是上述 `quantile` 函数计算出的列表\
  \ `qtl` 中的第一个值。\n\n对称地，第 95 百分位给出了价差值（1.62），使得 5% 的计算价差值高于它。这是 Numpy 函数 `quantile`\
  \ 计算出的列表 `qtl` 中的最后一个值。\n\n这两个水平如 图 1.5 所示：\n\n![](img/fig-1-5.png)\n\n买入被低估、卖出被高估是我们将应用的基本投资原则。\n\
  \n在我们的配对交易策略中，被低估意味着标准化价差处于历史低位。\n\n当价差跌破第 5 百分位阈值时，我们买入价差。买入价差意味着买入 GM 并卖出 FORD。因此，我们押注其回归由平均值给出的中心值，即零。\n\
  \n相反，当价差向异常值移动（由第 95 百分位的值给出）时，我们采用相反的策略，即卖出价差以押注其回归到较低值。\n\n均值回归策略的优势之一在于它不需要预测，因为假设价差会回归到其均值并围绕其不断波动。\n\
  \n我们概述的配对交易策略基本原则可以通过多种方式改进。例如，建立自适应而非固定的阈值，或应用更复杂的量化方法。\n\n我们未提及的是，我们的两只股票投资组合必须是市场中性的。原因在于我们试图从价差中获利，而非从市场整体获利。配对交易策略旨在从相对表现中获利，同时对冲整体市场波动。在实施策略时必须牢记这一点。\n\
  \n现在让我们看看另一种统计套利策略的基本原理：均值回归策略。\n\n### 均值回归策略\n\n该策略的基本原理是假设价格或各种指标的水平将回归到其历史平均值。显著偏离均值的资产价格最终将回归到更正常的水平，交易正是基于对这种回归的预期而进行的。\n\
  \n![](img/fig-1-6.png)\n\n上图显示了原油价格及其移动平均线（实线橙色线）。\n\n我们可以看到，油价围绕该移动平均线（或类似量）不断波动。平均值是一个吸引子，价格不断向其回归。\n\
  \n图表中，橙色区域展示了价格与移动平均线的距离。因此，当金融资产价格与其平均值的差距较大时，该区域也较大。这些情况被称为超买和超卖，对应异常差距。这发生在资产价格上涨或下跌过快时（超买和超卖均属此类）。\n\
  \n该交易策略对应于识别超买和超卖资产，建立相反头寸，并押注极端时期后随之而来的修正阶段（买入落后者，卖出领涨者）。\n\n#### 实施均值回归策略的主要步骤\n\
  \n实施该策略需要解决许多技术问题，但其创始原则很简单：围绕中心值的不间断波动。\n\n让我们看看均值回归策略的基本阶段：\n\n- **资产选择**：识别表现出均值回归行为的合适资产。这些资产应有围绕其均值波动的历史。\n\
  - **均值计算**：计算资产价格或其他相关指标的均值。均值代表特定时期内的平均值，是确定偏离程度的参考点。\n- **标准差计算**：计算资产价格或相关指标的标准差。标准差量化了价格围绕均值的离散程度，有助于识别显著偏离。\n\
  - **偏离度量**：度量资产价格偏离其均值的程度。这可以通过计算 Z-score 来完成，Z-score 表示当前价格偏离均值的标准差数量（如步骤 2 和 3\
  \ 所计算）。\n- **交易策略、入场和出场点**：基于偏离均值的程度定义入场和出场点。通常，交易者寻找价格显著偏离均值的实例，这预示着潜在的回归机会。入场点可能是价格跌至均值以下一定数量的标准差时，出场点可能是价格回归到特定阈值或均值本身时。\n\
  - **风险管理**：建立风险管理参数以控制仓位大小、设置止损单并管理整体投资组合风险。这一步对于防范大额亏损和确保适当的风险调整后收益至关重要。\n\n从本质上讲，均值回归策略侧重于根据个别资产的历史价格模式识别其超卖或超买状况。当价格达到极端水平时执行交易，预期其将反转向均值。这正是简介中给出的统计套利策略。\n\
  \n细心的读者会注意到配对交易和均值回归策略之间的相似性。然而，这两种统计套利策略存在差异。以下是它们的区别所在。\n\n### 配对交易与均值回归策略的区别\n\
  \n- **配对交易**识别相关资产对，并从暂时的价格背离中获利；而**均值回归**关注偏离其均值的个别资产。\n\n\n\n# 配对交易与均值回归\n\n-\
  \ 配对交易采用市场中性方法，捕捉资产的相对表现，而均值回归则针对超卖/超买状况。\n- 配对交易使用价差计算和历史行为，而均值回归依赖价格形态。\n- 配对交易对冲市场风险，而均值回归面临特定资产风险。两种策略的方法不同，配对交易关注背离，均值回归关注价格向均值回归。\n\
  \n### 其他算法策略\n\n还有其他统计套利策略，我们将不会在本入门章节中详细讨论。不过，我们将学习要点：\n\n- **相对价值策略**：比较某板块或行业内资产的相对估值，以识别定价错误的证券。\n\
  - **事件驱动**：利用市场对特定事件（如财报发布或公司行为）的反应获利。\n- **统计因子策略**：利用基于统计因子（如动量、波动率和流动性）的量化模型。\n\
  - **指数套利策略**：利用指数基础成分股与指数本身之间的价格差异。\n- **高频交易（HFT）和做市策略**：这些策略利用强大的计算机以极高的速度执行大量订单。\n\
  \n做市策略涉及持续买卖证券以向市场提供流动性，从买卖价差中获利。\n\n最后这两种策略（高频交易和做市）持续且快速运行。它们需要大量的物质资源、特权市场准入和数据流（低延迟交易系统）。基于这些原因，它们是专业投资者（对冲基金、投资银行或自营交易公司）的专属领域。\n\
  \n请参考表 1.1 了解这些策略的概览：\n\n| 策略 | 所需市场方向 | 时间跨度与周期 | 单一资产 vs. 配对 | 专业基础设施 | 利润驱动因素\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 高频交易 | 否 | 亚秒级 | 单一 | 是 | 速度\
  \ |\n| 做市 | 否 | 亚秒级 | 单一 | 是 | 买卖价差 |\n| 配对交易 | 否 | 日内及更长 | 配对 | 否 | 资产间关系 |\n|\
  \ 均值回归 | 否 | 日内及更长 | 单一 | 否 | 回归均值 |\n| 动量 | 是 | 日内及更长 | 单一 | 否 | 趋势延续 |\n\n**表\
  \ 1.1**：系统化策略概览\n\n在本章剩余部分，我们将介绍机器学习，了解它是什么，以及在算法交易背景下我们可以从它那里期待什么。\n\n然后，为了演示，我们将采用提到的策略之一，并用机器学习对其进行“装饰”。这将使我们能够尝试一个被称为元策略的前沿研究领域。这将是我们机器学习的第一个用例。\n\
  \n## 理解机器学习\n\n随着本章的深入，我们将揭开机器学习（ML）的神秘面纱，探溯其渊源，并发掘其在算法交易领域蕴含的激动人心的潜力。从本质上讲，机器学习是人工智能的一个子集，它使计算机系统能够从数据中学习，并在未被显式编程的情况下提升性能。\n\
  \n早在 1959 年，一位名叫亚瑟·塞缪尔的计算机科学家为一个日益增长的概念命名：机器学习。我们刚才引用的机器学习定义出自他手，至今仍是该领域的权威定义。\n\
  \n在 IBM 充满激励性的环境中工作时，塞缪尔通过其创新的跳棋程序塑造着未来。与当时的标准程序不同，塞缪尔的心血结晶独树一帜。它被设计为从每一局对弈中学习，逐步优化策略并提升性能。\n\
  \n传说该程序很快就超越了其创造者的技艺，在对弈中战胜了塞缪尔。这使塞缪尔确信这一新知识领域具有革命性潜力。\n\n有趣的是，塞缪尔在机器学习领域的探索并非孤立进行。更广泛的人工智能领域也在获得动力，1956\
  \ 年的达特茅斯会议成为关键催化剂。这次会议汇聚了约翰·麦卡锡、马文·明斯基、纳撒尼尔·罗切斯特和克劳德·香农等思想领袖。他们共同辩论并畅想机器镜像人类智能，为我们今天所知的变革性人工智能世界奠定了基础。\n\
  \n这些对话部分受到艾伦·图灵开创性工作的启发，他为理论计算机科学和人工智能奠定了基础。\n\n然而，至关重要的是要理解，机器学习和人工智能虽然相互关联，但并不相同。人工智能是一个更广泛的概念，指能够模仿人类智能的机器或软件。另一方面，机器学习是\
  \ AI 的一个子集，专门专注于使用算法和统计模型，让机器通过经验改进任务表现。它是 AI 的一种实际应用，系统可以在未被显式编程的情况下从数据中学习并做出决策（图\
  \ 1.7）。\n\n![Figure 1.7](img/fig-1-7.png)\n\n简而言之，机器学习算法输出规则。这是理解机器学习本质的关键点。这与传统计算机编程形成对比，在传统编程中，开发者、分析师负责生产、构想和设计规则，以便通过应用这些规则做出明智决策。\n\
  \n这正是机器学习所能提供的承诺：在学习阶段从数据中提取规则。\n\n当我们使用机器学习算法时，我们让算法根据呈现给它的数据得出演绎和结论。规则深埋并隐藏在数据中。算法搜寻数据中的重复模式和复杂相关性，从而做出最佳预测。我们将在下一节更详细地回顾学习过程。\n\
  \n快进到今天，机器学习已渗透到几乎每个领域，从医疗保健和物流到金融和交易。在算法交易背景下，机器学习是颠覆性力量，为建模和预测市场行为提供了创新方式。\n\n\
  随着我们探索 ML 在交易中的作用，我们将发现其筛选海量金融数据、识别复杂模式并做出精准预测的能力。这种能力对于增强既有交易策略特别有益，我们将通过将 ML 应用于趋势跟踪策略来加以说明。随后我们将讨论一个被称为元策略的激动人心的研究领域。\n\
  \n从本质上讲，元策略是一个利用机器学习根据不断变化的市场条件优化和调整交易策略的框架。这种方法使我们能从交易策略中提取更大价值，标志着我们在系统化算法交易背景下将机器学习应用于实践、产生实质影响的首次尝试。\n\
  \n## 机器学习在交易中的应用\n\n这里有一个交易员采用的最简单交易规则示例，称为移动平均线交叉策略：\n\n- **设置**：该策略使用两条移动平均线——一条较短周期和一条较长周期。最常用的长度是较短周期平均线（`SMA50`）用\
  \ 50 天（约 2 个月），较长周期平均线（`SMA200`）用 200 天。\n- **买入规则**：当 `SMA50` 向上穿过 `SMA200` 时，产生看涨信号，交易员买入资产。\n\
  - **卖出规则**：反之，当 `SMA50` 向下穿过 `SMA200` 时，产生看跌信号，交易员卖出资产。\n\n\n\n\n这两条规则构成了一种趋势跟踪策略，旨在捕捉资产的动量。\n\
  \n### 结合机器学习的动量策略\n\n要使用机器学习实现这一均线交叉策略，我们首先必须修改问题，使其适合机器学习方法。我们不再制定何时买入和卖出的显式规则，而是利用机器学习根据历史数据来学习这些规则。\n\
  \n事实上，这正是机器学习所能提供的承诺：在学习阶段从数据中提取规则。\n\n下面是一个使用监督学习的示例，具体来说是分类方法。分类意味着我们试图学习如何预测一个类别。\n\
  \n以下内容展示了机器学习在交易中的作用。我们将在下一节（实现监督交易系统）中回到关于实现的方法论要点。\n\n以下是通往由机器学习算法驱动的交易系统的步骤：\n\
  \n1. **预处理与数据**：首先，我们下载数据，然后在历史价格数据上计算相同的移动平均线（`SMA50` 和 `SMA200`）。另一方面，我们使用与传统方法（不使用\
  \ ML）相同的数据，这就是为什么我们以相同的方式计算移动平均线，以便将它们包含在将提交给模型以搜索重复模式的输入中。然后我们创建一个目标变量，当第二天的收盘价高于前一天时（看涨信号）为\
  \ `+1`，相反情况（看跌信号）为 `-1`。这个目标变量就是我们将训练模型去预测的内容。\n\n2. **特征创建**：接下来，我们为模型创建特征。这些特征可能包括当前价格、成交量、两条移动平均线的值，以及可能的许多其他指标。机器学习的很大一部分工作在于选择和构建这些特征。我们将在第\
  \ 6 章（利用特征提升模型能力）中回到这一点。\n\n3. **模型训练**：然后我们将数据分为训练集和测试集，并在训练集上训练我们的 ML 模型（例如，决策树、逻辑回归，作为起点，随后再转向更复杂的模型）。模型学习根据特征预测目标变量。\n\
  \n4. **模型测试**：模型训练完成后，我们在测试集上测试其性能，以确保它能很好地泛化到新数据。我们可以根据此性能调整模型参数或尝试不同的模型。\n\n5.\
  \ **交易规则**：我们现在拥有一个 ML 模型，给定当前特征，它预测短期移动平均线在未来将高于还是低于长期移动平均线。我们可以利用这些预测进行交易：如果预测为\
  \ `+1`，我们买入；如果预测为 `-1`，我们卖出。\n\n关于模型训练，现代机器学习系统利用经过验证和优化的 API。为了我们的目的，我们选择了 `scikit-learn`\
  \ 机器学习库。这是世界上使用最广泛的机器学习库之一，与 Google 的 `TensorFlow` 齐名。此外，除了其内在优势外，Scikit-Learn 的许可证允许代码用于商业用途，且代码开源，可在\
  \ GitHub 上查阅。\n\n以下代码演示了上述各点：\n\n研究对象为通用汽车股票（GM 代码）过去 5 年的数据（1000 个交易日数据）。让我们首先进行预处理并从雅虎财经下载数据：\n\
  \n```python\nimport pandas as pd\nimport numpy as np\nimport yfinance as yf\n\n\
  yf.pdr_override()\n\nsymbol = 'GM'\nticker = yf.Ticker(symbol)\n\n#### 有效间隔：[1m,\
  \ 2m, 5m, 15m, 30m, 60m, 90m, 1h, 1d, 5d, 1wk, 1mo, 3mo]\ndf = ticker.history(period='1000d',\
  \ interval='1d')\n```\n\n下一步是创建作为输入提供给机器学习算法的特征。这一阶段称为特征工程：\n\n```python\n#### 计算移动平均线\n\
  df['SMA50'] = df['Close'].rolling(window=50).mean()\ndf['SMA200'] = df['Close'].rolling(window=200).mean()\n\
  df['MA_cross'] = df['SMA50'] - df['SMA200']\n\n#### 创建目标变量\ndf['target'] = pd.DataFrame(np.zeros(len(df)))\n\
  df['target'] = np.where(df['Close'].pct_change() > 0, 1, -1)\ndf['target'] = df['target'].shift(-1)\n\
  \n#### 移除 NaN\ndf.dropna(inplace=True)\n\n#### 创建特征\nX = df[['Open', 'High', 'Low',\
  \ 'Close', 'SMA50', 'SMA200', 'MA_cross']]\n```\n\n机器学习方法在于向 ML 算法提供与 MA 交叉策略相同的要素，但不提供该策略的规则（移动平均线的相对位置）。机器学习算法的目的是提取这些规则。为此，它以输出（`target`\
  \ 列）为指引，输出代表要实现的目标。\n\n在训练阶段，ML 算法扫描提交给它的特征（输入），寻找重复和复杂的相关性，从而能够适当地预测监督列（输出）。\n\n\
  模型训练：`train_test_split()` 函数将数据分为训练集和测试集。这样，仅在算法的训练阶段提交训练集。\n\n```python\n#### 训练-测试集划分\n\
  X_train, X_test, y_train, y_test = train_test_split(X, df['target'], shuffle=False)\n\
  \n#### 创建并训练决策树分类器\nclf = DecisionTreeClassifier(random_state=42)\nclf.fit(X_train,\
  \ y_train)\n```\n\n最后是模型测试，函数输出如下：\n\n```python\nfrom sklearn.metrics import classification_report\n\
  print(classification_report(clf.predict(X_test), y_test))\n```\n\n| | | precision\
  \ | recall | f1-score | support |\n| --- | --- | --- | --- | --- | --- |\n| -1.0\
  \ | | 0.24 | 0.50 | 0.33 | 46 |\n| 1.0 | | 0.78 | 0.53 | 0.63 | 154 |\n| accuracy\
  \ | | | | 0.53 | 200 |\n| macro avg | | 0.51 | 0.52 | 0.48 | 200 |\n| weighted avg\
  \ | | 0.66 | 0.53 | 0.56 | 200 |\n\n重要的是要注意，所有性能指标都是在算法训练期间无法访问的数据（`X_test`）上计算的。因此，它未使用这些数据进行训练。这些数据合理地说明了在新数据和未发布数据上的预期性能，例如在生产和实盘交易环境中可能遇到的情况。这是一个关键点。我们稍后将回过头来讨论我们面前的指标的含义和解读（越高越好）。\n\
  \n正类（`+1`：上涨期）的正确预测百分比远高于无信息的随机预测（抛硬币），后者在本例中为 0.5。事实上，精确率为 0.78。\n\n然而，另一类（`-1`）并非如此。下跌期的预测效果不佳。\n\
  \n现在，我们需要将其与传统交叉系统的指标进行比较。实现交易规则以计算相关的性能指标。\n\n正如简介中提到的，最简单的规则是交叉规则，可以表示如下：\n\n\
  ```python\n#### 交叉规则：+1 MA(50 天) > MA(200)；-1：MA(50 天) < MA(200)\nma_cross = np.where(X_test['MA_cross']\
  \ > 0, 1, -1)\nprint(classification_report(ma_cross, y_test))\n```\n\n```\n    \
  \          precision    recall  f1-score   support\n\n          -1.0       0.55\
  \      0.46      0.50       114\n           1.0       0.41      0.50      0.45 \
  \       86\n\n    accuracy                           0.48       200\n   macro avg\
  \       0.48      0.48      0.47       200\nweighted avg       0.49      0.47  \
  \    0.48       200\n```\n\n在没有 ML 帮助的情况下，交叉系统并没有显著优于随机预测。指标徘徊在 50%（0.5）左右。\n\n\n\
  \n\n### 利用机器学习的元策略\n\n元策略在机器学习领域内，指向一种被称为元学习的实践。这一概念也称为“学会学习”，是机器学习的一个小众子集。元学习的威力在于其能够根据实验获得的结果，通过修改学习算法的特定方面来提升该算法的性能。\n\
  \n元学习真正的卓越之处在于其能够用数据驱动方式学习得出的方法论，来替代人工设计的算法。\n\n因此，当应用于交易策略时，元学习呈现为元策略的形式。该框架的作用是利用机器学习不仅优化，而且根据不断变化的市场动态来调整交易策略。这转化为一种适应性强且灵活的算法交易方法，能够与市场同步演进。\n\
  \n实际上，元策略有潜力从我们现有的交易策略中榨取更大的价值。由元学习驱动的交易元策略，是一种基于策略表现和不断变化的市场条件来优化和演进交易算法的动态方法。\n\
  \n其核心在于，元学习是一个使模型能够从过去经验中学习的过程。这意味着它不仅分析输入数据，还分析自身的表现，并根据获得的洞察调整其算法。当应用于交易系统时，这一概念演变为元策略。\n\
  \n#### 元策略实战\n\n其工作原理如下：元策略不使用基于预定义规则运行的静态交易算法，而是使用一个学习算法。该学习算法评估交易策略在不同市场场景下的表现，了解其优势和劣势。然后根据这些习得的知识调整交易策略，使其更加稳健有效。\n\
  \n例如，一种交易策略可能在高波动时期表现良好，但在低波动时期却举步维艰。利用元学习的元策略会识别出这种模式并调整策略，或许通过在低波动时期减小仓位或改变进出场点位。\n\
  \n以这种方式，元策略可以持续优化交易系统，随着时间的推移并在各种市场条件下提升其性能。它们代表了算法交易的下一个层级，在那里交易系统不仅是自动化的，而且是自我改进和自适应的。\n\
  \n##### 元交易策略\n\n让我们通过一个具体例子来尝试编写一个旨在补充现有策略的元策略。为此，让我们采用通过检测超买和超卖股票来回归均值的策略。我们在上一节中描述了该原则。\n\
  \n结合元学习的策略思路：\n\n1.  检查策略的盈亏是否可以作为策略输入数据的函数进行预测。\n2.  如果可以，我们将在交易前预测盈亏的符号，仅发送有希望的交易（即预测盈亏为正的交易）。\n\
  \n为实现这一点，元策略仅需对初始策略进行微小修改。\n\n元策略以描述我们试图增强的策略的数据作为输入。这些数据如下：\n\n- 策略的表现（盈亏）\n\n\
  ![](img/Figure_1.8.jpg)\n\n被分析策略的输入数据。\n\n以下是计算机代码所需的步骤：\n\n1.  我们需要保留每个周期的盈亏记录（`ar_pnl`\
  \ 数组）。\n\n```\n###### agregated PnL for each specific period :\nar_pnl = pd.DataFrame(np.zeros(len(ranked_ret.index))\
  \ , index = ranked_ret.index , columns=[\"agg_pnl\"] )\n```\n\n2.  我们用每个周期的盈亏填充此表。\n\
  \n```\n###### Calculate transaction cost\n###### transaction cost in basis point:\n\
  ###### transaction_cost_amount = (open_price + close_price) * quantity * transaction_cost\n\
  ###### transaction cost per share (broker fee : minimum 1$):\ntransaction_cost_amount\
  \ = max(quantity * transaction_cost , 1)\nprofit_loss = (close_price - open_price)\
  \ * quantity - transaction_cost_amount\n### apply stop loss\nprofit_loss = np.max([profit_loss\
  \ , stp_loss])\nlst_pnl.append(profit_loss)\ntotal_profit_loss = total_profit_loss\
  \ + profit_loss\nar_pnl['agg_pnl'].loc[date] = ar_pnl['agg_pnl'].loc[date] + profit_loss\n\
  ```\n\n3.  接下来，我们获取策略的特征（`X`），即收益率和这些收益率的排名（根据收益率大小分配给每个资产的排名）。\n\n```\n###### features\
  \ : we merge the ranked returns and array of returns\nX = pd.concat([ret , ranked_ret]\
  \ , axis =1)\n```\n\n4.  目标是学会预测。这是一个二元目标（`y`），取决于产生的盈亏是否为正。\n\n```\n###### target\
  \ : agregated PnL for each specific period -> ar_pnl\ny = np.sign(ar_pnl.shift(-1))\n\
  ###### binary sign is either 1 or -1 not 0\ny[y == 0] = -1\n###### last period,\
  \ zero to clean missing value\ny.iloc[-1] = -1\ny = np.ravel(y)\n```\n\n5.  学习阶段：\n\
  \n```\n###### Split the data into training and testing sets\nX_train, X_test, y_train,\
  \ y_test = train_test_split(X, y , test_size =0.025,shuffle = False)\nclf = RandomForestClassifier()\n\
  clf.fit(X_train , y_train)\n```\n\n以下是与预测盈亏符号相关的指标：\n\n| | precision | recall |\
  \ f1-score | support |\n|---|---|---|---|---|\n| -1.0 | 0.40 | 0.61 | 0.48 | 36\
  \ |\n| 1.0 | 0.67 | 0.46 | 0.54 | 61 |\n| accuracy | | | 0.52 | 97 |\n| macro avg\
  \ | 0.53 | 0.54 | 0.51 | 97 |\n| weighted avg | 0.57 | 0.52 | 0.52 | 97 |\n\n该算法为正类别（+1：正盈亏）找到了预测模式。正确预测与错误预测的比率等于\
  \ 2/3 (0.67)，这高于平均水平，当然也高于随机预测。\n\n剩下的就是接入由元规则形成的过滤器。\n\n在每笔交易前，我们检查该交易是否有机会产生正利润。具体操作如下：将即将进行的交易信息发送给与训练好的算法关联的预测函数（`predict_proba`）。该函数返回该交易产生利润的概率。该概率充当交易过滤器（元规则），仅允许具有盈利潜力的交易通过。我们仅发送超过\
  \ 50% 阈值（产生正利润的概率）的盈亏：\n\n```\n###### open a trade if the ML model allows it ....\n\
  if clf.predict_proba(pd.DataFrame(X.loc[date].values.reshape(1,-1) , columns=X.columns))[0,1]\
  \ > 0.5:\n    print(\"ML OK for this trade\")\n    lst_pnl_meta_strat.append(profit_loss)\n\
  else:\n    lst_pnl_meta_strat.append(0)\n```\n\n同时，我们记录未经过元规则过滤的策略盈亏（非元曲线）。我们在下图中得到了这两条权益曲线：\n\
  \n![](img/fig-1-9.png)\n\n元规则生效了。经过过滤的策略回撤更低，利润更高。两条曲线的差异并不惊人，但再次强调，这里并未寻找最优参数或进行微调。\n\
  \n## 结论\n\n\n\n\n读完本章，我们希望您已在算法交易及机器学习在此领域的作用方面打下坚实基础。我们回顾了算法交易的诞生与演变，了解其类型与策略，进而认识到机器学习的重要性及其对交易实践的影响。\n\
