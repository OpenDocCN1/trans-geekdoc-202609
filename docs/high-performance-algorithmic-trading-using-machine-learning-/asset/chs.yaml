  \ 第 3 章，优化交易系统、指标和自动化报告。\n\n##### 交易统计\n\n对于有兴趣获得详细交易表现分析的读者，以下代码片段提供了全面的统计数据。它计算胜率、盈利交易平均获利、亏损交易平均亏损，以及多头和空头头寸中盈亏的分布情况：\n\
