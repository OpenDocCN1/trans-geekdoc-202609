  \n我们打印最小和最大情感评分及对应的新闻标题：\n\n```python\nprint('minimum sentiment rating : ', np.min(df['sentiment']))\n\
  print(df.iloc[np.argmin(df['sentiment']) , :]['title']) \n\nprint('maximum sentiment\
  \ rating : ', np.max(df['sentiment']))\n```\n\n\n\n#### 文本预处理与维基百科数据提取\n\n#####\
  \ 读取维基百科页面\n\n在分析维基百科页面之前，第一步是以编程方式获取这些信息。这可以通过工具（网页抓取库和 API）来实现，这些工具允许自动检索维基百科内容。收集数据后，会进行清洗和预处理（详见下一节“文本预处理”），以确保可用性。\n\
  \n由于维基百科页面通常汇总关键财务细节，包括美国 SEC Form 10-K 文件中的内容（财务报表、业务概览、管理层讨论与分析 (MD&A) 以及风险因素），它们提供了一种结构化的方式，从监管披露中提取定性和定量见解。这使我们能够利用维基百科作为财务情报的补充来源，同时确保提取的信息建立在官方报告的基础上。\n\
  \n为演示此过程，我们安装 `wikipedia-api` 包，它允许我们以编程方式访问并从互联网页面提取数据：\n\n```bash\n!pip install\
  \ -q wikipedia-api\n```\n\n随后，我们从一个作为 S&P 500 指数中所有上市公司门户的维基百科页面检索文本，并从以下表格中提取所有公司链接。虽然维基百科可能不总被视为主要来源，但它为自动化数据提取提供了结构化的起点，并以集中格式提供了便捷的公司信息访问：\n\
  \n![](img/Fig_11.1.png)\n\n代码读取 `Security` 列的内容，该列包含每家公司的 URL。这些 URL 指向聚合了来自官方来源可靠信息的页面，包括上述的监管文件和财务报告：\n\
  \n```python\ndef get_sp500_company_links(wikipedia_url):\n    response = requests.get(wikipedia_url)\n\
  \    soup = BeautifulSoup(response.content, 'html.parser')\n    table = soup.find('table',\
  \ {'class': 'wikitable sortable'})\n    rows = table.findAll('tr')\n    links =\
  \ []\n    for row in rows[1:]:\n        link = row.find('td').find_next('td').find('a')['href']\n\
  \        links.append(link)\n    return links\n```\n\n我们使用 `requests` 获取 HTML 内容，并使用\
  \ `BeautifulSoup` 解析、提取并返回表格中每家公司维基百科页面的 URL：\n\n```python\nwikipedia_url = 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'\n\
  #get a link for all companies\nsp500_company_links = get_sp500_company_links(wikipedia_url)\n\
  sp500_company_links\n```\n\n上述代码生成以下输出，显示每家公司的地址：\n\n```text\n['/wiki/3M',\n '/wiki/A._O._Smith',\n\
  \ '/wiki/Abbott_Laboratories',\n '/wiki/AbbVie',\n '/wiki/Accenture',\n '/wiki/Adobe_Inc.',\n\
  \ '/wiki/AMD',\n '/wiki/AES_Corporation',\n '/wiki/Aflac',\n '/wiki/Agilent_Technologies',...]\n\
  ```\n\n使用维基百科 API，我们根据地址获取每个对应页面的文本内容：\n\n```python\ndef get_wikipedia_text(page_title,\
  \ language='en'):\n    wiki = wikipediaapi.Wikipedia(language, headers=headers)\n\
  \    page = wiki.page(page_title)\n    if page.exists():\n        return page.text\n\
  ```\n\n作为示例，以下是通过执行代码提取的 NVIDIA 页面内容：\n\n```python\ntext = get_wikipedia_text(page_title)\n\
  if text:\n    page_content[page_title] = text\npage_content.get('Nvidia')[:550]\n\
  ```\n\n```\n'Nvidia Corporation (, en-VID-ee-ə) is an American multinational corporation\
  \ and technology company headquartered in Santa Clara, California, and incorporated\
  \ in Delaware. It is a software and fabless company which designs and supplies graphics\
  \ processing units (GPUs), application programming interfaces (APIs) for data science\
  \ and high-performance computing, as well as system on a chip units (SoCs) for the\
  \ mobile computing and automotive market. Nvidia is also a dominant supplier of\
  \ artificial intelligence (AI) hardware and software.\\nNvidia's pr'\n```\n\n我们现在拥有\
  \ S&P 500 指数中每家公司的完整维基百科文件内容，将在后续章节中进行分析。\n\n在下一节中，我们将介绍文本预处理，重点关注清洗、分词和创建词嵌入等关键步骤，以准备数据用于进一步分析。\n\
  \n### 文本预处理\n\n文本预处理是 NLP[¹] 中的初始步骤，涉及清洗和分词，通过去除无关元素、将文本分解为可管理的单元并确保数据集的一致性，为分析准备原始文本数据。\n\
  \n##### 清洗\n\nNLP 中的清洗涉及通过移除无关元素（如特殊字符、数字或不一致的格式）来准备文本数据，以确保数据处于统一且可用的状态以供分析。此过程通常包括移除停用词。停用词是常见词汇，如\
  \ \"and\"、\"the\" 或 \"is\"，它们在预处理期间被移除，因为它们频繁出现且不承载重要含义。例如，在句子 \"The cat sat on\
  \ the mat\" 中，移除停用词将保留 \"cat\"、\"sat\" 和 \"mat\" 作为关键术语。\n\n近年来，NLP 取得了显著进步，使这一步变得不那么关键，并降低了移除停用词的重要性。对于最新算法（如带有\
  \ Transformer[²] 的嵌入或全局词向量表示 (GloVe)[³]），停用词不再是主要顾虑，因为这些模型旨在捕捉词汇的完整上下文，包括停用词在句子结构和含义中所扮演的角色。\n\
  \n##### 分词\n\n清洗文本后，分词将清洗后的数据分解为单个单词（标记）或短语，将其转换为结构化单元，以便机器学习模型更轻松地分析。分词是在将文本转换为数字之前的常用方法，使其适合机器学习算法处理。例如，文本提示\
  \ \"a cute and adorable bunny\" 将被分割为 `a`、`cute`、`and`、`adorable` 和 `bunny` 等标记：\n\
  \n```python\nimport nltk\nnltk.download('punkt')\ntext = \"a cute and adorable bunny\"\
  \nnltk.word_tokenize(text)\n```\n\n上述代码的输出如下：\n\n```text\n[nltk_data] Downloading\
  \ package punkt to /root/nltk_data...\n[nltk_data] Unzipping tokenizers/punkt.zip.\n\
  ['a', 'cute', 'and', 'adorable', 'bunny']\n```\n\n###### 词嵌入简介\n\n词嵌入是将标记（单词）表示为数值向量的一种方式，以机器学习模型可理解的形式捕捉单词的含义和关系。可以将其视为将单词映射到高维空间的一种方式，其中相似的单词在空间中更接近。\n\
  \n下图展示了词嵌入的示意：\n\n![](img/Fig_11.2.png)\n\n[¹]: NLP: Natural Language Processing，自然语言处理\n\
  [²]: Transformer: 一种深度学习模型架构\n[³]: GloVe: Global Vectors for Word Representation，全局词向量表示\n\
  \n\n\n\n将单词转换为向量的这一过程，使我们能够将结构化的数值数据输入机器学习算法。然而，这还不是全部，这些嵌入不仅仅是将单词表示为数字。正如我们将详细解释的那样，它们以数学形式编码单词的含义，捕捉语义关系和上下文细微差别，从而实现更高级的文本分析。\n\
  \n例如，在词嵌入模型中，`buy` 和 `purchase` 这两个词会被定位在彼此附近，因为它们含义相似。这使得机器学习模型能够通过识别单词之间的模式和关系，更有效地理解和分析文本数据。\n\
  \n单词的含义和关系被编码在代表每个单词的数值向量中，使模型能够理解语言的上下文和语义，如下所示：\n\n![](img/Fig_11.3.png)\n\n该可视化图展示了二维空间中代表语义维度的两个轴、绘制在该空间中的若干单词点，以及含义相似的单词聚类在一起的情况。图示演示了词嵌入如何捕捉语义关系：\n\
  \n*   动物相关词汇（`cat`、`dog` 和 `pet`）聚集在左下角。\n*   车辆相关词汇（`car`、`truck` 和 `vehicle`）聚集在右上角。\n\
  *   自然相关词汇（`tree`、`plant` 和 `forest`）位于中间。\n\n坐标轴可以解释如下：语义维度 1（x 轴）代表“有生命 vs. 无生命”，语义维度\
  \ 2（y 轴）代表“自然 vs. 人造”。该图示说明了词嵌入如何同时捕捉多个语义维度。值得注意的是，在实际的词嵌入模型中，通常包含更多维度，且这些维度的解释往往不如这个简化的二维示例那样清晰明确。\n\
  \n在本节中，我们介绍了词嵌入的基础知识。现在，我们将把这一概念从单个单词扩展到整个公司。正如我们为单词或术语计算嵌入一样，我们可以为整个文档生成嵌入，汇总关于一家公司的所有可用信息、10-K\
  \ 报告、维基百科数据、客户关系、市场定位、产品等。\n\n所有这些极具价值的来源都将通过我们将使用的嵌入 API 高效转换。结果将是一个公司嵌入向量，这是一种紧凑的数值表示，能够捕捉公司的本质，而不仅仅是历史价格数据。\n\
  \n###### 使用 GloVe 创建公司嵌入\n\nGloVe 是一种先进技术，通过分析大型文本语料库中单词的共现来计算词嵌入。正如上一节所解释的，它在高维空间中捕捉单词之间的关系和相似性，从而实现对文本数据中语言和上下文的更深层理解。GloVe\
  \ 通过以反映语义关系的方式表示单词，增强了信息提取能力。\n\nGloVe 使用预训练模型，该模型已基于海量文本数据学习了单词间的关系。该模型提供的词嵌入捕捉了单词的通用含义和关联。在当前语境下，我们使用这些预训练嵌入来分析和理解我们正在处理的特定内容，将学到的单词关系应用到我们的特定数据集中。这种方法使我们能够利用模型的大量训练成果，同时专注于我们文本的独特语境，而无需在我们的特定文本上重新训练模型，如以下代码所示：\n\
  \n以下代码使用强烈推荐的 Hugging Face API 安装并加载预训练的 `average_word_embeddings_glove.840B.300d`\
  \ GloVe 模型，该 API 除其他功能外，还作为经过筛选的高性能预训练机器学习模型的代码库：\n\n```python\n!pip install -qU\
  \ sentence-transformers\n\nfrom sentence_transformers import SentenceTransformer\n\
  \n####### Load the SentenceTransformer model with GloVe embeddings\nmodel = SentenceTransformer('average_word_embeddings_glove.840B.300d')\n\
  ```\n\n然后我们将标普 500 公司页面（请参阅上一节“使用 API 读取维基百科页面”）输入预训练模型，并为每家公司获得相应的公司嵌入：\n\n```python\n\
  ####### Get embeddings for each text article\nfor title, content in page_content.items():\n\
  \    embeddings[title] = model.encode(content, convert_to_tensor=True)\n```\n\n\
  我们将所有嵌入向量整理到一个 `DataFrame` 中，以便于操作，并通过显示摘要来提供这些嵌入的具体视图：\n\n```python\ndf_embeddings\
