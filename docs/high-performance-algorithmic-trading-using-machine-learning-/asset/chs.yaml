  机器学习已迅速成为算法交易中一种变革性的工具，其能力远超计量经济学、技术分析、随机微积分、投资组合优化和信号处理等传统方法。虽然这些成熟的方法长期以来一直是量化金融的主流，但它们往往依赖于僵化的假设和人工制定的规则。相比之下，机器学习使系统能够直接从数据中学习——发现模式、适应市场动态，并在极少人工干预的情况下构建预测模型。将示例——训练集——自动转化为模型这一理念具有革命性意义。\n\
  \n本书的写作旨在填补我反复观察到的一个空白：初学者在交易机器学习方面迈出的第一步，与学术界或机构环境中常见的更高阶、往往难以企及的专业知识之间的鸿沟。许多新手开始尝试对收益进行分类——往往以失败告终——原因在于缺乏对替代目标预测或特征工程更深层理解的经验。我的目标是通过引入既强大又实用的现代机器学习技术来弥合这一鸿沟。无论您是独自工作还是在小团队中协作，本书专注于计算高效、适用于真实交易场景且能带来可衡量结果的方法。\n\
  \n本书旨在作为一本实操指南，带领读者深入了解应用于真实交易的机器学习关键技术。它从算法策略设计的基础入手，然后逐步扩展到监督学习、无监督模型、模式挖掘、金融文本\
  \ NLP，最后以使用先进 ML 技术进行投资组合构建作为结尾。内容完全偏向实战——有意排除了数学推导，转而采用代码、工具和示例——使材料通俗易懂且不失技术深度。\n\
  \n您将学习如何应用量化基本面方法，将会计数据整合到预测模型中；检测时间序列中的结构性变化并自动提取规则；处理另类和非结构化数据；设计远超基本 OHLC 输入的特征；在保留信号的同时过滤市场噪声；构建基于成交量或波动率的\
  \ K 线，并利用 AutoML 和低代码 ML 的最新突破，使用 `H2O` 和微软 `FLAML` 等工具。每章都结合了清晰的解释、即刻可运行的代码，以及反映真实交易问题和约束的用例。\n\
