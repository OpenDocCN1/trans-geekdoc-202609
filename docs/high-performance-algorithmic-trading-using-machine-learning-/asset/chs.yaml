  \n# 第 12 章\n\n**高级无监督学习、异常检测与关联规则**\n\n\n\n\n## 简介\n\n在本章中，我们将探讨旨在揭示金融市场中隐藏模式和异常的高级无监督学习技术。我们首先解决异常检测的挑战，其中市场低效、异常行为和异常事件往往同时预示着风险和机遇。虽然统计方法奠定了基础，但机器学习方法（如\
  \ `Isolation Forest`）提供了更复杂的检测手段。\n\n随后，我们介绍一种混合方法，将序列聚类与非线性投影相结合，提供了一种更有效的方式来识别不同的市场状态并检测趋势反转。接下来是对关联规则挖掘的探索，通过发现市场事件之间的关系，并将其用于构建仅做多交易策略。\n\
  \n通过整合这些高级无监督技术，本章为驾驭复杂的金融数据和构建更明智的、数据驱动的市场分析策略提供了实用工具包。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   金融领域异常检测简介\n*   用于异常检测的序列聚类与投影\n*   基于聚类的关联规则策略\n\n## 目标\n\n本章总结了我们对高级无监督学习技术的探索，重点关注金融市场中的聚类、关联规则和异常检测。它使读者掌握识别市场低效和异常事件所需的技能，包括使用统计方法（如\
  \ `Z-score`、四分位距（`IQR`）和变点检测（`CPD`）），以及机器学习方法（如 `Isolation Forest`）进行更复杂的异常检测。\n\
  \n本章介绍了将序列聚类与非线性降维相结合的混合方法，以增强检测市场状态和趋势反转的能力。它还探讨了关联规则挖掘——一种被低估且非正统的算法，在金融领域很大程度上被忽视，但在零售、工业和工程领域的模式发现中却被广泛使用。通过将其应用于金融数据，本章展示了关联规则如何揭示市场事件之间有意义的关系，为构建数据驱动的交易策略提供了基础。通过学习本章，读者将获得分析复杂金融数据、做出明智决策以及利用前沿数据科学在市场分析中获得竞争优势的实用工具包。\n\
  \n## 金融领域异常检测简介\n\n金融市场中的异常检测是无监督学习的一项关键应用，专注于识别与预期行为显著偏离的数据点、事件、序列和模式。这些异常范围从单个离群点到复杂的集体偏差。\n\
  \n异常有多种形式，每种都需要不同的检测方法来揭示市场低效和风险。点异常表现为交易量的突然激增或异常的价格波动，通常与孤立事件有关，如盈利惊喜或新闻驱动的冲击。情境异常是指在特定时间框架内，原本典型的交易量变得异常，反映了市场行为的转变，可能预示着结构性变化或隐藏风险。除了单个事件外，集体异常发生在一组数据点表现出异常相关性时，通常预示着更广泛的市场压力或系统性中断。识别这些差异有助于更精确地应用异常检测技术，并提高金融模型的准确性。\n\
  \n异常检测在金融领域的重要性在于其揭示市场低效、检测操纵行为，以及为重大事件（如崩盘、流动性危机、闪崩、投机泡沫、协同市场操纵、突然的状态变化以及重大地缘政治或宏观经济冲击）提供早期预警的能力。通过尽早识别这些异常，交易员和分析师可以更好地预判风险、调整策略，并在市场错位完全显现之前利用它们。通过利用无监督学习技术，我们可以在不依赖标签数据的情况下识别这些异常。\n\
  \n### 检测金融异常的挑战\n\n想象一下，一个交易算法在几秒钟内检测到一只蓝筹股价格跳涨 10%。这是预示着重大市场事件的真实异常，还是仅仅是数据故障？这个场景说明了异常检测中的复杂困难，特别是在使用无监督学习技术时：\n\
  \n*   金融数据的高维度构成了重大障碍。市场跨多个资产、时间框架和指标产生海量数据。无监督算法必须筛选这个多维空间以识别有意义的异常，我们将通过机器学习方法中的降维技术来解决这一任务。\n\
  *   金融时间序列的非平稳性使异常检测复杂化。市场状态转移、波动率变化，今天的异常明天可能就是正常。我们提出的聚类算法 1 通过识别不同的市场状态来解决这个问题，从而实现特定情境下的异常检测。\n\
  *   金融市场中的真实异常很少见，造成了严重的类别不平衡。这使得标准方法难以区分显著异常和噪声。我们将探讨关联规则如何帮助在每种状态内建立正常模式，使异常识别更加稳健。\n\
  *   金融领域噪声与显著异常之间的细微界限要求复杂的检测方法。对于低波动率股票，微小的价格波动可能是正常噪声，但对于稳定的加密货币却可能是显著异常。我们的综合方法结合多种技术来应对这种复杂性。\n\
  \n这些困难凸显了在金融异常检测中对先进、自适应无监督学习技术的需求。随着我们深入统计方法、机器学习方法及我们新颖的综合算法，我们将看到每种技术如何应对这些挑战，为识别和解读异常提供全面的途径。\n\
  \n### 无监督异常检测方法概述\n\n无监督方法因其不依赖标签数据而具有显著优势，消除了对专家驱动标注的需求。在标签数据集稀缺、昂贵或不存在的场景中，这一点尤为宝贵。无监督技术不是依赖预定义类别，而是自主识别复杂高维数据中的隐藏结构和模式。这种能力使它们能够发现基于规则的系统和传统有监督学习方法所遗漏的关系和异常。\n\
  \n基于这些优势，我们可以探讨在金融异常检测中特别有效的无监督方法核心类别。第一类是统计方法。\n\n#### 统计方法\n\n这些方法利用统计量（如 `Z-scores`）来检测异常价格波动或异常市场行为。例如，统计方法被用于定位异常高的交易量，这些交易量往往预示着重大市场事件，如盈利公告、内幕交易、事件预期或普遍市场情绪，且这些信息尚未反映在股价中。\n\
  \n我们结合使用 `Tiingo`2 API 和 `request` API 来提取收盘价和交易量数据：\n\n```\nimport requests\n\n\
  from google.colab import userdata\n\n##### Your Tiingo API key\n```\n\n\n\n\n#####\
  \ Tiingo API 异常检测\n\n###### API 密钥配置\n\n```python\nTIINGO_API_KEY = userdata.get('TIINGO_API_KEY')\n\
  ```\n\n###### 成交量数据选择\n\n对于使用 Tiingo API 进行异常检测，我们使用 `volume` 列，因为它代表给定交易日的实际成交股数，反映真实的交易活动。`adjVolume`\
  \ 列经过企业行为（如拆股）调整，适用于历史对比，但不适用于检测实时异常。因此，重点关注 `volume` 列以捕捉实际交易模式。\n\n我们知道 Z-score\
  \ 表示数据点（本例中为成交量）距离其均值的标准差数量[¹]。\n\n###### Z-score 计算\n\n以下代码计算 Z-score：\n\n```python\n\
  ####### Calculate Z-scores for trading volume\n####### rolling mean and std are\
  \ adaptive\nwindow_size = 20\nstock_data['Z-Score'] = (stock_data['volume'] - stock_data['volume'].rolling(window_size).mean())\
  \ / stock_data['volume'].rolling(window_size).std()\n```\n\n###### IQR 统计方法\n\n\
  我们从 IQR 方法开始介绍统计方法，用于检测数据集中的异常。IQR 方法是离群点检测最简单的统计技术之一。它通过计算第 1 四分位数（Q1）和第 3 四分位数（Q3）之间的范围，然后识别落在该区间之外的数据点[²]。\n\
  \n```python\n####### Step 2: Use trading volume for anomaly detection\nvolume_data\
  \ = stock_data['volume']\n\n####### Step 3: Calculate Q1, Q3, and IQR\nQ1 = np.percentile(volume_data,\
  \ 25)  # 25th percentile\nQ3 = np.percentile(volume_data, 75)  # 75th percentile\n\
  IQR = Q3 - Q1  # Interquartile Range\n\n####### Step 4: Define the lower and upper\
  \ bounds for anomalies\nlower_bound = Q1 - 0.3 * IQR\nupper_bound = Q3 + 1.5 * IQR\n\
  ```\n\n我们设置 `lower_bound = Q1 - 0.3 * IQR` 和 `upper_bound = Q3 + 1.5 * IQR`。下界调整得不那么严格，使我们能够捕捉比标准方法更多的低端异常：\n\
  \n```python\n####### Step 5: Identify anomalies (values below lower_bound OR above\
  \ upper_bound)\nstock_data['Anomaly'] = (volume_data < lower_bound) | (volume_data\
  \ > upper_bound)\n```\n\n然后绘制标记为异常的成交量点（红点）：\n\n![](img/fig-12-1-IQR-statistical-method.png)\n\
  \nIQR 方法和 Z-score 方法相似，都通过关注偏离中心趋势的数据点来识别异常。然而，IQR 方法利用第 25 和第 75 百分位数之间的差距来寻找离群点，而\
  \ Z-score 则基于数据点距离均值的远近来检测异常，通常标记超出 1.96 个标准差的点。\n\nZ-score 为 1.96 对应的点大约有 95% 的数据落在此\
  \ Z-score 范围内（-1.96 到 1.96 之间）。因此，剩余 5% 的数据落在此范围之外。为了识别异常，我们设定 Z-score 阈值为 1.96，标记超出典型\
  \ 95% 置信范围的数据点。\n\n以下代码应用此阈值检测成交量异常：\n\n```python\n# Set a Z-score threshold for\
  \ anomalies \nthreshold = 1.96\nstock_data['Anomaly'] = stock_data['Z-Score'].apply(lambda\
  \ x: True if abs(x) > threshold else False)\n\n####### visualize Anomalies\nstock_data[stock_data['Anomaly']\
  \ == True]\n```\n\n从概率角度看，这意味着随机选择的数据点其 Z-score 大于 1.96 的概率仅为 5%。实际中，Z-score 超过\
  \ ±1.96 的数据点被视为异常[³]。\n\n使用 1.96 的 Z-score 阈值是一种标记不太可能偶然发生的数据点的方法（仅 5% 的概率）。该阈值在统计学中常用于识别离群点或异常，因为它表明该数据点与数据集的大部分显著不同。\n\
  \n下图展示了使用 Z-score 方法检测到的 HDB 成交量异常。HDFC Bank（代码 HDB）是一家知名金融机构，印度最大的私营银行之一，在美国市场活跃交易。如前所述，历史市场数据来源于\
  \ Tiingo API。该图表提供多层视图：第一面板突出显示成交量异常，第二面板将这些异常叠加在调整后收盘价上，第三面板显示日收益率：\n\n![](img/fig-12-2-z-score-on-volume.png)\n\
  \n上述图表中，红点标记成交量超过异常阈值的点。第二张图将这些成交量异常叠加在调整后收盘价上，第三张图显示日收益率，使我们能观察异常成交量活动与价格或收益率变动之间的相关性。图表表明，许多异常发生在剧烈价格变化或趋势反转之前，提示成交量异常可作为市场趋势和反转的早期预警信号。\n\
  \n下图展示了 CPD 如何通过识别成交量趋势的结构性变化来增强异常检测。与突出孤立峰值的 Z-score 不同，CPD 跟踪更广泛的机制变化，提供更全面的市场动态视图。第一张图展示\
  \ CPD 分数（量化检测到的变化点的显著性）及识别出的变化点。第二张图将这些异常叠加在调整后收盘价上，有助于评估其对市场走势的影响。有关 CPD 方法的深入理解，请参见第\
  \ 9 章“无监督学习交易方法”。\n\n![](img/fig-12-3-CPD-on-volume.png)\n\n通过比较成交量异常（上图）与价格走势（下图）的时间点，我们可以评估成交量异常是否导致显著价格变化。\n\
  \n在许多情况下，检测到的成交量变化点与价格断裂相吻合。2023 年初，一个成交量异常（由 CPD 检测到[⁴]）与价格下行相关。2023 年中，另一个成交量异常后随价格下跌。2023\
  \ 年底至 2024 年初有多个 CPD 峰值，每次价格都经历显著方向变化。总之，CPD 算法有效检测成交量的显著变化，其中许多先于显著价格走势。通过捕捉这些结构性变化，CPD\
  \ 成为识别潜在价格断裂的宝贵工具，为交易员和分析师提供市场变化的早期信号。\n\n统计方法为异常和趋势变化提供有价值证据，而机器学习方法（如孤立森林）通过从数据本身学习模式，提供更复杂的工具，实现更动态和自适应的异常检测。\n\
  \n#### 机器学习方法\n\nZ-score 等统计方法使用预定义规则或阈值检测数据中的异常和变化。它们基于历史平均值、标准差或其他固定统计属性分析模式。这些方法对识别离群点或趋势突变有效，但在数据模式复杂或随时间演变时可能受限。\n\
  \n另一方面，机器学习方法超越固定阈值，从数据本身学习底层模式。这些模型适应数据结构，能检测更微妙、复杂或演变的异常。因为它们从数据中学习，能处理更动态的场景，在数据不遵循简单统计规范的情况下提供更好的检测。简而言之，统计方法提供清晰的基于规则的信息，而机器学习模型通过检测更多数据驱动的异常，提供灵活性和适应性。\n\
  \n[¹]: 参考文献 3\n[²]: 参考文献 4\n[³]: 参考文献 5\n[⁴]: 参考文献 6\n\n\n\n\n在以下示例中，我们将实现隔离森林（即机器学习方法）进行异常检测，重点分析成交量以检测早期价格变动。特征包括每日成交量、滚动平均成交量和成交量比率。这种无监督方法特别擅长识别罕见事件或异常值，并可能在重大价格变动前检测到异常的成交量激增。\n\
  \n隔离森林是一个很好的起点，原因如下。它需要调整的超参数很少，且计算效率高，使得训练和预测更快，尤其是在大型数据集上。它能有效处理较小的数据集，且不需要标记数据，这对许多异常检测任务来说是一个挑战。结果具有可解释性，并且无需大量特征工程即可处理高维数据。此外，它为每个数据点提供内置的异常分数。`Scikit-learn`7\
  \ 库中提供了隔离森林的实现，无需复杂设置即可使用。\n\n隔离森林通过分割数据点来隔离观测值。它通过构建树 8 来工作，其中异常点（罕见且不同）能以更少的分割更快地被隔离。算法根据数据点被隔离的速度为其分配异常分数，使其能有效检测高维数据集中的异常值。其高效性和简洁性使其成为异常检测中广泛使用的工具。\n\
  \n要在数据上实现隔离森林算法，我们创建一组用于成交量分析的特征。我们将使用每日成交量、滚动平均成交量和成交量比率作为隔离森林的特征：\n\n```python\n\
  ##### Calculate rolling averages and volume ratios\nstock_data['Rolling Volume Mean']\
  \ = stock_data['volume'].rolling(window=10).mean()\n\n##### Ratio of current volume\
  \ to rolling mean\nstock_data['Volume Ratio'] = stock_data['volume'] / stock_data['Rolling\
  \ Volume Mean']\n\n##### Drop NaN values (caused by rolling calculations)\nstock_data.dropna(inplace=True)\n\
  \n##### Select features for Isolation Forest\nfeatures = stock_data[['volume', 'Rolling\
  \ Volume Mean', 'Volume Ratio']].values\n```\n\n然后，我们拟合隔离森林模型：\n\n```python\nisolation_forest\
  \ = IsolationForest(contamination=0.1, random_state=42)\n```\n\n我们通过应用 `fit_predict()`\
  \ 函数明确标示异常：\n\n```python\nstock_data['Anomaly Score'] = isolation_forest.fit_predict(features)\n\
  ```\n\n下图显示了隔离森林检测到的异常，标记为红色 X 号：\n\n![](img/fig-12-4-isolation-forest-anomalies-detected.png)\n\
  \n为了进一步分析成交量异常与价格变动的关系，我们绘制了调整后收盘价以及检测到的成交量异常：\n\n![](img/fig-12-5-prices-related-to-anomalies.png)\n\
  \n在显著价格变动前出现了多个成交量异常，表明这些异常可能预示着即将到来的价格变化。例如，2023 年中检测到一系列成交量异常，随后价格明显上涨；同年晚些时候（2023\
  \ 年 11 月底至 2024 年 1 月初）价格下跌前也观察到类似模式。\n\n在关键价格拐点（如 2024 年初）周围存在异常聚类，此时观察到价格急剧下跌。这表明在重大价格变动前市场活动增加或出现异常交易模式。值得注意的是，跌价后立即出现几个异常，可能预示着市场动态的转变和即将到来的反弹。该模式表明，隔离森林检测到的成交量异常可作为趋势反转和潜在复苏阶段的早期预警信号。\n\
  \n对隔离森林算法的探索至此结束了我们对异常检测技术的介绍。我们现在已很好地理解了该领域的不同方法，包括统计方法和机器学习算法。\n\n接下来，我们的重点将转向集成方法的实现。该方法将时间序列聚类与降维算法相结合。\n\
  \n### 时间序列聚类与投影用于异常检测\n\n目标是根据正常和异常序列在拟议投影空间中的位置对其进行映射。我们提出的混合技术旨在利用序列聚类和降维的优势，以改进异常检测。区分金融时间序列是我们的主要目标。为了有效映射这些序列，我们首先构建能捕捉时间模式的有意义特征。\n\
  \n##### 特征工程\n\n正如 第 6 章 \"Improve Model Capability with Features\" 中所述，赫斯特指数提供了一种基于趋势持久性表征市场的有效方法。我们将把这一信息纳入时间价格序列（第\
  \ 1 天、第 2 天、第 3 天等）中。\n\n选择赫斯特指数作为特征符合其根本目的。该指标根据趋势持久性将时间序列分为三种潜在状态：趋势性、纯随机性或反持久性（均值回归）。因此，每个时间序列都将与其对应周期计算出的赫斯特指数配对。\n\
  \n让我们开始计算赫斯特指数：\n\n```bash\n!pip install -q hurst\n```\n\n```python\nfrom hurst\
  \ import compute_Hc\n\nwindow_size = 100  # Set a window size >= 100\n\n##### Make\
  \ sure to apply the rolling only on windows with enough data\nstock_data['hurst_price']\
  \ = stock_data['adjClose'].rolling(window=window_size).apply(\n    lambda x: compute_Hc(x,\
  \ simplified=True)[0] if len(x) >= 100 else np.nan, raw=False\n)\n```\n\n我们绘制赫斯特指数的计算结果，如下所示：\n\
  \n![](img/fig-12-6.png)\n\n第一张图显示了随时间变化的赫斯特指数（记为 H，窗口大小为 100 天），在 0.3 和 0.9 之间波动，表明存在不同时期的均值回归行为（H\
  \ < 0.5）和趋势行为（H > 0.5）。2021 年中左右赫斯特值出现明显峰值，表明市场趋势强劲持久，随后下降，意味着随机性增加或均值回归。\n\n第二张图显示了调整后收盘价（黑线）和成交量（蓝线）。成交量有几个显著峰值，特别是\
  \ 2024 年初，可能预示着重要市场事件或交易活动增加。\n\n总体而言，赫斯特指数和成交量的综合分析表明市场状态交替变化，趋势行为之后跟随随机性，但价格对高成交量峰值的反应保持稳定。\n\
  \n然后我们创建一组滞后特征 9。其目的是用历史信息和记忆丰富数据集（OHLC 值），从而捕捉时间模式和趋势。我们将为几个关键指标生成滞后版本（收盘价、收盘价百分比变化、Z\
  \ 分数、成交量百分比变化和赫斯特指数值）：\n\n```python\nfor i in range(1, 4):\n    stock_data[f'close_{i}']\
  \ = stock_data['adjClose'].shift(i)\n    stock_data[f'close_pct{i}'] = np.round(stock_data['adjClose'].pct_change().shift(i),\
  \ 3)\n    stock_data[f'zscore_{i}'] = np.round(stock_data['Z-Score'].shift(i), 2)\n\
  \    stock_data[f'volume_pct{i}'] = np.round(stock_data['volume'].pct_change().shift(i),\
  \ 3)\n    stock_data[f'hurst_{i}'] = np.round(stock_data['hurst_price'].shift(i),\
  \ 2)\n```\n\n特征集包含以下元素：\n\n```python\nlst_col = [\n    'open', 'high', 'low', 'close',\
  \ 'adjClose', 'volume', 'Z-Score', 'hurst_price',\n    'close_1', 'close_pct1',\
  \ 'zscore_1', 'volume_pct1', 'hurst_1',\n    'close_2', 'close_pct2', 'zscore_2',\
  \ 'volume_pct2', 'hurst_2',\n    'close_3', 'close_pct3', 'zscore_3', 'volume_pct3',\
  \ 'hurst_3'\n]\n```\n\n\n\n利用这些构建的特征，我们继续进行聚类分析，以识别独特的市场状态和异常模式。\n\n#### 聚类算法\n\n\
  在下面的代码中，我们将基础聚类算法应用于准备好的序列，以识别模式和市场状态。我们选择默认参数 10，不进行任何优化，就像我们之前进行超参数优化那样，从而允许快速迭代地测试想法。改进和参数调优留待后续进行，以改善初步结果并聚焦于最有前景的洞察：\n\
  \n```python\nfrom sklearn.cluster import KMeans\n\nclst = KMeans(n_init='auto',\
  \ n_clusters=8)\n\nclst.fit(stock_data[lst_col])\n\nnp.unique(clst.labels_, return_counts=True)\n\
  ```\n\n上述代码将产生以下输出：\n\n```\n[0, 1, 2, 3, 4, 5, 6, 7],\n[223, 102, 10, 240, 46, 2,\
  \ 279, 170]\n```\n\n该输出代表 `KMeans` 聚类的结果。它显示了聚类标签（0 到 7）以及分配给每个聚类的数据点数量（223、102、10\
  \ 等），表明了算法识别出的不同市场状态或模式下交易日的分布情况。\n\n挑战在于解读这些聚类中的每一个，以理解其所代表的底层市场状态。例如，我们需要确定包含\
  \ 223 个市场序列的聚类 0，对应的是趋势市场、均值回归行为，还是低波动时期。这种解读需要对聚类特征进行深入分析。\n\n#### 非线性投影与可视化\n\n\
  为了解决可视化高维数据的另一个挑战，我们采用了统一流形逼近与投影（`UMAP`11），这是一种最先进的降维技术。它允许我们将多特征数据集投影到二维地图上，从而更容易地可视化市场序列及其聚类关联。\n\
  \n```bash\n!pip install -q umap-learn\n```\n\n```python\nfrom umap import UMAP\n\
  \ntrsf = UMAP(n_neighbors=7, min_dist=0.1, n_components=2)\n```\n\n然后，我们将序列和聚类投影到由\
  \ `UMAP` 计算出的最优二维地图上：\n\n```python\nseqs_reduced = trsf.fit_transform(stock_data[lst_col])\n\
  \n##### 使用相同的 UMAP 变换转换聚类质心\ncentroids_reduced = trsf.transform(clst.cluster_centers_)\n\
  ```\n\n在将序列和聚类定位到二维地图上后，我们可以按如下方式计算每个序列到其分配的聚类中心的距离：\n\n```python\nfactor = 1.3\n\
  \n##### 步骤 1：计算到分配的聚类质心的距离\ndistances = np.array([np.linalg.norm(point - centroids_reduced[label])\
  \ \n                      for point, label in zip(seqs_reduced, clst.labels_)])\n\
  ```\n\n这种计算是异常检测的一种基本方法。本质上，异常被识别为与其同组中其他点显著偏离的点，更重要的是，与其聚类中心（作为参考点）显著偏离的点。这种方法通过量化异常点与其聚类所代表的预期行为之间的差异，有效地突出了离群值，为识别异常或潜在的异常市场序列提供了一个稳健的框架。\n\
  \n为了更详细地说明，我们应用一个阈值来确定哪个点是异常。该阈值针对每个聚类自适应计算，方法如下：\n\n```python\n##### 步骤 2：为每个聚类定义异常阈值\n\
  thresholds = {}\n\nfor label in np.unique(clst.labels_):\n    cluster_distances\
  \ = distances[clst.labels_ == label]\n    thresholds[label] = np.mean(cluster_distances)\
  \ + factor * np.std(cluster_distances)\n```\n\n异常被识别为显著偏离其分配的聚类中心、超出预定义阈值的序列，表明潜在的异常市场行为：\n\
  \n```python\n##### 步骤 3：识别主要聚类中的异常\nanomalies = np.array([distance > thresholds[label]\
  \ and (label in top_clusters)\n                      for distance, label in zip(distances,\
  \ clst.labels_)])\n```\n\n为了评估数据集中异常的普遍程度，我们计算超出阈值并被分类为异常的序列比例：\n\n```python\nprint(f\"\
  Anomalies: {100*np.sum(anomalies)/len(seqs_reduced):.2f}%\")\n```\n\n以下是输出结果：\n\n\
  ```\nAnomalies: 9.33%\n```\n\n分析显示，大约 10% 的序列被分类为异常。这一比例与异常检测中的标准实践吻合良好，处于典型的 1%\
  \ 到 10% 范围内。这种百分比表明了一种识别异常市场行为的平衡方法，在捕捉显著偏差的同时，不会过于敏感。\n\n下一步是在二维地图上绘制数据点。这种可视化将使我们能够观察市场序列的分布、它们的聚类关联，并可能在降维空间中识别异常。我们关注属于前四个拥挤聚类的点，如下所示：\n\
  \n![](img/fig-12-7-clustering-market-regime-anomalies.png)\n\n该图证实了 `UMAP` 是全面映射高度复杂和高维数据集的不可思议工具。在市场状态的\
  \ `UMAP` 可视化中，前四个聚类基于底层市场特征（如 OHLC、成交量、赫斯特指数等）代表不同的状态。每个聚类显示出独特的序列分组，质心以星号标记。聚类的紧密度和分布范围表明这些状态在市场稳定性和变异性方面存在差异。异常以黑色十字标记，代表距离其聚类超过阈值的序列。\n\
  \n下图通过将检测到的异常映射到价格走势上，为解读聚类提供了额外背景：\n\n![](img/fig-12-8.png)\n\n我们使用与图 12.7 相同的符号（圆圈、菱形、五边形和十字）在价格图表上可视化异常，以确定这四个异常聚类是否对应不同类型的市场事件。图中最引人注目的是，算法自动以高精度检测到了波峰和波谷。几乎所有异常都与关键市场水平对齐，突出了交易员广泛监控的关键支撑和阻力区域。这些水平充当枢轴，价格对其的反应往往决定下一步市场走向。当被突破时，它们作为交易的入场或出场点，强化了异常检测在识别市场高影响时刻方面的重要性。\n\
  \n不同聚类突出的异常具有不同的行为特征。一些聚类出现在强劲的上升动能附近，而另一些则与盘整期相吻合。这表明异常分类可以通过区分趋势延续形态和反转信号，进一步优化交易策略。\n\
  \n无监督算法能自然地检测出交易员手动识别为关键支撑和阻力区域的区域，这一事实尤为重要。\n\n这表明机器学习可以客观量化许多交易员主观分析的内容，为基于检测到的异常点的系统化交易策略铺平了道路。这种聚类、投影和异常检测相结合的方法，提供了许多机会，可转化为信息充分的交易系统。\n\
  \n### 用于趋势反转的异常检测\n\n这种方法利用异常检测，在趋势变化通过传统技术分析变得明显之前，预判潜在的趋势变化。\n\n当检测到异常 12（表明异常市场行为）时，我们沿着当前趋势的相反方向开仓。此处的推理基于我们之前的发现：大多数异常充当市场趋势反转的早期预警信号。\n\
  \n\n\n这些异常数据点通常预示着市场方向的重大转变：\n\n#### 通过移动平均线计算趋势\n\n```python\ndef detect_trend(prices,\
  \ window=20):\n    ma = prices.rolling(window=window).mean()\n    # 正斜率 ? -> 1 否则\
  \ -> -1\n    trend = np.where(ma.diff() > 0, 1, -1)\n    return trend\n```\n\n####\
  \ 应用趋势检测器\n\n```python\ntrend = detect_trend(stock_data['adjClose'], window)\n```\n\
  \n当前市场趋势由短期移动平均线 (MA) 确定。MA 的负斜率表示下跌趋势，而正斜率表示上涨趋势。随后，如果市场当前处于上涨趋势且检测到异常，系统做空；如果市场处于下跌趋势且检测到异常，系统做多。\n\
  \n```python\nfor i in range(window, len(stock_data)):\n    if anomalies[i] and clst_labels[i]\
  \ in top_clusters:\n        # 如果检测到异常，采取与趋势相反的仓位\n        positions[i] = -trend[i]\n\
  ```\n\n作为参数，设定了 120 天的交易窗口，并定义了 2% 的止损以限制潜在损失。同样，我们不会优化参数。相反，我们的目标是验证核心概念的现状，并评估其即使在初始、未经打磨的形式下是否能产生有希望的结果：\n\
  \n#### 应用策略\n\n```python\nwindow = 120\nstop_loss = -2/100\npositions, returns =\
  \ trading_strategy(stock_data, anomalies, clst.labels_, list(top_clusters), window)\n\
  returns = np.where(returns < stop_loss, stop_loss, returns)\n```\n\n我们计算累积收益、总收益、年化收益和夏普比率：\n\
  \n#### 计算累积收益\n\n```python\ncumulative_returns = np.cumsum(returns)\nprint(f\"Total\
  \ Return: {cumulative_returns[-1]:.2%}\")\nprint(f\"Annualized Return: {(1 + cumulative_returns[-1])\
  \ ** (252/len(returns)) - 1:.2%}\")\nprint(f\"Sharpe Ratio: {np.mean(returns) /\
  \ np.std(returns) * np.sqrt(252):.2f}\")\n```\n\n这段代码给出以下输出：\n\n```text\nTotal Return:\
  \ 28.45%\nAnnualized Return: 6.06%\nSharpe Ratio: 1.02\n```\n\n下图显示了策略（实线）和基准买入持有策略（虚线）的累积收益，后者由在期初买入并持有资产至整个周期结束组成：\n\
  \n![策略对比基准](img/fig-12-9.png)\n\n基于异常的策略利用趋势反转获利，在避免长期回撤的同时实现稳健增值。与买入持有法相比，它能动态适应市场\
  \ regime 变化，强化了异常检测在交易决策中的价值。\n\n与许多其他技术相比，此处使用的方法和算法参数更少且未经调优，属于无监督学习，与传统系统化交易策略相比，极大地降低了过拟合的风险。\n\
  \n无论如何，该策略都有显著的提升潜力：扩展至包含所有聚类而非仅主要聚类、优化异常区分方式而非一视同仁、以及改进趋势检测（因为当前的 MA 相当基础）。\n\n\
  无论如何，我们将介绍一个强大的数据科学工具，它将允许我们（除其他事情外）验证预定义的数据模式。该工具称为关联规则。\n\n### 基于聚类并结合关联规则的策略\n\
  \n核心思路是保持聚类作为我们工作的基础，同时增加一个验证工具来挖掘数据并识别事件之间的关联，随后将其转化为可执行的交易策略。\n\n#### 关联规则\n\n\
  关联规则识别数据中不同事件间的关系，突显经常一起出现的模式。\n\n关联规则挖掘是一个强大的工具，能将数据转化为有价值的洞察。以超市销售数据为例。通过分析这些数据，我们可以发现揭示购买习惯的模式。例如，我们可能会发现购买洋葱和土豆的顾客也倾向于购买汉堡肉：`{洋葱,\
  \ 土豆} ⇒ {汉堡肉}`。这些模式可能并不显而易见，但通过挖掘交易数据，企业可以发掘隐藏关系并利用它们优化产品摆放、促销或推荐。\n\n关联规则挖掘识别项目或事件之间频繁的共现。它是一种数据驱动的方法，各领域（包括零售和金融）的企业均可用其做出更明智的决策。\n\
  \n在金融领域，我们使用相同的方法来发掘市场行为之间隐藏的联系。通过识别反复出现的模式，例如成交量激增后跟随价格激增，我们可以将这些洞察转化为可执行的交易策略。\n\
  \n关联规则学习[¹]是一种无监督学习技术，能自动发掘隐藏关系。关联规则挖掘在没有预定义结果的情况下探索数据。它搜索经常一起出现的频繁项集，并提取称为规则的 if-then\
  \ 关系。这些规则表达为：如果事件 A 发生，事件 B 很可能随之发生。我们寻找的不是适用于所有事件且永远正确的完美规则。重要的是要理解，关联规则只发现正确的相关性，而非完美的真理。\n\
  \n##### 数据准备\n\n我们将把关联规则挖掘应用于序列和聚类数据集，以提取可执行的规则，旨在发掘可转化为交易策略的隐藏关系。为此，我们需要将数据集中的数值转换为布尔\
  \ True/False 指示器。这是必要的，因为关联规则算法通过寻找二元变量之间的模式来工作。这种简单的转换是将数据输入关联规则库之前所需的唯一准备工作，使我们能够无缝发现可用于交易决策的有意义联系。\n\
  \n理想情况下，利用关联规则，我们希望关联诸如 `is_cluster_A -> positive_return` 之类的事件。在这个虚构示例中，该规则应解读为：属于聚类\
  \ A 的序列很可能后跟正收益。\n\n在此示例中，`is_cluster_A` 是前件[²]。它是必须首先发生的条件或事件。`positive_return`\
  \ 是后件。后件是很可能随之发生的结果事件。\n\n我们如何使用这条规则？显然，这条规则建议每当序列属于聚类 A 时买入（做多）。\n\n为实施此方法，我们首先将数值转换为布尔（True、False）指示器，使关联规则算法能够识别有意义的模式，如下所示：\n\
  \n```python\nlag = 1\n##### 计算日收益率\nasset_ret = stock_data[\"close\"].pct_change().shift(-lag)\n\
  ##### 布尔 True/False 指示器\nasset1_bins_pos = asset_ret > 0\nasset1_bins_neg = asset_ret\
  \ < 0\n```\n\n我们使用滞后收益率（`lag = 1`），因为我们的目标是利用当前信息预测未来收益。我们标记了正负收益，并创建了一个包含其他显著因素的事件包，例如\
  \ `is_cluster_A` 到 `is_cluster_D`、`is_anomaly`、`is_trend` 和 `is_not_trend`：\n\n\
  ```python\nis_cluster_A = pd.Series(clst.labels_ == top_clusters[0])\nis_anomaly\
  \ = pd.Series(anomalies)\nis_hurst_trend = stock_data['hurst_price'] > 0.5\nis_hurst_notrend\
  \ = stock_data['hurst_price'] < 0.5\n```\n\n这建立在我们之前利用这些特征构建序列的工作基础之上。现在，正如提到的，我们需要将这些特征转换为逻辑（True/False）指示器。这是应用关联规则算法中的人工环节，即决定哪些事件足够显著以纳入分析。必须仔细填充这个事件包，因为输入的质量直接影响输出（垃圾进，垃圾出）。准备就绪后，关联规则学习算法将广泛挖掘这些事件以揭示它们之间的相关性：\n\
  \n#### 创建包含离散化收益的数据集\n\n\n\n\n# 数据准备与关联规则挖掘\n\n#### 数据集构建\n\n```python\ndataset\
  \ = pd.concat([asset1_bins_pos, asset1_bins_neg, is_cluster_A, is_cluster_B, is_cluster_C,\
  \ is_cluster_D, is_anomaly, is_hust_trend, is_hurst_notrend], axis=1)\n```\n\n以下是数据集的节选：\n\
  \n| date | asset_ret_pos | … | is_anomaly | is_hust_trend | is_hurst_not_trend |\n\
  | --- | --- | --- | --- | --- | --- |\n| 2020-05-29 00:00:00+00:00 | 1 | … | 0 |\
  \ 1 | 0 |\n| 2020-06-01 00:00:00+00:00 | 1 | … | 0 | 1 | 0 |\n| 2020-06-02 00:00:00+00:00\
  \ | 1 | … | 0 | 1 | 0 |\n| 2020-06-03 00:00:00+00:00 | 1 | … | 0 | 1 | 0 |\n| 2020-06-04\
  \ 00:00:00+00:00 | 1 | … | 0 | 1 | 0 |\n\n**表 12.1：关联规则的数据准备**\n\n数据准备完成后，我们现在可以继续挖掘关联规则，以发现市场事件之间有意义的关系。\n\
  \n#### 搜索关联规则\n\n数据准备已完成；现在我们只需要导入适当的库 15 并将数据集传入：\n\n```python\nfrom mlxtend.frequent_patterns\
  \ import apriori\nfrom mlxtend.frequent_patterns import association_rules\n\n#####\
  \ Perform association rule mining\nfrequent_itemsets = apriori(dataset, min_support=0.05,\
  \ use_colnames=True)\nrules = association_rules(frequent_itemsets, metric=\"confidence\"\
  , min_threshold=0.5)\n```\n\n关联规则算法可能会生成数百条规则，因为它会输出找到的所有规则，但其中许多缺乏有意义的洞察或不可操作。人类的角色是筛选所有这些规则，并专注于那些感兴趣的规则。\n\
  \n像 `x -> asset_ret_pos` 或 `y -> asset_ret_neg` 这样的规则是一个很好的起点，因为它们涉及作为结果（规则的右侧部分）的收益符号：\n\
  \n```python\n##### Filter rules where 'asset_ret' is in the consequents\nasset_ret_rules\
  \ = rules[rules['consequents'].apply(lambda x: 'asset_ret_pos' in x or 'asset_ret_neg'\
  \ in x)]\n```\n\n一旦我们专注于精确的规则，我们需要有效地确定发现规则的优先级并进行评估。我们需要一个可靠的指标来根据重要性和相关性对它们进行排序。\n\
  \n#### 理解关联规则学习中的提升度指标\n\n**提升度**16 指标显示两个事件之间的关联强度与它们随机发生时相比有多强。提升度大于 1 意味着事件同时发生的频率高于随机概率，表明存在有意义的关系。提升度低于\
  \ 1 表示事件同时发生的频率低于预期，而提升度恰好等于 1 意味着没有关联。\n\n以下图表有助于理解提升度指标：\n\n![](img/fig-12-10.png)\n\
  \n该库会执行所有这些计算，我们所要做的就是根据我们正在讨论的提升度标准对结果进行排序（`sort_values`）：\n\n```python\n#####\
  \ Sort by lift\nasset_ret_rules = asset_ret_rules.sort_values(['lift'], ascending=False)\n\
  asset_ret_rules\n```\n\n我们寻找基于聚类信息支持纯多头策略的规则。原因是纯多头策略更容易实施，且是一个很好的起点。当然，一旦我们对使用这个有前景的关联规则工具建立了信心，我们将进一步寻找更好（且可能更复杂）的规则。\n\
  \n以下是数据中支持纯多头策略的三条规则：\n\n*   `(is_cluster_A) → (asset_ret_pos)`, Lift: 1.005305\n\
  *   `(is_cluster_C) → (asset_ret_pos)`, Lift: 1.037014\n*   `(is_cluster_D) → (asset_ret_pos)`,\
  \ Lift: 1.002947\n\n这些规则表明聚类 C、A 和 D 与正收益相关，提升度均大于 1，这与纯多头策略一致。这支持了一种方法：当处于特定聚类（如\
  \ C、A 或 D）时做多，否则离场观望。\n\n现在，我们将所有这些转化为以下代码：\n\n```python\n##### Trading logic\n\
  for i in range(1, len(data)):\n    # cluster A : 0, C : 2 or D : 3\n    if cluster_labels[i-1]\
  \ == top_clusters[0] or \\\n       cluster_labels[i-1] == top_clusters[2] or \\\n\
  \       cluster_labels[i-1] == top_clusters[3]:\n        positions[i] = 1  # Go\
  \ long\n    else:\n        positions[i] = 0  # Exit position\n\n    # Update portfolio\
  \ value\n    portfolio_value[i] = portfolio_value[i-1] * (1 + positions[i] * returns[i])\n\
  \n##### Calculate performance metric\nsharpe_ratio = np.mean(strategy_returns) /\
  \ np.std(strategy_returns) * np.sqrt(252)\nprint(f\"Sharpe Ratio: {sharpe_ratio:.2f}\"\
  )\n```\n\n上述代码的输出如下：\n\n```text\nSharpe Ratio: 1.55\n```\n\n这是一个良好的绩效统计数据，以下权益曲线也予以确认：\n\
  \n![](img/fig-12-11.png)\n\n基于聚类并结合关联规则增强的策略实现了持续收益且波动率较低，跑赢了买入持有策略。夏普比率 1.5 确认了良好的风险调整后收益，证明了将无监督学习与规则验证相结合在交易中的有效性。\n\
  \n## 结论\n\n在本章结束时，我们探讨了金融市场的高级无监督学习技术，超越了传统的统计异常检测，转向更复杂的机器学习驱动方法。我们研究了隔离森林和 CPD，随后采用了一种结合序列聚类和非线性投影（UMAP）的混合方法来检测市场机制和趋势反转。\n\
  \n本章一个特别独特的贡献是将聚类和关联规则挖掘集成到异常检测中。关联规则挖掘在金融领域利用不足，尽管它在零售（推荐引擎）和工程（预测性维护）中取得了成功。通过将其应用于金融市场，我们展示了它如何能自动验证和优化基于异常的信号，增加了一层额外的稳健性。\n\
  \n最终的权益曲线证实了该策略的有效性，以夏普比率 1.5 跑赢买入持有策略，并展示了强劲的风险调整后收益。虽然参数调优和噪声过滤的进一步改进可能会提升结果，但本章提供了一种前沿的、数据驱动的金融分析方法。通过结合高级异常检测、聚类和关联规则，交易者可以系统性地预判市场转变，并基于数据而非直觉开发更稳健的交易策略。\n\
