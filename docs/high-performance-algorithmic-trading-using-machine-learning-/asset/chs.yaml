  \ 0.038869 | 0.017541 | 0.048115 | 0.086058 | 0.014192 |\n\n表 11.4：词嵌入向量\n\n######\
  \ 使用 UMAP 可视化词嵌入\n\n由于无法直接可视化这种复杂的多维数组（300 维），我们利用复杂的 UMAP10 算法，帮助在下图中可视化 30 家公司嵌入的子集：\n\
