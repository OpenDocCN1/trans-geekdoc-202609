  \n我们现在将关注本章的最后一节，该节专注于多资产支持。这对于从事套利和投资组合管理等多资产策略的交易者尤为相关。\n\n##### 多资产支持与高级功能\n\n\
  在本节中，我们将详细指导您完成以下过程：\n\n- 将多个数据源纳入您的策略\n- 执行涉及多个资产的交易策略。\n\n我们将开发一个交易系统，自动为一种资产执行买单，同时为另一种资产下达卖单，类似于一种资产反向交易的对冲策略。\n\
  \n以下展示了如何修改现有代码以包含多资产支持：\n\n```python\n###### 下载两个资产的数据：PG（宝洁）和 KO（可口可乐公司）\ndata1\
  \ = yf.download('PG', period='10d', interval='1d')\ndata2 = yf.download('KO', period='10d',\
  \ interval='1d')\n```\n\n添加包含信号的（自定义）列：\n\n```python\n###### 插入新列以跟踪预测\ndata1['custom']\
  \ = pred_dumb\ndata2['custom'] = pred_dumb\n```\n\n####### 添加多个数据源\n\n向 `Cerebro`\
  \ 添加多个数据源，每个代表不同的资产。这在 `init_cerebro_before_run()` 函数中完成：\n\n```python\ndef init_cerebro_before_run(data1,\
  \ data2):\n    # 向 Cerebro 添加多个数据源\n    data1 = CustomPandasData(dataname=data1)\n\
  \    data2 = CustomPandasData(dataname=data2)\n    cerebro = bt.Cerebro()\n\n  \
  \  # 向引擎添加数据源\n    cerebro.adddata(data1, name='PG')\n    cerebro.adddata(data2,\
  \ name='KO')\n\n    # 其余代码保持不变\n```\n\n为了在策略中处理多个资产，您需要修改 `__init__` 方法以初始化每个资产的变量。此步骤确保您的策略能够同时处理多个资产的数据和信号，从而实现更稳健和灵活的交易逻辑。\n\
  \n```python\ndef __init__(self):\n    self.custom_signal1 = self.datas[0].custom\n\
  \    self.custom_signal2 = self.datas[1].custom\n    # ... （其他初始化）\n```\n\n要为多个资产实现交易逻辑，您需要修改\
  \ `next` 方法以包含每个资产的逻辑。这确保您的策略根据各自的自定义信号（`custom_signal1` 和 `custom_signal2`）独立评估和执行每个资产的交易，从而实现量身定制的决策。如果\
  \ `custom_signal1` 触发资产 1 的买入，它不会影响资产 2 的交易行为。同样，资产 2 的信号也不会影响资产 1 的交易决策。当每个资产单独管理且其交易不相互依赖时，此逻辑适用。\n\
  \n```python\ndef next(self):\n    # 资产 1 的交易逻辑\n    if self.custom_signal1[0] ==\
  \ 1:\n        self.buy(data=self.datas[0])\n    elif self.custom_signal1[0] == -1:\n\
  ```\n\n\n\n\n\n# 第 4 章\n\n####### 交易逻辑实现\n\n```python\nself.sell(data=self.datas[0])\n\
  ```\n\n######## Asset2 的交易逻辑\n\n```python\nif self.custom_signal2[0] == 1:\n   \
  \ self.buy(data=self.datas[1])\nelif self.custom_signal2[0] == -1:\n    self.sell(data=self.datas[1])\n\
  ```\n\n如果我们要实现一个翻转交易系统，即买入一种资产会自动触发卖出另一种资产，可以按如下方式修改 `next` 方法中的交易逻辑。现在，`next` 函数实现了一个翻转交易系统，买入一种资产会自动触发卖出另一种资产。在这里，策略使用\
  \ `order_target_size` 来显式管理两种资产的仓位大小。\n\n```python\ndef next(self):\n    # 买入信号\n\
  \    if self.custom_signal1[0] == 1:\n        self.order_target_size(data=self.datas[0],\
  \ target=1)  # 买入 Asset1 : PG\n        self.order_target_size(data=self.datas[1],\
  \ target=-1)  # 卖出 Asset2 : KO\n    # 卖出信号\n    if self.custom_signal1[0] == -1:\n\
  \        self.order_target_size(data=self.datas[0], target=-1)  # 卖出 Asset1\n  \
  \      self.order_target_size(data=self.datas[1], target=1)  # 买入 Asset2\n```\n\n\
  在修改后的代码中，买入或卖出一种资产会自动触发对另一种资产的相反操作。这是通过使用 `order_target_size` 将目标仓位设置为 1 股（买入）或\
  \ -1 股（卖出）来实现的。如果 `custom_signal1` 发出 Asset1 的买入信号，策略不仅会买入 Asset1，还会卖出 Asset2；反之，对于卖出信号亦然。当两种资产呈负相关，或策略旨在维持平衡敞口（例如配对交易策略）时，这种逻辑非常理想。\n\
