  \ len(tickers) * 0.2]`\n\n###### 最差表现者\n\n`bottom_decile = ranked_ret[ranked_ret\
  \ > len(tickers) * 0.9]`\n\n`bottom_decile.dropna()`\n\n我们从 `top_decile` 列表买入股票（`long_positions`），并卖出\
