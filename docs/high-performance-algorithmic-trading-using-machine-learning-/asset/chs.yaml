  \ | 149.610001 | -1 |\n| 2023-11-02 | 149.539993 | 150.865005 | -1 |\n\n**表 4.2：'PG'\
  \ 股票的价格历史**\n\n我们可以看到符合预期逻辑的交易序列：对一种资产（PG）进行干预，会在对冲逻辑下触发对另一种资产（KO）的相反交易。\n\n## 结论\n\
  \n在本章中，我们探讨了回测和交易库的基础知识。我们介绍了关键库及选择合适工具的标准，随后提供了使用 BackTrader 实现策略的实用分步指南。在此过程中，我们探讨了管理算法订单、引入风险管理技术（如设置止损限价或仓位规模规则）等关键概念。凭借对这一最先进的事件驱动库进行回测的扎实理解，您现在已具备设计和测试复杂交易策略的能力。\n\
