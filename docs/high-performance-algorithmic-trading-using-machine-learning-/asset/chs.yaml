  ret = data['Adj Close'].pct_change(periods=10)\n\n##### 删除 `NaN` 值\n```\n\n\n\n\
  `ret.dropna(inplace=True)`\n\n然后，遵循 Ed Thorp 概述的逻辑，我们首先对收益率进行排序（rank 函数），以确定每个历史时期表现最好（`top_decile`）和最差（`bottom_decile`）的股票。\n\
  \n##### 根据股票的百分比变化对其进行排名\n\n`ranked_ret = ret.rank(axis=1, ascending=False)`\n\n\
