  \n从装袋法过渡到提升法，这两种都是目标共同为模型改进的强大集成技术，我们现在将探究是什么区分了这些方法，以及它们各自如何独特地贡献于模型的预测能力。\n\n\
  ### 利用提升方法实现高准确性\n\n提升法是一个顺序过程，其中每个后续模型都试图纠正其前驱模型的错误，有效地将弱学习器组合起来创建一个强大的整体模型。与装袋法独立构建模型不同，提升法通过更多地关注前一个模型分类错误的训练实例，来专注于提高集成的准确性。\n\
  \n提升法的主要优势在于其通过专注于难以分类的示例来持续改进的能力。\n\n流行的提升算法包括 `AdaBoost`（自适应提升）、`GBM`（梯度提升机）、`XGBoost`（极端梯度提升）和\
  \ `LightGBM`（轻量级梯度提升机）：\n\n• `AdaBoost` 通常被认为是较简单的提升方法之一，可以作为一个好的起点。\n\n• `GBM`\
  \ 更灵活但需要仔细调优。\n\n• `XGBoost`11 以其性能和速度著称，由于其效率和可扩展性，经常赢得机器学习竞赛。\n\n• `LightGBM`12\
  \ 设计得更快、更高效，特别是在大数据集上，使其成为交易场景中处理大量数据和快速决策至关重要的强大工具。\n\n然而，由于这些后者算法的复杂性和超参数 13 的数量庞大，调优它们可能更具挑战性，这也意味着更高的计算需求。您可以参考第\
  \ 5 章《交易系统的监督学习》了解这些算法的详细信息。\n\n#### XG-Boost\n\n对于表格数据，这在交易场景中很常见，例如 `OHLC` 数据集，`XGBoost`\
  \ 发布时被誉为最先进的算法。然而，自那时起，像 `LightGBM` 这样的新算法已经出现，在某些情况下提供了卓越的性能。\n\n不幸的是，最大化这些算法的效率通常需要仔细的超参数调优，这是一个既具挑战性又耗时的过程。\n\
  \n利用第 3 章《优化交易系统、指标和自动化报告》中的见解，该章专注于使用 `HyperOpt`14 等工具增强交易策略，我们现在将应用类似的方法使用 `Scikit-Optimize`15。该工具箱使我们能够在超参数空间内进行智能的贝叶斯搜索。我们的目标是微调这些超参数并实现最优性能。\n\
  \n首先，使用以下代码安装所需工具：\n\n```\n!pip install -q scikit-optimize\n```\n\n```\nfrom skopt\
  \ import BayesSearchCV\nimport xgboost as xgb\nfrom xgboost import XGBClassifier\n\
  \n##### Hyperparameter search space\nspace = {\n    'learning_rate': Real(0.01,\
  \ 0.3, prior='uniform'),\n    'n_estimators': Integer(100, 1000, prior='uniform'),\n\
  \    'max_depth': Integer(3, 25, prior='uniform'),\n    'gamma': Real(0, 1, prior='uniform'),\n\
  \    'min_child_weight': Integer(1, 10, prior='uniform'),\n    'subsample': Real(0.5,\
  \ 1, prior='uniform'),\n    'colsample_bytree': Real(0.5, 1, prior='uniform'),\n\
