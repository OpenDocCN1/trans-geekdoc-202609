  \n![](img/Discord.png)\n\n### 第 6 章：利用特征提升模型能力\n\n## 简介\n\n提升模型性能在很大程度上取决于有效的特征工程。在本章中，我们将探讨不同的特征工程和选择方法，涵盖广泛的技术。我们从基于开盘价、最高价、最低价、收盘价（OHLC）的基本方法开始，逐步深入到基于机器学习的更高级技术，如\
  \ PCA 和 UMAP。我们还将讨论特征选择方法及其在模型优化中的关键作用。本章介绍了多种特征工程方法，从统计和基于信息的特征（如赫斯特指数和熵）开始。然后探讨更高级的技术，包括源自决策树的特征。通过展示这些方法，本章为读者提供了将原始数据转化为有意义输入的工具，从而提高模型性能和可解释性。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 基于 OHLC 的基本特征\n- 技术特征\n- 波动率和基于美元的特征\n- 记忆保留特征\n\
  - 统计和基于信息的特征\n- 基于机器学习的特征\n- 特征选择\n\n## 目标\n\n在本章结束时，读者将对特征工程及其对模型性能的影响有一个清晰、实用的理解。他们将学习如何应用各种技术，从基本转换到基于机器学习的高级方法。\n\
  \n一个关键收获是选择和设计能够提高预测准确性同时降低过拟合风险的特征的能力。本章强调了在信息量丰富的特征与模型复杂性之间取得平衡的重要性，以确保更稳健和可泛化的结果。\n\
  \n此外，读者将培养分析思维技能，并深入了解特征工程和选择背后的决策过程。通过实践操作，他们将学会将原始数据转化为提高模型性能的有用特征。\n\n## 基于 OHLC\
  \ 的基本特征\n\n在讨论用于算法交易的机器学习时，理解基本特征（如 OHLC 数据）至关重要。OHLC 数据代表了金融时间序列数据的主要结构，提供了关于价格变动的重要信息。\n\
  \n### 滞后值作为特征\n\n将滞后值作为特征引入，将过去观测值的记忆纳入分析。这种方法认识到过去的值可能对未来趋势产生重大影响，捕捉了对准确预测至关重要的时间依赖性。通过使用滞后特征，模型可以更好地基于历史数据理解和预测模式，从而做出更稳健和明智的决策。\n\
  \n例如，下表展示了一个简单的一维时间序列，值从 1 到 7，以及添加滞后为 2 的滞后特征后的结果：\n\n| 时间索引 | 数值 | Lag_1 | Lag_2\
  \ |\n| :--- | :--- | :--- | :--- |\n| 0 | 1 | | |\n| 1 | 2 | 1 | |\n| 2 | 3 | 2\
  \ | 1 |\n| 3 | 4 | 3 | 2 |\n| 4 | 5 | 4 | 3 |\n| 5 | 6 | 5 | 4 |\n| 6 | 7 | 6 |\
  \ 5 |\n\n表 6.1：时间序列转滞后特征\n\n在探讨了通过滞后特征引入记忆到模型中的好处之后，现在让我们使用对 OHLC 数据的简单算术运算来提取有洞察力的特征，以进一步增强我们的时间序列分析。\n\
  \n##### 基于算术的特征\n\n在量化金融背景下，可以使用对 OHLC 数据的基本算术运算[¹] 创建各种特征。这些特征涉及 OHLC 值的组合和转换，以捕捉市场行为的不同方面：\n\
  \n- **基于波动率的特征**：\n  公式：`((high - low) / open)`\n  它衡量单个交易周期内价格的相对波动率。\n\n- **价格动量特征**：\n\
  \  公式：`(close / close.shift(5)) - 1`\n  它表示过去五个周期收盘价的百分比变化。\n\n[¹]: [chap06.xhtml#footnote-120]\n\
  \n\n\n\n• **日内价格区间特征**：\n\n公式：`(high - low) / (high.shift(1) - low.shift(1))`\n\n\
  它将今日价格区间与前一日区间进行比较。\n\n• **收盘价在区间中的相对位置**：\n\n公式：`(close - low) / (high - low)`\n\
  \n它指示收盘价位于当日区间的何处。\n\n• **相对前收盘价的跳空特征**：\n\n公式：`(open - close.shift(1)) / close.shift(1)`\n\
  \n它衡量从前一收盘价到今日开盘价的价格跳空。\n\n• **归一化最高价特征**：\n\n公式：`(high - mean(OHLC)) / std(OHLC)`\n\
  \n它将最高价相对于 `OHLC` 值的均值和标准差进行归一化。\n\n• **收盘价对开盘价的相对变化**：\n\n公式：`(close - open) /\
  \ open`\n\n它衡量同一交易时段内的百分比价格变动，将收盘价与开盘价进行比较，作为开盘价的比例。\n\n• **加权 OHLC 平均值**：\n\n公式：`(open\
  \ + high + 2*close + low) / 5`\n\n它代表 `OHLC` 的加权平均值，赋予收盘价更大的权重。\n\n• **归一化成交量加权收盘价**：\n\
  \n公式：`(close * volume) / mean(volume)`\n\n它代表由交易量调整并按平均成交量归一化的收盘价。\n\n• **高低点聚类**：\n\
  \n公式：`(high - high.shift(1)) * (low - low.shift(1))`\n\n它考察高低点与前一周期相比的聚类效应，并提供连续周期高低点之间关系的定量度量。\n\
  \n下图可视化了 `SPY` ETF 价格的高低点聚类效应，SPY 是一种跟踪标普 500 指数的交易所交易基金 (ETF)。图表展示了这些波动如何与上述计算相一致：\n\
  \n![](img/fig-6-1.png)\n\n底部曲线代表 HL 聚类度量，明显的峰值表明连续高点和低点之间存在显著偏差，反映了价格波动率增加的时期。\n\
  \n这些特征通过简单的算术运算创建，在算法交易模型中使用时可能很有用。它们捕捉了市场行为的各个方面，从波动率和动量到相对定位和价格走势趋势。让我们继续探索创建不需要密集运算的简单特征。\n\
  \n##### 特征离散化\n\n特征离散化可以是一种有价值的转换。金融时间序列数据通常是连续且高度变化的，这使得机器学习算法难以处理。通过将连续特征转换为一组有限的离散区间或类别，特征离散化简化了数据并增强了模型的可解释性。`Scikit-learn`\
  \ 提供了这一原理的实现。正如文档[²]所述，特征离散化涉及以下步骤：\n\n1. 将每个特征分解为一系列等宽的箱体。\n2. 对这些离散值进行编码。\n3.\
  \ 将这些特征输入机器学习算法。\n\n以下是这些步骤所需的代码：\n\n```python\nfrom sklearn.preprocessing import\
  \ KBinsDiscretizer\n\n#### 使用 KBinsDiscretizer 转换数据集\nenc = KBinsDiscretizer(n_bins=8,\
  \ encode=\"onehot\")\nX = enc.fit_transform(df)\n```\n\n此过程允许模型表现出非线性行为（即使在线性分类器的情况下也是如此！）。适当应用的特征离散化因此可以提高模型性能，从而设计出更有效的策略。\n\
  \n所有这些特征，连同所有列的百分比变化和滞后值，为机器学习算法构成了一套全面的初始特征集。该特征集应用于日频 `SPY` ETF，使用 `Random Forest`（随机森林）分类器。关于此处使用的监督学习概念，请参阅\
  \ 第 5 章，交易系统的监督学习。生成的分类用于生成权益曲线，提供模型随时间变化的性能可视化表示：\n\n![](img/fig-6-2-classifier-RF-OHLC-technical-feature.png)\n\
  \n以下是该系统的混淆矩阵：\n\n| | precision | recall | f1-score | support |\n|---|---|---|---|---|\n\
  | -1.0 | 0.11 | 0.51 | 0.18 | 143 |\n| 1.0 | 0.92 | 0.55 | 0.69 | 1364 |\n| accuracy\
  \ | | | 0.55 | 1507 |\n| macro avg | 0.51 | 0.53 | 0.43 | 1507 |\n| weighted avg\
  \ | 0.84 | 0.55 | 0.64 | 1507 |\n\n此示例作为一个初步的有希望的探索，此处的重点不是对该特定算法的详细分析[³]，因为本章后续章节将展示进一步的实验。\n\
  \n在基础特征的基础上，我们现在转向探索基于技术交易指标的特征，这些指标能提供对市场趋势和交易者行为更深刻的洞察。\n\n## 技术特征\n\n技术指标植根于市场价格和成交量数据，是交易者检测趋势、识别市场状态、衡量动量和波动率的重要工具。这些指标反映了交易专业知识和市场心理，弥合了原始金融数据与可操作洞察之间的鸿沟。它们为机器学习中的特征工程提供了关键基础，在特征工程中，它们被转化为可度量的属性以改进预测模型。\n\
  \n对于对技术分析在金融市场中盈利能力证据感兴趣的读者，Park 和 Irwin 进行的研究[⁴]提供了全面的综述。它涵盖了调查、理论和实证研究，以评估技术交易策略的有效性。该文献指出，虽然早期研究显示外汇和期货市场存在盈利能力，但后期研究显示在各个市场中都存在稳定的利润。\n\
  \n这些指标通常是算法交易中机器学习模型特征集的基本组成部分。我们将探讨一系列关键技术指标，根据其主要功能对其进行分类，例如趋势检测、动量指标、资金流向和波动率分析。\n\
  \n让我们简要介绍将帮助我们实现这些指标的 `pandas_ta` 库。\n\n### 使用 Python 实现技术指标\n\n当涉及到在 Python 中将技术指标作为机器学习特征实现时，两个流行的库是\
  \ `TA-Lib`[⁵] 和 `pandas_ta`[⁶]。\n\n选择哪一个取决于您的具体需求：\n\n• `TA-Lib` 广泛使用、功能全面、效率高，并具有多种编程语言的绑定。然而，其在某些系统上的安装可能很复杂，且与\
  \ `Pandas` 库的集成度较低。\n\n• `pandas_ta` 与 `pandas` DataFrame 配合使用非常容易，更符合 Python 风格，且安装简单。然而，对于大型数据集，它可能会较慢。\n\
  \n在我们的案例中，出于易用性和与 `Pandas` 库嵌套集成的原因，我们将使用 `pandas_ta`。\n\n在以下章节中，让我们看看构建交易系统特征的主要指标（及其实现）。\n\
  \n##### 趋势检测\n\n为了有效分析和解读市场趋势，通常使用以下指标：\n\n• **移动平均线 (MA)**：通过平滑价格波动来识别潜在趋势\n• **指数移动平均线\
  \ (EMA)**：对近期价格变化更敏感，有助于检测短期趋势\n• **移动平均收敛发散指标 (MACD)**：突显趋势方向和动量，以及潜在的反转\n\n要实现这些指标，请安装并导入\
  \ `pandas_ta`：\n\n```bash\npip install -q pandas_ta\n```\n\n```python\nimport pandas_ta\
  \ as ta\n```\n\n该库的用法包括调用相应的函数，然后将计算结果添加到 `pandas` DataFrame 中：\n\n```python\n#####\
  \ 窗口为 5 个周期的移动平均线 (SMA)\n```\n\n\n\n\n##### 技术指标与特征工程\n\n## 移动平均线\n\n```python\n\
  df['SMA_5'] = df.ta.sma(close='Close', length=5)\n```\n\n### 指数移动平均线 (EMA)\n\n```python\n\
  df['EMA_5'] = df.ta.ema(close='Close', length=5)\n```\n\n以下代码代表 MACD 线，即 12 周期 EMA（短期）与\
  \ 26 周期 EMA（长期）之间的差值：\n\n### 使用 pandas_ta 计算 MACD\n\n```python\ndf['MACD'] = df.ta.macd(close='Close')['MACD_12_26_9']\n\
  ```\n\n此外，MACD 的 9 日 EMA 常被用作触发线以生成买入和卖出信号，当其穿越 MACD 线上方或下方时，指示潜在的进场或离场点。这条平滑线（`MACD_signal`）通过识别与\
  \ MACD 线的交叉来帮助生成买入和卖出信号。\n\n其计算代码如下：\n\n```python\ndf['MACD_Signal'] = df.ta.macd(close='Close')['MACDs_12_26_9']\n\
  ```\n\n##### 动量指标\n\n动量指标帮助交易者评估价格变动的强度和速度，并识别潜在的超买、超卖或趋势反转状况。\n\n技术分析中常用以下指标，并附带相应的代码片段演示其实现：\n\
  \n* **相对强弱指标 (RSI)：** 测量价格变动的速度，指示超买或超卖状况 7，如下所示：\n\n```python\n### RSI\ndf['RSI']\
  \ = df.ta.rsi(close='Close', length=14)\n```\n\n* **随机振荡器 8：** 显示收盘价相对于高低价区间的位置，识别潜在转折点，如下所示：\n\
  \n```python\n### 随机指标\nstoch = df.ta.stoch(high='High', low='Low', close='Close')\n\
  df = pd.concat([df, stoch], axis=1)\n```\n\n* **商品通道指数 (CCI)：** 识别新趋势或周期性状况，适用于多样的市场环境。CCI\
  \ 测量证券当前价格变化与其平均价格变化之间的差异，帮助交易者识别商品及其他证券中的周期性趋势，如下所示：\n\n```python\n### CCI\ndf['CCI']\
  \ = df.ta.cci(high='High', low='Low', close='Close')\n```\n\n##### 波动率测量\n\n波动率测量指标有助于评估价格波动的剧烈程度，提供对市场状况和潜在突破的洞察。这些指标对于识别高或低波动率时期特别有用，这会影响交易策略。\n\
  \n以下是关键波动率指标及其代码实现：\n\n* **布林带 9：** 适应市场波动率，提供对市场状况和潜在突破的洞察。\n\n```python\n#######\
  \ 使用 pandas_ta 计算布林带\nbollinger = df.ta.bbands(close='Close', length=20, std=2)\n\
  df = pd.concat([df, bollinger], axis=1)\n```\n\n* **平均真实波幅 (ATR)：** 通过分解该周期资产的整个波动范围来衡量市场波动率。\n\
  \n## 成交量与资金流\n\n成交量和资金流指标有助于评估市场参与度和流动性，提供对趋势强度和潜在反转的洞察，如下所示：\n\n* **成交量：** 对于确认趋势的强度和可持续性至关重要\n\
  * **资金流指标 (MFI)：** 结合价格和成交量来衡量资金流入和流出，通常预示着潜在的反转\n\n到目前为止，我们一直保持 OHLC K 线的原始时间结构，这是开发交易算法后续所有步骤的基础。在接下来的章节中，我们将讨论挑战这种将\
  \ OHLC K 线划分为固定时间间隔的刚性结构的研究。\n\n### 基于波动率和美元金额的 K 线特征\n\n美元金额 K 线的基本思想是将数据聚合为 K\
  \ 线，而不是时间间隔或交易次数，即当累计美元价值（价格乘以成交量）达到指定阈值时形成一根新 K 线。在捕捉交易量和价格变动的影响比单纯观察基于时间的切片更有信息量的各种场景中，这种方法非常有用。\n\
  \n美元金额 K 线的适用性在日内数据或高频交易环境中尤为相关，因为传统的基于时间的 K 线可能无法充分捕捉市场动态。它们在管理日内数据中的噪音和变异性方面特别有效。\n\
  \n美元金额 K 线也可适用于交易量不规则或高波动率的市场；通过关注成交金额而非时间间隔，美元金额 K 线有助于规范化数据，因为时间间隔可能稀疏或不一致。\n\n\
  以下是微软 (MSFT) 股票典型基于时间的数据集示例，显示交易日内按 60 分钟间隔记录的价格：\n\n![MSFT 基于时间的数据集](img/fig-6-3.png)\n\
  \n现在，我们可以观察到将美元金额 K 线切片方法应用于该数据集时出现的显著差异。\n\n我们根据该股票历史美元成交金额设定阈值（美元价值均值加上一个标准差）：\n\
  \n```python\n### 每笔交易的美元价值\ndf['Dollar'] = df['Close'] * df['Volume']\n\n### 设置您的美元金额\
  \ K 线阈值\nthreshold = df['Dollar'].mean() + df['Dollar'].std()\n\nprint(threshold\
  \ / 1e8)\n### 15.612632865944716\n```\n\n在下文中，我们观察到每当市场成交金额超过设定阈值，就会形成一根新 K 线。这是通过计算相应时间切片的标准统计量（OHLC）来实现的：\n\
  \n```python\nfor index, row in df.iterrows():\n    if open_price is None:\n    \
  \    open_price = row['Open']\n        index_bar = index\n    high_price = max(high_price,\
  \ row['High'])\n    low_price = min(low_price, row['Low'])\n    volume += row['Volume']\n\
  \    cum_dollar += row['Dollar']\n```\n\n此过程确保 K 线根据市场活动动态创建，而非在固定时间间隔创建。以下代码片段演示了如何在成交金额跨越预定义阈值时，为每根新\
  \ K 线计算标准价格统计量 OHLC，从而有效捕捉有意义的价格变动。\n\n我们获得了以下数据集。正如下图所示，通过基于成交金额计算 K 线，K 线数量减少了一半（5094\
  \ 对比 2145）：\n\n![美元金额 K 线数据集](img/fig-6-4.png)\n\n对于波动率 K 线，原理如下：K 线基于价格波动率水平而非时间或成交量形成。这意味着仅当价格变动或波动率达到特定阈值时，才会创建新\
  \ K 线。波动率 K 线的目的是捕捉显著的市场变动并过滤掉噪音，使其在震荡或高波动市场中特别有用。通过关注波动率，这些 K 线基于实际市场行为而非任意时间框架，提供了更清晰的市场趋势和潜在反转视图。\n\
  \n在下一节中，我们将继续探索改进 OHLC K 线的策略。我们接下来的重点不再是改变 K 线的划分方式（如前所述），而是确保在保持稳定统计特征的同时，保留价格\
  \ K 线内的信息。\n\n### 记忆保留特征\n\n计算金融学中的主要挑战之一是实现输入序列的平稳性 10。我们为什么要关心这个棘手的统计细节？答案很简单。\n\
  \n当输入特征平稳时，机器学习算法表现更好。\n\n那么问题来了，“我们如何确保模型的输入是平稳的？”分阶差分 11。这有助于在实现平稳性的同时仍保留序列的一些记忆。分阶差分很有价值，因为它在保留部分记忆的同时转换时间序列数据，使其比失去所有过去依赖的完全差分序列更有利于预测。\n\
  \n简单来说，差分序列常用于计算金融数据中的收益率：\n\n![收益率公式](img/eq-11.jpg)\n\n\n\n\n\n### 分数阶差分\n\n说明分数阶差分的一个更简单方法是修改标准差分公式，使其允许部分差分。我们不再简单地减去前一个价格（如标准差分那样），而是引入一个分数权重：\n\
  \n![](img/eq-21.jpg)\n\n在选择差分阶数 `d` 时存在权衡，如下所示：\n\n*   **较低的 `d`，接近 0：** 保留更多记忆，意味着有价值的历史模式和依赖关系得以保留，但序列可能仍表现出非平稳行为。\n\
  *   **较高的 `d`，接近 1：** 实现更多平稳性，使数据更适合机器学习算法，但代价是丢失一些可能具有预测价值的过去信息。\n\n当 `0 < d <\
  \ 1` 时，过去的价格仍有贡献，但其影响力逐渐减弱。这意味着分数阶差分平滑地减少记忆，而非完全移除它，帮助交易者在保留有用历史模式的同时，使数据更稳定以便建模。当\
  \ `d = 1` 时，它简化为标准差分（收益率）。\n\n此外，通过转换序列，您可能也在过滤掉噪声，这可以为机器学习模型带来更清晰的模式以供学习。\n\n在下图中，我们对\
  \ CAC40 指数（雅虎代码 `'^FCHI'`）实施了我们讨论的方法，该指数代表法国股票市场。\n\n结果符合我们的预期：\n\n![](img/fig-6-5-frac-diff-FCHI.png)\n\
  \n在图中，我们可以看到不同程度的分数阶差分（`d=0.1`、`0.2`、`0.35`）如何在保持整体模式完整的同时逐步平滑数据。这意味着序列变得更稳定、噪声更少，这有助于机器学习模型通过专注于基本趋势而非被随机噪声干扰来表现得更好。\n\
  \n为了检验[¹²]序列的平稳性，一种常用方法是使用增广迪基-富勒（ADF）检验，它评估时间序列是否非平稳。对于不熟悉的人来说，该检验本质上测试序列是否随时间保持一致的属性，这对许多统计和机器学习模型至关重要。\n\
  \n以下是其实现示例：\n\n```python\nfrom statsmodels.tsa.stattools import adfuller\n\n###\
  \ 执行增广迪基-富勒检验\nfor item in lst:\n    print(item)\n    adf_result = adfuller(df_lag[item].dropna())\n\
  \n    # 提取检验统计量和 p 值\n    adf_statistic, p_value = adf_result[0], adf_result[1]\n\
  \n    # 显示结果\n    print(np.round(p_value, 4))\n    print(f'this series is stationary\
  \ ? -> {p_value < 0.05}')\n```\n\n输出：\n\n```text\n^FCHI_Close\n0.3037\nthis series\
  \ is stationary ? -> False\n\n^FCHI_Close_diff_frac_0.1\n0.0563\nthis series is\
  \ stationary ? -> False\n\n^FCHI_Close_diff_frac_0.2\n0.0092\nthis series is stationary\
  \ ? -> True\n\n^FCHI_Close_diff_frac_0.3\n0.0007\nthis series is stationary ? ->\
  \ True\n```\n\n我们得出结论，效果符合预期：少量的分数阶差分足以使序列符合统计要求。通过应用分数阶差分，可以在去除足够噪声以防止过拟合与保留序列中足够记忆以允许有意义预测之间保持平衡。这对金融时间序列至关重要，因为完全差分有时会移除人们试图建模的信号本身。\n\
  \n分数阶差分并非没有挑战。一个问题是它需要仔细选择差分阶数[¹³]，这并不简单，通常需要一些经验或统计理由。此外，计算复杂度[¹⁴]高于传统方法。\n\n为了总结这种方法，我们需要将这种转换集成到机器学习框架内的操作序列中。首先，我们对序列应用分数阶差分，然后使用转换后的序列进行机器学习。一旦序列被转换，它就可以作为特征用于机器学习算法。机器学习模型被训练以基于此转换后的序列（以及任何其他相关特征）对结果进行分类或预测。\n\
  \n接下来，我们将关注统计和基于信息的特征，以增强我们的数据分析。\n\n## 统计和基于信息的特征\n\n在本节中，我们的重点将是考察两个关键指标：熵和赫斯特指数。让我们从赫斯特指数开始。\n\
  \n### 赫斯特指数\n\n赫斯特指数的历史非常迷人，始于 20 世纪中叶，旨在利用埃及尼罗河的水力，特别是通过大坝建设等宏伟工程。大英帝国完成这一巨大壮举，很大程度上归功于杰出水文学家哈罗德·埃德温·赫斯特的贡献，他发现了一种非凡的统计方法，能够捕捉时间序列中的记忆效应。赫斯特的任务是了解河流的长期变异性，以优化埃及水库的蓄水容量。他观察到了河流流量和水位中的持久性，即长期记忆现象。这导致了赫斯特指数的发展，这是一种统计度量，此后被广泛应用于各个领域，特别是科学和工程，用于分析时间序列数据。\n\
  \n这种为尼罗河洪水模式提供重要知识的方法，正是我们计划在机器学习算法中用作特征的方法。\n\n计算赫斯特指数（用 `H` 值表示，以纪念 E. Hurst）是量化时间序列呈趋势或均值回归程度的一种方式。`H`\
  \ 值指示趋势或均值回归的存在，并量化持久性。\n\n为了掌握赫斯特指数的功能，我们将创建三个表现出不同行为的时间序列：一个具有强烈均值回归倾向，一个代表随机游走，第三个显示持久行为。\n\
  \n然后我们将计算每个序列的赫斯特指数，以验证该统计度量是否准确辨别每个过程的特定性质和状态：\n\n*   **`H < 0.5`** 表示均值回归行为。\n\
  \n在下图中，上方子图展示了一个均值回归过程，而下方子图显示了该过程对应的滚动赫斯特指数：\n\n![](img/fig-6-6.png)\n\n我们观察到，符合理论预期，赫斯特指数在其整个轨迹中始终保持在\
  \ `0.5` 阈值之下。这一阈值标志着均值回归过程的属性，该过程围绕一个中心值规律性地振荡。因此，赫斯特指数有效地识别出该时间序列的状态为均值回归和反持久。在交易场景中，这一洞察使我们能够实施针对这一特定动态量身定制的策略。\n\
  \n*   **`H` 约 `0.5`** 暗示纯随机游走。这意味着不可预测的噪声。\n\n在下图中，上方子图展示了一个纯随机噪声过程，而下方子图显示了该过程对应的滚动赫斯特指数：\n\
  \n![](img/fig-6-7.png)\n\n我们所见符合理论预期。在随机游走中，赫斯特指数通常徘徊在中心值（`0.5`）附近，正如下面的赫斯特指数直方图所示：\n\
  \n![](img/fig-6-8.png)\n\n[¹²]: chap06.xhtml#footnote-109\n[¹³]: chap06.xhtml#footnote-108\n\
  [¹⁴]: chap06.xhtml#footnote-107\n\n\n\n\n然而，我们也注意到存在明显的瞬态阶段，在这些阶段中，该过程间歇性地表现出均值回归（`H\
  \ < 0.5`）和持续趋势（`H > 0.5`）的特征。因此，在这种情况下，如果我们仅观察赫斯特指数，结论不像前一种情况那样清晰明了。随机游走可以被视为均值回归（前一种情况）和持续性（下文讨论的情况）之间的中间过程。\n\
  \n*   `H > 0.5` 表示趋势行为。\n\n要将一个序列归类为持续性——表明记忆效应持续存在且增量呈正相关——指数值应在较长时期内保持在 0.5 以上。因此，我们可以迅速得出结论：赫斯特指数准确地识别出了该序列的持续特性。\n\
  \n这可以在下图中看到：\n\n![](img/fig-6-9.png)\n\n该图说明在较长时期内，赫斯特指数显著超过 0.5 阈值，表明存在强烈的趋势行为。这些较高的赫斯特值表明价格走势中存在持续的、定向的动量，意味着向上或向下的趋势更有可能在这些区间内延续。在趋势跟踪交易策略中，可以利用这种持续性。赫斯特指数既可应用于价格序列，也可应用于收益率序列。解读可能略有不同：\n\
  \n*   **价格序列**：将赫斯特指数应用于价格序列有助于理解长期趋势以及该序列偏离随机游走的程度\n*   **收益率序列**：当应用于收益率序列时，赫斯特指数可提供关于收益率自相关性的洞察，以及它们是否随时间表现出均值回归或趋势行为\n\
  \n要在历史序列上通过滑动窗口基础[¹⁵]估算赫斯特指数，我们可以创建一个循环，遍历时间序列数据，在每次迭代中对数据子集计算赫斯特指数：\n\n```python\n\
  from hurst import compute_Hc\n\ndef rolling_hurst(series):\n    try:\n        H,\
  \ c, data_reg = compute_Hc(series.dropna(), kind='price', simplified=True)\n   \
  \     return H\n    except FloatingPointError:\n        return np.nan  # 或返回一个表示失败的特定值\n\
  \n#### 然后作为滚动应用：\ndf['hurst'] = df['Close'].rolling(window=window_size).apply(rolling_hurst,\
  \ raw=False)\n```\n\n这将给出一个随时间变化的赫斯特指数估计值，这对于分析市场行为随时间的变化特别有洞察力。\n\n### 熵简介\n\n\
  熵（`H`）是数据集中随机性或不确定性的度量[¹⁶]。\n\n为了更好地理解熵，我们创建了一个模拟时间序列。\n\n下图显示了该时间序列数据四个不同片段的熵（红色虚线，右侧坐标轴）可视化图（蓝线，左侧坐标轴）：\n\
  \n![](img/fig-6-10-entropy.png)\n\n在常数段（2018-01 至 2018-03），熵非常低，表明不存在不确定性或变异性。随着序列进入线性趋势，熵略有增加，表明复杂性稍高但模式仍可预测。\n\
  \n线性趋势后的平坦段熵值下降，因缺乏变异性而回落至低值。\n\n随机段的熵并不像人们预期的完全随机过程那样高，这表明随机性受到约束。\n\n不同数据状态下熵的这种行为可被利用来理解潜在模式，并为机器学习中的预测建模提供信息。\n\
  \n估算熵[¹⁷]的方法与赫斯特指数相同。我们通过历史序列使用滑动窗口基础。然后，我们可以创建一个循环[¹⁸]来遍历时间序列数据。以下代码块生成了前图中显示的熵值。它使用\
  \ `PyInform` 库计算熵，该库提供信息论计算工具。具体而言，它将香农熵函数应用于数据集中 `'Close'` 列大小为 30 的滚动窗口，创建一个新特征\
  \ `\"Entropy\"`，量化每个窗口内的不确定性或变异性：\n\n```python\nfrom pyinform.dist import Dist\n\
  from pyinform.shannon import entropy\n\ndef compute_entropy(df1: pd.DataFrame):\n\
  \    d = Dist(500)\n    for x in df1:\n        d.tick(int(x))\n    return entropy(d)\
  \  # , b=10))\n\nwindow_size = 30\n\n#### 计算合并数据集的熵\ndf_combined['Entropy'] = df_combined['Close'].rolling(window=window_size).apply(compute_entropy,\
  \ raw=False)\n```\n\n接下来，我们将熵值作为特征纳入机器学习算法。\n\n##### 将熵用作特征\n\n在机器学习中使用熵作为特征，涉及量化数据集中的不确定性或无序度，并利用该信息提高模型的预测能力。\n\
  \n以下是使用熵作为特征的一般方法：\n\n*   **计算熵**：计算数据不同片段的熵。例如，在时间序列数据中，你可能会计算固定间隔内价格变化的熵。前述代码即为此方式提供了基础。\n\
  *   **特征创建**：将计算出的熵值视为特征。这些特征可提供关于数据不同部分可预测性或随机性水平的洞察。\n*   **纳入机器学习模型**：将这些基于熵的特征与其他特征一起纳入你的机器学习模型。\n\
  *   **子群分析**：在包含各种子群的数据集中（如市场中的不同股票），比较这些群体间的熵。某子群中较高的熵可能表明更大的不可预测性。\n*   **时间分析**：对于时间依赖性数据，分析熵随时间的变化。熵的突然变化可能预示着重要事件或底层数据生成过程的转变。\n\
  *   **与其他统计特征结合**：熵可与方差、偏度或峰度等其他统计特征结合，以提供对数据特征的全面视图。关于这些统计度量的详细介绍，请参阅第 3 章《优化交易系统、指标与自动化报告》。\n\
  \n在考察了用于理解数据行为的统计和基于信息的特征概念后，我们现在转向探索源自监督和无监督机器学习技术的特征。\n\n## 基于机器学习的特征\n\n基于机器学习的特征是传统分析的有力补充。与统计度量（如赫斯特指数和熵）或技术指标（如\
  \ MACD 和 RSI）不同，基于机器学习的特征能够捕捉数据中更复杂、非线性的相互作用，而这些可能对传统方法不可见。\n\n使用这些特征的优势在于它们能够揭示数据的内在结构，提高模型可解释性，并有可能提升预测性能。它们支持开发更复杂、数据驱动的交易策略，能够适应复杂的市场动态。\n\
  \n在本节中，我们将介绍其中一些特征，从 PCA 开始，然后是 UMAP，最后是决策树叶节点特征。\n\n### 基于 PCA 的特征\n\n主成分分析（PCA）可将众多变量的信息浓缩到一组较小的成分中，这些成分最能解释数据的变异性，从而在保留关键信息的同时降低维度。\n\
  \n\n\n\nPCA 用于特征工程，旨在将高维数据集转换为低维数据集，同时尽可能保留更多信息（方差）。在下图中，整个数据集 19 经过 PCA 变换 20 后被压缩并投影到二维空间：\n\
  \n![](img/fig-6-11.png)\n\n在图中，显示的两个类别（黄点和紫点）分别对应正收益类和负收益类（上涨和下跌）。虽然存在某些区域主要由单一类别占据，显示出同质性，但这些类别仍然在很大程度上是交织混合的。\n\
  \n这一发现并不质疑 PCA 生成特征的实用性。明确地说，目标并非仅凭这种新的特征表示就完全解决分类问题。相反，我们的目标是通过引入原始数据集中不明显的信息，来辅助分类算法。\n\
  \n这些新的 PCA 特征随后可作为机器学习模型的输入，提供原始数据的一种降维且信息丰富的表示。在处理多重共线性 21 或试图因高维度而提升算法性能时，这特别有用。\n\
  \nPCA 寻找原始特征的简单（线性）组合，因此如果类别在原始特征空间中不是线性可分的，PCA 可能无法实现清晰的分离。复杂金融数据通常就是这种情况。在这种情况下，各类别的点不会聚集在分离的区域中，但\
  \ UMAP 等方法可能会有所帮助。\n\n### 基于 UMAP 的特征\n\n与 PCA 通过简单变换捕捉全局数据结构不同，统一流形逼近与投影（UMAP）擅长同时保留数据的局部和全局结构，这使其特别适用于检测数据的潜在结构，如下图所示：\n\
  \n![](img/fig-6-12.png)\n\n正如图中所示，UMAP 允许识别出某一类别占主导而另一类别缺失的明显区域。这种显著的分离符合 UMAP 明确展示类别间清晰区别的目标。因此，配备这种数据表示的分类算法将更容易完成分离任务。这种为便于算法处理而增强数据的做法，正是特征工程的核心作用。\n\
  \nUMAP 是一种复杂的技术，但我们可以依赖一个优雅简洁的 API22 来实现该算法：\n\n```python\nfrom umap import umap_\
  \ as UMAP\n\nclusterable_embedding = UMAP.UMAP(n_neighbors=30, min_dist=0.0, n_components=8).fit_transform(vct_bin)\n\
  \nplt.scatter(clusterable_embedding[:, 0], clusterable_embedding[:, 1], c=y_test,\
  \ s=20, cmap='viridis', alpha=0.4)\n\nplt.legend(['-1', '1'])\n```\n\n只需这些代码行即可执行计算并展示结果。要集成\
  \ UMAP 特征，我们只需遵循前面为熵特征和 PCA 特征概述的流程。\n\n让我们继续探索基于机器学习的特征创建。\n\n### 基于决策树叶节点的特征\n\
  \n决策树叶节点索引提供了一种独特的特征提取方式，通过利用模型做决策时所走的路径。这种方法捕捉决策树处理数据的方式，将其内部决策过程转化为有用的数值表示。\n\n\
  下图展示了一棵经过训练 23 用于分类 SPY 日收益率的决策树：\n\n![](img/fig-6-13.png)\n\n思路很简单：我们首先在数据集上训练一棵决策树。训练完成后，每个数据点通过从树根移动到叶节点、在每一步遵循决策规则来进行分类。关键洞见在于，数据点落入的特定叶节点包含关于其特征的宝贵信息。\n\
  \n要将其转化为特征，我们为每个叶节点分配一个唯一索引。然后为每个数据点创建一个新特征，指示其所属的叶节点。这种方法有效地将树结构转换为可作为其他机器学习模型输入的格式，增加了超越传统特征的新预测信息层。\n\
  \nSklearn API 为实现这种特征工程方法提供了实用途径。训练好树后，我们只需使用 `apply` 方法，它方便地提供了我们想要的输出：从根节点通向决策叶节点的叶索引序列：\n\
  \n```python\n#### Get the leaf indices for each sample\nleaf_indices_train = clf.apply(X_train)\n\
  leaf_indices_test = clf.apply(X_test)\n\n#### merge leaf indexes with other features\n\
  X_train = pd.DataFrame(np.hstack([X_train, pd.DataFrame(leaf_indices_train)]))\n\
  X_test = pd.DataFrame(np.hstack([X_test, pd.DataFrame(leaf_indices_test)]))\n\n\
  #### Train a new model on the combined dataset\nclf = RandomForestClassifier(max_depth=15)\n\
  clf.fit(X_train, y_train)\n```\n\n我们现已完成对特征工程的深入探索，展示了突破特征分析与处理边界的前沿方法（UMAP、分数阶差分等）。在构建并计算出数千个新特征后，下一步是减少特征数量。实现这一减少的各种技术是本章最后一节的主题。\n\
  \n##### 特征选择\n\n特征选择是识别并选择对模型最相关特征的过程。这有助于将输入变量减少到对预测最有用的那些，从而提高模型效率。\n\n减少特征数量的重要性怎么强调都不为过。在高维数据集中，特征数量远超观测样本数量时，模型可能遭受过拟合和维度灾难。该术语描述了这样一种现象：特征空间变得如此之大，以至于可用数据变得稀疏。这种稀疏性使得模型难以有效学习。结果，模型过度贴合训练数据，在未见数据上表现不佳。\n\
  \n相反，特征过少可能导致欠拟合，即模型无法有效学习数据中的潜在模式。\n\n找到正确的平衡是关键。一个常用的启发式规则是特征数量应显著少于观测样本数量。\n\n\
  虽然没有铁律，但观测样本数量是特征数量的 5-10 倍这一准则可以作为起点。\n\n现在，让我们看看如何减少特征数量。\n\n### 互信息作为特征选择方法\n\
  \n互信息统计量可以捕捉变量间任何类型的统计依赖关系。当且仅当两个随机变量相互独立时，它等于零；值越高意味着依赖性越强。\n\n通过计算每个特征与目标变量之间的互信息统计量\
  \ 24，可以判断该特征是否包含足够的信息来预测结果。如果包含，则保留该特征；否则丢弃。\n\n使用以下代码，针对该分类问题，我们根据互信息准则选择最优的 pct%（5%）特征：\n\
  \n```python\nfrom sklearn.feature_selection import mutual_info_classif, RFE, SelectKBest\n\
  \npct = 5\n\n#### Assuming you want to select pct% best features\nk_best = int(pct\
  \ / 100 * len(X_train.columns))\n\n#### Initialize SelectKBest with mutual information\n\
  sel2 = SelectKBest(mutual_info_classif, k=k_best)\nsel2.fit(X_train, y_train)\n\n\
  #### Get the boolean mask of selected features\n```\n\n\n\n`selected_features_mask\
  \ = sel2.get_support()`\n\n#### 获取所选特征的列标签\n\n`X_train.columns[selected_features_mask]`\n\
  \n作为回报，我们获得了所选特征的列表：\n\n`['Adj Close_ret', 'Low_ret' , 'Relative_Change_Open_Close_ret'\
  \ , 'BBB_20_2.0_ret', 'High_1', … ]`\n\n### 递归特征消除\n\n给定一个分配重要性 25（权重）给特征的外部估计器（`clf`），递归特征消除（RFE）的目标是通过递归地考虑越来越小的特征集来选择特征。首先，估计器在初始特征集上进行训练，并获得每个特征的重要性。然后，从当前特征集中剔除最不重要的特征。该过程在剪枝后的特征集上递归重复，直到达到所需的选择特征数量。\n\
  \n```\nfrom sklearn.feature_selection import RFE\n\nsel3 = RFE(clf, n_features_to_select\
  \ = k_best , step = 0.3)\n\nsel3.fit(X_train, y_train)\n\nsel3.get_feature_names_out()[:100]\n\
  ```\n\n以下是所选特征的一小部分摘录：\n\n```\n['Gap_Previous_Close', 'CCI', 'GOOG_Adj Close_ret',\
  \ 'AMZN_Open_ret',\n'TSLA_Low_ret', 'NVDA_Low_ret', 'IBM_Low_ret', 'IBM_Adj Close_ret',\n\
  'Close_diff_frac_0.2_ret', 'Price_Momentum_ret', 'BBB_20_2.0_ret',\n'MSFT_Volume_5',\
  \ 'IBM_Open_4', 'IBM_Low_3', 'IBM_Volume_3',\n'IBM_Volume_5', 'Price_Momentum_3',\
  \ 'Intraday_Price_Range_1',\n'Intraday_Price_Range_4', 'Intraday_Price_Range_5','Closing_Position_1',\
  \ 'Gap_Previous_Close_5','Relative_Change_Open_Close_3' 'Normalized_Volume_Weighted_Close_1',\
  \ 'MACD_Histogram_3',\n'Open_ret_5', 'Adj Close_ret_3', …]\n```\n\n`RFE` 迭代地移除最不重要的特征，直到只保留最相关的特征。上述代码演示了如何使用分类器（`clf`）对特征重要性进行排序并选择前\
  \ `k_best` 个特征来应用 `RFE`。\n\n拟合模型后，`get_feature_names_out()` 函数检索对预测贡献最大的最有信息量的特征。以下是所选特征的示例，其中包括技术指标（例如\
  \ `CCI`、`MACD_Histogram`）、基于价格的变换（例如 `Gap_Previous_Close`、`Intraday_Price_Range`）和分数阶差分（`Close_diff_frac_0.2_ret`）。这些所选特征通过减少噪声并专注于最有影响力的变量，增强了模型的预测能力。\n\
  \n在 `RFE` 识别出最相关的特征后，我们现在将探索使用降维技术（如 `PCA` 和 `UMAP`）进行特征选择。\n\n### 使用 PCA 和 UMAP\
  \ 进行特征选择\n\n之前，我们将 `PCA` 和 `UMAP` 作为特征工程的方法进行了讨论。这些技术常用于特征选择阶段。在这些场景中，原始特征被替换为从\
  \ `PCA` 或 `UMAP` 衍生出的新特征。\n\n与其简单地为模型输入选择合适的特征，重点转移到使用所有特征并利用 `PCA` 或 `UMAP` 技术将它们合并。这种方法创建了一组具有降低维度的新特征。对于实现部分，我们已经在前面专门介绍\
  \ `UMAP` 的章节中展示了代码。\n\n现在我们知道了如何选择重要特征，让我们看看当你想从这些方案中的每一个的优点中受益时该如何进行。\n\n### 使用集合运算符组合最佳特征\n\
  \n集合运算符是组合所有这些特征提议的合适答案。在本例中，我们结合了前几节中介绍的三种竞争性特征选择方法（`sel1`、`sel2` 和 `sel3`）的提议：\n\
  \n```\nsel1 = SelectPercentile(mutual_info_classif, percentile = pct , n_neighbors\
  \ = 10)\n\n#### 使用互信息初始化 SelectKBest\nsel2 = SelectKBest(mutual_info_classif, k\
  \ = k_best) \nsel3 = RFE(clf, n_features_to_select = k_best , step = 0.3)\n```\n\
  \n集合方法将所选特征封装在集合中：\n\n```\nset1 = set(sel1.get_feature_names_out())\nset2 = set(sel2.get_feature_names_out())\n\
  set3 = set(sel3.get_feature_names_out())\n```\n\n使用集合运算符 `union`26 和 `intersection`27\
  \ 来组合集合：\n\n```\nset1or2 = set1.intersection(set2)\nprint(len(set1or2))\nset1or2or3\
  \ = set1or2.union(set3)\n```\n\n在竞争性特征选择方法的特征集的 `union`（并集）和 `intersection`（交集）之间进行选择取决于上下文：\n\
  \n- 对于观测值数量有限（与特征数量相比）的数据集，`intersection` 是避免过拟合的更安全选择。\n- 如果特征选择方法从根本上不同且互补（例如，一种基于统计，如\
  \ `mutual_info_classif`，另一种基于模型，如 `RFE`），它们的 `union` 可能会产生一个更全面的特征集。当方法互补且有足够数据支持更大的特征集时，`union`\
  \ 是有益的。否则，`union` 可能导致更大的特征集，这可能会增加模型的复杂性并可能导致过拟合。\n\n## 结论\n\n在本章结束时，我们了解了如何掌握优化机器学习模型性能所必需的特征工程和特征选择技术。\n\
  \n这不仅适用于预测性能，同样重要的是适用于机器学习模型的后期生产、部署和维护方面。这些方面统称为机器学习运营（`ML-Ops`）。我们还应该提到，特征选择在生产环境中具有实际好处。特征较少的模型通常运行更快、更易于解释且更具成本效益，特别是在处理大型数据集时。\n\
  \n现在我们已经拥有了坚实的机器学习基础，准备好探索高级算法了。\n\n在下一章中，我们将专注于复杂的机器学习方法，范围从集成技术到持续在线学习方法。\n\n\
