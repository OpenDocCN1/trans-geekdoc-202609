  \n具体操作如下：\n\n```\nopt = BayesSearchCV(\n    xgb.XGBClassifier(booster='gbtree',\
  \ device='cuda:0'),\n    space,\n    n_iter=10,\n    cv=3,\n    scoring=\"accuracy\"\
