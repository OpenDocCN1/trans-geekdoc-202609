  \n```\nif stock not in top_decile.loc[date].dropna().index and stock not in bottom_decile.loc[date].dropna().index:\n\
  ```\n\n我们应用该系统，并采用以下管理参数：\n\n##### 初始投资组合价值\n\n`portfolio_value = 10000`\n\n`total_trades\
  \ = 0`\n\n`total_profit_loss = 0`\n\n`lst_pnl = []`\n\n`stp_loss = -2/100 * portfolio_value`\n\
  \n##### 定义每股交易成本，每股 x 美元（$0.005：IB 券商）\n\n`transaction_cost = 0.01`\n\n在 Interactive\
  \ Brokers 交易平台 6 中，专业账户交易美交所上市股票的佣金为每股 $0.005。我们将该金额加倍至 $0.01，以计入额外摩擦成本（滑点等）。\n\n\
