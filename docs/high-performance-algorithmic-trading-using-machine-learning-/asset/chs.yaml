  \n# 第 5 章\n\n## 面向交易系统的监督学习\n\n## 简介\n\n\n\n\n\n## 交易中的监督学习\n\n本章涵盖监督机器学习（ML）的原理，重点关注交易应用。我们将探讨算法如何分析历史数据以识别模式并预测市场走势，将其结构分解为数据输入、函数表示和优化等关键组件。本章还回顾了基本的分类和回归算法，以及关键的评估指标。与其他章节不同，本章的重点在于为交易中的监督学习建立坚实的概念框架，而非具体的实现示例。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 监督学习的作用\n- 用于预测性交易的监督学习\n- 监督学习的优势\n- 监督学习全景\n-\
  \ 监督学习的核心原理\n- 主要监督学习算法\n- 交易应用的选择标准\n\n## 目标\n\n本章介绍监督学习及其在创建先进算法交易策略中的作用。您将学习如何利用历史数据和标记结果来构建预测模型，以预测市场行为。我们将涵盖关键分类算法，如逻辑回归和支持向量机（SVM），以及基本回归方法，如决策树回归器、梯度提升和\
  \ K 近邻，重点关注它们在交易中的实际应用。我们还将探讨如何根据您的数据、预测目标和评估指标（如准确率和精确率）选择合适的算法，从而使您能够有效地完善和优化您的交易系统。\n\
  \n## 监督学习在交易中的作用\n\n本节从技术角度审视交易，重点介绍监督学习如何利用历史数据和标记结果来预测未来市场趋势，从而在构建预测性交易系统中发挥关键作用。\n\
  \n在继续之前，让我们简要回顾一下第一章的要点。\n\n> **注意：** 本节仅侧重于回顾这些关键思想；新信息将在下一节介绍。\n\n### 机器学习在交易中的崛起\n\
  \nML 作为人工智能的一个关键分支，使计算机系统能够从数据中学习并自我改进，而无需显式编程。这种方法由 Arthur Samuel 于 1959 年提出，其独特之处在于它直接从数据中推导规则，而不是依赖预定义的指令。与规则由人工设定的传统编程不同，ML\
  \ 算法分析数据以发现指导决策的模式和相关性。在交易中，ML 通过处理大量金融数据来预测市场趋势，展现了其价值。\n\n## 用于预测性交易基础的监督学习\n\n\
  在算法交易中，作为 ML 一个分支的监督学习，在策略开发中迈出了重要一步。它使用带标签的数据，其中训练集同时包含输入特征及其对应的输出。这种方法类似于有指导的学习，模型从它应该预测的具体示例中学习。\n\
  \n在交易背景下，这些带标签的数据集通常由各种市场指标作为输入（如基本面数据[¹]、历史价格、成交量和技术指标）和特定结果作为输出（如未来价格走势或趋势分类）组成，如下图所示：\n\
  \n![监督学习工作流](img/fig-5-1.png)\n\n该草图展示了监督学习在金融交易背景下的工作流，其中模型使用各类市场数据、K 线图、成交量直方图和基本面数据作为输入进行训练。在训练阶段，算法学习将这些输入与已知输出（具体为历史价格走势和趋势分类）相关联。\n\
  \n一旦训练完成，模型进入推理阶段，将其学到的规则应用于新数据，以预测未来的价格走势和市场趋势，从而为交易决策提供依据。\n\n在利用传统市场数据的监督学习基础之上，该领域正扩展到更复杂的领域。图学习、基于图像的\
  \ ML 以及文本和音频数据分析等技术，正日益塑造和变革交易策略。\n\n例如，图学习用于分析市场网络，其中股票为节点，相关性为边，从而提供对市场动态的洞察。基于图像的\
  \ ML，如深度卷积神经网络，被应用于解读 K 线图，识别预测价格走势的模式。自然语言处理技术分析新闻、社交媒体讨论和财报电话会议记录以进行情绪分析，影响交易决策。同样，分析音频数据（如财报电话会议中的语气波动）可提供关于公司业绩的微妙线索，辅助预测分析。这些创新方法利用多样化的数据形式，远远超越了传统的数值数据，为交易者提供了更全面的市场视角和决策优势。\n\
  \n## 监督学习在交易中的优势\n\nML 的精髓在于其无与伦比的能力，能直接从数据中自主推导决策规则，这与通常依赖预先建立规则的传统统计技术形成鲜明对比。ML\
  \ 模型能识别数据中的复杂模式和关系，从而对新的、未见过的信息做出可靠预测。这些模型不仅仅是识别模式，而是经历彻底的训练过程，从广泛的市场数据和结果中学习以理解市场行为。这种能力使它们非常适合开发利用历史数据预测未来市场趋势的交易系统，其准确度高于传统方法。此外，ML\
  \ 提取结构化洞察的能力（如从决策树分析中获得的洞察）提供了清晰、可解释的模型——这是理解复杂市场行为的一大优势。\n\n下图是 ML 算法（决策树）提取的结构化知识的一个具体示例[²]：\n\
  \n![决策树示例](img/fig-5-2.png)\n\n凭借从复杂数据集中自主提炼结构化知识的固有能力，ML 超越了传统统计方法，而这通常是传统技术难以企及的。与往往依赖静态业务规则的传统方法不同（由于市场条件不断演变，这些规则可能迅速过时），ML\
  \ 以其动态适应性脱颖而出。它根据新数据持续更新和优化其预测规则，确保洞察和策略保持相关性和有效性。此外，ML 擅长处理高维数据空间并发掘非线性关系，这些在金融市场中常见，但传统模型往往难以捕捉。\n\
  \n在探讨了监督学习在交易中的优势后，我们现在将重点转移到其背后的机制上。下一节将探讨核心原理，如带标签数据、训练算法和预测生成，以了解这些模型如何有效运作。\n\
  \n## 监督学习全景\n\n[¹]: [chap05.xhtml#footnote-126]\n[²]: [chap05.xhtml#footnote-125]\n\
  \n\n\n\n\n### 监督学习是机器学习的关键部分，在金融领域的重要性日益凸显\n\n监督学习是机器学习的关键部分，在金融领域的重要性日益凸显。通过从带标签的数据集中学习，算法能够基于历史数据预测结果，这使其成为高级交易策略的关键所在。与无监督学习（在没有标签的情况下寻找隐藏模式）或强化学习（通过与环境交互来学习）不同，监督学习依赖于已知结果，这使其非常适合交易中的预测性分析。\n\
  \n## 监督学习的核心原则\n\n在交易中，监督学习可用于利用历史数据预测市场趋势、价格走势和投资机会。其结构化的输入-输出方法帮助交易员和分析师构建能够处理大量数据并做出准确预测的模型。这改善了决策制定和策略开发。\n\
  \n### 标签数据在监督学习中的作用\n\n深入理解监督学习会揭示标签数据的根本重要性。\n\n在交易的监督学习中，标签数据是构建预测模型的基础。这些数据由输入组成，包括股票价格、交易量和其他相关市场信号，并与其对应的输出配对。这些输出就是指导学习过程的标签，因此称为监督学习。在回归任务中，目标是预测连续结果，标签可能是未来价格。在分类任务中，目标是对数据进行分类，标签可以是趋势指标，如买入、卖出或持有。\n\
  \n标签教会算法如何解读数据，从而如何做出准确预测。例如，分类模型可能从标签数据中学习识别市场趋势是看涨还是看跌。相反，在回归设定中，模型可以利用标签数据预测资产的具体未来价格。\n\
  \n在交易的监督学习中，算法本质上是被训练来回答两个关键问题。对于回归问题，问题是“多少？”，寻求精确的数值预测，如未来股价。对于分类任务，问题是“是什么？”，确定数据点属于哪个类别，如交易信号指示买入、卖出还是持有。\n\
  \n让我们花点时间分析这两种预测类型的几个例子。首先，我们将研究一些直接应用，随后是超出这些范围的例子。\n\n对于回归，一个典型例子是训练模型预测股票的未来价格。请参见下图说明：\n\
  \n![](img/fig-5-3.png)\n\n让我们讨论超越简单价格预测的内容。\n\n一个更复杂的回归问题可能涉及基于经济指标估算市场崩盘的概率，这是一项以概率术语量化风险的任务。\n\
  \n另一个高级例子是估算盈利公告对板块指数的影响。重点在于预测季度盈利公告对特定板块指数的影响。通过分析预公告财务指标、市场情绪和公司历史表现数据的组合，模型旨在估算盈利发布后指数的百分比变化。这种方法提供了对企业绩效指标如何影响更广泛市场板块的理解，有助于制定板块特定的投资策略。\n\
  \n在分类背景下，一个基本实例是判断股票将上涨还是下跌，基于财务特征值将走势分为二元类别。下图说明了这一点，并引入了额外的“持有”类别：\n\n![](img/fig-5-4.png)\n\
  \n一个超出这种二元范围的独特例子可能涉及对市场机制类型进行分类，范围从看涨或看跌到更具体的状态，如波动上升趋势或静默整理，基于价格模式、交易量和宏观经济信号的组合。\n\
  \n为了结束这一系列应用示例，让我们看看罕见事件的预测，如并购。以下是监督学习算法如何提供帮助。预测企业并购是机器学习的一个应用，融合了分类和回归的要素。\n\n\
  在分类背景下，模型可以评估特定公司间发生并购的可能性，基于财务状况、市场条件和行业历史并购模式，将潜在并购分类为可能或不可能。\n\n或者，作为回归任务，模型可能预测潜在并购的财务影响，估算并购后股价变化或市场份额转移等指标。此类预测需要分析复杂数据集，包括财务报表、市场趋势，甚至来自新闻和企业通讯的文本数据，以捕捉并购活动的多面性。\n\
  \n正如这些例子所示，监督学习在金融领域提供了强大的优势。模型可以学习理解复杂的市场动态，为交易员提供细致的洞察以做出更好的决策。通过使用标签数据，专业人士可以构建在准确性和复杂性上均优于传统交易策略的模型。\n\
  \n让我们看看超越监督学习的内容。\n\n虽然监督学习严重依赖带标签的数据集，但重要的是要承认半监督学习的作用。这种方法利用带标签和不带标签的数据，在标签稀缺或获取成本高昂时特别有价值。我们不会详细讨论这种方法，但了解这种可能性很重要。半监督学习可以利用金融市场中海量的无标签数据，将它们与带标签的实例一起使用，以增强学习过程并提高模型性能。\n\
  \n在探讨了标签数据的作用和监督学习在金融背景下的多样化方法论后，我们现在将继续了解学习过程。\n\n### 学习过程\n\n学习过程的主要目标是最小化机器学习算法预测结果与准确代表市场现实的数据之间的差异。下图说明了这一点：\n\
  \n![](img/fig-5-5.png)\n\n为了实现这一目标，会使用优化过程来迭代优化机器学习算法的参数。这种迭代优化旨在最小化历史数据中预测值与观测值之间的差异。\n\
  \n因此，所有机器学习算法都包含一个误差函数[¹]，优化器会尽可能高效地探索该函数以找到其最小值。\n\n损失函数量化了预测值与实际值之间的差异。在训练期间，算法迭代处理每个数据点，预测输出并将其与实际观测值进行比较。误差函数计算这些值之间偏差的大小。\n\
  \n在更新阶段，算法调整其参数以减小该误差。此调整表示为 `new_param = old_param - update`。较大的误差会导致更显著的更新，逐渐引导参数向最小化误差函数的值靠拢。\n\
  \n我们不会深入探讨学习过程的数学方面，因为现代机器学习库（`Scikit-learn`、`Tensorflow`、`pyTorch` 等）完全抽象了底层的算法复杂性。学习过程的实际实现通常封装在单个命令中：`fit`。\n\
  \n总结本节，所有机器学习算法可分解为以下关键组件：\n\n- 数据：任何机器学习模型的基础。\n\n[¹]: 3\n\n\n\n\n• 优化器：驱动机器学习模型优化其参数的引擎，从而提升预测性能。\n\
  \n• 模型表征：定义了算法如何捕捉数据内部的关系。在交易领域，它决定了如何对市场趋势和行为进行建模。\n\n• 损失函数：衡量模型准确度的关键工具，量化预测误差的代价，并引导模型做出更准确的未来预测。\n\
  \n这些组件对于高性能机器学习算法至关重要。现在，让我们探讨主要的监督学习算法。\n\n## 主要监督学习算法\n\n我们的目标是提供一份实用的概览，涵盖从入门到进阶的核心机器学习算法。我们将提炼核心概念并突出每种算法的定义特征，而非提供详尽的目录。这将使你直观地理解每种算法的工作原理及其在机器学习领域中的定位。我们将从分类算法开始，然后转到回归算法。\n\
  \n#### 分类算法\n\n分类器的目的是定位一条边界以分离两个类别。我们将通过在三个复杂度和难度各异的数据集上测试这些算法，来展示分类算法的范围。正如你在下图所见，具有明显非线性特征的“两个半月”数据集，极有可能难倒更基础的分类器。对于代表交织圆环的数据集，也有类似的观察结果。然而，线性可分数据集的数据可能更容易分离，即使是对于线性分类算法也是如此：\n\
  \n![](img/fig-5-6.png)\n\n目的并非寻找算法的最佳参数设置，而只是展示它们在所提议数据集上的表现，以得出总体结论。\n\n#### 逻辑回归\n\
  \n由于其线性本质，逻辑回归用于相对简单的二元分类问题。当变量间的关系预期为线性或接近线性时，它是一个有效的选择。例如，逻辑回归可用于基于一组技术指标，预测股票收盘价将高于还是低于某个特定阈值。\n\
  \n以下是其部分优势与劣势：\n\n• 优势：简单、可解释，且对中小型数据集（最多约 10 万行）高效\n\n• 局限性：仅限于线性关系，且容易在小数据集上过拟合。对于复杂关系和高维数据效果较差\n\
  \n• 重要参数及范围 4：正则化强度（`C`）通常在 `[0.01, 100]` 范围内\n\n下图展示了将逻辑回归算法应用于简介中提到的三个数据集的结果。你可以从下图中看到，逻辑回归算法是一种线性分离器。事实上，它在两类不同数据（黄点与黑点）之间绘制了一条线性边界，如下所示：\n\
  \n![](img/fig-5-7.png)\n\n#### 决策树\n\n决策树可用于对市场行为建模并进行预测。该算法自动从数据中学习一系列 if-then-else\
  \ 规则，形成树状结构。\n\n让我们看看以下优势与劣势：\n\n• 优势：可解释，能处理数值型和分类型数据。对异常值鲁棒，能处理非线性关系\n\n• 局限性：容易过拟合，对大型数据集（>10\
  \ 万行）效果较差\n\n• 重要参数及范围：树深度（`max_depth`）通常在 `[3, 15]` 范围内\n\n下图展示了描述表中强调的要点：\n\n\
  ![](img/fig-5-8.png)\n\n特别地，中间的图表显示算法试图将左下角的孤立点纳入其模型，表明有在预测中考虑该点的倾向。这种情况呈现出明显的过拟合风险。不确定与该区域关联的标签是否适用于未来的未见数据。相反，它看起来更像是由异常点引起的统计异常。\n\
  \n### 随机森林\n\n随机森林算法由多棵决策树组成，旨在缓解前文单棵决策树算法中观察到的效应。因此，它不仅使结果更加平滑，而且与最初的决策树方法相比，显著提升了预测性能。\n\
  \n让我们审视以下优缺点：\n\n• 优势：结合多棵决策树以减少过拟合并处理非线性关系。抗过拟合能力强，适合中型数据集（最多约 100 万行）。\n\n• 局限性：可解释性较差，且对大型数据集可能较慢（计算成本高）。\n\
  \n• 重要参数及范围：树的数量（`n_estimators`）在 `[10, 200]` 范围内，`max_depth` 通常在 `[5, 30]` 范围内。\n\
  \n随机森林算法由多棵决策树组成，旨在缓解前文单棵决策树算法中观察到的效应。因此，它不仅使结果更加平滑，而且与最初的决策树方法相比，显著提升了预测性能。下图展示了描述表中强调的要点：\n\
  \n![](img/fig-5-9.png)\n\n#### 支持向量机\n\n支持向量机是分类的宝贵工具，特别是在处理数据中复杂的非线性关系时。以下是概览：\n\
  \n• 优势：在高维空间中有效，用途广泛\n\n• 局限性：不适合超过 10 万行的数据集，需要调参\n\n• 重要参数及范围：正则化参数（`C`）通常在 `[0.1,\
  \ 100]` 范围内\n\n支持向量机算法擅长建模高度非线性的决策边界，这一能力在下图中得到了清晰展示：\n\n![](img/fig-5-10.png)\n\
  \n这使其成为处理复杂非线性数据的极其高效的工具，特别是在涉及大维度空间（大量特征或列）的场景中。\n\n#### k-近邻算法\n\n在交易背景下，k-近邻算法（k-NN）可用于识别相似的市场状况，并基于历史数据预测未来价格走势。该算法通过考虑\
  \ `k` 个最相似的历史样本来对新数据点进行分类。\n\n考虑其优势与局限性：\n\n• 优势：简单且对小型数据集（最多 5 万行）有效\n\n• 局限性：计算密集型，不适合大型数据集或高维数据。由于其根本依赖数据点间的距离进行分类，其有效性在高维空间中会降低。在这类复杂的多维环境中，传统的距离概念变得不再敏锐，导致维度灾难\
  \ 5，使得 kNN 难以准确分类实例。\n\n• 重要参数及范围：邻居数量（`k`）通常在 `[3, 20]` 范围内\n\nkNN 算法在简单性与效率之间提供了极佳的平衡。这些图表展示了\
  \ kNN 如何有效地为分类创建非线性决策边界：\n\n![](img/fig-5-11.png)\n\n### 朴素贝叶斯\n\n朴素贝叶斯分类器利用贝叶斯定理预测数据点属于特定类别的概率。它们假设所有输入特征相互独立，这简化了计算，但可能并不总是反映现实。它是开始学习路径的良好算法。\n\
  \n以下是其关键优势与局限性：\n\n• 优势：对高维数据集快速且高效\n\n• 局限性：假设特征独立\n\n• 适合文本数据和较小数据集（最多 10 万行）\n\
  \n下图提供了描述表中概述要点的可视化呈现：\n\n![](img/fig-5-12.png)\n\n\n\n对于最终的分类算法（`Gradient Boosting`、`AdaBoost`、`XG\
  \ Boost` 和 `lightGBM`），我们将探讨它们为何位列机器学习中最有效的算法之中，这源于 Bagging 和 Boosting 等集成方法。这些技术将在第\
  \ 7 章《用于交易的高级机器学习模型》中深入探讨，其本质是通过整合多个模型来提升性能。这种组合利用了各组件的优势，从而产生更稳健、更准确的预测能力。\n\n\
  ### 梯度提升机\n\n想象一个团队协作解决一个复杂问题。`梯度提升机 (GBMs)` 的工作原理类似，逐步构建一组决策树集成。基于 Boosting 原理，每棵树都从其前任的错误中学习，逐步提高整体预测准确性，就像团队通过协作不断优化策略一样。以下是其优缺点：\n\
  \n*   **优点**：高度灵活且准确率高。能处理复杂关系和不同数据类型\n*   **局限性**：可能过拟合，对大数据集（>50 万行）计算密集\n*  \
  \ **重要参数及范围**：`learning_rate` 常在 `[0.01, 0.3]` 范围内，树的数量在 `[100, 500]` 范围内\n\n如下图所示，它擅长建模非线性决策边界：\n\
  \n![](img/fig-5-13.png)\n\n### AdaBoost（自适应提升）\n\n该算法按顺序构建一组分类器集成，并适应之前的错误。一种提升技术通过调整弱分类器的权重来形成一个强分类器。\n\
  \n我们现在来考察其优缺点：\n\n*   **优点**：提高简单分类器的准确性，可处理中等规模数据集（最多 50 万行）\n*   **局限性**：计算成本可能较高且容易过拟合。对噪声数据和异常值敏感\n\
  *   **重要参数及范围**：估计器数量（`n_estimators`）常在 `[30, 100]` 范围内\n\n下图展示了 `AdaBoost` 如何利用顺序弱学习器创建复杂决策边界：\n\
  \n![](img/fig-5-14.png)\n\n### XGBoost\n\n`Extreme Gradient Boosting (XGBoost)`\
  \ 建立在 `GBM` 原理之上，提供了高度优化且高效的实现。它被广泛认为是最强大的机器学习算法之一。`XGBoost` 是 `GBM` 的一种先进实现，获得了极大的普及。`XGBoost`\
  \ 将 `GBMs` 的概念推向了新高度，引入了多项增强以提升性能和效率。\n\n请考虑以下关键特性：\n\n*   **优点**：高性能、高效率和灵活性。可处理缺失值\n\
  *   **局限性**：若调优不当易过拟合，适用于约 100 万行以内的数据集。计算成本高\n*   **重要参数及范围**：`max_depth` 在 `[3,\
  \ 10]` 范围内，`learning_rate` 在 `[0.01, 0.3]` 范围内\n\n作为 `GBM` 的一种强大实现，`XGBoost` 能有效分类复杂数据集，如下图所示：\n\
  \n![](img/fig-5-15.png)\n\n### LightGBM\n\n由微软研究院开发，旨在追求速度与效率，`LightGBM` 是一个在处理大规模数据集方面表现出色的梯度提升框架。\n\
  \n以下是其关键特性：\n\n*   **优点**：快速、高效，非常适合处理大规模数据集（高达数百万行）\n*   **局限性**：在小数据集上容易过拟合，需要谨慎调优\n\
  *   **重要参数及范围**：叶子数常在 `[20, 40]` 范围内，`learning_rate` 在 `[0.01, 0.1]` 范围内\n\n下图直观展示了\
  \ `LightGBM` 如何跨不同数据集创建分类决策边界：\n\n![](img/fig-5-16.png)\n\n这些图表展示了 `LightGBM` 对数据中线性和非线性关系的建模能力。在前两张图中，我们看到它成功分离了两个线性不可分的类别。最右侧的图展示了\
  \ `LightGBM` 创建更简单的线性边界。\n\n重要的是要谨慎解读上述所有发现，因为此处获得的见解可能不直接适用于真实世界的数据集。\n\n特别是在高维空间中，数据往往以线性方式变得更易分离，`Naive\
  \ Bayes` 和线性 `SVMs` 等分类器的简单特性可能比更复杂的分类器产生更有效的泛化能力。\n\n总之，`随机森林`、`GBMs`、`AdaBoost`、`XGBoost`\
  \ 和 `LightGBM` 非常适合处理金融数据中的复杂关系和非线性模式。然而，它们可能需要仔细的参数调优且计算成本较高。\n\n虽然 `逻辑回归`、`决策树`、`kNNs`\
  \ 和 `Naive Bayes` 等简单模型不一定总能达到最高的信噪比（以夏普比率衡量），但它们提供了简单性、可解释性和对异常值的鲁棒性，使其适用于特定场景。\n\
  \n在探索了预测分类标签的算法后，我们转向用于预测数值的回归算法。\n\n### 回归算法\n\n`回归算法` 用于根据一个或多个输入特征预测连续数值。在本节中，我们将探讨多种回归算法，从简单的线性模型开始，逐步过渡到更复杂的非线性模型。理解线性与非线性模型的区别至关重要：线性模型假设输入特征与目标变量之间存在直线关系，而非线性模型能捕捉更复杂的曲线关系。\n\
  \n为了阐释这些概念及不同回归算法的能力，我们将使用一个示例。这将使我们能直观观察每种算法如何尝试建模数据中的潜在模式。我们的主要目标不是在此特定数据集上达到最优预测准确性，而是获得对每种算法行为、优势和局限性的直观理解。\n\
  \n通过观察这些模型在受控示例上的表现，我们可以获得关于其在真实世界回归问题中适用性的更广泛见解，如下所示：\n\n##### 线性回归\n\n作为统计建模中的基础算法，`线性回归`\
  \ 使用线性方程建模因变量与一个或多个自变量之间的关系。现在，让我们考虑以下优缺点：\n\n*   **优点**：简单、可解释，对中小型数据集高效\n*   **局限性**：假设线性关系，不适合复杂模式\n\
  *   **数据集限制**：对中小型数据集高效（最多约 10 万行）\n*   **导入语法**：`from sklearn.linear_model import\
  \ LinearRegression`\n\n作为第一步，我们将 `线性回归` 应用于带噪声的周期波数据集，牢记其在建模非线性模式方面的固有局限性，如下图所示：\n\
  \n![](img/fig-5-17-reg-1-lin.png)\n\n图中描绘了 `线性回归` 模型（红线）试图拟合带噪声的周期性数据集，结果得到一条无法捕捉潜在波浪模式的直线。这凸显了\
  \ `线性回归` 的根本局限性：它无法建模非线性关系，因为它只能生成数据的线性近似。\n\n##### 岭回归\n\n`岭回归` 是 `线性回归` 的一种变体，旨在防止过拟合，特别是在输入特征相关时。它通过在模型方程中添加惩罚项来实现，该惩罚项会抑制过于复杂的模型。\n\
  \n请考虑以下优缺点：\n\n*   **优点**：减少过拟合，适合相关特征\n*   **局限性**：仍假设线性关系，不适合非线性数据\n*   **关键参数**：`alpha`（正则化强度）\n\
  *   **合理值**：通常在 `[0.1, 100]` 范围内\n*   **数据集限制**：适合中小型数据集（最多约 10 万行）\n\n\n\n\n\n\
  #### 正则化线性回归与树模型\n\n##### Ridge 回归\n\n**导入语法**：`from sklearn.linear_model import\
  \ Ridge`\n\nRidge 回归的结果通常与 Lasso 回归非常相似，如 Lasso 回归图所示（图 5.18）。\n\n##### Lasso 回归\n\
  \n另一种正则化线性回归方法是 Lasso，全称 Least Absolute Shrinkage and Selection Operator（最小绝对收缩和选择算子）。其关键特性是使用惩罚项，这不仅能防止过拟合，还能通过将某些系数驱动为零来实现自动特征选择。\n\
  \n以下是其主要优势和局限性：\n\n- **优势**：内置特征选择，适合高可解释性模型\n- **局限性**：难以处理复杂的非线性数据\n- **关键参数**：`alpha`（正则化强度）\n\
  - **合理取值**：通常在 `[0.001, 1]` 范围内\n- **数据集限制**：适合中小型数据集（最多约 10 万行）\n- **导入语法**：`from\
  \ sklearn.linear_model import Lasso`\n\n尽管增加了惩罚项，应用于该非线性数据集的 Lasso 回归模型仍产生线性拟合，如下图所示：\n\
  \n![](img/fig-5-18-reg-2-lasso.png)\n\n##### ElasticNet\n\nElasticNet 回归结合了 Ridge\
  \ 和 Lasso 的惩罚方法，生成更灵活的线性模型，能处理更广泛的数据场景，特别是在处理相关特征时。\n\n以下是其优缺点：\n\n- **优势**：平衡特征选择和正则化，适合多重共线性数据\n\
  - **局限性**：需要调优参数，比简单线性模型更复杂\n- **关键参数**：`alpha` 和 `l1_ratio`\n- **合理取值**：`alpha`\
  \ 在 `[0.1, 100]`，`l1_ratio` 在 `[0.1, 0.9]`\n- **数据集限制**：适合中型数据集（最多约 50 万行）\n- **导入语法**：`from\
  \ sklearn.linear_model import ElasticNet`\n\n鉴于数据集的简单性，ElasticNet 图表与 Lasso 图表几乎相同，此处省略。\n\
  \n##### 决策树回归器\n\n与前面的线性方法不同，决策树回归器使用树状结构建模数据，能够捕捉非线性关系。\n\n以下是其关键特性总结：\n\n- **优势**：无数据分布假设，擅长处理非线性数据\n\
  - **局限性**：容易过拟合，对数据变化敏感\n- **关键参数**：`max_depth`\n- **合理取值**：常见范围 `[3, 10]`\n- **数据集限制**：适合中小型数据集（最多约\
  \ 10 万行）\n- **导入语法**：`from sklearn.tree import DecisionTreeRegressor`\n\n下图展示了决策树回归器特有的阶梯状预测曲线，这是由其分支结构和数据空间划分方式决定的：\n\
  \n![](img/fig-5-19-reg-3-decision-tree.png)\n\n##### 随机森林回归器\n\n随机森林回归器是一种高效的集成方法，通过组合多棵决策树来提高预测准确性并降低过拟合风险。\n\
  \n以下是其优缺点：\n\n- **优势**：鲁棒抗过拟合，在许多问题上表现良好\n- **局限性**：可解释性较差，大数据集上可能较慢\n- **关键参数**：`n_estimators`（树的数量）\n\
  - **合理取值**：通常在 `[10, 200]` 范围内\n- **数据集限制**：适合中大型数据集（最多 100 万行）\n- **导入语法**：`from\
  \ sklearn.ensemble import RandomForestRegressor`\n\n下图展示了随机森林回归器在噪声数据集上更平滑、更泛化、更精细的预测：\n\
  \n![](img/fig-5-20-reg-4-RF.png)\n\n##### 梯度提升回归器\n\n梯度提升回归器以高预测准确性著称，通过迭代构建树来实现。每棵新树专门训练以纠正前面树的错误，给分错实例更高权重。\n\
  \n以下是其优势与劣势：\n\n- **优势**：通常高性能，能处理各种数据类型\n- **局限性**：易过拟合，计算密集\n- **关键参数**：`n_estimators`\
  \ 和 `learning_rate`\n- **合理取值**：`n_estimators` 在 `[100, 500]`，`learning_rate` 在\
  \ `[0.01, 0.3]`\n- **数据集限制**：适合中型数据集（最多约 50 万行）\n- **导入语法**：`from sklearn.ensemble\
  \ import GradientBoostingRegressor`\n\n如图所示，梯度提升回归器与随机森林类似，能捕捉非线性关系，但比单棵决策树产生更平滑、阶梯感更弱的预测曲线：\n\
  \n![](img/fig-5-21-reg-5-gradient-boosting.png)\n\n### K 近邻回归器\n\n该算法基于 k 个最近邻居的平均值预测数据点值。预测时，它找出与新输入点最相似的\
  \ k 个训练数据点，并平均它们的目标值。以下是在交易背景下使用 k-NN 算法进行回归任务的优缺点：\n\n- **优势**：简单有效，适合小数据集\n- **局限性**：计算密集，不适合高维或大型数据集\n\
  - **关键参数**：`n_neighbors`\n- **合理取值**：通常在 `[3, 20]` 范围内\n- **数据集限制**：适合小数据集（最多约 5\
  \ 万行）\n- **导入语法**：`from sklearn.neighbors import KNeighborsRegressor`\n\n下图展示了 k-NN\
  \ 回归器基于 k 近邻平均值预测，在噪声周期数据集上产生阶梯状预测曲线：\n\n![](img/fig-5-22-reg-6-kNN.png)\n\n#####\
  \ 贝叶斯岭回归\n\n贝叶斯岭回归通过为模型参数估计提供概率框架，扩展了标准线性回归。这使我们能量化预测相关的不确定性，不仅得到单一预测值，还得到预测区间。\n\
  \n以下是其主要特征：\n\n- **关键参数**：`alpha` 和 `lambda`（权重和噪声的精度）\n- **合理取值**：通常通过交叉验证微调；常从默认值开始\n\
  - **数据集限制**：适合中小型数据集（5 万至 10 万行），取决于特征复杂度\n- **导入语法**：`from sklearn.linear_model\
  \ import BayesianRidge`\n\n贝叶斯岭回归能提供带不确定性估计的稳健预测，如下图所示，我们对数据集应用滑动窗口方法与贝叶斯岭回归。在该可视化中，红色预测线的每个片段代表针对不同数据窗口拟合的模型，周围的阴影区域表示预测区间，反映模型对其预测的不确定性：\n\
  \n![](img/fig-5-23-reg-7-bayesian-prediction-interval.png)\n\n在探讨了关键监督学习算法后，我们现在将重点转移到选择标准和指标上，这对于为特定交易应用选择最合适的算法至关重要，需考虑数据特征、预测类型和性能指标，包括准确率、精确率和召回率。\n\
  \n## 交易应用的选择标准\n\n本节解决评估和选择 ML 算法的关键任务，特别关注分类模型和回归模型的区分，因为它们适用不同的指标。\n\n对于分类算法，准确率、精确率、召回率和\
  \ F1 分数等关键指标在评估性能中起核心作用。\n\n相反，对于回归模型，我们关注均方误差（MSE）、均方根误差（RMSE）和平均绝对误差（MAE）等指标。这种区分对于准确衡量每种算法在其各自领域的有效性至关重要，确保为交易应用中的相应任务选择正确的模型。\n\
  \n\n\n\n\n#### 分类指标\n\n分类指标主要关注准确分类实例的数量，这与回归问题形成对比，后者的关键在于距离度量。分类指标不评估误差的程度，而是统计算法误分类的实例数量。无论涉及的类别数量多少，这一原则均适用。换句话说，这些指标无论用于二分类（两个类别）还是多分类问题（两个以上的类别）都同样适用。\n\
  \n#### 混淆矩阵\n\n包含所有实例（无论分类正确与否）的表格称为混淆矩阵。我们将了解其定义，并探讨该矩阵如何作为一种工具，用于计算和理解精确率、准确率和召回率等关键指标。\n\
  \n混淆矩阵是一种结构化数组，它通过根据预测分类和实际分类对所有实例进行归类，来捕捉分类模型的性能。从结构上看，矩阵的列代表模型预测为正例或负例的实例，因此被标记为正例或负例：\n\
  \n![](img/fig-5-24.png)\n\n可以将混淆矩阵视为分类模型的一份详细成绩单。在监督学习中，我们拥有答案（真实标签）。混淆矩阵将模型的答案（预测）与答案进行比较，从而给出其性能的详细细分。它将每个预测归入四组：真阳性\
  \ (TP)、假阳性 (FP)、真阴性 (TN) 和假阴性 (FN)，从而提供模型准确性的全面视图：\n\n![](img/fig-5-25.png)\n\n\
  #### 准确率得分\n\n在混淆矩阵中，落在对角线（左上到右下）上的实例代表分类正确的情况 6。这些预测类别与实际类别完美一致的实例，表明了模型的成功预测。这就是准确率得分的本质：\n\
  \n![](img/eq-1.jpg)\n\n让我们用一个简单的数值示例来说明准确率得分是如何计算的。设想一个 ML 模型，用于预测一笔交易是否会盈利。在 100\
  \ 笔交易上测试后，结果如下：\n\n* 模型预测 40 笔交易为盈利（正类标签）。\n* 在这 40 笔交易中，只有 30 笔真正盈利，为 TP。\n* 剩余\
  \ 10 笔交易未产生任何收益，但模型错误地将它们标记为盈利，为 FP。\n* 在这 60 笔交易中，25 笔未产生任何收益，为 TN。\n* 剩余 35 笔实际上是盈利的，但被错误地标记为不盈利，为\
  \ FN。\n\n这给出了：\n\n* 真阳性 (TP)：30（模型正确预测了盈利交易）\n* 假阳性 (FP)：10（模型错误预测了盈利交易）\n* 真阴性\
  \ (TN)：25（模型正确预测了亏损交易）\n* 假阴性 (FN)：35（模型错误预测了亏损交易）\n\n让我们使用准确率得分公式来计算该指标：\n\n![](img/eq-2.jpg)\n\
  \n以下代码用于用数值示例的数据填充矩阵，然后使用 Scikit-Learn API 计算指标：\n\n```python\nfrom sklearn.metrics\
  \ import confusion_matrix, accuracy_score\n\nimport numpy as np\n\n##### 分类预测和实际标签：\n\
  y_true = [1]*30 + [0]*10 + [1]*40 + [0]*25  # 30 TP, 40 FN, 10 FP, 25 TN\ny_pred\
  \ = [1]*30 + [1]*10 + [0]*40 + [0]*25  # 预测标签\n\n##### 创建混淆矩阵\nconf_matrix = confusion_matrix(y_true,\
  \ y_pred)\naccuracy = accuracy_score(y_true, y_pred)\n\nprint(\"Accuracy:\", np.round(accuracy,\
  \ 2))\n```\n\nAccuracy: 0.55\n\n#### 精确率得分\n\n精确率得分指标源于模型预测正例有多准确这一直觉。它专门关注模型预测为正例的所有实例中，真阳性\
  \ (TP) 所占的比例。本质上，精确率告诉我们模型正向预测的可靠性如何，而不考虑其在负例上的表现。\n\n公式如下：\n\n![](img/eq-3.jpg)\n\
  \n让我们用数值示例来说明精确率是如何计算的：\n\nML 模型预测一笔交易是否会盈利。在 100 笔交易上测试后，结果如下：\n\n* 模型预测 40 笔交易为盈利（正类标签）。\n\
  * 在这 40 笔交易中，只有 30 笔真正盈利，为 TP。\n* 剩余 10 笔交易未产生任何收益，但模型错误地将它们标记为盈利，为 FP。\n\n下图展示了如何在混淆矩阵中组织这些元素：\n\
  \n![](img/fig-5-26.png)\n\n现在，让我们计算精确率得分：\n\n* TP：30（被正确识别为盈利的交易）\n* FP：10（被错误识别为盈利的交易）\n\
  \n使用精确率公式，如下：\n\n![](img/eq-4.jpg)\n\n这意味着模型识别为有价值的交易中，有 75% 确实是有价值的。在此背景下，精确率告诉我们模型预测的可靠性如何。\n\
  \n要以编程方式计算精确率，可以使用 Python 中 `sklearn.metrics` 模块的 `precision_score` 函数，如下所示：\n\n\
  ```python\n##### 计算精确率：\nfrom sklearn.metrics import precision_score\n\nprecision\
  \ = precision_score(y_true, y_pred)\nprint(\"Precision:\", np.round(precision, 2))\n\
  ```\n\nPrecision: 0.75\n\n#### 召回率得分\n\n召回率关注模型正确识别所有实际正例的能力。它衡量真阳性预测相对于实际正例总数的比例。\n\
  \n与精确率不同，召回率同时考虑了正确识别的正例和遗漏的正例 (FN)，提供了模型捕捉所有相关实例能力的度量：\n\n![](img/eq-5.jpg)\n\n\
  继续沿用交易预测模型示例：\n\n* 如前所述，共有 70 笔盈利交易。\n* 在这 70 笔盈利交易中，模型仅识别出 30 笔 (TP)，而遗漏了 40 笔\
  \ (FN)：\n\n![](img/fig-5-27.png)\n\n现在，让我们计算召回率：\n\n* TP：30（被正确识别为盈利的交易）\n* FN：40（模型遗漏的盈利交易）\n\
  \n使用召回率公式：\n\n![](img/eq-6.jpg)\n\n召回率得分 = 30/70 即 43%\n\n将 scikit-learn 的 `recall_score`\
  \ 函数应用于我们的交易示例，得到：\n\n```python\nfrom sklearn.metrics import recall_score\n\nrecall\
  \ = recall_score(y_true, y_pred)\nprint(\"Recall:\", np.round(recall, 2))\n```\n\
  \nRecall: 0.43\n\n这意味着模型正确识别了所有盈利交易中的 43%。召回率反映了模型寻找所有潜在盈利交易的能力，无论它错误地将多少交易标记为不盈利。\n\
  \n#### F1 得分\n\nF1 得分是一个结合了精确率和召回率的指标，提供单一得分来衡量模型的准确性。当你需要在精确率和召回率之间取得平衡时，它特别有用，这在\
  \ FP 和 FN 代价都高昂的场景中经常出现。\n\nF1 得分是精确率和召回率的（调和）平均数，赋予两个指标同等权重，如下：\n\n![](img/eq-7.jpg)\n\
  \n将 scikit-learn 的 `f1_score` 函数应用于我们的交易示例，得到以下结果：\n\n```python\nfrom sklearn.metrics\
  \ import f1_score\n\nf1 = f1_score(y_true, y_pred)\nprint(\"F1-Score:\", np.round(f1,\
  \ 2))\n```\n\nF1-Score: 0.55\n\n当你寻求在识别所有相关实例（召回率）和确保识别出的实例确实相关（精确率）之间取得平衡时，F1 得分指标是一个很好的选择。\n\
  \n现在我们了解了评估分类模型的关键指标，接下来将关注针对回归任务量身定制的指标，在那里重点从分类准确性转移到连续值预测精度的度量上。\n\n#### 回归指标\n\
  \n\n\n\n\n#### 评估回归模型\n\n评估回归模型需要用能够量化预测值与实际值之间差异的指标。让我们探讨一些常见的回归指标，首先从 MSE 开始。\n\
  \n##### 均方误差\n\nMSE 测量估计值与实际值之间平均平方差异。它是衡量回归模型准确性的常用指标。下图通过将实际值与预测值绘制在一起，并用垂直线表示每个点的误差，直观地展示了线性回归模型的预测误差。\n\
  \n然后将这些误差平方并求平均以计算 MSE，如下所示：\n\n![](img/fig-5-28-reg-8-predictions-errors.png)\n\
  \n由于对每个误差项进行平方，MSE 对较大误差的惩罚比对较小误差的惩罚更严厉。这使得它对异常值敏感，并放大了较大误差的影响，与其他指标相比，如下所示：\n\n\
  ![](img/eq-8.jpg)\n\n使用 scikit-learn 中的 `mean_squared_error` 函数计算 MSE，如下所示：\n\n\
  ```python\nfrom sklearn.metrics import mean_squared_error, mean_absolute_error\n\
  \n###### 示例：可以使用以下方式计算 MSE\nmean_squared_error(y_true, y_pred)\n```\n\n##### 均方根误差\n\
  \nRMSE 是 MSE 的平方根。它也是衡量回归模型准确性的指标。\n\n通过对 MSE 开平方，RMSE 将误差指标转换回目标变量相同的单位，使其更具可解释性，如下所示：\n\
  \n![](img/eq-9.jpg)\n\n以下是使用 Scikit-Learn 的实现代码：\n\n```python\nfrom sklearn.metrics\
  \ import mean_squared_error\n\n###### 示例：可以使用以下方式计算 RMSE：\nsqrt(mean_squared_error(y_true,\
  \ y_pred))\n```\n\n##### 平均绝对误差\n\nMAE 测量一组预测中误差的平均幅度，而不考虑其方向。它是预测值与实际观测值之间绝对差异的平均值：\n\
  \n![](img/eq-10.jpg)\n\n与 MSE 或 RMSE 不同，MAE 给出的是线性得分，这意味着所有单个差异的权重相等。它对异常值不敏感，如下所示：\n\
  \n```python\nfrom sklearn.metrics import mean_absolute_error\n\nmean_absolute_error(y_true,\
  \ y_pred)\n```\n\n## 总结\n\n在本章结束时，我们介绍了监督学习作为数据驱动交易的强大工具。核心原则是利用标记的历史数据训练算法，以预测未来的市场行为，用分类预测运动方向，用回归预测运动幅度。\n\
  \n选择合适的算法和评估指标（分类用准确率、精确率、召回率；回归用 MSE、RMSE、MAE）至关重要。监督学习为开发复杂且潜在盈利的交易策略提供了框架，但需要仔细考虑模型复杂性、可解释性以及金融数据的特性。\n\
  \n在下一章中，我们将探讨用于交易的特征工程，从价格数据衍生的基本特征开始。然后我们将引入技术指标，接着转向更高级的特征工程，包括基于记忆的特征、基于信息的特征（如赫斯特指数和熵），甚至源自机器学习模型本身的特征。最后，我们将介绍\
  \ PCA 和 UMAP 等降维技术，并讨论有效特征选择的策略，以提高模型性能和可解释性。\n\n---\n\n**加入我们书籍的 Discord 空间**\n\
