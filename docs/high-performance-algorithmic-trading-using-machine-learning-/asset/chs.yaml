  \n# 第 7 章  \n\n## 交易的高级机器学习模型\n\n## 简介\n\n本章探讨了算法交易的高级机器学习技术，研究了超越传统监督学习的方法。我们将研究最先进的集成方法和在线学习方法，以改进交易策略。\n\
  \n本章首先深入探讨集成方法，通过组合多个模型来提高预测准确性并减少过拟合。然后我们讨论 Boosting、Bagging 以及 `XGBoost` 和 `LightGBM`\
  \ 等特定算法，重点介绍它们在算法交易中的应用。\n\n本章还探讨了高级回归方法，包括最小绝对收缩和选择算子（`LASSO`）和岭回归，并深入分析了它们在金融预测中的有效性。此外，我们将探索在线学习，考察\
  \ `Scikit-multi flow` 等工具以展示它们在实时金融信号跟踪中的作用。本章的目标是提供对这些高级方法的全面理解，以便读者能够有效地应用它们。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 理解高级机器学习\n- 集成方法简介\n- 用于分类的高级集成方法\n\n\n\n\n• 高级回归方法\n\
  \n## 目标\n\n本章介绍用于算法交易的高级机器学习技术，重点在于提高预测准确性和防止过拟合。读者将探索集成方法，如装袋法和提升法，并理解它们如何降低方差和偏差。他们将实现随机森林进行波动率预测，使用\
  \ `Scikit-Optimize` 微调 `XGBoost`，并使用分类报告评估模型。此外，本章还涵盖 `LASSO` 和岭回归，展示如何使用 `LASSO`\
  \ 进行特征选择以减少过拟合并提高模型可解释性。读者还将探索用于非线性关系的核方法，以及用于实时模型适应的 `Scikit-multiflow` 在线学习。这些技术（包括\
  \ `XGBoost` 和在线学习）代表了机器学习的最前沿水平，为读者提供了构建适应性强、稳健的交易模型以应对动态市场条件的工具。\n\n一个关于价差预测的案例研究演示了这些高级方法。首先，我们对正常与异常价格动态进行分类；然后，我们在波动率范围内预测价差的值。\n\
  \n## 理解高级机器学习\n\n用于交易的现代机器学习既需要预测准确性，也需要适应性。那些只训练一次便无限期应用的传统模型，往往因趋势、波动率和市场结构的持续变化而在金融市场中失效。为了保持竞争力，交易者必须使用融合了模型集成、优化和实时适应最新进展的机器学习技术。\n\
  \n集成方法，包括装袋法和提升技术（如 `XGBoost`），代表了预测建模的最前沿。它们通过组合多个模型、迭代纠正错误和优化决策边界来提高准确性。这些方法已成为结构化数据任务（包括金融预测）的行业标准。`LASSO`\
  \ 和岭回归引入了正则化，通过惩罚过度复杂性来优化模型并防止过拟合。核方法通过捕捉非线性关系扩展了传统回归，使模型能更好地反映复杂的金融依赖关系。\n\n标准机器学习的一个关键局限性在于其静态本质：一旦训练完成，模型将保持固定，直到重新训练。在线学习通过允许模型利用新数据持续更新来克服这一局限，使其对快速变化的市场极为有效。这种实时适应对于高频交易、流式数据环境以及必须即时适应新模式的算法策略至关重要。\n\
  \n理解这些方法为交易者提供了工具，以构建超越传统方法的稳健、自适应和高性能模型。以下章节将分解这些技术及其在交易中的实际应用。为实现更高的预测稳定性和准确性，我们转向集成方法，通过组合多个模型来提升性能并减少错误。\n\
  \n## 集成方法简介\n\n集成方法是一种通过将多个弱学习器组合成一个更强、更可靠的预测器来提高模型性能的有力途径。该技术利用了这样一个原则：聚合模型在稳定性和准确性方面通常优于单个模型。我们在第\
  \ 5 章《交易系统的监督学习》及前几章中介绍了集成学习；现在，我们将更深入地探讨它并将其应用于交易策略。\n\n集成 1 的核心优势在于其降低错误和减少预测噪声的能力。通过汇集不同模型的优势和洞见，集成方法能有效消除单个预测器的特有偏差和偏向。这种模型间的平均或投票过程有助于缓解过拟合。\n\
  \n然而，集成方法并非没有局限性。一个关键挑战是预测器之间潜在的相关性。如果单个模型过于相似或相关，集成将失去其多样性，从而丧失部分效力。另一个考量因素是预测器的数量；太少可能无法提供足够的多样性，而太多可能导致复杂性增加和边际效益递减。我们将在下一节“集成的统计基础”中详细讨论这些要点。\n\
  \n在接下来的章节“用装袋方法对抗过拟合”和“用提升法实现高准确性”中，我们将探讨两种主要形式的集成——提升法和装袋法，它们各自拥有独特的模型组合方法，并在交易算法语境下各具优势。\n\
  \n## 用于分类的高级集成方法\n\n在本节中，我们将探讨集成学习的两大基石技术：装袋法和提升法。我们将探索这些方法 2 的基本原理，重点突出它们各自的优势及相互之间的差异。在剖析这些方法的过程中，我们将理解它们在提高各种场景下的预测准确性和模型稳健性方面的作用。\n\
  \n在下一节中，我们将解释集成背后的统计基础和动机。该部分为可选内容，读者可根据需要跳过。\n\n### 集成的统计基础\n\n在集成学习的语境下，组合模型以减少错误的理论动机可以通过偏差-方差权衡\
  \ 3 来理解。集成的总体误差可分解为以下三个分量：\n\n```\n![](img/eq-12.jpg)\n```\n\n让我们定义这三个分量：\n\n* **偏差**\
  \ 是指模型因学习算法中过于简化的假设而持续做出错误预测的倾向。模型的简单性会导致高偏差，表现为系统性地偏离数据中的真实关系。下图对此进行了说明：\n\n```\n\
  ![](img/fig-7-1.png)\n```\n\n线性关系中所示的预测持续偏离准确性（虚线）。同样，我们演示了偏差如何影响机器学习分类算法。\n\n在下图中，算法过于简化的类别间边界（分界面）持续导致不良的分类结果：\n\
  \n```\n![](img/fig-7-2.png)\n```\n\n* **方差** 描述模型的预测误差在应用于不同训练数据集时波动的程度，突显了模型在不同数据条件下的不一致性。\n\
  \n* **不可约误差** 是任何模型固有的、无法避免的误差，由未知变量或数据固有的随机性等因素引起。\n\n现在我们已掌握了基本术语，让我们探讨它们如何相互作用并共同构成模型的总体误差。\n\
  \n考虑一个由 N 个独立模型组成的集成，每个模型的方差为 ，偏差为 b。当这些模型被平均时，集成的偏差保持为 b，但方差降低为 `![](img/eq-31.jpg)`\
  \ ，假设模型相互独立且方差相等。\n\n这种方差的降低对减少集成的总误差有显著贡献，因为总误差是偏差平方、方差和不可约误差的组合。\n\n模型集成的方差可按如下方式确定：\n\
  \n```\n![](img/eq-22.jpg)\n```\n\n这展示了集成如何通过减少误差的方差分量来显著降低误差。\n\n\n\n\n##### 使用装袋法对抗过拟合\n\
  \n为了更准确地解释集成学习如何通过降低方差来减少误差，必须讨论模型之间的相关性。事实上，相关性是一把双刃剑；如果模型之间差异足够大，它会有所帮助，但如果模型过于相似，则会产生负面影响。\n\
  \n这种相关性显著影响集成的整体有效性，如下图所示：\n\n![](img/fig-7-3.png)\n\n大圆点表示较高的方差，而小圆点表示较低的方差。该图展示了相关性\
  \ `ρ` 与模型数量 `N` 之间的关系，清晰地描绘了模型相关性和集成规模对方差降低的影响。总之，如果模型并非完全独立，而是表现出一定程度的相关性，那么通过集成实现的方差降低\
  \ 4 将受该相关性程度的调整。换句话说，模型之间的相关性越强，组合它们所能实现的方差降低就越少。\n\n在集成学习的统计学基础之上，我们现在将重点放在装袋法上，作为这些原理的实际应用。\n\
  \n##### 使用装袋法对抗过拟合\n\n任何机器学习算法的自助聚合（简称 `Bagging`）都涉及在不同的训练数据子集上训练同一算法的多个实例，然后组合它们的预测结果。\n\
  \n每个模型都在随机采样的数据子集上进行训练，这使得集成能够捕捉多样化的模式，并降低单个模型可能遇到的过拟合风险。最终输出利用多个模型的集体力量 5 来实现更准确、更稳健的结果。\n\
  \n现在，我们将演示一个涉及决策树集成的装袋应用。\n\n###### 使用装袋算法预测波动率模式\n\n装袋最著名的应用是随机森林 6，它是决策树的集成，每棵树都在数据集的不同样本上进行训练。\n\
  \n鉴于我们在前几章中已将该算法用于真实市场数据，并在第 5 章《交易系统的监督学习》中详细阐述了其特性（该章专门介绍监督学习的主要原理），我们可以凭借对随机森林分类器概念的清晰理解继续进行。这种熟悉度使我们能更专注于该算法在特定情境下的应用，利用我们先前对其在监督学习场景中工作原理和优势的了解。\n\
  \n在该应用中，我们将探索这一装袋算法预测收盘价相对于 7 (ATR) 显著偏离中轨线情况的能力。该研究旨在利用随机森林的稳健性 8 来识别市场波动背景下的显著价格变动。\n\
  \n以下数据集为 Nifty50 印度市场指数（Yahoo Finance 代码 `^NSEI`），一个代表印度股市的主要股市指数，数据频率为 1 分钟：\n\n\
  ![](img/table_7.1.jpg)\n\n表 7.1：Nifty50 指数日内数据集\n\n我们要预测的结果被构建为一个分类问题。在下一节“高级回归方法”中，我们将把这个分类问题重构为回归任务，预测确切的价差。\n\
  \n目前，我们建模的具体条件可表示如下：\n\n类别 = 1，若 ![sigma squared divided by N prime.](img/eq-41.jpg)\
  \ 或\n\n类别 = 1，若 ![Rule for Class=1 based on Close price minus its 20-period average,\
  \ divided by 14-period ATR.](img/eq-42.jpg) 或\n\n类别 = -1，否则\n\n在典型的分类问题中，正类表示我们寻求预测的关注事件。因此，在本场景中，当收盘价\
  \ () 相对于其既定波动范围 出现显著偏离时，目标值被赋为 1。反之，若无显著偏离，目标值设为 -1：\n\n用简单的金融术语来说，该模型预测收盘价是否即将经历超出预期波动范围的显著上涨或下跌。类别\
  \ 1 表明价格可能突破其正常范围，而 -1 表明预期不会发生此类突破。\n\n以下代码计算波动率范围：\n\n```\nmult = 2\n\ndf['target']\
  \ = \\\nnp.where((np.abs(df['Close'] - df['BBM_20_2.0'])/ df['ATR']) > mult , 1\
  \ , -1)\n```\n\n在分析中，我们将使用上一章介绍的 `Pandas_ta` 库来计算模型所需的关键技术指标（均线和 ATR）。这些指标包括布林带中轨\
  \ (`BBM_20_2.0`) 作为简单移动平均线。\n\n我们在下图中展示上述表达式：\n\n![](img/fig-7-4.png)\n\n在此背景下，负类（未检测到）与价格模式保持在波动率通道\
  \ ([-2 , +2]) 内相关联，这被视为正常行为。反之，正类则相反。\n\n在目前的分析中，我们不进行参数优化 9。这意味着我们在计算中使用默认的硬编码周期值：ATR\
  \ 采用 14 周期设置，均线中轨采用 20 周期设置。将波动率通道设定为 [-2, +2] 范围确实是一个任意选择。更深入的统计分析（计算分位数）可以优化这种方法。\n\
  \n此外，我们也不针对随机森林算法进行最优超参数搜索。这种方法简化了我们的模型，专注于算法在标准设置下固有的预测能力，而非通过微调来寻求潜在的性能提升。\n\n\
  同样，特征工程也被有意保持在最低限度，仅关注 ATR 和布林带（具体为中轨线）：\n\n```\n####### 使用 pandas_ta 计算布林带\n\n\
  bollinger = df.ta.bbands(close='Close', length=20, std=2)\n\ndf = pd.concat([df,\
  \ bollinger], axis=1)\n\n####### ATR\n\ndf['ATR'] = df.ta.atr()\n\ndf['TR'] = df.ta.true_range()\n\
  ```\n\n既然我们已经定义了结果 (`df['target']`)，下一步就是实例化一个装袋分类器并用准备好的数据集对其进行训练：\n\n```\ny =\
  \ df.pop('target')\n\nX = df.copy()\n```\n\n此过程包括从 scikit-learn 创建一个随机森林模型实例，配置其参数\
  \ (`max_depth = 4`)，然后用训练数据拟合模型：\n\n```\nclf = RandomForestClassifier(max_depth\
  \ = 4)\n\nX_train , X_test , y_train , y_test = train_test_split(X , y)\n\nclf.fit(X_train\
  \ , y_train)\n\npred = clf.predict(X_test)\n\nclf.score(X_test , y_test)\n\n0.73\n\
  \nfrom sklearn.metrics import confusion_matrix , classification_report\n\nprint(confusion_matrix(y_test\
  \ , pred))\n\nprint()\n\nprint(classification_report(y_test, pred ))\n```\n\n```\n\
  [[312 115]\n [ 32 96]]\n```\n\n我们可以按如下方式分析此混淆矩阵：\n\n- 真负例：312 个实例被正确预测为负类。\n- 假正例：115\
  \ 个实例被错误预测为正类。\n- 假负例：32 个实例被错误预测为负类。\n- 真正例：96 个实例被正确预测为正类。\n\n以下是 `classification_report`\
  \ 提供的详细报告：\n\n```\n              precision    recall  f1-score   support\n\n   \
