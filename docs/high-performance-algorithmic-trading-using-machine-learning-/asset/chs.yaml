  \ estimator lgbm's best error=0.1415\n...\n[flaml.automl.logger: 02-27 23:52:27]\
  \ {2630} INFO - retrained model: ExtraTreesRegressor(max_features=0.7552682732533821,\
  \ max_leaf_nodes=108, n_estimators=6, n_jobs=-1, random_state=12032022)\n[flaml.automl.logger:\
  \ 02-27 23:52:27] {1930} INFO - fit succeeded\n[flaml.automl.logger: 02-27 23:52:27]\
  \ {1931} INFO - Time taken to find the best model: 6.1406309604644775\n```\n\n该输出提供了\
  \ AutoML 过程的详细日志，记录了在指定时间预算内寻找最佳模型所采取的步骤，具体如下：\n\n*   **任务**：日志确认问题被设定为回归。\n*  \
  \ **误差指标**：AutoML 告知我们衡量模型对目标变量解释程度的指标。\n*   **AutoML 运行中的 ML 学习器列表**：这是一个候选模型列表，包括\
  \ `LightGBM`、`随机森林` (`rf`)、`XGBoost` 等。\n*   **迭代过程**：模型选择过程迭代运行，从优化超参数以提高性能开始。每次迭代都记录迄今为止达到的最佳误差。\n\
  *   **时间估算**：AutoML 估算充分和必要的时间预算以优化性能，确保高效的资源分配。\n*   **最终模型选择**：测试各种学习器后，AutoML\
  \ 选择最佳模型。\n*   **完成**：日志确认拟合成功，表明最佳模型在 6 秒内被找到，突显了 AutoML 高效搜索最优配置的能力。\n\n该输出演示了\
  \ AutoML 如何系统地测试模型、调优超参数并选择最佳方法，从而简化了模型选择和优化的过程。\n\n然后，计算预测误差和 R2 分数，我们得到：\n\n```\n\
  ##### Evaluate the classifier on the test data\nprint('RMSE = ',np.sqrt(mean_squared_error(pred\
  \ , y_test)))\nprint(automl.score(X_test , y_test))\n```\n\n```\nRMSE = 0.071\n\
  0.989\n```\n\n与我们使用 `Lasso` 算法手工设计特征的基准相比，这代表了巨大的提升，后者报告的平均 RMSE 误差约为 0.54，R2 分数为\
  \ 0.4：\n\n![](img/fig-8-5.png)\n\n\n\n正如我们在前一张图表中所见，预测值与真实值紧密对齐。它们几乎与标记完美预测的对角线重合。\n\
  \n#### 使用 H2O 进行 AutoML\n\n我们继续考察复杂的 AutoML 框架。与 FLAML 一样，H2O 也是强大开源平台的首选之一。H2O11\
  \ 提供了一个与 FLAML 类似的界面，允许在指定限制（如时间预算或固定迭代次数）内测试各种前沿算法。\n\nH2O 网站 `https://docs.h2o.ai/h2o/latest-stable/h2o-docs/automl.html`\
  \ 上的描述如下：\n\n> 尽管 H2O 让非专家也能轻松尝试机器学习，但要生成高性能的机器学习模型，仍然需要相当多的数据科学知识和背景。为了让机器学习软件真正让非专家也能使用，我们设计了一个易于使用的界面，自动化了训练大量候选模型的过程。H2O\
  \ 的 AutoML 对于高级用户也是一个有用的工具，它提供了一个简单的封装函数，执行大量与建模相关的任务——这些任务通常需要编写许多代码行——并腾出他们的时间，专注于数据科学流程的其他方面，如数据预处理、特征工程和模型部署。\n\
  \n让我们评估该框架，以验证这些说法的准确性。安装后，我们从初始化阶段开始：\n\n```\n!pip3 install -q h2o\n```\n\n```\n\
  import h2o\nfrom h2o.automl import H2OAutoML\n```\n\n该代码在本地初始化一个 `H2O` 实例并准备建模数据：\n\
  \n```\nh2o.init()\n```\n\n`H2O` 启动一个（本地）服务器来运行实验。这是因为 `H2O` 需要在运行任何机器学习实验之前建立这个本地服务器，该服务器在\
  \ `H2O` 初始化时会自动启动：\n\n```\nChecking whether there is an H2O instance running at\
  \ http://localhost:54321..... not found.\nAttempting to start a local H2O server...\n\
  Starting server\nServer is running at http://127.0.0.1:54321\nConnecting to H2O\
  \ server at http://127.0.0.1:54321 ... successful.\n```\n\n此步骤确保 `H2O` 服务器实例正在运行，以便高效地跨可用系统资源分配计算。\n\
  \n唯一的前提是通过将预测目标标记为 `target` 并将 Pandas `DataFrame` 转换为 `H2O` 容器来格式化数据：\n\n```\ndf['target']\
  \ = df['Close'].shift(-ahead)\ndf.dropna(inplace=True)\n##### 'df' : pandas DataFrame\
  \ with the target variable named 'target'\nh2o_df = h2o.H2OFrame(df)\n```\n\n```\n\
  Parse progress: |████████████████████████████████████████████████████████████████|\
  \ (done) 100%\n```\n\n然后，该 `H2O` 容器通过 `h2o_df.split_frame()` 函数划分为训练集和测试集。与 AutoML\
  \ 引擎随后执行的大量过程相比，此任务只需极少的工作量：\n\n```\n##### Split the data into train and test sets\n\
  train, test = h2o_df.split_frame(ratios=[.8], seed=42)\n\n##### Identify predictors\
  \ and response\nx = train.columns\ny = \"target\"\nx.remove(y)\n\n##### Run AutoML\
  \ for x base models (limited here for speed)\naml = H2OAutoML(max_models=5, seed=1)\n\
  ```\n\n此 `H2OAutoML()` 命令按以下规范执行 `H2O` 引擎：\n\n*   `max_models=5`：将基础模型数量限制为 5 个，确保快速执行。当然，可以增加此数字以探索更广泛的模型范围。\n\
  *   `seed=1`：设置随机种子以保证可复现性，确保多次运行的结果保持一致。\n\n以下代码 `aml.train()` 使用以下参数启动训练过程：\n\n\
  *   `x`：特征列（自变量）。\n*   `y`：目标列（因变量）。\n*   `training_frame=train`：用于训练的数据集。\n\n```\n\
  aml.train(x=x, y=y, training_frame=train)\n```\n\n该过程首先通过消除对预测无用的常数列来进行特征选择：\n\n\
  ```\n06:24:28.549: _train param, Dropping unused columns: [DX-Y.NYB_Volume]\n██████████████████████████████████████████████████████|\
  \ (done) 100%\n```\n\n经过几轮尝试后，随机森林回归器 `H2ORandomForestEstimator` 脱颖而出，成为最佳候选模型：\n\
  \n```\nModel Details\n=============\nH2ORandomForestEstimator : Distributed Random\
  \ Forest\nModel Key: DRF_1_AutoML_1_20240226_62057\n```\n\n随后，引擎评估最佳模型：\n\n```\n\
  ModelMetricsRegression: drf\n** Reported on cross-validation data. **\nMSE: 0.002954176243244988\n\
  RMSE: 0.05435233429435196\nMAE: 0.04027944498639655\n```\n\n与我们早期使用 FLAML AutoML\
  \ 引擎的尝试（`RMSE: 0.07`）相比，这一误差量级（`RMSE: 0.05`）代表了一个进步。\n\n此外，`H2O` 报告强调了每个特征的重要性。值得注意的是，在\
  \ OHLC 之后，最重要的特征是在我们初步的相关性图探索中被识别为高度相关的特征，具体为 TIP Inflation Protected 和 LQD Corporate\
  \ Bonds：\n\n```\nVariable importance:\n| variable || relative_importance || scaled_importance\
  \ || percentage |\n| --- | --- | --- | --- |\n| Close || 10857.5126953 || 1.0 ||\
  \ 0.2762052 |\n| --- | --- | --- | --- |\n| Low || 5061.9379883 || 0.4662152 ||\
  \ 0.1287711 |\n| High || 4167.9204102 || 0.3838743 || 0.1060281 |\n| Open || 3686.7221680\
  \ || 0.3395549 || 0.0937868 |\n| TIP_Open || 1184.7832031 || 0.1091211 || 0.0301398\
  \ |\n| TIP_High || 1182.2382812 || 0.1088867 || 0.0300751 |\n| LQD_Open || 725.5785522\
  \ || 0.0668273 || 0.0184581 |\n| TIP_Close || 583.2502441 || 0.0537186 || 0.0148374\
  \ |\n| LQD_Close || 552.1102905 || 0.0508505 || 0.0140452 |\n```\n\n表 8.1：特征重要性\n\
  \n此外，查看排行榜可以让我们识别出尝试中表现最好的模型：\n\n```\n##### View the AutoML Leaderboard\naml.leaderboard\n\
  ```\n\n一个非常有趣的选项是利用排行榜上的顶尖候选模型创建一个集成算法（元学习器），组合这些领先算法，从而可能进一步提高准确性：\n\n```\n#####\
  \ Get model ids for all models in the AutoML Leaderboard\nmodel_ids = list(aml.leaderboard['model_id'].as_data_frame().iloc[:,0])\n\
  \n##### Get the \"All Models\" Stacked Ensemble model\nse = h2o.get_model([mid for\
  \ mid in model_ids if \"StackedEnsemble_AllModels\" in mid][0])\n\n##### Get the\
  \ Stacked Ensemble metalearner model\nmetalearner = se.metalearner()\n```\n\n调查集成元学习器（或组合器）算法内的变量重要性，揭示了每个基础学习器对整体集成的贡献程度。本质上，`H2O`\
  \ 根据模型的性能能力智能地融合模型。随后，我们使用 `RMSE` 指标评估集成的误差量级：\n\n```\n##### Evaluate the classifier\
  \ on the test data\nprint('RMSE = ',np.sqrt(mean_squared_error(pred_df.values,test_df['target'].values)))\n\
  ```\n\n```\nRMSE = 0.0496\n```\n\n该分数超过了排行榜顶尖模型的分数，这符合预期：集成策略通常优于寻找单一最佳候选模型，正如第\
  \ 7 章《交易的高级机器学习模型》所见。与最佳单一模型（`RMSE` 从 0.05 降至 0.04）相比，该组合带来了约 0.04 的 `RMSE` 损失降低，标志着\
  \ 20% 的改进；与 FLAML 的性能（`RMSE` 约为 0.07）相比，改进幅度更大，而后者已被视为一项重大成就。\n\n虽然我们没有明确提及，但 AutoML\
  \ 平台在训练期间会执行超参数优化，在后台微调模型以提高其性能。由于这一步骤在实现最佳结果中起着关键作用，我们现在将回顾其重要性，以及用于系统探索超参数空间的不同技术。\n\
  \n#### 超参数优化\n\n\n\n\n#### 超参数优化\n\n超参数优化对于微调模型以实现最佳性能至关重要。AutoML 平台采用网格搜索、随机搜索或贝叶斯优化等技术，系统地探索超参数空间。这些方法旨在找到能产生最佳模型性能的最优超参数组合，正如\
  \ 第 3 章“优化交易系统、指标与自动化报告”所示。\n\n在 AutoML 和低代码平台中，超参数优化被封装在用户友好的界面之后，允许用户选择优化强度级别，或信任平台自动管理优化过程。这极大地降低了手动调整超参数的复杂性，尽管仍可能为高级用户提供自定义优化策略的选项。\n\
  \n## 模型评估\n\n虽然 AutoML 简化了超参数调优，但选择最佳模型需要严格的评估过程。AutoML 平台自动化模型评估，对比不同架构和超参数配置，以确保最优性能。\n\
  \nAutoML 中的模型评估涉及自动应用评估技术，以评估不同模型和超参数配置的性能。此过程包括根据问题类型生成准确率、精确率、召回率、F1 分数或均方误差等指标，以识别最有效的模型。\n\
  \n低代码平台提供简化的模型评估机制，通常向用户展示总结各模型性能的仪表板或报告。这使用户能够基于关键指标轻松对比模型。\n\n通过自动化模型评估，AutoML\
  \ 和低代码平台简化了基于预定义指标选择表现最佳模型的过程。但一个关键问题依然存在：这些自动化方法与传统的手动模型开发相比如何？\n\n## 与手动方法的结果对比\n\
  \nAutoML 和低代码平台通常能达到与手动模型开发相当甚至更优的结果，特别是对于机器学习专业知识有限的用户。这些平台旨在比人类更系统、更高效地探索庞大的可能性空间，从而增加识别高性能模型的机会。然而，在某些复杂场景中，专家数据科学家可能仍会优于\
  \ AutoML，因为这些场景需要深厚的领域知识、自定义特征工程和细致的模型调优。尽管如此，AutoML 和低代码平台在速度、资源效率和易用性方面提供了引人注目的优势，使其成为现代数据科学家工具箱中不可或缺的工具。\n\
  \n## 结论\n\n在本章结束时，我们讨论了 AutoML 和低代码平台如何通过自动化特征工程、模型选择、超参数调优和评估等关键流程，简化交易策略的开发。`H2O`\
  \ 和 `FLAML` 等最先进的工具优化模型选择，而 `Feature-engine` 和 `autofeat` 提供可靠的自动特征工程和选择。\n\n使用这些工具，我们在全球宏观建模中超越了手工打造的基准，展示了自动化在识别高性能模型方面的威力。虽然手动建模在复杂的、特定领域的案例中仍有价值，但\
  \ AutoML 显著提高了效率，并降低了机器学习领域的入门门槛。\n\n一个关键收获是如何战略性地组合不同工具以最大化模型性能。我们遵循的一种实用方法包括：使用\
  \ `AutoFeat` 和 `Feature-engine` 进行精准的特征生成，以创建和优化预测输入。然后，使用 `FLAML` 和 `H2O` 进行模型选择和优化，以确保识别出最有效的算法。最后，使用集成方法融合模型，以获得更高的预测准确性。\n\
  \n读者现已获得将 AutoML 和低代码框架应用于交易的实用技能，涵盖从全球宏观建模到策略优化。这些工具不仅加快了开发过程，还增强了预测能力，使其在现代算法交易中不可或缺。\n\
  \n在下一章中，我们将重点关注无监督学习方法及其在交易策略开发中的应用。与依赖标签数据的监督学习不同，无监督技术有助于在没有预定义结果的情况下，发掘金融数据中的隐藏结构、市场状态和关键转折点。我们将探索检测方法以识别市场动态的突然变化，以及聚类算法将金融时间序列分割为有意义的组别。这些技术将为交易者提供分析价格行为、检测市场转变和分类不同交易环境的新途径。\n\
