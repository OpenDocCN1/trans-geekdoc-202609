  \    0.80      0.74      0.75       555\n```\n\n\n\n\n正如我们已经说过的，在这个语境中，负类与价格模式保持在波动率通道内相关联，这被认为是正常行为。\n\
  \n上述报告强调了预测负类的高准确性；当模型预测负类时，它有 91% 的时间是正确的。召回率指标 10 也很高（73%），表明模型非常擅长检测正常行为（价格模式在波动率通道内）。\n\
  \n相反，正类的精确率较低，表明当模型预测正类时，它正确的时间不到一半（45%）。\n\n在下图中，我们可以看到模型能有效识别正常行为（负类），并具有检测显著偏差（正类）的平均能力：\n\
