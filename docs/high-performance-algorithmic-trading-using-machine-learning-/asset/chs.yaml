  \   617\nweighted avg       0.84      0.83      0.82       617\n```\n\n分类报告表明模型在识别资产正常波动行为方面具有良好的准确性，总体准确率约为\
  \ 81.5%。模型展示了预测负类（正常波动行为）的强大能力，这从该类别的高精确率（0.91）和可靠的召回率（0.87）中得到证明。这表明模型能有效识别收盘价保持在典型波动范围内的实例。\n\
  \n对于正类（收盘价超出正常波动范围的实例），模型表现出不错的性能，精确率为 0.64，召回率为 0.73。这表明模型在检测偏离正常波动的显著偏差方面相当不错，尽管与其检测正常行为的能力相比，存在更高的误报可能性（由较低的精确率表明）。\n\
  \n混淆矩阵进一步支持这些观察结果：\n\n• 模型正确识别了 404 个正常波动行为实例（真负例）并正确标记了 110 个显著偏差实例（真正例）。\n\n•\
  \ 然而，它错误地将 62 个实例预测为显著偏差而它们并非如此（假正例），并未能识别出 41 个显著偏差实例（假负例）。\n\n\n\n总体而言，该模型展现出识别正常波动行为的强大能力，以及检测显著偏离的可观能力，使其成为监控资产价格变动的宝贵工具。在对偏离的敏感度（召回率）与预测的准确性（精确率）之间取得平衡，尤其是针对正类别，这表明在交易策略中对模型应用进行了深思熟虑的考量，因为在交易策略中，既要避免虚假信号，又要捕捉显著变动，二者都很重要。\n\
  \n此外，与之前的随机森林模型相比，正类别（价格高于波动范围）的检测能力有了显著提升。该类别的准确率从 0.45 提升至 0.64，实现了 40% 的大幅增益。借助经过超参数调优优化的\
  \ `XGBoost` 算法，我们现在拥有了一个平衡良好的检测器，能有效应对两类事件——无论价格处于波动范围内还是范围外。\n\n在探讨了提升算法的应用后，我们现在将对比装袋和提升这两种互补的集成方法。\n\
  \n## 对比装袋与提升\n\n虽然装袋和提升都是通过组合多个模型来提升性能的集成方法，但它们的底层方法有所不同。正如你可能已经注意到的，装袋和提升的一个关键区别在于：装袋独立构建模型并通过平均或投票进行组合，这通过平均多个模型的预测有助于减少过拟合（方差预测）。而提升则通过顺序构建模型来减少偏差。它专注于最困难或最容易出错的数据点，从而提升整体性能，但如果管理不善，有时会增加过拟合（方差）。\n\
  \n提升模型在生产环境中的性能需要仔细监控，因为如果调优不当，它们容易过拟合，这一过程我们在上一节中已概述。这种脆弱性源于它们专注于实现准确预测（低偏差）。因此，如果整体架构无法进行微调，装袋可能是一个更易于实施的替代方案，因为它通常需要较少的密集监控，这主要归功于其专注于方差减少而天生具备的抗过拟合鲁棒性。\n\
  \n在下一节中，我们将介绍除装袋和提升之外的另一种集成方法。该方法提供了一种不同的模型组合途径，可用于进一步提升复杂任务上的性能。\n\n## 投票方法\n\n\
  在第 3 章《优化交易系统、指标与自动化报告》中，我们成功训练了一个投票集成来对 MSFT 股票收益进行分类。作为回顾，投票集成通过组合多样化机器学习模型的预测来提供稳健的结果。这种方法通过利用各模型的优势并最小化其个体弱点，被证明极具价值。虽然其底层概念与装袋和提升有相似之处，但一个关键区别在于模型选择。投票集成有意纳入多样化的算法，而装袋和提升则使用同一算法的变体。\n\
  \n接下来，我们将过渡到高级回归方法，届时我们将探索 Lasso、岭回归、在线学习和核方法，重点在于增强我们对这些复杂回归技术的理解与应用。\n\n## 高级回归方法\n\
  \n在本节中，我们将概述几种高级机器学习技术。首先，我们将探讨定量方法，具体为 `LASSO` 和岭回归，它们被用于对抗过拟合。随后，我们将讨论核方法，公认其为机器学习中最有效的策略之一。最后，我们将应对在无法存储大量训练数据以进行重复迭代的场景中应用机器学习的挑战。取而代之的是，我们专注于仅利用最新数据持续优化模型，这一实践被称为在线机器学习。\n\
  \n### 击败过拟合\n\n`LASSO` 和岭回归都是用于增强线性回归模型性能的技术，特别是在处理过拟合或数据集特征高度相关时。\n\n其核心在于，这两种方法都向线性回归的目标函数引入了正则化\
  \ 16 项。这种正则化通过惩罚大系数来降低模型的复杂度。它们共享的一个关键方面是都能将系数收缩至较低值，从而减少过拟合并改善模型泛化能力。然而，`LASSO`\
  \ 的一个独特特性是其能将某些系数缩减至零，通过从模型中排除无关特征来有效地执行特征选择。这两种方法都需要选择一个正则化参数，该参数控制施加惩罚的强度。\n\n\
  ### 高级回归分步指南\n\n基于我们对波动范围内资产价格行为的分析，我们现在采取更深入的方法。此前，我们根据收盘价是保持在正常波动通道内还是突破通道对其进行分类。现在，我们希望量化这些偏离的精确程度。这种从分类到精确测量的转变自然引导我们采用回归算法，从而对价格变动进行更详细的评估。\n\
  \n回归算法通过预测连续结果而非离散类别，与分类算法有所不同。在我们的研究背景下，分类帮助我们识别收盘价是否落入正常范围，而回归将使我们能够预测收盘价的归一化值。\n\
  \n要开始这一高级探索，我们通常遵循以下步骤：\n\n1.  **数据准备**：首先，确保数据集准备充分，包含收盘价以及可能影响这些价格的任何相关特征。接着，缩放对于训练\
  \ `LASSO` 和岭回归模型至关重要。`LASSO` 和岭回归都会在线性回归模型中对系数的大小施加惩罚。特征的尺度直接影响这些系数的大小，进而影响正则化过程中施加的惩罚。特别是在\
  \ `LASSO` 回归中，它可以将系数归零以进行特征选择，缩放可确保消除某特征的决定不会受该特征尺度的过度影响。这使模型更具可解释性。\n\n2.  **特征选择**：确定哪些特征对目标变量最具预测力。这可能涉及统计分析和特征选择技术的使用，正如我们在上一章第\
  \ 6 章《利用特征提升模型能力》中所见，该章专门探讨这些技术。\n\n3.  **模型选择**：选择一个回归模型。线性模型，如 `LASSO` 和岭回归，因其简洁性和有效性而成为极佳的切入点。对于更复杂的非线性关系，可考虑核岭回归或集成方法，如\
  \ `GBM` 或随机森林回归器。\n\n4.  **模型训练**：将数据集拆分为训练集和测试子集以验证模型性能。在训练集上训练选定模型，仔细调优超参数以优化性能。\n\
  \n5.  **评估**：使用适合回归的指标评估模型准确性，如均方误差（`MSE`）。\n\n6.  **迭代**：根据性能指标和领域知识优化模型。调整特征、尝试不同模型或进一步调优超参数均可带来准确性的提升。\n\
  \n\n\n\n## 应用\n\n现在，您可以将这个训练并验证过的模型应用于新的、未见过的数据，以预测归一化收盘价。这种能力可以成为预测未来价格走势和制定战略决策的有力工具。\n\
  \n通过从分类转向回归，我们超越了仅识别价格是否落在正常范围内的层面，转而预测其偏离的幅度。这种方法提供了关于价格走势相对于市场波动率的详细且可操作的理解，从而支持更精准的交易决策。\n\
  \n## LASSO 方法\n\n由于我们已经在“使用 Boosting 实现高准确率”一节中完成了分类任务的步骤 1 到 4，因此这些步骤将大幅简略。\n\n\
  我们首先按如下方式缩放特征：\n\n```python\nfrom sklearn.preprocessing import StandardScaler\n\n\
  scl = StandardScaler().set_output(transform=\"pandas\")\n\nX_train = scl.fit_transform(X_train)\n\
  X_test = scl.transform(X_test)\n```\n\n接下来，调用 Sklearn 导入所需模型：\n\n```python\nfrom\
  \ sklearn.linear_model import Lasso, Ridge\n```\n\n在以下代码中，我们微调回归模型，以实现量化波动率范围内价格偏差的目标：\n\
  \n```python\n### 超参数搜索空间\nspace = {\n    'alpha': Real(0.001, 10, prior='log-uniform'),\
  \ \n    # 正则化参数使用对数刻度\n}\n\nopt = BayesSearchCV(\n    Lasso(),\n    space,\n   \
  \ n_iter=30,\n    cv=5,\n    scoring=\"neg_mean_squared_error\",\n    n_jobs=-1,\n\
  \    verbose=0\n)\n\n### 优化超参数\nopt.fit(X_train, y_train) \nprint(\"best params:\
  \ \")\npprint(opt.best_params_)\n```\n\n输出：\n```text\nbest params: \nOrderedDict([('alpha',\
  \ 0.001)])\n```\n\n让我们记录下最佳模型以便当前使用：\n\n```python\nrgr = opt.best_estimator_\n```\n\
  \n下图展示了优化后的模型在测试集上的预测结果，以及价差数值的真实值（归一化收盘价）：\n\n![](img/fig-7-6.png)\n\n我们通过预测值与实际值的散点图来检验拟合优度。数据点与对角虚线的接近程度衡量了模型的准确性。点越接近这条线，模型越准确：\n\
  \n![](img/fig-7-7.png)\n\n在本例中，数据点聚集在对角线附近，表明优化后的模型提供了良好的拟合。为了量化这一观察结果，在以下代码中，我们计算归一化在\
  \ `[-1, 1]` 之间的回归得分，并获得 0.8 的分数。\n\n该分数越接近最大值 1，表明模型具有很强的预测性能，如下所示：\n\n```python\n\
  print(rgr.score(X_test, y_test))\n```\n\n输出：\n```text\n0.8\n```\n\n正如简介中提到的，LASSO\
  \ 通过将不太相关特征的系数设为零，具有很强的特征选择能力。要确定 LASSO 认为哪些特征对我们的模型显著，我们可以检查（通过变量 `rgr.coef_`）模型训练后分配的非零系数：\n\
  \n```python\nlst_coef = np.argwhere(rgr.coef_ != 0).reshape(1, -1)[0]\nprint(\"\
  columns of interest :\", list(X_test.iloc[:, lst_coef].columns))\n```\n\n输出：\n```text\n\
  columns of interest : ['Close_diff_frac_0.2_4', 'Close_diff_frac_0.25_4', 'Close_diff_frac_0.3_4',\
  \ 'Close_diff_frac_0.35_1', 'Close_diff_frac_0.35_2', 'Close_diff_frac_0.35_3',\
  \ 'Close_diff_frac_0.35_4', 'Close_diff_frac_0.35_5', 'Volatility', 'Closing_Position',\
  \ 'Gap_Previous_Close', 'Normalized_High', 'Relative_Change_Open_Close', 'High_Low_Clustering',\
  \ 'SMA_30', 'SMA_35', 'MACD', 'MACD_Histogram', 'RSI', 'STOCHk_14_3_3', 'STOCHd_14_3_3',\
  \ 'CCI', 'BBB_20_2.0', 'BBP_20_2.0', 'ATR', 'TR']\n```\n\n在提供给 LASSO 模型的数百个特征中，它仅选择了这份相关特征列表。\n\
  \n分配给这些特征中的每一个的系数，为我们提供了关于该特征对预测影响的信息。\n\n这非常重要，如下所示：\n\n```python\nprint(\"coef\
  \ values :\")\ndict(zip(list(X_test.iloc[:, lst_coef].columns), rgr.coef_[lst_coef]))\n\
  ```\n\n输出：\n```text\ncoef values :\n{'Close_diff_frac_0.2_4': 0.0017052507726205356,\n\
  \ 'Close_diff_frac_0.25_4': 0.03357515414777998,\n 'Close_diff_frac_0.3_4': 0.013239358125294583,\n\
  \ 'Close_diff_frac_0.35_1': 0.08641385813114096,\n …\n 'CCI': -0.055638867385273676,\n\
  \ 'BBB_20_2.0': 0.06799642558179593,\n 'BBP_20_2.0': 0.34890179044959546,\n 'ATR':\
  \ -0.008401739981565862,\n 'TR': -0.1300218401488396}\n```\n\n应用岭回归方法可得到接近的结果。作为一个很好的练习，您可以使用\
  \ Scikit-Learn API 中的岭回归实现轻松验证这一说法：\n\n```python\nfrom sklearn.linear_model import\
  \ Ridge\n```\n\n使用这种岭回归方法，我们获得了 0.7 的回归分数，虽然不如之前的 LASSO 方法好，但仍然是正确的。\n\n现在，转向核方法，以探究这种非线性方法是否能改进\
  \ LASSO 给出的结果。\n\n## 核方法\n\n核方法允许我们发现线性不可分数据中的模式——即无法画一条直线来分离不同类别的情况。它依赖于一种技巧[¹]，将数据转换到一个更高维的空间，在那里这些类别可以用一个超平面分开。这就像通过一组新的透镜观察数据，揭示了在原始维度中不可见的结构，从而实现准确的分类。\n\
  \n既然已经完成了数据准备和特征工程这些繁重的任务，我们现在可以直接着手优化模型的超参数，以微调其性能：\n\n```python\nfrom sklearn.kernel_ridge\
  \ import KernelRidge\n\n### 超参数搜索空间\nspace = {\n    # 正则化强度使用对数刻度\n    'alpha':\
  \ Real(0.001, 10, prior='log-uniform'), \n    'kernel': Categorical(['linear', 'rbf',\
  \ 'polynomial', 'sigmoid']), \n    # 核系数\n    'gamma': Real(0.001, 10, prior='log-uniform'),\
  \ \n    # 'polynomial' 核的扩展度范围\n    'degree': Integer(2, 10), \n    # 'coef0'，'polynomial'\
  \ 和 'sigmoid' 核的参数\n    'coef0': Real(0, 10, prior='uniform'),\n}\n```\n\n接下来，我们打印优化结果（模型特征、核的选择和系数）：\n\
  \n```python\nprint(\"best params: \")\npprint(opt.best_params_)\n```\n\n输出：\n```text\n\
  best params: \nOrderedDict([('alpha', 1.3324499412363422),\n ('coef0', 10.0),\n\
  \ ('degree', 2),\n ('gamma', 0.0016201598106302523),\n ('kernel', 'polynomial')])\n\
  ```\n\n```python\nbest_model = opt.best_estimator_\naccuracy = best_model.score(X_test,\
  \ y_test)\nprint(f\"score:\", accuracy * 100.0)\n```\n\n输出：\n```text\nscore: 80.30608312013042\n\
  ```\n\n经过超参数优化后，非线性核方法和 LASSO 产生了相似的结果，这表明计算归一化价差从根本上可能是一个线性问题。这意味着特征与目标变量之间的潜在关系可以通过线性模型有效捕捉，而\
  \ LASSO 正是专门为此设计的。\n\n本章的最后一部分探讨在线学习，这是一种专门开发用于将机器学习技术应用于流式数据的方法。这种方法随着新数据的到来增量式地更新模型，使其成为在存储或重新处理大量数据不切实际的情况下的理想选择。\n\
  \n## 在线学习方法\n\n在线机器学习是一种自适应策略，模型以增量方式训练，随着数据可用，按顺序处理单个样本或小批量数据。在数据持续生成、导致无法每次有新信息就从头重新训练模型的环境中，这种方法特别有用。\n\
  \n[¹]: 参考原文脚注 17。\n\n\n\n\n在线学习的效用体现在其能够即时适应数据中的新模式和变化 18，从而在一段时间内保持模型的相关性和准确性。当在整个数据集上训练模型的计算成本过高，或者数据集太大无法放入内存时，它特别有用。\n\
  \n然而，在线学习也带来了自身的挑战集。主要困难在于需要仔细设计算法以防止过拟合，因为模型不断接触新数据，而这些数据可能不代表整体分布。出于类似的原因，在在线学习中最小化异常值的影响至关重要，以防止模型朝错误方向学习。如果管理不当，异常值会不成比例地影响增量学习过程，导致预测偏差。此外，算法必须足够高效，能够在没有显著延迟的情况下实时更新模型。\n\
  \n在线学习确实面临着机器学习中许多最复杂的挑战，从管理非平稳环境和概念漂移到处理异常值，并确保模型随时间推移保持稳健和相关。\n\n在交易领域，在线学习有几个引人注目的应用。例如，在高频交易（HFT）中，模型可以快速适应突然的市场变动。\n\
  \n在实现方面，在线学习有两个值得注意的库：`Scikit-multiflow` 和 `Vowpal Wabbit`：\n\n• `Scikit-multiflow`19\
  \ 为流式学习提供了广泛的工具，允许在流式数据上评估和训练模型。它秉持类似 `Scikit-learn` 的易用性理念，使广大受众都能上手。如果您刚进入这个领域，这是我推荐的工具。\n\
  \n• `Vowpal Wabbit`20 则专为高速（得益于其 C++ 实现）、大规模学习和流式数据而设计。它支持在线学习、特征哈希和核外学习等高级功能，使其适合寻求机器学习解决方案高效率和可扩展性的高级专家。\n\
  \n### 使用 Scikit-multiflow 实现在线回归\n\n我们继续使用 1 分钟频率的印度指数（NIFTY50）数据。这种日内频率不属于 HFT。然而，它足够快，可以考虑在线学习方法。我们在日内数据流上预测价差的值。\n\
  \n首先，安装 `Scikit-multiflow` 并导入所需工具：\n\n```\n!pip install -q scikit-multiflow\n```\n\
  \n```\nfrom skmultiflow.data import DataStream\nfrom skmultiflow.meta import AdaptiveRandomForestRegressor\n\
  from skmultiflow.evaluation import EvaluatePrequential\n```\n\n```\n#### Initialize\
  \ the AdaptiveRandomForestRegressor\nregressor = AdaptiveRandomForestRegressor(n_estimators=20)\n\
  pred_stream = []\n```\n\n我们将迭代处理（`DataStream(data=...)` 函数）数据集以模拟数据流，模拟生产环境中典型的高速数据涌入。这种方法允许我们预测下一个结果，并及时使用最新数据更新（`partial_fit`\
  \ 函数）模型，确保模型尽可能准确：\n\n```\n#### Convert the DataFrame to a DataStream object for\
  \ skmultiflow\nstream = DataStream(data=np.column_stack((X_test, y_test)))\n\n####\
  \ Training the model with the streaming data\nwhile stream.has_more_samples():\n\
  \    # acquire new data\n    X_stream, y_stream = stream.next_sample()\n    y_pred\
  \ = regressor.predict(X_stream)\n    # keep track predictions\n    pred_stream.append(y_pred[0])\n\
  \    # refit model\n    regressor = regressor.partial_fit(X_stream, y_stream)\n\
  ```\n\n```\nfrom sklearn.metrics import mean_squared_error\nmean_squared_error(pred_stream,\
  \ y_test)\n```\n\n```\n1.1329364818706054\n```\n\n该流及其预测结果在下图中表示：\n\n![](img/fig-7-8.png)\n\
  \n该图直观展示了我们的在线回归模型在预测一系列传入数据点的价差值方面的性能。红点代表实际观测到的价差值，而绿线对应模型的实时预测。\n\n我们可以看到，模型有效地捕捉了价差的整体趋势和波动，并随着新数据的到来动态适应。然而，仍存在一些偏差，尤其是在极端值处，这表明潜在的进一步改进领域，例如改进特征选择、超参数调优或替代在线学习方法。\n\
  \n## 结论\n\n在本章结束时，我们获得了将先进机器学习技术应用于算法交易的能力。我们现在可以实现集成方法，如装袋和提升，以提高预测准确性并缓解过拟合。我们还可以应用高级回归技术，如\
