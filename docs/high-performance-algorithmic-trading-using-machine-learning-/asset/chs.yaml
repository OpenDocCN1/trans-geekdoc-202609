  requestResponse = requests.get(url + API_KEY, headers=headers)\nrequestResponse.json()\n\
  ```\n\n以下是预期返回的数据：\n\n\n\n\n### 量化基本面投资模型\n\n我们将要使用的基本面数据集包含一组上市公司的财务报表。这些会计数据由每家公司的股市表现作为补充。我们的目标是尽可能准确地预测基本面数据发布后期间发生的股市表现。\n\
  \n这种分析类型是**量化基本面**方法的一个示例，它将**量化**模型与财务分析师和会计师的**基本面**专业知识相结合。\n\n让我们首先介绍该数据集。该数据集可从\
  \ `https://www.kaggle.com` 下载。这是一个数据科学竞赛网站。该数据集包含通过 FMP API 获取的基本面数据，我们在上一节中详细介绍过。压缩包（zip\
  \ 文件）包含 2014 年至 2018 年的数据。每年的数据包含在不同的数据集中（`2014_Financial_Data.csv`，……，`2018_Financial_Data.csv`）。\n\
  \n我们将处理这些文件中的第一个。它包含 2014 年的数据。随后您可以对对应后续年份的文件进行相同的分析。\n\n该数据集包含数百个财务指标，这些指标见于每家上市公司每年发布的\
  \ 10-K 文件中。这份年度报告全面概述了公司的业务和财务状况，并包含经审计的财务报表。\n\n将 csv 文件下载到计算机后，可以使用以下代码读取数据：\n\
  \n```python\n#### 指定 TICKER 为索引列\ndf = pd.read_csv('2014_Financial_Data.csv', index_col=0)\n\
  ```\n\n以下函数 `df.info()` 为我们提供了数据集的“身份卡”，给出了其大小、数据类型和列标签：\n\n```python\ndf.info()\n\
  ```\n\n```\nIndex: 3808 entries, PG to WTT\nColumns: 224 entries, Revenue to Class\n\
  dtypes: float64(222), int64(1), object(1)\nmemory usage: 6.5+ MB\n```\n\n这意味着共有\
  \ 3808 行和 224 列。在这些列中，有一列是文本列（object 类型），其余数据均为数值列。要了解每列的具体类型，我们使用 `df.dtypes`：\n\
  \n```python\ndf.dtypes\n```\n\n```\nRevenue                    float64\nRevenue\
  \ Growth             float64\nCost of Revenue            float64\nGross Profit \
  \              float64\nR&D Expenses               float64\n...\nR&D Expense Growth\
  \         float64\nSG&A Expenses Growth       float64\nSector                  \
  \   object\n2015 PRICE VAR [%]         float64\nClass                      int64\n\
  Length: 224\n```\n\n最后两列是我们希望使用机器学习模型预测的股市表现数据。\n\n倒数第二列 `PRICE VAR [%]` 代表基本面会计数据发布后，2015\
  \ 年 1 月 1 日至 12 月 31 日期间的股价变动。\n\n`Class` 列是从上一列衍生出的二元指标。该指标的值为 0（负类）或 1（正类），取决于上一列（`PRICE\
  \ VAR [%]`）指示的变动是正还是负。\n\n该列将作为目标供分类算法学习预测，分类算法旨在预测类别或类别。\n\n数据集中的每一行代表一家公司。这些公司按行业（`Sector`\
  \ 列）分组，如下所示：\n\n```python\nprint(df[['Sector','2015 PRICE VAR [%]']])\n```\n\n|\
  \ Symbol | Sector | % Change |\n| :--- | :--- | :--- |\n| PG | Consumer Defensive\
  \ | -9.323276 |\n| VIPS | Consumer Defensive | -25.512193 |\n| KR | Consumer Defensive\
  \ | 33.118297 |\n| RAD | Consumer Defensive | 2.752291 |\n| GIS | Consumer Defensive\
  \ | 12.897715 |\n| ... | ... | ... |\n| TSRI | Technology | 29.362884 |\n| TZOO\
  \ | Technology | -31.167763 |\n| USATP | Technology | -23.558900 |\n| WSTG | Technology\
  \ | 7.779579 |\n| WTT | Technology | -34.099613 |\n\n[3808 rows x 2 columns]\n\n\
  以下是按行业划分的公司分布情况：\n\n```python\ndf['Sector'].value_counts()\n```\n\n```\nFinancial\
  \ Services       660\nHealthcare               582\nTechnology               576\n\
  Industrials              501\nConsumer Cyclical        457\nBasic Materials    \
  \      242\nReal Estate              224\nEnergy                   221\nConsumer\
  \ Defensive       165\nUtilities                97\nCommunication Services   83\n\
  ```\n\n我们现在开始数据准备阶段，步骤如下：\n\n该阶段将涉及以下步骤：\n\n1. 移除异常值\n2. 填补缺失数据\n3. 移除列\n4. 标签编码\n\
  5. 准备目标列\n6. 拆分数据集\n\n让我们首先按如下方式移除异常值：\n\n#### 1. 移除异常值\n\n我们将识别每列的极端值，然后用分位数值（0.95）替换它们。\n\
  \n让我们首先按如下方式计算分位数：\n\n```python\n##### 截断异常值（极高值）\ntop_q = df.quantile(numeric_only=True,\
  \ q=0.95)\ntop_q\n```\n\n```\nRevenue                    2.137668e+10\nRevenue Growth\
  \             8.804800e-01\nCost of Revenue            1.212385e+10\nGross Profit\
  \               8.570324e+09\nR&D Expenses               1.760486e+08\n...\nDebt\
  \ Growth                1.876595e+00\nR&D Expense Growth         7.013900e-01\n\
  SG&A Expenses Growth       9.633700e-01\n2015 PRICE VAR [%]         5.701303e+01\n\
  Class                      1.000000e+00\nName: 0.95, Length: 223, dtype: float64\n\
  ```\n\n其余方法见下面的代码。我们使用缺失数据（类型 `np.nan`：非数字）作为标记来明确识别它们，然后用接受的值替换（`df.fillna`）它们。\n\
  \n```python\n###### 识别异常值 -> 将异常值替换为 Nan -> 将 Nan 替换为 top_q 值\noutliers = df > top_q\n\
  df[outliers] = np.nan\ndf.fillna(top_q, inplace=True)\n```\n\n我们以相同的方式处理极低值：\n\n\
  ```python\n##### 截断异常值（极低值）\ntop_q = df.quantile(numeric_only=True, q=0.05)\n\n\
  ###### 识别异常值 -> 将值替换为 Nan -> 将 Nan 替换为 top_q 值\noutliers = df < top_q\ndf[outliers]\
  \ = np.nan\ndf.fillna(top_q, inplace=True)\n```\n\n\n\n\n\n#### 2. 填补缺失值\n\n在下一步中，对于每一列，我们使用\
  \ `fillna` 函数将缺失值替换为该板块（`groupby`）的中位数（`transform('median')`）。\n\n这是会计师和财务分析师推荐并遵循的方法：\n\
  \n```python\ndf.fillna(df.groupby('Sector').transform('median'), inplace=True)\n\
  ```\n\n#### 3. 删除列\n\n标记为 `2015 PRICE VAR [%]` 的列在事前是未知的。\n\n必须小心避免引入数据泄露。换句话说，即模型运行时不可用的信息。因此，该列绝不能展示给算法，也不能成为模型输入的一部分。我们将该列从模型输入列表中移除，并将其存储以备将来使用：\n\
  \n```python\ny_price_var = df.pop('2015 PRICE VAR [%]')\n```\n\n下一步是标签编码。\n\n####\
  \ 4. 标签编码\n\n标签编码是指将每个字母数字（文本）类别数据值替换为数字代码。换句话说，就是一个数字。原因在于大多数机器学习算法仅接受数字作为输入数据，对于字母数字（文本）数据会产生错误信息。要执行的编码针对\
  \ 'Sector' 列。\n\n以下是该列中发现的值的列表：\n\n```python\nlst_sector = list(np.unique(df['Sector']))\n\
  lst_sector\n```\n\n```\n['Basic Materials',\n 'Communication Services',\n 'Consumer\
  \ Cyclical',\n 'Consumer Defensive',\n 'Energy',\n 'Financial Services',\n 'Healthcare',\n\
  \ 'Industrials',\n 'Real Estate',\n 'Technology',\n 'Utilities']\n```\n\n该列表使用 Scikit-Learn\
  \ 机器学习 API 中的 `LabelEncoder` 对象进行编码，我们在上一章中已使用过它：\n\n```python\nfrom sklearn.preprocessing\
  \ import LabelEncoder\n\nlbl = LabelEncoder()\n\n##### 学习编码\nlbl.fit(lst_sector)\n\
  \n##### 应用该编码（转换）\ndf['Sector'] = lbl.transform(df['Sector'])\n```\n\n编码结果可在以下代码中看到：\n\
  \n```python\ndict(zip(lst_sector, lbl.transform(lst_sector)))\n```\n\n```\n{'Basic\
  \ Materials': 0,\n 'Communication Services': 1,\n 'Consumer Cyclical': 2,\n 'Consumer\
  \ Defensive': 3,\n 'Energy': 4,\n 'Financial Services': 5,\n 'Healthcare': 6,\n\
  \ 'Industrials': 7,\n 'Real Estate': 8,\n 'Technology': 9,\n 'Utilities': 10}\n\
  ```\n\n#### 5. 准备目标列\n\n倒数第二步是准备目标列（`y`），算法将学习从输入映射到该目标。该目标列是收益率的符号（其所属的类别：正或负）：\n\
  \n```python\ny = df.pop('Class')\n```\n\n#### 6. 划分数据\n\n剩下的就是将数据分为两组：学习集和测试集。正如我们在上一章\
  \ 13 中提到的，学习阶段仅使用训练数据（子集 `X_train`）：\n\n```python\nfrom sklearn.model_selection\
  \ import train_test_split\n\nX_train, X_test, y_train, y_test = train_test_split(df,\
  \ y, shuffle=False)\n```\n\n##### 训练阶段\n\n我们选择了随机森林 14，这是一种高性能算法，无需特别的校准工作即可产生准确的预测。该算法的原理是自动构建一组决策树。可以将决策树想象为一系列指导选择的是非问题（最优问卷）。每棵树从数据中学习以对项目进行分类，例如基于会计数据决定是否投资该股票。\n\
  \n以下是从训练集构建的决策树示例：\n\n![](img/fig-2-3.png)\n\n可以看到学习算法构建的最优问题和答案序列。这是第一个问答：“`CapitalExpenditureRatio`\
  \ < -2.318 吗？”。如果为 False，则下一个问题是：`Debt to Asset ratio` < 0.245...\n\n这种自动化专业知识生成了一个经过优化的问卷，能引导得出最准确的答案。\n\
  \n现在，将随机森林设想为这些树的一个群体，一个多样化的决策者群体。它们都以各自独特的方式从数据中学习。当我们需要做决策时，每棵树对答案进行投票。得票最多的结果获胜，确保了平衡且准确的结果。它是一个专家委员会。\n\
  \n机器学习的新颖之处在于，每棵决策树都是在没有任何专家人工干预的情况下被学习、构建和优化的。使用包含每家公司会计和财务信息的训练数据（`X_train`），随机森林算法学会推断其所属的类别（`y_train`）：\n\
  \n```python\nfrom sklearn.ensemble import RandomForestClassifier\n\n###### 定义分类器\n\
  clf = RandomForestClassifier()\n\n###### 在训练数据上拟合分类器\nclf.fit(X_train, y_train)\n\
  ```\n\n学习过程完成后，会计算一个准确率得分 15，即正确预测数量与总预测数量的比率。该得分始终在测试集（`X_test`）上计算。换句话说，即模型训练期间未见过的数据：\n\
  \n```python\nclf.score(X_test, y_test)\n```\n\n```\n0.63\n```\n\n为了根据两个类别（正和负）更精确地了解预测分布，我们计算以下两个指标：`classification_report`\
  \ 和 `confusion_matrix`。\n\nScikit-Learn 中的 `classification_report` 函数用于评估分类模型的性能。\n\
  \n它提供了各类别各项指标的综合摘要，包括：\n\n- **precision**（精确率）：正向预测的准确性\n- **recall**（召回率，或灵敏度）：召回率检查模型是否捕捉到了大多数真正例，避免漏报\n\
  - **F1-score**（F1 分数）：精确率和召回率之间的平衡\n- **Support**（支持度）：每个类别中的样本数量\n\n```python\n\
  from sklearn.metrics import classification_report, confusion_matrix\n```\n\n导入两个指标计算函数后，我们使用训练好的模型（`clf`，作为分类器）为前述整个测试集计算（`clf.predict`）一组预测值（`pred`）：\n\
  \n```python\npred = clf.predict(X_test)\n```\n\n分类报告将把这些预测与收益率的实际值（`y_test`）（正或负类别）进行比较：\n\
  \n```python\nprint(classification_report(y_test, pred))\n```\n\n```\n          \
  \    precision    recall  f1-score   support\n\n           0       0.58      0.84\
  \      0.68       449\n           1       0.76      0.46      0.56       503\n\n\
  \    accuracy                           0.63       952\n```\n\n就解释而言，得分应读作“越高越好”。获得的数值令人鼓舞。指标远高于随机预测（0.5：抛硬币）。\n\
  \n负类别（负收益）的检测精确度低于正类别。事实上，其精确率得分较低（0.58，而正类别为 0.76）。另一方面，有少数负收益被错误检测为正收益。事实上，负类别的召回率得分很高。\n\
  \n正收益被非常精确地检测出来。极少出现假阳性。具体而言，这意味着极少出现亏损的多头交易（预期为正但实际为负）。76% 的正收益被正确预测。\n\n我们通过混淆矩阵（`confusion_matrix`）来佐证这一点。该指标采用上述概念并将其组织在一个称为混淆矩阵的表格中：\n\
  \n```python\n###### tp : true positive , fp : false positive ,tn : true negative\
  \ ,fn : false negative\ntn, fp, fn, tp = confusion_matrix(y_test, pred).ravel()\n\
  \nprint(f\"FALSE PREDICTIONS : {fp} negative returns wrongly detected as positive\
  \ return and {fn} positive returns not detected\")\n```\n\n\n\n\nprint(f\"CORRECT\
  \ PREDICTIONS : {tp} positive returns correctly detected as positive return and\
  \ {tn} negative returns detected\")\n\nFALSE PREDICTIONS : 72 negative returns wrongly\
  \ detected as positive return and 277 positive returns not detected\n\nCORRECT PREDICTIONS\
  \ : 226 positive returns correctly detected as positive return and 377 negative\
  \ returns detected\n\n```\nconfusion_matrix(y_test , pred)\n\narray([[377, 72],\n\
  \       [277, 226]])\n```\n\n### 优化超参数\n\n尽管该算法的性能相当令人满意，但我们将尝试对其进行改进。为此，我们将优化一种称为超参数的特定类型参数。算法参数是在学习阶段优化的。在此阶段不会自动优化的参数称为超参数。超参数是我们在训练前选择的机器学习算法设置。这些超参数调整算法的结构，并影响模型如何从数据中学习。选择好的超参数对模型性能至关重要。\n\
  \n示例包括随机森林中的树的数量。不过，我们将保持其不变。另一方面，我们将优化 Scikit-Learn API 中称为 `max_depth` 的超参数。它代表每个专家知识的深度：\n\
  \n```\nfrom sklearn.model_selection import GridSearchCV , ParameterGrid\n\ngrid\
  \ = {'max_depth' : [None , 5 , 15 , 30],\n        'min_samples_split': [ 5, 10 ,\
  \ 15],\n        'min_samples_leaf': [1, 2, 4]}\n```\n\n这里我们再次使用了 Scikit-Learn API\
  \ 的强大工具。顾名思义，`GridSearchCV` 允许你在给定范围（网格）内进行详尽搜索，以找到最佳可能参数：\n\n```\nclf = GridSearchCV(estimator=\
  \ RandomForestClassifier(),\n                   cv = 2,\n                   param_grid\
  \ = grid,\n                   n_jobs = -1,\n                   scoring = 'f1',\n\
  \                   verbose = 2)\n```\n\n`clf.best_params_` 和 `clf.best_estimator_`\
  \ 包含搜索结果：\n\n```\nclf.best_params_\n{'max_depth': 30, 'min_samples_leaf': 1, 'min_samples_split':\
  \ 10}\n\nclf.best_estimator_\nRandomForestClassifier\n```\n\n剩下的就是对测试数据进行一系列预测，以了解模型在新数据上的表现。\n\
  \n我们买入预测收益为正的股票（多头头寸），并卖出（空头头寸）预测收益为负的股票。\n\n图表显示了对面板中所有股票进行投资（多头头寸）的结果，如下所示：\n\n\
  ![](img/fig-2-4.png)\n\n这项关于会计数据机器学习的详尽研究给了我们一些有希望的结果。这完成了专门针对基本面会计和财务数据机器学习的演示。\n\
  \n另一种作为机器学习算法输入的常见数据形式涉及资产在金融市场上的交易价格（包括开盘价和收盘价），以及最高价和最低价等统计数据。\n\n#### 开高低收价格\
