- "## 每个人的网络安全\n\n\n\n![](img/cover.jpg)\n\n# 前言\n\n网络空间是我们所有人生活中至关重要的一部分。尽管我们都在使用它，但其大部分基础设施和运作机制对我们而言却是不可见的。\n\
  \n这一无处不在的系统起源于美国政府高级研究计划局（ARPA）开发的一个网络，该网络最初旨在连接政府和大学的研究实验室。参与者彼此信任且负责，因此安全性几乎未受到任何重视。\n\
  \n其后果延续至今。这个小型网络如野草般疯狂生长，直到连接起全球数十亿计算设备。在每一个阶段，设计决策的制定都优先考虑“下一个伟大的事物”，而安全性仍然几乎未受到任何重视。\n\
  \n于是我们发现自己身处这样一个环境——网络空间——它对我们许多人而言近乎一项基本服务，却需要付出巨大努力，以防范犯罪活动的负面后果、将网络空间视为廉价武力倍增器的政府行为，以及无聊和粗心大意者的不假思索的行为。\n\
  \n使网络空间更加安全是我们这个时代面临的挑战之一。这不仅（或许甚至主要）不是一项技术挑战。它要求政府和企业在可能的情况下鼓励安全，并确保其自身行为不破坏安全。\n\
  \n遗憾的是，一些有能力推动网络安全改进的人——律师、政治家——并不具备充分理解这些问题的技能。本书旨在通过以非技术背景读者也能理解的方式描述这些问题，来帮助改善这一状况。\n\
  \n这不是一篇研究专著，因此我未收录研究文献的参考文献。对于希望更深入探究特定主题的读者，有大量网站可提供进一步信息。我希望您在此阅读的内容足以让您理解那些更具技术性的阐述。\n\
  \n当今成功的书籍，其标题似乎要么包含三个动词，模仿《吃、祷告、爱》的模式；要么包含“女孩”一词。我想不出符合第二种类型的标题，也觉得“计算、攻击、防御”作为第一种类型的标题并不合适。\n\
  \n# 第一章\n\n# 简介\n\n网络空间——计算机系统、设备及连接它们的网络的组合——无处不在。网络空间最显而易见的部分，也是大多数人接触过的部分，是互联网，但网络空间还有许多其他组成部分：自动化生产线、独立的军事网络，以及技术上属于互联网一部分但普通用户难以访问的暗角。我们作为个体，显性地利用网络空间进行工作、购物和娱乐；但它在不那么显性却更重要的层面上，被用于维持我们社会的运转，涉及制造业、服务业、金融市场和政府。\n\
  \n尽管网络空间无处不在，但即使我们在使用它时，其大多数结构对我们而言也是不可见的。我们通过手机或电脑与它交互，但为网站提供动力、让我们能够管理银行账户、预订行程和酒店、使用电子邮件或社交媒体通信的服务器，并不容易被察觉。连接我们的接口设备与这些服务的“管道”也几乎完全隐藏。从用户角度来看，使这个庞大、复杂的系统如此不显山露水、行云流水，是一项重大成功。\n\
  \n然而，从安全角度来看，网络空间的不可见性造成了一个问题——人们对其运作方式缺乏直觉，因此无法轻易判断哪些行为潜在危险。这有点像游览一个以旅游为主的城市，却因未意识到贫民窟的存在而误入歧途。在网络空间中，很难评估任何特定行为的风险，许多“规则”都缺乏解释，或者至少缺乏有意义的解释，使用户无法理解规则在何种情况下有合理的例外。例如，一条常见规则是“不要打开陌生人的电子邮件附件”，但在实践中这往往行不通。如果你不知道\
  \ `From:` 电子邮件地址可以被伪造，那么看似相反的规则“打开熟人发来的附件没问题”有时会导致不幸的后果。\n\n\n\n\n年轻人在互联网环境中长大，在某些方面对危险更为敏锐，但即使是他们也很容易对风险视而不见，并被那些为私利利用网络空间的人所欺骗。关于网络空间的教育会有所帮助，这也是本书的目的，但一知半解是危险的（亚历山大·蒲柏语）。\n\
  \n网络安全问题可追溯至互联网前身 Arpanet 的早期：这是一个连接政府和大学计算机的网络，并假设所有参与者都是值得信赖且须负责的。因此，安全问题在 Arpanet\
  \ 基础设计中未被严肃对待——许多此类设计沿用至今。根本问题在于向后兼容性：每项新发展都必须继续允许现有计算机、网络和系统协同工作，即使整体系统的规模和范围呈爆炸式增长。Arpanet\
  \ 还被设计为可在核攻击中幸存，因此采用了分布式设计。这种设计延续至今的网络空间。网络空间没有整体管理，决策由利益相关者混乱协作制定。\n\n在许多方面，互联网是其自身成功的受害者。从最初那一小组连接的计算机，它发展到包含更多政府和大学计算机，包括国际上的。20\
  \ 世纪 80 年代初，电话公司介入，允许不同城市计算机间的专用连接，随后允许计算机通过拨号相互连接，并利用原为语音设计的电话线传输数据。\n\n1995 年万维网的引入标志着连接性的又一次转变。个人突然拥有了从企业和政府（包括遥远的）获取信息的“杀手级应用”；而这些企业和政府需要大型计算机向想要的人提供这些\
  \ `web pages`。大致同一时期，此前仅限学术界使用的电子邮件，成为普通人普遍的沟通方式。\n\n浏览器和服务器开发了新功能，服务器不再仅提供内容，还支持与用户交互，包括允许用户上传内容。再一次，为一种用途设计的机制被改造为做其未设计之事，且新用途淹没了旧用途。\n\
  \n在另一维度，变化的是网络空间的 `scale`：数十亿人（超过世界人口一半）获得了参与设备；服务器为响应而变得更大、更快。\n\n网络空间就是这么野蛮生长。没有中央规划；有趣的人想出利用现有基础设施和系统的新方法，在急于创造新事物时大多不考虑所造成的安全问题。结果，网络安全必须在安全从未被设计进去的世界中工作，因此必须尽可能有效地进行改造。不幸的是，安全不是那种可后期添加的属性——要真正有效，必须在设计和实现的每个阶段都考虑它。正如我们将看到的，试图设计对策以解决网络空间许多部分的安全弱点，必然是人为拼凑的，因此相对无效。\n\
  \n这当然是犯罪分子和一些国家政府的福音，他们能利用安全弱点谋取私利。想利用安全弱点者与试图让网络空间更安全者之间存在军备竞赛。改进安全的努力常被偏好便利而非安全的用户破坏。许多行为者虽口头服务于安全，实则偏好大量泄露。许多互联网企业（及一些政府）利用安全弱点收集用户数据，若网络空间更安全则难以收集。例如，许多互联网企业试图以增强认证安全为由收集用户电话号码，其真实动机是掌握电话号码可访问关于他们的另一大批数据。\n\
  \n网络安全改进薄弱且零散的原因之一是缺乏中央治理。网络空间控制分散在：管理某些方面但无实权的国际机构；基础设施所有者（如连接跨国的管道）；提供电话连接且往往拥有大型通信基础设施的（前）电话公司；提供大型服务器（用于网站和计算）的企业，如\
  \ Apple、Amazon 和 Google；以及国家政府。所有利益相关者激励不同，有时差异巨大，发展成为竞争利益拔河的结果。大多会大声宣称安全重要，但这往往仅弱弱转化为行动（甚至无行动），因为其他利益竞争或压倒它。即使有最好的意愿，改造安全也很难，所以整体上缺乏动力不足为奇。\n\
  \n网络空间国际合作困难。在某些方面，它是第一个后威斯特伐利亚……\n\n一些国家试图在网络空间（重）构建国家边界。控制跨越此类边界的流量收效有限，并非不努力。即使流量可控，每国最终仍使用相同硬件、系统、应用……\n\
  \n第 2 章介绍网络空间幕后发生的事，即我们用于浏览网页、发送电子邮件或在网络空间中进行其他操作的接口实际如何工作。第 3 章讨论如何通过加密保护内容，包括传输中（从一地移动到另一地）和静止时（存储在某处时）。第\
  \ 4 章描述构成网络空间的节点的安全问题，包括我们都在用的边缘设备（如手机和个人电脑），以及提供网页和基于网络服务并执行大规模计算的更强大计算机——称为 `servers`。第\
  \ 5 章描述移动数据的管道的安全问题，从跨洲海底电缆到手机与耳机间的蓝牙连接。第 6 章描述设置和管理节点及管道配置的安全问题，使它们能按预期协同工作，即使出错时也是如此。第\
  \ 7 章描述与用户直接交互的高层活动的安全问题。这包括电子邮件和万维网（以下简称 Web）的使用。由于区块链是热门话题且有重大、复杂的安全问题，我们也将讨论。\n\
  \n## 第 2 章：网络空间如何运作\n\n### 2.1 网络空间初体验\n\n几乎每个人都以某种形式熟悉网络空间，但我们用于使用各种在线系统的接口不一定能揭示幕后太多情况。三大最流行接口是网页浏览、社交媒体和电子邮件，大多数人通过手机访问。不过，个人电脑仍用于访问，特别是计算密集型、数据密集型或需要可视化的任务。\n\
  \n\n\n\n#### 网页浏览与网络空间\n\n网页浏览是最直观的。网页内容存储在大型计算机系统上，称为 Web 服务器。每当有人打开浏览器并输入 URL（或点击链接）时，请求就会被发送到相应的服务器，然后网页被发送回浏览器。虽然界面给人一种我们在访问网站的印象，但现实是网站的页面在访问我们。\n\
  \n#### Web 服务器\n\n在 Web 早期，Web 服务器向浏览器提供预构建的网页，随后由浏览器负责在用户使用的任何设备上显示它们。超文本标记语言（HTML）描述了网页每个部分是什么类型的内容（标题、段落），这使得\
  \ Web 浏览器能够以在用户特定设备上产生最佳效果的方式显示页面。例如，浏览器可以将显示的页面适配至可用的屏幕尺寸。\n\n当 Web 服务器获得在请求时动态创建页面的能力后，出现了更多有趣的可能性。现在，特定用户看到的网页可以为该用户定制——也许针对不同国家或地区的用户有所不同。\n\
  \n当用户的浏览器能够向服务器传达个性化信息时，这种能力变得更加强大。其显而易见的用途是搜索——用户输入搜索词，搜索引擎（一种专门的 Web 服务器）返回一个包含与上传搜索词匹配结果的定制页面。用户可以与银行\
  \ Web 服务器通信，并看到一个包含其个人账户余额的页面。\n\n下一阶段发生在浏览器具备下载小段软件（连同页面内容）的能力时。Web 服务器利用这一机制，可以让浏览器代表其执行某些操作。这是网上银行、网上购物以及所有其他双向交互（用户既输入信息又查看内容）的关键。\n\
  \n这些机制也有负面作用——它们可以且确实被用来在浏览器中存储信息（`cookies`），这些信息可以识别同一用户何时再次访问同一 Web 服务器，以及越来越多的其他服务器。换句话说，这个丰富的通信通道成为了追踪用户行为的渠道。\n\
  \n在某些交互中，重点更多在于从用户到网站的信息流，而非相反；例如，上传视频到 YouTube。机制是相同的——服务器下载代码，建立一个从浏览器到服务器的通信通道来控制上传。\n\
  \n社交媒体网站使用这一相同的基本机制，但它们不是使用（通用的）浏览器，而是将交互打包在一个应用程序中，并尽可能让用户下载该应用。对社交媒体网站或企业的优势在于，应用程序可以运行*任意*代码，而非浏览器中运行的受限代码。因此交互可以更丰富。这种更丰富的交互不一定是好事——正是它使得详细收集每个用户（有时甚至包括其系统）的数据成为可能。\n\
  \n许多其他企业也做同样的事：创建一个直接与其 Web 服务器交互的应用程序，而不是让用户使用浏览器访问其网站。该应用程序只不过是其网站的一个专用前端，但它允许同类型的更丰富交互。这主要有利于企业而非用户。此类所有应用程序的风险在于，它们可能实现粗糙，因而存在自身严重的安全弱点，且无法利用大多数现代浏览器内置的安全措施。\n\
  \n#### 通信工具\n\n用户遇到网络空间的另一个主要方式是作为通信工具：电子邮件、即时通讯（多种形式）和视频聊天。其中一些是一用户设备与另一用户设备之间的对称交互，但一些通信应用将所有通信路由通过服务器。第一种选择更难实现但更私密，但大多数工具使用第二种选择。\n\
  \n区分同步通信（消息立即传送到另一端），如视频聊天和即时通讯；以及缓冲或异步通信，即可存储在某个中间位置直到接收者可用（电子邮件），这也很有用。\n\n####\
  \ 业务与基础设施\n\n网络空间还有许多方面对普通用户并不明显。许多企业与其员工保持通信，尤其是那些不在办公室工作的员工。它们还收集数据，通常是实时的，关于其业务活动。例如，交通系统随时跟踪每一列火车或每一架飞机的位置，以及它们性能表现的许多其他细节和何时可能需要维护。为了实现在线酒店预订网站，酒店连锁必须持续准确地记录哪些房间在何时可用。零售店精确跟踪其每家门店售出的商品，以便装载并调度送货卡车，使其恰好在需要时到达，且车上装载的正是所需产品。电网和油气管道必须跟踪其输送系统的全程性能，并能控制远程设备调高或调低、开启或关闭。\n\
  \n企业还利用网络空间相互通信，提供供应链信息或以我们从在线零售商购物的相同方式相互采购。与消费者网购不同，这些交互通常是自动化的。例如，汽车装配线基于所有组件从供应商的准时制交付，以便零件在需要时刚好到达装配线。这降低了仓储所需的成本和空间。\n\
  \n#### 政府用途\n\n政府面向公民地使用网络空间，在线提供服务，如更新驾照、征收税款等。\n\n政府还将网络空间作为权力工具使用。几乎所有通信都在网络空间中传输，因此大量情报收集已从无线电拦截转移到网络空间拦截。政府还将网络空间作为武器系统，规划（有时实施）针对其他国家的网络攻击。\n\
  \n#### 犯罪活动\n\n罪犯利用网络空间，既作为收集信息的方式，也作为实施犯罪的手段。直到最近，除了直接攻击金融机构和金融转账外，很难直接在网络空间赚钱，但\
  \ `cryptocurrencies`（加密货币）的兴起使得从个人和企业勒索钱财成为可能，且无法追踪，这在网络空间中创造了一类新的犯罪。\n\n#### 总结\n\
  \n因此，普通人看到的网络空间部分只是冰山一角。组织之间以及网络空间内部存在大量其他通信和交互。整个系统过于复杂，无法直接由人工管理，因此幕后还有一层自我管理，确保即使用户采取的行动发生变化，连接仍能保持运行。\n\
  \n个人在网络空间面临安全问题，但在网络空间其他不太可见的部分也存在许多其他漏洞。\n\n### 2.2 什么是网络空间？\n\n网络空间是世界上所有连接的数字基础设施的总和。最明显的部分是互联网，以及其中的万维网。但也存在各种其他网络，主要是军事网络，它们未显式连接到互联网，还有所有连接到互联网但未被人类显式使用、且我们往往会忽略的设备。\n\
  \n网络空间可被视为由三种不同类型的实体组成：\n\n\n\n\n#### 节点\n\n节点是通过网络相互连接的对象，它们执行计算、存储数据、与人类交互以及与物理世界交互。\n\
  \n最明显的节点类型是计算机，范围从大型强大的服务器到个人计算机。但还有其他更常见的节点类型。例如，大多数人使用手机与网络空间交互，手机只是一种专用计算机。越来越多的还有**物联网设备**，这些节点通常不直接与人类交互，但具有实用功能：视频摄像头、灯光开关、恒温器、运动探测器和医疗设备。不太明显的是**网络物理系统**，例如现代生产线中使用的机器人和机械，以及控制管道和电网的设备。\n\
  \n之所以存在这系列设备——它们都包含计算能力并连接到网络——是因为从通用计算设备入手并对其进行编程以特定方式运行，几乎总是比直接构建专用设备来实现该功能更容易。结果是，网络空间几乎已成为一种单一文化，因为只有少数计算机制造商、操作系统提供商（`Windows`、`Mac`、`Linux`）、手机系统（`Android`、`iOS`）和网络交换机提供商（`Ericcson`、`Cisco`、`Huawei`）。\n\
  \n这引入了与任何单一文化相关的漏洞：针对特定类型系统的攻击可以同时对许多目标取得成功。攻击者可以迅速扩大攻击规模并造成严重破坏。他们还可以对特定类型的所有节点尝试撒网式攻击，指望至少能攻破一些目标。\n\
  \n#### 管道\n\n管道是将节点相互连接的连接器。它们传输多种形式的数据：电子邮件、网页请求、网页内容本身、数字编码的语音、视频、音频、软件、许多其他类型的数据传输，以及管理管道网络本身的控制消息。\n\
  \n管道可以硬连线以在两个固定端点之间移动数据。例如，海底电缆连接大陆并能承载海量数据；大容量网络在国家内部移动数据，光纤和同轴电缆将数据传入和传出企业、住宅和公寓楼。\n\
  \n其他管道无线传输数据。这些包括将手机与本地基站连接的蜂窝网络、几百平方米范围内的 Wi-Fi、蓝牙及连接约两米短距离的类似系统，以及用于 RFID 标签和近场设备的厘米级超短距离无线连接。\n\
  \n#### 管理基础设施\n\n管理基础设施管理节点和管道的组织方式，以便数据能找到通往其预期目的地的路径，并确保资源按照商定的规则共享。节点和管道都会随着用户移动、系统故障或更换而加入或离开网络，因此该基础设施还必须应对动态情况。网络空间的规模决定了其中大部分管理必须实现自动化。\n\
  \n#### 网络空间中的人\n\n从某种意义上说，人也可以被视为网络空间的一部分，原因有二。首先，网络空间中流动的大量数据之所以移动，是因为它们要发往特定的个人。因此，网络空间必须有方法发现每个人在何处以及如何连接到网络——人必须拥有从网络空间内部向外看讲得通的地址或接入点。\n\
  \n其次，个人在网络空间中行动，我们通常希望他们对这些行为负责。这是一个艰难的权衡：我们有时希望能像在现实世界中那样匿名行动，但所有国家已有机制在匿名性助长犯罪时加以限制，类似的机制也需要迁移到网络空间。大型在线企业渴望收集关于每个人的大量数据以建立模型，从而（据称）改进定制广告投放，这使情况变得模糊不清。结果是，个人在网络空间行动时对被识别持警惕态度，因为他们不信任政府或跨国企业不会滥用通过观察已知个人及其行为而获得的信息。\n\
  \n### 2.3 节点\n\n由于网络空间包含数十亿个节点，必须有方法识别哪个是哪个。这个问题比看起来更复杂，因为同一个物理对象（比如一部手机）可能随时间出现在多个地方，有时甚至同时出现在多个地方。例如，无论你何时移动（有时甚至只是乘电梯上楼），你的手机都会连接到不同的基站以维持与蜂窝网络的连接。\n\
  \n识别设备依赖于每个设备拥有唯一标识符。对于手机，有一个唯一号码，即**IMEI**（国际移动设备识别码），它与手机硬件绑定。蜂窝网络可以在手机连接网络时检查\
  \ `IMEI`，从而绝对确定是哪部手机。\n\n其他手机标识符与其**SIM 卡**相关联。SIM 卡是物理手机与为该手机提供服务的运营商之间的关联。它们可以在大多数手机中插拔更换，因此它们不标识手机本身，但对于想要接听电话的用户来说，它们更接近于用户的标识符。与\
  \ SIM 卡关联的第一个标识符是**国际移动用户识别码（IMSI）**，它包含国家、运营商和关联个人的详细信息（如果明确售予实名登记的个人，某些国家要求如此）。例如，`IMSI`\
  \ 用于确定手机是否在另一家公司的网络上拥有漫游权限。\n\n与手机 SIM 卡关联的第二个标识符是电话号码。加上国家和地区代码，每个号码在全球范围内都是唯一的。这是将来电连接到被叫特定手机的主要方式。\n\
  \n蜂窝网络必须跟踪连接到其基站的所有手机的这些标识符，以便将来电发送到正确的位置并正确计费。\n\n与手机系统并行的是规模大得多的互联网，它连接计算机（各种大小和复杂度）以及使用\
  \ Wi-Fi 连接功能的手机。每个设备由一个称为 **MAC**（介质访问控制）地址的唯一地址标识，它是六组十六进制数对。\n\n虽然 MAC 地址描述了每个物理设备是什么，但用另一个执行相同工作的设备替换它通常很方便，有时甚至必要，且要求无缝切换。因此，为了在纯物理层面之上提供一个抽象层级，所有联网设备都被分配\
  \ **IP 地址**。在最初的版本（称为 `IPv4`）中，这些是 32 位地址，写作四组 0 到 255 之间的数字（每组基于地址的 8 位），例如 `64.233.160.1`。然而，由于连接到互联网的设备数量庞大，新版本\
  \ `IPv6` 于 2000 年代中期推出。它使用 128 位，地址写作 8 组十六进制数字。\n\nIP 地址是分层的。例如，在 `IPv4` 中，第一组数字指定互联网的一个高层区域（通常由单一大型企业或互联网服务提供商拥有），下一组指定子区域，再下一组指定更小的区域，最后一组指定一组本地计算机的地址。因此，知道\
  \ IP 地址提供了一种自然的分层方式来查找拥有该地址的特定设备。\n\n\n\n### 2.4 人员\n\n虽然人员严格来说不属于网络空间的一部分，但他们扮演着重要角色。特别是，当他们在网络空间中行动时，必须以某种形式被识别。\n\
  \n对于网络空间中的经济交易，必须有支付交易的方式，因此此类场景对识别具体涉及哪个人有最严格的要求。这通常通过将信用卡与在线身份或账户关联来完成。因为信用卡公司已经验证发卡对象，这将特定的现实世界中的人与每个在线账户联系起来。\n\
  \n信用卡在线使用的增加催生了新机制，以验证花钱的人是否有权这样做。在物理世界中，持有信用卡和 PIN 码可验证这种权利。在网络空间中，信用卡号容易泄露，且无法直接对照卡片核对\
  \ PIN 码。\n\n电话号码也已成为个人标识符，而非物理位置标识符。电话号码与特定个人关联的程度因国家而异，取决于在不提供政府身份证明的情况下购买 SIM\
  \ 卡有多容易。电话号码显然可作为寻找特定个人进行短信/消息联系的方式。\n\n电子邮件地址也被用作标识符，而不仅仅是接收信息的方式。许多网站在注册过程中要求提供电子邮件地址，然后通过向该账户发送包含注册最后步骤的邮件来显式验证。一次性电子邮件地址可供那些想注册又不透露个人详细信息的人使用，但一些网站会检查此类邮件的主机并拒绝它们，因此这方面存在一点“军备竞赛”。\n\
  \n最后，一些在线网站使用 handle（自由选择的名称）作为标识符，而不是电子邮件地址。虽然这些名称是自由选择的，但它们往往包含或暗示个人信息，甚至身份。\n\
  \n我们都在网络空间中拥有身份，通常是多重身份，因此从网络空间内部的视角看，我们只是另一种边缘设备。\n\n### 2.5 管道\n\n互联网上的设备通过管道连接，使数据能够四处移动。这些管道从跨洲际移动大量数据的巨型管道，到手机与一组无线耳机之间的连接，范围广泛。\n\
  \n正如我们从 IP 命名方案中看到的，互联网是分层组织的。要从互联网的一个部分到达另一个部分需要管道，还需要交换机来接收传入流量并将其向更接近目的地的方向转发。换句话说，如果互联网上的设备像建筑物，那么连接它们的结构就像道路和十字路口的网络。实际上，它更像火车站和调车场的网络，因为数据可以在交换机处暂存，等待容量将其发送出去。\n\
  \n互联网的顶层由可一次性移动大量数据的宽管道和大容量交换机组成，这些交换机能接收每个传入数据片段，决定其应遵循哪条传出连接以更接近目的地，并将其放置在该传出连接上。\n\
  \n高层交换机相互连接，但也必须有从这些交换机到低层交换机的连接，从低层交换机进一步向下连接，以此类推直到本地层级。换句话说，任何规模的区域交换机必须连接该区域内的所有节点，同时也要有连接（可能是多个）到更高层级的交换机。\n\
  \n设备可以扮演双重角色。例如，你的手机在接收发给你的邮件时充当边缘设备，但在从互联网向耳机流式传输音乐时充当交换机（此时耳机成为边缘设备）。\n\n### 2.6\
  \ 配置\n\n节点和管道是网络空间的基本物理结构，但实际使用它们来移动和存储数据需要一些额外的结构：使其工作的规则，以及允许节点和管道加入和离开的机制。\n\n\
  网络中的每条路径必须在其两端之间传输数据。为此，两端的节点必须理解并使用协议。这些协议对应于道路规则，其中边对应道路和高速公路。\n\n关于流量将如何在每条边上移动的协议称为*protocols*。与高速公路上个体驾驶员可根据路况做出理性决策不同，管道中的流量只是数据，因此所有管理必须由两端的节点完成。一旦流量进入管道，它将在可预测的时间后到达另一端（如果管道被挖掘机切断，则可能无法到达）。\n\
  \n特定数据传输的目标节点不太可能直接连接到源节点。节点和交换机（统称）必须能够通过一系列边从起点将流量路由到目的地。任何交换机都必须能够接收传入流量，并确定应使用哪条传出管道将该流量移至更接近目的地的位置。为此，它维护一个*routing\
  \ table*，其中包含将目的地映射到适当传出边的条目。这有点像开车问路，被告知“向右转行驶 10 英里，然后再问一次”。\n\n由于 IP 地址的层级结构，路由表不必为每个可能的目的地都有条目。对于远程目的地，只需知道将以特定前缀（如\
  \ `173.`）开头的 IP 地址发向哪个方向即可。路由表将包含物理位置较近的 IP 地址的更多细节，以及直接连接到它的设备的完整地址。\n\n发送节点还必须意识到，管道另一端的接收节点可能并不总有足够的容量来存储和处理传入流量。必须有商定数据发送速率的方式。有时这是通过预先协议约定发送多少流量以及多快来完成。有时是通过让接收方确认已收到发送方的每个数据块，从而隐式地允许发送方发送下一个数据块。当然，这意味着边上存在额外流量，这些流量用于控制网络本身的运行。\n\
  \n\n\n正如现实世界的高速公路一样，必须有机制来处理边缘故障，以便流量能够绕过故障点进行路由。因此，路由表必须不断更新以反映不断变化的网络拓扑，这也需要控制消息。\n\
  \n流量的变异性也意味着整个区域可能变得拥塞，因此可能需要将流量绕过整个区域以避免拥塞。正如现实世界中那样，这可能会造成一种动态局势，导致不稳定发生——将流量引导至拥塞区域周围会产生新的拥塞区域，而原来的区域则变得不那么拥塞。随后这一过程会反向进行。拥塞控制机制可能被颠覆（现实世界中也是如此），以制造人为拥塞，或将流量引向特定地点以便对手进行分析。\n\
  \n特定节点或节点集可能希望阻止来自世界某些部分的流量，或阻止特定类型的流量，因此网络中也包含称为 `firewalls`（防火墙）的网关。例如，这些网关可以封锁整个国家，即所谓的“中国防火墙”，但它们更常用于仅阻止特定类型的流量进入企业或政府的子网络。换句话说，它们充当流量过滤器，允许某些流量通过而丢弃其他流量。\n\
  \n个人也会在手机或个人电脑上使用一种网关。这些被称为 `malware detection systems`（恶意软件检测系统）或 `antivirus systems`（杀毒系统），用于阻止特定类型的流量进入。\n\
  \n除了维持流量流动且方向正确的控制功能外，网络管理的另一个方面是将人类可读的地址（如 `cnn.com`）映射为 IP 地址，以便访问。实现这一机制的是 `Domain\
  \ Name Service`（DNS，域名服务）。它由一组维护两种名称之间映射关系的特殊系统组成。\n\n互联网是目前地球上规模最大的网络，连接着所有国家的设备。然而，还有其他网络（至少在理论上）未连接到互联网。大多数军队拥有自己独立、更安全的网络，这些网络与互联网没有直接连接。尽管这些网络在物理上是隔离的，但它们使用与互联网相同类型的节点、管道和控制机制，因为否则做法既不切实际又成本高昂。这使得它们一旦被攻击者访问，就会面临与普通互联网相同的许多攻击——单一文化问题再次显现。\n\
  \n网络之间的隔离可能是虚幻的，有时可以跨越它们之间的“气隙”。例如，用于破坏伊朗铀离心机的 Stuxnet 恶意软件，是通过从互联网加载的 USB 密钥引入的，随后这些密钥被插入控制离心机的隔离网络计算机中。这是这些隔离网络的常见弱点——必须有机制更新其中节点上的软件，而这创造了一个桥接通道。\n\
  \n每当互联网上的设备与这些隔离网络上的设备彼此靠近时，它们还可能利用人耳听不到的高频音频进行通信，或利用一台设备的摄像头拍摄另一台设备的屏幕图像。\n\n###\
  \ 2.7 流量类型\n\n使互联网成为可能的关键发展是 `packet switching`（分组交换）的概念。发明分组交换的原因，正如银行等机构不再使用多队列，转而采用单一大队列配合多服务窗口一样。如果数据传输是先传完第一整批数据，再传第二批，依此类推，小批量数据将不得不等待，潜在时间很长，直到大批量数据传输完成。想象一下一条短信卡在电影下载后面的情景。\n\
  \n相反，发送到网络连接上的每一批数据都被分割成相当小的片段，每个片段独立发送。这意味着小数据传输不会卡在大数据传输后面，因为无论片段来自哪一批数据，它们以大致相同的速率向目的地推进。小数据批次会比大批次更早传完所有片段，但将所有数据都分割开能公平地利用管道容量。（正如我们将看到的，这种技术在分割和重组数据块时引入了开销，这本身也带来了问题。）\n\
  \n虽然分组交换是平等的，但也意味着某些类型的数据得不到良好服务。例如，如果数据传输是实时观看的大型视频（而非单纯下载），关键在于新帧必须以足够快的速率出现以供观看。此类流量面临着持续不断的截止日期要求，其他干扰这些截止日期的流量会产生直接、可观察的性能影响。\n\
  \n语音通常通过转换为数据（称为 `Voice Over IP`，即 VOIP）在网络上传输，这也有相同的问题。如果下一段语音数据未能及时到达以便按适当速度播放，音频质量会听起来断断续续，体验不佳。作为人类，我们能察觉毫秒级的延迟，即使无法有意识地感知。\n\
  \n为了处理这些特殊流量，仅使用移动数据包的机制，需要额外的协议层。这增加了管道操作的复杂性，管道必须对紧急流量特殊对待；节点也必须确保有足够的空闲缓冲容量以维持其流动。\n\
  \n### 2.8 深网\n\n互联网中有部分内容并非对所有人常规可访问。我们已提到过那些（至少在理论上）未连接到互联网的网络。\n\n另一个对普通用户不太可访问的网络空间部分称为\
  \ `deep web`（深网）。它包含未被搜索引擎索引的节点和内容，因此大多不可见，因为无法直接找到它们。\n\n深网包含两类不同的内容。第一类是隐藏内容，指不能通过简单访问包含它的网页来获取。当你登录网站时，你获得了访问该站点数据存储中内容的权限，这些内容通常是个性化的。例如，登录银行网站时，你可以看到账户余额。此类内容他人不可见，也无法被搜索引擎索引，因为它仅在你个人查看时才存在。\n\
  \n深网的第二部分由没有公共访问路径的节点组成。搜索引擎查找万维网所有页面的方式是从显而易见的地方开始，然后顺着链接发现新地方。如果一个网站建立后没有任何链接指向它，就无法通过常规方式发现。但该网站仍可通过将地址分享给可信赖的朋友来发挥作用。（这是\
  \ `security by obscurity`（隐匿性安全）的一个例子，因为它依赖于包含地址的邮件不被邮件提供商扫描，从而提取地址并搜索。）\n\n###\
  \ 2.9 暗网\n\n`dark web`（暗网）是深网的子集，包含试图隐藏自身的节点，通常因为它们用于非法或违法活动\n\n\n\n与通过不与万维网其余部分建立显式连接来隐藏自身的深网站点不同，暗网站点需要特殊机制才能到达其节点。这些可能是完全不同的通信方式，因此所用的应用程序必须从头构建。暗网中其他更流行的部分看起来像万维网，其地址看起来有点像传统的\
  \ URL，但必须以不同的方式访问。\n\n即使你知道暗网站点的地址，也无法通过浏览器直接访问。暗网最常见的部分基于 `Tor 匿名路由器`。该路由器接受连接请求，目标是地址看起来像\
  \ URL 但以“.onion”结尾的暗网站点。然后，它利用志愿者计算机组成的网络，将流量随机路由通过中间站点，以切断你与你正在连接的网站之间的联系。最后，基于\
  \ Tor 的暗网站点只接受来自 Tor 网络节点的连接。因此，在你和暗网站点之间是 Tor 路由器，它将你的行为（可能被监视你节点的人看到）与你正在访问的目标网站解耦。监视\
  \ Tor 网络的另一端可以发现有人正在访问某个特定的暗网站点，但无法判断\n\n此类暗网站点出售毒品、武器、网络攻击、被盗信用卡及信用卡号等产品，并被用于人口贩卖。它们也被用于更良性的目的，例如允许抗议运动进行通信和策划，甚至还有传统网站的暗网版本，供那些不想让其在线活动被追踪的人使用。\n\
  \n暗网还有另一部分（更暗的网络）使用自己的协议进行通信。这当然要求两端都使用专用软件（暗网浏览器和暗网 Web 服务器）才能理解通信的内容。\n\n### 2.10\
  \ 万维网\n\n对许多人来说，万维网*就是*互联网。这是因为 Web 浏览器能做网络空间中普通人所做的许多事情，且都在单一环境中完成。这一理念在 Chromebook\
  \ 中得到了明确体现，Chromebook 是一种仅具有 Web 浏览器界面来连接互联网的笔记本电脑。我们将在第 7 章回到 Web 话题。\n\n### 2.11\
  \ 社会层面\n\n尽管网络空间是一项技术产物，但它存在于我们的社会互动之中，并在许多方面赋能了这些互动，这必然影响了其运作和使用方式。\n\n互联网的原始基础是阿帕网，由美国政府开发，旨在促进研究并连接一小组大学和研究实验室。尽管这极不合适，但阿帕网的许多设计因互联网的增量式发展而保留了下来。曾有过几轮研究项目旨在从头设计一个新的互联网，但它们都撞上了现有系统的沉没成本这一障碍。\n\
  \n特别是，阿帕网连接的是可信站点，因此很少关注使其安全。网络安全不得不完全通过后期加装来实现。\n\nIP 地址（和域名）的分配由国际联盟管理，因此你不能直接将一台计算机连接到互联网。对于普通公民，他们的\
  \ IP 地址由其互联网服务提供商（ISP）管理，后者可能为每个用户分配一个固定 IP 地址（实际上是其连接到 ISP 内部网络的接入点），或者每次计算机连接时动态生成一个。（这进一步变得复杂，因为家用调制解调器或路由器可能向外部世界呈现单个\
  \ IP 地址，但为家庭中的每台计算机和手机生成本地 IP 地址。）\n\n然而，这一分配过程虽然有一定结构，但并不提供 IP 地址与现实世界位置之间的简单映射。例如，一个大型组织可能被分配一大段\
  \ IP 地址，比如 `100.200.*.*`，并可能将这些分配给许多不同地方的计算机。当然，如果 ISP 动态分配 IP 地址，IP 地址与街道地址之间就没有必然关系。\n\
  \n因此，网络的结构相当混乱，除了最基本的意义外，几乎没有所谓的“管理”。如果出了问题，没人可投诉。进步是通过超国家机构、国家政府以及大型 ISP 和跨国企业等大玩家之间的协作取得的。没有网络空间警察部队来强制执行即使是最基本的安全行为。\n\
  \n然而，给互联网带来不安全性的最大社会力量是便利性几乎总是胜过安全性。这仍然是一股强大的力量。在一个又一个场景中，当个人、企业和政府必须在这两个属性之间权衡时，便利性获胜。因此，虽然互联网起步时安全性很低，但后续发展本可以引入安全性，却因性能、成本、缺乏想象力以及在截止日期前产出结果的需要而未能做到。随着网络空间规模扩大并变得更加普及，我们现在看到的大多数网络安全问题将变得影响更大，毫无疑问还有我们尚未意识到的新问题。\n\
  \n导致网络空间安全问题的另一个问题是，发生的许多事情既隐藏在视野之外又不符合直觉。这部分归功于互联网的成功；人们可以使用 Web 浏览器访问世界的信息，而无需真正了解幕后发生了什么来提供这种体验。将此与火车、车站和轨道等交通系统对比。我们可能不太了解信号系统或机车如何工作，但至少我们对车厢如何组成列车、列车如何必须等待绿灯、以及从一地到另一地可能需要多长时间有一些直觉。没有这种直觉，普通人很难就如何行动做出明智决定。\n\
  \n大部分网络空间是自我管理的，即普通数据流量在无人干预的情况下从一处移动到另一处。确实，许多发生的事情太复杂，无法直接管理。然而，必须有人类控制网络空间某些方面的地方，尽管是在高度抽象的层面，普通网络空间用户通过决定去这里或那里、做这件事或那件事，也在一定意义上“控制”着它。\n\
  \n人类与网络空间之间的这种接口创造了一种新的漏洞，统称为 `社会工程学`。社会工程学指的是通过操纵人类在与网络空间互动时的行为，来操纵网络空间的所有方式。这可能从社交媒体企业利用粘性和标题党制造流量的方式\n\
  \n### 2.12 治理\n\n正如我们所见，互联网拥有一种松散的治理结构，因其起源而略带以美国为中心色彩。大部分基础设施由大型互联网服务提供商（ISP）或电信公司拥有和管理。保持与互联网所有其他部分一致的必要性约束了任何特定的基础设施所有者。对网络空间进行任何改进的最大问题之一是利益相关者的数量庞大，且他们对问题的理解千差万别。\n\
  \n\n\n\n#### 网络中立性\n\n网络中立性是指传输数据的组织，即提供“管道”的一方，不向特定的其他组织提供优惠服务这一原则。最近，这一原则受到了冲击，例如，流媒体娱乐服务希望获得更有力的保证，确保其多少数据能以多快的速度传输。\n\
  \n#### 互联网结构与国家边界\n\n互联网全球化且略带无政府主义的结构，与威斯特伐利亚体系下的国际法律原则不太契合。这导致各国政府试图将互联网划分为其可控的国家级子网。\n\
  \n其中最著名的是所谓的“中国防火长城”。中国政府通过过滤设备中体现的规则与庞大的人工监管团队相结合的方式，控制进出中国（以及中国境内）的流量。然而，即使是这种资源充足且严厉的手段也存在漏洞，因为有必要为游客，尤其是国际商务人士提供访问其本国节点的权限，以便他们在中国期间使用。因此，中国的许多国际酒店以普通方式连接互联网。此类漏洞使得各种规避防火长城的变通方法成为可能。\n\
  \n其他国家，特别是俄罗斯，曾尝试将其国家互联网段与世界其他部分切断。这将需要在短时间内开启中国所使用的同类过滤机制，甚至可能完全切断连接。此类想法的难点在于，不实际尝试很难确保所有“门”都已关上。虽然进行过短期测试，但经济影响使得全面测试难以实施。\n\
  \n根本问题在于互联网结构跨越国界，因此一个国家使用的网站不一定位于该国，甚至不在同一大陆。\n\n##### 数据存储与隐私\n\n互联网结构与国家边界引发问题的另一个领域是数据存储位置。数据保护和隐私规则因国家而异，因此数据能否被执法或情报机构访问，取决于其存储地点。出于隐私担忧，各国越来越多地立法规定本国公民数据的存放位置。\n\
  \n### 2.13 安全问题\n\n正如我们在第 1 章中讨论的，网络空间中的大多数安全问题源于安全在其底层系统设计中几乎从未被考虑。然而，即使安全曾是设计的一部分，在一个复杂、分布式、增量式、跨越全球的系统设计中，仍存在许多棘手问题。\n\
  \n思考网络空间安全的典型起点源于中世纪城堡的设计。城堡由城墙界定，旨在阻挡攻击者，且常呈环状排列，以便攻破一重城墙不意味着整座城堡沦陷。将此作为安全模型的问题在于城堡必然有城门。历史上，绝大多数城堡是通过城门被攻破的，往往是内应打开城门，而非靠冲垮城墙。网络空间亦是如此：安全机制往往类似于建造更厚更高的墙，却未充分重视数据必须进出区域和系统这一事实，而这些交互发生的地方往往防守薄弱。当然，无论在网络空间还是现实世界，城墙都比城门更显眼、更气派。\n\
  \n在网络空间设计和构建的大多数环节中，安全未被纳入考量。遗憾的是，事后加装安全极其困难。主要困难源于向后兼容性的需求——即使系统某部分升级得更安全，所有系统必须继续运行，且没有至高权威能强制在所有地方安装改进的新组件。网络空间有许多部分正在使用缺陷广为人知的计算机和软件，却因成本、无知或惰性未更新或替换。有时，这种新旧安全机制混杂的异质性会引入新漏洞，导致安全工作往往看似“前进两步，后退一步（甚至两步）”。\n\
  \n一些主要参与者正承担起强制更新系统以提高安全性的责任。例如，`Microsoft` 使得不自动安装 `Windows` 更新变得更难；`Google` 和\
  \ `Mozilla` 均在后台更新其浏览器；手机制造商强制推送系统更新；`Amazon` 更新 `Kindle`，所有这些基本无需用户操作。\n\n强制更新看似天然利好，实则是一把双刃剑。为解决安全问题的更新往往会破坏运行中系统的其他部分，这对依赖持续可用性的企业可能是灾难性的。因此，组织倾向于阻止自动更新；结果是，尽管已有修复补丁，已知安全漏洞往往仍存在于关键系统中，成为可乘之机。\n\
  \n一个更根本的问题是攻防之间的不对称性。网络空间任何部分必须成功防御*所有*可能的攻击。攻击者只需找到一种有效的攻击手段。这迫使防御者投入资源用于防御，其中大多基于假设性威胁，难以说服资源提供方买单。攻击者的动机层级也可能更高。组织的安全人员是为薪水工作；攻击者往往有更个人化或直接的目的。\n\
  \n另一个显著问题是网络空间利益相关者倾向于搞*安全表演*。这是指组织强加的安全流程看似增强了安全，实则对提升安全毫无裨益或作用极小。这通常意味着推行针对低风险但高可见度漏洞的流程，而忽视低可见度但风险更大的隐患。常见例子是要求定期更改密码，尽管有大量证据表明这弊大于利（人们通过循环遍历规定次数将密码改回原样，或将密码写下来）。\n\
  \n### 2.14 网络空间的非善意使用\n\n网络安全旨在防止网络空间被用于正常用途以外的目的。这范围从无聊者的破坏行为、牟利犯罪，到国家将其作为国际政策杠杆。某些用途虽非技术层面的犯罪，但具有社会破坏性。\n\
  \n对犯罪分子而言，安全漏洞为其犯罪创造了新途径，主要是牟利类犯罪（而非暴力犯罪）。其中一些是在线版传统犯罪，例如从银行账户窃取资金而非抢劫。此类线上线下犯罪的区别在于规模——窃取\
  \ 100 元与 100,000 元付出的努力相同——以及时机——转账可在几毫秒内完成。\n\n线上犯罪也往往更隐蔽。抢劫受害者知晓事发，但扒手受害者一时不知。线上犯罪更像扒手，但我们不习惯像看管钱包那样追踪在线资源。因在线信息和知识是数字化的，窃取它们意味着复制副本，因此可能毫无明显迹象表明发生了窃取。\n\
  \n\n\n\n电子邮件和其他形式消息传递的覆盖范围，也使得寻找轻信者所需的成本比现实世界中低得多。事实上，网络犯罪诈骗往往会故意让自己看起来比实际情况更不可信，因为这能确保只有真正轻信的人才会上当受骗。各种类型的骗术（如尼日利亚王子诈骗）在网络空间蓬勃发展，并持续为其制造者带来利润。\n\
  \n网络空间还催生了依赖其新能力的新型犯罪。一个典型例子是基于勒索软件的敲诈。勒索软件攻击会加密系统上的文件，并要求系统所有者付款以解密文件。\n\n网络空间的存在还因其提供的相互通信能力而改变了犯罪格局。罪犯可以找到具有特定技能的其他罪犯进行合作。罪犯也可以在线学习新技能。用于实施犯罪的产品可以在网上更容易地购买，而不像在物理世界那样困难。在线购物可以提供开锁工具等在现实世界中非法持有、因此难以买卖的工具。罪犯还可以购买软件工具（“即插即用型网络攻击工具包”），利用它们在网络空间实施犯罪。\n\
  \n网络空间也已成为国家力量角逐的竞技场。以一种被动形式来看，它是一个情报收集平台，因为几乎所有数据都在网络空间内传输，而非通过无线电。所有政府都利用这一点监视其他国家，许多政府也利用它监视本国公民（当他们在国外时，通常在国内也是如此）。网络空间也可以被武器化，使一国能通过瘫痪目标国的在线活动来攻击另一国，鉴于我们对在线活动的高度依赖，这可能产生巨大影响；或者利用网络空间对物理系统发动攻击（这些系统几乎总是由计算机控制）。\n\
  \n国家还通过其他国家的本国公民对这些国家实施低强度干扰，利用虚假信息通过改变态度或试图左右选举来使其动荡不安。\n\n企业利用网络空间的两种方式至少是有问题的。首先，依赖抓取注意力（例如投放广告）的社交媒体企业开发了使其界面更具吸引力的方法，以便用户更频繁、更长时间地与其互动。这产生了不幸的副作用，即因暴露于为保持兴趣而推送的负面内容，以及被抓取的时间和注意力挤占了生活的其他方面，从而对人们造成心理伤害。\n\
  \n其次，网络空间使得收集所有人活动的大量详细描述成为可能。这些数据被广泛分发给利用它们建立个人画像的企业。通常，这种建模表面上旨在投放更好的广告，但数据永远不会消失，因此可以且必然会被用于不那么光鲜的目的。\n\
  \n网络空间中的一些负面活动是正常流程的腐败变质，但也有一些需要滥用网络空间。对于犯罪行为，可以采取法律补救措施，但这些措施受困于法律法规的国家属性与网络空间跨国属性之间的错位。罪犯几乎无需在其所属司法管辖区的国家内活动。这还因在快速变化的网络空间世界中保持法律法规的相关性极其困难而加剧。总的来说，立法者不了解网络空间，因此立法太慢、太缺乏针对性，无法提供应有的帮助。\n\
  \n在国际舞台上，同样的问题被放大了。国际法不适用于网络空间的大多数问题，国家可以随心所欲地行事，再加上当国家确实采取行动时，归因困难，问题更加复杂。\n\n\
  # 第 3 章\n\n# 加密与哈希\n\n在电报早期，电报按字收费，因此企业开发了代码本，用单个代码词（如“enbet”，一个真实例子）来表达原本需要许多单词才能说清的内容（“船长疯了”）。当然，这还有一个额外的优势，即通信含义被掩盖了，但这并非其主要目的。尽管如此，由于电报操作员能看到他们传输的所有内容，在某些情况下使用代码是必要的。据称，出于安全原因，表示伊丽莎白二世女王驾崩的代码短语是“伦敦大桥垮了”。\n\
  \n当电话系统取代电报后，人们就不太需要担心通信内容被截获（至少在电话接线员不再发挥作用后）。截获仍然可能，但需要物理行动，且在许多国家需要法律程序。\n\n\
  在网络空间中，各种通信以不可预测的方式跨越管道、穿过节点流动，且其经过的设备往往不在通信端点所在的司法管辖区内。迫切需要能够隐藏数据传输内容，防止被截获和窥探。加密技术由此登场。\n\
  \n加密利用一种映射，将数据从其原始存在形式（称为 `plaintext`）映射为一种新形式（称为 `ciphertext`），该映射具有以下两个属性：\n\n\
  *   在不知道密钥的情况下，很难逆向还原，即需要数年的计算才能重建原始内容；且\n*   原始数据的结构与其加密形式之间没有关系。例如，两个几乎相同的 `plaintext`\
  \ 应被映射为截然不同的加密形式。\n\n加密的基本属性是：从实际意义上讲，知道加密形式（`ciphertext`）无法在不持有密钥的情况下重建原始数据（`plaintext`）。\n\
  \n加密使得在网络中移动数据成为可能，即使网络不可信，因为能够看到加密数据并不允许除发送方和接收方之外的任何人发现通信内容。\n\n### 3.1 私钥加密\n\
  \n加密主要有两种方法：`private key encryption`（私钥加密）和 `public key encryption`（公钥加密）。在 `private\
  \ key encryption` 中，有两个密钥，一个用于加密 `plaintext` 数据，另一个用于将 `ciphertext` 解密回原始 `plaintext`。通常这两个密钥相同，或至少紧密相关，以便双方可以使用同一个密钥进行相互传输。例如，凯撒密码使用一种编码，加密时将字母表中的每个字母替换为其右侧第\
  \ 5 个（如“a”变为“f”）。解密时，加密消息中的每个字符被替换为其左侧第 5 个。只要双方约定偏移量为 5，就可以使用这种简单的加密方法相互通信。\n\n\
  加密系统已使用数千年，但它们往往依赖方法的保密性，而非密钥的保密性。毕竟，破解凯撒密码只需尝试所有可能的偏移量，这从其首次使用时就切实可行。任何通过固定方式将每个单字符替换为另一个字符的替换密码，都很容易通过字符频率分析来攻击。例如，英语中最常见的字母是“e”，因此加密消息中出现频率最高的字符很可能是“e”的加密版本。\n\
  \n\n\n### 3.2 公钥加密\n\n第二种主要的加密方法更为常见，因为与私钥系统相比，它具有许多吸引人的特性。这被称为**公钥加密**。在此场景中，用于加密的密钥和用于解密的密钥是不同的，不同到无法从其中一个（在计算上）推断出另一个。然而，它们的工作方式与之前相同：如果明文消息使用加密密钥进行加密，则密文可以使用解密密钥解密回明文。\n\
  \n节点（或个人）*A* 拥有一个私钥，必须保密，用于解密。*A* 还拥有一个公钥，无需保密，任何人都可以用它来加密发送给 *A* 的消息。让该密钥广为人知并不是问题，因为使用它的唯一方式是加密只有\
  \ *A* 能解密的消息；而且无法从 *A* 的公钥推导出其私钥。\n\n因此，任何想给 *A* 发送消息的人都可以查找其公钥，用它加密消息并发送给 *A*，而\
  \ *A* 是唯一能解密它的人。这两个节点不需要共享任何公共密钥。*A* 可以创建两个密钥，保留私钥并公开公钥。\n\n### 3.3 数字签名与数字哈希\n\n\
  我们已经知道解密是加密的逆操作（从一条消息开始，加密它，然后解密它，会产生原始消息）。通常，加密系统的结构意味着加密也是解密的逆操作。换句话说，如果消息首先通过应用解密机制进行转换，然后应用加密机制将再次产生原始消息。\n\
  \n当这成立时，公钥技术可用于**数字签名**。如果 *A* 创建一份法律文档，然后使用其（私有）**解密密钥**对其进行加密，那么生成的文档在很强的意义上与\
  \ *A* 绑定。任何人都可以使用 *A* 的公钥来**解密**它；如果结果是一份合理的文档，那么它必定是由 *A* 加密的（唯一知道正确密钥的人）。如果结果是随机乱码，则该文档不是由\
  \ *A* 加密的。这就像 *A* 的签名：只有 *A* 能使其生效，它与 *A* 绑定，*A* 无法抵赖，并且没有人能在不破坏它的情况下篡改它（例如，试图使其成为他人的签名）。\n\
  \n数字签名可用于解决公钥加密系统的一个问题——保证 *A* 的公钥确实属于 *A*。如果有人设法分发他们自己的公钥但使其看起来像属于 *A*，他们就能读取所有发给\
  \ *A* 的消息。解决方案使用**证书颁发机构**，即通过收取费用来验证和确认公钥的组织。\n\n*A* 将其公钥连同身份声明（“我真的是 *A*”）发送给证书颁发机构。证书颁发机构使用多种机制之一检查\
  \ *A* 是否真的是其声称的身份，并颁发一份包含 *A* 的公钥和 *A* 身份的文档，该文档使用证书颁发机构的私钥进行数字签名。任何想要检查 *A* 的公钥的人都可以使用证书颁发机构的公钥来解封此文档，并确保身份和公钥匹配。\n\
  \n当然，这意味着要信任证书颁发机构的公钥确实属于它；这可以通过依赖更高级别的证书颁发机构来实现（依此类推）。因此，这个过程是关于增加信心——腐败一个证书颁发机构比腐败\
  \ *A* 更难——但该过程不提供最终保证。\n\n获取证书的成本是小型组织倾向于不使用公钥加密的一个主要原因（即使他们可以）。但证书一直是个烂摊子，因为它们往往在尴尬的时刻过期，而且大多数人遇到证书问题时，会继续做他们原本打算做的事。\n\
  \n另一种使用加密思想的技术是**数字哈希**。这里的目标是将某些数据映射为加密形式，但加密后的数据被强制限制在受限的大小内。我们不关心能否解密数据，因此只需要单向机制，即我们使用加密密钥但没有匹配的解密密钥。该思想的本质是：数据的加密形式即数字哈希，由于加密的特性（明文的任何微小变化都应产生密文的巨大变化），它是整个数据的紧凑表示。\n\
  \n由于初始数据集可以任意多，但加密形式的数量限制在固定大小的结果中，因此这种映射不能保证为所有初始集合产生唯一的哈希，但如果固定大小不太小，冲突极不可能发生。例如，如果固定大小为\
  \ 32 字节，则有 2²⁵⁶ 种可能的数字哈希，远超将来存在的文档数量。\n\n我们要求该映射以加密相同的方式混淆输入和输出之间的关系。两个相似的初始数据片段必须产生截然不同的哈希，并且在知道某些明文及其哈希的情况下，不得能推断出另一个哈希到相同值的明文。\n\
  \n数字哈希是一组数据整个内容的一种摘要，但如果没有密钥知识就无法操纵它。它用于创建文档或应用程序代码的紧凑表示，以便检查其完整性。应用程序开发者可以提供应用程序及其数字哈希；下载者可以从应用程序代码重新计算哈希，并检查答案是否与原始哈希匹配，以验证应用程序未被恶意篡改或在传输中损坏。\n\
  \n### 3.4 加密的应用\n\n加密的基本目的是允许双方进行私密通信，即消除窃听的可能性。在网络空间中需要加密，因为数据从源到目的地的路径上，对其去向和方式几乎没有控制。\n\
  \n\n\n加密的设计初衷是使得在不知道适当密钥的情况下，实际上无法解密数据。即使在那些（号称）拥有“无密钥解密困难性证明”的系统中，这也并非总是成立。曾有政府信号情报机构游说推广已知但隐蔽缺陷的加密方案，以便在不知道密钥的情况下利用暴力破解，在合理的时间内完成解密。\n\
  \n理论上难以解密的加密系统的实现，可能会无意中引入捷径，使其在实践中变得脆弱。而且人们可能对密钥管理不善，将其留在系统中从而被窃取。\n\n政府和执法部门经常进行如下讨论：“加密为恶人相互隐瞒通信提供了机会。因此，加密系统应配备后门，允许执法部门（在一定司法监督下）解密此类通信。”这些后门基本上就是解密密钥。\n\
  \n现在你可以看到，不可能既有后门，又能同时保持前门的坚固。在设计良好的加密系统中，解密消息的唯一途径是使用解密密钥。为了创建后门，执法部门将不得不坚持持有每个人解密密钥的副本。这些密钥将成为全球价值最高的攻击目标之一，因为获取它们将使海量数据以未加密形式暴露。存放它们的保险库必须受到相应的保护，不仅要防范外部攻击者，还要防范可能被收买的内部人员，或那些难以抗拒诱惑、解密其喜爱的名人的邮件或健康检测结果的内部人员。各国公民对政府保护这些密钥的技术能力，以及其仅在法律授权下使用它们的意愿，信任程度远未达到要求。\n\
  \n因此，内容要么可以为所有人受到加密保护，要么无人受保护，但不可能只保护“良性”通信，同时允许执法或情报机构读取“恶性”通信。不存在中间地带。\n\n这也是互联网的全球触达与国家政府想要持有密钥副本的愿望发生冲突的另一个领域。几乎没有什么能阻止个人（更不用说跨国企业）在另一个司法管辖区获取他们的加密密钥；而政府很难证明他们已经这样做了。出于这两个实际但不可避免的原因，将解密密钥托管在某种托管机构中的提议行将就木。与我们生活的大多数其他方面不同，我们的网络空间存在受国家边界约束要少得多。这将是一个持续的主题。\n\
  \n不幸的是，加密可以隐藏通信的*内容*，但无法隐藏通信的*事实*，因为数据必须能够由不可信的中介传递。这造成了另一种漏洞，虽然不那么关键，但潜在影响重大。\n\
  \n在 20 世纪初，大英帝国开发了*全红线*，一个仅经过英国控制领土的电报网络，正是为了防止截获。在网络空间中无法做到这一点，因为通信的端点无法控制其传输路径。因此，对手原则上可以记录两个端点之间流动的数据量及频率，即使内容本身被加密。这被称为*流量分析*，可能极具启示性，特别是当端点未将其纳入考量时。\n\
  \n正如我们将看到的，加密在保卫网络空间中发挥着重要作用，但仍有大量方法可以颠覆它。\n\n# 第 4 章\n\n# 节点安全\n\n正如我们所见，网络空间中的节点既包括计算机，从某种意义上说也包括人。将网络空间中的计算机划分为几类是很有用的。\n\
  \n第一类是我们用来与在线信息交互、相互通信的计算机（和手机）。我们可以称之为*边缘节点*。\n\n第二类是组织用来运营业务的计算机，通常规模更大、算力更强。这些包括后端处理，如记录你的资金、运行自动化工厂、规划零售店补货的方式和时间、以及执行数据分析以理解复杂系统。其中一些计算机隐性地对普通用户可见，例如向你的浏览器提供网页的\
  \ Web 服务器，或旅行预订网站，但许多则不那么可见。\n\n第三类是*云*，协同工作的大型计算机群，可供企业使用，而无需拥有和管理自己的计算资源。云与其他计算资源的重要区别在于，云被设计为*共享*的，这带来了新的安全问题。\n\
  \n第四类是包含联网计算机但没有直接可用界面的设备，*物联网*设备。这些大多是传感器或执行器，例如智能恒温器、监控摄像头、智能灯泡或耳塞。一些几乎完全自主工作，但大多数从互联网上的其他地方远程控制。例如，电力变压器开关从控制室远程控制；智能灯泡从某人手机上的应用程序控制。\n\
  \n虽然将节点视为*计算*资源是很自然的，但也存在主要目的为存储数据并在被请求时提供数据的节点。这些可能是专用的（例如数据库服务器）或特殊形式的数据云。\n\n\
  据估计，联网设备超过 200 亿台，因此节点数量远超人口数量。\n\n### 4.1 获取节点访问权限\n\n节点安全的首要问题之一是允许谁访问它们。我们都有边缘节点的经验——我们的个人电脑和手机受到保护，只有我们能通过密码或生物识别等机制访问它们。网络安全中最大的弱点之一在于，获取节点合法访问权限的机制——*认证*——薄弱不堪，对于物联网设备而言，往往极其薄弱。\n\
  \n我们可以将认证机制分为三类：你知道的东西、你拥有的东西、或你本身的特征。\n\n#### 你知道的东西\n\n“你知道的东西”最常见的例子是*密码*。你知道它，你用来认证的系统也知道它（以某种形式），但其他人不应该知道。\n\
  \n你用于认证的系统不应以明文形式存储你的密码，因为那样任何设法入侵系统的人都将获得其所有账户的访问权限。为避免这种情况，密码以数字哈希形式存储。当你输入密码时，你输入的文本会立即使用相同的映射进行哈希运算，并将结果与存储的版本进行比较。如果匹配，你就通过了认证。\n\
  \n\n\n##### 系统漏洞与密码安全\n\n系统漏洞可能导致所有哈希版本被窃取，但由于数字哈希的特性，无法直接将这些哈希值映射回生成它们的密码。遗憾的是，虽然成本较高，但确实存在推算出原始密码的方法。用于创建哈希密码的标准数字哈希算法只有几种，因此攻击者可以从将这些算法应用于“a”、再应用于“b”开始，依此类推使用越来越长的单词。最终，某个单词会映射到已知的哈希值，该单词即为密码。\n\
  \n这就是为什么密码建议设置得较长（因为必须尝试许多可能的文本字符串才能找到正确的那个）并包含不常用字符（因为这增加了必须检查的文本字符串的多样性）。攻击者无需太高的技巧即可先尝试常见的密码选择，然后是字典中的单词，接着是日期，最后才诉诸暴力搜索。这就是为什么常见的建议是创建不属于这些可预测类别的密码。请注意，攻击者可以预先计算出所有短于特定长度的潜在单词的哈希值，因此攻入新账户的边际成本非常低。\n\
  \n因此，攻击者不断增长的计算能力与随之而来的密码复杂度要求增加之间存在一场军备竞赛。目前，不断增长的计算能力正在帮助攻击者，而记忆日益晦涩密码的需求则对普通用户不利。这种情况因许多用户拥有多个网站的密码（可能甚至有数百个），且不可能全部记住而变得更加复杂。毫不奇怪，用户会求助于在许多网站使用相同密码、使用短密码，或将密码写在他人可访问的地方。由于对复杂密码的需求与其对用户认知能力的要求之间存在错位，即使有密码管理器等辅助工具，使用密码作为认证机制的方法也已接近失效。\n\
  \n##### 认证中介\n\n一些社交媒体企业正试图成为认证中介。许多网站允许您使用社交媒体凭据登录。然而，这远非无私之举。对这些社交媒体网站而言，这成为它们在您访问互联网上其他网站时追踪您的又一途径。\n\
  \n许多企业试图通过包含只有您（理论上）知道答案的问题，来增强基于“您所知”的认证强度。最初，这些问题是诸如您母亲的娘家姓之类，但在线上世界这往往很容易被发现。现在通常使用更广泛的问题，但用户必须决定是使用正确答案（这使其更易被猜测），还是使用虚构答案（甚至他们自己可能都记不住）。\n\
  \n**密钥分享** 是 “您所知” 的一种发展。在此机制中，您和您要向其认证的系统知道 **不同** 的信息片段，这些片段必须组合在一起才能创建允许认证的 “您所知”。举个简单的例子，系统可以在\
  \ -90 到 +90 之间生成一个随机值，您的秘密是一个字母，正确的响应是说出一个城市名称，其纬度由该随机值给定，且名称中包含您的那个字母。\n\n####\
  \ 您所拥有的东西\n\n这种方法要求用户拥有并/或出示某个物体以进行认证。此类设备范围广泛，复杂程度各异。\n\n我们的物理钥匙是一个简单的例子。拥有钥匙是您解锁并访问现实世界中的门或容器所需的唯一认证。\n\
  \n您可以将可通过轻触支付的信用卡视为另一种基于 “您所拥有的东西” 的简单认证形式。您仅因拥有该卡而将自己认证为允许在该卡上产生账单的人（这也是为什么您无法产生\
  \ **巨额** 账单的原因）。\n\n另一大类例子是常用于车辆和门禁的无钥匙设备。当这些设备足够接近读取器时，读取器允许访问相关系统。读取器可能连接到计算机系统（例如插在\
  \ USB 插槽中），只要设备足够接近，系统就会允许访问。由于手机在世界许多地方普及，手机本身可以充当其他计算机的无钥匙访问设备，或用于物理访问控制。\n\n\
  更复杂的设备通常称为 **安全加密狗**，可插入 USB 插槽，并可被不同种类的软件询问，不仅认证计算机的使用，甚至认证该计算机上特定软件的使用。加密狗充当允许访问软件的物理许可证。例如，它可能包含软件的许可证代码和唯一识别号，以便跟踪访问记录。\n\
  \n由于加密狗与软件之间的通路可能受到攻击，或加密狗本身可能被软件或硬件复制，加密狗通常包含安全处理器，并加密软件与加密狗之间的通信，即使这种通信仅发生在单个系统内部。\n\
  \n当认证针对远程系统时，使用 “您所拥有的东西” 进行认证变得更具挑战性。这需要从读取器到远程系统建立一条安全路径，虽可行但需谨慎操作。\n\n使用 “您所拥有的东西”\
  \ 作为认证机制的另一风险是您可能丢失它或将其落在家中，从而被锁定在其保护的资源之外；它也可能被盗并被他人用来冒充您。\n\n这些设备也可能被给予或借给他人，后者随即获得随设备附带的所有访问权限。这有时虽方便，但也带来安全风险。\n\
  \n#### 您本身的特征\n\n这种方法使用您身体的属性——**生物特征**——作为认证机制，例如您的指纹、手掌纹、耳纹、虹膜、面部或声音。乍一看这似乎很有吸引力，因为这些生物特征始终伴随您，您不会忘记它们（如\
  \ “您所知”）也不会把它们落在家里（如 “您所拥有的东西”）。\n\n生物特征必须转换为可存储在计算机系统中的形式，且像密码一样，生物特征的新呈现必须以相同方式映射，并将结果与先前存储的结果进行比较。这种生物特征的存储编码具有与存储密码哈希相同的一些问题——它们成为攻击目标——并额外存在映射通常不是数字哈希因此可能可逆的问题。生物特征编码必须设计为对微小变化不变：手指位置略有不同、长老茧或留胡须等。这意味着它们进行的是粗略匹配，从而阻碍了真正的数字哈希。\n\
  \n生物特征认证系统有两个被低估但严重的缺陷。第一个缺陷是它们通常相对容易被欺骗。指纹于 20 世纪初开始用于识别罪犯，侦探小说《红拇指印》（1909 年）在几年内首次指出了其易于伪造的特性。在某些系统中，即使在今天，在指纹读取器上覆盖塑料薄膜并按压，会导致其记录最近一次真实的指纹。虹膜可通过将某人眼睛的高质量照片放在白纸的一个孔后进行欺骗。面部识别本身准确度不高，但可通过从照片衍生的面具进行欺骗。语音识别也不太准确，且同一人在感冒或过敏时会发生变化。\n\
  \n\n\n\n##### 生物识别系统与认证\n\n生物识别系统也会失效，因为并非每个人都有手指、手、耳朵、眼睛、面部或声音，因此必须始终存在备用认证机制。这增加了成本，因为在使用生物识别认证的每个地方都需要提供第二种机制。\n\
  \n第二个缺点是，我们通常每种生物特征只*有一个*。如果某生物特征（通常是其编码版本）被泄露，则无法签发一个新的。\n\n当生物识别认证必须远程进行（例如允许访问网站）时，生物特征的编码必须在采集点完成，然后将编码版本传输到网站进行匹配。这在采集点造成了漏洞，因为编码版本可能被拦截，随后在稍后或不同的接入点重放。这可以像密码一样通过变通方法解决，但采集生物特征的设备并不总是成熟的，因此可能容易被滥用。\n\
  \n“你所知”（知识因素）能提供温和的保证，即正在认证的是授权人员。“你所是”（生物因素）能提供大得多的保证，尽管并非完全可靠。“你所有”（拥有因素）的弱点在于，其使用与被授权使用它的人之间没有必要的联系。\n\
  \n这些机制可以组合使用（称为*双因素认证*），以试图取长补短。然而，认证通道越多，对人类用户来说就越麻烦，他们也就越有可能感到恼火并寻找变通办法。\n\n###\
  \ 4.2 恶意软件\n\n如果只有经过适当认证的用户才能使用其计算设备和软件，那么许多网络攻击将变得困难得多。不幸的是，人们经常做着网络空间中相当于“为怀有恶意者打开大门”的事情，允许他们获得对自己环境的认证访问。\n\
  \n允许恶意软件（*malware*）被植入计算机，当然不是普通用户故意为之，但有许多途径会导致这种情况发生。通常，这是用户无意识操作的结果。发生这种情况时，指责用户是常见的做法，毫无疑问教育能产生巨大影响；但网络空间的大部分设计使得攻击者太容易诱导普通用户做一些不安全的事情了。\n\
  \n常见途径之一是用户下载了包含隐蔽恶意软件的软件或应用程序，这些恶意软件隐藏在其公开功能内部。对于下载到手机上的应用，应用商店会尝试确保可用应用不含恶意软件，但其过滤流程并不总是奏效。对于个人电脑，从任何网站下载软件都很容易，因此相应地存在更大的风险。操作系统开发商正试图转向一种对下载软件提供更多审核的模式，但这尚不普遍，而且制造商正利用这种额外的安全性作为借口，收集更多用户数据转卖给社交媒体企业。\n\
  \n另一种常见的植入恶意软件的方式是将其附加在电子邮件中，伪装成数据。例如，电子邮件附件可能看起来像某种文档，但实际上包含可执行代码，这些代码本身就是恶意软件或会安装恶意软件。当此类恶意软件附加在随机发送给大量电子邮件地址的邮件中时，被称为*网络钓鱼*。电子邮件也可能包含链接，点击这些链接会跳转到下载恶意软件的网站。\n\
  \n越来越多的携带恶意软件的邮件针对特定收件人，这被称为*鱼叉式网络钓鱼*。攻击者可能会花费大量精力使邮件看似合理：伪造发件人地址为收件人可能预期的地址，并确保附件的表面内容是真实的，以便在打开时收件人甚至可能没有意识到已安装恶意软件。鱼叉式网络钓鱼还可能利用社会工程学，使其看起来像是来自收件人的老板，甚至是公司\
  \ CEO。\n\n网络钓鱼邮件日益泛滥，严重影响了沟通，因为无论技巧多么高超，人们仍有可能被骗。我们可以看到这种开端：人们通过另一种方式（如短信）联系对方，询问电子邮件附件是否合法。\n\
  \n某些形式的恶意软件，称为*蠕虫*，可以利用控制网络空间流量的底层机制在系统间传播。当这种情况发生时，系统无需用户做任何操作就能感染恶意软件。因此，蠕虫可以传播得非常快。\n\
  \n从某种意义上说，恶意软件也可以针对人而非节点——网络霸凌、通过电子邮件发起的诈骗以及错误信息的传播。\n\n### 4.3 恶意软件有什么作用？\n\n大多数计算机系统将其操作分为三类：任何用户均可执行的操作；仅操作系统可执行的操作（因此需要具有特殊权限的管理员账户）；以及系统首次开机时执行的操作。任何用户可执行的操作受限最多；用户可以使用计算机上的软件，但通常无法安装某些类型的新软件，也无法查看或更改关键文件。操作系统可以在整个运行中的系统内执行任何操作。因此，操作系统账户（管理员账户）仅限受过培训（包括安全培训）的系统工作人员使用。在手机系统中，操作系统功能完全不对用户开放，始终由操作系统开发商控制（除非手机被\
  \ Root）。最后，设备开机时执行的操作权力最大，因为它们发生在任何检查之前。\n\n恶意软件可以针对这三层中的任意一层。用户空间恶意软件最容易植入，因为普通用户的操作可能创造机会将其秘密安装，但因此它拥有的机会最小。这就是为什么通常建议用户始终使用此类账户进行日常工作，即使他们完全控制自己的系统，本可以对所有事情使用管理员账户。\n\
  \n针对操作系统层面的恶意软件较难植入，因为它需要更高级别的权限，但提供了更大的机会。针对设备开机时执行代码的恶意软件最难植入，但当然也是最强大的，因为它控制着设备的配置方式。\n\
  \n恶意软件的清除难易程度也反映了其最初植入的难度。恶意软件检测软件通常能发现用户空间恶意软件，也常能发现操作系统中的恶意软件，但发现并清除设备开机时运行的代码中的恶意软件要困难得多。\n\
  \n恶意软件也可能被植入硬件本身。这类恶意软件需要在制造过程中植入，成本高得多，但也难以检测得多。这通常是国家级行为体的领域。\n\n恶意软件可用于从破坏活动一直到非动能军事攻击等各种目的。分发恶意软件者的目标包括：\n\
  \n\n\n\n\n#### 恶意软件部署的动机\n\n##### 牟利\n部署恶意软件最明显的动机是罪犯利用它来牟利。这比看起来要难，但罪犯很有创造力，他们已经找到了方法。到目前为止最成功的是**勒索软件**。此类恶意软件使用仅攻击者知道的密钥加密目标机器的文件。然后恶意软件会告知用户需要支付多少钱才能再次解密文件系统。\n\
  \n在有完善备份的系统中，勒索软件只不过是个麻烦，但令人惊讶的是，有大量系统并非如此。毫不奇怪，针对中小企业的勒索软件攻击持续不断，英国国家医疗服务体系等大型目标也遭受了攻击。\n\
  \n正如大多数勒索案例一样，响应攻击支付赎金不是好主意。实施勒索软件攻击的网络机制可以作为黑盒被低级罪犯购买，实施勒索软件攻击的大多数罪犯甚至可能无法真正解密文件系统，即使他们想这样做。\n\
  \n##### 知识产权窃取\n许多企业拥有对其竞争对手或潜在竞争对手有价值的信息。这可能包括新设备的细节或计划，以及他们计划在合同上投标的金额。竞争对手有动机使用恶意软件发现此类数据并将其发送到目标组织之外供其使用（称为**知识产权窃取/数据渗出**）。与勒索软件不同，这类恶意软件试图保持尽可能不显眼，以便在不被发现的情况下进行渗出。完成工作后甚至可能删除自身，以留下尽可能小的痕迹。\n\
  \n##### 抗议\n网络空间为抗议他人（尤其是组织）的行为提供了现实世界的替代方案。一种流行的方法是通过将恶意软件插入 Web 服务器来篡改网页，因为这些是许多组织最显眼的在线部分。恶意软件也可用于更改密码，将合法用户拒之门外，或删除随机文件。这些影响不大，但很恼人，因为系统人员必须进行补救。某些形式的抗议针对国家政府，其适当性取决于你对政府合法性的看法。\n\
  \n##### 拒绝服务\n一种更严重的技术，通常由抗议或经济压力驱动，即**拒绝服务攻击**。其思路是用大量虚假流量淹没网络空间服务，使合法用户无法使用其服务。在现实世界中，这相当于以一种实际顾客无法进入的方式向商店派遣人群。这种攻击在现实世界中代价高昂，但在网络空间中却容易得多，因为制造虚假流量很便宜。\n\
  \n**直接拒绝服务攻击**由生成足够的流量到特定目标组成，导致目标或其周围的网络环境因过载而失效。直接生成足够的流量很难（且这种攻击可追溯到其源头），因此更常见的做法是在许多其他计算机上植入恶意软件。这组计算机的唯一目的是从许多不同方向大量生成流量。这些计算机上的恶意软件旨在保持隐藏，仅在需要其作为流量生成器的角色时才行动；此类系统称为**僵尸网络节点**。物联网系统是将其变为僵尸网络节点的特别热门目标，因为它们通常保护不力，有足够的能力生成流量，且没有人足够密切地监视它们以检测行为变化。\n\
  \n**分布式拒绝服务攻击**通过让所有这些僵尸网络节点同时开始向目标系统发起请求来触发。罪犯通常会随着时间的推移收集僵尸网络节点，并将其作为服务出租给任何想要用于拒绝服务攻击的人。创建和管理僵尸网络节点网络（**僵尸网络**）是将恶意软件货币化的另一种方式。\n\
  \n分布式拒绝服务攻击的目标通常通过呈现一个可以动态映射到后台不同服务器的地址来响应。早期的分布式拒绝服务攻击是成功的，但动态切换实际响应下一个服务请求的服务器的能力使得产生足够流量以压垮目标变得越来越难。\n\
  \n##### 直接金融盗窃\n某些恶意软件旨在用户（例如）登录其银行网站时收集凭证。罪犯随后可以使用这些凭证直接将资金转移到他们控制的账户。这代表了直接将恶意软件货币化的最简单方法之一，但银行往往对欺诈很老练，很可能迅速阻止可疑转账。这种盗窃也会留下可追溯到罪犯的痕迹，因为他们必须能够访问被盗资金转入的账户。\n\
  \n被盗凭证也可用于网上购物，使用不同的送货地址供罪犯取走购买的产品，但这风险更大，因为送货需要时间，在此期间欺骗可能被发现。当然，罪犯不使用自己的地址，而是使用方便的地址或空房子，跟踪送货以便知道包裹何时到达。（这是在线购物网站在你购买东西时发送电子邮件的原因之一——以确保是你本人操作。）\n\
  \n比特币等加密货币的兴起为罪犯提供了一种不可追踪地获取资金的方式，但这需要普通人将其金融体系货币转换为加密货币并发送给罪犯。\n\n##### 施展国家权力\n\
  由于网络空间参与了世界的经济和智力生活，国家自然将其视为施展权力和推进战略国家目标的途径。同时，它们可以观察其他国家做同样的事情并推断其战略目标。国家利用网络空间的两种主要方式是：\n\
  \n###### 情报收集\n由于几乎所有通信都通过网络空间传输，观察它是国家进行**信号情报**的主要方式。独立（军事）网络传输的数据较难收集，但由于它们与所谓的安全屏障之间存在泄露，以及直接窃听这些专用网络，仍然可能收集。在海底进行此操作是首选，因为可以在国际水域进行，且更难被发现。\n\
  \n网络空间中的信号情报问题与历史上相反——过去必须寻找*任何*有趣的数据，现在可以收集如此多的数据，以至于难以从中分离出有价值的部分。植入高价值目标的计算机、手机或至少其周边网络的恶意软件减轻了这个问题，因为那里收集的大多数数据推测都将是相关的。\n\
  \n情报也可使用用于知识产权窃取的数据渗出技术，从存储在其他国家的数据中收集。在某些国家，政府机构为国家目的和支持其本地产业都进行数据渗出。\n\n\n\n\n\
  \n###### 主动网络行动\n\n各国政府也越来越多地使用恶意软件作为武器，或计划将其用作武器。其吸引力之一在于，即便此类恶意软件被发现，将其归因于植入它的国家也很困难（至少难以达到足以采取反制措施的确定程度）。此类恶意软件还可以预先植入但不启用，直到需要时才激活，因此其作用类似于特洛伊木马。\n\
  \n已有多起利用恶意软件支持国家战略目标的案例，从导致石油管道爆炸起火，到“震网”病毒摧毁伊朗铀浓缩离心机。\n\n#### 节点影响关联人类的方式\n\n节点被用来影响与其相关的人类（而非影响节点本身）的方式也有若干种。\n\
  \n##### 网络霸凌\n\n软件平台经常传递旨在骚扰接收者的信息。这可能针对特定个人，这是青少年群体的常见问题，但不限于他们；也可能针对某个群体，此时被称为仇恨言论或辱骂性语言。动机往往晦涩难懂，但自我厌恶或“他者化”被认为是可能的解释。\n\
  \n##### 由消息传递介导的诈骗\n\n有许多犯罪利用网络空间作为手段触达大量脆弱或轻信的人。这范围可以从承诺各种不切实际之事的垃圾邮件（如身体部位增大或继承巨额财产），到发件人冒充政府部门、试图以欠税或罚款名义骗取钱财的诈骗。此类手法的一个变种是：恶意软件导致节点故障，然后向用户推销可消除故障的“解决方案”。\n\
  \n##### 虚假信息\n\n软件平台也被用来传播旨在影响政治结果的信息，要么是笼统地播撒对民主进程的怀疑，要么是专门支持或反对特定政治候选人。\n\n####\
  \ 网络工具的二级市场\n\n还存在一个面向犯罪分子的二级市场，向其他犯罪分子提供网络工具和漏洞利用代码，通常通过暗网市场进行交易。\n\n#### 针对服务器、云和物联网的恶意软件\n\
  \n到目前为止，我们在个人计算机的背景下讨论了恶意软件，但恶意软件也可用于攻击服务器和云。这些大型系统更难攻击，因为它们由受过训练的人员管理，后者不太可能意外引入恶意软件。另一方面，云通常由许多独立用户共享，在特定情况下，某一用户空间内的恶意软件可能与另一用户的空间发生交互。\n\
  \n勒索软件开始被用作针对这些大型系统的攻击手段。用于窃取知识产权的恶意软件也可安装在服务器和云中，以搜寻有趣的内容并将其窃取。\n\n物联网设备也遭到攻击。一个主要原因是将它们变成僵尸网络节点，进而用于对其他系统发起拒绝服务攻击。但物联网设备也可用于勒索。例如，视频婴儿监视器被攻击后会在婴儿房内发出恐怖或恼人的声音，智能灯泡会随机闪烁或拒绝亮起。随着越来越多的物联网设备被部署在其行为至关重要的场景中，此类攻击将变得更普遍。例如，房门可被远程解锁，供暖和制冷系统可被犯罪分子远程关闭（或开启）。甚至仅能判断灯或电视是否关闭，就可能提供信息以便实施现实世界的入室盗窃。\n\
  \n大多数恶意软件会在受感染系统中留下一个“钩子”，以便后续入侵更容易。对于大型系统而言，这更为典型，因为它们是更诱人的目标。这些钩子可以隐藏得很好，以至于即使恶意软件本身被发现并清除，钩子仍可能未被察觉。\n\
  \n### 4.4 直接攻击\n\n我们迄今考虑的攻击要么是 (a) 针对面向互联网的系统，可从外部发起攻击，例如拒绝服务攻击；要么是 (b) 因经过认证的系统用户的行为而遭受攻击，这些用户为攻击打开了大门，例如因网络钓鱼。但当目标系统访问受限且/或没有正常活跃用户时，攻击者能做什么？\n\
  \n例如，Web 服务器面向互联网，但通常没有普通用户登录其中。管理业务关键信息数据库的服务器不面向互联网，通常也没有普通用户登录——它是远程访问的，但仅限于企业内部。\n\
  \n那么，组织子网深处的系统如何被攻击？必须利用连接它们的“管道”中的漏洞以及节点本身的漏洞来攻击。\n\n节点之所以容易受攻击，是因为它们极其复杂，设计和实现中不可避免地存在错误从而产生漏洞。节点会定期更新以提供新功能，但许多更新是为了修复已发现的安全漏洞。如果节点定期更新，这些漏洞就会被消除，攻击者只能使用“零日攻击”，即依赖尚未被系统所有者发现和修复的漏洞。因此，零日漏洞是犯罪分子和政府的宝贵商品，尤其是因为一旦被使用就会暴露其存在，因此往往“保质期”很短。\n\
  \n“管道”难以轻易且定期更新，因为它们是许多不同节点共用的构造。管道更新有点像让我们所有人都同意说世界语——需要大量共识且成本高昂。因此，管道漏洞是节点攻击的重要推手。\n\
  \n攻击组织网络深处的节点是一个复杂问题，因为它可能需要先攻击中间节点，以建立桥头堡从而到达目标系统。我们将在讨论管道和配置后回到这个话题。\n\n## 第 5\
  \ 章：管道安全\n\n传输数据从一处到另一处的“管道”，乍看之下似乎很简单——一端数据进，另一端数据出。现实则更复杂。\n\n设想两座城镇之间的铁轨。最简单形式下，它只是从一座城镇延伸到另一座城镇的连续钢轨。但要将人员和货物从一座城镇运到另一座，光有钢轨是不够的——必须有车厢承载不同种类的内容：供人乘坐的客车、集装箱车、专门装化学品或牛奶的液体罐车、散货车、轨道检查车等多种类型。其中一些可自行移动（如轨道车），但其他必须由机车牵引。列车通过将这些部件组装成编组，作为一个整体沿轨道行驶，因此一端必须有空间集结它们，另一端有空间解编重组。必须有办法检测列车是否未到达目的地（因脱轨或机车故障）。有时列车会在不属于同一组织甚至不同国家的轨道上运行，而不一定知情。\n\
  \n网络空间中的“管道”情况相同。管道承载着混合的、具有不同需求的流量，且由于分组交换，这些不同种类的流量被交织在一起。管道本身没有智能，因此关于异常情况下发生什么的所有决定，都是双端的责任，双端因此必须能够达成一致。\n\
  \n\n\n\n### 协议层级与网络通信\n\n定义流量外观及流动方式的规则集称为**协议**。它们构成了每根管道所连接节点的交战规则。\n\n人类交谈时也存在类似的交战规则。在最底层，语音只是一系列振动。在更高一层，我们将短时振动片段归类为音素。再往上，将音素组合归类为单词。最上层则涉及语言、演讲或对话等概念。电话能传输语音，但它仅将语音视为振动。语音识别系统（如许多自动话务员）必须在音素和单词的更高层级理解语音。智能代理或聊天机器人则必须将语音理解为对话。\n\
  \n同理，协议按层级排列，对应不同抽象层次。通信底层仅通过光纤、导线或无线电信号将比特从一端移动到另一端（比特流本身不包含任何揭示其“含义”的结构）。上一层理解比特集合作为通信单元的含义。更高层管理更复杂的通信过程（类似对话），包括处理两端不同步的情况。\n\
  \n### 5.1 IP 协议\n\n在最底层（仅移动比特之上）是一种描述数据如何以单元移动的协议，但仅限简单单元。这就是**互联网协议**，即 `IP`。它负责将单个信息块（以**数据包**为单位）从源\
  \ `IP` 地址（发送计算机）传递到目标 `IP` 地址（接收计算机）。\n\n这两台计算机通常不会直接相连，因此该协议不仅负责将数据从管道一端移至另一端，还负责通过一系列管道将其导向正确位置。它利用每个中间节点的路由表引导每个数据包，使其在每一步都更接近目的地。\n\
  \n现实类比是寄送实体邮件。邮局在一地收到信件，尽力投递到另一地。途中会经过分拣办公室，每个办公室将其发往旅程的正确下一阶段。\n\n正如实体邮件一样，`IP`\
  \ 传递是尽力而为的，发送方不会收到数据包已送达的通知。\n\n在 `IP` 中，每个数据包独立于其他所有数据包处理，因此即使从同一来源发往同一目的地的数据包，也不一定遵循相同路径，也不保证按发送顺序到达。实体邮件也存在这种情况。\n\
  \n某个数据包在旅程各阶段可能经过的管道，其容量不一定相同。特别是数据包可能遇到只能处理较小数据包尺寸的管道（类似开车走捷径却遇到限高桥）。`IP` 拥有将大数据包分割成小数据包并在目的地重组的机制。这类似于将包裹切成薄片，使其看起来像一堆信件即可发送。遗憾的是，`IP`\
  \ 拆分和重组数据包的机制过于简陋——它依赖每个片段仅记录其距原始数据包开头的距离——这给轻易篡改创造了机会。\n\n### 5.2 TCP 协议\n\n尽管我们使用实体邮政服务已超一个世纪，但它作为网络空间数据传输模型有明显缺陷。两个更抽象的协议构建在\
  \ `IP` 之上。使用这些高层协议的流量被分割成 `IP` 数据包并通过 `IP` 传输，但它们无需知晓具体实现方式。它们不再将管道视为简单的比特移动连接器，而是视为\
  \ `IP` 流量传输器。这些高层协议提供了 `IP` 缺失的功能，如保证交付和流速管理。\n\n最重要且作为互联网标准的协议是**传输控制协议**，即 `TCP`。它太常见了，以至于常与\
  \ `IP` 连用称为 `TCP/IP`。`TCP` 提供了 `IP` 缺失的以下功能：\n\n*   **端点间的有状态连接，创建会话**（而非单向单数据包投递）。会话类比对话：有始有终，存在期间双方均负责管理。\n\
  \    \n    建立连接要求一端发送控制**段**。\n*   **数据包到达确认**，以便通过超时检测丢失的段，并由会话另一端的发送方重发。\n   \
  \ \n    因双方知晓会话存在，均预期来自对方的流量。段到达后，接收方必须在约定时间内确认（双方可协商调整）。若发送方未收到确认，则假定段丢失并重传。\n\
  *   **按发送顺序向目标节点交付数据**，利用每个段携带的**序列号**。当某段延迟或丢失时，目标节点接收到的后续段会被保留，直到缺失片段到达。因此，目标端必须预留大量空间用于重组。\n\
  *   **拥塞控制**，通过信号告知发送方何时停止发送以便接收方追赶进度。\n*   **更复杂的寻址方案**，发送方和接收方均使用 `IP` 地址和**端口号**的组合。节点上运行的每个预期与外界交互的软件使用特定端口。某些常用软件的端口号预先确定且广为人知——例如\
  \ Web 流量用端口 `80`，邮件用端口 `25`，域名服务用端口 `53`。其他软件每次启动时选择端口号。这些 `IP` 地址和端口号的组合标识了节点及其上运行的特定软件，确保数据来自并送达正确位置。\n\
  \n`TCP` 为互联网上两设备提供稳健通信，但若路径上某些管道较小、发生拥塞、或两端传输时间长，速度会相对较慢。\n\n### 5.3 UDP 协议\n\n\
  在交付速率至关重要的场景下，还有一种可用的高层协议。它称为**用户数据报协议**，即 `UDP`，提供与 `IP` 同类功能——尽力而为交付，无排序或错误控制——但具备\
  \ `IP` 地址 + 端口寻址。因此 `UDP` 以牺牲可靠交换换取快速端到端交付。\n\n`UDP` 用于延迟比偶尔丢包更重要的应用。此类应用通常主要单向流式传输数据。例如网络电话（`VOIP`）、视频传输（`Skype`、`Netflix`）。有时也用于可假设高可靠性的局域网（如远程桌面协议），因其避免了\
  \ `TCP` 的开销。\n\n### 5.4 利用协议的攻击\n\n所有这些协议设计之初环境更受信任，面对的系统性能约束比当今大多数系统更大。因此它们极易受到攻击。\n\
  \n以下是涉及管道的一些常见攻击：\n\n\n\n\n#### 网络安全威胁与对策\n\n##### 窃听\n数据包和段的全部内容均可读，除非载荷部分在到达 TCP\
  \ 协议前已被加密。即使载荷已加密，数据流向的所有细节及流量大小在网络中仍完全可见。\n\n这需要访问流动中的网络流量。可通过物理窃听流量（点对点管道）、监听无线网络，或诱导网络接口硬件将其本地区域内所有流量复制到节点（该功能原用于故障检测，但仍普遍存在）。\n\
  \n网络空间中大量流量未加密，易被捕获读取。加密流量的协议头仍可见，因节点需知晓各段/包的发送去向。流量分析可揭示端点对间的流量大小及时间；TCP/UDP 端口号常关联特定应用，从而推断通信应用；即便单一流涉及多应用，包大小分布也可能泄露所用应用，进而推断计算机功能（如\
  \ Web 服务器、打印服务器具有特征流量模式）。\n\n##### 地址欺骗\n因数据包和段头部的 IP（及端口号）字段无保护，伪造流量可随意发送，合法流量可被重定向。修改目的地址可将流量发送至错误位置（如冒充真实计算机的主机）；修改源地址可生成恶意流量并伪装来源（这也是网络攻击溯源困难的原因之一，因隐藏流量来源极其容易）。\n\
  \n##### 篡改内容\n若载荷未加密，可在不留痕迹的情况下篡改或替换内容。若操作得当，部分流量内容可被不可检测地替换。\n\n段头部部分字段含校验和，源自内容的简单函数。这些远非数字哈希；设计初衷是捕获传输错误，而非刻意篡改。若内容被篡改，对应校验和只需重新计算修改即可匹配，过程简单。\n\
  \n此三协议通用缺陷，或许是全流量加密普及的主因。\n\n##### IP 分片攻击\nIP 可将大包分片为小片段，以便穿越无法承载典型包的细链路。每片段含字段描述其距初始大载荷起始处的偏移。全部分片到达目的地（可能不到达）时，IP\
  \ 利用这些字段作为偏移量重组。然而，这些偏移量未经过合理性检查。攻击者若在途篡改偏移量，重组过程可能导致载荷部分被其他部分覆盖，最终包载荷与原始形态毫无相似。\n\
  \n此攻击非直接损坏包（可直接实施），而是使携带分片的包在防火墙等设备前显得无害，重组后却成防火墙本会拦截的包。\n\n##### 拒绝服务\nTCP（及 UDP\
  \ 程度较轻）的端点交互含状态，存在利用此状态的攻击。最简单是 SYN 洪水攻击。因 TCP 会话建立需三步交互，攻击者可执行第一步——请求会话——并忽略目标响应。目标须跟踪所有建立中会话。分配空间满时，无法接受新连接请求（含合法请求），且攻击填满的进行中连接表槽位永不解决。这类似反复致电餐厅用不同名字预订同一时段却从不赴约。\n\
  \n其他拒绝服务攻击令目标过忙而无法做有用工作。单一攻击者系统难产生足够流量，但攻击者可向大量其他系统发送伪装成来自目标系统的流量，这些系统随即同时响应目标。\n\
  \n接收 UDP 包导致接收方检查对应端口是否有应用等待流量；若无，发回“地址无此用户”响应。拒绝服务攻击可向大量系统发送目标为罕见端口地址的段，伪造发送者地址为待攻击目标系统。响应随即涌向目标并将其淹没。\n\
  \n##### 序列号预测与插入\n攻击者可篡改 TCP 段内容，即“中间人”攻击。但插入额外流量较难，因会话各方向连续段具有递增序列号。序列号使目的地跟踪已收段并正确确认，亦使其按正确顺序重组。这增加了插入额外段（从而有限接管流量）的难度。若攻击者能猜测序列号（并可能通过如拒绝服务攻击阻止真实源系统发送），可伪装成源。早期\
  \ TCP 生成初始序列号方案极简，现代实现则致力于使其随机。攻击仍可能但需更多工作。\n\n##### 协议栈指纹识别\n协议官方协议规范不足，致使各实现可在最高效（或最简）处自由发挥。不同厂商（或\
  \ Windows、Linux、Mac 等操作系统家族）实现略有差异。虽在关键处必须一致，但段头部仍留有痕迹泄露生成该协议的特定实现。这类似人类言语口音——虽能听懂不同口音（大多），但口音透露与所言无关的信息。\n\
  \n攻击者可观察流量，通过不同实现选择的痕迹或后果，推断特定节点运行何种软件。这可能因暴露已知弱点而使攻击规划更易，揭示哪些节点为良好目标。\n\n### 5.5\
  \ 对策\n\n因数据移动机制被视为“幕后”且高技术活动，效率成关键设计标准，安全鲜被考量。故针对这些攻击的对策寥寥。\n\n核心问题在于管道须“说同一语言”以连接异构节点并承载混合流量。协议变更须向后兼容，致使安全弱点即使在坚定改进努力下仍存续多年。\n\
  \n\n\n\n解决协议弱点的主要方法是对传输的数据进行加密（但这无法防止流量分析），并使用工作在更高层级的协议来查找并修正 TCP 层面的问题和缺陷。这些协议被称为*应用层协议*，它们对待\
  \ TCP 的方式正如 TCP 对待 IP 一样。它们假定存在一种建立会话并用于传输数据的方法（这正是 TCP 所做的），但它们会在数据传输上施加自己的检查，以确保传输正确发生。\n\
  \n一个重要的高层协议是*虚拟专用网络*（VPN），它将来自某个节点的所有流量视为单一的加密流，传输至另一个受信节点，在那里解包后正常传输至目的地。这保护了数据在\
  \ VPN 传输过程中的安全，并防止了在该段旅程中的窃听。通常，一端节点是个人或企业计算机，另一端节点归 VPN 提供商所有。虚拟专用网络 (VPN)VPN\n\
  \n由于*所有*流量在 VPN 中混合在一起，因此从流量分析中获取有用信息或针对某个特定会话进行攻击变得困难得多。当然，这仅能保护使用 VPN 的那段通信，因此这只是对互联网中特别不可信部分的一种保护。VPN\
  \ 的工作原理有点像船只组成船队航行以寻求保护。\n\n使用 VPN 会产生一个副作用，即流量看起来似乎源自受信节点而非其真实源头。这被用于规避针对流媒体视频服务等的国家特定限制，也被异见人士用于在不被政府发现或干扰的情况下使用网络空间。\n\
  \n不幸的是，攻击者已利用 VPN 牟利，他们冒充 VPN 提供商，诱使用户注册使用其 VPN，随后在流量通过所谓的“受信”节点时进行监视。\n\n节点应对管道固有不安全性的另一个关键方式是使用*防火墙*。防火墙可以是独立的交换机，也可以是现有交换机中包含的软件。它们包含一组关于允许何种流量通过的规则；所有其他流量均被丢弃。规则通常应用于\
  \ TCP 流量层面，因此它们可以描述哪些源 IP 地址、目的 IP 地址和端口的组合是可接受的，同时阻止所有其他组合。\n\n由于某些端口与特定类型的流量强相关，这也意味着可以允许某些类型的流量而禁止其他类型。不幸的是，虽然端口\
  \ 80 保留给 Web 流量，但由于可以使用 Web 浏览器执行许多不同的操作，因此在防火墙中允许端口 80 流量就会为许多不同类型的活动打开方便之门。\n\n\
  一些防火墙独立处理每个段，仅检查其是否满足允许进入的规则。更复杂的防火墙会跟踪会话（因为它们能看到建立会话的段），并确保所有其他方面可接受的流量也属于某个会话。\n\
  \n防火墙可以存在于各个规模——从隔离整个政府或跨国企业，到单个局域网。\n\n那些检查并阻断由应用层协议承载的流量的防火墙通常被称为*入侵检测系统*。运行在个人电脑和手机上的杀毒和反恶意软件应用程序就是以这种方式工作的。它们检查传入的文件，如电子邮件附件或网页内容，以查看是否包含恶意软件。换句话说，它们等待来自低层的流量被组装成完整的对象，然后检查这些对象以判断是否允许通过。\n\
  \n因为它们更了解流量的目的，且能负担更多时间和资源，入侵检测系统在检测方面比防火墙可以更复杂。\n\n两个系统之间的管道可以是点对点的，也可以涉及向多个系统广播。例如，有线网络使用交换机将计算机相互连接，这使得攻击者更难潜伏在网络上窃听。无线网络至少在潜在层面上，会使所有传输对网络上的每个其他设备可见，因此窃听变得简单直接。\n\
  \n对于手机，拦截流量最简单的方法是让用户安装一个拥有广泛访问手机应用权限的应用程序，并在流量仍在手机内部时捕获它。第二种策略是创建一个*伪基站*，诱使手机连接到它，记录流量，再将其转发给真实的基站。由于手机通常连接信号最强的基站，这只要求伪基站比真实基站更近即可。拦截使用标准电话网络发送的语音通话和短信非常简单，相关产品可购买，且使用所需专业知识极少。\n\
  \n拦截无线网络流量也很简单，但取决于具体的网络配置。网络接口（无论是交换式还是无线）都能向其本地区域内的所有节点广播，攻击者往往可以隐蔽地开启此功能。\n\n\
  最后，管道可能被物理切断（通常是因在错误地点挖掘），一旦发生这种情况，可能会导致大规模混乱。\n\n# 第 6 章\n\n# 配置安全\n\n构成网络空间的节点和管道必须能够相互通信，因此交互规则、诸如\
  \ IP 和 TCP 等协议使这成为可能。但节点和管道的系统必须作为一个整体协同工作，以应对不断变化的环境——节点和管道的消失或出现、拥塞等瞬态效应——即使该系统是去中心化的，并由许多不同的实体拥有和管理。这需要一种管理整个系统的方法，即使在去中心化的情况下也能发挥作用。\n\
  \n这种组织反映了最初的阿帕网（Arpanet）是为在核攻击中生存而设计的，因此采用了去中心化设计。互联网的所有基本运行都继承了这种去中心化设计，因此很少有可以直接控制互联网属性的节点。\n\
  \n### 6.1 互联网控制报文协议\n\n互联网必须有一种方法来维护每个交换机上的路由表，并发现何时出现故障并加以处理。该机制使用*互联网控制报文协议*（ICMP）。该协议运行在与\
  \ IP 相同的层级，可被视为一种并行协议。用户无需感知它，因为它在后台处理配置，但它包含可被用于攻击的漏洞，因此为了全面理解网络安全，必须了解它。互联网控制报文协议\
  \ (ICMP)ICMP\n\n网络空间是一个动态系统，特别是因为边缘附近的系统会来来去去（例如人们开关计算机）。其他更重要的系统也可能上下线，因为它们被下线维护或因崩溃而离线（尽管主流提供商设计其系统以便无缝维护）。交换机也可能开启和关闭，例如在更新后重启时，\n\
  \n必须有一种方法在尽可能保持正常运行的同时响应这些变化，这正是 ICMP 的作用。它有三个主要功能：\n\n\n\n### 6.2 域名服务\n\n另一个在网络空间幕后运行的系统是\
  \ **域名服务**，它负责处理人类可读的计算机名称与 IP 地址之间的映射。它是一组分布式的数据表，记录着当前的映射关系。\n\nDNS 服务器的进出流量使用\
  \ UDP，但这种流量对用户不可见——它嵌入在 Web 浏览器、邮件客户端以及其他需要将名称解析为 IP 地址的应用程序中。\n\n**域** 是名称空间的一部分，之所以存在是因为计算机名称具有层级结构。例如，`.uk`\
  \ 是英国所有计算机的域，`gov.uk` 是英国所有政府计算机的集合，而 `data.gov.uk` 是存放英国政府开源数据的系统的域。\n\n在互联网的每个子区域中，至少有一台计算机，即\
  \ **本地 DNS 服务器**，将保存名称到 IP 地址的映射，通常是与本地计算机正在执行的任务相关的映射。例如，这些本地服务器可能保存属于同一企业或机构的所有计算机（无论本地还是远程）的映射，因为本地计算机很可能与它们通信；也可能保存用户通常使用的热门新闻或社交媒体网站的映射。\n\
  \n如果设备请求的映射不在其本地 DNS 服务器中，该服务器会将请求发送到更高级别的 DNS 服务器。如果该服务器知道答案，它将返回映射，该映射会被发送回原始请求计算机，并**同时存储在本地\
  \ DNS 服务器中**。之所以这样做，是因为一旦一台本地计算机请求某个映射，它或其他本地计算机在不久的将来也很可能想要知道该映射。如果 DNS 服务器映射存储空间耗尽，它将删除近期最少使用的映射。\n\
  \n如果更高级别的服务器也不知道该映射，它会将请求发送给下一级更高的服务器，或者可能跳过某些级别直接发送给 **顶级 DNS 服务器**。顶级 DNS 服务器知道如何找到\
  \ `.com`、`.uk` 以及所有最高级域的 DNS 服务器。\n\n层级结构中的某些 DNS 服务器是特定域的 **权威 DNS 服务器**，它们永远不会删除该域的映射。因此，`.uk`\
  \ 有其权威 DNS 服务器，其他 DNS 服务器总能通过询问每个子域的权威服务器来找到 `.uk` 内的子域。换句话说，权威 DNS 服务器持有域名与 IP\
  \ 地址之间的**权威映射**，而较低级别的 DNS 服务器持有此类映射的**副本**。\n\nDNS 系统因 **区域** 的定义而变得复杂，区域横跨域和子域的层级结构。例如，一家企业可能在不同国家拥有域名，如\
  \ `fredmart.com`、`fredmart.co.uk` 和 `fredmart.com.au`，并希望将访问其任何网站的访问者重定向到适合其国家的版本。它们可以为所有\
  \ `fredmart.*` 域名设置一个权威 DNS 区域服务器来实现这一点。\n\n名称与 IP 地址之间不必是一对一的映射。将一个名称映射到多个 IP 地址是常见做法，用于负载均衡，使流量分散到不同的物理系统。这种能力也提供了一种应对拒绝服务攻击的方法，通过无缝分发大量入站流量，甚至可能将参与攻击的位置的流量分流，使攻击流量仅干扰其他攻击流量。热门网站也可以在繁忙时段透明地添加额外服务器。\n\
  \n虽然 DNS 是一个低级系统，但它也通过 `whois` 命令提供应用层接口。该命令将提供域名与 IP 地址之间的当前映射，以及关于地址所有者及其权威名称服务器的信息。\n\
  \nDNS 系统存在重大漏洞。如果攻击者能导致 DNS 服务器将请求转发给更高级别的服务器，然后模拟来自该服务器的虚假响应，就能导致虚假条目被包含在该 DNS\
  \ 服务器的映射表中。普通应用程序随后对映射的请求将被不可见地重定向到错误位置。\n\nDNS 服务器也容易受到拒绝服务攻击。攻击者可以生成大量针对不存在域名的映射请求。这些域名的映射当然是未知的，因此会触发级联请求到更高级别的服务器，而没有任何一台服务器知道该映射，以此类推。\n\
  \nDNS 的弱点已通过允许请求和响应加密部分得到解决。这使得攻击者更难插入虚假内容，因为虚假内容无法被正确加密。然而，旧系统仍需支持，因此在域名请求和响应的加密成为强制要求之前，这帮助不大。\n\
  \n### 6.3 交换机漏洞\n\n交换机只是配置为能够处理大量数据传输的计算机系统，因此它们可以在无需人工直接干预的情况下运行。它们拥有自己的 IP 地址，并运行标准系统软件。交换机是特殊的脆弱点，因为它们参与了数据移动的各个方面。操纵交换机的能力创造了前所未有的攻击和破坏力量。\n\
  \n\n\n\n# 交换机漏洞\n\n交换机与其他节点具有相同的漏洞。特别是，它们必须能够安装更新，因此拥有通往外部世界的专用连接——以及一个允许远程访问的管理账户，尽管其正常运行并不需要人工操作员。此类账户必须拥有高权限，因为整个交换机环境必须能够被远程操控——许多交换机部署在难以或无法直接接触的位置。这意味着交换机可能从互联网上的任何地方遭受恶意操控——修改其配置，甚至导致其关机。\n\
  \n交换机也是一种漏洞，因为出于必要，它们能看到流经它们的所有流量。如果它们被攻破，则无需攻击管道即可收集用于流量分析的数据。\n\n交换机还容易遭受物理攻击，因为它们通常在物理上和地理上是隔离的。可以物理接触许多交换机并直接将其移除或销毁。它们的环境也可能被篡改，例如将其加热至超过热额定值，从而阻止其运行。\n\
  \n### 6.4 发起攻击\n\n我们已经看到，某些攻击很容易发起，因为它们依赖于待攻击系统用户的无意配合（特别是网络钓鱼和鱼叉式网络钓鱼）。此类攻击也可能成为攻击其他系统的垫脚石。\n\
  \n无法依赖用户协助的攻击必须采取不同的方法。虽然此类攻击可能以机会目标为对象，但它们更多是针对特定组织的特定计算机。例如，攻击者想要窃取的敏感数据可能存储在合同数据库中。目标计算机可能深藏于该组织的网络环境内部，受多层防火墙保护，或许还部署了入侵检测系统。\n\
  \n此类攻击通常需要一种策略性方法，涉及以下步骤：\n\n*   **侦察**。没有直接的方法来识别特定的目标计算机。非面向互联网的计算机没有传播到 DNS 服务器的名称，因此难以找到\
  \ IP 地址，即使找到了，也只能揭示计算机所在的子网，而无法知道如何到达它。\n\n    攻击可能必须从面向互联网的计算机向内渗透，到达其内部邻居，再进而到达预期目标（因此一次攻击实际上需要多次其他攻击作为垫脚石）。显然，垫脚石集合应经过最脆弱的计算机，即使以走更长路径为代价。\n\
  \n    因此，侦察的另一个方面是识别可能脆弱的计算机。这就是协议栈指纹识别有用的原因之一——它允许攻击者识别计算机使用的软件版本。了解漏洞列表后，攻击者可以评估每个可见系统作为目标的难易程度。\n\
  \n    侦察还可能包括查看每台计算机发起和接收的流量。这可能揭示其用途：是打印服务器？数据库前端？许多看起来不像计算机的设备，例如打印机或物联网设备，也可能面临攻击风险，并为后续步骤提供立足点。这些设备功能齐全，尽管我们往往因其似乎仅具备单一功能而对此视而不见。\n\
  \n    `ping` 和 `traceroute` 等工具也可用于探索组织内部环境，尝试推算 IP 地址和结构。例如，子网上并非每个可能的 IP 地址都必然关联设备，攻击不存在的设备毫无意义。\n\
  \n    ICMP 中的生存时间特性可用于探测防火墙。如果发送一个生存时间比到达防火墙所需步数大 1 的数据包，若防火墙拦截了它则不会有响应，但若它通过了防火墙（随后耗尽生存时间）则会返回反弹包。攻击者可利用此法查看特定地址和端口组合的流量是否被允许通过防火墙。\n\
  \n    这种探测还能提供目标计算机特征的信息。例如，如果 80 端口流量（用于网页浏览）被阻断，则目标计算机不太可能有普通用户。\n\n*   **攻击规划**。一旦攻击者了解了外部世界与目标系统之间的系统和网络，就可以设计攻击。这需要为所需路径上的每个系统选择攻击手段，以及在攻击不如预期时的备选方案。攻击者必须拥有一套攻击技术和工具储备，并知晓哪些系统易受每种攻击。\n\
  \n*   **实际攻击**。实际攻击要求按顺序执行每个规划步骤。某些攻击阶段可能涉及探测，以查看特定攻击是否会成功。如果不行，则必须改用另一种方法。\n\n\
  \    由于攻击通常需要入侵沿途节点链，攻击者通常会在已攻破的系统中植入机制，以便日后无需再次发起攻击即可访问。这些被称为**后门**，可能通过创建新的管理员用户账户，或重新配置接口使其安全性降低来实现，从而可毫不费力地再次利用。\n\
  \n*   **清理痕迹**。所有计算机系统和交换机都保存记录发生动作的日志文件。这些日志粒度各异，从 TCP 会话到每个登录用户发出的命令均有记录。这些日志文件的主要目的是在节点或管道出现故障时追溯发生了什么。然而，它们同样记录了无辜者和攻击者的活动。\n\
  \n    因此，攻击者有动机删除或篡改日志文件以不留痕迹，要么隐瞒攻击发生的事实，要么阻止正确归因。删除日志文件会清除被记录活动的痕迹，但删除行为本身即属可疑。篡改日志文件更佳，但需要更高技巧，且当日志文件众多时，攻击者极易遗漏某个日志中留下的痕迹。\n\
  \n*   **留置后门**。在攻击者付出所有努力后，自然而然会修改目标系统，使后续攻击（如有需要）变得更容易。我们已提到过让沿途系统更易复用，但让目标系统更易再次攻击更为有用。（当然，为实现此目的而修改目标系统有产生额外痕迹的风险。因此对于数据窃取和其他隐蔽类攻击，保持系统外观完好无损可能更为合适。）\n\
  \n### 6.5 抵御攻击\n\n如果防御者留意观察，可能会发现正在进行的攻击痕迹，甚至是准备阶段的攻击。但现实是，大多数系统持续遭受低强度攻击，几乎全部被防火墙和入侵检测系统挫败。这些系统可配置为在攻击看起来比典型背景噪音更强时向人工发出警报，但设定这些警报的阈值颇具难度。阈值设得太高，会遗漏重要攻击；设得太低，则会产生持续的误报。误报过多时，人员会学会忽略它们。攻击者可利用社会工程学故意触发警报直到被忽视；随后再实施真正的攻击。\n\
  \n\n\n\n\n最棘手的情况是所谓的**高级持续性威胁（APT）**，这是一种潜在严重但发生频率极低的攻击准备活动，间隔可能长达数周或数月。人们普遍认为这类威胁源自国家行为体，它们耐心地积累关于潜在目标的信息。它们难以被察觉，因为每个单独的步骤看起来都微不足道，且由于步骤之间存在时间间隔，整个攻击序列难以被检测出来。\n\
  \n人们自然会问，为什么计算机系统不都做到尽可能完善的防御？我们在第 4 章中涉及过这一点——管道的行为实际上无法更新；而节点则按固定计划定期更新，通常是每月或每两周一次。\n\
  \n然而，许多系统甚至没有更新到当前的最佳水平，因为人们担心更新会破坏节点的持续运行。企业可能无法承受更新与其核心创收系统交互不良所导致的停机时间。此类企业可能会在隔离环境中试用每个更新，以判断其部署是否会引发问题，而这个过程需要时间。因此，可能存在一些组织的更新状态比其潜在水平滞后数月，这些尚未更新的系统自然成为攻击者的目标。\n\
  \n此外，还有数量惊人的无人值守系统，已被其所有者遗忘。此类系统可能永远不会更新，因此代表了其组织的严重漏洞。某些系统，特别是物联网设备和路由器，根本无法（或极其耗时地）更新。\n\
  \n维护大量计算机保持最新状态涉及资源投入，因此许多组织也被迫进行分级处理，以最好地保护其最关键的系统，并接受对不太重要的系统保留一定风险。组织可以使用**攻击图**来了解其风险水平。这些图表展示了面向互联网的系统有多容易受到攻击，然后基于所有已安装软件的版本，传递性地评估距离互联网一步之遥的系统有多容易受到攻击，以此类推。攻击图可以指示系统人员在哪里进行干预最具成本效益，从而保护整个系统。（攻击图也是攻击者最渴望拥有的，他们试图通过监视隐性地构建攻击图。）\n\
  \n防御者还可以追踪作为监视或早期攻击指标的事件。一种方法是查看记录系统上许多活动的日志。这样做的频率远低于应有的水平，因为日志非常详细（且增长迅速），很难挑选出可能预示探测或攻击准备的异常活动。用于部分自动化此步骤的工具正在出现。尽管如此，日志通常仍只在事后被查看，以弄清攻击是如何发生并将其归因，而不是作为实时防御工具。\n\
  \n一些组织会设置称为**蜜罐**的系统，这些系统被设计成看起来像极具吸引力的目标，但实际上不包含任何真正有价值的东西。防御者可以比监控其他计算机更仔细地监视蜜罐，使其充当触发线，在潜在攻击发生时通知防御者。它们的另一个优势是，防御者可以在攻击者攻击蜜罐的过程中考察其策略，从而了解该攻击者可能如何攻击组织中的其他计算机。\n\
  \n在安全至上的组织中，计算机可能每天都会重新加载其全部软件和系统。这意味着攻击者利用成功攻击的时间非常有限，且无法留下后门以便进一步攻击。\n\n### 6.6\
  \ 恢复\n\n当成功攻击发生时，防御者必须执行一系列任务以进行恢复，并可能需要在法律层面应对攻击者。\n\n显然，第一阶段是损害控制。某些事件会导致防御者意识到攻击已经发生。防御者必须设法弄清组织遭受了何种损害，并在可能的情况下进行补救。随后，防御者需要弄清攻击是如何实施的。这通常需要对日志进行仔细分析，以寻找攻击的痕迹。\n\
  \n第二阶段是堵住允许攻击发生的漏洞。如果弱点是缺乏更新，这可能很简单；但如果攻击利用了零日机制，可能会更加困难，因为防御者无法轻易确切地弄清发生了什么。\n\n\
  第三阶段是弄清如何（如果可能）将攻击归因于特定主体，并可能进行报复。从原则上讲，归因很困难，因为攻击源很容易隐藏在伪造的源地址背后。然而在实践中，攻击者往往粗心大意，有时甚至不了解有关活动收集了哪些信息，因此有时可以有一定把握地推断出是谁实施了攻击。有趣的是，开发人员在构建恶意软件时似乎无法抗拒在作品上签名的诱惑，这经常有助于归因。\n\
  \n谈到报复，企业等组织可以尝试寻求执法部门介入。这往往效果不佳，因为警力中缺乏具备理解攻击所需技能的员工，法院也是如此。\n\n政府往往在归因问题上采取主动，因为它们需要了解攻击如何融入更大的国际关系框架，并可能诉诸主动网络行动作为一种网络威慑手段。这是一个快速发展的领域。\n\
  \n## 第 7 章：应用安全\n\n大多数应用程序通过使用我们已经讨论过的协议进行通信，特别是 `TCP/IP`。然而，也存在一些协议，允许运行在不同系统上的特定应用程序在更高的抽象层级上相互通信，即将整个管道系统视为一种通信机制，而无需关注其工作细节。\n\
  \n在这种更高的抽象层级上工作，也使得更容易看出某些类型的流量不应被允许。这是由**入侵检测系统**完成的，它们类似于防火墙，但运行在各个节点内部，而不是在管道中。由于其位置特性，它们能更好地判断哪些流量模式（针对正在运行的应用程序的进出流量）是合理的，哪些是不合理的，并阻止那些不合理的流量。因为它们运行在节点内部，也拥有资源以更详细、更宽松的时间限制来检查流量，从而能做得更彻底。\n\
  \n我们现在考虑其中两个应用层系统。\n\n### 7.1 电子邮件\n\n发送电子邮件要求发件人的电子邮件客户端将消息发送到其本地电子邮件服务器。然后，该电子邮件服务器必须将消息传输到目标地址的电子邮件服务器，后者再将其传递给收件人的电子邮件客户端。两台服务器之间的通信机制使用一种称为**简单邮件传输协议（SMTP）**的应用层协议。电子邮件是网络的早期用途之一，该协议可以追溯到可信网络时代。在定义该协议时，安全性并未被纳入考量，因为电子邮件只是一种将简单文本从发件人传递给收件人的方式。\n\
  \n此后，电子邮件被赋予了许多其他功能，例如作为附件传输任意文件，或组织会议。最初极其有限的安全机制并未跟上所有这些新功能的步伐。\n\n\n\n\n####\
  \ 电子邮件安全的本质\n\n电子邮件的本质决定了其安全性天生难以保障。电子邮件服务器必须易于被发现；否则发送方的邮件服务器就不知道将每封邮件发往何处。（实际情况比这稍微复杂和微妙一些：发送至\
  \ `jsmith@corporation.com` 形式地址的邮件，实际上会被发送到诸如 `mailserver.corporation.com` 这样的域，因此涉及的不仅仅是\
  \ DNS。）这意味着任何组织至少必须有一台计算机对外部世界可见，这为攻击者了解该组织内部计算机系统的设置提供了一个不可避免的切入点。\n\n根据设计，邮件本应从一台邮件服务器传递到另一台，因此防火墙无法阻断此类流量。入侵检测系统（IDS）必须承担决定是否允许邮件通过的任务。电子邮件系统是开放的，因为任何人都被允许向他们知道或能猜到邮箱地址的任何其他人发送邮件，所以\
  \ IDS 规则通常不会根据邮件来源来阻断邮件。垃圾邮件问题表明，这一弱点给用户带来了骚扰，而反垃圾邮件系统对此仅能起到中等程度的缓解作用。\n\n邮件内容通常不加密，因此经过邮件传递路径上的任何系统或交换机都可以读取其内容。曾有许多尝试试图解决这一问题，但所有尝试都因操作过于繁琐而未能得到广泛采用。公钥密码系统当然行之有效。如果你知道收件人的公钥，你可以用该密钥加密内容，接收方便可解密，并确信其在传输途中未被窃读。实现这一点需要知晓接收方的邮箱地址和公钥，发送方可针对单次发送手动完成，但要实现自动化，则需要对整个电子邮件系统进行彻底重新设计。\n\
  \n早期邮件仅为纯文本，但如今的邮件可包含各种格式的附件。许多附件合法地包含可执行代码。例如，Microsoft Word 文档可包含影响其显示方式的可执行宏，尽管\
  \ Word 文档看起来似乎只是文本和图像的容器。这使得构建攻击成为可能：附件中的可执行代码在邮件被打开的系统上安装恶意软件，这是网络钓鱼的基本机制。尽管防病毒和反恶意软件会例行扫描这些附件，但很难判断某个特定附件何时或是否包含恶意软件。\n\
  \n邮件客户端通过让用户轻松点击附件以打开它们（这是一种便利，也是一种弱点），以及允许发送方选择显示的文件名（从而使可执行文件伪装成文本文档），加剧了这一问题。电子邮件还可包含链接，用户可在邮件客户端中点击这些链接，从而被导向任意位置；同样，链接文本显示的目标地址未必是链接实际指向的位置。\n\
  \n整个电子邮件系统不包含对邮件内容的任何检查，甚至不验证发件人的身份。伪造 `From:` 地址以隐藏发件人真实身份易如反掌。恶意邮件不会平白无故地暴露发件人是谁。\n\
  \n电子邮件会记录其经过的系统，尽管这些信息通常不在邮件头中直接可见，需要特殊操作才能查看。这有一定优势：可将伪造的发件人追溯到发送消息的系统（或接近源头的系统）。然而，这也影响了普通发件人的隐私，他们可能不愿让他人知晓自己的发帖位置。\n\
  \n能够从家庭位置以外的地方（例如酒店、飞机和火车上）发送邮件非常方便。邮件服务器常被配置为允许任何连接到它们的用户发送邮件，这种做法称为开放中继。遗憾的是，垃圾邮件发送者利用这些系统发送大量垃圾邮件。越来越多的情况下，要发送邮件，必须先连接到自己的家庭系统，或以其他方式向自己的本地邮件服务器进行身份验证。\n\
  \n电子邮件系统中不存在流量控制，因此只需在短时间内向特定系统发送大量邮件，即可使其不堪重负。电子邮件通信是异步的，因此邮件会堆积在目标服务器上，等待用户下载到客户端。这种数据存储极易耗尽大量空间，从而意外或蓄意地瘫痪邮件服务器。\n\
  \n电子邮件是一种尽力而为的通信机制。某些邮件系统提供通知发件人特定邮件已被阅读的功能，但这功能常被滥用——例如垃圾邮件发送者用它来验证某个邮箱地址是否活跃——以至于大多数用户即使在提供该功能的系统上也会将其关闭。然而，大多数人假定电子邮件是可靠的，这有时会导致问题和沟通失误。\n\
  \n### 7.2 Web 流量\n\n万维网是大多数人与网络空间交互的方式。因此，它成为恶意活动的主要目标。\n\nWeb 最初是一个信息分发平台。使用浏览器，任何人都可以输入一个\
  \ `URL`，获取一个包含内容的网页。网页包含链接，用户可通过点击链接从一个页面跳转到相关页面。当 URL 未知时，Web 搜索引擎使得使用搜索词获取排序后的相关页面列表成为可能。\n\
  \n用于 Web 流量的应用层协议是*超文本传输协议*（`HTTP`），它定义了浏览器与 Web 服务器如何交互。Web 流量使用端口 80，即浏览器使用目标\
  \ IP 地址和端口 80 向 Web 服务器发送请求，并通过同一端口号接收结果。由于 Web 访问无处不在，几乎所有系统都允许访问此端口，即防火墙几乎从不阻断它。\n\
  \n越来越多地，`HTTP` 已被 `HTTPS`（`HTTP Secure`）取代，后者是该协议的一个版本，可加密浏览器与网站之间双向的流量。这保护了内容，但当然无法保护所访问的\
  \ URL。使用 `HTTPS` 要求网站建立公钥加密机制，这带来了开销，且对于规模较小或技术不够成熟的组织的网站来说可能过于复杂。因此，`HTTPS` 仍未被广泛使用，尽管它已成为最大、最流行的\
  \ Web 服务器的常态。一些浏览器开发商曾试图通过威胁强制要求使用 `HTTPS` 来推动其更广泛的采用，但迄今为止尚未成功。`HTTPS` 流量使用端口 443\
  \ 而非端口 80，因此该端口也几乎必然被防火墙放行。\n\n浏览器-服务器接口的设计初衷是完成一项相对良性且简单的任务（将网页从服务器传送到浏览器），但该接口现已具备更强大的功能：浏览器可向\
  \ Web 服务器发送内容，Web 服务器可向浏览器发送由浏览器执行的代码（因此代码在用户本地运行）。这使用户能在浏览器中玩游戏或观看视频。这种新功能导致 `HTTP`\
  \ 协议定义发生变更，但并非所有变更都经过深思熟虑或精心设计，且（照旧）便利性压倒了安全性。\n\n\n\n浏览器可以向 Web 服务器传输数据。有时这仅仅是表单的内容，通常作为使用用户名和密码向\
  \ Web 服务器进行身份验证的方式。但浏览器还允许用户在银行账户之间转账、购买产品或从图书馆借阅电子书。相同的机制允许用户向网站发布内容，然后该网站上的其他人也能看到这些内容。例如，用户可以上传视频、状态更新、博客文章，并分享他们的活动，例如他们购买了什么。\n\
  \n除了浏览器与 Web 服务器之间的显式通信外，还存在大量旨在跟踪用户行为的隐式通信（例如，使用 `cookies`）。由于许多用户同时与多个网站交互（可能使用单独的标签页），因此一个网站的交互有机会泄露关于与另一个网站交互的信息。\n\
  \n一种旨在处理简单请求（上行）和静态数据（下行）的机制，已成为大量不同种类数据以及可执行代码进行高容量双向传输的通道。\n\n网页包含超文本标记语言（HTML），它描述网页各部分**是什么**，而不是其确切的格式。例如，HTML\
  \ 标签标记段落、标题、列表等。浏览器可以利用关于每部分是什么类型的 HTML 信息来决定如何显示它，同时了解将显示它的设备的屏幕尺寸和分辨率。\n\nWeb\
  \ 流量的主要漏洞之所以成为可能，是因为网页中作为代码或用户生成内容的部分也用标签标记。因此，这些部分内部的文本在到达浏览器或 Web 服务器时就变成了可执行代码。检查这种可执行代码是否合理且安全是困难的，而且往往甚至不曾尝试。\n\
  \n三种主要攻击利用了数据变为可执行代码的这种能力。第一种称为 `cross-site request forgery`（跨站请求伪造）。攻击者利用自己的网站，通过不知情用户的浏览器向另一台\
  \ Web 服务器发起恶意请求。例如，假设用户已登录银行网站的银行账户，同时在另一个标签页打开了攻击者的网站。攻击者可以导致用户的 Web 浏览器下载一个恶意请求（例如转账），然后将其传递给银行网站。银行知道用户已通过身份验证，却没有意识到该请求并非来自用户的操作，而是间接来自另一个网站。用户甚至可能没有意识到发生了任何事情。\n\
  \n第二种称为 `cross-site scripting`（跨站脚本）攻击，其工作方式相反。攻击者在允许用户上传内容的网站上插入 HTML 格式的内容——例如，社交媒体网站可能允许用户描述他们的兴趣。在这个上传的内容中，有一个包含可执行代码的\
  \ HTML 部分。每当用户下载该内容时，这段代码就会在他们的计算机上执行，并能执行浏览器中允许执行代码做的任何事情。下载的恶意代码可能直接做一些坏事，但也可能导致下载其他恶意代码。\n\
  \n这两种攻击看似应该很容易预防，但它们与 HTML 和浏览器的核心机制相互作用：可执行代码如何处理、身份验证和 cookies 如何工作，以及同时与多个网站交互的能力。已经有过几次防止这些攻击的尝试，这是一个不断发展的领域，但解决方案需要所有浏览器和所有网站就确切需要做什么达成一致。实际上，浏览器尝试了不同的方法来试图解决根本问题，而不需要更改网站（因为这在全世界范围内永远不会发生）。\n\
  \n第三种攻击称为 `SQL injection`（SQL 注入），也许是最流行的单一网络攻击机制。网站在收到请求时通常即时创建页面。例如，如果你访问你的银行，你必须首先填写一个提供你的账户标识和密码的表单；但随后银行会显示一个包含你的余额和其他个人详细信息的页面。当然，这个页面对每个人都是不同的。\n\
  \n填充此页面的数据来自一个数据库，该数据库拥有每个客户的记录。数据库是专门的数据存储，响应以查询形式表示的请求提供信息：“显示具有此账户号码的个人的余额”、“显示该分行所有人的账户号码”，等等。这些查询使用查询语言以结构化方式表示，其中\
  \ `SQL`、`Structured Query Language` (SQL) 是最流行的一种。\n\n当你在 Web 浏览器的表单中输入信息（“账户 xxxx\
  \ 的余额是多少”）时，它会变成一个 SQL 查询，被传递给 Web 服务器，Web 服务器再将其传递给数据库。当数据库响应 Web 服务器时，服务器将响应转换为\
  \ HTML 并发送给浏览器以供显示。\n\n问题在于 Web 浏览器和/或 Web 服务器不（在某些情况下，不能）验证输入表单的文本是否为安全的 SQL 查询。因此，知识渊博的用户可以在表单中输入执行数据库中恶意操作的信息，甚至包括删除全部内容。\n\
  \n已知有几种针对 SQL 注入攻击的对策，大多基于在输入到达数据库之前更努力地验证输入。然而，这些依赖于正确配置 Web 服务器和数据库。许多 Web 服务器（和数据库）是为中小型企业构建的，它们可能不了解这些问题，因此允许这些攻击的错误配置仍然很常见。\n\
  \n这些攻击可以协同作用。跨站请求攻击允许恶意网站向另一个网站创建请求。该请求可以是针对位于该其他网站后面的数据库的 SQL 注入攻击。\n\n用于运行 Web\
  \ 服务器的代码也可能存在潜在攻击者已知的漏洞。即使是存在已久的知名 Web 服务器也包含错误。例如，`Apache` Web 服务器每年大约发布 10 个安全修复。复杂的攻击者可能能够直接攻击此类网站，即不依赖浏览器作为中介。\n\
  \n许多允许恶意行为者进入个人社交媒体账户或银行账户的攻击，使用钓鱼或定向钓鱼将恶意软件植入个人的计算机或手机。此类恶意软件可以监视个人何时登录其账户，捕获其密码，然后在后台悄悄登录；随后发布内容到社交媒体、发送垃圾邮件，或从其银行账户转移资金。用户可以通过使用防病毒和反恶意软件来防范这些攻击，这些软件可在恶意软件进入设备前或后检测到它们。\n\
  \n利用 Web 服务器机制的攻击更难检测，因为它们大多是瞬态的——攻击发生在一瞬间，当时没有产生任何迹象表明正在发生什么，并且留下的痕迹很少。\n\n###\
  \ 7.3 区块链\n\n`Blockchains`（区块链）是一种应用层系统，依赖于我们在第 3 章讨论的许多加密思想。尽管区块链的长期用处仍是一个开放性问题，但它们创造了一个值得探索的复杂安全环境。\n\
  \n\n\n\n#### 区块链技术概述\n\n##### 数字哈希\n\n回顾一下，数字哈希是一种将字符串映射为固定大小表示（在此语境下通常为 32 字节）的函数，其特点是无法实际逆向还原，且两个相似的输入字符串会被映射到完全不同的固定大小表示。它们代表了输入字符串内容的摘要。\n\
  \n##### 公钥加密\n\n还要回顾的是，公钥密码系统使用一对私钥和公钥，允许双方在无需交换密钥的情况下通过加密进行通信。此类系统允许任何人向私钥持有者发送内容，并允许私钥持有者以不可抵赖的方式对任何内容进行数字签名。\n\
  \n##### 区块链基础\n\n区块链是一种分布式交易记录系统，旨在成为交易历史的永久记录。它由区块组成，每个区块包含一个时间戳和一条或多条交易记录，并按链式结构连接。每个区块都包含其前驱区块的数字哈希，因此实际上无法篡改前一个区块。\n\
  \n##### 交易流程与身份\n\n想要向区块链添加交易的用户必须拥有一个或多个私钥-公钥对。区块链上的活动与持有每对密钥的身份相关联，但该身份与拥有它们的特定个人之间没有必要的联系。当用户想要添加交易时，会将其广播给参与的计算机（节点），这些节点随后竞争获得将交易添加到链上的权利。获胜的节点称为发布节点。每个区块链系统必须有某种方式奖励发布节点，以激励它们参与竞争。这可以简单到收取一笔交易费。\n\
  \n不同的区块链设计采用多种机制进行这种竞争。所有机制的设计初衷都是防止单个节点或一组节点串通以永远获胜，从而能够破坏向区块链插入新区块的过程。\n\n#####\
  \ 共识机制\n\n###### 工作量证明\n\n第一种机制称为**工作量证明**。在此机制下，潜在的发布节点必须解决计算成本高昂但解决方案正确性易于验证的难题。想要串通的一组节点必须投入巨大资源才能始终最先解出难题，从而控制区块链。最先解出难题的节点获得将下一个区块添加到链上的权利，并将扩展后的链传播给所有参与区块链的节点。\n\
  \n可能会出现多个节点同时解出难题，并各自向区块链添加一个（可能不同的）区块的情况。\n\n工作量证明方法存在两大主要问题：\n\n1.  **生态灾难**：因为许多节点通过进行消耗大量电力的昂贵计算来竞争成为发布者。\n\
  2.  **高延迟**：由于链在一段时间内可能不一致，最好等到多个区块被添加到链上后，再确认特定交易已永久添加到链中——经验法则是等待后续六个区块。由于某些区块链每\
  \ 10 分钟才添加一个区块，这给成功完成交易带来了巨大的延迟。\n\n###### 权益证明\n\n第二种机制称为**权益证明**，其中获胜节点（即获得发布权的节点）按其在系统中质押的份额（通常是货币）比例随机选出。其理念是：在区块链正确运行上拥有利益的节点有动力使其难以被收买。随机选择获胜节点的过程经过精心设计，旨在尽可能增加破坏该过程的难度。精心设计成为发布节点的过程可以使其极不可能被腐蚀。\n\
  \n尽管权益证明方法不需要工作量证明所需的巨大计算量，但它们仍有性能成本。例如，长期运行的区块链链大小可达 200 GB（且必然还会增长），因此存储和移动链的成本很高。\n\
  \n##### 区块链类型\n\n###### 无许可区块链\n\n区块链可以是**无许可**的，使其真正实现分布式，用户和节点只需对其他参与实体保持最低限度的信任。区块链带来大规模系统性变革的大部分预期源于其去中心化特性，即交易不再需要受信任的中介（通常会收取少量服务费）。据称，无许可区块链消灭了许多形式的中介或守门人。\n\
  \n###### 有许可区块链\n\n区块链也可以是**有许可**的，例如完全在大型组织内部运行。由于实体间可以有更大的信任，这减少了某些区块链流程的摩擦。\n\
  \n##### 应用：加密货币\n\n区块链最显眼的应用之一是实现**加密货币**，其中比特币可能是最著名的。在此场景下，区块链用于记录所有金融交易，从而完整记录每个价值单位（如比特币）的所有权归属。价值从更广泛的金融系统进入区块链；一旦进入，它可以在不同身份间转移；最终可以移回更广泛的金融系统。由于身份仅通过加密密钥识别，用户可以匿名转移价值。这显然为罪犯和洗钱者创造了以无法追踪到他们的方式转移价值的途径。请注意，所有交易都是可见的；只是进行交易的个人身份被隐藏了。因此，加密货币的功能类似于“瑞士银行账户”，因为你无法知道谁拥有这些价值。\n\
  \n价值单位的所有权与用于获取该所有权的私钥相关联。大多数备受瞩目的“窃取”加密货币的黑客攻击，实际上都是非法获取了私钥，从而将价值单位转移给他人。这些私钥有时被称为数字钱包，因为拥有私钥等同于拥有区块链中记录的价值单位。\n\
  \n用于加密货币的区块链有一种自然的方式来奖励发布节点，即给予它们加密货币作为奖励。各国花费了数百年才理解如何保持货币稳定，而加密货币尚未解决这一问题。其相对于现实货币的价格剧烈波动，导致节点成为发布节点的激励也随之波动，使得潜在发布节点难以规划其资源投入。\n\
  \n##### 网络安全漏洞\n\n区块链存在许多网络安全漏洞，包括：\n\n*   **针对发布节点选择分布式机制的攻击**：这些机制旨在公平随机。攻击包括串通以使特定节点被选为发布节点，以及所谓的\
  \ **51% 攻击**，即超过一半的潜在发布节点被腐蚀，从而创建自己的竞争版本区块链，包含自己的交易（添加额外交易或删除真实交易），该版本比真实链更长，因此被采纳为权威链。\n\
  *   **利用未上链交易仅为数据这一事实的攻击**：这些交易可能被丢弃、篡改或误导。\n\n\n\n\n*   对（分布式）治理结构的攻击，该结构平衡了软件开发者、潜在发布节点集合以及用户自身的权力。这些群体中的每一个都对其他群体拥有一定的影响力，而其中任何一个群体中有足够多的恶意成员都可能破坏或腐蚀区块链。编写糟糕的软件也会导致问题，即使这只是意外造成的。例如，用于将价值从金融系统转移到加密货币区块链的代码中的软件错误，导致价值完全消失——可以说，它“在”区块链中，但以一种永远无法转移或提取的方式存在。\n\
  \n*   基于僵尸网络的攻击，旨在获取成为发布节点的奖励。不法分子利用僵尸网络执行所需的计算，甚至将毫无戒心的用户的浏览器用作计算引擎。由于此类发布节点无需支付电力或设备费用，工作量证明的经济成本收益比更具吸引力。\n\
  \n*   窃取私钥的攻击，即窃取数字钱包。由于私钥必须存储在某处（它们太长，无法每次都手动输入），因此成为极具吸引力的攻击目标。恶意软件可以搜索加密货币用户的计算机，寻找长度适合作为私钥的字符串，或者在用户向区块链转入或转出价值时监视剪贴板，随后窃取该字符串。\n\
  \n*   对区块链网络节点实施的拒绝服务攻击，阻止它们看到新交易，从而使其无法竞争成为这些交易的发布节点。这可能会扰乱区块链的整个运行，或通过在一轮竞争中淘汰某些潜在发布节点来扭曲竞争。\n\
  \n区块链依赖于其使用的加密协议保持足够强大。算法本身或其实现方式中存在漏洞的例子已有多起。区块链面临一个特殊问题，因为它们旨在成为永久记录。因此，在不与区块链之前的状态产生断裂的情况下，很难改变其工作的基本原理；而这种剧烈的变化往往会造成错误和漏洞。\n\
  \n## Chapter 8\n\n## Summary\n\n网络安全的大多数挑战最终都可以追溯到互联网的起源——名为 Arpanet 的研究网络。Arpanet\
  \ 连接了少量的大学和美国政府研究实验室，因此其用户是受信任且可问责的。Arpanet 还被设计为能在核攻击中幸存，因此其操作和控制在设计上就是分布式的。\n\n\
  Arpanet 从未打算成为全球网络的基础，而今天的互联网连接了世界上一半的人口和数十亿台设备。当今的互联网覆盖地球上的每一个国家，拥有 Arpanet 最初的设计者无法想象的能力，包括万维网、电子商务、在线银行和金融服务、社交网络平台、对管道和电网的分布式控制，以及远程控制的灯泡和恒温器。互联网不仅规模极大，而且是动态的，因为设备会随着开关机或故障而上下线，且数据流会在每个源和目的地之间瞬时最佳的路径上流动。\n\
  \nArpanet 的分布式特性意味着，随着它发展成为互联网，不存在对发生什么以及如何发生的中央控制。至今仍没有中央治理机构能强制所有硬件和软件开发者以特定方式行事。因此，全球决策复杂，需要各利益相关方之间的谈判，因而十分罕见。互联网的大多数变更都是由对新功能的渴望驱动的，想要实施变更的人必须获得那些也必须做出改变者的认可。互联网社区的规模、分布式治理和惯性，以及对向后兼容性的需求，意味着即使有明显好处的变更也无法实施，或者只能缓慢实施。\n\
  \n安全性不是那种可以在系统设计完成后添加进去的属性。虽然桥梁的设计可以修改以承受 30% 更大的负载，但复杂的软硬件系统无法真正通过修改使其安全性提高 30%。更安全的设计必须从一开始就着手，这对于已存在的系统来说是不可能的。所能做的只是加固，添加临时特性使突破安全变得稍微困难一些。关于设计和构建“互联网\
  \ 2.0”长期以来一直有提议，但都因当前互联网的沉没成本而搁浅。\n\n互联网中的大部分安全性都是围绕城堡隐喻构建的——高大的防护墙，配有限制数据流动的大门，仅允许经过认证的数据通过。认证仍然是一个复杂的问题，因为涉及的身份数量庞大，且认证点通常距离被认证的系统很远。许多类型的数据自由流动，因为没有方法能对其进行稳健认证（如电子邮件），或者出于商业原因不进行认证（如万维网）。\n\
  \n互联网用户对更高安全性的需求也很少，至少在新型基于互联网的服务的诱惑面前是如此。便利性在实践中总是胜过安全性，这是一条真理。\n\n互联网始于一个不太重视网络安全的基础设施；其规模和功能的爆炸性增长几乎没有提供激励或机会来添加安全特性；其分布式的性质和治理意味着没有杠杆能在开发者和用户偏好其他特性的情况下强制实施更好的安全性。网络安全的困难几乎都追溯到这一历史和这些驱动因素。\n\
  \n本可（至少理论上）简化为可处理问题的网络安全，已演变为一场消耗战。这场战争的对手分为三类：破坏者，为取乐而破坏；罪犯，将网络空间作为平台和机制通过犯罪获利；以及国家，将网络空间作为情报收集平台，并越来越多地作为国家政策的工具。\n\
  \n他们之所以能取得成果，是因为网络空间设计和运行中的弱点，也因为普通网络空间用户对危险缺乏足够的认识。网络空间中发生的许多事情对普通用户是不可见的。从某种角度看，这是一个成功故事，因为它向普通人隐藏了巨大的复杂性；但这也意味着他们不知道自己在网络空间中的哪些行为是安全的、哪些有风险、哪些是危险的。教育有助于解决这个问题，但网络空间变化迅速，几年前明智的建议今天可能不再适用。\n\
  \n使网络空间更安全的斗争有两个方面。第一是尽可能继续加固实例化网络空间的硬件和软件。问题在于，加固网络空间是一种全球公共产品，但不可避免地会让某些组织付出比其他组织多得多的成本——因此资源投入不足，好的想法因无法接触到能发挥作用的关键点而失败。\n\
  \n第二个方面是利用执法手段惩罚滥用网络空间的人。这存在许多问题：不同司法管辖区的法律框架各异，且法律与犯罪分子使用的漏洞利用之间存在滞后；执法人员的技能组合；以及犯罪分子能在一个国家生活却在另一个国家实施犯罪。\n\
  \n\n\n然而，执法方法面临的最大限制在于将在线身份与现实世界身份关联起来的问题。在线认证机制不够强健，无法将在线行为与实施者紧密绑定，当然更达不到“排除合理怀疑”的程度。在网络空间实施恶意行为者几乎无需担心刑事定罪。\n\
  \n网络安全可以得到改善，但只能通过微小的、积极的变化，而非优雅的大规模扫荡式行动。\n\n## 索引\n\n主动网络行动，48\n高级持续性威胁（APT），72\n\
