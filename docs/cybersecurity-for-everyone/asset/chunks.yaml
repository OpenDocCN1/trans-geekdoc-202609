- raw: "*   Helping new endpoints find a switch that can route traffic to wherever\
    \ they want to send it. Whenever a new computer joins a network it broadcasts\
    \ a request for a *router* (a switch containing a routing table). A nearby router\
    \ will respond, and the new computer will then know where to send outgoing traffic\
    \ to get the traffic started on its way. ICMP contains the functionality to carry\
    \ out the stages of this process.\n\n*   Discovering when a pipe or switch is\
    \ not functioning, and working out new routes to get around the problem. This\
    \ is done by including a “time to live” counter in an ICMP packet which is decremented\
    \ each time it travels from one node to the next. If the counter reaches zero,\
    \ a message is sent back to the originating node to say so. A node can use this\
    \ functionality to probe a pathway to see if it is operating properly.\n\n   \
    \ Although ICMP is a low-level protocol, this part of its functionality is available\
    \ at the application level (and so to computer users) via two apps called *ping*\
    \ which, when given an IP address, reports whether it exists on the Internet at\
    \ the moment, and *traceroute* which, given an IP address, reports all of the\
    \ intermediate nodes on the current path to it (if it exists). These apps were\
    \ designed for debugging network connection problems, but they also reveal a lot\
    \ about how systems are connected that can be used by an attacker for surveillance.\n\
    \n*   Handling congestion by allowing nodes to request that traffic coming to\
    \ them should be rerouted another way. This allows switches to deal with temporary,\
    \ local issues. However, it can (and has) been used to cause switches to reroute\
    \ all of their traffic through, say, another country where it can be analyzed\
    \ before onward transmission.\n\nIn a pattern we've seen before, the ICMP protocol\
    \ was designed to manage the operations of networks under the assumption that\
    \ ordinary users would not care about how it worked nor have access to it. It\
    \ therefore does not contain any security protections.\n\n# [6.2Domain Name Service](#contents.xhtml#sec6_2)\n\
    \nThe other behind-the-scenes system in cyberspace is the *Domain Name Service*\
    \ (DNS) which takes care of the mapping between human-readable computer names\
    \ and IP addresses. It is a distributed set of data tables recording the current\
    \ mappings. Domain Name Service (DNS)DNS\n\nTraffic to and from DNS servers uses\
    \ UDP, but this traffic is invisible to users—it is embedded in web browsers,\
    \ mailers, and other applications that need to resolve names to IP addresses.\n\
    \nA *domain* is a part of the name space that exists because computer names have\
    \ a hierarchical structure. For example, “.uk” is the domain of all computers\
    \ in the U.K., “gov.uk” is the set of all government computers in the U.K., and\
    \ “[data.gov.uk](http://data.gov.uk)” is the domain of systems that hold open-source\
    \ data from the U.K government.\n\nIn each subregion of the Internet, at least\
    \ one computer, the local DNS server, will hold mappings of names to IP addresses,\
    \ usually those that are relevant to whatever the local computers are doing. For\
    \ example, these local servers might hold the mappings for all of the computers\
    \ that belong to the same business or institution, local or remote, because the\
    \ local computers are likely to communicate with them; and also for popular web\
    \ sites for news or social media that users on the subnetwork typically use.\n\
    \nIf a device asks for a mapping that is not held by its local DNS server, this\
    \ server sends the request to a higher-level DNS server. If that server knows\
    \ the answer, it will return the mapping, which will be sent back to the original\
    \ requesting computer, and also stored in the local DNS server. This last step\
    \ is done because once one local computer requests a mapping, it is likely that\
    \ it or one of the other local computers will also want to know that mapping in\
    \ the near future. If the DNS server runs out of storage space for mapping, it\
    \ will delete the mapping that has been used the least in the recent past.\n\n\
    If the higher-level server doesn't know the mapping either it will send a request\
    \ to the next highest level, or perhaps skip some levels and go straight to the\
    \ top level DNS server. This top level DNS server knows how to find the DNS servers\
    \ for “.com” and “.uk” and all of the highest level domains.\n\nSome DNS servers\
    \ in the hierarchy are *authoritative* DNS server for a given domain and will\
    \ never delete the mapping for that domain. Thus there is an authoritative DNS\
    \ server for “.uk” and other DNS servers can always find a subdomain within “.uk”\
    \ by asking for it from the server that is authoritative for each subdomain. In\
    \ other words, authoritative DNS servers hold *the* definitive mapping between\
    \ a domain name and an IP address while lower-level DNS servers hold *copies*\
    \ of such a mapping.\n\nThe DNS system is complicated by the ability to define\
    \ *zones* which crosscut the hierarchical structure of domains and subdomains.\
    \ A business might have domains in different countries, for example, *[fredmart.com](http://fredmart.com)*,\
    \ *[fredmart.co.uk](http://fredmart.co.uk)*, and *[fredmart.com.au](http://fredmart.com.au)*\
    \ and might want to redirect web site visitors who visit any of their web sites\
    \ to the version appropriate for their country. They can set up an authoritative\
    \ DNS zone server for all of the *fredmart.\\** domains to make this happen.\n\
    \nThere doesn't have to be a 1-to-1 mapping between names and IP addresses. It\
    \ is common to map a name to more than one IP address as a way of load balancing,\
    \ so that traffic gets spread to different physical systems. This ability also\
    \ provides a way to deal with denial of service attacks by seamlessly providing\
    \ a way to distribute high-volume incoming traffic, even perhaps diverting traffic\
    \ from the locations participating in the attack so that attack traffic interferes\
    \ only with other attack traffic. Popular web sites can also add extra servers\
    \ at busy times in a transparent way.\n\nAlthough the DNS is a low-level system\
    \ it also has an application-layer interface using the *whois* command. This command\
    \ will provide the current mapping between a domain name and an IP address as\
    \ well as providing information on who owns the address and what its authoritative\
    \ name server is.\n\nThe DNS system has significant vulnerabilities. An attacker\
    \ who can cause a DNS server to pass a request on to a higher-level server and\
    \ then simulate a false response from that server can cause a false entry to be\
    \ included in that DNS server's mapping table. Subsequent requests for a mapping\
    \ by ordinary apps will be invisibly diverted to the wrong location.\n\nDNS servers\
    \ are also vulnerable to denial of service attacks. An attacker can generate many\
    \ requests for mappings for non-existent domain names. The mappings for them will\
    \ not, of course, be known and so will trigger a cascade of requests to higher-level\
    \ servers, none of which will know the mapping, and so on.\n\nThe weaknesses of\
    \ DNS have been partly addressed by allowing requests and responses to be encrypted.\
    \ This makes it harder for an attacker to insert false content because it wouldn't\
    \ be encrypted properly. However, older systems must still be served so this won't\
    \ help much until encryption of domain name requests and responses becomes obligatory.\n\
    \n# [6.3Switch vulnerabilities](#contents.xhtml#sec6_3)\n\nSwitches are just computer\
    \ systems configured so that they can handle lots of data transfers, and so they\
    \ can operate without direct human intervention. They have IP addresses of their\
    \ own, and they run standard system software. Switches are points of special vulnerability\
    \ because they are involved in all aspects of moving data. Being able to manipulate\
    \ switches creates unprecedented power to attack and disrupt."
  fmt: '

    # 6.2 Domain Name Service


    另一个在网络空间幕后运行的系统是 **域名服务**，它负责处理人类可读的计算机名称与 IP 地址之间的映射。它是一组分布式的数据表，记录着当前的映射关系。


    DNS 服务器的进出流量使用 UDP，但这种流量对用户不可见——它嵌入在 Web 浏览器、邮件客户端以及其他需要将名称解析为 IP 地址的应用程序中。


    **域** 是名称空间的一部分，之所以存在是因为计算机名称具有层级结构。例如，`.uk` 是英国所有计算机的域，`gov.uk` 是英国所有政府计算机的集合，而
    `data.gov.uk` 是存放英国政府开源数据的系统的域。


    在互联网的每个子区域中，至少有一台计算机，即 **本地 DNS 服务器**，将保存名称到 IP 地址的映射，通常是与本地计算机正在执行的任务相关的映射。例如，这些本地服务器可能保存属于同一企业或机构的所有计算机（无论本地还是远程）的映射，因为本地计算机很可能与它们通信；也可能保存用户通常使用的热门新闻或社交媒体网站的映射。


    如果设备请求的映射不在其本地 DNS 服务器中，该服务器会将请求发送到更高级别的 DNS 服务器。如果该服务器知道答案，它将返回映射，该映射会被发送回原始请求计算机，并**同时存储在本地
    DNS 服务器中**。之所以这样做，是因为一旦一台本地计算机请求某个映射，它或其他本地计算机在不久的将来也很可能想要知道该映射。如果 DNS 服务器映射存储空间耗尽，它将删除近期最少使用的映射。


    如果更高级别的服务器也不知道该映射，它会将请求发送给下一级更高的服务器，或者可能跳过某些级别直接发送给 **顶级 DNS 服务器**。顶级 DNS 服务器知道如何找到
    `.com`、`.uk` 以及所有最高级域的 DNS 服务器。


    层级结构中的某些 DNS 服务器是特定域的 **权威 DNS 服务器**，它们永远不会删除该域的映射。因此，`.uk` 有其权威 DNS 服务器，其他 DNS
    服务器总能通过询问每个子域的权威服务器来找到 `.uk` 内的子域。换句话说，权威 DNS 服务器持有域名与 IP 地址之间的**权威映射**，而较低级别的
    DNS 服务器持有此类映射的**副本**。


    DNS 系统因 **区域** 的定义而变得复杂，区域横跨域和子域的层级结构。例如，一家企业可能在不同国家拥有域名，如 `fredmart.com`、`fredmart.co.uk`
    和 `fredmart.com.au`，并希望将访问其任何网站的访问者重定向到适合其国家的版本。它们可以为所有 `fredmart.*` 域名设置一个权威
    DNS 区域服务器来实现这一点。


    名称与 IP 地址之间不必是一对一的映射。将一个名称映射到多个 IP 地址是常见做法，用于负载均衡，使流量分散到不同的物理系统。这种能力也提供了一种应对拒绝服务攻击的方法，通过无缝分发大量入站流量，甚至可能将参与攻击的位置的流量分流，使攻击流量仅干扰其他攻击流量。热门网站也可以在繁忙时段透明地添加额外服务器。


    虽然 DNS 是一个低级系统，但它也通过 `whois` 命令提供应用层接口。该命令将提供域名与 IP 地址之间的当前映射，以及关于地址所有者及其权威名称服务器的信息。


    DNS 系统存在重大漏洞。如果攻击者能导致 DNS 服务器将请求转发给更高级别的服务器，然后模拟来自该服务器的虚假响应，就能导致虚假条目被包含在该 DNS
    服务器的映射表中。普通应用程序随后对映射的请求将被不可见地重定向到错误位置。


    DNS 服务器也容易受到拒绝服务攻击。攻击者可以生成大量针对不存在域名的映射请求。这些域名的映射当然是未知的，因此会触发级联请求到更高级别的服务器，而没有任何一台服务器知道该映射，以此类推。


    DNS 的弱点已通过允许请求和响应加密部分得到解决。这使得攻击者更难插入虚假内容，因为虚假内容无法被正确加密。然而，旧系统仍需支持，因此在域名请求和响应的加密成为强制要求之前，这帮助不大。


    # 6.3 Switch vulnerabilities


    交换机只是配置为能够处理大量数据传输的计算机系统，因此它们可以在无需人工直接干预的情况下运行。它们拥有自己的 IP 地址，并运行标准系统软件。交换机是特殊的脆弱点，因为它们参与了数据移动的各个方面。操纵交换机的能力创造了前所未有的攻击和破坏力量。

    '
