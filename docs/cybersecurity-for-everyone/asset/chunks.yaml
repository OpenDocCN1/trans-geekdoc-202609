- raw: 'Unlike deep web sites that conceal themselves by not have explicit connections
    to the rest of the World Wide Web, dark web sites require special mechanisms to
    reach their nodes. These might be completely different ways of communicating,
    so that the apps used must be built from the ground up. Other, more popular, parts
    of the dark web look like the World Wide Web, with addresses that look a bit like
    conventional URLs, but they have to be reached in a different way.


    A dark web site, even when you know its address, cannot be directly reached by
    your browser. The most common part of the dark web is based on the *Tor anonymizing
    router*. This router accepts requests to connect to dark web sites whose addresses
    look like URLs except that they end in “.onion”. It then uses a network of volunteer
    computers to randomly route the traffic through intermediate sites to break the
    connection between you and the web site you are connecting to. Finally Tor-based
    dark web sites will only accept connections from nodes on the Tor network. So
    between you and dark web sites is the Tor router which decouples what you do (which
    might be visible to someone watching your node) from the target web site you are
    visiting. Watching the other side of the Tor network can reveal that someone is
    visiting a particular dark web site, but there''s no way to tell


    Dark web sites like these sell products such as drugs, weapons, cyber attacks,
    stolen credit cards and credit card numbers, and are used for human trafficking.
    They are also used for more benign purposes such as allowing protest movements
    to communicate and plan, and there are even dark web versions of conventional
    web sites for those who don''t want their online activities tracked.


    There is another part of the dark web (the darker web) that uses its own protocols
    to communicate. This of course requires specialized software at both ends (a dark
    web browser and a dark-web web server) to make sense of what is being communicated.


    # [2.10The World Wide Web](#contents.xhtml#sec2_10)


    For many, the World Wide Web *is* the Internet. This is because web browsers can
    do many of the things that ordinary people in cyberspace do, and do so within
    a single environment. This idea has been made explicit in the Chromebook, a laptop
    that has only a web browser interface to the Internet. We return to the Web in
    [Chapter 7](#07chap_07.xhtml).


    # [2.11Social aspects](#contents.xhtml#sec2_11)


    Although cyberspace is a technical artifact, it exists within and, in many ways,
    enables our social interactions and this necessarily has an effect on the way
    it functions and is used.


    The original basis for the Internet was Arpanet, developed by the U.S. government
    to facilitate research and connecting a small set of universities and research
    labs. Much of the design of the Arpanet survives into the Internet even though
    this is wildly inappropriate, because the Internet developed incrementally. There
    have been several iterations of research projects to design a new Internet from
    the ground up, but they have all run up against the sunk costs of existing systems.


    In particular, the Arpanet connected trusted sites so very little attention was
    paid to making it secure. Network security has had to be entirely retrofitted.


    The allocation of IP addresses (and domain names) is managed by international
    consortia, so you can''t just connect a computer to the Internet. For ordinary
    citizens, their IP addresses are managed by their Internet Service Providers who
    might either allocate a fixed IP address to each user (really, their connection
    point to the ISP''s internal network) or generate one dynamically each time a
    computer is connected. (This is further complicated because a home modem or router
    might present a single IP address to the outside world, but generate local IP
    addresses for each computer and phone in a household.)


    However, this allocation process, while it has some structure, does not provide
    a simple mapping between IP address and location in the world, For example, a
    large organization might be allocated a large range of IP addresses, say 100.200.\*.\*
    and might allocate these to their computers in many different places. And, of
    course, if ISPs allocate IP addresses dynamically, there is no necessary relationship
    between an IP address and a street address.


    So networks are quite chaotically structured, and there is very little of what
    might be called “management” except in the most basic sense. If something is wrong
    there is nobody to complain to. Progress is made by collaboration between supranational
    bodies, national governments, and large players such as big ISPs and multinational
    businesses. There is no cyberspace police force to enforce even the simplest of
    secure behavior.


    The greatest social force, however, that introduced insecurity to the Internet
    is that convenience almost always trumps security. This continues to be a powerful
    force. In setting after setting, when individuals, businesses, and governments
    must make trade-offs between these two properties, convenience wins. Thus while
    the Internet began with little security, subsequent developments did not introduce
    security where they could have because of considerations of performance, cost,
    lack of imagination, and the need to produce results against deadlines. As cyberspace
    scales and becomes more pervasive, most of the cybersecurity issues that we now
    see will become more impactful, and no doubt there are new issues that we are
    not aware of yet.


    Another issue that causes security problems in cyberspace is that so much of what
    goes on is both hidden from view and unintuitive. This is partly the success of
    the Internet; people can use a web browser to access the world''s information
    without really understanding anything about what happens behind the scenes to
    give them that experience. Contrast this with a transportation system such as
    trains, stations and tracks. We might not understand much about signalling systems
    or how a locomotive works but at least we have some intuition about how trains
    are formed from carriages, how trains must wait for a green light, and how long
    it might take to get from one place to another. Without this intuition, it is
    difficult for ordinary people to make informed decisions about how to act.


    Most of cyberspace is self-managing in the sense that ordinary data traffic moves
    from place to place without human intervention. Indeed much of what goes on is
    too complex for direct management. However, there must be places where humans
    control aspects of cyberspace, albeit at a high level of abstraction, and ordinary
    users of cyberspace also “control” it in the sense of deciding to go here or go
    there, do this or do that.


    This interface between humans and cyberspace creates a new vulnerability that
    is known by the umbrella term of *social engineering*. Social engineering refers
    to all of the ways in which cyberspace can be manipulated by manipulating the
    actions of humans as they interact with it. This can range from the way in which
    social media businesses create traffic using stickiness and clickbait


    # [2.12Governance](#contents.xhtml#sec2_12)


    As we have seen, the Internet has a kind of loose governance structure that is
    slightly American-centric because of its origins. Much of the infrastructure is
    owned and managed by large Internet Service Providers (ISPs) or telecommunications
    companies. The necessity to remain consistent with all of the other parts of the
    Internet constrains any given infrastructure owner. One of the biggest issues
    making any kind of improvement to cyberspace is the sheer number of stakeholders,
    with a wide variety of understanding of the issues.'
