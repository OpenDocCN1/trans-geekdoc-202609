- raw: 'Just like real-world highways, there must be mechanisms to deal with the failure
    of an edge, so that traffic can be routed around the point of failure. Routing
    tables must therefore be constantly updated to reflect the changing landscape,
    and this also requires control messages.


    The variability of traffic also means that entire areas can become congested,
    so that traffic might need to be routed around an entire region to avoid the congestion.
    As in the real world, this can create a dynamic situation where instability can
    occur—traffic is directed around a congested area creates a new congested area
    and leaves the original area much less congested. And then the process reverses
    itself. The congestion control mechanism can be subverted (as it can be in the
    real world) to create artificial congestion, or to divert traffic to a particular
    place where it could be analyzed by an adversary.


    A particular node or set of nodes might want to block traffic coming from some
    parts of the world, or to block certain types of traffic, so the network also
    contains gates called *firewalls*. These can block off an entire country, for
    example, the so-called Great Firewall of China, but they are more commonly used
    to prevent only certain kinds of traffic from getting inside the subnetworks of
    businesses or governments. In other words, they act as filters for traffic, allowing
    some and discarding others.


    Individuals also use a kind of gate on their phones or personal computers. These
    are known as *malware detection systems* or *antivirus systems* that prevent certain
    kinds of traffic from entering.


    As well as the control functions that keep traffic flowing, and flowing in the
    right direction, another aspect of network management is the way in which human-directed
    addresses ([cnn.com](http://cnn.com)) are mapped to IP addresses, so that they
    can be accessed. The mechanism that does this is the *Domain Name Service* (DNS).
    It consists of a set of special systems that maintain mappings between one kind
    of name and the other. Domain Name Service (DNS)DNS


    The Internet is by far the largest network on the planet, connecting devices in
    all countries. However, there are other networks which are not (at least in theory)
    connected to the Internet. Most militaries have their own separate, more secure
    networks which have no direct connection to the Internet. These networks, while
    physically separate, use the same kinds of nodes, pipes, and control mechanisms
    as the Internet because it would be impractical and expensive to do otherwise.
    This makes them vulnerable to many of the same attacks as the ordinary Internet
    if an attacker can gain access to them—monoculture at work again.


    The separation between networks can be illusory, so that it is sometimes possible
    to jump the “air gap” between them. For example, the Stuxnet malware that was
    used to break Iranian uranium centrifuges was introduced via USB keys that were
    loaded from the Internet and then plugged into computers on the separate network
    that controlled the centrifuges. This is a common weakness with these separate
    networks—there has to be a mechanism to update the software on the nodes within
    them, and this creates a channel for bridging to them.


    Whenever a device on the Internet and a device on one of these separate networks
    are close to one another they may also be able to communicate using audio at frequencies
    to high for humans to hear, or using the camera of one to take images of the screen
    of the other.


    # [2.7Types of traffic](#contents.xhtml#sec2_7)


    The key development that made the internet possible is the idea of *packet switching*.
    Packet switching was invented for the same reason that banks and similar organizations
    stopped using multiple queues in favor of one large queue with multiple servers.
    If data transfers happened by transferring the first entire tranche of data, and
    then the second, and so on, small tranches would have to wait, potentially a long
    time, for large ones to complete. Imagine a text message caught behind a movie
    download.


    Instead every tranche of data to be sent over network connections is divided into
    quite small pieces, and each piece is sent independently. This means that small
    data transfers don''t get stuck behind large data transfers because pieces makes
    progress to their destination at about the same rate no matter which tranche they
    came from. A small data tranche will have delivered all of its pieces sooner than
    a big one, but dividing them all up uses the pipe capacity fairly. (As we shall
    see, this technique introduces overheads in dividing up and re-assembling chunks
    of data which brings its own problems.)


    While packet switching is egalitarian, it does mean that some kinds of data are
    not well served. For example, if the data transfer is a large video that is being
    watched in real-time at the destination (not just downloaded) it is crucial that
    new frames appear at a rate fast enough to be viewable. Traffic like this has
    a constant series of deadlines to be met, and other traffic that interferes with
    meeting these deadlines has a direct, observable performance impact.


    Voice is often carried over networks by converting it to data (called *Voice Over
    IP*—VOIP) and this has the same issue. If the next piece of speech doesn''t arrive
    in time to be played back at an appropriate speed, the audio quality sounds choppy
    and feels unsatisfactory. As humans, we can detect delays in the millisecond range,
    even if not consciouslyVOIP


    To handle these kinds of special traffic, using a mechanism that moves only packets,
    extra layers of protocols are used. This introduces added complexity to the operation
    of the pipes, which must treat urgent traffic specially, and nodes, which must
    make sure that they have enough free buffer capacity to keep it flowing.


    # [2.8The Deep Web](#contents.xhtml#sec2_8)


    There are parts of the Internet that are not routinely accessible to everyone.
    We have already mentioned networks that are not connected (at least in theory)
    to the Internet.


    Another part of cyberspace that is less accessible to ordinary users is called
    the *deep web*. This contains nodes and so content that are not indexed by search
    engines and so are mostly invisible because they can''t be found directly.


    The deep web consists of two different kinds of content. The first is content
    that is hidden in the sense that it cannot be accessed simply by somebody deciding
    to visit the web page that contains it. When you log in to a web site, you gain
    access to content, often personalized content, that comes from a store of data
    at that site. For example, when you log in to your bank, you can see your account
    balances. Content like this cannot be seen by anybody else, and it cannot be indexed
    by search engines because it exists only when you, individually, are looking at
    it.


    The second part of the deep web consists of nodes that have no public path to
    them. The way that search engines find all of the pages in the World Wide Web
    is to start from obvious places and then follow links to find new places. If a
    web site, say, is set up and there are no links that point to it then it cannot
    be discovered in the normal way. Such a web site could still be useful by giving
    out its address to trusted friends. (This is an example of security by obscurity
    since it relies on the email that contains the address not being scanned by an
    email provider who could then extract the address and search it.)


    # [2.9The Dark Web](#contents.xhtml#sec2_9)


    The *dark web* is that subset of the deep web containing nodes that are explicitly
    trying to be hard to find, usually because they are used for something illicit
    and often illegal'
  fmt: '

    正如现实世界的高速公路一样，必须有机制来处理边缘故障，以便流量能够绕过故障点进行路由。因此，路由表必须不断更新以反映不断变化的网络拓扑，这也需要控制消息。


    流量的变异性也意味着整个区域可能变得拥塞，因此可能需要将流量绕过整个区域以避免拥塞。正如现实世界中那样，这可能会造成一种动态局势，导致不稳定发生——将流量引导至拥塞区域周围会产生新的拥塞区域，而原来的区域则变得不那么拥塞。随后这一过程会反向进行。拥塞控制机制可能被颠覆（现实世界中也是如此），以制造人为拥塞，或将流量引向特定地点以便对手进行分析。


    特定节点或节点集可能希望阻止来自世界某些部分的流量，或阻止特定类型的流量，因此网络中也包含称为`firewalls`（防火墙）的网关。例如，这些网关可以封锁整个国家，即所谓的“中国防火墙”，但它们更常用于仅阻止特定类型的流量进入企业或政府的子网络。换句话说，它们充当流量过滤器，允许某些流量通过而丢弃其他流量。


    个人也会在手机或个人电脑上使用一种网关。这些被称为`malware detection systems`（恶意软件检测系统）或`antivirus systems`（杀毒系统），用于阻止特定类型的流量进入。


    除了维持流量流动且方向正确的控制功能外，网络管理的另一个方面是将人类可读的地址（如`cnn.com`）映射为 IP 地址，以便访问。实现这一机制的是`Domain
    Name Service`（DNS，域名服务）。它由一组维护两种名称之间映射关系的特殊系统组成。


    互联网是目前地球上规模最大的网络，连接着所有国家的设备。然而，还有其他网络（至少在理论上）未连接到互联网。大多数军队拥有自己独立、更安全的网络，这些网络与互联网没有直接连接。尽管这些网络在物理上是隔离的，但它们使用与互联网相同类型的节点、管道和控制机制，因为否则做法既不切实际又成本高昂。这使得它们一旦被攻击者访问，就会面临与普通互联网相同的许多攻击——单一文化问题再次显现。


    网络之间的隔离可能是虚幻的，有时可以跨越它们之间的“气隙”。例如，用于破坏伊朗铀离心机的 Stuxnet 恶意软件，是通过从互联网加载的 USB 密钥引入的，随后这些密钥被插入控制离心机的隔离网络计算机中。这是这些隔离网络的常见弱点——必须有机制更新其中节点上的软件，而这创造了一个桥接通道。


    每当互联网上的设备与这些隔离网络上的设备彼此靠近时，它们还可能利用人耳听不到的高频音频进行通信，或利用一台设备的摄像头拍摄另一台设备的屏幕图像。


    ## 2.7 流量类型


    使互联网成为可能的关键发展是`packet switching`（分组交换）的概念。发明分组交换的原因，正如银行等机构不再使用多队列，转而采用单一大队列配合多服务窗口一样。如果数据传输是先传完第一整批数据，再传第二批，依此类推，小批量数据将不得不等待，潜在时间很长，直到大批量数据传输完成。想象一下一条短信卡在电影下载后面的情景。


    相反，发送到网络连接上的每一批数据都被分割成相当小的片段，每个片段独立发送。这意味着小数据传输不会卡在大数据传输后面，因为无论片段来自哪一批数据，它们以大致相同的速率向目的地推进。小数据批次会比大批次更早传完所有片段，但将所有数据都分割开能公平地利用管道容量。（正如我们将看到的，这种技术在分割和重组数据块时引入了开销，这本身也带来了问题。）


    虽然分组交换是平等的，但也意味着某些类型的数据得不到良好服务。例如，如果数据传输是实时观看的大型视频（而非单纯下载），关键在于新帧必须以足够快的速率出现以供观看。此类流量面临着持续不断的截止日期要求，其他干扰这些截止日期的流量会产生直接、可观察的性能影响。


    语音通常通过转换为数据（称为`Voice Over IP`，即 VOIP）在网络上传输，这也有相同的问题。如果下一段语音数据未能及时到达以便按适当速度播放，音频质量会听起来断断续续，体验不佳。作为人类，我们能察觉毫秒级的延迟，即使无法有意识地感知。


    为了处理这些特殊流量，仅使用移动数据包的机制，需要额外的协议层。这增加了管道操作的复杂性，管道必须对紧急流量特殊对待；节点也必须确保有足够的空闲缓冲容量以维持其流动。


    ## 2.8 深网


    互联网中有部分内容并非对所有人常规可访问。我们已提到过那些（至少在理论上）未连接到互联网的网络。


    另一个对普通用户不太可访问的网络空间部分称为`deep web`（深网）。它包含未被搜索引擎索引的节点和内容，因此大多不可见，因为无法直接找到它们。


    深网包含两类不同的内容。第一类是隐藏内容，指不能通过简单访问包含它的网页来获取。当你登录网站时，你获得了访问该站点数据存储中内容的权限，这些内容通常是个性化的。例如，登录银行网站时，你可以看到账户余额。此类内容他人不可见，也无法被搜索引擎索引，因为它仅在你个人查看时才存在。


    深网的第二部分由没有公共访问路径的节点组成。搜索引擎查找万维网所有页面的方式是从显而易见的地方开始，然后顺着链接发现新地方。如果一个网站建立后没有任何链接指向它，就无法通过常规方式发现。但该网站仍可通过将地址分享给可信赖的朋友来发挥作用。（这是`security
    by obscurity`（隐匿性安全）的一个例子，因为它依赖于包含地址的邮件不被邮件提供商扫描，从而提取地址并搜索。）


    ## 2.9 暗网


    `dark web`（暗网）是深网的子集，包含试图隐藏自身的节点，通常因为它们用于非法或违法活动

