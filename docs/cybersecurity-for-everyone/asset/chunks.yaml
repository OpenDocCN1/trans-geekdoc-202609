- raw: 'However, the biggest limitation to the law enforcement approach is the problem
    of associating online identities with real-world identities. The mechanisms for
    authentication online are not strong enough to tie online actions tightly to those
    who carried them out, certainly not to the level of “beyond a reasonable doubt”.
    Those who carry out malicious acts in cyberspace have little need to fear criminal
    conviction.


    Cybersecurity can be improved but by small, positive changes not by elegant sweeping
    large-scale actions.


