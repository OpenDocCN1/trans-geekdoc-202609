    *   **拥塞控制**，通过信号告知发送方何时停止发送以便接收方追赶进度。\n*   **更复杂的寻址方案**，发送方和接收方均使用 `IP` 地址和**端口号**的组合。节点上运行的每个预期与外界交互的软件使用特定端口。某些常用软件的端口号预先确定且广为人知——例如\
    \ Web 流量用端口 `80`，邮件用端口 `25`，域名服务用端口 `53`。其他软件每次启动时选择端口号。这些 `IP` 地址和端口号的组合标识了节点及其上运行的特定软件，确保数据来自并送达正确位置。\n\
    \n`TCP` 为互联网上两设备提供稳健通信，但若路径上某些管道较小、发生拥塞、或两端传输时间长，速度会相对较慢。\n\n## 5.3 UDP 协议\n\n\
    在交付速率至关重要的场景下，还有一种可用的高层协议。它称为**用户数据报协议**，即 `UDP`，提供与 `IP` 同类功能——尽力而为交付，无排序或错误控制——但具备\
    \ `IP` 地址 + 端口寻址。因此 `UDP` 以牺牲可靠交换换取快速端到端交付。\n\n`UDP` 用于延迟比偶尔丢包更重要的应用。此类应用通常主要单向流式传输数据。例如网络电话（`VOIP`）、视频传输（`Skype`、`Netflix`）。有时也用于可假设高可靠性的局域网（如远程桌面协议），因其避免了\
    \ `TCP` 的开销。\n\n## 5.4 利用协议的攻击\n\n所有这些协议设计之初环境更受信任，面对的系统性能约束比当今大多数系统更大。因此它们极易受到攻击。\n\
    \n以下是涉及管道的一些常见攻击：\n"
