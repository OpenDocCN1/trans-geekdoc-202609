- raw: 'Web browsing is the most intuitive. Web content is stored on large computer
    systems, called web servers. Whenever someone opens a browser and enters a URL
    (or clicks a link), a request is sent to the corresponding server and a web page
    is sent back to the browser. Although the interface creates the impression that
    we visit a web site, the reality is that pages from the web site visit us. Web
    server


    In the early days of the Web, web servers provided prebuilt web pages to browsers
    which were then responsible for displaying them on whatever device the user was
    using. The Hypertext Markup Language (HTML) describes what kind of thing each
    piece of the web page is (a heading, a paragraph) which enables the web browser
    to display the page in whatever way produced the best effect on the particular
    device that the user is using. For example, the browser can fit the displayed
    page to the available screen size, HTML


    More interesting possibilities arose when web servers were given the ability to
    create pages dynamically as they were requested. Now the web page that a particular
    user sees can be customized for that user—perhaps different for users in different
    countries or regions.


    This ability becomes even more powerful when the user''s browser can communicate
    individualized information to the server. The obvious use of this is search—a
    user inputs search terms and the search engine (a specialized kind of web server)
    sends back a customized page of results that match the uploaded search terms.
    A user can communicate with a bank web server and be presented with a page containing
    their own individual account balances.


    The next stage happened when browsers became capable of downloading small pieces
    of software, along with page content. A web server, using this mechanism, can
    have a browser do something on its behalf. This is the key to online banking,
    online shopping, and all of the other interactions that are two-way, with users
    entering information as well as viewing content.


    These mechanisms also have a negative side—they can and are used to store information
    in the browser (*cookies*) that can identify when the same user revisits the same
    web server and, increasingly, other servers as well. In other words, this rich
    channel of communication becomes the conduit for tracking user behavior.


    In some interactions, the emphasis is more on the flow of information from the
    user to the site rather than the other way around; for example, uploading videos
    to Youtube. The mechanism is the same—the server downloads code which sets up
    a communication channel from browser to server that controls the upload.


    Social media sites use this same basic mechanism but, instead of a (general purpose)
    browser they package the interactions within an app which, as much as possible,
    they get users to download. The advantage to the social media site or business
    is that the app can run *any* code, rather than the limited code that runs within
    a browser. The interaction can be richer because of this. This richer interaction
    is not necessarily a good thing—it''s what makes it possible to collect data about
    each user (and sometimes their system) in a detailed way.


    Many other businesses do the same thing: creating an app which interacts directly
    with their web server, rather than having users visit their web site using a browser.
    The app is little more than a specialized front-end to their web site, but it
    allows the same kind of richer interaction. This is mostly a benefit to the business
    rather than the user. The risk with all apps of this kind is that they may be
    poorly implemented and so have serious security weaknesses of their own, and they
    don''t take advantage of the security measures that are built in to most modern
    browsers.


    The other major way in which users encounter cyberspace is as a communication
    tool: emails, messaging (in multiple forms), and video chat. Some of these are
    symmetric interactions between one user''s device and the other''s, but some communication
    apps route all of the communications through a server. The first option is harder
    to implement but more private, but most tools use the second option.


    It''s also useful to distinguish between communications that are synchronous (the
    message travels immediately to the other end) such as video chat and messaging;
    and communications that are buffered or asynchronous, that is, can be stored at
    some intermediate location until the receiver is available (emails).


    There are many other aspects of cyberspace that are not obvious to an ordinary
    user. Many businesses maintain communication with their employees, especially
    those who do not work from an office. They also collect data, typically in real-time,
    about their business activities. For example, transportation systems keep track
    of where every train or plane is at all times, and many other details of how they
    are performing and when they may need maintenance. To make possible online hotel
    booking sites, hotel chains must keep a constant accurate record of which rooms
    are available when. Retail stores keep track of exactly what has been sold at
    each of their stores so that they can load and dispatch a delivery truck that
    will arrive exactly when needed with exactly the right products on board. Electricity
    grids and oil and gas pipelines must track performance throughout their delivery
    systems and be able to control remote equipment to turn it up or down, or on or
    off.


    Businesses also use cyberspace to communicate with one another, to provide information
    about supply chains or to buy from one another in the same way that we buy from
    online retailers. Unlike consumers shopping online, these interactions are often
    automated. For example, automobile assembly lines are based on just-in-time delivery
    of all of the components from their suppliers so that parts arrive at the assembly
    line just as they are needed. This reduces the costs and space required for warehousing.


    Governments have a citizen-facing use of cyberspace in which they provide services
    to citizens online, renewing drivers'' licenses, collecting taxes, and so on.


    Governments also use cyberspace as an instrument of power. Almost all communication
    travels in cyberspace, so a great deal of the collection of intelligence has moved
    from radio interception into cyberspace interception. Governments also use cyberspace
    as a weapons system, planning (and sometimes carrying out) cyberattacks against
    other states.


    Criminals use cyberspace, both as a way to gather information and to carry out
    criminal exploits. Until recently it was difficult to make money directly in cyberspace
    except by attacking financial institutions and financial transfers directly, but
    the rise of *cryptocurrencies* has made it possible to extort money from individuals
    and businesses, untraceably, and this has created a new set of crimes in cyberspace.


    So the part of cyberspace that ordinary people see is the tip of an iceberg. There
    is a great deal of other communication and interaction between organizations and
    within cyberspace itself. The system as a whole is too complex for direct human
    management so there is also a layer of self-management that takes place behind
    the scenes to make sure that connections keep functioning even when the actions
    users take change.


    Individuals face security issues in cyberspace, but there are many other vulnerabilities
    in the other, less visible, parts of cyberspace as well.


