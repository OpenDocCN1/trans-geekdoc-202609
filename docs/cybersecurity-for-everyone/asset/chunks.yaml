- raw: 'The main solution to protocol weaknesses is to encrypt the data being moved
    (but this doesn''t prevent traffic analysis), and using protocols that work at
    a higher level still to look for and correct issues and deficiencies at the TCP
    level. These protocols, called *application layer protocols*, treat TCP in the
    same way as TCP treats IP. They assume that there is a way to set up sessions
    and use them to transfer data (which is what TCP does) but they impose their own
    checks on data transfers to make sure that it happens correctly.


    An important higher-level protocol is a *virtual private network* (VPN) which
    treats all of the traffic from a node as a single encrypted flow to another, trusted,
    node where it is unpacked and travels normally to wherever it is going. This protects
    all of the data as it travels over the VPN and prevents eavesdropping over that
    part of the journey. Usually, one node is a personal or business computer and
    the other node is owned by the VPN provider. Virtual Private Network (VPN)VPN


    Because *all* traffic is mixed together in the VPN, it is much harder to get useful
    information from traffic analysis or to target one particular session. Of course,
    this only defends the communication over the section that uses the VPN, so this
    is only a protection for a particularly untrustworthy part of the Internet. A
    VPN works rather like ships travelling in a convoy for protection.


    Using a VPN has the side-effect of making the traffic appear to originate from
    the trusted node rather than its real origin. This is used to evade country-specific
    limits on, say, streaming video services but also for dissidents to use cyberspace
    without detection or interference from their governments.


    Unfortunately, attackers have used VPNs to their advantage by presenting themselves
    as VPN providers and getting users to sign up to use their VPNs—and then observing
    the traffic as it passes through the alleged “trusted” node.


    Another critical way in which nodes deal with the insecurities inherent in pipes
    is by using *firewalls*. Firewalls can either be standalone switches or software
    contained in existing switches. They contain a set of rules about what kinds of
    traffic can pass; all other traffic is discarded. The rules typically apply at
    the level of TCP traffic so they can describe which combinations of source and
    destination IP addresses and ports are acceptable while blocking all others.


    Since some ports are strongly associated with particular kinds of traffic, this
    also means that certain kinds of traffic can be allowed and others disallowed.
    Unfortunately, although port 80 is reserved for web traffic, so many different
    actions can be carried out using a web browser, that allowing port 80 traffic
    through a firewall opens the floodgates to many different kinds of activities.


    Some firewalls treat each segment independently and simply check that it satisfies
    a rule allowing entry. More sophisticated firewalls keep track of sessions (since
    they can see the segments that set them up) and make sure that all otherwise acceptable
    traffic also has a session to which it belongs.


    Firewalls can exist at all scales—from walling off an entire government or multinational
    business, down to a single local network.


    Firewalls that examine and block traffic carried by an application layer protocol
    are usually called *intrusion detection systems*. The antivirus and antimalware
    apps that run on personal computers and phones work in this way. They examine
    incoming files such as attachments to emails or content of web pages to see if
    they contain malware. In other words, they wait until traffic from lower levels
    has been assembled into complete objects, and then examine these objects to see
    whether they are allowable.


    Because they are more aware of the purpose of traffic and because they can afford
    to spend more time and resources, intrusion detection systems can be more sophisticated
    in what they detect than firewalls can.


    The pipes between two systems can be either point-to-point or involve broadcasting
    to more than one system. For example, wired networks connect computers to one
    another using a switch, which makes it harder for an attacker to sit on the network
    and eavesdrop. Wireless networks, at least potentially, make all transfers visible
    by every other device on the network, and so eavesdropping is straightforward.


    For cell phones, by far the easiest way to intercept traffic is to get the user
    to install an app with wide access to the phone''s apps and capture the traffic
    while it is still within the phone. A second strategy is to create a *fake cell
    tower*, convince the phone to connect to it, record the traffic, and pass it on
    to the real cell tower. Since phones normally connect to the tower with the strongest
    signal, this only requires the fake tower to be closer than the real tower. Interception
    of voice calls and text messages sent using standard telephony is straightforward
    and products to do so can be purchased, and require little expertise to use.


    Intercepting wireless network traffic is also straightforward, but depends on
    the precise network configuration. Network interfaces, both switched and wireless,
    are capable of broadcasting to all nodes in their local region, and this can often
    be turned on surreptitiously by an attacker.


    Finally, pipes can be physically broken (often by digging in the wrong place)
    and when this happens it can cause large-scale chaos.


