- raw: 'The nature of email means that security is inherently difficult. Email servers
    must be easily discoverable; otherwise a sending email server wouldn''t know where
    to send each email. (It is actually a bit more complex and subtle: an email sent
    to an address of the form [jsmith@corporation.com](mailto:jsmith@corporation.com)
    will actually be sent to a domain such as [mailserver.corporation.com](http://mailserver.corporation.com),
    so more than just DNS is involved.) This means that at least one computer for
    any organization must be visible to the outside world, providing an unavoidable
    starting point for an attacker to learn about the organization''s internal computer
    system setup.


    By design, emails are supposed to get from one email server to another, so this
    kind of traffic cannot be blocked by firewalls. Intrusion detection systems must
    do the work of deciding whether an email should be allowed to pass. The email
    system is open in the sense that anyone is allowed to send an email to anyone
    else whose email they know or can guess, so IDS rules don''t usually block emails
    based on where they come from. As the problem of spam shows, this weakness causes
    annoyances for users, and spam detection systems only do a moderately good job
    of dealing with it.


    Email contents are not usually encrypted, so the contents can be read by any system
    or switch through which an email passes. There have been many attempts to address
    this issue, all of which have been too much work to have received much uptake.
    Public key cryptosystems do, of course, work. If you know the public key of the
    person you are sending an email to you can encrypt the contents with that key
    and the receiver can decrypt it, confident that it couldn''t have been read in
    transit. Doing this requires knowing the receiver''s email address and public
    key which could be done by the sender on a one-off basis, but would require a
    major redesign of the entire email system to automate.


    Originally emails were simply text, but email today can contain attachments in
    a wide variety of formats. Many of these attachments can legitimately contain
    executable code. For example, a Microsoft Word document can contain executable
    macros that have an effect on how they are displayed, even though a Word document
    looks like it ought to be just a container for text and images. This makes it
    possible to construct attacks in which the executable code in an attachment installs
    malware on the system where the email is opened, which is the basic mechanism
    of phishing. Although antivirus and antimalware software routinely scan these
    attachments, it is difficult to tell when or if a particular one contains malware.


    Mail clients contribute to the problem by making it easy to click on attachments
    to open them (a convenience but also a weakness) and allowing the displayed file
    name to be chosen by the sender so that, say, an executable file can be made to
    look like a text document. Email messages can also contain links that can be clicked
    within the mail client allowing the email recipient to be directed anywhere and,
    again, the apparent destination of the link text need not be where the link actually
    points.


    The entire email system contains no checks on the content of messages or even
    on the identity of senders. It is straightforward to create a false From: address
    to conceal the real identity of the sender. Malicious emails do not trivially
    reveal who sent them.


    Email messages keep track of which systems they have passed through, although
    this information is not usually visible in the email headers without special effort.
    This has some advantages: it allows spoofed senders to be tracked back to a system
    (close to) to where the message originated. However, it also impacts the privacy
    of ordinary senders who might not want it known where they are posting from.


    It is convenient to be able to send emails from somewhere other than your home
    location, for example, at hotels, or on planes and trains. Email servers were
    often configured to allow anyone connected to them to send emails, an approach
    called an open relay. Sadly spammers started using these systems to send large
    amounts of spam. Increasingly, to send email you must first connect to your home
    system or otherwise authenticate yourself to your own local email server.


    There is no flow control in email systems so it is possible to overwhelm a particular
    system just by sending it a lot of email in a short period of time. Email communication
    is not synchronous, so emails can pile up at a destination server waiting for
    someone to download them to a client. This storage of data can easily use up large
    amounts of space and accidentally or deliberately cripple an email server.


    Email is a best-effort communication mechanism. Some email systems provide a way
    to notify the sender that a particular message has been read, but this is so often
    misused—for example, by spammers to determine if a particular email address is
    live—that most users turns it off even on systems that provide the functionality.
    However, most people assume that email is reliable, and this can sometimes lead
    to problems and miscommunications.


    # [7.2Web traffic](#contents.xhtml#sec7_2)


    The World Wide Web is the way that most people interact with cyberspace. It is
    therefore a major target for malicious activity.


    The Web started as an information delivery platform. Using a browser, anyone could
    enter a URL, and get a web page of content. Web pages contain links so that a
    user can move from one page to a related one by clicking on the link. Web search
    engines make it possible to use search terms to get a list of ranked relevant
    pages when URLs are not known.


    The application-level protocol used for Web traffic is the *Hypertext Transfer
    Protocol* (HTTP) (HTTP) which defines how browsers and web servers interact. Web
    traffic uses port 80, that is, browsers send requests to web servers using the
    destination IP address and port 80, and get results back via the same port number.
    Because web access is so ubiquitous, almost all systems allow access to this port,
    that is, firewalls hardly ever block it. HTTP


    Increasingly, HTTP has been replaced by HTTPS (HTTP Secure), a version of the
    protocol that encrypts the traffic in both directions between a browser and a
    web site. This protects the content but not, of course, the URLs being visited.
    Using HTTPS requires web sites to set up the machinery for public-key encryption,
    which has overheads and can be too complex for the web sites of smaller or less-sophisticated
    organizations. As a result, HTTPS is still not widely used, although it has become
    common for the largest and most popular web servers. Some browser developers have
    tried to put pressure on for wider adoption of HTTPS, by threatening to require
    it, but so far this has not been successful. HTTPS traffic uses port 443, instead
    of port 80, so this port is almost inevitably also left open by firewalls.


    The browser-server interface was designed to do something relatively benign and
    straightforward (move web pages from servers to browsers) but the interface now
    has much greater functionality: browsers can send content to web servers, and
    web servers can send code to browsers which is executed by the browser, and so
    local to the user. This allows users to play games or view video in their browsers.
    This new functionality resulted in changes in the definition of the HTTP protocol
    not all of which were well thought out or designed, and for which (as usual) convenience
    trumped security.'
