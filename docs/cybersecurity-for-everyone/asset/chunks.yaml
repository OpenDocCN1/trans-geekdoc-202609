- raw: 'A breach of the system might allow all of the hashed versions to be taken,
    but because of the properties of digital hashes there is no straightforward way
    to map these back to the passwords that generated them. Sadly, there is a way,
    although a more expensive way, to work out what the passwords were. There are
    only a few standard algorithms to do the digital hashing necessary to create the
    hashed passwords, so an attacker can start by applying one of these algorithms
    to “a”, then to “b”, and so on using longer and longer words. Eventually, a word
    will appear that maps to the known hash and this must be the password.


    That''s why the advice for passwords is to make them long (because many possible
    text strings must be tried before the right one is found) and contain unusual
    characters (because this increases the variety of text strings that must be checked).
    It doesn''t take much sophistication by an attacker to try common password choices
    first, and then words from a dictionary, and then dates, before resorting to a
    brute force search. That''s why the common advice is to create passwords that
    are not in these predictable categories. Note that an attacker can precompute
    the hashes of all of the potential words shorter than a certain length, so the
    incremental cost to break into a new account is very small.


    There is therefore an arms race between the increasing computational power of
    attackers and the consequent requirement for increasing complexity of passwords.
    At present, increasing computational power is helping attackers, while the demands
    of remembering ever more obscure passwords works against ordinary users. This
    is compounded because many users have passwords to several sites, perhaps even
    hundreds, and it''s implausible to remember them all. Unsurprisingly, users resort
    to using the same passwords for many sites, to using short passwords, or to writing
    them down in places where others have access to them. Using passwords as an authentication
    mechanism is an approach that is close to failure because of the mismatch between
    the need for complex passwords and the cognitive demands it puts on users, even
    with assistants such as password managers.


    Some social media businesses are trying to become authentication intermediaries.
    Many sites allow you to log in using your social media credentials. However, this
    is far from disinterested. For these social media sites this becomes one more
    way in which they can track you as you visit other sites on the Internet.


    Many businesses try to make authentication by something you know stronger by including
    questions to which only you (in theory) know the answer. At first, these were
    questions such as your mother''s maiden name, but in an online world this is often
    easy to discover. A wider range of questions is typically used now but users have
    to decide whether to use the correct answers, which makes them more guessable,
    or use fictitious answers, which even they may not remember.


    *Secret sharing* is a development of something you know. Here both you and the
    system to which you authenticate know *different* pieces of information, which
    must be put together to create the “something you know” that allows authentication.
    As a trivial example, the system could generate a random value between -90 and
    +90, your secret is a letter of the alphabet, and the correct response is to name
    a city at the latitude given by the random value that contains your letter of
    the alphabet in its name.


    ## Something you have


    This approach requires a user to have and/or present some object in order to authenticate.
    There is a considerable range of such devices, with varying levels of sophistication.


    Our physical keys are a simple example. Having the key is the only authentication
    you need to be able to unlock and access a real-world door or container.


    You can think of a credit card which you can use to pay by tapping as another
    simple form of authentication by something you have. You authenticate yourself
    as someone allowed to run up a bill on the card simply because you have it (which
    is why you can''t run up a *big* bill)


    Another large set of examples are the keyless devices that are commonly used for
    vehicles and doors. When these are close enough to a reader, the reader allows
    access to the relevant system. A reader might be attached to a computer system,
    perhaps in a USB slot, and the system will allow access as long as the device
    is close enough. Since phones are ubiquitous in much of the world, phones themselves
    can play the role of keyless access devices for other computers, or for physical
    access.


    More sophisticated devices, often called security dongles, can be plugged into
    a USB slot and can be interrogated by different kinds of software to authenticate
    not just use of the computer but even of particular pieces of software on that
    computer. The dongle acts as a physical licence to allow access to the software.
    For example, it may contain a licence code for the software and a unique identification
    number so that accesses can be tracked.


    Because the pathway between dongle and software can be attacked, or the dongle
    itself can be replicated, in software or hardware, dongles often contain a secure
    processor and encrypt the communication between software and dongle, even though
    this communication is only happening within a single system.


    Authentication using something you have becomes more problematic when the authentication
    is to a remote system. This requires setting up a secure path from the reader
    to the remote system, which can be done, but care is required.


    The other risk for using something you have as an authentication mechanism is
    that you can lose it or leave it at home, and so be locked out of whatever it
    authenticates; and it can be stolen and used by someone to masquerade as you.


    These devices can also be given or lent to someone else who then has all of the
    access that goes with the device. This is sometimes convenient, but it also carries
    security risks.


    ## Something you are


    This approach uses properties of your body, *biometrics*, as the authentication
    mechanism, for example, your fingerprints, handprints, earprints, irises, face,
    or voice. At first glance this seems attractive, Because these biometrics are
    always with you, you can''t forget them (something you know) or leave them at
    home (something you have).


    A biometric has to be converted into something that can be stored in a computer
    system and, like passwords, a new presentation of the biometric has to be mapped
    in the same way and the result compared to the previously stored result. This
    stored encoding of the biometric has some of the same problems of stored password
    hashes—they become a target—with the added problem that the mapping isn''t typically
    a digital hash and so may be reversible. Biometric encodings have to be designed
    so that they are invariant to small changes: holding a finger in a slightly different
    position, developing calluses, or growing a beard, say. This means that they are
    doing a rough match, and so this prevents true digital hashing.


    Biometric authentication systems have two underappreciated but serious drawbacks.
    The first drawback is that they are often relatively easy to spoof. Fingerprints
    began to be used to identify criminals at the beginning of the 20th Century, and
    the ease with which they could be faked was first pointed out within a few years
    in the detective novel, *The Red Thumb Mark* (1909). In some systems, even today,
    putting plastic film over a fingerprint reader, and the pressing down on it causes
    it to register the most recent real fingerprint. Irises can be spoofed from a
    high-quality picture of someone''s eye provided that it is placed behind a hole
    in a white sheet of paper. Face recognition is not very accurate to begin with,
    but can be spoofed by a mask derived from a photo. Voice recognition is also not
    very accurate, and changes for the same individual when they have a cold or allergies.'
