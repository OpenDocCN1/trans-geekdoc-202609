- raw: 'Encryption is designed to make it impossible in practice to decrypt data without
    knowing the appropriate key. This has not always been true even in systems where
    there are (supposed) proofs of the difficulty of decryption without knowing the
    key. There have been examples of government signals intelligence lobbying for
    encryption schemes that have known but subtle flaws so that brute force attacks
    can be used without knowledge of the key and decrypt in reasonable amounts of
    time.


    The implementations of encryption systems that are theoretically expensive to
    decrypt can introduce shortcuts unintentionally, making them vulnerable in practice.
    And people can be careless with their keys, leaving them on their systems where
    they can be stolen.


    There is regular discussion by government and law enforcement going like this:
    “Encryption provides an opportunity for malefactors to conceal their communications
    with one another. Therefore, encryption systems should be provided with backdoors
    that allow law enforcement to decrypt such communications (with some judicial
    oversight)”. These backdoors are basically the decryption keys.


    You can see now that it isn''t possible to have a backdoor and at the same time
    maintain the strength of the front door. The only way to decrypt messages in a
    well-designed encryption system is to use the decryption key. For law enforcement
    to create their backdoor they would have to insist that they hold a copy of everyone''s
    decryption keys. These keys would become one of the highest value targets on the
    planet since getting hold of them would make huge amounts of data available in
    their unencrypted forms. The vault in which they were stored would have to be
    protected accordingly, not just from outside attackers, but from insiders who
    might be suborned, or find it irresistible to decrypt the emails or health test
    results of their favorite celebrities. The amount of trust in government technical
    abilities to protect these keys, and their unwillingness to use them except as
    legally enabled is far beyond that of any country''s citizens.


    So content can be protected cryptographically for everybody, or for nobody, but
    it''s not possible to protect only good communication while allowing bad communication
    to be read by law enforcement or intelligence. There is no middle ground.


    This is also another place where the global reach of the Internet clashes with
    the wishes of national governments to hold copies of keys. There''s almost nothing
    to prevent individuals, let alone multinational businesses, from getting their
    encryption keys in another jurisdiction; and it''s hard for a government to demonstrate
    that they have done so. Proposals to hold decryption keys in some kind of escrow
    founder for these two practical but unavoidable reasons. Unlike most other aspects
    of our lives, our cyberspace existence is much less constrained by national borders.
    This will be an ongoing theme.


    Unfortunately, encryption can conceal the *content* of communication, but it cannot
    conceal the *fact* of that communication because it has to be possible for untrustworthy
    intermediaries to deliver each piece of data. This creates another kind of vulnerability,
    not as critical but potentially important.


    At the very beginning of the 20th Century, the British Empire developed the *All
    Red Line*, a telegraph network that passed only through territory that the British
    controlled precisely to prevent interception. The equivalent cannot be done in
    cyberspace because the endpoints of a communication cannot control the path that
    it takes. Thus an adversary can, in principle, keep track of how much data is
    flowing between two endpoints, and how often, even if the content itself is encrypted.
    This is called *traffic analysis* and can be very revealing, especially if the
    endpoints do not take it into account


    As we shall see, encryption plays an important role in defending cyberspace but
    there are still plenty of ways of subverting it.


    # [Chapter 4](#contents.xhtml#chapter4)


    # [Node security](#contents.xhtml#chapter4)


    As we have seen, the nodes in cyberspace consist of both computers and, in a sense,
    of people. It''s useful to divide up the computers in cyberspace into several
    categories.


    First, are the computers (and phones) that we use to interact with online information,
    and to communicate with one another. We might call these *edge nodes*.


    Second, there are the computers, usually much bigger and more powerful, that are
    used by organizations to run their businesses. These include back-end processing
    such as keeping track of your money, running automated factories, planning how
    and when to resupply retail stores, and carrying out data analytics to understand
    complex systems. Some of these computers are implicitly visible to ordinary users,
    for example, the web servers that provide web pages to your browser, or travel
    reservation sites, but many are less visible.


    Third, there are *clouds*, large groups of computers working together and available
    to businesses to use instead of owning and managing their own computational resources.
    The important different between clouds and other computational resources is that
    clouds are designed to be *shared* which creates new security issues.


    Fourth, there are devices that contain Internet-connected computers but which
    do not have a directly usable interference, *Internet of Things* devices. These
    are mostly sensors or actuators, for example, smart thermostats, surveillance
    cameras, smart lightbulbs, or earbuds. Some work almost completely autonomously
    but most are controlled remotely from somewhere else on the Internet. For example,
    electrical transformer switches are controlled remotely from a control room; a
    smart lightbulb is controlled from an app on someone''s phone.


    Although it''s natural to consider nodes as *computing* resources, there are also
    nodes whose primary purpose is to store data and provide it when asked. These
    may be specialized (for example, a database server) or special forms of data clouds.


    There are estimated to be well more than 20 billion Internet-connected devices,
    so there are far more nodes than people.


    # [4.1Getting access to nodes](#contents.xhtml#sec4_1)


    One of the first issues of security for nodes is who is allowed to access them.
    We all have experience of this with edge nodes—our personal computers and phones
    are protected so that only we can access them using mechanisms such as passwords
    or biometrics. One of the biggest security weaknesses in cybersecurity is that
    the mechanism for getting legitimate access to a node—*authentication*—is weak,
    and often, for Internet of Things (IoT) devices, extremely weak.


    We can divide authentication mechanisms into three kinds: something you know,
    something you have, or something you are.


    ## Something you know


    The most common example of something you know is a *password*. You know it, the
    system you''re using it to authenticate with knows it (in some form), but nobody
    else is supposed to know it.


    The system that you''re authenticating with should not store your password in
    its plaintext version, because then anyone who managed to breach the system would
    gain access to all of its accounts. To avoid this, passwords are stored in digitally
    hashed form. When you enter your password, the text you entered is immediately
    hashed using the same mapping and the result compared with the stored version.
    If they match, you are authenticated.'
