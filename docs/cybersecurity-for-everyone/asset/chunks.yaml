- raw: "Switches have the same vulnerabilities as any other nodes. In particular,\
    \ they must be able to install updates, and so they have their own connection\
    \ to the outside world—and a management account that allows them to be accessed\
    \ remotely, even though their normal operation doesn't require a human operator.\
    \ Such an account has to be one with high privilege because the entire switch\
    \ environment has to be able to be manipulated remotely—many switches are in places\
    \ where direct access to them is difficult or impossible. This means that switches\
    \ can be manipulated maliciously from anywhere else on the Internet—changing their\
    \ configurations, or even causing them to turn off.\n\nSwitches are also a vulnerability\
    \ because, of necessity, they see all traffic that flows through them. If they\
    \ can be corrupted, then the data for traffic analysis can be collected without\
    \ having to attack pipes.\n\nSwitches are also vulnerable to physical attack because\
    \ they are often physically and geographically isolated. It is possible to physically\
    \ access many switches and simply remove or destroy them. Their environments can\
    \ also be altered, say by heating them beyond their thermal rating, and so prevent\
    \ them from operating.\n\n# [6.4Mounting an attack](#contents.xhtml#sec6_4)\n\n\
    We have seen that some attacks are easy to mount because they rely on the unwitting\
    \ collaboration of a user on the system to be attacked (especially phishing and\
    \ spearphishing). Such attacks can also be a stepping stone to attacks on other\
    \ systems.\n\nAttacks that cannot rely on users helping them must take a different\
    \ approach. Although it's possible that such attacks are aimed at targets of opportunity,\
    \ they are more often targeted at a particular computer belonging to a particular\
    \ organization. For example, sensitive data that an attacker might want to exfiltrate\
    \ might be stored in a contracts database. The target computer may be deep within\
    \ the network environment of that organization. protected by multiple layers of\
    \ firewalls and perhaps an intrusion detection system.\n\nAn attack like this\
    \ usually requires a strategic approach that involves the following steps:\n\n\
    *   *Surveillance*. There is no straightforward way to identify the particular\
    \ computer target. Computers that are not Internet-facing do not have names that\
    \ are spread to DNS servers, so it is difficult to find IP addresses, and even\
    \ these only reveal the subnetwork where the computer is present, not how to get\
    \ to it.\n\n    An attack may have to work its way inwards from Internet-facing\
    \ computers to their neighbors internally and then on to the intended target (so\
    \ one attack actually requires multiple other attacks as stepping stones). Obviously,\
    \ the set of stepping stones should pass through the most vulnerable computers,\
    \ perhaps even at the expense of taking a longer path.\n\n    So another facet\
    \ of surveillance is identifying computers that might be vulnerable. This is one\
    \ reason why stack fingerprinting is useful—it allows the attacker to identify\
    \ what versions of software are being used by a computer. Knowing a list of vulnerabilities,\
    \ an attacker can assess how easy a target each visible system is\n\n    Surveillance\
    \ may also include looking at the traffic originating from and destined to each\
    \ computer. This may reveal what its purpose is: is it print server? A database\
    \ front end? Many devices that don't look like computers, for example, printers\
    \ or IoT devices, may also be open to attack, and provide a foothold for further\
    \ steps. These devices are fully functional computers even though we tend to be\
    \ blind to this because they appear to have a single function.\n\n    Tools such\
    \ as ping and traceroute can also be used to explore the environment inside an\
    \ organization and try to work out IP addresses and structures. For example, not\
    \ every possible IP address on a subnetwork will necessarily have a device associated\
    \ with it, and there's no point attacking non-existent devices.\n\n    The Time\
    \ to Live feature in ICMP can be used to probe firewalls. If a packet is sent\
    \ with a Time to Live one greater than the number of steps to the firewall, there\
    \ will be no response if the firewall blocked it, but a bounce if it made it through\
    \ the firewall (but then ran out of life). An attacker can use this to see whether\
    \ traffic to a particular address and port combination is allowed through the\
    \ firewall.\n\n    This probing can also provide information about what the destination\
    \ computer is like. For example, if port 80 traffic (used for web browsing) is\
    \ blocked, then it's unlikely that the destination computer has ordinary users.\n\
    \n*   *Attack planning*. Once an attacker has an understanding of the systems\
    \ and networks that lie between the outside world and the target system, an attack\
    \ can be designed. This requires choosing attacks for each system on the required\
    \ path, as well as fallbacks should an attack not work as anticipated. An attacker\
    \ must have a repertoire of attack techniques and tools and an awareness of which\
    \ systems are vulnerable to each.\n\n*   *Actual attack*. The actual attack requires\
    \ carrying out each of the planned steps in sequence, Some phases of the attack\
    \ might involve probing to see whether a particular attack will be successful.\
    \ If not, another approach must be used instead.\n\n    Because an attack usually\
    \ requires a chain of intrusions into nodes along the way, an attacker will usually\
    \ insert mechanisms into systems that have been attacked to allow future access\
    \ without having to use an attack again. These are called *backdoors* and might\
    \ work by creating a new administrative user account, or by reconfiguring an interface\
    \ so that it is less secure, and so it can be used again without effort.\n\n*\
    \   *Cleaning up traces*. All computer systems and switches keep log files that\
    \ record the actions that take place. These can be at all levels of granularity\
    \ from TCP sessions up to commands issued by each logged-on user. The main purpose\
    \ of these log files is to be able to work out what happened when something goes\
    \ wrong with a node or pipe. However, they capture the activities of innocents\
    \ and attackers alike.\n\n    An attacker is therefore motivated to remove log\
    \ files or change them so as to leave no traces, either to conceal that there\
    \ has been an attack or to prevent it being attributed correctly. Removing log\
    \ files leaves no traces of the activity being logged, but the fact that they\
    \ have been deleted is itself suspicious. Altering log files is preferable but\
    \ it requires more sophistication, and it is easy for an attacker to miss a trace\
    \ left in some log file when there are so many of them.\n\n*   *Leaving a backdoor*.\
    \ After all of the effort required for an attacker, it is natural to change the\
    \ target system so that a repeated attack is much easier, if required. We have\
    \ already mentioned leaving systems along the way easier to reuse, but making\
    \ the target system easier to re-attack is more useful. (Of course, altering the\
    \ target system to make this possible risks creating extra traces. So for exfiltration\
    \ and other covert kinds of attacks, it might be more appropriate to leave the\
    \ system looking completely intact.)\n\n# [6.5Defending against attacks](#contents.xhtml#sec6_5)\n\
    \nDefenders could find the traces of an attack in progress, or even one in preparation\
    \ if they looked for them. But the reality is that most systems are under constant\
    \ low-level attack, almost all of which are defeated by firewalls and intrusion\
    \ detection systems. These systems can be configured to set off an alarm to a\
    \ human if an attack looks more powerful than the typical background, but setting\
    \ the threshold for these alarms turns out to be difficult. Set them too high,\
    \ and important attacks are missed; set them too low and there are constant false\
    \ alarms. When there are too many false alarms, humans learn to ignore them. Social\
    \ engineering can be used by attackers to set off alarms deliberately until they\
    \ get ignored; and then the real attack can be carried out."
