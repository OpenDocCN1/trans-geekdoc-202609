- raw: 'Finally, because these long strings of numbers are hard for humans to remember,
    devices can also be represented using *domain names* such as [www.google.com](http://www.google.com).
    These names are also hierarchical but in a different way from IP addresses. They
    describe a hierarchy that is human, national, and organizational. For example,
    names ending in. ca are in Canada, names ending in queensu.ca are associated with
    Queen''s University, and names ending in cs.queensu.ca are associated with the
    School of Computing at Queen''s University. However, names that end in. com (supposed
    to be businesses) or. org (non-profits) do not specify which country they are,
    so even the hierarchical domain name structure is not completely consistent.


    Because these name hierarchies cross-cut the IP address hierarchy, a non-trivial
    mechanism, the Domain Name Service (DNS), is needed to map between human-directed
    names and IP addresses.


    The switches that direct traffic through the pipes are also nodes, ordinary computers
    optimized for the business of moving data around. They therefore have IP addresses,
    and all of the security issues that ordinary nodes have.


    # [2.4People](#contents.xhtml#sec2_4)


    Although they are not, of course, part of cyberspace in a strict sense, people
    play an important role. In particular, as they act in cyberspace they must be
    identifiable in some form.


    For economic transactions in cyberspace, there must be a way for transactions
    to be paid for, so settings like this have the tightest way of identifying which
    particular human is involved. This is usually done by associating a credit card
    with an online presence or account. Because credit card companies already verify
    to whom they issue cards, this ties a particular real-world person to each online
    account.


    Increased online use of credit cards has created new mechanisms to verify that
    the person spending the money is entitled to. In the physical world, possession
    of the credit card and the PIN validates this entitlement. In cyberspace, the
    credit card number is easily disseminated, and the PIN can''t be checked against
    the card directly


    Telephone numbers have also become personal identifiers rather than physical location
    identifiers. The extent to which a phone number is associated with a particular
    person varies from country to country depending how easy it is to buy a SIM card
    without providing government identification. Phone numbers obviously act as a
    way to find a particular person for texting/messaging.


    Email addresses are also used as identifiers, not just as ways to receive information.
    Many web sites ask for an email address as part of their registration process,
    and then check it explicitly by sending an email to that account with the message
    containing the final steps for registering. Single-use email addresses are available
    for those who want to register without revealing any personal details, but some
    web sites check the hosts for such emails and refuse them, so there is a bit of
    an arms race in this area.


    Finally, some online sites use handles (freely chosen names) as identifiers, rather
    than email addresses. Although these are chosen freely, they often contain or
    imply personal information, and even identity.


    We all have an identity in cyberspace, often many identities and so looking out
    from the perspective within cyberspace, we are just another kind of edge device.


    # [2.5Pipes](#contents.xhtml#sec2_5)


    The devices on the Internet are connected by pipes that enable data to move around.
    These range from the huge pipes that move data between and across continents to
    the connection between a phone and a set of wireless earbuds.


    As we have seen from the IP naming scheme, the Internet is organized hierarchically.
    To get from one part of the Internet to another requires pipes, but also switches
    that can take incoming traffic and pass it on in a direction that moves it closer
    to its destination. In other words, if the devices on the Internet are like buildings,
    then the structure that connects them is like the network of roads and intersections.
    Actually, it''s more like a network of railway stations and railway yards because
    data can be held at switches waiting for capacity to send it on its way.


    The top level of the Internet consists of wide pipes that can move a lot of data
    at once, and high-capacity switches that can take each incoming piece of data,
    decide which outgoing connection it should follow to get closer to its destination,
    and place it on that outgoing connection.


    The higher-level switches are connected to one another, but there have also to
    be connections from these switches to lower-level switches, and from these lower-level
    switches further down, and so on to the local level. In other words, the switch
    for a region at any scale must connect all of the nodes in that region, but also
    have a connection (perhaps several) to higher-level switches.


    Devices can play a dual role. For example, your phone acts as an edge device when
    it receives an email sent to you, but acts as a switch when it streams music from
    the Internet to your earbuds (and these earbuds become the edge device).


    # [2.6Configuration](#contents.xhtml#sec2_6)


    The nodes and pipes are the bare physical structure of cyberspace, but actually
    using it to move and store data requires some extra structure, the rules that
    make it work, and mechanisms to allow nodes and pipes to join and leave.


    Each path through the network must carry data between its ends. To do this there
    must be agreements that the nodes at the ends understand and use. These correspond
    to the rules of road with the edges corresponding to roads and highways.


    These agreements about how traffic will move over each edge are called *protocols*.
    Unlike a highway, where individual drivers can make rational decisions in response
    to traffic conditions, traffic through pipes is just data, so all of the management
    must be done by the nodes at the ends. Once the traffic is launched into a pipe,
    it will arrive at the other end after a predictable amount of time (or perhaps
    not, if the pipe is cut by a backhoe).


    It is unlikely that the destination node for a particular data transfer is directly
    connected to the node where it originates. Nodes and switches, collectively, must
    be able to route traffic over a sequence of edges from its starting point to its
    destination. Any switch must be able to receive incoming traffic, and determine
    which outgoing pipe it should use to move that traffic closer to its destination.
    To do this it maintains a *routing table* which contains entries that map destinations
    to appropriate outgoing edges. This is a bit like asking for directions when driving
    and being told “take the next right and go on for 10 miles, then ask again”.


    Because of the hierarchical structure of IP addresses the routing table doesn''t
    have to have an entry for every possible destination. For remote destinations
    it''s enough to know which way to send IP addresses that begin with, say, 173.
    The routing table will contain more detail about IP addresses that are physically
    closer, and complete addresses for the devices that are directly connected to
    it.


    A sending node must also be aware that the receiving node at the other end of
    the pipe might not always have enough capacity to store and process the incoming
    traffic, There must be a way of agreeing about the rates at which data is sent.
    Sometimes this is done by an agreement in advance about how much traffic will
    be sent and how quickly. Sometimes it is done by having receivers acknowledge
    that they have received each chunk of data from senders, implicitly giving them
    permission to send the next chunk. Of course, this means that there is extra traffic
    on the edges, traffic which exists to control the operation of the network itself.'
  fmt: '

    # 2.4 People


    虽然人严格来说不属于网络空间的一部分，但他们扮演着重要角色。特别是，当他们在网络空间中行动时，必须以某种形式被识别。


    对于网络空间中的经济交易，必须有支付交易的方式，因此此类场景对识别具体涉及哪个人有最严格的要求。这通常通过将信用卡与在线身份或账户关联来完成。因为信用卡公司已经验证发卡对象，这将特定的现实世界中的人与每个在线账户联系起来。


    信用卡在线使用的增加催生了新机制，以验证花钱的人是否有权这样做。在物理世界中，持有信用卡和 PIN 码可验证这种权利。在网络空间中，信用卡号容易泄露，且无法直接对照卡片核对
    PIN 码。


    电话号码也已成为个人标识符，而非物理位置标识符。电话号码与特定个人关联的程度因国家而异，取决于在不提供政府身份证明的情况下购买 SIM 卡有多容易。电话号码显然可作为寻找特定个人进行短信/消息联系的方式。


    电子邮件地址也被用作标识符，而不仅仅是接收信息的方式。许多网站在注册过程中要求提供电子邮件地址，然后通过向该账户发送包含注册最后步骤的邮件来显式验证。一次性电子邮件地址可供那些想注册又不透露个人详细信息的人使用，但一些网站会检查此类邮件的主机并拒绝它们，因此这方面存在一点“军备竞赛”。


    最后，一些在线网站使用 handle（自由选择的名称）作为标识符，而不是电子邮件地址。虽然这些名称是自由选择的，但它们往往包含或暗示个人信息，甚至身份。


    我们都在网络空间中拥有身份，通常是多重身份，因此从网络空间内部的视角看，我们只是另一种边缘设备。


    # 2.5 Pipes


    互联网上的设备通过管道连接，使数据能够四处移动。这些管道从跨洲际移动大量数据的巨型管道，到手机与一组无线耳机之间的连接，范围广泛。


    正如我们从 IP 命名方案中看到的，互联网是分层组织的。要从互联网的一个部分到达另一个部分需要管道，还需要交换机来接收传入流量并将其向更接近目的地的方向转发。换句话说，如果互联网上的设备像建筑物，那么连接它们的结构就像道路和十字路口的网络。实际上，它更像火车站和调车场的网络，因为数据可以在交换机处暂存，等待容量将其发送出去。


    互联网的顶层由可一次性移动大量数据的宽管道和大容量交换机组成，这些交换机能接收每个传入数据片段，决定其应遵循哪条传出连接以更接近目的地，并将其放置在该传出连接上。


    高层交换机相互连接，但也必须有从这些交换机到低层交换机的连接，从低层交换机进一步向下连接，以此类推直到本地层级。换句话说，任何规模的区域交换机必须连接该区域内的所有节点，同时也要有连接（可能是多个）到更高层级的交换机。


    设备可以扮演双重角色。例如，你的手机在接收发给你的邮件时充当边缘设备，但在从互联网向耳机流式传输音乐时充当交换机（此时耳机成为边缘设备）。


    # 2.6 Configuration


    节点和管道是网络空间的基本物理结构，但实际使用它们来移动和存储数据需要一些额外的结构：使其工作的规则，以及允许节点和管道加入和离开的机制。


    网络中的每条路径必须在其两端之间传输数据。为此，两端的节点必须理解并使用协议。这些协议对应于道路规则，其中边对应道路和高速公路。


    关于流量将如何在每条边上移动的协议称为*protocols*。与高速公路上个体驾驶员可根据路况做出理性决策不同，管道中的流量只是数据，因此所有管理必须由两端的节点完成。一旦流量进入管道，它将在可预测的时间后到达另一端（如果管道被挖掘机切断，则可能无法到达）。


    特定数据传输的目标节点不太可能直接连接到源节点。节点和交换机（统称）必须能够通过一系列边从起点将流量路由到目的地。任何交换机都必须能够接收传入流量，并确定应使用哪条传出管道将该流量移至更接近目的地的位置。为此，它维护一个*routing
    table*，其中包含将目的地映射到适当传出边的条目。这有点像开车问路，被告知“向右转行驶 10 英里，然后再问一次”。


    由于 IP 地址的层级结构，路由表不必为每个可能的目的地都有条目。对于远程目的地，只需知道将以特定前缀（如 `173.`）开头的 IP 地址发向哪个方向即可。路由表将包含物理位置较近的
    IP 地址的更多细节，以及直接连接到它的设备的完整地址。


    发送节点还必须意识到，管道另一端的接收节点可能并不总有足够的容量来存储和处理传入流量。必须有商定数据发送速率的方式。有时这是通过预先协议约定发送多少流量以及多快来完成。有时是通过让接收方确认已收到发送方的每个数据块，从而隐式地允许发送方发送下一个数据块。当然，这意味着边上存在额外流量，这些流量用于控制网络本身的运行。

    '
